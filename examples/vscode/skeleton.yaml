# Shared skeleton for the VS Code ontology built directly from code (1.144.0, 2c33b50b16).
# It holds external actors, the processes, the area modules inside them, shared datastores,
# and the shared-state anchors fixtures seed. Area agents model internals as children
# (parent: <id here>). attributes.owner names the area that models each component.
#
# Processes and instances (DESIGN §11.1): workbench-window and extension-host are instance
# groups (w1, w2 ...; eh1 serves w1). Everything under workbench-window runs per window, so its
# state is per window (`text-file-models@w1`). main-process, pty-host, shared-process,
# agent-host and remote-server are single instances.
schema_version: 1
id: vscode
name: Visual Studio Code 1.144 (built from code)
description: >-
  VS Code modelled directly from its source at 1.144.0 by area agents, as the front-end
  benchmark of mosaic's code-to-ontology pipeline.
source:
  repo: microsoft/vscode
  sha: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf

components:
  # External actors
  - {id: user, name: User, kind: client, layer: actors, summary: "A person using the editor: keys, mouse, menus and the command palette.", attributes: {owner: workbench-shell}}
  - {id: third-party-extension, name: Third-party extension, kind: client, layer: actors, summary: "Extension code calling the vscode API from an extension host.", attributes: {owner: exthost}}
  - {id: os-shell, name: OS shell, kind: client, layer: actors, summary: "The operating system launching code (CLI, protocol links, file associations).", attributes: {owner: main-process}}

  # Processes
  - {id: main-process, name: Electron main process, kind: service, layer: process, sources: [src/vs/code/electron-main/main.ts], summary: "App lifecycle, windows, native host, update and backups.", attributes: {owner: main-process}}
  - {id: workbench-window, name: Workbench window, kind: service, layer: process, sources: [src/vs/workbench/workbench.desktop.main.ts], summary: "A renderer process running the workbench for one window (instances w1, w2 ...).", attributes: {owner: workbench-shell}}
  - {id: extension-host, name: Extension host, kind: service, layer: process, sources: [src/vs/workbench/api/node/extensionHostProcess.ts], summary: "A process running extensions for one window (eh1 serves w1).", attributes: {owner: exthost}}
  - {id: pty-host, name: Pty host, kind: service, layer: process, sources: [src/vs/platform/terminal/node/ptyHostMain.ts], summary: "Utility process owning terminal pseudo-terminals.", attributes: {owner: terminal-debug-tasks}}
  - {id: shared-process, name: Shared process, kind: service, layer: process, sources: [src/vs/code/electron-utility/sharedProcess/sharedProcessMain.ts], summary: "Utility process for extension management, sync and other shared services.", attributes: {owner: remote-server}}
  - {id: agent-host, name: Agent host, kind: service, layer: process, sources: [src/vs/platform/agentHost/node/agentHostMain.ts], summary: "Process hosting agent sessions.", attributes: {owner: agents}}
  - {id: remote-server-process, name: Remote server, kind: service, layer: process, sources: [src/vs/server/node/server.main.ts], summary: "The server for remote, SSH, container and web workbenches.", attributes: {owner: remote-server}}
  - {id: code-cli, name: code CLI, kind: client, layer: process, sources: [cli/src/bin/code/main.rs], summary: "The Rust command-line interface and tunnel launcher.", attributes: {owner: remote-server}}

  # Area modules inside the window (per-window instances)
  - {id: platform, name: Platform services, kind: module, layer: platform, parent: workbench-window, sources: [src/vs/platform/instantiation/common/instantiation.ts], summary: "Dependency injection, configuration, storage, files, commands, keybindings, context keys and dialogs.", attributes: {owner: platform-core}}
  - {id: editor, name: Code editor, kind: module, layer: editor, parent: workbench-window, sources: [src/vs/editor/editor.main.ts], summary: "The Monaco editor: text model, view, cursor and language features.", attributes: {owner: editor}}
  - {id: workbench, name: Workbench, kind: module, layer: workbench, parent: workbench-window, sources: [src/vs/workbench/browser/workbench.ts], summary: "Layout, parts, editors, views and the workbench contributions.", attributes: {owner: workbench-shell}}
  - {id: exthost-bridge, name: Extension host bridge, kind: module, layer: extensions, parent: workbench-window, sources: [src/vs/workbench/services/extensions/common/abstractExtensionService.ts], summary: "Renderer side of the extension host: the extension service and MainThread* customers.", attributes: {owner: exthost}}
  - {id: agents, name: Agents and sessions, kind: module, layer: ai, parent: workbench-window, sources: [src/vs/sessions/sessions.desktop.main.ts], summary: "Agent sessions and MCP integration on the renderer side.", attributes: {owner: agents}}
  - {id: remote, name: Remote and extension management, kind: module, layer: remote, parent: workbench-window, sources: [src/vs/workbench/contrib/remote/browser/remote.contribution.ts], summary: "Remote connections, extension management and settings sync on the renderer side.", attributes: {owner: remote-server}}

  # Area modules inside the extension host (per-host instances)
  - {id: exthost-runtime, name: Extension host runtime, kind: module, layer: extensions, parent: extension-host, sources: [src/vs/workbench/api/common/extHostExtensionService.ts], summary: "ExtHost* services and the vscode API implementation.", attributes: {owner: exthost}}
  - {id: builtin-extensions, name: Built-in extensions, kind: module, layer: extensions, parent: extension-host, sources: [extensions/git/package.json], summary: "Extensions shipped with VS Code (git, TypeScript, Markdown ...).", attributes: {owner: builtin-extensions}}

  # Shared-state anchors that fixtures seed (owners define their interfaces)
  - id: workspace-context
    name: Workspace context
    kind: module
    layer: workbench
    parent: workbench
    sources: [src/vs/platform/workspace/common/workspace.ts]
    summary: "The opened workspace: folders, trust and remote authority."
    attributes: {owner: workbench-shell}
    state:
      schema: {type: object, properties: {folders: {type: array, items: {type: string}}, trusted: {type: boolean}, remote_authority: {type: string}}}
      initial: {folders: [], trusted: false}
  - id: text-file-models
    name: Text file models
    kind: module
    layer: workbench
    parent: workbench
    sources: [src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts]
    summary: "Open text file models by URI: content, version, dirty state, language."
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {models: {type: object}}}
      initial: {models: {}}
  - id: editor-groups
    name: Editor groups
    kind: module
    layer: workbench
    parent: workbench
    sources: [src/vs/workbench/services/editor/common/editorGroupsService.ts]
    summary: "Editor groups and the editors open in each."
    attributes: {owner: workbench-shell}
    state:
      schema: {type: object, properties: {groups: {type: array}, active_group: {type: integer}}}
      initial: {groups: [{id: 1, editors: [], active: null}], active_group: 1}
  - id: extension-registry
    name: Extension registry
    kind: module
    layer: extensions
    parent: exthost-bridge
    sources: [src/vs/workbench/services/extensions/common/extensionDescriptionRegistry.ts]
    summary: "Known extensions with their activation events, and which are activated."
    attributes: {owner: exthost}
    state:
      schema: {type: object, properties: {extensions: {type: object}, activated: {type: array}}}
      initial: {extensions: {}, activated: []}

  # Shared datastores
  - {id: disk, name: Local disk, kind: datastore, layer: storage, summary: "Files on the local file system, by URI.", attributes: {owner: shared}, state: {schema: {type: object, properties: {files: {type: object}}}, initial: {files: {}}}}
  - {id: settings-store, name: Settings files, kind: datastore, layer: storage, summary: "settings.json for the user, the workspace and folders.", attributes: {owner: shared}, state: {schema: {type: object}, initial: {user: {}, workspace: {}}}}
  - {id: storage-db, name: State database, kind: datastore, layer: storage, summary: "Global and workspace state (state.vscdb).", attributes: {owner: shared}, state: {schema: {type: object}, initial: {global: {}, workspace: {}}}}

  # External systems
  - {id: language-model-endpoint, name: Language model endpoint, kind: external, layer: external, summary: "A remote model API used by chat and agents.", attributes: {owner: chat}}
  - {id: marketplace, name: Extension marketplace, kind: external, layer: external, summary: "The extension gallery service.", attributes: {owner: remote-server}}
  - {id: debug-adapter, name: Debug adapter, kind: external, layer: external, summary: "A debug adapter process speaking DAP.", attributes: {owner: terminal-debug-tasks}}
  - {id: language-server, name: Language server, kind: external, layer: external, summary: "A language server or tsserver process run by an extension.", attributes: {owner: builtin-extensions}}
  - {id: mcp-server, name: MCP server, kind: external, layer: external, summary: "A Model Context Protocol server.", attributes: {owner: agents}}
  - {id: git-binary, name: git, kind: external, layer: external, summary: "The git executable run by the git extension.", attributes: {owner: builtin-extensions}}

# Shared schemas (the owner area defines the behavior that uses them; callers reference by id)
schemas:
  - id: FilesSaveOptions
    schema:
      type: object
      properties:
        reason: {type: string, enum: [explicit, auto, focus-change, window-change], examples: [explicit]}
        force: {type: boolean}
        skip_save_participants: {type: boolean}
        ignore_modified_since: {type: boolean}
        write_unlock: {type: boolean}
        write_elevated: {type: boolean}
  - id: EditorTextEdit
    schema:
      type: object
      required: [range, text]
      properties:
        range:
          type: object
          properties:
            start_line: {type: integer, minimum: 1}
            start_column: {type: integer, minimum: 1}
            end_line: {type: integer, minimum: 1}
            end_column: {type: integer, minimum: 1}
        text: {type: string}
  - id: ExthostExtensionDescription
    schema:
      type: object
      required: [identifier]
      properties:
        identifier: {type: string, examples: [vscode.typescript-language-features]}
        activation_events: {type: array, items: {type: string}}
        main: {type: string}
        browser: {type: string}
        capabilities: {type: object}
