flows:
  - {id: rs-ext-install, name: "Install an extension by id (workbench.extensions.installExtension)", tags: [writes], entry: {caller: user, interface: extensions-contribution-commands.cmd-workbench-extensions-installextension}, sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:437"]}
  - {id: rs-ext-query-installed, name: "List installed extensions (queryLocal)", entry: {caller: workbench, interface: extensions-workbench-service.query-local}, sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1412"]}
  - {id: rs-ext-uninstall, name: "Uninstall an extension (workbench.extensions.uninstallExtension)", tags: [writes], entry: {caller: user, interface: extensions-contribution-commands.cmd-workbench-extensions-uninstallextension}, sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:533"]}
  - {id: rs-ext-channel-install, name: "installFromGallery over the 'extensions' channel (any client: window, remote CLI, sync)", tags: [writes], entry: {caller: workbench, interface: extension-management-channel.install-from-gallery}, sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:137"]}
  - {id: rs-ext-auto-update, name: "Periodic update check and auto update", tags: [writes], entry: {caller: workbench, interface: extensions-workbench-service.initialize-auto-update}, sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1134"]}
  - {id: rs-ext-disable-globally, name: "Disable an extension globally", tags: [writes], entry: {caller: workbench, interface: global-extension-enablement-service.disable-extension}, sources: ["src/vs/platform/extensionManagement/common/extensionEnablementService.ts:43"]}
  - {id: rs-ext-enable-globally, name: "Enable a globally disabled extension", tags: [writes], entry: {caller: workbench, interface: global-extension-enablement-service.enable-extension}, sources: ["src/vs/platform/extensionManagement/common/extensionEnablementService.ts:35"]}
  - {id: rs-ext-get-disabled, name: "Read the globally disabled extensions", entry: {caller: workbench, interface: global-extension-enablement-service.get-disabled-extensions}, sources: ["src/vs/platform/extensionManagement/common/extensionEnablementService.ts:51"]}
  - {id: rs-ext-search, name: "workbench.extensions.search", entry: {caller: user, interface: extensions-contribution-commands.cmd-workbench-extensions-search}}
  - {id: rs-ext-manage, name: "_extensions.manage", entry: {caller: user, interface: extensions-contribution-commands.cmd-extensions-manage}}
  - {id: rs-ext-open, name: "extension.open", entry: {caller: user, interface: extensions-contribution-commands.cmd-extension-open}}
  - {id: rs-ext-gallery-sign-in, name: "workbench.extensions.actions.gallery.signIn", entry: {caller: user, interface: extensions-contribution-commands.cmd-workbench-extensions-actions-gallery-signin}}
  - {id: rs-ext-show-for-language, name: "workbench.extensions.action.showExtensionsForLanguage", entry: {caller: user, interface: extensions-actions-commands.cmd-workbench-extensions-action-showextensionsforlanguage}}
  - {id: rs-ext-show-with-ids, name: "workbench.extensions.action.showExtensionsWithIds", entry: {caller: user, interface: extensions-actions-commands.cmd-workbench-extensions-action-showextensionswithids}}

scenarios:
  - id: remote-server-ext-install-oss-no-gallery
    flow: rs-ext-install
    description: "Deployed OSS product.json has no extensionsGallery: the gallery query throws before any install."
    fixtures: [one-window-folder]
    input: {arg: ms-python.python}
    expect:
      - "!result.ok && result.error.code == 'no-extension-gallery-service-configured'"
      - "calls['node-extension-management-service.install-from-gallery'] == 0"
      - "size(state['extensions-profile-scanner-service'].profile_extensions) == 0"
  - id: remote-server-ext-install-happy-then-list
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    steps:
      - {flow: rs-ext-install, as: inst, input: {arg: ms-python.python}}
      - {flow: rs-ext-query-installed, as: list}
    expect:
      - "steps.inst.result.ok && steps.inst.result.value.version == '2026.18.0'"
      - "steps.list.result.value.user.exists(e, e.id == 'ms-python.python' && e.source == 'gallery' && !e.pinned)"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].operation == 'install'"
      - "calls['extension-signature-verification-service.verify'] == 1"
  - id: remote-server-ext-install-builtin-not-found
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    input: {arg: vscode.typescript-language-features}
    expect:
      - "!result.ok && result.error.code == 'not-found'"
      - "calls['extension-gallery-service.get-extensions'] == 0"
  - id: remote-server-ext-install-builtin-auto-updatable
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-builtin-extensions-enabled-with-auto-updates: [vscode.typescript-language-features]}
    input: {arg: vscode.typescript-language-features}
    expect:
      - "result.ok && result.value.is_builtin"
      - "calls['extension-management-service.install-from-gallery'] == 0"
  - id: remote-server-ext-install-unknown-id
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    input: {arg: nobody.nothing}
    expect:
      - "!result.ok && result.error.code == 'not-found'"
      - "calls['marketplace-gallery-endpoint.extension-query'] == 1 && calls['node-extension-management-service.install-from-gallery'] == 0"
  - id: remote-server-ext-install-malicious
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {marketplace-gallery-endpoint: {malicious: [ms-python.python]}}
    input: {arg: ms-python.python}
    expect:
      - "!result.ok && result.error.code == 'malicious'"
      - "calls['extension-management-service.install-from-gallery'] == 0"
  - id: remote-server-ext-install-disallowed-by-policy
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery", extensions-allowed: "redhat"}
    input: {arg: ms-python.python}
    expect:
      - "!result.ok && result.error.code == 'incompatible-target-platform'"
      - "calls['extensions-downloader.download'] == 0"
  - id: remote-server-ext-install-allowed-publisher
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery", extensions-allowed: "redhat,ms-python"}
    input: {arg: ms-python.python}
    expect:
      - "result.ok"
      - "'ms-python.python' in state['extensions-profile-scanner-service'].profile_extensions"
  - id: remote-server-ext-install-incompatible
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {marketplace-gallery-endpoint: {catalog: {ms-python.python: {compatible: false}}}}
    input: {arg: ms-python.python}
    expect:
      - "!result.ok && result.error.code == 'incompatible'"
      - "calls['extension-gallery-service.get-manifest'] == 0"
  - id: remote-server-ext-install-download-retried
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    input: {arg: ms-python.python}
    faults: [{target: marketplace-gallery-endpoint.download-asset, type: error, code: econnreset, retryable: true, calls: [1]}]
    expect:
      - "result.ok && retries == 1"
      - "'ms-python.python' in state['extensions-profile-scanner-service'].profile_extensions"
  - id: remote-server-ext-install-download-fails
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    input: {arg: ms-python.python}
    faults: [{target: marketplace-gallery-endpoint.download-asset, type: error, code: econnreset, retryable: true}]
    expect:
      - "!result.ok && result.error.code == 'download'"
      - "calls['marketplace-gallery-endpoint.download-asset'] == 3"
      - "size(state['extensions-profile-scanner-service'].profile_extensions) == 0"
  - id: remote-server-ext-install-signature-invalid
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    input: {arg: ms-python.python}
    choices: {extension-signature-verification-service.verify.verdict: signature-is-invalid}
    expect:
      - "!result.ok && result.error.code == 'signature-verification-failed'"
      - "calls['extensions-scanner.extract-user-extension'] == 0"
  - id: remote-server-ext-install-signature-check-disabled
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery", extensions-verify-signature: false}
    input: {arg: ms-python.python}
    choices: {extension-signature-verification-service.verify.verdict: signature-is-invalid}
    expect:
      - "result.ok"
      - "calls['extension-signature-verification-service.verify'] == 0"
      - "'ms-python.python' in state['extensions-profile-scanner-service'].profile_extensions"
  - id: remote-server-ext-install-unsigned-package
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {marketplace-gallery-endpoint: {catalog: {ms-python.python: {signed: false}}}}
    input: {arg: ms-python.python}
    expect:
      - "result.ok"
      - "calls['extension-signature-verification-service.verify'] == 0 && calls['marketplace-gallery-endpoint.download-asset'] == 1"
      - "'ms-python.python' in state['extensions-profile-scanner-service'].profile_extensions"
  - id: remote-server-ext-install-corrupt-zip
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    input: {arg: ms-python.python}
    choices: {extension-signature-verification-service.verify.verdict: package-is-invalid-zip}
    expect:
      - "!result.ok && result.error.code == 'corrupt-zip'"
      - "size(state['extensions-profile-scanner-service'].profile_extensions) == 0"
  - id: remote-server-ext-install-same-version
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.18.0", source: gallery, pinned: false, is_builtin: false}}}}
    input: {arg: ms-python.python}
    expect:
      - "result.ok && result.value.version == '2026.18.0'"
      - "calls['extensions-downloader.download'] == 0"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].version == '2026.18.0'"
  - id: remote-server-ext-install-add-to-profile-fails
    flow: rs-ext-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    input: {arg: ms-python.python}
    faults: [{target: extensions-profile-scanner-service.add-extensions-to-profile, type: error, code: eacces}]
    expect:
      - "!result.ok && result.error.code == 'add-to-profile'"
      - "!('ms-python.python' in state['extensions-profile-scanner-service'].profile_extensions)"
  - id: remote-server-ext-install-pinned-version-then-list
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    steps:
      - {flow: rs-ext-install, as: inst, input: {arg: "ms-python.python@2026.18.0"}}
      - {flow: rs-ext-query-installed, as: list}
    expect:
      - "steps.inst.result.ok"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].pinned"
      - "steps.list.result.value.user.exists(e, e.id == 'ms-python.python' && e.pinned)"
  - id: remote-server-ext-channel-install-marketplace-disabled
    flow: rs-ext-channel-install
    fixtures: [one-window-folder]
    input: {gallery: {id: ms-python.python, version: "2026.18.0", signed: true, compatible: true}, pinned: false}
    expect:
      - "!result.ok && result.error.code == 'not-allowed'"
      - "calls['extension-gallery-service.get-extensions-control-manifest'] == 0"
  - id: remote-server-ext-channel-install-builtin-update-refused
    flow: rs-ext-channel-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {marketplace-gallery-endpoint: {catalog: {vscode.git: {id: vscode.git, publisher: vscode, version: "11.0.0", signed: true, compatible: true, last_updated: 1793232000000}}}}
    input: {gallery: {id: vscode.git, publisher: vscode, version: "11.0.0", signed: true, compatible: true}, pinned: false}
    expect:
      - "!result.ok && result.error.code == 'incompatible'"
      - "calls['extensions-downloader.download'] == 0"
  - id: remote-server-ext-channel-install-malicious
    flow: rs-ext-channel-install
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {marketplace-gallery-endpoint: {malicious: [ms-python.python]}}
    input: {gallery: {id: ms-python.python, publisher: ms-python, version: "2026.18.0", signed: true, compatible: true}, pinned: false}
    expect:
      - "!result.ok && result.error.code == 'malicious'"
  - id: remote-server-ext-uninstall-then-list
    fixtures: [one-window-folder]
    state: {extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.18.0", source: gallery, pinned: false, is_builtin: false}}}}
    steps:
      - {flow: rs-ext-uninstall, as: un, input: {id: ms-python.python}}
      - {flow: rs-ext-query-installed, as: list}
    expect:
      - "steps.un.result.ok"
      - "!steps.list.result.value.user.exists(e, e.id == 'ms-python.python')"
      - "!('ms-python.python' in state['extensions-profile-scanner-service'].profile_extensions)"
  - id: remote-server-ext-uninstall-refusals
    fixtures: [one-window-folder]
    steps:
      - {flow: rs-ext-uninstall, as: noid, input: {id: ""}}
      - {flow: rs-ext-uninstall, as: builtin, input: {id: vscode.git}}
      - {flow: rs-ext-uninstall, as: missing, input: {id: ms-python.python}}
    expect:
      - "steps.noid.result.error.code == 'extension-id-required'"
      - "steps.builtin.result.error.code == 'extension-is-builtin'"
      - "steps.missing.result.error.code == 'extension-not-installed'"
      - "calls['extension-management-service.uninstall'] == 0"
  - id: remote-server-ext-auto-update-installs-then-list
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.16.0", source: gallery, pinned: false, is_builtin: false}}}}
    steps:
      - {flow: rs-ext-auto-update, as: au}
      - {flow: rs-ext-query-installed, as: list}
    expect:
      - "steps.list.result.value.user.exists(e, e.id == 'ms-python.python' && e.version == '2026.18.0' && e.operation == 'update')"
      - "ctx.auto_updated == ['ms-python.python'] || ctx.auto_updated == []"
      - "state['extensions-workbench-service@w1'].update_checks == 2"
      - "calls['extension-management-service.update-from-gallery'] == 1"
  - id: remote-server-ext-auto-update-delayed-then-installed
    flow: rs-ext-auto-update
    description: "An update published 1 h ago is delayed at the first check (12 h window) and installed at the next check 12 h later."
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state:
      extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.16.0", source: gallery, pinned: false, is_builtin: false}}}
      marketplace-gallery-endpoint: {catalog: {ms-python.python: {last_updated: 1793314800000}}}
    expect:
      - "trace.exists(e, e.type == 'note' && e.title == 'Update published too recently; delayed' && e.t < 1000)"
      - "calls['extension-management-service.update-from-gallery'] == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'extension-management-service.update-from-gallery')[0].t >= config['extensions-updates-check-interval-ms']"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].version == '2026.18.0'"
  - id: remote-server-ext-auto-update-skips
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state:
      extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.16.0", source: gallery, pinned: true, is_builtin: false}}}
    steps:
      - {flow: rs-ext-auto-update, as: pinned}
    expect:
      - "'ms-python.python' in ctx.auto_update_skipped"
      - "state['extensions-workbench-service@w1'].outdated == ['ms-python.python']"
      - "calls['extension-management-service.update-from-gallery'] == 0"
  - id: remote-server-ext-auto-update-disabled-extension
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state:
      extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.16.0", source: gallery, pinned: false, is_builtin: false}}}
      "global-extension-enablement-service@w1": {disabled: [ms-python.python]}
    steps:
      - {flow: rs-ext-auto-update, as: au}
    expect:
      - "'ms-python.python' in ctx.auto_update_skipped"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].version == '2026.16.0'"
  - id: remote-server-ext-auto-update-setting-off
    flow: rs-ext-auto-update
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery", extensions-auto-update: "off"}
    state: {extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.16.0", source: gallery, pinned: false, is_builtin: false}}}}
    expect:
      - "'ms-python.python' in ctx.auto_update_skipped"
      - "state['extensions-workbench-service@w1'].outdated == ['ms-python.python']"
  - id: remote-server-ext-auto-update-check-off-and-no-gallery
    fixtures: [one-window-folder]
    steps:
      - {flow: rs-ext-auto-update, as: nogallery}
    expect:
      - "calls['extension-gallery-service.is-enabled'] == 2 && calls['marketplace-gallery-endpoint.extension-query'] == 0"
      - "state['extensions-workbench-service@w1'].update_checks == 2 && state['extensions-workbench-service@w1'].outdated == []"
  - id: remote-server-ext-auto-check-updates-off
    flow: rs-ext-auto-update
    fixtures: [one-window-folder]
    config: {extensions-auto-check-updates: false}
    expect:
      - "ctx.update_check_skipped && calls['extensions-workbench-service.check-for-updates'] == 0"
      - "state['extensions-workbench-service@w1'].update_checks == 2"
  - id: remote-server-ext-disable-enable-roundtrip
    fixtures: [one-window-folder]
    steps:
      - {flow: rs-ext-disable-globally, as: d1, input: {id: ms-python.python}}
      - {flow: rs-ext-disable-globally, as: d2, input: {id: ms-python.python}}
      - {flow: rs-ext-get-disabled, as: g1}
      - {flow: rs-ext-enable-globally, as: e1, input: {id: ms-python.python}}
      - {flow: rs-ext-enable-globally, as: e2, input: {id: ms-python.python}}
      - {flow: rs-ext-get-disabled, as: g2}
    expect:
      - "steps.d1.result.value.changed && !steps.d2.result.value.changed"
      - "steps.g1.result.value.ids == ['ms-python.python']"
      - "steps.e1.result.value.changed && !steps.e2.result.value.changed"
      - "steps.g2.result.value.ids == []"
      - "state['global-extension-enablement-service@w1'].disabled == []"
  - id: remote-server-ext-commands-search-and-open
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    state: {extensions-profile-scanner-service: {profile_extensions: {ms-python.python: {id: ms-python.python, version: "2026.18.0", source: gallery, pinned: false, is_builtin: false}}}}
    steps:
      - {flow: rs-ext-search, as: s, input: {query: "@installed"}}
      - {flow: rs-ext-show-for-language, as: lang, input: {file_extension: ".py"}}
      - {flow: rs-ext-show-with-ids, as: ids, input: {extension_ids: [ms-python.python, redhat.vscode-yaml]}}
      - {flow: rs-ext-manage, as: m, input: {id: ms-python.python}}
      - {flow: rs-ext-manage, as: m2, input: {id: nobody.nothing}}
      - {flow: rs-ext-open, as: o, input: {id: nobody.nothing}}
      - {flow: rs-ext-open, as: o2, input: {id: ms-python.python}}
      - {flow: rs-ext-gallery-sign-in, as: si}
    expect:
      - "steps.lang.result.ok && steps.ids.result.ok"
      - "state['extensions-workbench-service@w1'].last_search == '@id:ms-python.python @id:redhat.vscode-yaml'"
      - "steps.m.result.ok && steps.m2.result.error.code == 'extension-not-found'"
      - "steps.o.result.error.code == 'extension-not-found' && steps.o2.result.ok"
      - "state['extensions-workbench-service@w1'].opened_extension == 'ms-python.python'"
      - "calls['extension-gallery-account-service.sign-in'] == 1"
  - id: remote-server-ext-channel-install-then-list
    fixtures: [one-window-folder]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    steps:
      - {flow: rs-ext-channel-install, as: inst, input: {gallery: {id: ms-python.python, publisher: ms-python, version: "2026.18.0", signed: true, compatible: true}, pinned: true}}
      - {flow: rs-ext-query-installed, as: list}
    expect:
      - "steps.inst.result.ok"
      - "steps.list.result.value.user.exists(e, e.id == 'ms-python.python' && e.pinned)"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].source == 'gallery'"
