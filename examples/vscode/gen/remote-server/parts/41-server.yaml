components:
  - {id: web-client-server, name: WebClientServer, kind: module, layer: remote, parent: remote-server-process, sources: ["src/vs/server/node/webClientServer.ts:160"], summary: "Serves the web workbench (when the server ships a web client).", attributes: {owner: remote-server}}
  - {id: remote-extension-host-agent-cli, name: CliMain (remote server CLI), kind: module, layer: remote, parent: remote-server-process, sources: ["src/vs/server/node/remoteExtensionHostAgentCli.ts:57-90"], summary: "Server CLI mode (--list/--install/--uninstall-extension, --update-extensions) via ExtensionManagementCLI.", attributes: {owner: remote-server}}

interfaces:
  # ---- server-main / start ----
  - component: server-main
    name: start
    kind: process
    summary: "server-main.ts top level: parse args; spawn the CLI for --help/--version/extension args, else listen and lazily create the agent server."
    sources: ["src/server-main.ts:23-52", "src/server-main.ts:113-140"]
    request:
      type: object
      properties:
        help: {type: boolean, default: false}
        install_extension: {type: string, default: ""}
        list_extensions: {type: boolean, default: false}
        start_server: {type: boolean, default: false}
        host: {type: string, default: localhost}
        port: {type: integer, default: 8000}
    behavior:
      - title: shouldSpawnCli for help/version/extension lookup, or install args without --start-server
        source: "src/server-main.ts:41-44"
        if: "input.help || input.list_extensions || (input.install_extension != '' && !input.start_server)"
        then:
          - title: Load the server code and run the CLI
            source: "src/server-main.ts:48-51"
            call: server-main-module.spawn-cli
            input: {list_extensions: "= input.list_extensions", install_extension: "= input.install_extension"}
            as: cli
          - return: {mode: cli, result: "= vars.cli.value"}
      - title: "License prompt only when product.serverLicense is non-empty (empty in OSS)"
        source: "src/server-main.ts:68-85"
        set: {vars.ignored: true}
      - title: Listen on host:port (localhost by default)
        source: "src/server-main.ts:113-119"
        set: {vars.listening: true}
      - return: {mode: server, host: "= input.host", port: "= input.port"}

  - component: server-main
    name: on-request
    kind: http
    summary: "http.createServer handler: create the agent server on first use, then delegate handleRequest."
    sources: ["src/server-main.ts:55-66", "src/server-main.ts:91-98"]
    request: {type: object, properties: {method: {type: string, default: GET}, path: {type: string, examples: [/version]}, tkn: {type: string, examples: [tok-dev]}, resource_paths: {type: array, items: {type: string}}}}
    behavior:
      - call: server-main-module.create-server
        input: {}
      - call: remote-extension-host-agent-server.handle-request
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: server-main-module
    name: create-server
    kind: function
    summary: "server.main.ts createServer -> remoteExtensionHostAgentServer.createServer (memoized promise)."
    sources: ["src/vs/server/node/server.main.ts:19-21", "src/vs/server/node/server.main.ts:69-73"]
    behavior:
      - call: remote-extension-host-agent-server.create-server
        input: {}

  - component: server-main-module
    name: spawn-cli
    kind: function
    summary: "spawnCli -> runCli (remoteExtensionHostAgentCli)."
    sources: ["src/vs/server/node/server.main.ts:62-64"]
    request: {type: object, properties: {list_extensions: {type: boolean}, install_extension: {type: string}}}
    behavior:
      - call: remote-extension-host-agent-cli.do-run
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: remote-extension-host-agent-cli
    name: do-run
    kind: function
    summary: "CliMain.doRun: list or install extensions on the server through ExtensionManagementCLI."
    sources: ["src/vs/server/node/remoteExtensionHostAgentCli.ts:149-175"]
    request: {type: object, properties: {list_extensions: {type: boolean}, install_extension: {type: string}}}
    errors: [{code: installation-failed, status: 0, retryable: false}]
    behavior:
      - if: "input.list_extensions"
        then:
          - title: --list-extensions
            source: "src/vs/server/node/remoteExtensionHostAgentCli.ts:152-154"
            call: node-extension-management-service.get-installed
            input: {}
            as: l
          - return: {listed: "= vars.l.value.user.map(e, e.id)"}
      - title: "--install-extension: look the ids up in the gallery"
        source: "src/vs/server/node/remoteExtensionHostAgentCli.ts:157-160"
        call: extension-gallery-service.get-extensions
        input: {ids: ["= input.install_extension"]}
        as: g
        on_error:
          - fail: {code: installation-failed, message: "= 'Failed Installing Extensions: ' + input.install_extension"}
      - if: "size(vars.g.value.extensions) == 0"
        then:
          - title: Not found in the gallery
            source: "src/vs/platform/extensionManagement/common/extensionManagementCLI.ts:130-134"
            fail: {code: installation-failed, message: "= 'Failed Installing Extensions: ' + input.install_extension"}
      - call: node-extension-management-service.install-from-gallery
        input: {gallery: "= vars.g.value.extensions[0]", pinned: false}
        as: i
      - return: {installed: "= vars.i.value.id"}

  # ---- agent server ----
  - component: remote-extension-host-agent-server
    name: create-server
    kind: function
    summary: "createServer: connection token, error handlers, services; refuses a bad connection-token setup."
    sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:612-620"]
    errors: [{code: server-connection-token-parse-error, status: 0, retryable: false}]
    behavior:
      - title: Set up the server services and IPC channels
        source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:660-668"
        call: server-services.setup-server-services
        input: {}

  - component: remote-extension-host-agent-server
    name: handle-request
    kind: http
    summary: "handleRequest: GET only; /version; /delay-shutdown; connection token gate; /vscode-remote-resource; web client; else 404."
    sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:115-199"]
    request: {type: object, properties: {method: {type: string, default: GET}, path: {type: string, examples: [/version]}, tkn: {type: string, examples: [tok-dev]}, resource_paths: {type: array, items: {type: string}}, has_web_client: {type: boolean, default: false}}}
    errors:
      - {code: method-not-allowed, status: 405, retryable: false}
      - {code: bad-request, status: 400, retryable: false}
      - {code: forbidden, status: 403, retryable: false}
      - {code: not-found, status: 404, retryable: false}
    behavior:
      - if: "input.method != 'GET'"
        then:
          - title: Only GET is served
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:117-119"
            fail: {code: method-not-allowed, status: 405, message: "= 'Unsupported method ' + input.method"}
      - if: "input.path == ''"
        then:
          - title: No URL
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:121-123"
            fail: {code: bad-request, status: 400, message: Bad request.}
      - if: "input.path == '/version'"
        then:
          - title: /version returns the commit (no token needed)
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:145-148"
            return: {status: 200, body: "= state.commit"}
      - if: "input.path == '/delay-shutdown'"
        then:
          - title: /delay-shutdown resets the auto-shutdown timer
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:151-155"
            call: server-lifetime-service.delay
            input: {}
          - return: {status: 200, body: OK}
      - if: "input.tkn != state.connection_token"
        then:
          - title: Invalid connection token (query tkn or cookie)
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:157-160"
            fail: {code: forbidden, status: 403, message: Forbidden.}
      - if: "input.path == '/vscode-remote-resource'"
        then:
          - if: "size(input.resource_paths) != 1"
            then:
              - title: Exactly one path parameter
                source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:165-168"
                fail: {code: bad-request, status: 400, message: Bad request.}
          - title: Serve the file with ETag caching
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:189"
            call: disk.read-file
            input: {resource: "= 'file://' + input.resource_paths[0]"}
            as: f
          - return: {status: 200, body: "= vars.f.value"}
      - if: "input.has_web_client"
        then:
          - title: The web client server handles the remaining paths
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:192-195"
            call: web-client-server.handle
            input: {path: "= input.path"}
            as: w
          - return: "= vars.w.value"
      - title: Not found
        source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:197-198"
        fail: {code: not-found, status: 404, message: Not found}

  - component: web-client-server
    name: handle
    kind: http
    summary: "WebClientServer.handle: serves the workbench page and its static files."
    sources: ["src/vs/server/node/webClientServer.ts:160-200"]
    request: {type: object, properties: {path: {type: string}}}
    behavior:
      - return: {status: 200, body: workbench.html}

  - component: remote-extension-host-agent-server
    name: handle-upgrade
    kind: http
    summary: "handleUpgrade: reads reconnectionToken/reconnection from the query and upgrades to a WebSocket."
    sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:201-237"]
    request: {type: object, properties: {reconnection_token: {type: string}, reconnection: {type: boolean}}}
    behavior:
      - return: {upgraded: true}

  - component: remote-extension-host-agent-server
    name: handle-web-socket-connection
    kind: rpc
    attributes: {protocol: "PersistentProtocol control messages"}
    summary: "_handleWebSocketConnection: auth (connection token), sign, connectionType (commit and signature check), then _handleConnectionType."
    sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:274-397"]
    request: {type: object, properties: {auth: {type: string}, commit: {type: string}, desired_connection_type: {type: string, examples: [management]}, is_reconnection: {type: boolean}, reconnection_token: {type: string}, signature_valid: {type: boolean, default: true}}}
    errors: [{code: connection-error, status: 0, retryable: false, summary: "error control message -> VSCODE_CONNECTION_ERROR on the client"}]
    behavior:
      - if: "input.auth != state.connection_token"
        then:
          - title: "Unauthorized client refused: auth mismatch"
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:308-310"
            fail: {code: connection-error, message: "Unauthorized client refused: auth mismatch"}
      - if: "has(input.commit) && input.commit != '' && input.commit != state.commit"
        then:
          - title: "Client refused: version mismatch"
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:351-358"
            fail: {code: connection-error, message: "Client refused: version mismatch"}
      - if: "has(input.signature_valid) && !input.signature_valid && config['environment-is-built']"
        then:
          - title: Unauthorized client refused (bad signature, built server)
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:373-378"
            fail: {code: connection-error, message: "Unauthorized client refused"}
      - title: A new connection shortens the grace time of disconnected ones
        source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:381-391"
        call: management-connection.shorten-reconnection-grace-time
        input: {}
      - call: remote-extension-host-agent-server.handle-connection-type
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: remote-extension-host-agent-server
    name: handle-connection-type
    kind: function
    summary: "_handleConnectionType: management or extension-host connection, fresh or reconnection, keyed by reconnection token."
    sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:400-518"]
    request: {type: object, properties: {desired_connection_type: {type: string}, is_reconnection: {type: boolean}, reconnection_token: {type: string}}}
    errors: [{code: connection-error, status: 0, retryable: false}]
    behavior:
      - if: "input.desired_connection_type == 'management'"
        then:
          - call: remote-extension-host-agent-server.management-connections-get
            input: {token: "= input.reconnection_token"}
            as: existing
          - if: "input.is_reconnection"
            then:
              - if: "!has(vars.existing.value.token)"
                then:
                  - call: remote-extension-host-agent-server.reconnection-tokens-get
                    input: {token: "= input.reconnection_token"}
                    as: seen
                  - if: "has(vars.seen.value.token)"
                    then:
                      - title: Unknown reconnection token (seen before)
                        source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:421-424"
                        fail: {code: connection-error, message: "Unknown reconnection token (seen before)"}
                  - title: Unknown reconnection token (never seen)
                    source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:418-420"
                    fail: {code: connection-error, message: "Unknown reconnection token (never seen)"}
              - title: Accept the reconnection on the existing ManagementConnection
                source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:427-430"
                call: management-connection.accept-reconnection
                input: {token: "= input.reconnection_token"}
              - return: {type: ok, reconnected: true}
          - if: "has(vars.existing.value.token)"
            then:
              - title: Duplicate reconnection token
                source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:434-437"
                fail: {code: connection-error, message: "Duplicate reconnection token"}
          - title: New ManagementConnection, remembered by token
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:439-448"
            call: remote-extension-host-agent-server.management-connections-put
            input: {token: "= input.reconnection_token", value: {token: "= input.reconnection_token", connected_at: "= now"}}
          - call: remote-extension-host-agent-server.reconnection-tokens-put
            input: {token: "= input.reconnection_token", value: {token: "= input.reconnection_token"}}
          - return: {type: ok, reconnected: false}
      - if: "input.desired_connection_type == 'extension-host'"
        then:
          - title: New ExtensionHostConnection marks the server active
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:478-502"
            call: server-lifetime-service.active
            input: {consumer: "= 'ExtensionHost:' + input.reconnection_token"}
          - call: extension-host-connection.start
            input: {token: "= input.reconnection_token"}
          - return: {type: ok, reconnected: false}
      - if: "input.desired_connection_type == 'tunnel'"
        then:
          - title: Tunnel connections pipe to host:port
            source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:505-512"
            return: {type: ok, reconnected: false}
      - title: Unknown initial data received
        source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:513-516"
        fail: {code: connection-error, message: "Unknown initial data received"}

  - {component: remote-extension-host-agent-server, name: management-connections-get, kind: store, summary: "_managementConnections[reconnectionToken]", sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:72"], store: {table: management_connections, op: get, key: "= input.token", default: {}}}
  - {component: remote-extension-host-agent-server, name: management-connections-put, kind: store, summary: "_managementConnections[token] = con", sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:443"], store: {table: management_connections, op: put, key: "= input.token", value: "= input.value"}}
  - {component: remote-extension-host-agent-server, name: management-connections-delete, kind: store, summary: "con.onClose -> delete _managementConnections[token]", sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:445-447"], store: {table: management_connections, op: delete, key: "= input.token"}}
  - {component: remote-extension-host-agent-server, name: reconnection-tokens-get, kind: store, summary: "_allReconnectionTokens.has(token)", sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:73"], store: {table: all_reconnection_tokens, op: get, key: "= input.token", default: {}}}
  - {component: remote-extension-host-agent-server, name: reconnection-tokens-put, kind: store, summary: "_allReconnectionTokens.add(token)", sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:444"], store: {table: all_reconnection_tokens, op: put, key: "= input.token", value: "= input.value"}}

  - component: management-connection
    name: on-socket-close
    kind: event
    summary: "Socket closed: wait the reconnection grace time before disposing the connection."
    sources: ["src/vs/server/node/remoteExtensionManagement.ts:78-82"]
    request: {type: object, required: [token], properties: {token: {type: string, examples: [tok-r1]}}}
    behavior:
      - call: management-connection.disconnected-put
        input: {token: "= input.token", value: {token: "= input.token", since: "= now", short: false}}
      - title: _disconnectRunner1 after the grace time
        source: "src/vs/server/node/remoteExtensionManagement.ts:65-68"
        emit: management-connection.clean-resources
        input: {token: "= input.token"}
        after_ms: "= config['remote-reconnection-grace-time-ms']"
  - component: management-connection
    name: shorten-reconnection-grace-time
    kind: function
    summary: "shortenReconnectionGraceTimeIfNecessary for every disconnected connection."
    sources: ["src/vs/server/node/remoteExtensionManagement.ts:91-101"]
    behavior:
      - call: management-connection.disconnected-query
        input: {}
        as: d
      - foreach: "= vars.d.value.filter(x, !x.short)"
        as: c
        steps:
          - title: Another client connected; short grace timer
            source: "src/vs/server/node/remoteExtensionManagement.ts:96-100"
            call: management-connection.disconnected-put
            input: {token: "= vars.c.token", value: "= merge(vars.c, {'short': true})"}
          - emit: management-connection.clean-resources
            input: {token: "= vars.c.token"}
            after_ms: "= config['remote-reconnection-short-grace-time-ms']"
  - component: management-connection
    name: accept-reconnection
    kind: function
    summary: "acceptReconnection: cancel both disposal timers and resume the protocol."
    sources: ["src/vs/server/node/remoteExtensionManagement.ts:120-127"]
    request: {type: object, properties: {token: {type: string}}}
    behavior:
      - call: management-connection.disconnected-delete
        input: {token: "= input.token"}
  - component: management-connection
    name: clean-resources
    kind: event
    summary: "_cleanResources when a grace timer fires: dispose and drop the connection."
    sources: ["src/vs/server/node/remoteExtensionManagement.ts:103-118"]
    request: {type: object, properties: {token: {type: string}}}
    behavior:
      - call: management-connection.disconnected-get
        input: {token: "= input.token"}
        as: d
      - if: "!has(vars.d.value.token)"
        then:
          - title: Timer was cancelled by a reconnection, or already cleaned
            source: "src/vs/server/node/remoteExtensionManagement.ts:104-107"
            return: {cleaned: false}
      - call: management-connection.disconnected-delete
        input: {token: "= input.token"}
      - title: onClose deletes the connection from the server's map
        source: "src/vs/server/node/remoteExtensionHostAgentServer.ts:445-447"
        call: remote-extension-host-agent-server.management-connections-delete
        input: {token: "= input.token"}
      - return: {cleaned: true}
  - {component: management-connection, name: disconnected-put, kind: store, summary: "disconnect runner scheduled", sources: ["src/vs/server/node/remoteExtensionManagement.ts:81"], store: {table: disconnected, op: put, key: "= input.token", value: "= input.value"}}
  - {component: management-connection, name: disconnected-get, kind: store, summary: "disconnect runner state", sources: ["src/vs/server/node/remoteExtensionManagement.ts:92-96"], store: {table: disconnected, op: get, key: "= input.token", default: {}}}
  - {component: management-connection, name: disconnected-delete, kind: store, summary: "runners cancelled or disposed", sources: ["src/vs/server/node/remoteExtensionManagement.ts:123-124"], store: {table: disconnected, op: delete, key: "= input.token"}}
  - {component: management-connection, name: disconnected-query, kind: store, summary: "all disconnected management connections", sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:385-388"], store: {table: disconnected, op: query}}

  - component: extension-host-connection
    name: start
    kind: function
    summary: "ExtensionHostConnection.start: fork the remote extension host process."
    sources: ["src/vs/server/node/extensionHostConnection.ts:108-140"]
    request: {type: object, properties: {token: {type: string}}}
    behavior:
      - call: extension-host-status-service.set-exit-info
        input: {token: "= input.token", exit: null}

  - component: extension-host-status-service
    name: set-exit-info
    kind: function
    summary: "setExitInfo / getExitInfo by reconnection token"
    sources: ["src/vs/server/node/extensionHostStatusService.ts:18-30"]
    request: {type: object, properties: {token: {type: string}, exit: {type: ["object", "null"]}}}
    behavior:
      - return: {}

  - component: server-lifetime-service
    name: active
    kind: function
    summary: "active(consumer): increments the consumer count and cancels a pending shutdown."
    sources: ["src/vs/server/node/serverLifetimeService.ts:84-96"]
    request: {type: object, properties: {consumer: {type: string}}}
    behavior:
      - set: {state.total: "= state.total + 1", state.shutdown_scheduled: false}
  - component: server-lifetime-service
    name: delay
    kind: function
    summary: "delay(): resets the auto-shutdown timer when one is pending."
    sources: ["src/vs/server/node/serverLifetimeService.ts:122-130"]
    behavior:
      - set: {state.delays: "= state.delays + 1"}

  - component: server-services
    name: setup-server-services
    kind: function
    summary: "setupServerServices: instantiate services and register the server's IPC channels on the socket server."
    sources: ["src/vs/server/node/serverServices.ts:120-128"]
    behavior:
      - {title: "register channel 'logger' (LoggerChannel)", source: "src/vs/server/node/serverServices.ts:130"}
      - {title: "register channel ExtensionHostDebugBroadcastChannel", source: "src/vs/server/node/serverServices.ts:145"}
      - {title: "register channel 'userDataProfiles'", source: "src/vs/server/node/serverServices.ts:166"}
      - title: "gallery manifest from the client ('extensionGalleryManifest' channel)"
        source: "src/vs/server/node/serverServices.ts:218"
        call: extension-gallery-manifest-ipc-service.register-channel
        input: {}
      - {title: "register channel 'agentHostProxy' (bridge, or UnavailableAgentHostChannel)", source: "src/vs/server/node/serverServices.ts:333"}
      - call: server-agent-host-manager.start
        input: {}
      - {title: "register channel 'remoteextensionsenvironment' (RemoteAgentEnvironmentChannel)", source: "src/vs/server/node/serverServices.ts:409"}
      - {title: "register channel 'telemetry' (ServerTelemetryChannel)", source: "src/vs/server/node/serverServices.ts:412"}
      - {title: "register channel 'sandboxHelper'", source: "src/vs/server/node/serverServices.ts:414"}
      - {title: "register channel 'remoteterminal' (RemoteTerminalChannel)", source: "src/vs/server/node/serverServices.ts:416"}
      - title: "register channel 'remoteExtensionsScanner'"
        source: "src/vs/server/node/serverServices.ts:419"
        call: remote-extensions-scanner-service.when-extensions-ready
        input: {}
      - {title: "register channel 'NativeMcpDiscoveryHelper'", source: "src/vs/server/node/serverServices.ts:421"}
      - {title: "register channel 'mcpGateway'", source: "src/vs/server/node/serverServices.ts:422"}
      - {title: "register channel 'remoteFilesystem' (RemoteAgentFileSystemProviderChannel)", source: "src/vs/server/node/serverServices.ts:425"}
      - {title: "register channel 'request' (RequestChannel)", source: "src/vs/server/node/serverServices.ts:427"}
      - {title: "register channel 'extensions' (ExtensionManagementChannel)", source: "src/vs/server/node/serverServices.ts:429-430"}
      - {title: "register channel 'mcpManagement' (McpManagementChannel)", source: "src/vs/server/node/serverServices.ts:432"}
      - title: environment data for connecting windows
        call: remote-agent-environment-channel.get-environment-data
        input: {}
  - component: extension-gallery-manifest-ipc-service
    name: register-channel
    kind: ipc
    attributes: {channel: extensionGalleryManifest}
    summary: "Registers the 'extensionGalleryManifest' channel through which the client pushes its gallery manifest."
    sources: ["src/vs/platform/extensionManagement/common/extensionGalleryManifestServiceIpc.ts:37"]
    behavior:
      - return: {}
  - component: server-agent-host-manager
    name: start
    kind: function
    summary: "ServerAgentHostManager: starts the agent host when configured."
    sources: ["src/vs/server/node/serverAgentHostManager.ts:104-130"]
    behavior:
      - return: {}
  - component: remote-extensions-scanner-service
    name: when-extensions-ready
    kind: function
    summary: "whenExtensionsReady: installs --install-extension ids passed to the server, then reports failures."
    sources: ["src/vs/server/node/remoteExtensionsScanner.ts:28-80"]
    behavior:
      - return: {failed: []}
  - component: remote-agent-environment-channel
    name: get-environment-data
    kind: ipc
    attributes: {channel: remoteextensionsenvironment, command: getEnvironmentData}
    summary: "getEnvironmentData: paths, OS, reconnection grace time for the window."
    sources: ["src/vs/server/node/remoteAgentEnvironmentImpl.ts:26-80"]
    behavior:
      - return: {reconnection_grace_time: "= config['remote-reconnection-grace-time-ms']"}

  - component: server-cli
    name: main
    kind: process
    summary: "server-cli.ts: NLS + ESM bootstrap, then load vs/server/node/server.cli (the `code` command in a remote terminal)."
    sources: ["src/server-cli.ts:15-30"]
    behavior:
      - title: Load server.cli
        source: "src/server-cli.ts:30"
        return: {loaded: true}

  - {component: disk, name: read-file, kind: io, summary: "Shared io: provider readFile by URI", request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}, errors: [{code: file-not-found, status: 0, retryable: false}], attributes: {boundary: true, owner: platform-core}}

flows:
  - {id: rs-remote-server-start, name: "Remote server process start (server-main.ts)", entry: {caller: os-shell, interface: server-main.start}, sources: ["src/server-main.ts:23"]}
  - {id: rs-remote-server-http-request, name: "HTTP request to the remote server", entry: {caller: user, interface: server-main.on-request}, sources: ["src/server-main.ts:91"]}
  - {id: rs-remote-server-cli, name: "server-cli.ts (code in a remote terminal)", entry: {caller: os-shell, interface: server-cli.main}, sources: ["src/server-cli.ts:15"]}
  - {id: rs-remote-connect, name: "Window connects its management connection to the remote server", tags: [writes], entry: {caller: workbench, interface: remote-agent-connection.connect-remote-agent-management}, sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:414"]}
  - {id: rs-remote-reconnect, name: "Socket closed: reconnection loop", tags: [writes], entry: {caller: workbench, interface: management-persistent-connection.on-socket-close}, sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:584"]}
  - {id: rs-remote-server-socket-close, name: "Server sees a management socket close and keeps the connection for the grace time", tags: [writes], entry: {caller: remote-server-process, interface: management-connection.on-socket-close}, sources: ["src/vs/server/node/remoteExtensionManagement.ts:78"]}
  - {id: rs-remote-connection-state, name: "Is the window's management connection connected", entry: {caller: workbench, interface: management-persistent-connection.get-connection-state}, sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:561-563"]}
  - {id: rs-remote-ext-host-connect, name: "Extension host connection handshake", tags: [writes], entry: {caller: workbench, interface: remote-extension-host-agent-server.handle-web-socket-connection}, sources: ["src/vs/server/node/remoteExtensionHostAgentServer.ts:274"]}

scenarios:
  - id: remote-server-server-start-modes
    fixtures: [base-workspace]
    config: {product-extensions-gallery-service-url: "https://marketplace.example/_apis/public/gallery"}
    steps:
      - {flow: rs-remote-server-start, as: srv, input: {help: false, list_extensions: false, install_extension: "", start_server: false}}
      - {flow: rs-remote-server-start, as: inst, input: {install_extension: ms-python.python, start_server: false, help: false, list_extensions: false}}
      - {flow: rs-remote-server-start, as: list, input: {list_extensions: true, help: false, install_extension: "", start_server: false}}
      - {flow: rs-remote-server-start, as: bad, input: {install_extension: nobody.nothing, start_server: false, help: false, list_extensions: false}}
      - {flow: rs-remote-server-cli, as: cli}
    expect:
      - "steps.srv.result.value.mode == 'server' && steps.srv.result.value.host == 'localhost'"
      - "steps.inst.result.ok && 'ms-python.python' in steps.list.result.value.result.listed"
      - "steps.bad.result.error.code == 'installation-failed'"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].source == 'gallery'"
      - "steps.cli.result.ok"
  - id: remote-server-server-cli-install-no-gallery
    flow: rs-remote-server-start
    fixtures: [base-workspace]
    input: {install_extension: ms-python.python, start_server: false, help: false, list_extensions: false}
    expect:
      - "!result.ok && result.error.code == 'installation-failed'"
      - "calls['node-extension-management-service.install-from-gallery'] == 0"
  - id: remote-server-server-http-routes
    fixtures: [base-workspace]
    steps:
      - {flow: rs-remote-server-http-request, as: version, input: {method: GET, path: /version, tkn: ""}}
      - {flow: rs-remote-server-http-request, as: post, input: {method: POST, path: /version, tkn: tok-dev}}
      - {flow: rs-remote-server-http-request, as: nourl, input: {method: GET, path: "", tkn: tok-dev}}
      - {flow: rs-remote-server-http-request, as: delay, input: {method: GET, path: /delay-shutdown, tkn: ""}}
      - {flow: rs-remote-server-http-request, as: forbidden, input: {method: GET, path: /vscode-remote-resource, tkn: wrong, resource_paths: [/work/app/README.md]}}
      - {flow: rs-remote-server-http-request, as: res, input: {method: GET, path: /vscode-remote-resource, tkn: tok-dev, resource_paths: [/work/app/README.md]}}
      - {flow: rs-remote-server-http-request, as: badres, input: {method: GET, path: /vscode-remote-resource, tkn: tok-dev, resource_paths: [/a, /b]}}
      - {flow: rs-remote-server-http-request, as: web, input: {method: GET, path: /, tkn: tok-dev, has_web_client: true}}
      - {flow: rs-remote-server-http-request, as: nf, input: {method: GET, path: /nope, tkn: tok-dev, has_web_client: false}}
    expect:
      - "steps.version.result.value.body == '2c33b50b16c472efe58357d1d2a8a5414bc23fbf'"
      - "steps.post.result.error.status == 405 && steps.nourl.result.error.status == 400"
      - "steps.delay.result.value.body == 'OK' && state['server-lifetime-service'].delays == 1"
      - "steps.forbidden.result.error.status == 403 && steps.res.result.value.status == 200 && steps.badres.result.error.status == 400"
      - "steps.web.result.value.status == 200 && steps.nf.result.error.status == 404"
  - id: remote-server-connect-then-reconnect
    fixtures: [one-window-folder]
    steps:
      - {flow: rs-remote-connect, as: c, input: {remote_authority: "ssh-remote+dev-box", reconnection_token: tok-r1, commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 45000, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
      - {flow: rs-remote-connection-state, as: st}
    expect:
      - "steps.c.result.ok && steps.r.result.ok && steps.st.result.value.is_connected"
      - "'tok-r1' in state['remote-extension-host-agent-server'].management_connections"
      - "state['management-persistent-connection@w1'].connection_state == 'connection-gain' && state['management-persistent-connection@w1'].attempts == 1"
      - "state['remote-agent-connection-status-listener@w1'].visible_progress == 'none' && state['remote-agent-connection-status-listener@w1'].last_report == 'Disconnected. Attempting to reconnect...'"
      - "trace.exists(e, e.type == 'note' && e.title == 'Accept the reconnection on the existing ManagementConnection')"
  - id: remote-server-reconnect-network-error-retries
    fixtures: [one-window-folder]
    faults: [{target: remote-socket-factory-service.connect, type: error, code: econnrefused, calls: [2, 3]}]
    steps:
      - {flow: rs-remote-connect, as: c, input: {remote_authority: "ssh-remote+dev-box", reconnection_token: tok-r1, commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 1000, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
    expect:
      - "state['management-persistent-connection@w1'].connection_state == 'connection-gain' && state['management-persistent-connection@w1'].attempts == 3"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'remote-socket-factory-service.connect').size() == 4"
      - "state['remote-agent-connection-status-listener@w1'].last_report == ''"
  - id: remote-server-reconnect-after-server-grace-expired
    fixtures: [one-window-folder]
    steps:
      - {flow: rs-remote-connect, as: c, input: {remote_authority: "ssh-remote+dev-box", reconnection_token: tok-r1, commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
      - {flow: rs-remote-server-socket-close, as: close, input: {token: tok-r1}}
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 45000, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
    choices: {remote-agent-connection-status-listener.on-did-state-change.reload: reload-window}
    expect:
      - "!('tok-r1' in state['remote-extension-host-agent-server'].management_connections)"
      - "trace.exists(e, e.type == 'note' && e.title == 'Unknown reconnection token (seen before)')"
      - "state['management-persistent-connection@w1'].permanent_failure && state['remote-agent-connection-status-listener@w1'].reload_window_shown"
      - "calls['command-service.execute-command'] == 1"
  - id: remote-server-reconnect-unknown-token-never-seen
    fixtures: [one-window-folder]
    state: {"management-persistent-connection@w1": {reconnection_token: tok-ghost, connection_state: connection-gain}}
    choices: {remote-agent-connection-status-listener.on-did-state-change.reload: dismiss}
    steps:
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 45000, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
      - {flow: rs-remote-reconnect, as: again, input: {millis_since_last_incoming_data: 45000, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
    expect:
      - "trace.exists(e, e.type == 'note' && e.title == 'Unknown reconnection token (never seen)')"
      - "state['management-persistent-connection@w1'].permanent_failure"
      - "calls['command-service.execute-command'] == 0 && calls['remote-socket-factory-service.connect'] == 1"
  - id: remote-server-reconnect-grace-expired-client-side
    fixtures: [one-window-folder]
    state: {"management-persistent-connection@w1": {reconnection_token: tok-r1, connection_state: connection-gain, grace_time_ms: 4000}}
    faults: [{target: remote-socket-factory-service.connect, type: error, code: econnrefused}]
    steps:
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 45000, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
    expect:
      - "trace.exists(e, e.type == 'note' && e.title == 'Error after the grace time expired is permanent')"
      - "state['management-persistent-connection@w1'].permanent_failure && state['management-persistent-connection@w1'].attempts == 2"
  - id: remote-server-reconnect-zero-grace-and-busy
    fixtures: [one-window-folder]
    state: {"management-persistent-connection@w1": {reconnection_token: tok-r1, connection_state: connection-gain, grace_time_ms: 0}}
    steps:
      - {flow: rs-remote-reconnect, as: zero, input: {millis_since_last_incoming_data: 100, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
      - {flow: rs-remote-reconnect, as: after, input: {millis_since_last_incoming_data: 100, remote_authority: "ssh-remote+dev-box", commit: "2c33b50b16c472efe58357d1d2a8a5414bc23fbf"}}
    expect:
      - "state['management-persistent-connection@w1'].permanent_failure"
      - "calls['remote-socket-factory-service.connect'] == 0"
      - "trace.exists(e, e.type == 'note' && e.title == 'No more attempts after a permanent failure')"
  - id: remote-server-reconnect-already-running
    fixtures: [one-window-folder]
    state: {"management-persistent-connection@w1": {is_reconnecting: true}}
    steps:
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 100, remote_authority: "ssh-remote+dev-box", commit: "x"}}
    expect:
      - "steps.r.result.value.started == false && state['management-persistent-connection@w1'].is_reconnecting"
  - id: remote-server-reconnect-resolver-and-unknown-errors
    fixtures: [one-window-folder]
    state: {"management-persistent-connection@w1": {reconnection_token: tok-r1, connection_state: connection-gain}}
    choices: {remote-agent-connection-status-listener.on-did-state-change.reload: dismiss}
    steps:
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 100, remote_authority: "ssh-remote+gone-box", commit: "x"}}
    expect:
      - "trace.exists(e, e.type == 'note' && e.title == 'RemoteAuthorityResolverError is permanent')"
      - "state['management-persistent-connection@w1'].permanent_failure"
  - id: remote-server-reconnect-unknown-error-permanent
    fixtures: [one-window-folder]
    state: {"management-persistent-connection@w1": {reconnection_token: tok-r1, connection_state: connection-gain}}
    faults: [{target: remote-socket-factory-service.connect, type: error, code: eproto}]
    steps:
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 100, remote_authority: "ssh-remote+dev-box", commit: "x"}}
    expect:
      - "trace.exists(e, e.type == 'note' && e.title == 'Unknown error is treated as permanent')"
      - "state['management-persistent-connection@w1'].attempts == 1"
  - id: remote-server-connect-refused
    fixtures: [one-window-folder]
    choices: {remote-agent-connection-status-listener.on-did-state-change.reload: dismiss}
    steps:
      - {flow: rs-remote-connect, as: badver, input: {remote_authority: "ssh-remote+dev-box", reconnection_token: tok-r2, commit: "0000000"}}
    expect:
      - "steps.badver.result.error.code == 'connection-error' && retries == 4"
      - "state['management-persistent-connection@w1'].permanent_failure && state['remote-agent-connection-status-listener@w1'].reload_window_shown"
  - id: remote-server-handshake-refusals
    fixtures: [base-workspace]
    state: {remote-extension-host-agent-server: {management_connections: {tok-dup: {token: tok-dup}}}}
    steps:
      - {flow: rs-remote-ext-host-connect, as: auth, input: {auth: wrong, commit: "", desired_connection_type: management, is_reconnection: false, reconnection_token: tok-a}}
      - {flow: rs-remote-ext-host-connect, as: sig, input: {auth: tok-dev, commit: "", desired_connection_type: management, is_reconnection: false, reconnection_token: tok-a, signature_valid: false}}
      - {flow: rs-remote-ext-host-connect, as: dup, input: {auth: tok-dev, commit: "", desired_connection_type: management, is_reconnection: false, reconnection_token: tok-dup}}
      - {flow: rs-remote-ext-host-connect, as: odd, input: {auth: tok-dev, commit: "", desired_connection_type: other, is_reconnection: false, reconnection_token: tok-b}}
      - {flow: rs-remote-ext-host-connect, as: tun, input: {auth: tok-dev, commit: "", desired_connection_type: tunnel, is_reconnection: false, reconnection_token: tok-c}}
      - {flow: rs-remote-ext-host-connect, as: eh, input: {auth: tok-dev, commit: "", desired_connection_type: extension-host, is_reconnection: false, reconnection_token: tok-eh}}
    expect:
      - "steps.auth.result.error.message == 'Unauthorized client refused: auth mismatch'"
      - "steps.sig.result.error.message == 'Unauthorized client refused'"
      - "steps.dup.result.error.message == 'Duplicate reconnection token'"
      - "steps.odd.result.error.message == 'Unknown initial data received' && steps.tun.result.ok"
      - "steps.eh.result.ok && state['server-lifetime-service'].total == 1"
  - id: remote-server-server-short-grace-on-new-client
    description: "A disconnected connection gets the 5 min short grace once another client connects, then is disposed."
    fixtures: [one-window-folder]
    state:
      remote-extension-host-agent-server: {management_connections: {tok-old: {token: tok-old}}, all_reconnection_tokens: {tok-old: {token: tok-old}}}
      management-connection: {disconnected: {tok-old: {token: tok-old, since: 0, short: false}}}
    steps:
      - {flow: rs-remote-connect, as: c2, input: {remote_authority: "ssh-remote+dev-box", reconnection_token: tok-r2, commit: ""}}
    expect:
      - "!('tok-old' in state['remote-extension-host-agent-server'].management_connections) && 'tok-r2' in state['remote-extension-host-agent-server'].management_connections"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'management-connection.clean-resources')[0].t >= config['remote-reconnection-short-grace-time-ms']"
  - id: remote-server-server-reconnect-cancels-disposal
    description: "The reconnecting client's own handshake schedules the short grace for its disconnected connection, but acceptReconnection cancels it."
    fixtures: [one-window-folder]
    state:
      remote-extension-host-agent-server: {management_connections: {tok-r1: {token: tok-r1}}, all_reconnection_tokens: {tok-r1: {token: tok-r1}}}
      management-connection: {disconnected: {tok-r1: {token: tok-r1, since: 0, short: false}}}
      "management-persistent-connection@w1": {reconnection_token: tok-r1, connection_state: connection-gain}
    steps:
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 100, remote_authority: "ssh-remote+dev-box", commit: ""}}
    expect:
      - "'tok-r1' in state['remote-extension-host-agent-server'].management_connections"
      - "trace.exists(e, e.type == 'note' && e.title == 'Timer was cancelled by a reconnection, or already cleaned')"
  - id: remote-server-handshake-then-reconnect
    fixtures: [one-window-folder]
    state: {"management-persistent-connection@w1": {reconnection_token: tok-h, connection_state: connection-gain}}
    steps:
      - {flow: rs-remote-ext-host-connect, as: hs, input: {auth: tok-dev, commit: "", desired_connection_type: management, is_reconnection: false, reconnection_token: tok-h}}
      - {flow: rs-remote-reconnect, as: r, input: {millis_since_last_incoming_data: 100, remote_authority: "ssh-remote+dev-box", commit: ""}}
    expect:
      - "steps.hs.result.ok && steps.r.result.ok"
      - "'tok-h' in state['remote-extension-host-agent-server'].all_reconnection_tokens && state['management-persistent-connection@w1'].connection_state == 'connection-gain'"
