components:
  - id: remote-agent-connection-status-listener
    name: RemoteAgentConnectionStatusListener
    kind: module
    layer: remote
    parent: remote
    sources: ["src/vs/workbench/contrib/remote/browser/remote.ts:787-800"]
    summary: "Shows reconnect progress and the 'Cannot reconnect. Please reload the window.' dialog from connection state events."
    attributes: {owner: remote-server}
    state:
      schema: {type: object, properties: {visible_progress: {type: string}, reload_window_shown: {type: boolean}, last_report: {type: string}, attempts: {type: integer}}}
      initial: {visible_progress: none, reload_window_shown: false, last_report: "", attempts: 0}

interfaces:
  - component: remote-agent-connection
    name: connect-remote-agent-management
    kind: function
    summary: "connectRemoteAgentManagement -> createInitialConnection: up to 5 attempts, then a permanent failure."
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:414-422", "src/vs/platform/remote/common/remoteAgentConnection.ts:437-458"]
    request:
      type: object
      required: [remote_authority, reconnection_token]
      properties:
        remote_authority: {type: string, examples: ["ssh-remote+dev-box"]}
        reconnection_token: {type: string, examples: [tok-r1], description: "generateUuid() per attempt in code; fixed here so scenarios can address it"}
        commit: {type: string, examples: ["2c33b50b16c472efe58357d1d2a8a5414bc23fbf"]}
    errors:
      - {code: connection-error, status: 0, retryable: false, summary: "VSCODE_CONNECTION_ERROR: the server rejected the handshake"}
      - {code: remote-authority-resolver-error, status: 0, retryable: false}
    behavior:
      - title: Connect, retrying the whole attempt up to MAX_ATTEMPTS
        source: "src/vs/platform/remote/common/remoteAgentConnection.ts:440-457"
        call: remote-agent-connection.do-connect-remote-agent-management
        input: {remote_authority: "= input.remote_authority", reconnection_token: "= input.reconnection_token", commit: "= input.commit", is_reconnection: false}
        retry: {max_attempts: "= config['remote-initial-connection-max-attempts']", codes: [connection-error, remote-authority-resolver-error, econnrefused, etimedout, timeout, unavailable], title: "An error occurred in initial connection! Will retry...", source: "src/vs/platform/remote/common/remoteAgentConnection.ts:447-449"}
        as: conn
        on_error:
          - title: "Fifth failure is permanent: triggerPermanentFailure"
            source: "src/vs/platform/remote/common/remoteAgentConnection.ts:450-455"
            call: management-persistent-connection.go-to-permanent-failure
            input: {attempt: 0, handled: false}
          - fail: "= {'code': error.code, 'message': error.message}"
      - title: New ManagementPersistentConnection fires ConnectionGain
        source: "src/vs/platform/remote/common/remoteAgentConnection.ts:594"
        set: {vars.ignored: true}
      - call: management-persistent-connection.on-connected
        input: {reconnection_token: "= input.reconnection_token", remote_authority: "= input.remote_authority"}
      - return: {reconnection_token: "= input.reconnection_token", attempts: "= vars.conn.attempts"}

  - component: remote-agent-connection
    name: do-connect-remote-agent-management
    kind: function
    summary: "resolveConnectionOptions + connectToRemoteExtensionHostAgent for a Management connection (socket, auth, sign, connectionType)."
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:343-359", "src/vs/platform/remote/common/remoteAgentConnection.ts:228-317"]
    request: {type: object, properties: {remote_authority: {type: string}, reconnection_token: {type: string}, commit: {type: string}, is_reconnection: {type: boolean}}}
    behavior:
      - title: Resolve the authority to an address and connection token
        source: "src/vs/platform/remote/common/remoteAgentConnection.ts:390-404"
        call: remote-authority-resolver-service.resolve-authority
        input: {authority: "= input.remote_authority"}
        as: addr
      - title: "1/6 socketFactory.connect()"
        source: "src/vs/platform/remote/common/remoteAgentConnection.ts:231-240"
        call: remote-socket-factory-service.connect
        input: {host: "= vars.addr.value.host", port: "= vars.addr.value.port", reconnection_token: "= input.reconnection_token", reconnection: "= input.is_reconnection"}
      - title: "3/6..5/6 auth, sign and connectionType handshake (sign reply within 10 s)"
        source: "src/vs/platform/remote/common/remoteAgentConnection.ts:255-293"
        call: remote-extension-host-agent-server.handle-web-socket-connection
        input: {auth: "= vars.addr.value.connection_token", commit: "= input.commit", desired_connection_type: management, is_reconnection: "= input.is_reconnection", reconnection_token: "= input.reconnection_token"}
        timeout_ms: "= config['remote-handshake-timeout-ms']"
        as: hs
      - return: "= vars.hs.value"

  - component: remote-authority-resolver-service
    name: resolve-authority
    kind: function
    summary: "resolveAuthority: the resolver result for the authority (set by the resolver extension)."
    sources: ["src/vs/platform/remote/electron-browser/remoteAuthorityResolverService.ts:38-43"]
    request: {type: object, properties: {authority: {type: string, examples: ["ssh-remote+dev-box"]}}}
    response: {type: object, properties: {host: {type: string}, port: {type: integer}, connection_token: {type: string}}}
    errors: [{code: remote-authority-resolver-error, status: 0, retryable: false}]
    behavior:
      - if: "!(input.authority in state.resolved)"
        then:
          - title: "The resolver reports an error (RemoteAuthorityResolverError)"
            source: "src/vs/platform/remote/electron-browser/remoteAuthorityResolverService.ts:58-70"
            fail: {code: remote-authority-resolver-error, message: "= 'Could not resolve ' + input.authority"}
      - return: "= state.resolved[input.authority]"

  - component: remote-socket-factory-service
    name: connect
    kind: function
    summary: "connect: the socket factory for the connection type opens a WebSocket to the server."
    sources: ["src/vs/platform/remote/common/remoteSocketFactoryService.ts:53-60"]
    request: {type: object, properties: {host: {type: string}, port: {type: integer}, reconnection_token: {type: string}, reconnection: {type: boolean}}}
    behavior:
      - call: remote-extension-host-agent-server.handle-upgrade
        input: {reconnection_token: "= input.reconnection_token", reconnection: "= input.reconnection"}

  - component: management-persistent-connection
    name: on-connected
    kind: function
    summary: "PersistentConnection constructor: fires ConnectionGain and listens for socket close/timeout."
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:578-612"]
    request: {type: object, properties: {reconnection_token: {type: string}, remote_authority: {type: string}}}
    behavior:
      - set: {state.connection_state: connection-gain, state.reconnection_token: "= input.reconnection_token", state.attempts: 0}
      - publish: management-persistent-connection.on-did-state-change
        input: {type: connection-gain, attempt: 0, millis_since_last_incoming_data: 0, handled: false}
        delivery: sync

  - component: management-persistent-connection
    name: get-connection-state
    kind: function
    summary: "isConnected: ConnectionGain, not disposed, no permanent failure."
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:561-563"]
    behavior:
      - return: {is_connected: "= state.connection_state == 'connection-gain' && !state.disposed && !state.permanent_failure", state: "= state.connection_state"}
  - component: management-persistent-connection
    name: on-did-state-change
    kind: event
    summary: "onDidStateChange (ConnectionLost, ReconnectionWait, ReconnectionRunning, ConnectionGain, ReconnectionPermanentFailure)"
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:476-530"]
    request: {type: object, properties: {type: {type: string}, attempt: {type: integer}, millis_since_last_incoming_data: {type: integer}, handled: {type: boolean}, duration_seconds: {type: integer}}}

  - component: management-persistent-connection
    name: on-socket-close
    kind: event
    summary: "protocol.onSocketClose / onSocketTimeout -> _beginReconnecting (only one loop at a time)."
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:584-606", "src/vs/platform/remote/common/remoteAgentConnection.ts:639-650"]
    request: {type: object, properties: {millis_since_last_incoming_data: {type: integer, default: 45000}, remote_authority: {type: string, examples: ["ssh-remote+dev-box"]}, commit: {type: string, examples: ["2c33b50b16c472efe58357d1d2a8a5414bc23fbf"]}}}
    behavior:
      - if: "state.is_reconnecting"
        then:
          - title: Only one reconnection loop at a time
            source: "src/vs/platform/remote/common/remoteAgentConnection.ts:640-643"
            return: {started: false}
      - set: {state.is_reconnecting: true}
      - call: management-persistent-connection.run-reconnecting-loop
        input: "= input"
        as: loop
        on_error: continue
      - set: {state.is_reconnecting: false}
      - return: {started: true}

  - component: management-persistent-connection
    name: run-reconnecting-loop
    kind: function
    summary: "_runReconnectingLoop: wait 0,5,5,10..30 s between attempts within the grace time; permanent errors stop it."
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:652-746"]
    request: {type: object, properties: {millis_since_last_incoming_data: {type: integer}, remote_authority: {type: string}, commit: {type: string}}}
    behavior:
      - if: "state.permanent_failure || state.disposed"
        then:
          - title: No more attempts after a permanent failure
            source: "src/vs/platform/remote/common/remoteAgentConnection.ts:653-656"
            return: {outcome: permanent-failure}
      - title: Fire ConnectionLost
        source: "src/vs/platform/remote/common/remoteAgentConnection.ts:659"
        set: {state.connection_state: connection-lost}
      - publish: management-persistent-connection.on-did-state-change
        input: {type: connection-lost, attempt: 0, millis_since_last_incoming_data: "= input.millis_since_last_incoming_data", handled: false}
        delivery: sync
      - if: "state.grace_time_ms <= 0"
        then:
          - title: Grace time 0 ms, will not attempt to reconnect
            source: "src/vs/platform/remote/common/remoteAgentConnection.ts:663-667"
            call: management-persistent-connection.go-to-permanent-failure
            input: {attempt: 0, handled: false}
          - return: {outcome: permanent-failure}
      - set: {vars.grace_deadline: "= now + state.grace_time_ms", vars.outcome: gave-up}
      - title: "Attempts wait TIMES[attempt] (the last value repeats); the model caps the loop at 20 attempts"
        source: "src/vs/platform/remote/common/remoteAgentConnection.ts:671-675"
        foreach: "= config['remote-reconnect-wait-times-s'] + [30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]"
        as: wait_s
        index: attempt
        max: 20
        steps:
          - if: "vars.wait_s > 0"
            then:
              - publish: management-persistent-connection.on-did-state-change
                input: {type: reconnection-wait, attempt: "= vars.attempt", millis_since_last_incoming_data: "= input.millis_since_last_incoming_data", handled: false, duration_seconds: "= vars.wait_s"}
                delivery: sync
              - title: Sleep before reconnecting
                source: "src/vs/platform/remote/common/remoteAgentConnection.ts:676-685"
                wait: "= vars.wait_s * 1000"
          - title: Fire ReconnectionRunning
            source: "src/vs/platform/remote/common/remoteAgentConnection.ts:692"
            publish: management-persistent-connection.on-did-state-change
            input: {type: reconnection-running, attempt: "= vars.attempt + 1", millis_since_last_incoming_data: "= input.millis_since_last_incoming_data", handled: false}
            delivery: sync
          - title: Reconnect with the same token (30 s timeout)
            source: "src/vs/platform/remote/common/remoteAgentConnection.ts:693-697"
            call: remote-agent-connection.do-connect-remote-agent-management
            input: {remote_authority: "= input.remote_authority", reconnection_token: "= state.reconnection_token", commit: "= input.commit", is_reconnection: true}
            timeout_ms: "= config['remote-reconnect-timeout-ms']"
            as: r
            on_error: continue
          - if: "vars.r.ok"
            then:
              - title: Reconnected; fire ConnectionGain
                source: "src/vs/platform/remote/common/remoteAgentConnection.ts:698-701"
                set: {state.connection_state: connection-gain, state.attempts: "= vars.attempt + 1", vars.outcome: reconnected}
              - publish: management-persistent-connection.on-did-state-change
                input: {type: connection-gain, attempt: "= vars.attempt + 1", millis_since_last_incoming_data: 0, handled: false}
                delivery: sync
              - break: true
          - if: "vars.r.error.code == 'connection-error'"
            then:
              - title: "VSCODE_CONNECTION_ERROR is permanent"
                source: "src/vs/platform/remote/common/remoteAgentConnection.ts:703-707"
                call: management-persistent-connection.go-to-permanent-failure
                input: {attempt: "= vars.attempt + 1", handled: false}
              - set: {vars.outcome: permanent-failure}
              - break: true
          - if: "now >= vars.grace_deadline"
            then:
              - title: Error after the grace time expired is permanent
                source: "src/vs/platform/remote/common/remoteAgentConnection.ts:708-714"
                call: management-persistent-connection.go-to-permanent-failure
                input: {attempt: "= vars.attempt + 1", handled: false}
              - set: {vars.outcome: permanent-failure}
              - break: true
          - if: "vars.r.error.code in ['temporarily-not-available', 'econnrefused', 'etimedout', 'enetunreach', 'econnreset', 'timeout', 'canceled']"
            then:
              - title: "Temporarily unavailable, network or cancellation error: try again"
                source: "src/vs/platform/remote/common/remoteAgentConnection.ts:715-732"
                continue: true
          - if: "vars.r.error.code == 'remote-authority-resolver-error'"
            then:
              - title: RemoteAuthorityResolverError is permanent
                source: "src/vs/platform/remote/common/remoteAgentConnection.ts:733-738"
                call: management-persistent-connection.go-to-permanent-failure
                input: {attempt: "= vars.attempt + 1", handled: false}
              - set: {vars.outcome: permanent-failure}
              - break: true
          - title: Unknown error is treated as permanent
            source: "src/vs/platform/remote/common/remoteAgentConnection.ts:739-742"
            call: management-persistent-connection.go-to-permanent-failure
            input: {attempt: "= vars.attempt + 1", handled: false}
          - set: {vars.outcome: permanent-failure}
          - break: true
      - return: {outcome: "= vars.outcome"}

  - component: management-persistent-connection
    name: go-to-permanent-failure
    kind: function
    summary: "_onReconnectionPermanentFailure: management connections are fatal (triggerPermanentFailure for every connection); fires ReconnectionPermanentFailure."
    sources: ["src/vs/platform/remote/common/remoteAgentConnection.ts:748-761", "src/vs/platform/remote/common/remoteAgentConnection.ts:534-540"]
    request: {type: object, properties: {attempt: {type: integer}, handled: {type: boolean}}}
    behavior:
      - set: {state.permanent_failure: true, state.connection_state: reconnection-permanent-failure, state.attempts: "= input.attempt"}
      - publish: management-persistent-connection.on-did-state-change
        input: {type: reconnection-permanent-failure, attempt: "= input.attempt", millis_since_last_incoming_data: 0, handled: "= input.handled"}
        delivery: sync

  - component: remote-agent-connection-status-listener
    name: on-did-state-change
    kind: event
    summary: "connection.onDidStateChange listener: progress, reload dialog."
    sources: ["src/vs/workbench/contrib/remote/browser/remote.ts:892-1050"]
    subscribe: [management-persistent-connection.on-did-state-change]
    request: {type: object, properties: {type: {type: string}, attempt: {type: integer}, millis_since_last_incoming_data: {type: integer}, handled: {type: boolean}}}
    behavior:
      - if: "input.type == 'connection-lost'"
        then:
          - if: "state.visible_progress != 'none' || input.millis_since_last_incoming_data > config['remote-disconnect-prompt-time-ms']"
            then:
              - title: "Connection Lost (shown after 40 s without data)"
                source: "src/vs/workbench/contrib/remote/browser/remote.ts:917-922"
                set: {state.visible_progress: dialog, state.last_report: Connection Lost}
          - return: {}
      - if: "input.type == 'reconnection-running'"
        then:
          - set: {state.attempts: "= input.attempt"}
          - if: "state.visible_progress != 'none' || input.millis_since_last_incoming_data > config['remote-disconnect-prompt-time-ms']"
            then:
              - title: "Disconnected. Attempting to reconnect..."
                source: "src/vs/workbench/contrib/remote/browser/remote.ts:959-962"
                set: {state.visible_progress: dialog, state.last_report: "Disconnected. Attempting to reconnect..."}
          - return: {}
      - if: "input.type == 'reconnection-permanent-failure'"
        then:
          - title: Hide the progress
            source: "src/vs/workbench/contrib/remote/browser/remote.ts:1004"
            set: {state.visible_progress: none}
          - if: "input.handled"
            then:
              - title: Handled by the resolver; no notification
                source: "src/vs/workbench/contrib/remote/browser/remote.ts:1006-1007"
                return: {}
          - if: "!state.reload_window_shown"
            then:
              - title: "Cannot reconnect. Please reload the window."
                source: "src/vs/workbench/contrib/remote/browser/remote.ts:1007-1018"
                set: {state.reload_window_shown: true, state.last_report: "Cannot reconnect. Please reload the window."}
              - choice: reload
                default: reload-window
                options:
                  reload-window:
                    - call: command-service.execute-command
                      input: {command_id: workbench.action.reloadWindow, args: []}
                  dismiss: []
          - return: {}
      - if: "input.type == 'connection-gain'"
        then:
          - title: Connected again; hide the progress
            source: "src/vs/workbench/contrib/remote/browser/remote.ts:1021-1050"
            set: {state.visible_progress: none, state.attempts: "= input.attempt"}

  - {component: command-service, name: execute-command, kind: function, summary: "ICommandService.executeCommand (seam)", request: {type: object, required: [command_id], properties: {command_id: {type: string}, args: {type: array}}}, attributes: {boundary: true, owner: platform-core}}
