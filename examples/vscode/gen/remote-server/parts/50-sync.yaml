interfaces:
  # ---- enablement ----
  - component: user-data-sync-enablement-service
    name: is-enabled
    kind: function
    summary: "isEnabled: sync.enable in application storage"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncEnablementService.ts:34-46"]
    response: {type: object, properties: {enabled: {type: boolean}, resources: {type: object}}}
    behavior:
      - return: {enabled: "= state.enabled", resources: "= state.resources"}
  - component: user-data-sync-enablement-service
    name: set-enablement
    kind: function
    summary: "setEnablement: store sync.enable (only when a sync store is configured)"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncEnablementService.ts:48-53"]
    request: {type: object, properties: {enabled: {type: boolean}}}
    behavior:
      - set: {state.enabled: "= input.enabled"}
  - component: user-data-sync-enablement-service
    name: set-resource-enablement
    kind: function
    summary: "setResourceEnablement: enable or disable one synced resource"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncEnablementService.ts:67-75"]
    request: {type: object, properties: {resource: {type: string, examples: [extensions]}, enabled: {type: boolean}}}
    behavior:
      - set: {state.resources: "= merge(state.resources, {input.resource: input.enabled})"}

  # ---- auto sync ----
  - component: user-data-auto-sync-service
    name: turn-on
    kind: function
    summary: "turnOn: stop the pending machine disable, enable sync and start auto sync"
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:172-176"]
    behavior:
      - set: {state.disable_machine_eventually: false}
      - call: user-data-auto-sync-service.update-enablement
        input: {enabled: true}
  - component: user-data-auto-sync-service
    name: turn-off
    kind: function
    summary: "turnOff(everywhere, softTurnOffOnError, donotRemoveMachine): remove machine, disable, reset session, reset local or remote"
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:178-206"]
    request: {type: object, properties: {everywhere: {type: boolean, default: false}, soft: {type: boolean, default: false}, donot_remove_machine: {type: boolean, default: false}}}
    behavior:
      - call: user-data-sync-account-service.get-account
        input: {}
        as: acc
      - if: "vars.acc.value.account != null && !input.donot_remove_machine"
        then:
          - title: Remove this machine from the sync store
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:181-184"
            call: user-data-sync-machines-service.remove-current-machine
            input: {}
            as: rm
            on_error:
              - if: "!input.soft"
                then: [{fail: "= {'code': error.code, 'status': error.status, 'message': error.message}"}]
      - title: Disable auto sync and reset the session
        source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:186-190"
        call: user-data-auto-sync-service.update-enablement
        input: {enabled: false}
      - set: {state.session_id: ""}
      - if: "input.everywhere"
        then:
          - title: Reset remote and local data
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:192-196"
            call: user-data-sync-service.reset
            input: {}
        else:
          - call: user-data-sync-service.reset-local
            input: {}
  - component: user-data-auto-sync-service
    name: update-enablement
    kind: function
    summary: "updateEnablement + updateAutoSync: start or stop AutoSync"
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:208-213", "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:123-151"]
    request: {type: object, properties: {enabled: {type: boolean}}}
    behavior:
      - call: user-data-sync-enablement-service.set-enablement
        input: {enabled: "= input.enabled"}
      - call: user-data-auto-sync-service.is-auto-sync-enabled
        input: {}
        as: en
      - if: "vars.en.value.enabled && !state.auto_sync_running"
        then:
          - title: New AutoSync (5 min interval), started with an immediate sync
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:125-133"
            set: {state.auto_sync_running: true}
          - emit: user-data-auto-sync-service.auto-sync
            input: {reason: Interval}
      - if: "!vars.en.value.enabled"
        then:
          - title: Stop AutoSync
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:134-149"
            set: {state.auto_sync_running: false, state.suspend_message: "= vars.en.value.message"}
  - component: user-data-auto-sync-service
    name: is-auto-sync-enabled
    kind: function
    summary: "isAutoSyncEnabled: enabled, account present, not throttled by the server, not suspended."
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:153-170"]
    response: {type: object, properties: {enabled: {type: boolean}, message: {type: string}}}
    behavior:
      - call: user-data-sync-enablement-service.is-enabled
        input: {}
        as: e
      - if: "!vars.e.value.enabled"
        then: [{return: {enabled: false, message: "[AutoSync] Disabled."}}]
      - call: user-data-sync-account-service.get-account
        input: {}
        as: acc
      - if: "vars.acc.value.account == null"
        then:
          - title: Suspended until an auth token is available
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:157-159"
            return: {enabled: false, message: "[AutoSync] Suspended until auth token is available."}
      - call: user-data-sync-store-service.get-donot-make-requests-until
        input: {}
        as: until
      - if: "vars.until.value.until > now"
        then:
          - title: Server asked not to make requests until a time
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:160-162"
            return: {enabled: false, message: "[AutoSync] Suspended because server is not accepting requests."}
      - if: "state.suspend_until_restart"
        then:
          - title: Suspended until restart
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:163-165"
            return: {enabled: false, message: "[AutoSync] Suspended until restart."}
      - return: {enabled: true, message: ""}
  - component: user-data-auto-sync-service
    name: auto-sync
    kind: event
    summary: "AutoSync.sync -> doSync: run one sync task; on MethodNotFound clean remote data and retry once; then onDidFinishSync and wait the interval."
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:421-482"]
    request: {type: object, properties: {reason: {type: string, examples: [Interval]}}}
    behavior:
      - if: "!state.auto_sync_running"
        then:
          - title: AutoSync was disposed (sync turned off)
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:402-410"
            return: {ran: false}
      - set: {state.interval_runs: "= input.reason == 'Interval' ? state.interval_runs + 1 : state.interval_runs"}
      - call: user-data-auto-sync-service.create-and-run-sync-task
        input: {}
        as: run
        on_error: continue
      - if: "!vars.run.ok && vars.run.error.code == 'method-not-found'"
        then:
          - title: Client makes invalid requests; clean up remote data and retry
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:467-478"
            call: user-data-sync-service.clean-up-remote-data
            input: {}
          - call: user-data-auto-sync-service.create-and-run-sync-task
            input: {}
            as: run
            on_error: continue
      - title: onDidFinishSync
        source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:481"
        call: user-data-auto-sync-service.on-did-finish-sync
        input: {error_code: "= vars.run.ok ? '' : vars.run.error.code"}
      - if: "state.auto_sync_running"
        then:
          - title: Wait the interval and sync again
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:414-419"
            emit: user-data-auto-sync-service.auto-sync
            input: {reason: Interval}
            after_ms: "= config['settings-sync-auto-sync-interval-ms']"
            when: "input.reason != 'Activity' && state.interval_runs < 2"
      - return: {ran: true}
  - component: user-data-auto-sync-service
    name: create-and-run-sync-task
    kind: function
    summary: "createAndRunSyncTask: manifest, turned-off/session/machine checks, run the task"
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:484-550"]
    errors:
      - {code: turned-off, status: 0, retryable: false}
      - {code: session-expired, status: 0, retryable: false}
    behavior:
      - call: user-data-sync-service.create-sync-task
        input: {}
        as: task
      - if: "vars.task.value.manifest == null && vars.task.value.previously_synced"
        then:
          - title: "Server has no data but this machine synced before: turned off in the cloud"
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:491-502"
            fail: {code: turned-off, message: Cannot sync because syncing is turned off in the cloud}
      - if: "state.session_id != '' && vars.task.value.manifest != null && state.session_id != vars.task.value.manifest.session"
        then:
          - title: Server session differs from the client session
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:505-517"
            fail: {code: session-expired, message: Cannot sync because current session is expired}
      - call: user-data-sync-machines-service.get-machines
        input: {}
        as: machines
      - if: "vars.machines.value.current.disabled"
        then:
          - title: Turned off on this machine from another machine
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:525-530"
            fail: {code: turned-off, message: "Cannot sync because syncing is turned off on this machine from another machine."}
      - title: Run the sync task
        source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:533"
        call: user-data-sync-service.run-sync-task
        input: {manifest: "= vars.task.value.manifest"}
      - set: {state.session_id: "= vars.task.value.manifest != null ? vars.task.value.manifest.session : state.session_id"}
  - component: user-data-auto-sync-service
    name: on-did-finish-sync
    kind: function
    summary: "onDidFinishSync: reset failures, or turn off / suspend / count the failure depending on the error"
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:219-309"]
    request: {type: object, properties: {error_code: {type: string}}}
    behavior:
      - if: "input.error_code == ''"
        then:
          - set: {state.successive_failures: 0}
          - return: {handled: ok}
      - set: {state.last_error: "= input.error_code"}
      - if: "input.error_code in ['session-expired', 'turned-off', 'method-not-found', 'incompatible-local-content', 'incompatible-remote-content']"
        then:
          - title: Soft turn off (machine removed)
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:230-283"
            call: user-data-auto-sync-service.turn-off
            input: {everywhere: false, soft: true, donot_remove_machine: false}
          - return: {handled: turned-off}
      - if: "input.error_code == 'local-too-many-requests'"
        then:
          - title: Suspended until restart
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:243-248"
            set: {state.suspend_until_restart: true, state.auto_sync_running: false}
          - return: {handled: suspended}
      - if: "input.error_code in ['remote-too-many-requests', 'upgrade-required', 'gone']"
        then:
          - title: Soft turn off keeping the machine, and disable the machine eventually (10 min)
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:250-270"
            call: user-data-auto-sync-service.turn-off
            input: {everywhere: false, soft: true, donot_remove_machine: true}
          - set: {state.disable_machine_eventually: true}
          - return: {handled: turned-off}
      - title: Other errors count as successive failures (trigger delay backs off)
        source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:300-304"
        set: {state.successive_failures: "= state.successive_failures + 1"}
      - return: {handled: counted}
  - component: user-data-auto-sync-service
    name: trigger-sync
    kind: function
    summary: "triggerSync(sources): debounced activity sync (3 s, or 0 when the last sync is older than 10 s; linear back-off on failures)"
    sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:337-358"]
    request: {type: object, properties: {sources: {type: array, items: {type: string}, examples: [[settings]]}}}
    behavior:
      - if: "!state.auto_sync_running"
        then:
          - title: No AutoSync; cancel the trigger
            source: "src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:338-340"
            return: {triggered: false}
      - emit: user-data-auto-sync-service.auto-sync
        input: {reason: Activity}
        after_ms: "= state.successive_failures > 0 ? (int(config['settings-sync-trigger-delay-ms']) * state.successive_failures > 60000 ? 60000 : int(config['settings-sync-trigger-delay-ms']) * state.successive_failures) : int(config['settings-sync-trigger-delay-ms'])"
      - return: {triggered: true}

  # ---- sync service ----
  - component: user-data-sync-service
    name: create-sync-task
    kind: function
    summary: "createSyncTask: requires enablement; fetches the manifest"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:119-135"]
    errors: [{code: not-enabled, status: 0, retryable: false}]
    behavior:
      - call: user-data-sync-enablement-service.is-enabled
        input: {}
        as: en
      - if: "!vars.en.value.enabled"
        then:
          - title: Not enabled
            source: "src/vs/platform/userDataSync/common/userDataSyncService.ts:639-642"
            fail: {code: not-enabled, message: Not enabled}
      - title: Fetch the manifest
        source: "src/vs/platform/userDataSync/common/userDataSyncService.ts:130"
        call: user-data-sync-store-service.manifest
        input: {}
        as: m
      - return: {manifest: "= vars.m.value.manifest", previously_synced: "= state.previously_synced"}
  - component: user-data-sync-service
    name: run-sync-task
    kind: function
    summary: "task.run -> sync(): status Syncing, sync each enabled synchroniser (default profile first), bail out on fatal errors"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:141-151", "src/vs/platform/userDataSync/common/userDataSyncService.ts:233-259", "src/vs/platform/userDataSync/common/userDataSyncService.ts:750-798"]
    request: {type: object, properties: {manifest: {type: [object, "null"]}}}
    behavior:
      - if: "state.status != 'has-conflicts'"
        then: [{set: {state.status: syncing}}]
      - call: user-data-sync-enablement-service.is-enabled
        input: {}
        as: en
      - if: "vars.en.value.resources.settings"
        then:
          - call: settings-synchroniser.sync
            input: {}
            as: s
            on_error:
              - if: "error.code in ['method-not-found', 'too-large', 'remote-too-many-requests', 'too-many-requests-and-retry-after', 'local-too-many-requests', 'gone', 'upgrade-required', 'incompatible-remote-content', 'incompatible-local-content']"
                then:
                  - title: canBailout errors abort the whole sync
                    source: "src/vs/platform/userDataSync/common/userDataSyncService.ts:780-784"
                    set: {state.status: idle}
                  - fail: "= {'code': error.code, 'status': error.status, 'message': error.message}"
      - title: Status from the synchronisers (HasConflicts wins)
        source: "src/vs/platform/userDataSync/common/userDataSyncService.ts:869-878"
        call: settings-synchroniser.get-status
        input: {}
        as: st
      - set: {state.status: "= vars.st.value.status == 'has-conflicts' ? 'has-conflicts' : 'idle'", state.conflicts: "= vars.st.value.status == 'has-conflicts' ? ['settings'] : []", state.last_sync_time: "= now", state.previously_synced: true}
  - component: user-data-sync-service
    name: get-status
    kind: function
    summary: "status and conflicts"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:68-72"]
    behavior:
      - return: {status: "= state.status", conflicts: "= state.conflicts", last_sync_time: "= state.last_sync_time"}
  - component: user-data-sync-service
    name: accept
    kind: function
    summary: "accept(resource, content, apply): resolve a conflict with the local or remote version"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:369-382"]
    request: {type: object, properties: {resource: {type: string, examples: [settings]}, side: {type: string, enum: [local, remote], examples: [remote]}}}
    behavior:
      - call: settings-synchroniser.accept
        input: {side: "= input.side"}
      - set: {state.status: idle, state.conflicts: []}
  - component: user-data-sync-service
    name: replace
    kind: function
    summary: "replace(handle): replace the local resource with a synced version"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:345-367"]
    behavior:
      - call: settings-synchroniser.accept
        input: {side: remote}
  - component: user-data-sync-service
    name: reset
    kind: function
    summary: "reset: resetRemote + resetLocal"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:405-410"]
    behavior:
      - call: user-data-sync-store-endpoint.delete-collection
        input: {}
      - call: user-data-sync-service.reset-local
        input: {}
  - component: user-data-sync-service
    name: reset-local
    kind: function
    summary: "resetLocal: forget last-sync state"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:422-436"]
    behavior:
      - set: {state.previously_synced: false, state.status: idle, state.conflicts: []}
  - component: user-data-sync-service
    name: clean-up-remote-data
    kind: function
    summary: "cleanUpRemoteData: delete stale remote collections/resources"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:478-502"]
    behavior:
      - call: user-data-sync-store-endpoint.delete-collection
        input: {}
  - component: user-data-sync-service
    name: save-remote-activity-data
    kind: function
    summary: "saveRemoteActivityData: download remote sync data into a file"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:504-508"]
    request: {type: object, properties: {location: {type: string, examples: ["file:///home/dev/Downloads/sync-activity.json"]}}}
    behavior:
      - call: user-data-sync-store-service.manifest
        input: {}
        as: m
      - call: disk.write-file
        input: {resource: "= input.location", content: manifest.json}

  # ---- settings synchroniser ----
  - component: settings-synchroniser
    name: sync
    kind: function
    summary: "AbstractSynchroniser.sync for settings: skip while conflicts/syncing; merge; conflict, apply local or remote changes."
    sources: ["src/vs/platform/userDataSync/common/abstractSynchronizer.ts:215-249", "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:322-355"]
    errors:
      - {code: incompatible-local-content, status: 0, retryable: false}
    behavior:
      - if: "state.status == 'has-conflicts'"
        then:
          - title: Skipped as there are conflicts
            source: "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:219-222"
            return: {skipped: true}
      - set: {state.status: syncing}
      - title: Latest remote settings
        source: "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:233-235"
        call: user-data-sync-store-service.read-resource
        input: {resource: settings}
        as: remote
        on_error:
          - set: {state.status: idle}
          - fail: "= {'code': error.code, 'status': error.status, 'message': error.message}"
      - if: "has(vars.remote.value.version) && vars.remote.value.version > 2"
        then:
          - title: Remote data from a newer client version
            source: "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:323-325"
            set: {state.status: idle}
          - fail: {code: incompatible-local-content, message: "Cannot sync settings as its local version is not compatible with its remote version"}
      - title: Merge local, remote and last-synced content
        source: "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:357-400"
        choice: merge
        default: no-changes
        options:
          no-changes:
            - set: {state.status: idle}
          local-changes:
            - title: Push local settings (412/Conflict -> sync again with fresh remote)
              source: "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:339-350"
              call: user-data-sync-store-service.write-resource
              input: {resource: settings, content: "{\"editor.fontSize\": 14}"}
              retry: {max_attempts: 2, codes: [precondition-failed, conflict], title: "New remote version available. Synchronizing again..."}
            - set: {state.status: idle}
          remote-changes:
            - title: Back up, then write the remote settings to settings.json
              source: "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:400-410"
              call: user-data-sync-local-store-service.write-resource
              input: {resource: settings}
            - foreach: "= vars.remote.value.content"
              as: val
              index: key
              steps:
                - call: settings-store.user-write
                  input: {key: "= vars.key", value: "= vars.val"}
            - set: {state.status: idle}
          conflict:
            - title: Conflicts detected
              source: "src/vs/platform/userDataSync/common/abstractSynchronizer.ts:391-395"
              set: {state.status: has-conflicts}
      - return: {skipped: false, status: "= state.status"}
  - component: settings-synchroniser
    name: get-status
    kind: function
    summary: "synchroniser status"
    sources: ["src/vs/platform/userDataSync/common/abstractSynchronizer.ts:125-140"]
    behavior:
      - return: {status: "= state.status"}
  - component: settings-synchroniser
    name: accept
    kind: function
    summary: "accept(resource, content) then apply"
    sources: ["src/vs/platform/userDataSync/common/abstractSynchronizer.ts:412-430"]
    request: {type: object, properties: {side: {type: string}}}
    behavior:
      - if: "input.side == 'remote'"
        then:
          - call: settings-store.user-write
            input: {key: editor.fontSize, value: 14}
        else:
          - call: user-data-sync-store-service.write-resource
            input: {resource: settings, content: "{}"}
      - set: {state.status: idle}
  - component: user-data-sync-local-store-service
    name: write-resource
    kind: function
    summary: "writeResource: back up a resource under the sync home"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncLocalStoreService.ts:18-40"]
    behavior:
      - return: {}

  # ---- store client ----
  - component: user-data-sync-store-service
    name: get-donot-make-requests-until
    kind: function
    summary: "donotMakeRequestsUntil"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:174-175"]
    behavior:
      - return: {until: "= state.donot_make_requests_until"}
  - component: user-data-sync-store-service
    name: manifest
    kind: http
    attributes: {method: GET, path: /manifest}
    summary: "manifest(): GET <store>/manifest; requires a configured store"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:408-440"]
    errors: [{code: no-settings-sync-store-url-configured, status: 0, retryable: false}]
    behavior:
      - call: user-data-sync-store-management-service.get-user-data-sync-store
        input: {}
        as: store
      - if: "vars.store.value.url == ''"
        then:
          - title: No settings sync store url configured
            source: "src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:409-411"
            fail: {code: no-settings-sync-store-url-configured, message: No settings sync store url configured.}
      - call: user-data-sync-store-service.request
        input: {path: manifest}
        as: r
      - return: {manifest: "= vars.r.value.body"}
  - component: user-data-sync-store-service
    name: read-resource
    kind: http
    attributes: {method: GET}
    summary: "readResource: GET <store>/resource/<name>/latest"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:348-383"]
    request: {type: object, properties: {resource: {type: string}}}
    behavior:
      - call: user-data-sync-store-service.request
        input: {path: "= 'resource/' + input.resource + '/latest'"}
        as: r
      - return: "= vars.r.value.body"
  - component: user-data-sync-store-service
    name: write-resource
    kind: http
    attributes: {method: POST}
    summary: "writeResource: POST <store>/resource/<name> with If-Match ref"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:385-406"]
    request: {type: object, properties: {resource: {type: string}, content: {type: string}}}
    behavior:
      - call: user-data-sync-store-service.request
        input: {path: "= 'resource/' + input.resource", content: "= input.content"}
        as: r
      - return: "= vars.r.value.body"
  - component: user-data-sync-store-service
    name: request
    kind: http
    summary: "request(): auth token, Retry-After window, per-session limit, then status mapping (401/403/404/405/409/410/412/413/426/429)."
    sources: ["src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:555-684"]
    request: {type: object, properties: {path: {type: string}, content: {type: string}}}
    errors:
      - {code: unauthorized, status: 401, retryable: false}
      - {code: forbidden, status: 403, retryable: false}
      - {code: not-found, status: 404, retryable: false}
      - {code: method-not-found, status: 405, retryable: false}
      - {code: conflict, status: 409, retryable: false}
      - {code: gone, status: 410, retryable: false}
      - {code: precondition-failed, status: 412, retryable: false}
      - {code: too-large, status: 413, retryable: false}
      - {code: upgrade-required, status: 426, retryable: false}
      - {code: remote-too-many-requests, status: 429, retryable: false}
      - {code: too-many-requests-and-retry-after, status: 429, retryable: false}
      - {code: local-too-many-requests, status: 0, retryable: false}
      - {code: unknown, status: 0, retryable: false}
    behavior:
      - call: user-data-sync-account-service.get-account
        input: {}
        as: acc
      - if: "vars.acc.value.account == null"
        then:
          - title: No Auth Token Available
            source: "src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:556-558"
            fail: {code: unauthorized, status: 401, message: No Auth Token Available}
      - if: "state.donot_make_requests_until > now"
        then:
          - title: Still inside the server's Retry-After window
            source: "src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:560-562"
            fail: {code: too-many-requests-and-retry-after, status: 429, message: "failed because of too many requests (429)."}
      - if: "state.session_start > 0 && now - state.session_start > config['settings-sync-request-session-interval-ms']"
        then:
          - set: {state.session_requests: 0, state.session_start: 0}
      - if: "state.session_requests >= config['settings-sync-request-session-limit']"
        then:
          - title: Local per-session request limit
            source: "src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:741-744"
            fail: {code: local-too-many-requests, message: "Too many requests. Only 100 requests allowed in 5 minutes."}
      - set: {state.session_requests: "= state.session_requests + 1", state.session_start: "= state.session_start == 0 ? now : state.session_start"}
      - call: user-data-sync-store-endpoint.handle
        input: {path: "= input.path"}
        as: res
      - if: "vars.res.value.status == 304 || (vars.res.value.status >= 200 && vars.res.value.status < 300)"
        then: [{return: "= vars.res.value"}]
      - set: {vars.st: "= vars.res.value.status"}
      - if: "vars.st == 429 && vars.res.value.retry_after_s > 0"
        then:
          - title: 429 with Retry-After stores donotMakeRequestsUntil
            source: "src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:670-675"
            set: {state.donot_make_requests_until: "= now + vars.res.value.retry_after_s * 1000"}
          - fail: {code: too-many-requests-and-retry-after, status: 429, message: "failed because of too many requests (429)."}
      - title: Map the HTTP status to a UserDataSyncErrorCode
        source: "src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:628-682"
        fail: "= {'code': {401: 'unauthorized', 403: 'forbidden', 404: 'not-found', 405: 'method-not-found', 409: 'conflict', 410: 'gone', 412: 'precondition-failed', 413: 'too-large', 426: 'upgrade-required', 429: 'remote-too-many-requests'}[vars.st], 'status': vars.st, 'message': 'Server returned ' + string(vars.st)}"
  - component: user-data-sync-store-endpoint
    name: handle
    kind: http
    summary: "Sync server: answers with the configured status (state-driven)"
    request: {type: object, properties: {path: {type: string}}}
    behavior:
      - if: "has(state.respond_status) && state.respond_status != 200"
        then:
          - return: {status: "= state.respond_status", retry_after_s: "= has(state.retry_after_s) ? state.retry_after_s : 0", body: null}
      - if: "input.path == 'manifest'"
        then: [{return: {status: 200, retry_after_s: 0, body: "= has(state.manifest) ? state.manifest : null"}}]
      - return: {status: 200, retry_after_s: 0, body: "= state.settings"}
  - component: user-data-sync-store-endpoint
    name: delete-collection
    kind: http
    attributes: {method: DELETE}
    summary: "DELETE resources/collections"
    behavior:
      - set: {state.manifest: null}

  - component: user-data-sync-account-service
    name: get-account
    kind: function
    summary: "account"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncAccount.ts:27-60"]
    behavior:
      - return: {account: "= has(state.account) ? state.account : null"}
  - component: user-data-sync-machines-service
    name: get-machines
    kind: function
    summary: "getMachines: machines from the store, flagging the current one"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncMachines.ts:102-115"]
    behavior:
      - return: {current: "= state.current_machine"}
  - component: user-data-sync-machines-service
    name: remove-current-machine
    kind: function
    summary: "removeCurrentMachine"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncMachines.ts:117-125"]
    behavior:
      - set: {state.current_machine: "= merge(state.current_machine, {'registered': false})"}
  - component: user-data-sync-machines-service
    name: rename-machine
    kind: function
    summary: "renameMachine"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncMachines.ts:127-138"]
    request: {type: object, properties: {name: {type: string, examples: [work-laptop]}}}
    behavior:
      - set: {state.current_machine: "= merge(state.current_machine, {'name': input.name})"}
  - component: user-data-sync-machines-service
    name: set-enablements
    kind: function
    summary: "setEnablements: turn sync off on a machine"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncMachines.ts:140-155"]
    request: {type: object, properties: {disabled: {type: boolean}}}
    behavior:
      - set: {state.current_machine: "= merge(state.current_machine, {'disabled': input.disabled})"}
  - {component: settings-store, name: user-write, kind: io, summary: "Shared io: set one key in the user settings.json", request: {type: object, required: [key], properties: {key: {type: string, examples: [files.autoSave]}, value: {}}}, attributes: {boundary: true, owner: shared}}

flows:
  - {id: rs-sync-turn-on, name: "Turn on settings sync (auto sync)", tags: [writes], entry: {caller: workbench, interface: user-data-auto-sync-service.turn-on}, sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:172"]}
  - {id: rs-sync-turn-off, name: "Turn off settings sync", tags: [writes], entry: {caller: workbench, interface: user-data-auto-sync-service.turn-off}, sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:178"]}
  - {id: rs-sync-trigger, name: "Activity-triggered sync", tags: [writes], entry: {caller: workbench, interface: user-data-auto-sync-service.trigger-sync}, sources: ["src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:337"]}
  - {id: rs-sync-status, name: "Read sync status and conflicts", entry: {caller: workbench, interface: user-data-sync-service.get-status}, sources: ["src/vs/platform/userDataSync/common/userDataSyncService.ts:68"]}
  - {id: rs-sync-enablement, name: "Read sync enablement", entry: {caller: workbench, interface: user-data-sync-enablement-service.is-enabled}, sources: ["src/vs/platform/userDataSync/common/userDataSyncEnablementService.ts:34"]}

scenarios:
  - id: remote-server-sync-turn-on-oss-no-store
    fixtures: [one-window-folder]
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-status, as: st}
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'no-settings-sync-store-url-configured' && state['user-data-auto-sync-service'].successive_failures >= 1"
      - "steps.st.result.value.last_sync_time == 0 && state['user-data-sync-store-service'].session_requests == 0"
  - id: remote-server-sync-turn-on-then-status
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-status, as: st}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "steps.en.result.value.enabled && state['user-data-auto-sync-service'].auto_sync_running"
      - "steps.st.result.value.status == 'idle' && steps.st.result.value.last_sync_time > 0"
      - "state['user-data-auto-sync-service'].session_id == 'session-1'"
  - id: remote-server-sync-interval-repeats
    flow: rs-sync-turn-on
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    faults: [{target: user-data-auto-sync-service.auto-sync, type: error, code: stop, calls: [3]}]
    expect:
      - "calls['user-data-sync-store-service.manifest'] == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'user-data-auto-sync-service.auto-sync')[1].t >= config['settings-sync-auto-sync-interval-ms']"
      - "state['user-data-sync-service'].previously_synced"
  - id: remote-server-sync-conflict-then-accept
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    choices: {settings-synchroniser.sync.merge: conflict}
    faults: [{target: user-data-auto-sync-service.auto-sync, type: error, code: stop, calls: [2]}]
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-status, as: st}
    expect:
      - "steps.st.result.value.status == 'has-conflicts' && steps.st.result.value.conflicts == ['settings']"
      - "state['settings-synchroniser'].status == 'has-conflicts'"
  - id: remote-server-sync-merge-outcomes
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-enablement-service: {enabled: true}, user-data-auto-sync-service: {auto_sync_running: true}}
    choices: {settings-synchroniser.sync.merge: remote-changes}
    steps:
      - {flow: rs-sync-trigger, as: t, input: {sources: [settings]}}
      - {flow: rs-sync-status, as: st}
    expect:
      - "steps.t.result.value.triggered && calls['settings-store.user-write'] >= 1 && calls['user-data-sync-local-store-service.write-resource'] >= 1"
      - "state['user-data-sync-service'].status == 'idle'"
  - id: remote-server-sync-push-local-retries-on-412
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-enablement-service: {enabled: true}, user-data-auto-sync-service: {auto_sync_running: true}}
    choices: {settings-synchroniser.sync.merge: local-changes}
    faults: [{target: user-data-sync-store-service.write-resource, type: error, code: precondition-failed, status: 412, calls: [1]}, {target: user-data-auto-sync-service.auto-sync, type: error, code: stop, calls: [2]}]
    steps:
      - {flow: rs-sync-trigger, as: t, input: {sources: [settings]}}
      - {flow: rs-sync-status, as: st}
    expect:
      - "retries == 1 && calls['user-data-sync-store-service.write-resource'] == 2"
      - "state['user-data-sync-service'].status == 'idle' && steps.st.result.ok"
  - id: remote-server-sync-trigger-without-auto-sync
    fixtures: [one-window-folder]
    steps:
      - {flow: rs-sync-trigger, as: t, input: {sources: [settings]}}
      - {flow: rs-sync-status, as: st}
    expect:
      - "!steps.t.result.value.triggered && state['user-data-auto-sync-service'].auto_sync_running == false"
  - id: remote-server-sync-errors-turn-off
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-store-endpoint: {respond_status: 410}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "!steps.en.result.value.enabled && state['user-data-auto-sync-service'].disable_machine_eventually"
      - "state['user-data-auto-sync-service'].last_error == 'gone' && state['user-data-sync-machines-service'].current_machine.registered"
  - id: remote-server-sync-session-expired-turns-off
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-auto-sync-service: {session_id: session-0}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "!steps.en.result.value.enabled && state['user-data-auto-sync-service'].last_error == 'session-expired'"
      - "!state['user-data-sync-machines-service'].current_machine.registered && state['user-data-auto-sync-service'].session_id == ''"
  - id: remote-server-sync-turned-off-in-cloud-and-machine
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-store-endpoint: {manifest: null}, user-data-sync-service: {previously_synced: true}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'turned-off' && !steps.en.result.value.enabled"
  - id: remote-server-sync-machine-disabled-elsewhere
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-machines-service: {current_machine: {id: machine-1, name: dev-laptop, disabled: true, registered: true}}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'turned-off' && !steps.en.result.value.enabled"
  - id: remote-server-sync-retry-after-suspends
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-store-endpoint: {respond_status: 429, retry_after_s: 600}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-turn-on, as: again}
      - {flow: rs-sync-status, as: st}
    expect:
      - "state['user-data-sync-store-service'].donot_make_requests_until > 0"
      - "state['user-data-auto-sync-service'].successive_failures >= 1"
      - "state['user-data-auto-sync-service'].last_error == 'too-many-requests-and-retry-after'"
  - id: remote-server-sync-remote-429-and-local-limit
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-store-endpoint: {respond_status: 429}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'remote-too-many-requests' && state['user-data-auto-sync-service'].disable_machine_eventually"
  - id: remote-server-sync-local-request-limit
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1", settings-sync-request-session-limit: 0}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "state['user-data-auto-sync-service'].suspend_until_restart && !state['user-data-auto-sync-service'].auto_sync_running"
      - "steps.en.result.value.enabled"
  - id: remote-server-sync-method-not-found-cleans-and-retries
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-store-endpoint: {respond_status: 405}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "calls['user-data-sync-service.clean-up-remote-data'] == 1 && state['user-data-auto-sync-service'].last_error == 'method-not-found'"
      - "!steps.en.result.value.enabled"
  - id: remote-server-sync-http-statuses
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-store-endpoint: {respond_status: 401}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-status, as: st}
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'unauthorized' && state['user-data-auto-sync-service'].successive_failures >= 1"
  - id: remote-server-sync-no-account-and-incompatible
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-account-service: {account: null}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "steps.en.result.value.enabled && !state['user-data-auto-sync-service'].auto_sync_running"
      - "state['user-data-auto-sync-service'].suspend_message == '[AutoSync] Suspended until auth token is available.'"
  - id: remote-server-sync-incompatible-remote-version
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-store-endpoint: {settings: {ref: ref-s2, version: 9}}}
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'incompatible-local-content' && !steps.en.result.value.enabled"
  - id: remote-server-sync-skips-while-conflicts
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {settings-synchroniser: {status: has-conflicts}, user-data-sync-service: {status: has-conflicts}}
    faults: [{target: user-data-auto-sync-service.auto-sync, type: error, code: stop, calls: [2]}]
    steps:
      - {flow: rs-sync-turn-on, as: turnon}
      - {flow: rs-sync-status, as: st}
    expect:
      - "steps.st.result.value.status == 'has-conflicts' && calls['user-data-sync-store-service.read-resource'] == 0"
      - "state['settings-synchroniser'].status == 'has-conflicts' && state['user-data-auto-sync-service'].session_id == 'session-1'"
  - id: remote-server-sync-turn-off-everywhere
    fixtures: [one-window-folder]
    state: {user-data-sync-enablement-service: {enabled: true}, user-data-auto-sync-service: {auto_sync_running: true}, user-data-sync-service: {previously_synced: true}}
    steps:
      - {flow: rs-sync-turn-off, as: turnoff, input: {everywhere: true, soft: false, donot_remove_machine: false}}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "!steps.en.result.value.enabled && !state['user-data-sync-service'].previously_synced"
      - "state['user-data-sync-store-endpoint'].manifest == null && !state['user-data-sync-machines-service'].current_machine.registered"
  - id: remote-server-sync-turn-off-machine-removal-fails
    fixtures: [one-window-folder]
    state: {user-data-sync-enablement-service: {enabled: true}}
    faults: [{target: user-data-sync-machines-service.remove-current-machine, type: error, code: unauthorized, status: 401}]
    steps:
      - {flow: rs-sync-turn-off, as: hard, input: {everywhere: false, soft: false, donot_remove_machine: false}}
      - {flow: rs-sync-turn-off, as: soft, input: {everywhere: false, soft: true, donot_remove_machine: false}}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "steps.hard.result.error.code == 'unauthorized' && steps.soft.result.ok"
      - "!state['user-data-sync-enablement-service'].enabled"
  - id: remote-server-sync-guard-branches
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    steps:
      - {flow: rs-sync-trigger, as: noaccount, input: {sources: [settings]}}
      - {flow: rs-sync-status, as: st}
    state: {user-data-sync-enablement-service: {enabled: false}, user-data-auto-sync-service: {auto_sync_running: true, suspend_until_restart: true}}
    faults: [{target: user-data-auto-sync-service.auto-sync, type: error, code: stop, calls: [2]}]
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'not-enabled' && steps.st.result.value.last_sync_time == 0"
  - id: remote-server-sync-no-auth-token
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-sync-enablement-service: {enabled: true}, user-data-auto-sync-service: {auto_sync_running: true}, user-data-sync-account-service: {account: null}}
    steps:
      - {flow: rs-sync-trigger, as: t, input: {sources: [settings]}}
      - {flow: rs-sync-status, as: st}
    expect:
      - "state['user-data-auto-sync-service'].last_error == 'unauthorized' && calls['user-data-sync-store-endpoint.handle'] == 0"
  - id: remote-server-sync-suspended-until-restart
    fixtures: [one-window-folder]
    config: {product-configuration-sync-store-url: "https://sync.example/v1"}
    state: {user-data-auto-sync-service: {suspend_until_restart: true}}
    steps:
      - {flow: rs-sync-turn-on, as: t}
      - {flow: rs-sync-enablement, as: en}
    expect:
      - "steps.en.result.value.enabled && state['user-data-auto-sync-service'].suspend_message == '[AutoSync] Suspended until restart.'"
