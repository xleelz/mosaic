    summary: "getCompatibleExtension: the gallery version compatible with this product, or null"
    sources: ["src/vs/platform/extensionManagement/common/extensionGalleryService.ts:1003-1012"]
    request: {type: object, properties: {id: {type: string}}}
    behavior:
      - call: marketplace-gallery-endpoint.extension-query
        input: {ids: ["= input.id"]}
        as: q
      - if: "size(vars.q.value.extensions) == 0 || !vars.q.value.extensions[0].compatible"
        then: [{return: null}]
      - return: "= vars.q.value.extensions[0]"
  - component: extension-gallery-service
