schemas:
  - id: RemoteServerGalleryExtension
    schema:
      type: object
      properties:
        id: {type: string, examples: [ms-python.python]}
        publisher: {type: string, examples: [ms-python]}
        version: {type: string, examples: ["2026.18.0"]}
        signed: {type: boolean, default: true}
        compatible: {type: boolean, default: true}
        last_updated: {type: integer}
  - id: RemoteServerLocalExtension
    schema:
      type: object
      properties:
        id: {type: string, examples: [ms-python.python]}
        version: {type: string, examples: ["2026.18.0"]}
        source: {type: string, enum: [gallery, vsix, resource]}
        pinned: {type: boolean, default: false}
        is_builtin: {type: boolean, default: false}
        installed_timestamp: {type: integer}
  - id: RemoteServerInstallRequest
    schema:
      type: object
      required: [id]
      properties:
        id: {type: string, examples: [ms-python.python]}
        version: {type: string, default: ""}
        install_pre_release_version: {type: boolean, default: false}
        pinned: {type: boolean, default: false}

interfaces:
  # ---- ExtensionsWorkbenchService (renderer) ----
  - component: extensions-workbench-service
    name: install
    kind: function
    summary: "IExtensionsWorkbenchService.install by id: built-in check, gallery lookup, malicious check, then install from gallery."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2597-2624", "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2626-2725"]
    request: RemoteServerInstallRequest
    response: RemoteServerLocalExtension
    errors:
      - {code: not-found, status: 0, retryable: false, summary: "ExtensionManagementErrorCode.NotFound: no gallery extension for the id"}
      - {code: malicious, status: 0, retryable: false}
      - {code: no-extension-gallery-service-configured, status: 0, retryable: false}
    behavior:
      - title: Look up the extension among the installed built-ins
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2637-2645"
        call: extensions-scanner-service.get-system-extension
        input: {id: "= input.id"}
        as: sys
      - if: "has(vars.sys.value.id) && !(input.id in config['product-builtin-extensions-enabled-with-auto-updates'])"
        then:
          - title: "Built-in extension: no gallery lookup, so it is reported as not found"
            detail: "A built-in that is not in product.builtInExtensionsEnabledWithAutoUpdates gets no installableInfo, so gallery stays undefined and _install throws NotFound."
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2704-2714"
            fail: {code: not-found, message: "= \"The extension '\" + input.id + \"' cannot be installed because it was not found.\""}
      - if: "has(vars.sys.value.id)"
        then:
          - title: Built-in enabled with auto updates is returned as is
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2640-2642"
            return: "= vars.sys.value"
      - title: Query the gallery for the id (and version)
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2661-2664"
        call: extension-gallery-service.get-extensions
        input: {ids: ["= input.id"]}
        as: gallery
      - if: "size(vars.gallery.value.extensions) == 0"
        then:
          - title: Not in the gallery
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2709-2714"
            fail: {code: not-found, message: "= \"The extension '\" + input.id + \"' cannot be installed because it was not found.\""}
      - if: "vars.gallery.value.extensions[0].malicious"
        then:
          - title: Reported as problematic
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2671-2673"
            fail: {code: malicious, message: "This extension is reported to be problematic."}
      - title: Install from gallery (pinned unless it should auto update)
        detail: "installFromGallery goes through the workbench ExtensionManagementService (workbench-shell), which routes to the local server's 'extensions' channel in the shared process."
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:3072-3081"
        call: extension-management-service.install-from-gallery
        input: {gallery: "= vars.gallery.value.extensions[0]", pinned: "= input.pinned || input.version != ''"}
        as: installed
      - return: "= vars.installed.value"

  - component: extensions-workbench-service
    name: query-local
    kind: function
    summary: "queryLocal: the installed extensions of every extension management server."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1412-1452"]
    response: {type: object, properties: {user: {type: array}, system: {type: array}}}
    behavior:
      - title: Query the local server's installed extensions
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1425-1431"
        call: extension-management-service.get-installed
        input: {}
        as: inst
      - return: "= vars.inst.value"

  - component: extensions-workbench-service
    name: uninstall
    kind: function
    summary: "uninstall: needs a local extension; uninstalls it (and its pack) through the extension management service."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2835-2870"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [ms-python.python]}}}
    errors: [{code: missing-local, status: 0, retryable: false}]
    behavior:
      - call: extensions-profile-scanner-service.get-profile-extension
        input: {id: "= input.id"}
        as: local
      - if: "!has(vars.local.value.id)"
        then:
          - title: "Missing local"
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2836-2839"
            fail: {code: missing-local, message: Missing local}
      - call: extension-management-service.uninstall
        input: {id: "= input.id"}

  - component: extensions-workbench-service
    name: open-search
    kind: function
    summary: "openSearch: opens the Extensions view container and runs the search text."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1705-1715"]
    request: {type: object, properties: {search: {type: string, examples: ["@recommended"]}}}
    behavior:
      - title: Open the Extensions viewlet
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1706"
        call: views-service.open-view-container
        input: {id: workbench.view.extensions, focus: true}
      - title: Search in the viewlet
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1711"
        set: {state.last_search: "= input.search"}
      - return: {search: "= input.search"}

  - component: extensions-workbench-service
    name: open
    kind: function
    summary: "open: finds the extension (installed, else gallery) and opens its editor; fails when not found."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1693-1703"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [ms-python.python]}}}
    errors: [{code: extension-not-found, status: 0, retryable: false}]
    behavior:
      - call: extensions-profile-scanner-service.get-profile-extension
        input: {id: "= input.id"}
        as: local
      - if: "!has(vars.local.value.id)"
        then:
          - call: extension-gallery-service.get-extensions
            input: {ids: ["= input.id"]}
            as: g
          - if: "size(vars.g.value.extensions) == 0"
            then:
              - title: Extension not found
                source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1698-1700"
                fail: {code: extension-not-found, message: "= 'Extension not found. ' + input.id"}
      - title: Open the extension editor
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1702"
        call: editor-service.open-editor
        input: {resource: "= 'extension:' + input.id"}
      - set: {state.opened_extension: "= input.id"}

  - component: extensions-workbench-service
    name: initialize-auto-update
    kind: event
    summary: "After LifecyclePhase.Eventually: starts the periodic update check (ThrottledDelayer every UpdatesCheckInterval)."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1094-1108", "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1134-1160"]
    behavior:
      - title: Check for updates now, then every interval
        detail: "eventuallyCheckForUpdates re-arms the ThrottledDelayer after each check; modeled as a periodic timer with two passes."
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2223-2231"
        emit: extensions-workbench-service.eventually-check-for-updates
        input: {}
        every_ms: "= config['extensions-updates-check-interval-ms']"
        count: 2

  - component: extensions-workbench-service
    name: eventually-check-for-updates
    kind: event
    summary: "One tick of the update-check timer: checks only when extensions.autoCheckUpdates is on."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2223-2231"]
    behavior:
      - set: {state.update_checks: "= state.update_checks + 1"}
      - if: "config['extensions-auto-check-updates']"
        then:
          - call: extensions-workbench-service.check-for-updates
            input: {}
        else:
          - title: Automatic update checks are off
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2226-2228"
            set: {ctx.update_check_skipped: true}

  - component: extensions-workbench-service
    name: check-for-updates
    kind: function
    summary: "checkForUpdates: query the gallery for installed user extensions, mark the outdated ones, then auto update."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2030-2087", "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2195-2214"]
    response: {type: object, properties: {checked: {type: boolean}, outdated: {type: array}}}
    behavior:
      - call: extension-gallery-service.is-enabled
        input: {}
        as: enabled
      - if: "!vars.enabled.value.enabled"
        then:
          - title: No gallery, nothing to check
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2036-2038"
            return: {checked: false, outdated: []}
      - title: Installed user extensions (built-in system extensions are skipped)
        source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2054-2062"
        call: extensions-profile-scanner-service.scan-profile-extensions
        input: {}
        as: inst
      - set: {vars.outdated: []}
      - foreach: "= vars.inst.value"
        as: ext
        steps:
          - call: extension-gallery-service.get-extensions
            input: {ids: ["= vars.ext.id"]}
            as: g
          - if: "size(vars.g.value.extensions) > 0 && vars.g.value.extensions[0].version != vars.ext.version"
            then:
              - title: A newer gallery version marks the extension outdated
                source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:741-760"
                set: {vars.outdated: "= vars.outdated + [merge(vars.ext, {'gallery': vars.g.value.extensions[0]})]"}
      - set: {state.outdated: "= vars.outdated.map(o, o.id)"}
      - if: "size(vars.outdated) > 0"
        then:
          - title: Auto update the outdated extensions
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2209-2213"
            call: extensions-workbench-service.auto-update-extensions
            input: {outdated: "= vars.outdated"}
      - return: {checked: true, outdated: "= vars.outdated.map(o, o.id)"}

  - component: extensions-workbench-service
    name: auto-update-extensions
    kind: function
    summary: "autoUpdateExtensions: install each outdated extension that should auto update and whose update is past the delay window."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2269-2312", "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2337-2372"]
    request: {type: object, properties: {outdated: {type: array}}}
    behavior:
      - call: global-extension-enablement-service.get-disabled-extensions
        input: {}
        as: disabled
      - set: {ctx.auto_update_skipped: [], ctx.auto_update_delayed: [], ctx.auto_updated: []}
      - foreach: "= input.outdated"
        as: ext
        steps:
          - if: "config['extensions-auto-update'] == 'off'"
            then:
              - title: "Auto update is off (no extension or publisher opted in)"
                source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2349-2360"
                set: {ctx.auto_update_skipped: "= ctx.auto_update_skipped + [vars.ext.id]"}
              - continue: true
          - if: "vars.ext.pinned"
            then:
              - title: Pinned extensions are not auto updated
                source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2362-2364"
                set: {ctx.auto_update_skipped: "= ctx.auto_update_skipped + [vars.ext.id]"}
              - continue: true
          - if: "vars.ext.id in vars.disabled.value.ids"
            then:
              - title: Only enabled extensions are auto updated
                source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2370-2371"
                set: {ctx.auto_update_skipped: "= ctx.auto_update_skipped + [vars.ext.id]"}
              - continue: true
          - if: "now - vars.ext.gallery.last_updated < config['extensions-auto-update-delay'] * 3600000"
            then:
              - title: Update published too recently; delayed
                source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2284-2290"
                set: {ctx.auto_update_delayed: "= ctx.auto_update_delayed + [vars.ext.id]"}
              - continue: true
          - title: Install the update with the product version
            source: "src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:3075-3078"
            call: extension-management-service.update-from-gallery
            input: {gallery: "= vars.ext.gallery", pinned: false}
            as: upd
            on_error: continue
          - if: "vars.upd.ok"
            then:
              - set: {ctx.auto_updated: "= ctx.auto_updated + [vars.ext.id]"}

  - component: extensions-workbench-service
    name: on-did-install-extensions
    kind: event
    summary: "Listener of onDidInstallExtensions: refreshes the local model and clears outdated entries."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:865-903"]
    subscribe: [node-extension-management-service.on-did-install-extensions]
    behavior:
      - set: {state.outdated: "= state.outdated.filter(o, o != input.id)"}

  # ---- channel ----
  - component: extension-management-channel
    name: install-from-gallery
    kind: ipc
    attributes: {channel: extensions, command: installFromGallery}
    summary: "'extensions' channel installFromGallery"
    sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:137-139"]
    request: {type: object, properties: {gallery: {$ref: RemoteServerGalleryExtension}, pinned: {type: boolean}}}
    response: RemoteServerLocalExtension
    behavior:
      - call: node-extension-management-service.install-from-gallery
        input: "= input"
        as: r
      - return: "= vars.r.value"
  - component: extension-management-channel
    name: get-installed
    kind: ipc
    attributes: {channel: extensions, command: getInstalled}
    summary: "'extensions' channel getInstalled"
    sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:151-153"]
    behavior:
      - call: node-extension-management-service.get-installed
        input: {}
        as: r
      - return: "= vars.r.value"
  - component: extension-management-channel
    name: uninstall
    kind: ipc
    attributes: {channel: extensions, command: uninstall}
    summary: "'extensions' channel uninstall"
    sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:144-146"]
    request: {type: object, required: [id], properties: {id: {type: string}}}
    behavior:
      - call: node-extension-management-service.uninstall
        input: "= input"

  # ---- node ExtensionManagementService ----
  - component: node-extension-management-service
    name: install-from-gallery
    kind: function
    summary: "installFromGallery -> installGalleryExtensions: marketplace gate, compatibility checks, then the install task."
    sources: ["src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:168-191", "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:193-215"]
    request: {type: object, properties: {gallery: {$ref: RemoteServerGalleryExtension}, pinned: {type: boolean}}}
    response: RemoteServerLocalExtension
    errors:
      - {code: not-allowed, status: 0, retryable: false, summary: "Marketplace is not enabled"}
      - {code: malicious, status: 0, retryable: false}
      - {code: incompatible-target-platform, status: 0, retryable: false}
      - {code: incompatible, status: 0, retryable: false}
      - {code: invalid, status: 0, retryable: false}
    behavior:
      - call: extension-gallery-service.is-enabled
        input: {}
        as: en
      - if: "!vars.en.value.enabled"
        then:
          - title: Marketplace is not enabled
            detail: "Deployed OSS product.json has no extensionsGallery, so every gallery install refuses here."
            source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:194-196"
            fail: {code: not-allowed, message: Marketplace is not enabled}
      - title: Malicious per the extensions control manifest
        source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:711-714"
        call: extension-gallery-service.get-extensions-control-manifest
        input: {}
        as: cm
      - if: "input.gallery.id in vars.cm.value.malicious"
        then:
          - fail: {code: malicious, message: "= \"Can't install '\" + input.gallery.id + \"' extension since it was reported to be problematic.\""}
      - title: canInstall consults extensions.allowed
        source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:79-82"
        call: allowed-extensions-service.is-allowed
        input: {id: "= input.gallery.id", publisher: "= has(input.gallery.publisher) ? input.gallery.publisher : input.gallery.id.split('.')[0]"}
        as: allowed
      - if: "!vars.allowed.value.allowed"
        then:
          - title: "canInstall() !== true is reported as an incompatible target platform"
            detail: "checkAndGetCompatibleVersion throws IncompatibleTargetPlatform for any canInstall refusal, including an extensions.allowed refusal."
            source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:730-733"
            fail: {code: incompatible-target-platform, message: "= \"The '\" + input.gallery.id + \"' extension is not available for this platform.\""}
      - title: Find a compatible version
        source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:735-743"
        call: extension-gallery-service.get-compatible-extension
        input: {id: "= input.gallery.id"}
        as: compat
      - if: "vars.compat.value == null"
        then:
          - fail: {code: incompatible, message: "= \"Can't install '\" + input.gallery.id + \"' extension because it is not compatible with the current version.\""}
      - title: Fetch the manifest
        source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:746-753"
        call: extension-gallery-service.get-manifest
        input: {id: "= input.gallery.id", version: "= vars.compat.value.version"}
        as: manifest
      - title: Run the install task
        source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:289-300"
        call: install-extension-in-profile-task.run
        input: {gallery: "= vars.compat.value", pinned: "= input.pinned"}
        as: local
      - title: Fire onDidInstallExtensions
        source: "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:566"
        publish: node-extension-management-service.on-did-install-extensions
        input: {id: "= vars.local.value.id", version: "= vars.local.value.version"}
        delivery: sync
      - return: "= vars.local.value"

  - component: node-extension-management-service
    name: on-did-install-extensions
    kind: event
    summary: "onDidInstallExtensions event (topic)."
    sources: ["src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:136-140"]
    request: {type: object, properties: {id: {type: string}, version: {type: string}}}

  - component: node-extension-management-service
    name: get-installed
    kind: function
    summary: "getInstalled: scans system and the profile's user extensions."
    sources: ["src/vs/platform/extensionManagement/node/extensionManagementService.ts:133-135"]
    behavior:
      - call: extensions-profile-scanner-service.scan-profile-extensions
        input: {}
        as: user
      - return: {user: "= vars.user.value", system: ["vscode.git", "vscode.typescript-language-features", "vscode.markdown-language-features"]}

  - component: node-extension-management-service
    name: uninstall
    kind: function
    summary: "uninstall -> uninstallExtensions: removes the extension from the profile and fires onDidUninstallExtension."
    sources: ["src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:217-220", "src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:785-800"]
    request: {type: object, required: [id], properties: {id: {type: string}}}
    behavior:
      - title: Remove the extension from the profile's extensions.json
        source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:1228"
        call: extensions-profile-scanner-service.remove-extensions-from-profile
        input: {id: "= input.id"}
      - return: {id: "= input.id", uninstalled: true}

  - component: node-extension-management-service
    name: download-and-extract-gallery-extension
    kind: function
    summary: "downloadExtension + downloadAndExtractGalleryExtension: download, enforce the signature, extract."
    sources: ["src/vs/platform/extensionManagement/node/extensionManagementService.ts:299-338", "src/vs/platform/extensionManagement/node/extensionManagementService.ts:340-385"]
    request: {type: object, properties: {gallery: {$ref: RemoteServerGalleryExtension}}}
    errors:
      - {code: signature-verification-failed, status: 0, retryable: false}
      - {code: signature-verification-internal, status: 0, retryable: false}
    behavior:
      - title: Verify signatures unless extensions.verifySignature is false
        source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:341-344"
        call: extensions-downloader.download
        input: {gallery: "= input.gallery", verify_signature: "= config['extensions-verify-signature']"}
        as: dl
      - if: "config['extensions-verify-signature'] && config['environment-is-built'] && vars.dl.value.verification_status != 'success' && vars.dl.value.verification_status != 'not-signed'"
        then:
          - title: Signature verification failed; the download is deleted
            source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:348-378"
            fail: {code: signature-verification-failed, message: "= \"Signature verification failed with '\" + vars.dl.value.verification_status + \"' error.\""}
      - title: Extract into the user extensions folder
        source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:313-317"
        call: extensions-scanner.extract-user-extension
        input: {id: "= input.gallery.id", version: "= input.gallery.version"}
      - return: {verification_status: "= vars.dl.value.verification_status"}

  - component: install-extension-in-profile-task
    name: run
    kind: function
    summary: "InstallExtensionInProfileTask.doRun"
    sources: ["src/vs/platform/extensionManagement/node/extensionManagementService.ts:1066-1170"]
    request: {type: object, properties: {gallery: {$ref: RemoteServerGalleryExtension}, pinned: {type: boolean}}}
    response: RemoteServerLocalExtension
    errors:
      - {code: incompatible, status: 0, retryable: false}
      - {code: add-to-profile, status: 0, retryable: false}
    behavior:
      - title: An existing system extension may only be updated when forceAutoUpdate
        source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:1073-1082"
        call: extensions-scanner-service.get-system-extension
        input: {id: "= input.gallery.id"}
        as: sys
      - if: "has(vars.sys.value.id) && !vars.sys.value.force_auto_update"
        then:
          - fail: {code: incompatible, message: "= \"Extension '\" + input.gallery.id + \"' is a built-in extension and not allowed to be updated in the current product quality.\""}
      - call: extensions-profile-scanner-service.get-profile-extension
        input: {id: "= input.gallery.id"}
        as: existing
      - if: "has(vars.existing.value.id) && vars.existing.value.version == input.gallery.version"
        then:
          - title: Same version already installed; only metadata is updated
            source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:1135-1137"
            return: "= vars.existing.value"
      - title: Download, verify and extract
        source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:1148-1152"
        call: node-extension-management-service.download-and-extract-gallery-extension
        input: {gallery: "= input.gallery"}
      - title: Add to the profile's extensions.json
        source: "src/vs/platform/extensionManagement/node/extensionManagementService.ts:1165-1169"
        call: extensions-profile-scanner-service.add-extensions-to-profile
        input: {id: "= input.gallery.id", value: {id: "= input.gallery.id", version: "= input.gallery.version", source: gallery, pinned: "= input.pinned", is_builtin: false, installed_timestamp: "= now", operation: "= has(vars.existing.value.id) ? 'update' : 'install'"}}
        as: added
        on_error:
          - fail: {code: add-to-profile, message: "= error.message"}
      - return: "= vars.added.value"

  - component: extensions-downloader
    name: download
    kind: function
    summary: "ExtensionsDownloader.download: VSIX with retries, then the signature archive and verification."
    sources: ["src/vs/platform/extensionManagement/node/extensionDownloader.ts:64-109"]
    request: {type: object, properties: {gallery: {$ref: RemoteServerGalleryExtension}, verify_signature: {type: boolean}}}
    errors:
      - {code: download, status: 0, retryable: false}
      - {code: corrupt-zip, status: 0, retryable: false}
    behavior:
      - title: Download the VSIX (retried twice)
        source: "src/vs/platform/extensionManagement/node/extensionDownloader.ts:111-138"
        call: extension-gallery-service.download
        input: {id: "= input.gallery.id", version: "= input.gallery.version", asset: vsix}
        retry: {max_attempts: "= config['extensions-download-retries'] + 1", title: "Failed downloading vsix. Retry again...", source: "src/vs/platform/extensionManagement/node/extensionDownloader.ts:210-222"}
        on_error:
          - fail: {code: download, message: "= error.message"}
      - if: "!input.verify_signature"
        then:
          - return: {verification_status: null}
      - if: "!input.gallery.signed"
        then:
          - title: Unsigned package
            source: "src/vs/platform/extensionManagement/node/extensionDownloader.ts:73-75"
            return: {verification_status: not-signed}
      - title: Download the signature archive
        source: "src/vs/platform/extensionManagement/node/extensionDownloader.ts:141-168"
        call: extension-gallery-service.download
        input: {id: "= input.gallery.id", version: "= input.gallery.version", asset: signature}
        retry: {max_attempts: "= config['extensions-download-retries'] + 1"}
      - call: extension-signature-verification-service.verify
        input: {id: "= input.gallery.id", version: "= input.gallery.version"}
        as: v
      - if: "vars.v.value.code == 'package-is-invalid-zip'"
        then:
          - title: Corrupt zip; the VSIX is deleted
            source: "src/vs/platform/extensionManagement/node/extensionDownloader.ts:81-89"
            fail: {code: corrupt-zip, message: "The vsix package is corrupt"}
      - return: {verification_status: "= vars.v.value.code"}

  - component: extensions-scanner
    name: extract-user-extension
    kind: function
    summary: "extractUserExtension: unzip into <extensions>/<id>-<version>."
    sources: ["src/vs/platform/extensionManagement/node/extensionManagementService.ts:620-660"]
    request: {type: object, properties: {id: {type: string}, version: {type: string}}}
    behavior:
      - title: Write the extracted extension's package.json
        call: disk.write-file
        input: {resource: "= 'file:///home/dev/.vscode-oss/extensions/' + input.id + '-' + input.version + '/package.json'", content: "{}"}

  - component: extension-signature-verification-service
    name: verify
    kind: function
    summary: "verify: runs vsce-sign over the VSIX and signature archive; the verdict is a choice."
    sources: ["src/vs/platform/extensionManagement/node/extensionSignatureVerificationService.ts:51-70"]
    request: {type: object, properties: {id: {type: string}, version: {type: string}}}
    response: {type: object, properties: {code: {type: string}}}
    behavior:
      - choice: verdict
        default: success
        options:
          success: [{return: {code: success}}]
          signature-is-invalid: [{return: {code: signature-is-invalid}}]
          package-is-invalid-zip: [{return: {code: package-is-invalid-zip}}]

