  # ---- global enablement ----
  - component: global-extension-enablement-service
    name: disable-extension
    kind: function
    summary: "disableExtension: add to the disabled list and fire onDidChangeEnablement (false when already disabled)"
    sources: ["src/vs/platform/extensionManagement/common/extensionEnablementService.ts:43-49"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [ms-python.python]}}}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "input.id in state.disabled"
        then: [{return: {changed: false}}]
      - set: {state.disabled: "= state.disabled + [input.id]"}
      - return: {changed: true}
  - component: global-extension-enablement-service
    name: enable-extension
    kind: function
    summary: "enableExtension: remove from the disabled list (false when not disabled)"
    sources: ["src/vs/platform/extensionManagement/common/extensionEnablementService.ts:35-41"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [ms-python.python]}}}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "!(input.id in state.disabled)"
        then: [{return: {changed: false}}]
      - set: {state.disabled: "= state.disabled.filter(d, d != input.id)"}
      - return: {changed: true}
