configs:
  - {id: settings-sync-ignored-extensions, type: array, value: [], default: [], summary: "settingsSync.ignoredExtensions: extensions never synced ('-id' forces sync)", sources: ["src/vs/platform/userDataSync/common/userDataSync.ts:97-108", "src/vs/platform/userDataSync/common/ignoredExtensions.ts:32-35"], attributes: {key: settingsSync.ignoredExtensions}}
interfaces:
  - component: electron-remote-resource-loader
    name: do-request
    kind: ipc
    attributes: {channel: remoteResourceHandler}
    summary: "'remoteResourceHandler' channel registered on the main process: read a managed remote resource for this window"
    sources: ["src/vs/platform/remote/electron-browser/electronRemoteResourceLoader.ts:42", "src/vs/platform/remote/electron-browser/electronRemoteResourceLoader.ts:45-60"]
    request: {type: object, properties: {window_authority: {type: string, default: "window:1"}, uri: {type: string, examples: ["file:///work/app/README.md"]}}}
    behavior:
      - if: "input.window_authority != 'window:1'"
        then:
          - title: Wrong scheme or another window's authority
            source: "src/vs/platform/remote/electron-browser/electronRemoteResourceLoader.ts:46-48"
            return: {status_code: 404}
      - call: disk.read-file
        input: {resource: "= input.uri"}
        as: f
        on_error:
          - title: FILE_NOT_FOUND maps to 404, other errors to 500
            source: "src/vs/platform/remote/electron-browser/electronRemoteResourceLoader.ts:55-59"
            return: {status_code: "= error.code == 'file-not-found' ? 404 : 500"}
      - return: {status_code: 200}
  - component: extension-tips-service
    name: get-config-based-tips
    kind: function
    summary: "getConfigBasedTips: recommendations from product.json configBasedExtensionTips for a folder (none in the OSS product.json)"
    sources: ["src/vs/platform/extensionManagement/common/extensionTipsService.ts:44-46"]
    request: {type: object, properties: {folder: {type: string, examples: ["file:///work/app"]}}}
    behavior:
      - return: {tips: []}
  - component: ignored-extensions-management-service
    name: has-to-never-sync-extension
    kind: function
    summary: "hasToNeverSyncExtension / hasToAlwaysSyncExtension from settingsSync.ignoredExtensions"
    sources: ["src/vs/platform/userDataSync/common/ignoredExtensions.ts:32-40"]
    request: {type: object, properties: {id: {type: string, examples: [ms-python.python]}}}
    behavior:
      - return: {never: "= input.id in config['settings-sync-ignored-extensions']", always: "= ('-' + input.id) in config['settings-sync-ignored-extensions']"}
  - component: user-data-sync-resource-provider-service
    name: get-remote-sync-resource-handles
    kind: function
    summary: "getRemoteSyncResourceHandles: the remote versions of a resource (for the sync activity views)"
    sources: ["src/vs/platform/userDataSync/common/userDataSyncResourceProvider.ts:100-110"]
    request: {type: object, properties: {resource: {type: string, examples: [settings]}}}
    behavior:
      - call: user-data-sync-store-service.read-resource
        input: {resource: "= input.resource"}
        as: r
      - return: {handles: ["= vars.r.value.ref"]}
flows:
  - {id: rs-remote-resource-load, name: "Main process asks a window for a managed remote resource", entry: {caller: main-process, interface: electron-remote-resource-loader.do-request}, sources: ["src/vs/platform/remote/electron-browser/electronRemoteResourceLoader.ts:42"]}
  - {id: rs-ext-config-tips, name: "Config-based extension tips for a folder", entry: {caller: workbench, interface: extension-tips-service.get-config-based-tips}}
  - {id: rs-sync-ignored-extension, name: "Is an extension excluded from sync", entry: {caller: workbench, interface: ignored-extensions-management-service.has-to-never-sync-extension}}
  - {id: rs-sync-remote-resource-handles, name: "Remote versions of a synced resource", entry: {caller: workbench, interface: user-data-sync-resource-provider-service.get-remote-sync-resource-handles}}
scenarios:
  - id: remote-server-misc-services
    fixtures: [one-window-folder]
    config: {settings-sync-ignored-extensions: [ms-python.python], product-configuration-sync-store-url: "https://sync.example/v1"}
    steps:
      - {flow: rs-remote-resource-load, as: ok, input: {window_authority: "window:1", uri: "file:///work/app/README.md"}}
      - {flow: rs-remote-resource-load, as: other, input: {window_authority: "window:2", uri: "file:///work/app/README.md"}}
      - {flow: rs-ext-config-tips, as: tips}
      - {flow: rs-sync-ignored-extension, as: ign, input: {id: ms-python.python}}
      - {flow: rs-sync-remote-resource-handles, as: h, input: {resource: settings}}
    expect:
      - "steps.ok.result.value.status_code == 200 && steps.other.result.value.status_code == 404"
      - "steps.tips.result.value.tips == [] && steps.ign.result.value.never && !steps.ign.result.value.always"
      - "steps.h.result.value.handles == ['ref-s1'] && state['user-data-sync-store-service'].session_requests == 1"
  - id: remote-server-misc-resource-missing
    flow: rs-remote-resource-load
    fixtures: [one-window-folder]
    input: {window_authority: "window:1", uri: "file:///work/app/missing.txt"}
    faults: [{target: disk.read-file, type: error, code: file-not-found}]
    expect: ["result.value.status_code == 404"]
