interfaces:
  - component: extensions-contribution-commands
    name: cmd-workbench-extensions-installextension
    kind: command
    summary: "workbench.extensions.installExtension: install by id[@version] (or a VSIX URI); errors are reported and rethrown"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:437-531"]
    request:
      type: object
      required: [arg]
      properties:
        arg: {type: string, examples: [ms-python.python]}
        install_pre_release_version: {type: boolean, default: false}
        donot_sync: {type: boolean, default: false}
    behavior:
      - title: Split id@version
        source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:499"
        set: {vars.id: "= input.arg.split('@')[0]", vars.version: "= size(input.arg.split('@')) > 1 ? input.arg.split('@')[1] : ''"}
      - title: Install through the extensions workbench service
        source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:513-520"
        call: extensions-workbench-service.install
        input: {id: "= vars.id", version: "= vars.version", install_pre_release_version: "= input.install_pre_release_version", pinned: "= vars.version != ''"}
        as: r
      - return: "= vars.r.value"
  - component: extensions-contribution-commands
    name: cmd-workbench-extensions-uninstallextension
    kind: command
    summary: "workbench.extensions.uninstallExtension: requires an installed, non-built-in id"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:533-565"]
    request: {type: object, properties: {id: {type: string, examples: [ms-python.python]}}}
    errors:
      - {code: extension-id-required, status: 0, retryable: false}
      - {code: extension-not-installed, status: 0, retryable: false}
      - {code: extension-is-builtin, status: 0, retryable: false}
    behavior:
      - if: "!has(input.id) || input.id == ''"
        then:
          - title: Extension id required
            source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:547-549"
            fail: {code: extension-id-required, message: Extension id required.}
      - call: extensions-scanner-service.get-system-extension
        input: {id: "= input.id"}
        as: sys
      - if: "has(vars.sys.value.id)"
        then:
          - title: Built-in extensions cannot be uninstalled
            source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:556-558"
            fail: {code: extension-is-builtin, message: "= \"Extension '\" + input.id + \"' is a Built-in extension and cannot be uninstalled\""}
      - title: Find it among the installed extensions
        source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:550-552"
        call: extensions-profile-scanner-service.get-profile-extension
        input: {id: "= input.id"}
        as: local
      - if: "!has(vars.local.value.id)"
        then:
          - title: Not installed
            source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:553-555"
            fail: {code: extension-not-installed, message: "= \"Extension '\" + input.id + \"' is not installed.\""}
      - title: Uninstall through the extension management service
        source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:561"
        call: extension-management-service.uninstall
        input: {id: "= input.id"}
  - component: extensions-contribution-commands
    name: cmd-workbench-extensions-search
    kind: command
    summary: "workbench.extensions.search: open the Extensions view with a query"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:567-580"]
    request: {type: object, properties: {query: {type: string, default: ""}}}
    behavior:
      - call: extensions-workbench-service.open-search
        input: {search: "= input.query"}
  - component: extensions-contribution-commands
    name: cmd-extensions-manage
    kind: command
    summary: "_extensions.manage: open an installed extension's editor; throws when it is not installed"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:415-423"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [ms-python.python]}}}
    errors: [{code: extension-not-found, status: 0, retryable: false}]
    behavior:
      - call: extensions-profile-scanner-service.get-profile-extension
        input: {id: "= input.id"}
        as: local
      - if: "!has(vars.local.value.id)"
        then:
          - title: "Extension not found"
            source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:421-422"
            fail: {code: extension-not-found, message: "= \"Extension '\" + input.id + \"' not found.\""}
      - call: extensions-workbench-service.open
        input: {id: "= input.id"}
  - component: extensions-contribution-commands
    name: cmd-extension-open
    kind: command
    summary: "extension.open: open from the gallery or installed; falls back to _extensions.manage"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:425-435"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [ms-python.python]}}}
    behavior:
      - call: extensions-workbench-service.open
        input: {id: "= input.id"}
  - component: extensions-contribution-commands
    name: cmd-workbench-extensions-actions-gallery-signin
    kind: command
    summary: "workbench.extensions.actions.gallery.signIn: sign in to a Marketplace that requires it"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:2147-2164"]
    behavior:
      - title: Sign in through the gallery account service
        source: "src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:2162"
        call: extension-gallery-account-service.sign-in
        input: {}
  - {component: extension-gallery-account-service, name: sign-in, kind: function, summary: "IExtensionGalleryAccountService.signIn (boundary)", attributes: {boundary: true, owner: workbench-shell}}
  - component: extensions-actions-commands
    name: cmd-workbench-extensions-action-showextensionsforlanguage
    kind: command
    summary: "workbench.extensions.action.showExtensionsForLanguage: search ext:<file extension>"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsActions.ts:3413-3416"]
    request: {type: object, properties: {file_extension: {type: string, examples: [".ts"]}}}
    behavior:
      - call: extensions-workbench-service.open-search
        input: {search: "= 'ext:' + (input.file_extension.startsWith('.') ? input.file_extension.substring(1) : input.file_extension)"}
  - component: extensions-actions-commands
    name: cmd-workbench-extensions-action-showextensionswithids
    kind: command
    summary: "workbench.extensions.action.showExtensionsWithIds: search @id:<id> for each id"
    sources: ["src/vs/workbench/contrib/extensions/browser/extensionsActions.ts:3419-3422"]
    request: {type: object, properties: {extension_ids: {type: array, items: {type: string}, examples: [[ms-python.python]]}}}
    behavior:
      - call: extensions-workbench-service.open-search
        input: {search: "= input.extension_ids.map(i, '@id:' + i).join(' ')"}
