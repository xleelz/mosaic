# extensions.allowed as an object, and the Running Extensions editor.
configs:
- id: extensions-allowed
  value: '*'
  default: '*'
  summary: 'extensions.allowed (policy AllowedExtensions). Declared type object, code default the string ''*''. Any non-object value, or exactly {''*'': true}, allows everything. Otherwise an object
    keyed by extension id or publisher (lower-cased) whose values are true, false, ''stable'' or a list of versions (''1.2.3'' or ''1.2.3@linux-x64''). Deployed = default.'
  sources:
  - src/vs/platform/extensionManagement/common/extensionManagement.ts:745-750
  - src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:55-64
  attributes:
    key: extensions.allowed
components:
- id: runtime-extensions-input
  name: RuntimeExtensionsInput
  kind: module
  layer: remote
  parent: extensions-workbench-service
  sources:
  - src/vs/workbench/contrib/extensions/common/runtimeExtensionsInput.ts:16-56
  summary: 'The Running Extensions editor input: a singleton (one instance until disposed) on runtime-extensions:/default, with the capabilities Readonly, Singleton and RequiresModal.'
  attributes:
    owner: remote-server
  state:
    schema:
      type: object
      properties:
        instances_created:
          type: integer
        disposed:
          type: boolean
        type_id:
          type: string
        resource:
          type: string
        name:
          type: string
        capabilities:
          type: array
          items:
            type: string
    initial:
      instances_created: 0
      disposed: true
      type_id: workbench.runtimeExtensions.input
      resource: runtime-extensions:/default
      name: Running Extensions
      capabilities: []
- id: show-runtime-extensions-action
  name: ShowRuntimeExtensionsAction
  kind: module
  layer: remote
  parent: extensions-workbench-service
  sources:
  - src/vs/workbench/contrib/extensions/browser/abstractRuntimeExtensionsEditor.ts:521-541
  - src/vs/workbench/contrib/extensions/browser/extensions.web.contribution.ts:22
  - src/vs/workbench/contrib/extensions/electron-browser/extensions.contribution.ts:87
  summary: 'Developer: Show Running Extensions (F1, and the Extensions view title menu), registered by both the web and the desktop extensions contributions.'
  attributes:
    owner: remote-server
interfaces:
- component: allowed-extensions-service
  name: is-allowed
  kind: function
  summary: 'isAllowed: no restriction (non-object value, or only {''*'': true}) allows all; else the extension id entry decides (boolean, ''stable'' refuses pre-releases, a version list must contain
    the version for the platform), then the publisher entry (boolean or ''stable''), then ''*'': true; otherwise not allowed.'
  sources:
  - src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:66-143
  request:
    type: object
    properties:
      id:
        type: string
        examples:
        - ms-python.python
      publisher:
        type: string
        examples:
        - ms-python
      version:
        type: string
      prerelease:
        type: boolean
      target_platform:
        type: string
      publisher_display_name:
        type: string
  response:
    type: object
    properties:
      allowed:
        type: boolean
      reason:
        type: string
  behavior:
  - title: 'getAllowedExtensionsValue: only a non-array object restricts; keys are lower-cased; exactly {"*": true} means no restriction'
    source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:55-64
    set:
      vars.cfg: '= type(config[''extensions-allowed'']) == map ? dyn(config[''extensions-allowed''].transformMapEntry(k, v, {k.lowerAscii(): v})) : dyn(null)'
  - if: vars.cfg == null || (size(vars.cfg) == 1 && '*' in vars.cfg && vars.cfg['*'] == true)
    then:
    - title: No allowed-extensions value -> true
      source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:67-69
      return:
        allowed: true
        reason: ''
  - title: id, version, prerelease, publisher and target platform of the extension (lower-cased)
    source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:89-96
    set:
      vars.id: = input.id.lowerAscii()
      vars.version: '= has(input.version) ? input.version : ''*'''
      vars.pre: '= has(input.prerelease) && input.prerelease'
      vars.platform: '= has(input.target_platform) ? input.target_platform : ''universal'''
      vars.publisher: '= (has(input.publisher) ? input.publisher : input.id.split(''.'')[0]).lowerAscii()'
  - if: vars.id in vars.cfg
    then:
    - set:
        vars.ev: = vars.cfg[vars.id]
    - if: type(vars.ev) == bool
      then:
      - title: A boolean entry for the id decides
        source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:101-103
        return:
          allowed: = vars.ev
          reason: '= vars.ev ? '''' : ''it is not in the allowed list'''
    - if: vars.ev == 'stable' && vars.pre
      then:
      - title: '''stable'' refuses the pre-release versions of the extension'
        source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:104-106
        return:
          allowed: false
          reason: the pre-release versions of this extension are not in the allowed list
    - if: 'vars.version != ''*'' && type(vars.ev) == list && !vars.ev.exists(v, v.matches(''^[0-9]+[.][0-9]+[.][0-9]+(-[^@]*)?(@.+)?$'') && v.split(''@'')[0] == vars.version && (vars.platform == ''universal'' || size(v.split(''@'')) < 2 || v.split(''@'')[1] == vars.platform))'
      then:
      - title: A version list must contain this version (and platform, if given)
        source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:107-122
        return:
          allowed: false
          reason: = 'the version ' + vars.version + ' of this extension is not in the allowed list'
    - title: Any other id entry allows it
      source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:123
      return:
        allowed: true
        reason: ''
  - title: The publisher key (the publisher; the display name only for product.extensionPublisherOrgs, none in the OSS product)
    source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:126-127
    set:
      vars.pkey: = vars.publisher
  - if: vars.pkey in vars.cfg
    then:
    - set:
        vars.pv: = vars.cfg[vars.pkey]
    - if: type(vars.pv) == bool
      then:
      - title: A boolean entry for the publisher decides
        source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:129-131
        return:
          allowed: = vars.pv
          reason: '= vars.pv ? '''' : ''the extensions from this publisher are not in the allowed list'''
    - if: vars.pv == 'stable' && vars.pre
      then:
      - title: '''stable'' refuses pre-releases from the publisher'
        source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:132-134
        return:
          allowed: false
          reason: the pre-release versions from this publisher are not in the allowed list
    - return:
        allowed: true
        reason: ''
  - if: '''*'' in vars.cfg && vars.cfg[''*''] == true'
    then:
    - title: '''*'': true allows everything else'
      source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:137-139
      return:
        allowed: true
        reason: ''
  - title: Not in the allowed list
    source: src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:141
    return:
      allowed: false
      reason: it is not in the allowed list
- component: runtime-extensions-input
  name: instance
  kind: function
  summary: 'RuntimeExtensionsInput.instance: reuse the singleton unless it is missing or disposed.'
  sources:
  - src/vs/workbench/contrib/extensions/common/runtimeExtensionsInput.ts:28-35
  response:
    type: object
    properties:
      type_id:
        type: string
      resource:
        type: string
      capabilities:
        type: array
        items:
          type: string
      created:
        type: boolean
  behavior:
  - if: '!state.disposed'
    then:
    - return:
        type_id: = state.type_id
        resource: = state.resource
        capabilities: = state.capabilities
        created: false
  - title: new RuntimeExtensionsInput() with Readonly | Singleton | RequiresModal on runtime-extensions:/default
    source: src/vs/workbench/contrib/extensions/common/runtimeExtensionsInput.ts:24-40
    set:
      state.instances_created: = state.instances_created + 1
      state.disposed: false
      state.capabilities:
      - readonly
      - singleton
      - requires-modal
  - return:
      type_id: = state.type_id
      resource: = state.resource
      capabilities: = state.capabilities
      created: true
- component: show-runtime-extensions-action
  name: cmd-workbench-action-showruntimeextensions
  kind: command
  attributes:
    command_id: workbench.action.showRuntimeExtensions
  summary: 'Show Running Extensions: openEditor(RuntimeExtensionsInput.instance, {pinned: true}).'
  sources:
  - src/vs/workbench/contrib/extensions/browser/abstractRuntimeExtensionsEditor.ts:521-541
  - src/vs/workbench/contrib/extensions/browser/extensions.web.contribution.ts:22
  - src/vs/workbench/contrib/extensions/electron-browser/extensions.contribution.ts:87
  behavior:
  - call: runtime-extensions-input.instance
    input: {}
    as: inp
  - title: editorService.openEditor(RuntimeExtensionsInput.instance, {pinned true})
    source: src/vs/workbench/contrib/extensions/browser/abstractRuntimeExtensionsEditor.ts:538-540
    call: editor-service.open-editor
    input:
      resource: = vars.inp.value.resource
      options:
        pinned: true
    as: o
  - return:
      resource: = vars.inp.value.resource
      capabilities: = vars.inp.value.capabilities
- component: editor-service
  name: open-editor
  kind: function
  summary: IEditorService.openEditor (seam, owner workbench-shell)
  request: WorkbenchOpenEditorRequest
  response: WorkbenchOpenEditorResult
  errors:
  - code: invalid-editor-group-provided
    status: 0
    retryable: false
  attributes:
    boundary: true
    owner: workbench-shell
flows:
- id: rs-ext-show-running-extensions
  name: Developer - Show Running Extensions
  tags:
  - writes
  - feature:extension-management
  entry:
    caller: user
    interface: show-runtime-extensions-action.cmd-workbench-action-showruntimeextensions
  sources:
  - src/vs/workbench/contrib/extensions/browser/abstractRuntimeExtensionsEditor.ts:539
- id: rs-ext-runtime-input
  name: Read the Running Extensions editor input
  entry:
    caller: workbench
    interface: runtime-extensions-input.instance
  sources:
  - src/vs/workbench/contrib/extensions/common/runtimeExtensionsInput.ts:29
