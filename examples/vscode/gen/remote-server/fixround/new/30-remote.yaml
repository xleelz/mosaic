interfaces:
- component: remote-agent-connection
  name: connect-remote-agent-management
  kind: function
  summary: 'connectRemoteAgentManagement -> createInitialConnection: up to 5 attempts whatever the error, then a permanent failure.'
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:414-422
  - src/vs/platform/remote/common/remoteAgentConnection.ts:437-458
  request:
    type: object
    required:
    - remote_authority
    - reconnection_token
    properties:
      remote_authority:
        type: string
        examples:
        - ssh-remote+dev-box
      reconnection_token:
        type: string
        examples:
        - tok-r1
        description: generateUuid() per attempt in code; fixed here so scenarios can address it
      commit:
        type: string
        examples:
        - 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
  errors:
  - code: connection-error
    status: 0
    retryable: false
    summary: 'VSCODE_CONNECTION_ERROR: the server rejected the handshake'
  - code: remote-authority-resolver-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.connected: false
      vars.attempts: 0
  - title: 'for (attempt = 1; ; attempt++): any error is retried until MAX_ATTEMPTS (5)'
    source: src/vs/platform/remote/common/remoteAgentConnection.ts:440-446
    foreach: = lists.range(config['remote-initial-connection-max-attempts'])
    as: n
    index: attempt0
    max: 20
    steps:
    - set:
        vars.attempts: = vars.attempt0 + 1
    - call: remote-agent-connection.do-connect-remote-agent-management
      input:
        remote_authority: = input.remote_authority
        reconnection_token: = input.reconnection_token
        commit: = input.commit
        is_reconnection: false
      as: conn
      on_error: continue
    - if: vars.conn.ok
      then:
      - set:
          vars.connected: true
      - break: true
    - if: vars.attempt0 + 1 < config['remote-initial-connection-max-attempts']
      then:
      - title: An error occurred in initial connection! Will retry...
        source: src/vs/platform/remote/common/remoteAgentConnection.ts:447-449
        continue: true
  - if: '!vars.connected'
    then:
    - title: 'The fifth failure is permanent: triggerPermanentFailure'
      source: src/vs/platform/remote/common/remoteAgentConnection.ts:450-455
      call: management-persistent-connection.go-to-permanent-failure
      input:
        attempt: 0
        handled: false
    - fail: '= {''code'': vars.conn.error.code, ''message'': vars.conn.error.message}'
  - title: New ManagementPersistentConnection fires ConnectionGain
    source: src/vs/platform/remote/common/remoteAgentConnection.ts:594
    call: management-persistent-connection.on-connected
    input:
      reconnection_token: = input.reconnection_token
      remote_authority: = input.remote_authority
  - return:
      reconnection_token: = input.reconnection_token
      attempts: = vars.attempts
