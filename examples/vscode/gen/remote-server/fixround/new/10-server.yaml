# Connection token, server creation, handshake and the remote extension host fork.
configs:
- id: extensions-support-node-global-navigator
  type: boolean
  value: false
  default: false
  summary: extensions.supportNodeGlobalNavigator. When true the remote extension host is forked with --supportGlobalNavigator. Deployed = default.
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:396-400
  - src/vs/server/node/extensionHostConnection.ts:287-289
  attributes:
    key: extensions.supportNodeGlobalNavigator
components:
- id: remote-extension-host-agent-server
  name: RemoteExtensionHostAgentServer
  kind: service
  layer: remote
  parent: remote-server-process
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:69-113
  summary: 'HTTP and WebSocket front of the remote server: version, resources, web client, and the management/extension-host/tunnel connection handshake. Holds the ServerConnectionToken that createServer determined.'
  attributes:
    owner: remote-server
  state:
    schema:
      type: object
      properties:
        management_connections:
          type: object
        ext_host_connections:
          type: object
        all_reconnection_tokens:
          type: object
        created:
          type: boolean
          description: the memoized createServer promise of server-main.ts has resolved
        exited:
          type: boolean
          description: createServer hit a ServerConnectionTokenParseError and called process.exit(1)
        args:
          type: object
          description: 'the parsed server argv (ServerParsedArgs). null = option not given. server.main.ts always fills user_data_dir.'
          properties:
            without_connection_token:
              type: boolean
            connection_token:
              type:
              - string
              - 'null'
            connection_token_file:
              type:
              - string
              - 'null'
            user_data_dir:
              type:
              - string
              - 'null'
        connection_token_type:
          type: string
          enum:
          - ''
          - none
          - mandatory
          description: ServerConnectionTokenType; '' until createServer ran
        connection_token:
          type: string
          description: MandatoryServerConnectionToken.value ('' for None or before createServer)
        has_vsda:
          type: boolean
          description: the vsda signer/validator module is installed (node_modules/vsda). The OSS build has none.
        commit:
          type: string
    initial:
      management_connections: {}
      ext_host_connections: {}
      all_reconnection_tokens: {}
      created: false
      exited: false
      args:
        without_connection_token: false
        connection_token: null
        connection_token_file: null
        user_data_dir: /home/dev/.vscode-server-oss/data
      connection_token_type: ''
      connection_token: ''
      has_vsda: false
      commit: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
- id: server-connection-token
  name: serverConnectionToken.ts
  kind: module
  layer: remote
  parent: remote-extension-host-agent-server
  sources:
  - src/vs/server/node/serverConnectionToken.ts:15-132
  summary: 'Connection-token policy of the remote server: parse the --connection-token / --connection-token-file / --without-connection-token arguments, read or generate the default token, and check a request''s tkn query parameter or vscode-tkn cookie.'
  attributes:
    owner: remote-server
- id: extension-host-connection
  name: ExtensionHostConnection
  kind: module
  layer: remote
  parent: remote-extension-host-agent-server
  sources:
  - src/vs/server/node/extensionHostConnection.ts:108-140
  summary: 'Server side of a remote extension host connection: forks the extension host process (bootstrap-fork --type=extensionHost), hands it the client socket, and cleans up when it exits.'
  attributes:
    owner: remote-server
  state:
    schema:
      type: object
      properties:
        processes:
          type: object
          description: the forked extension host process per reconnection token (_extensionHostProcess)
    initial:
      processes: {}
- id: extension-host-status-service
  name: ExtensionHostStatusService
  kind: service
  layer: remote
  parent: remote-server-process
  sources:
  - src/vs/server/node/extensionHostStatusService.ts:18
  - src/vs/server/node/extensionHostStatusService.ts:9
  - src/vs/server/node/serverServices.ts:181
  summary: Remembers exit info of extension hosts by reconnection token.
  attributes:
    owner: remote-server
  state:
    schema:
      type: object
      properties:
        exit_info:
          type: object
    initial:
      exit_info: {}
interfaces:
# --- server creation ------------------------------------------------------------------------
- component: server-main
  name: on-request
  kind: http
  summary: 'http.createServer handler: create the agent server on first use, then delegate handleRequest.'
  sources:
  - src/server-main.ts:55-66
  - src/server-main.ts:91-98
  request:
    type: object
    properties:
      method:
        type: string
        default: GET
      path:
        type: string
      tkn:
        type:
        - string
        - 'null'
        default: null
        description: the single tkn query parameter; null when the URL has none
      tkns:
        type: array
        items:
          type: string
        default: []
        description: every tkn query parameter, when the URL repeats it
      cookie:
        type:
        - string
        - 'null'
        default: null
        description: the vscode-tkn cookie; null when there is none
      resource_paths:
        type: array
        items:
          type: string
        default: []
      has_web_client:
        type: boolean
        default: false
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - title: getRemoteExtensionHostAgentServer() (memoized createServer)
    source: src/server-main.ts:57-63
    call: server-main-module.create-server
    input: {}
  - call: remote-extension-host-agent-server.handle-request
    input: = input
    as: r
  - return: = vars.r.value
- component: server-main
  name: on-upgrade
  kind: http
  summary: 'http server ''upgrade'' handler: create the agent server on first use, then handleUpgrade turns the request into a WebSocket.'
  sources:
  - src/server-main.ts:100-108
  request:
    type: object
    properties:
      reconnection_token:
        type: string
      reconnection:
        type: boolean
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - title: getRemoteExtensionHostAgentServer() (memoized createServer)
    source: src/server-main.ts:105-106
    call: server-main-module.create-server
    input: {}
  - call: remote-extension-host-agent-server.handle-upgrade
    input:
      reconnection_token: = input.reconnection_token
      reconnection: = input.reconnection
    as: u
  - return: = vars.u.value
- component: server-main-module
  name: create-server
  kind: function
  summary: server.main.ts createServer -> remoteExtensionHostAgentServer.createServer, with the args parsed at load (user-data-dir always set).
  sources:
  - src/vs/server/node/server.main.ts:69-73
  - src/vs/server/node/server.main.ts:42-48
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - call: remote-extension-host-agent-server.create-server
    input: {}
    as: s
  - return: = vars.s.value
- component: remote-extension-host-agent-server
  name: create-server
  kind: function
  summary: 'createServer: determine the connection token first; a parse error prints the message and exits the process (code 1); then error handlers, services and the agent server.'
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:612-620
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - if: state.exited
    then:
    - title: The process already exited on a token parse error; nothing serves requests
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:615-618
      fail:
        code: server-connection-token-parse-error
        message: server process exited
  - if: state.created
    then:
    - title: server-main.ts memoizes the createServer promise; later requests reuse the server
      source: src/server-main.ts:57-63
      return:
        created: false
        connection_token_type: = state.connection_token_type
  - title: determineServerConnectionToken(args)
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:614
    call: server-connection-token.determine-server-connection-token
    input:
      args: = state.args
    as: tok
    on_error:
    - title: ServerConnectionTokenParseError -> console.warn(message); process.exit(1)
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:615-618
      set:
        state.exited: true
    - fail:
        code: server-connection-token-parse-error
        message: = error.message
  - set:
      state.connection_token_type: = vars.tok.value.type
      state.connection_token: = vars.tok.value.value
  - title: Set up the server services and IPC channels
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:660-668
    call: server-services.setup-server-services
    input: {}
  - title: new RemoteExtensionHostAgentServer(socketServer, connectionToken, vsdaMod, ...)
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:736
    set:
      state.created: true
  - return:
      created: true
      connection_token_type: = vars.tok.value.type
- component: remote-extension-host-agent-server
  name: get-connection-token
  kind: function
  summary: The ServerConnectionToken the server was created with (type and, for Mandatory, the value).
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:84
  response:
    type: object
    properties:
      type:
        type: string
      value:
        type: string
  behavior:
  - return:
      type: = state.connection_token_type
      value: = state.connection_token
# --- serverConnectionToken.ts ----------------------------------------------------------------
- component: server-connection-token
  name: determine-server-connection-token
  kind: function
  summary: 'determineServerConnectionToken: parseServerConnectionToken with a default that reads <user-data-dir>/token, or generates a UUID and stores it there (mode 0600).'
  sources:
  - src/vs/server/node/serverConnectionToken.ts:92-120
  request:
    type: object
    properties:
      args:
        type: object
  response:
    type: object
    properties:
      type:
        type: string
      value:
        type: string
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - title: An empty --connection-token value is dropped by parseArgs ("Value must not be empty"), so it counts as not given
    source: src/vs/platform/environment/node/argv.ts:402-405
    set:
      vars.args: '= merge(input.args, {''connection_token'': has(input.args.connection_token) && input.args.connection_token == '''' ? null : (has(input.args.connection_token) ? input.args.connection_token : null), ''connection_token_file'': has(input.args.connection_token_file) && input.args.connection_token_file == '''' ? null : (has(input.args.connection_token_file) ? input.args.connection_token_file : null)})'
  - call: server-connection-token.parse-server-connection-token
    input:
      args: = vars.args
    as: p
  - if: vars.p.value.type != 'default'
    then:
    - return:
        type: = vars.p.value.type
        value: = vars.p.value.value
  - if: '!has(vars.args.user_data_dir) || vars.args.user_data_dir == null || vars.args.user_data_dir == '''''
    then:
    - title: 'No user-data-dir: no place to store it, generate a UUID'
      source: src/vs/server/node/serverConnectionToken.ts:94-97
      return:
        type: mandatory
        value: = 'uuid-' + string(random(1000000000))
  - title: First try the stored token at <user-data-dir>/token
    source: src/vs/server/node/serverConnectionToken.ts:98-107
    call: disk.read-file
    input:
      resource: = 'file://' + vars.args.user_data_dir + '/token'
    as: stored
    on_error: continue
  - if: vars.stored.ok && vars.stored.value.content.replace('\n', '').matches('^[0-9A-Za-z_-]+$')
    then:
    - title: A valid stored token (trailing newline removed) is reused
      source: src/vs/server/node/serverConnectionToken.ts:103-105
      return:
        type: mandatory
        value: = vars.stored.value.content.replace('\n', '')
  - title: No valid stored token; generate one
    source: src/vs/server/node/serverConnectionToken.ts:109-110
    set:
      vars.generated: = 'uuid-' + string(random(1000000000))
  - title: Try to store it (mode 0600); a write failure is ignored
    source: src/vs/server/node/serverConnectionToken.ts:112-115
    call: disk.write-file
    input:
      resource: = 'file://' + vars.args.user_data_dir + '/token'
      content: = vars.generated
    on_error: continue
  - return:
      type: mandatory
      value: = vars.generated
- component: server-connection-token
  name: parse-server-connection-token
  kind: function
  summary: 'parseServerConnectionToken: --without-connection-token gives None; --connection-token-file or --connection-token gives Mandatory after the [0-9A-Za-z_-]+ check; nothing gives the default (Mandatory). Conflicting flags and bad characters are parse errors.'
  sources:
  - src/vs/server/node/serverConnectionToken.ts:50-90
  request:
    type: object
    properties:
      args:
        type: object
  response:
    type: object
    properties:
      type:
        type: string
        enum:
        - none
        - mandatory
        - default
      value:
        type: string
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.token: '= has(input.args.connection_token) ? input.args.connection_token : null'
      vars.file: '= has(input.args.connection_token_file) ? input.args.connection_token_file : null'
  - if: has(input.args.without_connection_token) && input.args.without_connection_token
    then:
    - if: vars.token != null || vars.file != null
      then:
      - title: --without-connection-token together with a token or token file
        source: src/vs/server/node/serverConnectionToken.ts:55-58
        fail:
          code: server-connection-token-parse-error
          message: Please do not use the argument '--connection-token' or '--connection-token-file' at the same time as '--without-connection-token'.
    - title: NoneServerConnectionToken (every request passes)
      source: src/vs/server/node/serverConnectionToken.ts:59
      return:
        type: none
        value: ''
  - if: vars.file != null
    then:
    - if: vars.token != null
      then:
      - title: --connection-token together with --connection-token-file
        source: src/vs/server/node/serverConnectionToken.ts:63-65
        fail:
          code: server-connection-token-parse-error
          message: Please do not use the argument '--connection-token' at the same time as '--connection-token-file'.
    - title: Read the token file
      source: src/vs/server/node/serverConnectionToken.ts:67-72
      call: disk.read-file
      input:
        resource: = 'file://' + vars.file
      as: f
      on_error:
      - fail:
          code: server-connection-token-parse-error
          message: = 'Unable to read the connection token file at \'' + vars.file + '\'.'
    - set:
        vars.raw: = vars.f.value.content.replace('\n', '')
    - if: '!vars.raw.matches(''^[0-9A-Za-z_-]+$'')'
      then:
      - title: The file's token has characters outside 0-9, a-z, A-Z, _ and -
        source: src/vs/server/node/serverConnectionToken.ts:74-76
        fail:
          code: server-connection-token-parse-error
          message: = 'The connection token defined in \'' + vars.file + ' does not adhere to the characters 0-9, a-z, A-Z, _, or -.'
    - title: MandatoryServerConnectionToken from the file
      source: src/vs/server/node/serverConnectionToken.ts:78
      return:
        type: mandatory
        value: = vars.raw
  - if: vars.token != null
    then:
    - if: '!vars.token.matches(''^[0-9A-Za-z_-]+$'')'
      then:
      - title: --connection-token has characters outside 0-9, a-z, A-Z, _ and -
        source: src/vs/server/node/serverConnectionToken.ts:82-84
        fail:
          code: server-connection-token-parse-error
          message: = 'The connection token \'' + vars.token + ' does not adhere to the characters 0-9, a-z, A-Z or -.'
    - title: MandatoryServerConnectionToken from --connection-token
      source: src/vs/server/node/serverConnectionToken.ts:86
      return:
        type: mandatory
        value: = vars.token
  - title: No token argument; MandatoryServerConnectionToken(await defaultValue())
    source: src/vs/server/node/serverConnectionToken.ts:89
    return:
      type: default
      value: ''
- component: server-connection-token
  name: request-has-valid-connection-token
  kind: function
  summary: 'requestHasValidConnectionToken: the tkn query parameter first (an array when repeated), then the vscode-tkn cookie. None accepts anything; Mandatory needs an exact string match.'
  sources:
  - src/vs/server/node/serverConnectionToken.ts:122-132
  request:
    type: object
    properties:
      token_type:
        type: string
      token_value:
        type: string
      query_tkns:
        type: array
        items:
          type: string
      cookie:
        type:
        - string
        - 'null'
  response:
    type: object
    properties:
      valid:
        type: boolean
      via:
        type: string
  behavior:
  - if: input.token_type == 'none'
    then:
    - title: NoneServerConnectionToken.validate returns true
      source: src/vs/server/node/serverConnectionToken.ts:26-28
      return:
        valid: true
        via: none
  - title: 'searchParams.getAll(''tkn''): one value is compared, several are passed as an array (never === a string)'
    source: src/vs/server/node/serverConnectionToken.ts:124-125
    set:
      vars.query: '= size(input.query_tkns) == 1 ? input.query_tkns[0] : null'
  - if: input.token_type == 'mandatory' && vars.query != null && vars.query == input.token_value
    then:
    - title: MandatoryServerConnectionToken.validate(query tkn) (connectionToken === this.value)
      source: src/vs/server/node/serverConnectionToken.ts:37-39
      return:
        valid: true
        via: query
  - if: input.token_type == 'mandatory' && input.cookie != null && input.cookie == input.token_value
    then:
    - title: Otherwise the vscode-tkn cookie must match
      source: src/vs/server/node/serverConnectionToken.ts:129-131
      return:
        valid: true
        via: cookie
  - title: No query parameter or cookie equals the token (missing, empty or wrong)
    source: src/vs/server/node/serverConnectionToken.ts:131
    return:
      valid: false
      via: none-matched
# --- HTTP and WebSocket -----------------------------------------------------------------------
- component: remote-extension-host-agent-server
  name: handle-request
  kind: http
  summary: 'handleRequest: GET only; /version and /delay-shutdown need no token; then the connection-token gate (403); /vscode-remote-resource; web client; else 404.'
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:115-199
  request:
    type: object
    properties:
      method:
        type: string
        default: GET
      path:
        type: string
      tkn:
        type:
        - string
        - 'null'
        default: null
      tkns:
        type: array
        items:
          type: string
        default: []
      cookie:
        type:
        - string
        - 'null'
        default: null
      origin:
        type:
        - string
        - 'null'
        default: null
      resource_paths:
        type: array
        items:
          type: string
        default: []
      has_web_client:
        type: boolean
        default: false
  errors:
  - code: method-not-allowed
    status: 405
    retryable: false
  - code: bad-request
    status: 400
    retryable: false
  - code: forbidden
    status: 403
    retryable: false
  - code: not-found
    status: 404
    retryable: false
  behavior:
  - set:
      vars.method: '= has(input.method) ? input.method : ''GET'''
      vars.path: '= has(input.path) ? input.path : '''''
  - if: vars.method != 'GET'
    then:
    - title: Only GET is served
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:117-119
      fail:
        code: method-not-allowed
        status: 405
        message: = 'Unsupported method ' + vars.method
  - if: vars.path == ''
    then:
    - title: No URL
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:121-123
      fail:
        code: bad-request
        status: 400
        message: Bad request.
  - if: vars.path == '/version'
    then:
    - title: /version returns the commit (no token needed)
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:145-148
      return:
        status: 200
        body: = state.commit
  - if: vars.path == '/delay-shutdown'
    then:
    - title: /delay-shutdown resets the auto-shutdown timer (no token needed)
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:151-155
      call: server-lifetime-service.delay
      input: {}
    - return:
        status: 200
        body: OK
  - title: Check the tkn query parameter, then the vscode-tkn cookie, against the server's token
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:157
    call: server-connection-token.request-has-valid-connection-token
    input:
      token_type: = state.connection_token_type
      token_value: = state.connection_token
      query_tkns: '= has(input.tkns) && size(input.tkns) > 0 ? input.tkns : (has(input.tkn) && input.tkn != null ? [input.tkn] : [])'
      cookie: '= has(input.cookie) ? input.cookie : null'
    as: gate
  - if: '!vars.gate.value.valid'
    then:
    - title: Invalid connection token -> 403 Forbidden
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:157-160
      fail:
        code: forbidden
        status: 403
        message: Forbidden.
  - if: vars.path == '/vscode-remote-resource'
    then:
    - if: '!has(input.resource_paths) || size(input.resource_paths) != 1'
      then:
      - title: Exactly one path parameter
        source: src/vs/server/node/remoteExtensionHostAgentServer.ts:165-168
        fail:
          code: bad-request
          status: 400
          message: Bad request.
    - title: 'Response headers: a sandboxing CSP, nosniff, Vary: Origin; CORS only for the native workbench origin or an allowed web endpoint'
      source: src/vs/server/node/remoteResourceResponse.ts:10-22
      set:
        vars.headers: '= merge({''Content-Security-Policy'': "default-src ''none''; sandbox", ''X-Content-Type-Options'': ''nosniff'', ''Vary'': ''Origin''}, has(input.origin) && input.origin != null && input.origin == ''vscode-file://vscode-app'' ? {''Access-Control-Allow-Origin'': input.origin} : {})'
    - title: Serve the file with ETag caching
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:189
      call: disk.read-file
      input:
        resource: = 'file://' + input.resource_paths[0]
      as: f
    - return:
        status: 200
        body: = vars.f.value
        headers: = vars.headers
  - if: has(input.has_web_client) && input.has_web_client
    then:
    - title: The web client server handles the remaining paths
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:192-195
      call: web-client-server.handle
      input:
        path: = vars.path
      as: w
    - return: = vars.w.value
  - title: Not found
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:197-198
    fail:
      code: not-found
      status: 404
      message: Not found
- component: remote-extension-host-agent-server
  name: handle-web-socket-connection
  kind: rpc
  attributes:
    protocol: PersistentProtocol control messages
  summary: '_handleWebSocketConnection: auth (checked only for a Mandatory token), sign, connectionType (commit, then the vsda signature when vsda is installed), shorten the grace of disconnected connections, then _handleConnectionType.'
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:274-397
  request:
    type: object
    properties:
      auth:
        type:
        - string
        - 'null'
        default: null
      commit:
        type: string
      desired_connection_type:
        type: string
        examples:
        - management
      is_reconnection:
        type: boolean
      reconnection_token:
        type: string
      signature_valid:
        type: boolean
        default: true
      signed_data:
        type:
        - string
        - 'null'
        default: null
      start_params:
        type:
        - object
        - 'null'
        default: null
  errors:
  - code: connection-error
    status: 0
    retryable: false
    summary: error control message -> VSCODE_CONNECTION_ERROR on the client
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - title: The socket was upgraded by the server object, so the memoized createServer has resolved
    source: src/server-main.ts:105-107
    call: server-main-module.create-server
    input: {}
  - if: state.connection_token_type == 'mandatory' && (!has(input.auth) || input.auth == null || input.auth != state.connection_token)
    then:
    - title: 'Mandatory token: auth must equal it, else "Unauthorized client refused: auth mismatch"'
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:308-310
      fail:
        code: connection-error
        message: 'Unauthorized client refused: auth mismatch'
  - if: has(input.commit) && input.commit != '' && input.commit != state.commit
    then:
    - title: 'Client refused: version mismatch'
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:351-358
      fail:
        code: connection-error
        message: 'Client refused: version mismatch'
  - title: 'valid = no validator (no vsda), or signedData passes the connection token (web client), or the vsda validator accepts it'
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:360-371
    set:
      vars.signature_ok: '= !state.has_vsda || state.connection_token_type == ''none'' || (has(input.signed_data) && input.signed_data != null && input.signed_data == state.connection_token) || !has(input.signature_valid) || input.signature_valid'
  - if: '!vars.signature_ok && config[''environment-is-built'']'
    then:
    - title: Unauthorized client refused (bad signature, built server)
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:373-378
      fail:
        code: connection-error
        message: Unauthorized client refused
  - title: A new connection shortens the grace time of disconnected management connections
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:381-385
    call: management-connection.shorten-reconnection-grace-time
    input: {}
  - title: '... and of every extension host connection (VSCODE_EXTHOST_IPC_REDUCE_GRACE_TIME)'
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:386-389
    call: extension-host-connection.shorten-reconnection-grace-time-if-necessary
    input: {}
  - call: remote-extension-host-agent-server.handle-connection-type
    input: = input
    as: r
  - return: = vars.r.value
- component: remote-extension-host-agent-server
  name: handle-connection-type
  kind: function
  summary: '_handleConnectionType: management or extension-host connection, fresh or reconnection, keyed by reconnection token; tunnels pipe to host:port.'
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:400-518
  request:
    type: object
    properties:
      desired_connection_type:
        type: string
      is_reconnection:
        type: boolean
      reconnection_token:
        type: string
      start_params:
        type:
        - object
        - 'null'
        default: null
  errors:
  - code: connection-error
    status: 0
    retryable: false
  behavior:
  - if: input.desired_connection_type == 'management'
    then:
    - call: remote-extension-host-agent-server.management-connections-get
      input:
        token: = input.reconnection_token
      as: existing
    - if: input.is_reconnection
      then:
      - if: '!has(vars.existing.value.token)'
        then:
        - call: remote-extension-host-agent-server.reconnection-tokens-get
          input:
            token: = input.reconnection_token
          as: seen
        - if: has(vars.seen.value.token)
          then:
          - title: Unknown reconnection token (seen before)
            source: src/vs/server/node/remoteExtensionHostAgentServer.ts:421-424
            fail:
              code: connection-error
              message: Unknown reconnection token (seen before)
        - title: Unknown reconnection token (never seen)
          source: src/vs/server/node/remoteExtensionHostAgentServer.ts:418-420
          fail:
            code: connection-error
            message: Unknown reconnection token (never seen)
      - title: Accept the reconnection on the existing ManagementConnection
        source: src/vs/server/node/remoteExtensionHostAgentServer.ts:427-430
        call: management-connection.accept-reconnection
        input:
          token: = input.reconnection_token
      - return:
          type: ok
          reconnected: true
    - if: has(vars.existing.value.token)
      then:
      - title: Duplicate reconnection token
        source: src/vs/server/node/remoteExtensionHostAgentServer.ts:434-437
        fail:
          code: connection-error
          message: Duplicate reconnection token
    - title: New ManagementConnection, remembered by token
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:439-448
      call: remote-extension-host-agent-server.management-connections-put
      input:
        token: = input.reconnection_token
        value:
          token: = input.reconnection_token
          connected_at: = now
    - call: remote-extension-host-agent-server.reconnection-tokens-put
      input:
        token: = input.reconnection_token
        value:
          token: = input.reconnection_token
    - return:
        type: ok
        reconnected: false
  - if: input.desired_connection_type == 'extension-host'
    then:
    - title: startParams = msg.args || {language 'en'}
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:453-454
      set:
        vars.start_params: '= has(input.start_params) && input.start_params != null ? input.start_params : {''language'': ''en''}'
    - call: remote-extension-host-agent-server.ext-host-connections-get
      input:
        token: = input.reconnection_token
      as: existing_eh
    - if: input.is_reconnection
      then:
      - if: '!has(vars.existing_eh.value.token)'
        then:
        - call: remote-extension-host-agent-server.reconnection-tokens-get
          input:
            token: = input.reconnection_token
          as: seen_eh
        - if: has(vars.seen_eh.value.token)
          then:
          - title: Unknown extension host reconnection token (seen before)
            source: src/vs/server/node/remoteExtensionHostAgentServer.ts:468-471
            fail:
              code: connection-error
              message: Unknown reconnection token (seen before)
        - title: Unknown extension host reconnection token (never seen)
          source: src/vs/server/node/remoteExtensionHostAgentServer.ts:465-467
          fail:
            code: connection-error
            message: Unknown reconnection token (never seen)
      - title: sendPause, reply with the debug port, hand the new socket to the existing ExtensionHostConnection
        source: src/vs/server/node/remoteExtensionHostAgentServer.ts:474-478
        call: extension-host-connection.accept-reconnection
        input:
          token: = input.reconnection_token
      - return:
          type: ok
          reconnected: true
    - if: has(vars.existing_eh.value.token)
      then:
      - title: Duplicate extension host reconnection token
        source: src/vs/server/node/remoteExtensionHostAgentServer.ts:482-485
        fail:
          code: connection-error
          message: Duplicate reconnection token
    - title: New ExtensionHostConnection, remembered by token
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:491-493
      call: remote-extension-host-agent-server.ext-host-connections-put
      input:
        token: = input.reconnection_token
        value:
          token: = input.reconnection_token
          connected_at: = now
    - call: remote-extension-host-agent-server.reconnection-tokens-put
      input:
        token: = input.reconnection_token
        value:
          token: = input.reconnection_token
    - title: The extension host keeps the server alive (serverLifetimeService.active)
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:494
      call: server-lifetime-service.active
      input:
        consumer: = 'ExtensionHost:' + input.reconnection_token
    - title: con.start(startParams); a failure is only logged
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:500-502
      call: extension-host-connection.start
      input:
        token: = input.reconnection_token
        start_params: = vars.start_params
      on_error: continue
    - return:
        type: ok
        reconnected: false
  - if: input.desired_connection_type == 'tunnel'
    then:
    - title: Tunnel connections pipe to host:port
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:505-512
      return:
        type: ok
        reconnected: false
  - title: Unknown initial data received
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:513-516
    fail:
      code: connection-error
      message: Unknown initial data received
- component: remote-extension-host-agent-server
  name: ext-host-connections-get
  kind: store
  summary: _extHostConnections[reconnectionToken]
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:71
  store:
    table: ext_host_connections
    op: get
    key: = input.token
    default: {}
- component: remote-extension-host-agent-server
  name: ext-host-connections-put
  kind: store
  summary: _extHostConnections[token] = con
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:492
  store:
    table: ext_host_connections
    op: put
    key: = input.token
    value: = input.value
- component: remote-extension-host-agent-server
  name: ext-host-connections-delete
  kind: store
  summary: con.onClose -> delete _extHostConnections[token]
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:495-498
  store:
    table: ext_host_connections
    op: delete
    key: = input.token
- component: remote-socket-factory-service
  name: connect
  kind: function
  summary: 'connect: the socket factory for the connection type opens a WebSocket to the server (an HTTP upgrade request).'
  sources:
  - src/vs/platform/remote/common/remoteSocketFactoryService.ts:53-60
  request:
    type: object
    properties:
      host:
        type: string
      port:
        type: integer
      reconnection_token:
        type: string
      reconnection:
        type: boolean
  behavior:
  - call: server-main.on-upgrade
    input:
      reconnection_token: = input.reconnection_token
      reconnection: = input.reconnection
    as: u
  - return: = vars.u.value
# --- ExtensionHostConnection ------------------------------------------------------------------
- component: extension-host-connection
  name: start
  kind: function
  summary: 'ExtensionHostConnection.start: build the user environment, fork bootstrap-fork --type=extensionHost, wait for VSCODE_EXTHOST_IPC_READY and send it the client socket.'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:247-330
  request:
    type: object
    properties:
      token:
        type: string
      start_params:
        type: object
        properties:
          language:
            type: string
          port:
            type: integer
          break:
            type: boolean
  behavior:
  - title: A debug port asks for --inspect[-brk]=<port> and network inspection
    source: src/vs/server/node/extensionHostConnection.ts:249-256
    set:
      vars.exec_argv: '= (has(input.start_params.port) && input.start_params.port > 0 ? [''--inspect'' + (has(input.start_params.break) && input.start_params.break ? ''-brk'' : '''') + ''='' + string(input.start_params.port), ''--experimental-network-inspection''] : [])'
  - title: buildUserEnvironment(startParams.env, language) then removeDangerousEnvVariables
    source: src/vs/server/node/extensionHostConnection.ts:260-261
    set:
      vars.language: '= has(input.start_params.language) ? input.start_params.language : ''en'''
  - title: The socket can be sent to the child (not Windows with --socket-path), so the env carries a SocketExtHostConnection
    source: src/vs/server/node/extensionHostConnection.ts:265-272
    set:
      vars.connection_kind: socket
  - title: Fork arguments; --supportGlobalNavigator only when extensions.supportNodeGlobalNavigator is on
    source: src/vs/server/node/extensionHostConnection.ts:283-290
    set:
      vars.args: '= [''--type=extensionHost'', ''--transformURIs'', ''--useHostProxy=false''] + (config[''extensions-support-node-global-navigator''] ? [''--supportGlobalNavigator''] : [])'
  - title: 'cp.fork(bootstrap-fork, args, {env, execArgv: --dns-result-order=ipv4first, ...})'
    source: src/vs/server/node/extensionHostConnection.ts:291-293
    call: extension-host-connection.processes-put
    input:
      token: = input.token
      value:
        token: = input.token
        module: bootstrap-fork
        args: = vars.args
        exec_argv: = ['--dns-result-order=ipv4first'] + vars.exec_argv
        language: = vars.language
        connection: = vars.connection_kind
        status: forked
        socket_sent: false
        forked_at: = now
  - title: The child reports VSCODE_EXTHOST_IPC_READY; the server sends it the client socket and drops its copy
    source: src/vs/server/node/extensionHostConnection.ts:314-322
    call: extension-host-connection.send-socket-to-extension-host
    input:
      token: = input.token
  - return:
      forked: true
      args: = vars.args
- component: extension-host-connection
  name: send-socket-to-extension-host
  kind: function
  summary: '_sendSocketToExtensionHost: drain pending writes, then extensionHostProcess.send(VSCODE_EXTHOST_IPC_SOCKET, socket).'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:190-201
  request:
    type: object
    properties:
      token:
        type: string
  behavior:
  - call: extension-host-connection.processes-get
    input:
      token: = input.token
    as: p
  - if: '!has(vars.p.value.token)'
    then:
    - title: The extension host process is gone
      source: src/vs/server/node/extensionHostConnection.ts:220-224
      return:
        sent: false
  - call: extension-host-connection.processes-put
    input:
      token: = input.token
      value: '= merge(vars.p.value, {''status'': ''running'', ''socket_sent'': true, ''sockets_sent'': (has(vars.p.value.sockets_sent) ? vars.p.value.sockets_sent : 0) + 1})'
  - return:
      sent: true
- component: extension-host-connection
  name: accept-reconnection
  kind: function
  summary: 'acceptReconnection: keep the new socket until the process starts, else send it to the running extension host.'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:213-226
  request:
    type: object
    properties:
      token:
        type: string
  behavior:
  - call: extension-host-connection.processes-get
    input:
      token: = input.token
    as: p
  - if: '!has(vars.p.value.token)'
    then:
    - title: The extension host didn't even start up yet; keep the connection data
      source: src/vs/server/node/extensionHostConnection.ts:220-224
      return:
        sent: false
  - title: Send the new socket to the running extension host
    source: src/vs/server/node/extensionHostConnection.ts:226
    call: extension-host-connection.send-socket-to-extension-host
    input:
      token: = input.token
    as: s
  - return: = vars.s.value
- component: extension-host-connection
  name: shorten-reconnection-grace-time-if-necessary
  kind: function
  summary: 'shortenReconnectionGraceTimeIfNecessary: every forked extension host gets VSCODE_EXTHOST_IPC_REDUCE_GRACE_TIME.'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:203-211
  behavior:
  - call: extension-host-connection.processes-query
    input: {}
    as: all
  - foreach: = vars.all.value
    as: p
    steps:
    - title: send({type VSCODE_EXTHOST_IPC_REDUCE_GRACE_TIME})
      source: src/vs/server/node/extensionHostConnection.ts:207-210
      call: extension-host-connection.processes-put
      input:
        token: = vars.p.token
        value: '= merge(vars.p, {''grace_reduced'': true})'
  - return:
      notified: = size(vars.all.value)
- component: extension-host-connection
  name: on-process-exit
  kind: event
  summary: 'extensionHostProcess ''exit'': remember {code, signal} by reconnection token, then _cleanResources (kill, onClose: the server forgets the connection and its lifetime token).'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:303-307
  request:
    type: object
    properties:
      token:
        type: string
        examples:
        - tok-eh1
      code:
        type: integer
      signal:
        type:
        - string
        - 'null'
  behavior:
  - call: extension-host-connection.processes-get
    input:
      token: = input.token
    as: p
  - if: '!has(vars.p.value.token)'
    then:
    - title: Already cleaned up (_disposed)
      source: src/vs/server/node/extensionHostConnection.ts:229-232
      return:
        cleaned: false
  - title: setExitInfo(reconnectionToken, {code, signal})
    source: src/vs/server/node/extensionHostConnection.ts:304
    call: extension-host-status-service.set-exit-info
    input:
      token: = input.token
      exit:
        code: = input.code
        signal: '= has(input.signal) ? input.signal : null'
  - title: _cleanResources drops the process
    source: src/vs/server/node/extensionHostConnection.ts:228-244
    call: extension-host-connection.processes-delete
    input:
      token: = input.token
  - title: onClose -> the server deletes the connection and releases its lifetime token
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:495-499
    call: remote-extension-host-agent-server.ext-host-connections-delete
    input:
      token: = input.token
  - call: server-lifetime-service.inactive
    input:
      consumer: = 'ExtensionHost:' + input.token
    on_error: continue
  - return:
      cleaned: true
