scenarios:
# --- HTTP gate (Mandatory token tok-dev from --connection-token) ---------------------------------
- id: remote-server-token-http-gate
  description: 'requestHasValidConnectionToken (serverConnectionToken.ts:122-132) on a server started with --connection-token tok-dev: an empty tkn, a missing tkn (no query, no cookie), a wrong tkn and a repeated tkn all get 403; the right tkn or the right vscode-tkn cookie pass.'
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-server-http-request
    as: empty
    input: {method: GET, path: /vscode-remote-resource, tkn: '', resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: missing
    input: {method: GET, path: /vscode-remote-resource, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: wrong
    input: {method: GET, path: /vscode-remote-resource, tkn: tok-devX, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: repeated
    input: {method: GET, path: /vscode-remote-resource, tkns: [tok-dev, tok-dev], resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: wrongcookie
    input: {method: GET, path: /vscode-remote-resource, tkn: '', cookie: nope, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: query
    input: {method: GET, path: /vscode-remote-resource, tkn: tok-dev, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: cookie
    input: {method: GET, path: /vscode-remote-resource, cookie: tok-dev, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: version
    input: {method: GET, path: /version}
  expect:
  - "state['remote-extension-host-agent-server@srv1'].connection_token_type == 'mandatory' && state['remote-extension-host-agent-server@srv1'].connection_token == 'tok-dev'"
  - "[steps.empty, steps.missing, steps.wrong, steps.repeated, steps.wrongcookie].all(s, !s.result.ok && s.result.error.code == 'forbidden' && s.result.error.status == 403)"
  - "steps.query.result.ok && steps.query.result.value.status == 200 && steps.cookie.result.ok && steps.cookie.result.value.status == 200"
  - "steps.query.result.value.headers['Content-Security-Policy'] == \"default-src 'none'; sandbox\" && !('Access-Control-Allow-Origin' in steps.query.result.value.headers)"
  - "steps.version.result.ok"
  - "trace.filter(e, e.type == 'call.end' && e.interface == 'server-connection-token.request-has-valid-connection-token').map(e, e.output.via) == ['none-matched', 'none-matched', 'none-matched', 'none-matched', 'none-matched', 'query', 'cookie']"
  - "calls['disk.read-file'] == 2"
  - "calls['remote-extension-host-agent-server.create-server'] == 8 && trace.filter(e, e.type == 'call.start' && e.interface == 'server-connection-token.determine-server-connection-token').size() == 1"
# --- createServer: determineServerConnectionToken -------------------------------------------------
- id: remote-server-token-no-args-generates-and-stores
  description: 'No token argument: the default token is generated (no <user-data-dir>/token yet), stored there, and is Mandatory, so empty and missing tkn get 403 (serverConnectionToken.ts:89, 109-117; serverConnectionToken.test.ts:26).'
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      args:
        connection_token: null
  steps:
  - flow: rs-remote-server-http-request
    as: empty
    input: {method: GET, path: /vscode-remote-resource, tkn: '', resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: missing
    input: {method: GET, path: /vscode-remote-resource, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-environment-data
    as: env
  expect:
  - "!steps.empty.result.ok && steps.empty.result.error.status == 403 && !steps.missing.result.ok && steps.missing.result.error.status == 403"
  - "state['remote-extension-host-agent-server@srv1'].connection_token_type == 'mandatory' && state['remote-extension-host-agent-server@srv1'].connection_token.startsWith('uuid-')"
  - "state['disk'].files['file:///home/dev/.vscode-server-oss/data/token'].content == state['remote-extension-host-agent-server@srv1'].connection_token"
  - "steps.env.result.value.connection_token == state['remote-extension-host-agent-server@srv1'].connection_token"
  - "trace.exists(e, e.type == 'note' && e.title == 'No valid stored token; generate one')"
- id: remote-server-token-empty-arg-ignored
  description: '--connection-token "" is dropped by parseArgs (argv.ts:402-405), so the server falls back to the stored token, never to "no token": an empty tkn is still refused.'
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      args:
        connection_token: ''
    disk:
      files:
        file:///home/dev/.vscode-server-oss/data/token:
          content: "stored-tok_1\n"
          mtime: 0
          size: 13
  steps:
  - flow: rs-remote-server-http-request
    as: empty
    input: {method: GET, path: /vscode-remote-resource, tkn: '', resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: stored
    input: {method: GET, path: /vscode-remote-resource, tkn: stored-tok_1, resource_paths: [/work/app/README.md]}
  expect:
  - "!steps.empty.result.ok && steps.empty.result.error.status == 403"
  - "steps.stored.result.ok && state['remote-extension-host-agent-server@srv1'].connection_token == 'stored-tok_1'"
  - "trace.exists(e, e.type == 'note' && e.title.startsWith('A valid stored token')) && calls['disk.write-file'] == 0"
- id: remote-server-token-no-user-data-dir
  description: 'Without a user-data-dir there is no place to store the token, so a fresh UUID is generated and nothing is written (serverConnectionToken.ts:94-97).'
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      args:
        connection_token: null
        user_data_dir: null
  steps:
  - flow: rs-remote-server-http-request
    as: missing
    input: {method: GET, path: /vscode-remote-resource, resource_paths: [/work/app/README.md]}
  expect:
  - "!steps.missing.result.ok && steps.missing.result.error.status == 403"
  - "state['remote-extension-host-agent-server@srv1'].connection_token.startsWith('uuid-') && calls['disk.write-file'] == 0 && calls['disk.read-file'] == 0"
- id: remote-server-token-file
  description: '--connection-token-file: the file''s token (trailing newline removed) becomes the Mandatory token (serverConnectionToken.ts:62-78).'
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      args:
        connection_token: null
        connection_token_file: /home/dev/tkn.txt
    disk:
      files:
        file:///home/dev/tkn.txt:
          content: "file-tok\n"
          mtime: 0
          size: 9
  steps:
  - flow: rs-remote-server-http-request
    as: ok
    input: {method: GET, path: /vscode-remote-resource, tkn: file-tok, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-server-http-request
    as: newline
    input: {method: GET, path: /vscode-remote-resource, tkn: "file-tok\n", resource_paths: [/work/app/README.md]}
  expect:
  - "steps.ok.result.ok && !steps.newline.result.ok && steps.newline.result.error.status == 403"
  - "state['remote-extension-host-agent-server@srv1'].connection_token == 'file-tok'"
- id: remote-server-token-parse-errors
  description: 'Each ServerConnectionTokenParseError ends the server (console.warn, process.exit(1)), so no request is served (serverConnectionToken.ts:55-84; remoteExtensionHostAgentServer.ts:614-618).'
  fixtures:
  - remote-server-srv1
  steps:
  - interface: server-connection-token.parse-server-connection-token
    caller: remote-server-process
    as: both
    input: {args: {without_connection_token: true, connection_token: tok-dev, connection_token_file: null}}
  - interface: server-connection-token.parse-server-connection-token
    caller: remote-server-process
    as: fileandtoken
    input: {args: {without_connection_token: false, connection_token: tok-dev, connection_token_file: /home/dev/tkn.txt}}
  - interface: server-connection-token.parse-server-connection-token
    caller: remote-server-process
    as: nofile
    input: {args: {without_connection_token: false, connection_token: null, connection_token_file: /home/dev/missing.txt}}
  - interface: server-connection-token.parse-server-connection-token
    caller: remote-server-process
    as: badchars
    input: {args: {without_connection_token: false, connection_token: 'bad token!', connection_token_file: null}}
  expect:
  - "[steps.both, steps.fileandtoken, steps.nofile, steps.badchars].all(s, !s.result.ok && s.result.error.code == 'server-connection-token-parse-error')"
  - "steps.both.result.error.message.contains('--without-connection-token') && steps.fileandtoken.result.error.message.contains('--connection-token-file')"
  - "steps.nofile.result.error.message.startsWith('Unable to read the connection token file') && steps.badchars.result.error.message.contains('does not adhere')"
- id: remote-server-token-bad-arg-exits
  description: 'A --connection-token with characters outside [0-9A-Za-z_-] makes createServer exit: the request fails and the server stays down.'
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      args:
        connection_token: tok dev
  steps:
  - flow: rs-remote-server-http-request
    as: first
    input: {method: GET, path: /version}
  - flow: rs-remote-server-http-request
    as: second
    input: {method: GET, path: /version}
  expect:
  - "!steps.first.result.ok && steps.first.result.error.code == 'server-connection-token-parse-error' && !steps.second.result.ok"
  - "state['remote-extension-host-agent-server@srv1'].exited && !state['remote-extension-host-agent-server@srv1'].created"
  - "calls['server-services.setup-server-services'] == 0"
- id: remote-server-token-without-connection-token
  description: '--without-connection-token gives NoneServerConnectionToken: every request passes the gate and the handshake skips the auth check (serverConnectionToken.ts:26-28, 59; remoteExtensionHostAgentServer.ts:308).'
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      args:
        without_connection_token: true
        connection_token: null
  steps:
  - flow: rs-remote-server-http-request
    as: missing
    input: {method: GET, path: /vscode-remote-resource, resource_paths: [/work/app/README.md]}
  - flow: rs-remote-ext-host-connect
    as: hs
    input: {auth: anything, commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-n}
  - flow: rs-remote-environment-data
    as: env
  expect:
  - "steps.missing.result.ok && steps.hs.result.ok && steps.env.result.value.connection_token == ''"
  - "state['remote-extension-host-agent-server@srv1'].connection_token_type == 'none' && 'tok-n' in state['remote-extension-host-agent-server@srv1'].management_connections"
# --- handshake auth ------------------------------------------------------------------------------
- id: remote-server-token-handshake-auth
  description: 'With a Mandatory token, the first handshake message''s auth must equal it: an empty, a missing and a wrong auth are refused before any connection is created (remoteExtensionHostAgentServer.ts:308-310).'
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: empty
    input: {auth: '', commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-e}
  - flow: rs-remote-ext-host-connect
    as: missing
    input: {commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-m}
  - flow: rs-remote-ext-host-connect
    as: wrong
    input: {auth: tok-devX, commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-w}
  - flow: rs-remote-ext-host-connect
    as: right
    input: {auth: tok-dev, commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-r}
  expect:
  - "[steps.empty, steps.missing, steps.wrong].all(s, !s.result.ok && s.result.error.message == 'Unauthorized client refused: auth mismatch')"
  - "steps.right.result.ok && state['remote-extension-host-agent-server@srv1'].management_connections.size() == 1 && 'tok-r' in state['remote-extension-host-agent-server@srv1'].management_connections"
- id: remote-server-handshake-web-client-signed-data
  description: 'With vsda installed, a connectionType message whose signedData equals the connection token (a web client) is valid even when the vsda validator would refuse it (remoteExtensionHostAgentServer.ts:360-371).'
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      has_vsda: true
  steps:
  - flow: rs-remote-ext-host-connect
    as: web
    input: {auth: tok-dev, commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-web, signature_valid: false, signed_data: tok-dev}
  - flow: rs-remote-ext-host-connect
    as: bad
    input: {auth: tok-dev, commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-bad, signature_valid: false, signed_data: other}
  expect:
  - "steps.web.result.ok && !steps.bad.result.ok && steps.bad.result.error.message == 'Unauthorized client refused'"
  - "'tok-web' in state['remote-extension-host-agent-server@srv1'].management_connections && !('tok-bad' in state['remote-extension-host-agent-server@srv1'].management_connections)"
- id: remote-server-handshake-oss-no-vsda
  description: 'The OSS build has no vsda module, so there is no validator and a bad signature is accepted (remoteExtensionHostAgentServer.ts:279, 361-362).'
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: hs
    input: {auth: tok-dev, commit: '', desired_connection_type: management, is_reconnection: false, reconnection_token: tok-o, signature_valid: false}
  expect:
  - "steps.hs.result.ok && 'tok-o' in state['remote-extension-host-agent-server@srv1'].management_connections"
# --- remote extension host fork ------------------------------------------------------------------
- id: remote-server-ext-host-fork
  description: 'An extension-host connection forks bootstrap-fork --type=extensionHost (with --inspect-brk for a debug port and --supportGlobalNavigator when configured) and hands it the socket once it is ready (extensionHostConnection.ts:247-322).'
  fixtures:
  - remote-server-srv1
  config:
    extensions-support-node-global-navigator: true
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input: {auth: tok-dev, commit: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf, desired_connection_type: extension-host, is_reconnection: false, reconnection_token: tok-eh1, start_params: {language: de, port: 9333, break: true}}
  expect:
  - "steps.eh.result.ok && 'tok-eh1' in state['remote-extension-host-agent-server@srv1'].ext_host_connections"
  - "state['extension-host-connection@srv1'].processes['tok-eh1'].module == 'bootstrap-fork' && state['extension-host-connection@srv1'].processes['tok-eh1'].args == ['--type=extensionHost', '--transformURIs', '--useHostProxy=false', '--supportGlobalNavigator']"
  - "state['extension-host-connection@srv1'].processes['tok-eh1'].exec_argv == ['--dns-result-order=ipv4first', '--inspect-brk=9333', '--experimental-network-inspection'] && state['extension-host-connection@srv1'].processes['tok-eh1'].language == 'de'"
  - "state['extension-host-connection@srv1'].processes['tok-eh1'].status == 'running' && state['extension-host-connection@srv1'].processes['tok-eh1'].socket_sent"
  - "state['server-lifetime-service@srv1'].total == 1"
- id: remote-server-ext-host-exit-then-read
  description: 'When the forked extension host exits, its {code, signal} is remembered by token and the window can read it back over remoteextensionsenvironment; the server forgets the connection and its lifetime token.'
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: false, reconnection_token: tok-eh1}
  - flow: rs-remote-ext-host-exit
    as: exit
    on: srv1
    input: {token: tok-eh1, code: 1, signal: null}
  - flow: rs-remote-ext-host-exit
    as: again
    on: srv1
    input: {token: tok-eh1, code: 1, signal: null}
  - flow: rs-remote-ext-host-exit-info
    as: info
    on: srv1
    input: {reconnection_token: tok-eh1}
  - flow: rs-remote-ext-host-exit-info
    as: unknown
    on: srv1
    input: {reconnection_token: tok-other}
  expect:
  - "steps.exit.result.value.cleaned && !steps.again.result.value.cleaned"
  - "steps.info.result.value.exit_info.code == 1 && steps.unknown.result.value.exit_info == null"
  - "!('tok-eh1' in state['remote-extension-host-agent-server@srv1'].ext_host_connections) && !('tok-eh1' in state['extension-host-connection@srv1'].processes)"
  - "state['server-lifetime-service@srv1'].total == 0"
- id: remote-server-ext-host-reconnect
  description: 'Extension host reconnection: the known token gets the new socket sent to the running process; an unknown token is refused, a fresh connection with a live token is a duplicate (remoteExtensionHostAgentServer.ts:462-486).'
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: false, reconnection_token: tok-eh1}
  - flow: rs-remote-ext-host-connect
    as: re
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: true, reconnection_token: tok-eh1}
  - flow: rs-remote-ext-host-connect
    as: dup
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: false, reconnection_token: tok-eh1}
  - flow: rs-remote-ext-host-connect
    as: never
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: true, reconnection_token: tok-zz}
  expect:
  - "steps.re.result.value.reconnected && state['extension-host-connection@srv1'].processes['tok-eh1'].sockets_sent == 2"
  - "steps.dup.result.error.message == 'Duplicate reconnection token' && steps.never.result.error.message == 'Unknown reconnection token (never seen)'"
  - "state['extension-host-connection@srv1'].processes['tok-eh1'].grace_reduced"
- id: remote-server-ext-host-reconnect-seen-before
  description: A token the server saw before, but whose extension host connection is gone, is refused as seen before.
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: false, reconnection_token: tok-eh1}
  - flow: rs-remote-ext-host-exit
    as: exit
    on: srv1
    input: {token: tok-eh1, code: 0, signal: null}
  - flow: rs-remote-ext-host-connect
    as: re
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: true, reconnection_token: tok-eh1}
  expect:
  - "steps.re.result.error.message == 'Unknown reconnection token (seen before)'"
  - "'tok-eh1' in state['remote-extension-host-agent-server@srv1'].all_reconnection_tokens"
