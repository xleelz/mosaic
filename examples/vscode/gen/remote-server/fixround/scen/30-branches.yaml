scenarios:
- id: remote-server-token-file-bad-characters
  description: A token file whose content has characters outside [0-9A-Za-z_-] is a parse error, and createServer exits (serverConnectionToken.ts:74-76).
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      args:
        connection_token: null
        connection_token_file: /home/dev/tkn.txt
    disk:
      files:
        file:///home/dev/tkn.txt:
          content: "bad token\n"
          mtime: 0
          size: 10
  steps:
  - flow: rs-remote-server-http-request
    as: r
    input: {method: GET, path: /version}
  expect:
  - "!steps.r.result.ok && steps.r.result.error.code == 'server-connection-token-parse-error' && steps.r.result.error.message.contains('does not adhere')"
  - "state['remote-extension-host-agent-server@srv1'].exited"
- id: remote-server-allowed-extensions-publisher-stable
  description: A publisher entry 'stable' refuses that publisher's pre-releases and allows its releases (allowedExtensionsService.ts:132-135).
  fixtures:
  - remote-server-seed
  config:
    extensions-allowed:
      ms-python: stable
  steps:
  - {interface: allowed-extensions-service.is-allowed, caller: user, as: pre, input: {id: ms-python.python, publisher: ms-python, prerelease: true}}
  - {interface: allowed-extensions-service.is-allowed, caller: user, as: rel, input: {id: ms-python.python, publisher: ms-python, prerelease: false}}
  expect:
  - "!steps.pre.result.value.allowed && steps.pre.result.value.reason == 'the pre-release versions from this publisher are not in the allowed list' && steps.rel.result.value.allowed"
- id: remote-server-ext-host-reconnect-before-fork
  description: An extension host reconnection that arrives before the process was forked only keeps the new socket (extensionHostConnection.ts:220-224).
  fixtures:
  - remote-server-srv1
  state:
    remote-extension-host-agent-server:
      ext_host_connections:
        tok-early:
          token: tok-early
  steps:
  - flow: rs-remote-ext-host-connect
    as: re
    input: {auth: tok-dev, commit: '', desired_connection_type: extension-host, is_reconnection: true, reconnection_token: tok-early}
  expect:
  - "steps.re.result.ok && steps.re.result.value.reconnected"
  - "!('tok-early' in state['extension-host-connection@srv1'].processes) && trace.exists(e, e.type == 'note' && e.title.startsWith('The extension host didn'))"
