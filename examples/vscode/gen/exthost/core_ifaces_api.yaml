          deselect_all:
            - title: The picked subset replaces the stored list
              source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:422
              call: user-trusted-extension-id-storage.set
              input: {extensions: []}
            - return: {authorized: []}
          dismiss:
            - return: {authorized: "= vars.stored.value.extensions"}

  # ======================= responsiveness =======================
  - component: rpc-protocol
    name: send-request
    kind: function
    summary: "_remoteCall/_onWillSendRequest: start the 3 s unresponsive countdown with the first unacknowledged request; if no acknowledgement arrives before the next 1 s check past the deadline, the host is unresponsive."
    sources:
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:461-495
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:182-192
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:206-219
    request: {type: object, properties: {method: {type: string, default: "$test_latency"}}}
    response: {type: object, properties: {acknowledged: {type: boolean}, responsive: {type: boolean}}}
    behavior:
      - set:
          state.unresponsive_at: "= state.unacked == 0 ? now + config['rpc-unresponsive-time-ms'] : state.unresponsive_at"
          state.unacked: "= state.unacked + 1"
      - call: ext-host-rpc-protocol.receive-request
        on: "= 'eh' + self.substring(1)"
        input: {method: "= input.method"}
        timeout_ms: "= config['rpc-unresponsive-time-ms'] + config['rpc-unresponsive-check-interval-ms']"
        as: req
        on_error:
          - title: Still unacknowledged at the first check past the deadline; Unresponsive
            source: src/vs/workbench/services/extensions/common/rpcProtocol.ts:212-215
            set: {state.responsive: false}
          - publish: rpc-protocol.on-did-change-responsive-state
            input: {responsive: false}
            delivery: sync
          - return: {acknowledged: false, responsive: false}
      - return: {acknowledged: true, responsive: "= state.responsive"}
  - component: rpc-protocol
    name: receive-acknowledge
    kind: function
    summary: "_onDidReceiveAcknowledge: push the deadline, decrement the count, and mark the host responsive again."
    sources:
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:194-204
    behavior:
      - set:
          state.unacked: "= state.unacked > 0 ? state.unacked - 1 : 0"
          state.unresponsive_at: "= now + config['rpc-unresponsive-time-ms']"
      - if: "!state.responsive"
        then:
          - title: The ext host is responsive again
            source: src/vs/workbench/services/extensions/common/rpcProtocol.ts:202-203
            set: {state.responsive: true}
          - publish: rpc-protocol.on-did-change-responsive-state
            input: {responsive: true}
            delivery: sync
  - component: rpc-protocol
    name: on-did-change-responsive-state
    kind: event
    summary: "RPCProtocol.onDidChangeResponsiveState(Responsive | Unresponsive)."
    sources:
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:121-122
    request: {type: object, properties: {responsive: {type: boolean}}}
  - component: ext-host-rpc-protocol
    name: receive-request
    kind: function
    summary: "_receiveRequest: acknowledge the request as soon as the host's event loop reads it, then invoke the target method. A blocked event loop delays both."
    sources:
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:358-380
    request: {type: object, properties: {method: {type: string}}}
    behavior:
      - title: Send Acknowledged before running the method
        source: src/vs/workbench/services/extensions/common/rpcProtocol.ts:377-379
        emit: rpc-protocol.receive-acknowledge
        on: "= 'w' + self.substring(2)"
      - call: ext-host-extension-service.test-latency
        input: {n: 0}

