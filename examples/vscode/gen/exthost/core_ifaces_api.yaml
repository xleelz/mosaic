  - component: manage-authorized-extension-uris-action
    name: cmd-workbench-extensions-action-manage-authorized-extension-uris
    kind: command
    summary: "Lists the remembered extensions in a multi-select quick pick (all picked); the selection replaces the list, dismissing changes nothing, and an empty list shows an info item."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:395
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:405-423
    response: {type: object, properties: {authorized: {type: array, items: {type: string}}}}
    behavior:
      - call: user-trusted-extension-id-storage.get
        as: stored
      - if: "size(vars.stored.value.extensions) == 0"
        then:
          - title: There are currently no authorized extension URIs
            source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:410-413
            call: quick-input-service.pick
            input: {items: ["There are currently no authorized extension URIs."], can_pick_many: false}
          - return: {authorized: []}
      - call: quick-input-service.pick
        input: {items: "= vars.stored.value.extensions", can_pick_many: true}
      - choice: selection
        default: keep_all
        options:
          keep_all:
