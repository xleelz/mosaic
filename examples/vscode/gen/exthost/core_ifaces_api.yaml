interfaces:
  # ======================= ExtHostCommands / MainThreadCommands =======================
  - component: ext-host-commands
    name: register-command
    kind: function
    summary: "registerCommand(global, id, callback): reject an empty or duplicate id, keep the callback locally and, for global commands, $registerCommand on the renderer."
    sources:
      - src/vs/workbench/api/common/extHostCommands.ts:148-171
    request: {type: object, required: [command_id], properties: {command_id: {type: string, examples: [myext.sayHello]}, global: {type: boolean, default: true}}}
    response: {type: object, properties: {registered: {type: boolean}}}
    errors:
      - {code: invalid-id, status: 0, retryable: false}
      - {code: command-already-exists, status: 0, retryable: false}
    behavior:
      - if: "size(input.command_id.trim()) == 0"
        then:
          - title: invalid id
            source: src/vs/workbench/api/common/extHostCommands.ts:151-153
            fail: {code: invalid-id, message: "invalid id"}
      - if: "input.command_id in state.commands"
        then:
          - title: command already exists
            source: src/vs/workbench/api/common/extHostCommands.ts:155-157
            fail: {code: command-already-exists, message: "= 'command ' + input.command_id + ' already exists'"}
      - set: {state.commands: "= state.commands + [input.command_id]"}
      - if: "input.global"
        then:
          - call: main-thread-commands.register-command
            on: "= 'w' + self.substring(2)"
            input: {command_id: "= input.command_id"}
      - return: {registered: true}
  - component: ext-host-commands
    name: execute-command
    kind: function
    summary: "executeCommand/_doExecuteCommand: a command registered in this host runs locally (firing onCommand:<id> without waiting); any other goes to $executeCommand, and a '$executeCommand:retry' answer re-runs it once without retry."
    sources:
      - src/vs/workbench/api/common/extHostCommands.ts:173-229
    request: {type: object, required: [command_id], properties: {command_id: {type: string, examples: [workbench.action.files.save]}, args: {type: array, default: []}, retry: {type: boolean, default: true}}}
    response: {type: object, properties: {value: {}}}
    behavior:
      - if: "input.command_id in state.commands"
        then:
          - title: Registered in this extension host; emit onCommand activation (not awaited) and run the callback here
            source: src/vs/workbench/api/common/extHostCommands.ts:180-186
            emit: main-thread-commands.fire-command-activation-event
            on: "= 'w' + self.substring(2)"
            input: {command_id: "= input.command_id"}
          - call: third-party-extension.run-command
            input: {command_id: "= input.command_id", args: "= input.args"}
            as: local
          - return: {value: "= vars.local.value.value"}
      - call: main-thread-commands.execute-command
        on: "= 'w' + self.substring(2)"
        input: {command_id: "= input.command_id", args: "= input.args", retry: "= input.retry"}
        as: remote
        on_error:
          - if: "error.code == 'execute-command-retry'"
            then:
              - title: The command was unknown but may now be registered in this host; run again without retry
                source: src/vs/workbench/api/common/extHostCommands.ts:218-224
                call: ext-host-commands.execute-command
                input: {command_id: "= input.command_id", args: "= input.args", retry: false}
                as: again
              - return: "= vars.again.value"
          - fail: "= error"
      - return: {value: "= vars.remote.value.value"}
  - component: ext-host-commands
    name: get-commands
    kind: function
    summary: "getCommands(filterUnderscoreCommands): $getCommands, optionally dropping ids starting with '_'."
    sources:
      - src/vs/workbench/api/common/extHostCommands.ts:324-334
    request: {type: object, properties: {filter_internal: {type: boolean, default: false}}}
    response: {type: object, properties: {commands: {type: array, items: {type: string}}}}
    behavior:
      - call: main-thread-commands.get-commands
        on: "= 'w' + self.substring(2)"
        as: all
      - return: {commands: "= input.filter_internal ? vars.all.value.commands.filter(c, !c.startsWith('_')) : vars.all.value.commands"}
  - component: main-thread-commands
    name: register-command
    kind: rpc
    summary: "$registerCommand(id): register a CommandsRegistry handler that calls back $executeContributedCommand."
    attributes: {shape: MainThreadCommandsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:138
      - src/vs/workbench/api/browser/mainThreadCommands.ts:57-66
    request: {type: object, required: [command_id], properties: {command_id: {type: string, examples: [myext.sayHello]}}}
    behavior:
      - set: {state.registrations: "= input.command_id in state.registrations ? state.registrations : state.registrations + [input.command_id]"}
  - component: main-thread-commands
    name: fire-command-activation-event
    kind: rpc
    summary: "$fireCommandActivationEvent(id): drive-by activateByEvent('onCommand:<id>') unless that event is already done; not awaited."
    attributes: {shape: MainThreadCommandsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:140
      - src/vs/workbench/api/browser/mainThreadCommands.ts:72-79
    request: {type: object, required: [command_id], properties: {command_id: {type: string}}}
    behavior:
      - call: extension-service.activate-by-event
        input: {activation_event: "= 'onCommand:' + input.command_id", activation_kind: normal}
  - component: main-thread-commands
    name: execute-command
    kind: rpc
    summary: "$executeCommand(id, args, retry): for an unknown command with arguments and retry set, activate onCommand:<id> and throw '$executeCommand:retry'; otherwise ICommandService.executeCommand."
    attributes: {shape: MainThreadCommandsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:141
      - src/vs/workbench/api/browser/mainThreadCommands.ts:80-93
    request: {type: object, required: [command_id], properties: {command_id: {type: string, examples: [workbench.action.files.save]}, args: {type: array, default: []}, retry: {type: boolean, default: true}}}
    response: {type: object, properties: {value: {}}}
    errors:
      - {code: execute-command-retry, status: 0, retryable: false, summary: "'$executeCommand:retry' tells the extension host to run the command again"}
      - {code: command-not-found, status: 0, retryable: false}
    behavior:
      - choice: registered
        default: "= input.command_id in state.registrations ? 'known' : 'known'"
        options:
          known: []
          unknown:
            - if: "input.retry && size(input.args) > 0"
              then:
                - title: Unknown command with arguments; activate onCommand:<id> and ask the host to retry
                  source: src/vs/workbench/api/browser/mainThreadCommands.ts:87-90
                  call: extension-service.activate-by-event
                  input: {activation_event: "= 'onCommand:' + input.command_id", activation_kind: normal}
                - fail: {code: execute-command-retry, message: "$executeCommand:retry"}
      - call: command-service.execute-command
        input: {command_id: "= input.command_id", args: "= input.args"}
        as: res
      - return: {value: "= vars.res.value"}
  - component: main-thread-commands
    name: get-commands
    kind: rpc
    summary: "$getCommands: every id in CommandsRegistry (the model lists the extension-host registrations this customer added)."
    attributes: {shape: MainThreadCommandsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:142
      - src/vs/workbench/api/browser/mainThreadCommands.ts:95-97
    response: {type: object, properties: {commands: {type: array, items: {type: string}}}}
    behavior:
      - return: {commands: "= state.registrations"}
  - component: main-thread-commands
    name: dispose
    kind: function
    summary: "dispose(): drop every command this extension host registered."
    sources:
      - src/vs/workbench/api/browser/mainThreadCommands.ts:33-36
    behavior:
      - set: {state.registrations: []}

  # ======================= messages =======================
  - component: ext-host-message-service
    name: show-message
    kind: function
    summary: "showMessage: items become {title, handle, isCloseAffordance}; $showMessage returns the picked handle, mapped back to the item."
    sources:
      - src/vs/workbench/api/common/extHostMessageService.ts:32-78
    request: {type: object, required: [message], properties: {severity: {type: string, enum: [info, warning, error], default: info}, message: {type: string}, items: {type: array, items: {type: string}, default: []}, modal: {type: boolean, default: false}, extension_id: {type: string}}}
    response: {type: object, properties: {selected: {type: string}}}
    behavior:
      - call: main-thread-message-service.show-message
        on: "= 'w' + self.substring(2)"
        input: {severity: "= input.severity", message: "= input.message", modal: "= input.modal", source: "= input.extension_id", commands: "= input.items"}
        as: r
      - if: "vars.r.value.handle >= 0 && vars.r.value.handle < size(input.items)"
        then:
          - return: {selected: "= input.items[vars.r.value.handle]"}
      - return: {}
  - component: main-thread-message-service
    name: show-message
    kind: rpc
    summary: "$showMessage(severity, message, options, commands): modal -> IDialogService.prompt with a Cancel/OK cancel button; otherwise a notification whose buttons resolve the handle, or undefined when it closes."
    attributes: {shape: MainThreadMessageServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:628
      - src/vs/workbench/api/browser/mainThreadMessageService.ts:48-54
      - src/vs/workbench/api/browser/mainThreadMessageService.ts:56-110
      - src/vs/workbench/api/browser/mainThreadMessageService.ts:112-155
    request: {type: object, properties: {severity: {type: string}, message: {type: string}, modal: {type: boolean, default: false}, source: {type: string}, commands: {type: array, items: {type: string}, default: []}}}
    response: {type: object, properties: {handle: {type: integer}}}
    behavior:
      - if: "input.modal"
        then:
          - title: Modal message; dialog with the items as buttons and Cancel (or OK) as cancel button
            source: src/vs/workbench/api/browser/mainThreadMessageService.ts:133-152
            call: dialog-service.prompt
            input: {type: "= input.severity", message: "= input.message", buttons: "= input.commands", cancel_button: "= size(input.commands) > 0 ? 'Cancel' : 'OK'"}
            as: dlg
          - choice: modal_answer
            default: "= has(vars.dlg.value.button) && vars.dlg.value.button == 0 ? 'first_button' : 'cancel'"
            options:
              first_button:
                - return: {handle: 0}
              cancel:
                - return: {handle: -1}
      - title: Notification with the items as primary actions and Manage Extension as secondary action
        source: src/vs/workbench/api/browser/mainThreadMessageService.ts:92-101
        call: notification-service.notify
        input: {severity: "= input.severity", message: "= input.message", source: "= input.source", actions: "= input.commands"}
      - choice: notification_answer
        default: closed
        options:
          first_button:
            - title: The user clicked the first item
              source: src/vs/workbench/api/browser/mainThreadMessageService.ts:65-68
              return: {handle: 0}
          closed:
            - title: The notification closed without a choice; resolve undefined
              source: src/vs/workbench/api/browser/mainThreadMessageService.ts:103-107
              return: {handle: -1}

  # ======================= edits, save =======================
  - component: ext-host-bulk-edits
    name: apply-workspace-edit
    kind: function
    summary: "applyWorkspaceEdit: WorkspaceEdit.from(...) then $tryApplyWorkspaceEdit(dto, undefined, isRefactoring)."
    sources:
      - src/vs/workbench/api/common/extHostBulkEdits.ts:31-34
    request: {type: object, properties: {edits: {type: array, items: {type: object}, default: []}, is_refactoring: {type: boolean, default: false}}}
    response: {type: object, properties: {applied: {type: boolean}}}
    behavior:
      - call: main-thread-bulk-edits.try-apply-workspace-edit
        on: "= 'w' + self.substring(2)"
        input: {edits: "= input.edits", is_refactoring: "= input.is_refactoring"}
        as: r
      - return: "= vars.r.value"
  - component: main-thread-bulk-edits
    name: try-apply-workspace-edit
    kind: rpc
    summary: "$tryApplyWorkspaceEdit: revive the DTO and IBulkEditService.apply; a failure is logged and answered with false."
    attributes: {shape: MainThreadBulkEditsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:347
      - src/vs/workbench/api/browser/mainThreadBulkEdits.ts:31-37
    request: {type: object, properties: {edits: {type: array, items: {type: object}, default: []}, is_refactoring: {type: boolean, default: false}}}
    response: {type: object, properties: {applied: {type: boolean}}}
    behavior:
      - call: bulk-edit-service.apply
        input:
          edits: "= input.edits.map(e, {'type': 'text', 'resource': has(e.resource) ? e.resource : '', 'op': 'edit', 'needs_confirmation': false})"
          show_preview: false
          respect_auto_save_config: "= input.is_refactoring"
          label: ""
        as: r
        on_error:
          - title: IGNORING workspace edit; answer false
            source: src/vs/workbench/api/browser/mainThreadBulkEdits.ts:33-36
            return: {applied: false}
      - return: {applied: "= has(vars.r.value.is_applied) && vars.r.value.is_applied"}
  - component: ext-host-workspace
    name: save
    kind: function
    summary: "save(uri): $save(uri, {saveAs: false}) and revive the resulting URI."
    sources:
      - src/vs/workbench/api/common/extHostWorkspace.ts:918-922
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {uri: {type: string}}}
    behavior:
      - call: main-thread-workspace.save
        on: "= 'w' + self.substring(2)"
        input: {uri: "= input.uri", save_as: false}
        as: r
      - return: "= vars.r.value"
  - component: main-thread-workspace
    name: save
    kind: rpc
    summary: "$save(uri, {saveAs}): find the editors showing the resource and IEditorService.save them (reason explicit, force unless saveAs); return the saved URI, none on failure."
    attributes: {shape: MainThreadWorkspaceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2002
      - src/vs/workbench/api/browser/mainThreadWorkspace.ts:202-221
    request: {type: object, required: [uri], properties: {uri: {type: string}, save_as: {type: boolean, default: false}}}
    response: {type: object, properties: {uri: {type: string}}}
    behavior:
      - call: editor-service.save
        input: {resource: "= input.uri", reason: explicit, save_as: "= input.save_as", force: "= !input.save_as", skip_save_participants: false}
        as: r
      - if: "!vars.r.value.success"
        then:
          - return: {}
      - return: {uri: "= input.uri"}
  - component: ext-host-document-data
    name: save
    kind: function
    summary: "_save(): reject when the document was closed, otherwise $trySaveDocument(uri)."
    sources:
      - src/vs/workbench/api/common/extHostDocumentData.ts:110-115
    request: {type: object, required: [uri], properties: {uri: {type: string}, closed: {type: boolean, default: false}}}
    response: {type: object, properties: {saved: {type: boolean}}}
    errors:
      - {code: document-has-been-closed, status: 0, retryable: false}
    behavior:
      - if: "input.closed"
        then:
          - title: Document has been closed
            source: src/vs/workbench/api/common/extHostDocumentData.ts:111-113
            fail: {code: document-has-been-closed, message: "Document has been closed"}
      - call: main-thread-documents.try-save-document
        on: "= 'w' + self.substring(2)"
        input: {uri: "= input.uri"}
        as: r
      - return: "= vars.r.value"
  - component: main-thread-documents
    name: try-save-document
    kind: rpc
    summary: "$trySaveDocument(uri): ITextFileService.save(uri); true when a target URI came back."
    attributes: {shape: MainThreadDocumentsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:300
      - src/vs/workbench/api/browser/mainThreadDocuments.ts:232-235
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {saved: {type: boolean}}}
    behavior:
      - call: text-file-service.save
        input: {resource: "= input.uri", options: {reason: explicit}}
        as: r
      - return: {saved: "= has(vars.r.value.resource) && vars.r.value.resource != ''"}

  # ======================= URI handling =======================
  - component: ext-host-urls
    name: register-uri-handler
    kind: function
    summary: "registerUriHandler(extension, handler): one handler per extension; allocate a handle and $registerUriHandler."
    sources:
      - src/vs/workbench/api/common/extHostUrls.ts:31-47
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string, examples: [vscode.git]}}}
    errors:
      - {code: protocol-handler-already-registered, status: 0, retryable: false}
    behavior:
      - if: "input.extension_id in state.handles"
        then:
          - title: Protocol handler already registered for extension
            source: src/vs/workbench/api/common/extHostUrls.ts:33-35
            fail: {code: protocol-handler-already-registered, message: "= 'Protocol handler already registered for extension ' + input.extension_id"}
      - set: {state.handles: "= state.handles + [input.extension_id]"}
      - call: main-thread-urls.register-uri-handler
        on: "= 'w' + self.substring(2)"
        input: {handle: "= size(state.handles)", extension_id: "= input.extension_id"}
  - component: ext-host-urls
    name: handle-external-uri
    kind: rpc
    summary: "$handleExternalUri(handle, uri): call the extension's handleUri; unknown handles are ignored and handler errors only logged."
    attributes: {shape: ExtHostUrlsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:1950
      - src/vs/workbench/api/common/extHostUrls.ts:49-62
    request: {type: object, properties: {extension_id: {type: string}, uri: {type: string}}}
    behavior:
      - if: "!(input.extension_id in state.handles)"
        then:
          - return: {}
      - call: third-party-extension.handle-uri
        input: {uri: "= input.uri"}
        on_error: continue
  - component: main-thread-urls
    name: register-uri-handler
    kind: rpc
    summary: "$registerUriHandler(handle, extensionId, displayName): register a URL handler with IURLService and IExtensionUrlHandler."
    attributes: {shape: MainThreadUrlsShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:1922
      - src/vs/workbench/api/browser/mainThreadUrls.ts:51-59
    request: {type: object, properties: {handle: {type: integer}, extension_id: {type: string}}}
    behavior:
      - call: extension-url-handler.register-extension-handler
        input: {extension_id: "= input.extension_id", handle: "= input.handle"}
  - component: extension-url-handler
    name: handle-url
    kind: function
    summary: "handleURL(uri, options): only extension-id authorities; uninstalled extensions go to the install command; untrusted ones need confirmation (optionally remembered); a registered handler gets the URI, otherwise it is buffered and onUri:<id> activated (Immediate)."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:154-252
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["vscode://vscode.git/clone?url=https%3A%2F%2Fexample.com%2Frepo.git"]}, trusted: {type: boolean, default: false}}}
    response: {type: object, properties: {handled: {type: boolean}, buffered: {type: boolean}}}
    behavior:
      - set: {vars.ext_id: "= input.uri.split('/')[2].split('?')[0].lowerAscii()"}
      - if: "!vars.ext_id.matches('^[a-z0-9][a-z0-9-]*[.][a-z0-9][a-z0-9-]*$')"
        then:
          - title: Not an extension id authority
            source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:155-157
            return: {handled: false, buffered: false}
      - set: {vars.initial: "= vars.ext_id in state.handlers"}
      - if: "!vars.initial"
        then:
          - call: extension-service.get-extension
            input: {extension_id: "= vars.ext_id"}
            as: ext
          - if: "!vars.ext.value.found"
            then:
              - title: Not installed; run workbench.extensions.installExtension with a justification
                source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:168-172
                call: command-service.execute-command
                input: {command_id: workbench.extensions.installExtension, args: ["= vars.ext_id"]}
                on_error: continue
              - return: {handled: true, buffered: false}
      - call: user-trusted-extension-id-storage.get
        as: stored
      - set:
          vars.trusted: "= input.trusted || vars.ext_id in vars.stored.value.extensions || vars.ext_id in config['extensions-confirmed-uri-handler-extension-ids']"
      - if: "!vars.trusted"
        then:
          - title: "Allow '<extension>' extension to open this URI?"
            source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:183-210
            call: dialog-service.confirm
            input: {message: "= 'Allow ' + vars.ext_id + ' extension to open this URI?'", checkbox: "Do not ask me again for this extension", primary_button: "Open"}
            as: confirm
          - choice: decision
            default: "= vars.confirm.value.confirmed ? 'open' : 'cancel'"
            options:
              open: []
              open_and_remember:
                - title: Checkbox checked; remember the extension
                  source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:207-209
                  call: user-trusted-extension-id-storage.add
                  input: {extension_id: "= vars.ext_id"}
              cancel:
                - return: {handled: true, buffered: false}
      - if: "vars.ext_id in state.handlers"
        then:
          - if: "!vars.initial"
            then:
              - call: extension-url-handler.handle-url-by-extension
                input: {extension_id: "= vars.ext_id", uri: "= input.uri"}
              - return: {handled: true, buffered: false}
          - title: The registered URL handler instance handles it
            source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:226-232
            return: {handled: false, buffered: false}
      - title: Buffer the URI for the extension and activate onUri:<id> (Immediate)
        source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:236-251
        set:
          state.uri_buffer: "= merge(state.uri_buffer, {vars.ext_id: (vars.ext_id in state.uri_buffer ? state.uri_buffer[vars.ext_id] : []) + [{'uri': input.uri, 'timestamp': now}]})"
      - call: extension-service.activate-by-event
        input: {activation_event: "= 'onUri:' + vars.ext_id", activation_kind: immediate}
      - return: {handled: true, buffered: true}
  - component: extension-url-handler
    name: register-extension-handler
    kind: function
    summary: "registerExtensionHandler: keep the handler and deliver every URI buffered for that extension."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:254-264
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string}, handle: {type: integer}}}
    behavior:
      - set: {state.handlers: "= merge(state.handlers, {input.extension_id: input.handle})"}
      - foreach: "= input.extension_id in state.uri_buffer ? state.uri_buffer[input.extension_id] : []"
        as: buffered
        steps:
          - call: extension-url-handler.handle-url-by-extension
            input: {extension_id: "= input.extension_id", uri: "= vars.buffered.uri"}
      - set: {state.uri_buffer: "= omit(state.uri_buffer, input.extension_id)"}
  - component: extension-url-handler
    name: handle-url-by-extension
    kind: function
    summary: "handleURLByExtension: the MainThreadUrls ExtensionUrlHandler forwards to the host ($handleExternalUri)."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:270-272
      - src/vs/workbench/api/browser/mainThreadUrls.ts:23-30
    request: {type: object, properties: {extension_id: {type: string}, uri: {type: string}}}
    behavior:
      - call: ext-host-urls.handle-external-uri
        on: "= 'eh' + self.substring(1)"
        input: {extension_id: "= input.extension_id", uri: "= input.uri"}
  - component: user-trusted-extension-id-storage
    name: get
    kind: function
    summary: "extensions getter: the stored JSON list (profile scope)."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:43-51
    response: {type: object, properties: {extensions: {type: array, items: {type: string}}}}
    behavior:
      - return: {extensions: "= state.extensions"}
  - component: user-trusted-extension-id-storage
