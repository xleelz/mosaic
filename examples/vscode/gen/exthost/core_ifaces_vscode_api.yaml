# Hand-modeled vscode API functions. Requests come from vscode.d.ts (gen.py sets them from
# api_params.json, plus the implicit calling extension `extension_id`); sources are set by gen.py.
interfaces:
  - component: vscode-api
    name: commands-execute-command
    kind: function
    summary: "vscode.commands.executeCommand(command, ...rest) -> ExtHostCommands.executeCommand."
    response: {type: object, properties: {value: {}}}
    errors:
      - {code: command-not-found, status: 0, retryable: false}
    behavior:
      - call: ext-host-commands.execute-command
        input: {command_id: "= input.command", args: "= has(input.rest) ? input.rest : []", retry: true}
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: commands-register-command
    kind: function
    summary: "vscode.commands.registerCommand(command, callback, thisArg) -> ExtHostCommands.registerCommand(global=true)."
    response: ExthostApiResult
    errors:
      - {code: invalid-id, status: 0, retryable: false}
      - {code: command-already-exists, status: 0, retryable: false}
    behavior:
      - call: ext-host-commands.register-command
        input: {command_id: "= input.command", global: true}
      - return: {disposable_id: "= 'command:' + input.command"}
  - component: vscode-api
    name: commands-register-text-editor-command
    kind: function
    summary: "vscode.commands.registerTextEditorCommand(command, callback, thisArg) -> ExtHostCommands.registerCommand(global=true) with a wrapper that runs the callback on the active text editor (or warns when there is none)."
    response: ExthostApiResult
    errors:
      - {code: invalid-id, status: 0, retryable: false}
      - {code: command-already-exists, status: 0, retryable: false}
    behavior:
      - call: ext-host-commands.register-command
        input: {command_id: "= input.command", global: true}
      - return: {disposable_id: "= 'command:' + input.command"}
  - component: vscode-api
    name: commands-get-commands
    kind: function
    summary: "vscode.commands.getCommands(filterInternal) -> ExtHostCommands.getCommands -> $getCommands."
    response: {type: object, properties: {commands: {type: array, items: {type: string}}}}
    behavior:
      - call: ext-host-commands.get-commands
        input: {filter_internal: "= has(input.filter_internal) && input.filter_internal"}
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: window-show-information-message
    kind: function
    summary: "vscode.window.showInformationMessage(message, options?, ...items) -> ExtHostMessageService.showMessage(Severity.Info)."
    response: &showMessageRes {type: object, properties: {selected: {type: string}}}
    behavior:
      - call: ext-host-message-service.show-message
        input: &showMessageIn
          severity: info
          message: "= input.message"
          items: "= has(input.items) ? input.items : []"
          modal: "= has(input.options) && has(input.options.modal) && input.options.modal"
          extension_id: "= input.extension_id"
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: window-show-warning-message
    kind: function
    summary: "vscode.window.showWarningMessage(message, options?, ...items) -> ExtHostMessageService.showMessage(Severity.Warning)."
    response: *showMessageRes
    behavior:
      - call: ext-host-message-service.show-message
        input:
          severity: warning
          message: "= input.message"
          items: "= has(input.items) ? input.items : []"
          modal: "= has(input.options) && has(input.options.modal) && input.options.modal"
          extension_id: "= input.extension_id"
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: window-show-error-message
    kind: function
    summary: "vscode.window.showErrorMessage(message, options?, ...items) -> ExtHostMessageService.showMessage(Severity.Error)."
    response: *showMessageRes
    behavior:
      - call: ext-host-message-service.show-message
        input:
          severity: error
          message: "= input.message"
          items: "= has(input.items) ? input.items : []"
          modal: "= has(input.options) && has(input.options.modal) && input.options.modal"
          extension_id: "= input.extension_id"
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: workspace-apply-edit
    kind: function
    summary: "vscode.workspace.applyEdit(edit, metadata?) -> ExtHostBulkEdits.applyWorkspaceEdit; resolves false when the edit cannot be applied."
    response: {type: object, properties: {applied: {type: boolean}}}
    behavior:
      - call: ext-host-bulk-edits.apply-workspace-edit
        input:
          edits: "= has(input.edit.edits) ? input.edit.edits : []"
          is_refactoring: "= has(input.metadata) && has(input.metadata.is_refactoring) && input.metadata.is_refactoring"
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: workspace-save
    kind: function
    summary: "vscode.workspace.save(uri) -> ExtHostWorkspace.save -> $save(uri, {saveAs: false})."
    response: {type: object, properties: {uri: {type: string}}}
    behavior:
      - call: ext-host-workspace.save
        input: {uri: "= input.uri"}
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: text-document-save
    kind: function
    summary: "TextDocument.save() (vscode.d.ts gives it no parameters; uri names the document object, closed whether it was disposed) -> ExtHostDocumentData._save -> $trySaveDocument."
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["file:///work/app/src/main.ts"]}, closed: {type: boolean, default: false}, extension_id: {type: string, examples: [vscode.git]}}}
    response: {type: object, properties: {saved: {type: boolean}}}
    behavior:
      - call: ext-host-document-data.save
        input: {uri: "= input.uri", closed: "= has(input.closed) && input.closed"}
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: window-register-uri-handler
    kind: function
    summary: "vscode.window.registerUriHandler(handler) -> ExtHostUrls.registerUriHandler(extension, handler)."
    response: ExthostApiResult
    errors:
      - {code: protocol-handler-already-registered, status: 0, retryable: false}
    behavior:
      - call: ext-host-urls.register-uri-handler
        input: {extension_id: "= input.extension_id"}
      - return: {disposable_id: "= 'uri-handler:' + input.extension_id"}
  - component: vscode-api
    name: extensions-get-extension
    kind: function
    summary: "vscode.extensions.getExtension(extensionId): looks the id up in the host's registry mirror (all extensions known to the window)."
    response: {type: object, properties: {found: {type: boolean}, is_active: {type: boolean}}}
    behavior:
      - call: ext-host-extension-service.get-extension-description
        input: {extension_id: "= input.extension_id"}
        as: r
      - return: "= vars.r.value"
  - component: vscode-api
    name: languages-match
    kind: function
    summary: "vscode.languages.match(selector, document): score a document against a selector (score > 0 when the language matches)."
    response: {type: object, properties: {score: {type: integer}}}
    behavior:
      - return: {score: "= has(input.document) && has(input.document.language_id) && input.document.language_id == input.selector ? 10 : 0"}
