interfaces:
  - component: ext-host-debug-service
    name: start-da-session
    kind: rpc
    attributes: {shape: ExtHostDebugServiceShape}
    summary: "$startDASession(handle, session): resolve the debug adapter descriptor from the extension's factory for the session type, create the adapter, keep it under the handle and start it."
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:3432
      - src/vs/workbench/api/common/extHostDebugService.ts:607-704
    request: {type: object, properties: {handle: {type: integer, examples: [1]}, session_id: {type: string, examples: [session-1]}, type: {type: string, examples: [node]}}}
    response: {type: object}
    behavior:
      - title: this._debugAdapters.set(debugAdapterHandle, debugAdapter); debugAdapter.startSession()
        source: src/vs/workbench/api/common/extHostDebugService.ts:625
        set:
          state.adapters: "= merge(state.adapters, {string(input.handle): {'session_id': has(input.session_id) ? input.session_id : '', 'type': has(input.type) ? input.type : ''}})"
      - return: {}
  - component: ext-host-debug-service
    name: send-da-message
    kind: rpc
    attributes: {shape: ExtHostDebugServiceShape}
    summary: "$sendDAMessage(handle, message): convert paths, notify the tracker and forward the message to the adapter kept under the handle (none: dropped). The reply returns through $acceptDAMessage, modeled as this call's result."
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:3434
      - src/vs/workbench/api/common/extHostDebugService.ts:707-719
    request: {type: object, properties: {arguments: {type: object}, command: {type: string, examples: [initialize]}, handle: {type: integer, examples: [1]}}}
    errors:
      - {code: debug-adapter-error, status: 0, retryable: false}
    behavior:
      - if: "!(string(input.handle) in state.adapters)"
        then:
          - title: No adapter for the handle; da?.sendMessage does nothing
            source: src/vs/workbench/api/common/extHostDebugService.ts:717-718
            return: {}
      - call: debug-adapter.handle-request
        input: {command: "= input.command", arguments: "= has(input.arguments) ? input.arguments : {}"}
        as: r
      - return: "= vars.r.value"
  - component: ext-host-debug-service
    name: stop-da-session
    kind: rpc
    attributes: {shape: ExtHostDebugServiceShape}
    summary: "$stopDASession(handle): drop the tracker and the adapter for the handle and stop the adapter session."
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:3433
      - src/vs/workbench/api/common/extHostDebugService.ts:721-736
    request: {type: object, properties: {handle: {type: integer, examples: [1]}}}
    response: {type: object}
    behavior:
      - set:
          state.adapters: "= state.adapters.transformMap(k, v, k != string(input.handle), v)"
      - return: {}
