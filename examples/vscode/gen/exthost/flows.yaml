flows:
  - id: exthost-start
    name: Extension host start at window startup
    description: "NativeExtensionService schedules _initialize at LifecyclePhase.Ready; the local process host is spawned, handshakes, receives the registry snapshot ($startExtensionHost) and activates '*' then onStartupFinished extensions; the installed-extensions barrier opens and waiting activation requests run."
    tags: [writes]
    sources:
      - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:466-487
      - src/vs/workbench/api/node/extensionHostProcess.ts:397-475
    entry: {caller: workbench, interface: extension-service.initialize}
  - id: exthost-activate-by-event
    name: Activate extensions by event (seam extension-service.activate-by-event)
    tags: [writes]
    sources: [src/vs/workbench/services/extensions/common/abstractExtensionService.ts:993-1053]
    entry: {caller: workbench, interface: extension-service.activate-by-event, input: {activation_event: "onLanguage:typescript", activation_kind: normal}}
  - id: exthost-get-extension
    name: Read an extension's registration and activation status
    sources: [src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1082-1086]
    entry: {caller: workbench, interface: extension-service.get-extension, input: {extension_id: vscode.typescript-language-features}}
  - id: exthost-crash
    name: Extension host crash and automatic restart
    tags: [writes]
    sources: [src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:150-231]
    entry: {caller: extension-host, interface: native-local-process-extension-host.on-exit, input: {code: 1, signal: ""}}
  - id: exthost-restart
    name: Developer Restart Extension Host command
    tags: [writes]
    sources: [src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:750-771]
    entry: {caller: user, interface: restart-extension-host-action.cmd-workbench-action-restart-extension-host}
  - id: exthost-unresponsive
    name: Extension host unresponsive detection
    tags: [writes]
    sources: [src/vs/workbench/services/extensions/common/rpcProtocol.ts:182-228]
    entry: {caller: extension-host-manager, interface: rpc-protocol.send-request}
  - id: exthost-delta-extensions
    name: Extensions added or removed at runtime
    tags: [writes]
    sources: [src/vs/workbench/services/extensions/common/abstractExtensionService.ts:244-343]
    entry: {caller: remote, interface: extension-service.handle-delta-extensions}
  - id: exthost-api-call
    name: An extension calls a vscode API function
    description: "Extension code calls one vscode.* function; the scenario's input picks which. Modeled functions forward ExtHost* -> MainThread* -> the owning area's service."
    tags: [writes]
    sources: [src/vs/workbench/api/common/extHost.api.impl.ts:291]
    entry: {caller: third-party-extension, interface: third-party-extension.call-api, input: {api: commands-get-commands, args: {extension_id: vscode.git}}}
  - id: exthost-url-handle
    name: Open a vscode://<extension-id>/ URI
    tags: [writes]
    sources: [src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:154-252]
    entry: {caller: os-shell, interface: extension-url-handler.handle-url, input: {uri: "vscode://vscode.git/clone?url=https%3A%2F%2Fexample.com%2Frepo.git", trusted: false}}
  - id: exthost-manage-authorized-uris
    name: Manage authorized extension URIs command
    sources: [src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:391-426]
    entry: {caller: user, interface: manage-authorized-extension-uris-action.cmd-workbench-extensions-action-manage-authorized-extension-uris}
  - id: exthost-measure-latency
    name: Measure extension host latency command
    sources: [src/vs/workbench/services/extensions/common/extensionHostManager.ts:626-661]
    entry: {caller: user, interface: measure-ext-host-latency-action.cmd-editor-action-measure-ext-host-latency}
  - id: exthost-rpc-customers
    name: RPC customers created for each extension host
    description: "ExtensionHostManager._createExtensionHostCustomers instantiates every @extHostNamedCustomer and @extHostCustomer class and registers it on the RPC protocol; most of their methods forward to a workbench service (listed in skips/exthost.json)."
    sources: [src/vs/workbench/services/extensions/common/extensionHostManager.ts:249-318]
  - id: exthost-runtime-services
    name: Services of the extension host and the extension bridge
    description: "The ExtHost* singletons registered in extHost.common/node.services.ts and the renderer-side services of the extension bridge."
    sources: [src/vs/workbench/api/common/extHost.common.services.ts:42-74]

scenarios:
  # ---------------- activate by event ----------------
  - id: exthost-activate-by-event-happy
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    expect:
      - "result.ok && result.value.activated == ['vscode.typescript-language-features']"
      - "'vscode.typescript-language-features' in state['extension-registry@w1'].activated"
      - "state['extensions-activator@eh1'].operations['vscode.typescript-language-features'] == 'activated'"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] == 1"
      - "'onLanguage:typescript' in state['extension-service@w1'].requested_events"
  - id: exthost-activate-by-event-no-interest
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    input: {activation_event: "onLanguage:python"}
    expect:
      - "result.ok && size(result.value.activated) == 0"
      - "calls['extension-host-manager.activate-by-event'] == 0"
      - "'onLanguage:python' in state['extension-service@w1'].requested_events"
  - id: exthost-activate-by-event-cached
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    state: {"extension-host-manager@w1": {cached_events: ["onLanguage:typescript"]}}
    expect:
      - "result.ok && result.value.cached"
      - "calls['ext-host-extension-service.activate-by-event'] == 0"
      - "size(state['extension-registry@w1'].activated) == 0"
  - id: exthost-activate-by-event-before-ready
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    state: {"extension-service@w1": {ready: false}}
    expect:
      - "result.ok && result.value.deferred"
      - "calls['extension-host-manager.activate-by-event'] == 0"
      - "state['extension-service@w1'].requested_events == ['onLanguage:typescript']"
  - id: exthost-activate-by-event-immediate-before-ready
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    state: {"extension-service@w1": {ready: false}}
    input: {activation_kind: immediate}
    expect:
      - "result.ok && !result.value.deferred"
      - "'vscode.typescript-language-features' in state['extension-registry@w1'].activated"
  - id: exthost-activate-by-event-activation-throws
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    choices: {third-party-extension.activate.outcome: throws}
    expect:
      - "result.ok && size(result.value.activated) == 0"
      - "state['extensions-activator@eh1'].operations['vscode.typescript-language-features'] == 'failed'"
      - "'vscode.typescript-language-features' in state['extension-service@w1'].activation_errors"
      - "calls['main-thread-extension-service.on-extension-activation-error'] == 1 && calls['notification-service.notify'] == 0"
  - id: exthost-activate-by-event-unknown-dependency
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    input: {activation_event: "onLanguage:python"}
    state:
      "ext-host-extension-service@eh1": {registry: {acme.py: {identifier: acme.py, activation_events: ["onLanguage:python"], main: "./out/ext", extension_dependencies: [acme.missing]}}}
      "extension-registry@w1": {extensions: {acme.py: {activation_events: ["onLanguage:python"], main: "./out/ext", enabled: true, extension_dependencies: [acme.missing]}}}
    expect:
      - "result.ok && size(result.value.activated) == 0"
      - "state['extensions-activator@eh1'].operations['acme.py'] == 'failed'"
      - "calls['notification-service.notify'] == 1 && calls['third-party-extension.activate'] == 0"
  - id: exthost-activate-by-event-dependency-first
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    input: {activation_event: "onLanguage:python"}
    state:
      "ext-host-extension-service@eh1": {registry: {acme.lib: {identifier: acme.lib, activation_events: [], main: "./out/lib", extension_dependencies: []}, acme.py: {identifier: acme.py, activation_events: ["onLanguage:python"], main: "./out/ext", extension_dependencies: [acme.lib]}}}
      "extension-registry@w1": {extensions: {acme.lib: {activation_events: [], main: "./out/lib", enabled: true}, acme.py: {activation_events: ["onLanguage:python"], main: "./out/ext", enabled: true, extension_dependencies: [acme.lib]}}}
    expect:
      - "result.ok && result.value.activated == ['acme.py']"
      - "state['extension-registry@w1'].activated == ['acme.lib', 'acme.py']"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'third-party-extension.activate').map(e, e.input.extension_id) == ['acme.lib', 'acme.py']"
  - id: exthost-activate-by-event-dependency-failed
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    input: {activation_event: "onLanguage:python"}
    state:
      "ext-host-extension-service@eh1": {registry: {acme.lib: {identifier: acme.lib, activation_events: [], main: "./out/lib", extension_dependencies: []}, acme.py: {identifier: acme.py, activation_events: ["onLanguage:python"], main: "./out/ext", extension_dependencies: [acme.lib]}}}
      "extension-registry@w1": {extensions: {acme.lib: {activation_events: [], main: "./out/lib", enabled: true}, acme.py: {activation_events: ["onLanguage:python"], main: "./out/ext", enabled: true, extension_dependencies: [acme.lib]}}}
      "extensions-activator@eh1": {operations: {acme.lib: failed}}
    expect:
      - "result.ok && size(result.value.activated) == 0"
      - "state['extensions-activator@eh1'].operations['acme.py'] == 'failed'"
      - "calls['third-party-extension.activate'] == 0 && calls['main-thread-extension-service.on-extension-activation-error'] == 1"
  - id: exthost-activate-by-event-empty-extension
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    input: {activation_event: "onLanguage:python"}
    state:
      "ext-host-extension-service@eh1": {registry: {acme.grammar: {identifier: acme.grammar, activation_events: ["onLanguage:python"], main: "", extension_dependencies: []}}}
      "extension-registry@w1": {extensions: {acme.grammar: {activation_events: ["onLanguage:python"], main: "", enabled: true}}}
    expect:
      - "result.ok && result.value.activated == ['acme.grammar']"
      - "calls['third-party-extension.activate'] == 0"
      - "'acme.grammar' in state['extension-service@w1'].activation_times"
  - id: exthost-activate-by-event-hosts-stopped
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    state: {"extension-service@w1": {host_state: stopped}}
    expect:
      - "result.ok && size(result.value.activated) == 0"
      - "calls['extension-host-manager.activate-by-event'] == 0"
      - "'onLanguage:typescript' in state['extension-service@w1'].requested_events"
  - id: exthost-activate-by-event-host-not-started
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    state: {"extension-host-manager@w1": {has_started: false}}
    expect:
      - "result.ok && size(result.value.activated) == 0"
      - "calls['ext-host-extension-service.activate-by-event'] == 0"
      - "'onLanguage:typescript' in state['extension-host-manager@w1'].cached_events"
  - id: exthost-activate-by-event-event-already-handled-on-host
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    state: {"extensions-activator@eh1": {already_activated_events: ["onLanguage:typescript"]}}
    expect:
      - "result.ok && size(result.value.activated) == 0"
      - "calls['extensions-activator.handle-activation-request'] == 0"
      - "'onLanguage:typescript' in state['extension-host-manager@w1'].resolved_events"
  - id: exthost-activate-by-event-host-dies
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    faults: [{target: ext-host-extension-service.activate-by-event, type: error, code: canceled, message: Canceled}]
    expect:
      - "!result.ok && result.error.code == 'canceled'"
      - "size(state['extension-registry@w1'].activated) == 0"
  - id: exthost-activate-by-event-then-read
    flow: exthost-activate-by-event
    fixtures: [one-window-folder]
    steps:
      - {flow: exthost-activate-by-event, as: act, input: {activation_event: "onLanguage:markdown"}}
      - {flow: exthost-get-extension, as: read, input: {extension_id: vscode.markdown-language-features}}
    expect:
      - "steps.act.result.ok && steps.act.result.value.activated == ['vscode.markdown-language-features']"
      - "steps.read.result.ok && steps.read.result.value.found && steps.read.result.value.activated"
      - "state['extension-registry@w1'].activated == ['vscode.markdown-language-features']"
  - id: exthost-activate-by-event-second-window
    flow: exthost-activate-by-event
    fixtures: [two-windows]
    steps:
      - {flow: exthost-activate-by-event, as: act, on: w2}
    expect:
      - "steps.act.result.ok && steps.act.result.value.activated == ['vscode.typescript-language-features']"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh2'] == 1"
      - "size(state['extension-registry@w1'].activated) == 0 && state['extension-registry@w2'].activated == ['vscode.typescript-language-features']"

  # ---------------- get extension ----------------
  - id: exthost-get-extension-known
    flow: exthost-get-extension
    fixtures: [one-window-folder]
    expect: ["result.ok && result.value.found && !result.value.activated", "result.value.extension.identifier == 'vscode.typescript-language-features'"]
  - id: exthost-get-extension-unknown
    flow: exthost-get-extension
    fixtures: [one-window-folder]
    input: {extension_id: acme.unknown}
    expect: ["result.ok && !result.value.found"]

  # ---------------- start ----------------
  - id: exthost-start-happy
    flow: exthost-start
    fixtures: [one-window-folder]
    state: &notStarted
      "extension-service@w1": {ready: false, host_state: stopped}
      "extension-host-manager@w1": {has_started: false}
      "ext-host-extension-service@eh1": {started: false, ready_to_run: false, eager_activated: false}
    expect:
      - "result.ok && result.value.started && result.value.ready"
      - "state['extension-service@w1'].ready && state['extension-service@w1'].host_state == 'running'"
      - "state['extension-registry@w1'].activated == ['vscode.git']"
      - "state['ext-host-extension-service@eh1'].started && state['ext-host-extension-service@eh1'].eager_activated"
      - "state['extension-service@w1'].web_worker_host == 'lazy' && calls['extension-host-worker.main'] == 0"
      - "calls['main-thread-extension-service.set-performance-marks'] == 1"
  - id: exthost-start-replays-waiting-requests
    flow: exthost-start
    fixtures: [one-window-folder]
    state:
      "extension-service@w1": {ready: false, host_state: stopped, requested_events: ["onLanguage:typescript"]}
      "extension-host-manager@w1": {has_started: false}
      "ext-host-extension-service@eh1": {started: false, ready_to_run: false, eager_activated: false}
    expect:
      - "result.ok"
      - "'vscode.typescript-language-features' in state['extension-registry@w1'].activated && 'vscode.git' in state['extension-registry@w1'].activated"
  - id: exthost-start-handshake-timeout
    flow: exthost-start
    fixtures: [one-window-folder]
    state: *notStarted
    faults: [{target: extension-host.start-extension-host-process, type: timeout}]
    expect:
      - "result.ok && !result.value.started"
      - "state['extension-service@w1'].host_state == 'failed' && !state['extension-host-manager@w1'].has_started"
      - "size(state['extension-registry@w1'].activated) == 0 && calls['ext-host-extension-service.start-extension-host'] == 0"
      - "duration_ms >= 60000"
  - id: exthost-start-web-worker-enabled
    flow: exthost-start
    fixtures: [one-window-folder]
    state: *notStarted
    config: {extensions-web-worker: true}
    expect: ["result.ok", "calls['extension-host-worker.main'] == 1 && state['extension-service@w1'].web_worker_host == 'started'"]
  - id: exthost-start-web-worker-disabled
    flow: exthost-start
    fixtures: [one-window-folder]
    state: *notStarted
    config: {extensions-web-worker: false}
    expect: ["result.ok", "calls['extension-host-worker.main'] == 0 && state['extension-service@w1'].web_worker_host == 'disabled'"]
  - id: exthost-start-startup-finished-deferred
    flow: exthost-start
    fixtures: [one-window-folder]
    state:
      "extension-service@w1": {ready: false, host_state: stopped}
      "extension-host-manager@w1": {has_started: false}
      "ext-host-extension-service@eh1": {started: false, ready_to_run: false, eager_activated: false}
      "extension-registry@w1": {extensions: {acme.later: {activation_events: [onStartupFinished], main: "./out/ext", enabled: true}}}
    config: {extensions-experimental-deferred-startup-finished-activation: true}
    expect:
      - "result.ok"
      - "'acme.later' in state['extension-registry@w1'].activated"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'third-party-extension.activate').map(e, e.input.extension_id) == ['vscode.git', 'acme.later']"
  - id: exthost-start-already-started
    flow: exthost-start
    fixtures: [one-window-folder]
    steps:
      - {interface: ext-host-extension-service.start-extension-host, caller: extension-host-manager, on: eh1, as: again}
    expect:
      - "!steps.again.result.ok && steps.again.result.error.code == 'extension-host-is-already-started'"
      - "state['ext-host-extension-service@eh1'].started"
  - id: exthost-start-then-read
    flow: exthost-start
    fixtures: [one-window-folder]
    state: *notStarted
    steps:
      - {flow: exthost-start, as: start}
      - {flow: exthost-get-extension, as: read, input: {extension_id: vscode.git}}
    expect: ["steps.start.result.ok", "steps.read.result.value.found && steps.read.result.value.activated", "state['extension-registry@w1'].activated == ['vscode.git']"]

  # ---------------- crash ----------------
  - id: exthost-crash-auto-restart
    flow: exthost-crash
    fixtures: [one-window-folder]
    state:
      "extension-service@w1": {requested_events: ["onLanguage:typescript", "onLanguage:python"]}
      "extension-registry@w1": {activated: [vscode.typescript-language-features]}
      "extensions-activator@eh1": {operations: {vscode.typescript-language-features: activated}, already_activated_events: ["onLanguage:typescript"]}
    expect:
      - "result.ok && result.value.restarted && result.value.reason == 'auto-restart'"
      - "calls['notification-service.status'] == 1 && calls['notification-service.prompt'] == 0"
      - "size(state['extension-host-crash-tracker@w1'].recent_crashes) == 1 && state['extension-service@w1'].restarts == 1"
      - "state['extension-service@w1'].host_state == 'running'"
      - "'vscode.typescript-language-features' in state['extension-registry@w1'].activated && 'vscode.git' in state['extension-registry@w1'].activated"
  - id: exthost-crash-third-within-five-minutes
    flow: exthost-crash
    fixtures: [one-window-folder]
    state: {"extension-host-crash-tracker@w1": {recent_crashes: [1793318300000, 1793318350000]}}
    choices: {extension-service.on-extension-host-crashed.user_action: dismiss}
    expect:
      - "result.ok && !result.value.restarted && result.value.reason == 'prompt-shown'"
      - "calls['notification-service.prompt'] == 1 && calls['extension-service.start-extension-hosts'] == 0"
      - "state['extension-service@w1'].host_state == 'stopped' && size(state['extension-host-crash-tracker@w1'].recent_crashes) == 3"
  - id: exthost-crash-old-crashes-forgotten
    flow: exthost-crash
    fixtures: [one-window-folder]
    state: {"extension-host-crash-tracker@w1": {recent_crashes: [1793317000000, 1793317100000]}}
    expect:
      - "result.ok && result.value.restarted"
      - "size(state['extension-host-crash-tracker@w1'].recent_crashes) == 1"
  - id: exthost-crash-prompt-restart
    flow: exthost-crash
    fixtures: [one-window-folder]
    state: {"extension-host-crash-tracker@w1": {recent_crashes: [1793318300000, 1793318350000]}}
    choices: {extension-service.on-extension-host-crashed.user_action: restart}
    expect:
      - "result.ok && result.value.restarted && result.value.reason == 'user-restart'"
      - "state['extension-service@w1'].host_state == 'running' && state['extension-service@w1'].restarts == 1"
  - id: exthost-crash-prompt-bisect
    flow: exthost-crash
    fixtures: [one-window-folder]
    state: {"extension-host-crash-tracker@w1": {recent_crashes: [1793318300000, 1793318350000]}}
    choices: {extension-service.on-extension-host-crashed.user_action: bisect}
    expect:
      - "result.ok && result.value.reason == 'bisect'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == 'extension.bisect.start')"
  - id: exthost-crash-version-mismatch
    flow: exthost-crash
    fixtures: [one-window-folder]
    input: {code: 55}
    expect:
      - "result.ok && !result.value.restarted && result.value.reason == 'version-mismatch'"
      - "calls['extension-host-crash-tracker.register-crash'] == 0 && calls['notification-service.prompt'] == 1"
      - "state['extension-service@w1'].host_state == 'stopped'"
  - id: exthost-crash-expected-exit
    flow: exthost-crash
    fixtures: [one-window-folder]
    state: {"native-local-process-extension-host@w1": {terminating: true}}
    expect:
      - "result.ok && result.value.expected"
      - "calls['extension-service.on-extension-host-crash-or-exit'] == 0 && state['extension-service@w1'].host_state == 'running'"
  - id: exthost-crash-dev-host-exit-closes-window
    flow: exthost-crash
    fixtures: [one-window-folder]
    state: {"extension-service@w1": {is_extension_dev_host: true}}
    expect:
      - "result.ok && result.value.reason == 'dev-host-exit'"
      - "calls['native-host-service.close-window'] == 1 && calls['extension-host-crash-tracker.register-crash'] == 0"
      - "state['extension-service@w1'].host_state == 'stopped'"
  - id: exthost-crash-restart-fails
    flow: exthost-crash
    fixtures: [one-window-folder]
    faults: [{target: extension-host.start-extension-host-process, type: timeout}]
    expect:
      - "result.ok && result.value.restarted"
      - "state['extension-service@w1'].host_state == 'failed' && !state['extension-host-manager@w1'].has_started"
  - id: exthost-crash-then-activate
    flow: exthost-crash
    fixtures: [one-window-folder]
    steps:
      - {flow: exthost-crash, as: crash}
      - {flow: exthost-activate-by-event, as: act, input: {activation_event: "onLanguage:markdown"}}
    expect:
      - "steps.crash.result.value.restarted"
      - "steps.act.result.value.activated == ['vscode.markdown-language-features']"
      - "'vscode.markdown-language-features' in state['extension-registry@w1'].activated"

  # ---------------- restart command ----------------
  - id: exthost-restart-no-veto
    flow: exthost-restart
    fixtures: [one-window-folder]
    state:
      "extension-registry@w1": {activated: [vscode.git]}
      "main-thread-commands@w1": {registrations: [myext.sayHello]}
    expect:
      - "result.ok && result.value.restarted"
      - "state['extension-service@w1'].restarts == 1 && state['extension-service@w1'].host_state == 'running'"
