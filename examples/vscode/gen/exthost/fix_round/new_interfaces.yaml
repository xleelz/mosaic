- component: ext-host-save-participant
  name: participate
  kind: function
  summary: 'ExtHostSaveParticipant.participate: $participateInSave in the extension host, rejected after 1750 ms (''Aborted onWillSaveTextDocument-event after 1750ms'') or when a listener failed. The caller logs the rejection and the save goes on.'
  sources:
  - src/vs/workbench/api/browser/mainThreadSaveParticipant.ts:25-49
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      reason:
        type: string
        default: explicit
      content:
        type: string
  response:
    type: object
    properties:
      participated:
        type: boolean
  errors:
  - code: timeout
    status: 0
    retryable: false
  - code: listener-failed
    status: 0
    retryable: false
  behavior:
  - call: ext-host-document-save-participant.participate-in-save
    'on': = 'eh' + self.substring(1)
    input:
      resource: = input.resource
      reason: = input.reason
    timeout_ms: 1750
    as: r
    on_error:
    - if: error.code == 'timeout'
      then:
      - title: setTimeout(reject 'Aborted onWillSaveTextDocument-event after 1750ms', 1750)
        source: src/vs/workbench/api/browser/mainThreadSaveParticipant.ts:35-38
        fail:
          code: timeout
          message: Aborted onWillSaveTextDocument-event after 1750ms
    - fail: = error
  - if: '!vars.r.value.results.all(s, s)'
    then:
    - title: not every listener succeeded
      source: src/vs/workbench/api/browser/mainThreadSaveParticipant.ts:40-42
      fail:
        code: listener-failed
        message: listener failed
  - return:
      participated: true
- component: ext-host-document-save-participant
  name: participate-in-save
  kind: rpc
  attributes:
    shape: ExtHostDocumentSaveParticipantShape
  summary: '$participateInSave(resource, reason): deliver onWillSaveTextDocument to each listener in order, stopping after 1500 ms; listeners with more than 3 errors are skipped (false); a listener that throws or exceeds 1500 ms counts an error.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:2515
  - src/vs/workbench/api/common/extHostDocumentSaveParticipant.ts:51-104
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      reason:
        type: string
        default: explicit
  response:
    type: object
    properties:
      results:
        type: array
        items:
          type: boolean
  behavior:
  - set:
      vars.results: []
      vars.start: = now
  - foreach: = state.listeners
    as: ext
    steps:
    - if: now - vars.start >= 1500
      then:
      - title: timeout - no more listeners
        source: src/vs/workbench/api/common/extHostDocumentSaveParticipant.ts:59-62
        break: true
    - if: vars.ext in state.bad_listeners && state.bad_listeners[vars.ext] > 3
      then:
      - title: bad listener - ignore
        source: src/vs/workbench/api/common/extHostDocumentSaveParticipant.ts:76-80
        set:
          vars.results: = vars.results + [false]
      - continue: true
    - call: third-party-extension.on-will-save-text-document
      input:
        extension_id: = vars.ext
        resource: = input.resource
        reason: = input.reason
      timeout_ms: 1500
      as: d
      on_error: continue
    - if: '!vars.d.ok'
      then:
      - title: the listener threw or timed out; blame it
        source: src/vs/workbench/api/common/extHostDocumentSaveParticipant.ts:86-100
        set:
          state.bad_listeners: '= merge(state.bad_listeners, {vars.ext: (vars.ext in state.bad_listeners ? state.bad_listeners[vars.ext] : 0) + 1})'
          vars.results: = vars.results + [false]
      else:
      - set:
          vars.results: = vars.results + [true]
  - return:
      results: = vars.results
- component: third-party-extension
  name: on-will-save-text-document
  kind: function
  summary: An extension's workspace.onWillSaveTextDocument listener (may call event.waitUntil). Its outcome is the extension's own code, so scenarios choose it.
  sources:
  - src/vs/workbench/api/common/extHostDocumentSaveParticipant.ts:107-150
  request:
    type: object
    properties:
      extension_id:
        type: string
      resource:
        type: string
      reason:
        type: string
  behavior:
  - choice: outcome
    default: ok
    options:
      ok:
      - return: {}
      throws:
      - fail:
          code: listener-error
          message: onWillSaveTextDocument listener threw
