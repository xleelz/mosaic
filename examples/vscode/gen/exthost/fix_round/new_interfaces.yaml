- component: ext-host-commands
  name: run-api-command
  kind: function
  summary: 'The handler registerApiCommand installs: validate each argument with its ApiCommandArgument (throwing ''Invalid argument'' in the host, before any RPC), convert it, then executeCommand(internalId, ...internalArgs).'
  sources:
  - src/vs/workbench/api/common/extHostCommands.ts:117-131
  - src/vs/workbench/api/common/extHostCommands.ts:446-451
  - src/vs/workbench/api/common/extHostApiCommands.ts:163-170
  - src/vs/workbench/api/common/extHostApiCommands.ts:530-538
  - src/vs/workbench/api/common/extHostApiCommands.ts:430-441
  request:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
        - vscode.executeWorkspaceSymbolProvider
      args:
        type: array
        default: []
  response:
    type: object
    properties:
      value: {}
  errors:
  - code: invalid-argument
    status: 0
    retryable: false
  behavior:
  - set:
      vars.api: = state.api_commands[input.command_id]
  - foreach: = vars.api.args
    as: kind
    index: i
    steps:
    - set:
        vars.arg: '= vars.i < size(input.args) ? input.args[vars.i] : null'
    - if: '!(vars.kind == ''any'' || vars.kind == ''optional'' || (vars.kind == ''optional-string'' && (type(vars.arg) == null_type || type(vars.arg) == string)) || (vars.kind == ''uri-or-http'' && type(vars.arg) == string && vars.arg.matches(''^[a-zA-Z][a-zA-Z0-9+.-]*:'')) || (vars.kind == ''string'' && type(vars.arg) == string) || (vars.kind == ''number'' && (type(vars.arg) == int || type(vars.arg) == double)) || (vars.kind == ''uri''
        && type(vars.arg) == string && vars.arg.matches(''^[a-zA-Z][a-zA-Z0-9+.-]*:'')) || (vars.kind == ''position'' && type(vars.arg) == map && ''line'' in vars.arg && ''character'' in vars.arg))'
      then:
      - title: The argument fails its validator; ApiCommand handler throws 'Invalid argument' in the extension host
        source: src/vs/workbench/api/common/extHostCommands.ts:122-124
        fail:
          code: invalid-argument
          message: = "Invalid argument '" + vars.kind + "' when running '" + input.command_id + "'"
  - title: executeCommand(apiCommand.internalId, ...internalArgs); the internal command is registered in the window
    source: src/vs/workbench/api/common/extHostCommands.ts:127-128
    call: ext-host-commands.execute-command
    input:
      command_id: = vars.api.internal_id
      args: '= vars.api.args.transformList(i, k, i < size(input.args) ? input.args[i] : null)'
    as: internal
  - return:
      value: = vars.internal.value.value
