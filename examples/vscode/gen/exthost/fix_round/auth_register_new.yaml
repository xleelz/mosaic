  response: ExthostApiResult
  behavior:
  - title: keep the provider object under its id and register it with the window ($registerAuthenticationProvider)
    source: src/vs/workbench/api/common/extHostAuthentication.ts:132-160
    set:
      state.providers: '= merge(state.providers, {input.id: {''extension_id'': input.extension_id, ''kind'': has(input.provider) && ''kind'' in input.provider ? input.provider.kind : ''''}})'
