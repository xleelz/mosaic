- id: exthost-unresponsive-greedy-extension-prompt
  flow: exthost-unresponsive
  name: The auto-profiler blames a greedy extension once with a SILENT warning prompt and offers no restart
  fixtures:
  - one-window-folder
  - exthost-seed
  faults:
  - target: ext-host-rpc-protocol.receive-request
    type: latency
    latency_ms: 6000
  choices:
    extensions-auto-profiler.stop-and-analyse.profile: greedy
  expect:
  - result.ok && !result.value.responsive
  - calls['extensions-auto-profiler.on-did-change-responsive-change'] == 2
  - calls['notification-service.prompt'] == 1 && calls['extension-service.start-extension-hosts'] == 0
  - state['extensions-auto-profiler@w1'].blamed == ['vscode.typescript-language-features']
