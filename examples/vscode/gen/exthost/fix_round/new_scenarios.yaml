- id: exthost-api-command-invalid-argument
  flow: exthost-api-call
  name: vscode.executeWorkspaceSymbolProvider with no query or a non-string query throws in the host, before any RPC
  fixtures:
  - one-window-folder
  - exthost-seed
  steps:
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    'on': eh1
    as: none
    input:
      command: vscode.executeWorkspaceSymbolProvider
      extension_id: vscode.git
      rest: []
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    'on': eh1
    as: bool
    input:
      command: vscode.executeWorkspaceSymbolProvider
      extension_id: vscode.git
      rest:
      - true
  expect:
  - '!steps.none.result.ok && steps.none.result.error.code == ''invalid-argument'''
  - '!steps.bool.result.ok && steps.bool.result.error.code == ''invalid-argument'''
  - calls['ext-host-commands.run-api-command'] == 2
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''main-thread-commands.execute-command'')'
- id: exthost-api-command-set-context
  flow: exthost-api-call
  name: commands.executeCommand('setContext', key, value) validates in the host and runs _setContext in the window
  fixtures:
  - one-window-folder
  - exthost-seed
  input:
    api: commands-execute-command
    args:
      command: setContext
      extension_id: vscode.git
      rest:
      - myExtension.ready
      - true
  expect:
  - result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'main-thread-commands.execute-command' && e.input.command_id == '_setContext')
  - state['context-key-service@w1'].values['myExtension.ready'] == true
- id: exthost-editor-tabs-modal-label
  flow: exthost-api-call
  name: A label change for an unknown tab in the modal editor part is ignored; an open in that group rebuilds the tab model
  fixtures:
  - one-window-folder
  - exthost-seed
  steps:
  - interface: main-thread-editor-tabs.create-tabs-model
    caller: extension-host-manager
    'on': w1
    as: init
  - interface: main-thread-editor-tabs.on-did-editors-change
    caller: extension-host-manager
    'on': w1
    as: label
    input:
      group_id: 2
      kind: editor-label
      editor: file:///work/app/README.md
      in_modal_part: true
  - interface: main-thread-editor-tabs.on-did-editors-change
    caller: extension-host-manager
    'on': w1
    as: open
    input:
      group_id: 2
      kind: editor-open
      editor: file:///work/app/README.md
      in_modal_part: true
  - interface: main-thread-editor-tabs.on-did-editors-change
    caller: extension-host-manager
    'on': w1
    as: open1
    input:
      group_id: 1
      kind: editor-open
      editor: file:///work/app/src/main.ts
  expect:
  - steps.init.result.ok && steps.init.result.value.rebuilt
  - steps.label.result.value.operation == 'none'
  - steps.open.result.value.operation == 'rebuild'
  - steps.open1.result.value.operation == 'tab-open'
  - state['main-thread-editor-tabs@w1'].rebuilds == 2
  - state['ext-host-editor-tabs@eh1'].groups['1'] == ['1~file:///work/app/src/main.ts']
  - calls['ext-host-editor-tabs.accept-editor-tab-model'] == 2 && calls['ext-host-editor-tabs.accept-tab-operation'] == 1
- id: exthost-debug-visualization-disposed
  flow: exthost-api-call
  name: A disposed debug visualization provider is not called; $provideDebugVisualizers returns []
  fixtures:
  - one-window-folder
  - exthost-seed
  steps:
  - interface: vscode-api.debug-register-debug-visualization-provider
    caller: third-party-extension
    'on': eh1
    as: reg
    input:
      id: myext.hex
      extension_id: vscode.git
      debug_visualizers:
      - myext.hex
  - interface: main-thread-debug-service.provide-debug-visualizers
    caller: extension-host-manager
    'on': w1
    as: before
    input:
      extension_id: vscode.git
      id: myext.hex
  - interface: ext-host-debug-service.dispose-debug-visualization-provider
    caller: third-party-extension
    'on': eh1
    as: dispose
    input:
      id: myext.hex
      extension_id: vscode.git
  - interface: ext-host-debug-service.provide-debug-visualizers
    caller: extension-host-manager
    'on': eh1
    as: after
    input:
      extension_id: vscode.git
      id: myext.hex
  - interface: vscode-api.debug-register-debug-visualization-provider
    caller: third-party-extension
    'on': eh1
    as: uncontributed
    input:
      id: myext.other
      extension_id: vscode.git
  expect:
  - steps.reg.result.ok
  - size(steps.before.result.value.visualizers) == 1
  - steps.after.result.ok && steps.after.result.value.visualizers == []
  - calls['third-party-extension.provide-debug-visualization'] == 1
  - size(state['main-thread-debug-service@w1'].visualizer_handles) == 0
  - '!steps.uncontributed.result.ok && steps.uncontributed.result.error.code == ''not-contributed'''
- id: exthost-save-participant-budget
  flow: exthost-api-call
  name: onWillSaveTextDocument in the host never answers; the renderer gives up after 1750 ms
  fixtures:
  - one-window-folder
  - exthost-seed
  faults:
  - target: ext-host-document-save-participant.participate-in-save
    type: timeout
  steps:
  - interface: ext-host-save-participant.participate
    caller: extension-host-manager
    'on': w1
    as: p
    input:
      resource: file:///work/app/src/main.ts
      reason: explicit
  expect:
  - '!steps.p.result.ok && steps.p.result.error.code == ''timeout'''
  - trace.exists(e, e.type == 'timeout' && e.interface == 'ext-host-document-save-participant.participate-in-save' && e.t >= 1750 && e.t < 1800)
- id: exthost-save-participant-bad-listener
  flow: exthost-api-call
  name: A throwing onWillSaveTextDocument listener answers false and is blamed; the renderer rejects with 'listener failed'
  fixtures:
  - one-window-folder
  - exthost-seed
  state:
    ext-host-document-save-participant@eh1:
      listeners:
      - vscode.git
      - vscode.markdown-language-features
      bad_listeners:
        vscode.markdown-language-features: 4
  choices:
    third-party-extension.on-will-save-text-document.outcome: throws
  steps:
  - interface: ext-host-save-participant.participate
    caller: extension-host-manager
    'on': w1
    as: p
    input:
      resource: file:///work/app/src/main.ts
  expect:
  - '!steps.p.result.ok && steps.p.result.error.code == ''listener-failed'''
  - calls['third-party-extension.on-will-save-text-document'] == 1
  - state['ext-host-document-save-participant@eh1'].bad_listeners['vscode.git'] == 1
