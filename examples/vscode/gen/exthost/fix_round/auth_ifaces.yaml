- component: main-thread-authentication
  name: get-session
  kind: rpc
  attributes:
    shape: MainThreadAuthenticationShape
  summary: '$getSession(providerId, scopes, extensionId, extensionName, options) -> doGetSession: ask the provider for its sessions (IAuthenticationService.getSessions -> MainThreadAuthenticationProvider.getSessions -> $getSessions); without forceNewSession an existing session is returned; createIfNone/forceNewSession would prompt for login and createSession (not modeled: no session).'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:230
  - src/vs/workbench/api/browser/mainThreadAuthentication.ts:451-482
  - src/vs/workbench/api/browser/mainThreadAuthentication.ts:553
  request:
    type: object
    required:
    - provider_id
    properties:
      provider_id:
        type: string
        examples:
        - github
      scope_list_or_request: {}
      extension_id:
        type: string
      options:
        type: object
  response:
    type: object
    properties:
      session: {}
  behavior:
  - set:
      vars.opts: '= has(input.options) ? input.options : {}'
  - title: authenticationService.getSessions(providerId, scopes, {silent}) -> MainThreadAuthenticationProvider.getSessions -> $getSessions
    source: src/vs/workbench/api/browser/mainThreadAuthentication.ts:85-88
    call: ext-host-authentication.get-sessions
    'on': = 'eh' + self.substring(1)
    input:
      provider_id: = input.provider_id
      scopes: '= !has(input.scope_list_or_request) ? [] : (type(input.scope_list_or_request) == list ? input.scope_list_or_request : (type(input.scope_list_or_request) == map && ''scopes'' in input.scope_list_or_request ? input.scope_list_or_request.scopes : []))'
    as: s
  - if: '!(''force_new_session'' in vars.opts && vars.opts.force_new_session) && size(vars.s.value.sessions) > 0'
    then:
    - title: a valid existing session (access allowed) is returned
      source: src/vs/workbench/api/browser/mainThreadAuthentication.ts:473-482
      return:
        session: = vars.s.value.sessions[0]
  - title: no session; createIfNone/forceNewSession would prompt and createSession (not modeled), otherwise undefined
    source: src/vs/workbench/api/browser/mainThreadAuthentication.ts:484-500
    return:
      session: null
- component: ext-host-authentication
  name: get-sessions
  kind: rpc
  attributes:
    shape: ExtHostAuthenticationShape
  summary: '$getSessions(providerId, scopes, options): call the registered provider''s getSessions; an unknown provider id rejects.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:2655
  - src/vs/workbench/api/common/extHostAuthentication.ts:583-590
  request:
    type: object
    required:
    - provider_id
    properties:
      provider_id:
        type: string
      scopes: {}
  response:
    type: object
    properties:
      sessions:
        type: array
  errors:
  - code: no-provider
    status: 0
    retryable: false
  behavior:
  - if: '!(input.provider_id in state.providers)'
    then:
    - title: No authentication provider with this id is registered in this host
      fail:
        code: no-provider
        message: = "No authentication provider '" + input.provider_id + "' is currently registered."
  - title: provider.getSessions(scopes, options) on the provider object the extension registered
    source: src/vs/workbench/api/common/extHostAuthentication.ts:583-590
    call: '= state.providers[input.provider_id].kind == ''GitHubSessionEngine'' ? ''github-session-engine.get-sessions'' : ''third-party-extension.get-authentication-sessions'''
    targets:
    - github-session-engine.get-sessions
    - third-party-extension.get-authentication-sessions
    input:
      provider_id: = input.provider_id
      extension_id: = state.providers[input.provider_id].extension_id
      scopes: '= has(input.scopes) ? input.scopes : []'
    as: p
  - return:
      sessions: = vars.p.value.sessions
- component: third-party-extension
  name: get-authentication-sessions
  kind: function
  summary: An AuthenticationProvider.getSessions an extension registered (vscode.authentication.registerAuthenticationProvider), e.g. github-authentication's session engine.
  sources:
  - src/vs/workbench/api/common/extHostAuthentication.ts:583-590
  request:
    type: object
    properties:
      provider_id:
        type: string
      extension_id:
        type: string
      scopes: {}
  response:
    type: object
    properties:
      sessions:
        type: array
  behavior:
  - choice: stored
    default: none
    options:
      none:
      - return:
          sessions: []
      one:
      - return:
          sessions:
          - id: session-1
            access_token: token
            account:
              id: '1'
              label: dev
            scopes: = input.scopes
- component: main-thread-authentication
  name: ensure-provider
  kind: rpc
  attributes:
    shape: MainThreadAuthenticationShape
  summary: '$ensureProvider(id): activate onAuthenticationRequest:<id> (Immediate) so the extension that contributes the provider registers it.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:228
  - src/vs/workbench/api/browser/mainThreadAuthentication.ts:288-292
  request:
    type: object
    required:
    - provider_id
    properties:
      provider_id:
        type: string
  behavior:
  - call: extension-service.activate-by-event
    input:
      activation_event: = 'onAuthenticationRequest:' + input.provider_id
      activation_kind: immediate
  - return: {}
