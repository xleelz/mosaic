interfaces:
  # ======================= ext-host-extension-service =======================
  - component: ext-host-extension-service
    name: initialize
    kind: function
    summary: "Constructor + initialize(): a fresh host opens almostReadyToRunExtensions, waits for the workspace initialize call, opens readyToStartExtensionHost and, when autoStart is set (restart case), starts at once."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:212-227
    request: {type: object, properties: {auto_start: {type: boolean, default: true}, extensions: {type: array, items: {$ref: ExthostExtensionDescription}, default: []}, registry: {type: object, default: {}}}}
    behavior:
      - title: The init data carries the extension descriptions; build the global and own registries
        source: src/vs/workbench/api/common/extHostExtensionService.ts:161-167
        set: {state.almost_ready: true, state.ready_to_run: false, state.started: false, state.eager_activated: false, state.terminating: false, state.registry: "= input.registry"}
      - if: "input.auto_start"
        then:
          - title: initData.autoStart (EagerAutoStart host) starts the extension host without waiting for $startExtensionHost
            source: src/vs/workbench/api/common/extHostExtensionService.ts:222-224
            call: ext-host-extension-service.start-extension-host-internal
            input: {extensions: "= input.extensions", registry: "= input.registry"}
  - component: ext-host-extension-service
    name: start-extension-host
    kind: rpc
    summary: "$startExtensionHost(extensionsDelta): apply the delta to the global and own registries, then _startExtensionHost."
    attributes: {shape: ExtHostExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2715
      - src/vs/workbench/api/common/extHostExtensionService.ts:1009-1026
    request: {type: object, properties: {to_add: {type: array, items: {$ref: ExthostExtensionDescription}, default: []}, registry: {type: object, default: {}}}}
    behavior:
      - title: Apply the delta to the global and own registries
        source: src/vs/workbench/api/common/extHostExtensionService.ts:1013-1018
        set: {state.registry: "= merge(state.registry, input.registry)"}
      - call: ext-host-extension-service.start-extension-host-internal
        input: {extensions: "= input.to_add", registry: "= input.registry"}
  - component: ext-host-extension-service
    name: start-extension-host-internal
    kind: function
    summary: "_startExtensionHost: refuse a second start, open readyToRunExtensions, wait up to 1 s for activations requested during startup, run eager activation."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:803-822
    request: {type: object, properties: {extensions: {type: array, items: {$ref: ExthostExtensionDescription}, default: []}, registry: {type: object, default: {}}}}
    errors:
      - {code: extension-host-is-already-started, status: 0, retryable: false}
    behavior:
      - if: "state.started"
        then:
          - title: Extension host is already started!
            source: src/vs/workbench/api/common/extHostExtensionService.ts:804-806
            fail: {code: extension-host-is-already-started, message: "Extension host is already started!"}
      - set: {state.started: true, state.ready_to_run: true}
      - call: ext-host-extension-service.handle-eager-extensions
        input: {extensions: "= input.extensions", registry: "= input.registry"}
      - title: Eager extensions activated
        source: src/vs/workbench/api/common/extHostExtensionService.ts:816-820
        set: {state.eager_activated: true}
  - component: ext-host-extension-service
    name: handle-eager-extensions
    kind: function
    summary: "_handleEagerExtensions: activate '*' (startup), workspaceContains and resolver extensions; when they finish or after 10 s, activate onStartupFinished extensions."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:671-687
    request: {type: object, properties: {extensions: {type: array, items: {$ref: ExthostExtensionDescription}, default: []}, registry: {type: object, default: {}}}}
    behavior:
      - title: activateByEvent('*', startup=true); errors are only logged
        source: src/vs/workbench/api/common/extHostExtensionService.ts:672-674
        call: extensions-activator.activate-by-event
        input: {activation_event: "*", startup: true, extensions: "= input.extensions.filter(e, '*' in e.activation_events)", registry: "= input.registry"}
        timeout_ms: "= config['exthost-eager-activation-timeout-ms']"
        as: star
        on_error: continue
      - title: Promise.race([eager activation, timeout(10000)]) then onStartupFinished
        source: src/vs/workbench/api/common/extHostExtensionService.ts:681-683
        call: ext-host-extension-service.activate-all-startup-finished
        input: {extensions: "= input.extensions", registry: "= input.registry"}
  - component: ext-host-extension-service
    name: activate-all-startup-finished
    kind: function
    summary: "_activateAllStartupFinished: send performance marks, then activate every extension declaring onStartupFinished (deferred in 50 ms slices when the experimental setting is on)."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:647-669
      - src/vs/workbench/api/common/extHostExtensionService.ts:614-622
    request: {type: object, properties: {extensions: {type: array, items: {$ref: ExthostExtensionDescription}, default: []}, registry: {type: object, default: {}}}}
    behavior:
      - emit: main-thread-extension-service.set-performance-marks
        on: "= 'w' + self.substring(2)"
      - if: "config['extensions-experimental-deferred-startup-finished-activation']"
        then:
          - title: Deferred activation in setTimeout0 slices of 50 ms
            source: src/vs/workbench/api/common/extHostExtensionService.ts:624-645
            wait: 1
      - foreach: "= input.extensions.filter(e, 'onStartupFinished' in e.activation_events)"
        as: desc
        steps:
          - call: extensions-activator.handle-activation-request
            input: {extension: "= vars.desc", registry: "= input.registry", reason: {startup: false, extension_id: "= vars.desc.identifier", activation_event: onStartupFinished}}
            on_error: continue
  - component: ext-host-extension-service
    name: activate-by-event
    kind: rpc
    summary: "$activateByEvent(activationEvent, activationKind): Immediate waits only for almostReadyToRunExtensions, Normal for readyToRunExtensions; then the activator activates every extension of this host's registry declaring the event."
    attributes: {shape: ExtHostExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2717
      - src/vs/workbench/api/common/extHostExtensionService.ts:1028-1038
    request: ExthostActivateByEventRequest
    response: ExthostActivationResult
    behavior:
      - title: getExtensionDescriptionsForActivationEvent on the host's own registry
        source: src/vs/workbench/api/common/extHostExtensionActivator.ts:222
        set:
          vars.exts: "= state.registry.filter(k, 'activation_events' in state.registry[k] && input.activation_event in state.registry[k].activation_events).map(k, state.registry[k])"
          vars.kind: "= has(input.activation_kind) ? input.activation_kind : 'normal'"
      - if: "vars.kind == 'immediate'"
        then:
          - title: Immediate activation waits only for almostReadyToRunExtensions
            source: src/vs/workbench/api/common/extHostExtensionService.ts:1029-1032
            call: extensions-activator.activate-by-event
            input: {activation_event: "= input.activation_event", startup: false, extensions: "= vars.exts", registry: "= state.registry"}
            as: imm
          - return: "= vars.imm.value"
      - call: extensions-activator.activate-by-event
        input: {activation_event: "= input.activation_event", startup: false, extensions: "= vars.exts", registry: "= state.registry"}
        as: act
      - return: "= vars.act.value"
  - component: ext-host-extension-service
    name: activate
    kind: rpc
    summary: "$activate(extensionId, reason): unknown extensions are ignored (false); otherwise activate by id and return true."
    attributes: {shape: ExtHostExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2718
      - src/vs/workbench/api/common/extHostExtensionService.ts:1040-1048
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string, examples: [vscode.typescript-language-features]}, reason: {$ref: ExthostActivationReason}}}
    response: {type: object, properties: {activated: {type: boolean}}}
    behavior:
      - if: "!(input.extension_id in state.registry)"
        then:
          - title: Unknown extension, ignored
            source: src/vs/workbench/api/common/extHostExtensionService.ts:1042-1045
            return: {activated: false}
      - call: extensions-activator.handle-activation-request
        input: {extension: "= state.registry[input.extension_id]", registry: "= state.registry", reason: "= input.reason"}
      - return: {activated: true}
  - component: ext-host-extension-service
    name: delta-extensions
    kind: rpc
    summary: "$deltaExtensions: rebuild the extension path index and apply the delta to the global and own registries."
    attributes: {shape: ExtHostExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2722
      - src/vs/workbench/api/common/extHostExtensionService.ts:1050-1068
    request: {type: object, properties: {to_add: {type: array, items: {$ref: ExthostExtensionDescription}, default: []}, to_remove: {type: array, items: {type: string}, default: []}}}
    behavior:
      - set:
          state.registry: "= state.registry.transformMap(k, v, !(k in input.to_remove), v)"
      - foreach: "= input.to_add"
        as: e
        steps:
          - set:
              state.registry: "= merge(state.registry, {vars.e.identifier: {'identifier': vars.e.identifier, 'activation_events': vars.e.activation_events, 'main': 'main' in vars.e ? vars.e.main : '', 'extension_dependencies': 'extension_dependencies' in vars.e ? vars.e.extension_dependencies : []}})"
      - return: {registered: "= size(state.registry)"}
  - component: ext-host-extension-service
    name: get-extension-description
    kind: function
    summary: "extensions.getExtension(id): look the id up in the host's global registry; isActive from the activator."
    sources:
      - src/vs/workbench/api/common/extHost.api.impl.ts:615-630
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string, examples: [vscode.git]}}}
    response: {type: object, properties: {found: {type: boolean}, is_active: {type: boolean}}}
    behavior:
      - if: "!(input.extension_id in state.registry)"
        then:
          - return: {found: false, is_active: false}
      - call: extensions-activator.is-activated
        input: {extension_id: "= input.extension_id"}
        as: act
      - return: {found: true, is_active: "= vars.act.value.activated"}
  - component: ext-host-extension-service
    name: test-latency
    kind: rpc
    summary: "$test_latency(n): echo n."
    attributes: {shape: ExtHostExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2724
      - src/vs/workbench/api/common/extHostExtensionService.ts:1070-1072
    request: {type: object, properties: {n: {type: integer}}}
    latency_ms: 2
    behavior:
      - return: {n: "= input.n"}
  - component: ext-host-extension-service
    name: test-up
    kind: rpc
    summary: "$test_up(buffer): return its byte length."
    attributes: {shape: ExtHostExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2725
      - src/vs/workbench/api/common/extHostExtensionService.ts:1074-1076
    request: {type: object, properties: {byte_length: {type: integer}}}
    latency_ms: 40
    behavior:
      - return: {byte_length: "= input.byte_length"}
  - component: ext-host-extension-service
    name: test-down
    kind: rpc
    summary: "$test_down(size): return a buffer of size bytes."
    attributes: {shape: ExtHostExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2726
      - src/vs/workbench/api/common/extHostExtensionService.ts:1078-1085
    request: {type: object, properties: {size: {type: integer}}}
    latency_ms: 40
    behavior:
      - return: {size: "= input.size"}
  - component: ext-host-extension-service
    name: activate-extension
    kind: function
    summary: "_activateExtension: tell the renderer activation starts ($onWillActivateExtension, awaited on a local host), load the entry point and call activate(context); report $onDidActivateExtension or rethrow."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:421-437
      - src/vs/workbench/api/common/extHostExtensionService.ts:467-497
    request: {type: object, properties: {extension: {$ref: ExthostExtensionDescription}, reason: {$ref: ExthostActivationReason}}}
    response: {type: object, properties: {status: {type: string}, empty: {type: boolean}}}
    errors:
      - {code: activation-error, status: 0, retryable: false, summary: "the extension's activate() threw or its returned promise rejected"}
    behavior:
      - call: main-thread-extension-service.on-will-activate-extension
        on: "= 'w' + self.substring(2)"
        input: {extension_id: "= input.extension.identifier"}
      - if: "!('main' in input.extension) || input.extension.main == ''"
        then:
          - title: No entry point; treated as an empty extension (not an error)
            source: src/vs/workbench/api/common/extHostExtensionService.ts:474-478
            call: main-thread-extension-service.on-did-activate-extension
            on: "= 'w' + self.substring(2)"
            input: {extension_id: "= input.extension.identifier", activation_event: "= input.reason.activation_event"}
          - return: {status: activated, empty: true}
      - title: Load the module and the ExtensionContext, then call activate(context)
        source: src/vs/workbench/api/common/extHostExtensionService.ts:486-494
        call: third-party-extension.activate
        input: {extension_id: "= input.extension.identifier"}
        as: mod
      - call: main-thread-extension-service.on-did-activate-extension
        on: "= 'w' + self.substring(2)"
        input: {extension_id: "= input.extension.identifier", activation_event: "= input.reason.activation_event"}
      - return: {status: activated, empty: false}
  - component: ext-host-extension-service
    name: terminate
    kind: function
    summary: "terminate(reason): invalidate the proxies, deactivate every activated extension and exit after at most 5 s."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:248-283

  # ======================= extensions-activator =======================
  - component: extensions-activator
    name: create
    kind: function
    summary: "new ExtensionsActivator(...) in a freshly started host: no operations, no activated events."
    sources:
      - src/vs/workbench/api/common/extHostExtensionActivator.ts:177-188
    behavior:
      - set: {state.operations: {}, state.already_activated_events: []}
  - component: extensions-activator
    name: is-activated
    kind: function
    summary: "isActivated(id): an operation exists and has a value."
    sources:
      - src/vs/workbench/api/common/extHostExtensionActivator.ts:204-207
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string}}}
    response: {type: object, properties: {activated: {type: boolean}}}
    behavior:
      - return: {activated: "= input.extension_id in state.operations && state.operations[input.extension_id] == 'activated'"}
  - component: extensions-activator
    name: activate-by-event
    kind: function
    summary: "activateByEvent: skip events already handled; start activation of every extension declaring the event that is not active yet and wait for all of them (failures do not reject)."
    sources:
      - src/vs/workbench/api/common/extHostExtensionActivator.ts:217-229
      - src/vs/workbench/api/common/extHostExtensionActivator.ts:239-244
    request: ExthostMirrorActivationRequest
    response: ExthostActivationResult
    behavior:
      - if: "input.activation_event in state.already_activated_events"
        then:
          - title: This activation event was already handled on this host
            source: src/vs/workbench/api/common/extHostExtensionActivator.ts:218-220
            return: {activated: [], cached: true}
      - parallel: "= input.extensions.filter(e, !(e.identifier in state.operations))"
        as: ext
        steps:
          - call: extensions-activator.handle-activation-request
            input: {extension: "= vars.ext", registry: "= input.registry", reason: {startup: "= input.startup", extension_id: "= vars.ext.identifier", activation_event: "= input.activation_event"}}
            as: op
          - return: "= vars.op.value"
        join: {need: all}
        as_result: ops
      - set: {state.already_activated_events: "= state.already_activated_events + [input.activation_event]"}
      - return: {activated: "= vars.ops.results.filter(r, r.ok && r.value.status == 'activated').map(r, r.value.extension_id)", cached: false}
  - component: extensions-activator
    name: handle-activation-request
    kind: function
    summary: "_handleActivationRequest + ActivationOperation: reuse a running operation; fail on an unknown dependency or a failed dependency; activate dependencies first, then the extension; a thrown activation becomes FailedExtension and is reported, never rethrown."
    sources:
      - src/vs/workbench/api/common/extHostExtensionActivator.ts:250-316
      - src/vs/workbench/api/common/extHostExtensionActivator.ts:368-451
    request: {type: object, required: [extension], properties: {extension: {$ref: ExthostExtensionDescription}, registry: {type: object, default: {}}, reason: {$ref: ExthostActivationReason}}}
    response: {type: object, properties: {extension_id: {type: string}, status: {type: string, enum: [activated, failed]}}}
    behavior:
      - if: "input.extension.identifier in state.operations"
        then:
          - title: An activation operation already exists for this extension
            source: src/vs/workbench/api/common/extHostExtensionActivator.ts:251-253
            return: {extension_id: "= input.extension.identifier", status: "= state.operations[input.extension.identifier]"}
      - set:
          vars.deps: "= 'extension_dependencies' in input.extension ? input.extension.extension_dependencies : []"
      - set:
          vars.missing: "= vars.deps.filter(d, !(d in input.registry))"
      - if: "size(vars.missing) > 0"
        then:
          - title: "Error condition 1: depends on an unknown extension"
            source: src/vs/workbench/api/common/extHostExtensionActivator.ts:304-314
            set: {state.operations: "= merge(state.operations, {input.extension.identifier: 'failed'})"}
          - call: main-thread-extension-service.on-extension-activation-error
            on: "= 'w' + self.substring(2)"
            input: {extension_id: "= input.extension.identifier", error: "= 'Cannot activate the ' + input.extension.identifier + ' extension because it depends on unknown extension ' + vars.missing[0]", missing_dependency: "= vars.missing[0]"}
          - return: {extension_id: "= input.extension.identifier", status: failed}
      - foreach: "= vars.deps.filter(d, d in input.registry && input.registry[d].main != '')"
        as: dep
        steps:
          - title: Wait for the dependency to activate first
            source: src/vs/workbench/api/common/extHostExtensionActivator.ts:290-301
            call: extensions-activator.handle-activation-request
            input: {extension: "= input.registry[vars.dep]", registry: "= input.registry", reason: "= input.reason"}
            as: depop
          - if: "vars.depop.value.status == 'failed'"
            then:
              - title: "Error condition 2: a dependency failed to activate"
                source: src/vs/workbench/api/common/extHostExtensionActivator.ts:391-399
                set: {state.operations: "= merge(state.operations, {input.extension.identifier: 'failed'})"}
              - call: main-thread-extension-service.on-extension-activation-error
                on: "= 'w' + self.substring(2)"
                input: {extension_id: "= input.extension.identifier", error: "= 'Cannot activate the ' + input.extension.identifier + ' extension because its dependency ' + vars.dep + ' failed to activate'", missing_dependency: ""}
              - return: {extension_id: "= input.extension.identifier", status: failed}
      - call: ext-host-extension-service.activate-extension
        input: {extension: "= input.extension", reason: "= input.reason"}
        as: act
        on_error: continue
      - if: "vars.act.ok"
        then:
          - set: {state.operations: "= merge(state.operations, {input.extension.identifier: 'activated'})"}
          - return: {extension_id: "= input.extension.identifier", status: activated}
      - title: Activation threw; the extension is treated as empty (FailedExtension) and the error reported
        source: src/vs/workbench/api/common/extHostExtensionActivator.ts:425-450
        set: {state.operations: "= merge(state.operations, {input.extension.identifier: 'failed'})"}
      - call: main-thread-extension-service.on-extension-activation-error
        on: "= 'w' + self.substring(2)"
        input: {extension_id: "= input.extension.identifier", error: "= 'Activating extension ' + input.extension.identifier + ' failed: ' + vars.act.error.message + '.'", missing_dependency: ""}
      - return: {extension_id: "= input.extension.identifier", status: failed}

  # ======================= main-thread-extension-service =======================
  - component: main-thread-extension-service
    name: on-will-activate-extension
    kind: rpc
    summary: "$onWillActivateExtension -> IInternalExtensionService._onWillActivateExtension."
    attributes: {shape: MainThreadExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2085
      - src/vs/workbench/api/browser/mainThreadExtensionService.ts:70-72
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string, examples: [vscode.typescript-language-features]}}}
    behavior:
      - call: extension-service.on-will-activate-extension
        input: {extension_id: "= input.extension_id"}
  - component: main-thread-extension-service
    name: on-did-activate-extension
    kind: rpc
    summary: "$onDidActivateExtension -> IInternalExtensionService._onDidActivateExtension (activation times)."
    attributes: {shape: MainThreadExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2086
      - src/vs/workbench/api/browser/mainThreadExtensionService.ts:73-75
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string}, activation_event: {type: string}}}
    behavior:
      - call: extension-service.on-did-activate-extension
        input: {extension_id: "= input.extension_id", activation_event: "= input.activation_event"}
  - component: main-thread-extension-service
    name: on-extension-activation-error
    kind: rpc
    summary: "$onExtensionActivationError: record the error; for a missing dependency show an actionable notification; otherwise notify only in development builds (console.error in a built product)."
    attributes: {shape: MainThreadExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2087
      - src/vs/workbench/api/browser/mainThreadExtensionService.ts:82-109
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string}, error: {type: string}, missing_dependency: {type: string, default: ""}}}
    response: {type: object, properties: {notified: {type: boolean}}}
    behavior:
      - call: extension-service.on-did-activate-extension-error
        input: {extension_id: "= input.extension_id", error: "= input.error"}
      - if: "input.missing_dependency != ''"
        then:
          - title: Missing dependency not installed and unknown; error notification
            source: src/vs/workbench/api/browser/mainThreadExtensionService.ts:159-179
            call: notification-service.notify
            input: {severity: error, message: "= 'Cannot activate the ' + input.extension_id + ' extension because it depends on an unknown ' + input.missing_dependency + ' extension.'"}
          - return: {notified: true}
      - title: Built product, not extension development; console.error only
        source: src/vs/workbench/api/browser/mainThreadExtensionService.ts:102-108
        return: {notified: false}
  - component: main-thread-extension-service
    name: set-performance-marks
    kind: rpc
    summary: "$setPerformanceMarks: hand the host's startup marks to the timer service."
    attributes: {shape: MainThreadExtensionServiceShape}
    sources:
      - src/vs/workbench/api/common/extHost.protocol.ts:2089
      - src/vs/workbench/api/browser/mainThreadExtensionService.ts:182-190

  # ======================= third-party extension (actor) =======================
  - component: third-party-extension
    name: activate
    kind: function
    summary: "The extension module's exported activate(context). Its outcome is the extension's own code, so scenarios choose it."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:590-611
    request: {type: object, required: [extension_id], properties: {extension_id: {type: string, examples: [vscode.typescript-language-features]}}}
    response: {type: object, properties: {extension_id: {type: string}}}
    behavior:
      - choice: outcome
        default: ok
        options:
          ok:
            - return: {extension_id: "= input.extension_id"}
          throws:
            - fail: {code: activation-error, message: "activate() threw"}
  - component: third-party-extension
    name: run-command
    kind: function
    summary: "The callback an extension registered with commands.registerCommand."
    sources:
      - src/vs/workbench/api/common/extHostCommands.ts:244-246
    request: {type: object, properties: {command_id: {type: string}, args: {type: array}}}
    response: {type: object, properties: {value: {type: string}}}
    behavior:
      - return: {value: "= 'ran ' + input.command_id"}
  - component: third-party-extension
    name: handle-uri
    kind: function
    summary: "The UriHandler.handleUri an extension registered with window.registerUriHandler."
    sources:
      - src/vs/workbench/api/common/extHostUrls.ts:49-58
    request: {type: object, properties: {uri: {type: string}}}
  - component: third-party-extension
    name: call-api
    kind: function
    summary: "Extension code calling one vscode.* API function (any of the vscode-api interfaces)."
