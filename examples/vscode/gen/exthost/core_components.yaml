components:
  # ---------------- renderer side (per window) ----------------
  - id: extension-service
    name: ExtensionService (NativeExtensionService)
    kind: service
    layer: extensions
    parent: exthost-bridge
    summary: "IExtensionService: scans extensions, creates extension host managers, activates by event, restarts hosts after crashes. Desktop impl NativeExtensionService extends AbstractExtensionService."
    sources:
      - src/vs/workbench/services/extensions/common/extensions.ts:39
      - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:773
      - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:61-124
      - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:63-140
    attributes: {owner: exthost, impl: NativeExtensionService, web_impl: "ExtensionService (browser/extensionService.ts:361)"}
    state:
      schema:
        type: object
        properties:
          ready: {type: boolean}
          requested_events: {type: array, items: {type: string}}
          host_state: {type: string, enum: [running, stopped, failed]}
          host_responsive: {type: boolean}
          is_extension_dev_host: {type: boolean}
          activation_times: {type: object}
          activation_errors: {type: object}
          restarts: {type: integer}
          web_worker_host: {type: string}
      initial: {ready: true, requested_events: [], host_state: running, host_responsive: true, is_extension_dev_host: false, activation_times: {}, activation_errors: {}, restarts: 0, web_worker_host: lazy}
  - id: extension-host-manager
    name: ExtensionHostManager
    kind: module
    layer: extensions
    parent: extension-service
    summary: "One per running extension host: owns the RPCProtocol, instantiates the MainThread* customers, caches activation events and forwards activation to the host."
    sources:
      - src/vs/workbench/services/extensions/common/extensionHostManager.ts:58-162
    attributes: {owner: exthost}
    state:
      schema:
        type: object
        properties:
          cached_events: {type: array, items: {type: string}}
          resolved_events: {type: array, items: {type: string}}
          has_started: {type: boolean}
      initial: {cached_events: [], resolved_events: [], has_started: true}
  - id: extension-host-crash-tracker
    name: ExtensionHostCrashTracker
    kind: module
    layer: extensions
    parent: extension-service
    summary: "Remembers crash timestamps of the last 5 minutes and allows automatic restart while fewer than 3 are recorded (NativeExtensionService._localCrashTracker)."
    sources:
      - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1549-1572
      - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:66
    attributes: {owner: exthost}
    state:
      schema: {type: object, properties: {recent_crashes: {type: array, items: {type: integer}}}}
      initial: {recent_crashes: []}
  - id: native-local-process-extension-host
    name: NativeLocalProcessExtensionHost
    kind: module
    layer: extensions
    parent: extension-host-manager
    summary: "Spawns the local extension host process through IExtensionHostStarter, performs the Ready/Initialized handshake and reports unexpected exits."
    sources:
      - src/vs/workbench/services/extensions/electron-browser/localProcessExtensionHost.ts:95-120
      - src/vs/workbench/services/extensions/electron-browser/localProcessExtensionHost.ts:208-219
    attributes: {owner: exthost}
    state:
      schema: {type: object, properties: {terminating: {type: boolean}, pid: {type: integer}}}
      initial: {terminating: false, pid: 4242}
  - id: web-worker-extension-host
    name: WebWorkerExtensionHost
    kind: module
    layer: extensions
    parent: extension-service
    summary: "The web worker extension host for web extensions; on desktop LazyAutoStart under extensions.webWorker=auto."
    sources:
      - src/vs/workbench/services/extensions/browser/webWorkerExtensionHost.ts:46
    attributes: {owner: exthost}
  - id: extension-host-worker
    name: Extension host web worker
    kind: service
    layer: process
    parent: exthost-bridge
    summary: "The web worker that runs the worker extension host (extensionHostWorkerMain)."
    sources:
      - src/vs/workbench/api/worker/extensionHostWorkerMain.ts:6-9
    attributes: {owner: exthost}
  - id: rpc-protocol
    name: RPCProtocol (renderer end)
    kind: module
    layer: extensions
    parent: extension-host-manager
    summary: "Sends requests to the extension host, counts unacknowledged ones and flips the responsive state after 3 s without an acknowledgement."
    sources:
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:115-160
    attributes: {owner: exthost}
    state:
      schema: {type: object, properties: {unacked: {type: integer}, unresponsive_at: {type: integer}, responsive: {type: boolean}}}
      initial: {unacked: 0, unresponsive_at: 0, responsive: true}
  - id: restart-extension-host-action
    name: RestartExtensionHostAction
    kind: function
    layer: extensions
    parent: extension-service
    summary: "Developer: Restart Extension Host (workbench.action.restartExtensionHost)."
    sources:
      - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:750-771
    attributes: {owner: exthost}
  - id: measure-ext-host-latency-action
    name: MeasureExtHostLatencyAction
    kind: function
    layer: extensions
    parent: extension-service
    summary: "Developer: Measure Extension Host Latency (editor.action.measureExtHostLatency)."
    sources:
      - src/vs/workbench/services/extensions/common/extensionHostManager.ts:626-661
    attributes: {owner: exthost}
  - id: extension-url-handler
    name: ExtensionUrlHandler
    kind: service
    layer: extensions
    parent: exthost-bridge
    summary: "IExtensionUrlHandler: routes vscode://<extension-id>/... URIs to the extension, asking for confirmation and activating onUri:<id>."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:68
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:115-152
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:354
    attributes: {owner: exthost}
    state:
      schema: {type: object, properties: {handlers: {type: object}, uri_buffer: {type: object}}}
      initial: {handlers: {}, uri_buffer: {}}
  - id: user-trusted-extension-id-storage
    name: UserTrustedExtensionIdStorage
    kind: module
    layer: extensions
    parent: extension-url-handler
    summary: "Profile-scoped storage key extensionUrlHandler.confirmedExtensions: extensions the user allowed to open URIs without asking."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:41-66
    attributes: {owner: exthost}
    state:
      schema: {type: object, properties: {extensions: {type: array, items: {type: string}}}}
      initial: {extensions: []}
  - id: manage-authorized-extension-uris-action
    name: ManageAuthorizedExtensionURIsAction
    kind: function
    layer: extensions
    parent: extension-url-handler
    summary: "Extensions: Manage Authorized Extension URIs... (workbench.extensions.action.manageAuthorizedExtensionURIs)."
    sources:
      - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:391-426
    attributes: {owner: exthost}
  - id: main-thread-documents
    name: MainThreadDocuments
    kind: module
    layer: extensions
    parent: exthost-bridge
    summary: "Main side of the documents API, created by MainThreadDocumentsAndEditors: open, create and save documents for extensions."
    sources:
      - src/vs/workbench/api/browser/mainThreadDocuments.ts:126
    attributes: {owner: exthost}
  - id: main-thread-cli-commands
    name: MainThreadCLICommands
    kind: module
    layer: extensions
    parent: exthost-bridge
    summary: "Internal _remoteCLI.* commands the remote 'code' CLI (via the extension host's CLI server) runs in the window."
    sources:
      - src/vs/workbench/api/browser/mainThreadCLICommands.ts:30-33
      - src/vs/workbench/api/browser/mainThreadCLICommands.ts:35-41
      - src/vs/workbench/api/browser/mainThreadCLICommands.ts:43-46
      - src/vs/workbench/api/browser/mainThreadCLICommands.ts:55-97
    attributes: {owner: exthost}

  # ---------------- extension host side (per host) ----------------
  - id: ext-host-extension-service
    name: ExtHostExtensionService
    kind: service
    layer: extensions
    parent: exthost-runtime
    summary: "AbstractExtHostExtensionService: the host's registry, readiness barriers, eager activation and the $activateByEvent/$activate/$startExtensionHost RPC surface."
    sources:
      - src/vs/workbench/api/common/extHostExtensionService.ts:1151
      - src/vs/workbench/api/node/extHost.node.services.ts:43
      - src/vs/workbench/api/common/extHostExtensionService.ts:150-206
    attributes: {owner: exthost, shape: ExtHostExtensionServiceShape}
    state:
      schema:
        type: object
        properties:
          almost_ready: {type: boolean}
          ready_to_run: {type: boolean}
          started: {type: boolean}
          eager_activated: {type: boolean}
          terminating: {type: boolean}
          registry: {type: object}
      initial: {almost_ready: true, ready_to_run: true, started: true, eager_activated: true, terminating: false, registry: {}}
  - id: extensions-activator
    name: ExtensionsActivator
    kind: module
    layer: extensions
    parent: ext-host-extension-service
    summary: "Activates extensions once each, after their dependencies; records failed activations as FailedExtension without rejecting the caller."
    sources:
      - src/vs/workbench/api/common/extHostExtensionActivator.ts:166-188
    attributes: {owner: exthost}
    state:
      schema: {type: object, properties: {operations: {type: object}, already_activated_events: {type: array, items: {type: string}}}}
      initial: {operations: {}, already_activated_events: []}
  - id: ext-host-message-service
    name: ExtHostMessageService
    kind: module
    layer: extensions
    parent: exthost-runtime
    summary: "Converts window.show*Message items into handles and calls $showMessage."
    sources:
      - src/vs/workbench/api/common/extHostMessageService.ts:17-27
    attributes: {owner: exthost}
  - id: ext-host-bulk-edits
    name: ExtHostBulkEdits
    kind: module
    layer: extensions
    parent: exthost-runtime
    summary: "workspace.applyEdit: serializes the WorkspaceEdit and calls $tryApplyWorkspaceEdit."
    sources:
      - src/vs/workbench/api/common/extHostBulkEdits.ts:14-35
    attributes: {owner: exthost}
  - id: ext-host-document-data
    name: ExtHostDocumentData
    kind: module
    layer: extensions
    parent: exthost-runtime
    summary: "The extension-side TextDocument; save() calls $trySaveDocument unless the document was closed."
    sources:
      - src/vs/workbench/api/common/extHostDocumentData.ts:110-115
    attributes: {owner: exthost}
  - id: ext-host-rpc-protocol
    name: RPCProtocol (extension host end)
    kind: module
    layer: extensions
    parent: exthost-runtime
    summary: "Receives requests on the extension host thread, acknowledges each one and dispatches it to the registered ExtHost* object."
    sources:
      - src/vs/workbench/services/extensions/common/rpcProtocol.ts:358-380
    attributes: {owner: exthost}
  - id: vscode-api
    name: vscode API (extHost.api.impl)
    kind: module
    layer: extensions
    parent: exthost-runtime
    summary: "The vscode.* namespace object each extension receives (createApiFactoryAndRegisterActors); each function forwards to an ExtHost* service. builtin-extensions call these interfaces."
    sources:
      - src/vs/workbench/api/common/extHost.api.impl.ts:152
      - src/vs/workbench/api/common/extHost.api.impl.ts:291
      - src/vscode-dts/vscode.d.ts:6
    attributes: {owner: exthost}
