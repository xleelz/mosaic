patches:
- iface: sessions-chat-pet-achievement-contribution.start
  sources:
  - src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:16-29
  - src/vs/sessions/contrib/chat/browser/chat.contribution.ts:652
  summary: 'Constructor: unlock agentsWindowOpened, then listen to onDidSendRequest.'
  behavior:
  - title: Unlock the Agents window opened achievement at construction
    source: src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:21
    call: chat-pet-service.unlock-achievement
    input:
      id: agentsWindowOpened
  - title: Register the onDidSendRequest listener
    source: src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:22-27
    set:
      state.listening: true
  - return:
      started: true
- iface: sessions-management-service.send-new-chat-request
  request:
    type: object
    properties:
      session_id:
        type: string
        examples:
        - local-agent-host/9f2c4e1a
        default: local-agent-host/9f2c4e1a
      provider_id:
        type: string
        examples:
        - local-agent-host
        default: local-agent-host
      query:
        type: string
        examples:
        - Add a unit test for add()
      attached_context:
        type: array
        items:
          type: object
        description: options.attachedContext; each entry has a kind (image, file, ...)
        default:
        - kind: image
          name: screenshot.png
        examples:
        - - kind: image
            name: screenshot.png
  behavior:
  - call: sessions-providers-service.get-provider
    input:
      id: = input.provider_id
    as: p
    fill: true
  - if: has(vars.p.value.missing)
    then:
    - source: src/vs/sessions/services/sessions/browser/sessionsManagementService.ts:821
      title: Unknown provider
      fail:
        code: sessions-provider-not-found
        message: = 'Sessions provider \'' + input.provider_id + '\' not found'
  - set:
      state.new_session: ''
  - call: local-agent-host-sessions-provider.send-request
    input:
      session_id: = input.session_id
      query: = input.query
    as: r
    fill: true
  - title: 'Foreground send done: fire onDidSendRequest with the request options'
    source: src/vs/sessions/services/sessions/browser/sessionsManagementService.ts:875
    publish: sessions-management-service.on-did-send-request
    input:
      session_id: = vars.r.value.session_id
      is_new_session: true
      attached_context: '= has(input.attached_context) ? input.attached_context : []'
    delivery: sync
  - return:
      session_id: = vars.r.value.session_id
components:
- id: sessions-chat-pet-achievement-contribution
  name: SessionsChatPetAchievementContribution
  kind: module
  layer: ai
  parent: agents
  summary: Unlocks the Agents window opened achievement, and first-message achievements on send.
  sources:
  - src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:12
  - src/vs/sessions/contrib/chat/browser/chat.contribution.ts:652
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        listening:
          type: boolean
    initial:
      listening: false
- id: sessions-titlebar-part
  name: TitlebarPart (Agents window)
  kind: module
  layer: ai
  parent: agents
  summary: 'The Agents window title bar part: its height follows window.density.layout (44 px default, 35 px compact, min == max) and it re-lays out on a density change.'
  sources:
  - src/vs/sessions/browser/parts/titlebarPart.ts:51-70
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        layout_changes:
          type: integer
    initial:
      layout_changes: 0
- id: agent-host-sandbox-toggle
  name: agentHostSandboxToggle
  kind: module
  layer: ai
  parent: agents
  summary: 'The agent-host sandboxing toggle policy shared by the chat input and the Agents window permission picker: session choice, global setting, managed enforcement with bypass, and the runtime-confirmed
    state after an apply failure.'
  sources:
  - src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:9-20
  - src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:34-57
  attributes:
    owner: agents
interfaces:
- component: sessions-chat-pet-achievement-contribution
  name: on-did-send-request
  kind: function
  summary: 'onDidSendRequest listener: unlock firstChatMessage, and imageRequest when the request attaches an image.'
  sources:
  - src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:22-27
  subscribe:
  - sessions-management-service.on-did-send-request
  request:
    type: object
    properties:
      session_id:
        type: string
      attached_context:
        type: array
  response:
    type: object
    properties:
      unlocked:
        type: array
  behavior:
  - if: '!state.listening'
    then:
    - title: The contribution was not constructed, so nothing listens
      source: src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:22
      return:
        unlocked: []
  - title: Unlock firstChatMessage
    source: src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:23
    call: chat-pet-service.unlock-achievement
    input:
      id: firstChatMessage
  - if: has(input.attached_context) && input.attached_context.exists(e, e.kind == 'image')
    then:
    - title: 'hasChatPetImageAttachment: some entry has kind image'
      source: src/vs/sessions/contrib/chat/browser/chatPetAchievements.ts:24-26
      call: chat-pet-service.unlock-achievement
      input:
        id: imageRequest
    - return:
        unlocked:
        - firstChatMessage
        - imageRequest
  - return:
      unlocked:
      - firstChatMessage
- component: sessions-management-service
  name: on-did-send-request
  kind: event
  summary: 'ISessionsManagementService.onDidSendRequest: a request was sent for a session.'
  sources:
  - src/vs/sessions/services/sessions/browser/sessionsManagementService.ts:51-52
  request:
    type: object
    properties:
      session_id:
        type: string
      is_new_session:
        type: boolean
      attached_context:
        type: array
- component: sessions-titlebar-part
  name: get-minimum-height
  kind: function
  summary: 'minimumHeight (and maximumHeight, which returns it): density compact gives DEFAULT_CUSTOM_TITLEBAR_HEIGHT (35), else DEFAULT_SESSIONS_TITLEBAR_HEIGHT (44); WCO on web raises it; preventZoom
    divides by the zoom factor.'
  sources:
  - src/vs/sessions/browser/parts/titlebarPart.ts:58-70
  request:
    type: object
    properties:
      wco_height:
        type: integer
        default: 0
      zoom_factor:
        type: number
        default: 1
      prevent_zoom:
        type: boolean
        default: false
  response:
    type: object
    properties:
      minimum_height:
        type: number
      maximum_height:
        type: number
  behavior:
  - if: config['window-density-layout'] == 'compact'
    then:
    - title: 'Compact density: DEFAULT_CUSTOM_TITLEBAR_HEIGHT'
      source: src/vs/platform/window/common/window.ts:386
      set:
        vars.h: 35
    else:
    - title: 'Default density: DEFAULT_SESSIONS_TITLEBAR_HEIGHT'
      source: src/vs/sessions/browser/parts/titlebarPart.ts:39
      set:
        vars.h: 44
  - if: has(input.wco_height) && input.wco_height > vars.h
    then:
    - title: Window controls overlay (web) can raise it
      source: src/vs/sessions/browser/parts/titlebarPart.ts:63-65
      set:
        vars.h: = input.wco_height
  - set:
      vars.h: '= has(input.prevent_zoom) && input.prevent_zoom ? double(vars.h) / double(input.zoom_factor) : double(vars.h)'
  - title: maximumHeight returns minimumHeight
    source: src/vs/sessions/browser/parts/titlebarPart.ts:70
    return:
      minimum_height: = vars.h
      maximum_height: = vars.h
- component: sessions-titlebar-part
  name: on-did-change-configuration
  kind: function
  summary: 'registerListeners: a window.density.layout change fires onDidChange so the grid re-lays out the part.'
  sources:
  - src/vs/sessions/browser/parts/titlebarPart.ts:122-129
  subscribe:
  - configuration-service.on-did-change-configuration
  request:
    type: object
    properties:
      affected_keys:
        type: array
        items:
          type: string
      source:
        type: string
  response:
    type: object
    properties:
      relayout:
        type: boolean
  behavior:
  - if: '!has(input.affected_keys) || !(''window.density.layout'' in input.affected_keys)'
    then:
    - return:
        relayout: false
  - title: 'affectsConfiguration(MODERN_UI_DENSITY): _onDidChange.fire'
    source: src/vs/sessions/browser/parts/titlebarPart.ts:126-128
    set:
      state.layout_changes: = state.layout_changes + 1
  - return:
      relayout: true
- component: agent-host-sandbox-toggle
  name: get-toggle-state
  kind: function
  summary: 'getAgentHostSandboxToggleState: only for copilotcli; checked is forced on when managed without bypass, else the session choice, else managed or global; disabled when blocked or the dev container
    cannot sandbox and it is off.'
  sources:
  - src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:34-49
  request: &id001
    type: object
    properties:
      provider:
        type: string
        examples:
        - copilotcli
        default: copilotcli
      session_enabled:
        type:
        - boolean
        - 'null'
        default: null
      confirmed_enabled:
        type:
        - boolean
        - 'null'
        default: null
      apply_failed:
        type: boolean
        default: false
      global_enabled:
        type: boolean
        default: false
      managed_enabled:
        type: boolean
        default: false
      allows_bypass:
        type: boolean
        default: false
      dev_container_sandbox_supported:
        type:
        - boolean
        - 'null'
        default: null
  response:
    type: object
    properties:
      applicable:
        type: boolean
      checked:
        type: boolean
      disabled:
        type: boolean
  behavior:
  - if: '!has(input.provider) || input.provider != ''copilotcli'''
    then:
    - title: Only the Copilot CLI provider has the toggle
      source: src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:41-43
      return:
        applicable: false
        checked: false
        disabled: false
  - set:
      vars.blocked: = has(input.managed_enabled) && input.managed_enabled && !(has(input.allows_bypass) && input.allows_bypass)
  - if: vars.blocked
    then:
    - title: 'Managed sandboxing without bypass blocks disabling: checked and disabled'
      source: src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:35-37
      return:
        applicable: true
        checked: true
        disabled: true
  - if: has(input.session_enabled) && input.session_enabled != null
    then:
    - title: The session choice wins
      source: src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:44
      set:
        vars.checked: = input.session_enabled
    else:
    - title: 'No session choice: managed or the global setting'
      source: src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:44
      set:
        vars.checked: = (has(input.managed_enabled) && input.managed_enabled) || (has(input.global_enabled) && input.global_enabled)
  - title: Disabled when the dev container cannot sandbox and it is off
    source: src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:45-48
    return:
      applicable: true
      checked: = vars.checked
      disabled: = has(input.dev_container_sandbox_supported) && input.dev_container_sandbox_supported == false && !vars.checked
- component: agent-host-sandbox-toggle
  name: get-collapsed-state
  kind: function
  summary: 'getAgentHostSandboxCollapsedState: after an apply failure the runtime-confirmed value replaces the session choice (when there is one).'
  sources:
  - src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:51-57
  request: *id001
  response:
    type: object
    properties:
      checked:
        type: boolean
      applicable:
        type: boolean
  behavior:
  - if: has(input.apply_failed) && input.apply_failed && has(input.confirmed_enabled) && input.confirmed_enabled != null
    then:
    - title: 'applyFailed: use confirmedEnabled ?? sessionEnabled'
      source: src/vs/platform/agentHost/browser/agentHostSandboxToggle.ts:55
      set:
        vars.session: = input.confirmed_enabled
    else:
    - set:
        vars.session: '= has(input.session_enabled) ? input.session_enabled : null'
  - call: agent-host-sandbox-toggle.get-toggle-state
    as: t
    input:
      provider: '= has(input.provider) ? input.provider : '''''
      session_enabled: = vars.session
      global_enabled: = has(input.global_enabled) && input.global_enabled
      managed_enabled: = has(input.managed_enabled) && input.managed_enabled
      allows_bypass: = has(input.allows_bypass) && input.allows_bypass
      dev_container_sandbox_supported: '= has(input.dev_container_sandbox_supported) ? input.dev_container_sandbox_supported : null'
  - return:
      checked: = vars.t.value.checked
      applicable: = vars.t.value.applicable
flows:
- id: agents-sessions-titlebar-height
  name: Agents window title bar height
  entry:
    caller: sessions-workbench
    interface: sessions-titlebar-part.get-minimum-height
  sources:
  - src/vs/sessions/browser/parts/titlebarPart.ts:58-70
  tags:
  - feature:agent-sessions
- id: agents-sandbox-toggle
  name: Agent host sandboxing toggle state (permission picker)
  entry:
    caller: user
    interface: agent-host-sandbox-toggle.get-collapsed-state
  sources:
  - src/vs/sessions/contrib/providers/copilotChatSessions/browser/permissionPicker.ts:604-623
  tags:
  - feature:agent-sessions
scenarios:
- id: agents-sessions-titlebar-height-default
  flow: agents-sessions-titlebar-height
  fixtures:
  - agents-seed
  expect:
  - result.ok
  - result.value.minimum_height == 44.0
  - result.value.maximum_height == result.value.minimum_height
- id: agents-sessions-titlebar-height-compact
  flow: agents-sessions-titlebar-height
  fixtures:
  - agents-seed
  config:
    window-density-layout: compact
  expect:
  - result.ok
  - result.value.minimum_height == 35.0
  - result.value.maximum_height == 35.0
- id: agents-sessions-titlebar-height-wco-zoom
  flow: agents-sessions-titlebar-height
  fixtures:
  - agents-seed
  input:
    wco_height: 48
    prevent_zoom: true
    zoom_factor: 2
  expect:
  - result.ok
  - result.value.minimum_height == 24.0
- id: agents-sandbox-toggle-apply-failed-off-request
  flow: agents-sandbox-toggle
  input:
    session_enabled: false
    confirmed_enabled: true
    apply_failed: true
  expect:
  - result.ok
  - result.value.checked == true
- id: agents-sandbox-toggle-apply-failed-on-request
  flow: agents-sandbox-toggle
  input:
    session_enabled: true
    confirmed_enabled: false
    apply_failed: true
  expect:
  - result.ok
  - result.value.checked == false
- id: agents-sandbox-toggle-nothing-confirmed
  flow: agents-sandbox-toggle
  input:
    session_enabled: false
    apply_failed: true
  expect:
  - result.ok
  - result.value.checked == false
- id: agents-sandbox-toggle-global-default
  flow: agents-sandbox-toggle
  input:
    global_enabled: true
  expect:
  - result.ok
  - result.value.checked == true
- id: agents-sandbox-toggle-managed-no-bypass
  flow: agents-sandbox-toggle
  input:
    session_enabled: false
    managed_enabled: true
  expect:
  - result.ok
  - result.value.checked == true
  - trace.exists(e, e.type == 'call.end' && e.interface == 'agent-host-sandbox-toggle.get-toggle-state' && e.output.disabled == true)
- id: agents-sandbox-toggle-dev-container-unsupported
  flow: agents-sandbox-toggle
  input:
    session_enabled: false
    dev_container_sandbox_supported: false
  expect:
  - result.ok
  - result.value.checked == false
  - trace.exists(e, e.type == 'call.end' && e.interface == 'agent-host-sandbox-toggle.get-toggle-state' && e.output.disabled == true)
- id: agents-sandbox-toggle-other-provider
  flow: agents-sandbox-toggle
  input:
    provider: claude
    session_enabled: true
  expect:
  - result.ok
  - result.value.applicable == false
- id: agents-sessions-chat-pet-unlocks
  fixtures:
  - full-window
  - agents-seed
  state:
    sessions-providers-service@w1:
      providers:
        local-agent-host:
          id: local-agent-host
          order: 0
          session_types:
          - copilotcli
  steps:
  - interface: sessions-chat-pet-achievement-contribution.start
    caller: user
    as: contrib
  - flow: agents-sessions-new-session
    as: new
  - flow: agents-sessions-send
    as: send
  expect:
  - steps.contrib.result.ok
  - steps.send.result.ok
  - state['sessions-chat-pet-achievement-contribution@w1'].listening == true
  - trace.filter(e, e.type == 'call.start' && e.interface == 'chat-pet-service.unlock-achievement').map(e, e.input.id) == ['agentsWindowOpened', 'firstChatMessage', 'imageRequest']
- id: agents-sessions-send-without-listener
  fixtures:
  - full-window
  - agents-seed
  state:
    sessions-providers-service@w1:
      providers:
        local-agent-host:
          id: local-agent-host
          order: 0
          session_types:
          - copilotcli
  expect:
  - steps.send.result.ok
  - trace.filter(e, e.type == 'call.start' && e.interface == 'chat-pet-service.unlock-achievement').size() == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'sessions-chat-pet-achievement-contribution.on-did-send-request' && size(e.output.unlocked) == 0)
  steps:
  - flow: agents-sessions-new-session
    as: new
  - flow: agents-sessions-send
    as: send
    input:
      attached_context: []
configs:
- id: window-density-layout
  type: string
  value: default
  default: default
  summary: 'window.density.layout: compact uses a shorter title bar in the Agents window (reference; registered by workbench-shell).'
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:260-268
  attributes:
    boundary: true
    owner: workbench-shell
    key: window.density.layout
flow_tags:
  agents-sessions-window-startup:
  - feature:agent-sessions
  agents-sessions-send:
  - feature:agent-sessions
  agents-sessions-new-session:
  - feature:agent-sessions
  agents-mcp-start-server:
  - feature:mcp
  agents-mcp-tool-invoke:
  - feature:mcp
  agents-mcp-sampling:
  - feature:mcp
