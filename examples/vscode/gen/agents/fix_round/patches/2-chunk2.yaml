  sources:
  - src/vs/sessions/contrib/chat/browser/chat.contribution.ts:855-862
  - src/vs/sessions/contrib/chat/common/constants.ts:12
  attributes:
    key: chat.agentSessions.appearanceTools.enabled
- id: environment-is-built
  type: boolean
  value: true
  default: true
  summary: environmentService.isBuilt (reference; remote-server owns it).
  sources:
  - src/vs/platform/environment/common/environmentService.ts:231
  attributes:
    boundary: true
    owner: remote-server
- id: product-quality
  type: string
