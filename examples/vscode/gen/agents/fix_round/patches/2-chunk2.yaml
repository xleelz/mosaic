# Chunk 2 of the trivial-interface fix (agents area). Applied by /tmp/agr2/apply.py.
# Depends on sessions-service.get-active-session (defined in 2-chunk1.yaml) and
# language-model-tools-service.register-tool (boundary in 10-a3.yaml).
patches:
- iface: extension-mcp-discovery.start
  summary: 'start(): the mcpServerDefinitionProviders handler. Each added extension''s contributions are validated (non-empty id and label); a collection without `when` registers at once as a lazy, Trusted
    collection ''<extension key>/<id>'', one with `when` registers only while the clause holds.'
  request:
    type: object
    properties:
      contributions:
        type: array
        description: added extension point users, one entry per (extension, collection) contribution
        default:
        - extension_id: GitHub.copilot-chat
          id: github
          label: GitHub
          when: ''
        examples:
        - - extension_id: GitHub.copilot-chat
            id: github
            label: GitHub
            when: ''
  behavior:
  - set:
      vars.registered: []
  - title: 'setHandler: for each added extension, skip it if _validate fails, else register each collection'
    source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:88-107
    foreach: = input.contributions
    as: coll
    steps:
    - if: '!has(vars.coll.id) || vars.coll.id.trim() == '''' || !has(vars.coll.label) || vars.coll.label.trim() == '''''
      then:
      - title: '_validate: id and label must be non-empty strings, else the extension''s collections are skipped'
        source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:180-196
        set:
          vars.skipped: = vars.coll
      else:
      - if: has(vars.coll.when) && vars.coll.when != ''
        then:
        - title: A collection with a when clause is registered only while the context matches (_registerConditionalCollection)
          source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:145-173
          set:
            vars.conditional: = vars.coll.id
        else:
        - title: '_registerCollection: id = ExtensionIdentifier.toKey(extension) + ''/'' + id, lazy, Trusted, workspace-scoped'
          source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:111-142
          set:
            vars.registered: = vars.registered + [vars.coll.extension_id.lowerAscii() + '/' + vars.coll.id]
  - set:
      state.collections: = vars.registered
  - return:
      collections: = size(vars.registered)
- iface: get-theme-colors-tool-contribution.start
  behavior:
  - title: 'observableConfigValue(chat.agentSessions.appearanceTools.enabled): the tool is registered only while the setting is on'
    source: src/vs/sessions/contrib/chat/browser/getThemeColorsTool.ts:118-125
    if: config['chat-agent-sessions-appearance-tools-enabled'] == true
    then:
    - title: 'toolsService.registerTool(getToolData(), tool): the internal vscode_getThemeColors tool'
      source: src/vs/sessions/contrib/chat/browser/getThemeColorsTool.ts:59-70
      call: language-model-tools-service.register-tool
      input:
        tool_id: vscode_getThemeColors
        reference_name: getThemeColors
        source: internal
        server_id: ''
        has_impl: true
        needs_confirmation: false
  - return:
      started: true
- iface: git-hub-file-system-provider-contribution.start
  behavior:
  - title: fileService.registerProvider(github-remote-file, GitHubFileSystemProvider)
    source: src/vs/sessions/contrib/fileTreeView/browser/fileTreeView.contribution.ts:30-31
    set:
      vars.scheme: github-remote-file
  - title: 'searchService.registerSearchResultProvider(github-remote-file, file, FileSystemFileSearchProvider): without it file searches on this scheme wait forever'
    source: src/vs/sessions/contrib/fileTreeView/browser/fileTreeView.contribution.ts:32-34
    call: search-service.register-search-result-provider
    input:
      scheme: = vars.scheme
      type: file
  - return:
      started: true
- iface: git-hub-pull-request-polling-contribution.start
  behavior:
  - title: 'activeSessionResourceObs: the active session''s resource, unless there is none or it is archived'
    source: src/vs/sessions/contrib/github/browser/github.contribution.ts:80-87
    call: sessions-service.get-active-session
    as: active
  - if: vars.active.value.session_id != ''
    then:
    - title: With an active session the PR, CI and review-thread models refresh with visible priority and CI/review polling starts
      source: src/vs/sessions/contrib/github/browser/github.contribution.ts:89-128
      set:
        vars.polling: = vars.active.value.session_id
  - title: '_onDidChangeSessions({added: getSessions()}): a per-session poller for every known session'
    source: src/vs/sessions/contrib/github/browser/github.contribution.ts:130-131
    call: sessions-management-service.get-sessions
    as: all
  - return:
      started: true
- iface: is-agent-host-session-context-contribution.start
  behavior:
  - call: sessions-service.get-active-session
    as: active
  - if: vars.active.value.session_id == ''
    then:
    - title: 'No active session: sessions.isAgentHostSession is false'
      source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostSkillButtons.ts:50-53
      call: context-key-service.set-context
      input:
        key: sessions.isAgentHostSession
        value: false
    - return:
        started: true
  - title: getProvider(activeSession.providerId)
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostSkillButtons.ts:54
    call: sessions-providers-service.get-provider
    input:
      id: = vars.active.value.session_id.split('/')[0]
    as: prov
  - title: true iff the provider is a BaseAgentHostSessionsProvider (local or remote agent host, not the Copilot cloud 'default' provider)
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostSkillButtons.ts:55
    call: context-key-service.set-context
    input:
      key: sessions.isAgentHostSession
      value: = !has(vars.prov.value.missing) && vars.active.value.session_id.split('/')[0] != 'default'
  - return:
      started: true
- iface: mobile-chat-input-config-picker-contribution.start
  behavior:
  - title: 'autorun: the active session''s provider decides the combined config picker'
    source: src/vs/sessions/contrib/providers/agentHost/browser/mobile/mobileChatInputConfigPicker.ts:393-397
    call: sessions-service.get-active-session
    as: active
  - if: vars.active.value.session_id == ''
    then:
    - title: 'No active session: sessionUsesCombinedConfigPicker is false'
      source: src/vs/sessions/contrib/providers/agentHost/browser/mobile/mobileChatInputConfigPicker.ts:396
      call: context-key-service.set-context
      input:
        key: sessionUsesCombinedConfigPicker
        value: false
    else:
    - call: sessions-providers-service.get-provider
      input:
        id: = vars.active.value.session_id.split('/')[0]
      as: prov
    - title: usesCombinedNewSessionConfigPicker is true on agent host providers (BaseAgentHostSessionsProvider)
      source: src/vs/sessions/contrib/providers/agentHost/browser/baseAgentHostSessionsProvider.ts:4210
      call: context-key-service.set-context
      input:
        key: sessionUsesCombinedConfigPicker
        value: = !has(vars.prov.value.missing) && vars.active.value.session_id.split('/')[0] != 'default'
  - title: Registers the mobile config picker on the automations dialog and new-session toolbars
    source: src/vs/sessions/contrib/providers/agentHost/browser/mobile/mobileChatInputConfigPicker.ts:399-409
    return:
      started: true
- iface: mcp-commands.cmd-workbench-mcp-agenthostserveroptions
  request:
    type: object
    properties:
      agent_host_session:
        type: string
        default: ''
        examples:
        - agent-host-copilot:/9f2c4e1a
      customization_id:
        type: string
        default: ''
        examples:
        - github
  behavior:
  - if: input.customization_id == ''
    then:
    - title: 'getMcpServers(agentHostSession).find(id): no such server, nothing to show'
      source: src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:493-496
      return:
        ok: false
  - title: Quick pick of Start/Stop, enablement, Authenticate and Show Output for the agent host server
    source: src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:552-558
    choice: action
    default: show_output
    options:
      show_output:
      - title: 'showOutput: the server''s diagnostics channel'
        source: src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:560-563
        set:
          vars.action: showOutput
      start:
      - title: start/stop runs the agent host lifecycle action
        source: src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:570-573
        set:
          vars.action: start
      dismissed:
      - title: 'No pick: return'
        source: src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:556-558
        return:
          ok: false
  - return:
      ok: true
- iface: mcp-commands.cmd-workbench-mcp-browseresources
  request:
    type: object
    properties:
      server_id:
        type: string
        default: ''
        examples:
        - github
  behavior:
  - if: input.server_id != ''
    then:
    - title: 'With a server: McpResourceQuickPick(server).pick()'
      source: src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:1718-1719
      call: quick-input-service.pick
      input:
        items: []
    else:
    - title: 'Without a server: quickAccess.show(McpResourceQuickAccess.PREFIX = ''mcpr '')'
      source: src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:1720-1722
      call: quick-input-service.quick-access-show
      input:
        prefix: 'mcpr '
  - return:
      ok: true
- iface: mcp-gallery-manifest-ipc-service.get-mcp-gallery-manifest
  sources:
  - src/vs/platform/mcp/common/mcpGalleryManifestServiceIpc.ts:45-48
  - src/vs/platform/mcp/common/mcpGalleryManifestServiceIpc.ts:25-27
  behavior:
  - if: state.manifest == null
    then:
    - title: _mcpGalleryManifest ?? null; the status getter says Unavailable without a manifest
      source: src/vs/platform/mcp/common/mcpGalleryManifestServiceIpc.ts:25-27
      return:
        manifest: null
        status: unavailable
  - title: After the barrier opens, the manifest the main process set (status Available)
    source: src/vs/platform/mcp/common/mcpGalleryManifestServiceIpc.ts:45-48
    return:
      manifest: = state.manifest
      status: available
- iface: mission-control-agent-host-contribution.start
  behavior:
  - title: 'updateProjects: recent workspaces, filtered by sessions.chat.unifiedWorkspacePicker.enabled, become the shared project folders'
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/missionControlAgentHostContribution.ts:60-63
    call: configuration-service.get-value
    input:
      key: sessions.chat.unifiedWorkspacePicker.enabled
    as: unified
  - title: Reconcile on configured entries, connections and configuration changes; auto connections on inventory changes; then refresh the inventory
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/missionControlAgentHostContribution.ts:70-90
    set:
      vars.reconciled: true
  - return:
      started: true
- iface: new-session-action-view-item-contribution.start
  behavior:
  - title: 'updateTitleBarTreatment: dev builds (not built) always show the titlebar New Session button'
    source: src/vs/sessions/contrib/sessions/browser/sessionsActions.ts:1644-1649
    if: config['environment-is-built'] != true
    then:
    - call: context-key-service.set-context
      input:
        key: sessionsTitleBarNewSessionEnabled
        value: true
    else:
    - title: 'Built: the experiment treatment, defaulting to quality === ''insider'' when unassigned'
      source: src/vs/sessions/contrib/sessions/browser/sessionsActions.ts:1650-1651
      call: context-key-service.set-context
      input:
        key: sessionsTitleBarNewSessionEnabled
        value: = config['product-quality'] == 'insider'
  - title: Registers the New Session view item on the sidebar header and the titlebar
    source: src/vs/sessions/contrib/sessions/browser/sessionsActions.ts:1599-1610
    return:
      started: true
- iface: new-session-view-tour-contribution.start
  behavior:
  - title: 'AgentsWindowUsage.createdSessionCount: agentSessions.telemetry.totalSessions (application scope, 0)'
    source: src/vs/workbench/contrib/chat/common/agentsWindowUsage.ts:15-17
    call: storage-service.get
    input:
      key: agentSessions.telemetry.totalSessions
      scope: application
      fallback_value: '0'
    as: total
  - if: int(vars.total.value.value) > 3
    then:
    - title: '_isEligibleUser: only users with at most MAX_REQUESTS_FOR_TOUR (3) created sessions are nudged'
      source: src/vs/sessions/contrib/onboardingTours/browser/newSessionViewTourContribution.ts:108-116
      return:
        started: true
  - title: 'Eligible: watch the new-session view and arm the picker-ready check'
    source: src/vs/sessions/contrib/onboardingTours/browser/newSessionViewTourContribution.ts:90-105
    set:
      vars.armed: true
  - return:
      started: true
- iface: new-session-view-v2-tour-contribution.start
  behavior:
  - title: 'enabledByDefault = productService.quality === ''insider'': default variation workspaceAndModel, else the experiment treatment'
    source: src/vs/sessions/contrib/onboardingTours/browser/newSessionViewV2TourContribution.ts:39
    if: config['product-quality'] == 'insider'
    then:
    - set:
        vars.default_variation: workspaceAndModel
    else:
    - set:
        vars.default_variation: default
  - title: 'NewSessionViewTourTrigger: usage gate on created sessions'
    source: src/vs/workbench/contrib/chat/common/agentsWindowUsage.ts:15-17
    call: storage-service.get
    input:
      key: agentSessions.telemetry.totalSessions
      scope: application
      fallback_value: '0'
    as: total
  - if: int(vars.total.value.value) > 1
    then:
    - title: '_isEligibleUser: more than MAX_REQUESTS_FOR_TOUR (1) created sessions, the trigger never arms'
      source: src/vs/sessions/contrib/onboardingTours/browser/newSessionViewTourTrigger.ts:59-65
      return:
        started: true
  - return:
      started: true
- iface: new-session-view-v3-tour-contribution.start
  behavior:
  - title: 'NewSessionViewTourTrigger: AgentsWindowUsage.createdSessionCount'
    source: src/vs/workbench/contrib/chat/common/agentsWindowUsage.ts:15-17
    call: storage-service.get
    input:
      key: agentSessions.telemetry.totalSessions
      scope: application
      fallback_value: '0'
    as: total
  - if: int(vars.total.value.value) > 1
    then:
    - title: '_isEligibleUser: more than MAX_REQUESTS_FOR_TOUR (1) created sessions, the trigger never arms'
      source: src/vs/sessions/contrib/onboardingTours/browser/newSessionViewTourTrigger.ts:59-65
      return:
        started: true
  - title: 'Eligible: re-check readiness (restore complete, new-session view open, signed in, workspace picker visible) on every context change'
    source: src/vs/sessions/contrib/onboardingTours/browser/newSessionViewTourTrigger.ts:40-56
    set:
      vars.armed: true
  - return:
      started: true
- iface: open-agents-window-command.register
  sources:
  - src/vs/sessions/sessions.desktop.main.ts:26
  - src/vs/sessions/contrib/openAgentsWindow/electron-browser/openAgentsWindowCommand.ts:12-19
  behavior:
  - title: CommandsRegistry.registerCommand(workbench.action.openAgentsWindow, ...)
    source: src/vs/sessions/contrib/openAgentsWindow/electron-browser/openAgentsWindowCommand.ts:12-19
    call: commands-registry.register-command
    input:
      command_id: workbench.action.openAgentsWindow
      handler: open-agents-window-command.cmd-workbench-action-openagentswindow
  - return:
      ok: true
- iface: register-chat-debug-view-contribution.start
  behavior:
  - if: config['product-quality'] == 'stable'
    then:
    - title: Stable builds keep the chat debug view where it is
      source: src/vs/sessions/contrib/chatDebug/browser/chatDebug.contribution.ts:31-33
      return:
        started: true
  - title: Move the copilot-chat debug view now, or when it registers later
    source: src/vs/sessions/contrib/chatDebug/browser/chatDebug.contribution.ts:35-53
    set:
      vars.moved: true
  - return:
      started: true
- iface: remote-agent-host-terminal-contribution.start
  behavior:
  - title: '_reconcileRemote: the connected remote agent hosts'
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/remoteAgentHostTerminal.contribution.ts:28-31
    call: agents-window-remote-agent-host-service.get-connections
    as: conns
  - title: Each connected host gets a terminal entry (name or address)
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/remoteAgentHostTerminal.contribution.ts:39-46
    foreach: = vars.conns.value.connections
    as: address
    steps:
    - call: agent-host-terminal-service.register-entry
      input:
        address: = vars.address
  - return:
      started: true
- iface: remote-session-tools-contribution.start
  behavior:
  - title: Registers list_agent_hosts, create_remote_session, send_remote_message and get_remote_session
    source: src/vs/sessions/contrib/remoteSessions/browser/remoteSessions.contribution.ts:46-53
    foreach:
    - tool_id: vscode_list_agent_hosts
      reference_name: list_agent_hosts
    - tool_id: vscode_create_remote_session
      reference_name: create_remote_session
    - tool_id: vscode_send_remote_message
      reference_name: send_remote_message
    - tool_id: vscode_get_remote_session
      reference_name: get_remote_session
    as: tool
    steps:
    - call: language-model-tools-service.register-tool
      input:
        tool_id: = vars.tool.tool_id
        reference_name: = vars.tool.reference_name
        source: internal
        server_id: ''
        has_impl: true
        needs_confirmation: false
  - return:
      started: true
- iface: run-script-contribution.start
  behavior:
  - title: '_activeRunState: undefined without an active session'
    source: src/vs/sessions/contrib/chat/browser/runScriptAction.ts:162-166
    call: sessions-service.get-active-session
    as: active
  - if: vars.active.value.session_id != ''
    then:
    - title: 'With one: the active chat''s session tasks, pinned task, browser URL and pinned browser'
      source: src/vs/sessions/contrib/chat/browser/runScriptAction.ts:168-174
      set:
        vars.run_state: = vars.active.value.session_id
  - title: Registers the run action view item provider and the run actions
    source: src/vs/sessions/contrib/chat/browser/runScriptAction.ts:177-178
    return:
      started: true
- iface: search-editor-empty-state-contribution.start
  request:
    type: object
    properties:
      uri:
        type: string
        default: ''
        examples:
        - search-editor:#0.123
      value_length:
        type: integer
        default: 0
  behavior:
  - if: '!input.uri.startsWith(''search-editor:'')'
    then:
    - title: Only search editor models get the empty state
      source: src/vs/sessions/contrib/search/browser/searchEditorEmptyState.contribution.ts:42-45
      return:
        started: true
  - if: input.value_length != 0
    then:
    - title: A non-empty search editor shows its results
      source: src/vs/sessions/contrib/search/browser/searchEditorEmptyState.contribution.ts:46-49
      return:
        started: true
  - title: 'Empty search editor: the empty-state actions overlay'
    source: src/vs/sessions/contrib/search/browser/searchEditorEmptyState.contribution.ts:51-76
    set:
      vars.empty_state: true
  - return:
      started: true
