patches:
- iface: mcp-server-runtime.start
  behavior:
  - call: mcp-server-runtime.servers-get
    input:
      server_id: = input.server_id
    as: srv
    fill: true
  - call: allowed-mcp-servers-service.check-server-allowed
    input:
      name: = input.server_id
    as: pol
    fill: true
  - if: '!vars.pol.value.allowed'
    then:
    - title: 'Policy block: connection state Error with the policy message'
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:747-757
      call: mcp-server-runtime.servers-update
      input:
        server_id: = input.server_id
        patch:
          state: error
      fill: true
    - return:
        state: error
        message: = vars.pol.value.message
  - title: Activate extensions for the collection
    source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:760-770
    call: extension-service.activate-by-event
    input:
      activation_event: = 'onMcpCollection:' + vars.srv.value.collection
      activation_kind: normal
    fill: true
  - call: mcp-registry.resolve-connection
    as: conn
    input:
      server_id: = input.server_id
      scope: = vars.srv.value.scope
      trust_behavior: = vars.srv.value.trust_behavior
      cache_nonce: = vars.srv.value.cache_nonce
      trusted_at_nonce: = vars.srv.value.trusted_at_nonce
      label: = vars.srv.value.label
      prompt_type: = input.prompt_type
      error_on_user_interaction: = input.error_on_user_interaction
      auto_trust_changes: = input.auto_trust_changes
    fill: true
  - call: mcp-server-runtime.servers-update
    input:
      server_id: = input.server_id
      patch:
        trusted_at_nonce: = vars.conn.value.trusted_at_nonce
    fill: true
  - if: '!vars.conn.value.connected'
    then:
    - title: 'No connection (untrusted, cancelled or launch error already shown): Stopped'
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:798-800
      return:
        state: stopped
        message: ''
  - call: mcp-server-runtime.servers-update
    input:
      server_id: = input.server_id
      patch:
        state: starting
    fill: true
  - call: mcp-server-connection.start
    input:
      server_id: = input.server_id
      transport: = vars.srv.value.transport
    as: cs
    fill: true
  - if: vars.cs.value.state == 'error'
    then:
    - call: mcp-server-runtime.servers-update
      input:
        server_id: = input.server_id
        patch:
          state: error
      fill: true
    - if: input.error_on_user_interaction
      then:
      - title: 'Quiet start: reject UserInteractionRequiredError(''start'')'
        source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:904-906
        fail:
          code: user-interaction-required
          message: 'User interaction required: start'
    - title: 'Interactive start: showInteractiveError (the real promise never settles)'
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:896-911
      return:
        state: error
        message: = vars.cs.value.message
  - call: mcp-server-runtime.servers-update
    input:
      server_id: = input.server_id
      patch:
        state: running
  - title: 'Handler live: the autorun runs _populateLiveData (tools/list), which makes the cache Live'
    source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:603-612
    call: mcp-server-runtime.populate-live-data
    input:
      server_id: = input.server_id
  - return:
      state: running
      message: ''
fixtures:
- id: agents-mcp-servers
  summary: 'one-window-folder with two MCP servers known to McpService: github (user mcp.json, trusted collection) and workspace-db (.vscode/mcp.json, trusted on nonce, never trusted yet). Each server answers
    tools/list from its own catalog (mcp-server tools_by_server).'
  extends:
  - one-window-folder
  state:
    mcp-server-runtime:
      servers:
        github:
          id: github
          label: GitHub
          collection: mcp.config.usrlocal
          collection_label: User
          scope: user
          trust_behavior: trusted
          cache_nonce: n1
          trusted_at_nonce: ''
          state: stopped
          enabled: true
          cache_state: unknown
          transport: ok
          sandbox_enabled: false
          tools:
          - search_issues
          - create_issue
        workspace-db:
          id: workspace-db
          label: Workspace DB
          collection: workspace.dotmcp
          collection_label: Workspace
          scope: workspace
          trust_behavior: trusted-on-nonce
          cache_nonce: n7
          trusted_at_nonce: ''
          state: stopped
          enabled: true
          cache_state: unknown
          transport: ok
          sandbox_enabled: false
          tools:
          - query
    mcp-server:
      tools_by_server:
        github:
        - name: search_issues
          read_only_hint: true
          visibility: model
        - name: create_issue
          read_only_hint: false
          visibility: model
        workspace-db:
        - name: query
          read_only_hint: true
          visibility: model
components:
- id: mcp-language-model-tool-contribution
  name: McpLanguageModelToolContribution
  kind: module
  layer: ai
  parent: agents
  summary: Workbench contribution that registers each enabled server tool with the language model tools service.
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:41
  - src/vs/workbench/contrib/mcp/browser/mcp.contribution.ts:78
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        registered:
          type: object
    initial:
      registered: {}
