patches:
- iface: active-session-failed-ci-checks-context-contribution.start
  behavior:
  - title: 'bindContextKey(hasActiveSessionFailedCIChecks): false while the active session has no pull request CI model'
    source: src/vs/sessions/contrib/changes/browser/checksActions.ts:174-181
    call: context-key-service.set-context
    input:
      key: sessions.hasActiveSessionFailedCIChecks
      value: false
  - title: 'bindContextKey(activeSessionCIFixRequested): false without a CI model'
    source: src/vs/sessions/contrib/changes/browser/checksActions.ts:183-189
    call: context-key-service.set-context
    input:
      key: sessions.activeSessionCIFixRequested
      value: false
  - &id001
    return:
      started: true
- iface: active-session-feedback-context-contribution.start
  behavior:
  - set:
      vars.accepted: 0
    title: Count the accepted feedback items of the active feedback session (none before any feedback is given)
    source: src/vs/sessions/contrib/agentFeedback/browser/agentFeedback.contribution.ts:61-63
  - title: hasActiveSessionAgentFeedback = count > 0
    source: src/vs/sessions/contrib/agentFeedback/browser/agentFeedback.contribution.ts:64
    call: context-key-service.set-context
    input:
      key: agentFeedbackEditor.hasActiveSessionAgentFeedback
      value: = vars.accepted > 0
  - *id001
- iface: active-session-harness-sync-contribution.start
  behavior:
  - &id002
    call: sessions-service.get-active-session
    as: active
  - if: vars.active.value.session_id == ''
    then:
    - title: 'No active session: the harness service keeps its current session'
      source: src/vs/sessions/contrib/sessions/browser/customizationsToolbar.contribution.ts:516-519
      return:
        started: true
  - title: harnessService.setActiveSession(session.resource), re-run when harnesses register later
    source: src/vs/sessions/contrib/sessions/browser/customizationsToolbar.contribution.ts:523-524
    set:
      vars.harness_session: = vars.active.value.session_id
  - *id001
- iface: agent-feedback-pr-review-seeder-contribution.start
  behavior:
  - *id002
  - if: vars.active.value.session_id == '' || !(vars.active.value.session_id.startsWith('local-agent-host') || vars.active.value.session_id.startsWith('agenthost-'))
    then:
    - title: Only an active agent-host session (isAgentHostProviderId) is seeded
      source: src/vs/sessions/contrib/agentFeedback/browser/agentFeedbackPRReviewSeeder.ts:59-62
      return:
        started: true
  - title: Seed feedback from the review comments once the PR review state is Loaded
    source: src/vs/sessions/contrib/agentFeedback/browser/agentFeedbackPRReviewSeeder.ts:63-69
    set:
      vars.seed_session: = vars.active.value.session_id
  - *id001
- iface: agent-host-logger-channel.call
  behavior:
  - if: input.command == 'setLogLevel'
    then:
    - title: 'setLogLevel: a LogLevel sets the global level, otherwise the [resource, level] pair'
      source: src/vs/platform/log/common/logIpc.ts:134
      return:
        ok: true
  - if: input.command == 'getRegisteredLoggers'
    then:
    - title: 'getRegisteredLoggers: the registered loggers with their resources transformed'
      source: src/vs/platform/log/common/logIpc.ts:135
      return:
        ok: true
  - title: Any other command throws
    source: src/vs/platform/log/common/logIpc.ts:138
    fail:
      code: call-not-found
      message: '= ''Call not found: '' + input.command'
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:122-139
  - src/vs/platform/log/common/logIpc.ts:131-139
  summary: 'LoggerChannel.call (agentHostLogger): setLogLevel and getRegisteredLoggers; any other command throws.'
  request:
    type: object
    required:
    - command
    properties:
      command:
        type: string
        examples:
        - setLogLevel
  errors:
  - code: call-not-found
    status: 0
    retryable: false
    summary: 'Call not found: <command>'
- iface: agent-host-readiness-context-contribution.start
  behavior:
  - title: '_update: getAllProviderSessionTypes() over the registered providers'
    source: src/vs/sessions/services/sessions/browser/sessionsManagementService.ts:357-365
    call: sessions-providers-service.providers-query
    as: p
  - title: AgentHostSessionTypesAvailableContext = some session type comes from an agent-host provider
    source: src/vs/sessions/contrib/onboardingTours/browser/agentHostReadinessContext.ts:29-32
    call: context-key-service.set-context
    input:
      key: agentHostSessionTypesAvailable
      value: = vars.p.value.exists(r, (r.id == 'local-agent-host' || r.id.startsWith('agenthost-')) && has(r.session_types) && size(r.session_types) > 0)
  - *id001
- iface: agent-host-session-config-picker-contribution.start
  behavior:
  - title: '_watchProviders(getProviders({includeSessionBackends: true})): watch each provider for picker menu refreshes'
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostSessionConfigPicker.ts:1855
    call: sessions-providers-service.providers-query
    as: p
  - title: Register the mode, approve and permission pickers for new and running sessions
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostSessionConfigPicker.ts:1874-1898
    set:
      vars.watched: = size(vars.p.value)
  - *id001
- iface: agent-merge-context-contribution.start
  behavior:
  - title: 'No active session: state undefined, so enabled is false and the effective actions are the global Agent Merge configuration'
    source: src/vs/sessions/browser/sessionAgentMerge.ts:127-142
    set:
      vars.effective:
        addressReviews: = config['chat-agent-merge-address-reviews']
        fixCI: = config['chat-agent-merge-fix-ci']
        resolveConflicts: = config['chat-agent-merge-resolve-conflicts']
        mergePullRequest: = config['chat-agent-merge-merge-pull-request']
  - title: enabledKey.set(enabled)
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentMergeActions.ts:163
    call: context-key-service.set-context
    input:
      key: sessionAgentMergeEnabled
      value: false
  - title: 'Per-action key: addressReviews'
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentMergeActions.ts:164-166
    call: context-key-service.set-context
    input:
      key: sessionAgentMergeAddressReviews
      value: = vars.effective.addressReviews
  - title: 'Per-action key: fixCI'
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentMergeActions.ts:164-166
    call: context-key-service.set-context
    input:
      key: sessionAgentMergeFixCI
      value: = vars.effective.fixCI
  - title: 'Per-action key: resolveConflicts'
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentMergeActions.ts:164-166
    call: context-key-service.set-context
    input:
      key: sessionAgentMergeResolveConflicts
      value: = vars.effective.resolveConflicts
  - title: mergePullRequestKey.set(effective.mergePullRequest)
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentMergeActions.ts:167
    call: context-key-service.set-context
    input:
      key: sessionAgentMergeMergePullRequest
      value: = vars.effective.mergePullRequest
  - *id001
- iface: agents-window-extension-auto-enablement-telemetry.start
  behavior:
  - if: config['extensions-experimental-agents-window-management'] != true
    then:
    - title: 'Management disabled: no installed candidates, so nothing is logged'
      source: src/vs/sessions/contrib/extensions/browser/agentsWindowExtensionAutoEnablementTelemetry.ts:106-109
      return:
        started: true
  - title: Candidates are non-builtin installed extensions that can or should auto-enable; log the experiment trigger and each newly enabled one
    source: src/vs/sessions/contrib/extensions/browser/agentsWindowExtensionAutoEnablementTelemetry.ts:111-146
    set:
      vars.listening: true
  - *id001
- iface: apply-changes-to-parent-repo-contribution.start
  behavior:
  - *id002
  - title: hasWorktreeAndRepo = !!folder?.gitRepository?.workTreeUri; no session has no folder, so false
    source: src/vs/sessions/contrib/applyCommitsToParentRepo/browser/applyChangesToParentRepo.ts:44-49
    call: context-key-service.set-context
    input:
      key: agentSessionHasWorktreeAndRepository
      value: false
  - *id001
- iface: automations-custom-view-contribution.start
  behavior:
  - title: AutomationsHasItemsContext = automations.length > 0 (none before the automation service loads)
    source: src/vs/sessions/contrib/sessions/browser/views/automationsView.ts:2448-2451
    call: context-key-service.set-context
    input:
      key: automationsHasItems
      value: false
  - if: config['chat-automations-enabled'] == true
    then:
    - title: registerCustomView restores the automations view when ChatAutomationsEnabledContext is set
      source: src/vs/sessions/contrib/sessions/browser/views/automationsView.ts:2453-2459
      set:
        vars.restore: true
    else:
    - title: registerCustomView without restore while automations are disabled
      source: src/vs/sessions/contrib/sessions/browser/views/automationsView.ts:2453-2459
      set:
        vars.restore: false
  - *id001
- iface: changes-activity-contribution.start
  behavior:
  - if: has(input.layout) && input.layout == 'mobile'
    then:
    - title: 'The Session Activity Bar exists only in the desktop layout: the mobile layout returns before registering anything'
      source: src/vs/sessions/contrib/changes/browser/changesActivity.ts:188-191
      return:
        started: false
  - title: 'SeenChangesStore.load: read the seen change stats from application storage'
    source: src/vs/sessions/contrib/changes/browser/changesActivity.ts:128-133
    call: storage-service.get
    input:
      key: sessions.changesActivity.seenChanges
      scope: application
    as: seen
  - title: Badge the Changes tab when the active chat has unseen changes
    source: src/vs/sessions/contrib/changes/browser/changesActivity.ts:221-238
    set:
      vars.seen_loaded: = vars.seen.value.value != null
  - *id001
  request: &id003
    type: object
    properties:
      layout:
        type: string
        enum:
        - desktop
        - mobile
        default: desktop
        description: 'IAgentWorkbenchLayoutService.agentWorkbenchLayout: mobile only for a phone-sized web viewport (workbenchFactory.ts:15-17)'
- iface: changes-view-actions-contribution.start
  behavior:
  - title: 'HasChanges: false with no active session'
    source: src/vs/sessions/contrib/changes/browser/changesViewActions.ts:83-90
    call: context-key-service.set-context
    input:
      key: sessions.hasChanges
      value: false
  - title: 'ChangesViewService: initial view mode from workspace storage (tree only if stored as tree)'
    source: src/vs/sessions/contrib/changes/browser/changesViewService.ts:427-429
    call: storage-service.get
    input:
      key: changesView.viewMode
      scope: workspace
    as: mode
  - title: ChangesContextKeys.ViewMode follows viewModeObs
    source: src/vs/sessions/contrib/changes/browser/changesViewActions.ts:92-94
    call: context-key-service.set-context
    input:
      key: sessions.changesViewMode
      value: '= vars.mode.value.value == ''tree'' ? ''tree'' : ''list'''
  - title: 'DesktopDiffEditorInputActiveContext: the active editor is not a DiffEditorInput'
    source: src/vs/sessions/contrib/changes/browser/changesViewActions.ts:96-97
    call: context-key-service.set-context
    input:
      key: agentSessionsDesktopDiffEditorInputActive
      value: false
  - *id001
- iface: changes-view-contribution.start
  behavior:
  - if: has(input.layout) && input.layout == 'mobile'
    then:
    - title: 'Mobile layout: register the Changes view with ChangesViewPane'
      source: src/vs/sessions/contrib/changes/browser/changes.contribution.ts:119-131
      set:
        vars.ctor: ChangesViewPane
    else:
    - title: 'Desktop layout: register the Changes view with DesktopChangesViewPane'
      source: src/vs/sessions/contrib/changes/browser/changes.contribution.ts:119-131
      set:
        vars.ctor: DesktopChangesViewPane
  - *id001
  request: *id003
- iface: desktop-changes-editor-contribution.start
  behavior:
  - if: has(input.layout) && input.layout == 'mobile'
    then:
    - title: 'The session changes editor is registered only in the desktop layout: the mobile layout returns before registering anything'
      source: src/vs/sessions/contrib/changes/browser/changes.contribution.ts:53-55
      return:
        started: false
  - title: Register the SessionChangesEditor pane and its input serializer
    source: src/vs/sessions/contrib/changes/browser/changes.contribution.ts:57-65
    set:
      vars.registered: true
  - *id001
  request: *id003
- iface: changeset-operations-action-controller-contribution.start
  behavior:
  - title: 'Reviewed files: the active session changes marked reviewed (none yet); the optimistic client list is reset'
    source: src/vs/sessions/contrib/changes/browser/changesActions.ts:321-333
    set:
      vars.reviewed: []
  - title: SessionChangesReviewedFilesContext = client list ?? agent-host list
    source: src/vs/sessions/contrib/changes/browser/changesActions.ts:335-337
    call: context-key-service.set-context
    input:
      key: sessions.changesReviewedFiles
      value: = vars.reviewed
  - *id001
- iface: changes-header-changeset-operations-action-contribution.start
  behavior:
  - *id002
  - if: vars.active.value.session_id == ''
    then:
    - title: 'No active session: no header changeset operations are registered'
      source: src/vs/sessions/contrib/changes/browser/changesActions.ts:474-478
      return:
        started: true
  - title: Untitled sessions expose the uncommitted changeset operations, others only the commit operation
    source: src/vs/sessions/contrib/changes/browser/changesActions.ts:480-498
    set:
      vars.header_session: = vars.active.value.session_id
  - *id001
- iface: chat-automations-enabled-context-contribution.start
  behavior:
  - title: ChatAutomationsEnabledContext = chat.automations.enabled === true, refreshed on change
    source: src/vs/sessions/contrib/automations/browser/automations.contribution.ts:67-69
    call: context-key-service.set-context
    input:
      key: chatAutomationsEnabled
      value: = config['chat-automations-enabled'] == true
  - *id001
- iface: cloud-sandbox-agent-host-contribution.start
  behavior:
  - if: '!(config[''chat-agent-host-cloud-sandbox-enabled''] == true && config[''chat-remote-agent-hosts-enabled''] == true)'
    then:
    - title: '_isEnabled is false (isCloudSandboxEnabled needs both settings): clear the cloud sandbox host group'
      source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/cloudSandboxAgentHostContribution.ts:114-116
      return:
        started: true
  - title: 'Enabled: register the cloud sandbox host group, then discover and seed sessions'
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/cloudSandboxAgentHostContribution.ts:117-121
    set:
      vars.host_group: cloud-sandbox
  - *id001
- iface: customizations-toolbar-contribution.start
  behavior:
  - title: Active harness of the customization harness service (getChatSessionType of the active session)
    source: src/vs/sessions/contrib/sessions/browser/customizationsToolbar.contribution.ts:381-384
    set:
      vars.harness: '= has(input.active_harness) ? input.active_harness : '''''
  - title: 'Per-section visibility key: HarnessSettings only for Codex, Canvases only for Copilot CLI, others always'
    source: src/vs/sessions/contrib/sessions/browser/customizationsToolbar.contribution.ts:385-395
    foreach:
    - plugins
    - canvases
    - mcpServers
    - skills
    - instructions
    - agents
    - hooks
    - tools
    - extensions
    - harnessSettings
    as: section
    steps:
    - call: context-key-service.set-context
      input:
        key: = 'sessionsCustomizationSectionVisible.' + vars.section
        value: '= vars.section == ''harnessSettings'' ? vars.harness == ''agent-host-codex'' : (vars.section == ''canvases'' ? (vars.harness == ''agent-host-copilotcli'' || vars.harness.endsWith(''copilotcli''))
          : true)'
  - *id001
  request:
    type: object
    properties:
      active_harness:
        type: string
        examples:
        - agent-host-copilotcli
        description: ICustomizationHarnessService.activeHarness
- iface: desktop-add-tab-contribution.start
  behavior:
  - if: has(input.layout) && input.layout == 'mobile'
    then:
    - title: 'The new file, browser, search and changes tab actions are registered only in the desktop layout: the mobile layout returns before registering anything'
      source: src/vs/sessions/contrib/editor/browser/editor.contribution.ts:127-129
      return:
        started: false
  - title: Register the new-tab actions and the session activity bar tab entries
    source: src/vs/sessions/contrib/editor/browser/editor.contribution.ts:131-136
    set:
      vars.registered: true
  - *id001
  request: *id003
- iface: desktop-empty-file-editor-contribution.start
  behavior:
  - if: has(input.layout) && input.layout == 'mobile'
    then:
    - title: 'The empty file editor is registered only in the desktop layout: the mobile layout returns before registering anything'
      source: src/vs/sessions/contrib/editor/browser/emptyFileEditor.contribution.ts:44-46
      return:
        started: false
  - title: Register the EmptyFileEditor pane and its serializer
    source: src/vs/sessions/contrib/editor/browser/emptyFileEditor.contribution.ts:48-60
    set:
      vars.registered: true
  - *id001
  request: *id003
- iface: agent-host-agent-picker-contribution.start
  behavior:
  - *id002
  - if: vars.active.value.session_id == ''
    then:
    - title: _syncChatInputMode and _initAgent return without an active session
      source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostAgentPicker.ts:360-363
      return:
        started: true
  - title: Sync the chat input mode and the agent from the active session mode
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostAgentPicker.ts:298-305
    set:
      vars.synced: = vars.active.value.session_id
  - *id001
configs:
- id: chat-agent-merge-address-reviews
  type: boolean
  value: true
  default: true
  summary: 'chat.agentMerge.addressReviews: Agent Merge may address review threads (global default for sessions).'
  sources:
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:159-166
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:138
  attributes:
    key: chat.agentMerge.addressReviews
- id: chat-agent-merge-fix-ci
  type: boolean
  value: true
  default: true
  summary: 'chat.agentMerge.fixCI: Agent Merge may fix failed required CI checks.'
  sources:
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:167-174
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:138
  attributes:
    key: chat.agentMerge.fixCI
- id: chat-agent-merge-resolve-conflicts
  type: boolean
  value: true
  default: true
  summary: 'chat.agentMerge.resolveConflicts: Agent Merge may update branches or resolve conflicts.'
  sources:
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:175-182
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:138
  attributes:
    key: chat.agentMerge.resolveConflicts
- id: chat-agent-merge-merge-pull-request
  type: string
  value: never
  default: never
  summary: 'chat.agentMerge.mergePullRequest: always, ifUnchanged or never.'
  sources:
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:183-196
  - src/vs/platform/agentHost/common/agentHostStarter.config.contribution.ts:138
  attributes:
    key: chat.agentMerge.mergePullRequest
- id: extensions-experimental-agents-window-management
  type: boolean
  value: true
  default: true
  summary: 'extensions.experimental.agentsWindowManagement: default is product.quality !== ''stable''; product.json sets no quality in a build from source, so true.'
  sources:
  - src/vs/sessions/contrib/extensions/browser/extensions.contribution.ts:35-42
  - src/vs/sessions/contrib/extensions/browser/extensions.contribution.ts:23
  attributes:
    key: extensions.experimental.agentsWindowManagement
- id: chat-agent-host-cloud-sandbox-enabled
  type: boolean
  value: false
  default: false
  summary: chat.agentHost.cloudSandbox.enabled (reference; registered by chat).
  sources:
  - src/vs/workbench/contrib/chat/browser/remoteAgentHost/remoteAgentHost.contribution.ts:114-120
  attributes:
    key: chat.agentHost.cloudSandbox.enabled
    boundary: true
    owner: chat
- id: chat-remote-agent-hosts-enabled
  type: boolean
  value: true
  default: true
  summary: chat.remoteAgentHostsEnabled (reference; registered by chat).
  sources:
  - src/vs/workbench/contrib/chat/browser/remoteAgentHost/remoteAgentHost.contribution.ts:67-72
  attributes:
    key: chat.remoteAgentHostsEnabled
    boundary: true
    owner: chat
interfaces:
- component: sessions-service
  name: get-active-session
  kind: function
  summary: 'activeSession: the active session of the Agents window, if any.'
  sources:
  - src/vs/sessions/services/sessions/browser/sessionsService.ts:483
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      session_id:
        type: string
  behavior:
  - return:
      session_id: '= has(state.active) ? state.active : '''''
scenarios:
- id: agents-agent-host-log-forward-happy
  flow: agents-agent-host-log-forward
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    command: setLogLevel
  expect:
  - result.ok
  - result.value.ok
- id: agents-agent-host-log-forward-get-loggers
  flow: agents-agent-host-log-forward
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    command: getRegisteredLoggers
  expect:
  - result.ok
- id: agents-agent-host-log-forward-unknown-command
  flow: agents-agent-host-log-forward
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    command: log
  expect:
  - '!result.ok'
  - result.error.code == 'call-not-found'
- id: agents-contribs-mobile-layout
  name: Desktop-only contributions return early in the mobile layout
  fixtures:
  - agents-seed
  steps:
  - interface: changes-activity-contribution.start
    caller: user
    input:
      layout: mobile
    as: changes_activity_contribution
  - interface: changes-view-contribution.start
    caller: user
    input:
      layout: mobile
    as: changes_view_contribution
  - interface: desktop-changes-editor-contribution.start
    caller: user
    input:
      layout: mobile
    as: desktop_changes_editor_contribution
  - interface: desktop-add-tab-contribution.start
    caller: user
    input:
      layout: mobile
    as: desktop_add_tab_contribution
  - interface: desktop-empty-file-editor-contribution.start
    caller: user
    input:
      layout: mobile
    as: desktop_empty_file_editor_contribution
  expect:
  - '!steps.changes_activity_contribution.result.value.started'
  - '!steps.desktop_add_tab_contribution.result.value.started'
  - '!steps.desktop_empty_file_editor_contribution.result.value.started'
  - '!steps.desktop_changes_editor_contribution.result.value.started'
  - steps.changes_view_contribution.result.value.started
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''storage-service.get'' && e.input.key == ''sessions.changesActivity.seenChanges'')'
- id: agents-contribs-active-session
  name: Active-session contributions act once a session is active
  fixtures:
  - agents-seed
  state:
    sessions-service:
      visible:
      - local-agent-host/9f2c4e1a
      active: local-agent-host/9f2c4e1a
  steps:
  - interface: active-session-harness-sync-contribution.start
    caller: user
    as: active_session_harness_sync_contribution
  - interface: agent-feedback-pr-review-seeder-contribution.start
    caller: user
    as: agent_feedback_pr_review_seeder_contribution
  - interface: changes-header-changeset-operations-action-contribution.start
    caller: user
    as: changes_header_changeset_operations_action_contribution
  - interface: agent-host-agent-picker-contribution.start
    caller: user
    as: agent_host_agent_picker_contribution
  expect:
  - steps.active_session_harness_sync_contribution.result.ok
  - steps.agent_feedback_pr_review_seeder_contribution.result.ok
  - steps.changes_header_changeset_operations_action_contribution.result.ok
  - steps.agent_host_agent_picker_contribution.result.ok
  - trace.exists(e, e.type == 'call.end' && e.interface == 'sessions-service.get-active-session' && e.output.session_id == 'local-agent-host/9f2c4e1a')
- id: agents-contribs-settings-variants
  name: Contribution startup follows the automations, cloud sandbox, extension management and harness settings
  fixtures:
  - agents-seed
  config:
    chat-automations-enabled: true
    chat-agent-host-cloud-sandbox-enabled: true
    extensions-experimental-agents-window-management: false
  steps:
  - interface: chat-automations-enabled-context-contribution.start
    caller: user
    as: auto
  - interface: automations-custom-view-contribution.start
    caller: user
    as: view
  - interface: cloud-sandbox-agent-host-contribution.start
    caller: user
    as: sandbox
  - interface: agents-window-extension-auto-enablement-telemetry.start
    caller: user
    as: ext
  - interface: customizations-toolbar-contribution.start
    caller: user
    input:
      active_harness: agent-host-codex
    as: toolbar
  expect:
  - steps.auto.result.ok && steps.view.result.ok && steps.sandbox.result.ok && steps.ext.result.ok && steps.toolbar.result.ok
  - state['context-key-service'].values['chatAutomationsEnabled'] == true
  - state['context-key-service'].values['sessionsCustomizationSectionVisible.harnessSettings'] == true
  - state['context-key-service'].values['sessionsCustomizationSectionVisible.canvases'] == false
