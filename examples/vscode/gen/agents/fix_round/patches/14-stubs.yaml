patches:
- iface: chat-service.send-request
  request:
    type: object
    required:
    - session_resource
    - message
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      message:
        type: string
        examples:
        - Explain what src/main.ts does
      location:
        type: string
        default: panel
      queue:
        type: string
        default: ''
        enum:
        - ''
        - queued
        - steering
      agent_id_silent:
        type: string
        default: ''
      attached_files:
        type: array
        items:
          type: object
          properties:
            resource:
              type: string
            kind:
              type: string
        default: []
        description: 'options.attachedContext: the attached variable entries'
      user_selected_model_id:
        type: string
        default: ''
      mode:
        type: string
        default: ''
        enum:
        - ''
        - ask
        - edit
        - agent
        description: options.modeInfo.kind; '' when the caller passes no modeInfo (getDefaultAgent then uses ask)
  response:
    type: object
    properties:
      kind:
        type: string
        enum:
        - sent
        - queued
        - rejected
      reason:
        type: string
      request_id:
        type: string
      agent_id:
        type: string
  errors:
  - code: unknown-session
    status: 0
    retryable: false
