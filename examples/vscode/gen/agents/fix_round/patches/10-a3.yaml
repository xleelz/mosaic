interfaces:
- component: mcp-server
  name: tools-list
  kind: rpc
  summary: tools/list on the server (McpServerRequestHandler.listTools, paginated). The server's tool catalog is world data of the external server, seeded per definition id.
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpServerRequestHandler.ts:510-511
  request:
    type: object
    properties:
      server_id:
        type: string
        examples:
        - github
  response:
    type: object
    properties:
      tools:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            read_only_hint:
              type: boolean
            visibility:
              type: string
              enum:
              - model
              - app
  behavior:
  - if: '!has(state.tools_by_server) || !(input.server_id in state.tools_by_server)'
    then:
    - return:
        tools: []
  - return:
      tools: = state.tools_by_server[input.server_id]
- component: mcp-server-runtime
  name: populate-live-data
  kind: function
  summary: 'McpServer._populateLiveData: once a handler is live, list the server''s tools (only if it advertises the tools capability), store them as the server''s tools with the live cache nonce, and notify
    tool observers.'
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpServer.ts:1224-1260
  - src/vs/workbench/contrib/mcp/common/mcpServer.ts:603-612
  request:
    type: object
    required:
    - server_id
    properties:
      server_id:
        type: string
        examples:
        - github
      tools_capability:
        type: boolean
        default: true
  response:
    type: object
    properties:
      tools:
        type: array
  behavior:
  - if: has(input.tools_capability) && !input.tools_capability
    then:
    - title: 'No tools capability: the tool promise resolves to []'
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:1228-1231
      set:
        vars.listed: []
    else:
    - title: 'updateTools: handler.listTools sends tools/list'
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:1228-1231
      call: mcp-server.tools-list
      input:
        server_id: = input.server_id
      as: tl
    - set:
        vars.listed: = vars.tl.value.tools
  - title: '_setServerTools: the listed tools become the server''s tools (primitive cache stored with the nonce), so cacheState turns Live'
    source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:1178-1187
    call: mcp-server-runtime.servers-update
    input:
      server_id: = input.server_id
      patch:
        tools: = vars.listed.map(t, t.name)
        tool_defs: = vars.listed
        cache_state: live
  - title: 'server.tools changes: the autorun in McpLanguageModelToolContribution._syncTools re-reads it'
    source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:111-112
    publish: mcp-server-runtime.on-did-change-tools
    input:
      server_id: = input.server_id
    delivery: sync
  - return:
      tools: = vars.listed.map(t, t.name)
- component: mcp-server-runtime
  name: on-did-change-tools
  kind: event
  summary: The server's tools observable changed (cached or live).
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpServer.ts:1178-1187
  request:
    type: object
    properties:
      server_id:
        type: string
        examples:
        - github
- component: mcp-language-model-tool-contribution
  name: sync-tools
  kind: function
  summary: '_syncTools for one server: skip disabled servers and app-only tools; register each Model-visible tool with ILanguageModelToolsService.registerTool and an McpToolImplementation, keyed mcp_<server
    label>_<tool name>.'
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:106-173
  subscribe:
  - mcp-server-runtime.on-did-change-tools
  request:
    type: object
    required:
    - server_id
    properties:
      server_id:
        type: string
        examples:
        - github
  response:
    type: object
    properties:
      registered:
        type: array
  behavior:
  - call: mcp-server-runtime.servers-get
    input:
      server_id: = input.server_id
    as: srv
  - if: '!vars.srv.value.enabled'
    then:
    - title: Disabled servers don't register their tools
      source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:62-65
      return:
        registered: []
  - set:
      vars.defs: '= has(vars.srv.value.tool_defs) ? vars.srv.value.tool_defs : vars.srv.value.tools.map(n, {''name'': n})'
      vars.prefix: = 'mcp_' + vars.srv.value.label.lowerAscii().replace(' ', '_') + '_'
      vars.done: []
  - foreach: = vars.defs
    as: t
    steps:
    - if: has(vars.t.visibility) && vars.t.visibility == 'app'
      then:
      - title: App-only tools are not registered with the language model tools service
        source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:136-139
        set:
          vars.skip: true
      else:
      - set:
          vars.tid: = vars.prefix + vars.t.name.replace('.', '_')
          vars.nc: = !(has(vars.t.read_only_hint) && vars.t.read_only_hint)
      - if: vars.tid in state.registered && state.registered[vars.tid] == vars.nc
        then:
        - title: 'Existing tool with equal tool data: keep it, nothing to re-register'
          source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:162-170
          set:
            vars.same: true
        else:
        - title: registerTool(toolData, McpToolImplementation); id is the server prefix plus the tool name with . replaced by _
          source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:118-121
          call: language-model-tools-service.register-tool
          input:
            tool_id: = vars.tid
            reference_name: = vars.t.name.replace('.', '_')
            source: mcp
            server_id: = input.server_id
            has_impl: true
            needs_confirmation: = vars.nc
        - set:
            state.registered: '= merge(state.registered, {vars.tid: vars.nc})'
      - set:
          vars.done: = vars.done + [vars.tid]
  - return:
      registered: = vars.done
- component: mcp-language-model-tool-contribution
  name: start
  kind: function
  summary: 'Constructor: for every known enabled server, sync its tools now (from the cached tool list, before the server ever starts), and again whenever server.tools changes.'
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:41-99
  - src/vs/workbench/contrib/mcp/browser/mcp.contribution.ts:78
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      tools:
        type: integer
  behavior:
  - call: mcp-server-runtime.servers-query
    as: all
  - set:
      vars.count: 0
  - title: 'autorun over mcpService.servers: _syncTools for each enabled server, registering its cached tools'
    source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:57-97
    foreach: = vars.all.value
    as: row
    steps:
    - call: mcp-language-model-tool-contribution.sync-tools
      input:
        server_id: = vars.row.id
      as: s
    - set:
        vars.count: = vars.count + size(vars.s.value.registered)
  - return:
      tools: = vars.count
