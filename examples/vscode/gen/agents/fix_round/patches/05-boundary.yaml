interfaces:
- component: configuration-service
  name: get-value
  kind: function
  summary: 'IConfigurationService.getValue(key): policy value if any, else the workspace, then user setting, else the registered default (config entity), else undefined.'
  request:
    type: object
    required:
    - key
    properties:
      key:
        type: string
        description: the setting key (files.autoSave)
        examples:
        - files.autoSave
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      override_identifier:
        type: string
        examples:
        - typescript
  response:
    type: object
    properties:
      value: {}
  attributes:
    boundary: true
    owner: platform-core
- component: storage-service
  name: get
  kind: function
  summary: 'IStorageService.get: the cached string for the key in the scope, or the fallback value.'
  request:
    type: object
    required:
    - key
    - scope
    properties:
      key:
        type: string
        examples:
        - workbench.panel.lastIsMaximized
      scope:
        type: string
        enum:
        - application
        - profile
        - workspace
        examples:
        - workspace
      fallback_value:
        type:
        - string
        - 'null'
        default: null
  response:
    type: object
    properties:
      value:
        type:
        - string
        - 'null'
  attributes:
    boundary: true
    owner: platform-core
- component: context-key-service
  name: set-context
  kind: function
  summary: 'AbstractContextKeyService.setContext: store the value in the root context and fire onDidChangeContext when it changed.'
  request:
    type: object
    required:
    - key
    properties:
      key:
        type: string
        examples:
        - myExtension.ready
      value:
        examples:
        - true
  response:
    type: object
    properties:
      changed:
        type: boolean
  attributes:
    boundary: true
    owner: platform-core
components:
- id: context-key-service
  name: ContextKeyService
  summary: Boundary stub (platform-core).
  attributes:
    boundary: true
    owner: platform-core
