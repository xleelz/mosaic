- id: chat-agent-sessions-session-storage-cleanup-suggestion-enabled
  type: boolean
  value: false
  default: false
  summary: 'chat.agentSessions.sessionStorageCleanupSuggestion.enabled: check worktree disk space and suggest cleaning up session storage. product.json does not override it.'
  sources:
  - src/vs/sessions/contrib/chat/browser/chat.contribution.ts:697
  - src/vs/sessions/contrib/chat/browser/chat.contribution.ts:699
  attributes:
    key: chat.agentSessions.sessionStorageCleanupSuggestion.enabled
- id: session-disk-space-initial-check-delay-ms
  type: integer
  value: 10000
  default: 10000
  summary: 'SessionDiskSpaceContribution: the RunOnceScheduler''s default delay before the first disk space check (a code constant, not a setting).'
  sources:
  - src/vs/sessions/contrib/sessionInputBanners/electron-browser/sessionDiskSpace.contribution.ts:31-37
  - src/vs/sessions/contrib/sessionInputBanners/electron-browser/sessionDiskSpace.contribution.ts:46
  attributes:
    key: SessionDiskSpaceContribution scheduler delay
interfaces:
- component: session-disk-space-contribution
  name: check-disk-space
  kind: function
  summary: 'checkDiskSpace: clears the low-disk banner unless the cleanup suggestion is enabled; otherwise collects the sessions'' local worktree paths to probe.'
  sources:
  - src/vs/sessions/contrib/sessionInputBanners/electron-browser/sessionDiskSpace.contribution.ts:48-84
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      checked:
        type: boolean
  behavior:
  - title: isEnabled needs the chat sentiment visible and chat.agentSessions.sessionStorageCleanupSuggestion.enabled; when off the available disk space is cleared
    source: src/vs/sessions/contrib/sessionInputBanners/electron-browser/sessionDiskSpace.contribution.ts:54-57
    if: config['chat-agent-sessions-session-storage-cleanup-suggestion-enabled'] != true
    then:
    - set:
        state.available_disk_space: null
    - return:
        checked: false
  - title: Collect the file-scheme worktree paths of every session's workspace folders
    source: src/vs/sessions/contrib/sessionInputBanners/electron-browser/sessionDiskSpace.contribution.ts:58-63
    call: sessions-management-service.get-sessions
    as: s
  - set:
      state.checked_session_count: = size(vars.s.value.sessions)
  - return:
      checked: true
patches:
- iface: session-archive-nudge-contribution.start
  summary: 'Constructor (registerWorkbenchContribution2): instantiates SessionArchiveNudgeService, which walks the sessions and drops the nudge impressions and dismissals of archived ones.'
  sources:
  - src/vs/sessions/contrib/chat/browser/sessionArchiveNudge.ts:286
  - src/vs/sessions/contrib/chat/browser/sessionArchiveNudge.ts:113-146
  - src/vs/sessions/contrib/chat/browser/chat.contribution.ts:653
  behavior:
  - title: The service constructor's autorun reads every session (getSessions)
    source: src/vs/sessions/contrib/chat/browser/sessionArchiveNudge.ts:137-142
    call: sessions-management-service.get-sessions
    as: s
  - title: An archived session that has an impression or dismissal gets its nudge state cleared
    source: src/vs/sessions/contrib/chat/browser/sessionArchiveNudge.ts:143-146
    set:
      state.cleared_sessions: = vars.s.value.sessions.filter(x, has(x.archived) && x.archived).map(x, x.session_id)
  - return:
      started: true
- iface: session-changes-service.invoke-operation
  summary: 'changeset.invokeOperation(id) on an agent host session: refuses without a connection, then marks the operation running.'
  sources:
  - src/vs/sessions/services/sessions/common/session.ts:627
  - src/vs/sessions/contrib/providers/agentHost/browser/agentHostSessionChangesets.ts:527-562
  - src/vs/sessions/contrib/changes/browser/changesActions.ts:402-421
  errors:
  - code: agent-host-connection-unavailable
    status: 0
    retryable: false
    summary: 'Error: Cannot invoke changeset operation ''<id>'' because the agent host connection is unavailable.'
  behavior:
  - if: has(state.connected) && state.connected == false
    then:
    - title: No agent host connection, so the operation throws
      source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostSessionChangesets.ts:528-531
      fail:
        code: agent-host-connection-unavailable
        message: = "Cannot invoke changeset operation '" + input.operation + "' because the agent host connection is unavailable."
  - title: Mark the operation locally running and send it over the changeset channel
    source: src/vs/sessions/contrib/providers/agentHost/browser/agentHostSessionChangesets.ts:561-562
    set:
      state.operations_run: = state.operations_run + [input.operation]
  - return:
      ok: true
- iface: session-comparison-grid-controller.start
  sources:
  - src/vs/sessions/contrib/sessionComparison/browser/sessionComparisonGridController.ts:36-100
  - src/vs/sessions/contrib/sessionComparison/browser/sessionComparison.contribution.ts:19
  behavior:
  - title: The first autorun finds no comparison among the visible sessions, so the grid is inactive and inputs are not hidden
    source: src/vs/sessions/contrib/sessionComparison/browser/sessionComparisonGridController.ts:55-77
    if: '!has(state.comparisons) || size(state.comparisons) == 0'
    then:
    - set:
        state.comparison_grid_active: false
        state.hide_inactive_inputs: false
    else:
    - set:
        state.comparison_grid_active: true
        state.hide_inactive_inputs: = config['sessions-chat-compare-agents-hide-inactive-inputs']
  - return:
      started: true
- iface: session-comparison-tool-contribution.start
  behavior:
  - title: Register the comparison tools when sessions.chat.compareAgents.enabled is set (or a comparison is not archived)
    source: src/vs/sessions/contrib/sessionComparison/browser/sessionComparisonTool.ts:331-343
    if: config['sessions-chat-compare-agents-enabled']
    then:
    - set:
        state.tools_registered: true
    else:
    - set:
        state.tools_registered: false
  - return:
      started: true
- iface: session-list-actions-experiment-contribution.start
  sources:
  - src/vs/sessions/contrib/sessions/browser/sessionsActions.ts:1666-1700
  - src/vs/sessions/contrib/sessions/browser/sessions.contribution.ts:186
  behavior:
  - title: Bind sessionsListPromoteNewChatAction and set it from the sessions.promoteNewChatAction treatment, defaulting to true when none is served
    source: src/vs/sessions/contrib/sessions/browser/sessionsActions.ts:1688-1699
    call: context-key-service.set-context
    input:
      key: sessionsListPromoteNewChatAction
      value: true
  - return:
      started: true
- iface: sessions-application-badge.start
  sources:
  - src/vs/sessions/contrib/sessions/electron-browser/sessionsApplicationBadge.ts:57-114
  - src/vs/sessions/contrib/sessions/electron-browser/sessions.contribution.ts:49
  behavior:
  - title: Read the sessions (getSessions) for the badge count
    source: src/vs/sessions/contrib/sessions/electron-browser/sessionsApplicationBadge.ts:71
    call: sessions-management-service.get-sessions
    as: s
  - title: Count unarchived sessions that need input (or are unread and not in progress), per sessions.applicationBadge
    source: src/vs/sessions/contrib/sessions/electron-browser/sessionsApplicationBadge.ts:75-94
    set:
      vars.eligible: = vars.s.value.sessions.filter(x, !(has(x.archived) && x.archived) && ((config['sessions-application-badge'].inputNeeded && has(x.status) && x.status == 'needs-input') || (config['sessions-application-badge'].unread
        && has(x.read) && !x.read && !(has(x.status) && x.status == 'in-progress')))).size()
  - title: The badge shows the count only while sessions.showApplicationBadge is on
    source: src/vs/sessions/contrib/sessions/electron-browser/sessionsApplicationBadge.ts:96
    if: config['sessions-show-application-badge']
    then:
    - set:
        state.badge_count: = vars.eligible
    else:
    - set:
        state.badge_count: 0
  - return:
      started: true
- iface: sessions-archive-actions-contribution.start
  behavior:
  - title: registerActions reads chat.experimental.sessionArchiveActionWording and registers that wording's archive actions
    source: src/vs/sessions/contrib/sessions/browser/views/sessionsViewActions.ts:1908-1914
    if: config['chat-experimental-session-archive-action-wording'] == 'done'
    then:
    - set:
        state.archive_action_wording: done
    else:
    - set:
        state.archive_action_wording: archive
  - return:
      started: true
- iface: sessions-chat-background-tint.start
  sources:
  - src/vs/sessions/contrib/chat/browser/chatBackgroundTint.ts:354-388
  - src/vs/sessions/contrib/chat/browser/chat.contribution.ts:654
  behavior:
  - title: update() samples an image only when chat.agentSessions.backgroundImageTint is on and the background is an image; otherwise the overlay is cleared
    source: src/vs/sessions/contrib/chat/browser/chatBackgroundTint.ts:370-386
    if: '!config[''chat-agent-sessions-background-image-tint'']'
    then:
    - set:
        state.tint_image: null
        state.theme_overlay: false
  - return:
      started: true
- iface: sessions-policy-blocked-contribution.start
  sources:
  - src/vs/sessions/contrib/policyBlocked/browser/policyBlocked.contribution.ts:27-99
  - src/vs/sessions/contrib/policyBlocked/browser/policyBlocked.contribution.ts:118
  behavior:
  - title: The first autorun runs update(); chat.agent.enabled = false shows the Agent Disabled overlay
    source: src/vs/sessions/contrib/policyBlocked/browser/policyBlocked.contribution.ts:64-68
    if: config['chat-agent-enabled'] == false
    then:
    - set:
        state.overlay: agent-disabled
    - return:
        started: true
  - title: With no update required and the account gate not restricted, the overlay is cleared
    source: src/vs/sessions/contrib/policyBlocked/browser/policyBlocked.contribution.ts:97-99
    set:
      state.overlay: null
  - return:
      started: true
- iface: sessions-terminal-contribution.start
  sources:
  - src/vs/sessions/contrib/terminal/browser/sessionsTerminalContribution.ts:126-310
  - src/vs/sessions/contrib/terminal/browser/sessionsTerminalContribution.ts:927
  behavior:
  - title: Seed with the sessions already archived, so they are not treated as newly archived on their first change
    source: src/vs/sessions/contrib/terminal/browser/sessionsTerminalContribution.ts:142-146
    call: sessions-management-service.get-sessions
    as: s
  - set:
      state.archived_session_ids: = vars.s.value.sessions.filter(x, has(x.archived) && x.archived).map(x, x.session_id)
  - return:
      started: true
- iface: sessions-voice-bridge-contribution.start
  sources:
  - src/vs/sessions/contrib/chat/browser/voiceBridge.contribution.ts:95-135
  - src/vs/sessions/contrib/chat/browser/voiceBridge.contribution.ts:361
  behavior:
  - title: _updateCommands registers _chat.voice.acceptInput and the other bridge commands only while agents.voice.enabled is true
    source: src/vs/sessions/contrib/chat/browser/voiceBridge.contribution.ts:114-119
