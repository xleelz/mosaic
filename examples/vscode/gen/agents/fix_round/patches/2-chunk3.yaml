- iface: sessions-list-state-migration-contribution.start
  sources:
  - src/vs/sessions/contrib/sessions/browser/views/sessionsList.ts:8191-8197
  - src/vs/sessions/contrib/sessions/browser/views/sessionsList.ts:8097-8170
  - src/vs/sessions/contrib/sessions/browser/sessions.contribution.ts:189
