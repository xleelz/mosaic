    then:
    - set:
        state.commands_registered: false
    - return:
        started: true
  - set:
      state.commands_registered: true
  - return:
      started: true
- iface: sessions-window-notifier.start
  behavior:
  - title: Track every existing session's status for window notifications
    source: src/vs/sessions/contrib/sessions/browser/sessionsWindowNotifier.ts:43-45
    call: sessions-management-service.get-sessions
    as: s
  - set:
      state.tracked_sessions: = vars.s.value.sessions.map(x, x.session_id)
  - return:
      started: true
- iface: set-chat-background-tool-contribution.start
  behavior:
  - title: The autorun registers the set-chat-background tool only while chat.agentSessions.appearanceTools.enabled is on
    source: src/vs/sessions/contrib/chat/electron-browser/chatBackgroundTool.contribution.ts:41-46
    if: '!config[''chat-agent-sessions-appearance-tools-enabled'']'
    then:
    - set:
        state.tool_registered: false
    - return:
        started: true
  - set:
      state.tool_registered: true
  - return:
      started: true
- iface: web-socket-agent-host-contribution.start
  sources:
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/webSocketAgentHost.contribution.ts:20-37
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/entryDrivenProviderContribution.ts:60-104
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/webSocketAgentHost.contribution.ts:44
  behavior:
  - title: _reconcile wants one provider per configured WebSocket entry while chat.remoteAgentHostsEnabled is on, none otherwise
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/entryDrivenProviderContribution.ts:68-73
    if: config['chat-remote-agent-hosts-enabled']
    then:
    - set:
        state.provider_addresses: = config['chat-remote-agent-hosts'].map(e, e.address)
    else:
    - set:
        state.provider_addresses: []
  - return:
      started: true
- iface: ssh-agent-host-contribution.start
  sources:
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/sshAgentHost.contribution.ts:36-67
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/entryDrivenProviderContribution.ts:60-104
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/sshAgentHost.contribution.ts:202
  behavior:
  - title: _reconcile keeps providers for the configured SSH entries only while chat.remoteAgentHostsEnabled is on (no SSH entries are configured in the seeded world)
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/entryDrivenProviderContribution.ts:68-73
    if: config['chat-remote-agent-hosts-enabled']
    then:
    - set:
        state.provider_addresses: '= has(state.ssh_entries) ? state.ssh_entries.map(e, e.address) : []'
    else:
    - set:
        state.provider_addresses: []
  - return:
      started: true
- iface: wsl-agent-host-contribution.start
  sources:
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/wslAgentHost.contribution.ts:53-82
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/entryDrivenProviderContribution.ts:60-104
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/wslAgentHost.contribution.ts:180
  behavior:
  - title: _reconcile keeps providers for the configured WSL entries only while chat.remoteAgentHostsEnabled is on (no WSL entries are configured in the seeded world)
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/entryDrivenProviderContribution.ts:68-73
    if: config['chat-remote-agent-hosts-enabled']
    then:
    - set:
        state.provider_addresses: '= has(state.wsl_entries) ? state.wsl_entries.map(e, e.address) : []'
    else:
    - set:
        state.provider_addresses: []
  - return:
      started: true
- iface: tunnel-agent-host-contribution.start
  sources:
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/tunnelAgentHost.contribution.ts:52-129
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/tunnelAgentHost.contribution.ts:144-168
  - src/vs/sessions/contrib/providers/remoteAgentHost/browser/tunnelAgentHost.contribution.ts:521
  behavior:
  - title: _reconcileProviders keeps a provider per cached, non-dismissed tunnel (tunnel:<id>) only while chat.remoteAgentHostsEnabled is on
    source: src/vs/sessions/contrib/providers/remoteAgentHost/browser/tunnelAgentHost.contribution.ts:144-147
    if: config['chat-remote-agent-hosts-enabled']
    then:
    - set:
        state.provider_addresses: '= has(state.cached_tunnels) ? state.cached_tunnels.filter(t, !(has(t.dismissed) && t.dismissed)).map(t, ''tunnel:'' + t.tunnel_id) : []'
    else:
    - set:
        state.provider_addresses: []
  - return:
      started: true
- iface: sessions-tab-style-contribution.start
  sources:
  - src/vs/sessions/contrib/editor/browser/editor.contribution.ts:57-84
  - src/vs/sessions/contrib/editor/browser/editor.contribution.ts:94
  behavior:
  - title: applyTo toggles the connected-tabs class on each layout container when workbench.experimental.modernUIEditorTabStyle is connected
