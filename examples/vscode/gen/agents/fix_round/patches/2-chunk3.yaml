    source: src/vs/sessions/contrib/sessions/browser/views/sessionsList.ts:8167-8169
    call: storage-service.store
    input:
      key: sessionsListControl.cloudSandboxRepositorySectionsMigrated
      value: 'true'
      scope: profile
      target: machine
  - return:
      started: true
- iface: sessions-telemetry-contribution.start
  sources:
  - src/vs/sessions/contrib/sessions/browser/sessionsTelemetry.contribution.ts:89-216
  - src/vs/sessions/contrib/sessions/browser/sessionsLifecycleTracker.ts:273-282
  - src/vs/sessions/contrib/sessions/browser/sessions.contribution.ts:190
  behavior:
  - title: The lifecycle tracker loads the per-session stats summary from application storage
    source: src/vs/sessions/contrib/sessions/browser/sessionsLifecycleTracker.ts:636-641
    call: storage-service.get
    input:
      key: agentSessions.telemetry.summary.sessions
      scope: application
    as: raw
  - if: vars.raw.value.value == null || vars.raw.value.value == ''
    then:
    - set:
        state.session_stats_raw: ''
    else:
    - set:
        state.session_stats_raw: = vars.raw.value.value
  - return:
      started: true
- iface: session-disk-space-contribution.start
  behavior:
  - title: Schedule the first disk space check (RunOnceScheduler, 10 s); later checks reschedule every 5 minutes
    source: src/vs/sessions/contrib/sessionInputBanners/electron-browser/sessionDiskSpace.contribution.ts:31-46
    emit: session-disk-space-contribution.check-disk-space
    after_ms: = config['session-disk-space-initial-check-delay-ms']
  - return:
      started: true
scenarios:
- id: agents-session-changes-invoke-operation-no-connection
  name: A changeset operation without an agent host connection throws and does not run
  fixtures:
  - full-window
  - agents-seed
  state:
    session-changes-service@w1:
      operations_run: []
      connected: false
  steps:
  - interface: session-changes-service.invoke-operation
    caller: user
    input:
      operation: commit
    as: op
  expect:
