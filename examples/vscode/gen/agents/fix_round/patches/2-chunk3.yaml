  - title: Skip when the cloud sandbox repository sections were already migrated
    source: src/vs/sessions/contrib/sessions/browser/views/sessionsList.ts:8098-8100
    call: storage-service.get
    input:
      key: sessionsListControl.cloudSandboxRepositorySectionsMigrated
      scope: profile
