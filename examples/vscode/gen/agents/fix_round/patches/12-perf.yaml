patches:
- iface: agent-service.list-sessions
  behavior:
  - title: '_startSessionListComputation: start(''sessionList'') timing'
    source: src/vs/platform/agentHost/node/agentService.ts:4970-4971
    call: agent-host-startup-performance.start-operation
    input:
      operation: sessionList
  - call: agent-host-state-manager.sessions-query
    as: q
  - title: '_recordSessionListCompleted: complete(''success'')'
    source: src/vs/platform/agentHost/node/agentService.ts:5001-5005
    call: agent-host-startup-performance.complete-operation
    input:
      operation: sessionList
      outcome: success
  - if: '!state.first_listing_served'
    then:
    - title: firstSessionList since processStart
      source: src/vs/platform/agentHost/node/agentService.ts:5006-5008
      call: agent-host-startup-performance.mark
      input:
        name: firstSessionList
        since: processStart
  - set:
      state.first_listing_served: true
  - &id001
    if: state.host_startup_complete && state.first_listing_served && !state.startup_settled
    then:
    - title: '_openStartupSettled: both host startup and the first listing happened'
      source: src/vs/platform/agentHost/node/agentService.ts:1559-1564
      call: agent-host-startup-performance.mark
      input:
        name: startupSettled
        since: processStart
    - set:
        state.startup_settled: true
  - return:
      sessions: = vars.q.value
  sources:
  - src/vs/platform/agentHost/node/agentService.ts:4850-4870
  - src/vs/platform/agentHost/node/agentService.ts:4970-5010
- iface: agent-host-main.start
  behavior:
  - title: Exit diagnostics, then startAgentHost()
    detail: A rejection is printed and the process exits with code 1.
    source: src/vs/platform/agentHost/node/agentHostMain.ts:74-80
  - title: 'createAgentHostRuntime: bootstrapStart'
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:110-111
    call: agent-host-startup-performance.mark
    input:
      name: bootstrapStart
  - title: configuration since bootstrapStart
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:155
    call: agent-host-startup-performance.mark
    input:
      name: configuration
      since: bootstrapStart
  - title: telemetry since configuration
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:167
    call: agent-host-startup-performance.mark
    input:
      name: telemetry
      since: configuration
  - title: Create the runtime and register providers
    source: src/vs/platform/agentHost/node/agentHostMain.ts:155-229
    call: agent-host-provider-service.register-providers
    input:
      claude_sdk_available: = input.claude_sdk_available
      codex_enabled_env: = input.codex_enabled_env
      codex_root_config_enabled: = input.codex_root_config_enabled
    as: reg
    on_error:
    - title: '''Failed to create AgentService'': disposed and rethrown; the process exits 1'
      source: src/vs/platform/agentHost/node/agentHostMain.ts:226-230
      fail:
        code: agent-host-startup-failed
        message: '= ''Failed to create AgentService: '' + error.message'
    fill: true
  - title: services since telemetry
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:235
    call: agent-host-startup-performance.mark
    input:
      name: services
      since: telemetry
  - title: bootstrap since processStart
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:236
    call: agent-host-startup-performance.mark
    input:
      name: bootstrap
      since: processStart
  - title: registerChannel agentHostLogger (utility process)
    source: src/vs/platform/agentHost/node/agentHostMain.ts:127
    set:
      vars.channels:
      - agentHostLogger
  - title: registerChannel agentHostProtocol before the local socket endpoint starts
    source: src/vs/platform/agentHost/node/agentHostMain.ts:348
    set:
      vars.channels: = vars.channels + ['agentHostProtocol']
  - title: registerChannel agentHostManagement
    source: src/vs/platform/agentHost/node/agentHostMain.ts:513
    set:
      vars.channels: = vars.channels + ['agentHostManagement']
  - title: Start the configured WebSocket server (non-fatal)
    source: src/vs/platform/agentHost/node/agentHostMain.ts:519-540
    call: agent-host-main.start-configured-web-socket-server
    input:
      port: = input.configured_port
    as: ws
    on_error: continue
    fill: true
  - call: agent-host-worktree-cleanup-service.start
    title: 'Contributions activate: worktree cleanup starts'
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:230
  - title: 'When the configured WebSocket start settles: markStartupComplete(''error'' if it failed)'
    source: src/vs/platform/agentHost/node/agentHostMain.ts:537-542
    call: agent-service.mark-startup-complete
    input:
      outcome: '= vars.ws.ok ? ''success'' : ''error'''
  - return:
      channels: = vars.channels
      providers: = vars.reg.value.providers
      websocket: '= vars.ws.ok ? vars.ws.value.listening : ''failed'''
components:
- id: agent-host-startup-performance
  name: AgentHostStartupPerformance
  kind: service
  layer: process
  parent: agent-host
  summary: IAgentHostStartupPerformance implementation (built by registerAgentHostCoreServices/HostServices in the agent host). Holds the ordered startup marks (AgentHostStartupMarks, processStart pre-seeded)
    and the bounded sessionList-style operations.
  sources:
  - src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:14
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        marks:
          type: array
        keys:
          type: object
        ops:
          type: object
    initial:
      marks:
      - name: processStart
        provider: host
      keys:
        processStart/host: true
      ops: {}
- id: agent-service
  name: AgentService
  kind: module
  layer: process
  parent: agent-host
  summary: 'The orchestrator: creates and disposes sessions, routes client actions to the state manager and side effects; served as the agentHost IPC channel.'
  sources:
  - src/vs/platform/agentHost/common/agentService.ts:966
  - src/vs/platform/agentHost/node/agentService.ts:943
  - src/vs/platform/agentHost/node/agentHostMain.ts:268
  attributes:
    owner: agents
  capacity:
    concurrency: 1
  state:
    schema:
      type: object
      properties:
        host_startup_complete:
          type: boolean
        first_listing_served:
          type: boolean
        startup_settled:
          type: boolean
    initial:
      host_startup_complete: false
      first_listing_served: false
      startup_settled: false
interfaces:
- component: agent-host-startup-performance
  name: mark
  kind: function
  summary: Records a milestone once per provider (AgentHostStartupMarks.mark), measured from an optional predecessor, then reports the pending marks.
  sources:
  - src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:92-111
  - src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:231-237
  request:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        examples:
        - hostReady
      since:
        type: string
      outcome:
        type: string
        enum:
        - success
        - error
        - unavailable
        - deferred
        - partial
        - cancelled
      provider:
        type: string
        default: host
  response:
    type: object
    properties:
      recorded:
        type: boolean
  behavior:
  - set:
      vars.provider: '= has(input.provider) && input.provider != '''' ? input.provider : ''host'''
  - if: (input.name + '/' + vars.provider) in state.keys
    then:
    - title: A milestone is recorded once per provider
      source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:94-97
      return:
        recorded: false
  - title: Record the mark and queue it for reporting
    source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:98-110
    set:
      state.keys: '= merge(state.keys, {input.name + ''/'' + vars.provider: true})'
      state.marks: '= state.marks + [{''name'': input.name, ''provider'': vars.provider, ''since'': has(input.since) ? input.since : '''', ''outcome'': has(input.outcome) ? input.outcome : ''''}]'
  - return:
      recorded: true
- component: agent-host-startup-performance
  name: start-operation
  kind: function
  summary: 'start(operation): pairs a <operation>Start marker with its completion, at most three attempts and none after a success.'
  sources:
  - src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:239-284
  request:
    type: object
    required:
    - operation
    properties:
      operation:
        type: string
        examples:
        - sessionList
      provider:
        type: string
        default: host
  response:
    type: object
    properties:
      started:
        type: boolean
  behavior:
  - set:
      vars.key: = input.operation + '/host'
  - if: vars.key in state.ops && (state.ops[vars.key].done || state.ops[vars.key].active)
    then:
    - title: 'Done or already active: no timing'
      source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:263-267
      return:
        started: false
  - set:
      vars.attempts: '= vars.key in state.ops ? state.ops[vars.key].attempts + 1 : 1'
  - title: 'Begin: report the <operation>Start marker'
    source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:278-283
    set:
      state.ops: '= merge(state.ops, {vars.key: {''attempts'': vars.attempts, ''done'': false, ''active'': true}})'
      state.marks: '= state.marks + [{''name'': input.operation + ''Start'', ''provider'': ''host'', ''since'': '''', ''outcome'': ''''}]'
  - return:
      started: true
- component: agent-host-startup-performance
  name: complete-operation
  kind: function
  summary: 'IAgentHostStartupTiming.complete: report the operation marker since its Start, done on success or after three attempts.'
  sources:
  - src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:286-297
  request:
    type: object
    required:
    - operation
    - outcome
    properties:
      operation:
        type: string
        examples:
        - sessionList
      outcome:
        type: string
        examples:
        - success
  response:
    type: object
    properties:
      done:
        type: boolean
  behavior:
  - set:
      vars.key: = input.operation + '/host'
  - if: '!(vars.key in state.ops) || !state.ops[vars.key].active'
    then:
    - title: Only the active timing completes
      source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:248-252
      return:
        done: false
  - set:
      vars.done: = input.outcome == 'success' || state.ops[vars.key].attempts >= 3
  - title: Report the operation marker
    source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:286-297
    set:
      state.ops: '= merge(state.ops, {vars.key: {''attempts'': state.ops[vars.key].attempts, ''done'': vars.done, ''active'': false}})'
      state.marks: '= state.marks + [{''name'': input.operation, ''provider'': ''host'', ''since'': input.operation + ''Start'', ''outcome'': input.outcome}]'
  - return:
      done: = vars.done
- component: agent-service
  name: mark-startup-complete
  kind: function
  summary: 'markStartupComplete: once, mark hostReady with the outcome, then open startupSettled if the first listing was served.'
  sources:
  - src/vs/platform/agentHost/node/agentService.ts:1550-1557
  request:
    type: object
    properties:
      outcome:
        type: string
        enum:
        - success
        - error
        default: success
  response:
    type: object
    properties:
      settled:
        type: boolean
  behavior:
  - if: state.host_startup_complete
    then:
    - title: Already complete
      source: src/vs/platform/agentHost/node/agentService.ts:1551-1553
      return:
        settled: = state.startup_settled
  - set:
      state.host_startup_complete: true
  - title: hostReady since processStart, with the outcome
    source: src/vs/platform/agentHost/node/agentService.ts:1555
    call: agent-host-startup-performance.mark
    input:
      name: hostReady
      since: processStart
      outcome: '= has(input.outcome) ? input.outcome : ''success'''
  - *id001
  - return:
      settled: = state.startup_settled
flows: []
scenarios: []
configs: []
