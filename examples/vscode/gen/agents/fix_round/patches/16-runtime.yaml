patches:
- iface: agent-host-main.start
  behavior:
  - title: Exit diagnostics, then startAgentHost()
    detail: A rejection is printed and the process exits with code 1.
    source: src/vs/platform/agentHost/node/agentHostMain.ts:74-80
  - title: 'startAgentHost: createAgentHostRuntime'
    source: src/vs/platform/agentHost/node/agentHostMain.ts:155-229
    call: agent-host-main.create-agent-host-runtime
    as: reg
    input:
      claude_sdk_available: = input.claude_sdk_available
      codex_enabled_env: = input.codex_enabled_env
      codex_root_config_enabled: = input.codex_root_config_enabled
    fill: true
    on_error:
    - title: '''Failed to create AgentService'': disposed and rethrown; the process exits 1'
      source: src/vs/platform/agentHost/node/agentHostMain.ts:226-230
      fail:
        code: agent-host-startup-failed
        message: '= ''Failed to create AgentService: '' + error.message'
  - title: registerChannel agentHostLogger (utility process)
    source: src/vs/platform/agentHost/node/agentHostMain.ts:127
    set:
      vars.channels:
      - agentHostLogger
  - title: registerChannel agentHostProtocol before the local socket endpoint starts
    source: src/vs/platform/agentHost/node/agentHostMain.ts:348
    set:
      vars.channels: = vars.channels + ['agentHostProtocol']
  - title: registerChannel agentHostManagement
    source: src/vs/platform/agentHost/node/agentHostMain.ts:513
    set:
      vars.channels: = vars.channels + ['agentHostManagement']
  - title: Start the configured WebSocket server (non-fatal)
    source: src/vs/platform/agentHost/node/agentHostMain.ts:519-540
    call: agent-host-main.start-configured-web-socket-server
    input:
      port: = input.configured_port
    as: ws
    on_error: continue
    fill: true
  - title: 'When the configured WebSocket start settles: markStartupComplete(''error'' if it failed)'
    source: src/vs/platform/agentHost/node/agentHostMain.ts:537-542
    call: agent-service.mark-startup-complete
    input:
      outcome: '= vars.ws.ok ? ''success'' : ''error'''
  - return:
      channels: = vars.channels
      providers: = vars.reg.value.providers
      websocket: '= vars.ws.ok ? vars.ws.value.listening : ''failed'''
interfaces:
- component: agent-host-main
  name: create-agent-host-runtime
  kind: function
  summary: 'createAgentHostRuntime: builds the agent host runtime (services, AgentService, providers, contributions) and records the bootstrap marks. It does not call markStartupComplete; the activating
    entry point does.'
  sources:
  - src/vs/platform/agentHost/node/agentHostBootstrap.ts:109-251
  request:
    type: object
    properties:
      claude_sdk_available:
        type: boolean
        default: false
      codex_enabled_env:
        type: boolean
        default: false
      codex_root_config_enabled:
        type: boolean
        default: false
  response:
    type: object
    properties:
      providers:
        type: array
  behavior:
  - title: 'createAgentHostRuntime: bootstrapStart'
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:110-111
    call: agent-host-startup-performance.mark
    input:
      name: bootstrapStart
  - title: configuration since bootstrapStart
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:155
    call: agent-host-startup-performance.mark
    input:
      name: configuration
      since: bootstrapStart
  - title: telemetry since configuration
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:167
    call: agent-host-startup-performance.mark
    input:
      name: telemetry
      since: configuration
  - title: Build the service collection and AgentService; register the providers
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:140-229
    call: agent-host-provider-service.register-providers
    input:
      claude_sdk_available: = input.claude_sdk_available
      codex_enabled_env: = input.codex_enabled_env
      codex_root_config_enabled: = input.codex_root_config_enabled
    as: reg
    fill: true
  - call: agent-host-worktree-cleanup-service.start
    title: 'Contributions activate: worktree cleanup starts'
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:229-230
  - title: services since telemetry
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:235
    call: agent-host-startup-performance.mark
    input:
      name: services
      since: telemetry
  - title: bootstrap since processStart
    source: src/vs/platform/agentHost/node/agentHostBootstrap.ts:236
    call: agent-host-startup-performance.mark
    input:
      name: bootstrap
      since: processStart
  - return:
      providers: = vars.reg.value.providers
flows:
- id: agents-agent-host-runtime
  name: createAgentHostRuntime (runtime only, no entry point)
  entry:
    caller: agent-host-main
    interface: agent-host-main.create-agent-host-runtime
  sources:
  - src/vs/platform/agentHost/node/agentHostBootstrap.ts:109-251
scenarios:
- id: agents-agent-host-runtime-then-ready
  fixtures:
  - full-window
  - agents-seed
  steps:
  - flow: agents-agent-host-runtime
    as: rt
  - interface: agent-service.mark-startup-complete
    caller: agent-host-main
    input:
      outcome: error
    as: ready
  - interface: agent-service.list-sessions
    caller: protocol-server-handler
    as: list
  expect:
  - steps.rt.result.ok
  - steps.list.result.ok
  - state['agent-host-startup-performance'].marks.map(m, m.name) == ['processStart', 'bootstrapStart', 'configuration', 'telemetry', 'services', 'bootstrap', 'hostReady', 'sessionListStart', 'sessionList',
    'firstSessionList', 'startupSettled']
  - trace.exists(e, e.type == 'call.start' && e.interface == 'agent-host-startup-performance.mark' && e.input.name == 'hostReady' && e.input.outcome == 'error')
  - state['agent-service'].startup_settled == true
- id: agents-agent-host-runtime-not-ready
  flow: agents-agent-host-runtime
  fixtures:
  - full-window
  - agents-seed
  expect:
  - result.ok
  - '!state[''agent-host-startup-performance''].marks.exists(m, m.name == ''hostReady'')'
  - state['agent-service'].host_startup_complete == false
