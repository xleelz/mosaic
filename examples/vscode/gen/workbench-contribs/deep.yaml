      - title: Store workspace.trust.startupPrompt.shown (WORKSPACE scope)
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:485
        set: {state.startup_prompt_shown: true}
      - return: {answer: "= vars.answer"}
  - component: workspace-trust-ux-handler
    name: update-workbench-indicators
    kind: function
    summary: "updateWorkbenchIndicators(trusted): unless security.workspace.trust.banner is never (or untilDismissed and dismissed), shows the Restricted Mode banner (Manage, Learn More) when untrusted and hides it when trusted. Message per workbench state."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:432-444", "src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:555-615"]
    request: {type: object, required: [trusted], properties: {trusted: {type: boolean}}}
    behavior:
      - title: "getBannerItem: never shows no banner"
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:559-561
        if: "config['security-workspace-trust-banner'] == 'never'"
        then: [{return: {banner: none}}]
      - title: "getBannerItem: untilDismissed and already dismissed"
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:564-566
        if: "config['security-workspace-trust-banner'] == 'untilDismissed' && state.banner_dismissed"
        then: [{return: {banner: none}}]
      - if: "input.trusted"
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:440-442
        then:
          - call: banner-part.hide
            input: {id: workbench.banner.restrictedMode}
