  # ---------- bulk edit ----------
  - component: bulk-edit-service
    name: apply
    kind: function
    summary: "IBulkEditService.apply: preview when asked or needed, perform, optionally auto-save multi-file refactorings."
    sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:206-286"]
    request:
      type: object
      properties:
        edits:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [text, file]}
              resource: {type: string}
              op: {type: string, enum: [edit, create, delete, rename]}
              target: {type: string}
              needs_confirmation: {type: boolean}
          examples: [[{type: text, resource: "file:///work/app/src/main.ts", op: edit, needs_confirmation: false}]]
        show_preview: {type: boolean, default: false}
        respect_auto_save_config: {type: boolean, default: false}
        label: {type: string, examples: [Rename symbol]}
    errors: [{code: has-changed-in-the-meantime, status: 0, retryable: false}, {code: does-not-exist-and-can-not-be-deleted, status: 0, retryable: false}]
    behavior:
      - title: Lift the edits; every option is optional (IBulkEditOptions)
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:207
        set:
          vars.edits: "= has(input.edits) ? input.edits : []"
          vars.show_preview: "= has(input.show_preview) && input.show_preview == true"
          vars.respect_auto_save: "= has(input.respect_auto_save_config) && input.respect_auto_save_config == true"
      - title: No edits
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:209-210
        if: "size(vars.edits) == 0"
        then: [{return: {aria_summary: Made no edits, is_applied: false, applied: 0, resources: []}}]
      - title: Preview when requested or when an edit needs confirmation
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:213-214
        if: "vars.show_preview || vars.edits.exists(e, has(e.needs_confirmation) && e.needs_confirmation == true)"
        then:
          - call: bulk-edit-preview-contribution.preview-edit
            input: {edits: "= vars.edits"}
            as: preview
          - set: {vars.edits: "= vars.preview.value.edits"}
      - title: Shutdown is vetoed (with a confirm) while the edit is in progress
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:267
      - call: bulk-edit.perform
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:268
        input: {edits: "= vars.edits"}
        as: performed
      - title: Refactoring auto save only for more than one resource
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:272-273
        if: "vars.respect_auto_save && config['files-refactoring-auto-save'] && size(vars.performed.value.resources) > 1"
        then:
          - foreach: "= vars.performed.value.resources"
            as: res
            steps:
              - call: text-file-service.save
                source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:288-302
                input: {resource: "= vars.res", options: {reason: explicit}}
                on_error: continue
      - return: {aria_summary: "= 'Made edits in ' + string(size(vars.performed.value.resources)) + ' files'", is_applied: "= size(vars.edits) > 0", applied: "= size(vars.edits)", resources: "= vars.performed.value.resources"}
  - component: bulk-edit-preview-contribution
    name: preview-edit
    kind: function
    summary: "Shows the Refactor Preview pane and resolves with the accepted edits, or none when discarded."
    sources: ["src/vs/workbench/contrib/bulkEdit/browser/preview/bulkEdit.contribution.ts:111-160"]
    request: {type: object, properties: {edits: {type: array}}}
    behavior:
      - choice: decision
        default: apply
        options:
          apply:
            - title: refactorPreview.apply accepts the checked edits
              source: src/vs/workbench/contrib/bulkEdit/browser/preview/bulkEdit.contribution.ts:189
              return: {edits: "= input.edits"}
          discard:
            - title: refactorPreview.discard resolves with no edits
              source: src/vs/workbench/contrib/bulkEdit/browser/preview/bulkEdit.contribution.ts:213
              return: {edits: []}
          busy-declined:
            - title: Another refactoring is being previewed and the user keeps it
              source: src/vs/workbench/contrib/bulkEdit/browser/preview/bulkEdit.contribution.ts:122-131
              return: {edits: []}
  - component: bulk-edit
    name: perform
    kind: function
    summary: "Runs text edits and file edits and returns the touched resources."
    sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:99-142"]
    request: {type: object, properties: {edits: {type: array}}}
    behavior:
      - if: "size(input.edits) == 0"
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:101-102
        then: [{return: {resources: []}}]
      - set:
          vars.text: "= input.edits.filter(e, !has(e.type) || e.type == 'text')"
          vars.files: "= input.edits.filter(e, has(e.type) && e.type == 'file')"
      - if: "size(vars.files) > 0"
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:127-128
        then: [{call: bulk-file-edits.apply, input: {edits: "= vars.files"}}]
      - if: "size(vars.text) > 0"
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:129-130
        then: [{call: bulk-text-edits.apply, input: {edits: "= vars.text"}}]
      - return: {resources: "= input.edits.filter(e, has(e.resource)).map(e, e.resource)"}
  - component: bulk-text-edits
    name: apply
    kind: function
    summary: "Checks every model's version against the edit's version id, then pushes the edits."
    sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkTextEdits.ts:293-339"]
    request: {type: object, properties: {edits: {type: array}}}
    errors: [{code: has-changed-in-the-meantime, status: 0, retryable: false}]
    behavior:
      - title: Model version must equal the edit's version id
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkTextEdits.ts:218-220
        choice: model_version
        default: current
        options:
          current: []
          changed:
            - fail: {code: has-changed-in-the-meantime, message: "= input.edits[0].resource + ' has changed in the meantime'"}
      - title: Create a model reference per resource; closed files get loaded (ITextModelService.createModelReference)
        source: src/vs/workbench/contrib/bulkEdit/browser/bulkTextEdits.ts:227-233
        foreach: "= input.edits.map(e, e.resource)"
        as: res
        steps:
          - call: text-file-models.resolve
            source: src/vs/workbench/contrib/bulkEdit/browser/bulkTextEdits.ts:233
            input: {resource: "= vars.res"}
      - foreach: "= input.edits"
        as: edit
        steps:
          - call: text-model.push-edit-operations
            source: src/vs/workbench/contrib/bulkEdit/browser/bulkTextEdits.ts:308-332
            input: {uri: "= vars.edit.resource", edits: [{range: {start_line: 1, start_column: 1, end_line: 1, end_column: 1}, text: "= has(vars.edit.text) ? vars.edit.text : '// edited\\n'"}], source: bulkEdit}
      - return: {applied: "= size(input.edits)"}
  - component: bulk-file-edits
    name: apply
    kind: function
    summary: "Applies file operations in order; deleting a missing file without ignoreIfNotExists throws."
    sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkFileEdits.ts:243-244"]
    request: {type: object, properties: {edits: {type: array}}}
    errors: [{code: does-not-exist-and-can-not-be-deleted, status: 0, retryable: false}]
    behavior:
      - foreach: "= input.edits"
        as: edit
        steps:
          - set: {vars.op: "= has(vars.edit.op) ? vars.edit.op : (has(vars.edit.target) ? 'rename' : 'delete')"}
          - if: "vars.op == 'delete'"
            then:
              - choice: target_exists
                default: exists
                source: src/vs/workbench/contrib/bulkEdit/browser/bulkFileEdits.ts:243
                options:
                  exists: []
                  missing:
                    - fail: {code: does-not-exist-and-can-not-be-deleted, message: "= vars.edit.resource + ' does not exist and can not be deleted'"}
              - call: working-copy-file-service.delete
                input: {resources: ["= vars.edit.resource"]}
          - if: "vars.op == 'create'"
            then: [{call: working-copy-file-service.create, input: {files: [{target: "= vars.edit.resource"}], overwrite: false}}]
          - if: "vars.op == 'rename'"
            then: [{call: working-copy-file-service.move, input: {files: [{source: "= vars.edit.resource", target: "= vars.edit.target"}], overwrite: false}}]
      - return: {applied: "= size(input.edits)"}

