        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:605-614
        as: ws
      - set:
          vars.target: "= vars.ws.value.workbench_state == 'empty' ? 'window' : (vars.ws.value.workbench_state == 'workspace' ? 'workspace' : 'folder')"
      - call: banner-part.show
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:438-439
        input:
          id: workbench.banner.restrictedMode
          message: "= 'Restricted Mode is intended for safe code browsing. Trust this ' + vars.target + ' to enable all features.'"
          actions: [{label: Manage, href: "command:workbench.trust.manage"}, {label: Learn More, href: "https://aka.ms/vscode-workspace-trust"}]
      - return: {banner: shown}
  - component: workspace-trust-ux-handler
    name: on-did-change-trust
    kind: event
    summary: "workspaceTrustManagementService.onDidChangeTrust: refresh the banner and status bar indicators."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:376-378"]
    request: {type: object, required: [trusted], properties: {trusted: {type: boolean}}}
    behavior:
      - call: workspace-trust-ux-handler.update-workbench-indicators
        input: {trusted: "= input.trusted"}
        as: u
      - return: "= vars.u.value"
  - component: workspace-trust-ux-handler
    name: dismiss-banner
    kind: function
    summary: "The banner's onClose in Restricted Mode stores workbench.banner.restrictedMode.dismissed (WORKSPACE), so untilDismissed stops showing it."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:586-590"]
    behavior:
      - set: {state.banner_dismissed: true}
      - call: banner-part.hide
