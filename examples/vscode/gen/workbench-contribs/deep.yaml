  - component: workspace-trust-request-handler
    name: on-did-initiate-workspace-trust-request
    kind: event
    summary: "Trust request dialog with Trust & Continue / Manage / Cancel (or caller-supplied buttons)."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:204-279"]
    request:
      type: object
      properties:
        message: {type: string}
    behavior:
      - choice: button
        default: ContinueWithTrust
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:264-278
