      - if: "!config['editor-format-on-save']"
        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:248
        then: [{return: {formatted: none}}]
      - if: "config['editor-format-on-save-mode'] == 'file'"
        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:254-257
        then:
          - call: format.format-document-with-selected-provider
