        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:137-141
        input: {resource: "= input.resource", edits: [{range: {start_line: 2, start_column: 23, end_line: 2, end_column: 23}, text: "\n"}]}
