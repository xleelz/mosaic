        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:345-375
        set: {vars.kinds: "= vars.setting.filter(k, vars.setting[k] == 'always' || (input.reason == 'explicit' && (vars.setting[k] == 'explicit' || vars.setting[k] == true)))"}
      - if: "size(vars.kinds) == 0"
        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:364-365
        then: [{return: {kinds: []}}]
      - call: code-action-on-save-participant.apply-on-save-actions
        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:377
        input: {resource: "= input.resource", kinds: "= vars.kinds"}
      - return: {kinds: "= vars.kinds"}
  - component: code-action-on-save-participant
    name: apply-on-save-actions
    kind: function
    summary: "Fetches and applies code actions per kind; failures of single actions are swallowed."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:389-433"]
    request: {type: object, properties: {resource: {type: string}, kinds: {type: array}}}
    behavior:
