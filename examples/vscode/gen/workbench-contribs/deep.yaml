  # ---------- walkthroughs ----------
  - component: getting-started-commands
    name: cmd-welcome-mark-step-complete
    kind: command
    attributes: {command: welcome.markStepComplete}
    summary: "welcome.markStepComplete: marks a walkthrough step done; no-op without an argument."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:168-182"]
    request: {type: object, properties: {arg: {type: string, examples: [pickColorTheme]}}}
    behavior:
      - title: No step id, nothing to do
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:178
        if: "!has(input.arg) || input.arg == ''"
        then: [{return: {progressed: false}}]
      - call: walkthroughs-service.progress-step
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:180
        input: {id: "= input.arg"}
      - return: {progressed: true}
  - component: getting-started-commands
    name: cmd-welcome-mark-step-incomplete
    kind: command
    attributes: {command: welcome.markStepIncomplete}
    summary: "welcome.markStepIncomplete: clears a step's progress."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:184-198"]
    request: {type: object, properties: {arg: {type: string, examples: [pickColorTheme]}}}
    behavior:
      - if: "!has(input.arg) || input.arg == ''"
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:194
        then: [{return: {progressed: false}}]
      - call: walkthroughs-service.deprogress-step
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:196
        input: {id: "= input.arg"}
      - return: {progressed: false}
  - component: walkthroughs-service
    name: progress-step
    kind: function
    summary: "Marks a step done, saves the memento, then fires onDidProgressStep; an unknown step throws after the save."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:548-558"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [pickColorTheme]}}}
    errors: [{code: tried-to-progress-unknown-step, status: 0, retryable: false}]
    behavior:
      - title: Already done, nothing changes
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:550
        if: "input.id in state.progress && state.progress[input.id].done == true"
        then: [{return: {changed: false}}]
      - title: Record done and save the memento (PROFILE scope)
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:551-552
        set: {state.progress: "= merge(state.progress, {input.id: {'done': true}})"}
      - title: Unknown step throws after the memento was saved
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:553-554
        if: "!(input.id in state.steps)"
        then: [{fail: {code: tried-to-progress-unknown-step, message: Tried to progress unknown step}}]
      - publish: walkthroughs-service.on-did-progress-step
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:556
        input: {id: "= input.id", done: true}
        delivery: sync
      - return: {changed: true}
  - component: walkthroughs-service
    name: deprogress-step
    kind: function
    summary: "Deletes a step's progress, saves and fires onDidProgressStep."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:560-565"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [pickColorTheme]}}}
    behavior:
      - set: {state.progress: "= omit(state.progress, input.id)"}
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:561-562
      - publish: walkthroughs-service.on-did-progress-step
        input: {id: "= input.id", done: false}
        delivery: sync
      - return: {changed: true}
  - component: walkthroughs-service
    name: on-did-progress-step
    kind: event
    summary: "onDidProgressStep emitter."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:130-131"]
  - component: getting-started-page
    name: on-did-progress-step
    kind: event
    summary: "Updates the step's done flag in the open Welcome page; hides a walkthrough when its last step completes."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.ts:284-297"]
    subscribe: [walkthroughs-service.on-did-progress-step]
    behavior:
      - return: {rendered: true}
  - component: walkthroughs-service
    name: get-walkthroughs
    kind: function
    summary: "Resolved walkthrough steps with done flags (getStepProgress defaults done to false)."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:488-505", "src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:540-546"]
    behavior:
      - return: {steps: "= state.steps.transformList(id, cat, {'id': id, 'walkthrough': cat, 'done': id in state.progress && state.progress[id].done == true})"}

  # ---------- startup page ----------
  - component: startup-page-runner-contribution
    name: run
    kind: function
    summary: "Opens the startup editor once the workbench is restored."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:113-153"]
    request:
      type: object
      properties:
        startup_kind: {type: string, enum: [new-window, reloaded-window], default: new-window}
        has_active_editor: {type: boolean, default: false}
    behavior:
      - title: Startup page enabled for welcomePage, readme or terminal
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:271-287
        set: {vars.mode: "= config['workbench-startup-editor']"}
      - title: Disabled, or a reloaded window
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:139
        if: "!(vars.mode in ['welcomePage', 'readme', 'terminal']) || input.startup_kind == 'reloaded-window'"
        then: [{return: {opened: none}}]
      - title: An editor is already active
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:142
        if: "input.has_active_editor"
        then: [{return: {opened: none}}]
      - if: "vars.mode == 'readme'"
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:193
        then:
          - call: command-service.execute-command
            input: {command_id: markdown.showPreview, args: [null, ["file:///work/app/README.md"], {locked: true}]}
            on_error:
              - title: Could not open markdown preview (markdown extension disabled or not activated)
                source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:193-194
                call: notification-service.notify
                input: {severity: error, message: "= 'Could not open markdown preview: ' + error.message + '.'"}
              - return: {opened: readme-error}
          - return: {opened: readme}
      - if: "vars.mode == 'terminal'"
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:149-150
        then:
          - title: Not awaited; a failure doesn't stop startup
            call: command-service.execute-command
            input: {command_id: workbench.action.createTerminalEditor, args: []}
            on_error: continue
          - return: {opened: terminal}
      - title: Open the Welcome page
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:215-216
        call: editor-service.open-editor
        input: {resource: "walkThrough://vscode_getting_started_page", options: {pinned: false}}
      - return: {opened: welcome-page}

  # ---------- snippets ----------
  - component: insert-snippet-action
    name: cmd-editor-action-insert-snippet
    kind: command
    attributes: {command: editor.action.insertSnippet}
    summary: "Resolves the snippet from args (inline body, name + language) or a pick, inserts it and records its usage."
    sources: ["src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:79-150"]
    description: "Arguments (all optional): snippet (inline body), name (snippet name), lang_id (language id). The request schema declares no properties so a call without arguments reaches the quick pick."
    request: {type: object}
    behavior:
      - set: {vars.uri: "= has(input.resource) ? input.resource : 'file:///work/app/src/main.ts'"}
      - title: Inline snippet body becomes an ad-hoc user snippet
        source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:96-107
        if: "has(input.snippet) && input.snippet != ''"
        then:
          - set: {vars.snip: "= {'id': 'random/' + string(random(1000000)), 'body': input.snippet, 'needs_clipboard': input.snippet.contains('CLIPBOARD')}"}
        else:
          - title: An unregistered language id resolves no snippet
            source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:111-114
            if: "has(input.lang_id)"
            then:
              - choice: language_registered
                default: registered
                options:
                  registered: []
                  unregistered: [{return: {inserted: false}}]
          - title: Language at the cursor, else the requested one
            source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:115-125
            set: {vars.lang: "= has(input.lang_id) ? input.lang_id : 'typescript'"}
          - call: snippets-service.get-snippets
            source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:130-131
            input: {language_id: "= vars.lang", include_no_prefix_snippets: true}
            as: found
          - if: "has(input.name)"
            then:
              - set: {vars.matches: "= vars.found.value.snippets.filter(s, s.name == input.name)"}
            else:
              - title: No name, let the user pick a snippet
                source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:136
                choice: pick
                default: first
                options:
                  first: [{set: {vars.matches: "= vars.found.value.snippets.slice(0, 1)"}}]
                  dismissed: [{set: {vars.matches: []}}]
          - title: Snippet not found, return silently
            source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:140-142
            if: "size(vars.matches) == 0"
            then: [{return: {inserted: false}}]
          - set: {vars.snip: "= vars.matches[0]"}
      - set: {vars.clip: ""}
      - title: Snippets with clipboard variables read the clipboard first
        source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:144-146
        if: "vars.snip.needs_clipboard"
        then:
          - call: clipboard-service.read-text
            as: clipboard
          - set: {vars.clip: "= vars.clipboard.value.text"}
      - call: snippet-controller2.insert
        source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:148
        input: {uri: "= vars.uri", template: "= vars.snip.body"}
      - call: snippets-service.update-usage-timestamp
        source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:149
        input: {id: "= vars.snip.id"}
      - return: {inserted: true, id: "= vars.snip.id"}
  - component: snippets-service
    name: get-snippets
    kind: function
    summary: "Snippets for a registered language, with recency from the usage timestamps (most recent first)."
    sources: ["src/vs/workbench/contrib/snippets/browser/snippetsService.ts:278-303", "src/vs/workbench/contrib/snippets/browser/snippetsService.ts:343-347"]
    request: {type: object, properties: {language_id: {type: string, examples: [typescript]}, include_no_prefix_snippets: {type: boolean}}}
    behavior:
      - title: Only registered languages with snippet files yield snippets
        source: src/vs/workbench/contrib/snippets/browser/snippetsService.ts:284-285
        set: {vars.list: "= input.language_id in state.snippets ? state.snippets[input.language_id] : []"}
      - return: {snippets: "= vars.list.map(s, merge(s, {'last_used': s.id in state.usage ? state.usage[s.id] : -1}))"}
  - component: snippets-service
    name: update-usage-timestamp
    kind: function
    summary: "Stores the snippet's last-use time in snippets.usageTimestamps (PROFILE storage, last 100 kept)."
    sources: ["src/vs/workbench/contrib/snippets/browser/snippetsService.ts:253-255", "src/vs/workbench/contrib/snippets/browser/snippetsService.ts:194-203"]
    request: {type: object, required: [id], properties: {id: {type: string}}}
    behavior:
      - set: {state.usage: "= merge(omit(state.usage, input.id), {input.id: now})"}
        source: src/vs/workbench/contrib/snippets/browser/snippetsService.ts:196-197
      - return: {stored: true}

  # ---------- link protection ----------
  - component: opener-validator-contributions
    name: validate-link
    kind: function
    summary: "Opener validator (shouldOpen): opens non-http links and trusted domains directly, else asks."
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:46-145"]
    request:
      type: object
      required: [uri]
      properties:
        uri: {type: string, examples: ["https://example.com/docs"]}
        from_workspace: {type: boolean, default: false}
    behavior:
      - set: {vars.scheme: "= input.uri.split(':')[0]"}
      - title: Only http and https links are validated
        source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:62-63
        if: "!(vars.scheme in ['http', 'https'])"
        then: [{return: {open: true}}]
      - title: Links from a trusted workspace skip the prompt unless promptInTrustedWorkspace
        source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:66-67
        if: "input.from_workspace && !config['workbench-trusted-domains-prompt-in-trusted-workspace']"
        then:
          - call: workspace-trust-management-service.is-workspace-trusted
            as: trust
          - if: "vars.trust.value.trusted"
            then: [{return: {open: true}}]
      - call: trusted-domain-service.is-valid
        source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:72-73
        input: {uri: "= input.uri"}
        as: valid
      - if: "vars.valid.value.valid"
        then: [{return: {open: true}}]
      - title: Ask "Do you want Code to open the external website?"
        source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:92-140
        choice: link_prompt
        default: open
        options:
          open: [{return: {open: true}}]
          copy:
            - call: clipboard-service.write-text
              source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:106-109
              input: {text: "= input.uri"}
            - return: {open: false}
          configure:
            - call: trusted-domains-configure.configure-opener-trusted-domains
              source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:113-134
              input: {uri: "= input.uri"}
              as: picked
            - return: {open: "= vars.picked.value.trusted"}
          cancel: [{return: {open: false}}]
  - component: trusted-domain-service
    name: is-valid
    kind: function
    summary: "isURLDomainTrusted against product and user trusted domains ('*', exact origin, or *.suffix)."
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomainService.ts:54-59"]
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["https://example.com/docs"]}}}
    behavior:
      - set:
          vars.host: "= input.uri.split('/')[2]"
          vars.all: "= state.product_domains + state.user_domains"
      - return: {valid: "= vars.all.exists(d, d == '*' || d == input.uri.split('/')[0] + '//' + vars.host || (d.contains('*.') && vars.host.endsWith(d.split('*.')[1])))"}
  - component: trusted-domain-service
    name: read-trusted-domains
    kind: function
    summary: "readStaticTrustedDomains: product defaults plus the user list from http.linkProtectionTrustedDomains."
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomains.ts:180-202"]
    behavior:
      - return: {default_trusted_domains: "= state.product_domains", trusted_domains: "= state.user_domains"}
  - component: trusted-domain-service
    name: store-trusted-domains
    kind: function
    summary: "Stores the user list under http.linkProtectionTrustedDomains (APPLICATION, USER); onDidChangeTrustedDomains refreshes the cache."
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomains.ts:150-156"]
    request: {type: object, properties: {domains: {type: array, items: {type: string}}}}
    behavior:
      - set: {state.user_domains: "= input.domains"}
      - return: {stored: true}
  - component: trusted-domains-configure
    name: configure-opener-trusted-domains
    kind: function
    summary: "Quick pick: trust the domain, its subdomains, all domains, or manage; persists a new choice."
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomains.ts:77-165"]
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["https://example.com/docs"]}}}
    behavior:
      - call: trusted-domain-service.read-trusted-domains
        as: current
      - set:
          vars.origin: "= input.uri.split('/')[0] + '//' + input.uri.split('/')[2]"
          vars.host: "= input.uri.split('/')[2]"
      - choice: pick
        default: trust_domain
        source: src/vs/workbench/contrib/url/browser/trustedDomains.ts:136
        options:
          trust_domain: [{set: {vars.item: "= vars.origin"}}]
          trust_subdomains: [{set: {vars.item: "= input.uri.split('/')[0] + '//*.' + vars.host.split('.').slice(size(vars.host.split('.')) - 2, size(vars.host.split('.'))).join('.')"}}]
          trust_all: [{set: {vars.item: "*"}}]
          manage:
            - call: editor-service.open-editor
              source: src/vs/workbench/contrib/url/browser/trustedDomains.ts:142-145
              input: {resource: "trustedDomains:/Trusted Domains"}
            - return: {domains: "= vars.current.value.trusted_domains", trusted: false}
          dismissed: [{return: {domains: [], trusted: false}}]
      - set: {vars.domains: "= vars.item in vars.current.value.trusted_domains ? vars.current.value.trusted_domains : vars.current.value.trusted_domains + [vars.item]"}
      - title: Persist the new trusted domain list
        source: src/vs/workbench/contrib/url/browser/trustedDomains.ts:150-158
        call: trusted-domain-service.store-trusted-domains
        input: {domains: "= vars.domains"}
      - call: trusted-domain-service.is-valid
        source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:127-131
        input: {uri: "= input.uri"}
        as: now_valid
      - return: {domains: "= vars.domains", trusted: "= vars.now_valid.value.valid"}

  # ---------- workspace trust ----------
  - component: workspace-trust-ux-handler
    name: show-modal-on-start
    kind: function
    summary: "Decides whether to ask for workspace trust at startup (security.workspace.trust.startupPrompt)."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:488-523"]
    behavior:
      - call: workspace-trust-management-service.is-workspace-trusted
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:489-491
        as: trust
      - if: "vars.trust.value.trusted"
        then: [{title: "updateWorkbenchIndicators(true)", source: "src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:490", call: workspace-trust-ux-handler.update-workbench-indicators, input: {trusted: true}}, {return: {prompted: false, reason: trusted}}]
      - title: startupPrompt never
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:511
        if: "config['security-workspace-trust-startup-prompt'] == 'never'"
        then: [{title: "updateWorkbenchIndicators(false)", source: "src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:512", call: workspace-trust-ux-handler.update-workbench-indicators, input: {trusted: false}}, {return: {prompted: false, reason: never}}]
      - title: startupPrompt once, and the prompt was already shown in this workspace
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:516
        if: "config['security-workspace-trust-startup-prompt'] == 'once' && state.startup_prompt_shown"
        then: [{title: "updateWorkbenchIndicators(false)", source: "src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:517", call: workspace-trust-ux-handler.update-workbench-indicators, input: {trusted: false}}, {return: {prompted: false, reason: shown-once}}]
      - call: workspace-trust-management-service.request-workspace-trust-on-startup
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:522
      - title: The startup request event reaches this handler (onDidInitiateWorkspaceTrustRequestOnStartup)
        source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:380
        call: workspace-trust-ux-handler.do-show-modal
        as: answer
      - return: {prompted: true, answer: "= vars.answer.value.answer"}
  - component: workspace-trust-ux-handler
    name: do-show-modal
    kind: function
    summary: "\"Do you trust the authors of the files in this folder?\" dialog (cannot be closed without a choice); records that it was shown."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:448-486"]
    behavior:
      - choice: answer
        default: "no"
        options:
          "yes":
            - set: {vars.answer: "yes"}
            - call: workspace-trust-management-service.complete-workspace-trust-request
              source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:462
              input: {trusted: true}
          yes-parent:
            - set: {vars.answer: yes-parent}
            - call: workspace-trust-management-service.set-parent-folder-trust
