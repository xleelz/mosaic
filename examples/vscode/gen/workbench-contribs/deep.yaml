  - component: format-on-save-participant
    name: participate
    kind: function
    summary: "Format on save: skipped for auto save; whole file or modified ranges per editor.formatOnSaveMode."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:226-270"]
    request: *participantReq
    behavior:
      - title: Auto save never formats
        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:230-231
        if: "input.reason == 'auto'"
