configs:
  - id: files-trim-trailing-whitespace
    type: boolean
    value: false
    default: false
    summary: "files.trimTrailingWhitespace, read by TrimWhitespaceParticipant. No product.json override, so deployed = default."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:237-239", "src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:53"]
    attributes: {key: files.trimTrailingWhitespace}
  - id: files-insert-final-newline
    type: boolean
    value: false
    default: false
    summary: "files.insertFinalNewline, read by FinalNewLineParticipant."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:249-251", "src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:121"]
    attributes: {key: files.insertFinalNewline}
  - id: files-trim-final-newlines
    type: boolean
    value: false
    default: false
    summary: "files.trimFinalNewlines, read by TrimFinalNewLinesParticipant."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:255-257", "src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:159"]
    attributes: {key: files.trimFinalNewlines}
  - id: editor-code-actions-on-save
    type: object
    value: {}
    default: {}
    summary: "editor.codeActionsOnSave (object form; array form also accepted). Default {} means no code actions run on save."
    sources: ["src/vs/workbench/contrib/codeActions/browser/codeActionsContribution.ts:71", "src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:330"]
    attributes: {key: editor.codeActionsOnSave}
  - id: files-refactoring-auto-save
    type: boolean
    value: true
    default: true
    summary: "files.refactoring.autoSave: save files touched by a multi-file refactoring when the caller asks to respect it."
    sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:332-339", "src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:272"]
    attributes: {key: files.refactoring.autoSave}
  - id: editor-default-formatter
    type: string
    value: ""
    default: null
    summary: "editor.defaultFormatter: extension id of the default formatter; null (unset) by default, modeled as the empty string."
    sources: ["src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:276-282", "src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:139"]
    attributes: {key: editor.defaultFormatter}
  - id: workbench-trusted-domains-prompt-in-trusted-workspace
    type: boolean
    value: false
    default: false
    summary: "workbench.trustedDomains.promptInTrustedWorkspace: when false, links opened from a trusted workspace skip link protection."
    sources: ["src/vs/workbench/contrib/url/browser/url.contribution.ts:89-92", "src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:66-67"]
    attributes: {key: workbench.trustedDomains.promptInTrustedWorkspace}
  - id: security-workspace-trust-startup-prompt
    type: string
    value: never
    default: never
    summary: "security.workspace.trust.startupPrompt (always | once | never). Default never: no startup trust dialog."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:806-808", "src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:525-527"]
    attributes: {key: security.workspace.trust.startupPrompt}
  - id: security-workspace-trust-banner
    type: string
    value: untilDismissed
    default: untilDismissed
    summary: "security.workspace.trust.banner (always | untilDismissed | never): when the Restricted Mode banner shows."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:819-831", "src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:615-625"]
    attributes: {key: security.workspace.trust.banner}
  - id: workbench-startup-editor
    type: string
    value: welcomePage
    default: welcomePage
    summary: "workbench.startupEditor. Registered with experiment mode auto, so an experiment may change the value at run time."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:317-330", "src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:143"]
    attributes: {key: workbench.startupEditor}
  - id: edit-sessions-store
    type: string
    value: ""
    default: ""
    summary: "product.json editSessions.store.url. The OSS product.json has no editSessions.store, so the deployed value is empty and EditSessionsContribution registers no actions."
    sources: ["src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:169-171", "src/vs/workbench/contrib/editSessions/browser/editSessionsStorageService.ts:87"]
    attributes: {key: editSessions.store, origin: product.json}

components:
  # Boundary components owned by other areas
  - {id: editor-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: command-service, attributes: {boundary: true, owner: platform-core}}
  - {id: configuration-service, attributes: {boundary: true, owner: platform-core}}
  - {id: clipboard-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: file-service, attributes: {boundary: true, owner: platform-core}}
  - {id: workspace-trust-management-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: banner-part, attributes: {boundary: true, owner: workbench-shell}}
  - {id: workspace-context, attributes: {boundary: true, owner: workbench-shell}}
  - {id: preferences-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: snippet-controller2, attributes: {boundary: true, owner: editor}}
  - {id: text-model, attributes: {boundary: true, owner: editor}}
  - {id: format, attributes: {boundary: true, owner: editor}}
  - {id: text-file-service, attributes: {boundary: true, owner: files-search-scm}}
  - {id: working-copy-file-service, attributes: {boundary: true, owner: files-search-scm}}
  - {id: extensions-workbench-service, attributes: {boundary: true, owner: remote-server}}
  - {id: notification-service, attributes: {boundary: true, owner: workbench-shell}}

  # Walkthroughs
  - id: walkthroughs-service
    name: WalkthroughsService
    kind: service
    parent: workbench
    summary: "Registers walkthroughs (built-in and from the walkthroughs extension point) and keeps per-step progress in a PROFILE-scoped memento."
    sources:
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:121
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:44
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:772
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:172-173
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedExtensionPoint.ts:12-13
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:728-731
    state:
      schema: {type: object, properties: {steps: {type: object}, progress: {type: object}}}
      initial:
        steps: {pickColorTheme: Setup, settingsSyncWeb: Setup}
        progress: {}
  - id: getting-started-page
    name: GettingStartedPage
    kind: module
    parent: workbench
    summary: "The Welcome page editor; listens to onDidProgressStep to tick steps and hide completed walkthroughs."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.ts:135"]
  - id: getting-started-commands
    name: gettingStarted.contribution.ts commands
    kind: module
    parent: workbench
    summary: "Module-level registerAction2 calls for the Welcome page and walkthrough commands."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:168-182"]
  - id: startup-page-runner-contribution
    name: StartupPageRunnerContribution
    kind: module
    parent: workbench
    summary: "After restore, opens the startup editor chosen by workbench.startupEditor (welcome page, README or terminal)."
    sources:
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:82
      - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:357

  # Snippets
  - id: snippets-service
    name: SnippetsService
    kind: service
    parent: workbench
    summary: "Loads snippet files (extension, user profile, workspace .vscode) and tracks snippet usage timestamps (PROFILE storage, last 100)."
    sources:
      - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:208
      - src/vs/workbench/contrib/snippets/browser/snippets.ts:10
      - src/vs/workbench/contrib/snippets/browser/snippets.service.contribution.ts:11
      - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:114-115
      - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:170-205
    state:
      schema: {type: object, properties: {snippets: {type: object}, usage: {type: object}}}
      initial:
        snippets:
          typescript:
            - {id: "vscode.typescript-basics/For Loop", name: For Loop, prefix: for, body: "for (let ${1:index} = 0; ${1:index} < ${2:array}.length; ${1:index}++) {\n\tconst ${3:element} = ${2:array}[${1:index}];\n\t$TM_SELECTED_TEXT$0\n}", needs_clipboard: false, uses_selection: true, is_file_template: false}
            - {id: "vscode.typescript-basics/Class Definition", name: Class Definition, prefix: class, body: "class ${1:name} {\n\tconstructor(${2:parameters}) {\n\t\t$0\n\t}\n}", needs_clipboard: false, uses_selection: false, is_file_template: true}
        usage: {}
  - id: insert-snippet-action
    name: InsertSnippetAction
    kind: module
    parent: workbench
    summary: "editor.action.insertSnippet: inserts a snippet given inline, by name, or picked by the user."
    sources:
      - src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:46-51
      - src/vs/workbench/contrib/snippets/browser/snippets.contribution.ts:26

  # Link protection
  - id: opener-validator-contributions
    name: OpenerValidatorContributions
    kind: module
    parent: workbench
    summary: "Registers an opener validator that asks before opening http(s) links to untrusted domains."
    sources:
      - src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:26
      - src/vs/workbench/contrib/url/browser/url.contribution.ts:69-72
  - id: trusted-domain-service
    name: TrustedDomainService
    kind: service
    parent: workbench
    summary: "Answers whether a URL's domain is trusted, from product.json linkProtectionTrustedDomains and the user's http.linkProtectionTrustedDomains (APPLICATION storage)."
    sources:
      - src/vs/workbench/contrib/url/browser/trustedDomainService.ts:19
      - src/vs/workbench/contrib/url/common/trustedDomainService.ts:10
      - src/vs/workbench/contrib/url/browser/url.contribution.ts:98
    state:
      schema: {type: object, properties: {user_domains: {type: array, items: {type: string}}, product_domains: {type: array, items: {type: string}}}}
      initial: {user_domains: [], product_domains: []}
  - id: trusted-domains-configure
    name: configureOpenerTrustedDomainsHandler
    kind: function
    parent: workbench
    summary: "Quick pick offering to trust a domain, its subdomains or all domains, then persisting the list."
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomains.ts:77-165"]

  # Workspace trust UX
  - id: workspace-trust-ux-handler
    name: WorkspaceTrustUXHandler
    kind: module
    parent: workbench
    summary: "Startup trust prompt, restricted-mode banner and status bar entry."
    sources:
      - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:287
      - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:706
    state:
      schema: {type: object, properties: {startup_prompt_shown: {type: boolean}, banner_dismissed: {type: boolean}}}
      initial: {startup_prompt_shown: false, banner_dismissed: false}
  - id: workspace-trust-request-handler
    name: WorkspaceTrustRequestHandler
    kind: module
    parent: workbench
    summary: "Shows the dialog for workspace trust requests raised by features (requestWorkspaceTrust) and completes or cancels them."
    sources:
      - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:101
      - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:705
  - id: workspace-trust-commands
    name: workspace.contribution.ts trust commands
    kind: module
    parent: workbench
    summary: "workbench.trust.configure and workbench.trust.manage."
    sources:
      - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:751
      - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:769

  # Save participants
  - id: save-participants-contribution
    name: SaveParticipantsContribution
    kind: module
    parent: workbench
    summary: "Registers the text file save participants in order: trim whitespace, code actions, format, final newline, trim final newlines."
    sources:
      - src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:444-462
      - src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:465
  - {id: trim-whitespace-participant, name: TrimWhitespaceParticipant, kind: module, parent: save-participants-contribution, summary: "Trims trailing whitespace on save when files.trimTrailingWhitespace is on.", sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:48-58"]}
  - {id: final-new-line-participant, name: FinalNewLineParticipant, kind: module, parent: save-participants-contribution, summary: "Inserts a final newline on save when files.insertFinalNewline is on.", sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:116-124"]}
  - {id: format-on-save-participant, name: FormatOnSaveParticipant, kind: module, parent: save-participants-contribution, summary: "Formats the document, or only modified ranges, on non-auto saves when editor.formatOnSave is on.", sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:226-270"]}
  - {id: code-action-on-save-participant, name: CodeActionOnSaveParticipant, kind: module, parent: save-participants-contribution, summary: "Runs editor.codeActionsOnSave kinds on save.", sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:321-378"]}
  - {id: format-modified, name: formatModified.ts, kind: module, parent: workbench, summary: "Computes the ranges changed against the SCM original (getModifiedRanges) and editor.action.formatChanges.", sources: ["src/vs/workbench/contrib/format/browser/formatModified.ts:51-82", "src/vs/workbench/contrib/format/browser/formatModified.ts:23"]}

  # Format
  - id: format-document-none-action
    name: formatActionsNone.ts
    kind: module
    parent: workbench
    summary: "editor.action.formatDocument.none: shown when no formatter is registered; dispatches to the real format command or offers formatter extensions."
    sources: ["src/vs/workbench/contrib/format/browser/formatActionsNone.ts:19"]
  - id: default-formatter
    name: DefaultFormatter
    kind: module
    parent: workbench
    summary: "Formatter selector for conflicts: honors editor.defaultFormatter, else prompts the user to configure one."
    sources: ["src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:39", "src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:271"]

  # Bulk edit
  - id: bulk-edit-service
    name: BulkEditService
    kind: service
    parent: workbench
    summary: "Applies workspace edits (text, file, cell) with optional refactor preview, undo grouping, shutdown veto and refactoring auto save."
    sources:
      - src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:206-286
      - src/vs/editor/browser/services/bulkEditService.ts:17
      - src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:330
  - {id: bulk-edit, name: BulkEdit, kind: module, parent: bulk-edit-service, summary: "Splits edits into runs by type and dispatches each run.", sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:99-142"]}
  - {id: bulk-text-edits, name: BulkTextEdits, kind: module, parent: bulk-edit-service, summary: "Validates model versions and applies text edits as one undo element.", sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkTextEdits.ts:293-339"]}
  - {id: bulk-file-edits, name: BulkFileEdits, kind: module, parent: bulk-edit-service, summary: "Creates, renames, copies and deletes files through the working copy file service.", sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkFileEdits.ts:243-244"]}
  - id: bulk-edit-preview-contribution
    name: BulkEditPreviewContribution
    kind: module
    parent: workbench
    summary: "Installs the refactor preview handler and the refactorPreview.apply/discard commands."
    sources:
      - src/vs/workbench/contrib/bulkEdit/browser/preview/bulkEdit.contribution.ts:89
      - src/vs/workbench/contrib/bulkEdit/browser/preview/bulkEdit.contribution.ts:322

  # Edit sessions (Cloud Changes)
  - id: edit-sessions-contribution
    name: EditSessionsContribution
    kind: module
    parent: workbench
    summary: "Cloud Changes: registers its actions only when product.json configures editSessions.store; stores and resumes working changes."
    sources: ["src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:1154"]
    state:
      schema: {type: object, properties: {actions_registered: {type: boolean}}}
      initial: {actions_registered: false}
  - id: edit-sessions-workbench-service
    name: EditSessionsWorkbenchService
    kind: service
    parent: workbench
    summary: "Authenticates against the edit sessions store and reads, writes and deletes edit session resources."
    sources:
      - src/vs/workbench/contrib/editSessions/browser/editSessionsStorageService.ts:36
      - src/vs/workbench/contrib/editSessions/common/editSessions.ts:23
      - src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:75
    state:
      schema: {type: object, properties: {initialized: {type: boolean}}}
      initial: {initialized: false}
  - id: edit-sessions-store-client
    name: EditSessionsStoreClient
    kind: datastore
    parent: workbench
    summary: "Client of the remote edit sessions store; modeled as the store's rows (latest resource content and ref)."
    sources: ["src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:173"]
    state:
      schema: {type: object, properties: {resources: {type: object}}}
      initial: {resources: {}}

