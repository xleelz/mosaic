        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:261-263
        if: "vars.ranges.value.status == 'no-scm' && config['editor-format-on-save-mode'] == 'modificationsIfAvailable'"
        then:
          - call: format.format-document-with-selected-provider
            input: {resource: "= input.resource", mode: silent}
          - return: {formatted: file}
      - if: "vars.ranges.value.status == 'ranges'"
        source: src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:265-267
        then:
          - call: format.format-document-ranges-with-selected-provider
            input: {resource: "= input.resource", ranges: "= vars.ranges.value.ranges", mode: silent}
