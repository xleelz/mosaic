flows:
  - id: walkthrough-mark-step-complete
    name: Mark a walkthrough step complete
    tags: [writes]
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:168-182"]
    entry: {caller: user, interface: getting-started-commands.cmd-welcome-mark-step-complete, input: {arg: pickColorTheme}}
  - id: walkthrough-mark-step-incomplete
    name: Mark a walkthrough step incomplete
    tags: [writes]
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:184-198"]
    entry: {caller: user, interface: getting-started-commands.cmd-welcome-mark-step-incomplete, input: {arg: pickColorTheme}}
  - id: walkthroughs-read
    name: Welcome page reads walkthroughs with progress
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:488-505"]
    entry: {caller: workbench, interface: walkthroughs-service.get-walkthroughs}
  - id: snippets-insert
    name: Insert a snippet (editor.action.insertSnippet)
    tags: [writes]
    sources: ["src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:79-150"]
    entry: {caller: user, interface: insert-snippet-action.cmd-editor-action-insert-snippet, input: {name: For Loop, lang_id: typescript}}
  - id: snippets-list
    name: List snippets for a language (completion, pickers)
    sources: ["src/vs/workbench/contrib/snippets/browser/snippetsService.ts:278-303"]
    entry: {caller: editor, interface: snippets-service.get-snippets, input: {language_id: typescript}}
  - id: link-protection-open
    name: Open an external link through link protection
    tags: [writes]
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:46-145"]
    entry: {caller: platform, interface: opener-validator-contributions.validate-link, input: {uri: "https://example.com/docs"}}
  - id: trusted-domain-check
    name: Check whether a URL's domain is trusted
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomainService.ts:54-59"]
    entry: {caller: platform, interface: trusted-domain-service.is-valid, input: {uri: "https://example.com/docs"}}
  - id: workspace-trust-startup-prompt
    name: Workspace trust prompt at startup
    tags: [writes]
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:488-523"]
    entry: {caller: workbench, interface: workspace-trust-ux-handler.show-modal-on-start}
  - id: workspace-trust-startup-prompt-next-start
    name: Next start of the same workspace re-evaluates the startup prompt
    description: "The same startup check in a later window of the workspace; it reads workspace.trust.startupPrompt.shown written by the first prompt."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:516"]
    entry: {caller: workbench, interface: workspace-trust-ux-handler.show-modal-on-start}
  - id: workspace-trust-request
    name: A feature requests workspace trust
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:204-279"]
    entry: {caller: workbench, interface: workspace-trust-request-handler.on-did-initiate-workspace-trust-request, input: {message: "Running tasks requires a trusted workspace."}}
  - id: workspace-trust-manage
    name: Manage Workspace Trust command
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:766-789"]
    entry: {caller: user, interface: workspace-trust-commands.cmd-workbench-trust-manage}
  - id: workspace-trust-configure
    name: Configure Workspace Trust Settings command
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:748-765"]
    entry: {caller: user, interface: workspace-trust-commands.cmd-workbench-trust-configure}
  - id: save-participant-trim-whitespace
    name: Trim trailing whitespace on save
    sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:48-58"]
    entry: {caller: text-file-models, interface: trim-whitespace-participant.participate, input: {resource: "file:///work/app/src/main.ts", reason: explicit, content: "const a = 1;  \nconsole.log(a)"}}
  - id: save-participant-final-newline
    name: Insert final newline on save
    sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:116-141"]
    entry: {caller: text-file-models, interface: final-new-line-participant.participate, input: {resource: "file:///work/app/src/main.ts", reason: explicit, content: "import { add } from './util';\nconsole.log(add(1, 2))"}}
  - id: save-participant-format-on-save
    name: Format on save
    tags: ["feature:format-on-save"]
    sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:226-270"]
    entry: {caller: text-file-models, interface: format-on-save-participant.participate, input: {resource: "file:///work/app/src/main.ts", reason: explicit, content: "import { add } from './util';\nconsole.log(add(1, 2))\n"}}
  - id: save-participant-code-actions
    name: Code actions on save
    sources: ["src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:321-378"]
    entry: {caller: text-file-models, interface: code-action-on-save-participant.participate, input: {resource: "file:///work/app/src/main.ts", reason: explicit, content: "import { add } from './util';\n"}}
  - id: format-document-none
    name: Format Document with no formatter context
    sources: ["src/vs/workbench/contrib/format/browser/formatActionsNone.ts:35-66"]
    entry: {caller: user, interface: format-document-none-action.cmd-editor-action-format-document-none, input: {resource: "file:///work/app/src/main.ts", language_id: typescript}}
  - id: default-formatter-select
    name: Select a formatter when several conflict
    sources: ["src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:176-203"]
    entry: {caller: editor, interface: default-formatter.select-formatter, input: {formatters: ["esbenp.prettier-vscode", "vscode.typescript-language-features"], mode: explicit, language_id: typescript}}
  - id: bulk-edit-apply
    name: Apply a workspace edit
    sources: ["src/vs/workbench/contrib/bulkEdit/browser/bulkEditService.ts:206-286"]
    entry: {caller: exthost-bridge, interface: bulk-edit-service.apply}
  - id: edit-sessions-startup
    name: Cloud Changes contribution startup
    tags: [writes]
    sources: ["src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:165-181"]
    entry: {caller: workbench, interface: edit-sessions-contribution.start}
  - id: edit-sessions-store
    name: Store working changes in the cloud
    tags: [writes]
    sources: ["src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:458-487"]
    entry: {caller: user, interface: edit-sessions-contribution.cmd-workbench-edit-sessions-actions-store-current}
  - id: edit-sessions-resume
    name: Resume latest changes from the cloud
    tags: [writes]
    sources: ["src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:424-436"]
    entry: {caller: user, interface: edit-sessions-contribution.cmd-workbench-edit-sessions-actions-resume-latest}
  - id: edit-sessions-list
    name: List stored edit sessions
    sources: ["src/vs/workbench/contrib/editSessions/browser/editSessionsStorageService.ts:172-185"]
    entry: {caller: workbench, interface: edit-sessions-workbench-service.list}
  - id: workbench-contribs-startup
    name: Workbench contributions load and the startup editor opens
    description: "Contribution modules register their commands at import time and the workbench instantiates registered contributions by phase; once restored, StartupPageRunnerContribution opens the startup editor. The steps list the contribution modules of this area."
    sources: ["src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:113-153"]
    entry: {caller: workbench, interface: startup-page-runner-contribution.run}

scenarios:
  # walkthroughs
  - id: workbench-contribs-walkthrough-complete-happy
    flow: walkthrough-mark-step-complete
    fixtures: [one-window-folder, workbench-contribs-seed]
    expect:
      - "result.ok && result.value.progressed"
      - "state['walkthroughs-service@w1'].progress.pickColorTheme.done == true"
      - "trace.exists(e, e.type == 'publish' || (e.type == 'call.start' && e.interface == 'walkthroughs-service.progress-step'))"
  - id: workbench-contribs-walkthrough-complete-no-arg
    flow: walkthrough-mark-step-complete
    fixtures: [one-window-folder, workbench-contribs-seed]
    input: {arg: ""}
    expect:
      - "result.ok && !result.value.progressed"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'walkthroughs-service.progress-step')"
  - id: workbench-contribs-walkthrough-complete-unknown-step
    flow: walkthrough-mark-step-complete
    fixtures: [one-window-folder, workbench-contribs-seed]
    input: {arg: noSuchStep}
    expect:
      - "!result.ok && result.error.code == 'tried-to-progress-unknown-step'"
      - "state['walkthroughs-service@w1'].progress.noSuchStep.done == true"
  - id: workbench-contribs-walkthrough-complete-already-done
    flow: walkthrough-mark-step-complete
    fixtures: [one-window-folder, workbench-contribs-seed]
    state: {"walkthroughs-service@w1": {progress: {pickColorTheme: {done: true}}}}
    expect:
      - "result.ok"
      - "!trace.exists(e, e.type == 'set' && e.component == 'walkthroughs-service')"
  - id: workbench-contribs-walkthrough-complete-then-read
    fixtures: [one-window-folder, workbench-contribs-seed]
    steps:
      - {flow: walkthrough-mark-step-complete, as: w}
      - {flow: walkthroughs-read, as: r}
    expect:
      - "steps.w.result.ok"
      - "steps.r.result.value.steps.exists(s, s.id == 'pickColorTheme' && s.done)"
      - "steps.r.result.value.steps.exists(s, s.id == 'settingsSyncWeb' && !s.done)"
      - "state['walkthroughs-service@w1'].progress.pickColorTheme.done"
  - id: workbench-contribs-walkthrough-incomplete-then-read
    fixtures: [one-window-folder, workbench-contribs-seed]
    steps:
      - {flow: walkthrough-mark-step-complete, as: w}
      - {flow: walkthrough-mark-step-incomplete, as: u}
      - {flow: walkthroughs-read, as: r}
    expect:
      - "steps.u.result.ok"
      - "steps.r.result.value.steps.exists(s, s.id == 'pickColorTheme' && !s.done)"
      - "!('pickColorTheme' in state['walkthroughs-service@w1'].progress)"
  - id: workbench-contribs-walkthrough-incomplete-no-arg
    flow: walkthrough-mark-step-incomplete
    fixtures: [one-window-folder, workbench-contribs-seed]
    input: {arg: ""}
    expect:
      - "result.ok"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'walkthroughs-service.deprogress-step')"

  # snippets
  - id: workbench-contribs-snippets-insert-by-name
    flow: snippets-insert
    fixtures: [editor-dirty, workbench-contribs-seed]
    expect:
      - "result.ok && result.value.inserted"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'snippet-controller2.insert' && e.input.template.startsWith('for (let'))"
      - "'vscode.typescript-basics/For Loop' in state['snippets-service@w1'].usage"
  - id: workbench-contribs-snippets-insert-not-found
    flow: snippets-insert
    fixtures: [editor-dirty, workbench-contribs-seed]
    input: {name: No Such Snippet}
    expect:
      - "result.ok && !result.value.inserted"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'snippet-controller2.insert')"
      - "size(state['snippets-service@w1'].usage) == 0"
  - id: workbench-contribs-snippets-insert-unregistered-language
    flow: snippets-insert
    fixtures: [editor-dirty, workbench-contribs-seed]
    input: {lang_id: notalanguage}
    choices: {insert-snippet-action.cmd-editor-action-insert-snippet.language_registered: unregistered}
    expect:
      - "result.ok && !result.value.inserted"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'snippets-service.get-snippets')"
  - id: workbench-contribs-snippets-insert-inline-clipboard
    flow: snippets-insert
    fixtures: [editor-dirty, workbench-contribs-seed]
    input: {snippet: "console.log($CLIPBOARD)"}
    expect:
      - "result.ok && result.value.inserted && result.value.id.startsWith('random/')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'clipboard-service.read-text')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'snippet-controller2.insert' && e.input.template == 'console.log($CLIPBOARD)')"
      - "size(state['snippets-service@w1'].usage) == 1"
  - id: workbench-contribs-snippets-insert-pick-dismissed
    fixtures: [editor-dirty, workbench-contribs-seed]
    steps:
      - {interface: insert-snippet-action.cmd-editor-action-insert-snippet, caller: user, input: {}, choices: {insert-snippet-action.cmd-editor-action-insert-snippet.pick: dismissed}, as: p}
    expect:
      - "steps.p.result.ok && !steps.p.result.value.inserted"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'snippet-controller2.insert')"
  - id: workbench-contribs-snippets-insert-pick-first
    fixtures: [editor-dirty, workbench-contribs-seed]
    steps:
      - {interface: insert-snippet-action.cmd-editor-action-insert-snippet, caller: user, input: {}, as: p}
    expect:
      - "steps.p.result.ok && steps.p.result.value.inserted"
      - "'vscode.typescript-basics/For Loop' in state['snippets-service@w1'].usage"
  - id: workbench-contribs-snippets-insert-then-list
    fixtures: [editor-dirty, workbench-contribs-seed]
    steps:
      - {flow: snippets-insert, as: i}
      - {flow: snippets-list, as: l}
    expect:
      - "steps.i.result.value.inserted"
      - "steps.l.result.value.snippets[0].name == 'For Loop' && steps.l.result.value.snippets[0].last_used > 0"
      - "state['snippets-service@w1'].usage['vscode.typescript-basics/For Loop'] > 0"
  - id: workbench-contribs-snippets-list-unknown-language
    flow: snippets-list
    fixtures: [one-window-folder, workbench-contribs-seed]
    input: {language_id: cobol}
    expect:
      - "result.ok && size(result.value.snippets) == 0"

  # link protection
  - id: workbench-contribs-link-open-prompt-open
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    expect:
      - "result.ok && result.value.open"
      - "trace.exists(e, e.type == 'choice' && e.key == 'opener-validator-contributions.validate-link.link_prompt')"
  - id: workbench-contribs-link-open-non-http
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    input: {uri: "file:///work/app/README.md"}
    expect:
      - "result.ok && result.value.open"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'trusted-domain-service.is-valid')"
  - id: workbench-contribs-link-open-trusted-domain
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    state: {"trusted-domain-service@w1": {user_domains: ["https://*.example.com", "https://example.com"]}}
    expect:
      - "result.ok && result.value.open"
      - "!trace.exists(e, e.type == 'choice')"
  - id: workbench-contribs-link-open-copy
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    choices: {opener-validator-contributions.validate-link.link_prompt: copy}
    expect:
      - "result.ok && !result.value.open"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'clipboard-service.write-text' && e.input.text == 'https://example.com/docs')"
  - id: workbench-contribs-link-open-cancel
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    choices: {opener-validator-contributions.validate-link.link_prompt: cancel}
    expect:
      - "result.ok && !result.value.open"
      - "size(state['trusted-domain-service@w1'].user_domains) == 0"
  - id: workbench-contribs-link-open-from-trusted-workspace
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    input: {from_workspace: true}
    expect:
      - "result.ok && result.value.open"
      - "!trace.exists(e, e.type == 'choice' && e.key == 'opener-validator-contributions.validate-link.link_prompt')"
  - id: workbench-contribs-link-open-from-workspace-prompts
    flow: link-protection-open
    fixtures: [untrusted-folder, workbench-contribs-seed]
    input: {from_workspace: true}
    choices: {opener-validator-contributions.validate-link.link_prompt: cancel}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'workspace-trust-management-service.is-workspace-trusted')"
      - "result.ok && !result.value.open"
  - id: workbench-contribs-link-open-configure-trust-domain
    fixtures: [one-window-folder, workbench-contribs-seed]
    steps:
      - {flow: link-protection-open, as: o, choices: {opener-validator-contributions.validate-link.link_prompt: configure}}
      - {flow: trusted-domain-check, as: c}
      - {flow: link-protection-open, as: again}
    expect:
      - "steps.o.result.value.open"
      - "state['trusted-domain-service@w1'].user_domains == ['https://example.com']"
      - "steps.c.result.value.valid"
      - "steps.again.result.value.open && trace.filter(e, e.type == 'choice' && e.key == 'opener-validator-contributions.validate-link.link_prompt').size() == 1"
  - id: workbench-contribs-link-open-configure-subdomains
    fixtures: [one-window-folder, workbench-contribs-seed]
    steps:
      - {flow: link-protection-open, as: o, input: {uri: "https://docs.example.com/a"}, choices: {opener-validator-contributions.validate-link.link_prompt: configure, trusted-domains-configure.configure-opener-trusted-domains.pick: trust_subdomains}}
      - {flow: trusted-domain-check, as: c, input: {uri: "https://api.example.com/v1"}}
    expect:
      - "steps.o.result.value.open"
      - "state['trusted-domain-service@w1'].user_domains == ['https://*.example.com']"
      - "steps.c.result.value.valid"
  - id: workbench-contribs-link-open-configure-trust-all
    fixtures: [one-window-folder, workbench-contribs-seed]
    steps:
      - {flow: link-protection-open, as: o, choices: {opener-validator-contributions.validate-link.link_prompt: configure, trusted-domains-configure.configure-opener-trusted-domains.pick: trust_all}}
      - {flow: trusted-domain-check, as: c, input: {uri: "https://anything.test/x"}}
    expect:
      - "state['trusted-domain-service@w1'].user_domains == ['*']"
      - "steps.c.result.value.valid"
  - id: workbench-contribs-link-open-configure-manage
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    choices: {opener-validator-contributions.validate-link.link_prompt: configure, trusted-domains-configure.configure-opener-trusted-domains.pick: manage}
    expect:
      - "result.ok && !result.value.open"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.resource == 'trustedDomains:/Trusted Domains')"
      - "size(state['trusted-domain-service@w1'].user_domains) == 0"
  - id: workbench-contribs-link-open-configure-dismissed
    flow: link-protection-open
    fixtures: [one-window-folder, workbench-contribs-seed]
    choices: {opener-validator-contributions.validate-link.link_prompt: configure, trusted-domains-configure.configure-opener-trusted-domains.pick: dismissed}
    expect:
      - "result.ok && !result.value.open"
      - "size(state['trusted-domain-service@w1'].user_domains) == 0"

  # workspace trust
  - id: workbench-contribs-trust-startup-default-never
    flow: workspace-trust-startup-prompt
    fixtures: [untrusted-folder, workbench-contribs-seed]
    expect:
      - "result.ok && !result.value.prompted && result.value.reason == 'never'"
      - "!state['workspace-trust-ux-handler@w1'].startup_prompt_shown"
  - id: workbench-contribs-trust-startup-always-yes
    flow: workspace-trust-startup-prompt
    fixtures: [untrusted-folder, workbench-contribs-seed]
    config: {security-workspace-trust-startup-prompt: always}
    choices: {workspace-trust-ux-handler.do-show-modal.answer: "yes"}
    expect:
      - "result.ok && result.value.prompted && result.value.answer == 'yes'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'workspace-trust-management-service.complete-workspace-trust-request' && e.input.trusted)"
      - "state['workspace-trust-ux-handler@w1'].startup_prompt_shown"
  - id: workbench-contribs-trust-startup-always-parent
    flow: workspace-trust-startup-prompt
    fixtures: [untrusted-folder, workbench-contribs-seed]
    config: {security-workspace-trust-startup-prompt: always}
    choices: {workspace-trust-ux-handler.do-show-modal.answer: yes-parent}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'workspace-trust-management-service.set-parent-folder-trust')"
      - "state['workspace-trust-ux-handler@w1'].startup_prompt_shown"
  - id: workbench-contribs-trust-startup-once-then-next-start
    fixtures: [untrusted-folder, workbench-contribs-seed]
    config: {security-workspace-trust-startup-prompt: once}
    steps:
      - {flow: workspace-trust-startup-prompt, as: first}
      - {flow: workspace-trust-startup-prompt-next-start, as: second}
    expect:
      - "steps.first.result.value.prompted && steps.first.result.value.answer == 'no'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'workspace-trust-management-service.cancel-workspace-trust-request')"
      - "!steps.second.result.value.prompted && steps.second.result.value.reason == 'shown-once'"
      - "state['workspace-trust-ux-handler@w1'].startup_prompt_shown"
  - id: workbench-contribs-trust-startup-never-shows-banner
    flow: workspace-trust-startup-prompt
    fixtures: [untrusted-folder, workbench-contribs-seed]
    expect:
      - "result.value.reason == 'never'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'banner-part.show' && e.input.id == 'workbench.banner.restrictedMode' && e.input.message.contains('Trust this folder'))"
  - id: workbench-contribs-trust-banner-setting-never
    flow: workspace-trust-startup-prompt
    fixtures: [untrusted-folder, workbench-contribs-seed]
    config: {security-workspace-trust-banner: never}
    expect:
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'banner-part.show')"
  - id: workbench-contribs-trust-change-hides-banner
    fixtures: [untrusted-folder, workbench-contribs-seed]
    steps:
      - {interface: workspace-trust-ux-handler.on-did-change-trust, caller: workspace-trust-management-service, input: {trusted: false}, as: untrust}
      - {interface: workspace-trust-ux-handler.on-did-change-trust, caller: workspace-trust-management-service, input: {trusted: true}, as: retrust}
    expect:
      - "steps.untrust.result.value.banner == 'shown' && steps.retrust.result.value.banner == 'hidden'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'banner-part.hide' && e.input.id == 'workbench.banner.restrictedMode')"
  - id: workbench-contribs-trust-banner-dismissed
    fixtures: [untrusted-folder, workbench-contribs-seed]
    steps:
      - {interface: workspace-trust-ux-handler.dismiss-banner, caller: user, as: d}
      - {interface: workspace-trust-ux-handler.on-did-change-trust, caller: workspace-trust-management-service, input: {trusted: false}, as: untrust}
    expect:
      - "steps.untrust.result.value.banner == 'none'"
      - "state['workspace-trust-ux-handler@w1'].banner_dismissed"
  - id: workbench-contribs-trust-request-trust
    flow: workspace-trust-request
