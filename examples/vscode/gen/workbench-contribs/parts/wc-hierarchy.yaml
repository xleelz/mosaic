scenarios:
- id: workbench-contribs-hierarchy-call-controller-created
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: call-hierarchy-controller.constructor
    caller: editor
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.set-context' && e.input.key == 'callHierarchyVisible')
- id: workbench-contribs-hierarchy-editor-showcallhierarchy
  fixtures:
  - editor-main-open
  - workbench-contribs-seed
  steps:
  - interface: main-thread-language-features.register-call-hierarchy-provider
    caller: exthost-bridge
    input:
      handle: 9
      selector: typescript
      extension_id: vscode.typescript-language-features
  - interface: call-hierarchy-contribution.cmd-editor-showcallhierarchy
    caller: user
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - steps.s.result.value.shown
  - trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.prepare-call-hierarchy')
  - state['call-hierarchy-controller@w1'].visible
- id: workbench-contribs-hierarchy-call-hierarchy-no-provider
  fixtures:
  - editor-main-open
  - workbench-contribs-seed
  steps:
  - interface: call-hierarchy-contribution.cmd-editor-showcallhierarchy
    caller: user
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - '!steps.s.result.value.shown'
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''ext-host-language-features.prepare-call-hierarchy'')'
- id: workbench-contribs-hierarchy-editor-showincomingcalls
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: call-hierarchy-contribution.cmd-editor-showincomingcalls
    caller: user
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - state['call-hierarchy-contribution@w1'].direction == 'callsTo'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.set-context' && e.input.value == 'callsTo')
- id: workbench-contribs-hierarchy-editor-showoutgoingcalls
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: call-hierarchy-contribution.cmd-editor-showoutgoingcalls
