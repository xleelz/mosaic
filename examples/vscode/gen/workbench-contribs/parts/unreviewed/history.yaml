    type: object
    properties:
      restored:
        type: boolean
  behavior:
  - call: local-history-commands.find-local-history-entry
    source: src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:264
    input:
      uri: = input.uri
      handle: = input.handle
    as: found
  - if: vars.found.value.entry == null
    then:
    - return:
