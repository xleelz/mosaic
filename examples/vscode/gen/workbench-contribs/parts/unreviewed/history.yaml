- component: views-welcome-contribution
  name: handle-extension-point
  kind: function
  summary: 'The viewsWelcome extension point handler: disposes removed contents, then registers added contents per view id (explorer, debug, scm, testing aliases), with group@order only under the contribViewsWelcome
    proposal.'
  sources:
  - src/vs/workbench/contrib/welcomeViews/common/viewsWelcome.contribution.ts:14
  - src/vs/workbench/contrib/welcomeViews/common/viewsWelcomeContribution.ts:25-65
  - src/vs/workbench/contrib/welcomeViews/common/viewsWelcomeContribution.ts:69-88
  request:
    type: object
    properties:
      added:
        type: array
        items:
          type: object
          properties:
            extension_id:
              type: string
            proposals:
              type: array
              items:
                type: string
            welcomes:
              type: array
              items:
                type: object
                properties:
                  view:
                    type: string
                  contents:
                    type: string
                  when:
                    type: string
                  group:
                    type: string
        default: []
      removed:
        type: array
        items:
          type: string
        default: []
  behavior:
  - title: Dispose the contents of removed contributions
    source: src/vs/workbench/contrib/welcomeViews/common/viewsWelcomeContribution.ts:26-32
    set:
      state.contents: = state.contents.transformMap(v, list, list.filter(w, !(w.extension_id in input.removed)))
  - foreach: = input.added
    as: contrib
    steps:
    - foreach: = vars.contrib.welcomes
      as: w
      steps:
      - title: group (and @order) needs the contribViewsWelcome API proposal, else a warning and no group
        source: src/vs/workbench/contrib/welcomeViews/common/viewsWelcomeContribution.ts:73-86
        set:
          vars.allowed: = has(vars.w.group) && vars.w.group != '' && has(vars.contrib.proposals) && 'contribViewsWelcome' in vars.contrib.proposals
      - set:
          vars.group: '= vars.allowed ? (vars.w.group.lastIndexOf(''@'') > 0 ? vars.w.group.substring(0, vars.w.group.lastIndexOf(''@'')) : vars.w.group) : null'
      - title: Short view names map to the real view ids
        source: src/vs/workbench/contrib/welcomeViews/common/viewsWelcomeContribution.ts:41
        set:
          vars.view_id: '= vars.w.view in {''explorer'': 1, ''debug'': 1, ''scm'': 1, ''testing'': 1} ? {''explorer'': ''workbench.explorer.emptyView'', ''debug'': ''workbench.debug.welcome'', ''scm'':
            ''workbench.scm'', ''testing'': ''workbench.view.testing''}[vars.w.view] : vars.w.view'
      - title: registerViewWelcomeContent2 for the view
        source: src/vs/workbench/contrib/welcomeViews/common/viewsWelcomeContribution.ts:58-64
        set:
          state.contents: '= merge(state.contents, {vars.view_id: (vars.view_id in state.contents ? state.contents[vars.view_id] : []) + [{''extension_id'': vars.contrib.extension_id, ''content'': vars.w.contents,
            ''group'': vars.group}]})'
  - return:
      views: = state.contents.map(k, k)
