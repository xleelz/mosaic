configs:
- id: comments-visible
  type: boolean
  value: true
  default: true
  summary: 'comments.visible: whether the commenting bar and comment threads show in editors; CommentService starts with isCommentingEnabled = this value. No product.json override, so deployed = default.'
  sources:
  - src/vs/workbench/contrib/comments/browser/comments.contribution.ts:127-131
  - src/vs/workbench/contrib/comments/browser/commentService.ts:285-287
  attributes:
    key: comments.visible
- id: editor-snippets-code-actions-enabled
  type: boolean
  value: true
  default: true
  summary: 'editor.snippets.codeActions.enabled: SnippetCodeActions registers the surround-with and file-template code action providers only when true. No product.json override.'
  sources:
  - src/vs/workbench/contrib/snippets/browser/snippets.contribution.ts:42-46
  - src/vs/workbench/contrib/snippets/browser/snippetCodeActionProvider.ts:139
  attributes:
    key: editor.snippets.codeActions.enabled
- id: editor-tab-completion
  type: string
  value: 'off'
  default: 'off'
  summary: editor.tabCompletion (on | off | onlySnippets); TabCompletionController is enabled only for onlySnippets.
  sources:
  - src/vs/editor/common/config/editorOptions.ts:6818-6821
  - src/vs/workbench/contrib/snippets/browser/tabCompletion.ts:67
  attributes:
    key: editor.tabCompletion
    boundary: true
    owner: editor
- id: workbench-welcome-page-walkthroughs-open-on-install
  type: boolean
  value: true
  default: true
  summary: 'workbench.welcomePage.walkthroughs.openOnInstall: open an extension''s walkthrough when it is installed in this session. No product.json override.'
  sources:
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStarted.contribution.ts:311-316
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:441
  attributes:
    key: workbench.welcomePage.walkthroughs.openOnInstall
components:
- id: local-history-timeline
  name: LocalHistoryTimeline
  kind: module
  parent: local-history-contribution
  summary: Workbench contribution (BlockRestore) that registers the Local History timeline provider (when workbench.localHistory.enabled) and the vscode-local-history file system provider, and turns working
    copy history entries into timeline items.
  sources:
  - src/vs/workbench/contrib/localHistory/browser/localHistoryTimeline.ts:28
- id: user-data-profiles-workbench-contribution
  name: UserDataProfilesWorkbenchContribution
  kind: module
  parent: user-data-profile-contribution
  summary: Workbench contribution (BlockRestore) that binds the currentProfile/hasProfiles context keys, registers the Profiles editor, the profile actions (one profile-entry and one new-window action per
    non-internal profile) and the profile URL handler. Its state mirrors the profiles it read from IUserDataProfilesService and the current profile from IUserDataProfileService.
  sources:
  - src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:43-93
  state:
    schema:
      type: object
      properties:
        profiles:
          type: array
        current_profile_id:
          type: string
        registered_actions:
          type: array
    initial:
      profiles:
      - id: __default__profile__
        name: Default
        is_default: true
        is_internal: false
      current_profile_id: __default__profile__
      registered_actions: []
- id: user-data-profiles-editor-model
  name: UserDataProfilesEditorModel
  kind: module
  parent: user-data-profile
  summary: The model behind the Profiles editor; holds the profile being created (newProfileElement) and the selected profile.
  sources:
  - src/vs/workbench/contrib/userDataProfile/browser/userDataProfilesEditorModel.ts:1035
  - src/vs/workbench/contrib/userDataProfile/browser/userDataProfilesEditor.ts:99
  state:
    schema:
      type: object
      properties:
        new_profile: {}
        selected_profile_id:
          type: string
    initial:
      new_profile: null
      selected_profile_id: ''
- id: unresolved-comments-badge
  name: UnresolvedCommentsBadge
  kind: module
  parent: comments-contribution
  summary: Workbench contribution (Eventually) that counts unresolved comment threads and shows the count as a badge on the Comments view.
  sources:
  - src/vs/workbench/contrib/comments/browser/comments.contribution.ts:154-198
  state:
    schema:
      type: object
      properties:
        total_unresolved:
          type: integer
        listening:
          type: boolean
    initial:
      total_unresolved: 0
      listening: false
- id: comment-controller
  name: CommentController
  kind: module
  parent: comments-editor-contribution
  summary: Editor contribution (AfterFirstRender) per code editor; shows commenting ranges and comment thread widgets, and adds comment threads on a line.
  sources:
  - src/vs/workbench/contrib/comments/browser/commentsController.ts:453
  state:
    schema:
      type: object
      properties:
        editor_uri:
          type: string
        commenting_ranges:
          type: array
        widgets:
          type: object
        focused:
          type: string
        listeners_registered:
          type: boolean
        decorations_visible:
          type: boolean
    initial:
      editor_uri: file:///work/app/src/main.ts
      commenting_ranges: []
      widgets: {}
      focused: code-editor
      listeners_registered: false
      decorations_visible: true
