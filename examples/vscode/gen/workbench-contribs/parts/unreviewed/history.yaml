  - title: Soft-revert the file's dirty working copies
    source: src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:280-287
    call: text-file-service.revert
    input:
      resource: = vars.found.value.resource
      options:
        soft: true
  - title: Copy the history entry over the file
    source: src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:290-291
    call: file-service.clone-file
    input:
      source: '= has(vars.found.value.entry.location) ? vars.found.value.entry.location : vars.found.value.entry.id'
      target: = vars.found.value.resource
    as: cloned
