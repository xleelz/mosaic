- component: timeline-pane
  name: load-timeline
  kind: function
  summary: 'TimelinePane.loadTimeline: with no target clears the tree; otherwise requests each non-excluded source (excluded sources come from the timeline.excludeSources profile storage key) from the timeline
    service and keeps the items per source.'
  sources:
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:653-690
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:695-698
  request:
    type: object
    properties:
      reset:
        type: boolean
        default: true
      trigger_kind:
        type: string
        default: automatic
  response:
    type: object
    properties:
      requested:
        type: array
        items:
          type: string
  behavior:
  - if: state.uri == null && !state.workspace
    then:
    - title: No target, clear and show nothing
      source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:665-670
      set:
        state.timelines: {}
    - return:
        requested: []
  - title: Excluded sources, stored as a JSON array under timeline.excludeSources (profile scope)
    source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:403-405
    call: storage-service.get
    input:
      key: timeline.excludeSources
      scope: profile
      fallback_value: '[]'
    as: ex
  - set:
      vars.excluded: '= vars.ex.value.value == null ? ''[]'' : vars.ex.value.value'
      vars.requested: []
  - call: timeline-service.get-sources
    source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:678
    input: {}
    as: src
  - foreach: = vars.src.value.sources
    as: s
    steps:
    - if: vars.excluded.contains('"' + vars.s.id + '"')
      then:
      - title: Excluded source, not requested
        source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:696-698
        set:
          state.timelines: = omit(state.timelines, vars.s.id)
      - continue: true
    - title: Request the source's timeline for the uri (none for the workspace)
      source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:740
      call: timeline-service.get-timeline
      input: '= state.workspace ? {''id'': vars.s.id} : {''id'': vars.s.id, ''uri'': state.uri}'
      as: t
    - if: vars.t.value.requested
      then:
      - set:
          state.timelines: '= merge(state.timelines, {vars.s.id: vars.t.value.items})'
          vars.requested: = vars.requested + [vars.s.id]
  - return:
      requested: = vars.requested
