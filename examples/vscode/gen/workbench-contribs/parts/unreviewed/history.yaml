      source: timeline.localHistory
      items: '= vars.got.value.entries.map(e, {''handle'': has(e.id) ? e.id : string(e.timestamp), ''label'': e.source, ''timestamp'': e.timestamp, ''source'': ''timeline.localHistory'', ''resource_uri'':
        ''vscode-local-history:'' + vars.resource.substring(7) + ''?location='' + (has(e.location) ? e.location : string(e.timestamp))})'
