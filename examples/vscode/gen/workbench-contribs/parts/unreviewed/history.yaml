  - title: Ask for confirmation (restoring discards unsaved changes)
    source: src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:268-273
    call: dialog-service.confirm
    input:
      message: = 'Do you want to restore the contents of \'' + vars.found.value.resource.split('/')[vars.found.value.resource.split('/').size() - 1] + '\'?'
      primary_button: '&&Restore'
    as: confirm
  - if: '!vars.confirm.value.confirmed'
    then:
