  - title: Extensions that contribute a formatter come first (then category, then name)
    source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:93-115
    set:
      vars.sorted: = vars.extensions.filter(e, e.formatter) + vars.extensions.filter(e, !e.formatter)
  - title: The enum starts with None (null), then every extension with main or browser code
    source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:121-131
    set:
      vars.ids: = [null] + vars.sorted.filter(e, e.has_code).map(e, e.id)
  - return:
