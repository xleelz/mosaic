- component: local-history-commands
  name: restore
  kind: function
  summary: 'restore(): confirm, soft-revert the dirty working copies of the file, copy the history entry over the file (error dialog on failure), force-revert, open the file, add a "File Restored" history
    entry and close the entry''s editor.'
  sources:
