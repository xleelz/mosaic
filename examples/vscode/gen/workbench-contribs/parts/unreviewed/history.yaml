- component: timeline-service
  name: get-timeline
  kind: function
  summary: 'TimelineService.getTimeline: a workspace provider when there is no uri, else the file provider whose scheme matches; asks it for its timeline and tags each item with the source id. Unknown providers
    or schemes give no request.'
  sources:
  - src/vs/workbench/contrib/timeline/common/timelineService.ts:75-119
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - timeline.localHistory
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
  response:
    type: object
    properties:
      requested:
        type: boolean
      source:
        type: string
      items:
        type: array
  behavior:
  - if: '!has(input.uri)'
    then:
    - title: Workspace timeline from the workspace provider with this id, if any
      source: src/vs/workbench/contrib/timeline/common/timelineService.ts:79-85
      if: '!(input.id in state.workspace_providers)'
      then:
      - return:
          requested: false
          source: = input.id
          items: []
      else:
      - call: = state.workspace_providers[input.id].handler
        targets:
        - local-history-timeline.provide-timeline
        input: {}
        as: ws
      - return:
          requested: true
          source: = input.id
          items: = vars.ws.value.items
  - if: '!(input.id in state.providers)'
    then:
    - title: No provider with this id
      source: src/vs/workbench/contrib/timeline/common/timelineService.ts:87-90
      return:
        requested: false
        source: = input.id
        items: []
  - if: state.providers[input.id].scheme != '*' && !input.uri.startsWith(state.providers[input.id].scheme + ':')
    then:
    - title: The provider does not handle this URI's scheme
      source: src/vs/workbench/contrib/timeline/common/timelineService.ts:92-98
      return:
        requested: false
        source: = input.id
        items: []
  - title: Ask the provider for the timeline of the URI
    source: src/vs/workbench/contrib/timeline/common/timelineService.ts:100
    call: = state.providers[input.id].handler
    targets:
    - local-history-timeline.provide-timeline
    input:
      uri: = input.uri
    as: tl
  - title: Tag every item with the source id (then sorted newest first)
    source: src/vs/workbench/contrib/timeline/common/timelineService.ts:104-113
    return:
      requested: true
      source: = input.id
      items: '= vars.tl.value.items.map(i, merge(i, {''source'': input.id}))'
