- component: comment-controller
  name: add-or-toggle-comment-at-line
  kind: function
  summary: Existing thread widgets on the line are all collapsed (when all expanded) or all expanded; otherwise a comment is added at the line through the matching commenting range (line 0 = a file comment).
  sources:
  - src/vs/workbench/contrib/comments/browser/commentsController.ts:1152-1170
  - src/vs/workbench/contrib/comments/browser/commentsController.ts:1190-1239
  - src/vs/workbench/contrib/comments/browser/commentsController.ts:1275-1282
  request:
    type: object
    required:
    - line
    properties:
      line:
        type: integer
        examples:
        - 3
  behavior:
  - set:
      vars.existing: = state.widgets.filter(k, state.widgets[k].line == input.line)
  - if: size(vars.existing) > 0
    then:
    - set:
        vars.all_expanded: = vars.existing.all(k, state.widgets[k].expanded)
    - title: Toggle the existing thread widgets on the line (collapse if all expanded, else expand)
      source: src/vs/workbench/contrib/comments/browser/commentsController.ts:1159-1163
      set:
        state.widgets: '= state.widgets.transformMap(k, w, w.line == input.line ? merge(w, {''expanded'': !vars.all_expanded}) : w)'
    - return:
        added: false
        toggled: true
  - title: Commenting ranges that contain the line (or allow file comments)
    source: src/vs/workbench/contrib/comments/browser/commentsController.ts:1191
    set:
      vars.matched: '= state.commenting_ranges.filter(r, input.line == 0 ? (has(r.file_comments) && r.file_comments) : (r.start_line <= input.line && input.line <= r.end_line))'
  - if: size(vars.matched) == 0
    then:
    - title: No commenting range here, show an error
      source: src/vs/workbench/contrib/comments/browser/commentsController.ts:1192-1201
      call: notification-service.notify
      input:
        severity: error
        message: '= input.line == 0 ? ''File comments are not allowed on this file.'' : ''The cursor must be within a commenting range to add a comment.'''
    - return:
        added: false
        toggled: false
  - set:
      vars.owner: = vars.matched[0].owner
  - if: size(vars.matched) > 1
    then:
    - title: Several comment providers, pick one
      source: src/vs/workbench/contrib/comments/browser/commentsController.ts:1215-1216
      call: quick-input-service.pick
      input:
        items: = vars.matched.map(r, r.owner)
        can_pick_many: false
    - choice: provider
      default: first
      options:
        first:
        - set:
            vars.owner: = vars.matched[0].owner
        cancel:
        - title: Picker dismissed
          source: src/vs/workbench/contrib/comments/browser/commentsController.ts:1217-1219
          return:
            added: false
            toggled: false
  - title: Create a comment thread template for the owner at the (clipped) range
    source: src/vs/workbench/contrib/comments/browser/commentsController.ts:1279
    call: comment-service.create-comment-thread-template
    input:
      unique_owner: = vars.owner
      resource: = state.editor_uri
      start_line: '= input.line == 0 ? 1 : input.line'
      end_line: '= input.line == 0 ? 1 : input.line'
      editor_id: editor-1
    as: created
  - return:
      added: = vars.created.value.created
      toggled: false
      owner: = vars.owner
