- component: comment-service
  name: set-workspace-comments
  kind: function
  summary: Sets the workspace comment threads of an owner; any thread sets workspaceHasCommenting; with a registered controller the model threads are replaced and onDidSetAllCommentThreads fires.
  sources:
  - src/vs/workbench/contrib/comments/browser/commentService.ts:350-359
