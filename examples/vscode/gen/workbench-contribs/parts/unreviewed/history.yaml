  kind: function
  summary: 'DefaultFormatter (Restored phase): installs the FormattingConflicts selector and its listeners, then fills the editor.defaultFormatter enum with extensions that have code, formatter contributors
    first.'
  sources:
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:271
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:49-71
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:73-132
  request:
    type: object
    properties:
      extensions:
        type: array
        description: the registered extensions (identifier, has main or browser code, contributes a formatter)
        items:
          type: object
