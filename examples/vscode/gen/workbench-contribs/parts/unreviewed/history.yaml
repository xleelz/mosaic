interfaces:
- component: local-history-commands
  name: find-local-history-entry
  kind: function
  summary: 'findLocalHistoryEntry: maps a vscode-local-history URI back to the file, reads the file''s history entries and returns the entry whose id equals the handle plus the entry before it. Local history
    URIs are modeled as vscode-local-history:<path>?location=<entry location>.'
  sources:
  - src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:693-721
  request:
    type: object
    required:
    - uri
    - handle
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      handle:
        type: string
        examples:
        - AbC1.ts
  response:
    type: object
    properties:
      resource:
        type: string
      entry:
        type:
        - object
        - 'null'
      previous:
        type:
        - object
        - 'null'
      entry_uri:
        type:
        - string
        - 'null'
      previous_uri:
        type:
        - string
        - 'null'
  behavior:
  - title: A vscode-local-history URI (from the diff editor) maps back to the associated file
    source: src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:698-701
    set:
      vars.resource: '= input.uri.startsWith(''vscode-local-history:'') ? ''file://'' + input.uri.substring(21).split(''?'')[0] : input.uri'
  - call: native-working-copy-history-service.get-entries
    source: src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:703
    input:
      resource: = vars.resource
    as: got
  - set:
      vars.entry: null
      vars.previous: null
  - title: The entry whose id equals the handle, and the one saved before it
    source: src/vs/workbench/contrib/localHistory/browser/localHistoryCommands.ts:705-715
    foreach: = vars.got.value.entries
    as: e
    index: i
    steps:
    - if: has(vars.e.id) && vars.e.id == input.handle
      then:
      - set:
          vars.entry: = vars.e
          vars.previous: '= vars.i > 0 ? vars.got.value.entries[vars.i - 1] : null'
      - break: true
  - return:
      resource: = vars.resource
      entry: = vars.entry
      previous: = vars.previous
