- component: walkthroughs-service
  name: handle-walkthroughs-extension-point
  kind: function
  summary: 'The walkthroughs extension point handler: registers each added extension''s walkthroughs (steps need media), records first-seen metadata, and opens a newly installed walkthrough when openOnInstall
    allows.'
  sources:
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedExtensionPoint.ts:12
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:232-235
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:292-463
  request:
    type: object
    required:
    - added
    properties:
      added:
        type: array
        items:
          type: object
          properties:
            extension_id:
              type: string
            walkthroughs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        media:
                          type: string
        examples:
        - - extension_id: ms-python.python
            walkthroughs:
            - id: pythonWelcome
              steps:
              - id: create
                media: markdown
      session_installed:
        type: array
        items:
          type: string
        default: []
        description: extensions installed in this window's session (onDidInstallExtensions)
  behavior:
  - set:
      vars.metadata: '= has(state.metadata) ? state.metadata : {}'
      vars.open: null
  - foreach: = input.added
    as: ext
    steps:
    - if: '!has(vars.ext.walkthroughs) || size(vars.ext.walkthroughs) == 0'
      source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:315-317
      then:
      - continue: true
    - set:
        vars.rejected: false
    - foreach: = vars.ext.walkthroughs
      as: wt
      steps:
      - set:
          vars.cat: = vars.ext.extension_id + '#' + vars.wt.id
      - set:
          vars.newly: = !(vars.cat in vars.metadata)
      - title: First time seen, record first-seen metadata
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:324-327
        if: vars.newly
        then:
        - set:
            vars.metadata: '= merge(vars.metadata, {vars.cat: {''first_seen'': now, ''step_ids'': vars.wt.steps.map(s, s.id), ''manually_opened'': false}})'
      - title: Installed in this session and new, so the first such walkthrough opens
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:334-342
        if: vars.newly && vars.open == null && vars.ext.extension_id.lowerAscii() in input.session_installed.map(x, x.lowerAscii())
        then:
        - set:
            vars.open: = vars.cat
      - title: A step without media throws, rejecting this extension's registration
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:350-352
        if: vars.wt.steps.exists(s, !has(s.media) || s.media == '')
        then:
        - set:
            vars.rejected: true
        - continue: true
      - title: Register the walkthrough and its fully qualified steps, fire onDidAddWalkthrough
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:432-434
        foreach: = vars.wt.steps
        as: st
        steps:
        - set:
            state.steps: '= merge(state.steps, {vars.cat + ''#'' + vars.st.id: vars.cat})'
    - title: Persist walkthrough metadata after all walkthroughs resolved (skipped when one rejected)
      source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:437
      if: '!vars.rejected'
      then:
      - set:
          state.metadata: = vars.metadata
      - call: storage-service.store
        input:
          key: workbench.welcomePage.walkthroughMetadata
          value: = string(size(vars.metadata))
          scope: profile
          target: user
  - title: Auto-open on install when the window had focus, openOnInstall is on and the startup editor is not the agent sessions page
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:439-441
    if: vars.open != null && config['workbench-welcome-page-walkthroughs-open-on-install'] && config['workbench-startup-editor'] != 'agentSessionsWelcomePage'
    then:
    - choice: had_last_focus
      default: 'yes'
      options:
        'yes':
        - call: command-service.execute-command
          source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:459-461
          input:
            command_id: workbench.action.openWalkthrough
            args:
            - = vars.open
            - inactive: false
          on_error: continue
        - return:
            opened: = vars.open
        'no': []
  - return:
      opened: null
