- component: user-data-profiles-workbench-contribution
  name: cmd-workbench-profiles-actions-deleteprofile
  kind: command
  attributes:
    command: workbench.profiles.actions.deleteProfile
  summary: Multi-select pick among the non-default, non-internal profiles, then removes the picked ones concurrently; a failure shows an error notification.
  sources:
  - src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:482
  - src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:493-521
  request:
    type: object
  behavior:
  - set:
      vars.profiles: = state.profiles.filter(p, !p.is_default && !p.is_internal)
  - title: No removable profile, nothing to do
    source: src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:500-501
    if: size(vars.profiles) == 0
    then:
    - return:
        removed: []
  - title: Multi-select quick pick of the profiles to delete
    source: src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:502-512
    call: quick-input-service.pick
    input:
      items: = vars.profiles.map(p, p.name)
      can_pick_many: true
  - choice: pick
    default: all
    options:
      all:
      - set:
          vars.picked: = vars.profiles.map(p, p.id)
      cancel:
      - title: Picker dismissed
        source: src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:513
        return:
          removed: []
  - title: Remove all picked profiles at once (Promise.all)
    source: src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:515
    parallel: = vars.picked
    as: pid
    steps:
    - call: user-data-profile-management-service.remove-profile
      input:
        profile_id: = vars.pid
      as: removed
      on_error: continue
    - return:
        ok: = vars.removed.ok
    join:
      need: all
    as_result: removal
  - if: vars.removal.results.exists(r, !r.value.ok)
    then:
    - title: The first failure is shown as an error notification
      source: src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:516-518
      call: notification-service.notify
      input:
        severity: error
        message: Unable to remove the profile
    - return:
        removed: []
        failed: true
  - return:
      removed: = vars.picked
