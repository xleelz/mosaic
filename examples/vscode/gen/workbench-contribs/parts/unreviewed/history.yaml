- component: snippets-service
  name: handle-snippets-extension-point
  kind: function
  summary: 'The snippets extension point handler: drops all extension snippet files, validates each contribution (path, language, inside the extension folder) and registers one snippet file per location.'
  sources:
  - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:114-118
  - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:377-403
  - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:47-92
  request:
    type: object
    required:
    - extensions
    properties:
      extensions:
        type: array
        items:
          type: object
          properties:
            extension_id:
              type: string
            contributions:
              type: array
              items:
                type: object
                properties:
                  language:
                    type: string
                  path:
                    type: string
        examples:
        - - extension_id: vscode.typescript-basics
            contributions:
            - language: typescript
              path: ./snippets/typescript.code-snippets
  behavior:
  - title: Forget every extension snippet file before re-adding
    source: src/vs/workbench/contrib/snippets/browser/snippetsService.ts:380-384
    set:
      vars.files: {}
      vars.errors: []
  - foreach: = input.extensions
    as: ext
    steps:
    - foreach: '= has(vars.ext.contributions) ? vars.ext.contributions : []'
      as: c
      steps:
      - title: Expected string in contributes.snippets.path
        source: src/vs/workbench/contrib/snippets/browser/snippetsService.ts:49-56
        if: '!has(vars.c.path) || vars.c.path.trim() == '''''
        then:
        - set:
            vars.errors: = vars.errors + ['invalid.path.0']
        - continue: true
      - set:
          vars.lang: '= has(vars.c.language) ? vars.c.language.trim() : '''''
      - title: Without a language the path must be a .code-snippets file
        source: src/vs/workbench/contrib/snippets/browser/snippetsService.ts:58-65
        if: vars.lang == '' && !vars.c.path.endsWith('.code-snippets')
        then:
        - set:
            vars.errors: = vars.errors + ['invalid.language.0']
        - continue: true
      - title: The language must be registered (language service, editor area)
        source: src/vs/workbench/contrib/snippets/browser/snippetsService.ts:67-75
        if: vars.lang != ''
        then:
        - choice: language_registered
          default: registered
          options:
            registered: []
            unknown:
            - set:
                vars.errors: = vars.errors + ['invalid.language']
            - continue: true
      - title: The snippet file must lie inside the extension folder
        source: src/vs/workbench/contrib/snippets/browser/snippetsService.ts:77-86
        if: vars.c.path.startsWith('../') || vars.c.path.contains('/../')
