- component: browser-view-browser-tab-management-features-native
  name: cmd-workbench-action-browser-quickopen
  kind: command
  attributes:
    command: workbench.action.browser.quickOpen
  summary: 'Quick Open Browser Tab: list the open browser tabs (by group, plus background views) with a New Integrated Browser Tab entry; accept opens the tab, the buttons close one or all.'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:556
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:260-263
  request:
    type: object
    properties:
      args:
        type: array
        items: {}
        default: []
      command_id:
        type: string
  behavior:
  - call: browser-view-workbench-service.get-contextual-browser-views
    as: views
    title: Build the items from the editor groups and the known views
    source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:152-239
  - choice: pick
    title: The user accepts a tab, the New Tab entry, presses Close All, or dismisses the picker
    source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:104-131
    default: '= size(vars.views.value) > 0 ? ''tab'' : ''new-tab'''
    options:
      tab:
      - call: browser-view-workbench-service.get-preferred-group
        as: grp
        source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:129
      - call: editor-service.open-editor
        title: Open the selected tab in its group
        source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:129
        input:
          resource: = 'vscode-browser:/' + vars.views.value[0].id
          group: = vars.grp.value.group
      - return:
          action: tab
          id: = vars.views.value[0].id
      new-tab:
      - call: browser-view-workbench-service.get-preferred-group
        as: grp
        source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:124
      - set:
          vars.resource: = 'vscode-browser:/b' + string(now)
      - call: browser-editor-resolver-contribution.create-editor-input
        title: IEditorService resolves the vscode-browser resource through the registered editor (createEditorInput with the viewState url)
        source: src/vs/workbench/contrib/browserView/electron-browser/browserView.contribution.ts:80-102
        input:
          resource: = vars.resource
          url: ''
        as: input_
      - call: editor-service.open-editor
        title: Open the new browser editor
        source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:122-127
        input:
          resource: = vars.resource
          group: = vars.grp.value.group
          options:
            pinned: = vars.input_.value.pinned
        as: pane
      - return:
          action: new-tab
          id: = vars.resource.substring(16)
      close-all:
      - foreach: = vars.views.value
        as: e
        title: Close All button disposes every contextual browser view
        source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:108-112
        steps:
        - call: editor-service.close-editor
          input:
            resource: = 'vscode-browser:/' + vars.e.id
        - call: browser-view-workbench-service.dispose-view
          input:
            id: = vars.e.id
      - return:
          action: close-all
      dismiss:
      - return:
          action: dismiss
