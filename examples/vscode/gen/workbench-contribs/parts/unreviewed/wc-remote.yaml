- component: edit-sessions-contribution
  name: cmd--workbench-editsessions-actions-continueeditsession
  kind: command
  attributes:
    command: _workbench.editSessions.actions.continueEditSession
  summary: 'Continue Working On...: pick a destination (unless given), store the working changes when wanted, resolve the destination command to a URI and open it with ?editSessionId=<ref>&continueOn=1.'
  sources:
  - src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:335
  - src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:340-420
  - src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:984-1029
  request:
    type: object
    properties:
      args:
        type: array
        items: {}
        default: []
      command_id:
        type: string
  behavior:
  - if: '!state.actions_registered'
    title: Registered only when product.json configures editSessions.store
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:169-171
    then:
    - fail:
        code: command-not-found
        message: command '_workbench.editSessions.actions.continueEditSession' not found
  - set:
      vars.uri: '= has(input.args) && size(input.args) > 0 && input.args[0] != null ? input.args[0] : '''''
      vars.dest: '= has(input.args) && size(input.args) > 1 && input.args[1] != null ? input.args[1] : '''''
  - if: vars.dest == '' && vars.uri == ''
    title: Ask the user to pick a destination
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:351-357
    then:
    - call: continue-edit-session-options.create-pick-items
      as: items
      source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:992
    - choice: destination
      default: '= size(vars.items.value.items) > 0 ? ''first'' : ''none'''
      source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:997-1026
      options:
        first:
        - set:
            vars.dest: = vars.items.value.items[0]
        none:
        - title: No selection
          source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:352-355
          return:
            opened: null
  - call: edit-sessions-contribution.should-continue-on-with-edit-session
    as: should
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:359
  - set:
      vars.ref: ''
  - if: vars.should.value.store
    title: Store the working changes to get a ref
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:364-393
    then:
    - call: edit-sessions-contribution.store-edit-session
      input:
        from_store_command: false
      as: stored
      source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:378
    - set:
        vars.ref: '= vars.stored.value.ref == null ? '''' : vars.stored.value.ref'
  - if: vars.dest != ''
    title: 'resolveDestination: run the destination command; it returns a URI or nothing'
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:1031-1063
    then:
    - call: command-service.execute-command
      input:
        command_id: = vars.dest
        args: []
      as: resolved
      on_error: continue
    - if: '!vars.resolved.ok'
      title: 'Canceled or failed: undefined'
      source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:1057-1062
      then:
      - return:
          opened: null
    - set:
        vars.uri: '= vars.resolved.value == null ? ''noDestinationUri'' : vars.resolved.value'
  - if: vars.uri == 'noDestinationUri'
    title: The extension opens the destination itself
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:1045-1048
    then:
    - return:
        opened: null
        ref: = vars.ref
  - set:
      vars.target: '= vars.ref != '''' ? vars.uri + (vars.uri.contains(''?'') ? ''&'' : ''?'') + ''editSessionId='' + vars.ref + ''&continueOn=1'' : vars.uri'
    title: Append editSessionId and continueOn=1 when a ref was stored
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:401-406
  - call: opener-service.open
    source: src/vs/workbench/contrib/editSessions/browser/editSessions.contribution.ts:408-415
    input:
      target: = vars.target
      open_external: true
  - return:
      opened: = vars.target
      ref: = vars.ref
  errors:
  - code: command-not-found
    status: 0
    retryable: false
