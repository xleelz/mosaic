interfaces:
- component: browser-view-workbench-service
  name: known-get
  kind: function
  summary: One known browser view (BrowserEditorInput with its model state) by id.
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:292-294
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - b1
  errors:
  - code: not_found
    status: 0
    retryable: false
  store:
    table: known
    op: get
    key: = input.id
- component: browser-view-workbench-service
  name: known-put
  kind: function
  summary: Record a browser view in _known (or replace its model state).
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:535
  request:
    type: object
    required:
    - id
    - row
    properties:
      id:
        type: string
        examples:
        - b1
      row:
        type: object
  store:
    table: known
    op: put
    key: = input.id
    value: = input.row
- component: browser-view-workbench-service
  name: known-delete
  kind: function
  summary: Forget a browser view (onWillDispose).
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:527-531
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - b1
  store:
    table: known
    op: delete
    key: = input.id
- component: browser-view-workbench-service
  name: get-contextual-browser-views
  kind: function
  summary: 'getContextualBrowserViews: with no contextual filters registered and no sandbox session, every known view.'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:307-322
  request:
    type: object
  store:
    table: known
    op: query
- component: browser-view-workbench-service
  name: on-did-change-browser-views
  kind: event
  summary: onDidChangeBrowserViews, fired when a view is added to or removed from _known.
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:536
  request:
    type: object
    properties:
      id:
        type: string
      change:
        type: string
- component: browser-view-workbench-service
  name: get-or-create-lazy
  kind: function
  summary: 'getOrCreateLazy: return the known BrowserEditorInput for the id, or create it with the session scope resolved from workbench.browser.dataStorage, record it in _known and fire onDidChangeBrowserViews.'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:486-540
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:552-565
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - b1
      url:
        type: string
  behavior:
  - call: browser-view-workbench-service.known-get
    input:
      id: = input.id
    as: existing
    on_error: continue
  - if: vars.existing.ok
    title: 'Already known: return the existing input'
    source: src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:492
    then:
    - return: = vars.existing.value
  - title: 'Session scope: workbench.browser.dataStorage, ''default'' meaning global for a local workspace without a network'
    source: src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:561-563
