- component: remote-tunnel-workbench-contribution
  name: handle-tunnel-status-update
  kind: function
  summary: 'handleTunnelStatusUpdate: reset the connection info, then mirror the status into the remoteTunnelConnection and remoteTunnelHasLink context keys.'
  sources:
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:177-192
  request:
    type: object
    required:
    - type
    properties:
      type:
        type: string
        enum:
        - disconnected
        - connecting
        - connected
      info:
        type: object
  behavior:
  - set:
      state.connection_info: null
      state.has_link: false
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:178-179
  - if: input.type == 'connected'
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:187-191
    then:
    - set:
        state.connection_info: = input.info
        state.has_link: = 'link' in input.info && input.info.link != ''
        state.connection_state: connected
  - if: input.type != 'connected'
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:180-186
    then:
    - set:
        state.connection_state: = input.type
  - call: context-key-service.set-context
    input:
      key: remoteTunnelConnection
      value: = state.connection_state
  - return:
      state: = state.connection_state
- component: remote-tunnel-workbench-contribution
  name: constructor
  kind: function
  summary: 'Restored: create the remoteTunnelService log, bind the context keys; without tunnelApplicationConfig or tunnelApplicationName log an error and stop; else listen to tunnel status, register the
    commands and initialize from the service''s mode and status.'
  sources:
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:915
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:137-175
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:275-328
  behavior:
  - title: Create the remoteTunnelService logger; bind remoteTunnelConnection and remoteTunnelHasLink
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:155-158
  - if: size(config['tunnel-application-config']) == 0 || config['product-tunnel-application-name'] == ''
    title: 'Missing ''tunnelApplicationConfig'' or ''tunnelApplicationName'' in product.json: remote tunneling is not available'
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:160-165
    then:
    - return:
        registered: false
  - title: Listen to onDidChangeTunnelStatus and register the commands
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:168-172
    set:
      state.registered: true
  - call: remote-tunnel-service.get-mode
    title: 'initialize: getMode and getTunnelStatus'
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:276-279
  - call: remote-tunnel-service.get-tunnel-status
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:278
  - choice: status
    default: disconnected
    title: The shared process's current tunnel status
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:281
    options:
      disconnected:
      - call: remote-tunnel-workbench-contribution.handle-tunnel-status-update
        input:
          type: disconnected
      connected:
      - call: remote-tunnel-workbench-contribution.handle-tunnel-status-update
        input:
          type: connected
          info:
            tunnelName: dev-machine
            link: https://vscode.dev/tunnel/dev-machine
            domain: vscode.dev
            isAttached: true
      - return:
          registered: true
          state: connected
  - call: storage-service.get
    title: remoteTunnelHasUsed decides whether discovery shows window progress
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:315
    input:
      key: remoteTunnelHasUsed
      scope: application
  - call: remote-tunnel-service.initialize
    title: 'doInitialStateDiscovery: initialize the service with the inactive mode (no token available)'
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:304
    input:
      active: false
  - return:
      registered: true
      state: = state.connection_state
- component: remote-tunnel-workbench-contribution
  name: start-tunnel
  kind: function
  summary: 'startTunnel: reuse an existing connection; remember that tunnels were used; get an authentication session (picker or given provider), start the tunnel and wait for connected/disconnected; a
    token failure retries once (INVALID_TOKEN_RETRIES = 2).'
  sources:
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:334-409
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:411-446
  request:
    type: object
    properties:
      as_service:
        type: boolean
        default: false
  behavior:
  - if: state.connection_info != null
    title: Already connected
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:335-337
    then:
    - return: = state.connection_info
  - call: storage-service.store
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:339
    input:
      key: remoteTunnelHasUsed
      value: 'true'
      scope: application
      target: machine
  - foreach:
    - 1
    - 2
    as: attempt_no
    title: Up to INVALID_TOKEN_RETRIES attempts
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:342
    steps:
    - choice: account
      default: existing
      title: 'getAuthenticationSession: pick a signed-in account, sign in with a provider, or dismiss'
      source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:411-446
      options:
        existing:
        - set:
            vars.session: '= {''session_id'': ''s1'', ''provider_id'': ''github'', ''account_label'': ''dev''}'
        sign-in:
        - call: authentication-service.create-session
          source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:434
          input:
            provider_id: github
            scopes:
            - read:user
        - set:
            vars.session: '= {''session_id'': ''s2'', ''provider_id'': ''github'', ''account_label'': ''dev''}'
        dismiss:
        - title: No authentication session available, not starting tunnel
          source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:345-349
          return: null
    - call: remote-tunnel-service.start-tunnel
      title: Start the tunnel with the session (progress notification until connected or disconnected)
      source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:388-390
      input:
        active: true
        as_service: = input.as_service
        session: = vars.session
    - choice: result
      default: connected
      title: The tunnel status that ends the wait
      source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:366-385
      options:
        connected:
        - call: remote-tunnel-workbench-contribution.handle-tunnel-status-update
          input:
            type: connected
            info:
              tunnelName: dev-machine
              link: https://vscode.dev/tunnel/dev-machine
              domain: vscode.dev
              isAttached: false
        - return: = state.connection_info
        disconnected:
        - call: remote-tunnel-workbench-contribution.handle-tunnel-status-update
          input:
            type: disconnected
        - return: null
        token-failed:
        - call: remote-tunnel-workbench-contribution.handle-tunnel-status-update
          title: 'Disconnected on a token failure: try again'
          source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:380-384
          input:
            type: disconnected
  - return: null
- component: remote-tunnel-workbench-contribution
  name: cmd-workbench-remotetunnel-actions-turnon
  kind: command
  attributes:
    command: workbench.remoteTunnel.actions.turnOn
  summary: 'Turn on Remote Tunnel Access: confirm the preview once, choose session vs service, start the tunnel, then notify with the link (and remember the host) or report the failure and show the log.'
  sources:
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:555
  - src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:573-676
  request:
    type: object
    properties:
      args:
        type: array
        items: {}
        default: []
      command_id:
        type: string
  behavior:
  - if: '!state.registered'
    title: Commands are registered only when the product configures tunnels
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:160-165
    then:
    - fail:
        code: command-not-found
        message: command 'workbench.remoteTunnel.actions.turnOn' not found
  - call: storage-service.get
    input:
      key: remoteTunnelServicePromptedPreview
      scope: application
    as: prev
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:582
  - if: vars.prev.value.value != 'true'
    title: 'First use: Remote Tunnels is in preview'
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:582-593
    then:
    - call: dialog-service.confirm
      input:
        message: 'Remote Tunnels is currently in preview. Please report any problems using the "Help: Report Issue" command.'
        primary_button: '&&Enable'
      as: c
    - if: '!vars.c.value.confirmed'
      then:
      - return:
          started: false
    - call: storage-service.store
      source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:592
      input:
        key: remoteTunnelServicePromptedPreview
        value: 'true'
        scope: application
        target: user
  - set:
      vars.opts: '= has(input.args) && size(input.args) > 0 && input.args[0] != null ? input.args[0] : {}'
  - if: '''showServiceOption'' in vars.opts && vars.opts.showServiceOption == false'
    then:
    - set:
        vars.as_service: false
    else:
    - choice: enable_as
      default: session
      title: Turn on for this session, or install as a service
      source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:595-614
      options:
        session:
        - set:
            vars.as_service: false
        service:
        - set:
            vars.as_service: true
        dismiss:
        - title: 'Quick pick hidden: no-op'
          source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:616-618
          return:
            started: false
  - call: remote-tunnel-workbench-contribution.start-tunnel
    input:
      as_service: = vars.as_service
    as: conn
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:620
  - if: vars.conn.value != null
    then:
    - call: notification-service.notify
      title: You can now access this machine anywhere via the secure tunnel
      source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:623-663
      input:
        severity: info
        message: = 'You can now access this machine anywhere via the secure tunnel ' + vars.conn.value.tunnelName + '.'
    - call: storage-service.store
      title: Remember the tunnel name for the remote extension recommendation
      source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:666-667
      input:
        key: remoteTunnelServiceUsed
        scope: application
        target: user
        value: = '{"hostName":"' + vars.conn.value.tunnelName + '","timeStamp":' + string(now) + '}'
    - return:
        started: true
        tunnel_name: = vars.conn.value.tunnelName
  - call: notification-service.notify
    title: Unable to turn on the remote tunnel access
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:668-673
    input:
      severity: info
      message: Unable to turn on the remote tunnel access. Check the Remote Tunnel Service log for details.
  - call: command-service.execute-command
    source: src/vs/workbench/contrib/remoteTunnel/electron-browser/remoteTunnel.contribution.ts:674
    input:
      command_id: workbench.remoteTunnel.actions.showLog
      args: []
  - return:
      started: false
  errors:
  - code: command-not-found
    status: 0
    retryable: false
