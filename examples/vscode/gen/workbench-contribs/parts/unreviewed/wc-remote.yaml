- component: browser-auto-reload-service
  name: update-browser-views
  kind: function
  summary: '_updateBrowserViews: create a BrowserAutoReloadWatcher for each known view; enabled views showing a local file:// page watch that file (a change schedules a reload after 300 ms).'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserAutoReloadFeatures.ts:178-199
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserAutoReloadFeatures.ts:103-126
  request:
    type: object
    properties:
      id:
        type: string
      change:
        type: string
  subscribe:
  - browser-view-workbench-service.on-did-change-browser-views
  behavior:
  - call: browser-view-workbench-service.get-contextual-browser-views
    as: views
    title: getKnownBrowserViews()
    source: src/vs/workbench/contrib/browserView/electron-browser/features/browserAutoReloadFeatures.ts:179
  - set:
      vars.watched: []
  - foreach: = vars.views.value
    as: e
    title: One watcher per known view, enabled from workbench.browser.autoReloadOnFileChange
    source: src/vs/workbench/contrib/browserView/electron-browser/features/browserAutoReloadFeatures.ts:191-196
    steps:
    - if: config['workbench-browser-auto-reload-on-file-change'] && vars.e.url.startsWith('file://')
      title: 'Enabled and a local file: watch it'
      source: src/vs/workbench/contrib/browserView/electron-browser/features/browserAutoReloadFeatures.ts:103-126
      then:
      - call: file-service.watch
        input:
          resource: = vars.e.url.split('?')[0].split('#')[0]
          recursive: false
      - set:
          vars.watched: = vars.watched + [vars.e.id]
  - return:
      watched: = vars.watched
