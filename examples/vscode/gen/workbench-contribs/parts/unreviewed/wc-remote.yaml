- id: workbench-contribs-remote-edit-sessions-contributed-options
  name: The continueEditSession extension point collects options and generates a standalone command, which runs Continue Working On with that destination
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  config:
    edit-sessions-store: https://edit-sessions.example
  steps:
  - interface: edit-sessions-contribution.start
    caller: workbench
    as: s
  - interface: continue-edit-session-options.register-contributed-edit-session-options
    caller: workbench
    as: x
    input:
      extensions:
      - id: ms-vscode.remote-repositories
        proposed_api_enabled: true
        contributions:
        - command: _workbench.editSessions.actions.continueEditSession.openLocalFolder
          title: Open In Local Folder
          qualified_name: Continue Working in Local Folder
          declared: true
      - id: other.ext
        proposed_api_enabled: false
        contributions:
        - command: other.continue
          title: Other
          declared: true
  - interface: continue-edit-session-options.cmd--workbench-editsessions-actions-continueeditsession-option
    caller: user
    as: sa
    input:
      command_id: _workbench.editSessions.actions.continueEditSession._workbench.editSessions.actions.continueEditSession.openLocalFolder
      args: []
  expect:
  - steps.x.result.value.options == 1 && !steps.x.result.value.aborted
  - size(state['continue-edit-session-options@w1'].standalone_commands) == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == '_workbench.editSessions.actions.continueEditSession')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'edit-sessions-contribution.cmd--workbench-editsessions-actions-continueeditsession-openloca')
