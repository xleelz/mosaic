scenarios:
- id: workbench-contribs-remote-browser-open-url
  name: Open Integrated Browser with a URL opens a pinned browser editor and records the view
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-editor-resolver-contribution.constructor
    caller: workbench
    as: r
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: o
    input:
      args:
      - http://localhost:3000/
  expect:
  - steps.o.result.ok && !steps.o.result.value.reused
  - trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.resource.startsWith('vscode-browser:/'))
  - state['browser-view-workbench-service@w1'].known[steps.o.result.value.id].url == 'http://localhost:3000/'
  - state['browser-editor-resolver-contribution@w1'].editor_patterns.size() == 5
- id: workbench-contribs-remote-browser-open-reuse
  name: Open with reuseUrlFilter navigates the matching tab instead of opening another
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: a
    input:
      args:
      - http://localhost:3000/
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: b
    input:
      args:
      - url: http://localhost:3000/docs
        reuseUrlFilter: http://localhost:3000/*
  expect:
  - steps.b.result.value.reused && steps.b.result.value.id == steps.a.result.value.id
  - state['browser-view-workbench-service@w1'].known[steps.a.result.value.id].url == 'http://localhost:3000/docs'
  - size(state['browser-view-workbench-service@w1'].known) == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'browser-view-model.load-url')
- id: workbench-contribs-remote-browser-open-to-side
  name: Open to the side uses the dedicated side group and locks it
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: o
    input:
      args:
      - url: https://example.com/
        openToSide: true
  expect:
  - steps.o.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.group == -2)
  - trace.exists(e, e.type == 'call.start' && e.interface == 'editor-group-view.set-editor-state' && e.input.op == 'lock')
- id: workbench-contribs-remote-browser-new-tab-and-close-all
  name: New Tab opens an empty browser editor with the URL picker; Close All closes every browser tab and forgets the views
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-editor-open-context-key-contribution.constructor
    caller: workbench
    as: ck
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-newtab
    caller: user
    as: n
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: o
    input:
      args:
      - http://localhost:8080/
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-closeall
    caller: user
    as: c
  expect:
  - steps.c.result.value.closed == 2
  - size(state['browser-view-workbench-service@w1'].known) == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'editor-group-view.close-editors' && e.input.mode == 'list' && size(e.input.resources) == 2)
  - trace.filter(e, e.type == 'call.start' && e.interface == 'context-key-service.set-context' && e.input.key == 'browserEditorOpen').map(e, e.input.value)[0] == false
  - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.set-context' && e.input.key == 'browserEditorOpen' && e.input.value == true)
- id: workbench-contribs-remote-browser-close-all-in-group
  name: Close All Browser Tabs in Group closes only the active group browser editors
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: o
    input:
      args:
      - http://localhost:3000/
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-closeallingroup
    caller: user
    as: c
  expect:
  - steps.c.result.value.closed == 1
  - size(state['browser-view-workbench-service@w1'].known) == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'browser-view-workbench-service.dispose-view')
- id: workbench-contribs-remote-browser-open-or-list-empty
