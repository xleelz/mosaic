  # ---------- selection clipboard (Linux) ----------
  - component: selection-clipboard
    name: constructor
    kind: function
    summary: "Eager editor contribution (Linux): tracks editor.selectionClipboard and, on every non-restore selection change while enabled, schedules the selection write (RunOnceScheduler, 100 ms)."
    sources: ["src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:139", "src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:29-86"]
    request:
      type: object
      properties:
        selections: {type: array, items: {type: string}, examples: [["console.log"]]}
        selection_source: {type: string, examples: [keyboard]}
    behavior:
      - title: isEnabled = editor.selectionClipboard
        source: src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:33
        call: configuration-service.get-value
        input: {key: editor.selectionClipboard}
        as: cfg
      - set: {state.enabled: "= vars.cfg.value.value == true"}
      - title: A selection change while disabled, or from restoreState, schedules nothing
        source: src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:74-84
        if: "!state.enabled || !has(input.selections) || (has(input.selection_source) && input.selection_source == 'restoreState')"
        then: [{return: {scheduled: false}}]
      - emit: selection-clipboard.set-selection-to-clipboard
        after_ms: 100
        input: {selections: "= input.selections"}
      - return: {scheduled: true}
  - component: selection-clipboard
    name: set-selection-to-clipboard
    kind: function
    summary: "The 100 ms scheduler: writes the joined selections to the 'selection' clipboard unless a cursor has an empty selection or the text exceeds 65536 characters."
    sources: ["src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:41-72"]
    request: {type: object, properties: {selections: {type: array, items: {type: string}}}}
    behavior:
      - title: Only write when every cursor has a selection
        source: src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:51-55
        if: "!has(input.selections) || size(input.selections) == 0 || input.selections.exists(s, s == '')"
        then: [{return: {written: false}}]
      - title: Large selections are not written
        source: src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:59-63
        if: "sum(input.selections.map(s, size(s))) > 65536"
        then: [{return: {written: false}}]
      - title: writeText(joined selections, 'selection')
        source: src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:70-71
        call: clipboard-service.write-text
        input: {text: "= input.selections.join('\\n')"}
      - return: {written: true}
  - component: linux-selection-clipboard-paste-preventer
    name: constructor
    kind: function
    summary: "BlockRestore contribution (Linux): on every window, a middle-button mouseup is preventDefault'ed when editor.selectionClipboard is off, so the browser does not paste."
    sources: ["src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:141", "src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:94-112"]
    request: {type: object, properties: {button: {type: integer, examples: [1]}}}
