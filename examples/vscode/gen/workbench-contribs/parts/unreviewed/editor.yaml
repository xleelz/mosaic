      - "trace.exists(e, e.type == 'call.start' && e.interface == 'cursors-controller.get-position')"
  - id: workbench-contribs-editor-toggle-word-wrap
    description: "Word wrap is off, so the first toggle stores the transient override 'on' for src/main.ts; the second toggle reads it back and clears it (inherit)."
    fixtures: [editor-main-open, workbench-contribs-seed]
    steps:
      - {interface: toggle-word-wrap-controller.constructor, caller: editor, input: {uri: "file:///work/app/src/main.ts"}, as: c}
      - {interface: editor-word-wrap-context-key-tracker.constructor, caller: workbench, input: {}, as: k}
      - {interface: code-editor-toggle-word-wrap.cmd-editor-action-togglewordwrap, caller: user, input: {}, as: t_on}
      - {interface: code-editor-toggle-word-wrap.cmd-editor-action-togglewordwrap, caller: user, input: {}, as: t_off}
    expect:
      - "steps.c.result.value.word_wrap_override2 == 'inherit'"
      - "steps.k.result.value.can_toggle_word_wrap && !steps.k.result.value.editor_word_wrap"
      - "steps.t_on.result.value.state.word_wrap_override == 'on' && steps.t_off.result.value.state == null"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'toggle-word-wrap-controller.apply-word-wrap-state').map(e, e.output.word_wrap_override2) == ['inherit', 'on', 'inherit']"
      - "state['toggle-word-wrap-controller@w1'].applied['file:///work/app/src/main.ts'] == 'inherit' && !('file:///work/app/src/main.ts' in state['toggle-word-wrap-controller@w1'].transient)"
