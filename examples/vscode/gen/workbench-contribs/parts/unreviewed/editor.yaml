  - component: call-hierarchy-model
    name: create
    kind: function
    summary: "CallHierarchyModel.create: the first ordered provider prepares a session at the position; no provider or no session -> undefined. The session id is the concatenated root _sessionIds."
    sources: ["src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:67-77"]
    request:
      type: object
      required: [resource, language_id]
      properties:
        resource: {type: string}
        language_id: {type: string}
        position: {type: object}
    behavior:
      - title: Providers ordered for the model (registered by the extension host bridge as feature call-hierarchy)
        source: src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:68-71
        call: language-features-service.ordered
        input: {feature: call-hierarchy, language_id: "= input.language_id"}
        as: ord
      - if: "size(vars.ord.value.providers) == 0"
        then: [{return: {model: null}}]
      - set: {vars.provider: "= vars.ord.value.providers[0]"}
      - title: provider.prepareCallHierarchy runs in the extension host
        source: src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:72
        call: ext-host-language-features.prepare-call-hierarchy
        'on': "= 'eh' + self.substring(1)"
        input: {handle: "= vars.provider.handle", resource: "= input.resource", position: "= has(input.position) ? input.position : {'line_number': 1, 'column': 1}", token: {canceled: false}}
        as: session
      - set: {vars.id: "= 'ch-' + string(vars.provider.handle) + '-' + string(size(state.models) + 1)"}
      - set: {vars.root: "= {'session_id': vars.id, 'uri': input.resource, 'name': string(vars.session.value.name)}"}
      - set: {state.models: "= merge(state.models, {vars.id: {'handle': vars.provider.handle, 'root': vars.root}})"}
      - return: {model: {id: "= vars.id", handle: "= vars.provider.handle", root: "= vars.root"}}
  - component: call-hierarchy-model
    name: resolve-calls
    kind: function
    summary: "resolveIncomingCalls / resolveOutgoingCalls: ask the model's provider; a non-empty array is returned, errors are reported and give []."
    sources: ["src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:103-125"]
    request: {type: object, required: [session_id, direction], properties: {session_id: {type: string}, direction: {type: string, enum: [incoming, outgoing]}}}
    behavior:
      - title: Unknown session -> []
        source: src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:176-179
        if: "!(input.session_id in state.models)"
        then: [{return: {calls: []}}]
      - set: {vars.m: "= state.models[input.session_id]"}
      - if: "input.direction == 'incoming'"
        then:
          - call: ext-host-language-features.provide-call-hierarchy-incoming-calls
            source: src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:105
            'on': "= 'eh' + self.substring(1)"
            input: {handle: "= vars.m.handle", session_id: "= input.session_id", item_id: "= input.session_id", token: {canceled: false}}
            as: r
