  # ---------- word wrap ----------
  - component: code-editor-toggle-word-wrap
    name: cmd-editor-action-togglewordwrap
    kind: command
    attributes: {command: editor.action.toggleWordWrap}
    summary: "View: Toggle Word Wrap (Alt+Z): per model, not a setting. A transient state is cleared; without one, the override is 'on' when the editor does not wrap (wrappingColumn -1), else 'off'."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:318", "src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:71-109"]
    request: {type: object}
    behavior:
      - title: canToggleWordWrap - needs a (non simple widget) editor with a model
        source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:213-237
        call: code-editor-widget.has-text-focus
        as: ed
      - if: "!vars.ed.value.found"
        then: [{return: {toggled: false}}]
      - title: Read the model's transient word wrap state
        source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:81-82
        call: toggle-word-wrap-controller.read-transient-state
        input: {uri: "= vars.ed.value.uri"}
        as: tr
      - if: "vars.tr.value.state != null"
        then:
          - title: A transient state exists - clear it
            source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:86-87
            set: {vars.new_state: null}
        else:
          - title: wrappingInfo.wrappingColumn is -1 when editor.wordWrap is off
            source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:89-91
            call: configuration-service.get-value
            input: {key: editor.wordWrap, resource: "= vars.ed.value.uri"}
            as: ww
          - set: {vars.new_state: "= {'word_wrap_override': vars.ww.value.value == 'off' ? 'on' : 'off'}"}
      - title: Write the transient state (the controller applies it on the change event)
        source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:94-96
        call: toggle-word-wrap-controller.write-transient-state
        input: {uri: "= vars.ed.value.uri", state: "= vars.new_state"}
      - return: {toggled: true, state: "= vars.new_state"}

  - component: toggle-word-wrap-controller
    name: constructor
    kind: function
    summary: "Eager editor contribution: creates isWordWrapMinified / isDominatedByLongLines context keys and listens to configuration, model and transient-property changes (ensureWordWrapSettings)."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:316", "src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:116-166"]
    request: {type: object, properties: {uri: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    behavior:
      - title: Create the wrapping context keys from the editor's wrappingInfo
        source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:123-126
        call: context-key-service.set-context
        input: {key: isWordWrapMinified, value: false}
      - call: context-key-service.set-context
        input: {key: isDominatedByLongLines, value: false}
      - title: On model change, ensureWordWrapSettings applies the model's transient state
        source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:143-165
        call: toggle-word-wrap-controller.read-transient-state
        input: {uri: "= has(input.uri) ? input.uri : 'file:///work/app/src/main.ts'"}
        as: tr
      - call: toggle-word-wrap-controller.apply-word-wrap-state
        input: {uri: "= has(input.uri) ? input.uri : 'file:///work/app/src/main.ts'", state: "= vars.tr.value.state"}
        as: ap
      - return: {word_wrap_override2: "= vars.ap.value.word_wrap_override2"}
  - component: toggle-word-wrap-controller
    name: read-transient-state
    kind: function
    summary: "readTransientState: ICodeEditorService.getTransientModelProperty(model, 'transientWordWrapState')."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:51-53"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    behavior:
      - return: {state: "= input.uri in state.transient ? state.transient[input.uri] : null"}
  - component: toggle-word-wrap-controller
    name: write-transient-state
    kind: function
    summary: "writeTransientState: setTransientModelProperty fires onDidChangeTransientModelProperty, and ensureWordWrapSettings applies the state to the editor."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:44-46"]
    request: {type: object, required: [uri], properties: {uri: {type: string}, state: {}}}
    behavior:
      - set: {state.transient: "= input.state == null ? omit(state.transient, input.uri) : merge(state.transient, {input.uri: input.state})"}
      - title: onDidChangeTransientModelProperty -> ensureWordWrapSettings
        source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:147-149
        call: toggle-word-wrap-controller.apply-word-wrap-state
        input: {uri: "= input.uri", state: "= input.state"}
      - return: {written: true}
  - component: toggle-word-wrap-controller
    name: apply-word-wrap-state
    kind: function
    summary: "_applyWordWrapState: editor.updateOptions({wordWrapOverride2: state ? state.wordWrapOverride : 'inherit'})."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:168-173"]
    request: {type: object, required: [uri], properties: {uri: {type: string}, state: {}}}
    behavior:
      - set: {vars.o: "= input.state == null ? 'inherit' : input.state.word_wrap_override"}
      - set: {state.applied: "= merge(state.applied, {input.uri: vars.o})"}
      - return: {word_wrap_override2: "= vars.o"}

  - component: editor-word-wrap-context-key-tracker
    name: constructor
    kind: function
    summary: "Binds canToggleWordWrap and editorWordWrap and updates them for the focused or active code editor (on window focus/blur and active editor changes)."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:314", "src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:249-266"]
    behavior:
      - title: _update - focused code editor, else active one
        source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:277-297
        call: code-editor-widget.has-text-focus
