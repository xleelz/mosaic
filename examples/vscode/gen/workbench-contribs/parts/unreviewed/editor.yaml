# workbench-contribs part: editor group (codeEditor, accessibility, accessibilitySignals, callHierarchy,
# typeHierarchy, inlayHints, mediaPreview, languageDetection, languageStatus, emmet, folding, codeActions,
# dropOrPasteInto, inlineCompletions, list, sash, limitIndicator, scrollLocking, bracketPairColorizer2Telemetry).
# Paths are relative to the VS Code 1.144.0 snapshot.

configs:
  - id: editor-word-wrap
    type: string
    value: "off"
    default: "off"
    summary: "editor.wordWrap: off | on | wordWrapColumn | bounded, default off (wrappingColumn -1)."
    sources: ["src/vs/editor/common/config/editorOptions.ts:6878-6880", "src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:89-90"]
    attributes: {key: editor.wordWrap, boundary: true, owner: editor}
  - id: editor-selection-clipboard
    type: boolean
    value: true
    default: true
    summary: "editor.selectionClipboard (Linux), default true."
    sources: ["src/vs/editor/common/config/editorOptions.ts:6707", "src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:103-104"]
    attributes: {key: editor.selectionClipboard, boundary: true, owner: editor}
  - id: workbench-editor-empty-hint
    type: string
    value: text
    default: text
    summary: "workbench.editor.empty.hint: text | hidden, default text."
    sources: ["src/vs/workbench/browser/workbench.contribution.ts:167-170", "src/vs/workbench/contrib/codeEditor/browser/emptyTextEditorHint/emptyTextEditorHint.ts:78"]
    attributes: {key: workbench.editor.empty.hint}
  - id: workbench-editor-language-detection-hints
    type: object
    value: {untitledEditors: true, notebookEditors: true}
    default: {untitledEditors: true, notebookEditors: true}
    summary: "workbench.editor.languageDetectionHints, default {untitledEditors: true, notebookEditors: true}."
    sources: ["src/vs/workbench/browser/workbench.contribution.ts:189-191", "src/vs/workbench/contrib/languageDetection/browser/languageDetection.contribution.ts:78"]
    attributes: {key: workbench.editor.languageDetectionHints}
  - id: accessibility-dim-unfocused-enabled
    type: boolean
    value: false
    default: false
    summary: "accessibility.dimUnfocused.enabled, default false (APPLICATION scope)."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityConfiguration.ts:994-999", "src/vs/workbench/contrib/accessibility/browser/unfocusedViewDimmingContribution.ts:32"]
    attributes: {key: accessibility.dimUnfocused.enabled}
  - id: accessibility-dim-unfocused-opacity
    type: number
    value: 0.75
    default: 0.75
    summary: "accessibility.dimUnfocused.opacity, default 0.75, clamped to [0.2, 1]."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityConfiguration.ts:1001-1008", "src/vs/workbench/contrib/accessibility/browser/unfocusedViewDimmingContribution.ts:34-38"]
    attributes: {key: accessibility.dimUnfocused.opacity}
  - id: accessibility-signals-save
    type: object
    value: {sound: never, announcement: never}
    default: {sound: never, announcement: never}
    summary: "accessibility.signals.save: {sound, announcement}, each userGesture | always | never; default never/never."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityConfiguration.ts:855-887", "src/vs/workbench/contrib/accessibilitySignals/browser/commands.ts:57"]
    attributes: {key: accessibility.signals.save}
  - id: accessibility-verbosity-diff-editor-active
    type: boolean
    value: true
    default: true
    summary: "accessibility.verbosity.diffEditorActive (baseVerbosityProperty, default true)."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityConfiguration.ts:228-231", "src/vs/workbench/contrib/accessibilitySignals/browser/openDiffEditorAnnouncement.ts:37"]
    attributes: {key: accessibility.verbosity.diffEditorActive}
  - id: workbench-sash-size
    type: number
    value: 4
    default: 4
    summary: "workbench.sash.size, default 4 (20 on iOS), range 1-20."
    sources: ["src/vs/workbench/contrib/sash/browser/sash.contribution.ts:36-40", "src/vs/workbench/contrib/sash/browser/sash.ts:41"]
    attributes: {key: workbench.sash.size}
  - id: workbench-sash-hover-delay
    type: number
    value: 300
    default: 300
    summary: "workbench.sash.hoverDelay in ms, default 300, range 0-2000."
    sources: ["src/vs/workbench/contrib/sash/browser/sash.contribution.ts:43-47", "src/vs/workbench/contrib/sash/browser/sash.ts:56"]
    attributes: {key: workbench.sash.hoverDelay}
  - id: editor-bracket-pair-colorization-enabled
    type: boolean
    value: true
    default: true
    summary: "editor.bracketPairColorization.enabled, default true."
    sources: ["src/vs/editor/common/config/editorOptions.ts:4831-4833", "src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:37-38"]
    attributes: {key: editor.bracketPairColorization.enabled, boundary: true, owner: editor}

components:
  # boundary components owned by other areas
  - {id: configuration-service, attributes: {boundary: true, owner: platform-core}}
  - {id: context-key-service, attributes: {boundary: true, owner: platform-core}}
  - {id: storage-service, attributes: {boundary: true, owner: platform-core}}
  - {id: command-service, attributes: {boundary: true, owner: platform-core}}
  - {id: opener-service, attributes: {boundary: true, owner: platform-core}}
  - {id: telemetry-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: quick-input-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: clipboard-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: notification-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: statusbar-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: editor-resolver-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: language-detection-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: code-editor-widget, attributes: {boundary: true, owner: editor}}
  - {id: cursors-controller, attributes: {boundary: true, owner: editor}}
  - {id: text-model, attributes: {boundary: true, owner: editor}}
  - {id: language-features-service, attributes: {boundary: true, owner: editor}}
  - {id: inline-completions-model, attributes: {boundary: true, owner: editor}}
  - {id: ext-host-language-features, attributes: {boundary: true, owner: exthost}}
  - {id: extensions-workbench-service, attributes: {boundary: true, owner: remote-server}}
  - {id: language-status-service-impl, attributes: {boundary: true, owner: workbench-shell}}

  # ---------- codeEditor ----------
  - id: toggle-word-wrap-controller
    name: ToggleWordWrapController
    kind: module
    parent: code-editor-toggle-word-wrap
    summary: "Editor contribution that applies the per-model transient word wrap override (wordWrapOverride2). Its state also holds the transient model property 'transientWordWrapState' that ICodeEditorService keeps per text model."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:112"]
    state:
      schema: {type: object, properties: {transient: {type: object}, applied: {type: object}}}
      initial: {transient: {}, applied: {}}
  - id: editor-word-wrap-context-key-tracker
    name: EditorWordWrapContextKeyTracker
    kind: module
    parent: code-editor-toggle-word-wrap
    summary: "Workbench contribution that sets canToggleWordWrap and editorWordWrap for the focused or active code editor."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:239"]
  - id: editor-dictation
    name: EditorDictation
    kind: module
    parent: code-editor-editor-dictation
    summary: "Editor contribution running dictation into the editor, through the built-in on-device engine or a speech provider extension."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:225"]
    state:
      schema: {type: object, properties: {in_progress: {type: boolean}, engine: {type: string}}}
      initial: {in_progress: false, engine: ""}
  - id: selection-clipboard
    name: SelectionClipboard
    kind: module
    parent: code-editor-selection-clipboard-native
    summary: "Linux editor contribution writing the editor selection to the X11 selection clipboard (100 ms after a selection change)."
    sources: ["src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:26"]
    state:
      schema: {type: object, properties: {enabled: {type: boolean}}}
      initial: {enabled: false}
  - id: linux-selection-clipboard-paste-preventer
    name: LinuxSelectionClipboardPastePreventer
    kind: module
    parent: code-editor-selection-clipboard-native
    summary: "Linux workbench contribution that prevents the middle-click paste when editor.selectionClipboard is off."
    sources: ["src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:90"]
  - id: empty-text-editor-hint-contribution
    name: EmptyTextEditorHintContribution
    kind: module
    parent: code-editor-empty-text-editor-hint
    summary: "Editor contribution that shows the empty editor hint in an empty untitled plaintext editor (or when an inline chat agent exists)."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/emptyTextEditorHint/emptyTextEditorHint.ts:37"]
    state:
      schema: {type: object, properties: {listening: {type: boolean}, hint_shown: {type: boolean}}}
      initial: {listening: false, hint_shown: false}
  - id: editor-features-instantiator
    name: EditorFeaturesInstantiator
    kind: module
    parent: code-editor-editor-features
    summary: "Instantiates all registered editor features once, when the first code or diff editor is created."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/editorFeatures.ts:15"]
    state:
      schema: {type: object, properties: {instantiated: {type: boolean}}}
      initial: {instantiated: false}
  - id: display-change-remeasure-fonts
    name: DisplayChangeRemeasureFonts
    kind: module
    parent: code-editor-display-change-remeasure-fonts-native
    summary: "Clears all cached font measurements (throttled, 2 s) when the native host reports a display change."
    sources: ["src/vs/workbench/contrib/codeEditor/electron-browser/displayChangeRemeasureFonts.ts:14"]
    state:
      schema: {type: object, properties: {font_infos_cleared: {type: integer}}}
      initial: {font_infos_cleared: 0}
  - id: sleep-resume-repaint-minimap
    name: SleepResumeRepaintMinimap
    kind: module
    parent: code-editor-sleep-resume-repaint-minimap-native
    summary: "Forces a full render of every code editor when the OS resumes from sleep."
    sources: ["src/vs/workbench/contrib/codeEditor/electron-browser/sleepResumeRepaintMinimap.ts:13"]
    state:
      schema: {type: object, properties: {repaints: {type: integer}}}
      initial: {repaints: 0}

  # ---------- accessibility ----------
  - id: accessible-view
    name: AccessibleView
    kind: module
    parent: accessible-view-service
    summary: "The accessible view / accessibility help widget created lazily by AccessibleViewService; tracks the current content provider."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibleView.ts:71"]
    state:
      schema: {type: object, properties: {current_provider: {type: ["object", "null"]}, quick_pick_open: {type: boolean}}}
      initial: {current_provider: null, quick_pick_open: false}
  - id: accessibility-status-contribution
    name: AccessibilityStatus
    kind: module
    parent: accessibility-contribution
    summary: "Shows the Screen Reader Optimized status bar entry and prompts once when a screen reader is detected under editor.accessibilitySupport auto."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:18"]
    state:
      schema: {type: object, properties: {prompted_screen_reader: {type: boolean}, status_entry: {type: boolean}}}
      initial: {prompted_screen_reader: false, status_entry: false}
  - id: editor-accessibility-help-contribution
    name: EditorAccessibilityHelpContribution
    kind: module
    parent: accessibility-contribution
    summary: "Registers the editor implementation (priority 90) of the accessibility help action."
    sources: ["src/vs/workbench/contrib/accessibility/browser/editorAccessibilityHelp.ts:28"]
    state:
      schema: {type: object, properties: {registered: {type: boolean}}}
      initial: {registered: false}
  - id: unfocused-view-dimming-contribution
    name: UnfocusedViewDimmingContribution
    kind: module
    parent: accessibility-contribution
    summary: "Writes a style sheet with opacity filters for unfocused editors and terminals when accessibility.dimUnfocused.enabled."
    sources: ["src/vs/workbench/contrib/accessibility/browser/unfocusedViewDimmingContribution.ts:14"]
    state:
      schema: {type: object, properties: {opacity: {type: ["number", "null"]}}}
      initial: {opacity: null}
  - id: save-accessibility-signal-contribution
    name: SaveAccessibilitySignalContribution
    kind: module
    parent: accessibility-contribution
    summary: "Plays the save accessibility signal for every working copy save (userGesture when the save was explicit)."
    sources: ["src/vs/workbench/contrib/accessibilitySignals/browser/saveAccessibilitySignal.ts:12"]
  - id: diff-editor-active-announcement-contribution
    name: DiffEditorActiveAnnouncementContribution
    kind: module
    parent: accessibility-contribution
    summary: "Announces 'Diff editor' when a diff editor becomes active, only with a screen reader and accessibility.verbosity.diffEditorActive."
    sources: ["src/vs/workbench/contrib/accessibilitySignals/browser/openDiffEditorAnnouncement.ts:16"]
    state:
      schema: {type: object, properties: {listening: {type: boolean}}}
      initial: {listening: false}
  - id: dynamic-speech-accessibility-configuration
    name: DynamicSpeechAccessibilityConfiguration
    kind: module
    parent: accessibility-contribution
    summary: "Registers the accessibility.voice.* settings once a speech provider exists."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityConfiguration.ts:1035"]
    state:
      schema: {type: object, properties: {registered_settings: {type: array}}}
      initial: {registered_settings: []}

  - id: speech-accessibility-signal-contribution
    name: SpeechAccessibilitySignalContribution
    kind: module
    parent: accessibility-contribution
    summary: "Plays the voice recording started / stopped signals when a speech-to-text session starts or ends."
    sources: ["src/vs/workbench/contrib/speech/browser/speechAccessibilitySignal.ts:11"]
  - id: media-preview-status-bar-contribution
    name: MediaPreviewStatusBarContribution
    kind: module
    parent: media-preview-contribution
    summary: "Shows zoom, dimensions and file size status bar entries for the active image preview (file size only for audio/video)."
    sources: ["src/vs/workbench/contrib/mediaPreview/browser/mediaPreviewStatusBar.ts:36"]
    state:
      schema: {type: object, properties: {entries: {type: object}}}
      initial: {entries: {}}
  - id: limit-indicator-contribution-impl
    name: LimitIndicatorContribution
    kind: module
    parent: limit-indicator-contribution
    summary: "Language status items (warning severity) telling which features (color decorators, folding ranges, diagnostic highlights) the active editor limited for performance."
    sources: ["src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:31"]

  # ---------- call / type hierarchy ----------
  - id: call-hierarchy-controller
    name: CallHierarchyController
    kind: module
    parent: call-hierarchy-contribution
    summary: "Editor contribution owning the call hierarchy peek widget and its context keys."
    sources: ["src/vs/workbench/contrib/callHierarchy/browser/callHierarchy.contribution.ts:40"]
    state:
      schema: {type: object, properties: {visible: {type: boolean}, direction: {type: string}, root: {type: ["object", "null"]}}}
      initial: {visible: false, direction: "", root: null}
  - id: call-hierarchy-model
    name: CallHierarchyModel
    kind: module
    parent: call-hierarchy-common
    summary: "A call hierarchy session from the first provider; the API commands keep up to 10 sessions by id in _models."
    sources: ["src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:65"]
    state:
      schema: {type: object, properties: {models: {type: object}}}
      initial: {models: {}}
  - id: type-hierarchy-controller
    name: TypeHierarchyController
    kind: module
    parent: type-hierarchy-contribution
    summary: "Editor contribution owning the type hierarchy peek widget and its context keys."
    sources: ["src/vs/workbench/contrib/typeHierarchy/browser/typeHierarchy.contribution.ts:39"]
    state:
      schema: {type: object, properties: {visible: {type: boolean}, direction: {type: string}, root: {type: ["object", "null"]}}}
      initial: {visible: false, direction: "", root: null}
  - id: type-hierarchy-model
    name: TypeHierarchyModel
    kind: module
    parent: type-hierarchy-common
    summary: "A type hierarchy session from the first provider; the API commands keep sessions by each root's _sessionId."
    sources: ["src/vs/workbench/contrib/typeHierarchy/common/typeHierarchy.ts:53"]
    state:
      schema: {type: object, properties: {models: {type: object}}}
      initial: {models: {}}

  # ---------- inlay hints, language detection / status ----------
  - id: inlay-hints-accessibility
    name: InlayHintsAccessibility
    kind: module
    parent: inlay-hints-accessibilty
    summary: "Editor contribution that renders the current line with its inlay hints into a focused aria element for screen readers."
    sources: ["src/vs/workbench/contrib/inlayHints/browser/inlayHintsAccessibilty.ts:25"]
    state:
      schema: {type: object, properties: {reading: {type: boolean}, line: {type: integer}}}
      initial: {reading: false, line: 0}
  - id: language-detection-status-contribution
    name: LanguageDetectionStatusContribution
    kind: module
    parent: language-detection-contribution
    summary: "Shows a status bar lightbulb offering the detected language for untitled editors whose detected language differs."
    sources: ["src/vs/workbench/contrib/languageDetection/browser/languageDetection.contribution.ts:31"]
    state:
      schema: {type: object, properties: {entry_shown: {type: boolean}}}
      initial: {entry_shown: false}
  - id: language-status-contribution-impl
    name: LanguageStatusContribution
    kind: module
    parent: language-status-contribution
    summary: "Creates a LanguageStatus status bar controller per editor part; restores the pinned (dedicated) items from profile storage."
    sources: ["src/vs/workbench/contrib/languageStatus/browser/languageStatus.ts:64"]
    state:
      schema: {type: object, properties: {dedicated: {type: array}}}
      initial: {dedicated: []}

  # ---------- media preview ----------
  - id: media-preview-editor-resolver-contribution
    name: MediaPreviewEditorResolverContribution
    kind: module
    parent: media-preview-contribution
    summary: "Registers the built-in image, video and audio preview editors with the editor resolver."
    sources: ["src/vs/workbench/contrib/mediaPreview/browser/mediaPreview.contribution.ts:121"]
  - id: active-image-preview-context-key-contribution
    name: ActiveImagePreviewContextKeyContribution
    kind: module
    parent: media-preview-contribution
    summary: "Binds the active-image-preview context key to whether the active inner editor pane is an ImagePreviewEditor."
    sources: ["src/vs/workbench/contrib/mediaPreview/browser/activeMediaPreview.ts:51"]

  # ---------- small contributions ----------
  - id: diagnostic-decoration-limit-reporter
    name: DiagnosticDecorationLimitReporter
    kind: module
    parent: limit-indicator-contribution
    summary: "Editor contribution reporting whether diagnostics or their highlights were truncated for performance."
    sources: ["src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:113"]
    state:
      schema: {type: object, properties: {limited: {}}}
      initial: {limited: false}
  - id: list-context
    name: ListContext
    kind: module
    parent: list-contribution
    summary: "Creates the global listSupportsTypeNavigation (and deprecated listSupportsKeyboardNavigation) context keys."
    sources: ["src/vs/workbench/contrib/list/browser/list.contribution.ts:11"]
  - id: sash-settings-controller
    name: SashSettingsController
    kind: module
    parent: sash-contribution
    summary: "Applies workbench.sash.size (clamped) and workbench.sash.hoverDelay to all sashes."
    sources: ["src/vs/workbench/contrib/sash/browser/sash.ts:20"]
    state:
      schema: {type: object, properties: {size: {type: integer}, hover_size: {type: integer}, hover_delay: {type: integer}}}
      initial: {size: 0, hover_size: 0, hover_delay: 0}
  - id: bracket-pair-colorizer2-telemetry-contribution-impl
    name: BracketPairColorizer2TelemetryContribution
    kind: module
    parent: bracket-pair-colorizer2-telemetry-contribution
    summary: "Logs whether the Bracket Pair Colorizer 2 extension is enabled together with native bracket pair colorization."
    sources: ["src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:15"]

