    summary: "Registered by AccessibilityStatus (status bar entry command): prompts whether to enable editor.accessibilitySupport; Yes writes on, No writes off, Learn More opens the docs."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:35", "src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:52-80"]
    request: {type: object}
    behavior:
      - title: Sticky urgent prompt with Yes / No / Learn More
        source: src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:53-77
        call: notification-service.prompt
        input:
          severity: info
          message: Screen reader usage detected. Do you want to enable editor.accessibilitySupport to optimize the editor for screen reader usage?
          choices: ["Yes", "No", Learn More]
        as: answer
      - if: "vars.answer.value.choice == 'Yes'"
        then:
          - call: configuration-service.update-value
            source: src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:59
            input: {key: editor.accessibilitySupport, value: "on", target: user}
          - return: {answer: "Yes"}
      - if: "vars.answer.value.choice == 'No'"
        then:
          - call: configuration-service.update-value
            source: src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:64
            input: {key: editor.accessibilitySupport, value: "off", target: user}
          - return: {answer: "No"}
      - if: "vars.answer.value.choice == 'Learn More'"
        then:
          - call: opener-service.open
            source: src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:70
            input: {uri: "https://code.visualstudio.com/docs/editor/accessibility#_screen-readers"}
          - return: {answer: Learn More}
      - return: {answer: dismissed}

  - component: accessibility-status-contribution
