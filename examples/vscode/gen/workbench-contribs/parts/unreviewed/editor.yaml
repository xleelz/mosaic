          vars.sound: "= 'sound' in vars.c && (vars.c.sound in ['on', 'always'] || (vars.c.sound == 'userGesture' && vars.ug))"
          vars.announce: "= 'announcement' in vars.c && (vars.c.announcement in ['on', 'always'] || (vars.c.announcement == 'userGesture' && vars.ug))"
      - return: {sound_played: "= vars.sound", announced: "= vars.announce"}

