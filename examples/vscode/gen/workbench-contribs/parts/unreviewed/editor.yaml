  - component: empty-text-editor-hint-contribution
    name: constructor
    kind: function
    summary: "Editor contribution: subscribes to model, language, content, decoration, readOnly, setting and inline chat changes, each calling update()."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/emptyTextEditorHint/emptyTextEditorHint.ts:315", "src/vs/workbench/contrib/codeEditor/browser/emptyTextEditorHint/emptyTextEditorHint.ts:43-75"]
