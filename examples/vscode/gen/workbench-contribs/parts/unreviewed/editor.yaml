  - component: accessibility-signal-service
    name: play-signal
    kind: function
    summary: "playSignal: announces when the announcement modality is enabled, plays the sound when the sound modality is enabled. A modality is enabled by on/always, by auto with a screen reader, or by userGesture when triggered by a user gesture (accessibility.signals.<signal>)."
    sources: ["src/vs/platform/accessibilitySignal/browser/accessibilitySignalService.ts:123-135", "src/vs/platform/accessibilitySignal/browser/accessibilitySignalService.ts:273-275"]
    request:
      type: object
      required: [signal]
      properties:
        signal: {type: string, examples: [save]}
        user_gesture: {type: boolean, default: false}
    behavior:
      - call: configuration-service.get-value
        input: {key: "= 'accessibility.signals.' + input.signal"}
        as: cfg
      - set: {vars.c: "= vars.cfg.value.value == null ? {} : vars.cfg.value.value"}
      - set: {vars.ug: "= has(input.user_gesture) && input.user_gesture"}
      - title: checkEnabledState for each modality
        source: src/vs/platform/accessibilitySignal/browser/accessibilitySignalService.ts:273-275
