            input: {id: status.editor.screenReaderMode, text: Screen Reader Optimized, command: showEditorScreenReaderNotification, alignment: right}
      - set: {state.status_entry: "= vars.optimized"}
      - return: {updated: true, status_entry: "= vars.optimized"}

