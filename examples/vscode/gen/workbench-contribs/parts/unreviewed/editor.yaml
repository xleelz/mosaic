            - return: {engine: builtin, in_progress: true}
          provider:
            - title: startWithProvider - inProgress is set before the speech session is created
              source: src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:302-310
              set: {state.in_progress: true, state.engine: provider}
            - call: context-key-service.set-context
              input: {key: editorDictation.inProgress, value: true}
            - call: code-editor-widget.has-text-focus
              as: ed
            - title: Recognized text (plus a space) replaces the preview at the cursor
              source: src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:379-386
              call: code-editor-widget.execute-edits
              input:
                uri: "= vars.ed.value.uri"
                source: editorDictation
                edits: [{range: {start_line: 1, start_column: 1, end_line: 1, end_column: 1}, text: "= (has(input.text) ? input.text : 'hello world') + ' '"}]
            - return: {engine: provider, in_progress: true}
  - component: editor-dictation
