    kind: function
    sources: ["src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:247-249"]
    behavior:
      - return: {in_progress: "= state.in_progress"}
  - component: editor-dictation
    name: start
    kind: function
    summary: "start(): prefers the built-in on-device engine when configured, else the speech provider extension's session; recognized text is inserted at the cursor."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:251-260"]
    request: {type: object, properties: {text: {type: string, examples: ["hello world"]}}}
    behavior:
      - choice: engine
        default: builtin
        options:
          builtin:
            - title: startBuiltin - shared chat dictation session; inProgress only once the session took
              source: src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:268-289
              choice: session_started
              default: started
              options:
                started: []
                failed: [{return: {engine: builtin, in_progress: false}}]
            - set: {state.in_progress: true, state.engine: builtin}
            - call: context-key-service.set-context
