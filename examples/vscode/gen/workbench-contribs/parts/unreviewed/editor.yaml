    sources: ["src/vs/workbench/contrib/accessibilitySignals/browser/accessibilitySignal.contribution.ts:21", "src/vs/workbench/contrib/accessibilitySignals/browser/commands.ts:105-155"]
    request: {type: object}
    behavior:
      - call: configuration-service.get-value
        source: src/vs/platform/accessibility/browser/accessibilityService.ts:145-148
        input: {key: editor.accessibilitySupport}
        as: sr
      - choice: screen_reader_detected
        default: "no"
        options:
          "yes": [{set: {vars.optimized: "= vars.sr.value.value == 'on' || vars.sr.value.value == 'auto'"}}]
          "no": [{set: {vars.optimized: "= vars.sr.value.value == 'on'"}}]
      - title: Without a screen reader the pick only hides on accept
        source: src/vs/workbench/contrib/accessibilitySignals/browser/commands.ts:125-131
        if: "!vars.optimized"
        then: [{return: {updated: false}}]
      - call: configuration-service.get-value
        source: src/vs/workbench/contrib/accessibilitySignals/browser/commands.ts:135
        input: {key: accessibility.signals.save}
        as: cur
      - set: {vars.sound: "= vars.cur.value.value != null && 'sound' in vars.cur.value.value ? vars.cur.value.value.sound : 'never'"}
      - choice: save_announcement
        default: enable
        options:
          enable:
            - title: Enabled user-gesture signals get announcement 'userGesture'
              source: src/vs/workbench/contrib/accessibilitySignals/browser/commands.ts:134-138
              set: {vars.value: "= {'sound': vars.sound, 'announcement': 'userGesture'}"}
          disable:
            - title: Disabled user-gesture signals get announcement 'never'
              source: src/vs/workbench/contrib/accessibilitySignals/browser/commands.ts:140-145
              set: {vars.value: "= {'sound': vars.sound, 'announcement': 'never'}"}
      - call: configuration-service.update-value
        input: {key: accessibility.signals.save, value: "= vars.value"}
      - return: {updated: true, value: "= vars.value"}

