  # ---------- call hierarchy ----------
  - id: workbench-contribs-editor-call-hierarchy-peek
    description: "With a call hierarchy provider for typescript, the controller sets editorHasCallHierarchyProvider; Peek Call Hierarchy shows incoming calls first; the title actions switch direction."
    fixtures: [editor-main-open, workbench-contribs-seed]
    state:
      language-features-service@w1: {providers: {call-hierarchy: [{handle: 7, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]}}
    steps:
      - {interface: call-hierarchy-controller.constructor, caller: editor, input: {language_id: typescript}, as: c}
      - {interface: call-hierarchy-contribution.cmd-editor-showcallhierarchy, caller: user, input: {}, as: p}
      - {interface: call-hierarchy-contribution.cmd-editor-showoutgoingcalls, caller: user, input: {}, as: o}
      - {interface: call-hierarchy-contribution.cmd-editor-showincomingcalls, caller: user, input: {}, as: i}
    expect:
      - "steps.c.result.value.has_provider"
      - "steps.p.result.value.shown && steps.p.result.value.direction == 'incomingCalls'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.prepare-call-hierarchy' && e.instance == 'eh1' && e.input.handle == 7)"
      - "steps.o.result.value.direction == 'outgoingCalls' && steps.i.result.value.direction == 'incomingCalls'"
      - "state['call-hierarchy-controller@w1'].visible && state['call-hierarchy-controller@w1'].direction == 'incomingCalls'"
  - id: workbench-contribs-editor-call-hierarchy-no-provider
    fixtures: [editor-main-open, workbench-contribs-seed]
    steps:
      - {interface: call-hierarchy-controller.constructor, caller: editor, input: {language_id: typescript}, as: c}
      - {interface: call-hierarchy-contribution.cmd-editor-showcallhierarchy, caller: user, input: {}, as: p}
    expect:
      - "!steps.c.result.value.has_provider && !steps.p.result.value.shown"
      - "!state['call-hierarchy-controller@w1'].visible"
  - id: workbench-contribs-editor-call-hierarchy-api
    description: "vscode.prepareCallHierarchy returns the root; incoming and outgoing calls resolve through the same session in the extension host."
    fixtures: [editor-main-open, workbench-contribs-seed]
    state:
      language-features-service@w1: {providers: {call-hierarchy: [{handle: 7, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]}}
    steps:
      - {interface: call-hierarchy-common.cmd--executepreparecallhierarchy, caller: third-party-extension, input: {command_id: _executePrepareCallHierarchy, args: ["file:///work/app/src/main.ts", {line_number: 1, column: 10}]}, as: p}
      - {interface: call-hierarchy-common.cmd--executeprovideincomingcalls, caller: third-party-extension, input: {command_id: _executeProvideIncomingCalls, args: ["= steps.p.result.value.items[0]"]}, as: i}
      - {interface: call-hierarchy-common.cmd--executeprovideoutgoingcalls, caller: third-party-extension, input: {command_id: _executeProvideOutgoingCalls, args: ["= steps.p.result.value.items[0]"]}, as: o}
    expect:
      - "size(steps.p.result.value.items) == 1 && steps.p.result.value.items[0].uri == 'file:///work/app/src/main.ts'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.provide-call-hierarchy-incoming-calls' && e.input.handle == 7)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.provide-call-hierarchy-outgoing-calls' && e.input.handle == 7)"
      - "steps.p.result.value.items[0].session_id in state['call-hierarchy-model@w1'].models"
  - id: workbench-contribs-editor-call-hierarchy-api-unknown
    description: "Without a provider prepare returns []; an item of an unknown session gives []; a non-URI argument throws."
    fixtures: [editor-main-open, workbench-contribs-seed]
    steps:
      - {interface: call-hierarchy-common.cmd--executepreparecallhierarchy, caller: third-party-extension, input: {command_id: _executePrepareCallHierarchy, args: ["file:///work/app/src/main.ts", {line_number: 1, column: 10}]}, as: p}
      - {interface: call-hierarchy-common.cmd--executeprovideincomingcalls, caller: third-party-extension, input: {command_id: _executeProvideIncomingCalls, args: [{session_id: gone}]}, as: i}
      - {interface: call-hierarchy-common.cmd--executepreparecallhierarchy, caller: third-party-extension, input: {command_id: _executePrepareCallHierarchy, args: [42]}, as: bad}
    expect:
      - "size(steps.p.result.value.items) == 0 && size(steps.i.result.value.calls) == 0"
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'unexpected-type'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.prepare-call-hierarchy')"

