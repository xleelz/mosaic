  - component: accessibility-status-contribution
    name: on-did-change-configuration
    kind: function
    subscribe: [configuration-service.on-did-change-configuration]
    summary: "onScreenReaderModeChange on editor.accessibilitySupport changes: under auto with a detected screen reader, prompt once (after 100 ms); then refresh the status entry."
    sources: ["src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:45-49", "src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:99-117"]
    behavior:
      - if: "!has(input.affected_keys) || !('editor.accessibilitySupport' in input.affected_keys)"
        then: [{return: {updated: false}}]
      - call: configuration-service.get-value
        source: src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:102-104
        input: {key: editor.accessibilitySupport}
        as: cfg
      - choice: screen_reader_detected
        default: "no"
        options:
