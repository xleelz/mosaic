      - return: {action: stopped}
  - component: editor-dictation
    name: constructor
    kind: function
    summary: "Lazy editor contribution: creates the dictation widget and binds editorDictation.inProgress."
    sources: ["src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:406", "src/vs/workbench/contrib/codeEditor/browser/dictation/editorDictation.ts:232-244"]
    behavior:
      - title: Bind editorDictation.inProgress (false)
