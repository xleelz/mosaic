        else:
          - call: ext-host-language-features.provide-call-hierarchy-outgoing-calls
            source: src/vs/workbench/contrib/callHierarchy/common/callHierarchy.ts:117
            'on': "= 'eh' + self.substring(1)"
            input: {handle: "= vars.m.handle", session_id: "= input.session_id", item_id: "= input.session_id", token: {canceled: false}}
            as: r
            on_error: [{return: {calls: []}}]
      - return: {calls: "= has(vars.r.value.calls) ? vars.r.value.calls : []"}

