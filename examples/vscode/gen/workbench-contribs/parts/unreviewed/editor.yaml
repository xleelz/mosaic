          "no": [{set: {vars.optimized: "= vars.cfg.value.value == 'on'"}}]
      - title: auto + screen reader, not prompted yet -> prompt after 100 ms
        source: src/vs/workbench/contrib/accessibility/browser/accessibilityStatus.ts:103-110
