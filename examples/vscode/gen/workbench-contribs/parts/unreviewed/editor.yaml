            source: src/vs/workbench/contrib/codeEditor/browser/toggleWordWrap.ts:294-296
            call: context-key-service.set-context
            input: {key: canToggleWordWrap, value: false}
          - call: context-key-service.set-context
            input: {key: editorWordWrap, value: false}
