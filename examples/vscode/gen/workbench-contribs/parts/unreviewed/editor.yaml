  # =====================================================================
  # limit indicator, list, sash, bracket pair telemetry
  # =====================================================================
  - component: media-preview-status-bar-contribution
    name: constructor
    kind: function
    summary: "AfterRestored contribution: on every active inner editor pane change, an image preview shows zoom (when an image is loaded), dimensions and file size; an audio/video player shows the file size; any other pane clears the entries."
    sources: ["src/vs/workbench/contrib/mediaPreview/browser/mediaPreview.contribution.ts:240", "src/vs/workbench/contrib/mediaPreview/browser/mediaPreviewStatusBar.ts:45-80"]
    request:
      type: object
      properties:
        pane_kind: {type: string, enum: [image, media, other], examples: [image]}
        scale: {type: number, examples: [1]}
        width: {type: integer, examples: [640]}
        height: {type: integer, examples: [480]}
        file_size: {type: integer, examples: [2048]}
    behavior:
      - set: {vars.kind: "= has(input.pane_kind) ? input.pane_kind : 'other'"}
      - title: _showStatusOf - image pane, media player input, or nothing
        source: src/vs/workbench/contrib/mediaPreview/browser/mediaPreviewStatusBar.ts:55-80
        set:
          vars.zoom: "= vars.kind == 'image' && has(input.scale)"
          vars.dims: "= vars.kind == 'image' && has(input.width) && has(input.height)"
          vars.size: "= vars.kind != 'other' && has(input.file_size)"
      - title: _update - add (or update) an entry per available value, clear the others
        source: src/vs/workbench/contrib/mediaPreview/browser/mediaPreviewStatusBar.ts:82-115
        if: "vars.zoom"
        then:
          - call: statusbar-service.add-entry
            input: {id: status.imagePreview.zoom, text: "= string(int(double(input.scale) * 100.0)) + '%'", command: imagePreview.selectZoomLevel, alignment: right}
      - if: "vars.dims"
        then:
          - call: statusbar-service.add-entry
            input: {id: status.imagePreview.dimensions, text: "= string(input.width) + 'x' + string(input.height)", alignment: right}
      - if: "vars.size"
        then:
          - call: statusbar-service.add-entry
            input: {id: status.mediaPreview.fileSize, text: "= string(input.file_size) + ' B'", alignment: right}
      - set: {state.entries: "= {'zoom': vars.zoom, 'dimensions': vars.dims, 'file_size': vars.size}"}
      - return: = state.entries
  - component: limit-indicator-contribution-impl
    name: constructor
    kind: function
    summary: "Restored contribution: for the active code editor, each limit reporter (color decorators, folding, diagnostics) that is limited adds a warning language status with a Configure command for its setting (none for diagnostics)."
    sources: ["src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:250", "src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:33-58"]
    request:
      type: object
      properties:
        folding_limited: {type: integer, examples: [0], description: "number of folding ranges shown, 0 when not limited"}
        color_limited: {type: integer, examples: [0]}
        diagnostics_limited: {type: string, examples: [""]}
    behavior:
      - title: updateStatusItem - number limits become 'only {0} shown for performance reasons'
        source: src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:212-240
        if: "has(input.color_limited) && input.color_limited > 0"
        then:
          - call: language-status-service-impl.add-status
            input: {id: decoratorsLimitInfo, selector: "*", severity: warning, label: Color decorators, detail: "= 'only ' + string(input.color_limited) + ' shown for performance reasons'", command: workbench.action.openSettings}
      - if: "has(input.folding_limited) && input.folding_limited > 0"
        then:
          - call: language-status-service-impl.add-status
            input: {id: foldingLimitInfo, selector: "*", severity: warning, label: Folding ranges, detail: "= 'only ' + string(input.folding_limited) + ' shown for performance reasons'", command: workbench.action.openSettings}
      - if: "has(input.diagnostics_limited) && input.diagnostics_limited != ''"
        then:
          - call: language-status-service-impl.add-status
            input: {id: diagnosticsLimitInfo, selector: "*", severity: warning, label: Diagnostic highlights, detail: "= input.diagnostics_limited", command: ""}
      - return: {statuses: "= (has(input.color_limited) && input.color_limited > 0 ? 1 : 0) + (has(input.folding_limited) && input.folding_limited > 0 ? 1 : 0) + (has(input.diagnostics_limited) && input.diagnostics_limited != '' ? 1 : 0)"}
  - component: diagnostic-decoration-limit-reporter
    name: constructor
    kind: function
    summary: "Lazy editor contribution: _update on creation, model, renderValidationDecorations/readOnly and marker limit changes; limited is a message when markers or their highlights were truncated, else false (fires onDidChange on change)."
    sources: ["src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:255", "src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:130-180"]
    request:
      type: object
      properties:
        markers_truncated: {type: integer, examples: [0], description: "highlight limit when highlights were truncated, 0 for none"}
        source_truncated: {type: boolean, examples: [false]}
    behavior:
      - set: {vars.lim: "= has(input.markers_truncated) && input.markers_truncated > 0"}
      - set: {vars.src: "= has(input.source_truncated) && input.source_truncated"}
      - title: _getLimitedMessage
        source: src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:169-180
        set:
          vars.msg: "= vars.src && vars.lim ? 'Some diagnostics are not shown, and only ' + string(input.markers_truncated) + ' diagnostics are highlighted in the editor for performance reasons.' : (vars.src ? 'Some diagnostics are not shown for performance reasons.' : (vars.lim ? 'Only ' + string(input.markers_truncated) + ' diagnostics are highlighted in the editor for performance reasons.' : ''))"
      - title: Store the new limited state (onDidChange fires when it differs)
        source: src/vs/workbench/contrib/limitIndicator/browser/limitIndicator.contribution.ts:155-166
        set: {state.limited: "= vars.msg == '' ? false : vars.msg"}
      - return: {limited: "= state.limited"}
  - component: list-context
    name: constructor
    kind: function
    summary: "BlockStartup contribution: creates listSupportsTypeNavigation = true and the deprecated listSupportsKeyboardNavigation = true."
    sources: ["src/vs/workbench/contrib/list/browser/list.contribution.ts:25", "src/vs/workbench/contrib/list/browser/list.contribution.ts:15-22"]
    behavior:
      - call: context-key-service.set-context
        source: src/vs/workbench/contrib/list/browser/list.contribution.ts:18
        input: {key: listSupportsTypeNavigation, value: true}
      - call: context-key-service.set-context
        source: src/vs/workbench/contrib/list/browser/list.contribution.ts:21
        input: {key: listSupportsKeyboardNavigation, value: true}
      - return: {created: 2}
  - component: sash-settings-controller
    name: constructor
    kind: function
    summary: "AfterRestored contribution: applies workbench.sash.size (sash size clamped to 4-20, hover size to 1-8, written as CSS variables and the global sash size) and workbench.sash.hoverDelay, again on each change."
    sources: ["src/vs/workbench/contrib/sash/browser/sash.contribution.ts:16", "src/vs/workbench/contrib/sash/browser/sash.ts:26-57"]
    behavior:
      - call: configuration-service.get-value
        source: src/vs/workbench/contrib/sash/browser/sash.ts:41
        input: {key: workbench.sash.size}
        as: size
      - set: {vars.s: "= vars.size.value.value == null ? 4 : int(vars.size.value.value)"}
      - title: clamp(size, 4, 20) and clamp(size, 1, 8)
        source: src/vs/workbench/contrib/sash/browser/sash.ts:42-52
        set:
          state.size: "= vars.s < 4 ? 4 : (vars.s > 20 ? 20 : vars.s)"
          state.hover_size: "= vars.s < 1 ? 1 : (vars.s > 8 ? 8 : vars.s)"
      - call: configuration-service.get-value
        source: src/vs/workbench/contrib/sash/browser/sash.ts:56
        input: {key: workbench.sash.hoverDelay}
        as: delay
      - set: {state.hover_delay: "= vars.delay.value.value == null ? 300 : int(vars.delay.value.value)"}
      - return: {size: "= state.size", hover_size: "= state.hover_size", hover_delay: "= state.hover_delay"}
  - component: bracket-pair-colorizer2-telemetry-contribution-impl
    name: constructor
    kind: function
    summary: "Restored contribution: after querying local extensions, if coenraads.bracket-pair-colorizer-2 is installed and enabled (globally or for the workspace), logs bracketPairColorizerTwoUsage with whether native colorization is on."
    sources: ["src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:54", "src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:16-51"]
    behavior:
      - call: extensions-workbench-service.query-local
        source: src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:27
        on_error: continue
      - title: The extension must be installed and enabled
        source: src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:28-35
        choice: colorizer
        default: not_installed
        options:
          not_installed: [{return: {logged: false}}]
          disabled: [{return: {logged: false}}]
          enabled: []
      - call: configuration-service.get-value
        source: src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:37-38
        input: {key: editor.bracketPairColorization.enabled}
        as: native
      - call: telemetry-service.public-log2
        source: src/vs/workbench/contrib/bracketPairColorizer2Telemetry/browser/bracketPairColorizer2Telemetry.contribution.ts:48-50
        input: {event_name: bracketPairColorizerTwoUsage, data: {nativeColorizationEnabled: "= vars.native.value.value == true"}}
      - return: {logged: true, native_colorization_enabled: "= vars.native.value.value == true"}

scenarios:
  # ---------- settings toggles ----------
  - id: workbench-contribs-editor-announce-cursor-position
    fixtures: [editor-main-open, workbench-contribs-seed]
    steps:
      - {interface: code-editor-accessibility.cmd-editor-action-announcecursorposition, caller: user, input: {}, as: r}
    expect:
