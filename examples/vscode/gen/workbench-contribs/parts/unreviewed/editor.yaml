      - call: configuration-service.get-value
        source: src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:103
        input: {key: editor.selectionClipboard}
        as: cfg
      - title: Disabled selection clipboard -> stop the upcoming paste
        source: src/vs/workbench/contrib/codeEditor/electron-browser/selectionClipboard.ts:104-108
        return: {prevented: "= vars.cfg.value.value != true"}

