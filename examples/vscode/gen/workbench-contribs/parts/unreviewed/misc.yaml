  - component: workbench-opener-contribution
    name: open
    kind: function
    summary: "open(link): not for external opens; only links inside the workspace (or local files in the sessions window) with a provider; a folder inside the workspace is revealed in the Explorer; files, missing paths and other links fall through to the next opener."
    sources: ["src/vs/workbench/contrib/opener/browser/opener.contribution.ts:34-72"]
    request:
      type: object
      properties:
        link: {type: string, default: "file:///work/app/src"}
        open_external: {type: boolean, default: false}
    behavior:
      - if: "input.open_external"
        then:
          - source: src/vs/workbench/contrib/opener/browser/opener.contribution.ts:35-37
            return: {handled: false}
      - call: workspace-context.get-workspace
        as: ws
        source: src/vs/workbench/contrib/opener/browser/opener.contribution.ts:44
      - if: "!vars.ws.value.folders.exists(f, input.link == f || input.link.startsWith(f + '/'))"
        then:
          - title: Outside the workspace (and not a sessions-window local file); not handled
            source: src/vs/workbench/contrib/opener/browser/opener.contribution.ts:43-46
            return: {handled: false}
      - call: file-service.stat
        as: st
        source: src/vs/workbench/contrib/opener/browser/opener.contribution.ts:48-56
        input: {resource: "= input.link"}
        on_error:
          - if: "error.code == 'file-not-found'"
            then: [{return: {handled: false}}]
          - fail: "= {'code': error.code, 'status': 0, 'message': error.message}"
      - set:
          vars.name: "= input.link.split('/')[size(input.link.split('/')) - 1]"
      - choice: stat_kind
        default: "= vars.name.contains('.') ? 'file' : 'directory'"
        options:
          file:
            - title: Not a folder; let the next opener (the editor) handle it
              source: src/vs/workbench/contrib/opener/browser/opener.contribution.ts:57-59
              return: {handled: false}
          directory: []
      - call: command-service.execute-command
        title: Reveal the folder in the Explorer (revealInExplorer, owned by files-search-scm)
        source: src/vs/workbench/contrib/opener/browser/opener.contribution.ts:61-64
        input: {command_id: revealInExplorer, args: ["= input.link"]}
        on_error: continue
      - return: {handled: true}
