          - call: configuration-service.get-value
            as: v
            input: {key: "= vars.key"}
          - set:
              vars.val: "= vars.v.value.value"
          - set:
              vars.typed: "= vars.kind == 'bool' ? type(vars.val) == bool : type(vars.val) == string"
          - if: "vars.key == 'window.titleBarStyle' && !(vars.typed && vars.val in ['native', 'custom'])"
            then:
              - title: Title bar style is only observed for native or custom
                source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:154
                continue: true
          - if: "vars.key == '_extensionsGallery.enablePPE' && config['product-quality'] == 'stable'"
            then:
              - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:193
                continue: true
          - if: "!vars.typed || (vars.key in state.last && string(state.last[vars.key]) == string(vars.val))"
            then:
              - title: ChangeObserver.handleChange - same value or wrong type, no change
                source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:265-272
                continue: true
          - set:
              state.last: "= merge(state.last, {vars.key: vars.val})"
          - if: "vars.key == 'editor.accessibilitySupport' && vars.val != 'on'"
            then:
              - title: Accessibility support only requires a restart when turned on (Linux)
                source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:171-177
                continue: true
          - if: "vars.key == 'chat.extensionUnification.enabled' && vars.val != true"
            then:
              - title: Extension unification only requires a restart when turned on
                source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:198-199
                continue: true
          - set:
              vars.changed: true
              vars.changed_keys: "= vars.changed_keys + [vars.key]"
      - if: "input.ask_to_relaunch && vars.changed"
        then:
          - title: Ask to restart (the window has focus)
            source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:223-236
            call: dialog-service.confirm
            as: ok
            input: {message: "A setting has changed that requires a restart to take effect.", primary_button: "&&Restart"}
          - if: "vars.ok.value.confirmed"
            then:
              - call: host-service.restart
                source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:234
              - return: {changed: true, changed_keys: "= vars.changed_keys", asked: true, restarted: true}
          - return: {changed: true, changed_keys: "= vars.changed_keys", asked: true, restarted: false}
      - return: {changed: "= vars.changed", changed_keys: "= vars.changed_keys", asked: false, restarted: false}

