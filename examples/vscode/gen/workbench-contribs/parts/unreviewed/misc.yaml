          - title: No accounts; the picker shows a validation message with a back button
            source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountPreferencesForExtensionAction.ts:136-139
            return: {preferred: null}
      - call: quick-input-service.pick
        as: acc
        source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountPreferencesForExtensionAction.ts:141-156
        input: {items: "= input.accounts.map(a, {'label': a})", can_pick_many: false}
      - if: "vars.acc.value.canceled"
        then: [{return: {preferred: null}}]
      - if: "vars.acc.value.picked.label == input.current_preference"
        then:
          - title: Already the preferred account
            source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountPreferencesForExtensionAction.ts:200-204
            return: {preferred: "= input.current_preference", changed: false}
      - call: authentication-query-service.set-preferred-account
        source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountPreferencesForExtensionAction.ts:205
        input: {provider_id: "= vars.provider", kind: extension, id: "= vars.ext", account_label: "= vars.acc.value.picked.label"}
      - return: {preferred: "= vars.acc.value.picked.label", changed: true}

