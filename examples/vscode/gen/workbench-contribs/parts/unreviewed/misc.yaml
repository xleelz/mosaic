# misc group: issue, authentication, workspace, url, workspaces, relauncher, onboarding, telemetry, surveys,
# share, meteredConnection, processExplorer, externalTerminal, replNotebook, splash, welcome*, emergencyAlert,
# encryption, policyExport, tags, editTelemetry (src/vs/workbench/contrib/*).
configs:
  - id: telemetry-feedback-enabled
    type: boolean
    value: true
    default: true
    summary: "telemetry.feedback.enabled: enables the issue reporter, surveys and other feedback (registered by the telemetry service, read by the issue and NPS contributions). No product.json override."
    sources: ["src/vs/platform/telemetry/common/telemetryService.ts:381-383", "src/vs/workbench/contrib/issue/common/issue.contribution.ts:69"]
    attributes: {key: telemetry.feedback.enabled}
  - id: product-report-issue-url
    type: string
    value: "https://github.com/microsoft/vscode/issues/new"
    default: ""
    summary: "product.json reportIssueUrl; the issue reporter commands are registered only when it is set (the OSS product.json sets it)."
    sources: ["product.json:34", "src/vs/workbench/contrib/issue/common/issue.contribution.ts:81"]
    attributes: {key: product.reportIssueUrl}
  - id: issue-reporter-wizard-enabled
    type: boolean
    value: true
    default: true
    summary: "issueReporter.wizard.enabled: open the single-page (wizard) issue reporter instead of the classic one."
    sources: ["src/vs/workbench/contrib/issue/electron-browser/issue.contribution.ts:66-71", "src/vs/workbench/contrib/issue/electron-browser/issueService.ts:53"]
    attributes: {key: issueReporter.wizard.enabled}
  - id: issue-reporter-wizard-open-location
    type: string
    value: window
    default: window
    summary: "issueReporter.wizard.openLocation: editor (a tab) or window (an auxiliary window) for fresh wizard reports."
    sources: ["src/vs/workbench/contrib/issue/electron-browser/issue.contribution.ts:72-82", "src/vs/workbench/contrib/issue/electron-browser/nativeIssueFormService.ts:183"]
    attributes: {key: issueReporter.wizard.openLocation}
  - id: extensions-experimental-issue-quick-access
    type: boolean
    value: true
    default: true
    summary: "extensions.experimental.issueQuickAccess: registers the 'issue ' quick access provider (registered by the extensions contribution, read by NativeIssueContribution)."
    sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:317-320", "src/vs/workbench/contrib/issue/electron-browser/issue.contribution.ts:142"]
    attributes: {key: extensions.experimental.issueQuickAccess}
  - id: network-metered-connection
    type: string
    value: auto
    default: auto
    summary: "network.meteredConnection: auto (detect), on (always metered) or off."
    sources: ["src/vs/platform/meteredConnection/common/meteredConnection.config.contribution.ts:17-25", "src/vs/workbench/contrib/meteredConnection/browser/meteredConnection.contribution.ts:35"]
    attributes: {key: network.meteredConnection}
  - id: workbench-experimental-share-enabled
    type: boolean
    value: false
    default: false
    summary: "workbench.experimental.share.enabled: registers the Share action when true."
    sources: ["src/vs/workbench/contrib/share/browser/share.contribution.ts:164-166", "src/vs/workbench/contrib/share/browser/share.contribution.ts:58"]
    attributes: {key: workbench.experimental.share.enabled}
  - id: product-nps-survey-url
    type: string
    value: ""
    default: ""
    summary: "product.json npsSurveyUrl. The OSS product.json has none, so the NPS prompt never runs; scenarios set a URL to model a Microsoft build."
    sources: ["product.json:1-60", "src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:38"]
    attributes: {key: product.npsSurveyUrl}
  - id: product-surveys
    type: array
    value: []
    default: []
    summary: "product.json surveys (language surveys). Absent in the OSS product.json, so LanguageSurveysContribution does nothing; scenarios add one survey."
    sources: ["product.json:1-60", "src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:143"]
    attributes: {key: product.surveys}
  - id: product-version
    type: string
    value: "1.144.0"
    default: "1.144.0"
    summary: "productService.version, from package.json (product.json has no version). Stored as the surveys' skip version."
    sources: ["package.json:3", "src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:68"]
    attributes: {key: product.version}
  - id: product-emergency-alert-url
    type: string
    value: ""
    default: ""
    summary: "product.json emergencyAlertUrl. Absent in the OSS product.json, so EmergencyAlert never polls; scenarios set one."
    sources: ["product.json:1-60", "src/vs/workbench/contrib/emergencyAlert/electron-browser/emergencyAlert.contribution.ts:52"]
    attributes: {key: product.emergencyAlertUrl}
  - id: product-enable-telemetry
    type: boolean
    value: false
    default: false
    summary: "product.json enableTelemetry. Absent in the OSS product.json, so a built OSS product reports no usage telemetry (supportsTelemetry is false)."
    sources: ["product.json:1-60", "src/vs/platform/telemetry/common/telemetryUtils.ts:96-102"]
    attributes: {key: product.enableTelemetry}
  - id: telemetry-telemetry-level
    type: string
    value: all
    default: all
    summary: "telemetry.telemetryLevel (all, error, crash, off). Usage telemetry needs all."
    sources: ["src/vs/platform/telemetry/common/telemetryService.ts:337-347", "src/vs/workbench/contrib/tags/electron-browser/workspaceTags.ts:39"]
    attributes: {key: telemetry.telemetryLevel}
  - id: onboarding-enabled
    type: boolean
    value: true
    default: true
    summary: "onboarding.enabled: master switch for automatic onboarding tours."
    sources: ["src/vs/workbench/contrib/onboarding/browser/onboarding.contribution.ts:85-88", "src/vs/workbench/contrib/onboarding/browser/onboardingService.ts:248"]
    attributes: {key: onboarding.enabled}
  - id: telemetry-edit-stats-enabled
    type: boolean
    value: true
    default: true
    summary: "telemetry.editStats.enabled: edit-source tracking telemetry (only sent when usage telemetry is on)."
    sources: ["src/vs/workbench/contrib/editTelemetry/browser/editTelemetry.contribution.ts:28-31", "src/vs/workbench/contrib/editTelemetry/browser/editTelemetryContribution.ts:33"]
    attributes: {key: telemetry.editStats.enabled}
  - id: editor-ai-stats-enabled
    type: boolean
    value: false
    default: false
    summary: "editor.aiStats.enabled: the AI statistics gauge."
    sources: ["src/vs/workbench/contrib/editTelemetry/browser/editTelemetry.contribution.ts:38-41", "src/vs/workbench/contrib/editTelemetry/browser/editTelemetryContribution.ts:42"]
    attributes: {key: editor.aiStats.enabled}

components:
  # ---- boundary components (other areas own them) ----
  - {id: authentication-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: authentication-usage-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: authentication-access-service, attributes: {boundary: true, owner: workbench-shell}}
  - {id: authentication-query-service, attributes: {boundary: true, owner: workbench-shell}}
