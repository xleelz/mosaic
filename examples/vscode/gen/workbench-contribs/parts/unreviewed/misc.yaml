  - component: troubleshoot-issue-service
    name: resume
    kind: function
    summary: "Resume: in stage EXTENSIONS (no bisect running) ask to reproduce with extensions disabled; in stage WORKBENCH reproduce with an empty transient profile and ask to report; then stop."
    sources:
      - src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:128-142
      - src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:163-252
    behavior:
      - call: storage-service.get
        as: st
        input: {key: issueTroubleshootState, scope: profile}
      - if: "vars.st.value.value == null"
        then:
          - source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:129-131
            return: {outcome: inactive}
      - set:
          vars.stage: "= vars.st.value.value.contains('\"stage\":2') ? 2 : 1"
          vars.outcome: none
      - if: "vars.stage == 1"
        then:
          - title: Stage EXTENSIONS; without user extensions go straight to stage WORKBENCH
            source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:163-167
            call: extension-management-service.get-installed
            on_error: continue
          - choice: user_extensions
            default: installed
            options:
              none:
                - set: {vars.stage: 2}
              installed:
                - call: notification-service.prompt
                  source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:169
                  input: {severity: info, message: "Issue troubleshooting is active and has temporarily disabled all installed extensions. Check if you can still reproduce the problem and proceed by selecting from these options.", choices: ["I Can't Reproduce", "I Can Reproduce", "Stop"]}
                - choice: extensions_disabled_answer
                  default: bad
                  options:
                    good:
                      - title: Not reproducible with extensions disabled; switch back and bisect the enabled extensions, then reload
                        source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:170-173
                        call: user-data-profile-management-service.switch-profile
                        input: {profile: __default__profile__}
                      - call: extension-bisect-service.start
                        source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:199-200
                        input: {extensions: []}
                      - call: host-service.reload
                        source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:201
                      - set: {vars.outcome: bisect}
                    bad:
                      - title: Still reproducible; move to stage WORKBENCH
                        source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:174-176
                        call: storage-service.store
                        input: {key: issueTroubleshootState, value: "{\"stage\":2,\"profile\":\"__default__profile__\"}", scope: profile, target: machine}
                      - set: {vars.stage: 2}
                    stop:
                      - source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:177-179
                        call: troubleshoot-issue-service.stop
                      - return: {outcome: stopped}
      - if: "vars.stage == 2"
        then:
          - title: Stage WORKBENCH; reproduce in a transient empty profile
            source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:182-185
            call: user-data-profile-management-service.create-and-enter-transient-profile
          - call: notification-service.prompt
            source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:204-224
            input: {severity: info, message: "Issue troubleshooting is active and has temporarily reset your configurations to defaults. Check if you can still reproduce the problem and proceed by selecting from these options.", choices: ["I Can't Reproduce", "I Can Reproduce", "Stop"]}
          - choice: empty_profile_answer
            default: bad
            options:
              stop:
                - source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:186-188
                  call: troubleshoot-issue-service.stop
                - return: {outcome: stopped}
              good:
                - title: Caused by the configuration; report it (stable builds first suggest Insiders)
                  source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:189-191
                  call: native-issue-service.open-reporter
                  input: {data: {issueBody: "> Issue troubleshooting has identified that the issue is caused by your configurations. Please report the issue by exporting your configurations using \"Export Profile\" command and share the file in the issue report. "}}
                - set: {vars.outcome: configuration}
              bad:
                - title: Reproducible with defaults; the issue is in VS Code itself
                  source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:192-194
                  call: native-issue-service.open-reporter
                  input: {data: {issueBody: "> Issue troubleshooting has identified that the issue is with Code - OSS. "}}
                - set: {vars.outcome: core}
      - title: Finally stop troubleshooting
        source: src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:141
        call: troubleshoot-issue-service.stop
      - return: {outcome: "= vars.outcome"}

