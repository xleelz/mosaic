      - if: "vars.ext == ''"
        then:
          - title: No extension given; pick among extensions with account preferences
            source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountPreferencesForExtensionAction.ts:62-75
            call: quick-input-service.pick
            as: extpick
            input: {items: [{label: Git, id: vscode.git}], can_pick_many: false}
          - if: "vars.extpick.value.canceled"
            then: [{return: {preferred: null}}]
          - set: {vars.ext: "= vars.extpick.value.picked.id"}
      - call: extension-service.get-extension
        as: found
        source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountPreferencesForExtensionAction.ts:79-82
        input: {extension_id: "= vars.ext"}
        on_error: continue
      - if: "!vars.found.ok || !vars.found.value.found"
