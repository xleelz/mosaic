  - component: nps-contribution
    name: constructor
    kind: function
    summary: "NPS survey (English only): needs npsSurveyUrl and telemetry.feedback.enabled; counts one session per day; from the 9th session a 15% candidate is prompted (Take Survey / Remind Me Later / Don't Show Again); non-candidates skip this version."
    sources:
      - src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:99
      - src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:29-94
    behavior:
      - if: "config['product-nps-survey-url'] == '' || !config['telemetry-feedback-enabled']"
        then:
          - title: No NPS survey URL (OSS) or feedback disabled
            source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:38-40
            return: {prompted: false, reason: disabled}
      - call: storage-service.get
        as: skip
        source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:42-45
        input: {key: nps/skipVersion, scope: application, fallback_value: ""}
      - if: "vars.skip.value.value != ''"
        then: [{return: {prompted: false, reason: skipped}}]
      - set:
          vars.date: "= string(now / 86400000)"
      - call: storage-service.get
        as: last
        source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:47-52
        input: {key: nps/lastSessionDate, scope: application, fallback_value: "0"}
      - if: "vars.last.value.value == vars.date"
        then: [{return: {prompted: false, reason: same-day}}]
      - call: storage-service.get
        as: count
        source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:54
        input: {key: nps/sessionCount, scope: application, fallback_value: "0"}
      - set:
          vars.sessions: "= int(vars.count.value.value) + 1"
      - call: storage-service.store
        source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:55
        input: {key: nps/lastSessionDate, value: "= vars.date", scope: application, target: user}
      - call: storage-service.store
        source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:56
        input: {key: nps/sessionCount, value: "= string(vars.sessions)", scope: application, target: user}
      - if: "vars.sessions < 9"
        then:
          - source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:58-60
            return: {prompted: false, reason: few-sessions, sessions: "= vars.sessions"}
      - call: storage-service.get
        as: cand
        source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:62-63
        input: {key: nps/isCandidate, scope: application, fallback_value: "false"}
      - choice: candidate
        default: "= vars.cand.value.value == 'true' || random(100) < 15 ? 'candidate' : 'not_candidate'"
        options:
          not_candidate:
            - call: storage-service.store
              input: {key: nps/isCandidate, value: "false", scope: application, target: user}
            - title: Not selected (85%); skip this version
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:67-70
              call: storage-service.store
              input: {key: nps/skipVersion, value: "= config['product-version']", scope: application, target: user}
            - return: {prompted: false, reason: not-candidate}
          candidate:
            - call: storage-service.store
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:65
              input: {key: nps/isCandidate, value: "true", scope: application, target: user}
      - call: notification-service.prompt
        as: p
        source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:72-93
        input: {severity: info, message: "Do you mind taking a quick feedback survey?", choices: [Take Survey, Remind Me Later, "Don't Show Again"]}
      - choice: answer
        default: "= vars.p.value.choice == null ? 'dismissed' : 'take_survey'"
        options:
          take_survey:
            - call: opener-service.open
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:78
              input: {target: "= config['product-nps-survey-url'] + '?o=linux&v=' + config['product-version']"}
            - call: storage-service.store
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:79
              input: {key: nps/isCandidate, value: "false", scope: application, target: user}
            - call: storage-service.store
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:80
              input: {key: nps/skipVersion, value: "= config['product-version']", scope: application, target: user}
          remind_later:
            - title: Remind Me Later sets the session count back by 3
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:84
              call: storage-service.store
              input: {key: nps/sessionCount, value: "= string(vars.sessions - 3)", scope: application, target: user}
          never:
            - call: storage-service.store
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:88
              input: {key: nps/isCandidate, value: "false", scope: application, target: user}
            - call: storage-service.store
              source: src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:89
              input: {key: nps/skipVersion, value: "= config['product-version']", scope: application, target: user}
          dismissed: []
      - return: {prompted: true, sessions: "= vars.sessions"}

  - component: language-surveys-contribution-class
    name: constructor
    kind: function
    summary: "handleSurveys: with product.surveys, waits for installed extensions to register and starts a LanguageSurvey for each survey with an id, edit count, language, URL and probability."
    sources:
      - src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:161
      - src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:129-156
    behavior:
      - if: "size(config['product-surveys']) == 0"
        then:
          - title: No surveys in product.json (OSS)
            source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:143-145
            return: {started: 0}
      - call: extension-service.when-installed-extensions-registered
        source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:150
      - set:
          vars.valid: "= config['product-surveys'].filter(s, has(s.surveyId) && has(s.editCount) && has(s.languageId) && has(s.surveyUrl) && has(s.userProbability))"
        source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:153-155
      - foreach: "= vars.valid"
        as: survey
        steps:
          - call: language-survey.start
            input: {survey: "= vars.survey"}
      - return: {started: "= size(vars.valid)"}

  - component: language-survey
    name: start
    kind: function
    summary: "One LanguageSurvey: skip if this version was skipped; count edits (on save) until editCount; count one session per day; from the 9th session with enough edits prompt a userProbability candidate."
    sources: ["src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:27-124"]
    request:
      type: object
      properties:
        survey: {type: object, default: {surveyId: ts, languageId: typescript, editCount: 10, userProbability: 0.5, surveyUrl: "https://example.com/ts-survey"}}
    behavior:
      - set:
          vars.id: "= input.survey.surveyId"
      - call: storage-service.get
        as: skip
        source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:46-49
        input: {key: "= vars.id + '.skipVersion'", scope: application, fallback_value: ""}
      - if: "vars.skip.value.value != ''"
        then: [{return: {prompted: false, reason: skipped}}]
      - set:
          vars.date: "= string(now / 86400000)"
      - call: storage-service.get
        as: last
        source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:69-72
        input: {key: "= vars.id + '.lastSessionDate'", scope: application, fallback_value: "0"}
      - if: "vars.last.value.value == vars.date"
        then: [{return: {prompted: false, reason: same-day}}]
      - call: storage-service.get
        as: count
        input: {key: "= vars.id + '.sessionCount'", scope: application, fallback_value: "0"}
      - set:
          vars.sessions: "= int(vars.count.value.value) + 1"
      - call: storage-service.store
        source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:74-76
        input: {key: "= vars.id + '.lastSessionDate'", value: "= vars.date", scope: application, target: user}
      - call: storage-service.store
        input: {key: "= vars.id + '.sessionCount'", value: "= string(vars.sessions)", scope: application, target: user}
      - if: "vars.sessions < 9"
        then:
          - source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:78-80
            return: {prompted: false, reason: few-sessions}
      - call: storage-service.get
        as: edits
        source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:82-84
        input: {key: "= vars.id + '.editedCount'", scope: application, fallback_value: "0"}
      - if: "int(vars.edits.value.value) < int(input.survey.editCount)"
        then: [{return: {prompted: false, reason: few-edits}}]
      - choice: candidate
        default: "= random(100) < int(double(input.survey.userProbability) * 100.0) ? 'candidate' : 'not_candidate'"
        options:
          not_candidate:
            - title: Not a candidate; skip this version
              source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:91-94
              call: storage-service.store
              input: {key: "= vars.id + '.skipVersion'", value: "= config['product-version']", scope: application, target: user}
            - return: {prompted: false, reason: not-candidate}
          candidate: []
      - call: notification-service.prompt
        as: p
        source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:96-123
        input: {severity: info, message: "= 'Help us improve our support for ' + input.survey.languageId", choices: [Take Short Survey, Remind Me Later, "Don't Show Again"]}
      - if: "vars.p.value.choice == 'Take Short Survey'"
        then:
          - call: telemetry-service.public-log2
            source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:102
            input: {event_name: "= vars.id + '.survey/takeShortSurvey'", data: {}}
          - call: opener-service.open
            source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:103
            input: {target: "= input.survey.surveyUrl + '?o=linux&v=' + config['product-version']"}
          - call: storage-service.store
            source: src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:105
            input: {key: "= vars.id + '.skipVersion'", value: "= config['product-version']", scope: application, target: user}
      - return: {prompted: true}

