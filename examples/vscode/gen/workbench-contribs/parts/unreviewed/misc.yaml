          - fail: {code: no-extension-with-id, status: 0, message: "= 'No extension with id ' + vars.ext"}
      - if: "vars.provider == ''"
        then:
          - title: Default to the first provider the extension has used
            source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountPreferencesForExtensionAction.ts:84-109
            call: authentication-query-service.get-providers-with-access
            input: {kind: extension, id: "= vars.ext"}
          - choice: providers_with_access
            default: one
            options:
