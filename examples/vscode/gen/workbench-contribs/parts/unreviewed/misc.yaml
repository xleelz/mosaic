  - component: external-terminal-contribution-native
    name: cmd-workbench-action-terminal-opennativeconsole
    kind: command
    attributes: {command: workbench.action.terminal.openNativeConsole}
    summary: "Open New External Terminal: at the picked folder (multi-root), else the last active workspace root if local, else the canonical local path of a remote root, else the active file's folder, else the home directory."
    sources:
      - src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:30
      - src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:35-101
