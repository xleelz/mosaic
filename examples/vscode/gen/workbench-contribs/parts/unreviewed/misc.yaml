  # ---- authentication ----
  - id: authentication-contribution-class
    name: AuthenticationContribution
    kind: module
    parent: authentication-contribution
    summary: "Registers the code-exchange proxy command, the Authentication extension feature and the seven account actions."
    sources: ["src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:79-99"]
  - id: authentication-usage-contribution
    name: AuthenticationUsageContribution
    kind: module
    parent: authentication-contribution
    summary: "Primes the extension usage cache of IAuthenticationUsageService at Eventually."
    sources: ["src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:101-113"]

  # ---- issue reporter ----
  - id: web-issue-contribution
    name: WebIssueContribution
    kind: module
    parent: issue-contribution
    summary: "Web BaseIssueContribution: registers the issue reporter commands and issueReporter.experimental.webReporter."
    sources: ["src/vs/workbench/contrib/issue/browser/issue.contribution.ts:25-38"]
  - id: native-issue-contribution
    name: NativeIssueContribution
    kind: module
    parent: issue-contribution-native
    summary: "Desktop BaseIssueContribution: issue reporter commands, Report Performance Issue and the 'issue' quick access provider."
    sources: ["src/vs/workbench/contrib/issue/electron-browser/issue.contribution.ts:102-146"]
  - id: issue-troubleshoot-ui
    name: IssueTroubleshootUi
    kind: module
    parent: issue-troubleshoot
    summary: "Mirrors isIssueTroubleshootActive and resumes an active troubleshoot session after a reload."
    sources: ["src/vs/workbench/contrib/issue/browser/issueTroubleshoot.ts:321-344"]
  - id: issue-reporter-windows
    name: NativeIssueFormService reporter windows
    kind: module
    parent: native-issue-form-service
    summary: "The live wizard reporters (auxiliary windows or editor tabs) of NativeIssueFormService."
    sources: ["src/vs/workbench/contrib/issue/electron-browser/nativeIssueFormService.ts:63"]
    state:
      schema: {type: object, properties: {open: {type: boolean}, location: {type: string}, data: {type: object}, captures: {type: integer}, recording: {type: boolean}}}
      initial: {open: false, location: "", data: {}, captures: 0, recording: false}
  - id: issue-reporter-open-state-contribution
    name: IssueReporterOpenStateContribution
    kind: module
    parent: issue-reporter-keybindings-native
    summary: "Keeps the issueReporterOpen context key and routes the capture shortcuts while a reporter is open."
    sources: ["src/vs/workbench/contrib/issue/electron-browser/issueReporterKeybindings.ts:27-72"]

  # ---- relauncher ----
  - id: settings-change-relauncher
    name: SettingsChangeRelauncher
    kind: module
    parent: relauncher-contribution
    summary: "Watches settings that only apply after a restart and offers to restart when one changes."
    sources: ["src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:56-245"]
    state:
      schema: {type: object, properties: {last: {type: object}}}
      initial: {last: {editor.accessibilitySupport: auto, security.workspace.trust.enabled: true, telemetry.feedback.enabled: true, chat.agentHost.claudeAgent.enabled: true}}
  - id: workspace-change-ext-host-relauncher
    name: WorkspaceChangeExtHostRelauncher
    kind: module
    parent: relauncher-contribution
    summary: "Restarts the extension host when the first folder of a multi-root workspace changes."
    sources: ["src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:275-354"]
    state:
      schema: {type: object, properties: {first_folder: {type: ["string", "null"]}, listening: {type: boolean}}}
      initial: {first_folder: null, listening: false}

  # ---- url ----
  - id: trusted-domains-file-system-provider
    name: TrustedDomainsFileSystemProvider
    kind: module
    parent: url-contribution
    summary: "The trustedDomains: file system whose single file edits the link protection trusted domains."
    sources: ["src/vs/workbench/contrib/url/browser/trustedDomainsFileSystemProvider.ts:77-157"]
  - id: external-uri-resolver-contribution
    name: ExternalUriResolverContribution
    kind: module
    parent: url-contribution
    summary: "Registers the embedder's resolveExternalUri (web) with the opener service."
    sources: ["src/vs/workbench/contrib/url/browser/externalUriResolver.ts:11-34"]

  # ---- workspace trust ----
  - id: workspace-trust-context-keys
    name: WorkspaceTrustContextKeys
    kind: module
    parent: workspace-contribution
    summary: "Binds isWorkspaceTrustEnabled and isWorkspaceTrusted and keeps the latter in sync with trust changes."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:72-92"]
  - id: workspace-trust-telemetry-contribution
    name: WorkspaceTrustTelemetryContribution
    kind: module
    parent: workspace-contribution
    summary: "Logs trust telemetry once trust is initialized and on every trust change."
    sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:855-972"]

  # ---- workspaces ----
  - id: workspaces-finder-contribution
    name: WorkspacesFinderContribution
    kind: module
    parent: workspaces-contribution
    summary: "Suggests opening a .code-workspace file found at the root of a single opened folder."
    sources: ["src/vs/workbench/contrib/workspaces/browser/workspaces.contribution.ts:32-105"]
  - id: recent-remote-folder-pruner-contribution
    name: RecentRemoteFolderPrunerContribution
    kind: module
    parent: workspaces-recent-remote-folder-pruner
    summary: "Removes a vscode-remote folder from the recently opened list when the remote reports it missing."
    sources: ["src/vs/workbench/contrib/workspaces/browser/recentRemoteFolderPruner.ts:45-60"]

  # ---- metered connection ----
  - id: metered-connection-status-contribution
    name: MeteredConnectionStatusContribution
    kind: module
    parent: metered-connection-contribution
    summary: "Shows a status bar entry while the connection is metered."
    sources: ["src/vs/workbench/contrib/meteredConnection/browser/meteredConnectionStatus.ts:14-60"]
    state:
      schema: {type: object, properties: {entry_shown: {type: boolean}}}
      initial: {entry_shown: false}

  # ---- process explorer ----
  - id: process-explorer-editor-contribution
    name: ProcessExplorerEditorContribution
    kind: module
    parent: process-explorer-contribution
    summary: "Registers the exclusive Process Explorer editor for the process-explorer: scheme."
    sources: ["src/vs/workbench/contrib/processExplorer/browser/processExplorer.contribution.ts:26-58"]

  # ---- external terminal ----
  - id: external-terminal-contribution-class-native
    name: ExternalTerminalContribution (electron-browser)
    kind: module
    parent: external-terminal-contribution-native
    summary: "Registers the terminal.explorerKind and terminal.external.*Exec settings with the platform's default terminals."
    sources: ["src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:111-170"]
  - id: external-terminal-contribution-class
    name: ExternalTerminalContribution (browser)
    kind: module
    parent: external-terminal-contribution
    summary: "Adds the Open in Integrated/External Terminal explorer menu items."
    sources: ["src/vs/workbench/contrib/externalTerminal/browser/externalTerminal.contribution.ts:96-164"]

  # ---- surveys ----
  - id: nps-contribution
    name: NPSContribution
    kind: module
    parent: surveys-nps-contribution
    summary: "Net Promoter Score prompt: counts sessions per day and asks 15% of users after 9 sessions."
    sources: ["src/vs/workbench/contrib/surveys/browser/nps.contribution.ts:27-95"]
  - id: language-surveys-contribution-class
    name: LanguageSurveysContribution
    kind: module
    parent: language-surveys-contribution
    summary: "Starts a LanguageSurvey for every valid survey in product.json."
    sources: ["src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:127-157"]
  - id: language-survey
    name: LanguageSurvey
    kind: module
    parent: language-surveys-contribution
    summary: "One language survey: session counting, edit counting and the prompt."
    sources: ["src/vs/workbench/contrib/surveys/browser/languageSurveys.contribution.ts:25-125"]

  # ---- telemetry ----
  - id: telemetry-contribution-class
    name: TelemetryContribution
    kind: module
    parent: telemetry-contribution
    summary: "workspaceLoad telemetry, file get/put telemetry, and the Show Telemetry action."
    sources: ["src/vs/workbench/contrib/telemetry/browser/telemetry.contribution.ts:61-155"]
  - id: configuration-telemetry-contribution
    name: ConfigurationTelemetryContribution
    kind: module
    parent: telemetry-contribution
    summary: "Reports the values of a fixed set of settings configured in application, user or workspace settings."
    sources: ["src/vs/workbench/contrib/telemetry/browser/telemetry.contribution.ts:288-497"]

  # ---- share ----
  - id: share-workbench-contribution
    name: ShareWorkbenchContribution
    kind: module
    parent: share-contribution
    summary: "Registers the Share action while workbench.experimental.share.enabled is on."
    sources: ["src/vs/workbench/contrib/share/browser/share.contribution.ts:47-155"]
    state:
      schema: {type: object, properties: {actions_registered: {type: boolean}}}
      initial: {actions_registered: false}

  # ---- onboarding ----
  - id: onboarding-contribution-class
    name: OnboardingContribution
    kind: module
    parent: onboarding-contribution
    summary: "Boots the onboarding engine: registers the presentations and starts the scenario service."
    sources: ["src/vs/workbench/contrib/onboarding/browser/onboarding.contribution.ts:108-129"]
  - id: onboarding-scenario-state
    name: OnboardingScenarioService state
    kind: module
    parent: onboarding-scenario-service
    summary: "The started/stopped flags of OnboardingScenarioService (the shown state lives in the memento/onboarding storage key)."
    sources: ["src/vs/workbench/contrib/onboarding/browser/onboardingService.ts:98-100"]
    state:
      schema: {type: object, properties: {started: {type: boolean}, stopped: {type: boolean}}}
      initial: {started: false, stopped: false}
  - id: onboarding-tryout-contribution-class
    name: OnboardingTryoutContribution
    kind: module
    parent: onboarding-tryout-contribution
    summary: "Registers the command, openView, guided and editorSample tryout presentations and the sample content provider."
    sources: ["src/vs/workbench/contrib/onboarding/browser/onboardingTryout.contribution.ts:35-77"]
  - id: onboarding-tryout-registry
    name: OnboardingTryoutService tryouts
    kind: module
    parent: onboarding-tryout-service
    summary: "The registered feature examples (tryouts) and their availability, as OnboardingTryoutService sees them."
    sources: ["src/vs/workbench/contrib/onboarding/browser/onboardingTryoutService.ts:120-194"]
    state:
      schema: {type: object, properties: {tryouts: {type: object}}}
      initial: {tryouts: {}}
  - id: onboarding-tryout-url-handler-class
    name: OnboardingTryoutUrlHandler
    kind: module
    parent: onboarding-tryout-url-handler
    summary: "Handles external links that launch a feature example, after a confirmation."
    sources: ["src/vs/workbench/contrib/onboarding/browser/onboardingTryoutUrlHandler.ts:22-86"]
  - id: native-onboarding-tryout-contribution
    name: NativeOnboardingTryoutContribution
    kind: module
    parent: onboarding-tryout-contribution-native
    summary: "Registers the agentsWindow tryout presentation, routed to the Agents window."
    sources: ["src/vs/workbench/contrib/onboarding/electron-browser/onboardingTryout.contribution.ts:47-78"]
  - id: onboarding-variation-a-overlay
    name: OnboardingVariationA overlay
    kind: module
    parent: onboarding-variation-a
    summary: "Whether the 2026 welcome onboarding overlay is showing."
    sources: ["src/vs/workbench/contrib/welcomeOnboarding/browser/onboardingVariationA.ts:125"]
    state:
      schema: {type: object, properties: {showing: {type: boolean}}}
      initial: {showing: false}

  # ---- splash ----
  - id: parts-splash
    name: PartsSplash (desktop)
    kind: module
    parent: splash-contribution-native
    summary: "Removes the startup splash after the first layout and saves the window splash (theme colors, layout) through the native host."
    sources: ["src/vs/workbench/contrib/splash/browser/partsSplash.ts:37-66"]
  - id: parts-splash-web
    name: PartsSplash (web)
    kind: module
    parent: splash-contribution
    summary: "The same PartsSplash on the web, where SplashStorageService saves to localStorage."
    sources: ["src/vs/workbench/contrib/splash/browser/splash.contribution.ts:12-27"]

  # ---- REPL ----
  - id: repl-window-working-copy-editor-handler
    name: ReplWindowWorkingCopyEditorHandler
    kind: module
    parent: repl-notebook-repl-contribution
    summary: "Restores REPL editors for repl notebook working copies (backups)."
    sources: ["src/vs/workbench/contrib/replNotebook/browser/repl.contribution.ts:177-222"]
  - id: repl-document-contribution
    name: ReplDocumentContribution
    kind: module
    parent: repl-notebook-repl-contribution
    summary: "Registers the 'repl' editor for untitled jupyter-notebook REPL documents."
    sources: ["src/vs/workbench/contrib/replNotebook/browser/repl.contribution.ts:104-175"]

  # ---- welcome pages ----
  - id: agent-sessions-welcome-editor-resolver-contribution
    name: AgentSessionsWelcomeEditorResolverContribution
    kind: module
    parent: welcome-agent-sessions-agent-sessions-welcome-contribution
    summary: "Registers the Agent Sessions Welcome editor for walkThrough://vscode_agent_sessions_welcome."
    sources: ["src/vs/workbench/contrib/welcomeAgentSessions/browser/agentSessionsWelcome.contribution.ts:63-95"]
  - id: agent-sessions-welcome-runner-contribution
    name: AgentSessionsWelcomeRunnerContribution
    kind: module
    parent: welcome-agent-sessions-agent-sessions-welcome-contribution
    summary: "Opens the Agent Sessions Welcome page on startup when workbench.startupEditor is agentSessionsWelcomePage."
    sources: ["src/vs/workbench/contrib/welcomeAgentSessions/browser/agentSessionsWelcome.contribution.ts:117-168"]
  - id: welcome-banner-contribution-class
    name: WelcomeBannerContribution
    kind: module
    parent: welcome-banner-contribution
    summary: "Shows the embedder's welcome banner (web) unless it was dismissed."
    sources: ["src/vs/workbench/contrib/welcomeBanner/browser/welcomeBanner.contribution.ts:15-50"]

  # ---- misc startup contributions ----
  - id: emergency-alert
    name: EmergencyAlert
    kind: module
    parent: emergency-alert-contribution-native
    summary: "Polls product.emergencyAlertUrl hourly and shows a banner for an alert matching this commit, platform and arch."
    sources: ["src/vs/workbench/contrib/emergencyAlert/electron-browser/emergencyAlert.contribution.ts:37-122"]
    state:
      schema: {type: object, properties: {current_message: {type: ["string", "null"]}}}
      initial: {current_message: null}
  - id: encryption-contribution
    name: EncryptionContribution
    kind: module
    parent: encryption-contribution-native
    summary: "One-time Linux migration of argv.json password-store gnome/gnome-keyring to gnome-libsecret."
    sources: ["src/vs/workbench/contrib/encryption/electron-browser/encryption.contribution.ts:16-46"]
  - id: policy-export-contribution
    name: PolicyExportContribution
    kind: module
    parent: policy-export-contribution-native
    summary: "Development-only: exports policy data and quits when started with --export-policy-data."
    sources: ["src/vs/workbench/contrib/policyExport/electron-browser/policyExport.contribution.ts:43-68"]
  - id: workspace-tags
    name: WorkspaceTags
    kind: module
    parent: tags-contribution-native
    summary: "Reports workspace tags, cloud and proxy stats when usage telemetry is on."
    sources: ["src/vs/workbench/contrib/tags/electron-browser/workspaceTags.ts:26-58"]
  - id: edit-telemetry-contribution-class
    name: EditTelemetryContribution
    kind: module
    parent: edit-telemetry-contribution
    summary: "Creates the edit tracking feature (telemetry) and the AI stats feature when their settings allow."
    sources: ["src/vs/workbench/contrib/editTelemetry/browser/editTelemetryContribution.ts:21-51"]
  - id: workbench-opener-contribution
    name: WorkbenchOpenerContribution
    kind: module
    parent: opener-contribution
    summary: "An opener that reveals folder links inside the workspace in the Explorer (and, in the sessions window, opens local folders in the OS)."
    sources: ["src/vs/workbench/contrib/opener/browser/opener.contribution.ts:19-73"]

seed: {}
stubs:
