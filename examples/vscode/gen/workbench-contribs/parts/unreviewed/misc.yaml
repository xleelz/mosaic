        input: {key: terminal.external}
      - call: workspace-context.get-workspace
        as: ws
        source: src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:47
      - set:
          vars.root: "= size(vars.ws.value.folders) > 0 ? vars.ws.value.folders[0] : ''"
      - if: "size(vars.ws.value.folders) > 1"
        then:
          - title: Several folders; let the user pick one
            source: src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:49-60
            call: quick-input-service.pick
            as: pick
            input: {items: "= vars.ws.value.folders.map(f, {'label': f})", can_pick_many: false}
          - if: "vars.pick.value.canceled"
            then: [{return: {opened: false}}]
          - set: {vars.root: "= vars.pick.value.picked.label"}
      - if: "vars.root.startsWith('file://')"
        then:
          - title: Local root; open there
            source: src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:66-69
            call: external-terminal-service.open-terminal
            input: {cwd: "= vars.root.substring(7)"}
          - return: {opened: true, cwd: "= vars.root.substring(7)"}
      - if: "vars.root.startsWith('vscode-remote:')"
        then:
          - call: remote-authority-resolver-service.get-canonical-uri
            source: src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:73-79
            input: {uri: "= vars.root"}
          - choice: canonical_scheme
            default: remote
            options:
