interfaces:
  # ======================= authentication =======================
  - component: authentication-contribution
    name: cmd-workbench-getcodeexchangeproxyendpoints
    kind: command
    attributes: {command: workbench.getCodeExchangeProxyEndpoints}
    summary: "Returns environmentService.options?.codeExchangeProxyEndpoints: the embedder's endpoints on the web, undefined in the desktop workbench (no construction options)."
    sources: ["src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:25", "src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:25-28"]
    behavior:
      - choice: host
        default: desktop
        options:
          desktop:
            - title: The desktop workbench has no construction options, so the command returns undefined
              source: src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:27
              return: {endpoints: null}
          web:
            - call: browser-workbench-environment-service.get-options
              as: env
              source: src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:26
            - return: {endpoints: "= vars.env.value"}

  - component: authentication-contribution
    name: cmd-workbench-action-manageaccounts
    kind: command
    attributes: {command: workbench.action.manageAccounts}
    summary: "Manage Accounts: pick an account, then pick Manage Trusted Extensions, Manage Trusted MCP Servers (providers with authorization servers) or Sign Out (unless the session can't sign out)."
    sources:
      - src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:91
      - src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:28-31
      - src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:53-144
    request:
      type: object
      properties:
        provider_id: {type: string, default: github, description: "the provider of the account the user picks"}
        account_label: {type: string, default: dev, description: "the label of the account the user picks"}
        can_use_mcp: {type: boolean, default: false, description: "the provider declares authorization servers"}
    behavior:
      - title: List the accounts of every registered provider
        source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:70-86
        call: authentication-service.get-accounts
        input: {provider_id: "= input.provider_id"}
      - choice: accounts
        default: some
        options:
          none:
            - title: No accounts, so only a 'There are no active accounts.' pick is shown
              source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:57-60
              call: quick-input-service.pick
              input: {items: [{label: "There are no active accounts."}], can_pick_many: false}
            - return: {action: none}
          some: []
      - call: quick-input-service.pick
        as: account
        source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:62-65
        input: {items: [{label: "= input.account_label", provider_id: "= input.provider_id", can_use_mcp: "= input.can_use_mcp"}], can_pick_many: false}
      - if: "vars.account.value.canceled"
        then:
          - title: No account picked
            source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:63-65
            return: {action: none}
      - title: Actions for the account; Sign Out only when canSignOut (a session that can't sign out hides it)
        source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:106-125
        set:
          vars.arg: "= {'providerId': input.provider_id, 'accountLabel': input.account_label}"
      - choice: action
        default: trusted_extensions
        options:
          trusted_extensions:
            - call: command-service.execute-command
              source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:108
              input: {command_id: _manageTrustedExtensionsForAccount, args: ["= vars.arg"]}
            - return: {action: trusted_extensions}
          trusted_mcp_servers:
            - if: "!input.can_use_mcp"
              then:
                - title: The MCP item is only offered for providers with authorization servers
                  source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:111-116
                  return: {action: none}
            - call: command-service.execute-command
              source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:114
              input: {command_id: _manageTrustedMCPServersForAccount, args: ["= vars.arg"]}
            - return: {action: trusted_mcp_servers}
          sign_out:
            - call: command-service.execute-command
              source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:121
              input: {command_id: _signOutOfAccount, args: ["= vars.arg"]}
            - return: {action: sign_out}
          back:
            - title: The back button reopens the account picker
              source: src/vs/workbench/contrib/authentication/browser/actions/manageAccountsAction.ts:135-139
              return: {action: back}

  - component: authentication-contribution
    name: cmd-signoutofaccount
    kind: command
    attributes: {command: _signOutOfAccount}
    summary: "Sign out of an account: confirm (listing the extensions that used it), then remove its sessions, its usage and its allowed extensions."
    sources:
      - src/vs/workbench/contrib/authentication/browser/authentication.contribution.ts:92
      - src/vs/workbench/contrib/authentication/browser/actions/signOutOfAccountAction.ts:24-53
    request:
      type: object
      properties:
        args: {type: array, default: [{providerId: github, accountLabel: dev}]}
    errors: [{code: invalid-arguments, status: 0, retryable: false}]
    behavior:
      - set:
          vars.a: "= size(input.args) > 0 ? input.args[0] : {}"
      - if: "!('providerId' in vars.a) || !('accountLabel' in vars.a) || vars.a.providerId == '' || vars.a.accountLabel == ''"
        then:
          - title: Missing providerId or accountLabel
            source: src/vs/workbench/contrib/authentication/browser/actions/signOutOfAccountAction.ts:30-32
            fail: {code: invalid-arguments, status: 0, message: "Invalid arguments. Expected: { providerId: string; accountLabel: string }"}
      - call: authentication-service.get-sessions
        source: src/vs/workbench/contrib/authentication/browser/actions/signOutOfAccountAction.ts:34-35
        input: {provider_id: "= vars.a.providerId"}
      - call: authentication-usage-service.read-account-usages
        source: src/vs/workbench/contrib/authentication/browser/actions/signOutOfAccountAction.ts:37
        input: {provider_id: "= vars.a.providerId", account_label: "= vars.a.accountLabel"}
      - call: dialog-service.confirm
        as: confirm
        source: src/vs/workbench/contrib/authentication/browser/actions/signOutOfAccountAction.ts:39-45
        input: {message: "= 'Sign out of \\'' + vars.a.accountLabel + '\\'?'", primary_button: "&&Sign Out"}
      - if: "!vars.confirm.value.confirmed"
        then:
          - return: {signed_out: false}
      - title: Remove every session of the account, then its usage and allowed extensions
        source: src/vs/workbench/contrib/authentication/browser/actions/signOutOfAccountAction.ts:47-52
        call: authentication-service.remove-session
        input: {provider_id: "= vars.a.providerId", session_id: "= vars.a.accountLabel"}
      - call: authentication-usage-service.remove-account-usage
        source: src/vs/workbench/contrib/authentication/browser/actions/signOutOfAccountAction.ts:50
        input: {provider_id: "= vars.a.providerId", account_label: "= vars.a.accountLabel"}
      - call: authentication-access-service.remove-allowed-extensions
