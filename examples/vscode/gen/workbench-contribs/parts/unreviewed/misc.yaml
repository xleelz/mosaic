        notebook: {type: string, default: "untitled:Untitled-1.replNotebook", description: "the REPL notebook document of the editor"}
        input_value: {type: string, default: "print(1 + 1)", description: "the REPL input box text"}
        cell_count: {type: integer, default: 1, description: "cells in the REPL notebook (the input cell is last)"}
    behavior:
