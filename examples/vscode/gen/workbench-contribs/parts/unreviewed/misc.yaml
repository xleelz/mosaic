                - call: external-terminal-service.open-terminal
                  source: src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:75-77
                  input: {cwd: "= '/' + vars.root.split('/').slice(3, size(vars.root.split('/'))).join('/')"}
                - return: {opened: true}
              remote: []
      - title: No local folder; fall back to the active file's folder, or no cwd (home)
        source: src/vs/workbench/contrib/externalTerminal/electron-browser/externalTerminal.contribution.ts:84-100
        call: external-terminal-service.open-terminal
        input: {cwd: null}
      - return: {opened: true, cwd: null}

