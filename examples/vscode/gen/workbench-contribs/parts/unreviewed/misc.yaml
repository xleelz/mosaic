  - component: authentication-contribution
    name: cmd-manageaccountpreferencesforextension
    kind: command
    attributes: {command: _manageAccountPreferencesForExtension}
    summary: "Manage an extension's account preference: choose the extension and provider if not given, then set the picked account (or a new one) as preferred."
    sources:
