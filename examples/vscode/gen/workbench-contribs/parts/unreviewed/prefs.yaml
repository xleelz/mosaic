- component: preferences-actions-contribution
  name: sanitize-open-settings-args
  kind: function
  summary: 'sanitizeOpenSettingsArgs: keeps only boolean focusSearch/openToSide, a string query and revealSetting with a string key; anything else is dropped.'
  sources:
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:179-201
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:171-177
  request:
    type: object
    properties:
      arg: {}
  behavior:
  - set:
      vars.a: '= has(input.arg) && type(input.arg) == map ? input.arg : {}'
  - title: Non-object arguments become {}; each field is type-checked
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:179-201
    set:
      vars.rs: '= ''revealSetting'' in vars.a && type(vars.a.revealSetting) == map && ''key'' in vars.a.revealSetting && type(vars.a.revealSetting.key) == string ? dyn({''key'': vars.a.revealSetting.key,
        ''edit'': (''edit'' in vars.a.revealSetting && type(vars.a.revealSetting.edit) == bool) ? vars.a.revealSetting.edit : null}) : dyn(null)'
  - set:
      vars.o:
        focus_search: '= ''focusSearch'' in vars.a && type(vars.a.focusSearch) == bool ? vars.a.focusSearch : null'
        open_to_side: '= ''openToSide'' in vars.a && type(vars.a.openToSide) == bool ? vars.a.openToSide : null'
        query: '= ''query'' in vars.a && type(vars.a.query) == string ? vars.a.query : null'
        reveal_setting: = vars.rs
  - title: Undefined fields are left out
    return: = vars.o.transformMap(k, v, v != null, v)
- component: preferences-actions-contribution
  name: constructor
  kind: function
  summary: 'PreferencesActionsContribution (BlockStartup): registers the settings and keybindings actions, then, in a multi-root workspace, registers _workbench.openWorkspaceSettingsEditor and one _workbench.openFolderSettings.<folder>
    command per folder for the settings.json title bar.'
  sources:
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1519
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:207-224
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1314-1340
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1342-1379
  request:
    type: object
  behavior:
  - title: Register the settings and keyboard shortcuts actions (registerAction2)
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:218-219
  - call: workspace-context.get-workspace
    as: ws
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1316
    title: updatePreferencesEditorMenuItem reads the workbench state
  - if: vars.ws.value.workbench_state == 'workspace'
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1316-1318
    title: 'Multi-root workspace: register _workbench.openWorkspaceSettingsEditor for the workspace settings title bar'
    then:
    - call: commands-registry.register-command
      input:
        command_id: _workbench.openWorkspaceSettingsEditor
        handler: preferences-service.open-workspace-settings
  - title: 'updatePreferencesEditorMenuItemForWorkspaceFolders: one _workbench.openFolderSettings.<uri> per folder'
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1342-1347
    foreach: = vars.ws.value.folders
    as: folder
    steps:
    - call: commands-registry.register-command
      input:
        command_id: = '_workbench.openFolderSettings.' + vars.folder
        handler: preferences-service.open-workspace-settings
  - return:
      folder_commands: = vars.ws.value.folders.map(f, '_workbench.openFolderSettings.' + f)
      workspace_command: = vars.ws.value.workbench_state == 'workspace'
