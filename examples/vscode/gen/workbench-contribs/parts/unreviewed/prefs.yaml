  - set:
      vars.a: '= has(input.args) && size(input.args) > 0 ? input.args[0] : null'
  - set:
      vars.valid: = vars.a != null && type(vars.a) == map && 'commands' in vars.a && type(vars.a.commands) == list && vars.a.commands.all(c, type(c) == string || (type(c) == map && 'command' in c && type(c.command)
        == string))
    source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:116-133
    title: _isCommandArgs
  - if: '!vars.valid'
    source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:84-87
    then:
    - call: notification-service.notify
      input:
        severity: error
        message: '''runCommands'' has received an argument with incorrect type. Please, review the argument passed to the command.'
    - return:
        ran: 0
  - if: size(vars.a.commands) == 0
    source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:89-92
    then:
    - call: notification-service.notify
      input:
        severity: warning
        message: '''runCommands'' has not received commands to run. Did you forget to pass commands in the ''runCommands'' argument?'
    - return:
        ran: 0
  - set:
      vars.ran: 0
  - foreach: = vars.a.commands
    as: c
    source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:98-108
    title: Run the commands one after another
    steps:
    - set:
        vars.id: '= type(vars.c) == string ? vars.c : vars.c.command'
        vars.cargs: '= type(vars.c) == map && ''args'' in vars.c ? (type(vars.c.args) == list ? vars.c.args : [vars.c.args]) : []'
      source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:135-154
    - call: command-service.execute-command
      input:
        command_id: = vars.id
        args: = vars.cargs
      as: r
      on_error:
      - title: A failing command stops the sequence; the error is shown
        source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:109-112
        call: notification-service.notify
        input:
          severity: error
          message: = error.message
      - return:
          ran: = vars.ran
          failed: = vars.id
    - set:
        vars.ran: = vars.ran + 1
  - return:
      ran: = vars.ran
