# workbench-contribs part: group prefs (preferences, keybindings, keybindingsExport, quickaccess, commands, themes, localization, logs).
# Generated by a build script; edit the script, not this file.
configs:
- id: workbench-settings-use-split-json
  type: boolean
  value: false
  default: false
  summary: 'workbench.settings.useSplitJSON: PreferencesContribution installs the split settings.json editor when true. Deployed = default (false).'
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:570-574
  - src/vs/workbench/contrib/preferences/common/preferencesContribution.ts:57
  attributes:
    key: workbench.settings.useSplitJSON
- id: workbench-settings-open-default-settings
  type: boolean
  value: false
  default: false
  summary: 'workbench.settings.openDefaultSettings: also show the default settings beside settings.json. Deployed = default (false).'
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:565-569
  - src/vs/workbench/contrib/preferences/common/preferencesContribution.ts:57
  attributes:
    key: workbench.settings.openDefaultSettings
- id: workbench-command-palette-history
  type: integer
  value: 50
  default: 50
  summary: 'workbench.commandPalette.history: number of recently used commands kept; 0 disables the history (and Clear Command History does nothing).'
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:515-520
  - src/vs/workbench/contrib/quickaccess/browser/commandsQuickAccess.ts:311
  attributes:
    key: workbench.commandPalette.history
- id: keyboard-layout
  type: string
  value: autodetect
  default: autodetect
  summary: 'keyboard.layout: keyboard layout used in web; autodetect by default.'
  sources:
  - src/vs/workbench/services/keybinding/browser/keyboardLayoutService.ts:649-653
  - src/vs/workbench/contrib/preferences/browser/keyboardLayoutPicker.ts:122
  attributes:
    key: keyboard.layout
- id: window-auto-detect-color-scheme
  type: boolean
  value: false
  default: false
  summary: 'window.autoDetectColorScheme: follow the OS light/dark mode. Desktop default false (the agents web window defaults it to true). When true, Toggle Light/Dark refuses.'
  sources:
  - src/vs/workbench/services/themes/common/themeConfiguration.ts:85-89
  - src/vs/workbench/contrib/themes/browser/themes.contribution.ts:805
  attributes:
    key: window.autoDetectColorScheme
- id: workbench-color-theme
  type: string
  value: Dark 2026
  default: Dark 2026
  summary: 'workbench.colorTheme: the color theme; desktop default ThemeSettingDefaults.COLOR_THEME_DARK (Dark 2026), web Light 2026. The current theme type drives Toggle Light/Dark.'
  sources:
  - src/vs/workbench/services/themes/common/themeConfiguration.ts:35-39
  - src/vs/workbench/contrib/themes/browser/themes.contribution.ts:799-803
  attributes:
    key: workbench.colorTheme
- id: workbench-preferred-dark-color-theme
  type: string
  value: Dark 2026
  default: Dark 2026
  summary: 'workbench.preferredDarkColorTheme: theme used for dark mode and by Toggle Light/Dark from a light theme.'
  sources:
  - src/vs/workbench/services/themes/common/themeConfiguration.ts:45-49
  - src/vs/workbench/contrib/themes/browser/themes.contribution.ts:835
  attributes:
    key: workbench.preferredDarkColorTheme
- id: workbench-preferred-light-color-theme
  type: string
  value: Light 2026
  default: Light 2026
  summary: 'workbench.preferredLightColorTheme: theme used for light mode and by Toggle Light/Dark from a dark theme.'
  sources:
  - src/vs/workbench/services/themes/common/themeConfiguration.ts:55-59
  - src/vs/workbench/contrib/themes/browser/themes.contribution.ts:835
  attributes:
    key: workbench.preferredLightColorTheme
- id: workbench-preferred-high-contrast-color-theme
  type: string
  value: Default High Contrast
  default: Default High Contrast
  summary: 'workbench.preferredHighContrastColorTheme: high contrast dark theme; Toggle Light/Dark from a high contrast light theme picks it.'
  sources:
  - src/vs/workbench/services/themes/common/themeConfiguration.ts:65-69
  - src/vs/workbench/contrib/themes/browser/themes.contribution.ts:835
  attributes:
    key: workbench.preferredHighContrastColorTheme
- id: workbench-preferred-high-contrast-light-color-theme
  type: string
  value: Default High Contrast Light
