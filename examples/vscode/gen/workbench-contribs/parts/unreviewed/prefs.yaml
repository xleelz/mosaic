- id: preferences-actions-contribution
  name: PreferencesActionsContribution
  kind: module
  parent: preferences-contribution
  summary: Registers the settings and keyboard shortcuts actions at BlockStartup and adds the per-workspace and per-folder "Open Settings (UI)" editor title commands.
  sources:
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:203
- id: preferences-contribution-startup
  name: PreferencesContribution
  kind: module
  parent: preferences-contribution
  summary: 'Installs the split settings.json editor (when workbench.settings.useSplitJSON or openDefaultSettings is on) and the vscode: settings file system provider.'
  sources:
  - src/vs/workbench/contrib/preferences/common/preferencesContribution.ts:25
  state:
    schema:
      type: object
      properties:
        split_editor_registered:
          type: boolean
    initial:
      split_editor_registered: false
- id: settings-editor-title-contribution
  name: SettingsEditorTitleContribution
  kind: module
  parent: preferences-contribution
  summary: 'AfterRestored: registers the settings.json title action "Open Settings (UI)" and settings.switchToJSON.'
  sources:
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1382
- id: settings-editor-contribution
  name: SettingsEditorContribution
  kind: module
  parent: preferences-contribution
  summary: 'Editor contribution: on a .json or .code-workspace model that is a settings file, renders the user or workspace settings decorations.'
  sources:
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1469
- id: settings-editor2
  name: SettingsEditor2
  kind: module
  parent: preferences-contribution
  summary: 'The Settings editor pane: its search query and the selected settings target (User, Remote, Workspace or a folder).'
  sources:
  - src/vs/workbench/contrib/preferences/browser/settingsEditor2.ts:120
  state:
    schema:
      type: object
      properties:
        active:
          type: boolean
        search:
          type: string
        settings_target:
          type: string
    initial:
      active: false
      search: ''
      settings_target: user-local
- id: keybindings-editor
  name: KeybindingsEditor
  kind: module
  parent: preferences-contribution
  summary: 'The Keyboard Shortcuts editor pane: whether it is the active pane, the focused keybinding entry, the when-expression widget and the PROFILE-scoped search history memento.'
  sources:
  - src/vs/workbench/contrib/preferences/browser/keybindingsEditor.ts:74
  state:
    schema:
      type: object
      properties:
        active:
          type: boolean
        entry:
          type:
          - object
          - 'null'
        when_widget_for:
          type:
          - string
          - 'null'
        search_history:
          type: array
    initial:
      active: false
      entry: null
      when_widget_for: null
      search_history: []
- id: define-keybinding-editor-contribution
  name: DefineKeybindingEditorContribution
  kind: module
  parent: preferences-keybindings-editor-contribution
  summary: 'Editor contribution of every code editor: on the profile keybindings.json it shows keybinding decorations and the define-keybinding widget that inserts a snippet entry.'
  sources:
  - src/vs/workbench/contrib/preferences/browser/keybindingsEditorContribution.ts:273
  - src/vs/workbench/contrib/preferences/browser/keybindingsEditorContribution.ts:33
  state:
