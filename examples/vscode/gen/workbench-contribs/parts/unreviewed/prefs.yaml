- id: installed-themes-picker
  name: InstalledThemesPicker
  kind: module
  parent: themes-contribution
  summary: 'The quick pick shared by the color, file icon and product icon theme commands: previews the active item after 200 ms, applies the accepted theme (settings target auto), restores the current
    theme when dismissed, and offers the marketplace.'
  sources:
  - src/vs/workbench/contrib/themes/browser/themes.contribution.ts:296
- id: web-localization-workbench-contribution
  name: WebLocalizationWorkbenchContribution
  kind: module
  parent: localization-contribution
  summary: 'BaseLocalizationWorkbenchContribution (Eventually): registers Configure Display Language, Clear Display Language Preference and the localizations extension point.'
  sources:
  - src/vs/workbench/contrib/localization/browser/localization.contribution.ts:11
  - src/vs/workbench/contrib/localization/common/localization.contribution.ts:17
- id: native-localization-workbench-contribution
  name: NativeLocalizationWorkbenchContribution
  kind: module
  parent: localization-contribution-native
  summary: 'Desktop localization contribution (Eventually): on top of the base registrations, suggests a language pack for the OS locale, offers to switch language after a language pack install, and falls
    back to English when the active one is uninstalled.'
  sources:
  - src/vs/workbench/contrib/localization/electron-browser/localization.contribution.ts:23
  state:
    schema:
      type: object
      properties:
        language:
          type: string
        locale:
          type: string
    initial:
      language: en
      locale: en-us
- id: log-output-channels
  name: LogOutputChannels
  kind: module
  parent: logs-contribution-common
  summary: 'Restored: binds the logLevel context key, registers an output channel for every visible logger (grouped loggers into a compound channel), follows logger and visibility changes, and registers
    Show Window Log.'
  sources:
  - src/vs/workbench/contrib/logs/common/logs.contribution.ts:53
- id: web-log-output-channels
  name: WebLogOutputChannels
  kind: module
  parent: logs-contribution
  summary: 'Restored (web): starts LogsDataCleaner and registers Open Window Log File (Session)...'
  sources:
  - src/vs/workbench/contrib/logs/browser/logs.contribution.ts:16
  state:
    schema:
      type: object
      properties:
        logs_home:
          type: string
    initial:
      logs_home: file:///home/dev/.config/Code/logs/20261030T000000
- id: logs-data-cleaner
  name: LogsDataCleaner
  kind: module
  parent: logs-contribution-common
  summary: Ten seconds after startup deletes old log session folders (named yyyymmddThhmmss), keeping the 49 most recent besides the current one.
  sources:
  - src/vs/workbench/contrib/logs/common/logsDataCleaner.ts:13
- id: system-wide-keybindings-contribution
  name: SystemWideKeybindingsContribution
  kind: module
  parent: system-wide-keybindings-contribution-native
  summary: 'AfterRestored: mirrors user keybindings marked systemWide to the main process (Electron globalShortcut), warning once per ignored when clause and when registrations fail.'
  sources:
  - src/vs/workbench/contrib/keybindings/electron-browser/systemWideKeybindings.contribution.ts:22
  state:
    schema:
      type: object
      properties:
        warned_when_labels:
          type: array
    initial:
      warned_when_labels: []
- id: system-wide-keybindings-synchronizer
  name: SystemWideKeybindingsSynchronizer
  kind: module
  parent: system-wide-keybindings-contribution-native
  summary: Debounces (200 ms RunOnceScheduler) and serializes syncs of the candidate list to INativeHostService.syncSystemWideKeybindings; skips an unchanged payload unless the last one had failures.
  sources:
  - src/vs/workbench/contrib/keybindings/electron-browser/systemWideKeybindingsSynchronizer.ts:21
  state:
    schema:
      type: object
      properties:
        last_payload:
          type:
          - array
          - 'null'
        last_had_failures:
          type: boolean
        last_reported_failures:
          type: array
    initial:
      last_payload: null
      last_had_failures: false
      last_reported_failures: []
- id: keybindings-export-contribution
  name: KeybindingsExportContribution
  kind: module
  parent: keybindings-export-contribution-native
  summary: 'Eventually, outside stable builds: with --export-default-keybindings[=path], writes doc.keybindings.{win,osx,linux}.json (core and built-in extension defaults plus unbound commands) and closes
    the window.'
  sources:
  - src/vs/workbench/contrib/keybindingsExport/electron-browser/keybindingsExport.contribution.ts:36
  state:
    schema:
      type: object
      properties:
        quality:
          type: string
        export_default_keybindings:
          type:
          - string
          - 'null'
        app_root:
          type: string
    initial:
      quality: ''
      export_default_keybindings: null
      app_root: /opt/code-oss
