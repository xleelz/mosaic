# generated by builder.py from parts_src/browser.py
configs:
- id: workbench-browser-new-tab-placement
  type: string
  value: activeGroup
  default: activeGroup
  summary: 'workbench.browser.newTabPlacement: where new Integrated Browser tabs open (activeGroup, sideGroup, window).'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:944-958
  attributes:
    key: workbench.browser.newTabPlacement
components:
- id: editor-service
  attributes:
    boundary: true
    owner: workbench-shell
stubs:
- component: editor-service
  name: open-editor
  kind: function
  attributes:
    boundary: true
    owner: workbench-shell
seed:
  browser-view-workbench-service:
    next_id: 1
    views: {}
interfaces:
- component: browser-view-workbench-service
  name: get-preferred-group
  kind: function
  summary: 'IBrowserViewWorkbenchService.getPreferredGroup: open-to-side goes to the dedicated side group; otherwise workbench.browser.newTabPlacement sideGroup or window picks the dedicated (locked) group;
    else the active group. SIDE_GROUP is -2, ACTIVE_GROUP -1.'
  sources:
  - src/vs/workbench/contrib/browserView/common/browserView.ts:218
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:324-349
  - src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:357-380
  request:
    type: object
    properties:
      open_to_side:
        type: boolean
        default: false
  response:
    type: object
    properties:
      group:
        type: integer
      dedicated:
        type: string
  behavior:
  - title: '"Open to side" is routed into the dedicated side group'
    source: src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:326-328
    if: has(input.open_to_side) && input.open_to_side
    then:
    - return:
        group: -2
        dedicated: sideGroup
  - source: src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:336
    set:
      vars.placement: = config['workbench-browser-new-tab-placement']
  - title: '_getOrCreateDedicatedGroup: reuse or create a locked group (side) or auxiliary window'
    source: src/vs/workbench/contrib/browserView/electron-browser/browserViewWorkbenchService.ts:337-339
    if: vars.placement == 'sideGroup' || vars.placement == 'window'
    then:
    - return:
        group: '= vars.placement == ''sideGroup'' ? -2 : -1'
        dedicated: = vars.placement
  - return:
      group: -1
      dedicated: ''
- component: browser-view-workbench-service
  name: track-view
  kind: function
  summary: 'A browser editor input for a new view id (BrowserViewUri.forId(generateUuid())): records its URL so contextual views can be matched later.'
  sources:
  - src/vs/workbench/contrib/browserView/common/browserEditorInput.ts:265-267
  - src/vs/platform/browserView/common/browserViewUri.ts:19-21
  request:
    type: object
    properties:
      url:
        type: string
        default: ''
  response:
    type: object
    properties:
      resource:
        type: string
  behavior:
  - title: BrowserViewUri.forId(id)
    set:
      vars.resource: = 'vscode-browser:/view-' + string(state.next_id)
  - set:
      state.next_id: = state.next_id + 1
      state.views: '= merge(state.views, {vars.resource: {''url'': input.url}})'
  - return:
      resource: = vars.resource
- component: browser-view-browser-navigation-features-native
  name: open-url-picker
  kind: function
  summary: 'BrowserNavigationFeatures.openUrlPicker -> BrowserUrlBarWidget.openUrlPicker: a read-only view only focuses the URL input; otherwise the URL quick pick opens over the URL bar.'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserNavigationFeatures.ts:305-307
  - src/vs/workbench/contrib/browserView/electron-browser/widgets/browserUrlBarWidget.ts:183-189
  request:
    type: object
    properties:
      resource:
        type: string
      readonly:
        type: boolean
        default: false
  behavior:
  - source: src/vs/workbench/contrib/browserView/electron-browser/widgets/browserUrlBarWidget.ts:184-187
    if: has(input.readonly) && input.readonly
    then:
    - set:
        state.focused_url_input: = input.resource
    - return:
        picker: false
  - title: _openPicker()
    source: src/vs/workbench/contrib/browserView/electron-browser/widgets/browserUrlBarWidget.ts:188
    set:
      state.picker_open: = input.resource
  - return:
      picker: true
- component: browser-view-browser-tab-management-features-native
  name: cmd-workbench-action-browser-open
  kind: command
  summary: 'Open Integrated Browser: string or {url, openToSide, reuseUrlFilter}; reuses a contextual view matching the filter, else opens a new browser editor in the preferred group (locked when opened
    to the side); without a URL the URL picker opens.'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:557
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:289-346
  attributes:
    command: workbench.action.browser.open
  request:
    type: object
    properties:
      args:
        type: array
        items: {}
        default: []
  behavior:
  - title: Parse arguments
    source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:295
    set:
      vars.a: '= (has(input.args) && size(input.args) > 0 ? input.args[0] : null)'
  - set:
      vars.o: '= vars.a == null ? {} : (type(vars.a) == string ? {''url'': vars.a} : vars.a)'
  - set:
      vars.url: '= has(vars.o.url) ? vars.o.url : '''''
      vars.side: = has(vars.o.openToSide) && vars.o.openToSide
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:297
    call: browser-view-workbench-service.get-preferred-group
    input:
      open_to_side: = vars.side
    as: g
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:298
    if: has(vars.o.reuseUrlFilter) && vars.o.reuseUrlFilter != ''
    then:
    - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:298-325
      call: browser-view-workbench-service.find-contextual-view
      input:
        filter: = vars.o.reuseUrlFilter
      as: m
    - if: vars.m.value.found
      then:
      - if: vars.url != ''
        then:
        - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:324-326
          call: browser-view-workbench-service.navigate
          input:
            resource: = vars.m.value.resource
            url: = vars.url
      - title: Reveal the existing tab where it lives
        source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:330
        call: editor-service.open-editor
        input:
          resource: = vars.m.value.resource
      - return:
          resource: = vars.m.value.resource
          reused: true
          picker: false
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:296
    call: browser-view-workbench-service.track-view
    input:
      url: = vars.url
    as: v
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:337
    call: editor-service.open-editor
    input:
      resource: = vars.v.value.resource
      group: = vars.g.value.group
    as: e
  - title: 'No URL: open the URL picker'
    source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:343
    if: vars.url == ''
    then:
    - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:343-345
      call: browser-view-browser-navigation-features-native.open-url-picker
      input:
        resource: = vars.v.value.resource
  - return:
      resource: = vars.v.value.resource
      reused: false
      locked: = vars.side
      picker: = vars.url == ''
- component: browser-view-browser-tab-management-features-native
  name: cmd-workbench-action-browser-newtab
  kind: command
  summary: 'New Tab (Ctrl/Cmd+T in a browser editor): opens a blank browser editor in the preferred group and always opens the URL picker.'
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:560
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:426-438
  attributes:
    command: workbench.action.browser.newTab
  request:
    type: object
    properties:
      args:
        type: array
        items: {}
        default: []
  behavior:
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:434
    call: browser-view-workbench-service.get-preferred-group
    input: {}
    as: g
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:430
    call: browser-view-workbench-service.track-view
    input:
      url: ''
    as: v
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:434
    call: editor-service.open-editor
    input:
      resource: = vars.v.value.resource
      group: = vars.g.value.group
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:435-437
    call: browser-view-browser-navigation-features-native.open-url-picker
    input:
      resource: = vars.v.value.resource
  - return:
      resource: = vars.v.value.resource
      picker: true
- component: browser-view-workbench-service
  name: find-contextual-view
  kind: function
  summary: The first contextual browser view whose URL matches the reuse filter (glob on scheme, authority and path; "*" is read as any run of characters).
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:298-321
  request:
    type: object
    required:
    - filter
    properties:
      filter:
        type: string
  behavior:
  - title: match(filter, url) per URI part
    source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:300-318
    set:
      vars.re: = '^' + input.filter.replace('.', '\\.').replace('?', '\\?').replace('*', '.*')
  - set:
      vars.hits: = state.views.filter(k, state.views[k].url.matches(vars.re))
  - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:323
    if: size(vars.hits) == 0
    then:
    - return:
        found: false
  - return:
      found: true
      resource: = vars.hits[0]
- component: browser-view-workbench-service
  name: navigate
  kind: function
  summary: BrowserEditorInput.navigate(url) on a reused view.
  sources:
  - src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:324-326
  request:
    type: object
    properties:
      resource:
        type: string
      url:
        type: string
  behavior:
  - if: '!(input.resource in state.views)'
    then:
    - return:
        navigated: false
  - set:
      state.views: '= merge(state.views, {input.resource: {''url'': input.url}})'
  - return:
      navigated: true
scenarios:
- id: workbench-contribs-browser-browser-open-no-url
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'browser-view-browser-navigation-features-native.open-url-picker')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.resource.startsWith('vscode-browser:/'))
- id: workbench-contribs-browser-browser-open-with-url
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: s
    input:
      args:
      - https://example.com
  expect:
  - steps.s.result.ok
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''browser-view-browser-navigation-features-native.open-url-picker'')'
  - state['browser-view-workbench-service@w1'].views['vscode-browser:/view-1'].url == 'https://example.com'
- id: workbench-contribs-browser-browser-open-to-side
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: s
    input:
      args:
      - url: http://localhost:3000
        openToSide: true
  expect:
  - steps.s.result.ok
  - steps.s.result.value.locked
  - trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.group == -2)
- id: workbench-contribs-browser-browser-open-reuse
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-open
    caller: user
    as: s
    input:
      args:
      - url: http://localhost:3000/app?x=1
        reuseUrlFilter: http://localhost:3000/*
  state:
    browser-view-workbench-service@w1:
      next_id: 2
      views:
        vscode-browser:/view-1:
          url: http://localhost:3000/app
  expect:
  - steps.s.result.ok
  - steps.s.result.value.reused
  - state['browser-view-workbench-service@w1'].views['vscode-browser:/view-1'].url == 'http://localhost:3000/app?x=1'
  - state['browser-view-workbench-service@w1'].next_id == 2
- id: workbench-contribs-browser-browser-new-tab
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-newtab
    caller: user
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'browser-view-browser-navigation-features-native.open-url-picker')
  - state['browser-view-browser-navigation-features-native@w1'].picker_open == 'vscode-browser:/view-1'
- id: workbench-contribs-browser-browser-new-tab-side-placement
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: browser-view-browser-tab-management-features-native.cmd-workbench-action-browser-newtab
    caller: user
    as: s
    input: {}
  config:
    workbench-browser-new-tab-placement: sideGroup
  expect:
  - steps.s.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.group == -2)
