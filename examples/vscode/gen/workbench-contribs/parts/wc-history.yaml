  name: cmd-files-opentimeline
  kind: command
  summary: Open Timeline for a resource (explorer item or active editor); without one, just opens the view.
  sources:
  - src/vs/workbench/contrib/timeline/browser/timeline.contribution.ts:89
  - src/vs/workbench/contrib/timeline/browser/timeline.contribution.ts:73-85
  attributes:
    command: files.openTimeline
  request:
    type: object
    properties:
      uri:
        type: string
        default: file:///work/app/src/util.ts
  behavior:
  - if: has(input.uri) && input.uri != ''
    then:
    - source: src/vs/workbench/contrib/timeline/browser/timeline.contribution.ts:80
      call: timeline-service.set-uri
      input:
        uri: = input.uri
    - return:
        uri: = input.uri
  - source: src/vs/workbench/contrib/timeline/browser/timeline.contribution.ts:82
    call: views-service.open-view
    input:
      id: timeline
      focus: true
  - return:
      uri: null
- component: timeline-pane
  name: load-timeline
  kind: function
  summary: 'TimelinePane.loadTimeline(reset): with no target (no uri and not the workspace timeline) the pane is cleared; otherwise every registered source that is not excluded (timeline.excludeSources)
    is requested again.'
  sources:
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:653-690
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:695-698
  request:
    type: object
  behavior:
  - title: 'No target: nothing to load'
    source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:665-670
    if: '!(has(state.uri) && state.uri != null) && !state.workspace'
    then:
    - title: clear(false); refresh()
      set:
        state.requested: []
    - return:
        requested: []
  - title: timelineService.getSources()
    source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:678
    call: timeline-service.get-sources
    input: {}
    as: src
  - set:
      vars.ex: '= has(state.excluded) ? state.excluded : []'
  - title: loadTimelineForSource skips excluded sources
    source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:679-700
    set:
      state.requested: = vars.src.value.sources.map(s, s.id).filter(id, !(id in vars.ex))
  - return:
      requested: = state.requested
- component: timeline-pane
  name: cmd-timeline-refresh
  kind: command
  summary: 'Refresh: resets the pane (loadTimeline(true) with TimelineTriggerKind.Invoke), which reloads every source that is not excluded.'
  sources:
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1472
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1486-1488
  attributes:
    command: timeline.refresh
  request:
    type: object
  behavior:
  - title: pane.reset()
    source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1487
    set:
      state.reset_count: '= (has(state.reset_count) ? state.reset_count : 0) + 1'
  - source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:356-358
    call: timeline-pane.load-timeline
    input: {}
    as: l
  - return:
      reset: true
      requested: = vars.l.value.requested
- component: timeline-pane
  name: cmd-timeline-showworkspacetimeline
  kind: command
  summary: 'Pin Workspace Timeline: setUriCore(undefined, workspace=true, disableFollowing=true) stops following the active editor, sets timelineForWorkspace and reloads.'
  sources:
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1491
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1502-1504
  attributes:
    command: timeline.showWorkspaceTimeline
  request:
    type: object
  behavior:
  - title: pane.showWorkspaceTimeline() -> setUriCore
    source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:370-376
    set:
      state.follow_active_editor: false
      state.uri: null
      state.workspace: true
  - source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:377
    call: context-key-service.set-context
    input:
      key: timelineForWorkspace
      value: true
  - source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:384
    call: timeline-pane.load-timeline
    input: {}
    as: l
  - return:
      workspace: true
      requested: = vars.l.value.requested
- component: timeline-pane
  name: cmd-timeline-toggleexcludesource-source-id
  kind: command
  summary: Toggle a timeline source in the filter (one command per source, e.g. timeline.toggleExcludeSource:timeline.localHistory); persisted as timeline.excludeSources (PROFILE).
  sources:
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1600
  - src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1612-1619
  attributes:
    command: timeline.toggleExcludeSource:${source.id}
  request:
    type: object
    properties:
      source:
        type: string
        default: timeline.localHistory
  behavior:
  - set:
      vars.ex: '= has(state.excluded) ? state.excluded : []'
  - source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1613-1615
    set:
      state.excluded: '= input.source in vars.ex ? vars.ex.filter(s, s != input.source) : vars.ex + [input.source]'
  - source: src/vs/workbench/contrib/timeline/browser/timelinePane.ts:1617-1618
    call: storage-service.store
    input:
      key: timeline.excludeSources
      value: = '[' + state.excluded.map(s, '"' + s + '"').join(',') + ']'
      scope: profile
      target: user
  - return:
      excluded: = state.excluded
- component: local-history-timeline
  name: constructor
  kind: function
  summary: Registers the timeline provider when local history is enabled (and the vscode-local-history file system provider).
  sources:
  - src/vs/workbench/contrib/localHistory/browser/localHistory.contribution.ts:11
  - src/vs/workbench/contrib/localHistory/browser/localHistoryTimeline.ts:45-76
  request:
    type: object
  behavior:
  - title: updateTimelineRegistration reads workbench.localHistory.enabled
    if: '''workbench-local-history-enabled'' in config && config[''workbench-local-history-enabled'']'
    then:
    - source: src/vs/workbench/contrib/localHistory/browser/localHistoryTimeline.ts:70-71
      call: timeline-service.register-timeline-provider
      input:
        id: timeline.localHistory
        label: Local History
    - return:
        timeline_registered: true
    else:
    - source: src/vs/workbench/contrib/localHistory/browser/localHistoryTimeline.ts:72-73
      call: timeline-service.unregister-timeline-provider
      input:
        id: timeline.localHistory
    - return:
        timeline_registered: false
