- component: preferences-actions-contribution
  name: constructor
  kind: function
  summary: Registers settings and keybindings actions, then updates the preferences menu item on workbench state and folder changes.
  sources:
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1519
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:207-225
  request:
    type: object
  behavior:
  - title: registerSettingsActions + registerKeybindingsActions
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:218-219
    set:
      state.actions_registered: true
  - title: workspaceContextService.getWorkbenchState() and folders
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1317
    call: workspace-context.get-workspace
    input: {}
    as: ws
  - title: A multi-root workspace gets "Open Workspace Settings" on the workspace settings file
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1317-1340
    if: vars.ws.value.workbench_state == 'workspace'
    then:
    - set:
        vars.menu:
        - _workbench.openWorkspaceSettingsEditor
    else:
    - set:
        vars.menu: []
  - title: 'updatePreferencesEditorMenuItemForWorkspaceFolders: one per folder, opening folder (or workspace, in a folder window) settings'
    source: src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1344-1360
    set:
      state.menu_commands: = vars.menu + vars.ws.value.folders.map(f, '_workbench.openFolderSettings.' + f)
  - return:
      actions_registered: true
      menu_commands: = state.menu_commands
