  steps:
  - interface: settings-change-relauncher.constructor
    caller: workbench
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - state['settings-change-relauncher@w1'].listening
- id: workbench-contribs-rest2-relaunch-confirm
  fixtures:
  - one-window-folder
  - workbench-contribs-seed
  steps:
  - interface: settings-change-relauncher.on-configuration-change
    caller: platform
    as: s
    input: {}
  expect:
  - steps.s.result.ok
  - steps.s.result.value.restarted
  - trace.exists(e, e.type == 'call.start' && e.interface == 'host-service.restart')
  - state['settings-change-relauncher@w1'].values['workbench.enableExperiments'] == false
