        default: file:///work/lib
      remote:
        type: boolean
        default: false
  behavior:
  - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:348
    if: input.first_folder == state.first_folder
    then:
    - return:
        restarted: false
  - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:349
    set:
      state.first_folder: = input.first_folder
  - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:299
    if: input.remote
    then:
    - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:300
      call: host-service.reload
      input: {}
    - return:
        restarted: reload
  - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:302
    call: extension-service.stop-extension-hosts
    input:
      reason: Changing workspace folders
      auto: false
    as: st
  - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:303-304
    call: extension-service.start-extension-hosts
    input: {}
  - return:
      restarted: extension-hosts
