- component: large-file-optimizations-warner
  name: update
  kind: function
  summary: 'On model change: for a model too large for tokenization, prompt (never show again) with "Forcefully Enable Features" that writes editor.largeFileOptimizations=false.'
  sources:
  - src/vs/workbench/contrib/codeEditor/browser/largeFileOptimizations.ts:67
  - src/vs/workbench/contrib/codeEditor/browser/largeFileOptimizations.ts:33-63
  request:
    type: object
    properties:
      file_name:
        type: string
        default: big.log
      too_large_for_tokenization:
        type: boolean
        default: true
  behavior:
  - source: src/vs/workbench/contrib/codeEditor/browser/largeFileOptimizations.ts:39
    if: '!input.too_large_for_tokenization'
    then:
    - return:
        warned: false
  - source: src/vs/workbench/contrib/codeEditor/browser/largeFileOptimizations.ts:51-62
    call: notification-service.prompt
    input:
      severity: info
      message: '= input.file_name + '': tokenization, wrapping, folding, codelens, word highlighting and sticky scroll have been turned off for this large file in order to reduce memory usage and avoid
        freezing or crashing.'''
      choices:
      - Forcefully Enable Features
  - choice: answer
    default: dismiss
    options:
      enable:
      - source: src/vs/workbench/contrib/codeEditor/browser/largeFileOptimizations.ts:55
        call: configuration-service.update-value
        input:
          key: editor.largeFileOptimizations
          value: false
      - return:
          warned: true
          disabled_optimizations: true
      dismiss: []
  - return:
      warned: true
      disabled_optimizations: false
