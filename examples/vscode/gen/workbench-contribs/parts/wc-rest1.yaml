- component: format-actions-multiple
  name: cmd-editor-action-formatdocument-multiple
  kind: command
  summary: 'Format Document With...: a given formatter (args.formatter) or a pick among the document formatters (or Configure Default Formatter...), then format explicitly.'
  sources:
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:360
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:375-399
  attributes:
    command: editor.action.formatDocument.multiple
  request:
    type: object
  behavior:
  - source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:381
    call: language-features-service.ordered
    input:
      feature: documentFormatting
      language_id: typescript
    as: o
  - if: has(input.formatter)
    then:
    - set:
        vars.p: = vars.o.value.providers.filter(x, x.extension_id == input.formatter)
    - title: 'Unknown formatter: nothing'
      source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:386-389
      if: size(vars.p) == 0
      then:
      - return:
          formatted: false
    else:
    - title: showFormatterPick
      source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:390-394
      choice: pick
      default: first
      options:
        first:
        - set:
            vars.p: = vars.o.value.providers
        configure:
        - source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:335-342
          call: default-formatter.pick-and-persist-default-formatter
          input:
            formatters:
            - vscode.typescript-language-features
            language_id: typescript
        - return:
            formatted: false
        dismissed:
        - return:
            formatted: false
    - title: No document formatter for the model
      if: size(vars.p) == 0
      then:
      - return:
          formatted: false
  - source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:398
    call: format.format-document-with-provider
    input:
      resource: file:///work/app/src/main.ts
      handle: = vars.p[0].handle
      mode: explicit
      via_editor: true
  - return:
      formatted: true
      formatter: = vars.p[0].extension_id
- component: format-actions-multiple
  name: cmd-editor-action-formatselection-multiple
  kind: command
  summary: 'Format Selection With...: an empty selection grows to its whole line; pick a range formatter, format the range.'
  sources:
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:402
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:418-436
  attributes:
    command: editor.action.formatSelection.multiple
  request:
    type: object
  behavior:
  - title: 'Empty selection: the full line'
    source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:427-428
    set:
      vars.range:
        start_line: 2
        start_column: 1
        end_line: 2
        end_column: 25
  - source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:430
    call: language-features-service.ordered
    input:
      feature: documentRangeFormatting
      language_id: typescript
    as: o
  - source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:431-433
    choice: pick
    default: first
    options:
      first: []
      dismissed:
      - return:
          formatted: false
  - title: formatDocumentRangesWithProvider(picked provider)
    source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:434
    call: format.format-document-ranges-with-selected-provider
    input:
      resource: file:///work/app/src/main.ts
      ranges:
      - = vars.range
      mode: explicit
  - return:
      formatted: true
- component: format-modified
  name: cmd-editor-action-formatchanges
  kind: command
  summary: 'Format Modified Lines: formats only the ranges changed against the SCM original.'
  sources:
  - src/vs/workbench/contrib/format/browser/formatModified.ts:23
  - src/vs/workbench/contrib/format/browser/formatModified.ts:33-48
  attributes:
    command: editor.action.formatChanges
  request:
    type: object
  behavior:
  - source: src/vs/workbench/contrib/format/browser/formatModified.ts:39
    call: format-modified.get-modified-ranges
    input:
      resource: file:///work/app/src/main.ts
    as: r
  - source: src/vs/workbench/contrib/format/browser/formatModified.ts:40
    if: vars.r.value.status != 'ranges'
    then:
    - return:
        formatted: false
  - source: src/vs/workbench/contrib/format/browser/formatModified.ts:41-46
    call: format.format-document-ranges-with-selected-provider
    input:
      resource: file:///work/app/src/main.ts
      ranges: = vars.r.value.ranges
      mode: explicit
  - return:
      formatted: true
- component: format-actions-multiple
  name: cmd-formatter-configure-dfl-generateuuid
  kind: command
  summary: '"Configure..." on the Formatter Conflicts language status item (a fresh command id per status): pick and persist the default formatter.'
  sources:
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:254
  - src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:254-255
  attributes:
