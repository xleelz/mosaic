- component: commands-contribution-common
  name: cmd-runcommands
  kind: command
  summary: 'Run Commands: runs the given commands in sequence (string or {command, args}); stops at the first error, which is notified.'
  sources:
  - src/vs/workbench/contrib/commands/common/commands.contribution.ts:157
  - src/vs/workbench/contrib/commands/common/commands.contribution.ts:80-145
  attributes:
    command: runCommands
  request:
    type: object
    properties:
      commands:
        type: array
        default:
        - command: welcome.markStepComplete
          args:
          - pickColorTheme
        - command: welcome.markStepIncomplete
          args:
          - pickColorTheme
  behavior:
  - if: '!has(input.commands)'
    then:
    - source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:85-88
      call: notification-service.notify
      input:
        severity: error
        message: '''runCommands'' has received an argument with incorrect type. Please, review the argument passed to the command.'
    - return:
        ran: 0
  - if: size(input.commands) == 0
    then:
    - source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:90-93
      call: notification-service.notify
      input:
        severity: warning
        message: '''runCommands'' has not received commands to run. Did you forget to pass commands in the ''runCommands'' argument?'
    - return:
        ran: 0
  - set:
      vars.ran: 0
      vars.failed: false
  - foreach: = input.commands
    as: cmd
    steps:
    - if: vars.failed
      then:
      - break: true
    - source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:102
      call: command-service.execute-command
      input:
        command_id: = vars.cmd.command
        args: '= has(vars.cmd.args) ? vars.cmd.args : []'
      as: r
      on_error: continue
    - if: '!vars.r.ok'
      then:
      - source: src/vs/workbench/contrib/commands/common/commands.contribution.ts:107
        call: notification-service.notify
        input:
          severity: error
          message: = vars.r.error.message
      - set:
          vars.failed: true
      else:
      - set:
          vars.ran: = vars.ran + 1
  - return:
      ran: = vars.ran
