  behavior:
  - source: src/vs/workbench/contrib/format/browser/formatActionsMultiple.ts:255
    call: default-formatter.pick-and-persist-default-formatter
    input:
      formatters:
      - esbenp.prettier-vscode
      - vscode.typescript-language-features
      language_id: typescript
    as: r
  - return: = vars.r.value
