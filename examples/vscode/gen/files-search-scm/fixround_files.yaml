- component: file-commands
  name: resolve-command-editor
  kind: function
  summary: 'The editor a file command acts on: an explicit editor from the command arguments (a URI first argument, or the resource the open editors view selected), else the active editor of the active
    group; none when no editor is active.'
  sources:
  - src/vs/workbench/contrib/files/browser/fileCommands.ts:416-439
  request:
    type: object
    properties:
      args:
        type: array
        items: {}
        default: []
      resource:
        type: string
  response:
    type: object
    properties:
      resource:
        type: string
      group_id:
        type: integer
      found:
        type: boolean
  behavior:
  - if: has(input.args) && size(input.args) > 0 && type(input.args[0]) == string && input.args[0].contains(':')
    then:
    - title: getEditorsFromCommandArgs - an explicit editor context in the arguments wins
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:421-424
      return:
        resource: = input.args[0]
        found: true
  - if: has(input.resource) && input.resource != ''
    then:
    - title: getOpenEditorsViewMultiSelection - the selected editor
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:426-429
      return:
        resource: = input.resource
        found: true
  - title: Otherwise the active editor of the active group
    source: src/vs/workbench/contrib/files/browser/fileCommands.ts:430-435
    call: editor-groups.get-state
    as: st
  - set:
      vars.g: = vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)
  - if: size(vars.g) == 0 || vars.g[0].active == null
    then:
    - title: No active editor, nothing to act on
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:437-439
      return:
        resource: ''
        found: false
  - return:
      resource: = vars.g[0].active
      group_id: = vars.g[0].id
      found: true
- component: file-commands
  name: cmd-workbench-action-files-save
  kind: command
  summary: 'workbench.action.files.save (Ctrl+S, no when clause): saveSelectedEditors with reason EXPLICIT and force, on the editor from the arguments, the open editors selection or the active editor.'
  sources:
  - src/vs/workbench/contrib/files/browser/fileCommands.ts:499-507
  - src/vs/workbench/contrib/files/browser/fileCommands.ts:416-443
  attributes:
    command_id: workbench.action.files.save
  request: FilesCommandRequest
  response:
    type: object
    properties:
      handled:
        type: boolean
      result: {}
  behavior:
  - call: file-commands.resolve-command-editor
    input:
      args: '= has(input.args) ? input.args : []'
      resource: '= has(input.resource) ? input.resource : '''''
    as: target
  - if: '!vars.target.value.found'
    then:
    - title: Nothing to save
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:437-439
      return:
        handled: true
        result: {}
  - title: Save the editor through the editor service (doSaveEditors -> editorService.save)
    source: src/vs/workbench/contrib/files/browser/fileCommands.ts:504-506
    call: editor-service.save
    input:
      resource: = vars.target.value.resource
      reason: explicit
      force: true
      save_as: false
      skip_save_participants: false
    as: saved
  - return:
      handled: true
      result: = vars.saved.value
- component: file-commands
  name: cmd-workbench-action-files-savewithoutformatting
  kind: command
  summary: 'workbench.action.files.saveWithoutFormatting: saveSelectedEditors (selection or active editor) without running save participants.'
  sources:
  - src/vs/workbench/contrib/files/browser/fileCommands.ts:511-521
  attributes:
    command_id: workbench.action.files.saveWithoutFormatting
  request: FilesCommandRequest
  response:
    type: object
    properties:
      handled:
        type: boolean
      result: {}
  behavior:
  - call: file-commands.resolve-command-editor
    input:
      resource: '= has(input.resource) ? input.resource : '''''
    as: target
  - if: '!vars.target.value.found'
    then:
    - return:
        handled: true
        result: {}
  - title: Save the editor through the editor service, skipping save participants
    source: src/vs/workbench/contrib/files/browser/fileCommands.ts:518-520
    call: editor-service.save
    input:
      resource: = vars.target.value.resource
      reason: explicit
      force: true
      save_as: false
      skip_save_participants: true
    as: saved
  - return:
      handled: true
      result: = vars.saved.value
- component: file-commands
  name: cmd-workbench-action-files-revert
  kind: command
  summary: 'workbench.action.files.revert: reverts the open editors selection or the active editor with force; a failure shows an error notification.'
  sources:
  - src/vs/workbench/contrib/files/browser/fileCommands.ts:571-597
  attributes:
    command_id: workbench.action.files.revert
  request: FilesCommandRequest
  response:
    type: object
    properties:
      handled:
        type: boolean
      result: {}
  behavior:
  - title: Retrieve the selected or active editor (arguments are not read)
    source: src/vs/workbench/contrib/files/browser/fileCommands.ts:577-584
    call: file-commands.resolve-command-editor
    input:
      resource: '= has(input.resource) ? input.resource : '''''
    as: target
  - if: '!vars.target.value.found'
    then:
    - title: Nothing to revert
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:586-588
      return:
        handled: true
        result: {}
  - title: Revert with force (the text editor input reverts its text file model)
    source: src/vs/workbench/contrib/files/browser/fileCommands.ts:590-591
    call: text-file-service.revert
    input:
      resource: = vars.target.value.resource
      options:
        force: true
    as: res
    on_error:
    - title: Failed to revert, error notification
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:592-595
      call: notification-service.notify
      input:
        severity: error
        message: "= 'Failed to revert ' + vars.target.value.resource + ': ' + error.code"
    - return:
        handled: true
        result:
          reverted: false
  - return:
      handled: true
      result: = vars.res.value
- component: text-file-service
  name: create
  kind: function
  summary: 'ITextFileService.create: encodes each value and creates the files with those contents through the working copy file service.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:253-264
  request:
    type: object
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/new.ts
      value:
        type: string
        default: ''
      overwrite:
        type: boolean
        default: false
  response:
    type: object
    properties:
      created:
        type: boolean
  behavior:
  - title: Encode the value (UTF-8, no BOM by default) and create the file with it as contents
    source: src/vs/workbench/services/textfile/browser/textFileService.ts:255-261
    call: working-copy-file-service.create
    input:
      operation: create
      files:
      - target: = input.resource
        contents: '= has(input.value) ? input.value : '''''
      overwrite: = has(input.overwrite) && input.overwrite
  - return:
      created: true
