- component: text-file-models
  name: get
  kind: function
  summary: 'TextFileEditorModelManager.get: the model for a resource, if one is open. The file state (dirty, saved alternative version, mtime, encoding, eol) is the model''s own; value, version_id and
    alternative_version_id are read live from its textEditorModel, the editor''s text model, which holds the one copy of the document text.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:342-344
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1100-1108
  request: FilesResourceRequest
  response:
    type: object
    properties:
      exists:
        type: boolean
      model:
        $ref: FilesTextFileModel
  behavior:
  - if: '!(input.resource in state.models)'
    then:
    - return:
        exists: false
  - title: The text and its versions come from the model's textEditorModel (getValue, getAlternativeVersionId)
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1107
    call: text-model.get-value
    input:
      uri: = input.resource
    as: text
    on_error: continue
  - return: '= vars.text.ok ? {''exists'': true, ''model'': merge(state.models[input.resource], {''value'': vars.text.value.value, ''version_id'': vars.text.value.version_id, ''alternative_version_id'': vars.text.value.alternative_version_id,
      ''language_id'': vars.text.value.language_id})} : {''exists'': true, ''model'': state.models[input.resource]}'
- component: text-file-models
  name: update-text-model
  kind: function
  summary: 'BaseTextEditorModel.doCreateTextEditorModel / TextFileEditorModel.doUpdateTextModel: put new text into the resource''s text model. An existing text model gets the value (setValue, no undo
    stop) inside a block that ignores the content change for dirty tracking; otherwise IModelService.createModel creates it. The text file model keeps no copy of the text.'
  sources:
  - src/vs/workbench/common/editor/textEditorModel.ts:169-184
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:669-678
  request:
    type: object
    required:
    - resource
    - value
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      value:
        type: string
      language_id:
        type: string
        default: plaintext
  response:
    type: object
    properties:
      created:
        type: boolean
      version_id:
        type: integer
      alternative_version_id:
        type: integer
  behavior:
  - title: modelService.getModel(resource)
    source: src/vs/workbench/common/editor/textEditorModel.ts:170
    call: text-model.get-value
    input:
      uri: = input.resource
    as: existing
    on_error: continue
  - if: '!vars.existing.ok'
    then:
    - title: No text model yet, IModelService.createModel
      source: src/vs/workbench/common/editor/textEditorModel.ts:171-176
      call: model-service.create-model
      input:
        resource: = input.resource
        value: = input.value
        language_id: '= has(input.language_id) ? input.language_id : ''plaintext'''
      as: created
    - call: text-model.get-value
      input:
        uri: = input.resource
      as: now_text
    - return:
        created: true
        version_id: = vars.now_text.value.version_id
        alternative_version_id: = vars.now_text.value.alternative_version_id
  - if: input.resource in state.models
    then:
    - title: ignoreDirtyOnModelContentChange = true while the value is replaced
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:673
      set:
        state.models: '= merge(state.models, {input.resource: {''ignore_dirty'': true}})'
  - title: The existing text model gets the new value (setValue bumps versionId and alternativeVersionId, pushes no undo stop)
    source: src/vs/workbench/common/editor/textEditorModel.ts:177-178
    call: text-model.set-value
    input:
      uri: = input.resource
      value: = input.value
    as: setv
  - if: input.resource in state.models
    then:
    - title: The finally block re-enables dirty tracking
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:676-678
      set:
        state.models: '= merge(state.models, {input.resource: {''ignore_dirty'': false}})'
  - return:
      created: false
      version_id: = vars.setv.value.version_id
      alternative_version_id: = vars.setv.value.alternative_version_id
- component: text-file-models
  name: resolve
  kind: function
  summary: 'TextFileEditorModelManager.resolve + TextFileEditorModel.resolve: create or reload the model from given contents, a backup (new models only) or the file; dirty models are never reloaded from
    the file. The text goes into the editor''s text model (setValue or createModel); the text file model keeps the file state and remembers the alternative version id as the saved version.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:365-487
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:295-339
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:527-594
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:596-654
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/util.ts
      contents:
        type:
        - string
        - 'null'
        default: null
      reload:
        type: boolean
        default: false
      force_read_from_file:
        type: boolean
        default: false
      allow_binary:
        type: boolean
        default: false
  response:
    $ref: FilesTextFileModel
  errors:
  - code: file-not-found
    status: 0
    retryable: false
  - code: file-is-binary
    status: 0
    retryable: false
  behavior:
  - set:
      vars.exists: = input.resource in state.models
      vars.has_contents: = has(input.contents) && input.contents != null
      vars.reload: = (has(input.reload) && input.reload) || (has(input.force_read_from_file) && input.force_read_from_file)
      vars.lang: '= input.resource.endsWith(''.ts'') ? ''typescript'' : (input.resource.endsWith(''.md'') ? ''markdown'' : (input.resource.endsWith(''.json'') ? ''json'' : ''plaintext''))'
      vars.eol: '= config[''files-eol''] == ''auto'' ? ''\n'' : config[''files-eol'']'
  - if: vars.exists && !vars.has_contents && !vars.reload
    then:
    - title: Model exists and no reload requested
      source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:420-423
      call: text-file-models.get
      input:
        resource: = input.resource
      as: cur
    - return: = vars.cur.value.model
  - if: vars.has_contents
    then:
    - title: Contents provided, resolve from the buffer into the text model (marks the model dirty)
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:323-326
      call: text-file-models.update-text-model
      input:
        resource: = input.resource
        value: = input.contents
        language_id: = vars.lang
    - set:
        state.models: '= merge(state.models, {input.resource: vars.exists ? {''dirty'': true} : {''saved_version_id'': 0, ''dirty'': true, ''mtime'': 0, ''encoding'': ''utf8'', ''eol'': vars.eol}})'
    - publish: text-file-models.on-did-change-dirty
      input:
        resource: = input.resource
        dirty: true
      delivery: sync
    - call: text-file-models.get
      input:
        resource: = input.resource
      as: cur
    - return: = vars.cur.value.model
  - if: vars.exists && state.models[input.resource].dirty
    then:
    - title: Dirty models are never resolved from the file (data loss protection)
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:305-312
      call: text-file-models.get
      input:
        resource: = input.resource
      as: cur
    - return: = vars.cur.value.model
  - if: '!vars.exists'
    then:
    - title: New model, try to resolve from a backup first
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:328-334
      call: native-working-copy-backup-service.resolve
      input:
        resource: = input.resource
      as: backup
    - if: vars.backup.value.found
      then:
      - title: Restored from backup, the model starts dirty
        source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:473-525
        call: text-file-models.update-text-model
        input:
          resource: = input.resource
          value: = vars.backup.value.content
          language_id: = vars.lang
      - set:
          state.models: '= merge(state.models, {input.resource: {''saved_version_id'': 0, ''dirty'': true, ''mtime'': vars.backup.value.mtime, ''orphaned'': vars.backup.value.orphaned, ''encoding'': ''utf8'',
            ''eol'': vars.eol}})'
      - call: working-copy-service.register-working-copy
        input:
          resource: = input.resource
          type_id: ''
      - publish: text-file-models.on-did-change-dirty
        input:
          resource: = input.resource
          dirty: true
        delivery: sync
      - call: text-file-models.get
        input:
          resource: = input.resource
        as: cur
      - return: = vars.cur.value.model
  - title: Resolve from the file (etag disabled when forced)
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:531-555
    call: text-file-service.read
    input:
      resource: = input.resource
      accept_text_only: = !(vars.exists || (has(input.allow_binary) && input.allow_binary))
      etag: '= (has(input.force_read_from_file) && input.force_read_from_file) || !vars.exists ? '''' : (has(state.models[input.resource].etag) ? state.models[input.resource].etag : '''')'
    as: content
    on_error:
    - when: vars.exists
      set:
        state.models: '= merge(state.models, {input.resource: {''orphaned'': error.code == ''file-not-found''}})'
    - if: vars.exists && error.code == 'file-not-modified-since'
      then:
      - title: Not modified since, keep the model
        source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:574-580
        call: text-file-models.get
        input:
          resource: = input.resource
        as: cur
      - return: = vars.cur.value.model
    - if: vars.exists && error.code == 'file-not-found' && !(has(input.force_read_from_file) && input.force_read_from_file)
      then:
      - title: Deleted meanwhile; a resolved model keeps its content and becomes orphaned
        source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:582-588
        call: text-file-models.get
        input:
          resource: = input.resource
        as: cur
      - return: = vars.cur.value.model
    - title: Bubble the error; a model created for this resolve is disposed
      source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:464-476
      fail: = error
  - title: 'resolveFromContent: update the existing text model (doUpdateTextModel) or create a new one (doCreateTextModel)'
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:635-642
    call: text-file-models.update-text-model
    input:
      resource: = input.resource
      value: = vars.content.value.value
      language_id: = vars.lang
    as: updated
  - title: 'Remember the stat and encoding, then setDirty(false): bufferSavedVersionId = the text model''s alternative version id'
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:606-650
    set:
      state.models: '= merge(state.models, {input.resource: {''saved_version_id'': vars.updated.value.alternative_version_id, ''dirty'': false, ''orphaned'': false, ''conflict'': false, ''error'': false, ''mtime'':
        vars.content.value.mtime, ''etag'': vars.content.value.etag, ''size'': vars.content.value.size, ''encoding'': vars.content.value.encoding, ''eol'': vars.exists && has(state.models[input.resource].eol)
        ? state.models[input.resource].eol : vars.eol}})'
  - if: '!vars.exists'
    then:
    - title: A new model registers as a working copy
      source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:451-462
      call: working-copy-service.register-working-copy
      input:
        resource: = input.resource
        type_id: ''
  - call: text-file-models.get
    input:
      resource: = input.resource
    as: cur
  - return: = vars.cur.value.model
- component: text-file-models
  name: save
  kind: function
  summary: 'TextFileEditorModel.save/doSave/doSaveSequential: guards (resolved, readonly, conflict/error on auto save, not dirty), save participants, write the text model''s snapshot with mtime/etag, then
    save success (clean, saved alternative version id, saved event) or save error (dirty, error/conflict state, error handler).'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:831-857
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:859-938
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:940-1047
  request: FilesSaveRequest
  response: FilesSaveResult
  behavior:
  - if: '!(input.resource in state.models)'
    then:
    - title: Only resolved models can be saved
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:832-834
      return:
        saved: false
        skipped: not-resolved
  - set:
      vars.m: = state.models[input.resource]
      vars.opts: '= has(input.options) ? input.options : {}'
  - set:
      vars.reason: '= has(vars.opts.reason) ? vars.opts.reason : ''explicit'''
      vars.force: = has(vars.opts.force) && vars.opts.force
      vars.skip_participants: = has(vars.opts.skip_save_participants) && vars.opts.skip_save_participants
      vars.ignore_mtime: = has(vars.opts.ignore_modified_since) && vars.opts.ignore_modified_since
  - if: has(vars.m.readonly) && vars.m.readonly
    then:
    - title: Readonly models are never saved
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:836-840
      return:
        saved: false
        skipped: readonly
  - if: ((has(vars.m.conflict) && vars.m.conflict) || (has(vars.m.error) && vars.m.error)) && vars.reason in ['auto', 'focus-change', 'window-change']
    then:
    - title: Auto save is ignored while the model is in conflict or error
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:842-849
      return:
        saved: false
        skipped: conflict-or-error
  - if: '!vars.force && !vars.m.dirty'
    then:
    - title: Not dirty and not forced, nothing to write
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:888-895
      return:
        saved: true
        skipped: not-dirty
  - if: '!vars.skip_participants'
    then:
    - call: text-model.get-value
      input:
        uri: = input.resource
      as: before
    - title: Run save participants (format on save, extension onWillSave)
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:946-990
      call: text-file-save-participant.participate
      input:
        resource: = input.resource
        reason: = vars.reason
        content: = vars.before.value.value
        dirty: = vars.m.dirty
        token:
          canceled: false
      as: participants
      on_error: continue
    - if: '!vars.participants.ok && vars.participants.error.code == ''canceled'''
      then:
      - title: A participant canceled the save; the model stays dirty
        source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:977-982
        return:
          saved: false
          skipped: canceled
  - set:
      vars.m: = state.models[input.resource]
  - title: Snapshot the text model after the participants (createSnapshot) and remember its alternative version id
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1027-1043
    call: text-model.get-value
    input:
      uri: = input.resource
    as: snap
  - title: Write the snapshot with the last resolved mtime; the etag is disabled when overwriting
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1027-1043
    call: text-file-service.write
    input:
      resource: = input.resource
      value: = vars.snap.value.value
      mtime: = vars.m.mtime
      etag: '= vars.ignore_mtime || config[''files-save-conflict-resolution''] == ''overwriteFileOnDisk'' ? '''' : (has(vars.m.etag) ? vars.m.etag : string(vars.m.mtime))'
      unlock: = has(vars.opts.write_unlock) && vars.opts.write_unlock
      write_elevated: = has(vars.opts.write_elevated) && vars.opts.write_elevated
    as: write
    on_error:
    - title: Save error keeps the model dirty and flags error (and conflict for a newer file on disk)
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1070-1098
      set:
        state.models: '= merge(state.models, {input.resource: {''dirty'': true, ''error'': true, ''conflict'': error.code == ''file-modified-since''}})'
    - when: '!vars.m.dirty'
      publish: text-file-models.on-did-change-dirty
      input:
        resource: = input.resource
        dirty: true
      delivery: sync
    - call: text-file-save-error-handler.on-save-error
      input:
        resource: = input.resource
        error_code: = error.code
        unlock: = has(vars.opts.write_unlock) && vars.opts.write_unlock
    - publish: text-file-models.on-did-save-error
      input:
        resource: = input.resource
        error_code: = error.code
      delivery: sync
    - return:
        saved: false
        error_code: = error.code
  - title: 'Save success: setDirty(false) remembers the text model''s alternative version id as bufferSavedVersionId, and the new stat'
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1100-1108
    set:
      state.models: '= merge(state.models, {input.resource: {''dirty'': false, ''error'': false, ''conflict'': false, ''orphaned'': false, ''saved_version_id'': vars.snap.value.alternative_version_id, ''mtime'':
        has(vars.write.value.mtime) ? vars.write.value.mtime : now, ''etag'': has(vars.write.value.etag) ? vars.write.value.etag : string(now)}})'
  - when: vars.m.dirty
    title: onDidChangeDirty when the model was dirty
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1049-1068
    publish: text-file-models.on-did-change-dirty
    input:
      resource: = input.resource
      dirty: false
    delivery: sync
  - publish: text-file-models.on-did-save
    input:
      resource: = input.resource
      reason: = vars.reason
      size: = size(vars.snap.value.value)
      mtime: = state.models[input.resource].mtime
    delivery: sync
  - return:
      saved: true
- component: text-file-models
  name: revert
  kind: function
  summary: 'TextFileEditorModel.revert: clear dirty, then re-read from the file into the text model unless soft; a deleted file is ignored, any other error restores the dirty state.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:255-291
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      options:
        type: object
        properties:
          soft:
            type: boolean
            default: false
  response:
    type: object
    properties:
      reverted:
        type: boolean
  errors:
  - code: file-permission-denied
    status: 0
    retryable: false
  behavior:
  - if: '!(input.resource in state.models)'
    then:
    - title: Only resolved models revert
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:256-258
      return:
        reverted: false
  - set:
      vars.was_dirty: = state.models[input.resource].dirty
      vars.prev: = state.models[input.resource]
  - title: doSetDirty(false) remembers the current alternative version id as saved
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:260-262
    call: text-model.get-value
    input:
      uri: = input.resource
    as: cur
  - set:
      state.models: '= merge(state.models, {input.resource: {''dirty'': false, ''conflict'': false, ''error'': false, ''saved_version_id'': vars.cur.value.alternative_version_id}})'
  - if: '!(has(input.options) && has(input.options.soft) && input.options.soft)'
    then:
    - title: Force a read from disk into the text model through the model manager
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:264-281
      call: text-file-models.resolve
      input:
        resource: = input.resource
        reload: true
        force_read_from_file: true
      as: reread
      on_error:
      - if: error.code != 'file-not-found'
        then:
        - title: Revert failed, restore the dirty flags
          source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:272-278
          set:
            state.models: '= merge(state.models, {input.resource: {''dirty'': vars.prev.dirty, ''saved_version_id'': vars.prev.saved_version_id}})'
        - fail: = error
  - publish: text-file-models.on-did-revert
    input:
      resource: = input.resource
    delivery: sync
  - when: vars.was_dirty
    publish: text-file-models.on-did-change-dirty
    input:
      resource: = input.resource
      dirty: false
    delivery: sync
  - return:
      reverted: true
- component: text-file-models
  name: on-model-content-changed
  kind: event
  summary: 'TextFileEditorModel.onModelContentChanged: a text model change reaching the saved alternative version clears dirty, any other change makes the model dirty; changes made while the model updates
    its own text (resolve, revert) are ignored for dirty tracking. Called by the editor area''s text model edits; the text stays in the text model.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:693-738
  request:
    type: object
    required:
    - resource
    - value
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      value:
        type: string
        examples:
        - "import { add } from './util';\nconsole.log(add(1, 3));\n"
      alternative_version_id:
        type:
        - integer
        - 'null'
        default: null
      is_undoing_or_redoing:
        type: boolean
        default: false
  response:
    type: object
    properties:
      version_id:
        type: integer
      dirty:
        type: boolean
  behavior:
  - if: '!(input.resource in state.models)'
    then:
    - title: No resolved model listens to this text model
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:681-691
      return:
        version_id: 0
        dirty: false
  - title: The text model's version (getAlternativeVersionId) after the change
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:714
    call: text-model.get-value
    input:
      uri: = input.resource
    as: text
  - set:
      vars.m: = state.models[input.resource]
      vars.alt: '= has(input.alternative_version_id) && input.alternative_version_id != null ? input.alternative_version_id : vars.text.value.alternative_version_id'
  - if: '!(has(vars.m.ignore_dirty) && vars.m.ignore_dirty) && !(has(vars.m.readonly) && vars.m.readonly)'
    then:
    - if: vars.alt == vars.m.saved_version_id
      then:
      - title: Undo reached the saved version, clear dirty
        source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:712-723
        set:
          state.models: '= merge(state.models, {input.resource: {''dirty'': false}})'
      - when: vars.m.dirty
        publish: text-file-models.on-did-revert
        input:
          resource: = input.resource
        delivery: sync
      - when: vars.m.dirty
        publish: text-file-models.on-did-change-dirty
        input:
          resource: = input.resource
          dirty: false
        delivery: sync
      else:
      - title: Content changed, mark dirty
        source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:726-731
        set:
          state.models: '= merge(state.models, {input.resource: {''dirty'': true}})'
      - when: '!vars.m.dirty'
        publish: text-file-models.on-did-change-dirty
        input:
          resource: = input.resource
          dirty: true
        delivery: sync
  - publish: text-file-models.on-did-change-content
    input:
      resource: = input.resource
