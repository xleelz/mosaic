    behavior:
      - if: "size(input.files) == 0"
        then: [{return: {created: 0}}]
      - foreach: "= input.files"
        as: f
        steps:
          - title: Validate the create before starting
            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:351-358"
            call: file-service.can-create-file
            input: {resource: "= vars.f.target", overwrite: "= has(input.overwrite) && input.overwrite"}
            as: can
