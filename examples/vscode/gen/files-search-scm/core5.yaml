            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:367-374"
            call: file-service.create-file
            input: {resource: "= vars.f.target", overwrite: "= has(input.overwrite) && input.overwrite"}
            on_error:
              - publish: working-copy-file-service.on-did-fail-working-copy-file-operation
                input: {operation: create, files: "= input.files"}
                delivery: sync
              - fail: "= error"
      - publish: working-copy-file-service.on-did-run-working-copy-file-operation
        input: {operation: create, files: "= input.files"}
        delivery: sync
      - return: {created: "= size(input.files)"}

