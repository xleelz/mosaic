  - component: working-copy-file-operation-participant
    name: participate
    kind: function
    summary: "WorkingCopyFileOperationParticipant.participate: skipped when files.participants.timeout <= 0; otherwise each participant runs in turn with the timeout, failures are logged."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyFileOperationParticipant.ts:31-46"]
    request: FilesWorkingCopyFileOperation
    response: {type: object, properties: {ran: {type: integer}, disabled: {type: boolean}}}
    behavior:
      - if: "config['files-participants-timeout'] <= 0"
        then:
          - title: Participants disabled by files.participants.timeout
            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileOperationParticipant.ts:32-35"
            return: {ran: 0, disabled: true}
      - set: {vars.ran: 0}
      - foreach: "= state.participants"
        as: participant
        steps:
          - title: Each participant gets the timeout; its failure or timeout is only logged
            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileOperationParticipant.ts:37-44"
            call: "= vars.participant"
            targets: [main-thread-file-system-event-service.participate]
            input: {operation: "= input.operation", files: "= input.files", timeout_ms: "= config['files-participants-timeout']"}
            timeout_ms: "= config['files-participants-timeout']"
            as: res
            on_error: continue
          - set: {vars.ran: "= vars.res.ok ? vars.ran + 1 : vars.ran"}
      - return: {ran: "= vars.ran", disabled: false}
