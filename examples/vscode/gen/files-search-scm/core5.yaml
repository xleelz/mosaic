interfaces:
  # ======================= save participants & error handler =======================
  - component: text-file-save-participant
    name: participate
    kind: function
    summary: "TextFileSaveParticipant.participate: runs participants one after another until the token is canceled; errors are logged, a participant's CancellationError (token not canceled) cancels the save."
    sources: ["src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:35-93"]
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        reason: {type: string, enum: [explicit, auto, focus-change, window-change], default: explicit}
        content: {type: string, default: ""}
        token: {type: object, properties: {canceled: {type: boolean, default: false}}}
    response: {type: object, properties: {participated: {type: integer}}}
    errors:
      - {code: canceled, status: 0, retryable: false}
    behavior:
      - set: {vars.bubble: false, vars.count: 0}
      - if: "has(input.token) && input.token.canceled"
        then:
          - title: Save already canceled, no participant runs
            source: "src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:63-66"
            return: {participated: 0}
      - foreach: "= state.participants"
        as: participant
        steps:
          - title: Run one participant, racing the cancellation token
            source: "src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:68-70"
            call: "= vars.participant"
            targets: [ext-host-save-participant.participate, format-on-save-participant.participate]
            input: {resource: "= input.resource", reason: "= input.reason", content: "= input.content"}
            as: ran
            on_error: continue
          - if: "!vars.ran.ok && vars.ran.error.code == 'canceled'"
            then:
              - title: The participant asked to cancel the save
                source: "src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:71-77"
                set: {vars.bubble: true}
              - break: true
          - set: {vars.count: "= vars.count + 1"}
      - if: "vars.bubble"
        then:
          - title: Bubble the cancellation to the model's save
            source: "src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:89-91"
            fail: {code: canceled, message: Canceled}
      - return: {participated: "= vars.count"}

  - component: text-file-save-error-handler
    name: constructor
    kind: function
    summary: "TextFileSaveErrorHandler constructor: installs itself as textFileService.files.saveErrorHandler and listens to save/revert to close messages."
    sources: ["src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:51-77"]
    request: {type: object}
    response: {type: object, properties: {installed: {type: boolean}}}
    behavior:
      - set: {state.installed: true}
      - return: {installed: true}

  - component: text-file-save-error-handler
    name: on-save-error
    kind: function
    summary: "TextFileSaveErrorHandler.onSaveError: a newer file on disk shows the save conflict message (Compare / Overwrite); write-locked, permission denied and other errors show Retry/Unlock/Retry as Sudo plus Save As and Revert."
    sources: ["src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:104-190"]
    request:
      type: object
      required: [resource, error_code]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        error_code: {type: string, examples: [file-modified-since]}
        unlock: {type: boolean, default: false}
    response: {type: object, properties: {kind: {type: string}, primary: {type: array, items: {type: string}}, secondary: {type: array, items: {type: string}}, shown: {type: boolean}}}
    behavior:
      - if: "input.error_code == 'file-modified-since'"
        then:
          - if: "state.active_conflict_resolution_resource == input.resource"
            then:
              - if: "state.learn_more_ignored"
                then:
                  - title: Conflict help was dismissed for good
                    source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:116-118"
                    return: {kind: none, primary: [], secondary: [], shown: false}
              - title: Saved again from the conflict editor, show the conflict editor help
                source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:115-124"
                set: {vars.msg: {kind: conflict-editor-help, primary: [learn-more], secondary: [do-not-show-again], shown: true}}
            else:
              - title: Dirty write prevention, offer Compare and Overwrite
                source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:127-135"
                set: {vars.msg: {kind: stale-save-error, primary: [compare, overwrite], secondary: [configure], shown: true}}
        else:
          - set:
              vars.locked: "= input.error_code == 'file-write-locked'"
              vars.denied: "= input.error_code == 'file-permission-denied'"
              vars.can_elevate: "= input.resource.startsWith('file:')"
          - set:
              vars.tried_unlock: "= vars.locked && has(input.unlock) && input.unlock"
          - title: Pick the first action (save elevated, unlock or retry), then Save As and Revert
            source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:140-165"
            set:
              vars.msg:
                kind: "= vars.locked ? (vars.tried_unlock && vars.can_elevate ? 'readonly-save-error-sudo' : 'readonly-save-error') : (vars.can_elevate && vars.denied ? 'permission-denied-save-error-sudo' : 'generic-save-error')"
                primary: "= [vars.can_elevate && (vars.denied || vars.tried_unlock) ? 'save-elevated' : (vars.locked ? 'unlock' : 'retry'), 'save-as', 'revert']"
                secondary: []
                shown: true
      - title: Show the error notification (one per model)
        source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:180-189"
        call: notification-service.notify
        input: {severity: error, message: "= vars.msg.kind", actions: "= vars.msg.primary"}
      - set:
          state.messages: "= merge(state.messages, {input.resource: vars.msg})"
      - return: "= vars.msg"

  - component: text-file-save-error-handler
    name: on-file-saved-or-reverted
    kind: event
    subscribe: [text-file-models.on-did-save, text-file-models.on-did-revert]
    summary: "Closes the save error notification of a file once it is saved or reverted."
    sources: ["src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:95-101"]
    request: FilesResourceRequest
    response: {type: object, properties: {closed: {type: boolean}}}
    behavior:
      - if: "!(input.resource in state.messages)"
        then: [{return: {closed: false}}]
      - title: Close and forget the message
        source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:96-100"
        set: {state.messages: "= omit(state.messages, input.resource)"}
      - return: {closed: true}

  - component: text-file-save-error-handler
    name: run-notification-action
    kind: function
    summary: "The actions offered by the save error notification: Compare, Overwrite, Retry, Unlock, Retry as Sudo, Save As and Revert, each running on the failed model."
    sources: ["src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:238-395"]
    request:
      type: object
      required: [resource, action]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        action: {type: string, enum: [compare, overwrite, retry, unlock, save-elevated, save-as, revert], default: overwrite}
    response: {type: object, properties: {action: {type: string}, saved: {type: boolean}}}
    behavior:
      - if: "input.action == 'compare'"
        then:
          - title: Compare opens a diff of the file on disk (conflictResolution scheme) against the model
            source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:250-270"
            call: editor-service.open-editor
            input: {resource: "= input.resource", original: "= 'conflictResolution:' + input.resource", options: {pinned: true}}
          - set: {state.active_conflict_resolution_resource: "= input.resource"}
          - return: {action: compare, saved: false}
      - if: "input.action == 'revert'"
        then:
          - title: Revert the model
            source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:319-323"
            call: text-file-models.revert
            input: {resource: "= input.resource"}
          - return: {action: revert, saved: false}
      - if: "input.action == 'save-as'"
        then:
          - title: Save As through the editor service
            source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:335-362"
            call: text-file-service.save-as
            input: {source: "= input.resource"}
            as: saveas
          - return: {action: save-as, saved: "= vars.saveas.value.saved"}
      - title: Overwrite ignores the modified-since check; unlock and elevated retry with those flags; retry saves again
        source: "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:381-395"
        call: text-file-models.save
        input:
          resource: "= input.resource"
          options: {reason: explicit, ignore_modified_since: "= input.action == 'overwrite'", write_unlock: "= input.action == 'unlock'", write_elevated: "= input.action == 'save-elevated'"}
        as: resaved
      - return: {action: "= input.action", saved: "= vars.resaved.value.saved"}

  # ======================= trackers & indicators =======================
  - component: text-file-editor-tracker
    name: on-did-change-dirty
    kind: event
    subscribe: [text-file-models.on-did-change-dirty]
    summary: "Queues a dirty text file on the RunOnceWorker (800 ms) that opens dirty files not yet in an editor."
    sources: ["src/vs/workbench/contrib/files/browser/editors/textFileEditorTracker.ts:44-46"]
    request: {type: object, properties: {resource: {type: string}, dirty: {type: boolean}}}
    behavior:
      - if: "!input.dirty"
        then: [{return: {queued: false}}]
      - title: RunOnceWorker delay of 800 ms
        source: "src/vs/workbench/contrib/files/browser/editors/textFileEditorTracker.ts:57-61"
        emit: text-file-editor-tracker.ensure-dirty-text-files-are-opened
        after_ms: 800
        input: {resource: "= input.resource"}
      - return: {queued: true}

  - component: text-file-editor-tracker
    name: ensure-dirty-text-files-are-opened
    kind: function
    summary: "Opens still-dirty files (not pending save, not auto saved after a short delay unless in error) as inactive pinned editors."
    sources: ["src/vs/workbench/contrib/files/browser/editors/textFileEditorTracker.ts:63-107"]
    request: FilesResourceRequest
    response: {type: object, properties: {opened: {type: boolean}}}
    behavior:
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: lookup
      - if: "!vars.lookup.value.exists || !vars.lookup.value.model.dirty"
        then:
          - title: Must still be dirty
            source: "src/vs/workbench/contrib/files/browser/editors/textFileEditorTracker.ts:65-67"
            return: {opened: false}
      - if: "!(has(vars.lookup.value.model.error) && vars.lookup.value.model.error) && config['files-auto-save'] == 'afterDelay' && config['files-auto-save-delay'] <= 1000"
        then:
          - title: Short auto save delay will save it, leave it alone
            source: "src/vs/workbench/contrib/files/browser/editors/textFileEditorTracker.ts:74-79"
            return: {opened: false}
      - title: Open as an inactive, pinned editor preserving focus
        source: "src/vs/workbench/contrib/files/browser/editors/textFileEditorTracker.ts:97-106"
        call: editor-service.open-editor
        input: {resource: "= input.resource", options: {inactive: true, pinned: true, preserve_focus: true}}
      - return: {opened: true}

  - component: dirty-files-indicator
    name: on-did-change-dirty
    kind: event
    subscribe: [working-copy-service.on-did-change-dirty]
    summary: "Updates the explorer badge with the dirty count, except when a file got dirty and will be auto saved after a short delay."
    sources: ["src/vs/workbench/contrib/files/common/dirtyFilesIndicator.ts:41-50"]
    request: {type: object, properties: {resource: {type: string}, dirty: {type: boolean}}}
    behavior:
      - if: "input.dirty && config['files-auto-save'] == 'afterDelay' && config['files-auto-save-delay'] <= 1000"
        then:
          - title: Short auto save delay, do not indicate dirty
            source: "src/vs/workbench/contrib/files/common/dirtyFilesIndicator.ts:43-45"
            return: {badge: "= state.badge"}
      - if: "!input.dirty && state.last_known_dirty_count == 0"
        then: [{return: {badge: "= state.badge"}}]
      - call: working-copy-service.dirty-count
        as: count
      - title: Show or clear the dirty count badge on the Explorer
        source: "src/vs/workbench/contrib/files/common/dirtyFilesIndicator.ts:52-66"
        set: {state.badge: "= vars.count.value.count", state.last_known_dirty_count: "= vars.count.value.count"}
      - return: {badge: "= state.badge"}

  - component: dirty-files-indicator
    name: constructor
    kind: function
    summary: "DirtyFilesIndicator constructor: computes the initial badge."
    sources: ["src/vs/workbench/contrib/files/common/dirtyFilesIndicator.ts:23-33"]
    request: {type: object}
    behavior:
      - call: working-copy-service.dirty-count
        as: count
      - set: {state.badge: "= vars.count.value.count", state.last_known_dirty_count: "= vars.count.value.count"}
      - return: {badge: "= state.badge"}

  # ======================= working copy service =======================
  - component: working-copy-service
    name: register-working-copy
    kind: function
    summary: "WorkingCopyService.registerWorkingCopy: adds the working copy and relays its content, dirty and save events."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:183-228"]
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/util.ts"]}, type_id: {type: string, default: ""}}}
    errors:
      - {code: working-copy-already-registered, status: 0, retryable: false, summary: "Cannot register more than one working copy with the same resource and type."}
    behavior:
      - set: {vars.key: "= input.resource + '#' + input.type_id"}
      - if: "vars.key in state.working_copies"
        then:
          - title: Same resource and type registered twice
            source: "src/vs/workbench/services/workingCopy/common/workingCopyService.ts:186-190"
            fail: {code: working-copy-already-registered, message: "= 'Cannot register more than one working copy with the same resource ' + input.resource + ' and type .'"}
      - set: {state.working_copies: "= merge(state.working_copies, {vars.key: {'resource': input.resource, 'type_id': input.type_id}})"}
      - return: {registered: true}

  - component: working-copy-service
    name: modified-working-copies
    kind: function
    summary: "IWorkingCopyService.modifiedWorkingCopies; text file models are the working copies this area models."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:358-366"]
    request: {type: object}
    response: {type: object, properties: {resources: {type: array, items: {type: string}}}}
    behavior:
      - call: text-file-models.list-modified
        as: modified
      - return: {resources: "= vars.modified.value.resources"}

  - component: working-copy-service
    name: dirty-count
    kind: function
    summary: "IWorkingCopyService.dirtyCount."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:330-341"]
    request: {type: object}
    response: {type: object, properties: {count: {type: integer}}}
    behavior:
      - call: text-file-models.list-modified
        as: modified
      - return: {count: "= size(vars.modified.value.resources)"}

  - component: working-copy-service
    name: relay-did-change-dirty
    kind: event
    subscribe: [text-file-models.on-did-change-dirty]
    summary: "Relays a working copy's onDidChangeDirty as IWorkingCopyService.onDidChangeDirty."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:202"]
    request: {type: object, properties: {resource: {type: string}, dirty: {type: boolean}}}
    behavior:
      - publish: working-copy-service.on-did-change-dirty
        input: "= input"
        delivery: sync
  - component: working-copy-service
    name: relay-did-change-content
    kind: event
    subscribe: [text-file-models.on-did-change-content]
    summary: "Relays a working copy's onDidChangeContent."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:201"]
    request: {type: object, properties: {resource: {type: string}, version_id: {type: integer}}}
    behavior:
      - publish: working-copy-service.on-did-change-content
        input: "= input"
        delivery: sync
  - component: working-copy-service
    name: relay-did-save
    kind: event
    subscribe: [text-file-models.on-did-save]
    summary: "Relays a working copy's onDidSave."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:203"]
    request: {type: object, properties: {resource: {type: string}, reason: {type: string}, size: {type: integer}, mtime: {type: integer}}}
    behavior:
      - publish: working-copy-service.on-did-save
        input: "= input"
        delivery: sync
  - {component: working-copy-service, name: on-did-change-dirty, kind: event, summary: "IWorkingCopyService.onDidChangeDirty (editor auto save, backup tracker and dirty indicator listen).", sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:202"], request: {type: object, properties: {resource: {type: string}, dirty: {type: boolean}}}}
  - {component: working-copy-service, name: on-did-change-content, kind: event, summary: "IWorkingCopyService.onDidChangeContent.", sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:201"], request: {type: object, properties: {resource: {type: string}, version_id: {type: integer}}}}
  - {component: working-copy-service, name: on-did-save, kind: event, summary: "IWorkingCopyService.onDidSave.", sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:203"], request: {type: object, properties: {resource: {type: string}, reason: {type: string}, size: {type: integer}, mtime: {type: integer}}}}

  # ======================= working copy file service =======================
  - component: working-copy-file-service
    name: move
    kind: function
    summary: "WorkingCopyFileService.move (doMoveOrCopy): validate, participants, will-run event, soft-revert dirty source and target, move through the file service, then did-run (or did-fail) event."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:390-447"]
    request:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              source: {type: string, examples: ["file:///work/app/src/util.ts"]}
              target: {type: string, examples: ["file:///work/app/src/math.ts"]}
        overwrite: {type: boolean, default: false}
    response: {type: object, properties: {moved: {type: integer}}}
    errors:
      - {code: file-not-found, status: 0, retryable: false}
      - {code: file-move-conflict, status: 0, retryable: false}
    behavior:
      - foreach: "= input.files"
        as: f
        steps:
          - title: Validate the move before starting
            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:401-407"
            call: file-service.can-move
            input: {source: "= vars.f.source", target: "= vars.f.target", overwrite: "= has(input.overwrite) && input.overwrite"}
            as: can
          - if: "!vars.can.value.ok"
            then: [{fail: "= {'code': vars.can.value.error_code, 'message': 'cannot move'}"}]
      - title: Run file operation participants
        source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:409-411"
        call: working-copy-file-operation-participant.participate
        input: {operation: move, files: "= input.files"}
      - publish: working-copy-file-service.on-will-run-working-copy-file-operation
        input: {operation: move, files: "= input.files"}
        delivery: sync
      - foreach: "= input.files"
        as: f
        steps:
          - foreach: "= [vars.f.source, vars.f.target]"
            as: r
            steps:
              - call: text-file-models.get
                input: {resource: "= vars.r"}
                as: wc
              - if: "vars.f.source != vars.f.target && vars.wc.value.exists && vars.wc.value.model.dirty"
                then:
                  - title: Soft-revert dirty working copies of source and target
                    source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:419-427"
                    call: text-file-models.revert
                    input: {resource: "= vars.r", options: {soft: true}}
          - title: Move on disk
            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:429-434"
            call: file-service.move
            input: {source: "= vars.f.source", target: "= vars.f.target", overwrite: "= has(input.overwrite) && input.overwrite"}
            on_error:
              - title: Fire the fail event and rethrow
                source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:436-441"
                publish: working-copy-file-service.on-did-fail-working-copy-file-operation
                input: {operation: move, files: "= input.files"}
                delivery: sync
              - fail: "= error"
      - publish: working-copy-file-service.on-did-run-working-copy-file-operation
        input: {operation: move, files: "= input.files"}
        delivery: sync
      - return: {moved: "= size(input.files)"}

  - component: working-copy-file-service
    name: delete
    kind: function
    summary: "WorkingCopyFileService.delete: validate, participants, will-run event, soft-revert dirty working copies, delete through the file service, did-run or did-fail."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:449-497"]
    request:
      type: object
      required: [resources]
      properties:
        resources: {type: array, items: {type: string}, default: ["file:///work/app/README.md"]}
        use_trash: {type: boolean, default: true}
        recursive: {type: boolean, default: true}
    response: {type: object, properties: {deleted: {type: integer}}}
    errors:
      - {code: file-not-found, status: 0, retryable: false}
    behavior:
      - foreach: "= input.resources"
        as: r
        steps:
          - title: Validate the delete before starting
            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:451-457"
            call: file-service.can-delete
            input: {resource: "= vars.r", use_trash: "= !has(input.use_trash) || input.use_trash", recursive: "= !has(input.recursive) || input.recursive"}
            as: can
          - if: "!vars.can.value.ok"
            then: [{fail: "= {'code': vars.can.value.error_code, 'message': 'cannot delete'}"}]
      - call: working-copy-file-operation-participant.participate
        input: {operation: delete, files: "= input.resources.map(r, {'target': r})"}
      - publish: working-copy-file-service.on-will-run-working-copy-file-operation
        input: {operation: delete, files: "= input.resources.map(r, {'target': r})"}
        delivery: sync
      - foreach: "= input.resources"
        as: r
        steps:
          - call: text-file-models.get
            input: {resource: "= vars.r"}
            as: wc
          - if: "vars.wc.value.exists && vars.wc.value.model.dirty"
            then:
              - title: Soft-revert dirty working copies so their editors can close
                source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:466-472"
                call: text-file-models.revert
                input: {resource: "= vars.r", options: {soft: true}}
          - title: Delete on disk (trash or permanent)
            source: "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:474-478"
            call: file-service.del
            input: {resource: "= vars.r", use_trash: "= !has(input.use_trash) || input.use_trash", recursive: "= !has(input.recursive) || input.recursive"}
            on_error:
              - publish: working-copy-file-service.on-did-fail-working-copy-file-operation
                input: {operation: delete, files: "= input.resources.map(r, {'target': r})"}
                delivery: sync
              - fail: "= error"
      - publish: working-copy-file-service.on-did-run-working-copy-file-operation
        input: {operation: delete, files: "= input.resources.map(r, {'target': r})"}
        delivery: sync
      - return: {deleted: "= size(input.resources)"}

  - component: working-copy-file-service
    name: create
    kind: function
    summary: "WorkingCopyFileService.create (doCreateFileOrFolder): validate, participants, will-run event, create through the file service, did-run or did-fail."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:346-388"]
    request:
      type: object
      properties:
        operation: {type: string, default: create}
        files: {type: array, items: {type: object, properties: {target: {type: string, examples: ["file:///work/app/src/new.ts"]}}}}
        overwrite: {type: boolean, default: false}
