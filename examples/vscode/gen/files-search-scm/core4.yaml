interfaces:
  # ======================= text-file-service =======================
  - component: text-file-service
    name: save
    kind: function
    summary: "ITextFileService.save: untitled resources go through save as; file resources save their text file model, returning the resource when the model ends up saved."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts:351-385"]
    request: FilesSaveRequest
    response: FilesSaveResult
    behavior:
      - if: "input.resource.startsWith('untitled:')"
        then:
          - title: Untitled resource asks for a target and saves as
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:354-375"
            call: text-file-service.save-as
            input: {source: "= input.resource"}
            as: saveas
          - return: {saved: "= vars.saveas.value.saved", resource: "= has(vars.saveas.value.resource) ? vars.saveas.value.resource : ''"}
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: lookup
      - if: "!vars.lookup.value.exists"
        then:
          - title: No text file model for the resource, nothing to save
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:379-384"
            return: {saved: false, resource: "", skipped: no-model}
      - title: Save the text file model
        source: "src/vs/workbench/services/textfile/browser/textFileService.ts:379-381"
        call: text-file-models.save
        input: {resource: "= input.resource", options: "= has(input.options) ? input.options : {}"}
        as: saved
      - return: "= vars.saved.value.saved ? merge(vars.saved.value, {'resource': input.resource}) : merge(vars.saved.value, {'resource': ''})"

  - component: text-file-service
    name: save-as
    kind: function
    summary: "ITextFileService.saveAs: pick a target if none, save in place when source equals target, otherwise copy the source contents into the target model and save it."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts:387-434", "src/vs/workbench/services/textfile/browser/textFileService.ts:436-498"]
    request:
      type: object
      required: [source]
      properties:
        source: {type: string, examples: ["file:///work/app/src/main.ts"]}
        target: {type: [string, "null"], default: null}
        options: {$ref: FilesSaveOptions}
    response: FilesSaveResult
    behavior:
      - set: {vars.target: "= has(input.target) && input.target != null ? input.target : ''"}
      - if: "vars.target == ''"
        then:
          - title: Ask the user for a target
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:389-392"
            call: file-dialog-service.pick-file-to-save
            input: {default_uri: "= input.source"}
            as: pick
          - set: {vars.target: "= has(vars.pick.value.resource) ? vars.pick.value.resource : ''"}
      - if: "vars.target == ''"
        then:
          - title: User canceled the dialog
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:394-396"
            return: {saved: false, skipped: canceled}
      - if: "vars.target == input.source"
        then:
          - title: Same target, force a save of the model
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:409-411"
            call: text-file-models.save
            input: {resource: "= input.source", options: {reason: explicit, force: true}}
            as: same
          - return: {saved: "= vars.same.value.saved", resource: "= input.source"}
      - call: text-file-models.get
        input: {resource: "= input.source"}
        as: src
      - if: "!vars.src.value.exists"
        then:
          - title: Source model cannot be resolved
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:436-460"
            return: {saved: false, skipped: no-model}
      - title: Resolve the target model with the source contents (dirty) and save it
        source: "src/vs/workbench/services/textfile/browser/textFileService.ts:500-626"
        call: text-file-models.resolve
        input: {resource: "= vars.target", contents: "= vars.src.value.model.value"}
      - call: text-file-models.save
        input: {resource: "= vars.target", options: {reason: explicit, force: true}}
        as: tgt
      - return: {saved: "= vars.tgt.value.saved", resource: "= vars.target"}

  - component: text-file-service
    name: revert
    kind: function
    summary: "ITextFileService.revert: reverts a file model only when it is dirty or the revert is forced."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts:735-752"]
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        options: {type: object, properties: {soft: {type: boolean, default: false}, force: {type: boolean, default: false}}}
    response: {type: object, properties: {reverted: {type: boolean}}}
    behavior:
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: lookup
      - set: {vars.force: "= has(input.options) && has(input.options.force) && input.options.force"}
      - if: "!vars.lookup.value.exists || !(vars.lookup.value.model.dirty || vars.force)"
        then:
          - title: Nothing to revert (no model, or not dirty and not forced)
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:746-750"
            return: {reverted: false}
      - call: text-file-models.revert
        input: {resource: "= input.resource", options: "= has(input.options) ? input.options : {}"}
      - return: {reverted: true}

  - component: text-file-service
    name: is-dirty
    kind: function
    summary: "ITextFileService.isDirty: asks the resource's model; false without a model."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts:758-765"]
    request: FilesResourceRequest
    response: {type: object, properties: {dirty: {type: boolean}}}
    behavior:
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: lookup
      - return: {dirty: "= vars.lookup.value.exists && vars.lookup.value.model.dirty"}

  - component: text-file-service
    name: read
    kind: function
    summary: "ITextFileService.read/readStream: reads through the file service and decodes; a binary stream is refused when text only is accepted."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts:181-251"]
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        accept_text_only: {type: boolean, default: true}
        etag: {type: string}
    response: {type: object, properties: {value: {type: string}, mtime: {type: integer}, size: {type: integer}, etag: {type: string}, encoding: {type: string}}}
    errors:
      - {code: file-is-binary, status: 0, retryable: false, summary: "TextFileOperationResult.FILE_IS_BINARY"}
      - {code: file-not-found, status: 0, retryable: false}
      - {code: file-not-modified-since, status: 0, retryable: false}
    behavior:
      - title: Read the raw content from the file service
        source: "src/vs/workbench/services/textfile/browser/textFileService.ts:213-223"
        call: file-service.read-file
        input: {resource: "= input.resource", etag: "= has(input.etag) ? input.etag : ''"}
        as: raw
      - title: Decode the stream; the encoding library flags binary content
        source: "src/vs/workbench/services/textfile/browser/textFileService.ts:225-250"
        choice: decode
        default: text
        options:
          text:
            - return: {value: "= vars.raw.value.value", mtime: "= vars.raw.value.mtime", size: "= vars.raw.value.size", etag: "= vars.raw.value.etag", encoding: utf8}
          binary:
            - if: "!has(input.accept_text_only) || input.accept_text_only"
              then:
                - title: File seems to be binary and cannot be opened as text
                  source: "src/vs/workbench/services/textfile/browser/textFileService.ts:241-243"
                  fail: {code: file-is-binary, message: "File seems to be binary and cannot be opened as text"}
            - return: {value: "", mtime: "= vars.raw.value.mtime", size: "= vars.raw.value.size", etag: "= vars.raw.value.etag", encoding: binary}

  - component: text-file-service
    name: write
    kind: function
    summary: "ITextFileService.write: encodes and writes through the file service, or the elevated file service when asked."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts:266-274"]
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        value: {type: string}
        mtime: {type: integer}
        etag: {type: string}
        unlock: {type: boolean, default: false}
        write_elevated: {type: boolean, default: false}
    response: FilesFileStat
    behavior:
      - if: "has(input.write_elevated) && input.write_elevated"
        then:
          - title: Write elevated (sudo / admin)
            source: "src/vs/workbench/services/textfile/browser/textFileService.ts:269-271"
            call: elevated-file-service.write-file-elevated
            input: {resource: "= input.resource", value: "= input.value"}
            as: elevated
          - return: "= vars.elevated.value"
      - title: Write through the file service with the mtime/etag guard
        source: "src/vs/workbench/services/textfile/browser/textFileService.ts:273"
        call: file-service.write-file
        input: {resource: "= input.resource", content: "= input.value", mtime: "= input.mtime", etag: "= input.etag", unlock: "= has(input.unlock) && input.unlock"}
        as: written
      - return: "= vars.written.value"

  - component: text-file-service
    name: create
    kind: function
    summary: "ITextFileService.create: encodes contents and creates the files through the working copy file service."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts:253-264"]
    request:
      type: object
      properties:
        resource: {type: string, examples: ["file:///work/app/src/new.ts"]}
        value: {type: string, default: ""}
        overwrite: {type: boolean, default: false}
    response: {type: object, properties: {created: {type: boolean}}}
    behavior:
      - call: working-copy-file-service.create
        input: {operation: create, files: [{target: "= input.resource"}], overwrite: "= has(input.overwrite) && input.overwrite"}
      - return: {created: true}

  # ======================= text-file-models (anchor) =======================
  - component: text-file-models
    name: get
    kind: function
    summary: "TextFileEditorModelManager.get: the model for a resource, if one is open."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:342-344"]
    request: FilesResourceRequest
    response: {type: object, properties: {exists: {type: boolean}, model: {$ref: FilesTextFileModel}}}
    behavior:
      - return: "= input.resource in state.models ? {'exists': true, 'model': state.models[input.resource]} : {'exists': false}"

  - component: text-file-models
    name: list-modified
    kind: function
    summary: "The dirty text file models (the text file part of IWorkingCopyService.modifiedWorkingCopies / dirtyCount)."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:330-366"]
    request: {type: object}
    response: {type: object, properties: {resources: {type: array, items: {type: string}}}}
    behavior:
      - return: {resources: "= state.models.filter(r, state.models[r].dirty)"}

  - component: text-file-models
    name: resolve
    kind: function
    summary: "TextFileEditorModelManager.resolve + TextFileEditorModel.resolve: create or reload the model from given contents, a backup (new models only) or the file; dirty models are never reloaded from the file."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:365-487", "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:295-339", "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:527-594"]
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/util.ts"]}
        contents: {type: [string, "null"], default: null}
        reload: {type: boolean, default: false}
        force_read_from_file: {type: boolean, default: false}
        allow_binary: {type: boolean, default: false}
    response: {$ref: FilesTextFileModel}
    errors:
      - {code: file-not-found, status: 0, retryable: false}
      - {code: file-is-binary, status: 0, retryable: false}
    behavior:
      - set:
          vars.exists: "= input.resource in state.models"
          vars.lang: "= input.resource.endsWith('.ts') ? 'typescript' : (input.resource.endsWith('.md') ? 'markdown' : (input.resource.endsWith('.json') ? 'json' : 'plaintext'))"
      - if: "vars.exists && !(has(input.contents) && input.contents != null) && !(has(input.reload) && input.reload) && !(has(input.force_read_from_file) && input.force_read_from_file)"
        then:
          - title: Model exists and no reload requested
            source: "src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:420-423"
            return: "= state.models[input.resource]"
      - if: "(has(input.contents) && input.contents != null)"
        then:
          - title: Contents provided, resolve from buffer (marks the model dirty)
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:323-326"
            set:
              state.models: "= merge(state.models, {input.resource: vars.exists ? {'value': input.contents, 'version_id': state.models[input.resource].version_id + 1, 'dirty': true} : {'value': input.contents, 'version_id': 1, 'saved_version_id': 0, 'dirty': true, 'language_id': vars.lang, 'mtime': 0}})"
          - when: "!vars.exists"
            title: A first load creates the text model (doCreateTextModel -> IModelService.createModel)
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:656-667"
            call: model-service.create-model
            input: {resource: "= input.resource", value: "= state.models[input.resource].value", language_id: "= state.models[input.resource].language_id"}
            on_error:
              - if: "error.code != 'model-already-exists'"
                then: [{fail: "= error"}]
          - publish: text-file-models.on-did-change-dirty
            input: {resource: "= input.resource", dirty: true}
            delivery: sync
          - return: "= state.models[input.resource]"
      - if: "vars.exists && state.models[input.resource].dirty"
        then:
          - title: Dirty models are never resolved from the file (data loss protection)
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:305-312"
            return: "= state.models[input.resource]"
      - if: "!vars.exists"
        then:
          - title: New model, try to resolve from a backup first
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:328-334"
            call: native-working-copy-backup-service.resolve
            input: {resource: "= input.resource"}
            as: backup
          - if: "vars.backup.value.found"
            then:
              - title: Restored from backup, the model starts dirty
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:473-525"
                set:
                  state.models: "= merge(state.models, {input.resource: {'value': vars.backup.value.content, 'version_id': 1, 'saved_version_id': 0, 'dirty': true, 'language_id': vars.lang, 'mtime': vars.backup.value.mtime, 'orphaned': vars.backup.value.orphaned}})"
              - when: "!vars.exists"
                title: A first load creates the text model (doCreateTextModel -> IModelService.createModel)
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:656-667"
                call: model-service.create-model
                input: {resource: "= input.resource", value: "= state.models[input.resource].value", language_id: "= state.models[input.resource].language_id"}
                on_error:
                  - if: "error.code != 'model-already-exists'"
                    then: [{fail: "= error"}]
              - call: working-copy-service.register-working-copy
                input: {resource: "= input.resource", type_id: ""}
              - publish: text-file-models.on-did-change-dirty
                input: {resource: "= input.resource", dirty: true}
                delivery: sync
              - return: "= state.models[input.resource]"
      - title: Resolve from the file (etag disabled when forced)
        source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:531-555"
        call: text-file-service.read
        input:
          resource: "= input.resource"
          accept_text_only: "= !(vars.exists || (has(input.allow_binary) && input.allow_binary))"
          etag: "= (has(input.force_read_from_file) && input.force_read_from_file) || !vars.exists ? '' : (has(state.models[input.resource].etag) ? state.models[input.resource].etag : '')"
        as: content
        on_error:
          - when: "vars.exists"
            set:
              state.models: "= merge(state.models, {input.resource: {'orphaned': error.code == 'file-not-found'}})"
          - if: "vars.exists && error.code == 'file-not-modified-since'"
            then:
              - title: Not modified since, keep the model
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:574-580"
                return: "= state.models[input.resource]"
          - if: "vars.exists && error.code == 'file-not-found' && !(has(input.force_read_from_file) && input.force_read_from_file)"
            then:
              - title: Deleted meanwhile; a resolved model keeps its content and becomes orphaned
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:582-588"
                return: "= state.models[input.resource]"
          - title: Bubble the error; a model created for this resolve is disposed
            source: "src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:464-476"
            fail: "= error"
      - set:
          state.models: "= merge(state.models, {input.resource: {'value': vars.content.value.value, 'version_id': vars.exists ? state.models[input.resource].version_id + 1 : 1, 'saved_version_id': vars.exists ? state.models[input.resource].version_id + 1 : 1, 'dirty': false, 'orphaned': false, 'conflict': false, 'error': false, 'language_id': vars.exists ? state.models[input.resource].language_id : vars.lang, 'mtime': vars.content.value.mtime, 'etag': vars.content.value.etag, 'size': vars.content.value.size}})"
      - when: "!vars.exists"
        title: A first load creates the text model (doCreateTextModel -> IModelService.createModel)
        source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:656-667"
        call: model-service.create-model
        input: {resource: "= input.resource", value: "= state.models[input.resource].value", language_id: "= state.models[input.resource].language_id"}
        on_error:
          - if: "error.code != 'model-already-exists'"
            then: [{fail: "= error"}]
      - if: "!vars.exists"
        then:
          - title: A new model registers as a working copy
            source: "src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:451-462"
            call: working-copy-service.register-working-copy
            input: {resource: "= input.resource", type_id: ""}
      - return: "= state.models[input.resource]"

  - component: text-file-models
    name: save
    kind: function
    summary: "TextFileEditorModel.save/doSave/doSaveSequential: guards (resolved, readonly, conflict/error on auto save, not dirty), save participants, write with mtime/etag, then save success (clean, saved event) or save error (dirty, error/conflict state, error handler)."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModel.ts:831-857", "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:859-938", "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:940-1047"]
    request: FilesSaveRequest
    response: FilesSaveResult
    behavior:
      - if: "!(input.resource in state.models)"
        then:
          - title: Only resolved models can be saved
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:832-834"
            return: {saved: false, skipped: not-resolved}
      - set:
          vars.m: "= state.models[input.resource]"
          vars.opts: "= has(input.options) ? input.options : {}"
      - set:
          vars.reason: "= has(vars.opts.reason) ? vars.opts.reason : 'explicit'"
          vars.force: "= has(vars.opts.force) && vars.opts.force"
          vars.skip_participants: "= has(vars.opts.skip_save_participants) && vars.opts.skip_save_participants"
          vars.ignore_mtime: "= has(vars.opts.ignore_modified_since) && vars.opts.ignore_modified_since"
      - if: "has(vars.m.readonly) && vars.m.readonly"
        then:
          - title: Readonly models are never saved
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:836-840"
            return: {saved: false, skipped: readonly}
      - if: "((has(vars.m.conflict) && vars.m.conflict) || (has(vars.m.error) && vars.m.error)) && vars.reason in ['auto', 'focus-change', 'window-change']"
        then:
          - title: Auto save is ignored while the model is in conflict or error
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:842-849"
            return: {saved: false, skipped: conflict-or-error}
      - if: "!vars.force && !vars.m.dirty"
        then:
          - title: Not dirty and not forced, nothing to write
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:888-895"
            return: {saved: true, skipped: not-dirty}
      - if: "!vars.skip_participants"
        then:
          - title: Run save participants (format on save, extension onWillSave)
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:946-990"
            call: text-file-save-participant.participate
            input: {resource: "= input.resource", reason: "= vars.reason", content: "= vars.m.value", token: {canceled: false}}
            as: participants
            on_error: continue
          - if: "!vars.participants.ok && vars.participants.error.code == 'canceled'"
            then:
              - title: A participant canceled the save; the model stays dirty
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:977-982"
                return: {saved: false, skipped: canceled}
      - set: {vars.m: "= state.models[input.resource]"}
      - title: Write the snapshot with the last resolved mtime; the etag is disabled when overwriting
        source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1027-1043"
        call: text-file-service.write
        input:
          resource: "= input.resource"
          value: "= vars.m.value"
          mtime: "= vars.m.mtime"
          etag: "= vars.ignore_mtime || config['files-save-conflict-resolution'] == 'overwriteFileOnDisk' ? '' : (has(vars.m.etag) ? vars.m.etag : string(vars.m.mtime))"
          unlock: "= has(vars.opts.write_unlock) && vars.opts.write_unlock"
          write_elevated: "= has(vars.opts.write_elevated) && vars.opts.write_elevated"
        as: write
        on_error:
          - title: Save error keeps the model dirty and flags error (and conflict for a newer file on disk)
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1070-1098"
            set:
              state.models: "= merge(state.models, {input.resource: {'dirty': true, 'error': true, 'conflict': error.code == 'file-modified-since'}})"
          - when: "!vars.m.dirty"
            publish: text-file-models.on-did-change-dirty
            input: {resource: "= input.resource", dirty: true}
            delivery: sync
          - call: text-file-save-error-handler.on-save-error
            input: {resource: "= input.resource", error_code: "= error.code", unlock: "= has(vars.opts.write_unlock) && vars.opts.write_unlock"}
          - publish: text-file-models.on-did-save-error
            input: {resource: "= input.resource", error_code: "= error.code"}
            delivery: sync
          - return: {saved: false, error_code: "= error.code"}
      - title: Save success clears dirty, error and conflict and remembers the new stat
        source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1049-1068"
        set:
          state.models: "= merge(state.models, {input.resource: {'dirty': false, 'error': false, 'conflict': false, 'orphaned': false, 'saved_version_id': vars.m.version_id, 'mtime': has(vars.write.value.mtime) ? vars.write.value.mtime : now, 'etag': has(vars.write.value.etag) ? vars.write.value.etag : string(now)}})"
      - when: "vars.m.dirty"
        publish: text-file-models.on-did-change-dirty
        input: {resource: "= input.resource", dirty: false}
        delivery: sync
      - publish: text-file-models.on-did-save
        input: {resource: "= input.resource", reason: "= vars.reason", size: "= size(vars.m.value)", mtime: "= state.models[input.resource].mtime"}
        delivery: sync
      - return: {saved: true}

  - component: text-file-models
    name: revert
    kind: function
    summary: "TextFileEditorModel.revert: clear dirty, re-read from the file unless soft; a deleted file is ignored, any other error restores the dirty state."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModel.ts:255-291"]
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        options: {type: object, properties: {soft: {type: boolean, default: false}}}
    response: {type: object, properties: {reverted: {type: boolean}}}
    errors:
      - {code: file-permission-denied, status: 0, retryable: false}
    behavior:
      - if: "!(input.resource in state.models)"
        then:
          - title: Only resolved models revert
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:256-258"
            return: {reverted: false}
      - set:
          vars.was_dirty: "= state.models[input.resource].dirty"
          vars.prev: "= state.models[input.resource]"
      - set:
          state.models: "= merge(state.models, {input.resource: {'dirty': false, 'conflict': false, 'error': false, 'saved_version_id': state.models[input.resource].version_id}})"
      - if: "!(has(input.options) && has(input.options.soft) && input.options.soft)"
        then:
          - title: Force a read from disk through the model manager
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:264-281"
            call: text-file-models.resolve
            input: {resource: "= input.resource", reload: true, force_read_from_file: true}
            as: reread
            on_error:
              - if: "error.code != 'file-not-found'"
                then:
                  - title: Revert failed, restore the dirty flags
                    source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:272-278"
                    set:
                      state.models: "= merge(state.models, {input.resource: {'dirty': vars.prev.dirty, 'saved_version_id': vars.prev.saved_version_id}})"
                  - fail: "= error"
      - publish: text-file-models.on-did-revert
        input: {resource: "= input.resource"}
        delivery: sync
      - when: "vars.was_dirty"
        publish: text-file-models.on-did-change-dirty
        input: {resource: "= input.resource", dirty: false}
        delivery: sync
      - return: {reverted: true}

  - component: text-file-models
    name: on-model-content-changed
    kind: event
    summary: "TextFileEditorModel.onModelContentChanged: every text model change bumps the version; reaching the saved alternative version clears dirty, otherwise the model becomes dirty. Called by the editor area's text model edits."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModel.ts:693-738"]
    request:
      type: object
      required: [resource, value]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        value: {type: string, examples: ["import { add } from './util';\nconsole.log(add(1, 3));\n"]}
        alternative_version_id: {type: [integer, "null"], default: null}
        is_undoing_or_redoing: {type: boolean, default: false}
    response: {type: object, properties: {version_id: {type: integer}, dirty: {type: boolean}}}
    behavior:
      - if: "!(input.resource in state.models)"
        then:
          - title: No resolved model listens to this text model
            source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:681-691"
            return: {version_id: 0, dirty: false}
      - set:
          vars.m: "= state.models[input.resource]"
          vars.back_to_saved: "= has(input.alternative_version_id) && input.alternative_version_id != null && input.alternative_version_id == state.models[input.resource].saved_version_id"
      - set:
          state.models: "= merge(state.models, {input.resource: {'value': input.value, 'version_id': vars.m.version_id + 1}})"
      - if: "!(has(vars.m.readonly) && vars.m.readonly)"
        then:
          - if: "vars.back_to_saved"
            then:
              - title: Undo reached the saved version, clear dirty
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:712-723"
                set:
                  state.models: "= merge(state.models, {input.resource: {'dirty': false}})"
              - when: "vars.m.dirty"
                publish: text-file-models.on-did-revert
                input: {resource: "= input.resource"}
                delivery: sync
              - when: "vars.m.dirty"
                publish: text-file-models.on-did-change-dirty
                input: {resource: "= input.resource", dirty: false}
                delivery: sync
            else:
              - title: Content changed, mark dirty
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:726-731"
                set:
                  state.models: "= merge(state.models, {input.resource: {'dirty': true}})"
              - when: "!vars.m.dirty"
                publish: text-file-models.on-did-change-dirty
                input: {resource: "= input.resource", dirty: true}
                delivery: sync
      - publish: text-file-models.on-did-change-content
        input: {resource: "= input.resource", version_id: "= vars.m.version_id + 1"}
        delivery: sync
      - return: {version_id: "= vars.m.version_id + 1", dirty: "= state.models[input.resource].dirty"}

  - component: text-file-models
    name: on-did-files-change
    kind: event
    summary: "File change events: the manager reloads non-dirty models on update/add (never dirty ones); a model whose file was deleted waits 100 ms and checks existence before turning orphaned."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:134-147", "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:158-201"]
    request:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
              type: {type: string, enum: [updated, added, deleted], default: updated}
    response: {type: object, properties: {reloaded: {type: array, items: {type: string}}, orphaned: {type: array, items: {type: string}}}}
    behavior:
      - set: {vars.reloaded: [], vars.orphaned: []}
      - foreach: "= input.changes"
        as: change
        steps:
          - if: "!(vars.change.resource in state.models)"
            then: [{continue: true}]
          - set: {vars.m: "= state.models[vars.change.resource]"}
          - if: "vars.change.type == 'deleted' && !(has(vars.m.orphaned) && vars.m.orphaned)"
            then:
              - title: Delete events can be faulty (network shares); wait 100 ms and check the file
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:181-195"
                wait: 100
              - call: file-service.exists
                input: {resource: "= vars.change.resource"}
                as: exists
              - if: "!vars.exists.value.exists"
                then:
                  - title: The file is really gone, the model turns orphaned
                    source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:203-208"
                    set:
                      state.models: "= merge(state.models, {vars.change.resource: {'orphaned': true}})"
                      vars.orphaned: "= vars.orphaned + [vars.change.resource]"
              - continue: true
          - if: "vars.change.type == 'added' && has(vars.m.orphaned) && vars.m.orphaned"
            then:
              - title: The orphaned model's file came back
                source: "src/vs/workbench/services/textfile/common/textFileEditorModel.ts:163-169"
                set:
                  state.models: "= merge(state.models, {vars.change.resource: {'orphaned': false}})"
          - if: "vars.m.dirty"
            then:
              - title: Never reload dirty models
                source: "src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:136-138"
                continue: true
          - if: "vars.change.type in ['updated', 'added']"
            then:
              - title: Queue a reload of the model (resource queue)
                source: "src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:182-198"
                call: text-file-models.resolve
                input: {resource: "= vars.change.resource", reload: true}
                on_error: continue
              - set: {vars.reloaded: "= vars.reloaded + [vars.change.resource]"}
      - return: {reloaded: "= vars.reloaded", orphaned: "= vars.orphaned"}

  - component: text-file-models
    name: backup
    kind: function
    summary: "TextFileEditorModel.backup: the snapshot content plus the last resolved stat as backup metadata."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModel.ts:229-250"]
    request: FilesResourceRequest
    response: {type: object, properties: {content: {type: string}, meta: {type: object}}}
    behavior:
      - if: "!(input.resource in state.models)"
        then: [{return: {content: "", meta: {}}}]
      - return:
          content: "= state.models[input.resource].value"
          meta: {mtime: "= state.models[input.resource].mtime", orphaned: "= has(state.models[input.resource].orphaned) && state.models[input.resource].orphaned"}

  - component: text-file-models
    name: find-matches
    kind: function
    summary: "Open editor models searched in memory for text search (SearchService.getOpenEditorResults); stops at maxResults + 1 matches and flags limitHit."
    sources: ["src/vs/workbench/services/search/common/searchService.ts:496-571"]
    request:
      type: object
      required: [pattern]
      properties:
        pattern: {type: string, examples: [add]}
        max_results: {type: integer, default: 20000}
    response: SearchComplete
    behavior:
      - set:
          vars.hits: "= state.models.filter(r, state.models[r].value.contains(input.pattern)).map(r, {'resource': r, 'matches': size(state.models[r].value.split(input.pattern)) - 1})"
      - set:
          vars.total: "= sum(vars.hits.map(h, h.matches))"
      - return: {results: "= vars.hits", limit_hit: "= vars.total >= input.max_results + 1"}

