  - {id: files-resolve, name: Open (resolve) a text file model, tags: [writes], entry: {caller: workbench, interface: text-file-models.resolve, input: {resource: "file:///work/app/src/util.ts"}}, sources: ["src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:365-377"]}
