  - {id: files-history-read, name: Local history entries of a file, entry: {caller: workbench, interface: native-working-copy-history-service.get-entries, input: {resource: "file:///work/app/src/main.ts"}}, sources: ["src/vs/workbench/services/workingCopy/common/workingCopyHistoryService.ts:752-770"]}
  - {id: files-explorer-delete, name: Delete from the explorer, entry: {caller: user, interface: file-actions.cmd-movefiletotrash, input: {command_id: moveFileToTrash, resource: "file:///work/app/README.md"}}, sources: ["src/vs/workbench/contrib/files/browser/fileActions.contribution.ts:64-75"]}
