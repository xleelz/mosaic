  - {id: files-model-get, name: Read a text file model, entry: {caller: workbench, interface: text-file-models.get, input: {resource: "file:///work/app/src/main.ts"}}, sources: ["src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:342-344"]}
