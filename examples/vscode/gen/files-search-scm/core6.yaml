interfaces:
  # ======================= backups =======================
  - component: native-working-copy-backup-service
    name: backup
    kind: function
    summary: "WorkingCopyBackupServiceImpl.backup: writes the backup with its version and metadata (skipped when the same version is already backed up)."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:236-294"]
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        content: {type: string}
        version_id: {type: integer}
        meta: {type: object}
    response: {type: object, properties: {stored: {type: boolean}}}
    behavior:
      - if: "input.resource in state.backups && has(input.version_id) && has(state.backups[input.resource].version_id) && state.backups[input.resource].version_id == input.version_id"
        then:
          - title: A backup of this version exists already
            source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:244-247"
            return: {stored: false}
      - title: Store the backup content and metadata
        source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:250-290"
        set:
          state.backups: "= merge(state.backups, {input.resource: {'content': has(input.content) ? input.content : '', 'version_id': has(input.version_id) ? input.version_id : 0, 'meta': has(input.meta) ? input.meta : {}, 'at': now}})"
      - return: {stored: true}

  - component: native-working-copy-backup-service
    name: has-backup
    kind: function
    summary: "hasBackupSync: whether a backup exists, optionally for a given version."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:226-234"]
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, version_id: {type: integer}}}
    response: {type: object, properties: {exists: {type: boolean}}}
    behavior:
      - return: {exists: "= input.resource in state.backups && (!has(input.version_id) || state.backups[input.resource].version_id == input.version_id)"}

  - component: native-working-copy-backup-service
    name: resolve
    kind: function
    summary: "WorkingCopyBackupService.resolve: the backup content and metadata of a working copy, if any."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:433-470"]
    request: FilesResourceRequest
    response: {type: object, properties: {found: {type: boolean}, content: {type: string}, mtime: {type: integer}, orphaned: {type: boolean}}}
    behavior:
      - if: "!(input.resource in state.backups)"
        then: [{return: {found: false}}]
      - set: {vars.b: "= state.backups[input.resource]"}
      - return:
          found: true
          content: "= vars.b.content"
          mtime: "= has(vars.b.meta.mtime) ? vars.b.meta.mtime : 0"
          orphaned: "= has(vars.b.meta.orphaned) && vars.b.meta.orphaned"

  - component: native-working-copy-backup-service
    name: discard-backup
    kind: function
    summary: "discardBackup: deletes one working copy's backup."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:560-562"]
    request: FilesResourceRequest
    response: {type: object, properties: {discarded: {type: boolean}}}
    behavior:
      - if: "!(input.resource in state.backups)"
        then: [{return: {discarded: false}}]
      - set: {state.backups: "= omit(state.backups, input.resource)"}
      - return: {discarded: true}

  - component: native-working-copy-backup-service
    name: discard-backups
    kind: function
    summary: "discardBackups: deletes all backups except the given ones."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:296-326"]
    request: {type: object, properties: {except: {type: array, items: {type: string}, default: []}}}
    response: {type: object, properties: {kept: {type: array, items: {type: string}}}}
    behavior:
      - set:
          state.backups: "= state.backups.transformMap(k, v, k in input.except, v)"
      - return: {kept: "= input.except.filter(k, k in state.backups)"}

  - component: native-working-copy-backup-service
    name: get-backups
    kind: function
    summary: "getBackups: identifiers of all stored backups."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:362-371"]
    request: {type: object}
    response: {type: object, properties: {resources: {type: array, items: {type: string}}}}
    behavior:
      - return: {resources: "= state.backups.filter(k, true)"}

  - component: native-working-copy-backup-tracker
    name: constructor
    kind: function
    summary: "WorkingCopyBackupTracker constructor: resolves the existing backups as unrestored until an editor handler restores them."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:343-354"]
    request: {type: object}
    behavior:
      - call: native-working-copy-backup-service.get-backups
        as: existing
      - set: {state.unrestored: "= vars.existing.value.resources", state.ready: true}
      - return: {unrestored: "= size(state.unrestored)"}

  - component: native-working-copy-backup-tracker
    name: on-did-change-dirty
    kind: event
    subscribe: [working-copy-service.on-did-change-dirty]
    summary: "WorkingCopyBackupTracker.onDidChangeDirty: a dirty working copy schedules a backup (1000 ms, or 2000 ms with a short auto save delay); a clean one discards its backup."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:135-146"]
    request: {type: object, properties: {resource: {type: string}, dirty: {type: boolean}}}
    behavior:
      - if: "input.dirty"
        then:
          - title: Schedule a backup; the delay depends on auto save
            source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:225-238"
            set: {state.scheduled: "= merge(state.scheduled, {input.resource: now})"}
          - emit: native-working-copy-backup-tracker.run-scheduled-backup
            after_ms: "= config['files-auto-save'] == 'afterDelay' && config['files-auto-save-delay'] <= 1000 ? 2000 : 1000"
            input: {resource: "= input.resource", scheduled_at: "= now"}
          - return: {scheduled: true}
      - title: No longer dirty, discard the backup
        source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:244-263"
        set: {state.scheduled: "= omit(state.scheduled, input.resource)"}
      - call: native-working-copy-backup-service.discard-backup
        input: {resource: "= input.resource"}
      - return: {scheduled: false}

  - component: native-working-copy-backup-tracker
    name: on-did-change-content
    kind: event
    subscribe: [working-copy-service.on-did-change-content]
    summary: "WorkingCopyBackupTracker.onDidChangeContent: bumps the content version and pushes the scheduled backup out while the user keeps typing."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:148-167"]
    request: {type: object, properties: {resource: {type: string}, version_id: {type: integer}}}
    behavior:
      - set:
          state.content_versions: "= merge(state.content_versions, {input.resource: (input.resource in state.content_versions ? state.content_versions[input.resource] : 0) + 1})"
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: wc
      - if: "vars.wc.value.exists && vars.wc.value.model.dirty"
        then:
          - title: Re-schedule the backup (debounce)
            source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:158-166"
            set: {state.scheduled: "= merge(state.scheduled, {input.resource: now})"}
          - emit: native-working-copy-backup-tracker.run-scheduled-backup
            after_ms: "= config['files-auto-save'] == 'afterDelay' && config['files-auto-save-delay'] <= 1000 ? 2000 : 1000"
            input: {resource: "= input.resource", scheduled_at: "= now"}

  - component: native-working-copy-backup-tracker
    name: run-scheduled-backup
    kind: function
    summary: "The scheduled backup timer: skipped when canceled by a newer schedule; backs up the working copy if it is still modified."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:169-223"]
    request: {type: object, required: [resource, scheduled_at], properties: {resource: {type: string}, scheduled_at: {type: integer}}}
    response: {type: object, properties: {backed_up: {type: boolean}}}
    behavior:
      - if: "!(input.resource in state.scheduled) || state.scheduled[input.resource] > input.scheduled_at"
        then:
          - title: Canceled by a newer schedule or a discard
            source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:180-183"
            return: {backed_up: false}
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: wc
      - if: "!(vars.wc.value.exists && vars.wc.value.model.dirty)"
        then: [{return: {backed_up: false}}]
      - call: text-file-models.backup
        input: {resource: "= input.resource"}
        as: snapshot
      - title: Store the backup with the content version
        source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:186-199"
        call: native-working-copy-backup-service.backup
        input:
          resource: "= input.resource"
          content: "= vars.snapshot.value.content"
          version_id: "= input.resource in state.content_versions ? state.content_versions[input.resource] : 0"
          meta: "= vars.snapshot.value.meta"
      - set: {state.scheduled: "= omit(state.scheduled, input.resource)"}
      - return: {backed_up: true}

  - component: native-working-copy-backup-tracker
    name: on-final-before-shutdown-decide
    kind: function
    summary: "NativeWorkingCopyBackupTracker.onFinalBeforeShutdown: without modified working copies discard backups; with auto save on save them first; then back up if hot exit applies to the shutdown reason, else ask Save / Don't Save / Cancel. Returns the veto."
    sources: ["src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:50-112"]
    request:
      type: object
      properties:
        reason: {type: string, enum: [close, quit, reload, load], default: quit}
    response: {type: object, properties: {veto: {type: boolean}, handled: {type: string}}}
    behavior:
      - call: working-copy-service.modified-working-copies
        as: modified
      - set: {vars.modified: "= vars.modified.value.resources"}
      - if: "size(vars.modified) == 0"
        then:
          - title: No modified working copies; discard backups except unrestored ones (folder window)
            source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:377-399"
            call: native-working-copy-backup-service.discard-backups
            input: {except: "= state.unrestored"}
          - return: {veto: false, handled: no-modified}
      - if: "config['files-auto-save'] != 'off'"
        then:
          - title: Auto save enabled, save all modified (non-untitled) working copies first
            source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:90-96"
            parallel: "= vars.modified"
            as: r
            steps:
              - call: text-file-models.save
                input: {resource: "= vars.r", options: {reason: auto, skip_save_participants: true}}
                on_error: continue
            join: {need: all}
          - call: working-copy-service.modified-working-copies
            as: remaining
          - if: "size(vars.remaining.value.resources) == 0"
            then:
              - title: Everything auto saved, no veto
                source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:106"
                call: native-working-copy-backup-service.discard-backups
                input: {except: "= state.unrestored"}
              - return: {veto: false, handled: auto-saved}
          - set: {vars.modified: "= vars.remaining.value.resources"}
      - title: Decide whether hot exit backs up for this shutdown reason
        source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:162-209"
        call: native-working-copy-backup-tracker.should-backup-before-shutdown
        input: {reason: "= input.reason", resources: "= vars.modified"}
        as: should
      - if: "size(vars.should.value.resources) > 0"
        then:
          - title: Back up every modified working copy unless a backup of its version exists
            source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:252-292"
            parallel: "= vars.should.value.resources"
            as: r
            steps:
              - call: native-working-copy-backup-service.has-backup
                input: {resource: "= vars.r", version_id: "= vars.r in state.content_versions ? state.content_versions[vars.r] : 0"}
                as: has
              - if: "!vars.has.value.exists"
                then:
                  - call: text-file-models.backup
                    input: {resource: "= vars.r"}
                    as: snap
                  - call: native-working-copy-backup-service.backup
                    input: {resource: "= vars.r", content: "= vars.snap.value.content", version_id: "= vars.r in state.content_versions ? state.content_versions[vars.r] : 0", meta: "= vars.snap.value.meta"}
            join: {need: all}
            as_result: backups
            on_insufficient: {code: backup-failed}
          - if: "vars.backups.received == size(vars.modified)"
            then:
              - title: All modified working copies are backed up, no veto (hot exit)
                source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:125-127"
                return: {veto: false, handled: backed-up}
      - title: No backup; confirm saving the remaining modified working copies
        source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:294-327"
        choice: confirm
        default: save
        options:
          save:
            - parallel: "= vars.modified"
              as: r
              steps:
                - call: text-file-models.save
                  input: {resource: "= vars.r", options: {reason: explicit, skip_save_participants: true}}
                  on_error: continue
              join: {need: all}
            - call: working-copy-service.modified-working-copies
              as: after
            - if: "size(vars.after.value.resources) > 0"
              then:
                - title: Some saves failed or were canceled, veto
                  source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:308-310"
                  return: {veto: true, handled: save-failed}
            - call: native-working-copy-backup-service.discard-backups
              input: {except: "= state.unrestored"}
            - return: {veto: false, handled: saved}
          dont_save:
            - title: Soft revert everything, no veto
              source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:316-324"
              parallel: "= vars.modified"
              as: r
              steps:
                - call: text-file-models.revert
                  input: {resource: "= vars.r", options: {soft: true}}
                  on_error: continue
              join: {need: all}
            - call: native-working-copy-backup-service.discard-backups
              input: {except: "= state.unrestored"}
            - return: {veto: false, handled: reverted}
          cancel:
            - title: User canceled, veto
              source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:326-327"
              return: {veto: true, handled: canceled}

  - component: native-working-copy-backup-tracker
    name: on-final-before-shutdown
    kind: event
    subscribe: [lifecycle-service.on-before-shutdown-final]
    summary: "WorkingCopyBackupTracker registers a finalVeto on onBeforeShutdown ('veto.backups'): decides on modified working copies and reports the veto to the lifecycle service."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:59"]
    request:
      type: object
      properties:
        reason: {type: string, enum: [close, quit, reload, load], default: quit}
    response: {type: object, properties: {veto: {type: boolean}, handled: {type: string}}}
    behavior:
      - call: native-working-copy-backup-tracker.on-final-before-shutdown-decide
        input: {reason: "= input.reason"}
        as: decided
      - title: Answer the final veto (veto.backups)
        source: "src/vs/workbench/services/workingCopy/common/workingCopyBackupTracker.ts:59"
        call: lifecycle-service.veto
        input: {id: veto.backups, veto: "= vars.decided.value.veto"}
      - return: "= vars.decided.value"

  - component: native-working-copy-backup-tracker
    name: should-backup-before-shutdown
    kind: function
    summary: "shouldBackupBeforeShutdown: nothing when hot exit is off; everything on quit and reload; on window close only with onExitAndWindowClose or when the last window closes on Windows/Linux; on workspace change only with onExitAndWindowClose."
    sources: ["src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:162-209"]
    request: {type: object, properties: {reason: {type: string, enum: [close, quit, reload, load], default: quit}, resources: {type: array, items: {type: string}}}}
    response: {type: object, properties: {resources: {type: array, items: {type: string}}}}
    behavior:
      - if: "config['files-hot-exit'] == 'off'"
        then:
          - title: Hot exit disabled, never back up
            source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:163-165"
            return: {resources: []}
      - if: "input.reason in ['quit', 'reload']"
        then:
          - title: Quit and reload always back up (backups restore on next start)
            source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:190-196"
            return: {resources: "= input.resources"}
      - if: "config['files-hot-exit'] == 'onExitAndWindowClose'"
        then:
          - title: onExitAndWindowClose backs up a folder window on close or workspace change
            source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:174-177"
            return: {resources: "= input.resources"}
      - if: "input.reason == 'load'"
        then:
          - title: Workspace change without onExitAndWindowClose backs up only scratchpads
            source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:198-207"
            return: {resources: []}
      - title: Window close; with other windows open (or on macOS) only scratchpads are backed up
        source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:179-186"
        call: native-host-main-service.get-window-count
        input: {window_id: "= self"}
        as: windows
      - if: "vars.windows.value.count > 1"
        then: [{return: {resources: []}}]
      - title: Last window closes on Windows/Linux, the app quits, back up
        source: "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:187"
        return: {resources: "= input.resources"}

  # ======================= local history =======================
  - component: working-copy-history-tracker
    name: on-did-save
    kind: event
    subscribe: [working-copy-service.on-did-save]
    summary: "WorkingCopyHistoryTracker.onDidSave: adds a history entry for saved stored files that are in a supported scheme, under the size limit, and with local history enabled."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:113-157"]
    request: {type: object, properties: {resource: {type: string}, reason: {type: string}, size: {type: integer}, mtime: {type: integer}}}
    behavior:
      - if: "!input.resource.startsWith('file:') && !input.resource.startsWith('vscode-userdata:')"
        then:
          - title: Unsupported scheme
            source: "src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:194-200"
            return: {tracked: false}
      - if: "input.size > 1024 * config['workbench-local-history-max-file-size']"
        then:
          - title: File too large for local history
            source: "src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:202-205"
            return: {tracked: false}
      - if: "!config['workbench-local-history-enabled']"
        then:
          - title: Local history disabled
            source: "src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:207-209"
            return: {tracked: false}
      - title: Queue the history entry with the save source and timestamp
        source: "src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:131-156"
        call: native-working-copy-history-service.add-entry
        input: {resource: "= input.resource", source: "= input.reason == 'explicit' ? 'default.source' : 'autoSave.source'", timestamp: "= input.mtime"}
      - return: {tracked: true}

  - component: native-working-copy-history-service
    name: add-entry
    kind: function
    summary: "WorkingCopyHistoryService.addEntry: appends a local history entry for the resource."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyHistoryService.ts:697-750"]
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, source: {type: string}, timestamp: {type: integer}}}
    response: {type: object, properties: {count: {type: integer}}}
    behavior:
      - set:
          state.entries: "= merge(state.entries, {input.resource: (input.resource in state.entries ? state.entries[input.resource] : []) + [{'source': input.source, 'timestamp': input.timestamp}]})"
      - return: {count: "= size(state.entries[input.resource])"}

  - component: native-working-copy-history-service
    name: get-entries
    kind: function
    summary: "WorkingCopyHistoryService.getEntries: the history entries of a resource."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyHistoryService.ts:752-770"]
    request: FilesResourceRequest
    response: {type: object, properties: {entries: {type: array}}}
    behavior:
      - return: {entries: "= input.resource in state.entries ? state.entries[input.resource] : []"}

  - component: working-copy-editor-service
    name: register-handler
    kind: function
    summary: "WorkingCopyEditorService.registerHandler: adds a working copy editor handler and fires onDidRegisterHandler."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyEditorService.ts:66-75"]
    request: {type: object, required: [handler], properties: {handler: {type: string, examples: [file-editor]}}}
    behavior:
      - set: {state.handlers: "= state.handlers + [input.handler]"}
      - return: {handlers: "= size(state.handlers)"}

  # ======================= explorer =======================
  - component: explorer-service
    name: apply-bulk-edit
    kind: function
    summary: "ExplorerService.applyBulkEdit: applies resource file edits through the bulk edit service with progress (cancellable for several edits) and the explorer undo source."
    sources: ["src/vs/workbench/contrib/files/browser/explorerService.ts:259-289"]
    request:
      type: object
      required: [edits]
      properties:
        edits:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [text, file], default: file}
              op: {type: string, enum: [edit, create, delete, rename]}
              resource: {type: string}
              target: {type: string}
              options: {type: object}
        undo_label: {type: string}
    response: {type: object, properties: {applied: {type: integer}}}
    behavior:
      - title: Apply through the bulk edit service (undo source explorer)
        source: "src/vs/workbench/contrib/files/browser/explorerService.ts:277-286"
        call: bulk-edit-service.apply
        input: {edits: "= input.edits", show_preview: false, respect_auto_save_config: false, label: "= has(input.undo_label) ? input.undo_label : ''", code: undoredo.explorerOperation}
      - return: {applied: "= size(input.edits)"}

  - component: explorer-service
    name: set-to-copy
    kind: function
    summary: "ExplorerService.setToCopy: remembers cut items and writes the resources to the clipboard."
    sources: ["src/vs/workbench/contrib/files/browser/explorerService.ts:337-343"]
    request: {type: object, properties: {resources: {type: array, items: {type: string}, default: ["file:///work/app/src/util.ts"]}, cut: {type: boolean, default: false}}}
    behavior:
      - set:
          state.cut_items: "= input.cut ? input.resources : []"
          state.copied_items: "= input.resources"
      - call: clipboard-service.write-resources
        input: {resources: "= input.resources"}
      - return: {cut: "= input.cut"}

  - component: explorer-service
    name: select
    kind: function
    summary: "ExplorerService.select: reveal and select a resource in the explorer."
    sources: ["src/vs/workbench/contrib/files/browser/explorerService.ts:361-404"]
    request: FilesResourceRequest
    behavior:
      - set: {state.selected: "= input.resource"}
      - return: {selected: "= input.resource"}

  - component: explorer-service
    name: refresh
    kind: function
    summary: "ExplorerService.refresh: forget cached children and refresh the tree, revealing the active file when explorer.autoReveal is on."
    sources: ["src/vs/workbench/contrib/files/browser/explorerService.ts:406-425"]
    request: {type: object}
    behavior:
      - set: {state.refreshes: "= state.refreshes + 1"}
      - return: {refreshed: true}

  - component: explorer-service
    name: set-editable
    kind: function
    summary: "ExplorerService.setEditable: start or stop inline editing (new file name, rename) of an explorer item."
    sources: ["src/vs/workbench/contrib/files/browser/explorerService.ts:307-335"]
    request: {type: object, properties: {resource: {type: string, default: ""}}}
    behavior:
      - set: {state.editable: "= input.resource"}
      - return: {editable: "= input.resource"}

  - component: file-actions
    name: delete-files
    kind: function
    summary: "deleteFiles: confirm when deleting files with unsaved changes; confirm the delete (trash or permanent) unless explorer.confirmDelete is off; apply the delete edit; if the trash fails, offer to delete permanently."
    sources: ["src/vs/workbench/contrib/files/browser/fileActions.ts:87-253"]
    request:
      type: object
      required: [resources]
      properties:
        resources: {type: array, items: {type: string}, default: ["file:///work/app/README.md"]}
        use_trash: {type: boolean, default: true}
        skip_confirm: {type: boolean, default: false}
        ignore_if_not_exists: {type: boolean, default: false}
    response: {type: object, properties: {deleted: {type: boolean}, permanently: {type: boolean}}}
    behavior:
      - set: {vars.skip_confirm: "= has(input.skip_confirm) && input.skip_confirm", vars.dirty: []}
      - foreach: "= input.resources"
        as: r
        steps:
          - call: working-copy-file-service.get-dirty
            input: {resource: "= vars.r"}
            as: d
          - set: {vars.dirty: "= vars.dirty + vars.d.value.resources"}
      - if: "size(vars.dirty) > 0"
        then:
          - title: Deleting files with unsaved changes asks to continue
            source: "src/vs/workbench/contrib/files/browser/fileActions.ts:104-131"
            choice: confirm_dirty
            default: confirmed
            options:
              confirmed:
                - set: {vars.skip_confirm: true}
              canceled:
                - return: {deleted: false, permanently: false}
      - if: "!vars.skip_confirm && config['explorer-confirm-delete'] != false"
        then:
          - title: Confirm moving to trash or deleting permanently (with a 'do not ask again' checkbox for trash)
            source: "src/vs/workbench/contrib/files/browser/fileActions.ts:165-201"
            choice: confirm_delete
            default: confirmed
            options:
              confirmed: []
              confirmed_do_not_ask_again:
                - title: Remember the checkbox in explorer.confirmDelete
                  source: "src/vs/workbench/contrib/files/browser/fileActions.ts:203-205"
                  call: configuration-service.update-value
                  input: {key: explorer.confirmDelete, value: false}
              canceled:
                - return: {deleted: false, permanently: false}
      - title: Apply the delete as resource file edits through the explorer
        source: "src/vs/workbench/contrib/files/browser/fileActions.ts:213-219"
        call: explorer-service.apply-bulk-edit
        input:
          edits: "= input.resources.map(r, {'type': 'file', 'op': 'delete', 'resource': r, 'options': {'recursive': true, 'skip_trash_bin': !input.use_trash, 'ignore_if_not_exists': has(input.ignore_if_not_exists) && input.ignore_if_not_exists}})"
          undo_label: delete
        as: applied
        on_error:
          - title: Delete failed; offer Delete Permanently (trash) or Retry
            source: "src/vs/workbench/contrib/files/browser/fileActions.ts:220-252"
            choice: retry
            default: "= has(input.ignore_if_not_exists) && input.ignore_if_not_exists ? 'canceled' : 'confirmed'"
            options:
              confirmed:
                - call: file-actions.delete-files
                  input: {resources: "= input.resources", use_trash: false, skip_confirm: true, ignore_if_not_exists: true}
                  as: again
                - return: {deleted: "= vars.again.value.deleted", permanently: true}
              canceled:
                - return: {deleted: false, permanently: false}
      - return: {deleted: true, permanently: "= !input.use_trash"}

  - component: file-actions
    name: open-explorer-and-create
    kind: function
    summary: "openExplorerAndCreate: opens the explorer, adds a phantom item under the selected folder, and on a valid name creates the file or folder through a bulk edit, then opens the file or selects the folder."
    sources: ["src/vs/workbench/contrib/files/browser/fileActions.ts:901-981"]
    request:
      type: object
      properties:
        folder: {type: string, default: "file:///work/app/src"}
        name: {type: string, default: "new.ts"}
        is_folder: {type: boolean, default: false}
        folder_readonly: {type: boolean, default: false}
    response: {type: object, properties: {created: {type: string}}}
    errors:
      - {code: parent-folder-is-readonly, status: 0, retryable: false, summary: "Parent folder is readonly."}
    behavior:
      - call: views-service.open-view
        input: {view_id: workbench.explorer.fileView, focus: true}
      - if: "has(input.folder_readonly) && input.folder_readonly"
        then:
          - title: Parent folder is readonly
            source: "src/vs/workbench/contrib/files/browser/fileActions.ts:932-934"
            fail: {code: parent-folder-is-readonly, message: "Parent folder is readonly."}
      - call: explorer-service.set-editable
        input: {resource: "= input.folder + '/'"}
      - set:
          vars.target: "= input.folder + '/' + input.name"
          vars.is_folder: "= input.is_folder || input.name.endsWith('/')"
      - title: Create the item through the explorer bulk edit
        source: "src/vs/workbench/contrib/files/browser/fileActions.ts:939-950"
        call: explorer-service.apply-bulk-edit
        input: {edits: [{type: file, op: create, resource: "= vars.target", options: {folder: "= vars.is_folder"}}], undo_label: create}
      - call: explorer-service.set-editable
        input: {resource: ""}
      - if: "vars.is_folder"
        then:
          - call: explorer-service.select
            input: {resource: "= vars.target"}
        else:
          - title: Open the new file pinned
            source: "src/vs/workbench/contrib/files/browser/fileActions.ts:953-956"
            call: editor-service.open-editor
            input: {resource: "= vars.target", options: {pinned: true}}
      - return: {created: "= vars.target"}

  - component: file-actions
    name: rename-handler
    kind: function
    summary: "renameHandler: inline edit of the selected item; a changed name applies a rename edit through the explorer."
    sources: ["src/vs/workbench/contrib/files/browser/fileActions.ts:997-1034"]
    request: {type: object, properties: {resource: {type: string, default: "file:///work/app/src/util.ts"}, new_name: {type: string, default: "math.ts"}}}
    response: {type: object, properties: {renamed: {type: string}}}
    behavior:
      - call: explorer-service.set-editable
        input: {resource: "= input.resource"}
      - set: {vars.target: "= input.resource.substring(0, input.resource.lastIndexOf('/') + 1) + input.new_name"}
      - if: "vars.target != input.resource"
        then:
          - title: Apply the rename edit
            source: "src/vs/workbench/contrib/files/browser/fileActions.ts:1015-1024"
            call: explorer-service.apply-bulk-edit
            input: {edits: [{type: file, op: rename, resource: "= input.resource", target: "= vars.target"}], undo_label: rename}
      - call: explorer-service.set-editable
        input: {resource: ""}
      - return: {renamed: "= vars.target"}

  - component: file-actions
    name: paste-file-handler
    kind: function
    summary: "pasteFileHandler: pastes the clipboard resources into the selected folder, moving them when they were cut (then clearing the cut state) or copying them otherwise."
    sources: ["src/vs/workbench/contrib/files/browser/fileActions.ts:1122-1303"]
    request: {type: object, properties: {target_folder: {type: string, default: "file:///work/app/src"}}}
    response: {type: object, properties: {pasted: {type: integer}, moved: {type: boolean}}}
    behavior:
      - call: clipboard-service.read-resources
        as: clip
      - if: "size(vars.clip.value.resources) == 0"
        then: [{return: {pasted: 0, moved: false}}]
      - set:
          vars.edits: "= vars.clip.value.resources.map(r, {'type': 'file', 'op': state.paste_should_move ? 'rename' : 'create', 'resource': r, 'target': input.target_folder + '/' + r.substring(r.lastIndexOf('/') + 1), 'options': {'copy': !state.paste_should_move}})"
      - title: Move (cut) or copy through the explorer bulk edit
        source: "src/vs/workbench/contrib/files/browser/fileActions.ts:1222-1236"
        call: explorer-service.apply-bulk-edit
        input: {edits: "= vars.edits", undo_label: paste}
      - set: {vars.moved: "= state.paste_should_move"}
      - if: "state.paste_should_move"
        then:
          - title: After a cut-paste, clear the cut state
            source: "src/vs/workbench/contrib/files/browser/fileActions.ts:1281-1285"
            call: explorer-service.set-to-copy
            input: {resources: [], cut: false}
          - set: {state.paste_should_move: false}
      - return: {pasted: "= size(vars.edits)", moved: "= vars.moved"}
