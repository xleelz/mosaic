components:
  # ---- area registrations (modeling devices standing in for other areas' registries) ----
  - id: files-area-registrations
    name: files/search/scm registrations
    kind: module
    layer: workbench
    parent: workbench
    summary: "Modeling device: routes a command id to this area's registered handler (as platform-core's command service does through CommandsRegistry) and instantiates this area's workbench contributions by phase (as workbench-shell's contribution registry does)."
    sources: ["src/vs/platform/commands/common/commands.ts", "src/vs/workbench/common/contributions.ts"]
    attributes: {owner: files-search-scm, device: true}

  # ---- text files ----
  - id: text-file-service
    name: NativeTextFileService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ITextFileService: save, save as, revert, read and write of text files; desktop implementation NativeTextFileService over AbstractTextFileService."
    sources: ["src/vs/workbench/services/textfile/common/textfiles.ts:23", "src/vs/workbench/services/textfile/electron-browser/nativeTextFileService.ts:118", "src/vs/workbench/services/textfile/browser/textFileService.ts:47"]
    attributes: {owner: files-search-scm, implements: ITextFileService}
  - id: text-file-save-participant
    name: TextFileSaveParticipant
    kind: module
    layer: workbench
    parent: text-file-models
    summary: "Runs the registered text file save participants in ordinal order; a participant's CancellationError cancels the save."
    sources: ["src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:18-93"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {participants: {type: array, items: {type: string}}}}
      initial: {participants: [ext-host-save-participant.participate, format-on-save-participant.participate]}
  - id: text-file-save-error-handler
    name: TextFileSaveErrorHandler
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that replaces the default save error handler: shows the save conflict / save error notification with its actions, and closes it when the file is saved or reverted."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:109", "src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:43-71"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {installed: {type: boolean}, messages: {type: object}, active_conflict_resolution_resource: {type: string}, learn_more_ignored: {type: boolean}}}
      initial: {installed: false, messages: {}, active_conflict_resolution_resource: "", learn_more_ignored: false}
  - id: text-file-editor-tracker
    name: TextFileEditorTracker
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that makes sure every dirty text file is opened in an editor (RunOnceWorker, 800 ms)."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:106", "src/vs/workbench/contrib/files/browser/editors/textFileEditorTracker.ts:41-62"]
    attributes: {owner: files-search-scm}
  - id: dirty-files-indicator
    name: DirtyFilesIndicator
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that shows the dirty working copy count as a badge on the Explorer view container."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:118", "src/vs/workbench/contrib/files/common/dirtyFilesIndicator.ts:35-66"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {badge: {type: integer}, last_known_dirty_count: {type: integer}}}
      initial: {badge: 0, last_known_dirty_count: 0}
  - id: workspace-watcher
    name: WorkspaceWatcher
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that starts a recursive file watcher for every workspace folder."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:115", "src/vs/workbench/contrib/files/browser/workspaceWatcher.ts"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {watched: {type: array, items: {type: string}}}}
      initial: {watched: []}
  - id: file-uri-label-contribution
    name: FileUriLabelContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering the label formatter for file: URIs."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:112", "src/vs/workbench/contrib/files/browser/files.contribution.ts:60-98"]
    attributes: {owner: files-search-scm}
  - id: explorer-viewlet-views-contribution
    name: ExplorerViewletViewsContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering the Explorer, Open Editors and empty views."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:103", "src/vs/workbench/contrib/files/browser/explorerViewlet.ts"]
    attributes: {owner: files-search-scm}
  - id: file-editor-working-copy-editor-handler
    name: FileEditorWorkingCopyEditorHandler
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that registers the handler mapping text file working copies to file editors (used when restoring backups)."
    sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:100", "src/vs/workbench/contrib/files/browser/editors/fileEditorHandler.ts"]
    attributes: {owner: files-search-scm}
  - id: text-editor-service
    name: TextEditorService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ITextEditorService: turns untyped text editor inputs into file or untitled editor inputs."
    sources: ["src/vs/workbench/services/textfile/common/textEditorService.ts:28", "src/vs/workbench/services/textfile/common/textEditorService.ts:322"]
    attributes: {owner: files-search-scm, implements: ITextEditorService}

  # ---- working copies ----
  - id: working-copy-service
    name: WorkingCopyService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkingCopyService: registry of working copies that relays their dirty, content and save events and answers modified/dirty queries."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts:15", "src/vs/workbench/services/workingCopy/common/workingCopyService.ts:387", "src/vs/workbench/services/workingCopy/common/workingCopyService.ts:151"]
    attributes: {owner: files-search-scm, implements: IWorkingCopyService}
    state:
      schema: {type: object, properties: {working_copies: {type: object}}}
      initial: {working_copies: {}}
  - id: working-copy-file-service
    name: WorkingCopyFileService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkingCopyFileService: create/move/copy/delete files with participants, before/after/fail events, and soft-revert of affected dirty working copies."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:25", "src/vs/workbench/services/workingCopy/common/workingCopyFileService.ts:552"]
    attributes: {owner: files-search-scm, implements: IWorkingCopyFileService}
  - id: working-copy-file-operation-participant
    name: WorkingCopyFileOperationParticipant
    kind: module
    layer: workbench
    parent: working-copy-file-service
    summary: "Runs file operation participants (extension onWillCreate/Rename/DeleteFiles) with files.participants.timeout; disabled when the timeout is 0 or less."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyFileOperationParticipant.ts:31-46"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {participants: {type: array, items: {type: string}}}}
      initial: {participants: [main-thread-file-system-event-service.participate]}
  - id: native-working-copy-backup-service
    name: NativeWorkingCopyBackupService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkingCopyBackupService: stores, resolves and discards backups of modified working copies (hot exit)."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyBackup.ts:11", "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupService.ts:41", "src/vs/workbench/services/workingCopy/common/workingCopyBackupService.ts:188"]
    attributes: {owner: files-search-scm, implements: IWorkingCopyBackupService}
    state:
      schema: {type: object, properties: {backups: {type: object}}}
      initial: {backups: {}}
  - id: native-working-copy-backup-tracker
    name: NativeWorkingCopyBackupTracker
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution: schedules backups of modified working copies and decides on shutdown whether to auto save, back up (hot exit), or ask to save, possibly vetoing the shutdown."
    sources: ["src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupService.ts:44", "src/vs/workbench/services/workingCopy/electron-browser/workingCopyBackupTracker.ts:28-48"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {scheduled: {type: object}, content_versions: {type: object}, unrestored: {type: array}, ready: {type: boolean}}}
      initial: {scheduled: {}, content_versions: {}, unrestored: [], ready: true}
  - id: browser-working-copy-backup-tracker
    name: BrowserWorkingCopyBackupTracker
    kind: module
    layer: workbench
    parent: workbench
    summary: "Web-only workbench contribution: on shutdown it vetoes (beforeunload) when modified working copies are not backed up; not loaded in the desktop build."
    sources: ["src/vs/workbench/services/workingCopy/browser/workingCopyBackupService.ts:33", "src/vs/workbench/services/workingCopy/browser/workingCopyBackupTracker.ts"]
    attributes: {owner: files-search-scm, platform: web}
  - id: working-copy-history-tracker
    name: WorkingCopyHistoryTracker
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that adds a local history entry for every save of a stored file working copy that passes the size, enabled and exclude checks."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyHistoryService.ts:906", "src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:28-36"]
    attributes: {owner: files-search-scm}
  - id: native-working-copy-history-service
    name: NativeWorkingCopyHistoryService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkingCopyHistoryService: local history entries per resource."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyHistory.ts:12", "src/vs/workbench/services/workingCopy/electron-browser/workingCopyHistoryService.ts:11", "src/vs/workbench/services/workingCopy/common/workingCopyHistoryService.ts:577"]
    attributes: {owner: files-search-scm, implements: IWorkingCopyHistoryService}
    state:
      schema: {type: object, properties: {entries: {type: object}}}
      initial: {entries: {}}
  - id: working-copy-editor-service
    name: WorkingCopyEditorService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkingCopyEditorService: registry of handlers that map working copies to editors."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyEditorService.ts:15", "src/vs/workbench/services/workingCopy/common/workingCopyEditorService.ts:100"]
    attributes: {owner: files-search-scm, implements: IWorkingCopyEditorService}
    state:
      schema: {type: object, properties: {handlers: {type: array, items: {type: string}}}}
      initial: {handlers: []}

  # ---- explorer ----
  - id: explorer-service
    name: ExplorerService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IExplorerService: explorer model, selection, cut/copy clipboard state, inline editing and bulk file edits."
    sources: ["src/vs/workbench/contrib/files/browser/files.ts:53", "src/vs/workbench/contrib/files/browser/files.contribution.ts:58"]
    attributes: {owner: files-search-scm, implements: IExplorerService}
    state:
      schema: {type: object, properties: {cut_items: {type: array}, copied_items: {type: array}, selected: {type: string}, editable: {type: string}, refreshes: {type: integer}}}
      initial: {cut_items: [], copied_items: [], selected: "", editable: "", refreshes: 0}
  - id: file-actions
    name: File actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Explorer file actions and their command registrations (fileActions.ts, fileActions.contribution.ts): new file/folder, rename, delete, cut/copy/paste, compare, auto save toggle, readonly in session."
    sources: ["src/vs/workbench/contrib/files/browser/fileActions.ts", "src/vs/workbench/contrib/files/browser/fileActions.contribution.ts"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {paste_should_move: {type: boolean}}}
      initial: {paste_should_move: false}
  - id: file-commands
    name: File commands
    kind: module
    layer: workbench
    parent: workbench
    summary: "Commands registered in fileCommands.ts: save, save as, save all, revert, compare, copy path, open to side, reveal."
    sources: ["src/vs/workbench/contrib/files/browser/fileCommands.ts"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {resource_to_compare: {type: string}}}
      initial: {resource_to_compare: ""}
  - id: electron-file-actions
    name: Native file actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Desktop-only file commands (reveal in OS) from electron-browser/fileActions.contribution.ts."
    sources: ["src/vs/workbench/contrib/files/electron-browser/fileActions.contribution.ts"]
    attributes: {owner: files-search-scm}
  - id: explorer-view
    name: ExplorerView
    kind: module
    layer: workbench
    parent: workbench
    summary: "The Explorer tree view and the actions registered with it."
    sources: ["src/vs/workbench/contrib/files/browser/views/explorerView.ts"]
    attributes: {owner: files-search-scm}
  - id: open-editors-view
    name: OpenEditorsView
    kind: module
    layer: workbench
    parent: workbench
    summary: "The Open Editors view and its title actions."
    sources: ["src/vs/workbench/contrib/files/browser/views/openEditorsView.ts"]
    attributes: {owner: files-search-scm}
