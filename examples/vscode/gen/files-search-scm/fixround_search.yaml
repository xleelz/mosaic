- component: search-service
  name: text-search-split-sync-async
  kind: function
  summary: 'SearchService.textSearchSplitSyncAsync(query, token, onProgress): open editor models are matched synchronously and reported through onProgress at once (syncResults); then doSearch activates
    onSearch:<scheme> and onSearch:file, drops missing folders and asks the text search provider for the scheme, forwarding each file match it reports through onProgress unless an open editor already
    matched that file (asyncResults). Each onProgress item is a yield {resource, matches}; the return holds both completes.'
  sources:
  - src/vs/workbench/services/search/common/searchService.ts:116-163
  - src/vs/workbench/services/search/common/searchService.ts:173-222
  request:
    type: object
    required:
    - query
    properties:
      query:
        $ref: SearchTextQuery
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response:
    type: object
    properties:
      sync_results:
        $ref: SearchComplete
      async_results:
        $ref: SearchComplete
  errors:
  - code: canceled
    status: 0
    retryable: false
  behavior:
  - title: Open editor results first (in-memory models)
    source: src/vs/workbench/services/search/common/searchService.ts:127-136
    call: text-file-models.find-matches
    input:
      pattern: = input.query.pattern
      max_results: '= has(input.query.max_results) ? input.query.max_results : config[''search-max-results'']'
    as: open_editors
  - title: onProgress reports each open editor match synchronously
    source: src/vs/workbench/services/search/common/searchService.ts:129-131
    foreach: = vars.open_editors.value.results
    as: fm
    steps:
    - yield: = vars.fm
  - set:
      vars.sync: '= {''results'': vars.open_editors.value.results, ''limit_hit'': vars.open_editors.value.limit_hit}'
      vars.schemes: = input.query.folders.map(f, f.substring(0, f.indexOf(':')))
  - title: Activate search providers for every scheme in the query plus onSearch:file
    source: src/vs/workbench/services/search/common/searchService.ts:176-180
    parallel: = vars.schemes.map(s, 'onSearch:' + s) + ['onSearch:file']
    as: activation_event
    steps:
    - call: extension-service.activate-by-event
      input:
        activation_event: = vars.activation_event
        activation_kind: normal
    join:
      need: all
  - if: has(input.token) && input.token.canceled
    then:
    - title: Canceled while waiting for extensions
      source: src/vs/workbench/services/search/common/searchService.ts:186-189
      fail:
        code: canceled
        message: Canceled
  - title: Drop folders that do not exist
    source: src/vs/workbench/services/search/common/searchService.ts:197-198
    parallel: = input.query.folders
    as: folder
    steps:
    - call: file-service.exists
      input:
        resource: = vars.folder
      as: ex
    - return: = vars.ex.value.exists
    join:
      need: all
    as_result: exists
  - set:
      vars.folders: = vars.exists.results.filter(r, r.ok && r.value).map(r, r.item)
  - if: size(vars.folders) == 0
    then:
    - title: No folder left, an empty complete
      source: src/vs/workbench/services/search/common/searchService.ts:201-208
      return:
        sync_results: = vars.sync
        async_results:
          results: []
          limit_hit: false
  - set:
      vars.scheme: = vars.folders[0].substring(0, vars.folders[0].indexOf(':'))
  - if: '!(vars.scheme in state.text_providers) || !state.text_providers[vars.scheme]'
    then:
    - title: No provider registered for the scheme; the search waits for one to register
      source: src/vs/workbench/services/search/common/searchService.ts:288-306
      return:
        sync_results: = vars.sync
        async_results:
          results: []
          limit_hit: false
          pending: true
  - set:
      vars.open_resources: = vars.open_editors.value.results.map(r, r.resource)
      vars.provider_matches: []
      vars.fq: '= has(input.query.folder_queries) && size(input.query.folder_queries) > 0 ? input.query.folder_queries : vars.folders.map(f, {''folder'': f})'
  - title: Query the provider (the extension host's text search over RPC) with the per-folder encodings; its progress reports file matches
    source: src/vs/workbench/services/search/common/searchService.ts:316-327
    call: ext-host-search.provide-text-search-results
    'on': = 'eh' + self.substring(1)
    stream: true
    input:
      scheme: = vars.scheme
      query: '= merge(input.query, {''folders'': vars.folders})'
      folder_encodings: '= vars.fq.filter(q, q.folder in vars.folders && has(q.file_encoding) && q.file_encoding != '''').transformMapEntry(i, q, {q.folder: q.file_encoding})'
    as: provided
    on_item:
    - title: RemoteSearchProvider collects every match the provider reports (search.matches)
      source: src/vs/workbench/api/browser/mainThreadSearch.ts:193-205
      set:
        vars.provider_matches: = vars.provider_matches + [vars.item]
    - if: has(vars.item.resource) && !(vars.item.resource in vars.open_resources)
      then:
      - title: onProviderProgress forwards a file match unless an open editor already matched that file
        source: src/vs/workbench/services/search/common/searchService.ts:141-150
        yield: = vars.item
  - title: doSearch's complete is the provider's (the collected matches, limitHit and stats; RemoteSearchProvider.doSearch)
    source: src/vs/workbench/api/browser/mainThreadSearch.ts:170-183
    return:
      sync_results: = vars.sync
      async_results:
        results: = vars.provider_matches
        limit_hit: = has(vars.provided.value.limit_hit) && vars.provided.value.limit_hit
- component: search-service
  name: text-search
  kind: function
  summary: 'ISearchService.textSearch(query, token, onProgress): runs textSearchSplitSyncAsync, passes every progress item through, and resolves with the async results followed by the open editor results;
    limitHit if either hit it.'
  sources:
  - src/vs/workbench/services/search/common/searchService.ts:82-91
  - src/vs/workbench/services/search/common/search.ts:264-267
  request:
    type: object
    required:
    - query
    properties:
      query:
        $ref: SearchTextQuery
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response: SearchComplete
  errors:
  - code: canceled
    status: 0
    retryable: false
  behavior:
  - call: search-service.text-search-split-sync-async
    stream: true
    input:
      query: = input.query
      token: '= has(input.token) ? input.token : {''canceled'': false}'
    as: split
    on_item:
