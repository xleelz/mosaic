- component: workspace-symbol-provider-registry
  name: get-workspace-symbols
  kind: function
  summary: 'getWorkspaceSymbols(query, token): asks every registered provider at once (Promise.all); a provider error is swallowed (onUnexpectedExternalError); a canceled token yields []; results are
    sorted and de-duplicated.'
  sources:
  - src/vs/workbench/contrib/search/common/search.ts:88-130
  - src/vs/workbench/contrib/search/common/search.ts:81-83
  request:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        examples:
        - add
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response:
    type: object
    properties:
      symbols:
        type: array
        items:
          type: object
      provider_count:
        type: integer
  behavior:
  - if: size(state.providers) == 0
    then:
    - return:
        symbols: []
        provider_count: 0
  - title: provider.provideWorkspaceSymbols for every provider (MainThreadLanguageFeatures proxies it as $provideWorkspaceSymbols to the extension host)
    source: src/vs/workbench/contrib/search/common/search.ts:92-104
    parallel: = state.providers
    as: p
    steps:
    - call: ext-host-language-features.provide-workspace-symbols
      'on': = 'eh' + self.substring(1)
      input:
        handle: = vars.p.handle
        search: = input.query
        token:
          canceled: false
      as: r
      on_error:
      - title: onUnexpectedExternalError, the provider adds nothing
        source: src/vs/workbench/contrib/search/common/search.ts:101-103
        return: []
    - return: '= has(vars.r.value.symbols) ? vars.r.value.symbols : []'
    join:
      need: all
    as_result: all
  - if: has(input.token) && input.token.canceled
    then:
    - title: A canceled token returns no symbols
      source: src/vs/workbench/contrib/search/common/search.ts:108-110
      return:
        symbols: []
        provider_count: = size(state.providers)
  - return:
      symbols: = vars.all.results.filter(x, x.ok).map(x, x.value).flatten()
      provider_count: = size(state.providers)
