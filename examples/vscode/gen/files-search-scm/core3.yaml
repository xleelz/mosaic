components:
  # ---- search ----
  - id: search-service
    name: SearchService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ISearchService: text and file search; matches open editor models first, then activates onSearch:<scheme> and queries the registered provider per scheme."
    sources: ["src/vs/workbench/services/search/common/search.ts:40", "src/vs/workbench/services/search/electron-browser/searchService.ts:10", "src/vs/workbench/services/search/common/searchService.ts"]
    attributes: {owner: files-search-scm, implements: ISearchService}
    state:
      schema: {type: object, properties: {text_providers: {type: object}, file_providers: {type: object}}}
      initial: {text_providers: {}, file_providers: {}}
  - id: local-file-search-worker
    name: Local file search worker
    kind: module
    layer: workbench
    parent: workbench
    summary: "Web worker entry (localFileSearchMain) that runs file and text search over the File System Access API for the web workbench."
    sources: ["src/vs/workbench/services/search/worker/localFileSearchMain.ts:9", "src/vs/workbench/services/search/worker/localFileSearch.ts"]
    attributes: {owner: files-search-scm, platform: web}
    state:
      schema: {type: object, properties: {started: {type: boolean}}}
      initial: {started: false}
  - id: search-view
    name: SearchView
    kind: module
    layer: workbench
    parent: workbench
    summary: "The Search view: builds the text query from the inputs and settings, runs it through the search model, and shows results and replace."
    sources: ["src/vs/workbench/contrib/search/browser/searchView.ts:128"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {query: {type: string}, replace: {type: string}, options: {type: object}, includes: {type: string}, excludes: {type: string}, result_count: {type: integer}, file_count: {type: integer}, limit_hit: {type: boolean}, message: {type: string}}}
      initial: {query: "", replace: "", options: {is_regex: false, is_case_sensitive: false, is_word_match: false, preserve_case: false}, includes: "", excludes: "", result_count: 0, file_count: 0, limit_hit: false, message: ""}
  - id: search-model
    name: SearchModelImpl
    kind: module
    layer: workbench
    parent: search-view-model-workbench-service
    summary: "The search model: cancels the previous search, runs notebook and text search, and keeps the result tree."
    sources: ["src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:25"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {results: {type: array}, limit_hit: {type: boolean}, searches: {type: integer}}}
      initial: {results: [], limit_hit: false, searches: 0}
  - id: search-view-model-workbench-service
    name: SearchViewModelWorkbenchService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ISearchViewModelWorkbenchService: owns the search model shared by the search view."
    sources: ["src/vs/workbench/contrib/search/browser/searchTreeModel/searchViewModelWorkbenchService.ts:9", "src/vs/workbench/contrib/search/browser/search.contribution.ts:43", "src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:412"]
    attributes: {owner: files-search-scm, implements: ISearchViewModelWorkbenchService}
  - id: search-history-service
    name: SearchHistoryService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ISearchHistoryService: search/replace/include/exclude history in workspace storage under workbench.search.history."
    sources: ["src/vs/workbench/contrib/search/common/searchHistoryService.ts:19", "src/vs/workbench/contrib/search/browser/search.common.contribution.ts:20", "src/vs/workbench/contrib/search/common/searchHistoryService.ts:28-67"]
    attributes: {owner: files-search-scm, implements: ISearchHistoryService}
    state:
      schema: {type: object, properties: {history: {type: object}}}
      initial: {history: {}}
  - id: replace-service
    name: ReplaceService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IReplaceService: turns search matches into text edits, applies them as one bulk edit, then saves each touched text file model."
    sources: ["src/vs/workbench/contrib/search/browser/replace.ts:10", "src/vs/workbench/contrib/search/browser/replaceContributions.ts:11", "src/vs/workbench/contrib/search/browser/replaceService.ts:97"]
    attributes: {owner: files-search-scm, implements: IReplaceService}
  - id: replace-preview-content-provider
    name: ReplacePreviewContentProvider
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution providing the text model content of the replace preview diff."
    sources: ["src/vs/workbench/contrib/search/browser/replaceContributions.ts:12", "src/vs/workbench/contrib/search/browser/replaceService.ts:45-62"]
    attributes: {owner: files-search-scm}
  - id: notebook-search-service
    name: NotebookSearchService
    kind: service
    layer: workbench
    parent: workbench
    summary: "INotebookSearchService: searches open notebooks so text search can skip their files."
    sources: ["src/vs/workbench/contrib/search/common/notebookSearch.ts:11", "src/vs/workbench/contrib/search/browser/notebookSearch/notebookSearchContributions.ts:10", "src/vs/workbench/contrib/search/browser/notebookSearch/notebookSearchService.ts:35"]
    attributes: {owner: files-search-scm, implements: INotebookSearchService}
  - id: search-chat-context-contribution
    name: SearchChatContextContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering search results, symbols and files as chat context pickers."
    sources: ["src/vs/workbench/contrib/search/browser/search.contribution.ts:47", "src/vs/workbench/contrib/search/browser/searchChatContext.ts:41-54"]
    attributes: {owner: files-search-scm}
  - id: search-actions
    name: Search actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Commands registered by the search contribution (searchActions*.ts, search.contribution.ts, searchWidget.ts)."
    sources: ["src/vs/workbench/contrib/search/browser/searchActionsFind.ts", "src/vs/workbench/contrib/search/browser/searchActionsNav.ts"]
    attributes: {owner: files-search-scm}
  - id: search-editor-contribution
    name: SearchEditorContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering the search editor for *.code-search files."
    sources: ["src/vs/workbench/contrib/searchEditor/browser/searchEditor.contribution.ts:149", "src/vs/workbench/contrib/searchEditor/browser/searchEditor.contribution.ts:120-147"]
    attributes: {owner: files-search-scm}
  - id: search-editor-working-copy-editor-handler
    name: SearchEditorWorkingCopyEditorHandler
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution mapping search editor working copies to search editors when restoring backups."
    sources: ["src/vs/workbench/contrib/searchEditor/browser/searchEditor.contribution.ts:654", "src/vs/workbench/contrib/searchEditor/browser/searchEditor.contribution.ts:621-652"]
    attributes: {owner: files-search-scm}
  - id: search-editor-actions
    name: Search editor actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Commands registered by the search editor contribution; they act on the active search editor."
    sources: ["src/vs/workbench/contrib/searchEditor/browser/searchEditor.contribution.ts", "src/vs/workbench/contrib/searchEditor/browser/searchEditorActions.ts"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {editors: {type: integer}, options: {type: object}, context_lines: {type: integer}}}
      initial: {editors: 0, options: {is_case_sensitive: false, is_word_match: false, is_regex: false, show_context: false}, context_lines: 0}

  # ---- scm ----
  - id: scm-service
    name: SCMService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ISCMService: the registered source control repositories (one per provider) with their input boxes and input history."
    sources: ["src/vs/workbench/contrib/scm/common/scm.ts:35", "src/vs/workbench/contrib/scm/browser/scm.service.contribution.ts:11", "src/vs/workbench/contrib/scm/common/scmService.ts:358"]
    attributes: {owner: files-search-scm, implements: ISCMService}
    state:
      schema: {type: object, properties: {repositories: {type: object}}}
      initial: {repositories: {}}
  - id: scm-view-service
    name: SCMViewService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ISCMViewService: visible and active repositories of the Source Control view."
    sources: ["src/vs/workbench/contrib/scm/common/scm.ts:227", "src/vs/workbench/contrib/scm/browser/scm.service.contribution.ts:12", "src/vs/workbench/contrib/scm/browser/scmViewService.ts:109"]
    attributes: {owner: files-search-scm, implements: ISCMViewService}
    state:
      schema: {type: object, properties: {active_repository: {type: string}, visible: {type: array}}}
      initial: {active_repository: "", visible: []}
  - id: quick-diff-service
    name: QuickDiffService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IQuickDiffService: registry of quick diff providers (original resource per file)."
    sources: ["src/vs/workbench/contrib/scm/common/quickDiff.ts:23", "src/vs/workbench/contrib/scm/browser/quickDiff.contribution.ts:115", "src/vs/workbench/contrib/scm/common/quickDiffService.ts:53"]
    attributes: {owner: files-search-scm, implements: IQuickDiffService}
  - id: quick-diff-model-service
    name: QuickDiffModelService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IQuickDiffModelService: reference-counted quick diff models per text file model."
    sources: ["src/vs/workbench/contrib/scm/browser/quickDiffModel.ts:34", "src/vs/workbench/contrib/scm/browser/quickDiff.contribution.ts:116", "src/vs/workbench/contrib/scm/browser/quickDiffModel.ts:72"]
    attributes: {owner: files-search-scm, implements: IQuickDiffModelService}
  - id: quick-diff-workbench-controller
    name: QuickDiffWorkbenchController
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that decorates visible text editors with quick diff gutter changes."
    sources: ["src/vs/workbench/contrib/scm/browser/quickDiff.contribution.ts:31", "src/vs/workbench/contrib/scm/browser/quickDiffDecorator.ts:218"]
    attributes: {owner: files-search-scm}
  - id: quick-diff-editor-controller
    name: QuickDiffEditorController
    kind: module
    layer: workbench
    parent: workbench
    summary: "Editor contribution hosting the peek quick diff widget and its navigation commands."
    sources: ["src/vs/workbench/contrib/scm/browser/quickDiff.contribution.ts:33", "src/vs/workbench/contrib/scm/browser/quickDiffWidget.ts:481"]
    attributes: {owner: files-search-scm}
  - id: scm-active-repository-controller
    name: SCMActiveRepositoryController
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution showing the active repository's count badge and status bar commands."
    sources: ["src/vs/workbench/contrib/scm/browser/scm.contribution.ts:148", "src/vs/workbench/contrib/scm/browser/activity.ts:31"]
    attributes: {owner: files-search-scm}
  - id: scm-active-resource-context-key-controller
    name: SCMActiveResourceContextKeyController
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution maintaining the scmActiveResource* context keys for the active editor."
    sources: ["src/vs/workbench/contrib/scm/browser/scm.contribution.ts:151", "src/vs/workbench/contrib/scm/browser/activity.ts:188"]
    attributes: {owner: files-search-scm}
  - id: scm-working-set-controller
    name: SCMWorkingSetController
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that saves and restores editor working sets per SCM branch."
    sources: ["src/vs/workbench/contrib/scm/browser/scm.contribution.ts:153", "src/vs/workbench/contrib/scm/browser/workingSet.ts:28"]
    attributes: {owner: files-search-scm}
  - id: scm-history-item-context-contribution
    name: SCMHistoryItemContextContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering SCM history items as chat context."
    sources: ["src/vs/workbench/contrib/scm/browser/scm.contribution.ts:159", "src/vs/workbench/contrib/scm/browser/scmHistoryChatContext.ts:50"]
    attributes: {owner: files-search-scm}
  - id: scm-actions
    name: SCM actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Commands registered by the SCM contribution, the SCM views, the input and the history graph."
    sources: ["src/vs/workbench/contrib/scm/browser/scm.contribution.ts", "src/vs/workbench/contrib/scm/browser/scmHistoryViewPane.ts"]
    attributes: {owner: files-search-scm}

  # ---- markers ----
  - id: markers-actions
    name: Markers actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Commands registered by the Problems (markers) contribution."
    sources: ["src/vs/workbench/contrib/markers/browser/markers.contribution.ts"]
    attributes: {owner: files-search-scm}
  - id: markers-status-bar-contributions
    name: MarkersStatusBarContributions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution showing the error/warning/info counts in the status bar."
    sources: ["src/vs/workbench/contrib/markers/browser/markers.contribution.ts:692", "src/vs/workbench/contrib/markers/browser/markers.contribution.ts:572-600"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {errors: {type: integer}, warnings: {type: integer}, infos: {type: integer}}}
      initial: {errors: 0, warnings: 0, infos: 0}
  - id: activity-updater
    name: ActivityUpdater
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution showing the problem count badge on the Problems view."
    sources: ["src/vs/workbench/contrib/markers/browser/markers.contribution.ts:721", "src/vs/workbench/contrib/markers/browser/markers.contribution.ts:696-719"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {badge: {type: integer}}}
      initial: {badge: 0}
  - id: markers-file-decorations
    name: MarkersFileDecorations
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that decorates files with problems in the explorer when problems.decorations.enabled is on."
    sources: ["src/vs/workbench/contrib/markers/browser/markersFileDecorations.ts:123", "src/vs/workbench/contrib/markers/browser/markersFileDecorations.ts:56"]
    attributes: {owner: files-search-scm}
  - id: marker-chat-context-contribution
    name: MarkerChatContextContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering problems as chat context."
    sources: ["src/vs/workbench/contrib/markers/browser/markers.contribution.ts:694", "src/vs/workbench/contrib/markers/browser/markersChatContext.ts:120"]
    attributes: {owner: files-search-scm}

  # ---- merge editor ----
  - id: merge-editor-actions
    name: Merge editor actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Commands registered by the merge editor contribution (mergeEditor/browser/commands)."
    sources: ["src/vs/workbench/contrib/mergeEditor/browser/mergeEditor.contribution.ts", "src/vs/workbench/contrib/mergeEditor/browser/commands/commands.ts"]
    attributes: {owner: files-search-scm}
    state:
      schema: {type: object, properties: {unhandled_conflicts: {type: integer}, result: {type: string}, accepted: {type: array}}}
      initial: {unhandled_conflicts: 0, result: "", accepted: []}
  - id: merge-editor-open-handler-contribution
    name: MergeEditorOpenHandlerContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution that opens merge editor inputs from the 'open in merge editor' handler."
    sources: ["src/vs/workbench/contrib/mergeEditor/browser/mergeEditor.contribution.ts:103", "src/vs/workbench/contrib/mergeEditor/browser/view/mergeEditor.ts:754"]
    attributes: {owner: files-search-scm}
  - id: merge-editor-resolver-contribution
    name: MergeEditorResolverContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering the merge editor with the editor resolver for merge inputs."
    sources: ["src/vs/workbench/contrib/mergeEditor/browser/mergeEditor.contribution.ts:105", "src/vs/workbench/contrib/mergeEditor/browser/view/mergeEditor.ts:785"]
    attributes: {owner: files-search-scm}

  # ---- multi diff editor ----
  - id: multi-diff-source-resolver-service
    name: MultiDiffSourceResolverService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IMultiDiffSourceResolverService: registry of resolvers turning a multi diff source URI into its list of diffs."
    sources: ["src/vs/workbench/contrib/multiDiffEditor/browser/multiDiffSourceResolverService.ts:13", "src/vs/workbench/contrib/multiDiffEditor/browser/multiDiffEditor.contribution.ts:35", "src/vs/workbench/contrib/multiDiffEditor/browser/multiDiffSourceResolverService.ts:53"]
    attributes: {owner: files-search-scm, implements: IMultiDiffSourceResolverService}
    state:
      schema: {type: object, properties: {resolvers: {type: array, items: {type: string}}}}
      initial: {resolvers: []}
  - id: multi-diff-editor-resolver-contribution
    name: MultiDiffEditorResolverContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering the multi diff editor with the editor resolver."
    sources: ["src/vs/workbench/contrib/multiDiffEditor/browser/multiDiffEditor.contribution.ts:38", "src/vs/workbench/contrib/multiDiffEditor/browser/multiDiffEditorInput.ts:452"]
    attributes: {owner: files-search-scm}
  - id: scm-multi-diff-source-resolver-contribution
    name: ScmMultiDiffSourceResolverContribution
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workbench contribution registering the scm-multi-diff-source resolvers (resource groups and history items)."
    sources: ["src/vs/workbench/contrib/multiDiffEditor/browser/multiDiffEditor.contribution.ts:51", "src/vs/workbench/contrib/multiDiffEditor/browser/scmMultiDiffSourceResolver.ts:197"]
    attributes: {owner: files-search-scm}
  - id: multi-diff-editor-actions
    name: Multi diff editor actions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Commands registered by the multi diff editor contribution."
    sources: ["src/vs/workbench/contrib/multiDiffEditor/browser/multiDiffEditor.contribution.ts", "src/vs/workbench/contrib/multiDiffEditor/browser/actions.ts"]
    attributes: {owner: files-search-scm}
