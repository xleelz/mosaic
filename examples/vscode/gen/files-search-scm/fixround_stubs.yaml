- component: model-service
  name: create-model
  kind: function
  attributes:
    boundary: true
    owner: editor
  request:
    type: object
    required:
    - resource
    - value
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      value:
        type: string
        examples:
        - 'import { add } from ''./util'';

          console.log(add(1, 2));

          '
      language_id:
        type: string
        default: plaintext
        examples:
        - typescript
  response:
    type: object
    properties:
      resource:
        type: string
      version_id:
        type: integer
  errors:
  - code: model-already-exists
    status: 0
    retryable: false
  summary: 'ModelService.createModel: a new TextModel for the resource (plaintext without a language); a second model for the same resource is a programmer error (contract copied from editor).'
- component: file-service
  name: create-file
  kind: function
  attributes:
    boundary: true
    owner: platform-core
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/new.ts
      content:
        type: string
        default: ''
      overwrite:
        type: boolean
        default: false
  response: PlatformFileStat
  errors:
  - code: file-modified-since
    status: 0
    retryable: false
  summary: 'FileService.createFile: refuse an existing file unless overwrite is set, then writeFile (which creates it) and fire CREATE. (contract copied from platform-core).'
- component: ext-host-search
  name: provide-text-search-results
  kind: rpc
  attributes:
    boundary: true
    owner: exthost
    shape: ExtHostSearchShape
  request:
    type: object
    properties:
      scheme:
        type: string
        default: file
      query:
        type: object
        properties:
          pattern:
            type: string
            examples:
            - add
          folders:
            type: array
            items:
              type: string
            default:
            - file:///work/app
          max_results:
            type: integer
            default: 20000
      folder_encodings:
        type: object
        default: {}
        description: folder URI -> the folder query's fileEncoding (files.encoding for that folder)
  response:
    type: object
    properties:
      limit_hit:
        type: boolean
      stats:
        type: object
        properties:
          result_count:
            type: integer
  errors:
  - code: unknown-provider
    status: 0
    retryable: false
  summary: 'ExtHostSearchShape.$provideTextSearchResults: the extension host runs the text search provider for the scheme (NativeTextSearchManager over RipgrepSearchProvider for file:); file matches come
    back as progress ($handleTextMatch), the complete carries limitHit and stats. folder_encodings carries each folder query''s fileEncoding.'
- component: text-model
  name: get-value
  kind: function
  attributes:
    boundary: true
    owner: editor
  request:
    type: object
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      resource:
        type: string
        description: accepted as an alias of uri (shared shape)
  response:
    type: object
    properties:
      uri:
        type: string
      value:
        type: string
      version_id:
        type: integer
      alternative_version_id:
        type: integer
      language_id:
        type: string
      default_eol:
        type: string
        description: the model's EOL preference from creation (LF or CRLF)
  errors:
  - code: model-is-disposed
    status: 0
    retryable: false
  summary: TextModel.getValue with versionId; a disposed or unknown model throws 'Model is disposed!' (contract copied from editor).
- component: text-model
  name: set-value
  kind: function
  attributes:
    boundary: true
    owner: editor
  request:
    type: object
    required:
    - uri
    - value
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      value:
        type: string
        examples:
        - 'import { add } from ''./util'';

          console.log(add(1, 2));

          '
  response:
    type: object
    properties:
      uri:
        type: string
      version_id:
        type: integer
      alternative_version_id:
        type: integer
  errors:
  - code: model-is-disposed
    status: 0
    retryable: false
  - code: illegal-argument
    status: 0
    retryable: false
  summary: 'TextModel.setValue: replace the whole buffer, bump versionId (alternativeVersionId follows), drop the model''s undo history (EditStack.clear) and fire one flush onDidChangeContent; it pushes
    no undo stop. The one writer of document text for whole-content replacements (revert, external reload, setValue callers). (contract copied from editor).'
- component: editor-groups
  name: get-state
  kind: function
  attributes:
    boundary: true
    owner: workbench-shell
  response:
    type: object
    properties:
      groups:
        type: array
        items:
          $ref: WorkbenchEditorGroup
      active_group:
        type: integer
      group_mru:
        type: array
        items:
          type: integer
      next_group_id:
        type: integer
  summary: Read the groups of this window, normalised (missing preview/sticky/mru/locked filled in), the active group and the most-recently-active group order. (contract copied from workbench-shell).
- component: disk
  name: read-file
  kind: io
  attributes:
    boundary: true
    owner: platform-core
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
  errors:
  - code: file-not-found
    status: 0
    retryable: false
  summary: 'Shared io: provider readFile by URI. (contract copied from platform-core).'
- component: ext-host-language-features
  name: provide-workspace-symbols
  kind: rpc
  attributes:
    boundary: true
    owner: exthost
    shape: ExtHostLanguageFeaturesShape
  summary: 'ExtHostLanguageFeaturesShape.$provideWorkspaceSymbols(handle, search, token): the extension''s WorkspaceSymbolProvider (contract from extHost.protocol.ts; no owner definition yet).'
  request:
    type: object
    required:
    - handle
    - search
    properties:
      handle:
        type: integer
        examples:
        - 1
      search:
        type: string
        examples:
        - add
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response:
    type: object
    properties:
      cache_id:
        type: integer
      symbols:
        type: array
        maxItems: 2
        items:
          type: object
          properties:
            name:
              type: string
              examples:
              - add
            kind:
              type: integer
              examples:
              - 11
            location:
              type: object
              properties:
                uri:
                  type: string
                  examples:
                  - file:///work/app/src/util.ts
