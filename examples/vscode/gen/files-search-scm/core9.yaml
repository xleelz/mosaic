      - {flow: scm-accept-input, as: accept, input: {repository_id: scm1}}
    expect:
      - "steps.get.result.value.exists && steps.get.result.value.repository.provider.label == 'Git'"
      - "state['scm-view-service@w1'].active_repository == 'scm0' && 'scm1' in state['scm-view-service@w1'].visible"
      - "steps.accept.result.value.handled && trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == 'noop')"
