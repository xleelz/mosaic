scenarios:
  # ---------------- save ----------------
  - id: files-save-dirty-happy
    flow: files-save
    fixtures: [dirty-editor]
    steps:
      - {flow: files-save, as: save}
      - {flow: files-model-get, as: get}
      - {flow: files-history-read, as: hist}
    expect:
      - "steps.save.result.ok && steps.save.result.value.result.success"
      - "!steps.get.result.value.model.dirty && steps.get.result.value.model.saved_version_id == 2"
      - "calls['file-service.write-file'] == 1 && calls['format-on-save-participant.participate'] == 1 && calls['ext-host-save-participant.participate'] == 1"
      - "size(steps.hist.result.value.entries) == 1 && steps.hist.result.value.entries[0].source == 'default.source'"
      - "state['dirty-files-indicator@w1'].badge == 0"
  - id: files-save-format-on-save-participant
    flow: files-save
    fixtures: [format-on-save]
    steps:
      - {flow: files-save, as: save}
      - {flow: files-model-get, as: get}
    expect:
      - "steps.save.result.ok && !steps.get.result.value.model.dirty"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'format-on-save-participant.participate' && e.input.reason == 'explicit')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'format-on-save-participant.participate')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'file-service.write-file')[0].seq"
  - id: files-save-forced-when-clean
    flow: files-save
    fixtures: [one-window-folder]
    expect:
      - "result.ok && result.value.result.success"
      - "calls['file-service.write-file'] == 1"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-without-formatting-skips-participants
    flow: files-run-command
    fixtures: [dirty-editor]
    input: {command_id: workbench.action.files.saveWithoutFormatting, resource: "file:///work/app/src/main.ts"}
    expect:
      - "result.ok && calls['file-service.write-file'] == 1"
      - "calls['text-file-save-participant.participate'] == 0"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-no-model
    flow: files-save
    fixtures: [one-window-folder]
    input: {resource: "file:///work/app/src/util.ts"}
    expect:
      - "result.ok && !result.value.result.success"
      - "calls['text-file-models.save'] == 0"
  - id: files-save-untitled-asks-target
    flow: files-save
    fixtures: [one-window-folder]
    input: {resource: "untitled:Untitled-1"}
    expect:
      - "result.ok && !result.value.result.success"
      - "calls['file-dialog-service.pick-file-to-save'] == 1 && calls['file-service.write-file'] == 0"
  - id: files-save-readonly-model
    flow: files-save
    fixtures: [dirty-editor]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {readonly: true}}}
    expect:
      - "result.ok && !result.value.result.success"
      - "calls['file-service.write-file'] == 0 && state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-participant-cancels
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: ext-host-save-participant.participate, type: error, code: canceled}
    expect:
      - "result.ok && !result.value.result.success"
      - "calls['file-service.write-file'] == 0 && calls['format-on-save-participant.participate'] == 0"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-participant-error-is-logged
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: format-on-save-participant.participate, type: error, code: format-failed}
    expect:
      - "result.ok && result.value.result.success && calls['file-service.write-file'] == 1"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-as-new-target
    flow: files-run-command
    fixtures: [dirty-editor]
    steps:
      - {flow: files-run-command, as: saveas, input: {command_id: workbench.action.files.saveAs, resource: "file:///work/app/src/main.ts"}}
      - {flow: files-model-get, as: get, input: {resource: "file:///work/app/src/copy.ts"}}
    expect:
      - "steps.saveas.result.ok && steps.saveas.result.value.result.success"
      - "steps.get.result.value.exists && !steps.get.result.value.model.dirty && steps.get.result.value.model.value == \"import { add } from './util';\\nconsole.log(add(1, 2))\\n\""

  # ---------------- save conflicts & errors ----------------
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty && 'file:///work/app/src/copy.ts' in state['native-working-copy-history-service@w1'].entries"
  - id: files-save-conflict-newer-on-disk
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.write-file, type: error, code: file-modified-since}
    steps:
      - {flow: files-save, as: save}
      - {flow: files-model-get, as: get}
    expect:
      - "steps.save.result.ok && !steps.save.result.value.result.success"
      - "steps.get.result.value.model.dirty && steps.get.result.value.model.conflict && steps.get.result.value.model.error"
      - "state['text-file-save-error-handler@w1'].messages['file:///work/app/src/main.ts'].primary == ['compare', 'overwrite']"
      - "calls['notification-service.notify'] == 1 && calls['native-working-copy-history-service.add-entry'] == 0"
  - id: files-save-conflict-then-overwrite
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.write-file, type: error, code: file-modified-since, calls: [1]}
    steps:
      - {flow: files-save, as: save}
      - {flow: files-save-error-action, as: overwrite, input: {action: overwrite}}
      - {flow: files-model-get, as: get}
    expect:
      - "steps.overwrite.result.ok && steps.overwrite.result.value.saved"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'file-service.write-file')[1].input.etag == ''"
      - "!steps.get.result.value.model.dirty && !steps.get.result.value.model.conflict"
      - "!('file:///work/app/src/main.ts' in state['text-file-save-error-handler@w1'].messages)"
  - id: files-save-conflict-auto-save-ignored
    flow: files-save-model
    fixtures: [dirty-editor]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {conflict: true, error: true}}}
    expect:
      - "result.ok && result.value.skipped == 'conflict-or-error'"
      - "calls['text-file-service.write'] == 0 && state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-conflict-compare-then-save-again
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.write-file, type: error, code: file-modified-since}
    steps:
      - {flow: files-save, as: save}
      - {flow: files-save-error-action, as: compare, input: {action: compare}}
      - {flow: files-save, as: again}
    expect:
      - "calls['editor-service.open-editor'] >= 1 && state['text-file-save-error-handler@w1'].active_conflict_resolution_resource == 'file:///work/app/src/main.ts'"
      - "state['text-file-save-error-handler@w1'].messages['file:///work/app/src/main.ts'].kind == 'conflict-editor-help'"
  - id: files-save-conflict-help-dismissed
    flow: files-save
    fixtures: [dirty-editor]
    state:
      "text-file-save-error-handler@w1": {active_conflict_resolution_resource: "file:///work/app/src/main.ts", learn_more_ignored: true}
    faults:
      - {target: file-service.write-file, type: error, code: file-modified-since}
    expect:
      - "result.ok && !result.value.result.success"
      - "calls['notification-service.notify'] == 0 && !('file:///work/app/src/main.ts' in state['text-file-save-error-handler@w1'].messages)"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].conflict"
  - id: files-save-write-locked-then-unlock
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.write-file, type: error, code: file-write-locked, calls: [1]}
    steps:
      - {flow: files-save, as: save}
      - {flow: files-save-error-action, as: unlock, input: {action: unlock}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notification-service.notify' && e.input.actions[0] == 'unlock' && e.input.message == 'readonly-save-error')"
      - "steps.unlock.result.value.saved && trace.filter(e, e.type == 'call.start' && e.interface == 'file-service.write-file')[1].input.unlock"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-permission-denied-then-sudo
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.write-file, type: error, code: file-permission-denied}
    steps:
      - {flow: files-save, as: save}
      - {flow: files-save-error-action, as: sudo, input: {action: save-elevated}}
    expect:
      - "state['text-file-save-error-handler@w1'].messages == {} && steps.sudo.result.value.saved"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notification-service.notify' && e.input.actions[0] == 'save-elevated' && e.input.message == 'permission-denied-save-error-sudo')"
      - "calls['elevated-file-service.write-file-elevated'] == 1"
  - id: files-save-locked-after-unlock-offers-sudo
    flow: files-save-error-action
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.write-file, type: error, code: file-write-locked}
    input: {action: unlock}
    expect:
      - "result.ok && !result.value.saved"
      - "state['text-file-save-error-handler@w1'].messages['file:///work/app/src/main.ts'].kind == 'readonly-save-error-sudo'"
      - "state['text-file-save-error-handler@w1'].messages['file:///work/app/src/main.ts'].primary[0] == 'save-elevated'"
  - id: files-save-generic-error-retry
    flow: files-save
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.write-file, type: error, code: file-too-large, calls: [1]}
    steps:
      - {flow: files-save, as: save}
      - {flow: files-save-error-action, as: retry, input: {action: retry}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notification-service.notify' && e.input.actions == ['retry', 'save-as', 'revert'])"
      - "steps.retry.result.value.saved && !state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-error-revert-and-save-as-actions
    flow: files-save-error-action
    fixtures: [dirty-editor]
    steps:
      - {flow: files-save-error-action, as: saveas, input: {action: save-as}}
      - {flow: files-save-error-action, as: revert, input: {action: revert}}
    expect:
      - "steps.saveas.result.value.saved && 'file:///work/app/src/copy.ts' in state['text-file-models@w1'].models"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty && calls['file-service.read-file'] == 1"

  # ---------------- auto save model path ----------------
  - id: files-save-model-auto-dirty
    flow: files-save-model
    fixtures: [auto-save-after-delay]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {value: "y\n", version_id: 3, saved_version_id: 2, dirty: true, language_id: typescript, mtime: 1793318400000}}}
    steps:
      - {flow: files-save-model, as: save}
      - {flow: files-model-get, as: get}
    expect:
      - "steps.save.result.value.saved && !steps.get.result.value.model.dirty"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'native-working-copy-history-service.add-entry' && e.input.source == 'autoSave.source')"
  - id: files-save-model-not-dirty-skipped
    flow: files-save-model
    fixtures: [one-window-folder]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {value: "x\n", version_id: 1, saved_version_id: 1, dirty: false, language_id: typescript, mtime: 1793318400000}}}
    expect:
      - "result.ok && result.value.skipped == 'not-dirty' && calls['text-file-service.write'] == 0"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-save-model-not-resolved
    flow: files-save-model
    fixtures: [one-window-folder]
    input: {resource: "file:///work/app/package.json"}
    expect:
      - "result.ok && result.value.skipped == 'not-resolved'"
      - "!('file:///work/app/package.json' in state['text-file-models@w1'].models)"
  - id: files-local-history-disabled
    flow: files-save
    fixtures: [dirty-editor]
    config: {workbench-local-history-enabled: false}
    steps:
      - {flow: files-save, as: save}
      - {flow: files-history-read, as: hist}
    expect:
      - "steps.save.result.ok && size(steps.hist.result.value.entries) == 0"
      - "calls['native-working-copy-history-service.add-entry'] == 0"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty && state['native-working-copy-history-service@w1'].entries == {}"
  - id: files-local-history-too-large-and-untracked-scheme
    flow: files-save-model
    fixtures: [one-window-folder]
    config: {workbench-local-history-max-file-size: 0}
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {value: "big\n", version_id: 2, saved_version_id: 1, dirty: true, language_id: typescript, mtime: 1793318400000}, "vscode-remote://ssh/a.ts": {value: "r\n", version_id: 2, saved_version_id: 1, dirty: true, language_id: typescript, mtime: 1793318400000}}}
    steps:
      - {flow: files-save-model, as: big, input: {options: {reason: explicit, force: false, skip_save_participants: false}}}
      - {flow: files-save-model, as: remote, input: {resource: "vscode-remote://ssh/a.ts", options: {reason: explicit, force: false, skip_save_participants: false}}}
      - {flow: files-history-read, as: hist}
    expect:
      - "steps.big.result.value.saved"
      - "size(steps.hist.result.value.entries) == 0 && calls['native-working-copy-history-service.add-entry'] == 0"

  # ---------------- dirty tracking & backups ----------------
      - "state['native-working-copy-history-service@w1'].entries == {} && !state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-content-change-marks-dirty-and-backs-up
    flow: files-content-change
    fixtures: [one-window-folder]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {value: "a\n", version_id: 1, saved_version_id: 1, dirty: false, language_id: typescript, mtime: 1793318400000}}}
    steps:
      - {flow: files-content-change, as: edit, input: {value: "ab\n", alternative_version_id: 2}}
      - {flow: files-backups-read, as: backups}
    expect:
      - "steps.edit.result.value.dirty && steps.edit.result.value.version_id == 2"
      - "steps.backups.result.value.resources == ['file:///work/app/src/main.ts']"
      - "state['native-working-copy-backup-service@w1'].backups['file:///work/app/src/main.ts'].content == 'ab\\n'"
      - "state['dirty-files-indicator@w1'].badge == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.options.inactive)"
  - id: files-content-change-undo-to-saved
    flow: files-content-change
    fixtures: [dirty-editor]
    state:
      "native-working-copy-backup-service@w1": {backups: {"file:///work/app/src/main.ts": {content: "old", version_id: 1, meta: {}}}}
    input: {value: "import { add } from './util';\nconsole.log(add(1, 2));\n", alternative_version_id: 1}
    expect:
      - "result.ok && !result.value.dirty && result.value.version_id == 3"
      - "state['native-working-copy-backup-service@w1'].backups == {}"
      - "calls['text-file-save-error-handler.on-file-saved-or-reverted'] == 1"
  - id: files-content-change-short-auto-save
    flow: files-content-change
    fixtures: [auto-save-after-delay]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {value: "a\n", version_id: 1, saved_version_id: 1, dirty: false, language_id: typescript, mtime: 1793318400000}}}
    input: {value: "ab\n", alternative_version_id: 2}
    expect:
      - "result.value.dirty && state['dirty-files-indicator@w1'].badge == 0"
      - "calls['editor-service.open-editor'] == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'native-working-copy-backup-tracker.run-scheduled-backup')[0].t >= 2000"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty && !('file:///work/app/src/main.ts' in state['native-working-copy-backup-service@w1'].backups)"
  - id: files-content-change-unknown-model
    flow: files-content-change
    fixtures: [one-window-folder]
    input: {resource: "file:///work/app/package.json", value: "x"}
    expect:
      - "result.ok && result.value.version_id == 0"
      - "!('file:///work/app/package.json' in state['text-file-models@w1'].models)"
  - id: files-content-change-readonly
    flow: files-content-change
    fixtures: [one-window-folder]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {value: "a\n", version_id: 1, saved_version_id: 1, dirty: false, language_id: typescript, mtime: 1793318400000, readonly: true}}}
    input: {value: "b\n", alternative_version_id: 2}
    expect:
      - "result.ok && !result.value.dirty"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].version_id == 2"
  - id: files-backup-superseded-by-newer-schedule
    flow: files-content-change
    fixtures: [one-window-folder]
    state:
      "text-file-models@w1": {models: {"file:///work/app/src/main.ts": {value: "a\n", version_id: 1, saved_version_id: 1, dirty: false, language_id: typescript, mtime: 1793318400000}}}
    steps:
      - {flow: files-content-change, as: e1, input: {value: "ab\n", alternative_version_id: 2}}
      - {flow: files-save-model, as: save, input: {options: {reason: explicit, force: false, skip_save_participants: false}}}
    expect:
      - "steps.save.result.value.saved && state['native-working-copy-backup-service@w1'].backups == {}"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'native-working-copy-backup-service.discard-backup')"

  # ---------------- revert ----------------
  - id: files-revert-dirty
    flow: files-revert
    fixtures: [dirty-editor]
    steps:
      - {flow: files-revert, as: revert}
      - {flow: files-model-get, as: get}
    expect:
      - "steps.revert.result.ok && !steps.get.result.value.model.dirty"
      - "calls['file-service.read-file'] == 1 && calls['text-file-save-error-handler.on-file-saved-or-reverted'] == 1"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - id: files-revert-no-model
    flow: files-revert
    fixtures: [one-window-folder]
    input: {resource: "file:///work/app/src/util.ts"}
    expect:
      - "result.ok && !result.value.result.reverted && calls['text-file-models.revert'] == 0"
      - "!('file:///work/app/src/util.ts' in state['text-file-models@w1'].models)"
  - id: files-revert-deleted-file-is-ignored
    flow: files-revert
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.read-file, type: error, code: file-not-found}
    expect:
      - "result.ok && result.value.result.reverted"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty && state['text-file-models@w1'].models['file:///work/app/src/main.ts'].orphaned"
  - id: files-revert-error-restores-dirty
    flow: files-revert
    fixtures: [dirty-editor]
    faults:
      - {target: file-service.read-file, type: error, code: file-permission-denied}
    expect:
      - "!result.ok && result.error.code == 'file-permission-denied'"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"

  # ---------------- resolve ----------------
  - id: files-resolve-new-model
    flow: files-resolve
    fixtures: [one-window-folder]
    steps:
      - {flow: files-resolve, as: open}
      - {flow: files-model-get, as: get, input: {resource: "file:///work/app/src/util.ts"}}
    expect:
      - "steps.get.result.value.exists && !steps.get.result.value.model.dirty && steps.get.result.value.model.version_id == 1"
      - "steps.get.result.value.model.language_id == 'typescript' && calls['working-copy-service.register-working-copy'] == 1"
      - "'file:///work/app/src/util.ts#' in state['working-copy-service@w1'].working_copies"
  - id: files-resolve-existing-no-reload
    flow: files-resolve
    fixtures: [dirty-editor]
    input: {resource: "file:///work/app/src/main.ts"}
    expect:
      - "result.ok && result.value.dirty && calls['file-service.read-file'] == 0"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].version_id == 2"
  - id: files-resolve-dirty-never-reloads
    flow: files-resolve
    fixtures: [dirty-editor]
    input: {resource: "file:///work/app/src/main.ts", reload: true}
    expect:
      - "result.ok && result.value.dirty && calls['file-service.read-file'] == 0"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].version_id == 2"
  - id: files-resolve-binary-refused
    flow: files-resolve
    fixtures: [one-window-folder]
    choices: {text-file-service.read.decode: binary}
    expect:
      - "!result.ok && result.error.code == 'file-is-binary'"
      - "!('file:///work/app/src/util.ts' in state['text-file-models@w1'].models)"
  - id: files-resolve-not-found
    flow: files-resolve
    fixtures: [one-window-folder]
    faults:
      - {target: file-service.read-file, type: error, code: file-not-found}
    expect:
      - "!result.ok && result.error.code == 'file-not-found'"
      - "!('file:///work/app/src/util.ts' in state['text-file-models@w1'].models)"
  - id: files-resolve-from-backup
    flow: files-resolve
    fixtures: [one-window-folder]
    state:
      "native-working-copy-backup-service@w1": {backups: {"file:///work/app/src/util.ts": {content: "restored\n", version_id: 3, meta: {mtime: 5}}}}
    steps:
