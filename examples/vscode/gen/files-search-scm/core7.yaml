interfaces:
  # ======================= search =======================
  - component: search-view
    name: trigger-query-change
    kind: function
    summary: "SearchView.triggerQueryChange/_onQueryChanged: an empty pattern clears the results; otherwise builds the text query (maxResults from search.maxResults), validates the folders, saves the history and runs the search model."
    sources: ["src/vs/workbench/contrib/search/browser/searchView.ts:1589-1711"]
    request:
      type: object
      properties:
        query: {type: string, examples: [add]}
        replace: {type: string, default: ""}
        includes: {type: string, default: ""}
        excludes: {type: string, default: ""}
        triggered_on_type: {type: boolean, default: false}
    response: {type: object, properties: {result_count: {type: integer}, file_count: {type: integer}, limit_hit: {type: boolean}}}
    behavior:
      - set: {vars.query: "= has(input.query) ? input.query : state.query"}
      - if: "vars.query == ''"
        then:
          - title: Empty pattern clears results and message
            source: "src/vs/workbench/contrib/search/browser/searchView.ts:1631-1636"
            set: {state.query: "", state.result_count: 0, state.file_count: 0, state.limit_hit: false, state.message: ""}
          - return: {result_count: 0, file_count: 0, limit_hit: false}
      - set:
          state.query: "= vars.query"
          state.includes: "= has(input.includes) ? input.includes : state.includes"
          state.excludes: "= has(input.excludes) ? input.excludes : state.excludes"
          state.replace: "= has(input.replace) ? input.replace : state.replace"
      - title: Remember the query in the search history
        source: "src/vs/workbench/contrib/search/common/searchHistoryService.ts:60-67"
        call: search-history-service.save
        input: {search: "= [vars.query]", include: "= state.includes == '' ? [] : [state.includes]", exclude: "= state.excludes == '' ? [] : [state.excludes]"}
      - title: Build the text query from the inputs and search.maxResults, then search
        source: "src/vs/workbench/contrib/search/browser/searchView.ts:1667-1705"
        call: search-model.search
        input:
          query:
            pattern: "= vars.query"
            is_regex: "= state.options.is_regex"
            is_case_sensitive: "= state.options.is_case_sensitive"
            is_word_match: "= state.options.is_word_match"
            folders: ["file:///work/app"]
            include_pattern: "= state.includes"
            exclude_pattern: "= state.excludes"
            max_results: "= config['search-max-results']"
        as: searched
      - set:
          state.result_count: "= sum(vars.searched.value.results.map(r, r.matches))"
          state.file_count: "= size(vars.searched.value.results)"
          state.limit_hit: "= vars.searched.value.limit_hit"
      - return: {result_count: "= state.result_count", file_count: "= state.file_count", limit_hit: "= state.limit_hit"}

  - component: search-view
    name: replace-all
    kind: function
    summary: "SearchView.replaceAll: nothing without results; confirm Replace All, then replace every match through the search result (replace service) and report."
    sources: ["src/vs/workbench/contrib/search/browser/searchView.ts:812-856"]
    request: {type: object, properties: {replace: {type: string, default: "sum"}}}
    response: {type: object, properties: {replaced: {type: integer}}}
    behavior:
      - if: "state.result_count == 0"
        then:
          - title: No results, nothing to replace
            source: "src/vs/workbench/contrib/search/browser/searchView.ts:813-815"
            return: {replaced: 0}
      - title: Confirm 'Replace N occurrences across M files'
        source: "src/vs/workbench/contrib/search/browser/searchView.ts:831-837"
        choice: confirm
        default: confirmed
        options:
          confirmed: []
          canceled:
            - return: {replaced: 0}
      - call: search-model.get-results
        as: results
      - title: Replace all matches through the replace service
        source: "src/vs/workbench/contrib/search/browser/searchView.ts:838-848"
        call: replace-service.replace
        input: {files: "= vars.results.value.results", pattern: "= state.query", replace: "= has(input.replace) ? input.replace : state.replace"}
        as: replaced
      - set: {state.message: replaced, state.result_count: 0, state.file_count: 0}
      - return: {replaced: "= vars.replaced.value.edits"}

  - component: search-view
    name: set-option
    kind: function
    summary: "Toggle a search input option (case, whole word, regex, preserve case) and re-run the query."
    sources: ["src/vs/workbench/contrib/search/browser/searchView.ts:1471-1491"]
    request: {type: object, required: [option], properties: {option: {type: string, enum: [is_case_sensitive, is_word_match, is_regex, preserve_case], default: is_case_sensitive}}}
    behavior:
      - set:
          state.options: "= merge(state.options, {input.option: !state.options[input.option]})"
      - when: "state.query != ''"
        call: search-view.trigger-query-change
        input: {}
      - return: {options: "= state.options"}

  - component: search-view
    name: clear-search-results
    kind: function
    summary: "SearchView.clearSearchResults: clears the result tree, inputs (optionally) and the message."
    sources: ["src/vs/workbench/contrib/search/browser/searchView.ts:1290-1320"]
    request: {type: object}
    behavior:
      - set: {state.result_count: 0, state.file_count: 0, state.limit_hit: false, state.message: ""}
      - call: search-model.clear
      - return: {cleared: true}

  - component: search-model
    name: search
    kind: function
    summary: "SearchModelImpl.search/doSearch: cancels the running search, searches notebooks and text (open editors synchronously, closed files through providers) and merges both."
    sources: ["src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:213-260", "src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:155-204"]
    request: {type: object, required: [query], properties: {query: {$ref: SearchTextQuery}, token: {type: object, properties: {canceled: {type: boolean, default: false}}}}}
    response: SearchComplete
    behavior:
      - set: {state.searches: "= state.searches + 1"}
      - title: Notebook search first, so text search can skip notebook files
        source: "src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:172"
        call: notebook-search-service.notebook-search
        input: {query: "= input.query"}
        as: nb
      - title: Text search split into open editor (sync) and provider (async) results
        source: "src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:173-179"
        call: search-service.text-search-split-sync-async
        input: {query: "= input.query", token: "= has(input.token) ? input.token : {'canceled': false}"}
        as: text
      - set:
          state.results: "= vars.text.value.results + vars.nb.value.results"
          state.limit_hit: "= vars.text.value.limit_hit || vars.nb.value.limit_hit"
      - return: {results: "= state.results", limit_hit: "= state.limit_hit"}

  - component: search-model
    name: get-results
    kind: function
    summary: "The current search result tree (file matches)."
    sources: ["src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:25"]
    request: {type: object}
    response: SearchComplete
    behavior:
      - return: {results: "= state.results", limit_hit: "= state.limit_hit"}

  - component: search-model
    name: clear
    kind: function
    summary: "Clears the search result."
    sources: ["src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:25"]
    request: {type: object}
    behavior:
      - set: {state.results: [], state.limit_hit: false}

  - component: search-service
    name: text-search-split-sync-async
    kind: function
    summary: "SearchService.textSearchSplitSyncAsync + doSearch: match open editor models synchronously, activate onSearch:<scheme> and onSearch:file, check the folders exist, then query the text search provider per scheme; provider results for files already matched in open editors are dropped."
    sources: ["src/vs/workbench/services/search/common/searchService.ts:116-163", "src/vs/workbench/services/search/common/searchService.ts:173-222"]
    request: {type: object, required: [query], properties: {query: {$ref: SearchTextQuery}, token: {type: object, properties: {canceled: {type: boolean, default: false}}}}}
    response: SearchComplete
    errors:
      - {code: canceled, status: 0, retryable: false}
    behavior:
      - title: Open editor results first (in-memory models)
        source: "src/vs/workbench/services/search/common/searchService.ts:127-136"
        call: text-file-models.find-matches
        input: {pattern: "= input.query.pattern", max_results: "= has(input.query.max_results) ? input.query.max_results : config['search-max-results']"}
        as: open_editors
      - set:
          vars.schemes: "= input.query.folders.map(f, f.substring(0, f.indexOf(':')))"
      - title: Activate search providers for every scheme in the query plus onSearch:file
        source: "src/vs/workbench/services/search/common/searchService.ts:176-180"
        parallel: "= vars.schemes.map(s, 'onSearch:' + s) + ['onSearch:file']"
        as: activation_event
        steps:
          - call: extension-service.activate-by-event
            input: {activation_event: "= vars.activation_event", activation_kind: normal}
        join: {need: all}
      - if: "has(input.token) && input.token.canceled"
        then:
          - title: Canceled while waiting for extensions
            source: "src/vs/workbench/services/search/common/searchService.ts:186-189"
            fail: {code: canceled, message: Canceled}
      - title: Drop folders that do not exist
        source: "src/vs/workbench/services/search/common/searchService.ts:197-198"
        parallel: "= input.query.folders"
        as: folder
        steps:
          - call: file-service.exists
            input: {resource: "= vars.folder"}
            as: ex
          - return: "= vars.ex.value.exists"
        join: {need: all}
        as_result: exists
      - set:
          vars.folders: "= vars.exists.results.filter(r, r.ok && r.value).map(r, r.item)"
      - if: "size(vars.folders) == 0"
        then:
          - return: {results: "= vars.open_editors.value.results", limit_hit: "= vars.open_editors.value.limit_hit"}
      - set:
          vars.scheme: "= vars.folders[0].substring(0, vars.folders[0].indexOf(':'))"
      - if: "!(vars.scheme in state.text_providers) || !state.text_providers[vars.scheme]"
        then:
          - title: No provider registered for the scheme and none for another scheme; the search waits for one to register
            source: "src/vs/workbench/services/search/common/searchService.ts:288-306"
            return: {results: "= vars.open_editors.value.results", limit_hit: "= vars.open_editors.value.limit_hit", pending: true}
      - title: Query the provider (the extension host's text search) for this scheme's folders
        source: "src/vs/workbench/services/search/common/searchService.ts:316-327"
        call: ext-host-search.provide-text-search-results
        on: "= 'eh' + self.substring(1)"
        input: {scheme: "= vars.scheme", query: "= merge(input.query, {'folders': vars.folders})"}
        as: provided
      - set:
          vars.open_resources: "= vars.open_editors.value.results.map(r, r.resource)"
      - title: Merge, keeping open editor results over provider results for the same file
        source: "src/vs/workbench/services/search/common/searchService.ts:141-150"
        return:
          results: "= vars.open_editors.value.results + vars.provided.value.results.filter(r, !(r.resource in vars.open_resources))"
          limit_hit: "= vars.open_editors.value.limit_hit || vars.provided.value.limit_hit"

  - component: search-service
    name: register-search-result-provider
    kind: function
    summary: "SearchService.registerSearchResultProvider: registers a file or text provider for a scheme (resolving searches waiting for it)."
    sources: ["src/vs/workbench/services/search/common/searchService.ts:54-80"]
    request: {type: object, required: [scheme, type], properties: {scheme: {type: string, default: file}, type: {type: string, enum: [file, text], default: text}}}
    behavior:
      - if: "input.type == 'text'"
        then:
          - set: {state.text_providers: "= merge(state.text_providers, {input.scheme: true})"}
        else:
          - set: {state.file_providers: "= merge(state.file_providers, {input.scheme: true})"}
      - return: {registered: true}

  - component: search-history-service
    name: save
    kind: function
    summary: "SearchHistoryService.save: stores the history JSON in workspace storage, or removes the key when empty."
    sources: ["src/vs/workbench/contrib/search/common/searchHistoryService.ts:60-67"]
    request: {type: object, properties: {search: {type: array, items: {type: string}}, include: {type: array, items: {type: string}}, exclude: {type: array, items: {type: string}}}}
    behavior:
      - set:
          state.history: "= merge(state.history, {'search': input.search, 'include': input.include, 'exclude': input.exclude})"
      - call: storage-service.store
        input: {key: workbench.search.history, value: "= state.history.search.join('\\n')", scope: workspace}
      - return: {saved: true}

  - component: search-history-service
    name: load
    kind: function
    summary: "SearchHistoryService.load: parses the stored history, {} when absent or invalid."
    sources: ["src/vs/workbench/contrib/search/common/searchHistoryService.ts:45-58"]
    request: {type: object}
    behavior:
      - return: "= state.history"

  - component: search-history-service
    name: clear-history
    kind: function
    summary: "SearchHistoryService.clearHistory: removes the stored history and fires onDidClearHistory."
    sources: ["src/vs/workbench/contrib/search/common/searchHistoryService.ts:40-43"]
    request: {type: object}
    behavior:
      - set: {state.history: {}}
      - call: storage-service.remove
        input: {key: workbench.search.history, scope: workspace}
      - return: {cleared: true}

  - component: replace-service
    name: replace
    kind: function
    summary: "ReplaceService.replace: one bulk edit for all matches, then save every touched text file model (replace save source)."
    sources: ["src/vs/workbench/contrib/search/browser/replaceService.ts:115-138"]
    request: {type: object, properties: {files: {type: array, items: {type: object}}, pattern: {type: string}, replace: {type: string}}}
    response: {type: object, properties: {edits: {type: integer}}}
    behavior:
      - title: Apply all replacements as one bulk edit
        source: "src/vs/workbench/contrib/search/browser/replaceService.ts:116-117"
        call: bulk-edit-service.apply
        input: {edits: "= input.files.map(f, {'type': 'text', 'op': 'edit', 'resource': f.resource, 'text': input.replace})", show_preview: false, respect_auto_save_config: false, label: replace}
      - title: Save each replaced text file model
        source: "src/vs/workbench/contrib/search/browser/replaceService.ts:132-133"
        parallel: "= input.files.map(f, f.resource)"
        as: r
        steps:
          - call: text-file-models.save
            input: {resource: "= vars.r", options: {reason: explicit}}
            on_error: continue
        join: {need: all}
      - return: {edits: "= sum(input.files.map(f, f.matches))"}

  - component: notebook-search-service
    name: notebook-search
    kind: function
    summary: "NotebookSearchService.notebookSearch: matches in open notebooks and the files text search should skip; nothing when no notebooks are open."
    sources: ["src/vs/workbench/contrib/search/browser/notebookSearch/notebookSearchService.ts:35-80"]
    request: {type: object, properties: {query: {$ref: SearchTextQuery}}}
    response: SearchComplete
    behavior:
      - return: {results: [], limit_hit: false}

  - component: local-file-search-worker
    name: bootstrap
    kind: function
    summary: "localFileSearchMain bootstraps the web worker with the local file search implementation."
    sources: ["src/vs/workbench/services/search/worker/localFileSearchMain.ts:9"]
    request: {type: object}
    behavior:
      - set: {state.started: true}
      - return: {started: true}

  # ======================= scm =======================
  - component: scm-service
    name: register-scm-provider
    kind: function
    summary: "SCMService.registerSCMProvider: one repository per provider id (a duplicate throws), with an input box; fires onDidAddRepository."
    sources: ["src/vs/workbench/contrib/scm/common/scmService.ts:389-424"]
    request: ScmProvider
    response: {type: object, properties: {id: {type: string}}}
    errors:
      - {code: scm-provider-already-exists, status: 0, retryable: false, summary: "SCM Provider ${id} already exists."}
    behavior:
      - if: "input.id in state.repositories"
        then:
          - title: Provider ids are unique
            source: "src/vs/workbench/contrib/scm/common/scmService.ts:392-394"
            fail: {code: scm-provider-already-exists, message: "= 'SCM Provider ' + input.id + ' already exists.'"}
      - title: Create the repository and its input
        source: "src/vs/workbench/contrib/scm/common/scmService.ts:410-411"
        set:
          state.repositories: "= merge(state.repositories, {input.id: {'provider': input, 'input': {'value': '', 'history': [''], 'index': 0}}})"
      - publish: scm-service.on-did-add-repository
        input: {id: "= input.id"}
        delivery: sync
      - return: {id: "= input.id"}

  - component: scm-service
    name: get-repository
    kind: function
    summary: "SCMService.getRepository by id."
    sources: ["src/vs/workbench/contrib/scm/common/scmService.ts:426-433"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [scm0]}}}
    response: {type: object, properties: {exists: {type: boolean}, repository: {type: object}}}
    behavior:
      - return: "= input.id in state.repositories ? {'exists': true, 'repository': state.repositories[input.id]} : {'exists': false}"

  - component: scm-service
    name: input-set-value
    kind: function
    summary: "SCMInput.setValue: no-op for the same value; a non-transient value is added to the input history."
    sources: ["src/vs/workbench/contrib/scm/common/scmService.ts:139-152"]
    request: {type: object, required: [repository_id, value], properties: {repository_id: {type: string, examples: [scm0]}, value: {type: string, examples: ["Fix add"]}, transient: {type: boolean, default: false}}}
    errors:
      - {code: repository-not-found, status: 0, retryable: false}
    behavior:
      - if: "!(input.repository_id in state.repositories)"
        then: [{fail: {code: repository-not-found, message: "= 'unknown repository ' + input.repository_id"}}]
      - set: {vars.inp: "= state.repositories[input.repository_id].input"}
      - if: "vars.inp.value == input.value"
        then:
          - title: Same value, nothing changes
            source: "src/vs/workbench/contrib/scm/common/scmService.ts:140-142"
            return: {value: "= input.value"}
      - set:
          vars.history: "= input.transient ? vars.inp.history : vars.inp.history.slice(0, size(vars.inp.history) - 1) + [vars.inp.value, input.value]"
      - title: Replace the last history entry and append the new value (unless transient)
        source: "src/vs/workbench/contrib/scm/common/scmService.ts:144-151"
        set:
          state.repositories: "= merge(state.repositories, {input.repository_id: {'input': {'value': input.value, 'history': vars.history, 'index': size(vars.history) - 1}}})"
      - return: {value: "= input.value"}

  - component: scm-service
    name: input-show-history-value
    kind: function
    summary: "SCMInput.showPreviousHistoryValue / showNextHistoryValue: move through the input history (transient set)."
    sources: ["src/vs/workbench/contrib/scm/common/scmService.ts:154-176"]
    request: {type: object, required: [repository_id], properties: {repository_id: {type: string, examples: [scm0]}, direction: {type: string, enum: [previous, next], default: previous}}}
    errors:
      - {code: repository-not-found, status: 0, retryable: false}
    behavior:
      - if: "!(input.repository_id in state.repositories)"
        then: [{fail: {code: repository-not-found, message: "= 'unknown repository ' + input.repository_id"}}]
      - set: {vars.inp: "= state.repositories[input.repository_id].input"}
      - set:
          vars.index: "= input.direction == 'previous' ? (vars.inp.index > 0 ? vars.inp.index - 1 : 0) : (vars.inp.index < size(vars.inp.history) - 1 ? vars.inp.index + 1 : vars.inp.index)"
      - set:
          state.repositories: "= merge(state.repositories, {input.repository_id: {'input': {'value': vars.inp.history[vars.index], 'index': vars.index}}})"
      - return: {value: "= vars.inp.history[vars.index]"}

  - component: scm-service
    name: input-clear-validation
    kind: function
    summary: "SCMInput.clearValidation: fires onDidClearValidation."
    sources: ["src/vs/workbench/contrib/scm/common/scmService.ts:89-91"]
    request: {type: object, properties: {repository_id: {type: string, examples: [scm0]}}}
    behavior:
      - return: {cleared: true}

  - {component: scm-service, name: on-did-add-repository, kind: event, summary: "SCMService.onDidAddRepository.", sources: ["src/vs/workbench/contrib/scm/common/scmService.ts:421"], request: {type: object, properties: {id: {type: string}}}}

  - component: scm-view-service
    name: on-did-add-repository
    kind: event
    subscribe: [scm-service.on-did-add-repository]
    summary: "SCMViewService.onDidAddRepository: makes the repository visible and, when none is active yet, active."
    sources: ["src/vs/workbench/contrib/scm/browser/scmViewService.ts:109"]
    request: {type: object, properties: {id: {type: string}}}
    behavior:
      - set:
          state.visible: "= state.visible + [input.id]"
          state.active_repository: "= state.active_repository == '' ? input.id : state.active_repository"

  - component: scm-view-service
    name: focus
    kind: function
    summary: "SCMViewService.focus: makes a repository the active one."
    sources: ["src/vs/workbench/contrib/scm/browser/scmViewService.ts:109"]
    request: {type: object, properties: {repository_id: {type: string, examples: [scm0]}}}
    behavior:
      - set: {state.active_repository: "= input.repository_id"}
      - return: {active: "= state.active_repository"}

  - component: scm-view-service
    name: get-active-repository
    kind: function
    summary: "SCMViewService.activeRepository."
    sources: ["src/vs/workbench/contrib/scm/browser/scmViewService.ts:109"]
    request: {type: object}
    behavior:
      - return: {repository_id: "= state.active_repository"}

  # ======================= merge editor =======================
  - component: merge-editor-actions
    name: accept-merge
    kind: function
    summary: "AcceptMerge.runWithMergeEditor: with unhandled conflicts ask to complete anyway; accept saves the result file and closes the merge editor."
    sources: ["src/vs/workbench/contrib/mergeEditor/browser/commands/commands.ts:639-662", "src/vs/workbench/contrib/mergeEditor/browser/mergeEditorInputModel.ts:161-166"]
    request: {type: object, properties: {result_uri: {type: string, default: "file:///work/app/src/main.ts"}}}
    response: {type: object, properties: {successful: {type: boolean}}}
    behavior:
      - if: "state.unhandled_conflicts > 0"
        then:
          - title: Unhandled conflicts, ask to Complete with Conflicts
            source: "src/vs/workbench/contrib/mergeEditor/browser/commands/commands.ts:643-655"
            choice: complete_with_conflicts
            default: confirmed
            options:
              confirmed: []
              canceled:
                - return: {successful: false}
      - title: Accept saves the result through the text file service
        source: "src/vs/workbench/contrib/mergeEditor/browser/mergeEditorInputModel.ts:165"
        call: text-file-service.save
        input: {resource: "= input.result_uri"}
      - call: editor-service.close-editor
        input: {resource: "= input.result_uri"}
      - return: {successful: true}
