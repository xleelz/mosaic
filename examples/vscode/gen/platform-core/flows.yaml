    fixtures: [one-window-folder]
    steps:
      - {interface: file-service.move, caller: workbench, as: same, input: {source: "file:///work/app/README.md", target: "file:///work/app/README.md"}}
      - {interface: file-service.move, caller: workbench, as: over, input: {source: "file:///work/app/src/util.ts", target: "file:///work/app/src/main.ts", overwrite: true}}
    expect:
      - "steps.same.result.ok && steps.same.result.value.size == 6"
      - "steps.over.result.ok && state.disk.files['file:///work/app/src/main.ts'].size == 60"
  - id: platform-core-move-file-refused
    name: canMove refuses a scheme without a provider and a readonly provider
    fixtures: [one-window-folder]
    state: {file-service: {providers: {vscode-remote: {readonly: true, trash: false}}}}
    steps:
      - {interface: file-service.can-move, caller: workbench, as: nopro, input: {source: "untitled:Untitled-1", target: "file:///work/app/a.ts"}}
      - {interface: file-service.can-move, caller: workbench, as: ro, input: {source: "file:///work/app/README.md", target: "vscode-remote://ssh-remote+box/README.md"}}
    expect:
      - "steps.nopro.result.value.error_code == 'no-file-system-provider-found' && steps.ro.result.value.error_code == 'file-permission-denied'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'disk.write-file')"
  - id: platform-core-redo-after-undo
    name: Redo moves the undone element back to the past
    fixtures: [one-window-folder]
    state: {undo-redo-service: {stacks: {"file:///work/app/src/main.ts": {past: [Typing], future: [Paste]}}}}
    steps:
      - {interface: undo-redo-service.redo, caller: editor, as: redo, input: {resource: "file:///work/app/src/main.ts"}}
      - {interface: undo-redo-service.redo, caller: editor, as: again, input: {resource: "file:///work/app/src/main.ts"}}
      - {flow: pc-can-undo, as: read}
    expect:
      - "steps.redo.result.value.redone == 'Paste' && steps.again.result.value.redone == null"
      - "!steps.read.result.value.can_redo"
      - "state['undo-redo-service@w1'].stacks['file:///work/app/src/main.ts'].past == ['Typing', 'Paste']"
  - id: platform-core-marker-statistics
    name: getStatistics counts the stored markers by severity
    fixtures: [one-window-folder]
    state:
      marker-service: {data: {"file:///work/app/src/main.ts": {typescript: [{owner: typescript, resource: "file:///work/app/src/main.ts", severity: 8, message: "Cannot find name 'ad'.", start_line_number: 2, end_line_number: 2}, {owner: typescript, resource: "file:///work/app/src/main.ts", severity: 1, message: "Hint.", start_line_number: 1, end_line_number: 1}]}}}
    steps:
      - {interface: marker-service.get-statistics, caller: workbench, as: stats}
    expect:
      - "steps.stats.result.value.errors == 1 && steps.stats.result.value.unknowns == 1 && steps.stats.result.value.warnings == 0"
      - "size(state['marker-service@w1'].data['file:///work/app/src/main.ts'].typescript) == 2"
  - id: platform-core-logger-set-log-level
    name: A per-logger level is set, an unknown logger is ignored, and the global level changes
    fixtures: [one-window-folder]
    state: {logger-service: {loggers: {"file:///logs/window1/tasks.log": {}}}}
    steps:
      - {interface: logger-service.set-log-level, caller: workbench, as: one, input: {resource: "file:///logs/window1/tasks.log", log_level: debug}}
      - {interface: logger-service.set-log-level, caller: workbench, as: unknown, input: {resource: "file:///logs/window1/missing.log", log_level: debug}}
      - {interface: logger-service.set-log-level, caller: workbench, as: global, input: {log_level: trace}}
    expect:
      - "steps.one.result.value.changed && !steps.unknown.result.value.changed && steps.global.result.value.changed"
      - "state['logger-service@w1'].loggers['file:///logs/window1/tasks.log'].log_level == 'debug' && state['logger-service@w1'].log_level == 'trace'"
  - id: platform-core-secret-set-get-delete
    name: A stored secret reads back under secret://<key> and is gone after delete
    fixtures: [full-window]
    steps:
      - {interface: secret-storage-service.set, caller: agents, as: set, input: {key: mcp.oauth.clientSecret, value: s3cr3t-value}}
      - {interface: secret-storage-service.get, caller: agents, as: get, input: {key: mcp.oauth.clientSecret}}
      - {interface: secret-storage-service.delete, caller: agents, as: del, input: {key: mcp.oauth.clientSecret}}
      - {interface: secret-storage-service.get, caller: agents, as: after, input: {key: mcp.oauth.clientSecret}}
    expect:
      - "steps.get.result.value.value == 's3cr3t-value' && steps.after.result.value.value == null"
      - "!('secret://mcp.oauth.clientSecret' in state['storage-service@w1'].items.application)"
  - id: platform-core-opener-open
    name: The opener sends https outside, ignores disallowed command links, runs allowed ones, and opens files in an editor
    fixtures: [full-window]
    steps:
      - {interface: opener-service.open, caller: agents, as: web, input: {resource: "https://github.com/microsoft/vscode/pull/1"}}
      - {interface: opener-service.open, caller: agents, as: blocked, input: {resource: "command:noop"}}
      - {interface: opener-service.open, caller: agents, as: cmd, input: {resource: "command:noop", allow_commands: true}}
      - {interface: opener-service.open, caller: agents, as: file, input: {resource: "file:///work/app/README.md"}}
      - {interface: opener-service.open, caller: agents, as: internal, input: {resource: "internal:foo"}}
    expect:
      - "steps.web.result.value.via == 'external' && steps.blocked.result.value.via == 'command-ignored' && steps.cmd.result.value.via == 'command'"
      - "steps.file.result.value.via == 'editor' && !steps.internal.result.value.opened"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'commands-registry.cmd-noop').size() == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'editor-service.open-editor' && e.input.resource == 'file:///work/app/README.md')"
  # ---- settings: folder scope and language overrides (C6) ----
  - id: platform-core-get-configuration-value-folder-over-workspace
    name: The folder settings of the resource's root beat the workspace settings
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: files.autoSave, resource: "file:///work/app/src/main.ts"}
    state:
      settings-store:
        workspace: {files.autoSave: onWindowChange}
        folder: {"file:///work/app": {files.autoSave: afterDelay}}
    expect:
      - "result.ok && result.value.value == 'afterDelay'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'settings-store.folder-read' && e.input.folder == 'file:///work/app')"
      - "calls['settings-store.workspace-read'] == 0"
  - id: platform-core-get-configuration-value-resource-outside-folders
    name: A resource outside every workspace folder gets no folder layer
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: files.autoSave, resource: "file:///tmp/notes.txt"}
    state:
      settings-store:
        workspace: {files.autoSave: onWindowChange}
        folder: {"file:///work/app": {files.autoSave: afterDelay}}
    expect:
      - "result.ok && result.value.value == 'onWindowChange'"
      - "calls['settings-store.folder-read'] == 0"
  - id: platform-core-get-configuration-value-language-over-general
    name: A user [typescript] value beats a general workspace value
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      settings-store:
        user: {"[typescript]": {editor.formatOnSave: true}}
        workspace: {editor.formatOnSave: false}
    expect:
      - "result.ok && result.value.value == true"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'settings-store.user-read' && e.input.key == '[typescript]')"
  - id: platform-core-get-configuration-value-language-folder-layer
    name: A [typescript] section in the folder settings beats a workspace [typescript] section
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript, resource: "file:///work/app/src/main.ts"}
    state:
      settings-store:
        workspace: {"[typescript]": {editor.formatOnSave: false}}
        folder: {"file:///work/app": {"[typescript]": {editor.formatOnSave: true}}}
    expect:
      - "result.ok && result.value.value == true"
      - "calls['settings-store.workspace-read'] == 0"
  - id: platform-core-get-configuration-value-language-workspace
    name: A workspace [typescript] section beats a user [typescript] section
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      settings-store:
        workspace: {"[typescript]": {editor.formatOnSave: false}}
        user: {"[typescript]": {editor.formatOnSave: true}}
    expect:
      - "result.ok && result.value.value == false"
      - "calls['settings-store.user-read'] == 0"
  - id: platform-core-get-configuration-value-language-other-key
    name: A [typescript] section that doesn't set the key leaves the general value
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: files.autoSave, override_identifier: typescript}
    state:
      settings-store:
        user: {"[typescript]": {editor.formatOnSave: true}, files.autoSave: afterDelay}
    expect:
      - "result.ok && result.value.value == 'afterDelay'"
      - "calls['settings-store.user-override-query'] == 1"
  - id: platform-core-get-configuration-value-multi-language
    name: A [javascript][typescript] section applies to typescript when no [typescript] section sets the key
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      settings-store:
        user: {"[javascript][typescript]": {editor.formatOnSave: true}, editor.formatOnSave: false}
    expect:
      - "result.ok && result.value.value == true"
      - "calls['settings-store.user-override-query'] == 1"
  - id: platform-core-get-configuration-value-multi-language-workspace
    name: A workspace multi-language section is consulted before the user's
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      settings-store:
        workspace: {"[typescript][javascript]": {editor.formatOnSave: false}}
        user: {"[javascript][typescript]": {editor.formatOnSave: true}}
    expect:
      - "result.ok && result.value.value == false"
      - "calls['settings-store.user-override-query'] == 0"
  - id: platform-core-get-configuration-value-multi-language-folder
    name: A folder multi-language section applies after every [lang]-only section missed
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript, resource: "file:///work/app/src/main.ts"}
    state:
      settings-store:
        folder: {"file:///work/app": {"[typescript][javascript]": {editor.formatOnSave: true}}}
    expect:
      - "result.ok && result.value.value == true"
      - "calls['settings-store.workspace-override-query'] == 0"
  - id: platform-core-get-configuration-value-exact-beats-multi
    name: A [typescript] section in user settings beats a workspace [javascript][typescript] section
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      settings-store:
        workspace: {"[javascript][typescript]": {editor.formatOnSave: false}}
        user: {"[typescript]": {editor.formatOnSave: true}}
    expect:
      - "result.ok && result.value.value == true"
      - "calls['settings-store.workspace-override-query'] == 0"
  - id: platform-core-get-configuration-value-default-language-override
    name: The registered [shellscript] default gives files.eol LF
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: files.eol, override_identifier: shellscript}
    expect:
      - "result.ok && result.value.value == '\\n'"
  - id: platform-core-get-configuration-value-policy-over-language
    name: A policy value beats a [typescript] section
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      configuration-service: {policy: {editor.formatOnSave: false}}
      settings-store: {user: {"[typescript]": {editor.formatOnSave: true}}}
    expect:
      - "result.ok && result.value.value == false"
      - "calls['settings-store.user-read'] == 0"
  # ---- IPolicyService (AccountPolicyService) -> PolicyConfiguration ----
  - id: platform-core-policy-change-then-read
    name: A changed account policy value becomes the setting's value and fires a POLICY change
    fixtures: [one-window-folder]
    state:
      account-policy-service: {policies: {ChatAgentMode: false}, sources: {ChatAgentMode: account}}
      settings-store: {user: {chat.agent.enabled: true}}
    steps:
      - {flow: pc-on-did-change-policies, as: change}
      - {flow: pc-get-configuration-value, as: read, input: {key: chat.agent.enabled}}
    expect:
      - "steps.read.result.value.value == false"
      - "state['configuration-service@w1'].policy['chat.agent.enabled'] == false"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'account-policy-service.get-policy-value' && e.input.name == 'ChatAgentMode')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.on-did-change-configuration' && e.input.source == 'policy' && e.input.affected_keys == ['chat.agent.enabled'])"
  - id: platform-core-policy-removed-then-read
    name: A policy value that is gone is removed, so the user setting applies again
    fixtures: [one-window-folder]
    state:
      configuration-service: {policy: {chat.agent.enabled: false}}
      account-policy-service: {policies: {}, sources: {}}
      settings-store: {user: {chat.agent.enabled: true}}
    steps:
      - {flow: pc-on-did-change-policies, as: change}
      - {flow: pc-get-configuration-value, as: read, input: {key: chat.agent.enabled}}
    expect:
      - "steps.read.result.value.value == true"
      - "!('chat.agent.enabled' in state['configuration-service@w1'].policy)"
      - "calls['context-key-service.on-did-change-configuration'] == 1"
  - id: platform-core-policy-unchanged-value
    name: The same policy value again changes no setting and fires nothing
    fixtures: [one-window-folder]
    state:
      configuration-service: {policy: {chat.agent.enabled: false}}
      account-policy-service: {policies: {ChatAgentMode: false}, sources: {ChatAgentMode: account}}
    steps:
      - {flow: pc-on-did-change-policies, as: change}
      - {flow: pc-get-configuration-value, as: read, input: {key: chat.agent.enabled}}
    expect:
      - "steps.read.result.value.value == false"
      - "calls['account-policy-service.get-policy-value'] == 1 && calls['context-key-service.on-did-change-configuration'] == 0"
  - id: platform-core-policy-unknown-name
    name: A policy name no setting declares is ignored
    flow: pc-on-did-change-policies
    fixtures: [one-window-folder]
    input: {names: [SomeFuturePolicy]}
    expect:
      - "result.ok && calls['account-policy-service.get-policy-value'] == 0"
      - "state['configuration-service@w1'].policy == {}"
  - id: platform-core-policy-blocks-user-write
    name: A setting under policy can't be written
    fixtures: [one-window-folder]
    state:
      account-policy-service: {policies: {McpGalleryServiceUrl: "https://mcp.example.com"}, sources: {McpGalleryServiceUrl: account}}
    steps:
      - {flow: pc-on-did-change-policies, as: change, input: {names: [McpGalleryServiceUrl]}}
      - {flow: pc-update-configuration-value, as: edit, input: {key: chat.mcp.gallery.serviceUrl, value: "https://other.example.com"}}
      - {flow: pc-get-configuration-value, as: read, input: {key: chat.mcp.gallery.serviceUrl}}
    expect:
      - "!steps.edit.result.ok && steps.edit.result.error.code == 'configured-in-system-policy'"
      - "steps.read.result.value.value == 'https://mcp.example.com'"
      - "state['configuration-service@w1'].policy['chat.mcp.gallery.serviceUrl'] == 'https://mcp.example.com' && !('chat.mcp.gallery.serviceUrl' in state['settings-store'].user)"
  # ---- context for when clauses ----
  - id: platform-core-get-context-resolves-config-keys
    name: getContext returns the root values and resolves the config.* keys the clause reads
    flow: pc-get-context
    fixtures: [one-window-folder]
    state:
      context-key-service: {values: {inputFocus: true, activeEditorGroupEmpty: true}}
      settings-store: {user: {files.autoSave: afterDelay}}
    expect:
      - "result.ok && result.value.values['inputFocus'] == true && result.value.values['activeEditorGroupEmpty'] == true"
      - "result.value.values['config.files.autoSave'] == 'afterDelay'"
      - "state['context-key-service@w1'].config_cache['config.files.autoSave'] == 'afterDelay'"
  - id: platform-core-get-context-cached-config
    name: A cached config.* key is not read again
    flow: pc-get-context
    fixtures: [one-window-folder]
    state:
      context-key-service: {config_cache: {config.files.autoSave: onFocusChange}}
    expect:
      - "result.value.values['config.files.autoSave'] == 'onFocusChange'"
      - "calls['configuration-service.get-value'] == 0"
  - id: platform-core-get-context-eval-when
    name: "A when clause held as data evaluates against the context (closeGroup: activeEditorGroupEmpty && multipleEditorGroups)"
    flow: pc-get-context
    fixtures: [one-window-folder]
    input: {keys: [activeEditorGroupEmpty, multipleEditorGroups]}
    state:
      context-key-service: {values: {activeEditorGroupEmpty: true, multipleEditorGroups: true}}
    expect:
      - "eval('activeEditorGroupEmpty && multipleEditorGroups', result.value.values) == true"
  - id: platform-core-execute-command-extension-contributed
    name: An extension command registered through MainThreadCommands runs in the extension host via the command service
    fixtures: [one-window-folder]
    state:
      "ext-host-commands@eh1": {commands: [myext.sayHello]}
    steps:
      - {interface: main-thread-commands.register-command, caller: exthost-bridge, as: reg, input: {command_id: myext.sayHello}}
      - {flow: pc-execute-command, as: run, input: {command_id: myext.sayHello, args: [world]}}
    expect:
      - "steps.reg.result.ok && steps.run.result.ok"
      - "state['commands-registry@w1'].commands['myext.sayHello'].handler == 'main-thread-commands.execute-contributed-command'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onCommand:myext.sayHello')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'main-thread-commands.execute-contributed-command' && e.instance == 'w1' && e.input.command_id == 'myext.sayHello')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-commands.execute-contributed-command' && e.instance == 'eh1' && e.input.args == ['world'])"
      - "calls['command-service.activate-star'] == 0"
