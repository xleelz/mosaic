flows:
  - id: pc-execute-command
    name: Execute a command
    description: "A menu, keybinding or the palette runs a command id through ICommandService.executeCommand."
    tags: [writes]
    entry: {caller: user, interface: command-service.execute-command, input: {command_id: noop, args: []}}
    sources: ["src/vs/workbench/services/commands/common/commandService.ts:52-90"]
  - id: pc-get-configuration-value
    name: Read a setting
    tags: ["feature:settings"]
    entry: {caller: workbench, interface: configuration-service.get-value, input: {key: files.autoSave}}
    sources: ["src/vs/platform/configuration/common/configurationService.ts:96-100"]
  - id: pc-update-configuration-value
    name: Write a user setting
    tags: [writes, "feature:settings"]
    entry: {caller: workbench, interface: configuration-service.update-value, input: {key: files.autoSave, value: afterDelay}}
    sources: ["src/vs/platform/configuration/common/configurationService.ts:106-144"]
  - id: pc-write-file
    name: Write a file
    tags: [writes]
    entry: {caller: workbench, interface: file-service.write-file, input: {resource: "file:///work/app/src/util.ts", content: "export const add = (a: number, b: number) => a + b;\n"}}
    sources: ["src/vs/platform/files/common/fileService.ts:383-435"]
  - id: pc-read-file
    name: Read a file
    entry: {caller: workbench, interface: file-service.read-file, input: {resource: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/platform/files/common/fileService.ts:542-580"]
  - id: pc-delete-file
    name: Delete a file
    tags: [writes]
    entry: {caller: workbench, interface: file-service.del, input: {resource: "file:///work/app/README.md"}}
    sources: ["src/vs/platform/files/common/fileService.ts:1091-1115"]
  - id: pc-store-storage-value
    name: Store a value in state storage
    tags: [writes]
    entry: {caller: workbench, interface: storage-service.store, input: {key: workbench.panel.lastIsMaximized, value: "true", scope: workspace, target: machine}}
    sources: ["src/vs/platform/storage/common/storage.ts:490-507"]
  - id: pc-get-storage-value
    name: Read a value from state storage
    entry: {caller: workbench, interface: storage-service.get, input: {key: workbench.panel.lastIsMaximized, scope: workspace}}
    sources: ["src/vs/platform/storage/common/storage.ts:460-464"]
  - id: pc-get-context-key-value
    name: Read a context key
    entry: {caller: workbench, interface: context-key-service.get-context-key-value, input: {key: config.files.autoSave}}
    sources: ["src/vs/platform/contextkey/browser/contextKeyService.ts:332-337"]
  - id: pc-instantiate-service
    name: Instantiate a service on first use
    tags: [writes]
    entry: {caller: workbench, interface: instantiation-service.get-or-create-service-instance, input: {service_id: contextKeyService}}
    sources: ["src/vs/platform/instantiation/common/instantiationService.ts:184-195"]
  - id: pc-invoke-function
    name: Invoke a function with a services accessor
    entry: {caller: workbench, interface: instantiation-service.invoke-function, input: {service_ids: [contextKeyService]}}
    sources: ["src/vs/platform/instantiation/common/instantiationService.ts:89-116"]
  - id: pc-push-undo-element
    name: Push an undo element
    tags: [writes]
    entry: {caller: editor, interface: undo-redo-service.push-element, input: {resource: "file:///work/app/src/main.ts", label: Typing}}
    sources: ["src/vs/platform/undoRedo/common/undoRedoService.ts:505-552"]
  - id: pc-undo
    name: Undo the last element of a resource
    tags: [writes]
    entry: {caller: editor, interface: undo-redo-service.undo, input: {resource: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/platform/undoRedo/common/undoRedoService.ts:1068-1100"]
  - id: pc-can-undo
    name: Ask whether a resource can be undone or redone
    entry: {caller: editor, interface: undo-redo-service.can-undo, input: {resource: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/platform/undoRedo/common/undoRedoService.ts:697-708"]
  - id: pc-change-markers
    name: Publish diagnostics for a resource
    tags: [writes]
    entry: {caller: workbench, interface: marker-service.change-one}
    sources: ["src/vs/platform/markers/common/markerService.ts:188-209"]
  - id: pc-read-markers
    name: Read diagnostics
    entry: {caller: workbench, interface: marker-service.read, input: {resource: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/platform/markers/common/markerService.ts:341-400"]
  - id: pc-watcher-main
    name: File watcher process startup
    entry: {caller: main-process, interface: watcher-main.main, input: {utility_process: true}}
    sources: ["src/vs/platform/files/node/watcher/watcherMain.ts:13-21"]
  - id: pc-local-transcription-main
    name: Local transcription process startup
    entry: {caller: main-process, interface: local-transcription-main.main, input: {utility_process: true}}
    sources: ["src/vs/platform/localTranscription/node/localTranscriptionMain.ts:13-19"]
  - id: pc-profile-analysis-worker-main
    name: Profile analysis worker startup
    entry: {caller: workbench, interface: profile-analysis-worker-main.main}
    sources: ["src/vs/platform/profiling/electron-browser/profileAnalysisWorkerMain.ts:9"]

  - id: pc-on-did-change-policies
    name: The policy configuration takes changed policy values from the policy service
    tags: [writes, "feature:settings"]
    entry: {caller: workbench, interface: configuration-service.on-did-change-policies, input: {names: [ChatAgentMode]}}
    sources: ["src/vs/platform/configuration/common/configurations.ts:232-246"]
  - id: pc-get-context
    name: Read the context a when clause is evaluated against
    entry: {caller: workbench, interface: context-key-service.get-context, input: {keys: [inputFocus, config.files.autoSave]}}
    sources: ["src/vs/platform/contextkey/browser/contextKeyService.ts:361-366"]
scenarios:
  # ---------------- commands ----------------
  - id: platform-core-execute-command-happy
    name: A registered command waits for its onCommand activation, then runs
    flow: pc-execute-command
    fixtures: [one-window-folder]
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onCommand:noop')"
      - "calls['commands-registry.cmd-noop'] == 1 && calls['command-service.activate-star'] == 0"
  - id: platform-core-execute-command-not-found
    name: An unregistered command activates onCommand and *, then fails with command not found
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: workbench.action.doesNotExist}
    expect:
      - "!result.ok && result.error.code == 'command-not-found'"
      - "result.error.message == \"command 'workbench.action.doesNotExist' not found\""
      - "calls['extension-service.activate-by-event'] == 2"
      - "state['command-service@w1'].star_activation_settled"
  - id: platform-core-execute-command-host-not-ready
    name: Before the extension host is ready, the activation is sent but not awaited
    flow: pc-execute-command
    fixtures: [one-window-folder]
    state: {command-service: {extension_host_ready: false}}
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'emit' && e.interface == 'extension-service.activate-by-event')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'commands-registry.cmd-noop')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event')[0].seq"
  - id: platform-core-execute-command-star-timeout
    name: A hung * activation is abandoned after 30 s and the lookup fails
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: myExtension.lateCommand}
    faults:
      - {target: extension-service.activate-by-event, type: timeout, calls: [2]}
    expect:
      - "!result.ok && result.error.code == 'command-not-found'"
      - "duration_ms >= 30000 && duration_ms < 30100"
      - "state['command-service@w1'].star_activation_settled"
  - id: platform-core-execute-command-star-activation-fails
    name: A rejected * activation rejects executeCommand
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: myExtension.lateCommand}
    faults:
      - {target: extension-service.activate-by-event, type: error, code: canceled, retryable: false, calls: [2]}
    expect:
      - "!result.ok && result.error.code == 'canceled'"
      - "calls['command-service.try-execute-command'] == 0"
      - "!state['command-service@w1'].star_activation_settled"
  - id: platform-core-execute-command-star-shared
    name: A later unregistered command reuses the settled * activation
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: myExtension.lateCommand}
    state: {command-service: {star_activation_settled: true}}
    expect:
      - "!result.ok && result.error.code == 'command-not-found'"
      - "calls['extension-service.activate-by-event'] == 1"
      - "trace.exists(e, e.type == 'note' && e.title == 'The shared * activation promise has already settled')"
  - id: platform-core-execute-command-registered-by-extension
    name: A command registered at runtime (MainThreadCommands) runs on the next executeCommand
    fixtures: [one-window-folder]
    steps:
      - {interface: commands-registry.register-command, caller: exthost-bridge, as: reg, input: {command_id: myExtension.sayHello, handler: commands-registry.cmd-noop}}
      - {flow: pc-execute-command, as: run, input: {command_id: myExtension.sayHello}}
    expect:
      - "steps.run.result.ok"
      - "state['commands-registry@w1'].commands['myExtension.sayHello'].handler == 'commands-registry.cmd-noop'"
      - "calls['command-service.activate-star'] == 0"
  - id: platform-core-execute-command-set-context
    name: _setContext stores a context key value
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: _setContext, args: [myExtension.ready, true]}
    expect:
      - "result.ok"
      - "state['context-key-service@w1'].values['myExtension.ready'] == true"
  - id: platform-core-execute-command-set-context-unchanged
    name: _setContext with the current value changes nothing
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: _setContext, args: [inputFocus, false]}
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'note' && e.title == 'Context.setValue returns false for an equal value, so no event fires')"
      - "state['context-key-service@w1'].values.inputFocus == false"
  - id: platform-core-execute-command-set-context-undefined
    name: _setContext without a value removes the key
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: _setContext, args: [inputFocus]}
    expect:
      - "result.ok"
      - "!('inputFocus' in state['context-key-service@w1'].values)"
  - id: platform-core-execute-command-remove-missing-context
    name: Removing an absent context key does nothing
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: _setContext, args: [myExtension.neverSet]}
    expect:
      - "result.ok"
      - "!trace.exists(e, e.type == 'set' && e.component == 'context-key-service')"
  - id: platform-core-execute-command-set-context-then-read
    name: A context key set by _setContext reads back through getContextKeyValue
    fixtures: [one-window-folder]
    steps:
      - {flow: pc-execute-command, as: set, input: {command_id: _setContext, args: [myExtension.ready, true]}}
      - {flow: pc-get-context-key-value, as: read, input: {key: myExtension.ready}}
    expect:
      - "steps.read.result.ok && steps.read.result.value.value == true"
      - "state['context-key-service@w1'].values['myExtension.ready'] == true"
  - id: platform-core-execute-command-get-context-key-info
    name: getContextKeyInfo returns the declared context keys
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: getContextKeyInfo}
    expect:
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.set-context')"
      - "result.ok"
      - "calls['context-key-service.cmd-getcontextkeyinfo'] == 1"
  - id: platform-core-execute-command-menu-reset
    name: Reset All Menus clears hidden states and persists {} in profile storage
    fixtures: [one-window-folder]
    state:
      persisted-menu-hide-state: {data: {EditorTitle: [workbench.action.splitEditor]}}
    steps:
      - {flow: pc-execute-command, as: reset, input: {command_id: menu.resetHiddenStates}}
      - {flow: pc-get-storage-value, as: read, input: {key: menu.hiddenCommands, scope: profile}}
    expect:
      - "steps.reset.result.ok"
      - "steps.read.result.value.value == '{}'"
      - "state['persisted-menu-hide-state@w1'].data == {} && !state['persisted-menu-hide-state@w1'].ignore_change_event"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'storage-service.get' && has(e.input.fallback_value) && e.input.fallback_value == '{}')"
      - "state['storage-db'].global['menu.hiddenCommands'] == '{}'"
  - id: platform-core-execute-command-accept-code-action
    name: Enter in the action widget accepts the selected item
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: acceptSelectedCodeAction}
    state: {action-widget-service: {visible: true, selected: "quickfix: Add import from './util'"}}
    expect:
      - "state['action-widget-service@w1'].visible"
      - "result.ok && result.value.accepted == \"quickfix: Add import from './util'\" && !result.value.preview"
  - id: platform-core-execute-command-preview-code-action
    name: Ctrl+Enter previews the selected item
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: previewSelectedCodeAction}
    state: {action-widget-service: {visible: true, selected: "refactor: Extract to function"}}
    expect:
      - "state['action-widget-service@w1'].visible"
      - "result.ok && result.value.preview && result.value.accepted == 'refactor: Extract to function'"
  - id: platform-core-execute-command-accept-without-widget
    name: Accept with no action widget shown does nothing
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: acceptSelectedCodeAction}
    expect:
      - "!state['action-widget-service@w1'].visible"
      - "result.ok && result.value.accepted == null"
  - id: platform-core-execute-command-hide-code-action-widget
    name: Escape hides the action widget
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: hideCodeActionWidget}
    state: {action-widget-service: {visible: true, selected: "quickfix: Add import from './util'"}}
    expect:
      - "result.ok && result.value.hidden"
      - "!state['action-widget-service@w1'].visible && state['action-widget-service@w1'].selected == null"
  - id: platform-core-execute-command-hide-hidden-widget
    name: Escape with no action widget shown changes nothing
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: hideCodeActionWidget}
    expect:
      - "!trace.exists(e, e.type == 'set' && e.component == 'action-widget-service')"
      - "result.ok && !result.value.hidden"
  - id: platform-core-execute-command-quick-input-accept
    name: Enter in an open quick pick accepts it
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: quickInput.accept}
    state: {quick-input-controller: {current_quick_input: {id: workbench.action.quickOpen, type: quickPick}}}
    expect:
      - "state['quick-input-controller@w1'].current_quick_input.id == 'workbench.action.quickOpen'"
      - "result.ok && result.value.accepted == 'workbench.action.quickOpen'"
  - id: platform-core-execute-command-quick-input-none
    name: quickInput.accept with no open quick input does nothing
    flow: pc-execute-command
    fixtures: [one-window-folder]
    input: {command_id: quickInput.accept}
    expect:
      - "state['quick-input-controller@w1'].current_quick_input == null"
      - "result.ok && result.value.accepted == null"

  # ---------------- configuration ----------------
  - id: platform-core-get-configuration-value-default
    name: An unset setting resolves to its registered default
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    expect:
      - "result.ok && result.value.value == 'off'"
      - "calls['settings-store.user-read'] == 1 && calls['settings-store.workspace-read'] == 1"
  - id: platform-core-get-configuration-value-fixture-config
    name: A world that configures files.autoSave reads afterDelay
    flow: pc-get-configuration-value
    fixtures: [auto-save-after-delay]
    expect:
      - "result.ok && result.value.value == 'afterDelay'"
  - id: platform-core-get-configuration-value-user
    name: A user setting overrides the default
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    state: {settings-store: {user: {files.autoSave: onFocusChange}}}
    expect:
      - "result.ok && result.value.value == 'onFocusChange'"
  - id: platform-core-get-configuration-value-workspace
    name: A workspace setting overrides the user setting
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    state: {settings-store: {user: {files.autoSave: onFocusChange}, workspace: {files.autoSave: onWindowChange}}}
    expect:
      - "result.ok && result.value.value == 'onWindowChange'"
      - "calls['settings-store.user-read'] == 0"
  - id: platform-core-get-configuration-value-policy
    name: A policy value wins over workspace and user settings
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    state:
      configuration-service: {policy: {files.autoSave: afterDelay}}
      settings-store: {workspace: {files.autoSave: onWindowChange}}
    expect:
      - "result.ok && result.value.value == 'afterDelay'"
      - "calls['settings-store.workspace-read'] == 0"
  - id: platform-core-get-configuration-value-unregistered
    name: An unregistered key resolves to undefined
    flow: pc-get-configuration-value
    fixtures: [one-window-folder]
    input: {key: myExtension.notRegistered}
    expect:
      - "result.ok && result.value.value == null"
  - id: platform-core-update-configuration-value-then-read
    name: A written user setting reads back
    fixtures: [one-window-folder]
    steps:
      - {flow: pc-update-configuration-value, as: write}
      - {flow: pc-get-configuration-value, as: read}
    expect:
      - "steps.write.result.ok && !steps.write.result.value.removed"
      - "steps.read.result.value.value == 'afterDelay'"
      - "state['settings-store'].user['files.autoSave'] == 'afterDelay'"
  - id: platform-core-update-configuration-value-default-removes
    name: Writing the default value removes the setting from settings.json
    fixtures: [one-window-folder]
    state: {settings-store: {user: {files.autoSave: afterDelay}}}
    steps:
      - {flow: pc-update-configuration-value, as: write, input: {value: "off"}}
      - {flow: pc-get-configuration-value, as: read}
    expect:
      - "steps.write.result.value.removed"
      - "!('files.autoSave' in state['settings-store'].user)"
      - "steps.read.result.value.value == 'off'"
  - id: platform-core-update-configuration-value-policy
    name: A policy-controlled key cannot be written
    flow: pc-update-configuration-value
    fixtures: [one-window-folder]
    state: {configuration-service: {policy: {files.autoSave: "off"}}}
    expect:
      - "!result.ok && result.error.code == 'configured-in-system-policy'"
      - "calls['configuration-editing.write'] == 0 && !('files.autoSave' in state['settings-store'].user)"
  - id: platform-core-update-configuration-value-workspace-target
    name: The platform configuration service refuses workspace targets
    flow: pc-update-configuration-value
    fixtures: [one-window-folder]
    input: {target: workspace}
    expect:
      - "!result.ok && result.error.code == 'unable-to-write-to-target'"
      - "result.error.message == 'Unable to write files.autoSave to target workspace.'"
      - "calls['configuration-editing.write'] == 0"
  - id: platform-core-update-configuration-value-parse-errors
    name: A settings.json with parse errors is not written
    flow: pc-update-configuration-value
    fixtures: [one-window-folder]
    choices: {configuration-editing.write.settings_file: has_parse_errors}
    expect:
      - "!result.ok && result.error.code == 'unable-to-write-into-the-settings-file'"
      - "calls['settings-store.user-write'] == 0 && !('files.autoSave' in state['settings-store'].user)"
  - id: platform-core-update-configuration-value-invalidates-context-key
    name: A setting change drops the cached config.* context key, so the next read sees the new value
    fixtures: [one-window-folder]
    steps:
      - {flow: pc-get-context-key-value, as: before}
      - {flow: pc-update-configuration-value, as: write}
      - {flow: pc-get-context-key-value, as: after}
    expect:
      - "steps.before.result.value.value == 'off'"
      - "steps.after.result.value.value == 'afterDelay'"
      - "state['context-key-service@w1'].config_cache['config.files.autoSave'] == 'afterDelay'"
      - "calls['configuration-service.get-value'] == 2"
  - id: platform-core-get-context-key-value-cached
    name: A cached config.* context key does not ask the configuration service again
    flow: pc-get-context-key-value
    fixtures: [one-window-folder]
    state: {context-key-service: {config_cache: {config.files.autoSave: "off"}}}
    expect:
      - "result.ok && result.value.value == 'off'"
      - "calls['configuration-service.get-value'] == 0"
      - "state['context-key-service@w1'].config_cache['config.files.autoSave'] == 'off'"
  - id: platform-core-context-key-default-change-resets-cache
    name: A DEFAULT configuration change resets every cached config.* key
    fixtures: [one-window-folder]
    state: {context-key-service: {config_cache: {config.files.autoSave: "off", config.editor.tabSize: 4}}}
    steps:
      - {interface: context-key-service.on-did-change-configuration, caller: configuration-service, as: change, input: {affected_keys: [editor.tabSize], source: default}}
      - {flow: pc-get-context-key-value, as: read}
    expect:
      - "steps.read.result.value.value == 'off'"
      - "calls['configuration-service.get-value'] == 1"
      - "!('config.editor.tabSize' in state['context-key-service@w1'].config_cache)"

  # ---------------- files ----------------
  - id: platform-core-write-file-then-read
    name: A written file reads back with its new content and stat
    fixtures: [one-window-folder]
    steps:
      - {flow: pc-write-file, as: write}
      - {flow: pc-read-file, as: read, input: {resource: "file:///work/app/src/util.ts"}}
    expect:
      - "steps.write.result.ok && steps.write.result.value.size == 52"
      - "steps.read.result.value.value == 'export const add = (a: number, b: number) => a + b;\\n'"
      - "state.disk.files['file:///work/app/src/util.ts'].size == 52"
  - id: platform-core-write-file-creates
    name: Writing a file that does not exist creates it without stat checks
    flow: pc-write-file
    fixtures: [one-window-folder]
    input: {resource: "file:///work/app/src/new.ts", content: "export {};\n", mtime: 1, etag: "1-1"}
    expect:
      - "result.ok"
      - "state.disk.files['file:///work/app/src/new.ts'].content == 'export {};\\n'"
  - id: platform-core-write-file-modified-since
    name: Writing over a file that changed on disk fails with file modified since
    flow: pc-write-file
    fixtures: [one-window-folder]
    input: {resource: "file:///work/app/src/main.ts", content: "console.log(1);\n", mtime: 1793318300000, etag: "1793318300000-40"}
    expect:
      - "!result.ok && result.error.code == 'file-modified-since' && result.error.message == 'File Modified Since'"
      - "calls['disk.write-file'] == 0"
      - "state.disk.files['file:///work/app/src/main.ts'].mtime == 1793318400000"
  - id: platform-core-write-file-same-content
    name: A stale copy may still write when its bytes equal the disk content
    flow: pc-write-file
    fixtures: [one-window-folder]
