  - component: logger-service
    name: set-log-level
    kind: function
    summary: "AbstractLoggerService.setLogLevel: with a resource, change that logger's level (undefined when it equals the global level) and fire onDidChangeLogLevel; without one, change the global level for every logger that has no own level."
    sources:
      - "src/vs/platform/log/common/log.ts:785-806"
    request:
      type: object
      required: [log_level]
      properties:
        resource: {type: string, default: "", description: "the logger resource; empty for the global level"}
        log_level: {type: string, enum: ["off", trace, debug, info, warning, error], examples: [debug]}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "has(input.resource) && input.resource != ''"
        then:
          - if: "!(input.resource in state.loggers) || (has(state.loggers[input.resource].log_level) && state.loggers[input.resource].log_level == input.log_level)"
            then:
              - title: Unknown logger or unchanged level
                source: "src/vs/platform/log/common/log.ts:791-792"
                return: {changed: false}
          - set: {state.loggers: "= merge(state.loggers, {input.resource: {'log_level': input.log_level == state.log_level ? null : input.log_level}})"}
          - return: {changed: true}
      - title: The global level applies to loggers without their own level
        source: "src/vs/platform/log/common/log.ts:798-805"
        set: {state.log_level: "= input.log_level"}
      - return: {changed: true}

  # ======== opener-service ========
  - component: opener-service
    name: open
    kind: function
    summary: "OpenerService.open: internal URIs return false; otherwise the first opener that handles the target wins: http(s)/mailto/vsls or openExternal go to the external opener, command: URIs run the command only when allowed, everything else opens in an editor."
    sources:
      - "src/vs/editor/browser/services/openerService.ts:190-225"
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["https://github.com/microsoft/vscode/pull/1"]}
        open_external: {type: boolean, default: false}
        allow_commands: {type: boolean, default: false}
        open_to_side: {type: boolean, default: false}
    response: {type: object, properties: {opened: {type: boolean}, via: {type: string}}}
    behavior:
      - set: {vars.scheme: "= input.resource.split(':')[0]"}
      - if: "vars.scheme == 'internal'"
        then:
          - title: Internal schemes are not openable
            source: "src/vs/editor/browser/services/openerService.ts:193-196"
            return: {opened: false, via: none}
      - if: "(has(input.open_external) && input.open_external) || vars.scheme in ['mailto', 'http', 'https', 'vsls']"
        then:
          - title: The external resource opener opens it outside VS Code (the desktop default opener is the native host's openExternal)
            source: "src/vs/editor/browser/services/openerService.ts:150-158"
            return: {opened: true, via: external}
      - if: "vars.scheme == 'command'"
        then:
          - if: "!(has(input.allow_commands) && input.allow_commands)"
            then:
              - title: Command links are disabled, so the command is ignored and other openers are suppressed
                source: "src/vs/editor/browser/services/openerService.ts:36-40"
                return: {opened: true, via: command-ignored}
          - title: Execute the command named by the URI path, with the JSON args from its query
            source: "src/vs/editor/browser/services/openerService.ts:54-68"
            call: command-service.execute-command
            input: {command_id: "= input.resource.substring(8).split('?')[0]", args: []}
          - return: {opened: true, via: command}
      - title: The editor opener opens the resource in a code editor (to the side when asked)
        source: "src/vs/editor/browser/services/openerService.ts:59-84"
        call: editor-service.open-editor
        input: {resource: "= input.resource", group: "= has(input.open_to_side) && input.open_to_side ? -2 : -1"}
      - return: {opened: true, via: editor}

