    store: {table: workspace, op: query, where: "matches(key, '^(\\\\[[^\\\\]]+\\\\])+$') && key != '[' + input.override_identifier + ']' && key.contains('[' + input.override_identifier + ']') && type(row) == map && input.key in row"}
