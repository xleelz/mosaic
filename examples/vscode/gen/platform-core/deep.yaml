            fail: {code: trash-unsupported, status: 0, message: "= \"Unable to delete file '\" + input.resource + \"' via trash because provider does not support it.\""}
      - call: disk.stat
        input: {resource: "= input.resource"}
        as: stat
        on_error:
          - title: Unable to delete nonexistent file
            source: "src/vs/platform/files/common/fileService.ts:1066-1077"
            fail: {code: file-not-found, status: 0, message: "= \"Unable to delete nonexistent file '\" + input.resource + \"'\""}
      - if: "has(vars.stat.value.readonly) && vars.stat.value.readonly"
        then:
