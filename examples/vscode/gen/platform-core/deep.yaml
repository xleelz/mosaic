    attributes: {owner: platform-core, note: "Decision 2: platform-core defines the disk store contract (non-stub); keyed by resource"}
    request: {type: object, required: [resource, content], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, content: {type: string}}}
