  - component: file-service
    name: can-move
    kind: function
    summary: "FileService.canMove: same URI is fine; otherwise readonly providers and an existing target without overwrite (FILE_MOVE_CONFLICT) are refused."
    sources:
      - "src/vs/platform/files/common/fileService.ts:769-790"
    request:
      type: object
      required: [source, target]
      properties:
        source: {type: string, examples: ["file:///work/app/src/util.ts"]}
        target: {type: string, examples: ["file:///work/app/src/math.ts"]}
        overwrite: {type: boolean, default: false}
    response: {type: object, properties: {ok: {type: boolean}, error_code: {type: string}}}
    behavior:
      - if: "input.source == input.target"
        then:
          - return: {ok: true, error_code: ""}
      - set: {vars.s: "= input.source.split(':')[0]", vars.t: "= input.target.split(':')[0]"}
      - if: "!(vars.s in state.providers) || !(vars.t in state.providers)"
        then:
          - return: {ok: false, error_code: no-file-system-provider-found}
      - if: "state.providers[vars.s].readonly || state.providers[vars.t].readonly"
        then:
          - return: {ok: false, error_code: file-permission-denied}
      - call: file-service.exists
        input: {resource: "= input.target"}
        as: target_exists
      - if: "vars.target_exists.value.exists && !(has(input.overwrite) && input.overwrite)"
        then:
          - title: The target already exists at the destination
            source: "src/vs/platform/files/common/fileService.ts:950-956"
            return: {ok: false, error_code: file-move-conflict}
      - return: {ok: true, error_code: ""}
  - component: file-service
    name: move
    kind: function
    summary: "FileService.move: validate (target exists without overwrite is FILE_MOVE_CONFLICT), delete an overwritten target, rename through the provider, resolve the target."
    sources:
      - "src/vs/platform/files/common/fileService.ts:792-804"
      - "src/vs/platform/files/common/fileService.ts:820-875"
    request:
      type: object
      required: [source, target]
      properties:
        source: {type: string, examples: ["file:///work/app/src/util.ts"]}
        target: {type: string, examples: ["file:///work/app/src/math.ts"]}
        overwrite: {type: boolean, default: false}
    response: PlatformFileStat
    errors:
      - {code: file-not-found, status: 0, retryable: false}
      - {code: file-move-conflict, status: 0, retryable: false}
      - {code: file-permission-denied, status: 0, retryable: false}
    behavior:
      - call: file-service.can-move
        input: {source: "= input.source", target: "= input.target", overwrite: "= has(input.overwrite) && input.overwrite"}
        as: valid
      - if: "!vars.valid.value.ok"
        then:
          - title: Validation refused the move
            source: "src/vs/platform/files/common/fileService.ts:950-956"
            fail: "= {'code': vars.valid.value.error_code, 'status': 0, 'message': vars.valid.value.error_code == 'file-move-conflict' ? \"Unable to move/copy '\" + input.source + \"' because target '\" + input.target + \"' already exists at destination.\" : 'Unable to move ' + input.source}"
      - if: "input.source == input.target"
        then:
          - title: Same URI, a no-op like node.js
            source: "src/vs/platform/files/common/fileService.ts:821-823"
            call: disk.stat
            input: {resource: "= input.target"}
            as: same
          - return: {resource: "= input.target", mtime: "= vars.same.value.mtime", size: "= vars.same.value.size", etag: "= string(vars.same.value.mtime) + '-' + string(vars.same.value.size)", readonly: false}
      - title: Same provider, so the provider renames source to target (modelled as read, write, delete)
        source: "src/vs/platform/files/common/fileService.ts:861-866"
        call: disk.read-file
        input: {resource: "= input.source"}
        as: src
      - call: disk.write-file
        input: {resource: "= input.target", content: "= vars.src.value.content"}
        as: written
      - call: disk.delete
        input: {resource: "= input.source"}
      - return: {resource: "= input.target", mtime: "= vars.written.value.mtime", size: "= vars.written.value.size", etag: "= string(vars.written.value.mtime) + '-' + string(vars.written.value.size)", readonly: false}
  - component: file-service
    name: watch
    kind: function
    summary: "FileService.watch: forward a (recursive or not) watch request to the provider; for disk files the universal watcher in the file watcher process."
    sources:
      - "src/vs/platform/files/common/fileService.ts:1176-1220"
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app"]}, recursive: {type: boolean, default: false}}}
    response: {type: object, properties: {watching: {type: boolean}}}

  # ======== storage-service ========
  - component: storage-service
    name: store
    kind: function
    summary: "IStorageService.store: null removes the key; an unchanged value returns early; otherwise update the scope's cache and pending inserts, fire onDidChangeValue and flush after the 100 ms delay."
    sources:
      - "src/vs/platform/storage/common/storage.ts:490-507"
      - "src/vs/base/parts/storage/common/storage.ts:264-292"
    request:
      type: object
      required: [key, scope]
      properties:
        key: {type: string, examples: [workbench.panel.lastIsMaximized]}
        value: {type: [string, "null"], default: null, description: "StorageValue; undefined or null removes the key"}
        scope: {type: string, enum: [application, profile, workspace], examples: [workspace]}
        target: {type: string, enum: [user, machine], default: machine}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "!has(input.value) || input.value == null"
        then:
          - title: Undefined or null values remove the key
            source: "src/vs/platform/storage/common/storage.ts:492-496"
            call: storage-service.remove
            input: {key: "= input.key", scope: "= input.scope"}
            as: removed
          - return: "= vars.removed.value"
      - set: {vars.value: "= type(input.value) == string ? input.value : string(input.value)"}
      - if: "input.key in state.items[input.scope] && state.items[input.scope][input.key] == vars.value"
        then:
          - title: Return early if the value is already set
            source: "src/vs/base/parts/storage/common/storage.ts:277-281"
            return: {changed: false}
      - title: Update the cache and the pending inserts
        source: "src/vs/base/parts/storage/common/storage.ts:283-286"
        set:
          state.items: "= merge(state.items, {input.scope: {input.key: vars.value}})"
          state.pending: "= merge(state.pending, {input.scope: {input.key: vars.value}})"
      - title: onDidChangeStorage, forwarded as onDidChangeValue(scope, key)
        source: "src/vs/base/parts/storage/common/storage.ts:288-289"
        publish: storage-service.on-did-change-value
        input: {scope: "= input.scope", key: "= input.key", external: false}
        delivery: sync
      - title: Accumulate work, flushing after DEFAULT_FLUSH_DELAY (100 ms, ThrottledDelayer)
        source: "src/vs/base/parts/storage/common/storage.ts:117"
        emit: storage-service.flush-pending
        input: {scope: "= input.scope"}
        after_ms: 100
      - return: {changed: true}
  - component: storage-service
    name: remove
    kind: function
    summary: "IStorageService.remove: delete from the cache (return early if absent), mark a pending delete, fire the change and flush after the delay."
    sources:
      - "src/vs/platform/storage/common/storage.ts:509-520"
      - "src/vs/base/parts/storage/common/storage.ts:295-318"
    request:
      type: object
      required: [key, scope]
      properties:
        key: {type: string, examples: [workbench.panel.lastIsMaximized]}
        scope: {type: string, enum: [application, profile, workspace], examples: [workspace]}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "!(input.key in state.items[input.scope])"
        then:
          - title: Return early if the value is already deleted
            source: "src/vs/base/parts/storage/common/storage.ts:300-304"
            return: {changed: false}
      - set:
          state.items: "= state.items.transformMap(s, m, s == input.scope ? omit(m, input.key) : m)"
          state.pending: "= merge(state.pending, {input.scope: {input.key: null}})"
      - publish: storage-service.on-did-change-value
        input: {scope: "= input.scope", key: "= input.key", external: false}
        delivery: sync
      - emit: storage-service.flush-pending
        input: {scope: "= input.scope"}
        after_ms: 100
      - return: {changed: true}
  - component: storage-service
    name: flush-pending
    kind: function
    summary: "Storage.flushPending: hand the pending inserts and deletes to the database's updateItems and reset them (nothing to do when empty)."
    sources:
      - "src/vs/base/parts/storage/common/storage.ts:363-384"
    request:
      type: object
      required: [scope]
      properties:
        scope: {type: string, enum: [application, profile, workspace], examples: [workspace]}
    behavior:
      - if: "size(state.pending[input.scope]) == 0"
        then:
          - title: Nothing pending (an earlier flush already took it)
            source: "src/vs/base/parts/storage/common/storage.ts:364-366"
            return: {flushed: 0}
      - set:
          vars.batch: "= state.pending[input.scope]"
          vars.db: "= input.scope == 'workspace' ? 'workspace' : 'global'"
          state.pending: "= state.pending.transformMap(s, m, s == input.scope ? {} : m)"
      - title: updateItems({insert, delete}) on the scope's state.vscdb
        source: "src/vs/base/parts/storage/common/storage.ts:368-383"
        foreach: "= vars.batch"
        as: value
        index: key
        steps:
          - if: "vars.value == null"
            then:
              - call: "= 'storage-db.' + vars.db + '-delete'"
                targets: [storage-db.global-delete, storage-db.workspace-delete]
                input: {key: "= vars.key"}
            else:
              - call: "= 'storage-db.' + vars.db + '-insert'"
                targets: [storage-db.global-insert, storage-db.workspace-insert]
                input: {key: "= vars.key", value: "= vars.value"}
      - return: {flushed: "= size(vars.batch)"}
  - component: storage-service
    name: get
    kind: function
    summary: "IStorageService.get: the cached string for the key in the scope, or the fallback value."
    sources:
      - "src/vs/platform/storage/common/storage.ts:460-464"
      - "src/vs/base/parts/storage/common/storage.ts:216-226"
    request:
      type: object
      required: [key, scope]
      properties:
        key: {type: string, examples: [workbench.panel.lastIsMaximized]}
        scope: {type: string, enum: [application, profile, workspace], examples: [workspace]}
        fallback_value: {type: [string, "null"], default: null}
    response: {type: object, properties: {value: {type: [string, "null"]}}}
    behavior:
      - if: "input.key in state.items[input.scope]"
        then:
          - return: {value: "= state.items[input.scope][input.key]"}
      - return: {value: "= has(input.fallback_value) ? input.fallback_value : null"}
  - component: menu-service
    name: on-did-change-context
    kind: event
    summary: "MenuImpl's lazy listener: a context key change that affects a menu's structure, preconditions or toggles fires the menu's onDidChange (re-render)."
    sources:
      - "src/vs/platform/actions/common/menuService.ts:447-454"
    subscribe: [context-key-service.on-did-change-context]
    request: {type: object, properties: {keys: {type: array, items: {type: string}}}}
    behavior:
      - title: Menus whose when-clauses mention a changed key re-evaluate and fire onDidChange
        source: "src/vs/platform/actions/common/menuService.ts:448-452"
        return: {keys: "= has(input.keys) ? input.keys : []"}
  - component: storage-service
    name: on-did-change-value
    kind: event
    summary: "onDidChangeValue(scope, key): a key changed in a scope's storage."
    sources:
      - "src/vs/platform/storage/common/storage.ts:361-363"
    request: {type: object, properties: {scope: {type: string}, key: {type: string}, external: {type: boolean}}}

  # ======== context-key-service ========
  - component: context-key-service
    name: set-context
    kind: function
    summary: "AbstractContextKeyService.setContext: store the value in the root context and fire onDidChangeContext when it changed."
    sources:
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:339-350"
    request: {type: object, required: [key], properties: {key: {type: string, examples: [myExtension.ready]}, value: {examples: [true]}}}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "input.key in state.values && state.values[input.key] == input.value"
        then:
          - title: Context.setValue returns false for an equal value, so no event fires
            source: "src/vs/platform/contextkey/browser/contextKeyService.ts:42-48"
            return: {changed: false}
      - set: {state.values: "= merge(state.values, {input.key: input.value})"}
      - publish: context-key-service.on-did-change-context
        input: {keys: ["= input.key"]}
        delivery: sync
      - return: {changed: true}
  - component: context-key-service
    name: remove-context
    kind: function
    summary: "AbstractContextKeyService.removeContext: delete the key and fire onDidChangeContext if it existed."
    sources:
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:352-359"
    request: {type: object, required: [key], properties: {key: {type: string, examples: [myExtension.ready]}}}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "!(input.key in state.values)"
        then:
          - return: {changed: false}
      - set: {state.values: "= omit(state.values, input.key)"}
      - publish: context-key-service.on-did-change-context
        input: {keys: ["= input.key"]}
        delivery: sync
      - return: {changed: true}
  - component: context-key-service
    name: get-context-key-value
    kind: function
    summary: "getContextKeyValue: a root-context value; config.<setting> keys are read from the configuration service once and cached."
    sources:
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:332-337"
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:149-179"
    request: {type: object, required: [key], properties: {key: {type: string, examples: [config.files.autoSave]}}}
    response: {type: object, properties: {value: {}}}
    behavior:
      - if: "!input.key.startsWith('config.')"
        then:
          - return: {value: "= input.key in state.values ? state.values[input.key] : null"}
      - if: "input.key in state.config_cache"
        then:
          - title: Cached config.* value
            source: "src/vs/platform/contextkey/browser/contextKeyService.ts:155-157"
            return: {value: "= state.config_cache[input.key]"}
      - title: Read the setting through IConfigurationService.getValue and cache it
        source: "src/vs/platform/contextkey/browser/contextKeyService.ts:159-176"
        call: configuration-service.get-value
        input: {key: "= input.key.substring(7)"}
        as: setting
      - set: {state.config_cache: "= merge(state.config_cache, {input.key: vars.setting.value.value})"}
      - return: {value: "= vars.setting.value.value"}
  - component: context-key-service
    name: on-did-change-configuration
    kind: event
    summary: "ConfigAwareContextValuesContainer listener: a DEFAULT change drops every cached config.* key; otherwise only the affected keys (and their sub-keys), then fires onDidChangeContext."
    sources:
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:118-143"
    subscribe: [configuration-service.on-did-change-configuration]
    request:
      type: object
      properties:
        affected_keys: {type: array, items: {type: string}, examples: [[files.autoSave]]}
        source: {type: string, examples: [user]}
    behavior:
      - if: "input.source == 'default'"
        then:
          - title: New setting registered, reset every cached value
            source: "src/vs/platform/contextkey/browser/contextKeyService.ts:119-123"
            set:
              vars.changed: "= state.config_cache.map(k, k)"
              state.config_cache: {}
        else:
          - set:
              vars.changed: "= state.config_cache.filter(k, input.affected_keys.exists(a, k == 'config.' + a || k.startsWith('config.' + a + '.')))"
              state.config_cache: "= state.config_cache.transformMap(k, v, !input.affected_keys.exists(a, k == 'config.' + a || k.startsWith('config.' + a + '.')), v)"
      - publish: context-key-service.on-did-change-context
        input: {keys: "= vars.changed"}
        delivery: sync
  - component: context-key-service
    name: on-did-change-context
    kind: event
    summary: "onDidChangeContext: the context keys whose values changed."
    sources:
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:276-277"
    request: {type: object, properties: {keys: {type: array, items: {type: string}}}}
  - component: context-key-service
    name: cmd--setcontext
    kind: function
    summary: "Command '_setContext' (the vscode setContext API): createKey(String(key), value), which sets the value, or removes the key for undefined."
    sources:
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:644-647"
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:661"
    request:
      type: object
      properties:
        command_id: {type: string, examples: [_setContext]}
        args: {type: array, items: {}, examples: [[myExtension.ready, true]]}
    behavior:
      - if: "size(input.args) > 1 && input.args[1] != null"
        then:
          - title: ContextKey.reset with a default value calls setContext
            source: "src/vs/platform/contextkey/browser/contextKeyService.ts:213-219"
            call: context-key-service.set-context
            input: {key: "= string(input.args[0])", value: "= input.args[1]"}
        else:
          - title: ContextKey.reset with an undefined default removes the key
            source: "src/vs/platform/contextkey/browser/contextKeyService.ts:214-215"
            call: context-key-service.remove-context
            input: {key: "= string(input.args[0])"}
      - return: null
  - component: context-key-service
    name: cmd-getcontextkeyinfo
    kind: function
    summary: "Command 'getContextKeyInfo': every declared RawContextKey (key, type, description), sorted by key."
    sources:
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:663-672"
    response:
      type: array
      items:
        type: object
        properties:
          key: {type: string, examples: [inputFocus]}
          type: {type: string, examples: [boolean]}
          description: {type: string}

  # ======== instantiation-service ========
  - component: instantiation-service
    name: get-or-create-service-instance
    kind: function
    summary: "_getOrCreateServiceInstance: return a cached instance, or create the service after its dependencies; unknown ids resolve to undefined (non-strict), cycles throw."
    sources:
      - "src/vs/platform/instantiation/common/instantiationService.ts:184-195"
      - "src/vs/platform/instantiation/common/instantiationService.ts:212-280"
    request: {type: object, required: [service_id], properties: {service_id: {type: string, description: "the createDecorator id", examples: [contextKeyService]}}}
    response: {type: object, properties: {service_id: {type: string}, created_now: {type: boolean}, found: {type: boolean}}}
    errors:
      - {code: cyclic-dependency-between-services, status: 0, retryable: false}
    behavior:
      - if: "!(input.service_id in state.services)"
        then:
          - title: Unknown service; the non-strict instantiation service returns undefined
            source: "src/vs/platform/instantiation/common/instantiationService.ts:102-105"
            return: {service_id: "= input.service_id", created_now: false, found: false}
      - set: {vars.svc: "= state.services[input.service_id]"}
      - if: "vars.svc.created"
        then:
          - return: {service_id: "= input.service_id", created_now: false, found: true}
      - if: "input.service_id in state.active"
        then:
          - title: The dependency graph has no roots left, a cycle
            source: "src/vs/platform/instantiation/common/instantiationService.ts:255-262"
            fail: {code: cyclic-dependency-between-services, status: 0, message: "= 'cyclic dependency between services: ' + state.active.join(' -> ') + ' -> ' + input.service_id"}
      - set: {state.active: "= state.active + [input.service_id]"}
      - title: Dependencies that are still descriptors are created first (graph roots)
        source: "src/vs/platform/instantiation/common/instantiationService.ts:236-250"
        foreach: "= vars.svc.deps"
        as: dep
        steps:
          - call: instantiation-service.get-or-create-service-instance
            input: {service_id: "= vars.dep"}
            on_error:
              - set: {state.active: "= state.active.filter(a, a != input.service_id)"}
              - fail: "= error"
      - title: Construct the service (its constructor runs with the resolved dependencies)
        source: "src/vs/platform/instantiation/common/instantiationService.ts:270-276"
        call: "= vars.svc.ctor"
        targets: __CTOR_TARGETS__
      - set:
          state.services: "= merge(state.services, {input.service_id: {'created': true}})"
          state.active: "= state.active.filter(a, a != input.service_id)"
      - return: {service_id: "= input.service_id", created_now: true, found: true}
  - component: instantiation-service
    name: invoke-function
    kind: function
    summary: "invokeFunction: run a function with a ServicesAccessor whose get(id) resolves each service on demand."
    sources:
      - "src/vs/platform/instantiation/common/instantiationService.ts:89-116"
    request: {type: object, required: [service_ids], properties: {service_ids: {type: array, items: {type: string}, examples: [[contextKeyService]]}}}
    response: {type: object, properties: {resolved: {type: array}}}
    behavior:
      - foreach: "= input.service_ids"
        as: id
        steps:
          - call: instantiation-service.get-or-create-service-instance
            input: {service_id: "= vars.id"}
            as: got
          - set: {vars.resolved: "= (has(vars.resolved) ? vars.resolved : []) + [vars.got.value]"}
      - return: {resolved: "= has(vars.resolved) ? vars.resolved : []"}

  # ======== undo-redo-service ========
  - component: undo-redo-service
    name: push-element
    kind: function
    summary: "UndoRedoService.pushElement: push onto the resource's past and clear its future (no parallel universes)."
    sources:
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:505-552"
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:284-294"
    request:
      type: object
      required: [resource, label]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        label: {type: string, examples: [Typing]}
    response: {type: object, properties: {past: {type: integer}}}
    behavior:
      - set: {vars.stack: "= input.resource in state.stacks ? state.stacks[input.resource] : {'past': [], 'future': []}"}
      - set: {state.stacks: "= merge(state.stacks, {input.resource: {'past': vars.stack.past + [input.label], 'future': []}})"}
      - return: {past: "= size(vars.stack.past) + 1"}
  - component: undo-redo-service
    name: undo
    kind: function
    summary: "UndoRedoService.undo(resource): move the closest past element to the future and run its undo; nothing happens without one."
    sources:
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:1068-1100"
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:1012-1029"
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {undone: {type: [string, "null"]}}}
    behavior:
      - if: "!(input.resource in state.stacks) || size(state.stacks[input.resource].past) == 0"
        then:
          - title: No edit stack or no past element, so undo does nothing
            source: "src/vs/platform/undoRedo/common/undoRedoService.ts:1080-1089"
            return: {undone: null}
      - set:
          vars.past: "= state.stacks[input.resource].past"
          vars.future: "= state.stacks[input.resource].future"
      - title: moveBackward, then element.actual.undo() under the stack lock
        source: "src/vs/platform/undoRedo/common/undoRedoService.ts:1026-1028"
        set: {state.stacks: "= merge(state.stacks, {input.resource: {'past': vars.past.slice(0, size(vars.past) - 1), 'future': vars.future + [vars.past[size(vars.past) - 1]]}})"}
      - return: {undone: "= vars.past[size(vars.past) - 1]"}
  - component: undo-redo-service
    name: redo
    kind: function
    summary: "UndoRedoService.redo(resource): move the closest future element back to the past and run its redo; nothing happens without one."
    sources:
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:1350-1394"
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:1293-1310"
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {redone: {type: [string, "null"]}}}
    behavior:
      - if: "!(input.resource in state.stacks) || size(state.stacks[input.resource].future) == 0"
        then:
          - title: No edit stack or no future element, so redo does nothing
            source: "src/vs/platform/undoRedo/common/undoRedoService.ts:1360-1369"
            return: {redone: null}
      - set:
          vars.past: "= state.stacks[input.resource].past"
          vars.future: "= state.stacks[input.resource].future"
      - title: moveForward, then element.actual.redo() under the stack lock
        source: "src/vs/platform/undoRedo/common/undoRedoService.ts:1307-1309"
        set: {state.stacks: "= merge(state.stacks, {input.resource: {'past': vars.past + [vars.future[size(vars.future) - 1]], 'future': vars.future.slice(0, size(vars.future) - 1)}})"}
      - return: {redone: "= vars.future[size(vars.future) - 1]"}
  - component: undo-redo-service
    name: can-undo
    kind: function
    summary: "canUndo/canRedo(resource): whether the resource's stack has past (and future) elements."
    sources:
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:697-708"
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {can_undo: {type: boolean}, can_redo: {type: boolean}}}
    behavior:
      - return:
          can_undo: "= input.resource in state.stacks && size(state.stacks[input.resource].past) > 0"
          can_redo: "= input.resource in state.stacks && size(state.stacks[input.resource].future) > 0"

  # ======== marker-service ========
  - component: marker-service
    name: change-one
    kind: function
    summary: "MarkerService.changeOne(owner, resource, markers): empty data removes the tuple; otherwise markers without a message are dropped, lines sanitized, stored, and onMarkerChanged fires."
    sources:
      - "src/vs/platform/markers/common/markerService.ts:188-209"
      - "src/vs/platform/markers/common/markerService.ts:237-273"
    request:
      type: object
      required: [owner, resource, markers]
      properties:
        owner: {type: string, examples: [typescript]}
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        markers:
          type: array
          maxItems: 2
          items:
            type: object
            required: [severity, message, start_line_number, end_line_number]
            properties:
              severity: {type: integer, examples: [8]}
              message: {type: string, examples: ["Cannot find name 'ad'."]}
              start_line_number: {type: integer, examples: [2]}
              end_line_number: {type: integer, examples: [2]}
    response: {type: object, properties: {count: {type: integer}}}
    behavior:
      - if: "size(input.markers) == 0"
        then:
          - if: "input.resource in state.data && input.owner in state.data[input.resource]"
            then:
              - title: Remove the (owner, resource) tuple and fire onMarkerChanged
                source: "src/vs/platform/markers/common/markerService.ts:190-195"
                set: {state.data: "= state.data.transformMap(r, m, r == input.resource ? omit(m, input.owner) : m)"}
              - publish: marker-service.on-marker-changed
                input: {resources: ["= input.resource"]}
          - return: {count: 0}
      - title: Markers without a message are dropped; line numbers are sanitized
        source: "src/vs/platform/markers/common/markerService.ts:246-253"
        set:
          vars.markers: "= input.markers.filter(m, m.message != '').map(m, {'owner': input.owner, 'resource': input.resource, 'severity': m.severity, 'message': m.message, 'start_line_number': m.start_line_number > 0 ? m.start_line_number : 1, 'end_line_number': m.end_line_number >= (m.start_line_number > 0 ? m.start_line_number : 1) ? m.end_line_number : (m.start_line_number > 0 ? m.start_line_number : 1)})"
      - set: {state.data: "= merge(state.data, {input.resource: {input.owner: vars.markers}})"}
      - title: MicrotaskEmitter delivers onMarkerChanged after the current task
        source: "src/vs/platform/markers/common/markerService.ts:159-161"
        publish: marker-service.on-marker-changed
        input: {resources: ["= input.resource"]}
      - return: {count: "= size(vars.markers)"}
  - component: marker-service
    name: get-statistics
    kind: function
    summary: "MarkerService.getStatistics: the live MarkerStats (error, warning, info and unknown totals)."
    sources:
      - "src/vs/platform/markers/common/markerService.ts:174-176"
    response: {type: object, properties: {errors: {type: integer}, warnings: {type: integer}, infos: {type: integer}, unknowns: {type: integer}}}
    behavior:
      - set: {vars.all: "= state.data.map(r, state.data[r].map(o, state.data[r][o])).flatten(2)"}
      - return:
          errors: "= vars.all.filter(m, m.severity == 8).size()"
          warnings: "= vars.all.filter(m, m.severity == 4).size()"
          infos: "= vars.all.filter(m, m.severity == 2).size()"
          unknowns: "= vars.all.filter(m, !(m.severity in [2, 4, 8])).size()"
  - component: marker-service
    name: read
    kind: function
    summary: "MarkerService.read({owner, resource}): the markers of one tuple, of one resource or owner, or all."
    sources:
      - "src/vs/platform/markers/common/markerService.ts:341-400"
    request:
      type: object
      properties:
        owner: {type: string, examples: [typescript]}
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
    response: {type: array, items: PlatformMarker}
    behavior:
      - set: {vars.all: "= state.data.map(r, state.data[r].map(o, state.data[r][o])).flatten(2)"}
      - return: "= vars.all.filter(m, (!has(input.owner) || m.owner == input.owner) && (!has(input.resource) || m.resource == input.resource))"
  - component: marker-service
    name: on-marker-changed
    kind: event
    summary: "onMarkerChanged: the resources whose markers changed (merged per microtask)."
    sources:
      - "src/vs/platform/markers/common/markerService.ts:159-163"
    request: {type: object, properties: {resources: {type: array, items: {type: string}}}}
  - component: marker-stats
    name: on-marker-changed
    kind: event
    summary: "MarkerStats._update: recompute each changed resource's counts from read({resource}) and adjust the totals."
    sources:
      - "src/vs/platform/markers/common/markerService.ts:105-115"
    subscribe: [marker-service.on-marker-changed]
    request: {type: object, properties: {resources: {type: array, items: {type: string}}}}
    behavior:
      - foreach: "= input.resources"
        as: r
        steps:
          - call: marker-service.read
            input: {resource: "= vars.r"}
            as: rd
          - title: _resourceStats counts severities (Error 8, Warning 4, Info 2, others unknown)
            source: "src/vs/platform/markers/common/markerService.ts:117-142"
            set:
              state.by_resource: "= merge(state.by_resource, {vars.r: {'errors': vars.rd.value.filter(m, m.severity == 8).size(), 'warnings': vars.rd.value.filter(m, m.severity == 4).size(), 'infos': vars.rd.value.filter(m, m.severity == 2).size(), 'unknowns': vars.rd.value.filter(m, !(m.severity in [2, 4, 8])).size()}})"
      - set:
          state.errors: "= sum(state.by_resource.map(k, state.by_resource[k].errors))"
          state.warnings: "= sum(state.by_resource.map(k, state.by_resource[k].warnings))"
          state.infos: "= sum(state.by_resource.map(k, state.by_resource[k].infos))"
          state.unknowns: "= sum(state.by_resource.map(k, state.by_resource[k].unknowns))"

