schema_version: 1
id: vscode

schemas:
  - id: PlatformFileStat
    summary: "IFileStatWithMetadata as FileService returns it after a write or resolve (resource, mtime, size, etag, readonly)."
    schema:
      type: object
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        mtime: {type: integer, examples: [1793318400000]}
        size: {type: integer, examples: [54]}
        etag: {type: string, examples: ["1793318400000-54"]}
        readonly: {type: boolean, default: false}
  - id: PlatformMarker
    summary: "IMarker after MarkerService._toMarker sanitized it."
    schema:
      type: object
      required: [owner, resource, severity, message]
      properties:
        owner: {type: string, examples: [typescript]}
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        severity: {type: integer, enum: [1, 2, 4, 8], examples: [8]}
        message: {type: string, examples: ["Cannot find name 'ad'."]}
        start_line_number: {type: integer, examples: [2]}
        end_line_number: {type: integer, examples: [2]}

components:
  # ---------------- commands ----------------
  - id: command-service
    name: CommandService
    kind: service
    parent: platform
    summary: "ICommandService implementation: activates extensions for onCommand:<id>, then runs the registered handler through the instantiation service."
    sources:
      - "src/vs/platform/commands/common/commands.ts:15"
      - "src/vs/workbench/services/commands/common/commandService.ts:15-111"
      - "src/vs/workbench/services/commands/common/commandService.ts:113"
    attributes: {owner: platform-core, class: CommandService, decorator: commandService, note: "Seam owned by platform-core per the brief; the class file lives under src/vs/workbench/services/commands."}
    state:
      schema: {type: object, properties: {extension_host_ready: {type: boolean}, star_activation_settled: {type: boolean}}}
      initial: {extension_host_ready: true, star_activation_settled: false}
  - id: commands-registry
    name: CommandsRegistry
    kind: module
    parent: platform
    summary: "The global command table: id -> most recently registered handler (a LinkedList per id)."
    sources:
      - "src/vs/platform/commands/common/commands.ts:67-147"
    attributes: {owner: platform-core, note: "Rows are {handler: <interface id of the registering area's cmd-<slug> interface>}. Other areas register their commands here (seed or register-command)."}
    state:
      schema: {type: object, properties: {commands: {type: object}}}
      initial:
        commands:
          noop: {handler: commands-registry.cmd-noop}
          _setContext: {handler: context-key-service.cmd--setcontext}
          getContextKeyInfo: {handler: context-key-service.cmd-getcontextkeyinfo}
          quickInput.accept: {handler: quick-input-controller.cmd-quickinput-accept}
          menu.resetHiddenStates: {handler: menu-hidden-states-reset.cmd-menu-resethiddenstates}
          hideCodeActionWidget: {handler: action-widget-service.cmd-hidecodeactionwidget}
          acceptSelectedCodeAction: {handler: action-widget-service.cmd-acceptselectedcodeaction}
          previewSelectedCodeAction: {handler: action-widget-service.cmd-previewselectedcodeaction}

  # ---------------- configuration ----------------
  - id: configuration-service
    name: ConfigurationService
    kind: service
    parent: platform
    summary: "IConfigurationService: resolves a key through policy > [language] overrides > folder > workspace > user > registered default (Configuration.getConsolidatedConfigurationModel), and writes user settings. Holds the PolicyConfiguration model (policy) fed by IPolicyService."
    sources:
      - "src/vs/platform/configuration/common/configuration.ts:14"
      - "src/vs/platform/configuration/common/configurationService.ts:27-188"
      - "src/vs/platform/configuration/common/configurationModels.ts:768-790"
    attributes: {owner: platform-core, class: ConfigurationService, decorator: configurationService, note: "The workbench's WorkspaceService (workbench-shell) wraps the same Configuration model; the default layer is the merged registerConfiguration defaults, which are the config entities."}
    state:
      schema:
        type: object
        properties:
          policy: {type: object, description: "PolicyConfiguration model: setting key -> policy value"}
          default_overrides: {type: object, description: "registered default [language] overrides"}
          policy_settings: {type: object, description: "configuration registry policy table: policy name -> {key, type} of the owning setting"}
      initial:
        policy: {}
        # registerDefaultConfigurations in src/vs/editor/common/languages/modesRegistry.ts:64-86
        default_overrides:
          "[plaintext]": {editor.unicodeHighlight.ambiguousCharacters: false, editor.unicodeHighlight.invisibleCharacters: false}
          "[go]": {editor.insertSpaces: false}
          "[makefile]": {editor.insertSpaces: false}
          "[shellscript]": {files.eol: "\n"}
          "[yaml]": {editor.insertSpaces: true, editor.tabSize: 2}
        # policy: {name} declarations (configurationRegistry.ts:899 records name -> key):
        # extensionManagement.ts:761, update.config.contribution.ts:33, extensions.contribution.ts:151, telemetryService.ts:386
        # chat.shared.contribution.ts:1545, :2006, :2299 (chat policies AccountPolicyService computes)
        policy_settings:
          ChatAgentMode: {key: chat.agent.enabled, type: boolean}
          McpGalleryServiceUrl: {key: chat.mcp.gallery.serviceUrl, type: string}
          ChatHooks: {key: chat.useHooks, type: boolean}
          AllowedExtensions: {key: extensions.allowed, type: object}
          UpdateMode: {key: update.mode, type: string}
          ExtensionsAutoUpdate: {key: extensions.autoUpdate, type: string}
          EnableFeedback: {key: telemetry.feedback.enabled, type: boolean}
  - id: configuration-editing
    name: ConfigurationEditing
    kind: module
    parent: configuration-service
    summary: "Queues writes to the user settings.json (Queue<void>), so edits never race."
    sources:
      - "src/vs/platform/configuration/common/configurationService.ts:190-229"
    capacity: {concurrency: 1}
    attributes: {owner: platform-core}

  # ---------------- files ----------------
  - id: file-service
    name: FileService
    kind: service
    parent: platform
    summary: "IFileService: routes URIs to file system providers by scheme, validates writes (readonly, dirty-write prevention by mtime/etag), and reads and deletes files."
    sources:
      - "src/vs/platform/files/common/files.ts:26"
      - "src/vs/platform/files/common/fileService.ts:26-35"
      - "src/vs/platform/files/common/fileService.ts:136-156"
    attributes: {owner: platform-core, class: FileService, decorator: fileService}
    state:
      schema: {type: object, properties: {providers: {type: object}}}
      initial:
        providers:
          file: {readonly: false, trash: true}
          vscode-userdata: {readonly: false, trash: false}

  # ---------------- storage ----------------
  - id: storage-service
    name: AbstractStorageService and Storage
    kind: service
    parent: platform
    summary: "IStorageService over one Storage per scope: an in-memory cache with pending inserts and deletes, flushed to the state database after the flush delay."
    sources:
      - "src/vs/platform/storage/common/storage.ts:19"
      - "src/vs/platform/storage/common/storage.ts:332-355"
      - "src/vs/base/parts/storage/common/storage.ts:115-130"
    attributes: {owner: platform-core, decorator: storageService, note: "Named after IStorageService: the desktop class is NativeWorkbenchStorageService (workbench) extending RemoteStorageService/AbstractStorageService (platform); the logic modelled is AbstractStorageService plus base Storage."}
    state:
      schema: {type: object, properties: {items: {type: object}, pending: {type: object}}}
      initial:
        items: {application: {}, profile: {}, workspace: {}}
        pending: {application: {}, profile: {}, workspace: {}}

  # ---------------- context keys ----------------
  - id: context-key-service
    name: ContextKeyService
    kind: service
    parent: platform
    summary: "IContextKeyService: the root context's values, plus config.* keys read lazily from the configuration service and cached until the setting changes."
    sources:
      - "src/vs/platform/contextkey/common/contextkey.ts:2056"
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:379-393"
      - "src/vs/platform/contextkey/browser/contextKeyService.ts:105-191"
    attributes: {owner: platform-core, class: ContextKeyService, decorator: contextKeyService}
    state:
      schema: {type: object, properties: {values: {type: object}, config_cache: {type: object}}}
      initial: {values: {inputFocus: false}, config_cache: {}}

  # ---------------- instantiation ----------------
  - id: instantiation-service
    name: InstantiationService
    kind: service
    parent: platform
    summary: "IInstantiationService: lazily creates registered services (dependencies first), caches them, and detects cycles."
    sources:
      - "src/vs/platform/instantiation/common/instantiation.ts:41"
      - "src/vs/platform/instantiation/common/instantiationService.ts:28"
    attributes: {owner: platform-core, class: InstantiationService, decorator: instantiationService}
    state:
      schema: {type: object, properties: {services: {type: object}, active: {type: array}}}
      initial: {services: {}, active: []}

  # ---------------- undo/redo ----------------
  - id: undo-redo-service
    name: UndoRedoService
    kind: service
    parent: platform
    summary: "IUndoRedoService: one ResourceEditStack (past, future) per resource comparison key."
    sources:
      - "src/vs/platform/undoRedo/common/undoRedo.ts:10"
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:458-470"
      - "src/vs/platform/undoRedo/common/undoRedoService.ts:1399"
    attributes: {owner: platform-core, class: UndoRedoService, decorator: undoRedoService}
    state:
      schema: {type: object, properties: {stacks: {type: object}}}
      initial: {stacks: {}}

  # ---------------- markers ----------------
  - id: marker-service
    name: MarkerService
    kind: service
    parent: platform
    summary: "IMarkerService: diagnostics by (resource, owner); changes fire onMarkerChanged through a MicrotaskEmitter."
    sources:
      - "src/vs/platform/markers/common/markers.ts:219"
      - "src/vs/platform/markers/common/markerService.ts:155-172"
    attributes: {owner: platform-core, class: MarkerService, decorator: markerService}
    state:
      schema: {type: object, properties: {data: {type: object}}}
      initial: {data: {}}
  - id: marker-stats
    name: MarkerStats
    kind: module
    parent: marker-service
    summary: "Error, warning, info and unknown counts per resource and in total, updated on every onMarkerChanged."
    sources:
      - "src/vs/platform/markers/common/markerService.ts:85-150"
    attributes: {owner: platform-core}
    state:
      schema: {type: object, properties: {by_resource: {type: object}, errors: {type: integer}, warnings: {type: integer}, infos: {type: integer}, unknowns: {type: integer}}}
      initial: {by_resource: {}, errors: 0, warnings: 0, infos: 0, unknowns: 0}

  # ---------------- menus and actions ----------------
  - id: menu-service
    name: MenuService
    kind: service
    parent: platform
    summary: "IMenuService: builds menus from MenuRegistry and owns the persisted hidden-command states."
    sources:
      - "src/vs/platform/actions/common/actions.ts:386"
      - "src/vs/platform/actions/common/menuService.ts:20-34"
      - "src/vs/platform/actions/common/actions.contribution.ts:11"
    attributes: {owner: platform-core, class: MenuService, decorator: menuService}
  - id: persisted-menu-hide-state
    name: PersistedMenuHideState
    kind: module
    parent: menu-service
    summary: "Which commands the user hid in which menus, persisted as JSON under the profile storage key menu.hiddenCommands."
    sources:
      - "src/vs/platform/actions/common/menuService.ts:53-160"
    attributes: {owner: platform-core}
    state:
      schema: {type: object, properties: {data: {type: object}, ignore_change_event: {type: boolean}}}
      initial: {data: {}, ignore_change_event: false}
  - id: menu-hidden-states-reset
    name: MenuHiddenStatesReset
    kind: function
    parent: menu-service
    summary: "Action2 'Reset All Menus' (menu.resetHiddenStates)."
    sources:
      - "src/vs/platform/actions/common/menuResetAction.ts:12-27"
      - "src/vs/platform/actions/common/actions.contribution.ts:13"
    attributes: {owner: platform-core}
  - id: action-widget-service
    name: ActionWidgetService
    kind: service
    parent: platform
    summary: "IActionWidgetService: the code-action style list widget; its keyboard commands accept, preview or hide the selected item."
    sources:
      - "src/vs/platform/actionWidget/browser/actionWidget.ts:40"
      - "src/vs/platform/actionWidget/browser/actionWidget.ts:78-90"
      - "src/vs/platform/actionWidget/browser/actionWidget.ts:327"
    attributes: {owner: platform-core, class: ActionWidgetService, decorator: actionWidgetService}
    state:
      schema: {type: object, properties: {visible: {type: boolean}, selected: {type: [string, "null"]}}}
      initial: {visible: false, selected: null}
  - id: quick-input-controller
    name: QuickInputController
    kind: module
    parent: platform
    summary: "Owns the currently shown quick input (quick pick, input box or tree); quickInput.accept accepts it."
    sources:
      - "src/vs/platform/quickinput/browser/quickInputController.ts:66"
      - "src/vs/platform/quickinput/browser/quickInputController.ts:81"
    attributes: {owner: platform-core, note: "IQuickInputService itself is registered by workbench-shell (workbench QuickInputService subclass)."}
    state:
      schema: {type: object, properties: {current_quick_input: {type: [object, "null"]}}}
      initial: {current_quick_input: null}

  # ---------------- utility process mains and IPC channels ----------------
  - id: watcher-main
    name: watcherMain
    kind: function
    parent: platform
    summary: "Entry of the file watcher utility (or child) process: creates UniversalWatcher and serves it on the 'watcher' IPC channel."
    sources:
      - "src/vs/platform/files/node/watcher/watcherMain.ts:13-21"
    attributes: {owner: platform-core, process: file-watcher}
  - id: universal-watcher
    name: UniversalWatcher
    kind: module
    parent: watcher-main
    summary: "Recursive (parcel) and non-recursive (node.js) watchers behind one IUniversalWatcher; the 'watcher' channel server."
    sources:
      - "src/vs/platform/files/node/watcher/watcher.ts:14-30"
      - "src/vs/platform/files/node/watcher/watcherMain.ts:21"
    attributes: {owner: platform-core, process: file-watcher}
  - id: local-transcription-main
    name: localTranscriptionMain
    kind: function
    parent: platform
    summary: "Entry of the local transcription utility process: serves LocalTranscriptionService on the 'localTranscription' channel."
    sources:
      - "src/vs/platform/localTranscription/node/localTranscriptionMain.ts:13-19"
      - "src/vs/platform/localTranscription/node/localTranscriptionService.ts:226"
    attributes: {owner: platform-core, process: local-transcription, note: "ILocalTranscriptionService's registered implementation is the workbench client (workbench-shell); this component is the utility-process server class."}
  - id: profile-analysis-worker-main
    name: profileAnalysisWorkerMain
    kind: function
    parent: platform
    summary: "Entry of the profile analysis web worker: bootstrapWebWorker(create)."
    sources:
      - "src/vs/platform/profiling/electron-browser/profileAnalysisWorkerMain.ts:6-9"
    attributes: {owner: platform-core, process: web-worker}
  - id: git-hub-credentials-channel
    name: GitHubCredentialsChannel
    kind: module
    parent: platform
    summary: "Renderer-side 'githubCredentials' channel the shared process calls back to for GitHub credentials."
    sources:
      - "src/vs/platform/github/common/remote/ipcClient.ts:93"
      - "src/vs/platform/github/electron-browser/githubService.ts:26"
    attributes: {owner: platform-core}
  - id: git-hub-channel
    name: GitHubChannel
    kind: module
    parent: platform
    summary: "Shared-process 'github' channel, registered once per renderer connection (registerGitHubChannel)."
    sources:
      - "src/vs/platform/github/common/remote/ipcServer.ts:22-36"
      - "src/vs/platform/github/common/remote/ipcServer.ts:39-51"
    attributes: {owner: platform-core, process: shared-process}

  - id: opener-service
    name: OpenerService
    kind: service
    parent: platform
    summary: "IOpenerService: tries its openers in order (external resource, command, editor) after validation; internal URIs are never opened."
    sources:
      - "src/vs/platform/opener/common/opener.ts:12"
      - "src/vs/editor/browser/services/openerService.ts:117-163"
    attributes: {owner: platform-core, class: OpenerService, decorator: openerService, note: "Implementation file is under src/vs/editor; the coordinator assigned the contract to platform-core (agents' request)."}
  - id: secret-storage-service
    name: BaseSecretStorageService
    kind: service
    parent: platform
    summary: "ISecretStorageService: secrets kept in APPLICATION/MACHINE storage under secret://<key>, encrypted unless the storage is in-memory, with per-key sequencing."
    sources:
      - "src/vs/platform/secrets/common/secrets.ts:86"
      - "src/vs/platform/secrets/common/secrets.ts:101-120"
    attributes: {owner: platform-core, class: BaseSecretStorageService, decorator: secretStorageService, note: "Desktop registers NativeSecretStorageService (workbench) which extends this base class."}
  - id: editor-service
    kind: service
    parent: workbench
    attributes: {boundary: true, owner: workbench-shell}
  - id: account-policy-service
    kind: service
    parent: workbench
    attributes: {boundary: true, owner: workbench-shell}
  # ---------------- boundary stub components ----------------
  - id: extension-service
    kind: service
    parent: exthost-bridge
    attributes: {boundary: true, owner: exthost}

interfaces:
  # ======== command-service ========
  - component: command-service
    name: execute-command
    kind: function
    summary: "ICommandService.executeCommand: activate for onCommand:<id>, then run the handler; unregistered commands also wait for * activation (at most 30 s)."
    sources:
      - "src/vs/workbench/services/commands/common/commandService.ts:52-90"
    request:
      type: object
      required: [command_id]
      properties:
        command_id: {type: string, examples: [noop]}
        args: {type: array, items: {}, default: []}
    errors:
      - {code: command-not-found, status: 0, retryable: false}
    behavior:
      - set:
          vars.activation_event: "= 'onCommand:' + input.command_id"
          vars.args: "= has(input.args) ? input.args : []"
      - call: commands-registry.get-command
        input: {command_id: "= input.command_id"}
        as: lookup
        on_error: continue
      - if: "vars.lookup.ok"
        then:
          - if: "state.extension_host_ready"
            then:
              - title: Wait for the onCommand activation event before running the registered command
                source: "src/vs/workbench/services/commands/common/commandService.ts:73-75"
                call: extension-service.activate-by-event
                input: {activation_event: "= vars.activation_event", activation_kind: normal}
            else:
              - title: Extension host not ready, so the activation is sent but not awaited
                source: "src/vs/workbench/services/commands/common/commandService.ts:66-71"
                emit: extension-service.activate-by-event
                input: {activation_event: "= vars.activation_event", activation_kind: normal}
          - call: command-service.try-execute-command
            input: {command_id: "= input.command_id", args: "= vars.args"}
            as: executed
          - return: "= vars.executed.value"
      - title: Unregistered command activates onCommand and, in parallel, * activation raced against 30 s
        source: "src/vs/workbench/services/commands/common/commandService.ts:78-87"
        branches:
          - - call: extension-service.activate-by-event
              input: {activation_event: "= vars.activation_event", activation_kind: normal}
          - - call: command-service.activate-star
        join: {need: all}
        on_insufficient: {code: canceled, status: 0, retryable: false}
      - call: command-service.try-execute-command
        input: {command_id: "= input.command_id", args: "= vars.args"}
        as: executed
      - return: "= vars.executed.value"
  - component: command-service
    name: activate-star
    kind: function
    summary: "_activateStar: activateByEvent('*') raced against timeout(30000); the promise is shared by later callers."
    sources:
      - "src/vs/workbench/services/commands/common/commandService.ts:38-50"
    behavior:
      - if: "state.star_activation_settled"
        then:
          - title: The shared * activation promise has already settled
            return: {timed_out: false, shared: true}
      - call: extension-service.activate-by-event
        input: {activation_event: "*", activation_kind: normal}
        timeout_ms: 30000
        as: star
        on_error:
          - title: Only the 30 s timer winning the race is tolerated; a rejected activation rejects the race
            source: "src/vs/workbench/services/commands/common/commandService.ts:41-44"
            when: "error.code != 'timeout'"
            fail: "= error"
      - set: {state.star_activation_settled: true}
      - return: {timed_out: "= !vars.star.ok", shared: false}
  - component: command-service
    name: try-execute-command
    kind: function
    summary: "_tryExecuteCommand: look the command up again, fire onWillExecuteCommand, invokeFunction(handler, ...args), fire onDidExecuteCommand."
    sources:
      - "src/vs/workbench/services/commands/common/commandService.ts:92-105"
    request:
      type: object
      required: [command_id]
      properties:
        command_id: {type: string, examples: [noop]}
        args: {type: array, items: {}, default: []}
    errors:
      - {code: command-not-found, status: 0, retryable: false}
    behavior:
      - call: commands-registry.get-command
        input: {command_id: "= input.command_id"}
        as: lookup
        on_error:
          - title: Command not found
            source: "src/vs/workbench/services/commands/common/commandService.ts:93-96"
            fail: {code: command-not-found, status: 0, message: "= \"command '\" + input.command_id + \"' not found\""}
      - title: onWillExecuteCommand fires, then the handler runs with a services accessor; onDidExecuteCommand fires after it returns
        source: "src/vs/workbench/services/commands/common/commandService.ts:98-101"
        call: "= vars.lookup.value.handler"
        targets:
          - commands-registry.cmd-noop
          - context-key-service.cmd--setcontext
          - context-key-service.cmd-getcontextkeyinfo
          - quick-input-controller.cmd-quickinput-accept
          - menu-hidden-states-reset.cmd-menu-resethiddenstates
          - action-widget-service.cmd-hidecodeactionwidget
          - action-widget-service.cmd-acceptselectedcodeaction
          - action-widget-service.cmd-previewselectedcodeaction
        input: {command_id: "= input.command_id", args: "= input.args"}
        as: handled
      - return: "= vars.handled.value"

  # ======== commands-registry ========
  - component: commands-registry
    name: get-command
    kind: function
    summary: "CommandsRegistry.getCommand: the first (most recent) handler registered for the id, or undefined."
    sources:
      - "src/vs/platform/commands/common/commands.ts:129-135"
    request: {type: object, required: [command_id], properties: {command_id: {type: string, examples: [noop]}}}
    response: {type: object, properties: {handler: {type: string}}}
    errors:
      - {code: command-not-found, status: 0, retryable: false}
    store: {table: commands, op: get, key: "= input.command_id", not_found: command-not-found}
  - component: commands-registry
    name: register-command
    kind: function
    summary: "CommandsRegistry.registerCommand: unshift the handler for the id (the newest wins) and fire onDidRegisterCommand. Used by every area at startup and by MainThreadCommands.$registerCommand."
    sources:
      - "src/vs/platform/commands/common/commands.ts:74-123"
    request:
      type: object
      required: [command_id, handler]
      properties:
        command_id: {type: string, examples: [noop]}
        handler: {type: string, description: "interface id of the registering area's cmd-<slug> interface", examples: [commands-registry.cmd-noop]}
    store: {table: commands, op: put, key: "= input.command_id", value: {handler: "= input.handler"}}
  - component: commands-registry
    name: cmd-noop
    kind: function
    summary: "Command 'noop': an empty handler."
    sources:
      - "src/vs/platform/commands/common/commands.ts:149"

  # ======== configuration-service ========
  - component: configuration-service
    name: get-value
    kind: function
    summary: "IConfigurationService.getValue(key, {resource, overrideIdentifier}) as the workbench's WorkspaceService runs it: policy on top; else a [language] override at any layer (folder > workspace > user > default; a [lang]-only section beats a multi-language one); else the general value of the resource's folder, then workspace, then user, else the registered default (config entity), else undefined."
    sources:
      - "src/vs/workbench/services/configuration/browser/configurationService.ts:335-339"
      - "src/vs/platform/configuration/common/configurationService.ts:96-100"
      - "src/vs/platform/configuration/common/configurationModels.ts:1033-1046"
      - "src/vs/platform/configuration/common/configurationModels.ts:1048-1063"
      - "src/vs/platform/configuration/common/configurationModels.ts:1065-1070"
      - "src/vs/platform/configuration/common/configurationModels.ts:147-154"
      - "src/vs/platform/configuration/common/configurationModels.ts:231-252"
    request:
      type: object
      required: [key]
      properties:
        key: {type: string, description: "the setting key (files.autoSave)", examples: [files.autoSave]}
        resource: {type: string, default: "", description: "IConfigurationOverrides.resource (selects the folder layer); empty = none"}
        override_identifier: {type: string, default: "", description: "IConfigurationOverrides.overrideIdentifier, a language id (typescript); empty = none"}
    response: {type: object, properties: {value: {}}}
    behavior:
      - set:
          vars.config_id: "= input.key.split('').map(c, c == '.' ? '-' : ('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.contains(c) ? '-' + c.lowerAscii() : c)).join('')"
          vars.lang: "= has(input.override_identifier) && input.override_identifier != null ? input.override_identifier : ''"
          vars.folder_settings: {}
      - set:
          vars.section: "= '[' + vars.lang + ']'"
      - if: "input.key in state.policy"
        then:
          - title: A policy value overrides every other layer, language overrides included (applied after .override())
            source: "src/vs/platform/configuration/common/configurationModels.ts:1038-1044"
            return: {value: "= state.policy[input.key]"}
      - if: "has(input.resource) && input.resource != null && input.resource != ''"
        then:
          - title: "WorkspaceService passes its workspace, so a resource selects the folder that contains it (Workspace.getFolder: the longest folder prefix)"
            source: "src/vs/platform/workspace/common/workspace.ts:393-399"
            call: workspace-context.get-workspace
            as: ws
            on_error: continue
          - set:
              vars.roots: "= vars.ws.ok ? vars.ws.value.folders.filter(f, input.resource == f || input.resource.startsWith(f + '/')) : []"
          - if: "size(vars.roots) > 0"
            then:
              - title: "The resource's root folder has its own settings model (.vscode/settings.json of that folder), merged over the workspace consolidation"
                source: "src/vs/platform/configuration/common/configurationModels.ts:1072-1085"
                call: settings-store.folder-read
                input: {folder: "= vars.roots.filter(r, vars.roots.all(o, size(o) <= size(r)))[0]"}
                as: folder
                on_error: continue
              - if: "vars.folder.ok"
                then:
                  - set:
                      vars.folder_settings: "= vars.folder.value"
      - if: "vars.lang != ''"
        then:
          - title: "consolidated.override(lang): the [lang] section of the merged layers replaces the general value, so a [lang] value at any layer beats a general value at any layer; the folder layer is merged last"
            source: "src/vs/platform/configuration/common/configurationModels.ts:1035-1037"
            if: "vars.section in vars.folder_settings && input.key in vars.folder_settings[vars.section]"
            then:
              - return: {value: "= vars.folder_settings[vars.section][input.key]"}
          - call: settings-store.workspace-read
            input: {key: "= vars.section"}
            as: ws_lang
            on_error: continue
          - if: "vars.ws_lang.ok && input.key in vars.ws_lang.value"
            then:
              - title: Workspace [lang] section
                source: "src/vs/platform/configuration/common/configurationModels.ts:169-178"
                return: {value: "= vars.ws_lang.value[input.key]"}
          - call: settings-store.user-read
            input: {key: "= vars.section"}
            as: user_lang
            on_error: continue
          - if: "vars.user_lang.ok && input.key in vars.user_lang.value"
            then:
              - title: User [lang] section, which beats a general workspace value
                source: "src/vs/platform/configuration/common/configurationModels.ts:198-213"
                return: {value: "= vars.user_lang.value[input.key]"}
          - if: "vars.section in state.default_overrides && input.key in state.default_overrides[vars.section]"
            then:
              - title: "A registered default override (registerDefaultConfigurations, e.g. [shellscript] files.eol)"
                source: "src/vs/editor/common/languages/modesRegistry.ts:64-86"
                return: {value: "= state.default_overrides[vars.section][input.key]"}
          - title: "No [lang]-only section sets the key: multi-language sections ([javascript][typescript]) that include the language are merged, below a [lang]-only one"
            source: "src/vs/platform/configuration/common/configurationModels.ts:243-251"
            set:
              vars.folder_multi: "= vars.folder_settings.filter(k, matches(k, '^(\\\\[[^\\\\]]+\\\\])+$') && k.contains(vars.section) && k != vars.section && input.key in vars.folder_settings[k])"
          - if: "size(vars.folder_multi) > 0"
            then:
              - return: {value: "= vars.folder_settings[vars.folder_multi[0]][input.key]"}
          - call: settings-store.workspace-override-query
            input: {key: "= input.key", override_identifier: "= vars.lang"}
            as: ws_multi
            on_error: continue
          - if: "vars.ws_multi.ok && size(vars.ws_multi.value) > 0"
            then:
              - return: {value: "= vars.ws_multi.value[0][input.key]"}
          - call: settings-store.user-override-query
            input: {key: "= input.key", override_identifier: "= vars.lang"}
            as: user_multi
            on_error: continue
          - if: "vars.user_multi.ok && size(vars.user_multi.value) > 0"
            then:
              - return: {value: "= vars.user_multi.value[0][input.key]"}
      - if: "input.key in vars.folder_settings"
        then:
          - title: "The folder's general value beats the workspace's (getFolderConsolidatedConfiguration merges the folder model last)"
            source: "src/vs/platform/configuration/common/configurationModels.ts:1076-1079"
            return: {value: "= vars.folder_settings[input.key]"}
      - call: settings-store.workspace-read
        input: {key: "= input.key"}
        as: workspace
        on_error: continue
      - if: "vars.workspace.ok"
        then:
          - title: Workspace settings override user settings (default < application < user < workspace)
            source: "src/vs/platform/configuration/common/configurationModels.ts:1067"
            return: {value: "= vars.workspace.value"}
      - call: settings-store.user-read
        input: {key: "= input.key"}
        as: user
        on_error: continue
      - if: "vars.user.ok"
        then:
          - return: {value: "= vars.user.value"}
      - if: "vars.config_id in config"
        then:
          - title: Fall back to the registered default (DefaultConfiguration from the configuration registry)
            source: "src/vs/platform/configuration/common/configurations.ts:35-50"
            return: {value: "= config[vars.config_id]"}
      - title: An unregistered key with no value resolves to undefined
        return: {value: null}
  - component: configuration-service
    name: update-value
    kind: function
    summary: "ConfigurationService.updateValue: refuse non-user targets and policy-controlled keys, drop values equal to the default, write settings.json, reload and fire onDidChangeConfiguration."
    sources:
      - "src/vs/platform/configuration/common/configurationService.ts:106-144"
    request:
      type: object
      required: [key, value]
      properties:
        key: {type: string, examples: [files.autoSave]}
        value: {examples: [afterDelay]}
        target: {type: string, enum: [user, user-local, workspace, workspace-folder, application, memory], default: user}
    response: {type: object, properties: {key: {type: string}, removed: {type: boolean}}}
    errors:
      - {code: unable-to-write-to-target, status: 0, retryable: false}
      - {code: configured-in-system-policy, status: 0, retryable: false}
      - {code: unable-to-write-into-the-settings-file, status: 0, retryable: false}
    behavior:
      - if: "has(input.target) && !(input.target in ['user', 'user-local'])"
        then:
          - title: Only USER and USER_LOCAL targets can be written
            source: "src/vs/platform/configuration/common/configurationService.ts:111-115"
            fail: {code: unable-to-write-to-target, status: 0, message: "= 'Unable to write ' + input.key + ' to target ' + input.target + '.'"}
      - if: "input.key in state.policy"
        then:
          - title: The key is configured in system policy
            source: "src/vs/platform/configuration/common/configurationService.ts:122-125"
            fail: {code: configured-in-system-policy, status: 0, message: "= 'Unable to write ' + input.key + ' because it is configured in system policy.'"}
      - set:
          vars.config_id: "= input.key.split('').map(c, c == '.' ? '-' : ('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.contains(c) ? '-' + c.lowerAscii() : c)).join('')"
      - set:
          vars.equals_default: "= vars.config_id in config && config[vars.config_id] == input.value"
      - title: Write settings.json through the editing queue; a value equal to the default removes the setting
        source: "src/vs/platform/configuration/common/configurationService.ts:127-142"
        call: configuration-editing.write
        input: {key: "= input.key", value: "= vars.equals_default ? null : input.value"}
      - title: reloadConfiguration compares the user model and fires onDidChangeConfiguration (source USER)
        source: "src/vs/platform/configuration/common/configurationService.ts:160-187"
        publish: configuration-service.on-did-change-configuration
        input: {affected_keys: ["= input.key"], source: user}
        delivery: sync
      - return: {key: "= input.key", removed: "= vars.equals_default"}
  - component: configuration-service
    name: on-did-change-configuration
    kind: event
    summary: "onDidChangeConfiguration: affected keys and the target that changed."
    sources:
      - "src/vs/platform/configuration/common/configurationService.ts:37-38"
    request:
      type: object
      properties:
        affected_keys: {type: array, items: {type: string}, examples: [[files.autoSave]]}
        source: {type: string, enum: [default, user, workspace, policy], examples: [user]}
  - component: configuration-editing
    name: write
    kind: function
    summary: "ConfigurationEditing.write: read settings.json ({} when missing), refuse when it has parse errors, apply the JSON edit and write it back."
    sources:
      - "src/vs/platform/configuration/common/configurationService.ts:202-229"
    request: {type: object, required: [key], properties: {key: {type: string, examples: [files.autoSave]}, value: {}}}
    errors:
      - {code: unable-to-write-into-the-settings-file, status: 0, retryable: false}
    behavior:
      - choice: settings_file
        default: parses
        options:
          parses:
            - title: settings.json parses (a missing file counts as {})
              source: "src/vs/platform/configuration/common/configurationService.ts:207-220"
          has_parse_errors:
            - title: settings.json has parse errors, so nothing is written
              source: "src/vs/platform/configuration/common/configurationService.ts:221-223"
              fail: {code: unable-to-write-into-the-settings-file, status: 0, message: "Unable to write into the settings file. Please open the file to correct errors/warnings in the file and try again."}
      - if: "input.value == null"
        then:
          - title: setProperty with undefined removes the key
            source: "src/vs/platform/configuration/common/configurationService.ts:225-228"
            call: settings-store.user-delete
            input: {key: "= input.key"}
        else:
          - call: settings-store.user-write
            input: {key: "= input.key", value: "= input.value"}
      - return: {written: true}

  # ======== file-service ========
  - component: file-service
    name: write-file
    kind: function
    summary: "FileService.writeFile: provider lookup, readonly checks, dirty-write prevention (mtime/etag, with a same-content escape), then the provider write; returns the new stat."
    sources:
      - "src/vs/platform/files/common/fileService.ts:383-435"
      - "src/vs/platform/files/common/fileService.ts:457-540"
    request:
      type: object
      required: [resource, content]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        content: {type: string, examples: ["import { add } from './util';\nconsole.log(add(1, 2));\n"]}
        mtime: {type: integer, description: "IWriteFileOptions.mtime the caller last saw", examples: [1793318400000]}
        etag: {type: string, description: "IWriteFileOptions.etag the caller last saw ('' disables the check)", examples: ["1793318400000-54"]}
        unlock: {type: boolean, default: false}
        atomic: {type: boolean, default: false}
    response: PlatformFileStat
    errors:
      - {code: file-modified-since, status: 0, retryable: false}
      - {code: file-permission-denied, status: 0, retryable: false}
      - {code: no-file-system-provider-found, status: 0, retryable: false}
    behavior:
      - set: {vars.scheme: "= input.resource.split(':')[0]"}
      - if: "!(vars.scheme in state.providers)"
        then:
          - title: No provider for the scheme (ENOPRO)
            source: "src/vs/platform/files/common/fileService.ts:146-153"
            fail: {code: no-file-system-provider-found, status: 0, message: "= \"ENOPRO: No file system provider found for resource '\" + input.resource + \"'\""}
      - if: "state.providers[vars.scheme].readonly"
        then:
          - title: The file system is readonly
            source: "src/vs/platform/files/common/fileService.ts:1487-1493"
            fail: {code: file-permission-denied, status: 0, message: "= \"Unable to modify read-only file '\" + input.resource + \"'\""}
      - title: Stat the target; a missing file skips every check
        source: "src/vs/platform/files/common/fileService.ts:484-490"
        call: disk.stat
        input: {resource: "= input.resource"}
        as: stat
        on_error: continue
      - if: "vars.stat.ok"
        then:
          - if: "has(vars.stat.value.readonly) && vars.stat.value.readonly"
            then:
              - title: The file itself is readonly
                source: "src/vs/platform/files/common/fileService.ts:1495-1499"
                fail: {code: file-permission-denied, status: 0, message: "= \"Unable to modify read-only file '\" + input.resource + \"'\""}
          - if: "has(input.mtime) && has(input.etag) && input.etag != '' && input.mtime < vars.stat.value.mtime && input.etag != string(input.mtime) + '-' + string(vars.stat.value.size)"
            then:
              - if: "size(input.content) == vars.stat.value.size && input.content == vars.stat.value.content"
                then:
                  - title: Disk changed but holds exactly the bytes being written, so the write is allowed
                    source: "src/vs/platform/files/common/fileService.ts:526-534"
                else:
                  - title: Dirty-write prevention, the file on disk is newer than the caller's copy
                    source: "src/vs/platform/files/common/fileService.ts:519-537"
                    fail: {code: file-modified-since, status: 0, message: "File Modified Since"}
      - call: disk.write-file
        input: {resource: "= input.resource", content: "= input.content"}
        as: written
      - title: onDidRunOperation(WRITE) fires and the new stat is resolved with metadata
        source: "src/vs/platform/files/common/fileService.ts:425-434"
        return:
          resource: "= input.resource"
          mtime: "= vars.written.value.mtime"
          size: "= vars.written.value.size"
          etag: "= string(vars.written.value.mtime) + '-' + string(vars.written.value.size)"
          readonly: false
  - component: file-service
    name: read-file
    kind: function
    summary: "FileService.readFile: resolve the stat (file-not-found), refuse when the caller's etag still matches (not modified) or the size exceeds limits, then read the content."
    sources:
      - "src/vs/platform/files/common/fileService.ts:542-580"
      - "src/vs/platform/files/common/fileService.ts:740-764"
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        etag: {type: string, description: "IReadFileOptions.etag", examples: ["0-0"]}
        limits_size: {type: integer, description: "IReadFileOptions.limits.size in bytes", examples: [10485760]}
    response:
      type: object
      properties:
        resource: {type: string}
        value: {type: string}
        mtime: {type: integer}
        size: {type: integer}
        etag: {type: string}
    errors:
      - {code: file-not-found, status: 0, retryable: false}
      - {code: file-not-modified-since, status: 0, retryable: false}
      - {code: file-too-large, status: 0, retryable: false}
      - {code: no-file-system-provider-found, status: 0, retryable: false}
    behavior:
      - set: {vars.scheme: "= input.resource.split(':')[0]"}
      - if: "!(vars.scheme in state.providers)"
        then:
          - title: No provider for the scheme (ENOPRO)
            source: "src/vs/platform/files/common/fileService.ts:146-153"
            fail: {code: no-file-system-provider-found, status: 0, message: "= \"ENOPRO: No file system provider found for resource '\" + input.resource + \"'\""}
      - title: resolve() maps the provider's FileNotFound to FILE_NOT_FOUND
        source: "src/vs/platform/files/common/fileService.ts:194-200"
        call: disk.stat
        input: {resource: "= input.resource"}
        as: stat
      - set: {vars.etag: "= string(vars.stat.value.mtime) + '-' + string(vars.stat.value.size)"}
      - if: "has(input.etag) && input.etag != '' && input.etag == vars.etag"
        then:
          - title: The caller's copy is current (etag matches)
            source: "src/vs/platform/files/common/fileService.ts:748-751"
            fail: {code: file-not-modified-since, status: 0, message: "File not modified since"}
      - if: "has(input.limits_size) && vars.stat.value.size > input.limits_size"
        then:
          - title: Too large to open
            source: "src/vs/platform/files/common/fileService.ts:758-762"
            fail: {code: file-too-large, status: 0, message: "= \"Unable to read file '\" + input.resource + \"' that is too large to open\""}
      - call: disk.read-file
        input: {resource: "= input.resource"}
        as: content
      - return: {resource: "= input.resource", value: "= vars.content.value.content", mtime: "= vars.stat.value.mtime", size: "= vars.stat.value.size", etag: "= vars.etag"}
  - component: file-service
    name: del
    kind: function
    summary: "FileService.del: refuse readonly providers and trash without provider support, refuse missing or readonly files, then delete through the provider."
    sources:
