      - title: Delete through the provider, then onDidRunOperation(DELETE)
        source: "src/vs/platform/files/common/fileService.ts:1105-1114"
        call: disk.delete
        input: {resource: "= input.resource"}
      - return: {deleted: "= input.resource"}

