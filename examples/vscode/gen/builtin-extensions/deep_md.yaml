components:
  - id: markdown-extension
    name: markdown-language-features main (activate, activateShared)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "vscode.markdown-language-features' Node entry: builds the markdown-it engine, starts the Markdown language server client, then registers the commands, the preview manager and the Markdown editor."
    sources: ["extensions/markdown-language-features/src/extension.ts:15-27", "extensions/markdown-language-features/src/extension.shared.ts:28-82", "extensions/markdown-language-features/package.json:28-37"]
    attributes: {owner: builtin-extensions, extension: vscode.markdown-language-features}
    state:
      schema: {type: object, properties: {activated: {type: boolean}, client_started: {type: boolean}}}
      initial: {activated: false, client_started: false}
  - id: md-language-client
    name: MdLanguageClient (startClient)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Starts the vscode-markdown-languageserver over IPC and answers its parse and file system requests from the extension host."
    sources: ["extensions/markdown-language-features/src/client/client.ts:68-184"]
    attributes: {owner: builtin-extensions}
  - id: markdown-command-manager
    name: CommandManager (markdown-language-features)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Registers each Markdown command id once with vscode.commands.registerCommand."
    sources: ["extensions/markdown-language-features/src/commandManager.ts:14-38", "extensions/markdown-language-features/src/commands/index.ts:25-53"]
    attributes: {owner: builtin-extensions}
  - id: markdown-preview-manager
    name: MarkdownPreviewManager
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Keeps the dynamic (follow the editor, or locked) and static Markdown previews, reuses a matching one or creates a webview panel, and refreshes them."
    sources: ["extensions/markdown-language-features/src/preview/previewManager.ts:76-131"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {previews: {type: array, items: {type: object}}, active_preview: {type: string}}}
      initial: {previews: [], active_preview: ""}
  - id: markdown-it-engine
    name: MarkdownItEngine
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "The markdown-it instance with the contributed plugins, loaded lazily, and a token cache keyed by document and version."
    sources: ["extensions/markdown-language-features/src/markdownEngine.ts:100-130"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {md_loaded: {type: boolean}, token_cache: {type: object}}}
      initial: {md_loaded: false, token_cache: {}}
  - id: markdown-editor-provider
    name: MarkdownEditorProvider
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "The 'vscode.markdown.editor' custom text editor; the generated markdown.editor.* commands forward to the active Markdown editor webview and are ignored when none is active."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:254-256", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:762-769", "extensions/markdown-language-features/src/extension.shared.ts:84-106"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {active_webview: {type: boolean}, forwarded: {type: array, items: {type: string}}}}
      initial: {active_webview: false, forwarded: []}

interfaces:
  - component: markdown-extension
    name: activate
    kind: function
    summary: "activate: contributions, logger and MarkdownItEngine; await the language server client; then activateShared registers commands, the preview manager and the Markdown editor provider."
    sources: ["extensions/markdown-language-features/src/extension.ts:15-27", "extensions/markdown-language-features/package.json:28-37"]
    request: {type: object, properties: {extension_id: {type: string, default: vscode.markdown-language-features}, activation_event: {type: string, default: "onLanguage:markdown"}}}
    behavior:
      - set: {state.activated: true}
      - title: Start the Markdown language server
        source: "extensions/markdown-language-features/src/extension.ts:24"
        call: md-language-client.start
      - set: {state.client_started: true}
      - title: activateShared registers the Markdown commands
        source: "extensions/markdown-language-features/src/extension.shared.ts:47-48"
        call: vscode-api.commands-register-command
        input: {command_id: markdown.showPreview}
      - title: Register the Markdown editor as a custom editor
        source: "extensions/markdown-language-features/src/extension.shared.ts:71-77"
        call: vscode-api.window-register-custom-editor-provider
        input: {view_type: vscode.markdown.editor}
      - return: {activated: true}
  - component: md-language-client
    name: start
    kind: function
    summary: "startClient: create the LanguageClient for markdown documents (file watcher on Markdown files, pull diagnostics), register the parse/fs request handlers, then await client.start()."
    sources: ["extensions/markdown-language-features/src/client/client.ts:68-96", "extensions/markdown-language-features/src/client/client.ts:181-183", "extensions/markdown-language-features/src/extension.ts:29-56"]
    behavior:
      - title: Watch Markdown files for the server
        source: "extensions/markdown-language-features/src/client/client.ts:76"
        call: vscode-api.workspace-create-file-system-watcher
        input: {glob_pattern: "**/*.{md,mkd,mdwn,mdown,markdown,markdn,mdtxt,mdtext,workbook}"}
      - title: Spawn the server worker over IPC and await client.start()
        source: "extensions/markdown-language-features/src/client/client.ts:181"
        call: language-server.start
        input: {server: markdown, kind: ipc}
  - component: markdown-command-manager
    name: cmd-markdown-showpreview
    kind: command
    summary: "markdown.showPreview: open a dynamic preview of the given URIs (or the active editor's document) in the same column; with neither, toggles back with markdown.showSource."
    sources: ["extensions/markdown-language-features/package.json:174", "extensions/markdown-language-features/src/commands/showPreview.ts:53-75", "extensions/markdown-language-features/src/commands/showPreview.ts:17-51"]
    request: BuiltinCommandRequest
    behavior:
      - if: "size(input.args) == 0"
        then:
          - title: No resource and no active editor, toggle back to the source
            source: "extensions/markdown-language-features/src/commands/showPreview.ts:31-35"
            call: vscode-api.commands-execute-command
            input: {command_id: markdown.showSource, args: []}
          - return: {opened: false}
      - call: markdown-preview-manager.open-dynamic-preview
        input: {resource: "= string(input.args[0])", side_by_side: false, locked: false}
      - return: {opened: true}
  - component: markdown-command-manager
    name: cmd-markdown-showpreviewtoside
    kind: command
    summary: "markdown.showPreviewToSide: a dynamic preview beside the editor."
    sources: ["extensions/markdown-language-features/package.json:183", "extensions/markdown-language-features/src/commands/showPreview.ts:77-97"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-preview-manager.open-dynamic-preview
        input: {resource: "= size(input.args) > 0 ? string(input.args[0]) : 'file:///work/app/README.md'", side_by_side: true, locked: false}
  - component: markdown-command-manager
    name: cmd-markdown-showlockedpreviewtoside
    kind: command
    summary: "markdown.showLockedPreviewToSide: a preview beside the editor locked to this document."
    sources: ["extensions/markdown-language-features/package.json:189", "extensions/markdown-language-features/src/commands/showPreview.ts:100-120"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-preview-manager.open-dynamic-preview
        input: {resource: "= size(input.args) > 0 ? string(input.args[0]) : 'file:///work/app/README.md'", side_by_side: true, locked: true}
  - component: markdown-command-manager
    name: cmd-markdown-showsource
    kind: command
    summary: "markdown.showSource: open the active preview's document in the preview's resource column; nothing when no preview is active."
    sources: ["extensions/markdown-language-features/package.json:195", "extensions/markdown-language-features/src/commands/showSource.ts:10-30"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-preview-manager.get-active-preview
        as: active
      - if: "vars.active.value.resource == ''"
        then:
          - return: null
      - title: Open and show the previewed document
        source: "extensions/markdown-language-features/src/commands/showSource.ts:23-26"
        call: vscode-api.window-show-text-document
        input: {uri: "= vars.active.value.resource"}
      - return: {resource: "= vars.active.value.resource"}
  - component: markdown-command-manager
    name: cmd-markdown-preview-refresh
    kind: command
    summary: "markdown.preview.refresh: clear the engine's token cache and refresh every preview."
    sources: ["extensions/markdown-language-features/package.json:206", "extensions/markdown-language-features/src/commands/refreshPreview.ts:10-28"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-it-engine.clean-cache
      - call: markdown-preview-manager.refresh
  - component: markdown-command-manager
    name: cmd-markdown-preview-togglelock
    kind: command
    summary: "markdown.preview.toggleLock: lock or unlock the active dynamic preview and close previews it now duplicates."
    sources: ["extensions/markdown-language-features/package.json:211", "extensions/markdown-language-features/src/commands/toggleLock.ts:9-23"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-preview-manager.toggle-lock
  - component: markdown-command-manager
    name: cmd-markdown-api-render
    kind: command
    summary: "markdown.api.render (API command, activation event only): render a document or string to HTML with the extension's engine."
    sources: ["extensions/markdown-language-features/src/commands/renderDocument.ts:10-24", "extensions/markdown-language-features/package.json:34"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-it-engine.render
        input: {uri: "= size(input.args) > 0 ? string(input.args[0]) : ''", version_id: 1}
        as: out
      - return: "= vars.out.value.html"
  - component: markdown-command-manager
    name: cmd-markdown-api-reloadplugins
    kind: command
    summary: "markdown.api.reloadPlugins (API command, activation event only): drop the markdown-it instance and its cache, then refresh the previews."
    sources: ["extensions/markdown-language-features/src/commands/reloadPlugins.ts:10-29", "extensions/markdown-language-features/package.json:35"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-it-engine.reload-plugins
      - call: markdown-it-engine.clean-cache
      - call: markdown-preview-manager.refresh
  - component: markdown-preview-manager
    name: open-dynamic-preview
    kind: function
    summary: "openDynamicPreview: reuse a preview that matches (same column; an unlocked one for an unlocked request, or the locked preview of the same document) by revealing it, else create a new webview panel; then update it with the resource."
    sources: ["extensions/markdown-language-features/src/preview/previewManager.ts:142-158", "extensions/markdown-language-features/src/preview/previewManager.ts:45-53", "extensions/markdown-language-features/src/preview/preview.ts:890-904"]
    request: {type: object, properties: {resource: {type: string, examples: ["file:///work/app/README.md"]}, side_by_side: {type: boolean, default: false}, locked: {type: boolean, default: false}}}
    behavior:
      - set: {vars.col: "= input.side_by_side ? 'beside' : 'one'"}
      - set: {vars.match: "= state.previews.filter(p, p.column == vars.col && (p.locked ? (input.locked && p.resource == input.resource) : !input.locked))"}
      - if: "size(vars.match) > 0"
        then:
          - title: Reveal the matching preview and point it at the resource
            source: "extensions/markdown-language-features/src/preview/previewManager.ts:147-149"
            set: {state.previews: "= state.previews.map(p, p == vars.match[0] ? {'resource': input.resource, 'locked': p.locked, 'column': p.column} : p)"}
        else:
          - title: Create a new dynamic preview in a webview panel
            source: "extensions/markdown-language-features/src/preview/previewManager.ts:330-352"
            call: vscode-api.window-create-webview-panel
            input: {view_type: markdown.preview, title: "= 'Preview ' + input.resource", column: "= vars.col"}
          - set: {state.previews: "= state.previews + [{'resource': input.resource, 'locked': input.locked, 'column': vars.col}]"}
      - set: {state.active_preview: "= input.resource"}
      - title: preview.update renders the document
        source: "extensions/markdown-language-features/src/preview/previewManager.ts:154-157"
        call: markdown-it-engine.render
        input: {uri: "= input.resource", version_id: 1}
  - component: markdown-preview-manager
    name: refresh
    kind: function
    summary: "refresh: re-render every dynamic and static preview."
    sources: ["extensions/markdown-language-features/src/preview/previewManager.ts:124-131"]
    behavior:
      - foreach: "= state.previews"
        as: p
        steps:
          - call: markdown-it-engine.render
            input: {uri: "= vars.p.resource", version_id: 1}
      - return: {refreshed: "= size(state.previews)"}
  - component: markdown-preview-manager
    name: toggle-lock
    kind: function
    summary: "toggleLock: flip the active dynamic preview's lock and dispose other previews it now matches."
    sources: ["extensions/markdown-language-features/src/preview/previewManager.ts:177-190"]
    behavior:
      - set: {vars.active: "= state.previews.filter(p, p.resource == state.active_preview)"}
      - if: "size(vars.active) == 0"
        then:
          - return: {toggled: false}
      - set: {vars.flipped: "= {'resource': vars.active[0].resource, 'locked': !vars.active[0].locked, 'column': vars.active[0].column}"}
      - title: Toggle the lock, close previews that now duplicate it
        source: "extensions/markdown-language-features/src/preview/previewManager.ts:180-188"
        set: {state.previews: "= [vars.flipped] + state.previews.filter(p, p != vars.active[0] && !(p.column == vars.flipped.column && (vars.flipped.locked ? (p.locked && p.resource == vars.flipped.resource) : !p.locked)))"}
      - return: {toggled: true, locked: "= vars.flipped.locked"}
  - component: markdown-preview-manager
    name: get-active-preview
    kind: function
    summary: "activePreviewResource and activePreviewResourceColumn."
    sources: ["extensions/markdown-language-features/src/preview/previewManager.ts:160-166"]
    response: {type: object, properties: {resource: {type: string}}}
    behavior:
      - return: {resource: "= state.active_preview"}
  - component: markdown-it-engine
    name: render
    kind: function
    summary: "render: load the markdown-it instance with plugins if needed, tokenize (a document's tokens come from the cache when its version is unchanged), and render HTML."
    sources: ["extensions/markdown-language-features/src/markdownEngine.ts:196-220", "extensions/markdown-language-features/src/markdownEngine.ts:169-183"]
    request: {type: object, properties: {uri: {type: string, examples: ["file:///work/app/README.md"]}, version_id: {type: integer, default: 1}}}
    response: {type: object, properties: {html: {type: string}, cached: {type: boolean}}}
    behavior:
      - if: "!state.md_loaded"
        then:
          - title: "#getEngine loads markdown-it with the contributed plugins"
            source: "extensions/markdown-language-features/src/markdownEngine.ts:133-163"
            set: {state.md_loaded: true}
      - if: "input.uri != '' && input.uri in state.token_cache && state.token_cache[input.uri] == input.version_id"
        then:
          - title: Tokens from the cache
            source: "extensions/markdown-language-features/src/markdownEngine.ts:174-177"
            return: {html: "<h1>app</h1>", cached: true}
      - when: "input.uri != ''"
        title: Tokenize and update the cache
        source: "extensions/markdown-language-features/src/markdownEngine.ts:180-182"
        set: {state.token_cache: "= merge(state.token_cache, {input.uri: input.version_id})"}
      - return: {html: "<h1>app</h1>", cached: false}
  - component: markdown-it-engine
    name: clean-cache
    kind: function
    summary: "cleanCache: clear the token cache."
    sources: ["extensions/markdown-language-features/src/markdownEngine.ts:228-230"]
    behavior:
      - set: {state.token_cache: {}}
  - component: markdown-it-engine
    name: reload-plugins
    kind: function
    summary: "reloadPlugins: drop the markdown-it instance so the next render reloads the plugins."
    sources: ["extensions/markdown-language-features/src/markdownEngine.ts:166-168"]
    behavior:
      - set: {state.md_loaded: false}
  - component: markdown-editor-provider
    name: execute-command
    kind: function
    summary: "executeCommand: forward a markdown.editor.* command to the active Markdown editor webview's renderer; ignored (trace log only) when no Markdown editor is active."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:762-769"]
    request: {type: object, properties: {command: {type: string, examples: [markdown.editor.undo]}}}
    behavior:
      - if: "!state.active_webview"
        then:
          - title: No Markdown editor is active, the command is ignored
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:763-766"
            return: {forwarded: false}
      - title: renderer.command posts the command to the webview
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:768"
        set: {state.forwarded: "= state.forwarded + [input.command]"}
      - return: {forwarded: true}
  - component: markdown-command-manager
    name: cmd-markdown-copyimage
    kind: command
    summary: "_markdown.copyImage: ask the preview that shows the resource to copy the image with the given id."
    sources: [PKG:_markdown.copyImage, "extensions/markdown-language-features/src/commands/copyImage.ts:10-25"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-preview-manager.get-active-preview
        as: p
      - return: {copied: "= vars.p.value.resource != ''"}
  - component: markdown-command-manager
    name: cmd-markdown-openimage
    kind: command
    summary: "_markdown.openImage: open the image source as a document link relative to the previewed resource."
    sources: [PKG:_markdown.openImage, "extensions/markdown-language-features/src/commands/openImage.ts:10-25"]
    request: BuiltinCommandRequest
    behavior:
      - title: previewManager.openDocumentLink opens the link next to the preview
        source: "extensions/markdown-language-features/src/preview/previewManager.ts:190-193"
        call: vscode-api.window-show-text-document
        input: {uri: "= size(input.args) > 0 ? string(input.args[0]) : 'file:///work/app/README.md'"}
  - component: markdown-command-manager
    name: cmd-markdown-openfrontmattersettings
    kind: command
    summary: "_markdown.openFrontMatterSettings: open the Settings editor filtered to markdown.preview.frontMatter."
    sources: [PKG:_markdown.openFrontMatterSettings, "extensions/markdown-language-features/src/commands/openFrontMatterSettings.ts:9-15"]
    request: BuiltinCommandRequest
    behavior:
      - call: vscode-api.commands-execute-command
        input: {command_id: workbench.action.openSettings, args: ["@id:markdown.preview.frontMatter"]}
  - component: markdown-command-manager
    name: cmd-markdown-showpreviewsecurityselector
    kind: command
    summary: "markdown.showPreviewSecuritySelector: a quick pick of the preview security levels (strict, allow insecure content, disable) for the active preview's resource."
    sources: [PKG:markdown.showPreviewSecuritySelector, "extensions/markdown-language-features/src/commands/showPreviewSecuritySelector.ts:12-36", "extensions/markdown-language-features/src/preview/security.ts:105-120"]
    request: BuiltinCommandRequest
    behavior:
      - call: markdown-preview-manager.get-active-preview
        as: p
      - title: Choose the security level
        source: "extensions/markdown-language-features/src/preview/security.ts:115"
        call: vscode-api.window-show-quick-pick
        input: {resource: "= vars.p.value.resource"}
  - component: markdown-command-manager
    name: cmd-markdown-reopenaspreview
    kind: command
    summary: "markdown.reopenAsPreview: reopen the active editor with the vscode.markdown.preview.editor custom editor."
    sources: [PKG:markdown.reopenAsPreview, "extensions/markdown-language-features/src/commands/reopenAsPreview.ts:9-15"]
    request: BuiltinCommandRequest
    behavior:
      - call: vscode-api.commands-execute-command
        input: {command_id: reopenActiveEditorWith, args: [vscode.markdown.preview.editor]}
  - component: markdown-command-manager
    name: cmd-markdown-reopenassource
    kind: command
    summary: "markdown.reopenAsSource: reopen the active editor with the default text editor."
    sources: [PKG:markdown.reopenAsSource, "extensions/markdown-language-features/src/commands/reopenAsPreview.ts:17-23"]
    request: BuiltinCommandRequest
    behavior:
      - call: vscode-api.commands-execute-command
        input: {command_id: reopenActiveEditorWith, args: [default]}
  - component: markdown-command-manager
    name: cmd-markdown-togglepreview
    kind: command
    summary: "markdown.togglePreview: from a text editor reopen as preview, from the preview editor reopen as source."
    sources: [PKG:markdown.togglePreview, "extensions/markdown-language-features/src/commands/reopenAsPreview.ts:25-37"]
    request: BuiltinCommandRequest
    behavior:
      - title: Is a text editor active?
        source: "extensions/markdown-language-features/src/commands/reopenAsPreview.ts:29"
        choice: active_editor
        default: text
        options:
          text:
            - call: vscode-api.commands-execute-command
              input: {command_id: reopenActiveEditorWith, args: [vscode.markdown.preview.editor]}
          preview:
            - call: vscode-api.commands-execute-command
              input: {command_id: reopenActiveEditorWith, args: [default]}
  - component: markdown-command-manager
    name: cmd-markdown-editor-insertlinkfromworkspace
    kind: command
    summary: "markdown.editor.insertLinkFromWorkspace: pick workspace files (open dialog) and insert Markdown links to them in the active editor."
    sources: [PKG:markdown.editor.insertLinkFromWorkspace, "extensions/markdown-language-features/src/commands/insertResource.ts:16-38"]
    request: BuiltinCommandRequest
    behavior: INSERT_LINK
  - component: markdown-command-manager
    name: cmd-markdown-editor-insertimagefromworkspace
    kind: command
    summary: "markdown.editor.insertImageFromWorkspace: pick image files (open dialog) and insert Markdown image links in the active editor."
    sources: [PKG:markdown.editor.insertImageFromWorkspace, "extensions/markdown-language-features/src/commands/insertResource.ts:41-66"]
    request: BuiltinCommandRequest
    behavior: INSERT_LINK
  - component: markdown-command-manager
    name: cmd-markdown-findallfilereferences
    kind: command
    summary: "markdown.findAllFileReferences: ask the Markdown language server for references to the file and show them in the references view."
    sources: [PKG:markdown.findAllFileReferences, "extensions/markdown-language-features/src/languageFeatures/fileReferences.ts:12-50"]
    request: BuiltinCommandRequest
    behavior:
      - if: "size(input.args) == 0"
        then:
          - title: No resource provided
            source: "extensions/markdown-language-features/src/languageFeatures/fileReferences.ts:26-29"
            call: vscode-api.window-show-error-message
            input: {message: Find file references failed. No resource provided.}
          - return: {found: false}
      - title: getReferencesToFileInWorkspace asks the language server
        source: "extensions/markdown-language-features/src/languageFeatures/fileReferences.ts:35"
        call: language-server.request
        input: {server: markdown, command: findFileReferences, args: {}}
      - title: Show them with editor.action.showReferences
        source: "extensions/markdown-language-features/src/languageFeatures/fileReferences.ts:44"
        call: vscode-api.commands-execute-command
        input: {command_id: editor.action.showReferences, args: []}
      - return: {found: true}
