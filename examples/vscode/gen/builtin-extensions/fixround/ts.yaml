- id: tsconfig-link-provider
  name: tsconfig links (TsconfigLinkProvider, _typescript.openExtendsLink)
  kind: module
  layer: extensions
  parent: builtin-extensions
  summary: Document links in tsconfig/jsconfig files; following an 'extends' or reference link resolves it as a path or node module and opens it.
  sources:
  - extensions/typescript-language-features/src/languageFeatures/tsconfig.ts:121-220
  - extensions/typescript-language-features/src/extension.ts:57-59
  attributes:
    owner: builtin-extensions
interfaces:
- component: typescript-service-client
  name: execute
  kind: function
  summary: 'execute/executeImpl: with no running server the answer is ServerResponse.NoServer; otherwise the running server enqueues and sends
    the request; the result is the server''s response, Cancelled when the token was cancelled first, or still pending while it waits in the queue.'
  sources:
  - extensions/typescript-language-features/src/typescriptServiceClient.ts:875-929
  - extensions/typescript-language-features/src/typescriptServiceClient.ts:947-956
  request:
    type: object
    required:
    - command
    properties:
      command:
        type: string
        examples:
        - quickinfo
      args:
        type: object
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
      config:
        type: object
        properties:
          low_priority:
            type: boolean
            default: false
  response:
    type: object
    properties:
      type:
        type: string
        enum:
        - response
        - noServer
        - cancelled
        - noContent
        - pending
      success:
        type: boolean
      body: {}
      seq:
        type: integer
  errors:
  - code: typescript-server-error
    status: 0
    retryable: false
  behavior:
  - if: state.server_state != 'running'
    then:
    - title: No server, ServerResponse.NoServer
      source: extensions/typescript-language-features/src/typescriptServiceClient.ts:954-955
      return:
        type: noServer
        success: false
  - title: The running server's executeImpl enqueues and sends the request
    source: extensions/typescript-language-features/src/typescriptServiceClient.ts:950-953
    call: single-ts-server.execute-impl
    input:
      command: = input.command
      args: '= has(input.args) ? input.args : {}'
      expects_result: true
      is_async: false
      low_priority: '= has(input.config) && has(input.config.low_priority) ? input.config.low_priority : false'
      canceled: '= has(input.token) && has(input.token.canceled) ? input.token.canceled : false'
    as: res
  - when: vars.res.value.written
    set:
      state.sent: = state.sent + [input.command]
  - if: vars.res.value.type == 'error'
    then:
    - title: The response promise rejects with a TypeScriptServerError
      source: extensions/typescript-language-features/src/tsServer/server.ts:221-225
      fail:
        code: typescript-server-error
        message: = vars.res.value.message
  - return:
      type: = vars.res.value.type
      success: = vars.res.value.type == 'response'
      body: '= has(vars.res.value.body) ? vars.res.value.body : null'
      seq: = vars.res.value.seq
- component: typescript-service-client
  name: execute-without-waiting-for-response
  kind: function
  summary: 'executeWithoutWaitingForResponse: fire a request with expectsResult false through the server''s queue; dropped when no server runs.'
  sources:
  - extensions/typescript-language-features/src/typescriptServiceClient.ts:931-937
  request:
    type: object
    properties:
      command:
        type: string
        examples:
        - reloadProjects
  behavior:
  - if: state.server_state != 'running'
    then:
    - title: No running server, the request is dropped
      source: extensions/typescript-language-features/src/typescriptServiceClient.ts:954-955
      return:
        sent: false
  - call: single-ts-server.execute-impl
    input:
      command: = input.command
      args: {}
      expects_result: false
      is_async: false
      low_priority: false
      canceled: false
    as: res
  - when: vars.res.value.written
    set:
      state.sent: = state.sent + [input.command]
  - return:
      sent: = vars.res.value.written
- component: typescript-service-client
  name: on-event
  kind: event
  summary: 'The server handle''s onEvent, wrapped by createGenerationGuardedHandler: an event is dispatched only while its generation token is
    current and the server that sent it is the running one; stale events are dropped.'
  sources:
  - extensions/typescript-language-features/src/utils/generation.ts:6-17
  - extensions/typescript-language-features/src/typescriptServiceClient.ts:527-532
  - extensions/typescript-language-features/src/typescriptServiceClient.ts:988-1010
  request:
    type: object
    properties:
      token:
        type: integer
        default: 1
      event:
        type: string
        default: semanticDiag
  response:
    type: object
    properties:
      dispatched:
        type: boolean
  behavior:
  - if: input.token != state.token || state.server_state != 'running'
    then:
    - title: Generation mismatch or server no longer active, the handler is not called
      source: extensions/typescript-language-features/src/utils/generation.ts:13-15
      return:
        dispatched: false
  - title: dispatchEvent handles the event of the current generation
    source: extensions/typescript-language-features/src/typescriptServiceClient.ts:988-989
    set:
      state.dispatched_events: = state.dispatched_events + [input.event]
  - return:
      dispatched: true
- component: request-queue
  name: create-request
  kind: function
  summary: 'createRequest: build a request with the next sequence number.'
  sources:
  - extensions/typescript-language-features/src/tsServer/requestQueue.ts:89-96
  request:
    type: object
    properties:
      command:
        type: string
  response:
    type: object
    properties:
      seq:
        type: integer
      command:
        type: string
  behavior:
  - set:
      vars.seq: = state.sequence_number
      state.sequence_number: = state.sequence_number + 1
  - return:
      seq: = vars.seq
      command: = input.command
- component: request-queue
  name: enqueue
  kind: function
  summary: 'enqueue: a Normal request is inserted after the last request that is not LowPriority (so it jumps trailing low-priority ones); fences
    and low-priority requests are appended.'
  sources:
  - extensions/typescript-language-features/src/tsServer/requestQueue.ts:43-57
  request:
    type: object
    properties:
      seq:
        type: integer
      command:
        type: string
      queueing_type:
        type: string
        enum:
        - normal
        - lowPriority
        - fence
      expects_response:
        type: boolean
      is_async:
        type: boolean
  response:
    type: object
    properties:
      position:
        type: integer
      length:
        type: integer
  behavior:
  - set:
      vars.item:
        seq: = input.seq
        command: = input.command
        queueing_type: = input.queueing_type
        expects_response: = input.expects_response
        is_async: = input.is_async
      vars.at: = size(state.queue)
  - if: input.queueing_type == 'normal'
    then:
    - title: Walk back over trailing LowPriority requests
      source: extensions/typescript-language-features/src/tsServer/requestQueue.ts:45-52
      set:
        vars.at: 0
    - foreach: = state.queue
      as: queued
      index: i
      steps:
      - when: vars.queued.queueing_type != 'lowPriority'
        set:
          vars.at: = vars.i + 1
    else:
    - title: Only normal requests are reordered, others go to the end
      source: extensions/typescript-language-features/src/tsServer/requestQueue.ts:53-55
      set:
        vars.at: = size(state.queue)
  - set:
      state.queue: = state.queue.slice(0, vars.at) + [vars.item] + state.queue.slice(vars.at, size(state.queue))
  - return:
      position: = vars.at
      length: = size(state.queue)
- component: request-queue
  name: dequeue
  kind: function
  summary: 'dequeue: take the request at the head of the queue, if any.'
  sources:
  - extensions/typescript-language-features/src/tsServer/requestQueue.ts:59-61
  response:
    type: object
    properties:
      item:
        description: The head request, or null when the queue is empty.
  behavior:
  - if: size(state.queue) == 0
    then:
    - return:
        item: null
  - set:
      vars.head: = state.queue[0]
      state.queue: = state.queue.slice(1, size(state.queue))
  - return:
      item: = vars.head
- component: request-queue
  name: try-delete-pending-request
  kind: function
  summary: 'tryDeletePendingRequest: remove a still-queued request by sequence number; false when it is no longer queued.'
  sources:
  - extensions/typescript-language-features/src/tsServer/requestQueue.ts:79-87
  request:
    type: object
    properties:
      seq:
        type: integer
  response:
    type: object
    properties:
      deleted:
        type: boolean
  behavior:
  - if: '!state.queue.exists(q, q.seq == input.seq)'
    then:
    - return:
        deleted: false
  - set:
      state.queue: = state.queue.filter(q, q.seq != input.seq)
  - return:
      deleted: true
- component: request-queue
  name: get-queued-commands
  kind: function
  summary: 'getQueuedCommands: the commands of the first queued requests (at most 5), optionally skipping the last one.'
  sources:
  - extensions/typescript-language-features/src/tsServer/requestQueue.ts:63-77
  request:
    type: object
    properties:
      skip_last:
        type: boolean
        default: false
  response:
    type: object
    properties:
      commands:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.end: '= input.skip_last ? size(state.queue) - 1 : size(state.queue)'
  - if: vars.end <= 0
    then:
    - return:
        commands: []
  - title: Stop after five commands
    source: extensions/typescript-language-features/src/tsServer/requestQueue.ts:69-75
    return:
      commands: '= state.queue.slice(0, vars.end < 5 ? vars.end : 5).map(q, q.command)'
- component: single-ts-server
  name: execute-impl
  kind: function
  summary: 'executeImpl: create the request, classify it (open/change/close/updateOpen are fences, lowPriority requests are LowPriority), register
    its callback, enqueue it and send what the queue allows; a cancelled token removes it from the queue (or cancels it in flight) and resolves
    Cancelled.'
  sources:
  - extensions/typescript-language-features/src/tsServer/server.ts:228-306
  - extensions/typescript-language-features/src/tsServer/server.ts:367-377
  request:
    type: object
    properties:
      command:
        type: string
      args:
        type: object
      expects_result:
        type: boolean
      is_async:
        type: boolean
      low_priority:
        type: boolean
      canceled:
        type: boolean
  response:
    type: object
    properties:
      seq:
        type: integer
      written:
        type: boolean
      type:
        type: string
      body: {}
      message:
        type: string
  behavior:
  - call: request-queue.create-request
    input:
      command: = input.command
    as: req
  - set:
      vars.seq: = vars.req.value.seq
  - title: getQueueingType
    source: extensions/typescript-language-features/src/tsServer/server.ts:367-377
    set:
      vars.qt: '= input.command in [''change'', ''close'', ''open'', ''updateOpen''] ? ''fence'' : (input.low_priority ? ''lowPriority'' : ''normal'')'
  - when: input.expects_result
    title: Register the response callback under the sequence number
    source: extensions/typescript-language-features/src/tsServer/server.ts:255
    set:
      state.callbacks: = state.callbacks + [vars.seq]
  - call: request-queue.enqueue
    input:
      seq: = vars.seq
      command: = input.command
      queueing_type: = vars.qt
      expects_response: = input.expects_result
      is_async: = input.is_async
  - when: '''$traceId'' in input.args'
    title: Traced requests log the commands queued ahead of them
    source: extensions/typescript-language-features/src/tsServer/server.ts:287-297
    call: request-queue.get-queued-commands
    input:
      skip_last: true
  - title: sendNextRequests
    source: extensions/typescript-language-features/src/tsServer/server.ts:305
    call: single-ts-server.send-next-requests
  - if: input.canceled && input.expects_result
    then:
    - title: The token's cancellation tries to cancel the request
      source: extensions/typescript-language-features/src/tsServer/server.ts:260-267
      call: single-ts-server.try-cancel-request
      input:
        seq: = vars.seq
        command: = input.command
  - set:
      vars.written: = vars.seq in state.written
      vars.answer: = state.answered.filter(a, a.seq == vars.seq)
  - if: '!input.expects_result'
    then:
    - return:
        seq: = vars.seq
        written: = vars.written
        type: noResult
  - if: size(vars.answer) == 0
    then:
