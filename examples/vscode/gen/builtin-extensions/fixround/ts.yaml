      as: spec
      steps:
      - when: '!vars.combined_done'
        foreach: = input.diagnostics
        as: diag
        steps:
        - if: '!(vars.diag.code in vars.spec.codes)'
          then:
          - continue: true
        - title: getCodeFixes for the diagnostic
          source: extensions/typescript-language-features/src/languageFeatures/fixAll.ts:41-46
          call: typescript-service-client.execute
          input:
            command: getCodeFixes
            args:
              file: = input.uri
              errorCodes:
              - = vars.diag.code
            token:
              canceled: false
          as: fixes
        - set:
            vars.match: '= vars.fixes.value.type == ''response'' && vars.fixes.value.body != null ? vars.fixes.value.body.filter(f, f.fixName == vars.spec.fix)
              : []'
        - if: size(vars.match) == 0
          then:
          - continue: true
        - if: '!vars.spec.combined || !has(vars.match[0].fixId)'
          then:
          - title: Apply this fix's own edits
            source: extensions/typescript-language-features/src/languageFeatures/fixAll.ts:51-54
            set:
              vars.applied: = vars.applied + [vars.spec.fix]
              vars.combined_done: = vars.spec.combined
          - when: vars.spec.combined
            break: true
          - continue: true
        - title: getCombinedCodeFix for the whole file, once
          source: extensions/typescript-language-features/src/languageFeatures/fixAll.ts:98-112
          call: typescript-service-client.execute
          input:
            command: getCombinedCodeFix
            args:
              scope:
                type: file
                args:
                  file: = input.uri
              fixId: = vars.match[0].fixId
            token:
              canceled: false
          as: combined
        - when: vars.combined.value.type == 'response'
          set:
            vars.applied: = vars.applied + [vars.match[0].fixId]
        - set:
            vars.combined_done: true
        - break: true
    - set:
        vars.actions: '= vars.actions + [{''kind'': vars.action.kind, ''title'': vars.action.title, ''fixes'': vars.applied}]'
  - return:
      actions: = vars.actions
- component: typescript-quick-fix-provider
  name: provide-code-actions
  kind: function
  summary: 'provideCodeActions: keep the diagnostics whose code tsserver supports (getSupportedCodeFixes, asked once), ask getCodeFixes per diagnostic,
    and add a ''Fix all in file'' action for a fixId when the file has another diagnostic with the same code.'
  sources:
  - extensions/typescript-language-features/src/languageFeatures/quickFix.ts:201-211
  - extensions/typescript-language-features/src/languageFeatures/quickFix.ts:239-344
  - extensions/typescript-language-features/src/languageFeatures/quickFix.ts:437-470
  request:
    type: object
    properties:
      uri:
        type: string
        default: file:///work/app/src/main.ts
      diagnostics:
        type: array
        description: context.diagnostics in the requested range.
        items:
          type: object
      file_diagnostics:
        type: array
        description: Every diagnostic DiagnosticsManager holds for the file.
        items:
          type: object
  response:
    type:
    - object
    - 'null'
    properties:
      actions:
        type: array
        items:
          type: string
  behavior:
  - if: '!state.loaded'
    then:
    - title: The fixable codes are fetched lazily, once
      source: extensions/typescript-language-features/src/languageFeatures/quickFix.ts:207-211
      call: typescript-service-client.execute
      input:
        command: getSupportedCodeFixes
        args: {}
        token:
          canceled: false
      as: supported
    - set:
        state.loaded: true
        state.fixable_codes: '= vars.supported.value.type == ''response'' && vars.supported.value.body != null ? vars.supported.value.body : []'
  - set:
      vars.fixable: = input.diagnostics.filter(d, string(d.code) in state.fixable_codes)
      vars.actions: []
      vars.fix_all_ids: []
  - if: size(vars.fixable) == 0
    then:
    - title: No fixable diagnostics
      source: extensions/typescript-language-features/src/languageFeatures/quickFix.ts:274-277
      return: null
  - foreach: = vars.fixable
    as: diag
    steps:
    - title: getCodeFixes for the diagnostic
      source: extensions/typescript-language-features/src/languageFeatures/quickFix.ts:328-332
      call: typescript-service-client.execute
      input:
        command: getCodeFixes
        args:
          file: = input.uri
          errorCodes:
          - = vars.diag.code
        token:
          canceled: false
      as: res
    - if: vars.res.value.type != 'response' || vars.res.value.body == null
      then:
      - continue: true
    - foreach: = vars.res.value.body
      as: fix
      steps:
      - set:
          vars.actions: = vars.actions + [vars.fix.description]
      - if: has(vars.fix.fixId) && !(vars.fix.fixId in vars.fix_all_ids) && size(input.file_diagnostics.filter(x, x.code == vars.diag.code)) > 1
        then:
        - title: Multiple diagnostics of this code in the file, add the fix-all action
          source: extensions/typescript-language-features/src/languageFeatures/quickFix.ts:445-464
          set:
            vars.fix_all_ids: = vars.fix_all_ids + [vars.fix.fixId]
            vars.actions: '= vars.actions + [has(vars.fix.fixAllDescription) ? vars.fix.fixAllDescription : vars.fix.description + '' (Fix all in file)'']'
  - return:
      actions: = vars.actions
- component: tsconfig-link-provider
  name: open-extends-link
  kind: command
  summary: '_typescript.openExtendsLink: resolve the ''extends''/reference value relative to the tsconfig, as an absolute path or as a node module
    and open it; when the module cannot be resolved show an error whose text falls back to a fixed message if it could contain a link or command
    URI.'
  sources:
  - extensions/typescript-language-features/src/languageFeatures/tsconfig.ts:206-217
  - extensions/typescript-language-features/src/languageFeatures/tsconfig.ts:164-191
  - extensions/typescript-language-features/src/utils/notification.ts:7-9
  request:
    type: object
    properties:
      resource_uri:
        type: string
        default: file:///work/app/tsconfig.json
      extends_value:
        type: string
        default: ./tsconfig.base.json
      link_type:
        type: integer
        description: 0 extends, 1 references
        default: 0
  response:
    type: object
    properties:
      opened:
        type: string
  behavior:
  - set:
      vars.dir: = input.resource_uri.substring(0, input.resource_uri.lastIndexOf('/'))
      vars.value: = input.extends_value
  - if: vars.value.startsWith('./') || vars.value.startsWith('../') || vars.value.startsWith('/')
    then:
    - title: Relative or absolute path, add .json (or /tsconfig.json for references) unless it already ends in .json
      source: extensions/typescript-language-features/src/languageFeatures/tsconfig.ts:165-181
      set:
        vars.base: '= vars.value.startsWith(''/'') ? ''file://'' + vars.value : vars.dir + ''/'' + vars.value'
    - set:
        vars.target: '= vars.base.endsWith(''.json'') ? vars.base : vars.base + (input.link_type == 1 ? ''/tsconfig.json'' : ''.json'')'
    - title: Open the resolved configuration
      source: extensions/typescript-language-features/src/languageFeatures/tsconfig.ts:216
      call: vscode-api.commands-execute-command
      input:
        command: vscode.open
        rest:
        - = vars.target
        extension_id: vscode.typescript-language-features
      on_error: continue
    - return:
        opened: = vars.target
  - title: Otherwise resolve like a module through the node_modules folders up to the root
    source: extensions/typescript-language-features/src/languageFeatures/tsconfig.ts:121-157
    choice: node_module
    default: not_found
    options:
      found:
      - set:
          vars.target: '= vars.dir + ''/node_modules/'' + vars.value + (vars.value.endsWith(''.json'') ? '''' : ''/tsconfig.json'')'
      - call: vscode-api.commands-execute-command
        input:
          command: vscode.open
          rest:
          - = vars.target
          extension_id: vscode.typescript-language-features
        on_error: continue
      - return:
          opened: = vars.target
      not_found:
      - title: getSafeNotificationMessage, a message that could carry a link or command URI is replaced by the fixed fallback
        source: extensions/typescript-language-features/src/utils/notification.ts:7-9
        set:
          vars.message: '= (''Failed to resolve '' + vars.value + '' as module'').matches(''(?i)\\]\\(|command:'') ? ''Failed to resolve the referenced
            configuration as a module.'' : ''Failed to resolve '' + vars.value + '' as module'''
      - title: Show the error
        source: extensions/typescript-language-features/src/languageFeatures/tsconfig.ts:208-213
        call: vscode-api.window-show-error-message
        input:
          message: = vars.message
          extension_id: vscode.typescript-language-features
      - return:
          opened: ''
