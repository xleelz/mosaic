scenarios:
- id: builtin-extensions-typescript-request-cancelled
  fixtures:
  - one-window-folder
  state:
    typescript-service-client@eh1:
      server_state: running
      token: 1
    language-server:
      processes:
      - tsserver:semantic
    single-ts-server@eh1:
      pending_responses:
      - 7
      callbacks:
      - 7
    request-queue@eh1:
      sequence_number: 8
  steps:
  - interface: typescript-service-client.execute
    caller: exthost-runtime
    as: req
    input:
      command: quickinfo
      args: {}
      token:
        canceled: true
  - interface: request-queue.get-queued-commands
    caller: exthost-runtime
    as: queued
    input:
      skip_last: false
  expect:
  - steps.req.result.value.type == 'cancelled' && state['typescript-service-client@eh1'].sent == []
  - steps.queued.result.value.commands == [] && calls['language-server.request'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'request-queue.try-delete-pending-request')
- id: builtin-extensions-typescript-cancel-after-delivery
  fixtures:
  - one-window-folder
  steps:
  - flow: typescript-open-document
    as: open
  - interface: typescript-service-client.execute
    caller: exthost-runtime
    as: req
    input:
      command: quickinfo
      args: {}
      token:
        canceled: true
  expect:
  - steps.req.result.value.type == 'response' && state['typescript-service-client@eh1'].sent == ['quickinfo']
  - state['language-server'].requests == ['quickinfo']
- id: builtin-extensions-typescript-normal-jumps-low-priority
  fixtures:
  - one-window-folder
  state:
    typescript-service-client@eh1:
      server_state: running
      token: 1
    language-server:
      processes:
      - tsserver:semantic
    single-ts-server@eh1:
      pending_responses:
      - 7
      callbacks:
      - 7
      - 8
    request-queue@eh1:
      sequence_number: 9
      queue:
      - seq: 8
        command: references
        queueing_type: lowPriority
        expects_response: true
        is_async: false
  steps:
  - interface: typescript-service-client.execute
    caller: exthost-runtime
    as: req
    input:
      command: quickinfo
      args: {}
      token:
        canceled: false
  - interface: request-queue.get-queued-commands
    caller: exthost-runtime
    as: before
    input:
      skip_last: false
  - flow: typescript-server-response
    as: navtree
    input:
      request_seq: 7
      command: navtree
  - interface: request-queue.get-queued-commands
    caller: exthost-runtime
    as: queued
    input:
      skip_last: false
  expect:
  - steps.req.result.value.type == 'pending' && steps.before.result.value.commands == ['quickinfo', 'references']
  - steps.navtree.result.value.dispatched && state['language-server'].requests == ['quickinfo', 'references']
  - steps.queued.result.value.commands == []
  - state['single-ts-server@eh1'].answered.map(a, a.seq) == [7, 9, 8] && state['single-ts-server@eh1'].pending_responses == []
- id: builtin-extensions-typescript-fence-not-reordered
  fixtures:
  - one-window-folder
  steps:
  - interface: request-queue.enqueue
    caller: exthost-runtime
    input:
      seq: 1
      command: references
      queueing_type: lowPriority
      expects_response: true
      is_async: false
  - interface: request-queue.enqueue
    caller: exthost-runtime
    input:
      seq: 2
      command: change
      queueing_type: fence
      expects_response: false
      is_async: false
  - interface: request-queue.enqueue
    caller: exthost-runtime
    input:
      seq: 3
      command: quickinfo
      queueing_type: normal
      expects_response: true
      is_async: false
  - interface: request-queue.get-queued-commands
    caller: exthost-runtime
    as: queued
    input:
      skip_last: true
  - interface: request-queue.dequeue
    caller: exthost-runtime
    as: head
  expect:
  - steps.queued.result.value.commands == ['references', 'change']
  - steps.head.result.value.item.command == 'references' && size(state['request-queue@eh1'].queue) == 2
- id: builtin-extensions-typescript-response-for-unknown-seq
  flow: typescript-server-response
  fixtures:
  - one-window-folder
  input:
    request_seq: 42
    command: quickinfo
  expect:
  - result.ok && !result.value.dispatched && state['single-ts-server@eh1'].answered == []
- id: builtin-extensions-typescript-event-generation-guard
  fixtures:
  - one-window-folder
  steps:
  - flow: typescript-open-document
    as: open
  - flow: typescript-server-event
    as: current
    input:
      token: 1
      event: semanticDiag
  - flow: typescript-server-event
    as: stale
    input:
      token: 0
      event: syntaxDiag
  - flow: typescript-command-manager-commands
    as: req
    input:
      command_id: typescript.tsserverRequest
      args:
      - quickinfo
  expect:
  - steps.req.result.value.type == 'response'
  - steps.current.result.value.dispatched && !steps.stale.result.value.dispatched
  - state['typescript-service-client@eh1'].dispatched_events == ['semanticDiag']
- id: builtin-extensions-typescript-completions-filtered
  fixtures:
  - one-window-folder
  config:
    js-ts-suggest-paths: false
  state:
    single-ts-server@eh1:
      response_bodies:
        completionInfo:
          isIncomplete: false
          entries:
          - name: log
            kind: method
          - name: utils
            kind: directory
          - name: error
            kind: method
  steps:
  - flow: typescript-open-document
    as: open
  - flow: typescript-completions
    as: comp
  - flow: typescript-completion-resolve
    as: res
  expect:
  - steps.comp.result.value.items == ['log', 'error'] && !steps.comp.result.value.is_incomplete
  - '!steps.res.result.value.resolved && state[''typescript-service-client@eh1''].sent == [''completionInfo'', ''completionEntryDetails'']'
  - state['language-server'].requests == ['completionInfo', 'completionEntryDetails']
- id: builtin-extensions-typescript-completions-space-not-import
  fixtures:
  - one-window-folder
  steps:
  - flow: typescript-open-document
    as: open
  - flow: typescript-completions
    as: comp
    input:
      line_text: 'const '
      character: 6
      trigger_character: ' '
  expect:
  - steps.comp.result.ok && steps.comp.result.value == null
  - state['typescript-service-client@eh1'].sent == []
- id: builtin-extensions-typescript-completions-disabled
  fixtures:
  - one-window-folder
  config:
    js-ts-suggest-enabled: false
  steps:
  - flow: typescript-open-document
    as: open
  - flow: typescript-completions
    as: comp
  expect:
  - steps.comp.result.value == null && calls['typescript-service-client.execute'] == 0
  - state['typescript-service-client@eh1'].server_state == 'running' && state['typescript-service-client@eh1'].sent == []
- id: builtin-extensions-typescript-completions-no-server
  flow: typescript-completions
  fixtures:
  - one-window-folder
  expect:
  - result.ok && result.value == null && calls['language-server.request'] == 0
- id: builtin-extensions-typescript-resolve-function-call-snippet
  fixtures:
  - one-window-folder
  config:
    js-ts-suggest-complete-function-calls: true
  state:
    single-ts-server@eh1:
      response_bodies:
        completionEntryDetails:
        - name: log
          displayParts:
          - text: log
            kind: methodName
          - text: (
            kind: punctuation
          - text: message
            kind: parameterName
          - text: ':'
            kind: punctuation
          - text: options
            kind: parameterName
          - text: '?'
            kind: punctuation
          - text: )
            kind: punctuation
          tags:
          - name: example
            text: log('hi')
          - name: returns
            text: ''
  steps:
  - flow: typescript-open-document
    as: open
  - flow: typescript-completion-resolve
    as: res
    input:
      line_text: console.
      character: 8
  - interface: request-queue.get-queued-commands
    caller: exthost-runtime
    as: queued
    input:
      skip_last: false
  expect:
  - steps.queued.result.value.commands == []
  - steps.res.result.value.insert_text == 'log(${1:message}$2)$0'
  - steps.res.result.value.commands == ['_typescript.onCompletionAccepted', 'editor.action.triggerParameterHints']
  - "steps.res.result.value.documentation == ['*@example*  \\n```tsx\\nlog(\\'hi\\')\\n```']"
  - state['language-server'].requests == ['completionEntryDetails', 'quickinfo']
- id: builtin-extensions-typescript-resolve-already-called
  fixtures:
  - one-window-folder
  config:
    js-ts-suggest-complete-function-calls: true
  state:
