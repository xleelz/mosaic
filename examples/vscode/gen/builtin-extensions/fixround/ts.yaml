components:
- id: typescript-service-client
  name: TypeScriptServiceClient
  kind: module
  layer: extensions
  parent: builtin-extensions
  summary: Manages the tsserver lifecycle (start, restart, crash accounting with a 5-crash limit), sends requests through the running server's
    request queue and dispatches server events of the current generation; without a running server requests answer NoServer.
  sources:
  - extensions/typescript-language-features/src/typescriptServiceClient.ts:112-130
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        server_state:
          type: string
          enum:
          - none
          - running
          - errored
        number_restarts:
          type: integer
        last_start:
          type: integer
        fatally_crashed:
          type: boolean
        is_restarting:
          type: boolean
        token:
          type: integer
        prompting_after_crash:
          type: boolean
        sent:
          type: array
        dispatched_events:
          type: array
    initial:
      server_state: none
      number_restarts: 0
      last_start: 0
      fatally_crashed: false
      is_restarting: false
      token: 0
      prompting_after_crash: false
      sent: []
      dispatched_events: []
- id: request-queue
  name: RequestQueue
  kind: module
  layer: extensions
  parent: builtin-extensions
  summary: The tsserver request queue of a running server; normal requests jump in front of trailing low-priority ones, fences and low-priority
    requests go to the end; it also hands out request sequence numbers.
  sources:
  - extensions/typescript-language-features/src/tsServer/requestQueue.ts:35-97
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        queue:
          type: array
        sequence_number:
          type: integer
    initial:
      queue: []
      sequence_number: 0
- id: single-ts-server
  name: SingleTsServer
  kind: module
  layer: extensions
  parent: builtin-extensions
  summary: One tsserver process handle; enqueues requests, writes them while no synchronous response is pending, matches responses to callbacks
    by sequence number and cancels queued requests.
  sources:
  - extensions/typescript-language-features/src/tsServer/server.ts:90-93
  - extensions/typescript-language-features/src/tsServer/server.ts:228-377
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        pending_responses:
          type: array
        callbacks:
          type: array
        written:
          type: array
        answered:
          type: array
        response_bodies:
          type: object
          description: The response body tsserver writes on stdout for each command (the process's answer; seeded per scenario, default {}).
    initial:
      pending_responses: []
      callbacks: []
      written: []
      answered: []
      response_bodies: {}
- id: cached-response
  name: CachedResponse (navtree)
  kind: module
  layer: extensions
  parent: builtin-extensions
  summary: Caches one class of tsserver response keyed by document URI and version; the language provider shares one for navtree between code
    lenses, document symbols and refactors.
  sources:
  - extensions/typescript-language-features/src/tsServer/cachedResponse.ts:13-48
  - extensions/typescript-language-features/src/languageProvider.ts:67
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        document:
          type: string
        version:
          type: integer
        response:
          type: object
    initial:
      document: ''
      version: -1
      response: {}
- id: typescript-references-code-lens-provider
  name: TypeScriptReferencesCodeLensProvider
