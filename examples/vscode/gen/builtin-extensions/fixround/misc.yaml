        f.endsWith(''/pnpm-lock.yaml'') && vars.p.startsWith(f.substring(0, size(f) - size(''pnpm-lock.yaml'')))) ? [''pnpm''] : []) + (vars.p + ''/yarn.lock'' in state.files ? [''yarn''] : []) + (vars.p
        + ''/bun.lockb'' in state.files || vars.p + ''/bun.lock'' in state.files ? [''bun''] : [])'
  - title: The manager which-pm reports is added (without a lockfile) if not already detected
    source: extensions/npm/src/preferred-pm.ts:99-104
    if: vars.p in state.installed_by && !(state.installed_by[vars.p] in vars.detected)
    then:
    - return:
        name: = (vars.detected + [state.installed_by[vars.p]])[0]
        multiple_lock_files_detected: = size(vars.detected) > 1
  - title: The first detected manager wins (npm by default); more than one lockfile is flagged
    source: extensions/npm/src/preferred-pm.ts:106-112
    return:
      name: '= size(vars.detected) > 0 ? vars.detected[0] : ''npm'''
      multiple_lock_files_detected: = size(vars.detected) > 1
