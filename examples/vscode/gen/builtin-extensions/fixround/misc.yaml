  expect:
  - result.ok && result.value.templates == ['.github/PULL_REQUEST_TEMPLATE.md'] && result.value.picked == null
  - trace.exists(e, e.type == 'call.end' && e.interface == 'github-push-error-handler.pick-pull-request-template')
