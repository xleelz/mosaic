      folder:
        type: string
      show_warning:
        type: boolean
  behavior:
  - call: preferred-pm.find-preferred-pm
    input:
      pkg_path: = input.folder
    as: pm
  - title: Warn about multiple lockfiles unless the user said never
    source: extensions/npm/src/tasks.ts:154
    if: input.show_warning && vars.pm.value.multiple_lock_files_detected && !('npm.multiplePMWarning.neverShow' in state.global_state && state.global_state['npm.multiplePMWarning.neverShow'])
    then:
