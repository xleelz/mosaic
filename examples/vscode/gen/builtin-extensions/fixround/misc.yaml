      source: extensions/npm/src/tasks.ts:155-161
      call: npm-notification.get-safe-notification-message
      input:
        message: = 'Using ' + vars.pm.value.name + ' as the preferred package manager. Found multiple lockfiles for ' + input.folder + '.  To resolve this issue, delete the lockfiles that don\'t match your
          preferred package manager or change the setting "npm.packageManager" to a value other than "auto".'
        fallback: Found multiple package manager lockfiles. To resolve this issue, delete the lockfiles that don't match your preferred package manager or change the setting "npm.packageManager" to a value
          other than "auto".
      as: msg
    - call: vscode-api.window-show-information-message
      input:
        extension_id: vscode.npm
        message: = vars.msg.value.message
        items:
        - Learn more
