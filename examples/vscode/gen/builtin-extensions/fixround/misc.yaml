          vars.removed: = vars.removed + [vars.path]
  - return:
      removed: = vars.removed
- component: git-timeline-provider
  name: provide-workspace-timeline
  kind: function
  summary: provideWorkspaceTimeline. The cursor (per-root count of commits already returned) limits the page to the repositories that have more; each repository is asked for limit + 1 commits after its
    skip, the newest commits across repositories form the page (a commit shared by worktrees is listed once) and the next cursor records the new skips.
  sources:
  - extensions/git/src/timelineProvider.ts:302-355
  request:
    type: object
    properties:
      limit:
        type: integer
      cursor:
        type: object
  behavior:
  - call: git-model.get-repositories
    as: repos
  - title: With a cursor only repositories that still have commits are read
    source: extensions/git/src/timelineProvider.ts:303-306
    set:
      vars.cursor: '= has(input.cursor) && input.cursor != null && size(input.cursor) > 0 ? input.cursor : {}'
  - set:
      vars.roots: = vars.repos.value.map(r, replace(r, '^file://', '')).filter(r, size(vars.cursor) == 0 || r in vars.cursor)
      vars.limit: '= has(input.limit) ? input.limit : 50'
      vars.logs: []
  - title: Ask each repository for limit + 1 commits after its skip
    source: extensions/git/src/timelineProvider.ts:310-317
    foreach: = vars.roots
    as: root
    steps:
    - set:
        vars.skip: '= vars.root in vars.cursor ? vars.cursor[vars.root] : 0'
    - call: git-timeline-provider.log-repository
      input:
        root: = vars.root
        max_entries: = vars.limit + 1
        skip: = vars.skip
      as: log
    - set:
        vars.logs: '= vars.logs + [{''root'': vars.root, ''skip'': vars.skip, ''commits'': vars.log.value.commits}]'
  - call: git-timeline-provider.get-workspace-timeline-page
    input:
      logs: = vars.logs
      limit: = vars.limit
    as: page
  - set:
      vars.items: []
      vars.hashes: []
  - title: The same commit in several repositories (worktrees) is listed once
    source: extensions/git/src/timelineProvider.ts:332-349
    foreach: = vars.page.value.page
    as: entry
    steps:
    - if: vars.entry.commit.hash in vars.hashes
      then:
      - continue: true
    - set:
        vars.hashes: = vars.hashes + [vars.entry.commit.hash]
        vars.items: '= vars.items + [{''id'': vars.entry.commit.hash, ''label'': vars.entry.commit.message.split(''\n'')[0], ''timestamp'': vars.entry.commit.timestamp, ''root'': vars.entry.root, ''context_value'':
          ''git:workspace:commit''}]'
  - return:
      items: = vars.items
      cursor: = vars.page.value.next_skip
- component: git-timeline-provider
  name: log-repository
  kind: function
  summary: logRepository. git log with maxEntries and skip; a repository without commits has no history, other git errors propagate.
  sources:
  - extensions/git/src/timelineProvider.ts:357-369
  request:
    type: object
    properties:
      root:
        type: string
      max_entries:
        type: integer
      skip:
        type: integer
  behavior:
  - title: '"does not have any commits yet" -> an empty history'
    source: extensions/git/src/timelineProvider.ts:361-364
    if: input.root in state.no_commits
    then:
    - return:
        commits: []
  - title: A missing repository fails like git log does
    source: extensions/git/src/timelineProvider.ts:366
    if: '!(input.root in state.repository_logs)'
    then:
    - fail:
        code: git-error
        message: '= ''fatal: not a git repository: '' + input.root'
  - set:
      vars.all: = state.repository_logs[input.root]
  - set:
      vars.from: = math.least([input.skip, size(vars.all)])
  - return:
      commits: = vars.all.slice(vars.from, math.least([vars.from + input.max_entries, size(vars.all)]))
- component: git-timeline-provider
  name: get-workspace-timeline-page
  kind: function
  summary: getWorkspaceTimelinePage. Repeatedly takes the head commit with the newest timestamp across the logs (ties go to the earlier log) until the limit; only log heads are taken, so a log that is not
    ordered by timestamp is never skipped. Logs with commits left get their next skip.
  sources:
  - extensions/git/src/timelineProvider.ts:80-115
  request:
    type: object
    properties:
      logs:
        type: array
      limit:
        type: integer
  behavior:
  - set:
      vars.pos: '= input.logs.transformMapEntry(i, l, {l.root: 0})'
      vars.page: []
  - foreach: = lists.range(input.limit)
    as: n
    steps:
    - set:
        vars.cands: = input.logs.filter(l, vars.pos[l.root] < size(l.commits))
    - title: No log has commits left, the page ends early
      source: extensions/git/src/timelineProvider.ts:100-102
      if: size(vars.cands) == 0
      then:
      - break: true
    - title: Take the newest head commit (the first log wins a tie)
      source: extensions/git/src/timelineProvider.ts:92-104
      set:
        vars.next: = vars.cands.filter(l, vars.cands.all(o, o.commits[vars.pos[o.root]].timestamp <= l.commits[vars.pos[l.root]].timestamp))[0]
    - set:
        vars.page: '= vars.page + [{''root'': vars.next.root, ''commit'': vars.next.commits[vars.pos[vars.next.root]]}]'
        vars.pos: '= merge(vars.pos, {vars.next.root: vars.pos[vars.next.root] + 1})'
  - title: Logs with more commits than were taken get the skip of their next page
    source: extensions/git/src/timelineProvider.ts:107-114
    set:
      vars.next_skip: '= input.logs.filter(l, size(l.commits) > vars.pos[l.root]).transformMapEntry(i, l, {l.root: l.skip + vars.pos[l.root]})'
  - return:
      page: = vars.page
      next_skip: '= size(vars.next_skip) > 0 ? vars.next_skip : null'
- component: worktree-include
  name: sanitize-worktree-include-patterns
  kind: function
  summary: sanitizeWorktreeIncludePatterns. Drops git.worktreeIncludeFiles patterns that contain a line break, which would otherwise inject extra .gitignore lines (e.g. a ! negation).
  sources:
  - extensions/git/src/worktreeInclude.ts:6-13
  - extensions/git/src/repository.ts:2154-2164
  request:
    type: object
    properties:
      patterns:
        type: array
  behavior:
  - title: Patterns with \r or \n are ignored (and a warning logged)
    source: extensions/git/src/worktreeInclude.ts:11-13
    if: input.patterns.exists(p, matches(p, '[\\r\\n]'))
    then:
    - return:
        patterns: = input.patterns.filter(p, !matches(p, '[\\r\\n]'))
        ignored: = size(input.patterns.filter(p, matches(p, '[\\r\\n]')))
  - return:
      patterns: = input.patterns
      ignored: 0
- component: worktree-include
  name: resolve-worktree-include-paths
  kind: function
  summary: resolveWorktreeIncludePaths. From the git ls-files listings (ignored files, files matching the include patterns, wholly-ignored directories, files tracked in the new worktree) it keeps the ignored
    files that match a pattern, are not under an already-symlinked folder and would not collide with a tracked worktree path; a wholly ignored directory whose every ignored file matched is copied as one
    unit instead of file by file.
  sources:
  - extensions/git/src/worktreeInclude.ts:27-149
  request:
    type: object
    properties:
      ignored:
        type: array
        description: git ls-files --others --ignored --exclude-standard -z
        split on NUL: null
      included:
        type: array
        description: git ls-files --others --ignored --exclude-from=<patterns> -z
      directories:
        type: array
        description: same as ignored with --directory --no-empty-directory
      worktree_files:
        type: array
        description: git ls-files -z in the new worktree
      excluded_folders:
        type: array
  behavior:
  - title: No ignored files, nothing to copy
    source: extensions/git/src/worktreeInclude.ts:28-31
    if: size(input.ignored) == 0
    then:
    - return:
        paths: []
  - title: Wholly-ignored directories, symlinked folders and every ancestor directory of a tracked worktree path
    source: extensions/git/src/worktreeInclude.ts:41-56
    set:
      vars.whole: = input.directories.filter(e, e.endsWith('/'))
      vars.excluded: '= input.excluded_folders.map(f, f.endsWith(''/'') ? f : f + ''/'')'
      vars.wt_dirs: = input.worktree_files.map(f, lists.range(size(f)).filter(i, f.charAt(i) == '/').map(i, f.substring(0, i + 1))).flatten()
      vars.matched: []
      vars.blocked: []
  - foreach: = input.ignored
    as: file
    steps:
    - title: Included, not under a symlinked folder and no collision with a tracked worktree path -> copy it
      source: extensions/git/src/worktreeInclude.ts:60-62
      if: vars.file in input.included && !vars.excluded.exists(d, vars.file.startsWith(d)) && !(vars.file in input.worktree_files || (vars.file + '/') in vars.wt_dirs || input.worktree_files.exists(w, vars.file.startsWith(w
        + '/')))
      then:
      - set:
          vars.matched: = vars.matched + [vars.file]
      else:
      - title: Otherwise its wholly-ignored directory cannot be copied as a unit
        source: extensions/git/src/worktreeInclude.ts:63-68
        if: vars.whole.exists(d, vars.file.startsWith(d))
        then:
        - set:
            vars.blocked: = vars.blocked + vars.whole.filter(d, vars.file.startsWith(d))
  - if: size(vars.matched) == 0
    then:
    - return:
        paths: []
  - title: Collapse fully-matched wholly-ignored directories into one recursive entry
    source: extensions/git/src/worktreeInclude.ts:85-99
    set:
      vars.collapsed: = vars.whole.filter(d, !(d in vars.blocked))
  - return:
      paths: = vars.collapsed.map(d, d.substring(0, size(d) - 1)) + vars.matched.filter(f, !vars.collapsed.exists(d, f.startsWith(d)))
