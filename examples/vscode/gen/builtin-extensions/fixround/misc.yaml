- id: builtin-extensions-github-pull-request-template-found
  flow: github-pull-request-template
  fixtures:
  - one-window-folder
  choices:
    github-push-error-handler.pick-pull-request-template.pick: first_template
  state:
    github-push-error-handler@eh1:
      repository_files:
      - PULL_REQUEST_TEMPLATE.md
      - PULL_REQUEST_TEMPLATE/a.md
      - PULL_REQUEST_TEMPLATE/b.md
      - docs/PULL_REQUEST_TEMPLATE.md
      - docs/PULL_REQUEST_TEMPLATE/a.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/PULL_REQUEST_TEMPLATE/b.md
      - README.md
      - docs/guide.md
      - PULL_REQUEST_TEMPLATE/c.txt
  expect:
  - result.ok && size(result.value.templates) == 7 && !('README.md' in result.value.templates) && !('PULL_REQUEST_TEMPLATE/c.txt' in result.value.templates)
  - result.value.picked == 'PULL_REQUEST_TEMPLATE.md'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'vscode-api.window-show-quick-pick' && e.input.items.labels[0] == 'No template')
- id: builtin-extensions-github-pull-request-template-none-picked
  flow: github-pull-request-template
  fixtures:
  - one-window-folder
