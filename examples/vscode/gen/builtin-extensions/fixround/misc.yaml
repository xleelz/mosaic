- component: terminal-completion-provider
  name: provide-terminal-completions
  kind: function
  summary: provideTerminalCompletions. Refuses cancelled requests and unsupported shells, loads the PATH executables (none -> no completions), works out the token type and the current command, asks the
    specs for items and returns either the items or a TerminalCompletionList that also requests files/folders under the resolved cwd with a glob.
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:255-319
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:582-597
  request:
    type: object
    properties:
      command_line:
        type: string
        default: 'cd '
      cursor_index:
        type: integer
        default: 3
      shell:
        type: string
        default: bash
      env_path:
        type: string
        default: /usr/bin
      cwd:
        type: string
        default: /work/app
      cancelled:
        type: boolean
        default: false
  behavior:
  - title: A cancelled request returns nothing
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:257-260
    if: input.cancelled
    then:
    - return:
        provided: false
        reason: cancelled
  - title: Map the terminal's shell to a supported TerminalShellType
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:582-597
    set:
      vars.shell_type: '= input.shell in [''bash'', ''gitbash'', ''zsh'', ''pwsh'', ''fish''] ? input.shell : '''''
  - title: Unsupported shells get no completions
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:262-267
    if: vars.shell_type == ''
    then:
    - return:
        provided: false
        reason: unsupported-shell
  - title: Executables on the terminal's PATH (cached per directory)
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:269
    call: path-executable-cache.get-executables-in-path
    input:
      env_path: = input.env_path
      shell_type: = vars.shell_type
    as: path
  - title: No commands found in PATH, no completions
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:272-275
    if: '!vars.path.value.found'
    then:
    - return:
        provided: false
        reason: no-commands-in-path
  - call: terminal-completion-provider.get-current-command-and-args
    input:
      command_line: = input.command_line
      cursor_index: = input.cursor_index
      shell_type: = vars.shell_type
    as: current
  - call: terminal-completion-provider.get-token-type
    input:
      command_line: = input.command_line
      cursor_index: = input.cursor_index
      shell_type: = vars.shell_type
    as: token
  - title: Ask the fig specs for items (raced against a 5 s timeout)
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:277-298
    call: terminal-completion-provider.get-completion-items-from-specs
    input:
      command_line: = input.command_line
      cursor_index: = input.cursor_index
      available_commands: = vars.path.value.completion_resources
      current_command_string: = vars.current.value.current_command_string
      token_type: = vars.token.value.token_type
      cwd: = input.cwd
    as: specs
  - set:
      vars.r: = vars.specs.value
      vars.exts: '= vars.specs.value.file_extensions.map(e, e.startsWith(''.'') ? e.substring(1) : e)'
      vars.names: = vars.specs.value.file_names
  - title: createFileGlobPattern from the requested file extensions and names
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:623-641
    set:
      vars.glob: '= size(vars.exts) == 0 ? (size(vars.names) == 0 ? '''' : (size(vars.names) == 1 ? ''**/'' + vars.names[0] : ''**/{'' + vars.names.join('','') + ''}'')) : (size(vars.names) > 0 ? ''**/{''
        + (vars.names + vars.exts.map(e, ''*.'' + e)).join('','') + ''}'' : (size(vars.exts) == 1 ? ''**/*.'' + vars.exts[0] : ''**/*.{'' + vars.exts.join('','') + ''}''))'
  - title: Files or folders requested under a cwd -> a TerminalCompletionList with resource options
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:308-317
    if: vars.r.cwd != '' && (vars.r.show_files || vars.r.show_directories)
    then:
    - return:
        provided: true
        token_type: = vars.token.value.token_type
        current_command_string: = vars.current.value.current_command_string
        items: = vars.r.items
        show_files: = vars.r.show_files
        show_directories: = vars.r.show_directories
        glob_pattern: = vars.glob
        cwd: = vars.r.cwd
  - return:
      provided: true
      token_type: = vars.token.value.token_type
      current_command_string: = vars.current.value.current_command_string
      items: = vars.r.items
      show_files: = vars.r.show_files
      show_directories: = vars.r.show_directories
      glob_pattern: ''
      cwd: ''
- component: terminal-completion-provider
  name: get-token-type
  kind: function
  summary: getTokenType. The word under the cursor is a command when it is the first word or follows a shell reset operator (|, &&, ;, ... per shell; PowerShell also -and, -or ...), otherwise an argument.
  sources:
  - extensions/terminal-suggest/src/tokens.ts:14-50
  - extensions/terminal-suggest/src/constants.ts:12-19
  request:
    type: object
    properties:
      command_line:
        type: string
      cursor_index:
        type: integer
      shell_type:
        type: string
  behavior:
  - title: Reset characters of the shell (bash list by default)
    source: extensions/terminal-suggest/src/tokens.ts:14-25
    set:
      vars.rc: '= input.shell_type == ''zsh'' ? [''>'', ''>>'', ''<'', ''2>'', ''2>>'', ''&>'', ''&>>'', ''<>'', ''|'', ''|&'', ''&&'', ''||'', ''&'', '';'', ''('', ''{'', ''<<'', ''<<<'', ''<(''] : (input.shell_type
        == ''pwsh'' ? [''>'', ''>>'', ''<'', ''2>'', ''2>>'', ''*>'', ''*>>'', ''|'', '';'', '' -and '', '' -or '', '' -not '', ''!'', ''&'', '' -eq '', '' -ne ''] : [''>'', ''>>'', ''<'', ''2>'', ''2>>'',
        ''&>'', ''&>>'', ''|'', ''|&'', ''&&'', ''||'', ''&'', '';'', ''('', ''{'', ''<<''])'
      vars.before: = input.command_line.substring(0, input.cursor_index)
  - set:
      vars.space: = vars.before.lastIndexOf(' ')
      vars.before_word: = input.command_line.substring(0, vars.before.lastIndexOf(' ') + 1)
  - title: A reset operator right before the word starts a new command
    source: extensions/terminal-suggest/src/tokens.ts:32-38
    if: 'vars.rc.exists(c, vars.before_word.endsWith(input.shell_type == ''pwsh'' ? c : '' '' + c + '' ''))'
    then:
    - return:
        token_type: command
  - title: The first word of the line is the command
    source: extensions/terminal-suggest/src/tokens.ts:40-44
    if: vars.space == -1
    then:
    - return:
        token_type: command
  - title: Previous tokens ending in a reset operator also start a command; anything else is an argument
    source: extensions/terminal-suggest/src/tokens.ts:45-49
    if: vars.rc.exists(c, vars.before.substring(0, vars.space + 1).trim().endsWith(c))
    then:
    - return:
        token_type: command
  - return:
      token_type: argument
- component: terminal-completion-provider
  name: get-current-command-and-args
  kind: function
  summary: getCurrentCommandAndArgs. The text of the current command up to the cursor, after the last reset operator; empty for an empty line or when the cursor sits inside a word.
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:431-461
  request:
    type: object
    properties:
      command_line:
        type: string
      cursor_index:
        type: integer
      shell_type:
        type: string
  behavior:
  - title: Empty line, or non-whitespace right after the cursor -> no current command
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:433-441
    if: input.command_line.trim() == '' || (input.cursor_index < size(input.command_line) && matches(input.command_line.substring(input.cursor_index, input.cursor_index + 1), '\\S'))
    then:
    - return:
        current_command_string: ''
  - set:
      vars.before: = input.command_line.substring(0, input.cursor_index)
      vars.rc: '= input.shell_type == ''zsh'' ? [''>'', ''>>'', ''<'', ''2>'', ''2>>'', ''&>'', ''&>>'', ''<>'', ''|'', ''|&'', ''&&'', ''||'', ''&'', '';'', ''('', ''{'', ''<<'', ''<<<'', ''<(''] : (input.shell_type
        == ''pwsh'' ? [''>'', ''>>'', ''<'', ''2>'', ''2>>'', ''*>'', ''*>>'', ''|'', '';'', ''!'', ''&''] : [''>'', ''>>'', ''<'', ''2>'', ''2>>'', ''&>'', ''&>>'', ''|'', ''|&'', ''&&'', ''||'', ''&'',
        '';'', ''('', ''{'', ''<<''])'
  - title: Start after the last reset character before the cursor, leading whitespace removed
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:446-460
    return:
      current_command_string: = replace(vars.before.substring(math.greatest(vars.rc.map(c, vars.before.lastIndexOf(c))) + 1), '^\\s+', '')
- component: terminal-completion-provider
  name: get-completion-items-from-specs
  kind: function
  summary: getCompletionItemsFromSpecs. Spec items first; for a command token every PATH command not already suggested is added as a Method item and files and folders are requested; an argument with nothing
    to suggest falls back to files and folders. When resources are requested the cwd is re-resolved from a folder prefix.
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:469-567
  - extensions/terminal-suggest/src/types.ts:8-18
  request:
    type: object
    properties:
      command_line:
        type: string
      cursor_index:
        type: integer
      available_commands:
        type: array
      current_command_string:
        type: string
      token_type:
        type: string
      cwd:
        type: string
  behavior:
  - call: fig-interface.get-fig-suggestions
    input:
      command_line: = input.command_line
      cursor_index: = input.cursor_index
      available_commands: = input.available_commands
      current_command_string: = input.current_command_string
      token_type: = input.token_type
      cwd: = input.cwd
    as: fig
  - set:
      vars.items: = vars.fig.value.items
      vars.show_files: = vars.fig.value.show_files
      vars.show_dirs: = vars.fig.value.show_directories
  - title: 'Command token: add each PATH command (an ICompletionResource with label, documentation and kind) not already suggested as a Method item, and request files and folders'
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:526-555
    if: input.token_type == 'command'
    then:
    - set:
        vars.items: '= vars.items + input.available_commands.filter(c, !(c.label in vars.fig.value.items.map(i, i.label))).map(c, {''label'': c.label, ''kind'': ''method'', ''documentation'': c.documentation})'
        vars.show_files: true
        vars.show_dirs: true
    else:
    - title: An argument with no items, no resource request and no current arg falls back to files and folders
      source: extensions/terminal-suggest/src/terminalSuggestMain.ts:556-559
      if: size(vars.items) == 0 && !vars.show_files && !vars.show_dirs && !vars.fig.value.has_current_arg
      then:
      - set:
          vars.show_files: true
          vars.show_dirs: true
  - set:
      vars.cwd: ''
  - title: Re-resolve the cwd from a folder prefix when resources are requested
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:561-564
    if: input.cwd != '' && (vars.show_files || vars.show_dirs)
    then:
    - call: terminal-completion-provider.resolve-cwd-from-current-command-string
      input:
        current_command_string: = input.current_command_string
        cwd: = input.cwd
      as: rc
    - set:
        vars.cwd: = vars.rc.value.cwd
  - return:
      items: = vars.items
      show_files: = vars.show_files
      show_directories: = vars.show_dirs
      file_extensions: = vars.fig.value.file_extensions
      file_names: = vars.fig.value.file_names
      cwd: = vars.cwd
- component: terminal-completion-provider
  name: resolve-cwd-from-current-command-string
  kind: function
  summary: resolveCwdFromCurrentCommandString. The folder part of the last word (up to its last /) joined to the cwd, if that is a directory; paths with .. are left to the completion service (no cwd).
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:384-427
  request:
    type: object
    properties:
      current_command_string:
        type: string
      cwd:
        type: string
  behavior:
  - set:
      vars.words: = input.current_command_string.split(' ')
  - set:
      vars.prefix: = vars.words[size(vars.words) - 1].trim()
  - set:
      vars.relative: '= vars.prefix.lastIndexOf(''/'') == -1 ? '''' : vars.prefix.substring(0, vars.prefix.lastIndexOf(''/''))'
  - title: Paths with .. are not pre-resolved (avoids navigating up twice)
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:407-412
    if: vars.relative.contains('..')
    then:
    - return:
        cwd: ''
  - set:
      vars.resolved: '= vars.relative == '''' || vars.relative == ''.'' ? input.cwd : input.cwd + ''/'' + replace(vars.relative, ''^\\./'', '''')'
  - title: Only a resolved directory becomes the cwd
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:414-426
    if: vars.resolved in state.folders
    then:
    - return:
        cwd: = vars.resolved
  - return:
      cwd: ''
- component: terminal-completion-provider
  name: on-path-directory-change
  kind: event
  summary: A file watcher event in a PATH directory. handleChange restarts a 300 ms debounce timer whose expiry refreshes the PATH executable cache.
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:339-347
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:366-372
  request:
    type: object
    properties:
      directory:
        type: string
  behavior:
  - title: Restart the 300 ms debounce timer
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:340-346
    set:
      state.refresh_due: = now + 300
  - emit: terminal-completion-provider.flush-path-refresh
    after_ms: 300
    input:
      due: = now + 300
- component: terminal-completion-provider
  name: flush-path-refresh
  kind: event
  summary: The debounce timer of handleChange fires; only the latest timer refreshes the cache (earlier ones were cleared by clearTimeout).
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:339-347
  request:
    type: object
    properties:
      due:
        type: integer
  behavior:
  - title: A superseded timer was cleared and does nothing
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:340-342
    if: input.due != state.refresh_due
    then:
    - return:
        refreshed: false
  - title: pathExecutableCache.refresh() drops every cached directory
    source: extensions/terminal-suggest/src/terminalSuggestMain.ts:343-346
    call: path-executable-cache.refresh
    input: {}
  - return:
      refreshed: true
- component: path-executable-cache
  name: get-executables-in-path
  kind: function
  summary: getExecutablesInPath. Splits PATH (no PATH -> nothing), serves cached directories from the cache, scans the uncached ones and caches their results, and merges every directory's executables in
    PATH order.
  sources:
  - extensions/terminal-suggest/src/env/pathExecutableCache.ts:59-150
  request:
    type: object
    properties:
      env_path:
        type: string
      shell_type:
        type: string
  behavior:
  - title: No PATH value, no executables
    source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:81-98
    if: input.env_path == ''
    then:
    - return:
        found: false
  - set:
      vars.paths: '= input.env_path.split(state.platform == ''win32'' ? '';'' : '':'')'
      vars.labels: []
  - foreach: = vars.paths
    as: dir
    steps:
    - title: A cached directory contributes its labels without a scan
      source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:107-114
      if: vars.dir in state.cached_exes
      then:
      - set:
          vars.labels: = vars.labels + state.cached_exes[vars.dir].map(e, e.label).filter(l, !(l in vars.labels))
      else:
      - title: Not cached, scan the directory and cache what it holds
        source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:115-131
        call: path-executable-cache.get-executables-in-single-path
        input:
          dir: = vars.dir
          labels: = vars.labels
        as: scanned
      - set:
          state.cached_exes: '= merge(state.cached_exes, {vars.dir: vars.scanned.value.executables})'
          vars.labels: = vars.labels + vars.scanned.value.executables.map(e, e.label)
  - title: Merge the executables of each PATH directory once, in PATH order
    source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:133-149
    return:
      found: true
      completion_resources: = vars.paths.filter(d, d in state.cached_exes).map(d, state.cached_exes[d]).flatten()
      labels: = vars.labels
- component: path-executable-cache
  name: get-executables-in-single-path
  kind: function
  summary: _getExecutablesInSinglePath. Skips a missing directory, directories and unknown entries; a symlink counts when its target is executable (documented as path -> target); a label already found earlier
    on PATH is skipped; executables become Method completion resources.
  sources:
  - extensions/terminal-suggest/src/env/pathExecutableCache.ts:152-218
  request:
    type: object
    properties:
      dir:
        type: string
      labels:
        type: array
  behavior:
  - title: A PATH entry that is not an existing directory yields nothing
    source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:154-157
    if: '!(input.dir in state.path_dirs)'
    then:
    - return:
        executables: []
  - set:
      vars.found: []
      vars.seen: = input.labels
  - foreach: = state.path_dirs[input.dir]
    as: file
    steps:
    - title: Skip directories and unknown file types
      source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:168-171
      if: vars.file.type == 'directory' || vars.file.type == 'unknown'
      then:
      - continue: true
    - title: Skip a label an earlier PATH directory already provided
      source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:195-198
      if: vars.file.name in vars.seen
      then:
      - continue: true
    - call: path-executable-cache.is-executable
      input:
        path: '= vars.file.type == ''symlink'' ? vars.file.target : input.dir + ''/'' + vars.file.name'
        exec: = vars.file.exec
      as: isexec
    - if: '!vars.isexec.value.executable'
      then:
      - continue: true
    - title: Add it as a Method resource (a symlink is documented as path -> target)
      source: extensions/terminal-suggest/src/env/pathExecutableCache.ts:174-210
      set:
        vars.found: '= vars.found + [{''label'': vars.file.name, ''kind'': ''method'', ''documentation'': vars.file.type == ''symlink'' ? input.dir + ''/'' + vars.file.name + '' -> '' + vars.file.target
          : input.dir + ''/'' + vars.file.name}]'
        vars.seen: = vars.seen + [vars.file.name]
  - return:
      executables: = vars.found
- component: path-executable-cache
  name: is-executable
  kind: function
  summary: isExecutable. On Windows a file is executable when its name ends in one of the executable extensions (.exe, .bat, .cmd, ...); elsewhere when its owner execute bit is set.
  sources:
  - extensions/terminal-suggest/src/helpers/executable.ts:9-45
  request:
    type: object
    properties:
      path:
        type: string
      exec:
        type: boolean
        description: the owner execute bit (stats.mode & 0o100)
  behavior:
  - title: Windows checks the file extension against the executable extensions
    source: extensions/terminal-suggest/src/helpers/executable.ts:9-15
    if: state.platform == 'win32'
    then:
    - return:
        executable: = ['.exe', '.bat', '.cmd', '.com', '.msi', '.ps1', '.vbs', '.js', '.jar', '.py', '.rb', '.pl', '.sh'].exists(e, input.path.endsWith(e))
