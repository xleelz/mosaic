flows:
- id: terminal-completions
  name: Terminal completions from vscode.terminal-suggest
  tags:
  - writes
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:254-320
  entry:
    caller: user
    interface: terminal-completion-provider.provide-terminal-completions
    input:
      command_line: 'cd '
      cursor_index: 3
      shell: bash
      env_path: /usr/bin
      cwd: /work/app
- id: terminal-path-change
  name: A PATH directory changes and the executable cache is refreshed
  tags:
  - writes
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:339-372
  entry:
    caller: exthost-runtime
    interface: terminal-completion-provider.on-path-directory-change
    input:
      directory: /usr/bin
- id: git-repository-cache-update
  name: A repository's remotes are recorded in the repository cache
  tags:
  - writes
  - feature:git
  sources:
  - extensions/git/src/model.ts:699
  - extensions/git/src/repository.ts:2391
  entry:
    caller: git-model
    interface: repository-cache.update
    input:
      added_remotes:
      - name: origin
        fetch_url: https://github.com/owner/repo.git
      removed_remotes: []
      root_path: /work/app
- id: git-askpass-env
  name: The environment git processes get for askpass (GIT_ASKPASS ...)
  tags:
  - feature:git
  sources:
  - extensions/git/src/main.ts:82
  entry:
    caller: git-extension
    interface: askpass.get-env
- id: git-askpass-paths
  name: The git extension resolves its askpass script paths and creates its Askpass handler
  tags:
  - writes
  - feature:git
  sources:
  - extensions/git/src/askpassManager.ts:290-312
  entry:
    caller: git-extension
    interface: askpass.create
    input:
      ipc: true
      source_dir: C:/Program Files/VS Code/resources/app/extensions/git/dist
      storage_path: C:/Users/dev/AppData/Roaming/Code/User/workspaceStorage/abc/vscode.git
- id: git-workspace-timeline
  name: The workspace Timeline view pages through git history
  tags:
  - feature:git
  sources:
  - extensions/git/src/timelineProvider.ts:302-355
  entry:
    caller: user
    interface: git-timeline-provider.provide-workspace-timeline
    input:
      limit: 50
- id: git-worktree-include
  name: Choose the ignored files copied into a new worktree
  tags:
  - feature:git
  sources:
  - extensions/git/src/repository.ts:2154-2215
  entry:
    caller: git-repository
    interface: worktree-include.resolve-worktree-include-paths
    input:
      ignored: []
      included: []
      directories: []
      worktree_files: []
      excluded_folders: []
- id: git-worktree-include-patterns
  name: Sanitize git.worktreeIncludeFiles patterns
  tags:
  - feature:git
  sources:
  - extensions/git/src/repository.ts:2154-2164
  entry:
    caller: git-repository
    interface: worktree-include.sanitize-worktree-include-patterns
    input:
      patterns: []
- id: git-activate
  name: git extension activation
  tags:
  - writes
  - feature:git
  sources:
  - extensions/git/src/main.ts:258-264
  - extensions/git/package.json:51-56
  entry:
    caller: exthost-runtime
    interface: git-extension.activate
    input:
      extension_id: vscode.git
      activation_event: '*'
- id: git-command
  name: A git command through createCommand
  tags:
  - writes
  - feature:git
  sources:
  - extensions/git/src/commands.ts:5527-5552
  entry:
    caller: user
    interface: git-command-center.run-command
    input:
      command_id: git.refresh
      args: []
- id: npm-package-info
  name: package.json hover/completion asks npm for a package's details
  sources:
  - extensions/npm/src/features/packageJSONContribution.ts:277-290
  entry:
    caller: user
    interface: package-json-contribution.npm-view
    input:
      pack: left-pad
- id: php-configuration-change
  name: The configuration changes and PHP validation reloads it
  sources:
  - extensions/php-language-features/src/features/validationProvider.ts:109
  entry:
    caller: exthost-runtime
    interface: php-validation-provider.load-configuration
    input:
      documents: []
- id: php-validate
  name: A PHP document is validated with php -l
  tags:
  - writes
  sources:
  - extensions/php-language-features/src/features/validationProvider.ts:171-186
  entry:
    caller: user
    interface: php-validation-provider.trigger-validate
    input:
      uri: file:///work/app/index.php
      language_id: php
      workspace_trusted: true
      lint_output: []
- id: configuration-editing-gist-save
  name: Export a settings profile to a GitHub gist
  sources:
  - extensions/configuration-editing/src/importExportProfiles.ts:22-40
  entry:
    caller: exthost-runtime
    interface: github-gist-profile-content-handler.save-profile
    input:
      name: My Profile
      content: '{"settings":{}}'
- id: configuration-editing-gist-read
  name: Import a settings profile from a GitHub gist
  sources:
  - extensions/configuration-editing/src/importExportProfiles.ts:42-65
  entry:
    caller: exthost-runtime
    interface: github-gist-profile-content-handler.read-profile
    input:
      id_or_uri: gist-id
- id: git-base-commit-folding
  name: Folding ranges in a git commit message editor
  sources:
  - extensions/git-base/src/extension.ts:18
  entry:
    caller: user
    interface: git-commit-folding-provider.provide-folding-ranges
    input:
      lines: []
- id: github-push-error
  name: A failed git push is offered to the GitHub push error handler
  tags:
  - writes
  sources:
  - extensions/git/src/model.ts:1093-1095
  - extensions/github/src/pushErrorHandler.ts:110-169
  entry:
    caller: git-repository
    interface: github-push-error-handler.handle-push-error
    input:
      git_error_code: PushRejected
      push_url: https://github.com/owner/repo.git
      refspec: main
      stderr: ''
- id: github-output-document
  name: Read a github-output document
  sources:
  - extensions/github/src/pushErrorHandler.ts:84-99
  entry:
    caller: user
    interface: github-push-error-handler.provide-text-document-content
    input:
      path: /github-error-0
- id: github-pull-request-template
  name: Choose a pull request template when creating a PR
  sources:
  - extensions/github/src/pushErrorHandler.ts:264-270
  entry:
    caller: github-push-error-handler
    interface: github-push-error-handler.find-pull-request-templates
    input:
      root: /work/app
scenarios:
- id: builtin-extensions-terminal-completions-cd-folders
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: 'cd '
    cursor_index: 3
    shell: bash
    env_path: /usr/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.provided && result.value.token_type == 'argument'
  - result.value.items.map(i, i.label) == ['-'] && result.value.show_directories && !result.value.show_files
  - result.value.cwd == '/work/app'
  - state['path-executable-cache@eh1'].cached_exes['/usr/bin'].map(e, e.label) == ['ls', 'git', 'cd']
- id: builtin-extensions-terminal-completions-cd-child-folder
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: cd child/
    cursor_index: 9
    shell: bash
    env_path: /usr/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.cwd == '/work/app/child' && result.value.show_directories
  - '[''/usr/bin''].all(d, d in state[''path-executable-cache@eh1''].cached_exes)'
- id: builtin-extensions-terminal-completions-cd-parent-unresolved
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: cd ../sibling
    cursor_index: 13
    shell: bash
    env_path: /usr/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.cwd == '' && result.value.items.map(i, i.label) == ['-']
  - '[''/usr/bin''].all(d, d in state[''path-executable-cache@eh1''].cached_exes)'
- id: builtin-extensions-terminal-completions-command-token
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: c
    cursor_index: 1
    shell: zsh
    env_path: /usr/bin:/usr/local/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.token_type == 'command' && result.value.show_files && result.value.show_directories
  - result.value.items.exists(i, i.label == 'cd' && i.description == 'Change the shell working directory' && i.kind == 'method')
  - result.value.items.exists(i, i.label == 'code' && i.description == 'Visual Studio Code')
  - result.value.items.filter(i, i.label == 'git').size() == 1 && !result.value.items.exists(i, i.label == 'README' || i.label == 'share')
  - state['path-executable-cache@eh1'].cached_exes['/usr/local/bin'].map(e, e.label) == ['code', 'cargo']
  - state['path-executable-cache@eh1'].cached_exes['/usr/local/bin'][0].documentation == '/usr/local/bin/code -> /opt/vscode/bin/code'
- id: builtin-extensions-terminal-completions-pipe-command
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: ls | g
    cursor_index: 6
    shell: bash
    env_path: /usr/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.token_type == 'command' && result.value.current_command_string == 'g'
  - result.value.items.exists(i, i.label == 'git' && i.kind == 'method')
  - '[''/usr/bin''].all(d, d in state[''path-executable-cache@eh1''].cached_exes)'
- id: builtin-extensions-terminal-completions-ls-dup-option
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: ls -a -
    cursor_index: 7
    shell: bash
    env_path: /usr/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.token_type == 'argument' && result.value.show_files && result.value.show_directories
  - '!result.value.items.exists(i, i.label == ''-a'') && result.value.items.exists(i, i.label == ''-l'' && i.kind == ''flag'')'
  - size(result.value.items) == 41
  - '[''/usr/bin''].all(d, d in state[''path-executable-cache@eh1''].cached_exes)'
- id: builtin-extensions-terminal-completions-code-locale
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: 'code --locale '
    cursor_index: 14
    shell: bash
    env_path: /usr/local/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.items.exists(i, i.label == 'zh-TW' && i.kind == 'option-value')
  - '!result.value.items.exists(i, i.kind == ''flag'') && !result.value.show_files && !result.value.show_directories'
  - '[''/usr/local/bin''].all(d, d in state[''path-executable-cache@eh1''].cached_exes)'
- id: builtin-extensions-terminal-completions-insiders-subcommands
  flow: terminal-completions
  fixtures:
  - one-window-folder
  state:
    path-executable-cache@eh1:
      path_dirs:
        /opt/insiders/bin:
        - name: code-insiders
          type: file
          exec: true
        - name: code-tunnel-insiders
          type: file
          exec: true
  input:
    command_line: 'code-insiders '
    cursor_index: 14
    shell: bash
    env_path: /opt/insiders/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.items.exists(i, i.label == 'tunnel' && i.kind == 'method')
  - result.value.items.exists(i, i.label == '--diff' && i.kind == 'flag') && result.value.show_files && result.value.show_directories
  - '[''/opt/insiders/bin''].all(d, d in state[''path-executable-cache@eh1''].cached_exes)'
- id: builtin-extensions-terminal-completions-cargo-manifest
  flow: terminal-completions
  fixtures:
  - one-window-folder
  input:
    command_line: 'cargo build --manifest-path '
    cursor_index: 28
    shell: bash
    env_path: /usr/local/bin
    cwd: /work/app
  expect:
  - result.ok && result.value.show_files && result.value.show_directories && result.value.glob_pattern == '**/Cargo.toml'
  - '[''/usr/local/bin''].all(d, d in state[''path-executable-cache@eh1''].cached_exes)'
- id: builtin-extensions-terminal-completions-cargo-subcmds
