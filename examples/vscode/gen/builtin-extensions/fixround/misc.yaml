    source: extensions/php-language-features/src/features/validationProvider.ts:206-218
    set:
      vars.diags: '= input.lint_output.filter(l, matches(l, ''(?:Parse|Fatal) error: .* in .*? on line \\d+'')).map(l, {''message'': replace(l, ''^.*(?:Parse|Fatal) error: (.*) in (.*?) on line (\\d+).*$'',
        ''$1''), ''line'': int(replace(l, ''^.*(?:Parse|Fatal) error: (.*) in (.*?) on line (\\d+).*$'', ''$3'')) - 1})'
  - title: The document's diagnostics are replaced when php's output ends
    source: extensions/php-language-features/src/features/validationProvider.ts:244-251
    set:
      state.diagnostics: '= merge(omit(state.diagnostics, input.uri), {input.uri: vars.diags})'
  - return:
      diagnostics: = vars.diags
- component: php-validation-provider
  name: show-error
  kind: function
  summary: showError. ENOENT names the configured executable as invalid (or says none is set); other errors show their message, or a generic "Failed to run php" text.
  sources:
  - extensions/php-language-features/src/features/validationProvider.ts:262-279
  request:
    type: object
    properties:
      code:
        type: string
      message:
        type: string
      executable:
        type: string
      configured:
        type: boolean
  behavior:
  - title: ENOENT, with or without a configured executable
    source: extensions/php-language-features/src/features/validationProvider.ts:264-269
    if: input.code == 'ENOENT'
    then:
    - set:
        vars.message: '= input.configured ? ''Cannot validate since '' + input.executable + '' is not a valid php executable. Use the setting \''php.validate.executablePath\'' to configure the PHP executable.''
          : ''Cannot validate since no PHP executable is set. Use the setting \''php.validate.executablePath\'' to configure the PHP executable.'''
    else:
    - set:
        vars.message: '= has(input.message) && input.message != '''' ? input.message : ''Failed to run php using path: '' + input.executable + ''. Reason is unknown.'''
  - call: php-validation-provider.show-error-message
    input:
      message: = vars.message
  - return:
      message: = vars.message
- component: php-validation-provider
  name: show-error-message
  kind: function
  summary: showErrorMessage. The message is shown only when it carries no link or command URI (otherwise it is logged and a fixed text is shown), with an Open Settings button that opens php.validate.executablePath.
  sources:
  - extensions/php-language-features/src/features/validationProvider.ts:281-293
  request:
    type: object
    properties:
      message:
        type: string
  behavior:
  - call: php-notification.get-safe-notification-message
    input:
      message: = input.message
      fallback: PHP validation could not be started. Use the setting 'php.validate.executablePath' to configure the PHP executable.
    as: safe
  - title: An unsafe message is only written to the console
    source: extensions/php-language-features/src/features/validationProvider.ts:287-289
    if: vars.safe.value.replaced
    then:
    - set:
        ctx.php_console_error: = input.message
  - title: Show it with Open Settings
    source: extensions/php-language-features/src/features/validationProvider.ts:290
    call: vscode-api.window-show-information-message
    input:
      extension_id: vscode.php-language-features
      message: = vars.safe.value.message
      items:
      - Open Settings
  - choice: open_settings
    default: dismissed
    options:
      dismissed: []
      open:
      - title: Open Settings opens php.validate.executablePath
        source: extensions/php-language-features/src/features/validationProvider.ts:290-292
        call: vscode-api.commands-execute-command
        input:
          command: workbench.action.openSettings
          extension_id: vscode.php-language-features
          rest:
          - php.validate.executablePath
        on_error: continue
  - return:
      shown: = vars.safe.value.message
- component: php-validation-provider
  name: load-configuration
  kind: event
  summary: loadConfiguration (on activation and every configuration change). Re-reads php.validate.enable and the executable; validation stays paused only if the executable did not change; all diagnostics
    are cleared and, when enabled, every open PHP document is validated again.
  sources:
  - extensions/php-language-features/src/features/validationProvider.ts:136-169
  request:
    type: object
    properties:
      documents:
        type: array
        description: 'vscode.workspace.textDocuments: [{uri, language_id, lint_output}]'
  behavior:
  - set:
      vars.executable: '= config[''php-validate-executable-path''] != '''' ? config[''php-validate-executable-path''] : state.php_on_path'
  - title: A paused validation resumes only when the executable changed
    source: extensions/php-language-features/src/features/validationProvider.ts:150-152
    if: state.pause_validation
    then:
    - set:
        state.pause_validation: = has(state.config_executable) && state.config_executable == vars.executable
  - title: Clear all diagnostics
    source: extensions/php-language-features/src/features/validationProvider.ts:157
    set:
      state.config_executable: = vars.executable
      state.diagnostics: {}
  - title: When enabled, re-validate every open document
    source: extensions/php-language-features/src/features/validationProvider.ts:158-168
    if: config['php-validate-enable']
    then:
    - foreach: '= has(input.documents) ? input.documents : []'
      as: doc
      steps:
      - call: php-validation-provider.trigger-validate
        input:
          uri: = vars.doc.uri
          language_id: = vars.doc.language_id
          workspace_trusted: true
          lint_output: = vars.doc.lint_output
  - return:
      paused: = state.pause_validation
      diagnostics: = state.diagnostics
- component: github-gist-profile-content-handler
  name: save-profile
  kind: function
  summary: saveProfile. Throws when cancelled; gets a GitHub session with the gist and user:email scopes (created if none), acquires a client for it and creates a secret gist with one file named after the
    profile; returns its id and link (or null without them); the client is disposed even when creating fails.
  sources:
  - extensions/configuration-editing/src/importExportProfiles.ts:22-40
  request:
    type: object
    properties:
      name:
        type: string
        default: My Profile
      content:
        type: string
        default: '{"settings":{}}'
      cancelled:
        type: boolean
        default: false
  behavior:
  - title: A cancelled token throws CancellationError before any request
    source: extensions/configuration-editing/src/importExportProfiles.ts:23
    if: input.cancelled
    then:
    - fail:
        code: canceled
        message: Canceled
  - title: Get a GitHub session with gist and user:email, creating one if needed
    source: extensions/configuration-editing/src/importExportProfiles.ts:24
    call: vscode-api.authentication-get-session
    input:
      extension_id: vscode.configuration-editing
      provider_id: github
      scope_list_or_request:
        scopes:
        - gist
        - user:email
      options:
        createIfNone: true
  - title: Acquire a GitHub client for the session
    source: extensions/configuration-editing/src/importExportProfiles.ts:26
    set:
      state.client_log: = state.client_log + ['getClient']
  - title: Create a secret gist with one file named after the profile
    source: extensions/configuration-editing/src/importExportProfiles.ts:29-32
    set:
      state.client_log: = state.client_log + ['create']
  - choice: gist_create
    default: created
    options:
      created:
      - set:
          vars.result:
            id: gist-id
            link: https://gist.github.com/gist-id
      no_link:
      - set:
          vars.result: null
      failed:
      - title: The client is disposed in finally, then the error propagates
        source: extensions/configuration-editing/src/importExportProfiles.ts:37-39
        set:
          state.client_log: = state.client_log + ['dispose']
      - fail:
          code: github-error
          message: The selected GitHub session is not available to this extension.
  - title: Release the client (finally)
    source: extensions/configuration-editing/src/importExportProfiles.ts:37-39
    set:
      state.client_log: = state.client_log + ['dispose']
  - return:
      saved: = vars.result
- component: github-gist-profile-content-handler
  name: read-profile
  kind: function
  summary: readProfile. Throws when cancelled; takes the gist id (or the last path segment of a gist URI), reads the gist with an anonymous client and returns the first file's content; no file, truncated
    or binary content and any GitHub failure give null, a cancellation rethrows; an acquired client is always disposed.
  sources:
  - extensions/configuration-editing/src/importExportProfiles.ts:42-71
  request:
    type: object
    properties:
      id_or_uri:
        type: string
        default: gist-id
      cancelled:
        type: boolean
        default: false
  behavior:
  - title: A cancelled token throws before a client is acquired
    source: extensions/configuration-editing/src/importExportProfiles.ts:43
    if: input.cancelled
    then:
    - fail:
        code: canceled
        message: Canceled
  - title: A URI's basename is the gist id
    source: extensions/configuration-editing/src/importExportProfiles.ts:44
    set:
      vars.id: '= input.id_or_uri.contains(''/'') ? replace(input.id_or_uri, ''^.*/'', '''') : input.id_or_uri'
  - title: Acquire an anonymous client (a failure, e.g. rate limit, gives null)
    source: extensions/configuration-editing/src/importExportProfiles.ts:47
    choice: acquire
    default: ok
    options:
      ok:
      - set:
          state.client_log: = state.client_log + ['getAnonymousClient']
      rate_limited:
      - set:
          state.client_log: = state.client_log + ['getAnonymousClient']
      - return:
          content: null
  - title: Get the gist
    source: extensions/configuration-editing/src/importExportProfiles.ts:49
    set:
      state.client_log: = state.client_log + ['get ' + vars.id]
  - choice: gist
    default: ok
    options:
      ok:
      - set:
          vars.content: '{"settings":{}}'
      no_file:
      - set:
          vars.content: null
      truncated:
      - set:
          vars.content: null
      binary:
      - set:
          vars.content: null
      not_found:
      - set:
          vars.content: null
      cancelled:
      - title: A CancellationError is rethrown after the client is disposed
        source: extensions/configuration-editing/src/importExportProfiles.ts:56-59
        set:
          state.client_log: = state.client_log + ['dispose']
      - fail:
          code: canceled
          message: Canceled
  - title: Release the client (finally); truncated, binary or missing files and other failures are not a profile
    source: extensions/configuration-editing/src/importExportProfiles.ts:50-64
    set:
      state.client_log: = state.client_log + ['dispose']
  - return:
      content: = vars.content
- component: git-commit-folding-provider
  name: provide-folding-ranges
  kind: function
  summary: provideFoldingRanges. Runs of "#" comment lines fold as Comment ranges and each "diff --git " section folds up to the next diff or comment; a range needs at least two lines; open blocks run to
    the end of the document.
  sources:
  - extensions/git-base/src/foldingProvider.ts:10-91
  request:
    type: object
    properties:
      lines:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.ranges: []
      vars.comment_start: -1
      vars.diff_start: -1
  - foreach: = input.lines
    as: text
    index: i
    max: 1000
    steps:
    - title: A comment line closes an open diff block and starts or extends a comment block
      source: extensions/git-base/src/foldingProvider.ts:25-37
      if: vars.text.startsWith('#')
      then:
      - set:
          vars.ranges: '= vars.diff_start != -1 && vars.i - vars.diff_start > 1 ? vars.ranges + [{''start'': vars.diff_start, ''end'': vars.i - 1, ''kind'': ''region''}] : vars.ranges'
          vars.diff_start: -1
          vars.comment_start: '= vars.comment_start == -1 ? vars.i : vars.comment_start'
      else:
      - title: Any other line ends a comment block (folded when it spans two or more lines)
        source: extensions/git-base/src/foldingProvider.ts:38-51
        set:
          vars.ranges: '= vars.comment_start != -1 && vars.i - vars.comment_start > 1 ? vars.ranges + [{''start'': vars.comment_start, ''end'': vars.i - 1, ''kind'': ''comment''}] : vars.ranges'
          vars.comment_start: -1
    - title: A "diff --git " line closes the previous diff block and starts a new one
      source: extensions/git-base/src/foldingProvider.ts:54-64
      if: vars.text.startsWith('diff --git ')
      then:
      - set:
          vars.ranges: '= vars.diff_start != -1 && vars.i - vars.diff_start > 1 ? vars.ranges + [{''start'': vars.diff_start, ''end'': vars.i - 1, ''kind'': ''region''}] : vars.ranges'
          vars.diff_start: = vars.i
  - set:
      vars.n: = size(input.lines)
  - title: Blocks still open at the end of the document run to its last line
    source: extensions/git-base/src/foldingProvider.ts:69-88
    set:
      vars.ranges: '= vars.ranges + (vars.comment_start != -1 && vars.n - vars.comment_start > 1 ? [{''start'': vars.comment_start, ''end'': vars.n - 1, ''kind'': ''comment''}] : []) + (vars.diff_start
        != -1 && vars.n - vars.diff_start > 1 ? [{''start'': vars.diff_start, ''end'': vars.n - 1, ''kind'': ''region''}] : [])'
  - return:
      ranges: = vars.ranges
- component: github-push-error-handler
  name: handle-push-error
  kind: function
  summary: handlePushError. Only PermissionDenied and PushRejected errors, on a push URL (or, in Codespaces, the fetch URL) of github.com, for a refspec that is not a deletion, are handled; permission errors
    offer a fork, a "GH009 Secrets detected" rejection is explained; anything else is left to git (false).
  sources:
  - extensions/github/src/pushErrorHandler.ts:110-169
  - extensions/github/src/pushErrorHandler.ts:18-20
  request:
    type: object
    properties:
      git_error_code:
        type: string
        default: PushRejected
      stderr:
        type: string
      push_url:
        type: string
      fetch_url:
        type: string
      refspec:
        type: string
        default: main
  behavior:
  - title: Only permission-denied and push-rejected errors
    source: extensions/github/src/pushErrorHandler.ts:111-113
    if: '!(input.git_error_code in [''PermissionDenied'', ''PushRejected''])'
    then:
    - return:
        handled: false
  - title: The push URL, or in Codespaces the fetch URL
    source: extensions/github/src/pushErrorHandler.ts:115-118
    set:
      vars.url: '= has(input.push_url) && input.push_url != '''' ? input.push_url : (state.remote_name == ''codespaces'' && has(input.fetch_url) ? input.fetch_url : '''')'
  - title: Not a github.com remote, or a deletion refspec (:branch) -> not handled
    source: extensions/github/src/pushErrorHandler.ts:120-127
    if: '!matches(vars.url, ''(?i)^(?:https://github\\.com/|git@github\\.com:)[^/]+/[^/.]+'') || input.refspec.startsWith('':'')'
    then:
    - return:
        handled: false
  - set:
      vars.owner: = replace(vars.url, '(?i)^(?:https://github\\.com/|git@github\\.com:)([^/]+)/([^/.]+).*$', '$1')
      vars.repo: = replace(vars.url, '(?i)^(?:https://github\\.com/|git@github\\.com:)([^/]+)/([^/.]+).*$', '$2')
  - title: Permission denied -> offer a fork
    source: extensions/github/src/pushErrorHandler.ts:131-143
    if: input.git_error_code == 'PermissionDenied'
    then:
    - call: github-push-error-handler.handle-permission-denied-error
      input:
        owner: = vars.owner
        repo: = vars.repo
        refspec: = input.refspec
      as: fork
    - return:
        handled: true
        handler: PermissionDenied
        fork: = vars.fork.value.fork
  - title: Push protection (GH009 Secrets detected!)
    source: extensions/github/src/pushErrorHandler.ts:145-157
    if: 'has(input.stderr) && matches(input.stderr, ''(?i)GH009: Secrets detected!'')'
    then:
    - call: github-push-error-handler.handle-push-protection-error
      input:
        owner: = vars.owner
        repo: = vars.repo
        stderr: = input.stderr
      as: pp
    - return:
        handled: true
        handler: PushRejected.PushProtection
        document: = vars.pp.value.document
  - title: Other rejections are left to git
    source: extensions/github/src/pushErrorHandler.ts:159-168
    return:
      handled: false
- component: github-push-error-handler
  name: handle-permission-denied-error
  kind: function
  summary: handlePermissionDeniedError. A modal asks whether to create a fork of owner/repo and push to it; anything but Create Fork stops.
  sources:
  - extensions/github/src/pushErrorHandler.ts:171-183
  request:
    type: object
    properties:
      owner:
        type: string
      repo:
        type: string
      refspec:
        type: string
  behavior:
  - title: Ask to fork
    source: extensions/github/src/pushErrorHandler.ts:172-176
    call: vscode-api.window-show-warning-message
    input:
      extension_id: vscode.github
      message: = 'You don\'t have permissions to push to "' + input.owner + '/' + input.repo + '" on GitHub. Would you like to create a fork and push to it instead?'
      items:
      - Create Fork
      - 'No'
  - choice: answer
    default: create_fork
    options:
      create_fork: []
      'no':
      - title: Not Create Fork -> nothing more happens
        source: extensions/github/src/pushErrorHandler.ts:177-179
        return:
          fork: false
  - title: The refspec's local and remote branch names (local:remote)
    source: extensions/github/src/pushErrorHandler.ts:181-183
    return:
      fork: true
      local_name: '= input.refspec.contains('':'') ? input.refspec.split('':'')[0] : input.refspec'
- component: github-push-error-handler
  name: handle-push-protection-error
  kind: function
  summary: handlePushProtectionError. Stores git's stderr as a github-output document, opens it, then a modal warning explains the push protection rejection with Learn More (opens the docs).
  sources:
  - extensions/github/src/pushErrorHandler.ts:301-321
  request:
    type: object
    properties:
      owner:
        type: string
      repo:
        type: string
      stderr:
        type: string
  behavior:
  - title: Keep the stderr as github-output:/github-error-<timestamp>
    source: extensions/github/src/pushErrorHandler.ts:303-305
    set:
      vars.path: = '/github-error-' + string(now)
  - set:
      state.command_errors: '= merge(state.command_errors, {vars.path: input.stderr})'
  - title: Open it in an editor
    source: extensions/github/src/pushErrorHandler.ts:307-309
    call: vscode-api.workspace-open-text-document
    input:
      extension_id: vscode.github
      uri: = 'github-output:' + vars.path
    on_error: continue
  - call: vscode-api.window-show-warning-message
    input:
      extension_id: vscode.github
      message: = 'Your push to "' + input.owner + '/' + input.repo + '" was rejected by GitHub because push protection is enabled and one or more secrets were detected.'
      items:
      - Learn More
      options:
        modal: true
  - choice: answer
    default: dismissed
    options:
      dismissed: []
      learn_more:
      - title: Learn More opens the push protection docs
        source: extensions/github/src/pushErrorHandler.ts:318-320
        call: vscode-api.commands-execute-command
        input:
          command: vscode.open
          extension_id: vscode.github
          rest:
          - https://aka.ms/vscode-github-push-protection
        on_error: continue
  - return:
      document: = 'github-output:' + vars.path
- component: github-push-error-handler
  name: provide-text-document-content
  kind: function
  summary: CommandErrorOutputTextDocumentContentProvider.provideTextDocumentContent for github-output documents, the stored command output or nothing.
  sources:
  - extensions/github/src/pushErrorHandler.ts:84-99
  request:
    type: object
    properties:
      path:
        type: string
  behavior:
  - title: Stored output for the document path, else undefined
    source: extensions/github/src/pushErrorHandler.ts:96-98
    if: input.path in state.command_errors
    then:
    - return:
        content: = state.command_errors[input.path]
  - return:
      content: null
- component: github-push-error-handler
  name: find-pull-request-templates
  kind: function
  summary: findPullRequestTemplates. pull_request_template.md / PULL_REQUEST_TEMPLATE.md in the root, docs or .github, and any *.md in a PULL_REQUEST_TEMPLATE directory under them; then the user picks one
    ("No template" first).
  sources:
  - extensions/github/src/pushErrorHandler.ts:22-64
  request:
    type: object
    properties:
      root:
        type: string
        default: /work/app
  behavior:
  - title: Named template files in ., docs and .github, and *.md in their PULL_REQUEST_TEMPLATE folders
    source: extensions/github/src/pushErrorHandler.ts:57-64
    set:
      vars.templates: '= state.repository_files.filter(f, f in [''pull_request_template.md'', ''PULL_REQUEST_TEMPLATE.md'', ''docs/pull_request_template.md'', ''docs/PULL_REQUEST_TEMPLATE.md'', ''.github/PULL_REQUEST_TEMPLATE.md'']
        || ((f.startsWith(''PULL_REQUEST_TEMPLATE/'') || f.startsWith(''docs/PULL_REQUEST_TEMPLATE/'') || f.startsWith(''.github/PULL_REQUEST_TEMPLATE/'')) && f.endsWith(''.md'') && size(f.split(''/''))
        == (f.startsWith(''PULL_REQUEST_TEMPLATE/'') ? 2 : 3)))'
  - if: size(vars.templates) == 0
    then:
    - return:
        templates: []
        picked: null
  - call: github-push-error-handler.pick-pull-request-template
    input:
      templates: = vars.templates
    as: pick
  - return:
      templates: = vars.templates
      picked: = vars.pick.value.template
- component: github-push-error-handler
  name: pick-pull-request-template
  kind: function
  summary: pickPullRequestTemplate. A quick pick of "No template" (preselected, meaning none) followed by the templates.
  sources:
  - extensions/github/src/pushErrorHandler.ts:66-82
  request:
    type: object
    properties:
      templates:
        type: array
  behavior:
  - call: vscode-api.window-show-quick-pick
    input:
      extension_id: vscode.github
      items:
        labels: = ['No template'] + input.templates
      options:
        placeHolder: Select the Pull Request template
        ignoreFocusOut: true
  - choice: pick
    default: no_template
    options:
      no_template:
      - title: '"No template" carries no template'
        source: extensions/github/src/pushErrorHandler.ts:69-73
        return:
          template: null
      first_template:
      - title: A template item carries its file
        source: extensions/github/src/pushErrorHandler.ts:67
        return:
          template: = input.templates[0]
components:
- id: terminal-completion-provider
  name: terminal completion provider (terminalSuggestMain.ts)
  kind: module
  layer: extensions
  parent: terminal-suggest-extension
  summary: The TerminalCompletionProvider that vscode.terminal-suggest registers in activate. It resolves the command line under the cursor into fig-spec completions, PATH executables and file/folder requests,
    and debounces PATH directory changes into a refresh of the executable cache.
  sources:
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:254-321
  - extensions/terminal-suggest/src/terminalSuggestMain.ts:328-376
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        folders:
          type: array
          description: folders that vscode.workspace.fs.stat reports as directories
        refresh_due:
          type: integer
    initial:
      folders:
      - /work/app
      - /work/app/child
      - /work/app/src
      refresh_due: 0
- id: path-executable-cache
  name: PathExecutableCache
  kind: module
  layer: extensions
  parent: terminal-suggest-extension
  summary: Caches the executables found in each PATH directory; a directory is scanned once and served from the cache until refresh() drops it (a PATH directory changed on disk).
  sources:
  - extensions/terminal-suggest/src/env/pathExecutableCache.ts:21-57
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        platform:
          type: string
        cached_exes:
          type: object
          description: PATH directory -> completion resources found there
        path_dirs:
          type: object
          description: 'PATH directories as fs.stat/readDirectory see them: dir -> [{name, type, exec, target}]'
    initial:
      platform: linux
      cached_exes: {}
      path_dirs:
        /usr/bin:
        - name: ls
          type: file
          exec: true
        - name: git
          type: file
          exec: true
        - name: cd
          type: file
          exec: true
        - name: README
          type: file
          exec: false
        - name: share
          type: directory
          exec: false
        /usr/local/bin:
        - name: code
          type: symlink
          exec: true
          target: /opt/vscode/bin/code
        - name: cargo
          type: file
          exec: true
        - name: git
          type: file
          exec: true
