- component: fig-interface
  name: get-fig-spec-suggestions
  kind: function
  summary: getFigSpecSuggestions with collectCompletionItemResult. Parses the typed words against the spec (subcommand, pending option value); an option waiting for a value only suggests that value (OptionValue
    items); otherwise the current subcommands (Method), the options not passed yet (Flag) and the argument's suggestions (Argument) are listed. Argument templates request files (filepaths) or folders (folders);
    a filepaths generator requests both with its file names; the git branch generator adds ScmBranch items.
  sources:
  - extensions/terminal-suggest/src/fig/figInterface.ts:123-173
  - extensions/terminal-suggest/src/fig/figInterface.ts:177-355
  request:
    type: object
    properties:
      spec:
        type: object
      current_command_string:
        type: string
      cwd:
        type: string
  behavior:
  - title: No command or no shell integration cwd, no spec suggestions
    source: extensions/terminal-suggest/src/fig/figInterface.ts:138-141
    if: input.cwd == ''
    then:
    - return:
        items: []
        show_files: false
        show_directories: false
        file_extensions: []
        file_names: []
        has_current_arg: false
  - set:
      vars.words: = input.current_command_string.split(' ')
  - set:
      vars.done: = vars.words.slice(1, size(vars.words) - 1)
      vars.cur: = vars.words[size(vars.words) - 1]
  - title: A typed subcommand becomes the completion object
    source: extensions/terminal-suggest/src/fig/figInterface.ts:149
    set:
      vars.sub: '= size(vars.done) > 0 && input.spec.subcommands.exists(s, vars.done[0] in s.names) ? input.spec.subcommands.filter(s, vars.done[0] in s.names)[0] : null'
  - set:
      vars.obj: '= vars.sub != null ? vars.sub : input.spec'
      vars.rest: '= vars.sub != null ? vars.done.slice(1, size(vars.done)) : vars.done'
  - set:
      vars.passed: = vars.rest.filter(a, a.startsWith('-'))
      vars.last: '= size(vars.rest) > 0 ? vars.rest[size(vars.rest) - 1] : '''''
  - set:
      vars.pending: = vars.obj.options.filter(o, vars.last in o.names && o.arg != null)
  - set:
      vars.arg: '= size(vars.pending) > 0 ? vars.pending[0].arg : vars.obj.args'
      vars.arg_kind: '= size(vars.pending) > 0 ? ''option-value'' : ''argument'''
      vars.items: []
      vars.show_files: false
      vars.show_dirs: false
      vars.file_names: []
      vars.file_extensions: []
  - title: 'Args flag: the argument''s suggestions, as Argument items (OptionValue after an option)'
    source: extensions/terminal-suggest/src/fig/figInterface.ts:279-344
    if: vars.arg != null
    then:
    - set:
        vars.items: '= vars.arg.suggestions.map(s, {''label'': s, ''kind'': vars.arg_kind})'
    - title: Templates request files (filepaths) and folders (folders)
      source: extensions/terminal-suggest/src/fig/figInterface.ts:259-272
      set:
        vars.show_files: = 'filepaths' in vars.arg.templates
        vars.show_dirs: = 'folders' in vars.arg.templates
    - title: The filepaths() generator returns a file request filtered by names/extensions and a folder request
      source: extensions/terminal-suggest/src/helpers/filepaths.ts:6-21
      if: vars.arg.generator == 'filepaths'
      then:
      - title: A file item turns on files and folders and carries the file filter
        source: extensions/terminal-suggest/src/fig/figInterface.ts:228-238
        set:
          vars.show_files: true
          vars.show_dirs: true
          vars.file_names: = vars.arg.file_names
          vars.file_extensions: = vars.arg.file_extensions
    - title: The git branch generator's suggestions become ScmBranch items
      source: extensions/terminal-suggest/src/fig/figInterface.ts:240-256
      if: vars.arg.generator == 'git-branches'
      then:
      - call: git-completion-spec.remote-local-branches
        input: {}
        as: branches
      - set:
          vars.items: '= vars.branches.value.suggestions.map(b, {''label'': b.name, ''description'': b.description, ''kind'': b.kind}) + vars.items'
  - title: 'Subcommands and Options flags (not while an option waits for its value): subcommands as Method items, options not passed yet as Flag items'
    source: extensions/terminal-suggest/src/fig/figInterface.ts:346-352
    if: size(vars.pending) == 0
    then:
    - set:
        vars.items: '= vars.items + (size(vars.rest) == 0 && vars.sub == null ? vars.obj.subcommands.map(s, s.names.map(n, {''label'': n, ''kind'': ''method''})).flatten() : []) + vars.obj.options.filter(o,
          !o.names.exists(n, n in vars.passed)).map(o, o.names.map(n, {''label'': n, ''kind'': ''flag''})).flatten()'
  - return:
      items: = vars.items
      show_files: = vars.show_files
      show_directories: = vars.show_dirs
      file_extensions: = vars.file_extensions
      file_names: = vars.file_names
      has_current_arg: = vars.arg != null
- component: git-completion-spec
  name: remote-local-branches
  kind: function
  summary: gitGenerators.remoteLocalBranches. Runs git for-each-ref over refs/heads and refs/remotes and post-processes each "name|author|hash|subject|age" line into a branch suggestion; fatal output gives
    none, HEAD lines are dropped, remotes/<remote>/ is stripped and duplicates are removed.
  sources:
  - extensions/terminal-suggest/src/completions/git.ts:284-291
  - extensions/terminal-suggest/src/completions/git.ts:63-149
  request:
    type: object
  behavior:
  - title: The script runs git for-each-ref --format=... refs/heads/ refs/remotes/ in the terminal's cwd
    source: extensions/terminal-suggest/src/completions/git.ts:154-160
    set:
      vars.out: = state.for_each_ref_output
  - title: Output starting with "fatal:" (not a repository) yields no branches
    source: extensions/terminal-suggest/src/completions/git.ts:69-71
    if: vars.out.startsWith('fatal:')
    then:
    - return:
        suggestions: []
  - title: Drop blank lines and HEAD lines
    source: extensions/terminal-suggest/src/completions/git.ts:74-76
    set:
      vars.lines: = vars.out.split('\n').filter(l, l.trim() != '' && !l.trim().startsWith('HEAD'))
      vars.seen: []
      vars.out_list: []
  - foreach: = vars.lines
    as: line
    steps:
    - set:
        vars.parts: = vars.line.split('|')
    - title: Parse name|author|hash|subject|timeAgo; remotes/<remote>/ is stripped; description is "age • author • hash • subject" (lines in the old format fall back to "Branch")
      source: extensions/terminal-suggest/src/completions/git.ts:77-139
      set:
        vars.raw: '= size(vars.parts) >= 5 ? vars.parts[0].trim() : replace(vars.line, ''^[*+]?\\s*'', '''').trim()'
        vars.desc: '= size(vars.parts) >= 5 ? vars.parts[4].trim() + '' • '' + vars.parts[1].trim() + '' • '' + vars.parts[2].trim() + '' • '' + vars.parts[3].trim() : ''Branch'''
    - set:
        vars.name: '= vars.raw.startsWith(''remotes/'') ? vars.raw.substring(vars.raw.indexOf(''/'', 8) + 1) : vars.raw'
    - title: Duplicates (the same branch locally and on a remote) are suggested once
      source: extensions/terminal-suggest/src/completions/git.ts:140-149
      if: vars.name in vars.seen
      then:
      - continue: true
    - set:
        vars.seen: = vars.seen + [vars.name]
        vars.out_list: '= vars.out_list + [{''name'': vars.name, ''description'': vars.desc, ''kind'': ''scm-branch''}]'
  - return:
      suggestions: = vars.out_list
- component: git-notification
  name: get-safe-notification-message
  kind: function
  summary: getSafeNotificationMessage. A message with markdown link syntax "](" or a "command:" URI (any case) is replaced by the trusted fallback text; anything else is kept.
  sources:
  - extensions/git/src/notification.ts:6-9
  request:
    type: object
    properties:
      message:
        type: string
      fallback:
        type: string
  behavior:
  - title: Link syntax or a command URI -> the link-free fallback
    source: extensions/git/src/notification.ts:8
    if: matches(input.message, '(?i)\\]\\(|command:')
    then:
    - return:
        message: = input.fallback
        replaced: true
  - return:
      message: = input.message
      replaced: false
- component: repository-cache
  name: set
  kind: function
  summary: set(repoUrl, rootPath). Normalizes the URL (trailing .git and slashes dropped), finds the workspace folder that contains the clone (none -> nothing stored), touches that folder in the URL's inner
    LRU and the URL in the outer LRU, evicting the least recently used beyond 10 folders / 30 repositories, and persists.
  sources:
  - extensions/git/src/repositoryCache.ts:91-131
  request:
    type: object
    properties:
      repo_url:
        type: string
      root_path:
        type: string
  behavior:
  - title: Normalize the remote URL
    source: extensions/git/src/repositoryCache.ts:32-39
    set:
      vars.key: = replace(input.repo_url.trim(), '(?i)(?:\\.git)?/*$', '')
  - title: The workspace folder that contains the clone, or that it contains (longest first)
    source: extensions/git/src/repositoryCache.ts:111-131
    call: vscode-api.workspace-workspace-folders
    as: wf
  - set:
      vars.cands: = vars.wf.value.map(f, replace(f, '^file://', '')).filter(f, f == input.root_path || input.root_path.startsWith(f + '/') || f.startsWith(input.root_path + '/'))
  - title: No related workspace folder, nothing is cached
    source: extensions/git/src/repositoryCache.ts:97-100
    if: size(vars.cands) == 0
    then:
    - return:
        stored: false
  - set:
      vars.folder: = vars.cands.filter(f, vars.cands.all(g, size(g) <= size(f)))[0]
      state.seq: = state.seq + 1
  - title: Touch the folder in the URL's inner LRU and the URL in the outer LRU
    source: extensions/git/src/repositoryCache.ts:102-107
    set:
      state.repos: '= merge(state.repos, {vars.key: {''order'': state.seq, ''folders'': {vars.folder: {''repository_path'': input.root_path, ''workspace_path'': vars.folder, ''last_touched_time'': now,
        ''order'': state.seq}}}})'
  - title: The inner LRU keeps at most 10 folders (MAX_FOLDER_ENTRIES)
    source: extensions/git/src/repositoryCache.ts:30
    if: size(state.repos[vars.key].folders) > state.max_folder_entries
    then:
    - set:
        vars.f: = state.repos[vars.key].folders
    - set:
        state.repos: '= merge(omit(state.repos, vars.key), {vars.key: {''order'': state.seq, ''folders'': omit(vars.f, vars.f.filter(k, vars.f.all(j, vars.f[j].order >= vars.f[k].order))[0])}})'
  - title: The outer LRU keeps at most 30 repositories (MAX_REPO_ENTRIES)
    source: extensions/git/src/repositoryCache.ts:29
    if: size(state.repos) > state.max_repo_entries
    then:
    - set:
        state.repos: = omit(state.repos, state.repos.filter(k, state.repos.all(j, state.repos[j].order >= state.repos[k].order))[0])
  - title: Persist the LRU to global state (git.repositoryCache)
    source: extensions/git/src/repositoryCache.ts:212-227
    set:
      state.saves: = state.saves + 1
  - return:
      stored: true
      key: = vars.key
      workspace_path: = vars.folder
- component: repository-cache
  name: get
  kind: function
  summary: get(repoUrl). The workspace folders cached for the normalized URL, or nothing.
  sources:
  - extensions/git/src/repositoryCache.ts:157-161
  request:
    type: object
    properties:
      repo_url:
        type: string
  behavior:
  - set:
      vars.key: = replace(input.repo_url.trim(), '(?i)(?:\\.git)?/*$', '')
  - title: Unknown URL -> undefined
    source: extensions/git/src/repositoryCache.ts:158-160
    if: '!(vars.key in state.repos)'
    then:
    - return:
        found: false
        entries: []
  - return:
      found: true
      entries: = state.repos[vars.key].folders.map(f, state.repos[vars.key].folders[f])
- component: repository-cache
  name: delete
  kind: function
  summary: delete(repoUrl, folder). Removes the folder from the URL's entry; an emptied entry is removed, otherwise it is bumped to most recent; persists when something was removed.
  sources:
  - extensions/git/src/repositoryCache.ts:163-179
  request:
    type: object
    properties:
      repo_url:
        type: string
      folder:
        type: string
  behavior:
  - set:
      vars.key: = replace(input.repo_url.trim(), '(?i)(?:\\.git)?/*$', '')
  - title: Nothing cached for the URL or the folder, nothing to do
    source: extensions/git/src/repositoryCache.ts:165-171
    if: '!(vars.key in state.repos) || !(input.folder in state.repos[vars.key].folders)'
    then:
    - return:
        removed: false
  - set:
      vars.rest: = omit(state.repos[vars.key].folders, input.folder)
      state.seq: = state.seq + 1
  - title: An emptied repository entry is dropped, otherwise re-set to bump its recency
    source: extensions/git/src/repositoryCache.ts:172-177
    if: size(vars.rest) == 0
    then:
    - set:
        state.repos: = omit(state.repos, vars.key)
    else:
    - set:
        state.repos: '= merge(omit(state.repos, vars.key), {vars.key: {''order'': state.seq, ''folders'': vars.rest}})'
  - set:
      state.saves: = state.saves + 1
  - return:
      removed: true
- component: repository-cache
  name: update
  kind: function
  summary: update(added, removed, rootPath). Called when a repository opens or its remotes change. Each removed remote's fetch URL loses the related workspace folder; each added remote's fetch URL is set
    to the root.
  sources:
  - extensions/git/src/repositoryCache.ts:133-152
  - extensions/git/src/model.ts:699
  request:
    type: object
    properties:
      added_remotes:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            fetch_url:
              type: string
      removed_remotes:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            fetch_url:
              type: string
      root_path:
        type: string
        default: /work/app
  behavior:
  - foreach: = input.removed_remotes
    as: remote
    steps:
    - title: A removed remote without a fetch URL is skipped
      source: extensions/git/src/repositoryCache.ts:135-138
      if: '!has(vars.remote.fetch_url) || vars.remote.fetch_url == '''''
      then:
      - continue: true
    - call: vscode-api.workspace-workspace-folders
      as: wf
    - set:
        vars.related: = vars.wf.value.map(f, replace(f, '^file://', '')).filter(f, f == input.root_path || input.root_path.startsWith(f + '/') || f.startsWith(input.root_path + '/'))
    - title: Forget the related workspace folder for the removed remote
      source: extensions/git/src/repositoryCache.ts:139-142
      if: size(vars.related) > 0
      then:
      - call: repository-cache.delete
        input:
          repo_url: = vars.remote.fetch_url
          folder: = vars.related[0]
  - foreach: = input.added_remotes
    as: remote
    steps:
    - title: An added remote with a fetch URL is associated with the root
      source: extensions/git/src/repositoryCache.ts:145-151
      if: has(vars.remote.fetch_url) && vars.remote.fetch_url != ''
      then:
      - call: repository-cache.set
        input:
          repo_url: = vars.remote.fetch_url
          root_path: = input.root_path
  - return:
      repositories: = size(state.repos)
- component: clone-manager
  name: clone
  kind: function
  summary: CloneManager.clone. Without a URL nothing happens (the remote source picker was dismissed). A pasted "git clone" prefix is stripped; a URL the repository cache knows opens the existing clone,
    any other URL is cloned.
  sources:
  - extensions/git/src/cloneManager.ts:32-58
  request:
    type: object
    properties:
      url:
        type: string
      parent_path:
        type: string
  behavior:
  - title: No URL (picker dismissed) -> telemetry no_URL, nothing cloned
    source: extensions/git/src/cloneManager.ts:40-50
    if: '!has(input.url) || input.url == '''''
    then:
    - return:
        outcome: no_URL
  - title: Strip a pasted "git clone " prefix
    source: extensions/git/src/cloneManager.ts:52
    set:
      vars.url: = replace(input.url.trim(), '^git\\s+clone\\s+', '')
  - title: Look the URL up in the repository cache
    source: extensions/git/src/cloneManager.ts:54
    call: repository-cache.get
    input:
      repo_url: = vars.url
    as: cached
  - title: A known clone is opened instead of cloning again
    source: extensions/git/src/cloneManager.ts:55-57
    if: size(vars.cached.value.entries) > 0
    then:
    - call: clone-manager.try-open-existing-repository
      input:
        url: = vars.url
        entries: = vars.cached.value.entries
      as: opened
    - return: = vars.opened.value
  - call: clone-manager.clone-repository
    input:
      url: = vars.url
      parent_path: '= has(input.parent_path) ? input.parent_path : '''''
    as: cloned
  - return: = vars.cloned.value
- component: clone-manager
  name: clone-repository
  kind: function
  summary: cloneRepository. Asks for a destination folder (cancel -> no_directory), clones with a progress notification whose title only names the URL when it carries no link or command URI, then runs the
    post-clone action. A non-empty destination or another git failure is reported as a failure; a cancelled clone returns nothing.
  sources:
  - extensions/git/src/cloneManager.ts:60-134
  request:
    type: object
    properties:
      url:
        type: string
      parent_path:
        type: string
  behavior:
  - set:
      vars.parent: = input.parent_path
  - title: No parent folder given, ask for one
    source: extensions/git/src/cloneManager.ts:61-90
    if: vars.parent == ''
    then:
    - call: vscode-api.window-show-open-dialog
      input:
        extension_id: vscode.git
        options:
          canSelectFolders: true
          canSelectFiles: false
          canSelectMany: false
    - choice: destination
      default: picked
      options:
        picked:
        - set:
            vars.parent: /work
        cancelled:
        - title: No folder chosen, telemetry no_directory
          source: extensions/git/src/cloneManager.ts:76-86
          return:
            outcome: no_directory
  - title: The progress title names the URL only when it is safe to show
    source: extensions/git/src/cloneManager.ts:93-99
    call: git-notification.get-safe-notification-message
    input:
      message: = 'Cloning git repository "' + input.url + '"...'
      fallback: Cloning git repository...
    as: title
  - call: vscode-api.window-with-progress
    input:
      extension_id: vscode.git
      options:
        location: notification
        title: = vars.title.value.message
        cancellable: true
      task: {}
  - set:
      vars.path: = vars.parent + '/' + replace(replace(input.url, '/+$', ''), '^.*/|\\.git$', '')
  - title: git clone's outcome
    source: extensions/git/src/cloneManager.ts:101-134
    choice: git_clone
    default: ok
    options:
      ok: []
      directory_not_empty:
      - fail:
          code: git-error
          message: '= ''fatal: destination path already exists and is not an empty directory'''
      cancelled:
      - return:
          outcome: cancelled
  - set:
      state.last_clone:
        url: = input.url
        path: = vars.path
        progress_title: = vars.title.value.message
  - call: clone-manager.do-post-clone-action
    input:
      target: = vars.path
    as: post
  - return:
      outcome: success
      repository_path: = vars.path
      action: = vars.post.value.action
- component: clone-manager
  name: try-open-existing-repository
  kind: function
  summary: tryOpenExistingRepository. A cached clone already open as a workspace folder is returned as is; a single other clone is opened with the post-clone action; several are offered in a quick pick
    together with "Clone again".
  sources:
  - extensions/git/src/cloneManager.ts:216-254
  - extensions/git/src/cloneManager.ts:191-214
  request:
    type: object
    properties:
      url:
        type: string
      entries:
        type: array
  behavior:
  - call: vscode-api.workspace-workspace-folders
    as: wf
  - set:
      vars.open: = vars.wf.value.map(f, replace(f, '^file://', ''))
  - title: A clone that is already a workspace folder is used directly
    source: extensions/git/src/cloneManager.ts:233-240
    if: input.entries.exists(e, e.workspace_path in vars.open)
    then:
    - return:
        outcome: existing
        workspace_path: = input.entries.filter(e, e.workspace_path in vars.open)[0].workspace_path
        action: none
  - title: One cached clone is opened; several are offered in a quick pick with "Clone again"
    source: extensions/git/src/cloneManager.ts:242-245
    if: size(input.entries) == 1
    then:
    - set:
        vars.target: = input.entries[0].workspace_path
    else:
    - call: vscode-api.window-show-quick-pick
      input:
        extension_id: vscode.git
        items:
          labels: = input.entries.map(e, e.workspace_path) + ['Clone again']
    - choice: pick
      default: first
      options:
        first:
        - set:
            vars.target: = input.entries[0].workspace_path
        clone_again:
        - call: clone-manager.clone-repository
          input:
            url: = input.url
            parent_path: ''
          as: again
        - return: = vars.again.value
        dismissed:
        - return:
            outcome: dismissed
  - call: clone-manager.do-post-clone-action
    input:
      target: = vars.target
    as: post
  - return:
      outcome: existing
      workspace_path: = vars.target
      action: = vars.post.value.action
- component: clone-manager
  name: do-post-clone-action
  kind: function
  summary: doPostCloneAction. git.openAfterClone always / alwaysNewWindow / whenNoFolderOpen (and no folder open) decide directly; otherwise a modal asks Open, Open in New Window or (with a workspace) Add
    to Workspace. Open runs vscode.openFolder.
  sources:
  - extensions/git/src/cloneManager.ts:136-189
  request:
    type: object
    properties:
      target:
        type: string
  behavior:
  - call: vscode-api.workspace-workspace-folders
    as: wf
  - title: git.openAfterClone decides without asking
    source: extensions/git/src/cloneManager.ts:138-153
    set:
      vars.action: '= config[''git-open-after-clone''] == ''always'' || (config[''git-open-after-clone''] == ''whenNoFolderOpen'' && size(vars.wf.value) == 0) ? ''open'' : (config[''git-open-after-clone'']
        == ''alwaysNewWindow'' ? ''open-new-window'' : '''')'
  - title: Otherwise ask (Add to Workspace only offered with a workspace open)
    source: extensions/git/src/cloneManager.ts:155-171
    if: vars.action == ''
    then:
    - call: vscode-api.window-show-information-message
      input:
        extension_id: vscode.git
        message: '= size(vars.wf.value) > 0 ? ''Would you like to open the repository, or add it to the current workspace?'' : ''Would you like to open the repository?'''
        items:
        - Open
        - Open in New Window
    - choice: answer
      default: open
      options:
        open:
        - set:
            vars.action: open
        open_new_window:
        - set:
            vars.action: open-new-window
        add_to_workspace:
        - set:
            vars.action: '= size(vars.wf.value) > 0 ? ''add-to-workspace'' : ''none'''
        dismissed:
        - set:
            vars.action: none
  - title: Open (reuse or new window) runs vscode.openFolder
    source: extensions/git/src/cloneManager.ts:180-188
    if: vars.action == 'open' || vars.action == 'open-new-window'
    then:
    - call: vscode-api.commands-execute-command
      input:
        command: vscode.openFolder
        extension_id: vscode.git
        rest:
        - = 'file://' + input.target
      on_error: continue
    - set:
        state.opened: = state.opened + [input.target]
  - return:
      action: = vars.action
- component: git-command-center
  name: cmd-git-clone
  kind: command
  summary: 'git.clone: Clone. CommandCenter.clone hands the URL (first argument) to the CloneManager.'
