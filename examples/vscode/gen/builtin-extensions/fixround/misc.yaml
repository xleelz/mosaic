      current_hash: = state.content_hash
  - return:
      askpass: = vars.dir + '/askpass.sh'
      askpass_main: = vars.dir + '/askpass-main.js'
      askpass_empty: = vars.dir + '/askpass-empty.sh'
      ssh_askpass: = vars.dir + '/ssh-askpass.sh'
      ssh_askpass_empty: = vars.dir + '/ssh-askpass-empty.sh'
      content_addressed: true
      created: true
- component: askpass-manager
  name: garbage-collect-old-directories
  kind: function
  summary: garbageCollectOldDirectories. Skips the current hash and non-directories; removes directories whose mtime is older than 7 days, keeps the rest.
  sources:
  - extensions/git/src/askpassManager.ts:148-197
  request:
    type: object
    properties:
      base:
        type: string
      current_hash:
        type: string
  behavior:
  - set:
      vars.removed: []
  - foreach: = state.storage
    as: entry
    index: path
    steps:
    - title: Only entries of the askpass directory other than the current hash
      source: extensions/git/src/askpassManager.ts:165-169
      if: '!vars.path.startsWith(input.base + ''/'') || vars.path == input.base + ''/'' + input.current_hash'
      then:
      - continue: true
    - title: Non-directories are skipped
      source: extensions/git/src/askpassManager.ts:176-179
      if: '!vars.entry.is_directory'
      then:
      - continue: true
    - title: Unused for more than 7 days -> removed
      source: extensions/git/src/askpassManager.ts:181-189
      if: vars.entry.mtime_ms < now - 7 * 24 * 60 * 60 * 1000
      then:
      - set:
