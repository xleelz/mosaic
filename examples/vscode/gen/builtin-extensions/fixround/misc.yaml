  - one-window-folder
  choices:
    github-push-error-handler.handle-permission-denied-error.answer: 'no'
  input:
    git_error_code: PermissionDenied
    push_url: https://github.com/owner/repo
    refspec: main
  expect:
  - result.ok && result.value.handled && !result.value.fork && state['github-push-error-handler@eh1'].command_errors == {}
