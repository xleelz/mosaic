- component: askpass-manager
  name: ensure-askpass-scripts
  kind: function
  summary: ensureAskpassScripts. The copies live in <storage>/askpass/<content hash>. An existing copy only gets its mtime touched; otherwise the directory is created, the five scripts are copied with user-only
    permissions, the mtime is touched and directories of other hashes unused for 7 days are removed.
