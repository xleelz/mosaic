  - return:
      package_manager: = vars.pm.value.name
- component: preferred-pm
  name: find-preferred-pm
  kind: function
  summary: findPreferredPM. npm (package-lock.json), pnpm (pnpm-lock.yaml or shrinkwrap.yaml, also in an ancestor), yarn (yarn.lock) and bun (bun.lockb or bun.lock) are detected in that order, plus the
