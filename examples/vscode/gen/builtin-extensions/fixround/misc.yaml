        askpass_empty: = vars.dir + '/askpass-empty.sh'
        ssh_askpass: = vars.dir + '/ssh-askpass.sh'
        ssh_askpass_empty: = vars.dir + '/ssh-askpass-empty.sh'
        content_addressed: true
        created: false
  - title: Create the directory and copy the five scripts with user-only ACLs, then touch it
    source: extensions/git/src/askpassManager.ts:259-277
    set:
      state.storage: '= merge(state.storage, {vars.dir: {''is_directory'': true, ''mtime_ms'': now, ''files'': [''askpass.sh'', ''askpass-main.js'', ''ssh-askpass.sh'', ''askpass-empty.sh'', ''ssh-askpass-empty.sh'']}})'
  - title: Garbage-collect other content-addressed directories
