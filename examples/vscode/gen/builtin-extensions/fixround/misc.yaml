- component: npm-tasks
  name: detect-package-manager
  kind: function
  summary: detectPackageManager. Uses the preferred manager; when warnings are wanted, several lockfiles were found and the user did not choose "Do not show again", shows an information message (the folder
    path is only shown when it is safe) with Learn more and Do not show again, the latter recorded in global state.
  sources:
