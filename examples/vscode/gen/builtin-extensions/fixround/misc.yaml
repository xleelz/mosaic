- component: fig-interface
  name: get-fig-suggestions
  kind: function
  summary: getFigSuggestions. Only specs whose label is an available PATH command count. For a command token each such spec becomes a Method item described by the spec; for an argument token only the spec
    of the current command is applied, and its items and file/folder requests are merged.
  sources:
  - extensions/terminal-suggest/src/fig/figInterface.ts:31-121
  request:
    type: object
    properties:
      command_line:
        type: string
      cursor_index:
        type: integer
      available_commands:
        type: array
      current_command_string:
        type: string
      token_type:
        type: string
      cwd:
        type: string
  behavior:
  - title: Map spec labels to the available commands; only specs with a command on PATH are considered
    source: extensions/terminal-suggest/src/fig/figInterface.ts:49-71
    set:
      vars.current: = input.current_command_string.split(' ')[0]
      vars.matched: = state.spec_names.filter(n, n in input.available_commands.map(c, c.label))
      vars.items: []
      vars.show_files: false
      vars.show_dirs: false
      vars.file_extensions: []
      vars.file_names: []
      vars.has_current_arg: false
  - foreach: = vars.matched
    as: name
    steps:
    - title: An argument token only applies the spec of the command being typed
      source: extensions/terminal-suggest/src/fig/figInterface.ts:92-101
      if: input.token_type != 'command' && vars.name != vars.current
      then:
      - continue: true
    - call: fig-interface.get-spec
      input:
        name: = vars.name
      as: spec
    - title: 'Command token: the spec label becomes a Method item described by the spec'
      source: extensions/terminal-suggest/src/fig/figInterface.ts:75-90
      if: input.token_type == 'command'
      then:
      - set:
          vars.items: '= vars.items + [{''label'': vars.name, ''description'': vars.spec.value.description, ''kind'': ''method''}]'
      - continue: true
    - title: Apply the current command's spec and merge its items and resource requests
      source: extensions/terminal-suggest/src/fig/figInterface.ts:103-117
      call: fig-interface.get-fig-spec-suggestions
      input:
        spec: = vars.spec.value
        current_command_string: = input.current_command_string
        cwd: = input.cwd
      as: applied
    - set:
        vars.items: = vars.items + vars.applied.value.items
        vars.show_files: = vars.show_files || vars.applied.value.show_files
        vars.show_dirs: = vars.show_dirs || vars.applied.value.show_directories
        vars.file_extensions: = vars.applied.value.file_extensions
        vars.file_names: = vars.applied.value.file_names
        vars.has_current_arg: = vars.has_current_arg || vars.applied.value.has_current_arg
  - return:
      items: = vars.items
      show_files: = vars.show_files
      show_directories: = vars.show_dirs
      file_extensions: = vars.file_extensions
      file_names: = vars.file_names
      has_current_arg: = vars.has_current_arg
