  - component: markdown-editor-navigation
    name: reveal-range
    kind: function
    summary: "revealRange (CustomTextEditorNavigation, e.g. Go to Symbol or a search result): wait for the webview, drain edits, capture the webview's navigation state, cancel if the document version, navigation generation or epoch changed meanwhile, reject a range outside the document, then send renderer.revealRange with offsets in the mirrored text."
