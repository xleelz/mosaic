            fail: {code: invalid-markdown-editor-navigation-range, status: 0, message: Invalid Markdown editor navigation range}
      - title: renderer.revealRange at the mirrored offsets, carrying epoch and revision
        source: "extensions/markdown-language-features/src/preview/markdownEditorNavigation.ts:74-85"
        call: markdown-editor-rpc-transport.send
        input: {kind: request, method: revealRange, params: {start: "= input.start", endExclusive: "= input.end_exclusive", editEpoch: "= vars.captured", preserveFocus: "= input.preserve_focus"}}
      - return: {revealed: true}
  - component: markdown-editor-navigation
    name: reset
    kind: function
    summary: "reset (webview reload): bump the generation (pending reveals and saved view states become stale) and the selection request, forget the selection and fire onDidChangeSelection(undefined)."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorNavigation.ts:108-113"]
