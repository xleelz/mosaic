      - return: {generation: "= state.generation"}
  - component: markdown-editor-rpc-transport
    name: connect
    kind: function
    summary: "new MarkdownEditorRpcTransport(secret, postMessage, onDidReceiveMessage): the previous transport is disposed (listener and pending messages dropped) and the new one subscribes under the new secret."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:57-81", "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:110-115"]
    request: {type: object, required: [secret], properties: {secret: {type: string}}}
    behavior:
      - if: "size(state.pending) > 0"
        then:
          - title: dispose() of the old transport drops messages still waiting for a listener
            source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:110-115"
            set: {state.pending: []}
      - set:
          state.secret: "= input.secret"
          state.disposed: false
          state.listener: true
      - return: {secret: "= input.secret"}
  - component: markdown-editor-rpc-transport
    name: receive-envelope
    kind: function
    summary: "The onDidReceiveMessage subscription: drop envelopes that are not for the markdownEditor channel, carry another secret, or arrive after dispose; throw on a malformed JSON-RPC message; deliver to the listener (HubRPC dispatches requests to the host handlers) or buffer until one is set."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:41-48", "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:67-82", "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:25-32"]
    request:
      type: object
      properties:
        channel: {type: string, default: markdownEditor}
        messageSecret: {type: string, default: secret-2}
        message:
          type: object
          properties:
            jsonrpc: {type: string, default: "2.0"}
            id: {type: integer, default: 1}
            method: {type: string, examples: [ready]}
            params: {type: object}
    behavior:
      - if: "state.disposed || input.channel != 'markdownEditor' || input.messageSecret != state.secret"
        then:
          - title: Not this generation's channel and secret, silently ignored
            source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:68-71"
            return: {delivered: false, dropped: true}
      - if: "!has(input.message.jsonrpc) || input.message.jsonrpc != '2.0' || !has(input.message.method)"
        then:
          - title: The authenticated message is not JSON-RPC 2.0
            source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:72-75"
            fail: {code: invalid-markdown-editor-rpc-envelope, status: 0, message: Invalid Markdown editor RPC envelope}
      - if: "!state.listener || size(state.pending) > 0"
        then:
          - title: No listener yet (or earlier messages queued), buffer in order
            source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:76-80"
            set: {state.pending: "= state.pending + [input.message]"}
          - return: {delivered: false, buffered: true}
      - title: HubRPC dispatches the request to the registered markdown.editor.host handler
        source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:24-31"
        call: markdown-editor-provider.handle-host-request
        input: {method: "= input.message.method", params: "= has(input.message.params) ? input.message.params : {}"}
        as: handled
        on_error:
          - title: A notification handler (richLinkSubscriptions, codeBlockEditorDiagnostic) threw; reported at this endpoint since notifications have no response
            source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:26-31"
            when: "input.message.method in ['richLinkSubscriptions', 'codeBlockEditorDiagnostic']"
            set: {state.reported: "= state.reported + ['Handle notification ' + input.message.method]"}
          - if: "input.message.method in ['richLinkSubscriptions', 'codeBlockEditorDiagnostic']"
            then:
              - return: {delivered: true, reported: true}
          - title: A request handler's error becomes the JSON-RPC error response
            source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:25"
            fail: "= error"
      - return: {delivered: true, result: "= vars.handled.value"}
  - component: markdown-editor-rpc-transport
    name: send
    kind: function
    summary: "send(message): once disposed, responses are dropped and anything else throws; otherwise post the {channel, messageSecret, message} envelope and throw when the webview rejects it; a notification's send failure is only reported."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:84-96", "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:16-23"]
    request:
      type: object
      properties:
        kind: {type: string, enum: [request, notification, response], default: request}
        method: {type: string, examples: [update]}
        params: {type: object}
    behavior:
      - if: "state.disposed"
        then:
          - if: "input.kind == 'response'"
            then:
              - title: HubRPC may finish a handler after close, its response is dropped
                source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:86-89"
                return: {sent: false}
          - set: {vars.err: {code: markdown-editor-rpc-transport-is-disposed, status: 0, message: Markdown editor RPC transport is disposed}}
        else:
