  - component: markdown-editor-rename
    name: rename
    kind: function
    summary: "rename: needs the prepared session of the same request id and a non-empty single-line name; re-checks version and epoch, asks vscode.executeDocumentRenameProvider, refuses no changes, applies the workspace edit (refusing a rejected one) and ends the session."
