  # ---------------------------------------------------------------- AuthenticatedWebview + transport
  - component: authenticated-webview
    name: reset
    kind: function
    summary: "AuthenticatedWebview constructor/reset: not ready, close the old connection and connect a new MarkdownEditorRpcTransport under a fresh UUID message secret (re-registering the host handlers); a disposed webview stays closed."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:96-110", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:156-165"]
    request: {type: object, properties: {reason: {type: string, enum: [resolve, reload], default: resolve}}}
    behavior:
      - if: "state.disposed"
        then:
          - fail: {code: cancellation-error, status: 0, message: Canceled}
      - set:
          state.ready: false
          state.generation: "= state.generation + 1"
      - title: "#connect(): a new transport bound to the new secret"
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:158-160"
