            source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:42-45"
            return: {items: [], incomplete: false}
      - set: {vars.before: "= vars.snap.value.text.substring(0, input.offset)"}
      - set: {vars.words: "= vars.before.replace('\\n', ' ').split(' ')"}
      - set: {vars.prefix: "= vars.words[size(vars.words) - 1].lowerAscii()"}
      - title: vscode.executeCompletionItemProvider at the mirrored position; the list is kept for accept
        source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:55-57"
        set: {state.session: "= {'request_id': input.requestId, 'prepared': {'version': vars.snap.value.version, 'edit_epoch': vars.snap.value.edit_epoch, 'items': state.provider_items}}"}
      - title: Keep items whose filter text starts with the typed prefix; snippets are marked unsupported
        source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:58-74"
        set:
          vars.items: "= state.provider_items.transformList(i, it, (has(it.filter_text) ? it.filter_text : it.label).lowerAscii().startsWith(vars.prefix), {'id': string(i), 'label': it.label, 'highlightLength': it.label.lowerAscii().startsWith(vars.prefix) ? size(vars.prefix) : 0, 'unsupported': has(it.snippet) && it.snippet ? 'Snippet editing is not supported in the rich editor yet.' : ''})"
      - return: {items: "= vars.items", incomplete: false}
  - component: markdown-editor-language-features
    name: accept
    kind: function
    summary: "acceptCompletion: needs the prepared session of the same request; refuses unknown ids; re-resolves the list and refuses one that changed or a snippet item; applies the completion edit (refusing a rejected one); triggerSuggest follow-ups become a retrigger, other follow-up commands run; the session ends."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:78-145"]
    request: {type: object, properties: {requestId: {type: integer, default: 1}, id: {type: string, default: "0"}}}
    behavior:
      - if: "state.session == null || state.session.request_id != input.requestId || !has(state.session.prepared)"
        then:
          - title: No prepared completion session for this request
            source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:80-82"
            fail: {code: request-suggestions-again, status: 0, message: Request suggestions again before accepting a completion.}
      - if: "!input.id.matches('^[0-9]+$') || int(input.id) >= size(state.session.prepared.items)"
        then:
          - title: Unknown completion item
            source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:83-87"
            fail: {code: unknown-completion-item, status: 0, message: Unknown completion item.}
      - set: {vars.index: "= int(input.id)"}
      - set: {vars.original: "= state.session.prepared.items[vars.index]"}
      - call: markdown-editor-provider.snapshot
        as: snap
      - title: The provider is asked again (resolving index+1 items) and must still answer the same item
        source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:93-100"
        if: "vars.index >= size(state.provider_items) || state.provider_items[vars.index].label != vars.original.label || state.session.prepared.version != vars.snap.value.version"
        then:
          - set: {state.session: null}
          - fail: {code: completion-list-changed, status: 0, message: The completion list changed. Request suggestions again.}
      - if: "has(vars.original.snippet) && vars.original.snippet"
        then:
          - set: {state.session: null}
          - title: Snippets cannot be inserted by the rich editor
            source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:101-103"
            fail: {code: snippet-editing-not-supported, status: 0, message: Snippet editing is not supported in the rich editor yet.}
      - title: Apply the completion's text edit (plus additional edits) with workspace.applyEdit
        source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:118-122"
        call: vscode-api.workspace-apply-edit
        input: {edit: {edits: [{resource: "= vars.snap.value.uri", text: "= vars.original.label"}]}, extension_id: vscode.markdown-language-features}
        as: applied
      - if: "!vars.applied.value.applied"
        then:
          - set: {state.session: null}
          - fail: {code: workspace-rejected-completion, status: 0, message: The workspace rejected the completion.}
      - set: {vars.retrigger: "= has(vars.original.command) && vars.original.command == 'editor.action.triggerSuggest'"}
      - if: "has(vars.original.command) && !vars.retrigger"
        then:
          - title: Run the completion's follow-up command; a failure only becomes a warning
            source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:129-135"
            call: vscode-api.commands-execute-command
            input: {command: "= vars.original.command", extension_id: vscode.markdown-language-features}
            on_error: continue
      - set: {state.session: null}
      - return: {editEpoch: "= vars.snap.value.edit_epoch", retrigger: "= vars.retrigger"}
  - component: markdown-editor-language-features
    name: cancel
    kind: function
    summary: "cancelCompletions(requestId?): end the session when no id is given or it matches."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:147-149"]
    request: {type: object, properties: {requestId: {type: integer}}}
    behavior:
      - if: "!has(input.requestId) || (state.session != null && state.session.request_id == input.requestId)"
        then:
          - set: {state.session: null}
          - return: {cancelled: true}
      - return: {cancelled: false}
  - component: markdown-editor-language-features
    name: diagnostics
    kind: function
    summary: "getDiagnostics: drain edits and map vscode.languages.getDiagnostics(document) onto the mirrored text (severity index -> error/warning/info/hint) together with the current epoch."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:27-31", "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:203-216"]
    behavior:
      - call: markdown-editor-provider.snapshot
        as: snap
      - if: "size(state.diagnostics) == 0"
        then:
          - return: {editEpoch: "= vars.snap.value.edit_epoch", items: []}
      - title: mapMarkdownDiagnostics
        source: "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:205-215"
        set: {vars.items: "= state.diagnostics.map(d, {'start': d.start, 'endExclusive': d.end_exclusive, 'message': d.message, 'severity': ['error', 'warning', 'info', 'hint'][d.severity]})"}
      - return: {editEpoch: "= vars.snap.value.edit_epoch", items: "= vars.items"}

  # ---------------------------------------------------------------- media paste
  - component: markdown-editor-image-paste
    name: paste
    kind: function
    summary: "pasteImages: cancel the previous paste, drain, require the editor still editable at the same version and epoch, a valid range and media list, a saved document and well-formed media (image/video/audio mime, plain file name, unique id, positive size); ResourcePasteOrDropProvider copies the media into the workspace (refused unless copyIntoWorkspace is mediaFiles); the snippet edit is applied at the range."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:35-106"]
    request:
      type: object
      properties:
        start: {type: integer, default: 0}
        endExclusive: {type: integer, default: 0}
        editEpoch: {type: integer, default: 0}
        images: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, mime: {type: string}, size: {type: integer}}}}
    behavior:
      - title: dispose() cancels a paste still in flight
        source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:36-37"
        set: {state.pending: "= state.pending + 1"}
      - call: markdown-editor-provider.snapshot
        as: snap
      - if: "!vars.snap.value.editable || input.editEpoch != vars.snap.value.edit_epoch"
        then:
          - title: Readonly, inactive or stale, the paste is refused
            source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:42-47"
            fail: {code: editor-changed-paste-again, status: 0, message: The editor changed. Paste the media again.}
      - if: "input.start < 0 || input.start > input.endExclusive || input.endExclusive > size(vars.snap.value.text) || !has(input.images) || size(input.images) == 0"
        then:
          - title: Invalid range or no media
            source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:49-52"
            fail: {code: invalid-media-paste-range, status: 0, message: Invalid media paste range or empty clipboard media list.}
      - if: "vars.snap.value.untitled"
        then:
          - title: Untitled documents have no folder to copy into
            source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:53-55"
            fail: {code: save-markdown-document-before-pasting-media, status: 0, message: Save the Markdown document before pasting media.}
      - title: Each media item must be image/video/audio with a plain name, unique id and positive size
        source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:66-71"
        if: "!input.images.all(m, m.mime.matches('^(image|video|audio)/[A-Za-z0-9_.+-]+$') && m.name != '' && !m.name.matches('[\\\\/:]') && m.name != '.' && m.name != '..' && m.id != '' && m.size > 0) || !input.images.all(m, input.images.filter(o, o.id == m.id).size() == 1)"
        then:
          - fail: {code: invalid-clipboard-media, status: 0, message: Invalid clipboard media.}
      - title: createEditForMediaFiles copies the media into the workspace (bytes read from the webview)
        source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:79-80"
        call: resource-paste-or-drop-provider.create-edit-for-media-files
        input: {document_uri: "= vars.snap.value.uri", files: "= input.images", copy_into_workspace: mediaFiles, materialize_contents: true}
        as: created
      - if: "vars.created.value == null"
        then:
          - title: No copy edit was produced
            source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:83-85"
            fail: {code: media-paste-requires-copy-into-workspace, status: 0, message: Media paste requires markdown.editor.paste.copyIntoWorkspace to be mediaFiles.}
      - title: Apply the snippet replacing the pasted range (the same WorkspaceEdit carries the file creations, which the exthost applyEdit shape here cannot express)
        source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:93-96"
        call: vscode-api.workspace-apply-edit
        input: {edit: {edits: "= [{'resource': vars.snap.value.uri, 'text': vars.created.value.snippet}]"}, extension_id: vscode.markdown-language-features}
        as: applied
      - if: "!vars.applied.value.applied"
        then:
          - title: The workspace rejected the paste
            source: "extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:94-96"
            fail: {code: workspace-rejected-media-paste, status: 0, message: The workspace rejected the media paste.}
      - set: {state.paste_count: "= state.paste_count + 1"}
      - return: {editEpoch: "= vars.snap.value.edit_epoch", files: "= vars.created.value.files.map(f, f.uri)", snippet: "= vars.created.value.snippet"}
  - component: markdown-editor-media-transfer
    name: read-clipboard-media-contents
    kind: function
    summary: "readClipboardMediaContents: read the file in 256 KiB chunks through renderer.readClipboardMedia, checking the editor is current before and after each chunk, and reject a chunk whose base64 length or decoded length is wrong."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:51-76"]
    request: {type: object, required: [file], properties: {file: {type: object, properties: {id: {type: string}, size: {type: integer}}}}}
    behavior:
      - set: {vars.chunks: "= (input.file.size + 262143) / 262144"}
      - foreach: "= lists.range(vars.chunks)"
        as: chunk
        max: 64
        steps:
          - set: {vars.offset: "= vars.chunk * 262144"}
          - set: {vars.length: "= input.file.size - vars.offset < 262144 ? input.file.size - vars.offset : 262144"}
          - title: renderer.readClipboardMedia({id, offset, length})
            source: "extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:60-61"
            call: clipboard-media-store.read
            input: {id: "= input.file.id", offset: "= vars.offset", length: "= vars.length"}
            as: piece
          - if: "vars.piece.value.base64_length != 4 * ((vars.length + 2) / 3) || vars.piece.value.decoded_length != vars.length"
            then:
              - title: Malformed or short chunk
                source: "extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:63-70"
                fail: {code: invalid-clipboard-media-chunk, status: 0, message: Invalid clipboard media chunk.}
      - return: {bytes: "= input.file.size", chunks: "= vars.chunks"}
  - component: clipboard-media-store
    name: read
    kind: function
    summary: "ClipboardMediaStore.read (webview): refuse unknown or expired ids and chunks that are negative, empty, larger than 256 KiB or past the end of the file; answer the chunk base64-encoded."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:26-44"]
    request: {type: object, properties: {id: {type: string}, offset: {type: integer}, length: {type: integer}}}
    behavior:
      - if: "!(input.id in state.files) || input.offset < 0 || input.length <= 0 || input.length > 262144 || input.offset > state.files[input.id].size - input.length"
        then:
          - title: Invalid or expired chunk request
            source: "extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:28-33"
            fail: {code: invalid-or-expired-clipboard-media-chunk-request, status: 0, message: Invalid or expired clipboard media chunk request.}
      - return: {base64_length: "= 4 * ((input.length + 2) / 3)", decoded_length: "= input.length"}

  # ---------------------------------------------------------------- copy files
  - component: resource-paste-or-drop-provider
    name: create-edit-for-media-files
    kind: function
    summary: "createEditForMediaFiles: nothing unless copyIntoWorkspace is mediaFiles and the document is not untitled; each media file gets a new path from NewFilePathGenerator (its contents materialized from the webview when asked) and the snippet links to the copies relative to the document."
    sources: ["extensions/markdown-language-features/src/languageFeatures/copyFiles/dropOrPasteResource.ts:201-260"]
    request:
      type: object
      properties:
        document_uri: {type: string}
        files: {type: array, items: {type: object}}
        copy_into_workspace: {type: string, enum: [mediaFiles, never], default: mediaFiles}
        materialize_contents: {type: boolean, default: false}
    behavior:
      - if: "input.copy_into_workspace != 'mediaFiles' || input.document_uri.startsWith('untitled:')"
        then:
          - title: Not copying media into the workspace for this document
            source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/dropOrPasteResource.ts:208-210"
            return: null
      - set: {vars.files: []}
      - foreach: "= input.files"
        as: file
        max: 50
        steps:
          - call: new-file-path-generator.get-new-file-path
            input: {document_uri: "= input.document_uri", file_name: "= vars.file.name"}
            as: path
          - if: "input.materialize_contents"
            then:
              - call: markdown-editor-media-transfer.read-clipboard-media-contents
                input: {file: "= vars.file"}
          - set: {vars.files: "= vars.files + [{'uri': vars.path.value.uri, 'overwrite': vars.path.value.overwrite, 'name': vars.file.name}]"}
      - set: {vars.doc_dir: "= input.document_uri.substring(0, input.document_uri.lastIndexOf('/') + 1)"}
      - return:
          files: "= vars.files"
          snippet: "= vars.files.map(f, '![' + f.name + '](' + (f.uri.startsWith(vars.doc_dir) ? f.uri.substring(size(vars.doc_dir), size(f.uri)) : f.uri) + ')').join(' ')"
  - component: new-file-path-generator
    name: get-new-file-path
    kind: function
    summary: "getNewFilePath: the desired path is the first markdown.copyFiles.destination entry whose glob matches the document (resolved with resolveCopyDestination) or the document's folder; with overwrite it is used as is, otherwise a path already used gets -1, -2 ... appended to its base name."
    sources: ["extensions/markdown-language-features/src/languageFeatures/copyFiles/newFilePathGenerator.ts:17-57", "extensions/markdown-language-features/src/languageFeatures/copyFiles/newFilePathGenerator.ts:63-75", "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:31-43"]
    request: {type: object, properties: {document_uri: {type: string}, file_name: {type: string}}}
    behavior:
      - set: {vars.doc_path: "= input.document_uri.substring(input.document_uri.indexOf('://') + 3, size(input.document_uri))"}
      - set: {vars.doc_path: "= vars.doc_path.substring(vars.doc_path.indexOf('/'), size(vars.doc_path))"}
      - set: {vars.desired: "= input.document_uri.substring(0, input.document_uri.lastIndexOf('/') + 1) + input.file_name"}
      - foreach: "= config['markdown-copy-files-destination']"
        as: dest
        index: glob
        steps:
          - title: parseGlob - relative globs match anywhere (**/), '/'-globs are anchored to the workspace folders
            source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:31-43"
            set: {vars.pattern: "= vars.glob.startsWith('/') ? '/work/app' + vars.glob : (vars.glob.startsWith('**') ? vars.glob : '**/' + vars.glob)"}
          - set: {vars.regex: "= '^' + vars.pattern.replace('.', '\\\\.').replace('**/', 'GLOBSTAR').replace('*', '[^/]*').replace('GLOBSTAR', '(.*/)?') + '$'"}
          - if: "vars.doc_path.matches(vars.regex)"
            then:
              - title: The first matching glob decides the destination
                source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/newFilePathGenerator.ts:65-71"
                call: markdown-copy-files.resolve-copy-destination
                input: {document_uri: "= input.document_uri", file_name: "= input.file_name", dest: "= vars.dest", workspace_folder: "= input.document_uri.startsWith('file:///work/app/') ? 'file:///work/app' : ''"}
                as: resolved
              - set: {vars.desired: "= vars.resolved.value.uri"}
              - break: true
      - if: "config['markdown-copy-files-overwrite-behavior'] == 'overwrite'"
        then:
          - title: overwrite - use the desired path
            source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/newFilePathGenerator.ts:40-44"
            set: {state.used_paths: "= state.used_paths + [vars.desired]"}
          - return: {uri: "= vars.desired", overwrite: true}
      - set: {vars.dot: "= vars.desired.lastIndexOf('.') > vars.desired.lastIndexOf('/') ? vars.desired.lastIndexOf('.') : size(vars.desired)"}
      - set: {vars.candidates: "= [vars.desired] + lists.range(9).map(i0, i0 + 1).map(i, vars.desired.substring(0, vars.dot) + '-' + string(i) + vars.desired.substring(vars.dot, size(vars.desired)))"}
      - title: nameIncrementally - the first name not used yet (name, name-1, name-2, ...)
        source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/newFilePathGenerator.ts:29-56"
        set: {vars.uri: "= vars.candidates.filter(c, !(c in state.used_paths))[0]"}
      - set: {state.used_paths: "= state.used_paths + [vars.uri]"}
      - return: {uri: "= vars.uri", overwrite: false}
  - component: markdown-copy-files
    name: resolve-copy-destination
    kind: function
    summary: "resolveCopyDestination: an empty destination means ${fileName}; a leading '/' anchors at the document's workspace folder (or its folder outside a workspace); a trailing '/' appends ${fileName}; ${fileName}, ${fileExtName}, ${documentBaseName}, ${documentFileName}, ${documentDirName}, ${documentWorkspaceFolder} are substituted; the result is resolved against the document's folder unless absolute."
    sources: ["extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:47-122"]
    request:
      type: object
      properties:
        document_uri: {type: string, examples: ["test://projects/project/sub/readme.md"]}
        file_name: {type: string, examples: [img.png]}
        dest: {type: string, examples: ["${fileName}"]}
        workspace_folder: {type: string, description: "getWorkspaceFolder(document) or '' outside a workspace"}
    behavior:
      - set: {vars.scheme_end: "= input.document_uri.indexOf('://') + 3"}
      - set: {vars.after_scheme: "= input.document_uri.substring(vars.scheme_end, size(input.document_uri))"}
      - set: {vars.origin: "= input.document_uri.substring(0, vars.scheme_end + vars.after_scheme.indexOf('/'))"}
      - set: {vars.doc_path: "= vars.after_scheme.substring(vars.after_scheme.indexOf('/'), size(vars.after_scheme))"}
      - set: {vars.doc_dir: "= vars.doc_path.substring(0, vars.doc_path.lastIndexOf('/'))"}
      - set: {vars.doc_file: "= vars.doc_path.substring(vars.doc_path.lastIndexOf('/') + 1, size(vars.doc_path))"}
      - set: {vars.ws_path: "= input.workspace_folder == '' ? vars.doc_dir : input.workspace_folder.substring(input.workspace_folder.indexOf('://') + 3, size(input.workspace_folder)).substring(input.workspace_folder.substring(input.workspace_folder.indexOf('://') + 3, size(input.workspace_folder)).indexOf('/'), size(input.workspace_folder.substring(input.workspace_folder.indexOf('://') + 3, size(input.workspace_folder))))"}
      - set: {vars.ws_path: "= vars.ws_path.endsWith('/') ? vars.ws_path.substring(0, size(vars.ws_path) - 1) : vars.ws_path"}
      - set: {vars.dest: "= input.dest.trim() == '' ? '${fileName}' : input.dest.trim()"}
      - if: "vars.dest.startsWith('/')"
        then:
          - title: A leading '/' means the workspace root
            source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:67-70"
            set: {vars.dest: "= '${documentWorkspaceFolder}/' + vars.dest.substring(1, size(vars.dest))"}
      - if: "vars.dest.endsWith('/')"
        then:
          - title: A trailing '/' is a folder, add the file name
            source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:72-75"
            set: {vars.dest: "= vars.dest + '${fileName}'"}
      - title: Substitute the ${...} variables (regex transforms like ${fileName/a/b/} are not modeled)
        source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:83-122"
        set:
          vars.out: "= vars.dest.replace('${fileName}', input.file_name).replace('${fileExtName}', input.file_name.substring(input.file_name.lastIndexOf('.') + 1, size(input.file_name))).replace('${documentBaseName}', vars.doc_file.substring(0, vars.doc_file.lastIndexOf('.'))).replace('${documentFileName}', vars.doc_file).replace('${documentDirName}', vars.doc_dir).replace('${documentWorkspaceFolder}', vars.ws_path)"
      - if: "vars.out.startsWith('/')"
        then:
          - title: Absolute path
            source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:50-53"
            return: {uri: "= vars.origin + vars.out"}
      - set: {vars.rel: "= vars.out.startsWith('./') ? vars.out.substring(2, size(vars.out)) : vars.out"}
      - if: "vars.rel.startsWith('../')"
        then:
          - title: Relative to the document's folder, one level up
            source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:55-57"
            return: {uri: "= vars.origin + vars.doc_dir.substring(0, vars.doc_dir.lastIndexOf('/')) + '/' + vars.rel.substring(3, size(vars.rel))"}
      - title: Relative to the document's folder
        source: "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:55-57"
        return: {uri: "= vars.origin + vars.doc_dir + '/' + vars.rel"}

  # ---------------------------------------------------------------- links
  - component: md-language-client
    name: resolve-link-target
    kind: function
    summary: "MdLanguageClient.resolveLinkTarget: the markdown/resolveLinkTarget request to the Markdown language server, which answers the typed target (file with optional position, folder, external) or undefined; the server's answers are the client's link_targets world data here."
    sources: ["extensions/markdown-language-features/src/client/client.ts:40-42", "extensions/markdown-language-features/src/client/protocol.ts:12-15", "extensions/markdown-language-features/src/client/protocol.ts:39"]
    request: {type: object, properties: {link_text: {type: string}, uri: {type: string}}}
    behavior:
      - set: {vars.key: "= input.link_text.startsWith('#') ? input.uri + input.link_text : input.link_text"}
      - if: "!(vars.key in state.link_targets)"
        then:
          - title: The server finds no target
            source: "extensions/markdown-language-features/src/client/protocol.ts:39"
            return: null
      - return: "= state.link_targets[vars.key]"
  - component: md-link-opener
    name: resolve-document-link
    kind: function
    summary: "resolveDocumentLink: a URI-like absolute link (not a Windows drive path) with a non-file scheme is external without asking the server; everything else is resolved by the Markdown language server relative to the source document."
    sources: ["extensions/markdown-language-features/src/util/openDocumentLink.ts:33-39", "extensions/markdown-language-features/src/util/openDocumentLink.ts:161-165"]
