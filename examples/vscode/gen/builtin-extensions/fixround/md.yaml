scenarios:
  # ---------------- Markdown editor: resolve, ready, edits, queue recovery
  - id: builtin-extensions-markdown-editor-resolve-then-state
    fixtures: [one-window-folder]
    steps:
      - {flow: markdown-editor-resolve, as: open}
      - {flow: markdown-editor-state, as: read}
    expect:
      - "steps.open.result.value.resolved"
      - "steps.read.result.value.open && steps.read.result.value.readonly && !steps.read.result.value.ready"
      - "steps.read.result.value.local_resource_roots.exists(r, r == 'file:///work/app')"
      - "state['markdown-editor-rpc-transport@eh1'].secret == 'secret-2'"
  - id: builtin-extensions-markdown-editor-untrusted-cancel
    fixtures: [one-window-folder]
    steps:
      - {flow: markdown-editor-resolve, as: open, input: {workspace_trusted: false}}
      - {flow: markdown-editor-state, as: read}
    expect:
      - "!steps.open.result.value.resolved"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'vscode-api.window-show-warning-message')"
      - "!steps.read.result.value.open"
  - id: builtin-extensions-markdown-editor-untrusted-open-anyway
    fixtures: [one-window-folder]
    choices: {markdown-editor-provider.resolve-custom-text-editor.trust_prompt: open_anyway}
    steps:
      - {flow: markdown-editor-resolve, as: open, input: {workspace_trusted: false}}
      - {flow: markdown-editor-state, as: read}
    expect:
      - "steps.open.result.value.resolved"
      - "steps.read.result.value.local_resource_roots == ['file:///vscode/extensions/markdown-language-features/markdown-editor-out']"
      - "state['markdown-editor-provider@eh1'].editor.open"
  - id: builtin-extensions-markdown-editor-ready-stale-content
    fixtures: [one-window-folder]
    steps:
      - {flow: markdown-editor-resolve}
      - {flow: markdown-editor-webview-rpc, as: ready, input: {message: {method: ready, params: {documentVersion: 1, editEpoch: 3}}}}
      - {flow: markdown-editor-state, as: read}
    expect:
      - "steps.ready.result.value.delivered"
      - "steps.read.result.value.ready"
      - "state['recovering-task-queue@eh1'].epoch == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'markdown-editor-rpc-transport.send' && e.input.method == 'update' && e.input.params.editEpoch == 1)"
  - id: builtin-extensions-markdown-editor-edit-applies
    fixtures: [one-window-folder]
    steps:
      - {flow: markdown-editor-resolve}
      - {flow: markdown-editor-webview-rpc, as: edit, input: {message: {method: edit, params: {start: 2, endExclusive: 5, text: Demo, editEpoch: 0}}}}
      - {flow: markdown-editor-state, as: read}
