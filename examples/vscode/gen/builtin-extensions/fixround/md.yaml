  - component: git-link-presentation-resolver
    name: resolve
    kind: function
    summary: "resolve: only commit targets (commit:<sha> or http(s)://host/owner/repo[/-]/commit/<sha>, sha 4-64 hex) are accepted; the presentation starts loading with the short sha and is filled from the cached commit lookup in the open repositories (matching the link's remote when given), or becomes a lookup failure."
    sources: ["extensions/markdown-language-features/src/preview/linkPresentation/gitLinkPresentationResolver.ts:29-46", "extensions/markdown-language-features/src/preview/linkPresentation/gitLinkPresentationResolver.ts:84-133", "extensions/markdown-language-features/src/preview/linkPresentation/gitLinkPresentationResolver.ts:163-201", "extensions/markdown-language-features/src/preview/linkPresentation/linkPresentationResolver.ts:113-127"]
