  - component: git-link-presentation-resolver
    name: parse-target
    kind: function
    summary: "parseGitCommitTarget: commit:<sha>[?path=] or an http(s) URL whose path has .../commit/<sha> after at least one repository segment ('-' before 'commit' skipped); the repository is host/path lowercased host, .git stripped; anything else is not a commit link."
    sources: ["extensions/markdown-language-features/src/preview/linkPresentation/gitLinkPresentationResolver.ts:163-201", "extensions/markdown-language-features/src/preview/linkPresentation/gitLinkPresentationResolver.ts:229-231"]
