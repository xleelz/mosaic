  # ---------------- ipynb
  - id: builtin-extensions-ipynb-deserialize
    fixtures: [one-window-folder]
    flow: ipynb-deserialize-notebook
    input:
      json:
        nbformat: 4
        nbformat_minor: 5
        metadata: {kernelspec: {name: ir, display_name: R, language: R}}
        cells:
          - {cell_type: markdown, source: "# Title", metadata: {}}
          - {cell_type: raw, source: "raw text", metadata: {}}
          - {cell_type: code, source: "print(1)", execution_count: 3, metadata: {vscode: {languageId: python}}, outputs: [{output_type: stream, name: stderr, text: "warn"}, {output_type: display_data, data: {text/plain: "x", image/png: "AA", text/html: "<b>x</b>"}, metadata: {}}, {output_type: error, ename: E, evalue: v, traceback: []}]}
          - {cell_type: code, source: "x", execution_count: null, metadata: {}, outputs: []}
    expect:
      - "result.value.preferred_language == 'r'"
      - "result.value.cells.map(c, c.kind) == ['markup', 'code', 'code', 'code']"
      - "result.value.cells[1].language_id == 'raw'"
      - "result.value.cells[2].language_id == 'python' && result.value.cells[2].execution_order == 3"
      - "result.value.cells[2].outputs[0].items == ['application/vnd.code.notebook.stderr']"
      - "result.value.cells[2].outputs[1].items == ['text/html', 'image/png', 'text/plain']"
      - "result.value.cells[2].outputs[2].items == ['application/vnd.code.notebook.error']"
      - "result.value.cells[3].language_id == 'r' && result.value.cells[3].execution_order == 0"
  - id: builtin-extensions-ipynb-deserialize-empty-and-old
    fixtures: [one-window-folder]
    steps:
      - {flow: ipynb-deserialize-notebook, as: empty, input: {json: {}}}
      - {flow: ipynb-deserialize-notebook, as: old, input: {json: {nbformat: 3, cells: []}}}
    expect:
      - "steps.empty.result.value.cells == [] && steps.empty.result.value.metadata.metadata.language_info.name == 'python'"
      - "steps.old.result.error.code == 'only-jupyter-notebooks-version-4-supported'"
  - id: builtin-extensions-ipynb-serialize
    fixtures: [one-window-folder]
    flow: ipynb-serialize-notebook
    input:
      data:
        metadata: {nbformat: 4, nbformat_minor: 5, metadata: {language_info: {name: python}}}
        cells:
          - {kind: code, language_id: python, value: "print(1)", metadata: {execution_count: 1, metadata: {vscode: {languageId: python}}}, outputs: [{items: [{mime: application/vnd.code.notebook.stdout}]}]}
          - {kind: code, language_id: sql, value: "select 1", metadata: {metadata: {}}, outputs: [{items: [{mime: application/vnd.code.notebook.error}]}, {items: [{mime: text/html}]}]}
          - {kind: markup, language_id: markdown, value: "# T", metadata: {execution_count: 4, metadata: {}}}
          - {kind: code, language_id: raw, value: "r", metadata: {metadata: {}}}
    expect:
      - "result.value.notebook.cells.map(c, c.cell_type) == ['code', 'code', 'markdown', 'raw']"
      - "!has(result.value.notebook.cells[0].metadata.vscode) && result.value.notebook.cells[0].execution_count == 1"
      - "result.value.notebook.cells[0].outputs[0].output_type == 'stream'"
      - "result.value.notebook.cells[1].metadata.vscode.languageId == 'sql' && result.value.notebook.cells[1].execution_count == null"
      - "result.value.notebook.cells[1].outputs.map(o, o.output_type) == ['error', 'display_data']"
      - "!has(result.value.notebook.cells[2].execution_count) && !has(result.value.notebook.cells[2].outputs)"
      - "result.value.trailing_newline"
  - id: builtin-extensions-ipynb-clear-outputs-then-save
    fixtures: [one-window-folder]
    steps:
      - {flow: ipynb-notebook-document-change, as: clear, input: {cell_changes: [{index: 1, outputs: []}]}}
      - {flow: ipynb-notebook-document-change, as: followup, input: {cell_changes: [{index: 1}]}}
      - {flow: ipynb-notebook-will-save, as: save}
    expect:
      - "steps.clear.result.value.updates == 1 && steps.followup.result.value.updates == 0"
      - "state['notebook-model-store-sync@eh1'].pending_cell_updates == ['file:///work/app/analysis.ipynb#1']"
      - "steps.save.result.value.notebook.cells[1].execution_count == null"
      - "steps.save.result.value.notebook.cells[0].execution_count == 1"
  - id: builtin-extensions-ipynb-execution-and-language-sync
    fixtures: [one-window-folder]
    steps:
      - {flow: ipynb-notebook-document-change, as: ran, input: {cell_changes: [{index: 0, execution_summary: {execution_order: 7, success: true}}]}}
      - {flow: ipynb-notebook-document-change, as: lang, input: {cell_changes: [{index: 1, document_language_id: sql}]}}
      - {flow: ipynb-notebook-document-change, as: added, input: {content_changes: [{added_cells: [{index: 3, kind: code}]}]}}
      - {flow: ipynb-notebook-will-save, as: save}
    expect:
      - "steps.save.result.value.notebook.cells[0].execution_count == 7"
      - "steps.save.result.value.notebook.cells[1].metadata.vscode.languageId == 'sql'"
      - "size(steps.save.result.value.notebook.cells) == 4 && steps.save.result.value.notebook.cells[3].cell_type == 'code'"
      - "has(state['notebook-model-store-sync@eh1'].notebooks['file:///work/app/analysis.ipynb'].cells[3].metadata.id)"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'vscode-api.workspace-apply-edit').size() == 3"
  - id: builtin-extensions-ipynb-change-ignored
    fixtures: [one-window-folder]
    steps:
      - {flow: ipynb-notebook-document-change, as: other, input: {notebook: "file:///work/app/other.ipynb", cell_changes: [{index: 0, outputs: []}]}}
      - {flow: ipynb-notebook-document-change, as: markup, input: {cell_changes: [{index: 2, outputs: []}]}}
      - {flow: ipynb-notebook-will-save, as: save}
    expect:
      - "steps.other.result.value.updates == 0 && steps.markup.result.value.updates == 0"
      - "steps.save.result.value.notebook.cells[1].execution_count == 2"
  # ---------------- notebook renderers
  - id: builtin-extensions-notebook-renderer-mimes
    fixtures: [one-window-folder]
    steps:
      - {flow: notebook-renderer-render-output, as: html_untrusted, input: {id: o1, mime: text/html, text: "<b>x</b>", workspace_trusted: false}}
      - {flow: notebook-renderer-render-output, as: html, input: {id: o1, mime: text/html, text: "<b>x</b>"}}
      - {flow: notebook-renderer-render-output, as: png, input: {id: o2, mime: image/png, text: ""}}
      - {flow: notebook-renderer-render-output, as: stderr, input: {id: o3, mime: application/vnd.code.notebook.stderr, text: "see /work/app/main.py for details"}}
      - {flow: notebook-renderer-render-output, as: csv, input: {id: o4, mime: text/csv, text: "a,b"}}
      - {flow: notebook-renderer-render-output, as: json, input: {id: o5, mime: application/json, text: "{}"}}
      - {flow: notebook-renderer-dispose-output, as: one, input: {id: o2}}
      - {flow: notebook-renderer-dispose-output, as: all}
    expect:
      - "steps.html_untrusted.result.value.rendered == 'none'"
      - "steps.html.result.value.rendered == 'html' && steps.png.result.value.rendered == 'image'"
      - "steps.stderr.result.value.rendered == 'stderr'"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'notebook-link-detector.linkify' && 'path' in e.output.kinds)"
      - "steps.csv.result.value.rendered == 'text' && steps.json.result.value.rendered == 'none'"
      - "steps.one.result.value.disposed == 1 && steps.all.result.value.disposed == 3"
      - "state['builtin-notebook-renderer@eh1'].disposables == {}"
  - id: builtin-extensions-notebook-renderer-error-traceback
    fixtures: [one-window-folder]
    steps:
      - {flow: notebook-renderer-render-output, as: trusted, input: {id: e1, mime: application/vnd.code.notebook.error, text: "{\"name\":\"ZeroDivisionError\",\"message\":\"division by zero\",\"stack\":\"Cell In[3], line 2\\n----> 2 1/0\"}"}}
      - {flow: notebook-renderer-render-output, as: untrusted, input: {id: e2, mime: application/vnd.code.notebook.error, workspace_trusted: false, text: "{\"name\":\"ZeroDivisionError\",\"message\":\"division by zero\",\"stack\":\"Cell In[3], line 2\\n----> 2 1/0\"}"}}
      - {flow: notebook-renderer-render-output, as: plain, input: {id: e3, mime: application/vnd.code.notebook.error, text: "{\"name\":\"Error\",\"message\":\"boom\",\"stack\":\"Error: boom\\n    at foo\"}"}}
      - {flow: notebook-renderer-dispose-output, as: all}
    expect:
      - "steps.trusted.result.value.error.linkified && steps.trusted.result.value.error.error_location != ''"
      - "!steps.untrusted.result.value.error.linkified"
      - "!steps.plain.result.value.error.linkified"
      - "steps.all.result.value.disposed == 3"
      - "state['builtin-notebook-renderer@eh1'].disposables == {}"
  - id: builtin-extensions-markdown-editor-history-chord
    fixtures: [one-window-folder]
    steps:
      - {flow: markdown-editor-resolve, as: active}
      - {flow: markdown-editor-webview-rpc, as: undo, input: {message: {method: history, params: {command: undo}}}}
      - {flow: markdown-editor-resolve, as: background, input: {panel_active: false}}
      - {flow: markdown-editor-webview-rpc, as: dropped, input: {messageSecret: secret-3, message: {method: history, params: {command: redo}}}}
      - {flow: markdown-editor-webview-rpc, as: sub, input: {messageSecret: secret-3, message: {method: richLinkSubscriptions, params: {subscribe: [{subscriptionId: f1, href: "./src/main.ts#L10"}], unsubscribe: []}}}}
    expect:
      - "steps.undo.result.value.result.ran && !steps.dropped.result.value.result.ran"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'vscode-api.commands-execute-command' && e.input.command == 'undo')"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'vscode-api.commands-execute-command' && e.input.command == 'redo')"
      - "state['markdown-link-presentation-service@eh1'].entries['file:///work/app/src/main.ts'].kind == 'file'"
