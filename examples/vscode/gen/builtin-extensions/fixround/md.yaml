        preserve_focus: {type: boolean, default: false}
    behavior:
      - if: "state.disposed"
        then:
          - title: resolveCustomTextEditorNavigation finds no navigation for the panel
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:321-324"
            fail: {code: cancellation-error, status: 0, message: Canceled}
