  # ---------------------------------------------------------------- code block editors (webview)
  - component: lazy-code-block-editor-factory
    name: create
    kind: function
    summary: "create(): nothing after dispose; delegate once the real factory is loaded; otherwise start loading it (once) when providers exist and return no editor yet."
    sources: ["extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:28-41"]
    request: {type: object, properties: {language: {type: string, default: mermaid}}}
    behavior:
      - if: "state.disposed"
        then:
          - return: {editor: false}
      - if: "state.loaded"
        then:
          - title: The loaded factory creates the embedded editor
            source: "extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:32-34"
            return: {editor: true}
      - if: "size(state.providers) > 0 && !state.load_started"
        then:
          - title: First block with providers, start loading the factory (once)
            source: "extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:36-39"
            set: {state.load_started: true}
          - emit: lazy-code-block-editor-factory.load-factory
      - return: {editor: false}
  - component: lazy-code-block-editor-factory
    name: load-factory
    kind: function
    summary: "#loadFactory: await the module; dropped if disposed meanwhile; build the factory with the current providers and fire onDidChange so blocks are re-created; a load failure is reported unless disposed."
    sources: ["extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:64-77"]
    behavior:
      - if: "state.load_fails"
        then:
          - when: "!state.disposed"
            title: Load failed, onError reports it
            source: "extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:72-75"
            set: {state.errors: "= state.errors + ['load-failed']"}
          - return: {loaded: false}
      - if: "state.disposed"
        then:
          - return: {loaded: false}
      - title: createFactory({...options, providers}); onDidChange
        source: "extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:70-71"
        set: {state.loaded: true}
      - return: {loaded: true}
  - component: lazy-code-block-editor-factory
    name: update-providers
    kind: function
    summary: "updateProviders: ignored after dispose; otherwise remember them and pass them to the loaded factory, or fire onDidChange so blocks retry create()."
    sources: ["extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:43-53"]
    request: {type: object, properties: {providers: {type: array, items: {type: string}, default: [mermaid-editor]}}}
    behavior:
      - if: "state.disposed"
        then:
          - return: {updated: false}
      - set: {state.providers: "= input.providers"}
      - if: "!state.loaded"
        then:
          - title: Not loaded yet, onDidChange lets blocks call create() again
            source: "extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:50-52"
            call: lazy-code-block-editor-factory.create
            input: {language: mermaid}
      - return: {updated: true}
  - component: lazy-code-block-editor-factory
    name: dispose
    kind: function
    summary: "dispose(): once; disposes the loaded factory; later creates return nothing and a pending load is dropped."
    sources: ["extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:55-62"]
    behavior:
      - if: "state.disposed"
        then:
          - return: {disposed: false}
      - set:
          state.disposed: true
          state.loaded: false
      - return: {disposed: true}

  # ---------------------------------------------------------------- ipynb serializer
  - component: ipynb-notebook-serializer
    name: deserialize-notebook
    kind: function
    summary: "deserializeNotebook: empty content is an empty notebook; nbformat < 4 is refused; the preferred cell language is language_info.name, else kernelspec.language, else python; notebooks without kernel or language metadata get language_info set to it; raw cells become 'raw' code cells, markdown cells markup, code cells keep their vscode.languageId (else the preferred language), an execution summary when execution_count > 0, and outputs (stream -> stdout/stderr items, error -> error item, display data -> items sorted by display order)."
    sources: ["extensions/ipynb/src/notebookSerializer.ts:24-77", "extensions/ipynb/src/deserializers.ts:20-33", "extensions/ipynb/src/deserializers.ts:237-373"]
    request:
      type: object
      properties:
        json: {type: object, description: "the parsed .ipynb content ({} for empty or whitespace-only files)", default: {}}
    behavior:
      - set: {vars.nb: "= input.json"}
      - if: "has(vars.nb.nbformat) && vars.nb.nbformat < 4"
        then:
          - title: Only nbformat 4+ is supported
            source: "extensions/ipynb/src/notebookSerializer.ts:49-51"
            fail: {code: only-jupyter-notebooks-version-4-supported, status: 0, message: Only Jupyter notebooks version 4+ are supported}
      - set: {vars.meta: "= has(vars.nb.metadata) ? vars.nb.metadata : {}"}
      - title: getPreferredLanguage - language_info.name, kernelspec.language, else python
        source: "extensions/ipynb/src/deserializers.ts:20-33"
        set: {vars.lang: "= has(vars.meta.language_info) && has(vars.meta.language_info.name) && vars.meta.language_info.name != '' ? vars.meta.language_info.name : (has(vars.meta.kernelspec) && has(vars.meta.kernelspec.language) ? vars.meta.kernelspec.language : 'python')"}
      - set: {vars.lang: "= vars.lang == 'c#' ? 'csharp' : (vars.lang == 'f#' ? 'fsharp' : (vars.lang == 'q#' ? 'qsharp' : vars.lang.lowerAscii()))"}
      - if: "!has(vars.meta.kernelspec) && !has(vars.meta.language_info)"
        then:
          - title: No kernel or language metadata, default language_info to the preferred language
            source: "extensions/ipynb/src/notebookSerializer.ts:63-67"
            set: {vars.meta: "= merge(vars.meta, {'language_info': {'name': vars.lang}})"}
      - set: {vars.cells_in: "= has(vars.nb.cells) ? vars.nb.cells : []"}
      - set: {vars.order: ['application/vnd.*', 'application/vdom.*', 'application/geo+json', 'application/x-nteract-model-debug+json', 'text/html', 'application/javascript', 'image/gif', 'text/latex', 'text/markdown', 'image/png', 'image/svg+xml', 'image/jpeg', 'application/json', 'text/plain']}
      - set: {vars.cells: []}
      - foreach: "= vars.cells_in"
        as: cell
        max: 500
        steps:
          - if: "vars.cell.cell_type == 'raw'"
            then:
              - title: Raw cells become code cells of language 'raw'
                source: "extensions/ipynb/src/deserializers.ts:298-303"
                set: {vars.cells: "= vars.cells + [{'kind': 'code', 'language_id': 'raw', 'outputs': [], 'metadata': has(vars.cell.metadata) ? vars.cell.metadata : {}}]"}
              - continue: true
          - if: "vars.cell.cell_type == 'markdown'"
            then:
              - title: Markdown cells become markup cells
                source: "extensions/ipynb/src/deserializers.ts:304-313"
                set: {vars.cells: "= vars.cells + [{'kind': 'markup', 'language_id': 'markdown', 'outputs': [], 'metadata': has(vars.cell.metadata) ? vars.cell.metadata : {}}]"}
              - continue: true
          - if: "vars.cell.cell_type != 'code'"
            then:
              - title: Unknown cell types are dropped
                source: "extensions/ipynb/src/deserializers.ts:338-352"
                continue: true
          - set: {vars.outs: "= has(vars.cell.outputs) ? vars.cell.outputs : []"}
          - title: "Outputs: stream -> stdout/stderr, error -> error item, rich data -> items sorted by display order (unknown mimes last)"
            source: "extensions/ipynb/src/deserializers.ts:264-296"
            set:
              vars.mapped: "= vars.outs.map(o, o.output_type == 'stream' ? {'items': [has(o.name) && o.name == 'stderr' ? 'application/vnd.code.notebook.stderr' : 'application/vnd.code.notebook.stdout']} : (o.output_type == 'error' ? {'items': ['application/vnd.code.notebook.error']} : {'items': (has(o.data) ? o.data : {}).map(m, m).map(m, [vars.order.exists(p, p.endsWith('.*') ? m.startsWith(p.substring(0, size(p) - 2)) : m.startsWith(p)) ? lists.range(size(vars.order)).filter(i, vars.order[i].endsWith('.*') ? m.startsWith(vars.order[i].substring(0, size(vars.order[i]) - 2)) : m.startsWith(vars.order[i]))[0] : 100, m]).sortBy(e, e[0]).map(e, e[1])}))"
          - title: The cell keeps its vscode.languageId, else the preferred language; execution_count > 0 becomes the execution summary
            source: "extensions/ipynb/src/deserializers.ts:314-333"
            set:
              vars.cells: "= vars.cells + [{'kind': 'code', 'language_id': has(vars.cell.metadata) && has(vars.cell.metadata.vscode) && has(vars.cell.metadata.vscode.languageId) ? vars.cell.metadata.vscode.languageId : vars.lang, 'outputs': vars.mapped, 'execution_order': has(vars.cell.execution_count) && type(vars.cell.execution_count) == int && vars.cell.execution_count > 0 ? vars.cell.execution_count : 0, 'metadata': merge(has(vars.cell.metadata) ? vars.cell.metadata : {}, {'execution_count': has(vars.cell.execution_count) ? vars.cell.execution_count : null})}]"
      - title: NotebookData with the notebook metadata (cells removed) and indentAmount
        source: "extensions/ipynb/src/deserializers.ts:357-373"
        return:
          cells: "= vars.cells"
          metadata: {nbformat: "= has(vars.nb.nbformat) ? vars.nb.nbformat : 4", nbformat_minor: "= has(vars.nb.nbformat_minor) ? vars.nb.nbformat_minor : 2", metadata: "= vars.meta", indentAmount: " "}
          preferred_language: "= vars.lang"
  - component: ipynb-notebook-serializer
    name: serialize-notebook
    kind: function
    summary: "serializeNotebook (empty after dispose) -> serializeNotebookToString: the preferred language is language_info.name, else the first code cell's; markup cells become markdown cells, 'raw' cells raw cells, code cells carry execution_count from the cell metadata (null when absent), vscode.languageId only when their language differs, outputs as stream/error/display_data; non-code cells lose outputs and execution_count; keys are sorted and a trailing newline is added."
    sources: ["extensions/ipynb/src/notebookSerializer.ts:79-86", "extensions/ipynb/src/serializers.ts:13-32", "extensions/ipynb/src/serializers.ts:87-114", "extensions/ipynb/src/serializers.ts:392-492"]
    request:
      type: object
      properties:
        data:
          type: object
          properties:
            metadata: {type: object}
            cells: {type: array, items: {type: object}}
    behavior:
      - if: "state.disposed"
        then:
          - title: A disposed serializer writes nothing
            source: "extensions/ipynb/src/notebookSerializer.ts:80-82"
            return: {bytes: 0, notebook: null}
      - set: {vars.meta: "= has(input.data.metadata) ? input.data.metadata : {}"}
      - set: {vars.inner: "= has(vars.meta.metadata) ? vars.meta.metadata : {}"}
      - set: {vars.code_langs: "= input.data.cells.filter(c, c.kind == 'code').map(c, c.language_id)"}
      - title: Preferred language - language_info.name, else the first code cell's language
        source: "extensions/ipynb/src/serializers.ts:463-465"
        set: {vars.lang: "= has(vars.inner.language_info) && has(vars.inner.language_info.name) ? vars.inner.language_info.name : (size(vars.code_langs) > 0 ? vars.code_langs[0] : '')"}
      - set: {vars.cells: []}
      - foreach: "= input.data.cells"
        as: cell
        max: 500
        steps:
          - set: {vars.md: "= has(vars.cell.metadata) ? vars.cell.metadata : {}"}
          - if: "vars.cell.kind == 'markup'"
            then:
              - title: Markdown cell - no outputs, no execution_count
                source: "extensions/ipynb/src/serializers.ts:376-390"
                set: {vars.cells: "= vars.cells + [{'cell_type': 'markdown', 'metadata': has(vars.md.metadata) ? vars.md.metadata : {}}]"}
              - continue: true
          - if: "vars.cell.language_id == 'raw'"
            then:
              - title: Raw cell
                source: "extensions/ipynb/src/serializers.ts:116-135"
                set: {vars.cells: "= vars.cells + [{'cell_type': 'raw', 'metadata': has(vars.md.metadata) ? vars.md.metadata : {}}]"}
              - continue: true
          - set: {vars.inner_md: "= has(vars.md.metadata) ? vars.md.metadata : {}"}
          - title: vscode.languageId is kept only when the cell language differs from the preferred one
            source: "extensions/ipynb/src/serializers.ts:89-95"
            set: {vars.inner_md: "= vars.cell.language_id != vars.lang ? merge(vars.inner_md, {'vscode': {'languageId': vars.cell.language_id}}) : omit(vars.inner_md, 'vscode')"}
          - title: execution_count comes from the metadata, never from the execution summary
            source: "extensions/ipynb/src/serializers.ts:97-112"
            set:
              vars.cells: "= vars.cells + [{'cell_type': 'code', 'execution_count': has(vars.md.execution_count) ? vars.md.execution_count : null, 'metadata': vars.inner_md, 'outputs': (has(vars.cell.outputs) ? vars.cell.outputs : []).map(o, o.items.exists(i, i.mime == 'application/vnd.code.notebook.stdout' || i.mime == 'application/vnd.code.notebook.stderr') ? {'output_type': 'stream', 'name': o.items.exists(i, i.mime == 'application/vnd.code.notebook.stderr') ? 'stderr' : 'stdout'} : (o.items.exists(i, i.mime == 'application/vnd.code.notebook.error') ? {'output_type': 'error'} : {'output_type': 'display_data'}))}]"
      - title: getNotebookMetadata defaults nbformat 4 / minor 5; JSON keys sorted, trailing newline
        source: "extensions/ipynb/src/serializers.ts:477-492"
        return:
          notebook: {nbformat: "= has(vars.meta.nbformat) ? vars.meta.nbformat : 4", nbformat_minor: "= has(vars.meta.nbformat_minor) ? vars.meta.nbformat_minor : 5", metadata: "= vars.inner", cells: "= vars.cells"}
          trailing_newline: true

  # ---------------------------------------------------------------- notebook model store sync
  - component: notebook-model-store-sync
    name: on-did-change-notebook-document
    kind: event
    summary: "onDidChangeNotebookCells (workspace.onDidChangeNotebookDocument, jupyter-notebook only, when the notebook has a preferred language): for code cells - an execution sets execution_count; outputs cleared without new metadata null it (and the expected follow-up event is tracked); a changed cell language sets or removes metadata.vscode.languageId; added cells in nbformat >= 4.5 get a new 8-character id. Updates go out as one WorkspaceEdit tracked until applied."
    sources: ["extensions/ipynb/src/notebookModelStoreSync.ts:26-29", "extensions/ipynb/src/notebookModelStoreSync.ts:106-124", "extensions/ipynb/src/notebookModelStoreSync.ts:127-239"]
    request:
      type: object
      properties:
        notebook: {type: string, default: "file:///work/app/analysis.ipynb"}
        cell_changes: {type: array, default: [], items: {type: object, properties: {index: {type: integer}, execution_summary: {type: object}, metadata: {type: object}, outputs: {type: array}, document_language_id: {type: string}}}}
        content_changes: {type: array, default: [], items: {type: object, properties: {added_cells: {type: array, items: {type: object}}}}}
    behavior:
      - if: "!(input.notebook in state.notebooks) || state.notebooks[input.notebook].notebook_type != 'jupyter-notebook'"
        then:
          - title: Not a jupyter-notebook, ignored
            source: "extensions/ipynb/src/notebookModelStoreSync.ts:128-130"
            return: {updates: 0}
      - set: {vars.nb: "= state.notebooks[input.notebook]"}
      - set: {vars.lang: "= has(vars.nb.metadata.metadata.language_info) && has(vars.nb.metadata.metadata.language_info.name) ? vars.nb.metadata.metadata.language_info.name : ''"}
      - set: {vars.id_required: "= vars.nb.metadata.nbformat >= 5 || (vars.nb.metadata.nbformat == 4 && vars.nb.metadata.nbformat_minor >= 5)"}
      - set: {vars.updates: {}}
      - set: {vars.langs: "= input.cell_changes.filter(c, has(c.document_language_id)).transformMapEntry(i, c, {string(c.index): c.document_language_id})"}
      - foreach: "= input.cell_changes"
        as: ch
        steps:
          - set: {vars.cell: "= vars.nb.cells[vars.ch.index]"}
          - if: "vars.lang == '' || vars.cell.kind != 'code'"
            then:
              - title: Only code cells of notebooks with a preferred language
                source: "extensions/ipynb/src/notebookModelStoreSync.ts:142-144"
                continue: true
          - set: {vars.cur: "= has(vars.ch.metadata) ? vars.ch.metadata : merge({'execution_count': null}, vars.cell.metadata)"}
          - set: {vars.md: "= vars.cur"}
          - set: {vars.has_count: "= has(vars.cur.execution_count) && vars.cur.execution_count != null && vars.cur.execution_count != 0"}
          - set: {vars.summary_empty: "= !has(vars.ch.execution_summary) || (!has(vars.ch.execution_summary.execution_order) && !has(vars.ch.execution_summary.success) && !has(vars.ch.execution_summary.timing))"}
          - set: {vars.key: "= input.notebook + '#' + string(vars.ch.index)"}
          - if: "has(vars.ch.execution_summary) && has(vars.ch.execution_summary.execution_order) && has(vars.ch.execution_summary.success) && (!has(vars.cur.execution_count) || vars.cur.execution_count != vars.ch.execution_summary.execution_order)"
            then:
              - title: The cell ran, execution_count follows the execution order
                source: "extensions/ipynb/src/notebookModelStoreSync.ts:150-152"
                set: {vars.md: "= merge(vars.md, {'execution_count': vars.ch.execution_summary.execution_order})"}
              - set: {vars.updates: "= merge(vars.updates, {string(vars.ch.index): vars.md})"}
            else:
              - if: "!has(vars.ch.execution_summary) && !has(vars.ch.metadata) && has(vars.ch.outputs) && size(vars.ch.outputs) == 0 && vars.has_count"
                then:
                  - title: Outputs cleared (Clear All) - null execution_count and expect the follow-up event
                    source: "extensions/ipynb/src/notebookModelStoreSync.ts:153-161"
                    set: {vars.md: "= merge(vars.md, {'execution_count': null})"}
                  - set:
                      state.pending_cell_updates: "= state.pending_cell_updates + [vars.key]"
                      vars.updates: "= merge(vars.updates, {string(vars.ch.index): vars.md})"
                else:
                  - if: "vars.summary_empty && !has(vars.ch.metadata) && !has(vars.ch.outputs) && vars.has_count"
                    then:
                      - title: The follow-up of a clear (or a cell without outputs being cleared) - null execution_count
                        source: "extensions/ipynb/src/notebookModelStoreSync.ts:162-175"
                        set: {vars.md: "= merge(vars.md, {'execution_count': null})"}
                      - set:
                          state.pending_cell_updates: "= state.pending_cell_updates.filter(k, k != vars.key)"
                          vars.updates: "= merge(vars.updates, {string(vars.ch.index): vars.md})"
          - set: {vars.in_md: "= has(vars.cur.metadata) && has(vars.cur.metadata.vscode) && has(vars.cur.metadata.vscode.languageId) ? vars.cur.metadata.vscode.languageId : ''"}
          - if: "has(vars.ch.document_language_id) && vars.ch.document_language_id != vars.lang && vars.ch.document_language_id != vars.in_md"
            then:
              - title: The cell language differs from the notebook's - record metadata.vscode.languageId
                source: "extensions/ipynb/src/notebookModelStoreSync.ts:177-179"
                set: {vars.md: "= merge(vars.md, {'metadata': merge(has(vars.md.metadata) ? vars.md.metadata : {}, {'vscode': {'languageId': vars.ch.document_language_id}})})"}
              - set: {vars.updates: "= merge(vars.updates, {string(vars.ch.index): vars.md})"}
            else:
              - if: "has(vars.ch.document_language_id) && vars.ch.document_language_id == vars.lang && vars.in_md != ''"
                then:
                  - title: Back to the notebook language - drop metadata.vscode
                    source: "extensions/ipynb/src/notebookModelStoreSync.ts:180-186"
                    set: {vars.md: "= merge(omit(vars.md, 'metadata'), {'metadata': omit(vars.md.metadata, 'vscode')})"}
                  - set: {vars.updates: "= merge(vars.updates, {string(vars.ch.index): vars.md})"}
      - foreach: "= input.content_changes"
        as: cc
        steps:
          - foreach: "= vars.cc.added_cells"
            as: added
            steps:
              - set: {vars.amd: "= has(vars.added.metadata) ? vars.added.metadata : {}"}
              - if: "has(vars.amd.metadata) && (!vars.id_required || has(vars.amd.id))"
                then:
                  - title: Metadata already complete for this nbformat
                    source: "extensions/ipynb/src/notebookModelStoreSync.ts:201-209"
                    continue: true
              - title: New cells always get metadata; in nbformat >= 4.5 also a new unique 8-character id
                source: "extensions/ipynb/src/notebookModelStoreSync.ts:211-218"
                set: {vars.amd: "= merge(merge({'metadata': {}}, vars.amd), vars.id_required && !has(vars.amd.id) ? {'id': 'c' + string(1000000 + random(8999999))} : {})"}
              - set: {vars.updates: "= merge(vars.updates, {string(vars.added.index): vars.amd})"}
      - if: "size(vars.updates) == 0"
        then:
          - return: {updates: 0}
      - title: One WorkspaceEdit of updateCellMetadata (sorted keys), tracked as a pending model update
        source: "extensions/ipynb/src/notebookModelStoreSync.ts:106-124"
        set: {state.pending_model_updates: "= state.pending_model_updates + 1"}
      - call: vscode-api.workspace-apply-edit
        input: {edit: {edits: "= vars.updates.map(k, {'resource': input.notebook, 'text': 'cell ' + k + ' metadata'})"}, extension_id: vscode.ipynb}
        on_error: continue
      - title: The edit lands in the notebook and the pending update is cleaned up
        source: "extensions/ipynb/src/notebookModelStoreSync.ts:97-105"
        set:
          state.notebooks: "= merge(state.notebooks, {input.notebook: merge(vars.nb, {'cells': lists.range(size(vars.nb.cells) > 0 ? size(vars.nb.cells) : 0).map(i, merge(string(i) in vars.updates ? merge(vars.nb.cells[i], {'metadata': vars.updates[string(i)]}) : vars.nb.cells[i], string(i) in vars.langs ? {'language_id': vars.langs[string(i)]} : {})) + input.content_changes.map(c, c.added_cells).flatten().filter(a, a.index >= size(vars.nb.cells)).map(a, merge({'kind': has(a.kind) ? a.kind : 'code', 'language_id': vars.lang, 'outputs': []}, {'metadata': string(a.index) in vars.updates ? vars.updates[string(a.index)] : (has(a.metadata) ? a.metadata : {})}))})})"
          state.pending_model_updates: "= state.pending_model_updates - 1"
      - return: {updates: "= size(vars.updates)", cells: "= vars.updates"}
  - component: notebook-model-store-sync
    name: on-will-save-notebook-document
    kind: event
    summary: "waitForPendingModelUpdates (workspace.onWillSaveNotebookDocument, jupyter-notebook only): flush the debounced change event and make the save wait for pending metadata edits; the serializer then writes the notebook."
    sources: ["extensions/ipynb/src/notebookModelStoreSync.ts:84-95"]
    request: {type: object, properties: {notebook: {type: string, default: "file:///work/app/analysis.ipynb"}}}
    behavior:
      - if: "!(input.notebook in state.notebooks) || state.notebooks[input.notebook].notebook_type != 'jupyter-notebook'"
        then:
          - return: {waited: false}
      - if: "state.pending_model_updates > 0"
        then:
          - title: e.waitUntil(pending cell metadata updates)
            source: "extensions/ipynb/src/notebookModelStoreSync.ts:90-94"
            set: {state.pending_model_updates: 0}
      - title: The save serializes the notebook with its synced metadata
        source: "extensions/ipynb/src/ipynbMain.ts:53"
        call: ipynb-notebook-serializer.serialize-notebook
        input: {data: {metadata: "= state.notebooks[input.notebook].metadata", cells: "= state.notebooks[input.notebook].cells"}}
        as: written
      - return: {waited: true, notebook: "= vars.written.value.notebook"}

  # ---------------------------------------------------------------- notebook-renderers
  - component: builtin-notebook-renderer
    name: render-output-item
    kind: function
    summary: "renderOutputItem: HTML/SVG and JavaScript render only in a trusted workspace; gif/png/jpeg as an image; the notebook error mime as a traceback (formatStackTrace, links only when trusted); stdout/stream and stderr as stream output (file paths linkified per notebook.output.linkifyFilePaths); text/plain and any other text/* as plain text; other mimes render nothing. Each rendered item replaces the previous rendering of the same output id."
    sources: ["extensions/notebook-renderers/src/index.ts:541-614", "extensions/notebook-renderers/src/index.ts:167-224", "extensions/notebook-renderers/src/index.ts:338-418"]
    request:
      type: object
      properties:
        id: {type: string, default: output-1}
        mime: {type: string, examples: [text/plain]}
        text: {type: string, default: ""}
        workspace_trusted: {type: boolean, default: true}
        settings: {type: object, default: {linkify_file_paths: true, minimal_error: false, line_limit: 30, output_scrolling: false}}
    behavior:
      - set: {vars.trusted: "= input.workspace_trusted"}
      - if: "input.mime in ['text/html', 'image/svg+xml', 'application/javascript']"
        then:
          - if: "!vars.trusted"
            then:
              - title: HTML, SVG and JavaScript outputs are not rendered in an untrusted workspace
                source: "extensions/notebook-renderers/src/index.ts:546-548"
                return: {rendered: none}
          - set: {vars.how: "= input.mime == 'application/javascript' ? 'javascript' : 'html'"}
        else:
          - if: "input.mime in ['image/gif', 'image/png', 'image/jpeg', 'image/git']"
            then:
              - title: Images render as <img> from a blob URL
                source: "extensions/notebook-renderers/src/index.ts:561-569"
                set: {vars.how: image}
            else:
              - if: "input.mime == 'application/vnd.code.notebook.error'"
                then:
                  - title: Errors render as a traceback, linkified only when trusted
                    source: "extensions/notebook-renderers/src/index.ts:571-577"
                    call: builtin-notebook-renderer.render-error
                    input: {text: "= input.text", trust_html: "= vars.trusted", minimal_error: "= has(input.settings.minimal_error) && input.settings.minimal_error"}
                    as: err
                  - set: {vars.how: error}
                else:
                  - if: "input.mime in ['application/vnd.code.notebook.stdout', 'application/x.notebook.stdout', 'application/x.notebook.stream', 'application/vnd.code.notebook.stderr', 'application/x.notebook.stderr']"
                    then:
                      - title: Stream output (stderr marked as error), file paths linkified per setting
                        source: "extensions/notebook-renderers/src/index.ts:578-594"
                        call: notebook-link-detector.linkify
                        input: {text: "= input.text", trust_html: false, linkify_file_paths: "= has(input.settings.linkify_file_paths) && input.settings.linkify_file_paths"}
                        as: parts
                      - set: {vars.how: "= input.mime.endsWith('stderr') ? 'stderr' : 'stdout'"}
                    else:
                      - if: "input.mime == 'text/plain' || input.mime.contains('text/')"
                        then:
                          - title: text/plain and other text/* render as plain text
                            source: "extensions/notebook-renderers/src/index.ts:595-610"
                            call: notebook-link-detector.linkify
                            input: {text: "= input.text", trust_html: false, linkify_file_paths: "= has(input.settings.linkify_file_paths) && input.settings.linkify_file_paths"}
                            as: parts
                          - set: {vars.how: text}
                        else:
                          - title: Not a mime this renderer handles
                            source: "extensions/notebook-renderers/src/index.ts:602-611"
                            return: {rendered: none}
      - title: The previous rendering of this output id is disposed and replaced
        source: "extensions/notebook-renderers/src/index.ts:565-567"
        set:
          state.disposables: "= merge(state.disposables, {input.id: vars.how})"
      - return: {rendered: "= vars.how", error: "= vars.how == 'error' ? vars.err.value : null"}
  - component: builtin-notebook-renderer
    name: render-error
    kind: function
    summary: "renderError: unparsable error JSON renders nothing; the header is 'name: message'; with a stack the traceback is formatted by formatStackTrace (minimal error shows only the header and the error location link), without one only the header."
    sources: ["extensions/notebook-renderers/src/index.ts:167-224"]
    request: {type: object, properties: {text: {type: string}, trust_html: {type: boolean}, minimal_error: {type: boolean, default: false}}}
    behavior:
      - if: "!input.text.startsWith('{')"
        then:
          - title: Not error JSON, nothing rendered
            source: "extensions/notebook-renderers/src/index.ts:179-185"
            return: {header: "", traceback: false}
      - set: {vars.has_stack: "= input.text.contains('\"stack\"')"}
      - if: "!vars.has_stack"
        then:
          - title: No stack, only the header
            source: "extensions/notebook-renderers/src/index.ts:214-220"
            return: {header: true, traceback: false}
      - call: notebook-stack-trace-helper.format-stack-trace
        input: {stack: "= input.text", trust_html: "= input.trust_html"}
        as: formatted
      - return: {header: true, traceback: true, minimal: "= input.minimal_error && vars.formatted.value.error_location != ''", linkified: "= vars.formatted.value.linkified", error_location: "= vars.formatted.value.error_location"}
  - component: builtin-notebook-renderer
    name: dispose-output-item
    kind: function
    summary: "disposeOutputItem(id?): dispose one output's rendering, or all of them when no id is given."
    sources: ["extensions/notebook-renderers/src/index.ts:615-621"]
    request: {type: object, properties: {id: {type: string, default: ""}}}
    behavior:
      - if: "has(input.id) && input.id != ''"
        then:
          - set: {state.disposables: "= omit(state.disposables, input.id)"}
          - return: {disposed: 1}
      - set: {vars.n: "= size(state.disposables)"}
      - set: {state.disposables: {}}
      - return: {disposed: "= vars.n"}
  - component: notebook-link-detector
    name: linkify
    kind: function
    summary: "LinkDetector.linkify: text over the length limit stays text; otherwise trusted HTML anchors (only with trustHtml), web URLs, and - when linkifyFilePaths is on - file paths become links, the rest stays text."
    sources: ["extensions/notebook-renderers/src/linkify.ts:59-101", "extensions/notebook-renderers/src/linkify.ts:154-206"]
    request: {type: object, properties: {text: {type: string}, trust_html: {type: boolean, default: false}, linkify_file_paths: {type: boolean, default: false}}}
    behavior:
      - if: "size(input.text) > 2000"
        then:
          - title: Too long to scan, plain text
            source: "extensions/notebook-renderers/src/linkify.ts:155-157"
            return: {kinds: [text]}
      - set: {vars.kinds: []}
      - if: "input.trust_html && input.text.contains('<a ')"
        then:
          - title: Trusted HTML anchors are kept as HTML
            source: "extensions/notebook-renderers/src/linkify.ts:163-166"
            set: {vars.kinds: "= vars.kinds + ['html']"}
      - if: "input.text.matches('(https?|file|vscode)://[^ ]+')"
        then:
          - title: Web links
            source: "extensions/notebook-renderers/src/linkify.ts:167-168"
            set: {vars.kinds: "= vars.kinds + ['web']"}
      - if: "input.linkify_file_paths && input.text.matches('(^|[ (])(/|\\\\./|~/|[A-Za-z]:\\\\\\\\)[^ :]+\\\\.[A-Za-z0-9]+')"
        then:
          - title: File paths only when linkifyFilePaths is on
            source: "extensions/notebook-renderers/src/linkify.ts:169-172"
            set: {vars.kinds: "= vars.kinds + ['path']"}
      - return: {kinds: "= vars.kinds + ['text']"}
  - component: notebook-stack-trace-helper
    name: format-stack-trace
    kind: function
    summary: "formatStackTrace: drop background colors and 38; foreground colors; an IPython traceback (a 'Cell In[n], line m', 'Input In [n]' or 'File path:line' location) in a trusted workspace gets its locations and '--->' line numbers turned into links (cell links are vscode-notebook-cell:?execution_count=n&line=m, the first is the error location); otherwise only cleaned."
    sources: ["extensions/notebook-renderers/src/stackTraceHelper.ts:6-31", "extensions/notebook-renderers/src/stackTraceHelper.ts:33-44", "extensions/notebook-renderers/src/stackTraceHelper.ts:55-106"]
    request: {type: object, properties: {stack: {type: string}, trust_html: {type: boolean}}}
    behavior:
      - set: {vars.cell: "= input.stack.matches('Cell[^A-Za-z]*In[^A-Za-z]*\\\\[[0-9]+\\\\][^A-Za-z]*line [0-9]+')"}
      - set: {vars.input_loc: "= input.stack.matches('Input\\\\s+.*In\\\\s*\\\\[[0-9]+\\\\]')"}
      - set: {vars.file: "= input.stack.matches('File\\\\s+.+:[0-9]+')"}
      - if: "!(vars.cell || vars.input_loc || vars.file) || !input.trust_html"
        then:
          - title: Not an IPython traceback, or untrusted - colors cleaned, no links
            source: "extensions/notebook-renderers/src/stackTraceHelper.ts:26-30"
            return: {linkified: false, error_location: ""}
      - title: linkifyStack - locations and line numbers become links to the cell or file
        source: "extensions/notebook-renderers/src/stackTraceHelper.ts:61-101"
        set: {vars.kind: "= vars.cell || vars.input_loc ? 'cell' : 'file'"}
      - return: {linkified: true, location_kind: "= vars.kind", error_location: "= vars.cell ? 'vscode-notebook-cell:?execution_count' : ''"}

  # ---------------------------------------------------------------- boundary stubs (shapes copied from exthost.yaml)
  - component: vscode-api
    name: workspace-apply-edit
    kind: function
    summary: vscode.workspace.applyEdit(edit, metadata?) -> ExtHostBulkEdits.applyWorkspaceEdit; resolves false when the edit cannot be applied.
    sources: ["src/vscode-dts/vscode.d.ts:14149", "src/vs/workbench/api/common/extHost.api.impl.ts:1284-1286"]
    attributes: {boundary: true, owner: exthost}
    request:
      type: object
      required: [edit, extension_id]
      properties:
        edit:
          type: object
          description: 'edit: WorkspaceEdit'
          properties:
            edits:
              type: array
              items: {type: object, properties: {resource: {type: string, examples: ["file:///work/app/src/util.ts"]}, text: {type: string}}}
        metadata: {type: object}
        extension_id: {type: string, examples: [vscode.git], description: 'the calling extension (implicit: each extension gets its own vscode namespace)'}
    response: {type: object, properties: {applied: {type: boolean}}}
  - component: vscode-api
    name: env-open-external
    kind: function
    summary: vscode.env.openExternal -> extHostWindow.openUri.
    sources: ["src/vscode-dts/vscode.d.ts:10872", "src/vs/workbench/api/common/extHost.api.impl.ts:474-479"]
    attributes: {boundary: true, owner: exthost}
    request:
      type: object
      required: [extension_id, target]
      properties:
        target: {type: string, format: uri, description: 'target: Uri', examples: ["file:///work/app/src/main.ts"]}
        extension_id: {type: string, examples: [vscode.git], description: 'the calling extension (implicit: each extension gets its own vscode namespace)'}
    response: ExthostApiResult

