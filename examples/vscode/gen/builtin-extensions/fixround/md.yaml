    name: update-subscriptions
    kind: function
    summary: "richLinkSubscriptions: refused after dispose; drop the unsubscribed ids, refuse a duplicate id, and for each new subscription resolve the href (git commit hint, absolute URI, else the Markdown link resolver; external results do not count) and publish the presentation of the first matching link presentation rule, or undefined."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorRichLinks.ts:35-55", "extensions/markdown-language-features/src/preview/markdownEditorRichLinks.ts:69-118"]
