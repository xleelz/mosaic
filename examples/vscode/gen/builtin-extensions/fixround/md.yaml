      - "!steps.none.result.value.editor"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'lazy-code-block-editor-factory.load-factory').size() == 1"
      - "steps.loaded.result.value.editor"
      - "!steps.after.result.value.editor"
  - id: builtin-extensions-markdown-code-block-editor-load-fails
    fixtures: [one-window-folder]
    state:
      "lazy-code-block-editor-factory@eh1": {load_fails: true}
    steps:
