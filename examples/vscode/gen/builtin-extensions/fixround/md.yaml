                call: vscode-api.workspace-create-file-system-watcher
                input: {glob_pattern: {base: "= vars.uri.value.uri", pattern: "*"}, extension_id: vscode.markdown-language-features}
              - set: {state.image_watchers: "= merge(state.image_watchers, {vars.src: vars.uri.value.uri})"}
      - return: {watched: "= state.image_watchers"}
  - component: markdown-it-engine
    name: render
    kind: function
    summary: "render: load the markdown-it instance with plugins if needed, tokenize (a document's tokens come from the cache when its version is unchanged), and render HTML together with the image sources the document contains."
    sources: ["extensions/markdown-language-features/src/markdownEngine.ts:196-220", "extensions/markdown-language-features/src/markdownEngine.ts:169-183"]
    request: {type: object, properties: {uri: {type: string, examples: ["file:///work/app/README.md"]}, version_id: {type: integer, default: 1}}}
