      - when: "input.uri != ''"
        title: Tokenize and update the cache
        source: "extensions/markdown-language-features/src/markdownEngine.ts:180-182"
        set: {state.token_cache: "= merge(state.token_cache, {input.uri: input.version_id})"}
      - title: Render; env.containingImages collects the image sources
        source: "extensions/markdown-language-features/src/markdownEngine.ts:212-219"
        return: {html: "<h1>app</h1>", cached: false, containing_images: "= vars.images"}
  - component: markdown-preview-manager
    name: open-dynamic-preview
    kind: function
    summary: "openDynamicPreview: reuse a preview that matches (same column; an unlocked one for an unlocked request, or the locked preview of the same document) by revealing it, else create a new webview panel; then update it with the resource (render, webview options, image watchers)."
    sources: ["extensions/markdown-language-features/src/preview/previewManager.ts:142-158", "extensions/markdown-language-features/src/preview/previewManager.ts:45-53", "extensions/markdown-language-features/src/preview/preview.ts:890-904", "extensions/markdown-language-features/src/preview/preview.ts:355-362"]
    request: {type: object, properties: {resource: {type: string, examples: ["file:///work/app/README.md"]}, side_by_side: {type: boolean, default: false}, locked: {type: boolean, default: false}}}
    behavior:
      - set: {vars.col: "= input.side_by_side ? 'beside' : 'one'"}
      - set: {vars.match: "= state.previews.filter(p, p.column == vars.col && (p.locked ? (input.locked && p.resource == input.resource) : !input.locked))"}
