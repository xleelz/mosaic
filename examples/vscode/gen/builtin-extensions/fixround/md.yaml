          - set: {vars.err: {code: markdown-editor-webview-rejected-rpc-message, status: 0, message: Markdown editor webview rejected RPC message}}
      - if: "input.kind == 'notification'"
        then:
          - title: Notification send failures are reported, not thrown
            source: "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:16-22"
            set: {state.reported: "= state.reported + ['Send notification ' + input.method]"}
          - return: {sent: false, reported: true}
      - fail: "= vars.err"

  # ---------------------------------------------------------------- RecoveringTaskQueue
  - component: recovering-task-queue
    name: drain
    kind: function
    summary: "drain(): resolves after the current queue tail including its recovery; the editor then reads the current epoch. Tasks run to completion before the next one starts, so the tail is always settled here."
    sources: ["extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:42-56"]
    response: {type: object, properties: {epoch: {type: integer}}}
    behavior:
      - if: "size(state.recovery_errors) > 0"
        then:
          - title: Recovery failures were reported through onRecoveryError; drain still resolves
            source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:153-156"
            return: {epoch: "= state.epoch", recovery_failed: true}
      - return: {epoch: "= state.epoch"}
  - component: recovering-task-queue
    name: invalidate
    kind: function
    summary: "invalidate(): advance the epoch so tasks computed from the previous authoritative state are skipped; returns the new epoch."
    sources: ["extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:58-63"]
    behavior:
      - title: ++epoch
        source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:62"
        set: {state.epoch: "= state.epoch + 1"}
      - return: {epoch: "= state.epoch"}
  - component: recovering-task-queue
    name: enqueue
    kind: function
    summary: "enqueue(epoch, task) and #runTask: a task whose epoch is no longer current is skipped; a current-epoch failure (unless the epoch moved meanwhile) advances the epoch and awaits onError recovery, which re-publishes the authoritative document at that epoch; recovery errors go to onRecoveryError."
    sources: ["extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:65-87", "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:141-158", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:437-443"]
    request: {type: object, required: [epoch], properties: {epoch: {type: integer}, edit: {type: object}}}
    behavior:
      - if: "input.epoch != state.epoch"
        then:
          - title: The task's epoch is stale, skip it
            source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:142-144"
            set: {state.skipped: "= state.skipped + 1"}
          - return: {applied: false, skipped: true}
      - title: Run the task (the editor's apply step)
        source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:145-146"
        call: markdown-editor-provider.apply-webview-edit
        input: {edit: "= input.edit"}
        as: task
        on_error:
          - if: "input.epoch != state.epoch"
            then:
              - return: {applied: false, skipped: true}
          - title: Current-epoch failure, invalidate and recover before later tasks run
            source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:151-153"
            set: {state.epoch: "= state.epoch + 1"}
          - title: onError restores the authoritative content at the recovery epoch
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:438-441"
            call: markdown-editor-provider.post-authoritative-update
            input: {epoch: "= state.epoch"}
            as: recovery
            on_error:
              - title: onRecoveryError reports, it must not throw
                source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:154-156"
                set: {state.recovery_errors: "= state.recovery_errors + [error.code]"}
          - return: {applied: false, recovered: true, epoch: "= state.epoch", error: "= error.code"}
      - return: "= vars.task.value"
  - component: recovering-task-queue
    name: enqueue-barrier
    kind: function
    summary: "enqueueBarrier(task): when it reaches the head of the queue the barrier advances the epoch (so earlier-epoch work queued later is skipped) and runs with that epoch; its errors are reported through onRecoveryError."
    sources: ["extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:89-104", "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:121-128"]
    request: {type: object, properties: {barrier: {type: string, default: reload-webview}}}
    behavior:
      - title: The barrier invalidates before it runs
        source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:122"
        set: {state.epoch: "= state.epoch + 1"}
      - title: Run the barrier with the new epoch
        source: "extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:123-127"
        call: markdown-editor-provider.reload-webview-barrier
        input: {epoch: "= state.epoch"}
        as: ran
        on_error:
          - set: {state.recovery_errors: "= state.recovery_errors + [error.code]"}
      - return: {epoch: "= state.epoch"}

  # ---------------------------------------------------------------- MarkdownEditorNavigation
  - component: markdown-editor-navigation
    name: accept-selection
    kind: function
    summary: "acceptSelection: only the latest selection request counts; after draining edits it is dropped when the navigation is disposed, superseded, or from another epoch; a selection past the mirrored text throws; otherwise it becomes the editor's vscode.Selection and onDidChangeSelection fires."
