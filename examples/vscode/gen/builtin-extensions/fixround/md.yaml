  - component: markdown-link-presentation-service
    name: watch
    kind: function
    summary: "watch(href) (behind registerLinkPresentationProvider): canonicalize the href, reuse its entry or ask the resolvers in order (git commit, workspace); no resolver throws 'No link presentation resolver accepted'; each watch adds a reference."
    sources: ["extensions/markdown-language-features/src/preview/linkPresentation/linkPresentationService.ts:44-72", "extensions/markdown-language-features/src/preview/linkPresentation/linkPresentationService.ts:99-114", "extensions/markdown-language-features/src/preview/linkPresentation/linkPresentationService.ts:151-163"]
