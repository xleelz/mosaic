# Part `md`: markdown-language-features (Markdown editor host side, link opener, copy files, preview resources),
# ipynb (serializer, deserializer, model store sync) and notebook-renderers (built-in output renderer).
configs:
  - id: markdown-editor-quick-suggestions
    type: boolean
    value: false
    default: false
    summary: "markdown.editor.quickSuggestions: automatic (as-you-type) suggestions in the Markdown editor; off by default, so automatic requests answer an empty list."
    sources: ["extensions/markdown-language-features/package.json:1480-1482", "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:43"]
    attributes: {key: markdown.editor.quickSuggestions}
  - id: markdown-links-open-location
    type: string
    value: currentGroup
    default: currentGroup
    summary: "markdown.links.openLocation: where a followed Markdown link opens (currentGroup or beside)."
    sources: ["extensions/markdown-language-features/package.json:1486-1488", "extensions/markdown-language-features/src/util/openDocumentLink.ts:235"]
    attributes: {key: markdown.links.openLocation}
  - id: markdown-copy-files-destination
    type: object
    value: {}
    default: {}
    summary: "markdown.copyFiles.destination: glob of the Markdown document -> destination (with ${fileName}-style variables) for pasted or dropped files; unset means next to the document."
    sources: ["extensions/markdown-language-features/package.json:1655-1661", "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:19"]
    attributes: {key: markdown.copyFiles.destination}
  - id: markdown-copy-files-overwrite-behavior
    type: string
    value: nameIncrementally
    default: nameIncrementally
    summary: "markdown.copyFiles.overwriteBehavior: overwrite an existing file, or pick name-1, name-2 ... (nameIncrementally)."
    sources: ["extensions/markdown-language-features/package.json:1662-1665", "extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:24-28"]
    attributes: {key: markdown.copyFiles.overwriteBehavior}

components:
  # ---------------------------------------------------------------- markdown editor (host side)
  - id: markdown-editor-provider
    name: MarkdownEditorProvider
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "The 'vscode.markdown.editor' custom text editor: resolves an editor (trust prompt, authenticated webview, local resource roots), serves the webview's markdown.editor.host RPC (ready, edit, openLink, rename, completions, media paste, selection, rich links) against the authoritative document, and forwards markdown.editor.* commands to the active editor's renderer."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:254-256", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:370-380", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:762-769", "extensions/markdown-language-features/src/extension.shared.ts:84-106"]
    attributes: {owner: builtin-extensions}
    state:
      schema:
        type: object
        properties:
          active_webview: {type: boolean}
          forwarded: {type: array, items: {type: string}}
          registrations: {type: object}
          readonly_default: {type: boolean, description: "the markdown.editor.readonly memento (global default for the next editor)"}
          editor:
            type: object
            description: "the one resolved editor of this model: document mirror (text, version) and the #wireSingle closure state (webviewText, readonly, ready)"
            properties:
              open: {type: boolean}
              uri: {type: string}
              text: {type: string}
              version: {type: integer}
              untitled: {type: boolean}
              webview_text: {type: string}
              ready: {type: boolean}
              readonly: {type: boolean}
              panel_active: {type: boolean}
              local_resource_roots: {type: array, items: {type: string}}
      initial:
        active_webview: false
        forwarded: []
        readonly_default: true
        editor: {open: false, uri: "", text: "", version: 0, untitled: false, webview_text: "", ready: false, readonly: true, panel_active: false, local_resource_roots: []}
        registrations:
          markdown.editor.triggerSuggest: markdown-editor-provider.cmd-markdown-editor-triggersuggest
          markdown.editor.rename: markdown-editor-provider.cmd-markdown-editor-rename
          markdown.editor.cursorLeft: markdown-editor-provider.cmd-markdown-editor-cursorleft
          markdown.editor.cursorRight: markdown-editor-provider.cmd-markdown-editor-cursorright
          markdown.editor.cursorUp: markdown-editor-provider.cmd-markdown-editor-cursorup
          markdown.editor.cursorDown: markdown-editor-provider.cmd-markdown-editor-cursordown
          markdown.editor.cursorLeftSelect: markdown-editor-provider.cmd-markdown-editor-cursorleftselect
          markdown.editor.cursorRightSelect: markdown-editor-provider.cmd-markdown-editor-cursorrightselect
          markdown.editor.cursorUpSelect: markdown-editor-provider.cmd-markdown-editor-cursorupselect
          markdown.editor.cursorDownSelect: markdown-editor-provider.cmd-markdown-editor-cursordownselect
          markdown.editor.cursorWordLeft: markdown-editor-provider.cmd-markdown-editor-cursorwordleft
          markdown.editor.cursorWordRight: markdown-editor-provider.cmd-markdown-editor-cursorwordright
          markdown.editor.cursorWordLeftSelect: markdown-editor-provider.cmd-markdown-editor-cursorwordleftselect
          markdown.editor.cursorWordRightSelect: markdown-editor-provider.cmd-markdown-editor-cursorwordrightselect
          markdown.editor.cursorVisualLineStart: markdown-editor-provider.cmd-markdown-editor-cursorvisuallinestart
          markdown.editor.cursorVisualLineEnd: markdown-editor-provider.cmd-markdown-editor-cursorvisuallineend
          markdown.editor.cursorVisualLineStartSelect: markdown-editor-provider.cmd-markdown-editor-cursorvisuallinestartselect
          markdown.editor.cursorVisualLineEndSelect: markdown-editor-provider.cmd-markdown-editor-cursorvisuallineendselect
          markdown.editor.cursorLogicalLineStart: markdown-editor-provider.cmd-markdown-editor-cursorlogicallinestart
          markdown.editor.cursorLogicalLineEnd: markdown-editor-provider.cmd-markdown-editor-cursorlogicallineend
          markdown.editor.cursorLogicalLineStartSelect: markdown-editor-provider.cmd-markdown-editor-cursorlogicallinestartselect
          markdown.editor.cursorLogicalLineEndSelect: markdown-editor-provider.cmd-markdown-editor-cursorlogicallineendselect
          markdown.editor.cursorDocumentStart: markdown-editor-provider.cmd-markdown-editor-cursordocumentstart
          markdown.editor.cursorDocumentEnd: markdown-editor-provider.cmd-markdown-editor-cursordocumentend
          markdown.editor.cursorDocumentStartSelect: markdown-editor-provider.cmd-markdown-editor-cursordocumentstartselect
          markdown.editor.cursorDocumentEndSelect: markdown-editor-provider.cmd-markdown-editor-cursordocumentendselect
          markdown.editor.selectAll: markdown-editor-provider.cmd-markdown-editor-selectall
          markdown.editor.deleteLeft: markdown-editor-provider.cmd-markdown-editor-deleteleft
          markdown.editor.deleteRight: markdown-editor-provider.cmd-markdown-editor-deleteright
          markdown.editor.deleteWordLeft: markdown-editor-provider.cmd-markdown-editor-deletewordleft
          markdown.editor.deleteWordRight: markdown-editor-provider.cmd-markdown-editor-deletewordright
          markdown.editor.deleteLineLeft: markdown-editor-provider.cmd-markdown-editor-deletelineleft
          markdown.editor.deleteLineRight: markdown-editor-provider.cmd-markdown-editor-deletelineright
          markdown.editor.copyLinesUp: markdown-editor-provider.cmd-markdown-editor-copylinesup
          markdown.editor.copyLinesDown: markdown-editor-provider.cmd-markdown-editor-copylinesdown
          markdown.editor.moveLinesUp: markdown-editor-provider.cmd-markdown-editor-movelinesup
          markdown.editor.moveLinesDown: markdown-editor-provider.cmd-markdown-editor-movelinesdown
          markdown.editor.deleteLines: markdown-editor-provider.cmd-markdown-editor-deletelines
          markdown.editor.joinLines: markdown-editor-provider.cmd-markdown-editor-joinlines
          markdown.editor.toggleLocked: markdown-editor-provider.cmd-markdown-editor-togglelocked
          markdown.editor.undo: markdown-editor-provider.cmd-markdown-editor-undo
          markdown.editor.redo: markdown-editor-provider.cmd-markdown-editor-redo
          markdown.editor.insertTab: markdown-editor-provider.cmd-markdown-editor-inserttab
          markdown.editor.outdent: markdown-editor-provider.cmd-markdown-editor-outdent
          markdown.editor.toggleTabFocus: markdown-editor-provider.cmd-markdown-editor-toggletabfocus
          markdown.editor.smartEnter: markdown-editor-provider.cmd-markdown-editor-smartenter
          markdown.editor.insertHardLineBreak: markdown-editor-provider.cmd-markdown-editor-inserthardlinebreak
          markdown.editor.insertParagraph: markdown-editor-provider.cmd-markdown-editor-insertparagraph
  - id: authenticated-webview
    name: AuthenticatedWebview
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Wraps a Markdown editor webview in a HubRPC connection over a private message secret; reset() closes the connection and reconnects under a fresh secret so the previous webview generation can no longer talk to the host."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:85-110", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:156-165"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {generation: {type: integer}, ready: {type: boolean}, disposed: {type: boolean}}}
      initial: {generation: 1, ready: false, disposed: false}
  - id: markdown-editor-rpc-transport
    name: MarkdownEditorRpcTransport
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "The authenticated message transport of one webview generation: drops envelopes for another channel or secret, rejects malformed JSON-RPC, buffers messages until a listener is set, and refuses to send once disposed (responses are silently dropped)."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:49-118", "extensions/markdown-language-features/src/preview/markdownEditorRpc.ts:8-36"]
    attributes: {owner: builtin-extensions}
    state:
      schema:
        type: object
        properties:
          secret: {type: string}
          disposed: {type: boolean}
          listener: {type: boolean}
          pending: {type: array, items: {type: object}}
          webview_accepts: {type: boolean, description: "whether webview.postMessage accepts envelopes (false once the webview is gone)"}
          reported: {type: array, items: {type: string}}
      initial: {secret: secret-1, disposed: false, listener: true, pending: [], webview_accepts: true, reported: []}
  - id: recovering-task-queue
    name: RecoveringTaskQueue
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Serializes the Markdown editor's edits against an authoritative epoch: tasks for a stale epoch are skipped, a failing current-epoch task advances the epoch and awaits recovery (re-publishing the document) before later work, and barriers advance the epoch before they run."
    sources: ["extensions/markdown-language-features/src/preview/recoveringTaskQueue.ts:19-63", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:437-443"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {epoch: {type: integer}, skipped: {type: integer}, recovery_errors: {type: array, items: {type: string}}}}
      initial: {epoch: 0, skipped: 0, recovery_errors: []}
  - id: markdown-editor-navigation
    name: MarkdownEditorNavigation
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "The CustomTextEditorNavigation of a Markdown editor: mirrors the webview selection as a vscode.Selection (latest request, current epoch only) and reveals ranges in the webview after checking the document version, generation and epoch are still current."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorNavigation.ts:10-55", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:316-326"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {selection: {}, generation: {type: integer}, selection_request: {type: integer}, disposed: {type: boolean}}}
      initial: {selection: null, generation: 0, selection_request: 0, disposed: false}
  - id: markdown-editor-rename
    name: MarkdownEditorRename
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Rename from the Markdown editor: one session per request id, prepared against a (version, editEpoch) snapshot with vscode.prepareRename, applied with vscode.executeDocumentRenameProvider and workspace.applyEdit only while nothing changed."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorRename.ts:10-121", "extensions/markdown-language-features/src/preview/markdownEditorRename.ts:140-144"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {session: {description: "{request_id, prepared?: {version, edit_epoch}} or null"}}}
      initial: {session: null}
  - id: markdown-editor-language-features
    name: MarkdownEditorLanguageFeatures
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Completions and diagnostics for the Markdown editor webview: requests vscode.executeCompletionItemProvider at the mirrored position, filters by the typed prefix, and on accept re-resolves the item, refuses snippets and changed lists, and applies the edit."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:10-31", "extensions/markdown-language-features/src/preview/markdownEditorLanguageFeatures.ts:171-175"]
    attributes: {owner: builtin-extensions}
    state:
      schema:
        type: object
        properties:
          session: {description: "{request_id, prepared?: {version, edit_epoch, items}} or null"}
          provider_items: {type: array, items: {type: object}, description: "what the registered completion providers answer at the cursor (label, filter_text?, kind?, snippet?, command?)"}
          diagnostics: {type: array, items: {type: object}, description: "vscode.languages.getDiagnostics for the document: {start, end_exclusive, message, severity 0-3}"}
      initial:
        session: null
        provider_items: [{label: "#usage", kind: Reference}, {label: "#install", kind: Reference}, {label: "snippet-table", kind: Snippet, snippet: true}]
        diagnostics: []
  - id: markdown-editor-image-paste
    name: MarkdownEditorImagePaste
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Pastes clipboard media from the Markdown editor webview: validates range and media, has ResourcePasteOrDropProvider copy the files into the workspace (reading their bytes from the webview in chunks), then applies the snippet edit at the pasted range."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorImagePaste.ts:12-113"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {pending: {type: integer}, paste_count: {type: integer}}}
      initial: {pending: 0, paste_count: 0}
  - id: markdown-editor-media-transfer
    name: markdownEditorMediaTransfer (readClipboardMediaContents)
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Host-side reader of webview clipboard media: pulls a file in 256 KiB chunks through renderer.readClipboardMedia, checking the editor is still current around every chunk and rejecting malformed or short chunks."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:8", "extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:51-76"]
    attributes: {owner: builtin-extensions}
  - id: clipboard-media-store
    name: ClipboardMediaStore
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Webview-side store of the pasted clipboard files (id -> file); answers readClipboardMedia chunk requests and refuses unknown ids, out-of-range or oversized chunks."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorMediaTransfer.ts:14-49"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {files: {type: object, description: "id -> {name, mime, size}"}}}
      initial: {files: {}}
  - id: markdown-editor-rich-link-controller
    name: MarkdownEditorRichLinkController
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Keeps the webview's rich link subscriptions: resolves each href (git commit hints, absolute URIs, then the Markdown link resolver), finds a matching link presentation rule and publishes the watcher's presentation, or undefined."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorRichLinks.ts:15-98"]
    attributes: {owner: builtin-extensions}
    state:
      schema:
        type: object
        properties:
          subscriptions: {type: object, description: "subscriptionId -> href"}
          disposed: {type: boolean}
          rules: {type: array, items: {type: object}, description: "vscode.window.linkPresentationRules: {id, prefix}"}
      initial:
        subscriptions: {}
        disposed: false
        rules: [{id: markdown.git, prefix: "commit:"}, {id: markdown.git, prefix: "https://github.com/"}, {id: markdown.workspace, prefix: "file:///work/app/"}]
  - id: markdown-link-presentation-service
    name: LinkPresentationService
    kind: module
    layer: extensions
    parent: markdown-extension
    summary: "Shared link presentation service of the Markdown extension: canonicalizes hrefs, asks its resolvers (git commit, then workspace) in order, keeps one reference-counted entry per href, and lets a resolver open a link it owns."
    sources: ["extensions/markdown-language-features/src/preview/linkPresentation/linkPresentationService.ts:31-82", "extensions/markdown-language-features/src/preview/linkPresentation/linkPresentationService.ts:144-149", "extensions/markdown-language-features/src/extension.shared.ts:50-67"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {entries: {type: object, description: "canonical href -> {kind, references}"}}}
      initial: {entries: {}}
  - id: git-link-presentation-resolver
    name: GitLinkPresentationResolver
    kind: module
    layer: extensions
    parent: markdown-link-presentation-service
    summary: "Resolves commit links (commit:<sha>, http(s)://host/owner/repo/commit/<sha>) against the open Git repositories through the vscode.git API, caching immutable commit presentations; opening runs git.viewCommit."
    sources: ["extensions/markdown-language-features/src/preview/linkPresentation/gitLinkPresentationResolver.ts:12-155", "extensions/markdown-language-features/src/preview/linkPresentation/linkPresentationResolver.ts:35-53"]
    attributes: {owner: builtin-extensions}
    state:
      schema:
        type: object
        properties:
          repositories: {type: array, items: {type: object}, description: "open repositories of the git API: {root, remotes, commits}"}
          git_enabled: {type: boolean}
          cache: {type: object, description: "ImmutableLinkPresentationCache: href -> presentation"}
      initial:
        git_enabled: true
        repositories: [{root: "file:///work/app", remotes: ["github.com/acme/app"], commits: {"0123abc": "Fix the parser"}}]
        cache: {}
  - id: md-link-opener
    name: MdLinkOpener
    kind: module
    layer: extensions
    parent: markdown-extension
    summary: "Resolves Markdown links relative to a source document (absolute non-file URIs bypass the language server) and opens the typed target: externals with openExternal, folders by revealing them, files with vscode.open at the target position or #L line fragment."
    sources: ["extensions/markdown-language-features/src/util/openDocumentLink.ts:16-121"]
    attributes: {owner: builtin-extensions}
  - id: markdown-copy-files
    name: copyFiles (resolveCopyDestination)
    kind: module
    layer: extensions
    parent: markdown-extension
    summary: "Destination rules for files pasted or dropped into Markdown: markdown.copyFiles.destination globs, ${...} variables, workspace-root anchoring with a leading '/', a trailing '/' meaning a folder."
    sources: ["extensions/markdown-language-features/src/languageFeatures/copyFiles/copyFiles.ts:11-58"]
    attributes: {owner: builtin-extensions}
  - id: new-file-path-generator
    name: NewFilePathGenerator
    kind: module
    layer: extensions
    parent: markdown-extension
    summary: "Picks the URI a pasted or dropped file is copied to: the first markdown.copyFiles.destination glob that matches the document, else next to it; with nameIncrementally a path already used gets -1, -2 ..."
    sources: ["extensions/markdown-language-features/src/languageFeatures/copyFiles/newFilePathGenerator.ts:15-75"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {used_paths: {type: array, items: {type: string}}}}
      initial: {used_paths: []}
  - id: resource-paste-or-drop-provider
    name: ResourcePasteOrDropProvider
    kind: module
    layer: extensions
    parent: markdown-extension
    summary: "Turns dropped or pasted media files into a workspace edit that creates copies of them and a snippet linking to them; only when copyIntoWorkspace is mediaFiles and the document is saved."
    sources: ["extensions/markdown-language-features/src/languageFeatures/copyFiles/dropOrPasteResource.ts:201-260"]
    attributes: {owner: builtin-extensions}
  - id: markdown-resources
    name: util/resources (getMarkdownLocalResourceRoots)
    kind: module
    layer: extensions
    parent: markdown-extension
    summary: "The local resource roots of a Markdown preview or editor webview: the given roots plus, when workspace resources are allowed, every workspace folder (document inside the workspace) or the document's folder."
    sources: ["extensions/markdown-language-features/src/util/resources.ts:15-36"]
    attributes: {owner: builtin-extensions}
  - id: markdown-url-util
    name: util/url (urlToUri)
    kind: module
    layer: extensions
    parent: markdown-extension
    summary: "urlToUri: resolves an absolute or relative image URL against a base URI with URL semantics (query strings stay queries), undefined when it cannot be parsed."
    sources: ["extensions/markdown-language-features/src/util/url.ts:8-23"]
    attributes: {owner: builtin-extensions}
  - id: markdown-preview
    name: MarkdownPreview
    kind: module
    layer: extensions
    parent: markdown-preview-manager
    summary: "One Markdown preview webview: after a render it sets the webview options (local resource roots) and watches the local images the document contains so the preview refreshes when they change."
    sources: ["extensions/markdown-language-features/src/preview/preview.ts:79-81", "extensions/markdown-language-features/src/preview/preview.ts:421-476"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {image_watchers: {type: object, description: "src -> watched folder uri"}, local_resource_roots: {type: array, items: {type: string}}}}
      initial: {image_watchers: {}, local_resource_roots: []}
  - id: markdown-it-engine
    name: MarkdownItEngine
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "The markdown-it instance with the contributed plugins, loaded lazily, and a token cache keyed by document and version; rendering also reports the image sources the document contains."
    sources: ["extensions/markdown-language-features/src/markdownEngine.ts:100-130", "extensions/markdown-language-features/src/markdownEngine.ts:196-220"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {md_loaded: {type: boolean}, token_cache: {type: object}, document_images: {type: object, description: "uri -> image srcs the document contains (env.containingImages)"}}}
      initial: {md_loaded: false, token_cache: {}, document_images: {}}
  - id: lazy-code-block-editor-factory
    name: LazyCodeBlockEditorFactory
    kind: module
    layer: extensions
    parent: markdown-editor-provider
    summary: "Webview-side factory for embedded code block editors that loads the real iframe editor factory only once a block needs one and providers exist; returns no editor until it has loaded, and nothing after dispose."
    sources: ["extensions/markdown-language-features/src/preview/lazyCodeBlockEditorFactory.ts:8-78", "extensions/markdown-language-features/markdown-editor-src/editor.ts:371"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {providers: {type: array, items: {type: string}}, loaded: {type: boolean}, load_started: {type: boolean}, disposed: {type: boolean}, load_fails: {type: boolean}, errors: {type: array, items: {type: string}}}}
      initial: {providers: [], loaded: false, load_started: false, disposed: false, load_fails: false, errors: []}

  - id: md-language-client
    name: MdLanguageClient (startClient)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Starts the vscode-markdown-languageserver over IPC and answers its parse and file system requests from the extension host; forwards link resolution requests (markdown/resolveLinkTarget) to the server."
    sources: ["extensions/markdown-language-features/src/client/client.ts:68-184", "extensions/markdown-language-features/src/client/client.ts:40-42"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {link_targets: {type: object, description: "what the language server answers for a link (key: link text, or document uri + '#fragment'): {kind: file|folder|external, uri, line?}"}}}
      initial:
        link_targets:
          "file:///work/app/README.md#usage": {kind: file, uri: "file:///work/app/README.md", line: 4}
          "./docs/guide.md": {kind: file, uri: "file:///work/app/docs/guide.md"}
          "./src/main.ts#L10": {kind: file, uri: "file:///work/app/src/main.ts"}
          "./docs": {kind: folder, uri: "file:///work/app/docs"}
  # ---------------------------------------------------------------- ipynb
  - id: ipynb-notebook-serializer
    name: NotebookSerializer (vscode.ipynb, NotebookSerializerBase)
    kind: module
    layer: extensions
    parent: ipynb-extension
    summary: "vscode.ipynb's NotebookSerializer for jupyter-notebook and interactive: parses .ipynb JSON (nbformat 4+) into NotebookData with the preferred cell language, and writes NotebookData back as sorted, pruned nbformat JSON with a trailing newline."
    sources: ["extensions/ipynb/src/notebookSerializer.ts:13-88", "extensions/ipynb/src/ipynbMain.ts:53-67"]
    attributes: {owner: builtin-extensions, extension: vscode.ipynb}
    state:
      schema: {type: object, properties: {disposed: {type: boolean}, installed_extensions: {type: array, items: {type: string}}}}
      initial: {disposed: false, installed_extensions: []}
  - id: notebook-model-store-sync
    name: notebookModelStoreSync (vscode.ipynb)
    kind: module
    layer: extensions
    parent: ipynb-extension
    summary: "Keeps a jupyter-notebook's cell metadata in step with what the .ipynb file will contain: execution_count follows executions and is nulled when outputs are cleared, vscode.languageId records a cell language other than the notebook's, and new cells get ids in nbformat >= 4.5; saves wait for these edits."
    sources: ["extensions/ipynb/src/notebookModelStoreSync.ts:14-29", "extensions/ipynb/src/notebookModelStoreSync.ts:127-225"]
    attributes: {owner: builtin-extensions, extension: vscode.ipynb}
    state:
      schema:
        type: object
        properties:
          notebooks: {type: object, description: "the extension's view of open notebook documents: uri -> {notebook_type, metadata: {nbformat, nbformat_minor, metadata}, cells: [{kind, language_id, value, metadata, outputs}]}"}
          pending_cell_updates: {type: array, items: {type: string}, description: "uri#index of cells whose clear-all metadata update is still expected back"}
          pending_model_updates: {type: integer}
      initial:
        pending_cell_updates: []
        pending_model_updates: 0
        notebooks:
          "file:///work/app/analysis.ipynb":
            notebook_type: jupyter-notebook
            metadata: {nbformat: 4, nbformat_minor: 5, metadata: {language_info: {name: python}}}
            cells:
              - {kind: code, language_id: python, value: "import pandas as pd", metadata: {id: a1b2c3d4, execution_count: 1, metadata: {}}, outputs: []}
              - {kind: code, language_id: python, value: "print(df.head())", metadata: {id: e5f6a7b8, execution_count: 2, metadata: {}}, outputs: [{items: [{mime: application/vnd.code.notebook.stdout, text: "   a  b\n0  1  2\n"}]}]}
              - {kind: markup, language_id: markdown, value: "# Results", metadata: {id: c9d0e1f2, metadata: {}}, outputs: []}
  # ---------------------------------------------------------------- notebook-renderers
  - id: builtin-notebook-renderer
    name: vscode.builtin-renderer (notebook-renderers index.ts activate)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "The built-in notebook output renderer (vscode.builtin-renderer, runs in the notebook webview): picks how to render each output item by mime - HTML/SVG and JavaScript only in trusted workspaces, images as <img>, errors as (linkified) tracebacks, stdout/stderr streams appended to the previous stream output, any text/* as plain text."
    sources: ["extensions/notebook-renderers/src/index.ts:419-420", "extensions/notebook-renderers/src/index.ts:541-639", "extensions/notebook-renderers/package.json:21-40"]
    attributes: {owner: builtin-extensions, extension: vscode.notebook-renderers}
    state:
      schema: {type: object, properties: {disposables: {type: object, description: "output item id -> how it was rendered"}}}
      initial: {disposables: {}}
  - id: notebook-link-detector
    name: LinkDetector (notebook-renderers linkify)
    kind: module
    layer: extensions
    parent: builtin-notebook-renderer
    summary: "Splits output text into text, web links, file path links (only when linkifyFilePaths is on) and trusted HTML anchors (only with trustHtml and a trusted-types policy); text over the length limit is left as is."
    sources: ["extensions/notebook-renderers/src/linkify.ts:34-50", "extensions/notebook-renderers/src/linkify.ts:154-211"]
    attributes: {owner: builtin-extensions}
  - id: notebook-stack-trace-helper
    name: stackTraceHelper (formatStackTrace)
    kind: module
    layer: extensions
    parent: builtin-notebook-renderer
    summary: "Cleans IPython tracebacks (background and 38; colors removed) and, for a trusted workspace, turns 'Cell In[n], line m', 'Input In [n]' and 'File path:line' locations into links to the notebook cell or file."
    sources: ["extensions/notebook-renderers/src/stackTraceHelper.ts:6-44", "extensions/notebook-renderers/src/stackTraceHelper.ts:55-106"]
    attributes: {owner: builtin-extensions}

interfaces:
  # ---------------------------------------------------------------- MarkdownEditorProvider
  - component: markdown-editor-provider
    name: resolve-custom-text-editor
    kind: function
    summary: "resolveCustomTextEditor -> #resolveEditor: in an untrusted workspace ask (modal) whether to open the Markdown file anyway and dispose the panel unless 'Open Anyway'; then wrap the webview in an AuthenticatedWebview, wire the editor (readonly from the global memento) and configure the webview with its local resource roots (workspace resources only when trusted)."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:300-306", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:328-368", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:377-382"]
    request:
      type: object
      properties:
        uri: {type: string, default: "file:///work/app/README.md"}
        text: {type: string, default: "# App\n\nSee [usage](#usage).\n\n## Usage\n"}
        version: {type: integer, default: 1}
        untitled: {type: boolean, default: false}
        workspace_trusted: {type: boolean, default: true}
        panel_active: {type: boolean, default: true}
    response: {type: object, properties: {resolved: {type: boolean}, local_resource_roots: {type: array, items: {type: string}}}}
    behavior:
      - if: "!input.workspace_trusted"
        then:
          - title: Untrusted workspace, ask whether to open the Markdown file anyway (modal)
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:329-341"
            call: vscode-api.window-show-warning-message
            input: {message: "This Markdown file is in an untrusted workspace. Do you want to open it anyway?", options: {modal: true}, items: [Cancel, Open Anyway], extension_id: vscode.markdown-language-features}
            as: pick
          - choice: trust_prompt
            default: "= vars.pick.ok && has(vars.pick.value.selected) && vars.pick.value.selected == 'Open Anyway' ? 'open_anyway' : 'cancel'"
            options:
              open_anyway: []
              cancel:
                - title: Not 'Open Anyway', the panel is disposed and nothing is wired
                  source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:342-345"
                  return: {resolved: false, local_resource_roots: []}
      - title: AuthenticatedWebview connects the webview under a fresh message secret
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:350-351"
        call: authenticated-webview.reset
        input: {reason: resolve}
      - title: "#configureWebview: local resource roots are the editor media root, plus workspace resources only when trusted"
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:356-368"
        call: markdown-resources.get-markdown-local-resource-roots
        input: {resource: "= input.uri", base_roots: ["file:///vscode/extensions/markdown-language-features/markdown-editor-out"], include_workspace_resources: "= input.workspace_trusted"}
        as: roots
      - title: "#wireSingle starts from the document text, readonly from the markdown.editor.readonly memento, not ready"
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:377-382"
        set:
          state.editor: "= {'open': true, 'uri': input.uri, 'text': input.text, 'version': input.version, 'untitled': input.untitled, 'webview_text': input.text, 'ready': false, 'readonly': state.readonly_default, 'panel_active': input.panel_active, 'local_resource_roots': vars.roots.value.roots}"
          state.active_webview: "= input.panel_active"
      - return: {resolved: true, local_resource_roots: "= vars.roots.value.roots"}
  - component: markdown-editor-provider
    name: snapshot
    kind: function
    summary: "The closures #wireSingle hands to Rename, LanguageFeatures, ImagePaste and Navigation: drain the edit queue, then read { text: webviewText, editEpoch: editQueue.epoch }, the document version and whether the panel is active (and, for paste, not readonly); fails when no editor is wired."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:472-484"]
    response: {type: object, properties: {text: {type: string}, edit_epoch: {type: integer}, version: {type: integer}, active: {type: boolean}, editable: {type: boolean}, untitled: {type: boolean}, uri: {type: string}}}
    behavior:
      - if: "!state.editor.open"
        then:
          - title: The panel was disposed, its handlers are gone
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:729-737"
            fail: {code: cancellation-error, status: 0, message: Canceled}
      - title: "() => editQueue.drain(), then { text: webviewText, editEpoch: editQueue.epoch }"
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:472-474"
        call: recovering-task-queue.drain
        as: queue
      - return:
          text: "= state.editor.webview_text"
          edit_epoch: "= vars.queue.value.epoch"
          version: "= state.editor.version"
          active: "= state.editor.panel_active"
          editable: "= !state.editor.readonly && state.editor.panel_active"
          untitled: "= state.editor.untitled"
          uri: "= state.editor.uri"
  - component: markdown-editor-provider
    name: handle-host-request
    kind: function
    summary: "The markdown.editor.host handlers registered with editorWebview.setHandlers: each RPC method from the webview goes to its handler (selection to navigation, completions/diagnostics to language features, pasteImages to image paste, rename to rename, richLinkSubscriptions to the rich link controller, ready/edit/openLink/setReadonly/history to #wireSingle's own closures); unknown methods are refused."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:495-505", "extensions/markdown-language-features/src/preview/markdownEditorProtocol.ts:118-146"]
    request:
      type: object
      required: [method]
      properties:
        method: {type: string, examples: [edit]}
        params: {type: object, default: {}}
    behavior:
      - if: "!state.editor.open"
        then:
          - title: No editor is wired for this webview
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:729-737"
            fail: {code: cancellation-error, status: 0, message: Canceled}
      - set:
          vars.routes:
            ready: markdown-editor-provider.host-ready
            edit: markdown-editor-provider.host-edit
            openLink: markdown-editor-provider.host-open-link
            setReadonly: markdown-editor-provider.host-set-readonly
            history: markdown-editor-provider.host-history
            selectionChanged: markdown-editor-navigation.accept-selection
            prepareRename: markdown-editor-rename.prepare
            rename: markdown-editor-rename.rename
            cancelRename: markdown-editor-rename.cancel
            completions: markdown-editor-language-features.completions
            acceptCompletion: markdown-editor-language-features.accept
            cancelCompletions: markdown-editor-language-features.cancel
            getDiagnostics: markdown-editor-language-features.diagnostics
            pasteImages: markdown-editor-image-paste.paste
            richLinkSubscriptions: markdown-editor-rich-link-controller.update-subscriptions
      - if: "!(input.method in vars.routes)"
        then:
          - title: The method is not part of markdown.editor.host
            source: "extensions/markdown-language-features/src/preview/markdownEditorProtocol.ts:118"
            fail: {code: method-not-found, status: 0, message: "= 'Unknown method ' + input.method"}
      - call: "= vars.routes[input.method]"
        targets: [markdown-editor-provider.host-ready, markdown-editor-provider.host-edit, markdown-editor-provider.host-open-link, markdown-editor-provider.host-set-readonly, markdown-editor-provider.host-history, markdown-editor-navigation.accept-selection, markdown-editor-rename.prepare, markdown-editor-rename.rename, markdown-editor-rename.cancel, markdown-editor-language-features.completions, markdown-editor-language-features.accept, markdown-editor-language-features.cancel, markdown-editor-language-features.diagnostics, markdown-editor-image-paste.paste, markdown-editor-rich-link-controller.update-subscriptions]
        input: "= input.params"
        as: handled
      - return: "= vars.handled.value"
  - component: markdown-editor-provider
    name: host-ready
    kind: function
    summary: "ready: clear rich links, mark the webview ready, re-publish the authoritative document when the webview's document version or edit epoch is not current, then publish ready and push configuration and code block editor providers."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:505-519"]
    request: {type: object, properties: {documentVersion: {type: integer, default: 1}, editEpoch: {type: integer, default: 0}}}
    behavior:
      - call: markdown-editor-rich-link-controller.clear
      - set: {state.editor.ready: true}
      - call: recovering-task-queue.drain
        as: queue
      - if: "input.documentVersion != state.editor.version || input.editEpoch != vars.queue.value.epoch"
        then:
          - title: The webview's content is stale, post the authoritative document under a new epoch
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:510-512"
            call: markdown-editor-provider.post-authoritative-update
            input: {}
      - title: publishReady, then configurationChanged (highlightActiveBlock) to the renderer
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:514-518"
        call: markdown-editor-rpc-transport.send
        input: {kind: notification, method: configurationChanged, params: {highlightActiveBlock: true}}
      - return: null
  - component: markdown-editor-provider
    name: post-authoritative-update
    kind: function
    summary: "postAuthoritativeUpdate(epoch = editQueue.invalidate()): webviewText becomes the document text; when the webview is ready, send renderer.update { content, editEpoch }."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:426-436"]
    request: {type: object, properties: {epoch: {type: integer}}}
    behavior:
      - if: "!has(input.epoch)"
        then:
          - title: No epoch given, invalidate the queue so edits computed from the old text are skipped
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:426"
            call: recovering-task-queue.invalidate
            as: inv
          - set: {vars.epoch: "= vars.inv.value.epoch"}
        else:
          - set: {vars.epoch: "= input.epoch"}
      - set: {state.editor.webview_text: "= state.editor.text"}
      - if: "!state.editor.ready"
        then:
          - return: {posted: false, epoch: "= vars.epoch"}
      - title: renderer.update with the authoritative content and epoch
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:432-435"
        call: markdown-editor-rpc-transport.send
        input: {kind: request, method: update, params: {content: "= state.editor.text", editEpoch: "= vars.epoch"}}
      - return: {posted: true, epoch: "= vars.epoch"}
  - component: markdown-editor-provider
    name: host-edit
    kind: function
    summary: "edit: reject a malformed edit (negative or reversed offsets, non-integer epoch), ignore one from a stale epoch, else enqueue it on the RecoveringTaskQueue for its epoch."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:594-602", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:1330-1349"]
    request: {type: object, properties: {start: {type: integer, default: 0}, endExclusive: {type: integer, default: 0}, text: {type: string, default: ""}, editEpoch: {type: integer, default: 0}}}
    behavior:
      - if: "!(has(input.start) && has(input.endExclusive) && has(input.text) && has(input.editEpoch)) || input.start < 0 || input.endExclusive < input.start || input.editEpoch < 0"
        then:
          - title: readMarkdownEditorEdit refuses the message
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:595-598"
            fail: {code: invalid-markdown-editor-edit-range, status: 0, message: Invalid Markdown editor edit range}
      - call: recovering-task-queue.drain
        as: queue
      - if: "input.editEpoch != vars.queue.value.epoch"
        then:
          - title: Edit from a stale epoch, ignored (trace log)
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:599-602"
            return: {applied: false, ignored: true}
      - title: editQueue.enqueue(editEpoch, apply)
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:603"
        call: recovering-task-queue.enqueue
        input: {epoch: "= input.editEpoch", edit: "= input"}
        as: queued
      - return: "= vars.queued.value"
  - component: markdown-editor-provider
    name: apply-webview-edit
    kind: function
    summary: "The queued edit task: computeMarkdownEditorEdit maps the webview offsets onto the document (undefined when the range is past the webview text, which throws), then workspace.applyEdit replaces the range; a rejected edit throws; on success webviewText advances to the edited text."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:603-626", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:1351-1376"]
    request: {type: object, properties: {edit: {type: object}}}
    behavior:
      - if: "input.edit.endExclusive > size(state.editor.webview_text)"
        then:
          - title: The edit range is invalid for the current webview document
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:605-608"
            fail: {code: edit-range-invalid-for-webview-document, status: 0, message: "= 'Edit range ' + string(input.edit.start) + '-' + string(input.edit.endExclusive) + ' is invalid for the current webview document'"}
      - set: {vars.next: "= state.editor.webview_text.substring(0, input.edit.start) + input.edit.text + state.editor.webview_text.substring(input.edit.endExclusive, size(state.editor.webview_text))"}
      - title: workspace.applyEdit replaces the mapped range in the document
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:613-620"
        call: vscode-api.workspace-apply-edit
        input: {edit: {edits: [{resource: "= state.editor.uri", text: "= vars.next"}]}, extension_id: vscode.markdown-language-features}
        as: applied
      - if: "!vars.applied.value.applied"
        then:
          - title: The workspace rejected the edit
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:620-622"
            fail: {code: workspace-rejected-markdown-editor-edit, status: 0, message: Workspace rejected Markdown editor edit}
      - title: The document changed to the expected text; webviewText follows it in the same epoch
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:622-624"
        set:
          state.editor.text: "= vars.next"
          state.editor.version: "= state.editor.version + 1"
          state.editor.webview_text: "= vars.next"
      - return: {applied: true, version: "= state.editor.version"}
  - component: markdown-editor-provider
    name: host-open-link
    kind: function
    summary: "openLink: drain edits, let the link presentation service open links it owns (commit links), else resolve the href with the link opener; a '#' link to a heading of this same document is revealed inside the webview, anything else is opened by MdLinkOpener."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:574-592", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:1383-1395"]
    request: {type: object, required: [href], properties: {href: {type: string, examples: ["#usage"]}}}
    behavior:
      - call: recovering-task-queue.drain
      - title: "#tryOpenLink: the link presentation service's resolvers may open it (git commits)"
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:579-581"
        call: markdown-link-presentation-service.open-link
        input: {href: "= input.href", from_resource: "= state.editor.uri"}
        as: owned
      - if: "vars.owned.value.opened"
        then:
          - return: {opened: owned}
      - call: md-link-opener.resolve-document-link
        input: {link_text: "= input.href", from_resource: "= state.editor.uri"}
        as: target
      - if: "input.href.contains('#') && vars.target.value != null && vars.target.value.kind == 'file' && vars.target.value.uri == state.editor.uri && has(vars.target.value.line)"
        then:
          - title: A heading of this document, reveal it in the webview instead of opening an editor
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:585-590"
            call: markdown-editor-rpc-transport.send
            input: {kind: request, method: revealLinkTarget, params: {line: "= vars.target.value.line"}}
          - return: {opened: revealed}
      - title: openResolvedDocumentLink with the already resolved target
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:591"
        call: md-link-opener.open-resolved-document-link
        input: {link_text: "= input.href", from_resource: "= state.editor.uri", resolved: "= vars.target.value"}
        as: opened
      - return: {opened: "= vars.opened.value.how"}
  - component: markdown-editor-provider
    name: host-set-readonly
    kind: function
    summary: "setReadonly: remember the editor's mode and store it as the global markdown.editor.readonly default for the next Markdown editor."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:558-561", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:258-263"]
    request: {type: object, properties: {readonly: {type: boolean, default: false}}}
    behavior:
      - if: "state.editor.readonly == input.readonly && state.readonly_default == input.readonly"
        then:
          - return: {readonly: "= input.readonly", changed: false}
      - title: readonly = message.readonly; globalState.update('markdown.editor.readonly')
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:559-560"
        set:
          state.editor.readonly: "= input.readonly"
          state.readonly_default: "= input.readonly"
      - return: {readonly: "= input.readonly", changed: true}
  - component: markdown-editor-provider
    name: host-history
    kind: function
    summary: "history: drain pending edits, then run the built-in undo/redo command only while this panel is active, so the chord cannot race an edit or land on another document."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:562-573"]
    request: {type: object, properties: {command: {type: string, enum: [undo, redo], default: undo}}}
    behavior:
      - call: recovering-task-queue.drain
      - if: "!state.editor.panel_active"
        then:
          - title: Panel not active, the chord is dropped
            source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:570"
            return: {ran: false}
      - title: vscode.commands.executeCommand(undo|redo) on the active custom editor's resource
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:571"
        call: vscode-api.commands-execute-command
        input: {command: "= input.command", extension_id: vscode.markdown-language-features}
        on_error: continue
      - return: {ran: true}
  - component: markdown-editor-provider
    name: reload-webview
    kind: function
    summary: "reloadWebview (workspace trust granted, rich links setting or link presentation rules changed): reset navigation, clear rich links, cancel paste/rename/completion sessions, mark not ready, then enqueue a barrier that reconnects the webview under a new secret and reconfigures it at the barrier's epoch."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:657-678", "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:711-722"]
    request: {type: object, properties: {reason: {type: string, enum: [workspace-trust-granted, rich-links-setting, link-presentation-rules], default: workspace-trust-granted}}}
    behavior:
      - if: "!state.editor.open"
        then:
          - return: {reloaded: false}
      - call: markdown-editor-navigation.reset
      - call: markdown-editor-rich-link-controller.clear
      - call: markdown-editor-rename.cancel
        input: {}
      - call: markdown-editor-language-features.cancel
        input: {}
      - set: {state.editor.ready: false}
      - title: editQueue.enqueueBarrier reconnects and reconfigures the webview
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:664-673"
        call: recovering-task-queue.enqueue-barrier
        input: {barrier: reload-webview}
        as: barrier
      - return: {reloaded: true, epoch: "= vars.barrier.value.epoch"}
  - component: markdown-editor-provider
    name: reload-webview-barrier
    kind: function
    summary: "The reload barrier: unless resolution was cancelled, webviewText becomes the document text, the AuthenticatedWebview resets under a fresh secret and #configureWebview reapplies the resource roots (workspace resources only when trusted)."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:664-673"]
    request: {type: object, properties: {epoch: {type: integer}, workspace_trusted: {type: boolean, default: true}}}
    behavior:
      - if: "!state.editor.open"
        then:
          - return: {configured: false}
      - set: {state.editor.webview_text: "= state.editor.text"}
      - title: editorWebview.reset() - new secret, new connection
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:670"
        call: authenticated-webview.reset
        input: {reason: reload}
      - title: "#configureWebview(document, editorWebview, epoch)"
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:671"
        call: markdown-resources.get-markdown-local-resource-roots
        input: {resource: "= state.editor.uri", base_roots: ["file:///vscode/extensions/markdown-language-features/markdown-editor-out"], include_workspace_resources: true}
        as: roots
      - set: {state.editor.local_resource_roots: "= vars.roots.value.roots"}
      - return: {configured: true, epoch: "= input.epoch"}
  - component: markdown-editor-provider
    name: on-did-grant-workspace-trust
    kind: event
    summary: "workspace.onDidGrantWorkspaceTrust listener of a wired editor: reload the webview so it can load workspace resources."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:676-678"]
    behavior:
      - title: Trust granted, reloadWebview()
        source: "extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:677"
        call: markdown-editor-provider.reload-webview
        input: {reason: workspace-trust-granted}
        as: r
      - return: "= vars.r.value"
  - component: markdown-editor-provider
    name: execute-command
    kind: function
    summary: "executeCommand: forward a markdown.editor.* command to the active Markdown editor webview's renderer; ignored (trace log only) when no Markdown editor is active."
    sources: ["extensions/markdown-language-features/src/preview/markdownEditorProvider.ts:762-769"]
    request: {type: object, properties: {command: {type: string, examples: [markdown.editor.undo]}}}
    behavior:
      - if: "!state.active_webview"
        then:
          - title: No Markdown editor is active, the command is ignored
