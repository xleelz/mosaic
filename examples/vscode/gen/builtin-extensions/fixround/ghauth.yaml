- component: entra-token-exchange
  name: renew
  kind: function
  summary: 'renew: get a silent Microsoft token, exchange it at GitHub for a GitHub token, and verify with GET /user that it belongs to the
    linked GitHub account; a different account is AccountMismatch. A caller that named scopes gets those back.'
