configs:
- id: github-authentication-prefer-device-code-flow
  type: boolean
  value: false
  default: false
  summary: github-authentication.preferDeviceCodeFlow. Extension settings come from contributes.configuration; product.json does not override it.
  sources:
  - extensions/github-authentication/package.json:79-83
  - extensions/github-authentication/src/flows.ts:652
  attributes:
    key: github-authentication.preferDeviceCodeFlow
- id: github-enterprise-uris
  type: array
  value: []
  default: []
  summary: github-enterprise.uris (no default in package.json, so unset; modeled as an empty list).
  sources:
  - extensions/github-authentication/package.json:64-72
  - extensions/github-authentication/src/common/enterpriseConfiguration.ts:12-15
  attributes:
    key: github-enterprise.uris
- id: github-enterprise-uri
  type: string
  value: ''
  default: ''
  summary: github-enterprise.uri, the deprecated single-instance setting (no default, so unset; modeled as '').
  sources:
  - extensions/github-authentication/package.json:58-63
  - extensions/github-authentication/src/common/enterpriseConfiguration.ts:14
  attributes:
    key: github-enterprise.uri
components:
- id: github-authentication-extension
  name: vscode.github-authentication extension
  kind: module
  layer: extensions
  parent: builtin-extensions
  summary: 'Built-in extension vscode.github-authentication: activate registers the GitHub and GitHub Enterprise authentication providers.
    It has no commands and an empty activationEvents list (it activates on onAuthenticationRequest from its contributes.authentication).'
  sources:
  - extensions/github-authentication/src/extension.ts:13-90
  - extensions/github-authentication/package.json:26
  attributes:
    owner: builtin-extensions
    extension: vscode.github-authentication
    depth: modeled
  state:
    schema:
      type: object
      properties:
        activated:
          type: boolean
    initial:
      activated: false
- id: github-session-engine
  name: GitHubSessionEngine
  kind: service
  layer: extensions
  parent: github-authentication-extension
  summary: The github AuthenticationProvider. Holds the Keychain-backed (persisted) sessions and the process-only (transient) sessions brokered
    through Microsoft, and fires onDidChangeSessions.
  sources:
  - extensions/github-authentication/src/github.ts:171-273
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        service_id:
          type: string
        persisted_sessions:
          type: array
        transient_sessions:
          type: object
        restores_tried:
          type: array
        change_events:
          type: array
    initial:
      service_id: github.auth
      persisted_sessions: []
      transient_sessions: {}
      restores_tried: []
      change_events: []
- id: keychain
  name: Keychain
  kind: service
  layer: extensions
  parent: github-authentication-extension
  summary: The extension's view of its SecretStorage entry (context.secrets) under one service id; errors are logged and swallowed.
  sources:
  - extensions/github-authentication/src/common/keychain.ts:9-48
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        secrets:
          type: object
          description: service id -> the stored SessionData list (a non-list value stands for unparseable JSON)
        writes:
          type: integer
    initial:
      secrets: {}
      writes: 0
- id: github-server
  name: GitHubServer
  kind: service
  layer: extensions
  parent: github-authentication-extension
  summary: Talks to github.com (or a GitHub Enterprise host) for login flows, GET /user and token deletion.
  sources:
  - extensions/github-authentication/src/githubServer.ts:106-300
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        client_secret_configured:
          type: boolean
          description: Config.gitHubClientSecret; the source tree ships only the client id (config.ts:17-19), the secret is mixed in when
            VS Code is published.
        is_supported_client:
          type: boolean
        extension_host:
          type: string
    initial:
      client_secret_configured: false
      is_supported_client: true
      extension_host: local
- id: github-auth-flows
  name: GitHub sign-in flows (flows.ts)
  kind: module
  layer: extensions
  parent: github-authentication-extension
  summary: The four sign-in flows (local server, url handler, device code, personal access token), each with the targets, hosts and clients
    it supports, and getFlows, which filters and orders them.
  sources:
  - extensions/github-authentication/src/flows.ts:607-662
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        all_flows:
          type: array
    initial:
      all_flows:
      - {label: local server, dot_com: true, enterprise_server: false, hosted_enterprise: true, remote: false, web_worker: false, no_client_secret: false,
        supported_clients: true, unsupported_clients: true}
      - {label: url handler, dot_com: true, enterprise_server: false, hosted_enterprise: true, remote: true, web_worker: true, no_client_secret: false,
        supported_clients: true, unsupported_clients: false}
      - {label: device code, dot_com: true, enterprise_server: true, hosted_enterprise: true, remote: true, web_worker: false, no_client_secret: true,
        supported_clients: true, unsupported_clients: true}
      - {label: personal access token, dot_com: true, enterprise_server: true, hosted_enterprise: true, remote: true, web_worker: true, no_client_secret: true,
        supported_clients: false, unsupported_clients: true}
- id: account-links
  name: AccountLinks
  kind: service
  layer: extensions
  parent: github-authentication-extension
  summary: The Microsoft-to-GitHub account rows the user agreed to, in globalState under <serviceId>.microsoftAccountLinks.
  sources:
  - extensions/github-authentication/src/common/accountLinks.ts:57-141
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        links:
          type: array
    initial:
      links: []
- id: microsoft-authentication
  name: MicrosoftAuthentication
  kind: service
  layer: extensions
  parent: github-authentication-extension
  summary: The github-authentication extension's client of the microsoft provider (vscode.authentication.getAccounts/getSession('microsoft')).
    Its state holds the accounts the microsoft provider answers with; the exthost hop is not modeled because exthost's
    ext-host-authentication.get-accounts has no behavior.
  sources:
  - extensions/github-authentication/src/common/microsoftAuthentication.ts:60-75
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        accounts:
          type: array
    initial:
      accounts: []
- id: github-rest-api
  name: GitHub REST API
  kind: external
  layer: external
  parent: builtin-extensions
  summary: github.com's API as the extension uses it (GET /user, the Entra token exchange, DELETE /applications/{client}/token). Its state is
    the tokens it recognises.
  sources:
  - extensions/github-authentication/src/common/gitHubAccount.ts:27-68
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        tokens:
          type: object
          description: access token -> {id, login, avatar_url}
        entra_links:
          type: object
          description: Microsoft account label -> {token, github_account_id, granted_scopes}
        deleted_tokens:
          type: array
    initial:
      tokens: {}
      entra_links: {}
      deleted_tokens: []
- id: github-enterprise-authentication-provider
  name: GitHubEnterpriseAuthenticationProvider
  kind: service
  layer: extensions
  parent: github-authentication-extension
  summary: The github-enterprise provider. One host (with its own GitHubSessionEngine) per configured instance key; re-registers the provider
    with the hosts' authorization servers whenever the set changes.
  sources:
  - extensions/github-authentication/src/githubEnterprise.ts:40-264
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        hosts:
          type: array
        registered:
          type: boolean
        configuration_error:
          type: string
    initial:
      hosts: []
      registered: false
      configuration_error: Configure github-enterprise.uris before signing in to GitHub Enterprise.
- id: entra-token-exchange
  name: EntraTokenExchange
  kind: service
  layer: extensions
  parent: github-authentication-extension
  summary: Exchanges a Microsoft Entra token for a GitHub token (login, renew, probe) and verifies the account it belongs to.
  sources:
  - extensions/github-authentication/src/entraTokenExchange.ts:163-470
  attributes:
    owner: builtin-extensions
- id: enterprise-configuration
  name: GitHub Enterprise configuration and storage keys
  kind: module
  layer: extensions
  parent: github-authentication-extension
  summary: getEnterpriseUris (enterpriseConfiguration.ts) and getEnterpriseUriKey/getEnterpriseStorageKey (enterpriseStorage.ts).
  sources:
  - extensions/github-authentication/src/common/enterpriseConfiguration.ts:9-41
  - extensions/github-authentication/src/common/enterpriseStorage.ts:9-22
  attributes:
    owner: builtin-extensions
interfaces:
- component: github-authentication-extension
  name: activate
  kind: function
  summary: 'activate(): register the URI handler, create the github session engine and register it as the ''github'' provider, then read
    the enterprise configuration and update the github-enterprise provider (an invalid URI shows an error and is held as the provider''s
    configuration error).'
  sources:
  - extensions/github-authentication/src/extension.ts:13-68
  request:
    type: object
    properties:
      extension_id:
        type: string
        default: vscode.github-authentication
      activation_event:
        type: string
        default: onAuthenticationRequest:github
  behavior:
  - title: Register the URI handler that receives the OAuth redirect
    source: extensions/github-authentication/src/extension.ts:14-16
    call: vscode-api.window-register-uri-handler
    input:
      extension_id: vscode.github-authentication
      handler: {kind: UriEventHandler}
  - title: new GitHubSessionEngine reads the persisted sessions from the keychain
    source: extensions/github-authentication/src/extension.ts:18
    call: github-session-engine.initialize
  - title: Register the 'github' authentication provider
    source: extensions/github-authentication/src/extension.ts:20-23
    call: vscode-api.authentication-register-authentication-provider
    input:
      extension_id: vscode.github-authentication
      id: github
      label: GitHub
      provider: {kind: GitHubSessionEngine}
      options: {supportsMultipleAccounts: true}
  - title: Read github-enterprise.uris (or the legacy github-enterprise.uri)
    source: extensions/github-authentication/src/extension.ts:27-31
    call: enterprise-configuration.get-enterprise-uris
    input:
      uris: = config['github-enterprise-uris']
      legacy_uri: = config['github-enterprise-uri']
    as: uris
    on_error: continue
  - if: '!vars.uris.ok'
    then:
    - title: An invalid instance URI clears the enterprise hosts, keeps the message as the provider's error, and shows it
      source: extensions/github-authentication/src/extension.ts:32-39
      call: github-enterprise-authentication-provider.update
      input:
        uris: []
        error: = vars.uris.error.message
    - call: vscode-api.window-show-error-message
      input:
        extension_id: vscode.github-authentication
        message: = vars.uris.error.message
    else:
    - title: Update the github-enterprise provider with the configured instances
      source: extensions/github-authentication/src/extension.ts:41-43
      call: github-enterprise-authentication-provider.update
      input:
        uris: = vars.uris.value.uris
  - set:
      state.activated: true
  - return:
      activated: true
- component: github-session-engine
  name: initialize
  kind: function
  summary: 'The constructor: picks the keychain service id (github.auth for github.com) and starts reading the persisted sessions; secret
    changes later call checkForUpdates.'
  sources:
  - extensions/github-authentication/src/github.ts:217-273
  behavior:
  - title: _persistedSessionsPromise = readSessions()
    source: extensions/github-authentication/src/github.ts:251-255
    call: github-session-engine.read-sessions
    as: read
  - set:
      state.persisted_sessions: = vars.read.value.sessions
  - return:
      sessions: = vars.read.value.sessions
- component: github-session-engine
  name: read-sessions
  kind: function
  summary: 'readSessions: parse the keychain entry (deleting it when it is not JSON), hydrate sessions that have no account with GET /user,
    drop sessions whose token is Unauthorized, and write back only when an account id was a number or a session was dropped; account data
    found while reading is never written back.'
  sources:
  - extensions/github-authentication/src/github.ts:703-792
  response:
    type: object
    properties:
      sessions:
        type: array
  behavior:
  - title: Read the stored sessions from the keychain
    source: extensions/github-authentication/src/github.ts:705-711
    call: keychain.get-token
    input:
      service_id: = state.service_id
    as: tok
  - if: vars.tok.value.secret == null
    then:
    - return:
        sessions: []
  - if: type(vars.tok.value.secret) != list
    then:
    - title: The entry is not JSON; delete it and read no sessions
      source: extensions/github-authentication/src/github.ts:713-721
      call: keychain.delete-token
      input:
        service_id: = state.service_id
    - return:
        sessions: []
  - title: Verify every stored session concurrently (Promise.allSettled)
    source: extensions/github-authentication/src/github.ts:731-783
    parallel: = vars.tok.value.secret
    as: stored
    as_result: verified
    steps:
    - if: '!has(vars.stored.account)'
      then:
      - title: An accountless session is hydrated with GET /user
        source: extensions/github-authentication/src/github.ts:735-744
        call: github-server.get-user-info
        input:
          token: = vars.stored.access_token
        as: user
        on_error: continue
      - if: '!vars.user.ok && vars.user.error.message == ''Unauthorized'''
        then:
        - return: = null
      - return:
          id: = vars.stored.id
          account:
            label: '= vars.user.ok ? vars.user.value.account_name : ''<unknown>'''
            id: '= vars.user.ok ? vars.user.value.id : ''<unknown>'''
            icon: '= vars.user.ok ? vars.user.value.avatar_url : null'
          scopes: = vars.stored.scopes
          access_token: = vars.stored.access_token
          authorization_server: '= has(vars.stored.authorization_server) ? vars.stored.authorization_server : ''https://github.com/login/oauth'''
    - title: A stored account keeps its label and icon; its id is read as a string; a hydrated one takes GET /user's login, id and avatarUrl as icon
      source: extensions/github-authentication/src/github.ts:749-777
      return:
        id: = vars.stored.id
        account:
          label: '= has(vars.stored.account.label) ? vars.stored.account.label : ''<unknown>'''
          id: = string(vars.stored.account.id)
          icon: '= has(vars.stored.account.icon) ? vars.stored.account.icon : null'
        scopes: = vars.stored.scopes
        access_token: = vars.stored.access_token
        authorization_server: '= has(vars.stored.authorization_server) ? vars.stored.authorization_server : ''https://github.com/login/oauth'''
  - set:
      vars.sessions: = vars.verified.results.filter(r, r.ok && r.value != null).map(r, r.value)
  - if: vars.tok.value.secret.exists(s, has(s.account) && type(s.account.id) == int) || size(vars.sessions) != size(vars.tok.value.secret)
    then:
    - title: Migrate numeric account ids or forget dropped sessions by re-storing
      source: extensions/github-authentication/src/github.ts:786-789
      call: github-session-engine.store-sessions
      input:
        sessions: = vars.sessions
  - return:
      sessions: = vars.sessions
- component: github-session-engine
  name: store-sessions
  kind: function
  summary: storeSessions replaces the persisted sessions and writes them to the keychain.
  sources:
  - extensions/github-authentication/src/github.ts:794-802
  request:
    type: object
    required: [sessions]
    properties:
      sessions:
        type: array
  behavior:
  - set:
      state.persisted_sessions: = input.sessions
  - call: keychain.set-token
    input:
      service_id: = state.service_id
      value: = input.sessions
  - return:
      stored: = size(input.sessions)
- component: github-session-engine
  name: check-for-updates
  kind: function
  summary: 'checkForUpdates (on secrets.onDidChange): re-read the keychain and fire onDidChangeSessions with the sessions another window
    added or removed; transient sessions are never diffed.'
  sources:
  - extensions/github-authentication/src/github.ts:669-701
  behavior:
  - set:
      vars.previous: = state.persisted_sessions
  - call: github-session-engine.read-sessions
    as: read
  - set:
      state.persisted_sessions: = vars.read.value.sessions
  - set:
      vars.added: = vars.read.value.sessions.filter(s, !vars.previous.exists(p, p.id == s.id))
      vars.removed: = vars.previous.filter(p, !vars.read.value.sessions.exists(s, s.id == p.id))
  - if: size(vars.added) > 0 || size(vars.removed) > 0
    then:
    - title: Fire onDidChangeSessions with the keychain diff
      source: extensions/github-authentication/src/github.ts:697-700
      set:
        state.change_events: '= state.change_events + [{''added'': vars.added.map(s, s.id), ''removed'': vars.removed.map(s, s.id)}]'
  - return:
      added: = vars.added.map(s, s.id)
      removed: = vars.removed.map(s, s.id)
- component: github-session-engine
  name: get-sessions
  kind: function
  summary: 'getSessions: the workbench''s Microsoft-link probe is answered separately; otherwise the persisted and transient sessions are
    narrowed to the requested scopes (order ignored) and account, then sessions the user has linked through Microsoft are restored.'
  sources:
  - extensions/github-authentication/src/github.ts:307-332
  request:
    type: object
    properties:
      scopes:
        type: array
      options:
        type: object
  response:
    type: object
    properties:
      sessions:
        type: array
  behavior:
  - if: has(input.options) && '_workbenchEntraExchangeProbe' in input.options
    then:
    - title: The workbench's Microsoft-link probe needs a list of subject tokens
      source: extensions/github-authentication/src/github.ts:342-346
      if: type(input.options._workbenchEntraExchangeProbe) != map || !has(input.options._workbenchEntraExchangeProbe.subjectTokens) || type(input.options._workbenchEntraExchangeProbe.subjectTokens)
        != list
      then:
      - fail:
          code: the-microsoft-link-probe-requires-a-list-of-subject-tokens
          message: The Microsoft link probe requires a list of subject tokens.
    - return:
        sessions: []
  - set:
      vars.scopes: '= has(input.scopes) ? input.scopes.sort() : []'
      vars.candidates: = state.persisted_sessions + state.transient_sessions.transformList(k, v, v)
  - title: Keep the sessions whose sorted scopes equal the request's, for the requested account
    source: extensions/github-authentication/src/github.ts:320-326
    set:
      vars.wanted: = vars.candidates.filter(s, (size(vars.scopes) == 0 || s.scopes.sort() == vars.scopes) && (!has(input.options) || !has(input.options.account)
        || s.account.label == input.options.account.label))
  - title: Restore sessions for linked Microsoft accounts that have none here
    source: extensions/github-authentication/src/github.ts:328-331
    call: github-session-engine.restore
    input:
      scopes: = vars.scopes
      already: = vars.wanted
    as: restored
  - return:
      sessions: = vars.wanted + vars.restored.value.sessions
- component: github-session-engine
  name: restore
  kind: function
  summary: 'restore/restoreNow: for each linked account with no session in the answer and no failed attempt for these scopes, check its
    Microsoft account is signed in, exchange a Microsoft token for a GitHub one, verify it names the linked GitHub account, and publish
    a transient session. A wrong account unlinks the row; every failure is remembered so it is not retried on every read.'
  sources:
  - extensions/github-authentication/src/github.ts:376-399
  - extensions/github-authentication/src/github.ts:420-470
  request:
    type: object
    properties:
      scopes:
        type: array
      already:
        type: array
  response:
    type: object
    properties:
      sessions:
        type: array
  behavior:
  - call: account-links.linked-accounts
    as: links
  - set:
      vars.missing: = vars.links.value.links.filter(l, !input.already.exists(s, s.account.label == l.github_account_label) && !((l.github_account_label
        + ' ' + input.scopes.join(' ')) in state.restores_tried))
  - if: size(vars.missing) == 0
    then:
    - return:
        sessions: []
  - call: microsoft-authentication.get-accounts
    as: ms
  - set:
      vars.restored: []
  - foreach: = vars.missing
    as: link
    steps:
    - set:
        vars.key: = vars.link.github_account_label + ' ' + input.scopes.join(' ')
    - if: '!vars.ms.value.accounts.exists(a, a.label == vars.link.microsoft_account_label)'
      then:
      - title: Its Microsoft account is not signed in; give up and remember the attempt
        source: extensions/github-authentication/src/github.ts:422-428
        set:
          state.restores_tried: = state.restores_tried + [vars.key]
      - continue: true
    - title: Exchange a Microsoft token for a GitHub token and verify the account
      source: extensions/github-authentication/src/github.ts:430-436
      call: entra-token-exchange.renew
      input:
        scopes: = input.scopes
        github_account_id: = vars.link.github_account_id
        microsoft_account_label: = vars.link.microsoft_account_label
      as: renewed
      on_error: continue
    - if: '!vars.renewed.ok'
      then:
      - set:
          state.restores_tried: = state.restores_tried + [vars.key]
      - if: vars.renewed.error.code == 'account-mismatch'
        then:
        - title: GitHub named a different account; forget the row
          source: extensions/github-authentication/src/github.ts:442-453
          call: account-links.unlink-github-account
          input:
            github_account_label: = vars.link.github_account_label
      - continue: true
    - if: size(vars.renewed.value.scopes) == 0
      then:
      - title: GitHub did not say what the token can do; nothing to label the session with
        source: extensions/github-authentication/src/github.ts:456-462
        set:
          state.restores_tried: = state.restores_tried + [vars.key]
      - continue: true
    - title: Publish a process-lifetime session for the restored token
      source: extensions/github-authentication/src/github.ts:468-470
      set:
        vars.session: '= {''id'': ''restored-'' + vars.renewed.value.account.id, ''account'': {''label'': vars.renewed.value.account.account_name,
          ''id'': vars.renewed.value.account.id}, ''scopes'': vars.renewed.value.scopes, ''access_token'': vars.renewed.value.token, ''expires_at'':
          now + vars.renewed.value.expires_after_ms}'
    - set:
        state.transient_sessions: = merge(state.transient_sessions, {vars.session.id:vars.session})
        vars.restored: = vars.restored + [vars.session]
  - if: size(vars.restored) > 0
    then:
    - title: Fire onDidChangeSessions with the restored sessions
      source: extensions/github-authentication/src/github.ts:394-397
      set:
        state.change_events: '= state.change_events + [{''added'': vars.restored.map(s, s.id), ''removed'': []}]'
  - return:
      sessions: = vars.restored
- component: github-session-engine
  name: create-session
  kind: function
  summary: 'createSession: validate the options, log in through GitHubServer with the sorted scopes, resolve the token''s account with GET
    /user, replace a persisted session of the same account and scopes (or add one), store, and fire onDidChangeSessions. A cancelled login
    is rethrown silently; any other error shows "Sign in failed" first.'
  sources:
  - extensions/github-authentication/src/github.ts:804-877
  request:
    type: object
    required: [scopes]
    properties:
      scopes:
        type: array
      options:
        type: object
  response:
    type: object
    properties:
      id:
        type: string
      account:
        type: object
      scopes:
        type: array
  errors:
  - {code: cancelled, status: 0, retryable: false}
  - {code: provider-is-invalid, status: 0, retryable: false}
  - {code: no-auth-flow-succeeded, status: 0, retryable: false}
  behavior:
  - if: has(input.options) && has(input.options.provider) && !(input.options.provider in ['google', 'apple', 'microsoft'])
    then:
    - title: isGitHubAuthenticationProviderOptions rejects an unknown sign-in provider
      source: extensions/github-authentication/src/github.ts:85-92
      call: vscode-api.window-show-error-message
      input:
        extension_id: vscode.github-authentication
        message: '= ''Sign in failed: Error: Provider is invalid: '' + input.options.provider'
    - fail:
        code: provider-is-invalid
        message: '= ''Provider is invalid: '' + input.options.provider'
  - set:
      vars.sorted: = input.scopes.sort()
  - title: GitHubServer.login runs the sign-in flows
    source: extensions/github-authentication/src/github.ts:837-839
    call: github-server.login
    input:
      scopes: = vars.sorted.join(' ')
    as: token
    on_error: continue
  - if: '!vars.token.ok'
    then:
    - if: vars.token.error.code != 'cancelled'
      then:
      - title: Any failure other than a cancellation tells the user
        source: extensions/github-authentication/src/github.ts:871-875
        call: vscode-api.window-show-error-message
        input:
          extension_id: vscode.github-authentication
          message: '= ''Sign in failed: Error: '' + vars.token.error.message'
    - fail:
        code: = vars.token.error.code
        message: = vars.token.error.message
  - title: tokenToSession asks GET /user who the token belongs to
    source: extensions/github-authentication/src/github.ts:968-972
    call: github-server.get-user-info
    input:
      token: = vars.token.value.token
    as: user
  - set:
      vars.session:
        id: = 'session-' + string(size(state.persisted_sessions) + size(state.change_events) + 1)
        account:
          label: = vars.user.value.account_name
          id: = vars.user.value.id
          icon: = vars.user.value.avatar_url
        scopes: = input.scopes
        access_token: = vars.token.value.token
        authorization_server: https://github.com/login/oauth
  - title: Replace the persisted session with the same account and scopes, or append
    source: extensions/github-authentication/src/github.ts:843-850
    set:
      vars.removed: = state.persisted_sessions.filter(s, s.account.id == vars.session.account.id && s.scopes.sort() == vars.sorted)
      vars.kept: = state.persisted_sessions.filter(s, !(s.account.id == vars.session.account.id && s.scopes.sort() == vars.sorted))
  - call: github-session-engine.store-sessions
    input:
      sessions: = vars.kept + [vars.session]
  - title: Fire onDidChangeSessions
    source: extensions/github-authentication/src/github.ts:852-853
    set:
      state.change_events: '= state.change_events + [{''added'': [vars.session.id], ''removed'': vars.removed.map(s, s.id)}]'
  - return: = vars.session
- component: github-session-engine
  name: remove-session
  kind: function
  summary: 'removeSession: a transient session is just dropped; a persisted one is removed from the keychain, deleted on the server where
    possible, and its Microsoft link forgotten once the account has no session left. An unknown id is only logged.'
  sources:
  - extensions/github-authentication/src/github.ts:974-1017
  request:
    type: object
    required: [id]
    properties:
      id:
        type: string
  behavior:
  - if: input.id in state.transient_sessions
    then:
    - set:
        vars.session: = state.transient_sessions[input.id]
    - title: A transient session is only dropped from memory
      source: extensions/github-authentication/src/github.ts:983-990
      set:
        state.transient_sessions: = omit(state.transient_sessions, input.id)
    - call: github-session-engine.forget-account-link-if-signed-out
      input:
        label: = vars.session.account.label
    - set:
        state.change_events: '= state.change_events + [{''added'': [], ''removed'': [input.id]}]'
    - return:
        removed: true
  - if: '!state.persisted_sessions.exists(s, s.id == input.id)'
    then:
    - title: Session not found (logged)
      source: extensions/github-authentication/src/github.ts:1004-1005
      return:
        removed: false
  - set:
      vars.session: = state.persisted_sessions.filter(s, s.id == input.id)[0]
  - call: github-session-engine.store-sessions
    input:
      sessions: = state.persisted_sessions.filter(s, s.id != input.id)
  - title: Delete the token on the server
    source: extensions/github-authentication/src/github.ts:999-1001
    call: github-server.logout
    input:
      session: = vars.session
  - call: github-session-engine.forget-account-link-if-signed-out
    input:
      label: = vars.session.account.label
  - set:
      state.change_events: '= state.change_events + [{''added'': [], ''removed'': [input.id]}]'
  - return:
      removed: true
- component: github-session-engine
  name: forget-account-link-if-signed-out
  kind: function
  summary: forgetAccountLinkIfSignedOut unlinks a GitHub account's Microsoft row only once no persisted or transient session remains for it.
  sources:
