- component: enterprise-configuration
  name: get-enterprise-uri-key
  kind: function
  summary: getEnterpriseUriKey normalizes an instance URI (lower-case scheme, no trailing slashes); the keychain key adds .ghes.auth.
  sources:
  - extensions/github-authentication/src/common/enterpriseStorage.ts:13-22
  request:
    type: object
    properties:
      uri:
        type: string
  behavior:
  - set:
      vars.parts: = input.uri.split('://')
  - if: size(vars.parts) != 2
    then:
    - fail:
        code: invalid-github-enterprise-instance-uri
        message: = 'Invalid GitHub Enterprise instance URI:' + ' ' + input.uri
  - set:
      vars.rest: "= vars.parts[1].endsWith('/') ? vars.parts[1].substring(0, size(vars.parts[1]) - 1) : vars.parts[1]"
  - return:
      key: = vars.parts[0].lowerAscii() + '://' + vars.rest
      storage_key: = vars.parts[0].lowerAscii() + '://' + vars.rest + '.ghes.auth'
- component: github-enterprise-authentication-provider
  name: update
  kind: function
  summary: 'update/applyConfiguration: dedupe the instance keys; with the provider registered and no host added or retired nothing happens;
    otherwise hosts are created (each with a GitHubSessionEngine keyed <uri>.ghes.auth), retired ones dropped, and the provider re-registered
    with the hosts'' authorization servers. The configuration error is what a sign-in without hosts reports.'
  sources:
  - extensions/github-authentication/src/githubEnterprise.ts:54-105
  - extensions/github-authentication/src/githubEnterprise.ts:144-160
  request:
    type: object
    properties:
      uris:
        type: array
      error:
        type: string
  behavior:
  - set:
      vars.keys: []
  - foreach: = input.uris
    as: u
    steps:
    - call: enterprise-configuration.get-enterprise-uri-key
      input:
        uri: = vars.u
      as: k
    - if: '!(vars.k.value.key in vars.keys)'
      then:
      - set:
          vars.keys: = vars.keys + [vars.k.value.key]
  - set:
      vars.keys: = vars.keys.sort()
      state.configuration_error: '= has(input.error) ? input.error : ''Configure github-enterprise.uris before signing in to GitHub Enterprise.'''
  - set:
      vars.added: = vars.keys.filter(k, !(k in state.hosts))
      vars.retired: = state.hosts.filter(k, !(k in vars.keys))
  - if: state.registered && size(vars.added) == 0 && size(vars.retired) == 0
    then:
    - title: Registered and nothing changed
      source: extensions/github-authentication/src/githubEnterprise.ts:82-84
      return:
        hosts: = state.hosts
  - title: Commit the hosts and re-register the provider
    source: extensions/github-authentication/src/githubEnterprise.ts:144-160
    call: vscode-api.authentication-register-authentication-provider
    input:
      extension_id: vscode.github-authentication
      id: github-enterprise
      label: GitHub Enterprise
      provider: {kind: GitHubEnterpriseAuthenticationProvider}
      options:
        supportsMultipleAccounts: true
        supportedAuthorizationServers: = vars.keys.map(k, k + '/login/oauth')
  - set:
      state.hosts: = vars.keys
      state.registered: true
  - return:
      hosts: = vars.keys
- component: github-enterprise-authentication-provider
  name: create-session
  kind: function
  summary: 'createSession: with no configured host it throws the configuration error; with several the user picks one; the chosen host''s
    engine signs in.'
  sources:
  - extensions/github-authentication/src/githubEnterprise.ts:181-207
  request:
    type: object
    properties:
      scopes:
        type: array
  errors:
  - {code: github-enterprise-not-configured, status: 0, retryable: false}
  behavior:
  - if: size(state.hosts) == 0
    then:
    - title: No configured instance; throw the configuration error
      source: extensions/github-authentication/src/githubEnterprise.ts:183-187
      fail:
        code: github-enterprise-not-configured
        message: = state.configuration_error
  - title: The (single or picked) host's engine signs in; its per-host engine is not modeled separately
    source: extensions/github-authentication/src/githubEnterprise.ts:188-205
    return:
      host: = state.hosts[0]
- component: vscode-api
  name: window-register-uri-handler
  kind: function
  summary: vscode.window.registerUriHandler(handler) -> ExtHostUrls.registerUriHandler(extension, handler).
  sources:
  - src/vscode-dts/vscode.d.ts:11727
  - src/vs/workbench/api/common/extHost.api.impl.ts:1018-1020
  request:
    type: object
    required: [extension_id, handler]
    properties:
      handler:
        type: object
        description: 'handler: UriHandler'
      extension_id:
        type: string
        examples: [vscode.git]
        description: 'the calling extension (implicit: each extension gets its own vscode namespace)'
  response: ExthostApiResult
  errors:
  - {code: protocol-handler-already-registered, status: 0, retryable: false}
  attributes:
    boundary: true
    owner: exthost
- component: vscode-api
  name: authentication-register-authentication-provider
  kind: function
  summary: vscode.authentication.registerAuthenticationProvider -> extHostAuthentication.registerAuthenticationProvider.
  sources:
  - src/vscode-dts/vscode.d.ts:18186
  - src/vs/workbench/api/common/extHost.api.impl.ts:371-376
  request:
    type: object
    required: [extension_id, id, label, provider]
    properties:
      id:
        type: string
        description: 'id: string'
      label:
        type: string
        description: 'label: string'
      provider:
        type: object
        description: 'provider: AuthenticationProvider'
      options:
        type: object
        description: 'options?: AuthenticationProviderOptions'
      extension_id:
        type: string
        examples: [vscode.git]
        description: 'the calling extension (implicit: each extension gets its own vscode namespace)'
  response: ExthostApiResult
  attributes:
    boundary: true
    owner: exthost
flows:
- id: github-authentication-activate
  name: vscode.github-authentication activation
  tags: [writes]
  sources:
  - extensions/github-authentication/src/extension.ts:13-68
  entry:
    caller: exthost-runtime
    interface: github-authentication-extension.activate
    input:
      extension_id: vscode.github-authentication
      activation_event: onAuthenticationRequest:github
- id: github-authentication-get-sessions
  name: The github provider answers getSessions
  sources:
  - extensions/github-authentication/src/github.ts:307-332
  entry:
    caller: exthost-runtime
    interface: github-session-engine.get-sessions
    input:
      scopes: [repo]
- id: github-authentication-create-session
  name: The github provider signs in (createSession)
  tags: [writes]
  sources:
  - extensions/github-authentication/src/github.ts:804-877
  entry:
    caller: exthost-runtime
    interface: github-session-engine.create-session
    input:
      scopes: [repo]
- id: github-authentication-remove-session
  name: The github provider signs out (removeSession)
  tags: [writes]
  sources:
  - extensions/github-authentication/src/github.ts:974-1017
  entry:
    caller: exthost-runtime
    interface: github-session-engine.remove-session
    input:
      id: s1
- id: github-authentication-secrets-changed
  name: Another window changed the stored sessions (secrets.onDidChange)
  tags: [writes]
  sources:
  - extensions/github-authentication/src/github.ts:261
  entry:
    caller: exthost-runtime
    interface: github-session-engine.check-for-updates
- id: github-authentication-enterprise-sign-in
  name: Sign in to GitHub Enterprise
  sources:
  - extensions/github-authentication/src/githubEnterprise.ts:181-207
  entry:
    caller: exthost-runtime
    interface: github-enterprise-authentication-provider.create-session
    input:
      scopes: [repo]
- id: github-authentication-get-flows
  name: Which sign-in flows apply (getFlows)
  sources:
  - extensions/github-authentication/src/flows.ts:614-662
  entry:
    caller: exthost-runtime
    interface: github-auth-flows.get-flows
    input:
      target: dot-com
      extension_host: local
      is_supported_client: true
      client_secret_configured: false
scenarios:
- id: builtin-extensions-github-auth-activate-then-sessions
  description: Activation reads the stored session and registers both providers; getSessions then returns it.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: s1, scopes: [repo, read:user], access_token: gho_a, account: {id: '1', label: dev}}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-get-sessions
    as: read
    input:
      scopes: [read:user, repo]
  expect:
  - "steps.read.result.value.sessions.map(s, s.id) == ['s1']"
  - "state['github-session-engine@eh1'].persisted_sessions[0].account.label == 'dev'"
  - "state['github-enterprise-authentication-provider@eh1'].registered && state['github-enterprise-authentication-provider@eh1'].hosts == []"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'vscode-api.authentication-register-authentication-provider').map(e, e.input.id) == ['github', 'github-enterprise']"
  - "state['keychain@eh1'].writes == 0"
- id: builtin-extensions-github-auth-sessions-no-write-loop
  description: 'github.test.ts:36: an accountless stored session is hydrated with one GET /user and is not written back, so a secret store
    that drops account data cannot loop.'
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: session-id, scopes: [repo], access_token: access-token}
    github-rest-api:
      tokens:
        access-token: {id: account-id, login: octocat, avatar_url: 'https://avatars.githubusercontent.com/u/1'}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "calls['github-rest-api.get-user'] == 1"
  - "state['keychain@eh1'].writes == 0"
  - "steps.read.result.value.sessions[0].account == {'label': 'octocat', 'id': 'account-id', 'icon': 'https://avatars.githubusercontent.com/u/1'}"
  - "steps.read.result.value.sessions[0].authorization_server == 'https://github.com/login/oauth'"
- id: builtin-extensions-github-auth-numeric-account-id-migrated
  description: A stored numeric account id is rewritten as a string.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: s1, scopes: [repo], access_token: gho_a, account: {id: 42, label: dev}}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "state['keychain@eh1'].writes == 1"
  - "state['keychain@eh1'].secrets['github.auth'][0].account.id == '42'"
  - "steps.read.result.value.sessions[0].account.id == '42'"
- id: builtin-extensions-github-auth-unauthorized-session-dropped
  description: An accountless session whose token GitHub rejects is dropped and the rest are re-stored.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: s1, scopes: [repo], access_token: revoked}
        - {id: s2, scopes: [repo], access_token: gho_b, account: {id: '7', label: dev}}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "steps.read.result.value.sessions.map(s, s.id) == ['s2']"
  - "state['keychain@eh1'].writes == 1 && size(state['keychain@eh1'].secrets['github.auth']) == 1"
- id: builtin-extensions-github-auth-corrupt-entry-deleted
  description: A keychain entry that is not JSON is deleted and no sessions are read.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth: not-json
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "steps.read.result.value.sessions == []"
  - '!(''github.auth'' in state[''keychain@eh1''].secrets)'
- id: builtin-extensions-github-auth-create-then-sessions
  description: Signing in with the device code flow stores the session; getSessions then finds it by scopes in any order.
  fixtures: [one-window-folder]
  state:
    github-rest-api:
      tokens:
        gho_dev_token: {id: 9, login: dev}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-create-session
    as: create
    input:
      scopes: [repo, read:user]
  - flow: github-authentication-get-sessions
    as: read
    input:
      scopes: [read:user, repo]
  expect:
  - "steps.create.result.value.account == {'label': 'dev', 'id': '9', 'icon': null}"
  - "size(steps.read.result.value.sessions) == 1 && steps.read.result.value.sessions[0].access_token == 'gho_dev_token'"
  - "state['keychain@eh1'].writes == 1"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'github-auth-flows.trigger' && e.input.label == 'device code')"
  - "size(state['github-session-engine@eh1'].change_events) == 1"
- id: builtin-extensions-github-auth-create-replaces-same-account
  description: Signing in again for the same account and scopes replaces the old session.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: old, scopes: [repo], access_token: gho_old, account: {id: '9', label: dev}}
    github-rest-api:
      tokens:
        gho_dev_token: {id: 9, login: dev}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-create-session
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "steps.read.result.value.sessions.map(s, s.access_token) == ['gho_dev_token']"
  - "state['github-session-engine@eh1'].change_events[0].removed == ['old']"
- id: builtin-extensions-github-auth-create-cancelled
  description: Dismissing the device code prompt cancels sign-in without an error message (the only flow without a client secret).
  fixtures: [one-window-folder]
  flow: github-authentication-create-session
  choices:
    github-auth-flows.trigger.outcome: cancelled
  expect:
  - '!result.ok && result.error.code == ''cancelled'''
  - "calls['vscode-api.window-show-error-message'] == 0"
  - "state['keychain@eh1'].writes == 0"
- id: builtin-extensions-github-auth-create-fallback-declined
  description: With a client secret the local server flow goes first; when it times out the user is asked to try another way and declines.
  fixtures: [one-window-folder]
  flow: github-authentication-create-session
  state:
    github-server:
      client_secret_configured: true
  choices:
    github-auth-flows.trigger.outcome: cancelled
    github-server.login.try_another: 'no'
  expect:
  - '!result.ok && result.error.code == ''cancelled'''
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'github-auth-flows.trigger').map(e, e.input.label) == ['local server']"
  - "calls['vscode-api.window-show-warning-message'] == 1"
- id: builtin-extensions-github-auth-create-all-flows-fail
  description: Every flow timing out ends with "No auth flow succeeded" and an error message.
  fixtures: [one-window-folder]
  flow: github-authentication-create-session
  choices:
    github-auth-flows.trigger.outcome: timed_out
  expect:
  - "state['keychain@eh1'].writes == 0 && size(state['github-session-engine@eh1'].change_events) == 0"
  - '!result.ok && result.error.code == ''no-auth-flow-succeeded'''
  - "calls['vscode-api.window-show-error-message'] == 1"
- id: builtin-extensions-github-auth-create-invalid-provider
  description: An unknown sign-in provider option is rejected and reported.
  fixtures: [one-window-folder]
  flow: github-authentication-create-session
  input:
    scopes: [repo]
    options: {provider: gitlab}
  expect:
  - "state['keychain@eh1'].writes == 0 && size(state['github-session-engine@eh1'].change_events) == 0"
  - '!result.ok && result.error.code == ''provider-is-invalid'''
  - "calls['vscode-api.window-show-error-message'] == 1"
  - "calls['github-server.login'] == 0"
- id: builtin-extensions-github-auth-remove-then-sessions
  description: Signing out removes the stored session; without a client secret the token is not deleted on the server.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: s1, scopes: [repo], access_token: gho_a, account: {id: '1', label: dev}}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-remove-session
    as: rm
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "steps.rm.result.value.removed"
  - "steps.read.result.value.sessions == []"
  - "state['keychain@eh1'].secrets['github.auth'] == []"
  - "calls['github-rest-api.delete-token'] == 0"
- id: builtin-extensions-github-auth-remove-deletes-oauth-token
  description: With a client secret, signing out of an OAuth (gho_) token deletes it on the server and forgets its Microsoft link.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: s1, scopes: [repo], access_token: gho_a, account: {id: '1', label: dev}}
    github-server:
      client_secret_configured: true
    account-links:
      links:
      - {microsoft_account_label: dev@contoso.com, github_account_label: dev, github_account_id: '1'}
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-remove-session
  expect:
  - "state['github-rest-api@eh1'].deleted_tokens == ['gho_a']"
  - "state['account-links@eh1'].links == []"
- id: builtin-extensions-github-auth-remove-unknown
  description: An unknown session id is only logged.
  fixtures: [one-window-folder]
  flow: github-authentication-remove-session
  input: {id: nope}
  expect:
  - "result.ok && !result.value.removed"
  - "state['keychain@eh1'].writes == 0"
- id: builtin-extensions-github-auth-other-window-signed-in
  description: Another window stored a session; checkForUpdates adds it and fires onDidChangeSessions.
  fixtures: [one-window-folder]
  state:
    keychain:
      secrets:
        github.auth:
        - {id: s9, scopes: [repo], access_token: gho_c, account: {id: '3', label: dev}}
  steps:
  - flow: github-authentication-secrets-changed
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "state['github-session-engine@eh1'].change_events == [{'added': ['s9'], 'removed': []}]"
  - "steps.read.result.value.sessions.map(s, s.id) == ['s9']"
- id: builtin-extensions-github-auth-other-window-signed-out
  description: Another window removed the stored session; checkForUpdates reports it removed.
  fixtures: [one-window-folder]
  state:
    github-session-engine:
      persisted_sessions:
      - {id: s9, scopes: [repo], access_token: gho_c, account: {id: '3', label: dev}}
  steps:
  - flow: github-authentication-secrets-changed
  - flow: github-authentication-get-sessions
    as: read
  expect:
  - "state['github-session-engine@eh1'].change_events == [{'added': [], 'removed': ['s9']}]"
  - "steps.read.result.value.sessions == []"
- id: builtin-extensions-github-auth-probe-invalid
  description: The workbench's Microsoft-link probe without subject tokens is rejected.
  fixtures: [one-window-folder]
  flow: github-authentication-get-sessions
  input:
    options:
      _workbenchEntraExchangeProbe: {}
  expect:
  - '!result.ok && result.error.code == ''the-microsoft-link-probe-requires-a-list-of-subject-tokens'''
- id: builtin-extensions-github-auth-restore-microsoft-signed-out
  description: A linked account whose Microsoft account is signed out is not restored, and the attempt is remembered.
  fixtures: [one-window-folder]
  state:
    account-links:
      links:
      - {microsoft_account_label: mona@contoso.com, github_account_label: mona_contoso, github_account_id: '42'}
  steps:
  - flow: github-authentication-get-sessions
    as: first
  - flow: github-authentication-get-sessions
    as: second
  expect:
  - "steps.first.result.value.sessions == [] && steps.second.result.value.sessions == []"
  - "state['github-session-engine@eh1'].restores_tried == ['mona_contoso repo']"
  - "calls['microsoft-authentication.get-accounts'] == 1"
- id: builtin-extensions-github-auth-restore-linked-account
  description: A linked account whose Microsoft account is signed in gets a transient session minted through the Entra exchange.
  fixtures: [one-window-folder]
  state:
    account-links:
      links:
      - {microsoft_account_label: mona@contoso.com, github_account_label: mona_contoso, github_account_id: '42'}
    microsoft-authentication:
      accounts:
      - {id: entra-oid, label: mona@contoso.com}
    github-rest-api:
      entra_links:
        mona@contoso.com: {token: ghu_minted, github_account_id: '42', login: mona_contoso, granted_scopes: [repo]}
  steps:
  - flow: github-authentication-get-sessions
    as: first
  - flow: github-authentication-get-sessions
    as: second
  expect:
  - "steps.first.result.value.sessions[0].account.label == 'mona_contoso'"
  - "steps.second.result.value.sessions.map(s, s.id) == ['restored-42']"
  - "calls['entra-token-exchange.renew'] == 1"
  - "state['keychain@eh1'].writes == 0"
- id: builtin-extensions-github-auth-restore-account-mismatch
  description: GitHub minting a token for a different account unlinks the row.
  fixtures: [one-window-folder]
  state:
    account-links:
      links:
      - {microsoft_account_label: mona@contoso.com, github_account_label: mona_contoso, github_account_id: '42'}
    microsoft-authentication:
      accounts:
      - {id: entra-oid, label: mona@contoso.com}
    github-rest-api:
      entra_links:
        mona@contoso.com: {token: ghu_other, github_account_id: '99', login: someone_else, granted_scopes: [repo]}
  flow: github-authentication-get-sessions
  expect:
  - "result.value.sessions == []"
  - "state['account-links@eh1'].links == []"
- id: builtin-extensions-github-auth-enterprise-not-configured
  description: Signing in to GitHub Enterprise with no configured instance throws the configuration error.
  fixtures: [one-window-folder]
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-enterprise-sign-in
    as: signin
  expect:
  - "state['github-enterprise-authentication-provider@eh1'].registered && state['github-enterprise-authentication-provider@eh1'].hosts == []"
  - '!steps.signin.result.ok && steps.signin.result.error.message == ''Configure github-enterprise.uris before signing in to GitHub Enterprise.'''
- id: builtin-extensions-github-auth-enterprise-configured
  description: Configured instance URIs (one with a trailing slash, duplicated) become one host and the provider is registered for it.
  fixtures: [one-window-folder]
  config:
    github-enterprise-uris: ['HTTPS://ghe.example.com/', 'HTTPS://ghe.example.com']
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-enterprise-sign-in
    as: signin
  expect:
  - "state['github-enterprise-authentication-provider@eh1'].hosts == ['https://ghe.example.com']"
  - "steps.signin.result.value.host == 'https://ghe.example.com'"
- id: builtin-extensions-github-auth-enterprise-invalid-uri
  description: A github.com URI in github-enterprise.uris shows an error and becomes the provider's configuration error.
  fixtures: [one-window-folder]
  config:
    github-enterprise-uris: ['https://github.com']
  steps:
  - flow: github-authentication-activate
  - flow: github-authentication-enterprise-sign-in
    as: signin
  expect:
  - "state['github-enterprise-authentication-provider@eh1'].hosts == [] && state['github-enterprise-authentication-provider@eh1'].configuration_error == 'Invalid GitHub Enterprise instance URI: https://github.com'"
  - "calls['vscode-api.window-show-error-message'] == 1"
  - "steps.signin.result.error.message == 'Invalid GitHub Enterprise instance URI: https://github.com'"
- id: builtin-extensions-github-auth-flows-no-secret
  description: Built from source (no client secret), github.com in a local host offers only the device code flow.
  fixtures: [one-window-folder]
  flow: github-authentication-get-flows
  expect:
  - "result.value.flows == ['device code']"
- id: builtin-extensions-github-auth-flows-prefer-device
  description: With a client secret and an unsupported client, PAT is allowed and preferDeviceCodeFlow puts device code first.
  fixtures: [one-window-folder]
  flow: github-authentication-get-flows
  config:
    github-authentication-prefer-device-code-flow: true
  input:
    target: dot-com
    extension_host: local
    is_supported_client: false
    client_secret_configured: true
  expect:
  - "result.value.flows == ['device code', 'local server', 'personal access token']"
- id: builtin-extensions-github-auth-remove-restored-session
  description: Signing out of a restored (transient) session drops it from memory only and forgets the Microsoft link.
  fixtures: [one-window-folder]
  state:
    account-links:
      links:
      - {microsoft_account_label: mona@contoso.com, github_account_label: mona_contoso, github_account_id: '42'}
    microsoft-authentication:
      accounts:
      - {id: entra-oid, label: mona@contoso.com}
    github-rest-api:
      entra_links:
        mona@contoso.com: {token: ghu_minted, github_account_id: '42', login: mona_contoso, granted_scopes: [repo]}
  steps:
  - flow: github-authentication-get-sessions
  - flow: github-authentication-remove-session
    input: {id: restored-42}
  expect:
  - "state['github-session-engine@eh1'].transient_sessions == {}"
  - "state['account-links@eh1'].links == []"
  - "state['keychain@eh1'].writes == 0"
