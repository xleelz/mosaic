- component: enterprise-configuration
  name: get-enterprise-uris
  kind: function
  summary: 'getEnterpriseUris: github-enterprise.uris when set, else the legacy github-enterprise.uri; each must be an http(s) instance URL
    with no credentials, query or fragment and not github.com.'
  sources:
  - extensions/github-authentication/src/common/enterpriseConfiguration.ts:11-41
  request:
    type: object
    properties:
      uris:
        type: array
      legacy_uri:
        type: string
  errors:
  - {code: invalid-github-enterprise-instance-uri, status: 0, retryable: false}
  behavior:
  - set:
      vars.values: '= size(input.uris) > 0 ? input.uris : (input.legacy_uri != '''' ? [input.legacy_uri] : [])'
  - foreach: = vars.values
    as: v
    steps:
    - if: '!vars.v.matches(''(?i)^https?://[^/?#@]+(/[^?#]*)?$'') || vars.v.split(''/'')[2].lowerAscii() in [''github.com'', ''www.github.com'',
        ''api.github.com'']'
      then:
      - title: Not a GitHub Enterprise instance URL
        source: extensions/github-authentication/src/common/enterpriseConfiguration.ts:31-39
        fail:
          code: invalid-github-enterprise-instance-uri
