- component: github-server
  name: login
  kind: function
  summary: 'login: pick the flows for this target, extension host and client (getFlows), then try them in order; before each fallback the
    user is asked whether to try a different way. All failing throws Cancelled (if the user cancelled) or "No auth flow succeeded".'
  sources:
  - extensions/github-authentication/src/githubServer.ts:166-231
  request:
    type: object
    properties:
      scopes:
        type: string
  response:
    type: object
    properties:
      token:
        type: string
  errors:
  - {code: cancelled, status: 0, retryable: false}
  - {code: no-auth-flow-succeeded, status: 0, retryable: false}
  behavior:
  - call: github-auth-flows.get-flows
    input:
      target: dot-com
      extension_host: = state.extension_host
      is_supported_client: = state.is_supported_client
      client_secret_configured: = state.client_secret_configured
    as: flows
  - set:
      vars.user_cancelled: = null
  - foreach: = vars.flows.value.flows
    as: flow
    index: i
    steps:
    - if: vars.i > 0 && vars.user_cancelled != null
      then:
      - title: Ask whether to try a different way
        source: extensions/github-authentication/src/githubServer.ts:174-186
        call: vscode-api.window-show-warning-message
        input:
          extension_id: vscode.github-authentication
          message: = 'Would you like to try a different way? (' + vars.flow + ')'
          items: ['Yes', 'No']
      - choice: try_another
        default: 'yes'
        options:
          'yes': []
          'no':
          - fail:
              code: cancelled
              message: Cancelled
    - call: github-auth-flows.trigger
      input:
        label: = vars.flow
        scopes: = input.scopes
      as: got
      on_error: continue
    - if: vars.got.ok
      then:
      - return:
          token: = vars.got.value.token
    - title: processLoginError records whether the user cancelled
      source: extensions/github-authentication/src/githubServer.ts:225-227
      set:
        vars.user_cancelled: = vars.got.error.code == 'user-cancelled'
  - if: vars.user_cancelled == true
    then:
    - fail:
        code: cancelled
        message: Cancelled
  - fail:
      code: no-auth-flow-succeeded
      message: No auth flow succeeded.
- component: github-server
  name: logout
  kind: function
  summary: 'logout: without a client secret, for a non-OAuth (gho_) token, or on GitHub Enterprise Server the token is only deleted locally;
    otherwise DELETE /applications/{client_id}/token, logging any failure.'
  sources:
  - extensions/github-authentication/src/githubServer.ts:233-286
  request:
    type: object
    properties:
      session:
        type: object
  behavior:
  - if: '!state.client_secret_configured'
    then:
    - title: No client secret; the token can't be deleted on the server
      source: extensions/github-authentication/src/githubServer.ts:236-239
      return:
        deleted_on_server: false
  - if: '!input.session.access_token.startsWith(''gho_'')'
    then:
    - title: Only OAuth tokens (gho_) are deleted on the server
      source: extensions/github-authentication/src/githubServer.ts:243-246
      return:
        deleted_on_server: false
  - call: github-rest-api.delete-token
    input:
      token: = input.session.access_token
    as: del
    on_error: continue
  - return:
      deleted_on_server: = vars.del.ok
- component: github-auth-flows
  name: get-flows
  kind: function
  summary: 'getFlows: keep the flows that support the target, the extension host, a missing client secret and the client; with
    github-authentication.preferDeviceCodeFlow the device code flow goes first.'
  sources:
  - extensions/github-authentication/src/flows.ts:614-662
  request:
    type: object
    properties:
      target:
        type: string
        enum: [dot-com, enterprise, hosted-enterprise]
      extension_host:
        type: string
        enum: [local, remote, web-worker]
      is_supported_client:
        type: boolean
      client_secret_configured:
        type: boolean
  response:
    type: object
    properties:
      flows:
        type: array
  behavior:
  - title: Filter the flows by target, host, client secret and client
    source: extensions/github-authentication/src/flows.ts:615-650
    set:
      vars.valid: "= state.all_flows.filter(f, (input.target == 'dot-com' ? f.dot_com : input.target == 'enterprise' ? f.enterprise_server : f.hosted_enterprise) && (input.extension_host == 'remote' ? f.remote : input.extension_host == 'web-worker' ? f.web_worker : true) && (input.client_secret_configured || f.no_client_secret) && (input.is_supported_client ? (f.supported_clients || input.target != 'dot-com') : f.unsupported_clients)).map(f, f.label)"
  - if: config['github-authentication-prefer-device-code-flow']
    then:
    - title: preferDeviceCodeFlow moves the device code flow first
      source: extensions/github-authentication/src/flows.ts:652-658
      return:
        flows: = vars.valid.filter(l, l == 'device code') + vars.valid.filter(l, l != 'device code')
  - return:
      flows: = vars.valid
- component: github-auth-flows
  name: trigger
  kind: function
  summary: 'IFlow.trigger for one flow: the device code flow shows the one-time code in a modal and polls; the local server flow starts a
    loopback server and waits for the redirect; the URL handler flow waits for the vscode:// redirect; the PAT flow asks for a token. The
    user''s part is a choice.'
  sources:
  - extensions/github-authentication/src/flows.ts:400-520
  - extensions/github-authentication/src/flows.ts:307-385
  - extensions/github-authentication/src/node/authServer.ts:71-208
  request:
    type: object
    properties:
      label:
        type: string
      scopes:
        type: string
  response:
    type: object
    properties:
      token:
        type: string
  errors:
  - {code: user-cancelled, status: 0, retryable: false}
  - {code: timed-out, status: 0, retryable: false}
  behavior:
  - if: input.label == 'device code'
    then:
    - title: 'Show "Your Code: …" with "Copy & Continue to Browser"'
      source: extensions/github-authentication/src/flows.ts:423-433
      call: vscode-api.window-show-information-message
      input:
        extension_id: vscode.github-authentication
        message: 'Your Code: 1234-5678'
        options: {modal: true}
        items: [Copy & Continue to Browser]
  - if: input.label == 'local server'
    then:
    - title: Start the loopback server and open its /signin page; wait for the OAuth redirect (5 minute timeout)
      source: extensions/github-authentication/src/flows.ts:357-368
      set:
        vars.loopback: true
  - choice: outcome
    default: authorized
    options:
      authorized:
      - title: The user authorized; the code is exchanged for a token
        source: extensions/github-authentication/src/flows.ts:450-520
        return:
          token: gho_dev_token
      cancelled:
      - title: The user dismissed the prompt
        source: extensions/github-authentication/src/flows.ts:431-433
        fail:
          code: user-cancelled
          message: User Cancelled
      timed_out:
      - fail:
          code: timed-out
          message: Timed out
- component: account-links
  name: linked-accounts
