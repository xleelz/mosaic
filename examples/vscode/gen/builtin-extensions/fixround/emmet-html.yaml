    properties:
      uri: {type: string, examples: [file:///work/app/index.html]}
      language_id: {type: string, examples: [html]}
      line_before_cursor: {type: string, examples: [ul>li]}
      trigger_kind: {type: string, enum: [invoke, trigger-character, incomplete], default: invoke}
      selection: {type: string, default: caret-content}
      node: {type: object, default: {type: '', name: '', has_open: false, has_close: false, attributes: {}, in_style_attribute: false, in_comment: false, caret_after_separator: false, caret_after_open_brace: false, parent_type: '', text_before: ''}}
  behavior:
  - if: input.language_id in config['emmet-exclude-languages']
    then:
    - title: Excluded language - no completions
      source: extensions/emmet/src/defaultCompletionProvider.ts:44-48
      set: {state.last_completion_type: ''}
    - return: null
  - call: emmet-extension.get-syntax-from-args
    input: {language: '= input.language_id'}
    as: mode
  - set:
      vars.mapped: "= input.language_id in ['handlebars', 'php'] || input.language_id in config['emmet-include-languages']"
      vars.syntax: '= vars.mode.value.syntax'
      vars.show: "= config['emmet-show-expanded-abbreviation']"
  - if: "vars.syntax == '' || vars.show == 'never' || ((vars.mapped || vars.syntax == 'jsx') && vars.show != 'always')"
    then:
    - title: No emmet mode, or showExpandedAbbreviation rules the language out
      source: extensions/emmet/src/defaultCompletionProvider.ts:50-58
      set: {state.last_completion_type: ''}
    - return: null
  - if: "input.line_before_cursor.trim().startsWith('//')"
    then:
    - title: A comment at the beginning of the line - no completions
      source: extensions/emmet/src/defaultCompletionProvider.ts:69-73
      set: {state.last_completion_type: ''}
    - return: null
  - set:
      vars.validate: "= vars.syntax in ['html', 'jsx', 'xml']"
      vars.n: '= input.node'
      vars.incomplete: "= has(input.trigger_kind) && input.trigger_kind == 'incomplete'"
  - if: "vars.syntax == 'html'"
    then:
    - if: "vars.incomplete && state.last_completion_type != ''"
      then:
      - title: Re-triggered for an incomplete list - reuse the last completion type and skip location checks
        source: extensions/emmet/src/defaultCompletionProvider.ts:77-89
        set:
          vars.validate: false
          vars.syntax: "= state.last_completion_type == 'css' ? 'css' : vars.syntax"
    - if: "vars.validate && vars.n.type != '' && vars.n.name == 'script'"
      then:
      - if: "!('type' in vars.n.attributes)"
        then:
        - title: A script without a type attribute - no completions
          source: extensions/emmet/src/defaultCompletionProvider.ts:95-111
          set: {state.last_completion_type: ''}
        - return: null
      - if: "vars.n.attributes['type'] in ['application/javascript', 'text/javascript']"
        then:
        - call: emmet-extension.get-syntax-from-args
          input: {language: javascript}
          as: js
        - if: "vars.js.value.syntax == ''"
          then:
          - title: JavaScript script content without an emmet mapping for javascript - no completions
            source: extensions/emmet/src/defaultCompletionProvider.ts:99-104
            set: {state.last_completion_type: ''}
          - return: null
        - set: {vars.validate: false}
      - if: "vars.n.attributes['type'] in ['text/html', 'text/plain', 'text/x-template', 'text/template', 'text/ng-template']"
        then:
        - set: {vars.validate: false}
    - if: "vars.validate && vars.n.type != '' && (vars.n.name == 'style' || vars.n.in_style_attribute)"
      then:
      - title: Inside <style> or a style attribute the syntax is css
        source: extensions/emmet/src/defaultCompletionProvider.ts:113-121
        set: {vars.syntax: css, vars.validate: false}
  - set:
      vars.css_syntax: "= vars.syntax in ['css', 'scss', 'sass', 'less', 'stylus']"
  - title: Extract the abbreviation before the caret (look-ahead for markup)
    source: extensions/emmet/src/defaultCompletionProvider.ts:127-133
    set:
      vars.abbr: "= replace(input.line_before_cursor, '^(.*\\\\s)?([^\\\\s]*)$', '$2')"
  - if: "vars.abbr == ''"
    then:
    - set: {state.last_completion_type: ''}
    - return: null
  - if: "!vars.incomplete && vars.css_syntax"
    then:
    - title: Stylesheet syntax (a stylesheet document, or css inside HTML) - always validate the location
      source: extensions/emmet/src/defaultCompletionProvider.ts:136-158
      set: {vars.validate: true}
  - if: vars.validate
    then:
    - call: emmet-extension.is-valid-location-for-emmet-abbreviation
      input: {syntax: '= vars.syntax', abbreviation: '= vars.abbr', node: '= vars.n', selection: "= has(input.selection) ? input.selection : 'caret-content'"}
      as: loc
    - if: '!vars.loc.value.valid'
      then:
      - title: Not a valid location for an abbreviation
        source: extensions/emmet/src/defaultCompletionProvider.ts:160-162
        set: {state.last_completion_type: ''}
      - return: null
  - if: "!vars.css_syntax && input.language_id in ['javascript', 'javascriptreact', 'typescript', 'typescriptreact']"
    then:
    - if: "vars.abbr.startsWith('this.') || vars.abbr.matches('\\\\[[^\\\\]=]*\\\\]')"
      then:
      - title: this.x or a[i] in JS/TS is code, not an abbreviation
        source: extensions/emmet/src/defaultCompletionProvider.ts:169-174
        set: {state.last_completion_type: ''}
      - return: null
    - title: Ask the document symbol provider whether the text is a symbol name
      source: extensions/emmet/src/defaultCompletionProvider.ts:175-178
      call: vscode-api.commands-execute-command
      input: {command: vscode.executeDocumentSymbolProvider, rest: ['= input.uri'], extension_id: vscode.emmet}
      on_error: continue
      as: syms
    - if: "vars.syms.ok && has(vars.syms.value.value) && type(vars.syms.value.value) == list && vars.syms.value.value.exists(s, type(s) == map && has(s.name) && (s.name == vars.abbr || (vars.abbr.startsWith(s.name + '.') && !vars.abbr.matches('[>*+]'))))"
      then:
      - title: The abbreviation is a symbol (or symbol.member) - noise
        source: extensions/emmet/src/defaultCompletionProvider.ts:182-185
        set: {state.last_completion_type: ''}
      - return: null
  - title: "doComplete gives the expansion; the first item's documentation tells markup (starts with <) from css (prop: value;)"
    source: extensions/emmet/src/defaultCompletionProvider.ts:24-39
    set:
      state.last_completion_type: "= vars.css_syntax ? 'css' : 'html'"
  - return:
      is_incomplete: true
      items: "= [{'label': vars.abbr, 'syntax': vars.syntax}]"
