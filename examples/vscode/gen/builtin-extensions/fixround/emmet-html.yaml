scenarios:
# ------------------------------------------------------------------ emmet
- id: builtin-extensions-emmet-commands-balance-out-then-in
  fixtures: [one-window-folder]
  state:
    emmet-extension@eh1:
      editor:
        active: true
        uri: file:///work/app/index.html
        language_id: html
        selection: caret-content
        node: {type: tag, name: div, has_open: true, has_close: true, first_child: {name: span, has_open: true, has_close: true}}
  steps:
  - {flow: emmet-commands, as: out1, input: {command_id: editor.emmet.action.balanceOut, args: []}}
  - {flow: emmet-commands, as: out2, input: {command_id: editor.emmet.action.balanceOut, args: []}}
  - {flow: emmet-commands, as: in1, input: {command_id: editor.emmet.action.balanceIn, args: []}}
  - {flow: emmet-commands, as: in2, input: {command_id: editor.emmet.action.balanceIn, args: []}}
  expect:
  - steps.out1.result.value.selection == 'inner' && steps.out2.result.value.selection == 'outer'
  - steps.in1.result.value.selection == 'inner'
  - steps.in2.result.value.selection == 'caret-content'
  - state['emmet-extension@eh1'].balance_out_stack == [] && state['emmet-extension@eh1'].editor.selection == 'caret-content'
- id: builtin-extensions-emmet-commands-balance-in-elsewhere
  fixtures: [one-window-folder]
  state:
    emmet-extension@eh1:
      editor:
        active: true
        language_id: html
        selection: outer
        node: {type: tag, name: ul, has_open: true, has_close: true, first_child: {name: li, has_open: true, has_close: true}}
  steps:
  - {flow: emmet-commands, as: a, input: {command_id: editor.emmet.action.balanceIn, args: []}}
  - {flow: emmet-commands, as: b, input: {command_id: editor.emmet.action.balanceIn, args: []}}
  - {flow: emmet-commands, as: c, input: {command_id: editor.emmet.action.balanceIn, args: []}}
  expect:
  - steps.a.result.value.selection == 'inner'
  - steps.b.result.value.selection == 'child-outer' && steps.c.result.value.selection == 'child-inner'
  - state['emmet-extension@eh1'].last_balanced_selection == 'child-inner'
- id: builtin-extensions-emmet-commands-balance-refused-in-css
  fixtures: [one-window-folder]
  state:
    emmet-extension@eh1:
      editor: {active: true, language_id: css, node: {type: rule, name: '.a'}}
  steps:
  - {flow: emmet-commands, as: a, input: {command_id: editor.emmet.action.balanceOut, args: []}}
  expect:
  - "!steps.a.result.value.ran"
