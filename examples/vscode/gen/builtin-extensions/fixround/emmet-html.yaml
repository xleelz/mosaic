  - title: editor.edit applies the size edits
    source: extensions/emmet/src/updateImageSize.ts:35-43
    set:
      state.editor.edits: "= state.editor.edits + [{'action': 'updateImageSize', 'file': vars.file, 'width': vars.img.value.width, 'height': vars.img.value.height}]"
  - return: {ran: true, updated: true}
