      return: null
  - set: {vars.doc: '= state.documents[input.uri]'}
  - call: html-semantic-token-provider.get-semantic-tokens
    input:
      tokens: '= vars.doc.tokens'
      js_semantic_tokens: "= has(vars.doc.js_semantic_tokens) ? vars.doc.js_semantic_tokens : []"
      ranges: "= has(input.ranges) ? input.ranges : []"
    as: t
  - return: '= vars.t.value'
