- component: emmet-extension
  name: increment-decrement
  kind: function
  summary: 'incrementDecrement(delta): add delta to the number under the caret (located by scanning digits, one dot and a leading minus around
    it) keeping its decimals, zero padding and omitted integer part; no number, no edit.'
  sources:
  - extensions/emmet/src/incrementDecrement.ts:15-114
  request:
    type: object
    properties:
      delta: {type: number, examples: [1]}
  response:
    type: object
    properties:
      value: {type: string}
  behavior:
  - if: '!state.editor.active'
    then:
    - title: No editor is active
      source: extensions/emmet/src/incrementDecrement.ts:16-19
      call: vscode-api.window-show-information-message
      input: {message: No editor is active, extension_id: vscode.emmet}
    - return: {value: ''}
  - title: locate - scan back over digits (one dot, stop after a minus) and forward over digits from the caret
    source: extensions/emmet/src/incrementDecrement.ts:65-99
    set:
      vars.b: "= replace(state.editor.line_before_cursor, '^.*?(-?[0-9]*\\\\.?[0-9]*)$', '$1')"
      vars.a: "= replace(state.editor.line_after_cursor, '^([0-9]*(\\\\.[0-9]+)?).*$', '$1')"
  - set:
      vars.num: '= vars.b + vars.a'
  - if: "!vars.num.matches('^-?([0-9]+\\\\.?[0-9]*|\\\\.[0-9]+)$')"
    then:
    - title: No valid number at the caret - nothing is replaced
      source: extensions/emmet/src/incrementDecrement.ts:101-106
      return: {value: ''}
  - title: update - keep the number of decimals (1 when there are none) and drop an all-zero fraction
    source: extensions/emmet/src/incrementDecrement.ts:41-44
    set:
      vars.dec: "= vars.num.contains('.') ? size(vars.num) - vars.num.indexOf('.') - 1 : 1"
      vars.val: '= double(vars.num) + double(input.delta)'
  - set:
      vars.pw: '= [1, 10, 100, 1000, 10000, 100000, 1000000][vars.dec]'
  - set:
      vars.r: '= int(vars.val * double(vars.pw) + (vars.val >= 0.0 ? 0.5 : -0.5))'
  - set:
      vars.abs: '= vars.r < 0 ? -vars.r : vars.r'
      vars.sign: "= vars.r < 0 ? '-' : ''"
  - set:
      vars.ip: '= string(vars.abs / vars.pw)'
      vars.fp: "= ('000000' + string(vars.abs % vars.pw)).substring(size('000000' + string(vars.abs % vars.pw)) - vars.dec)"
      vars.intlen: "= size(replace(vars.num, '^-?([0-9]*).*$', '$1'))"
  - if: "vars.num.matches('^-?0[0-9]+')"
    then:
    - title: A zero-padded number keeps its padding
      source: extensions/emmet/src/incrementDecrement.ts:46-50
      set:
        vars.ip: "= size(vars.ip) >= vars.intlen ? vars.ip : ('0000000000' + vars.ip).substring(size('0000000000' + vars.ip) - vars.intlen)"
  - set:
      vars.out: "= vars.sign + vars.ip + (vars.abs % vars.pw == 0 ? '' : '.' + vars.fp)"
  - if: "vars.num.matches('^-?\\\\.')"
    then:
    - title: A number written without its integer part stays that way
      source: extensions/emmet/src/incrementDecrement.ts:52-55
      set:
        vars.out: "= replace(vars.out, '^(-?)0+', '$1')"
  - title: editor.edit replaces the number with the updated one
    source: extensions/emmet/src/incrementDecrement.ts:22-34
    set:
      state.editor.edits: "= state.editor.edits + [{'action': 'incrementDecrement', 'from': vars.num, 'to': vars.out}]"
      state.editor.line_before_cursor: "= state.editor.line_before_cursor.substring(0, size(state.editor.line_before_cursor) - size(vars.b)) + vars.out"
      state.editor.line_after_cursor: '= state.editor.line_after_cursor.substring(size(vars.a))'
  - return: {value: '= vars.out'}
