configs:
- id: emmet-exclude-languages
  type: array
  value: [markdown]
  default: [markdown]
  summary: emmet.excludeLanguages - languages where emmet abbreviations are neither expanded nor suggested.
  sources:
  - extensions/emmet/package.json:79-88
  - extensions/emmet/src/abbreviationActions.ts:706
  attributes:
    key: emmet.excludeLanguages
- id: emmet-include-languages
  type: object
  value: {}
  default: {}
  summary: emmet.includeLanguages - extra language id to emmet-supported language mappings.
  sources:
  - extensions/emmet/package.json:48-55
  - extensions/emmet/src/util.ts:130
  attributes:
    key: emmet.includeLanguages
- id: emmet-trigger-expansion-on-tab
  type: boolean
  value: false
  default: false
  summary: emmet.triggerExpansionOnTab - Tab expands abbreviations; when nothing expands the tab command runs instead.
  sources:
  - extensions/emmet/package.json:99-104
  - extensions/emmet/src/abbreviationActions.ts:421
  attributes:
    key: emmet.triggerExpansionOnTab
- id: emmet-show-expanded-abbreviation
  type: string
  value: always
  default: always
  summary: emmet.showExpandedAbbreviation - never, always or inMarkupAndStylesheetFilesOnly (no suggestions in mapped languages or jsx).
  sources:
  - extensions/emmet/package.json:30-41
  - extensions/emmet/src/defaultCompletionProvider.ts:54-57
  attributes:
    key: emmet.showExpandedAbbreviation
- id: emmet-syntax-profiles
  type: object
  value: {}
  default: {}
  summary: emmet.syntaxProfiles - per-syntax output profiles (selfClosingStyle decides how splitJoinTag joins a tag).
  sources:
  - extensions/emmet/package.json:74-78
  - extensions/emmet/src/util.ts:609
  attributes:
    key: emmet.syntaxProfiles

components:
- id: emmet-extension
  name: vscode.emmet extension
  kind: module
  layer: extensions
  parent: builtin-extensions
  summary: 'Built-in extension vscode.emmet: its activate entry point, its 24 contributed commands and the module state of its actions (the
    balance stack). The active text editor the actions read is held in state.editor: its language, the selection (as a position relative
    to the HTML/CSS node under the caret), the caret line and the parsed node at the caret; edits applied with TextEditor.edit/insertSnippet
    are appended to editor.edits.'
  sources:
  - extensions/emmet/src/node/emmetNodeMain.ts:12
  - extensions/emmet/package.json:19-22
  - extensions/emmet/src/balance.ts:11-12
  attributes:
    owner: builtin-extensions
    extension: vscode.emmet
    depth: modeled
  state:
    schema:
      type: object
      properties:
        activated: {type: boolean}
        last_command: {type: string}
        registrations: {type: object}
        editor: {type: object}
        balance_out_stack: {type: array}
        last_balanced_selection: {type: string}
    initial:
      activated: false
      last_command: ''
      balance_out_stack: []
      last_balanced_selection: ''
      editor:
        active: false
        uri: ''
        language_id: ''
        selection: caret-content
        selection_text: ''
        line_before_cursor: ''
        line_after_cursor: ''
        caret_offset: 0
        edit_points: []
        item_index: -1
        node:
          type: ''
          name: ''
          has_open: false
          has_close: false
          inner_blank: false
          multiline: false
          commented: false
          in_style_attribute: false
          in_comment: false
          caret_after_separator: false
          caret_after_open_brace: false
          parent_type: ''
          text_before: ''
          value: ''
          attributes: {}
          first_child: {}
          items: []
          rule_properties: {}
        edits: []
      registrations:
        editor.emmet.action.wrapWithAbbreviation: emmet-extension.cmd-editor-emmet-action-wrapwithabbreviation
        emmet.expandAbbreviation: emmet-extension.cmd-emmet-expandabbreviation
        editor.emmet.action.removeTag: emmet-extension.cmd-editor-emmet-action-removetag
        editor.emmet.action.updateTag: emmet-extension.cmd-editor-emmet-action-updatetag
        editor.emmet.action.matchTag: emmet-extension.cmd-editor-emmet-action-matchtag
        editor.emmet.action.balanceIn: emmet-extension.cmd-editor-emmet-action-balancein
        editor.emmet.action.balanceOut: emmet-extension.cmd-editor-emmet-action-balanceout
        editor.emmet.action.prevEditPoint: emmet-extension.cmd-editor-emmet-action-preveditpoint
        editor.emmet.action.nextEditPoint: emmet-extension.cmd-editor-emmet-action-nexteditpoint
        editor.emmet.action.mergeLines: emmet-extension.cmd-editor-emmet-action-mergelines
        editor.emmet.action.selectPrevItem: emmet-extension.cmd-editor-emmet-action-selectprevitem
        editor.emmet.action.selectNextItem: emmet-extension.cmd-editor-emmet-action-selectnextitem
        editor.emmet.action.splitJoinTag: emmet-extension.cmd-editor-emmet-action-splitjointag
        editor.emmet.action.toggleComment: emmet-extension.cmd-editor-emmet-action-togglecomment
        editor.emmet.action.evaluateMathExpression: emmet-extension.cmd-editor-emmet-action-evaluatemathexpression
        editor.emmet.action.updateImageSize: emmet-extension.cmd-editor-emmet-action-updateimagesize
        editor.emmet.action.incrementNumberByOneTenth: emmet-extension.cmd-editor-emmet-action-incrementnumberbyonetenth
        editor.emmet.action.incrementNumberByOne: emmet-extension.cmd-editor-emmet-action-incrementnumberbyone
        editor.emmet.action.incrementNumberByTen: emmet-extension.cmd-editor-emmet-action-incrementnumberbyten
        editor.emmet.action.decrementNumberByOneTenth: emmet-extension.cmd-editor-emmet-action-decrementnumberbyonetenth
        editor.emmet.action.decrementNumberByOne: emmet-extension.cmd-editor-emmet-action-decrementnumberbyone
        editor.emmet.action.decrementNumberByTen: emmet-extension.cmd-editor-emmet-action-decrementnumberbyten
        editor.emmet.action.reflectCSSValue: emmet-extension.cmd-editor-emmet-action-reflectcssvalue
        workbench.action.showEmmetCommands: emmet-extension.cmd-workbench-action-showemmetcommands
- id: default-completion-item-provider
  name: DefaultCompletionItemProvider
  kind: module
  layer: extensions
  parent: emmet-extension
  summary: Emmet's completion item provider, registered for every emmet language; it suggests the expansion of the abbreviation before
    the caret and remembers whether the last suggestion was markup or css (lastCompletionType) for incomplete re-triggers.
  sources:
  - extensions/emmet/src/defaultCompletionProvider.ts:13-15
  - extensions/emmet/src/emmetCommon.ts:166
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        last_completion_type: {type: string}
    initial:
      last_completion_type: ''
- id: html-server
  name: HTML language server (startServer)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: The HTML language server started by vscode.html-language-features; it keeps the synced text documents and the workspace folders
    and answers completion, hover, selection-range and semantic-token requests by dispatching to the embedded language mode at the position.
  sources:
  - extensions/html-language-features/server/src/htmlServer.ts:91-94
  - extensions/html-language-features/server/src/htmlServer.ts:139-160
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        documents: {type: object}
        workspace_folders: {type: array}
    initial:
      documents: {}
      workspace_folders: [file:///work/app]
- id: html-language-modes
  name: LanguageModes (getLanguageModes)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: The HTML server's language modes - html always, css when css is an embedded language, javascript and typescript when javascript
    is - and the lookup of the mode that handles a position.
  sources:
  - extensions/html-language-features/server/src/modes/languageModes.ts:116-133
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        supported_languages: {type: object}
    initial:
      supported_languages: {css: true, javascript: true}
- id: html-document-regions
  name: HTMLDocumentRegions (getDocumentRegions)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: Splits an HTML document into embedded regions (style content and style attributes are css, script content is javascript/typescript
    by its type attribute, on* attributes are javascript) and answers which language is at an offset.
  sources:
  - extensions/html-language-features/server/src/modes/embeddedSupport.ts:27-100
  attributes:
    owner: builtin-extensions
- id: html-javascript-mode
  name: JavaScript mode (getJavaScriptMode)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: The javascript/typescript language mode of the HTML server; it runs the TypeScript language service over the embedded script
    document built from the document regions.
  sources:
  - extensions/html-language-features/server/src/modes/javascriptMode.ts:108-125
  attributes:
    owner: builtin-extensions
- id: html-semantic-token-provider
  name: SemanticTokenProvider (newSemanticTokenProvider)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: Combines the semantic tokens of every mode in an HTML document (only the javascript/typescript modes produce them) and encodes them,
    keeping only tokens inside the requested ranges.
  sources:
  - extensions/html-language-features/server/src/modes/semanticTokens.ts:20-51
  attributes:
    owner: builtin-extensions
- id: html-document-context
  name: DocumentContext (html getDocumentContext)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: The HTML server's DocumentContext, which resolves a link or path reference in a document against the document or its workspace
    folder.
  sources:
  - extensions/html-language-features/server/src/utils/documentContext.ts:11-42
  attributes:
    owner: builtin-extensions
- id: html-strings-utils
  name: utils/strings.ts (html server)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: String helpers of the HTML server - getWordAtText, startsWith, endsWith.
  sources:
  - extensions/html-language-features/server/src/utils/strings.ts:6-52
  attributes:
    owner: builtin-extensions
- id: html-node-file-fs
  name: getNodeFileFS (html server)
  kind: module
  layer: extensions
  parent: html-language-features-extension
  summary: The Node file system provider the HTML server gives the language services for path completion; it only handles file URIs.
  sources:
  - extensions/html-language-features/server/src/node/nodeFs.ts:12-74
  - extensions/html-language-features/server/src/node/htmlServerMain.ts:33
  attributes:
    owner: builtin-extensions
- id: css-server
  name: CSS language server (startServer)
  kind: module
  layer: extensions
  parent: css-language-features-extension
  summary: The CSS language server started by vscode.css-language-features; it keeps the synced stylesheets and the workspace folders and
    answers completion requests with a DocumentContext for path references.
  sources:
  - extensions/css-language-features/server/src/cssServer.ts:37
  attributes:
    owner: builtin-extensions
  state:
    schema:
      type: object
      properties:
        documents: {type: object}
        workspace_folders: {type: array}
    initial:
      documents: {}
      workspace_folders: [file:///work/app]
- id: css-document-context
  name: DocumentContext (css getDocumentContext)
  kind: module
  layer: extensions
  parent: css-language-features-extension
  summary: The CSS server's DocumentContext, which resolves url()/@import references against the document or its workspace folder.
  sources:
  - extensions/css-language-features/server/src/utils/documentContext.ts:11-38
  attributes:
    owner: builtin-extensions
- id: css-node-fs-request-service
  name: getNodeFSRequestService (css server)
  kind: module
  layer: extensions
  parent: css-language-features-extension
  summary: The Node request service the CSS server gives the language service (getContent, stat, readDirectory); it only handles file:// URIs.
  sources:
  - extensions/css-language-features/server/src/node/nodeFs.ts:12-87
  - extensions/css-language-features/server/src/node/cssServerMain.ts:32
  attributes:
    owner: builtin-extensions

interfaces:
# ------------------------------------------------------------------ emmet helpers
- component: emmet-extension
  name: validate
  kind: function
  summary: 'validate(allowStylesheet): emmet actions need an active text editor (without one they show ''No editor is active''); with allowStylesheet
    false a css/scss/sass/less/stylus document is refused.'
  sources:
  - extensions/emmet/src/util.ts:107-117
  - extensions/emmet/src/util.ts:102-105
  request:
    type: object
    properties:
      allow_stylesheet: {type: boolean, default: true}
  response:
    type: object
    properties:
      valid: {type: boolean}
  behavior:
  - choice: active_editor
    default: "= state.editor.active ? 'present' : 'absent'"
    options:
      present:
      - if: "!(has(input.allow_stylesheet) ? input.allow_stylesheet : true) && state.editor.language_id in ['css', 'scss', 'sass', 'less', 'stylus']"
        then:
        - title: A stylesheet document is refused when allowStylesheet is false
          source: extensions/emmet/src/util.ts:113-115
          return: {valid: false}
      - return: {valid: true}
      absent:
      - title: No editor is active
        source: extensions/emmet/src/util.ts:109-111
        call: vscode-api.window-show-information-message
        input:
          message: No editor is active
          extension_id: vscode.emmet
      - return: {valid: false}
- component: emmet-extension
  name: get-syntax-from-args
  kind: function
  summary: 'getSyntaxFromArgs: the emmet syntax for a language (or its parent mode): excluded languages have none; handlebars/php and emmet.includeLanguages
    map to their target; typescriptreact/javascriptreact become jsx, sass-indented sass, jade pug; only emmet''s markup and stylesheet syntaxes count.'
  sources:
  - extensions/emmet/src/abbreviationActions.ts:702-717
  - extensions/emmet/src/util.ts:119-176
  request:
    type: object
    properties:
      language: {type: string, examples: [html]}
      parent_mode: {type: string, default: ''}
  response:
    type: object
    properties:
      syntax: {type: string}
  behavior:
  - title: getMappingForIncludedLanguages - handlebars/php map to html, plus emmet.includeLanguages entries whose target is an emmet language
    source: extensions/emmet/src/util.ts:124-137
    set:
      vars.excluded: "= config['emmet-exclude-languages']"
      vars.mapped: "= merge({'handlebars': 'html', 'php': 'html'}, config['emmet-include-languages']).transformMap(k, v, v in ['html', 'jade', 'slim', 'haml', 'xml', 'xsl', 'css', 'scss', 'sass', 'less', 'stylus', 'javascriptreact', 'typescriptreact'], v)"
  - if: input.language in vars.excluded
    then:
    - title: An excluded language has no emmet syntax
      source: extensions/emmet/src/abbreviationActions.ts:706-709
      return: {syntax: ''}
  - foreach: "= [input.language, has(input.parent_mode) ? input.parent_mode : '']"
    as: lang
    steps:
    - set:
        vars.l: "= vars.lang in vars.mapped ? vars.mapped[vars.lang] : vars.lang"
    - title: getEmmetMode - jsx-tags, mapped modes, tsx/jsx to jsx, sass-indented to sass, jade to pug
      source: extensions/emmet/src/util.ts:153-169
      set:
        vars.l: "= vars.l == 'jsx-tags' ? 'javascriptreact' : (vars.l in vars.mapped ? vars.mapped[vars.l] : vars.l)"
    - set:
        vars.l: "= vars.l.matches('^(typescriptreact|javascriptreact|jsx-tags)$') ? 'jsx' : (vars.l == 'sass-indented' ? 'sass' : (vars.l in ['jade', 'pug'] ? 'pug' : vars.l))"
    - if: "vars.lang != '' && !(vars.lang in vars.excluded) && vars.l in ['html', 'xml', 'xsl', 'jsx', 'js', 'pug', 'slim', 'haml', 'css', 'sass', 'scss', 'less', 'sss', 'stylus']"
      then:
      - title: A known emmet markup or stylesheet syntax
        source: extensions/emmet/src/util.ts:171-175
        return: {syntax: '= vars.l'}
  - return: {syntax: ''}
- component: emmet-extension
  name: fallback-tab
  kind: function
  summary: 'fallbackTab: when emmet.triggerExpansionOnTab is on and nothing was expanded, run the plain tab command.'
  sources:
  - extensions/emmet/src/abbreviationActions.ts:420-425
  response:
    type: object
    properties:
      tabbed: {type: boolean}
  behavior:
  - if: "config['emmet-trigger-expansion-on-tab']"
    then:
    - title: Run the tab command instead
      source: extensions/emmet/src/abbreviationActions.ts:421-423
      call: vscode-api.commands-execute-command
      input: {command: tab, extension_id: vscode.emmet}
      on_error: continue
    - return: {tabbed: true}
  - return: {tabbed: false}
- component: emmet-extension
  name: is-valid-location-for-emmet-abbreviation
  kind: function
  summary: 'isValidLocationForEmmetAbbreviation: in stylesheets not in a comment, and in a property value only hex colors or !; in HTML only
    between a node''s open and close tags (script content by its type) and not inside an unfinished tag.'
  sources:
  - extensions/emmet/src/abbreviationActions.ts:436-618
  request:
    type: object
    properties:
      syntax: {type: string, examples: [html]}
      abbreviation: {type: string, examples: [ul>li]}
      node: {type: object}
      selection: {type: string, default: caret-content}
  response:
    type: object
    properties:
      valid: {type: boolean}
  behavior:
  - set:
      vars.n: "= input.node"
      vars.hex: "= input.abbreviation.matches('^#[0-9a-fA-F]{0,6}$') || input.abbreviation == '!'"
  - if: "input.syntax in ['css', 'scss', 'sass', 'less', 'stylus']"
    then:
    - if: "vars.n.in_comment"
      then:
      - title: No expansion inside a stylesheet comment
        source: extensions/emmet/src/abbreviationActions.ts:437-441
        return: {valid: false}
    - if: "vars.n.type == '' || input.abbreviation.startsWith('@')"
      then:
      - title: No node at the caret, or an @-rule abbreviation
        source: extensions/emmet/src/abbreviationActions.ts:443-454
        return: {valid: true}
    - if: "!(input.syntax in ['sass', 'stylus']) && vars.n.type == 'property'"
      then:
      - if: "vars.n.parent_type != '' && !(vars.n.parent_type in ['rule', 'at-rule'])"
        then:
        - return: {valid: false}
      - if: "vars.n.caret_after_separator && !input.abbreviation.contains(':')"
        then:
        - title: In a property value only a hex color or ! expands
          source: extensions/emmet/src/abbreviationActions.ts:467-479
          return: {valid: '= vars.hex'}
      - if: vars.hex
        then:
        - return: {valid: false}
    - if: "!(vars.n.type in ['rule', 'at-rule']) || vars.n.caret_after_open_brace"
      then:
      - title: Outside a rule, or inside its braces
        source: extensions/emmet/src/abbreviationActions.ts:487-496
        return: {valid: true}
    - return: {valid: false}
  - if: "vars.n.name == 'script'"
    then:
    - set:
        vars.type: "= 'type' in vars.n.attributes ? vars.n.attributes['type'] : ''"
    - if: "vars.type in ['text/html', 'text/plain', 'text/x-template', 'text/template', 'text/ng-template']"
      then:
      - title: A template script type holds markup
        source: extensions/emmet/src/abbreviationActions.ts:526-532
        return: {valid: true}
    - if: "vars.type in ['', 'application/javascript', 'text/javascript']"
      then:
      - title: JavaScript script content expands only when javascript maps to an emmet syntax
        source: extensions/emmet/src/abbreviationActions.ts:534-537
        call: emmet-extension.get-syntax-from-args
        input: {language: javascript}
        as: js
      - return: {valid: "= vars.js.value.syntax != ''"}
    - return: {valid: false}
  - if: "vars.n.type != '' && (!vars.n.has_open || !vars.n.has_close || !(input.selection in ['caret-content', 'inner', 'child-outer', 'child-inner']))"
    then:
    - title: Only between the node's open and close tags
      source: extensions/emmet/src/abbreviationActions.ts:542-545
      return: {valid: false}
  - if: "vars.n.text_before.trim() == ''"
    then:
    - return: {valid: true}
  - if: "vars.n.text_before.endsWith('<') || vars.n.text_before.matches('<[^<>]*\\\\s[^<>]*$')"
    then:
    - title: Backtracking finds an unfinished tag (a < before whitespace) - the caret is inside a tag, not in content
      source: extensions/emmet/src/abbreviationActions.ts:573-617
      return: {valid: false}
  - return: {valid: true}
- component: emmet-extension
  name: expand-abbreviation-in-range
  kind: function
  summary: 'expandAbbreviationInRange: no abbreviations means nothing to insert; otherwise each expansion is inserted as a snippet (all ranges
    at once when every abbreviation is the same).'
  sources:
  - extensions/emmet/src/abbreviationActions.ts:625-656
  request:
    type: object
    properties:
      abbreviations: {type: array}
      insert_same_snippet: {type: boolean, default: false}
  response:
    type: object
    properties:
      inserted: {type: boolean}
  behavior:
  - if: size(input.abbreviations) == 0
    then:
    - title: No abbreviation to expand
      source: extensions/emmet/src/abbreviationActions.ts:626-628
      return: {inserted: false}
  - foreach: '= input.abbreviations'
    as: a
    steps:
    - title: expandAbbr then editor.insertSnippet over the range to replace
      source: extensions/emmet/src/abbreviationActions.ts:636-641
      set:
        state.editor.edits: "= state.editor.edits + [{'action': 'insertSnippet', 'syntax': vars.a.syntax, 'abbreviation': vars.a.abbreviation, 'wraps': has(vars.a.text_to_wrap) ? vars.a.text_to_wrap : ''}]"
  - return: {inserted: true}
# ------------------------------------------------------------------ emmet commands
- component: emmet-extension
  name: cmd-editor-emmet-action-wrapwithabbreviation
  kind: command
  summary: 'editor.emmet.action.wrapWithAbbreviation: wrap the selection (or the caret''s line) with an abbreviation given in args or asked
    for in an input box; refused in stylesheets; a blank or invalid abbreviation restores the selections and changes nothing.'
  sources:
  - extensions/emmet/package.json:268
  - extensions/emmet/src/emmetCommon.ts:29-31
  - extensions/emmet/src/abbreviationActions.ts:32-262
  request: BuiltinCommandRequest
  behavior:
  - title: validate(false) - an active editor that is not a stylesheet
    source: extensions/emmet/src/abbreviationActions.ts:33-35
    call: emmet-extension.validate
    input: {allow_stylesheet: false}
    as: v
  - if: '!vars.v.value.valid'
    then:
    - return: {ran: false, changed: false}
  - set:
      state.last_command: editor.emmet.action.wrapWithAbbreviation
      vars.args: "= size(input.args) > 0 && type(input.args[0]) == map ? input.args[0] : {}"
  - title: The syntax comes from args.language or the document's language, html by default
    source: extensions/emmet/src/abbreviationActions.ts:40-45
    call: emmet-extension.get-syntax-from-args
    input: {language: "= 'language' in vars.args ? vars.args['language'] : state.editor.language_id"}
    as: syn
  - set:
      vars.syntax: "= vars.syn.value.syntax != '' ? vars.syn.value.syntax : 'html'"
      vars.old_selection: '= state.editor.selection'
  - title: An empty selection wraps the caret's line; a selection inside a tag widens to the whole node
    source: extensions/emmet/src/abbreviationActions.ts:50-107
    set:
      vars.text_to_wrap: "= state.editor.selection_text != '' ? state.editor.selection_text : (state.editor.line_before_cursor + state.editor.line_after_cursor).trim()"
  - if: "'abbreviation' in vars.args"
    then:
    - set:
        vars.abbr: "= string(vars.args['abbreviation'])"
    else:
    - title: Ask for the abbreviation (Enter Abbreviation), previewing as it is typed
      source: extensions/emmet/src/abbreviationActions.ts:251-254
      call: vscode-api.window-show-input-box
      input: {options: {prompt: Enter Abbreviation}, extension_id: vscode.emmet}
      as: box
    - set:
        vars.abbr: "= vars.box.ok && has(vars.box.value.value) && type(vars.box.value.value) == string ? vars.box.value.value : ''"
  - if: "vars.abbr.trim() == '' || vars.abbr.matches('\\\\s')"
    then:
    - title: makeChanges - a blank or invalid abbreviation changes nothing and the old selections come back
      source: extensions/emmet/src/abbreviationActions.ts:205-214
      set:
        state.editor.selection: '= vars.old_selection'
    - return: {ran: true, changed: false}
