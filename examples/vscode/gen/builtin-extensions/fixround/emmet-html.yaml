    - call: html-javascript-mode.do-hover
      input: {quick_info: "= has(vars.doc.ts_quick_info) ? vars.doc.ts_quick_info : {}"}
      as: h
    - if: vars.h.value == null
      then:
      - return: null
    - return: {mode: '= vars.m.value.mode', contents: '= vars.h.value.contents'}
  - title: The html or css language service answers the hover
    source: extensions/html-language-features/server/src/htmlServer.ts:346-349
    return: {mode: '= vars.m.value.mode', contents: ''}
- component: html-server
  name: on-selection-ranges
  kind: rpc
  summary: 'textDocument/selectionRange (getSelectionRanges): for each position the html range is the outermost parent; the mode at the
    position (javascript through TypeScript smart selection) contributes the inner ranges.'
  sources:
  - extensions/html-language-features/server/src/htmlServer.ts:520-528
  - extensions/html-language-features/server/src/modes/selectionRanges.ts:9-25
  request:
    type: object
    required: [uri, offsets]
    properties:
      uri: {type: string, examples: [file:///work/app/index.html]}
      offsets: {type: array, items: {type: integer}, examples: [[10]]}
  response:
    type: object
    properties:
      ranges: {type: array}
  behavior:
  - if: '!(input.uri in state.documents)'
    then:
    - title: Unknown document - no ranges
      source: extensions/html-language-features/server/src/htmlServer.ts:527
      return: {ranges: []}
  - set: {vars.doc: '= state.documents[input.uri]', vars.out: []}
  - foreach: '= input.offsets'
    as: pos
    steps:
    - call: html-language-modes.get-mode-at-position
      input: {tokens: '= vars.doc.tokens', offset: '= vars.pos'}
      as: m
    - if: "vars.m.value.mode in ['javascript', 'typescript']"
      then:
      - title: The embedded mode's ranges, topped by the html mode's range
        source: extensions/html-language-features/server/src/modes/selectionRanges.ts:13-21
        call: html-javascript-mode.get-selection-range
        input: {ts_selection: "= has(vars.doc.ts_selection) ? vars.doc.ts_selection : []"}
        as: js
      - set: {vars.out: "= vars.out + [vars.js.value.chain + ['html']]"}
      else:
      - title: Otherwise the html range (nested under itself when the mode is html or css)
        source: extensions/html-language-features/server/src/modes/selectionRanges.ts:12-23
        set: {vars.out: "= vars.out + [vars.m.value.mode != '' ? [vars.m.value.mode, 'html'] : ['html']]"}
  - return: {ranges: '= vars.out'}
- component: html-server
  name: on-semantic-tokens
  kind: rpc
  summary: 'html/semanticTokens: unknown document gives null; otherwise the semantic token provider encodes the tokens of the document''s
    modes in the requested ranges.'
  sources:
  - extensions/html-language-features/server/src/htmlServer.ts:574-582
