# ------------------------------------------------------------------ html language server
- component: html-document-regions
  name: get-document-regions
  kind: function
  summary: 'getDocumentRegions: scan the HTML tokens - style content is css; script content is javascript unless its type attribute says
    typescript (text/typescript), a module, or an unknown type (no language); style= and on*= attribute values are css and javascript; script
    src values are imported scripts.'
  sources:
  - extensions/html-language-features/server/src/modes/embeddedSupport.ts:27-100
  - extensions/html-language-features/server/src/modes/embeddedSupport.ts:272-278
  request:
    type: object
    properties:
      tokens: {type: array, description: 'scanner tokens: {type: start-tag|attribute-name|attribute-value|styles|script, text, start, end}'}
  response:
    type: object
    properties:
      regions: {type: array}
      imported_scripts: {type: array}
  behavior:
  - set:
      vars.regions: []
      vars.imported: []
      vars.tag: ''
      vars.attr: ''
      vars.lang: javascript
      vars.module: false
  - foreach: '= input.tokens'
    as: t
    max: 1000
    steps:
    - if: "vars.t.type == 'start-tag'"
      then:
      - title: A start tag resets the attribute and the script language (javascript)
        source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:39-44
        set: {vars.tag: '= vars.t.text', vars.attr: '', vars.lang: javascript, vars.module: false}
      - continue: true
    - if: "vars.t.type == 'styles'"
      then:
      - set:
          vars.regions: "= vars.regions + [{'language_id': 'css', 'start': vars.t.start, 'end': vars.t.end, 'attribute_value': false, 'is_module': false}]"
      - continue: true
    - if: "vars.t.type == 'script'"
      then:
      - title: Script content takes the language from the type attribute
        source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:48-50
        set:
          vars.regions: "= vars.regions + [{'language_id': vars.lang, 'start': vars.t.start, 'end': vars.t.end, 'attribute_value': false, 'is_module': vars.module}]"
      - continue: true
    - if: "vars.t.type == 'attribute-name'"
      then:
      - set: {vars.attr: '= vars.t.text'}
      - continue: true
    - if: "vars.t.type == 'attribute-value'"
      then:
      - if: "vars.attr == 'src' && vars.tag.lowerAscii() == 'script'"
        then:
        - title: <script src> is an imported script
          source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:55-60
          set:
            vars.imported: "= vars.imported + [replace(vars.t.text, '^[\\'\"]|[\\'\"]$', '')]"
        else:
        - if: "vars.attr == 'type' && vars.tag.lowerAscii() == 'script'"
          then:
          - title: The script type picks javascript (module, text/javascript, text/babel...), typescript (text/typescript) or no language
            source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:61-73
            set:
              vars.module: "= vars.t.text.lowerAscii().matches('^[\\'\"]module[\\'\"]$') || vars.t.text.lowerAscii() == 'module'"
              vars.lang: "= vars.t.text.lowerAscii().matches('^[\\'\"]module[\\'\"]$') || vars.t.text.lowerAscii() == 'module' || vars.t.text.matches('[\\'\"](text|application)/(java|ecma)script[\\'\"]') || vars.t.text.matches('[\\'\"]text/babel[\\'\"]') ? 'javascript' : (vars.t.text.matches('[\\'\"]text/typescript[\\'\"]') ? 'typescript' : '')"
          else:
          - if: "vars.attr.matches('(?i)^(style|on\\\\w+)$')"
            then:
            - title: A style or on* attribute value is an embedded css or javascript region (quotes excluded)
              source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:75-85
              set:
                vars.regions: "= vars.regions + [{'language_id': vars.attr.lowerAscii() == 'style' ? 'css' : 'javascript', 'start': vars.t.text.matches('^[\\'\"]') ? vars.t.start + 1 : vars.t.start, 'end': vars.t.text.matches('^[\\'\"]') ? vars.t.end - 1 : vars.t.end, 'attribute_value': true, 'is_module': false}]"
      - set: {vars.attr: ''}
  - return: {regions: '= vars.regions', imported_scripts: '= vars.imported'}
- component: html-document-regions
  name: get-language-at-position
  kind: function
  summary: 'getLanguageAtPosition: the language of the first region containing the offset (regions are in document order), html outside
    every region; a script of unknown type has no language.'
  sources:
  - extensions/html-language-features/server/src/modes/embeddedSupport.ts:171-183
  request:
    type: object
    properties:
      regions: {type: array}
      offset: {type: integer}
  response:
    type: object
    properties:
      language_id: {type: string}
  behavior:
  - foreach: '= input.regions'
    as: r
    max: 1000
    steps:
    - if: vars.r.start > input.offset
      then:
      - break: true
    - if: input.offset <= vars.r.end
      then:
      - title: The offset is inside this region
        source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:174-177
        return: {language_id: '= vars.r.language_id'}
  - title: Outside every region it is html
    source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:182
    return: {language_id: html}
- component: html-document-regions
  name: get-languages-in-document
  kind: function
  summary: 'getLanguagesInDocument: the distinct languages of the regions (at most three), then html.'
  sources:
  - extensions/html-language-features/server/src/modes/embeddedSupport.ts:157-169
  request:
    type: object
    properties:
      regions: {type: array}
  response:
    type: object
    properties:
      languages: {type: array}
  behavior:
  - set: {vars.langs: []}
  - foreach: '= input.regions'
    as: r
    max: 1000
    steps:
    - if: "vars.r.language_id != '' && !(vars.r.language_id in vars.langs)"
      then:
      - set: {vars.langs: '= vars.langs + [vars.r.language_id]'}
      - if: size(vars.langs) == 3
        then:
        - title: Three embedded languages found - stop (html is not added)
          source: extensions/html-language-features/server/src/modes/embeddedSupport.ts:160-164
          return: {languages: '= vars.langs'}
  - return: {languages: "= vars.langs + ['html']"}
- component: html-language-modes
  name: get-mode-at-position
  kind: function
  summary: 'getModeAtPosition: the language at the position (from the document regions) names the mode; css and javascript/typescript
    modes exist only when those embedded languages are supported, and a script of unknown type has no mode.'
  sources:
  - extensions/html-language-features/server/src/modes/languageModes.ts:138-144
  request:
    type: object
    properties:
      tokens: {type: array}
      offset: {type: integer}
  response:
    type: object
    properties:
      mode: {type: string}
      regions: {type: array}
  behavior:
  - title: documentRegions.get(document) - the cached regions of the document
    source: extensions/html-language-features/server/src/modes/languageModes.ts:120
    call: html-document-regions.get-document-regions
    input: {tokens: '= input.tokens'}
    as: dr
  - call: html-document-regions.get-language-at-position
    input: {regions: '= vars.dr.value.regions', offset: '= input.offset'}
    as: lang
  - title: The modes created for the supported embedded languages (html always)
    source: extensions/html-language-features/server/src/modes/languageModes.ts:125-133
    set:
      vars.modes: "= ['html'] + (state.supported_languages.css ? ['css'] : []) + (state.supported_languages.javascript ? ['javascript', 'typescript'] : [])"
  - if: "vars.lang.value.language_id != '' && vars.lang.value.language_id in vars.modes"
    then:
    - return: {mode: '= vars.lang.value.language_id', regions: '= vars.dr.value.regions'}
  - title: No mode for this language
    source: extensions/html-language-features/server/src/modes/languageModes.ts:143
    return: {mode: '', regions: '= vars.dr.value.regions'}
- component: html-language-modes
  name: get-all-modes-in-document
  kind: function
  summary: 'getAllModesInDocument: the modes of the languages present in the document.'
  sources:
  - extensions/html-language-features/server/src/modes/languageModes.ts:155-164
  request:
    type: object
    properties:
      tokens: {type: array}
  response:
    type: object
    properties:
      modes: {type: array}
  behavior:
  - call: html-document-regions.get-document-regions
    input: {tokens: '= input.tokens'}
    as: dr
  - call: html-document-regions.get-languages-in-document
    input: {regions: '= vars.dr.value.regions'}
    as: langs
  - set:
      vars.modes: "= ['html'] + (state.supported_languages.css ? ['css'] : []) + (state.supported_languages.javascript ? ['javascript', 'typescript'] : [])"
  - title: Keep the languages that have a mode
    source: extensions/html-language-features/server/src/modes/languageModes.ts:157-162
    return: {modes: '= vars.langs.value.languages.filter(l, l in vars.modes)', regions: '= vars.dr.value.regions'}
- component: html-strings-utils
  name: get-word-at-text
  kind: function
  summary: 'getWordAtText: the word (by the word definition) that contains or ends at the offset on its line; none gives an empty range at
    the offset.'
  sources:
  - extensions/html-language-features/server/src/utils/strings.ts:6-27
  request:
    type: object
    properties:
      text: {type: string}
      offset: {type: integer}
  response:
    type: object
    properties:
      start: {type: integer}
      length: {type: integer}
  behavior:
  - title: Find the line start, then the word around the offset in the line
    source: extensions/html-language-features/server/src/utils/strings.ts:7-21
    set:
      vars.before: "= input.text.substring(input.text.substring(0, input.offset).lastIndexOf('\\n') + 1, input.offset)"
      vars.after: '= input.text.substring(input.offset)'
  - set:
      vars.pre: "= replace(vars.before, '^.*?([\\\\w$]*)$', '$1')"
      vars.post: "= replace(vars.after, '(?s)^([\\\\w$]*).*$', '$1')"
  - if: "vars.pre + vars.post == ''"
    then:
    - title: No word at the offset - an empty range there
      source: extensions/html-language-features/server/src/utils/strings.ts:26
      return: {start: '= input.offset', length: 0}
  - title: The match that reaches the offset
    source: extensions/html-language-features/server/src/utils/strings.ts:22-24
    return: {start: '= input.offset - size(vars.pre)', length: '= size(vars.pre) + size(vars.post)'}
- component: html-javascript-mode
  name: do-complete
  kind: function
  summary: 'doComplete: run TypeScript completions on the embedded script document (only the regions of this language, everything else
    blanked); no completions gives an empty complete list; each entry replaces the word at the offset and carries the data doResolve needs.'
  sources:
  - extensions/html-language-features/server/src/modes/javascriptMode.ts:145-173
  request:
    type: object
    properties:
      uri: {type: string}
      language_id: {type: string, enum: [javascript, typescript]}
      offset: {type: integer}
      text: {type: string}
      regions: {type: array}
      ts_completions: {type: array, description: entries the TypeScript language service returns at the offset}
  response:
    type: object
    properties:
      is_incomplete: {type: boolean}
      items: {type: array}
  behavior:
  - title: jsDocuments.get(document) - the embedded document holds only this language's regions
    source: extensions/html-language-features/server/src/modes/javascriptMode.ts:109
    set:
      vars.embedded: '= input.regions.filter(r, r.language_id == input.language_id)'
  - if: size(vars.embedded) == 0 || size(input.ts_completions) == 0
    then:
    - title: getCompletionsAtPosition found nothing
      source: extensions/html-language-features/server/src/modes/javascriptMode.ts:149-152
      return: {is_incomplete: false, items: []}
  - title: The replace range is the word at the offset
    source: extensions/html-language-features/server/src/modes/javascriptMode.ts:153
    call: html-strings-utils.get-word-at-text
    input: {text: '= input.text', offset: '= input.offset'}
    as: word
  - title: Each entry becomes an item with the data for doResolve (languageId, uri, offset)
    source: extensions/html-language-features/server/src/modes/javascriptMode.ts:154-171
    return:
      is_incomplete: false
      items: "= input.ts_completions.map(e, {'label': e.name, 'kind': e.kind, 'range_start': vars.word.value.start, 'range_length': vars.word.value.length, 'data': {'language_id': input.language_id, 'uri': input.uri, 'offset': input.offset}})"
- component: html-javascript-mode
  name: do-hover
  kind: function
  summary: 'doHover: TypeScript quick info at the offset as markdown - the signature in a typescript code block, then documentation and
    tags; no quick info, no hover.'
  sources:
  - extensions/html-language-features/server/src/modes/javascriptMode.ts:187-215
  request:
    type: object
    properties:
      quick_info: {type: object, description: 'the language service''s quick info at the offset ({} for none)'}
  behavior:
  - if: "!has(input.quick_info.signature)"
    then:
    - title: No quick info - no hover
      source: extensions/html-language-features/server/src/modes/javascriptMode.ts:214
      return: null
  - title: Signature in a typescript code block, then documentation, joined by blank lines
    source: extensions/html-language-features/server/src/modes/javascriptMode.ts:191-212
    set:
      vars.parts: "= (input.quick_info.signature != '' ? ['```typescript\\n' + input.quick_info.signature + '\\n```'] : []) + (has(input.quick_info.documentation) && input.quick_info.documentation != '' ? [input.quick_info.documentation] : [])"
  - return: {kind: markdown, contents: "= vars.parts.join('\\n\\n')"}
- component: html-javascript-mode
  name: get-selection-range
  kind: function
  summary: 'getSelectionRange: the TypeScript smart selection at the offset, converted span by span into nested selection ranges.'
  sources:
  - extensions/html-language-features/server/src/modes/javascriptMode.ts:369-378
  request:
    type: object
    properties:
      ts_selection: {type: array, description: spans of getSmartSelectionRange, innermost first}
  response:
    type: object
    properties:
      chain: {type: array}
  behavior:
  - if: size(input.ts_selection) == 0
    then:
    - return: {chain: ['javascript:offset']}
  - title: convertSelectionRange keeps each parent span
    source: extensions/html-language-features/server/src/modes/javascriptMode.ts:372-377
    return: {chain: "= input.ts_selection.map(s, 'javascript:' + s)"}
- component: html-javascript-mode
  name: get-semantic-tokens
  kind: function
  summary: 'getSemanticTokens: classify the embedded script document with the TypeScript language service; a document without script
    regions has none.'
  sources:
  - extensions/html-language-features/server/src/modes/javascriptMode.ts:438-442
  request:
    type: object
    properties:
      language_id: {type: string}
      regions: {type: array}
      tokens: {type: array}
  response:
    type: object
    properties:
      tokens: {type: array}
  behavior:
  - if: size(input.regions.filter(r, r.language_id == input.language_id)) == 0
    then:
    - return: {tokens: []}
  - title: The script document's semantic classifications
    source: extensions/html-language-features/server/src/modes/javascriptMode.ts:439-441
    return: {tokens: '= input.tokens'}
- component: html-semantic-token-provider
  name: get-semantic-tokens
  kind: function
  summary: 'getSemanticTokens: collect the tokens of every mode in the document that produces them, sort them, and encode as relative
    (line delta, char delta, length, type, modifiers) only those inside the requested ranges (the whole document by default).'
  sources:
  - extensions/html-language-features/server/src/modes/semanticTokens.ts:35-50
  - extensions/html-language-features/server/src/modes/semanticTokens.ts:97-137
  request:
    type: object
    properties:
      tokens: {type: array}
      js_semantic_tokens: {type: array}
      ranges: {type: array, description: '{start_line, end_line} ranges; none means the whole document'}
  response:
    type: object
    properties:
      data: {type: array}
  behavior:
  - call: html-language-modes.get-all-modes-in-document
    input: {tokens: '= input.tokens'}
    as: modes
  - set: {vars.all: []}
  - foreach: "= vars.modes.value.modes.filter(m, m in ['javascript', 'typescript'])"
    as: m
    steps:
    - title: Only the javascript/typescript modes have getSemanticTokens
      source: extensions/html-language-features/server/src/modes/semanticTokens.ts:37-46
      call: html-javascript-mode.get-semantic-tokens
      input: {language_id: '= vars.m', regions: '= vars.modes.value.regions', tokens: '= input.js_semantic_tokens'}
      as: t
    - set: {vars.all: '= vars.all + vars.t.value.tokens'}
  - set:
      vars.ranges: "= has(input.ranges) && size(input.ranges.filter(r, type(r) == map && has(r.start_line) && has(r.end_line))) > 0 ? input.ranges.filter(r, type(r) == map && has(r.start_line) && has(r.end_line)) : [{'start_line': 0, 'end_line': 1000000}]"
      vars.data: []
      vars.pl: 0
      vars.pc: 0
  - foreach: '= vars.all'
    as: tok
    max: 1000
    steps:
    - if: "!vars.ranges.exists(r, r.start_line <= vars.tok.line && vars.tok.line < r.end_line)"
      then:
      - title: A token outside the ranges is skipped
        source: extensions/html-language-features/server/src/modes/semanticTokens.ts:117-120
        continue: true
    - title: Encode relative to the previous token (char delta resets on a new line)
      source: extensions/html-language-features/server/src/modes/semanticTokens.ts:123-133
      set:
        vars.data: "= vars.data + [vars.tok.line - vars.pl, vars.tok.line == vars.pl ? vars.tok.character - vars.pc : vars.tok.character, vars.tok.length, vars.tok.type, vars.tok.modifiers]"
        vars.pl: '= vars.tok.line'
        vars.pc: '= vars.tok.character'
  - return: {data: '= vars.data'}
- component: html-document-context
  name: resolve-reference
  kind: function
  summary: 'resolveReference: a reference with a scheme is kept; one starting with / resolves against the workspace folder holding the
    document; anything else resolves against the document''s folder.'
  sources:
  - extensions/html-language-features/server/src/utils/documentContext.ts:11-42
  request:
    type: object
    properties:
      ref: {type: string, examples: [./style.css]}
      base: {type: string, examples: [file:///work/app/index.html]}
      workspace_folders: {type: array}
  response:
    type: object
    properties:
      uri: {type: string}
  behavior:
  - if: "input.ref.matches('^\\\\w[\\\\w\\\\d+.-]*:')"
    then:
    - title: The reference starts with a scheme
      source: extensions/html-language-features/server/src/utils/documentContext.ts:27-30
      return: {uri: '= input.ref'}
  - if: "input.ref.startsWith('/')"
    then:
    - foreach: '= input.workspace_folders'
      as: f
      steps:
      - title: getRootFolder - a folder URI (with a trailing / added by endsWith) that the document startsWith
        source: extensions/html-language-features/server/src/utils/strings.ts:29-52
        set:
          vars.folder: "= vars.f.endsWith('/') ? vars.f : vars.f + '/'"
      - if: input.base.startsWith(vars.folder)
        then:
        - title: Absolute paths resolve against the workspace folder
          source: extensions/html-language-features/server/src/utils/documentContext.ts:31-36
          return: {uri: '= vars.folder + input.ref.substring(1)'}
  - title: Resolve against the document's folder
    source: extensions/html-language-features/server/src/utils/documentContext.ts:37-39
    set:
      vars.u: "= replace((input.base.endsWith('/') ? input.base : replace(input.base, '/[^/]*$', '/')) + input.ref, '/(\\\\./)+', '/')"
  - foreach: '= [1, 2, 3, 4]'
    as: pass
    steps:
    - set: {vars.u: "= replace(vars.u, '/[^/]+/\\\\.\\\\./', '/')"}
  - return: {uri: '= vars.u'}
- component: html-node-file-fs
  name: stat
  kind: io
  summary: 'stat(location): only file: URIs; a missing file is reported as type Unknown with -1 times and size instead of an error.'
  sources:
  - extensions/html-language-features/server/src/node/nodeFs.ts:13-49
  request:
    type: object
    properties:
      location: {type: string, examples: [file:///work/app/src]}
  response:
    type: object
    properties:
      type: {type: string}
      size: {type: integer}
  errors:
  - code: file-system-provider-can-only-handle-file-urls
    status: 0
    retryable: false
  behavior:
  - if: "!input.location.startsWith('file:')"
    then:
    - title: ensureFileUri - fileSystemProvider can only handle file URLs
      source: extensions/html-language-features/server/src/node/nodeFs.ts:13-17
      fail: {code: file-system-provider-can-only-handle-file-urls, message: fileSystemProvider can only handle file URLs}
  - title: fs.stat the path
    source: extensions/html-language-features/server/src/node/nodeFs.ts:22-23
    call: disk.stat
    input: {resource: '= input.location'}
    on_error: continue
    as: st
  - if: '!vars.st.ok'
    then:
    - title: ENOENT is not an error - FileType.Unknown with ctime/mtime/size -1
      source: extensions/html-language-features/server/src/node/nodeFs.ts:24-27
      return: {type: unknown, ctime: -1, mtime: -1, size: -1}
  - title: File, directory or unknown, with times and size
    source: extensions/html-language-features/server/src/node/nodeFs.ts:32-46
    return:
      type: "= has(vars.st.value.type) && vars.st.value.type == 'directory' ? 'directory' : (has(vars.st.value.content) ? 'file' : 'unknown')"
      mtime: '= vars.st.value.mtime'
      size: '= vars.st.value.size'
- component: html-server
  name: on-completion
  kind: rpc
  summary: 'textDocument/completion: unknown document gives null; the mode at the position completes (no mode gives an empty incomplete
    list); html and css path completions resolve the reference through the DocumentContext and the file system provider.'
  sources:
  - extensions/html-language-features/server/src/htmlServer.ts:307-324
  request:
    type: object
    required: [uri, offset]
    properties:
      uri: {type: string, examples: [file:///work/app/index.html]}
      offset: {type: integer, examples: [10]}
      path_ref: {type: string, description: 'a path being typed in href/src or url() at the position', examples: [./src/]}
  behavior:
  - if: '!(input.uri in state.documents)'
    then:
    - title: The document is not open on the server
      source: extensions/html-language-features/server/src/htmlServer.ts:310-313
      return: null
  - set: {vars.doc: '= state.documents[input.uri]'}
  - title: languageModes.getModeAtPosition
    source: extensions/html-language-features/server/src/htmlServer.ts:314
    call: html-language-modes.get-mode-at-position
    input: {tokens: '= vars.doc.tokens', offset: '= input.offset'}
    as: m
  - if: "vars.m.value.mode == ''"
    then:
    - title: No mode (or no doComplete) - an empty incomplete list
      source: extensions/html-language-features/server/src/htmlServer.ts:315-317
      return: {mode: '', is_incomplete: true, items: []}
  - if: "vars.m.value.mode in ['javascript', 'typescript']"
    then:
    - call: html-javascript-mode.do-complete
      input:
        uri: '= input.uri'
        language_id: '= vars.m.value.mode'
        offset: '= input.offset'
        text: '= vars.doc.text'
        regions: '= vars.m.value.regions'
        ts_completions: "= has(vars.doc.ts_completions) ? vars.doc.ts_completions : []"
      as: c
    - return: {mode: '= vars.m.value.mode', is_incomplete: '= vars.c.value.is_incomplete', items: '= vars.c.value.items'}
  - if: has(input.path_ref)
    then:
    - title: getDocumentContext(document.uri, workspaceFolders) resolves the path for the language service's path completion
      source: extensions/html-language-features/server/src/htmlServer.ts:321-322
      call: html-document-context.resolve-reference
      input: {ref: '= input.path_ref', base: '= input.uri', workspace_folders: '= state.workspace_folders'}
      as: ref
    - title: The language service stats the resolved folder through the Node file system provider
      source: extensions/html-language-features/server/src/node/htmlServerMain.ts:33
      call: html-node-file-fs.stat
      input: {location: '= vars.ref.value.uri'}
      as: st
    - return: {mode: '= vars.m.value.mode', is_incomplete: false, items: "= vars.st.value.type == 'unknown' ? [] : [{'label': vars.ref.value.uri, 'kind': vars.st.value.type}]"}
  - return: {mode: '= vars.m.value.mode', is_incomplete: false, items: []}
- component: html-server
  name: on-hover
  kind: rpc
  summary: 'textDocument/hover: the mode at the position answers (javascript through TypeScript quick info); unknown document or no mode
    gives null.'
  sources:
  - extensions/html-language-features/server/src/htmlServer.ts:340-353
  request:
    type: object
    required: [uri, offset]
    properties:
      uri: {type: string, examples: [file:///work/app/index.html]}
      offset: {type: integer}
  behavior:
  - if: '!(input.uri in state.documents)'
    then:
    - return: null
  - set: {vars.doc: '= state.documents[input.uri]'}
  - title: languageModes.getModeAtPosition
    source: extensions/html-language-features/server/src/htmlServer.ts:344
    call: html-language-modes.get-mode-at-position
    input: {tokens: '= vars.doc.tokens', offset: '= input.offset'}
    as: m
  - if: "vars.m.value.mode == ''"
    then:
    - title: No mode with doHover - null
      source: extensions/html-language-features/server/src/htmlServer.ts:345-352
      return: null
  - if: "vars.m.value.mode in ['javascript', 'typescript']"
