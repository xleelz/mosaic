flows:
- id: emmet-expand-abbreviation-command
  name: emmet.expandAbbreviation through the command service
  sources:
  - extensions/emmet/src/emmetCommon.ts:33-35
  entry:
    caller: user
    interface: command-service.execute-command
    input:
      command_id: emmet.expandAbbreviation
      args: []
scenarios:
- id: builtin-extensions-emmet-expand-via-command-service
  description: command-service.execute-command resolves emmet.expandAbbreviation from commands-registry (registered by emmetCommon.ts:33)
    and runs emmet-extension.cmd-emmet-expandabbreviation, which expands the abbreviation before the caret.
  flow: emmet-expand-abbreviation-command
  fixtures: [one-window-folder, builtin-extensions-seed]
  state:
    emmet-extension@eh1:
      editor:
        active: true
        language_id: html
        line_before_cursor: '  ul>li.item'
        node: {type: tag, name: div, has_open: true, has_close: true, text_before: ''}
  expect:
  - result.ok
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'emmet-extension.cmd-emmet-expandabbreviation')"
  - "state['emmet-extension@eh1'].editor.edits[0].abbreviation == 'ul>li.item'"
