components:
  - id: typescript-extension
    name: typescript-language-features main (activate)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "vscode.typescript-language-features' Node entry: registers the TSGO-only commands when the native preview is on, otherwise the command manager, the lazy client host, the base commands, the task provider and lazy activation."
    sources: ["extensions/typescript-language-features/src/extension.ts:32-110", "extensions/typescript-language-features/package.json:58-71"]
    attributes: {owner: builtin-extensions, extension: vscode.typescript-language-features}
    state:
      schema: {type: object, properties: {activated: {type: boolean}, mode: {type: string}}}
      initial: {activated: false, mode: ""}
  - id: lazy-client-host
    name: lazyClientHost (createLazyClientHost, lazilyActivateClient)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Creates the TypeScriptServiceClientHost on first use, and forces it when the first JS/TS (or tsconfig/jsconfig) document is open."
    sources: ["extensions/typescript-language-features/src/lazyClientHost.ts:23-100"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {has_activated: {type: boolean}, host_created: {type: boolean}}}
      initial: {has_activated: false, host_created: false}
  - id: typescript-service-client-host
    name: TypeScriptServiceClientHost
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Owns the service client, the language providers per language description and the status items; starts the server on construction."
    sources: ["extensions/typescript-language-features/src/typeScriptServiceClientHost.ts:51-135"]
    attributes: {owner: builtin-extensions}
  - id: typescript-service-client
    name: TypeScriptServiceClient
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Manages the tsserver lifecycle (start, restart, crash accounting with a 5-crash limit) and sends requests; without a running server requests answer NoServer."
    sources: ["extensions/typescript-language-features/src/typescriptServiceClient.ts:112-130"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {server_state: {type: string, enum: [none, running, errored]}, number_restarts: {type: integer}, last_start: {type: integer}, fatally_crashed: {type: boolean}, is_restarting: {type: boolean}, token: {type: integer}, prompting_after_crash: {type: boolean}, sent: {type: array}}}
      initial: {server_state: none, number_restarts: 0, last_start: 0, fatally_crashed: false, is_restarting: false, token: 0, prompting_after_crash: false, sent: []}
  - id: typescript-server-spawner
    name: TypeScriptServerSpawner
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Spawns one, two (syntax plus semantic) or a syntax-only tsserver according to js/ts.tsserver.useSyntaxServer."
    sources: ["extensions/typescript-language-features/src/tsServer/spawner.ts:38-121"]
    attributes: {owner: builtin-extensions}
  - id: typescript-command-manager
    name: CommandManager (typescript-language-features)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Ref-counted registry of the TypeScript commands; each id is registered once with vscode.commands.registerCommand(id, command.execute)."
    sources: ["extensions/typescript-language-features/src/commands/commandManager.ts:14-41", "extensions/typescript-language-features/src/commands/index.ts:22-41"]
    attributes: {owner: builtin-extensions}

interfaces:
  - component: typescript-extension
    name: activate
    kind: function
    summary: "activate: when js/ts.experimental.useTsgo is on (or a TS native preview extension is installed) only DisableTsgoCommand is registered; otherwise the CommandManager, lazy client host, base commands and lazilyActivateClient."
    sources: ["extensions/typescript-language-features/src/extension.ts:32-110", "extensions/typescript-language-features/package.json:58-71"]
    request: {type: object, properties: {extension_id: {type: string, default: vscode.typescript-language-features}, activation_event: {type: string, default: "onLanguage:typescript"}}}
    response: {type: object, properties: {mode: {type: string}}}
    behavior:
      - set: {state.activated: true}
      - title: requireHasVsCodeExtension looks for a TS native preview extension (none is installed in the fixtures)
        source: "extensions/typescript-language-features/src/languageFeatures/util/dependentRegistration.ts:130-139"
        call: vscode-api.extensions-get-extension
        input: {extension_id: typescriptteam.vscode-typescript}
      - if: "config['js-ts-experimental-use-tsgo']"
        then:
          - title: "TSGO mode: only the disable-TSGO command, no tsserver"
            source: "extensions/typescript-language-features/src/extension.ts:62-73"
            call: vscode-api.commands-register-command
            input: {command_id: typescript.experimental.disableTsgo}
          - set: {state.mode: tsgo}
          - return: {mode: tsgo}
      - title: Register the base commands (restart, reload projects, select version ...)
        source: "extensions/typescript-language-features/src/extension.ts:98"
        call: vscode-api.commands-register-command
        input: {command_id: typescript.restartTsServer}
      - call: vscode-api.workspace-text-documents
        as: docs
      - title: lazilyActivateClient checks the documents already open
        source: "extensions/typescript-language-features/src/extension.ts:104"
        call: lazy-client-host.lazily-activate-client
        input: {documents: "= vars.docs.value"}
      - set: {state.mode: tsserver}
      - return: {mode: tsserver}
  - component: lazy-client-host
    name: lazily-activate-client
    kind: function
    summary: "lazilyActivateClient: activate on the first supported document already open, else wait for onDidOpenTextDocument."
    sources: ["extensions/typescript-language-features/src/lazyClientHost.ts:50-92"]
    request: {type: object, properties: {documents: {type: array, items: {type: object}}}}
    behavior:
      - title: Try each open document until one activates the client
        source: "extensions/typescript-language-features/src/lazyClientHost.ts:80"
        foreach: "= input.documents"
        as: doc
        steps:
          - call: lazy-client-host.maybe-activate
            input: {uri: "= vars.doc.uri", language_id: "= vars.doc.language_id"}
            as: act
          - if: "vars.act.value.activated"
            then:
              - break: true
      - return: {activated: "= state.has_activated"}
  - component: lazy-client-host
    name: maybe-activate
    kind: event
    summary: "maybeActivate (also the onDidOpenTextDocument listener): the first JS/TS document, or tsconfig/jsconfig, outside the disabled schemes forces the client host."
    sources: ["extensions/typescript-language-features/src/lazyClientHost.ts:64-78", "extensions/typescript-language-features/src/lazyClientHost.ts:94-100"]
    request: {type: object, required: [uri, language_id], properties: {uri: {type: string, examples: ["file:///work/app/src/main.ts"]}, language_id: {type: string, examples: [typescript]}}}
    response: {type: object, properties: {activated: {type: boolean}}}
    behavior:
      - if: "state.has_activated"
        then:
          - return: {activated: false}
      - if: "!(input.language_id in ['typescript', 'typescriptreact', 'javascript', 'javascriptreact'] || input.uri.endsWith('tsconfig.json') || input.uri.endsWith('jsconfig.json'))"
        then:
          - title: Not a JS/TS document
            source: "extensions/typescript-language-features/src/lazyClientHost.ts:98"
            return: {activated: false}
      - set: {state.has_activated: true}
      - title: "Force activation: void lazyClientHost.value"
        source: "extensions/typescript-language-features/src/lazyClientHost.ts:68-73"
        call: lazy-client-host.get-value
      - return: {activated: true}
  - component: lazy-client-host
    name: get-value
    kind: function
    summary: "lazyClientHost.value: construct the TypeScriptServiceClientHost on first access."
    sources: ["extensions/typescript-language-features/src/lazyClientHost.ts:40-47"]
    behavior:
      - if: "state.host_created"
        then:
          - return: {created: false}
      - set: {state.host_created: true}
      - call: typescript-service-client-host.create
      - return: {created: true}
  - component: typescript-service-client-host
    name: create
    kind: function
    summary: "Constructor: create the TypeScriptServiceClient and the language providers, then ensureServiceStarted."
    sources: ["extensions/typescript-language-features/src/typeScriptServiceClientHost.ts:65-122"]
    behavior:
      - title: Start the server as part of construction
        source: "extensions/typescript-language-features/src/typeScriptServiceClientHost.ts:122"
        call: typescript-service-client.ensure-service-started
  - component: typescript-service-client-host
    name: reload-projects
    kind: function
    summary: "reloadProjects: send 'reloadProjects' without waiting and re-trigger diagnostics."
    sources: ["extensions/typescript-language-features/src/typeScriptServiceClientHost.ts:183-186"]
    behavior:
      - call: typescript-service-client.execute-without-waiting-for-response
        input: {command: reloadProjects}
  - component: typescript-service-client
    name: ensure-service-started
    kind: function
    summary: "ensureServiceStarted: start the server unless one is running."
    sources: ["extensions/typescript-language-features/src/typescriptServiceClient.ts:377-381"]
    behavior:
      - if: "state.server_state != 'running'"
        then:
          - call: typescript-service-client.start-service
            input: {resend_models: false}
  - component: typescript-service-client
    name: start-service
    kind: function
    summary: "startService: refuse after too many crashes; otherwise spawn tsserver through the spawner, mark Running, bump the generation token and record lastStart."
    sources: ["extensions/typescript-language-features/src/typescriptServiceClient.ts:384-422", "extensions/typescript-language-features/src/typescriptServiceClient.ts:530-539"]
    request: {type: object, properties: {resend_models: {type: boolean, default: false}}}
    response: {type: object, properties: {server_state: {type: string}}}
    behavior:
      - if: "state.fatally_crashed"
        then:
          - title: "Not starting server: too many crashes"
            source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:392-395"
            return: {server_state: none}
      - title: Spawn the server processes
        source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:413-416"
        call: typescript-server-spawner.spawn
      - set: {state.server_state: running, state.last_start: "= now", state.token: "= state.token + 1"}
      - return: {server_state: running}
  - component: typescript-service-client
    name: restart-ts-server
    kind: function
    summary: "restartTsServer: kill the running server (marking the exit as a restart), reset the crash counters when the user asked, and start a new one."
    sources: ["extensions/typescript-language-features/src/typescriptServiceClient.ts:322-337"]
    request: {type: object, properties: {from_user_action: {type: boolean, default: true}}}
    behavior:
      - if: "state.server_state == 'running'"
        then:
          - title: Killing TS Server
            source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:323-327"
            set: {state.is_restarting: true}
          - call: language-server.kill
            input: {server: tsserver}
      - when: "input.from_user_action"
        title: Reset the crash trackers
        source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:329-334"
        set: {state.fatally_crashed: false, state.number_restarts: 0, state.last_start: "= now"}
      - call: typescript-service-client.start-service
        input: {resend_models: true}
  - component: typescript-service-client
    name: on-exit
    kind: event
    summary: "The server handle's onExit: ignore exits of an old generation; otherwise serviceExited(restart = !isRestarting): count restarts, stop after 5 crashes within 10 s, warn after 5 within 5 minutes, warn after each crash on code-oss and Insiders builds, and restart."
    sources: ["extensions/typescript-language-features/src/typescriptServiceClient.ts:491-524", "extensions/typescript-language-features/src/typescriptServiceClient.ts:647-773"]
    request: {type: object, properties: {code: {type: integer, default: 1}, signal: {type: string, default: ""}, token: {type: integer, default: 1}}}
    response: {type: object, properties: {restarted: {type: boolean}}}
    behavior:
      - if: "input.token != state.token"
        then:
          - title: The exit comes from an old process
            source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:513-516"
            return: {restarted: false, ignored: true}
      - set: {vars.restart: "= !state.is_restarting", state.is_restarting: false, state.server_state: none}
      - if: "!vars.restart"
        then:
          - return: {restarted: false}
      - set: {vars.diff: "= now - state.last_start", state.number_restarts: "= state.number_restarts + 1"}
      - if: "state.number_restarts > 5"
        then:
          - set: {state.number_restarts: 0}
          - if: "vars.diff < 10000"
            then:
              - title: Crashed 5 times within 10 seconds, give up
                source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:672-681"
                set: {state.last_start: "= now", state.fatally_crashed: true}
              - call: vscode-api.window-show-error-message
                input: {message: "The JS/TS language service immediately crashed 5 times. The service will not be restarted.", items: [Report Issue]}
              - return: {restarted: false, fatal: true}
          - if: "vars.diff < 300000"
            then:
              - title: Crashed 5 times in the last 5 minutes
                source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:694-705"
                set: {state.last_start: "= now"}
              - call: vscode-api.window-show-warning-message
                input: {message: "The JS/TS language service crashed 5 times in the last 5 Minutes.", items: [Report Issue]}
        else:
          - if: "config['url-protocol'] in ['vscode-insiders', 'code-oss']"
            then:
              - title: Insiders and OSS builds reset the counter and prompt after a single crash
                source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:707-718"
                set: {state.number_restarts: 0}
              - when: "!state.prompting_after_crash"
                call: vscode-api.window-show-warning-message
                input: {message: The JS/TS language service crashed., items: [Report Issue]}
      - title: Restart the service
        source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:770-772"
        call: typescript-service-client.start-service
        input: {resend_models: true}
      - return: {restarted: true}
  - component: typescript-service-client
    name: execute
    kind: function
    summary: "execute/executeImpl: send a request to the running server and wait for its response; with no running server the answer is ServerResponse.NoServer; a cancelled token answers 'cancelled'."
    sources: ["extensions/typescript-language-features/src/typescriptServiceClient.ts:875-929", "extensions/typescript-language-features/src/typescriptServiceClient.ts:947-956"]
    request: TsExecuteRequest
    response: TsServerResponse
    behavior:
      - if: "state.server_state != 'running'"
        then:
          - title: No server, ServerResponse.NoServer
            source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:954-955"
            return: {type: noServer}
      - if: "input.token.canceled"
        then:
          - title: The request was cancelled before it was answered
            source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:878-884"
            return: {type: cancelled}
      - call: language-server.request
        input: {server: tsserver, command: "= input.command", args: "= input.args"}
        as: res
      - set: {state.sent: "= state.sent + [input.command]"}
      - return: {type: response, success: true, body: "= vars.res.value.body"}
  - component: typescript-service-client
    name: execute-without-waiting-for-response
    kind: function
    summary: "executeWithoutWaitingForResponse: fire a request with expectsResult false; dropped when no server runs."
    sources: ["extensions/typescript-language-features/src/typescriptServiceClient.ts:931-937"]
    request: {type: object, properties: {command: {type: string, examples: [reloadProjects]}}}
    behavior:
      - if: "state.server_state != 'running'"
        then:
          - return: {sent: false}
      - call: language-server.request
        input: {server: tsserver, command: "= input.command", args: {}}
      - set: {state.sent: "= state.sent + [input.command]"}
      - return: {sent: true}
  - component: typescript-server-spawner
    name: spawn
    kind: function
    summary: "spawn: js/ts.tsserver.useSyntaxServer 'auto' runs a syntax and a semantic server (dynamic routing on TS >= 4.0), 'never' one main server, 'always' a syntax-only server."
    sources: ["extensions/typescript-language-features/src/tsServer/spawner.ts:56-99", "extensions/typescript-language-features/src/tsServer/spawner.ts:102-121"]
    behavior:
      - if: "config['js-ts-tsserver-use-syntax-server'] == 'auto'"
        then:
          - title: "SeparateSyntax: syntax and semantic processes"
            source: "extensions/typescript-language-features/src/tsServer/spawner.ts:69-78"
            call: language-server.start
            input: {server: tsserver, kind: syntax}
          - call: language-server.start
            input: {server: tsserver, kind: semantic}
          - return: {processes: 2}
      - call: language-server.start
        input: {server: tsserver, kind: "= config['js-ts-tsserver-use-syntax-server'] == 'always' ? 'syntax' : 'main'"}
      - return: {processes: 1}
  - component: typescript-command-manager
    name: cmd-typescript-restarttsserver
    kind: command
    summary: "typescript.restartTsServer: lazyClientHost.value.serviceClient.restartTsServer(true) (creates the host first if needed)."
    sources: ["extensions/typescript-language-features/package.json:2863", "extensions/typescript-language-features/src/commands/restartTsServer.ts:10-20"]
    request: BuiltinCommandRequest
    behavior:
      - call: lazy-client-host.get-value
      - call: typescript-service-client.restart-ts-server
        input: {from_user_action: true}
  - component: typescript-command-manager
    name: cmd-typescript-reloadprojects
    kind: command
    summary: "typescript.reloadProjects: lazyClientHost.value.reloadProjects()."
    sources: ["extensions/typescript-language-features/package.json:2833", "extensions/typescript-language-features/src/commands/reloadProject.ts:10-20"]
    request: BuiltinCommandRequest
    behavior:
      - call: lazy-client-host.get-value
      - call: typescript-service-client-host.reload-projects
  - component: typescript-command-manager
    name: cmd-javascript-reloadprojects
    kind: command
    summary: "javascript.reloadProjects: the same reloadProjects as for TypeScript."
    sources: ["extensions/typescript-language-features/package.json:2838", "extensions/typescript-language-features/src/commands/reloadProject.ts:22-32"]
    request: BuiltinCommandRequest
    behavior:
      - call: lazy-client-host.get-value
      - call: typescript-service-client-host.reload-projects
  - component: typescript-command-manager
    name: cmd-typescript-tsserverrequest
    kind: command
    summary: "typescript.tsserverRequest (API command, activation event only): forwards read-only tsserver commands on an allow list, or any '_'-prefixed one; others return undefined."
    sources: ["extensions/typescript-language-features/src/commands/tsserverRequests.ts:22-71", "extensions/typescript-language-features/package.json:64"]
    request: BuiltinCommandRequest
    behavior:
      - set: {vars.command: "= size(input.args) > 0 ? string(input.args[0]) : ''"}
      - if: "!(vars.command in ['emit-output', 'semanticDiagnosticsSync', 'syntacticDiagnosticsSync', 'suggestionDiagnosticsSync', 'quickinfo', 'quickinfo-full', 'completionInfo'] || vars.command.startsWith('_'))"
        then:
          - title: Not on the allow list
            source: "extensions/typescript-language-features/src/commands/tsserverRequests.ts:67-70"
            return: null
      - call: lazy-client-host.get-value
      - call: typescript-service-client.execute
        input: {command: "= vars.command", args: {}, token: {canceled: false}}
        as: res
      - return: "= vars.res.value"
  - component: typescript-command-manager
    name: cmd-typescript-selecttypescriptversion
    kind: command
    summary: "typescript.selectTypeScriptVersion: lazyClientHost.value.serviceClient.showVersionPicker(), a quick pick of the bundled and workspace TypeScript versions."
    sources: [PKG:typescript.selectTypeScriptVersion, "extensions/typescript-language-features/src/commands/selectTypeScriptVersion.ts:10-21", "extensions/typescript-language-features/src/typescriptServiceClient.ts:547-549"]
    request: BuiltinCommandRequest
    behavior:
      - call: lazy-client-host.get-value
      - title: promptUserForVersion shows the version quick pick
        source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:548"
        call: vscode-api.window-show-quick-pick
        input: {placeholder: Select the TypeScript version used for JavaScript and TypeScript language features}
  - component: typescript-command-manager
    name: cmd-typescript-gotoprojectconfig
    kind: command
    summary: "typescript.goToProjectConfig: open the tsconfig.json of the active JS/TS editor's project; nothing without one."
    sources: [PKG:typescript.goToProjectConfig, "extensions/typescript-language-features/src/commands/goToProjectConfiguration.ts:12-25"]
    request: BuiltinCommandRequest
    behavior: GOTO_PROJECT
  - component: typescript-command-manager
    name: cmd-javascript-gotoprojectconfig
    kind: command
    summary: "javascript.goToProjectConfig: open the jsconfig.json of the active JS/TS editor's project; nothing without one."
    sources: [PKG:javascript.goToProjectConfig, "extensions/typescript-language-features/src/commands/goToProjectConfiguration.ts:28-41"]
    request: BuiltinCommandRequest
    behavior: GOTO_PROJECT
  - component: typescript-command-manager
    name: cmd-typescript-opentsserverlog
    kind: command
    summary: "typescript.openTsServerLog: open the TS Server log, or with js/ts.tsserver.log off (the default) offer to enable logging and restart."
    sources: [PKG:typescript.openTsServerLog, "extensions/typescript-language-features/src/commands/openTsServerLog.ts:10-20", "extensions/typescript-language-features/src/typescriptServiceClient.ts:551-570"]
    request: BuiltinCommandRequest
    behavior:
      - call: lazy-client-host.get-value
      - if: "config['js-ts-tsserver-log'] == 'off'"
        then:
          - title: Logging is off, offer to enable it and restart
            source: "extensions/typescript-language-features/src/typescriptServiceClient.ts:552-557"
            call: vscode-api.window-show-error-message
            input: {message: "TS Server logging is off. Please set 'js/ts.tsserver.log' and restart the TS server to enable logging", items: [Enable logging and restart TS server]}
          - return: {opened: false}
      - call: vscode-api.window-show-text-document
        input: {uri: "file:///tmp/tsserver.log"}
      - return: {opened: true}
  - component: typescript-command-manager
    name: cmd-typescript-findallfilereferences
    kind: command
    summary: "typescript.findAllFileReferences: ask tsserver for 'fileReferences' of the resource (or active editor) and show them in the references view."
    sources: [PKG:typescript.findAllFileReferences, "extensions/typescript-language-features/src/languageFeatures/fileReferences.ts:25-75"]
    request: BuiltinCommandRequest
    behavior:
      - if: "size(input.args) == 0"
        then:
          - title: No resource provided
            source: "extensions/typescript-language-features/src/languageFeatures/fileReferences.ts:31-35"
            call: vscode-api.window-show-error-message
            input: {message: Find file references failed. No resource provided.}
          - return: {found: false}
      - title: tsserver fileReferences request (with window progress)
        source: "extensions/typescript-language-features/src/languageFeatures/fileReferences.ts:54-56"
        call: typescript-service-client.execute
        input: {command: fileReferences, args: {}, token: {canceled: false}}
        as: res
      - return: {found: "= vars.res.value.type == 'response'"}
  - component: typescript-command-manager
    name: cmd-typescript-gotosourcedefinition
    kind: command
    summary: "typescript.goToSourceDefinition: ask tsserver for 'findSourceDefinition' at the cursor and open or peek the locations."
    sources: [PKG:typescript.goToSourceDefinition, "extensions/typescript-language-features/src/languageFeatures/sourceDefinition.ts:25-72"]
    request: BuiltinCommandRequest
    behavior:
      - title: tsserver findSourceDefinition request
        source: "extensions/typescript-language-features/src/languageFeatures/sourceDefinition.ts:57"
        call: typescript-service-client.execute
        input: {command: findSourceDefinition, args: {}, token: {canceled: false}}
        as: res
      - return: {found: "= vars.res.value.type == 'response'"}
  - component: typescript-command-manager
    name: cmd-typescript-sortimports
    kind: command
    summary: "typescript.sortImports: run editor.action.sourceAction with kind source.sortImports and apply the first."
    sources: [PKG:typescript.sortImports, "extensions/typescript-language-features/src/languageFeatures/organizeImports.ts:173-181"]
    request: BuiltinCommandRequest
    behavior: SOURCE_ACTION_SORT
  - component: typescript-command-manager
    name: cmd-javascript-sortimports
    kind: command
    summary: "javascript.sortImports: run editor.action.sourceAction with kind source.sortImports and apply the first."
    sources: [PKG:javascript.sortImports, "extensions/typescript-language-features/src/languageFeatures/organizeImports.ts:173-181"]
    request: BuiltinCommandRequest
    behavior: SOURCE_ACTION_SORT
  - component: typescript-command-manager
