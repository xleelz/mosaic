  - component: git-repository
    name: operation
    kind: function
    summary: "A Repository method other than status, add and commit: read-only queries (refs, commits, stashes, worktrees) run git directly; every other method goes through run(), which locks out file-change refreshes and updates the model state afterwards."
    sources: ["extensions/git/src/repository.ts:2863-2883", "extensions/git/src/operation.ts:140-191"]
    request: {type: object, properties: {operation: {type: string, examples: [fetch]}, subcommand: {type: string, examples: [fetch]}, read_only: {type: boolean, default: false}}}
