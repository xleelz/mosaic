  - component: git-repository
    name: eventually-update-when-idle-and-wait
    kind: function
    summary: "@debounce(1000) eventuallyUpdateWhenIdleAndWait: only the last change in a burst calls updateWhenIdleAndWait."
    sources: ["extensions/git/src/repository.ts:3361-3364"]
    request: {type: object, properties: {scheduled_at: {type: integer}}}
    behavior:
