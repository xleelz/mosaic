      - return: {staged: "= vars.paths"}
  - component: git-command-center
    name: cmd-git-stageall
    kind: command
    summary: "git.stageAll: stage every working tree and untracked change ('git add -A', or '-u' unless git.untrackedChanges is mixed)."
    sources: ["extensions/git/package.json:187", "extensions/git/src/commands.ts:1583-1593"]
    request: BuiltinCommandRequest
    behavior:
      - call: git-repository.get-resource-groups
        as: groups
      - set: {vars.uris: "= vars.groups.value.working_tree + vars.groups.value.untracked"}
      - if: "size(vars.uris) == 0"
        then:
          - return: {staged: []}
      - call: git-repository.add
        input: {resources: "= vars.uris", update: "= config['git-untracked-changes'] != 'mixed'"}
      - return: {staged: "= vars.uris"}
  - component: git-command-center
    name: cmd-git-commit
    kind: command
    summary: "git.commit: commitWithAnyInput with no options."
    sources: ["extensions/git/package.json:336", "extensions/git/src/commands.ts:2614-2617"]
    request: BuiltinCommandRequest
    behavior:
      - call: git-command-center.commit-with-any-input
        input: {amend: false, all: false, empty: false, no_verify: false}
        as: r
      - return: "= vars.r.value"
  - component: git-command-center
    name: commit-with-any-input
    kind: function
    summary: "commitWithAnyInput then smartCommit: optional save prompt, smart commit of all changes when nothing is staged, empty-commit prompt, the noVerify gate, the commit message from the SCM input box (or the git editor when git.useEditorAsCommitInput), then Repository.commit."
    sources: ["extensions/git/src/commands.ts:2374-2573", "extensions/git/src/commands.ts:2576-2612"]
    request: {type: object, properties: {amend: {type: boolean, default: false}, all: {type: boolean, default: false}, empty: {type: boolean, default: false}, no_verify: {type: boolean, default: false}}}
    behavior:
      - call: git-repository.get-resource-groups
        as: groups
      - set:
          vars.no_staged: "= size(vars.groups.value.index) == 0"
          vars.no_unstaged: "= size(vars.groups.value.working_tree) == 0"
          vars.smart: "= config['git-enable-smart-commit']"
          vars.all: "= input.all"
          vars.empty: "= input.empty"
      - title: git.promptToSaveFilesBeforeCommit asks about unsaved files in the repository
        source: "extensions/git/src/commands.ts:2391-2423"
        choice: unsaved_files
        default: none
        options:
          none: []
          save_all_and_commit:
            - call: vscode-api.text-document-save
              input: {uri: "file:///work/app/src/main.ts"}
          commit_without_saving: []
          cancel:
            - return: {committed: false, reason: cancelled-save-prompt}
      - if: "!input.empty && !vars.no_unstaged && vars.no_staged && !vars.smart && !input.all && !input.amend"
        then:
          - if: "!config['git-suggest-smart-commit']"
            then:
              - return: {committed: false, reason: nothing-staged}
          - title: Offer to stage all changes and commit them directly
            source: "extensions/git/src/commands.ts:2433-2452"
            call: vscode-api.window-show-warning-message
            input: {message: "There are no staged changes to commit.\n\nWould you like to stage all your changes and commit them directly?", modal: true, items: ["Yes", Always, Never]}
          - choice: smart_commit
            default: "yes"
            options:
              "yes":
                - set: {vars.smart: true}
              always:
                - call: vscode-api.workspace-configuration-update
                  input: {section: git.enableSmartCommit, value: true, global: true}
                - set: {vars.smart: true}
              never:
                - call: vscode-api.workspace-configuration-update
                  input: {section: git.suggestSmartCommit, value: false, global: true}
                - return: {committed: false, reason: never}
              cancel:
                - return: {committed: false, reason: cancelled}
      - title: "Smart commit: commit all changes when nothing is staged"
        source: "extensions/git/src/commands.ts:2456-2458"
        set: {vars.all: "= input.all || (vars.smart && vars.no_staged)"}
      - set: {vars.use_editor: "= config['git-use-editor-as-commit-input']"}
      - if: "((vars.no_staged && vars.no_unstaged) || (!vars.all && vars.no_staged)) && !input.amend && !vars.empty && size(vars.groups.value.merge) == 0"
        then:
          - title: There are no changes to commit
            source: "extensions/git/src/commands.ts:2479-2504"
            call: vscode-api.window-show-information-message
            input: {message: There are no changes to commit., items: [Create Empty Commit]}
          - choice: empty_commit
            default: dismiss
            options:
              dismiss:
                - return: {committed: false, reason: no-changes}
              create:
                - set: {vars.empty: true}
      - if: "input.no_verify && !config['git-allow-no-verify-commit']"
        then:
          - title: Commits without verification are not allowed
            source: "extensions/git/src/commands.ts:2507-2511"
            call: vscode-api.window-show-error-message
            input: {message: "Commits without verification are not allowed, please enable them with the \"git.allowNoVerifyCommit\" setting."}
          - return: {committed: false, reason: no-verify-not-allowed}
      - set: {vars.message: "= vars.groups.value.input_box_value"}
      - if: "vars.message == '' && !vars.use_editor && !input.amend"
        then:
          - title: Ask for a commit message in an input box
            source: "extensions/git/src/commands.ts:2583-2605"
            choice: message_input
            default: provided
            options:
              provided:
                - set: {vars.message: "Update main.ts"}
              cancel:
                - return: {committed: false, reason: no-message}
      - title: Commit through Repository.commit (all becomes 'tracked' unless untracked changes are mixed)
        source: "extensions/git/src/commands.ts:2532-2572"
        call: git-repository.commit
        input:
          message: "= vars.message"
          all: "= !vars.all ? 'false' : ((config['git-smart-commit-changes'] == 'tracked' || config['git-untracked-changes'] != 'mixed') ? 'tracked' : 'true')"
          amend: "= input.amend"
          use_editor: "= vars.use_editor"
          empty: "= vars.empty"
      - return: {committed: true, all: "= vars.all"}
