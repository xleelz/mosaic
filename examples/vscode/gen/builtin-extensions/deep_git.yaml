  # ---------------------------------------------------------------- git-command-center
  - component: git-command-center
    name: run-command
    kind: function
    summary: "createCommand's wrapper, registered for every git command: resolve the repository for repository commands (from the first argument, else pickRepository), call the method, and turn any error into an error, warning or information notification; the command itself resolves."
    sources: ["extensions/git/src/commands.ts:5527-5690"]
    request: BuiltinCommandRequest
    behavior:
      - set: {vars.slug: "= 'git-command-center.cmd-' + input.command_id.lowerAscii().replace('.', '-').replace('_', '-')"}
      - if: "input.command_id in state.repository_commands"
        then:
          - title: Guess the repository from the first argument, else pick one
            source: "extensions/git/src/commands.ts:5534-5545"
            call: "= size(input.args) > 0 ? 'git-model.get-repository' : 'git-model.pick-repository'"
            targets: [git-model.get-repository, git-model.pick-repository]
            input: "= size(input.args) > 0 ? {'uri': string(input.args[0])} : {}"
            as: repo
            on_error:
              - call: git-command-center.show-error-notification
                input: {code: "= error.code", message: "= error.message"}
              - return: {ok: false, notified: true}
          - if: "vars.repo.value.root == ''"
            then:
              - title: No repository chosen, nothing runs
                source: "extensions/git/src/commands.ts:5548-5550"
                return: {ok: true, ran: false}
      - title: Run the command method
        source: "extensions/git/src/commands.ts:5531-5549"
        call: "= vars.slug"
        targets: TARGETS_GIT
        input: "= input"
        as: ran
        on_error:
          - title: The error becomes a notification; the command resolves
            source: "extensions/git/src/commands.ts:5561-5686"
            call: git-command-center.show-error-notification
            input: {code: "= error.code", message: "= error.message"}
          - return: {ok: false, notified: true}
      - return: {ok: true, ran: true, value: "= vars.ran.value"}
  - component: git-command-center
    name: show-error-notification
    kind: function
    summary: "The catch of createCommand: picks the message and severity from gitErrorCode (conflicts and stash conflicts warn, empty commit message informs, missing user config errors with Learn More, otherwise 'Git: <stderr line>') and shows it without awaiting."
    sources: ["extensions/git/src/commands.ts:5599-5686", "extensions/git/src/commands.ts:5688-5710"]
