        delivery: sync
  - component: git-repository
    name: on-did-run-git-status
    kind: event
    summary: "onDidRunGitStatus (the _onDidChangeStatus emitter): fired after every model state update; decorations, the status bar, the action button, blame and the timeline listen."
    sources: ["extensions/git/src/repository.ts:722-723"]
    request: {type: object, properties: {root: {type: string}, index: {type: array}, working_tree: {type: array}}}
  - component: git-repository
    name: get-status
    kind: function
    summary: "getStatus: run git status with git.statusLimit, warn once when the limit is hit, and sort entries into the index, working tree (untracked too when git.untrackedChanges is mixed), untracked and merge groups."
    sources: ["extensions/git/src/repository.ts:3110-3253"]
    response: GitResourceGroups
    behavior:
      - call: git-base-repository.get-status
        input: {root: "= state.root", limit: "= config['git-status-limit']", untracked_changes: "= config['git-untracked-changes']"}
        as: st
      - set: {state.is_huge: "= vars.st.value.did_hit_limit"}
      - if: "vars.st.value.did_hit_limit && !state.did_warn_about_limit"
        then:
          - title: Too many changes, only a subset of features is enabled
            source: "extensions/git/src/repository.ts:3165-3201"
            call: vscode-api.window-show-warning-message
            input: {message: "The git repository has too many active changes, only a subset of Git features will be enabled.", items: [OK, "Don't Show Again"]}
          - set: {state.did_warn_about_limit: true}
      - set:
          vars.s: "= vars.st.value.status"
          vars.conflicts: "= ['DD', 'AU', 'UD', 'UA', 'DU', 'AA', 'UU']"
          vars.mode: "= config['git-untracked-changes']"
      - title: Sort the entries into resource groups by their XY codes
        source: "extensions/git/src/repository.ts:3213-3250"
        set:
          vars.groups:
            merge: "= vars.s.filter(e, (e.x + e.y) in vars.conflicts).map(e, e.path)"
            index: "= vars.s.filter(e, !((e.x + e.y) in vars.conflicts) && e.x in ['M', 'A', 'D', 'R', 'C']).map(e, e.path)"
            working_tree: "= vars.s.filter(e, !((e.x + e.y) in vars.conflicts) && e.y in ['M', 'D', 'A', 'R', 'T']).map(e, e.path) + (vars.mode == 'mixed' ? vars.s.filter(e, e.x + e.y == '??').map(e, e.path) : [])"
            untracked: "= vars.mode == 'separate' ? vars.s.filter(e, e.x + e.y == '??').map(e, e.path) : []"
      - return: "= vars.groups"
  - component: git-repository
    name: get-resource-groups
    kind: function
    summary: "The indexGroup, workingTreeGroup, untrackedGroup and mergeGroup resource states, HEAD and the SCM input box value."
    sources: ["extensions/git/src/repository.ts:747-759"]
    response: GitResourceGroups
    behavior:
      - return: {root: "= state.root", index: "= state.index", working_tree: "= state.working_tree", untracked: "= state.untracked", merge: "= state.merge", head: "= state.head", input_box_value: "= state.input_box_value"}
  - component: git-repository
    name: on-file-change
    kind: event
    summary: "onFileChange: a working-tree or .git change schedules a status refresh, unless git.autorefresh is off, the repository is huge or a non-read-only operation is running."
    sources: ["extensions/git/src/repository.ts:3339-3359", "extensions/git/src/repository.ts:949-952"]
    request: {type: object, properties: {uri: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
