            - return: {ran: false, reason: waiting-for-focus}
      - call: git-repository.status
      - title: Hold the throttle for 5 seconds
        source: "extensions/git/src/repository.ts:3370"
        wait: 5000
      - set: {state.update_in_flight: false}
      - return: {ran: true}

  - component: git-decoration-provider
