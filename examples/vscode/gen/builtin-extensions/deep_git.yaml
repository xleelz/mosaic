    summary: "The runOperation closure of commit: 'git add' for opts.all, requireUserConfig from git.requireGitUserConfig, git commit, then commitOperationCleanup resets the input box."
    sources: ["extensions/git/src/repository.ts:1457-1480"]
    request: GitRepositoryCommitRequest
    behavior:
      - when: "string(input.all) != 'false'"
        title: opts.all stages first (git add -A, or -u for 'tracked')
        source: "extensions/git/src/repository.ts:1462-1466"
        call: git-base-repository.add
        input: {root: "= state.root", paths: [], update: "= string(input.all) == 'tracked'"}
      - call: git-base-repository.commit
        input: {root: "= state.root", message: "= input.message", all: false, amend: "= input.amend", use_editor: "= input.use_editor", empty: "= input.empty", require_user_config: "= config['git-require-git-user-config']"}
