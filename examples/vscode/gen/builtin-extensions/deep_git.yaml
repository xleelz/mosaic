        set: {state.index: "= input.optimistic.index", state.working_tree: "= input.optimistic.working_tree", state.untracked: "= input.optimistic.untracked", state.merge: "= input.optimistic.merge"}
      - call: git-base-repository.get-head-ref
        input: {root: "= state.root"}
        as: head
      - set: {state.head: "= vars.head.value"}
      - title: Status and refs run together (Promise.all)
