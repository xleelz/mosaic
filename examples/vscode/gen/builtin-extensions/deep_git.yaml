          - return: {type: error}
      - title: "Default: 'Git: <first stderr line>' as a modal error"
        source: "extensions/git/src/commands.ts:5656-5667"
        call: vscode-api.window-show-error-message
        input: {message: "= 'Git: ' + input.message", modal: true, items: [Open Git Log]}
      - return: {type: error}
  - component: git-command-center
    name: cmd-git-refresh
    kind: command
    summary: "git.refresh: Repository.refresh()."
    sources: ["extensions/git/package.json:140", "extensions/git/src/commands.ts:808-811"]
    request: BuiltinCommandRequest
    behavior:
      - call: git-repository.refresh
  - component: git-command-center
    name: cmd-git-stage
    kind: command
    summary: "git.stage: stage the selected resource states; resources with merge conflicts ask for confirmation first; staged per repository through Repository.add."
    sources: ["extensions/git/package.json:180", "extensions/git/src/commands.ts:1522-1581"]
    request: BuiltinCommandRequest
    behavior:
      - if: "size(input.args) == 0"
