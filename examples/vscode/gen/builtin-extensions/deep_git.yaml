  - component: git-repository
    name: run
    kind: function
    summary: "run: refuses unless the repository is idle; records the operation, runs it through retryRun (up to 11 attempts while the index is locked), refreshes the model state for non-read-only operations, and on NotAGitRepository marks the repository disposed."
    sources: ["extensions/git/src/repository.ts:2863-2903", "extensions/git/src/repository.ts:2987-3006"]
    request: GitRunRequest
    errors: [{code: repository-not-initialized, status: 0, retryable: false}]
    behavior:
      - if: "state.state != 'idle'"
        then:
          - title: Repository not initialized
            source: "extensions/git/src/repository.ts:2869-2871"
            fail: {code: repository-not-initialized, message: Repository not initialized}
      - set: {state.operations: "= state.operations + [input.operation]"}
      - if: "input.operation == 'Add' || input.operation == 'Commit'"
        then:
          - title: retryRun retries the git work while the repository is locked
            source: "extensions/git/src/repository.ts:2993-3001"
            call: "= input.operation == 'Add' ? 'git-base-repository.add' : 'git-repository.run-commit-operation'"
            targets: [git-base-repository.add, git-repository.run-commit-operation]
            input: "= input.operation == 'Add' ? {'root': state.root, 'paths': input.resources, 'update': input.update} : {'message': input.message, 'all': input.all, 'amend': input.amend, 'use_editor': input.use_editor, 'empty': input.empty}"
            retry: {max_attempts: 11, codes: [repository-is-locked], backoff_ms: 50, multiplier: 4, max_backoff_ms: 5000, title: "quadratic back-off while index.lock exists", source: "extensions/git/src/repository.ts:3000-3002"}
            as: work
            on_error:
              - if: "error.code == 'not-a-git-repository'"
                then:
                  - title: The folder is no longer a repository, dispose it
                    source: "extensions/git/src/repository.ts:2889-2891"
                    set: {state.state: disposed}
              - when: "state.state == 'idle'"
                title: Non-read-only operations refresh the model even on failure
                source: "extensions/git/src/repository.ts:2893-2895"
                call: git-repository.update-model-state
                input: {optimistic: {}}
              - set: {state.operations: "= state.operations.filter(o, o != input.operation)"}
              - fail: "= error"
      - if: "!(input.operation in ['Status', 'Refresh', 'Add', 'Commit'])"
        then:
          - title: The operation's git command, retried while the repository is locked
            source: "extensions/git/src/repository.ts:2880"
            call: git-base-repository.run-git
            input: {root: "= state.root", subcommand: "= input.subcommand"}
            retry: {max_attempts: 11, codes: [repository-is-locked], backoff_ms: 50, multiplier: 4, max_backoff_ms: 5000}
            on_error:
              - set: {state.operations: "= state.operations.filter(o, o != input.operation)"}
              - fail: "= error"
      - set:
          vars.optimistic: "= input.operation == 'Add' && config['git-optimistic-update'] ? {'index': state.index + input.resources.filter(r, !(r in state.index)), 'working_tree': state.working_tree.filter(r, !(r in input.resources)), 'untracked': state.untracked.filter(r, !(r in input.resources)), 'merge': state.merge.filter(r, !(r in input.resources))} : {}"
      - title: Refresh the model state (with optimistic groups when git.optimisticUpdate is on)
        source: "extensions/git/src/repository.ts:2881-2883"
        call: git-repository.update-model-state
        input: {optimistic: "= vars.optimistic"}
      - set: {state.operations: "= state.operations.filter(o, o != input.operation)"}
      - return: {operation: "= input.operation"}
  - component: git-repository
    name: update-model-state
    kind: function
    summary: "updateModelState: apply optimistic groups, read HEAD, then status and refs together; store the resource groups and fire onDidChangeStatus."
    sources: ["extensions/git/src/repository.ts:3028-3088"]
    request: {type: object, properties: {optimistic: {type: object}}}
    behavior:
      - when: "size(input.optimistic) > 0"
        title: Optimistic resource groups first
