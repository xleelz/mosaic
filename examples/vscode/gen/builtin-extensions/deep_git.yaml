  - component: git-repository
    name: update-when-idle-and-wait
    kind: function
    summary: "@throttle updateWhenIdleAndWait: wait until no operation runs and the window is focused, run status, then hold for 5 s so bursts coalesce."
    sources: ["extensions/git/src/repository.ts:3366-3388"]
    behavior:
      - if: "state.update_in_flight"
        then:
          - return: {ran: false, reason: throttled}
