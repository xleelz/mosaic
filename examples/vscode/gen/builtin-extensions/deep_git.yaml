components:
  - id: git-extension
    name: git extension main (activate, createModel)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "vscode.git's entry module: creates the output channel, finds git, builds the Model and the CommandCenter, and registers the git.api.* commands."
    sources: ["extensions/git/src/main.ts:192-264", "extensions/git/package.json:51-56"]
    attributes: {owner: builtin-extensions, extension: vscode.git}
    state:
      schema: {type: object, properties: {activated: {type: boolean}, model_ready: {type: boolean}, git_missing: {type: boolean}, waiting_for_enable: {type: boolean}, git_version: {type: string}}}
      initial: {activated: false, model_ready: false, git_missing: false, waiting_for_enable: false, git_version: ""}
  - id: git
    name: Git (git.ts)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "The Git class and findGit: spawns the git executable, logs each command, and turns a non-zero exit into a GitError whose gitErrorCode comes from stderr."
    sources: ["extensions/git/src/git.ts:395-430", "extensions/git/src/git.ts:337-375"]
    attributes: {owner: builtin-extensions}
  - id: git-base-repository
    name: Repository (git.ts, imported as BaseRepository)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Builds the git command lines for one repository (status, add, commit, refs) and runs them through Git.exec."
    sources: ["extensions/git/src/git.ts:1400-1440"]
    attributes: {owner: builtin-extensions}
  - id: git-model
    name: Model (model.ts)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Discovers and opens repositories for the workspace folders, tracks closed, parent and unsafe repositories, and resolves which repository a command targets."
    sources: ["extensions/git/src/model.ts:186-312"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {state: {type: string, enum: [uninitialized, initialized]}, repositories: {type: array, items: {type: string}}, closed: {type: array}, parent: {type: array}, unsafe: {type: array}}}
      initial: {state: uninitialized, repositories: [], closed: [], parent: [], unsafe: []}
  - id: git-repository
    name: Repository (repository.ts)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "One open git repository as SCM sees it: resource groups (index, working tree, untracked, merge), the running operations, file watching and the status refresh."
    sources: ["extensions/git/src/repository.ts:713-760", "extensions/git/src/repository.ts:915-952"]
    attributes: {owner: builtin-extensions}
    state:
      schema:
        type: object
        properties:
          root: {type: string}
          state: {type: string, enum: [idle, disposed]}
          index: {type: array, items: {type: string}}
          working_tree: {type: array, items: {type: string}}
          untracked: {type: array, items: {type: string}}
          merge: {type: array, items: {type: string}}
          head: {type: object}
          operations: {type: array, items: {type: string}}
          is_huge: {type: boolean}
          did_warn_about_limit: {type: boolean}
          input_box_value: {type: string}
          last_change_ms: {type: integer}
          update_in_flight: {type: boolean}
          waiting_for_focus: {type: boolean}
      initial: {root: "", state: idle, index: [], working_tree: [], untracked: [], merge: [], head: {}, operations: [], is_huge: false, did_warn_about_limit: false, input_box_value: "", last_change_ms: 0, update_in_flight: false, waiting_for_focus: false}
  - id: git-decoration-provider
    name: GitDecorationProvider (decorationProvider.ts)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "File decorations (M, A, U badges and colors) for each repository, rebuilt from the resource groups after every git status."
    sources: ["extensions/git/src/decorationProvider.ts:117-150"]
    attributes: {owner: builtin-extensions}
    state:
      schema: {type: object, properties: {decorations: {type: array, items: {type: string}}}}
      initial: {decorations: []}
  - id: git-command-center
    name: CommandCenter (commands.ts)
    kind: module
    layer: extensions
    parent: builtin-extensions
    summary: "Registers every @command-decorated git command through createCommand, which resolves the target repository, runs the method and turns any error into a notification."
    sources: ["extensions/git/src/commands.ts:785-801", "extensions/git/src/commands.ts:378-385"]
    attributes: {owner: builtin-extensions}

interfaces:
  # ---------------------------------------------------------------- git-extension
  - component: git-extension
    name: activate
    kind: function
    summary: "activate/_activate: read git.enabled; when enabled, createModel (findGit, Model, CommandCenter); when git is missing, set git.missing and warn; then register the git.api.* commands."
    sources: ["extensions/git/src/main.ts:258-264", "extensions/git/src/main.ts:192-251", "extensions/git/package.json:51-56"]
    request: {type: object, properties: {extension_id: {type: string, default: vscode.git}, activation_event: {type: string, default: "*"}}}
    response: {type: object, properties: {model_ready: {type: boolean}, enabled: {type: boolean}}}
    behavior:
      - title: Create the Git log output channel
        source: "extensions/git/src/main.ts:196"
        call: vscode-api.window-create-output-channel
        input: {name: Git, log: true}
      - set: {state.activated: true}
      - if: "!config['git-enabled']"
        then:
          - title: git.enabled is false, wait for it to be enabled
            detail: "_activate returns an empty GitExtensionImpl and builds the model only when the setting turns true."
            source: "extensions/git/src/main.ts:212-223"
            set: {state.waiting_for_enable: true}
          - return: {model_ready: false, enabled: false}
      - title: createModel finds git
        source: "extensions/git/src/main.ts:41-65"
        call: git.find-git
        as: found
        on_error:
          - title: Git installation not found
            detail: "_activate catches the error, sets the git.missing context key and warns about the missing git."
            source: "extensions/git/src/main.ts:229-247"
            set: {state.git_missing: true}
          - title: setContext git.missing (not awaited, so a rejection doesn't fail activation)
            source: "extensions/git/src/main.ts:244"
            call: vscode-api.commands-execute-command
            input: {command_id: setContext, args: [git.missing, true]}
            on_error: continue
          - call: git-extension.warn-about-missing-git
          - return: {model_ready: false, enabled: true}
      - set: {state.git_version: "= vars.found.value.version"}
      - call: vscode-api.workspace-workspace-folders
        as: folders
      - title: Build the Model, which runs the initial repository scan
        source: "extensions/git/src/main.ts:94"
        call: git-model.initialize
        input: {workspace_folders: "= vars.folders.value"}
      - title: The CommandCenter registers every git command
        source: "extensions/git/src/commands.ts:796-799"
        call: vscode-api.commands-register-command
        input: {command_id: git.commit}
      - title: registerAPICommands adds git.api.getRepositories, getRepositoryState and getRemoteSources
        source: "extensions/git/src/main.ts:262"
        call: vscode-api.commands-register-command
        input: {command_id: git.api.getRepositoryState}
      - set: {state.model_ready: true}
      - return: {model_ready: true, enabled: true}
  - component: git-extension
    name: warn-about-missing-git
    kind: function
    summary: "warnAboutMissingGit: unless git.ignoreMissingGitWarning is set, shows 'Git not found' with Download Git and Don't Show Again."
    sources: ["extensions/git/src/main.ts:159-190"]
    behavior:
      - if: "config['git-ignore-missing-git-warning']"
        then:
          - return: {warned: false}
      - title: Show the missing-git warning
        source: "extensions/git/src/main.ts:179-183"
        call: vscode-api.window-show-warning-message
        input: {message: "Git not found. Install it or configure it using the \"git.path\" setting.", items: [Download Git, "Don't Show Again"]}
      - return: {warned: true}
  - component: git-extension
    name: cmd-git-api-getrepositories
    kind: command
    summary: "git.api.getRepositories: the root URIs of the open repositories."
    sources: ["extensions/git/package.json:921", "extensions/git/src/api/api1.ts:587-590"]
    request: BuiltinCommandRequest
    response: {type: array, items: {type: string}}
    behavior:
      - call: git-model.get-repositories
        as: repos
      - return: "= vars.repos.value.map(r, 'file://' + r)"
  - component: git-extension
    name: cmd-git-api-getrepositorystate
    kind: command
    summary: "git.api.getRepositoryState: HEAD and the index, working tree and merge changes of the repository containing the URI, or null."
    sources: ["extensions/git/package.json:926", "extensions/git/src/api/api1.ts:592-620"]
    request: BuiltinCommandRequest
    response: GitRepositoryState
    behavior:
      - call: git-model.get-repository
        input: {uri: "= size(input.args) > 0 ? string(input.args[0]) : 'file:///work/app'"}
        as: repo
      - if: "vars.repo.value.root == ''"
        then:
          - title: No repository contains the URI
            source: "extensions/git/src/api/api1.ts:596-598"
            return: null
      - call: git-repository.get-resource-groups
        as: groups
      - return:
          HEAD: "= vars.groups.value.head"
          indexChanges: "= vars.groups.value.index"
          workingTreeChanges: "= vars.groups.value.working_tree + vars.groups.value.untracked"
          mergeChanges: "= vars.groups.value.merge"

  # ---------------------------------------------------------------- git (Git class)
  - component: git
    name: find-git
    kind: function
    summary: "findGit: tries the git.path hints, then the platform default ('git' on Linux); throws 'Git installation not found.' when none runs."
    sources: ["extensions/git/src/git.ts:167-189"]
    response: {type: object, properties: {path: {type: string}, version: {type: string}}}
    errors: [{code: git-installation-not-found, status: 0, retryable: false}]
    behavior:
      - call: git-binary.exec
        input: {args: ["--version"], cwd: "/work/app", input: ""}
        as: ver
        on_error:
          - title: No git executable found
            source: "extensions/git/src/git.ts:188"
            fail: {code: git-installation-not-found, message: Git installation not found.}
      - return: {path: git, version: "= vars.ver.value.stdout.replace('git version ', '')"}
  - component: git
    name: exec
    kind: function
    summary: "Git.exec/_exec: spawn git with the arguments; a non-zero exit becomes GitError('Failed to execute git') with gitErrorCode from getGitErrorCode(stderr)."
    sources: ["extensions/git/src/git.ts:603-606", "extensions/git/src/git.ts:626-680"]
    request: GitExecRequest
    response: GitExecResult
    errors:
      - {code: repository-is-locked, status: 0, retryable: false}
      - {code: not-a-git-repository, status: 0, retryable: false}
      - {code: failed-to-execute-git, status: 0, retryable: false}
    behavior:
      - call: git-binary.exec
        input: "= input"
        as: run
        on_error:
          - if: "error.message.contains('Another git process seems to be running in this repository')"
            then:
              - title: "stderr maps to GitErrorCodes.RepositoryIsLocked"
                source: "extensions/git/src/git.ts:338-339"
                fail: {code: repository-is-locked, message: Failed to execute git, data: {stderr: "= error.message", git_command: "= input.args[0]"}}
          - if: "error.message.lowerAscii().contains('not a git repository')"
            then:
              - title: "stderr maps to GitErrorCodes.NotAGitRepository"
                source: "extensions/git/src/git.ts:342-343"
                fail: {code: not-a-git-repository, message: Failed to execute git, data: {stderr: "= error.message", git_command: "= input.args[0]"}}
          - title: GitError without a known code
            source: "extensions/git/src/git.ts:668-677"
            fail: {code: failed-to-execute-git, message: "= error.message", data: {stderr: "= error.message", git_command: "= input.args[0]"}}
      - return: "= vars.run.value"
  - component: git
    name: get-repository-root
    kind: function
    summary: "Git.getRepositoryRoot: 'git rev-parse --show-toplevel' in the folder."
    sources: ["extensions/git/src/git.ts:512-514"]
    request: {type: object, properties: {path: {type: string, examples: ["/work/app"]}}}
    response: {type: object, properties: {root: {type: string}}}
    behavior:
      - call: git.exec
        input: {args: [rev-parse, --show-toplevel], cwd: "= input.path", input: ""}
        as: rp
      - return: {root: "= vars.rp.value.stdout"}

  # ---------------------------------------------------------------- git-base-repository
  - component: git-base-repository
    name: get-status
    kind: function
    summary: "getStatus: 'git status -z -uall' (or -uno when untracked changes are hidden), parsed into entries; stops at the limit and reports didHitLimit."
    sources: ["extensions/git/src/git.ts:2830-2925"]
    request: {type: object, properties: {root: {type: string, default: "/work/app"}, limit: {type: integer, default: 10000}, untracked_changes: {type: string, default: mixed}}}
    response: {type: object, properties: {status: {type: array}, status_length: {type: integer}, did_hit_limit: {type: boolean}}}
    behavior:
      - call: git.exec
        input: {args: "= ['status', '-z', input.untracked_changes == 'hidden' ? '-uno' : '-uall']", cwd: "= input.root", input: ""}
        as: st
      - set:
          vars.entries: "= vars.st.value.staged.map(p, {'path': p, 'x': 'M', 'y': p in vars.st.value.modified ? 'M' : ' '}) + vars.st.value.modified.filter(p, !(p in vars.st.value.staged)).map(p, {'path': p, 'x': ' ', 'y': 'M'}) + (input.untracked_changes == 'hidden' ? [] : vars.st.value.untracked.map(p, {'path': p, 'x': '?', 'y': '?'})) + vars.st.value.conflicted.map(p, {'path': p, 'x': 'U', 'y': 'U'})"
      - if: "input.limit != 0 && size(vars.entries) > input.limit"
        then:
          - title: Status hit the limit, the child process is killed
            source: "extensions/git/src/git.ts:2881-2888"
            return: {status: "= vars.entries.slice(0, input.limit)", status_length: "= size(vars.entries)", did_hit_limit: true}
      - return: {status: "= vars.entries", status_length: "= size(vars.entries)", did_hit_limit: false}
  - component: git-base-repository
    name: add
    kind: function
    summary: "add: 'git add -A -- <paths>' ('-u' with update, '.' when no paths)."
    sources: ["extensions/git/src/git.ts:2011-2027"]
    request: {type: object, properties: {root: {type: string, default: "/work/app"}, paths: {type: array, items: {type: string}}, update: {type: boolean, default: false}}}
    behavior:
      - call: git.exec
        input: {args: "= ['add', input.update ? '-u' : '-A', '--'] + (size(input.paths) > 0 ? input.paths : ['.'])", cwd: "= input.root", input: ""}
      - return: {added: "= input.paths"}
  - component: git-base-repository
    name: commit
    kind: function
    summary: "commit: builds 'git commit --quiet' (message on stdin, --all, --amend, --allow-empty, -c user.useConfigOnly=true); on failure handleCommitError classifies unmerged files, empty message and missing user.name/user.email."
    sources: ["extensions/git/src/git.ts:2118-2186", "extensions/git/src/git.ts:2199-2224"]
    request: GitCommitRequest
    errors:
      - {code: unmerged-changes, status: 0, retryable: false}
      - {code: empty-commit-message, status: 0, retryable: false}
      - {code: no-user-name-configured, status: 0, retryable: false}
      - {code: no-user-email-configured, status: 0, retryable: false}
    behavior:
      - set:
          vars.args: "= ['commit', '--quiet'] + (input.message != '' ? ['--allow-empty-message', '--file', '-'] : []) + (input.all ? ['--all'] : []) + (input.amend ? ['--amend'] : []) + (!input.use_editor ? ((input.message == '' ? (input.amend ? ['--no-edit'] : ['--file', '-']) : []) + ['--allow-empty-message']) : []) + (input.empty ? ['--allow-empty'] : [])"
      - set:
          vars.args: "= input.require_user_config ? ['-c', 'user.useConfigOnly=true'] + vars.args : vars.args"
      - call: git.exec
        input: {args: "= vars.args", cwd: "= input.root", input: "= input.message"}
        as: commit
        on_error:
          - if: "error.message.contains('not possible because you have unmerged files')"
            then:
              - fail: {code: unmerged-changes, message: "= error.message"}
          - if: "error.message.contains('Aborting commit due to empty commit message')"
            then:
              - title: Empty commit message
                source: "extensions/git/src/git.ts:2203-2205"
                fail: {code: empty-commit-message, message: "= error.message"}
          - title: handleCommitError checks user.name
            source: "extensions/git/src/git.ts:2208-2213"
            call: git.exec
            input: {args: [config, --get-all, user.name], cwd: "= input.root", input: ""}
            on_error:
              - fail: {code: no-user-name-configured, message: Failed to execute git}
          - title: handleCommitError checks user.email
            source: "extensions/git/src/git.ts:2215-2220"
            call: git.exec
            input: {args: [config, --get-all, user.email], cwd: "= input.root", input: ""}
            on_error:
              - fail: {code: no-user-email-configured, message: Failed to execute git}
          - title: Neither cause applies, rethrow the commit error
            source: "extensions/git/src/git.ts:2223"
            fail: {code: failed-to-execute-git, message: "= error.message"}
      - return: {committed: true}
  - component: git-base-repository
    name: get-head-ref
    kind: function
    summary: "getHEADRef: the current branch (and its upstream); errors are swallowed and HEAD stays undefined."
    sources: ["extensions/git/src/git.ts:2929-2961"]
    request: {type: object, properties: {root: {type: string, default: "/work/app"}}}
    behavior:
      - call: git.exec
        input: {args: [symbolic-ref, --short, HEAD], cwd: "= input.root", input: ""}
        as: head
        on_error: continue
      - if: "!vars.head.ok"
        then:
          - return: {}
      - return: {name: "= vars.head.value.branch", commit: "= vars.head.value.commit", type: head}
  - component: git-base-repository
    name: get-refs
    kind: function
    summary: "getRefs: 'git for-each-ref' over branches, remotes and tags."
    sources: ["extensions/git/src/git.ts:3033-3060"]
    request: {type: object, properties: {root: {type: string, default: "/work/app"}}}
    behavior:
      - call: git.exec
        input: {args: [for-each-ref, "--format=%(refname)%00%(objectname)"], cwd: "= input.root", input: ""}
        as: refs
      - return: "= [{'name': vars.refs.value.branch, 'commit': vars.refs.value.commit}]"

  - component: git-base-repository
    name: run-git
    kind: function
    summary: "Repository.exec and the many one-command methods (fetch, pull, push, checkout, branch, stash, tag, worktree ...): run one git subcommand in the repository."
    sources: ["extensions/git/src/git.ts:1434-1436"]
    request: {type: object, properties: {root: {type: string, default: "/work/app"}, subcommand: {type: string, examples: [fetch]}}}
    behavior:
      - call: git.exec
        input: {args: "= [input.subcommand]", cwd: "= input.root", input: ""}
        as: out
      - return: "= vars.out.value"

  # ---------------------------------------------------------------- git-model
  - component: git-model
    name: initialize
    kind: function
    summary: "Model constructor and doInitialScan: watch the workspace for new .git folders, then open a repository for every workspace folder (and scanned subfolder) and mark the model initialized."
    sources: ["extensions/git/src/model.ts:289-312", "extensions/git/src/model.ts:314-358"]
    request: {type: object, properties: {workspace_folders: {type: array, items: {type: string}, examples: [["file:///work/app"]]}}}
    behavior:
      - title: Watch the whole workspace for new git repositories
        source: "extensions/git/src/model.ts:301-307"
        call: vscode-api.workspace-create-file-system-watcher
        input: {glob_pattern: "**"}
      - set: {state.state: uninitialized}
      - title: "Initial scan: open every added workspace folder (onDidChangeWorkspaceFolders)"
        source: "extensions/git/src/model.ts:324-328"
        foreach: "= input.workspace_folders"
        as: folder
        steps:
          - call: git-model.open-repository
            input: {repo_path: "= vars.folder.replace('file://', '')"}
      - if: "config['git-auto-repository-detection'] == true || config['git-auto-repository-detection'] == 'subFolders'"
        then:
          - title: scanWorkspaceFolders also opens repositories in subfolders up to git.repositoryScanMaxDepth
            detail: "The fixture's folders have no nested repositories, so the scan finds nothing new."
            source: "extensions/git/src/model.ts:361-402"
      - set: {state.state: initialized}
      - if: "size(state.parent) > 0 && config['git-open-repository-in-parent-folders'] == 'prompt'"
        then:
          - title: Offer to open the repositories found in parent folders
            source: "extensions/git/src/model.ts:337-340"
            call: vscode-api.window-show-information-message
            input: {message: "A git repository was found in the parent folders of the workspace or the open file(s). Would you like to open the repository?", items: ["Yes", Always, Never]}
      - return: {repositories: "= state.repositories"}
  - component: git-model
    name: open-repository
    kind: function
    summary: "openRepository (sequentialized): skips existing, disabled, parent-folder, unsafe, closed and untrusted repositories; otherwise creates the Repository, opens it and queues its first status (not awaited, at most 5 at once)."
    sources: ["extensions/git/src/model.ts:599-705"]
    request: {type: object, properties: {repo_path: {type: string, examples: ["/work/app"]}}}
    behavior:
      - if: "input.repo_path in state.repositories"
        then:
          - return: {opened: false, reason: exists}
      - if: "!config['git-enabled']"
        then:
          - title: Git is not enabled for this folder
            source: "extensions/git/src/model.ts:608-614"
            return: {opened: false, reason: disabled}
      - title: getRepositoryRoot runs rev-parse
        source: "extensions/git/src/model.ts:617"
        call: git.get-repository-root
        input: {path: "= input.repo_path"}
        as: root
        on_error:
          - title: Not a repository, the error is swallowed
            source: "extensions/git/src/model.ts:701-704"
            return: {opened: false, reason: "= error.code"}
      - if: "vars.root.value.root in state.repositories"
        then:
          - return: {opened: false, reason: exists}
      - if: "config['git-open-repository-in-parent-folders'] != 'always' && !vars.root.value.root.startsWith(input.repo_path)"
        then:
          - title: Repository in a parent folder is remembered, not opened
            source: "extensions/git/src/model.ts:631-648"
            set: {state.parent: "= state.parent + [vars.root.value.root]"}
          - return: {opened: false, reason: parent}
      - if: "vars.root.value.root in state.closed"
        then:
          - title: The user closed this repository
            source: "extensions/git/src/model.ts:665-669"
            return: {opened: false, reason: closed}
      - title: Ask for trust in the folder that holds .git
        source: "extensions/git/src/model.ts:675-684"
        call: vscode-api.workspace-request-resource-trust
        input: {uri: "= 'file://' + vars.root.value.root", message: "You are opening a repository from a location that is not trusted. Do you trust the authors of the files in the repository you are opening?"}
        as: trust
      - if: "!vars.trust.value.trusted"
        then:
          - return: {opened: false, reason: untrusted}
      - title: Create and open the Repository
        source: "extensions/git/src/model.ts:687-691"
        call: git-repository.open
        input: {root: "= vars.root.value.root"}
      - set: {state.repositories: "= state.repositories + [vars.root.value.root]"}
      - title: "Queue the first status; not awaited (Limiter of 5)"
        source: "extensions/git/src/model.ts:697-700"
        emit: git-repository.status
        input: {}
      - return: {opened: true, root: "= vars.root.value.root"}
  - component: git-model
    name: get-repository
    kind: function
    summary: "getRepository: the open repository that contains the hint (URI, path or resource), or undefined."
    sources: ["extensions/git/src/model.ts:929-932"]
    request: {type: object, properties: {uri: {type: string, examples: ["file:///work/app"]}}}
    response: {type: object, properties: {root: {type: string}}}
    behavior:
      - set: {vars.path: "= input.uri.replace('file://', '')"}
      - set: {vars.hits: "= state.repositories.filter(r, vars.path == r || vars.path.startsWith(r + '/'))"}
