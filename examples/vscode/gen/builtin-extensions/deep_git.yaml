        as_result: both
      - set:
          state.index: "= vars.both.results[0].value.index"
          state.working_tree: "= vars.both.results[0].value.working_tree"
          state.untracked: "= vars.both.results[0].value.untracked"
          state.merge: "= vars.both.results[0].value.merge"
