schemas:
  - id: BuiltinCommandRequest
    summary: "A command invocation reaching a built-in extension's registered callback."
    schema:
      type: object
      required: [command_id]
      properties:
        command_id: {type: string, examples: [git.refresh]}
        args: {type: array, default: []}
  - id: GitExecRequest
    schema:
      type: object
      required: [args, cwd]
      properties:
        args: {type: array, items: {type: string}, examples: [[status, -z, -uall]]}
        cwd: {type: string, default: "/work/app"}
        input: {type: string, default: ""}
  - id: GitExecResult
    schema:
      type: object
      properties:
        exit_code: {type: integer, default: 0}
        stdout: {type: string}
  - id: GitCommitRequest
    schema:
      type: object
      properties:
        root: {type: string, default: "/work/app"}
        message: {type: string, default: "Update main.ts"}
        all: {type: boolean, default: false}
        amend: {type: boolean, default: false}
        use_editor: {type: boolean, default: false}
        empty: {type: boolean, default: false}
        require_user_config: {type: boolean, default: true}
  - id: GitRepositoryCommitRequest
    schema:
      type: object
      properties:
        message: {type: string, default: ""}
        all: {}
        amend: {type: boolean, default: false}
        use_editor: {type: boolean, default: false}
        empty: {type: boolean, default: false}
  - id: GitRunRequest
    schema:
      type: object
      required: [operation]
      properties:
        operation: {type: string, examples: [Status]}
        read_only: {type: boolean, default: false}
        resources: {type: array, items: {type: string}}
        update: {type: boolean}
        message: {type: string}
        all: {}
        amend: {type: boolean}
        use_editor: {type: boolean}
        empty: {type: boolean}
        subcommand: {type: string}
  - id: GitResourceGroups
    schema:
      type: object
      properties:
        root: {type: string}
        index: {type: array, items: {type: string}}
        working_tree: {type: array, items: {type: string}}
        untracked: {type: array, items: {type: string}}
        merge: {type: array, items: {type: string}}
        head: {type: object}
        input_box_value: {type: string}
  - id: GitRepositoryState
    schema:
      type: [object, "null"]
      properties:
        HEAD: {type: object}
        indexChanges: {type: array}
        workingTreeChanges: {type: array}
        mergeChanges: {type: array}
  - id: TsExecuteRequest
    schema:
      type: object
      required: [command]
      properties:
        command: {type: string, examples: [quickinfo]}
        args: {type: object}
        token: {type: object, properties: {canceled: {type: boolean, default: false}}}
  - id: TsServerResponse
    schema:
      type: object
      properties:
        type: {type: string, enum: [response, noServer, cancelled]}
        success: {type: boolean}
        body: {type: object}

configs:
  - {id: git-enabled, type: boolean, value: true, default: true, summary: "git.enabled. Extension settings come from contributes.configuration; product.json does not override them.", sources: ["extensions/git/package.json:3289", "extensions/git/src/main.ts:209-210"], attributes: {key: git.enabled}}
  - {id: git-autorefresh, type: boolean, value: true, default: true, summary: git.autorefresh, sources: ["extensions/git/package.json:3328", "extensions/git/src/repository.ts:3341"], attributes: {key: git.autorefresh}}
  - {id: git-status-limit, type: integer, value: 10000, default: 10000, summary: "git.statusLimit (entries)", sources: ["extensions/git/package.json:4019", "extensions/git/src/repository.ts:3120"], attributes: {key: git.statusLimit}}
  - {id: git-untracked-changes, type: string, value: mixed, default: mixed, summary: git.untrackedChanges, sources: ["extensions/git/package.json:3925", "extensions/git/src/repository.ts:3117"], attributes: {key: git.untrackedChanges}}
  - {id: git-enable-smart-commit, type: boolean, value: false, default: false, summary: git.enableSmartCommit, sources: ["extensions/git/package.json:3543", "extensions/git/src/commands.ts:2387"], attributes: {key: git.enableSmartCommit}}
  - {id: git-suggest-smart-commit, type: boolean, value: true, default: true, summary: git.suggestSmartCommit, sources: ["extensions/git/package.json:3563", "extensions/git/src/commands.ts:2428"], attributes: {key: git.suggestSmartCommit}}
  - {id: git-smart-commit-changes, type: string, value: all, default: all, summary: git.smartCommitChanges, sources: ["extensions/git/package.json:3557", "extensions/git/src/commands.ts:2477"], attributes: {key: git.smartCommitChanges}}
  - {id: git-use-editor-as-commit-input, type: boolean, value: true, default: true, summary: "git.useEditorAsCommitInput: with an empty input box the commit opens the git editor instead of an input box", sources: ["extensions/git/package.json:3531", "extensions/git/src/commands.ts:2468"], attributes: {key: git.useEditorAsCommitInput}}
  - {id: git-require-git-user-config, type: boolean, value: true, default: true, summary: "git.requireGitUserConfig (adds -c user.useConfigOnly=true)", sources: ["extensions/git/package.json:3932", "extensions/git/src/repository.ts:1472-1475"], attributes: {key: git.requireGitUserConfig}}
  - {id: git-optimistic-update, type: boolean, value: true, default: true, summary: git.optimisticUpdate, sources: ["extensions/git/package.json:4055", "extensions/git/src/repository.ts:3483-3486"], attributes: {key: git.optimisticUpdate}}
  - {id: git-auto-repository-detection, type: boolean, value: true, default: true, summary: "git.autoRepositoryDetection (true, false, subFolders or openEditors)", sources: ["extensions/git/package.json:3323", "extensions/git/src/model.ts:318"], attributes: {key: git.autoRepositoryDetection}}
  - {id: git-open-repository-in-parent-folders, type: string, value: prompt, default: prompt, summary: git.openRepositoryInParentFolders, sources: ["extensions/git/package.json:4074", "extensions/git/src/model.ts:632"], attributes: {key: git.openRepositoryInParentFolders}}
  - {id: git-ignore-missing-git-warning, type: boolean, value: false, default: false, summary: git.ignoreMissingGitWarning, sources: ["extensions/git/package.json:3502", "extensions/git/src/main.ts:160-161"], attributes: {key: git.ignoreMissingGitWarning}}
  - {id: git-allow-no-verify-commit, type: boolean, value: false, default: false, summary: git.allowNoVerifyCommit, sources: ["extensions/git/package.json:3878", "extensions/git/src/commands.ts:2508"], attributes: {key: git.allowNoVerifyCommit}}
  - {id: js-ts-experimental-use-tsgo, type: boolean, value: false, default: false, summary: "js/ts.experimental.useTsgo (falls back to typescript.experimental.useTsgo)", sources: ["extensions/typescript-language-features/package.json:169-171", "extensions/typescript-language-features/src/extension.ts:62-64"], attributes: {key: js/ts.experimental.useTsgo}}
  - {id: js-ts-tsserver-use-syntax-server, type: string, value: auto, default: auto, summary: "js/ts.tsserver.useSyntaxServer (falls back to typescript.tsserver.useSyntaxServer)", sources: ["extensions/typescript-language-features/package.json:2504-2508", "extensions/typescript-language-features/src/configuration/configuration.ts:243-250"], attributes: {key: js/ts.tsserver.useSyntaxServer}}
  - {id: js-ts-tsserver-log, type: string, value: "off", default: "off", summary: "js/ts.tsserver.log (falls back to typescript.tsserver.log)", sources: ["extensions/typescript-language-features/package.json:2783", "extensions/typescript-language-features/src/typescriptServiceClient.ts:552"], attributes: {key: js/ts.tsserver.log}}
  - {id: url-protocol, type: string, value: code-oss, summary: "product.json urlProtocol, seen by extensions as vscode.env.uriScheme. The OSS build deploys code-oss; Stable ships vscode.", sources: ["product.json:37", "extensions/typescript-language-features/src/typescriptServiceClient.ts:707"], attributes: {boundary: true, owner: platform-core, key: urlProtocol}}

flows:
  - id: git-activate
    name: git extension activation
    tags: [writes]
    sources: ["extensions/git/src/main.ts:258-264", "extensions/git/package.json:51-56"]
    entry: {caller: exthost-runtime, interface: git-extension.activate, input: {extension_id: vscode.git, activation_event: "*"}}
  - id: git-command
    name: A git command through createCommand
    tags: [writes]
    sources: ["extensions/git/src/commands.ts:5527-5552"]
    entry: {caller: user, interface: git-command-center.run-command, input: {command_id: git.refresh, args: []}}
  - id: git-file-change-refresh
    name: A file change refreshes git status
    tags: [writes]
    sources: ["extensions/git/src/repository.ts:3339-3371"]
    entry: {caller: exthost-runtime, interface: git-repository.on-file-change, input: {uri: "file:///work/app/src/main.ts"}}
  - id: git-api-repository-state
