components:
  - id: vscode-api
    name: vscode API (extension host)
    kind: module
    layer: extensions
    parent: exthost-runtime
    summary: "The vscode.* API implementation in the extension host; owned by exthost, stubbed here."
    sources: ["src/vscode-dts/vscode.d.ts"]
    attributes: {boundary: true, owner: exthost}

interfaces:
  # ---------------------------------------------------------------- git-binary (external, owned here)
  - component: git-binary
    name: exec
    kind: process
    summary: "One run of the git executable: argv, working directory and stdin. Models the repository at state.root: HEAD, staged, modified, untracked and conflicted paths, user config and an index.lock that fails the next N writes."
    sources: ["extensions/git/src/git.ts:684-700"]
    request: GitExecRequest
    response: GitExecResult
    errors: [{code: nonzero-exit, status: 0, retryable: false}, {code: enoent, status: 0, retryable: false}]
    latency_ms: {min: 5, max: 30}
    behavior:
      - set:
          vars.seed_root: "= has(state.repositories) && size(state.repositories) > 0 ? state.repositories.map(k, k)[0] : '/work/app'"
      - set:
          vars.seed: "= has(state.repositories) && vars.seed_root in state.repositories ? state.repositories[vars.seed_root] : {}"
      - title: The repository base-workspace seeds (git-binary.repositories), flattened; fields a scenario sets win
        set:
          state.installed: "= has(state.installed) ? state.installed : true"
          state.version: "= has(state.version) ? state.version : '2.47.1'"
          state.root: "= has(state.root) ? state.root : vars.seed_root"
          state.branch: "= has(state.branch) ? state.branch : (has(vars.seed.head) ? vars.seed.head : 'main')"
          state.head_commit: "= has(state.head_commit) ? state.head_commit : 'c1'"
          state.commits: "= has(state.commits) ? state.commits : 1"
          state.staged: "= has(state.staged) ? state.staged : (has(vars.seed.staged) ? vars.seed.staged : [])"
          state.modified: "= has(state.modified) ? state.modified : (has(vars.seed.changes) ? vars.seed.changes : [])"
          state.untracked: "= has(state.untracked) ? state.untracked : []"
          state.conflicted: "= has(state.conflicted) ? state.conflicted : []"
          state.user_name: "= has(state.user_name) ? state.user_name : (has(vars.seed.user) ? vars.seed.user.name : 'dev')"
          state.user_email: "= has(state.user_email) ? state.user_email : (has(vars.seed.user) ? vars.seed.user.email : 'dev@example.com')"
          state.locked_attempts: "= has(state.locked_attempts) ? state.locked_attempts : 0"
          state.editor_message: "= has(state.editor_message) ? state.editor_message : 'Edited in COMMIT_EDITMSG'"
          state.last_message: "= has(state.last_message) ? state.last_message : ''"
      - set: {vars.cmd: "= input.args[0] == '-c' ? input.args[2] : input.args[0]"}
      - if: "vars.cmd == '--version'"
        then:
          - if: "!state.installed"
            then:
              - fail: {code: enoent, message: spawn git ENOENT}
          - return: {exit_code: 0, stdout: "= 'git version ' + state.version"}
      - if: "!(input.cwd == state.root || input.cwd.startsWith(state.root + '/'))"
        then:
          - fail: {code: nonzero-exit, message: "fatal: not a git repository (or any of the parent directories): .git", data: {exit_code: 128}}
      - if: "vars.cmd in ['add', 'commit'] && state.locked_attempts > 0"
        then:
          - set: {state.locked_attempts: "= state.locked_attempts - 1"}
          - fail: {code: nonzero-exit, message: "fatal: Unable to create '/work/app/.git/index.lock': File exists.\n\nAnother git process seems to be running in this repository", data: {exit_code: 128}}
      - if: "vars.cmd == 'rev-parse'"
        then:
          - return: {exit_code: 0, stdout: "= state.root"}
      - if: "vars.cmd == 'status'"
        then:
          - return: {exit_code: 0, stdout: "", staged: "= state.staged", modified: "= state.modified", untracked: "= state.untracked", conflicted: "= state.conflicted"}
      - if: "vars.cmd == 'symbolic-ref' && state.branch == ''"
        then:
          - fail: {code: nonzero-exit, message: "fatal: ref HEAD is not a symbolic ref", data: {exit_code: 128}}
      - if: "vars.cmd == 'symbolic-ref' || vars.cmd == 'for-each-ref'"
        then:
          - return: {exit_code: 0, stdout: "= state.branch", branch: "= state.branch", commit: "= state.head_commit"}
      - if: "vars.cmd == 'add'"
        then:
          - set:
              vars.paths: "= input.args.slice(3, size(input.args))"
              vars.cands: "= input.args[1] == '-u' ? state.modified + state.conflicted : state.modified + state.untracked + state.conflicted"
          - set: {vars.sel: "= vars.paths == ['.'] ? vars.cands : vars.cands.filter(p, p in vars.paths)"}
          - set:
              state.staged: "= state.staged + vars.sel.filter(p, !(p in state.staged))"
              state.modified: "= state.modified.filter(p, !(p in vars.sel))"
              state.untracked: "= state.untracked.filter(p, !(p in vars.sel))"
              state.conflicted: "= state.conflicted.filter(p, !(p in vars.sel))"
          - return: {exit_code: 0, stdout: ""}
      - if: "vars.cmd == 'commit'"
        then:
          - if: "'user.useConfigOnly=true' in input.args && (state.user_name == '' || state.user_email == '')"
            then:
              - fail: {code: nonzero-exit, message: "Author identity unknown\n\n*** Please tell me who you are.", data: {exit_code: 128}}
          - if: "size(state.conflicted) > 0"
            then:
              - fail: {code: nonzero-exit, message: "error: Committing is not possible because you have unmerged files.", data: {exit_code: 128}}
          - set: {vars.to_commit: "= state.staged + ('--all' in input.args ? state.modified : [])"}
          - if: "size(vars.to_commit) == 0 && !('--allow-empty' in input.args) && !('--amend' in input.args)"
            then:
              - fail: {code: nonzero-exit, message: "nothing to commit, working tree clean", data: {exit_code: 1}}
          - set: {vars.message: "= '--file' in input.args ? input.input : state.editor_message"}
          - if: "vars.message == '' && !('--allow-empty-message' in input.args)"
            then:
              - fail: {code: nonzero-exit, message: "Aborting commit due to empty commit message.", data: {exit_code: 1}}
          - set:
              state.commits: "= state.commits + 1"
              state.head_commit: "= 'c' + string(state.commits + 1)"
              state.staged: []
              state.modified: "= '--all' in input.args ? [] : state.modified"
              state.last_message: "= vars.message"
          - return: {exit_code: 0, stdout: ""}
      - if: "vars.cmd == 'config'"
        then:
          - set: {vars.value: "= input.args[2] == 'user.name' ? state.user_name : state.user_email"}
          - if: "vars.value == ''"
            then:
              - fail: {code: nonzero-exit, message: "", data: {exit_code: 1}}
          - return: {exit_code: 0, stdout: "= vars.value"}
      - return: {exit_code: 0, stdout: ""}

  # ---------------------------------------------------------------- language-server (external, owned here)
  - component: language-server
    name: start
    kind: process
    summary: "Spawn a language server process: tsserver (syntax, semantic or main) or the Markdown language server worker over IPC."
    sources: ["extensions/typescript-language-features/src/tsServer/spawner.ts:130-161"]
    request: {type: object, properties: {server: {type: string, enum: [tsserver, markdown]}, kind: {type: string}}}
    latency_ms: {min: 50, max: 200}
    behavior:
      - set: {state.processes: "= has(state.processes) ? state.processes : []", state.spawns: "= has(state.spawns) ? state.spawns : 0", state.requests: "= has(state.requests) ? state.requests : []"}
      - set: {state.processes: "= state.processes + [input.server + ':' + input.kind]", state.spawns: "= state.spawns + 1"}
      - return: {pid: "= state.spawns"}
  - component: language-server
    name: request
    kind: rpc
    summary: "A request to a running server (tsserver protocol over stdio); refused when the server has no process."
    sources: ["extensions/typescript-language-features/src/tsServer/server.ts:228-240"]
    request: {type: object, properties: {server: {type: string, default: tsserver}, command: {type: string, examples: [quickinfo]}, args: {type: object}}}
    response: {type: object, properties: {body: {type: object}}}
    latency_ms: {min: 2, max: 40}
    errors: [{code: server-not-running, status: 0, retryable: false}]
    behavior:
      - set: {state.processes: "= has(state.processes) ? state.processes : []", state.requests: "= has(state.requests) ? state.requests : []"}
      - if: "!state.processes.exists(p, p.startsWith(input.server + ':'))"
        then:
          - fail: {code: server-not-running, message: no server process}
      - set: {state.requests: "= state.requests + [input.command]"}
      - return: {body: {}}
  - component: language-server
    name: kill
    kind: process
    summary: "Kill the server's processes."
    sources: ["extensions/typescript-language-features/src/tsServer/server.ts:143-146"]
    request: {type: object, properties: {server: {type: string, default: tsserver}}}
    behavior:
      - set: {state.processes: "= (has(state.processes) ? state.processes : []).filter(p, !p.startsWith(input.server + ':'))"}

