x-open: &open
  "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
  "git-repository@eh1": {root: "/work/app"}
x-open-mod: &openmod
  "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
  "git-repository@eh1": {root: "/work/app", working_tree: ["src/main.ts"]}
  git-binary: {modified: ["src/main.ts"]}
x-open-staged: &openstaged
  "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
  "git-repository@eh1": {root: "/work/app", index: ["src/main.ts"], input_box_value: "Fix add"}
  git-binary: {staged: ["src/main.ts"]}

scenarios:
  # ------------------------------------------------------------ git activation
  - id: builtin-extensions-git-activate-opens-repository
    flow: git-activate
    fixtures: [one-window-folder]
    expect:
      - "result.ok && result.value.model_ready"
      - "state['git-model@eh1'].state == 'initialized' && state['git-model@eh1'].repositories == ['/work/app']"
      - "state['git-repository@eh1'].root == '/work/app'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.status')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'vscode-api.scm-create-source-control')"
  - id: builtin-extensions-git-activate-then-get-repositories
    fixtures: [one-window-folder]
    steps:
      - {flow: git-activate, as: act}
      - {flow: git-commands, as: read, input: {command_id: git.api.getRepositories, args: []}}
    expect:
      - "steps.act.result.ok"
      - "steps.read.result.ok && steps.read.result.value == ['file:///work/app']"
      - "state['git-extension@eh1'].model_ready"
  - id: builtin-extensions-git-activate-disabled
    flow: git-activate
    fixtures: [one-window-folder]
    config: {git-enabled: false}
    expect:
      - "result.ok && !result.value.model_ready"
      - "state['git-extension@eh1'].waiting_for_enable && calls['git.find-git'] == 0"
  - id: builtin-extensions-git-activate-git-missing
    flow: git-activate
    fixtures: [one-window-folder]
    state: {git-binary: {installed: false}}
    expect:
      - "result.ok && !result.value.model_ready"
      - "state['git-extension@eh1'].git_missing && calls['git-model.initialize'] == 0"
      - "calls['vscode-api.window-show-warning-message'] == 1"
  - id: builtin-extensions-git-activate-git-missing-warning-ignored
    flow: git-activate
    fixtures: [one-window-folder]
    config: {git-ignore-missing-git-warning: true}
    state: {git-binary: {installed: false}}
    expect:
      - "result.ok && state['git-extension@eh1'].git_missing"
      - "calls['vscode-api.window-show-warning-message'] == 0"
  - id: builtin-extensions-git-activate-parent-repository
    flow: git-activate
    fixtures: [one-window-folder]
    state: {git-binary: {root: "/work"}}
    expect:
      - "result.ok"
      - "state['git-model@eh1'].repositories == [] && state['git-model@eh1'].parent == ['/work']"
      - "calls['vscode-api.window-show-information-message'] == 1"
  - id: builtin-extensions-git-activate-not-a-repository
    flow: git-activate
    fixtures: [one-window-folder]
    state: {git-binary: {root: "/elsewhere"}}
    expect:
      - "result.ok && state['git-model@eh1'].repositories == []"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'git.exec' && e.error != null && e.error.code == 'not-a-git-repository')"
  - id: builtin-extensions-git-activate-closed-repository
    flow: git-activate
    fixtures: [one-window-folder]
    state: {"git-model@eh1": {closed: ["/work/app"]}}
    expect:
      - "result.ok && state['git-model@eh1'].repositories == []"
      - "calls['git-repository.open'] == 0"
  - id: builtin-extensions-git-activate-already-open
    flow: git-activate
    fixtures: [one-window-folder]
    state: *open
    expect:
      - "result.ok && state['git-model@eh1'].repositories == ['/work/app']"
      - "calls['git-repository.open'] == 0"

  # ------------------------------------------------------------ git status refresh
  - id: builtin-extensions-git-file-change-refreshes-status
    flow: git-file-change-refresh
    fixtures: [one-window-folder]
    state: *openmod
    expect:
      - "result.ok && result.value.scheduled"
      - "state['git-repository@eh1'].working_tree == ['src/main.ts'] && !state['git-repository@eh1'].update_in_flight"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-binary.exec' && e.input.args[0] == 'status')"
      - "state['git-decoration-provider@eh1'].decorations == ['src/main.ts']"
      - "duration_ms >= 6000"
  - id: builtin-extensions-git-file-change-then-repository-state
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app"}
      git-binary: {modified: ["src/util.ts"], untracked: ["notes.txt"]}
    steps:
      - {flow: git-file-change-refresh, as: change, input: {uri: "file:///work/app/src/util.ts"}}
      - {flow: git-api-repository-state, as: read}
    expect:
      - "steps.change.result.ok"
      - "steps.read.result.value.workingTreeChanges == ['src/util.ts', 'notes.txt']"
      - "state['git-repository@eh1'].untracked == []"
  - id: builtin-extensions-git-file-change-autorefresh-off
    flow: git-file-change-refresh
    fixtures: [one-window-folder]
    config: {git-autorefresh: false}
    state: *open
    expect:
      - "result.ok && !result.value.scheduled && result.value.reason == 'autorefresh-disabled'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.status')"
  - id: builtin-extensions-git-file-change-repository-huge
    flow: git-file-change-refresh
    fixtures: [one-window-folder]
    state: {"git-repository@eh1": {root: "/work/app", is_huge: true}}
    expect:
      - "result.value.reason == 'repository-huge'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.status')"
  - id: builtin-extensions-git-file-change-operation-running
    flow: git-file-change-refresh
    fixtures: [one-window-folder]
    state: {"git-repository@eh1": {root: "/work/app", operations: [Commit]}}
    expect:
      - "result.value.reason == 'operation-running'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.eventually-update-when-idle-and-wait')"
  - id: builtin-extensions-git-file-change-window-unfocused
    flow: git-file-change-refresh
    fixtures: [one-window-folder]
    state: *open
    choices: {git-repository.update-when-idle-and-wait.window_focus: unfocused}
    expect:
      - "result.ok"
      - "state['git-repository@eh1'].waiting_for_focus && !trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.status')"
  - id: builtin-extensions-git-file-change-throttled
    flow: git-file-change-refresh
    fixtures: [one-window-folder]
    state: {"git-repository@eh1": {root: "/work/app", update_in_flight: true}}
    expect:
      - "result.ok && state['git-repository@eh1'].update_in_flight"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.status')"
  - id: builtin-extensions-git-debounce-superseded
    fixtures: [one-window-folder]
    state: {"git-repository@eh1": {root: "/work/app", last_change_ms: 5}}
    steps:
      - {interface: git-repository.eventually-update-when-idle-and-wait, caller: exthost-runtime, as: tick, input: {scheduled_at: 1}}
    expect:
      - "steps.tick.result.value.reason == 'superseded'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.update-when-idle-and-wait')"
  - id: builtin-extensions-git-status-limit-warning
    flow: git-command
    fixtures: [one-window-folder]
    config: {git-status-limit: 1}
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app"}
      git-binary: {modified: ["src/main.ts", "src/util.ts"]}
    input: {command_id: git.refresh, args: []}
    expect:
      - "result.ok && state['git-repository@eh1'].is_huge && state['git-repository@eh1'].did_warn_about_limit"
      - "state['git-repository@eh1'].working_tree == ['src/main.ts']"
      - "calls['vscode-api.window-show-warning-message'] == 1"
  - id: builtin-extensions-git-status-limit-already-warned
    flow: git-command
    fixtures: [one-window-folder]
    config: {git-status-limit: 1, git-untracked-changes: separate}
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", did_warn_about_limit: true}
      git-binary: {modified: ["src/main.ts"], untracked: ["a.txt"]}
    input: {command_id: git.refresh, args: []}
    expect:
      - "result.ok && state['git-repository@eh1'].is_huge"
      - "calls['vscode-api.window-show-warning-message'] == 0"
  - id: builtin-extensions-git-refresh-detached-head
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app"}
      git-binary: {branch: "", untracked: ["a.txt"]}
    config: {git-untracked-changes: separate}
    input: {command_id: git.refresh, args: []}
    expect:
      - "result.ok && state['git-repository@eh1'].head == {}"
      - "state['git-repository@eh1'].untracked == ['a.txt'] && state['git-repository@eh1'].working_tree == []"

  # ------------------------------------------------------------ git commands: staging
  - id: builtin-extensions-git-stage-file
    flow: git-command
    fixtures: [one-window-folder]
    state: *openmod
    input: {command_id: git.stage, args: ["file:///work/app/src/main.ts"]}
    expect:
      - "result.ok && result.value.ran"
      - "state['git-binary'].staged == ['src/main.ts'] && state['git-binary'].modified == []"
      - "state['git-repository@eh1'].index == ['src/main.ts'] && state['git-repository@eh1'].operations == []"
  - id: builtin-extensions-git-stage-then-repository-state
    fixtures: [one-window-folder]
    state: *openmod
    steps:
      - {flow: git-command, as: stage, input: {command_id: git.stage, args: ["file:///work/app/src/main.ts"]}}
      - {flow: git-api-repository-state, as: read}
    expect:
      - "steps.stage.result.ok"
      - "steps.read.result.value.indexChanges == ['src/main.ts'] && steps.read.result.value.workingTreeChanges == []"
      - "state['git-binary'].staged == ['src/main.ts']"
  - id: builtin-extensions-git-stage-no-resource
    flow: git-command
    fixtures: [one-window-folder]
    state: *openmod
    input: {command_id: git.stage, args: []}
    expect:
      - "result.ok && result.value.value.staged == []"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.add')"
  - id: builtin-extensions-git-stage-merge-conflict-confirmed
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", merge: ["src/main.ts"]}
      git-binary: {conflicted: ["src/main.ts"]}
    input: {command_id: git.stage, args: ["file:///work/app/src/main.ts"]}
    expect:
      - "result.ok && state['git-binary'].staged == ['src/main.ts'] && state['git-binary'].conflicted == []"
      - "state['git-repository@eh1'].merge == [] && calls['vscode-api.window-show-warning-message'] == 1"
  - id: builtin-extensions-git-stage-merge-conflict-cancelled
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", merge: ["src/main.ts"]}
      git-binary: {conflicted: ["src/main.ts"]}
    choices: {git-command-center.cmd-git-stage.confirm_conflicts: cancel}
    input: {command_id: git.stage, args: ["file:///work/app/src/main.ts"]}
    expect:
      - "result.ok && state['git-binary'].conflicted == ['src/main.ts']"
      - "calls['git-repository.add'] == 0"
  - id: builtin-extensions-git-stage-all
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", working_tree: ["src/main.ts", "new.ts"]}
      git-binary: {modified: ["src/main.ts"], untracked: ["new.ts"]}
    input: {command_id: git.stageAll, args: []}
    expect:
      - "result.ok && state['git-binary'].staged == ['src/main.ts', 'new.ts']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-binary.exec' && e.input.args[1] == '-A')"
  - id: builtin-extensions-git-stage-all-nothing
    flow: git-command
    fixtures: [one-window-folder]
    state: *open
    input: {command_id: git.stageAll, args: []}
    expect:
      - "result.ok && result.value.value.staged == [] && !trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.add')"
  - id: builtin-extensions-git-stage-all-tracked-only
    flow: git-command
    fixtures: [one-window-folder]
    config: {git-untracked-changes: separate}
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", working_tree: ["src/main.ts"], untracked: ["new.ts"]}
      git-binary: {modified: ["src/main.ts"], untracked: ["new.ts"]}
    input: {command_id: git.stageAll, args: []}
    expect:
      - "result.ok && state['git-binary'].staged == ['src/main.ts'] && state['git-binary'].untracked == ['new.ts']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-binary.exec' && e.input.args[1] == '-u')"
  - id: builtin-extensions-git-stage-locked-then-retried
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", working_tree: ["src/main.ts"]}
      git-binary: {modified: ["src/main.ts"], locked_attempts: 2}
    config: {git-optimistic-update: false}
    input: {command_id: git.stage, args: ["file:///work/app/src/main.ts"]}
    expect:
      - "result.ok && retries == 2"
      - "state['git-binary'].staged == ['src/main.ts'] && state['git-binary'].locked_attempts == 0"
  - id: builtin-extensions-git-stage-repository-gone
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", working_tree: ["src/main.ts"]}
      git-binary: {root: "/gone"}
    input: {command_id: git.stage, args: ["file:///work/app/src/main.ts"]}
    expect:
      - "result.ok && result.value.notified"
      - "state['git-repository@eh1'].state == 'disposed' && state['git-repository@eh1'].operations == []"
      - "calls['vscode-api.window-show-error-message'] == 1"
  - id: builtin-extensions-git-command-repository-disposed
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", state: disposed}
    input: {command_id: git.refresh, args: []}
    expect:
      - "result.ok && result.value.notified"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'git-repository.run' && e.error != null && e.error.code == 'repository-not-initialized')"
  - id: builtin-extensions-git-command-no-repositories
    flow: git-command
    fixtures: [one-window-folder]
    input: {command_id: git.refresh, args: []}
    expect:
      - "result.ok && result.value.notified"
      - "calls['vscode-api.window-show-error-message'] == 1 && calls['git-repository.refresh'] == 0"
      - "state['git-model@eh1'].repositories == []"
  - id: builtin-extensions-git-command-pick-dismissed
    flow: git-command
    fixtures: [one-window-folder]
    state: {"git-model@eh1": {state: initialized, repositories: ["/work/app", "/work/lib"]}}
    choices: {git-model.pick-repository.pick: dismissed}
    input: {command_id: git.refresh, args: []}
    expect:
      - "result.ok && !result.value.ran"
      - "calls['git-repository.refresh'] == 0 && state['git-model@eh1'].repositories == ['/work/app', '/work/lib']"
  - id: builtin-extensions-git-command-pick-first
    flow: git-command
    fixtures: [one-window-folder]
    state: {"git-model@eh1": {state: initialized, repositories: ["/work/app", "/work/lib"]}, "git-repository@eh1": {root: "/work/app"}}
    input: {command_id: git.refresh, args: []}
    expect:
      - "result.ok && result.value.ran"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-repository.refresh')"
  - id: builtin-extensions-git-command-repository-from-argument
    flow: git-command
    fixtures: [one-window-folder]
    state: *open
    input: {command_id: git.refresh, args: ["file:///work/app/src/main.ts"]}
    expect:
      - "result.ok && result.value.ran && calls['git-model.pick-repository'] == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-model.get-repository')"
  - id: builtin-extensions-git-command-level-stub
    flow: git-command
    fixtures: [one-window-folder]
    input: {command_id: git.showOutput, args: []}
    expect:
      - "result.ok && result.value.ran"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-command-center.cmd-git-showoutput')"

  # ------------------------------------------------------------ git commands: commit
  - id: builtin-extensions-git-commit-staged
    flow: git-command
    fixtures: [one-window-folder]
    state: *openstaged
    input: {command_id: git.commit, args: []}
    expect:
      - "result.ok && result.value.ran"
      - "state['git-binary'].commits == 2 && state['git-binary'].staged == [] && state['git-binary'].last_message == 'Fix add'"
      - "state['git-repository@eh1'].index == [] && state['git-repository@eh1'].input_box_value == ''"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-binary.exec' && e.input.args[0] == '-c')"
  - id: builtin-extensions-git-commit-then-repository-state
    fixtures: [one-window-folder]
    state: *openstaged
    steps:
      - {flow: git-command, as: commit, input: {command_id: git.commit, args: []}}
      - {flow: git-api-repository-state, as: read}
    expect:
      - "steps.commit.result.ok"
      - "steps.read.result.value.indexChanges == [] && steps.read.result.value.HEAD.commit == 'c2'"
      - "state['git-binary'].commits == 2"
  - id: builtin-extensions-git-commit-editor-message
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", index: ["src/main.ts"]}
      git-binary: {staged: ["src/main.ts"]}
    input: {command_id: git.commit, args: []}
    expect:
      - "result.ok && state['git-binary'].last_message == 'Edited in COMMIT_EDITMSG'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'git-binary.exec' && '--file' in e.input.args)"
  - id: builtin-extensions-git-commit-editor-empty-message
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", index: ["src/main.ts"]}
      git-binary: {staged: ["src/main.ts"], editor_message: ""}
    input: {command_id: git.commit, args: []}
    expect:
      - "result.ok && result.value.notified && state['git-binary'].commits == 1"
      - "calls['vscode-api.window-show-information-message'] == 1"
  - id: builtin-extensions-git-commit-no-user-name
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", index: ["src/main.ts"], input_box_value: "msg"}
      git-binary: {staged: ["src/main.ts"], user_name: ""}
    input: {command_id: git.commit, args: []}
    expect:
      - "result.ok && result.value.notified && state['git-binary'].commits == 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'git-base-repository.commit' && e.error != null && e.error.code == 'no-user-name-configured')"
  - id: builtin-extensions-git-commit-no-user-email
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", index: ["src/main.ts"], input_box_value: "msg"}
      git-binary: {staged: ["src/main.ts"], user_email: ""}
    input: {command_id: git.commit, args: []}
    expect:
      - "result.ok && state['git-binary'].commits == 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'git-base-repository.commit' && e.error != null && e.error.code == 'no-user-email-configured')"
  - id: builtin-extensions-git-commit-unmerged
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", merge: ["src/main.ts"], input_box_value: "merge"}
      git-binary: {conflicted: ["src/main.ts"]}
    choices: {git-command-center.commit-with-any-input.smart_commit: "yes"}
    input: {command_id: git.commit, args: []}
    expect:
      - "result.ok && result.value.notified && state['git-binary'].commits == 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'git-base-repository.commit' && e.error != null && e.error.code == 'unmerged-changes')"
  - id: builtin-extensions-git-commit-smart-yes
    flow: git-command
    fixtures: [one-window-folder]
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
      "git-repository@eh1": {root: "/work/app", working_tree: ["src/main.ts"], input_box_value: "all"}
      git-binary: {modified: ["src/main.ts"]}
    input: {command_id: git.commit, args: []}
    expect:
      - "result.ok && state['git-binary'].commits == 2 && state['git-binary'].modified == []"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'git-base-repository.add')"
  - id: builtin-extensions-git-commit-smart-always
    flow: git-command
    fixtures: [one-window-folder]
    config: {git-smart-commit-changes: tracked}
    state:
      "git-model@eh1": {state: initialized, repositories: ["/work/app"]}
