scenarios:
  # ---------------------------------------------------------------- retry / votes
  - id: chat-retry-then-read
    flow: chat-retry
    fixtures: [one-window-folder]
    state:
      "chat-widget@w1": {mode: ask}
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {requests: [{id: request_1, message: "Explain util.ts", agent_id: github.copilot.default, response: error}]}}}
    steps:
      - {flow: chat-retry, as: x}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.x.result.value.retried"
      - "size(steps.r.result.value.session.requests) == 1 && steps.r.result.value.session.requests[0].id == 'request_2' && steps.r.result.value.session.requests[0].response == 'success'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].attempt == 1"
  - id: chat-retry-agent-mode-restores-checkpoint
    flow: chat-retry
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {requests: [{id: request_1, message: "Rename add", agent_id: github.copilot.default, response: success}]}}}
      "chat-editing-session@w1": {sessions: {"vscode-chat-session://local/s1": {entries: {"file:///work/app/src/util.ts": {state: modified, created_in_request: false}}}}}
    expect:
      - "result.value.retried && calls['chat-editing-session.restore-snapshot'] == 1"
      - "state['chat-editing-session@w1'].sessions['vscode-chat-session://local/s1'].restored_to == 'request_1'"
  - id: chat-retry-declined
    flow: chat-retry
    fixtures: [one-window-folder]
    choices: {chat-title-actions.cmd-workbench-action-chat-retry.confirm_retry: "no"}
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {requests: [{id: request_1, message: "Rename add", agent_id: github.copilot.default, response: success}]}}}
      "chat-editing-session@w1": {sessions: {"vscode-chat-session://local/s1": {entries: {"file:///work/app/src/util.ts": {state: modified, created_in_request: false}}}}}
    expect:
      - "!result.value.retried && calls['chat-service.resend-request'] == 0"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].id == 'request_1'"
  - id: chat-retry-unknown-request
    flow: chat-retry
    fixtures: [one-window-folder]
    input: {request_id: request_9}
    expect:
      - "!result.value.retried && calls['chat-service.resend-request'] == 0"
  - id: chat-resend-unknown-session
    flow: chat-retry
    fixtures: [one-window-folder]
    steps:
      - {interface: chat-service.resend-request, caller: chat-title-actions, as: r, input: {session_resource: "vscode-chat-session://local/none", request_id: request_1}}
    expect:
      - "!steps.r.result.ok && steps.r.result.error.code == 'unknown-session'"
      - "size(state['chat-service@w1'].sessions) == 1"
  - id: chat-resend-read-only
    flow: chat-retry
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {read_only: true, requests: [{id: request_1, message: "x", agent_id: github.copilot.default, response: error}]}}}
    steps:
      - {interface: chat-service.resend-request, caller: chat-title-actions, as: r, input: {session_resource: "vscode-chat-session://local/s1", request_id: request_1}}
    expect:
      - "!steps.r.result.value.resent"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'error'"
  - id: chat-resend-missing-request
    flow: chat-retry
    fixtures: [one-window-folder]
    steps:
      - {interface: chat-service.resend-request, caller: chat-title-actions, as: r, input: {session_resource: "vscode-chat-session://local/s1", request_id: request_7}}
    expect:
      - "!steps.r.result.value.resent && state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests == []"
  - id: chat-vote-helpful-then-read
    flow: chat-vote
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {requests: [{id: request_1, message: "x", agent_id: github.copilot.default, response: success}]}}}
    steps:
      - {flow: chat-vote, as: v}
      - {flow: chat-read-session, as: r}
    expect:
      - "steps.v.result.value.voted && steps.r.result.value.session.requests[0].vote == 'up'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].vote == 'up'"
  - id: chat-vote-not-a-response
    flow: chat-vote
    fixtures: [one-window-folder]
    input: {request_id: ""}
    expect:
      - "!result.value.voted && calls['chat-service.notify-user-action'] == 0"
  - id: chat-vote-unhelpful
    flow: chat-vote-down
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {requests: [{id: request_1, message: "x", agent_id: github.copilot.default, response: success}]}}}
    steps:
      - {flow: chat-vote-down, as: v}
      - {flow: chat-read-session, as: r}
    expect:
      - "steps.r.result.value.session.requests[0].vote == 'down'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].vote == 'down'"
  - id: chat-vote-unhelpful-not-a-response
    flow: chat-vote-down
    fixtures: [one-window-folder]
    input: {request_id: ""}
    expect:
      - "!result.value.voted"
  - id: chat-vote-unknown-session
    flow: chat-vote
    fixtures: [one-window-folder]
    input: {session_resource: "vscode-chat-session://local/none"}
    expect:
      - "result.value.voted && !('vscode-chat-session://local/none' in state['chat-service@w1'].sessions)"

  # ---------------------------------------------------------------- mode and model
  - id: chat-toggle-mode-empty-session
    flow: chat-toggle-agent-mode
    fixtures: [one-window-folder]
    state:
      "chat-widget@w1": {mode: ask}
    steps:
      - {flow: chat-toggle-agent-mode, as: t}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.t.result.value.mode == 'edit' && steps.r.result.value.mode == 'edit'"
      - "state['chat-widget@w1'].mode == 'edit'"
  - id: chat-toggle-mode-wraps-to-ask
    flow: chat-toggle-agent-mode
    fixtures: [one-window-folder]
    expect:
      - "result.value.mode == 'ask' && state['chat-widget@w1'].mode == 'ask'"
  - id: chat-toggle-mode-same
    flow: chat-toggle-agent-mode
    fixtures: [one-window-folder]
    input: {mode_id: agent}
    expect:
      - "!result.value.changed && state['chat-widget@w1'].mode == 'agent'"
  - id: chat-toggle-mode-leave-edit-clears-session
    flow: chat-toggle-agent-mode
    fixtures: [one-window-folder]
    state:
      "chat-widget@w1": {mode: edit}
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {requests: [{id: request_1, message: "x", agent_id: github.copilot.default, response: success}]}}}
    expect:
      - "result.value.mode == 'ask' && result.value.changed"
      - "state['chat-widget@w1'].session_resource != 'vscode-chat-session://local/s1'"
  - id: chat-toggle-mode-declined
    flow: chat-toggle-agent-mode
    fixtures: [one-window-folder]
    choices: {chat-execute-actions.cmd-workbench-action-chat-toggleagentmode.confirm_mode_switch: "no"}
    state:
      "chat-widget@w1": {mode: edit}
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {requests: [{id: request_1, message: "x", agent_id: github.copilot.default, response: success}]}}}
    expect:
      - "!result.value.changed && state['chat-widget@w1'].mode == 'edit'"
  - id: chat-switch-next-model-then-read
    flow: chat-switch-next-model
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-switch-next-model, as: s}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.s.result.value.model_id == 'copilot/gpt-4.1' || steps.s.result.value.model_id == 'copilot/claude-sonnet-4'"
      - "steps.r.result.value.model_id == steps.s.result.value.model_id && state['chat-widget@w1'].model_id == steps.s.result.value.model_id"
  - id: chat-change-model-then-read
    flow: chat-change-model
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-change-model, as: c, input: {vendor: copilot, id: claude-sonnet-4, family: claude-sonnet-4}}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.c.result.value.model_id == 'copilot/claude-sonnet-4' && steps.r.result.value.model_id == 'copilot/claude-sonnet-4'"
      - "state['chat-widget@w1'].model_id == 'copilot/claude-sonnet-4'"
  - id: chat-change-model-unknown
    flow: chat-change-model
    fixtures: [one-window-folder]
    input: {vendor: ollama, id: llama3, family: llama3}
    expect:
      - "result.value.model_id == '' && state['chat-widget@w1'].model_id == 'copilot/gpt-4.1'"
  - id: chat-change-model-bad-argument
    flow: chat-change-model
    fixtures: [one-window-folder]
    input: {vendor: ""}
    expect:
      - "!result.ok && result.error.code == 'assertion-failed'"
      - "state['chat-widget@w1'].model_id == 'copilot/gpt-4.1'"
  - id: chat-open-model-picker
    flow: chat-open-model-picker
    fixtures: [one-window-folder]
    expect:
      - "result.value.opened && state['chat-widget@w1'].open_picker == 'model'"
  - id: chat-submit-without-dispatching
    flow: chat-submit-without-dispatching
    fixtures: [one-window-folder]
    expect:
      - "result.value.kind == 'sent'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].message == 'hello'"

  # ---------------------------------------------------------------- attach context
  - id: chat-attach-file-then-submit
    flow: chat-attach-file
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-attach-file, as: a, input: {resources: ["file:///work/app/src/util.ts", "vscode-chat-editor:///x"]}}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.a.result.value.added == 1 && steps.r.result.value.attachments[0].resource == 'file:///work/app/src/util.ts'"
      - "size(state['chat-widget@w1'].attachments) == 1"
  - id: chat-attach-only-allows-empty-message
    flow: chat-attach-file
    fixtures: [one-window-folder]
    description: "A request with only an explicit file attachment is not rejected as empty."
    steps:
      - {flow: chat-attach-file, as: a}
      - {flow: chat-submit, as: s, input: {input_value: ""}}
    expect:
      - "steps.s.result.value.kind == 'sent'"
      - "state['chat-widget@w1'].attachments == []"
  - id: chat-attach-file-duplicate
    flow: chat-attach-file
    fixtures: [one-window-folder]
    state:
      "chat-widget@w1": {attachments: [{resource: "file:///work/app/src/util.ts", kind: file, range: ""}]}
    expect:
      - "result.value.added == 0 && size(state['chat-widget@w1'].attachments) == 1"
  - id: chat-attach-folder
    flow: chat-attach-folder
    fixtures: [one-window-folder]
    expect:
      - "result.value.added == 1 && state['chat-widget@w1'].attachments[0].kind == 'folder'"
  - id: chat-attach-selection
    flow: chat-attach-selection
    fixtures: [one-window-folder]
    expect:
      - "state['chat-widget@w1'].attachments[0].range == '1:1-2:1'"
  - id: chat-attach-search-results
    flow: chat-attach-search-results
    fixtures: [one-window-folder]
    expect:
      - "result.value.added == 2 && size(state['chat-widget@w1'].attachments) == 2"
  - id: chat-attach-search-results-none
    flow: chat-attach-search-results
    fixtures: [one-window-folder]
    input: {matches: []}
    expect:
      - "result.value.added == 0 && state['chat-widget@w1'].attachments == []"
  - id: chat-attach-pinned-editors
    flow: chat-attach-pinned-editors
    fixtures: [dirty-editor]
    steps:
      - {flow: chat-attach-pinned-editors, as: w}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.r.result.value.attachments[0].resource == 'file:///work/app/src/main.ts'"
      - "steps.w.result.value.added == 1 && state['chat-widget@w1'].attachments[0].resource == 'file:///work/app/src/main.ts'"
  - id: chat-attach-pinned-editors-none
    flow: chat-attach-pinned-editors
    fixtures: [one-window-folder]
    expect:
      - "result.value.added == 0 && state['chat-widget@w1'].attachments == []"
  - id: chat-attach-context-pick
    flow: chat-attach-context
    fixtures: [one-window-folder]
    expect:
      - "result.value.added == 1 && state['chat-widget@w1'].attachments[0].resource == 'file:///work/app/README.md'"
  - id: chat-attach-context-dismissed
    flow: chat-attach-context
    fixtures: [one-window-folder]
    choices: {chat-context-actions.cmd-workbench-action-chat-attachcontext.picker: dismiss}
    expect:
      - "result.value.added == 0 && state['chat-widget@w1'].attachments == []"

  # ---------------------------------------------------------------- queue additions
  - id: chat-send-pending-immediately-then-read
    flow: chat-send-pending-immediately
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {pending: true, pending_request_id: request_1, requests: [{id: request_1, message: "long", agent_id: github.copilot.default, response: in-progress}], queued: [{id: queued_1, message: "a", kind: queued}, {id: queued_2, message: "b", kind: queued}]}}}
    steps:
      - {flow: chat-send-pending-immediately, as: s, input: {id: queued_2}}
      - {flow: chat-read-session, as: r}
    expect:
      - "steps.s.result.value.sent"
      - "steps.r.result.value.session.requests[0].response == 'canceled' && steps.r.result.value.session.requests[1].message == 'b'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].queued == [] && state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[2].message == 'a'"
  - id: chat-send-pending-immediately-unknown
    flow: chat-send-pending-immediately
    fixtures: [one-window-folder]
    input: {id: queued_9}
    expect:
      - "!result.value.sent && calls['chat-service.cancel-current-request-for-session'] == 0"
  - id: chat-send-pending-immediately-blocked
    flow: chat-send-pending-immediately
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {input_blocked: true, queued: [{id: queued_1, message: "a", kind: queued}]}}}
    expect:
      - "!result.value.sent && size(state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].queued) == 1"
  - id: chat-edit-pending-request
    flow: chat-edit-pending-request
    fixtures: [one-window-folder]
    expect:
      - "result.value.editing && state['chat-widget@w1'].editing_request_id == 'queued_1'"
  - id: chat-edit-pending-request-no-context
    flow: chat-edit-pending-request
    fixtures: [one-window-folder]
    input: {id: ""}
    expect:
      - "!result.value.editing && state['chat-widget@w1'].editing_request_id == ''"

  # ---------------------------------------------------------------- undo / redo / new chat variants
  - id: chat-undo-edit-then-redo
    flow: chat-undo-edit
    fixtures: [one-window-folder]
    state:
      "chat-editing-session@w1": {sessions: {"vscode-chat-session://local/s1": {entries: {}, undo_depth: 2, redo_depth: 0}}}
    steps:
      - {flow: chat-undo-edit, as: u}
      - {flow: chat-redo-edit, as: r}
      - {flow: chat-editing-entries, as: e}
    expect:
      - "steps.u.result.value.undone && steps.r.result.value.redone"
      - "state['chat-editing-session@w1'].sessions['vscode-chat-session://local/s1'].undo_depth == 2 && state['chat-editing-session@w1'].sessions['vscode-chat-session://local/s1'].redo_depth == 0"
  - id: chat-undo-edit-nothing
    flow: chat-undo-edit
    fixtures: [one-window-folder]
    expect:
      - "!result.value.undone && state['chat-editing-session@w1'].sessions == {}"
  - id: chat-redo-edit-nothing
    flow: chat-redo-edit
    fixtures: [one-window-folder]
    expect:
      - "!result.value.redone && state['chat-editing-session@w1'].sessions == {}"
  - id: chat-redo-all
    flow: chat-redo-all
    fixtures: [one-window-folder]
    state:
      "chat-editing-session@w1": {sessions: {"vscode-chat-session://local/s1": {entries: {}, undo_depth: 0, redo_depth: 3}}}
    expect:
      - "state['chat-editing-session@w1'].sessions['vscode-chat-session://local/s1'].redo_depth == 0 && state['chat-editing-session@w1'].sessions['vscode-chat-session://local/s1'].undo_depth == 3"
      - "calls['chat-editing-session.redo-interaction'] == 4"
  - id: chat-new-local-chat
    flow: chat-new-local-chat
    fixtures: [one-window-folder]
    expect:
      - "result.value.new_session && state['chat-widget@w1'].session_resource == result.value.session_resource"
  - id: chat-new-chat-icon-variant
    flow: chat-new-chat-icon-variant
    fixtures: [one-window-folder]
    expect:
      - "result.value.new_session && state['chat-widget@w1'].session_resource != 'vscode-chat-session://local/s1'"

  # ---------------------------------------------------------------- slash commands
  - id: chat-slash-rename-then-read
    flow: chat-slash-command
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-slash-command, as: s}
      - {flow: agent-session-read-state, as: r}
    expect:
      - "steps.s.result.value.kind == 'sent'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].title == 'Refactor util'"
      - "steps.r.result.value.session.label == 'Refactor util'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests == [] && calls['chat-agent-service.invoke-agent'] == 0"
  - id: chat-slash-rename-empty
    flow: chat-slash-command
    fixtures: [one-window-folder]
    input: {input_value: "/rename"}
    expect:
      - "calls['chat-service.set-chat-session-title'] == 0"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].title == ''"
  - id: chat-slash-clear
    flow: chat-slash-command
    fixtures: [one-window-folder]
    input: {input_value: "/clear"}
    expect:
      - "state['agent-sessions-service@w1'].sessions['vscode-chat-session://local/s1'].archived"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == 'workbench.action.chat.newChat')"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].slash_command == 'clear'"
  - id: chat-slash-models
    flow: chat-slash-command
    fixtures: [one-window-folder]
    input: {input_value: "/models"}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == 'workbench.action.chat.openModelPicker')"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests == []"
  - id: chat-slash-unknown-goes-to-agent
    flow: chat-slash-command
    fixtures: [one-window-folder]
    input: {input_value: "/explain this"}
    expect:
      - "calls['chat-slash-command-service.execute-command'] == 0 && calls['chat-agent-service.invoke-agent'] == 1"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'success'"
  - id: chat-slash-command-fails
    flow: chat-slash-command
    fixtures: [one-window-folder]
    input: {input_value: "/models"}
    faults: [{target: command-service.execute-command, type: error, code: command-not-found}]
    state:
      "chat-slash-command-service@w1": {commands: {models: {silent: false}}}
    expect:
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'error'"
  - id: chat-slash-execute-unregistered
    flow: chat-slash-command
    fixtures: [one-window-folder]
    steps:
      - {interface: chat-slash-command-service.execute-command, caller: chat-service, as: x, input: {id: nope, session_resource: "vscode-chat-session://local/s1"}}
    expect:
      - "!steps.x.result.ok && steps.x.result.error.code == 'slash-command-not-registered'"
      - "size(state['chat-slash-command-service@w1'].commands) == 3"
  - id: chat-slash-register-duplicate
    flow: chat-slash-command
    fixtures: [one-window-folder]
    steps:
      - {interface: chat-slash-command-service.register-slash-command, caller: chat-slash-commands-contribution, as: x, input: {command: clear}}
    expect:
      - "!steps.x.result.ok && steps.x.result.error.code == 'already-registered'"
      - "state['chat-slash-command-service@w1'].commands['clear'].handler == 'clear'"

  # ---------------------------------------------------------------- agent sessions
  - id: agent-sessions-mark-all-read-then-read
    flow: agent-sessions-mark-all-read
    fixtures: [one-window-folder]
    state:
      "agent-sessions-service@w1": {sessions: {"vscode-chat-session://local/s1": {read: false}, "vscode-chat-session://local/old": {label: "Old chat", type: local, read: false, pinned: false, archived: true, status: completed}}}
    steps:
      - {flow: agent-sessions-mark-all-read, as: m}
      - {flow: agent-session-read-state, as: r}
    expect:
      - "steps.m.result.value.marked == 1 && steps.r.result.value.session.read"
      - "!state['agent-sessions-service@w1'].sessions['vscode-chat-session://local/old'].read"
  - id: agent-sessions-mark-all-read-none
    flow: agent-sessions-mark-all-read
    fixtures: [one-window-folder]
    expect:
      - "result.value.marked == 0 && state['agent-sessions-service@w1'].sessions['vscode-chat-session://local/s1'].read"
  - id: agent-session-mark-unread-then-read
    flow: agent-session-mark-unread
    fixtures: [one-window-folder]
    steps:
      - {flow: agent-session-mark-unread, as: m}
      - {flow: agent-session-read-state, as: r}
    expect:
      - "steps.m.result.value.count == 1 && !steps.r.result.value.session.read"
      - "!state['agent-sessions-service@w1'].sessions['vscode-chat-session://local/s1'].read"
  - id: agent-session-mark-unread-unknown
    flow: agent-session-mark-unread
    fixtures: [one-window-folder]
    input: {session_resource: "vscode-chat-session://local/none"}
    expect:
      - "result.value.count == 0 && state['agent-sessions-service@w1'].sessions['vscode-chat-session://local/s1'].read"
  - id: agent-session-mark-read
