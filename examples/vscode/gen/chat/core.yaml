  - component: chat-service
    name: run-request
    kind: function
    summary: "The asynchronous body of a sent request: activates the participant, invokes it, records the response and drains the queue on success."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1821-2301"]
    request:
      type: object
      properties:
        session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}
        request_id: {type: string, examples: [request_1]}
        agent_id: {type: string, examples: [github.copilot.default]}
        message: {type: string, examples: ["Explain what src/main.ts does"]}
    behavior:
      - set: {vars.sess: "= state.sessions[input.session_resource]"}
      - title: Canceled before the agent ran
        detail: "The CancellableRequest was canceled (token cancelled and no result): nothing more happens."
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2211-2212"
        if: "!vars.sess.pending || vars.sess.pending_request_id != input.request_id"
