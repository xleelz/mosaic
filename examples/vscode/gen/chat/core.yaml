  # =============================================================== tools
  - component: language-model-tools-service
    name: invoke-tool
    kind: function
    summary: "Invokes a tool: refuses stale requests and unknown tools, activates the contributing extension, applies auto-approval and the confirmation, then runs the implementation."
    sources: ["src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:493-815"]
    request:
      type: object
      required: [tool_id, call_id]
      properties:
        tool_id: {type: string, examples: [vscode_fetchWebPage_internal]}
        call_id: {type: string, examples: [call_1]}
        session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}
        request_complete: {type: boolean, default: false}
        parameters: {type: object}
    response: {type: object, properties: {outcome: {type: string}, confirmed_by: {type: string}, content: {type: string}}}
    errors:
      - {code: canceled, status: 0, retryable: false}
      - {code: tool-not-contributed, status: 0, retryable: false}
      - {code: tool-no-implementation, status: 0, retryable: false}
    behavior:
      - title: Ignore a tool call for a cancelled or completed request
        source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:502-505"
        if: "input.request_complete"
        then:
          - fail: {code: canceled, message: Canceled}
      - title: Unknown tool
        source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:579-582"
        if: "!(input.tool_id in state.tools)"
        then:
          - fail: {code: tool-not-contributed, message: "= 'Tool ' + input.tool_id + ' was not contributed'"}
      - set: {vars.tool: "= state.tools[input.tool_id]"}
      - title: No implementation yet, so activate the contributing extension
        source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:584-592"
        if: "!vars.tool.has_impl"
        then:
          - call: extension-service.activate-by-event
            input: {activation_event: "= 'onLanguageModelTool:' + input.tool_id"}
          - title: Still no implementation registered
            source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:589-591"
            if: "!state.tools[input.tool_id].has_impl"
            then:
              - fail: {code: tool-no-implementation, message: "= 'Tool ' + input.tool_id + ' does not have an implementation registered.'"}
      - title: Decide auto-confirmation
        source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:948"
        call: language-model-tools-service.should-auto-confirm
        input: {tool_id: "= input.tool_id"}
        as: auto
      - title: Create the tool invocation part in the response
        source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:651-658"
        call: chat-tool-invocation.begin
        input: {call_id: "= input.call_id", tool_id: "= input.tool_id", needs_confirmation: "= vars.tool.needs_confirmation", auto_confirmed: "= vars.auto.value.reason"}
      - if: "vars.tool.needs_confirmation"
        then:
          - title: Wait for the user's confirmation (or the auto-confirmation)
            source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:679-686"
            call: chat-tool-invocation.await-confirmation
            input: {call_id: "= input.call_id"}
            as: conf
          - title: Denied
            source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:684-686"
            if: "vars.conf.value.kind == 'denied'"
            then:
              - fail: {code: canceled, message: Canceled}
          - title: Skipped; the tool does not run
            source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:687-695"
            if: "vars.conf.value.kind == 'skipped'"
            then:
              - return: {outcome: skipped, content: "The user chose to skip the tool call, they want to proceed without running it"}
          - set: {vars.confirmed_by: "= vars.conf.value.kind"}
        else:
          - set: {vars.confirmed_by: "= vars.auto.value.reason != '' ? vars.auto.value.reason : 'confirmation-not-needed'"}
      - title: Run the implementation
        source: "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:741-745"
        if: "vars.tool.source == 'extension'"
        then:
          - call: ext-host-language-model-tools.invoke-tool
            on: "= 'eh' + self.substring(1)"
            input: {tool_id: "= input.tool_id", call_id: "= input.call_id", parameters: "= input.parameters"}
      - call: chat-tool-invocation.complete
        input: {call_id: "= input.call_id"}
      - {return: {outcome: completed, confirmed_by: "= vars.confirmed_by"}}
  - component: language-model-tools-service
    name: should-auto-confirm
    kind: function
    summary: "Whether a tool call needs no confirmation: eligibility, remembered approvals, then chat.tools.global.autoApprove (after its one-time opt-in)."
    sources:
      - "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1390-1438"
      - "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1355-1388"
    request: {type: object, required: [tool_id], properties: {tool_id: {type: string, examples: [vscode_fetchWebPage_internal]}}}
    response: {type: object, properties: {reason: {type: string}}}
    behavior:
