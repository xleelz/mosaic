  - component: chat-tool-invocation
    name: begin
    kind: function
    summary: "Creates (or reuses the streaming) tool invocation; it waits for confirmation unless auto-confirmed."
    sources: ["src/vs/workbench/contrib/chat/common/model/chatProgressTypes/chatToolInvocation.ts:94"]
    request: {type: object, properties: {call_id: {type: string}, tool_id: {type: string}, needs_confirmation: {type: boolean}, auto_confirmed: {type: string}}}
    behavior:
      - set: {vars.prev: "= input.call_id in state.invocations ? state.invocations[input.call_id] : {}"}
      - set:
          vars.st: "= has(vars.prev.state) && vars.prev.state != 'streaming' ? vars.prev.state : (input.auto_confirmed != '' ? 'confirmed' : (input.needs_confirmation ? 'waiting-for-confirmation' : 'executing'))"
      - set:
          state.invocations: "= merge(state.invocations, {input.call_id: {'tool_id': input.tool_id, 'state': vars.st, 'confirmed_by': has(vars.prev.confirmed_by) ? vars.prev.confirmed_by : input.auto_confirmed}})"
      - {return: {state: "= vars.st"}}
  - component: chat-tool-invocation
    name: await-confirmation
    kind: function
    summary: "IChatToolInvocation.awaitConfirmation: resolves at once if already confirmed or denied, else waits for the user."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1062-1086"]
    request: {type: object, properties: {call_id: {type: string}}}
    response: {type: object, properties: {kind: {type: string}}}
    behavior:
      - set: {vars.inv: "= state.invocations[input.call_id]"}
      - title: Already decided
        source: "src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1063-1066"
        if: "vars.inv.state in ['confirmed', 'skipped', 'denied']"
        then:
          - return: {kind: "= vars.inv.state == 'confirmed' ? (vars.inv.confirmed_by != '' ? vars.inv.confirmed_by : 'user-action') : vars.inv.state"}
      - title: The user answers the confirmation widget
        source: "src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1076-1082"
        choice: user_confirmation
        default: allow
        options:
          allow:
            - {set: {state.invocations: "= merge(state.invocations, {input.call_id: merge(vars.inv, {'state': 'confirmed', 'confirmed_by': 'user-action'})})"}}
            - {return: {kind: user-action}}
          skip:
            - {set: {state.invocations: "= merge(state.invocations, {input.call_id: merge(vars.inv, {'state': 'skipped'})})"}}
