  - component: inline-chat-session-service-impl
    name: create-session
    kind: function
    summary: "One session per file: resolves a chat session (no tools) and starts its editing session."
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:86-121"]
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {session_resource: {type: string}}}
    errors: [{code: session-already-exists, status: 0, retryable: false}]
