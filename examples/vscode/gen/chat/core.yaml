          - {return: {outcome: canceled}}
      - set: {vars.slash: "= input.message.startsWith('/') ? input.message.substring(1).split(' ')[0] : ''"}
      - if: "vars.slash != ''"
        then:
          - title: A contributed slash command is handled by the slash command service, not a participant
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2187"
            call: chat-slash-command-service.has-command
            input: {id: "= vars.slash"}
            as: hs
          - if: "vars.hs.value.found"
            then:
              - title: Execute the slash command with the rest of the message
                source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2203-2206"
                call: chat-slash-command-service.execute-command
                input: {id: "= vars.slash", prompt: "= input.message.substring(size(vars.slash) + 1).trim()", session_resource: "= input.session_resource"}
                as: sx
                on_error:
                  - title: A failing slash command becomes the response's errorDetails
                    source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2261-2276"
                    set:
                      state.sessions: "= merge(state.sessions, {input.session_resource: merge(state.sessions[input.session_resource], {'pending': false, 'pending_request_id': '', 'requests': state.sessions[input.session_resource].requests.map(r, r.id == input.request_id ? merge(r, {'response': 'error', 'error_message': error.message}) : r)})})"
                  - {return: {outcome: error}}
              - set: {vars.cur: "= input.session_resource in state.sessions ? state.sessions[input.session_resource] : {}"}
              - title: Silent commands leave no request in the transcript; others record an empty result
                source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2188-2191"
                if: "input.session_resource in state.sessions"
                then:
                  - set:
                      state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.cur, {'pending': false, 'pending_request_id': '', 'requests': vars.hs.value.silent ? vars.cur.requests.filter(r, r.id != input.request_id) : vars.cur.requests.map(r, r.id == input.request_id ? merge(r, {'response': 'success', 'slash_command': vars.slash}) : r)})})"
              - {return: {outcome: slash-command}}
      - title: /troubleshoot is gated by the file-logging setting
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1892-1923"
        if: "!config['chat-agent-debug-log-file-logging-enabled'] && input.message.startsWith('/troubleshoot')"
        then:
          - set:
              state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.sess, {'pending': false, 'pending_request_id': '', 'requests': vars.sess.requests.map(r, r.id == input.request_id ? merge(r, {'response': 'troubleshoot-disabled'}) : r)})})"
          - {return: {outcome: troubleshoot-disabled}}
      - title: Activate the participant's extension
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2138"
        call: extension-service.activate-by-event
        input: {activation_event: "= 'onChatParticipant:' + input.agent_id"}
      - title: Invoke the agent
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2182-2184"
        call: chat-agent-service.invoke-agent
        input: {agent_id: "= input.agent_id", session_resource: "= input.session_resource", request_id: "= input.request_id", message: "= input.message"}
        as: res
        on_error:
          - title: The agent threw; the error becomes the response's errorDetails
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2261-2276"
            set:
              state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.sess, {'pending': false, 'pending_request_id': '', 'requests': vars.sess.requests.map(r, r.id == input.request_id ? merge(r, {'response': 'error', 'error_message': error.message}) : r)})})"
          - {return: {outcome: error}}
      - set:
          vars.outcome: "= vars.res.value.result"
      - title: Record the response (success, error or filtered) and free the session
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2225-2240"
        set:
          state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.sess, {'pending': false, 'pending_request_id': '', 'yield_requested': false, 'requests': vars.sess.requests.map(r, r.id == input.request_id ? merge(r, {'response': vars.outcome}) : r)})})"
      - title: A rate-limited anonymous user sees the quota-exceeded state
