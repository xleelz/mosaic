  - id: inline-chat-session-resolver
    name: InlineChatSessionResolver
    kind: service
    layer: ai
    parent: inline-chat
    sources:
      - "src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionResolver.ts:51-95"
      - "src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionResolver.ts:16"
      - "src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:31"
    summary: "Picks the chat session backing an inline chat: the agent host when enabled, else a new local session."
    attributes: {owner: chat}

configs:
  - id: chat-tools-global-auto-approve
    type: boolean
    value: false
    default: false
    summary: "chat.tools.global.autoApprove ('YOLO mode'); product.json sets no override, so deployed = default."
    sources: ["src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:832-835"]
    attributes: {key: chat.tools.global.autoApprove}
  - id: chat-tools-eligible-for-auto-approval
    type: object
    value: {}
    default: {}
    summary: "chat.tools.eligibleForAutoApproval: tools set to false always ask; deployed = default."
    sources: ["src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:918-919"]
    attributes: {key: chat.tools.eligibleForAutoApproval}
  - id: chat-editing-confirm-edit-request-removal
    type: boolean
    value: true
    default: true
    summary: "chat.editing.confirmEditRequestRemoval: confirm before removing a request and its edits; deployed = default."
    sources: ["src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:577-581"]
    attributes: {key: chat.editing.confirmEditRequestRemoval}
  - id: chat-inline-chat-agent-host-enabled
    type: boolean
    value: false
    default: false
    summary: "chat.inlineChat.agentHost.enabled: back inline chat with the agent host; deployed = default (experiment-controlled at startup)."
    sources: ["src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:2616-2619"]
    attributes: {key: chat.inlineChat.agentHost.enabled}
  - id: chat-editing-confirm-edit-request-retry
    type: boolean
    value: true
    default: true
    summary: "chat.editing.confirmEditRequestRetry: confirm before retrying a request and undoing its edits; deployed = default."
    sources: ["src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:583-588"]
    attributes: {key: chat.editing.confirmEditRequestRetry}
  - id: chat-agent-debug-log-file-logging-enabled
    type: boolean
    value: false
    default: false
    summary: "The agent debug file-logging flag that gates /troubleshoot; deployed = default."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1894"]
    attributes: {key: AGENT_DEBUG_LOG_FILE_LOGGING_ENABLED_SETTING}
  - {id: files-auto-save, type: string, value: "off", default: "off", summary: "files.autoSave (reference; owner files-search-scm)", sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:261-263"], attributes: {boundary: true, owner: files-search-scm, key: files.autoSave}}

interfaces:
  # =============================================================== boundary stubs
  - component: extension-service
    name: activate-by-event
    kind: function
    summary: "Activates extensions registered for an activation event (exthost seam)."
    attributes: {boundary: true, owner: exthost}
    request: {type: object, required: [activation_event], properties: {activation_event: {type: string, examples: ["onChatParticipant:github.copilot.default"]}}}
    response: {type: object, properties: {activated: {type: array, items: {type: string}}}}
  - component: ext-host-chat-agents2
    name: invoke-agent
    kind: rpc
    summary: "ExtHostChatAgentsShape2.$invokeAgent: runs the extension's chat participant handler."
    attributes: {boundary: true, owner: exthost, shape: ExtHostChatAgentsShape2}
    latency_ms: {min: 200, max: 2000}
    request:
      type: object
      properties:
        agent_id: {type: string, examples: [github.copilot.default]}
        session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}
        request_id: {type: string, examples: [request_1]}
        message: {type: string, examples: ["Explain what src/main.ts does"]}
    response: {type: object, properties: {metadata: {type: object}}}
  - component: ext-host-language-models
    name: start-chat-request
    kind: rpc
    summary: "ExtHostLanguageModelsShape.$startChatRequest: asks the extension's language model provider to answer."
    attributes: {boundary: true, owner: exthost, shape: ExtHostLanguageModelsShape}
    latency_ms: {min: 100, max: 1500}
    request:
      type: object
      properties:
        model_id: {type: string, examples: [copilot/gpt-4.1]}
        request_id: {type: integer}
        messages: {type: array, items: {type: object}}
    response: {type: object, properties: {metadata: {type: object}}}
  - component: ext-host-language-model-tools
    name: invoke-tool
    kind: rpc
    summary: "ExtHostLanguageModelToolsShape.$invokeTool: runs an extension-contributed tool."
    attributes: {boundary: true, owner: exthost, shape: ExtHostLanguageModelToolsShape}
    latency_ms: {min: 5, max: 200}
    request:
      type: object
      properties:
        tool_id: {type: string, examples: [copilot_findFiles]}
        call_id: {type: string, examples: [call_1]}
        parameters: {type: object}
    response: {type: object, properties: {content: {type: array, items: {type: object}}}}
  - component: text-file-service
    name: save
    kind: function
    summary: "Saves a text file (files-search-scm seam)."
    attributes: {boundary: true, owner: files-search-scm}
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        options:
          type: object
          properties:
            reason: {type: string, enum: [explicit, auto, focus-change, window-change]}
            force: {type: boolean}
            skip_save_participants: {type: boolean}
    response: {type: object, properties: {resource: {type: string}}}
  - component: file-service
    name: write-file
    kind: function
    summary: "Writes a file through the file service (platform-core seam)."
    attributes: {boundary: true, owner: platform-core}
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/chat.json"]}
        content: {type: string}
    response: {type: object, properties: {resource: {type: string}, mtime: {type: integer}, size: {type: integer}}}
    errors: [{code: file-permission-denied, status: 0, retryable: false}]
  - component: file-service
    name: read-file
    kind: function
    summary: "Reads a file through the file service (platform-core)."
    attributes: {boundary: true, owner: platform-core}
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/chat.json"]}
    response: {type: object, properties: {resource: {type: string}, value: {type: string}}}
    errors: [{code: file-not-found, status: 0, retryable: false}]
  - component: file-service
    name: del
    kind: function
    summary: "Deletes a file through the file service (platform-core)."
    attributes: {boundary: true, owner: platform-core}
    request:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/new.ts"]}
    response: {type: object}
  - component: editor-service
    name: open-editor
    kind: function
    summary: "Opens an editor (workbench-shell seam)."
    attributes: {boundary: true, owner: workbench-shell}
    request:
      type: object
      properties:
        resource: {type: string, examples: ["vscode-chat-editor:///chat-1"]}
        options: {type: object}
    response: {type: object, properties: {opened: {type: boolean}}}

  # =============================================================== chat-service
  - component: chat-service
    name: send-request
    kind: function
    summary: "Accepts a chat request for a session: rejects empty, read-only and busy sessions, queues when asked, else starts the agent request."
    sources:
      - "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1516-1525"
      - "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1527-1663"
    request:
      type: object
      required: [session_resource, message]
      properties:
        session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}
        message: {type: string, examples: ["Explain what src/main.ts does"]}
        location: {type: string, default: panel}
        queue: {type: string, default: "", enum: ["", queued, steering]}
        agent_id_silent: {type: string, default: ""}
        attached_files: {type: array, items: {type: string}, default: []}
        user_selected_model_id: {type: string, default: ""}
    response:
      type: object
      properties:
        kind: {type: string, enum: [sent, queued, rejected]}
        reason: {type: string}
        request_id: {type: string}
        agent_id: {type: string}
    errors: [{code: unknown-session, status: 0, retryable: false}]
    behavior:
      - title: Reject an empty message
        detail: "No text, no explicit file/image attachment, no slash command and no agent id: rejected 'Empty message'."
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1540-1543"
        if: "input.message.trim() == '' && size(input.attached_files) == 0 && input.agent_id_silent == ''"
        then:
          - {return: {kind: rejected, reason: Empty message}}
      - title: Unknown session
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1569-1572"
        if: "!(input.session_resource in state.sessions)"
        then:
          - fail: {code: unknown-session, message: "= 'Unknown session: ' + input.session_resource"}
      - set: {vars.sess: "= state.sessions[input.session_resource]"}
      - title: Read-only or input-blocked session
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1573-1579"
        if: "vars.sess.read_only || vars.sess.input_blocked"
        then:
          - return: {kind: rejected, reason: "= vars.sess.input_blocked ? 'Session input is blocked' : 'Session is read-only'"}
      - title: Queue the request (queued or steering)
        detail: "queuePendingRequest adds a pending request; steering also sets yieldRequested on the running request. Then processPendingRequests runs the queue when nothing is in flight."
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1619-1625"
        if: "input.queue != ''"
        then:
          - set:
              vars.qid: "= 'queued_' + string(size(vars.sess.queued) + 1)"
          - set:
              state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.sess, {'queued': vars.sess.queued + [{'id': vars.qid, 'message': input.message, 'kind': input.queue}], 'yield_requested': vars.sess.yield_requested || input.queue == 'steering'})})"
          - title: Nothing in flight, so the queue is drained now
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2322-2325"
            if: "!vars.sess.pending"
            then:
              - {call: chat-service.process-next-pending-request, input: {session_resource: "= input.session_resource"}}
          - {return: {kind: queued, request_id: "= vars.qid"}}
      - title: A request is already in progress
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1626-1629"
        if: "vars.sess.pending"
        then:
          - {return: {kind: rejected, reason: Request already in progress}}
      - title: Resolve the default agent for the location and mode
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1643-1649"
        call: chat-agent-service.get-default-agent
        input: {location: "= input.location", mode: ask}
        as: def
      - if: "!vars.def.value.found"
        then:
          - title: No default agent
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1646-1649"
