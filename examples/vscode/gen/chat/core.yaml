  - id: chat-editing-actions
    name: Chat editing actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingActions.ts:168"]
    summary: "Keep/Undo commands of the chat editing working set."
    attributes: {owner: chat}

  # ---------------------------------------------------------------- inline chat
  - id: inline-chat-actions
    name: Inline chat actions
    kind: module
    layer: ai
    parent: inline-chat
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChatActions.ts:48"]
    summary: "Start, keep, close and cancel inline chat commands."
    attributes: {owner: chat}
  - id: inline-chat-controller
    name: InlineChatController
    kind: module
    layer: ai
    parent: inline-chat
    sources:
      - "src/vs/workbench/contrib/inlineChat/browser/inlineChatController.ts:146"
      - "src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:20"
