components:
  # ---------------------------------------------------------------- modules
  - id: chat
    name: Chat contribution
    kind: module
    layer: ai
    parent: workbench
    sources: ["src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3472"]
    summary: "Chat in the workbench window: chat service, participants, language models, tools, editing sessions and their commands."
    attributes: {owner: chat}
  - id: inline-chat
    name: Inline chat contribution
    kind: module
    layer: ai
    parent: workbench
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:20"]
    summary: "Editor inline chat: the InlineChatController editor contribution, its session service and actions."
    attributes: {owner: chat}

  # ---------------------------------------------------------------- core services
  - id: chat-service
    name: ChatService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:218"
      - "src/vs/workbench/contrib/chat/common/chatService/chatService.ts:2156"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3472"
    summary: "Owns chat session models, the per-session pending request and the queue of pending (queued/steering) requests; sends requests to participants."
    capacity: {concurrency: 1}
    attributes: {owner: chat}
    state:
      schema:
        type: object
        properties:
          sessions: {type: object}
      initial:
        sessions:
          "vscode-chat-session://local/s1": {location: panel, requests: [], pending: false, pending_request_id: "", queued: [], read_only: false, input_blocked: false, yield_requested: false}
  - id: chat-agent-service
    name: ChatAgentService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:296"
      - "src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:234"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3490"
    summary: "Registry of chat participants (agents) and their implementations; picks the default agent and invokes agents."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {agents: {type: object}}}
      initial:
        agents:
          github.copilot.default: {extension: GitHub.copilot-chat, is_default: true, locations: [panel, editor, terminal, notebook], modes: [ask, edit, agent], has_impl: true}
  - id: chat-widget-service
    name: ChatWidgetService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/browser/widget/chatWidgetService.ts:24"
      - "src/vs/workbench/contrib/chat/browser/chat.ts:118"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3473"
    summary: "Tracks chat widgets (view, editor, quick chat) and opens a session in the chat view or an editor."
    attributes: {owner: chat}
  - id: chat-widget
    name: ChatWidget
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:335"]
    summary: "The chat view's widget: its current session (view model), the input text and the request being edited."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {session_resource: {type: string}, input: {type: string}, editing_request_id: {type: string}, attachments: {type: array}, mode: {type: string}, model_id: {type: string}, open_picker: {type: string}}}
      initial: {session_resource: "vscode-chat-session://local/s1", input: "", editing_request_id: "", attachments: [], mode: agent, model_id: copilot/gpt-4.1, open_picker: ""}
  - id: chat-widget-history-service
    name: ChatWidgetHistoryService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/common/widget/chatWidgetHistoryService.ts:55"
      - "src/vs/workbench/contrib/chat/common/widget/chatWidgetHistoryService.ts:35"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3485"
    summary: "Input history per chat location (workspace memento), capped at 40 entries."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {history: {type: object}}}
      initial: {history: {}}
  - id: chat-entitlement-service
    name: ChatEntitlementService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/services/chat/common/chatEntitlementService.ts:382"
      - "src/vs/workbench/services/chat/common/chatEntitlementService.ts:78"
      - "src/vs/workbench/services/chat/common/chatEntitlementService.ts:1650"
    summary: "The user's Copilot entitlement (anonymous, free, pro...) and quota state; raises the quota-exceeded context for anonymous rate limits."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {anonymous: {type: boolean}, quota_exceeded: {type: boolean}}}
      initial: {anonymous: false, quota_exceeded: false}
  - id: language-models-service
    name: LanguageModelsService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/common/languageModels.ts:1220"
      - "src/vs/workbench/contrib/chat/common/languageModels.ts:606"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3487"
    summary: "Language model providers by vendor and the resolved model cache; sends chat requests to the provider of a model."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {models: {type: object}, providers: {type: object}, recently_used: {type: array}}}
      initial:
        models:
          copilot/gpt-4.1: {vendor: copilot, family: gpt-4.1, id: gpt-4.1, version: gpt-4.1-2025-04-14}
          copilot/claude-sonnet-4: {vendor: copilot, family: claude-sonnet-4, id: claude-sonnet-4, version: claude-sonnet-4}
        providers: {copilot: {extension: GitHub.copilot-chat}}
        recently_used: []
  - id: language-model-tools-service
    name: LanguageModelToolsService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:119"
      - "src/vs/workbench/contrib/chat/common/tools/languageModelToolsService.ts:644"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3500"
    summary: "Registered tools and their implementations; invokes a tool after the confirmation and auto-approval gates."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {tools: {type: object}, auto_approve_opted_in: {type: boolean}}}
      initial:
        auto_approve_opted_in: false
        tools:
          vscode_fetchWebPage_internal: {source: internal, has_impl: true, needs_confirmation: true, reference_name: fetch}
          manage_todo_list: {source: internal, has_impl: true, needs_confirmation: false, reference_name: todos}
          vscode_get_confirmation_with_options: {source: internal, has_impl: true, needs_confirmation: true, reference_name: confirmationWithOptions}
          copilot_findFiles: {source: extension, extension: GitHub.copilot-chat, has_impl: false, needs_confirmation: false, reference_name: fileSearch}
  - id: language-model-tools-confirmation-service
    name: LanguageModelToolsConfirmationService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/browser/tools/languageModelToolsConfirmationService.ts:221"
      - "src/vs/workbench/contrib/chat/common/tools/languageModelToolsConfirmationService.ts:137"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3502"
    summary: "Remembered 'always allow' tool approvals by scope (session memory, workspace and profile storage 'chat/autoconfirm')."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {pre_confirmed: {type: object}}}
      initial: {pre_confirmed: {}}
  - id: chat-tool-invocation
    name: ChatToolInvocation
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/common/model/chatProgressTypes/chatToolInvocation.ts:23"]
    summary: "Tool invocation parts in chat responses, by call id, with their confirmation state."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {invocations: {type: object}}}
      initial: {invocations: {}}
  - id: chat-editing-service
    name: ChatEditingService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingServiceImpl.ts:49"
      - "src/vs/workbench/contrib/chat/common/editing/chatEditingService.ts:27"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3509"
    summary: "Creates and looks up the editing session of a chat session."
    attributes: {owner: chat}
  - id: chat-editing-session
    name: ChatEditingSession
    kind: module
    layer: ai
    parent: chat-editing-service
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:152"]
    summary: "Files modified by chat in one chat session, each Modified, Accepted or Rejected, plus request checkpoints."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {sessions: {type: object}}}
      initial: {sessions: {}}
  - id: chat-editing-modified-document-entry
    name: ChatEditingModifiedDocumentEntry
    kind: module
    layer: ai
    parent: chat-editing-session
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingModifiedDocumentEntry.ts:279-318"]
    summary: "One text document modified by chat: keeping saves it, undoing reverts or deletes it."
    attributes: {owner: chat}

  # ---------------------------------------------------------------- action files (command registrants)
  - id: chat-execute-actions
    name: Chat execute actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:56"]
    summary: "Submit, cancel and send-to-new-chat commands of the chat input."
    attributes: {owner: chat}
  - id: chat-queue-actions
    name: Chat queue actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatQueueActions.ts:63"]
    summary: "Queue, steer and pending-request commands."
    attributes: {owner: chat}
  - id: chat-new-actions
    name: Chat new-session actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatNewActions.ts:68"]
    summary: "New Chat commands."
    attributes: {owner: chat}
  - id: chat-actions
    name: Chat actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatActions.ts:589"]
    summary: "General chat commands (open, clear input history, reset tool confirmations, ...)."
    attributes: {owner: chat}
  - id: chat-tool-actions
    name: Chat tool actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatToolActions.ts:50"]
    summary: "Accept and skip tool confirmation commands."
    attributes: {owner: chat}
  - id: chat-import-export
