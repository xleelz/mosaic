                choice: global_auto_approve_opt_in
                default: enable
                options:
                  enable:
                    - {set: {state.auto_approve_opted_in: true}}
                  decline:
                    - {return: {reason: ""}}
          - {return: {reason: setting}}
      - {return: {reason: ""}}

  - component: language-model-tools-confirmation-service
