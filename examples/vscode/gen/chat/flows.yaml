    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {pending: false, requests: [{id: request_1, message: "x", agent_id: github.copilot.default, response: canceled}]}}}
    steps:
      - interface: chat-service.run-request
