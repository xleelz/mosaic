flows:
  - id: chat-submit
    name: Submit the chat input
    description: "workbench.action.chat.submit -> ChatWidget.acceptInput -> ChatService.sendRequest -> (async) ChatAgentService.invokeAgent -> ExtHostChatAgents2.$invokeAgent on the window's extension host."
    entry: {caller: user, interface: chat-execute-actions.cmd-workbench-action-chat-submit, input: {input_value: "Explain what src/main.ts does"}}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:1203"]
    tags: [writes]
  - id: chat-edits-submit
    name: Submit from the editing-session toolbar
    entry: {caller: user, interface: chat-execute-actions.cmd-workbench-action-edits-submit, input: {input_value: "Rename add to sum in src/util.ts"}}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:1204"]
    tags: [writes]
  - id: chat-cancel
    name: Cancel the in-flight chat request
    entry: {caller: user, interface: chat-execute-actions.cmd-workbench-action-chat-cancel}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:1206"]
    tags: [writes]
  - id: chat-send-to-new-chat
    name: Send the input to a new chat
    entry: {caller: user, interface: chat-execute-actions.cmd-workbench-action-chat-sendtonewchat}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:1207"]
    tags: [writes]
  - id: chat-queue-message
    name: Queue a message behind the running request
    entry: {caller: user, interface: chat-queue-actions.cmd-workbench-action-chat-queuemessage}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatQueueActions.ts:375"]
    tags: [writes]
  - id: chat-steer-with-message
    name: Steer the running request
    entry: {caller: user, interface: chat-queue-actions.cmd-workbench-action-chat-steerwithmessage}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatQueueActions.ts:376"]
    tags: [writes]
  - id: chat-remove-pending-request
    name: Remove a queued request
    entry: {caller: user, interface: chat-queue-actions.cmd-workbench-action-chat-removependingrequest, input: {session_resource: "vscode-chat-session://local/s1", pending_request_id: queued_1}}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatQueueActions.ts:378"]
    tags: [writes]
  - id: chat-remove-all-pending-requests
    name: Remove all queued requests
    entry: {caller: user, interface: chat-queue-actions.cmd-workbench-action-chat-removeallpendingrequests}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatQueueActions.ts:381"]
    tags: [writes]
  - id: chat-new-chat
    name: Start a new chat
    entry: {caller: user, interface: chat-new-actions.cmd-workbench-action-chat-newchat}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatNewActions.ts:144"]
    tags: [writes]
  - id: chat-view-model
    name: Read what the chat view shows
    description: "Read path: the widget's session and its requests (ChatWidget view model over ChatService.getSession)."
    entry: {caller: user, interface: chat-widget.get-view-model}
    sources: ["src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:335"]
  - id: chat-read-session
    name: Read a chat session
    entry: {caller: user, interface: chat-service.get-session, input: {session_resource: "vscode-chat-session://local/s1"}}
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:748"]
  - id: chat-clear-input-history
    name: Clear the chat input history
    entry: {caller: user, interface: chat-actions.cmd-workbench-action-chat-clearinputhistory}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatActions.ts:826"]
    tags: [writes]
  - id: chat-input-history
    name: Read the chat input history
    entry: {caller: user, interface: chat-widget-history-service.get-history, input: {location: panel}}
    sources: ["src/vs/workbench/contrib/chat/common/widget/chatWidgetHistoryService.ts:82"]
  - id: lm-tool-invoke
    name: Invoke a language model tool
    description: "Reached from vscode.lm.invokeTool via MainThreadLanguageModelTools.$invokeTool (exthost) or from a participant running in the renderer."
    entry: {caller: third-party-extension, interface: language-model-tools-service.invoke-tool, input: {tool_id: vscode_fetchWebPage_internal, call_id: call_1, session_resource: "vscode-chat-session://local/s1"}}
    sources: ["src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:493"]
    tags: [writes]
  - id: lm-tool-invocation-state
    name: Read a tool invocation's state
    entry: {caller: user, interface: chat-tool-invocation.get-invocation, input: {call_id: call_1}}
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1043"]
  - id: chat-accept-tool
    name: Accept the pending tool confirmation
    entry: {caller: user, interface: chat-tool-actions.cmd-workbench-action-chat-accepttool, input: {call_id: call_1}}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatToolActions.ts:251"]
    tags: [writes]
  - id: chat-skip-tool
    name: Skip the pending tool confirmation
    entry: {caller: user, interface: chat-tool-actions.cmd-workbench-action-chat-skiptool, input: {call_id: call_1}}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatToolActions.ts:252"]
    tags: [writes]
  - id: chat-reset-trusted-tools
    name: Reset tool confirmations
    entry: {caller: user, interface: chat-actions.cmd-workbench-action-chat-resettrustedtools}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatActions.ts:1315"]
    tags: [writes]
  - id: lm-send-chat-request
    name: Send a language model chat request
    description: "Reached from vscode.lm via MainThreadLanguageModels (exthost); the provider runs in the extension host."
    entry: {caller: third-party-extension, interface: language-models-service.send-chat-request, input: {model_id: copilot/gpt-4.1}}
    sources: ["src/vs/workbench/contrib/chat/common/languageModels.ts:1709"]
  - id: lm-select-models
    name: Select language models
    entry: {caller: third-party-extension, interface: language-models-service.select-language-models, input: {vendor: copilot}}
    sources: ["src/vs/workbench/contrib/chat/common/languageModels.ts:1654"]
  - id: chat-editing-accept-all
    name: Keep all chat edits
    entry: {caller: user, interface: chat-editing-actions.cmd-chatediting-acceptallfiles}
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingActions.ts:266"]
    tags: [writes]
  - id: chat-editing-discard-all
    name: Undo all chat edits
    entry: {caller: user, interface: chat-editing-actions.cmd-chatediting-discardallfiles}
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingActions.ts:297"]
    tags: [writes]
  - id: chat-editing-accept-file
    name: Keep one file's chat edits
    entry: {caller: user, interface: chat-editing-actions.cmd-chatediting-acceptfile, input: {uris: ["file:///work/app/src/main.ts"]}}
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingActions.ts:168"]
    tags: [writes]
  - id: chat-editing-discard-file
    name: Undo one file's chat edits
    entry: {caller: user, interface: chat-editing-actions.cmd-chatediting-discardfile, input: {uris: ["file:///work/app/src/main.ts"]}}
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingActions.ts:201"]
    tags: [writes]
  - id: chat-editing-entries
    name: Read a chat editing session's entries
    entry: {caller: user, interface: chat-editing-service.get-editing-session, input: {session_resource: "vscode-chat-session://local/s1"}}
    sources: ["src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingServiceImpl.ts:145"]
  - id: chat-export
    name: Export a chat
    entry: {caller: user, interface: chat-import-export.cmd-workbench-action-chat-export}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatImportExport.ts:39"]
    tags: [writes]
  - id: chat-import
    name: Import a chat
    entry: {caller: user, interface: chat-import-export.cmd-workbench-action-chat-import}
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatImportExport.ts:83"]
    tags: [writes]
  - id: inline-chat-start
    name: Start inline chat
    entry: {caller: user, interface: inline-chat-actions.cmd-inlinechat-start, input: {uri: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:35"]
    tags: [writes]
  - id: inline-chat-keep
    name: Keep inline chat edits
    entry: {caller: user, interface: inline-chat-actions.cmd-inlinechat2-keep, input: {uri: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:22"]
    tags: [writes]
  - id: inline-chat-close
    name: Undo and close inline chat
    entry: {caller: user, interface: inline-chat-actions.cmd-inlinechat2-close, input: {uri: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:23"]
    tags: [writes]
  - id: inline-chat-cancel
    name: Cancel inline chat
    entry: {caller: user, interface: inline-chat-actions.cmd-inlinechat2-cancel, input: {uri: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:24"]
    tags: [writes]
  - id: inline-chat-session-lookup
    name: Look up the inline session of a file
    entry: {caller: user, interface: inline-chat-session-service-impl.get-session-by-text-model, input: {uri: "file:///work/app/src/main.ts"}}
    sources: ["src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:40"]

scenarios:
  # ------------------------------------------------------------------ submit
  - id: chat-submit-happy
    flow: chat-submit
    fixtures: [one-window-folder]
    description: "The user typed into the chat input and pressed Enter (no inputValue context): the text is sent and stored in the input history."
    input: {input_value: ""}
    state:
      "chat-widget@w1": {input: "Explain what src/main.ts does"}
    expect:
      - "result.ok && result.value.accepted && result.value.kind == 'sent'"
      - "calls_by_instance['ext-host-chat-agents2.invoke-agent@eh1'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onChatParticipant:github.copilot.default')"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'success'"
      - "!state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].pending"
      - "state['chat-widget-history-service@w1'].history['copilot'][0].text == 'Explain what src/main.ts does'"
  - id: chat-submit-empty-rejected
    flow: chat-submit
    fixtures: [one-window-folder]
    input: {input_value: "   "}
    expect:
      - "result.ok && !result.value.accepted && result.value.reason == 'Empty message'"
      - "calls['chat-agent-service.invoke-agent'] == 0"
      - "size(state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests) == 0"
  - id: chat-submit-busy-rejected
    flow: chat-submit
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {pending: true, pending_request_id: request_1, requests: [{id: request_1, message: "first", agent_id: github.copilot.default, response: in-progress}]}}}
    expect:
      - "result.ok && !result.value.accepted && result.value.reason == 'Request already in progress'"
      - "calls['chat-service.run-request'] == 0"
      - "size(state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests) == 1"
  - id: chat-submit-no-default-agent
    flow: chat-submit
    fixtures: [one-window-folder]
    state:
      "chat-agent-service@w1": {agents: {github.copilot.default: {has_impl: false}}}
    expect:
      - "result.ok && !result.value.accepted && result.value.reason == 'No default agent available'"
      - "calls['ext-host-chat-agents2.invoke-agent'] == 0"
      - "calls['chat-widget-history-service.append'] == 0"
  - id: chat-submit-read-only-session
    flow: chat-submit
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {read_only: true}}}
    expect:
      - "result.ok && !result.value.accepted && result.value.reason == 'Session is read-only'"
      - "calls['chat-agent-service.get-default-agent'] == 0"
  - id: chat-submit-input-blocked
    flow: chat-submit
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {input_blocked: true}}}
    expect:
      - "result.ok && result.value.reason == 'Session input is blocked'"
  - id: chat-submit-unknown-session
    flow: chat-submit
    fixtures: [one-window-folder]
    state:
      "chat-widget@w1": {session_resource: "vscode-chat-session://local/gone"}
    expect:
      - "!result.ok && result.error.code == 'unknown-session'"
  - id: chat-submit-agent-error
    flow: chat-submit
    fixtures: [one-window-folder]
    choices: {chat-agent-service.invoke-agent.agent_result: error}
    expect:
      - "result.ok && result.value.kind == 'sent'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'error'"
      - "calls['chat-service.process-next-pending-request'] == 0"
  - id: chat-submit-rate-limited-anonymous
    flow: chat-submit
    fixtures: [one-window-folder]
    choices: {chat-agent-service.invoke-agent.agent_result: rate_limited}
    state:
      "chat-entitlement-service@w1": {anonymous: true}
    expect:
      - "state['chat-entitlement-service@w1'].quota_exceeded"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'error'"
  - id: chat-submit-rate-limited-signed-in
    flow: chat-submit
    fixtures: [one-window-folder]
    choices: {chat-agent-service.invoke-agent.agent_result: rate_limited}
    expect:
      - "calls['chat-entitlement-service.mark-anonymous-rate-limited'] == 1"
      - "!state['chat-entitlement-service@w1'].quota_exceeded"
  - id: chat-submit-filtered
    flow: chat-submit
    fixtures: [one-window-folder]
    choices: {chat-agent-service.invoke-agent.agent_result: filtered}
    expect:
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'filtered'"
  - id: chat-submit-agent-not-activated
    flow: chat-submit
    fixtures: [one-window-folder]
    description: "The participant is selected silently (locked agent) but has no implementation: invokeAgent throws and the response carries the error."
    steps:
      - interface: chat-service.send-request
        caller: chat-widget
        as: s
        input: {session_resource: "vscode-chat-session://local/s1", message: "hello", agent_id_silent: vendor.unactivated}
    state:
      "chat-agent-service@w1": {agents: {vendor.unactivated: {extension: vendor.ext, is_default: false, locations: [panel], modes: [ask], has_impl: false}}}
    expect:
      - "steps.s.result.ok && steps.s.result.value.agent_id == 'vendor.unactivated'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'error'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].error_message.contains('No activated agent')"
  - id: chat-submit-troubleshoot-disabled
    flow: chat-submit
    fixtures: [one-window-folder]
    input: {input_value: "/troubleshoot why is the build slow"}
    expect:
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'troubleshoot-disabled'"
      - "calls['chat-agent-service.invoke-agent'] == 0"
  - id: chat-submit-edited-request-confirmed
    flow: chat-submit
    fixtures: [one-window-folder]
    state:
      "chat-widget@w1": {editing_request_id: request_1}
      "chat-editing-session@w1": {sessions: {"vscode-chat-session://local/s1": {entries: {"file:///work/app/src/util.ts": {state: modified, created_in_request: false}}}}}
    expect:
      - "result.ok && result.value.accepted"
      - "calls['chat-editing-session.restore-snapshot'] == 1"
      - "state['chat-editing-session@w1'].sessions['vscode-chat-session://local/s1'].restored_to == 'request_1'"
  - id: chat-submit-edited-request-declined
    flow: chat-submit
    fixtures: [one-window-folder]
    choices: {chat-execute-actions.cmd-workbench-action-chat-submit.confirm_removal: "no"}
    state:
      "chat-widget@w1": {editing_request_id: request_1}
      "chat-editing-session@w1": {sessions: {"vscode-chat-session://local/s1": {entries: {"file:///work/app/src/util.ts": {state: modified, created_in_request: false}}}}}
    expect:
      - "result.ok && !result.value.accepted && result.value.kind == 'canceled'"
      - "calls['chat-service.send-request'] == 0 && calls['chat-editing-session.restore-snapshot'] == 0"
  - id: chat-submit-then-read
    flow: chat-submit
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-submit, as: w, input: {input_value: "Explain what src/main.ts does"}}
      - {flow: chat-view-model, as: r}
    expect:
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'github.copilot.default'"
      - "steps.w.result.ok && steps.w.result.value.kind == 'sent'"
      - "steps.r.result.value.session.requests[0].message == 'Explain what src/main.ts does' && steps.r.result.value.session.requests[0].response == 'success'"
      - "steps.r.result.value.input == ''"
  - id: chat-submit-history-capped
    flow: chat-submit
    fixtures: [one-window-folder]
    state:
      "chat-widget-history-service@w1": {history: {copilot: [{text: h1}, {text: h2}, {text: h3}, {text: h4}, {text: h5}, {text: h6}, {text: h7}, {text: h8}, {text: h9}, {text: h10}, {text: h11}, {text: h12}, {text: h13}, {text: h14}, {text: h15}, {text: h16}, {text: h17}, {text: h18}, {text: h19}, {text: h20}, {text: h21}, {text: h22}, {text: h23}, {text: h24}, {text: h25}, {text: h26}, {text: h27}, {text: h28}, {text: h29}, {text: h30}, {text: h31}, {text: h32}, {text: h33}, {text: h34}, {text: h35}, {text: h36}, {text: h37}, {text: h38}, {text: h39}, {text: h40}]}}
      "chat-widget@w1": {input: "Explain what src/main.ts does"}
    steps:
      - {flow: chat-submit, as: w, input: {input_value: ""}}
      - {flow: chat-input-history, as: r}
    expect:
      - "size(state['chat-widget-history-service@w1'].history['copilot']) == 40"
      - "size(steps.r.result.value.entries) == 40"
      - "steps.r.result.value.entries[0].text == 'h2' && steps.r.result.value.entries[39].text == 'Explain what src/main.ts does'"
  - id: chat-submit-with-model-recently-used
    flow: chat-submit
    fixtures: [one-window-folder]
    steps:
      - interface: chat-service.send-request
        caller: chat-widget
        as: s
        input: {session_resource: "vscode-chat-session://local/s1", message: "hi", user_selected_model_id: copilot/claude-sonnet-4}
    state:
      "language-models-service@w1": {recently_used: [copilot/gpt-4.1]}
    expect:
      - "state['language-models-service@w1'].recently_used == ['copilot/claude-sonnet-4', 'copilot/gpt-4.1']"
  - id: chat-edits-submit-happy
    flow: chat-edits-submit
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-edits-submit, as: w}
      - {flow: chat-view-model, as: r}
    expect:
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'success'"
      - "steps.w.result.value.kind == 'sent'"
      - "steps.r.result.value.session.requests[0].message == 'Rename add to sum in src/util.ts'"

  # ------------------------------------------------------------------ cancel / new chat
  - id: chat-cancel-pending
    flow: chat-cancel
    fixtures: [one-window-folder]
    state:
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {pending: true, pending_request_id: request_1, requests: [{id: request_1, message: "long task", agent_id: github.copilot.default, response: in-progress}]}}}
    steps:
      - {flow: chat-cancel, as: c}
      - {flow: chat-view-model, as: r}
    expect:
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].pending_request_id == ''"
      - "steps.c.result.value.canceled"
      - "!steps.r.result.value.session.pending && steps.r.result.value.session.requests[0].response == 'canceled'"
  - id: chat-cancel-nothing-pending
    flow: chat-cancel
    fixtures: [one-window-folder]
    expect:
      - "result.ok && !result.value.canceled"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests == []"
  - id: chat-send-to-new-chat-happy
    flow: chat-send-to-new-chat
    fixtures: [one-window-folder]
    state:
      "chat-widget@w1": {input: "Write tests for util.ts"}
      "chat-service@w1": {sessions: {"vscode-chat-session://local/s1": {pending: true, pending_request_id: request_1, requests: [{id: request_1, message: "old", agent_id: github.copilot.default, response: in-progress}]}}}
    steps:
      - {flow: chat-send-to-new-chat, as: w}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.w.result.value.kind == 'sent'"
      - "steps.r.result.value.session_resource == 'vscode-chat-session://local/s2'"
      - "steps.r.result.value.session.requests[0].message == 'Write tests for util.ts'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'canceled'"
  - id: chat-send-to-new-chat-empty
    flow: chat-send-to-new-chat
    fixtures: [one-window-folder]
    expect:
      - "result.ok && !result.value.accepted && calls['chat-service.start-new-local-session'] == 0"
      - "state['chat-widget@w1'].session_resource == 'vscode-chat-session://local/s1'"
  - id: chat-new-chat-no-edits
    flow: chat-new-chat
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-new-chat, as: n}
      - {flow: chat-view-model, as: r}
    expect:
      - "state['chat-widget@w1'].session_resource == 'vscode-chat-session://local/s2' && 'vscode-chat-session://local/s1' in state['chat-service@w1'].sessions"
      - "steps.n.result.value.new_session && steps.r.result.value.session_resource == steps.n.result.value.session_resource"
      - "steps.r.result.value.session.requests == []"
  - id: chat-new-chat-keep-edits
    flow: chat-new-chat
    fixtures: [one-window-folder]
    state:
      "chat-editing-session@w1": {sessions: {"vscode-chat-session://local/s1": {entries: {"file:///work/app/src/util.ts": {state: modified, created_in_request: false}}}}}
    expect:
      - "result.value.new_session"
