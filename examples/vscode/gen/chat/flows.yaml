  # ------------------------------------------------------------------ inline chat
  - id: inline-chat-start-then-lookup
    flow: inline-chat-start
    fixtures: [one-window-folder]
    steps:
      - {flow: inline-chat-start, as: s, input: {uri: "file:///work/app/src/main.ts", message: "add a doc comment", auto_send: true}}
      - {flow: inline-chat-session-lookup, as: r}
    expect:
      - "steps.s.result.value.started && steps.r.result.value.found"
      - "steps.r.result.value.session_resource == steps.s.result.value.session_resource"
      - "state['chat-service@w1'].sessions[steps.s.result.value.session_resource].location == 'editor' && !state['chat-service@w1'].sessions[steps.s.result.value.session_resource].can_use_tools"
      - "state['chat-service@w1'].sessions[steps.s.result.value.session_resource].requests[0].message == 'add a doc comment'"
  - id: inline-chat-start-no-autosend
    flow: inline-chat-start
    fixtures: [one-window-folder]
    input: {message: "explain"}
    expect:
      - "result.value.started && calls['chat-service.send-request'] == 0"
      - "'file:///work/app/src/main.ts' in state['inline-chat-session-service-impl@w1'].sessions"
  - id: inline-chat-restart-keeps-previous
    flow: inline-chat-start
    fixtures: [one-window-folder]
