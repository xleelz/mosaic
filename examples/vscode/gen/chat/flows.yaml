    steps:
      - interface: chat-service.send-request
        caller: chat-widget
        as: q
        input: {session_resource: "vscode-chat-session://local/s1", message: "queued while idle", queue: queued}
    expect:
      - "steps.q.result.value.kind == 'queued'"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].queued == []"
      - "state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].message == 'queued while idle'"
