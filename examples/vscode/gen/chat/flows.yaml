  # ------------------------------------------------------------------ import / export
  - id: chat-export-then-import
    flow: chat-export
    fixtures: [one-window-folder]
    steps:
      - {flow: chat-export, as: e}
      - {flow: chat-import, as: i, input: {input_path: "file:///work/app/chat.json", target: chatViewPane}}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.e.result.value.written && steps.e.result.value.resource == 'file:///work/app/chat.json'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'file-service.write-file' && e.input.resource == 'file:///work/app/chat.json')"
      - "steps.i.result.value.imported && steps.r.result.value.session_resource == steps.i.result.value.session_resource"
      - "steps.r.result.value.session.imported"
  - id: chat-export-dialog-cancelled
    flow: chat-export
    fixtures: [one-window-folder]
    choices: {chat-import-export.cmd-workbench-action-chat-export.save_dialog: cancel}
    expect:
      - "!result.value.written && calls['file-service.write-file'] == 0"
  - id: chat-export-write-denied
    flow: chat-export
    fixtures: [one-window-folder]
    input: {output_path: "file:///readonly/chat.json"}
