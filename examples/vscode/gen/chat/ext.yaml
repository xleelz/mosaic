  - component: chat-title-actions
    name: cmd-workbench-action-chat-retry
    kind: function
    attributes: {command: workbench.action.chat.retry}
    summary: "Retries a response's request; in Edit/Agent mode it first asks (chat.editing.confirmEditRequestRetry) and restores the checkpoint."
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:168-262"]
    request: {type: object, properties: {request_id: {type: string, default: ""}}}
    behavior:
      - call: chat-widget.get-view-model
        as: vm
      - if: "input.request_id == '' || !has(vars.vm.value.session.requests) || !vars.vm.value.session.requests.exists(r, r.id == input.request_id)"
        then:
          - title: Not a response of this session
            source: "src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:200-208"
            return: {retried: false}
      - title: Edit and Agent mode undo the request's edits first
        source: "src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:212-250"
        if: "vars.vm.value.mode in ['edit', 'agent']"
        then:
          - call: chat-editing-session.get-entries
            input: {session_resource: "= vars.vm.value.session_resource"}
            as: ents
          - if: "vars.ents.value.entries.exists(u, vars.ents.value.entries[u].state == 'modified') && config['chat-editing-confirm-edit-request-retry']"
            then:
              - title: Ask before undoing the edits
                source: "src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:224-236"
                choice: confirm_retry
                default: "yes"
                options:
                  "yes": []
                  "no":
                    - {return: {retried: false}}
          - title: Reset the snapshot to the request's first stop
            source: "src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:246-249"
            call: chat-editing-session.restore-snapshot
            input: {session_resource: "= vars.vm.value.session_resource", request_id: "= input.request_id"}
      - title: Resend with the next attempt number
        source: "src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:254-258"
        call: chat-service.resend-request
        input: {session_resource: "= vars.vm.value.session_resource", request_id: "= input.request_id", attempt: 1}
        as: rs
      - {return: {retried: "= vars.rs.value.resent"}}

