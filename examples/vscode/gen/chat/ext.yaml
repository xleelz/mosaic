components:
  - id: chat-title-actions
    name: Chat response title actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:33"]
    summary: "Helpful/unhelpful votes and Retry on chat responses."
    attributes: {owner: chat}
  - id: chat-context-actions
    name: Chat attach-context actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:59"]
    summary: "Attach files, folders, the selection, search results and pinned editors to the chat input."
    attributes: {owner: chat}
  - id: chat-slash-command-service
    name: ChatSlashCommandService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/common/participants/chatSlashCommands.ts:107"
      - "src/vs/workbench/contrib/chat/common/participants/chatSlashCommands.ts:91"
      - "src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3489"
    summary: "Registered built-in slash commands (/clear, /rename, /models ...) and their callbacks."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {commands: {type: object}}}
      initial: {commands: {}}
  - id: agent-sessions-service
    name: AgentSessionsService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsService.ts:23"
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsService.ts:58"
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessions.contribution.ts:205"
    summary: "The agent sessions model: every chat session (local and contributed) with its read, pinned and archived state."
    attributes: {owner: chat}
    state:
      schema: {type: object, properties: {sessions: {type: object}}}
      initial: {sessions: {}}
  - id: agent-sessions-actions
    name: Agent sessions actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsActions.ts:415"]
    summary: "Commands on agent sessions in the sessions viewer: read state, pin, rename, delete, clear history, refresh."
    attributes: {owner: chat}

fixtures:
  - id: chat-seed
    summary: "chat initial state: the chat view's local session s1 (known to the agent sessions model, read), the Copilot default participant, the copilot language models, the built-in tools, the built-in slash commands, and this area's commands in the command registry."
    state:
      chat-service:
        sessions:
          "vscode-chat-session://local/s1": {location: panel, requests: [], pending: false, pending_request_id: "", queued: [], read_only: false, input_blocked: false, yield_requested: false, title: ""}
      agent-sessions-service:
        sessions:
          "vscode-chat-session://local/s1": {label: "New Chat", type: local, read: true, pinned: false, archived: false, status: completed}
      chat-slash-command-service:
        commands:
          clear: {silent: false, locations: [panel], handler: clear}
          rename: {silent: true, locations: [panel], handler: rename}
          models: {silent: true, locations: [panel], handler: command, command_id: workbench.action.chat.openModelPicker}
    # commands-registry rows are added by build.py from every modeled cmd-* interface

interfaces:
  # ------------------------------------------------------------------ boundary seam
  - component: command-service
    name: execute-command
    kind: function
    summary: "Executes a registered command (platform-core seam)."
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [command_id], properties: {command_id: {type: string, examples: [noop]}, args: {type: array, items: {}, default: []}}}
    errors: [{code: command-not-found, status: 0, retryable: false}]

  # ------------------------------------------------------------------ chat-service additions
  - component: chat-service
    name: resend-request
    kind: function
    summary: "Retries a request: cancels the in-flight one, removes the request and sends its message again."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1433-1477"]
    request: {type: object, required: [session_resource, request_id], properties: {session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}, request_id: {type: string, examples: [request_1]}, attempt: {type: integer, default: 1}}}
    errors: [{code: unknown-session, status: 0, retryable: false}]
    behavior:
      - title: Unknown session
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1441-1444"
        if: "!(input.session_resource in state.sessions)"
        then:
          - fail: {code: unknown-session, message: "= 'Unknown session: ' + input.session_resource"}
      - set: {vars.sess: "= state.sessions[input.session_resource]"}
      - title: Read-only or blocked sessions are not retried
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1445-1447"
        if: "vars.sess.read_only || vars.sess.input_blocked"
        then: [{return: {resent: false}}]
      - set: {vars.req: "= vars.sess.requests.filter(r, r.id == input.request_id)"}
      - if: "size(vars.req) == 0"
        then:
          - title: Request no longer in the session
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1467-1468"
            return: {resent: false}
      - set: {vars.agent: "= vars.req[0].agent_id", vars.message: "= vars.req[0].message", vars.rid: "= 'request_' + string(size(vars.sess.requests) + 1)"}
      - title: Cancel a pending request, remove the old request and start a new attempt
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1449-1476"
        set:
          state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.sess, {'pending': true, 'pending_request_id': vars.rid, 'requests': vars.sess.requests.filter(r, r.id != input.request_id).map(r, r.response == 'in-progress' ? merge(r, {'response': 'canceled'}) : r) + [{'id': vars.rid, 'message': vars.message, 'agent_id': vars.agent, 'response': 'in-progress', 'attempt': input.attempt}]})})"
      - emit: chat-service.run-request
        input: {session_resource: "= input.session_resource", request_id: "= vars.rid", agent_id: "= vars.agent", message: "= vars.message"}
      - {return: {resent: true, request_id: "= vars.rid"}}
  - component: chat-service
    name: send-pending-request-immediately
    kind: function
    summary: "Moves a queued request to the front, cancels the running request and drains the queue."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2789-2839"]
    request: {type: object, required: [session_resource, request_id], properties: {session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}, request_id: {type: string, examples: [queued_2]}}}
    behavior:
      - title: Unknown or blocked session
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2790-2793"
        if: "!(input.session_resource in state.sessions) || state.sessions[input.session_resource].input_blocked"
        then: [{return: {sent: false}}]
      - set: {vars.sess: "= state.sessions[input.session_resource]"}
      - set: {vars.target: "= vars.sess.queued.filter(q, q.id == input.request_id)"}
      - title: Not in the queue
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2796-2799"
        if: "size(vars.target) == 0"
        then: [{return: {sent: false}}]
      - title: Reorder the target to the front of the queue
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2832-2836"
        set:
          state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.sess, {'queued': vars.target + vars.sess.queued.filter(q, q.id != input.request_id)})})"
      - title: Cancel the running request
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2837"
        call: chat-service.cancel-current-request-for-session
        input: {session_resource: "= input.session_resource", source: queueRunNext}
      - title: Let the queue processor send it
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2838"
        call: chat-service.process-next-pending-request
        input: {session_resource: "= input.session_resource"}
      - {return: {sent: true}}
  - component: chat-service
    name: set-chat-session-title
    kind: function
    summary: "Sets a session's custom title (model and stored session)."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:504-520"]
    request: {type: object, required: [session_resource, title], properties: {session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}, title: {type: string, examples: [Refactor util]}}}
    behavior:
      - if: "input.session_resource in state.sessions"
        then:
          - title: model.setCustomTitle(title)
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:505-508"
            set:
              state.sessions: "= merge(state.sessions, {input.session_resource: {'title': input.title}})"
      - title: The agent sessions model shows the new label
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:510-520"
        publish: chat-service.on-did-change-title
        input: {session_resource: "= input.session_resource", title: "= input.title"}
        delivery: sync
      - {return: {title: "= input.title"}}
  - component: chat-service
    name: remove-history-entry
    kind: function
    summary: "Deletes a stored local session and marks its model deleted; fires onDidDisposeSession."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:634-641"]
    request: {type: object, required: [session_resource], properties: {session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}}}
    behavior:
      - title: Delete from storage and mark the model deleted
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:635-639"
        set:
          state.sessions: "= omit(state.sessions, input.session_resource)"
      - title: onDidDisposeSession(cleared)
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:640"
        publish: chat-service.on-did-dispose-session
        input: {session_resources: ["= input.session_resource"], reason: cleared}
        delivery: sync
      - {return: {removed: true}}
  - component: chat-service
    name: clear-all-history-entries
    kind: function
    summary: "Deletes every stored local session."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:643-645"]
    request: {type: object}
    behavior:
      - set: {vars.idle: "= state.sessions.filter(k, !state.sessions[k].pending)"}
      - title: Clear the session store
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:644"
        set:
          state.sessions: "= state.sessions.transformMap(k, v, k in vars.idle ? merge(v, {'requests': []}) : v)"
      - publish: chat-service.on-did-dispose-session
        input: {session_resources: "= vars.idle", reason: cleared}
        delivery: sync
      - {return: {cleared: "= size(vars.idle)"}}
  - component: chat-service
    name: notify-user-action
    kind: function
    summary: "Records a user action (vote, copy, insert ...) on a response and forwards it to the participant."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:489-492"]
    request: {type: object, properties: {session_resource: {type: string}, request_id: {type: string}, kind: {type: string}, direction: {type: string}}}
    behavior:
      - if: "input.session_resource in state.sessions"
        then:
          - title: The response's vote is stored on the request
            source: "src/vs/workbench/contrib/chat/browser/actions/chatTitleActions.ts:76"
            set:
              state.sessions: "= merge(state.sessions, {input.session_resource: {'requests': state.sessions[input.session_resource].requests.map(r, r.id == input.request_id ? merge(r, {'vote': input.direction}) : r)}})"
      - {return: {notified: true}}
  - component: chat-service
    name: on-did-change-title
    kind: event
    summary: "Topic: a session's title changed."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:510"]
    request: {type: object, properties: {session_resource: {type: string}, title: {type: string}}}
  - component: chat-service
    name: on-did-dispose-session
    kind: event
    summary: "Topic: sessions were disposed or cleared (onDidDisposeSession)."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:640"]
    request: {type: object, properties: {session_resources: {type: array, items: {type: string}}, reason: {type: string}}}

  # ------------------------------------------------------------------ slash commands
  - component: chat-slash-command-service
    name: register-slash-command
    kind: function
    summary: "Registers a slash command; a second registration of the same id throws."
    sources: ["src/vs/workbench/contrib/chat/common/participants/chatSlashCommands.ts:141-153"]
    request: {type: object, required: [command], properties: {command: {type: string, examples: [clear]}, silent: {type: boolean, default: false}, handler: {type: string, default: command}, command_id: {type: string, default: ""}}}
    errors: [{code: already-registered, status: 0, retryable: false}]
    behavior:
      - title: Already registered
        source: "src/vs/workbench/contrib/chat/common/participants/chatSlashCommands.ts:143-145"
        if: "input.command in state.commands"
        then:
          - fail: {code: already-registered, message: "= 'Already registered a command with id ' + input.command"}
      - set:
          state.commands: "= merge(state.commands, {input.command: {'silent': input.silent, 'locations': ['panel'], 'handler': input.handler, 'command_id': input.command_id}})"
      - {return: {registered: true}}
  - component: chat-slash-command-service
    name: has-command
    kind: function
    summary: "Whether a slash command id is registered."
    sources: ["src/vs/workbench/contrib/chat/common/participants/chatSlashCommands.ts:179-181"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [clear]}}}
    response: {type: object, properties: {found: {type: boolean}, silent: {type: boolean}}}
    behavior:
      - if: "!(input.id in state.commands)"
        then: [{return: {found: false, silent: false}}]
      - {return: {found: true, silent: "= state.commands[input.id].silent"}}
  - component: chat-slash-command-service
    name: execute-command
    kind: function
    summary: "Runs a slash command's callback: /clear archives the session and starts a new chat, /rename renames it, the others run their workbench command."
    sources: ["src/vs/workbench/contrib/chat/common/participants/chatSlashCommands.ts:183-197"]
    request: {type: object, required: [id, session_resource], properties: {id: {type: string, examples: [clear]}, prompt: {type: string, default: ""}, session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}}}
    errors: [{code: slash-command-not-registered, status: 0, retryable: false}]
    behavior:
      - title: Not registered
        source: "src/vs/workbench/contrib/chat/common/participants/chatSlashCommands.ts:184-187"
        if: "!(input.id in state.commands)"
        then:
          - fail: {code: slash-command-not-registered, message: "= 'No command with id ' + input.id + ' NOT registered'"}
      - set: {vars.cmd: "= state.commands[input.id]"}
      - if: "vars.cmd.handler == 'clear'"
        then:
          - title: "/clear archives the current session"
            source: "src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:107"
            call: agent-sessions-service.set-archived
            input: {session_resource: "= input.session_resource", archived: true}
          - title: "... and runs New Chat"
            source: "src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:108"
            call: command-service.execute-command
            input: {command_id: workbench.action.chat.newChat, args: []}
          - {return: {handled: clear}}
      - if: "vars.cmd.handler == 'rename'"
        then:
          - title: "/rename sets the trimmed title when one is given"
            source: "src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:286-289"
            if: "input.prompt.trim() != ''"
            then:
              - call: chat-service.set-chat-session-title
                input: {session_resource: "= input.session_resource", title: "= input.prompt.trim()"}
          - {return: {handled: rename}}
      - title: Other built-in commands run their workbench command
        source: "src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:140"
        call: command-service.execute-command
        input: {command_id: "= vars.cmd.command_id", args: []}
      - {return: {handled: command}}
  - component: chat-slash-commands-contribution
    name: constructor
    kind: function
    summary: "ChatSlashCommandsContribution constructor: registers the built-in slash commands."
    sources: ["src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:53-110"]
    request: {type: object}
    behavior:
      - title: Register /clear (archive and start a new chat)
        source: "src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:98-110"
        call: chat-slash-command-service.register-slash-command
        input: {command: clear, silent: false, handler: clear}
        on_error: continue
      - title: Register /models (opens the model picker)
        source: "src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:132-141"
        call: chat-slash-command-service.register-slash-command
        input: {command: models, silent: true, handler: command, command_id: workbench.action.chat.openModelPicker}
        on_error: continue
      - title: Register /rename (local sessions)
        source: "src/vs/workbench/contrib/chat/browser/chatSlashCommands.ts:278-290"
        call: chat-slash-command-service.register-slash-command
        input: {command: rename, silent: true, handler: rename}
        on_error: continue
      - {return: {registered: 3}}

  # ------------------------------------------------------------------ agent sessions
  - component: agent-sessions-service
    name: get-session
    kind: function
    summary: "The agent session for a resource, if the model knows it."
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsService.ts:53-55"]
    request: {type: object, required: [session_resource], properties: {session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}}}
    response: {type: object, properties: {found: {type: boolean}, session: {type: object}}}
    behavior:
      - if: "!(input.session_resource in state.sessions)"
        then: [{return: {found: false}}]
      - {return: {found: true, session: "= state.sessions[input.session_resource]"}}
  - component: agent-sessions-service
    name: set-read
    kind: function
    summary: "Sets a session's read state."
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsModel.ts:1043"]
    request: {type: object, required: [session_resource, read], properties: {session_resource: {type: string}, read: {type: boolean}}}
    behavior:
      - if: "input.session_resource in state.sessions"
        then:
          - set: {state.sessions: "= merge(state.sessions, {input.session_resource: {'read': input.read}})"}
  - component: agent-sessions-service
    name: set-pinned
    kind: function
    summary: "Pins or unpins a session."
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsModel.ts:962"]
    request: {type: object, required: [session_resource, pinned], properties: {session_resource: {type: string}, pinned: {type: boolean}}}
    behavior:
      - if: "input.session_resource in state.sessions"
        then:
          - set: {state.sessions: "= merge(state.sessions, {input.session_resource: {'pinned': input.pinned}})"}
  - component: agent-sessions-service
    name: set-archived
    kind: function
    summary: "Archives a session (archiving also marks it read)."
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsModel.ts:933-936"]
    request: {type: object, required: [session_resource, archived], properties: {session_resource: {type: string}, archived: {type: boolean}}}
    behavior:
      - if: "input.session_resource in state.sessions"
        then:
          - set: {state.sessions: "= merge(state.sessions, {input.session_resource: {'archived': input.archived, 'read': input.archived ? true : state.sessions[input.session_resource].read}})"}
  - component: agent-sessions-service
    name: on-session-title-changed
    kind: event
    summary: "The local sessions controller relabels the session when its chat title changes."
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/localAgentSessionsController.ts:130"]
    subscribe: [chat-service.on-did-change-title]
    request: {type: object, properties: {session_resource: {type: string}, title: {type: string}}}
    behavior:
      - if: "input.session_resource in state.sessions"
        then:
          - set: {state.sessions: "= merge(state.sessions, {input.session_resource: {'label': input.title}})"}
  - component: agent-sessions-service
    name: on-session-disposed
    kind: event
    summary: "The local sessions controller drops disposed local sessions from the model."
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/localAgentSessionsController.ts:134-140"]
    subscribe: [chat-service.on-did-dispose-session]
    request: {type: object, properties: {session_resources: {type: array, items: {type: string}}, reason: {type: string}}}
    behavior:
      - title: Disposed local sessions leave the model
        source: "src/vs/workbench/contrib/chat/browser/agentSessions/localAgentSessionsController.ts:134-140"
        set: {state.sessions: "= state.sessions.transformMap(k, v, !(k in input.session_resources), v)"}

  - component: agent-sessions-actions
    name: cmd-workbench-action-chat-markallagentsessionsread
    kind: function
    attributes: {command: workbench.action.chat.markAllAgentSessionsRead}
    summary: "Marks every non-archived unread session read."
    sources:
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessions.contribution.ts:30"
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsActions.ts:203-213"
    request: {type: object}
    behavior:
      - call: agent-sessions-service.list-sessions
        as: all
      - set: {vars.todo: "= vars.all.value.sessions.filter(k, !vars.all.value.sessions[k].archived && !vars.all.value.sessions[k].read)"}
      - title: Nothing unread
        source: "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsActions.ts:207-209"
        if: "size(vars.todo) == 0"
        then: [{return: {marked: 0}}]
      - foreach: "= vars.todo"
        as: s
        steps:
          - {call: agent-sessions-service.set-read, input: {session_resource: "= vars.s", read: true}}
      - {return: {marked: "= size(vars.todo)"}}
  - component: agent-sessions-service
    name: list-sessions
    kind: function
    summary: "agentSessionsService.model.sessions."
    sources: ["src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsService.ts:30"]
    request: {type: object}
    response: {type: object, properties: {sessions: {type: object}}}
    behavior:
      - {return: {sessions: "= state.sessions"}}
  - component: agent-sessions-actions
    name: cmd-agentsession-markunread
    kind: function
    attributes: {command: agentSession.markUnread}
    summary: "Marks the given (or focused) sessions unread."
    sources:
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessions.contribution.ts:55"
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsActions.ts:479-484"
    request: {type: object, properties: {session_resource: {type: string, default: ""}}}
    behavior:
      - call: agent-sessions-actions.resolve-sessions
        input: {session_resource: "= input.session_resource"}
        as: r
      - foreach: "= vars.r.value.sessions"
        as: s
        steps:
          - {call: agent-sessions-service.set-read, input: {session_resource: "= vars.s", read: false}}
      - {return: {count: "= size(vars.r.value.sessions)"}}
  - component: agent-sessions-actions
    name: cmd-agentsession-markread
    kind: function
    attributes: {command: agentSession.markRead}
    summary: "Marks the given (or focused) sessions read."
    sources:
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessions.contribution.ts:56"
      - "src/vs/workbench/contrib/chat/browser/agentSessions/agentSessionsActions.ts:512-517"
    request: {type: object, properties: {session_resource: {type: string, default: ""}}}
    behavior:
      - call: agent-sessions-actions.resolve-sessions
        input: {session_resource: "= input.session_resource"}
        as: r
      - foreach: "= vars.r.value.sessions"
        as: s
        steps:
