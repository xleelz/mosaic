  - component: chat-context-actions
    name: cmd-workbench-action-chat-attachpinnededitors
    kind: function
    attributes: {command: workbench.action.chat.attachPinnedEditors}
    summary: "Attaches the files of the editors open in every group."
    sources:
      - "src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:66"
      - "src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:266-295"
    request: {type: object}
    behavior:
      - title: Collect the pinned editors of every group
        source: "src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:275-285"
        call: editor-groups.get-state
        as: g
      - set: {vars.files: "= vars.g.value.groups.map(gr, has(gr.editors) ? gr.editors.filter(e, !has(gr.preview) || gr.preview != e) : []).flatten()"}
      - title: Nothing pinned
        source: "src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:287-289"
        if: "size(vars.files) == 0"
        then: [{return: {added: 0}}]
      - call: chat-widget.add-attachments
        input: {resources: "= vars.files", kind: file, range: ""}
        as: a
      - {return: "= vars.a.value"}
  - component: chat-context-actions
    name: cmd-workbench-action-chat-attachcontext
    kind: function
    attributes: {command: workbench.action.chat.attachContext}
    summary: "Opens the context quick pick and attaches the picked item."
