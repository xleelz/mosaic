    kind: function
    attributes: {command: workbench.action.chat.toggleAgentMode}
    summary: "Switches to the next chat mode (Edit only while the session is empty), confirming when leaving or entering Edit ends the editing session."
    sources:
      - "src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:1209"
      - "src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:280-334"
    request: {type: object, properties: {mode_id: {type: string, default: ""}}}
    behavior:
      - call: chat-widget.get-view-model
        as: vm
      - set: {vars.count: "= has(vars.vm.value.session.requests) ? size(vars.vm.value.session.requests) : 0"}
      - set: {vars.flat: "= vars.count == 0 ? ['ask', 'edit', 'agent'] : ['ask', 'agent']"}
      - set: {vars.idx: "= vars.flat.exists(m, m == vars.vm.value.mode) ? (vars.vm.value.mode == 'ask' ? 0 : (vars.vm.value.mode == 'edit' ? 1 : size(vars.flat) - 1)) : -1"}
      - set: {vars.next: "= input.mode_id != '' ? input.mode_id : vars.flat[(vars.idx + 1) % size(vars.flat)]"}
      - title: Already in that mode
        source: "src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:305-307"
        if: "vars.next == vars.vm.value.mode"
        then: [{return: {mode: "= vars.next", changed: false}}]
      - set: {vars.clear: false}
      - title: Switching into or out of Edit with requests ends the edit session
        source: "src/vs/workbench/contrib/chat/browser/actions/chatActions.ts:1752-1783"
        if: "(vars.vm.value.mode == 'edit' || vars.next == 'edit') && vars.count > 0"
        then:
          - choice: confirm_mode_switch
            default: "yes"
            options:
              "yes":
                - {set: {vars.clear: true}}
              "no":
                - {return: {mode: "= vars.vm.value.mode", changed: false}}
      - title: setChatMode
        source: "src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:315"
        call: chat-widget.set-chat-mode
        input: {mode: "= vars.next"}
      - title: A new chat when the session must be cleared
        source: "src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:317-319"
        if: "vars.clear"
        then:
          - call: command-service.execute-command
            input: {command_id: workbench.action.chat.newChat, args: []}
      - {return: {mode: "= vars.next", changed: true}}
