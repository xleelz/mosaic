  # ------------------------------------------------------------------ queue additions
  - component: chat-queue-actions
    name: cmd-workbench-action-chat-sendpendingimmediately
    kind: function
    attributes: {command: workbench.action.chat.sendPendingImmediately}
    summary: "Sends a queued request now, cancelling the running one."
