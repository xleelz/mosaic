      - "src/vs/workbench/contrib/chat/browser/actions/chatQueueActions.ts:326-335"
    request: {type: object, properties: {session_resource: {type: string, default: "vscode-chat-session://local/s1"}, id: {type: string, default: queued_1}}}
    behavior:
      - title: chatService.sendPendingRequestImmediately
        source: "src/vs/workbench/contrib/chat/browser/actions/chatQueueActions.ts:334"
        call: chat-service.send-pending-request-immediately
        input: {session_resource: "= input.session_resource", request_id: "= input.id"}
        as: r
      - {return: "= vars.r.value"}
  - component: chat-queue-actions
