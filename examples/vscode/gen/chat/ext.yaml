      - "src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:61"
      - "src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:530-700"
    request: {type: object, properties: {picked: {type: string, default: "file:///work/app/README.md"}}}
    behavior:
      - title: The user picks a context item or dismisses the picker
        source: "src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:530-560"
        choice: picker
        default: pick
        options:
          pick: []
          dismiss:
