components:
  - {id: configuration-service, name: ConfigurationService, kind: service, layer: platform, parent: platform, sources: ["src/vs/workbench/services/configuration/browser/configurationService.ts:67"], summary: "Configuration service (boundary; owner platform-core).", attributes: {boundary: true, owner: platform-core}}
  - id: chat-setup-contributions
    name: Chat setup actions
    kind: module
    layer: ai
    parent: chat
    sources: ["src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:232"]
    summary: "The chat setup commands (Use AI Features with Copilot ...) registered by ChatSetupContribution."
    attributes: {owner: chat}
  - id: automation-service
    name: IAutomationService
    kind: service
    layer: ai
    parent: chat
    sources:
      - "src/vs/workbench/contrib/chat/common/automations/automationService.ts:16"
      - "src/vs/workbench/contrib/chat/common/automations/automationService.ts:317"
    summary: "The automation store contract (IAutomationStore): defined automations by id. The registered implementation is ProviderAutomationService in src/vs/sessions (automations.contribution.ts:30); this models the contract's documented semantics."
    attributes: {owner: chat, service_id: IAutomationService}
    state:
      schema: {type: object, properties: {automations: {type: object}}}
      initial: {automations: {}}

configs:
  - id: chat-disable-ai-features
    type: boolean
    value: false
    default: false
    summary: "chat.disableAIFeatures (ChatAIDisabledSettingId); triggerSetup writes false."
    sources: ["src/vs/platform/chat/common/chatSettings.ts:6"]
    attributes: {key: chat.disableAIFeatures}

interfaces:
  - component: configuration-service
    name: update-value
    kind: function
    summary: "Writes a setting (platform-core seam)."
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [key, value], properties: {key: {type: string}, value: {}, target: {type: string, default: user}}}

  # ---------------------------------------------------------------- acquire-or-load
  - component: chat-service
    name: acquire-or-load-session
    kind: function
    summary: "Returns a reference to a session's chat model: an existing model, a local session restored from the session store, or a contributed (remote) session loaded through its provider; undefined when a local session has no stored data."
    sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:816-844"]
    request:
      type: object
      required: [session_resource]
      properties:
        session_resource: {type: string, examples: ["vscode-chat-session://local/s1"]}
        location: {type: string, default: panel}
    response: {type: object, properties: {found: {type: boolean}, session_resource: {type: string}, restored: {type: boolean}}}
    behavior:
      - title: An existing model is acquired
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:762-765"
        if: "input.session_resource in state.sessions"
        then:
          - {return: {found: true, session_resource: "= input.session_resource", restored: false}}
      - if: "input.session_resource.startsWith('vscode-chat-session://local/')"
        then:
          - title: Local sessions are restored from the session store, or are undefined without stored data
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:767-780"
            if: "!(has(state.stored) && input.session_resource in state.stored)"
            then:
              - {return: {found: false, session_resource: "= input.session_resource", restored: false}}
          - title: Restore the stored data as the session model
            source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:782-789"
            set:
              state.sessions: "= merge(state.sessions, {input.session_resource: {'location': state.stored[input.session_resource].location, 'requests': state.stored[input.session_resource].requests, 'pending': false, 'pending_request_id': '', 'queued': [], 'read_only': false, 'input_blocked': false, 'yield_requested': false}})"
          - {return: {found: true, session_resource: "= input.session_resource", restored: true}}
      - title: A contributed session is loaded once through its provider (concurrent loads share the promise)
        source: "src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:822-843"
        set:
          state.sessions: "= merge(state.sessions, {input.session_resource: {'location': input.location, 'requests': [], 'pending': false, 'pending_request_id': '', 'queued': [], 'read_only': false, 'input_blocked': false, 'yield_requested': false}})"
      - {return: {found: true, session_resource: "= input.session_resource", restored: true}}

  # ---------------------------------------------------------------- automation contract
  - component: automation-service
    name: create-automation
    kind: function
    summary: "createAutomation: validates and persists a new automation; the service fills in the id (enabled defaults to true)."
    sources:
      - "src/vs/workbench/contrib/chat/common/automations/automationService.ts:282-283"
      - "src/vs/workbench/contrib/chat/common/automations/automationService.ts:127-147"
    request:
      type: object
      required: [name, prompt]
      properties:
        name: {type: string, examples: [Nightly triage]}
        prompt: {type: string, examples: ["Triage new issues"]}
        schedule: {type: object}
        target: {type: object}
        enabled: {type: boolean, default: true}
        ownership: {type: string, enum: [user, repository], default: user}
    response: {type: object, properties: {id: {type: string}, name: {type: string}, prompt: {type: string}, enabled: {type: boolean}}}
    errors: [{code: invalid-automation, status: 0, retryable: false}]
    behavior:
      - title: The complete definition is validated before it is persisted
        source: "src/vs/workbench/contrib/chat/common/automations/automationService.ts:282"
        if: "input.name.trim() == '' || input.prompt.trim() == ''"
        then:
          - fail: {code: invalid-automation, message: "An automation needs a name and a prompt"}
      - set: {vars.id: "= 'auto-' + string(size(state.automations) + 1)"}
      - set:
          state.automations: "= merge(state.automations, {vars.id: {'id': vars.id, 'name': input.name, 'prompt': input.prompt, 'enabled': input.enabled, 'ownership': input.ownership}})"
      - {return: "= state.automations[vars.id]"}
  - component: automation-service
    name: update-automation-if-unchanged
    kind: function
    summary: "updateAutomationIfUnchanged: applies the patch only when the editable fields still match `expected`; otherwise reports a conflict with the current state."
    sources: ["src/vs/workbench/contrib/chat/common/automations/automationService.ts:285-290"]
    request:
      type: object
      required: [id, patch, expected]
      properties:
        id: {type: string, examples: [auto-1]}
        patch: {type: object, properties: {name: {type: string}, prompt: {type: string}, enabled: {type: boolean}}}
        expected: {type: object, properties: {name: {type: string}, prompt: {type: string}, enabled: {type: boolean}}}
    response: {type: object, properties: {kind: {type: string, enum: [updated, conflict]}, automation: {type: object}, current: {type: object}}}
    behavior:
      - title: Missing, or edited since `expected` was read, is a conflict
        source: "src/vs/workbench/contrib/chat/common/automations/automationService.ts:192-194"
        if: "!(input.id in state.automations) || ['name', 'prompt', 'enabled'].exists(f, f in input.expected && state.automations[input.id][f] != input.expected[f])"
        then:
          - {return: {kind: conflict, current: "= input.id in state.automations ? state.automations[input.id] : {}"}}
      - set:
          state.automations: "= merge(state.automations, {input.id: input.patch})"
      - {return: {kind: updated, automation: "= state.automations[input.id]"}}
  - component: automation-service
    name: delete-automation
    kind: function
    summary: "deleteAutomation: deletes an automation and its run history; missing ids are ignored."
    sources: ["src/vs/workbench/contrib/chat/common/automations/automationService.ts:291-292"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [auto-1]}}}
    response: {type: object, properties: {}}
    behavior:
      - if: "input.id in state.automations"
        then:
          - title: Remove the automation (and its runs)
            source: "src/vs/workbench/contrib/chat/common/automations/automationService.ts:292"
            set: {state.automations: "= omit(state.automations, input.id)"}
      - {return: {}}
  - component: automation-service
    name: get-automation
    kind: function
    summary: "getAutomation: snapshot of one automation."
    sources: ["src/vs/workbench/contrib/chat/common/automations/automationService.ts:278-279"]
    request: {type: object, required: [id], properties: {id: {type: string, examples: [auto-1]}}}
    response: {type: object, properties: {found: {type: boolean}, automation: {type: object}}}
    behavior:
      - if: "!(input.id in state.automations)"
        then: [{return: {found: false}}]
      - {return: {found: true, automation: "= state.automations[input.id]"}}

  # ---------------------------------------------------------------- triggerSetup
  - component: chat-setup-contributions
    name: cmd-workbench-action-chat-triggersetup
    kind: function
    attributes: {command: workbench.action.chat.triggerSetup}
    summary: "workbench.action.chat.triggerSetup: unhides setup, re-enables AI features, optionally sets the mode and input, runs chat setup, and offers Retry on failure."
    sources:
      - "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:573"
      - "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:252-298"
    request: {type: object, properties: {mode: {type: string, default: ""}, input_value: {type: string, default: ""}, args: {type: array, default: []}}}
    response: {type: object, properties: {success: {type: boolean}}}
    behavior:
      - set: {vars.mode: "= size(input.args) > 0 && type(input.args[0]) == string ? input.args[0] : input.mode"}
      - title: Setup is no longer hidden
        source: "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:260"
        call: chat-entitlement-service.update-setup-context
        input: {hidden: false}
        fill: false
      - title: chat.disableAIFeatures = false
        source: "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:261"
        call: configuration-service.update-value
        input: {key: chat.disableAIFeatures, value: false}
      - if: "vars.mode != ''"
        then:
          - title: Reveal the chat widget in the requested mode
            source: "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:263-271"
            call: chat-widget.set-chat-mode
            input: {mode: "= vars.mode"}
      - if: "input.input_value != ''"
        then:
          - title: Prefill the chat input
            source: "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:273-277"
            call: chat-widget.set-input
            input: {text: "= input.input_value"}
      - title: ChatSetup.run (sign in, entitlement, install the Copilot extension)
        source: "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:279-280"
        choice: setup_result
        default: success
        options:
          success:
            - call: chat-entitlement-service.update-setup-context
              input: {completed: true}
              fill: false
            - {return: {success: true}}
          canceled:
            - {return: {success: false}}
          failed:
            - title: "Chat setup failed. Would you like to try again?"
              source: "src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:285-294"
              choice: retry_dialog
              default: close
              options:
                close:
                  - {return: {success: false}}
                retry:
                  - call: command-service.execute-command
                    input: {command_id: workbench.action.chat.triggerSetup, args: []}
                    as: again
                  - {return: {success: true}}
  - component: chat-entitlement-service
    name: update-setup-context
    kind: function
    summary: "ChatEntitlementContext.update: the setup state behind the Setup.hidden/completed context keys."
    sources: ["src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:260"]
    request: {type: object, properties: {hidden: {type: boolean}, completed: {type: boolean}}}
    behavior:
      - set: {state.setup: "= merge(has(state.setup) ? state.setup : {'hidden': true, 'completed': false}, input)"}
      - {return: "= state.setup"}
  - component: chat-widget
    name: set-input
    kind: function
    summary: "chatWidget.setInput."
    sources: ["src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:276"]
    request: {type: object, properties: {text: {type: string}}}
    behavior:
      - {set: {state.input: "= input.text"}}

flows:
  - {id: chat-acquire-or-load-session, name: Acquire or load a chat session, description: "Called by agents' session providers and the inline chat resolver to get a session's chat model.", entry: {caller: agents, interface: chat-service.acquire-or-load-session, input: {session_resource: "vscode-chat-session://local/s1"}}, sources: ["src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:816"], tags: [writes]}
  - {id: automation-create, name: Create an automation, entry: {caller: agents, interface: automation-service.create-automation}, sources: ["src/vs/workbench/contrib/chat/common/automations/automationService.ts:283"], tags: [writes]}
  - {id: automation-update-if-unchanged, name: Update an automation if unchanged, entry: {caller: agents, interface: automation-service.update-automation-if-unchanged, input: {id: auto-1, patch: {enabled: false}, expected: {enabled: true}}}, sources: ["src/vs/workbench/contrib/chat/common/automations/automationService.ts:290"], tags: [writes]}
  - {id: automation-delete, name: Delete an automation, entry: {caller: agents, interface: automation-service.delete-automation, input: {id: auto-1}}, sources: ["src/vs/workbench/contrib/chat/common/automations/automationService.ts:292"], tags: [writes]}
  - {id: automation-get, name: Read an automation, entry: {caller: agents, interface: automation-service.get-automation, input: {id: auto-1}}, sources: ["src/vs/workbench/contrib/chat/common/automations/automationService.ts:279"]}
  - {id: chat-trigger-setup, name: Trigger chat setup, entry: {caller: user, interface: chat-setup-contributions.cmd-workbench-action-chat-triggersetup}, sources: ["src/vs/workbench/contrib/chat/browser/chatSetup/chatSetupContributions.ts:573"], tags: [writes]}

scenarios:
  - id: chat-acquire-existing-session
    flow: chat-acquire-or-load-session
    steps:
      - {flow: chat-acquire-or-load-session, as: a}
      - {flow: chat-read-session, as: r}
    expect:
      - "steps.a.result.value.found && !steps.a.result.value.restored && steps.r.result.value.found"
      - "size(state['chat-service@w1'].sessions) == 1"
  - id: chat-acquire-restores-stored-local
    flow: chat-acquire-or-load-session
    state:
      "chat-service@w1": {stored: {"vscode-chat-session://local/old": {location: panel, requests: [{id: request_1, message: "earlier", agent_id: github.copilot.default, response: success}]}}}
    steps:
      - {flow: chat-acquire-or-load-session, as: a, input: {session_resource: "vscode-chat-session://local/old"}}
      - {flow: chat-read-session, as: r, input: {session_resource: "vscode-chat-session://local/old"}}
    expect:
      - "steps.a.result.value.restored && steps.r.result.value.session.requests[0].message == 'earlier'"
      - "'vscode-chat-session://local/old' in state['chat-service@w1'].sessions"
  - id: chat-acquire-unknown-local
    flow: chat-acquire-or-load-session
    input: {session_resource: "vscode-chat-session://local/missing"}
    expect:
      - "!result.value.found && !('vscode-chat-session://local/missing' in state['chat-service@w1'].sessions)"
  - id: chat-acquire-loads-contributed
    flow: chat-acquire-or-load-session
    steps:
      - {flow: chat-acquire-or-load-session, as: a, input: {session_resource: "agent-host-copilot:/9f2c4e1a", location: panel}}
      - {flow: chat-read-session, as: r, input: {session_resource: "agent-host-copilot:/9f2c4e1a"}}
    expect:
      - "steps.a.result.value.found && steps.r.result.value.found"
      - "'agent-host-copilot:/9f2c4e1a' in state['chat-service@w1'].sessions"
  - id: automation-create-update-delete
    flow: automation-create
    steps:
      - {flow: automation-create, as: c, input: {name: Nightly triage, prompt: Triage new issues, enabled: true}}
      - {flow: automation-update-if-unchanged, as: u, input: {id: auto-1, patch: {enabled: false}, expected: {name: Nightly triage, prompt: Triage new issues, enabled: true}}}
      - {flow: automation-get, as: g}
      - {flow: automation-delete, as: d}
      - {flow: automation-get, as: g2}
    expect:
      - "steps.c.result.value.id == 'auto-1' && steps.c.result.value.enabled"
      - "steps.u.result.value.kind == 'updated' && !steps.g.result.value.automation.enabled"
      - "!steps.g2.result.value.found && state['automation-service@w1'].automations == {}"
  - id: automation-update-conflict
    flow: automation-update-if-unchanged
    state:
      "automation-service@w1": {automations: {auto-1: {id: auto-1, name: Nightly triage, prompt: Triage, enabled: false, ownership: user}}}
    expect:
      - "result.value.kind == 'conflict' && !result.value.current.enabled"
      - "!state['automation-service@w1'].automations['auto-1'].enabled"
  - id: automation-create-invalid
    flow: automation-create
    input: {name: " ", prompt: "x"}
    expect:
      - "!result.ok && result.error.code == 'invalid-automation' && state['automation-service@w1'].automations == {}"
  - id: automation-delete-missing-ignored
    flow: automation-delete
    input: {id: auto-9}
    expect:
      - "result.ok && state['automation-service@w1'].automations == {}"
  - id: chat-trigger-setup-success
    flow: chat-trigger-setup
    steps:
      - {flow: chat-trigger-setup, as: t, input: {mode: ask, input_value: "Explain main.ts"}}
      - {flow: chat-view-model, as: r}
    expect:
      - "steps.t.result.value.success && steps.r.result.value.mode == 'ask' && steps.r.result.value.input == 'Explain main.ts'"
      - "state['chat-entitlement-service@w1'].setup.completed && !state['chat-entitlement-service@w1'].setup.hidden"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'configuration-service.update-value' && e.input.key == 'chat.disableAIFeatures')"
  - id: chat-trigger-setup-via-command
    flow: chat-trigger-setup
    steps:
      - {interface: command-service.execute-command, caller: user, as: x, input: {command_id: workbench.action.chat.triggerSetup, args: [agent]}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'chat-setup-contributions.cmd-workbench-action-chat-triggersetup')"
      - "state['chat-entitlement-service@w1'].setup.completed"
  - id: chat-trigger-setup-canceled
    flow: chat-trigger-setup
    choices: {chat-setup-contributions.cmd-workbench-action-chat-triggersetup.setup_result: canceled}
    expect:
      - "!result.value.success && !state['chat-entitlement-service@w1'].setup.completed"
  - id: chat-trigger-setup-failed
    flow: chat-trigger-setup
    choices: {chat-setup-contributions.cmd-workbench-action-chat-triggersetup.setup_result: failed}
    expect:
      - "!result.value.success && calls['command-service.execute-command'] == 0"
      - "!state['chat-entitlement-service@w1'].setup.hidden"
