scenarios:
- id: lm-tool-invoke-waits-for-accept-command
  fixtures: [one-window-folder, chat-seed]
  description: The tool call waits for confirmation; a later Accept command (another user step) releases it and the tool runs.
  state:
    language-model-tools-service@w1:
      tools:
        copilot_findFiles: {extension: GitHub.copilot-chat, has_impl: true, needs_confirmation: true, reference_name: fileSearch, source: extension}
  steps:
  - flow: lm-tool-invoke
    as: i
    input: {tool_id: copilot_findFiles, call_id: call_9}
    choices: {chat-tool-invocation.await-confirmation.user_confirmation: wait}
    await: false
  - {flow: chat-accept-tool, as: a, at_ms: 500, input: {call_id: call_9}}
  expect:
  - steps.a.result.value.confirmed
  - steps.i.result.ok && steps.i.result.value.outcome == 'completed' && steps.i.result.value.confirmed_by == 'user-action'
  - steps.i.duration_ms >= 400
  - calls_by_instance['ext-host-language-model-tools.invoke-tool@eh1'] == 1
  - state['chat-tool-invocation@w1'].invocations['call_9'].state == 'completed'
