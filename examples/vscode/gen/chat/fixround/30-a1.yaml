configs:
- id: chat-agent-enabled
  type: boolean
  value: true
  default: true
  summary: 'chat.agent.enabled: agent mode can be used (policy ChatAgentMode can force false); product.json sets no override, so deployed = default.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:1539-1543
  attributes:
    key: chat.agent.enabled
components:
- id: chat-request-parser
  name: ChatRequestParser
  kind: module
  layer: ai
  parent: chat
  sources:
  - src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:32-39
  summary: 'Parses a chat message into parts: variables (#), the @-agent (first, once, known at the location and mode) and slash commands.'
  attributes:
    owner: chat
interfaces:
- component: chat-agent-service
  name: get-agents-by-name
  kind: function
  summary: 'getAgentsByName: the registered participants whose name matches.'
  sources:
  - src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:524-526
  request:
    type: object
    required:
    - name
    properties:
      name:
        type: string
        examples:
        - vscode
  response:
    type: object
    properties:
      agents:
        type: array
  behavior:
  - set:
      vars.ids: "= state.agents.filter(k, (has(state.agents[k].name) ? state.agents[k].name : k.split('.')[size(k.split('.')) - 1]) == input.name)"
  - return:
      agents: "= vars.ids.map(k, {'id': k, 'locations': state.agents[k].locations, 'modes': state.agents[k].modes})"
- component: chat-request-parser
  name: parse-chat-request
  kind: function
  summary: 'parseChatRequestWithReferences: finds the leading @-agent part. The agent must come first (only whitespace before it), only one is allowed, it must support the location, and the request''s mode when one is given.'
  sources:
  - src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:41-121
  - src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:123-170
  request:
    type: object
    required:
    - message
    properties:
      message:
        type: string
        examples:
        - '@vscode how do I change the theme'
      location:
        type: string
        default: panel
      mode:
        type: string
        default: ''
  response:
    type: object
    properties:
      agent_id:
        type: string
      agent_name:
        type: string
  behavior:
  - title: '@ is only an agent leader at the start, after optional whitespace (agentReg)'
    source: src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:19
    if: "!matches(input.message, '^\\\\s*@[\\\\w\\\\-\\\\.]+')"
    then:
    - return:
        agent_id: ''
        agent_name: ''
  - set:
      vars.name: "= replace(input.message, '(?s)^\\\\s*@([\\\\w\\\\-\\\\.]+).*$', '$1')"
  - title: Look the name up among the registered participants
    source: src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:132-138
    call: chat-agent-service.get-agents-by-name
    input:
      name: = vars.name
    as: byname
    fill: true
  - set:
      vars.here: = vars.byname.value.agents.filter(a, input.location in a.locations)
  - title: No participant of that name at this location, so the text stays plain
    source: src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:142-147
    if: size(vars.here) == 0
    then:
    - return:
        agent_id: ''
        agent_name: ''
  - title: The participant doesn't support the request's mode
    source: src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:149-151
    if: input.mode != '' && !(input.mode in vars.here[0].modes)
    then:
    - return:
        agent_id: ''
        agent_name: ''
  - return:
      agent_id: = vars.here[0].id
      agent_name: = vars.name
