interfaces:
- component: extension-agent-plugin-discovery
  name: start
  kind: function
  summary: 'start(enablementModel): installs the chatPlugins handler and schedules the first refresh (RunOnceScheduler, 0 ms); plugins stays undefined until it completes.'
  sources:
  - src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1284-1324
  request:
    type: object
  response:
    type: object
    properties:
      started:
        type: boolean
  behavior:
  - title: Already started
    if: state.started
    then:
    - return:
        started: false
  - set:
      state.started: true
  - title: "scheduler.schedule() \u2014 the refresh runs after the current task, so plugins is still undefined here"
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1286
    emit: extension-agent-plugin-discovery.refresh-plugins
    after_ms: 0
    input: {}
  - return:
      started: true
- component: extension-agent-plugin-discovery
  name: refresh-plugins
  kind: function
  summary: '_refreshPlugins: a new discover version; the entries whose when clause holds become the plugins, unless a newer refresh started meanwhile.'
  sources:
  - src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:289-297
  - src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1338-1366
  request:
    type: object
  response:
    type: object
    properties:
      count:
        type: integer
  behavior:
  - set:
      state.discover_version: = state.discover_version + 1
      vars.version: = state.discover_version + 1
  - title: The context the entries' when clauses are evaluated against
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1340-1342
    call: context-key-service.get-context
    input: {}
    as: ctx
    fill: true
  - title: Entries whose when clause doesn't match the context are skipped
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1341
    set:
      vars.sources: '= state.entries.filter(k, state.entries[k].when == '''' || eval(state.entries[k].when, vars.ctx.value.values) == true).map(k, {''uri'': ''file:///extensions/'' + state.entries[k].extension_id
        + ''/'' + state.entries[k].path, ''extension_id'': state.entries[k].extension_id})'
  - title: A refresh superseded by a newer one leaves plugins alone
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:292-294
    if: state.discover_version != vars.version
    then:
    - return:
        count: -1
  - title: plugins becomes resolved
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:296
    set:
      state.plugins: = vars.sources
  - return:
      count: = size(vars.sources)
- component: extension-agent-plugin-discovery
  name: get-plugins
  kind: function
  summary: The plugins observable's current value (null while unresolved).
  sources:
  - src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:272-273
  request:
    type: object
  response:
    type: object
    properties:
      resolved:
        type: boolean
      plugins:
        type:
        - array
        - 'null'
  behavior:
  - return:
      resolved: = state.plugins != null
      plugins: = state.plugins
- component: context-key-service
  name: get-context
  kind: function
  summary: AbstractContextKeyService.getContext (boundary; owner platform-core).
  attributes:
    boundary: true
    owner: platform-core
  request:
    type: object
    properties:
      keys:
        type: array
        items:
          type: string
  response:
    type: object
    properties:
      values:
        type: object
flows:
- id: chat-plugin-discovery
  name: Discover extension-contributed agent plugins
  description: AgentPluginService starts each registered discovery; ExtensionAgentPluginDiscovery installs its chatPlugins handler and refreshes once scheduled.
  entry:
    caller: user
    interface: extension-agent-plugin-discovery.start
  sources:
  - src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:160-162
  tags:
  - writes
- id: chat-plugin-contributions-changed
  name: Extensions add or remove chatPlugins contributions
  entry:
    caller: third-party-extension
    interface: extension-agent-plugin-discovery.handle-chat-plugins-extension-point
    input:
      added:
      - extension_id: GitHub.copilot-chat
        path: plugins/review
        when: ''
  sources:
  - src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1292
  tags:
  - writes
- id: chat-plugin-read
  name: Read the discovered plugins
  entry:
    caller: user
    interface: extension-agent-plugin-discovery.get-plugins
  sources:
  - src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:272
scenarios:
- id: chat-plugin-discovery-unresolved-until-refresh
  fixtures:
  - one-window-folder
  - chat-seed
  description: After start() plugins is undefined; once the scheduled refresh ran it is resolved (agentPluginFormatDetection.test.ts:138).
  steps:
  - flow: chat-plugin-discovery
    as: s
  - flow: chat-plugin-read
    as: before
    at_ms: 0
  - flow: chat-plugin-read
    as: after
    at_ms: 50
  expect:
  - steps.s.result.value.started
  - '!steps.before.result.value.resolved && steps.before.result.value.plugins == null'
  - steps.after.result.value.resolved && steps.after.result.value.plugins == []
  - state['extension-agent-plugin-discovery@w1'].plugins == [] && state['extension-agent-plugin-discovery@w1'].discover_version == 1
- id: chat-plugin-contributions-then-read
  fixtures:
  - one-window-folder
  - chat-seed
  steps:
  - flow: chat-plugin-contributions-changed
    as: c
    input:
      added:
      - extension_id: GitHub.copilot-chat
        path: plugins/review
        when: ''
      - extension_id: GitHub.copilot-chat
        path: ../escape
        when: ''
      - extension_id: GitHub.copilot-chat
        path: ''
        when: ''
  - flow: chat-plugin-read
    as: r
    at_ms: 100
  expect:
  - steps.c.result.value.registered == 1
  - size(state['extension-agent-plugin-discovery@w1'].errors) == 2
  - 'steps.r.result.value.plugins == [{''uri'': ''file:///extensions/GitHub.copilot-chat/plugins/review'', ''extension_id'': ''GitHub.copilot-chat''}]'
- id: chat-plugin-when-clause-false
  fixtures:
  - one-window-folder
  - chat-seed
  state:
    context-key-service:
      values:
        chatPluginsBeta: false
  steps:
  - flow: chat-plugin-contributions-changed
    as: c
    input:
      added:
      - extension_id: GitHub.copilot-chat
        path: plugins/review
        when: chatPluginsBeta
  - flow: chat-plugin-read
    as: r
    at_ms: 100
  expect:
  - steps.c.result.value.registered == 1
  - steps.r.result.value.plugins == []
  - state['extension-agent-plugin-discovery@w1'].plugins == [] && size(state['extension-agent-plugin-discovery@w1'].entries) == 1
