interfaces:
- component: voice-session-controller
  name: get-state
  kind: function
  summary: The controller's observables (voiceState starts idle; connected, connecting, reconnecting and muted start false).
  sources:
  - src/vs/workbench/contrib/chat/browser/voiceClient/voiceSessionController.ts:352-382
  request:
    type: object
  response:
    type: object
    properties:
      connected: {type: boolean}
      connecting: {type: boolean}
      reconnecting: {type: boolean}
      muted: {type: boolean}
      voice_state: {type: string}
  behavior:
  - return:
      connected: = state.connected
      connecting: = state.connecting
      reconnecting: = state.reconnecting
      muted: = state.muted
      voice_state: = state.voice_state
- component: chat-context-service
  name: set-chat-context-provider
  kind: function
  summary: 'setChatContextProvider: records (or updates) the provider''s picker and registers it with the pick service.'
  sources:
  - src/vs/workbench/contrib/chat/browser/contextContrib/chatContextService.ts:70-75
  request:
    type: object
    required: [id]
    properties:
      id: {type: string}
      title: {type: string}
      icon: {type: string}
  response:
    type: object
    properties:
      registered: {type: boolean}
  behavior:
  - set:
      vars.prev: "= input.id in state.providers ? state.providers[input.id] : {}"
  - set:
      state.providers: "= merge(state.providers, {input.id: merge(vars.prev, {'picker': {'title': input.title, 'icon': input.icon}})})"
  - return:
      registered: true
- component: chat-context-service
  name: get-providers
  kind: function
  summary: The registered context providers.
  sources:
  - src/vs/workbench/contrib/chat/browser/contextContrib/chatContextService.ts:43
  request:
    type: object
  response:
    type: object
    properties:
      providers: {type: object}
  behavior:
  - return:
      providers: = state.providers
flows:
- id: chat-context-contributed
  name: Extensions contribute chat context providers
  entry:
    caller: third-party-extension
    interface: chat-context-contribution.handle-chat-context-extension-point
    input:
      extensions:
      - extension_id: my.ext
        proposals: [chatContextProvider]
        contributions: [{id: tickets, display_name: Tickets, icon: $(issues)}]
  sources:
  - src/vs/workbench/contrib/chat/browser/contextContrib/chatContext.contribution.ts:59
  tags:
  - writes
- id: chat-context-providers-read
  name: Read the chat context providers
  entry:
    caller: user
    interface: chat-context-service.get-providers
  sources:
  - src/vs/workbench/contrib/chat/browser/contextContrib/chatContextService.ts:43
scenarios:
- id: chat-context-contributed-then-read
  fixtures: [one-window-folder, chat-seed]
  steps:
  - flow: chat-context-contributed
    as: c
    input:
      extensions:
      - extension_id: my.ext
        proposals: [chatContextProvider]
        contributions:
        - {id: tickets, display_name: Tickets, icon: $(issues)}
        - {id: bad, display_name: Bad, icon: issues.png}
      - extension_id: other.ext
        proposals: []
        contributions:
        - {id: x, display_name: X, icon: $(zap)}
  - {flow: chat-context-providers-read, as: r}
  expect:
  - "steps.r.result.value.providers == {'my.ext-tickets': {'picker': {'title': 'Tickets', 'icon': '$(issues)'}}}"
  - size(state['chat-context-contribution@w1'].errors) == 1
- id: chat-participants-contributed-then-mention-routes
  fixtures: [one-window-folder, chat-seed]
  description: The contributed participant is found by @name but has no implementation yet, so invoking it fails and the response records the error.
  state:
    chat-widget@w1: {mode: ask}
  steps:
  - flow: chat-participants-contributed
    as: c
    input:
      added:
      - {extension_id: my.ext, id: my.participant, name: helper}
  - {flow: chat-submit, as: s, input: {input_value: '@helper hi'}}
  expect:
  - steps.s.result.value.kind == 'sent'
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'my.participant'
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'error'
