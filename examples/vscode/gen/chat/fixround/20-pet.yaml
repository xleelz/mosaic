interfaces:
- component: chat-pet-service
  name: unlock-achievement
  kind: function
  summary: 'unlockAchievement: refuses an unknown id; returns false for a disabled achievement, a disabled pet or one already unlocked; else stores it, fires onDidUnlockAchievement and returns true.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chatPetService.ts:274-298
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - firstChatMessage
  response:
    type: object
    properties:
      unlocked:
        type: boolean
  errors:
  - code: unknown-chat-pet-achievement
    status: 0
    retryable: false
  behavior:
  - title: Not an achievement id (enabled or disabled)
    source: src/vs/workbench/contrib/chat/browser/chatPetService.ts:275-277
    if: '!(input.id in [''requestRevision'', ''firstChatMessage'', ''integratedBrowserShared'', ''modelSwitch'', ''mcpServerPresent'', ''customSkillPresent'', ''agentsWindowOpened'', ''createPullRequest'',
      ''agentEditKept'', ''agentChangesReviewed'', ''chatReferenceOpened'', ''usefulOutputCopied'', ''autopilotEnabled'', ''blobby'', ''instructionPresent'', ''queueOrSteeringMessage'', ''chatOutputCopied'',
      ''imageRequest''])'
    then:
    - fail:
        code: unknown-chat-pet-achievement
        message: '= ''Unknown chat pet achievement: '' + input.id'
  - title: A disabled achievement (instructionPresent, queueOrSteeringMessage, chatOutputCopied, imageRequest) is never unlocked
    source: src/vs/workbench/contrib/chat/browser/chatPetAchievements.ts:286-343
    if: input.id in ['instructionPresent', 'queueOrSteeringMessage', 'chatOutputCopied', 'imageRequest']
    then:
    - return:
        unlocked: false
  - title: The pet is disabled
    source: src/vs/workbench/contrib/chat/browser/chatPetService.ts:281-283
    if: '!state.enabled'
    then:
    - return:
        unlocked: false
  - title: Already unlocked
    source: src/vs/workbench/contrib/chat/browser/chatPetService.ts:284-287
    if: input.id in state.unlocked
    then:
    - return:
        unlocked: false
  - title: Store chat.vscodePet.achievement.<id> = true (application-shared) and refresh the unlocked list
    source: src/vs/workbench/contrib/chat/browser/chatPetService.ts:289-295
    set:
      state.unlocked: = state.unlocked + [input.id]
  - return:
      unlocked: true
    title: onDidUnlockAchievement fires (no modeled listener) and the unlock is reported
    source: src/vs/workbench/contrib/chat/browser/chatPetService.ts:296-297
