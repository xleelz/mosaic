flows:
- id: chat-pet-unlock-achievement
  name: Unlock a chat pet achievement
  description: An action that earns an achievement (sending a first message, switching models, keeping agent edits) calls IChatPetService.unlockAchievement.
  entry:
    caller: user
    interface: chat-pet-service.unlock-achievement
    input:
      id: firstChatMessage
  sources:
  - src/vs/workbench/contrib/chat/browser/chatPetService.ts:274
  tags:
  - writes
- id: chat-pet-read-state
  name: Read the chat pet's unlocked achievements
  entry:
    caller: user
    interface: chat-pet-service.get-unlocked-achievements
  sources:
  - src/vs/workbench/contrib/chat/browser/chatPetService.ts:394-398
- id: lm-tool-register
  name: Register a language model tool with its implementation
  description: McpLanguageModelToolContribution (and other contributors) call registerTool(toolData, impl).
  entry:
    caller: third-party-extension
    interface: language-model-tools-service.register-tool
    input:
      tool_id: mcp_github_search_issues
      reference_name: search_issues
      source: mcp
      server_id: github
  sources:
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:368
  tags:
  - writes
interfaces:
- component: chat-pet-service
  name: get-unlocked-achievements
  kind: function
  summary: 'unlockedAchievements: the enabled achievements whose storage key is set.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chatPetService.ts:394-398
  request:
    type: object
  response:
    type: object
    properties:
      enabled:
        type: boolean
      unlocked:
        type: array
  behavior:
  - return:
      enabled: = state.enabled
      unlocked: = state.unlocked
scenarios:
- id: chat-submit-ask-mode-default-participant
  flow: chat-submit
  fixtures:
  - one-window-folder
  - chat-seed
  description: In Ask mode the default participant is github.copilot.default (modes [ask], location panel).
  input:
    input_value: Explain what src/main.ts does
  state:
    chat-widget@w1:
      mode: ask
  expect:
  - result.ok && result.value.kind == 'sent'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'chat-agent-service.get-default-agent' && e.input.mode == 'ask')
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'github.copilot.default'
- id: chat-submit-agent-disabled-uses-edit
  flow: chat-submit
  fixtures:
  - one-window-folder
  - chat-seed
  description: With chat.agent.enabled off, the Agent mode falls back to Edit, whose default is github.copilot.editingSession.
  input:
    input_value: Rename add to sum
  config:
    chat-agent-enabled: false
  expect:
  - result.ok && result.value.kind == 'sent'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'chat-service.send-request' && e.input.mode == 'edit')
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'github.copilot.editingSession'
- id: chat-submit-at-mention-routes
  flow: chat-submit
  fixtures:
  - one-window-folder
  - chat-seed
  description: '@vscode at the start routes the request to github.copilot.vscode, which supports Agent mode.'
  input:
    input_value: '@vscode how do I change the theme'
  expect:
  - result.ok && result.value.kind == 'sent'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-chat-agents2.invoke-agent' && e.input.agent_id == 'github.copilot.vscode')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onChatParticipant:github.copilot.vscode')
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'success'
- id: chat-submit-at-mention-not-first
  flow: chat-submit
  fixtures:
  - one-window-folder
  - chat-seed
  description: An @-name after other text is plain text; the default participant gets the request.
  input:
    input_value: ask @vscode about themes
  expect:
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'github.copilot.editsAgent'
  - calls['chat-agent-service.get-agents-by-name'] == 0
- id: chat-submit-at-mention-unknown
  flow: chat-submit
  fixtures:
  - one-window-folder
  - chat-seed
  description: An unknown @-name is plain text.
  input:
    input_value: '@nobody hello'
  expect:
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'github.copilot.editsAgent'
  - calls['chat-agent-service.get-agents-by-name'] == 1
- id: chat-submit-at-mention-mode-unsupported
  flow: chat-submit
  fixtures:
  - one-window-folder
  - chat-seed
  description: A participant that lacks the request's mode is not an agent part.
  input:
    input_value: '@vscode change the theme'
  state:
    chat-agent-service@w1:
      agents:
        github.copilot.vscode:
          modes:
          - ask
  expect:
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'github.copilot.editsAgent'
- id: chat-submit-unlocks-first-message
  fixtures:
  - one-window-folder
  - chat-seed
  description: With the pet enabled, a query typed into the input (isUserQuery) unlocks firstChatMessage.
  state:
    chat-pet-service@w1:
      enabled: true
    chat-widget@w1:
      input: Explain what src/main.ts does
  steps:
  - flow: chat-submit
    as: s
    input:
      input_value: ''
  - flow: chat-pet-read-state
    as: r
  expect:
  - steps.s.result.value.kind == 'sent'
  - steps.r.result.value.unlocked == ['firstChatMessage']
  - trace.exists(e, e.type == 'call.end' && e.interface == 'chat-pet-service.unlock-achievement' && e.output.unlocked)
- id: chat-pet-unlock-pet-disabled
  flow: chat-pet-unlock-achievement
  fixtures:
  - one-window-folder
  - chat-seed
  description: The pet is off by default (chat.vscodePet.enabled false), so nothing unlocks.
  expect:
  - result.ok && !result.value.unlocked
  - state['chat-pet-service@w1'].unlocked == []
- id: chat-pet-unlock-then-read
  fixtures:
  - one-window-folder
  - chat-seed
  state:
    chat-pet-service@w1:
      enabled: true
  steps:
  - flow: chat-pet-unlock-achievement
    as: u
    input:
      id: agentsWindowOpened
  - flow: chat-pet-unlock-achievement
    as: again
    input:
      id: agentsWindowOpened
  - flow: chat-pet-read-state
    as: r
  expect:
  - steps.u.result.value.unlocked && !steps.again.result.value.unlocked
  - steps.r.result.value.unlocked == ['agentsWindowOpened']
  - state['chat-pet-service@w1'].unlocked == ['agentsWindowOpened']
- id: chat-pet-unlock-disabled-achievement
  flow: chat-pet-unlock-achievement
  fixtures:
  - one-window-folder
  - chat-seed
  description: imageRequest is a disabled achievement, so it never unlocks.
  input:
    id: imageRequest
  state:
    chat-pet-service@w1:
      enabled: true
  expect:
  - result.ok && !result.value.unlocked
  - state['chat-pet-service@w1'].unlocked == []
- id: chat-pet-unlock-unknown-id
  flow: chat-pet-unlock-achievement
  fixtures:
  - one-window-folder
  - chat-seed
  input:
    id: notAnAchievement
  expect:
  - '!result.ok && result.error.code == ''unknown-chat-pet-achievement'''
  - state['chat-pet-service@w1'].unlocked == []
- id: lm-tool-register-then-invoke-mcp
  fixtures:
  - one-window-folder
  - chat-seed
  description: A registered MCP tool's invocation goes to McpToolImplementation.invoke with its server and tool name.
  steps:
  - flow: lm-tool-register
    as: reg
  - flow: lm-tool-invoke
    as: inv
    input:
      tool_id: mcp_github_search_issues
      call_id: call_5
  expect:
  - steps.reg.result.value.registered
  - state['language-model-tools-service@w1'].tools['mcp_github_search_issues'].source == 'mcp'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'mcp-tool-implementation.invoke' && e.input.server_id == 'github' && e.input.tool == 'search_issues')
  - calls['ext-host-language-model-tools.invoke-tool'] == 0
- id: lm-tool-register-duplicate
  flow: lm-tool-register
  fixtures:
  - one-window-folder
  - chat-seed
  input:
    tool_id: manage_todo_list
    reference_name: todos
    source: internal
  expect:
  - '!result.ok && result.error.code == ''tool-already-registered'''
  - state['language-model-tools-service@w1'].tools['manage_todo_list'].reference_name == 'todos'
- id: chat-cancel-cancels-tool-calls
  flow: chat-cancel
  fixtures:
  - one-window-folder
  - chat-seed
  description: Cancelling the request cancels its tracked tool calls, which denies a confirmation still waiting.
  state:
    chat-service@w1:
      sessions:
        vscode-chat-session://local/s1:
          pending: true
          pending_request_id: request_1
          requests:
          - agent_id: github.copilot.editsAgent
            id: request_1
            message: long task
            response: in-progress
    language-model-tools-service@w1:
      calls_by_request:
        request_1:
        - call_3
    chat-tool-invocation@w1:
      invocations:
        call_3:
          confirmed_by: ''
          state: waiting-for-confirmation
          tool_id: vscode_fetchWebPage_internal
  expect:
  - result.ok && result.value.canceled
  - trace.exists(e, e.type == 'call.end' && e.interface == 'language-model-tools-service.cancel-tool-calls-for-request' && e.output.canceled == 1)
  - state['chat-tool-invocation@w1'].invocations['call_3'].state == 'denied'
  - '!(''request_1'' in state[''language-model-tools-service@w1''].calls_by_request)'
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'canceled'
- id: chat-cancel-during-request
  fixtures:
  - one-window-folder
  - chat-seed
  description: A cancel while the participant is still running cancels the request's token; the participant's call fails canceled and the response stays cancelled.
  steps:
  - flow: chat-submit
    as: s
    input:
      input_value: long task
    await: false
  - flow: chat-cancel
    as: c
    at_ms: 100
  expect:
  - steps.c.result.value.canceled
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'canceled'
  - '!state[''chat-service@w1''].sessions[''vscode-chat-session://local/s1''].pending'
  - trace.exists(e, e.type == 'cancel')
- id: chat-submit-mcp-autostart-progress
  flow: chat-submit
  fixtures:
  - one-window-folder
  - chat-seed
  - agents-mcp-servers
  description: Before invoking the participant, MCP autostart starts the new servers; the ChatMcpServersStarting part goes into the response.
  input:
    input_value: list my issues
  expect:
  - result.ok && result.value.kind == 'sent'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'mcp-service.autostart')
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].parts[0].kind == 'mcpServersStarting'
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'success'
