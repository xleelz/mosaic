interfaces:
- component: chat-service
  name: accept-response-progress
  kind: function
  summary: 'The request''s progressCallback: drops chunks once the request''s token is cancelled, else model.acceptResponseProgress appends each part to the response.'
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1862-1883
  request:
    type: object
    required:
    - session_resource
    - request_id
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      request_id:
        type: string
        examples:
        - request_1
      part:
        type: object
        examples:
        - kind: markdownContent
          content: Hello
  response:
    type: object
    properties:
      accepted:
        type: boolean
  behavior:
  - title: Progress after cancellation is dropped
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1863-1865
    if: canceled('chat-request:' + input.session_resource + ':' + input.request_id) || !(input.session_resource in state.sessions)
    then:
    - return:
        accepted: false
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - title: model.acceptResponseProgress(request, part)
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1880-1882
    set:
      state.sessions: "= merge(state.sessions, {input.session_resource: merge(vars.sess, {'requests': vars.sess.requests.map(r, r.id == input.request_id ? merge(r, {'parts': (has(r.parts) ? r.parts : []) + [input.part]}) : r)})})"
  - return:
      accepted: true
