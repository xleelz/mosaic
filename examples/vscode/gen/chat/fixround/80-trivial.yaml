interfaces:
- component: chat-agent-service
  name: register-agent
  kind: function
  summary: 'registerAgent: refuses an id already registered, else adds the participant''s data (no implementation yet) and fires onDidChangeAgents.'
  sources:
  - src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:332-358
  request:
    type: object
    required:
    - agent_id
    properties:
      agent_id:
        type: string
        examples:
        - my.participant
      extension:
        type: string
      name:
        type: string
      is_default:
        type: boolean
        default: false
      locations:
        type: array
        default: [panel]
      modes:
        type: array
        default: [agent, ask, edit]
  response:
    type: object
    properties:
      registered:
        type: boolean
  errors:
  - code: agent-already-registered
    status: 0
    retryable: false
  behavior:
  - title: Agent already registered
    source: src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:333-336
    if: input.agent_id in state.agents
    then:
    - fail:
        code: agent-already-registered
        message: "= 'Agent already registered: \"' + input.agent_id + '\"'"
  - title: Store the data; has_impl stays false until the extension registers its implementation
    source: src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:346-350
    set:
      state.agents: "= merge(state.agents, {input.agent_id: {'extension': has(input.extension) ? input.extension : '', 'name': has(input.name) ? input.name : '', 'is_default': has(input.is_default) && input.is_default, 'locations': has(input.locations) ? input.locations : ['panel'], 'modes': has(input.modes) ? input.modes : ['agent', 'ask', 'edit'], 'has_impl': false}})"
  - return:
      registered: true
- component: chat-entitlement-service
  name: get-entitlement
  kind: function
  summary: The entitlement and isInternal read by consumers such as isVoiceEntitled.
  sources:
  - src/vs/workbench/services/chat/common/chatEntitlementService.ts:267-275
  request:
    type: object
  response:
    type: object
    properties:
      entitlement:
        type: string
      is_internal:
        type: boolean
  behavior:
  - return:
      entitlement: = state.entitlement
      is_internal: = state.is_internal
- component: language-models-service
  name: lookup-language-model
  kind: function
  summary: 'lookupLanguageModel: the cached metadata of a model id, if any.'
  sources:
  - src/vs/workbench/contrib/chat/common/languageModels.ts:1434-1436
  request:
    type: object
    required:
    - model_id
    properties:
      model_id:
        type: string
        examples:
        - copilot/gpt-4.1
  response:
    type: object
    properties:
      found:
        type: boolean
      metadata:
        type: object
  behavior:
  - if: '!(input.model_id in state.models)'
    then:
    - return:
        found: false
  - return:
      found: true
      metadata: = state.models[input.model_id]
- component: language-models-service
  name: get-vendors
  kind: function
  summary: 'getVendors: the registered language model vendors (providers) visible in this context.'
  sources:
  - src/vs/workbench/contrib/chat/common/languageModels.ts:1415-1430
  request:
    type: object
  response:
    type: object
    properties:
      vendors:
        type: array
  behavior:
  - return:
      vendors: = state.providers.filter(k, true)
- component: context-key-service
  name: set-context
  kind: function
  summary: AbstractContextKeyService.setContext (boundary; owner platform-core).
  attributes:
    boundary: true
    owner: platform-core
  request:
    type: object
    required:
    - key
    properties:
      key:
        type: string
      value: {}
  response:
    type: object
    properties:
      changed:
        type: boolean
flows:
- id: chat-participants-contributed
  name: Extensions contribute chat participants
  entry:
    caller: third-party-extension
    interface: chat-extension-point-handler.handle-chat-participants-extension-point
    input:
      added:
      - {extension_id: my.ext, id: my.participant, name: helper}
  sources:
  - src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:249
  tags:
  - writes
- id: lm-tools-contributed
  name: Extensions contribute language model tools
  entry:
    caller: third-party-extension
    interface: language-model-tools-extension-point-handler.handle-language-model-tools-extension-point
    input:
      added:
      - {extension_id: my.ext, name: lookup_ticket, display_name: Lookup ticket, model_description: Looks a ticket up}
  sources:
  - src/vs/workbench/contrib/chat/common/tools/languageModelToolsContribution.ts:267
  tags:
  - writes
scenarios:
- id: chat-participants-contributed-then-mention
  fixtures: [one-window-folder, chat-seed]
  description: A contributed participant is registered (without an implementation yet); invalid and proposal-less entries are refused.
  steps:
  - flow: chat-participants-contributed
    as: c
    input:
      added:
      - {extension_id: my.ext, id: my.participant, name: helper}
      - {extension_id: my.ext, id: my.bad, name: 'has space'}
      - {extension_id: my.ext, id: my.default, name: def, is_default: true}
  - {flow: chat-participants-contributed, as: dup, input: {added: [{extension_id: my.ext, id: my.participant, name: helper}]}}
  expect:
  - steps.c.result.value.registered == 1 && steps.dup.result.value.registered == 0
  - state['chat-agent-service@w1'].agents['my.participant'].modes == ['agent', 'ask', 'edit'] && !state['chat-agent-service@w1'].agents['my.participant'].has_impl
  - size(state['chat-extension-point-handler@w1'].errors) == 3
- id: lm-tools-contributed-then-invoke
  fixtures: [one-window-folder, chat-seed]
  description: A contributed tool is registered without an implementation; invoking it activates the extension (onLanguageModelTool), and since nothing registers the implementation it fails.
  steps:
  - flow: lm-tools-contributed
    as: c
    input:
      added:
      - {extension_id: my.ext, name: lookup_ticket, display_name: Lookup ticket, model_description: Looks a ticket up}
      - {extension_id: my.ext, name: copilot_x, display_name: X, model_description: reserved}
      - {extension_id: my.ext, name: no_desc, display_name: No desc}
  - {flow: lm-tool-invoke, as: i, input: {tool_id: lookup_ticket, call_id: call_2}}
  expect:
  - steps.c.result.value.registered == 1
  - state['language-model-tools-service@w1'].tools['lookup_ticket'].source == 'extension'
  - size(state['language-model-tools-extension-point-handler@w1'].errors) == 2
  - "!steps.i.result.ok && steps.i.result.error.code == 'tool-no-implementation'"
  - trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onLanguageModelTool:lookup_ticket')
- id: chat-contributions-default-models
  flow: chat-contributions-startup
  fixtures: [one-window-folder, chat-seed]
  description: The explore and plan agent model settings list the vendor default plus the tool-calling Copilot models; the utility small model excludes Copilot models.
  state:
    chat-slash-command-service:
      commands: {}
    chat-entitlement-service@w1: {entitlement: pro}
    chat-pet-service@w1: {enabled: true}
  expect:
  - state['explore-agent-default-model@w1'].model_ids == ['', 'copilot/claude-sonnet-4', 'copilot/gpt-4.1']
  - state['plan-agent-default-model@w1'].model_ids == state['explore-agent-default-model@w1'].model_ids
  - state['utility-small-model-contribution@w1'].model_ids == ['']
  - state['context-key-service@w1'].values['agentsVoiceEntitled'] == true && state['context-key-service@w1'].values['chatPetEnabled'] == true
