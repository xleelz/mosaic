components:
- id: mcp-tool-implementation
  name: McpToolImplementation
  kind: module
  layer: ai
  parent: agents
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:213-263
  summary: The language model tool for one MCP tool (boundary; owner agents).
  attributes:
    boundary: true
    owner: agents
interfaces:
- component: language-model-tools-service
  name: register-tool
  kind: function
  summary: 'registerTool = registerToolData + registerToolImplementation: adds the tool''s data (refusing a duplicate id) and marks it implemented.'
  sources:
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:368-373
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:309-338
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:352-366
  request:
    type: object
    required:
    - tool_id
    properties:
      tool_id:
        type: string
        examples:
        - mcp_github_search_issues
      reference_name:
        type: string
        default: ''
      source:
        type: string
        default: extension
        enum:
        - internal
        - extension
        - mcp
        - user
      server_id:
        type: string
        default: ''
      has_impl:
        type: boolean
        default: true
      needs_confirmation:
        type: boolean
        default: false
  response:
    type: object
    properties:
      registered:
        type: boolean
  errors:
  - code: tool-already-registered
    status: 0
    retryable: false
  behavior:
  - set:
      vars.t: "= merge({'reference_name': '', 'source': 'extension', 'server_id': '', 'has_impl': true, 'needs_confirmation': false}, input)"
  - title: registerToolData refuses an id that is already registered
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:310-312
    if: input.tool_id in state.tools
    then:
    - fail:
        code: tool-already-registered
        message: = 'Tool "' + input.tool_id + '" is already registered.'
  - title: Store the tool data, with its implementation when registerTool supplies one
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:314
    set:
      state.tools: '= merge(state.tools, {input.tool_id: {''has_impl'': vars.t.has_impl, ''needs_confirmation'': vars.t.needs_confirmation, ''reference_name'': vars.t.reference_name, ''source'': vars.t.source, ''server_id'': vars.t.server_id}})'
  - title: The tools-changed event is scheduled (onDidChangeTools)
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:316-318
    set:
      state.tools_changed: true
  - return:
      registered: true
- component: language-model-tools-service
  name: cancel-tool-calls-for-request
  kind: function
  summary: 'cancelToolCallsForRequest: disposes every tracked call of the request (cancelling its token, which denies a waiting confirmation) and forgets the request''s pending calls.'
  sources:
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1550-1563
  request:
    type: object
    required:
    - request_id
    properties:
      request_id:
        type: string
        examples:
        - request_1
  response:
    type: object
    properties:
      canceled:
        type: integer
  behavior:
  - set:
      vars.calls: '= has(state.calls_by_request) && input.request_id in state.calls_by_request ? state.calls_by_request[input.request_id] : []'
  - title: No tracked calls for this request
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1551-1552
    if: size(vars.calls) == 0
    then:
    - return:
        canceled: 0
  - title: Dispose each call's store, cancelling its token source
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1553
    foreach: = vars.calls
    as: cid
    steps:
    - cancel: = 'tool-call-' + vars.cid
    - title: The token's cancellation denies an invocation still waiting for confirmation
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:538-540
      call: chat-tool-invocation.confirm-with
      input:
        call_id: = vars.cid
        reason: denied
      fill: true
  - title: Forget the request's calls
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1554
    set:
      state.calls_by_request: = omit(state.calls_by_request, input.request_id)
  - return:
      canceled: = size(vars.calls)
- component: language-model-tools-service
  name: invoke-tool
  kind: function
  summary: 'Invokes a tool: refuses stale requests and unknown tools, activates the contributing extension, applies auto-approval and the confirmation, then runs the implementation (extension tools on the extension host, MCP tools through McpToolImplementation) under a per-call cancellation token.'
  sources:
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:493-815
  request:
    type: object
    required:
    - tool_id
    - call_id
    properties:
      tool_id:
        type: string
        examples:
        - vscode_fetchWebPage_internal
      call_id:
        type: string
        examples:
        - call_1
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      chat_request_id:
        type: string
        default: ''
      request_complete:
        type: boolean
        default: false
      parameters:
        type: object
  response:
    type: object
    properties:
      outcome:
        type: string
      confirmed_by:
        type: string
      content:
        type: string
  errors:
  - code: canceled
    status: 0
    retryable: false
  - code: tool-not-contributed
    status: 0
    retryable: false
  - code: tool-no-implementation
    status: 0
    retryable: false
  behavior:
  - title: Ignore a tool call for a cancelled or completed request
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:502-505
    if: input.request_complete
    then:
    - fail:
        code: canceled
        message: Canceled
  - title: Track the call under its chat request so the request's cancellation reaches it
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:526-533
    if: input.chat_request_id != ''
    then:
    - set:
        vars.cbr: '= has(state.calls_by_request) ? state.calls_by_request : {}'
    - set:
        state.calls_by_request: '= merge(vars.cbr, {input.chat_request_id: (input.chat_request_id in vars.cbr ? vars.cbr[input.chat_request_id] : []) + [input.call_id]})'
  - title: Unknown tool
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:579-582
    if: '!(input.tool_id in state.tools)'
    then:
    - fail:
        code: tool-not-contributed
        message: = 'Tool ' + input.tool_id + ' was not contributed'
  - set:
      vars.tool: = state.tools[input.tool_id]
  - title: No implementation yet, so activate the contributing extension
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:584-592
    if: '!vars.tool.has_impl'
    then:
    - call: extension-service.activate-by-event
      input:
        activation_event: = 'onLanguageModelTool:' + input.tool_id
      fill: true
    - title: Still no implementation registered
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:589-591
      if: '!state.tools[input.tool_id].has_impl'
      then:
      - fail:
          code: tool-no-implementation
          message: = 'Tool ' + input.tool_id + ' does not have an implementation registered.'
  - title: Decide auto-confirmation
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:948
    call: language-model-tools-service.should-auto-confirm
    input:
      tool_id: = input.tool_id
    as: auto
    fill: true
  - title: Create the tool invocation part in the response
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:651-658
    call: chat-tool-invocation.begin
    input:
      call_id: = input.call_id
      tool_id: = input.tool_id
      needs_confirmation: = vars.tool.needs_confirmation
      auto_confirmed: = vars.auto.value.reason
    fill: true
  - if: vars.tool.needs_confirmation
    then:
    - title: Wait for the user's confirmation (or the auto-confirmation)
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:679-686
      call: chat-tool-invocation.await-confirmation
      input:
        call_id: = input.call_id
      as: conf
      fill: true
    - title: Denied
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:684-686
      if: vars.conf.value.kind == 'denied'
      then:
      - fail:
          code: canceled
          message: Canceled
    - title: Skipped; the tool does not run
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:687-695
      if: vars.conf.value.kind == 'skipped'
      then:
      - return:
          outcome: skipped
          content: The user chose to skip the tool call, they want to proceed without running it
    - set:
        vars.confirmed_by: = vars.conf.value.kind
    else:
    - set:
        vars.confirmed_by: '= vars.auto.value.reason != '''' ? vars.auto.value.reason : ''confirmation-not-needed'''
  - title: Run the extension tool's implementation on the extension host, under the call's token
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:741-745
    if: vars.tool.source == 'extension'
    then:
    - call: ext-host-language-model-tools.invoke-tool
      'on': = 'eh' + self.substring(1)
      token: = 'tool-call-' + input.call_id
      input:
        tool_id: = input.tool_id
        call_id: = input.call_id
        parameters: = input.parameters
      fill: true
  - title: Run an MCP tool through its McpToolImplementation (registered by McpLanguageModelToolContribution)
    source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:118-121
    if: vars.tool.source == 'mcp'
    then:
    - call: mcp-tool-implementation.invoke
      token: = 'tool-call-' + input.call_id
      input:
        server_id: '= has(vars.tool.server_id) && vars.tool.server_id != '''' ? vars.tool.server_id : input.tool_id.split(''_'')[1]'
        tool: = vars.tool.reference_name
      fill: true
  - call: chat-tool-invocation.complete
    input:
      call_id: = input.call_id
    fill: true
  - title: Dispose the call's store and drop it from its request's tracked calls
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1533-1547
    if: input.chat_request_id != '' && has(state.calls_by_request) && input.chat_request_id in state.calls_by_request
    then:
    - set:
        state.calls_by_request: '= merge(state.calls_by_request, {input.chat_request_id: state.calls_by_request[input.chat_request_id].filter(c, c != input.call_id)})'
  - return:
      outcome: completed
      confirmed_by: = vars.confirmed_by
- component: mcp-tool-implementation
  name: invoke
  kind: function
  summary: McpToolImplementation.invoke (boundary; owner agents).
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:265-300
  attributes:
    boundary: true
    owner: agents
  request:
    type: object
    properties:
      server_id:
        type: string
        examples:
        - github
        default: github
      tool:
        type: string
        examples:
        - search_issues
    required:
    - server_id
    - tool
  response:
    type: object
    properties:
      content:
        type: array
