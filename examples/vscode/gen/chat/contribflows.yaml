flows:
- id: chat-contributions-startup
  name: Chat contributions at workbench startup
  description: The workbench contribution registry (workbench-shell) instantiates every chat contribution by phase; the extension point handlers then see the contributed participants, tools, providers and
    session types.
  entry:
    caller: workbench
    interface: chat.instantiate-contributions
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3360
scenarios:
- id: chat-contributions-startup-all
  flow: chat-contributions-startup
  fixtures:
  - one-window-folder
  state:
    chat-slash-command-service:
      commands: {}
  expect:
  - result.ok && result.value.instantiated == 138
  - calls['chat-setup-contribution.constructor'] == 1 && calls['inline-chat-controller.constructor'] == 1
  - trace.filter(e, e.type == 'call.start' && e.interface.endsWith('.constructor')).size() == 138
  - trace.exists(e, e.type == 'call.start' && e.interface == 'language-models-service.handle-language-model-chat-providers-extension-point')
  - '''clear'' in state[''chat-slash-command-service@w1''].commands && ''rename'' in state[''chat-slash-command-service@w1''].commands'
