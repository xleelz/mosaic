seed:
  main:
    "code-editor-widget@w1": {focused: "file:///work/app/src/main.ts", read_only: false}
    "text-model@w1":
      models:
        "file:///work/app/src/main.ts": {value: "import { add } from './util';\nconsole.log(add(1, 2));\n", version_id: 1, alternative_version_id: 1, language_id: typescript}
    "cursors-controller@w1": {line: 1, column: 1}
  dirty:
    "code-editor-widget@w1": {focused: "file:///work/app/src/main.ts", read_only: false}
    "text-model@w1":
      models:
        "file:///work/app/src/main.ts": {value: "import { add } from './util';\nconsole.log(add(1, 2))\n", version_id: 2, alternative_version_id: 2, language_id: typescript}
    "cursors-controller@w1": {line: 1, column: 1}
  providers:
    "language-features-service@w1":
      providers:
        completion: [{handle: 1, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        hover: [{handle: 2, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        codeAction: [{handle: 3, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        documentFormatting: [{handle: 4, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        documentRangeFormatting: [{handle: 5, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        definition: [{handle: 6, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        references: [{handle: 8, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        rename: [{handle: 9, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        foldingRange: [{handle: 10, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]
        codeLens: [{handle: 11, language: typescript, extension_id: vscode.typescript-language-features, group: 10}]

scenarios:
  # ---- typing, undo, redo ----
  - id: editor-type-text-then-read
    name: Typing inserts at the cursor and bumps the version
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-type-text, as: t}
      - {flow: editor-read-model, as: r}
    expect:
      - "steps.r.result.value.value.startsWith('// import { add }')"
      - "steps.r.result.value.version_id == 2 && steps.r.result.value.alternative_version_id == 2"
      - "state['cursors-controller@w1'].column == 4"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'edit-stack.push-edit-operation')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.on-model-content-changed' && e.input.resource == 'file:///work/app/src/main.ts' && !e.input.is_undoing_or_redoing)"
  - id: editor-type-text-read-only
    name: Typing into a read-only editor shows the read-only message and edits nothing
    flow: editor-type-text
    fixtures: [one-window-folder]
    x_seed: [main]
    state: {"code-editor-widget@w1": {read_only: true}}
    expect:
      - "result.ok"
      - "state['message-controller@w1'].message == 'Cannot edit in read-only editor'"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
      - "state['code-editor-widget@w1'].readonly_attempts == 1"
  - id: editor-type-text-no-model
    name: Typing with no editor model does nothing
    flow: editor-type-text
    fixtures: [one-window-folder]
    expect:
      - "result.ok && calls['view-model.type'] == 0"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'text-model.apply-edits')"
  - id: editor-type-text-empty
    name: Typing an empty string is a no-op
    flow: editor-type-text
    fixtures: [one-window-folder]
    x_seed: [main]
    input: {args: {text: ""}}
    expect:
      - "result.ok && calls['view-model.type'] == 0"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
  - id: editor-type-text-model-disposed
    name: An editor pointing at a disposed model fails with 'Model is disposed!'
    flow: editor-type-text
    fixtures: [one-window-folder]
    x_seed: [main]
    state: {"code-editor-widget@w1": {focused: "file:///work/app/src/gone.ts"}}
    expect:
      - "!result.ok && result.error.code == 'model-is-disposed'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'text-model.apply-edits')"
  - id: editor-type-undo-redo
    name: Type, undo restores the text and the alternative version, redo re-applies
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-type-text, as: t}
      - {flow: editor-type-text, as: t2, input: {args: {text: "x"}}}
      - {flow: editor-run-command, as: u, input: {command_id: undo}}
      - {flow: editor-read-model, as: r1}
      - {flow: editor-run-command, as: rd, input: {command_id: redo}}
      - {flow: editor-read-model, as: r2}
    expect:
      - "steps.r1.result.value.value == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""
      - "steps.r1.result.value.alternative_version_id == 1 && steps.r1.result.value.version_id == 4"
      - "steps.r2.result.value.value.startsWith('// ximport')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'undo-redo-service.undo')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.on-model-content-changed' && e.input.is_undoing_or_redoing && e.input.alternative_version_id == 1)"
  - id: editor-undo-nothing
    name: Undo with an empty stack changes nothing
    flow: editor-run-command
    fixtures: [one-window-folder]
    x_seed: [main]
    input: {command_id: undo}
    expect:
      - "result.ok && result.value.ran"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'edit-stack.undo' && e.output.undone == false)"
  - id: editor-undo-redo-read-only
    name: Undo and redo do nothing in a read-only editor
    fixtures: [one-window-folder]
    x_seed: [main]
    state: {"code-editor-widget@w1": {read_only: true}}
    steps:
      - {flow: editor-run-command, as: u, input: {command_id: undo}}
      - {flow: editor-run-command, as: r, input: {command_id: redo}}
    expect:
      - "steps.u.result.ok && steps.r.result.ok"
      - "!trace.exists(e, e.type == 'call.start' && e.interface in ['text-model.undo', 'text-model.redo'])"
  - id: editor-redo-nothing
    name: Redo with nothing undone changes nothing
    flow: editor-run-command
    fixtures: [one-window-folder]
    x_seed: [main]
    input: {command_id: redo}
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'edit-stack.redo' && e.output.redone == false)"
  # ---- command dispatch ----
  - id: editor-run-command-unknown
    name: An unregistered command id is command-not-found
    flow: editor-run-command
    fixtures: [one-window-folder]
    input: {command_id: editor.action.doesNotExist}
    expect:
      - "!result.ok && result.error.code == 'command-not-found'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'code-editor-widget.has-text-focus')"
  - id: editor-run-command-no-editor
    name: Without a focused editor an editor command does nothing
    flow: editor-run-command
    fixtures: [one-window-folder]
    input: {command_id: editor.action.transformToUppercase}
    expect:
      - "result.ok && !result.value.ran && result.value.reason == 'no-editor'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'lines-operations.cmd-editor-action-transformtouppercase')"
  - id: editor-run-command-precondition
    name: A writable-only command on a read-only editor fails its precondition
    flow: editor-run-command
    fixtures: [one-window-folder]
    x_seed: [main]
    state: {"code-editor-widget@w1": {read_only: true}}
    input: {command_id: editor.action.transformToUppercase}
    expect:
      - "result.ok && !result.value.ran && result.value.reason == 'precondition'"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
  - id: editor-run-command-uppercase-then-read
    name: Transform to uppercase edits the line between undo stops
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-run-command, as: c, input: {command_id: editor.action.transformToUppercase}}
      - {flow: editor-read-model, as: r}
    expect:
      - "steps.c.result.value.ran"
      - "steps.r.result.value.value.startsWith(\"IMPORT { ADD } FROM './UTIL';\\nconsole\")"
      - "state['code-editor-widget@w1'].last_command == 'editor.action.transformToUppercase'"
  - id: editor-run-command-execute-edits-read-only
    name: executeEdits on a read-only editor is refused
    fixtures: [one-window-folder]
    x_seed: [main]
    state: {"code-editor-widget@w1": {read_only: true}}
    steps:
      - {interface: lines-operations.cmd-editor-action-transformtouppercase, caller: user, as: c, input: {uri: "file:///work/app/src/main.ts", read_only: true}}
    expect:
      - "steps.c.result.ok"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'view-model.execute-edits')"
  - id: editor-execute-commands-read-only
    name: executeCommands and view-model edits on a read-only editor hit the view model's readOnly gate
    fixtures: [one-window-folder]
    x_seed: [main]
    state:
      "code-editor-widget@w1": {read_only: true}
      "text-model@w1": {models: {"file:///work/lib/a.ts": {value: "x", version_id: 1, alternative_version_id: 1, language_id: typescript}}}
    steps:
      - {interface: insert-final-new-line-action.cmd-editor-action-insertfinalnewline, caller: user, as: c, input: {uri: "file:///work/lib/a.ts", read_only: true}}
      - {interface: view-model.execute-edits, caller: user, as: v, input: {uri: "file:///work/lib/a.ts", edits: [], read_only: true, source: test}}
      - {interface: text-model.apply-edits, caller: user, as: n, input: {uri: "file:///work/lib/a.ts", edits: [{range: {}, text: "ignored"}]}}
      - {interface: code-editor-widget.trigger, caller: user, as: cut, input: {handler_id: cut}}
    expect:
      - "steps.c.result.ok && !steps.v.result.value.applied && !steps.n.result.value.changed && !steps.cut.result.value.handled"
      - "state['code-editor-widget@w1'].readonly_attempts == 2"
      - "state['text-model@w1'].models['file:///work/lib/a.ts'].version_id == 1"
  - id: editor-insert-final-newline
    name: Insert final new line only when missing
    fixtures: [one-window-folder]
    x_seed: [main]
    state:
      "text-model@w1": {models: {"file:///work/lib/a.ts": {value: "x", version_id: 1, alternative_version_id: 1, language_id: typescript}}}
    steps:
      - {flow: editor-run-command, as: a, input: {command_id: editor.action.insertFinalNewLine}}
      - {interface: insert-final-new-line-action.cmd-editor-action-insertfinalnewline, caller: user, as: b, input: {uri: "file:///work/lib/a.ts", read_only: false}}
      - {flow: editor-read-model, as: r, input: {uri: "file:///work/lib/a.ts"}}
    expect:
      - "!steps.a.result.value.ran || true"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
      - "steps.r.result.value.value == 'x\\n'"
  - id: editor-comment-line-toggle
    name: Toggle line comment adds then removes the TypeScript line comment
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-run-command, as: a, input: {command_id: editor.action.commentLine}}
      - {flow: editor-read-model, as: r1}
      - {flow: editor-run-command, as: b, input: {command_id: editor.action.commentLine}}
      - {flow: editor-read-model, as: r2}
    expect:
      - "steps.r1.result.value.value.startsWith('// import')"
      - "steps.r2.result.value.value.startsWith('import')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'language-configuration-service.get-language-configuration')"
  - id: editor-comment-line-no-token
    name: A language without a line comment token is not commented
    flow: editor-run-command
    fixtures: [one-window-folder]
    x_seed: [main]
    state:
      "text-model@w1": {models: {"file:///work/app/src/main.ts": {language_id: markdown}}}
    input: {command_id: editor.action.commentLine}
    expect:
      - "result.ok"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
  - id: editor-comment-line-unknown-language
    name: An unknown language has no comment configuration
    fixtures: [one-window-folder]
    x_seed: [main]
    state:
      "text-model@w1": {models: {"file:///work/app/src/main.ts": {language_id: plaintext}}}
    steps:
      - {flow: editor-run-command, as: c, input: {command_id: editor.action.commentLine}}
    expect:
      - "steps.c.result.ok"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
  - id: editor-delete-left
    name: deleteLeft removes the character before the cursor; at column 1 nothing
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-run-command, as: a, input: {command_id: deleteLeft}}
      - {interface: cursors-controller.set-cursor-states, caller: user, as: mv, input: {source: test, line: 1, column: 3}}
      - {flow: editor-run-command, as: b, input: {command_id: deleteLeft}}
      - {flow: editor-read-model, as: r}
    expect:
      - "steps.r.result.value.value.startsWith('iport')"
      - "state['cursors-controller@w1'].column == 2"
  - id: editor-register-language-config
    name: A registered language configuration is used by comment line
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {interface: language-configuration-service.register, caller: exthost-bridge, as: reg, input: {language_id: typescript, line_comment: "#"}}
      - {flow: editor-run-command, as: c, input: {command_id: editor.action.commentLine}}
      - {flow: editor-read-model, as: r}
    expect:
      - "steps.r.result.value.value.startsWith('# import')"
      - "state['language-configuration-service@w1'].configurations.typescript.line_comment == '#'"
  - id: editor-api-command-format-provider
    name: _executeFormatDocumentProvider asks the formatting providers without a focused editor
    flow: editor-run-command
    fixtures: [one-window-folder]
    x_seed: [providers]
    input: {command_id: _executeFormatDocumentProvider, args: {resource: "file:///work/app/src/main.ts"}}
    expect:
      - "result.ok && result.value.reason == 'api'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.provide-document-formatting-edits' && e.instance == 'eh1')"
      - "calls['code-editor-widget.has-text-focus'] == 0"
  - id: editor-api-command-provider-error
    name: A failing provider yields no result instead of failing the API command
    flow: editor-run-command
    fixtures: [one-window-folder]
    x_seed: [providers]
    input: {command_id: _executeCodeLensProvider, args: {resource: "file:///work/app/src/main.ts"}}
    faults: [{target: ext-host-language-features.provide-code-lenses, type: error, code: provider-threw}]
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'language-features-service.invoke-providers' && size(e.output.results) == 0)"
  - id: editor-api-command-no-providers
    name: Without providers an API command returns an empty result
    flow: editor-run-command
    fixtures: [one-window-folder]
    input: {command_id: _executeLinkProvider, args: {resource: "file:///work/app/src/main.ts"}}
    expect:
      - "result.ok"
      - "!trace.exists(e, e.type == 'call.start' && e.interface.startsWith('ext-host-language-features.'))"
  # ---- find ----
  - id: editor-find-replace-all-then-read
    name: Find counts matches, replace all replaces them in one undo step
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-find-replace, as: f}
      - {flow: editor-replace-all, as: ra}
      - {flow: editor-read-model, as: r}
    expect:
      - "steps.f.result.value.matches_count == 2"
      - "steps.ra.result.value.replaced"
      - "steps.r.result.value.value == \"import { sum } from './util';\\nconsole.log(sum(1, 2));\\n\""
      - "state['find-controller@w1'].matches_count == 0"
  - id: editor-replace-all-without-find
    name: Replace all before the find widget ever opened does nothing
    flow: editor-replace-all
    fixtures: [one-window-folder]
    x_seed: [main]
    expect:
      - "result.ok && !result.value.replaced"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
  - id: editor-replace-all-no-matches
    name: Replace all with no matches leaves the model alone
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-find-replace, as: f, input: {search_string: zzz}}
      - {flow: editor-replace-all, as: ra}
    expect:
      - "steps.f.result.value.matches_count == 0"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
  - id: editor-find-empty-and-toggles
    name: Empty search finds nothing; case toggles persist to workspace storage and re-search
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-find-replace, as: f, input: {search_string: ""}}
      - {flow: editor-run-command, as: t1, input: {command_id: toggleFindCaseSensitive}}
      - {flow: editor-run-command, as: t2, input: {command_id: toggleFindInSelection}}
      - {flow: editor-run-command, as: c, input: {command_id: closeFindWidget}}
    expect:
      - "steps.f.result.value.matches_count == 0"
      - "state['find-controller@w1'].match_case && !state['find-controller@w1'].widget_visible"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-db.workspace-write' && e.input.key == 'editor.matchCase')"
  - id: editor-find-replace-one
    name: Replace one replaces the first match
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-find-replace, as: f}
      - {flow: editor-run-command, as: r1, input: {command_id: editor.action.replaceOne}}
      - {flow: editor-read-model, as: r}
    expect:
      - "steps.r.result.value.value.startsWith('import { sum }') && steps.r.result.value.value.contains('log(add(')"
      - "state['find-controller@w1'].matches_count == 1"
  # ---- suggest ----
  - id: editor-register-provider-then-suggest
    name: A provider registered by the extension host bridge answers the next suggest
    fixtures: [one-window-folder]
    x_seed: [main]
    steps:
      - {flow: editor-register-provider, as: reg}
      - {flow: editor-trigger-suggest, as: s}
    expect:
      - "steps.reg.result.value.registered && steps.s.result.value.items == 1"
      - "state['suggest-model@w1'].session == 'open'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.provide-completion-items' && e.instance == 'eh1')"
  - id: editor-suggest-no-providers
    name: No completion provider leaves the suggest session idle
    flow: editor-trigger-suggest
    fixtures: [one-window-folder]
    x_seed: [main]
    expect:
      - "result.ok && result.value.items == 0"
      - "state['suggest-model@w1'].session == 'idle'"
  - id: editor-suggest-provider-fails
    name: A failing completion provider is swallowed
    flow: editor-trigger-suggest
    fixtures: [one-window-folder]
    x_seed: [main, providers]
    faults: [{target: ext-host-language-features.provide-completion-items, type: error, code: provider-threw}]
    expect:
      - "result.ok && result.value.items == 0"
      - "state['suggest-model@w1'].session == 'idle'"
  - id: editor-suggest-groups-stop-early
    name: The higher-scored group answers, so the lower group is never asked
    flow: editor-trigger-suggest
    fixtures: [one-window-folder]
    x_seed: [main]
    state:
      "language-features-service@w1": {providers: {completion: [{handle: 1, language: typescript, group: 10}, {handle: 2, language: "*", group: 5}]}}
    expect:
      - "result.ok && result.value.items == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.provide-completion-items').size() == 1"
  - id: editor-suggest-canceled
    name: A canceled request rejects with CancellationError
    fixtures: [one-window-folder]
    x_seed: [main, providers]
    steps:
      - {interface: suggest-model.provide-suggestion-items, caller: user, as: p, input: {uri: "file:///work/app/src/main.ts", language_id: typescript, token: {canceled: true}}}
    expect:
      - "!steps.p.result.ok && steps.p.result.error.code == 'canceled'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.provide-completion-items')"
  - id: editor-suggest-accept-then-read
    name: Accepting a suggestion inserts it, memorizes it and persists 500 ms later
    fixtures: [one-window-folder]
    x_seed: [main, providers]
    config: {editor-suggest-selection: recentlyUsed}
    steps:
      - {flow: editor-trigger-suggest, as: s}
      - {flow: editor-accept-suggestion, as: a}
      - {flow: editor-read-model, as: r}
    expect:
      - "steps.a.result.value.accepted && steps.r.result.value.value.startsWith('addimport')"
      - "state['suggest-memory-service@w1'].memory.last == 'add' && state['suggest-memory-service@w1'].persisted == 1"
      - "state['suggest-model@w1'].session == 'idle'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-db.workspace-write' && e.input.key == 'suggest/memories/recentlyUsed')"
  - id: editor-suggest-accept-recently-used
    name: With recentlyUsed the remembered item is preselected
    fixtures: [one-window-folder]
    x_seed: [main, providers]
    config: {editor-suggest-selection: recentlyUsed}
    state: {"suggest-memory-service@w1": {memory: {last: nothing-matches}}}
    steps:
      - {flow: editor-trigger-suggest, as: s}
      - {flow: editor-accept-suggestion, as: a}
    expect:
      - "steps.a.result.value.accepted"
      - "state['suggest-memory-service@w1'].memory.last == 'add'"
  - id: editor-suggest-accept-nothing
    name: Accept with no open session does nothing
    flow: editor-accept-suggestion
    fixtures: [one-window-folder]
    x_seed: [main]
    expect:
      - "result.ok && !result.value.accepted"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1"
  - id: editor-suggest-accept-with-command
    name: An item's command runs after insertion
    fixtures: [one-window-folder]
    x_seed: [main]
