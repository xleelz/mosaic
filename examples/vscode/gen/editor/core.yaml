  - component: language-features-service
    name: invoke-providers
    kind: function
    summary: "Ask every matching provider at once (Promise.all) over the extension host RPC; a provider error is swallowed (onUnexpectedExternalError) and yields no result"
    sources: ["src/vs/editor/contrib/gotoSymbol/browser/goToSymbol.ts:32-50", "src/vs/editor/contrib/hover/browser/getHover.ts:29-40"]
    request: EditorProviderCall
    response: EditorProviderResults
    behavior:
      - call: language-features-service.ordered
        input: {feature: "= input.feature", language_id: "= input.language_id"}
        as: o
      - if: "size(vars.o.value.providers) == 0"
        then: [{return: {results: [], provider_count: 0}}]
      - parallel: "= vars.o.value.providers"
        as: p
        steps:
          - call: "= 'ext-host-language-features.' + input.rpc"
            targets: []
            on: "= 'eh' + self.substring(1)"
            input: {handle: "= vars.p.handle", resource: "= input.resource", token: {canceled: false}}
            as: r
            on_error:
              - {title: "onUnexpectedExternalError: provider failure is logged, not propagated", source: "src/vs/editor/contrib/gotoSymbol/browser/goToSymbol.ts:43-46", return: null}
          - return: "= vars.r.value"
        join: {need: all}
        as_result: all
      - return: {results: "= vars.all.results.filter(x, x.ok && x.value != null).map(x, x.value)", provider_count: "= size(vars.o.value.providers)"}

