    sources: ["src/vs/editor/contrib/find/browser/findModel.ts:188-235", "src/vs/editor/contrib/find/browser/findModel.ts:81"]
    request: {type: object, required: [uri, search_string], properties: {uri: {type: string}, search_string: {type: string}, match_case: {type: boolean}}}
