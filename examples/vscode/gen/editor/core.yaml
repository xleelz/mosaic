    summary: "LanguageFeatureRegistry.register(selector, provider): called by the extension host bridge when an extension registers a provider"
    sources: ["src/vs/editor/common/languageFeatureRegistry.ts:66-90"]
    request: {type: object, required: [feature, handle, language], properties: {feature: {type: string, examples: [completion]}, handle: {type: integer, examples: [1]}, language: {type: string, examples: [typescript]}, extension_id: {type: string, examples: [vscode.typescript-language-features]}, group: {type: integer, default: 10}}}
    behavior:
