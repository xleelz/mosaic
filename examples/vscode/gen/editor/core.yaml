        source: "src/vs/editor/contrib/rename/browser/rename.ts:262-279"
        choice: input_result
        default: accept
        options:
          accept: [{set: {state.input_visible: false}}]
          cancel:
            - set: {state.input_visible: false}
            - return: {renamed: false, reason: canceled}
      - call: rename-skeleton.provide-rename-edits
        input: {uri: "= input.uri", providers: "= vars.o.value.providers", new_name: "= has(input.new_name) ? input.new_name : 'renamed'"}
        as: edits
        on_error:
          - title: "Provider error: 'Rename failed to compute edits'"
            source: "src/vs/editor/contrib/rename/browser/rename.ts:325-330"
            call: notification-service.notify
            input: {severity: error, message: "Rename failed to compute edits"}
          - return: {renamed: false, reason: compute-failed}
      - if: "vars.edits.value.reject_reason != ''"
        then:
          - title: "Edits rejected: info notification"
            source: "src/vs/editor/contrib/rename/browser/rename.ts:295-299"
            call: notification-service.notify
            input: {severity: info, message: "= vars.edits.value.reject_reason"}
          - return: {renamed: false, reason: rejected}
      - title: "Apply the workspace edit (undoredo.rename), preview when asked"
        source: "src/vs/editor/contrib/rename/browser/rename.ts:306-315"
        call: bulk-edit-service.apply
        input: {edits: "= vars.edits.value.edits", label: "= 'Renaming to ' + (has(input.new_name) ? input.new_name : 'renamed')", show_preview: false, respect_auto_save_config: true}
        as: applied
        on_error:
          - title: "'Rename failed to apply edits'"
            source: "src/vs/editor/contrib/rename/browser/rename.ts:319-323"
            call: notification-service.notify
            input: {severity: error, message: "Rename failed to apply edits"}
          - return: {renamed: false, reason: apply-failed}
      - return: {renamed: true, reason: applied}

  - component: rename-skeleton
    name: resolve-rename-location
    kind: function
    summary: "RenameSkeleton.resolveRenameLocation: ask providers in order; rejections are collected; with no prepared location the word at the cursor is used"
    sources: ["src/vs/editor/contrib/rename/browser/rename.ts:60-97"]
    request: {type: object, required: [uri, providers], properties: {uri: {type: string}, providers: {type: array, items: {type: object}}}}
    response: {type: object, properties: {text: {type: string}, reject_reason: {type: string}}}
    behavior:
      - set: {vars.rejects: []}
      - foreach: "= input.providers"
        as: p
        steps:
          - call: ext-host-language-features.resolve-rename-location
            on: "= 'eh' + self.substring(1)"
            input: {handle: "= vars.p.handle", resource: "= input.uri", token: {canceled: false}}
            as: r
          - if: "vars.r.value.reject_reason != ''"
            then:
              - set: {vars.rejects: "= vars.rejects + [vars.r.value.reject_reason]"}
              - continue: true
          - return: {text: "= vars.r.value.text", reject_reason: ""}
      - return: {text: "", reject_reason: "= vars.rejects.join('\\n')"}

  - component: rename-skeleton
    name: provide-rename-edits
    kind: function
    summary: "RenameSkeleton._provideRenameEdits: providers in order; 'No result.' or a rejection moves to the next; all failing joins the reasons"
    sources: ["src/vs/editor/contrib/rename/browser/rename.ts:99-120"]
    request: {type: object, required: [uri, providers, new_name], properties: {uri: {type: string}, providers: {type: array, items: {type: object}}, new_name: {type: string}}}
    response: {type: object, properties: {edits: {type: array, items: {type: object}}, reject_reason: {type: string}}}
    behavior:
      - set: {vars.rejects: []}
      - foreach: "= input.providers"
        as: p
        steps:
          - call: ext-host-language-features.provide-rename-edits
            on: "= 'eh' + self.substring(1)"
            input: {handle: "= vars.p.handle", resource: "= input.uri", new_name: "= input.new_name", token: {canceled: false}}
            as: r
          - if: "vars.r.value.reject_reason != ''"
            then:
              - set: {vars.rejects: "= vars.rejects + [vars.r.value.reject_reason]"}
              - continue: true
          - return: {edits: "= vars.r.value.edits", reject_reason: ""}
      - return: {edits: [], reject_reason: "= vars.rejects.join('\\n')"}

  # ---------------- go to symbol ----------------
  - component: symbol-navigation-action
    name: run
    kind: function
    summary: "SymbolNavigationAction.runEditorCommand: get locations; none -> 'No <kind> found' message; else peek (multiple results in peek mode) or open the first in an editor, keeping the rest for 'goto' mode"
    sources: ["src/vs/editor/contrib/gotoSymbol/browser/goToCommands.ts:105-167", "src/vs/editor/contrib/gotoSymbol/browser/goToCommands.ts:177-199"]
    request: {type: object, required: [uri, kind, rpc], properties: {uri: {type: string}, kind: {type: string, examples: [definition]}, rpc: {type: string, examples: [provide-definition]}, open_to_side: {type: boolean, default: false}, open_in_peek: {type: boolean, default: false}, preference: {type: string, default: ""}}}
    behavior:
      - call: text-model.get-value
        input: {uri: "= input.uri"}
        as: m
      - call: language-features-service.invoke-providers
        input: {feature: "= input.kind", rpc: "= input.rpc", resource: "= input.uri", language_id: "= vars.m.value.language_id"}
        as: locs
      - set:
          vars.refs: "= vars.locs.value.results.map(x, x.locations).flatten()"
          vars.pref: "= has(input.preference) && input.preference != '' ? input.preference : config['editor-goto-location-multiple-definitions']"
          vars.peek: "= has(input.open_in_peek) && input.open_in_peek"
      - if: "size(vars.refs) == 0"
        then:
          - title: "No result: show the no-result message"
            source: "src/vs/editor/contrib/gotoSymbol/browser/goToCommands.ts:140-145"
            call: message-controller.show-message
            input: {text: "= 'No ' + input.kind + ' found'"}
          - return: {opened: false, peek: false, count: 0}
      - if: "vars.peek || (vars.pref == 'peek' && size(vars.refs) > 1)"
        then:
          - title: "Open in peek"
            source: "src/vs/editor/contrib/gotoSymbol/browser/goToCommands.ts:180-181"
            call: references-controller.toggle-widget
            input: {count: "= size(vars.refs)"}
          - return: {opened: false, peek: true, count: "= size(vars.refs)"}
      - title: "Open the first reference (collapsed to its start)"
        source: "src/vs/editor/contrib/gotoSymbol/browser/goToCommands.ts:201-222"
        call: code-editor-service.open-code-editor
        input: {resource: "= vars.refs[0].uri", side_by_side: "= has(input.open_to_side) ? input.open_to_side : false", selection: "= vars.refs[0].range"}
      - if: "vars.pref == 'gotoAndPeek' && size(vars.refs) > 1"
        then:
          - call: references-controller.toggle-widget
            input: {count: "= size(vars.refs)"}
      - if: "vars.pref == 'goto'"
        then:
          - title: "Keep the remaining locations for gotoNextSymbolFromResult"
            source: "src/vs/editor/contrib/gotoSymbol/browser/goToCommands.ts:195-197"
            call: symbol-navigation-service.put
            input: {uri: "= vars.refs[0].uri", count: "= size(vars.refs)"}
      - return: {opened: true, peek: false, count: "= size(vars.refs)"}

  - component: references-controller
    name: toggle-widget
    kind: function
    summary: "ReferencesController.toggleWidget: show the references peek"
    sources: ["src/vs/editor/contrib/gotoSymbol/browser/peek/referencesController.ts:77-90"]
    request: {type: object, properties: {count: {type: integer}}}
    behavior:
      - set: {state.peek_visible: true, state.references: "= has(input.count) ? input.count : 0"}

  - component: references-controller
    name: close-widget
    kind: function
    summary: "closeReferenceSearch: close the peek"
    sources: ["src/vs/editor/contrib/gotoSymbol/browser/peek/referencesController.ts:362"]
    behavior:
      - set: {state.peek_visible: false}

  - component: symbol-navigation-service
    name: put
    kind: function
    summary: "SymbolNavigationService.put: a single reference resets; otherwise remember the anchor and the remaining locations"
    sources: ["src/vs/editor/contrib/gotoSymbol/browser/symbolNavigation.ts:64-70"]
    request: {type: object, required: [uri, count], properties: {uri: {type: string}, count: {type: integer}}}
    behavior:
      - if: "input.count <= 1"
        then:
          - {set: {state.anchor: "", state.remaining: 0}}
          - return: {kept: false}
      - set: {state.anchor: "= input.uri", state.remaining: "= input.count - 1"}
      - return: {kept: true}

  # ---------------- folding ----------------
  - component: folding-controller
    name: get-folding-model
    kind: function
    summary: "getFoldingModel / triggerFoldingModelChanged: folding off -> no model; regions from the syntax provider when foldingStrategy is auto and a folding range provider exists, else from indentation"
    sources: ["src/vs/editor/contrib/folding/browser/folding.ts:276-330"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {enabled: {type: boolean}, regions: {type: object}}}
    behavior:
      - if: "!config['editor-folding']"
        then:
          - {title: "Folding disabled: no folding model", source: "src/vs/editor/contrib/folding/browser/folding.ts:130", return: {enabled: false, regions: {}}}
      - call: folding-model.get-regions
        input: {uri: "= input.uri"}
        as: cur
      - if: "vars.cur.value.computed"
        then: [{return: {enabled: true, regions: "= vars.cur.value.regions"}}]
      - call: text-model.get-value
        input: {uri: "= input.uri"}
        as: m
      - call: language-features-service.ordered
        input: {feature: foldingRange, language_id: "= vars.m.value.language_id"}
        as: o
      - if: "config['editor-folding-strategy'] != 'indentation' && size(vars.o.value.providers) > 0"
        then:
          - title: "SyntaxRangeProvider over the folding range providers"
            source: "src/vs/editor/contrib/folding/browser/folding.ts:286-290"
            call: ext-host-language-features.provide-folding-ranges
            on: "= 'eh' + self.substring(1)"
            input: {handle: "= vars.o.value.providers[0].handle", resource: "= input.uri", token: {canceled: false}}
            as: ranges
          - set: {vars.list: "= vars.ranges.value.ranges"}
        else:
          - title: "IndentRangeProvider fallback"
            source: "src/vs/editor/contrib/folding/browser/folding.ts:284-285"
            call: indent-range-provider.compute
            input: {uri: "= input.uri"}
            as: ind
          - set: {vars.list: "= vars.ind.value.ranges"}
      - call: folding-model.update
        input: {uri: "= input.uri", ranges: "= vars.list"}
        as: u
      - return: {enabled: true, regions: "= vars.u.value.regions"}

  - component: indent-range-provider
    name: compute
    kind: function
    summary: "IndentRangeProvider.compute: regions from indentation changes (not computed in the model; returns its schema example)"
    sources: ["src/vs/editor/contrib/folding/browser/indentRangeProvider.ts"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {ranges: {type: array, examples: [[{start: 1, end: 2}]], items: {type: object, properties: {start: {type: integer}, end: {type: integer}}}}}}

  - component: folding-controller
    name: on-did-change-model-content
    kind: function
    summary: "onDidChangeModelContent -> triggerFoldingModelChanged: the regions are recomputed (modeled as dropping them so the next read recomputes)"
    sources: ["src/vs/editor/contrib/folding/browser/folding.ts:298-301"]
    subscribe: [text-model.on-did-change-content]
    request: {type: object, properties: {uri: {type: string}, version_id: {type: integer}, is_undoing: {type: boolean}, is_redoing: {type: boolean}}}
    behavior:
      - call: folding-model.invalidate
        input: {uri: "= input.uri"}

  - component: folding-model
    name: invalidate
    kind: function
    summary: "Drop the regions of a changed model until the folding model update reruns"
    sources: ["src/vs/editor/contrib/folding/browser/folding.ts:305-318"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    behavior:
      - if: "input.uri in state.regions"
        then:
          - set: {state.regions: "= omit(state.regions, input.uri)"}

  - component: folding-model
    name: get-regions
    kind: function
    summary: "Read the folding regions of a model with their collapsed state"
    sources: ["src/vs/editor/contrib/folding/browser/foldingModel.ts:33-50"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {computed: {type: boolean}, regions: {type: object}}}
    behavior:
      - if: "!(input.uri in state.regions)"
        then: [{return: {computed: false, regions: {}}}]
      - return: {computed: true, regions: "= state.regions[input.uri]"}

  - component: folding-model
    name: update
    kind: function
    summary: "FoldingModel.update: install new regions, keeping collapsed state of regions that start on the same line"
    sources: ["src/vs/editor/contrib/folding/browser/foldingModel.ts:132-160"]
    request: {type: object, required: [uri, ranges], properties: {uri: {type: string}, ranges: {type: array, items: {type: object}}}}
    response: {type: object, properties: {regions: {type: object}}}
    behavior:
      - set:
          vars.old: "= input.uri in state.regions ? state.regions[input.uri] : {}"
      - set:
          state.regions: "= merge(state.regions, {input.uri: input.ranges.transformMapEntry(i, r, {string(r.start): {'end': r.end, 'collapsed': string(r.start) in vars.old ? vars.old[string(r.start)].collapsed : false}})})"
      - return: {regions: "= state.regions[input.uri]"}

  - component: folding-model
    name: toggle-collapse-state
    kind: function
    summary: "FoldingModel.toggleCollapseState / setCollapseState*: set collapsed on the regions an action selects, then fire onDidChange"
    sources: ["src/vs/editor/contrib/folding/browser/foldingModel.ts:54-95"]
    request: {type: object, required: [uri, action, line], properties: {uri: {type: string}, action: {type: string, enum: [fold, unfold, toggle, fold-all, unfold-all]}, line: {type: integer}}}
    response: {type: object, properties: {changed: {type: integer}}}
    behavior:
      - set:
          vars.rs: "= state.regions[input.uri]"
      - set:
          vars.hit: "= vars.rs.filter(k, int(k) <= input.line && vars.rs[k].end >= input.line)"
      - set:
          vars.target: "= input.action in ['fold-all', 'unfold-all'] ? vars.rs.map(k, k) : (size(vars.hit) > 0 ? [string(vars.hit.map(k, int(k)).sort().reverse()[0])] : [])"
      - if: "size(vars.target) == 0"
        then: [{return: {changed: 0}}]
      - set:
          state.regions: "= merge(state.regions, {input.uri: vars.rs.transformMap(k, r, k in vars.target ? merge(r, {'collapsed': input.action in ['fold', 'fold-all'] ? true : (input.action == 'toggle' ? !r.collapsed : false)}) : r)})"
      - return: {changed: "= size(vars.target)"}

  - component: folding-controller
    name: run-folding-action
    kind: function
    summary: "FoldingAction.runEditorCommand: wait for the folding model, invoke the action on the selected lines, reveal the selection"
    sources: ["src/vs/editor/contrib/folding/browser/folding.ts:550-566"]
    request: {type: object, required: [uri, action], properties: {uri: {type: string}, action: {type: string, enum: [fold, unfold, toggle, fold-all, unfold-all]}, line: {type: integer, default: 1}}}
    behavior:
      - call: folding-controller.get-folding-model
        input: {uri: "= input.uri"}
        as: fm
      - if: "!vars.fm.value.enabled"
        then:
          - {title: "No folding model: the action does nothing", source: "src/vs/editor/contrib/folding/browser/folding.ts:556-557", return: {changed: 0}}
      - call: folding-model.toggle-collapse-state
        input: {uri: "= input.uri", action: "= input.action", line: "= has(input.line) ? input.line : 1"}
        as: t
      - return: "= vars.t.value"

