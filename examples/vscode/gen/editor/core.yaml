    name: replace-all
    kind: function
    summary: "FindModelBoundToEditorModel.replaceAll: nothing without matches; else one ReplaceAllCommand executed between undo stops, then research"
    sources: ["src/vs/editor/contrib/find/browser/findModel.ts:515-530", "src/vs/editor/contrib/find/browser/findModel.ts:572-584"]
    request: {type: object, required: [uri, search_string, replace_string, matches_count], properties: {uri: {type: string}, search_string: {type: string}, replace_string: {type: string}, matches_count: {type: integer}, match_case: {type: boolean}}}
    response: {type: object, properties: {replaced: {type: integer}, matches_count: {type: integer}}}
    behavior:
