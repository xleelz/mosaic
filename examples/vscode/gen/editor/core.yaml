    kind: function
    summary: "LanguageFeatureRegistry.ordered(model): providers whose selector matches the model's language (or '*'), best score first"
    sources: ["src/vs/editor/common/languageFeatureRegistry.ts:126-130", "src/vs/editor/common/languageFeatureRegistry.ts:96-110"]
    request: {type: object, required: [feature, language_id], properties: {feature: {type: string}, language_id: {type: string}}}
