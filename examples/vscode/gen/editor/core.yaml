    kind: function
    summary: "SuggestModel.trigger: cancel the previous request, request completion items, open the session or go back to idle when empty"
    sources: ["src/vs/editor/contrib/suggest/browser/suggestModel.ts:535-560"]
    request: {type: object, required: [uri], properties: {uri: {type: string}, auto: {type: boolean}}}
    response: {type: object, properties: {items: {type: integer}}}
