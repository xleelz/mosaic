schemas:
  - id: EditorRange
    summary: "An IRange: 1-based line and column, end exclusive (src/vs/editor/common/core/range.ts)"
    schema:
      type: object
      required: [start_line, start_column, end_line, end_column]
      properties:
        start_line: {type: integer, minimum: 1, examples: [1]}
        start_column: {type: integer, minimum: 1, examples: [1]}
        end_line: {type: integer, minimum: 1, examples: [1]}
        end_column: {type: integer, minimum: 1, examples: [1]}
  - id: EditorCommandInvocation
    summary: "What EditorCommand.runEditorCommand hands a command handler: the focused editor's model and the args"
    schema:
      type: object
      properties:
        command_id: {type: string, examples: ["cursorLeft"]}
        uri: {type: string, examples: ["file:///work/app/src/main.ts"]}
        read_only: {type: boolean, default: false}
        args: {description: "the command arguments: an object, or the positional list the command service passes"}
  - id: EditorProviderCall
    summary: "A language-feature query: which feature, which ext host RPC, for which model"
    schema:
      type: object
      required: [feature, rpc, resource, language_id]
      properties:
        feature: {type: string, examples: [hover]}
        rpc: {type: string, examples: [provide-hover]}
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        language_id: {type: string, examples: [typescript]}
        args: {type: object}
  - id: EditorProviderResults
    schema:
      type: object
      properties:
        results: {type: array, items: {type: object}}
        provider_count: {type: integer}

