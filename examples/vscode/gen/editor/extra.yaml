interfaces:
  - component: code-editor-widget
    name: reveal
    kind: function
    summary: "Scroll commands (scrollLineUp, editorScroll, revealLine ...) change only the viewport scroll position"
    sources: ["src/vs/editor/browser/coreCommands.ts:1427-1430"]
    request: {type: object, properties: {source: {type: string, examples: [scrollLineDown]}}}
    behavior:
      - set: {state.last_command: "= has(input.source) ? input.source : 'reveal'"}

  - component: find-controller
    name: move-to-match
    kind: function
    summary: "MatchFindAction: start the find model from the selection when there is none, then move to the next/previous match"
    sources: ["src/vs/editor/contrib/find/browser/findController.ts:703-716", "src/vs/editor/contrib/find/browser/findController.ts:388-394"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    behavior:
      - if: "!state.has_model"
        then:
          - call: find-controller.start
            input: {uri: "= input.uri"}
      - return: {moved: "= state.matches_count > 0"}

  - component: find-controller
    name: replace-one
    kind: function
    summary: "CommonFindController.replace -> FindModelBoundToEditorModel.replace: replace the current match, then research"
    sources: ["src/vs/editor/contrib/find/browser/findController.ts:412-418", "src/vs/editor/contrib/find/browser/findModel.ts:481-500"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    behavior:
      - if: "!state.has_model || state.matches_count == 0"
        then: [{return: {replaced: false}}]
      - call: text-model.get-value
        input: {uri: "= input.uri"}
        as: m
      - set: {vars.lines: "= vars.m.value.value.split('\\n')"}
      - call: code-editor-widget.execute-commands
        input:
          uri: "= input.uri"
          source: replace
          edits: [{range: {start_line: 1, start_column: 1, end_line: "= size(vars.lines)", end_column: "= size(vars.lines[size(vars.lines) - 1]) + 1"}, text: "= vars.m.value.value.replace(state.search_string, state.replace_string, 1)"}]
      - call: find-model.research
        input: {uri: "= input.uri", search_string: "= state.search_string", match_case: "= state.match_case"}
        as: r
      - set: {state.matches_count: "= vars.r.value.matches_count"}
      - return: {replaced: true}

  - component: content-hover-controller
    name: hide
    kind: function
    summary: "HideContentHoverAction: hideContentHover"
    sources: ["src/vs/editor/contrib/hover/browser/hoverActions.ts:166-168"]
    behavior:
      - set: {state.visible: false, state.parts: 0}

  - component: editor-cancellation-tokens
    name: cancel
    kind: function
    summary: "IEditorCancellationTokens.cancel(editor): pop and cancel the editor's newest token source"
    sources: ["src/vs/editor/contrib/editorState/browser/keybindingCancellation.ts:60-70"]
    behavior:
      - set: {state.canceled: "= state.canceled + 1"}

  - component: inline-completions-service
    name: snooze
    kind: function
    summary: "InlineCompletionsService.snooze: extend the snooze end by the duration (negative durations are a bug)"
    sources: ["src/vs/editor/browser/services/inlineCompletionsService.ts:90-106"]
    request: {type: object, properties: {duration_ms: {type: integer, default: 300000}}}
    errors: [{code: invalid-snooze-duration, status: 0, retryable: false}]
    behavior:
      - if: "input.duration_ms < 0"
        then:
          - {title: "Duration must be non-negative", source: "src/vs/editor/browser/services/inlineCompletionsService.ts:95-97", fail: {code: invalid-snooze-duration, message: "Invalid snooze duration"}}
      - set: {state.snooze_until: "= (state.snooze_until > now ? state.snooze_until : now) + input.duration_ms"}

  - component: inline-completions-service
    name: get-snooze-time-left
    kind: function
    summary: "snoozeTimeLeft: max(0, snoozeTimeEnd - now)"
    sources: ["src/vs/editor/browser/services/inlineCompletionsService.ts:69-74"]
    response: {type: object, properties: {time_left_ms: {type: integer}}}
    behavior:
      - return: {time_left_ms: "= state.snooze_until > now ? state.snooze_until - now : 0"}

  - component: inline-completions-service
    name: cancel-snooze
    kind: function
    summary: "InlineCompletionsService.cancelSnooze"
    sources: ["src/vs/editor/browser/services/inlineCompletionsService.ts:130-136"]
    behavior:
      - set: {state.snooze_until: 0}

  - component: worker-based-diff-provider-factory-service
    name: compute-diff
    kind: function
    summary: "WorkerBasedDocumentDiffProvider.computeDiff (from createDiffProvider): cached by URIs and versions, else computed in the editor worker"
    sources: ["src/vs/editor/browser/widget/diffEditor/diffProviderFactoryService.ts:23-28", "src/vs/editor/browser/widget/diffEditor/diffProviderFactoryService.ts:110-119"]
    request: {type: object, required: [original, modified], properties: {original: {type: string}, modified: {type: string}}}
    behavior:
      - call: editor-worker-service.compute-diff
        input: {original: "= input.original", modified: "= input.modified"}
        as: d
      - return: "= vars.d.value"

  - component: editor-contribution-registry
    name: get-editor-contributions
    kind: function
    summary: "EditorExtensionsRegistry.getEditorContributions: the registered contribution descriptions with their instantiation mode"
    sources: ["src/vs/editor/browser/editorExtensions.ts:552-558"]
    response: {type: object, properties: {contributions: {type: array, items: {type: object}}}}
    behavior:
      - return: {contributions: "= state.contributions"}

  - component: code-editor-contributions
    name: initialize
    kind: function
    summary: "CodeEditorContributions.initialize: Eager now; AfterFirstRender and BeforeFirstInteraction at the next idle time; Eventually at idle or after 5 s"
    sources: ["src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:43-77"]
    behavior:
      - call: code-editor-contributions.instantiate-some
        input: {mode: eager}
      - title: "runWhenWindowIdle: AfterFirstRender"
        source: "src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:60-62"
        emit: code-editor-contributions.instantiate-some
        after_ms: 1
        input: {mode: after-first-render}
      - title: "runWhenWindowIdle: BeforeFirstInteraction"
        source: "src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:67-69"
        emit: code-editor-contributions.instantiate-some
        after_ms: 1
        input: {mode: before-first-interaction}
      - title: "runWhenWindowIdle with a 5000 ms deadline: Eventually"
        source: "src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:74-76"
        emit: code-editor-contributions.instantiate-some
        after_ms: 5000
        input: {mode: eventually}

  - component: code-editor-contributions
    name: instantiate-some
    kind: function
    summary: "_instantiateSome: once per mode, create every pending contribution of that mode; a failing constructor is reported (onUnexpectedError) and skipped"
    sources: ["src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:120-131", "src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:143-165"]
    request: {type: object, required: [mode], properties: {mode: {type: string, enum: [eager, after-first-render, before-first-interaction, eventually, lazy]}}}
    behavior:
      - if: "input.mode in state.finished"
        then:
          - {title: "already done with this instantiation", source: "src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:121-124", return: {instantiated: 0}}
      - set: {state.finished: "= merge(state.finished, {input.mode: true})"}
      - call: editor-contribution-registry.get-editor-contributions
        as: reg
      - set: {vars.n: 0}
      - foreach: "= vars.reg.value.contributions.filter(c, c.mode == input.mode)"
        as: c
        steps:
          - call: "= vars.c.component + '.construct'"
            targets: []
            as: inst
            on_error:
              - {title: "onUnexpectedError: the contribution is skipped", source: "src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:161-163", continue: true}
          - set:
              state.instances: "= state.instances + [vars.c.id]"
              vars.n: "= vars.n + 1"
      - return: {instantiated: "= vars.n"}

boundary:
  - component: command-service
    name: execute-command
    kind: function
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [command_id], properties: {command_id: {type: string, examples: [noop]}, args: {type: array, items: {}, default: []}}}
    errors: [{code: command-not-found, status: 0, retryable: false}]
  - component: notification-service
    name: notify
    kind: function
    attributes: {boundary: true, owner: workbench-shell}
    request: {type: object, required: [severity, message], properties: {severity: {type: string, enum: [info, warning, error], examples: [info]}, message: {type: string, examples: ["Extension host terminated unexpectedly."]}, source: {type: string}}}
    response: {type: object, properties: {id: {type: integer}, silent: {type: boolean}}}
  - component: undo-redo-service
    name: undo
    kind: function
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {undone: {type: [string, "null"]}}}
  - component: undo-redo-service
    name: redo
    kind: function
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
  - component: bulk-edit-service
    name: apply
    kind: function
    attributes: {boundary: true, owner: workbench-contribs}
    request:
      type: object
      properties:
        edits:
          type: array
          items:
            type: object
            properties:
              type: {type: string, enum: [text, file]}
              resource: {type: string}
              op: {type: string, enum: [edit, create, delete, rename]}
              target: {type: string}
              needs_confirmation: {type: boolean}
          examples: [[{type: text, resource: "file:///work/app/src/util.ts", op: edit, needs_confirmation: false}]]
        show_preview: {type: boolean, default: false}
        respect_auto_save_config: {type: boolean, default: false}
        label: {type: string, examples: [Rename symbol]}
    response: {type: object, properties: {aria_summary: {type: string}, is_applied: {type: boolean, default: true}, resources: {type: array, items: {type: string}}}}
    errors:
      - {code: has-changed-in-the-meantime, status: 0, retryable: false}
      - {code: does-not-exist-and-can-not-be-deleted, status: 0, retryable: false}
  - component: text-file-models
    name: on-model-content-changed
    kind: event
    attributes: {boundary: true, owner: files-search-scm}
    request:
      type: object
      required: [resource, value]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        value: {type: string, examples: ["import { add } from './util';\nconsole.log(add(1, 3));\n"]}
        alternative_version_id: {type: [integer, "null"], default: null}
        is_undoing_or_redoing: {type: boolean, default: false}
    response: {type: object, properties: {version_id: {type: integer}, dirty: {type: boolean}}}
  - component: code-editor-service
    name: open-code-editor
    kind: function
    attributes: {boundary: true, owner: workbench-shell}
    request: {type: object, required: [resource], properties: {resource: {type: string}, side_by_side: {type: boolean}, selection: {type: object}}}
    response: {type: object, properties: {opened: {type: boolean, default: true}}}
  - component: text-model-resolver-service
    name: create-model-reference
    kind: function
    attributes: {boundary: true, owner: workbench-shell}
    request: {type: object, required: [resource], properties: {resource: {type: string}}}
    response: {type: object, properties: {uri: {type: string}, language_id: {type: string, examples: [typescript]}}}
  - component: default-formatter
    name: select-formatter
    kind: function
    attributes: {boundary: true, owner: workbench-contribs}
    request: {type: object, properties: {formatters: {type: array, items: {type: string}, examples: [[esbenp.prettier-vscode, vscode.typescript-language-features]]}, mode: {type: string, enum: [explicit, silent], default: explicit}, language_id: {type: string, examples: [typescript]}}}
    response: {type: object, properties: {formatter: {type: [string, "null"], examples: [vscode.typescript-language-features]}, message: {type: string}, notified: {type: boolean}}}
  - component: storage-db
    name: workspace-write
    kind: io
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [key], properties: {key: {type: string}, value: {type: string}}}

flows:
  - id: editor-snooze-inline-completions
    name: Snooze inline suggestions
    tags: [writes]
    entry: {caller: user, interface: inline-completions-service.snooze, input: {duration_ms: 300000}}
    sources: ["src/vs/editor/browser/services/inlineCompletionsService.ts:90-106"]
  - id: editor-read-snooze
    name: Read the snooze time left
    entry: {caller: user, interface: inline-completions-service.get-snooze-time-left}
    sources: ["src/vs/editor/browser/services/inlineCompletionsService.ts:69-74"]
