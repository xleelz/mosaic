components:
  - id: editor-commands
    name: editorCommands
    kind: module
    layer: workbench
    parent: workbench
    summary: "Editor command handlers registered in editorCommands.ts (close, keep, pin, lock, move/copy active editor, layout, open API commands) and the shared helpers the editor actions delegate to (splitEditor, moveCopySelectedEditors)."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorCommands.ts:178-370"
      - "src/vs/workbench/browser/parts/editor/editorCommands.ts:750-770"
  - id: editor-actions
    name: editorActions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Editor Action2 classes in editorActions.ts registered by editor.contribution.ts: split, join, focus, navigate, close-all, move/duplicate groups, layouts, reopen closed editor."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorActions.ts:60-120"
      - "src/vs/workbench/browser/parts/editor/editor.contribution.ts:174-310"
  - id: workspace-actions
    name: workspaceActions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Workspace and folder Action2 classes (workspaceActions.ts) and the workspace commands (workspaceCommands.ts): add/remove root folder, close folder, open folder in a window."
    sources:
      - "src/vs/workbench/browser/actions/workspaceActions.ts:162-258"
      - "src/vs/workbench/browser/actions/workspaceCommands.ts:60-105"
  - id: window-actions
    name: windowActions
    kind: module
    layer: workbench
    parent: workbench
    summary: "Window Action2 classes (windowActions.ts): new window, reload window, open recent."
    sources: ["src/vs/workbench/browser/actions/windowActions.ts:370-450"]
  - id: notifications-commands
    name: notificationsCommands
    kind: module
    layer: workbench
    parent: workbench
    summary: "Notification commands registered in notificationsCommands.ts (clear all, do-not-disturb)."
    sources: ["src/vs/workbench/browser/parts/notifications/notificationsCommands.ts:296-312"]
  - id: language-detection-web-worker
    name: languageDetectionWebWorkerMain
    kind: service
    layer: workbench
    parent: workbench
    summary: "The language detection web worker; its main bootstraps the worker server."
    sources: ["src/vs/workbench/services/languageDetection/browser/languageDetectionWebWorkerMain.ts:9"]
  - id: text-mate-tokenization-worker
    name: textMateTokenizationWorker.workerMain
    kind: service
    layer: workbench
    parent: workbench
    summary: "The background TextMate tokenization web worker; its main bootstraps the worker server."
    sources: ["src/vs/workbench/services/textMate/browser/backgroundTokenization/worker/textMateTokenizationWorker.workerMain.ts:9"]

interfaces:
  # ---------------- editor-commands helpers ----------------
  - component: editor-commands
    name: split-editor
    kind: function
    summary: "splitEditor: add a group next to the active one in the given direction, copy the active editor into it and focus it."
    sources: ["src/vs/workbench/browser/parts/editor/editorCommands.ts:750-770"]
    request: {type: object, required: [direction], properties: {direction: {type: string, enum: [left, right, up, down]}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.src: "= vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]"
      - title: Add a group in the direction
        source: "src/vs/workbench/browser/parts/editor/editorCommands.ts:758"
        call: editor-part.add-group
        input: {location_id: "= vars.src.id", direction: "= input.direction"}
        as: ng
      - if: "vars.src.active != null"
        then:
          - title: Copy the active editor into the new group
            source: "src/vs/workbench/browser/parts/editor/editorCommands.ts:760-766"
            call: editor-group-view.open-editor
            input: {group_id: "= vars.ng.value.group_id", resource: "= vars.src.active", options: {pinned: "= vars.src.preview != vars.src.active"}}
      - call: editor-groups.set-active-group
        input: {group_id: "= vars.ng.value.group_id"}
      - return: {group_id: "= vars.ng.value.group_id"}
  - component: editor-commands
    name: move-copy-active-editor
    kind: function
    summary: "moveCopySelectedEditors (moveActiveEditor / copyActiveEditor): by tab, move inside the group (first, last, left, right, position, clamped); by group, find the target group (creating one for a direction or previous/next when missing) and move or copy the editor there."
    sources: ["src/vs/workbench/browser/parts/editor/editorCommands.ts:225-350"]
    request:
      type: object
      properties:
        to: {type: string, enum: [first, last, left, right, up, down, previous, next, position, center], default: right}
        by: {type: string, enum: [tab, group], default: tab}
        value: {type: integer, default: 1}
        copy: {type: boolean, default: false}
    behavior:
      - set:
          vars.to: "= has(input.to) ? input.to : 'right'"
          vars.by: "= has(input.by) ? input.by : 'tab'"
          vars.val: "= has(input.value) ? input.value : 1"
          vars.copy: "= has(input.copy) && input.copy"
      - call: editor-groups.get-state
        as: st
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]"
      - if: "vars.g.active == null"
        then:
          - return: {moved: false}
      - if: "vars.by == 'tab'"
        then:
          - if: "vars.copy"
            then:
              - title: Copy by tab is not supported
                source: "src/vs/workbench/browser/parts/editor/editorCommands.ts:237-241"
                return: {moved: false}
          - set:
              vars.i: "= lists.range(size(vars.g.editors)).filter(i, vars.g.editors[i] == vars.g.active)[0]"
          - title: Compute the new tab index
            source: "src/vs/workbench/browser/parts/editor/editorCommands.ts:262-286"
            set:
              vars.ix: "= vars.to == 'first' ? 0 : (vars.to == 'last' ? size(vars.g.editors) - 1 : (vars.to == 'left' ? vars.i - vars.val : (vars.to == 'right' ? vars.i + vars.val : (vars.to == 'position' ? vars.val - 1 : vars.i))))"
          - call: editor-group-view.move-editor
            input: {group_id: "= vars.g.id", target_group_id: "= vars.g.id", index: "= vars.ix"}
          - return: {moved: true, group_id: "= vars.g.id"}
      - if: "vars.to in ['first', 'last', 'previous', 'next', 'left', 'right', 'up', 'down']"
        then:
          - call: editor-part.find-group
            input: {scope: "= vars.to", source_id: "= vars.g.id"}
            as: fg
          - set: {vars.target: "= vars.fg.value.group_id"}
        else:
          - set: {vars.target: "= vars.val - 1 < size(vars.st.value.groups) ? vars.st.value.groups[vars.val - 1].id : null"}
      - if: "vars.target == null && !(vars.to in ['first', 'last', 'position', 'center'])"
        then:
          - title: No group there, create one
            source: "src/vs/workbench/browser/parts/editor/editorCommands.ts:292-330"
            call: editor-part.add-group
            input: {location_id: "= vars.g.id", direction: "= vars.to == 'next' ? 'right' : (vars.to == 'previous' ? 'left' : vars.to)"}
            as: ng
          - set: {vars.target: "= vars.ng.value.group_id"}
      - if: "vars.target == null || (vars.copy && vars.target == vars.g.id)"
        then:
          - return: {moved: false}
      - title: Move or copy the editor into the target group and focus it
        source: "src/vs/workbench/browser/parts/editor/editorCommands.ts:339-347"
        call: editor-group-view.move-editor
        input: {group_id: "= vars.g.id", target_group_id: "= vars.target", copy: "= vars.copy"}
      - call: editor-groups.set-active-group
        input: {group_id: "= vars.target"}
      - return: {moved: true, group_id: "= vars.target"}
  - component: editor-commands
    name: focus-group
    kind: function
    summary: "AbstractFocusGroupAction / NavigateBetweenGroupsAction: find a group by direction or location and activate it; FocusFirstGroup creates a group to the right when asked for a missing index."
    sources: ["src/vs/workbench/browser/parts/editor/editorActions.ts:277-292"]
    request: {type: object, required: [scope], properties: {scope: {type: string, enum: [first, last, next, previous, left, right, up, down]}, wrap: {type: boolean}}}
    behavior:
      - call: editor-part.find-group
        input: {scope: "= input.scope"}
        as: fg
      - if: "vars.fg.value.group_id == null && has(input.wrap) && input.wrap"
        then:
          - call: editor-part.find-group
            input: {scope: "= input.scope == 'next' ? 'first' : 'last'"}
            as: fg2
          - call: editor-groups.set-active-group
            input: {group_id: "= vars.fg2.value.group_id"}
          - return: {group_id: "= vars.fg2.value.group_id"}
      - if: "vars.fg.value.group_id == null"
        then:
          - return: {group_id: null}
      - call: editor-groups.set-active-group
        input: {group_id: "= vars.fg.value.group_id"}
      - return: {group_id: "= vars.fg.value.group_id"}
  - component: editor-commands
    name: navigate-editor
    kind: function
    summary: "AbstractNavigateEditorAction: open the next/previous/first/last editor; nextEditor/previousEditor continue into the next (previous) group that has editors, wrapping around; the InGroup variants wrap inside the group."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorActions.ts:1243-1262"
      - "src/vs/workbench/browser/parts/editor/editorActions.ts:1287-1313"
    request: {type: object, required: [scope], properties: {scope: {type: string, enum: [next, previous, first, last]}, in_group: {type: boolean}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.gs: "= vars.st.value.groups"
          vars.g: "= vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]"
      - if: "size(vars.g.editors) == 0"
        then:
          - return: {opened: false}
      - set:
          vars.i: "= vars.g.active == null ? -1 : lists.range(size(vars.g.editors)).filter(i, vars.g.editors[i] == vars.g.active)[0]"
          vars.gi: "= lists.range(size(vars.gs)).filter(i, vars.gs[i].id == vars.g.id)[0]"
          vars.ing: "= has(input.in_group) && input.in_group"
      - set:
          vars.next_g: "= (lists.range(size(vars.gs) - 1).map(k, vars.gs[(vars.gi + k + 1) % size(vars.gs)]).filter(g, size(g.editors) > 0) + [vars.g])[0]"
          vars.prev_g: "= (lists.range(size(vars.gs) - 1).map(k, vars.gs[(vars.gi - k - 1 + size(vars.gs)) % size(vars.gs)]).filter(g, size(g.editors) > 0) + [vars.g])[0]"
      - set:
          vars.pick: "= input.scope == 'first' ? [vars.g.id, vars.g.editors[0]] : (input.scope == 'last' ? [vars.g.id, vars.g.editors[size(vars.g.editors) - 1]] : (input.scope == 'next' ? (vars.i + 1 < size(vars.g.editors) ? [vars.g.id, vars.g.editors[vars.i + 1]] : (vars.ing ? [vars.g.id, vars.g.editors[0]] : [vars.next_g.id, vars.next_g.editors[0]])) : (vars.i > 0 ? [vars.g.id, vars.g.editors[vars.i - 1]] : (vars.ing ? [vars.g.id, vars.g.editors[size(vars.g.editors) - 1]] : [vars.prev_g.id, vars.prev_g.editors[size(vars.prev_g.editors) - 1]]))))"
      - title: Open the navigated editor in its group
        source: "src/vs/workbench/browser/parts/editor/editorActions.ts:1257-1260"
        call: editor-group-view.open-editor
        input: {group_id: "= vars.pick[0]", resource: "= vars.pick[1]"}
      - return: {opened: true, group_id: "= vars.pick[0]", resource: "= vars.pick[1]"}
  - component: editor-commands
    name: open-editor-at-index
    kind: function
    summary: "openEditorAtIndex: open the editor at a 0-based index of the active group, nothing when there is none."
    sources: ["src/vs/workbench/browser/parts/editor/editorCommands.ts:629-640"]
    request: {type: object, required: [index], properties: {index: {type: integer}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]"
      - if: "input.index < 0 || input.index >= size(vars.g.editors)"
        then:
          - return: {opened: false}
      - call: editor-group-view.open-editor
        input: {group_id: "= vars.g.id", resource: "= vars.g.editors[input.index]"}
      - return: {opened: true}
  - component: editor-commands
    name: close-all-in-all-groups
    kind: function
    summary: "AbstractCloseAllAction: confirm every dirty editor across groups, then close all editors of every group (and the groups themselves for Close All Groups)."
    sources: ["src/vs/workbench/browser/parts/editor/editorActions.ts:592-796"]
    request: {type: object, properties: {close_groups: {type: boolean, default: false}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - foreach: "= vars.st.value.groups.map(g, g.id)"
        as: gid
        steps:
          - call: editor-groups.get-state
            as: cur
          - if: "!vars.cur.value.groups.exists(g, g.id == vars.gid)"
            then:
              - title: Group already removed (closeEmptyGroups)
                continue: true
          - call: editor-group-view.close-editors
            input: {group_id: "= vars.gid", mode: all}
            as: r
          - if: "!vars.r.value.closed"
            then:
              - title: A dirty editor vetoed, stop
                return: {closed: false}
      - if: "has(input.close_groups) && input.close_groups"
        then:
          - call: editor-groups.get-state
            as: after
          - call: editor-part.merge-all-groups
            input: {target_id: "= vars.after.value.active_group"}
      - return: {closed: true}

  # ---------------- keybinding-service ----------------
  - component: keybinding-service
    name: dispatch
    kind: function
    summary: 'Keydown dispatch: resolve the pressed chord (after any pending chords) against the keybinding table, last matching when clause wins; enter multi-chord mode when more chords are needed (status
      message, left after 5 s); report a key combination that is not a command; otherwise run the command through ICommandService (not awaited in the code), warning on failure.'
    sources:
    - src/vs/workbench/services/keybinding/browser/keybindingService.ts:278-292
    - src/vs/platform/keybinding/common/abstractKeybindingService.ts:306-404
    - src/vs/platform/keybinding/common/keybindingResolver.ts:320-392
    request:
      type: object
      required:
      - keypress
      properties:
        keypress:
          type: string
          examples:
          - ctrl+w
        context:
          type: object
          default: {}
    response:
      type: object
      properties:
        kind:
          type: string
          enum:
          - no-matching-kb
          - more-chords-needed
          - kb-found
        command_id:
          type: string
        prevent_default:
          type: boolean
    behavior:
    - if: size(state.current_chords) > 0 && now - state.chord_at > 5000
      then:
      - title: More than 5 s since the last chord, chord mode was left
        source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:175-191
        set:
          state.current_chords: []
    - set:
        vars.chords: = state.current_chords + [input.keypress]
    - set:
        vars.cands: = state.keybindings.filter(k, size(k.chords) >= size(vars.chords) && lists.range(size(vars.chords)).all(i, k.chords[i] == vars.chords[i]))
    - title: The context keys the candidates' when clauses read (comparison values and string literals are not keys)
      source: src/vs/platform/keybinding/common/keybindingResolver.ts:392-397
      set:
        vars.keys: = replace(replace(replace(vars.cands.filter(k, has(k.when)).map(k, k.when).join(" "), "'[^']*'", " "), "(==|!=)\\s*[A-Za-z0-9_.:/-]+", " "), "[^A-Za-z0-9_.:-]+", " ").trim().split(" ").filter(x,
          x != "" && x != "true" && x != "false")
        vars.ctx: {}
    - title: contextKeyService.getContext(target), read key by key as ContextKeyExpression.evaluate does
      source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:334
      foreach: = vars.keys
      as: key
      steps:
      - if: '!(vars.key in vars.ctx)'
        then:
        - call: context-key-service.get-context-key-value
          input:
            key: = vars.key
          as: kv
        - set:
            vars.ctx: '= merge(vars.ctx, {vars.key: vars.kv.value.value})'
    - title: The focused target's scoped context keys (input.context) overlay the root context
      source: src/vs/platform/contextkey/browser/contextKeyService.ts:598-615
      set:
        vars.ctx: '= has(input.context) ? merge(vars.ctx, input.context) : vars.ctx'
    - title: Each when clause becomes a CEL rule (a bare key is truthy, key == value compares, &&, || and ! keep their meaning)
      source: src/vs/platform/contextkey/common/contextkey.ts:805-807
      set:
        vars.rules: '= vars.cands.map(k, !has(k.when) ? "true" : replace(replace(replace(replace(k.when, "([A-Za-z_][A-Za-z0-9_.:-]*)\\s*(==|!=)\\s*''?([A-Za-z0-9_.:/-]+)''?", "#$1#$2@$3@"), "(^|[^@#A-Za-z0-9_.:-])([A-Za-z_][A-Za-z0-9_.:-]*)",
          "$1%$2%"), "%([^%]+)%", "!(c[\"$1\"] in [null, false, \"\", 0])"), "#([^#]+)#(==|!=)@([^@]*)@", "(c[\"$1\"] $2 \"$3\")"))'
    - title: _findCommand walks the candidates from last to first and keeps those whose when clause evaluates true (eval against the context)
      source: src/vs/platform/keybinding/common/keybindingResolver.ts:380-390
      set:
        vars.match: '= lists.range(size(vars.cands)).filter(i, eval(vars.rules[i], {"c": vars.ctx})).map(i, vars.cands[i])'
    - if: size(vars.match) == 0
      then:
      - if: size(state.current_chords) > 0
        then:
        - title: In chord mode, the combination is not a command
          source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:344-352
          call: notification-service.status
          input:
            message: = 'The key combination (' + vars.chords.join(', ') + ') is not a command.'
            hide_after_ms: 10000
        - set:
            state.current_chords: []
        - return:
            kind: no-matching-kb
            prevent_default: true
      - return:
          kind: no-matching-kb
          prevent_default: false
    - set:
        vars.kb: = vars.match[size(vars.match) - 1]
    - if: size(vars.chords) < size(vars.kb.chords)
      then:
      - title: More chords needed, enter multi-chord mode
        source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:357-365
        set:
          state.current_chords: = vars.chords
          state.chord_at: = now
      - call: notification-service.status
        input:
          message: = '(' + vars.chords.join(', ') + ') was pressed. Waiting for second key of chord...'
      - return:
          kind: more-chords-needed
          prevent_default: true
    - title: Keybinding found, leave chord mode and invoke the command
      source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:367-398
      set:
        state.current_chords: []
        state.last_command: = vars.kb.command
    - title: KbFound runs the command through ICommandService.executeCommand (args only when the keybinding has them); a rejection becomes a warning
      source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:384-391
      call: command-service.execute-command
      input:
        command_id: = vars.kb.command
        args: '= has(vars.kb.args) ? [vars.kb.args] : []'
      on_error:
      - title: A failing command shows a warning
        source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:388-390
        call: notification-service.notify
        input:
          severity: warning
          message: = error.message
    - return:
        kind: kb-found
        command_id: = vars.kb.command
        prevent_default: true
  # ---------------- host service ----------------
  - component: workbench-host-service
    name: reload
    kind: function
    summary: "WorkbenchHostService.reload: ask the main process to reload this window (which runs the before/will-shutdown handshake with reason reload)."
    sources: ["src/vs/workbench/services/host/electron-browser/nativeHostService.ts:180-190"]
    behavior:
      - call: native-host-service.reload
        input: {disable_extensions: false}
      - return: {requested: true}
  - component: workbench-host-service
    name: open-window
    kind: function
    summary: "WorkbenchHostService.openWindow: open a folder (or an empty window) in a new or the same window through the main process."
    sources: ["src/vs/workbench/services/host/electron-browser/nativeHostService.ts:140-170"]
    request: {type: object, properties: {folder_uri: {type: string}, force_reuse_window: {type: boolean}, force_new_window: {type: boolean}}}
    behavior:
      - call: native-host-service.open-window
        input: {folder_uris: "= has(input.folder_uri) && input.folder_uri != '' ? [input.folder_uri] : []", file_uris: [], force_new_window: "= has(input.force_new_window) && input.force_new_window", force_reuse_window: "= has(input.force_reuse_window) && input.force_reuse_window"}
      - return: {requested: true}

  # ---------------- file-dialog-service ----------------
  - component: file-dialog-service
    name: show-open-dialog
    kind: function
    summary: "showOpenDialog (folder picker for Add Folder to Workspace); the user picks /work/lib or cancels."
    sources: ["src/vs/workbench/browser/actions/workspaceCommands.ts:91-104"]
    request: {type: object, properties: {can_select_folders: {type: boolean}}}
    response: {type: object, properties: {uris: {type: array, items: {type: string}}}}
    behavior:
      - choice: pick
        default: folder
        options:
          folder:
            - return: {uris: ["file:///work/lib"]}
          cancel:
            - return: {uris: []}

  # ---------------- workers ----------------
  - component: language-detection-web-worker
    name: bootstrap
    kind: function
    summary: "Worker main: bootstrapWebWorker(create) starts the language detection worker server."
    sources: ["src/vs/workbench/services/languageDetection/browser/languageDetectionWebWorkerMain.ts:9"]
    behavior:
      - title: bootstrapWebWorker(create)
        source: "src/vs/workbench/services/languageDetection/browser/languageDetectionWebWorkerMain.ts:9"
        return: {started: true}
  - component: text-mate-tokenization-worker
    name: bootstrap
    kind: function
    summary: "Worker main: bootstrapWebWorker(create) starts the background TextMate tokenization worker."
    sources: ["src/vs/workbench/services/textMate/browser/backgroundTokenization/worker/textMateTokenizationWorker.workerMain.ts:9"]
    behavior:
      - title: bootstrapWebWorker(create)
        source: "src/vs/workbench/services/textMate/browser/backgroundTokenization/worker/textMateTokenizationWorker.workerMain.ts:9"
        return: {started: true}

  # ---------------- workbench startup ----------------
  - component: workbench
    name: startup
    kind: function
    summary: "Workbench.startup: create the services (lifecycle Ready), start the contributions registry, render the layout, restore parts (open the editors to restore, racing a 2 s timeout), go to Restored, and to Eventually 2.5 s later."
    sources:
      - "src/vs/workbench/browser/workbench.ts:111-170"
      - "src/vs/workbench/browser/workbench.ts:172-207"
      - "src/vs/workbench/browser/workbench.ts:392-440"
    request: {type: object, properties: {editors_to_open: {type: array, items: {type: string}, default: []}}}
    behavior:
      - title: Services created, lifecycle phase Ready
        source: "src/vs/workbench/browser/workbench.ts:197-206"
        call: lifecycle-service.set-phase
        input: {phase: 2}
      - title: Start the contributions registry (BlockStartup and BlockRestore contributions now)
        source: "src/vs/workbench/browser/workbench.ts:142"
        call: workbench-contributions-registry.start
      - title: Workspace trust initialized
        source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:151-160"
        call: workspace-trust-management-service.initialize
      - title: Restore parts; Restored waits for the editors or 2 s, whichever comes first
        source: "src/vs/workbench/browser/workbench.ts:410-414"
        branches:
          - - call: editor-service.open-editors
