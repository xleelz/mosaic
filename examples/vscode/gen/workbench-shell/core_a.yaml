# Core, hand-written part of the workbench-shell fragment (merged by gen.py).
configs:
  - id: security-workspace-trust-enabled
    type: boolean
    value: true
    default: true
    summary: "security.workspace.trust.enabled; registered default true, product.json sets no override, so deployed = default. Read by WorkspaceTrustEnablementService.isWorkspaceTrustEnabled."
    sources:
      - "src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:799-805"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:82-88"
    attributes: {key: security.workspace.trust.enabled, owner: workbench-shell}
  - id: workbench-editor-enable-preview
    type: boolean
    value: true
    default: true
    summary: "workbench.editor.enablePreview; deployed = default (no product.json override). When false every opened editor is pinned."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:331-335"
      - "src/vs/workbench/browser/parts/editor/editor.ts:56"
    attributes: {key: workbench.editor.enablePreview}
  - id: workbench-editor-open-positioning
    type: string
    value: right
    default: right
    summary: "workbench.editor.openPositioning (left|right|first|last); deployed = default."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:351-356"
      - "src/vs/workbench/common/editor/editorGroupModel.ts:245"
    attributes: {key: workbench.editor.openPositioning}
  - id: workbench-editor-focus-recent-editor-after-close
    type: boolean
    value: true
    default: true
    summary: "workbench.editor.focusRecentEditorAfterClose; true picks the MRU editor after closing the active one, false the right (or left) neighbour."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:321-325"
      - "src/vs/workbench/common/editor/editorGroupModel.ts:246"
    attributes: {key: workbench.editor.focusRecentEditorAfterClose}
  - id: workbench-editor-close-empty-groups
    type: boolean
    value: true
    default: true
    summary: "workbench.editor.closeEmptyGroups; when the last editor of a group closes, the group is removed (unless it is the only group)."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:363-368"
      - "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1617"
    attributes: {key: workbench.editor.closeEmptyGroups}
  - id: workbench-editor-reveal-if-open
    type: boolean
    value: false
    default: false
    summary: "workbench.editor.revealIfOpen; when true an editor already opened in another group is revealed there instead of opening in the active group."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:369-373"
      - "src/vs/workbench/services/editor/common/editorGroupFinder.ts:168"
    attributes: {key: workbench.editor.revealIfOpen}
  # references owned by other areas
  - {id: security-workspace-trust-empty-window, type: boolean, value: true, default: true, summary: "security.workspace.trust.emptyWindow (registered in contrib/workspace)", sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:845-850", "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:333"], attributes: {boundary: true, owner: workbench-contribs, key: security.workspace.trust.emptyWindow}}
  - {id: security-workspace-trust-untrusted-files, type: string, value: prompt, default: prompt, summary: "security.workspace.trust.untrustedFiles (prompt|open|newWindow)", sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:832-838", "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:730-732"], attributes: {boundary: true, owner: workbench-contribs, key: security.workspace.trust.untrustedFiles}}
  - {id: window-confirm-save-untitled-workspace, type: boolean, value: true, default: true, summary: "window.confirmSaveUntitledWorkspace (registered in workbench/electron-browser)", sources: ["src/vs/workbench/electron-browser/desktop.contribution.ts:166-170", "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:93"], attributes: {boundary: true, owner: main-process, key: window.confirmSaveUntitledWorkspace}}

schemas:
  - id: WorkbenchOpenEditorRequest
    summary: "IEditorService.openEditor(untyped resource input, preferred group). group: a GroupIdentifier >= 1, or ACTIVE_GROUP -1 / SIDE_GROUP -2."
    schema:
      type: object
      required: [resource]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        group: {type: integer, default: -1}
        options:
          type: object
          properties:
            pinned: {type: boolean}
            sticky: {type: boolean}
            inactive: {type: boolean}
            preserve_focus: {type: boolean}
            reveal_if_opened: {type: boolean}
            index: {type: integer}
          default: {}
  - id: WorkbenchOpenEditorResult
    summary: "The opened editor pane, reduced to where the editor landed. opened=false when the open was skipped (IEditorPane undefined)."
    schema:
      type: object
      required: [opened]
      properties:
        opened: {type: boolean}
        resource: {type: string}
        group_id: {type: integer}
        pinned: {type: boolean}
        is_new: {type: boolean}
  - id: WorkbenchEditorGroup
    summary: "One editor group as the editor-groups anchor stores it (EditorGroupModel state): editors in tab order, the active and the preview editor, sticky editors, MRU order and the lock."
    schema:
      type: object
      required: [id, editors]
      properties:
        id: {type: integer}
        editors: {type: array, items: {type: string}}
        active: {type: [string, "null"]}
        preview: {type: [string, "null"]}
        sticky: {type: array, items: {type: string}}
        mru: {type: array, items: {type: string}}
        locked: {type: boolean}
  - id: WorkbenchShutdownRequest
    summary: "The vscode:onBeforeUnload / vscode:onWillUnload payload: the ShutdownReason in kebab-case."
    schema:
      type: object
      required: [reason]
      properties:
        reason: {type: string, enum: [close, quit, reload, load], examples: [close]}
        window_id: {type: string, examples: [w1]}
