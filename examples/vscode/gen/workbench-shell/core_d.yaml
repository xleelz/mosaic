components:
  - id: lifecycle-service
    name: NativeLifecycleService
    kind: service
    layer: workbench
    parent: workbench
    summary: "ILifecycleService (desktop: NativeLifecycleService, web: BrowserLifecycleService): lifecycle phases, and the shutdown handshake with the main process (onBeforeShutdown with vetos and a final veto, onWillShutdown with joiners, onDidShutdown)."
    sources:
      - "src/vs/workbench/services/lifecycle/common/lifecycle.ts:10"
      - "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:210"
      - "src/vs/workbench/services/lifecycle/browser/lifecycleService.ts:222"
      - "src/vs/workbench/services/lifecycle/common/lifecycleService.ts:14-131"
    state:
      initial: {phase: 4, vetoes: [], will_shutdown: false, shutdown_reason: null, veto_count: 0}
  - id: native-workspace-editing-service
    name: NativeWorkspaceEditingService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkspaceEditingService (desktop): add/remove workspace folders (entering an untitled multi-root workspace from a single folder) and the before-shutdown prompt to save an untitled workspace."
    sources:
      - "src/vs/workbench/services/workspaces/common/workspaceEditing.ts:12"
      - "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:214"
      - "src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:186-258"
  - id: workspace-trust-management-service
    name: WorkspaceTrustManagementService
    kind: service
    layer: workbench
    parent: workspace-context
    summary: "IWorkspaceTrustManagementService (one owner for all areas): computes workspace trust from the trusted-URI list persisted in application storage, sets trust for URIs and the workspace, and fires onDidChangeTrust."
    sources:
      - "src/vs/platform/workspace/common/workspaceTrust.ts:39"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:91-150"
      - "src/vs/workbench/electron-browser/desktop.main.ts:341-342"
    state:
      initial: {uri_trust_info: [], accepts_out_of_workspace_files: false}
  - id: workspace-trust-enablement-service
    name: WorkspaceTrustEnablementService
    kind: function
    layer: workbench
    parent: workspace-context
    summary: "IWorkspaceTrustEnablementService: trust is enabled unless disabled on the command line or by security.workspace.trust.enabled."
    sources:
      - "src/vs/platform/workspace/common/workspaceTrust.ts:31"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:71-89"
  - id: workspace-trust-request-service
    name: WorkspaceTrustRequestService
    kind: service
    layer: workbench
    parent: workspace-context
    summary: "IWorkspaceTrustRequestService: modal workspace trust requests (one pending at a time), open-files trust requests governed by security.workspace.trust.untrustedFiles, and the startup request."
    sources:
      - "src/vs/platform/workspace/common/workspaceTrust.ts:78"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:984"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:697-922"
    state:
      initial: {pending_workspace_request: false, pending_open_files_request: false}
  - id: keybinding-service
    name: WorkbenchKeybindingService
    kind: service
    layer: workbench
    parent: workbench
    summary: 'IKeybindingService (workbench): turns keydown events into chords, resolves them against the default and user keybindings with their when clauses, handles multi-chord mode (5 s), then runs the
      command.'
    sources:
    - src/vs/platform/keybinding/common/keybinding.ts:47
    - src/vs/workbench/services/keybinding/browser/keybindingService.ts:1018
    - src/vs/workbench/services/keybinding/browser/keybindingService.ts:175-290
    - src/vs/platform/keybinding/common/abstractKeybindingService.ts:306-404
    state:
      initial:
        keybindings:
        - chords:
          - ctrl+w
          command: workbench.action.closeActiveEditor
        - chords:
          - ctrl+w
          command: workbench.action.closeGroup
          when: activeEditorGroupEmpty && multipleEditorGroups
        - chords:
          - ctrl+k
          - w
          command: workbench.action.closeEditorsInGroup
        - chords:
          - ctrl+k
          - u
          command: workbench.action.closeUnmodifiedEditors
        - chords:
          - ctrl+k
          - enter
          command: workbench.action.keepEditor
        - chords:
          - ctrl+k
          - shift+enter
          command: workbench.action.pinEditor
          when: '!activeEditorIsPinned'
        - chords:
          - ctrl+k
          - shift+enter
          command: workbench.action.unpinEditor
          when: activeEditorIsPinned
        - chords:
          - ctrl+k
          - ctrl+w
          command: workbench.action.closeAllEditors
        - chords:
          - ctrl+\
          command: workbench.action.splitEditor
        - chords:
          - ctrl+shift+t
          command: workbench.action.reopenClosedEditor
        - chords:
          - ctrl+1
          command: workbench.action.focusFirstEditorGroup
        - chords:
          - ctrl+pagedown
          command: workbench.action.nextEditor
        - chords:
          - ctrl+k
          - f
          command: workbench.action.closeFolder
        - chords:
          - ctrl+s
          command: workbench.action.files.save
        current_chords: []
        chord_at: 0
        last_command: null
        handlers:
          workbench.action.newWindow: window-actions.cmd-workbench-action-newwindow
          workbench.action.reloadWindow: window-actions.cmd-workbench-action-reloadwindow
          workbench.action.addRootFolder: workspace-actions.cmd-workbench-action-addrootfolder
