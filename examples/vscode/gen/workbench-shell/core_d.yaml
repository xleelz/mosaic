interfaces:
  # ---------------- lifecycle-service ----------------
  - component: lifecycle-service
    name: on-before-shutdown
    kind: event
    summary: "The before-shutdown handshake (seam). The main process asks via vscode:onBeforeUnload; the service fires onBeforeShutdown (subscribers veto through lifecycle-service.veto), then, only when nobody vetoed, the final-veto phase (topic lifecycle-service.on-before-shutdown-final). Returns veto, which the window sends back on the cancel or ok channel. Subscribers declare subscribe: [lifecycle-service.on-before-shutdown]."
    sources:
      - "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:36-61"
      - "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:79-150"
      - "src/vs/workbench/services/lifecycle/common/lifecycle.ts:21-49"
    attributes: {seam: true, callers: "files-search-scm, terminal-debug-tasks, main-process"}
    request: WorkbenchShutdownRequest
    response: {type: object, required: [veto], properties: {veto: {type: boolean}, vetoed_by: {type: array, items: {type: string}}}}
    behavior:
      - set:
          state.vetoes: []
          state.pending_reason: "= input.reason"
      - title: Fire onBeforeShutdown, collecting vetos
        source: "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:88-117"
        publish: lifecycle-service.on-before-shutdown
        delivery: sync
        input: {reason: "= input.reason"}
      - if: "size(state.vetoes) == 0"
        then:
          - title: No veto yet, run the final veto
            source: "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:131-144"
            publish: lifecycle-service.on-before-shutdown-final
            delivery: sync
            input: {reason: "= input.reason"}
      - if: "size(state.vetoes) > 0"
        then:
          - title: Veto, cancel the unload and fire onShutdownVeto
            source: "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:44-52"
            set:
              state.veto_count: "= state.veto_count + 1"
          - return: {veto: true, vetoed_by: "= state.vetoes"}
      - title: No veto, remember the shutdown reason and allow the unload
        source: "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:55-60"
        set:
          state.shutdown_reason: "= input.reason"
      - return: {veto: false, vetoed_by: []}
  - component: lifecycle-service
    name: on-before-shutdown-final
    kind: event
    summary: "Topic of the final-veto phase (InternalBeforeShutdownEvent.finalVeto): runs only when no regular veto was raised. The working copy backup tracker (files-search-scm) registers its backup/confirm logic here."
    sources: ["src/vs/workbench/services/lifecycle/common/lifecycle.ts:38-49"]
    request: {type: object, properties: {reason: {type: string}}}
  - component: lifecycle-service
    name: veto
    kind: function
    summary: "BeforeShutdownEvent.veto(value, id) / finalVeto: a participant's answer; true prevents the shutdown and is logged with its id."
    sources:
      - "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:91-116"
    request: {type: object, required: [id, veto], properties: {id: {type: string, examples: [veto.untitledWorkspace]}, veto: {type: boolean}}}
    behavior:
      - if: "input.veto"
        then:
          - title: Shutdown was prevented
            source: "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:95-97"
            set:
              state.vetoes: "= state.vetoes + [input.id]"
      - return: {vetoed: "= input.veto"}
  - component: lifecycle-service
    name: on-will-shutdown
    kind: event
    summary: "vscode:onWillUnload: fire onWillShutdown (participants join their work, default joiners before last joiners), flush storage with the shutdown reason, then onDidShutdown and acknowledge to the main process. Subscribers declare subscribe: [lifecycle-service.on-will-shutdown]."
    sources:
      - "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:63-76"
      - "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:158-203"
    request: WorkbenchShutdownRequest
    behavior:
      - set:
          state.will_shutdown: true
      - title: Fire onWillShutdown, participants join
        source: "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:165-184"
        publish: lifecycle-service.on-will-shutdown
        delivery: sync
        input: {reason: "= input.reason"}
      - title: Persist the shutdown reason for the next startup
        source: "src/vs/workbench/services/lifecycle/common/lifecycleService.ts:58-62"
        call: storage-db.workspace-write
        input: {key: lifecyle.lastShutdownReason, value: "= input.reason"}
        on_error: continue
      - title: Fire onDidShutdown and acknowledge
        source: "src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:71-75"
        set:
          state.did_shutdown: true
      - return: {acknowledged: true}
  - component: lifecycle-service
    name: set-phase
    kind: function
    summary: "AbstractLifecycleService.phase setter: phases only move forward (Starting 1, Ready 2, Restored 3, Eventually 4); reaching a phase opens its barrier."
    sources: ["src/vs/workbench/services/lifecycle/common/lifecycleService.ts:92-111"]
    request: {type: object, required: [phase], properties: {phase: {type: integer, minimum: 1, maximum: 4}}}
    errors: [{code: lifecycle-cannot-go-backwards, status: 0, retryable: false}]
    behavior:
      - if: "input.phase < state.phase"
        then:
          - title: Lifecycle cannot go backwards
            source: "src/vs/workbench/services/lifecycle/common/lifecycleService.ts:93-95"
            fail: {code: lifecycle-cannot-go-backwards, message: "Lifecycle cannot go backwards"}
      - if: "input.phase == state.phase"
        then:
          - return: {phase: "= state.phase", changed: false}
      - set:
          state.phase: "= input.phase"
      - return: {phase: "= input.phase", changed: true}

  # ---------------- native-workspace-editing-service ----------------
  - component: native-workspace-editing-service
    name: on-before-shutdown
    kind: event
    subscribe: [lifecycle-service.on-before-shutdown]
    summary: "saveUntitledBeforeShutdown: when the window closes or loads another workspace while an untitled workspace is open, ask to save it (Save / Don't Save / Cancel); Cancel vetoes the shutdown."
    sources:
      - "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:71-76"
      - "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:78-157"
    request: {type: object, properties: {reason: {type: string}}}
    behavior:
      - if: "!(input.reason in ['load', 'close'])"
        then:
          - title: Only interested when the window closes or loads
            source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:79-81"
            return: {veto: false}
      - call: workspace-context.get-workspace
        as: ws
      - if: "!vars.ws.value.untitled_workspace"
        then:
          - title: Not an untitled workspace
            source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:83-86"
            return: {veto: false}
      - call: native-host-service.get-window-count
        input: {}
        as: wc
      - if: "input.reason == 'close' && vars.wc.value.count == 1"
        then:
          - title: Windows/Linux quit when the last window closes, do not ask
            source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:88-91"
            return: {veto: false}
      - if: "!config['window-confirm-save-untitled-workspace']"
        then:
          - title: No confirmation configured, discard the untitled workspace
            source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:93-98"
            call: workspace-context.set-folders
            input: {folders: "= vars.ws.value.folders", untitled_workspace: false}
          - return: {veto: false}
      - title: Ask whether to save the workspace configuration
        source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:100-150"
        choice: save_workspace
        default: dont_save
        options:
          save:
            - title: Save As a workspace file, then delete the untitled one
              source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:107-130"
              call: workspace-context.set-folders
              input: {folders: "= vars.ws.value.folders", untitled_workspace: false}
            - call: lifecycle-service.veto
              input: {id: veto.untitledWorkspace, veto: false}
            - return: {veto: false}
          dont_save:
            - title: Delete the untitled workspace
              source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:133-139"
              call: workspace-context.set-folders
              input: {folders: "= vars.ws.value.folders", untitled_workspace: false}
            - call: lifecycle-service.veto
              input: {id: veto.untitledWorkspace, veto: false}
            - return: {veto: false}
          cancel:
            - title: Cancel keeps the window open
              source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:141-147"
              call: lifecycle-service.veto
              input: {id: veto.untitledWorkspace, veto: true}
            - return: {veto: true}
  - component: native-workspace-editing-service
    name: add-folders
    kind: function
    summary: "addFolders / doAddFolders: in a single-folder or empty window adding folders creates and enters an untitled multi-root workspace (extension hosts are stopped, may be vetoed, and restarted); in a workspace the folders are added to it. Adding the folder that is already open is a no-op."
    sources:
      - "src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:189-229"
      - "src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:260-281"
      - "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:178-209"
    request: {type: object, required: [folders], properties: {folders: {type: array, items: {type: string}, examples: [["file:///work/lib"]]}}}
    response: {type: object, properties: {entered_workspace: {type: boolean}, folders: {type: array, items: {type: string}}}}
    behavior:
      - call: workspace-context.get-workspace
        as: ws
      - set:
          vars.merged: "= vars.ws.value.folders + input.folders.filter(f, !(f in vars.ws.value.folders))"
      - if: "vars.ws.value.workbench_state == 'workspace'"
        then:
          - title: Already a workspace, add the folders to it
            source: "src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:219-228"
            call: workspace-context.set-folders
            input: {folders: "= vars.merged", untitled_workspace: "= vars.ws.value.untitled_workspace"}
          - return: {entered_workspace: false, folders: "= vars.merged"}
      - if: "(vars.ws.value.workbench_state == 'empty' && size(vars.merged) == 0) || (vars.ws.value.workbench_state == 'folder' && size(vars.merged) == 1)"
        then:
          - title: No-op for the current state
            source: "src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:212-214"
            return: {entered_workspace: false, folders: "= vars.ws.value.folders"}
      - title: Stop the extension hosts before entering a multi-root workspace
        source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:179-182"
        call: extension-service.stop-extension-hosts
        input: {reason: "Opening a multi-root workspace", auto: false}
        as: stopped
      - if: "!vars.stopped.value.stopped"
        then:
          - title: A participant vetoed stopping the extension hosts
            source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:180-182"
            return: {entered_workspace: false, folders: "= vars.ws.value.folders"}
      - title: Create and enter the untitled workspace with all folders
        source: "src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:260-281"
        call: workspace-context.set-folders
        input: {folders: "= vars.merged", untitled_workspace: true}
      - title: Restart the extension hosts in the new workspace
        source: "src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:206-208"
        call: extension-service.start-extension-hosts
      - return: {entered_workspace: true, folders: "= vars.merged"}
  - component: native-workspace-editing-service
    name: remove-folders
    kind: function
    summary: "removeFolders: removing the only folder of a single-folder window enters an empty untitled workspace; otherwise the folders are removed from the workspace."
    sources: ["src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:231-258"]
    request: {type: object, required: [folders], properties: {folders: {type: array, items: {type: string}, examples: [["file:///work/app"]]}}}
    behavior:
      - call: workspace-context.get-workspace
        as: ws
      - if: "vars.ws.value.workbench_state == 'folder' && input.folders.exists(f, f in vars.ws.value.folders)"
        then:
          - title: Removing the single folder enters an empty workspace
            source: "src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:233-237"
            call: workspace-context.set-folders
            input: {folders: [], untitled_workspace: true}
          - return: {folders: []}
      - call: workspace-context.set-folders
        input: {folders: "= vars.ws.value.folders.filter(f, !(f in input.folders))", untitled_workspace: "= vars.ws.value.untitled_workspace"}
      - return: {folders: "= vars.ws.value.folders.filter(f, !(f in input.folders))"}

  # ---------------- workspace-context anchor ----------------
  - component: workspace-context
    name: get-workspace
    kind: function
    summary: "IWorkspaceContextService.getWorkspace / getWorkbenchState: the folders, the workbench state (empty, folder, workspace), whether the workspace is untitled, its trust and remote authority."
    sources: ["src/vs/platform/workspace/common/workspace.ts:16-60"]
    response:
      type: object
      properties:
        folders: {type: array, items: {type: string}}
        workbench_state: {type: string, enum: [empty, folder, workspace]}
        untitled_workspace: {type: boolean}
        trusted: {type: boolean}
    behavior:
      - set:
          vars.untitled: "= ('untitled_workspace' in state) && state.untitled_workspace"
      - return:
          folders: "= state.folders"
          untitled_workspace: "= vars.untitled"
          workbench_state: "= vars.untitled || size(state.folders) > 1 ? 'workspace' : (size(state.folders) == 1 ? 'folder' : 'empty')"
          trusted: "= state.trusted"
          remote_authority: "= ('remote_authority' in state) ? state.remote_authority : ''"
  - component: workspace-context
    name: set-folders
    kind: function
    summary: "Replace the workspace folders (WorkspaceService.addFolders / removeFolders / entering a workspace) and fire onDidChangeWorkspaceFolders."
    sources: ["src/vs/workbench/services/configuration/browser/configurationService.ts:262-300"]
    request: {type: object, required: [folders], properties: {folders: {type: array, items: {type: string}}, untitled_workspace: {type: boolean}}}
    behavior:
      - set:
          vars.old: "= state.folders"
      - set:
          state.folders: "= input.folders"
          state.untitled_workspace: "= has(input.untitled_workspace) && input.untitled_workspace"
      - publish: workspace-context.on-did-change-workspace-folders
        delivery: sync
        input: {added: "= input.folders.filter(f, !(f in vars.old))", removed: "= vars.old.filter(f, !(f in input.folders))"}
      - return: {folders: "= input.folders"}
  - component: workspace-context
    name: on-did-change-workspace-folders
    kind: event
    summary: "IWorkspaceContextService.onDidChangeWorkspaceFolders."
    sources: ["src/vs/platform/workspace/common/workspace.ts:38"]
    request: {type: object, properties: {added: {type: array}, removed: {type: array}}}
  - component: workspace-context
    name: set-trusted
    kind: function
    summary: "Record the computed workspace trust (WorkspaceTrustManagementService.isTrusted setter, also mirrored into the workspace trust context keys)."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:347-349"]
    request: {type: object, required: [trusted], properties: {trusted: {type: boolean}}}
    behavior:
      - set:
          state.trusted: "= input.trusted"
      - return: {trusted: "= input.trusted"}

  # ---------------- workspace trust ----------------
  - component: workspace-trust-enablement-service
    name: is-workspace-trust-enabled
    kind: function
    summary: "isWorkspaceTrustEnabled: false when --disable-workspace-trust, else security.workspace.trust.enabled."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:82-88"]
    response: {type: object, properties: {enabled: {type: boolean}}}
    behavior:
      - return: {enabled: "= config['security-workspace-trust-enabled']"}
  - component: workspace-trust-management-service
    name: is-workspace-trusted
    kind: function
    summary: "isWorkspaceTrusted: the computed trust (always true when workspace trust is disabled)."
    sources:
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:517-519"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:303-307"
    response: {type: object, properties: {trusted: {type: boolean}}}
    behavior:
      - call: workspace-trust-enablement-service.is-workspace-trust-enabled
        as: en
      - if: "!vars.en.value.enabled"
        then:
          - title: Feature disabled, trusted
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:304-307"
            return: {trusted: true}
      - call: workspace-context.get-workspace
        as: ws
      - return: {trusted: "= vars.ws.value.trusted"}
  - component: workspace-trust-management-service
    name: get-uri-trust-info
    kind: function
    summary: "getUriTrustInfo / doGetUriTrustInfo: a URI is trusted when it equals or lies under a trusted URI (the longest match wins); everything is trusted when the feature is disabled."
    sources:
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:627-639"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:374-410"
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["file:///work/app"]}}}
    response: {type: object, properties: {trusted: {type: boolean}, uri: {type: string}}}
    behavior:
      - if: "!config['security-workspace-trust-enabled']"
        then:
          - return: {trusted: true, uri: "= input.uri"}
      - set:
          vars.m: "= state.uri_trust_info.filter(t, input.uri == t || input.uri.startsWith(t + '/'))"
      - return: {trusted: "= size(vars.m) > 0", uri: "= size(vars.m) > 0 ? vars.m[0] : input.uri"}
  - component: workspace-trust-management-service
    name: set-uris-trust
    kind: function
    summary: "setUrisTrust / doSetUrisTrust: add (trusted) or remove (untrusted) URIs from the trusted list; when it changed, persist it to application storage, fire onDidChangeTrustedFolders and recompute workspace trust."
    sources:
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:641-643"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:412-442"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:286-291"
    request: {type: object, required: [uris, trusted], properties: {uris: {type: array, items: {type: string}, examples: [["file:///work/app"]]}, trusted: {type: boolean}}}
    behavior:
      - set:
          vars.next: "= input.trusted ? state.uri_trust_info + input.uris.filter(u, !(u in state.uri_trust_info)) : state.uri_trust_info.filter(t, !(t in input.uris))"
      - if: "size(vars.next) == size(state.uri_trust_info)"
        then:
          - title: Nothing changed
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:439-441"
            return: {changed: false}
      - set:
          state.uri_trust_info: "= vars.next"
      - title: Persist the trusted URIs (application-shared storage)
        source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:286-288"
        call: storage-db.global-write
        input: {key: content.trust.model.key, value: "= vars.next"}
        on_error: continue
      - call: workspace-trust-management-service.update-workspace-trust
        input: {trusted: null}
      - return: {changed: true}
  - component: workspace-trust-management-service
    name: update-workspace-trust
    kind: function
    summary: "updateWorkspaceTrust / calculateWorkspaceTrust: recompute trust (all workspace folders trusted; empty window uses security.workspace.trust.emptyWindow), and when it changed store it and fire onDidChangeTrust."
    sources:
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:338-358"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:303-336"
    request: {type: object, properties: {trusted: {type: [boolean, "null"], default: null}}}
    behavior:
      - if: "!config['security-workspace-trust-enabled']"
        then:
          - title: Feature disabled, nothing to update
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:339-341"
            return: {changed: false}
      - call: workspace-context.get-workspace
        as: ws
      - set:
          vars.calc: "= has(input.trusted) && input.trusted != null ? input.trusted : (vars.ws.value.workbench_state == 'empty' ? config['security-workspace-trust-empty-window'] : vars.ws.value.folders.all(f, state.uri_trust_info.exists(t, f == t || f.startsWith(t + '/'))))"
      - if: "vars.calc == vars.ws.value.trusted"
        then:
          - return: {changed: false, trusted: "= vars.calc"}
      - call: workspace-context.set-trusted
        input: {trusted: "= vars.calc"}
      - title: Fire onDidChangeTrust
        source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:356-357"
        publish: workspace-trust-management-service.on-did-change-trust
        delivery: sync
        input: {trusted: "= vars.calc"}
      - return: {changed: true, trusted: "= vars.calc"}
  - component: workspace-trust-management-service
    name: set-workspace-trust
    kind: function
    summary: "setWorkspaceTrust: an empty window sets trust directly; otherwise trust or untrust all workspace folder URIs."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:616-625"]
    request: {type: object, required: [trusted], properties: {trusted: {type: boolean}}}
    behavior:
      - call: workspace-context.get-workspace
        as: ws
      - if: "vars.ws.value.workbench_state == 'empty'"
        then:
          - call: workspace-trust-management-service.update-workspace-trust
            input: {trusted: "= input.trusted"}
          - return: {trusted: "= input.trusted"}
      - call: workspace-trust-management-service.set-uris-trust
        input: {uris: "= vars.ws.value.folders", trusted: "= input.trusted"}
      - return: {trusted: "= input.trusted"}
  - component: workspace-trust-management-service
    name: initialize
    kind: function
    summary: "Constructor and initializeWorkspaceTrust: load the trusted URIs from storage, compute the initial trust once canonical URIs are resolved, then resolve workspaceTrustInitialized."
    sources:
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:118-148"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:151-189"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:260-284"
    behavior:
      - title: Load trust info from application storage
        source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:260-284"
        call: storage-db.global-read
        input: {key: content.trust.model.key}
        on_error: continue
      - call: workspace-trust-management-service.update-workspace-trust
        input: {trusted: null}
        as: upd
      - set:
          state.initialized: true
      - return: {trusted: "= vars.upd.value.trusted"}
  - component: workspace-trust-management-service
    name: on-did-change-trust
    kind: event
    summary: "IWorkspaceTrustManagementService.onDidChangeTrust(trusted), fired synchronously; areas subscribe to leave or enter restricted mode."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:103-104"]
    request: {type: object, properties: {trusted: {type: boolean}}}
  - component: workspace-trust-request-service
    name: request-workspace-trust
    kind: function
    summary: "requestWorkspaceTrust: a trusted workspace answers true at once; otherwise a single modal request is created (a second caller joins it) and onDidInitiateWorkspaceTrustRequest asks the user (the dialog lives in contrib/workspace; the user's answer is the modal choice here)."
    sources:
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:885-904"
      - "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:854-883"
    request: {type: object, properties: {message: {type: string}}}
    response: {type: object, properties: {trusted: {type: [boolean, "null"]}, joined: {type: boolean}}}
    behavior:
      - call: workspace-trust-management-service.is-workspace-trusted
        as: t
      - if: "vars.t.value.trusted"
        then:
          - title: Already trusted
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:886-889"
            return: {trusted: true, joined: false}
      - if: "state.pending_workspace_request"
        then:
          - title: A request is already pending, return its promise
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:897-900"
            return: {trusted: null, joined: true}
      - set:
          state.pending_workspace_request: true
      - title: Fire onDidInitiateWorkspaceTrustRequest, the modal asks the user
        source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:902-903"
        choice: modal
        default: trust
        options:
          trust:
            - call: workspace-trust-request-service.complete-workspace-trust-request
              input: {trusted: true}
            - return: {trusted: true, joined: false}
          cancel:
            - title: Canceled, resolve with undefined
              source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:863-870"
              set:
                state.pending_workspace_request: false
            - return: {trusted: null, joined: false}
  - component: workspace-trust-request-service
    name: complete-workspace-trust-request
    kind: function
    summary: "completeWorkspaceTrustRequest: when the answer differs from the current trust, set workspace trust (which stores it and fires onDidChangeTrust), then resolve the pending request."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:872-883"]
    request: {type: object, properties: {trusted: {type: boolean}}}
    behavior:
      - call: workspace-trust-management-service.is-workspace-trusted
        as: t
      - if: "has(input.trusted) && input.trusted != vars.t.value.trusted"
        then:
          - title: Update storage and transition the workspace
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:878-882"
            call: workspace-trust-management-service.set-workspace-trust
            input: {trusted: "= input.trusted"}
      - set:
          state.pending_workspace_request: false
      - return: {resolved: true}
  - component: workspace-trust-request-service
    name: request-open-files-trust
    kind: function
    summary: "requestOpenFilesTrust: opening files from outside a trusted workspace asks Open / Open in New Window unless every file is trusted, the workspace is untrusted, security.workspace.trust.untrustedFiles decides, or the user already accepted."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:766-808"]
    request: {type: object, required: [uris], properties: {uris: {type: array, items: {type: string}, examples: [["file:///tmp/notes.txt"]]}}}
    response: {type: object, properties: {response: {type: string, enum: [open, open-in-new-window, cancel]}}}
    behavior:
      - call: workspace-trust-management-service.is-workspace-trusted
        as: t
      - if: "!vars.t.value.trusted"
        then:
          - title: Untrusted workspace, no conflict
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:767-770"
            return: {response: open}
      - foreach: "= input.uris"
        as: u
        steps:
          - call: workspace-trust-management-service.get-uri-trust-info
            input: {uri: "= vars.u"}
            as: ui
          - if: "!vars.ui.value.trusted"
            then:
              - set: {vars.untrusted: true}
      - if: "!has(vars.untrusted)"
        then:
          - title: All files trusted
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:774-777"
            return: {response: open}
      - if: "config['security-workspace-trust-untrusted-files'] != 'prompt'"
        then:
          - title: The setting answers without asking
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:780-788"
            return: {response: "= config['security-workspace-trust-untrusted-files'] == 'newWindow' ? 'open-in-new-window' : 'open'"}
      - call: workspace-trust-management-service.get-accepts-out-of-workspace-files
        as: acc
      - if: "vars.acc.value.accepts"
        then:
          - title: The user already accepted untrusted files
            source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:791-794"
            return: {response: open}
      - title: Ask the user (dialog in contrib/workspace)
        source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:796-807"
        choice: open_files
        default: open
        options:
          open:
            - title: Open, remember acceptsOutOfWorkspaceFiles
              source: "src/vs/workbench/services/workspaces/common/workspaceTrust.ts:743-746"
              call: workspace-trust-management-service.set-accepts-out-of-workspace-files
              input: {value: true}
            - return: {response: open}
          new_window:
            - return: {response: open-in-new-window}
          cancel:
            - return: {response: cancel}
  - component: workspace-trust-management-service
    name: get-accepts-out-of-workspace-files
    kind: function
    summary: "acceptsOutOfWorkspaceFiles getter (workspace memento)."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:509-511"]
    response: {type: object, properties: {accepts: {type: boolean}}}
    behavior:
      - return: {accepts: "= state.accepts_out_of_workspace_files"}
  - component: workspace-trust-management-service
    name: set-accepts-out-of-workspace-files
    kind: function
    summary: "acceptsOutOfWorkspaceFiles setter (saved to the workspace memento)."
    sources: ["src/vs/workbench/services/workspaces/common/workspaceTrust.ts:513-515"]
    request: {type: object, required: [value], properties: {value: {type: boolean}}}
    behavior:
      - set:
          state.accepts_out_of_workspace_files: "= input.value"
      - return: {accepts: "= input.value"}

  # ---------------- notification-service ----------------
  - component: notification-service
    name: notify
    kind: function
    summary: "NotificationService.notify / info / warn / error: add the notification at the top of the model, closing a duplicate; with do-not-disturb on, non-error notifications are silent (no toast)."
    sources:
      - "src/vs/workbench/services/notification/common/notificationService.ts:193-230"
      - "src/vs/workbench/common/notifications.ts:226-257"
      - "src/vs/workbench/common/notifications.ts:512-519"
    request:
      type: object
      required: [severity, message]
      properties:
        severity: {type: string, enum: [info, warning, error], examples: [info]}
        message: {type: string, examples: ["Extension host terminated unexpectedly."]}
        source: {type: string}
    response: {type: object, properties: {id: {type: integer}, silent: {type: boolean}}}
    behavior:
      - set:
          vars.silent: "= state.dnd && input.severity != 'error'"
      - title: Add as first entry, de-duplicating by message
        source: "src/vs/workbench/common/notifications.ts:232-240"
        set:
          state.notifications: "= [{'id': state.next_id, 'severity': input.severity, 'message': input.message, 'silent': state.dnd && input.severity != 'error'}] + state.notifications.filter(n, n.message != input.message)"
          state.next_id: "= state.next_id + 1"
      - return: {id: "= state.next_id - 1", silent: "= vars.silent"}
