  - component: notification-service
    name: set-filter
    kind: function
    summary: "setFilter(global): toggle do-not-disturb (NotificationsFilter.ERROR); persisted in application storage under notifications.doNotDisturbMode; no-op when unchanged."
    sources: ["src/vs/workbench/services/notification/common/notificationService.ts:78-92"]
    request: {type: object, required: [dnd], properties: {dnd: {type: boolean}}}
    behavior:
      - if: "state.dnd == input.dnd"
