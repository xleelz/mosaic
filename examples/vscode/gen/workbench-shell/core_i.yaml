# Fix round (after judging): entities added by workbench-shell. See notes/workbench-shell.md "Fix round".
configs:
  - id: workbench-editor-use-modal
    type: string
    value: some
    default: some
    summary: 'workbench.editor.useModal: off never opens editors modal (wins over RequiresModal), some opens only editors that require it, all opens every editor modal.'
    sources:
    - src/vs/workbench/browser/workbench.contribution.ts:374-388
    - src/vs/workbench/services/editor/common/editorService.ts:46-55
    attributes:
      key: workbench.editor.useModal
components:
  - id: context-key-service
    name: ContextKeyService
    kind: service
    layer: platform
    parent: platform
    summary: IContextKeyService, the context key values keybinding when clauses read; owned by platform-core (boundary).
    sources:
    - src/vs/platform/contextkey/common/contextkey.ts:2056
    attributes:
      boundary: true
      owner: platform-core
  - id: commands-quick-access
    name: CommandsQuickAccessProvider
    kind: module
    layer: workbench
    parent: workbench
    summary: 'The command palette (''>'' quick access): lists the CommandPalette menu items whose when clause holds in the current context, filtered by the typed text and sorted recently used first; accepting
      a pick records it in the commands history and runs it through ICommandService.'
    sources:
    - src/vs/workbench/contrib/quickaccess/browser/commandsQuickAccess.ts:44
    - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:49-354
    - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:374-497
    state:
      initial:
        items:
        - command_id: workbench.action.keepEditor
          label: 'View: Keep Editor'
          when: config.workbench.editor.enablePreview
        - command_id: workbench.action.pinEditor
          label: 'View: Pin Editor'
        - command_id: workbench.action.unpinEditor
          label: 'View: Unpin Editor'
        - command_id: workbench.action.closeActiveEditor
          label: 'View: Close Editor'
        - command_id: workbench.action.closeEditorsInGroup
          label: 'View: Close All Editors in Group'
        - command_id: workbench.action.closeEditorsToTheRight
          label: 'View: Close Editors to the Right in Group'
          when: '!activeEditorLastInGroup'
        - command_id: workbench.action.closeEditorsAndGroup
          label: 'View: Close Editor Group'
          when: multipleEditorGroups
        history: {}
        counter: 1
  - id: account-policy-service
    name: AccountPolicyService
    kind: service
    layer: workbench
    parent: workbench
    summary: 'IPolicyService for the default account: each policy definition''s value(policyData) over the account''s policy data becomes a policy value with source Account; the value is deleted when the
      provider returns undefined. Policy value providers are held as CEL data and run with eval.'
    sources:
    - src/vs/workbench/services/policies/common/accountPolicyService.ts:84-157
    - src/vs/workbench/browser/web.main.ts:381
    state:
      initial:
        definitions:
          ChatAgentMode:
            key: chat.agent.enabled
            value: 'has(policyData.chat_agent_enabled) && policyData.chat_agent_enabled == false ? false : null'
          ChatHooks:
            key: chat.useHooks
            value: 'has(policyData.chat_preview_features_enabled) && policyData.chat_preview_features_enabled == false ? false : null'
          McpGalleryServiceUrl:
            key: chat.mcp.gallery.serviceUrl
            value: 'has(policyData.mcpRegistryUrl) ? policyData.mcpRegistryUrl : null'
        account_policy_data: null
        policies: {}
        sources: {}
        last_changed: []
  - id: modal-editor-part
    name: ModalEditorPart
    kind: module
    layer: workbench
    parent: editor-parts
    summary: 'The modal editor part: one centered overlay with its own editor group; created on demand (reused while open) and closed by closing its editors.'
    sources:
    - src/vs/workbench/browser/parts/editor/modalEditorPart.ts:178-200
    - src/vs/workbench/browser/parts/editor/modalEditorPart.ts:1168-1192
    state:
      initial:
        open: false
        group: null
        requires_modal_schemes:
        - runtime-extensions
        - vscode-workspace-trust
  - id: opener-service
    name: OpenerService
    kind: service
    layer: platform
    parent: platform
    summary: IOpenerService, owned by platform-core (boundary).
    sources:
    - src/vs/platform/opener/common/opener.ts:12
    attributes:
      boundary: true
      owner: platform-core
interfaces:
  - component: text-file-models
    name: resolve
    kind: function
    summary: TextFileEditorModelManager.resolve, owned by files-search-scm (boundary); returns the existing model or creates one.
    sources:
    - src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:365-487
    attributes:
      boundary: true
      owner: files-search-scm
    request:
      type: object
      required:
      - resource
      properties:
        resource:
          type: string
          examples:
          - file:///work/app/src/util.ts
    errors:
    - code: file-not-found
      status: 0
      retryable: false
    - code: file-is-binary
      status: 0
      retryable: false
  - component: context-key-service
    name: get-context-key-value
    kind: function
    summary: getContextKeyValue, one root-context value (null when unset); owned by platform-core (boundary).
    sources:
    - src/vs/platform/contextkey/browser/contextKeyService.ts:332-337
    attributes:
      boundary: true
      owner: platform-core
    request:
      type: object
      required:
      - key
      properties:
        key:
          type: string
          examples:
          - config.files.autoSave
    response:
      type: object
      properties:
        value: {}
  - component: dialog-service
    name: error
    kind: function
    summary: 'IDialogService.error: an error-severity prompt with the message and detail.'
    sources:
    - src/vs/workbench/services/dialogs/common/dialogService.ts:87-89
    request:
      type: object
      properties:
        message:
          type: string
        detail:
          type: string
    behavior:
    - call: dialog-service.prompt
      input:
        type: error
        message: = input.message
    - set:
        state.last_error: '= {"message": input.message, "detail": has(input.detail) ? input.detail : ""}'
    - return:
        shown: true
  - component: commands-quick-access
    name: get-picks
    kind: function
    summary: '_getPicks over getGlobalCommandPicks: CommandPalette menu items whose when clause matches the context (eval over the context key values), filtered by label or exact command id, recently used
      commands first (newest first), the rest in menu order.'
    sources:
    - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:77-200
    - src/vs/workbench/contrib/quickaccess/browser/commandsQuickAccess.ts:226-262
    request:
      type: object
      properties:
        filter:
          type: string
          default: ''
          examples:
          - pin
    response:
      type: object
      properties:
        picks:
          type: array
    behavior:
    - set:
        vars.filter: '= has(input.filter) ? input.filter : ""'
    - title: The context keys the menu items' when clauses read
      source: src/vs/platform/actions/common/menuService.ts:301-315
      set:
        vars.keys: = replace(replace(replace(state.items.filter(k, has(k.when)).map(k, k.when).join(" "), "'[^']*'", " "), "(==|!=)\\s*[A-Za-z0-9_.:/-]+", " "), "[^A-Za-z0-9_.:-]+", " ").trim().split(" ").filter(x,
          x != "" && x != "true" && x != "false")
        vars.ctx: {}
    - title: Read each key from the context key service
      source: src/vs/platform/actions/common/menuService.ts:181
      foreach: = vars.keys
      as: key
      steps:
      - if: '!(vars.key in vars.ctx)'
        then:
        - call: context-key-service.get-context-key-value
          input:
            key: = vars.key
          as: kv
        - set:
            vars.ctx: '= merge(vars.ctx, {vars.key: vars.kv.value.value})'
    - title: Each when clause becomes a CEL rule (bare key truthy, key == value, &&, ||, !)
      source: src/vs/platform/contextkey/common/contextkey.ts:1652-1659
      set:
        vars.rules: '= state.items.map(k, !has(k.when) ? "true" : replace(replace(replace(replace(k.when, "([A-Za-z_][A-Za-z0-9_.:-]*)\\s*(==|!=)\\s*''?([A-Za-z0-9_.:/-]+)''?", "#$1#$2@$3@"), "(^|[^@#A-Za-z0-9_.:-])([A-Za-z_][A-Za-z0-9_.:-]*)",
          "$1%$2%"), "%([^%]+)%", "!(c[\"$1\"] in [null, false, \"\", 0])"), "#([^#]+)#(==|!=)@([^@]*)@", "(c[\"$1\"] $2 \"$3\")"))'
    - title: menuService.getMenuActions(CommandPalette) keeps the items whose when clause holds
      source: src/vs/platform/actions/common/menuService.ts:326
      set:
        vars.visible: '= lists.range(size(state.items)).filter(i, eval(vars.rules[i], {"c": vars.ctx})).map(i, state.items[i])'
    - title: Keep picks whose label matches the filter, or whose command id equals it
      source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:99-121
      set:
        vars.picks: = vars.visible.filter(p, vars.filter == "" || p.label.lowerAscii().contains(vars.filter.lowerAscii()) || p.command_id == vars.filter)
    - set:
        vars.recent: = vars.picks.filter(p, p.command_id in state.history)
        vars.rest: = vars.picks.filter(p, !(p.command_id in state.history))
    - title: Sort by MRU order (the higher history counter first), the rest after
      source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:152-183
      set:
        vars.sorted: = lists.range(size(vars.recent)).map(r, vars.recent.filter(p, size(vars.recent.filter(q, state.history[q.command_id] > state.history[p.command_id])) == r)[0]) + vars.rest
    - return:
        picks: '= vars.sorted.map(p, {"command_id": p.command_id, "label": p.label, "recently_used": p.command_id in state.history})'
  - component: commands-quick-access
    name: accept
    kind: function
    summary: 'A pick''s accept: push the command into the commands history, then await ICommandService.executeCommand; an error other than cancellation shows an error dialog.'
    sources:
    - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:303-324
    request:
      type: object
      required:
      - command_id
      properties:
        command_id:
          type: string
          examples:
          - workbench.action.closeActiveEditor
        label:
          type: string
        args:
          type: array
          default: []
    response:
      type: object
      properties:
        executed:
          type: boolean
    behavior:
    - title: Add the command to the commands history (counter++)
      source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:450-457
      set:
        state.history: '= merge(state.history, {input.command_id: state.counter})'
        state.counter: = state.counter + 1
    - title: Run the command through ICommandService
      source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:315-318
      call: command-service.execute-command
      input:
        command_id: = input.command_id
        args: '= has(input.args) ? input.args : []'
      on_error:
      - when: error.code != 'canceled'
        title: A failure other than cancellation shows an error dialog
        source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:319-322
        call: dialog-service.error
        input:
          message: '= "Command ''" + (has(input.label) ? input.label : input.command_id) + "'' resulted in an error"'
          detail: = error.message
      - return:
          executed: false
    - return:
        executed: true
  - component: configuration-service
    name: get-value
    kind: function
    summary: IConfigurationService.getValue (platform-core, boundary).
    sources:
    - src/vs/platform/configuration/common/configurationService.ts:96-100
    attributes:
      boundary: true
      owner: platform-core
    request:
      type: object
      required:
      - key
      properties:
        key:
          type: string
          examples:
          - files.autoSave
        resource:
          type: string
          examples:
          - file:///work/app/src/main.ts
    response:
      type: object
      properties:
        value: {}
  - component: configuration-resolver-service
    name: resolve-async
    kind: function
    summary: 'AbstractVariableResolverService.resolveAsync for a string: each ${variable[:argument]} is evaluated (env, config, workspaceFolder, workspaceFolderBasename, cwd, userHome, file, fileBasename,
      relativeFile, pathSeparator); command and input variables and unknown names stay as written (they need resolveWithInteraction); a variable that cannot be resolved throws a VariableError.'
    sources:
    - src/vs/workbench/services/configurationResolver/common/variableResolver.ts:83-94
    - src/vs/workbench/services/configurationResolver/common/variableResolver.ts:110-331
    - src/vs/workbench/services/configurationResolver/browser/baseConfigurationResolverService.ts:55-80
    request:
      type: object
      required:
      - value
      properties:
        folder_uri:
          type: string
          examples:
          - file:///work/app
        value:
          type: string
          examples:
          - abc ${workspaceFolder} xyz
    response:
      type: object
      properties:
        value:
          type: string
    errors:
    - code: variable-error
      status: 0
      retryable: false
    behavior:
    - set:
        vars.parts: = input.value.split('${')
        vars.folder: '= has(input.folder_uri) && input.folder_uri != null ? input.folder_uri : ""'
    - set:
        vars.out: = vars.parts[0]
    - call: workspace-context.get-workspace
      as: ws
    - title: ConfigurationResolverExpression.parse finds the ${...} replacements; each unresolved one is evaluated in turn
      source: src/vs/workbench/services/configurationResolver/common/variableResolver.ts:86-91
      foreach: = vars.parts.slice(1, size(vars.parts))
      as: part
      steps:
      - if: '!vars.part.contains("}")'
        then:
        - set:
            vars.out: = vars.out + '${' + vars.part
        else:
        - set:
            vars.id: = vars.part.substring(0, vars.part.indexOf("}"))
            vars.rest: = vars.part.substring(vars.part.indexOf("}") + 1)
        - set:
            vars.name: '= vars.id.contains(":") ? vars.id.substring(0, vars.id.indexOf(":")) : vars.id'
            vars.arg: '= vars.id.contains(":") ? vars.id.substring(vars.id.indexOf(":") + 1) : ""'
            vars.val: = '${' + vars.id + '}'
        - if: vars.name == 'env'
          then:
          - if: vars.arg == ''
            then:
            - fail:
                code: variable-error
                message: = "Variable ${" + vars.id + "} can not be resolved because no environment variable name is given."
          - title: An environment variable, or the empty string when it is not set
            source: src/vs/workbench/services/configurationResolver/common/variableResolver.ts:167-177
            set:
              vars.val: '= vars.arg in state.env ? state.env[vars.arg] : ""'
        - if: vars.name == 'config'
          then:
          - if: vars.arg == ''
            then:
            - fail:
                code: variable-error
                message: = "Variable ${" + vars.id + "} can not be resolved because no settings name is given."
          - title: A setting read through IConfigurationService (scoped to the folder when one is given)
            source: src/vs/workbench/services/configurationResolver/common/variableResolver.ts:180-191
            call: configuration-service.get-value
            input:
              key: = vars.arg
              resource: = vars.folder
            as: cv
          - if: vars.cv.value.value == null
            then:
            - fail:
                code: variable-error
                message: = "Variable ${" + vars.id + "} can not be resolved because setting '" + vars.arg + "' not found."
          - if: type(vars.cv.value.value) == map || type(vars.cv.value.value) == list
            then:
            - fail:
                code: variable-error
                message: = "Variable ${" + vars.id + "} can not be resolved because '" + vars.arg + "' is a structured value."
          - set:
              vars.val: = string(vars.cv.value.value)
        - if: vars.name in ['workspaceFolder', 'workspaceRoot', 'workspaceFolderBasename', 'workspaceRootFolderName', 'cwd']
          then:
          - title: 'getFolderUri: a named folder, else the given folder, else an error (several folders need a name)'
            source: src/vs/workbench/services/configurationResolver/common/variableResolver.ts:149-164
            set:
              vars.named: = vars.ws.value.folders.filter(f, f.endsWith("/" + vars.arg))
          - if: vars.arg != '' && size(vars.named) == 0
            then:
            - fail:
                code: variable-error
                message: = "Variable " + vars.name + " can not be resolved. No such folder '" + vars.arg + "'."
          - if: vars.arg == '' && vars.folder == ''
            then:
            - if: size(vars.ws.value.folders) > 1
              then:
              - fail:
                  code: variable-error
                  message: = "Variable " + vars.name + " can not be resolved in a multi folder workspace. Scope this variable using ':' and a workspace folder name."
            - fail:
                code: variable-error
                message: = "Variable " + vars.name + " can not be resolved. Please open a folder."
          - set:
              vars.fpath: '= replace(vars.arg != "" ? vars.named[0] : vars.folder, "^file://", "")'
          - set:
              vars.val: '= vars.name in ["workspaceFolderBasename", "workspaceRootFolderName"] ? vars.fpath.split("/")[size(vars.fpath.split("/")) - 1] : vars.fpath'
        - if: vars.name == 'userHome'
          then:
          - title: userHome from the environment service
            source: src/vs/workbench/services/configurationResolver/common/variableResolver.ts:227-231
            set:
              vars.val: = state.user_home
        - if: vars.name in ['pathSeparator', '/']
          then:
          - set:
              vars.val: /
        - if: vars.name in ['file', 'fileBasename', 'relativeFile']
          then:
          - title: getFilePath reads the active editor's file resource; without one the variable fails
            source: src/vs/workbench/services/configurationResolver/browser/baseConfigurationResolverService.ts:71-80
            call: editor-groups.get-state
            as: eg
          - set:
              vars.ag: = vars.eg.value.groups.filter(g, g.id == vars.eg.value.active_group)
          - if: size(vars.ag) == 0 || vars.ag[0].active == null || !vars.ag[0].active.startsWith('file://')
            then:
            - fail:
                code: variable-error
                message: = "Variable ${" + vars.id + "} can not be resolved. Please open an editor."
          - set:
              vars.file: = replace(vars.ag[0].active, "^file://", "")
          - set:
              vars.val: '= vars.name == "file" ? vars.file : (vars.name == "fileBasename" ? vars.file.split("/")[size(vars.file.split("/")) - 1] : (vars.folder != "" ? replace(vars.file, "^" + replace(vars.folder,
                "^file://", "") + "/", "") : vars.file))'
        - set:
            vars.out: = vars.out + vars.val + vars.rest
    - return:
        value: = vars.out
  - component: account-policy-service
    name: on-did-change-policy-data
    kind: event
    summary: 'defaultAccountService.onDidChangePolicyData / onDidChangeDefaultAccount: store the account''s policy data (null when signed out) and re-run _updatePolicyDefinitions.'
    sources:
    - src/vs/workbench/services/policies/common/accountPolicyService.ts:127-135
    request:
      type: object
      properties:
        signed_in:
          type: boolean
          default: true
        policy_data:
          type: object
          default: {}
          examples:
          - {}
    behavior:
    - set:
        state.account_policy_data: null
    - if: '!has(input.signed_in) || input.signed_in'
      then:
      - set:
          state.account_policy_data: '= has(input.policy_data) ? input.policy_data : {}'
    - call: account-policy-service.update-policy-definitions
      as: upd
    - return: = vars.upd.value
  - component: account-policy-service
    name: update-policy-definitions
    kind: function
    summary: '_updatePolicyDefinitions: without policy data every policy resolves to undefined (deleted); otherwise value(policyData) for each definition; the changed names fire onDidChange.'
    sources:
    - src/vs/workbench/services/policies/common/accountPolicyService.ts:168-197
    response:
      type: object
      properties:
        updated:
          type: array
    behavior:
    - set:
        vars.names: = state.definitions.map(n, n)
        vars.data: = state.account_policy_data
    - title: resolvePolicyValue runs the definition's value provider over the policy data (undefined without data)
      source: src/vs/workbench/services/policies/common/accountPolicyService.ts:199-211
      set:
        vars.resolved: '= vars.data == null ? [] : vars.names.filter(n, eval(state.definitions[n].value, {"policyData": vars.data}) != null).map(n, n)'
    - set:
        vars.values: {}
    - foreach: = vars.resolved
      as: n
      steps:
      - set:
          vars.values: '= merge(vars.values, {vars.n: eval(state.definitions[vars.n].value, {"policyData": vars.data})})'
    - title: updatePolicyValue deletes undefined values and stores changed ones with source Account; changed names are collected
      source: src/vs/platform/policy/common/policy.ts:118-139
      set:
        vars.updated: = vars.names.filter(n, (n in vars.values) != (n in state.policies) || ((n in vars.values) && state.policies[n] != vars.values[n]))
    - set:
        state.policies: null
        state.sources: null
    - set:
        state.policies: = vars.values
        state.sources: {}
    - foreach: = vars.resolved
      as: n
      steps:
      - set:
          state.sources: '= merge(state.sources, {vars.n: "account"})'
    - if: size(vars.updated) > 0
      then:
      - title: onDidChange fires with the updated policy names
        source: src/vs/workbench/services/policies/common/accountPolicyService.ts:190-192
        set:
          state.last_changed: = vars.updated
      - publish: account-policy-service.on-did-change
        delivery: sync
        input:
          names: = vars.updated
    - return:
        updated: = vars.updated
  - component: account-policy-service
    name: on-did-change
    kind: event
    summary: 'IPolicyService.onDidChange (AbstractPolicyService._onDidChange): the policy names whose value changed; PolicyConfiguration listens.'
    sources:
    - src/vs/workbench/services/policies/common/accountPolicyService.ts:190-192
    request:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
  - component: account-policy-service
    name: get-policy-value
    kind: function
    summary: 'AbstractPolicyService.getPolicyValue / getPolicyValueSource: the stored value and its source, or null when the policy has none.'
    sources:
    - src/vs/platform/policy/common/policy.ts:95-108
    request:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          examples:
          - ChatAgentMode
    response:
      type: object
      properties:
        value: {}
        source: {}
    behavior:
    - return:
        value: '= input.name in state.policies ? state.policies[input.name] : null'
        source: '= input.name in state.policies ? state.sources[input.name] : null'
  - component: editor-parts
    name: create-modal-editor-part
    kind: function
    summary: 'EditorParts.createModalEditorPart: reuse the open modal part, else create one (modalEditorVisible becomes true) with a fresh active group.'
    sources:
    - src/vs/workbench/browser/parts/editor/editorParts.ts:196-240
    response:
      type: object
      properties:
        group:
          type: object
        reused:
          type: boolean
    behavior:
    - call: modal-editor-part.get-group
      as: cur
    - if: vars.cur.value.open
      then:
      - title: Reuse the existing modal editor part
        source: src/vs/workbench/browser/parts/editor/editorParts.ts:198-203
        return:
          group: = vars.cur.value.group
          reused: true
    - title: doCreateModalEditorPart creates the part and its group
      source: src/vs/workbench/browser/parts/editor/editorParts.ts:222-240
      call: modal-editor-part.create
      as: created
    - return:
        group: = vars.created.value.group
        reused: false
  - component: modal-editor-part
    name: get-group
    kind: function
    summary: Whether the modal editor part is open, and its group (editors, active editor).
    sources:
    - src/vs/workbench/browser/parts/editor/modalEditorPart.ts:936-960
    response:
      type: object
      properties:
        open:
          type: boolean
        group: {}
        requires_modal_schemes:
          type: array
    behavior:
    - return:
        open: = state.open
        group: = state.group
        requires_modal_schemes: = state.requires_modal_schemes
  - component: modal-editor-part
    name: create
    kind: function
    summary: 'ModalEditorPart.create: build the overlay with one empty editor group (id -4 stands for MODAL_GROUP here).'
    sources:
    - src/vs/workbench/browser/parts/editor/modalEditorPart.ts:193-260
    behavior:
    - set:
        state.open: true
        state.group: '= {"id": -4, "editors": [], "active": null, "preview": null, "sticky": [], "mru": [], "locked": false}'
    - return:
        group: = state.group
  - component: modal-editor-part
    name: put-group
    kind: function
    summary: Store the modal part's group after an editor was opened in it (the modal group's EditorGroupView.openEditor).
    sources:
    - src/vs/workbench/browser/parts/editor/editorGroupView.ts:1190-1260
    request:
      type: object
      required:
      - group
      properties:
        group:
          type: object
    behavior:
    - set:
        state.group: = input.group
    - return:
        stored: true
  - component: modal-editor-part
    name: close
    kind: function
    summary: 'ModalEditorPart.close: close all editors of its group, then the part (onWillClose).'
    sources:
    - src/vs/workbench/browser/parts/editor/modalEditorPart.ts:1168-1192
    behavior:
    - if: '!state.open'
      then:
      - return:
          closed: false
    - set:
        state.open: false
        state.group: null
    - return:
        closed: true
  - component: banner-part
    name: show
    kind: function
    summary: 'BannerPart.show: (re)insert the item by id, then render the active item (the last one with the highest priority) and make the banner part visible.'
    sources:
    - src/vs/workbench/browser/parts/banner/bannerPart.ts:175-205
    request:
      type: object
      required:
      - id
      - message
      properties:
        id:
          type: string
          examples:
          - workbench.banner.restrictedMode
        message:
          type: string
          examples:
          - Restricted Mode is intended for safe code browsing. Trust this folder to enable all features.
        priority:
          type: integer
          default: 0
        actions:
          type: array
          default: []
    behavior:
    - set:
        vars.item: '= {"id": input.id, "message": input.message, "priority": has(input.priority) ? input.priority : 0, "actions": has(input.actions) ? input.actions : []}'
    - title: items.delete(id) then items.set(id, item), so a re-shown item moves to the end
      source: src/vs/workbench/browser/parts/banner/bannerPart.ts:175-179
      set:
        state.items: = state.items.filter(i, i.id != input.id) + [vars.item]
    - call: banner-part.render-active-item
      as: r
    - return: = vars.r.value
  - component: banner-part
    name: hide
    kind: function
    summary: 'BannerPart.hide: drop the item by id and render the next active item; the part hides when none is left.'
    sources:
    - src/vs/workbench/browser/parts/banner/bannerPart.ts:170-173
    request:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          examples:
          - workbench.banner.restrictedMode
    behavior:
    - set:
        state.items: = state.items.filter(i, i.id != input.id)
    - call: banner-part.render-active-item
      as: r
    - return: = vars.r.value
  - component: banner-part
    name: render-active-item
    kind: function
    summary: 'renderActiveItem: the active item is the last one whose priority is at least every other''s; none hides the part (setVisibility(false)), one shows it.'
    sources:
    - src/vs/workbench/browser/parts/banner/bannerPart.ts:181-250
    behavior:
    - set:
        vars.top: = state.items.filter(c, state.items.all(o, c.priority >= o.priority))
    - if: size(vars.top) == 0
      then:
      - title: No item left, hide the banner part
        source: src/vs/workbench/browser/parts/banner/bannerPart.ts:198-203
        set:
          state.active: null
          state.visible: false
      - return:
          visible: false
          active: null
    - title: Render the item and show the banner part
      source: src/vs/workbench/browser/parts/banner/bannerPart.ts:204-250
      set:
        state.active: = vars.top[size(vars.top) - 1].id
        state.visible: true
    - return:
        visible: true
        active: = state.active
  - component: banner-part
    name: get-state
    kind: function
    summary: The banner part's items, active item and visibility (the read path for show and hide).
    sources:
    - src/vs/workbench/browser/parts/banner/bannerPart.ts:47-62
    response:
      type: object
      properties:
        visible:
          type: boolean
        active: {}
        items:
          type: array
    behavior:
    - return:
        visible: = state.visible
        active: = state.active
        items: = state.items.map(i, i.id)
  - component: opener-service
    name: open
    kind: function
    summary: OpenerService.open, owned by platform-core (boundary).
    sources:
    - src/vs/editor/browser/services/openerService.ts:190-225
    attributes:
      boundary: true
      owner: platform-core
    request:
      type: object
      required:
      - resource
      properties:
        resource:
          type: string
          examples:
          - https://github.com/microsoft/vscode/pull/1
    response:
      type: object
      properties:
        opened:
          type: boolean
        via:
          type: string
  - component: workbench-language-service
    name: request-rich-language-features
    kind: function
    summary: 'LanguageService.requestRichLanguageFeatures (a text model got this language): first request only; ensures basic features, fires onDidRequestRichLanguageFeatures, whose WorkbenchLanguageService
      listener activates onLanguage:<id> and then onLanguage (neither awaited in the code).'
    sources:
    - src/vs/editor/common/services/languageService.ts:140-152
    - src/vs/workbench/services/language/common/languageService.ts:287-291
    request:
      type: object
      required:
      - language_id
      properties:
        language_id:
          type: string
          examples:
          - typescript
    response:
      type: object
      properties:
        requested:
          type: boolean
    behavior:
    - if: input.language_id in state.requested_rich
      then:
      - title: Already requested for this language, nothing fires again
        source: src/vs/editor/common/services/languageService.ts:141
        return:
          requested: false
    - set:
        state.requested_rich: = state.requested_rich + [input.language_id]
    - call: workbench-language-service.request-basic-language-features
      input:
        language_id: = input.language_id
    - title: onDidRequestRichLanguageFeatures listener activates onLanguage:<id>
      source: src/vs/workbench/services/language/common/languageService.ts:287-289
      call: extension-service.activate-by-event
      input:
        activation_event: = 'onLanguage:' + input.language_id
        activation_kind: normal
      on_error: continue
    - title: and the bare onLanguage event
      source: src/vs/workbench/services/language/common/languageService.ts:290
      call: extension-service.activate-by-event
      input:
        activation_event: onLanguage
        activation_kind: normal
      on_error: continue
    - return:
        requested: true
  - component: workbench-language-service
    name: request-basic-language-features
    kind: function
    summary: 'LanguageService.requestBasicLanguageFeatures: records the language once and fires onDidRequestBasicLanguageFeatures (language configuration is loaded by its listener).'
    sources:
    - src/vs/editor/common/services/languageService.ts:133-138
    request:
      type: object
      required:
      - language_id
      properties:
        language_id:
          type: string
          examples:
          - typescript
    behavior:
    - if: input.language_id in state.requested_basic
      then:
      - return:
          requested: false
    - set:
        state.requested_basic: = state.requested_basic + [input.language_id]
    - return:
        requested: true
  - component: extension-service
    name: activate-by-event
    kind: function
    summary: IExtensionService.activateByEvent, owned by exthost (boundary).
    sources:
    - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:993-1025
    attributes:
      boundary: true
      owner: exthost
    request: ExthostActivateByEventRequest
    response: ExthostActivationResult
    errors:
    - code: canceled
      status: 0
      retryable: false
  - component: extension-service
    name: get-extension
    kind: function
    summary: IExtensionService.getExtension, owned by exthost (boundary).
    sources:
    - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1082-1086
    attributes:
      boundary: true
      owner: exthost
    request:
      type: object
      required:
      - extension_id
      properties:
        extension_id:
          type: string
          examples:
          - vscode.typescript-language-features
    response:
      type: object
      properties:
        found:
          type: boolean
        extension:
          $ref: ExthostExtensionDescription
        activated:
          type: boolean
flows:
  - id: workbench-shell-command-palette-list
    name: Type in the command palette and list the matching commands
    entry:
      caller: user
      interface: commands-quick-access.get-picks
      input:
        filter: ''
    sources:
    - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:77-200
    tags:
    - feature:commands-and-keybindings
  - id: workbench-shell-command-palette-run
    name: Accept a command palette pick and run it
    entry:
      caller: user
      interface: commands-quick-access.accept
      input:
        command_id: workbench.action.closeActiveEditor
        label: 'View: Close Editor'
    sources:
    - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:303-324
    tags:
    - writes
    - feature:commands-and-keybindings
  - id: workbench-shell-resolve-variables
    name: Resolve ${...} variables in a launch or task configuration string
    entry:
      caller: user
      interface: configuration-resolver-service.resolve-async
      input:
        folder_uri: file:///work/app
        value: abc ${workspaceFolder} xyz
    sources:
    - src/vs/workbench/services/configurationResolver/common/variableResolver.ts:83-94
  - id: workbench-shell-account-policy
    name: The default account's policy data changes and the account policy values are recomputed
    entry:
      caller: user
      interface: account-policy-service.on-did-change-policy-data
      input:
        signed_in: true
    sources:
    - src/vs/workbench/services/policies/common/accountPolicyService.ts:127-135
    tags:
    - writes
  - id: workbench-shell-banner-show
    name: Show a banner item (e.g. the restricted-mode banner) in the banner part
    entry:
      caller: user
      interface: banner-part.show
      input:
        id: workbench.banner.restrictedMode
        message: Restricted Mode is intended for safe code browsing. Trust this folder to enable all features.
    sources:
    - src/vs/workbench/browser/parts/banner/bannerPart.ts:175-179
    tags:
    - writes
    - feature:workspace-trust
  - id: workbench-shell-request-language-features
    name: A text model's language requests rich language features, activating onLanguage
    entry:
      caller: user
      interface: workbench-language-service.request-rich-language-features
      input:
        language_id: typescript
    sources:
    - src/vs/workbench/services/language/common/languageService.ts:287-291
    tags:
    - writes
scenarios:
  - id: workbench-shell-palette-list-default
    flow: workbench-shell-command-palette-list
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    expect:
    - result.ok && size(result.value.picks) == 6
    - '!result.value.picks.exists(p, p.command_id == ''workbench.action.closeEditorsAndGroup'')'
    - result.value.picks.exists(p, p.command_id == 'workbench.action.keepEditor')
    - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.get-context-key-value' && e.input.key == 'config.workbench.editor.enablePreview')
  - id: workbench-shell-palette-list-multiple-groups
    flow: workbench-shell-command-palette-list
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    state:
      context-key-service@w1:
        values:
          multipleEditorGroups: true
          activeEditorLastInGroup: true
    expect:
    - result.value.picks.exists(p, p.command_id == 'workbench.action.closeEditorsAndGroup')
    - '!result.value.picks.exists(p, p.command_id == ''workbench.action.closeEditorsToTheRight'')'
    - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.get-context-key-value' && e.input.key == 'multipleEditorGroups')
  - id: workbench-shell-palette-list-preview-off
    flow: workbench-shell-command-palette-list
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    config:
      workbench-editor-enable-preview: false
    expect:
    - '!result.value.picks.exists(p, p.command_id == ''workbench.action.keepEditor'')'
    - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.get-context-key-value' && e.input.key == 'multipleEditorGroups')
  - id: workbench-shell-palette-list-filter
    flow: workbench-shell-command-palette-list
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      filter: pin
    expect:
    - result.value.picks.map(p, p.command_id) == ['workbench.action.pinEditor', 'workbench.action.unpinEditor']
    - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.get-context-key-value' && e.input.key == 'multipleEditorGroups')
  - id: workbench-shell-palette-list-command-id
    flow: workbench-shell-command-palette-list
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      filter: workbench.action.closeActiveEditor
    expect:
    - result.value.picks.map(p, p.command_id) == ['workbench.action.closeActiveEditor']
    - trace.exists(e, e.type == 'call.start' && e.interface == 'context-key-service.get-context-key-value' && e.input.key == 'multipleEditorGroups')
  - id: workbench-shell-palette-run-then-list
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    steps:
    - flow: workbench-shell-command-palette-run
      input:
        command_id: workbench.action.pinEditor
        label: 'View: Pin Editor'
      as: run1
    - flow: workbench-shell-command-palette-run
      as: run2
    - flow: workbench-shell-command-palette-list
      as: list
    expect:
    - steps.run1.result.value.executed && steps.run2.result.value.executed
    - trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == 'workbench.action.closeActiveEditor')
    - state['commands-quick-access@w1'].history['workbench.action.closeActiveEditor'] == 2
    - steps.list.result.value.picks[0].command_id == 'workbench.action.closeActiveEditor' && steps.list.result.value.picks[1].command_id == 'workbench.action.pinEditor'
    - steps.list.result.value.picks[0].recently_used && !steps.list.result.value.picks[2].recently_used
  - id: workbench-shell-palette-run-fails
    flow: workbench-shell-command-palette-run
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      command_id: workbench.action.doesNotExist
      label: Does Not Exist
    expect:
    - result.ok && !result.value.executed
    - trace.exists(e, e.type == 'call.start' && e.interface == 'dialog-service.error' && e.input.message == "Command 'Does Not Exist' resulted in an error")
    - state['commands-quick-access@w1'].history['workbench.action.doesNotExist'] == 1
  - id: workbench-shell-resolve-workspace-folder
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    expect:
    - result.ok && result.value.value == 'abc /work/app xyz'
  - id: workbench-shell-resolve-mixed
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      folder_uri: file:///work/app
      value: ${workspaceFolderBasename}|${env:HOME}|${env:NOPE}|${userHome}|${command:pickProcess}|${unknownVar}|${config:files.autoSave}
    expect:
    - result.value.value == 'app|/home/dev||/home/dev|${command:pickProcess}|${unknownVar}|off'
    - trace.exists(e, e.type == 'call.start' && e.interface == 'configuration-service.get-value' && e.input.key == 'files.autoSave')
  - id: workbench-shell-resolve-named-folder
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      value: ${workspaceFolder:app}/out
    expect:
    - result.value.value == '/work/app/out'
  - id: workbench-shell-resolve-no-folder
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      folder_uri: ''
      value: ${workspaceFolder}
    expect:
    - '!result.ok && result.error.code == ''variable-error'' && result.error.message.contains(''Please open a folder'')'
  - id: workbench-shell-resolve-unknown-folder
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      value: ${workspaceFolder:lib}
    expect:
    - '!result.ok && result.error.message.contains(''No such folder'')'
  - id: workbench-shell-resolve-missing-setting
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      value: ${config:no.such.setting}
    expect:
    - '!result.ok && result.error.message.contains(''not found'')'
  - id: workbench-shell-resolve-env-no-name
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      value: ${env}
    expect:
    - '!result.ok && result.error.message.contains(''no environment variable name'')'
  - id: workbench-shell-resolve-file-no-editor
    flow: workbench-shell-resolve-variables
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    input:
      value: ${file}
    state:
      editor-groups@w1:
        active_group: 1
        groups:
        - id: 1
          active: null
          editors: []
          preview: null
          sticky: []
          mru: []
          locked: false
    expect:
    - '!result.ok && result.error.message.contains(''Please open an editor'')'
  - id: workbench-shell-resolve-file-active-editor
    flow: workbench-shell-resolve-variables
    fixtures:
    - dirty-editor
    - workbench-shell-seed
    input:
      folder_uri: file:///work/app
      value: ${file} ${fileBasename} ${relativeFile}${pathSeparator}
    expect:
    - result.value.value == '/work/app/src/main.ts main.ts src/main.ts/'
  - id: workbench-shell-account-policy-agent-disabled
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    steps:
    - flow: workbench-shell-account-policy
      input:
        policy_data:
          chat_agent_enabled: false
      as: upd
    - interface: account-policy-service.get-policy-value
      caller: user
      input:
        name: ChatAgentMode
      as: read
    - interface: account-policy-service.get-policy-value
      caller: user
      input:
        name: ChatHooks
      as: hooks
    expect:
    - steps.upd.result.value.updated == ['ChatAgentMode']
    - steps.read.result.value.value == false && steps.read.result.value.source == 'account'
    - steps.hooks.result.value.value == null
    - state['account-policy-service@w1'].last_changed == ['ChatAgentMode']
    - trace.exists(e, e.type == 'call.start' && e.interface == 'configuration-service.on-did-change-policies' && e.input.names == ['ChatAgentMode'])
  - id: workbench-shell-account-policy-default-account-no-data
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    steps:
    - flow: workbench-shell-account-policy
      input:
        policy_data: {}
      as: upd
    - interface: account-policy-service.get-policy-value
      caller: user
      input:
        name: ChatAgentMode
      as: read
    expect:
    - steps.upd.result.value.updated == [] && steps.read.result.value.value == null
    - state['account-policy-service@w1'].policies == {}
  - id: workbench-shell-account-policy-sign-out-clears
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    steps:
    - flow: workbench-shell-account-policy
      input:
        policy_data:
          chat_preview_features_enabled: false
          mcpRegistryUrl: https://registry.example.com
      as: signin
    - flow: workbench-shell-account-policy
      input:
        signed_in: false
      as: out
    - interface: account-policy-service.get-policy-value
      caller: user
      input:
        name: McpGalleryServiceUrl
      as: read
    expect:
    - size(steps.signin.result.value.updated) == 2 && size(steps.out.result.value.updated) == 2
    - steps.read.result.value.value == null && state['account-policy-service@w1'].policies == {}
  - id: workbench-shell-close-editor-auto-save-window-change
    flow: workbench-shell-close-editor
    fixtures:
    - dirty-editor
    - workbench-shell-seed
    config:
      files-auto-save: onWindowChange
    expect:
    - trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.save' && e.input.options.reason == 'window-change')
    - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''file-dialog-service.show-save-confirm'')'
  - id: workbench-shell-close-editor-window-change-macos-asks
    flow: workbench-shell-close-editor
    fixtures:
    - dirty-editor
    - workbench-shell-seed
    config:
      files-auto-save: onWindowChange
    state:
      editor-group-view@w1:
        host_os: macos
    choices:
      file-dialog-service.show-save-confirm.confirm: cancel
    expect:
    - trace.exists(e, e.type == 'call.start' && e.interface == 'file-dialog-service.show-save-confirm')
    - size(state['editor-groups@w1'].groups[0].editors) >= 1
  - id: workbench-shell-open-running-extensions-modal
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    steps:
    - flow: workbench-shell-open-editor
      input:
        resource: runtime-extensions:/default
        options:
          pinned: true
      as: open
    - interface: modal-editor-part.get-group
      caller: user
      as: read
    expect:
    - steps.open.result.value.group_id == -4 && steps.open.result.value.is_new
    - steps.read.result.value.open && steps.read.result.value.group.editors == ['runtime-extensions:/default']
    - '!state[''editor-groups@w1''].groups.exists(g, ''runtime-extensions:/default'' in g.editors)'
    - trace.exists(e, e.type == 'call.start' && e.interface == 'modal-editor-part.create')
  - id: workbench-shell-open-modal-reused
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    state:
      modal-editor-part@w1:
        open: true
        group:
          id: -4
          editors:
          - vscode-workspace-trust:workspaceTrustEditor
          active: vscode-workspace-trust:workspaceTrustEditor
          preview: null
          sticky: []
          mru:
          - vscode-workspace-trust:workspaceTrustEditor
          locked: false
    steps:
    - flow: workbench-shell-open-editor
      input:
        resource: runtime-extensions:/default
      as: open
    expect:
    - size(state['modal-editor-part@w1'].group.editors) == 2 && state['modal-editor-part@w1'].group.active == 'runtime-extensions:/default'
    - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''modal-editor-part.create'')'
  - id: workbench-shell-open-modal-off
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    config:
      workbench-editor-use-modal: 'off'
    steps:
    - flow: workbench-shell-open-editor
      input:
        resource: runtime-extensions:/default
      as: open
    expect:
    - steps.open.result.value.group_id == 1 && !state['modal-editor-part@w1'].open
    - state['editor-groups@w1'].groups[0].active == 'runtime-extensions:/default'
  - id: workbench-shell-open-file-closes-modal
    fixtures:
    - one-window-folder
    - workbench-shell-seed
    state:
      modal-editor-part@w1:
        open: true
        group:
          id: -4
          editors:
          - runtime-extensions:/default
          active: runtime-extensions:/default
          preview: null
