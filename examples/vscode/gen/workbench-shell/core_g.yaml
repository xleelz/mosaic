interfaces:
  - component: editor-service
    name: close-editor
    kind: function
    summary: "IEditorService.closeEditor: close the editor showing the resource in every group that has it (each group runs its close confirmation)."
    sources: ["src/vs/workbench/services/editor/browser/editorService.ts:792-797"]
    request: {type: object, properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {closed: {type: boolean}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - foreach: "= vars.st.value.groups.filter(g, input.resource in g.editors)"
        as: g
        steps:
          - call: editor-group-view.close-editor
            input: {group_id: "= vars.g.id", resource: "= input.resource"}
      - return: {closed: true}
  - component: editor-service
    name: save
    kind: function
    summary: "IEditorService.save: a normal save pins the editor on an explicit save and saves it through the text file service with the full save options; Save As runs sequentially: open the editor pinned, save it under a new resource (the target picker), then replace the editor with the saved one in its group. success only when the save produced a result."
    sources:
      - "src/vs/workbench/services/editor/browser/editorService.ts:968-1048"
    request: {type: object, properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, reason: {type: string, default: explicit}, save_as: {type: boolean, default: false}, force: {type: boolean, default: false}, skip_save_participants: {type: boolean, default: false}}}
    response: {type: object, properties: {success: {type: boolean}, resource: {type: string}}}
    behavior:
      - set:
          vars.opts: "= {'reason': input.reason, 'force': input.force, 'skip_save_participants': input.skip_save_participants}"
      - call: editor-groups.get-state
        as: st
      - set:
          vars.in_groups: "= vars.st.value.groups.filter(g, input.resource in g.editors).map(g, g.id)"
      - if: "input.save_as"
        then:
          - title: Save As is sequential; open the editor pinned first so the user can review it
            source: "src/vs/workbench/services/editor/browser/editorService.ts:1013-1022"
            call: editor-service.open-editor
            input: {resource: "= input.resource", options: {pinned: true}}
            as: opened
          - title: Save under a new resource (the save dialog picks the target)
            source: "src/vs/workbench/services/editor/browser/editorService.ts:1024"
            call: text-file-service.save-as
            input: {source: "= input.resource", target: null, options: "= vars.opts"}
            as: sa
            on_error: continue
          - if: "!vars.sa.ok || !has(vars.sa.value.resource) || vars.sa.value.resource == '' || (has(vars.sa.value.saved) && !vars.sa.value.saved)"
            then:
              - title: Failed or canceled, abort
                source: "src/vs/workbench/services/editor/browser/editorService.ts:1027-1029"
                return: {success: false}
          - if: "vars.sa.value.resource != input.resource"
            then:
              - title: Replace the editor with the saved one, preserving its place
                source: "src/vs/workbench/services/editor/browser/editorService.ts:1031-1043"
                call: editor-group-view.replace-editor
                input: {group_id: "= vars.opened.value.group_id", editor: "= input.resource", replacement: "= vars.sa.value.resource"}
          - return: {success: true, resource: "= vars.sa.value.resource"}
      - if: "input.reason == 'explicit'"
        then:
          - title: Use save as a hint to pin the editor
            source: "src/vs/workbench/services/editor/browser/editorService.ts:1002-1005"
            foreach: "= vars.in_groups"
            as: gid
            steps:
              - call: editor-group-view.set-editor-state
                input: {group_id: "= vars.gid", resource: "= input.resource", op: pin}
      - title: Save with the given options (reason, force, skip save participants)
        source: "src/vs/workbench/services/editor/browser/editorService.ts:1007-1008"
        call: text-file-service.save
        input: {resource: "= input.resource", options: "= vars.opts"}
        as: s
        on_error: continue
      - return: {success: "= vars.s.ok && !(has(vars.s.value.saved) && !vars.s.value.saved)", resource: "= input.resource"}
  - component: editor-group-view
    name: replace-editor
    kind: function
    summary: "EditorGroupView.replaceEditors: the replacement takes the replaced editor's index, pinned and active state."
    sources: ["src/vs/workbench/browser/parts/editor/editorGroupView.ts:2046-2100"]
    request: {type: object, required: [group_id, editor, replacement], properties: {group_id: {type: integer}, editor: {type: string}, replacement: {type: string}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == input.group_id)[0]"
      - call: editor-groups.put-group
        input:
          group: "= {'id': vars.g.id, 'editors': vars.g.editors.filter(e, e != input.replacement).map(e, e == input.editor ? input.replacement : e), 'active': vars.g.active == input.editor ? input.replacement : vars.g.active, 'preview': vars.g.preview == input.editor ? null : vars.g.preview, 'sticky': vars.g.sticky.map(e, e == input.editor ? input.replacement : e), 'mru': vars.g.mru.filter(e, e != input.replacement).map(e, e == input.editor ? input.replacement : e), 'locked': vars.g.locked}"
      - return: {replaced: true}
  - component: text-file-service
    name: save-as
    kind: function
    summary: "ITextFileService.saveAs (files-search-scm)."
    sources: ["src/vs/workbench/services/textfile/browser/textFileService.ts"]
    attributes: {boundary: true, owner: files-search-scm}
    request: {type: object, required: [source], properties: {source: {type: string, examples: ["file:///work/app/src/main.ts"]}, target: {type: [string, "null"], default: null}, options: {type: object, properties: {reason: {type: string}, force: {type: boolean}, skip_save_participants: {type: boolean}}}}}
    response: {type: object, properties: {saved: {type: boolean, examples: [true]}, resource: {type: string, examples: ["file:///work/app/src/copy.ts"]}, skipped: {type: string}, error_code: {type: string}}}
  - component: editor-service
    name: save-all
    kind: function
    summary: "IEditorService.saveAll: save every modified editor (getAllModifiedEditors) of the window."
    sources: ["src/vs/workbench/services/editor/browser/editorService.ts:1052-1054"]
    request: {type: object, properties: {reason: {type: string, default: explicit}}}
    response: {type: object, properties: {saved: {type: boolean}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.all: "= vars.st.value.groups.map(g, g.editors).flatten()"
          vars.ok: true
      - foreach: "= vars.all"
        as: r
        steps:
          - call: text-file-models.get
            input: {resource: "= vars.r"}
            as: m
            on_error: continue
          - if: "vars.m.ok && ((has(vars.m.value.model) && has(vars.m.value.model.dirty) && vars.m.value.model.dirty) || (has(vars.m.value.dirty) && vars.m.value.dirty))"
            then:
              - call: editor-service.save
                input: {resource: "= vars.r", reason: "= input.reason", save_as: false, force: false, skip_save_participants: false}
                as: s
              - set: {vars.ok: "= vars.ok && vars.s.value.success"}
      - return: {saved: "= vars.ok"}
  - component: dialog-service
    name: confirm
    kind: function
    summary: "IDialogService.confirm: a modal yes/no dialog with an optional checkbox; the user's answer is a choice."
    sources: ["src/vs/workbench/services/dialogs/common/dialogService.ts:39-52"]
    request: {type: object, properties: {message: {type: string}, checkbox: {type: string}, primary_button: {type: string}}}
    response: {type: object, properties: {confirmed: {type: boolean}, checkbox_checked: {type: boolean}}}
    behavior:
      - choice: answer
        default: confirm
        options:
          confirm:
            - return: {confirmed: true, checkbox_checked: false}
          cancel:
            - return: {confirmed: false, checkbox_checked: false}
  - component: dialog-service
    name: prompt
    kind: function
    summary: "IDialogService.prompt: a modal dialog with buttons and a cancel button; returns the chosen button (index 0 by default, or cancel)."
    sources: ["src/vs/workbench/services/dialogs/common/dialogService.ts:54-70"]
    request: {type: object, properties: {type: {type: string}, message: {type: string}, buttons: {type: array}, cancel_button: {type: string}}}
    response: {type: object, properties: {result: {}, button: {type: integer}, canceled: {type: boolean}}}
    behavior:
      - choice: answer
        default: first
        options:
          first:
            - return: {button: 0, canceled: false, result: "= has(input.buttons) && size(input.buttons) > 0 ? input.buttons[0] : null"}
          cancel:
            - return: {button: -1, canceled: true, result: null}
  - component: notification-service
    name: prompt
    kind: function
    summary: "INotificationService.prompt: a notification with choices; added to the model like notify, the picked choice is returned (none when dismissed)."
    sources: ["src/vs/workbench/services/notification/common/notificationService.ts:258-330"]
    request: {type: object, properties: {severity: {type: string, default: info}, message: {type: string, examples: ["Reload to apply the change?"]}, choices: {type: array, items: {type: string}, default: []}}}
    response: {type: object, properties: {choice: {type: [string, "null"]}}}
    behavior:
      - call: notification-service.notify
        input: {severity: "= input.severity", message: "= input.message"}
      - choice: pick
        default: first
        options:
          first:
            - return: {choice: "= size(input.choices) > 0 ? input.choices[0] : null"}
          dismiss:
            - return: {choice: null}
scenarios:
  - id: workbench-shell-editor-service-save-and-close
    fixtures: [dirty-editor]
    steps:
      - {interface: editor-service.save-all, caller: user, as: sa, input: {reason: explicit}}
      - {interface: editor-service.save, caller: user, as: s, input: {resource: "file:///work/app/src/main.ts", reason: auto}}
      - {interface: editor-service.close-editor, caller: user, as: c, input: {resource: "file:///work/app/src/main.ts"}}
    expect:
      - "calls['text-file-service.save'] >= 2 && trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.save' && e.input.options.reason == 'auto')"
      - "state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-editor-service-save-as
    fixtures: [dirty-editor]
    steps:
      - {interface: editor-service.save, caller: user, as: s, input: {resource: "file:///work/app/src/main.ts", reason: explicit, save_as: true, force: false, skip_save_participants: false}}
      - {flow: workbench-shell-is-opened, as: r, input: {resource: "file:///work/app/src/main.ts"}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.save-as' && e.input.source == 'file:///work/app/src/main.ts')"
      - "!steps.s.result.value.success || (!steps.r.result.value.opened && steps.s.result.value.resource in state['editor-groups@w1'].groups[0].editors)"
  - id: workbench-shell-editor-service-save-as-canceled
    fixtures: [dirty-editor]
    faults: [{target: text-file-service.save-as, type: error, code: canceled}]
    steps:
      - {interface: editor-service.save, caller: user, as: s, input: {resource: "file:///work/app/src/main.ts", reason: explicit, save_as: true, force: false, skip_save_participants: false}}
    expect:
      - "!steps.s.result.value.success && state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts']"
  - id: workbench-shell-editor-service-save-without-participants
    fixtures: [dirty-editor]
    steps:
      - {interface: editor-service.save, caller: user, as: s, input: {resource: "file:///work/app/src/main.ts", reason: explicit, save_as: false, force: false, skip_save_participants: true}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.save' && e.input.options.skip_save_participants == true && e.input.options.reason == 'explicit') && size(state['editor-groups@w1'].groups) == 1"
  - id: workbench-shell-dialogs-and-prompts
    fixtures: [one-window-folder]
    choices: {dialog-service.prompt.answer: cancel}
    steps:
      - {interface: dialog-service.confirm, caller: user, as: c, input: {message: "Clear history?"}}
      - {interface: dialog-service.prompt, caller: user, as: p, input: {message: "Save?", buttons: [Save]}}
      - {interface: notification-service.prompt, caller: user, as: n, input: {message: "Reload?", choices: [Reload]}}
    expect:
      - "steps.c.result.value.confirmed && steps.p.result.value.canceled && steps.n.result.value.choice == 'Reload'"
      - "state['notification-service@w1'].notifications[0].message == 'Reload?'"
  - id: workbench-shell-dialogs-cancel
    fixtures: [one-window-folder]
    choices: {dialog-service.confirm.answer: cancel, notification-service.prompt.pick: dismiss}
    steps:
      - {interface: dialog-service.confirm, caller: user, as: c, input: {message: "Clear history?"}}
      - {interface: dialog-service.prompt, caller: user, as: p, input: {message: "Save?", buttons: [Save]}}
      - {interface: notification-service.prompt, caller: user, as: n, input: {message: "Reload?", choices: [Reload]}}
    expect:
      - "!steps.c.result.value.confirmed && steps.p.result.value.button == 0 && steps.n.result.value.choice == null"
      - "size(state['notification-service@w1'].notifications) == 1"
