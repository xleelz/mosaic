flows:
  - id: workbench-shell-open-editor
    name: Open an editor
    entry:
      caller: user
      interface: editor-service.open-editor
      input:
        resource: file:///work/app/src/main.ts
    sources:
    - src/vs/workbench/services/editor/browser/editorService.ts:540-599
    tags:
    - feature:editor-management
    - writes
  - id: workbench-shell-is-opened
    name: Is an editor opened (read)
    entry:
      caller: user
      interface: editor-service.is-opened
      input:
        resource: file:///work/app/src/main.ts
    sources:
    - src/vs/workbench/services/editor/browser/editorService.ts:770-788
    tags:
    - feature:editor-management
  - id: workbench-shell-get-groups
    name: Read the editor groups
    entry: {caller: user, interface: editor-groups.get-state}
    sources: ["src/vs/workbench/services/editor/common/editorGroupsService.ts:21"]
  - id: workbench-shell-close-editor
    name: Close the active editor (Ctrl+W command)
    entry:
      caller: user
      interface: editor-commands.cmd-workbench-action-closeactiveeditor
    sources:
    - src/vs/workbench/browser/parts/editor/editorCommands.ts:835-843
    tags:
    - feature:editor-management
    - writes
  - id: workbench-shell-keybinding-dispatch
    name: Press a key, resolve the keybinding and run its command
    entry:
      caller: user
      interface: keybinding-service.dispatch
      input:
        keypress: ctrl+w
    sources:
    - src/vs/workbench/services/keybinding/browser/keybindingService.ts:278-292
    tags:
    - writes
    - feature:commands-and-keybindings
  - id: workbench-shell-shutdown
    name: Window close asks onBeforeShutdown for vetos
    entry: {caller: main-process, interface: lifecycle-service.on-before-shutdown, input: {reason: close}}
    sources: ["src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:36-61"]
    tags: [writes]
  - id: workbench-shell-will-shutdown
    name: Window will unload
    entry: {caller: main-process, interface: lifecycle-service.on-will-shutdown, input: {reason: close}}
    sources: ["src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:63-76"]
    tags: [writes]
  - id: workbench-shell-trust-request
    name: Request workspace trust (modal)
    entry:
      caller: user
      interface: workspace-trust-request-service.request-workspace-trust
    sources:
    - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:885-904
    tags:
    - feature:workspace-trust
    - writes
  - id: workbench-shell-trust-query
    name: Is the workspace trusted (read)
    entry:
      caller: user
      interface: workspace-trust-management-service.is-workspace-trusted
    sources:
    - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:517-519
    tags:
    - feature:workspace-trust
  - id: workbench-shell-set-trust
    name: Trust or untrust the workspace (Workspace Trust editor)
    entry:
      caller: user
      interface: workspace-trust-management-service.set-workspace-trust
      input:
        trusted: false
    sources:
    - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:616-625
    tags:
    - feature:workspace-trust
    - writes
  - id: workbench-shell-open-files-trust
    name: Open files from outside a trusted workspace
    entry:
      caller: user
      interface: workspace-trust-request-service.request-open-files-trust
      input:
        uris:
        - file:///tmp/notes.txt
    sources:
    - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:766-808
    tags:
    - feature:workspace-trust
    - writes
  - id: workbench-shell-add-folder
    name: Add Folder to Workspace
    entry: {caller: user, interface: workspace-actions.cmd-workbench-action-addrootfolder}
    sources: ["src/vs/workbench/browser/actions/workspaceActions.ts:213-232"]
    tags: [writes]
  - id: workbench-shell-get-workspace
    name: Read the workspace (folders, state, trust)
    entry: {caller: user, interface: workspace-context.get-workspace}
    sources: ["src/vs/platform/workspace/common/workspace.ts:16"]
  - id: workbench-shell-notify
    name: Show a notification
    entry: {caller: user, interface: notification-service.notify, input: {severity: info, message: "Extension host terminated unexpectedly."}}
    sources: ["src/vs/workbench/services/notification/common/notificationService.ts:193-230"]
    tags: [writes]
  - id: workbench-shell-get-notifications
    name: Read the notification center
    entry: {caller: user, interface: notification-service.get-notifications}
    sources: ["src/vs/workbench/common/notifications.ts:181-225"]
  - id: workbench-shell-reopen-closed-editor
    name: Reopen Closed Editor
    entry:
      caller: user
      interface: editor-actions.cmd-workbench-action-reopenclosededitor
    sources:
    - src/vs/workbench/browser/parts/editor/editorActions.ts:1691-1713
    tags:
    - feature:editor-management
    - writes
  - id: workbench-shell-get-history
    name: Read the editor history
    entry: {caller: user, interface: history-service.get-history}
    sources: ["src/vs/workbench/services/history/browser/historyService.ts:1042-1046"]
  - id: workbench-shell-startup
    name: Workbench startup
    entry: {caller: main-process, interface: workbench.startup}
    sources: ["src/vs/workbench/browser/workbench.ts:111-170"]
    tags: [writes]
  - id: workbench-shell-language-detection-worker
    name: Language detection worker starts
    entry: {caller: workbench-window, interface: language-detection-web-worker.bootstrap}
    sources: ["src/vs/workbench/services/languageDetection/browser/languageDetectionWebWorkerMain.ts:9"]
  - id: workbench-shell-textmate-worker
    name: TextMate tokenization worker starts
    entry: {caller: workbench-window, interface: text-mate-tokenization-worker.bootstrap}
    sources: ["src/vs/workbench/services/textMate/browser/backgroundTokenization/worker/textMateTokenizationWorker.workerMain.ts:9"]

x-seeds:
  g3: &g3 {groups: [{id: 1, editors: ["file:///work/app/src/main.ts", "file:///work/app/src/util.ts", "file:///work/app/README.md"], active: "file:///work/app/src/util.ts", preview: null, sticky: [], mru: ["file:///work/app/src/util.ts", "file:///work/app/src/main.ts", "file:///work/app/README.md"], locked: false}], active_group: 1}
  g2: &g2 {groups: [{id: 1, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts", preview: null, sticky: [], mru: ["file:///work/app/src/main.ts"], locked: false}, {id: 2, editors: ["file:///work/app/src/util.ts"], active: "file:///work/app/src/util.ts", preview: null, sticky: [], mru: ["file:///work/app/src/util.ts"], locked: false}], active_group: 2, group_mru: [2, 1], next_group_id: 3}
  prev: &prev {groups: [{id: 1, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts", preview: "file:///work/app/src/main.ts", sticky: [], mru: ["file:///work/app/src/main.ts"], locked: false}], active_group: 1}
scenarios:
  # ---------------- open editor ----------------
  - id: workbench-shell-open-editor-preview
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    expect:
      - "result.ok && result.value.opened && !result.value.pinned && result.value.is_new && result.value.group_id == 1"
      - "state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts'] && state['editor-groups@w1'].groups[0].preview == 'file:///work/app/src/main.ts'"
  - id: workbench-shell-open-editor-replaces-preview
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *prev}
    input: {resource: "file:///work/app/src/util.ts"}
    expect:
      - "state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/util.ts']"
      - "state['editor-groups@w1'].groups[0].preview == 'file:///work/app/src/util.ts' && state['editor-groups@w1'].groups[0].active == 'file:///work/app/src/util.ts'"
  - id: workbench-shell-open-editor-preview-disabled
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    config: {workbench-editor-enable-preview: false}
    state: {"editor-groups@w1": *prev}
    input: {resource: "file:///work/app/src/util.ts"}
    expect:
      - "result.value.pinned"
      - "state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts', 'file:///work/app/src/util.ts'] && state['editor-groups@w1'].groups[0].preview == 'file:///work/app/src/main.ts'"
  - id: workbench-shell-open-editor-pinned-after-active
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *g3}
    input: {resource: "file:///work/app/package.json", options: {pinned: true}}
    expect:
      - "state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts', 'file:///work/app/src/util.ts', 'file:///work/app/package.json', 'file:///work/app/README.md']"
      - "state['editor-groups@w1'].groups[0].mru[0] == 'file:///work/app/package.json'"
  - id: workbench-shell-open-editor-position-first
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    config: {workbench-editor-open-positioning: first}
    state: {"editor-groups@w1": *g3}
    input: {resource: "file:///work/app/package.json", options: {pinned: true}}
    expect:
      - "state['editor-groups@w1'].groups[0].editors[0] == 'file:///work/app/package.json'"
  - id: workbench-shell-open-editor-position-left-inactive
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    config: {workbench-editor-open-positioning: left}
    state: {"editor-groups@w1": *g3}
    input: {resource: "file:///work/app/package.json", options: {pinned: true, inactive: true, preserve_focus: true}}
    expect:
      - "state['editor-groups@w1'].groups[0].editors[1] == 'file:///work/app/package.json' && state['editor-groups@w1'].groups[0].active == 'file:///work/app/src/util.ts'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'editor-groups.set-active-group')"
  - id: workbench-shell-open-editor-dirty-pins
    flow: workbench-shell-open-editor
    fixtures: [dirty-editor]
    state: {"editor-groups@w1": {groups: [{id: 1, editors: [], active: null}], active_group: 1}}
    expect:
      - "result.value.pinned"
      - "state['editor-groups@w1'].groups[0].preview == null && state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts']"
  - id: workbench-shell-open-editor-existing-pin
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *prev}
    input: {options: {pinned: true}}
    expect:
      - "!result.value.is_new && state['editor-groups@w1'].groups[0].preview == null"
  - id: workbench-shell-open-editor-side-group
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *prev}
    input: {resource: "file:///work/app/src/util.ts", group: -2}
    expect:
      - "result.value.group_id == 2 && size(state['editor-groups@w1'].groups) == 2"
      - "state['editor-groups@w1'].active_group == 2 && state['editor-groups@w1'].groups[1].editors == ['file:///work/app/src/util.ts']"
  - id: workbench-shell-open-editor-side-existing
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": {groups: [{id: 1, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts"}, {id: 2, editors: [], active: null}], active_group: 1}}
    input: {resource: "file:///work/app/src/util.ts", group: -2}
    expect:
      - "result.value.group_id == 2 && size(state['editor-groups@w1'].groups) == 2"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'editor-part.add-group')"
  - id: workbench-shell-open-editor-locked-group
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": {groups: [{id: 1, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts", locked: true}], active_group: 1}}
    input: {resource: "file:///work/app/src/util.ts"}
    expect:
      - "result.value.group_id == 2 && state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'editor-part.add-group')"
  - id: workbench-shell-open-editor-locked-other-unlocked
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": {groups: [{id: 1, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts"}, {id: 2, editors: ["file:///work/app/README.md"], active: "file:///work/app/README.md", locked: true}], active_group: 2, group_mru: [2, 1]}}
    input: {resource: "file:///work/app/src/util.ts"}
    expect:
      - "result.value.group_id == 1 && 'file:///work/app/src/util.ts' in state['editor-groups@w1'].groups[0].editors"
  - id: workbench-shell-open-editor-reveal-if-open
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    config: {workbench-editor-reveal-if-open: true}
    state: {"editor-groups@w1": *g2}
    input: {resource: "file:///work/app/src/main.ts"}
    expect:
      - "result.value.group_id == 1 && state['editor-groups@w1'].active_group == 1"
      - "state['editor-groups@w1'].groups[1].editors == ['file:///work/app/src/util.ts']"
  - id: workbench-shell-open-editor-explicit-group
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *g2}
    input: {resource: "file:///work/app/README.md", group: 1}
    expect:
      - "result.value.group_id == 1 && 'file:///work/app/README.md' in state['editor-groups@w1'].groups[0].editors"
  - id: workbench-shell-open-editor-invalid-group
    flow: workbench-shell-open-editor
    fixtures: [one-window-folder]
    input: {group: 7}
    expect:
      - "!result.ok && result.error.code == 'invalid-editor-group-provided'"
      - "state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-open-editor-then-read
    fixtures: [one-window-folder]
    steps:
      - {flow: workbench-shell-open-editor, as: open}
      - {flow: workbench-shell-is-opened, as: read}
      - {flow: workbench-shell-get-groups, as: groups}
    expect:
      - "steps.open.result.ok && steps.read.result.value.opened && steps.read.result.value.active && steps.read.result.value.groups == [1]"
      - "steps.groups.result.value.groups[0].editors == ['file:///work/app/src/main.ts'] && state['editor-groups@w1'].groups[0].active == 'file:///work/app/src/main.ts'"
  - id: workbench-shell-open-editors-startup-restore
    fixtures: [one-window-folder]
    steps:
      - {interface: editor-service.open-editors, caller: user, as: o, input: {resources: ["file:///work/app/src/main.ts", "file:///work/app/src/util.ts"]}}
      - {flow: workbench-shell-is-opened, as: r, input: {resource: "file:///work/app/src/util.ts"}}
    expect:
      - "steps.r.result.value.opened && !steps.r.result.value.active"
      - "state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts', 'file:///work/app/src/util.ts'] && state['editor-groups@w1'].groups[0].active == 'file:///work/app/src/main.ts'"

  # ---------------- close editor ----------------
  - id: workbench-shell-close-editor-clean
    flow: workbench-shell-close-editor
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *g3}
    expect:
      - "result.ok && state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts', 'file:///work/app/README.md']"
      - "state['editor-groups@w1'].groups[0].active == 'file:///work/app/src/main.ts'"
      - "state['history-service@w1'].recently_closed[0].resource == 'file:///work/app/src/util.ts'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'file-dialog-service.show-save-confirm')"
  - id: workbench-shell-close-editor-neighbour
    flow: workbench-shell-close-editor
    fixtures: [one-window-folder]
    config: {workbench-editor-focus-recent-editor-after-close: false}
    state: {"editor-groups@w1": *g3}
    expect:
      - "state['editor-groups@w1'].groups[0].active == 'file:///work/app/README.md'"
  - id: workbench-shell-close-editor-dirty-cancel
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    choices: {file-dialog-service.show-save-confirm.confirm: cancel}
    expect:
      - "result.ok && state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'file-dialog-service.show-save-confirm') && calls['text-file-service.save'] == 0"
  - id: workbench-shell-close-editor-dirty-save
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    expect:
      - "calls['text-file-service.save'] == 1 && trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.save' && e.input.options.reason == 'explicit')"
      - "state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-close-editor-dirty-save-fails
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    faults: [{target: text-file-service.save, type: error, code: file-modified-since}]
    expect:
      - "state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts']"
  - id: workbench-shell-close-editor-dirty-dont-save
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    choices: {file-dialog-service.show-save-confirm.confirm: dont_save}
    expect:
      - "calls['text-file-service.revert'] == 1 && state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-close-editor-dirty-revert-fails
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    choices: {file-dialog-service.show-save-confirm.confirm: dont_save}
    faults: [{target: text-file-service.revert, type: error, code: file-not-found, calls: [1]}]
    expect:
      - "calls['text-file-service.revert'] == 2 && trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.revert' && has(e.input.options) && e.input.options.soft)"
      - "state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-close-editor-auto-save-focus-change
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    config: {files-auto-save: onFocusChange}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.save' && e.input.options.reason == 'focus-change')"
      - "calls['file-dialog-service.show-save-confirm'] == 0 && state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-close-editor-auto-save-fails-asks
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    config: {files-auto-save: onFocusChange}
    faults: [{target: text-file-service.save, type: error, code: file-write-locked, calls: [1]}]
    expect:
      - "calls['file-dialog-service.show-save-confirm'] == 1 && calls['text-file-service.save'] == 2"
      - "state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-close-editor-dirty-opened-elsewhere
    flow: workbench-shell-close-editor
    fixtures: [dirty-editor]
    state: {"editor-groups@w1": {groups: [{id: 1, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts"}, {id: 2, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts"}], active_group: 2}}
    expect:
      - "calls['file-dialog-service.show-save-confirm'] == 0"
      - "size(state['editor-groups@w1'].groups) == 1 && state['editor-groups@w1'].active_group == 1"
  - id: workbench-shell-close-editor-empty-group-stays
    flow: workbench-shell-close-editor
    fixtures: [one-window-folder]
    config: {workbench-editor-close-empty-groups: false}
    state: {"editor-groups@w1": *g2}
    expect:
      - "size(state['editor-groups@w1'].groups) == 2 && state['editor-groups@w1'].groups[1].editors == []"
  - id: workbench-shell-close-editor-nothing-active
    flow: workbench-shell-close-editor
    fixtures: [one-window-folder]
    expect:
      - "result.ok && calls['editor-group-view.do-close-editors'] == 0 && state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-close-then-reopen
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *g3}
    steps:
      - {flow: workbench-shell-close-editor, as: close}
      - {flow: workbench-shell-reopen-closed-editor, as: reopen}
      - {flow: workbench-shell-get-history, as: hist}
      - {flow: workbench-shell-is-opened, as: read, input: {resource: "file:///work/app/src/util.ts"}}
    expect:
      - "steps.reopen.result.ok && steps.read.result.value.opened && steps.read.result.value.active"
      - "steps.hist.result.value.recently_closed == [] && steps.hist.result.value.history[0] == 'file:///work/app/src/util.ts'"
      - "state['history-service@w1'].batch_id == 1"
  - id: workbench-shell-reopen-nothing-closed
    flow: workbench-shell-reopen-closed-editor
    fixtures: [one-window-folder]
    expect:
      - "result.ok && calls['editor-service.open-editor'] == 0 && state['editor-groups@w1'].groups[0].editors == []"
  - id: workbench-shell-close-all-batch-reopen
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *g3}
    steps:
      - {interface: editor-commands.cmd-workbench-action-closeeditorsingroup, caller: user, as: c}
      - {flow: workbench-shell-reopen-closed-editor, as: r}
    expect:
      - "state['history-service@w1'].recently_closed == [] && calls['editor-service.open-editor'] == 3"
      - "size(state['editor-groups@w1'].groups[0].editors) == 3"
  - id: workbench-shell-close-all-dirty-veto
    fixtures: [dirty-editor]
    choices: {file-dialog-service.show-save-confirm.confirm: cancel}
    steps:
      - {interface: editor-actions.cmd-workbench-action-closealleditors, caller: user, as: c}
    expect:
      - "state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts']"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'editor-commands.close-all-in-all-groups' && e.output.closed == false)"

  # ---------------- keybindings ----------------
  - id: workbench-shell-keybinding-ctrl-w
    flow: workbench-shell-keybinding-dispatch
    fixtures: [one-window-folder]
    state: {"editor-groups@w1": *g3}
    expect:
      - "result.value.kind == 'kb-found' && result.value.command_id == 'workbench.action.closeActiveEditor'"
