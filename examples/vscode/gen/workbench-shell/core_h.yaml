# Reconciliation round additions (decisions 6-9).
components:
  - id: extension-management-service
    name: ExtensionManagementService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkbenchExtensionManagementService (desktop): routes installs to the extension management servers; checks workspace trust for extensions that don't support restricted mode before installing from the gallery."
    sources:
      - "src/vs/workbench/services/extensionManagement/common/extensionManagement.ts:64"
      - "src/vs/workbench/services/extensionManagement/electron-browser/extensionManagementService.ts:86"
      - "src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:512-546"
  - id: workbench-mcp-management-service
    name: WorkbenchMcpManagementService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IWorkbenchMcpManagementService (desktop): installs MCP servers into the user profile's mcp.json, the workspace configuration, or the remote user's; an impossible target throws 'Illegal target'. The servers it wrote are kept in state per scope (the profile/workspace mcp.json write is the platform McpManagementService's)."
    sources:
      - "src/vs/workbench/services/mcp/electron-browser/mcpWorkbenchManagementService.ts:42"
      - "src/vs/workbench/services/mcp/common/mcpWorkbenchManagementService.ts:92"
    state:
      initial: {servers: {user: {}, workspace: {}, remote_user: {}}}
  - {id: commands-registry, name: CommandsRegistry, kind: module, layer: platform, parent: platform, summary: "The global command table, owned by platform-core (boundary); workbench-shell seeds its commands in the workbench-shell-seed fixture.", sources: ["src/vs/platform/commands/common/commands.ts:67-147"], attributes: {boundary: true, owner: platform-core}, state: {initial: {commands: {}}}}
  - {id: working-copy-service, name: WorkingCopyService, kind: service, layer: workbench, parent: workbench, summary: "IWorkingCopyService, owned by files-search-scm (boundary).", sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts"], attributes: {boundary: true, owner: files-search-scm}}
  - {id: extension-management-channel, name: ExtensionManagementChannel, kind: module, layer: remote, parent: shared-process, summary: "The 'extensions' IPC channel, owned by remote-server (boundary).", sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:137-139"], attributes: {boundary: true, owner: remote-server}}

interfaces:
  # ---------------- clipboard-service (NativeClipboardService) ----------------
  - component: clipboard-service
    name: write-text
    kind: function
    summary: "NativeClipboardService.writeText: put text on the system clipboard."
    sources: ["src/vs/workbench/services/clipboard/electron-browser/clipboardService.ts:38-41"]
    request: {type: object, properties: {text: {type: string, examples: ["copied text"]}}}
    behavior:
      - set:
          state.text: "= has(input.text) ? input.text : ''"
          state.resources: []
      - return: {written: true}
  - component: clipboard-service
    name: read-text
    kind: function
    summary: "NativeClipboardService.readText."
    sources: ["src/vs/workbench/services/clipboard/electron-browser/clipboardService.ts:43-45"]
    response: {type: object, properties: {text: {type: string, examples: ["copied text"]}}}
    behavior:
      - return: {text: "= state.text"}
  - component: clipboard-service
    name: write-resources
    kind: function
    summary: "NativeClipboardService.writeResources: copied files are written as a resources buffer (and their paths as text)."
    sources: ["src/vs/workbench/services/clipboard/electron-browser/clipboardService.ts:62-66"]
    request: {type: object, properties: {resources: {type: array, items: {type: string}, examples: [["file:///work/app/src/util.ts"]]}}}
    behavior:
      - set:
          state.resources: "= has(input.resources) ? input.resources : []"
      - return: {written: true}
  - component: clipboard-service
    name: read-resources
    kind: function
    summary: "NativeClipboardService.readResources."
    sources: ["src/vs/workbench/services/clipboard/electron-browser/clipboardService.ts:68-70"]
    request: {type: object}
    response: {type: object, properties: {resources: {type: array, items: {type: string}}}}
    behavior:
      - return: {resources: "= state.resources"}

  # ---------------- quick-input-service ----------------
  - component: quick-input-service
    name: pick
    kind: function
    summary: "QuickInputService.pick: show a quick pick over the items; the user accepts (first item, or all for canPickMany) or dismisses it (undefined)."
    sources: ["src/vs/platform/quickinput/browser/quickInputService.ts:162-168"]
    request: {type: object, properties: {items: {type: array, default: []}, can_pick_many: {type: boolean, default: false}}}
    response: {type: object, properties: {picked: {}, canceled: {type: boolean}}}
    behavior:
      - choice: user
        default: accept
        options:
          accept:
            - return: {picked: "= size(input.items) == 0 ? null : (input.can_pick_many ? input.items : input.items[0])", canceled: "= size(input.items) == 0"}
          dismiss:
            - return: {picked: null, canceled: true}
  - component: quick-input-service
    name: quick-access-show
    kind: function
    summary: "QuickInputService.quickAccess.show(prefix): open quick access with the provider registered for the prefix ('>' commands, '@' symbols, '' files)."
    sources: ["src/vs/platform/quickinput/browser/quickInputService.ts:51-58"]
    request: {type: object, properties: {prefix: {type: string, default: ""}}}
    behavior:
      - set:
          state.visible: true
          state.prefix: "= input.prefix"
      - return: {shown: true}

  # ---------------- native-host-service (renderer proxy to the main process) ----------------
  - component: native-host-service
    name: get-window-count
    kind: function
    summary: "INativeHostService.getWindowCount: a ProxyChannel call on the 'nativeHost' channel, answered by the main process."
    sources:
      - "src/vs/platform/native/common/nativeHostService.ts:11-23"
      - "src/vs/workbench/services/host/electron-browser/nativeHostService.ts:25"
    request: {type: object}
    response: {type: object, properties: {count: {type: integer, examples: [1]}}}
    behavior:
      - call: native-host-main-service.get-window-count
        input: {window_id: "= self"}
        as: c
      - return: {count: "= vars.c.value.count"}
  - component: native-host-service
    name: close-window
    kind: function
    summary: "INativeHostService.closeWindow over the 'nativeHost' channel."
    sources: ["src/vs/platform/native/common/nativeHostService.ts:11-23"]
    behavior:
      - call: native-host-main-service.close-window
        input: {window_id: "= self", target_window_id: ""}
      - return: {requested: true}
  - component: native-host-service
    name: reload
    kind: function
    summary: "INativeHostService.reload over the 'nativeHost' channel."
    sources: ["src/vs/platform/native/common/nativeHostService.ts:11-23"]
    request: {type: object, properties: {disable_extensions: {type: boolean, default: false}}}
    behavior:
      - call: native-host-main-service.reload
        input: {window_id: "= self", disable_extensions: "= input.disable_extensions"}
      - return: {requested: true}
  - component: native-host-service
    name: open-window
    kind: function
    summary: "INativeHostService.openWindow over the 'nativeHost' channel: folders or files to open, in a new or the current window."
    sources: ["src/vs/platform/native/common/nativeHostService.ts:11-23"]
    request: {type: object, properties: {folder_uris: {type: array, items: {type: string}, default: []}, file_uris: {type: array, items: {type: string}, default: []}, force_new_window: {type: boolean, default: false}, force_reuse_window: {type: boolean, default: false}}}
    behavior:
      - call: native-host-main-service.open-window
        input: {window_id: "= self", folder_uris: "= input.folder_uris", file_uris: "= input.file_uris", force_new_window: "= input.force_new_window", force_reuse_window: "= input.force_reuse_window", prefer_new_window: false, add_mode: false, diff_mode: false}
      - return: {requested: true}
  - component: native-host-service
    name: show-item-in-folder
    kind: function
    summary: "INativeHostService.showItemInFolder over the 'nativeHost' channel (reveal in the OS file manager)."
    sources: ["src/vs/platform/native/common/nativeHostService.ts:11-23"]
    request: {type: object, properties: {path: {type: string, examples: ["/work/app/src/main.ts"]}}}
    behavior:
      - call: native-host-main-service.dev-tools-and-tracing
        input: {window_id: "= self", op: show-item-in-folder, path: "= has(input.path) ? input.path : ''", categories: ""}
      - return: {requested: true}
  - component: native-host-main-service
    name: dev-tools-and-tracing
    kind: ipc
    summary: "nativeHost channel operations grouped by main-process (show-item-in-folder among them)."
    sources: ["src/vs/platform/native/electron-main/nativeHostMainService.ts"]
    attributes: {boundary: true, owner: main-process}
    request: {type: object, properties: {window_id: {type: string, examples: [w1]}, op: {type: string, enum: [toggle-dev-tools, open-gpu-info-window, open-content-tracing-window, start-tracing, stop-tracing, show-item-in-folder], default: toggle-dev-tools}, path: {type: string, default: ""}, categories: {type: string, default: ""}}}
    response: {type: object, properties: {done: {type: boolean}}}

  # ---------------- extension-management-service ----------------
  - component: extension-management-service
    name: install-from-gallery
    kind: function
    summary: "ExtensionManagementService.installFromGallery: fetch the manifest, ask for workspace trust when the extension does not support untrusted workspaces (Cancel throws CancellationError), then install on the extension management server through its 'extensions' channel."
    sources: ["src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:512-546"]
    request:
      type: object
      required: [gallery]
      properties:
        gallery: {type: object, properties: {id: {type: string, examples: [ms-python.python]}, publisher: {type: string}, version: {type: string}, signed: {type: boolean, default: true}, compatible: {type: boolean, default: true}, last_updated: {type: integer}, main: {type: string}, untrusted_workspaces_supported: {type: boolean}}}
        pinned: {type: boolean, default: false}
    errors: [{code: canceled, status: 0, retryable: false}]
    behavior:
      - title: Untrusted-workspace support from the manifest (true when trust is disabled or there is no main entry point, else the declared capability, else false)
        source: "src/vs/workbench/services/extensions/common/extensionManifestPropertiesService.ts:314-347"
        set:
          vars.supported: "= !config['security-workspace-trust-enabled'] || !(has(input.gallery.main) && input.gallery.main != '') ? true : (has(input.gallery.untrusted_workspaces_supported) ? input.gallery.untrusted_workspaces_supported : false)"
      - if: "!vars.supported"
        then:
          - title: The extension requires a trusted workspace, request trust
            source: "src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:1008-1024"
            call: workspace-trust-request-service.request-workspace-trust
            input: {message: "Enabling this extension requires a trusted workspace."}
            as: trust
          - if: "vars.trust.value.trusted == null"
            then:
              - title: Trust request canceled
                source: "src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:1021-1023"
                fail: {code: canceled, message: Canceled}
      - title: Install on the extension management server (the 'extensions' channel)
        source: "src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:545"
        call: extension-management-channel.install-from-gallery
        input: {gallery: "= input.gallery", pinned: "= input.pinned"}
        as: installed
      - return: "= vars.installed.value"
  - component: extension-management-channel
    name: install-from-gallery
    kind: ipc
    summary: "'extensions' channel installFromGallery (remote-server)."
    sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:137-139"]
    attributes: {boundary: true, owner: remote-server, channel: extensions, command: installFromGallery}
    request: {type: object, properties: {gallery: {type: object, properties: {id: {type: string, examples: [ms-python.python]}, publisher: {type: string}, version: {type: string}, signed: {type: boolean, default: true}, compatible: {type: boolean, default: true}, last_updated: {type: integer}}}, pinned: {type: boolean}}}
    response: {type: object, properties: {id: {type: string, examples: [ms-python.python]}, version: {type: string}, source: {type: string, enum: [gallery, vsix, resource]}, pinned: {type: boolean, default: false}, is_builtin: {type: boolean, default: false}, installed_timestamp: {type: integer}}}

  - component: extension-management-service
    name: update-from-gallery
    kind: function
    summary: "ExtensionManagementService.updateFromGallery: update on the server that has the extension, which installs the gallery version through that server's 'extensions' channel."
    sources: ["src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:427-444"]
    request:
      type: object
      required: [gallery]
      properties:
        gallery: {type: object, properties: {id: {type: string, examples: [ms-python.python]}, publisher: {type: string}, version: {type: string}, signed: {type: boolean, default: true}, compatible: {type: boolean, default: true}, last_updated: {type: integer}}}
        pinned: {type: boolean, default: false}
    behavior:
      - title: installFromGallery on the extension's server
        source: "src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:443"
        call: extension-management-channel.install-from-gallery
        input: {gallery: "= input.gallery", pinned: "= input.pinned"}
        as: installed
      - return: "= vars.installed.value"
  - component: extension-management-service
    name: get-installed
    kind: function
    summary: "ExtensionManagementService.getInstalled: the installed extensions of every extension management server (only the local one in these worlds)."
    sources: ["src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:189-200"]
    response: {type: object, properties: {user: {type: array}, system: {type: array}}}
    behavior:
      - call: extension-management-channel.get-installed
        input: {}
        as: inst
      - return: "= vars.inst.value"
  - component: extension-management-service
    name: uninstall
    kind: function
    summary: "ExtensionManagementService.uninstall / uninstallExtensions: uninstall on the server that has the extension through its 'extensions' channel."
    sources:
      - "src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:202-204"
      - "src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:206-268"
    request: {type: object, required: [id], properties: {id: {type: string, examples: [ms-python.python]}}}
    behavior:
      - call: extension-management-channel.uninstall
        input: {id: "= input.id"}
      - return: {id: "= input.id", uninstalled: true}
  - component: extension-management-channel
    name: get-installed
    kind: ipc
    summary: "'extensions' channel getInstalled (remote-server)."
    sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:48-160"]
    attributes: {boundary: true, owner: remote-server, channel: extensions, command: getInstalled}
    response: {type: object, properties: {user: {type: array}, system: {type: array}}}
  - component: extension-management-channel
    name: uninstall
    kind: ipc
    summary: "'extensions' channel uninstall (remote-server)."
    sources: ["src/vs/platform/extensionManagement/common/extensionManagementIpc.ts:48-160"]
    attributes: {boundary: true, owner: remote-server, channel: extensions, command: uninstall}
    request: {type: object, required: [id], properties: {id: {type: string}}}
  - component: workbench-mcp-management-service
    name: install
    kind: function
    summary: "WorkbenchMcpManagementService.install: WORKSPACE needs a workspace configuration file, USER_REMOTE needs a remote connection, any target other than USER/USER_LOCAL is illegal; USER installs into the current profile's mcp.json."
    sources: ["src/vs/workbench/services/mcp/common/mcpWorkbenchManagementService.ts:348-380"]
    request: {type: object, properties: {name: {type: string, examples: [github]}, config: {type: object, default: {}}, target: {type: string, enum: [user, user-local, user-remote, workspace, workspace-folder], default: user}}}
    response: {type: object, properties: {name: {type: string}, scope: {type: string}}}
    errors: [{code: illegal-target, status: 0, retryable: false}]
    behavior:
      - call: workspace-context.get-workspace
        as: ws
      - if: "input.target == 'workspace'"
        then:
          - if: "vars.ws.value.workbench_state != 'workspace'"
            then:
              - title: No workspace configuration file, illegal target
                source: "src/vs/workbench/services/mcp/common/mcpWorkbenchManagementService.ts:352-358"
                fail: {code: illegal-target, message: "Illegal target: workspace"}
          - set:
              state.servers: "= merge(state.servers, {'workspace': merge(state.servers.workspace, {input.name: input.config})})"
          - return: {name: "= input.name", scope: workspace}
      - if: "input.target == 'user-remote'"
        then:
          - if: "!has(vars.ws.value.remote_authority) || vars.ws.value.remote_authority == ''"
            then:
              - title: No remote MCP management service, illegal target
                source: "src/vs/workbench/services/mcp/common/mcpWorkbenchManagementService.ts:364-367"
                fail: {code: illegal-target, message: "Illegal target: user-remote"}
          - set:
              state.servers: "= merge(state.servers, {'remote_user': merge(state.servers.remote_user, {input.name: input.config})})"
          - return: {name: "= input.name", scope: remote-user}
      - if: "!(input.target in ['user', 'user-local'])"
        then:
          - title: Any other target is illegal
            source: "src/vs/workbench/services/mcp/common/mcpWorkbenchManagementService.ts:373-375"
            fail: {code: illegal-target, message: "= 'Illegal target: ' + input.target"}
      - title: Install into the current profile's mcp.json
        source: "src/vs/workbench/services/mcp/common/mcpWorkbenchManagementService.ts:377-379"
        set:
          state.servers: "= merge(state.servers, {'user': merge(state.servers.user, {input.name: input.config})})"
      - return: {name: "= input.name", scope: user}
  - component: authentication-service
    name: remove-session
    kind: function
    summary: "AuthenticationService.removeSession: forward to the registered provider (an extension provider through the extension host); an unknown provider throws 'No authentication provider ... is currently registered.'"
    sources: ["src/vs/workbench/services/authentication/browser/authenticationService.ts:330-341"]
    request: {type: object, properties: {provider_id: {type: string, examples: [github]}, session_id: {type: string, examples: [gh-1]}}}
    response: {type: object, properties: {}}
    errors: [{code: no-authentication-provider-registered, status: 0, retryable: false}]
    behavior:
      - if: "!(input.provider_id in state.providers)"
        then:
          - title: No such provider
            source: "src/vs/workbench/services/authentication/browser/authenticationService.ts:338-340"
            fail: {code: no-authentication-provider-registered, message: "= 'No authentication provider ' + input.provider_id + ' is currently registered.'"}
      - title: authProvider.removeSession(sessionId)
        source: "src/vs/workbench/services/authentication/browser/authenticationService.ts:336-337"
        set:
          state.providers: "= merge(state.providers, {input.provider_id: {'sessions': state.providers[input.provider_id].sessions.filter(s, s != input.session_id)}})"
      - return: {}
  # ---------------- EditorAutoSave listeners ----------------
  - component: editor-auto-save
    name: on-did-change-dirty
    kind: event
    subscribe: [working-copy-service.on-did-change-dirty]
    summary: "EditorAutoSave.onDidChangeDirty: a working copy that became dirty schedules an auto save after files.autoSaveDelay (only when autoSave is afterDelay); one that became clean discards the pending save."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:220-226"
      - "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:237-251"
    request: {type: object, properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, dirty: {type: boolean, default: true}}}
    behavior:
      - if: "!input.dirty"
        then:
          - title: Clean again, discard the pending auto save
            source: "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:280-286"
            set:
              state.scheduled: "= omit(state.scheduled, input.resource)"
          - return: {scheduled: false}
      - call: editor-auto-save.schedule-auto-save
        input: {resource: "= input.resource"}
        as: s
      - return: "= vars.s.value"
  - component: editor-auto-save
    name: on-did-change-content
    kind: event
    subscribe: [working-copy-service.on-did-change-content]
    summary: "EditorAutoSave.onDidChangeContent: typing in a dirty working copy pushes the pending auto save out again."
    sources: ["src/vs/workbench/browser/parts/editor/editorAutoSave.ts:228-235"]
    request: {type: object, properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, version_id: {type: integer}}}
    behavior:
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: m
        on_error: continue
      - if: "!(vars.m.ok && ((has(vars.m.value.model) && has(vars.m.value.model.dirty) && vars.m.value.model.dirty) || (has(vars.m.value.dirty) && vars.m.value.dirty)))"
        then:
          - return: {scheduled: false}
      - call: editor-auto-save.schedule-auto-save
        input: {resource: "= input.resource"}
        as: s
      - return: "= vars.s.value"
  - component: editor-auto-save
    name: schedule-auto-save
    kind: function
    summary: "scheduleAutoSave: when files.autoSave is afterDelay, clear any pending save for the working copy and set a timer of files.autoSaveDelay."
    sources: ["src/vs/workbench/browser/parts/editor/editorAutoSave.ts:237-276"]
    request: {type: object, required: [resource], properties: {resource: {type: string}}}
    behavior:
      - if: "config['files-auto-save'] != 'afterDelay'"
        then:
          - title: Auto save after delay must be enabled
            source: "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:242-245"
            return: {scheduled: false}
      - set:
          state.scheduled: "= merge(has(state.scheduled) ? state.scheduled : {}, {input.resource: now})"
      - title: Schedule the auto save after files.autoSaveDelay
        source: "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:253-270"
        emit: editor-auto-save.run-auto-save
        after_ms: "= config['files-auto-save-delay']"
        input: {resource: "= input.resource", at: "= now"}
      - return: {scheduled: true}
  - component: editor-auto-save
    name: run-auto-save
    kind: function
    summary: "The auto save timer: if this is still the latest schedule and the working copy is still dirty, save it with reason auto."
    sources: ["src/vs/workbench/browser/parts/editor/editorAutoSave.ts:254-268"]
    request: {type: object, properties: {resource: {type: string}, at: {type: integer}}}
    behavior:
      - if: "!(has(state.scheduled) && input.resource in state.scheduled && state.scheduled[input.resource] == input.at)"
        then:
          - title: Superseded or discarded schedule
            return: {saved: false}
      - set:
          state.scheduled: "= omit(state.scheduled, input.resource)"
      - call: text-file-models.get
        input: {resource: "= input.resource"}
        as: m
        on_error: continue
      - if: "!(vars.m.ok && ((has(vars.m.value.model) && has(vars.m.value.model.dirty) && vars.m.value.model.dirty) || (has(vars.m.value.dirty) && vars.m.value.dirty)))"
        then:
          - title: No longer dirty
            source: "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:259"
            return: {saved: false}
      - title: "workingCopy.save({ reason: AUTO })"
        source: "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:260-264"
        call: text-file-models.save
        input: {resource: "= input.resource", options: {reason: auto}}
        as: s
      - set:
          state.auto_saved: "= (has(state.auto_saved) ? state.auto_saved : []) + [input.resource]"
      - return: {saved: true}
  - component: editor-auto-save
    name: on-did-change-focus
    kind: event
    subscribe: [workbench-host-service.on-did-change-focus]
    summary: "EditorAutoSave.onWindowFocusChange: losing window focus saves every dirty editor when autoSave is onFocusChange or onWindowChange (reason window-change)."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:110-114"
      - "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:195-208"
    request: {type: object, properties: {focused: {type: boolean, default: false}}}
    behavior:
      - if: "input.focused || !(config['files-auto-save'] in ['onFocusChange', 'onWindowChange'])"
        then:
          - return: {saved: false}
      - title: Save all dirty working copies with reason window-change
        source: "src/vs/workbench/browser/parts/editor/editorAutoSave.ts:195-207"
        call: editor-service.save-all
        input: {reason: window-change}
      - return: {saved: true}
  - component: workbench-host-service
    name: on-did-change-focus
    kind: event
    summary: "IHostService.onDidChangeFocus(focused): the window gained or lost OS focus (from the main process window events)."
    sources: ["src/vs/workbench/services/host/browser/host.ts:62"]
    request: {type: object, properties: {focused: {type: boolean}}}
  - component: workbench-host-service
    name: set-focus
    kind: function
    summary: "Window focus changes reported by the main process are fired as onDidChangeFocus."
    sources: ["src/vs/workbench/services/host/electron-browser/nativeHostService.ts:46-55"]
    request: {type: object, properties: {focused: {type: boolean, default: false}}}
    behavior:
      - publish: workbench-host-service.on-did-change-focus
        delivery: sync
        input: {focused: "= input.focused"}
      - return: {focused: "= input.focused"}
  # boundary stubs (files-search-scm)
  - component: working-copy-service
    name: on-did-change-dirty
    kind: event
    summary: "IWorkingCopyService.onDidChangeDirty (files-search-scm)."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts"]
    attributes: {boundary: true, owner: files-search-scm}
    request: {type: object, properties: {resource: {type: string}, dirty: {type: boolean}}}
  - component: working-copy-service
    name: on-did-change-content
    kind: event
    summary: "IWorkingCopyService.onDidChangeContent (files-search-scm)."
    sources: ["src/vs/workbench/services/workingCopy/common/workingCopyService.ts"]
    attributes: {boundary: true, owner: files-search-scm}
    request: {type: object, properties: {resource: {type: string}, version_id: {type: integer}}}
  - component: text-file-models
    name: save
    kind: function
    summary: "TextFileEditorModel.save (files-search-scm)."
    sources: ["src/vs/workbench/services/textfile/common/textFileEditorModel.ts"]
    attributes: {boundary: true, owner: files-search-scm}
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, options: {type: object, properties: {reason: {type: string}, force: {type: boolean}, skip_save_participants: {type: boolean}}}}}
    response: {type: object, properties: {saved: {type: boolean, examples: [true]}, resource: {type: string}, skipped: {type: string}, error_code: {type: string}}}

scenarios:
  - id: workbench-shell-auto-save-after-delay
    fixtures: [dirty-editor]
    config: {files-auto-save: afterDelay}
    steps:
      - {interface: editor-auto-save.on-did-change-dirty, caller: user, as: d, input: {resource: "file:///work/app/src/main.ts", dirty: true}}
    expect:
      - "steps.d.result.value.scheduled"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save' && e.input.options.reason == 'auto').size() == 1"
      - "state['editor-auto-save@w1'].auto_saved == ['file:///work/app/src/main.ts'] && state['editor-auto-save@w1'].scheduled == {}"
  - id: workbench-shell-auto-save-on-content-change
    fixtures: [dirty-editor]
    config: {files-auto-save: afterDelay}
    steps:
      - {interface: editor-auto-save.on-did-change-content, caller: user, as: c, input: {resource: "file:///work/app/src/main.ts", version_id: 3}}
    expect:
      - "steps.c.result.value.scheduled && calls['text-file-models.save'] == 1"
      - "state['editor-auto-save@w1'].auto_saved == ['file:///work/app/src/main.ts']"
  - id: workbench-shell-auto-save-superseded
    fixtures:
    - dirty-editor
    - workbench-shell-seed
    config:
      files-auto-save: afterDelay
    steps:
    - interface: editor-auto-save.on-did-change-dirty
      caller: user
      as: d
      input:
        resource: file:///work/app/src/main.ts
        dirty: true
    - interface: editor-auto-save.run-auto-save
      caller: user
      as: r
      at_ms: 1500
      input:
        resource: file:///work/app/src/main.ts
        at: 0
    - interface: editor-auto-save.on-did-change-dirty
      caller: user
      as: clean
      at_ms: 1600
      input:
        resource: file:///work/app/src/main.ts
        dirty: false
    expect:
    - '!steps.r.result.value.saved && !steps.clean.result.value.scheduled'
    - state['editor-auto-save@w1'].scheduled == {} && calls['text-file-models.save'] == 1
  - id: workbench-shell-auto-save-off
    fixtures: [dirty-editor]
    steps:
      - {interface: editor-auto-save.on-did-change-dirty, caller: user, as: d, input: {resource: "file:///work/app/src/main.ts", dirty: true}}
      - {interface: editor-auto-save.on-did-change-content, caller: user, as: c, input: {resource: "file:///work/app/src/util.ts", version_id: 2}}
    expect:
      - "!steps.d.result.value.scheduled && !steps.c.result.value.scheduled && calls['text-file-models.save'] == 0 && state['editor-auto-save@w1'].scheduled == {}"
  - id: workbench-shell-auto-save-not-dirty-at-timer
    fixtures: [one-window-folder]
    config: {files-auto-save: afterDelay}
    steps:
      - {interface: editor-auto-save.on-did-change-dirty, caller: user, as: d, input: {resource: "file:///work/app/src/util.ts", dirty: true}}
    expect:
      - "steps.d.result.value.scheduled && calls['text-file-models.save'] == 0 && state['editor-auto-save@w1'].scheduled == {}"
  - id: workbench-shell-auto-save-window-blur
    fixtures: [dirty-editor]
    config: {files-auto-save: onFocusChange}
    steps:
      - {interface: workbench-host-service.set-focus, caller: user, as: blur, input: {focused: false}}
      - {interface: workbench-host-service.set-focus, caller: user, as: focus, input: {focused: true}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-service.save' && e.input.options.reason == 'window-change') && calls['editor-service.save-all'] == 1"
  - id: workbench-shell-clipboard-roundtrip
    fixtures: [one-window-folder]
    steps:
      - {interface: clipboard-service.write-text, caller: user, as: w, input: {text: "add(1, 2)"}}
      - {interface: clipboard-service.read-text, caller: user, as: r}
      - {interface: clipboard-service.write-resources, caller: user, as: wr, input: {resources: ["file:///work/app/src/util.ts"]}}
      - {interface: clipboard-service.read-resources, caller: user, as: rr, input: {}}
    expect:
      - "steps.r.result.value.text == 'add(1, 2)' && steps.rr.result.value.resources == ['file:///work/app/src/util.ts']"
      - "state['clipboard-service@w1'].resources == ['file:///work/app/src/util.ts']"
  - id: workbench-shell-quick-input
    fixtures: [one-window-folder]
    steps:
      - {interface: quick-input-service.quick-access-show, caller: user, as: q, input: {prefix: ">"}}
      - {interface: quick-input-service.pick, caller: user, as: p, input: {items: [a, b], can_pick_many: false}}
      - {interface: quick-input-service.pick, caller: user, as: m, input: {items: [a, b], can_pick_many: true}}
    expect:
      - "steps.p.result.value.picked == 'a' && steps.m.result.value.picked == ['a', 'b'] && state['quick-input-service@w1'].prefix == '>'"
  - id: workbench-shell-quick-input-dismiss
    fixtures: [one-window-folder]
    choices: {quick-input-service.pick.user: dismiss}
    steps:
      - {interface: quick-input-service.pick, caller: user, as: p, input: {items: [a]}}
    expect:
      - "steps.p.result.value.canceled && steps.p.result.value.picked == null && size(trace) > 0"
  - id: workbench-shell-native-host-proxy
    fixtures: [one-window-folder]
    steps:
      - {interface: native-host-service.get-window-count, caller: user, as: c, input: {}}
      - {interface: native-host-service.show-item-in-folder, caller: user, as: s, input: {path: /work/app/src/main.ts}}
      - {interface: native-host-service.reload, caller: user, as: r, input: {}}
      - {interface: native-host-service.open-window, caller: user, as: o, input: {folder_uris: ["file:///work/lib"], force_new_window: true}}
      - {interface: native-host-service.close-window, caller: user, as: x}
    expect:
      - "steps.c.result.ok && trace.exists(e, e.type == 'call.start' && e.interface == 'native-host-main-service.dev-tools-and-tracing' && e.input.op == 'show-item-in-folder')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'native-host-main-service.open-window' && e.input.folder_uris == ['file:///work/lib'] && e.instance == '') && calls['native-host-main-service.close-window'] == 1"
  - id: workbench-shell-install-extension
    fixtures: [one-window-folder]
    steps:
      - {interface: extension-management-service.install-from-gallery, caller: user, as: i, input: {gallery: {id: ms-python.python, publisher: ms-python, version: "2026.18.0"}, pinned: false}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-management-channel.install-from-gallery' && e.input.gallery.id == 'ms-python.python') && size(trace) > 0"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'workspace-trust-request-service.request-workspace-trust')"
  - id: workbench-shell-extension-management-hops
    fixtures: [one-window-folder]
    steps:
      - {interface: extension-management-service.update-from-gallery, caller: user, as: u, input: {gallery: {id: ms-python.python, version: "2026.19.0"}, pinned: false}}
      - {interface: extension-management-service.get-installed, caller: user, as: g}
      - {interface: extension-management-service.uninstall, caller: user, as: x, input: {id: ms-python.python}}
    expect:
      - "steps.g.result.ok && steps.x.result.value.uninstalled"
      - "calls['extension-management-channel.install-from-gallery'] == 1 && calls['extension-management-channel.get-installed'] == 1 && trace.exists(e, e.type == 'call.start' && e.interface == 'extension-management-channel.uninstall' && e.input.id == 'ms-python.python')"
  - id: workbench-shell-install-extension-untrusted-cancel
    fixtures: [untrusted-folder]
    choices: {workspace-trust-request-service.request-workspace-trust.modal: cancel}
    steps:
      - {interface: extension-management-service.install-from-gallery, caller: user, as: i, input: {gallery: {id: ms-python.python, main: ./out/extension.js, untrusted_workspaces_supported: false}, pinned: false}}
    expect:
      - "!steps.i.result.ok && steps.i.result.error.code == 'canceled' && calls['extension-management-channel.install-from-gallery'] == 0"
      - "!state['workspace-context@w1'].trusted"
  - id: workbench-shell-install-extension-untrusted-trust
    fixtures: [untrusted-folder]
    steps:
      - {interface: extension-management-service.install-from-gallery, caller: user, as: i, input: {gallery: {id: ms-python.python, main: ./out/extension.js, untrusted_workspaces_supported: false}, pinned: true}}
      - {flow: workbench-shell-trust-query, as: q}
    expect:
      - "steps.q.result.value.trusted && state['workspace-context@w1'].trusted"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'workspace-trust-request-service.request-workspace-trust')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'extension-management-channel.install-from-gallery')[0].seq"
  - id: workbench-shell-mcp-install
    fixtures: [one-window-folder]
    steps:
      - {interface: workbench-mcp-management-service.install, caller: user, as: u, input: {name: github, config: {type: http, url: "https://api.githubcopilot.com/mcp/"}, target: user}}
      - {interface: workbench-mcp-management-service.install, caller: user, as: w, input: {name: local, config: {}, target: workspace}}
      - {interface: workbench-mcp-management-service.install, caller: user, as: r, input: {name: remote, config: {}, target: user-remote}}
    expect:
      - "steps.u.result.value.scope == 'user' && state['workbench-mcp-management-service@w1'].servers.user.github.type == 'http'"
      - "!steps.w.result.ok && steps.w.result.error.code == 'illegal-target' && !steps.r.result.ok"
  - id: workbench-shell-mcp-install-workspace
    fixtures: [one-window-folder]
    state: {"workspace-context@w1": {untitled_workspace: true, remote_authority: "ssh-remote+dev-box"}}
    steps:
      - {interface: workbench-mcp-management-service.install, caller: user, as: w, input: {name: local, config: {command: node}, target: workspace}}
      - {interface: workbench-mcp-management-service.install, caller: user, as: r, input: {name: remote, config: {}, target: user-remote}}
      - {interface: workbench-mcp-management-service.install, caller: user, as: x, input: {name: x, config: {}, target: workspace-folder}}
    expect:
      - "steps.w.result.value.scope == 'workspace' && steps.r.result.value.scope == 'remote-user' && steps.x.result.error.code == 'illegal-target'"
      - "'local' in state['workbench-mcp-management-service@w1'].servers.workspace"
  - id: workbench-shell-auth-remove-session
    fixtures: [one-window-folder]
    state: {"authentication-service@w1": {providers: {github: {sessions: [gh-1, gh-2]}}}}
    steps:
      - {interface: authentication-service.remove-session, caller: user, as: r, input: {provider_id: github, session_id: gh-1}}
      - {interface: authentication-service.remove-session, caller: user, as: u, input: {provider_id: microsoft, session_id: ms-1}}
    expect:
      - "steps.r.result.ok && state['authentication-service@w1'].providers.github.sessions == ['gh-2']"
      - "!steps.u.result.ok && steps.u.result.error.code == 'no-authentication-provider-registered'"
