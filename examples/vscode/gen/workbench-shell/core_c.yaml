interfaces:
  # ---------------- editor-service ----------------
  - component: editor-service
    name: open-editor
    kind: function
    summary: 'IEditorService.openEditor: resolve the editor through the resolver, find the target group (explicit id, SIDE_GROUP, an already-opened group when revealIfOpen, else the active group skipping
      locked groups) and open it there. The seam every area calls to open an editor.'
    sources:
    - src/vs/workbench/services/editor/browser/editorService.ts:540-599
    - src/vs/workbench/services/editor/common/editorGroupFinder.ts:101-232
    attributes:
      seam: true
      callers: all
    request: WorkbenchOpenEditorRequest
    response: WorkbenchOpenEditorResult
    errors:
    - code: invalid-editor-group-provided
      status: 0
      retryable: false
      summary: an explicit group id that does not exist (EditorPart.assertGroupView)
    behavior:
    - set:
        vars.o: '= has(input.options) ? input.options : {}'
        vars.pref: '= has(input.group) ? input.group : -1'
    - title: Resolve the untyped input to an editor
      source: src/vs/workbench/services/editor/browser/editorService.ts:549-563
      call: editor-resolver-service.resolve-editor
      input:
        resource: = input.resource
      as: resolved
    - call: modal-editor-part.get-group
      as: modal
    - set:
        vars.use_modal: = config['workbench-editor-use-modal']
        vars.requires_modal: = input.resource.split(':')[0] in vars.modal.value.requires_modal_schemes
    - if: vars.requires_modal && vars.use_modal != 'off'
      then:
      - title: An editor with the RequiresModal capability opens in the modal editor part (unless workbench.editor.useModal is off)
        source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:105-110
        call: editor-parts.create-modal-editor-part
        as: mp
      - call: editor-group-model.open-editor
        input:
          group: = vars.mp.value.group
          resource: = input.resource
          pinned: '= has(vars.o.pinned) ? vars.o.pinned : true'
          active: true
        as: mres
      - call: modal-editor-part.put-group
        input:
          group: = vars.mres.value.group
      - return:
          opened: true
          resource: = input.resource
          group_id: -4
          pinned: true
          is_new: = vars.mres.value.is_new
    - if: vars.modal.value.open && vars.use_modal != 'all' && !(has(vars.o.preserve_focus) && vars.o.preserve_focus)
      then:
      - title: A normal editor opened while the modal part is open goes to the main part and closes the modal part (unless preserveFocus)
        source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:58-72
        call: modal-editor-part.close
    - call: editor-groups.get-state
      as: st
    - set:
        vars.gs: = vars.st.value.groups
        vars.ag: = vars.st.value.active_group
        vars.mru: = vars.st.value.group_mru
    - set:
        vars.active_g: = vars.gs.filter(g, g.id == vars.ag)[0]
        vars.locked_for: = vars.gs.filter(g, g.locked && !(input.resource in g.editors)).map(g, g.id)
    - if: vars.pref >= 1
      then:
      - title: Explicit group identifier
        source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:119-121
        if: '!vars.gs.exists(g, g.id == vars.pref)'
        then:
        - fail:
            code: invalid-editor-group-provided
            message: Invalid editor group provided!
      - set:
          vars.target: = vars.pref
      else:
      - if: vars.pref == -2
        then:
        - title: SIDE_GROUP, use the group to the side or create one
          source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:124-135
          set:
            vars.ia: = lists.range(size(vars.gs)).filter(i, vars.gs[i].id == vars.ag)[0]
        - if: vars.ia + 1 < size(vars.gs) && !(vars.gs[vars.ia + 1].id in vars.locked_for)
          then:
          - set:
              vars.target: = vars.gs[vars.ia + 1].id
          else:
          - call: editor-part.add-group
            input:
              location_id: = vars.ag
              direction: right
            as: added
          - set:
              vars.target: = vars.added.value.group_id
        else:
        - set:
            vars.opened_in: = vars.mru.filter(id, vars.gs.exists(g, g.id == id && input.resource in g.editors))
        - if: ((has(vars.o.reveal_if_opened) && vars.o.reveal_if_opened) || config['workbench-editor-reveal-if-open']) && size(vars.opened_in) > 0
          then:
          - title: revealIfOpen, prefer a group where the editor is already opened
            source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:167-189
            set:
              vars.target: = vars.opened_in[0]
          else:
          - if: vars.ag in vars.locked_for
            then:
            - title: Active group is locked, take the most recent unlocked group or add one
              source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:205-225
              set:
                vars.unlocked: = vars.mru.filter(id, !(id in vars.locked_for))
            - if: size(vars.unlocked) > 0
              then:
              - set:
                  vars.target: = vars.unlocked[0]
              else:
              - call: editor-part.add-group
                input:
                  location_id: = vars.ag
                  direction: right
                as: added2
              - set:
                  vars.target: = vars.added2.value.group_id
            else:
            - set:
                vars.target: = vars.ag
    - title: Open in the target group
      source: src/vs/workbench/services/editor/browser/editorService.ts:598
      call: editor-group-view.open-editor
      input:
        group_id: = vars.target
        resource: = input.resource
        options: = vars.o
      as: opened
    - return: = vars.opened.value
  - component: editor-service
    name: open-editors
    kind: function
    summary: "IEditorService.openEditors: open several editors into one group (used on startup restore with validateTrust)."
    sources: ["src/vs/workbench/services/editor/browser/editorService.ts:606-680"]
    request:
      type: object
      required: [resources]
      properties:
        resources: {type: array, items: {type: string}, examples: [["file:///work/app/src/main.ts"]]}
        group: {type: integer, default: -1}
    behavior:
      - foreach: "= input.resources"
        as: r
        steps:
          - call: editor-service.open-editor
            input: {resource: "= vars.r", group: "= has(input.group) ? input.group : -1", options: {pinned: true, inactive: "= vars.index > 0"}}
      - return: {count: "= size(input.resources)"}
  - component: editor-service
    name: is-opened
    kind: function
    summary: "IEditorService.isOpened: whether an editor for the resource is opened in any group of the window. The read path for open/close."
    sources: ["src/vs/workbench/services/editor/browser/editorService.ts:770-788"]
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {opened: {type: boolean}, groups: {type: array, items: {type: integer}}, active: {type: boolean}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.in_groups: "= vars.st.value.groups.filter(g, input.resource in g.editors).map(g, g.id)"
      - return:
          opened: "= size(vars.in_groups) > 0"
          groups: "= vars.in_groups"
          active: "= vars.st.value.groups.exists(g, g.id == vars.st.value.active_group && g.active == input.resource)"
  - component: editor-service
    name: on-did-close-editor
    kind: event
    summary: "IEditorService.onDidCloseEditor, fired synchronously for every closed editor with its index and sticky state."
    sources: ["src/vs/workbench/services/editor/common/editorService.ts:191"]
    request:
      type: object
      properties:
        resource: {type: string}
        group_id: {type: integer}
        index: {type: integer}
        sticky: {type: boolean}
        batch: {type: integer}

  # ---------------- editor-resolver-service ----------------
  - component: editor-resolver-service
    name: resolve-editor
    kind: function
    summary: "Resolve an untyped resource input: no association or override registered for file resources here, so it falls back to the default text editor (DEFAULT_EDITOR_ASSOCIATION)."
    sources: ["src/vs/workbench/services/editor/browser/editorResolverService.ts:129-230"]
    request: {type: object, required: [resource], properties: {resource: {type: string}}}
    response: {type: object, properties: {status: {type: string}, editor_id: {type: string}}}
    behavior:
      - title: Fall back to the default editor association
        source: "src/vs/workbench/services/editor/browser/editorResolverService.ts:179-187"
        return: {status: resolved, editor_id: default}

  # ---------------- editor-part ----------------
  - component: editor-part
    name: add-group
    kind: function
    summary: "EditorPart.addGroup: create an empty group next to a location group (left/up before it, right/down after it)."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:619-660"]
    request:
      type: object
      required: [location_id, direction]
      properties:
        location_id: {type: integer}
        direction: {type: string, enum: [left, right, up, down]}
    behavior:
      - call: editor-groups.get-state
        as: st
      - if: "!vars.st.value.groups.exists(g, g.id == input.location_id)"
        then:
          - fail: {code: invalid-editor-group-provided, message: "Invalid editor group provided!"}
      - call: editor-groups.insert-group
        input:
          group: {id: "= vars.st.value.next_group_id", editors: [], active: null, preview: null, sticky: [], mru: [], locked: false}
          location_id: "= input.location_id"
          before: "= input.direction == 'left' || input.direction == 'up'"
      - return: {group_id: "= vars.st.value.next_group_id"}
  - component: editor-part
    name: find-group
    kind: function
    summary: "EditorPart.findGroup by direction (neighbour in the grid) or location (first, last, next, previous)."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:360-412"]
    request:
      type: object
      required: [scope]
      properties:
        scope: {type: string, enum: [left, right, up, down, first, last, next, previous]}
        source_id: {type: integer}
    response: {type: object, properties: {group_id: {type: [integer, "null"]}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.gs: "= vars.st.value.groups"
          vars.src: "= has(input.source_id) ? input.source_id : vars.st.value.active_group"
      - set:
          vars.i: "= lists.range(size(vars.gs)).filter(i, vars.gs[i].id == vars.src)[0]"
      - return:
          group_id: "= input.scope == 'first' ? vars.gs[0].id : (input.scope == 'last' ? vars.gs[size(vars.gs) - 1].id : ((input.scope in ['right', 'down', 'next']) ? (vars.i + 1 < size(vars.gs) ? vars.gs[vars.i + 1].id : null) : (vars.i > 0 ? vars.gs[vars.i - 1].id : null)))"
  - component: editor-part
    name: activate-group
    kind: function
    summary: "EditorPart.activateGroup."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:414-426"]
    request: {type: object, required: [group_id], properties: {group_id: {type: integer}}}
    behavior:
      - call: editor-groups.set-active-group
        input: {group_id: "= input.group_id"}
      - return: {group_id: "= input.group_id"}
  - component: editor-part
    name: remove-group
    kind: function
    summary: "EditorPart.removeGroup: never removes the last group; an empty group is removed (next most recent group activated), a group with editors is merged into the last active group."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:822-884"]
    request: {type: object, required: [group_id], properties: {group_id: {type: integer}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - if: "size(vars.st.value.groups) == 1"
        then:
          - title: Cannot remove the last root group
            source: "src/vs/workbench/browser/parts/editor/editorPart.ts:824-826"
            return: {removed: false}
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == input.group_id)[0]"
      - if: "size(vars.g.editors) == 0"
        then:
          - title: Remove the empty group
            source: "src/vs/workbench/browser/parts/editor/editorPart.ts:855-884"
            call: editor-groups.delete-group
            input: {group_id: "= input.group_id"}
        else:
          - title: Merge its editors into the last active group, which removes it
            source: "src/vs/workbench/browser/parts/editor/editorPart.ts:839-853"
            call: editor-part.merge-group
            input:
              source_id: "= input.group_id"
              target_id: "= vars.st.value.active_group == input.group_id ? vars.st.value.group_mru[1] : vars.st.value.group_mru[0]"
      - return: {removed: true}
  - component: editor-part
    name: merge-group
    kind: function
    summary: "EditorPart.mergeGroup: move (or copy) all editors of a source group to the end of a target group as inactive editors, then remove the source when empty."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:942-994"]
    request:
      type: object
      required: [source_id, target_id]
      properties:
        source_id: {type: integer}
        target_id: {type: integer}
        mode: {type: string, enum: [move, copy], default: move}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.src: "= vars.st.value.groups.filter(g, g.id == input.source_id)[0]"
          vars.tgt: "= vars.st.value.groups.filter(g, g.id == input.target_id)[0]"
      - set:
          vars.moved: "= vars.src.editors.filter(e, !(e in vars.tgt.editors))"
      - title: Add the source editors at the end of the target group
        source: "src/vs/workbench/browser/parts/editor/editorPart.ts:946-982"
        call: editor-groups.put-group
        input:
          group: "= {'id': vars.tgt.id, 'editors': vars.tgt.editors + vars.moved, 'active': vars.tgt.active == null && size(vars.src.editors) > 0 ? vars.src.editors[0] : vars.tgt.active, 'preview': vars.tgt.preview, 'sticky': vars.tgt.sticky, 'mru': vars.tgt.mru + vars.moved, 'locked': vars.tgt.locked}"
      - if: "!has(input.mode) || input.mode == 'move'"
        then:
          - call: editor-groups.put-group
            input:
              group: "= {'id': vars.src.id, 'editors': [], 'active': null, 'preview': null, 'sticky': [], 'mru': [], 'locked': vars.src.locked}"
          - title: Remove the now empty source group
            source: "src/vs/workbench/browser/parts/editor/editorPart.ts:989-991"
            call: editor-groups.delete-group
            input: {group_id: "= input.source_id"}
      - return: {merged: true}
  - component: editor-part
    name: merge-all-groups
    kind: function
    summary: "EditorPart.mergeAllGroups: merge every other group into the target, most recently active first."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:996-1012"]
    request: {type: object, required: [target_id], properties: {target_id: {type: integer}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - foreach: "= vars.st.value.group_mru.filter(id, id != input.target_id)"
        as: gid
        steps:
          - call: editor-part.merge-group
            input: {source_id: "= vars.gid", target_id: "= input.target_id"}
      - return: {merged: true}
  - component: editor-part
    name: apply-layout
    kind: function
    summary: "EditorPart.applyLayout: when the layout has fewer groups than the grid, merge the extra groups into the last group of the layout, then add groups until the count matches."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:517-566"]
    request:
      type: object
      required: [groups]
      properties:
        orientation: {type: integer, enum: [0, 1], default: 0}
        groups: {type: integer, minimum: 1, maximum: 4, examples: [2]}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.gs: "= vars.st.value.groups"
      - if: "input.groups < size(vars.gs)"
        then:
          - title: Too many groups, merge the extra ones into the last group of the layout
            source: "src/vs/workbench/browser/parts/editor/editorPart.ts:534-542"
            foreach: "= vars.gs.slice(input.groups, size(vars.gs))"
            as: extra
            steps:
              - call: editor-part.merge-group
                input: {source_id: "= vars.extra.id", target_id: "= vars.gs[input.groups - 1].id"}
        else:
          - foreach: "= lists.range(input.groups - size(vars.gs))"
            as: k
            steps:
              - call: editor-groups.get-state
                as: st2
              - call: editor-part.add-group
                input: {location_id: "= vars.st2.value.groups[size(vars.st2.value.groups) - 1].id", direction: right}
      - return: {groups: "= input.groups"}
  - component: editor-part
    name: get-layout
    kind: function
    summary: "EditorPart.getLayout: the serialized grid as {orientation, groups}; one leaf per group here."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:568-581"]
    response: {type: object, properties: {orientation: {type: integer}, groups: {type: array}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - return: {orientation: 0, groups: "= vars.st.value.groups.map(g, {})"}
  - component: editor-part
    name: move-group
    kind: function
    summary: "EditorPart.moveGroup / copyGroup (duplicate): place the group (or a copy of it with its editors) next to its neighbour in the given direction."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:885-940"]
    request:
      type: object
      required: [direction]
      properties:
        direction: {type: string, enum: [left, right, up, down]}
        copy: {type: boolean, default: false}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.src: "= vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]"
      - if: "has(input.copy) && input.copy"
        then:
          - title: Duplicate the group with its editors next to it
            source: "src/vs/workbench/browser/parts/editor/editorPart.ts:925-940"
            call: editor-groups.insert-group
            input:
              group: "= {'id': vars.st.value.next_group_id, 'editors': vars.src.editors, 'active': vars.src.active, 'preview': vars.src.preview, 'sticky': vars.src.sticky, 'mru': vars.src.mru, 'locked': false}"
              location_id: "= vars.src.id"
              before: "= input.direction == 'left' || input.direction == 'up'"
          - call: editor-groups.set-active-group
            input: {group_id: "= vars.st.value.next_group_id"}
          - return: {group_id: "= vars.st.value.next_group_id"}
      - call: editor-part.find-group
        input: {scope: "= input.direction", source_id: "= vars.src.id"}
        as: nb
      - if: "vars.nb.value.group_id == null"
        then:
          - return: {group_id: "= vars.src.id", moved: false}
      - call: editor-groups.delete-group
        input: {group_id: "= vars.src.id"}
      - call: editor-groups.insert-group
        input: {group: "= vars.src", location_id: "= vars.nb.value.group_id", before: "= input.direction == 'left' || input.direction == 'up'"}
      - call: editor-groups.set-active-group
        input: {group_id: "= vars.src.id"}
      - return: {group_id: "= vars.src.id", moved: true}

  # ---------------- editor-group-view ----------------
  - component: editor-group-view
    name: open-editor
    kind: function
    summary: 'EditorGroupView.doOpenEditor: pin when sticky, when preview is disabled, when the editor is dirty or when asked; activate the group unless preserveFocus; update the model.'
    sources:
    - src/vs/workbench/browser/parts/editor/editorGroupView.ts:1190-1260
    request:
      type: object
      required:
      - group_id
      - resource
      properties:
        group_id:
          type: integer
        resource:
          type: string
        options:
          type: object
          default: {}
    response: WorkbenchOpenEditorResult
    behavior:
    - set:
        vars.o: '= has(input.options) ? input.options : {}'
    - call: editor-groups.get-state
      as: st
    - if: '!vars.st.value.groups.exists(g, g.id == input.group_id)'
      then:
      - fail:
          code: invalid-editor-group-provided
          message: Invalid editor group provided!
    - set:
        vars.g: = vars.st.value.groups.filter(g, g.id == input.group_id)[0]
    - title: Is the editor dirty
      call: text-file-models.get
      input:
        resource: = input.resource
      as: m
      on_error: continue
    - title: Decide pinned (sticky, preview disabled, dirty, explicit pin or index)
      source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1202-1208
      set:
        vars.pinned: '= (has(vars.o.sticky) && vars.o.sticky) || !config[''workbench-editor-enable-preview''] || (vars.m.ok && ((has(vars.m.value.model) && has(vars.m.value.model.dirty) && vars.m.value.model.dirty)
          || (has(vars.m.value.dirty) && vars.m.value.dirty))) || (has(vars.o.pinned) ? vars.o.pinned : has(vars.o.index))'
        vars.active0: = size(vars.g.editors) == 0 || !(has(vars.o.inactive) && vars.o.inactive)
    - set:
        vars.active: = vars.active0 || (!vars.pinned && vars.g.active != null && vars.g.active == vars.g.preview)
    - call: editor-group-model.open-editor
      input:
        group: = vars.g
        resource: = input.resource
        pinned: = vars.pinned
        sticky: = has(vars.o.sticky) && vars.o.sticky
        active: = vars.active
      as: res
    - call: editor-groups.put-group
      input:
        group: = vars.res.value.group
    - if: vars.active && input.resource.startsWith('file://')
      then:
      - title: doShowEditor puts the active editor in the pane; TextFileEditor.setInput resolves the input through the text file model manager (an existing model is reused)
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1288-1300
        call: text-file-models.resolve
        input:
          resource: = input.resource
        as: resolved
        on_error:
        - title: A failed resolve fires onDidOpenEditorFail; the editor stays in the model
          source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1303-1306
          set:
            state.open_failures: '= (has(state.open_failures) ? state.open_failures : []) + [input.resource]'
    - if: vars.active && !(has(vars.o.preserve_focus) && vars.o.preserve_focus)
      then:
      - title: Activate the group (opening as active editor without preserveFocus)
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1236-1243
        call: editor-groups.set-active-group
        input:
          group_id: = input.group_id
    - return:
        opened: true
        resource: = input.resource
        group_id: = input.group_id
        pinned: = vars.pinned
        is_new: = vars.res.value.is_new
  - component: editor-group-view
    name: handle-close-confirmation
    kind: function
    summary: 'EditorGroupView.doHandleCloseConfirmation: a dirty editor that is not opened in another group is auto-saved (autoSave onFocusChange) or confirmed with Save / Don''t Save / Cancel. Returns veto.'
    sources:
    - src/vs/workbench/browser/parts/editor/editorGroupView.ts:1738-1883
    request:
      type: object
      required:
      - group_id
      - resource
      properties:
        group_id:
          type: integer
        resource:
          type: string
    response:
      type: object
      properties:
        veto:
          type: boolean
    behavior:
    - call: text-file-models.get
      input:
        resource: = input.resource
      as: m
      on_error: continue
    - if: '!(vars.m.ok && ((has(vars.m.value.model) && has(vars.m.value.model.dirty) && vars.m.value.model.dirty) || (has(vars.m.value.dirty) && vars.m.value.dirty)))'
      then:
      - title: Not dirty, nothing to confirm
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1739-1741
        return:
          veto: false
    - call: editor-groups.get-state
      as: st
    - if: vars.st.value.groups.exists(g, g.id != input.group_id && input.resource in g.editors)
      then:
      - title: Still opened in another group, no confirmation
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1748-1770
        return:
          veto: false
    - set:
        vars.native_win_linux: = !has(state.host_os) || state.host_os in ['linux', 'windows']
    - if: config['files-auto-save'] == 'onFocusChange' || (config['files-auto-save'] == 'onWindowChange' && vars.native_win_linux)
      then:
      - title: autoSave onFocusChange (or onWindowChange on native Windows and Linux, where the dialog itself changes window focus), save instead of asking
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1785-1798
        call: text-file-service.save
        input:
          resource: = input.resource
          options:
            reason: '= config[''files-auto-save''] == ''onFocusChange'' ? ''focus-change'' : ''window-change'' '
        as: autosaved
        on_error: continue
      - if: vars.autosaved.ok && !(has(vars.autosaved.value.saved) && !vars.autosaved.value.saved)
        then:
        - return:
            veto: false
    - title: Ask Save / Don't Save / Cancel
      source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1830-1833
      call: file-dialog-service.show-save-confirm
      input:
        file_names:
        - = input.resource
      as: confirm
    - call: text-file-models.get
      input:
        resource: = input.resource
      as: m2
      on_error: continue
    - if: '!(vars.m2.ok && ((has(vars.m2.value.model) && has(vars.m2.value.model.dirty) && vars.m2.value.model.dirty) || (has(vars.m2.value.dirty) && vars.m2.value.dirty)))'
      then:
      - title: No longer dirty after the dialog (shouldConfirmClose re-check), only Cancel vetoes
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1836-1845
        return:
          veto: = vars.confirm.value.choice == 'cancel'
    - if: vars.confirm.value.choice == 'save'
      then:
      - title: Save, veto when the save did not succeed
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1849-1860
        call: text-file-service.save
        input:
          resource: = input.resource
          options:
            reason: explicit
        as: saved
        on_error: continue
      - return:
          veto: = !vars.saved.ok || (has(vars.saved.value.saved) && !vars.saved.value.saved)
    - if: vars.confirm.value.choice == 'dont_save'
      then:
      - title: Don't save, revert (soft revert if the revert fails)
        source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1861-1879
        call: text-file-service.revert
        input:
          resource: = input.resource
        on_error:
        - call: text-file-service.revert
          input:
            resource: = input.resource
            options:
              soft: true
      - return:
          veto: false
    - title: Cancel vetoes the close
      source: src/vs/workbench/browser/parts/editor/editorGroupView.ts:1880-1881
      return:
        veto: true
  - component: editor-group-view
    name: close-editor
    kind: function
    summary: "EditorGroupView.closeEditor: run the close confirmation, then close (default: the active editor of the active group). Returns false on veto."
    sources: ["src/vs/workbench/browser/parts/editor/editorGroupView.ts:1558-1581"]
    request:
      type: object
      properties:
        group_id: {type: integer}
        resource: {type: string}
    response: {type: object, properties: {closed: {type: boolean}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.gid: "= has(input.group_id) ? input.group_id : vars.st.value.active_group"
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == vars.gid)[0]"
      - set:
          vars.r: "= has(input.resource) ? input.resource : vars.g.active"
      - if: "vars.r == null || !(vars.r in vars.g.editors)"
        then:
          - title: No editor to close
            source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1563-1565"
            return: {closed: false}
      - call: editor-group-view.handle-close-confirmation
        input: {group_id: "= vars.gid", resource: "= vars.r"}
        as: c
      - if: "vars.c.value.veto"
        then:
          - title: Vetoed, keep the editor open
            source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1572-1574"
            return: {closed: false}
      - call: editor-group-view.do-close-editors
        input: {group_id: "= vars.gid", resources: ["= vars.r"]}
      - return: {closed: true}
  - component: editor-group-view
    name: close-editors
    kind: function
    summary: "EditorGroupView.closeEditors with a filter (all, others except one, to the left/right of one, saved only; sticky editors excluded when asked) or an explicit list; confirms each dirty editor, any veto keeps them all."
    sources: ["src/vs/workbench/browser/parts/editor/editorGroupView.ts:1901-1945"]
    request:
      type: object
      properties:
        group_id: {type: integer}
        mode: {type: string, enum: [all, others, left, right, saved, list], default: all}
        except: {type: string}
        resources: {type: array, items: {type: string}}
        exclude_sticky: {type: boolean, default: false}
    response: {type: object, properties: {closed: {type: boolean}, count: {type: integer}}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.gid: "= has(input.group_id) ? input.group_id : vars.st.value.active_group"
          vars.mode: "= has(input.mode) ? input.mode : 'all'"
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == vars.gid)[0]"
      - set:
          vars.cands: "= vars.g.editors.filter(e, !(has(input.exclude_sticky) && input.exclude_sticky && e in vars.g.sticky))"
          vars.ex: "= has(input.except) ? input.except : vars.g.active"
      - if: "vars.mode == 'saved'"
        then:
          - title: Saved only, ask each editor's model whether it is dirty
            source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1928-1930"
            set: {vars.list: []}
          - foreach: "= vars.cands"
            as: e
            steps:
              - call: text-file-models.get
                input: {resource: "= vars.e"}
                as: mm
                on_error: continue
              - if: "!(vars.mm.ok && ((has(vars.mm.value.model) && has(vars.mm.value.model.dirty) && vars.mm.value.model.dirty) || (has(vars.mm.value.dirty) && vars.mm.value.dirty)))"
                then:
                  - set: {vars.list: "= vars.list + [vars.e]"}
        else:
          - title: Direction, except or explicit list
            source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1932-1941"
            set:
              vars.list: "= vars.mode == 'list' ? input.resources : (vars.mode == 'others' ? vars.cands.filter(e, e != vars.ex) : (vars.mode == 'left' ? vars.cands.slice(0, lists.range(size(vars.cands)).filter(i, vars.cands[i] == vars.ex)[0]) : (vars.mode == 'right' ? vars.cands.slice(lists.range(size(vars.cands)).filter(i, vars.cands[i] == vars.ex)[0] + 1, size(vars.cands)) : vars.cands)))"
      - if: "size(vars.list) == 0"
        then:
          - return: {closed: true, count: 0}
      - title: Confirm dirty editors one by one, the first veto stops
        source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1707-1736"
        foreach: "= vars.list"
        as: e
        steps:
          - call: editor-group-view.handle-close-confirmation
            input: {group_id: "= vars.gid", resource: "= vars.e"}
            as: c
          - if: "vars.c.value.veto"
            then:
              - return: {closed: false, count: 0}
      - call: editor-group-view.do-close-editors
        input: {group_id: "= vars.gid", resources: "= vars.list"}
      - return: {closed: true, count: "= size(vars.list)"}
  - component: editor-group-view
    name: do-close-editors
    kind: function
    summary: "EditorGroupView.doCloseEditors: close inactive editors first and the active one last, fire onDidCloseEditor for each, and remove the group when it is empty and workbench.editor.closeEmptyGroups is on."
    sources: ["src/vs/workbench/browser/parts/editor/editorGroupView.ts:1947-1972"]
    request:
      type: object
      required: [group_id, resources]
      properties:
        group_id: {type: integer}
        resources: {type: array, items: {type: string}}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == input.group_id)[0]"
          vars.batch: "= now"
      - set:
          vars.order: "= input.resources.filter(r, r != vars.g.active) + input.resources.filter(r, r == vars.g.active)"
      - foreach: "= vars.order"
        as: r
        steps:
          - call: editor-group-model.close-editor
            input: {group: "= vars.g", resource: "= vars.r"}
            as: cr
          - set: {vars.g: "= vars.cr.value.group"}
          - if: "vars.cr.value.closed"
            then:
              - publish: editor-service.on-did-close-editor
                delivery: sync
                input: {resource: "= vars.r", group_id: "= input.group_id", index: "= vars.cr.value.index", sticky: "= vars.cr.value.sticky", batch: "= vars.batch"}
      - call: editor-groups.put-group
        input: {group: "= vars.g"}
      - if: "size(vars.g.editors) == 0 && config['workbench-editor-close-empty-groups'] && size(vars.st.value.groups) > 1"
        then:
          - title: The group became empty, remove it
            source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1684-1687"
            call: editor-part.remove-group
            input: {group_id: "= input.group_id"}
      - return: {closed: "= size(vars.order)"}
  - component: editor-group-view
    name: set-editor-state
    kind: function
    summary: "EditorGroupView.pinEditor / stickEditor / unstickEditor / lock: pin turns the preview editor into a normal one; stick moves it to the sticky range; lock keeps other editors out of the group."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1128-1160"
      - "src/vs/workbench/browser/parts/editor/editorGroupView.ts:2126-2130"
    request:
      type: object
      required: [op]
      properties:
        group_id: {type: integer}
        resource: {type: string}
        op: {type: string, enum: [pin, stick, unstick, lock, unlock, toggle-lock]}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.gid: "= has(input.group_id) ? input.group_id : vars.st.value.active_group"
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == vars.gid)[0]"
      - set:
          vars.r: "= has(input.resource) ? input.resource : vars.g.active"
      - if: "(input.op in ['pin', 'stick', 'unstick']) && (vars.r == null || !(vars.r in vars.g.editors))"
        then:
          - return: {changed: false}
      - set:
          vars.ng: "= {'id': vars.g.id, 'editors': input.op == 'stick' && !(vars.r in vars.g.sticky) ? vars.g.sticky + [vars.r] + vars.g.editors.filter(e, !(e in vars.g.sticky) && e != vars.r) : (input.op == 'unstick' && vars.r in vars.g.sticky ? vars.g.sticky.filter(e, e != vars.r) + [vars.r] + vars.g.editors.filter(e, !(e in vars.g.sticky)) : vars.g.editors), 'active': vars.g.active, 'preview': (input.op in ['pin', 'stick']) && vars.g.preview == vars.r ? null : vars.g.preview, 'sticky': input.op == 'stick' && !(vars.r in vars.g.sticky) ? vars.g.sticky + [vars.r] : (input.op == 'unstick' ? vars.g.sticky.filter(e, e != vars.r) : vars.g.sticky), 'mru': vars.g.mru, 'locked': input.op == 'lock' ? true : (input.op == 'unlock' ? false : (input.op == 'toggle-lock' ? !vars.g.locked : vars.g.locked))}"
      - call: editor-groups.put-group
        input: {group: "= vars.ng"}
      - return: {changed: true}
  - component: editor-group-view
    name: move-editor
    kind: function
    summary: "EditorGroupView.moveEditor inside the group (to an index) or to another group (open there, close here); copyEditor keeps the source."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1420-1556"
    request:
      type: object
      required: [target_group_id]
      properties:
        group_id: {type: integer}
        resource: {type: string}
        target_group_id: {type: integer}
        index: {type: integer}
        copy: {type: boolean, default: false}
    behavior:
      - call: editor-groups.get-state
        as: st
      - set:
          vars.gid: "= has(input.group_id) ? input.group_id : vars.st.value.active_group"
      - set:
          vars.g: "= vars.st.value.groups.filter(g, g.id == vars.gid)[0]"
      - set:
          vars.r: "= has(input.resource) ? input.resource : vars.g.active"
      - if: "vars.r == null"
        then:
          - return: {moved: false}
      - if: "input.target_group_id == vars.gid"
        then:
          - title: Move inside the group to the clamped index
            source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1424-1440"
            set:
              vars.rest: "= vars.g.editors.filter(e, e != vars.r)"
              vars.ix: "= has(input.index) ? (input.index < 0 ? 0 : (input.index >= size(vars.g.editors) ? size(vars.g.editors) - 1 : input.index)) : 0"
          - call: editor-groups.put-group
            input:
              group: "= {'id': vars.g.id, 'editors': vars.rest.slice(0, vars.ix) + [vars.r] + vars.rest.slice(vars.ix, size(vars.rest)), 'active': vars.g.active, 'preview': vars.g.preview, 'sticky': vars.g.sticky, 'mru': vars.g.mru, 'locked': vars.g.locked}"
          - return: {moved: true}
      - title: Open the editor in the target group (pinned, as the code does for moved editors)
        source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1442-1500"
        call: editor-group-view.open-editor
        input: {group_id: "= input.target_group_id", resource: "= vars.r", options: {pinned: true}}
      - if: "!(has(input.copy) && input.copy)"
        then:
          - title: Close it in the source group (a move skips the close confirmation)
            source: "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1520-1530"
            call: editor-group-view.do-close-editors
            input: {group_id: "= vars.gid", resources: ["= vars.r"]}
      - return: {moved: true}

  # ---------------- history-service ----------------
  - component: history-service
    name: on-did-close-editor
    kind: event
    subscribe: [editor-service.on-did-close-editor]
    summary: "HistoryService.handleEditorCloseEventInReopen: remember the closed editor as most recently closed; editors closed in one operation share a batch; bounded to 20."
    sources: ["src/vs/workbench/services/history/browser/historyService.ts:671-716"]
    request: {type: object, properties: {resource: {type: string}, index: {type: integer}, sticky: {type: boolean}, batch: {type: integer}}}
    behavior:
      - set:
          vars.bid: "= input.batch == state.last_batch_key ? state.batch_id : state.batch_id + 1"
      - set:
          vars.list: "= state.recently_closed.filter(e, e.resource != input.resource) + [{'resource': input.resource, 'index': input.index, 'sticky': input.sticky, 'batch_id': vars.bid}]"
      - title: Remember as most recently closed, bounded to 20
        source: "src/vs/workbench/services/history/browser/historyService.ts:699-715"
        set:
          state.recently_closed: "= size(vars.list) > 20 ? vars.list.slice(size(vars.list) - 20, size(vars.list)) : vars.list"
          state.batch_id: "= vars.bid"
          state.last_batch_key: "= input.batch"
          state.history: "= [input.resource] + state.history.filter(e, e != input.resource)"
  - component: history-service
    name: reopen-last-closed-editor
    kind: function
    summary: "HistoryService.reopenLastClosedEditor: take the last batch of closed editors and reopen each pinned at its old index; an editor that is already open is skipped."
    sources: ["src/vs/workbench/services/history/browser/historyService.ts:737-800"]
    response: {type: object, properties: {reopened: {type: array, items: {type: string}}}}
    behavior:
      - if: "size(state.recently_closed) == 0"
        then:
          - title: Nothing to reopen
            source: "src/vs/workbench/services/history/browser/historyService.ts:753-756"
            return: {reopened: []}
      - set:
          vars.last: "= state.recently_closed[size(state.recently_closed) - 1].batch_id"
      - set:
          vars.batch: "= state.recently_closed.filter(e, e.batch_id == vars.last)"
          state.recently_closed: "= state.recently_closed.filter(e, e.batch_id != vars.last)"
      - title: Reopen each editor of the batch in closing order
        source: "src/vs/workbench/services/history/browser/historyService.ts:769-783"
        foreach: "= vars.batch"
        as: e
        steps:
          - call: editor-service.open-editor
            input: {resource: "= vars.e.resource", options: {pinned: true, sticky: "= vars.e.sticky"}}
      - return: {reopened: "= vars.batch.map(e, e.resource)"}
  - component: history-service
    name: clear
    kind: function
    summary: "HistoryService.clear / clearRecentlyOpened: drop the editor history and the recently closed editors."
    sources:
      - "src/vs/workbench/services/history/browser/historyService.ts:309-316"
      - "src/vs/workbench/services/history/browser/historyService.ts:1036-1040"
    behavior:
      - set:
          state.history: []
          state.recently_closed: []
      - return: {cleared: true}
  - component: history-service
    name: get-history
    kind: function
    summary: "HistoryService.getHistory: the editor history (most recent first) and the recently closed editors."
    sources: ["src/vs/workbench/services/history/browser/historyService.ts:1042-1046"]
    behavior:
      - return: {history: "= state.history", recently_closed: "= state.recently_closed.map(e, e.resource)"}

