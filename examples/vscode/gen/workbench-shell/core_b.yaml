components:
  - id: editor-service
    name: EditorService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IEditorService: opens, closes, saves and reverts editors across all editor groups of a window; resolves the target group and editor."
    sources:
      - "src/vs/workbench/services/editor/common/editorService.ts:17"
      - "src/vs/workbench/services/editor/browser/editorService.ts:1135"
      - "src/vs/workbench/services/editor/browser/editorService.ts:540-599"
  - id: editor-resolver-service
    name: EditorResolverService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IEditorResolverService: maps an untyped resource input to an editor (the default text editor unless an association or override picks another)."
    sources:
      - "src/vs/workbench/services/editor/common/editorResolverService.ts:25"
      - "src/vs/workbench/services/editor/browser/editorResolverService.ts:1026"
      - "src/vs/workbench/services/editor/browser/editorResolverService.ts:129-230"
  - id: editor-parts
    name: EditorParts
    kind: service
    layer: workbench
    parent: workbench
    summary: "IEditorGroupsService: the main editor part plus auxiliary and modal parts; forwards group operations to the active part."
    sources:
      - "src/vs/workbench/services/editor/common/editorGroupsService.ts:21"
      - "src/vs/workbench/browser/parts/editor/editorParts.ts:1042"
  - id: editor-part
    name: EditorPart
    kind: module
    layer: workbench
    parent: editor-parts
    summary: "The grid of editor groups: add, remove, merge, find and activate groups, apply layouts. Group state lives in the editor-groups anchor (groups kept in grid appearance order)."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorPart.ts:619-660"
      - "src/vs/workbench/browser/parts/editor/editorPart.ts:822-884"
      - "src/vs/workbench/browser/parts/editor/editorPart.ts:942-1010"
  - id: editor-group-view
    name: EditorGroupView
    kind: module
    layer: workbench
    parent: editor-part
    summary: "One editor group: decides pinned/preview on open, runs the close confirmation for dirty editors (save / don't save / cancel) and closes editors, removing the group when it becomes empty."
    sources:
      - "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1190-1260"
      - "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1558-1600"
      - "src/vs/workbench/browser/parts/editor/editorGroupView.ts:1738-1883"
  - id: editor-group-model
    name: EditorGroupModel
    kind: function
    layer: workbench
    parent: editor-group-view
    summary: "The pure list logic of a group: insert position (openPositioning), the single preview editor, sticky editors and the next active editor on close (MRU or neighbour)."
    sources:
      - "src/vs/workbench/common/editor/editorGroupModel.ts:290-420"
      - "src/vs/workbench/common/editor/editorGroupModel.ts:511-587"
  - id: history-service
    name: HistoryService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IHistoryService: recently closed editors (reopen, batched per close operation, bounded to 20) and the editor history (clear)."
    sources:
      - "src/vs/workbench/services/history/common/history.ts:12"
      - "src/vs/workbench/services/history/browser/historyService.ts:1272"
      - "src/vs/workbench/services/history/browser/historyService.ts:663-716"
    state:
      initial: {recently_closed: [], history: [], batch_id: 0, last_batch_key: -1}
  - id: file-dialog-service
    name: FileDialogService
    kind: service
    layer: workbench
    parent: workbench
    summary: "IFileDialogService: the save confirmation (Save / Don't Save / Cancel) shown when a dirty editor closes."
    sources:
      - "src/vs/platform/dialogs/common/dialogs.ts:536"
      - "src/vs/workbench/services/dialogs/browser/fileDialogService.ts:295"

interfaces:
  # ---------------- editor-groups anchor (state) ----------------
  - component: editor-groups
    name: get-state
    kind: function
    summary: "Read the groups of this window, normalised (missing preview/sticky/mru/locked filled in), the active group and the most-recently-active group order."
    sources: ["src/vs/workbench/services/editor/common/editorGroupsService.ts:21"]
    response:
      type: object
      properties:
        groups: {type: array, items: {$ref: WorkbenchEditorGroup}}
        active_group: {type: integer}
        group_mru: {type: array, items: {type: integer}}
        next_group_id: {type: integer}
    behavior:
      - return:
          groups: "= state.groups.map(g, {'id': g.id, 'editors': g.editors, 'active': ('active' in g) ? g.active : null, 'preview': ('preview' in g) ? g.preview : null, 'sticky': ('sticky' in g) ? g.sticky : [], 'locked': ('locked' in g) ? g.locked : false, 'mru': ('mru' in g) ? g.mru : ((('active' in g) && g.active != null) ? [g.active] + g.editors.filter(e, e != g.active) : g.editors)})"
          active_group: "= state.active_group"
          group_mru: "= ('group_mru' in state) ? state.group_mru : [state.active_group] + state.groups.map(g, g.id).filter(i, i != state.active_group)"
          next_group_id: "= ('next_group_id' in state) ? state.next_group_id : math.greatest(state.groups.map(g, g.id)) + 1"
  - component: editor-groups
    name: put-group
    kind: function
    summary: "Replace one group's model (editors, active, preview, sticky, MRU, lock)."
    sources: ["src/vs/workbench/common/editor/editorGroupModel.ts:1007"]
    request: {type: object, required: [group], properties: {group: {$ref: WorkbenchEditorGroup}}}
    behavior:
      - if: "!state.groups.exists(g, g.id == input.group.id)"
        then:
          - fail: {code: invalid-editor-group-provided, message: "Invalid editor group provided!"}
      - set:
          state.groups: "= state.groups.map(g, g.id == input.group.id ? input.group : g)"
      - return: {group_id: "= input.group.id"}
  - component: editor-groups
    name: insert-group
    kind: function
    summary: "Insert a new empty group next to a location group (before it for left/up, after it for right/down)."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:619-660"]
    request:
      type: object
      required: [group, location_id, before]
      properties:
        group: {$ref: WorkbenchEditorGroup}
        location_id: {type: integer}
        before: {type: boolean}
    behavior:
      - set:
          vars.ids: "= state.groups.map(g, g.id)"
      - set:
          vars.at: "= lists.range(size(vars.ids)).filter(i, vars.ids[i] == input.location_id)[0] + (input.before ? 0 : 1)"
      - set:
          state.groups: "= state.groups.slice(0, vars.at) + [input.group] + state.groups.slice(vars.at, size(state.groups))"
          state.next_group_id: "= input.group.id + 1"
          state.group_mru: "= (('group_mru' in state) ? state.group_mru : [state.active_group] + vars.ids.filter(i, i != state.active_group)) + [input.group.id]"
      - return: {group_id: "= input.group.id"}
  - component: editor-groups
    name: delete-group
    kind: function
    summary: "Remove a group from the grid; when it was active, the next most recently active group becomes active."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:858-884"]
    request: {type: object, required: [group_id], properties: {group_id: {type: integer}}}
    behavior:
      - set:
          vars.mru: "= (('group_mru' in state) ? state.group_mru : [state.active_group] + state.groups.map(g, g.id).filter(i, i != state.active_group)).filter(i, i != input.group_id)"
      - set:
          state.groups: "= state.groups.filter(g, g.id != input.group_id)"
          state.group_mru: "= vars.mru"
          state.active_group: "= state.active_group == input.group_id ? vars.mru[0] : state.active_group"
      - return: {active_group: "= state.active_group"}
  - component: editor-groups
    name: set-active-group
    kind: function
    summary: "Make a group the active group and move it to the front of the most-recently-active list (EditorPart.doSetGroupActive)."
    sources: ["src/vs/workbench/browser/parts/editor/editorPart.ts:743-790"]
    request: {type: object, required: [group_id], properties: {group_id: {type: integer}}}
    errors: [{code: invalid-editor-group-provided, status: 0, retryable: false}]
    behavior:
      - if: "!state.groups.exists(g, g.id == input.group_id)"
        then:
          - title: Unknown group
            source: "src/vs/workbench/browser/parts/editor/editorPart.ts:1023"
            fail: {code: invalid-editor-group-provided, message: "Invalid editor group provided!"}
      - set:
          state.group_mru: "= [input.group_id] + (('group_mru' in state) ? state.group_mru : state.groups.map(g, g.id)).filter(i, i != input.group_id)"
          state.active_group: "= input.group_id"
      - return: {active_group: "= input.group_id"}

  # ---------------- editor-group-model (pure list logic) ----------------
  - component: editor-group-model
    name: open-editor
    kind: function
    summary: "EditorGroupModel.openEditor: insert a new editor at the configured position or update an existing one; a non-pinned editor replaces the current preview editor."
    sources: ["src/vs/workbench/common/editor/editorGroupModel.ts:290-420"]
    request:
      type: object
      required: [group, resource, pinned, active]
      properties:
        group: {$ref: WorkbenchEditorGroup}
        resource: {type: string}
        pinned: {type: boolean}
        sticky: {type: boolean}
        active: {type: boolean}
        index: {type: integer}
    behavior:
      - set:
          vars.g: "= input.group"
          vars.sticky: "= has(input.sticky) && input.sticky"
      - set:
          vars.pinned: "= input.pinned || vars.sticky"
          vars.exists: "= input.resource in vars.g.editors"
      - set:
          vars.active: "= input.active || vars.g.active == null || (!vars.pinned && vars.g.preview != null && vars.g.preview == vars.g.active)"
      - if: "vars.exists"
        then:
          - title: Existing editor, pin it if asked and make it active
            source: "src/vs/workbench/common/editor/editorGroupModel.ts:404-420"
            set:
              vars.ng: "= {'id': vars.g.id, 'editors': vars.g.editors, 'active': vars.active ? input.resource : vars.g.active, 'preview': (vars.pinned && vars.g.preview == input.resource) ? null : vars.g.preview, 'sticky': (vars.sticky && !(input.resource in vars.g.sticky)) ? vars.g.sticky + [input.resource] : vars.g.sticky, 'mru': vars.active ? [input.resource] + vars.g.mru.filter(e, e != input.resource) : vars.g.mru, 'locked': vars.g.locked}"
          - return: {group: "= vars.ng", is_new: false}
      - set:
          vars.ia: "= vars.g.active == null ? -1 : lists.range(size(vars.g.editors)).filter(i, vars.g.editors[i] == vars.g.active)[0]"
          vars.ns: "= size(vars.g.sticky)"
          vars.pos: "= config['workbench-editor-open-positioning']"
      - title: Pick the insert position from workbench.editor.openPositioning
        source: "src/vs/workbench/common/editor/editorGroupModel.ts:303-345"
        set:
          vars.t0: "= has(input.index) ? input.index : (vars.pos == 'first' ? 0 : (vars.pos == 'last' ? size(vars.g.editors) : (vars.pos == 'left' ? (vars.ia <= 0 ? 0 : vars.ia) : vars.ia + 1)))"
      - set:
          vars.t1: "= vars.sticky ? vars.ns : ((!vars.sticky && vars.t0 < vars.ns) ? vars.ns : (vars.t0 > size(vars.g.editors) ? size(vars.g.editors) : vars.t0))"
      - if: "!vars.pinned && vars.g.preview != null"
        then:
          - title: Replace the existing preview editor with this one
            source: "src/vs/workbench/common/editor/editorGroupModel.ts:368-381"
            set:
              vars.ip: "= lists.range(size(vars.g.editors)).filter(i, vars.g.editors[i] == vars.g.preview)[0]"
              vars.rest: "= vars.g.editors.filter(e, e != vars.g.preview)"
          - set:
              vars.t2: "= vars.t1 > vars.ip ? vars.t1 - 1 : vars.t1"
          - set:
              vars.editors: "= vars.rest.slice(0, vars.t2) + [input.resource] + vars.rest.slice(vars.t2, size(vars.rest))"
              vars.mru0: "= vars.g.mru.filter(e, e != vars.g.preview)"
        else:
          - title: Insert the new editor into the list
            source: "src/vs/workbench/common/editor/editorGroupModel.ts:357-360"
            set:
              vars.editors: "= vars.g.editors.slice(0, vars.t1) + [input.resource] + vars.g.editors.slice(vars.t1, size(vars.g.editors))"
              vars.mru0: "= vars.g.mru"
      - set:
          vars.ng: "= {'id': vars.g.id, 'editors': vars.editors, 'active': vars.active ? input.resource : vars.g.active, 'preview': vars.pinned ? ((vars.g.preview != null && vars.g.preview in vars.editors) ? vars.g.preview : null) : input.resource, 'sticky': vars.sticky ? vars.g.sticky + [input.resource] : vars.g.sticky, 'mru': vars.active ? [input.resource] + vars.mru0 : vars.mru0 + [input.resource], 'locked': vars.g.locked}"
      - return: {group: "= vars.ng", is_new: true}
  - component: editor-group-model
    name: close-editor
    kind: function
    summary: "EditorGroupModel.closeEditor: remove an editor; when it was active pick the next active editor (MRU when focusRecentEditorAfterClose, else the right neighbour or the left one for the last tab)."
    sources: ["src/vs/workbench/common/editor/editorGroupModel.ts:511-587"]
    request:
      type: object
      required: [group, resource]
      properties:
        group: {$ref: WorkbenchEditorGroup}
        resource: {type: string}
    behavior:
      - set:
          vars.g: "= input.group"
      - if: "!(input.resource in vars.g.editors)"
        then:
          - return: {group: "= vars.g", closed: false, index: -1, sticky: false}
      - set:
          vars.idx: "= lists.range(size(vars.g.editors)).filter(i, vars.g.editors[i] == input.resource)[0]"
          vars.n: "= size(vars.g.editors)"
      - title: Pick the next active editor
        source: "src/vs/workbench/common/editor/editorGroupModel.ts:536-562"
        set:
          vars.next: "= vars.g.active != input.resource ? vars.g.active : (size(vars.g.mru) > 1 ? (config['workbench-editor-focus-recent-editor-after-close'] ? vars.g.mru.filter(e, e != input.resource)[0] : (vars.idx == vars.n - 1 ? vars.g.editors[vars.idx - 1] : vars.g.editors[vars.idx + 1])) : null)"
      - set:
          vars.ng: "= {'id': vars.g.id, 'editors': vars.g.editors.filter(e, e != input.resource), 'active': vars.next, 'preview': vars.g.preview == input.resource ? null : vars.g.preview, 'sticky': vars.g.sticky.filter(e, e != input.resource), 'mru': vars.next == null ? [] : [vars.next] + vars.g.mru.filter(e, e != input.resource && e != vars.next), 'locked': vars.g.locked}"
      - return: {group: "= vars.ng", closed: true, index: "= vars.idx", sticky: "= input.resource in vars.g.sticky"}
