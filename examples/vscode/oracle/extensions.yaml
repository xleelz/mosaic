schema_version: 1
id: vscode
scenarios:
- id: oracle-exthost-workspace-symbols-invalid-arguments
  name: vscode.executeWorkspaceSymbolProvider rejects a missing or non-string query
  description: "src/vs/workbench/api/test/browser/extHostApiCommands.test.ts:232 'WorkspaceSymbols, invalid arguments': executeCommand('vscode.executeWorkspaceSymbolProvider') with no argument, null, undefined or true must reject (ApiCommandArgument.String validation)."
  fixtures: [full-window]
  steps:
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    on: eh1
    as: none
    input: {command: vscode.executeWorkspaceSymbolProvider, extension_id: vscode.git, rest: []}
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    on: eh1
    as: nul
    input: {command: vscode.executeWorkspaceSymbolProvider, extension_id: vscode.git, rest: [null]}
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    on: eh1
    as: bool
    input: {command: vscode.executeWorkspaceSymbolProvider, extension_id: vscode.git, rest: [true]}
  expect:
  - "!steps.none.result.ok"
  - "!steps.nul.result.ok"
  - "!steps.bool.result.ok"
  # ApiCommand.execute validates the arguments in the extension host and throws before any RPC
  # (extHostCommands.ts:120-127), so the window's command service is never asked.
  - "!trace.exists(e, e.type == 'call.start' && e.interface == 'main-thread-commands.execute-command')"
- id: oracle-exthost-workspace-symbols-empty-query
  name: vscode.executeWorkspaceSymbolProvider accepts an empty query string
  description: "src/vs/workbench/api/test/browser/extHostApiCommands.test.ts:274 'executeWorkspaceSymbolProvider should accept empty string, #39522': with one workspace symbol provider registered, executeCommand('vscode.executeWorkspaceSymbolProvider', '') resolves (to its one symbol)."
  fixtures: [full-window]
  steps:
  - interface: vscode-api.languages-register-workspace-symbol-provider
    caller: third-party-extension
    on: eh1
    as: reg
    input: {extension_id: vscode.git, provider: {}}
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    on: eh1
    as: empty
    input: {command: vscode.executeWorkspaceSymbolProvider, extension_id: vscode.git, rest: ['']}
  expect:
  - "steps.reg.result.ok"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'main-thread-language-features.register-navigate-type-support' && e.instance == 'w1')"
  - "steps.empty.result.ok"

# 1. extHostDebugVisualization.test.ts
- id: oracle-exthost-debug-visualization-disposed
  description: "src/vs/workbench/api/test/browser/extHostDebugVisualization.test.ts:60 'does not call a disposed visualization provider': register a contributed provider, $provideDebugVisualizers calls it once; after dispose, $provideDebugVisualizers does not call it (calls == 1)."
  fixtures: [full-window]
  steps:
  - interface: vscode-api.debug-register-debug-visualization-provider
    caller: user
    'on': eh1
    as: reg
    input:
      id: visualizer
      extension_id: sample.visualizers
      debug_visualizers: [visualizer]
  - interface: ext-host-debug-service.provide-debug-visualizers
    caller: user
    'on': eh1
    as: first
    input:
      extension_id: sample.visualizers
      id: visualizer
      context: {sessionId: session, threadId: 1, variable: {name: value, value: '1', variablesReference: 0}}
  - interface: ext-host-debug-service.dispose-debug-visualization-provider
    caller: user
    'on': eh1
    as: dispose
    input:
      extension_id: sample.visualizers
      id: visualizer
  - interface: ext-host-debug-service.provide-debug-visualizers
    caller: user
    'on': eh1
    as: second
    input:
      extension_id: sample.visualizers
      id: visualizer
      context: {sessionId: session, threadId: 1, variable: {name: value, value: '1', variablesReference: 0}}
  expect:
  - steps.reg.result.ok
  - steps.first.result.ok && steps.second.result.ok
  - calls['third-party-extension.provide-debug-visualization'] == 1
- id: oracle-exthost-debug-visualization-reregister
  description: "src/vs/workbench/api/test/browser/extHostDebugVisualization.test.ts:72 'allows a visualization provider to register again after disposal': register, dispose, register again does not throw."
  fixtures: [full-window]
  steps:
  - interface: vscode-api.debug-register-debug-visualization-provider
    caller: user
    'on': eh1
    as: reg1
    input: {id: visualizer, extension_id: sample.visualizers, debug_visualizers: [visualizer]}
  - interface: ext-host-debug-service.dispose-debug-visualization-provider
    caller: user
    'on': eh1
    as: dispose
    input: {id: visualizer, extension_id: sample.visualizers}
  - interface: vscode-api.debug-register-debug-visualization-provider
    caller: user
    'on': eh1
    as: reg2
    input: {id: visualizer, extension_id: sample.visualizers, debug_visualizers: [visualizer]}
  expect:
  - steps.reg1.result.ok
  - steps.reg2.result.ok
# 2. mainThreadEditorTabs.test.ts
- id: oracle-exthost-editor-tabs-modal-label
  description: "src/vs/workbench/api/test/browser/mainThreadEditorTabs.test.ts:33 'ignores only missing modal editor label changes': with no editor groups and group 2 in the active modal part, an EDITOR_LABEL change for an unknown tab rebuilds nothing (0 groups reads), the following EDITOR_OPEN in that group rebuilds once (1 groups read)."
  fixtures: [full-window]
  state:
    editor-groups@w1:
      groups: []
      active_group: 2
      group_mru: []
      next_group_id: 3
  steps:
  - interface: main-thread-editor-tabs.create
    caller: user
    'on': w1
    as: init
  - interface: main-thread-editor-tabs.on-did-editors-change
    caller: user
    'on': w1
    as: label
    input: {group_id: 2, kind: editor-label, editor: 'test:modal', editor_index: 0, in_modal_part: true}
  - interface: main-thread-editor-tabs.on-did-editors-change
    caller: user
    'on': w1
    as: open
    input: {group_id: 2, kind: editor-open, editor: 'test:modal', editor_index: 0, in_modal_part: true}
  expect:
  - steps.init.result.ok && steps.label.result.ok && steps.open.result.ok
  # rebuildsAfterLabelChange == 0: no _createTabsModel (groups read) between the label event and the open event
  - >-
    trace.filter(e, e.type == 'call.start' && e.interface == 'main-thread-editor-tabs.create-tabs-model'
    && e.seq > trace.filter(x, x.type == 'call.start' && x.interface == 'main-thread-editor-tabs.on-did-editors-change')[0].seq
    && e.seq < trace.filter(x, x.type == 'call.start' && x.interface == 'main-thread-editor-tabs.on-did-editors-change')[1].seq).size() == 0
  # rebuildsAfterOpen == 1
  - >-
    trace.filter(e, e.type == 'call.start' && e.interface == 'main-thread-editor-tabs.create-tabs-model'
    && e.seq > trace.filter(x, x.type == 'call.start' && x.interface == 'main-thread-editor-tabs.on-did-editors-change')[1].seq).size() == 1
# 3. github.test.ts
- id: oracle-builtin-extensions-github-sessions-no-write-loop
  description: "extensions/github-authentication/src/test/github.test.ts:36 'does not loop when Codespaces secret storage drops hydrated account data': readSessions hydrates an accountless stored session with one GET /user (id, label, avatar icon, fallback authorization server) and never writes back (storeSessions not called), so no secret-change re-read loop."
  fixtures: [full-window]
  state:
    keychain:
      secrets:
        github.auth:
        - id: session-id
          scopes: [repo]
          access_token: access-token
    github-rest-api:
      tokens:
        access-token:
          id: account-id
          login: octocat
          avatar_url: https://avatars.githubusercontent.com/u/1
  steps:
  - interface: github-session-engine.read-sessions
    caller: user
    'on': eh1
    as: read
  expect:
  - steps.read.result.ok
  - steps.read.result.value.sessions[0].authorization_server == 'https://github.com/login/oauth'
  - steps.read.result.value.sessions[0].account.id == 'account-id'
  - steps.read.result.value.sessions[0].account.label == 'octocat'
  - steps.read.result.value.sessions[0].account.icon == 'https://avatars.githubusercontent.com/u/1'
  - calls['github-rest-api.get-user'] == 1
  - calls['github-session-engine.store-sessions'] == 0 && calls['keychain.set-token'] == 0
  - calls['github-session-engine.read-sessions'] == 1
# 4. outputMonitor.test.ts
- id: oracle-terminal-debug-tasks-output-monitor-polling-succeeds
  description: "src/vs/workbench/contrib/terminalContrib/chatAgentTools/test/browser/outputMonitor.test.ts:58 'startMonitoring returns immediately when polling succeeds': the execution's output changes after the first poll, isActive is false; the monitor finishes Idle with the changed (latest) output and never calls sendText."
  fixtures: [full-window]
  state:
    terminal-process-manager@w1:
      procs:
        '1': {output: test output}
  steps:
  - interface: output-monitor.start-monitoring
    caller: user
    'on': w1
    as: m
    input: {id: 1, command: test command, is_active: false}
    await: false
  - interface: local-pty.handle-data
    caller: user
    'on': w1
    at_ms: 1000
    input: {id: 1, data: ' changed'}
  expect:
  - steps.m.result.ok
  - steps.m.result.value.state == 'Idle'
  - steps.m.result.value.output == 'test output changed'
  - state['output-monitor@w1'].runs['1'].state == 'Idle'
  - calls['local-pty.input'] == 0 && calls['terminal-process.input'] == 0 && calls['pty-service.input'] == 0
- id: oracle-terminal-debug-tasks-output-monitor-cancelled
  description: "src/vs/workbench/contrib/terminalContrib/chatAgentTools/test/browser/outputMonitor.test.ts:75 'startMonitoring returns cancelled when token is cancelled': cancelling the token makes the polling result Cancelled."
  fixtures: [full-window]
  state:
    terminal-process-manager@w1:
      procs:
        '1': {output: test output}
  steps:
  - interface: output-monitor.start-monitoring
    caller: user
    'on': w1
    as: m
    input: {id: 1, command: test command, is_active: false}
    await: false
  - cancel: output-monitor
    at_ms: 0
  - interface: output-monitor.get-polling-result
    caller: user
    'on': w1
    as: p
    at_ms: 30000
    input: {id: 1}
  expect:
  - steps.p.result.value.state == 'Cancelled'
- id: oracle-terminal-debug-tasks-output-monitor-idle-inactive
  description: "src/vs/workbench/contrib/terminalContrib/chatAgentTools/test/browser/outputMonitor.test.ts:83 'startMonitoring returns idle when isActive is false': constant output, isActive false: the polling result is Idle."
  fixtures: [full-window]
  state:
    terminal-process-manager@w1:
      procs:
        '1': {output: test output}
  steps:
  - interface: output-monitor.start-monitoring
    caller: user
    'on': w1
    as: m
    input: {id: 1, command: test command, is_active: false}
  expect:
  - steps.m.result.value.state == 'Idle'
  - steps.m.result.value.output == 'test output'
# 5. terminalOutputCache.test.ts
- id: oracle-terminal-debug-tasks-output-cache-hit
  description: "src/vs/workbench/contrib/terminalContrib/chatAgentTools/test/browser/terminalOutputCache.test.ts:17 'lookup returns recorded value for a cacheable command': record git status in /repo with 'clean', lookup returns text 'clean'."
  fixtures: [full-window]
  steps:
  - interface: terminal-output-cache.record
    caller: user
    'on': w1
    as: r
    input: {tool_id: run_in_terminal, command: git status, cwd: /repo, text: clean}
  - interface: terminal-output-cache.lookup
    caller: user
    'on': w1
    as: l
    input: {tool_id: run_in_terminal, command: git status, cwd: /repo}
  expect:
  - steps.l.result.ok && steps.l.result.value.hit
  - steps.l.result.value.text == 'clean'
- id: oracle-terminal-debug-tasks-output-cache-cwd-keys
  description: "src/vs/workbench/contrib/terminalContrib/chatAgentTools/test/browser/terminalOutputCache.test.ts:25 'keys include cwd so same command in different cwd does not collide'."
  fixtures: [full-window]
  steps:
  - {interface: terminal-output-cache.record, caller: user, 'on': w1, input: {tool_id: run_in_terminal, command: git status, cwd: /a, text: A}}
  - {interface: terminal-output-cache.record, caller: user, 'on': w1, input: {tool_id: run_in_terminal, command: git status, cwd: /b, text: B}}
  - {interface: terminal-output-cache.lookup, caller: user, 'on': w1, as: la, input: {tool_id: run_in_terminal, command: git status, cwd: /a}}
  - {interface: terminal-output-cache.lookup, caller: user, 'on': w1, as: lb, input: {tool_id: run_in_terminal, command: git status, cwd: /b}}
  expect:
  - steps.la.result.value.text == 'A'
  - steps.lb.result.value.text == 'B'
- id: oracle-terminal-debug-tasks-output-cache-fast-expires
  description: "src/vs/workbench/contrib/terminalContrib/chatAgentTools/test/browser/terminalOutputCache.test.ts:33 'Fast class expires after 30s': record git status at t=1000, lookup at t=32000 misses."
  fixtures: [full-window]
  steps:
  - {interface: terminal-output-cache.record, caller: user, 'on': w1, at_ms: 1000, input: {tool_id: run_in_terminal, command: git status, cwd: /repo, text: A}}
  - {interface: terminal-output-cache.lookup, caller: user, 'on': w1, as: l, at_ms: 32000, input: {tool_id: run_in_terminal, command: git status, cwd: /repo}}
  expect:
  - steps.l.result.ok && !steps.l.result.value.hit
