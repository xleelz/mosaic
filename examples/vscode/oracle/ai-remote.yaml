# Oracle scenarios for the chat, agents and remote-server areas (see oracle/ai-remote.md).
# Tests that have no entity to drive in the model (missing) or are below the model's level have
# no scenario here; ai-remote.md explains each.
schema_version: 1
id: vscode
scenarios:
# --- agents ---------------------------------------------------------------------------------
- id: oracle-agents-bootstrap-renderer-byok-startup-markers
  description: >-
    src/vs/platform/agentHost/test/node/agentHostBootstrap.test.ts:37 'constructs the renderer BYOK
    runtime': createAgentHostRuntime builds the runtime, markStartupComplete('error'), listSessions and
    whenDeferredWorkSettled emit the bounded startup markers in order, all correlated to one
    agentHostSessionId, and the SDK downloader, checkpoint and review services resolve. The test calls
    createAgentHostRuntime (agentHostBootstrap.ts:109-251) without agentHostMain, so only its own
    markStartupComplete('error') (line 69) marks hostReady; the model has no interface for
    createAgentHostRuntime alone, and agents-agent-host-startup also runs agentHostMain's
    markStartupComplete(startupOutcome) (agentHostMain.ts:537-542).
  fixtures: [full-window, agents-seed]
  steps:
  # Round 2: the test builds the runtime alone (createAgentHostRuntime, agentHostBootstrap.ts:109-251),
  # without agentHostMain, so step 1 runs the runtime-only entry.
  - flow: agents-agent-host-runtime
    as: start
  # The test's own act (line 69): runtime.agentService.markStartupComplete('error').
  - interface: agent-service.mark-startup-complete
    caller: agent-host-main
    input: {outcome: error}
    as: ready
  - interface: agent-service.list-sessions
    caller: protocol-server-handler
    as: list
  expect:
  - steps.start.result.ok
  - steps.list.result.ok
  # Markers, in order, with their predecessor and outcome (test lines 85-97).
  - >-
    'agent-host-startup-performance' in state && has(state['agent-host-startup-performance'].marks) &&
    state['agent-host-startup-performance'].marks.map(m, m.name) == ['processStart', 'bootstrapStart',
    'configuration', 'telemetry', 'services', 'bootstrap', 'hostReady', 'sessionListStart', 'sessionList',
    'firstSessionList', 'startupSettled']
  - >-
    trace.exists(e, e.type == 'call.start' && e.interface == 'agent-host-startup-performance.mark'
    && e.input.name == 'hostReady' && e.input.outcome == 'error')
  - >-
    trace.exists(e, e.type == 'call.start' && e.interface == 'agent-host-startup-performance.mark'
    && e.input.name == 'startupSettled')

- id: oracle-agents-chat-pet-achievements-unlock
  description: >-
    src/vs/sessions/contrib/chat/test/browser/chatPetAchievements.test.ts:17 'unlocks Agents window and
    request achievements from shared contribution': SessionsChatPetAchievementContribution unlocks
    agentsWindowOpened on construction, then firstChatMessage and imageRequest when
    ISessionsManagementService.onDidSendRequest fires for a request with an image attachment.
  fixtures: [full-window, agents-seed]
  state:
    sessions-providers-service@w1:
      providers:
        local-agent-host:
          id: local-agent-host
          order: 0
          session_types:
          - copilotcli
  steps:
  - interface: sessions-chat-pet-achievement-contribution.start
    caller: user
    as: contrib
  - flow: agents-sessions-new-session
    as: new
  - flow: agents-sessions-send
    as: send
  expect:
  - steps.contrib.result.ok
  - steps.send.result.ok
  - "'chat-pet-service.unlock-achievement' in calls && calls['chat-pet-service.unlock-achievement'] == 3"
  - >-
    trace.filter(e, e.type == 'call.start' && e.interface == 'chat-pet-service.unlock-achievement')
    .map(e, e.input.id) == ['agentsWindowOpened', 'firstChatMessage', 'imageRequest']

# --- remote-server --------------------------------------------------------------------------
- id: oracle-remote-server-connection-token-no-args-mandatory
  description: >-
    src/vs/server/test/node/serverConnectionToken.test.ts:26 'no arguments generates a token that is
    mandatory': parseServerConnectionToken({}) generates a default token and returns a
    MandatoryServerConnectionToken, so a request without that token is refused. No
    --connection-token/--connection-token-file/--without-connection-token is given, so the agent
    server is seeded with no configured token; the generated one must still gate requests.
  fixtures: [full-window]
  state:
    remote-extension-host-agent-server:
      management_connections: {}
      ext_host_connections: {}
      all_reconnection_tokens: {}
      connection_token: ''
      commit: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
  steps:
  - flow: rs-remote-server-http-request
    input:
      method: GET
      path: /vscode-remote-resource
      tkn: ''
      resource_paths: [/home/user/project/README.md]
    as: req
  expect:
  - "!steps.req.result.ok"
  - steps.req.result.error.code == 'forbidden'
  - steps.req.result.error.status == 403

- id: oracle-remote-server-allowed-extensions-star-allows-all
  description: >-
    src/vs/platform/extensionManagement/test/common/allowedExtensionsService.test.ts:29 'should allow
    all extensions if no allowed extensions are configured': extensions.allowed = '*' makes
    AllowedExtensionsService.isAllowed({id: 'test.extension'}) true.
  fixtures: [full-window]
  config:
    extensions-allowed: '*'
  steps:
  - interface: allowed-extensions-service.is-allowed
    caller: user
    input:
      id: test.extension
      publisher: test
    as: check
  expect:
  - steps.check.result.ok
  - steps.check.result.value.allowed == true

- id: oracle-remote-server-allowed-extensions-not-in-list
  description: >-
    src/vs/platform/extensionManagement/test/common/allowedExtensionsService.test.ts:34 'should not
    allow specific extension if not in allowed list': extensions.allowed = {'test.extension': false}
    makes isAllowed({id: 'test.extension'}) not true.
  fixtures: [full-window]
  config:
    extensions-allowed:
      test.extension: false
  steps:
  - interface: allowed-extensions-service.is-allowed
    caller: user
    input:
      id: test.extension
      publisher: test
    as: check
  expect:
  - steps.check.result.ok
  - steps.check.result.value.allowed == false

- id: oracle-remote-server-allowed-extensions-in-list
  description: >-
    src/vs/platform/extensionManagement/test/common/allowedExtensionsService.test.ts:40 'should allow
    specific extension if in allowed list': extensions.allowed = {'test.extension': true} makes
    isAllowed({id: 'test.extension'}) true.
  fixtures: [full-window]
  config:
    extensions-allowed:
      test.extension: true
  steps:
  - interface: allowed-extensions-service.is-allowed
    caller: user
    input:
      id: test.extension
      publisher: test
    as: check
  expect:
  - steps.check.result.ok
  - steps.check.result.value.allowed == true

