- id: oracle-agents-sandbox-toggle-state
  description: "src/vs/platform/agentHost/test/browser/agentHostSandboxToggle.test.ts:69 (parameterized getAgentHostSandboxToggleState cases, lines 13-62) and :72 'collapsed controls prefer the confirmed state while a session change is pending'."
  fixtures: [full-window]
  steps:
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c1, input: {provider: copilotcli, session_enabled: false, global_enabled: false, managed_enabled: true, allows_bypass: false}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c2, input: {provider: copilotcli, global_enabled: false, managed_enabled: true, allows_bypass: false}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c3, input: {provider: copilotcli, session_enabled: false, global_enabled: true, managed_enabled: true, allows_bypass: true}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c4, input: {provider: copilotcli, session_enabled: false, confirmed_enabled: false, global_enabled: true, managed_enabled: true, allows_bypass: true}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c5, input: {provider: copilotcli, session_enabled: false, confirmed_enabled: false, global_enabled: true, managed_enabled: true, allows_bypass: false}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c6, input: {provider: copilotcli, session_enabled: true, global_enabled: false, managed_enabled: false, allows_bypass: false}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c7, input: {provider: copilotcli, session_enabled: false, global_enabled: true, managed_enabled: false, allows_bypass: false}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c8, input: {provider: copilotcli, global_enabled: false, managed_enabled: true, allows_bypass: true}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c9, input: {provider: copilotcli, global_enabled: true, managed_enabled: false, allows_bypass: false}}
  - {interface: agent-host-sandbox-toggle.get-toggle-state, caller: user, as: c10, input: {provider: copilotcli, global_enabled: false, managed_enabled: false, allows_bypass: true}}
  - {interface: agent-host-sandbox-toggle.get-collapsed-state, caller: user, as: off_req, input: {provider: copilotcli, global_enabled: true, managed_enabled: true, allows_bypass: true, session_enabled: false, confirmed_enabled: true, apply_failed: true}}
  - {interface: agent-host-sandbox-toggle.get-collapsed-state, caller: user, as: on_req, input: {provider: copilotcli, global_enabled: true, managed_enabled: true, allows_bypass: true, session_enabled: true, confirmed_enabled: false, apply_failed: true}}
  - {interface: agent-host-sandbox-toggle.get-collapsed-state, caller: user, as: unconfirmed, input: {provider: copilotcli, global_enabled: true, managed_enabled: true, allows_bypass: true, session_enabled: false}}
  expect:
  - steps.c1.result.value.checked == true && steps.c1.result.value.disabled == true
  - steps.c2.result.value.checked == true && steps.c2.result.value.disabled == true
  - steps.c3.result.value.checked == false && steps.c3.result.value.disabled == false
  - steps.c4.result.value.checked == false && steps.c4.result.value.disabled == false
  - steps.c5.result.value.checked == true && steps.c5.result.value.disabled == true
  - steps.c6.result.value.checked == true && steps.c6.result.value.disabled == false
  - steps.c7.result.value.checked == false && steps.c7.result.value.disabled == false
  - steps.c8.result.value.checked == true && steps.c8.result.value.disabled == false
  - steps.c9.result.value.checked == true && steps.c9.result.value.disabled == false
  - steps.c10.result.value.checked == false && steps.c10.result.value.disabled == false
  - steps.off_req.result.value.checked == true
  - steps.on_req.result.value.checked == false
  - steps.unconfirmed.result.value.checked == false
