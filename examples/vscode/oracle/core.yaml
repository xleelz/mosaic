# Oracle scenarios for platform-core, main-process and workbench-shell (see oracle/core.md).
# Tests with no model entity to drive (snap env, onboarding handoff, configuration resolver)
# and untranslatable tests have no scenario here; core.md explains each.
schema_version: 1
id: vscode
scenarios:
- id: oracle-main-process-agents-window-new-window-reveal-omitted
  name: Opening a new Agents window sends vscode:selectAgentsFolder even without a reveal
  description: >-
    src/vs/platform/windows/test/electron-main/agentsWindow.test.ts:33, suite 'Agents window reveal
    intent', test 'new window with reveal omitted' (initiallyOpen=false, reveal=undefined). Code under
    test: sendAgentsWindowOpenIntent (src/vs/platform/windows/electron-main/agentsWindow.ts:15-28),
    reached from NativeHostMainService.openAgentsWindow -> WindowsMainService.openAgentsWindow
    (windowsMainService.ts:296-306). A new window (not existing) always receives one
    vscode:selectAgentsFolder message carrying folder, reveal, source, folderUriIsDefault, draft.
  fixtures: [full-window]
  steps:
  - as: open
    interface: native-host-main-service.open-agents-window
    caller: user
    input: {source: titleBar}
  expect:
  - steps.open.result.ok
  - calls['windows-main-service.open-agents-window'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'windows-main-service.open-agents-window')

- id: oracle-workbench-shell-account-policy-default-account
  name: A default account without policy data sets no policy values
  description: >-
    src/vs/workbench/services/policies/test/browser/accountPolicyService.test.ts:269, suite
    'AccountPolicyService', test 'should initialize with default account' (assertDefaultBehavior,
    lines 238-266). Code under test: AccountPolicyService._updatePolicyDefinitions
    (src/vs/workbench/services/policies/common/accountPolicyService.ts:127-135, 168-211) over the
    default account's policy data, consumed by PolicyConfiguration (configurations.ts:232-302).
    Acts (lines 239-242): setDefaultAccountProvider(BASE_DEFAULT_ACCOUNT, undefined) - the provider's
    policyData parameter defaults to {} (line 58) - then defaultAccountService.refresh() and
    policyConfiguration.initialize(). Asserts (lines 245-264): getPolicyValue is undefined for every
    policy and the policy configuration model holds no value. The model's policy definitions
    (ChatAgentMode, ChatHooks, McpGalleryServiceUrl) stand in for PolicySettingA..D.
  fixtures: [full-window]
  steps:
  - as: refresh
    flow: workbench-shell-account-policy
    input: {signed_in: true, policy_data: {}}
  - as: a
    interface: account-policy-service.get-policy-value
    caller: user
    input: {name: ChatAgentMode}
  - as: b
    interface: account-policy-service.get-policy-value
    caller: user
    input: {name: ChatHooks}
  - as: c
    interface: account-policy-service.get-policy-value
    caller: user
    input: {name: McpGalleryServiceUrl}
  expect:
  - steps.refresh.result.ok
  - steps.a.result.value.value == null && steps.b.result.value.value == null && steps.c.result.value.value == null
  - state['account-policy-service@w1'].policies == {}
  - >-
    !has(state['configuration-service@w1'].policy) ||
    ['chat.agent.enabled', 'chat.useHooks', 'chat.mcp.gallery.serviceUrl'].all(k, !(k in state['configuration-service@w1'].policy))

  # ---------------------------------------------------------------- onboarding tryout handoff
- id: oracle-main-process-onboarding-tryout-open-complete
  name: open() goes through openAgentsWindow, focuses the one window, delivers only vscode:runOnboardingTryout, and resolves with complete()'s result
  description: "src/vs/platform/onboarding/test/electron-main/onboardingTryoutHandoff.test.ts:42 'opens through the existing window service and delivers only an ephemeral request'. Source window 42 -> w1; the Agents window (id 7) is whatever openAgentsWindow returns."
  fixtures: [full-window]
  topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
  steps:
    - {interface: onboarding-tryout-handoff.open, caller: user, as: open, await: false, input: {window_id: w1, request_id: "01234567-89ab-4cde-8fab-0123456789ab", tryout_id: test.agentsExample, source: releaseNotes}}
    - {interface: onboarding-tryout-handoff.complete, caller: user, as: done, at_ms: 2000, input: {window_id: w2, request_id: "01234567-89ab-4cde-8fab-0123456789ab", result: accepted}}
  expect:
    # result: 'accepted'
    - "steps.open.result.ok && steps.open.result.value.result == 'accepted'"
    # calls: [[{context: API, contextWindowId: 42, cli}]] (exactly one openAgentsWindow from the handoff)
    - "trace.filter(e, e.type == 'call.start' && e.interface == 'windows-main-service.open-agents-window').size() == 1"
    - "trace.exists(e, e.type == 'call.start' && e.interface == 'windows-main-service.open-agents-window' && e.component == 'onboarding-tryout-handoff' && e.input.context == 'api' && e.input.context_window_id == 'w1')"
    # requests: exactly [{channel: 'vscode:runOnboardingTryout', args: [request]}] sent to the destination
    - "trace.filter(e, e.type == 'call.start' && e.interface == 'code-window.send-when-ready' && e.component == 'onboarding-tryout-handoff').size() == 1"
    - "trace.exists(e, e.type == 'call.start' && e.interface == 'code-window.send-when-ready' && e.component == 'onboarding-tryout-handoff' && e.input.window_id == 'w2' && e.input.channel == 'vscode:runOnboardingTryout' && e.input.args.request_id == '01234567-89ab-4cde-8fab-0123456789ab' && e.input.args.tryout_id == 'test.agentsExample' && e.input.args.source == 'releaseNotes')"
    # focusCount: 1 (the handoff focuses the destination once)
    - "trace.filter(e, e.type == 'call.start' && e.interface == 'windows-main-service.focus' && e.component == 'onboarding-tryout-handoff' && e.input.window_id == 'w2').size() == 1"
    - "steps.done.result.ok && size(state['onboarding-tryout-handoff'].pending) == 0"

- id: oracle-main-process-onboarding-tryout-source-dest-only
  name: Only the source may cancel and only the destination may acknowledge
  description: "src/vs/platform/onboarding/test/electron-main/onboardingTryoutHandoff.test.ts:86 'only the source may cancel and only the destination may acknowledge'. Source 42 -> w1, other source 43 -> w3, destination 7 -> w2, destination+1 -> w1."
  fixtures: [full-window]
  topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
  steps:
    - {interface: onboarding-tryout-handoff.open, caller: user, as: open, await: false, input: {window_id: w1, request_id: "01234567-89ab-4cde-8fab-0123456789ab", tryout_id: test.agentsExample, source: releaseNotes}}
    - {interface: onboarding-tryout-handoff.cancel, caller: user, as: wrongcancel, at_ms: 2000, input: {window_id: w3, request_id: "01234567-89ab-4cde-8fab-0123456789ab"}}
    - {interface: onboarding-tryout-handoff.complete, caller: user, as: wrongack, at_ms: 2100, input: {window_id: w1, request_id: "01234567-89ab-4cde-8fab-0123456789ab", result: accepted}}
    - {interface: onboarding-tryout-handoff.complete, caller: user, as: ack, at_ms: 2200, input: {window_id: w2, request_id: "01234567-89ab-4cde-8fab-0123456789ab", result: rejected}}
  expect:
    # settledByWrongWindow: false
    - "!steps.wrongcancel.result.value.cancelled && !steps.wrongack.result.value.completed"
    - "!trace.exists(e, e.type == 'call.start' && e.interface == 'onboarding-tryout-handoff.cancel-pending-request')"
    # result: 'rejected'
    - "steps.open.result.ok && steps.open.result.value.result == 'rejected'"

# ---------------------------------------------------------------- snap environment
- id: oracle-main-process-snap-env-unset-restore-linux
  name: On Linux unset replaces snap values with their originals (deleting empty ones) and restore puts the snap values back
  description: "src/vs/platform/environment/test/electron-main/environmentMainService.test.ts:13 'can unset and restore snap env variables' (isLinux branch)."
  fixtures: [full-window]
  state:
    environment-main-service:
      platform: linux
      snap_env: {}
      env: {TEST_ARG1_VSCODE_SNAP_ORIG: original, TEST_ARG1: modified, TEST_ARG2_SNAP: test_arg2, TEST_ARG3_VSCODE_SNAP_ORIG: "", TEST_ARG3: test_arg3_non_empty}
  steps:
    - {interface: environment-main-service.unset-snap-exported-variables, caller: user, as: unset}
    - {interface: environment-main-service.restore-snap-exported-variables, caller: user, as: restore}
  expect:
    - "steps.unset.result.value.env.TEST_ARG1 == 'original' && !('TEST_ARG2' in steps.unset.result.value.env) && steps.unset.result.value.env.TEST_ARG1_VSCODE_SNAP_ORIG == 'original' && steps.unset.result.value.env.TEST_ARG2_SNAP == 'test_arg2' && steps.unset.result.value.env.TEST_ARG3_VSCODE_SNAP_ORIG == '' && !('TEST_ARG3' in steps.unset.result.value.env)"
    - "state['environment-main-service'].env.TEST_ARG1 == 'modified' && state['environment-main-service'].env.TEST_ARG1_VSCODE_SNAP_ORIG == 'original' && state['environment-main-service'].env.TEST_ARG2_SNAP == 'test_arg2' && !('TEST_ARG2' in state['environment-main-service'].env) && state['environment-main-service'].env.TEST_ARG3_VSCODE_SNAP_ORIG == '' && state['environment-main-service'].env.TEST_ARG3 == 'test_arg3_non_empty'"

- id: oracle-main-process-snap-env-unset-restore-not-linux
  name: Outside Linux unset and restore leave the environment untouched
  description: "src/vs/platform/environment/test/electron-main/environmentMainService.test.ts:13 'can unset and restore snap env variables' (non-Linux branch)."
  fixtures: [full-window]
  state:
    environment-main-service:
      platform: darwin
      snap_env: {}
      env: {TEST_ARG1_VSCODE_SNAP_ORIG: original, TEST_ARG1: modified, TEST_ARG2_SNAP: test_arg2, TEST_ARG3_VSCODE_SNAP_ORIG: "", TEST_ARG3: test_arg3_non_empty}
  steps:
    - {interface: environment-main-service.unset-snap-exported-variables, caller: user, as: unset}
    - {interface: environment-main-service.restore-snap-exported-variables, caller: user, as: restore}
  expect:
    - "steps.unset.result.value.env.TEST_ARG1 == 'modified' && !('TEST_ARG2' in steps.unset.result.value.env) && steps.unset.result.value.env.TEST_ARG1_VSCODE_SNAP_ORIG == 'original' && steps.unset.result.value.env.TEST_ARG2_SNAP == 'test_arg2' && steps.unset.result.value.env.TEST_ARG3_VSCODE_SNAP_ORIG == '' && steps.unset.result.value.env.TEST_ARG3 == 'test_arg3_non_empty'"
    - "state['environment-main-service'].env.TEST_ARG1 == 'modified' && state['environment-main-service'].env.TEST_ARG1_VSCODE_SNAP_ORIG == 'original' && state['environment-main-service'].env.TEST_ARG2_SNAP == 'test_arg2' && !('TEST_ARG2' in state['environment-main-service'].env) && state['environment-main-service'].env.TEST_ARG3_VSCODE_SNAP_ORIG == '' && state['environment-main-service'].env.TEST_ARG3 == 'test_arg3_non_empty'"

- id: oracle-main-process-snap-env-repeated
  name: Unset three times, restore twice and unset again on Linux are idempotent
  description: "src/vs/platform/environment/test/electron-main/environmentMainService.test.ts:60 'can invoke unsetSnapExportedVariables and restoreSnapExportedVariables multiple times' (isLinux branch)."
  fixtures: [full-window]
  state:
    environment-main-service:
      platform: linux
      snap_env: {}
      env: {SNAP: "1", SNAP_REVISION: test_revision, TEST_ARG1_VSCODE_SNAP_ORIG: original, TEST_ARG1: modified, TEST_ARG2_SNAP: test_arg2, TEST_ARG3_VSCODE_SNAP_ORIG: "", TEST_ARG3: test_arg3_non_empty}
  steps:
    - {interface: environment-main-service.unset-snap-exported-variables, caller: user, as: u1}
    - {interface: environment-main-service.unset-snap-exported-variables, caller: user, as: u2}
    - {interface: environment-main-service.unset-snap-exported-variables, caller: user, as: u3}
    - {interface: environment-main-service.restore-snap-exported-variables, caller: user, as: r1}
    - {interface: environment-main-service.restore-snap-exported-variables, caller: user, as: r2}
    - {interface: environment-main-service.unset-snap-exported-variables, caller: user, as: u4}
  expect:
    - "steps.u3.result.value.env.TEST_ARG1 == 'original' && !('TEST_ARG2' in steps.u3.result.value.env) && steps.u3.result.value.env.TEST_ARG1_VSCODE_SNAP_ORIG == 'original' && steps.u3.result.value.env.TEST_ARG2_SNAP == 'test_arg2' && steps.u3.result.value.env.TEST_ARG3_VSCODE_SNAP_ORIG == '' && !('TEST_ARG3' in steps.u3.result.value.env)"
    - "steps.r2.result.ok"
    - "steps.u4.result.value.env.TEST_ARG1 == 'original' && !('TEST_ARG2' in steps.u4.result.value.env) && steps.u4.result.value.env.TEST_ARG1_VSCODE_SNAP_ORIG == 'original' && steps.u4.result.value.env.TEST_ARG2_SNAP == 'test_arg2' && steps.u4.result.value.env.TEST_ARG3_VSCODE_SNAP_ORIG == '' && !('TEST_ARG3' in steps.u4.result.value.env)"
    - "state['environment-main-service'].env.TEST_ARG1 == 'original' && !('TEST_ARG3' in state['environment-main-service'].env) && state['environment-main-service'].snap_env.TEST_ARG1 == 'modified' && state['environment-main-service'].snap_env.TEST_ARG3 == 'test_arg3_non_empty'"

# ---------------------------------------------------------------- configuration resolver
- id: oracle-workbench-shell-resolve-workspace-folder
  name: resolveAsync substitutes ${workspaceFolder} with the folder path
  description: "src/vs/workbench/services/configurationResolver/test/electron-browser/configurationResolverService.test.ts:95 'substitute one' (non-Windows)."
  fixtures: [full-window]
  state:
    "workspace-context@w1": {folders: ["file:///VSCode/workspaceLocation"], trusted: true}
    "editor-groups@w1": {groups: [{id: 1, editors: ["file:///VSCode/workspaceLocation/file"], active: "file:///VSCode/workspaceLocation/file"}], active_group: 1}
  steps:
    - {interface: configuration-resolver-service.resolve-async, caller: user, on: w1, as: r, input: {folder_uri: "file:///VSCode/workspaceLocation", value: "abc ${workspaceFolder} xyz"}}
  expect:
    - "steps.r.result.ok && steps.r.result.value.value == 'abc /VSCode/workspaceLocation xyz'"

- id: oracle-workbench-shell-resolve-workspace-folder-arg
  name: resolveAsync substitutes ${workspaceFolder:name} by folder name
  description: "src/vs/workbench/services/configurationResolver/test/electron-browser/configurationResolverService.test.ts:147 'workspace folder with argument' (non-Windows)."
  fixtures: [full-window]
  state:
    "workspace-context@w1": {folders: ["file:///VSCode/workspaceLocation"], trusted: true}
    "editor-groups@w1": {groups: [{id: 1, editors: ["file:///VSCode/workspaceLocation/file"], active: "file:///VSCode/workspaceLocation/file"}], active_group: 1}
  steps:
    - {interface: configuration-resolver-service.resolve-async, caller: user, on: w1, as: r, input: {folder_uri: "file:///VSCode/workspaceLocation", value: "abc ${workspaceFolder:workspaceLocation} xyz"}}
  expect:
    - "steps.r.result.ok && steps.r.result.value.value == 'abc /VSCode/workspaceLocation xyz'"

- id: oracle-workbench-shell-resolve-workspace-folder-invalid-arg
  name: resolveAsync rejects ${workspaceFolder:unknown}
  description: "src/vs/workbench/services/configurationResolver/test/electron-browser/configurationResolverService.test.ts:155 'workspace folder with invalid argument'."
  fixtures: [full-window]
  state:
    "workspace-context@w1": {folders: ["file:///VSCode/workspaceLocation"], trusted: true}
    "editor-groups@w1": {groups: [{id: 1, editors: ["file:///VSCode/workspaceLocation/file"], active: "file:///VSCode/workspaceLocation/file"}], active_group: 1}
  steps:
    - {interface: configuration-resolver-service.resolve-async, caller: user, on: w1, as: r, input: {folder_uri: "file:///VSCode/workspaceLocation", value: "abc ${workspaceFolder:invalidLocation} xyz"}}
  expect:
    - "!steps.r.result.ok"
