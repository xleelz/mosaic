schema_version: 1
id: vscode
scenarios:
- id: oracle-files-search-scm-autosave-after-short-delay
  description: >-
    src/vs/workbench/contrib/files/test/browser/editorAutoSave.test.ts 'editor auto saves after short
    delay if configured': with files.autoSave=afterDelay and autoSaveDelay=1, resolving a text file
    model and setting its value makes it dirty, and EditorAutoSave saves it so it ends not dirty.
  fixtures: [full-window]
  config:
    files-auto-save: afterDelay
    files-auto-save-delay: 1
  steps:
  - interface: text-file-models.resolve
    caller: user
    input: {resource: 'file:///work/app/src/main.ts'}
    as: resolve
  - interface: text-model.apply-edits
    caller: user
    input:
      uri: 'file:///work/app/src/main.ts'
      edits:
      - {range: {start_line: 1, start_column: 1, end_line: 3, end_column: 1}, text: Super Good}
    as: set
  expect:
  - steps.resolve.result.ok && steps.set.result.ok && steps.set.result.value.changed
  - "trace.exists(e, e.type == 'call.end' && e.interface == 'text-file-models.on-model-content-changed' && e.output.dirty == true)"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save' && e.input.options.reason == 'auto').size() == 1"
  - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
  - "state['text-model@w1'].models['file:///work/app/src/main.ts'].value == 'Super Good'"
  - "state.disk.files['file:///work/app/src/main.ts'].content == 'Super Good'"
- id: oracle-files-search-scm-create-no-encoding-empty
  description: >-
    src/vs/workbench/services/textfile/test/common/textFileService.io.test.ts 'create - no encoding -
    content empty': ITextFileService.create([{resource}]) without a value writes a new file with 0 bytes
    (no BOM), read back through the file service.
  fixtures: [full-window]
  steps:
  - interface: text-file-service.create
    caller: user
    input: {resource: 'file:///work/app/small_new.txt'}
    as: create
  - interface: file-service.read-file
    caller: user
    input: {resource: 'file:///work/app/small_new.txt'}
    as: read
  expect:
  - steps.create.result.ok
  - steps.read.result.ok && steps.read.result.value.size == 0 && steps.read.result.value.value == ''
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'file-service.create-file' && e.input.resource == 'file:///work/app/small_new.txt')"
- id: oracle-files-search-scm-create-no-encoding-content-string
  description: >-
    src/vs/workbench/services/textfile/test/common/textFileService.io.test.ts 'create - no encoding -
    content provided (string)': ITextFileService.create([{resource, value: 'Hello World'}]) writes the
    value, so the file reads back as 'Hello World' with 11 bytes.
  fixtures: [full-window]
  steps:
  - interface: text-file-service.create
    caller: user
    input: {resource: 'file:///work/app/small_new.txt', value: Hello World}
    as: create
  - interface: file-service.read-file
    caller: user
    input: {resource: 'file:///work/app/small_new.txt'}
    as: read
  expect:
  - steps.create.result.ok
  - steps.read.result.ok && steps.read.result.value.value == 'Hello World'
  - steps.read.result.ok && steps.read.result.value.size == 11
  - "state.disk.files['file:///work/app/small_new.txt'].content == 'Hello World'"
- id: oracle-files-search-scm-text-search-fixes-encoding
  description: >-
    src/vs/workbench/services/search/test/node/textSearchManager.test.ts:16 'fixes encoding':
    NativeTextSearchManager.search (node/textSearchManager.ts:12-19, common/textSearchManager.ts:49-102,
    223) hands the provider folderOptions whose encoding is the canonical name of the folder query's
    fileEncoding ('windows1252' becomes 'windows-1252'). The test builds the manager directly over
    one folder query (lines 26-37); the step drives text-search-manager.search the same way, and
    its provider is the model's real one (RipgrepTextSearchEngine) instead of the test's stub.
  fixtures: [full-window]
  steps:
  - interface: text-search-manager.search
    caller: user
    input:
      query:
        pattern: a
        folders: ['file:///some/folder']
        folder_queries: [{folder: 'file:///some/folder', file_encoding: windows1252}]
    as: search
  expect:
  - steps.search.result.ok
  - >-
    trace.exists(e, e.type == 'call.start' && e.interface == 'ripgrep-text-search-engine.provide-text-search-results'
    && e.input.options.folder_options[0].encoding == 'windows-1252')
- id: oracle-editor-eol-setting-respected-by-root
  description: >-
    src/vs/editor/test/common/services/modelService.test.ts 'EOL setting respected depending on root':
    with files.eol '\n' for the user and '\r\n' for resources under /myroot, ModelService.createModel
    gives a model under /myroot defaultEOL CRLF and models elsewhere (or without a resource) LF.
    Setup (test lines 35-37): user files.eol '\n', and a resource-scoped files.eol '\r\n' for /myroot,
    seeded as the real WorkspaceService sees it: /myroot is a workspace folder whose folder settings
    set files.eol. model1 has no resource in the test (line 52); 'inmemory://model/1' lies under no
    folder, so it reads the same user value.
  fixtures: [full-window]
  state:
    disk:
      files:
        "file:///myroot": {type: directory, mtime: 1793318400000, size: 0}
    workspace-context@w1: {folders: ['file:///work/app', 'file:///myroot'], trusted: true}
    settings-store:
      user: {files.eol: "\n"}
      workspace: {}
      folder:
        "file:///myroot": {files.eol: "\r\n"}
  steps:
  - interface: model-service.create-model
    caller: user
    input: {resource: 'inmemory://model/1', value: farboo}
    as: m1
  - interface: model-service.create-model
    caller: user
    input: {resource: 'file:///myroot/myfile.txt', value: farboo}
    as: m2
  - interface: model-service.create-model
    caller: user
    input: {resource: 'file:///other/myfile.txt', value: farboo}
    as: m3
  expect:
  - steps.m1.result.ok && steps.m2.result.ok && steps.m3.result.ok
  - "has(state['text-model@w1'].models['inmemory://model/1'].default_eol) && state['text-model@w1'].models['inmemory://model/1'].default_eol == 'LF'"
  - "has(state['text-model@w1'].models['file:///myroot/myfile.txt'].default_eol) && state['text-model@w1'].models['file:///myroot/myfile.txt'].default_eol == 'CRLF'"
  - "has(state['text-model@w1'].models['file:///other/myfile.txt'].default_eol) && state['text-model@w1'].models['file:///other/myfile.txt'].default_eol == 'LF'"
- id: oracle-editor-double-click-selects-bracket-content
  description: >-
    src/vs/editor/test/browser/view/viewController.test.ts 'Select content after opening curly brace':
    ViewController.dispatchMouse with mouseDownCount 2 at (1,10) in 'var x = { hello };' selects the
    bracket content ' hello ' (doubleClickSelectsBlock) instead of the word. Drives
    view-controller.dispatch-mouse (viewController.ts:217-276, 140-158), as the test's dispatchMouse
    does (lines 94-108).
  fixtures: [full-window]
  steps:
  - interface: model-service.create-model
    caller: user
    input: {resource: 'file:///work/app/brackets.ts', value: 'var x = { hello };'}
    as: model
  - interface: view-controller.dispatch-mouse
    caller: user
    input: {uri: 'file:///work/app/brackets.ts', line: 1, column: 10, mouse_down_count: 2, in_selection_mode: false, multicursor_modifier: false}
    as: dbl
  expect:
  - steps.model.result.ok && steps.dbl.result.ok
  - "has(state['cursors-controller@w1'].selection) && state['cursors-controller@w1'].selection.start_line == 1 && state['cursors-controller@w1'].selection.start_column == 10 && state['cursors-controller@w1'].selection.end_column == 17"
- id: oracle-editor-smart-select-ranges-to-position
  description: >-
    src/vs/editor/contrib/smartSelect/test/browser/smartSelect.test.ts 'getRangesToPosition #1':
    provideSelectionRanges with no registered providers falls back to the built-in word and bracket
    providers and returns 14 nested ranges for (3,20). The range computation is below the model; this
    scenario only checks that the selectionRange query reaches the language feature registry.
  fixtures: [full-window]
  steps:
  - interface: smart-select-controller.cmd--executeselectionrangeprovider
    caller: user
    input:
      command_id: _executeSelectionRangeProvider
      args: ['file:///work/app/src/main.ts', [{lineNumber: 2, column: 5}]]
    as: ranges
  expect:
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'language-features-service.invoke-providers' && e.input.feature == 'selectionRange')"
- id: oracle-workbench-contribs-browser-new-tab-url-picker
  description: >-
    src/vs/workbench/contrib/browserView/test/electron-browser/features/browserNavigationFeatures.test.ts
    'new-tab commands open the URL picker only when no URL was supplied': workbench.action.browser.newTab
    and workbench.action.browser.open without a URL open the URL picker once; open with
    'https://example.com' or 'about:blank' does not.
  fixtures: [full-window]
  steps:
  - {interface: command-service.try-execute-command, caller: user, input: {command_id: workbench.action.browser.newTab, args: []}, as: newtab}
  - {interface: command-service.try-execute-command, caller: user, input: {command_id: workbench.action.browser.open, args: []}, as: open}
  - {interface: command-service.try-execute-command, caller: user, input: {command_id: workbench.action.browser.open, args: ['https://example.com']}, as: url}
  - {interface: command-service.try-execute-command, caller: user, input: {command_id: workbench.action.browser.open, args: ['about:blank']}, as: blank}
  expect:
  - steps.newtab.result.ok && steps.open.result.ok && steps.url.result.ok && steps.blank.result.ok
  - "trace.filter(e, e.type == 'call.start' && e.interface.endsWith('open-url-picker')).size() == 2"
  - "trace.filter(e, e.type == 'call.start' && e.interface.endsWith('open-url-picker') && e.t >= steps.url.start_ms).size() == 0"
- id: oracle-notebook-webview-move-cell-down-single
  description: >-
    src/vs/workbench/contrib/notebook/test/browser/cellOperations.test.ts 'Move cells - single cell':
    moveCellRange(down) on cell 1 of a 5-cell notebook moves that cell (same object) to index 2.
  fixtures: [full-window]
  state:
    notebook-text-model@w1:
      models:
        'file:///work/app/move.ipynb':
          cells:
          - {handle: 1, kind: markup, language: markdown, source: '# header a', outputs: [], execution_order: null, last_run_success: null}
          - {handle: 2, kind: code, language: javascript, source: 'var b = 1;', outputs: [], execution_order: null, last_run_success: null}
          - {handle: 3, kind: markup, language: markdown, source: '# header b', outputs: [], execution_order: null, last_run_success: null}
          - {handle: 4, kind: code, language: javascript, source: 'var b = 2;', outputs: [], execution_order: null, last_run_success: null}
          - {handle: 5, kind: code, language: javascript, source: 'var c = 3;', outputs: [], execution_order: null, last_run_success: null}
          next_handle: 6
          version_id: 1
          view_type: jupyter-notebook
    notebook-editor-widget@w1:
      active_uri: 'file:///work/app/move.ipynb'
      focus_index: 1
  steps:
  - interface: notebook-cell-commands.cmd-notebook-cell-movedown
    caller: user
    input: {uri: 'file:///work/app/move.ipynb', cell_index: 1}
    as: move
  expect:
  - steps.move.result.ok && steps.move.result.value.moved
  - "state['notebook-text-model@w1'].models['file:///work/app/move.ipynb'].cells[2].source == 'var b = 1;'"
  - "state['notebook-text-model@w1'].models['file:///work/app/move.ipynb'].cells[2].handle == 2"
  - "state['notebook-text-model@w1'].models['file:///work/app/move.ipynb'].cells.map(c, c.source) == ['# header a', '# header b', 'var b = 1;', 'var b = 2;', 'var c = 3;']"
  - "state['notebook-editor-widget@w1'].focus_index == 2"
- id: oracle-notebook-webview-copy-text-plain-output
  description: >-
    src/vs/workbench/contrib/notebook/test/browser/contrib/outputCopyTests.test.ts 'Copy text/plain
    output': copyCellOutput('text/plain', output) writes 'output content' to the clipboard.
  fixtures: [full-window]
  state:
    notebook-text-model@w1:
      models:
        'file:///work/app/out.ipynb':
          cells:
          - {handle: 1, kind: code, language: python, source: 'print(1)', outputs: [{mime: text/plain, value: output content, size: 14}], execution_order: 1, last_run_success: true}
          next_handle: 2
          version_id: 1
          view_type: jupyter-notebook
    notebook-editor-widget@w1:
      active_uri: 'file:///work/app/out.ipynb'
      focus_index: 0
  steps:
  - {interface: notebook-cell-output-actions.cmd-notebook-celloutput-copy, caller: user, input: {command_id: notebook.cellOutput.copy}, as: copy}
  - {interface: clipboard-service.read-text, caller: user, as: clip}
  expect:
  - steps.copy.result.ok && steps.copy.result.value.copied
  - steps.clip.result.value.text == 'output content'
  - "state['clipboard-service@w1'].text == 'output content'"
- id: oracle-notebook-webview-copy-invalid-mime-nothing
  description: >-
    src/vs/workbench/contrib/notebook/test/browser/contrib/outputCopyTests.test.ts 'Nothing copied for
    invalid mimetype': with only 'bad' and 'unknown' output items (no text-based mime),
    copyCellOutput writes nothing, so the clipboard stays ''.
  fixtures: [full-window]
  state:
    notebook-text-model@w1:
      models:
        'file:///work/app/out.ipynb':
          cells:
          - {handle: 1, kind: code, language: python, source: 'print(1)', outputs: [{mime: bad, value: output content, size: 14}, {mime: unknown, value: output 2, size: 8}], execution_order: 1, last_run_success: true}
          next_handle: 2
          version_id: 1
          view_type: jupyter-notebook
    notebook-editor-widget@w1:
      active_uri: 'file:///work/app/out.ipynb'
      focus_index: 0
  steps:
  - {interface: notebook-cell-output-actions.cmd-notebook-celloutput-copy, caller: user, input: {command_id: notebook.cellOutput.copy}, as: copy}
  - {interface: clipboard-service.read-text, caller: user, as: clip}
  expect:
  - steps.copy.result.ok
  - steps.clip.result.value.text == ''
  - "state['clipboard-service@w1'].text == ''"
  - "calls['clipboard-service.write-text'] == 0"

- id: oracle-notebook-webview-kernel-source-reopen-current-context
  description: >-
    src/vs/workbench/contrib/notebook/test/browser/notebookKernelSource.test.ts:60 'reopening a notebook
    creates source actions with its current context': NotebookKernelService.getSourceActions
    (notebookKernelServiceImpl.ts:312-353) caches a notebook's NotebookKernelSource actions with the
    enabled state of the context they were built in, and onWillRemoveNotebookDocument
    (notebookKernelServiceImpl.ts:134-140) drops the cache, so a reopened notebook (same URI) gets
    actions built with the current context keys. Setup (lines 46, 61): the menu item test.notebookSource
    with precondition testNotebookKernelEnabled == true, the key false. The test fires the stubbed
    INotebookService's onWillRemoveNotebookDocument (line 56); the step drives the real
    notebook-service.on-will-dispose-document, which fires it.
  fixtures: [full-window]
  state:
    notebook-text-model@w1:
      models:
        "test:///closed": {view_type: test-notebook, version_id: 1, next_handle: 1, cells: []}
    notebook-kernel-service@w1:
      source_menu:
      - {command: test.notebookSource, title: Test Kernel, precondition: "testNotebookKernelEnabled == true", precondition_keys: [testNotebookKernelEnabled]}
    context-key-service@w1: {values: {testNotebookKernelEnabled: false}}
  steps:
  - as: first
    interface: notebook-kernel-service.get-source-actions
    caller: notebook-editor-context-keys
    input: {uri: "test:///closed", view_type: test-notebook}
  - as: close
    flow: notebook-close
    input: {uri: "test:///closed"}
  - as: enable
    interface: context-key-service.set-context
    caller: user
    input: {key: testNotebookKernelEnabled, value: true}
  - as: reopened
    interface: notebook-kernel-service.get-source-actions
    caller: notebook-editor-context-keys
    input: {uri: "test:///closed", view_type: test-notebook}
  expect:
  - steps.first.result.ok && steps.close.result.ok && steps.reopened.result.ok
  - >-
    [steps.first.result.value.actions.filter(a, a.id == 'test.notebookSource')[0].enabled,
    steps.reopened.result.value.actions.filter(a, a.id == 'test.notebookSource')[0].enabled] == [false, true]
