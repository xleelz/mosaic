# Profile for the VS Code 1.144.0 build (docs/PIPELINE.md, DESIGN §13).
profile_version: 1
id: vscode
name: Visual Studio Code 1.144 (built from code)
workspace: examples/vscode

snapshot:
  repo: microsoft/vscode
  ref: "1.144.0"
  sha: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
  path: /home/lbethay/.cache/mosaic-bench/vscode-1.144.0
  url: https://github.com/microsoft/vscode/tree/2c33b50b16c472efe58357d1d2a8a5414bc23fbf
  forbidden: ["**/*.env*", "**/*.age", "**/*.pem", "**/*.key", "**/credentials*", "**/.npmrc"]

evidence:
  not_evidence: ["**/*.md", "**/test/**", "**/*.test.ts", test/**, build/**, scripts/**, .github/**]
  cite_form: "path:line or path:line-end, relative to snapshot.path, one source per string"

inventory:
  out: inventory.json
  plugins: [ts-frontend]
  include_test_support: false
  kinds:
    - {kind: vscode-command, owner: path, cover: "an interface on the registering component named cmd-<command id slug>, citing the registration lines"}
    - {kind: exthost-rpc, owner: "the area owning the MainThread*/ExtHost* implementation of the shape", cover: "the implementation's method interface cites the shape method's line in extHost.protocol.ts"}
    - {kind: service, owner: "the area owning the registerSingleton implementation", cover: "the implementation component cites the createDecorator line", level: registered}
    - {kind: workbench-contribution, owner: path, cover: "a component for the contribution class, with its constructor/startup behavior as an interface"}
    - {kind: extension-command, owner: "builtin-extensions", cover: "an interface on the extension's component named cmd-<command id slug>"}
    - {kind: extension-api, owner: exthost, cover: "an interface on vscode-api named <namespace>-<function> citing vscode.d.ts"}
    - {kind: ipc-channel, owner: path, cover: "the channel's server component cites the registerChannel line"}
    - {kind: exthost-customer, owner: path, cover: "the MainThread* component cites the @extHostNamedCustomer line"}
    - {kind: activation-event, owner: builtin-extensions, cover: "the extension's activate flow cites its package.json activationEvents line"}
    - {kind: extension-point, owner: path, cover: "the extension point's handler component cites the registration"}
    - {kind: cli-command, owner: remote-server, cover: "a cli interface citing the clap definition"}
    - {kind: process-main, owner: path, cover: "a startup flow whose entry cites the main"}
  skip_rules:
    - kinds: [cron, python-cli]
      match: ".github/**"
      reason: "not an entry point of the product: CI workflow or repo tooling"
    - kinds: [exthost-rpc]
      match: "methods of shapes whose implementation is a pure pass-through to a service already modeled"
      reason: "RPC plumbing: covered by the service interface it forwards to (list each in skips with the target)"
    - kinds: [vscode-command]
      match: "commands registered only for tests, telemetry or developer diagnostics (workbench.action.dev*, _workbench.*)"
      reason: "developer or internal command with no user-visible behavior"
  manual: []
  audit:
    precision_sample: 40
    recall_sources: [vscode.d.ts, extHost.protocol.ts, package.json contributes.commands]
    targets: {precision: 0.9, recall: 0.9}

areas:
  - id: platform-core
    module: platform
    owns: [src/vs/base/**, src/vs/platform/**]
    except: [src/vs/platform/agentHost/**, src/vs/platform/mcp/**, src/vs/platform/terminal/**, src/vs/platform/extensionManagement/**, src/vs/platform/userDataSync/**, src/vs/platform/remote/**, "src/vs/platform/*/electron-main/**", src/vs/platform/windows/**, src/vs/platform/update/**]
    entry_points: "service implementations (instantiation, configuration, storage, files, lifecycle, commands, keybinding, contextkey, quickinput, notification, dialogs), IPC channels"
  - id: main-process
    module: main-process
    owns: [src/vs/code/**, src/main.ts, src/cli.ts, src/bootstrap-*.ts, "src/vs/platform/*/electron-main/**", src/vs/platform/windows/**, src/vs/platform/update/**, src/vs/workbench/electron-browser/**]
    entry_points: "process mains, window lifecycle (open, reload, close with veto), native host, update, shared and utility processes, backup on exit (hot exit)"
  - id: editor
    module: editor
    owns: [src/vs/editor/**]
    entry_points: "editor commands and actions, text model edits and undo, cursor, find, suggest/completion, hover, code actions, formatting, folding, rename"
  - id: workbench-shell
    module: workbench
    owns: [src/vs/workbench/browser/**, src/vs/workbench/common/**, src/vs/workbench/services/**]
    except: [src/vs/workbench/services/extensions/**, src/vs/workbench/services/textfile/**, src/vs/workbench/services/workingCopy/**, src/vs/workbench/services/search/**, src/vs/workbench/services/chat/**]
    entry_points: "workbench startup, layout and parts, editor service and groups, views, command palette, keybinding resolution, configuration resolution, workspace trust"
  - id: exthost
    module: extension-host
    owns: [src/vs/workbench/api/**, src/vs/workbench/services/extensions/**, src/vs/platform/extensions/**, src/vscode-dts/**]
    entry_points: "extension host start/restart/unresponsive, activation by events, the vscode.* API, MainThread/ExtHost RPC"
  - id: files-search-scm
    module: workbench
    owns: [src/vs/workbench/contrib/files/**, src/vs/workbench/contrib/search/**, src/vs/workbench/contrib/searchEditor/**, src/vs/workbench/contrib/scm/**, src/vs/workbench/contrib/markers/**, src/vs/workbench/contrib/mergeEditor/**, src/vs/workbench/contrib/multiDiffEditor/**, src/vs/workbench/services/textfile/**, src/vs/workbench/services/workingCopy/**, src/vs/workbench/services/search/**]
    entry_points: "open/save/revert/auto save, save participants (format on save), dirty tracking, save conflicts, file watching, explorer operations, search, SCM views"
  - id: terminal-debug-tasks
    module: workbench
    owns: [src/vs/workbench/contrib/terminal/**, src/vs/workbench/contrib/terminalContrib/**, src/vs/workbench/contrib/debug/**, src/vs/workbench/contrib/tasks/**, src/vs/workbench/contrib/testing/**, src/vs/workbench/contrib/output/**, src/vs/platform/terminal/**]
    entry_points: "terminal creation and pty host (persistence, reconnect), debug sessions over DAP, tasks, test runs, output channels"
  - id: notebook-webview
    module: workbench
    owns: [src/vs/workbench/contrib/notebook/**, src/vs/workbench/contrib/webview/**, src/vs/workbench/contrib/webviewPanel/**, src/vs/workbench/contrib/customEditor/**, src/vs/workbench/contrib/interactive/**]
    entry_points: "notebook open/execute/kernel selection, webviews and custom editors"
  - id: chat
    module: workbench
    owns: [src/vs/workbench/contrib/chat/**, src/vs/workbench/contrib/inlineChat/**, src/vs/workbench/services/chat/**, src/vs/workbench/contrib/agentsVoice/**]
    entry_points: "chat requests to participants and language models, tools and confirmations, edits sessions, inline chat"
  - id: agents
    module: agents
    owns: [src/vs/platform/agentHost/**, src/vs/platform/mcp/**, src/vs/workbench/contrib/mcp/**, src/vs/sessions/**]
    entry_points: "the agent host process, agent sessions app, MCP servers (start, tools, sampling)"
  - id: remote-server
    module: remote-server
    owns: [src/vs/server/**, src/server-*.ts, cli/**, remote/**, src/vs/platform/remote/**, src/vs/workbench/contrib/remote/**, src/vs/platform/extensionManagement/**, src/vs/workbench/contrib/extensions/**, src/vs/platform/userDataSync/**, src/vs/workbench/contrib/userDataSync/**, src/vs/workbench/contrib/update/**]
    entry_points: "remote server and CLI, remote connection/reconnect, extension install/update/enablement, settings sync"
  - id: workbench-contribs
    module: workbench
    owns: [src/vs/workbench/contrib/**]
    entry_points: "every other workbench contribution (preferences, codeEditor, accessibility, comments, browserView, welcome, snippets, ...)"
  - id: builtin-extensions
    module: builtin-extensions
    owns: [extensions/**]
    entry_points: "built-in extensions' activation and commands; model git and typescript-language-features and markdown-language-features in depth, the rest at the command level"

overrides:
  - {symbol: "ExtensionService.startExtensionHosts and restart/unresponsive handling", area: exthost, reason: "extension host lifecycle is exthost logic living under workbench/services/extensions"}
  - {symbol: "WorkspaceTrustManagementService", area: workbench-shell, reason: "trust gates many areas; one owner"}

shared_components:
  - {id: disk, kind: datastore, interface_kind: io, naming: "disk.<op> (read-file, write-file, stat, watch, delete)"}
  - {id: settings-store, kind: datastore, interface_kind: io, naming: "settings-store.<scope>-<op> (user-read, workspace-write, ...)"}
  - {id: storage-db, kind: datastore, interface_kind: io, naming: "storage-db.<scope>-<op> (global/workspace state.vscdb)"}

cross_area_rules:
  - "Commands are invoked through platform-core's command-service.execute-command; the registering area models the command's handler as interface cmd-<id slug> on its own component."
  - "Keybindings resolve in workbench-shell (keybinding-service.dispatch) and then execute the command; areas don't model key dispatch."
  - "Extensions call the vscode API (exthost owns vscode-api.<namespace>-<function>); the API's MainThread side calls the owning area's service. builtin-extensions model only extension logic and call vscode-api stubs."
  - "Saving goes through files-search-scm's text-file-service.save; the editor area owns format-on-save providers, invoked as a save participant."

naming:
  component: "the class in kebab-case (TextFileService -> text-file-service); a service's component is its registerSingleton implementation class; MainThreadDocuments -> main-thread-documents"
  interface: "the method in kebab-case without a leading $ (save, try-save-document); commands are cmd-<command id with . and _ as -> lowercase, cut to 64> (workbench.action.files.save -> cmd-workbench-action-files-save)"
  routes: ""
  messages: "RPC: the shape method on its implementation component, kind rpc, attributes {shape: MainThreadDocumentsShape}"
  schema: "area prefix in PascalCase (FilesTextFileModel); shared contracts keep the owner's name"
  config: "the setting key in kebab-case with dots as -: files.autoSaveDelay -> files-auto-save-delay (keep the unit in the name only if the key has one; attributes.key holds the original)"
  fixture: "the world it describes: one-window-folder, two-windows, untrusted-folder, remote-folder, agent-session"
  instance: "w1, w2 for workbench windows; eh1, eh2 for extension hosts (ehN serves wN); pty1 for the pty host; srv1 for a remote server"
  scenario: "<area>-<flow>-<case>"
  forbidden: [handler, store, client, service, manager, request, result, error, model, provider, controller]
  examples:
    - {entry: "vscode-command workbench.action.files.save", component: save-file-actions, interface: save-file-actions.cmd-workbench-action-files-save}
    - {entry: "service ITextFileService", component: text-file-service, interface: text-file-service.save}
    - {entry: "exthost-rpc MainThreadDocumentsShape.$trySaveDocument", component: main-thread-documents, interface: main-thread-documents.try-save-document}
    - {entry: "extension-api workspace.applyEdit", component: vscode-api, interface: vscode-api.workspace-apply-edit}

errors:
  code_from: "the error class or result enum in kebab-case: CancellationError -> canceled, FileOperationResult.FILE_MODIFIED_SINCE -> file-modified-since; a thrown Error with a fixed message -> a short slug of the message"
  status_from: "none (0) except remote/HTTP surfaces, which use their HTTP status"
  verify_against: [src/vs/base/common/errors.ts, src/vs/platform/files/common/files.ts]
  table:
    - {code: canceled, status: 0, retryable: false, source: "src/vs/base/common/errors.ts:226"}
    - {code: file-not-found, status: 0, retryable: false, source: "src/vs/platform/files/common/files.ts:1487"}
    - {code: file-modified-since, status: 0, retryable: false, source: "src/vs/platform/files/common/files.ts:1489"}
    - {code: file-write-locked, status: 0, retryable: false, source: "src/vs/platform/files/common/files.ts:1491"}
    - {code: file-permission-denied, status: 0, retryable: false, source: "src/vs/platform/files/common/files.ts:1492"}
    - {code: file-too-large, status: 0, retryable: false, source: "src/vs/platform/files/common/files.ts:1493"}
    - {code: command-not-found, status: 0, retryable: false, source: "src/vs/platform/commands/common/commands.ts"}
    - {code: extension-host-crashed, status: 0, retryable: true, source: "src/vs/workbench/services/extensions/common/abstractExtensionService.ts"}

shared_shapes:
  fields:
    uri: "string, a URI (file:///work/app/src/main.ts)"
    resource: "string, a URI, as `uri`"
    version_id: "integer, the text model's version"
    language_id: "string (typescript, markdown, ...)"
    command_id: "string, the registered command id"
    args: "list, command arguments"
    window_id: "string, the window instance (w1)"
    reason: "string, the SaveReason / close reason enum name in kebab-case (explicit, auto, focus-change, window-change)"
    token: "object {canceled: bool}, a CancellationToken"
  envelope: null
  schemas:
    - {id: FilesSaveOptions, owner: files-search-scm, fields: [reason, force, skip_save_participants]}
    - {id: EditorTextEdit, owner: editor, fields: [range, text]}
    - {id: ExthostExtensionDescription, owner: exthost, fields: [identifier, activation_events, main, browser, capabilities]}
  seams:
    - {interface: command-service.execute-command, owner: platform-core, callers: [all]}
    - {interface: configuration-service.get-value, owner: platform-core, callers: [all]}
    - {interface: file-service.write-file, owner: platform-core, callers: [files-search-scm, workbench-shell, remote-server]}
    - {interface: text-file-service.save, owner: files-search-scm, callers: [workbench-shell, exthost, editor]}
    - {interface: extension-service.activate-by-event, owner: exthost, callers: [all]}
    - {interface: editor-service.open-editor, owner: workbench-shell, callers: [all]}
    - {interface: lifecycle-service.on-before-shutdown, owner: workbench-shell, callers: [files-search-scm, terminal-debug-tasks, main-process]}

config:
  sources:
    - {path: "registerConfiguration calls (Registry.as<IConfigurationRegistry>(...).registerConfiguration) across src/vs/**", role: default, format: code}
    - {path: product.json, role: deployed, format: json}
  # A setting's deployed value is its registered default unless product.json or a fixture's user
  # settings override it. Fixtures override settings through `config`.
  required:
    - {key: files.autoSave, owner: files-search-scm}
    - {key: files.autoSaveDelay, owner: files-search-scm}
    - {key: files.hotExit, owner: main-process}
    - {key: editor.formatOnSave, owner: files-search-scm}
    - {key: editor.formatOnSaveMode, owner: editor}
    - {key: files.participants.timeout, owner: files-search-scm}
    - {key: security.workspace.trust.enabled, owner: workbench-shell}
    - {key: extensions.autoUpdate, owner: remote-server}
    - {key: terminal.integrated.enablePersistentSessions, owner: terminal-debug-tasks}
    - {key: search.maxResults, owner: files-search-scm}
  units: "durations in ms; keep VS Code's key and units"

instances:
  groups:
    - {component: workbench-window, default: [w1], summary: "a renderer window running the workbench"}
    - {component: extension-host, default: [eh1], summary: "a local extension host process; ehN serves window wN"}
  entry_instance: w1

fixtures:
  file: fixtures.yaml
  worlds:
    - {id: base-workspace, summary: "folder /work/app with src/main.ts, src/util.ts, README.md, package.json, a git repo; default settings; trusted", must_be_used_by: [all], full: false}
    - {id: one-window-folder, summary: "base-workspace opened in w1 with extension host eh1 running; built-in extensions registered, none activated", extends: [base-workspace], full_id: full-window}
    - {id: two-windows, summary: "w1 on /work/app and w2 on /work/lib, eh1 and eh2", extends: [base-workspace]}
    - {id: untrusted-folder, summary: "one-window-folder with the folder not trusted (restricted mode)", extends: [one-window-folder], full_id: full-untrusted}
    - {id: dirty-editor, summary: "one-window-folder with src/main.ts open and modified (version 2, not saved)", extends: [one-window-folder]}
  # Overlays on the generated full worlds, written into worlds.yaml verbatim (assign_inventory.py --worlds).
  derived:
    - {id: full-format-on-save, summary: full-dirty-editor with editor.formatOnSave on., extends: [full-dirty-editor], config: {editor-format-on-save: true}}
    - {id: full-auto-save-after-delay, summary: full-window with files.autoSave = afterDelay., extends: [full-window], config: {files-auto-save: afterDelay}}
  canonical_names:
    folder: /work/app
    files: [src/main.ts, src/util.ts, README.md, package.json]
    extension: vscode.typescript-language-features
    user: dev

oracle:
  test_dirs: [src/vs/**/test, extensions/*/src/test, test/integration]
  include: ["**/*.test.ts"]
  exclude: ["**/*.perf.test.ts", "**/test/**/fixtures/**"]
  sample: {per_area_min: 3, total: 40, seed: 1}
  run: never
  area_of_test: "the area owning the class under test"

benchmark:
  file: BENCHMARK.md
  groups: [editing-saving, extensions, workbench-commands, terminal-debug-search, chat-agents-remote]
  default_world: [one-window-folder]

independence:
  never_read: []
  area_may_read: [skeleton.yaml, fixtures.yaml, inventory.json, profile.yaml, "own files", "owner fragments, for contracts only"]
  area_never_read: ["other areas' notes", BENCHMARK.md, judge/**, oracle/**]
  reconcile_may_read: ["other areas' fragments, for contracts and seeded state"]
  oracle_may_read: ["vscode.json", "the snapshot's tests and code"]
  oracle_never_read: [notes/**, BENCHMARK.md, judge/**]
  judge_may_read: ["vscode.json", fragments/**, notes/**, BENCHMARK.md, "the snapshot's docs and tests"]
  upstream_checkout: null

scale:
  area_entries: [30, 1200]   # exthost carries ~1,180 RPC/API entries, most skipped by rule
  per_area:
    components: [20, 90]
    flows: [6, 14]
    scenarios: [25, 60]
  gates:
    coverage_min: 0.9
    behavior_coverage_min: 0.85
    unexecuted_fail_branches: 0
    cite_sample: 15
    mocks: 0
    write_then_read: required

# User-visible features (DESIGN §13.1 item 19). Each owner models the feature with a flow tagged
# `feature:<id>` that a scenario runs, or skips it in skips/<area>.features.json with a reason.
features:
  - {id: save-and-revert, owner: files-search-scm, summary: "save, save as, revert, dirty tracking and save conflicts", sources: [src/vs/workbench/services/textfile/]}
  - {id: auto-save, owner: files-search-scm, summary: "files.autoSave modes (afterDelay, onFocusChange, onWindowChange)", sources: [files.autoSave]}
  - {id: format-on-save, owner: workbench-contribs, summary: "save participants incl. format on save", sources: [editor.formatOnSave]}
  - {id: hot-exit, owner: main-process, summary: "backups on exit and restore on restart", sources: [files.hotExit]}
  - {id: file-watching, owner: files-search-scm, summary: "external changes reload clean models", sources: [src/vs/platform/files/]}
  - {id: search, owner: files-search-scm, summary: "workspace text search with limits and cancellation", sources: [search.maxResults]}
  - {id: scm, owner: files-search-scm, summary: "source control view, input and commit", sources: [src/vs/workbench/contrib/scm/]}
  - {id: editing, owner: editor, summary: "typing, undo/redo, multi-cursor, find/replace", sources: [src/vs/editor/]}
  - {id: language-features, owner: editor, summary: "completion, hover, code actions, rename, go to definition, formatting", sources: [src/vs/editor/contrib/]}
  - {id: commands-and-keybindings, owner: workbench-shell, summary: "keybinding resolution with when clauses, command palette", sources: [src/vs/platform/keybinding/]}
  - {id: settings, owner: platform-core, summary: "settings scopes and precedence incl. language overrides", sources: [src/vs/platform/configuration/]}
  - {id: workspace-trust, owner: workbench-shell, summary: "restricted mode and trust prompts", sources: [security.workspace.trust.enabled]}
  - {id: editor-management, owner: workbench-shell, summary: "open/close editors, groups, dirty close prompts", sources: [src/vs/workbench/services/editor/]}
  - {id: extension-host-lifecycle, owner: exthost, summary: "start, activation events, crash restart, unresponsive detection", sources: [src/vs/workbench/services/extensions/]}
  - {id: extension-api, owner: exthost, summary: "the vscode.* API over RPC", sources: [src/vscode-dts/vscode.d.ts]}
  - {id: extension-management, owner: remote-server, summary: "install, update, uninstall, auto update", sources: [extensions.autoUpdate]}
  - {id: settings-sync, owner: remote-server, summary: "settings sync on/off and conflicts", sources: [src/vs/platform/userDataSync/]}
  - {id: remote-development, owner: remote-server, summary: "remote connection, reconnect, remote extension host, connection tokens", sources: [src/vs/platform/remote/]}
  - {id: integrated-terminal, owner: terminal-debug-tasks, summary: "terminals, pty host, persistence and reconnect", sources: [terminal.integrated.enablePersistentSessions]}
  - {id: debugging, owner: terminal-debug-tasks, summary: "launch configs, DAP sessions, breakpoints", sources: [src/vs/workbench/contrib/debug/]}
  - {id: tasks, owner: terminal-debug-tasks, summary: "tasks.json tasks and problem matchers", sources: [src/vs/workbench/contrib/tasks/]}
  - {id: testing, owner: terminal-debug-tasks, summary: "test controllers, runs and results", sources: [src/vs/workbench/contrib/testing/]}
  - {id: notebooks, owner: notebook-webview, summary: "notebook open/save, kernels, cell execution", sources: [src/vs/workbench/contrib/notebook/]}
  - {id: webviews, owner: notebook-webview, summary: "webview panels and custom editors", sources: [src/vs/workbench/contrib/webview/]}
  - {id: chat, owner: chat, summary: "chat requests, participants, modes, tools with confirmation", sources: [src/vs/workbench/contrib/chat/]}
  - {id: inline-chat, owner: chat, summary: "inline chat in the editor", sources: [src/vs/workbench/contrib/inlineChat/]}
  - {id: agent-sessions, owner: agents, summary: "agent host sessions and the Agents window", sources: [src/vs/sessions/]}
  - {id: mcp, owner: agents, summary: "MCP servers, tools and sampling", sources: [src/vs/workbench/contrib/mcp/]}
  - {id: window-lifecycle, owner: main-process, summary: "open/close/reload windows, second instance, CLI launch", sources: [src/vs/code/electron-main/]}
  - {id: git, owner: builtin-extensions, summary: "the git extension: status, stage, commit", sources: [extensions/git/]}
  - {id: typescript, owner: builtin-extensions, summary: "the TypeScript extension and tsserver", sources: [extensions/typescript-language-features/]}

# Ratcheted check thresholds (DESIGN §16.1; the template's section 12). Measured 2026-11-02 at
# today's values, so the current model passes the full gate. They only go down; never raise one.
gates:
  strict_stubs: true                  # 0 stub disagreements
  max_exemption_issues: 0
  max_internal_assertions: 0.749      # the highest fragment share, main-process.yaml 146/195, rounded up
  max_clock_ids: 4
  max_unknown_inputs: 2
  max_racy: 0.227                     # the highest fragment share, remote-server.yaml 12/53, rounded up
  max_seam_names: 1
  min_test_reach: 0.239               # the lowest area, platform-core 87/363, rounded down
  # Exploration (--explore 'race|concurr' --schedules 20) is recorded, not gated:
  # 0 of 9 scenarios fail.
  # max_explore_failures: unset
