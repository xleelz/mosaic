    set:
      vars.a: '= (has(input.args) && size(input.args) > 0 ? input.args[0] : null)'
  - set:
      vars.o: '= vars.a == null ? {} : (type(vars.a) == string ? {''url'': vars.a} : vars.a)'
  - set:
      vars.url: '= has(vars.o.url) ? vars.o.url : '''''
      vars.side: = has(vars.o.openToSide) && vars.o.openToSide
