- component: user-data-profile
  name: get-current-profile
  kind: function
  summary: IUserDataProfileService.currentProfile with its settings resource (the default profile keeps User/settings.json, others User/profiles/<id>/settings.json), the default profile's settings resource
    and the number of non-internal profiles.
  sources:
  - src/vs/workbench/contrib/userDataProfile/browser/userDataProfile.ts:63-71
  - src/vs/workbench/contrib/preferences/browser/preferences.contribution.ts:1397-1402
  request:
    type: object
  behavior:
  - set:
      vars.cur: = state.current_profile
      vars.n: = size(state.profiles.filter(k, !has(state.profiles[k].is_internal) || !state.profiles[k].is_internal))
  - title: The default profile uses the top-level user settings
    if: state.profiles[vars.cur].is_default
    then:
    - return:
        id: = vars.cur
        is_default: true
        settings_resource: vscode-userdata:/User/settings.json
        default_settings_resource: vscode-userdata:/User/settings.json
        non_internal_count: = vars.n
  - return:
      id: = vars.cur
      is_default: false
      settings_resource: = 'vscode-userdata:/User/profiles/' + vars.cur + '/settings.json'
      default_settings_resource: vscode-userdata:/User/settings.json
      non_internal_count: = vars.n
