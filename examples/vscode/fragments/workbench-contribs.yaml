      input:
        filter: = vars.o.reuseUrlFilter
      as: m
    - if: vars.m.value.found
      then:
      - if: vars.url != ''
        then:
        - source: src/vs/workbench/contrib/browserView/electron-browser/features/browserTabManagementFeatures.ts:324-326
          call: browser-view-workbench-service.navigate
