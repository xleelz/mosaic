- component: walkthroughs-service
  name: progress-step
  kind: function
  summary: Marks a step done, saves the memento, then fires onDidProgressStep; an unknown step throws after the save.
  sources:
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:548-558
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - pickColorTheme
  errors:
  - code: tried-to-progress-unknown-step
    status: 0
    retryable: false
  behavior:
  - title: Already done, nothing changes
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:550
    if: input.id in state.progress && state.progress[input.id].done == true
    then:
    - return:
        changed: false
  - title: Record done and save the memento (PROFILE scope)
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:551-552
    set:
      state.progress: '= merge(state.progress, {input.id: {''done'': true}})'
  - title: Unknown step throws after the memento was saved
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:553-554
    if: '!(input.id in state.steps)'
    then:
    - fail:
        code: tried-to-progress-unknown-step
        message: Tried to progress unknown step
  - publish: walkthroughs-service.on-did-progress-step
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:556
    input:
      id: = input.id
      done: true
    delivery: sync
  - return:
      changed: true
- component: walkthroughs-service
  name: deprogress-step
  kind: function
  summary: Deletes a step's progress, saves and fires onDidProgressStep.
  sources:
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:560-565
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - pickColorTheme
  behavior:
  - set:
      state.progress: = omit(state.progress, input.id)
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:561-562
  - publish: walkthroughs-service.on-did-progress-step
    input:
      id: = input.id
      done: false
    delivery: sync
  - return:
      changed: true
- component: walkthroughs-service
  name: on-did-progress-step
