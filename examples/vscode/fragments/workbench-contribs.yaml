- component: settings-change-relauncher
  name: on-configuration-change
  kind: function
  summary: 'Configuration change: ignore unrelated keys; a changed value of a listed setting (not from defaults) prompts Restart, which restarts the host.'
  sources:
  - src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:126-137
  - src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:223-244
  request:
    type: object
    properties:
      key:
        type: string
        default: workbench.enableExperiments
      value:
        default: false
      source:
        type: string
        default: user
      has_focus:
        type: boolean
        default: true
  behavior:
  - title: Only the SETTINGS list
    source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:127-129
    if: '!(input.key in [''window.titleBarStyle'', ''window.menuStyle'', ''window.nativeTabs'', ''window.nativeFullScreen'', ''window.clickThroughInactive'', ''window.controlsStyle'', ''editor.accessibilitySupport'',
      ''security.workspace.trust.enabled'', ''workbench.enableExperiments'', ''_extensionsGallery.enablePPE'', ''security.restrictUNCAccess'', ''accessibility.verbosity.debug'', ''telemetry.feedback.enabled''])'
    then:
    - return:
        prompted: false
        reason: unrelated
  - title: 'ChangeObserver: same value is no change'
    source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:265-272
    if: input.key in state.values && state.values[input.key] == input.value
    then:
    - return:
        prompted: false
        reason: unchanged
  - set:
      state.values: '= merge(state.values, {input.key: input.value})'
  - title: 'Defaults changing or no focus: no prompt'
    source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:223
    if: input.source == 'default' || !input.has_focus
    then:
    - return:
        prompted: false
        reason: not-asked
  - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:224-234
    call: dialog-service.confirm
    input:
      message: A setting has changed that requires a restart to take effect.
      primary_button: '&&Restart'
    as: c
  - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:241
    if: vars.c.value.confirmed
    then:
    - source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:234
      call: host-service.restart
      input: {}
    - return:
        prompted: true
        restarted: true
  - return:
      prompted: true
      restarted: false
- component: settings-change-relauncher
  name: constructor
  kind: function
  summary: Records the current values as the baseline (update(false)), then listens to configuration changes and to sync being turned on.
  sources:
  - src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:357
  - src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:110-124
  request:
    type: object
  behavior:
  - foreach: = ['window.titleBarStyle', 'window.menuStyle', 'window.nativeTabs', 'window.nativeFullScreen', 'window.clickThroughInactive', 'window.controlsStyle', 'editor.accessibilitySupport', 'security.workspace.trust.enabled',
      'workbench.enableExperiments', '_extensionsGallery.enablePPE', 'security.restrictUNCAccess', 'accessibility.verbosity.debug', 'telemetry.feedback.enabled']
    as: k
    steps:
    - title: ChangeObserver.handleChange(config value), with askToRelaunch false
      source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:143-150
      call: configuration-service.get-value
      input:
        key: = vars.k
      as: v
    - title: A typed value that differs from the last one becomes the new last value
      source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:265-272
      if: has(vars.v.value.value) && vars.v.value.value != null && (!(vars.k in state.values) || state.values[vars.k] != vars.v.value.value)
      then:
      - set:
          state.values: '= merge(state.values, {vars.k: vars.v.value.value})'
  - title: 'update(false): baseline without prompting; then onDidChangeConfiguration and onDidTurnOnSync'
    source: src/vs/workbench/contrib/relauncher/browser/relauncher.contribution.ts:121-123
    set:
      state.listening: true
  - return:
      listening: true
      observed: = size(state.values)
