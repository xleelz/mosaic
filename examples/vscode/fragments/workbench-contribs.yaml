- id: snippets-service
  name: SnippetsService
  kind: service
  parent: workbench
  summary: 'Loads snippet files (extension, user profile, workspace .vscode) and tracks snippet usage timestamps (PROFILE storage, last 100). Also registers: extension point snippets; service ISnippetsService.'
  sources:
  - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:208
  - src/vs/workbench/contrib/snippets/browser/snippets.ts:10
  - src/vs/workbench/contrib/snippets/browser/snippets.service.contribution.ts:11
  - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:114-115
  - src/vs/workbench/contrib/snippets/browser/snippetsService.ts:170-205
  state:
    schema:
      type: object
      properties:
        snippets:
          type: object
        usage:
          type: object
    initial:
      snippets:
        typescript:
        - id: vscode.typescript-basics/For Loop
          name: For Loop
          prefix: for
          body: "for (let ${1:index} = 0; ${1:index} < ${2:array}.length; ${1:index}++) {\n\tconst ${3:element} = ${2:array}[${1:index}];\n\t$TM_SELECTED_TEXT$0\n}"
          needs_clipboard: false
          uses_selection: true
          is_file_template: false
        - id: vscode.typescript-basics/Class Definition
          name: Class Definition
          prefix: class
          body: "class ${1:name} {\n\tconstructor(${2:parameters}) {\n\t\t$0\n\t}\n}"
          needs_clipboard: false
          uses_selection: false
          is_file_template: true
      usage: {}
