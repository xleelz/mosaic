- component: keybindings-editor
  name: define-keybinding
  kind: function
  summary: Shows the define-keybinding widget; a new key edits (or adds) the entry through the keybinding editing service.
  sources:
  - src/vs/workbench/contrib/preferences/browser/keybindingsEditor.ts:220-234
  - src/vs/workbench/contrib/preferences/browser/keybindingsEditor.ts:251-263
  request:
    type: object
    properties:
      add:
        type: boolean
        default: false
  behavior:
  - title: 'DefineKeybindingWidget.define(): the user presses a key or escapes'
    source: src/vs/workbench/contrib/preferences/browser/keybindingsEditor.ts:224
    choice: key
    default: pressed
    options:
      pressed:
      - set:
          vars.key: ctrl+alt+s
      escaped:
      - return:
          changed: false
  - title: 'Same key and when: nothing to write'
    source: src/vs/workbench/contrib/preferences/browser/keybindingsEditor.ts:253
    if: vars.key == state.active_entry.key
    then:
    - return:
        changed: false
  - if: input.add
    then:
    - source: src/vs/workbench/contrib/preferences/browser/keybindingsEditor.ts:255
      call: keybindings-editing-service.add-keybinding
      input:
        command: = state.active_entry.command
        key: = vars.key
        when: = state.active_entry.when
    else:
    - source: src/vs/workbench/contrib/preferences/browser/keybindingsEditor.ts:257
      call: keybindings-editing-service.edit-keybinding
      input:
        command: = state.active_entry.command
        key: = vars.key
        when: = state.active_entry.when
  - return:
      changed: true
      key: = vars.key
