  behavior:
  - return:
      default_trusted_domains: = state.product_domains
      trusted_domains: = state.user_domains
- component: trusted-domain-service
  name: store-trusted-domains
  kind: function
  summary: Stores the user list under http.linkProtectionTrustedDomains (APPLICATION, USER); onDidChangeTrustedDomains refreshes the cache.
  sources:
  - src/vs/workbench/contrib/url/browser/trustedDomains.ts:150-156
  request:
    type: object
    properties:
      domains:
        type: array
        items:
          type: string
  behavior:
  - set:
      state.user_domains: = input.domains
  - return:
      stored: true
- component: trusted-domains-configure
  name: configure-opener-trusted-domains
  kind: function
  summary: 'Quick pick: trust the domain, its subdomains, all domains, or manage; persists a new choice.'
  sources:
  - src/vs/workbench/contrib/url/browser/trustedDomains.ts:77-165
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
        examples:
        - https://example.com/docs
  behavior:
  - call: trusted-domain-service.read-trusted-domains
    as: current
  - set:
      vars.origin: = input.uri.split('/')[0] + '//' + input.uri.split('/')[2]
      vars.host: = input.uri.split('/')[2]
  - choice: pick
    default: trust_domain
    source: src/vs/workbench/contrib/url/browser/trustedDomains.ts:136
    options:
      trust_domain:
      - set:
          vars.item: = vars.origin
      trust_subdomains:
      - set:
          vars.item: = input.uri.split('/')[0] + '//*.' + vars.host.split('.').slice(size(vars.host.split('.')) - 2, size(vars.host.split('.'))).join('.')
      trust_all:
      - set:
          vars.item: '*'
      manage:
      - call: editor-service.open-editor
        source: src/vs/workbench/contrib/url/browser/trustedDomains.ts:142-145
        input:
          resource: trustedDomains:/Trusted Domains
      - return:
          domains: = vars.current.value.trusted_domains
          trusted: false
      dismissed:
      - return:
          domains: []
          trusted: false
  - set:
      vars.domains: '= vars.item in vars.current.value.trusted_domains ? vars.current.value.trusted_domains : vars.current.value.trusted_domains + [vars.item]'
  - title: Persist the new trusted domain list
    source: src/vs/workbench/contrib/url/browser/trustedDomains.ts:150-158
    call: trusted-domain-service.store-trusted-domains
    input:
      domains: = vars.domains
  - call: trusted-domain-service.is-valid
    source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:127-131
    input:
      uri: = input.uri
    as: now_valid
  - return:
      domains: = vars.domains
      trusted: = vars.now_valid.value.valid
- component: workspace-trust-ux-handler
