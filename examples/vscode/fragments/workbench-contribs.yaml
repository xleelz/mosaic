- component: workspace-trust-ux-handler
  name: update-workbench-indicators
  kind: function
  summary: 'updateWorkbenchIndicators(trusted): unless security.workspace.trust.banner is never (or untilDismissed and dismissed), shows the Restricted Mode banner (Manage, Learn More) when untrusted and
    hides it when trusted. Message per workbench state.'
  sources:
  - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:432-444
  - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:555-615
  request:
    type: object
    required:
    - trusted
    properties:
      trusted:
        type: boolean
  behavior:
  - title: 'getBannerItem: never shows no banner'
    source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:559-561
    if: config['security-workspace-trust-banner'] == 'never'
    then:
    - return:
        banner: none
  - title: 'getBannerItem: untilDismissed and already dismissed'
    source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:564-566
    if: config['security-workspace-trust-banner'] == 'untilDismissed' && state.banner_dismissed
    then:
    - return:
        banner: none
  - if: input.trusted
    source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:440-442
    then:
    - call: banner-part.hide
      input:
        id: workbench.banner.restrictedMode
    - return:
        banner: hidden
  - call: workspace-context.get-workspace
    source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:605-614
    as: ws
  - set:
      vars.target: '= vars.ws.value.workbench_state == ''empty'' ? ''window'' : (vars.ws.value.workbench_state == ''workspace'' ? ''workspace'' : ''folder'')'
  - call: banner-part.show
    source: src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:438-439
    input:
      id: workbench.banner.restrictedMode
      message: = 'Restricted Mode is intended for safe code browsing. Trust this ' + vars.target + ' to enable all features.'
      actions:
      - label: Manage
        href: command:workbench.trust.manage
      - label: Learn More
        href: https://aka.ms/vscode-workspace-trust
  - return:
      banner: shown
