- component: walkthroughs-service
  name: get-walkthroughs
  kind: function
  summary: Resolved walkthrough steps with done flags (getStepProgress defaults done to false).
  sources:
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:488-505
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/gettingStartedService.ts:540-546
  behavior:
  - return:
      steps: '= state.steps.transformList(id, cat, {''id'': id, ''walkthrough'': cat, ''done'': id in state.progress && state.progress[id].done == true})'
- component: startup-page-runner-contribution
  name: run
  kind: function
  summary: Opens the startup editor once the workbench is restored.
  sources:
  - src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:113-153
  request:
    type: object
    properties:
      startup_kind:
        type: string
        enum:
        - new-window
        - reloaded-window
        default: new-window
      has_active_editor:
        type: boolean
        default: false
  behavior:
  - title: Startup page enabled for welcomePage, readme or terminal
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:271-287
    set:
      vars.mode: = config['workbench-startup-editor']
  - title: Disabled, or a reloaded window
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:139
    if: '!(vars.mode in [''welcomePage'', ''readme'', ''terminal'']) || input.startup_kind == ''reloaded-window'''
    then:
    - return:
        opened: none
  - title: An editor is already active
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:142
    if: input.has_active_editor
    then:
    - return:
        opened: none
  - if: vars.mode == 'readme'
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:193
    then:
    - call: command-service.execute-command
      input:
        command_id: markdown.showPreview
        args:
        - null
        - - file:///work/app/README.md
        - locked: true
      on_error:
      - title: Could not open markdown preview (markdown extension disabled or not activated)
        source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:193-194
        call: notification-service.notify
        input:
          severity: error
          message: '= ''Could not open markdown preview: '' + error.message + ''.'''
      - return:
          opened: readme-error
    - return:
        opened: readme
  - if: vars.mode == 'terminal'
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:149-150
    then:
    - title: Not awaited; a failure doesn't stop startup
      call: command-service.execute-command
      input:
        command_id: workbench.action.createTerminalEditor
        args: []
      on_error: continue
    - return:
        opened: terminal
  - title: Open the Welcome page
    source: src/vs/workbench/contrib/welcomeGettingStarted/browser/startupPage.ts:215-216
    call: editor-service.open-editor
    input:
      resource: walkThrough://vscode_getting_started_page
      options:
        pinned: false
  - return:
      opened: welcome-page
- component: insert-snippet-action
  name: cmd-editor-action-insert-snippet
  kind: command
  attributes:
    command: editor.action.insertSnippet
  summary: Resolves the snippet from args (inline body, name + language) or a pick, inserts it and records its usage.
  sources:
  - src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:79-150
  description: 'Arguments (all optional): snippet (inline body), name (snippet name), lang_id (language id). The request schema declares no properties so a call without arguments reaches the quick pick.'
  request:
    type: object
  behavior:
  - set:
      vars.uri: '= has(input.resource) ? input.resource : ''file:///work/app/src/main.ts'''
  - title: Inline snippet body becomes an ad-hoc user snippet
    source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:96-107
    if: has(input.snippet) && input.snippet != ''
    then:
    - set:
        vars.snip: '= {''id'': ''random/'' + string(random(1000000)), ''body'': input.snippet, ''needs_clipboard'': input.snippet.contains(''CLIPBOARD'')}'
    else:
    - title: An unregistered language id resolves no snippet
      source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:111-114
      if: has(input.lang_id)
      then:
      - choice: language_registered
        default: registered
        options:
          registered: []
          unregistered:
          - return:
              inserted: false
    - title: Language at the cursor, else the requested one
      source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:115-125
      set:
        vars.lang: '= has(input.lang_id) ? input.lang_id : ''typescript'''
    - call: snippets-service.get-snippets
      source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:130-131
      input:
        language_id: = vars.lang
        include_no_prefix_snippets: true
      as: found
    - if: has(input.name)
      then:
      - set:
          vars.matches: = vars.found.value.snippets.filter(s, s.name == input.name)
      else:
      - title: No name, let the user pick a snippet
        source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:136
        choice: pick
        default: first
        options:
          first:
          - set:
              vars.matches: = vars.found.value.snippets.slice(0, 1)
          dismissed:
          - set:
              vars.matches: []
    - title: Snippet not found, return silently
      source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:140-142
      if: size(vars.matches) == 0
      then:
      - return:
          inserted: false
    - set:
        vars.snip: = vars.matches[0]
  - set:
      vars.clip: ''
  - title: Snippets with clipboard variables read the clipboard first
    source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:144-146
    if: vars.snip.needs_clipboard
    then:
    - call: clipboard-service.read-text
      as: clipboard
    - set:
        vars.clip: = vars.clipboard.value.text
  - call: snippet-controller2.insert
    source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:148
    input:
      uri: = vars.uri
      template: = vars.snip.body
  - call: snippets-service.update-usage-timestamp
    source: src/vs/workbench/contrib/snippets/browser/commands/insertSnippet.ts:149
    input:
      id: = vars.snip.id
  - return:
      inserted: true
      id: = vars.snip.id
- component: snippets-service
  name: get-snippets
  kind: function
  summary: Snippets for a registered language, with recency from the usage timestamps (most recent first).
  sources:
