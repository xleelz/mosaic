fixtures:
- id: workbench-contribs-seed
  summary: 'workbench-contribs seed: the modeled commands of this area registered in the CommandsRegistry (keyed by command id), plus initial state of this area''s own components.'
  state:
    browser-view-workbench-service:
      next_id: 1
      views: {}
    comment-service:
      commenting_enabled: true
      commenting_ranges:
        file:///work/app/src/main.ts:
          owner: githubpr
          start_line: 1
          end_line: 2
      threads:
        t1:
          resource: file:///work/app/src/main.ts
          line: 2
          state: unresolved
          comments:
          - Should this log?
          expanded: false
          owner: githubpr
      active_thread: t1
      draft: ''
    timeline-service:
      providers: {}
      workspace_providers: {}
    timeline-pane:
      excluded: []
      reset_count: 0
      workspace: false
    keybindings-editor:
      open: true
      active_entry:
        command: workbench.action.files.save
        command_label: 'File: Save'
