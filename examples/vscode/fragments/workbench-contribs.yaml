    properties:
      uri:
        type: string
        examples:
        - https://example.com/docs
      from_workspace:
        type: boolean
        default: false
  behavior:
  - set:
      vars.scheme: = input.uri.split(':')[0]
  - title: Only http and https links are validated
    source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:62-63
    if: '!(vars.scheme in [''http'', ''https''])'
    then:
    - return:
        open: true
  - title: Links from a trusted workspace skip the prompt unless promptInTrustedWorkspace
    source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:66-67
    if: input.from_workspace && !config['workbench-trusted-domains-prompt-in-trusted-workspace']
    then:
    - call: workspace-trust-management-service.is-workspace-trusted
      as: trust
    - if: vars.trust.value.trusted
      then:
      - return:
          open: true
  - call: trusted-domain-service.is-valid
    source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:72-73
    input:
      uri: = input.uri
    as: valid
  - if: vars.valid.value.valid
    then:
    - return:
        open: true
  - title: Ask "Do you want Code to open the external website?"
    source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:92-140
    choice: link_prompt
    default: open
    options:
      open:
      - return:
          open: true
      copy:
      - call: clipboard-service.write-text
        source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:106-109
        input:
          text: = input.uri
      - return:
          open: false
      configure:
      - call: trusted-domains-configure.configure-opener-trusted-domains
        source: src/vs/workbench/contrib/url/browser/trustedDomainsValidator.ts:113-134
        input:
          uri: = input.uri
        as: picked
      - return:
          open: = vars.picked.value.trusted
      cancel:
      - return:
          open: false
- component: trusted-domain-service
  name: is-valid
  kind: function
  summary: isURLDomainTrusted against product and user trusted domains ('*', exact origin, or *.suffix).
  sources:
  - src/vs/workbench/contrib/url/browser/trustedDomainService.ts:54-59
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
        examples:
        - https://example.com/docs
  behavior:
  - set:
      vars.host: = input.uri.split('/')[2]
      vars.all: = state.product_domains + state.user_domains
  - return:
      valid: = vars.all.exists(d, d == '*' || d == input.uri.split('/')[0] + '//' + vars.host || (d.contains('*.') && vars.host.endsWith(d.split('*.')[1])))
