      is_reconnection: false
      reconnection_token: tok-eh1
  - flow: rs-remote-ext-host-exit
    as: exit
    'on': srv1
    input:
      token: tok-eh1
      code: 0
      signal: null
  - flow: rs-remote-ext-host-connect
    as: re
    input:
      auth: tok-dev
      commit: ''
      desired_connection_type: extension-host
      is_reconnection: true
