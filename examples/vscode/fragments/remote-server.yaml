- component: server-lifetime-service
  name: inactive
  kind: function
  summary: 'Disposing the IDisposable that active(consumer) returned: one consumer fewer; the server may schedule its auto-shutdown when none is left.'
  sources:
  - src/vs/server/node/serverLifetimeService.ts:98-118
  request:
    type: object
    properties:
      consumer:
        type: string
  behavior:
  - set:
      state.total: '= state.total > 0 ? state.total - 1 : 0'
  - return:
      total: = state.total
- component: runtime-extensions-input
  name: instance
  kind: function
  summary: 'RuntimeExtensionsInput.instance: reuse the singleton unless it is missing or disposed.'
  sources:
  - src/vs/workbench/contrib/extensions/common/runtimeExtensionsInput.ts:28-35
  response:
    type: object
    properties:
      type_id:
        type: string
      resource:
        type: string
      capabilities:
        type: array
        items:
          type: string
      created:
        type: boolean
  behavior:
  - if: '!state.disposed'
