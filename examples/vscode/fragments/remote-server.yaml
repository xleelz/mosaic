  - state['disk'].files['file:///home/dev/.vscode-server-oss/data/token'].content == state['remote-extension-host-agent-server@srv1'].connection_token
  - steps.env.result.value.connection_token == state['remote-extension-host-agent-server@srv1'].connection_token
