- component: tunnel-view-commands
  name: cmd-remote-tunnel-forwardinline
  kind: command
  attributes:
    command_id: remote.tunnel.forwardInline
  summary: remote.tunnel.forwardInline
  sources:
  - src/vs/workbench/contrib/remote/browser/tunnelView.ts:1542
  behavior:
  - title: 'Arguments: the caller''s values over the declared defaults (handlers are also reached through command-service with only {command_id, args})'
    set:
      vars.cmd: '= merge({''remote_host'': ''localhost'', ''remote_port'': 3000, ''forwarded'': []}, input == null ? {} : input)'
  - if: '!has(vars.cmd.value) || vars.cmd.value == ""'
    then:
    - title: 'Input box dismissed: nothing is forwarded'
      source: src/vs/workbench/contrib/remote/browser/tunnelView.ts:1173-1176
      return: {}
  - title: Port number or address (3000 or host:2000)
    source: src/vs/workbench/contrib/remote/browser/tunnelView.ts:1119-1131
    set:
      vars.port: '= int(vars.cmd.value.contains('':'') ? vars.cmd.value.split('':'')[1] : vars.cmd.value)'
      vars.host: '= vars.cmd.value.contains('':'') ? vars.cmd.value.split('':'')[0] : ''localhost'''
  - if: vars.port >= config['remote-max-port-number']
    then:
    - title: Port number must be < 65536
      source: src/vs/workbench/contrib/remote/browser/tunnelView.ts:1123-1124
      fail:
        code: invalid-port-number
        message: Port number must be ≥ 0 and < 65536.
  - if: (vars.host + ':' + string(vars.port)) in vars.cmd.forwarded
    then:
    - title: Port is already forwarded
      source: src/vs/workbench/contrib/remote/browser/tunnelView.ts:1127-1128
      fail:
        code: already-forwarded
        message: Port is already forwarded
  - title: Forward through the remote explorer service
    source: src/vs/workbench/contrib/remote/browser/tunnelView.ts:1151-1154
    call: remote-explorer-service.forward
    input:
      remote_host: = vars.host
      remote_port: = vars.port
      elevate_if_needed: true
    as: t
  - return:
      host: = vars.host
      port: = vars.port
  request:
    type: object
    properties:
      value:
        type: string
      remote_host:
        type: string
        default: localhost
      remote_port:
        type: integer
        default: 3000
      forwarded:
        type: array
        items:
          type: string
        default: []
