  store:
    table: ext_host_connections
    op: put
    key: = input.token
    value: = input.value
- component: remote-extension-host-agent-server
  name: ext-host-connections-delete
  kind: store
  summary: con.onClose -> delete _extHostConnections[token]
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:495-498
  store:
    table: ext_host_connections
    op: delete
    key: = input.token
- component: extension-host-connection
  name: send-socket-to-extension-host
  kind: function
  summary: '_sendSocketToExtensionHost: drain pending writes, then extensionHostProcess.send(VSCODE_EXTHOST_IPC_SOCKET, socket).'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:190-201
  request:
    type: object
    properties:
      token:
        type: string
  behavior:
  - call: extension-host-connection.processes-get
    input:
      token: = input.token
    as: p
  - if: '!has(vars.p.value.token)'
    then:
    - title: The extension host process is gone
      source: src/vs/server/node/extensionHostConnection.ts:220-224
      return:
        sent: false
  - call: extension-host-connection.processes-put
    input:
      token: = input.token
      value: '= merge(vars.p.value, {''status'': ''running'', ''socket_sent'': true, ''sockets_sent'': (has(vars.p.value.sockets_sent) ? vars.p.value.sockets_sent : 0) + 1})'
  - return:
      sent: true
- component: extension-host-connection
  name: accept-reconnection
  kind: function
  summary: 'acceptReconnection: keep the new socket until the process starts, else send it to the running extension host.'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:213-226
  request:
    type: object
    properties:
      token:
        type: string
  behavior:
  - call: extension-host-connection.processes-get
    input:
      token: = input.token
    as: p
  - if: '!has(vars.p.value.token)'
    then:
    - title: The extension host didn't even start up yet; keep the connection data
      source: src/vs/server/node/extensionHostConnection.ts:220-224
      return:
        sent: false
  - title: Send the new socket to the running extension host
    source: src/vs/server/node/extensionHostConnection.ts:226
    call: extension-host-connection.send-socket-to-extension-host
    input:
      token: = input.token
    as: s
  - return: = vars.s.value
- component: extension-host-connection
  name: shorten-reconnection-grace-time-if-necessary
  kind: function
  summary: 'shortenReconnectionGraceTimeIfNecessary: every forked extension host gets VSCODE_EXTHOST_IPC_REDUCE_GRACE_TIME.'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:203-211
  behavior:
  - call: extension-host-connection.processes-query
    input: {}
    as: all
  - foreach: = vars.all.value
    as: p
    steps:
    - title: send({type VSCODE_EXTHOST_IPC_REDUCE_GRACE_TIME})
      source: src/vs/server/node/extensionHostConnection.ts:207-210
      call: extension-host-connection.processes-put
      input:
        token: = vars.p.token
        value: '= merge(vars.p, {''grace_reduced'': true})'
  - return:
      notified: = size(vars.all.value)
- component: extension-host-connection
  name: on-process-exit
  kind: event
  summary: 'extensionHostProcess ''exit'': remember {code, signal} by reconnection token, then _cleanResources (kill, onClose: the server forgets the connection and its lifetime token).'
  sources:
  - src/vs/server/node/extensionHostConnection.ts:303-307
  request:
    type: object
    properties:
      token:
        type: string
        examples:
        - tok-eh1
      code:
        type: integer
      signal:
        type:
        - string
        - 'null'
  behavior:
  - call: extension-host-connection.processes-get
    input:
      token: = input.token
    as: p
  - if: '!has(vars.p.value.token)'
    then:
    - title: Already cleaned up (_disposed)
      source: src/vs/server/node/extensionHostConnection.ts:229-232
      return:
        cleaned: false
  - title: setExitInfo(reconnectionToken, {code, signal})
    source: src/vs/server/node/extensionHostConnection.ts:304
    call: extension-host-status-service.set-exit-info
    input:
      token: = input.token
      exit:
        code: = input.code
        signal: '= has(input.signal) ? input.signal : null'
  - title: _cleanResources drops the process
    source: src/vs/server/node/extensionHostConnection.ts:228-244
    call: extension-host-connection.processes-delete
    input:
      token: = input.token
  - title: onClose -> the server deletes the connection and releases its lifetime token
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:495-499
    call: remote-extension-host-agent-server.ext-host-connections-delete
    input:
      token: = input.token
  - call: server-lifetime-service.inactive
    input:
      consumer: = 'ExtensionHost:' + input.token
    on_error: continue
  - return:
      cleaned: true
- component: extension-host-connection
  name: processes-get
  kind: store
  summary: _extensionHostProcess of the connection
  sources:
