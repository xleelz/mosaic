- component: user-data-auto-sync-service
  name: on-did-finish-sync
  kind: function
  summary: 'onDidFinishSync: reset failures, or turn off / suspend / count the failure depending on the error'
  sources:
  - src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:219-309
  request:
    type: object
    properties:
      error_code:
        type: string
  behavior:
  - if: input.error_code == ''
    then:
    - set:
        state.successive_failures: 0
    - return:
        handled: ok
  - set:
      state.last_error: = input.error_code
  - if: input.error_code in ['session-expired', 'turned-off', 'method-not-found', 'incompatible-local-content', 'incompatible-remote-content']
    then:
    - title: Soft turn off (machine removed)
      source: src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:230-283
      call: user-data-auto-sync-service.turn-off
      input:
        everywhere: false
        soft: true
        donot_remove_machine: false
    - return:
        handled: turned-off
  - if: input.error_code == 'local-too-many-requests'
    then:
    - title: Suspended until restart
      source: src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:243-248
      set:
        state.suspend_until_restart: true
        state.auto_sync_running: false
    - return:
        handled: suspended
  - if: input.error_code in ['remote-too-many-requests', 'upgrade-required', 'gone']
    then:
    - title: Soft turn off keeping the machine, and disable the machine eventually (10 min)
      source: src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:250-270
      call: user-data-auto-sync-service.turn-off
      input:
        everywhere: false
        soft: true
        donot_remove_machine: true
    - set:
        state.disable_machine_eventually: true
    - return:
        handled: turned-off
  - title: Other errors count as successive failures (trigger delay backs off)
    source: src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:300-304
    set:
      state.successive_failures: = state.successive_failures + 1
  - return:
      handled: counted
- component: user-data-auto-sync-service
