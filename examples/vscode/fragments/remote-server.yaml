      evil: false
      golang: true
  steps:
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: idfalse
    input:
      id: test.extension
      publisher: test
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: stablepre
    input:
      id: ms-python.python
      publisher: ms-python
      prerelease: true
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: stablerel
    input:
      id: ms-python.python
      publisher: ms-python
      prerelease: false
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: verok
    input:
      id: redhat.java
      publisher: redhat
      version: 1.2.3
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: verbad
    input:
      id: redhat.java
      publisher: redhat
      version: 1.2.4
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: verplat
    input:
      id: redhat.java
      publisher: redhat
      version: 2.0.0
      target_platform: darwin-arm64
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: pubfalse
    input:
      id: evil.tool
      publisher: evil
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: pubtrue
    input:
      id: golang.go
      publisher: golang
  - interface: allowed-extensions-service.is-allowed
    caller: user
    as: unlisted
    input:
      id: other.ext
      publisher: other
  expect:
  - '!steps.idfalse.result.value.allowed && steps.idfalse.result.value.reason == ''it is not in the allowed list'''
  - '!steps.stablepre.result.value.allowed && steps.stablerel.result.value.allowed'
  - steps.verok.result.value.allowed && !steps.verbad.result.value.allowed && !steps.verplat.result.value.allowed
