      desired_connection_type: management
      is_reconnection: false
      reconnection_token: tok-o
      signature_valid: false
  expect:
  - steps.hs.result.ok && 'tok-o' in state['remote-extension-host-agent-server@srv1'].management_connections
- id: remote-server-ext-host-fork
  description: An extension-host connection forks bootstrap-fork --type=extensionHost (with --inspect-brk for a debug port and --supportGlobalNavigator when configured) and hands it the socket once it is
    ready (extensionHostConnection.ts:247-322).
  fixtures:
  - remote-server-srv1
  config:
    extensions-support-node-global-navigator: true
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input:
      auth: tok-dev
      commit: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
      desired_connection_type: extension-host
      is_reconnection: false
      reconnection_token: tok-eh1
      start_params:
        language: de
        port: 9333
        break: true
  expect:
  - steps.eh.result.ok && 'tok-eh1' in state['remote-extension-host-agent-server@srv1'].ext_host_connections
  - state['extension-host-connection@srv1'].processes['tok-eh1'].module == 'bootstrap-fork' && state['extension-host-connection@srv1'].processes['tok-eh1'].args == ['--type=extensionHost', '--transformURIs',
    '--useHostProxy=false', '--supportGlobalNavigator']
  - state['extension-host-connection@srv1'].processes['tok-eh1'].exec_argv == ['--dns-result-order=ipv4first', '--inspect-brk=9333', '--experimental-network-inspection'] && state['extension-host-connection@srv1'].processes['tok-eh1'].language
    == 'de'
  - state['extension-host-connection@srv1'].processes['tok-eh1'].status == 'running' && state['extension-host-connection@srv1'].processes['tok-eh1'].socket_sent
  - state['server-lifetime-service@srv1'].total == 1
- id: remote-server-ext-host-exit-then-read
  description: When the forked extension host exits, its {code, signal} is remembered by token and the window can read it back over remoteextensionsenvironment; the server forgets the connection and its
    lifetime token.
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input:
      auth: tok-dev
      commit: ''
      desired_connection_type: extension-host
      is_reconnection: false
      reconnection_token: tok-eh1
  - flow: rs-remote-ext-host-exit
    as: exit
    'on': srv1
    input:
      token: tok-eh1
      code: 1
      signal: null
  - flow: rs-remote-ext-host-exit
    as: again
    'on': srv1
    input:
      token: tok-eh1
      code: 1
      signal: null
  - flow: rs-remote-ext-host-exit-info
    as: info
    'on': srv1
    input:
      reconnection_token: tok-eh1
  - flow: rs-remote-ext-host-exit-info
    as: unknown
    'on': srv1
    input:
      reconnection_token: tok-other
  expect:
  - steps.exit.result.value.cleaned && !steps.again.result.value.cleaned
  - steps.info.result.value.exit_info.code == 1 && steps.unknown.result.value.exit_info == null
  - '!(''tok-eh1'' in state[''remote-extension-host-agent-server@srv1''].ext_host_connections) && !(''tok-eh1'' in state[''extension-host-connection@srv1''].processes)'
  - state['server-lifetime-service@srv1'].total == 0
- id: remote-server-ext-host-reconnect
  description: 'Extension host reconnection: the known token gets the new socket sent to the running process; an unknown token is refused, a fresh connection with a live token is a duplicate (remoteExtensionHostAgentServer.ts:462-486).'
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input:
      auth: tok-dev
      commit: ''
      desired_connection_type: extension-host
      is_reconnection: false
      reconnection_token: tok-eh1
  - flow: rs-remote-ext-host-connect
    as: re
    input:
      auth: tok-dev
      commit: ''
      desired_connection_type: extension-host
      is_reconnection: true
      reconnection_token: tok-eh1
  - flow: rs-remote-ext-host-connect
    as: dup
    input:
      auth: tok-dev
      commit: ''
      desired_connection_type: extension-host
      is_reconnection: false
      reconnection_token: tok-eh1
  - flow: rs-remote-ext-host-connect
    as: never
    input:
      auth: tok-dev
      commit: ''
      desired_connection_type: extension-host
      is_reconnection: true
      reconnection_token: tok-zz
  expect:
  - steps.re.result.value.reconnected && state['extension-host-connection@srv1'].processes['tok-eh1'].sockets_sent == 2
  - steps.dup.result.error.message == 'Duplicate reconnection token' && steps.never.result.error.message == 'Unknown reconnection token (never seen)'
  - state['extension-host-connection@srv1'].processes['tok-eh1'].grace_reduced
- id: remote-server-ext-host-reconnect-seen-before
  description: A token the server saw before, but whose extension host connection is gone, is refused as seen before.
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-ext-host-connect
    as: eh
    input:
      auth: tok-dev
