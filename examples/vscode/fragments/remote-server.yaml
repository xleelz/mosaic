    - fail:
        code: malicious
        message: = "Can't install '" + input.gallery.id + "' extension since it was reported to be problematic."
  - title: canInstall consults extensions.allowed
    source: src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:79-82
    call: allowed-extensions-service.is-allowed
    input:
      id: = input.gallery.id
      publisher: '= has(input.gallery.publisher) ? input.gallery.publisher : input.gallery.id.split(''.'')[0]'
    as: allowed
  - if: '!vars.allowed.value.allowed'
    then:
    - title: canInstall() !== true is reported as an incompatible target platform
      detail: checkAndGetCompatibleVersion throws IncompatibleTargetPlatform for any canInstall refusal, including an extensions.allowed refusal.
      source: src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:730-733
      fail:
        code: incompatible-target-platform
        message: = "The '" + input.gallery.id + "' extension is not available for this platform."
  - title: Find a compatible version
    source: src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:735-743
    call: extension-gallery-service.get-compatible-extension
    input:
      id: = input.gallery.id
    as: compat
  - if: vars.compat.value == null
    then:
    - fail:
        code: incompatible
        message: = "Can't install '" + input.gallery.id + "' extension because it is not compatible with the current version."
  - title: Fetch the manifest
    source: src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:746-753
    call: extension-gallery-service.get-manifest
    input:
      id: = input.gallery.id
