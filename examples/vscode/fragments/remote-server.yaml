  name: run-sync-task
  kind: function
  summary: 'task.run -> sync(): status Syncing, sync each enabled synchroniser (default profile first), bail out on fatal errors'
  sources:
  - src/vs/platform/userDataSync/common/userDataSyncService.ts:141-151
  - src/vs/platform/userDataSync/common/userDataSyncService.ts:233-259
  - src/vs/platform/userDataSync/common/userDataSyncService.ts:750-798
  request:
    type: object
    properties:
      manifest:
        type:
        - object
        - 'null'
  behavior:
  - if: state.status != 'has-conflicts'
    then:
    - set:
        state.status: syncing
  - call: user-data-sync-enablement-service.is-enabled
    input: {}
    as: en
  - if: vars.en.value.resources.settings
    then:
    - call: settings-synchroniser.sync
      input: {}
      as: s
      on_error:
      - if: error.code in ['method-not-found', 'too-large', 'remote-too-many-requests', 'too-many-requests-and-retry-after', 'local-too-many-requests', 'gone', 'upgrade-required', 'incompatible-remote-content',
          'incompatible-local-content']
        then:
        - title: canBailout errors abort the whole sync
          source: src/vs/platform/userDataSync/common/userDataSyncService.ts:780-784
          set:
            state.status: idle
        - fail: '= {''code'': error.code, ''status'': error.status, ''message'': error.message}'
  - title: Status from the synchronisers (HasConflicts wins)
    source: src/vs/platform/userDataSync/common/userDataSyncService.ts:869-878
    call: settings-synchroniser.get-status
    input: {}
    as: st
  - set:
      state.status: '= vars.st.value.status == ''has-conflicts'' ? ''has-conflicts'' : ''idle'''
      state.conflicts: '= vars.st.value.status == ''has-conflicts'' ? [''settings''] : []'
      state.last_sync_time: = now
      state.previously_synced: true
