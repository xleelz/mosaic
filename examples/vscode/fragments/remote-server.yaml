- id: remote-server-marketplace
  summary: A product with a Marketplace (product.json extensionsGallery.serviceUrl set); the OSS product.json has none.
  extends:
  - one-window-folder
  - remote-server-seed
  config:
    product-extensions-gallery-service-url: https://marketplace.example/_apis/public/gallery
- id: remote-server-sync
  summary: A product with a settings sync store (product.json configurationSync.store set); the OSS product.json has none.
  extends:
  - one-window-folder
  - remote-server-seed
  config:
    product-configuration-sync-store-url: https://sync.example/v1
- id: remote-server-srv1
  summary: 'A remote folder: window w1 connects to the remote server instance srv1, which was started with --connection-token tok-dev (the resolver result for ssh-remote+dev-box, and for the shared remote-folder
    authority ssh-remote+devbox, carries that token).'
  extends:
  - one-window-folder
  - remote-server-seed
  topology:
    remote-server-process:
    - srv1
  state:
    remote-extension-host-agent-server:
      args:
        connection_token: tok-dev
