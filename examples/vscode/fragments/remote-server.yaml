# remote-server area fragment (VS Code 1.144.0). Generated from the area agent's parts, then edited by the fix round (see notes/remote-server.md).
schema_version: 1
id: vscode
configs:
- id: extensions-auto-update
  type: string
  value: 'on'
  default: 'on'
  summary: 'extensions.autoUpdate: ''on'' or ''off'' (code maps legacy true/onlyEnabledExtensions to ''on'' and false/onlySelectedExtensions to ''off''). product.json does not override it.'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:139-148
  - src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1225-1231
  attributes:
    key: extensions.autoUpdate
- id: extensions-auto-update-delay
  type: integer
  value: 12
  default: 12
  summary: 'extensions.autoUpdateDelay in hours: a published update is auto-installed only after this delay (not for product-trusted publishers)'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:172-175
  - src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:1261-1264
  attributes:
    key: extensions.autoUpdateDelay
    unit: hours
- id: extensions-auto-check-updates
  type: boolean
  value: true
  default: true
  summary: 'extensions.autoCheckUpdates: check the gallery for updates periodically'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:190-195
  - src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2216-2221
  attributes:
    key: extensions.autoCheckUpdates
- id: extensions-verify-signature
  type: boolean
  value: true
  default: true
  summary: 'extensions.verifySignature (native only): verify gallery packages are signed before install'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:331-337
  - src/vs/platform/extensionManagement/node/extensionManagementService.ts:341-344
  attributes:
    key: extensions.verifySignature
- id: extensions-request-timeout
  type: integer
  value: 60000
  default: 60000
  summary: extensions.requestTimeout in ms for Marketplace HTTP requests
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:401-406
  - src/vs/platform/extensionManagement/common/extensionManagement.ts:736
  attributes:
    key: extensions.requestTimeout
    unit: ms
- id: extensions-allowed
  value: '*'
  default: '*'
  summary: 'extensions.allowed (policy AllowedExtensions). Declared type object, code default the string ''*''. Any non-object value, or exactly {''*'': true}, allows everything. Otherwise an object keyed
    by extension id or publisher (lower-cased) whose values are true, false, ''stable'' or a list of versions (''1.2.3'' or ''1.2.3@linux-x64''). Deployed = default.'
  sources:
  - src/vs/platform/extensionManagement/common/extensionManagement.ts:745-750
  - src/vs/platform/extensionManagement/common/allowedExtensionsService.ts:55-64
  attributes:
    key: extensions.allowed
- id: product-extensions-gallery-service-url
  type: string
  value: ''
  default: ''
  summary: product.json extensionsGallery.serviceUrl. The OSS product.json built from this commit has no extensionsGallery, so the gallery manifest is Unavailable and every gallery operation refuses. Scenarios
    set a URL to model a Marketplace-enabled build.
  sources:
  - src/vs/base/common/product.ts:147-150
  - src/vs/platform/extensionManagement/common/extensionGalleryManifestService.ts:31-33
  attributes:
    key: product.extensionsGallery.serviceUrl
    source_file: product.json
- id: product-configuration-sync-store-url
  type: string
  value: ''
  default: ''
  summary: product.json configurationSync.store.url. Absent in the OSS product.json, so the sync store is undefined, settings sync is Uninitialized and its commands are never registered. Scenarios set a
    URL to model a sync-enabled build.
  sources:
  - src/vs/base/common/product.ts:272
  - src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:80-87
  attributes:
    key: product.configurationSync.store
    source_file: product.json
- id: product-builtin-extensions-enabled-with-auto-updates
  type: array
  value:
  - GitHub.copilot-chat
  default: []
  summary: 'product.json builtInExtensionsEnabledWithAutoUpdates: built-ins that may be installed/updated from the gallery'
  sources:
  - product.json:245-247
  - src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2638-2642
  attributes:
    key: product.builtInExtensionsEnabledWithAutoUpdates
    source_file: product.json
- id: environment-is-built
  type: boolean
  value: true
  default: true
  summary: 'environmentService.isBuilt: true unless VSCODE_DEV is set (running out of sources). Gates signature enforcement and the server''s unauthorized-client refusal.'
  sources:
  - src/vs/platform/environment/common/environmentService.ts:231
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:373-378
- id: extensions-updates-check-interval-ms
  type: integer
  value: 43200000
  default: 43200000
  summary: 'ExtensionsWorkbenchService.UpdatesCheckInterval: 12 hours between update checks (1 hour on insider with a pending product update)'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:978
  - src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2233-2238
- id: extensions-download-retries
  type: integer
  value: 2
  default: 2
  summary: ExtensionsDownloader retries a failed VSIX or signature download twice (three attempts)
  sources:
  - src/vs/platform/extensionManagement/node/extensionDownloader.ts:126
  - src/vs/platform/extensionManagement/node/extensionDownloader.ts:210-222
- id: remote-reconnection-grace-time-ms
  type: integer
  value: 10800000
  default: 10800000
  summary: ProtocolConstants.ReconnectionGraceTime (3 h); the server's --reconnection-grace-time overrides it
  sources:
  - src/vs/base/parts/ipc/common/ipc.net.ts:304
  - src/vs/server/node/serverEnvironmentService.ts:280
- id: remote-reconnection-short-grace-time-ms
  type: integer
  value: 300000
  default: 300000
  summary: 'ProtocolConstants.ReconnectionShortGraceTime (5 min): the server shortens a disconnected connection''s grace to this once another client connects'
  sources:
  - src/vs/base/parts/ipc/common/ipc.net.ts:308
  - src/vs/server/node/remoteExtensionManagement.ts:59-60
- id: remote-reconnect-timeout-ms
  type: integer
  value: 30000
  default: 30000
  summary: 'RECONNECT_TIMEOUT: each reconnection attempt is cancelled after 30 s'
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:24
  - src/vs/platform/remote/common/remoteAgentConnection.ts:696
- id: remote-handshake-timeout-ms
  type: integer
  value: 10000
  default: 10000
  summary: The client waits at most 10 s for the server's sign request during the handshake
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:266
- id: remote-initial-connection-max-attempts
  type: integer
  value: 5
  default: 5
  summary: createInitialConnection tries 5 times before a permanent failure
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:438
- id: remote-disconnect-prompt-time-ms
  type: integer
  value: 40000
  default: 40000
  summary: 'DISCONNECT_PROMPT_TIME: the reconnect progress is shown when no data arrived for 40 s'
  sources:
  - src/vs/workbench/contrib/remote/browser/remote.ts:785
- id: remote-reconnect-wait-times-s
  type: array
  value:
  - 0
  - 5
  - 5
  - 10
  - 10
  - 10
  - 10
  - 10
  - 30
  default:
  - 0
  - 5
  - 5
  - 10
  - 10
  - 10
  - 10
  - 10
  - 30
  summary: Seconds to wait before each reconnection attempt (the last value repeats)
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:660
- id: settings-sync-auto-sync-interval-ms
  type: integer
  value: 300000
  default: 300000
  summary: AutoSync runs every 5 minutes after the previous sync finishes
  sources:
  - src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:127
  - src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:414-419
- id: settings-sync-trigger-delay-ms
  type: integer
  value: 3000
  default: 3000
  summary: Activity-triggered sync debounce (0 when the last sync started more than 10 s ago; linear back-off on failures, max 60 s)
  sources:
  - src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:360-366
  - src/vs/platform/userDataSync/common/userDataAutoSyncService.ts:353-355
- id: settings-sync-request-session-limit
  type: integer
  value: 100
  default: 100
  summary: RequestsSession allows 100 sync requests per session window
  sources:
  - src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:48
  - src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:741-744
- id: settings-sync-request-session-interval-ms
  type: integer
  value: 300000
  default: 300000
  summary: 'RequestsSession window: 5 minutes'
  sources:
  - src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:49
  - src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:752-754
- id: server-shutdown-timeout-ms
  type: integer
  value: 300000
  default: 300000
  summary: 'ServerLifetimeService SHUTDOWN_TIMEOUT: grace before auto-shutdown once no consumer is active (only with auto-shutdown enabled)'
  sources:
  - src/vs/server/node/serverLifetimeService.ts:13
- id: remote-max-port-number
  type: integer
  value: 65536
  default: 65536
  summary: Port numbers at or above this are refused by the Forward Port input validation
  sources:
  - src/vs/workbench/contrib/remote/browser/tunnelView.ts:1107
  - src/vs/workbench/contrib/remote/browser/tunnelView.ts:1123
- id: settings-sync-ignored-extensions
  type: array
  value: []
  default: []
  summary: 'settingsSync.ignoredExtensions: extensions never synced (''-id'' forces sync)'
  sources:
  - src/vs/platform/userDataSync/common/userDataSync.ts:97-108
  - src/vs/platform/userDataSync/common/ignoredExtensions.ts:32-35
  attributes:
    key: settingsSync.ignoredExtensions
- id: extensions-support-node-global-navigator
  type: boolean
  value: false
  default: false
  summary: extensions.supportNodeGlobalNavigator. When true the remote extension host is forked with --supportGlobalNavigator. Deployed = default.
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:396-400
  - src/vs/server/node/extensionHostConnection.ts:287-289
  attributes:
    key: extensions.supportNodeGlobalNavigator
schemas:
- id: RemoteServerGalleryExtension
  schema:
    type: object
    properties:
      id:
        type: string
        examples:
        - ms-python.python
      publisher:
        type: string
        examples:
        - ms-python
      version:
        type: string
        examples:
        - 2026.18.0
      signed:
        type: boolean
        default: true
      compatible:
        type: boolean
        default: true
      last_updated:
        type: integer
- id: RemoteServerLocalExtension
  schema:
    type: object
    properties:
      id:
        type: string
        examples:
        - ms-python.python
      version:
        type: string
        examples:
        - 2026.18.0
      source:
        type: string
        enum:
        - gallery
        - vsix
        - resource
      pinned:
        type: boolean
        default: false
      is_builtin:
        type: boolean
        default: false
      installed_timestamp:
        type: integer
- id: RemoteServerInstallRequest
  schema:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - ms-python.python
      version:
        type: string
        default: ''
      install_pre_release_version:
        type: boolean
        default: false
      pinned:
        type: boolean
        default: false
