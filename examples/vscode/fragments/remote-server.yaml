- component: management-persistent-connection
  name: on-did-state-change
  kind: event
  summary: onDidStateChange (ConnectionLost, ReconnectionWait, ReconnectionRunning, ConnectionGain, ReconnectionPermanentFailure)
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:476-530
  request:
    type: object
    properties:
      type:
        type: string
      attempt:
        type: integer
      millis_since_last_incoming_data:
        type: integer
      handled:
        type: boolean
      duration_seconds:
        type: integer
- component: management-persistent-connection
  name: on-socket-close
  kind: event
  summary: protocol.onSocketClose / onSocketTimeout -> _beginReconnecting (only one loop at a time).
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:584-606
  - src/vs/platform/remote/common/remoteAgentConnection.ts:639-650
  request:
    type: object
    properties:
      millis_since_last_incoming_data:
        type: integer
        default: 45000
      remote_authority:
        type: string
        examples:
        - ssh-remote+dev-box
      commit:
        type: string
        examples:
        - 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
  behavior:
  - if: state.is_reconnecting
    then:
    - title: Only one reconnection loop at a time
      source: src/vs/platform/remote/common/remoteAgentConnection.ts:640-643
      return:
        started: false
  - set:
      state.is_reconnecting: true
  - call: management-persistent-connection.run-reconnecting-loop
    input: = input
    as: loop
    on_error: continue
  - set:
      state.is_reconnecting: false
  - return:
      started: true
- component: management-persistent-connection
  name: run-reconnecting-loop
  kind: function
  summary: '_runReconnectingLoop: wait 0,5,5,10..30 s between attempts within the grace time; permanent errors stop it.'
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:652-746
  request:
    type: object
    properties:
      millis_since_last_incoming_data:
        type: integer
      remote_authority:
        type: string
      commit:
        type: string
  behavior:
  - if: state.permanent_failure || state.disposed
    then:
    - title: No more attempts after a permanent failure
      source: src/vs/platform/remote/common/remoteAgentConnection.ts:653-656
      return:
        outcome: permanent-failure
  - title: Fire ConnectionLost
    source: src/vs/platform/remote/common/remoteAgentConnection.ts:659
    set:
      state.connection_state: connection-lost
  - publish: management-persistent-connection.on-did-state-change
    input:
      type: connection-lost
      attempt: 0
      millis_since_last_incoming_data: = input.millis_since_last_incoming_data
      handled: false
    delivery: sync
  - if: state.grace_time_ms <= 0
    then:
    - title: Grace time 0 ms, will not attempt to reconnect
      source: src/vs/platform/remote/common/remoteAgentConnection.ts:663-667
      call: management-persistent-connection.go-to-permanent-failure
      input:
        attempt: 0
        handled: false
    - return:
        outcome: permanent-failure
  - set:
      vars.grace_deadline: = now + state.grace_time_ms
      vars.outcome: gave-up
  - title: 'do { attempt++; wait TIMES[attempt] (the last value, 30 s, repeats) } while (!permanent failure): no attempt limit, only the grace time ends it (the model bounds the loop at 1000 attempts, far
      beyond 3 h)'
    source: src/vs/platform/remote/common/remoteAgentConnection.ts:669-745
    foreach: '= lists.range(1000).map(i, i < size(config[''remote-reconnect-wait-times-s'']) ? config[''remote-reconnect-wait-times-s''][i] : config[''remote-reconnect-wait-times-s''][size(config[''remote-reconnect-wait-times-s''])
      - 1])'
    as: wait_s
    index: attempt
    max: 1000
    steps:
    - if: vars.wait_s > 0
      then:
      - publish: management-persistent-connection.on-did-state-change
        input:
          type: reconnection-wait
          attempt: = vars.attempt
          millis_since_last_incoming_data: = input.millis_since_last_incoming_data
          handled: false
          duration_seconds: = vars.wait_s
        delivery: sync
      - title: Sleep before reconnecting
        source: src/vs/platform/remote/common/remoteAgentConnection.ts:676-685
        wait: = vars.wait_s * 1000
    - title: Fire ReconnectionRunning
      source: src/vs/platform/remote/common/remoteAgentConnection.ts:692
      publish: management-persistent-connection.on-did-state-change
      input:
        type: reconnection-running
        attempt: = vars.attempt + 1
        millis_since_last_incoming_data: = input.millis_since_last_incoming_data
        handled: false
      delivery: sync
    - title: Reconnect with the same token (30 s timeout)
      source: src/vs/platform/remote/common/remoteAgentConnection.ts:693-697
      call: remote-agent-connection.do-connect-remote-agent-management
      input:
        remote_authority: = input.remote_authority
        reconnection_token: = state.reconnection_token
        commit: = input.commit
        is_reconnection: true
      timeout_ms: = config['remote-reconnect-timeout-ms']
      as: r
      on_error: continue
    - if: vars.r.ok
      then:
      - title: Reconnected; fire ConnectionGain
        source: src/vs/platform/remote/common/remoteAgentConnection.ts:698-701
        set:
          state.connection_state: connection-gain
          state.attempts: = vars.attempt + 1
          vars.outcome: reconnected
      - publish: management-persistent-connection.on-did-state-change
        input:
          type: connection-gain
          attempt: = vars.attempt + 1
          millis_since_last_incoming_data: 0
          handled: false
        delivery: sync
      - break: true
    - if: vars.r.error.code == 'connection-error'
      then:
      - title: VSCODE_CONNECTION_ERROR is permanent
        source: src/vs/platform/remote/common/remoteAgentConnection.ts:703-707
        call: management-persistent-connection.go-to-permanent-failure
        input:
          attempt: = vars.attempt + 1
          handled: false
      - set:
          vars.outcome: permanent-failure
      - break: true
    - if: now >= vars.grace_deadline
      then:
      - title: Error after the grace time expired is permanent
        source: src/vs/platform/remote/common/remoteAgentConnection.ts:708-714
        call: management-persistent-connection.go-to-permanent-failure
        input:
          attempt: = vars.attempt + 1
          handled: false
      - set:
          vars.outcome: permanent-failure
      - break: true
    - if: vars.r.error.code in ['temporarily-not-available', 'econnrefused', 'etimedout', 'enetunreach', 'econnreset', 'timeout', 'canceled']
      then:
      - title: 'Temporarily unavailable, network or cancellation error: try again'
        source: src/vs/platform/remote/common/remoteAgentConnection.ts:715-732
        continue: true
    - if: vars.r.error.code == 'remote-authority-resolver-error'
      then:
      - title: RemoteAuthorityResolverError is permanent
        source: src/vs/platform/remote/common/remoteAgentConnection.ts:733-738
        call: management-persistent-connection.go-to-permanent-failure
        input:
          attempt: = vars.attempt + 1
          handled: false
      - set:
          vars.outcome: permanent-failure
      - break: true
    - title: Unknown error is treated as permanent
      source: src/vs/platform/remote/common/remoteAgentConnection.ts:739-742
      call: management-persistent-connection.go-to-permanent-failure
      input:
        attempt: = vars.attempt + 1
        handled: false
    - set:
        vars.outcome: permanent-failure
    - break: true
  - return:
      outcome: = vars.outcome
- component: management-persistent-connection
  name: go-to-permanent-failure
  kind: function
  summary: '_onReconnectionPermanentFailure: management connections are fatal (triggerPermanentFailure for every connection); fires ReconnectionPermanentFailure.'
  sources:
  - src/vs/platform/remote/common/remoteAgentConnection.ts:748-761
  - src/vs/platform/remote/common/remoteAgentConnection.ts:534-540
  request:
    type: object
    properties:
      attempt:
        type: integer
      handled:
        type: boolean
  behavior:
  - set:
      state.permanent_failure: true
      state.connection_state: reconnection-permanent-failure
      state.attempts: = input.attempt
  - publish: management-persistent-connection.on-did-state-change
    input:
      type: reconnection-permanent-failure
      attempt: = input.attempt
      millis_since_last_incoming_data: 0
      handled: = input.handled
    delivery: sync
- component: remote-agent-connection-status-listener
  name: on-did-state-change
  kind: event
  summary: 'connection.onDidStateChange listener: progress, reload dialog.'
  sources:
  - src/vs/workbench/contrib/remote/browser/remote.ts:892-1050
  subscribe:
  - management-persistent-connection.on-did-state-change
  request:
    type: object
    properties:
      type:
        type: string
      attempt:
        type: integer
      millis_since_last_incoming_data:
        type: integer
      handled:
        type: boolean
  behavior:
  - if: input.type == 'connection-lost'
    then:
    - if: state.visible_progress != 'none' || input.millis_since_last_incoming_data > config['remote-disconnect-prompt-time-ms']
      then:
      - title: Connection Lost (shown after 40 s without data)
        source: src/vs/workbench/contrib/remote/browser/remote.ts:917-922
        set:
          state.visible_progress: dialog
          state.last_report: Connection Lost
    - return: {}
  - if: input.type == 'reconnection-running'
    then:
    - set:
        state.attempts: = input.attempt
    - if: state.visible_progress != 'none' || input.millis_since_last_incoming_data > config['remote-disconnect-prompt-time-ms']
      then:
      - title: Disconnected. Attempting to reconnect...
        source: src/vs/workbench/contrib/remote/browser/remote.ts:959-962
        set:
          state.visible_progress: dialog
          state.last_report: Disconnected. Attempting to reconnect...
    - return: {}
  - if: input.type == 'reconnection-permanent-failure'
    then:
    - title: Hide the progress
      source: src/vs/workbench/contrib/remote/browser/remote.ts:1004
      set:
        state.visible_progress: none
    - if: input.handled
      then:
      - title: Handled by the resolver; no notification
        source: src/vs/workbench/contrib/remote/browser/remote.ts:1006-1007
        return: {}
    - if: '!state.reload_window_shown'
      then:
      - title: Cannot reconnect. Please reload the window.
        source: src/vs/workbench/contrib/remote/browser/remote.ts:1007-1018
        set:
          state.reload_window_shown: true
          state.last_report: Cannot reconnect. Please reload the window.
      - choice: reload
        default: reload-window
        options:
          reload-window:
          - call: command-service.execute-command
            input:
              command_id: workbench.action.reloadWindow
              args: []
          dismiss: []
    - return: {}
  - if: input.type == 'connection-gain'
    then:
    - title: Connected again; hide the progress
      source: src/vs/workbench/contrib/remote/browser/remote.ts:1021-1050
      set:
        state.visible_progress: none
        state.attempts: = input.attempt
