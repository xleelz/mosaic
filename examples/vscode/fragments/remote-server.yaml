      pinned:
        type: boolean
  response: RemoteServerLocalExtension
  errors:
  - code: not-allowed
    status: 0
    retryable: false
    summary: Marketplace is not enabled
  - code: malicious
    status: 0
    retryable: false
  - code: incompatible-target-platform
    status: 0
    retryable: false
  - code: incompatible
    status: 0
    retryable: false
  - code: invalid
    status: 0
