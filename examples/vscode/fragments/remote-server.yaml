- component: remote-extension-host-agent-server
  name: handle-request
  kind: http
  summary: 'handleRequest: GET only; /version and /delay-shutdown need no token; then the connection-token gate (403); /vscode-remote-resource; web client; else 404.'
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:115-199
  request:
    type: object
    properties:
      method:
        type: string
        default: GET
      path:
        type: string
      tkn:
        type:
        - string
        - 'null'
        default: null
      tkns:
        type: array
        items:
          type: string
        default: []
      cookie:
        type:
        - string
        - 'null'
        default: null
      origin:
        type:
        - string
        - 'null'
        default: null
      resource_paths:
        type: array
        items:
          type: string
        default: []
      has_web_client:
        type: boolean
        default: false
  errors:
  - code: method-not-allowed
    status: 405
    retryable: false
  - code: bad-request
    status: 400
    retryable: false
  - code: forbidden
    status: 403
    retryable: false
  - code: not-found
    status: 404
    retryable: false
  behavior:
  - set:
      vars.method: '= has(input.method) ? input.method : ''GET'''
      vars.path: '= has(input.path) ? input.path : '''''
  - if: vars.method != 'GET'
    then:
    - title: Only GET is served
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:117-119
      fail:
        code: method-not-allowed
        status: 405
        message: = 'Unsupported method ' + vars.method
  - if: vars.path == ''
    then:
    - title: No URL
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:121-123
      fail:
        code: bad-request
        status: 400
        message: Bad request.
  - if: vars.path == '/version'
    then:
    - title: /version returns the commit (no token needed)
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:145-148
      return:
        status: 200
        body: = state.commit
  - if: vars.path == '/delay-shutdown'
    then:
    - title: /delay-shutdown resets the auto-shutdown timer (no token needed)
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:151-155
      call: server-lifetime-service.delay
      input: {}
    - return:
        status: 200
        body: OK
  - title: Check the tkn query parameter, then the vscode-tkn cookie, against the server's token
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:157
    call: server-connection-token.request-has-valid-connection-token
    input:
      token_type: = state.connection_token_type
      token_value: = state.connection_token
      query_tkns: '= has(input.tkns) && size(input.tkns) > 0 ? input.tkns : (has(input.tkn) && input.tkn != null ? [input.tkn] : [])'
      cookie: '= has(input.cookie) ? input.cookie : null'
    as: gate
  - if: '!vars.gate.value.valid'
    then:
    - title: Invalid connection token -> 403 Forbidden
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:157-160
      fail:
        code: forbidden
        status: 403
        message: Forbidden.
  - if: vars.path == '/vscode-remote-resource'
    then:
    - if: '!has(input.resource_paths) || size(input.resource_paths) != 1'
      then:
      - title: Exactly one path parameter
        source: src/vs/server/node/remoteExtensionHostAgentServer.ts:165-168
        fail:
          code: bad-request
          status: 400
          message: Bad request.
    - title: 'Response headers: a sandboxing CSP, nosniff, Vary: Origin; CORS only for the native workbench origin or an allowed web endpoint'
      source: src/vs/server/node/remoteResourceResponse.ts:10-22
      set:
        vars.headers: '= merge({''Content-Security-Policy'': "default-src ''none''; sandbox", ''X-Content-Type-Options'': ''nosniff'', ''Vary'': ''Origin''}, has(input.origin) && input.origin != null &&
          input.origin == ''vscode-file://vscode-app'' ? {''Access-Control-Allow-Origin'': input.origin} : {})'
    - title: Serve the file with ETag caching
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:189
      call: disk.read-file
      input:
        resource: = 'file://' + input.resource_paths[0]
      as: f
    - return:
        status: 200
        body: = vars.f.value
        headers: = vars.headers
  - if: has(input.has_web_client) && input.has_web_client
    then:
    - title: The web client server handles the remaining paths
      source: src/vs/server/node/remoteExtensionHostAgentServer.ts:192-195
      call: web-client-server.handle
      input:
        path: = vars.path
      as: w
    - return: = vars.w.value
  - title: Not found
    source: src/vs/server/node/remoteExtensionHostAgentServer.ts:197-198
    fail:
      code: not-found
      status: 404
      message: Not found
