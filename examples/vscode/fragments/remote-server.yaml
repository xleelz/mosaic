- component: server-main
  name: on-upgrade
  kind: http
  summary: 'http server ''upgrade'' handler: create the agent server on first use, then handleUpgrade turns the request into a WebSocket.'
  sources:
  - src/server-main.ts:100-108
  request:
    type: object
    properties:
      reconnection_token:
        type: string
      reconnection:
        type: boolean
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - title: getRemoteExtensionHostAgentServer() (memoized createServer)
    source: src/server-main.ts:105-106
    call: server-main-module.create-server
    input: {}
  - call: remote-extension-host-agent-server.handle-upgrade
    input:
      reconnection_token: = input.reconnection_token
      reconnection: = input.reconnection
    as: u
  - return: = vars.u.value
- component: remote-extension-host-agent-server
  name: get-connection-token
  kind: function
  summary: The ServerConnectionToken the server was created with (type and, for Mandatory, the value).
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:84
  response:
    type: object
    properties:
      type:
        type: string
      value:
        type: string
  behavior:
  - return:
      type: = state.connection_token_type
      value: = state.connection_token
- component: server-connection-token
  name: determine-server-connection-token
  kind: function
  summary: 'determineServerConnectionToken: parseServerConnectionToken with a default that reads <user-data-dir>/token, or generates a UUID and stores it there (mode 0600).'
  sources:
  - src/vs/server/node/serverConnectionToken.ts:92-120
  request:
    type: object
    properties:
      args:
        type: object
  response:
    type: object
    properties:
      type:
        type: string
      value:
        type: string
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - title: An empty --connection-token value is dropped by parseArgs ("Value must not be empty"), so it counts as not given
    source: src/vs/platform/environment/node/argv.ts:402-405
    set:
      vars.args: '= merge(input.args, {''connection_token'': has(input.args.connection_token) && input.args.connection_token == '''' ? null : (has(input.args.connection_token) ? input.args.connection_token
        : null), ''connection_token_file'': has(input.args.connection_token_file) && input.args.connection_token_file == '''' ? null : (has(input.args.connection_token_file) ? input.args.connection_token_file
        : null)})'
  - call: server-connection-token.parse-server-connection-token
    input:
      args: = vars.args
    as: p
  - if: vars.p.value.type != 'default'
    then:
    - return:
        type: = vars.p.value.type
        value: = vars.p.value.value
  - if: '!has(vars.args.user_data_dir) || vars.args.user_data_dir == null || vars.args.user_data_dir == '''''
    then:
    - title: 'No user-data-dir: no place to store it, generate a UUID'
      source: src/vs/server/node/serverConnectionToken.ts:94-97
      return:
        type: mandatory
        value: = 'uuid-' + string(random(1000000000))
  - title: First try the stored token at <user-data-dir>/token
    source: src/vs/server/node/serverConnectionToken.ts:98-107
    call: disk.read-file
    input:
      resource: = 'file://' + vars.args.user_data_dir + '/token'
    as: stored
    on_error: continue
  - if: vars.stored.ok && vars.stored.value.content.replace('\n', '').matches('^[0-9A-Za-z_-]+$')
    then:
    - title: A valid stored token (trailing newline removed) is reused
      source: src/vs/server/node/serverConnectionToken.ts:103-105
      return:
        type: mandatory
        value: = vars.stored.value.content.replace('\n', '')
  - title: No valid stored token; generate one
    source: src/vs/server/node/serverConnectionToken.ts:109-110
    set:
      vars.generated: = 'uuid-' + string(random(1000000000))
  - title: Try to store it (mode 0600); a write failure is ignored
    source: src/vs/server/node/serverConnectionToken.ts:112-115
    call: disk.write-file
    input:
      resource: = 'file://' + vars.args.user_data_dir + '/token'
      content: = vars.generated
    on_error: continue
  - return:
      type: mandatory
      value: = vars.generated
- component: server-connection-token
  name: parse-server-connection-token
  kind: function
  summary: 'parseServerConnectionToken: --without-connection-token gives None; --connection-token-file or --connection-token gives Mandatory after the [0-9A-Za-z_-]+ check; nothing gives the default (Mandatory).
    Conflicting flags and bad characters are parse errors.'
  sources:
  - src/vs/server/node/serverConnectionToken.ts:50-90
  request:
    type: object
    properties:
      args:
        type: object
  response:
    type: object
    properties:
      type:
        type: string
        enum:
        - none
        - mandatory
        - default
      value:
        type: string
  errors:
  - code: server-connection-token-parse-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.token: '= has(input.args.connection_token) ? input.args.connection_token : null'
      vars.file: '= has(input.args.connection_token_file) ? input.args.connection_token_file : null'
  - if: has(input.args.without_connection_token) && input.args.without_connection_token
    then:
    - if: vars.token != null || vars.file != null
      then:
      - title: --without-connection-token together with a token or token file
        source: src/vs/server/node/serverConnectionToken.ts:55-58
        fail:
          code: server-connection-token-parse-error
          message: Please do not use the argument '--connection-token' or '--connection-token-file' at the same time as '--without-connection-token'.
    - title: NoneServerConnectionToken (every request passes)
      source: src/vs/server/node/serverConnectionToken.ts:59
      return:
        type: none
        value: ''
  - if: vars.file != null
    then:
    - if: vars.token != null
      then:
      - title: --connection-token together with --connection-token-file
        source: src/vs/server/node/serverConnectionToken.ts:63-65
        fail:
          code: server-connection-token-parse-error
          message: Please do not use the argument '--connection-token' at the same time as '--connection-token-file'.
    - title: Read the token file
      source: src/vs/server/node/serverConnectionToken.ts:67-72
      call: disk.read-file
      input:
        resource: = 'file://' + vars.file
      as: f
      on_error:
      - fail:
          code: server-connection-token-parse-error
          message: = 'Unable to read the connection token file at \'' + vars.file + '\'.'
    - set:
        vars.raw: = vars.f.value.content.replace('\n', '')
    - if: '!vars.raw.matches(''^[0-9A-Za-z_-]+$'')'
      then:
      - title: The file's token has characters outside 0-9, a-z, A-Z, _ and -
        source: src/vs/server/node/serverConnectionToken.ts:74-76
        fail:
          code: server-connection-token-parse-error
          message: = 'The connection token defined in \'' + vars.file + ' does not adhere to the characters 0-9, a-z, A-Z, _, or -.'
    - title: MandatoryServerConnectionToken from the file
      source: src/vs/server/node/serverConnectionToken.ts:78
      return:
        type: mandatory
        value: = vars.raw
  - if: vars.token != null
    then:
    - if: '!vars.token.matches(''^[0-9A-Za-z_-]+$'')'
      then:
      - title: --connection-token has characters outside 0-9, a-z, A-Z, _ and -
        source: src/vs/server/node/serverConnectionToken.ts:82-84
        fail:
          code: server-connection-token-parse-error
          message: = 'The connection token \'' + vars.token + ' does not adhere to the characters 0-9, a-z, A-Z or -.'
    - title: MandatoryServerConnectionToken from --connection-token
      source: src/vs/server/node/serverConnectionToken.ts:86
      return:
        type: mandatory
        value: = vars.token
  - title: No token argument; MandatoryServerConnectionToken(await defaultValue())
    source: src/vs/server/node/serverConnectionToken.ts:89
    return:
      type: default
      value: ''
- component: server-connection-token
  name: request-has-valid-connection-token
  kind: function
  summary: 'requestHasValidConnectionToken: the tkn query parameter first (an array when repeated), then the vscode-tkn cookie. None accepts anything; Mandatory needs an exact string match.'
  sources:
  - src/vs/server/node/serverConnectionToken.ts:122-132
  request:
    type: object
    properties:
      token_type:
        type: string
      token_value:
        type: string
      query_tkns:
        type: array
        items:
          type: string
      cookie:
        type:
        - string
        - 'null'
  response:
    type: object
    properties:
      valid:
        type: boolean
      via:
        type: string
  behavior:
  - if: input.token_type == 'none'
    then:
    - title: NoneServerConnectionToken.validate returns true
      source: src/vs/server/node/serverConnectionToken.ts:26-28
      return:
        valid: true
        via: none
  - title: 'searchParams.getAll(''tkn''): one value is compared, several are passed as an array (never === a string)'
    source: src/vs/server/node/serverConnectionToken.ts:124-125
    set:
      vars.query: '= size(input.query_tkns) == 1 ? input.query_tkns[0] : null'
  - if: input.token_type == 'mandatory' && vars.query != null && vars.query == input.token_value
    then:
    - title: MandatoryServerConnectionToken.validate(query tkn) (connectionToken === this.value)
      source: src/vs/server/node/serverConnectionToken.ts:37-39
      return:
        valid: true
        via: query
  - if: input.token_type == 'mandatory' && input.cookie != null && input.cookie == input.token_value
    then:
    - title: Otherwise the vscode-tkn cookie must match
      source: src/vs/server/node/serverConnectionToken.ts:129-131
      return:
        valid: true
        via: cookie
  - title: No query parameter or cookie equals the token (missing, empty or wrong)
    source: src/vs/server/node/serverConnectionToken.ts:131
    return:
      valid: false
      via: none-matched
- component: remote-extension-host-agent-server
  name: ext-host-connections-get
  kind: store
  summary: _extHostConnections[reconnectionToken]
  sources:
  - src/vs/server/node/remoteExtensionHostAgentServer.ts:71
  store:
    table: ext_host_connections
    op: get
    key: = input.token
    default: {}
- component: remote-extension-host-agent-server
  name: ext-host-connections-put
  kind: store
  summary: _extHostConnections[token] = con
  sources:
