  name: get-extension-host-exit-info
  kind: ipc
  attributes:
    channel: remoteextensionsenvironment
    command: getExtensionHostExitInfo
  summary: 'getExtensionHostExitInfo: the exit {code, signal} of the extension host with this reconnection token, or null.'
