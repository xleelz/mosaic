- id: remote-server-token-http-gate
  description: 'requestHasValidConnectionToken (serverConnectionToken.ts:122-132) on a server started with --connection-token tok-dev: an empty tkn, a missing tkn (no query, no cookie), a wrong tkn and
    a repeated tkn all get 403; the right tkn or the right vscode-tkn cookie pass.'
  fixtures:
  - remote-server-srv1
  steps:
  - flow: rs-remote-server-http-request
    as: empty
    input:
      method: GET
      path: /vscode-remote-resource
      tkn: ''
      resource_paths:
      - /work/app/README.md
  - flow: rs-remote-server-http-request
    as: missing
    input:
      method: GET
      path: /vscode-remote-resource
      resource_paths:
      - /work/app/README.md
  - flow: rs-remote-server-http-request
    as: wrong
    input:
      method: GET
      path: /vscode-remote-resource
      tkn: tok-devX
      resource_paths:
      - /work/app/README.md
  - flow: rs-remote-server-http-request
    as: repeated
    input:
      method: GET
      path: /vscode-remote-resource
      tkns:
      - tok-dev
      - tok-dev
      resource_paths:
      - /work/app/README.md
  - flow: rs-remote-server-http-request
    as: wrongcookie
    input:
      method: GET
      path: /vscode-remote-resource
      tkn: ''
      cookie: nope
      resource_paths:
      - /work/app/README.md
  - flow: rs-remote-server-http-request
    as: query
    input:
      method: GET
      path: /vscode-remote-resource
      tkn: tok-dev
      resource_paths:
      - /work/app/README.md
  - flow: rs-remote-server-http-request
    as: cookie
    input:
      method: GET
      path: /vscode-remote-resource
      cookie: tok-dev
      resource_paths:
      - /work/app/README.md
  - flow: rs-remote-server-http-request
    as: version
    input:
      method: GET
      path: /version
  expect:
  - state['remote-extension-host-agent-server@srv1'].connection_token_type == 'mandatory' && state['remote-extension-host-agent-server@srv1'].connection_token == 'tok-dev'
  - '[steps.empty, steps.missing, steps.wrong, steps.repeated, steps.wrongcookie].all(s, !s.result.ok && s.result.error.code == ''forbidden'' && s.result.error.status == 403)'
  - steps.query.result.ok && steps.query.result.value.status == 200 && steps.cookie.result.ok && steps.cookie.result.value.status == 200
  - steps.query.result.value.headers['Content-Security-Policy'] == "default-src 'none'; sandbox" && !('Access-Control-Allow-Origin' in steps.query.result.value.headers)
  - steps.version.result.ok
  - trace.filter(e, e.type == 'call.end' && e.interface == 'server-connection-token.request-has-valid-connection-token').map(e, e.output.via) == ['none-matched', 'none-matched', 'none-matched', 'none-matched',
    'none-matched', 'query', 'cookie']
  - calls['disk.read-file'] == 2
  - calls['remote-extension-host-agent-server.create-server'] == 8 && trace.filter(e, e.type == 'call.start' && e.interface == 'server-connection-token.determine-server-connection-token').size() == 1
- id: remote-server-token-no-args-generates-and-stores
  description: 'No token argument: the default token is generated (no <user-data-dir>/token yet), stored there, and is Mandatory, so empty and missing tkn get 403 (serverConnectionToken.ts:89, 109-117;
    serverConnectionToken.test.ts:26).'
