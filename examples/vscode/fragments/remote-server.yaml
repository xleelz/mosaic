  response:
    type: object
    properties:
      host:
        type: string
      port:
        type: integer
      connection_token:
        type: string
  errors:
  - code: remote-authority-resolver-error
    status: 0
    retryable: false
  behavior:
  - if: '!(input.authority in state.resolved)'
    then:
    - title: The resolver reports an error (RemoteAuthorityResolverError)
      source: src/vs/platform/remote/electron-browser/remoteAuthorityResolverService.ts:58-70
      fail:
        code: remote-authority-resolver-error
        message: = 'Could not resolve ' + input.authority
  - return: = state.resolved[input.authority]
