- component: tunnel-singleton
  name: serve
  kind: rpc
  summary: 'Start serving the tunnel: acquire the singleton lock, register with dev tunnels'
  sources:
  - cli/src/commands/tunnels.rs:469-500
  request:
    type: object
    properties:
      name:
        type: string
  behavior:
  - call: dev-tunnels-service.create-tunnel
    input:
      name: = input.name
  - set:
      state.running: true
      state.name: = input.name
      state.servers:
        srv-1:
          running: true
- component: tunnel-singleton
  name: rpc
  kind: rpc
  summary: Singleton RPC over the lock-file pipe (status, restart, shutdown)
  sources:
  - cli/src/commands/tunnels.rs:391-414
  request:
    type: object
    properties:
      method:
        type: string
  errors:
  - code: no-running-tunnel
    status: 0
    retryable: false
  behavior:
  - if: '!state.running'
    then:
    - title: No tunnel is running (lock file not held)
      source: cli/src/commands/tunnels.rs:442-444
      fail:
        code: no-running-tunnel
        message: No running tunnel found
  - if: input.method == 'shutdown'
    then:
    - set:
        state.running: false
        state.servers:
          srv-1:
            running: false
    - return: {}
  - if: input.method == 'restart'
    then:
    - return: {}
  - return:
      name: = state.name
      service_installed: = state.service_installed
- component: tunnel-singleton
  name: prune
  kind: rpc
  summary: Find stopped servers to delete
  sources:
  - cli/src/commands/tunnels.rs:451-467
  behavior:
  - set:
      vars.dead: = state.servers.filter(k, !state.servers[k].running)
  - set:
      state.servers: = {}
    when: size(vars.dead) > 0 && size(vars.dead) == size(state.servers)
  - return:
      deleted: = vars.dead
