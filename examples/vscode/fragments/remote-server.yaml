- component: node-extension-management-service
  name: install-from-gallery
  kind: function
  summary: 'installFromGallery -> installGalleryExtensions: marketplace gate, compatibility checks, then the install task.'
  sources:
  - src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:168-191
  - src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:193-215
  request:
    type: object
