    - vscode.typescript-language-features
  input:
    arg: vscode.typescript-language-features
  expect:
  - result.ok && result.value.is_builtin
  - calls['extension-management-service.install-from-gallery'] == 0
- id: remote-server-ext-install-unknown-id
  flow: rs-ext-install
  fixtures:
  - remote-server-marketplace
