  behavior:
  - title: Look up the extension among the installed built-ins
    source: src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2637-2645
    call: extensions-scanner-service.get-system-extension
    input:
      id: = input.id
    as: sys
  - if: has(vars.sys.value.id) && !(input.id in config['product-builtin-extensions-enabled-with-auto-updates'])
    then:
    - title: 'Built-in extension: no gallery lookup, so it is reported as not found'
      detail: A built-in that is not in product.builtInExtensionsEnabledWithAutoUpdates gets no installableInfo, so gallery stays undefined and _install throws NotFound.
      source: src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2704-2714
      fail:
        code: not-found
        message: = "The extension '" + input.id + "' cannot be installed because it was not found."
  - if: has(vars.sys.value.id)
    then:
    - title: Built-in enabled with auto updates is returned as is
      source: src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2640-2642
      return: = vars.sys.value
  - title: Query the gallery for the id (and version)
    source: src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2661-2664
    call: extension-gallery-service.get-extensions
    input:
      ids:
      - = input.id
    as: gallery
  - if: size(vars.gallery.value.extensions) == 0
    then:
    - title: Not in the gallery
      source: src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2709-2714
      fail:
        code: not-found
        message: = "The extension '" + input.id + "' cannot be installed because it was not found."
  - if: vars.gallery.value.extensions[0].malicious
    then:
    - title: Reported as problematic
      source: src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:2671-2673
      fail:
        code: malicious
        message: This extension is reported to be problematic.
  - title: Install from gallery (pinned unless it should auto update)
    detail: installFromGallery goes through the workbench ExtensionManagementService (workbench-shell), which routes to the local server's 'extensions' channel in the shared process.
    source: src/vs/workbench/contrib/extensions/browser/extensionsWorkbenchService.ts:3072-3081
    call: extension-management-service.install-from-gallery
    input:
      gallery: = vars.gallery.value.extensions[0]
      pinned: = input.pinned || input.version != ''
    as: installed
  - return: = vars.installed.value
