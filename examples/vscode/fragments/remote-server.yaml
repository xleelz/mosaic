- component: user-data-sync-store-service
  name: request
  kind: http
  summary: 'request(): auth token, Retry-After window, per-session limit, then status mapping (401/403/404/405/409/410/412/413/426/429).'
  sources:
  - src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:555-684
  request:
    type: object
    properties:
      path:
        type: string
      content:
        type: string
  errors:
  - code: unauthorized
    status: 401
    retryable: false
  - code: forbidden
    status: 403
    retryable: false
  - code: not-found
    status: 404
    retryable: false
  - code: method-not-found
    status: 405
    retryable: false
  - code: conflict
    status: 409
    retryable: false
  - code: gone
    status: 410
    retryable: false
  - code: precondition-failed
    status: 412
    retryable: false
  - code: too-large
    status: 413
    retryable: false
  - code: upgrade-required
    status: 426
    retryable: false
  - code: remote-too-many-requests
    status: 429
    retryable: false
  - code: too-many-requests-and-retry-after
    status: 429
    retryable: false
  - code: local-too-many-requests
    status: 0
    retryable: false
  - code: unknown
    status: 0
    retryable: false
  behavior:
  - call: user-data-sync-account-service.get-account
    input: {}
    as: acc
  - if: vars.acc.value.account == null
    then:
    - title: No Auth Token Available
      source: src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:556-558
      fail:
        code: unauthorized
        status: 401
        message: No Auth Token Available
  - if: state.donot_make_requests_until > now
    then:
    - title: Still inside the server's Retry-After window
      source: src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:560-562
      fail:
        code: too-many-requests-and-retry-after
        status: 429
        message: failed because of too many requests (429).
  - if: state.session_start > 0 && now - state.session_start > config['settings-sync-request-session-interval-ms']
    then:
    - set:
        state.session_requests: 0
        state.session_start: 0
  - if: state.session_requests >= config['settings-sync-request-session-limit']
    then:
    - title: Local per-session request limit
      source: src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:741-744
      fail:
        code: local-too-many-requests
        message: Too many requests. Only 100 requests allowed in 5 minutes.
  - set:
      state.session_requests: = state.session_requests + 1
      state.session_start: '= state.session_start == 0 ? now : state.session_start'
  - call: user-data-sync-store-endpoint.handle
    input:
      path: = input.path
    as: res
  - if: vars.res.value.status == 304 || (vars.res.value.status >= 200 && vars.res.value.status < 300)
    then:
    - return: = vars.res.value
  - set:
      vars.st: = vars.res.value.status
  - if: vars.st == 429 && vars.res.value.retry_after_s > 0
    then:
    - title: 429 with Retry-After stores donotMakeRequestsUntil
      source: src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:670-675
      set:
        state.donot_make_requests_until: = now + vars.res.value.retry_after_s * 1000
    - fail:
        code: too-many-requests-and-retry-after
        status: 429
        message: failed because of too many requests (429).
  - title: Map the HTTP status to a UserDataSyncErrorCode
    source: src/vs/platform/userDataSync/common/userDataSyncStoreService.ts:628-682
    fail: '= {''code'': {401: ''unauthorized'', 403: ''forbidden'', 404: ''not-found'', 405: ''method-not-found'', 409: ''conflict'', 410: ''gone'', 412: ''precondition-failed'', 413: ''too-large'', 426:
      ''upgrade-required'', 429: ''remote-too-many-requests''}[vars.st], ''status'': vars.st, ''message'': ''Server returned '' + string(vars.st)}'
- component: user-data-sync-store-endpoint
  name: handle
  kind: http
  summary: 'Sync server: answers with the configured status (state-driven)'
  request:
    type: object
    properties:
      path:
        type: string
  behavior:
  - if: has(state.respond_status) && state.respond_status != 200
    then:
    - return:
        status: = state.respond_status
        retry_after_s: '= has(state.retry_after_s) ? state.retry_after_s : 0'
        body: null
  - if: input.path == 'manifest'
    then:
    - return:
        status: 200
        retry_after_s: 0
        body: '= has(state.manifest) ? state.manifest : null'
  - return:
      status: 200
      retry_after_s: 0
      body: = state.settings
