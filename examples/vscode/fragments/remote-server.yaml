    call: install-extension-in-profile-task.run
    input:
      gallery: = vars.compat.value
      pinned: = input.pinned
    as: local
  - title: Fire onDidInstallExtensions
    source: src/vs/platform/extensionManagement/common/abstractExtensionManagementService.ts:566
    publish: node-extension-management-service.on-did-install-extensions
    input:
      id: = vars.local.value.id
      version: = vars.local.value.version
    delivery: sync
  - return: = vars.local.value
