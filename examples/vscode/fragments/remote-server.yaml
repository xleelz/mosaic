  sources:
  - src/vs/workbench/contrib/userDataSync/browser/userDataSync.ts:769
  behavior:
  - title: 'Arguments: the caller''s values over the declared defaults (handlers are also reached through command-service with only {command_id, args})'
    set:
      vars.cmd: '= merge({''authentication_providers'': 1}, input == null ? {} : input)'
  - if: vars.cmd.authentication_providers == 0
    then:
    - title: No authentication providers are available
      source: src/vs/workbench/contrib/userDataSync/browser/userDataSync.ts:493-495
      set:
        ctx.sync_notification: Error while turning on Settings Sync. No authentication providers are available.
    - return: {}
  - title: Ask what to sync
    source: src/vs/workbench/contrib/userDataSync/browser/userDataSync.ts:496-499
    choice: configure
    default: turn-on
    options:
      cancel:
      - return: {}
      turn-on: []
  - title: Turn on via the workbench sync service
    source: src/vs/workbench/contrib/userDataSync/browser/userDataSync.ts:503
    call: user-data-sync-workbench-service.turn-on
    input: {}
    on_error:
    - if: error.code in ['incompatible-local-content', 'gone', 'upgrade-required']
      then:
      - title: Client version not compatible with the sync service
        source: src/vs/workbench/contrib/userDataSync/browser/userDataSync.ts:518-528
        set:
          ctx.sync_notification: upgrade-required
      - return: {}
    - if: error.code in ['unauthorized', 'forbidden']
      then:
      - title: Authentication failed
        source: src/vs/workbench/contrib/userDataSync/browser/userDataSync.ts:546-549
        set:
          ctx.sync_notification: auth-failed
      - return: {}
    - title: Error while turning on Settings Sync
      source: src/vs/workbench/contrib/userDataSync/browser/userDataSync.ts:551-555
      set:
        ctx.sync_notification: turn-on-failed
    - return: {}
    as: r
  request:
    type: object
    properties:
      authentication_providers:
        type: integer
        default: 1
