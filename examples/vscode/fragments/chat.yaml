- component: chat-extension-point-handler
  name: handle-chat-participants-extension-point
  kind: function
  summary: 'The chatParticipants handler: validates each contributed participant (name pattern, API proposals for isDefault/modes/locations, id and name) and registers it with ChatAgentService.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:106
  - src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:249-330
  request:
    type: object
    properties:
      added:
        type: array
        default: []
        items:
          type: object
          properties:
            extension_id:
              type: string
            id:
              type: string
            name:
              type: string
            is_default:
              type: boolean
            modes:
              type: array
            locations:
              type: array
            proposals:
              type: array
  behavior:
  - set:
      vars.added: '= has(input.added) ? input.added : []'
      vars.n: 0
  - foreach: = vars.added
    as: p
    steps:
    - set:
        vars.props: '= has(vars.p.proposals) ? vars.p.proposals : []'
        vars.before: = size(state.errors)
    - title: Invalid name
      source: src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:252-255
      if: '!has(vars.p.name) || !matches(vars.p.name, ''^[\\w-]+$'')'
      then:
      - set:
          state.errors: = state.errors + [vars.p.extension_id + ' CANNOT register participant with invalid name']
      else:
      - title: isDefault or modes need the defaultChatParticipant proposal; locations need chatParticipantAdditions
        source: src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:268-276
        if: ((has(vars.p.is_default) && vars.p.is_default) || has(vars.p.modes)) && !('defaultChatParticipant' in vars.props) || has(vars.p.locations) && !('chatParticipantAdditions' in vars.props)
        then:
        - set:
            state.errors: = state.errors + [vars.p.extension_id + ' CANNOT use API proposal']
        else:
        - title: 'registerAgent: default participants get modes ?? [ask], others all three; locations default to panel'
          source: src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:295-319
          call: chat-agent-service.register-agent
          input:
            agent_id: = vars.p.id
            extension: = vars.p.extension_id
            name: = vars.p.name
            is_default: = has(vars.p.is_default) && vars.p.is_default
            locations: '= has(vars.p.locations) && size(vars.p.locations) > 0 ? vars.p.locations : [''panel'']'
            modes: '= has(vars.p.is_default) && vars.p.is_default ? (has(vars.p.modes) ? vars.p.modes : [''ask'']) : [''agent'', ''ask'', ''edit'']'
          on_error:
          - title: A duplicate id is reported to the extension
            source: src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:331-333
            set:
              state.errors: = state.errors + [error.message]
        - if: size(state.errors) == vars.before
          then:
          - set:
              vars.n: = vars.n + 1
  - return:
      handled: true
      registered: = vars.n
  response:
    type: object
    properties:
      handled:
        type: boolean
      registered:
        type: integer
- component: language-model-tools-extension-point-handler
  name: handle-language-model-tools-extension-point
  kind: function
  summary: 'The languageModelTools handler: validates each contributed tool and registers its data (no implementation until the extension activates); tools of the products chat extension are internal.'
  sources:
  - src/vs/workbench/contrib/chat/common/tools/languageModelToolsContribution.ts:42
  - src/vs/workbench/contrib/chat/common/tools/languageModelToolsContribution.ts:267-343
  request:
    type: object
    properties:
      added:
        type: array
        default: []
        items:
          type: object
          properties:
            extension_id:
              type: string
            name:
              type: string
            display_name:
              type: string
            model_description:
              type: string
            tool_reference_name:
              type: string
            can_be_referenced_in_prompt:
              type: boolean
            private_api:
              type: boolean
  behavior:
  - set:
      vars.added: '= has(input.added) ? input.added : []'
      vars.n: 0
  - foreach: = vars.added
    as: t
    steps:
    - set:
        vars.before: = size(state.errors)
    - title: Missing name/modelDescription/displayName, an invalid id, a prompt reference without toolReferenceName, or a reserved copilot_/vscode_ prefix without chatParticipantPrivate
      source: src/vs/workbench/contrib/chat/common/tools/languageModelToolsContribution.ts:275-293
      if: '!has(vars.t.name) || !has(vars.t.model_description) || !has(vars.t.display_name) || !matches(vars.t.name, ''^[\\w-]+$'') || (has(vars.t.can_be_referenced_in_prompt) && vars.t.can_be_referenced_in_prompt
        && !has(vars.t.tool_reference_name)) || ((vars.t.name.startsWith(''copilot_'') || vars.t.name.startsWith(''vscode_'')) && !(has(vars.t.private_api) && vars.t.private_api))'
      then:
      - set:
          state.errors: '= state.errors + [vars.t.extension_id + '' CANNOT register tool '' + (has(vars.t.name) ? vars.t.name : '''')]'
      else:
      - title: 'registerToolData: internal for the products default chat extension, else an extension tool'
        source: src/vs/workbench/contrib/chat/common/tools/languageModelToolsContribution.ts:318-337
        call: language-model-tools-service.register-tool
        input:
          tool_id: = vars.t.name
          reference_name: '= has(vars.t.tool_reference_name) ? vars.t.tool_reference_name : '''''
          source: '= vars.t.extension_id == ''GitHub.copilot-chat'' ? ''internal'' : ''extension'''
          server_id: ''
          has_impl: false
          needs_confirmation: false
        on_error:
        - title: A failed registration is reported
          source: src/vs/workbench/contrib/chat/common/tools/languageModelToolsContribution.ts:340-342
          set:
            state.errors: = state.errors + [error.message]
      - if: size(state.errors) == vars.before
        then:
        - set:
            vars.n: = vars.n + 1
  - return:
      handled: true
      registered: = vars.n
  response:
    type: object
    properties:
      handled:
        type: boolean
      registered:
        type: integer
