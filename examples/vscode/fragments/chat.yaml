schema_version: 1
id: vscode
configs:
- id: chat-tools-global-auto-approve
  type: boolean
  value: false
  default: false
  summary: chat.tools.global.autoApprove ('YOLO mode'); product.json sets no override, so deployed = default.
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:832-835
  attributes:
    key: chat.tools.global.autoApprove
- id: chat-tools-eligible-for-auto-approval
  type: object
  value: {}
  default: {}
  summary: 'chat.tools.eligibleForAutoApproval: tools set to false always ask; deployed = default.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:918-919
  attributes:
    key: chat.tools.eligibleForAutoApproval
- id: chat-editing-confirm-edit-request-removal
  type: boolean
  value: true
  default: true
  summary: 'chat.editing.confirmEditRequestRemoval: confirm before removing a request and its edits; deployed = default.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:577-581
  attributes:
    key: chat.editing.confirmEditRequestRemoval
- id: chat-inline-chat-agent-host-enabled
  type: boolean
  value: false
  default: false
  summary: 'chat.inlineChat.agentHost.enabled: back inline chat with the agent host; deployed = default (experiment-controlled at startup).'
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:2616-2619
  attributes:
    key: chat.inlineChat.agentHost.enabled
- id: chat-editing-confirm-edit-request-retry
  type: boolean
  value: true
  default: true
  summary: 'chat.editing.confirmEditRequestRetry: confirm before retrying a request and undoing its edits; deployed = default.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:583-588
  attributes:
    key: chat.editing.confirmEditRequestRetry
- id: chat-agent-debug-log-file-logging-enabled
  type: boolean
  value: false
  default: false
  summary: The agent debug file-logging flag that gates /troubleshoot; deployed = default.
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1894
  attributes:
    key: AGENT_DEBUG_LOG_FILE_LOGGING_ENABLED_SETTING
- id: files-auto-save
  type: string
  value: 'off'
  default: 'off'
  summary: files.autoSave (reference; owner files-search-scm)
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:261-263
  attributes:
    boundary: true
    owner: files-search-scm
    key: files.autoSave
- id: chat-disable-ai-features
  type: boolean
  value: false
  default: false
  summary: chat.disableAIFeatures (ChatAIDisabledSettingId); triggerSetup writes false.
  sources:
  - src/vs/platform/chat/common/chatSettings.ts:6
  attributes:
    key: chat.disableAIFeatures
- id: chat-agent-enabled
  type: boolean
  value: true
  default: true
  summary: 'chat.agent.enabled: agent mode can be used (policy ChatAgentMode can force false); product.json sets no override, so deployed = default.'
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:1539-1543
  attributes:
    key: chat.agent.enabled
components:
- id: chat
  name: Chat contribution
  kind: module
  layer: ai
  parent: workbench
  sources:
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3472
  summary: 'Chat in the workbench window: chat service, participants, language models, tools, editing sessions and their commands.'
  attributes:
    owner: chat
- id: inline-chat
  name: Inline chat contribution
  kind: module
  layer: ai
  parent: workbench
  sources:
  - src/vs/workbench/contrib/inlineChat/browser/inlineChat.contribution.ts:20
  summary: 'Editor inline chat: the InlineChatController editor contribution, its session service and actions.'
  attributes:
    owner: chat
- id: chat-service
  name: ChatService
  kind: service
  layer: ai
  parent: chat
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:218
  - src/vs/workbench/contrib/chat/common/chatService/chatService.ts:2156
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3472
  summary: 'Owns chat session models, the per-session pending request and the queue of pending (queued/steering) requests; sends requests to participants. No capacity limit: the services methods await (extension
    activation, the participant), which frees the renderer thread, so a cancel runs while a request is in flight.'
  attributes:
    owner: chat
  state:
    schema:
      type: object
      properties:
        sessions:
          type: object
    initial:
      sessions:
        vscode-chat-session://local/s1:
          location: panel
          requests: []
          pending: false
          pending_request_id: ''
          queued: []
          read_only: false
          input_blocked: false
          yield_requested: false
- id: chat-agent-service
  name: ChatAgentService
  kind: service
  layer: ai
  parent: chat
  sources:
  - src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:296
  - src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:234
  - src/vs/workbench/contrib/chat/browser/chat.shared.contribution.ts:3490
  - extensions/copilot/package.json:1296
  - extensions/copilot/package.json:1437
  - extensions/copilot/package.json:1585
  - src/vs/workbench/contrib/chat/browser/chatParticipant.contribution.ts:318
  summary: 'Registry of chat participants (agents) and their implementations; picks the default agent per location and mode and invokes agents. Initial state: the Copilot participants from extensions/copilot/package.json
    chatParticipants (default ask/panel, editingSession edit/panel, editsAgent agent/panel, editingSessionEditor, notebook, terminal, and the non-default vscode and terminalPanel); a default participant
    without modes gets [ask], a non-default one all three modes (chatParticipant.contribution.ts:318).'
  attributes:
    owner: chat
  state:
    schema:
      type: object
      properties:
        agents:
          type: object
    initial:
      agents:
        github.copilot.default:
          extension: GitHub.copilot-chat
          name: GitHubCopilot
          is_default: true
          locations:
          - panel
          modes:
          - ask
          has_impl: true
        github.copilot.editingSession:
          extension: GitHub.copilot-chat
          name: GitHubCopilot
          is_default: true
          locations:
          - panel
          modes:
          - edit
          has_impl: true
        github.copilot.editsAgent:
          extension: GitHub.copilot-chat
          name: agent
          is_default: true
          locations:
          - panel
          modes:
          - agent
          has_impl: true
        github.copilot.editingSessionEditor:
          extension: GitHub.copilot-chat
          name: GitHubCopilot
          is_default: true
          locations:
          - editor
          modes:
          - ask
          has_impl: true
        github.copilot.notebook:
          extension: GitHub.copilot-chat
          name: GitHubCopilot
          is_default: true
          locations:
          - notebook
          modes:
          - ask
          has_impl: true
        github.copilot.terminal:
          extension: GitHub.copilot-chat
          name: terminal
          is_default: true
          locations:
          - terminal
          modes:
          - ask
          has_impl: true
        github.copilot.vscode:
          extension: GitHub.copilot-chat
          name: vscode
          is_default: false
          locations:
          - panel
          modes:
          - agent
          - ask
          - edit
          has_impl: true
        github.copilot.terminalPanel:
          extension: GitHub.copilot-chat
          name: terminal
          is_default: false
          locations:
          - panel
          modes:
          - agent
          - ask
          - edit
          has_impl: true
