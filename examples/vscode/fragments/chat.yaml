- component: chat-service
  name: send-request
  kind: function
  summary: 'Accepts a chat request for a session: rejects empty, read-only and busy sessions, queues when asked, else starts the agent request.'
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1516-1525
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1527-1670
  request:
    type: object
    required:
    - session_resource
    - message
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      message:
        type: string
        examples:
        - Explain what src/main.ts does
      location:
        type: string
        default: panel
      queue:
        type: string
        default: ''
        enum:
        - ''
        - queued
        - steering
      agent_id_silent:
        type: string
        default: ''
      attached_files:
        type: array
        items:
          type: object
          properties:
            resource:
              type: string
            kind:
              type: string
        default: []
        description: 'options.attachedContext: the attached variable entries'
      user_selected_model_id:
        type: string
        default: ''
      mode:
        type: string
        default: ''
        enum:
        - ''
        - ask
        - edit
        - agent
        description: options.modeInfo.kind; '' when the caller passes no modeInfo (getDefaultAgent then uses ask)
  response:
    type: object
    properties:
      kind:
        type: string
        enum:
        - sent
        - queued
        - rejected
      reason:
        type: string
      request_id:
        type: string
      agent_id:
        type: string
  errors:
  - code: unknown-session
    status: 0
    retryable: false
  behavior:
  - title: Reject an empty message
    detail: 'No text, no explicit file/directory/image attachment (isExplicitFileOrImageVariableEntry), no slash command and no agent id: rejected ''Empty message''.'
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1540-1543
    if: input.message.trim() == '' && size(input.attached_files.filter(a, has(a.kind) && a.kind in ['file', 'directory', 'image'])) == 0 && input.agent_id_silent == ''
    then:
    - return:
        kind: rejected
        reason: Empty message
  - title: Unknown session
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1569-1572
    if: '!(input.session_resource in state.sessions)'
    then:
    - fail:
        code: unknown-session
        message: '= ''Unknown session: '' + input.session_resource'
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - title: Read-only or input-blocked session
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1573-1579
    if: vars.sess.read_only || vars.sess.input_blocked
    then:
    - return:
        kind: rejected
        reason: '= vars.sess.input_blocked ? ''Session input is blocked'' : ''Session is read-only'''
  - title: Queue the request (queued or steering)
    detail: queuePendingRequest adds a pending request; steering also sets yieldRequested on the running request. Then processPendingRequests runs the queue when nothing is in flight.
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1619-1625
    if: input.queue != ''
    then:
    - set:
        vars.qid: = 'queued_' + string(size(vars.sess.queued) + 1)
    - set:
        state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''queued'': vars.sess.queued + [{''id'': vars.qid, ''message'': input.message, ''kind'': input.queue}], ''yield_requested'':
          vars.sess.yield_requested || input.queue == ''steering''})})'
    - title: Nothing in flight, so the queue is drained now
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2322-2325
      if: '!vars.sess.pending'
      then:
      - call: chat-service.process-next-pending-request
        input:
          session_resource: = input.session_resource
        fill: true
    - return:
        kind: queued
        request_id: = vars.qid
  - title: A request is already in progress
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1626-1629
    if: vars.sess.pending
    then:
    - return:
        kind: rejected
        reason: Request already in progress
  - title: Resolve the default agent for the location and the request's mode (Ask when no modeInfo is given)
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1643-1646
    call: chat-agent-service.get-default-agent
    input:
      location: = input.location
      mode: '= input.mode != '''' ? input.mode : ''ask'''
    as: def
    fill: true
  - if: '!vars.def.value.found'
    then:
    - title: No default agent
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1646-1649
      return:
        kind: rejected
        reason: No default agent available
  - title: 'Parse the request: an @-mentioned participant becomes the agent part'
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1651
    call: chat-request-parser.parse-chat-request
    input:
      message: = input.message
      location: = input.location
      mode: = input.mode
    as: parsed
    fill: true
  - set:
      vars.rid: = 'request_' + string(size(vars.sess.requests) + 1)
  - title: The agent is the silent agent, else the @-mentioned one, else the default agent
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1652-1653
    set:
      vars.agent: '= input.agent_id_silent != '''' ? input.agent_id_silent : (vars.parsed.value.agent_id != '''' ? vars.parsed.value.agent_id : vars.def.value.agent_id)'
  - title: Record the request and mark the session busy
    detail: _sendRequestAsync creates a CancellableRequest and stores it in _pendingRequests; the agent call runs asynchronously.
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2284-2285
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''pending'': true, ''pending_request_id'': vars.rid, ''requests'': vars.sess.requests + [{''id'': vars.rid, ''message'':
        input.message, ''agent_id'': vars.agent, ''response'': ''in-progress''}]})})'
  - title: Remember the user-selected model as recently used
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2299-2301
    if: input.user_selected_model_id != ''
    then:
    - call: language-models-service.add-to-recently-used-list
      input:
        model_id: = input.user_selected_model_id
      fill: true
  - title: Run the agent request without blocking the send
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2282-2283
    emit: chat-service.run-request
    input:
      session_resource: = input.session_resource
      request_id: = vars.rid
      agent_id: = vars.agent
      message: = input.message
      default_agent_id: '= input.agent_id_silent != '''' ? input.agent_id_silent : vars.def.value.agent_id'
  - return:
      kind: sent
      request_id: = vars.rid
      agent_id: = vars.agent
- component: chat-service
  name: run-request
  kind: function
  summary: 'The asynchronous body of a sent request: activates the participant, invokes it, records the response and drains the queue on success.'
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1821-2301
  request:
    type: object
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      request_id:
        type: string
        examples:
        - request_1
      agent_id:
        type: string
        examples:
        - github.copilot.default
      message:
        type: string
        examples:
        - Explain what src/main.ts does
      default_agent_id:
        type: string
        default: ''
  behavior:
  - set:
      vars.tok: = 'chat-request:' + input.session_resource + ':' + input.request_id
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - title: The request was already cancelled (its token fired and cancelRequest ran) before the async body got here
    detail: The cancellation listener calls model.cancelRequest; nothing more is recorded.
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1987-2003
    if: canceled(vars.tok) || !vars.sess.pending || vars.sess.pending_request_id != input.request_id
    then:
    - return:
        outcome: canceled
  - set:
      vars.slash: '= input.message.startsWith(''/'') ? input.message.substring(1).split('' '')[0] : '''''
  - if: vars.slash != ''
    then:
    - title: A contributed slash command is handled by the slash command service, not a participant
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2187
      call: chat-slash-command-service.has-command
      input:
        id: = vars.slash
      as: hs
      fill: true
    - if: vars.hs.value.found
      then:
      - title: Execute the slash command with the rest of the message
        source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2203-2206
        call: chat-slash-command-service.execute-command
        input:
          id: = vars.slash
          prompt: = input.message.substring(size(vars.slash) + 1).trim()
          session_resource: = input.session_resource
        as: sx
        on_error:
        - title: A failing slash command becomes the response's errorDetails
          source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2261-2276
          set:
            state.sessions: '= merge(state.sessions, {input.session_resource: merge(state.sessions[input.session_resource], {''pending'': false, ''pending_request_id'': '''', ''requests'': state.sessions[input.session_resource].requests.map(r,
              r.id == input.request_id ? merge(r, {''response'': ''error'', ''error_message'': error.message}) : r)})})'
        - return:
            outcome: error
        fill: true
      - set:
          vars.cur: '= input.session_resource in state.sessions ? state.sessions[input.session_resource] : {}'
      - title: Silent commands leave no request in the transcript; others record an empty result
        source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2188-2191
        if: input.session_resource in state.sessions
        then:
        - set:
            state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.cur, {''pending'': false, ''pending_request_id'': '''', ''requests'': vars.hs.value.silent ? vars.cur.requests.filter(r,
              r.id != input.request_id) : vars.cur.requests.map(r, r.id == input.request_id ? merge(r, {''response'': ''success'', ''slash_command'': vars.slash}) : r)})})'
      - return:
          outcome: slash-command
  - title: /troubleshoot is gated by the file-logging setting
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1892-1923
    if: '!config[''chat-agent-debug-log-file-logging-enabled''] && input.message.startsWith(''/troubleshoot'')'
    then:
    - set:
        state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''pending'': false, ''pending_request_id'': '''', ''requests'': vars.sess.requests.map(r, r.id == input.request_id
          ? merge(r, {''response'': ''troubleshoot-disabled''}) : r)})})'
    - return:
        outcome: troubleshoot-disabled
  - title: Activate the participant's extension
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2138
    call: extension-service.activate-by-event
    input:
      activation_event: = 'onChatParticipant:' + input.agent_id
    fill: true
  - title: MCP autostart before invoking (only for sessions that can use tools)
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2169-2176
    if: '!has(vars.sess.can_use_tools) || vars.sess.can_use_tools'
    then:
    - call: mcp-service.autostart
      token: = vars.tok
      input: {}
      as: mcp
      fill: true
      on_error:
      - if: error.code == 'canceled'
        then:
        - return:
            outcome: canceled
    - title: Servers starting are shown as a ChatMcpServersStarting progress part, awaited before the agent runs
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2171-2174
      if: size(vars.mcp.value.started) > 0 || size(vars.mcp.value.requiring_interaction) > 0
      then:
      - call: chat-service.accept-response-progress
        input:
          session_resource: = input.session_resource
          request_id: = input.request_id
          part:
            kind: mcpServersStarting
            servers: = vars.mcp.value.started
        fill: true
  - title: Invoke the agent
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2182-2184
    call: chat-agent-service.invoke-agent
    input:
      agent_id: = input.agent_id
      session_resource: = input.session_resource
      request_id: = input.request_id
      message: = input.message
    as: res
    on_error:
    - title: 'Cancelled while the participant ran: cancelRequest already recorded it'
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2211-2212
      if: error.code == 'canceled'
      then:
      - return:
          outcome: canceled
    - set:
        vars.sess: = state.sessions[input.session_resource]
    - title: The agent threw; the error becomes the response's errorDetails
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2261-2276
      set:
        state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''pending'': false, ''pending_request_id'': '''', ''requests'': vars.sess.requests.map(r, r.id == input.request_id
          ? merge(r, {''response'': ''error'', ''error_message'': error.message}) : r)})})'
    - return:
        outcome: error
    fill: true
    token: = vars.tok
    stream: true
    on_item:
    - title: Each progress chunk goes through the progress callback into the response
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1862-1883
      call: chat-service.accept-response-progress
      input:
        session_resource: = input.session_resource
        request_id: = input.request_id
        part: = vars.item
      fill: true
  - title: 'Cancelled with no result: return without recording'
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2211-2212
    if: canceled(vars.tok)
    then:
    - return:
        outcome: canceled
  - set:
      vars.outcome: = vars.res.value.result
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - title: Record the response (success, error or filtered) and free the session
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2225-2240
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''pending'': false, ''pending_request_id'': '''', ''yield_requested'': false, ''requests'': vars.sess.requests.map(r,
        r.id == input.request_id ? merge(r, {''response'': vars.outcome}) : r)})})'
  - title: A rate-limited anonymous user sees the quota-exceeded state
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2243-2245
    if: vars.res.value.is_rate_limited
    then:
    - call: chat-entitlement-service.mark-anonymous-rate-limited
      input: {}
      fill: true
  - title: Drain the queue only after a clean success
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2247-2249
    if: vars.outcome == 'success'
    then:
    - call: chat-service.process-next-pending-request
      input:
        session_resource: = input.session_resource
      fill: true
  - return:
      outcome: = vars.outcome
- component: chat-service
  name: process-next-pending-request
  kind: function
  summary: Dequeues all consecutive steering requests (combined) or else one queued request, and sends it.
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2358-2465
  request:
    type: object
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
  behavior:
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - title: Input blocked or nothing queued
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2359-2379
    if: vars.sess.input_blocked || size(vars.sess.queued) == 0
    then:
    - return:
        dequeued: 0
  - set:
      vars.steering: = vars.sess.queued.filter(q, q.kind == 'steering')
  - set:
      vars.take: '= size(vars.steering) > 0 ? vars.steering : [vars.sess.queued[0]]'
  - set:
      vars.take_ids: = vars.take.map(q, q.id)
  - title: Remove the dequeued requests from the queue
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2370-2373
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''queued'': vars.sess.queued.filter(q, !(q.id in vars.take_ids)), ''yield_requested'': false})})'
  - title: Send the combined message
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2424-2453
    call: chat-service.send-request
    input:
      session_resource: = input.session_resource
      message: = vars.take.map(q, q.message).join('\n\n')
    as: resent
    fill: true
  - return:
      dequeued: = size(vars.take)
      result: = vars.resent.value.kind
- component: chat-service
  name: cancel-current-request-for-session
  kind: function
  summary: Cancels the session's in-flight request; a no-op (logged) when nothing is pending.
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2613-2648
  request:
    type: object
    required:
    - session_resource
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      source:
        type: string
        default: cancelAction
  response:
    type: object
    properties:
      canceled:
        type: boolean
  behavior:
  - title: No pending request
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2616-2634
    if: '!(input.session_resource in state.sessions) || !state.sessions[input.session_resource].pending'
    then:
    - return:
        canceled: false
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - title: 'CancellableRequest.cancel: cancel the requests tool calls first'
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:136-142
    call: language-model-tools-service.cancel-tool-calls-for-request
    input:
      request_id: = vars.sess.pending_request_id
    fill: true
  - title: then cancel its token (the participant on the extension host sees it)
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:141
    cancel: = 'chat-request:' + input.session_resource + ':' + vars.sess.pending_request_id
  - title: Cancel the token and drop the pending request
