- component: inline-chat-session-service-impl
  name: create-session
  kind: function
  summary: 'One session per file: resolves a chat session (no tools) and starts its editing session.'
  sources:
  - src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:86-121
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
  response:
    type: object
    properties:
      session_resource:
        type: string
  errors:
  - code: session-already-exists
    status: 0
    retryable: false
  behavior:
  - title: Only one session per text model
    source: src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:90-92
    if: input.uri in state.sessions
    then:
    - fail:
        code: session-already-exists
        message: Session already exists
  - title: file URIs go through the session resolver
    source: src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:96-99
    if: input.uri.startsWith('file:')
    then:
    - call: inline-chat-session-resolver.resolve
      input:
        uri: = input.uri
      as: res
      fill: true
    - set:
        vars.sr: = vars.res.value.session_resource
    else:
    - title: Other schemes get a local session without tools
      source: src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:111
      call: chat-service.start-new-local-session
      input:
        location: editor
        can_use_tools: false
      as: local
      fill: true
    - set:
        vars.sr: = vars.local.value.session_resource
  - title: Start the chat model's editing session
    source: src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:120
    call: chat-editing-session.start
    input:
      session_resource: = vars.sr
    fill: true
  - set:
      state.sessions: '= merge(state.sessions, {input.uri: {''session_resource'': vars.sr}})'
  - return:
      session_resource: = vars.sr
- component: inline-chat-session-service-impl
  name: get-session-by-text-model
  kind: function
  summary: The inline session for a file, if any.
  sources:
  - src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:40
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
  response:
    type: object
    properties:
      found:
        type: boolean
      session_resource:
        type: string
  behavior:
  - if: '!(input.uri in state.sessions)'
    then:
    - return:
        found: false
  - return:
      found: true
      session_resource: = state.sessions[input.uri].session_resource
- component: inline-chat-session-service-impl
  name: dispose-session
  kind: function
  summary: Disposing a session cancels its request, rejects remaining edits and removes it from the map.
  sources:
  - src/vs/workbench/contrib/inlineChat/browser/inlineChatSessionServiceImpl.ts:125-131
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
  behavior:
  - if: '!(input.uri in state.sessions)'
    then:
    - return:
        disposed: false
  - set:
      vars.sr: = state.sessions[input.uri].session_resource
  - call: chat-service.cancel-current-request-for-session
    input:
      session_resource: = vars.sr
      source: inlineChatSession
    fill: true
  - call: chat-editing-session.reject
    input:
      session_resource: = vars.sr
      uris: []
    fill: true
  - set:
      state.sessions: = omit(state.sessions, input.uri)
  - return:
      disposed: true
