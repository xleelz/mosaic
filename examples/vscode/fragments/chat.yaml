- component: chat-widget
  name: add-attachments
  kind: function
  summary: attachmentModel.addFile/addFolder for file, vscode-remote and untitled resources (deduplicated).
  sources:
  - src/vs/workbench/contrib/chat/browser/actions/chatContextActions.ts:109-113
  request:
    type: object
    properties:
      resources:
        type: array
        items:
          type: string
        default: []
      kind:
        type: string
        default: file
      range:
        type: string
        default: ''
  response:
    type: object
    properties:
      added:
        type: integer
  behavior:
  - set:
      vars.ok: = input.resources.filter(u, u.startsWith('file:') || u.startsWith('vscode-remote:') || u.startsWith('untitled:'))
  - set:
      vars.new: = vars.ok.filter(u, !state.attachments.exists(a, a.resource == u && a.range == input.range))
