- component: chat-agent-service
  name: invoke-agent
  kind: function
  summary: Invokes an activated agents implementation, relaying its progress chunks to the callers progress callback; throws when the agent has none.
  sources:
  - src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:547-558
  request:
    type: object
    properties:
      agent_id:
        type: string
        examples:
        - github.copilot.default
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      request_id:
        type: string
        examples:
        - request_1
      message:
        type: string
        examples:
        - Explain what src/main.ts does
  response:
    type: object
    properties:
      result:
        type: string
      is_rate_limited:
        type: boolean
  errors:
  - code: no-activated-agent
    status: 0
    retryable: false
  behavior:
  - title: No activated agent with this id
    source: src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:549-552
    if: '!(input.agent_id in state.agents) || !state.agents[input.agent_id].has_impl'
    then:
    - fail:
        code: no-activated-agent
        message: = 'No activated agent with id "' + input.agent_id + '"'
  - title: Call the implementation (MainThreadChatAgents2 forwards to the extension host)
    source: src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:555
    call: ext-host-chat-agents2.invoke-agent
    'on': = 'eh' + self.substring(1)
    input:
      agent_id: = input.agent_id
      session_resource: = input.session_resource
      request_id: = input.request_id
      message: = input.message
    fill: true
    stream: true
    as: eh
    on_item:
    - title: '$handleProgressChunk: each chunk reaches the progress callback passed to invokeAgent'
      source: src/vs/workbench/api/browser/mainThreadChatAgents2.ts:481
      yield: = vars.item
    detail: The participant runs on the extension host; its progress chunks come back as $handleProgressChunk calls while it runs.
  - title: The participant's result as the extension returned it
    detail: 'The extension handler''s IChatAgentResult: errorDetails (with isRateLimited / responseIsFiltered) or none.'
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2225-2228
    choice: agent_result
    default: success
    options:
      success:
      - return:
          result: success
          is_rate_limited: false
      error:
      - return:
          result: error
          is_rate_limited: false
      rate_limited:
      - return:
          result: error
          is_rate_limited: true
      filtered:
      - return:
          result: filtered
          is_rate_limited: false
