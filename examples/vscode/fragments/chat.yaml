  kind: function
  summary: Undoes to the last checkpoint of the editing timeline.
  sources:
  - src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:866-868
  request:
    type: object
    required:
    - session_resource
    properties:
      session_resource:
        type: string
  behavior:
  - set:
      vars.s: '= input.session_resource in state.sessions ? state.sessions[input.session_resource] : {}'
  - set:
      vars.u: '= has(vars.s.undo_depth) ? vars.s.undo_depth : 0'
      vars.r: '= has(vars.s.redo_depth) ? vars.s.redo_depth : 0'
  - title: Nothing to undo
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:237
    if: vars.u == 0
    then:
    - return:
        undone: false
  - set:
      state.sessions: '= merge(state.sessions, {input.session_resource: {''undo_depth'': vars.u - 1, ''redo_depth'': vars.r + 1}})'
  - return:
      undone: true
