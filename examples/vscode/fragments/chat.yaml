- component: chat-service
  name: acquire-or-load-session
  kind: function
  summary: 'Returns a reference to a session''s chat model: an existing model, a local session restored from the session store, or a contributed (remote) session loaded through its provider; undefined when
    a local session has no stored data.'
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:816-844
  request:
    type: object
    required:
    - session_resource
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      location:
        type: string
        default: panel
  response:
    type: object
    properties:
      found:
        type: boolean
      session_resource:
        type: string
      restored:
        type: boolean
  behavior:
  - title: An existing model is acquired
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:762-765
    if: input.session_resource in state.sessions
    then:
    - return:
        found: true
        session_resource: = input.session_resource
        restored: false
  - if: input.session_resource.startsWith('vscode-chat-session://local/')
    then:
    - title: Local sessions are restored from the session store, or are undefined without stored data
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:767-780
      if: '!(has(state.stored) && input.session_resource in state.stored)'
      then:
      - return:
          found: false
          session_resource: = input.session_resource
          restored: false
    - title: Restore the stored data as the session model
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:782-789
      set:
        state.sessions: '= merge(state.sessions, {input.session_resource: {''location'': state.stored[input.session_resource].location, ''requests'': state.stored[input.session_resource].requests, ''pending'':
          false, ''pending_request_id'': '''', ''queued'': [], ''read_only'': false, ''input_blocked'': false, ''yield_requested'': false}})'
    - return:
        found: true
        session_resource: = input.session_resource
        restored: true
  - title: A contributed session is loaded once through its provider (concurrent loads share the promise)
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:822-843
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: {''location'': input.location, ''requests'': [], ''pending'': false, ''pending_request_id'': '''', ''queued'': [], ''read_only'':
        false, ''input_blocked'': false, ''yield_requested'': false}})'
  - return:
      found: true
      session_resource: = input.session_resource
      restored: true
