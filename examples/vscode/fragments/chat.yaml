- component: chat-service
  name: resend-request
  kind: function
  summary: 'Retries a request: cancels the in-flight one, removes the request and sends its message again.'
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1433-1477
  request:
    type: object
    required:
    - session_resource
    - request_id
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      request_id:
        type: string
        examples:
        - request_1
      attempt:
        type: integer
        default: 1
  errors:
  - code: unknown-session
    status: 0
    retryable: false
  behavior:
  - title: Unknown session
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1441-1444
    if: '!(input.session_resource in state.sessions)'
    then:
    - fail:
        code: unknown-session
        message: '= ''Unknown session: '' + input.session_resource'
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - title: Read-only or blocked sessions are not retried
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1445-1447
    if: vars.sess.read_only || vars.sess.input_blocked
    then:
    - return:
        resent: false
  - set:
      vars.req: = vars.sess.requests.filter(r, r.id == input.request_id)
  - if: size(vars.req) == 0
    then:
    - title: Request no longer in the session
      source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1467-1468
      return:
        resent: false
  - set:
      vars.agent: = vars.req[0].agent_id
      vars.message: = vars.req[0].message
      vars.rid: = 'request_' + string(size(vars.sess.requests) + 1)
  - title: Cancel a pending request, remove the old request and start a new attempt
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:1449-1476
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''pending'': true, ''pending_request_id'': vars.rid, ''requests'': vars.sess.requests.filter(r, r.id != input.request_id).map(r,
        r.response == ''in-progress'' ? merge(r, {''response'': ''canceled''}) : r) + [{''id'': vars.rid, ''message'': vars.message, ''agent_id'': vars.agent, ''response'': ''in-progress'', ''attempt'':
        input.attempt}]})})'
  - emit: chat-service.run-request
    input:
      session_resource: = input.session_resource
      request_id: = vars.rid
      agent_id: = vars.agent
      message: = vars.message
  - return:
      resent: true
      request_id: = vars.rid
- component: chat-service
  name: send-pending-request-immediately
  kind: function
  summary: Moves a queued request to the front, cancels the running request and drains the queue.
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2789-2839
  request:
    type: object
    required:
    - session_resource
    - request_id
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      request_id:
        type: string
        examples:
        - queued_2
  behavior:
  - title: Unknown or blocked session
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2790-2793
    if: '!(input.session_resource in state.sessions) || state.sessions[input.session_resource].input_blocked'
    then:
    - return:
        sent: false
  - set:
      vars.sess: = state.sessions[input.session_resource]
  - set:
      vars.target: = vars.sess.queued.filter(q, q.id == input.request_id)
  - title: Not in the queue
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2796-2799
    if: size(vars.target) == 0
    then:
    - return:
        sent: false
  - title: Reorder the target to the front of the queue
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2832-2836
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: merge(vars.sess, {''queued'': vars.target + vars.sess.queued.filter(q, q.id != input.request_id)})})'
  - title: Cancel the running request
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2837
    call: chat-service.cancel-current-request-for-session
    input:
      session_resource: = input.session_resource
      source: queueRunNext
    fill: true
  - title: Let the queue processor send it
    source: src/vs/workbench/contrib/chat/common/chatService/chatServiceImpl.ts:2838
    call: chat-service.process-next-pending-request
    input:
      session_resource: = input.session_resource
    fill: true
  - return:
      sent: true
