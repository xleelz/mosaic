- component: language-model-tools-service
  name: cancel-tool-calls-for-request
  kind: function
  summary: 'cancelToolCallsForRequest: disposes every tracked call of the request (cancelling its token, which denies a waiting confirmation) and forgets the request''s pending calls.'
  sources:
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1550-1563
  request:
    type: object
    required:
    - request_id
    properties:
      request_id:
        type: string
        examples:
        - request_1
  response:
    type: object
    properties:
      canceled:
        type: integer
  behavior:
  - set:
      vars.calls: '= has(state.calls_by_request) && input.request_id in state.calls_by_request ? state.calls_by_request[input.request_id] : []'
  - title: No tracked calls for this request
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1551-1552
    if: size(vars.calls) == 0
    then:
    - return:
        canceled: 0
