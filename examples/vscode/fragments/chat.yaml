- component: chat-tool-actions
  name: cmd-workbench-action-chat-accepttool
  kind: function
  summary: 'workbench.action.chat.acceptTool: confirm the tool invocation waiting for confirmation.'
  sources:
  - src/vs/workbench/contrib/chat/browser/actions/chatToolActions.ts:251
  - src/vs/workbench/contrib/chat/browser/actions/chatToolActions.ts:53-85
  request:
