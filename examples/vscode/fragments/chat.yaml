- component: chat-tool-invocation
  name: begin
  kind: function
  summary: Creates (or reuses the streaming) tool invocation; it waits for confirmation unless auto-confirmed.
  sources:
  - src/vs/workbench/contrib/chat/common/model/chatProgressTypes/chatToolInvocation.ts:94
  request:
    type: object
    properties:
      call_id:
        type: string
      tool_id:
        type: string
      needs_confirmation:
        type: boolean
      auto_confirmed:
        type: string
  behavior:
  - set:
      vars.prev: '= input.call_id in state.invocations ? state.invocations[input.call_id] : {}'
  - set:
      vars.st: '= has(vars.prev.state) && vars.prev.state != ''streaming'' ? vars.prev.state : (input.auto_confirmed != '''' ? ''confirmed'' : (input.needs_confirmation ? ''waiting-for-confirmation'' :
        ''executing''))'
  - set:
      state.invocations: '= merge(state.invocations, {input.call_id: {''tool_id'': input.tool_id, ''state'': vars.st, ''confirmed_by'': has(vars.prev.confirmed_by) ? vars.prev.confirmed_by : input.auto_confirmed}})'
  - return:
      state: = vars.st
- component: chat-tool-invocation
  name: await-confirmation
  kind: function
  summary: 'IChatToolInvocation.awaitConfirmation: resolves at once if already confirmed or denied, else waits for the user.'
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1062-1086
  request:
    type: object
    properties:
      call_id:
        type: string
  response:
    type: object
    properties:
      kind:
        type: string
  behavior:
  - set:
      vars.inv: = state.invocations[input.call_id]
  - title: Already decided
    source: src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1063-1066
    if: vars.inv.state in ['confirmed', 'skipped', 'denied']
    then:
    - return:
        kind: '= vars.inv.state == ''confirmed'' ? (vars.inv.confirmed_by != '''' ? vars.inv.confirmed_by : ''user-action'') : vars.inv.state'
  - title: The user answers the confirmation widget
    source: src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1076-1082
    choice: user_confirmation
    default: allow
    options:
      allow:
      - set:
          state.invocations: '= merge(state.invocations, {input.call_id: merge(vars.inv, {''state'': ''confirmed'', ''confirmed_by'': ''user-action''})})'
      - return:
          kind: user-action
      skip:
      - set:
          state.invocations: '= merge(state.invocations, {input.call_id: merge(vars.inv, {''state'': ''skipped''})})'
      - return:
          kind: skipped
      deny:
      - set:
          state.invocations: '= merge(state.invocations, {input.call_id: merge(vars.inv, {''state'': ''denied''})})'
      - return:
          kind: denied
      wait:
      - title: Block on the invocations state until confirmWith settles it
        source: src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1076-1082
        receive: = 'tool-confirmation:' + input.call_id
        as: decided
      - set:
          vars.now: = state.invocations[input.call_id]
      - return:
          kind: '= vars.now.state == ''confirmed'' ? ''user-action'' : vars.now.state'
    detail: allow/skip/deny answer the widget at once; wait leaves the invocation waiting until a later action (workbench.action.chat.acceptTool / skipTool, or the request's cancellation) calls confirmWith,
      which resolves the awaited state.
- component: chat-tool-invocation
  name: confirm-with
  kind: function
  summary: 'IChatToolInvocation.confirmWith: confirms an invocation that is waiting for confirmation; otherwise does nothing.'
  sources:
  - src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1100-1107
  request:
    type: object
    required:
    - call_id
    - reason
    properties:
      call_id:
        type: string
        examples:
        - call_1
      reason:
        type: string
        enum:
        - user-action
        - skipped
        - denied
  response:
    type: object
    properties:
      confirmed:
        type: boolean
  behavior:
  - title: Only a waiting invocation can be confirmed
    source: src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1101-1106
    if: '!(input.call_id in state.invocations) || state.invocations[input.call_id].state != ''waiting-for-confirmation'''
    then:
    - return:
        confirmed: false
  - set:
      state.invocations: '= merge(state.invocations, {input.call_id: merge(state.invocations[input.call_id], {''state'': input.reason == ''user-action'' ? ''confirmed'' : input.reason, ''confirmed_by'':
        input.reason})})'
  - title: The confirmation state change wakes whoever awaits it
    source: src/vs/workbench/contrib/chat/common/chatService/chatService.ts:1103-1105
    put: = 'tool-confirmation:' + input.call_id
    value: = input.reason
  - return:
      confirmed: true
