  - set:
      vars.applicable: = vars.entries.filter(u, vars.entries[u].state == 'modified' && (size(input.uris) == 0 || u in input.uris))
  - title: Nothing to undo
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:454-456
    if: size(vars.applicable) == 0
    then:
    - return:
        count: 0
  - title: Undo every entry in parallel (Promise.all of rejectDeferred)
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:460-464
    parallel: = vars.applicable
    as: uri
    steps:
    - call: chat-editing-modified-document-entry.reject-deferred
      input:
        uri: = vars.uri
        created_in_request: = vars.entries[vars.uri].created_in_request
      fill: true
    join:
      need: all
  - title: Transition all entries in one transaction
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:467-469
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: {''entries'': vars.entries.transformMap(u, e, u in vars.applicable ? merge(e, {''state'': ''rejected''}) : e)}})'
  - return:
      count: = size(vars.applicable)
- component: chat-editing-session
