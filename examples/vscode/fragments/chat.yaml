- component: language-model-tools-service
  name: invoke-tool
  kind: function
  summary: 'Invokes a tool: refuses stale requests and unknown tools, activates the contributing extension, applies auto-approval and the confirmation, then runs the implementation (extension tools on the
    extension host, MCP tools through McpToolImplementation) under a per-call cancellation token.'
  sources:
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:493-815
  request:
    type: object
    required:
    - tool_id
    - call_id
    properties:
      tool_id:
        type: string
        examples:
        - vscode_fetchWebPage_internal
      call_id:
        type: string
        examples:
        - call_1
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      chat_request_id:
        type: string
        default: ''
      request_complete:
        type: boolean
        default: false
      parameters:
        type: object
  response:
    type: object
    properties:
      outcome:
        type: string
      confirmed_by:
        type: string
      content:
        type: string
  errors:
  - code: canceled
    status: 0
    retryable: false
  - code: tool-not-contributed
    status: 0
    retryable: false
  - code: tool-no-implementation
    status: 0
    retryable: false
  behavior:
  - title: Ignore a tool call for a cancelled or completed request
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:502-505
    if: input.request_complete
    then:
    - fail:
        code: canceled
        message: Canceled
  - title: Track the call under its chat request so the request's cancellation reaches it
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:526-533
    if: input.chat_request_id != ''
    then:
    - set:
        vars.cbr: '= has(state.calls_by_request) ? state.calls_by_request : {}'
    - set:
        state.calls_by_request: '= merge(vars.cbr, {input.chat_request_id: (input.chat_request_id in vars.cbr ? vars.cbr[input.chat_request_id] : []) + [input.call_id]})'
  - title: Unknown tool
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:579-582
    if: '!(input.tool_id in state.tools)'
    then:
    - fail:
        code: tool-not-contributed
        message: = 'Tool ' + input.tool_id + ' was not contributed'
  - set:
      vars.tool: = state.tools[input.tool_id]
  - title: No implementation yet, so activate the contributing extension
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:584-592
    if: '!vars.tool.has_impl'
    then:
    - call: extension-service.activate-by-event
      input:
        activation_event: = 'onLanguageModelTool:' + input.tool_id
      fill: true
    - title: Still no implementation registered
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:589-591
      if: '!state.tools[input.tool_id].has_impl'
      then:
      - fail:
          code: tool-no-implementation
          message: = 'Tool ' + input.tool_id + ' does not have an implementation registered.'
  - title: Decide auto-confirmation
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:948
    call: language-model-tools-service.should-auto-confirm
    input:
      tool_id: = input.tool_id
    as: auto
    fill: true
  - title: Create the tool invocation part in the response
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:651-658
    call: chat-tool-invocation.begin
    input:
      call_id: = input.call_id
      tool_id: = input.tool_id
      needs_confirmation: = vars.tool.needs_confirmation
      auto_confirmed: = vars.auto.value.reason
    fill: true
  - if: vars.tool.needs_confirmation
    then:
    - title: Wait for the user's confirmation (or the auto-confirmation)
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:679-686
      call: chat-tool-invocation.await-confirmation
      input:
        call_id: = input.call_id
      as: conf
      fill: true
    - title: Denied
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:684-686
      if: vars.conf.value.kind == 'denied'
      then:
      - fail:
          code: canceled
          message: Canceled
    - title: Skipped; the tool does not run
      source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:687-695
      if: vars.conf.value.kind == 'skipped'
      then:
      - return:
          outcome: skipped
          content: The user chose to skip the tool call, they want to proceed without running it
    - set:
        vars.confirmed_by: = vars.conf.value.kind
    else:
    - set:
        vars.confirmed_by: '= vars.auto.value.reason != '''' ? vars.auto.value.reason : ''confirmation-not-needed'''
  - title: Run the extension tool's implementation on the extension host, under the call's token
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:741-745
    if: vars.tool.source == 'extension'
    then:
    - call: ext-host-language-model-tools.invoke-tool
      'on': = 'eh' + self.substring(1)
      token: = 'tool-call-' + input.call_id
      input:
        tool_id: = input.tool_id
        call_id: = input.call_id
        parameters: = input.parameters
      fill: true
  - title: Run an MCP tool through its McpToolImplementation (registered by McpLanguageModelToolContribution)
    source: src/vs/workbench/contrib/mcp/common/mcpLanguageModelToolContribution.ts:118-121
    if: vars.tool.source == 'mcp'
    then:
    - call: mcp-tool-implementation.invoke
      token: = 'tool-call-' + input.call_id
      input:
        server_id: '= has(vars.tool.server_id) && vars.tool.server_id != '''' ? vars.tool.server_id : input.tool_id.split(''_'')[1]'
        tool: = vars.tool.reference_name
      fill: true
  - call: chat-tool-invocation.complete
    input:
      call_id: = input.call_id
    fill: true
  - title: Dispose the call's store and drop it from its request's tracked calls
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1533-1547
    if: input.chat_request_id != '' && has(state.calls_by_request) && input.chat_request_id in state.calls_by_request
    then:
    - set:
        state.calls_by_request: '= merge(state.calls_by_request, {input.chat_request_id: state.calls_by_request[input.chat_request_id].filter(c, c != input.call_id)})'
  - return:
      outcome: completed
      confirmed_by: = vars.confirmed_by
- component: language-model-tools-service
  name: should-auto-confirm
  kind: function
  summary: 'Whether a tool call needs no confirmation: eligibility, remembered approvals, then chat.tools.global.autoApprove (after its one-time opt-in).'
  sources:
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1390-1438
  - src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1355-1388
  request:
    type: object
    required:
    - tool_id
    properties:
      tool_id:
        type: string
        examples:
        - vscode_fetchWebPage_internal
  response:
    type: object
    properties:
      reason:
        type: string
  behavior:
  - set:
      vars.tool: = state.tools[input.tool_id]
  - set:
      vars.eligible: = input.tool_id != 'vscode_get_confirmation_with_options' && !(vars.tool.reference_name in config['chat-tools-eligible-for-auto-approval'] && config['chat-tools-eligible-for-auto-approval'][vars.tool.reference_name]
        == false)
  - title: Not eligible for auto-approval
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1409-1411
    if: '!vars.eligible'
    then:
    - return:
        reason: ''
  - title: A remembered approval
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1413-1416
    call: language-model-tools-confirmation-service.get-pre-confirm-action
    input:
      tool_id: = input.tool_id
    as: pre
    fill: true
  - if: vars.pre.value.scope != ''
    then:
    - return:
        reason: = 'remembered-' + vars.pre.value.scope
  - title: Global auto-approve, once the user has opted in
    source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1430-1435
    if: config['chat-tools-global-auto-approve']
    then:
    - if: '!state.auto_approve_opted_in'
      then:
      - title: First use shows the opt-in warning dialog
        source: src/vs/workbench/contrib/chat/browser/tools/languageModelToolsService.ts:1297-1310
        choice: global_auto_approve_opt_in
        default: enable
        options:
          enable:
          - set:
              state.auto_approve_opted_in: true
          decline:
          - return:
              reason: ''
    - return:
        reason: setting
  - return:
      reason: ''
- component: language-model-tools-confirmation-service
  name: get-pre-confirm-action
  kind: function
  summary: The remembered pre-execution approval for a tool (workspace, profile or session), if any.
