- component: chat-editing-modified-document-entry
  name: reject-deferred
  kind: function
  summary: 'Undoes a document''s edits: a file created by the request is reverted and deleted, otherwise the edits are undone (and saved for auto-savers).'
  sources:
  - src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingModifiedFileEntry.ts:256-271
  - src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingModifiedDocumentEntry.ts:299-318
  request:
    type: object
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      created_in_request:
        type: boolean
        default: false
  behavior:
  - title: File created by this request is deleted (errors ignored)
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingModifiedDocumentEntry.ts:300-306
    if: input.created_in_request
    then:
    - call: file-service.del
      input:
        resource: = input.uri
      on_error: continue
      fill: false
    - return:
        deleted: true
  - title: Undo our edits; auto-savers save so the dirty marker goes away
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingModifiedDocumentEntry.ts:308-314
    if: config['files-auto-save'] != 'off'
    then:
    - call: text-file-service.save
      input:
        resource: = input.uri
        options:
          reason: explicit
          force: false
          skip_save_participants: true
      on_error: continue
      fill: true
  - return:
      deleted: false
