  - state['extension-agent-plugin-discovery@w1'].plugins == [] && size(state['extension-agent-plugin-discovery@w1'].entries) == 1
- id: chat-participants-contributed-then-mention
  fixtures:
  - one-window-folder
  - chat-seed
  description: A contributed participant is registered (without an implementation yet); invalid and proposal-less entries are refused.
  steps:
  - flow: chat-participants-contributed
    as: c
    input:
      added:
      - extension_id: my.ext
        id: my.participant
        name: helper
      - extension_id: my.ext
        id: my.bad
        name: has space
      - extension_id: my.ext
        id: my.default
        name: def
        is_default: true
  - flow: chat-participants-contributed
    as: dup
    input:
      added:
      - extension_id: my.ext
        id: my.participant
        name: helper
  expect:
  - steps.c.result.value.registered == 1 && steps.dup.result.value.registered == 0
  - state['chat-agent-service@w1'].agents['my.participant'].modes == ['agent', 'ask', 'edit'] && !state['chat-agent-service@w1'].agents['my.participant'].has_impl
  - size(state['chat-extension-point-handler@w1'].errors) == 3
- id: lm-tools-contributed-then-invoke
  fixtures:
  - one-window-folder
  - chat-seed
  description: A contributed tool is registered without an implementation; invoking it activates the extension (onLanguageModelTool), and since nothing registers the implementation it fails.
  steps:
  - flow: lm-tools-contributed
    as: c
    input:
      added:
      - extension_id: my.ext
        name: lookup_ticket
        display_name: Lookup ticket
        model_description: Looks a ticket up
      - extension_id: my.ext
        name: copilot_x
        display_name: X
        model_description: reserved
      - extension_id: my.ext
        name: no_desc
        display_name: No desc
  - flow: lm-tool-invoke
    as: i
    input:
      tool_id: lookup_ticket
      call_id: call_2
  expect:
  - steps.c.result.value.registered == 1
  - state['language-model-tools-service@w1'].tools['lookup_ticket'].source == 'extension'
  - size(state['language-model-tools-extension-point-handler@w1'].errors) == 2
  - '!steps.i.result.ok && steps.i.result.error.code == ''tool-no-implementation'''
  - trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onLanguageModelTool:lookup_ticket')
- id: chat-contributions-default-models
  flow: chat-contributions-startup
  fixtures:
  - one-window-folder
  - chat-seed
  description: The explore and plan agent model settings list the vendor default plus the tool-calling Copilot models; the utility small model excludes Copilot models.
  state:
    chat-slash-command-service:
      commands: {}
    chat-entitlement-service@w1:
      entitlement: pro
    chat-pet-service@w1:
      enabled: true
  expect:
  - state['explore-agent-default-model@w1'].model_ids == ['', 'copilot/claude-sonnet-4', 'copilot/gpt-4.1']
  - state['plan-agent-default-model@w1'].model_ids == state['explore-agent-default-model@w1'].model_ids
  - state['utility-small-model-contribution@w1'].model_ids == ['']
  - state['context-key-service@w1'].values['agentsVoiceEntitled'] == true && state['context-key-service@w1'].values['chatPetEnabled'] == true
- id: chat-context-contributed-then-read
  fixtures:
  - one-window-folder
  - chat-seed
  steps:
  - flow: chat-context-contributed
    as: c
    input:
      extensions:
      - extension_id: my.ext
        proposals:
        - chatContextProvider
        contributions:
        - id: tickets
          display_name: Tickets
          icon: $(issues)
        - id: bad
          display_name: Bad
          icon: issues.png
      - extension_id: other.ext
        proposals: []
        contributions:
        - id: x
          display_name: X
          icon: $(zap)
  - flow: chat-context-providers-read
    as: r
  expect:
  - 'steps.r.result.value.providers == {''my.ext-tickets'': {''picker'': {''title'': ''Tickets'', ''icon'': ''$(issues)''}}}'
  - size(state['chat-context-contribution@w1'].errors) == 1
- id: chat-participants-contributed-then-mention-routes
  fixtures:
  - one-window-folder
  - chat-seed
  description: The contributed participant is found by @name but has no implementation yet, so invoking it fails and the response records the error.
  state:
    chat-widget@w1:
      mode: ask
  steps:
  - flow: chat-participants-contributed
    as: c
    input:
      added:
      - extension_id: my.ext
        id: my.participant
        name: helper
  - flow: chat-submit
    as: s
    input:
      input_value: '@helper hi'
  expect:
  - steps.s.result.value.kind == 'sent'
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].agent_id == 'my.participant'
  - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'error'
