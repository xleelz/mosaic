- component: chat-editing-session
  name: accept
  kind: function
  summary: Keeps the Modified entries (all, or the given URIs) in parallel, then transitions them to Accepted.
  sources:
  - src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:433-438
  - src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:446-472
  request:
    type: object
    required:
    - session_resource
    properties:
      session_resource:
        type: string
        examples:
        - vscode-chat-session://local/s1
      uris:
        type: array
        items:
          type: string
        default: []
  response:
    type: object
    properties:
      count:
        type: integer
  behavior:
  - set:
      vars.entries: '= input.session_resource in state.sessions ? state.sessions[input.session_resource].entries : {}'
  - set:
      vars.applicable: = vars.entries.filter(u, vars.entries[u].state == 'modified' && (size(input.uris) == 0 || u in input.uris))
  - title: Nothing to keep
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:454-456
    if: size(vars.applicable) == 0
    then:
    - return:
        count: 0
  - title: Keep every entry in parallel (Promise.all of acceptDeferred)
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:460-464
    parallel: = vars.applicable
    as: uri
    steps:
    - call: chat-editing-modified-document-entry.accept-deferred
      input:
        uri: = vars.uri
      fill: true
    join:
      need: all
  - title: Transition all entries in one transaction
    source: src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:467-469
    set:
      state.sessions: '= merge(state.sessions, {input.session_resource: {''entries'': vars.entries.transformMap(u, e, u in vars.applicable ? merge(e, {''state'': ''accepted''}) : e)}})'
  - return:
      count: = size(vars.applicable)
- component: chat-editing-session
  name: reject
  kind: function
  summary: Undoes the Modified entries (all, or the given URIs) in parallel, then transitions them to Rejected.
  sources:
  - src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:440-444
  - src/vs/workbench/contrib/chat/browser/chatEditing/chatEditingSession.ts:446-472
  request:
