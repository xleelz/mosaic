interfaces:
- component: extension-service
  name: activate-by-event
  kind: function
  summary: Activates extensions registered for an activation event (exthost seam).
  attributes:
    boundary: true
    owner: exthost
  request:
    type: object
    required:
    - activation_event
    properties:
      activation_event:
        type: string
        examples:
        - onLanguage:typescript
      activation_kind:
        type: string
        enum:
        - normal
        - immediate
        default: normal
  response:
    type: object
    properties:
      activated:
        type: array
        items:
          type: string
        default: []
      deferred:
        type: boolean
        default: false
      cached:
        type: boolean
        default: false
  errors:
  - code: canceled
    status: 0
    retryable: false
    summary: the extension host went down while the activation RPC was pending (RPCProtocol.dispose rejects pending replies)
- component: ext-host-chat-agents2
  name: invoke-agent
  kind: rpc
  summary: 'ExtHostChatAgentsShape2.$invokeAgent: runs the extension''s chat participant handler.'
  attributes:
    boundary: true
    owner: exthost
    shape: ExtHostChatAgentsShape2
  latency_ms:
    min: 200
    max: 2000
  request:
    type: object
    properties:
      agent_id:
        type: string
        examples:
        - github.copilot.default
      session_resource:
        type: string
      request_id:
        type: string
      message:
        type: string
  response:
    type: object
    properties:
      metadata:
        type: object
      error_details:
        type: object
- component: ext-host-language-models
  name: start-chat-request
  kind: rpc
  summary: 'ExtHostLanguageModelsShape.$startChatRequest: asks the extension''s language model provider to answer.'
  attributes:
    boundary: true
    owner: exthost
    shape: ExtHostLanguageModelsShape
  latency_ms:
    min: 100
    max: 1500
  request:
    type: object
    properties:
      model_id:
        type: string
        examples:
        - copilot/gpt-4.1
      request_id:
        type: integer
      messages:
        type: array
        items:
          type: object
  response:
    type: object
    properties:
      metadata:
        type: object
- component: ext-host-language-model-tools
  name: invoke-tool
  kind: function
  summary: 'ExtHostLanguageModelToolsShape.$invokeTool: runs an extension-contributed tool.'
  attributes:
    boundary: true
    owner: exthost
    shape: ExtHostLanguageModelToolsShape
  latency_ms:
    min: 5
    max: 200
  request:
    type: object
    required:
    - extension_id
    - name
    - options
    properties:
      name:
        type: string
        description: 'name: string'
      options:
        type: object
        description: 'options: LanguageModelToolInvocationOptions<object>'
      token:
        type: object
        description: 'token?: CancellationToken'
      extension_id:
        type: string
        examples:
        - vscode.git
        description: 'the calling extension (implicit: each extension gets its own vscode namespace)'
  response:
    type: object
    properties:
      disposable_id:
        type: string
        examples:
        - disposable-1
      value: {}
- component: text-file-service
  name: save
  kind: function
  summary: Saves a text file (files-search-scm seam).
  attributes:
    boundary: true
    owner: files-search-scm
