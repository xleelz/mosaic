        type: array
        default:
        - agent
        - ask
        - edit
  response:
    type: object
    properties:
      registered:
        type: boolean
  errors:
  - code: agent-already-registered
    status: 0
    retryable: false
  behavior:
  - title: Agent already registered
    source: src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:333-336
    if: input.agent_id in state.agents
    then:
    - fail:
        code: agent-already-registered
        message: '= ''Agent already registered: "'' + input.agent_id + ''"'''
  - title: Store the data; has_impl stays false until the extension registers its implementation
    source: src/vs/workbench/contrib/chat/common/participants/chatAgents.ts:346-350
    set:
      state.agents: '= merge(state.agents, {input.agent_id: {''extension'': has(input.extension) ? input.extension : '''', ''name'': has(input.name) ? input.name : '''', ''is_default'': has(input.is_default)
        && input.is_default, ''locations'': has(input.locations) ? input.locations : [''panel''], ''modes'': has(input.modes) ? input.modes : [''agent'', ''ask'', ''edit''], ''has_impl'': false}})'
  - return:
      registered: true
- component: chat-entitlement-service
  name: get-entitlement
  kind: function
  summary: The entitlement and isInternal read by consumers such as isVoiceEntitled.
  sources:
  - src/vs/workbench/services/chat/common/chatEntitlementService.ts:267-275
  request:
    type: object
  response:
    type: object
    properties:
      entitlement:
        type: string
      is_internal:
        type: boolean
  behavior:
  - return:
      entitlement: = state.entitlement
      is_internal: = state.is_internal
- component: language-models-service
  name: lookup-language-model
  kind: function
  summary: 'lookupLanguageModel: the cached metadata of a model id, if any.'
  sources:
  - src/vs/workbench/contrib/chat/common/languageModels.ts:1434-1436
  request:
    type: object
    required:
    - model_id
    properties:
      model_id:
        type: string
        examples:
        - copilot/gpt-4.1
  response:
    type: object
    properties:
      found:
        type: boolean
      metadata:
        type: object
  behavior:
  - if: '!(input.model_id in state.models)'
    then:
    - return:
        found: false
  - return:
      found: true
      metadata: = state.models[input.model_id]
- component: language-models-service
  name: get-vendors
  kind: function
  summary: 'getVendors: the registered language model vendors (providers) visible in this context.'
  sources:
  - src/vs/workbench/contrib/chat/common/languageModels.ts:1415-1430
  request:
    type: object
  response:
    type: object
    properties:
      vendors:
        type: array
  behavior:
  - return:
      vendors: = state.providers.filter(k, true)
- component: context-key-service
  name: set-context
  kind: function
  summary: AbstractContextKeyService.setContext (boundary; owner platform-core).
  attributes:
    boundary: true
    owner: platform-core
  request:
    type: object
    required:
    - key
    properties:
      key:
        type: string
      value: {}
  response:
    type: object
    properties:
      changed:
        type: boolean
- component: voice-session-controller
  name: get-state
  kind: function
  summary: The controller's observables (voiceState starts idle; connected, connecting, reconnecting and muted start false).
  sources:
  - src/vs/workbench/contrib/chat/browser/voiceClient/voiceSessionController.ts:352-382
  request:
    type: object
  response:
    type: object
    properties:
      connected:
        type: boolean
      connecting:
        type: boolean
      reconnecting:
        type: boolean
      muted:
        type: boolean
      voice_state:
        type: string
  behavior:
  - return:
      connected: = state.connected
      connecting: = state.connecting
      reconnecting: = state.reconnecting
      muted: = state.muted
      voice_state: = state.voice_state
- component: chat-context-service
  name: set-chat-context-provider
  kind: function
  summary: 'setChatContextProvider: records (or updates) the provider''s picker and registers it with the pick service.'
  sources:
  - src/vs/workbench/contrib/chat/browser/contextContrib/chatContextService.ts:70-75
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
      title:
        type: string
      icon:
        type: string
  response:
    type: object
    properties:
      registered:
        type: boolean
  behavior:
  - set:
      vars.prev: '= input.id in state.providers ? state.providers[input.id] : {}'
  - set:
      state.providers: '= merge(state.providers, {input.id: merge(vars.prev, {''picker'': {''title'': input.title, ''icon'': input.icon}})})'
  - return:
      registered: true
- component: chat-context-service
  name: get-providers
  kind: function
  summary: The registered context providers.
  sources:
  - src/vs/workbench/contrib/chat/browser/contextContrib/chatContextService.ts:43
  request:
    type: object
  response:
    type: object
    properties:
      providers:
        type: object
  behavior:
  - return:
      providers: = state.providers
