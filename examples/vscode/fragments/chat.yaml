  kind: function
  summary: 'parseChatRequestWithReferences: finds the leading @-agent part. The agent must come first (only whitespace before it), only one is allowed, it must support the location, and the request''s mode
    when one is given.'
  sources:
  - src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:41-121
  - src/vs/workbench/contrib/chat/common/requestParser/chatRequestParser.ts:123-170
