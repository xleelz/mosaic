  - src/vs/workbench/contrib/chat/browser/actions/chatExecuteActions.ts:350-354
  request:
    type: object
  behavior:
  - set:
      vars.cmd_in: = merge({}, input)
  - call: language-models-service.select-language-models
    input:
      vendor: ''
      family: ''
      id: ''
    as: all
    fill: true
  - call: chat-widget.get-view-model
    as: vm
  - set:
      vars.ids: = vars.all.value.ids
  - title: getNextModelInCycle
    source: src/vs/workbench/contrib/chat/browser/widget/input/chatInputPart.ts:1535-1544
    if: size(vars.ids) == 0
    then:
    - return:
        model_id: = vars.vm.value.model_id
  - set:
      vars.after: = vars.ids.filter(m, m > vars.vm.value.model_id)
  - set:
      vars.pool: '= size(vars.after) > 0 ? vars.after : vars.ids'
  - set:
      vars.next: = vars.pool.filter(m, !vars.pool.exists(o, o < m))[0]
  - call: chat-widget.set-language-model
    input:
      model_id: = vars.next
    fill: true
  - return:
