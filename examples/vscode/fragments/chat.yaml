      vars.ok: = vars.added.filter(r, has(r.path) && r.path != '' && !(r.path.startsWith('..') || r.path.startsWith('/') || r.path.contains('/../')))
  - if: size(vars.missing) + size(vars.outside) > 0
    then:
    - set:
        state.errors: '= state.errors + vars.missing.map(r, r.extension_id + '': missing path'') + vars.outside.map(r, r.extension_id + '': '' + r.path + '' resolves outside the extension'')'
  - title: Drop the removed extensions' entries
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1315-1318
    foreach: = vars.removed
    as: rm
    steps:
    - set:
        state.entries: = omit(state.entries, vars.rm.extension_id + '/' + vars.rm.path)
  - title: Record the valid entries by extension and path
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1312
    set:
      state.entries: '= merge(state.entries, vars.ok.transformMapEntry(j, r, {r.extension_id + ''/'' + r.path: {''extension_id'': r.extension_id, ''path'': r.path, ''when'': has(r.when) ? r.when : ''''}}))'
  - title: Rebuild the when keys and schedule the refresh
    source: src/vs/workbench/contrib/chat/common/plugins/agentPluginServiceImpl.ts:1320-1321
    emit: extension-agent-plugin-discovery.refresh-plugins
    after_ms: 0
    input: {}
  - return:
      handled: true
      registered: = size(vars.ok)
  response:
    type: object
    properties:
      handled:
        type: boolean
      registered:
        type: integer
