- component: chat-widget
  name: accept-input
  kind: function
  summary: Submits the input (or a given query) of the widget's session to the chat service and stores it in the input history.
  sources:
  - src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:3480-3484
  - src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:3967-3986
  - src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:4018-4036
  request:
    type: object
    properties:
      query:
        type: string
        default: ''
      queue:
        type: string
        default: ''
        enum:
        - ''
        - queued
        - steering
  response:
    type: object
    properties:
      accepted:
        type: boolean
      kind:
        type: string
      reason:
        type: string
  behavior:
  - set:
      vars.editing: = state.editing_request_id != ''
      vars.image: = size(state.attachments.filter(a, type(a) == map && has(a.kind) && a.kind == 'image')) > 0
  - set:
      vars.text: '= input.query != '''' ? input.query : state.input'
      vars.user_query: = input.query == ''
  - title: Send to the chat service
    source: src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:3562
    call: chat-service.send-request
    input:
      session_resource: = state.session_resource
      message: = vars.text
      location: panel
      queue: = input.queue
      attached_files: = state.attachments
      mode: '= state.mode == ''agent'' && !config[''chat-agent-enabled''] ? ''edit'' : state.mode'
    as: sent
    fill: true
    detail: modeInfo.kind is the input part's current mode; Agent falls back to Edit when chat.agent.enabled is off (chatInputPart.ts:936-940).
  - title: A rejected send keeps the input
    source: src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:3991-3999
    if: vars.sent.value.kind == 'rejected'
    then:
    - return:
        accepted: false
        kind: rejected
        reason: = vars.sent.value.reason
  - title: Clear the input, storing a user query in the history
    source: src/vs/workbench/contrib/chat/browser/widget/input/chatInputPart.ts:2668-2671
    set:
      state.input: ''
      state.editing_request_id: ''
      state.attachments: []
  - if: vars.user_query
    then:
    - call: chat-widget-history-service.append
      input:
        location: panel
        text: = vars.text
      fill: true
  - title: A user query unlocks the firstChatMessage pet achievement
    source: src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:4028-4030
    if: vars.user_query
    then:
    - call: chat-pet-service.unlock-achievement
      input:
        id: firstChatMessage
      fill: true
  - title: Resubmitting an edited request unlocks requestRevision
    source: src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:4031-4033
    if: vars.editing
    then:
    - call: chat-pet-service.unlock-achievement
      input:
        id: requestRevision
      fill: true
  - title: A request with an image attached tries imageRequest (a disabled achievement)
    source: src/vs/workbench/contrib/chat/browser/widget/chatWidget.ts:4034-4036
    if: vars.image
    then:
    - call: chat-pet-service.unlock-achievement
      input:
        id: imageRequest
      fill: true
  - return:
      accepted: true
      kind: = vars.sent.value.kind
