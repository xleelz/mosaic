- component: inline-chat-controller
  name: run
  kind: function
  summary: Ends an existing session for the file (keeping its edits), creates a new inline session and optionally sends the message.
  sources:
  - src/vs/workbench/contrib/inlineChat/browser/inlineChatController.ts:701-743
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      message:
        type: string
        default: ''
      auto_send:
        type: boolean
        default: false
  response:
    type: object
    properties:
      started:
        type: boolean
      session_resource:
        type: string
  behavior:
  - call: inline-chat-session-service-impl.get-session-by-text-model
    input:
      uri: = input.uri
    as: existing
    fill: true
  - title: An existing session for the file is kept and disposed first
    source: src/vs/workbench/contrib/inlineChat/browser/inlineChatController.ts:706-710
    if: vars.existing.value.found
    then:
    - call: chat-editing-session.accept
      input:
        session_resource: = vars.existing.value.session_resource
        uris: []
      fill: true
    - call: inline-chat-session-service-impl.dispose-session
      input:
        uri: = input.uri
      fill: true
  - title: Create the session
    source: src/vs/workbench/contrib/inlineChat/browser/inlineChatController.ts:721
    call: inline-chat-session-service-impl.create-session
    input:
      uri: = input.uri
    as: created
    fill: true
  - title: Send the message when autoSend is set
    source: src/vs/workbench/contrib/inlineChat/browser/inlineChatController.ts:824-829
    if: input.message != '' && input.auto_send
    then:
    - call: chat-service.send-request
      input:
        session_resource: = vars.created.value.session_resource
        message: = input.message
        location: editor
      fill: true
  - return:
      started: true
      session_resource: = vars.created.value.session_resource
