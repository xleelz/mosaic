- component: text-file-save-participant
  name: participate
  kind: function
  summary: 'TextFileSaveParticipant.participate: runs the participants one after another under a cancellable progress notification ("Skip", shown after 5 s for a dirty model, 3 s otherwise) with its own
    CancellationTokenSource. Errors are logged. Skip cancels the token: the running participant is abandoned, no further participant runs, and the save goes on. A participant''s own CancellationError (token
    not canceled) cancels the save.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:35-93
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      reason:
        type: string
        enum:
        - explicit
        - auto
        - focus-change
        - window-change
        default: explicit
      content:
        type: string
        default: ''
      dirty:
        type: boolean
        default: true
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response:
    type: object
    properties:
      participated:
        type: integer
      skipped:
        type: boolean
  errors:
  - code: canceled
    status: 0
    retryable: false
  behavior:
  - set:
      vars.bubble: false
      vars.skipped: false
      vars.count: 0
  - if: has(input.token) && input.token.canceled
    then:
    - title: Save already canceled, no participant runs
      source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:63-66
      return:
        participated: 0
        skipped: false
  - title: new CancellationTokenSource(token) for this run, and the cancellable "Skip" progress (delay 5000 ms when dirty, else 3000 ms)
    source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:47-55
    set:
      state.runs: = state.runs + 1
      vars.tok: = 'save-participants-' + string(state.runs + 1)
  - set:
      state.running: '= merge(state.running, {input.resource: {''token'': vars.tok, ''started'': now, ''delay'': (has(input.dirty) && !input.dirty) ? 3000 : 5000}})'
  - foreach: = state.participants
    as: participant
    steps:
    - if: canceled(vars.tok)
      then:
      - title: Skipped (token canceled), no further participant runs
        source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:64-66
        break: true
    - title: Run one participant, racing the cancellation token
      source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:68-70
      call: = vars.participant
      targets:
      - ext-host-save-participant.participate
      - format-on-save-participant.participate
      token: = vars.tok
      input:
        resource: = input.resource
        reason: = input.reason
        content: = input.content
      as: ran
      on_error: continue
    - if: '!vars.ran.ok && vars.ran.error.code == ''canceled'' && canceled(vars.tok)'
      then:
      - title: Canceled through the token (Skip); the save goes on without the remaining participants
        source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:71-73
        set:
          vars.skipped: true
      - break: true
    - if: '!vars.ran.ok && vars.ran.error.code == ''canceled'''
      then:
      - title: A CancellationError while the token was not canceled - the participant asked to cancel the save
        source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:74-78
        set:
          vars.bubble: true
      - break: true
    - set:
        vars.count: = vars.count + 1
  - title: The progress ends; the run's token source is disposed
    source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:85-87
    set:
      state.running: = omit(state.running, input.resource)
  - if: vars.bubble
    then:
    - title: Bubble the cancellation to the model's save
      source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:89-91
      fail:
        code: canceled
        message: Canceled
  - return:
      participated: = vars.count
      skipped: = vars.skipped
- component: text-file-save-error-handler
  name: constructor
  kind: function
  summary: 'TextFileSaveErrorHandler constructor: installs itself as textFileService.files.saveErrorHandler and listens to save/revert to close messages.'
