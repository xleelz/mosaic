- component: text-search-manager
  name: search
  kind: function
  summary: 'TextSearchManager.search (NativeTextSearchManager in the extension host): builds the provider options per folder query (encoding = toCanonicalName(fileEncoding), maxResults), runs the provider,
    and forwards each file match through onProgress until maxResults; the match that crosses the limit is trimmed, limitHit is set and the provider''s token is canceled.'
  sources:
  - src/vs/workbench/services/search/common/textSearchManager.ts:49-102
  - src/vs/workbench/services/search/common/textSearchManager.ts:174-182
  - src/vs/workbench/services/search/node/textSearchManager.ts:12-19
  request:
    type: object
    required:
    - query
    properties:
      query:
        $ref: SearchTextQuery
      token_name:
        type: string
        default: ''
  response:
    type: object
    properties:
      limit_hit:
        type: boolean
      folder_options:
        type: array
        items:
          type: object
      stats:
        type: object
  behavior:
  - set:
      vars.max: '= has(input.query.max_results) ? input.query.max_results : 20000'
      vars.fq: '= has(input.query.folder_queries) && size(input.query.folder_queries) > 0 ? input.query.folder_queries : input.query.folders.map(f, {''folder'': f})'
      vars.count: 0
      vars.limit_hit: false
  - set:
      vars.canon: '= {''shiftjis'': ''shift-jis'', ''utf16le'': ''utf-16le'', ''utf16be'': ''utf-16be'', ''big5hkscs'': ''big5-hkscs'', ''eucjp'': ''euc-jp'', ''euckr'': ''euc-kr'', ''koi8r'': ''koi8-r'',
        ''koi8u'': ''koi8-u'', ''macroman'': ''x-mac-roman'', ''utf8bom'': ''utf8''}'
  - title: 'getSearchOptionsForFolder: encoding = toCanonicalName(fileEncoding) (windowsNNNN -> windows-NNNN, shiftjis -> shift-jis, utf16le -> utf-16le, ...)'
    source: src/vs/workbench/services/search/common/textSearchManager.ts:223
    set:
      vars.folder_options: '= vars.fq.map(q, {''folder'': q.folder, ''encoding'': !has(q.file_encoding) || q.file_encoding == '''' ? '''' : (matches(q.file_encoding, ''windows[0-9]+'') ? ''windows-'' +
        replace(q.file_encoding, ''^.*windows([0-9]+).*$'', ''$1'') : (q.file_encoding in vars.canon ? vars.canon[q.file_encoding] : q.file_encoding))})'
  - title: provider.provideTextSearchResults(query, {folderOptions, maxResults}, progress, token)
    source: src/vs/workbench/services/search/common/textSearchManager.ts:186-188
    call: ripgrep-text-search-engine.provide-text-search-results
    stream: true
    input:
      query:
        pattern: = input.query.pattern
        is_case_sensitive: = has(input.query.is_case_sensitive) && input.query.is_case_sensitive
      options:
        folder_options: = vars.folder_options
        max_results: = vars.max
      token_name: = input.token_name
    as: rg
    on_item:
    - if: vars.limit_hit
      then:
      - title: Results after the limit are dropped (isCanceled)
        source: src/vs/workbench/services/search/common/textSearchManager.ts:62-64
        return:
          limit_hit: true
          folder_options: = vars.folder_options
          stats:
            type: textSearchProvider
    - if: vars.count + vars.item.matches > vars.max
      then:
      - title: 'Crossing maxResults: limit hit, trim the match to what is left, cancel the provider''s token'
        source: src/vs/workbench/services/search/common/textSearchManager.ts:66-74
        set:
          vars.limit_hit: true
          vars.item: '= {''resource'': vars.item.resource, ''matches'': vars.max - vars.count}'
    - set:
        vars.count: = vars.count + vars.item.matches
    - if: vars.item.matches > 0
      then:
      - title: The collector reports the file match through onProgress
        source: src/vs/workbench/services/search/common/textSearchManager.ts:76-81
        yield: = vars.item
  - title: limitHit from the manager or the provider; stats type
    source: src/vs/workbench/services/search/common/textSearchManager.ts:87-97
    return:
      limit_hit: = vars.limit_hit || (has(vars.rg.value.limit_hit) && vars.rg.value.limit_hit)
      folder_options: = vars.folder_options
      stats:
        type: textSearchProvider
- component: ripgrep-text-search-engine
  name: provide-text-search-results
  kind: function
  summary: 'RipgrepTextSearchEngine.provideTextSearchResults: one rg process per folder; the parser reports each file''s matches as progress and, once it has counted maxResults, emits hitLimit, which kills
    rg and resolves {limitHit: true}. An empty pattern returns at once; a canceled token kills rg.'
  sources:
  - src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:29-51
  - src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:53-173
  request:
    type: object
    required:
    - query
    - options
    properties:
      query:
        type: object
        properties:
          pattern:
            type: string
            examples:
            - add
          is_case_sensitive:
            type: boolean
            default: false
      options:
        type: object
        properties:
          folder_options:
            type: array
            items:
              type: object
              properties:
                folder:
                  type: string
                  examples:
                  - file:///work/app
                encoding:
                  type: string
                files:
                  type: array
                  items:
                    type: string
          max_results:
            type: integer
            default: 20000
      token_name:
        type: string
        default: ''
  response:
    type: object
    properties:
      limit_hit:
        type: boolean
  behavior:
  - if: input.query.pattern == ''
    then:
    - title: No pattern, nothing to search
      source: src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:63-65
      return:
        limit_hit: false
  - set:
      vars.num: 0
      vars.limit_hit: false
      vars.max: '= has(input.options.max_results) ? input.options.max_results : 20000'
      vars.pattern: '= input.query.is_case_sensitive ? input.query.pattern : input.query.pattern.lowerAscii()'
  - title: One rg run per folder option (Promise.all over folderOptions); the walk visits the folder's files
    source: src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:30-40
    foreach: = input.options.folder_options
    as: fo
    steps:
    - foreach: '= has(vars.fo.files) ? vars.fo.files : [''src/main.ts'', ''src/util.ts'', ''README.md'', ''package.json'']'
      as: rel
      steps:
      - if: vars.limit_hit || (has(input.token_name) && input.token_name != '' && canceled(input.token_name))
        then:
        - title: hitLimit or token cancellation called cancel(), which kills rg; no more output
          source: src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:109-121
          continue: true
      - title: rg reads the file (one JSON line per match on stdout)
        source: src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:124-130
        call: disk.read-file
        input:
          resource: = vars.fo.folder + '/' + vars.rel
        as: f
        on_error: continue
      - if: '!vars.f.ok || !has(vars.f.value.content)'
        then:
        - continue: true
      - wait: 5
      - set:
          vars.n: '= size((input.query.is_case_sensitive ? vars.f.value.content : vars.f.value.content.lowerAscii()).split(vars.pattern)) - 1'
      - if: vars.n == 0
        then:
        - continue: true
      - if: vars.num + vars.n >= vars.max
        then:
        - title: The parser counts submatches; reaching maxResults sets hitLimit after finishing the line
          source: src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:381-389
          set:
            vars.limit_hit: true
            vars.n: = vars.max - vars.num
      - set:
          vars.num: = vars.num + vars.n
      - title: ripgrepParser 'result' -> progress.report(match)
        source: src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:99-106
        yield: '= {''resource'': vars.fo.folder + ''/'' + vars.rel, ''matches'': vars.n}'
  - title: rg closed (or was killed on hitLimit); resolve {limitHit}
    source: src/vs/workbench/services/search/node/ripgrepTextSearchEngine.ts:148-171
    return:
      limit_hit: = vars.limit_hit
- component: workspace-symbol-provider-registry
  name: register
  kind: function
  summary: 'WorkspaceSymbolProviderRegistry.register: adds a workspace symbol provider (the main thread registers one proxy per extension provider in $registerNavigateTypeSupport).'
  sources:
  - src/vs/workbench/contrib/search/common/search.ts:60-79
  request:
    type: object
    required:
    - handle
    properties:
      handle:
        type: integer
        examples:
        - 1
      extension_id:
        type: string
        examples:
        - vscode.typescript-language-features
  response:
    type: object
    properties:
      count:
        type: integer
  behavior:
  - set:
      state.providers: '= state.providers + [{''handle'': input.handle, ''extension_id'': has(input.extension_id) ? input.extension_id : ''''}]'
  - return:
      count: = size(state.providers)
- component: workspace-symbol-provider-registry
  name: get-workspace-symbols
  kind: function
  summary: 'getWorkspaceSymbols(query, token): asks every registered provider at once (Promise.all); a provider error is swallowed (onUnexpectedExternalError); a canceled token yields []; results are sorted
    and de-duplicated.'
  sources:
  - src/vs/workbench/contrib/search/common/search.ts:88-130
  - src/vs/workbench/contrib/search/common/search.ts:81-83
  request:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        examples:
        - add
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response:
    type: object
    properties:
      symbols:
        type: array
        items:
          type: object
      provider_count:
        type: integer
  behavior:
  - if: size(state.providers) == 0
    then:
    - return:
        symbols: []
        provider_count: 0
  - title: provider.provideWorkspaceSymbols for every provider (MainThreadLanguageFeatures proxies it as $provideWorkspaceSymbols to the extension host)
    source: src/vs/workbench/contrib/search/common/search.ts:92-104
    parallel: = state.providers
    as: p
    steps:
    - call: ext-host-language-features.provide-workspace-symbols
      'on': = 'eh' + self.substring(1)
      input:
        handle: = vars.p.handle
        search: = input.query
        token:
          canceled: false
      as: r
      on_error:
      - title: onUnexpectedExternalError, the provider adds nothing
        source: src/vs/workbench/contrib/search/common/search.ts:101-103
        return: []
    - return: '= has(vars.r.value.symbols) ? vars.r.value.symbols : []'
    join:
      need: all
    as_result: all
  - if: has(input.token) && input.token.canceled
    then:
    - title: A canceled token returns no symbols
      source: src/vs/workbench/contrib/search/common/search.ts:108-110
      return:
        symbols: []
        provider_count: = size(state.providers)
  - return:
      symbols: = vars.all.results.filter(x, x.ok).map(x, x.value).flatten()
      provider_count: = size(state.providers)
- component: file-commands
  name: resolve-command-editor
  kind: function
  summary: 'The editor a file command acts on: an explicit editor from the command arguments (a URI first argument, or the resource the open editors view selected), else the active editor of the active
    group; none when no editor is active.'
  sources:
  - src/vs/workbench/contrib/files/browser/fileCommands.ts:416-439
  request:
    type: object
    properties:
      args:
        type: array
        items: {}
        default: []
      resource:
        type: string
  response:
    type: object
    properties:
      resource:
        type: string
      group_id:
        type: integer
      found:
        type: boolean
  behavior:
  - if: has(input.args) && size(input.args) > 0 && type(input.args[0]) == string && input.args[0].contains(':')
    then:
    - title: getEditorsFromCommandArgs - an explicit editor context in the arguments wins
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:421-424
      return:
        resource: = input.args[0]
        found: true
  - if: has(input.resource) && input.resource != ''
    then:
    - title: getOpenEditorsViewMultiSelection - the selected editor
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:426-429
      return:
        resource: = input.resource
        found: true
  - title: Otherwise the active editor of the active group
    source: src/vs/workbench/contrib/files/browser/fileCommands.ts:430-435
    call: editor-groups.get-state
    as: st
  - set:
      vars.g: = vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)
  - if: size(vars.g) == 0 || vars.g[0].active == null
    then:
    - title: No active editor, nothing to act on
      source: src/vs/workbench/contrib/files/browser/fileCommands.ts:437-439
      return:
        resource: ''
        found: false
  - return:
      resource: = vars.g[0].active
      group_id: = vars.g[0].id
      found: true
