- component: file-actions
  name: delete-files
  kind: function
  summary: 'deleteFiles: confirm when deleting files with unsaved changes; confirm the delete (trash or permanent) unless explorer.confirmDelete is off; apply the delete edit; if the trash fails, offer
    to delete permanently.'
  sources:
  - src/vs/workbench/contrib/files/browser/fileActions.ts:87-253
  request:
    type: object
    required:
    - resources
    properties:
      resources:
        type: array
        items:
          type: string
        default:
        - file:///work/app/README.md
      use_trash:
        type: boolean
        default: true
      skip_confirm:
        type: boolean
        default: false
      ignore_if_not_exists:
        type: boolean
        default: false
  response:
    type: object
    properties:
      deleted:
        type: boolean
      permanently:
        type: boolean
  behavior:
  - set:
      vars.skip_confirm: = has(input.skip_confirm) && input.skip_confirm
      vars.dirty: []
  - foreach: = input.resources
    as: r
    steps:
    - call: working-copy-file-service.get-dirty
      input:
        resource: = vars.r
      as: d
    - set:
        vars.dirty: = vars.dirty + vars.d.value.resources
  - if: size(vars.dirty) > 0
    then:
    - title: Deleting files with unsaved changes asks to continue
      source: src/vs/workbench/contrib/files/browser/fileActions.ts:104-131
      choice: confirm_dirty
      default: confirmed
      options:
        confirmed:
        - set:
            vars.skip_confirm: true
        canceled:
        - return:
            deleted: false
            permanently: false
  - if: '!vars.skip_confirm && config[''explorer-confirm-delete''] != false'
    then:
    - title: Confirm moving to trash or deleting permanently (with a 'do not ask again' checkbox for trash)
      source: src/vs/workbench/contrib/files/browser/fileActions.ts:165-201
      choice: confirm_delete
      default: confirmed
      options:
        confirmed: []
        confirmed_do_not_ask_again:
        - title: Remember the checkbox in explorer.confirmDelete
          source: src/vs/workbench/contrib/files/browser/fileActions.ts:203-205
          call: configuration-service.update-value
          input:
            key: explorer.confirmDelete
            value: false
        canceled:
        - return:
            deleted: false
            permanently: false
  - title: Apply the delete as resource file edits through the explorer
    source: src/vs/workbench/contrib/files/browser/fileActions.ts:213-219
    call: explorer-service.apply-bulk-edit
    input:
      edits: '= input.resources.map(r, {''type'': ''file'', ''op'': ''delete'', ''resource'': r, ''options'': {''recursive'': true, ''skip_trash_bin'': !input.use_trash, ''ignore_if_not_exists'': has(input.ignore_if_not_exists)
        && input.ignore_if_not_exists}})'
      undo_label: delete
    as: applied
    on_error:
    - title: Delete failed; offer Delete Permanently (trash) or Retry
      source: src/vs/workbench/contrib/files/browser/fileActions.ts:220-252
      choice: retry
      default: '= has(input.ignore_if_not_exists) && input.ignore_if_not_exists ? ''canceled'' : ''confirmed'''
      options:
        confirmed:
        - call: file-actions.delete-files
          input:
            resources: = input.resources
            use_trash: false
            skip_confirm: true
            ignore_if_not_exists: true
          as: again
        - return:
            deleted: = vars.again.value.deleted
            permanently: true
        canceled:
        - return:
            deleted: false
            permanently: false
  - return:
      deleted: true
      permanently: = !input.use_trash
