  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:295-339
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:527-594
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:596-654
