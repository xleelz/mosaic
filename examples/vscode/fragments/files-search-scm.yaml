- component: text-file-save-error-handler
  name: on-save-error
  kind: function
  summary: 'TextFileSaveErrorHandler.onSaveError: a newer file on disk shows the save conflict message (Compare / Overwrite); write-locked, permission denied and other errors show Retry/Unlock/Retry as
    Sudo plus Save As and Revert.'
  sources:
  - src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:104-190
  request:
    type: object
    required:
    - resource
    - error_code
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      error_code:
        type: string
        examples:
        - file-modified-since
      unlock:
        type: boolean
        default: false
  response:
    type: object
    properties:
      kind:
        type: string
      primary:
        type: array
        items:
          type: string
      secondary:
        type: array
        items:
          type: string
      shown:
        type: boolean
  behavior:
  - if: input.error_code == 'file-modified-since'
    then:
    - if: state.active_conflict_resolution_resource == input.resource
      then:
      - if: state.learn_more_ignored
        then:
        - title: Conflict help was dismissed for good
          source: src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:116-118
          return:
            kind: none
            primary: []
            secondary: []
            shown: false
      - title: Saved again from the conflict editor, show the conflict editor help
        source: src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:115-124
        set:
          vars.msg:
            kind: conflict-editor-help
            primary:
            - learn-more
            secondary:
            - do-not-show-again
            shown: true
      else:
      - title: Dirty write prevention, offer Compare and Overwrite
        source: src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:127-135
        set:
          vars.msg:
            kind: stale-save-error
            primary:
            - compare
            - overwrite
            secondary:
            - configure
            shown: true
    else:
    - set:
        vars.locked: = input.error_code == 'file-write-locked'
        vars.denied: = input.error_code == 'file-permission-denied'
        vars.can_elevate: = input.resource.startsWith('file:')
    - set:
        vars.tried_unlock: = vars.locked && has(input.unlock) && input.unlock
    - title: Pick the first action (save elevated, unlock or retry), then Save As and Revert
      source: src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:140-165
      set:
        vars.msg:
          kind: '= vars.locked ? (vars.tried_unlock && vars.can_elevate ? ''readonly-save-error-sudo'' : ''readonly-save-error'') : (vars.can_elevate && vars.denied ? ''permission-denied-save-error-sudo''
            : ''generic-save-error'')'
          primary: '= [vars.can_elevate && (vars.denied || vars.tried_unlock) ? ''save-elevated'' : (vars.locked ? ''unlock'' : ''retry''), ''save-as'', ''revert'']'
          secondary: []
          shown: true
  - title: Show the error notification (one per model)
    source: src/vs/workbench/contrib/files/browser/editors/textFileSaveErrorHandler.ts:180-189
    call: notification-service.notify
    input:
      severity: error
      message: = vars.msg.kind
      actions: = vars.msg.primary
  - set:
      state.messages: '= merge(state.messages, {input.resource: vars.msg})'
  - return: = vars.msg
- component: text-file-save-error-handler
