- component: text-file-models
  name: find-matches
  kind: function
  summary: 'SearchService.getOpenEditorResults: each open model is searched in memory (ITextModel.findMatches with maxResults + 1); a model with that many matches flags limitHit, is cut to maxResults and
    stops the scan.'
  sources:
  - src/vs/workbench/services/search/common/searchService.ts:496-571
  request:
    type: object
    required:
    - pattern
    properties:
      pattern:
        type: string
        examples:
        - add
      max_results:
        type: integer
        default: 20000
  response: SearchComplete
  behavior:
  - set:
      vars.hits: []
      vars.limit_hit: false
      vars.ask: '= (has(input.max_results) ? input.max_results : 20000) + 1'
  - foreach: = state.models.map(r, r)
    as: r
    steps:
    - if: vars.limit_hit
      then:
      - title: Once the limit is hit the remaining models are skipped
        source: src/vs/workbench/services/search/common/searchService.ts:518-520
        continue: true
    - title: model.findMatches on the text model
      source: src/vs/workbench/services/search/common/searchService.ts:546-547
      call: text-model.get-value
      input:
        uri: = vars.r
      as: text
      on_error: continue
    - if: '!vars.text.ok'
      then:
      - continue: true
    - set:
        vars.n: = size(vars.text.value.value.split(input.pattern)) - 1
    - if: vars.n >= vars.ask
      then:
      - title: askMax matches, limit hit, keep maxResults
        source: src/vs/workbench/services/search/common/searchService.ts:549-553
        set:
          vars.limit_hit: true
          vars.n: = vars.ask - 1
    - if: vars.n > 0
      then:
      - set:
          vars.hits: '= vars.hits + [{''resource'': vars.r, ''matches'': vars.n}]'
  - return:
      results: = vars.hits
      limit_hit: = vars.limit_hit
