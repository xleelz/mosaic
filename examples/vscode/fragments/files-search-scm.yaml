- component: text-file-models
  name: update-text-model
  kind: function
  summary: 'BaseTextEditorModel.doCreateTextEditorModel / TextFileEditorModel.doUpdateTextModel: put new text into the resource''s text model. An existing text model gets the value (setValue, no undo stop)
    inside a block that ignores the content change for dirty tracking; otherwise IModelService.createModel creates it. The text file model keeps no copy of the text.'
  sources:
  - src/vs/workbench/common/editor/textEditorModel.ts:169-184
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:669-678
  request:
    type: object
    required:
    - resource
    - value
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      value:
        type: string
      language_id:
        type: string
        default: plaintext
  response:
    type: object
    properties:
      created:
        type: boolean
      version_id:
        type: integer
      alternative_version_id:
        type: integer
  behavior:
  - title: modelService.getModel(resource)
    source: src/vs/workbench/common/editor/textEditorModel.ts:170
    call: text-model.get-value
    input:
      uri: = input.resource
    as: existing
    on_error: continue
  - if: '!vars.existing.ok'
    then:
    - title: No text model yet, IModelService.createModel
      source: src/vs/workbench/common/editor/textEditorModel.ts:171-176
      call: model-service.create-model
      input:
        resource: = input.resource
        value: = input.value
        language_id: '= has(input.language_id) ? input.language_id : ''plaintext'''
      as: created
    - call: text-model.get-value
      input:
        uri: = input.resource
      as: now_text
    - return:
        created: true
        version_id: = vars.now_text.value.version_id
        alternative_version_id: = vars.now_text.value.alternative_version_id
  - if: input.resource in state.models
    then:
    - title: ignoreDirtyOnModelContentChange = true while the value is replaced
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:673
      set:
        state.models: '= merge(state.models, {input.resource: {''ignore_dirty'': true}})'
  - title: The existing text model gets the new value (setValue bumps versionId and alternativeVersionId, pushes no undo stop)
    source: src/vs/workbench/common/editor/textEditorModel.ts:177-178
    call: text-model.set-value
    input:
      uri: = input.resource
      value: = input.value
    as: setv
  - if: input.resource in state.models
    then:
    - title: The finally block re-enables dirty tracking
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:676-678
      set:
        state.models: '= merge(state.models, {input.resource: {''ignore_dirty'': false}})'
  - return:
      created: false
      version_id: = vars.setv.value.version_id
      alternative_version_id: = vars.setv.value.alternative_version_id
- component: text-file-save-participant
  name: skip
  kind: function
  summary: 'The "Skip" action of the save participants progress notification: once the notification is shown (after its delay), Skip cancels the run''s token (cts.cancel()).'
  sources:
  - src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:81-83
  - src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:49-55
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
  response:
    type: object
    properties:
      skipped:
        type: boolean
  behavior:
  - if: '!(input.resource in state.running)'
    then:
    - title: No save participants running for the resource, no progress to skip
      source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:49-55
      return:
        skipped: false
  - if: now < state.running[input.resource].started + state.running[input.resource].delay
    then:
    - title: The progress notification only shows after its delay, so there is no Skip yet
      source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:54
      return:
        skipped: false
  - title: Skip cancels the participants' token
    source: src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:81-83
    cancel: = state.running[input.resource].token
  - return:
      skipped: true
- component: search-service
  name: text-search
  kind: function
  summary: 'ISearchService.textSearch(query, token, onProgress): runs textSearchSplitSyncAsync, passes every progress item through, and resolves with the async results followed by the open editor results;
    limitHit if either hit it.'
  sources:
