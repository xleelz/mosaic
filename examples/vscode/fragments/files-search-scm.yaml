- component: search-model
  name: search
  kind: function
  summary: 'SearchModelImpl.search/doSearch: cancels the running search, sets the new query on the result tree (clearing it), starts a CancellationTokenSource, then searches notebooks and text; every progress
    item lands in the result tree as it arrives. A cancel keeps what arrived.'
  sources:
  - src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:213-260
  - src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:155-204
  request:
    type: object
    required:
    - query
    properties:
      query:
        $ref: SearchTextQuery
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response: SearchComplete
  behavior:
  - if: has(state.current_token) && state.current_token != ''
    then:
    - title: cancelSearch(true) cancels the search still running
      source: src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:219
      cancel: = state.current_token
  - title: A new CancellationTokenSource for this search (currentCancelTokenSource)
    source: src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:170
    set:
      state.searches: = state.searches + 1
      vars.tok: = 'search-' + self + '-' + string(state.searches + 1)
  - title: The result tree takes the new query, which clears its matches
    source: src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:227
    set:
      state.current_token: = vars.tok
      state.results: []
      state.limit_hit: false
  - title: Notebook search first, so text search can skip notebook files
    source: src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:172
    call: notebook-search-service.notebook-search
    input:
      query: = input.query
    as: nb
  - title: Text search split into open editor (sync) and provider (async) results; onSearchProgress adds each file match to the result tree
    source: src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:173-179
    call: search-service.text-search-split-sync-async
    stream: true
    token: = vars.tok
    input:
      query: = input.query
      token: '= has(input.token) ? input.token : {''canceled'': false}'
    as: text
    on_item:
    - title: onSearchProgress adds the file match (one per resource)
      source: src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:157-161
      set:
        state.results: = state.results.filter(r, r.resource != vars.item.resource) + [vars.item]
    on_error:
    - if: error.code == 'canceled'
      then:
      - title: Canceled; the results already received stay in the tree
        source: src/vs/workbench/contrib/search/browser/searchTreeModel/searchModel.ts:381-387
        set:
          state.current_token: ''
      - return:
          results: = state.results
          limit_hit: = state.limit_hit
          canceled: true
    - fail: = error
  - set:
      state.results: = state.results + vars.nb.value.results.filter(n, !(n.resource in state.results.map(r, r.resource)))
      state.limit_hit: = vars.text.value.async_results.limit_hit || vars.text.value.sync_results.limit_hit || vars.nb.value.limit_hit
      state.current_token: ''
  - return:
      results: = state.results
