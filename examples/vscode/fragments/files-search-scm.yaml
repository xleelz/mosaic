- id: text-file-service
  name: NativeTextFileService
  kind: service
  layer: workbench
  parent: workbench
  summary: 'ITextFileService: save, save as, revert, read and write of text files; desktop implementation NativeTextFileService over AbstractTextFileService.'
  sources:
  - src/vs/workbench/services/textfile/common/textfiles.ts:23
  - src/vs/workbench/services/textfile/electron-browser/nativeTextFileService.ts:118
  - src/vs/workbench/services/textfile/browser/textFileService.ts:47
  attributes:
    owner: files-search-scm
    implements: ITextFileService
- id: text-file-save-participant
  name: TextFileSaveParticipant
  kind: module
  layer: workbench
  parent: text-file-models
  summary: Runs the registered text file save participants in ordinal order; a participant's CancellationError cancels the save.
  sources:
  - src/vs/workbench/services/textfile/common/textFileSaveParticipant.ts:18-93
  attributes:
    owner: files-search-scm
  state:
    schema:
      type: object
      properties:
        participants:
          type: array
          items:
            type: string
        running:
          type: object
        runs:
          type: integer
    initial:
