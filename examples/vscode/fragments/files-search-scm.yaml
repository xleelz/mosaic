    input:
      query: = input.query
      token: '= has(input.token) ? input.token : {''canceled'': false}'
    as: split
    on_item:
    - yield: = vars.item
  - title: Await the async part, then merge the results; limitHit from either part
    source: src/vs/workbench/services/search/common/searchService.ts:85-90
    return:
      results: = vars.split.value.async_results.results + vars.split.value.sync_results.results
      limit_hit: = vars.split.value.async_results.limit_hit || vars.split.value.sync_results.limit_hit
- component: search-model
