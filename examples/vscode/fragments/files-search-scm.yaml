- component: model-service
  name: create-model
  kind: function
  attributes:
    boundary: true
    owner: editor
  request:
    type: object
    required:
    - resource
    - value
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      value:
        type: string
        examples:
        - "import { add } from './util';\nconsole.log(add(1, 2));\n"
      language_id:
        type: string
        default: plaintext
        examples:
        - typescript
  response:
    type: object
    properties:
      resource:
        type: string
      version_id:
        type: integer
  errors:
  - code: model-already-exists
    status: 0
    retryable: false
  summary: 'ModelService.createModel: a new TextModel for the resource (plaintext without a language); a second model for the same resource is a programmer error (contract copied from editor).'
- component: command-service
  name: execute-command
