# files-search-scm fragment of the VS Code 1.144 ontology (text files, working copies, explorer, search, SCM, problems, merge and multi diff editors).
schema_version: 1
id: vscode
configs:
- id: files-auto-save
  type: string
  value: 'off'
  default: 'off'
  summary: files.autoSave. Desktop default is off; the same registration defaults to afterDelay on web (isWeb) and in the agents window (agentsWindow.default). product.json does not override it.
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:261-274
  - src/vs/workbench/services/filesConfiguration/common/filesConfigurationService.ts:362-367
  attributes:
    key: files.autoSave
    owner: files-search-scm
- id: files-auto-save-delay
  type: integer
  value: 1000
  default: 1000
  summary: files.autoSaveDelay in ms; a delay <= 1000 counts as a short auto save delay (FilesConfigurationService.DEFAULT_AUTO_SAVE_DELAY).
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:275-281
  - src/vs/workbench/services/filesConfiguration/common/filesConfigurationService.ts:128
  attributes:
    key: files.autoSaveDelay
    owner: files-search-scm
- id: editor-format-on-save
  type: boolean
  value: false
  default: false
  summary: editor.formatOnSave. The registration has no default, so the configuration service returns undefined, read as false. Read by the editor area's format-on-save participant.
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:391-395
  - src/vs/workbench/contrib/codeEditor/browser/saveParticipants.ts:246
  attributes:
    key: editor.formatOnSave
    owner: files-search-scm
- id: files-participants-timeout
  type: integer
  value: 60000
  default: 60000
  summary: files.participants.timeout in ms for create/rename/delete participants; 0 or less disables them.
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:380-384
  - src/vs/workbench/services/workingCopy/common/workingCopyFileOperationParticipant.ts:32-35
  attributes:
    key: files.participants.timeout
    owner: files-search-scm
- id: search-max-results
  type: integer
  value: 20000
  default: 20000
  summary: search.maxResults (nullable; null means unlimited). Default DEFAULT_MAX_SEARCH_RESULTS.
  sources:
  - src/vs/workbench/contrib/search/browser/search.common.contribution.ts:83-87
  - src/vs/workbench/services/search/common/search.ts:32
  attributes:
    key: search.maxResults
    owner: files-search-scm
- id: files-save-conflict-resolution
  type: string
  value: askUser
  default: askUser
  summary: 'files.saveConflictResolution: askUser keeps the etag check on save; overwriteFileOnDisk disables it.'
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:354-367
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1035
  attributes:
    key: files.saveConflictResolution
    owner: files-search-scm
- id: explorer-confirm-delete
  type: boolean
  value: true
  default: true
  summary: 'explorer.confirmDelete: ask before deleting from the explorer.'
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:494-498
  - src/vs/workbench/contrib/files/browser/fileActions.ts:177
  attributes:
    key: explorer.confirmDelete
    owner: files-search-scm
- id: workbench-local-history-enabled
  type: boolean
  value: true
  default: true
  summary: workbench.localHistory.enabled, registered by the workbench but read by WorkingCopyHistoryTracker.
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:480-485
  - src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:207-209
  attributes:
    key: workbench.localHistory.enabled
    owner: files-search-scm
- id: workbench-local-history-max-file-size
  type: integer
  value: 256
  default: 256
  summary: workbench.localHistory.maxFileSize in KB; larger files get no history entry.
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:486-492
  - src/vs/workbench/services/workingCopy/common/workingCopyHistoryTracker.ts:202-205
  attributes:
    key: workbench.localHistory.maxFileSize
    owner: files-search-scm
- id: files-hot-exit
  type: string
  value: onExit
  default: onExit
  summary: files.hotExit (reference; owner main-process). Native default onExit; web default onExitAndWindowClose.
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:122-128
  attributes:
    boundary: true
    owner: main-process
    key: files.hotExit
- id: files-eol
  type: string
  value: auto
  default: auto
  summary: 'files.eol: \n | \r\n | auto (the OS end of line). No product.json override, so deployed = default. A new text file model records the resolved EOL; the editor''s ModelService applies it to new
    text models.'
  sources:
  - src/vs/workbench/contrib/files/browser/files.contribution.ts:216-230
  - src/vs/editor/common/services/modelService.ts:184-194
  attributes:
    key: files.eol
schemas:
- id: FilesTextFileModel
  summary: One text file model as get returns it. The stored entry of text-file-models.models holds only the file state (dirty, saved_version_id = the alternative version id remembered at save, mtime, etag,
    size, encoding, eol and the conflict/error/orphaned/readonly flags); value, version_id, alternative_version_id and language_id are read from the editor's text model.
  schema:
    type: object
    properties:
      value:
        type: string
      version_id:
        type: integer
        minimum: 1
      saved_version_id:
        type: integer
      dirty:
        type: boolean
      language_id:
        type: string
        examples:
        - typescript
      mtime:
        type: integer
      etag:
        type: string
      size:
        type: integer
      conflict:
        type: boolean
      error:
        type: boolean
      orphaned:
        type: boolean
      readonly:
        type: boolean
      alternative_version_id:
        type: integer
      encoding:
        type: string
        examples:
        - utf8
      eol:
        type: string
        examples:
        - "\n"
- id: FilesResourceRequest
  schema:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
- id: FilesSaveRequest
  schema:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      options:
        $ref: FilesSaveOptions
- id: FilesSaveResult
  schema:
    type: object
    properties:
      saved:
        type: boolean
      resource:
        type: string
      skipped:
        type: string
      error_code:
        type: string
- id: FilesFileStat
  summary: IFileStatWithMetadata fields this area reads.
  schema:
    type: object
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      mtime:
        type: integer
      size:
        type: integer
      etag:
        type: string
      readonly:
        type: boolean
        default: false
- id: FilesCommandRequest
  summary: A command invocation routed to this area's handlers.
  schema:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
        - workbench.action.files.save
      args:
        type: array
        items: {}
        default: []
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      repository_id:
        type: string
        examples:
        - scm0
      query:
        type: string
        examples:
        - add
- id: FilesWorkingCopyFileOperation
  schema:
    type: object
    properties:
      operation:
        type: string
        enum:
        - create
        - move
        - copy
        - delete
      files:
        type: array
        items:
          type: object
          properties:
            source:
              type: string
            target:
              type: string
              examples:
              - file:///work/app/src/main.ts
- id: SearchTextQuery
  summary: ITextQuery fields this area reads.
  schema:
    type: object
    properties:
      pattern:
        type: string
        examples:
        - add
      is_regex:
        type: boolean
        default: false
      is_case_sensitive:
        type: boolean
        default: false
      is_word_match:
        type: boolean
        default: false
      folders:
        type: array
        items:
          type: string
        default:
        - file:///work/app
      include_pattern:
        type: string
        default: ''
      exclude_pattern:
        type: string
        default: ''
      max_results:
        type: integer
        default: 20000
      folder_queries:
        type: array
        description: 'ITextQuery.folderQueries: per-folder options such as fileEncoding'
        items:
          type: object
          properties:
            folder:
              type: string
              examples:
              - file:///work/app
            file_encoding:
              type: string
              examples:
              - windows1252
- id: SearchComplete
  summary: 'ISearchComplete: per-file matches and whether the result limit was hit.'
  schema:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            resource:
              type: string
              examples:
              - file:///work/app/src/util.ts
            matches:
              type: integer
              minimum: 1
              maximum: 3
      limit_hit:
        type: boolean
        default: false
      pending:
        type: boolean
- id: ScmProvider
  summary: The ISCMProvider fields this area reads (MainThreadSCMProvider on the renderer side).
  schema:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - scm0
      label:
        type: string
        examples:
        - Git
      root_uri:
        type: string
        examples:
        - file:///work/app
      accept_input_command:
        type:
        - object
        - 'null'
        default: null
        properties:
          id:
            type: string
            examples:
            - git.commit
          arguments:
            type: array
            items: {}
            default: []
