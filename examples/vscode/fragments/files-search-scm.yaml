- component: search-actions
  name: cmd-executeworkspacesymbolprovider
  kind: command
  summary: '_executeWorkspaceSymbolProvider (API command behind vscode.executeWorkspaceSymbolProvider): asserts the query is a string, runs getWorkspaceSymbols over the registered providers and returns
    the symbols.'
  sources:
  - src/vs/workbench/contrib/search/browser/search.contribution.ts:242-247
  attributes:
    command_id: _executeWorkspaceSymbolProvider
  request: FilesCommandRequest
  response:
    type: object
    properties:
      handled:
        type: boolean
      result: {}
  errors:
  - code: unexpected-type
    status: 0
    retryable: false
  behavior:
  - set:
      vars.args: '= has(input.args) ? input.args : []'
  - if: size(vars.args) == 0 || type(vars.args[0]) != string
    then:
    - title: assertType(typeof query === 'string') throws
      source: src/vs/workbench/contrib/search/browser/search.contribution.ts:244
      fail:
        code: unexpected-type
        message: Unexpected type
  - title: getWorkspaceSymbols(query), then the symbols
    source: src/vs/workbench/contrib/search/browser/search.contribution.ts:245-246
    call: workspace-symbol-provider-registry.get-workspace-symbols
    input:
      query: = vars.args[0]
    as: res
  - return:
      handled: true
      result: = vars.res.value.symbols
