  - steps.save.result.ok && steps.save.result.value.result.success
  - '!steps.get.result.value.model.dirty && steps.get.result.value.model.saved_version_id == 2'
  - calls['file-service.write-file'] == 1 && calls['format-on-save-participant.participate'] == 1 && calls['ext-host-save-participant.participate'] == 1
