interfaces:
- component: text-file-service
  name: save
  kind: function
  summary: 'ITextFileService.save: untitled resources go through save as; file resources save their text file model, returning the resource when the model ends up saved.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:351-385
  request: FilesSaveRequest
  response: FilesSaveResult
  behavior:
  - if: input.resource.startsWith('untitled:')
    then:
    - title: Untitled resource asks for a target and saves as
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:354-375
      call: text-file-service.save-as
      input:
        source: = input.resource
      as: saveas
    - return:
        saved: = vars.saveas.value.saved
        resource: '= has(vars.saveas.value.resource) ? vars.saveas.value.resource : '''''
  - call: text-file-models.get
    input:
      resource: = input.resource
    as: lookup
  - if: '!vars.lookup.value.exists'
    then:
    - title: No text file model for the resource, nothing to save
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:379-384
      return:
        saved: false
        resource: ''
        skipped: no-model
  - title: Save the text file model
    source: src/vs/workbench/services/textfile/browser/textFileService.ts:379-381
    call: text-file-models.save
    input:
      resource: = input.resource
      options: '= has(input.options) ? input.options : {}'
    as: saved
  - return: '= vars.saved.value.saved ? merge(vars.saved.value, {''resource'': input.resource}) : merge(vars.saved.value, {''resource'': ''''})'
- component: text-file-service
  name: save-as
  kind: function
  summary: 'ITextFileService.saveAs: pick a target if none, save in place when source equals target, otherwise copy the source contents into the target model and save it.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:387-434
  - src/vs/workbench/services/textfile/browser/textFileService.ts:436-498
  request:
    type: object
    required:
    - source
    properties:
      source:
        type: string
        examples:
        - file:///work/app/src/main.ts
      target:
        type:
        - string
        - 'null'
        default: null
      options:
        $ref: FilesSaveOptions
  response: FilesSaveResult
  behavior:
  - set:
      vars.target: '= has(input.target) && input.target != null ? input.target : '''''
  - if: vars.target == ''
    then:
    - title: Ask the user for a target
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:389-392
      call: file-dialog-service.pick-file-to-save
      input:
        default_uri: = input.source
      as: pick
    - set:
        vars.target: '= has(vars.pick.value.resource) ? vars.pick.value.resource : '''''
  - if: vars.target == ''
    then:
    - title: User canceled the dialog
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:394-396
      return:
        saved: false
        skipped: canceled
  - if: vars.target == input.source
    then:
    - title: Same target, force a save of the model
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:409-411
      call: text-file-models.save
      input:
        resource: = input.source
        options:
          reason: explicit
          force: true
      as: same
    - return:
        saved: = vars.same.value.saved
        resource: = input.source
  - call: text-file-models.get
    input:
      resource: = input.source
    as: src
  - if: '!vars.src.value.exists'
    then:
    - title: Source model cannot be resolved
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:436-460
      return:
        saved: false
        skipped: no-model
  - title: Resolve the target model with the source contents (dirty) and save it
    source: src/vs/workbench/services/textfile/browser/textFileService.ts:500-626
    call: text-file-models.resolve
    input:
      resource: = vars.target
      contents: = vars.src.value.model.value
  - call: text-file-models.save
    input:
      resource: = vars.target
      options:
        reason: explicit
        force: true
    as: tgt
  - return:
      saved: = vars.tgt.value.saved
      resource: = vars.target
- component: text-file-service
  name: revert
  kind: function
  summary: 'ITextFileService.revert: reverts a file model only when it is dirty or the revert is forced.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:735-752
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      options:
        type: object
        properties:
          soft:
            type: boolean
            default: false
          force:
            type: boolean
            default: false
  response:
    type: object
    properties:
      reverted:
        type: boolean
  behavior:
  - call: text-file-models.get
    input:
      resource: = input.resource
    as: lookup
  - set:
      vars.force: = has(input.options) && has(input.options.force) && input.options.force
  - if: '!vars.lookup.value.exists || !(vars.lookup.value.model.dirty || vars.force)'
    then:
    - title: Nothing to revert (no model, or not dirty and not forced)
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:746-750
      return:
        reverted: false
  - call: text-file-models.revert
    input:
      resource: = input.resource
      options: '= has(input.options) ? input.options : {}'
  - return:
      reverted: true
- component: text-file-service
  name: is-dirty
  kind: function
  summary: 'ITextFileService.isDirty: asks the resource''s model; false without a model.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:758-765
  request: FilesResourceRequest
  response:
    type: object
    properties:
      dirty:
        type: boolean
  behavior:
  - call: text-file-models.get
    input:
      resource: = input.resource
    as: lookup
  - return:
      dirty: = vars.lookup.value.exists && vars.lookup.value.model.dirty
- component: text-file-service
  name: read
  kind: function
  summary: 'ITextFileService.read/readStream: reads through the file service and decodes; a binary stream is refused when text only is accepted.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:181-251
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      accept_text_only:
        type: boolean
        default: true
      etag:
        type: string
  response:
    type: object
    properties:
      value:
        type: string
      mtime:
        type: integer
      size:
        type: integer
      etag:
        type: string
      encoding:
        type: string
  errors:
  - code: file-is-binary
    status: 0
    retryable: false
    summary: TextFileOperationResult.FILE_IS_BINARY
  - code: file-not-found
    status: 0
    retryable: false
  - code: file-not-modified-since
    status: 0
    retryable: false
  behavior:
  - title: Read the raw content from the file service
    source: src/vs/workbench/services/textfile/browser/textFileService.ts:213-223
    call: file-service.read-file
    input:
      resource: = input.resource
      etag: '= has(input.etag) ? input.etag : '''''
    as: raw
  - title: Decode the stream; the encoding library flags binary content
    source: src/vs/workbench/services/textfile/browser/textFileService.ts:225-250
    choice: decode
    default: text
    options:
      text:
      - return:
          value: = vars.raw.value.value
          mtime: = vars.raw.value.mtime
          size: = vars.raw.value.size
          etag: = vars.raw.value.etag
          encoding: utf8
      binary:
      - if: '!has(input.accept_text_only) || input.accept_text_only'
        then:
        - title: File seems to be binary and cannot be opened as text
          source: src/vs/workbench/services/textfile/browser/textFileService.ts:241-243
          fail:
            code: file-is-binary
            message: File seems to be binary and cannot be opened as text
      - return:
          value: ''
          mtime: = vars.raw.value.mtime
          size: = vars.raw.value.size
          etag: = vars.raw.value.etag
          encoding: binary
- component: text-file-service
  name: write
  kind: function
  summary: 'ITextFileService.write: encodes and writes through the file service, or the elevated file service when asked.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:266-274
  request:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      value:
        type: string
      mtime:
        type: integer
      etag:
        type: string
      unlock:
        type: boolean
        default: false
      write_elevated:
        type: boolean
        default: false
  response: FilesFileStat
  behavior:
  - if: has(input.write_elevated) && input.write_elevated
    then:
    - title: Write elevated (sudo / admin)
      source: src/vs/workbench/services/textfile/browser/textFileService.ts:269-271
      call: elevated-file-service.write-file-elevated
      input:
        resource: = input.resource
        value: = input.value
      as: elevated
    - return: = vars.elevated.value
  - title: Write through the file service with the mtime/etag guard
    source: src/vs/workbench/services/textfile/browser/textFileService.ts:273
    call: file-service.write-file
    input:
      resource: = input.resource
      content: = input.value
      mtime: = input.mtime
      etag: = input.etag
      unlock: = has(input.unlock) && input.unlock
    as: written
  - return: = vars.written.value
- component: text-file-service
  name: create
  kind: function
  summary: 'ITextFileService.create: encodes each value and creates the files with those contents through the working copy file service.'
  sources:
  - src/vs/workbench/services/textfile/browser/textFileService.ts:253-264
  request:
    type: object
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/new.ts
      value:
        type: string
        default: ''
      overwrite:
        type: boolean
        default: false
  response:
    type: object
    properties:
      created:
        type: boolean
  behavior:
  - title: Encode the value (UTF-8, no BOM by default) and create the file with it as contents
    source: src/vs/workbench/services/textfile/browser/textFileService.ts:255-261
    call: working-copy-file-service.create
    input:
      operation: create
      files:
      - target: = input.resource
        contents: '= has(input.value) ? input.value : '''''
      overwrite: = has(input.overwrite) && input.overwrite
  - return:
      created: true
- component: text-file-models
  name: get
  kind: function
  summary: 'TextFileEditorModelManager.get: the model for a resource, if one is open. The file state (dirty, saved alternative version, mtime, encoding, eol) is the model''s own; value, version_id and alternative_version_id
    are read live from its textEditorModel, the editor''s text model, which holds the one copy of the document text.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:342-344
  - src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1100-1108
  request: FilesResourceRequest
  response:
    type: object
    properties:
      exists:
        type: boolean
      model:
        $ref: FilesTextFileModel
  behavior:
  - if: '!(input.resource in state.models)'
    then:
    - return:
        exists: false
  - title: The text and its versions come from the model's textEditorModel (getValue, getAlternativeVersionId)
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:1107
    call: text-model.get-value
    input:
      uri: = input.resource
    as: text
