      value: = vars.content.value.value
      language_id: = vars.lang
    as: updated
  - title: 'Remember the stat and encoding, then setDirty(false): bufferSavedVersionId = the text model''s alternative version id'
    source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:606-650
    set:
      state.models: '= merge(state.models, {input.resource: {''saved_version_id'': vars.updated.value.alternative_version_id, ''dirty'': false, ''orphaned'': false, ''conflict'': false, ''error'': false,
        ''mtime'': vars.content.value.mtime, ''etag'': vars.content.value.etag, ''size'': vars.content.value.size, ''encoding'': vars.content.value.encoding, ''eol'': vars.exists && has(state.models[input.resource].eol)
        ? state.models[input.resource].eol : vars.eol}})'
  - if: '!vars.exists'
    then:
    - title: A new model registers as a working copy
      source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:451-462
      call: working-copy-service.register-working-copy
      input:
        resource: = input.resource
        type_id: ''
  - call: text-file-models.get
    input:
      resource: = input.resource
    as: cur
  - return: = vars.cur.value.model
