- component: text-file-models
  name: on-will-run-working-copy-file-operation
  kind: event
  subscribe:
  - working-copy-file-service.on-will-run-working-copy-file-operation
  summary: 'TextFileEditorModelManager.onWillRunWorkingCopyFileOperation: before a move/copy remember every model at or under the source, with its dirty contents, to restore at the target.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:201-255
  request: FilesWorkingCopyFileOperation
  behavior:
  - if: '!(input.operation in [''move'', ''copy''])'
    then:
    - return:
        remembered: 0
  - set:
      vars.restore: []
  - foreach: = input.files
    as: f
    steps:
    - if: '!has(vars.f.source) || vars.f.source == vars.f.target'
      then:
      - continue: true
    - foreach: = state.models.map(r, r).filter(r, r == vars.f.source || r.startsWith(vars.f.source + '/'))
      as: r
      steps:
      - if: state.models[vars.r].dirty
        then:
        - title: A dirty source model contributes its text model snapshot
          source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:247
          call: text-model.get-value
          input:
            uri: = vars.r
          as: snap
      - title: Remember source models (and their dirty snapshot) with their target resource
        source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:213-249
        set:
          vars.restore: '= vars.restore + [{''source'': vars.r, ''target'': vars.f.target + vars.r.substring(size(vars.f.source)), ''snapshot'': state.models[vars.r].dirty ? vars.snap.value.value : '''',
            ''dirty'': state.models[vars.r].dirty}]'
  - set:
      state.models_to_restore: = vars.restore
  - return:
      remembered: = size(vars.restore)
- component: text-file-models
  name: on-did-fail-working-copy-file-operation
  kind: event
  subscribe:
  - working-copy-file-service.on-did-fail-working-copy-file-operation
  summary: 'TextFileEditorModelManager.onDidFailWorkingCopyFileOperation: a failed move/copy puts the dirty flag back on models that were dirty (they were only soft reverted).'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:257-275
  request: FilesWorkingCopyFileOperation
  behavior:
  - if: '!(input.operation in [''move'', ''copy'']) || !has(state.models_to_restore)'
    then:
    - return:
        restored: 0
  - foreach: = state.models_to_restore
    as: m
    steps:
    - if: vars.m.dirty && vars.m.source in state.models
      then:
      - title: Restore the dirty flag of the source model
        source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:265-271
        set:
          state.models: '= merge(state.models, {vars.m.source: {''dirty'': true}})'
      - publish: text-file-models.on-did-change-dirty
        input:
          resource: = vars.m.source
          dirty: true
        delivery: sync
  - set:
      state.models_to_restore: []
  - return:
      restored: true
- component: text-file-models
  name: on-did-run-working-copy-file-operation
  kind: event
  subscribe:
  - working-copy-file-service.on-did-run-working-copy-file-operation
  summary: 'TextFileEditorModelManager.onDidRunWorkingCopyFileOperation: after create, revert existing target models; after move/copy, resolve each remembered model at its target, passing the dirty contents
    or forcing a reload.'
  sources:
  - src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:277-340
  request: FilesWorkingCopyFileOperation
  behavior:
  - if: input.operation == 'create'
    then:
    - foreach: = input.files
      as: f
      steps:
      - if: vars.f.target in state.models
        then:
        - title: Revert an existing model of a created file
          source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:281-290
          call: text-file-models.revert
          input:
            resource: = vars.f.target
    - return:
        restored: 0
  - if: '!(input.operation in [''move'', ''copy'']) || !has(state.models_to_restore)'
    then:
    - return:
        restored: 0
  - set:
      vars.restore: = state.models_to_restore
      state.models_to_restore: []
  - foreach: = vars.restore
    as: m
    steps:
    - if: vars.m.dirty
      then:
      - title: Restore at the target with the previous dirty contents
        source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:307-316
        call: text-file-models.resolve
        input:
          resource: = vars.m.target
          contents: = vars.m.snapshot
      else:
      - title: Restore at the target with a forced reload from disk
        source: src/vs/workbench/services/textfile/common/textFileEditorModelManager.ts:312-316
        call: text-file-models.resolve
        input:
          resource: = vars.m.target
          reload: true
        on_error: continue
  - return:
      restored: = size(vars.restore)
