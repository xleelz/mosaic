    - publish: text-file-models.on-did-change-dirty
      input:
        resource: = input.resource
        dirty: true
      delivery: sync
    - call: text-file-models.get
      input:
        resource: = input.resource
      as: cur
    - return: = vars.cur.value.model
  - if: vars.exists && state.models[input.resource].dirty
    then:
    - title: Dirty models are never resolved from the file (data loss protection)
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:305-312
      call: text-file-models.get
      input:
        resource: = input.resource
      as: cur
    - return: = vars.cur.value.model
  - if: '!vars.exists'
    then:
    - title: New model, try to resolve from a backup first
      source: src/vs/workbench/services/textfile/common/textFileEditorModel.ts:328-334
