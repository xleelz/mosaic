      started:
        type: boolean
  behavior:
  - set:
      vars.key: "= input.operation + '/host'"
  - if: vars.key in state.ops && (state.ops[vars.key].done || state.ops[vars.key].active)
    then:
    - title: "Done or already active: no timing"
      source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:263-267
      return:
        started: false
  - set:
      vars.attempts: "= vars.key in state.ops ? state.ops[vars.key].attempts + 1 : 1"
  - title: "Begin: report the <operation>Start marker"
    source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:278-283
    set:
      state.ops: "= merge(state.ops, {vars.key: {'attempts': vars.attempts, 'done': false, 'active': true}})"
      state.marks: "= state.marks + [{'name': input.operation + 'Start', 'provider': 'host', 'since': '', 'outcome': ''}]"
  - return:
      started: true
- component: agent-host-startup-performance
  name: complete-operation
  kind: function
  summary: "IAgentHostStartupTiming.complete: report the operation marker since its Start, done on success or after three attempts."
  sources:
  - src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:286-297
  request:
    type: object
    required:
    - operation
    - outcome
    properties:
      operation:
        type: string
        examples:
        - sessionList
      outcome:
        type: string
        examples:
        - success
  response:
    type: object
    properties:
      done:
        type: boolean
  behavior:
  - set:
      vars.key: "= input.operation + '/host'"
  - if: "!(vars.key in state.ops) || !state.ops[vars.key].active"
    then:
    - title: Only the active timing completes
      source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:248-252
      return:
        done: false
  - set:
      vars.done: "= input.outcome == 'success' || state.ops[vars.key].attempts >= 3"
  - title: Report the operation marker
    source: src/vs/platform/agentHost/node/agentHostStartupPerformance.ts:286-297
    set:
      state.ops: "= merge(state.ops, {vars.key: {'attempts': state.ops[vars.key].attempts, 'done': vars.done, 'active': false}})"
      state.marks: "= state.marks + [{'name': input.operation, 'provider': 'host', 'since': input.operation + 'Start', 'outcome': input.outcome}]"
  - return:
      done: "= vars.done"
- component: agent-service
  name: mark-startup-complete
  kind: function
  summary: "markStartupComplete: once, mark hostReady with the outcome, then open startupSettled if the first listing was served."
  sources:
  - src/vs/platform/agentHost/node/agentService.ts:1550-1557
  request:
    type: object
    properties:
      outcome:
        type: string
        enum:
        - success
        - error
