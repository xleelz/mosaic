- component: local-agent-host-contribution
  name: start
  kind: function
  summary: "autorun on agent host enablement: enabled registers the local-agent-host provider, disabled clears the registration."
  sources:
  - src/vs/sessions/contrib/providers/agentHost/browser/localAgentHost.contribution.ts:46-86
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      registered:
        type: boolean
  behavior:
  - call: browser-agent-host-enablement-service.is-enabled
    as: en
  - if: "!vars.en.value.enabled"
    then:
    - source: src/vs/sessions/contrib/providers/agentHost/browser/localAgentHost.contribution.ts:80-86
      title: "Agent host disabled: no local provider"
      call: sessions-providers-service.unregister-provider
      input:
        id: local-agent-host
      fill: true
    - return:
        registered: false
  - source: src/vs/sessions/contrib/providers/agentHost/browser/localAgentHost.contribution.ts:46-60
    title: Create LocalAgentHostSessionsProvider and register it
    call: sessions-providers-service.register-provider
    input:
      id: local-agent-host
      order: 0
      session_types:
      - copilotcli
    fill: true
  - return:
      registered: true
