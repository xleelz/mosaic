        type: boolean
        default: false
      atomic:
        type: boolean
        default: false
  response:
    type: object
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      mtime:
        type: integer
        examples:
        - 1793318400000
      size:
        type: integer
        examples:
        - 54
      etag:
        type: string
        examples:
        - 1793318400000-54
      readonly:
        type: boolean
        default: false
  errors:
  - code: file-modified-since
