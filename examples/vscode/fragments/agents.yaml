components:
- id: agent-host-main
  name: agentHostMain startAgentHost
  kind: function
  layer: process
  parent: agent-host
  summary: "Utility-process entry: builds the agent host runtime, registers the IPC channels and the local/configured protocol endpoints."
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:74-80
  - src/vs/platform/agentHost/node/agentHostMain.ts:113-546
  attributes:
    owner: agents
- id: agent-host-logger-channel
  name: LoggerChannel (agentHostLogger)
  kind: module
  layer: process
  parent: agent-host
  summary: "IPC channel agentHostLogger: lets the parent forward the host log to its logger service."
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:127
  attributes:
    owner: agents
- id: agent-host-provider-service
  name: AgentHostProviderService
  kind: module
  layer: process
  parent: agent-host
  summary: Registry of agent harnesses (Copilot, Claude, Codex); the first registered provider is the default.
  sources:
  - src/vs/platform/agentHost/node/agentHostProviderService.ts:19
  - src/vs/platform/agentHost/node/agentHostProviderService.ts:101-141
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        providers:
          type: array
          items:
            type: string
    initial:
      providers:
      - copilot
- id: agent-service
  name: AgentService
  kind: module
  layer: process
  parent: agent-host
  summary: "The orchestrator: creates and disposes sessions, routes client actions to the state manager and side effects; served as the agentHost IPC channel."
  sources:
  - src/vs/platform/agentHost/common/agentService.ts:966
  - src/vs/platform/agentHost/node/agentService.ts:943
  - src/vs/platform/agentHost/node/agentHostMain.ts:268
  attributes:
    owner: agents
  capacity:
    concurrency: 1
  state:
    schema:
      type: object
      properties:
        host_startup_complete:
          type: boolean
        first_listing_served:
          type: boolean
        startup_settled:
          type: boolean
    initial:
      host_startup_complete: false
      first_listing_served: false
      startup_settled: false
- id: agent-host-state-manager
  name: AgentHostStateManager
  kind: module
  layer: process
  parent: agent-host
  summary: "Authoritative protocol state: sessions, their chats, status aggregation, client action envelopes and rejections."
  sources:
  - src/vs/platform/agentHost/node/agentHostStateManager.ts:334
  - src/vs/platform/agentHost/node/agentHostStateManager.ts:2588-2624
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        sessions:
          type: object
        server_seq:
          type: integer
    initial:
      sessions: {}
      server_seq: 0
- id: agent-host-database
  name: AgentHostDatabase (agent-host.db)
  kind: datastore
  layer: storage
  parent: agent-host
  summary: "SQLite orchestrator database globalStorage/agent-host.db: session registrations (sessions_v2) and chats."
  sources:
  - src/vs/platform/agentHost/node/agentHostDatabase.ts:408
  - src/vs/platform/agentHost/node/agentHostDatabase.ts:1166
  - src/vs/platform/agentHost/node/agentHostBootstrap.ts:120-123
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        sessions_v2:
          type: object
    initial:
      sessions_v2: {}
- id: agent-side-effects
  name: AgentSideEffects
  kind: module
  layer: process
  parent: agent-host
  summary: "Reacts to applied client actions: starts and cancels turns, answers permission requests."
  sources:
  - src/vs/platform/agentHost/node/agentSideEffects.ts:1795-1941
  attributes:
    owner: agents
- id: agent-host-turn-service
  name: AgentHostTurnService
  kind: module
  layer: process
  parent: agent-host
  summary: Routes ChatTurnStarted to the turn starter and the harness.
  sources:
  - src/vs/platform/agentHost/node/agentHostTurnService.ts:21
  - src/vs/platform/agentHost/node/agentHostTurnService.ts:126-172
  attributes:
    owner: agents
- id: agent-host-turn-starter
  name: startTurn
  kind: function
  layer: process
  parent: agent-host
  summary: Admits a turn (incoming-request contributions), resolves the harness and sends the message.
  sources:
  - src/vs/platform/agentHost/node/agentHostTurnStarter.ts:70-148
  attributes:
    owner: agents
- id: turn-admission-contribution
  name: TurnAdmissionContribution
  kind: module
  layer: process
  parent: agent-host
  summary: Rejects turns on archived or read-only chats.
  sources:
  - src/vs/platform/agentHost/node/chatContributions/turnAdmission/turnAdmissionContribution.ts:29-43
  attributes:
    owner: agents
- id: copilot-agent
  name: CopilotAgent
  kind: module
  layer: process
  parent: agent-host
  summary: The Copilot SDK harness, always registered first, so it is the default provider.
  sources:
  - src/vs/platform/agentHost/node/copilot/copilotAgent.ts
  - src/vs/platform/agentHost/node/agentHostMain.ts:190
  attributes:
    owner: agents
- id: claude-agent
  name: ClaudeAgent
  kind: module
  layer: process
  parent: agent-host
  summary: The Claude SDK harness; refuses to create chats without authentication.
  sources:
  - src/vs/platform/agentHost/node/claude/claudeAgent.ts:781-785
  - src/vs/platform/agentHost/node/agentHostMain.ts:204-206
  attributes:
    owner: agents
- id: session-permissions
  name: SessionPermissionManager
  kind: module
  layer: process
  parent: agent-host
  summary: Decides whether a tool call needs a confirmation (auto-approve settings, workdir reads, shell commands).
  sources:
  - src/vs/platform/agentHost/node/sessionPermissions.ts:253-360
  attributes:
    owner: agents
- id: command-auto-approver
  name: CommandAutoApprover
  kind: module
  layer: process
  parent: agent-host
  summary: "Tree-sitter based shell command auto-approval: deny rules, unparseable commands and unsafe redirects need confirmation."
  sources:
  - src/vs/platform/agentHost/node/commandAutoApprover.ts:286-315
  attributes:
    owner: agents
- id: agent-host-authentication-service
  name: AgentHostAuthenticationService
  kind: module
  layer: process
  parent: agent-host
  summary: Stores tokens pushed by clients per protected resource and hands them to harnesses.
  sources:
  - src/vs/platform/agentHost/node/agentHostAuthenticationService.ts:28
  - src/vs/platform/agentHost/node/agentHostAuthenticationService.ts:109-273
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        tokens:
          type: object
    initial:
      tokens: {}
- id: worktree-isolation
  name: WorktreeIsolation
  kind: module
  layer: process
  parent: agent-host
  summary: Creates a git worktree for sessions with isolation "worktree" (serialized per repository).
  sources:
  - src/vs/platform/agentHost/node/shared/worktreeIsolation.ts:35
  - src/vs/platform/agentHost/node/shared/worktreeIsolation.ts:1118-1170
  attributes:
    owner: agents
  capacity:
    concurrency: 1
- id: agent-host-worktree-cleanup-service
  name: AgentHostWorktreeCleanupService
  kind: module
  layer: process
  parent: agent-host
  summary: "Removes worktrees of archived sessions: a startup sweep, then periodic single-flight passes."
  sources:
  - src/vs/platform/agentHost/node/agentHostWorktreeCleanupService.ts:20
  - src/vs/platform/agentHost/node/agentHostWorktreeCleanupService.ts:322-352
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        passes:
          type: integer
        running:
          type: boolean
    initial:
      passes: 0
      running: false
- id: protocol-server-handler
  name: ProtocolServerHandler (agentHostProtocol)
  kind: module
  layer: process
  parent: agent-host
  summary: AHP JSON-RPC server for every client transport (MessagePort channel agentHostProtocol, local socket, WebSocket).
  sources:
  - src/vs/platform/agentHost/node/protocolServerHandler.ts:801-953
  - src/vs/platform/agentHost/node/agentHostMain.ts:348
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        clients:
          type: object
    initial:
      clients: {}
- id: agent-host-management-service
  name: AgentHostManagementService (agentHostManagement)
  kind: module
  layer: process
  parent: agent-host
  summary: "Management channel: graceful shutdown (drain protocol, stop providers, flush), WebSocket and inspector control."
  sources:
  - src/vs/platform/agentHost/node/agentHostManagementService.ts:18-20
  - src/vs/platform/agentHost/node/agentHostManagementService.ts:294-331
  - src/vs/platform/agentHost/node/agentHostMain.ts:513
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        shutting_down:
          type: boolean
    initial:
      shutting_down: false
- id: agent-host-connection-tracker
  name: connectionTrackerService (agentHostConnectionTracker)
  kind: module
  layer: process
  parent: agent-host
  summary: "Child-process channel: connection counts and an on-demand local WebSocket server."
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:391-477
  - src/vs/platform/agentHost/node/agentHostMain.ts:515
  attributes:
    owner: agents
  state:
    schema:
      type: object
      properties:
        socket:
          type: string
    initial:
      socket: ''
- id: agent-host-server-main
  name: agentHostServerMain
  kind: function
  layer: process
  parent: agent-host
  summary: "Standalone agent host server (code agent / CLI): parses --port/--host/--connection-token, serves AHP over WebSocket."
  sources:
  - src/vs/platform/agentHost/node/agentHostServerMain.ts:14
  - src/vs/platform/agentHost/node/agentHostServerMain.ts:156-401
  attributes:
    owner: agents
