- component: mcp-service
  name: autostart
  kind: function
  summary: "autostart: unless chat.mcp.autostart is never, start (quietly, in parallel) enabled non-errored servers that are new (and outdated)."
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpService.ts:81-162
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      started:
        type: array
      requiring_interaction:
        type: array
  behavior:
  - if: config['chat-mcp-autostart'] == 'never'
    then:
    - source: src/vs/workbench/contrib/mcp/common/mcpService.ts:82-85
      title: Autostart disabled
      return:
        started: []
        requiring_interaction: []
  - call: mcp-server-runtime.servers-query
    as: all
  - set:
      vars.todo: "= vars.all.value.filter(r, r.state != 'error' && r.enabled && (r.cache_state == 'unknown' || (config['chat-mcp-autostart'] == 'newAndOutdated' && r.cache_state == 'outdated')))"
  - set:
      ctx.requiring_interaction: []
      ctx.autostarted: []
  - if: size(vars.todo) == 0
    then:
    - return:
        started: []
        requiring_interaction: []
  - title: Promise.all over the candidates; UserInteractionRequiredError is collected, other errors swallowed
    source: src/vs/workbench/contrib/mcp/common/mcpService.ts:148-161
    parallel: "= vars.todo"
    as: row
    join:
      need: all
    steps:
    - call: mcp-server-runtime.start
      input:
        server_id: "= vars.row.id"
        prompt_type: only-new
        error_on_user_interaction: true
        auto_trust_changes: false
      as: st
      on_error:
      - if: error.code == 'user-interaction-required'
        then:
        - set:
            ctx.requiring_interaction: "= ctx.requiring_interaction + [vars.row.id]"
      fill: true
    - if: vars.st.ok && vars.st.value.state == 'running'
      then:
      - set:
          ctx.autostarted: "= ctx.autostarted + [vars.row.id]"
  - return:
      started: "= ctx.autostarted"
      requiring_interaction: "= ctx.requiring_interaction"
