interfaces:
- component: agent-host-main
  name: start
  kind: function
  summary: "startAgentHost: runtime, providers, IPC channels, protocol endpoints, optional configured WebSocket server."
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:113-546
  - src/vs/platform/agentHost/node/agentHostMain.ts:74-80
  request:
    type: object
    properties:
      claude_sdk_available:
        type: boolean
        default: false
      codex_enabled_env:
        type: boolean
        default: false
      codex_root_config_enabled:
        type: boolean
        default: false
      configured_port:
        type: string
        default: ''
  response:
    type: object
    properties:
      channels:
        type: array
      providers:
        type: array
      websocket:
        type: string
  errors:
  - code: agent-host-startup-failed
    status: 0
    retryable: false
    summary: "startAgentHost rejected: formatAgentHostStartupFailure to stderr, process.exit(1)"
  behavior:
  - title: Exit diagnostics, then startAgentHost()
    detail: A rejection is printed and the process exits with code 1.
    source: src/vs/platform/agentHost/node/agentHostMain.ts:74-80
  - title: "startAgentHost: createAgentHostRuntime"
    source: src/vs/platform/agentHost/node/agentHostMain.ts:155-229
    call: agent-host-main.create-agent-host-runtime
    as: reg
    input:
      claude_sdk_available: "= input.claude_sdk_available"
      codex_enabled_env: "= input.codex_enabled_env"
      codex_root_config_enabled: "= input.codex_root_config_enabled"
    fill: true
    on_error:
    - title: "'Failed to create AgentService': disposed and rethrown; the process exits 1"
      source: src/vs/platform/agentHost/node/agentHostMain.ts:226-230
      fail:
        code: agent-host-startup-failed
        message: "= 'Failed to create AgentService: ' + error.message"
  - title: registerChannel agentHostLogger (utility process)
    source: src/vs/platform/agentHost/node/agentHostMain.ts:127
    set:
      vars.channels:
      - agentHostLogger
  - title: registerChannel agentHostProtocol before the local socket endpoint starts
    source: src/vs/platform/agentHost/node/agentHostMain.ts:348
    set:
      vars.channels: "= vars.channels + ['agentHostProtocol']"
  - title: registerChannel agentHostManagement
    source: src/vs/platform/agentHost/node/agentHostMain.ts:513
    set:
      vars.channels: "= vars.channels + ['agentHostManagement']"
  - title: Start the configured WebSocket server (non-fatal)
    source: src/vs/platform/agentHost/node/agentHostMain.ts:519-540
    call: agent-host-main.start-configured-web-socket-server
    input:
      port: "= input.configured_port"
    as: ws
    on_error: continue
    fill: true
  - title: "When the configured WebSocket start settles: markStartupComplete('error' if it failed)"
    source: src/vs/platform/agentHost/node/agentHostMain.ts:537-542
    call: agent-service.mark-startup-complete
    input:
      outcome: "= vars.ws.ok ? 'success' : 'error'"
  - return:
      channels: "= vars.channels"
      providers: "= vars.reg.value.providers"
      websocket: "= vars.ws.ok ? vars.ws.value.listening : 'failed'"
- component: agent-host-main
  name: start-configured-web-socket-server
  kind: function
  summary: "startWebSocketServer: only when VSCODE_AGENT_HOST_PORT or _SOCKET_PATH is set; prints \"Agent host server listening on ...\"."
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:616-688
  request:
    type: object
    properties:
      port:
        type: string
        default: ''
  response:
    type: object
    properties:
      listening:
        type: string
  behavior:
  - if: input.port == ''
    then:
    - title: "No port or socket path configured: nothing to start"
      source: src/vs/platform/agentHost/node/agentHostMain.ts:629-634
      return:
        listening: none
  - title: Agent host server listening on <target>
    source: src/vs/platform/agentHost/node/agentHostMain.ts:687
    return:
      listening: "= 'localhost:' + input.port"
- component: agent-host-logger-channel
  name: call
  kind: ipc
  summary: "LoggerChannel.call (agentHostLogger): setLogLevel and getRegisteredLoggers; any other command throws."
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:122-139
  - src/vs/platform/log/common/logIpc.ts:131-139
  attributes:
    channel: agentHostLogger
  request:
    type: object
    required:
    - command
    properties:
      command:
        type: string
        examples:
        - setLogLevel
  response:
    type: object
    properties:
      ok:
        type: boolean
  behavior:
  - if: input.command == 'setLogLevel'
    then:
    - title: "setLogLevel: a LogLevel sets the global level, otherwise the [resource, level] pair"
      source: src/vs/platform/log/common/logIpc.ts:134
      return:
        ok: true
  - if: input.command == 'getRegisteredLoggers'
    then:
    - title: "getRegisteredLoggers: the registered loggers with their resources transformed"
      source: src/vs/platform/log/common/logIpc.ts:135
      return:
        ok: true
  - title: Any other command throws
    source: src/vs/platform/log/common/logIpc.ts:138
    fail:
      code: call-not-found
      message: "= 'Call not found: ' + input.command"
  errors:
  - code: call-not-found
    status: 0
    retryable: false
    summary: "Call not found: <command>"
- component: agent-host-provider-service
  name: register-providers
  kind: function
  summary: Register CopilotAgent first (default), Claude if enabled and its SDK is available, Codex if the env var or root config enables it.
  sources:
  - src/vs/platform/agentHost/node/agentHostMain.ts:188-225
  - src/vs/platform/agentHost/node/agentHostProviderService.ts:81-104
  request:
    type: object
    properties:
      claude_sdk_available:
        type: boolean
      codex_enabled_env:
        type: boolean
      codex_root_config_enabled:
        type: boolean
  response:
    type: object
    properties:
      providers:
        type: array
      default:
        type: string
  behavior:
  - title: CopilotAgent is always registered first, so it becomes the default provider
    source: src/vs/platform/agentHost/node/agentHostMain.ts:190
    set:
      vars.p:
      - copilot
  - if: config['chat-agent-host-claude-agent-enabled'] && input.claude_sdk_available
    then:
    - title: ClaudeAgent registered (enabled and SDK available)
      source: src/vs/platform/agentHost/node/agentHostMain.ts:204-206
      set:
        vars.p: "= vars.p + ['claude']"
  - if: input.codex_enabled_env || input.codex_root_config_enabled
    then:
    - title: CodexAgent registered (env var or root config codexAgentEnabled)
      source: src/vs/platform/agentHost/node/agentHostMain.ts:210-225
      set:
        vars.p: "= vars.p + ['codex']"
  - set:
      state.providers: "= vars.p"
  - return:
      providers: "= vars.p"
      default: "= vars.p[0]"
- component: agent-host-provider-service
  name: resolve-provider
  kind: function
  summary: "resolveProvider: the explicit provider id, or the default (first registered)."
  sources:
  - src/vs/platform/agentHost/node/agentHostProviderService.ts:122-124
  request:
    type: object
    properties:
      provider:
        type: string
        examples:
        - copilot
        default: ''
  response:
    type: object
    properties:
      found:
        type: boolean
      provider:
        type: string
  behavior:
  - if: input.provider == ''
    then:
    - return:
        found: "= size(state.providers) > 0"
        provider: "= size(state.providers) > 0 ? state.providers[0] : ''"
  - return:
      found: "= input.provider in state.providers"
      provider: "= input.provider"
- component: agent-host-provider-service
  name: get-provider-for-session
  kind: function
  summary: "getProviderForSession: the associated provider, else the provider named by the session URI scheme."
  sources:
  - src/vs/platform/agentHost/node/agentHostProviderService.ts:130-141
  request:
    type: object
    properties:
      session:
        type: string
        examples:
        - copilot:/9f2c4e1a
        default: copilot:/9f2c4e1a
  response:
    type: object
    properties:
      found:
        type: boolean
      provider:
        type: string
  behavior:
  - set:
      vars.scheme: "= input.session.split(':')[0]"
  - return:
      found: "= vars.scheme in state.providers"
      provider: "= vars.scheme"
