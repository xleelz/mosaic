- component: mcp-server-runtime
  name: start
  kind: function
  summary: "McpServer.start (sequenced): policy block, extension activation, registry resolveConnection (trust), connection start, error handling."
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpServer.ts:743-917
  request:
    type: object
    properties:
      server_id:
        type: string
        examples:
        - github
        default: github
      prompt_type:
        type: string
        examples:
        - only-new
        - all-untrusted
        default: only-new
      error_on_user_interaction:
        type: boolean
        default: false
      auto_trust_changes:
        type: boolean
        default: false
    required:
    - server_id
  response:
    type: object
    properties:
      state:
        type: string
      message:
        type: string
  errors:
  - code: user-interaction-required
    status: 0
    retryable: false
    summary: "UserInteractionRequiredError: \"User interaction required: <reason>\""
  - code: unknown-server
    status: 0
    retryable: false
    summary: "Unknown server: <id>"
  behavior:
  - call: mcp-server-runtime.servers-get
    input:
      server_id: "= input.server_id"
    as: srv
    fill: true
  - call: allowed-mcp-servers-service.check-server-allowed
    input:
      name: "= input.server_id"
    as: pol
    fill: true
  - if: "!vars.pol.value.allowed"
    then:
    - title: "Policy block: connection state Error with the policy message"
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:747-757
      call: mcp-server-runtime.servers-update
      input:
        server_id: "= input.server_id"
        patch:
          state: error
      fill: true
    - return:
        state: error
        message: "= vars.pol.value.message"
  - title: Activate extensions for the collection
    source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:760-770
    call: extension-service.activate-by-event
    input:
      activation_event: "= 'onMcpCollection:' + vars.srv.value.collection"
      activation_kind: normal
    fill: true
  - call: mcp-registry.resolve-connection
    as: conn
    input:
      server_id: "= input.server_id"
      scope: "= vars.srv.value.scope"
      trust_behavior: "= vars.srv.value.trust_behavior"
      cache_nonce: "= vars.srv.value.cache_nonce"
      trusted_at_nonce: "= vars.srv.value.trusted_at_nonce"
      label: "= vars.srv.value.label"
      prompt_type: "= input.prompt_type"
      error_on_user_interaction: "= input.error_on_user_interaction"
      auto_trust_changes: "= input.auto_trust_changes"
    fill: true
  - call: mcp-server-runtime.servers-update
    input:
      server_id: "= input.server_id"
      patch:
        trusted_at_nonce: "= vars.conn.value.trusted_at_nonce"
    fill: true
  - if: "!vars.conn.value.connected"
    then:
    - title: "No connection (untrusted, cancelled or launch error already shown): Stopped"
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:798-800
      return:
        state: stopped
        message: ''
  - call: mcp-server-runtime.servers-update
    input:
      server_id: "= input.server_id"
      patch:
        state: starting
    fill: true
  - call: mcp-server-connection.start
    input:
      server_id: "= input.server_id"
      transport: "= vars.srv.value.transport"
    as: cs
    fill: true
  - if: vars.cs.value.state == 'error'
    then:
    - call: mcp-server-runtime.servers-update
      input:
        server_id: "= input.server_id"
        patch:
          state: error
      fill: true
    - if: input.error_on_user_interaction
      then:
      - title: "Quiet start: reject UserInteractionRequiredError('start')"
        source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:904-906
        fail:
          code: user-interaction-required
          message: "User interaction required: start"
    - title: "Interactive start: showInteractiveError (the real promise never settles)"
      source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:896-911
      return:
        state: error
        message: "= vars.cs.value.message"
  - call: mcp-server-runtime.servers-update
    input:
      server_id: "= input.server_id"
      patch:
        state: running
  - title: "Handler live: the autorun runs _populateLiveData (tools/list), which makes the cache Live"
    source: src/vs/workbench/contrib/mcp/common/mcpServer.ts:603-612
    call: mcp-server-runtime.populate-live-data
    input:
      server_id: "= input.server_id"
  - return:
      state: running
      message: ''
