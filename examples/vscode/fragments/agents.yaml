- component: agent-service
  name: dispatch-action
  kind: function
  summary: "dispatchAction: automation guard, unknown-chat guard, apply through the state manager, then side effects."
  sources:
  - src/vs/platform/agentHost/node/agentService.ts:11610-11670
  - src/vs/platform/agentHost/node/agentService.ts:12682-12740
  request:
    type: object
    properties:
      session:
        type: string
        examples:
        - copilot:/9f2c4e1a
        default: copilot:/9f2c4e1a
      action:
        type: object
        properties:
          type:
            type: string
            examples:
            - session-title-changed
            - chat-turn-started
            - session-is-archived-changed
            - chat-turn-cancelled
          title:
            type: string
          is_archived:
            type: boolean
          turn_id:
            type: string
            examples:
            - t1
          text:
            type: string
            examples:
            - Add a unit test for add()
        required:
        - type
      client_id:
        type: string
        examples:
        - w1-client
      has_credentials:
        type: boolean
        default: false
    required:
    - session
    - action
  response:
    type: object
    properties:
      applied:
        type: boolean
      reason:
        type: string
  behavior:
  - if: input.action.type.startsWith('automation')
    then:
    - if: input.has_credentials
      then:
      - title: Automations refuse client-owned credentials
        source: src/vs/platform/agentHost/node/agentService.ts:11615-11619
        call: agent-host-state-manager.reject-client-action
        input:
          session: "= input.session"
          reason: Automations do not support client-owned credentials.
        fill: true
      - return:
          applied: false
          reason: Automations do not support client-owned credentials.
  - call: agent-host-state-manager.sessions-get
    input:
      session: "= input.session"
    as: owner
    fill: true
  - if: has(vars.owner.value.missing) && input.action.type == 'session-is-archived-changed'
    then:
    - title: "Unknown chat: archive/read actions are rejected"
      source: src/vs/platform/agentHost/node/agentService.ts:12629-12645
      call: agent-host-state-manager.reject-client-action
      input:
        session: "= input.session"
        reason: Only a known chat can change its read state.
      fill: true
    - return:
        applied: false
        reason: unknown-chat
  - call: agent-host-state-manager.dispatch-client-action
    input:
      session: "= input.session"
      action: "= input.action"
    on_error: continue
    as: applied
    fill: true
  - call: agent-side-effects.handle-action
    input:
      session: "= input.session"
      action: "= input.action"
    fill: true
  - return:
      applied: "= vars.applied.ok"
      reason: ''
