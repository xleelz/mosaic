- component: mcp-sampling-service
  name: get-matching-model
  kind: function
  summary: "_getMatchingModel(Inner): per-context permission (config, session sets, prompt or YOLO), then allowed or default models matched by hints."
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:125-180
  - src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:235-262
  request:
    type: object
    properties:
      server_id:
        type: string
        examples:
        - github
        default: github
      server_key:
        type: string
        examples:
        - "User: GitHub"
        default: "User: GitHub"
      is_during_tool_call:
        type: boolean
        default: true
      model_hints:
        type: array
        items:
          type: string
        default: []
      system_prompt:
        type: string
        default: ''
    required:
    - server_id
  response:
    type: object
    properties:
      model:
        type: string
  errors:
  - code: not-allowed
    status: 0
    retryable: false
    summary: The user has denied permission to call this method.
  behavior:
  - set:
      vars.cfg: "= merge(input.server_key in config['chat-mcp-server-sampling'] ? config['chat-mcp-server-sampling'][input.server_key] : {}, input.server_key in state.server_sampling ? state.server_sampling[input.server_key]\
        \ : {})"
      vars.field: "= input.is_during_tool_call ? 'allowedDuringChat' : 'allowedOutsideChat'"
  - set:
      vars.allowed: "= (vars.field in vars.cfg && vars.cfg[vars.field] == true) || (input.is_during_tool_call ? input.server_id in state.allowed_during_chat : input.server_id in state.allowed_outside_chat)"
  - if: "!vars.allowed"
    then:
    - if: vars.field in vars.cfg
      then:
      - title: Explicitly not allowed
        source: src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:238-241
        fail:
          code: not-allowed
          message: The user has denied permission to call this method.
          data:
            jsonrpc_code: -32000
    - if: config['chat-tools-global-auto-approve']
      then:
      - title: "YOLO mode: allow for this session without prompting"
        source: src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:131-133
        set:
          state.allowed_during_chat: "= input.is_during_tool_call ? state.allowed_during_chat + [input.server_id] : state.allowed_during_chat"
          state.allowed_outside_chat: "= !input.is_during_tool_call ? state.allowed_outside_chat + [input.server_id] : state.allowed_outside_chat"
      else:
      - title: "Prompt: 'Allow MCP tools from <server> to make LLM requests?'"
        source: src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:134-145
        choice: allow_prompt
        default: allow_in_session
        options:
          allow_in_session:
          - set:
              state.allowed_during_chat: "= input.is_during_tool_call ? state.allowed_during_chat + [input.server_id] : state.allowed_during_chat"
              state.allowed_outside_chat: "= !input.is_during_tool_call ? state.allowed_outside_chat + [input.server_id] : state.allowed_outside_chat"
          always:
          - call: mcp-sampling-service.update-config
            input:
              server_key: "= input.server_key"
              patch: "= {vars.field: true}"
            fill: true
          not_now:
          - source: src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:143
            title: Refused
            fail:
              code: not-allowed
              message: The user has denied permission to call this method.
              data:
                jsonrpc_code: -32000
          never:
          - call: mcp-sampling-service.update-config
            input:
              server_key: "= input.server_key"
              patch: "= {vars.field: false}"
            fill: true
          - fail:
              code: not-allowed
              message: The user has denied permission to call this method.
              data:
                jsonrpc_code: -32000
  - if: "'allowedModels' in vars.cfg"
    then:
    - title: allowedModels filtered to models that exist (lookupLanguageModel)
      source: src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:245
      call: language-models-service.select-language-models
      input:
        vendor: ''
      as: known
      fill: true
    - set:
        vars.models: "= vars.cfg.allowedModels.filter(m, m in vars.known.value.ids)"
    else:
    - title: "Default models: the registered language models (models with a multiplier are dropped in code)"
      source: src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:264-290
      call: language-models-service.select-language-models
      input:
        vendor: copilot
      as: ids
      fill: true
    - set:
        vars.models: "= vars.ids.value.ids"
  - if: size(vars.models) == 0
    then:
    - title: "No matching model: during a tool call run Configure Sampling Models"
      source: src/vs/workbench/contrib/mcp/common/mcpSamplingService.ts:163-176
      if: input.is_during_tool_call
      then:
      - call: mcp-commands.cmd-workbench-mcp-configuresamplingmodels
        input:
          server_key: "= input.server_key"
          picked:
          - copilot/gpt-4.1
        as: picked
        fill: true
      - if: vars.picked.value.count > 0
        then:
        - return:
            model: copilot/gpt-4.1
    - fail:
        code: not-allowed
        message: The user has denied permission to call this method.
        data:
          jsonrpc_code: -32000
  - set:
      vars.hit: "= vars.models.filter(m, input.model_hints.exists(h, m.lowerAscii().contains(h.lowerAscii())))"
  - return:
      model: "= size(vars.hit) > 0 ? vars.hit[0] : vars.models[0]"
