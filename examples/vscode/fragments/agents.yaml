      source: src/vs/platform/agentHost/node/sessionPermissions.ts:279
      return:
        reason: setting
  - if: input.kind == 'read' && input.in_workdir
    then:
    - title: Reads inside the working directory need no approval
      source: src/vs/platform/agentHost/node/sessionPermissions.ts:317-326
      return:
        reason: not-needed
  - if: input.kind == 'shell'
    then:
    - if: "!input.terminal_auto_approve_enabled"
      then:
      - title: "terminalAutoApproveEnabled === false: prompt"
        source: src/vs/platform/agentHost/node/sessionPermissions.ts:339-357
        return:
          reason: confirm
    - call: command-auto-approver.evaluate
      input:
        command: "= input.command"
      as: ev
      fill: true
    - return:
        reason: "= vars.ev.value.result == 'approved' ? 'auto-approved-command' : 'confirm'"
  - return:
      reason: confirm
- component: command-auto-approver
  name: evaluate
  kind: function
  summary: "evaluate: empty -> approved; deny rule -> denied; unparseable or unapproved redirect -> noMatch; allow rules -> approved."
  sources:
  - src/vs/platform/agentHost/node/commandAutoApprover.ts:286-315
  request:
    type: object
    properties:
      command:
        type: string
        examples:
        - npm test
      deny_rules:
        type: array
        default:
        - rm
      allow_rules:
        type: array
        default:
        - npm test
        - git status
        - ls
    required:
    - command
  response:
    type: object
    properties:
      result:
        type: string
  behavior:
  - if: input.command.trim() == ''
    then:
    - return:
        result: approved
  - if: input.deny_rules.exists(r, input.command.trim().startsWith(r))
    then:
    - title: Deny rule
      source: src/vs/platform/agentHost/node/commandAutoApprover.ts:295-297
      return:
        result: denied
  - if: input.command.contains('>')
    then:
    - title: Write redirection to a non-approved destination
      source: src/vs/platform/agentHost/node/commandAutoApprover.ts:308-312
      return:
        result: noMatch
  - return:
      result: "= input.allow_rules.exists(r, input.command.trim().startsWith(r)) ? 'approved' : 'noMatch'"
