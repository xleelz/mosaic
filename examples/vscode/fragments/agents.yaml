      content:
        type: string
        examples:
        - 'import { add } from ''./util'';

          console.log(add(1, 2));

          '
      mtime:
        type: integer
        description: IWriteFileOptions.mtime the caller last saw
        examples:
        - 1793318400000
      etag:
        type: string
        description: IWriteFileOptions.etag the caller last saw ('' disables the check)
        examples:
