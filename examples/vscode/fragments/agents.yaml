- component: agent-host-state-manager
  name: dispatch-client-action
  kind: function
  summary: "dispatchClientAction: run the reducer on the session and emit an action envelope with the next server sequence number."
  sources:
  - src/vs/platform/agentHost/node/agentHostStateManager.ts:2601-2603
  request:
    type: object
    properties:
      session:
        type: string
        examples:
        - copilot:/9f2c4e1a
        default: copilot:/9f2c4e1a
      action:
        type: object
        properties:
          type:
            type: string
            examples:
            - session-title-changed
            - chat-turn-started
            - session-is-archived-changed
            - chat-turn-cancelled
          title:
            type: string
          is_archived:
            type: boolean
          turn_id:
            type: string
            examples:
            - t1
          text:
            type: string
            examples:
            - Add a unit test for add()
        required:
        - type
    required:
    - session
    - action
  response:
    type: object
    properties:
      server_seq:
        type: integer
  behavior:
  - set:
      state.server_seq: "= state.server_seq + 1"
  - if: input.action.type == 'session-title-changed'
    then:
    - call: agent-host-state-manager.sessions-update
      input:
        session: "= input.session"
        patch:
          title: "= input.action.title"
      fill: true
  - if: input.action.type == 'session-is-archived-changed'
    then:
    - call: agent-host-state-manager.sessions-update
      input:
        session: "= input.session"
        patch:
          archived: "= input.action.is_archived"
      fill: true
  - if: input.action.type == 'chat-turn-started'
    then:
    - title: Active turn tracked; aggregate status InProgress
      source: src/vs/platform/agentHost/node/agentHostStateManager.ts:3083-3091
      call: agent-host-state-manager.sessions-update
      input:
        session: "= input.session"
        patch:
          active_turn: "= input.action.turn_id"
          status: in-progress
      fill: true
  - if: input.action.type == 'chat-turn-cancelled'
    then:
    - call: agent-host-state-manager.sessions-update
      input:
        session: "= input.session"
        patch:
          active_turn: ''
          status: idle
      fill: true
  - return:
      server_seq: "= state.server_seq"
- component: agent-host-state-manager
  name: dispatch-server-action
  kind: function
  summary: "dispatchServerAction: a host-originated action (ChatError, turn end)."
  sources:
  - src/vs/platform/agentHost/node/agentHostStateManager.ts:2588
  request:
    type: object
    properties:
      session:
        type: string
