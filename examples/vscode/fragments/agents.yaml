fixtures:
- id: agents-mcp-servers
  summary: "one-window-folder with two MCP servers known to McpService: github (user mcp.json, trusted collection) and workspace-db (.vscode/mcp.json, trusted on nonce, never trusted yet). Each server answers\
    \ tools/list from its own catalog (mcp-server tools_by_server)."
  extends:
  - one-window-folder
  state:
    mcp-server-runtime:
      servers:
        github:
          id: github
          label: GitHub
          collection: mcp.config.usrlocal
          collection_label: User
          scope: user
          trust_behavior: trusted
          cache_nonce: n1
          trusted_at_nonce: ''
          state: stopped
          enabled: true
          cache_state: unknown
          transport: ok
          sandbox_enabled: false
          tools:
          - search_issues
          - create_issue
        workspace-db:
          id: workspace-db
          label: Workspace DB
          collection: workspace.dotmcp
          collection_label: Workspace
          scope: workspace
          trust_behavior: trusted-on-nonce
          cache_nonce: n7
          trusted_at_nonce: ''
          state: stopped
          enabled: true
          cache_state: unknown
          transport: ok
          sandbox_enabled: false
          tools:
          - query
    mcp-server:
      tools_by_server:
        github:
        - name: search_issues
          read_only_hint: true
          visibility: model
        - name: create_issue
          read_only_hint: false
          visibility: model
        workspace-db:
        - name: query
          read_only_hint: true
          visibility: model
