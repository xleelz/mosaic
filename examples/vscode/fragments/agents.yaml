- component: agent-service
  name: create-session
  kind: function
  summary: "createSession: resolve the provider, check the storage identity, optional worktree, provider createChat, register and add to state."
  sources:
  - src/vs/platform/agentHost/node/agentService.ts:5864-5872
  - src/vs/platform/agentHost/node/agentService.ts:5874-5971
  request:
    type: object
    properties:
      provider:
        type: string
        examples:
        - copilot
        default: ''
      session:
        type: string
        examples:
        - copilot:/9f2c4e1a
        default: copilot:/9f2c4e1a
      working_directories:
        type: array
        items:
          type: string
          examples:
          - file:///work/app
        default:
        - file:///work/app
      isolation:
        type: string
        examples:
        - folder
        default: folder
      branch:
        type: string
        default: ''
    required:
    - session
  response:
    type: object
    properties:
      session:
        type: string
      provider:
        type: string
  errors:
  - code: no-agent-provider-registered
    status: 0
    retryable: false
    summary: "No agent provider registered for: <provider>"
  - code: session-already-owned
    status: 0
    retryable: false
    summary: Session <uri> is already owned by <provider>
  behavior:
  - call: agent-host-provider-service.resolve-provider
    input:
      provider: "= input.provider"
    as: rp
    fill: true
  - if: "!vars.rp.value.found"
    then:
    - title: No provider
      source: src/vs/platform/agentHost/node/agentService.ts:5877-5879
      fail:
        code: no-agent-provider-registered
        message: "= 'No agent provider registered for: ' + (input.provider == '' ? '(none)' : input.provider)"
  - call: agent-host-database.sessions-v2-get
    input:
      session: "= input.session"
    as: reg
    fill: true
  - if: "!has(vars.reg.value.missing) && vars.reg.value.provider != vars.rp.value.provider"
    then:
    - title: Registered to another provider
      source: src/vs/platform/agentHost/node/agentService.ts:5885-5888
      fail:
        code: session-already-owned
        message: "= 'Session ' + input.session + ' is already owned by ' + vars.reg.value.provider"
  - if: size(input.working_directories) > 1
    then:
    - title: "More than one working directory without multipleWorkingDirectories: truncated to the first"
      source: src/vs/platform/agentHost/node/agentService.ts:5918-5921
  - if: input.isolation == 'worktree'
    then:
    - call: worktree-isolation.resolve-working-directory
      as: wt
      input:
        folder: "= input.working_directories[0]"
        isolation: worktree
        branch: "= input.branch"
        is_git_repo: true
      fill: true
  - title: The harness creates the SDK chat; a failure rolls back the provider session
    source: src/vs/platform/agentHost/node/agentService.ts:5960-5971
    call: "= vars.rp.value.provider + '-agent.create-chat'"
    targets:
    - copilot-agent.create-chat
    - claude-agent.create-chat
    input:
      session: "= input.session"
    as: chat
    fill: true
  - call: agent-host-database.sessions-v2-put
    input:
      session: "= input.session"
      value:
        session: "= input.session"
        provider: "= vars.rp.value.provider"
    fill: true
  - call: agent-host-state-manager.sessions-put
    input:
      session: "= input.session"
      provider: "= vars.rp.value.provider"
      title: ''
      status: idle
      archived: false
      read_only: false
      active_turn: ''
    fill: true
  - return:
      session: "= input.session"
      provider: "= vars.rp.value.provider"
