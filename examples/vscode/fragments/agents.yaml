  summary: "Restart Server: showOutput, stop, start (all-untrusted)."
  sources:
  - src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:1384-1406
  - src/vs/workbench/contrib/mcp/browser/mcp.contribution.ts:95
  request:
    type: object
    properties:
      server_id:
        type: string
        examples:
        - github
        default: github
  response:
    type: object
    properties:
      ok:
        type: boolean
      state:
        type: string
  behavior:
  - call: mcp-server-runtime.show-output
    input:
      server_id: "= input.server_id"
    fill: true
  - call: mcp-server-runtime.stop
