scenarios:
- id: agents-agent-host-startup-happy
  flow: agents-agent-host-startup
  fixtures:
  - one-window-folder
  - agents-seed
  expect:
  - result.ok
  - result.value.providers == ['copilot']
  - result.value.channels == ['agentHostLogger', 'agentHostProtocol', 'agentHostManagement']
  - result.value.websocket == 'none'
  - state['agent-host-provider-service'].providers == ['copilot']
- id: agents-agent-host-startup-claude
  flow: agents-agent-host-startup
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    claude_sdk_available: true
  expect:
  - result.ok
  - result.value.providers == ['copilot', 'claude']
  - state['agent-host-provider-service'].providers == ['copilot', 'claude']
- id: agents-agent-host-startup-claude-disabled
  flow: agents-agent-host-startup
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    claude_sdk_available: true
  config:
    chat-agent-host-claude-agent-enabled: false
  expect:
  - result.ok
  - result.value.providers == ['copilot']
  - state['agent-host-provider-service'].providers == ['copilot']
- id: agents-agent-host-startup-codex-root-config
  flow: agents-agent-host-startup
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    codex_root_config_enabled: true
  expect:
  - result.ok
  - result.value.providers == ['copilot', 'codex']
  - state['agent-host-provider-service'].providers == ['copilot', 'codex']
- id: agents-agent-host-startup-configured-port
  flow: agents-agent-host-startup
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    configured_port: '8080'
  expect:
  - result.ok
  - result.value.websocket == 'localhost:8080'
  - state['agent-host-worktree-cleanup-service'].passes == 2
- id: agents-agent-host-startup-websocket-fails
  flow: agents-agent-host-startup
  fixtures:
  - one-window-folder
  - agents-seed
  input:
    configured_port: '8080'
  faults:
  - target: agent-host-main.start-configured-web-socket-server
    type: error
    code: eaddrinuse
  expect:
  - result.ok
  - result.value.websocket == 'failed'
  - state['agent-host-worktree-cleanup-service'].passes == 2
- id: agents-agent-host-startup-runtime-fails
  flow: agents-agent-host-startup
  fixtures:
  - one-window-folder
  - agents-seed
  faults:
  - target: agent-host-provider-service.register-providers
    type: error
    code: sqlite-open-failed
    message: SQLITE_CANTOPEN
  expect:
  - "!result.ok"
  - result.error.code == 'agent-host-startup-failed'
  - "!trace.exists(e, e.type == 'call.start' && e.interface == 'agent-host-worktree-cleanup-service.start')"
- id: agents-agent-host-server-startup-default-port
  flow: agents-agent-host-server-startup
  fixtures:
  - one-window-folder
  - agents-seed
  expect:
  - result.ok
  - result.value.ready == 'READY:8081'
  - result.value.providers == ['copilot']
  - state['agent-host-provider-service'].providers == ['copilot']
