- component: sessions-providers-service
  name: register-provider
  kind: function
  summary: "registerProvider: refuse a duplicate id ('Sessions provider <id> is already registered.'), fire onDidChangeProviders."
  sources:
  - src/vs/sessions/services/sessions/browser/sessionsProvidersService.ts:59-73
  request:
    type: object
    properties:
      id:
        type: string
        examples:
        - local-agent-host
      order:
        type: integer
      session_types:
        type: array
    required:
    - id
  errors:
  - code: sessions-provider-already-registered
    status: 0
    retryable: false
    summary: Sessions provider '<id>' is already registered.
  store:
    table: providers
    op: put
    key: "= input.id"
    value: "= input"
    where: row == null
    conflict: sessions-provider-already-registered
- component: sessions-providers-service
  name: unregister-provider
  kind: function
  summary: Disposing the registration removes the provider.
  sources:
