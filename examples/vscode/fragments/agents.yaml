      message:
        type: string
  response:
    type: object
    properties:
      server_seq:
        type: integer
  behavior:
  - set:
      state.server_seq: "= state.server_seq + 1"
      ctx.last_server_action: "= input.type"
  - if: input.type == 'chat-error'
    then:
    - call: agent-host-state-manager.sessions-update
      on_error: continue
      input:
        session: "= input.session"
        patch:
          active_turn: ''
          status: error
      fill: true
  - return:
      server_seq: "= state.server_seq"
