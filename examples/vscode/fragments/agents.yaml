        description: added extension point users, one entry per (extension, collection) contribution
        default:
        - extension_id: GitHub.copilot-chat
          id: github
          label: GitHub
          when: ''
        examples:
        - - extension_id: GitHub.copilot-chat
            id: github
            label: GitHub
            when: ''
  response:
    type: object
    properties:
      collections:
        type: integer
  behavior:
  - set:
      vars.registered: []
  - title: "setHandler: for each added extension, skip it if _validate fails, else register each collection"
    source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:88-107
    foreach: "= input.contributions"
    as: coll
    steps:
    - if: "!has(vars.coll.id) || vars.coll.id.trim() == '' || !has(vars.coll.label) || vars.coll.label.trim() == ''"
      then:
      - title: "_validate: id and label must be non-empty strings, else the extension's collections are skipped"
        source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:180-196
        set:
          vars.skipped: "= vars.coll"
      else:
      - if: has(vars.coll.when) && vars.coll.when != ''
        then:
        - title: A collection with a when clause is registered only while the context matches (_registerConditionalCollection)
          source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:145-173
          set:
            vars.conditional: "= vars.coll.id"
        else:
        - title: "_registerCollection: id = ExtensionIdentifier.toKey(extension) + '/' + id, lazy, Trusted, workspace-scoped"
          source: src/vs/workbench/contrib/mcp/common/discovery/extensionMcpDiscovery.ts:111-142
          set:
            vars.registered: "= vars.registered + [vars.coll.extension_id.lowerAscii() + '/' + vars.coll.id]"
  - set:
      state.collections: "= vars.registered"
  - return:
      collections: "= size(vars.registered)"
- component: mcp-gateway-tool-broker-channel
  name: call
  kind: ipc
  summary: "call: listServers, listToolsForServer, callToolForServer (unknown server/tool throw), resource calls; anything else is invalid."
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpGatewayToolBrokerChannel.ts:163-198
  - src/vs/workbench/contrib/mcp/common/mcpGatewayToolBrokerChannel.ts:226-245
  attributes:
    channel: mcpGatewayToolBroker
  request:
    type: object
    properties:
      command:
        type: string
        examples:
        - callToolForServer
        - listServers
      server_id:
        type: string
        examples:
        - github
        default: github
      name:
        type: string
        examples:
        - search_issues
        default: search_issues
    required:
    - command
  response:
    type: object
    properties:
      result: {}
  errors:
  - code: unknown-server
    status: 0
    retryable: false
    summary: "Unknown server: <id>"
  - code: unknown-tool
    status: 0
    retryable: false
    summary: Unknown tool '<name>' on server '<id>'
  - code: invalid-call
    status: 0
    retryable: false
    summary: "Invalid call: <command>"
  behavior:
  - if: input.command == 'listServers'
    then:
    - call: mcp-server-runtime.servers-query
      as: all
    - return:
        result: "= vars.all.value.map(r, r.id)"
  - if: input.command == 'listToolsForServer'
    then:
    - call: mcp-server-runtime.servers-find
      input:
        server_id: "= input.server_id"
      as: f
      fill: true
    - if: has(vars.f.value.missing)
      then:
      - return:
          result: []
    - title: "_waitForStartup: race readiness against the grace period"
      source: src/vs/workbench/contrib/mcp/common/mcpGatewayToolBrokerChannel.ts:110-134
      call: mcp-server-runtime.start
      input:
        server_id: "= input.server_id"
        prompt_type: all-untrusted
        error_on_user_interaction: true
        auto_trust_changes: false
      timeout_ms: "= config['mcp-gateway-startup-grace-period-ms']"
      on_error: continue
      as: ready
      fill: true
    - return:
        result: "= vars.f.value.tools"
  - if: input.command == 'callToolForServer'
    then:
    - call: mcp-server-runtime.servers-find
      input:
        server_id: "= input.server_id"
      as: f
      fill: true
    - if: has(vars.f.value.missing)
      then:
      - source: src/vs/workbench/contrib/mcp/common/mcpGatewayToolBrokerChannel.ts:231-234
        title: Unknown server
        fail:
          code: unknown-server
          message: "= 'Unknown server: ' + input.server_id"
    - if: "!(input.name in vars.f.value.tools)"
      then:
      - source: src/vs/workbench/contrib/mcp/common/mcpGatewayToolBrokerChannel.ts:236-241
        title: Unknown tool
        fail:
          code: unknown-tool
          message: "= 'Unknown tool \\'' + input.name + '\\' on server \\'' + input.server_id + '\\''"
    - call: mcp-tool.call-with-progress
      input:
        server_id: "= input.server_id"
        tool: "= input.name"
      as: r
      fill: true
    - return:
        result: "= vars.r.value"
  - source: src/vs/workbench/contrib/mcp/common/mcpGatewayToolBrokerChannel.ts:197-198
    title: Invalid call
    fail:
      code: invalid-call
      message: "= 'Invalid call: ' + input.command"
