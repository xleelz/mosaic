- component: mcp-server-connection
  name: start
  kind: function
  summary: "start: Starting, launch the transport, then the initialize handshake (no hard timeout; a 5 s timer only logs)."
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpServerConnection.ts:50-133
  - src/vs/workbench/contrib/mcp/common/mcpServerRequestHandler.ts:102-155
  request:
