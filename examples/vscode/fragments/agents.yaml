- component: agent-side-effects
  name: handle-action
  kind: function
  summary: "Side effects of applied actions: ChatTurnStarted starts a turn; ChatTurnCancelled aborts the harness."
  sources:
  - src/vs/platform/agentHost/node/agentSideEffects.ts:1795-1941
  request:
    type: object
    properties:
      session:
        type: string
        examples:
        - copilot:/9f2c4e1a
        default: copilot:/9f2c4e1a
      action:
        type: object
        properties:
          type:
            type: string
            examples:
            - session-title-changed
            - chat-turn-started
            - session-is-archived-changed
            - chat-turn-cancelled
          title:
            type: string
          is_archived:
            type: boolean
          turn_id:
            type: string
            examples:
            - t1
          text:
            type: string
            examples:
            - Add a unit test for add()
        required:
        - type
    required:
    - session
    - action
  response:
    type: object
    properties:
      handled:
        type: boolean
  behavior:
  - if: input.action.type == 'chat-turn-started'
    then:
    - title: ChatTurnStarted -> turnService.handleTurnStarted
      source: src/vs/platform/agentHost/node/agentSideEffects.ts:1795-1801
      call: agent-host-turn-service.handle-turn-started
      input:
        session: "= input.session"
        turn_id: "= input.action.turn_id"
        text: "= input.action.text"
      fill: true
    - return:
        handled: true
  - if: input.action.type == 'chat-turn-cancelled'
    then:
    - call: agent-host-provider-service.get-provider-for-session
      input:
        session: "= input.session"
      as: p
      fill: true
    - title: ChatTurnCancelled -> complete turn cancelled, agent.chats.abort
      source: src/vs/platform/agentHost/node/agentSideEffects.ts:1907-1941
      call: "= vars.p.value.provider + '-agent.abort'"
      targets:
      - copilot-agent.abort
      - claude-agent.abort
      input:
        session: "= input.session"
      fill: true
    - return:
        handled: true
  - return:
      handled: false
