- component: mcp-registry
  name: resolve-connection
  kind: function
  summary: "resolveConnection: workspace trust and server trust (_checkTrust), then launch resolution (inputs, env, sandbox); errors become a notification."
  sources:
  - src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:504-592
  - src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:225-289
  request:
    type: object
    properties:
      server_id:
        type: string
        examples:
        - github
        default: github
      scope:
        type: string
        examples:
        - user
      trust_behavior:
        type: string
        examples:
        - trusted
      cache_nonce:
        type: string
        examples:
        - n1
      trusted_at_nonce:
        type: string
        examples:
        - ''
      label:
        type: string
        examples:
        - GitHub
      prompt_type:
        type: string
        examples:
        - only-new
      error_on_user_interaction:
        type: boolean
      auto_trust_changes:
        type: boolean
  response:
    type: object
    properties:
      connected:
        type: boolean
      trusted_at_nonce:
        type: string
  errors:
  - code: user-interaction-required
    status: 0
    retryable: false
    summary: "UserInteractionRequiredError: workspaceTrust / serverTrust / variables"
  behavior:
  - set:
      vars.nonce: "= input.trusted_at_nonce"
  - if: input.scope == 'workspace'
    then:
    - call: workspace-trust-management-service.is-workspace-trusted
      as: wt
    - if: "!vars.wt.value.trusted"
      then:
      - if: input.error_on_user_interaction
        then:
        - source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:233-234
          title: Untrusted workspace, quiet
          fail:
            code: user-interaction-required
            message: "User interaction required: workspaceTrust"
      - call: workspace-trust-request-service.request-workspace-trust
        input:
          message: This MCP server definition is defined in your workspace files.
        as: wr
        fill: true
      - if: vars.wr.value.trusted != true
        then:
        - source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:235-237
          title: Workspace trust refused
          return:
            connected: false
            trusted_at_nonce: "= vars.nonce"
  - if: input.trust_behavior == 'trusted-on-nonce' && input.cache_nonce != input.trusted_at_nonce
    then:
    - if: input.auto_trust_changes
      then:
      - title: "Changed but explicitly executed: trust the new nonce"
        source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:249-253
        set:
          vars.nonce: "= input.cache_nonce"
      else:
      - if: input.trusted_at_nonce == '__vscode_not_trusted' && input.prompt_type != 'all-untrusted'
        then:
        - title: "Previously refused: deny without prompting"
          source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:255-265
          return:
            connected: false
            trusted_at_nonce: "= vars.nonce"
      - if: input.prompt_type == 'never'
        then:
        - source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:267-270
          title: Trust unknown, promptType never
          return:
            connected: false
            trusted_at_nonce: "= vars.nonce"
      - if: input.error_on_user_interaction
        then:
        - source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:272-274
          title: Trust prompt needed, quiet
          fail:
            code: user-interaction-required
            message: "User interaction required: serverTrust"
      - title: Prompt 'Trust and run MCP server <label>?'
        source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:326-340
        choice: trust_prompt
        default: trust
        options:
          trust:
          - set:
              vars.nonce: "= input.cache_nonce"
          do_not_trust:
          - title: Refusal stored as __vscode_not_trusted
            source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:284-285
            return:
              connected: false
              trusted_at_nonce: __vscode_not_trusted
          cancel:
          - source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:281-283
            title: Dismissed
            return:
              connected: false
              trusted_at_nonce: "= vars.nonce"
  - title: "Replace variables, expand env, sandbox; a non-interaction error shows \"Error starting <server>: <message>\""
    source: src/vs/workbench/contrib/mcp/common/mcpRegistry.ts:543-578
    choice: launch_resolution
    default: resolved
    options:
      resolved:
      - return:
          connected: true
          trusted_at_nonce: "= vars.nonce"
      error:
      - return:
          connected: false
          trusted_at_nonce: "= vars.nonce"
