  summary: "_handleProcessExit: ignore expected Windows shutdown codes; restart immediately while under MaxRestarts, else give up."
  sources:
  - src/vs/platform/agentHost/node/agentHostService.ts:206-248
  request:
    type: object
    properties:
      code:
        type: integer
        default: 1
      platform:
        type: string
        examples:
        - linux
        default: linux
  response:
    type: object
    properties:
      restarted:
        type: boolean
      gave_up:
        type: boolean
  behavior:
  - if: "!state.running"
    then:
    - return:
        restarted: false
        gave_up: false
  - set:
      state.running: false
  - if: state.quit_requested
    then:
    - return:
        restarted: false
        gave_up: false
  - if: input.platform == 'win32' && input.code in [3221226091, 1073807364]
    then:
    - title: Expected Windows shutdown exit code
      source: src/vs/platform/agentHost/node/agentHostService.ts:215-218
      return:
        restarted: false
        gave_up: false
  - if: state.restart_count < config['agent-host-max-restarts']
    then:
    - title: "Unexpected exit: restart immediately, no backoff"
      source: src/vs/platform/agentHost/node/agentHostService.ts:229-243
      set:
        state.restart_count: "= state.restart_count + 1"
    - call: agent-host-process-manager.ensure-started
    - return:
        restarted: true
        gave_up: false
  - title: Giving up after MaxRestarts
    source: src/vs/platform/agentHost/node/agentHostService.ts:244-247
    set:
      state.restart_limit_reached: true
  - return:
      restarted: false
      gave_up: true
- component: agent-host-process-manager
  name: restart
  kind: function
  summary: "restart: reset crash bookkeeping, shut the current host down (6 s race), start a new one."
  sources:
  - src/vs/platform/agentHost/node/agentHostService.ts:98-135
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      started:
        type: boolean
  errors:
  - code: agent-host-process-manager-shutting-down
    status: 0
    retryable: false
    summary: Agent Host process manager is shutting down.
  behavior:
  - if: state.quit_requested
    then:
    - fail:
        code: agent-host-process-manager-shutting-down
        message: Agent Host process manager is shutting down.
  - title: Reset restartCount and the limit flag
    source: src/vs/platform/agentHost/node/agentHostService.ts:103-104
    set:
      state.restart_count: 0
      state.restart_limit_reached: false
  - if: state.running
    then:
    - title: Graceful shutdown raced against ShutdownTimeoutMs
      source: src/vs/platform/agentHost/node/agentHostService.ts:117-127
      call: agent-host-management-service.shutdown
      timeout_ms: "= config['agent-host-shutdown-timeout-ms']"
      on_error: continue
    - set:
        state.running: false
  - call: agent-host-main.start
    input:
      claude_sdk_available: false
      codex_enabled_env: false
      codex_root_config_enabled: false
      configured_port: ''
    fill: true
  - set:
      state.running: true
      state.starts: "= state.starts + 1"
  - return:
      started: true
