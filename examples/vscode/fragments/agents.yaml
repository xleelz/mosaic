- component: mcp-commands
  name: cmd-workbench-mcp-configuresamplingmodels
  kind: command
  summary: "Configure Sampling Models: multi-pick of models, written to chat.mcp.serverSampling allowedModels; returns the count."
  sources:
  - src/vs/workbench/contrib/mcp/browser/mcpCommands.ts:1727-1768
  - src/vs/workbench/contrib/mcp/browser/mcp.contribution.ts:105
  request:
    type: object
    properties:
      server_key:
        type: string
        examples:
        - "User: GitHub"
        default: "User: GitHub"
      picked:
        type: array
        items:
          type: string
        default:
        - copilot/gpt-4.1
  response:
    type: object
    properties:
      count:
        type: integer
  behavior:
  - if: size(input.picked) == 0
    then:
    - return:
        count: 0
  - call: mcp-sampling-service.update-config
