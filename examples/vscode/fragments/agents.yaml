  - agents-seed
  input:
    fn: computeEverything
  expect:
  - "!result.ok"
  - "result.error.message == 'Unknown function: computeEverything'"
- id: agents-agent-host-crash-recovery-restarts
  fixtures:
  - one-window-folder
  - agents-seed
  state:
    agent-host-process-manager:
      running: true
      restart_count: 0
  steps:
  - flow: agents-agent-host-crash-recovery
    as: crash
  - flow: agents-agent-host-status
    as: read
  expect:
  - steps.crash.result.value.restarted
  - steps.read.result.value.running
  - steps.read.result.value.restart_count == 1
  - steps.read.result.value.starts == 1
  - state['agent-host-process-manager'].running
- id: agents-agent-host-crash-recovery-gives-up
  fixtures:
  - one-window-folder
  - agents-seed
  state:
    agent-host-process-manager:
      running: true
      restart_count: 5
  steps:
  - flow: agents-agent-host-crash-recovery
    as: crash
  - flow: agents-agent-host-ensure-started
    as: read
  expect:
  - steps.crash.result.value.gave_up
  - "!steps.read.result.ok"
  - steps.read.result.error.code == 'agent-host-start-error'
  - steps.read.result.error.message == 'Agent Host process stopped after 5 restarts.'
  - state['agent-host-process-manager'].restart_limit_reached
- id: agents-agent-host-crash-recovery-windows-shutdown-code
  flow: agents-agent-host-crash-recovery
  fixtures:
  - one-window-folder
  - agents-seed
  state:
    agent-host-process-manager:
      running: true
      restart_count: 0
  input:
    platform: win32
    code: 3221226091
  expect:
  - result.ok
  - "!result.value.restarted"
  - "!state['agent-host-process-manager'].running"
  - state['agent-host-process-manager'].restart_count == 0
- id: agents-agent-host-crash-recovery-quit-requested
  flow: agents-agent-host-crash-recovery
  fixtures:
  - one-window-folder
  - agents-seed
  state:
    agent-host-process-manager:
      running: true
      quit_requested: true
  expect:
  - result.ok
  - "!result.value.restarted"
  - "!trace.exists(e, e.type == 'call.start' && e.interface == 'agent-host-process-manager.ensure-started')"
- id: agents-agent-host-crash-recovery-stale-connection
  flow: agents-agent-host-crash-recovery
  fixtures:
  - one-window-folder
  - agents-seed
  expect:
  - result.ok
  - "!result.value.restarted"
  - "!result.value.gave_up"
- id: agents-agent-host-ensure-started-first-start
  fixtures:
  - one-window-folder
  - agents-seed
  steps:
  - flow: agents-agent-host-ensure-started
    as: start
  - flow: agents-agent-host-status
    as: read
  expect:
  - steps.start.result.value.started
