- component: protocol-server-handler
  name: initialize
  kind: rpc
  summary: "_handleInitialize: negotiate the protocol version (caret ranges of 1.0.0 and 0.9.0, legacy 0.10.0 preferred), then register the client."
  sources:
  - src/vs/platform/agentHost/node/protocolServerHandler.ts:991-1040
  - src/vs/platform/agentHost/common/state/protocol/version/registry.ts:64-80
  - src/vs/platform/agentHost/common/agentHostProtocolCompatibility.ts:12-23
  attributes:
    method: initialize
  request:
    type: object
    properties:
      client_id:
        type: string
        examples:
        - w1-client
      protocol_versions:
        type: array
        items:
          type: string
        default:
        - 1.1.0
    required:
    - client_id
  response:
    type: object
    properties:
      protocol_version:
        type: string
      server_version:
        type: string
  errors:
  - code: ahp-unsupported-protocol-version
    status: 0
    retryable: false
    summary: "ProtocolError -32005: none of the offered versions is compatible"
  behavior:
  - set:
      vars.compatible: "= input.protocol_versions.filter(v, v.startsWith('1.') || v.startsWith('0.9.'))"
  - set:
      vars.negotiated: "= input.protocol_versions.exists(v, v == '0.10.0') ? '0.10.0' : (size(vars.compatible) > 0 ? vars.compatible.filter(v, vars.compatible.all(w, w <= v))[0] : '')"
  - if: vars.negotiated == ''
    then:
    - title: Unsupported protocol version (the highest compatible offered version is selected otherwise)
      source: src/vs/platform/agentHost/node/protocolServerHandler.ts:1006-1025
      fail:
        code: ahp-unsupported-protocol-version
        message: "= 'Client offered protocol versions [' + input.protocol_versions.join(', ') + '], none of which are compatible with this server\\'s version 1.1.0'"
        data:
          jsonrpc_code: -32005
          supported_versions:
          - 1.0.0
          - 0.10.0
          - 0.9.0
  - call: protocol-server-handler.clients-put
    input:
      client_id: "= input.client_id"
      protocol_version: "= vars.negotiated"
    fill: true
  - return:
      protocol_version: "= vars.negotiated"
      server_version: 1.1.0
