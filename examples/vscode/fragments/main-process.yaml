# main-process area fragment (VS Code 1.144.0, 2c33b50b16).
# Owns src/vs/code/**, src/main.ts, src/cli.ts, src/bootstrap-*.ts, src/vs/platform/*/electron-main/**,
# src/vs/platform/windows/**, src/vs/platform/update/**, src/vs/workbench/electron-browser/**.
# Platform modeled: Linux/Windows (non-macOS) branches; macOS-only branches are noted, not modeled.
schema_version: 1
id: vscode

configs:
  - id: files-hot-exit
    type: string
    value: onExit
    default: onExit
    summary: "files.hotExit: off | onExit | onExitAndWindowClose. product.json sets no override, so the deployed value is the registered native default."
    sources:
      - "src/vs/workbench/contrib/files/browser/files.contribution.ts:123-128"
      - "src/vs/workbench/contrib/files/browser/files.contribution.ts:321"
      - "src/vs/platform/backup/electron-main/backupMainService.ts:97-101"
    attributes: {key: files.hotExit}
  - id: update-mode
    type: string
    value: default
    default: default
    summary: "update.mode: none | manual | start | default. Not overridden in product.json."
    sources:
      - "src/vs/platform/update/common/update.config.contribution.ts:19-22"
      - "src/vs/platform/update/electron-main/abstractUpdateService.ts:238"
    attributes: {key: update.mode}
  - id: window-restore-windows
    type: string
    value: all
    default: all
    summary: "window.restoreWindows: preserve | all | folders | one | none. A restart after an update always restores all."
    sources:
      - "src/vs/workbench/electron-browser/desktop.contribution.ts:182-192"
      - "src/vs/platform/windows/electron-main/windowsMainService.ts:1065-1079"
    attributes: {key: window.restoreWindows}
  - id: window-open-files-in-new-window
    type: string
    value: "off"
    default: "off"
    summary: "window.openFilesInNewWindow (registered by the workbench, read only by WindowsMainService.shouldOpenNewWindow)."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:961-971"
      - "src/vs/platform/windows/electron-main/windowsMainService.ts:1368"
    attributes: {key: window.openFilesInNewWindow}
  - id: window-open-folders-in-new-window
    type: string
    value: default
    default: default
    summary: "window.openFoldersInNewWindow (registered by the workbench, read only by WindowsMainService.shouldOpenNewWindow)."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:978-986"
      - "src/vs/platform/windows/electron-main/windowsMainService.ts:1367"
    attributes: {key: window.openFoldersInNewWindow}
  - id: window-open-without-arguments-in-new-window
    type: string
    value: "on"
    default: "on"
    summary: "window.openWithoutArgumentsInNewWindow. The registered default is platform dependent: 'on' on Windows/Linux (modeled), 'off' on macOS."
    sources:
      - "src/vs/workbench/electron-browser/desktop.contribution.ts:171-178"
      - "src/vs/platform/launch/electron-main/launchMainService.ts:167-178"
    attributes: {key: window.openWithoutArgumentsInNewWindow}
  - id: security-prompt-for-local-file-protocol-handling
    type: boolean
    value: true
    default: true
    summary: "security.promptForLocalFileProtocolHandling: confirm before a protocol link opens a local file, folder or workspace."
    sources:
      - "src/vs/workbench/electron-browser/desktop.contribution.ts:385-387"
      - "src/vs/code/electron-main/app.ts:980-983"
    attributes: {key: security.promptForLocalFileProtocolHandling}
  - id: window-zoom-level
    type: integer
    value: 0
    default: 0
    summary: "window.zoomLevel: the default zoom level for all windows."
    sources:
      - "src/vs/workbench/electron-browser/desktop.contribution.ts:202-204"
      - "src/vs/workbench/electron-browser/actions/windowActions.ts:122-127"
    attributes: {key: window.zoomLevel}
  - id: window-zoom-per-window
    type: boolean
    value: true
    default: true
    summary: "window.zoomPerWindow: zoom commands apply to the active window only (true) or to all windows through window.zoomLevel (false)."
    sources:
      - "src/vs/workbench/electron-browser/desktop.contribution.ts:211-213"
      - "src/vs/workbench/electron-browser/actions/windowActions.ts:104-108"
    attributes: {key: window.zoomPerWindow}
  - id: window-dialog-style
    type: string
    value: native
    default: native
    summary: "window.dialogStyle: native or custom dialogs in the renderer (the agents window defaults to custom)."
    sources:
      - "src/vs/workbench/electron-browser/desktop.contribution.ts:290-296"
      - "src/vs/workbench/electron-browser/parts/dialogs/dialog.contribution.ts:107-111"
    attributes: {key: window.dialogStyle}
  - id: window-native-tabs
    type: boolean
    value: false
    default: false
    summary: "window.nativeTabs (macOS only)."
    sources:
      - "src/vs/workbench/electron-browser/desktop.contribution.ts:298-302"
      - "src/vs/workbench/electron-browser/actions/windowActions.ts:435-442"
    attributes: {key: window.nativeTabs}
  - id: window-confirm-before-close
    type: string
    value: never
    default: never
    summary: "window.confirmBeforeClose (desktop default never). Registered and owned by workbench-shell; read here by the quit command and NativeWindow.onBeforeShutdown."
    sources:
      - "src/vs/workbench/browser/workbench.contribution.ts:990-1004"
      - "src/vs/workbench/electron-browser/window.ts:472-474"
    attributes: {boundary: true, owner: workbench-shell, key: window.confirmBeforeClose}
  - id: product-update-url
    type: string
    value: ""
    default: ""
    summary: "product.json updateUrl. The OSS product.json at this commit has no updateUrl (and no quality), so the update service disables itself with MissingConfiguration."
    sources:
      - "product.json:1-250"
      - "src/vs/platform/update/electron-main/abstractUpdateService.ts:206-210"
    attributes: {key: "product.json updateUrl"}
  - id: product-quality
    type: string
    value: ""
    default: ""
    summary: "product.json quality (absent in the OSS product.json): the update channel; no quality means updates are disabled."
    sources:
      - "product.json:1-250"
      - "src/vs/platform/update/electron-main/abstractUpdateService.ts:445-447"
    attributes: {key: "product.json quality"}
  - id: product-tunnel-application-name
    type: string
    value: code-tunnel-oss
    default: code-tunnel-oss
    summary: "product.json tunnelApplicationName: when set, `code tunnel|serve-web|agent` spawn the Rust CLI."
    sources:
      - "product.json:16"
      - "src/vs/code/node/cli.ts:54-59"
    attributes: {key: "product.json tunnelApplicationName"}
  - id: update-initial-check-delay-ms
    type: integer
    value: 30000
    default: 30000
    summary: "Code constant: the first automatic update check runs 30 s after the mode is applied."
    sources:
      - "src/vs/platform/update/electron-main/abstractUpdateService.ts:335"
      - "src/vs/platform/update/electron-main/abstractUpdateService.ts:338"
    attributes: {key: "AbstractUpdateService.scheduleAccordingToMode delay"}
  - id: update-check-interval-ms
    type: integer
    value: 3600000
    default: 3600000
    summary: "Code constant: in mode 'default' the check repeats every hour."
    sources:
      - "src/vs/platform/update/electron-main/abstractUpdateService.ts:449"
      - "src/vs/platform/update/electron-main/abstractUpdateService.ts:458"
    attributes: {key: "AbstractUpdateService.scheduleCheckForUpdates delay"}
  - id: second-instance-warning-timeout-ms
    type: integer
    value: 10000
    default: 10000
    summary: "Code constant: a second instance warns that the running instance is not responding after 10 s (not with --wait or --status)."
    sources:
      - "src/vs/code/electron-main/main.ts:435-442"
    attributes: {key: "CodeMain.claimInstance startupWarningDialogHandle"}
  - id: kill-window-close-timeout-ms
    type: integer
    value: 1000
    default: 1000
    summary: "Code constant: LifecycleMainService.kill waits at most 1 s for windows to close before app.exit."
    sources:
      - "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:728-731"
    attributes: {key: "LifecycleMainService.kill timeout"}
  - id: eventually-phase-delay-ms
    type: integer
    value: 2500
    default: 2500
    summary: "Code constant: the Eventually lifecycle phase starts 2.5 s after window open (then on idle, at most 2.5 s more)."
    sources:
      - "src/vs/code/electron-main/app.ts:818-831"
    attributes: {key: "CodeApplication eventuallyPhaseScheduler"}

  - id: onboarding-tryout-accept-timeout-ms
    type: integer
    value: 30000
    default: 30000
    summary: "Code constant: OnboardingTryoutHandoff waits at most 30 s for the Agents window to accept a feature example, then cancels it."
    sources:
      - "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:16"
      - "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:59-63"
    attributes: {key: "TRYOUT_ACCEPT_TIMEOUT"}
  - id: network-metered-connection
    type: string
    value: auto
    default: auto
    summary: "network.meteredConnection: auto | on | off (APPLICATION scope). Registered by platform-core; read here by MeteredConnectionMainService. Not overridden in product.json."
    sources:
      - "src/vs/platform/meteredConnection/common/meteredConnection.config.contribution.ts:17-29"
      - "src/vs/platform/meteredConnection/common/meteredConnection.ts:94-95"
    attributes: {boundary: true, owner: platform-core, key: network.meteredConnection}

components:
  # ---------------------------------------------------------------- electron main process
  - id: code-main
    name: CodeMain
    kind: module
    layer: process
    parent: main-process
    summary: "Electron main entry: creates the main services, claims the single-instance IPC handle or forwards to the running instance."
    sources: ["src/vs/code/electron-main/main.ts:92-101", "src/vs/code/electron-main/main.ts:737-739", "src/main.ts:6-10"]
    attributes: {owner: main-process}
    state:
      schema: {type: object, properties: {ipc_handle_in_use: {type: boolean}, stale_handle: {type: boolean}, user_data_writable: {type: boolean}, inno_setup_active: {type: boolean}, running: {type: boolean}, exit: {type: string}}}
      initial: {ipc_handle_in_use: false, stale_handle: false, user_data_writable: true, inno_setup_active: false, running: false, exit: ""}
  - id: code-application
    name: CodeApplication
    kind: module
    layer: process
    parent: main-process
    summary: "The running app: services, IPC channels, protocol URL handling, first window."
    sources: ["src/vs/code/electron-main/app.ts:698-841"]
    attributes: {owner: main-process}
    state:
      schema: {type: object, properties: {channels: {type: array}, protocol_urls_opened: {type: array}}}
      initial: {channels: [], protocol_urls_opened: []}
  - id: windows-main-service
    name: WindowsMainService
    kind: module
    layer: windows
    parent: main-process
    summary: "Opens, reuses and tracks code windows; decides where folders and files open."
    sources: ["src/vs/platform/windows/electron-main/windows.ts:23", "src/vs/platform/windows/electron-main/windowsMainService.ts:185", "src/vs/code/electron-main/app.ts:1243"]
    attributes: {owner: main-process, service: IWindowsMainService}
    state:
      schema: {type: object, properties: {windows: {type: object}, last_active: {type: string}, next_window: {type: integer}}}
      initial:
        windows:
          w1: {open: true, workspace: "file:///work/app", extension_development_host: false, files: []}
        last_active: w1
        next_window: 2
  - id: windows-state-handler
    name: WindowsStateHandler
    kind: module
    layer: windows
    parent: windows-main-service
    summary: "Persists which windows were open (windowsState in storage.json) for the next session."
    sources: ["src/vs/platform/windows/electron-main/windowsStateHandler.ts:53-57"]
    attributes: {owner: main-process}
    state:
      schema: {type: object, properties: {last_active_window: {type: object}, opened_windows: {type: array}, shutting_down: {type: boolean}, last_closed: {type: object}}}
      initial: {last_active_window: {folder_uri: "file:///work/app"}, opened_windows: [], shutting_down: false, last_closed: {}}
  - id: code-window
    name: CodeWindow
    kind: module
    layer: windows
    parent: windows-main-service
    summary: "One Electron BrowserWindow per workbench window: load, reload, ready state, document edited flag, error handling."
    sources: ["src/vs/platform/windows/electron-main/windowImpl.ts:667"]
    attributes: {owner: main-process}
    state:
      schema: {type: object, properties: {windows: {type: object}}}
      initial:
        windows:
          w1: {ready: true, document_edited: false, always_on_top: false, auxiliary: false, zoom_level: 0, dev_tools_open: false, loads: 1, workspace: "file:///work/app"}
  - id: lifecycle-main-service
    name: LifecycleMainService
    kind: module
    layer: lifecycle
    parent: main-process
    summary: "Main-process lifecycle: phases, quit with veto, window unload/close handshake with the renderer, relaunch, kill."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:24", "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:213", "src/vs/code/electron-main/main.ts:279"]
    attributes: {owner: main-process, service: ILifecycleMainService}
    state:
      schema: {type: object, properties: {phase: {type: integer}, quit_requested: {type: boolean}, will_restart: {type: boolean}, shutdown_reason: {type: string}, exited: {type: boolean}, exit_code: {type: integer}}}
      initial: {phase: 4, quit_requested: false, will_restart: false, shutdown_reason: "", exited: false, exit_code: 0}
  - id: backup-main-service
    name: BackupMainService
    kind: module
    layer: lifecycle
    parent: main-process
    summary: "Hot exit bookkeeping in the main process: which workspaces, folders and empty windows have backups (backupWorkspaces in storage.json)."
    sources: ["src/vs/platform/backup/electron-main/backup.ts:10", "src/vs/platform/backup/electron-main/backupMainService.ts:24-49", "src/vs/code/electron-main/app.ts:1320-1321"]
    attributes: {owner: main-process, service: IBackupMainService}
    state:
      schema: {type: object, properties: {folders: {type: array}, workspaces: {type: array}, empty_windows: {type: array}}}
      initial: {folders: ["file:///work/app"], workspaces: [], empty_windows: []}
  - id: native-host-main-service
    name: NativeHostMainService
    kind: service
    layer: process
    parent: main-process
    summary: "Server of the nativeHost channel: window operations, quit/reload/relaunch, shell, dialogs and OS facts for renderers."
    sources: ["src/vs/platform/native/electron-main/nativeHostMainService.ts:60", "src/vs/platform/native/electron-main/nativeHostMainService.ts:61", "src/vs/code/electron-main/app.ts:1464"]
    attributes: {owner: main-process, service: INativeHostMainService, channel: nativeHost}
    state:
      schema: {type: object, properties: {shown_in_folder: {type: array}, tracing: {type: boolean}, opened_aux_windows: {type: array}, shell_command_installed: {type: boolean}, shell_command_writable: {type: boolean}}}
      initial: {shown_in_folder: [], tracing: false, opened_aux_windows: [], shell_command_installed: true, shell_command_writable: true}
  - id: launch-main-service
    name: LaunchMainService
    kind: module
    layer: process
    parent: main-process
    summary: "Server of the node 'launch' channel: a second instance sends its argv and env here and the running instance opens windows."
    sources: ["src/vs/platform/launch/electron-main/launchMainService.ts:23", "src/vs/platform/launch/electron-main/launchMainService.ts:39", "src/vs/code/electron-main/app.ts:1386"]
    attributes: {owner: main-process, service: ILaunchMainService, channel: launch}
  - id: linux-update-service
    name: LinuxUpdateService
    kind: module
    layer: update
    parent: main-process
    summary: "The platform update service (AbstractUpdateService state machine; Linux archive variant modeled). Win32, Darwin and Snap variants share the abstract logic."
    sources: ["src/vs/platform/update/common/update.ts:108", "src/vs/platform/update/electron-main/updateService.linux.ts:20", "src/vs/platform/update/electron-main/abstractUpdateService.ts:104-130", "src/vs/code/electron-main/app.ts:1229-1235"]
    attributes: {owner: main-process, service: IUpdateService}
    state:
      schema: {type: object, properties: {state: {type: string}, disabled_reason: {type: string}, explicit: {type: boolean}, deferred: {type: boolean}, quality: {type: string}, update: {type: object}, is_built: {type: boolean}, disable_updates_env: {type: boolean}, scheduled: {type: integer}}}
      initial: {state: uninitialized, disabled_reason: "", explicit: false, deferred: false, quality: "", update: {}, is_built: true, disable_updates_env: false, scheduled: 0}
  - id: update-channel
    name: UpdateChannel
    kind: module
    layer: update
    parent: linux-update-service
    summary: "IPC server of the 'update' channel: forwards renderer calls to the update service."
    sources: ["src/vs/platform/update/common/updateIpc.ts:11-36", "src/vs/code/electron-main/app.ts:1414-1417"]
    attributes: {owner: main-process, channel: update}
  - id: metered-connection-main-service
    name: MeteredConnectionMainService
    kind: module
    layer: update
    parent: main-process
    summary: "Whether the OS reports a metered connection; automatic update work is deferred while metered."
    sources: ["src/vs/platform/meteredConnection/electron-main/meteredConnectionMainService.ts:15", "src/vs/code/electron-main/app.ts:1274-1275"]
    attributes: {owner: main-process}
    state:
      schema: {type: object, properties: {metered: {type: boolean}, browser_metered: {type: boolean}, initialized: {type: boolean}}}
      initial: {metered: false, browser_metered: false, initialized: false}
  - id: update-server
    name: Update server
    kind: external
    layer: external
    summary: "The update feed at <updateUrl>/api/update/<platform>/<quality>/<commit>: 204 when current, JSON IUpdate when newer."
    sources: ["src/vs/platform/update/electron-main/abstractUpdateService.ts:33-43"]
    attributes: {owner: main-process}
    state:
      schema: {type: object, properties: {latest: {type: object}, reachable: {type: boolean}}}
      initial: {latest: {}, reachable: true}
  - id: workspaces-main-service
    name: WorkspacesMainService
    kind: module
    layer: workspaces
    parent: main-process
    summary: "Server of the 'workspaces' channel: recently opened, enter workspace, dirty workspaces for renderers."
    sources: ["src/vs/platform/workspaces/electron-main/workspacesMainService.ts:17", "src/vs/code/electron-main/app.ts:1476"]
    attributes: {owner: main-process, channel: workspaces}
  - id: workspaces-history-main-service
    name: WorkspacesHistoryMainService
    kind: module
    layer: workspaces
    parent: main-process
    summary: "The recently opened list (history.recentlyOpenedPathsList in application storage), capped at 500 entries each."
    sources: ["src/vs/platform/workspaces/electron-main/workspacesHistoryMainService.ts:34", "src/vs/platform/workspaces/electron-main/workspacesHistoryMainService.ts:48-52"]
    attributes: {owner: main-process, service: IWorkspacesHistoryMainService}
    state:
      schema: {type: object, properties: {workspaces: {type: array}, files: {type: array}}}
      initial: {workspaces: ["file:///work/app"], files: []}
  - id: workspaces-management-main-service
    name: WorkspacesManagementMainService
    kind: module
    layer: workspaces
    parent: main-process
    summary: "Untitled workspaces (created when several folders open at once) and resolution of .code-workspace files."
    sources: ["src/vs/platform/workspaces/electron-main/workspacesManagementMainService.ts:29", "src/vs/platform/workspaces/electron-main/workspacesManagementMainService.ts:57", "src/vs/code/electron-main/app.ts:1324-1325"]
    attributes: {owner: main-process, service: IWorkspacesManagementMainService}
    state:
      schema: {type: object, properties: {untitled: {type: array}, next_id: {type: integer}}}
      initial: {untitled: [], next_id: 1}
  - id: menubar-main-service
    name: MenubarMainService
    kind: module
    layer: native
    parent: main-process
    summary: "Installs the native application menu after the first window opens."
    sources: ["src/vs/platform/menubar/electron-main/menubarMainService.ts:13", "src/vs/platform/menubar/electron-main/menubarMainService.ts:19-38", "src/vs/code/electron-main/app.ts:1480"]
    attributes: {owner: main-process, service: IMenubarMainService, channel: menubar}
  - id: menubar
    name: Menubar
    kind: module
    layer: native
    parent: menubar-main-service
    summary: "The native menu: a click runs the command in the focused (or minimized last active) window."
    sources: ["src/vs/platform/menubar/electron-main/menubar.ts:46"]
    attributes: {owner: main-process}
  - id: dialog-main-service
    name: DialogMainService
    kind: module
    layer: native
    parent: main-process
    summary: "Native message boxes and file dialogs, queued per window so only one shows at a time."
    sources: ["src/vs/platform/dialogs/electron-main/dialogMainService.ts:23", "src/vs/platform/dialogs/electron-main/dialogMainService.ts:48-53", "src/vs/code/electron-main/app.ts:1247-1248"]
    attributes: {owner: main-process, service: IDialogMainService}
    capacity: {concurrency: 1}
  - id: shared-process-host
    name: SharedProcess (main side)
    kind: module
    layer: process
    parent: main-process
    summary: "Spawns the shared process as an Electron utility process and connects to it over a message port."
    sources: ["src/vs/platform/sharedProcess/electron-main/sharedProcess.ts:24", "src/vs/code/electron-main/app.ts:1196-1218"]
    attributes: {owner: main-process, class: SharedProcess}
    state:
      schema: {type: object, properties: {started: {type: boolean}, ready: {type: boolean}, crashed: {type: boolean}}}
      initial: {started: false, ready: false, crashed: false}
  - id: storage-main-service
    name: StorageMainService
    kind: module
    layer: storage
    parent: main-process
    summary: "Owns the application, profile and workspace state.vscdb databases and serves the 'storage' channel."
    sources: ["src/vs/platform/storage/electron-main/storageMainService.ts:26", "src/vs/platform/storage/electron-main/storageMainService.ts:82", "src/vs/code/electron-main/app.ts:1492"]
    attributes: {owner: main-process, service: IStorageMainService, channel: storage}
  - id: application-storage-main-service
    name: ApplicationStorageMainService
    kind: module
    layer: storage
    parent: storage-main-service
    summary: "Application-scoped storage usable in the main process (e.g. the update service's last known version)."
    sources: ["src/vs/platform/storage/electron-main/storageMainService.ts:331", "src/vs/platform/storage/electron-main/storageMainService.ts:374", "src/vs/code/electron-main/app.ts:1293"]
    attributes: {owner: main-process, service: IApplicationStorageMainService}
  # Services registered at startup and reached through the startup narrative (their channels are listed on code-application.init-channels)
  - {id: auxiliary-windows-main-service, name: AuxiliaryWindowsMainService, kind: module, layer: windows, parent: main-process, summary: "Tracks auxiliary (floating editor) windows of each main window.", sources: ["src/vs/platform/auxiliaryWindow/electron-main/auxiliaryWindows.ts:11", "src/vs/platform/auxiliaryWindow/electron-main/auxiliaryWindowsMainService.ts:18", "src/vs/code/electron-main/app.ts:1244"], attributes: {owner: main-process, service: IAuxiliaryWindowsMainService}}
  - {id: browser-view-main-service, name: BrowserViewMainService, kind: module, layer: native, parent: main-process, summary: "Hosts integrated browser views (browserView channel).", sources: ["src/vs/platform/browserView/electron-main/browserViewMainService.ts:33", "src/vs/platform/browserView/electron-main/browserViewMainService.ts:52", "src/vs/code/electron-main/app.ts:1261"], attributes: {owner: main-process, service: IBrowserViewMainService}}
  - {id: browser-view-group-main-service, name: BrowserViewGroupMainService, kind: module, layer: native, parent: main-process, summary: "Groups of browser views (browserViewGroup channel).", sources: ["src/vs/platform/browserView/electron-main/browserViewGroupMainService.ts:17", "src/vs/platform/browserView/electron-main/browserViewGroupMainService.ts:29", "src/vs/code/electron-main/app.ts:1262"], attributes: {owner: main-process, service: IBrowserViewGroupMainService}}
  - {id: diagnostics-main-service, name: DiagnosticsMainService, kind: module, layer: process, parent: main-process, summary: "Collects main-process and window diagnostics; served on the node 'diagnostics' channel for `code --status`.", sources: ["src/vs/platform/diagnostics/electron-main/diagnosticsMainService.ts:21", "src/vs/platform/diagnostics/electron-main/diagnosticsMainService.ts:34", "src/vs/code/electron-main/app.ts:1254"], attributes: {owner: main-process, service: IDiagnosticsMainService}}
  - {id: linux-external-terminal-service, name: LinuxExternalTerminalService, kind: module, layer: native, parent: main-process, summary: "Opens an external terminal (externalTerminal channel); Windows and macOS variants are chosen by platform.", sources: ["src/vs/platform/externalTerminal/electron-main/externalTerminal.ts:9", "src/vs/code/electron-main/app.ts:1310-1316"], attributes: {owner: main-process, service: IExternalTerminalMainService}}
