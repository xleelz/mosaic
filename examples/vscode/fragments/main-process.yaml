  - component: workspaces-history-main-service
    name: add-recently-opened
    kind: function
    summary: "WorkspacesHistoryMainService.addRecentlyOpened: prepend new folders/files (no untitled workspaces, no duplicates), cap at 500, save, fire change."
    sources: ["src/vs/platform/workspaces/electron-main/workspacesHistoryMainService.ts:85-143"]
    request: {type: object, properties: {workspaces: {type: array, items: {type: string}, examples: [["file:///work/app"]]}, files: {type: array, items: {type: string}, examples: [[]]}}}
    response: {type: object, properties: {workspaces: {type: integer}, files: {type: integer}}}
