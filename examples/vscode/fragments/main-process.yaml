    entry: {caller: workbench-window, interface: native-host-main-service.open-agents-window, input: {window_id: w1, source: commandPalette}}
  - id: onboarding-tryout-open
    name: Hand a feature example to the Agents window (onboardingTryout.open)
    tags: [writes]
    sources: ["src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:35-69"]
    entry: {caller: workbench-window, interface: onboarding-tryout-handoff.open, input: {window_id: w1, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69", tryout_id: agentsWindow, source: direct}}
  - id: onboarding-tryout-complete
    name: The Agents window accepts or rejects the feature example (onboardingTryout.complete)
    sources: ["src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:78-83"]
    entry: {caller: workbench-window, interface: onboarding-tryout-handoff.complete, input: {window_id: w2, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69", result: accepted}}
  - id: onboarding-tryout-cancel
