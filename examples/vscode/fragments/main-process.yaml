  - component: dialog-main-service
    name: show-message-box
    kind: function
    summary: "DialogMainService.showMessageBox: queued per window; the user's button and checkbox are the result."
    sources: ["src/vs/platform/dialogs/electron-main/dialogMainService.ts:153-170", "src/vs/platform/dialogs/electron-main/dialogMainService.ts:134-151"]
    request: {type: object, properties: {message: {type: string}, buttons: {type: array, items: {type: string}}, cancel_id: {type: integer}, checkbox: {type: boolean, default: false}}}
    response: {type: object, properties: {response: {type: integer}, checkbox_checked: {type: boolean}}}
    behavior:
      - set:
          vars.buttons: "= has(input.buttons) ? input.buttons : []"
          vars.n: "= has(input.buttons) ? size(input.buttons) : 0"
      - set:
          vars.cancel: "= has(input.cancel_id) ? input.cancel_id : vars.n - 1"
          vars.order: "= vars.buttons.transformList(i, b, i)"
      - if: "vars.n > 1 && vars.cancel >= 0 && vars.cancel < vars.n && vars.cancel != 1"
        then:
          - title: Linux moves the cancel button to the second position (splice), keeping the index map
            source: "src/vs/platform/dialogs/electron-main/dialogMainUtils.ts:43-56"
            set: {vars.order: "= [vars.order.filter(i, i != vars.cancel)[0], vars.cancel] + vars.order.filter(i, i != vars.cancel && i != vars.order.filter(j, j != vars.cancel)[0])"}
      - if: "vars.n > 1"
        then:
          - title: Linux reverses the buttons; the default is the last one and cancel the one before it
            source: "src/vs/platform/dialogs/electron-main/dialogMainUtils.ts:58-67"
            set:
              state.last_massaged:
                buttons: "= vars.order.transformList(i, x, vars.buttons[vars.order[vars.n - 1 - i]])"
                button_indices: "= vars.order.transformList(i, x, vars.order[vars.n - 1 - i])"
                default_id: "= vars.n - 1"
                cancel_id: "= vars.n - 2"
      - title: "The user picks a label; the result maps back to the caller's index through buttonIndeces (logical index)"
        source: "src/vs/platform/dialogs/electron-main/dialogMainService.ts:155-167"
        choice: user_button
        default: first
        options:
          first:
            - return: {response: 0, checkbox_checked: false}
          first_checked:
            - return: {response: 0, checkbox_checked: true}
          second:
            - return: {response: 1, checkbox_checked: false}
          third:
            - return: {response: 2, checkbox_checked: false}

