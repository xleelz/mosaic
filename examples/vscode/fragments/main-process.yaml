      - if: "input.args.profile != '' && input.args.profile != 'Default'"
        then:
          - title: Unknown --profile
            source: "src/vs/code/node/cliProcessMain.ts:308-313"
            fail: {code: profile-not-found, message: "= 'Profile \\'' + input.args.profile + '\\' not found.'"}
      - if: "input.args.list_extensions"
        then:
          - title: --list-extensions
            source: "src/vs/code/node/cliProcessMain.ts:317-319"
            call: extension-management-cli.list-extensions
            input: {show_versions: false}
          - return: {output: list}
      - if: "size(input.args.install_extension) > 0"
        then:
          - title: --install-extension (ids or .vsix paths)
            source: "src/vs/code/node/cliProcessMain.ts:322-325"
            call: extension-management-cli.install-extensions
            input: {extensions: "= input.args.install_extension", force: false}
          - return: {output: install}
      - title: --uninstall-extension
        source: "src/vs/code/node/cliProcessMain.ts:328-330"
        call: extension-management-cli.uninstall-extensions
        input: {extensions: "= input.args.uninstall_extension", force: false}
      - return: {output: uninstall}

