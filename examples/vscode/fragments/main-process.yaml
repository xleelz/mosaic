  - component: desktop-window-actions
    name: set-zoom-level
    kind: function
    summary: "BaseZoomAction.setZoomLevel: target by window.zoomPerWindow, refuse levels outside [-8, 8], persist window.zoomLevel for all windows."
    sources: ["src/vs/workbench/electron-browser/actions/windowActions.ts:100-140"]
    request: {type: object, properties: {level: {type: integer}, reset: {type: boolean}}}
    response: {type: object, properties: {zoom_level: {type: integer}, applied: {type: boolean}}}
    behavior:
      - set:
          vars.all: "= config['window-zoom-per-window'] == false"
      - set:
          vars.level: "= input.reset ? (vars.all ? 0 : config['window-zoom-level']) : input.level"
      - if: "vars.level > 8 || vars.level < -8"
        then:
          - title: Outside MIN/MAX_ZOOM_LEVEL, ignored
            source: "src/vs/workbench/electron-browser/actions/windowActions.ts:131-133"
            call: desktop-main.get-zoom-level
            input: {}
            as: cur
          - return: {zoom_level: "= vars.cur.value.zoom_level", applied: false}
      - if: "vars.all"
        then:
          - title: All windows, write window.zoomLevel
            source: "src/vs/workbench/electron-browser/actions/windowActions.ts:135-137"
            call: configuration-service.update-value
            input: {key: window.zoomLevel, value: "= vars.level", target: user}
      - call: desktop-main.apply-zoom
        input: {level: "= vars.level"}
        as: applied
      - return: {zoom_level: "= vars.applied.value.zoom_level", applied: true}
