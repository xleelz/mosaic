    summary: "vscode:openFiles handler: open the files as editors; with --wait, track their closing to delete the marker."
    sources: ["src/vs/workbench/electron-browser/window.ts:215", "src/vs/workbench/electron-browser/window.ts:1030-1054"]
    request: {type: object, properties: {files: {type: array, items: {type: string}, examples: [["file:///work/app/src/main.ts"]]}, wait_marker_file: {type: string, default: ""}}}
    response: {type: object, properties: {opened: {type: integer}}}
    behavior:
      - foreach: "= input.files"
        as: f
        steps:
          - call: editor-service.open-editor
            input: {resource: "= vars.f"}
          - set: {state.opened_files: "= state.opened_files + [vars.f]"}
      - return: {opened: "= size(input.files)"}

  - component: native-window
    name: on-add-remove-folders
    kind: ipc
    summary: "vscode:addRemoveFolders handler: buffer the folders and add/remove them through the workspace editing service."
    sources: ["src/vs/workbench/electron-browser/window.ts:218", "src/vs/workbench/electron-browser/window.ts:1002-1028"]
    request: {type: object, properties: {folders_to_add: {type: array, items: {type: string}, examples: [["file:///work/lib"]]}}}
    response: {type: object, properties: {added: {type: integer}}}
    behavior:
      - set: {state.added_folders: "= (has(state.added_folders) ? state.added_folders : []) + input.folders_to_add"}
      - return: {added: "= size(input.folders_to_add)"}

  - component: native-window
    name: on-before-shutdown
    kind: event
    summary: "NativeWindow.onBeforeShutdown: with window.confirmBeforeClose=always, closing asks for confirmation (closing the last window on Windows/Linux counts as quit)."
    sources: ["src/vs/workbench/electron-browser/window.ts:441", "src/vs/workbench/electron-browser/window.ts:470-507"]
    subscribe: [lifecycle-service.on-before-shutdown]
    request: {type: object, properties: {reason: {type: string, enum: [close, quit, reload, load], default: close}}}
    response: {type: object, properties: {veto: {type: boolean}, reason: {type: string}}}
    behavior:
      - if: "input.reason != 'close' || config['window-confirm-before-close'] != 'always'"
        then:
          - title: No confirmation, only a delayed progress indicator
            source: "src/vs/workbench/electron-browser/window.ts:505-506"
            return: {veto: false, reason: "= input.reason"}
      - call: native-host-main-service.get-windows
        input: {}
        as: wins
      - set: {vars.reason: "= vars.wins.value.count == 1 ? 'quit' : 'close'"}
      - title: confirmOnShutdown dialog (Exit / Close Window)
        source: "src/vs/workbench/electron-browser/window.ts:481-501"
        choice: user_confirms
        default: confirm
        options:
          confirm:
            - return: {veto: false, reason: "= vars.reason"}
          cancel:
            - title: veto(promise, 'veto.confirmBeforeClose')
              source: "src/vs/workbench/electron-browser/window.ts:481-501"
              call: lifecycle-service.veto
              input: {id: veto.confirmBeforeClose, veto: true}
            - return: {veto: true, reason: "= vars.reason"}

