    sources: ["src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:71-76"]
    entry: {caller: workbench-window, interface: onboarding-tryout-handoff.cancel, input: {window_id: w1, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69"}}
