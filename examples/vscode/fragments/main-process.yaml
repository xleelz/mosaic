    behavior:
      - if: "size(input.args.paths) == 0 && (input.args.new_window || input.args.profile != '')"
        then:
          - title: Started without paths but forced new window or profile
            source: "src/vs/code/electron-main/app.ts:1624-1640"
            call: windows-main-service.open
            input: {context: "= input.launched_from_cli ? 'cli' : 'desktop'", force_new_window: true, force_empty: true, initial_startup: true, no_recent_entry: "= input.args.skip_add_to_recently_opened", folder_uris: [], file_uris: []}
            fill: true
            as: forced
          - return: "= vars.forced.value"
      - title: Default, read paths from the command line (or restore the last session)
        source: "src/vs/code/electron-main/app.ts:1660-1674"
        call: windows-main-service.open
        input:
          context: "= input.launched_from_cli ? 'cli' : 'desktop'"
          folder_uris: "= input.args.paths.filter(p, !p.endsWith('.ts') && !p.endsWith('.md') && !p.endsWith('.json'))"
          file_uris: "= input.args.paths.filter(p, p.endsWith('.ts') || p.endsWith('.md') || p.endsWith('.json'))"
          force_new_window: "= input.args.new_window"
          diff_mode: "= input.args.diff"
          no_recent_entry: "= input.args.skip_add_to_recently_opened"
          initial_startup: true
        fill: true
        as: opened
      - return: "= vars.opened.value"

  - component: code-application
    name: handle-protocol-url
    kind: function
    summary: "CodeApplication.handleProtocolUrl: open file/folder/workspace links as windows (after a confirmation), windowId=_blank in a new empty window, else hand to the URL service."
    sources: ["src/vs/code/electron-main/app.ts:1073-1194", "src/vs/code/electron-main/app.ts:843-858"]
    request:
      type: object
      properties:
        uri: {type: string, examples: ["code-oss://file/work/app/src/main.ts"]}
    response: {type: object, properties: {handled: {type: boolean}, blocked: {type: boolean}, windows: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.blank: "= input.uri.contains('windowId=_blank')"
          vars.path: "= input.uri.startsWith('code-oss://file/') ? 'file:///' + input.uri.substring(16).split('?')[0] : ''"
      - if: "vars.path != '' && vars.path != 'file:///'"
        then:
          - title: Link maps to a local file/folder; ask before opening unless disabled
            source: "src/vs/code/electron-main/app.ts:1144-1149"
            call: code-application.should-block-openable
            input: {uri: "= vars.path"}
            as: block
          - if: "vars.block.value.blocked"
            then:
              - title: Blocked links behave as handled
                source: "src/vs/code/electron-main/app.ts:1146-1149"
                return: {handled: true, blocked: true, windows: []}
          - title: Open the link target as a window (LINK context)
            source: "src/vs/code/electron-main/app.ts:1150-1169"
            call: windows-main-service.open
            input: {context: link, file_uris: "= vars.path.contains('.') ? [vars.path] : []", folder_uris: "= vars.path.contains('.') ? [] : [vars.path]", force_new_window: "= vars.blank"}
            fill: true
            as: opened
          - set: {state.protocol_urls_opened: "= state.protocol_urls_opened + [input.uri]"}
          - return: {handled: true, blocked: false, windows: "= vars.opened.value.windows"}
      - if: "vars.blank"
        then:
          - title: windowId=_blank opens a new empty window and passes the URL to it
            source: "src/vs/code/electron-main/app.ts:1174-1189"
            call: windows-main-service.open
            input: {context: link, force_new_window: true, force_empty: true, folder_uris: [], file_uris: []}
            fill: true
            as: empty
          - set: {state.protocol_urls_opened: "= state.protocol_urls_opened + [input.uri]"}
          - return: {handled: true, blocked: false, windows: "= vars.empty.value.windows"}
      - title: Not handled here; other URL handlers (extensions, auth) get it
        source: "src/vs/code/electron-main/app.ts:1191-1193"
        return: {handled: false, blocked: false, windows: []}

  - component: code-application
    name: should-block-openable
    kind: function
    summary: "CodeApplication.shouldBlockOpenable: confirm before a protocol link opens a local path."
    sources: ["src/vs/code/electron-main/app.ts:950-1012"]
    request: {type: object, properties: {uri: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {blocked: {type: boolean}}}
    behavior:
      - if: "config['security-prompt-for-local-file-protocol-handling'] == false"
        then:
          - title: Prompt disabled by security.promptForLocalFileProtocolHandling
            source: "src/vs/code/electron-main/app.ts:980-983"
            return: {blocked: false}
      - call: dialog-main-service.show-message-box
        input: {message: "= 'An external application wants to open ' + input.uri", buttons: ["Yes", "No"], checkbox: true}
        as: answer
      - if: "vars.answer.value.response != 0"
        then:
          - title: Blocked by user choice
            source: "src/vs/code/electron-main/app.ts:997-999"
            return: {blocked: true}
      - title: Allowed; a checked 'do not ask again' disables the prompt from the focused window
        source: "src/vs/code/electron-main/app.ts:1001-1011"
        return: {blocked: false}

  - component: launch-main-service
    name: start
    kind: ipc
    summary: "LaunchMainService.start: open protocol URLs from --open-url, or open windows for the second instance's args."
    sources: ["src/vs/platform/launch/electron-main/launchMainService.ts:50-91", "src/vs/platform/launch/electron-main/launchMainService.ts:112-231"]
    attributes: {channel: launch}
    request:
      type: object
      properties:
        args: {$ref: MainProcessCliArgs}
        launched_from_cli: {type: boolean, default: true}
    response: {type: object, properties: {windows: {type: array, items: {type: string}}, wait_window: {type: string}}}
    behavior:
      - if: "size(input.args.open_url) > 0"
        then:
          - title: --open-url hands each URL to the protocol handler
            source: "src/vs/platform/launch/electron-main/launchMainService.ts:67-85"
            foreach: "= input.args.open_url"
            as: url
            steps:
              - call: code-application.handle-protocol-url
                input: {uri: "= vars.url"}
          - return: {windows: [], wait_window: ""}
      - set: {vars.context: "= input.launched_from_cli ? 'cli' : 'desktop'"}
      - if: "size(input.args.paths) == 0"
        then:
          - call: windows-main-service.get-last-active
            input: {}
            as: last
          - set:
              vars.new_window: "= input.args.new_window || input.args.profile != '' ? true : (input.args.reuse_window ? false : config['window-open-without-arguments-in-new-window'] != 'off')"
          - if: "vars.new_window || vars.last.value.window_id == ''"
            then:
              - title: No paths, open a new empty window (openWithoutArgumentsInNewWindow or --new-window)
                source: "src/vs/platform/launch/electron-main/launchMainService.ts:152-188"
                call: windows-main-service.open
                input: {context: "= vars.context", force_new_window: "= vars.new_window", force_empty: true, folder_uris: [], file_uris: []}
                fill: true
                as: empty
              - return: {windows: "= vars.empty.value.windows", wait_window: ""}
          - title: No paths, focus the last active window
            source: "src/vs/platform/launch/electron-main/launchMainService.ts:191-197"
            call: windows-main-service.focus
            input: {window_id: "= vars.last.value.window_id"}
          - return: {windows: ["= vars.last.value.window_id"], wait_window: ""}
      - title: Paths given, open them (prefer a new window unless --reuse-window or --wait)
        source: "src/vs/platform/launch/electron-main/launchMainService.ts:207-220"
        call: windows-main-service.open
        input:
          context: "= vars.context"
          folder_uris: "= input.args.paths.filter(p, !p.endsWith('.ts') && !p.endsWith('.md') && !p.endsWith('.json'))"
          file_uris: "= input.args.paths.filter(p, p.endsWith('.ts') || p.endsWith('.md') || p.endsWith('.json'))"
          force_new_window: "= input.args.new_window"
          prefer_new_window: "= !input.args.reuse_window && !input.args.wait"
          force_reuse_window: "= input.args.reuse_window"
          add_mode: "= input.args.add"
          diff_mode: "= input.args.diff"
          no_recent_entry: "= input.args.skip_add_to_recently_opened"
          wait_marker_file: "= input.args.wait ? '/tmp/vscode-wait-marker' : ''"
        fill: true
        as: opened
      - title: With --wait, resolve when the single used window closes or the marker file is deleted
        source: "src/vs/platform/launch/electron-main/launchMainService.ts:225-230"
        return: {windows: "= vars.opened.value.windows", wait_window: "= input.args.wait && size(vars.opened.value.windows) == 1 ? vars.opened.value.windows[0] : ''"}

  # ================================================================ windows
  - component: windows-main-service
    name: open
    kind: function
    summary: "WindowsMainService.open/doOpen: resolve paths, restore hot-exit empty windows on startup, reuse or create windows, record recents, handle --wait."
    sources: ["src/vs/platform/windows/electron-main/windowsMainService.ts:337-499", "src/vs/platform/windows/electron-main/windowsMainService.ts:541-727"]
    request: MainProcessOpenConfig
    response: MainProcessOpenResult
    behavior:
      - set:
          vars.has_last: "= state.last_active != '' && state.last_active in state.windows && state.windows[state.last_active].open"
          vars.folders: "= input.folder_uris"
          vars.files: "= input.file_uris"
          vars.cmdline: "= size(input.folder_uris) > 0 || size(input.file_uris) > 0"
          vars.empty: false
          vars.restoring: false
          vars.workspace: ""
          vars.used: []
          vars.files_in: ""
          vars.vetoed: false
          vars.empty_to_restore: []
      - title: addMode/removeMode only with an active window and not on startup
        source: "src/vs/platform/windows/electron-main/windowsMainService.ts:340-344"
        set: {vars.add_mode: "= input.add_mode && !input.initial_startup && vars.has_last"}
      - if: "!vars.cmdline && input.force_empty"
        then:
          - title: forceEmpty opens an empty window
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:837-840"
            set: {vars.empty: true}
      - if: "!vars.cmdline && !input.force_empty"
        then:
          - title: No paths given, take the windows of the last session
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:852-860"
            call: windows-main-service.get-paths-from-last-session
            input: {}
            as: last
          - set: {vars.folders: "= vars.last.value.folders", vars.empty: "= size(vars.last.value.folders) == 0", vars.restoring: true}
      - if: "vars.cmdline && !vars.add_mode && size(vars.folders) > 1"
        then:
          - title: Several folders from the command line or API become one untitled workspace
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:862-885"
            call: workspaces-management-main-service.create-untitled-workspace
            input: {folders: "= vars.folders"}
            as: ws
          - set: {vars.workspace: "= vars.ws.value.workspace_id", vars.folders: []}
      - if: "input.initial_startup && !vars.restoring && config['window-restore-windows'] == 'preserve'"
        then:
          - title: restoreWindows=preserve also reopens the last session's windows
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:887-895"
            call: windows-main-service.get-paths-from-last-session
            input: {}
            as: preserved
          - set: {vars.folders: "= vars.preserved.value.folders.filter(f, !(f in vars.folders)) + vars.folders"}
      - set: {vars.recent_folders: "= vars.folders", vars.recent_files: "= vars.files"}
      - if: "input.initial_startup"
        then:
          - title: Untitled workspaces and empty windows with hot-exit backups are always restored on startup
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:407-418"
            call: backup-main-service.get-empty-window-backups
            input: {}
            as: backups
          - set: {vars.empty_to_restore: "= vars.backups.value.backup_folders"}
      - title: Settings decide whether folders and files open in a new window (shouldOpenNewWindow, non-macOS)
        source: "src/vs/platform/windows/electron-main/windowsMainService.ts:1363-1403"
        set:
          vars.folder_new: "= (!input.force_new_window && !input.force_reuse_window && config['window-open-folders-in-new-window'] in ['on', 'off']) ? config['window-open-folders-in-new-window'] == 'on' : ((input.prefer_new_window || input.force_new_window) && !input.force_reuse_window)"
          vars.files_new: "= (input.force_new_window || input.force_reuse_window) ? (input.force_new_window && !input.force_reuse_window) : (config['window-open-files-in-new-window'] in ['on', 'off'] ? config['window-open-files-in-new-window'] == 'on' : (!(input.context in ['dialog', 'menu']) && input.term_program != 'vscode'))"
      - if: "vars.add_mode && size(vars.folders) > 0"
        then:
          - title: --add sends the folders to the last active window
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:568-575"
            call: native-window.on-add-remove-folders
            on: "= state.last_active"
            input: {folders_to_add: "= vars.folders"}
          - set: {vars.used: "= [state.last_active]", vars.folders: []}
      - if: "size(vars.files) > 0 && size(vars.folders) == 0 && vars.workspace == '' && size(vars.empty_to_restore) == 0"
        then:
          - title: Files only, find the window that has their folder, else the last active one
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:577-602"
            set:
              vars.file_window: "= vars.files_new ? '' : (state.windows.filter(k, state.windows[k].open && state.windows[k].workspace != '' && vars.files[0].startsWith(state.windows[k].workspace + '/')) + (vars.has_last ? [state.last_active] : []) + [''])[0]"
          - if: "vars.file_window != ''"
            then:
              - call: windows-main-service.open-files-in-existing-window
                input: {window_id: "= vars.file_window", files: "= vars.files", wait_marker_file: "= input.wait_marker_file"}
              - set: {vars.used: "= vars.used + [vars.file_window]", vars.files_in: "= vars.file_window", vars.files: []}
            else:
              - title: No suitable window, open the files in a new empty window
                source: "src/vs/platform/windows/electron-main/windowsMainService.ts:623-636"
                call: windows-main-service.open-in-browser-window
                input: {workspace: "", force_new_window: true, files: "= vars.files", force_new_tabbed_window: "= input.force_new_tabbed_window", empty_backup: "", context_window_id: ""}
                as: nw
              - set: {vars.used: "= vars.used + [vars.nw.value.window_id]", vars.files_in: "= vars.nw.value.window_id", vars.files: []}
      - if: "vars.workspace != ''"
        then:
          - title: Open the untitled workspace
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:639-669"
            call: windows-main-service.open-in-browser-window
            input: {workspace: "= vars.workspace", force_new_window: "= vars.folder_new", files: "= vars.files", force_new_tabbed_window: false, empty_backup: "", context_window_id: "= input.context_window_id"}
            as: wsw
          - set: {vars.used: "= vars.used + [vars.wsw.value.window_id]", vars.vetoed: "= vars.vetoed || vars.wsw.value.vetoed", vars.files: [], vars.folder_new: true}
      - foreach: "= vars.folders"
        as: folder
        max: 20
        steps:
          - set: {vars.existing: "= state.windows.filter(k, state.windows[k].open && state.windows[k].workspace == vars.folder)"}
          - if: "size(vars.existing) > 0"
            then:
              - title: Folder already open in a window, focus it (and open the files there)
                source: "src/vs/platform/windows/electron-main/windowsMainService.ts:675-685"
                call: windows-main-service.open-files-in-existing-window
                input: {window_id: "= vars.existing[0]", files: "= vars.files", wait_marker_file: "= input.wait_marker_file"}
              - set: {vars.used: "= vars.used + [vars.existing[0]]", vars.files_in: "= size(vars.files) > 0 ? vars.existing[0] : vars.files_in", vars.files: [], vars.folder_new: true}
            else:
              - title: Open the folder in a new or the reused window
                source: "src/vs/platform/windows/electron-main/windowsMainService.ts:687-700"
                call: windows-main-service.open-in-browser-window
                input: {workspace: "= vars.folder", force_new_window: "= vars.folder_new", files: "= vars.files", force_new_tabbed_window: "= input.force_new_tabbed_window", empty_backup: "", context_window_id: "= input.context_window_id"}
                as: fw
              - set: {vars.used: "= vars.used + [vars.fw.value.window_id]", vars.vetoed: "= vars.vetoed || vars.fw.value.vetoed", vars.files_in: "= size(vars.files) > 0 ? vars.fw.value.window_id : vars.files_in", vars.files: [], vars.folder_new: true}
      - foreach: "= vars.empty_to_restore"
        as: backup
        max: 20
        steps:
          - title: Restore an empty window that had unsaved (hot exit) backups
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:703-714"
            call: windows-main-service.open-in-browser-window
            input: {workspace: "", force_new_window: true, files: [], force_new_tabbed_window: false, empty_backup: "= vars.backup", context_window_id: ""}
            as: ew
          - set: {vars.used: "= vars.used + [vars.ew.value.window_id]", vars.folder_new: true}
      - if: "size(vars.files) > 0 || (vars.empty && (input.force_empty || size(vars.used) == 0))"
        then:
          - title: Finally an empty window (forced, still files to open, or nothing opened yet)
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:716-724"
            call: windows-main-service.open-in-browser-window
            input: {workspace: "", force_new_window: "= vars.folder_new", files: "= vars.files", force_new_tabbed_window: "= input.force_new_tabbed_window", empty_backup: "", context_window_id: "= input.context_window_id"}
            as: last_empty
          - set: {vars.used: "= vars.used + [vars.last_empty.value.window_id]", vars.vetoed: "= vars.vetoed || vars.last_empty.value.vetoed", vars.files_in: "= size(vars.files) > 0 ? vars.last_empty.value.window_id : vars.files_in"}
      - if: "size(vars.used) > 1"
        then:
          - title: Several windows used, focus the one files opened in, else the last one
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:425-471"
            call: windows-main-service.focus
            input: {window_id: "= vars.files_in != '' ? vars.files_in : vars.used[size(vars.used) - 1]"}
      - if: "!input.no_recent_entry && !input.diff_mode && (size(vars.recent_folders) > 0 || size(vars.recent_files) > 0)"
        then:
          - title: Remember the opened folders and files in the recently opened list
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:473-490"
            call: workspaces-history-main-service.add-recently-opened
            input: {workspaces: "= vars.recent_folders", files: "= vars.recent_files"}
      - title: --wait from the CLI waits on the single used window
        source: "src/vs/platform/windows/electron-main/windowsMainService.ts:501-518"
        return:
          windows: "= vars.used"
          files_opened_in: "= vars.files_in"
          wait_window: "= input.context == 'cli' && input.wait_marker_file != '' && size(vars.used) == 1 ? vars.used[0] : ''"
          vetoed: "= vars.vetoed"

  - component: windows-main-service
    name: open-in-browser-window
    kind: function
    summary: "WindowsMainService.openInBrowserWindow: reuse the context or last active window unless a new one is forced; a loaded window is unloaded first and a veto keeps it."
    sources: ["src/vs/platform/windows/electron-main/windowsMainService.ts:1512-1689"]
    request:
      type: object
      properties:
        workspace: {type: string, examples: ["file:///work/app"]}
        force_new_window: {type: boolean}
        force_new_tabbed_window: {type: boolean}
        files: {type: array, items: {type: string}}
        empty_backup: {type: string}
        context_window_id: {type: string}
    response: {type: object, properties: {window_id: {type: string}, created: {type: boolean}, vetoed: {type: boolean}}}
    behavior:
      - set:
          vars.has_last: "= state.last_active != '' && state.last_active in state.windows && state.windows[state.last_active].open"
      - set:
          vars.reuse: "= (input.force_new_window || input.force_new_tabbed_window) ? '' : ((input.context_window_id != '' && input.context_window_id in state.windows && state.windows[input.context_window_id].open) ? input.context_window_id : (vars.has_last ? state.last_active : ''))"
      - if: "vars.reuse == ''"
        then:
          - set: {vars.id: "= 'w' + string(state.next_window)"}
          - title: Create a new CodeWindow, add it to the window list and register it with the lifecycle
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:1602-1648"
            set:
              state.windows: "= merge(state.windows, {vars.id: {'open': true, 'workspace': input.workspace, 'extension_development_host': false, 'files': input.files}})"
              state.next_window: "= state.next_window + 1"
              state.last_active: "= vars.id"
          - call: code-window.create
            input: {window_id: "= vars.id", workspace: "= input.workspace"}
          - call: windows-main-service.do-open-in-browser-window
            input: {window_id: "= vars.id", workspace: "= input.workspace", files: "= input.files", empty_backup: "= input.empty_backup"}
          - return: {window_id: "= vars.id", created: true, vetoed: false}
