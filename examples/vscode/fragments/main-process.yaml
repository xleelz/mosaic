interfaces:
  # ================================================================ startup
  - component: code-main
    name: startup
    kind: function
    summary: "CodeMain.main/startup: create and init main services, claim the instance, then start CodeApplication."
    sources: ["src/main.ts:8-10", "src/vs/code/electron-main/main.ts:737-739", "src/vs/code/electron-main/main.ts:103-162"]
    request:
      type: object
      properties:
        args: {$ref: MainProcessCliArgs}
        launched_from_cli: {type: boolean, default: false}
    response: {type: object, properties: {forwarded: {type: boolean}, exit_code: {type: integer}, windows: {type: array, items: {type: string}}}}
    errors:
      - {code: eacces, status: 0, retryable: false, summary: "user data / extensions directory not writable (dialog, then exit 1)"}
      - {code: inno-setup-active, status: 0, retryable: false}
      - {code: econnrefused, status: 0, retryable: false}
    behavior:
      - title: Create and initialize main services
        detail: "Environment, logger, files, state, configuration, policies, lifecycle; mkdir of user data paths, StateService.init, ConfigurationService.initialize."
        source: "src/vs/code/electron-main/main.ts:110-120"
        if: "!state.user_data_writable"
        then:
          - title: Startup data dir error dialog
            detail: "EACCES/EPERM shows 'Unable to write program user data.' and rethrows; quit() kills with exit code 1."
            source: "src/vs/code/electron-main/main.ts:495-505"
            call: lifecycle-main-service.kill
            input: {code: 1}
          - set: {state.exit: eacces}
          - fail: {code: eacces, message: "Unable to write program user data."}
      - call: code-main.claim-instance
        input: {args: "= input.args", retry: true}
        as: claim
        on_error:
          - title: Unexpected startup error quits with exit code 1
            source: "src/vs/code/electron-main/main.ts:158-161"
            call: lifecycle-main-service.kill
            input: {code: 1}
          - set: {state.exit: "= error.code"}
          - fail: "= error"
      - if: "vars.claim.value.terminated"
        then:
          - title: ExpectedError terminates this (second) process quietly with exit code 0
            detail: "quit() calls kill(0) on the terminating process's own lifecycle service; the running instance is untouched, so it is not modeled as a call."
            source: "src/vs/code/electron-main/main.ts:535-557"
            set: {state.exit: expected}
          - return: {forwarded: "= vars.claim.value.forwarded", exit_code: 0, windows: []}
      - title: Write the main lockfile and start CodeApplication
        source: "src/vs/code/electron-main/main.ts:141-157"
        set: {state.running: true}
      - call: code-application.startup
        input: {args: "= input.args", launched_from_cli: "= input.launched_from_cli"}
        as: app
      - return: {forwarded: false, exit_code: 0, windows: "= vars.app.value.windows"}

  - component: code-main
    name: claim-instance
    kind: function
    summary: "CodeMain.claimInstance: be the first instance (own the main IPC handle) or forward argv/env to the running one."
    sources: ["src/vs/code/electron-main/main.ts:352-493"]
    request:
      type: object
      properties:
        args: {$ref: MainProcessCliArgs}
        retry: {type: boolean, default: true}
    response: {type: object, properties: {forwarded: {type: boolean}, terminated: {type: boolean}}}
    errors:
      - {code: inno-setup-active, status: 0, retryable: false}
      - {code: econnrefused, status: 0, retryable: false}
    behavior:
      - if: "!state.ipc_handle_in_use"
        then:
          - title: nodeIPCServe succeeded, this is the first instance
            source: "src/vs/code/electron-main/main.ts:358-361"
            if: "state.inno_setup_active"
            then:
              - title: Windows installer holds the update mutex
                source: "src/vs/code/electron-main/main.ts:364-370"
                fail: {code: inno-setup-active, message: "Code - OSS is currently being updated. Please wait for the update to complete before launching."}
          - if: "input.args.status"
            then:
              - title: --status without a running instance prints a warning and terminates
                source: "src/vs/code/electron-main/main.ts:481-486"
                return: {forwarded: false, terminated: true}
          - set: {state.ipc_handle_in_use: true}
          - return: {forwarded: false, terminated: false}
      - if: "state.stale_handle"
        then:
          - if: "!input.retry"
            then:
              - title: Connection refused again, give up
                source: "src/vs/code/electron-main/main.ts:396-406"
                fail: {code: econnrefused, message: "connect ECONNREFUSED"}
          - title: Stale handle left behind (Linux/macOS), unlink and retry once
            source: "src/vs/code/electron-main/main.ts:408-419"
            set: {state.stale_handle: false, state.ipc_handle_in_use: false}
          - call: code-main.claim-instance
            input: {args: "= input.args", retry: false}
            as: again
          - return: "= vars.again.value"
      - if: "input.args.status"
        then:
          - title: --status asks the running instance for diagnostics, prints them and terminates
            source: "src/vs/code/electron-main/main.ts:448-459"
            return: {forwarded: true, terminated: true}
      - title: Send argv and env to the running instance over the 'launch' channel
        detail: "A warning dialog is armed for 10 s unless --wait or --status (second-instance-warning-timeout-ms)."
        source: "src/vs/code/electron-main/main.ts:466-478"
        call: launch-main-service.start
        input: {args: "= input.args", launched_from_cli: true}
      - return: {forwarded: true, terminated: true}

  - component: code-application
    name: startup
    kind: function
    summary: "CodeApplication.startup: shared process, services, channels, protocol handlers, phase Ready, first window, AfterWindowOpen, Eventually."
    sources: ["src/vs/code/electron-main/app.ts:698-841"]
    request:
      type: object
      properties:
        args: {$ref: MainProcessCliArgs}
        launched_from_cli: {type: boolean, default: false}
    response: {type: object, properties: {windows: {type: array, items: {type: string}}}}
    behavior:
      - title: Set up the shared process; it spawns when the first window asks for a connection
        source: "src/vs/code/electron-main/app.ts:749-750"
      - call: code-application.init-services
        input: {}
      - call: code-application.init-channels
        input: {}
      - title: Phase Ready before opening the first window
        source: "src/vs/code/electron-main/app.ts:792-793"
        call: lifecycle-main-service.set-phase
        input: {phase: 2}
      - call: code-application.open-first-window
        input: {args: "= input.args", launched_from_cli: "= input.launched_from_cli"}
        as: opened
      - title: Phase AfterWindowOpen; the update service initializes when it is reached
        source: "src/vs/code/electron-main/app.ts:800-804"
        call: lifecycle-main-service.set-phase
        input: {phase: 3}
      - title: AbstractUpdateService waits for AfterWindowOpen, then initialize()
        source: "src/vs/platform/update/electron-main/abstractUpdateService.ts:177-178"
        emit: linux-update-service.initialize
        input: {}
      - title: Phase Eventually after 2.5 s and idle
        source: "src/vs/code/electron-main/app.ts:817-832"
        emit: lifecycle-main-service.set-phase
        input: {phase: 4}
        after_ms: "= config['eventually-phase-delay-ms']"
      - return: {windows: "= vars.opened.value.windows"}

  - component: code-application
    name: init-services
    kind: function
    summary: "CodeApplication.initServices: register the platform-specific update service and all main-process services, then initialize backups and workspaces."
    sources: ["src/vs/code/electron-main/app.ts:1220-1374"]
    request: {type: object}
    response: {type: object, properties: {services: {type: integer}}}
    behavior:
      - title: Update service chosen by platform (Win32 / Snap / Linux / Darwin)
        source: "src/vs/code/electron-main/app.ts:1224-1240"
      - title: Backups and workspaces management initialize before any window opens
        source: "src/vs/code/electron-main/app.ts:1368-1371"
        call: backup-main-service.initialize
        input: {}
      - return: {services: 40}

  - component: code-application
    name: init-channels
    kind: function
    summary: "CodeApplication.initChannels: expose main services on the node IPC server (second instances) and the Electron IPC server (windows, shared process)."
    sources:
      - "src/vs/code/electron-main/app.ts:1376-1385"
      - "src/vs/code/electron-main/app.ts:1386"
      - "src/vs/code/electron-main/app.ts:1389"
      - "src/vs/code/electron-main/app.ts:1393"
      - "src/vs/code/electron-main/app.ts:1397"
      - "src/vs/code/electron-main/app.ts:1400"
      - "src/vs/code/electron-main/app.ts:1406"
      - "src/vs/code/electron-main/app.ts:1411"
      - "src/vs/code/electron-main/app.ts:1417"
      - "src/vs/code/electron-main/app.ts:1424"
      - "src/vs/code/electron-main/app.ts:1429"
      - "src/vs/code/electron-main/app.ts:1433"
      - "src/vs/code/electron-main/app.ts:1437"
      - "src/vs/code/electron-main/app.ts:1442"
      - "src/vs/code/electron-main/app.ts:1447"
      - "src/vs/code/electron-main/app.ts:1451"
