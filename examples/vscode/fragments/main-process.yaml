            return: {veto: false}
      - set: {vars.reason: "= state.quit_requested ? 'quit' : input.reason"}
      - title: Send vscode:onBeforeUnload with one-time ok/cancel reply channels to the window
        source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:580-605"
        call: lifecycle-service.on-before-shutdown
        on: "= input.window_id"
        input: {reason: "= vars.reason", window_id: "= input.window_id"}
        as: before
      - choice: renderer_reply
        default: "= has(vars.before.value.veto) && vars.before.value.veto == true ? 'cancel' : 'ok'"
        options:
          cancel:
            - title: Renderer replied on the cancel channel, veto; a pending quit resolves vetoed
              source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:546-570"
              set: {state.quit_requested: false, state.will_restart: false, state.vetoes: "= (has(state.vetoes) ? state.vetoes : 0) + 1"}
            - return: {veto: true}
          ok:
            - title: Renderer replied ok, no veto
              source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:592-594"
      - title: Then vscode:onWillUnload and wait for the reply
        source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:552-555"
        call: lifecycle-service.on-will-shutdown
        on: "= input.window_id"
        input: {reason: "= vars.reason", window_id: "= input.window_id"}
      - return: {veto: false}

  - component: lifecycle-main-service
    name: on-window-close-request
    kind: event
    summary: "The window 'close' listener registered by registerWindow: prevent, unload with reason CLOSE, and close for real unless vetoed."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:421-459"]
    request: {type: object, properties: {window_id: {type: string, examples: [w1]}}}
    response: {type: object, properties: {closed: {type: boolean}}}
    behavior:
      - call: lifecycle-main-service.unload
        input: {window_id: "= input.window_id", reason: close}
        as: unload
      - if: "vars.unload.value.veto"
        then:
          - title: Vetoed, the window stays open
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:444-448"
            return: {closed: false}
      - call: windows-main-service.get-windows
        input: {}
        as: wins
      - title: onBeforeCloseWindow, then window.close() for real
        source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:450-457"
        publish: lifecycle-main-service.on-before-close-window
        delivery: sync
        input:
          window_id: "= input.window_id"
          workspace: "= vars.wins.value.windows.filter(w, w.id == input.window_id).map(w, w.workspace).size() > 0 ? vars.wins.value.windows.filter(w, w.id == input.window_id).map(w, w.workspace)[0] : ''"
          quit_requested: "= state.quit_requested"
          window_count: "= vars.wins.value.count"
      - call: lifecycle-main-service.on-window-closed
        input: {window_id: "= input.window_id"}
      - return: {closed: true}

  - component: lifecycle-main-service
    name: on-window-closed
    kind: event
    summary: "The window 'closed' listener plus app 'window-all-closed': count down windows; on Windows/Linux the last window quits the app."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:460-475", "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:303-312"]
    request: {type: object, properties: {window_id: {type: string, examples: [w1]}}}
    response: {type: object, properties: {remaining: {type: integer}}}
    behavior:
      - call: windows-main-service.on-window-closed
        input: {window_id: "= input.window_id"}
        as: closed
      - if: "vars.closed.value.count == 0"
        then:
          - title: window-all-closed quits on Windows/Linux (macOS keeps running unless quit was requested)
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:303-310"
            call: lifecycle-main-service.before-quit
            input: {}
          - title: Last window closed, fire onWillShutdown and quit
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:472-474"
            call: lifecycle-main-service.fire-on-will-shutdown
            input: {reason: quit}
          - set: {state.exited: true, state.exit_code: 0}
      - return: {remaining: "= vars.closed.value.count"}

  - component: lifecycle-main-service
    name: before-quit
    kind: event
    summary: "app 'before-quit': quitRequested = true and onBeforeShutdown (once)."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:279-298"]
    request: {type: object}
    response: {type: object, properties: {fired: {type: boolean}}}
    behavior:
      - if: "state.quit_requested"
        then: [{return: {fired: false}}]
      - set: {state.quit_requested: true}
      - title: onBeforeShutdown fires synchronously (windows state is saved)
        source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:285-289"
        publish: lifecycle-main-service.on-before-shutdown
        delivery: sync
        input: {}
      - return: {fired: true}

  - component: lifecycle-main-service
    name: fire-on-will-shutdown
    kind: function
    summary: "LifecycleMainService.fireOnWillShutdown: once per run, onWillShutdown with join(), then close the state service."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:346-385"]
    request: {type: object, properties: {reason: {type: string, enum: [quit, kill], default: quit}}}
    response: {type: object, properties: {reason: {type: string}}}
    behavior:
      - if: "state.shutdown_reason != ''"
        then:
          - title: Shutdown already running, return the pending promise
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:347-349"
            return: {reason: "= state.shutdown_reason"}
      - set: {state.shutdown_reason: "= input.reason"}
      - title: onWillShutdown; joiners (lockfile, IPC server, storage) are awaited, then StateService.close
        source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:356-382"
        publish: lifecycle-main-service.on-will-shutdown
        delivery: sync
        input: {reason: "= input.reason"}
      - return: {reason: "= input.reason"}

  - component: lifecycle-main-service
    name: quit
    kind: function
    summary: "LifecycleMainService.quit: app.quit() closes every window through unload; any veto resolves the quit as vetoed."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:618-667", "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:316-343"]
    request: {type: object, properties: {will_restart: {type: boolean, default: false}}}
    response: {type: object, properties: {veto: {type: boolean}}}
    behavior:
      - if: "state.quit_requested && state.shutdown_reason == ''"
        then:
          - title: A quit is already pending, return its promise
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:644-648"
            return: {veto: false}
      - if: "input.will_restart"
        then:
          - title: Remember lifecycle.quitAndRestart for the next start
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:651-653"
            set: {state.will_restart: true}
      - call: lifecycle-main-service.before-quit
        input: {}
      - call: windows-main-service.get-windows
        input: {}
        as: wins
      - title: Electron asks every window to close; each runs the unload handshake
        source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:432-459"
        parallel: "= vars.wins.value.windows.map(w, w.id)"
        as: wid
        steps:
          - call: lifecycle-main-service.on-window-close-request
            input: {window_id: "= vars.wid"}
            as: c
          - return: "= vars.c.value"
        join: {need: all}
        as_result: closes
      - set: {vars.vetoed: "= vars.closes.results.exists(r, r.ok && !r.value.closed)"}
      - if: "vars.vetoed"
        then:
          - title: A window vetoed; the pending quit resolves with veto and quitRequested is reset
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:558-570"
            return: {veto: true}
      - if: "size(vars.wins.value.windows) == 0"
        then:
          - title: No window to close, will-quit fires onWillShutdown directly
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:316-341"
            call: lifecycle-main-service.fire-on-will-shutdown
            input: {reason: quit}
          - set: {state.exited: true, state.exit_code: 0}
      - return: {veto: false}

  - component: lifecycle-main-service
    name: reload
    kind: function
    summary: "LifecycleMainService.reload: unload with reason RELOAD and reload the window unless vetoed."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:508-515"]
    request: {type: object, properties: {window_id: {type: string, examples: [w1]}, disable_extensions: {type: boolean, default: false}}}
    response: {type: object, properties: {reloaded: {type: boolean}}}
    behavior:
      - call: lifecycle-main-service.unload
        input: {window_id: "= input.window_id", reason: reload}
        as: unload
      - if: "vars.unload.value.veto"
        then:
          - title: Reload vetoed by the renderer
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:511-514"
            return: {reloaded: false}
      - call: code-window.reload
        input: {window_id: "= input.window_id", disable_extensions: "= input.disable_extensions"}
      - return: {reloaded: true}

  - component: lifecycle-main-service
    name: relaunch
    kind: function
    summary: "LifecycleMainService.relaunch: quit with willRestart and app.relaunch() on 'quit' unless vetoed."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:681-712"]
    request: {type: object, properties: {add_args: {type: array, items: {type: string}, default: []}}}
    response: {type: object, properties: {relaunched: {type: boolean}}}
    behavior:
      - call: lifecycle-main-service.quit
        input: {will_restart: true}
        as: q
      - if: "vars.q.value.veto"
        then:
          - title: Vetoed, the quit listener is removed and nothing relaunches
            source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:708-711"
            return: {relaunched: false}
      - set: {state.relaunch_args: "= input.add_args"}
      - return: {relaunched: true}

  - component: lifecycle-main-service
    name: kill
    kind: function
    summary: "LifecycleMainService.kill: onWillShutdown(KILL), destroy windows (at most 1 s), app.exit(code)."
    sources: ["src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:714-756"]
    request: {type: object, properties: {code: {type: integer, default: 0}}}
    response: {type: object, properties: {exit_code: {type: integer}}}
    behavior:
      - call: lifecycle-main-service.fire-on-will-shutdown
        input: {reason: kill}
      - title: Race window destruction against the kill timeout, then app.exit
        source: "src/vs/platform/lifecycle/electron-main/lifecycleMainService.ts:728-755"
        wait: 1
      - set: {state.exited: true, state.exit_code: "= input.code"}
      - return: {exit_code: "= input.code"}

