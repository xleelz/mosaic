  # ================================================================ node CLI
  - component: node-cli
    name: main
    kind: function
    summary: "cli.ts main(argv): tunnel passthrough, help, version, extension management in cliProcessMain, --file-write, else spawn Electron (waiting with --wait)."
    sources: ["src/cli.ts:6-26", "src/vs/code/node/cli.ts:44-52", "src/vs/code/node/cli.ts:592-597"]
    request: {type: object, properties: {args: {$ref: MainProcessCliArgs}}}
    response: {type: object, properties: {exit_code: {type: integer}, output: {type: string}, spawned: {type: string}, windows: {type: array, items: {type: string}}, waited_on: {type: string}}}
    errors: [{code: using-file-write-with-invalid-arguments, status: 0, retryable: false}]
    behavior:
      - if: "input.args.subcommand in ['tunnel', 'serve-web', 'agent']"
        then:
          - if: "config['product-tunnel-application-name'] == ''"
            then:
              - title: Subcommand not supported without tunnelApplicationName
                source: "src/vs/code/node/cli.ts:56-59"
                set: {state.stdout: "= state.stdout + ['command not supported']"}
              - return: {exit_code: 0, output: "= '\\'' + input.args.subcommand + '\\' command not supported in code-oss'", spawned: "", windows: [], waited_on: ""}
          - title: Spawn the Rust CLI (code-tunnel) with the remaining arguments and pipe its output
            source: "src/vs/code/node/cli.ts:60-88"
            return: {exit_code: 0, output: "", spawned: "= config['product-tunnel-application-name']", windows: [], waited_on: ""}
      - if: "input.args.help"
        then:
          - title: Print the help message
            source: "src/vs/code/node/cli.ts:93-96"
            set: {state.stdout: "= state.stdout + ['help']"}
          - return: {exit_code: 0, output: help, spawned: "", windows: [], waited_on: ""}
      - if: "input.args.version"
        then:
          - title: Print version and commit
            source: "src/vs/code/node/cli.ts:105-107"
            set: {state.stdout: "= state.stdout + ['version']"}
          - return: {exit_code: 0, output: version, spawned: "", windows: [], waited_on: ""}
      - if: "input.args.list_extensions || size(input.args.install_extension) > 0 || size(input.args.uninstall_extension) > 0"
        then:
          - title: Extension management runs in cliProcessMain, without Electron
            source: "src/vs/code/node/cli.ts:127-145"
            call: cli-main.main
            input: {args: "= input.args"}
            as: cli
            on_error:
              - title: Errors print and exit with code 1
                source: "src/vs/code/node/cli.ts:594-597"
                set: {state.exit_code: 1}
              - fail: "= error"
          - return: {exit_code: 0, output: "= vars.cli.value.output", spawned: "", windows: [], waited_on: ""}
      - if: "input.args.file_write"
        then:
          - title: --file-write needs an existing absolute args file with distinct existing source and target
            source: "src/vs/code/node/cli.ts:148-152"
            set: {state.exit_code: 1}
          - fail: {code: using-file-write-with-invalid-arguments, message: "Using --file-write with invalid arguments."}
      - title: Spawn Electron detached; with --wait create a marker file and wait for its deletion
        source: "src/vs/code/node/cli.ts:336-372"
        call: code-main.startup
        input: {args: "= input.args", launched_from_cli: true}
        as: electron
      - return: {exit_code: 0, output: "", spawned: electron, windows: "= vars.electron.value.windows", waited_on: "= input.args.wait ? 'waitMarkerFilePath' : ''"}

  - component: cli-main
    name: main
    kind: function
    summary: "cliProcessMain main/run/doRun: resolve the profile, then list/install/uninstall extensions."
    sources: ["src/vs/code/node/cliProcessMain.ts:357-365", "src/vs/code/node/cliProcessMain.ts:97-127", "src/vs/code/node/cliProcessMain.ts:306-350"]
    request: {type: object, properties: {args: {$ref: MainProcessCliArgs}}}
    response: {type: object, properties: {output: {type: string}}}
    errors: [{code: profile-not-found, status: 0, retryable: false}]
