    name: Window unresponsive or renderer gone
    tags: [writes]
    sources: ["src/vs/platform/windows/electron-main/windowImpl.ts:985-1126"]
    entry: {caller: main-process, interface: code-window.on-window-error, input: {window_id: w1, type: unresponsive}}
  - id: confirm-before-close
    name: Confirm before closing a window (window.confirmBeforeClose)
    sources: ["src/vs/workbench/electron-browser/window.ts:470-507"]
    entry: {caller: lifecycle-service, interface: native-window.on-before-shutdown, input: {reason: close}}
  - id: dialog-handler-startup
    name: Dialog handler contribution at BlockStartup
    sources: ["src/vs/workbench/electron-browser/parts/dialogs/dialog.contribution.ts:114-118"]
    entry: {caller: workbench, interface: desktop-dialog-handler-contribution.start, input: {pending: []}}
  - id: extension-host-start
    name: Create and start a local extension host process
    tags: [writes]
    sources: ["src/vs/code/electron-main/app.ts:1526-1528"]
