    summary: "NativeWindow.updateDocumentEdited: mirror the working copies' dirty state to the native window when it changes."
    sources: ["src/vs/workbench/electron-browser/window.ts:593-606"]
    request: {type: object, properties: {window_id: {type: string, examples: [w1]}, dirty: {type: boolean, default: true}}}
    response: {type: object, properties: {changed: {type: boolean}}}
    behavior:
      - if: "(has(state.document_edited) ? state.document_edited : false) == input.dirty"
        then: [{return: {changed: false}}]
      - set: {state.document_edited: "= input.dirty"}
      - call: native-host-main-service.set-document-edited
        input: {window_id: "= input.window_id", edited: "= input.dirty"}
      - return: {changed: true}

