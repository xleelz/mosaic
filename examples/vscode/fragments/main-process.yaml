  # ================================================================ agents window (open intent)
  - component: windows-main-service
    name: open-agents-window
    kind: function
    summary: "WindowsMainService.openAgentsWindow: resolve the folder, make sure the agent sessions workspace file exists, open (or reuse) the Agents window on it, then send the open intent."
    sources: ["src/vs/platform/windows/electron-main/windowsMainService.ts:296-310", "src/vs/platform/windows/electron-main/windowsMainService.ts:312-334"]
    request:
      type: object
      properties:
        context: {type: string, enum: [cli, dock, menu, dialog, desktop, api, link], default: api}
        context_window_id: {type: string, default: "", examples: [w1]}
        cli_agents: {type: boolean, default: false}
        cli_folder_uris: {type: array, items: {type: string}, default: []}
        folder_uri: {type: string, default: ""}
        reveal: {type: string, default: "", description: "'' (undefined), 'new', or a session URI"}
        source: {type: string, default: ""}
        folder_uri_is_default: {type: boolean, default: false}
        draft: {type: string, default: ""}
        onboarding_session_resource: {type: string, default: ""}
    response: {type: object, properties: {windows: {type: array, items: {type: string}}, intent_sent: {type: boolean}}}
    behavior:
      - call: windows-main-service.get-windows
        input: {}
        as: before
      - set:
          vars.existing: "= vars.before.value.windows.map(w, w.id)"
          vars.session: "= input.reveal == 'new' ? '' : input.reveal"
      - title: resolveAgentsWindowFolder takes the first CLI folder only for `code --agents` without a folder, session or other source
        source: "src/vs/platform/windows/electron-main/agentsWindow.ts:30-37"
        set:
          vars.folder: "= (input.folder_uri != '' || vars.session != '' || input.context != 'cli' || !input.cli_agents || (input.source != '' && input.source != 'commandLine')) ? input.folder_uri : (size(input.cli_folder_uris) > 0 ? input.cli_folder_uris[0] : '')"
      - call: environment-main-service.agent-sessions-workspace
        input: {}
        as: env
      - set: {vars.ws: "= vars.env.value.uri"}
      - call: file-service.exists
        input: {resource: "= vars.ws"}
        on: w1
        as: exists
      - if: "!vars.exists.value.exists"
        then:
          - title: "ensureAgentsWindow writes an empty workspace file ({folders: []}) the first time"
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:318-323"
            call: file-service.write-file
            input: {resource: "= vars.ws", content: "{\n\t\"folders\": []\n}"}
            on: w1
      - title: Open the agent sessions workspace in a new window (an already open one is reused), with no recent entry
        source: "src/vs/platform/windows/electron-main/windowsMainService.ts:303"
        call: windows-main-service.open
        input:
          context: "= input.context"
          folder_uris: ["= vars.ws"]
          file_uris: []
          force_new_window: true
          force_reuse_window: false
          prefer_new_window: false
          force_empty: false
          force_new_tabbed_window: false
          initial_startup: false
          add_mode: false
          diff_mode: false
          no_recent_entry: true
          wait_marker_file: ""
          context_window_id: "= input.context_window_id"
          term_program: ""
        as: opened
      - set: {vars.windows: "= vars.opened.value.windows", vars.sent: false}
      - if: "size(vars.windows) > 0"
        then:
          - title: sendAgentsWindowOpenIntent to the first window, telling it whether it already existed
            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:305-307"
            call: windows-main-service.send-agents-window-open-intent
            input:
              window_id: "= vars.windows[0]"
              is_existing_window: "= vars.windows[0] in vars.existing"
              context: "= input.context"
              cli_agents: "= input.cli_agents"
              folder_uri: "= vars.folder"
              reveal: "= input.reveal"
              source: "= input.source"
              folder_uri_is_default: "= input.folder_uri_is_default"
              draft: "= input.draft"
              onboarding_session_resource: "= input.onboarding_session_resource"
            as: intent
          - set: {vars.sent: "= vars.intent.value.sent"}
      - return: {windows: "= vars.windows", intent_sent: "= vars.sent"}

  - component: windows-main-service
    name: send-agents-window-open-intent
    kind: function
    summary: "sendAgentsWindowOpenIntent: vscode:selectAgentsFolder with folder, reveal, source, folderUriIsDefault, draft and onboarding session; skipped for a focus-only API open of an existing window."
    sources: ["src/vs/platform/windows/electron-main/agentsWindow.ts:15-28"]
    request:
      type: object
      properties:
        window_id: {type: string, examples: [w2]}
        is_existing_window: {type: boolean}
        context: {type: string, default: api}
        cli_agents: {type: boolean, default: false}
        folder_uri: {type: string, default: ""}
        reveal: {type: string, default: ""}
        source: {type: string, default: ""}
        folder_uri_is_default: {type: boolean, default: false}
        draft: {type: string, default: ""}
        onboarding_session_resource: {type: string, default: ""}
    response: {type: object, properties: {sent: {type: boolean}, source: {type: string}}}
    behavior:
      - if: "input.is_existing_window && input.context == 'api' && input.reveal == ''"
        then:
          - title: A focus-only open must not navigate or cancel a pending reveal in an existing window
            source: "src/vs/platform/windows/electron-main/agentsWindow.ts:16-19"
            return: {sent: false, source: ""}
      - title: Source defaults to commandLine for `code --agents`, else unknown; the draft goes only with reveal 'new' or a link
        source: "src/vs/platform/windows/electron-main/agentsWindow.ts:21-22"
        set:
          vars.source: "= input.source != '' ? input.source : (input.cli_agents ? 'commandLine' : 'unknown')"
          vars.draft: "= (input.reveal == 'new' || input.context == 'link') ? input.draft : ''"
      - title: window.sendWhenReady('vscode:selectAgentsFolder', ...)
        source: "src/vs/platform/windows/electron-main/agentsWindow.ts:23-27"
        call: code-window.send-when-ready
        input:
          window_id: "= input.window_id"
          channel: "vscode:selectAgentsFolder"
          args:
            folder_uri: "= input.folder_uri"
            reveal: "= input.reveal"
            source: "= vars.source"
            folder_uri_is_default: "= input.folder_uri_is_default"
            draft: "= vars.draft"
            onboarding_session_resource: "= input.onboarding_session_resource"
      - return: {sent: true, source: "= vars.source"}

  - component: code-window
    name: send-when-ready
    kind: function
    summary: "CodeWindow.sendWhenReady: send the IPC message now if the window is ready, else queue it until setReady."
    sources: ["src/vs/platform/windows/electron-main/windowImpl.ts:1660-1670"]
    request:
      type: object
      properties:
        window_id: {type: string, examples: [w1]}
        channel: {type: string, examples: ["vscode:selectAgentsFolder"]}
        args: {type: object}
    response: {type: object, properties: {sent: {type: boolean}, queued: {type: boolean}}}
    behavior:
      - if: "!(input.window_id in state.windows)"
        then:
          - title: No such window (destroyed), nothing is sent
            source: "src/vs/platform/windows/electron-main/windowImpl.ts:1672-1677"
            return: {sent: false, queued: false}
      - set:
          vars.w: "= state.windows[input.window_id]"
          vars.msg: {channel: "= input.channel", args: "= input.args"}
      - if: "vars.w.ready"
        then:
          - title: Ready, send now (webContents.send)
            source: "src/vs/platform/windows/electron-main/windowImpl.ts:1661-1662"
            set:
              state.windows: "= merge(state.windows, {input.window_id: {'sent': ('sent' in vars.w ? vars.w.sent : []) + [vars.msg]}})"
          - return: {sent: true, queued: false}
      - title: Not ready yet, send once ready()
        source: "src/vs/platform/windows/electron-main/windowImpl.ts:1663-1668"
        set:
          state.windows: "= merge(state.windows, {input.window_id: {'queued': ('queued' in vars.w ? vars.w.queued : []) + [vars.msg]}})"
      - return: {sent: false, queued: true}

  # ================================================================ onboarding tryout handoff
  - component: onboarding-tryout-handoff
    name: open
    kind: ipc
    summary: "OnboardingTryoutHandoff.open: validate the request, supersede earlier pending ones, open the Agents window, require exactly one window, focus it, send vscode:runOnboardingTryout and wait up to 30 s for complete()."
    sources: ["src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:35-69"]
    attributes: {channel: onboardingTryout}
    request:
      type: object
      required: [window_id, request_id, tryout_id, source]
      properties:
        window_id: {type: string, examples: [w1]}
        request_id: {type: string, examples: ["3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69"]}
        tryout_id: {type: string, examples: [agentsWindow]}
        source: {type: string, enum: [releaseNotes, externalLink, direct], examples: [direct]}
    response: {type: object, properties: {result: {type: string, enum: [accepted, cancelled, rejected, superseded]}}}
    errors:
      - {code: feature-example-request-invalid, status: 0, retryable: false}
      - {code: feature-example-no-agents-window, status: 0, retryable: false}
      - {code: feature-example-accept-timeout, status: 0, retryable: false}
    behavior:
      - if: "!matches(input.request_id, '(?i)^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$') || input.tryout_id == '' || !(input.source in ['releaseNotes', 'externalLink', 'direct'])"
        then:
          - title: requestId must be a UUID, tryoutId a string and source a known one
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:36-38"
            fail: {code: feature-example-request-invalid, message: "The feature example request is invalid."}
      - if: "!matches(input.window_id, '^w[0-9]+$') || input.request_id in state.pending"
        then:
          - title: createPendingRequest refuses a non-integer window id or a duplicate request id
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:92-94"
            fail: {code: feature-example-request-invalid, message: "The feature example request is invalid."}
      - foreach: "= state.pending.filter(k, !state.pending[k].settled)"
        as: previous
        max: 20
        steps:
          - title: A new request supersedes every unsettled earlier one
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:95-99"
            call: onboarding-tryout-handoff.cancel-pending-request
            input: {request_id: "= vars.previous", result: superseded}
      - set:
          state.pending: "= merge(state.pending, {input.request_id: {'source_window': input.window_id, 'destination': '', 'settled': false}})"
      - title: "windowsMainService.openAgentsWindow({context: API, contextWindowId})"
        source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:41-46"
        call: windows-main-service.open-agents-window
        input: {context: api, context_window_id: "= input.window_id", cli_agents: false, cli_folder_uris: [], folder_uri: "", reveal: "", source: "", folder_uri_is_default: false, draft: "", onboarding_session_resource: ""}
        as: opened
      - if: "size(vars.opened.value.windows) != 1"
        then:
          - set: {state.pending: "= omit(state.pending, input.request_id)"}
          - title: Only a single Agents window can receive the example
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:53-55"
            fail: {code: feature-example-no-agents-window, message: "The feature example could not be sent to an Agents window."}
      - set:
          vars.dest: "= vars.opened.value.windows[0]"
      - set:
          state.pending: "= merge(state.pending, {input.request_id: {'destination': vars.dest}})"
      - call: windows-main-service.focus
        input: {window_id: "= vars.dest"}
      - title: sendWhenReady('vscode:runOnboardingTryout', request)
        source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:56-58"
        call: code-window.send-when-ready
        input:
          window_id: "= vars.dest"
          channel: "vscode:runOnboardingTryout"
          args: {request_id: "= input.request_id", tryout_id: "= input.tryout_id", source: "= input.source"}
      - title: raceTimeout(completion, 30 s); on timeout cancel the request and throw
        source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:59-63"
        receive: "= 'onboarding-tryout:' + input.request_id"
        as: outcome
        timeout_ms: "= config['onboarding-tryout-accept-timeout-ms']"
        on_error:
          - call: onboarding-tryout-handoff.cancel-pending-request
            input: {request_id: "= input.request_id", result: cancelled}
          - set: {state.pending: "= omit(state.pending, input.request_id)"}
          - fail: {code: feature-example-accept-timeout, message: "The Agents window did not accept the feature example in time."}
      - title: finally, forget the pending request
        source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:65-68"
        set: {state.pending: "= omit(state.pending, input.request_id)"}
      - return: {result: "= vars.outcome"}

  - component: onboarding-tryout-handoff
    name: complete
    kind: ipc
    summary: "OnboardingTryoutHandoff.complete: only the destination window settles its pending request, with a known result."
    sources: ["src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:78-83"]
    attributes: {channel: onboardingTryout}
    request:
      type: object
      required: [window_id, request_id, result]
      properties:
        window_id: {type: string, examples: [w2]}
        request_id: {type: string, examples: ["3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69"]}
        result: {type: string, examples: [accepted]}
    response: {type: object, properties: {completed: {type: boolean}}}
    behavior:
      - if: "!(input.request_id in state.pending) || state.pending[input.request_id].destination != input.window_id || !(input.result in ['accepted', 'cancelled', 'rejected', 'superseded']) || state.pending[input.request_id].settled"
        then:
          - title: Unknown request, another window, an unknown result or already settled; ignored
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:80"
            return: {completed: false}
      - set:
          state.pending: "= merge(state.pending, {input.request_id: {'settled': true}})"
      - title: completion.complete(result) resumes the waiting open()
        source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:81"
        put: "= 'onboarding-tryout:' + input.request_id"
        value: "= input.result"
      - return: {completed: true}

  - component: onboarding-tryout-handoff
    name: cancel
    kind: ipc
    summary: "OnboardingTryoutHandoff.cancel: only the window that opened the request may cancel it."
    sources: ["src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:71-76"]
    attributes: {channel: onboardingTryout}
    request:
      type: object
      required: [window_id, request_id]
      properties:
        window_id: {type: string, examples: [w1]}
        request_id: {type: string, examples: ["3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69"]}
    response: {type: object, properties: {cancelled: {type: boolean}}}
    behavior:
      - if: "!(input.request_id in state.pending) || state.pending[input.request_id].source_window != input.window_id"
        then:
          - title: Not the source window (or no such request), nothing happens
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:73"
            return: {cancelled: false}
      - call: onboarding-tryout-handoff.cancel-pending-request
        input: {request_id: "= input.request_id", result: cancelled}
      - return: {cancelled: true}

  - component: onboarding-tryout-handoff
    name: cancel-pending-request
    kind: function
    summary: "cancelPendingRequest: cancel the delivery, tell the destination window to drop it (vscode:cancelOnboardingTryout) and settle the request as cancelled or superseded."
    sources: ["src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:85-89"]
    request: {type: object, properties: {request_id: {type: string}, result: {type: string, enum: [cancelled, superseded]}}}
    response: {type: object, properties: {notified: {type: boolean}}}
    behavior:
      - set: {vars.p: "= state.pending[input.request_id]"}
      - if: "vars.p.destination != ''"
        then:
          - title: destinationWindow.sendWhenReady('vscode:cancelOnboardingTryout', requestId)
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:87"
            call: code-window.send-when-ready
            input: {window_id: "= vars.p.destination", channel: "vscode:cancelOnboardingTryout", args: {request_id: "= input.request_id"}}
      - if: "!vars.p.settled"
        then:
          - set:
              state.pending: "= merge(state.pending, {input.request_id: {'settled': true}})"
          - title: completion.complete(result)
            source: "src/vs/platform/onboarding/electron-main/onboardingTryoutHandoff.ts:88"
            put: "= 'onboarding-tryout:' + input.request_id"
            value: "= input.result"
      - return: {notified: "= vars.p.destination != ''"}

  # ================================================================ environment (snap) and pty host env
  - component: environment-main-service
    name: agent-sessions-workspace
    kind: function
    summary: "environmentService.agentSessionsWorkspace: <appSettingsHome>/agent-sessions.code-workspace."
    sources: ["src/vs/platform/environment/common/environmentService.ts:279-282"]
    request: {type: object}
    response: {type: object, properties: {uri: {type: string}}}
    behavior:
      - return: {uri: "= state.agent_sessions_workspace"}

  - component: environment-main-service
    name: unset-snap-exported-variables
    kind: function
    summary: "unsetSnapExportedVariables (Linux): for each X_VSCODE_SNAP_ORIG, remember the snap value of X and put back the value from before the snap (deleting X when it was empty)."
    sources: ["src/vs/platform/environment/electron-main/environmentMainService.ts:75-98"]
    request: {type: object}
    response: {type: object, properties: {env: {type: object}}}
    behavior:
      - if: "state.platform != 'linux'"
        then:
          - title: Only on Linux
            source: "src/vs/platform/environment/electron-main/environmentMainService.ts:76-78"
            return: {env: "= state.env"}
      - foreach: "= state.env.filter(k, k.endsWith('_VSCODE_SNAP_ORIG'))"
        as: key
        max: 50
        steps:
          - set: {vars.orig: "= vars.key.substring(0, size(vars.key) - 17)"}
          - if: "vars.orig in state.snap_env && state.snap_env[vars.orig] != ''"
            then:
              - title: Already unset (re-entry), keep the remembered snap value
                source: "src/vs/platform/environment/electron-main/environmentMainService.ts:82-84"
                continue: true
          - if: "vars.orig in state.env && state.env[vars.orig] != ''"
            then:
              - title: Preserve the snap value in case the snap env is re-entered
                source: "src/vs/platform/environment/electron-main/environmentMainService.ts:85-88"
                set: {state.snap_env: "= merge(state.snap_env, {vars.orig: state.env[vars.orig]})"}
          - if: "state.env[vars.key] != ''"
            then:
              - title: Copy the value from before the snap env
                source: "src/vs/platform/environment/electron-main/environmentMainService.ts:91-92"
                set: {state.env: "= merge(state.env, {vars.orig: state.env[vars.key]})"}
            else:
              - title: No original value, delete the variable
                source: "src/vs/platform/environment/electron-main/environmentMainService.ts:93-95"
                set: {state.env: "= omit(state.env, vars.orig)"}
      - return: {env: "= state.env"}

  - component: environment-main-service
    name: restore-snap-exported-variables
    kind: function
    summary: "restoreSnapExportedVariables (Linux): put the remembered snap values back and forget them."
    sources: ["src/vs/platform/environment/electron-main/environmentMainService.ts:100-108"]
    request: {type: object}
    response: {type: object, properties: {restored: {type: array, items: {type: string}}}}
    behavior:
      - if: "state.platform != 'linux'"
        then:
          - title: Only on Linux
            source: "src/vs/platform/environment/electron-main/environmentMainService.ts:101-103"
            return: {restored: []}
      - set: {vars.keys: "= state.snap_env.map(k, k)"}
      - title: process.env[key] = snapEnv[key], then delete it from the snap env
        source: "src/vs/platform/environment/electron-main/environmentMainService.ts:104-107"
        set:
          state.env: "= merge(state.env, state.snap_env)"
          state.snap_env: {}
      - return: {restored: "= vars.keys"}

  - component: electron-pty-host-starter
    name: create-pty-host-configuration
    kind: function
    summary: "_createPtyHostConfiguration: unset the snap variables, clone process.env with the pty host entry point and logging flags, then restore the snap variables."
    sources: ["src/vs/platform/terminal/electron-main/electronPtyHostStarter.ts:86-107"]
    request: {type: object}
    response: {type: object, properties: {env: {type: object}}}
    behavior:
      - title: Unset the snap-exported variables so the shell sees the user's environment
        source: "src/vs/platform/terminal/electron-main/electronPtyHostStarter.ts:87"
        call: environment-main-service.unset-snap-exported-variables
        input: {}
        as: unset
      - title: deepClone(process.env) plus the pty host entry point and logging flags
        source: "src/vs/platform/terminal/electron-main/electronPtyHostStarter.ts:88-92"
        set:
          vars.env: "= merge(vars.unset.value.env, {'VSCODE_ESM_ENTRYPOINT': 'vs/platform/terminal/node/ptyHostMain', 'VSCODE_PIPE_LOGGING': 'true', 'VSCODE_VERBOSE_LOGGING': 'true'})"
      - title: Restore the snap variables in the main process
        source: "src/vs/platform/terminal/electron-main/electronPtyHostStarter.ts:105"
        call: environment-main-service.restore-snap-exported-variables
        input: {}
      - return: {env: "= vars.env"}

  # ================================================================ metered connection (main side)
  - component: metered-connection-main-service
    name: set-is-browser-connection-metered
    kind: ipc
    summary: "MeteredConnectionMainService.setIsBrowserConnectionMetered: the renderer reports navigator.connection; recompute isConnectionMetered from network.meteredConnection and mark the connection state initialized."
    sources: ["src/vs/platform/meteredConnection/electron-main/meteredConnectionMainService.ts:28-31", "src/vs/platform/meteredConnection/common/meteredConnection.ts:116-133"]
    attributes: {channel: meteredConnection}
    request: {type: object, required: [value], properties: {value: {type: boolean, examples: [true]}}}
    response: {type: object, properties: {metered: {type: boolean}, changed: {type: boolean}}}
    behavior:
      - set: {vars.before: "= state.metered"}
      - if: "input.value != state.browser_metered"
        then:
          - set: {state.browser_metered: "= input.value"}
          - title: "onUpdated: metered when the setting is 'on', or not 'off' and the browser reports metered"
            source: "src/vs/platform/meteredConnection/common/meteredConnection.ts:127-133"
            set: {state.metered: "= config['network-metered-connection'] == 'on' || (config['network-metered-connection'] != 'off' && input.value)"}
      - title: The first report completes whenConnectionStateInitialized
        source: "src/vs/platform/meteredConnection/electron-main/meteredConnectionMainService.ts:30"
        set: {state.initialized: true}
      - return: {metered: "= state.metered", changed: "= state.metered != vars.before"}

  # ================================================================ boundary stubs (platform-core file service)
  - component: file-service
    name: exists
    kind: function
    summary: "FileService.exists (platform-core)."
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    response: {type: object, properties: {exists: {type: boolean}}}

  - component: file-service
    name: write-file
    kind: function
    summary: "FileService.writeFile (platform-core)."
    attributes: {boundary: true, owner: platform-core}
    request:
      type: object
      required: [resource, content]
      properties:
        resource: {type: string, examples: ["file:///work/app/src/main.ts"]}
        content: {type: string}
    response: PlatformFileStat
    errors:
      - {code: file-modified-since, status: 0, retryable: false}
      - {code: file-permission-denied, status: 0, retryable: false}
      - {code: no-file-system-provider-found, status: 0, retryable: false}

