      - "(('sent' in state['code-window'].windows.w2 ? state['code-window'].windows.w2.sent : []) + ('queued' in state['code-window'].windows.w2 ? state['code-window'].windows.w2.queued : [])).filter(m, m.channel == 'vscode:selectAgentsFolder' && m.args.source == 'commandPalette' && m.args.reveal == '' && m.args.draft == '').size() == 1"
