        on_error:
          - if: "error.code == 'canceled'"
            then:
              - title: CancellationError is ignored
                source: "src/vs/workbench/electron-browser/actions/installActions.ts:70-72"
                return: {uninstalled: false, message: ""}
          - title: Other errors are shown with dialogService.error
            source: "src/vs/workbench/electron-browser/actions/installActions.ts:74"
            return: {uninstalled: false, message: "= error.message"}
      - title: Info dialog on success
        source: "src/vs/workbench/electron-browser/actions/installActions.ts:68"
        return: {uninstalled: true, message: "Shell command 'code-oss' successfully uninstalled from PATH."}

