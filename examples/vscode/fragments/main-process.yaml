            source: "src/vs/platform/windows/electron-main/windowsMainService.ts:1679-1683"
            return: {window_id: "= vars.reuse", created: false, vetoed: true}
      - set:
          state.windows: "= merge(state.windows, {vars.reuse: {'workspace': input.workspace, 'files': input.files}})"
          state.last_active: "= vars.reuse"
      - call: windows-main-service.do-open-in-browser-window
        input: {window_id: "= vars.reuse", workspace: "= input.workspace", files: "= input.files", empty_backup: "= input.empty_backup"}
      - return: {window_id: "= vars.reuse", created: false, vetoed: false}

