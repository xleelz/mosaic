        source: "src/vs/platform/workspaces/electron-main/workspacesHistoryMainService.ts:89-125"
        set:
          vars.ws: "= input.workspaces.filter(w, !w.startsWith('untitled-')) + state.workspaces.filter(w, !(w in input.workspaces))"
          vars.fs: "= input.files + state.files.filter(f, !(f in input.files))"
