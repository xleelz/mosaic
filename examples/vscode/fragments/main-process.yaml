    entry: {caller: electron-pty-host-starter, interface: environment-main-service.unset-snap-exported-variables}
  - id: snap-env-restore
    name: Restore the snap-exported environment variables (Linux)
    sources: ["src/vs/platform/environment/electron-main/environmentMainService.ts:100-108"]
    entry: {caller: electron-pty-host-starter, interface: environment-main-service.restore-snap-exported-variables}
  - id: pty-host-env
    name: Build the pty host environment around the snap variables
    sources: ["src/vs/platform/terminal/electron-main/electronPtyHostStarter.ts:86-107"]
    entry: {caller: pty-host-service, interface: electron-pty-host-starter.create-pty-host-configuration}
  - id: metered-connection-report
    name: The renderer reports whether the browser connection is metered
    tags: [writes]
    sources: ["src/vs/platform/meteredConnection/electron-main/meteredConnectionMainService.ts:28-31"]
    entry: {caller: workbench-window, interface: metered-connection-main-service.set-is-browser-connection-metered, input: {value: true}}
  - id: metered-connection-read
    name: Read isConnectionMetered over the meteredConnection channel
    sources: ["src/vs/platform/meteredConnection/common/meteredConnectionIpc.ts:31-34"]
    entry: {caller: workbench-window, interface: metered-connection-main-service.is-connection-metered}

scenarios:
  # ---------------------------------------------------------------- main-startup
  - id: main-process-startup-restore-last-session
    name: First instance starts and restores the last session's folder in w1, then the window list shows it
    fixtures: [one-window-folder, main-process-seed]
    state:
      "lifecycle-service@w1": {phase: 1}
      lifecycle-main-service: {phase: 1}
      windows-main-service: {windows: {w1: {open: false}}, last_active: "", next_window: 1}
      code-window: {windows: {w1: {ready: false, loads: 0}}}
    steps:
      - {flow: main-startup, as: start, input: {args: {}}}
      - {flow: window-list, as: list}
    expect:
      - "steps.start.result.ok && steps.start.result.value.windows == ['w1'] && !steps.start.result.value.forwarded"
      - "steps.list.result.value.count == 1 && steps.list.result.value.windows[0].workspace == 'file:///work/app' && steps.list.result.value.windows[0].ready"
      - "state['lifecycle-main-service'].phase == 4 && state['code-main'].ipc_handle_in_use && state['code-main'].running"
      - "size(state['code-application'].channels) == 33 && state['shared-process-host'].ready && size(state['shared-process-main'].channels) == 25"
      - "state['workspaces-history-main-service'].workspaces[0] == 'file:///work/app'"
  - id: main-process-startup-second-instance-forwards
    name: A second instance sends its args over the launch channel; the running instance opens the folder in a new window
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    state:
      code-main: {ipc_handle_in_use: true}
    steps:
      - {flow: main-startup, as: second, input: {args: {paths: ["file:///work/lib"]}}}
      - {flow: window-list, as: list}
    expect:
      - "steps.second.result.ok && steps.second.result.value.forwarded && steps.second.result.value.exit_code == 0"
      - "state['code-main'].exit == 'expected' && calls['code-application.startup'] == 0 && calls['launch-main-service.start'] == 1"
      - "steps.list.result.value.count == 2 && steps.list.result.value.windows.exists(w, w.id == 'w2' && w.workspace == 'file:///work/lib')"
  - id: main-process-startup-stale-handle-retry
    flow: main-startup
    name: A stale IPC handle is unlinked and the instance claims it on the retry
    fixtures: [one-window-folder, main-process-seed]
    state:
      lifecycle-main-service: {phase: 1}
      windows-main-service: {windows: {w1: {open: false}}, last_active: "", next_window: 1}
      code-window: {windows: {w1: {ready: false, loads: 0}}}
      code-main: {ipc_handle_in_use: true, stale_handle: true}
    input: {args: {}}
    expect:
      - "result.ok && !result.value.forwarded && calls['code-main.claim-instance'] == 2"
      - "state['code-main'].ipc_handle_in_use && !state['code-main'].stale_handle"
  - id: main-process-startup-status-without-instance
    flow: main-startup
    name: --status without a running instance prints a warning and exits 0
    fixtures: [one-window-folder, main-process-seed]
    input: {args: {status: true}}
    expect:
      - "result.ok && result.value.exit_code == 0 && calls['code-application.startup'] == 0"
      - "state['code-main'].exit == 'expected'"
  - id: main-process-startup-status-with-instance
    flow: main-startup
    name: --status with a running instance prints its diagnostics and does not open windows
    fixtures: [one-window-folder, main-process-seed]
    state: {code-main: {ipc_handle_in_use: true}}
    input: {args: {status: true}}
    expect:
      - "result.ok && result.value.forwarded && calls['launch-main-service.start'] == 0"
      - "state['code-main'].exit == 'expected'"
  - id: main-process-startup-user-data-not-writable
    flow: main-startup
    name: Unwritable user data directory shows the dialog and exits with code 1
    fixtures: [one-window-folder, main-process-seed]
    state: {code-main: {user_data_writable: false}}
    input: {args: {}}
    expect:
      - "!result.ok && result.error.code == 'eacces'"
      - "state['lifecycle-main-service'].exited && state['lifecycle-main-service'].exit_code == 1 && calls['code-main.claim-instance'] == 0"
  - id: main-process-startup-inno-setup-active
    flow: main-startup
    name: Launch during a Windows update fails and exits with code 1
    fixtures: [one-window-folder, main-process-seed]
    state: {code-main: {inno_setup_active: true}}
    input: {args: {}}
    expect:
      - "!result.ok && result.error.code == 'inno-setup-active'"
      - "state['lifecycle-main-service'].exit_code == 1 && state['code-main'].exit == 'inno-setup-active'"
  - id: main-process-startup-hot-exit-empty-window
    flow: main-startup
    name: An empty window with hot-exit backups is restored next to the last session's folder
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    state:
      lifecycle-main-service: {phase: 1}
      windows-main-service: {windows: {w1: {open: false}}, last_active: "", next_window: 1}
      code-window: {windows: {w1: {ready: false, loads: 0}}}
      backup-main-service: {empty_windows: ["1793318400000"]}
    input: {args: {}}
    expect:
      - "result.ok && result.value.windows == ['w1', 'w2']"
      - "state['windows-main-service'].windows.w2.workspace == '' && state['windows-main-service'].last_active == 'w2'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'backup-main-service.register-empty-window-backup' && e.input.backup_folder == '1793318400000')"
  - id: main-process-startup-restore-none
    flow: main-startup
    name: window.restoreWindows=none opens one empty window
    fixtures: [one-window-folder, main-process-seed]
    config: {window-restore-windows: none}
    state:
      lifecycle-main-service: {phase: 1}
      windows-main-service: {windows: {w1: {open: false}}, last_active: "", next_window: 1}
      code-window: {windows: {w1: {ready: false, loads: 0}}}
    input: {args: {}}
    expect:
      - "result.ok && result.value.windows == ['w1'] && state['windows-main-service'].windows.w1.workspace == ''"
  - id: main-process-startup-restore-preserve-with-path
    flow: main-startup
    name: restoreWindows=preserve reopens the last session folder and opens the CLI folder in a new window
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    config: {window-restore-windows: preserve}
    state:
      lifecycle-main-service: {phase: 1}
      windows-main-service: {windows: {w1: {open: false}}, last_active: "", next_window: 1}
      code-window: {windows: {w1: {ready: false, loads: 0}}}
    input: {args: {paths: ["file:///work/lib"]}}
    expect:
      - "result.ok && size(result.value.windows) == 2"
      - "state['windows-main-service'].windows.w1.workspace == 'file:///work/app' && state['windows-main-service'].windows.w2.workspace == 'file:///work/lib'"
  - id: main-process-startup-new-window-flag
    flow: main-startup
    name: --new-window without paths opens an empty window instead of restoring
    fixtures: [one-window-folder, main-process-seed]
    state:
      lifecycle-main-service: {phase: 1}
      windows-main-service: {windows: {w1: {open: false}}, last_active: "", next_window: 1}
      code-window: {windows: {w1: {ready: false, loads: 0}}}
    input: {args: {new_window: true}}
    expect:
      - "result.ok && state['windows-main-service'].windows.w1.workspace == '' && calls['windows-main-service.get-paths-from-last-session'] == 0"

  # ---------------------------------------------------------------- cli-launch
  - id: main-process-cli-help
    flow: cli-launch
    fixtures: [one-window-folder, main-process-seed]
    input: {args: {help: true}}
    expect: ["result.ok && result.value.output == 'help' && state['node-cli'].stdout == ['help'] && calls['code-main.startup'] == 0"]
  - id: main-process-cli-version
    flow: cli-launch
    fixtures: [one-window-folder, main-process-seed]
    input: {args: {version: true}}
    expect: ["result.ok && result.value.output == 'version' && state['node-cli'].stdout == ['version']"]
  - id: main-process-cli-extensions
    name: list, install and uninstall extensions run in cliProcessMain without Electron
    fixtures: [one-window-folder, main-process-seed]
    steps:
      - {flow: cli-launch, as: list, input: {args: {list_extensions: true}}}
      - {flow: cli-launch, as: install, input: {args: {install_extension: [vscode.typescript-language-features]}}}
      - {flow: cli-launch, as: uninstall, input: {args: {uninstall_extension: [vscode.typescript-language-features]}}}
    expect:
      - "steps.list.result.value.output == 'list' && steps.install.result.value.output == 'install' && steps.uninstall.result.value.output == 'uninstall'"
      - "calls['extension-management-cli.install-extensions'] == 1 && calls['code-main.startup'] == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-management-cli.uninstall-extensions' && e.input.extensions == ['vscode.typescript-language-features'])"
  - id: main-process-cli-profile-not-found
    flow: cli-launch
    fixtures: [one-window-folder, main-process-seed]
    input: {args: {list_extensions: true, profile: Work}}
    expect: ["!result.ok && result.error.code == 'profile-not-found' && state['node-cli'].exit_code == 1"]
  - id: main-process-cli-file-write-invalid
    flow: cli-launch
    fixtures: [one-window-folder, main-process-seed]
    input: {args: {file_write: true}}
    expect: ["!result.ok && result.error.code == 'using-file-write-with-invalid-arguments' && state['node-cli'].exit_code == 1"]
  - id: main-process-cli-tunnel
    name: code tunnel spawns the Rust CLI; without tunnelApplicationName it is refused
    fixtures: [one-window-folder, main-process-seed]
    steps:
      - {flow: cli-launch, as: ok, input: {args: {subcommand: tunnel}}}
    expect: ["steps.ok.result.value.spawned == 'code-tunnel-oss' && calls['code-main.startup'] == 0", "!trace.exists(e, e.type == 'call.start' && e.interface == 'code-main.startup')"]
  - id: main-process-cli-tunnel-unsupported
    flow: cli-launch
    fixtures: [one-window-folder, main-process-seed]
    config: {product-tunnel-application-name: ""}
    input: {args: {subcommand: serve-web}}
    expect: ["result.ok && result.value.spawned == '' && state['node-cli'].stdout == ['command not supported']"]
  - id: main-process-cli-wait-opens-file-in-folder-window
    name: code --wait main.ts with VS Code running opens the file in w1 (its folder) and waits on w1
    fixtures: [one-window-folder, main-process-seed]
    state: {code-main: {ipc_handle_in_use: true}}
    steps:
      - {flow: cli-launch, as: cli, input: {args: {wait: true, paths: ["file:///work/app/src/main.ts"]}}}
      - {flow: window-list, as: list}
    expect:
      - "steps.cli.result.ok && steps.cli.result.value.waited_on == 'waitMarkerFilePath'"
      - "calls['native-window.on-open-files'] == 1 && state['native-window@w1'].opened_files == ['file:///work/app/src/main.ts']"
      - "steps.list.result.value.count == 1"

  # ---------------------------------------------------------------- window-open
  - id: main-process-open-folder-already-open
    flow: window-open
    name: Opening the folder that w1 already shows focuses w1 instead of loading anything
    fixtures: [one-window-folder, main-process-seed]
    input: {window_id: w1, folder_uris: ["file:///work/app"]}
    expect:
      - "result.ok && result.value.windows == ['w1'] && calls['code-window.load'] == 0 && calls['lifecycle-main-service.unload'] == 0"
      - "state['windows-main-service'].last_active == 'w1' && size(state['windows-main-service'].windows) == 1"
  - id: main-process-open-folder-reuses-window
    name: File > Open Folder replaces the workspace of the calling window after an unload without veto
    fixtures: [one-window-folder, main-process-seed]
    steps:
      - {flow: window-open, as: open, input: {window_id: w1, folder_uris: ["file:///work/lib"]}}
      - {flow: window-list, as: list}
    expect:
      - "steps.open.result.value.windows == ['w1'] && !steps.open.result.value.vetoed"
      - "steps.list.result.value.windows[0].workspace == 'file:///work/lib' && steps.list.result.value.count == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'lifecycle-service.on-before-shutdown' && e.instance == 'w1' && e.input.reason == 'load')"
      - "state['code-window'].windows.w1.loads == 2 && 'file:///work/lib' in state['backup-main-service'].folders && state['workspaces-history-main-service'].workspaces[0] == 'file:///work/lib'"
  - id: main-process-open-folder-reuse-vetoed
    flow: window-open
    name: The renderer vetoes the unload (e.g. a save prompt cancelled), so w1 keeps its folder
    fixtures: [dirty-editor, main-process-seed]
    choices: {lifecycle-main-service.unload.renderer_reply: cancel}
    input: {window_id: w1, folder_uris: ["file:///work/lib"]}
    expect:
      - "result.ok && result.value.vetoed && calls['code-window.load'] == 0"
      - "state['windows-main-service'].windows.w1.workspace == 'file:///work/app'"
  - id: main-process-open-folder-new-window-forced
    flow: window-open
    name: Open Folder in New Window creates w2
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    input: {window_id: w1, folder_uris: ["file:///work/lib"], force_new_window: true}
    expect:
      - "result.ok && result.value.windows == ['w2'] && state['windows-main-service'].windows.w2.workspace == 'file:///work/lib'"
      - "state['windows-main-service'].windows.w1.workspace == 'file:///work/app' && state['windows-main-service'].next_window == 3"
  - id: main-process-open-folders-in-new-window-setting
    flow: window-open
    name: window.openFoldersInNewWindow=on opens a new window even without --new-window
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    config: {window-open-folders-in-new-window: "on"}
    input: {window_id: w1, folder_uris: ["file:///work/lib"]}
    expect: ["result.ok && result.value.windows == ['w2'] && state['windows-main-service'].windows.w1.workspace == 'file:///work/app'"]
  - id: main-process-open-several-folders-untitled-workspace
    flow: window-open
    name: Opening two folders at once creates an untitled workspace
    fixtures: [one-window-folder, main-process-seed]
    input: {window_id: w1, folder_uris: ["file:///work/app", "file:///work/lib"]}
    expect:
      - "result.ok && state['windows-main-service'].windows.w1.workspace == 'untitled-1'"
      - "state['workspaces-management-main-service'].untitled[0].folders == ['file:///work/app', 'file:///work/lib']"
  - id: main-process-open-file-new-window
    flow: window-open
    name: A file opened with forceNewWindow goes to a new empty window
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    input: {window_id: w1, folder_uris: [], file_uris: ["file:///work/app/README.md"], force_new_window: true}
    expect:
      - "result.ok && result.value.files_opened_in == 'w2' && state['windows-main-service'].windows.w2.files == ['file:///work/app/README.md']"
  - id: main-process-open-add-folder
    flow: window-open
    name: --add style request sends the folder to the last active window
    fixtures: [one-window-folder, main-process-seed]
    input: {window_id: w1, folder_uris: ["file:///work/lib"], add_mode: true}
    expect:
      - "result.ok && result.value.windows == ['w1'] && state['native-window@w1'].added_folders == ['file:///work/lib']"
  - id: main-process-open-empty-window
    flow: window-open
    name: New Empty Window from the API with forceNewWindow
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    input: {window_id: w1, folder_uris: [], file_uris: [], force_new_window: true}
    expect: ["result.ok && state['windows-main-service'].windows.w2.workspace == '' && 'empty-w2' in state['backup-main-service'].empty_windows"]

  # ---------------------------------------------------------------- window-close
  - id: main-process-close-last-window-quits
    name: Closing the only window on Linux/Windows quits the app and remembers the window for the next session
    fixtures: [one-window-folder, main-process-seed]
    steps:
      - {flow: window-close, as: close}
      - {flow: window-list, as: list}
    expect:
      - "steps.close.result.value.closed && steps.list.result.value.count == 0"
      - "state['lifecycle-main-service'].exited && state['lifecycle-main-service'].shutdown_reason == 'quit' && state['lifecycle-main-service'].quit_requested"
      - "state['windows-state-handler'].last_active_window.folder_uri == 'file:///work/app' && state['windows-state-handler'].shutting_down && !state['code-main'].running"
  - id: main-process-close-vetoed
    flow: window-close
    name: The renderer vetoes the close, the window stays open
    fixtures: [dirty-editor, main-process-seed]
    choices: {lifecycle-main-service.unload.renderer_reply: cancel}
    expect:
      - "result.ok && !result.value.closed && state['windows-main-service'].windows.w1.open && !state['lifecycle-main-service'].exited"
  - id: main-process-close-one-of-two
    flow: window-close
    name: Closing one of two windows keeps the app running
    fixtures: [main-process-two-windows]
    expect:
      - "result.ok && result.value.closed && !state['windows-main-service'].windows.w1.open && state['windows-main-service'].last_active == 'w2'"
      - "!state['lifecycle-main-service'].exited && state['lifecycle-main-service'].shutdown_reason == ''"
  - id: main-process-close-window-not-ready
    flow: window-close
    name: A window that is not ready yet closes without asking the renderer
    fixtures: [one-window-folder, main-process-seed]
    state:
      code-window: {windows: {w1: {ready: false}}}
    expect:
      - "result.ok && result.value.closed && calls['lifecycle-service.on-before-shutdown'] == 0 && state['lifecycle-main-service'].exited"

  # ---------------------------------------------------------------- app-quit
  - id: main-process-quit-two-windows
    name: Quit with two windows saves both as opened windows and shuts down once
    fixtures: [main-process-two-windows]
    steps:
      - {flow: app-quit, as: quit}
      - {flow: window-list, as: list}
    expect:
      - "steps.quit.result.value.quit && steps.list.result.value.count == 0"
      - "state['windows-state-handler'].opened_windows == ['file:///work/app', 'file:///work/lib'] && state['lifecycle-main-service'].shutdown_reason == 'quit'"
      - "calls['lifecycle-main-service.on-window-close-request'] == 2 && state['lifecycle-main-service'].exited"
  - id: main-process-quit-vetoed
    flow: app-quit
    name: A renderer veto cancels the quit and resets quitRequested
    fixtures: [dirty-editor, main-process-seed]
    choices: {lifecycle-main-service.unload.renderer_reply: cancel}
    expect:
