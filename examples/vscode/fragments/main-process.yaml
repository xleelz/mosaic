    summary: "LinuxUpdateService.doCheckForUpdates: CheckingForUpdates, request the feed, then AvailableForDownload or Idle (with an error message only for explicit checks)."
    sources: ["src/vs/platform/update/electron-main/updateService.linux.ts:41-75"]
    request: {type: object, properties: {explicit: {type: boolean, default: true}}}
