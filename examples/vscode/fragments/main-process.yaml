  # ---------------------------------------------------------------- onboarding tryout handoff
  - id: main-process-onboarding-tryout-accepted
    name: A feature example opens the Agents window, is delivered with vscode:runOnboardingTryout, and resolves with the window's accept
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    steps:
      - {flow: onboarding-tryout-open, as: open, await: false, input: {window_id: w1, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69", tryout_id: agentsWindow, source: direct}}
      - {flow: onboarding-tryout-complete, as: done, at_ms: 2000, input: {window_id: w2, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69", result: accepted}}
    expect:
      - "steps.open.result.ok && steps.open.result.value.result == 'accepted' && steps.done.result.value.completed"
      - "(('sent' in state['code-window'].windows.w2 ? state['code-window'].windows.w2.sent : []) + ('queued' in state['code-window'].windows.w2 ? state['code-window'].windows.w2.queued : [])).exists(m, m.channel == 'vscode:runOnboardingTryout' && m.args.tryout_id == 'agentsWindow')"
      - "size(state['onboarding-tryout-handoff'].pending) == 0 && calls['windows-main-service.open-agents-window'] == 1"
  - id: main-process-onboarding-tryout-timeout
    flow: onboarding-tryout-open
    name: Without an accept within 30 s the request is cancelled in the Agents window and open fails
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    max_virtual_ms: 60000
    expect:
      - "!result.ok && result.error.code == 'feature-example-accept-timeout'"
      - "(('sent' in state['code-window'].windows.w2 ? state['code-window'].windows.w2.sent : []) + ('queued' in state['code-window'].windows.w2 ? state['code-window'].windows.w2.queued : [])).exists(m, m.channel == 'vscode:cancelOnboardingTryout')"
      - "size(state['onboarding-tryout-handoff'].pending) == 0"
  - id: main-process-onboarding-tryout-superseded
    name: A second feature example supersedes the pending one, which resolves 'superseded'
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    steps:
      - {flow: onboarding-tryout-open, as: first, await: false, input: {window_id: w1, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69", tryout_id: agentsWindow, source: direct}}
      - {flow: onboarding-tryout-open, as: second, await: false, at_ms: 1000, input: {window_id: w1, request_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7", tryout_id: chatEdits, source: releaseNotes}}
      - {flow: onboarding-tryout-complete, as: done, at_ms: 3000, input: {window_id: w2, request_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7", result: accepted}}
    expect:
      - "steps.first.result.value.result == 'superseded' && steps.second.result.value.result == 'accepted'"
      - "size(state['onboarding-tryout-handoff'].pending) == 0"
  - id: main-process-onboarding-tryout-cancel-only-source
    name: Only the window that opened the request can cancel it; the source window's cancel resolves 'cancelled'
    fixtures: [one-window-folder, main-process-seed]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    steps:
      - {flow: onboarding-tryout-open, as: open, await: false, input: {window_id: w1, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69", tryout_id: agentsWindow, source: externalLink}}
      - {flow: onboarding-tryout-cancel, as: other, at_ms: 1000, input: {window_id: w2, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69"}}
      - {flow: onboarding-tryout-cancel, as: mine, at_ms: 2000, input: {window_id: w1, request_id: "3f0c2b1a-9d4e-4c6b-8a7f-1e2d3c4b5a69"}}
    expect:
      - "!steps.other.result.value.cancelled && steps.mine.result.value.cancelled"
      - "steps.open.result.value.result == 'cancelled' && size(state['onboarding-tryout-handoff'].pending) == 0"
  - id: main-process-onboarding-tryout-invalid-request
    flow: onboarding-tryout-open
    name: A request id that is not a UUID is refused before any window opens
    fixtures: [one-window-folder, main-process-seed]
    input: {window_id: w1, request_id: not-a-uuid, tryout_id: agentsWindow, source: direct}
    expect:
      - "!result.ok && result.error.code == 'feature-example-request-invalid' && calls['windows-main-service.open-agents-window'] == 0"
      - "size(state['onboarding-tryout-handoff'].pending) == 0"
  # ---------------------------------------------------------------- snap environment
  - id: main-process-snap-env-unset-and-restore
    name: On Linux the snap variables are replaced by their pre-snap values (or deleted) and restored afterwards
    fixtures: [one-window-folder, main-process-seed]
    state:
      environment-main-service:
        env: {PATH: /snap/code/bin, GDK_PIXBUF_MODULE_FILE: /snap/pixbuf, GDK_PIXBUF_MODULE_FILE_VSCODE_SNAP_ORIG: /usr/lib/pixbuf, GTK_PATH: /snap/gtk, GTK_PATH_VSCODE_SNAP_ORIG: ""}
    steps:
      - {flow: snap-env-unset, as: unset}
      - {flow: snap-env-restore, as: restore}
    expect:
      - "steps.unset.result.value.env.GDK_PIXBUF_MODULE_FILE == '/usr/lib/pixbuf' && !('GTK_PATH' in steps.unset.result.value.env)"
      - "steps.restore.result.value.restored.size() == 2"
      - "state['environment-main-service'].env.GDK_PIXBUF_MODULE_FILE == '/snap/pixbuf' && state['environment-main-service'].env.GTK_PATH == '/snap/gtk' && size(state['environment-main-service'].snap_env) == 0"
  - id: main-process-snap-env-not-linux
    flow: snap-env-unset
    name: Outside Linux nothing is unset
    fixtures: [one-window-folder, main-process-seed]
    state:
      environment-main-service: {platform: darwin, env: {GTK_PATH: /snap/gtk, GTK_PATH_VSCODE_SNAP_ORIG: ""}}
    expect:
      - "result.ok && state['environment-main-service'].env.GTK_PATH == '/snap/gtk' && size(state['environment-main-service'].snap_env) == 0"
  - id: main-process-pty-host-env-without-snap
    flow: pty-host-env
    name: The pty host gets the pre-snap environment while the main process keeps its own
    fixtures: [one-window-folder, main-process-seed]
    state:
      environment-main-service:
        env: {GTK_PATH: /snap/gtk, GTK_PATH_VSCODE_SNAP_ORIG: /usr/lib/gtk}
    expect:
      - "result.ok && result.value.env.GTK_PATH == '/usr/lib/gtk' && result.value.env.VSCODE_ESM_ENTRYPOINT == 'vs/platform/terminal/node/ptyHostMain'"
      - "state['environment-main-service'].env.GTK_PATH == '/snap/gtk'"
  # ---------------------------------------------------------------- metered connection (main side)
  - id: main-process-metered-browser-report
    name: The first browser report initializes the state; with the setting on auto a metered browser makes the connection metered
    fixtures: [one-window-folder, main-process-seed]
    steps:
      - {flow: metered-connection-report, as: report, input: {value: true}}
      - {flow: metered-connection-read, as: read}
    expect:
      - "steps.report.result.value.changed && steps.read.result.value.metered"
      - "state['metered-connection-main-service'].initialized && state['metered-connection-main-service'].browser_metered"
  - id: main-process-metered-setting-off
    name: With network.meteredConnection off a metered browser connection is not treated as metered
    fixtures: [one-window-folder, main-process-seed]
    config: {network-metered-connection: "off"}
    steps:
      - {flow: metered-connection-report, as: report, input: {value: true}}
      - {flow: metered-connection-read, as: read}
    expect:
      - "!steps.report.result.value.changed && !steps.read.result.value.metered && state['metered-connection-main-service'].initialized"
