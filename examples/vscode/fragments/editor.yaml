  summary: ViewModel.executeCommands through _executeCursorEdit
  sources:
  - src/vs/editor/common/viewModel/viewModelImpl.ts:1202-1208
  request:
    type: object
    required:
    - uri
    - edits
    properties:
      uri:
        type: string
      edits:
        type: array
        items:
          $ref: EditorTextEdit
      read_only:
        type: boolean
      source:
        type: string
  behavior:
  - if: input.read_only
    then:
    - call: code-editor-widget.record-read-only-attempt
    - return:
        applied: false
  - call: cursors-controller.execute-edits
    input:
      uri: = input.uri
      edits: = input.edits
      source: = input.source
  - return:
      applied: true
- component: cursors-controller
  name: type
  kind: function
  summary: 'CursorsController.type: TypeOperations build an insert at each cursor; pushEditOperations; cursors move past the text'
  sources:
  - src/vs/editor/common/cursor/cursor.ts:564-585
  - src/vs/editor/common/cursor/cursor.ts:486
  request:
    type: object
    required:
    - uri
    - text
    properties:
      uri:
        type: string
      text:
        type: string
  behavior:
  - call: text-model.push-edit-operations
    input:
      uri: = input.uri
      source: type
      edits:
      - range:
          start_line: = state.line
          start_column: = state.column
          end_line: = state.line
          end_column: = state.column
        text: = input.text
  - set:
      state.column: '= input.text.contains(''\n'') ? 1 : state.column + size(input.text)'
      state.line: = state.line + size(input.text.split('\n')) - 1
      state.last_source: type
- component: cursors-controller
  name: execute-edits
  kind: function
  summary: 'CursorsController.executeEdits / _executeEditOperation: pushEditOperations with the computed edits'
  sources:
  - src/vs/editor/common/cursor/cursor.ts:354-394
  request:
    type: object
    required:
    - uri
    - edits
    properties:
      uri:
        type: string
      edits:
        type: array
        items:
          $ref: EditorTextEdit
      source:
        type: string
  behavior:
  - set:
      state.last_source: '= has(input.source) ? input.source : ''unknown'''
  - call: text-model.push-edit-operations
    input:
      uri: = input.uri
      edits: = input.edits
      source: = state.last_source
- component: cursors-controller
  name: set-cursor-states
  kind: function
  summary: 'CursorsController.setStates: cursor movement and selection commands set new cursor states'
  sources:
  - src/vs/editor/common/cursor/cursor.ts
  request:
    type: object
    properties:
      source:
        type: string
        examples:
        - cursorLeft
      line:
        type: integer
      column:
        type: integer
      cursor_count:
        type: integer
      selection:
        type:
        - object
        - 'null'
        description: '{start_line, start_column, end_line, end_column}; null or absent collapses the selection at the cursor'
  behavior:
  - set:
      state.last_source: '= has(input.source) ? input.source : ''api'''
      state.line: '= has(input.line) ? input.line : state.line'
      state.column: '= has(input.column) ? input.column : state.column'
      state.cursor_count: '= has(input.cursor_count) ? input.cursor_count : state.cursor_count'
      state.selection: '= has(input.selection) ? input.selection : null'
- component: cursors-controller
  name: get-position
  kind: function
  summary: Primary cursor position (editor.getPosition)
  sources:
  - src/vs/editor/common/cursor/cursor.ts
  response:
