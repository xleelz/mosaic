    properties:
      line:
        type: integer
      column:
        type: integer
      cursor_count:
        type: integer
      selection:
        type:
        - object
        - 'null'
  behavior:
  - return:
      line: = state.line
      column: = state.column
      cursor_count: = state.cursor_count
      selection: '= has(state.selection) ? state.selection : null'
- component: editor-contribution-registry
  name: get-editor-command
  kind: function
  summary: EditorExtensionsRegistry.getEditorCommand / the command registry lookup; an unknown id is command-not-found
  sources:
  - src/vs/editor/browser/editorExtensions.ts:528-531
  request:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
        - cursorLeft
  response:
    type: object
    properties:
      target:
        type: string
      kind:
        type: string
      writable:
        type: boolean
  errors:
  - code: command-not-found
    status: 0
    retryable: false
  store:
    table: editor_commands
    op: get
    key: = input.command_id
    not_found: command-not-found
- component: editor-command
  name: run-command
  kind: function
  summary: 'The registered handler (Command.register -> runCommand -> EditorCommand.runEditorCommand): focused or active editor, else nothing; precondition; then the command''s runEditorCommand. CommandsRegistry
    API commands run directly.'
  sources:
  - src/vs/editor/browser/editorExtensions.ts:302-326
  - src/vs/editor/browser/editorExtensions.ts:159
  request:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
        - cursorLeft
      args:
        description: an object, or the positional list the command service passes
  response:
    type: object
    properties:
      ran:
        type: boolean
      reason:
        type: string
      command_id:
        type: string
  errors:
  - code: command-not-found
    status: 0
    retryable: false
  behavior:
  - call: editor-contribution-registry.get-editor-command
    input:
      command_id: = input.command_id
    as: cmd
  - if: vars.cmd.value.kind == 'api'
    then:
    - title: 'CommandsRegistry handler (API command): runs without a focused editor'
      source: src/vs/editor/contrib/format/browser/format.ts:469-483
      call: = vars.cmd.value.target
      targets:
      - code-action-model.cmd--executecodeactionprovider
      - code-lens-model.cmd--executecodelensprovider
      - color-detector.cmd--executecolorpresentationprovider
      - color-detector.cmd--executedocumentcolorprovider
      - folding-controller.cmd--executefoldingrangeprovider
      - format.cmd--executeformatdocumentprovider
      - format.cmd--executeformatontypeprovider
      - format.cmd--executeformatrangeprovider
      - get-semantic-tokens.cmd--providedocumentrangesemantictokens
      - get-semantic-tokens.cmd--providedocumentrangesemantictokenslegend
      - get-semantic-tokens.cmd--providedocumentsemantictokens
      - get-semantic-tokens.cmd--providedocumentsemantictokenslegend
      - inlay-hints-controller.cmd--executeinlayhintprovider
      - link-detector.cmd--executelinkprovider
      - outline-model-service.cmd--executedocumentsymbolprovider
      - parameter-hints-controller.cmd--executesignaturehelpprovider
      - smart-select-controller.cmd--executeselectionrangeprovider
      - suggest-model.cmd--executecompletionitemprovider
      input:
        command_id: = input.command_id
        args: '= has(input.args) ? input.args : {}'
    - return:
        ran: true
        reason: api
        command_id: = input.command_id
  - call: code-editor-widget.has-text-focus
    as: ed
  - if: '!vars.ed.value.found'
    then:
    - title: 'No focused or active editor: well, at least we tried'
      source: src/vs/editor/browser/editorExtensions.ts:311-315
      return:
        ran: false
        reason: no-editor
        command_id: = input.command_id
  - if: vars.cmd.value.writable && vars.ed.value.read_only
    then:
    - title: Precondition (EditorContextKeys.writable) does not hold
      source: src/vs/editor/browser/editorExtensions.ts:318-322
      return:
        ran: false
        reason: precondition
        command_id: = input.command_id
  - title: runEditorCommand on the focused editor
    source: src/vs/editor/browser/editorExtensions.ts:324
    call: = vars.cmd.value.target
    targets:
    - bracket-matching-controller.cmd-editor-action-jumptobracket
