- component: code-action-model
  name: cmd--executecodeactionprovider
  kind: function
  summary: '_executeCodeActionProvider: API command (vscode.execute* in the extension host) that queries the registered codeAction providers for a resource'
  sources:
  - src/vs/editor/contrib/codeAction/browser/codeAction.ts:346
  request:
    type: object
    properties:
      command_id:
        type: string
      args:
        description: the positional arguments [resource, ...] or an object
  attributes:
    command_id: _executeCodeActionProvider
  behavior:
  - title: Resolve a model reference for the resource (ITextModelService.createModelReference)
    source: src/vs/editor/contrib/codeAction/browser/codeAction.ts:346
    call: text-model-resolver-service.create-model-reference
    input:
      resource: '= !has(input.args) ? ''file:///work/app/src/main.ts'' : (type(input.args) == list ? (size(input.args) > 0 && type(input.args[0]) == string ? input.args[0] : ''file:///work/app/src/main.ts'')
        : (type(input.args) == map && ''resource'' in input.args ? input.args.resource : ''file:///work/app/src/main.ts''))'
  - call: language-features-service.invoke-providers
    as: r
    input:
      feature: codeAction
      rpc: provide-code-actions
      resource: '= !has(input.args) ? ''file:///work/app/src/main.ts'' : (type(input.args) == list ? (size(input.args) > 0 && type(input.args[0]) == string ? input.args[0] : ''file:///work/app/src/main.ts'')
        : (type(input.args) == map && ''resource'' in input.args ? input.args.resource : ''file:///work/app/src/main.ts''))'
      language_id: '= has(input.args) && type(input.args) == map && ''language_id'' in input.args ? input.args.language_id : ''typescript'''
  - return: = vars.r.value
