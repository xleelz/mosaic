    properties:
      uri:
        type: string
      action:
        type: string
        enum:
        - fold
        - unfold
        - toggle
        - fold-all
        - unfold-all
      line:
        type: integer
        default: 1
  behavior:
  - call: folding-controller.get-folding-model
    input:
      uri: = input.uri
    as: fm
  - if: '!vars.fm.value.enabled'
    then:
    - title: 'No folding model: the action does nothing'
      source: src/vs/editor/contrib/folding/browser/folding.ts:556-557
      return:
        changed: 0
  - call: folding-model.toggle-collapse-state
    input:
      uri: = input.uri
      action: = input.action
      line: '= has(input.line) ? input.line : 1'
    as: t
  - return: = vars.t.value
- component: code-editor-widget
  name: reveal
  kind: function
  summary: Scroll commands (scrollLineUp, editorScroll, revealLine ...) change only the viewport scroll position
  sources:
  - src/vs/editor/browser/coreCommands.ts:1427-1430
  request:
    type: object
    properties:
      source:
        type: string
        examples:
        - scrollLineDown
  behavior:
  - set:
      state.last_command: '= has(input.source) ? input.source : ''reveal'''
- component: find-controller
  name: move-to-match
  kind: function
  summary: 'MatchFindAction: start the find model from the selection when there is none, then move to the next/previous match'
  sources:
  - src/vs/editor/contrib/find/browser/findController.ts:703-716
  - src/vs/editor/contrib/find/browser/findController.ts:388-394
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
  behavior:
  - if: '!state.has_model'
    then:
    - call: find-controller.start
      input:
        uri: = input.uri
  - return:
      moved: = state.matches_count > 0
- component: find-controller
  name: replace-one
  kind: function
  summary: 'CommonFindController.replace -> FindModelBoundToEditorModel.replace: replace the current match, then research'
  sources:
  - src/vs/editor/contrib/find/browser/findController.ts:412-418
  - src/vs/editor/contrib/find/browser/findModel.ts:481-500
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
  behavior:
  - if: '!state.has_model || state.matches_count == 0'
    then:
    - return:
        replaced: false
  - call: text-model.get-value
    input:
      uri: = input.uri
    as: m
  - set:
      vars.lines: = vars.m.value.value.split('\n')
  - call: code-editor-widget.execute-commands
    input:
      uri: = input.uri
      source: replace
      edits:
      - range:
          start_line: 1
          start_column: 1
          end_line: = size(vars.lines)
          end_column: = size(vars.lines[size(vars.lines) - 1]) + 1
        text: = vars.m.value.value.replace(state.search_string, state.replace_string, 1)
  - call: find-model.research
    input:
      uri: = input.uri
      search_string: = state.search_string
      match_case: = state.match_case
    as: r
  - set:
      state.matches_count: = vars.r.value.matches_count
  - return:
      replaced: true
