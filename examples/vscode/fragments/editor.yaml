scenarios:
- id: editor-type-text-then-read
  name: Typing inserts at the cursor and bumps the version
  fixtures:
  - editor-main-open
  steps:
  - flow: editor-type-text
    as: t
  - flow: editor-read-model
    as: r
  expect:
  - steps.r.result.value.value.startsWith('// import { add }')
  - steps.r.result.value.version_id == 2 && steps.r.result.value.alternative_version_id == 2
  - state['cursors-controller@w1'].column == 4
  - trace.exists(e, e.type == 'call.start' && e.interface == 'edit-stack.push-edit-operation')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.on-model-content-changed' && e.input.resource == 'file:///work/app/src/main.ts' && !e.input.is_undoing_or_redoing)
- id: editor-set-value-then-read
  name: setValue replaces the text, bumps versionId and alternativeVersionId, and fires one flush change
  fixtures:
  - editor-main-open
  steps:
  - flow: editor-set-value
    as: sv
  - flow: editor-read-model
    as: r
  expect:
  - steps.r.result.value.value == "import { add } from './util';\nconsole.log(add(2, 2));\n"
  - steps.r.result.value.version_id == 2 && steps.r.result.value.alternative_version_id == 2
  - steps.sv.result.value.version_id == 2
  - trace.exists(e, e.type == 'publish' && e.interface == 'text-model.on-did-change-content' && e.input.is_flush)
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''edit-stack.push-edit-operation'')'
- id: editor-set-value-clears-undo
  name: setValue after typing drops the undo history, so undo does nothing
  fixtures:
  - editor-main-open
  steps:
  - flow: editor-type-text
    as: t
  - flow: editor-set-value
    as: sv
  - flow: editor-run-command
    as: u
    input:
      command_id: undo
  - flow: editor-read-model
    as: r
  expect:
  - steps.r.result.value.value == "import { add } from './util';\nconsole.log(add(2, 2));\n"
  - steps.r.result.value.version_id == 3 && steps.r.result.value.alternative_version_id == 3
  - '!(''file:///work/app/src/main.ts'' in state[''edit-stack@w1''].stacks)'
- id: editor-set-value-disposed
  name: setValue on a resource without a model fails with 'Model is disposed!'
  flow: editor-set-value
  fixtures:
  - editor-main-open
  input:
    uri: file:///work/app/src/gone.ts
  expect:
  - '!result.ok && result.error.code == ''model-is-disposed'''
  - state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id == 1
- id: editor-mouse-double-click-bracket-content
  name: Double-click right after '{' selects the content inside the braces, not the word (viewController.test.ts:118)
  fixtures:
  - editor-main-open
  state:
    text-model@w1:
      models:
        file:///work/app/src/main.ts:
          value: var x = { hello };
          version_id: 1
          alternative_version_id: 1
          language_id: typescript
  steps:
  - flow: editor-mouse-click
    as: dbl
  - flow: editor-read-cursor
    as: cur
  expect:
  - steps.dbl.result.value.action == 'select-block'
  - steps.cur.result.value.selection.start_line == 1 && steps.cur.result.value.selection.start_column == 10 && steps.cur.result.value.selection.end_column == 17
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''core-navigation-commands.cmd--wordselect'')'
- id: editor-mouse-double-click-before-close-bracket
  name: Double-click right before '}' selects the same block, scanning backwards to its '{'
  fixtures:
  - editor-main-open
  state:
    text-model@w1:
      models:
        file:///work/app/src/main.ts:
          value: var x = { hello };
          version_id: 1
          alternative_version_id: 1
          language_id: typescript
  steps:
  - flow: editor-mouse-click
    as: dbl
    input:
      column: 17
  - flow: editor-read-cursor
    as: cur
