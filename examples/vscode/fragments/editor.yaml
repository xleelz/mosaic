- component: code-editor-contributions
  name: instantiate-some
  kind: function
  summary: '_instantiateSome: once per mode, create every pending contribution of that mode; a failing constructor is reported (onUnexpectedError) and skipped'
  sources:
  - src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:120-131
  - src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:143-165
  request:
    type: object
    required:
    - mode
    properties:
      mode:
        type: string
        enum:
        - eager
        - after-first-render
        - before-first-interaction
        - eventually
        - lazy
  behavior:
  - if: input.mode in state.finished
    then:
    - title: already done with this instantiation
      source: src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:121-124
      return:
        instantiated: 0
  - set:
      state.finished: '= merge(state.finished, {input.mode: true})'
  - call: editor-contribution-registry.get-editor-contributions
    as: reg
  - set:
      vars.n: 0
  - foreach: = vars.reg.value.contributions.filter(c, c.mode == input.mode)
    as: c
    steps:
    - call: = vars.c.component + '.construct'
      targets:
      - auto-indent-on-paste.construct
      - bracket-matching-controller.construct
      - code-action-controller.construct
      - code-lens-contribution.construct
      - color-detector.construct
      - content-hover-controller.construct
      - context-menu-controller.construct
      - copy-paste-controller.construct
      - cursor-undo-redo-controller.construct
      - drag-and-drop-controller.construct
      - drop-into-editor-controller.construct
      - find-controller.construct
      - floating-editor-toolbar.construct
      - folding-controller.construct
      - format-on-paste.construct
      - format-on-type.construct
      - glyph-hover-controller.construct
      - goto-definition-at-position-editor-contribution.construct
      - hover-color-picker-contribution.construct
      - in-place-replace-controller.construct
      - inlay-hints-controller.construct
      - inline-completions-controller.construct
      - light-bulb-widget.construct
      - link-detector.construct
      - linked-editing-contribution.construct
      - long-lines-helper.construct
      - marker-controller.construct
      - marker-decorations-contribution.construct
      - marker-selection-status.construct
      - message-controller.construct
      - middle-scroll-controller.construct
      - multi-cursor-selection-controller.construct
      - parameter-hints-controller.construct
      - peek-context-controller.construct
      - placeholder-text-contribution.construct
      - read-only-message-controller.construct
      - rename-controller.construct
      - section-header-detector.construct
      - selection-anchor-controller.construct
      - selection-highlighter.construct
      - smart-select-controller.construct
      - snippet-controller2.construct
      - standalone-color-picker-controller.construct
      - sticky-scroll-controller.construct
      - suggest-controller.construct
      - unicode-highlighter.construct
      - unusual-line-terminators-detector.construct
      - viewport-semantic-tokens-contribution.construct
      - word-highlighter-contribution.construct
      as: inst
      on_error:
      - title: 'onUnexpectedError: the contribution is skipped'
        source: src/vs/editor/browser/widget/codeEditor/codeEditorContributions.ts:161-163
        continue: true
    - set:
        state.instances: = state.instances + [vars.c.id]
        vars.n: = vars.n + 1
  - return:
      instantiated: = vars.n
