- component: suggest-model
  name: provide-suggestion-items
  kind: function
  summary: 'provideSuggestionItems: provider groups of equal score are asked in order, each group all at once; the first group that yields items ends the loop; provider errors are swallowed; a canceled
    token rejects with CancellationError'
  sources:
  - src/vs/editor/contrib/suggest/browser/suggest.ts:214-330
  - src/vs/editor/contrib/suggest/browser/suggest.ts:293-318
  request:
    type: object
    required:
    - uri
    - language_id
    properties:
      uri:
        type: string
      language_id:
        type: string
      token:
        type: object
        properties:
          canceled:
            type: boolean
            default: false
  response:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
  errors:
  - code: canceled
    status: 0
    retryable: false
  behavior:
  - call: language-features-service.ordered
    input:
      feature: completion
      language_id: = input.language_id
    as: o
  - set:
      vars.items: []
      vars.groups: = vars.o.value.providers.map(p, p.group).distinct().sort().reverse()
  - foreach: = vars.groups
    as: g
    steps:
    - parallel: = vars.o.value.providers.filter(p, p.group == vars.g)
      as: p
      steps:
      - call: ext-host-language-features.provide-completion-items
        'on': = 'eh' + self.substring(1)
        input:
          handle: = vars.p.handle
          resource: = input.uri
          token:
            canceled: false
        as: r
        on_error:
        - title: onUnexpectedExternalError
          source: src/vs/editor/contrib/suggest/browser/suggest.ts:313-315
          return: []
      - return: = vars.r.value.suggestions
      join:
        need: all
      as_result: res
    - set:
        vars.items: = vars.items + vars.res.results.filter(x, x.ok).map(x, x.value).flatten()
    - if: size(vars.items) > 0
      then:
      - title: 'didAddResult: stop asking lower-scored groups'
        source: src/vs/editor/contrib/suggest/browser/suggest.ts:320-322
        break: true
  - if: has(input.token) && input.token.canceled
    then:
    - title: 'Token canceled: reject with CancellationError'
      source: src/vs/editor/contrib/suggest/browser/suggest.ts:326-329
      fail:
        code: canceled
        message: Canceled
  - return:
      items: = vars.items
