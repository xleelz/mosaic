- component: view-controller
  name: dispatch-mouse
  kind: function
  summary: 'ViewController.dispatchMouse: by click count, 4+ selects all, 3 selects the line, 2 selects the block inside brackets (editor.doubleClickSelectsBlock) or else the word, 1 moves the cursor; the multi-cursor modifier adds a cursor instead.'
  sources:
  - src/vs/editor/browser/view/viewController.ts:217-276
  - src/vs/editor/browser/view/viewController.ts:140-158
  request:
    type: object
    required:
    - uri
    - line
    - column
    - mouse_down_count
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      line:
        type: integer
        examples:
        - 1
      column:
        type: integer
        examples:
        - 10
      mouse_down_count:
        type: integer
        examples:
        - 2
      in_selection_mode:
        type: boolean
        default: false
      multicursor_modifier:
        type: boolean
        default: false
  response:
    type: object
    properties:
      action:
        type: string
      selection:
        type:
        - object
        - 'null'
  errors:
  - code: model-is-disposed
    status: 0
    retryable: false
  behavior:
  - set:
      vars.sel_mode: '= has(input.in_selection_mode) && input.in_selection_mode'
      vars.multi: '= has(input.multicursor_modifier) && input.multicursor_modifier'
      vars.pos_args:
        position:
          lineNumber: = input.line
          column: = input.column
  - if: input.mouse_down_count >= 4
    then:
    - title: Four or more clicks select all
      source: src/vs/editor/browser/view/viewController.ts:243-244
      call: text-model.get-value
      input:
        uri: = input.uri
      as: all
    - set:
        vars.all_lines: = vars.all.value.value.split('\n')
    - call: cursors-controller.set-cursor-states
      input:
        source: mouse
        line: = size(vars.all_lines)
        column: = size(vars.all_lines[size(vars.all_lines) - 1]) + 1
        selection:
          start_line: 1
          start_column: 1
          end_line: = size(vars.all_lines)
          end_column: = size(vars.all_lines[size(vars.all_lines) - 1]) + 1
    - return:
        action: select-all
        selection: null
  - if: input.mouse_down_count == 3
    then:
    - title: Triple click selects the line (_lineSelect, or the drag / last-cursor variants)
      source: src/vs/editor/browser/view/viewController.ts:245-257
      call: core-navigation-commands.cmd--lineselect
      input:
        command_id: _lineSelect
        uri: = input.uri
        args: = vars.pos_args
    - return:
        action: line-select
        selection: null
  - if: input.mouse_down_count == 2
    then:
    - if: vars.multi
      then:
      - title: Double click with the multi-cursor modifier selects a word for a new last cursor
        source: src/vs/editor/browser/view/viewController.ts:261-262
        call: core-navigation-commands.cmd-lastcursorwordselect
        input:
          command_id: lastCursorWordSelect
          uri: = input.uri
          args: = vars.pos_args
      - return:
          action: last-cursor-word-select
          selection: null
    - if: vars.sel_mode
      then:
      - title: Double click while dragging extends by words (_wordSelectDrag)
        source: src/vs/editor/browser/view/viewController.ts:264-265
        call: core-navigation-commands.cmd--wordselectdrag
        input:
          command_id: _wordSelectDrag
          uri: = input.uri
          args: = vars.pos_args
      - return:
          action: word-select-drag
          selection: null
    - set:
        vars.selection: null
    - if: config['editor-double-click-selects-block']
      then:
      - call: text-model.get-value
        input:
          uri: = input.uri
        as: m
      - set:
          vars.v: = vars.m.value.value
      - set:
          vars.lines: = vars.v.split('\n')
      - set:
          vars.off: = sum(vars.lines.slice(0, input.line - 1).map(x, size(x) + 1)) + input.column - 1
          vars.opens: '([{'
          vars.closes: ')]}'
          vars.depth: 1
          vars.open_off: -1
          vars.close_off: -1
      - if: input.column > 1 && vars.opens.contains(vars.v.substring(vars.off - 1, vars.off))
        then:
        - title: '_trySelectBracketContent: right after an opening bracket, matchBracket finds its closing partner'
          source: src/vs/editor/browser/view/viewController.ts:141-147
          set:
            vars.k: = vars.opens.indexOf(vars.v.substring(vars.off - 1, vars.off))
        - foreach: = vars.v.substring(vars.off).split('')
          as: ch
          index: i
          max: 1000
          steps:
          - if: vars.ch == vars.opens.substring(vars.k, vars.k + 1)
            then:
            - set:
                vars.depth: = vars.depth + 1
          - if: vars.ch == vars.closes.substring(vars.k, vars.k + 1)
            then:
            - set:
                vars.depth: = vars.depth - 1
          - if: vars.depth == 0
            then:
            - set:
                vars.open_off: = vars.off
                vars.close_off: = vars.off + vars.i
            - break: true
      - if: vars.close_off < 0 && vars.off < size(vars.v) && vars.closes.contains(vars.v.substring(vars.off, vars.off + 1))
        then:
        - title: '_trySelectBracketContent: right before a closing bracket, matchBracket finds its opening partner'
          source: src/vs/editor/browser/view/viewController.ts:150-155
          set:
            vars.k: = vars.closes.indexOf(vars.v.substring(vars.off, vars.off + 1))
            vars.depth: 1
        - foreach: = vars.v.substring(0, vars.off).split('').reverse()
          as: ch
          index: i
          max: 1000
          steps:
          - if: vars.ch == vars.closes.substring(vars.k, vars.k + 1)
            then:
            - set:
                vars.depth: = vars.depth + 1
          - if: vars.ch == vars.opens.substring(vars.k, vars.k + 1)
            then:
            - set:
                vars.depth: = vars.depth - 1
          - if: vars.depth == 0
            then:
            - set:
                vars.open_off: = vars.off - vars.i
                vars.close_off: = vars.off
            - break: true
      - if: vars.close_off >= 0
        then:
        - title: The selection runs from the end of the opening bracket to the start of the closing one
          source: src/vs/editor/browser/view/viewController.ts:144
          set:
            vars.pre_s: = vars.v.substring(0, vars.open_off)
            vars.pre_e: = vars.v.substring(0, vars.close_off)
        - set:
            vars.selection:
              start_line: = size(vars.pre_s.split('\n'))
              start_column: = vars.open_off - vars.pre_s.lastIndexOf('\n')
              end_line: = size(vars.pre_e.split('\n'))
              end_column: = vars.close_off - vars.pre_e.lastIndexOf('\n')
    - if: vars.selection != null
      then:
      - title: A bracket block was found, select it (_select)
        source: src/vs/editor/browser/view/viewController.ts:273-274
        call: cursors-controller.set-cursor-states
        input:
          source: mouse
          line: = vars.selection.end_line
          column: = vars.selection.end_column
          selection: = vars.selection
      - return:
          action: select-block
          selection: = vars.selection
    - title: No block next to the click, so select the word (_wordSelect)
      source: src/vs/editor/browser/view/viewController.ts:275-277
      call: core-navigation-commands.cmd--wordselect
      input:
        command_id: _wordSelect
        uri: = input.uri
        args: = vars.pos_args
    - call: cursors-controller.get-position
      as: after
    - return:
        action: word-select
        selection: = vars.after.value.selection
  - if: vars.multi
    then:
    - call: cursors-controller.get-position
      as: cur
    - title: Single click with the multi-cursor modifier adds a cursor (_createCursor)
      source: src/vs/editor/browser/view/viewController.ts:282-292
      call: cursors-controller.set-cursor-states
      input:
        source: mouse
        line: = input.line
        column: = input.column
        cursor_count: = vars.cur.value.cursor_count + 1
    - return:
        action: create-cursor
        selection: null
  - title: A single click moves the cursor (_moveTo)
    source: src/vs/editor/browser/view/viewController.ts:306-308
    call: core-navigation-commands.cmd--moveto
    input:
      command_id: _moveTo
      uri: = input.uri
      args: = vars.pos_args
  - return:
      action: move-to
      selection: null
- component: core-navigation-commands
  name: cmd--wordselect
  kind: function
  summary: _wordSelect ('_wordSelect')
  sources:
  - src/vs/editor/browser/coreCommands.ts:1658
  request: EditorCommandInvocation
  attributes:
    command_id: _wordSelect
  behavior:
  - set:
      vars.a: '= !has(input.args) ? {} : (type(input.args) == list ? (size(input.args) > 0 ? input.args[0] : {}) : input.args)'
  - if: '!has(vars.a.position)'
    then:
    - title: 'WordCommand without a position does nothing'
      source: src/vs/editor/browser/coreCommands.ts:1640-1643
      return:
        selected: false
  - call: text-model.get-value
    input:
      uri: = input.uri
    as: m
  - set:
      vars.ln: = vars.a.position.lineNumber
      vars.col: = vars.a.position.column
  - set:
      vars.text: = vars.m.value.value.split('\n')[vars.ln - 1]
  - set:
      vars.left: = vars.text.substring(0, vars.col - 1)
      vars.right: = vars.text.substring(vars.col - 1)
      vars.lw: 0
      vars.rw: 0
      vars.word_re: '^[A-Za-z0-9_$]$'
  - title: _findPreviousWordOnLine / _findNextWordOnLine (default word separators); count the word characters touching the position on each side
    source: src/vs/editor/common/cursor/cursorWordOperations.ts:741-744
    foreach: = vars.left.split('').reverse()
    as: ch
    max: 1000
    steps:
    - if: '!vars.ch.matches(vars.word_re)'
      then:
      - break: true
    - set:
        vars.lw: = vars.lw + 1
  - foreach: = vars.right.split('')
    as: ch
    max: 1000
    steps:
    - if: '!vars.ch.matches(vars.word_re)'
      then:
      - break: true
    - set:
        vars.rw: = vars.rw + 1
  - if: vars.lw == 0 && vars.rw == 0
    then:
    - title: 'Not touching a regular word: select the gap from the end of the previous word to the start of the next one'
      source: src/vs/editor/common/cursor/cursorWordOperations.ts:767-777
      foreach: = vars.left.split('').reverse()
      as: ch
      max: 1000
      steps:
      - if: vars.ch != ' ' && vars.ch != '\t'
        then:
        - break: true
      - set:
          vars.lw: = vars.lw + 1
    - foreach: = vars.right.split('')
      as: ch
      max: 1000
      steps:
      - if: vars.ch != ' ' && vars.ch != '\t'
        then:
        - break: true
      - set:
          vars.rw: = vars.rw + 1
  - title: 'Run _wordSelect: pushStackElement, then one cursor whose selection is the word (SelectionStartKind.Word), cursor at its end'
    source: src/vs/editor/browser/coreCommands.ts:1644-1651
    call: cursors-controller.set-cursor-states
    input:
      source: _wordSelect
      line: = vars.ln
      column: = vars.col + vars.rw
      cursor_count: 1
      selection:
        start_line: = vars.ln
        start_column: = vars.col - vars.lw
        end_line: = vars.ln
        end_column: = vars.col + vars.rw
  - return:
      selected: true
