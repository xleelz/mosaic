schemas:
- id: EditorRange
  summary: 'An IRange: 1-based line and column, end exclusive (src/vs/editor/common/core/range.ts)'
  schema:
    type: object
    required:
    - start_line
    - start_column
    - end_line
    - end_column
    properties:
      start_line:
        type: integer
        minimum: 1
        examples:
        - 1
      start_column:
        type: integer
        minimum: 1
        examples:
        - 1
      end_line:
        type: integer
        minimum: 1
        examples:
        - 1
      end_column:
        type: integer
        minimum: 1
        examples:
        - 1
- id: EditorCommandInvocation
  summary: 'What EditorCommand.runEditorCommand hands a command handler: the focused editor''s model and the args'
  schema:
    type: object
    properties:
      command_id:
        type: string
        examples:
        - cursorLeft
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      read_only:
        type: boolean
        default: false
      args:
        description: 'the command arguments: an object, or the positional list the command service passes'
- id: EditorProviderCall
  summary: 'A language-feature query: which feature, which ext host RPC, for which model'
  schema:
    type: object
    required:
    - feature
    - rpc
    - resource
    - language_id
    properties:
      feature:
        type: string
        examples:
        - hover
      rpc:
        type: string
        examples:
        - provide-hover
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      language_id:
        type: string
        examples:
        - typescript
      args:
        type: object
- id: EditorProviderResults
  schema:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
      provider_count:
        type: integer
interfaces:
- component: text-model
  name: get-value
  kind: function
  summary: TextModel.getValue with versionId; a disposed or unknown model throws 'Model is disposed!'
  sources:
  - src/vs/editor/common/model/textModel.ts:799-802
  - src/vs/editor/common/model/textModel.ts:443-446
  request:
    type: object
    properties:
      uri:
        type: string
        examples:
        - file:///work/app/src/main.ts
      resource:
        type: string
        description: accepted as an alias of uri (shared shape)
  response:
    type: object
    properties:
      uri:
        type: string
      value:
        type: string
      version_id:
        type: integer
      alternative_version_id:
        type: integer
      language_id:
        type: string
      default_eol:
        type: string
        description: the model's EOL preference from creation (LF or CRLF)
  errors:
  - code: model-is-disposed
    status: 0
    retryable: false
  behavior:
  - set:
      vars.uri: '= has(input.uri) ? input.uri : input.resource'
  - if: '!(vars.uri in state.models)'
    then:
    - title: Model is disposed
      source: src/vs/editor/common/model/textModel.ts:443-446
      fail:
        code: model-is-disposed
        message: Model is disposed!
  - set:
      vars.m: = state.models[vars.uri]
  - return:
      uri: = vars.uri
      value: = vars.m.value
      version_id: = vars.m.version_id
      alternative_version_id: = vars.m.alternative_version_id
      language_id: = vars.m.language_id
      default_eol: '= has(vars.m.default_eol) ? vars.m.default_eol : ''LF'''
- component: text-model
  name: push-edit-operations
  kind: function
  summary: 'TextModel.pushEditOperations: validates the edits and hands them to the EditStack, which records undo data'
  sources:
  - src/vs/editor/common/model/textModel.ts:1340-1349
  - src/vs/editor/common/model/textModel.ts:1438
  request:
    type: object
    required:
    - edits
    properties:
      uri:
        type: string
      resource:
        type: string
      edits:
        type: array
        items:
          $ref: EditorTextEdit
      source:
        type: string
  response:
    type: object
    properties:
      version_id:
        type: integer
      changed:
        type: boolean
  errors:
  - code: model-is-disposed
    status: 0
    retryable: false
  behavior:
  - set:
      vars.uri: '= has(input.uri) ? input.uri : input.resource'
  - if: '!(vars.uri in state.models)'
    then:
    - title: Model is disposed
      source: src/vs/editor/common/model/textModel.ts:443-446
      fail:
        code: model-is-disposed
        message: Model is disposed!
  - title: EditStack.pushEditOperation applies the edits and appends them to the open undo element
    source: src/vs/editor/common/model/textModel.ts:1438
    call: edit-stack.push-edit-operation
    input:
      uri: = vars.uri
      edits: = input.edits
      source: '= has(input.source) ? input.source : ''unknown'''
    as: pushed
  - return: = vars.pushed.value
- component: text-model
  name: apply-edits
  kind: function
  summary: 'TextModel._doApplyEdits: apply the edits to the buffer; when content changed, bump versionId (alternativeVersionId follows) and fire onDidChangeContent synchronously'
  sources:
  - src/vs/editor/common/model/textModel.ts:1490-1524
  - src/vs/editor/common/model/textModel.ts:782-785
  request:
    type: object
    required:
    - edits
    properties:
      uri:
        type: string
      resource:
        type: string
      edits:
        type: array
        items:
          $ref: EditorTextEdit
  response:
    type: object
    properties:
      version_id:
        type: integer
      changed:
        type: boolean
  errors:
  - code: model-is-disposed
    status: 0
    retryable: false
  behavior:
  - set:
      vars.uri: '= has(input.uri) ? input.uri : input.resource'
  - if: '!(vars.uri in state.models)'
    then:
    - title: Model is disposed
      source: src/vs/editor/common/model/textModel.ts:443-446
      fail:
        code: model-is-disposed
        message: Model is disposed!
  - set:
      vars.value: = state.models[vars.uri].value
  - title: Apply edits from the last to the first so earlier offsets stay valid (the buffer applies them against the original positions)
    source: src/vs/editor/common/model/textModel.ts:1513
    foreach: = input.edits.reverse()
    as: e
    steps:
    - if: '!has(vars.e.range.start_line)'
      then:
      - title: '_validateEditOperations: an edit without a usable range is not applied (model assumption)'
        source: src/vs/editor/common/model/textModel.ts:1494
        continue: true
    - set:
        vars.lines: = vars.value.split('\n')
    - set:
        vars.s: = sum(vars.lines.slice(0, vars.e.range.start_line - 1).map(x, size(x) + 1)) + vars.e.range.start_column - 1
        vars.t: = sum(vars.lines.slice(0, vars.e.range.end_line - 1).map(x, size(x) + 1)) + vars.e.range.end_column - 1
    - set:
        vars.value: = vars.value.substring(0, vars.s) + vars.e.text + vars.value.substring(vars.t)
  - if: vars.value == state.models[vars.uri].value
    then:
    - title: 'No content change: versionId unchanged, no event'
      source: src/vs/editor/common/model/textModel.ts:1510
      return:
        version_id: = state.models[vars.uri].version_id
        changed: false
  - title: '_increaseVersionId: versionId + 1, alternativeVersionId = versionId'
    source: src/vs/editor/common/model/textModel.ts:782-785
    set:
      state.models: '= merge(state.models, {vars.uri: {''value'': vars.value, ''version_id'': state.models[vars.uri].version_id + 1, ''alternative_version_id'': state.models[vars.uri].version_id + 1}})'
  - title: Fire onDidChangeContent to listeners inline
    source: src/vs/editor/common/model/textModel.ts:481
    publish: text-model.on-did-change-content
    input:
      uri: = vars.uri
      version_id: = state.models[vars.uri].version_id
      is_undoing: false
      is_redoing: false
    delivery: sync
  - title: The text file model's content listener (TextFileEditorModel.onModelContentChanged) tracks the version and dirty state
    source: src/vs/editor/common/model/textModel.ts:481
    call: text-file-models.on-model-content-changed
    input:
      resource: = vars.uri
      value: = vars.value
      alternative_version_id: = state.models[vars.uri].alternative_version_id
      is_undoing_or_redoing: false
  - return:
      version_id: = state.models[vars.uri].version_id
      changed: true
- component: text-model
  name: apply-undo-redo
  kind: function
  summary: 'TextModel._applyUndo/_applyRedo: re-apply the element''s text, bump versionId and overwrite alternativeVersionId with the element''s'
  sources:
  - src/vs/editor/common/model/textModel.ts:1440-1481
  request:
    type: object
    required:
    - uri
    - value
    - alternative_version_id
    - is_undoing
    properties:
      uri:
        type: string
      value:
        type: string
      alternative_version_id:
        type: integer
      is_undoing:
        type: boolean
  response:
    type: object
    properties:
      version_id:
        type: integer
  behavior:
  - set:
      state.models: '= merge(state.models, {input.uri: {''value'': input.value, ''version_id'': state.models[input.uri].version_id + 1, ''alternative_version_id'': input.alternative_version_id}})'
  - publish: text-model.on-did-change-content
    input:
      uri: = input.uri
      version_id: = state.models[input.uri].version_id
      is_undoing: = input.is_undoing
      is_redoing: = !input.is_undoing
    delivery: sync
  - title: 'TextFileEditorModel.onModelContentChanged sees the undo/redo: back at the saved alternative version clears dirty'
    source: src/vs/editor/common/model/textModel.ts:1465-1478
    call: text-file-models.on-model-content-changed
    input:
      resource: = input.uri
      value: = input.value
      alternative_version_id: = input.alternative_version_id
      is_undoing_or_redoing: true
  - return:
      version_id: = state.models[input.uri].version_id
- component: text-model
  name: undo
  kind: function
  summary: TextModel.undo delegates to IUndoRedoService.undo(uri), which calls the last element's undo()
  sources:
  - src/vs/editor/common/model/textModel.ts:1604-1606
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
  behavior:
  - call: undo-redo-service.undo
    input:
      resource: = input.uri
    as: svc
  - if: vars.svc.value.undone == null
    then:
    - title: The service has no past element for this resource, so nothing is undone
      source: src/vs/editor/common/model/textModel.ts:1604-1606
      return:
        undone: false
  - title: The undo/redo service calls SingleModelEditStackElement.undo on this model's last element
    source: src/vs/editor/common/model/editStack.ts:212-223
    call: edit-stack.undo
    input:
      uri: = input.uri
    as: u
  - return: = vars.u.value
- component: text-model
  name: redo
  kind: function
