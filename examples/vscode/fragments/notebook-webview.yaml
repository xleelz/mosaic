  - component: notebook-cell-status-bar-service
    name: get-status-bar-items-for-cell
    kind: function
    summary: "Ask every provider of the view type (or '*') for a cell's items at once; a failing provider yields no items."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookCellStatusBarServiceImpl.ts:42-52"]
    request: {type: object, required: [uri, cell_index, view_type], properties: {uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}, cell_index: {type: integer, examples: [0]}, view_type: {type: string, examples: [jupyter-notebook]}}}
    response: {type: object, properties: {lists: {type: integer}, failed: {type: integer}}}
    behavior:
      - set: {vars.providers: "= state.providers.filter(p, p.view_type == input.view_type || p.view_type == '*')"}
      - parallel: "= vars.providers"
        as: provider
        steps:
          - call: ext-host-notebook-controller.provide-notebook-cell-status-bar-items
            on: "= 'eh' + self.substring(1)"
            input: {handle: "= vars.provider.handle", uri: "= input.uri", index: "= input.cell_index"}
            as: items
            on_error:
              - title: onUnexpectedExternalError, then an empty list
                source: "src/vs/workbench/contrib/notebook/browser/services/notebookCellStatusBarServiceImpl.ts:47-50"
                return: {items: []}
        join: {need: all}
        as_result: lists
      - return: {lists: "= size(vars.providers)", failed: "= vars.lists.results.filter(r, r.ok && has(r.value) && r.value != null && has(r.value.items) && size(r.value.items) == 0).size()"}

  - component: notebook-renderer-messaging-service
    name: receive-message
    kind: function
    summary: "A message from an extension to a renderer, for one editor or broadcast to all."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookRendererMessagingServiceImpl.ts:31-38"]
    request: {type: object, required: [renderer_id], properties: {editor_id: {type: string, default: ""}, renderer_id: {type: string, examples: [vscode.markdown-it-cell-attachment-renderer]}, message: {type: object}}}
    response: {type: object, properties: {delivered: {type: boolean}}}
    behavior:
      - if: "!has(input.editor_id) || input.editor_id == ''"
        then:
          - title: No editor id - every scoped messaging handler gets it
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookRendererMessagingServiceImpl.ts:32-35"
            return: {delivered: "= size(state.scoped) > 0"}
      - return: {delivered: "= input.editor_id in state.scoped"}

  - component: notebook-renderer-messaging-service
    name: post-message
    kind: function
    summary: "A renderer posts to its extension; the first message activates onRenderer:<id> and queues until activation finishes."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookRendererMessagingServiceImpl.ts:59-86"]
    request: {type: object, required: [editor_id, renderer_id], properties: {editor_id: {type: string}, renderer_id: {type: string, examples: [vscode.markdown-it-cell-attachment-renderer]}, message: {type: object}}}
    response: {type: object, properties: {queued: {type: boolean}}}
    behavior:
      - set: {state.scoped: "= merge(state.scoped, {input.editor_id: true})"}
      - set: {vars.msg: "= {'renderer_id': input.renderer_id, 'editor_id': input.editor_id}"}
      - if: "!(input.renderer_id in state.activations)"
        then:
          - title: prepare() starts activating the renderer's extension
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookRendererMessagingServiceImpl.ts:41-56"
            set: {state.activations: "= merge(state.activations, {input.renderer_id: {'done': false, 'queue': [vars.msg]}})"}
          - emit: notebook-renderer-messaging-service.finish-activation
            input: {renderer_id: "= input.renderer_id"}
          - return: {queued: true}
      - if: "!state.activations[input.renderer_id].done"
        then:
          - source: "src/vs/workbench/contrib/notebook/browser/services/notebookRendererMessagingServiceImpl.ts:82-84"
            set: {state.activations: "= merge(state.activations, {input.renderer_id: {'queue': state.activations[input.renderer_id].queue + [vars.msg]}})"}
          - return: {queued: true}
      - source: "src/vs/workbench/contrib/notebook/browser/services/notebookRendererMessagingServiceImpl.ts:79-81"
        set: {state.sent: "= state.sent + [vars.msg]"}
      - return: {queued: false}

  - component: notebook-renderer-messaging-service
