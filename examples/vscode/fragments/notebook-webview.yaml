      - return: {notebook_uri: "= vars.uris.value.notebook_uri", input_uri: "= vars.uris.value.input_uri"}

  - component: interactive-window-actions
    name: cmd-interactive-execute
    kind: command
    summary: "interactive.execute(resource?): append the input box as a new code cell, record history, clear the input and run the cell."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactive.contribution.ts:452-585"]
    request: {type: object, properties: {args: {type: array, items: {}, default: []}, notebook_uri: {type: string, default: ""}}}
    response: {type: object}
    behavior:
      - title: The window is the resource argument, else the active editor
