  - component: interactive-editor-input
    name: resolve
    kind: function
    summary: "Announce the interactive document, then resolve its untitled 'interactive' notebook; the window becomes the active editor."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveEditorInput.ts:150-180"]
    request: {type: object, required: [notebook_uri, input_uri], properties: {notebook_uri: {type: string, examples: ["untitled:/Interactive-1.interactive"]}, input_uri: {type: string, examples: ["vscode-interactive-input:/InteractiveInput-1"]}, language_id: {type: string, examples: [python]}}}
    response: {type: object, properties: {resolved: {type: boolean}}}
    behavior:
      - source: "src/vs/workbench/contrib/interactive/browser/interactiveEditorInput.ts:172"
        call: interactive-document-service.will-create-interactive-document
        input: {notebook_uri: "= input.notebook_uri", input_uri: "= input.input_uri", language_id: "= has(input.language_id) ? input.language_id : 'plaintext'"}
      - call: notebook-model-resolver-service-impl.resolve
        input: {resource: "= input.notebook_uri", view_type: interactive}
      - set:
          state.windows: "= merge(state.windows, {input.notebook_uri: {'input_uri': input.input_uri, 'value': ''}})"
          state.active: "= input.notebook_uri"
      - call: notebook-editor-widget.set-model
        input: {uri: "= input.notebook_uri"}
      - return: {resolved: true}

  - component: interactive-editor-input
    name: set-input-value
    kind: function
    summary: "Set the text of a window's input box (the input text model); an empty notebook_uri means the active interactive editor."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactive.contribution.ts:530"]
    request: {type: object, required: [value], properties: {notebook_uri: {type: string, default: ""}, value: {type: string, examples: ["print(40 + 2)"]}}}
    response: {type: object, properties: {value: {type: string}}}
    errors: [{code: interactive-window-not-found, status: 0, retryable: false}]
    behavior:
      - set: {vars.uri: "= has(input.notebook_uri) && input.notebook_uri != '' ? input.notebook_uri : (has(state.active) ? state.active : '')"}
      - if: "!(vars.uri in state.windows)"
        then:
          - title: No such interactive window - the commands find no editor control
            source: "src/vs/workbench/contrib/interactive/browser/interactive.contribution.ts:518"
            fail: {code: interactive-window-not-found, message: "= 'no interactive window for ' + vars.uri"}
      - set: {state.windows: "= merge(state.windows, {vars.uri: {'value': input.value}})"}
      - return: {value: "= input.value"}

  - component: interactive-editor-input
    name: get-window
