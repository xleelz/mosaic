  - component: notebook-file-working-copy-model
    name: save
    kind: function
    summary: "Save the working copy: skip when clean, else the remote-save delegate or snapshot + file write."
    sources: ["src/vs/workbench/contrib/notebook/common/notebookEditorModel.ts:224-303"]
    request: {type: object, required: [uri], properties: {uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}, force: {type: boolean, default: false}}}
