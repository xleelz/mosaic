      - source: "src/vs/workbench/contrib/interactive/browser/interactive.contribution.ts:565"
        call: notebook-editor-widget.execute-notebook-cells
        input: {uri: "= vars.uri", cell_indexes: ["= size(vars.m.value.model.cells)"]}
        as: r
      - return: "= vars.r.value"

