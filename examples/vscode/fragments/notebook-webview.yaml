  - component: notebook-kernel-detection
    name: on-will-activate-by-event
    kind: function
    summary: "On an onNotebook:<type> activation (not '*'), register a kernel detection task for the type so the kernel picker shows progress."
    description: "The code also requires an extension that lists the event and isn't activated yet (notebookKernelDetection.ts:43-50); that extension status is exthost's and is assumed true here."
    sources: ["src/vs/workbench/contrib/notebook/browser/contrib/kernelDetection/notebookKernelDetection.ts:32-60"]
    subscribe: [extension-service.on-will-activate-by-event]
    request: {type: object, properties: {activation_event: {type: string, examples: ["onNotebook:jupyter-notebook"]}, activation_kind: {type: string, default: normal}}}
    response: {type: object, properties: {detecting: {type: boolean}}}
    behavior:
      - if: "!has(input.activation_event) || !input.activation_event.startsWith('onNotebook:')"
        then: [{return: {detecting: false}}]
      - set: {vars.type: "= input.activation_event.substring(11)"}
      - if: "vars.type == '*' || vars.type in state.detecting"
