  # ==================================================================== resolver and editor input
  - component: notebook-model-resolver-service-impl
    name: resolve
    kind: function
    summary: "Validate resource and view type, then acquire a reference to the editor model (loading it on first use)."
    sources: ["src/vs/workbench/contrib/notebook/common/notebookEditorModelResolverServiceImpl.ts:205-248", "src/vs/workbench/contrib/notebook/common/notebookEditorModelResolverServiceImpl.ts:256-286"]
    request: {type: object, properties: {resource: {type: string, default: "file:///work/app/analysis.ipynb"}, view_type: {type: string, default: ""}}}
    response: {type: object, properties: {resource: {type: string}, view_type: {type: string}, ref_count: {type: integer}}}
    errors:
      - {code: must-provide-resource-or-view-type, status: 0, retryable: false}
      - {code: missing-view-type, status: 0, retryable: false}
      - {code: notebook-view-type-conflict, status: 0, retryable: false}
    behavior:
      - set:
          vars.resource: "= has(input.resource) ? input.resource : ''"
          vars.wanted: "= has(input.view_type) ? input.view_type : ''"
      - if: "vars.resource == '' && vars.wanted == ''"
