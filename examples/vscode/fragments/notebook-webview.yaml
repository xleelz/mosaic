    summary: "Apply cell edits (replace, output, move, language, internal metadata), bump the version and fire onDidChangeContent."
    description: "Edits are applied in the given order (the real model sorts edits by end index descending, notebookTextModel.ts:716-750; callers here send one structural edit at a time). Internal-metadata edits are transient (do not dirty, :1159); output edits dirty unless the serializer marks outputs transient (:1231)."
    sources: ["src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:635-673", "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:752-805"]
    request:
      type: object
      required: [uri, edits]
      properties:
        uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}
        edits:
          type: array
          items:
            type: object
            properties:
              edit_type: {type: string, enum: [replace, output, move, cell_language, partial_internal_metadata]}
              index: {type: integer}
              count: {type: integer}
              cells: {type: array}
              outputs: {type: array}
              append: {type: boolean}
              new_idx: {type: integer}
              language: {type: string}
              internal_metadata: {type: object}
    response: {type: object, properties: {version_id: {type: integer}, cell_count: {type: integer}}}
    errors:
      - {code: notebook-not-found, status: 0, retryable: false}
      - {code: model-index-out-of-range, status: 0, retryable: false}
    behavior:
      - if: "!(input.uri in state.models)"
        then:
          - title: Unknown notebook
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:150-153"
            fail: {code: notebook-not-found, message: "= 'Notebook not found: ' + input.uri"}
      - set: {vars.cells: "= state.models[input.uri].cells", vars.next: "= state.models[input.uri].next_handle", vars.content_changed: false}
      - foreach: "= input.edits"
        as: edit
        steps:
          - if: "vars.edit.edit_type == 'replace'"
            then:
              - if: "vars.edit.index < 0 || vars.edit.index > size(vars.cells)"
                then:
                  - source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:1301-1305"
                    fail: {code: model-index-out-of-range, message: "= 'model index out of range ' + string(vars.edit.index)"}
              - title: Replace cells (insert, delete or swap a range)
                source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:841-929"
                set:
                  vars.cells: "= vars.cells.slice(0, vars.edit.index) + vars.edit.cells.transformList(i, c, merge({'outputs': [], 'execution_order': null, 'last_run_success': null}, merge(c, {'handle': vars.next + i}))) + vars.cells.slice(math.least(vars.edit.index + vars.edit.count, size(vars.cells)), size(vars.cells))"
                  vars.next: "= vars.next + size(vars.edit.cells)"
                  vars.content_changed: true
              - continue: true
          - if: "vars.edit.index < 0 || vars.edit.index >= size(vars.cells)"
            then:
              - title: Every non-replace edit targets an existing cell
                source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:1301-1305"
                fail: {code: model-index-out-of-range, message: "= 'model index out of range ' + string(vars.edit.index) + ' (cellCount: ' + string(size(vars.cells)) + ')'"}
          - if: "vars.edit.edit_type == 'output'"
            then:
              - source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:759-768"
                set:
                  vars.cells: "= vars.cells.transformList(i, c, i == vars.edit.index ? merge(c, {'outputs': (has(vars.edit.append) && vars.edit.append) ? c.outputs + vars.edit.outputs : vars.edit.outputs}) : c)"
                  vars.content_changed: "= vars.content_changed || !(has(state.models[input.uri].transient_outputs) && state.models[input.uri].transient_outputs)"
              - continue: true
          - if: "vars.edit.edit_type == 'move'"
            then:
              - title: Move one cell to a new index
                source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:1277-1294"
                set:
                  vars.moved: "= vars.cells[vars.edit.index]"
                  vars.rest: "= vars.cells.slice(0, vars.edit.index) + vars.cells.slice(vars.edit.index + 1, size(vars.cells))"
              - set:
                  vars.cells: "= vars.rest.slice(0, vars.edit.new_idx) + [vars.moved] + vars.rest.slice(vars.edit.new_idx, size(vars.rest))"
                  vars.content_changed: true
              - continue: true
          - if: "vars.edit.edit_type == 'cell_language'"
            then:
              - source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:1177-1195"
                set:
                  vars.cells: "= vars.cells.transformList(i, c, i == vars.edit.index ? merge(c, {'language': vars.edit.language}) : c)"
                  vars.content_changed: true
              - continue: true
          - title: Partial internal metadata (execution order, success, timings) is a transient change
            source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:1145-1160"
            set:
              vars.cells: "= vars.cells.transformList(i, c, i == vars.edit.index ? merge(c, vars.edit.internal_metadata) : c)"
      - title: Bump the version and broadcast the change
        source: "src/vs/workbench/contrib/notebook/common/model/notebookTextModel.ts:657-667"
        set:
          state.models: "= merge(state.models, {input.uri: {'cells': vars.cells, 'next_handle': vars.next, 'version_id': state.models[input.uri].version_id + 1}})"
      - publish: notebook-text-model.on-did-change-content
        input: {uri: "= input.uri", transient: "= !vars.content_changed", version_id: "= state.models[input.uri].version_id"}
        delivery: sync
      - return: {version_id: "= state.models[input.uri].version_id", cell_count: "= size(vars.cells)"}

