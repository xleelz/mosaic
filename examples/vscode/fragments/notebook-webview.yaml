  - id: notebook-service
    name: NotebookService
    kind: module
    layer: workbench
    parent: notebook-contrib
    sources: ["src/vs/workbench/contrib/notebook/common/notebookService.ts:24", "src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:532-560", "src/vs/workbench/contrib/notebook/browser/notebook.contribution.ts:908"]
    summary: "Notebook serializers per view type, renderers and preloads, document creation and snapshots, and the cell copy buffer."
    attributes: {owner: notebook-webview}
    state:
      schema: {type: object, properties: {serializers: {type: object}, viewtype_cache: {type: object}, to_copy: {}, renderers: {type: object}, preloads: {type: object}}}
      initial: {serializers: {}, viewtype_cache: {}, to_copy: null, renderers: {}, preloads: {}}
  - id: notebook-provider-info-store
    name: NotebookProviderInfoStore
    kind: module
    layer: workbench
    parent: notebook-service
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:57-153", "src/vs/workbench/contrib/notebook/browser/notebookExtensionPoint.ts:245-254"]
    summary: "Contributed notebook types (the 'notebooks' extension point) and their filename selectors; registers each with the editor resolver."
    description: "Initial state is the world after startup: vscode.ipynb contributes jupyter-notebook for *.ipynb (extensions/ipynb/package.json:86-97) and InteractiveDocumentContribution registers 'interactive' for *.interactive with builtin priority (interactive.contribution.ts:91-101)."
    attributes: {owner: notebook-webview}
    state:
      schema: {type: object, properties: {contributed: {type: object}}}
      initial:
        contributed:
          jupyter-notebook: {display_name: Jupyter Notebook, selectors: ["*.ipynb"], priority: default, extension: vscode.ipynb}
          interactive: {display_name: Interactive, selectors: ["*.interactive"], priority: builtin, extension: ""}
