    attributes: {boundary: true, owner: exthost, shape: ExtHostNotebookKernelsShape}
    request: {type: object, properties: {kernel_id: {type: string}, uri: {type: string}, handles: {type: array, items: {type: integer}}}}
  - component: ext-host-webview-panels
    name: deserialize-webview-panel
    kind: rpc
    attributes: {boundary: true, owner: exthost, shape: ExtHostWebviewPanelsShape}
    request: {type: object, properties: {handle: {type: string}, view_type: {type: string}}}
  - component: ext-host-webviews
    name: on-message
    kind: rpc
    attributes: {boundary: true, owner: exthost, shape: ExtHostWebviewsShape}
    request: {type: object, properties: {handle: {type: string}, message: {type: object}}}
  - component: ext-host-interactive
    name: will-add-interactive-document
    kind: rpc
    attributes: {boundary: true, owner: exthost, shape: ExtHostInteractiveShape}
    request: {type: object, properties: {input_uri: {type: string}, notebook_uri: {type: string}, language_id: {type: string}}}
  - component: ext-host-custom-editors
    name: on-save
    kind: rpc
    attributes: {boundary: true, owner: exthost, shape: ExtHostCustomEditorsShape}
    request: {type: object, properties: {resource: {type: string}, view_type: {type: string}}}
  - component: disk
    name: read-file
    kind: io
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [resource], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}}}
    errors: [{code: file-not-found, status: 0, retryable: false}]
    store: {table: files, op: get, key: "= input.resource", not_found: file-not-found}
  - component: disk
    name: write-file
    kind: io
    attributes: {boundary: true, owner: platform-core}
    request: {type: object, required: [resource, content], properties: {resource: {type: string, examples: ["file:///work/app/src/main.ts"]}, content: {type: string}}}
    store: {table: files, op: put, key: "= input.resource", value: {content: "= input.content", mtime: "= now", size: "= size(input.content)"}}
  - component: storage-db
    name: workspace-write
    kind: io
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [key], properties: {key: {type: string}, value: {type: string}}}

