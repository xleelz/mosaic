      - title: The stored file working copy writes the snapshot to the file
        detail: "StoredFileWorkingCopy.doSave writes through IFileService; collapsed here to the disk write."
        source: "src/vs/workbench/contrib/notebook/common/notebookEditorModel.ts:301-303"
        call: disk.write-file
