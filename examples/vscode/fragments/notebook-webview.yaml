        input: {uri: "= input.uri", view_type: "= input.view_type"}
        as: k
      - if: "vars.k.value.kernel == null"
        then:
          - title: No kernel - nothing to cancel
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:98-102"
            return: {sent: false}
      - source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:100"
        call: ext-host-notebook-kernels.cancel-cells
        on: "= 'eh' + self.substring(1)"
        input: {kernel_id: "= vars.k.value.kernel.id", uri: "= input.uri", handles: "= input.handles"}
      - return: {sent: true}

  - component: notebook-execution-service
    name: register-execution-participant
    kind: function
    summary: "Add a cell execution participant."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:109-114"]
    request: {type: object, required: [participant], properties: {participant: {type: string, examples: [format-on-cell-execution]}}}
    response: {type: object, properties: {participants: {type: integer}}}
    behavior:
      - set: {state.participants: "= input.participant in state.participants ? state.participants : state.participants + [input.participant]"}
      - return: {participants: "= size(state.participants)"}

  - component: format-on-cell-execution-participant
    name: on-will-execute-cell
    kind: function
    summary: "Format the cells about to run when notebook.formatOnCellExecution is on."
    sources: ["src/vs/workbench/contrib/notebook/browser/contrib/format/formatting.ts:154-206"]
    request: {type: object, properties: {uri: {type: string}, handles: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {formatted: {type: boolean}}}
    behavior:
      - if: "!config['notebook-format-on-cell-execution']"
        then:
          - source: "src/vs/workbench/contrib/notebook/browser/contrib/format/formatting.ts:156-159"
            return: {formatted: false}
