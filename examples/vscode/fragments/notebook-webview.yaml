      - set:
          vars.has_cell: "= input.index >= 0 && input.index < size(vars.m.value.model.cells)"
          vars.default: "= vars.k.value.selected != null && size(vars.k.value.selected.supported_languages) > 0 ? vars.k.value.selected.supported_languages[0] : 'plaintext'"
