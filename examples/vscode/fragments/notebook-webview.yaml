  # ==================================================================== interactive window
  - component: interactive-history-service
    name: add-to-history
    kind: function
    summary: "Append a value (creating the history on first use)."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveHistoryService.ts:45-54"]
    request: {type: object, required: [uri, value], properties: {uri: {type: string}, value: {type: string}}}
    response: {type: object, properties: {size: {type: integer}}}
    behavior:
      - set: {vars.h: "= input.uri in state.history ? state.history[input.uri] : {'items': [], 'cursor': 0}"}
      - set: {vars.items: "= (vars.h.items + [input.value]).slice(math.greatest(0, size(vars.h.items) + 1 - 50), size(vars.h.items) + 1)"}
      - set: {state.history: "= merge(state.history, {input.uri: {'items': vars.items, 'cursor': size(vars.items) - 1}})"}
      - return: {size: "= size(vars.items)"}

  - component: interactive-history-service
    name: replace-last
    kind: function
    summary: "Replace the newest entry (creating the history on first use) and reset the cursor."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveHistoryService.ts:67-76"]
    request: {type: object, required: [uri, value], properties: {uri: {type: string}, value: {type: string}}}
    response: {type: object, properties: {size: {type: integer}}}
    behavior:
      - if: "!(input.uri in state.history)"
        then:
          - set: {state.history: "= merge(state.history, {input.uri: {'items': [input.value], 'cursor': 0}})"}
          - return: {size: 1}
      - set: {vars.items: "= state.history[input.uri].items.slice(0, size(state.history[input.uri].items) - 1) + [input.value]"}
      - set: {state.history: "= merge(state.history, {input.uri: {'items': vars.items, 'cursor': size(vars.items) - 1}})"}
      - return: {size: "= size(vars.items)"}

  - component: interactive-history-service
    name: get-previous-value
    kind: function
    summary: "Step the cursor back and return that entry (null at the oldest)."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveHistoryService.ts:56-59"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {value: {type: [string, "null"]}}}
    behavior:
      - if: "!(input.uri in state.history) || state.history[input.uri].cursor <= 0"
        then: [{return: {value: null}}]
      - set: {state.history: "= merge(state.history, {input.uri: {'cursor': state.history[input.uri].cursor - 1}})"}
      - return: {value: "= state.history[input.uri].items[state.history[input.uri].cursor]"}

  - component: interactive-history-service
    name: get-next-value
    kind: function
    summary: "Step the cursor forward and return that entry (null at the newest)."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveHistoryService.ts:61-65"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {value: {type: [string, "null"]}}}
    behavior:
      - if: "!(input.uri in state.history) || state.history[input.uri].cursor >= size(state.history[input.uri].items) - 1"
        then: [{return: {value: null}}]
      - set: {state.history: "= merge(state.history, {input.uri: {'cursor': state.history[input.uri].cursor + 1}})"}
      - return: {value: "= state.history[input.uri].items[state.history[input.uri].cursor]"}

  - component: interactive-history-service
    name: clear-history
    kind: function
    summary: "Forget a window's history."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveHistoryService.ts:78-80"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {cleared: {type: boolean}}}
    behavior:
