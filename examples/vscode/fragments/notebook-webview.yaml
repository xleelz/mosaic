schemas:
  - id: NotebookWebviewCell
    summary: "A notebook cell as the model holds it (ICellDto2 plus the handle and execution metadata)."
    schema:
      type: object
      properties:
        handle: {type: integer}
        kind: {type: string, enum: [code, markup]}
        language: {type: string, examples: [python]}
        source: {type: string}
        outputs: {type: array, items: {type: object, properties: {mime: {type: string}, value: {type: string}, size: {type: integer}}}}
        execution_order: {type: [integer, "null"]}
        last_run_success: {type: [boolean, "null"]}
  - id: NotebookWebviewNotebookData
    summary: "NotebookData: what a serializer returns from bytes (dataToNotebook) and receives on save (notebookToData)."
    schema:
      type: object
      properties:
        cells: {type: array, items: {$ref: NotebookWebviewCell}}
        metadata: {type: object}
      examples:
        - cells:
            - {kind: code, language: python, source: "import pandas as pd", outputs: []}
            - {kind: markup, language: markdown, source: "# Analysis", outputs: []}
            - {kind: code, language: python, source: "print(1 + 1)", outputs: []}
          metadata: {}
  - id: NotebookWebviewKernel
    summary: "A registered kernel (notebook controller), as MainThreadNotebookKernels.$addKernel registers it."
    schema:
      type: object
      required: [id, view_type]
      properties:
        id: {type: string, examples: [ms-toolsai.jupyter/python3]}
        view_type: {type: string, examples: [jupyter-notebook]}
        label: {type: string, examples: [Python 3]}
        extension: {type: string, examples: [ms-toolsai.jupyter]}
        supported_languages: {type: array, items: {type: string}, examples: [[python]]}
  - id: NotebookWebviewCellContext
    summary: "The resolved notebook action context: the notebook, the target cell and command arguments."
    schema:
      type: object
      required: [uri, cell_index]
      properties:
        uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}
        cell_index: {type: integer, examples: [0]}
        language: {type: string, examples: [python]}

interfaces:
  # ==================================================================== notebook-service
  - component: notebook-service
    name: can-resolve
    kind: function
    summary: "True when a serializer for the view type is registered, after activating onNotebookSerializer:<viewType>."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:718-727"]
    request: {type: object, required: [view_type], properties: {view_type: {type: string, examples: [jupyter-notebook]}}}
    response: {type: object, properties: {resolved: {type: boolean}}}
    behavior:
      - if: "input.view_type in state.serializers"
        then: [{return: {resolved: true}}]
      - title: Activate extensions that serialize this notebook type
        detail: "The notebooks extension point generates onNotebookSerializer:<type> for every contributed type (notebookExtensionPoint.ts:247-253)."
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:723-724"
        call: extension-service.activate-by-event
        input: {activation_event: "= 'onNotebookSerializer:' + input.view_type", activation_kind: normal}
      - return: {resolved: "= input.view_type in state.serializers"}

  - component: notebook-service
    name: with-notebook-data-provider
    kind: function
    summary: "Look up the contributed type, resolve its serializer, or fail."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:770-791"]
    request: {type: object, required: [view_type], properties: {view_type: {type: string, examples: [jupyter-notebook]}}}
    response: {type: object, properties: {view_type: {type: string}, extension: {type: string}, transient_outputs: {type: boolean}}}
    errors:
      - {code: unknown-notebook-type, status: 0, retryable: false}
      - {code: no-provider-registered, status: 0, retryable: false}
    behavior:
      - call: notebook-provider-info-store.get
        input: {view_type: "= input.view_type"}
        as: info
      - if: "!vars.info.value.found"
        then:
          - title: Unknown notebook type
            detail: "Offers 'Install extension' when a previous session recorded which extension provided the type."
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:772-787"
            fail: {code: unknown-notebook-type, message: "= 'UNKNOWN notebook type \\'' + input.view_type + '\\''"}
      - call: notebook-service.can-resolve
        input: {view_type: "= input.view_type"}
      - if: "!(input.view_type in state.serializers)"
        then:
          - title: No serializer registered after activation
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:787-789"
            fail: {code: no-provider-registered, message: "= 'NO provider registered for view type: \\'' + input.view_type + '\\''"}
      - return: {view_type: "= input.view_type", extension: "= state.serializers[input.view_type].extension", transient_outputs: "= state.serializers[input.view_type].transient_outputs"}

  - component: notebook-service
    name: register-notebook-serializer
    kind: function
    summary: "MainThreadNotebooks registers an extension's serializer for a view type."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:750-768"]
    request:
      type: object
      required: [view_type, extension]
      properties:
        view_type: {type: string, examples: [jupyter-notebook]}
        extension: {type: string, examples: [vscode.ipynb]}
        transient_outputs: {type: boolean, default: false}
    response: {type: object, properties: {registered: {type: boolean}}}
    errors: [{code: notebook-provider-already-exists, status: 0, retryable: false}]
    behavior:
      - if: "input.view_type in state.serializers"
        then:
          - title: One serializer per view type
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:751-754"
            fail: {code: notebook-provider-already-exists, message: "= 'notebook provider for viewtype \\'' + input.view_type + '\\' already exists'"}
      - title: Remember the providing extension and register the provider
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookServiceImpl.ts:763-768"
        set:
          state.serializers: "= merge(state.serializers, {input.view_type: {'extension': input.extension, 'transient_outputs': has(input.transient_outputs) ? input.transient_outputs : false}})"
          state.viewtype_cache: "= merge(state.viewtype_cache, {input.view_type: input.extension})"
