    request: {type: object, required: [uri, index, kind, direction], properties: {uri: {type: string}, index: {type: integer}, kind: {type: string, enum: [code, markup]}, direction: {type: string, enum: [above, below]}}}
    response: {type: object, properties: {inserted_at: {type: integer}}}
