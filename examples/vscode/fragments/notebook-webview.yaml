scenarios:
  # ------------------------------------------------------------------ startup
  - id: notebook-webview-startup-contributions
    flow: notebook-startup
    fixtures: [one-window-folder, notebook-webview-seed]
    steps:
      - {flow: notebook-startup, as: start}
      - {interface: notebook-cell-status-bar-service.get-status-bar-items-for-cell, caller: notebook-editor-widget, as: items, input: {uri: "file:///work/app/analysis.ipynb", cell_index: 0, view_type: jupyter-notebook}}
    expect:
      - "steps.start.result.value.started == 31"
      - "state['notebook-cell-status-bar-service@w1'].providers.size() == 2"
      - "state['notebook-execution-service@w1'].participants == ['format-on-cell-execution']"
      - "calls['working-copy-file-service.add-save-participant'] == 1"
      - "calls['notebook-service.register-contributed-notebook-type'] == 0"
      - "steps.items.result.value.lists == 2 && calls_by_instance['ext-host-notebook-controller.provide-notebook-cell-status-bar-items@eh1'] == 2"

  - id: notebook-webview-startup-interactive-type-missing
    flow: notebook-startup
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-provider-info-store@w1": {contributed: {interactive: null}}
    expect:
      - "result.ok"
      - "calls['notebook-service.register-contributed-notebook-type'] == 1"
      - "state['notebook-provider-info-store@w1'].contributed.interactive.priority == 'builtin'"

  # ------------------------------------------------------------------ open
  - id: notebook-webview-open-ipynb
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": &ser {serializers: {jupyter-notebook: {extension: vscode.ipynb, transient_outputs: false}, interactive: {extension: vscode.ipynb, transient_outputs: false}}, viewtype_cache: {}, to_copy: null, renderers: {}, preloads: {}}
    steps:
      - {flow: notebook-open, as: open}
      - {flow: notebook-read, as: read}
    expect:
      - "steps.open.result.value.resolved"
      - "steps.read.result.value.exists && steps.read.result.value.model.cells.size() == 3 && steps.read.result.value.model.cells[2].handle == 3"
      - "calls_by_instance['ext-host-notebook-controller.data-to-notebook@eh1'] == 1"
      - "state['notebook-model-resolver-service-impl@w1'].references['file:///work/app/analysis.ipynb'].count == 1"
      - "state['notebook-editor-widget@w1'].active_uri == 'file:///work/app/analysis.ipynb'"
      - "state['notebook-editor-widget-service@w1'].editors.size() == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onNotebook:jupyter-notebook')"

  - id: notebook-webview-open-no-serializer
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
    expect:
      - "result.ok && !result.value.resolved"
      - "calls['extension-service.activate-by-event'] == 1"
      - "calls['notebook-model-resolver-service-impl.resolve'] == 0"
      - "state['notebook-text-model@w1'].models.size() == 0"

  - id: notebook-webview-open-file-missing
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    input: {resource: "file:///work/app/missing.ipynb", view_type: jupyter-notebook}
    state:
      "notebook-service@w1": *ser
    expect:
      - "!result.ok && result.error.code == 'file-not-found'"
      - "calls['ext-host-notebook-controller.data-to-notebook'] == 0"
      - "state['notebook-text-model@w1'].models.size() == 0"

  - id: notebook-webview-open-autobinds-remembered-kernel
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
      "notebook-kernel-service@w1": &kernbound
        kernels: {"ms-toolsai.jupyter/python3": &k1 {id: ms-toolsai.jupyter/python3, view_type: jupyter-notebook, label: Python 3, extension: ms-toolsai.jupyter, supported_languages: [python]}}
        bindings: {"jupyter-notebook/file:///work/app/analysis.ipynb": ms-toolsai.jupyter/python3}
        affinities: {}
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notebook-kernel-service.try-auto-bind-notebook')"
      - "state['notebook-editor-context-keys@w1'].updates == 1"

  - id: notebook-webview-open-infers-view-type
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
    steps:
      - {interface: notebook-model-resolver-service-impl.resolve, caller: user, as: res, input: {resource: "file:///work/app/analysis.ipynb", view_type: ""}}
      - {flow: notebook-read, as: read}
    expect:
      - "state['notebook-model-resolver-service-impl@w1'].references['file:///work/app/analysis.ipynb'].view_type == 'jupyter-notebook'"
      - "steps.res.result.value.view_type == 'jupyter-notebook'"
      - "steps.read.result.value.model.view_type == 'jupyter-notebook'"

  - id: notebook-webview-open-view-type-conflict
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
      "notebook-text-model@w1": &models
        models:
          "file:///work/app/analysis.ipynb":
            view_type: jupyter-notebook
            version_id: 1
            next_handle: 4
            cells:
              - {handle: 1, kind: code, language: python, source: "import pandas as pd", outputs: [], execution_order: null, last_run_success: null}
              - {handle: 2, kind: markup, language: markdown, source: "# Analysis", outputs: [], execution_order: null, last_run_success: null}
              - {handle: 3, kind: code, language: python, source: "print(1 + 1)", outputs: [{mime: text/plain, value: "2", size: 1}], execution_order: 1, last_run_success: true}
    steps:
      - {interface: notebook-model-resolver-service-impl.resolve, caller: user, as: res, input: {resource: "file:///work/app/analysis.ipynb", view_type: interactive}}
    expect:
      - "!steps.res.result.ok && steps.res.result.error.code == 'notebook-view-type-conflict'"
      - "calls['simple-notebook-editor-model.load'] == 0"

  - id: notebook-webview-open-missing-view-type
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    steps:
      - {interface: notebook-model-resolver-service-impl.resolve, caller: user, as: a, input: {resource: "file:///work/app/README.md", view_type: ""}}
      - {interface: notebook-model-resolver-service-impl.resolve, caller: user, as: b, input: {resource: "", view_type: ""}}
    expect:
      - "!steps.a.result.ok && steps.a.result.error.code == 'missing-view-type'"
      - "!steps.b.result.ok && steps.b.result.error.code == 'must-provide-resource-or-view-type'"
      - "state['notebook-model-resolver-service-impl@w1'].references.size() == 0"

  - id: notebook-webview-open-already-open-reuses-model
    flow: notebook-open
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
      "notebook-text-model@w1": *models
    expect:
      - "result.ok && result.value.resolved"
      - "calls['disk.read-file'] == 0 && calls['notebook-service.create-notebook-text-model'] == 0"
      - "state['notebook-editor-input@w1'].resolved['file:///work/app/analysis.ipynb'] == 'jupyter-notebook'"

  # ------------------------------------------------------------------ cell editing commands
  - id: notebook-webview-cmd-insert-cells
    flow: notebook-run-command
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
      "notebook-text-model@w1": *models
      "notebook-editor-widget@w1": &widget {active_uri: "file:///work/app/analysis.ipynb", focus_index: 0, editor_id: "notebook-editor-file:///work/app/analysis.ipynb", active_kernel: ""}
    steps:
      - {flow: notebook-run-command, as: below, input: {command_id: notebook.cell.insertCodeCellBelow, cell_index: 0}}
      - {flow: notebook-run-command, as: mdabove, input: {command_id: notebook.cell.insertMarkdownCellAbove, cell_index: 0}}
      - {flow: notebook-run-command, as: top, input: {command_id: notebook.cell.insertCodeCellAtTop}}
      - {flow: notebook-run-command, as: mdtop, input: {command_id: notebook.cell.insertMarkdownCellAtTop}}
      - {flow: notebook-run-command, as: above, input: {command_id: notebook.cell.insertCodeCellAbove, cell_index: 1}}
      - {flow: notebook-run-command, as: abovec, input: {command_id: notebook.cell.insertCodeCellAboveAndFocusContainer, cell_index: 0}}
      - {flow: notebook-run-command, as: belowc, input: {command_id: notebook.cell.insertCodeCellBelowAndFocusContainer, cell_index: 0}}
      - {flow: notebook-run-command, as: mdbelow, input: {command_id: notebook.cell.insertMarkdownCellBelow, cell_index: 0}}
      - {flow: notebook-read, as: read}
    expect:
      - "steps.below.result.value.inserted_at == 1"
      - "steps.read.result.value.model.cells.size() == 11"
      - "steps.read.result.value.model.cells.filter(c, c.kind == 'markup').size() == 4"
      - "steps.read.result.value.model.cells.filter(c, c.kind == 'code' && c.source == '').all(c, c.language == 'python')"
      - "state['notebook-file-working-copy-model@w1'].dirty['file:///work/app/analysis.ipynb'] == true"

  - id: notebook-webview-cmd-move-and-copy
    flow: notebook-run-command
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
      "notebook-text-model@w1": *models
      "notebook-editor-widget@w1": *widget
    steps:
      - {flow: notebook-run-command, as: down, input: {command_id: notebook.cell.moveDown, cell_index: 0}}
      - {flow: notebook-run-command, as: up, input: {command_id: notebook.cell.moveUp, cell_index: 2}}
      - {flow: notebook-run-command, as: upfirst, input: {command_id: notebook.cell.moveUp, cell_index: 0}}
      - {flow: notebook-run-command, as: downlast, input: {command_id: notebook.cell.moveDown, cell_index: 2}}
      - {flow: notebook-run-command, as: copyup, input: {command_id: notebook.cell.copyUp, cell_index: 0}}
      - {flow: notebook-run-command, as: copydown, input: {command_id: notebook.cell.copyDown, cell_index: 0}}
      - {flow: notebook-read, as: read}
    expect:
      - "steps.down.result.value.moved && steps.up.result.value.moved"
      - "!steps.upfirst.result.value.moved && !steps.downlast.result.value.moved"
      - "steps.read.result.value.model.cells.map(c, c.source) == ['# Analysis', '# Analysis', '# Analysis', 'print(1 + 1)', 'import pandas as pd']"
      - "steps.read.result.value.model.cells.map(c, c.handle) == [2, 5, 4, 3, 1]"
      - "state['notebook-editor-widget@w1'].focus_index == 1"

  - id: notebook-webview-cmd-copy-cut-paste
    flow: notebook-run-command
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
      "notebook-text-model@w1": *models
