    summary: "Read an interactive window (read path); an empty notebook_uri means the active interactive editor."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveEditorInput.ts:150-180"]
    request: {type: object, properties: {notebook_uri: {type: string, default: ""}}}
    response: {type: object, properties: {exists: {type: boolean}, notebook_uri: {type: string}, value: {type: string}}}
    behavior:
