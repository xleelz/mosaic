# notebook-webview fragment: notebooks (open, edit, execute, kernels, save), webviews and webview
# panels, custom editors and the interactive window, modelled from VS Code 1.144.0 source.
schema_version: 1
id: vscode

components:
  # ------------------------------------------------------------------ area modules
  - {id: notebook-contrib, name: Notebook contribution, kind: module, layer: workbench, parent: workbench, sources: ["src/vs/workbench/contrib/notebook/browser/notebook.contribution.ts:895-921"], summary: "Notebook services, editor, actions and workbench contributions (per window).", attributes: {owner: notebook-webview}}
  - {id: webview-contrib, name: Webview and webview panel contribution, kind: module, layer: workbench, parent: workbench, sources: ["src/vs/workbench/contrib/webviewPanel/browser/webviewPanel.contribution.ts:77-83", "src/vs/workbench/contrib/webview/electron-browser/webview.contribution.ts:12"], summary: "Webview elements, the webview editor service and webview panel commands.", attributes: {owner: notebook-webview}}
  - {id: custom-editor-contrib, name: Custom editor contribution, kind: module, layer: workbench, parent: workbench, sources: ["src/vs/workbench/contrib/customEditor/browser/customEditor.contribution.ts:19-43"], summary: "Custom editors backed by webviews: contributions, resolver, inputs and models.", attributes: {owner: notebook-webview}}
  - {id: interactive-contrib, name: Interactive window contribution, kind: module, layer: workbench, parent: workbench, sources: ["src/vs/workbench/contrib/interactive/browser/interactive.contribution.ts:277-332"], summary: "The interactive window (REPL over a notebook of type 'interactive').", attributes: {owner: notebook-webview}}

