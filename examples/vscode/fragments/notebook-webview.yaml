        as: existing
      - set: {vars.view_type: "= vars.wanted != '' ? vars.wanted : (vars.existing.value.exists ? vars.existing.value.model.view_type : '')"}
      - if: "vars.view_type == ''"
        then:
          - title: Pick the exclusive, then the default, then the first contributed type matching the resource
            source: "src/vs/workbench/contrib/notebook/common/notebookEditorModelResolverServiceImpl.ts:221-230"
            call: notebook-provider-info-store.get-contributed-notebook
            input: {resource: "= input.resource"}
            as: providers
          - set: {vars.view_type: "= vars.providers.value.types.exists(p, p.priority == 'exclusive') ? vars.providers.value.types.filter(p, p.priority == 'exclusive')[0].id : (vars.providers.value.types.exists(p, p.priority == 'default') ? vars.providers.value.types.filter(p, p.priority == 'default')[0].id : (size(vars.providers.value.types) > 0 ? vars.providers.value.types[0].id : ''))"}
      - if: "vars.view_type == ''"
        then:
          - source: "src/vs/workbench/contrib/notebook/common/notebookEditorModelResolverServiceImpl.ts:233-235"
            fail: {code: missing-view-type, message: "= 'Missing viewType for \\'' + input.resource + '\\''"}
      - if: "vars.existing.value.exists && vars.existing.value.model.view_type != vars.view_type"
        then:
          - title: A document of another type is open for the resource
            detail: "onWillFailWithConflict lets NotebookEditorManager close conflicting editors first; the document stays open, so the check fails."
            source: "src/vs/workbench/contrib/notebook/common/notebookEditorModelResolverServiceImpl.ts:237-246"
            fail: {code: notebook-view-type-conflict, message: "= 'A notebook with view type \\'' + vars.existing.value.model.view_type + '\\' already exists for \\'' + input.resource + '\\', CANNOT create another notebook with view type ' + vars.view_type"}
      - set: {vars.count: "= input.resource in state.references ? state.references[input.resource].count : 0"}
      - if: "vars.count == 0"
        then:
          - title: First reference creates and loads the editor model
            source: "src/vs/workbench/contrib/notebook/common/notebookEditorModelResolverServiceImpl.ts:73-97"
            call: simple-notebook-editor-model.load
            input: {uri: "= input.resource", view_type: "= vars.view_type"}
      - set: {state.references: "= merge(state.references, {input.resource: {'view_type': vars.view_type, 'count': vars.count + 1}})"}
      - return: {resource: "= input.resource", view_type: "= vars.view_type", ref_count: "= vars.count + 1"}

  - component: notebook-editor-input
    name: resolve
    kind: function
    summary: "Resolve the notebook editor: wait for a serializer, take a model reference, and show it in the notebook editor widget."
    sources: ["src/vs/workbench/contrib/notebook/common/notebookEditorInput.ts:306-340"]
    request: {type: object, required: [resource, view_type], properties: {resource: {type: string, examples: ["file:///work/app/analysis.ipynb"]}, view_type: {type: string, examples: [jupyter-notebook]}}}
