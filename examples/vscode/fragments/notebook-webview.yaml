      - {interface: notebook-editor-widget.focus-cell, caller: user, input: {index: 1}}
      - {flow: notebook-cell-output-copy, as: stream}
      - {interface: clipboard-service.read-text, caller: user, as: clip2}
      - {interface: notebook-editor-widget.focus-cell, caller: user, input: {index: 2}}
      - {flow: notebook-cell-output-copy, as: invalid}
    expect:
      - "steps.fallback.result.value.copied && steps.clip1.result.value.text == '<table/>'"
      - "steps.stream.result.value.copied && steps.clip2.result.value.text == '1\\n2'"
      - "!steps.invalid.result.value.copied && steps.invalid.result.value.via == 'none'"
      - "calls['clipboard-service.write-text'] == 2"
      - "state['clipboard-service@w1'].text == '1\\n2' && state['notebook-editor-widget@w1'].focus_index == 2"

  # ------------------------------------------------------------------ kernel source actions
  - id: notebook-webview-kernel-source-reopen-reevaluates
    flow: notebook-kernel-source-actions
    description: "notebookKernelSource.test.ts 'reopening a notebook creates source actions with its current context': the cache dies with the document, so a reopened notebook evaluates the precondition again."
    fixtures: [one-window-folder, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
      "notebook-kernel-service@w1": &srcmenu {source_menu: [{command: test.notebookSource, title: Test Kernel, group: navigation, precondition: "testNotebookKernelEnabled == true", precondition_keys: [testNotebookKernelEnabled]}]}
    steps:
      - {interface: context-key-service.set-context, caller: user, input: {key: testNotebookKernelEnabled, value: false}}
      - {flow: notebook-open, as: open1}
      - {flow: notebook-kernel-source-actions, as: first}
      - {flow: notebook-kernel-source-actions, as: again}
      - {flow: notebook-close, as: close}
      - {interface: context-key-service.set-context, caller: user, input: {key: testNotebookKernelEnabled, value: true}}
      - {flow: notebook-open, as: open2}
      - {flow: notebook-kernel-source-actions, as: reopened}
    expect:
      - "steps.open1.result.value.resolved && steps.open2.result.value.resolved"
      - "!steps.first.result.value.cached && steps.first.result.value.actions[0].id == 'test.notebookSource' && !steps.first.result.value.actions[0].enabled"
      - "steps.again.result.value.cached && !steps.again.result.value.actions[0].enabled"
      - "steps.close.result.value.removed"
      - "!steps.reopened.result.value.cached && steps.reopened.result.value.actions[0].enabled"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notebook-kernel-service.on-will-remove-notebook-document')"

  - id: notebook-webview-kernel-source-cache-per-notebook
    flow: notebook-kernel-source-actions
    description: "Closing one notebook keeps another notebook's cached actions; the editor's scoped context keys win over the root; when clauses hide items."
    fixtures: [notebook-webview-notebook-open]
    state:
      "notebook-text-model@w1": {models: {"file:///work/app/other.ipynb": {view_type: jupyter-notebook, version_id: 1, next_handle: 1, cells: []}}}
      "notebook-kernel-service@w1": {source_menu: [{command: test.notebookSource, title: Test Kernel, group: primary, precondition: "testNotebookKernelEnabled == true", precondition_keys: [testNotebookKernelEnabled]}, {command: test.second, title: Second, group: navigation, precondition: "testNotebookKernelEnabled == false", precondition_keys: [testNotebookKernelEnabled]}, {command: test.hidden, title: Hidden, group: navigation, when: "isWeb == true", precondition_keys: [isWeb]}]}
      "context-key-service@w1": {values: {testNotebookKernelEnabled: true}}
    steps:
      - {flow: notebook-kernel-source-actions, as: closing, input: {uri: "file:///work/app/other.ipynb", view_type: jupyter-notebook, context_keys: {testNotebookKernelEnabled: false}}}
      - {flow: notebook-kernel-source-actions, as: remaining}
      - {flow: notebook-close, as: close, input: {uri: "file:///work/app/other.ipynb"}}
      - {flow: notebook-kernel-source-actions, as: still}
      - {flow: notebook-close, as: close_missing, input: {uri: "file:///work/app/missing.ipynb"}}
    expect:
      - "steps.closing.result.value.actions.size() == 2 && !steps.closing.result.value.actions[0].enabled && steps.closing.result.value.actions[1].enabled && !steps.closing.result.value.actions[1].is_primary"
      - "steps.remaining.result.value.actions[0].enabled && steps.remaining.result.value.actions[0].is_primary"
      - "steps.still.result.value.cached && steps.still.result.value.actions[0].enabled"
      - "!steps.close_missing.result.value.removed"
      - "!('jupyter-notebook/file:///work/app/other.ipynb' in state['notebook-kernel-service@w1'].kernel_sources)"
      - "'jupyter-notebook/file:///work/app/analysis.ipynb' in state['notebook-kernel-service@w1'].kernel_sources"
      - "!('file:///work/app/other.ipynb' in state['notebook-text-model@w1'].models)"

  - id: notebook-webview-kernel-source-action-run
    flow: notebook-kernel-source-action-run
    description: "Running a source action: its command gets the notebook; a failing command is only logged; a second run while one is in flight joins it; unknown actions do nothing."
    fixtures: [notebook-webview-notebook-open]
    state:
      "notebook-kernel-service@w1": {source_menu: [{command: test.notebookSource, title: Test Kernel, group: navigation}]}
    steps:
      - {flow: notebook-kernel-source-actions, as: list}
      - {flow: notebook-kernel-source-action-run, as: run1, await: false}
      - {flow: notebook-kernel-source-action-run, as: run2, at_ms: 3}
      - {interface: notebook-kernel-service.get-running-source-actions, caller: user, input: {uri: "file:///work/app/analysis.ipynb", view_type: jupyter-notebook}, as: running, at_ms: 5}
      - {flow: notebook-kernel-source-action-run, as: unknown, input: {uri: "file:///work/app/analysis.ipynb", view_type: jupyter-notebook, action_id: nope}}
      - {interface: notebook-kernel-service.get-running-source-actions, caller: user, input: {uri: "file:///work/app/analysis.ipynb", view_type: jupyter-notebook}, as: after, at_ms: 40}
      - {interface: notebook-kernel-service.get-running-source-actions, caller: user, input: {uri: "file:///work/app/closed.ipynb", view_type: jupyter-notebook}, as: none}
    expect:
      - "steps.run1.result.value.ran && steps.run1.result.value.failed"
      - "!steps.run2.result.value.ran"
      - "steps.running.result.value.actions.size() == 1"
      - "!steps.unknown.result.value.ran"
      - "steps.after.result.value.actions.size() == 0 && steps.none.result.value.actions.size() == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == 'test.notebookSource' && e.input.args[0].uri == 'file:///work/app/analysis.ipynb')"

  - id: notebook-webview-close-untitled-unbinds-kernel
    flow: notebook-close
    fixtures: [notebook-webview-notebook-open]
    state:
      "notebook-text-model@w1": {models: {"untitled:Untitled-1.ipynb": {view_type: jupyter-notebook, version_id: 1, next_handle: 1, cells: []}}}
      "notebook-kernel-service@w1": {bindings: {"jupyter-notebook/untitled:Untitled-1.ipynb": ms-toolsai.jupyter/python3, "jupyter-notebook/file:///work/app/analysis.ipynb": ms-toolsai.jupyter/python3}}
    steps:
      - {flow: notebook-close, as: untitled, input: {uri: "untitled:Untitled-1.ipynb"}}
      - {flow: notebook-close, as: file}
      - {interface: notebook-text-model.dispose, caller: user, input: {uri: "file:///work/app/analysis.ipynb"}, as: twice}
    expect:
      - "!steps.twice.result.value.disposed"
      - "steps.untitled.result.value.removed && steps.file.result.value.removed"
      - "!('jupyter-notebook/untitled:Untitled-1.ipynb' in state['notebook-kernel-service@w1'].bindings)"
      - "'jupyter-notebook/file:///work/app/analysis.ipynb' in state['notebook-kernel-service@w1'].bindings"
      - "state['notebook-text-model@w1'].models.size() == 0"

  - id: notebook-webview-picker-through-command-service
    flow: notebook-run-command
    fixtures: [notebook-webview-notebook-open]
    input: {command_id: notebook.cell.execute, cell_index: 0}
    state:
      "notebook-kernel-service@w1": {kernels: {"ms-toolsai.jupyter/conda": {id: ms-toolsai.jupyter/conda, view_type: "*", label: Conda, extension: ms-toolsai.jupyter, supported_languages: [python]}}}
    expect:
      - "result.value.executed == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == '_notebook.selectKernel')"
      - "calls['notebook-kernel-view.cmd--notebook-selectkernel'] == 1"
      - "state['notebook-kernel-service@w1'].bindings.size() == 1"

  - id: notebook-webview-kernel-detection-on-activation
    flow: notebook-open
    fixtures: [all-builtin-extensions, notebook-webview-seed]
    state:
      "notebook-service@w1": *ser
    steps:
      - {flow: notebook-open, as: open}
      - {interface: notebook-kernel-detection.on-will-activate-by-event, caller: extension-service, as: star, input: {activation_event: "onNotebook:*", activation_kind: normal}}
      - {interface: notebook-kernel-detection.on-will-activate-by-event, caller: extension-service, as: other, input: {activation_event: "onLanguage:python", activation_kind: normal}}
      - {interface: notebook-kernel-detection.on-will-activate-by-event, caller: extension-service, as: again, input: {activation_event: "onNotebook:jupyter-notebook", activation_kind: normal}}
    expect:
      - "steps.open.result.value.resolved"
      - "!steps.star.result.value.detecting && !steps.other.result.value.detecting && !steps.again.result.value.detecting"
      - "state['notebook-kernel-detection@w1'].detecting == ['jupyter-notebook']"
      - "state['notebook-kernel-service@w1'].detection_tasks['jupyter-notebook'] == 1"

  - id: notebook-webview-exec-untrusted-declined
    flow: notebook-run-command
    fixtures: [untrusted-folder, notebook-webview-seed]
    input: {command_id: notebook.cell.execute, cell_index: 0}
    choices: {workspace-trust-request-service.request-workspace-trust.modal: cancel}
    state:
      "notebook-service@w1": *ser
      "notebook-text-model@w1": *models
      "notebook-editor-widget@w1": *widget
      "notebook-kernel-service@w1": *kernbound
    expect:
      - "result.ok && result.value.reason == 'untrusted'"
      - "calls['notebook-execution-state-service.create-cell-execution'] == 0 && calls['ext-host-notebook-kernels.execute-cells'] == 0"
      - "state['notebook-execution-state-service@w1'].executions.size() == 0"

  - id: notebook-webview-select-kernel-without-notebook
    flow: notebook-select-kernel
    fixtures: [one-window-folder, notebook-webview-seed]
    steps:
      - {flow: notebook-select-kernel, as: none, input: {uri: "", args: []}}
      - {interface: notebook-kernel-history-service.get-kernels, caller: user, as: read, input: {uri: "file:///work/app/analysis.ipynb", view_type: jupyter-notebook}}
    expect:
      - "!steps.none.result.value.picked && steps.read.result.value.selected == null"
      - "state['notebook-kernel-service@w1'].bindings.size() == 0"
