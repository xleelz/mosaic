      - title: Default path - snapshot through the serializer, then write the bytes
        source: "src/vs/workbench/contrib/notebook/common/notebookEditorModel.ts:301-303"
        call: notebook-service.create-notebook-text-document-snapshot
        input: {uri: "= input.uri", context: save}
