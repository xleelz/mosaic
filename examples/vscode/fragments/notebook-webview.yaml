  - component: interactive-window-actions
    name: cmd--interactive-open
    kind: command
    summary: "_interactive.open(showOptions, resource, controllerId, title): open a new interactive window (optionally preselecting a controller) and return its URIs."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactive.contribution.ts:334-448"]
