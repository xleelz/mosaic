    response: {type: object, properties: {kernel: {}}}
    behavior:
      - call: notebook-kernel-history-service.get-kernels
        input: {uri: "= input.uri", view_type: "= input.view_type"}
        as: h
      - if: "vars.h.value.selected != null"
        then: [{return: {kernel: "= vars.h.value.selected"}}]
      - title: Run _notebook.selectKernel through the command service
        source: "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelQuickPickStrategy.ts:816"
        call: command-service.execute-command
        input: {command_id: _notebook.selectKernel, args: [{uri: "= input.uri"}]}
      - call: notebook-kernel-history-service.get-kernels
        input: {uri: "= input.uri", view_type: "= input.view_type"}
        as: after
      - return: {kernel: "= vars.after.value.selected"}

  - component: kernel-picker-mru-strategy
    name: show-quick-pick
    kind: function
    summary: "Select the wanted kernel, or let the user pick one from the quick pick."
    sources: ["src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelQuickPickStrategy.ts:113-147", "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelQuickPickStrategy.ts:510-518"]
    request: {type: object, required: [uri, view_type], properties: {uri: {type: string}, view_type: {type: string}, wanted_id: {type: string, default: ""}}}
    response: {type: object, properties: {picked: {type: boolean}, kernel_id: {type: string}}}
    behavior:
      - call: notebook-kernel-service.get-matching-kernel
        input: {uri: "= input.uri", view_type: "= input.view_type"}
        as: m
      - if: "has(input.wanted_id) && input.wanted_id != ''"
        then:
          - if: "!vars.m.value.all.exists(k, k.id == input.wanted_id)"
            then:
              - title: Wanted kernel does not exist
                source: "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelQuickPickStrategy.ts:127-130"
                return: {picked: false, kernel_id: ""}
          - set: {vars.pick: "= input.wanted_id"}
        else:
          - title: The user picks from the kernel quick pick
            source: "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelQuickPickStrategy.ts:139-147"
            choice: pick
            default: "= size(vars.m.value.all) > 0 ? 'first_kernel' : 'dismissed'"
            options:
              first_kernel:
                - set: {vars.pick: "= vars.m.value.all[0].id"}
              dismissed:
                - return: {picked: false, kernel_id: ""}
      - if: "vars.m.value.selected != null"
        then:
          - title: The previously selected kernel goes into the MRU
            source: "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelQuickPickStrategy.ts:511-514"
            call: notebook-kernel-history-service.add-most-recent-kernel
            input: {kernel_id: "= vars.m.value.selected.id", view_type: "= input.view_type"}
      - call: notebook-kernel-service.select-kernel-for-notebook
        input: {uri: "= input.uri", view_type: "= input.view_type", kernel_id: "= vars.pick"}
      - call: notebook-kernel-history-service.add-most-recent-kernel
        input: {kernel_id: "= vars.pick", view_type: "= input.view_type"}
      - return: {picked: true, kernel_id: "= vars.pick"}

  - component: notebook-kernel-view
    name: cmd--notebook-selectkernel
    kind: command
    summary: "_notebook.selectKernel: on the active (or given) notebook, skip when the requested kernel is already selected, else pick or select the requested one."
    sources: ["src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelView.ts:42-53", "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelView.ts:55-141"]
    request:
      type: object
      properties:
        command_id: {type: string, default: _notebook.selectKernel}
        args: {type: array, items: {}, default: []}
        uri: {type: string, default: ""}
        id: {type: string, default: ""}
        extension: {type: string, default: ""}
        skip_if_already_selected: {type: boolean, default: false}
    response: {type: object, properties: {picked: {type: boolean}, kernel_id: {type: string}}}
    behavior:
      - title: The context is the command argument (KernelQuickPickContext) or the direct input
        source: "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelView.ts:115-130"
        set: {vars.c: "= has(input.args) && size(input.args) > 0 ? input.args[0] : input"}
      - call: notebook-editor-widget.get-context
        as: ctx
      - set: {vars.uri: "= has(vars.c.uri) && vars.c.uri != '' ? vars.c.uri : vars.ctx.value.uri"}
      - call: notebook-text-model.get-model
        input: {uri: "= vars.uri"}
        as: nb
      - if: "!vars.nb.value.exists"
        then:
          - title: No notebook editor with a model
            source: "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelView.ts:119-121"
            return: {picked: false, kernel_id: ""}
      - set: {vars.view_type: "= vars.nb.value.model.view_type"}
      - call: notebook-kernel-service.get-matching-kernel
        input: {uri: "= vars.uri", view_type: "= vars.view_type"}
        as: m
      - set: {vars.wanted: "= has(vars.c.id) && has(vars.c.extension) && vars.c.id != '' && vars.c.extension != '' ? vars.c.extension + '/' + vars.c.id : ''"}
      - if: "vars.m.value.selected != null && ((has(vars.c.skip_if_already_selected) && vars.c.skip_if_already_selected) || (vars.wanted != '' && vars.m.value.selected.id == vars.wanted))"
        then:
          - title: Already selected - nothing to do
            source: "src/vs/workbench/contrib/notebook/browser/viewParts/notebookKernelView.ts:134-136"
            return: {picked: true, kernel_id: "= vars.m.value.selected.id"}
      - if: "vars.wanted != ''"
        then:
          - call: kernel-picker-mru-strategy.show-quick-pick
            input: {uri: "= vars.uri", view_type: "= vars.view_type", wanted_id: "= vars.wanted"}
            as: r
        else:
          - call: kernel-picker-mru-strategy.show-quick-pick
            input: {uri: "= vars.uri", view_type: "= vars.view_type"}
            as: r
      - return: "= vars.r.value"

  # ==================================================================== execution
  - component: notebook-execution-service
    name: execute-notebook-cells
    kind: function
    summary: "Run code cells: workspace trust, cell executions, kernel resolution, language filter, participants, kernel request."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:35-93"]
    request:
      type: object
      required: [uri, view_type, cells]
      properties:
        uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}
        view_type: {type: string, examples: [jupyter-notebook]}
        cells: {type: array, items: {type: object, properties: {handle: {type: integer}, kind: {type: string}, language: {type: string}}}}
    response: {type: object, properties: {executed: {type: integer}, reason: {type: string}, kernel_id: {type: string}}}
    behavior:
      - set: {vars.code: "= input.cells.filter(c, c.kind == 'code')"}
      - if: "size(vars.code) == 0"
        then:
          - title: Only code cells run
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:36-40"
            return: {executed: 0, reason: no-code-cells, kernel_id: ""}
      - title: Executing a cell runs workspace code, so it needs workspace trust
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:43-47"
        call: workspace-trust-request-service.request-workspace-trust
        input: {message: Executing a notebook cell will run code from this workspace.}
        as: trust
      - if: "!(has(vars.trust.value.trusted) && vars.trust.value.trusted == true)"
        then: [{return: {executed: 0, reason: untrusted, kernel_id: ""}}]
      - set: {vars.created: []}
      - title: Create a cell execution for each cell not already running
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:49-57"
        foreach: "= vars.code"
        as: cell
        steps:
          - call: notebook-execution-state-service.get-cell-execution
            input: {uri: "= input.uri", handle: "= vars.cell.handle"}
            as: exe
          - if: "vars.exe.value.exists"
            then: [{continue: true}]
          - call: notebook-execution-state-service.create-cell-execution
            input: {uri: "= input.uri", handle: "= vars.cell.handle"}
          - set: {vars.created: "= vars.created + [vars.cell]"}
      - call: kernel-picker-mru-strategy.resolve-kernel
        input: {uri: "= input.uri", view_type: "= input.view_type"}
        as: kernel
      - if: "vars.kernel.value.kernel == null"
        then:
          - title: No kernel - complete the pending executions without a result
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:61-65"
            foreach: "= vars.created"
            as: cell
            steps:
              - call: notebook-execution-state-service.complete-cell-execution
                input: {uri: "= input.uri", handle: "= vars.cell.handle"}
          - return: {executed: 0, reason: no-kernel, kernel_id: ""}
      - call: notebook-kernel-history-service.add-most-recent-kernel
        input: {kernel_id: "= vars.kernel.value.kernel.id", view_type: "= input.view_type"}
      - set:
          vars.valid: "= vars.created.filter(c, c.language in vars.kernel.value.kernel.supported_languages)"
          vars.invalid: "= vars.created.filter(c, !(c.language in vars.kernel.value.kernel.supported_languages))"
      - title: Cells in languages the kernel does not support are completed at once
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:69-77"
        foreach: "= vars.invalid"
        as: cell
        steps:
          - call: notebook-execution-state-service.complete-cell-execution
            input: {uri: "= input.uri", handle: "= vars.cell.handle"}
      - if: "size(vars.valid) == 0"
        then:
          - title: No runnable execution left (all running already or in unsupported languages)
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:79-80"
            return: {executed: 0, reason: no-runnable-cells, kernel_id: "= vars.kernel.value.kernel.id"}
      - title: Execution participants run first (format on cell execution)
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:116-121"
        foreach: "= state.participants"
        as: participant
        steps:
          - call: format-on-cell-execution-participant.on-will-execute-cell
            when: "vars.participant == 'format-on-cell-execution'"
            input: {uri: "= input.uri", handles: "= vars.valid.map(c, c.handle)"}
      - source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:83"
        call: notebook-kernel-service.select-kernel-for-notebook
        input: {uri: "= input.uri", view_type: "= input.view_type", kernel_id: "= vars.kernel.value.kernel.id"}
      - title: Ask the kernel's extension host to run the cells
        detail: "MainThreadKernel.executeNotebookCellsRequest proxies to ExtHostNotebookKernels.$executeCells (mainThreadNotebookKernels.ts:243-245)."
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:84"
        call: ext-host-notebook-kernels.execute-cells
        on: "= 'eh' + self.substring(1)"
        input: {kernel_id: "= vars.kernel.value.kernel.id", uri: "= input.uri", handles: "= vars.valid.map(c, c.handle)"}
      - title: Executions the kernel never confirmed are completed
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:85-90"
        foreach: "= vars.valid"
        as: cell
        steps:
          - call: notebook-execution-state-service.get-cell-execution
            input: {uri: "= input.uri", handle: "= vars.cell.handle"}
            as: exe
          - call: notebook-execution-state-service.complete-cell-execution
            when: "vars.exe.value.exists && vars.exe.value.state == 'unconfirmed'"
            input: {uri: "= input.uri", handle: "= vars.cell.handle"}
      - return: {executed: "= size(vars.valid)", reason: requested, kernel_id: "= vars.kernel.value.kernel.id"}

  - component: notebook-execution-service
    name: cancel-notebook-cell-handles
    kind: function
    summary: "Ask the selected or suggested kernel to cancel cells."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionServiceImpl.ts:95-107"]
    request: {type: object, required: [uri, view_type, handles], properties: {uri: {type: string}, view_type: {type: string}, handles: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {sent: {type: boolean}}}
    behavior:
