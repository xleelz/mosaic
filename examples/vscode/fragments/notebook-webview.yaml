      - return: {cleared: true}

  - component: interactive-document-service
    name: will-create-interactive-document
    kind: function
    summary: "Fire onWillAddInteractiveDocument."
    sources: ["src/vs/workbench/contrib/interactive/browser/interactiveDocumentService.ts:32-38"]
    request: {type: object, required: [notebook_uri, input_uri], properties: {notebook_uri: {type: string}, input_uri: {type: string}, language_id: {type: string}}}
