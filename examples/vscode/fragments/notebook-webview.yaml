  - component: notebook-kernel-service
    name: get-source-actions
    kind: function
    summary: "The NotebookKernelSource menu's actions for one notebook, built once in the caller's context key service and cached per notebook until the document is removed."
    description: "MenuItemAction.enabled is the item's precondition matched in the context the menu was created with (actions.ts:617), so a cached action keeps the enabled state of its first evaluation. Context keys come from context_keys (the editor's scoped context key service) and fall back to the root context key service, as a scoped service delegates to its parent."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookKernelServiceImpl.ts:312-353"]
    request: {type: object, required: [uri, view_type], properties: {uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}, view_type: {type: string, examples: [jupyter-notebook]}, context_keys: {type: object}}}
    response: {type: object, properties: {actions: {type: array}, cached: {type: boolean}}}
    behavior:
      - set: {vars.key: "= input.view_type + '/' + input.uri"}
      - if: "vars.key in state.kernel_sources"
        then:
          - title: A copy of the cached actions; callers can't change the cache
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookKernelServiceImpl.ts:314-319"
            return: {actions: "= state.kernel_sources[vars.key].actions", cached: true}
      - title: Create the NotebookKernelSource menu in the caller's context key service
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookKernelServiceImpl.ts:313"
        set: {vars.ctx: {}}
      - foreach: "= state.source_menu"
        as: menu_item
        steps:
          - foreach: "= has(vars.menu_item.precondition_keys) ? vars.menu_item.precondition_keys : []"
            as: ck
            steps:
              - if: "vars.ck in vars.ctx"
                then: [{continue: true}]
              - if: "has(input.context_keys) && vars.ck in input.context_keys"
                then:
                  - set: {vars.ctx: "= merge(vars.ctx, {vars.ck: input.context_keys[vars.ck]})"}
                  - continue: true
              - source: "src/vs/platform/contextkey/browser/contextKeyService.ts:332-337"
                call: context-key-service.get-context-key-value
                input: {key: "= vars.ck"}
                as: kv
              - set: {vars.ctx: "= merge(vars.ctx, {vars.ck: vars.kv.value.value})"}
      - title: Menu items whose when clause fails are hidden; each visible item becomes a SourceAction whose enabled state is its precondition
        source: "src/vs/workbench/contrib/notebook/browser/services/notebookKernelServiceImpl.ts:325-345"
        set:
          vars.actions: "= state.source_menu.filter(i, !has(i.when) || eval(i.when, vars.ctx) == true).map(i, {'id': i.command, 'title': i.title, 'is_primary': has(i.group) && i.group.startsWith('primary'), 'enabled': !has(i.precondition) || eval(i.precondition, vars.ctx) == true, 'running': false})"
      - source: "src/vs/workbench/contrib/notebook/browser/services/notebookKernelServiceImpl.ts:322"
        set: {state.kernel_sources: "= merge(state.kernel_sources, {vars.key: {'uri': input.uri, 'view_type': input.view_type, 'actions': vars.actions}})"}
      - source: "src/vs/workbench/contrib/notebook/browser/services/notebookKernelServiceImpl.ts:344"
        publish: notebook-kernel-service.on-did-change-source-actions
        input: {uri: "= input.uri", view_type: "= input.view_type"}
        delivery: sync
      - return: {actions: "= vars.actions", cached: false}

