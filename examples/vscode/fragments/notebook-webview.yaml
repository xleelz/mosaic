        detail: "Edits come from getDocumentFormattingEditsWithSelectedProvider for each cell's text model; the providers (editor area and extensions) are not consulted here, so the edit list is empty."
        source: "src/vs/workbench/contrib/notebook/browser/contrib/format/formatting.ts:200"
        call: bulk-edit-service.apply
        input: {label: Format Cells, edits: []}
      - return: {formatted: true}

  - component: notebook-execution-state-service
    name: get-cell-execution
    kind: function
    summary: "The running execution of a cell, if any."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:68-83"]
    request: {type: object, required: [uri, handle], properties: {uri: {type: string}, handle: {type: integer}}}
    response: {type: object, properties: {exists: {type: boolean}, state: {type: string}}}
    behavior:
      - set: {vars.key: "= input.uri + '#' + string(input.handle)"}
      - return: {exists: "= vars.key in state.executions", state: "= vars.key in state.executions ? state.executions[vars.key].state : ''"}

  - component: notebook-execution-state-service
    name: get-cell-executions-for-notebook
    kind: function
    summary: "All running cell executions of a notebook."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:85-88"]
    request: {type: object, required: [uri], properties: {uri: {type: string}}}
    response: {type: object, properties: {executions: {type: array}}}
    behavior:
      - return: {executions: "= state.executions.filter(k, state.executions[k].uri == input.uri).map(k, state.executions[k])"}

  - component: notebook-execution-state-service
    name: create-cell-execution
    kind: function
    summary: "Create an Unconfirmed cell execution and reset the cell's execution metadata."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:149-172", "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:463-480"]
    request: {type: object, required: [uri, handle], properties: {uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}, handle: {type: integer, examples: [1]}}}
    response: {type: object, properties: {state: {type: string}, created: {type: boolean}}}
    errors: [{code: notebook-not-found, status: 0, retryable: false}]
    behavior:
      - call: notebook-text-model.get-model
        input: {uri: "= input.uri"}
        as: m
      - if: "!vars.m.value.exists"
        then:
          - source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:150-153"
            fail: {code: notebook-not-found, message: "= 'Notebook not found: ' + input.uri"}
      - set: {vars.key: "= input.uri + '#' + string(input.handle)"}
      - if: "vars.key in state.executions"
        then: [{return: {state: "= state.executions[vars.key].state", created: false}}]
      - set: {state.executions: "= merge(state.executions, {vars.key: {'uri': input.uri, 'handle': input.handle, 'state': 'unconfirmed'}})"}
      - if: "vars.m.value.model.cells.exists(c, c.handle == input.handle)"
        then:
          - title: initialize() clears execution order, success and timings
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:463-480"
            call: notebook-text-model.apply-edits
            input:
              uri: "= input.uri"
              edits: [{edit_type: partial_internal_metadata, index: "= vars.m.value.model.cells.map(c, c.handle).filter(h, h < input.handle).size()", internal_metadata: {execution_order: null, last_run_success: null}}]
      - return: {state: unconfirmed, created: true}

  - component: notebook-execution-state-service
    name: confirm-cell-execution
    kind: function
    summary: "The kernel accepted the execution: Unconfirmed becomes Pending."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:490-494"]
    request: {type: object, required: [uri, handle], properties: {uri: {type: string}, handle: {type: integer}}}
    response: {type: object, properties: {state: {type: string}}}
    behavior:
      - set: {vars.key: "= input.uri + '#' + string(input.handle)"}
      - if: "!(vars.key in state.executions)"
        then: [{return: {state: ""}}]
      - set: {state.executions: "= merge(state.executions, {vars.key: {'state': 'pending'}})"}
      - return: {state: pending}

  - component: notebook-execution-state-service
    name: update-cell-execution
    kind: function
    summary: "Execution updates: an execution-state update makes it Executing; outputs and execution order become cell edits."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:496-522", "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:400-428"]
    request: {type: object, required: [uri, handle], properties: {uri: {type: string}, handle: {type: integer}, execution_order: {type: [integer, "null"], default: null}, outputs: {type: [array, "null"], default: null}}}
    response: {type: object, properties: {state: {type: string}}}
    behavior:
      - set: {vars.key: "= input.uri + '#' + string(input.handle)"}
      - if: "!(vars.key in state.executions)"
        then: [{return: {state: ""}}]
      - if: "has(input.execution_order) && input.execution_order != null"
        then:
          - set: {state.executions: "= merge(state.executions, {vars.key: {'state': 'executing'}})"}
      - call: notebook-text-model.get-model
        input: {uri: "= input.uri"}
        as: m
      - if: "!vars.m.value.model.cells.exists(c, c.handle == input.handle)"
        then:
          - title: Updating a cell no longer in the notebook is ignored
            source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:513-515"
            return: {state: "= state.executions[vars.key].state"}
      - set: {vars.index: "= vars.m.value.model.cells.map(c, c.handle).filter(h, h < input.handle).size()"}
      - call: notebook-text-model.apply-edits
        when: "has(input.execution_order) && input.execution_order != null"
        input: {uri: "= input.uri", edits: [{edit_type: partial_internal_metadata, index: "= vars.index", internal_metadata: {execution_order: "= input.execution_order"}}]}
      - call: notebook-text-model.apply-edits
        when: "has(input.outputs) && input.outputs != null"
        input: {uri: "= input.uri", edits: [{edit_type: output, index: "= vars.index", outputs: "= input.outputs", append: true}]}
      - return: {state: "= state.executions[vars.key].state"}

  - component: notebook-execution-state-service
    name: complete-cell-execution
    kind: function
    summary: "Finish an execution: record success, drop it from the running set, track the last failed cell."
    sources: ["src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:524-543", "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:99-131"]
    request: {type: object, required: [uri, handle], properties: {uri: {type: string, examples: ["file:///work/app/analysis.ipynb"]}, handle: {type: integer, examples: [1]}, last_run_success: {type: [boolean, "null"], default: null}}}
    response: {type: object, properties: {completed: {type: boolean}}}
    behavior:
      - set: {vars.key: "= input.uri + '#' + string(input.handle)"}
      - if: "!(vars.key in state.executions)"
        then:
          - title: Unknown execution handle - MainThreadNotebookKernels ignores it
            return: {completed: false}
      - call: notebook-text-model.get-model
        input: {uri: "= input.uri"}
        as: m
      - call: notebook-text-model.apply-edits
        when: "vars.m.value.exists && vars.m.value.model.cells.exists(c, c.handle == input.handle)"
        input: {uri: "= input.uri", edits: [{edit_type: partial_internal_metadata, index: "= vars.m.value.model.cells.map(c, c.handle).filter(h, h < input.handle).size()", internal_metadata: {last_run_success: "= has(input.last_run_success) ? input.last_run_success : null"}}]}
      - set: {state.executions: "= omit(state.executions, vars.key)"}
      - if: "has(input.last_run_success) && input.last_run_success != null"
        then:
          - source: "src/vs/workbench/contrib/notebook/browser/services/notebookExecutionStateServiceImpl.ts:117-129"
            set:
              state.last_failed: "= input.last_run_success ? omit(state.last_failed, input.uri) : merge(state.last_failed, {input.uri: input.handle})"
              state.last_completed: "= merge(state.last_completed, {input.uri: input.handle})"
      - return: {completed: true}

  # ==================================================================== status bar and renderer messaging
  - component: notebook-cell-status-bar-service
