  - component: notebook-cell-output-actions
    name: cmd-notebook-celloutput-copy
    kind: command
    summary: "notebook.cellOutput.copy: copy the active cell's output; text goes to the clipboard, images are copied by the output webview."
    sources: ["src/vs/workbench/contrib/notebook/browser/controller/cellOutputActions.ts:56-96", "src/vs/workbench/contrib/notebook/browser/viewModel/cellOutputTextHelper.ts:109-127"]
    request: {type: object, properties: {command_id: {type: string, default: notebook.cellOutput.copy}, args: {type: array, items: {}, default: []}}}
    response: {type: object, properties: {copied: {type: boolean}, via: {type: string}}}
    behavior:
      - call: notebook-editor-widget.get-context
        as: ctx
      - call: notebook-text-model.get-model
        input: {uri: "= vars.ctx.value.uri"}
        as: m
      - if: "!vars.m.value.exists"
        then:
          - title: No notebook editor
            source: "src/vs/workbench/contrib/notebook/browser/controller/cellOutputActions.ts:75-77"
            return: {copied: false, via: none}
      - set: {vars.outputs: "= vars.m.value.model.cells[vars.ctx.value.focus_index].outputs"}
      - if: "size(vars.outputs) == 0"
        then:
          - title: No output view model in the active cell
            source: "src/vs/workbench/contrib/notebook/browser/controller/cellOutputActions.ts:79-82"
            return: {copied: false, via: none}
      - title: The picked MIME type is the first output item's (the renderer's preferred item)
        source: "src/vs/workbench/contrib/notebook/browser/controller/cellOutputActions.ts:85"
        set: {vars.picked: "= vars.outputs[0].mime"}
      - if: "vars.picked.startsWith('image/')"
        then:
          - title: Images are copied by the output webview (copyOutputImage)
            source: "src/vs/workbench/contrib/notebook/browser/controller/cellOutputActions.ts:87-89"
            return: {copied: true, via: webview}
      - title: TEXT_BASED_MIMETYPES
        source: "src/vs/workbench/contrib/notebook/browser/viewModel/cellOutputTextHelper.ts:131-143"
        set: {vars.text_mimes: ['text/latex', 'text/html', 'application/vnd.code.notebook.error', 'application/vnd.code.notebook.stdout', 'application/x.notebook.stdout', 'application/x.notebook.stream', 'application/vnd.code.notebook.stderr', 'application/x.notebook.stderr', 'text/plain', 'text/markdown', 'application/json']}
      - title: A text-based picked MIME copies that item; otherwise the first text-based item
        source: "src/vs/workbench/contrib/notebook/browser/viewModel/cellOutputTextHelper.ts:109-114"
        set: {vars.index: -1}
      - foreach: "= vars.outputs"
        as: o
        index: i
        steps:
          - if: "vars.picked in vars.text_mimes ? vars.o.mime == vars.picked : vars.o.mime in vars.text_mimes"
            then:
              - set: {vars.index: "= vars.i"}
              - break: true
      - if: "vars.index < 0"
        then:
          - title: No text-based output item, nothing is copied
            source: "src/vs/workbench/contrib/notebook/browser/viewModel/cellOutputTextHelper.ts:116-118"
            return: {copied: false, via: none}
      - set: {vars.mime: "= vars.outputs[vars.index].mime", vars.text: "= vars.outputs[vars.index].value"}
      - if: "vars.mime in ['application/vnd.code.notebook.stdout', 'application/vnd.code.notebook.stderr']"
        source: "src/vs/base/common/mime.ts:137-139"
        then:
          - title: "A stream output joins the consecutive stream outputs that follow it (getOutputStreamText), trimmed"
            source: "src/vs/workbench/contrib/notebook/browser/viewModel/cellOutputTextHelper.ts:62-80"
            set: {vars.text: ""}
          - foreach: "= vars.outputs"
            as: o
            index: i
            steps:
              - if: "vars.i < vars.index"
                then: [{continue: true}]
              - if: "!(vars.o.mime in ['application/vnd.code.notebook.stdout', 'application/vnd.code.notebook.stderr'])"
                then: [{break: true}]
              - set: {vars.text: "= vars.text + vars.o.value"}
          - set: {vars.text: "= vars.text.trim()"}
      - source: "src/vs/workbench/contrib/notebook/browser/viewModel/cellOutputTextHelper.ts:121-128"
        call: clipboard-service.write-text
        input: {text: "= vars.text"}
      - return: {copied: true, via: clipboard}

