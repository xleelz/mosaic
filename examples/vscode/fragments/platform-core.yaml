  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''storage-service.get'' && has(e.input.fallback_value) && e.input.fallback_value == ''{}'')'
  - state['storage-db'].global['menu.hiddenCommands'] == '{}'
