    - command_id
    properties:
      command_id:
        type: string
        examples:
        - noop
  response:
    type: object
    properties:
      handler:
        type: string
  errors:
  - code: command-not-found
    status: 0
    retryable: false
  store:
    table: commands
    op: get
    key: = input.command_id
    not_found: command-not-found
- component: commands-registry
  name: register-command
