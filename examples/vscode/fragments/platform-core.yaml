      key:
        type: string
        examples:
        - editor.formatOnSave
      override_identifier:
        type: string
        examples:
        - typescript
  store:
    table: user
    op: query
    where: matches(key, '^(\\[[^\\]]+\\])+$') && key != '[' + input.override_identifier + ']' && key.contains('[' + input.override_identifier + ']') && type(row) == map && input.key in row
