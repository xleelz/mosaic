  - interface: opener-service.open
    caller: agents
    as: blocked
    input:
      resource: command:noop
  - interface: opener-service.open
    caller: agents
    as: cmd
    input:
      resource: command:noop
      allow_commands: true
  - interface: opener-service.open
    caller: agents
    as: file
    input:
      resource: file:///work/app/README.md
  - interface: opener-service.open
    caller: agents
    as: internal
    input:
