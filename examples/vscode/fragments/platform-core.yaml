  - '!trace.exists(e, e.type == ''set'' && e.component == ''context-key-service'')'
- id: platform-core-execute-command-set-context-then-read
  name: A context key set by _setContext reads back through getContextKeyValue
  fixtures:
  - one-window-folder
  steps:
  - flow: pc-execute-command
    as: set
    input:
      command_id: _setContext
      args:
      - myExtension.ready
      - true
  - flow: pc-get-context-key-value
    as: read
    input:
      key: myExtension.ready
  expect:
  - steps.read.result.ok && steps.read.result.value.value == true
  - state['context-key-service@w1'].values['myExtension.ready'] == true
- id: platform-core-execute-command-get-context-key-info
  name: getContextKeyInfo returns the declared context keys
  flow: pc-execute-command
  fixtures:
  - one-window-folder
  input:
    command_id: getContextKeyInfo
  expect:
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''context-key-service.set-context'')'
  - result.ok
  - calls['context-key-service.cmd-getcontextkeyinfo'] == 1
- id: platform-core-execute-command-menu-reset
  name: Reset All Menus clears hidden states and persists {} in profile storage
  fixtures:
