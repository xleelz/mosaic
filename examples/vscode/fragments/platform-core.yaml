- component: configuration-service
  name: on-did-change-policies
  kind: event
  summary: 'PolicyConfiguration.onDidChangePolicies + update: map each changed policy name to the setting that declares it (configuration registry), read IPolicyService.getPolicyValue, set or remove the
    key in the policy model, and fire onDidChangeConfiguration (source POLICY) when a value changed.'
  sources:
  - src/vs/platform/configuration/common/configurations.ts:232-246
  - src/vs/platform/configuration/common/configurations.ts:250-302
  - src/vs/platform/configuration/common/configurationRegistry.ts:962-964
  subscribe:
  - account-policy-service.on-did-change
  request:
    type: object
    properties:
      names:
        type: array
        items:
          type: string
  behavior:
  - title: 'configurationRegistry.getPolicyConfigurations(): policy name -> owning setting key; names no setting declares are dropped'
    source: src/vs/platform/configuration/common/configurations.ts:234-245
    set:
      vars.names: = input.names.filter(n, n in state.policy_settings)
      vars.affected: []
  - foreach: = vars.names
    as: name
    steps:
    - set:
        vars.key: = state.policy_settings[vars.name].key
    - title: IPolicyService.getPolicyValue(policyName); on desktop the IPolicyService is AccountPolicyService (or a MultiplexPolicyService over the policy channel and it)
      source: src/vs/platform/configuration/common/configurations.ts:261
      call: account-policy-service.get-policy-value
      input:
        name: = vars.name
      as: pv
    - if: vars.pv.value.value == null
      then:
      - if: vars.key in state.policy
        then:
        - title: The policy value is gone, so the key is removed from the policy model
          source: src/vs/platform/configuration/common/configurations.ts:292-293
          set:
            state.policy: = state.policy.transformMap(k, v, k != vars.key, v)
            vars.affected: = vars.affected + [vars.key]
      else:
      - if: '!(vars.key in state.policy) || state.policy[vars.key] != vars.pv.value.value'
        then:
        - title: A new or different policy value is set on the key
          source: src/vs/platform/configuration/common/configurations.ts:274-276
          set:
            state.policy: '= merge(state.policy, {vars.key: vars.pv.value.value})'
            vars.affected: = vars.affected + [vars.key]
  - if: size(vars.affected) > 0
    then:
    - title: 'The policy model changed: onDidChangeConfiguration fires for the affected keys (ConfigurationTarget POLICY)'
      source: src/vs/platform/configuration/common/configurations.ts:298-300
      publish: configuration-service.on-did-change-configuration
      input:
        affected_keys: = vars.affected
        source: policy
      delivery: sync
- component: context-key-service
  name: get-context
  kind: function
  summary: 'AbstractContextKeyService.getContext(target): the context values a when clause is evaluated against (Context.getValue walks up to the root). config.* keys are lazy in the code; the caller lists
    the keys its expression reads (ContextKeyExpression.keys()), and config.* ones are resolved through the configuration service.'
  sources:
  - src/vs/platform/contextkey/browser/contextKeyService.ts:361-366
  - src/vs/platform/contextkey/browser/contextKeyService.ts:60-66
  request:
    type: object
    properties:
      keys:
        type: array
        items:
          type: string
        description: the keys the when clause reads
        examples:
        - - activeEditorGroupEmpty
          - config.files.autoSave
  response:
    type: object
    properties:
      values:
        type: object
  behavior:
  - set:
      vars.values: = merge(state.values, state.config_cache)
      vars.lazy: '= has(input.keys) ? input.keys.filter(k, k.startsWith(''config.'') && !(k in state.config_cache)) : []'
  - foreach: = vars.lazy
    as: ckey
    steps:
    - title: ConfigAwareContextValuesContainer.getValue reads the setting on first use
      source: src/vs/platform/contextkey/browser/contextKeyService.ts:149-179
      call: context-key-service.get-context-key-value
      input:
        key: = vars.ckey
      as: cv
    - set:
        vars.values: '= merge(vars.values, {vars.ckey: vars.cv.value.value})'
  - return:
      values: = vars.values
