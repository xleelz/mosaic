- component: marker-stats
  name: on-marker-changed
  kind: event
  summary: 'MarkerStats._update: recompute each changed resource''s counts from read({resource}) and adjust the totals.'
  sources:
  - src/vs/platform/markers/common/markerService.ts:105-115
  subscribe:
  - marker-service.on-marker-changed
  request:
    type: object
    properties:
      resources:
        type: array
        items:
          type: string
  behavior:
  - foreach: = input.resources
    as: r
    steps:
    - call: marker-service.read
      input:
        resource: = vars.r
      as: rd
    - title: _resourceStats counts severities (Error 8, Warning 4, Info 2, others unknown)
      source: src/vs/platform/markers/common/markerService.ts:117-142
      set:
        state.by_resource: '= merge(state.by_resource, {vars.r: {''errors'': vars.rd.value.filter(m, m.severity == 8).size(), ''warnings'': vars.rd.value.filter(m, m.severity == 4).size(), ''infos'': vars.rd.value.filter(m,
          m.severity == 2).size(), ''unknowns'': vars.rd.value.filter(m, !(m.severity in [2, 4, 8])).size()}})'
  - set:
      state.errors: = sum(state.by_resource.map(k, state.by_resource[k].errors))
      state.warnings: = sum(state.by_resource.map(k, state.by_resource[k].warnings))
      state.infos: = sum(state.by_resource.map(k, state.by_resource[k].infos))
      state.unknowns: = sum(state.by_resource.map(k, state.by_resource[k].unknowns))
