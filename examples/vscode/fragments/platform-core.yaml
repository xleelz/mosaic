- component: account-policy-service
  name: on-did-change
  kind: event
  summary: 'IPolicyService.onDidChange (AbstractPolicyService._onDidChange): the policy names whose value changed.'
  attributes:
    boundary: true
    owner: workbench-shell
  request:
    type: object
    properties:
