interfaces:
- component: command-service
  name: execute-command
  kind: function
  summary: 'ICommandService.executeCommand: activate for onCommand:<id>, then run the handler; unregistered commands also wait for * activation (at most 30 s).'
  sources:
  - src/vs/workbench/services/commands/common/commandService.ts:52-90
  request:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
        - noop
      args:
        type: array
        items: {}
        default: []
  errors:
  - code: command-not-found
    status: 0
    retryable: false
  behavior:
  - set:
      vars.activation_event: = 'onCommand:' + input.command_id
      vars.args: '= has(input.args) ? input.args : []'
  - call: commands-registry.get-command
    input:
      command_id: = input.command_id
    as: lookup
    on_error: continue
  - if: vars.lookup.ok
    then:
    - if: state.extension_host_ready
      then:
      - title: Wait for the onCommand activation event before running the registered command
        source: src/vs/workbench/services/commands/common/commandService.ts:73-75
        call: extension-service.activate-by-event
        input:
          activation_event: = vars.activation_event
          activation_kind: normal
      else:
      - title: Extension host not ready, so the activation is sent but not awaited
        source: src/vs/workbench/services/commands/common/commandService.ts:66-71
        emit: extension-service.activate-by-event
        input:
          activation_event: = vars.activation_event
          activation_kind: normal
    - call: command-service.try-execute-command
      input:
        command_id: = input.command_id
        args: = vars.args
      as: executed
    - return: = vars.executed.value
  - title: Unregistered command activates onCommand and, in parallel, * activation raced against 30 s
    source: src/vs/workbench/services/commands/common/commandService.ts:78-87
    branches:
    - - call: extension-service.activate-by-event
        input:
          activation_event: = vars.activation_event
          activation_kind: normal
    - - call: command-service.activate-star
    join:
      need: all
    on_insufficient:
      code: canceled
      status: 0
      retryable: false
  - call: command-service.try-execute-command
    input:
      command_id: = input.command_id
      args: = vars.args
    as: executed
  - return: = vars.executed.value
- component: command-service
  name: activate-star
  kind: function
  summary: '_activateStar: activateByEvent(''*'') raced against timeout(30000); the promise is shared by later callers.'
  sources:
  - src/vs/workbench/services/commands/common/commandService.ts:38-50
  behavior:
  - if: state.star_activation_settled
    then:
    - title: The shared * activation promise has already settled
      return:
        timed_out: false
        shared: true
  - call: extension-service.activate-by-event
    input:
      activation_event: '*'
      activation_kind: normal
    timeout_ms: 30000
    as: star
    on_error:
    - title: Only the 30 s timer winning the race is tolerated; a rejected activation rejects the race
      source: src/vs/workbench/services/commands/common/commandService.ts:41-44
      when: error.code != 'timeout'
      fail: = error
  - set:
