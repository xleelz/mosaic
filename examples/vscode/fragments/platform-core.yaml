# platform-core fragment of the VS Code 1.144.0 ontology (src/vs/base/**, src/vs/platform/** minus the excepted
# subtrees). Owns the seams command-service.execute-command, configuration-service.get-value and
# file-service.* (plus the disk.* store stubs). Generated from hand-written parts; see notes/platform-core.md.
schema_version: 1
id: vscode
schemas:
- id: PlatformFileStat
  summary: IFileStatWithMetadata as FileService returns it after a write or resolve (resource, mtime, size, etag, readonly).
  schema:
    type: object
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      mtime:
        type: integer
        examples:
        - 1793318400000
      size:
        type: integer
        examples:
        - 54
      etag:
        type: string
        examples:
        - 1793318400000-54
      readonly:
        type: boolean
        default: false
- id: PlatformMarker
  summary: IMarker after MarkerService._toMarker sanitized it.
  schema:
    type: object
    required:
    - owner
    - resource
    - severity
    - message
    properties:
      owner:
        type: string
        examples:
        - typescript
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      severity:
        type: integer
        enum:
        - 1
        - 2
        - 4
        - 8
        examples:
        - 8
      message:
        type: string
        examples:
        - Cannot find name 'ad'.
      start_line_number:
        type: integer
        examples:
        - 2
      end_line_number:
        type: integer
        examples:
        - 2
components:
- id: command-service
  name: CommandService
  kind: service
  parent: platform
  summary: 'ICommandService implementation: activates extensions for onCommand:<id>, then runs the registered handler through the instantiation service.'
  sources:
  - src/vs/platform/commands/common/commands.ts:15
  - src/vs/workbench/services/commands/common/commandService.ts:15-111
  - src/vs/workbench/services/commands/common/commandService.ts:113
  attributes:
    owner: platform-core
    class: CommandService
    decorator: commandService
    note: Seam owned by platform-core per the brief; the class file lives under src/vs/workbench/services/commands.
  state:
    schema:
      type: object
      properties:
        extension_host_ready:
          type: boolean
        star_activation_settled:
          type: boolean
    initial:
      extension_host_ready: true
      star_activation_settled: false
- id: commands-registry
  name: CommandsRegistry
  kind: module
  parent: platform
  summary: 'The global command table: id -> most recently registered handler (a LinkedList per id).'
  sources:
  - src/vs/platform/commands/common/commands.ts:67-147
  attributes:
    owner: platform-core
    note: 'Rows are {handler: <interface id of the registering area''s cmd-<slug> interface>}. Other areas register their commands here (seed or register-command).'
  state:
    schema:
      type: object
      properties:
        commands:
          type: object
    initial:
      commands:
        noop:
          handler: commands-registry.cmd-noop
        _setContext:
          handler: context-key-service.cmd--setcontext
        getContextKeyInfo:
          handler: context-key-service.cmd-getcontextkeyinfo
        quickInput.accept:
          handler: quick-input-controller.cmd-quickinput-accept
        menu.resetHiddenStates:
          handler: menu-hidden-states-reset.cmd-menu-resethiddenstates
        hideCodeActionWidget:
          handler: action-widget-service.cmd-hidecodeactionwidget
        acceptSelectedCodeAction:
          handler: action-widget-service.cmd-acceptselectedcodeaction
        previewSelectedCodeAction:
          handler: action-widget-service.cmd-previewselectedcodeaction
- id: configuration-service
  name: ConfigurationService
  kind: service
  parent: platform
  summary: 'IConfigurationService: resolves a key through policy > [language] overrides > folder > workspace > user > registered default (Configuration.getConsolidatedConfigurationModel), and writes user
    settings. Holds the PolicyConfiguration model (policy) fed by IPolicyService.'
  sources:
  - src/vs/platform/configuration/common/configuration.ts:14
  - src/vs/platform/configuration/common/configurationService.ts:27-188
  - src/vs/platform/configuration/common/configurationModels.ts:768-790
  attributes:
    owner: platform-core
    class: ConfigurationService
    decorator: configurationService
    note: The workbench's WorkspaceService (workbench-shell) wraps the same Configuration model; the default layer is the merged registerConfiguration defaults, which are the config entities.
  state:
    schema:
      type: object
      properties:
        policy:
          type: object
          description: 'PolicyConfiguration model: setting key -> policy value'
        default_overrides:
          type: object
          description: registered default [language] overrides
        policy_settings:
          type: object
          description: 'configuration registry policy table: policy name -> {key, type} of the owning setting'
    initial:
      policy: {}
      default_overrides:
        '[plaintext]':
          editor.unicodeHighlight.ambiguousCharacters: false
          editor.unicodeHighlight.invisibleCharacters: false
        '[go]':
          editor.insertSpaces: false
        '[makefile]':
          editor.insertSpaces: false
        '[shellscript]':
          files.eol: '

            '
        '[yaml]':
          editor.insertSpaces: true
          editor.tabSize: 2
      policy_settings:
        ChatAgentMode:
          key: chat.agent.enabled
          type: boolean
        McpGalleryServiceUrl:
          key: chat.mcp.gallery.serviceUrl
          type: string
        ChatHooks:
          key: chat.useHooks
          type: boolean
        AllowedExtensions:
          key: extensions.allowed
          type: object
        UpdateMode:
          key: update.mode
          type: string
        ExtensionsAutoUpdate:
          key: extensions.autoUpdate
          type: string
        EnableFeedback:
          key: telemetry.feedback.enabled
          type: boolean
- id: configuration-editing
  name: ConfigurationEditing
  kind: module
  parent: configuration-service
  summary: Queues writes to the user settings.json (Queue<void>), so edits never race.
  sources:
  - src/vs/platform/configuration/common/configurationService.ts:190-229
  capacity:
    concurrency: 1
  attributes:
    owner: platform-core
- id: file-service
  name: FileService
  kind: service
  parent: platform
  summary: 'IFileService: routes URIs to file system providers by scheme, validates writes (readonly, dirty-write prevention by mtime/etag), and reads and deletes files.'
  sources:
  - src/vs/platform/files/common/files.ts:26
  - src/vs/platform/files/common/fileService.ts:26-35
  - src/vs/platform/files/common/fileService.ts:136-156
  attributes:
    owner: platform-core
    class: FileService
    decorator: fileService
  state:
    schema:
      type: object
      properties:
        providers:
          type: object
    initial:
      providers:
        file:
          readonly: false
          trash: true
        vscode-userdata:
          readonly: false
          trash: false
- id: storage-service
  name: AbstractStorageService and Storage
  kind: service
  parent: platform
  summary: 'IStorageService over one Storage per scope: an in-memory cache with pending inserts and deletes, flushed to the state database after the flush delay.'
  sources:
  - src/vs/platform/storage/common/storage.ts:19
  - src/vs/platform/storage/common/storage.ts:332-355
  - src/vs/base/parts/storage/common/storage.ts:115-130
  attributes:
    owner: platform-core
    decorator: storageService
    note: 'Named after IStorageService: the desktop class is NativeWorkbenchStorageService (workbench) extending RemoteStorageService/AbstractStorageService (platform); the logic modelled is AbstractStorageService
      plus base Storage.'
  state:
    schema:
      type: object
      properties:
        items:
          type: object
        pending:
          type: object
    initial:
      items:
        application: {}
        profile: {}
        workspace: {}
      pending:
        application: {}
        profile: {}
        workspace: {}
- id: context-key-service
  name: ContextKeyService
  kind: service
  parent: platform
  summary: 'IContextKeyService: the root context''s values, plus config.* keys read lazily from the configuration service and cached until the setting changes.'
  sources:
  - src/vs/platform/contextkey/common/contextkey.ts:2056
  - src/vs/platform/contextkey/browser/contextKeyService.ts:379-393
  - src/vs/platform/contextkey/browser/contextKeyService.ts:105-191
  attributes:
    owner: platform-core
    class: ContextKeyService
    decorator: contextKeyService
  state:
    schema:
      type: object
      properties:
        values:
          type: object
        config_cache:
          type: object
    initial:
      values:
        inputFocus: false
      config_cache: {}
