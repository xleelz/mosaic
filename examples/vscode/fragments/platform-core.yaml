scenarios:
- id: platform-core-execute-command-happy
  name: A registered command waits for its onCommand activation, then runs
  flow: pc-execute-command
  fixtures:
  - one-window-folder
  expect:
  - result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onCommand:noop')
  - calls['commands-registry.cmd-noop'] == 1 && calls['command-service.activate-star'] == 0
- id: platform-core-execute-command-not-found
  name: An unregistered command activates onCommand and *, then fails with command not found
  flow: pc-execute-command
  fixtures:
  - one-window-folder
  input:
    command_id: workbench.action.doesNotExist
  expect:
  - '!result.ok && result.error.code == ''command-not-found'''
  - result.error.message == "command 'workbench.action.doesNotExist' not found"
  - calls['extension-service.activate-by-event'] == 2
  - state['command-service@w1'].star_activation_settled
- id: platform-core-execute-command-host-not-ready
  name: Before the extension host is ready, the activation is sent but not awaited
  flow: pc-execute-command
  fixtures:
  - one-window-folder
  state:
    command-service:
      extension_host_ready: false
  expect:
  - result.ok
  - trace.exists(e, e.type == 'emit' && e.interface == 'extension-service.activate-by-event')
  - trace.filter(e, e.type == 'call.start' && e.interface == 'commands-registry.cmd-noop')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event')[0].seq
- id: platform-core-execute-command-star-timeout
  name: A hung * activation is abandoned after 30 s and the lookup fails
  flow: pc-execute-command
  fixtures:
  - one-window-folder
  input:
    command_id: myExtension.lateCommand
  faults:
  - target: extension-service.activate-by-event
    type: timeout
    calls:
    - 2
  expect:
  - '!result.ok && result.error.code == ''command-not-found'''
  - duration_ms >= 30000 && duration_ms < 30100
  - state['command-service@w1'].star_activation_settled
- id: platform-core-execute-command-star-activation-fails
  name: A rejected * activation rejects executeCommand
  flow: pc-execute-command
  fixtures:
  - one-window-folder
  input:
    command_id: myExtension.lateCommand
  faults:
  - target: extension-service.activate-by-event
    type: error
    code: canceled
    retryable: false
    calls:
    - 2
  expect:
  - '!result.ok && result.error.code == ''canceled'''
  - calls['command-service.try-execute-command'] == 0
  - '!state[''command-service@w1''].star_activation_settled'
- id: platform-core-execute-command-star-shared
  name: A later unregistered command reuses the settled * activation
  flow: pc-execute-command
  fixtures:
  - one-window-folder
  input:
    command_id: myExtension.lateCommand
  state:
    command-service:
      star_activation_settled: true
  expect:
  - '!result.ok && result.error.code == ''command-not-found'''
  - calls['extension-service.activate-by-event'] == 1
  - trace.exists(e, e.type == 'note' && e.title == 'The shared * activation promise has already settled')
- id: platform-core-execute-command-registered-by-extension
  name: A command registered at runtime (MainThreadCommands) runs on the next executeCommand
  fixtures:
  - one-window-folder
  steps:
  - interface: commands-registry.register-command
    caller: exthost-bridge
    as: reg
    input:
      command_id: myExtension.sayHello
      handler: commands-registry.cmd-noop
  - flow: pc-execute-command
    as: run
    input:
      command_id: myExtension.sayHello
  expect:
  - steps.run.result.ok
  - state['commands-registry@w1'].commands['myExtension.sayHello'].handler == 'commands-registry.cmd-noop'
  - calls['command-service.activate-star'] == 0
- id: platform-core-execute-command-set-context
