interfaces:
- component: extension-service
  name: activate-by-event
  kind: function
  summary: Activate extensions listening to an activation event. (contract copied from the owner fragment)
  attributes:
    boundary: true
    owner: exthost
  request:
    type: object
    required:
    - activation_event
    properties:
      activation_event:
        type: string
        examples:
        - onLanguage:typescript
      activation_kind:
        type: string
        enum:
        - normal
        - immediate
        default: normal
  response:
    type: object
    properties:
      activated:
        type: array
        items:
          type: string
        default: []
      deferred:
        type: boolean
        default: false
      cached:
        type: boolean
        default: false
  errors:
  - code: canceled
    status: 0
    retryable: false
    summary: the extension host went down while the activation RPC was pending (RPCProtocol.dispose rejects pending replies)
- component: lifecycle-service
  name: on-before-shutdown
  kind: event
  summary: onBeforeShutdown event; listeners may veto. (contract copied from the owner fragment)
  attributes:
    boundary: true
    owner: workbench-shell
  request:
    type: object
    required:
    - reason
    properties:
      reason:
        type: string
        enum:
        - close
        - quit
        - reload
        - load
        examples:
        - close
      window_id:
        type: string
        examples:
        - w1
  response:
    type: object
    required:
    - veto
    properties:
      veto:
        type: boolean
      vetoed_by:
        type: array
        items:
          type: string
