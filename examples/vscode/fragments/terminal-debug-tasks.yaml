- component: test-service
  name: run-tests
  kind: function
  summary: Group requested tests by their default profile, then run the resolved request.
  sources:
  - src/vs/workbench/contrib/testing/common/testServiceImpl.ts:154-211
  request:
    type: object
    properties:
      group:
        type: string
        examples:
        - run
      test_ids:
        type: array
