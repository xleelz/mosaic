- component: terminal-service
  name: on-before-shutdown
  kind: function
  summary: "onBeforeShutdown listener: persist terminal buffers for revive (2 s budget) and, when processes are not persisted, confirm closing per confirmOnExit; never vetoes on errors."
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:630-672
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:678-693
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:227
  request:
    type: object
    properties:
      reason:
        type: string
        examples:
        - reload
        enum:
        - close
        - quit
        - reload
        - load
      window_id:
        type: string
        examples:
        - w1
    required:
    - reason
  response:
    type: object
    properties:
      veto:
        type: boolean
      revived:
        type: boolean
  subscribe:
  - lifecycle-service.on-before-shutdown
  behavior:
  - if: size(state.instances) == 0
    then:
    - title: e.veto(...) answers the lifecycle service
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:227
      call: lifecycle-service.veto
      input:
        id: veto.terminal
        veto: false
    - title: "No terminal instances: do not veto"
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:631-634
      return:
        veto: false
        revived: false
  - title: "TerminalNativeContribution delegate: nativeHostService.getWindowCount()"
    source: src/vs/workbench/contrib/terminal/electron-browser/terminalNativeContribution.ts:31-33
    call: native-host-main-service.get-window-count
    input:
      window_id: "= self"
    as: wc
  - call: terminal-configuration-service.get-config
    as: cfg
  - set:
      vars.revive: "= vars.cfg.value.enable_persistent_sessions && ((vars.cfg.value.persistent_session_revive_process == 'onExit' && ((input.reason == 'close' && vars.wc.value.count == 1) || input.reason\
        \ == 'load' || input.reason == 'quit')) || (vars.cfg.value.persistent_session_revive_process == 'onExitAndWindowClose' && input.reason != 'reload'))"
  - if: vars.revive
    then:
    - title: Persist terminal buffer state, racing a 2000 ms timeout
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:641-650
      call: local-terminal-backend.persist-terminal-state
      timeout_ms: "= config['terminal-persist-state-timeout-ms']"
      on_error: continue
      as: persisted
  - set:
      ctx.terminal_revive_on_shutdown: "= vars.revive"
  - if: "!(vars.cfg.value.enable_persistent_sessions && input.reason == 'reload') && vars.cfg.value.confirm_on_exit == 'always'"
    then:
    - title: "confirmOnExit: ask before closing terminals"
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:695-703
      choice: close_confirmation
      default: close
      options:
        close:
        - set:
            state.is_shutting_down: true
        - title: e.veto(...) answers the lifecycle service
          source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:227
          call: lifecycle-service.veto
          input:
            id: veto.terminal
            veto: false
        - return:
            veto: false
            revived: "= vars.revive"
        cancel:
        - title: e.veto(...) answers the lifecycle service
          source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:227
          call: lifecycle-service.veto
          input:
            id: veto.terminal
            veto: true
        - return:
            veto: true
            revived: "= vars.revive"
  - set:
      state.is_shutting_down: true
  - title: e.veto(...) answers the lifecycle service
    source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:227
    call: lifecycle-service.veto
    input:
      id: veto.terminal
      veto: false
  - return:
      veto: false
      revived: "= vars.revive"
- component: terminal-service
  name: on-will-shutdown
  kind: function
  summary: "onWillShutdown: on reload with persistent sessions, detach persistent processes (they survive for reconnect); otherwise dispose them; clear the saved layout unless persisting or reviving."
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:705-721
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:228
  request:
    type: object
    properties:
      reason:
        type: string
        examples:
        - reload
        enum:
        - close
        - quit
        - reload
        - load
    required:
    - reason
  response:
    type: object
    properties:
      detached:
        type: integer
      disposed:
        type: integer
  behavior:
  - call: terminal-configuration-service.get-config
    as: cfg
  - set:
      vars.persist: "= vars.cfg.value.enable_persistent_sessions && input.reason == 'reload'"
      vars.detached: 0
      vars.disposed: 0
  - foreach: "= state.instances"
    as: inst
    index: key
    steps:
    - if: vars.persist && vars.inst.should_persist
      then:
      - title: "detachProcessAndDispose: keep the pty alive for reconnect"
        source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:710-712
        call: local-pty.detach
        input:
          id: "= vars.inst.persistent_process_id"
          force_persist: false
      - set:
          vars.detached: "= vars.detached + 1"
      else:
      - title: "dispose: shut the process down"
        source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:713-714
        when: vars.inst.persistent_process_id != null
        call: local-pty.shutdown
        input:
          id: "= vars.inst.persistent_process_id"
          immediate: true
      - set:
          vars.disposed: "= vars.disposed + 1"
  - set:
      state.instances: {}
      state.backgrounded: []
  - if: "!vars.persist && !(ctx.terminal_revive_on_shutdown == true)"
    then:
    - title: Clear terminal layout info when not persisting or reviving
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:717-720
      call: local-terminal-backend.set-terminal-layout-info
      input:
        tabs: []
        background: []
        clear: true
  - return:
      detached: "= vars.detached"
      disposed: "= vars.disposed"
- component: terminal-service
  name: initialize-primary-backend
  kind: function
  summary: "Startup: get the local backend; with persistent sessions, reconnect to the pty host's layout (recreate orphaned terminals, revive background ones), then mark connected."
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:277-334
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:475-495
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:536-556
  request:
    type: object
    properties:
      startup_kind:
        type: string
        examples:
        - reloaded-window
        enum:
        - new-window
        - reloaded-window
        - reopened-window
  response:
    type: object
    properties:
      reconnected:
        type: integer
      connection_state:
        type: string
  behavior:
  - call: terminal-instance-service.get-backend
    input:
      remote_authority: null
    as: backend
  - call: terminal-configuration-service.get-config
    as: cfg
  - set:
      state.connection_state: connecting
      vars.count: 0
  - if: vars.cfg.value.enable_persistent_sessions
    then:
    - title: Reconnect to local terminals
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:475-495
      call: local-terminal-backend.get-terminal-layout-info
      as: layout
    - if: vars.layout.value.tabs != null
      then:
      - foreach: "= vars.layout.value.tabs"
        as: tab
        steps:
        - foreach: "= vars.tab.terminals.filter(t, t.is_orphan)"
          as: term
          steps:
          - if: input.startup_kind != 'reloaded-window' && vars.term.type == 'Task'
            then:
            - title: Task terminals are only recreated on reload
              source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:537-539
              continue: true
          - call: terminal-service.create-terminal
            input:
              attach_persistent_process:
                id: "= vars.term.id"
                pid: "= vars.term.pid"
                find_revived_id: "= vars.term.revived"
            fill: true
          - set:
              vars.count: "= vars.count + 1"
    - set:
        state.layout_listeners_attached: true
  - set:
      state.connection_state: connected
      state.restored_group_count: "= vars.count"
  - return:
      reconnected: "= vars.count"
      connection_state: connected
