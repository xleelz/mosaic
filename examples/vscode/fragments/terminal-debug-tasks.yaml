  steps:
  - flow: terminal-create
    as: c
  - interface: local-pty.input
    caller: terminal-process-manager
    input:
      id: 1
      data: "ls\r"
    as: i
  - flow: terminal-before-shutdown
    as: b
    input:
      reason: reload
  - flow: terminal-will-shutdown
    as: w
    input:
      reason: reload
  expect:
  - steps.w.result.value.detached == 1 && steps.w.result.value.disposed == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'pty-service.detach-from-process' && e.output.kept == true)
  - calls['local-terminal-backend.workspace-storage-store'] >= 1
  choices:
    debug-service.start-debugging.trust: trusted
    task-service.trust.trust: trusted
    test-service.run-resolved-tests.trust: trusted
    run-automatic-tasks.try-run-tasks.trust: trusted
