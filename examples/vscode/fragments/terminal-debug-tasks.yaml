        saved: false
  - call: local-terminal-backend.set-terminal-layout-info
    input:
      tabs: "= state.instances.filter(k, !(state.instances[k].hide_from_user) && state.instances[k].persistent_process_id != null).map(k, [state.instances[k].persistent_process_id])"
      background: "= state.backgrounded.filter(i, string(i) in state.instances && state.instances[string(i)].persistent_process_id != null).map(i, state.instances[string(i)].persistent_process_id)"
  - return:
