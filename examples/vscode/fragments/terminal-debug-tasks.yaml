        id: veto.debug
        veto: false
    - return:
        veto: false
  - if: config['debug-confirm-on-exit'] == 'never'
    then:
    - title: e.veto(...) answers the lifecycle service
      source: src/vs/workbench/contrib/debug/common/debugLifecycle.ts:23
