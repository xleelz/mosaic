- component: configuration-service
  name: update-value
  kind: function
  summary: Write a setting value. (contract copied from the owner fragment)
  attributes:
    boundary: true
    owner: platform-core
  request:
    type: object
    required:
    - key
    - value
    properties:
      key:
        type: string
        examples:
        - files.autoSave
      value:
        examples:
        - afterDelay
      target:
        type: string
        enum:
        - user
        - user-local
        - workspace
        - workspace-folder
        - application
        - memory
        default: user
  response:
    type: object
    properties:
      key:
        type: string
      removed:
        type: boolean
  errors:
  - code: unable-to-write-to-target
    status: 0
    retryable: false
  - code: configured-in-system-policy
    status: 0
    retryable: false
  - code: unable-to-write-into-the-settings-file
    status: 0
    retryable: false
