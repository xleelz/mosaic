- component: debug-contrib
  name: execute-registered-command
  kind: function
  summary: "CommandsRegistry handler lookup for this contribution's commands: the command service resolves the id to the registered handler (unknown ids fail with command-not-found)."
  sources:
  - src/vs/platform/commands/common/commands.ts:129-132
  request:
    type: object
    properties:
      command_id:
        type: string
        examples:
        - workbench.action.debug.stepOver
      args:
        type: object
        default: {}
    required:
    - command_id
  response:
    type: object
  errors:
  - code: command-not-found
    status: 0
    retryable: false
  behavior:
  - set:
      vars.routes:
        workbench.action.debug.stepOver: debug-commands.cmd-workbench-action-debug-stepover
        workbench.action.debug.stepInto: debug-commands.cmd-workbench-action-debug-stepinto
        workbench.action.debug.stepOut: debug-commands.cmd-workbench-action-debug-stepout
        workbench.action.debug.pause: debug-commands.cmd-workbench-action-debug-pause
        workbench.action.debug.continue: debug-commands.cmd-workbench-action-debug-continue
        workbench.action.debug.stepBack: debug-commands.cmd-workbench-action-debug-stepback
        workbench.action.debug.reverseContinue: debug-commands.cmd-workbench-action-debug-reversecontinue
        workbench.action.debug.terminateThread: debug-commands.cmd-workbench-action-debug-terminatethread
        debug.startFromConfig: debug-commands.cmd-debug-startfromconfig
        workbench.action.debug.start: debug-commands.cmd-workbench-action-debug-start
        workbench.action.debug.run: debug-commands.cmd-workbench-action-debug-run
        workbench.action.debug.restart: debug-commands.cmd-workbench-action-debug-restart
        workbench.action.debug.stop: debug-commands.cmd-workbench-action-debug-stop
        workbench.action.debug.disconnect: debug-commands.cmd-workbench-action-debug-disconnect
        workbench.action.debug.disconnectAndSuspend: debug-commands.cmd-workbench-action-debug-disconnectandsuspend
        workbench.action.debug.restartFrame: debug-commands.cmd-workbench-action-debug-restartframe
        debug.jumpToCursor: debug-commands.cmd-debug-jumptocursor
        debug.toggleBreakpoint: debug-commands.cmd-debug-togglebreakpoint
        debug.enableOrDisableBreakpoint: debug-commands.cmd-debug-enableordisablebreakpoint
        debug.removeWatchExpression: debug-commands.cmd-debug-removewatchexpression
        debug.breakWhenValueChanges: debug-commands.cmd-debug-breakwhenvaluechanges
        debug.breakWhenValueIsAccessed: debug-commands.cmd-debug-breakwhenvalueisaccessed
        debug.breakWhenValueIsRead: debug-commands.cmd-debug-breakwhenvalueisread
        debug.removeBreakpoint: debug-commands.cmd-debug-removebreakpoint
        debug.installAdditionalDebuggers: debug-commands.cmd-debug-installadditionaldebuggers
        debug.addConfiguration: debug-commands.cmd-debug-addconfiguration
        editor.debug.action.toggleInlineBreakpoint: debug-commands.cmd-editor-debug-action-toggleinlinebreakpoint
        debug.openBreakpointToSide: debug-commands.cmd-debug-openbreakpointtoside
        debug.toggleExceptionBreakpoints: debug-commands.cmd-debug-toggleexceptionbreakpoints
        breakpointWidget.action.acceptInput: breakpoint-widget.cmd-breakpointwidget-action-acceptinput
        closeBreakpointWidget: breakpoint-widget.cmd-closebreakpointwidget
        workbench.debug.viewlet.action.addFunctionBreakpointAction: breakpoints-view.cmd-workbench-debug-viewlet-action-addfunctionbreakpointaction
        workbench.debug.viewlet.action.addDataBreakpointOnAddress: breakpoints-view.cmd-workbench-debug-viewlet-action-adddatabreakpointonaddress
        workbench.debug.viewlet.action.editDataBreakpointOnAddress: breakpoints-view.cmd-workbench-debug-viewlet-action-editdatabreakpointonaddress
        workbench.debug.viewlet.action.toggleBreakpointsActivatedAction: breakpoints-view.cmd-workbench-debug-viewlet-action-togglebreakpointsactivatedact
        workbench.debug.viewlet.action.removeBreakpoint: breakpoints-view.cmd-workbench-debug-viewlet-action-removebreakpoint
        workbench.debug.viewlet.action.removeAllBreakpoints: breakpoints-view.cmd-workbench-debug-viewlet-action-removeallbreakpoints
        workbench.debug.viewlet.action.enableAllBreakpoints: breakpoints-view.cmd-workbench-debug-viewlet-action-enableallbreakpoints
        workbench.debug.viewlet.action.disableAllBreakpoints: breakpoints-view.cmd-workbench-debug-viewlet-action-disableallbreakpoints
        workbench.debug.viewlet.action.reapplyBreakpointsAction: breakpoints-view.cmd-workbench-debug-viewlet-action-reapplybreakpointsaction
        debug.editBreakpoint: breakpoints-view.cmd-debug-editbreakpoint
        debug.editBreakpointMode: breakpoints-view.cmd-debug-editbreakpointmode
        editor.debug.action.toggleBreakpoint: debug-editor-actions.cmd-editor-debug-action-togglebreakpoint
        editor.debug.action.conditionalBreakpoint: debug-editor-actions.cmd-editor-debug-action-conditionalbreakpoint
        editor.debug.action.addLogPoint: debug-editor-actions.cmd-editor-debug-action-addlogpoint
        editor.debug.action.triggerByBreakpoint: debug-editor-actions.cmd-editor-debug-action-triggerbybreakpoint
        editor.debug.action.editBreakpoint: debug-editor-actions.cmd-editor-debug-action-editbreakpoint
        editor.debug.action.runToCursor: debug-editor-actions.cmd-editor-debug-action-runtocursor
        editor.debug.action.stepIntoTargets: debug-editor-actions.cmd-editor-debug-action-stepintotargets
