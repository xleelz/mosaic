- component: terminal-process
  name: on-process-data
  kind: stream
  summary: "node-pty onData: each chunk counts against flow control (pause past the high watermark) and is re-fired as onProcessData."
  sources:
  - src/vs/platform/terminal/node/terminalProcess.ts:333-348
  request:
    type: object
    properties:
      chunks:
        type: array
        items: *id003
        default:
        - '$ '
  response:
    type: object
    properties:
      chars: *id002
      paused: *id004
  behavior:
  - set:
      vars.unacked: 0
      vars.paused: false
  - foreach: "= input.chunks"
    as: chunk
    steps:
    - set:
        vars.unacked: "= vars.unacked + size(vars.chunk)"
    - if: "!vars.paused && vars.unacked > config['terminal-flow-control-high-watermark-chars']"
      then:
      - title: "Flow control: pause node-pty until the renderer acknowledges"
        source: src/vs/platform/terminal/node/terminalProcess.ts:336-340
        set:
          vars.paused: true
    - title: _onProcessData.fire(data)
      source: src/vs/platform/terminal/node/terminalProcess.ts:342-344
      yield:
        data: "= vars.chunk"
  - return:
      chars: "= vars.unacked"
      paused: "= vars.paused"
- component: pty-service
  name: on-process-data
  kind: stream
  summary: "PersistentTerminalProcess: TerminalDataBufferer coalesces the shell's data for 5 ms, the serializer records it for replay, and PtyService re-fires it as {id, event}."
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:353
  - src/vs/platform/terminal/node/ptyService.ts:828-833
  - src/vs/platform/terminal/common/terminalDataBuffering.ts:28-50
  - src/vs/platform/terminal/node/ptyService.ts:1079-1082
  request:
    type: object
    properties:
      id: *id002
      chunks:
        type: array
        items: *id003
        default:
        - '$ '
  response:
    type: object
    properties:
      events: *id002
  errors:
  - code: could-not-find-pty-on-pty-host
    status: 0
    retryable: false
  behavior:
  - if: "!(string(input.id) in state.ptys)"
    then:
    - title: _throwIfNoPty
      source: src/vs/platform/terminal/node/ptyService.ts:679-685
      fail:
        code: could-not-find-pty-on-pty-host
        message: "= 'Could not find pty ' + string(input.id) + ' on pty host'"
  - set:
      vars.pending: ''
  - call: terminal-process.on-process-data
    input:
      chunks: "= input.chunks"
    stream: true
    on_item:
    - set:
        vars.pending: "= vars.pending + vars.item.data"
    as: proc
  - title: "Bufferer flush after throttleBy: data that arrived within the window is one event"
    source: src/vs/platform/terminal/common/terminalDataBuffering.ts:38-50
    wait: "= config['terminal-data-buffer-throttle-ms']"
  - if: "!(string(input.id) in state.ptys) || vars.pending == ''"
    then:
    - return:
        events: 0
  - title: "Data recording for reconnect: the serializer keeps what the renderer was sent"
    source: src/vs/platform/terminal/node/ptyService.ts:832-833
    set:
      state.ptys: "= merge(state.ptys, {string(input.id): {'replay_buffer': (has(state.ptys[string(input.id)].replay_buffer) ? state.ptys[string(input.id)].replay_buffer : '') + vars.pending}})"
  - title: PtyService re-fires onProcessData {id, event}
    source: src/vs/platform/terminal/node/ptyService.ts:353
    yield:
      id: "= input.id"
      event: "= vars.pending"
  - return:
      events: 1
- component: local-terminal-backend
  name: listen-process-data
  kind: function
  summary: "The direct proxy's onProcessData listener: route each {id, event} to the LocalPty with that id (dropped when the window has no such pty)."
  sources:
  - src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:152
  request:
    type: object
    properties:
      id: *id002
      chunks:
        type: array
        items: *id003
        default:
        - '$ '
  response:
    type: object
    properties:
      delivered: *id002
  behavior:
  - set:
      vars.n: 0
  - call: pty-service.on-process-data
    input:
      id: "= input.id"
      chunks: "= input.chunks"
    stream: true
    on_error: continue
    as: src
    on_item:
    - if: string(vars.item.id) in state.ptys
      then:
      - call: local-pty.handle-data
        input:
          id: "= vars.item.id"
          data: "= vars.item.event"
      - set:
          vars.n: "= vars.n + 1"
  - return:
      delivered: "= vars.n"
