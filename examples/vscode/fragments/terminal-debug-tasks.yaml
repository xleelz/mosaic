- component: terminal-task-system
  name: run
  kind: function
  summary: Run a task unless its instance limit is reached (then report the active instance).
  sources:
  - src/vs/workbench/contrib/tasks/browser/terminalTaskSystem.ts:261-293
  request:
    type: object
    properties:
      task: TasksTask
  response:
    type: object
    properties:
      exit_code:
        type:
        - integer
        - "null"
      kind:
        type: string
  behavior:
  - set:
      vars.instances: "= state.active_tasks.filter(k, state.active_tasks[k].label == input.task.label)"
  - if: "size(vars.instances) >= (has(input.task.instance_limit) ? input.task.instance_limit : 1)"
    then:
    - title: "Instance limit reached: TaskExecuteKind.Active"
      source: src/vs/workbench/contrib/tasks/browser/terminalTaskSystem.ts:270-274
      return:
        exit_code: null
        kind: active
  - set:
      state.active_tasks: "= merge(state.active_tasks, {input.task.label: {'label': input.task.label, 'terminal': null, 'is_background': has(input.task.is_background) && input.task.is_background}})"
  - call: terminal-task-system.execute-command
    input:
      task: "= input.task"
    as: r
  - return: "= vars.r.value"
- component: terminal-task-system
  name: execute-command
  kind: function
  summary: Create the task terminal and wait for its process to exit (background tasks stay active).
  sources:
  - src/vs/workbench/contrib/tasks/browser/terminalTaskSystem.ts:808-835
  - src/vs/workbench/contrib/tasks/browser/terminalTaskSystem.ts:1519-1626
  request:
    type: object
    properties:
      task: TasksTask
  response:
    type: object
    properties:
      exit_code:
        type:
        - integer
        - "null"
      kind:
        type: string
  behavior:
  - call: terminal-service.create-terminal
    input:
      executable: /bin/bash
      cwd: file:///work/app
      is_feature_terminal: true
      task_key: "= input.task.label"
      reconnection_properties: "= size(has(input.task.problem_matchers) ? input.task.problem_matchers : []) > 0 ? dyn({'owner': 'Task'}) : dyn(null)"
    fill: true
    as: term
  - set:
      state.active_tasks: "= merge(state.active_tasks, {input.task.label: {'terminal': vars.term.value.persistent_process_id}})"
  - if: vars.term.value.launch_error != null
    then:
    - set:
        state.active_tasks: "= omit(state.active_tasks, input.task.label)"
    - return:
        exit_code: 1
        kind: started
  - if: has(input.task.is_background) && input.task.is_background
    then:
    - return:
        exit_code: null
        kind: started
  - title: "terminal.onExit: the task process ended"
    source: src/vs/workbench/contrib/tasks/browser/terminalTaskSystem.ts:1090-1152
    choice: process_exit
    default: zero
    options:
      zero:
      - set:
          state.active_tasks: "= omit(state.active_tasks, input.task.label)"
      - return:
          exit_code: 0
          kind: started
      nonzero:
      - set:
          state.active_tasks: "= omit(state.active_tasks, input.task.label)"
      - return:
          exit_code: 1
          kind: started
- component: terminal-task-system
  name: terminate
  kind: function
  summary: Terminate an active task by disposing its terminal; unknown tasks report success=false.
  sources:
