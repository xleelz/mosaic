      stop_debugging:
      - title: e.veto(...) answers the lifecycle service
        source: src/vs/workbench/contrib/debug/common/debugLifecycle.ts:23
        call: lifecycle-service.veto
        input:
          id: veto.debug
          veto: false
      - return:
          veto: false
      cancel:
      - title: e.veto(...) answers the lifecycle service
        source: src/vs/workbench/contrib/debug/common/debugLifecycle.ts:23
        call: lifecycle-service.veto
        input:
          id: veto.debug
          veto: true
