- component: terminal-instance-service
  name: get-backend
  kind: function
  summary: Resolve the registered backend for a remote authority (waits for it to register).
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalInstanceService.ts:86-94
  request:
    type: object
    properties:
      remote_authority:
        type:
        - string
        - "null"
        default: null
  response:
    type: object
    properties:
      backend:
        type: string
  errors:
  - code: no-terminal-backend
    status: 0
    retryable: false
  behavior:
  - set:
      vars.key: "= input.remote_authority == null ? 'local' : input.remote_authority"
  - if: "!(vars.key in state.backends) || !state.backends[vars.key]"
    then:
    - title: No backend registered for the authority
      source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:269-272
      fail:
