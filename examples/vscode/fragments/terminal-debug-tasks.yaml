  - call: test-profile-service.get-default-profile-for-test
    input:
      controller_id: "= state.tests[vars.known[0]].controller_id"
      group: "= input.group"
    as: prof
  - set:
      vars.targets: "= vars.prof.value.profile == null ? [] : [{'controller_id': vars.prof.value.profile.controller_id, 'profile_id': vars.prof.value.profile.profile_id, 'test_ids': vars.known}]"
  - call: test-service.run-resolved-tests
    input:
      targets: "= vars.targets"
      group: "= input.group"
      preserve_focus: "= input.preserve_focus"
    as: r
  - return:
      result_id: "= vars.r.value.result_id"
- component: test-service
  name: run-resolved-tests
  kind: function
  summary: Create the live result, ask workspace trust, save before test, run each controller's targets in parallel, mark the result complete.
  sources:
  - src/vs/workbench/contrib/testing/common/testServiceImpl.ts:251-295
  - src/vs/workbench/contrib/testing/common/testServiceImpl.ts:443-452
  request:
    type: object
    properties:
      targets:
        type: array
        items: {}
      group:
        type: string
        examples:
        - run
      preserve_focus:
        type: boolean
        default: false
  response:
    type: object
    properties:
      result_id:
        type: string
      errors:
        type: array
        items: {}
  behavior:
  - call: test-result-service.create-live-result
    input:
      group: "= input.group"
    as: res
  - call: workspace-trust-request-service.request-workspace-trust
    input:
      message: Running tests may execute code in your workspace.
    as: trust
  - choice: trust
    default: "= vars.trust.value.trusted == true ? 'trusted' : 'denied'"
    options:
      trusted: []
      denied:
      - call: test-result-service.mark-complete
        input:
          result_id: "= vars.res.value.result_id"
      - return:
          result_id: "= vars.res.value.result_id"
          errors: []
  - set:
      state.running: "= merge(state.running, {vars.res.value.result_id: true})"
  - if: "!input.preserve_focus && config['testing-save-before-test']"
    then:
    - title: saveAllBeforeTest
      source: src/vs/workbench/contrib/testing/common/testServiceImpl.ts:443-452
      call: editor-service.save-all
      input:
        reason: explicit
  - parallel: "= input.targets.filter(t, t.controller_id in state.controllers)"
    as: t
    join:
      need: all
    as_result: runs
    steps:
    - title: "getTestController(id)?.runTests: unknown controllers are skipped"
      source: src/vs/workbench/contrib/testing/common/testServiceImpl.ts:270-285
      call: ext-host-testing.run-controller-tests
      "on": eh1
      input:
        run_id: "= vars.res.value.result_id"
        controller_id: "= vars.t.controller_id"
        profile_id: "= vars.t.profile_id"
        test_ids: "= vars.t.test_ids"
      as: rr
    - return: "= vars.rr.value"
  - set:
      vars.errors: "= vars.runs.results.filter(r, r.ok && has(r.value.error) && r.value.error != null).map(r, r.value.error)"
  - when: size(vars.errors) > 0
    set:
      ctx.test_run_error: "= 'An error occurred attempting to run tests: ' + vars.errors.join(' ')"
  - set:
      state.running: "= omit(state.running, vars.res.value.result_id)"
  - call: test-result-service.mark-complete
    input:
      result_id: "= vars.res.value.result_id"
  - return:
      result_id: "= vars.res.value.result_id"
      errors: "= vars.errors"
