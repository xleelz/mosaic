- component: local-terminal-backend
  name: get-terminal-layout-info
  kind: function
  summary: Revive processes from stored buffer state if present (then restore the stored layout on the pty host), then ask the pty host for the layout.
  sources:
  - src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:330-373
  response:
    type: object
    properties:
      tabs:
        type:
        - array
        - "null"
      background:
        type:
        - array
        - "null"
  behavior:
  - call: local-terminal-backend.workspace-storage-get
    input:
      key: terminal.integrated.bufferState
    as: buf
  - if: vars.buf.value != null && size(vars.buf.value.state) > 0
    then:
    - title: Revive processes from the serialized buffers
      source: src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:334-357
      call: pty-service.revive-terminal-processes
      input:
        workspace_id: w1-app
        state: "= vars.buf.value.state"
    - call: local-terminal-backend.workspace-storage-remove
      input:
        key: terminal.integrated.bufferState
    - call: local-terminal-backend.workspace-storage-get
      input:
        key: terminal.integrated.layoutInfo
      as: lay
    - if: vars.lay.value != null
      then:
      - title: Send the stored layout back to the pty host (it was not persisted on exit)
        source: src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:358-366
        call: pty-service.set-terminal-layout-info
        input:
          workspace_id: w1-app
          tabs: "= vars.lay.value.tabs"
          background: "= vars.lay.value.background"
      - call: local-terminal-backend.workspace-storage-remove
        input:
          key: terminal.integrated.layoutInfo
  - call: pty-service.get-terminal-layout-info
    input:
      workspace_id: w1-app
    as: layout
  - return: "= vars.layout.value"
