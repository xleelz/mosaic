- component: local-terminal-backend
  name: attach-to-process
  kind: function
  summary: Attach to an existing persistent pty (reconnect); failures are logged and return nothing.
  sources:
  - src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:224-235
  - src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:237-250
  request:
    type: object
    properties:
      id:
        type: integer
        examples:
        - 1
      pid:
        type: integer
        examples:
        - 4242
      find_revived_id:
        type: boolean
        default: false
  response:
    type: object
    properties:
      attached:
        type: boolean
      id:
        type: integer
  behavior:
  - call: local-terminal-backend.connect-to-direct-proxy
  - set:
      vars.id: "= input.id"
  - if: input.find_revived_id
    then:
    - call: pty-service.get-revived-pty-new-id
      input:
        workspace_id: w1-app
        id: "= input.id"
      as: rev
    - when: vars.rev.value.new_id != null
      set:
        vars.id: "= vars.rev.value.new_id"
  - call: pty-service.attach-to-process
    input:
      id: "= vars.id"
      pid: "= input.find_revived_id ? 0 : input.pid"
    as: att
    on_error: continue
  - if: "!vars.att.ok"
    then:
    - title: "Couldn't attach to process: warn and return undefined"
      source: src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:231-233
      return:
        attached: false
        id: "= vars.id"
  - set:
      state.ptys: "= merge(state.ptys, {string(vars.id): {'should_persist': true}})"
  - return:
      attached: true
      id: "= vars.id"
