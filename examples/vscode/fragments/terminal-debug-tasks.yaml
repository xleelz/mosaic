- component: terminal-profile-service
  name: get-default-profile
  kind: function
  summary: Default profile for the OS (terminal.integrated.defaultProfile.*).
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalProfileService.ts:117-134
  response:
    type: object
    properties:
      profile_name:
        type: string
      path:
        type: string
      args:
        type: array
        items: {}
  behavior:
  - if: state.default_profile_name in state.available_profiles
    then:
    - return: "= state.available_profiles[state.default_profile_name]"
  - title: "No configured default: fall back to the first available profile"
    source: src/vs/workbench/contrib/terminal/browser/terminalProfileService.ts:117-134
    return: "= state.available_profiles[state.available_profiles.map(k, k)[0]]"
- component: terminal-profile-resolver-service
  name: resolve-shell-launch-config
  kind: function
  summary: Fill executable/args of a launch config from the default profile when it has none.
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalProfileResolverService.ts:110-154
  request:
    type: object
    properties:
      executable:
        type: string
        default: ''
      args:
        type: array
        items: {}
  response:
    type: object
    properties:
      executable:
        type: string
      args:
        type: array
        items: {}
  behavior:
  - if: input.executable != ''
    then:
    - return:
        executable: "= input.executable"
        args: "= input.args"
  - call: terminal-profile-service.get-default-profile
    as: p
  - return:
      executable: "= vars.p.value.path"
      args: "= vars.p.value.args"
