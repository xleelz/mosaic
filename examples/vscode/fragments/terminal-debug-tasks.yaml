  summary: Save before run (task.saveBeforeRun), wait for problem matchers, run on the task system; an active instance follows the instance policy.
  sources:
  - src/vs/workbench/contrib/tasks/browser/abstractTaskService.ts:2075-2095
  - src/vs/workbench/contrib/tasks/browser/abstractTaskService.ts:2048-2073
  - src/vs/workbench/contrib/tasks/browser/abstractTaskService.ts:2097-2120
  request:
    type: object
    properties:
      task:
        type: object
      run_source:
        type: string
        examples:
        - user
  response:
    type: object
    properties:
      exit_code:
        type:
        - integer
        - "null"
      kind:
        type: string
  behavior:
  - if: config['task-save-before-run'] == 'always'
    then:
    - call: editor-service.save-all
      input:
        reason: explicit
  - if: config['task-save-before-run'] == 'prompt'
    then:
    - choice: save_prompt
      default: save
      options:
        save:
        - call: editor-service.save-all
          input:
            reason: explicit
        dont_save: []
  - call: problem-matcher-registry.on-ready
  - call: terminal-task-system.run
    input:
      task: "= input.task"
    as: r
  - if: vars.r.value.kind == 'active'
    then:
    - if: input.run_source == 'folderOpen' || input.run_source == 'reconnect'
      then:
      - return:
          exit_code: null
          kind: active
    - title: "Instance limit reached: instance policy (default prompt: pick an instance to terminate)"
      source: src/vs/workbench/contrib/tasks/browser/abstractTaskService.ts:2124-2150
      set:
        ctx.task_instance_policy_prompt: true
    - return:
        exit_code: null
        kind: active
  - when: input.run_source == 'user'
    set:
      state.recently_used: "= [input.task.label] + state.recently_used.filter(l, l != input.task.label)"
  - return: "= vars.r.value"
- component: task-service
  name: run-task-command
  kind: function
  summary: "Tasks: Run Task with an optional label; an exact label match runs (attaching problem matchers), otherwise the quick pick opens."
  sources:
  - src/vs/workbench/contrib/tasks/browser/abstractTaskService.ts:3116-3154
  request:
    type: object
    properties:
      filter:
        type: string
        examples:
        - build
        default: ''
  response:
    type: object
    properties:
      ran:
        type: boolean
  behavior:
  - if: "!state.tasks_reconnected"
    then:
    - return:
        ran: false
  - if: input.filter != '' && input.filter in state.workspace_tasks
    then:
    - call: task-service.run
      input:
        task: "= state.workspace_tasks[input.filter]"
        run_source: user
    - return:
        ran: true
  - title: "No exact match: show the task quick pick"
    source: src/vs/workbench/contrib/tasks/browser/abstractTaskService.ts:3187-3227
    choice: quick_pick
    default: dismissed
    options:
      dismissed:
      - return:
          ran: false
      first:
      - if: size(state.workspace_tasks) == 0
        then:
        - return:
            ran: false
      - call: task-service.run
        input:
          task: "= state.workspace_tasks[state.workspace_tasks.map(k, k)[0]]"
          run_source: user
      - return:
          ran: true
