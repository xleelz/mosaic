- component: terminal-service
  name: set-active-instance
  kind: function
  summary: Make an instance the active terminal and reveal it.
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:378-393
  request:
    type: object
    properties:
      instance_id:
        type: integer
        examples:
        - 1
  response:
    type: object
    properties:
      found:
        type: boolean
  behavior:
  - if: "!(string(input.instance_id) in state.instances)"
    then:
    - return:
        found: false
  - set:
      state.active_instance: "= input.instance_id"
  - return:
      found: true
- component: terminal-service
  name: send-text-to-active
  kind: function
  summary: "instance.sendText on the active terminal: written to the pty (queued until ready)."
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:578-593
  request:
    type: object
    properties:
      text:
        type: string
        examples:
        - "npm test\r"
  response:
    type: object
    properties:
      sent:
        type: boolean
  behavior:
  - if: state.active_instance == null || !(string(state.active_instance) in state.instances)
    then:
    - return:
        sent: false
  - call: local-pty.input
    input:
      id: "= state.instances[string(state.active_instance)].persistent_process_id"
      data: "= input.text"
  - return:
      sent: true
