- component: terminal-process-manager
  name: on-pty-host-restart
  kind: function
  summary: "Each process manager on onPtyHostRestart: mark disconnected; a feature terminal without reconnection properties (a task) exits -1, a normal terminal prints the restart message and relaunches\
    \ its shell."
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:589-617
  - src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:459-474
  subscribe:
  - local-terminal-backend.on-pty-host-restart
  request:
    type: object
  response:
    type: object
    properties:
      relaunched: *id002
      exited: *id002
  behavior:
  - set:
      vars.relaunched: 0
      vars.exited: 0
      vars.live: "= state.procs.filter(k, state.procs[k].process_state == 'running')"
  - foreach: "= vars.live"
    as: k
    steps:
    - set:
        vars.p: "= state.procs[vars.k]"
    - if: vars.p.is_feature_terminal && !vars.p.has_reconnection
      then:
      - title: "Feature terminal (task): report the process exited with -1"
        source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:598-605
        set:
          state.procs: "= merge(state.procs, {vars.k: {'disconnected': true, 'process_state': 'killed-by-process', 'exit_code': -1}})"
      - publish: terminal-process-manager.on-process-exit
        delivery: sync
        input:
          persistent_process_id: "= int(vars.k)"
          exit_code: -1
      - set:
          vars.exited: "= vars.exited + 1"
      else:
      - title: "Normal terminal: write the restart message, then relaunch with the previous shell launch config"
        source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:606-615
        set:
          state.procs: "= merge(state.procs, {vars.k: {'disconnected': true, 'output': vars.p.output + 'Restarting the terminal because the connection to the shell process was lost...'}})"
      - set:
          vars.old_output: "= state.procs[vars.k].output"
      - set:
          state.procs: "= omit(state.procs, vars.k)"
      - call: terminal-process-manager.create-process
        input: "= merge(vars.p.slc, {'attach_persistent_process': null})"
        as: rl
      - set:
          state.procs: "= merge(state.procs, {string(vars.rl.value.persistent_process_id): {'output': vars.old_output}})"
      - title: "onAnyInstanceProcessIdReady: the instance now points at the new process"
        source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:564
        publish: terminal-process-manager.on-process-id-ready
        delivery: sync
        input:
          old_id: "= int(vars.k)"
          new_id: "= vars.rl.value.persistent_process_id"
      - set:
          vars.relaunched: "= vars.relaunched + 1"
  - return:
      relaunched: "= vars.relaunched"
      exited: "= vars.exited"
