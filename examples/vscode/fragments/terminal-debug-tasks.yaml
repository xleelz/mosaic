- component: debug-editor-actions
  name: cmd-editor-debug-action-togglebreakpoint
  kind: command
  summary: "F9: remove the breakpoints on the cursor line, or add one when the language allows breakpoints (instruction breakpoints in the disassembly view)."
  sources:
  - src/vs/workbench/contrib/debug/browser/debugEditorActions.ts:636
  - src/vs/workbench/contrib/debug/browser/debugEditorActions.ts:37-99
  attributes:
    command_id: editor.debug.action.toggleBreakpoint
  request:
    type: object
    properties:
      command_id:
        type: string
        examples:
        - editor.debug.action.toggleBreakpoint
      args:
        type: array
        items: {}
        default: []
  response:
    type: object
  behavior:
  - set:
      vars.cmdargs: "= merge({\"uri\": \"file:///work/app/src/main.ts\", \"line_number\": 2, \"language_id\": \"typescript\"}, has(input.args) && size(input.args) > 0 && input.args[0] != null ? input.args[0]\
        \ : {})"
  - call: debug-model.get-breakpoints
    input:
      uri: "= vars.cmdargs.uri"
      line_number: "= vars.cmdargs.line_number"
      enabled_only: false
    as: bps
  - if: size(vars.bps.value.breakpoints) > 0
    then:
    - call: debug-service.remove-breakpoints
      input:
        ids: "= vars.bps.value.breakpoints.map(b, b.id)"
    - return:
        toggled: removed
  - call: adapter-manager.can-set-breakpoints-in
    input:
      language_id: "= vars.cmdargs.language_id"
    as: can
  - if: "!vars.can.value.allowed"
    then:
    - return:
        toggled: none
  - call: debug-service.add-breakpoints
    input:
      uri: "= vars.cmdargs.uri"
      breakpoints:
      - line_number: "= vars.cmdargs.line_number"
  - return:
      toggled: added
