  summary: Create a TerminalProcess wrapped in a PersistentTerminalProcess under a new id (not started yet).
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:319-365
  request:
    type: object
    properties:
      executable:
        type: string
        examples:
        - /bin/bash
      cwd:
        type: string
        examples:
        - file:///work/app
      cols:
        type: integer
        examples:
        - 80
      rows:
        type: integer
        examples:
        - 30
      should_persist:
        type: boolean
        default: true
      workspace_id:
        type: string
        examples:
        - w1-app
      attach:
        type: boolean
        default: false
      is_reviving:
        type: boolean
        default: false
      type:
        type: string
        default: ''
  response:
    type: object
    properties:
      id:
        type: integer
  errors:
  - code: attempt-to-create-a-process-when-attach-object-was-provided
    status: 0
    retryable: false
  behavior:
  - if: input.attach
    then:
    - fail:
        code: attempt-to-create-a-process-when-attach-object-was-provided
        message: Attempt to create a process when attach object was provided
  - set:
      vars.id: "= state.last_pty_id + 1"
  - set:
      state.last_pty_id: "= vars.id"
      state.ptys: "= merge(state.ptys, {string(vars.id): {'id': vars.id, 'executable': input.executable, 'cwd': input.cwd, 'workspace_id': input.workspace_id, 'should_persist': input.should_persist, 'started':\
        \ false, 'interaction': 'None', 'was_revived': input.is_reviving, 'pid': 0, 'grace_scheduled_at': null, 'type': input.type}})"
  - return:
      id: "= vars.id"
- component: pty-service
  name: start
  kind: function
  summary: "Start the persistent process: the first start spawns it (or returns the launch error); a later start replays the buffer."
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:440-443
  - src/vs/platform/terminal/node/ptyService.ts:868-895
  request:
    type: object
    properties:
      id:
        type: integer
        examples:
        - 1
  response:
    type: object
    properties:
      message:
        type: string
      pid:
        type: integer
  behavior:
  - if: "!(string(input.id) in state.ptys)"
    then:
    - return:
        message: "= 'Could not find pty with id \"' + string(input.id) + '\"'"
  - set:
      vars.p: "= state.ptys[string(input.id)]"
  - if: vars.p.started
    then:
    - title: "Already started: fire ready and replay the buffer"
      source: src/vs/platform/terminal/node/ptyService.ts:889-893
      call: pty-service.trigger-replay
      input:
        id: "= input.id"
    - return:
        pid: "= vars.p.pid"
  - call: terminal-process.start
    input:
      executable: "= vars.p.executable"
      cwd: "= vars.p.cwd"
    as: spawn
  - if: has(vars.spawn.value.message)
    then:
    - return:
        message: "= vars.spawn.value.message"
  - set:
      state.ptys: "= merge(state.ptys, {string(input.id): {'started': true, 'pid': vars.spawn.value.pid, 'interaction': vars.p.was_revived ? 'ReplayOnly' : vars.p.interaction}})"
  - title: A revived process replays its buffer on first start
    source: src/vs/platform/terminal/node/ptyService.ts:883
    if: vars.p.was_revived
    then:
    - call: pty-service.trigger-replay
      input:
        id: "= input.id"
  - return:
      pid: "= vars.spawn.value.pid"
- component: pty-service
  name: input
  kind: function
  summary: Write input to the process; marks the process as interacted with this session.
