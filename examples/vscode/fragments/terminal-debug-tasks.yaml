      command:
        type: string
        examples:
        - initialize
      arguments:
        type: object
      timeout_ms:
        type: integer
        examples:
        - 0
        default: 0
  response:
    type: object
    properties:
      success:
        type: boolean
      body:
        type: object
  errors:
  - code: no-debugger-available-found
    status: 0
    retryable: false
  - code: debug-adapter-error
    status: 0
    retryable: false
  behavior:
  - if: "!(input.session_id in state.sessions) || !state.sessions[input.session_id].adapter_running"
    then:
    - if: input.session_id in state.sessions && state.sessions[input.session_id].in_shutdown
      then:
      - return:
          success: true
          body: {}
    - fail:
        code: no-debugger-available-found
        message: "= 'No debugger available found. Can not send ' + input.command + '.'"
  - title: ExtensionHostDebugAdapter.sendMessage -> $sendDAMessage
    source: src/vs/workbench/api/browser/mainThreadDebugService.ts:492-494
    call: ext-host-debug-service.send-da-message
    "on": "= 'eh' + self.substring(1)"
    input:
      handle: 1
      command: "= input.command"
      arguments: "= input.arguments"
    timeout_ms: "= input.timeout_ms > 0 ? input.timeout_ms : 30000"
    as: r
  - return: "= vars.r.value"
- component: raw-debug-session
  name: on-adapter-event
  kind: function
  summary: "Dispatch a DAP event from the adapter: initialized (ready for breakpoints), stopped, terminated."
  sources:
  - src/vs/workbench/contrib/debug/browser/rawDebugSession.ts:109-147
  request:
    type: object
    properties:
      session_id:
        type: string
        examples:
        - session-1
      event:
        type: string
        examples:
        - initialized
        enum:
        - initialized
        - stopped
        - terminated
      reason:
        type: string
        examples:
        - breakpoint
        default: breakpoint
  response:
    type: object
  behavior:
  - if: "!(input.session_id in state.sessions) || !state.sessions[input.session_id].adapter_running"
    then:
    - return: {}
  - if: input.event == 'initialized'
    then:
    - set:
        state.sessions: "= merge(state.sessions, {input.session_id: {'ready_for_breakpoints': true}})"
    - call: debug-model.update-session
      input:
        session_id: "= input.session_id"
        update:
          ready_for_breakpoints: true
    - call: debug-session.on-did-initialize
      input:
        session_id: "= input.session_id"
    - return: {}
  - if: input.event == 'stopped'
    then:
    - call: debug-session.handle-stop
      input:
        session_id: "= input.session_id"
        reason: "= input.reason"
    - return: {}
  - call: debug-session.on-did-terminate-debuggee
    input:
      session_id: "= input.session_id"
- component: raw-debug-session
  name: shutdown
  kind: function
  summary: "shutdown(error?): send disconnect (200 ms with an error, else 2 s; errors swallowed), stop the adapter, then fire the adapter exit event. The error travels with it only if stopping the adapter\
    \ failed."
  sources:
  - src/vs/workbench/contrib/debug/browser/rawDebugSession.ts:592-617
  - src/vs/workbench/contrib/debug/browser/rawDebugSession.ts:619-645
  request:
    type: object
    properties:
      session_id:
        type: string
        examples:
        - session-1
      terminate_debuggee:
        type: boolean
        default: true
      error:
        type:
        - string
        - "null"
        default: null
  response:
    type: object
  behavior:
  - if: "!(input.session_id in state.sessions) || state.sessions[input.session_id].in_shutdown"
    then:
    - return: {}
  - set:
      state.sessions: "= merge(state.sessions, {input.session_id: {'in_shutdown': true}})"
  - call: raw-debug-session.send
    input:
      session_id: "= input.session_id"
      command: disconnect
      arguments:
        restart: false
        terminateDebuggee: "= has(input.terminate_debuggee) ? input.terminate_debuggee : null"
      timeout_ms: "= has(input.error) && input.error != null ? config['debug-disconnect-error-timeout-ms'] : config['debug-disconnect-timeout-ms']"
    on_error: continue
    title: "disconnect: with an error the DA is probably gone, so a much shorter timeout"
    source: src/vs/workbench/contrib/debug/browser/rawDebugSession.ts:605-606
  - title: ExtensionHostDebugAdapter.stopSession -> $stopDASession
    source: src/vs/workbench/api/browser/mainThreadDebugService.ts:496-499
    call: ext-host-debug-service.stop-da-session
    "on": "= 'eh' + self.substring(1)"
    input:
      handle: 1
    on_error: continue
    as: stop
  - set:
      state.sessions: "= merge(state.sessions, {input.session_id: {'adapter_running': false}})"
  - call: debug-session.on-did-exit-adapter
    input:
      session_id: "= input.session_id"
      error: "= has(input.error) && input.error != null && !vars.stop.ok ? input.error : null"
    title: "fireAdapterExitEvent: e.error only when the adapter could not be stopped"
    source: src/vs/workbench/contrib/debug/browser/rawDebugSession.ts:632-645
- component: debug-session
  name: initialize
