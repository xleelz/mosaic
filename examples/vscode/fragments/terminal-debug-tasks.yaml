    then:
    - title: Don't throw if the pty is already shut down
      source: src/vs/platform/terminal/node/ptyService.ts:447-449
      return: {}
  - call: terminal-process.shutdown
    input:
      immediate: "= input.immediate"
  - title: "onProcessExit: dispose the persistent process and delete it"
    source: src/vs/platform/terminal/node/ptyService.ts:343-351
