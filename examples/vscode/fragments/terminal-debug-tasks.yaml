- component: pty-service
  name: attach-to-process
  kind: function
  summary: "Reconnect a window to a persistent process: checks pid, cancels the disconnect (grace time) runners."
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:368-380
  - src/vs/platform/terminal/node/ptyService.ts:836-842
  request:
    type: object
    properties:
      id:
        type: integer
        examples:
        - 1
      pid:
        type: integer
        examples:
        - 0
  response:
    type: object
  errors:
  - *id001
  - code: pty-has-unexpected-pid
    status: 0
    retryable: false
  behavior:
  - if: "!(string(input.id) in state.ptys)"
    then:
    - title: _throwIfNoPty
      source: src/vs/platform/terminal/node/ptyService.ts:679-685
      fail:
        code: could-not-find-pty-on-pty-host
        message: "= 'Could not find pty ' + string(input.id) + ' on pty host'"
  - if: input.pid != 0 && state.ptys[string(input.id)].pid != input.pid
    then:
    - fail:
        code: pty-has-unexpected-pid
        message: "= 'Pty ' + string(input.id) + ' has pid ' + string(state.ptys[string(input.id)].pid) + ', expected ' + string(input.pid)"
  - title: Cancel both disconnect runners
    source: src/vs/platform/terminal/node/ptyService.ts:840-841
    set:
      state.ptys: "= merge(state.ptys, {string(input.id): {'grace_scheduled_at': null}})"
- component: pty-service
  name: detach-from-process
  kind: function
  summary: "Window detached: keep a persistent, interacted-with process alive for the grace time, else shut it down."
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:413-415
  - src/vs/platform/terminal/node/ptyService.ts:844-852
  request:
    type: object
    properties:
      id:
        type: integer
        examples:
        - 1
      force_persist:
        type: boolean
        default: false
  response:
    type: object
    properties:
      kept:
        type: boolean
  errors:
  - *id001
  behavior:
  - if: "!(string(input.id) in state.ptys)"
    then:
    - title: _throwIfNoPty
      source: src/vs/platform/terminal/node/ptyService.ts:679-685
      fail:
        code: could-not-find-pty-on-pty-host
        message: "= 'Could not find pty ' + string(input.id) + ' on pty host'"
  - set:
      vars.p: "= state.ptys[string(input.id)]"
  - if: vars.p.should_persist && (vars.p.interaction != 'None' || input.force_persist)
    then:
    - title: Schedule the disconnect runner (reconnection grace time)
      source: src/vs/platform/terminal/node/ptyService.ts:812-814
      set:
        state.ptys: "= merge(state.ptys, {string(input.id): {'grace_scheduled_at': now}})"
    - emit: pty-service.disconnect-runner-expired
      after_ms: "= config['pty-reconnect-grace-time-ms']"
      input:
        id: "= input.id"
        scheduled_at: "= now"
    - return:
        kept: true
  - call: pty-service.shutdown
    input:
      id: "= input.id"
      immediate: true
  - return:
      kept: false
- component: pty-service
  name: disconnect-runner-expired
  kind: function
  summary: "The reconnection grace time expired without a reconnect: shut the process down."
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:812-814
  request:
    type: object
    properties:
      id:
        type: integer
        examples:
        - 1
      scheduled_at:
        type: integer
  response:
    type: object
    properties:
      shutdown:
        type: boolean
  behavior:
  - if: "!(string(input.id) in state.ptys) || state.ptys[string(input.id)].grace_scheduled_at != input.scheduled_at"
    then:
    - title: Runner was cancelled by a reconnect
      source: src/vs/platform/terminal/node/ptyService.ts:840-841
      return:
        shutdown: false
  - call: pty-service.shutdown
    input:
      id: "= input.id"
      immediate: true
  - return:
      shutdown: true
- component: pty-service
  name: reduce-connection-grace-time
  kind: function
  summary: After a reconnect, switch running disconnect runners to the short grace time.
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:418-422
  - src/vs/platform/terminal/node/ptyService.ts:989-998
  response:
    type: object
  behavior:
  - foreach: "= state.ptys"
    as: p
    index: k
    steps:
    - when: vars.p.grace_scheduled_at != null
      emit: pty-service.disconnect-runner-expired
      after_ms: "= config['pty-reconnect-short-grace-time-ms']"
      input:
        id: "= vars.p.id"
        scheduled_at: "= vars.p.grace_scheduled_at"
