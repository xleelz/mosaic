- component: run-automatic-tasks
  name: try-run-tasks
  kind: function
  summary: "On folder open: if trusted and not explicitly turned off, find runOn=folderOpen tasks; run them when allowed, else prompt once."
  sources:
  - src/vs/workbench/contrib/tasks/browser/runAutomaticTasks.ts:46-90
  - src/vs/workbench/contrib/tasks/browser/runAutomaticTasks.ts:161-178
  request:
    type: object
    properties:
      user_set_off:
        type: boolean
        default: false
  response:
    type: object
    properties:
      ran:
        type: integer
  behavior:
  - call: workspace-trust-management-service.is-workspace-trusted
    as: tr
  - choice: trust
    default: "= vars.tr.value.trusted == true ? 'trusted' : 'untrusted'"
    options:
      trusted: []
      untrusted:
      - return:
          ran: 0
  - if: state.has_run_tasks || (config['task-allow-automatic-tasks'] == 'off' && input.user_set_off)
    then:
    - return:
        ran: 0
  - set:
      state.has_run_tasks: true
  - call: task-service.get-workspace-tasks
    as: ws
  - set:
      vars.auto: "= vars.ws.value.tasks.filter(t, has(t.run_on) && t.run_on == 'folderOpen')"
  - if: size(vars.auto) == 0
    then:
    - title: "No automatic tasks: wait up to 10 s for the task config, then give up"
      source: src/vs/workbench/contrib/tasks/browser/runAutomaticTasks.ts:70-82
      wait: "= config['task-auto-run-wait-ms']"
    - return:
        ran: 0
  - if: config['task-allow-automatic-tasks'] != 'on'
    then:
    - if: state.has_prompted
      then:
      - return:
          ran: 0
    - set:
        state.has_prompted: true
    - title: "Prompt: allow automatic tasks in all trusted workspaces?"
      source: src/vs/workbench/contrib/tasks/browser/runAutomaticTasks.ts:180-214
      choice: allow
      default: disallow
      options:
        allow: []
        disallow:
        - return:
            ran: 0
  - foreach: "= vars.auto"
    as: t
    steps:
    - call: task-service.run
      input:
        task: "= vars.t"
        run_source: folderOpen
  - return:
      ran: "= size(vars.auto)"
