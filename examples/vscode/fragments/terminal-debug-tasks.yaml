    - debug-commands.cmd-debug-breakwhenvaluechanges
    - debug-commands.cmd-debug-breakwhenvalueisaccessed
    - debug-commands.cmd-debug-breakwhenvalueisread
    - debug-commands.cmd-debug-enableordisablebreakpoint
    - debug-commands.cmd-debug-installadditionaldebuggers
    - debug-commands.cmd-debug-jumptocursor
    - debug-commands.cmd-debug-openbreakpointtoside
    - debug-commands.cmd-debug-removebreakpoint
    - debug-commands.cmd-debug-removewatchexpression
    - debug-commands.cmd-debug-startfromconfig
    - debug-commands.cmd-debug-togglebreakpoint
    - debug-commands.cmd-debug-toggleexceptionbreakpoints
    - debug-commands.cmd-editor-debug-action-toggleinlinebreakpoint
    - debug-commands.cmd-workbench-action-debug-continue
    - debug-commands.cmd-workbench-action-debug-disconnect
    - debug-commands.cmd-workbench-action-debug-disconnectandsuspend
