- component: terminal-process-manager
  name: create-process
  kind: function
  summary: Attach to a persistent process (reconnect) or launch a new one; the process becomes Launching, then Running once start() succeeds.
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:248-457
  - src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:529-567
  request: TerminalShellLaunchConfig
  response: TerminalInstanceInfo
  behavior:
  - call: terminal-instance-service.get-backend
    input:
      remote_authority: null
    as: backend
  - call: terminal-configuration-service.get-config
    as: cfg
  - set:
      vars.pid: null
      vars.attached: false
  - if: input.attach_persistent_process != null
    then:
    - title: "Reconnect: attach to the persistent process"
      source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:350-363
      call: local-terminal-backend.attach-to-process
      input:
        id: "= input.attach_persistent_process.id"
        pid: "= input.attach_persistent_process.pid"
        find_revived_id: "= has(input.attach_persistent_process.find_revived_id) ? input.attach_persistent_process.find_revived_id : false"
      as: att
    - if: vars.att.value.attached
      then:
      - set:
          vars.pid: "= vars.att.value.id"
          vars.attached: true
      else:
      - title: "Attach failed: warn and create a new terminal"
        source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:361-362
        call: terminal-log-service.warn
        input:
          message: Attach to process failed for terminal
  - if: "!vars.attached"
    then:
    - call: terminal-profile-resolver-service.resolve-shell-launch-config
      input:
        executable: "= has(input.executable) ? input.executable : ''"
        args: "= has(input.args) ? input.args : []"
      as: slc
    - call: environment-variable-service.get-merged-collection
      as: env
    - title: shouldPersist = (task reconnection or not a feature terminal) && enablePersistentSessions && !isTransient
      source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:565-566
      call: local-terminal-backend.create-process
      input:
        executable: "= vars.slc.value.executable"
        cwd: "= has(input.cwd) ? input.cwd : 'file:///work/app'"
        cols: 80
        rows: 30
        should_persist: "= ((config['task-reconnection'] && input.reconnection_properties != null) || !input.is_feature_terminal) && vars.cfg.value.enable_persistent_sessions && !input.is_transient"
        type: "= has(input.task_key) && input.task_key != null ? 'Task' : ''"
      as: created
    - set:
        vars.pid: "= vars.created.value.id"
  - title: "Listen to the process before start(): remember its launch config and state"
    source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:386-443
    set:
      state.procs: "= merge(state.procs, {string(vars.pid): {'executable': has(input.executable) ? input.executable : '', 'cwd': has(input.cwd) ? input.cwd : 'file:///work/app', 'is_feature_terminal': input.is_feature_terminal,\
        \ 'has_reconnection': input.reconnection_properties != null, 'process_state': 'running', 'exit_code': null, 'disconnected': false, 'output': string(vars.pid) in state.procs ? state.procs[string(vars.pid)].output\
        \ : '', 'slc': input}})"
  - title: Process state Launching; start() the process
    source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:386-443
    call: local-pty.start
    input:
      id: "= vars.pid"
    as: started
  - if: has(vars.started.value.message)
    then:
    - title: "Launch error: the instance shows the error; the exit during launch marks KilledDuringLaunch"
      source: src/vs/workbench/contrib/terminal/browser/terminalProcessManager.ts:444-447
      return:
        instance_id: 0
        persistent_process_id: "= vars.pid"
        location: panel
        shell: "= has(input.executable) ? input.executable : ''"
        cwd: file:///work/app
        process_state: killed-during-launch
        should_persist: false
        hide_from_user: false
        launch_error: "= vars.started.value.message"
  - title: "The shell writes its prompt: node-pty data flows to the renderer through the direct proxy"
    source: src/vs/workbench/contrib/terminal/electron-browser/localTerminalBackend.ts:152
    when: "!vars.attached"
    emit: local-terminal-backend.listen-process-data
    input:
      id: "= vars.pid"
      chunks:
      - '$ '
  - return:
      instance_id: 0
      persistent_process_id: "= vars.pid"
      location: panel
      shell: "= has(input.executable) ? input.executable : ''"
      cwd: "= has(input.cwd) ? input.cwd : 'file:///work/app'"
      process_state: running
      should_persist: "= vars.attached || (((config['task-reconnection'] && input.reconnection_properties != null) || !input.is_feature_terminal) && vars.cfg.value.enable_persistent_sessions && !input.is_transient)"
      hide_from_user: "= input.hide_from_user"
      launch_error: null
- component: terminal-service
  name: create-terminal
  kind: function
  summary: "Create a terminal: default profile, cwd, location; background (hideFromUser) terminals are tracked separately; activates onTerminal:*."
  sources:
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:975-1097
  - src/vs/workbench/contrib/terminal/browser/terminalService.ts:1224-1238
  request: TerminalShellLaunchConfig
  response: TerminalInstanceInfo
  errors:
  - code: no-terminal-backend
    status: 0
    retryable: false
  behavior:
  - if: "!has(input.executable) || input.executable == ''"
    then:
    - title: "No config: use the default profile"
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:1000-1003
      call: terminal-profile-service.get-default-profile
      as: prof
    - set:
        vars.exe: "= vars.prof.value.path"
    else:
    - set:
        vars.exe: "= input.executable"
  - set:
      vars.slc: "= merge(input, {'executable': vars.exe})"
  - if: input.hide_from_user
    then:
    - title: "Background terminal: created without a group and tracked as backgrounded"
      source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:1074-1080
      call: terminal-instance-service.create-instance
      input: "= vars.slc"
      as: bg
    - set:
        vars.bginfo: "= merge(vars.bg.value, {'instance_id': state.next_instance_id, 'location': 'panel'})"
    - set:
        state.instances: "= merge(state.instances, {string(state.next_instance_id): vars.bginfo})"
        state.backgrounded: "= state.backgrounded + [state.next_instance_id]"
        state.next_instance_id: "= state.next_instance_id + 1"
    - return: "= vars.bginfo"
  - call: extension-service.activate-by-event
    input:
      activation_event: onTerminal:*
      activation_kind: normal
    source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:1084
  - call: terminal-instance-service.create-instance
    input: "= vars.slc"
    as: inst
  - set:
      vars.info: "= merge(vars.inst.value, {'instance_id': state.next_instance_id, 'location': has(input.location) ? input.location : 'panel'})"
  - if: vars.info.location == 'editor'
    then:
    - call: terminal-editor-service.open-instance
      input:
        instance_id: "= vars.info.instance_id"
    else:
    - call: terminal-group-service.create-group
      input:
        instance_id: "= vars.info.instance_id"
  - set:
      state.instances: "= merge(state.instances, {string(state.next_instance_id): vars.info})"
      state.active_instance: "= state.next_instance_id"
      state.next_instance_id: "= state.next_instance_id + 1"
  - title: onDidChangeInstances triggers the debounced layout save once layout listeners are attached
    source: src/vs/workbench/contrib/terminal/browser/terminalService.ts:557-565
    when: state.layout_listeners_attached
    emit: terminal-service.save-state
    after_ms: "= config['terminal-save-state-debounce-ms']"
    input:
      scheduled_at: "= now"
  - return: "= vars.info"
