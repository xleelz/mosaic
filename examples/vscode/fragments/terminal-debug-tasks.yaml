    terminal-instance-service:
      backends:
        local: true
    configuration-manager:
      launch_configurations:
        Launch Program: &id015
          type: node
          request: launch
          name: Launch Program
          program: /work/app/src/main.ts
          preLaunchTask: null
          postDebugTask: null
          stopOnEntry: false
          noDebug: false
      selected: Launch Program
    task-service:
      workspace_tasks:
        build: &id018
          label: build
          type: shell
          command: npm run build
          group: build
          is_background: false
          instance_limit: 1
          run_on: default
          problem_matchers:
          - $tsc
schemas:
- id: TerminalShellLaunchConfig
  summary: IShellLaunchConfig subset the terminal area reads.
  schema:
    type: object
    properties:
      executable:
        type: string
        examples:
        - /bin/bash
      args:
        type: array
        items:
          type: string
        default: []
      cwd:
        type: string
        examples:
        - file:///work/app
      name:
        type: string
        examples:
        - bash
      hide_from_user:
        type: boolean
        default: false
      is_feature_terminal:
        type: boolean
        default: false
      is_transient:
        type: boolean
        default: false
      force_persist:
        type: boolean
        default: false
      attach_persistent_process:
        type:
        - object
        - "null"
        default: null
        properties:
          id:
            type: integer
            examples:
            - 1
          pid:
            type: integer
            examples:
            - 4242
          find_revived_id:
            type: boolean
            default: false
          type:
            type: string
            examples:
            - Task
      reconnection_properties:
        type:
        - object
        - "null"
        default: null
      task_key:
        type:
        - string
        - "null"
        default: null
- id: TerminalInstanceInfo
  summary: A terminal instance as TerminalService tracks it.
  schema:
    type: object
    properties:
      instance_id:
        type: integer
        examples:
        - 1
      persistent_process_id:
        type:
        - integer
        - "null"
      location:
        type: string
        examples:
        - panel
        enum:
        - panel
        - editor
      shell:
        type: string
        examples:
        - /bin/bash
      cwd:
        type: string
        examples:
        - file:///work/app
      process_state:
        type: string
        examples:
        - running
        enum:
        - uninitialized
        - launching
        - running
        - killed-during-launch
        - killed-by-user
        - killed-by-process
      should_persist:
        type: boolean
      hide_from_user:
        type: boolean
      launch_error:
        type:
        - string
        - "null"
- id: DebugLaunchConfig
  summary: An IConfig (launch.json configuration) subset.
  schema:
    type: object
    properties:
      type:
        type: string
        examples:
        - node
      request:
        type: string
        examples:
        - launch
        enum:
        - launch
        - attach
        - bogus
      name:
        type: string
        examples:
        - Launch Program
      program:
        type: string
        examples:
        - /work/app/src/main.ts
      preLaunchTask:
        type:
        - string
        - "null"
        default: null
      postDebugTask:
        type:
        - string
        - "null"
        default: null
      stopOnEntry:
        type: boolean
        default: false
      noDebug:
        type: boolean
        default: false
- id: TasksTask
  summary: A configured task (tasks.json) subset.
  schema:
    type: object
    properties:
      label:
        type: string
        examples:
        - build
      type:
        type: string
        examples:
        - shell
      command:
        type: string
        examples:
        - npm run build
      group:
        type: string
        examples:
        - build
        default: none
      is_background:
        type: boolean
        default: false
      instance_limit:
        type: integer
        examples:
        - 1
        default: 1
      run_on:
        type: string
        examples:
        - default
        default: default
      problem_matchers:
        type: array
        items:
          type: string
        default: []
