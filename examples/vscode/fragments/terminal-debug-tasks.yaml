- component: pty-service
  name: get-terminal-layout-info
  kind: function
  summary: Expand the stored layout to process details, dropping terminals whose pty is gone; non-revived processes go through the orphan question (up to 4 s).
  sources:
  - src/vs/platform/terminal/node/ptyService.ts:587-600
  - src/vs/platform/terminal/node/ptyService.ts:612-642
  - src/vs/platform/terminal/node/ptyService.ts:648-677
  request:
    type: object
    properties:
      workspace_id:
        type: string
        examples:
        - w1-app
  response:
    type: object
    properties:
      tabs:
        type:
        - array
        - "null"
      background:
        type:
        - array
        - "null"
  behavior:
  - if: "!(input.workspace_id in state.layouts)"
    then:
    - return:
        tabs: null
        background: null
  - set:
      vars.layout: "= state.layouts[input.workspace_id]"
  - set:
      vars.ids: "= vars.layout.tabs.map(t, t.map(i, (input.workspace_id + '-' + string(i)) in state.revived ? state.revived[input.workspace_id + '-' + string(i)].new_id : i))"
  - if: vars.ids.exists(t, t.exists(i, string(i) in state.ptys && !state.ptys[string(i)].was_revived))
    then:
    - title: "Orphan question: wait for a window to claim the process (AutoOpenBarrier)"
      source: src/vs/platform/terminal/node/ptyService.ts:1011-1019
      wait: "= config['pty-orphan-question-timeout-ms']"
  - set:
      state.revived: {}
  - return:
      tabs: "= vars.ids.map(t, {'terminals': t.filter(i, string(i) in state.ptys).map(i, {'id': i, 'pid': state.ptys[string(i)].pid, 'is_orphan': true, 'revived': state.ptys[string(i)].was_revived, 'cwd':\
        \ state.ptys[string(i)].cwd, 'type': state.ptys[string(i)].type})}).filter(t, size(t.terminals) > 0)"
      background: "= vars.layout.background.filter(i, string(i) in state.ptys)"
- component: pty-service
