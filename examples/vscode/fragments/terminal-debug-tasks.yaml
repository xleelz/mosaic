- component: debug-service
  name: start-debugging
  kind: function
  summary: Workspace trust, onDebug activation, save before start, resolve the configuration by name, then create the session.
  sources:
  - src/vs/workbench/contrib/debug/browser/debugService.ts:354-451
  request:
    type: object
    properties:
      config:
        type:
        - object
        - "null"
        default: null
      config_name:
        type:
        - string
        - "null"
        default: null
      no_debug:
        type: boolean
        default: false
      started_by_user:
        type: boolean
        default: true
      save_before_start:
        type: boolean
        default: true
      language_id:
        type: string
        examples:
        - typescript
  response:
    type: object
    properties:
      started:
        type: boolean
  errors:
  - code: configuration-missing-in-launch-json
    status: 0
    retryable: false
  behavior:
  - call: workspace-trust-request-service.request-workspace-trust
    input:
      message: Debugging executes build tasks and program code from your workspace.
    as: trust
  - choice: trust
    default: "= vars.trust.value.trusted == true ? 'trusted' : 'denied'"
    options:
      trusted: []
      denied:
      - title: "Trust refused: do not debug"
        source: src/vs/workbench/contrib/debug/browser/debugService.ts:356-359
        return:
          started: false
  - set:
      state.initializing: true
      state.has_debugged: true
  - call: extension-service.activate-by-event
    input:
      activation_event: onDebug
      activation_kind: normal
  - if: input.save_before_start && config['debug-save-before-start'] != 'none'
    then:
    - title: saveAllBeforeDebugStart
      source: src/vs/workbench/contrib/debug/common/debugUtils.ts:377-390
      call: editor-service.save-all
      input:
        reason: explicit
  - set:
      vars.config: "= input.config"
  - if: vars.config == null && input.config_name != null
    then:
    - call: configuration-manager.get-configuration
      input:
        name: "= input.config_name"
      as: named
    - set:
        vars.config: "= vars.named.value.config"
    - if: vars.config == null
      then:
      - set:
          state.initializing: false
      - title: Configuration is missing in 'launch.json'
        source: src/vs/workbench/contrib/debug/browser/debugService.ts:436-440
        fail:
          code: configuration-missing-in-launch-json
          message: "= 'Configuration ' + input.config_name + ' is missing in launch.json.'"
  - call: debug-service.create-session
    input:
      config: "= vars.config"
      no_debug: "= input.no_debug"
      started_by_user: "= input.started_by_user"
      language_id: "= input.language_id"
    as: created
  - set:
      state.initializing: false
  - return:
      started: "= vars.created.value.started"
- component: debug-service
  name: create-session
  kind: function
  summary: Resolve the debugger and configuration, check concurrent sessions, run the preLaunchTask, validate type/request, then create the session.
  sources:
  - src/vs/workbench/contrib/debug/browser/debugService.ts:456-617
  request:
    type: object
    properties:
      config:
        type:
        - object
        - "null"
      no_debug:
        type: boolean
        default: false
      started_by_user:
        type: boolean
        default: true
      language_id:
        type: string
        examples:
        - typescript
  response:
    type: object
    properties:
      started:
        type: boolean
      session_id:
        type: string
  behavior:
  - set:
      vars.config: "= input.config == null ? {} : input.config"
  - if: "!has(vars.config.type)"
    then:
    - call: adapter-manager.guess-debugger
      input:
        language_id: "= input.language_id"
      as: guess
    - if: vars.guess.value.type == null
      then:
      - title: "No debugger guessed: nothing to start"
        source: src/vs/workbench/contrib/debug/browser/debugService.ts:492-500
        return:
          started: false
          session_id: ''
    - set:
        vars.config: "= merge({'request': 'launch', 'name': 'Launch ' + vars.guess.value.type}, merge(vars.config, {'type': vars.guess.value.type}))"
  - set:
      vars.sid: "= 'session-' + string(state.next_session_seq)"
      state.next_session_seq: "= state.next_session_seq + 1"
  - call: configuration-manager.resolve-configuration-by-providers
    input:
      config: "= vars.config"
    as: byp
  - set:
      vars.cfg: "= merge({'preLaunchTask': null, 'postDebugTask': null, 'stopOnEntry': false, 'request': ''}, vars.byp.value.config)"
  - call: debug-model.get-sessions
    as: existing
  - if: input.started_by_user && vars.existing.value.sessions.exists(s, s.name == vars.cfg.name && s.type == vars.cfg.type && s.request == vars.cfg.request)
    then:
    - title: "Already running: confirm another instance"
      source: src/vs/workbench/contrib/debug/browser/debugService.ts:697-702
      choice: concurrent_session
      default: start_another
      options:
        start_another: []
        cancel:
        - return:
            started: false
            session_id: ''
  - call: debug-task-runner.run-task-and-check-errors
    input:
      task: "= vars.cfg.preLaunchTask"
    as: task
  - if: vars.task.value.result == 'failure'
    then:
    - title: "preLaunchTask failed: do not start"
      source: src/vs/workbench/contrib/debug/browser/debugService.ts:545-548
      return:
        started: false
        session_id: ''
  - call: adapter-manager.get-debugger
    input:
      type: "= vars.cfg.type"
    as: dbg
  - if: has(vars.dbg.value.missing) || (vars.cfg.request != 'attach' && vars.cfg.request != 'launch')
    then:
    - title: "Unsupported type or request: show error with \"Install Extension\""
      source: src/vs/workbench/contrib/debug/browser/debugService.ts:559-580
      set:
        ctx.debug_error: "= has(vars.dbg.value.missing) ? 'debug type not supported' : 'request not supported'"
    - return:
        started: false
        session_id: ''
  - if: "!vars.dbg.value.enabled"
    then:
    - set:
        ctx.debug_error: debugger disabled
    - return:
        started: false
        session_id: ''
  - call: debug-service.do-create-session
    input:
      session_id: "= vars.sid"
      config: "= vars.cfg"
      no_debug: "= input.no_debug"
    as: done
  - return:
      started: "= vars.done.value.started"
      session_id: "= vars.sid"
- component: debug-service
  name: do-create-session
  kind: function
  summary: Register the session, then initialize and launch/attach it; adapter errors are shown and the start returns false.
  sources:
  - src/vs/workbench/contrib/debug/browser/debugService.ts:622-695
  - src/vs/workbench/contrib/debug/browser/debugService.ts:704-724
  request:
    type: object
    properties:
      session_id:
        type: string
        examples:
        - session-1
      config:
        type: object
      no_debug:
        type: boolean
        default: false
  response:
    type: object
    properties:
      started:
        type: boolean
  behavior:
  - call: debug-model.add-session
    input:
      session:
        id: "= input.session_id"
        name: "= input.config.name"
        type: "= input.config.type"
        request: "= input.config.request"
        state: initializing
        raw: false
        ready_for_breakpoints: false
        capabilities: {}
        no_debug: "= input.no_debug"
        post_debug_task: "= input.config.postDebugTask"
  - call: debug-session.initialize
    input:
      session_id: "= input.session_id"
      type: "= input.config.type"
    as: init
    on_error: continue
  - if: "!vars.init.ok"
    then:
    - title: "Initialize failed: show the error, return false"
      source: src/vs/workbench/contrib/debug/browser/debugService.ts:664-690
      set:
        ctx.debug_error: "= vars.init.error.message"
    - return:
        started: false
  - call: debug-session.launch-or-attach
    input:
      session_id: "= input.session_id"
      config: "= input.config"
    as: la
    on_error: continue
  - if: "!vars.la.ok"
    then:
    - set:
        ctx.debug_error: "= vars.la.error.message"
    - return:
        started: false
  - call: debug-model.set-focus
    input:
      session_id: "= input.session_id"
  - return:
      started: true
- component: debug-service
  name: on-did-end-adapter
  kind: function
  summary: "A session's adapter ended: an exit event with an error shows \"Debug adapter process has terminated unexpectedly\"; run postDebugTask, end initializing state."
  sources:
  - src/vs/workbench/contrib/debug/browser/debugService.ts:749-800
  request:
    type: object
    properties:
      session_id:
        type: string
        examples:
        - session-1
      error:
        type:
        - string
        - "null"
        default: null
  response:
    type: object
  behavior:
  - if: has(input.error) && input.error != null
    then:
    - title: notificationService.error(debugAdapterCrash)
      source: src/vs/workbench/contrib/debug/browser/debugService.ts:751-753
      call: notification-service.notify
      input:
        severity: error
        message: "= 'Debug adapter process has terminated unexpectedly (' + input.error + ')'"
        source: debug
  - call: debug-model.get-session
    input:
      session_id: "= input.session_id"
    as: s
  - if: has(vars.s.value.post_debug_task) && vars.s.value.post_debug_task != null
    then:
    - title: postDebugTask
      source: src/vs/workbench/contrib/debug/browser/debugService.ts:770-777
      call: debug-task-runner.run-task
      input:
        task: "= vars.s.value.post_debug_task"
      on_error: continue
  - set:
      state.initializing: false
      ctx.debug_session_ended: "= input.session_id"
- component: debug-service
  name: stop-session
  kind: function
  summary: Stop a session (terminate or disconnect), or all sessions when none is given.
  sources:
  - src/vs/workbench/contrib/debug/browser/debugService.ts:961-976
  request:
    type: object
    properties:
      session_id:
        type:
        - string
        - "null"
        default: null
      disconnect:
        type: boolean
        default: false
  response:
    type: object
  behavior:
  - call: debug-model.get-sessions
    as: all
  - set:
      vars.targets: "= input.session_id != null ? [input.session_id] : vars.all.value.sessions.map(s, s.id)"
  - if: size(vars.targets) == 0
