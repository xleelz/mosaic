- component: ext-host-authentication
  name: get-session
  kind: function
  summary: extHostAuthentication.getSession (extension host side; its main-thread RPCs are listed in skips/exthost.json with their targets).
  sources:
  - src/vs/workbench/api/common/extHostAuthentication.ts:100
  request:
    type: object
    required:
    - extension_id
    - provider_id
    - scope_list_or_request
    properties:
      provider_id:
        type: string
        description: 'providerId: string'
      scope_list_or_request:
        type: object
        description: 'scopeListOrRequest: ReadonlyArray<string> | AuthenticationWwwAuthenticateRequest'
      options:
        type: object
        description: 'options: AuthenticationGetSessionOptions & { /** */createIfNone: true | AuthenticationGetSessionPresentationOptions }'
      extension_id:
        type: string
        examples:
        - vscode.git
        description: 'the calling extension (implicit: each extension gets its own vscode namespace)'
  response: ExthostApiResult
  behavior:
  - if: '!(input.provider_id in state.providers)'
    then:
    - title: $ensureProvider(providerId) activates onAuthenticationRequest:<id> when no provider is registered yet
      source: src/vs/workbench/api/common/extHostAuthentication.ts:115
      call: main-thread-authentication.ensure-provider
      'on': = 'w' + self.substring(2)
      input:
        provider_id: = input.provider_id
  - title: $getSession(providerId, scopes, extensionId, extensionName, options)
    source: src/vs/workbench/api/common/extHostAuthentication.ts:116-122
    call: main-thread-authentication.get-session
    'on': = 'w' + self.substring(2)
    input:
      provider_id: = input.provider_id
      scope_list_or_request: = input.scope_list_or_request
      extension_id: = input.extension_id
      options: '= has(input.options) ? input.options : {}'
    as: s
  - return:
      value: = vars.s.value.session
