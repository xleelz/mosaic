flows:
- id: exthost-start
  name: Extension host start at window startup
  description: NativeExtensionService schedules _initialize at LifecyclePhase.Ready; the local process host is spawned, handshakes, receives the registry snapshot ($startExtensionHost) and activates '*'
    then onStartupFinished extensions; the installed-extensions barrier opens and waiting activation requests run.
  tags:
  - writes
  - feature:extension-host-lifecycle
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:466-487
  - src/vs/workbench/api/node/extensionHostProcess.ts:397-475
  entry:
    caller: workbench
    interface: extension-service.initialize
  steps:
  - component: extension-points
    title: 'Extension point handling: ExtensionPoints'
    source: src/vs/workbench/api/browser/extensionHost.contribution.ts:130
  - component: views-extension-handler
    title: 'Extension point handling: ViewsExtensionHandler'
    source: src/vs/workbench/api/browser/viewsExtensionPoint.ts:760
  - component: extension-url-bootstrap-handler
    title: 'Extension point handling: ExtensionUrlBootstrapHandler'
    source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:389
  - component: status-bar-items-extension-point
    title: 'Extension point handling: StatusBarItemsExtensionPoint'
    source: src/vs/workbench/api/browser/statusBarExtensionPoint.ts:250-253
  - component: configuration-extension-point
    title: 'Extension point handling: configuration extension points'
    source: src/vs/workbench/api/common/configurationExtensionPoint.ts:188-194
  - component: json-validation-extension-point
    title: 'Extension point handling: JSONValidationExtensionPoint'
    source: src/vs/workbench/api/common/jsonValidationExtensionPoint.ts:26-51
- id: exthost-activate-by-event
  name: Activate extensions by event (seam extension-service.activate-by-event)
  tags:
  - writes
  - feature:extension-host-lifecycle
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:993-1053
  entry:
    caller: workbench
    interface: extension-service.activate-by-event
    input:
      activation_event: onLanguage:typescript
      activation_kind: normal
- id: exthost-get-extension
  name: Read an extension's registration and activation status
  sources:
