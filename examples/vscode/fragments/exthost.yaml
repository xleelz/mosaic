  name: on-did-change-responsive-change
  kind: function
  summary: '_onDidChangeResponsiveChange: for the local process host with an inspect port, start a CPU profile when it turns unresponsive (stopped after 5 s or when it is responsive again); a responsive event cancels the running session.'
