interfaces:
- component: extension-registry
  name: contains-activation-event
  kind: function
  summary: 'containsActivationEvent / getExtensionDescriptionsForActivationEvent: which enabled extensions declare this activation event, plus the full id->description map (the host''s mirror).'
  sources:
  - src/vs/workbench/services/extensions/common/extensionDescriptionRegistry.ts:205-216
  request:
    type: object
    required:
    - activation_event
    properties:
      activation_event:
        type: string
        examples:
        - onLanguage:typescript
  response:
    type: object
    properties:
      contains:
        type: boolean
      extensions:
        type: array
        items:
          $ref: ExthostExtensionDescription
      registry:
        type: object
  behavior:
  - set:
      vars.registry: '= state.extensions.transformMap(k, v, !(''enabled'' in v) || v.enabled, {''identifier'': k, ''activation_events'': ''activation_events'' in v ? v.activation_events : [], ''main'':
        ''main'' in v ? v.main : '''', ''extension_dependencies'': ''extension_dependencies'' in v ? v.extension_dependencies : []})'
  - set:
      vars.matching: = vars.registry.filter(k, input.activation_event in vars.registry[k].activation_events).map(k, vars.registry[k])
  - return:
      contains: = size(vars.matching) > 0
      extensions: = vars.matching
      registry: = vars.registry
- component: extension-registry
  name: snapshot
  kind: function
  summary: 'getSnapshot: every registered (enabled) extension description, sent as init data or with $startExtensionHost.'
  sources:
  - src/vs/workbench/services/extensions/common/extensionDescriptionRegistry.ts:222-227
  response:
    type: object
    properties:
      extensions:
        type: array
        items:
          $ref: ExthostExtensionDescription
      registry:
        type: object
      activated:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.registry: '= state.extensions.transformMap(k, v, !(''enabled'' in v) || v.enabled, {''identifier'': k, ''activation_events'': ''activation_events'' in v ? v.activation_events : [], ''main'':
        ''main'' in v ? v.main : '''', ''extension_dependencies'': ''extension_dependencies'' in v ? v.extension_dependencies : [], ''capabilities'': ''capabilities'' in v ? v.capabilities : {}})'
  - return:
      extensions: = vars.registry.map(k, vars.registry[k])
      registry: = vars.registry
      activated: = state.activated
- component: extension-registry
  name: get-extension-description
  kind: function
  summary: 'getExtensionDescription(id): the registered description, or none.'
  sources:
  - src/vs/workbench/services/extensions/common/extensionDescriptionRegistry.ts:229-232
  request:
    type: object
    required:
    - extension_id
    properties:
      extension_id:
        type: string
        examples:
        - vscode.typescript-language-features
  response:
    type: object
    properties:
      found:
        type: boolean
      extension:
        $ref: ExthostExtensionDescription
      activated:
        type: boolean
  behavior:
  - if: '!(input.extension_id in state.extensions)'
    then:
    - return:
        found: false
        activated: false
  - return:
      found: true
      activated: = input.extension_id in state.activated
      extension:
        identifier: = input.extension_id
        activation_events: '= ''activation_events'' in state.extensions[input.extension_id] ? state.extensions[input.extension_id].activation_events : []'
        main: '= ''main'' in state.extensions[input.extension_id] ? state.extensions[input.extension_id].main : '''''
- component: extension-registry
  name: delta-extensions
  kind: function
  summary: 'deltaExtensions(lock, toAdd, toRemove): applies the change and bumps the version id.'
  sources:
  - src/vs/workbench/services/extensions/common/extensionDescriptionRegistry.ts:103-119
  request:
    type: object
    properties:
      to_add:
        type: array
        items:
          $ref: ExthostExtensionDescription
        default: []
      to_remove:
        type: array
        items:
          type: string
        default: []
  response:
    type: object
    properties:
      added:
        type: array
        items:
          type: string
      removed:
        type: array
        items:
          type: string
  behavior:
  - set:
      state.extensions: = state.extensions.transformMap(k, v, !(k in input.to_remove), v)
  - foreach: = input.to_add
    as: e
    steps:
    - set:
        state.extensions: '= merge(state.extensions, {vars.e.identifier: {''activation_events'': vars.e.activation_events, ''main'': ''main'' in vars.e ? vars.e.main : '''', ''extension_dependencies'':
          ''extension_dependencies'' in vars.e ? vars.e.extension_dependencies : [], ''enabled'': true}})'
  - return:
      added: = input.to_add.map(e, e.identifier)
      removed: = input.to_remove
- component: extension-registry
  name: mark-activation-started
  kind: function
  summary: 'ExtensionStatus.onWillActivate: the extension''s activation has started (activationStarted = true).'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1540-1542
  request:
    type: object
    required:
    - extension_id
    properties:
      extension_id:
        type: string
        examples:
        - vscode.typescript-language-features
  behavior:
  - set:
      state.activated: '= input.extension_id in state.activated ? state.activated : state.activated + [input.extension_id]'
  - return:
      activated: = state.activated
- component: extension-registry
  name: clear-activated
  kind: function
  summary: ExtensionStatus.clearRuntimeStatus for every extension when the hosts stop; returns the ids that had started activating.
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:748-762
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1522-1526
  response:
    type: object
    properties:
      previously_activated:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.prev: = state.activated
  - set:
      state.activated: []
  - return:
      previously_activated: = vars.prev
- component: extension-service
  name: activate-by-event
  kind: function
  summary: 'Seam (owner exthost, callers all). IExtensionService.activateByEvent: records the event, returns at once when no extension wants it, otherwise forwards to every extension host manager. Never
    rejects for an extension that fails to activate.'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:993-1025
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1027-1053
  request: ExthostActivateByEventRequest
  response: ExthostActivationResult
  errors:
  - code: canceled
    status: 0
    retryable: false
    summary: the extension host went down while the activation RPC was pending (RPCProtocol.dispose rejects pending replies)
  behavior:
  - title: activationKind defaults to ActivationKind.Normal
    source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:993
    set:
      vars.kind: '= has(input.activation_kind) ? input.activation_kind : ''normal'''
  - title: Record the requested event, so a restarted host replays it
    source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:998
    set:
      state.requested_events: '= input.activation_event in state.requested_events ? state.requested_events : state.requested_events + [input.activation_event]'
  - if: '!state.ready && vars.kind != ''immediate'''
    then:
    - title: Extensions not scanned yet; the call waits on the installed-extensions barrier and runs after startup
      source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1023
      return:
        activated: []
        deferred: true
  - call: extension-registry.contains-activation-event
    input:
      activation_event: = input.activation_event
    as: reg
  - if: state.ready && !vars.reg.value.contains
    then:
    - title: No extension is interested in this activation event
      source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1000-1003
      return:
        activated: []
        deferred: false
  - if: state.host_state != 'running'
    then:
    - title: No extension host manager is registered (hosts stopped), Promise.all([]) resolves at once
      source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1044-1046
      return:
        activated: []
        deferred: false
  - title: onWillActivateByEvent fires with the pending activation promise
    source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1047-1051
    publish: extension-service.on-will-activate-by-event
    input:
      activation_event: = input.activation_event
      activation_kind: = vars.kind
    delivery: sync
  - call: extension-host-manager.activate-by-event
    input:
      activation_event: = input.activation_event
      activation_kind: = vars.kind
    as: act
  - return:
      activated: = vars.act.value.activated
      deferred: false
      cached: = vars.act.value.cached
- component: extension-service
  name: on-will-activate-by-event
  kind: event
  summary: 'onWillActivateByEvent: {event, activation, activationKind}, fired synchronously by _activateByEvent.'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:77-78
  request: ExthostActivateByEventRequest
- component: extension-service
  name: on-did-change-extensions-status
  kind: event
  summary: 'onDidChangeExtensionsStatus(ids): activation started/finished or runtime status cleared.'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:71-72
  request:
    type: object
    properties:
      extension_ids:
