    status: 0
    retryable: true
    summary: the condition this handler reacts to; activations in flight are canceled
  behavior:
  - title: Local process host terminated unexpectedly; stop every extension host
    source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:888-890
