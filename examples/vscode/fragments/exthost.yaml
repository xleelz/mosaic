- id: exthost-unresponsive-idle-profile
  flow: exthost-unresponsive
  name: An unresponsive period whose profile blames no extension ends the session without a prompt
  fixtures:
  - one-window-folder
  - exthost-seed
  faults:
  - target: ext-host-rpc-protocol.receive-request
    type: latency
    latency_ms: 6000
  expect:
  - result.ok
  - calls['extensions-auto-profiler.stop-and-analyse'] >= 1 && calls['notification-service.prompt'] == 0
  - state['extensions-auto-profiler@w1'].session == ''
- id: exthost-text-search-folder-encodings
  flow: exthost-api-call
  name: The ripgrep provider runs through the text search manager with each folder's encoding, and an unknown scheme has no provider
  fixtures:
  - full-window
  steps:
  - interface: ext-host-search.provide-text-search-results
    caller: extension-host-manager
    'on': eh1
    as: s
    input:
      scheme: file
      query:
        pattern: add
        folders:
        - file:///work/app
        max_results: 20000
      folder_encodings:
        file:///work/app: windows1252
  - interface: ext-host-search.provide-text-search-results
    caller: extension-host-manager
    'on': eh1
    as: other
    input:
      scheme: vscode-vfs
      query:
        pattern: add
  expect:
  - steps.s.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'text-search-manager.search' && e.input.query.folder_queries[0].file_encoding == 'windows1252')
  - '!steps.other.result.ok && steps.other.result.error.code == ''unknown-provider'''
- id: exthost-chat-invoke-agent-streams
  flow: exthost-api-call
  name: $invokeAgent streams the participant's markdown parts back and returns its metadata
  fixtures:
  - full-window
  steps:
  - interface: ext-host-chat-agents2.invoke-agent
    caller: extension-host-manager
    'on': eh1
    as: ok
    input:
      agent_id: github.copilot.default
      message: hi
  expect:
  - steps.ok.result.ok && size(steps.ok.result.value.items) == 2
  - steps.ok.result.value.items[0].content == 'Answer to hi'
  - calls['language-models-service.send-chat-request'] == 1
- id: exthost-chat-invoke-agent-throws
  flow: exthost-api-call
  name: A throwing participant handler becomes errorDetails, not a failed RPC
  fixtures:
  - one-window-folder
  - exthost-seed
  choices:
    third-party-extension.handle-chat-request.outcome: throws
  steps:
  - interface: ext-host-chat-agents2.invoke-agent
    caller: extension-host-manager
    'on': eh1
    as: bad
    input:
      agent_id: github.copilot.default
      message: hi
  expect:
  - steps.bad.result.ok
  - has(steps.bad.result.value.error_details) || has(steps.bad.result.value.value.error_details)
- id: exthost-da-session-starts-adapter
  flow: exthost-api-call
  name: $startDASession creates and starts the adapter; $stopDASession stops it
  fixtures:
  - one-window-folder
  - exthost-seed
  steps:
  - interface: ext-host-debug-service.start-da-session
    caller: extension-host-manager
    'on': eh1
    as: start
    input:
      handle: 1
      session_id: s1
      type: node
  - interface: ext-host-debug-service.stop-da-session
    caller: extension-host-manager
    'on': eh1
    as: stop
    input:
      handle: 1
  - interface: ext-host-debug-service.start-da-session
    caller: extension-host-manager
    'on': eh1
    as: notype
    input:
      handle: 2
      session_id: s2
      type: ''
  expect:
  - steps.start.result.ok && calls['debug-adapter.start-session'] == 1
  - steps.stop.result.ok && calls['debug-adapter.stop-session'] == 1
  - '!steps.notype.result.ok && steps.notype.result.error.code == ''no-debug-adapter-descriptor'''
  - size(state['ext-host-debug-service@eh1'].adapters) == 0
- id: exthost-remote-window-starts-remote-host
  flow: exthost-start
  name: A remote window starts a RemoteExtensionHost through the ExtensionHost connection and runs the workspace extensions there
  fixtures:
  - remote-folder
  - remote-server-srv1
  - exthost-seed
  state:
    ext-host-extension-service@eh1:
      eager_activated: false
      ready_to_run: false
      started: false
    extension-host-manager@w1:
      has_started: false
    extension-service@w1:
      host_state: stopped
      ready: false
  expect:
  - result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'remote-extension-host-agent-server.handle-web-socket-connection' && e.input.desired_connection_type == 'extension-host')
  - '''vscode.git'' in state[''remote-extension-host@w1''].extensions'
  - calls['third-party-extension.activate'] == 0
- id: exthost-install-adds-extension-to-running-host
  flow: rs-ext-install
  name: An installed extension reaches the running host through onDidInstallExtensions and deltaExtensions, without a reload
  fixtures:
  - full-window
  - remote-server-marketplace
  input:
    arg: ms-python.python
  expect:
  - result.ok
  - calls['extension-service.handle-delta-extensions'] == 1
  - '''ms-python.python'' in state[''extension-registry@w1''].extensions'
- id: exthost-auth-get-session-reaches-provider
  flow: exthost-api-call
  name: authentication.getSession goes to the window, which asks the registered provider in the host for its sessions
  fixtures:
  - one-window-folder
  - exthost-seed
  choices:
    third-party-extension.get-authentication-sessions.stored: one
  steps:
  - interface: vscode-api.authentication-register-authentication-provider
    caller: third-party-extension
    'on': eh1
    as: reg
    input:
      id: github
      label: GitHub
      provider: {}
      extension_id: vscode.github-authentication
  - interface: vscode-api.authentication-get-session
    caller: third-party-extension
    'on': eh1
    as: get
    input:
      provider_id: github
      scope_list_or_request:
      - repo
      extension_id: vscode.git
  - interface: vscode-api.authentication-get-session
    caller: third-party-extension
    'on': eh1
    as: unknown
    input:
      provider_id: microsoft
      scope_list_or_request: []
      extension_id: vscode.git
  expect:
  - steps.get.result.ok && steps.get.result.value.value.id == 'session-1'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'third-party-extension.get-authentication-sessions' && e.input.provider_id == 'github')
  - state['ext-host-authentication@eh1'].providers['github'].extension_id == 'vscode.github-authentication'
  - calls_by_instance['main-thread-authentication.get-session@w1'] == 2 && calls['third-party-extension.get-authentication-sessions'] == 1
  - '!steps.unknown.result.ok && steps.unknown.result.error.code == ''no-provider'''
- id: exthost-api-command-vscode-open-validates
  flow: exthost-api-call
  name: vscode.open rejects a non-URI argument in the host and sends a URI on to _workbench.open
  fixtures:
  - one-window-folder
  - exthost-seed
  steps:
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    'on': eh1
    as: bad
    input:
      command: vscode.open
      extension_id: vscode.git
      rest:
      - 42
  - interface: vscode-api.commands-execute-command
    caller: third-party-extension
    'on': eh1
    as: good
    input:
      command: vscode.open
      extension_id: vscode.git
      rest:
      - file:///work/app/README.md
  expect:
  - '!steps.bad.result.ok && steps.bad.result.error.code == ''invalid-argument'''
  - trace.exists(e, e.type == 'call.start' && e.interface == 'main-thread-commands.execute-command' && e.input.command_id == '_workbench.open')
