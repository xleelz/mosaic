- component: extensions-auto-profiler
  name: stop-and-analyse
  kind: function
  summary: 'Stop the profile and _processCpuProfile: blame the extension that took the most time, write the .cpuprofile, send exthostunresponsive telemetry and mark it in Running Extensions; when it took >= 95% and >= 5 s, show a SILENT warning prompt, once per extension and at most 3 times.'
  sources:
  - src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:120-130
  - src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:133-245
  request:
    type: object
    required:
    - session
    properties:
      session:
        type: string
  response:
    type: object
    properties:
      blamed:
        type: string
  behavior:
  - if: '!(''session'' in state) || state.session != input.session'
    then:
    - title: this session was already stopped (responsive again) or replaced
      return:
        blamed: ''
  - set:
      state.session: ''
  - title: analyseByLocation over the extensions' locations; the profile's content is the extensions' own behavior, so the scenario chooses it
    source: src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:159-175
    choice: profile
    default: idle
    options:
      idle:
      - title: the top category is not an extension (idle, gc, self)
        source: src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:177-182
        return:
          blamed: ''
      slow:
      - set:
          vars.top: vscode.typescript-language-features
          vars.top_percentage: 60
          vars.top_ms: 3000
      greedy:
      - set:
          vars.top: vscode.typescript-language-features
          vars.top_percentage: 97
          vars.top_ms: 6000
  - call: extension-service.get-extension
    input:
      extension_id: = vars.top
    as: ext
  - if: '!vars.ext.value.found'
    then:
    - return:
        blamed: ''
  - title: save the .cpuprofile in tmpDir, log the warning, send exthostunresponsive telemetry and setUnresponsiveProfile (Running Extensions)
    source: src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:187-216
    set:
      state.unresponsive_profiles: '= merge(''unresponsive_profiles'' in state ? state.unresponsive_profiles : {}, {vars.top: {''percentage'': vars.top_percentage, ''ms'': vars.top_ms}})'
  - if: '!(vars.top_percentage >= 95 && vars.top_ms >= 5000)'
    then:
    - title: 'prompt: only when really slow/greedy'
      source: src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:218-221
      return:
        blamed: = vars.top
  - set:
      vars.blamed: '= ''blamed'' in state ? state.blamed : []'
  - if: vars.top in vars.blamed || size(vars.blamed) >= 3
    then:
    - title: only blame once per extension, don't blame too often
      source: src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:229-233
      return:
        blamed: = vars.top
  - set:
      state.blamed: = vars.blamed + [vars.top]
  - title: SILENT warning prompt with Show Extensions and the report action (no restart offer)
    source: src/vs/workbench/contrib/extensions/electron-browser/extensionsAutoProfiler.ts:235-245
    call: notification-service.prompt
    input:
      severity: warning
      message: = "The extension '" + vars.top + "' took a very long time to complete its last operation and it has prevented other extensions from running."
      choices:
      - Show Extensions
      - Report Issue
  - return:
      blamed: = vars.top
