- component: ext-host-extension-service
  name: activate-extension
  kind: function
  summary: '_activateExtension: tell the renderer activation starts ($onWillActivateExtension, awaited on a local host), load the entry point and call activate(context); report $onDidActivateExtension or
    rethrow.'
  sources:
  - src/vs/workbench/api/common/extHostExtensionService.ts:421-437
  - src/vs/workbench/api/common/extHostExtensionService.ts:467-497
  request:
    type: object
    properties:
      extension:
        $ref: ExthostExtensionDescription
      reason:
        $ref: ExthostActivationReason
  response:
    type: object
    properties:
      status:
        type: string
      empty:
        type: boolean
  errors:
  - code: activation-error
    status: 0
    retryable: false
    summary: the extension's activate() threw or its returned promise rejected
  behavior:
  - call: main-thread-extension-service.on-will-activate-extension
    'on': = 'w' + self.substring(2)
    input:
      extension_id: = input.extension.identifier
  - if: '!(''main'' in input.extension) || input.extension.main == '''''
    then:
    - title: No entry point; treated as an empty extension (not an error)
      source: src/vs/workbench/api/common/extHostExtensionService.ts:474-478
      call: main-thread-extension-service.on-did-activate-extension
      'on': = 'w' + self.substring(2)
      input:
        extension_id: = input.extension.identifier
        activation_event: = input.reason.activation_event
    - return:
        status: activated
        empty: true
  - title: Load the module and the ExtensionContext, then call activate(context)
    source: src/vs/workbench/api/common/extHostExtensionService.ts:486-494
    call: third-party-extension.activate
    input:
      extension_id: = input.extension.identifier
    as: mod
  - call: main-thread-extension-service.on-did-activate-extension
    'on': = 'w' + self.substring(2)
    input:
      extension_id: = input.extension.identifier
      activation_event: = input.reason.activation_event
  - return:
      status: activated
      empty: false
