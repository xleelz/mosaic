- component: ext-host-editor-tabs
  name: accept-editor-tab-model
  kind: rpc
  attributes:
    shape: ExtHostEditorTabsShape
  summary: '$acceptEditorTabModel(tabGroups): replace the tab groups (reusing groups that still exist), set the active group and fire onDidChangeTabGroups with opened, closed and changed groups.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:1018
  - src/vs/workbench/api/common/extHostEditorTabs.ts:309-348
  request:
    type: object
    properties:
      tab_groups:
        type: array
        items:
          type: object
        default: []
  response:
    type: object
    properties:
      groups:
        type: integer
  behavior:
  - set:
      vars.before: = state.groups.map(k, k)
      vars.after: = input.tab_groups.map(g, string(g.group_id))
  - set:
      state.groups: {}
  - foreach: = input.tab_groups
    as: g
    steps:
    - set:
        state.groups: = merge(state.groups, {string(vars.g.group_id):vars.g.tabs.map(t, t.id)})
  - if: input.tab_groups.exists(g, g.is_active)
    then:
    - title: set the active tab group id
      source: src/vs/workbench/api/common/extHostEditorTabs.ts:342-346
      set:
        state.active_group: = input.tab_groups.filter(g, g.is_active)[0].group_id
  - publish: ext-host-editor-tabs.on-did-change-tab-groups
    input:
      opened: = vars.after.filter(k, !(k in vars.before))
      closed: = vars.before.filter(k, !(k in vars.after))
      changed: = vars.after.filter(k, k in vars.before)
    delivery: sync
  - return:
      groups: = size(input.tab_groups)
- component: ext-host-editor-tabs
  name: accept-tab-operation
  kind: rpc
  attributes:
    shape: ExtHostEditorTabsShape
  summary: '$acceptTabOperation(operation): apply one open, close or update to its group (which must exist) and fire onDidChangeTabs.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:1022
  - src/vs/workbench/api/common/extHostEditorTabs.ts:362-400
  - src/vs/workbench/api/common/extHostEditorTabs.ts:195-240
  request:
    type: object
    required:
    - group_id
    - kind
    properties:
      group_id:
        type: integer
      index:
        type: integer
        default: 0
      kind:
        type: string
        enum:
        - tab-open
        - tab-close
        - tab-update
        - tab-move
      tab:
        type: object
  response:
    type: object
    properties:
      tab_id:
        type: string
  errors:
  - code: invalid-tab-operation
    status: 0
    retryable: false
  behavior:
  - set:
      vars.gid: = string(input.group_id)
  - if: '!(vars.gid in state.groups)'
    then:
    - title: Update Tabs IPC call received before group creation
      source: src/vs/workbench/api/common/extHostEditorTabs.ts:364-366
      fail:
        code: invalid-tab-operation
        message: Update Tabs IPC call received before group creation.
  - if: input.kind == 'tab-open'
    then:
    - set:
        "= 'state.groups.' + vars.gid": = state.groups[vars.gid] + [input.tab.id]
    - publish: ext-host-editor-tabs.on-did-change-tabs
      input:
        opened:
        - = input.tab.id
        closed: []
        changed: []
      delivery: sync
    - return:
        tab_id: = input.tab.id
  - if: input.kind == 'tab-close'
    then:
    - if: input.index >= size(state.groups[vars.gid])
      then:
      - title: Tab close update received for an index which does not exist
        source: src/vs/workbench/api/common/extHostEditorTabs.ts:205-208
        fail:
          code: invalid-tab-operation
          message: = 'Tab close updated received for index ' + string(input.index) + ' which does not exist'
    - set:
        vars.closed: = state.groups[vars.gid][input.index]
    - set:
        "= 'state.groups.' + vars.gid": = state.groups[vars.gid].filter(t, t != vars.closed)
    - publish: ext-host-editor-tabs.on-did-change-tabs
      input:
        opened: []
        closed:
        - = vars.closed
        changed: []
      delivery: sync
    - return:
        tab_id: = vars.closed
  - if: '!(input.tab.id in state.groups[vars.gid])'
    then:
    - title: INVALID tab
      source: src/vs/workbench/api/common/extHostEditorTabs.ts:226-229
      fail:
        code: invalid-tab-operation
        message: INVALID tab
  - publish: ext-host-editor-tabs.on-did-change-tabs
    input:
      opened: []
      closed: []
      changed:
      - = input.tab.id
    delivery: sync
  - return:
      tab_id: = input.tab.id
