  - title: Log the crash with the extensions that were running, send extensionHostCrash telemetry, record it
    source: src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:182-185
    call: extension-host-crash-tracker.register-crash
  - call: extension-host-crash-tracker.should-automatically-restart
    as: auto
  - if: vars.auto.value.restart
    then:
    - title: Fewer than 3 crashes in 5 minutes; show a status message and restart
      source: src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:187-190
      call: notification-service.status
      input:
        message: The extension host terminated unexpectedly. Restarting...
        hide_after_ms: = config['exthost-auto-restart-status-hide-ms']
    - call: extension-service.start-extension-hosts
