- component: vscode-api
  name: commands-execute-command
  kind: function
  summary: vscode.commands.executeCommand(command, ...rest) -> ExtHostCommands.executeCommand.
  response:
    type: object
    properties:
      value: {}
  errors:
  - code: command-not-found
    status: 0
    retryable: false
  - code: invalid-argument
    status: 0
    retryable: false
  behavior:
  - call: ext-host-commands.execute-command
    input:
      command_id: = input.command
      args: '= has(input.rest) ? input.rest : []'
      retry: true
    as: r
  - return: = vars.r.value
  sources:
  - src/vscode-dts/vscode.d.ts:11023
  - src/vs/workbench/api/common/extHost.api.impl.ts:416-418
  request:
    type: object
    required:
    - command
    - extension_id
    properties:
      command:
        type: string
        description: 'command: string'
      rest:
        type: array
        description: 'rest: any[]'
      extension_id:
        type: string
        examples:
        - vscode.git
        description: 'the calling extension (implicit: each extension gets its own vscode namespace)'
- component: vscode-api
  name: commands-register-command
  kind: function
