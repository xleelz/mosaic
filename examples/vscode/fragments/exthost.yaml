    re-runs it once without retry.'
  sources:
  - src/vs/workbench/api/common/extHostCommands.ts:173-229
  request:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
        - workbench.action.files.save
      args:
        type: array
        default: []
      retry:
        type: boolean
        default: true
  response:
    type: object
    properties:
      value: {}
  behavior:
  - if: input.command_id in state.api_commands
    then:
    - title: An API command is registered in this host (registerCommand(false, ...)); emit onCommand activation (not awaited) and run its handler here
      source: src/vs/workbench/api/common/extHostCommands.ts:180-186
      emit: main-thread-commands.fire-command-activation-event
      'on': = 'w' + self.substring(2)
      input:
        command_id: = input.command_id
    - call: ext-host-commands.run-api-command
      input:
        command_id: = input.command_id
        args: = input.args
      as: api
    - return:
        value: = vars.api.value.value
  - if: input.command_id in state.commands
    then:
    - title: Registered in this extension host; emit onCommand activation (not awaited) and run the callback here
      source: src/vs/workbench/api/common/extHostCommands.ts:180-186
      emit: main-thread-commands.fire-command-activation-event
      'on': = 'w' + self.substring(2)
      input:
        command_id: = input.command_id
    - call: third-party-extension.run-command
      input:
        command_id: = input.command_id
        args: = input.args
      as: local
    - return:
        value: = vars.local.value.value
  - call: main-thread-commands.execute-command
    'on': = 'w' + self.substring(2)
    input:
      command_id: = input.command_id
      args: = input.args
      retry: '= has(input.retry) ? input.retry : true'
    as: remote
    on_error:
    - if: error.code == 'execute-command-retry'
      then:
      - title: The command was unknown but may now be registered in this host; run again without retry
        source: src/vs/workbench/api/common/extHostCommands.ts:218-224
        call: ext-host-commands.execute-command
        input:
          command_id: = input.command_id
          args: = input.args
          retry: false
        as: again
      - return: = vars.again.value
    - fail: = error
  - return:
      value: = vars.remote.value.value
