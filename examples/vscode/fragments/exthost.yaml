- component: main-thread-language-features
  name: set-language-configuration
  kind: rpc
  attributes:
    shape: MainThreadLanguageFeaturesShape
  summary: '$setLanguageConfiguration(handle, selector, ...): register a proxy provider with ILanguageFeaturesService that calls back into the host.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:598
  - src/vs/workbench/api/browser/mainThreadLanguageFeatures.ts:979
  request:
    type: object
    required:
    - handle
    - selector
    properties:
      handle:
        type: integer
        examples:
        - 1
      configuration:
        type: object
        description: ILanguageConfigurationDto
      selector:
        type: string
        examples:
        - typescript
      extension_id:
        type: string
        examples:
        - vscode.git
  response:
    type: object
    properties:
      registered:
        type: boolean
  behavior:
  - title: Revive the configuration DTO (comments, brackets, word pattern, rules)
    source: src/vs/workbench/api/browser/mainThreadLanguageFeatures.ts:981-1007
    set:
      vars.config: '= has(input.configuration) ? input.configuration : {}'
  - title: Only a registered language id gets the configuration (isRegisteredLanguageId); the model has no language registry, so the selector is taken as registered
    source: src/vs/workbench/api/browser/mainThreadLanguageFeatures.ts:1009-1011
    call: language-configuration-service.register
    input:
      language_id: = input.selector
      line_comment: '= ''comments'' in vars.config && ''line_comment'' in vars.config.comments ? vars.config.comments.line_comment : '''''
  - return:
      registered: true
