- component: ext-host-search
  name: provide-text-search-results
  kind: rpc
  attributes:
    shape: ExtHostSearchShape
  summary: '$provideTextSearchResults(handle, session, query): the file scheme''s provider is the host''s RipgrepSearchProvider, run by NativeTextSearchManager; each file match goes back through progress ($handleTextMatch, a yield here) and the call resolves with {limitHit, stats} only. folder_encodings carries each folder query''s fileEncoding.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:2705
  - src/vs/workbench/api/common/extHostSearch.ts:170-179
  - src/vs/workbench/api/node/extHostSearch.ts:93-101
  - src/vs/workbench/api/node/extHostSearch.ts:165-167
  request:
    type: object
    properties:
      scheme:
        type: string
        default: file
      query:
        type: object
        properties:
          pattern:
            type: string
            examples:
            - add
          folders:
            type: array
            items:
              type: string
            default:
            - file:///work/app
          max_results:
            type: integer
            default: 20000
      folder_encodings:
        type: object
        default: {}
        description: folder URI -> the folder query's fileEncoding (files.encoding for that folder)
  response:
    type: object
    properties:
      limit_hit:
        type: boolean
      stats:
        type: object
  errors:
  - code: unknown-provider
    status: 0
    retryable: false
  behavior:
  - if: input.scheme != 'file'
    then:
    - title: Unknown Text Search Provider (only the ripgrep provider for file is registered, by $enableExtensionHostSearch)
      source: src/vs/workbench/api/common/extHostSearch.ts:172-174
      fail:
        code: unknown-provider
        message: = 'Unknown Text Search Provider for ' + input.scheme
  - set:
      vars.enc: '= has(input.folder_encodings) ? input.folder_encodings : {}'
      vars.folders: '= has(input.query.folders) ? input.query.folders : []'
  - title: reviveQuery; each folder query carries its fileEncoding
    source: src/vs/workbench/api/common/extHostSearch.ts:176
    set:
      vars.query: '= merge(input.query, {''folder_queries'': vars.folders.map(f, f in vars.enc ? {''folder'': f, ''file_encoding'': vars.enc[f]} : {''folder'': f})})'
  - title: createTextSearchManager(query, provider).search(progress => $handleTextMatch(handle, session, progress), token)
    source: src/vs/workbench/api/common/extHostSearch.ts:177-178
    call: text-search-manager.search
    input:
      query: = vars.query
      token_name: ''
    stream: true
    as: engine
    on_item:
    - title: $handleTextMatch(handle, session, [fileMatch])
      source: src/vs/workbench/api/common/extHostSearch.ts:178
      yield: = vars.item
  - return:
      limit_hit: = vars.engine.value.limit_hit
      stats: '= has(vars.engine.value.stats) ? vars.engine.value.stats : {}'
- component: ext-host-chat-agents2
  name: invoke-agent
  kind: rpc
  attributes:
    shape: ExtHostChatAgentsShape2
  summary: '$invokeAgent(handle, request, context): run the participant''s handler with a ChatAgentResponseStream; every stream part goes back as $handleProgressChunk (a yield here); the result carries errorDetails or metadata, and a thrown error becomes errorDetails.'
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:1765
  - src/vs/workbench/api/common/extHostChatAgents2.ts:975-1080
  request:
    type: object
    properties:
      agent_id:
        type: string
        examples:
        - github.copilot.default
      session_resource:
        type: string
      request_id:
        type: string
      message:
        type: string
  response:
    type: object
    properties:
      metadata:
        type: object
      error_details:
        type: object
  behavior:
  - title: agent.invoke(request, context, stream.apiObject, token)
    source: src/vs/workbench/api/common/extHostChatAgents2.ts:1001-1040
    call: third-party-extension.handle-chat-request
    input:
      agent_id: '= has(input.agent_id) ? input.agent_id : '''''
      message: '= has(input.message) ? input.message : '''''
    stream: true
    as: handler
    on_item:
    - title: stream.markdown(...) -> $handleProgressChunk(requestId, chunks)
      source: src/vs/workbench/api/common/extHostChatAgents2.ts:105
      yield:
        kind: markdownContent
        content: = vars.item
    on_error:
    - title: the handler threw; the error is logged and returned as errorDetails
      source: src/vs/workbench/api/common/extHostChatAgents2.ts:1066-1080
      return:
        error_details:
          message: = error.message
  - title: 'result: errorDetails (responseIsIncomplete), metadata, nextQuestion'
    source: src/vs/workbench/api/common/extHostChatAgents2.ts:1041-1064
    return:
      metadata: '= has(vars.handler.value.metadata) ? vars.handler.value.metadata : {}'
- component: third-party-extension
  name: handle-chat-request
  kind: function
  latency_ms:
    min: 200
    max: 2000
  summary: A chat participant's request handler (vscode.chat.createChatParticipant); it streams markdown parts and returns a result. Its content is the extension's own, so scenarios choose the outcome.
  sources:
  - src/vs/workbench/api/common/extHostChatAgents2.ts:1030-1040
  request:
    type: object
    properties:
      agent_id:
        type: string
      message:
        type: string
  response:
    type: object
    properties:
      metadata:
        type: object
  behavior:
  - choice: outcome
    default: answers
    options:
      answers:
      - title: a participant such as Copilot asks a language model (vscode.lm) for the answer
        source: src/vs/workbench/api/common/extHostLanguageModels.ts:525
        call: ext-host-language-models.send-chat-request
        input:
          model_id: copilot/gpt-4.1
          extension_id: = input.agent_id
          messages:
          - role: user
            content: = input.message
      - yield: = 'Answer to ' + input.message
      - yield: Done.
      - return:
          metadata: {}
      throws:
      - fail:
          code: participant-error
          message: the participant handler threw
