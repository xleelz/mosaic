  summary: 'RemoteExtensionHost.start: resolve the remote authority, then connectRemoteAgentExtensionHost (auth, sign, connectionType ExtensionHost with the start params) so the server forks the remote extension host; it then receives the init data with the extensions whose running location is the remote host.'
