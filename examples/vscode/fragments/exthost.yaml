          reason: prompt-shown
- component: extension-service
  name: handle-delta-extensions
  kind: function
  summary: '_handleDeltaExtensions/_deltaExtensions: on install, uninstall, enable or disable, update the registry (skipping unknown, already-known and activated extensions), push the delta to the hosts
    and activate added extensions whose events already fired.'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:244-267
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:269-343
  request:
    type: object
    properties:
      to_add:
        type: array
        items:
          $ref: ExthostExtensionDescription
        default: []
      to_remove:
        type: array
        items:
          type: string
        default: []
  response:
    type: object
    properties:
      added:
        type: array
        items:
          type: string
      removed:
        type: array
        items:
          type: string
  behavior:
  - call: extension-registry.snapshot
    as: snap
  - set:
      vars.removable: = input.to_remove.filter(id, id in vars.snap.value.registry && !(id in vars.snap.value.activated))
  - title: canRemoveExtension refuses unknown and already-activated extensions; canAddExtension refuses already-known ones
    source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:274-312
    set:
      vars.addable: = input.to_add.filter(e, !(e.identifier in vars.snap.value.registry) || e.identifier in vars.removable)
  - if: size(vars.addable) == 0 && size(vars.removable) == 0
    then:
    - title: Nothing to change
      source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:314-316
      return:
        added: []
        removed: []
  - call: extension-registry.delta-extensions
    input:
      to_add: = vars.addable
      to_remove: = vars.removable
  - publish: extension-service.on-did-change-extensions
    input:
      added: = vars.addable.map(e, e.identifier)
      removed: = vars.removable
    delivery: sync
  - title: Update the extension host ($deltaExtensions)
    source: src/vs/workbench/services/extensions/common/abstractExtensionService.ts:345-363
    call: extension-host-manager.delta-extensions
    input:
      to_add: = vars.addable
      to_remove: = vars.removable
  - foreach: = vars.addable
    as: ext
    steps:
    - call: extension-service.activate-added-extension-if-needed
      input:
        extension: = vars.ext
  - return:
      added: = vars.addable.map(e, e.identifier)
      removed: = vars.removable
- component: extension-service
  name: activate-added-extension-if-needed
  kind: function
  summary: '_activateAddedExtensionIfNeeded: activate an added extension now if one of its events was already requested, or it declares ''*'' or onStartupFinished.'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:406-454
