- component: extension-url-handler
  name: handle-url
  kind: function
  summary: 'handleURL(uri, options): only extension-id authorities; uninstalled extensions go to the install command; untrusted ones need confirmation (optionally remembered); a registered handler gets
    the URI, otherwise it is buffered and onUri:<id> activated (Immediate).'
  sources:
  - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:154-252
  request:
    type: object
    required:
    - uri
    properties:
      uri:
        type: string
        examples:
        - vscode://vscode.git/clone?url=https%3A%2F%2Fexample.com%2Frepo.git
      trusted:
        type: boolean
        default: false
  response:
    type: object
    properties:
      handled:
        type: boolean
      buffered:
        type: boolean
  behavior:
  - set:
      vars.ext_id: = input.uri.split('/')[2].split('?')[0].lowerAscii()
  - if: '!vars.ext_id.matches(''^[a-z0-9][a-z0-9-]*[.][a-z0-9][a-z0-9-]*$'')'
    then:
    - title: Not an extension id authority
      source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:155-157
      return:
        handled: false
        buffered: false
  - set:
      vars.initial: = vars.ext_id in state.handlers
  - if: '!vars.initial'
    then:
    - call: extension-service.get-extension
      input:
        extension_id: = vars.ext_id
      as: ext
    - if: '!vars.ext.value.found'
      then:
      - title: Not installed; run workbench.extensions.installExtension with a justification
        source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:168-172
        call: command-service.execute-command
        input:
          command_id: workbench.extensions.installExtension
          args:
          - = vars.ext_id
        on_error: continue
      - return:
          handled: true
          buffered: false
  - call: user-trusted-extension-id-storage.get
    as: stored
  - set:
      vars.trusted: = input.trusted || vars.ext_id in vars.stored.value.extensions || vars.ext_id in config['extensions-confirmed-uri-handler-extension-ids']
  - if: '!vars.trusted'
    then:
    - title: Allow '<extension>' extension to open this URI?
      source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:183-210
      call: dialog-service.confirm
      input:
        message: = 'Allow ' + vars.ext_id + ' extension to open this URI?'
        checkbox: Do not ask me again for this extension
        primary_button: Open
      as: confirm
    - choice: decision
      default: '= vars.confirm.value.confirmed ? ''open'' : ''cancel'''
      options:
        open: []
        open_and_remember:
        - title: Checkbox checked; remember the extension
          source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:207-209
          call: user-trusted-extension-id-storage.add
          input:
            extension_id: = vars.ext_id
        cancel:
        - return:
            handled: true
            buffered: false
  - if: vars.ext_id in state.handlers
    then:
    - if: '!vars.initial'
      then:
      - call: extension-url-handler.handle-url-by-extension
        input:
          extension_id: = vars.ext_id
          uri: = input.uri
      - return:
          handled: true
          buffered: false
    - title: The registered URL handler instance handles it
      source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:226-232
      return:
        handled: false
        buffered: false
  - title: Buffer the URI for the extension and activate onUri:<id> (Immediate)
    source: src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:236-251
    set:
      state.uri_buffer: '= merge(state.uri_buffer, {vars.ext_id: (vars.ext_id in state.uri_buffer ? state.uri_buffer[vars.ext_id] : []) + [{''uri'': input.uri, ''timestamp'': now}]})'
  - call: extension-service.activate-by-event
    input:
      activation_event: = 'onUri:' + vars.ext_id
      activation_kind: immediate
  - return:
      handled: true
      buffered: true
- component: extension-url-handler
  name: register-extension-handler
  kind: function
  summary: 'registerExtensionHandler: keep the handler and deliver every URI buffered for that extension.'
  sources:
  - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:254-264
  request:
    type: object
    required:
    - extension_id
    properties:
      extension_id:
        type: string
      handle:
        type: integer
  behavior:
  - set:
      state.handlers: '= merge(state.handlers, {input.extension_id: input.handle})'
  - foreach: '= input.extension_id in state.uri_buffer ? state.uri_buffer[input.extension_id] : []'
    as: buffered
    steps:
    - call: extension-url-handler.handle-url-by-extension
      input:
        extension_id: = input.extension_id
        uri: = vars.buffered.uri
  - set:
      state.uri_buffer: = omit(state.uri_buffer, input.extension_id)
- component: extension-url-handler
