# exthost area fragment (VS Code 1.144.0): extension host lifecycle, activation, RPC customers and the vscode API.
schema_version: 1
id: vscode
configs:
- id: extensions-web-worker
  type: string
  value: auto
  default: auto
  summary: 'extensions.webWorker: ''auto'' makes the desktop web worker extension host LazyAutoStart (created only when a web extension needs it); true starts it eagerly; false never. product.json sets
    no override, so deployed = default.'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:223-233
  - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:667-681
  attributes:
    key: extensions.webWorker
    read_by: NativeExtensionHostFactory
- id: extensions-experimental-deferred-startup-finished-activation
  type: boolean
  value: false
  default: false
  summary: 'extensions.experimental.deferredStartupFinishedActivation: when true, onStartupFinished activations are batched in 50 ms setTimeout0 slices instead of all at once.'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:312-316
  - src/vs/workbench/api/common/extHostExtensionService.ts:652-666
  attributes:
    key: extensions.experimental.deferredStartupFinishedActivation
- id: extensions-confirmed-uri-handler-extension-ids
  type: array
  value: []
  default: []
  summary: 'extensions.confirmedUriHandlerExtensionIds: extensions whose URIs open without the confirmation dialog.'
  sources:
  - src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:214-221
  - src/vs/workbench/services/extensions/browser/extensionUrlHandler.ts:336-345
  attributes:
    key: extensions.confirmedUriHandlerExtensionIds
- id: exthost-handshake-timeout-ms
  type: integer
  value: 60000
  default: 60000
  summary: 'Code constant (no setting): the local extension host must connect, send Ready and then Initialized, each within 60 s, or start() rejects.'
  sources:
  - src/vs/workbench/services/extensions/electron-browser/localProcessExtensionHost.ts:421-423
  - src/vs/workbench/services/extensions/electron-browser/localProcessExtensionHost.ts:472-474
  attributes:
    constant: LocalProcessExtensionHost handshake timeouts
- id: exthost-crash-limit
  type: integer
  value: 3
  default: 3
  summary: 'Code constant: ExtensionHostCrashTracker._CRASH_LIMIT. Auto-restart only while fewer than 3 crashes are recorded in the window.'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1552
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1568-1571
  attributes:
    constant: ExtensionHostCrashTracker._CRASH_LIMIT
- id: exthost-crash-window-ms
  type: integer
  value: 300000
  default: 300000
  summary: 'Code constant: ExtensionHostCrashTracker._TIME_LIMIT (5 minutes); older crashes are forgotten.'
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1551
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1556-1561
  attributes:
    constant: ExtensionHostCrashTracker._TIME_LIMIT
- id: rpc-unresponsive-time-ms
  type: integer
  value: 3000
  default: 3000
  summary: 'Code constant: RPCProtocol.UNRESPONSIVE_TIME. A request unacknowledged for more than 3 s marks the extension host unresponsive.'
  sources:
  - src/vs/workbench/services/extensions/common/rpcProtocol.ts:119
  - src/vs/workbench/services/extensions/common/rpcProtocol.ts:182-192
  attributes:
    constant: RPCProtocol.UNRESPONSIVE_TIME
- id: rpc-unresponsive-check-interval-ms
  type: integer
  value: 1000
  default: 1000
  summary: 'Code constant: the RunOnceScheduler that re-checks responsiveness every 1 s while requests are unacknowledged.'
  sources:
  - src/vs/workbench/services/extensions/common/rpcProtocol.ts:158
  - src/vs/workbench/services/extensions/common/rpcProtocol.ts:206-219
  attributes:
    constant: RPCProtocol._asyncCheckUresponsive
- id: exthost-eager-activation-timeout-ms
  type: integer
  value: 10000
  default: 10000
  summary: 'Code constant: onStartupFinished activation starts when eager (''*'', workspaceContains, resolver) activation finishes or after 10 s, whichever is first.'
  sources:
  - src/vs/workbench/api/common/extHostExtensionService.ts:681-683
  attributes:
    constant: Promise.race([eagerExtensionsActivation, timeout(10000)])
- id: exthost-auto-restart-status-hide-ms
  type: integer
  value: 5000
  default: 5000
  summary: 'Code constant: the ''extension host terminated unexpectedly. Restarting...'' status message hides after 5 s.'
  sources:
  - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:189
  attributes:
    constant: notificationService.status hideAfter
schemas:
- id: ExthostActivationReason
  summary: 'ExtensionActivationReason: why an extension is activated.'
  schema:
    type: object
    properties:
      startup:
        type: boolean
        default: false
      extension_id:
        type: string
        examples:
        - vscode.typescript-language-features
      activation_event:
        type: string
        examples:
        - onLanguage:typescript
- id: ExthostActivateByEventRequest
  summary: IExtensionService.activateByEvent(activationEvent, activationKind).
  schema:
    type: object
    required:
    - activation_event
    properties:
      activation_event:
        type: string
        examples:
        - onLanguage:typescript
      activation_kind:
        type: string
        enum:
        - normal
        - immediate
        default: normal
- id: ExthostActivationResult
  summary: What an activation request activated (the real promise resolves to void; the ids are recorded for scenarios).
  schema:
    type: object
    properties:
      activated:
        type: array
        items:
          type: string
        default: []
      deferred:
        type: boolean
        default: false
      cached:
        type: boolean
        default: false
- id: ExthostMirrorActivationRequest
  summary: '$activateByEvent(activationEvent, activationKind) as the model sends it: the shape''s two arguments plus the descriptions the extension host''s own registry holds (kept identical to the renderer''s
    by $startExtensionHost/$deltaExtensions), so the host side needs no duplicate seed.'
  schema:
    type: object
    required:
    - activation_event
    properties:
      activation_event:
        type: string
        examples:
        - onLanguage:typescript
      activation_kind:
        type: string
        enum:
        - normal
        - immediate
        default: normal
      startup:
        type: boolean
        default: false
      extensions:
        type: array
        items:
          $ref: ExthostExtensionDescription
        default: []
      registry:
        type: object
        default: {}
- id: ExthostApiArgs
  summary: 'Generic vscode API call arguments for API functions modeled as stubs: the calling extension and the function''s positional arguments.'
  schema:
    type: object
    properties:
      extension_id:
        type: string
        examples:
        - vscode.typescript-language-features
      args:
        type: array
        default: []
- id: ExthostApiResult
  summary: 'Generic vscode API result: a Disposable handle for register*/create* functions, or the returned value.'
  schema:
    type: object
    properties:
      disposable_id:
        type: string
        examples:
        - disposable-1
      value: {}
fixtures:
- id: exthost-seed
  summary: The extension host's own registry (ExtHostExtensionService._globalRegistry/_myRegistry, filled from the init data), mirroring the extensions one-window-folder registers in the window.
  state:
    extension-registry@w1:
      extensions:
        vscode.git:
          capabilities:
            untrusted_workspaces:
              supported: false
        vscode.typescript-language-features:
          capabilities:
            untrusted_workspaces:
              supported: false
        vscode.markdown-language-features:
          capabilities:
            untrusted_workspaces:
              supported: limited
    ext-host-extension-service:
      registry:
        vscode.git:
          identifier: vscode.git
          activation_events:
          - '*'
          main: ./out/main
          extension_dependencies: []
        vscode.typescript-language-features:
          identifier: vscode.typescript-language-features
          activation_events:
          - onLanguage:typescript
          - onLanguage:javascript
          main: ./out/extension
          extension_dependencies: []
        vscode.markdown-language-features:
          identifier: vscode.markdown-language-features
          activation_events:
          - onLanguage:markdown
          main: ./out/extension
          extension_dependencies: []
        ms-vscode.js-debug:
          identifier: ms-vscode.js-debug
          activation_events:
          - onDebugResolve:node
          - onDebugInitialConfigurations
          - onDebugDynamicConfigurations
          main: ./src/extension.js
          extension_dependencies: []
components:
- id: extension-service
  name: ExtensionService (NativeExtensionService)
  kind: service
  layer: extensions
  parent: exthost-bridge
  summary: 'IExtensionService: scans extensions, creates extension host managers, activates by event, restarts hosts after crashes. Desktop impl NativeExtensionService extends AbstractExtensionService.'
  sources:
  - src/vs/workbench/services/extensions/common/extensions.ts:39
  - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:773
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:61-124
  - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:63-140
  attributes:
    owner: exthost
    impl: NativeExtensionService
    web_impl: ExtensionService (browser/extensionService.ts:361)
  state:
    schema:
      type: object
      properties:
        ready:
          type: boolean
        requested_events:
          type: array
          items:
            type: string
        host_state:
          type: string
          enum:
          - running
          - stopped
          - failed
        host_responsive:
          type: boolean
        is_extension_dev_host:
          type: boolean
        activation_times:
          type: object
        activation_errors:
          type: object
        restarts:
          type: integer
        web_worker_host:
          type: string
    initial:
      ready: true
      requested_events: []
      host_state: running
      host_responsive: true
      is_extension_dev_host: false
      activation_times: {}
      activation_errors: {}
      restarts: 0
      web_worker_host: lazy
- id: extension-host-manager
  name: ExtensionHostManager
  kind: module
  layer: extensions
  parent: extension-service
  summary: 'One per running extension host: owns the RPCProtocol, instantiates the MainThread* customers, caches activation events and forwards activation to the host.'
  sources:
  - src/vs/workbench/services/extensions/common/extensionHostManager.ts:58-162
  attributes:
    owner: exthost
  state:
    schema:
      type: object
      properties:
        cached_events:
          type: array
          items:
            type: string
        resolved_events:
          type: array
          items:
            type: string
        has_started:
          type: boolean
    initial:
      cached_events: []
      resolved_events: []
      has_started: true
- id: extension-host-crash-tracker
  name: ExtensionHostCrashTracker
  kind: module
  layer: extensions
  parent: extension-service
  summary: Remembers crash timestamps of the last 5 minutes and allows automatic restart while fewer than 3 are recorded (NativeExtensionService._localCrashTracker).
  sources:
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:1549-1572
  - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:66
  attributes:
    owner: exthost
  state:
    schema:
      type: object
      properties:
        recent_crashes:
          type: array
          items:
            type: integer
    initial:
      recent_crashes: []
- id: native-local-process-extension-host
  name: NativeLocalProcessExtensionHost
  kind: module
  layer: extensions
  parent: extension-host-manager
  summary: Spawns the local extension host process through IExtensionHostStarter, performs the Ready/Initialized handshake and reports unexpected exits.
  sources:
  - src/vs/workbench/services/extensions/electron-browser/localProcessExtensionHost.ts:95-120
  - src/vs/workbench/services/extensions/electron-browser/localProcessExtensionHost.ts:208-219
  attributes:
    owner: exthost
  state:
    schema:
      type: object
      properties:
        terminating:
          type: boolean
        pid:
          type: integer
    initial:
      terminating: false
      pid: 4242
- id: web-worker-extension-host
  name: WebWorkerExtensionHost
  kind: module
  layer: extensions
  parent: extension-service
  summary: The web worker extension host for web extensions; on desktop LazyAutoStart under extensions.webWorker=auto.
