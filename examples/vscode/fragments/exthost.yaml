- component: extension-service
  name: on-extension-host-crashed
  kind: function
  summary: 'NativeExtensionService._onExtensionHostCrashed (local process): stop all hosts; on a version mismatch offer to relaunch; otherwise record the crash and restart automatically, or after 3 crashes
    in 5 minutes ask the user.'
  sources:
  - src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:150-231
  - src/vs/workbench/services/extensions/common/abstractExtensionService.ts:887-897
  request:
    type: object
