- component: main-thread-editor-tabs
  name: create-tabs-model
  kind: function
  summary: '_createTabsModel: rebuild the tab group model from the editor groups and send it whole to the extension host ($acceptEditorTabModel).'
  sources:
  - src/vs/workbench/api/browser/mainThreadEditorTabs.ts:509-542
  response:
    type: object
    properties:
      rebuilt:
        type: boolean
      groups:
        type: integer
  behavior:
  - call: editor-groups.get-state
    as: gs
  - if: size(vars.gs.value.groups) == 0
    then:
    - title: skip this invalid state (the editor area is transitioning to another working set)
      source: src/vs/workbench/api/browser/mainThreadEditorTabs.ts:510-512
      return:
        rebuilt: false
        groups: 0
  - set:
      vars.dto: '= vars.gs.value.groups.map(g, {''group_id'': g.id, ''is_active'': g.id == vars.gs.value.active_group, ''tabs'': g.editors.map(e, {''id'': string(g.id) + ''~'' + e, ''input'': e, ''label'':
        e, ''is_active'': g.active != null && e == g.active})})'
      state.groups: {}
      state.tab_ids: []
      state.rebuilds: = state.rebuilds + 1
  - title: one group DTO per editor group; every editor becomes a tab and enters the lookup
    source: src/vs/workbench/api/browser/mainThreadEditorTabs.ts:518-538
    foreach: = vars.gs.value.groups
    as: g
    steps:
    - set:
        state.groups: = merge(state.groups, {string(vars.g.id):vars.g.editors})
        state.tab_ids: = state.tab_ids + vars.g.editors.map(e, string(vars.g.id) + '~' + e)
  - title: notify the ext host of the new model
    source: src/vs/workbench/api/browser/mainThreadEditorTabs.ts:540
    call: ext-host-editor-tabs.accept-editor-tab-model
    'on': = 'eh' + self.substring(1)
    input:
      tab_groups: = vars.dto
  - return:
      rebuilt: true
      groups: = size(vars.dto)
- component: main-thread-editor-tabs
  name: on-did-editors-change
  kind: function
  summary: '_updateTabsModel, the editorService.onDidEditorsChange listener: patch the model for label, open, close and state changes (one $acceptTabOperation), ignore selection/transient changes, and rebuild the whole model otherwise or when the patch target is missing.'
  sources:
  - src/vs/workbench/api/browser/mainThreadEditorTabs.ts:62-69
  - src/vs/workbench/api/browser/mainThreadEditorTabs.ts:548-610
  request:
    type: object
    required:
    - group_id
    - kind
    properties:
      group_id:
        type: integer
        examples:
        - 1
      kind:
        type: string
        enum:
        - group-active
        - editor-label
        - editor-open
        - editor-close
        - editor-active
        - editor-dirty
        - editor-sticky
        - editor-pin
        - editor-transient
        - editors-selection
        - editor-move
        - group-index
      editor:
        type: string
        examples:
        - file:///work/app/src/main.ts
      editor_index:
        type: integer
        default: 0
      in_modal_part:
        type: boolean
        default: false
        description: the group belongs to editorGroupsService.activeModalEditorPart
  response:
    type: object
    properties:
      rebuilt:
        type: boolean
      operation:
        type: string
  behavior:
  - set:
      vars.gid: = string(input.group_id)
      vars.tab_id: '= string(input.group_id) + ''~'' + (has(input.editor) ? input.editor : '''')'
  - if: input.kind == 'editor-transient' || input.kind == 'editors-selection'
    then:
    - title: not exposed in the tabs API; no-op so extensions keep their Tab references
      source: src/vs/workbench/api/browser/mainThreadEditorTabs.ts:594-600
      return:
        rebuilt: false
        operation: none
  - if: input.kind == 'editor-open'
    then:
    - if: '!(vars.gid in state.groups)'
      then:
      - title: the group is not in our model yet (likely new); rebuild
        source: src/vs/workbench/api/browser/mainThreadEditorTabs.ts:291-298
        call: main-thread-editor-tabs.create-tabs-model
      - return:
          rebuilt: true
          operation: rebuild
    - title: splice the tab into the group and the lookup (appended here), then $acceptTabOperation TAB_OPEN
      source: src/vs/workbench/api/browser/mainThreadEditorTabs.ts:299-336
      set:
        "= 'state.groups.' + vars.gid": = state.groups[vars.gid] + [input.editor]
        state.tab_ids: = state.tab_ids + [vars.tab_id]
    - call: ext-host-editor-tabs.accept-tab-operation
      'on': = 'eh' + self.substring(1)
      input:
        group_id: = input.group_id
        index: '= has(input.editor_index) ? input.editor_index : 0'
        kind: tab-open
        tab:
          id: = vars.tab_id
          label: = input.editor
    - return:
        rebuilt: false
        operation: tab-open
  - if: input.kind == 'editor-close'
    then:
    - set:
        vars.idx: '= has(input.editor_index) ? input.editor_index : 0'
    - if: vars.gid in state.groups && vars.idx < size(state.groups[vars.gid])
      then:
      - set:
          vars.closed: = state.groups[vars.gid][vars.idx]
      - title: remove the tab at the index and from the lookup, then $acceptTabOperation TAB_CLOSE
        source: src/vs/workbench/api/browser/mainThreadEditorTabs.ts:343-374
        set:
          "= 'state.groups.' + vars.gid": = state.groups[vars.gid].filter(e, e != vars.closed)
          state.tab_ids: = state.tab_ids.filter(t, t != vars.gid + '~' + vars.closed)
      - call: ext-host-editor-tabs.accept-tab-operation
        'on': = 'eh' + self.substring(1)
        input:
          group_id: = input.group_id
          index: '= has(input.editor_index) ? input.editor_index : 0'
          kind: tab-close
          tab:
            id: = vars.gid + '~' + vars.closed
            label: = vars.closed
      - return:
