- component: main-thread-commands
  name: execute-command
  kind: rpc
  summary: '$executeCommand(id, args, retry): for an unknown command with arguments and retry set, activate onCommand:<id> and throw ''$executeCommand:retry''; otherwise ICommandService.executeCommand.'
  attributes:
    shape: MainThreadCommandsShape
  sources:
  - src/vs/workbench/api/common/extHost.protocol.ts:141
  - src/vs/workbench/api/browser/mainThreadCommands.ts:80-93
  request:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
        - workbench.action.files.save
      args:
        type: array
        default: []
      retry:
        type: boolean
        default: true
  response:
    type: object
    properties:
      value: {}
  errors:
  - code: execute-command-retry
    status: 0
    retryable: false
    summary: '''$executeCommand:retry'' tells the extension host to run the command again'
  - code: command-not-found
    status: 0
    retryable: false
  behavior:
  - if: input.retry && size(input.args) > 0
    then:
    - title: CommandsRegistry.getCommand(id)
      source: src/vs/workbench/api/browser/mainThreadCommands.ts:87
      call: commands-registry.get-command
      input:
        command_id: = input.command_id
      as: known
      on_error: continue
    - if: '!vars.known.ok'
