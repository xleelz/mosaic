- id: rpc-protocol
  name: RPCProtocol (renderer end)
  kind: module
  layer: extensions
  parent: extension-host-manager
  summary: Sends requests to the extension host, counts unacknowledged ones and flips the responsive state after 3 s without an acknowledgement.
  sources:
  - src/vs/workbench/services/extensions/common/rpcProtocol.ts:115-160
  attributes:
    owner: exthost
  state:
    schema:
