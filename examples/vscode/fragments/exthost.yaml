  - title: 3 crashes within 5 minutes; prompt with Start Extension Bisect, Restart Extension Host and Learn More
    source: src/vs/workbench/services/extensions/electron-browser/nativeExtensionService.ts:191-228
    call: notification-service.prompt
    input:
      severity: error
