- component: workspace-trust-request-service
  name: request-open-files-trust
  kind: function
  summary: 'requestOpenFilesTrust: opening files from outside a trusted workspace asks Open / Open in New Window unless every file is trusted, the workspace is untrusted, security.workspace.trust.untrustedFiles
    decides, or the user already accepted.'
  sources:
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:766-808
  request:
    type: object
    required:
    - uris
    properties:
      uris:
        type: array
        items:
          type: string
        examples:
        - - file:///tmp/notes.txt
  response:
    type: object
    properties:
      response:
        type: string
        enum:
        - open
        - open-in-new-window
        - cancel
  behavior:
  - call: workspace-trust-management-service.is-workspace-trusted
    as: t
  - if: '!vars.t.value.trusted'
    then:
    - title: Untrusted workspace, no conflict
      source: src/vs/workbench/services/workspaces/common/workspaceTrust.ts:767-770
      return:
        response: open
  - foreach: = input.uris
    as: u
    steps:
    - call: workspace-trust-management-service.get-uri-trust-info
      input:
        uri: = vars.u
      as: ui
    - if: '!vars.ui.value.trusted'
      then:
      - set:
          vars.untrusted: true
  - if: '!has(vars.untrusted)'
    then:
    - title: All files trusted
      source: src/vs/workbench/services/workspaces/common/workspaceTrust.ts:774-777
      return:
        response: open
  - if: config['security-workspace-trust-untrusted-files'] != 'prompt'
    then:
    - title: The setting answers without asking
      source: src/vs/workbench/services/workspaces/common/workspaceTrust.ts:780-788
      return:
        response: '= config[''security-workspace-trust-untrusted-files''] == ''newWindow'' ? ''open-in-new-window'' : ''open'''
  - call: workspace-trust-management-service.get-accepts-out-of-workspace-files
    as: acc
  - if: vars.acc.value.accepts
    then:
    - title: The user already accepted untrusted files
      source: src/vs/workbench/services/workspaces/common/workspaceTrust.ts:791-794
      return:
        response: open
  - title: Ask the user (dialog in contrib/workspace)
    source: src/vs/workbench/services/workspaces/common/workspaceTrust.ts:796-807
    choice: open_files
    default: open
    options:
      open:
      - title: Open, remember acceptsOutOfWorkspaceFiles
        source: src/vs/workbench/services/workspaces/common/workspaceTrust.ts:743-746
        call: workspace-trust-management-service.set-accepts-out-of-workspace-files
        input:
          value: true
      - return:
          response: open
      new_window:
      - return:
          response: open-in-new-window
      cancel:
      - return:
          response: cancel
