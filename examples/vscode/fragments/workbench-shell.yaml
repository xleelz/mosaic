        type: boolean
  behavior:
  - title: Add the command to the commands history (counter++)
    source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:450-457
    set:
      state.history: '= merge(state.history, {input.command_id: state.counter})'
      state.counter: = state.counter + 1
  - title: Run the command through ICommandService
    source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:315-318
    call: command-service.execute-command
    input:
      command_id: = input.command_id
      args: '= has(input.args) ? input.args : []'
    on_error:
    - when: error.code != 'canceled'
      title: A failure other than cancellation shows an error dialog
      source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:319-322
      call: dialog-service.error
      input:
        message: '= "Command ''" + (has(input.label) ? input.label : input.command_id) + "'' resulted in an error"'
        detail: = error.message
    - return:
        executed: false
  - return:
      executed: true
