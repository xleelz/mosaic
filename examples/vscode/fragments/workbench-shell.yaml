- component: editor-commands
  name: close-all-in-all-groups
  kind: function
  summary: 'AbstractCloseAllAction: confirm every dirty editor across groups, then close all editors of every group (and the groups themselves for Close All Groups).'
  sources:
  - src/vs/workbench/browser/parts/editor/editorActions.ts:592-796
  request:
    type: object
    properties:
      close_groups:
        type: boolean
        default: false
  behavior:
  - call: editor-groups.get-state
    as: st
  - foreach: = vars.st.value.groups.map(g, g.id)
    as: gid
    steps:
    - call: editor-groups.get-state
      as: cur
    - if: '!vars.cur.value.groups.exists(g, g.id == vars.gid)'
      then:
      - title: Group already removed (closeEmptyGroups)
        continue: true
    - call: editor-group-view.close-editors
      input:
        group_id: = vars.gid
        mode: all
      as: r
    - if: '!vars.r.value.closed'
      then:
      - title: A dirty editor vetoed, stop
        return:
          closed: false
  - if: has(input.close_groups) && input.close_groups
    then:
    - call: editor-groups.get-state
      as: after
    - call: editor-part.merge-all-groups
      input:
        target_id: = vars.after.value.active_group
  - return:
