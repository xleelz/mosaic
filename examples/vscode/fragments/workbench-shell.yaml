  summary: Command vscode.open (handler).
  sources:
  - src/vs/workbench/browser/parts/editor/editorCommands.ts:445-454
  attributes:
    command_id: vscode.open
  request:
    type: object
  behavior:
  - title: Forward the single argument to _workbench.open through ICommandService (not awaited in the code)
    source: src/vs/workbench/browser/parts/editor/editorCommands.ts:445-449
    call: command-service.execute-command
    input:
      command_id: _workbench.open
      args: '= has(input.args) && size(input.args) > 0 ? [input.args[0]] : []'
    as: fwd
  - return:
      forwarded: true
- component: editor-commands
  name: cmd--workbench-open
  kind: function
  summary: Command _workbench.open (handler).
  sources:
  - src/vs/workbench/browser/parts/editor/editorCommands.ts:456-499
  attributes:
    command_id: _workbench.open
  request:
    type: object
  behavior:
  - if: '!has(input.args) || size(input.args) == 0'
    then:
    - fail:
        code: missing-resource
        message: no resource argument
  - set:
      vars.res: = input.args[0]
      vars.co: '= size(input.args) > 1 && input.args[1] != null ? input.args[1] : []'
  - set:
      vars.column: '= size(vars.co) > 0 && vars.co[0] != null ? vars.co[0] : null'
      vars.options: '= size(vars.co) > 1 && vars.co[1] != null ? vars.co[1] : null'
  - if: vars.options != null || type(vars.column) == int || vars.res.startsWith('untitled:')
    then:
    - title: 'Editor options, a column or an untitled resource: open directly with the editor service in columnToEditorGroup(column)'
      source: src/vs/workbench/browser/parts/editor/editorCommands.ts:469-487
      set:
        vars.col: '= type(vars.column) == int ? vars.column : -1'
    - if: vars.col >= 0
      then:
      - call: editor-groups.get-state
        as: gs
      - title: A column index picks the group in grid order; a missing column opens to the side
        source: src/vs/workbench/services/editor/common/editorGroupColumn.ts:18-40
        set:
          vars.group: '= vars.col < size(vars.gs.value.groups) ? vars.gs.value.groups[vars.col].id : -2'
      else:
      - set:
          vars.group: = vars.col
    - call: editor-service.open-editor
      input:
        resource: = vars.res
        group: = vars.group
        options: '= vars.options != null ? vars.options : {}'
      as: opened
    - return:
        opened: true
        via: editor-service
        group_id: = vars.opened.value.group_id
  - if: vars.res.startsWith('command:')
    then:
    - title: 'command: URIs are never executed from here'
      source: src/vs/workbench/browser/parts/editor/editorCommands.ts:490-493
      return:
        opened: false
        via: none
  - title: Otherwise delegate to the opener service
    source: src/vs/workbench/browser/parts/editor/editorCommands.ts:495-498
    call: opener-service.open
    input:
      resource: = vars.res
    as: op
  - return:
      opened: = vars.op.value.opened
      via: = vars.op.value.via
