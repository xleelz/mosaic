- component: editor-commands
  name: split-editor
  kind: function
  summary: 'splitEditor: add a group next to the active one in the given direction, copy the active editor into it and focus it.'
  sources:
  - src/vs/workbench/browser/parts/editor/editorCommands.ts:750-770
  request:
    type: object
    required:
    - direction
    properties:
      direction:
        type: string
        enum:
        - left
        - right
        - up
        - down
  behavior:
  - call: editor-groups.get-state
    as: st
  - set:
      vars.src: = vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]
  - title: Add a group in the direction
    source: src/vs/workbench/browser/parts/editor/editorCommands.ts:758
    call: editor-part.add-group
    input:
      location_id: = vars.src.id
      direction: = input.direction
    as: ng
  - if: vars.src.active != null
    then:
    - title: Copy the active editor into the new group
      source: src/vs/workbench/browser/parts/editor/editorCommands.ts:760-766
      call: editor-group-view.open-editor
      input:
        group_id: = vars.ng.value.group_id
        resource: = vars.src.active
        options:
          pinned: = vars.src.preview != vars.src.active
  - call: editor-groups.set-active-group
    input:
      group_id: = vars.ng.value.group_id
  - return:
      group_id: = vars.ng.value.group_id
- component: editor-commands
  name: move-copy-active-editor
  kind: function
  summary: 'moveCopySelectedEditors (moveActiveEditor / copyActiveEditor): by tab, move inside the group (first, last, left, right, position, clamped); by group, find the target group (creating one for
    a direction or previous/next when missing) and move or copy the editor there.'
  sources:
  - src/vs/workbench/browser/parts/editor/editorCommands.ts:225-350
  request:
    type: object
    properties:
      to:
        type: string
        enum:
        - first
        - last
        - left
        - right
        - up
        - down
        - previous
        - next
        - position
        - center
        default: right
      by:
        type: string
        enum:
        - tab
        - group
        default: tab
      value:
        type: integer
        default: 1
      copy:
        type: boolean
        default: false
  behavior:
  - set:
      vars.to: '= has(input.to) ? input.to : ''right'''
      vars.by: '= has(input.by) ? input.by : ''tab'''
      vars.val: '= has(input.value) ? input.value : 1'
      vars.copy: = has(input.copy) && input.copy
  - call: editor-groups.get-state
    as: st
  - set:
      vars.g: = vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]
  - if: vars.g.active == null
    then:
    - return:
        moved: false
  - if: vars.by == 'tab'
    then:
    - if: vars.copy
      then:
      - title: Copy by tab is not supported
        source: src/vs/workbench/browser/parts/editor/editorCommands.ts:237-241
        return:
          moved: false
    - set:
        vars.i: = lists.range(size(vars.g.editors)).filter(i, vars.g.editors[i] == vars.g.active)[0]
    - title: Compute the new tab index
      source: src/vs/workbench/browser/parts/editor/editorCommands.ts:262-286
      set:
        vars.ix: '= vars.to == ''first'' ? 0 : (vars.to == ''last'' ? size(vars.g.editors) - 1 : (vars.to == ''left'' ? vars.i - vars.val : (vars.to == ''right'' ? vars.i + vars.val : (vars.to == ''position''
          ? vars.val - 1 : vars.i))))'
    - call: editor-group-view.move-editor
      input:
        group_id: = vars.g.id
        target_group_id: = vars.g.id
        index: = vars.ix
    - return:
        moved: true
        group_id: = vars.g.id
  - if: vars.to in ['first', 'last', 'previous', 'next', 'left', 'right', 'up', 'down']
    then:
    - call: editor-part.find-group
      input:
        scope: = vars.to
        source_id: = vars.g.id
      as: fg
    - set:
        vars.target: = vars.fg.value.group_id
    else:
    - set:
        vars.target: '= vars.val - 1 < size(vars.st.value.groups) ? vars.st.value.groups[vars.val - 1].id : null'
  - if: vars.target == null && !(vars.to in ['first', 'last', 'position', 'center'])
    then:
    - title: No group there, create one
      source: src/vs/workbench/browser/parts/editor/editorCommands.ts:292-330
      call: editor-part.add-group
      input:
        location_id: = vars.g.id
        direction: '= vars.to == ''next'' ? ''right'' : (vars.to == ''previous'' ? ''left'' : vars.to)'
      as: ng
    - set:
        vars.target: = vars.ng.value.group_id
  - if: vars.target == null || (vars.copy && vars.target == vars.g.id)
    then:
    - return:
        moved: false
  - title: Move or copy the editor into the target group and focus it
    source: src/vs/workbench/browser/parts/editor/editorCommands.ts:339-347
    call: editor-group-view.move-editor
    input:
      group_id: = vars.g.id
      target_group_id: = vars.target
      copy: = vars.copy
  - call: editor-groups.set-active-group
    input:
      group_id: = vars.target
  - return:
      moved: true
      group_id: = vars.target
- component: editor-commands
  name: focus-group
  kind: function
  summary: 'AbstractFocusGroupAction / NavigateBetweenGroupsAction: find a group by direction or location and activate it; FocusFirstGroup creates a group to the right when asked for a missing index.'
  sources:
  - src/vs/workbench/browser/parts/editor/editorActions.ts:277-292
