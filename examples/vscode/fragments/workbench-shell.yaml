- component: account-policy-service
  name: update-policy-definitions
  kind: function
  summary: '_updatePolicyDefinitions: without policy data every policy resolves to undefined (deleted); otherwise value(policyData) for each definition; the changed names fire onDidChange.'
  sources:
  - src/vs/workbench/services/policies/common/accountPolicyService.ts:168-197
  response:
    type: object
    properties:
      updated:
        type: array
  behavior:
  - set:
      vars.names: = state.definitions.map(n, n)
      vars.data: = state.account_policy_data
  - title: resolvePolicyValue runs the definition's value provider over the policy data (undefined without data)
    source: src/vs/workbench/services/policies/common/accountPolicyService.ts:199-211
    set:
      vars.resolved: '= vars.data == null ? [] : vars.names.filter(n, eval(state.definitions[n].value, {"policyData": vars.data}) != null).map(n, n)'
  - set:
      vars.values: {}
  - foreach: = vars.resolved
    as: n
    steps:
    - set:
        vars.values: '= merge(vars.values, {vars.n: eval(state.definitions[vars.n].value, {"policyData": vars.data})})'
  - title: updatePolicyValue deletes undefined values and stores changed ones with source Account; changed names are collected
    source: src/vs/platform/policy/common/policy.ts:118-139
    set:
      vars.updated: = vars.names.filter(n, (n in vars.values) != (n in state.policies) || ((n in vars.values) && state.policies[n] != vars.values[n]))
  - set:
      state.policies: null
      state.sources: null
  - set:
      state.policies: = vars.values
      state.sources: {}
  - foreach: = vars.resolved
    as: n
    steps:
    - set:
        state.sources: '= merge(state.sources, {vars.n: "account"})'
  - if: size(vars.updated) > 0
    then:
    - title: onDidChange fires with the updated policy names
      source: src/vs/workbench/services/policies/common/accountPolicyService.ts:190-192
      set:
        state.last_changed: = vars.updated
    - publish: account-policy-service.on-did-change
      delivery: sync
      input:
        names: = vars.updated
  - return:
      updated: = vars.updated
