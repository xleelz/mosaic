- component: lifecycle-service
  name: on-before-shutdown
  kind: event
  summary: 'The before-shutdown handshake (seam). The main process asks via vscode:onBeforeUnload; the service fires onBeforeShutdown (subscribers veto through lifecycle-service.veto), then, only when nobody
    vetoed, the final-veto phase (topic lifecycle-service.on-before-shutdown-final). Returns veto, which the window sends back on the cancel or ok channel. Subscribers declare subscribe: [lifecycle-service.on-before-shutdown].'
  sources:
  - src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:36-61
  - src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:79-150
  - src/vs/workbench/services/lifecycle/common/lifecycle.ts:21-49
  attributes:
    seam: true
    callers: files-search-scm, terminal-debug-tasks, main-process
  request: WorkbenchShutdownRequest
  response:
    type: object
    required:
    - veto
    properties:
      veto:
        type: boolean
      vetoed_by:
        type: array
        items:
          type: string
  behavior:
  - set:
      state.vetoes: []
      state.pending_reason: = input.reason
  - title: Fire onBeforeShutdown, collecting vetos
    source: src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:88-117
    publish: lifecycle-service.on-before-shutdown
    delivery: sync
    input:
      reason: = input.reason
  - if: size(state.vetoes) == 0
    then:
    - title: No veto yet, run the final veto
      source: src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:131-144
      publish: lifecycle-service.on-before-shutdown-final
      delivery: sync
      input:
        reason: = input.reason
  - if: size(state.vetoes) > 0
    then:
    - title: Veto, cancel the unload and fire onShutdownVeto
      source: src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:44-52
      set:
        state.veto_count: = state.veto_count + 1
    - return:
        veto: true
        vetoed_by: = state.vetoes
  - title: No veto, remember the shutdown reason and allow the unload
    source: src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:55-60
    set:
      state.shutdown_reason: = input.reason
  - return:
      veto: false
      vetoed_by: []
- component: lifecycle-service
  name: on-before-shutdown-final
  kind: event
  summary: 'Topic of the final-veto phase (InternalBeforeShutdownEvent.finalVeto): runs only when no regular veto was raised. The working copy backup tracker (files-search-scm) registers its backup/confirm
    logic here.'
  sources:
  - src/vs/workbench/services/lifecycle/common/lifecycle.ts:38-49
  request:
    type: object
    properties:
      reason:
        type: string
- component: lifecycle-service
  name: veto
  kind: function
  summary: 'BeforeShutdownEvent.veto(value, id) / finalVeto: a participant''s answer; true prevents the shutdown and is logged with its id.'
  sources:
  - src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:91-116
  request:
    type: object
    required:
    - id
    - veto
    properties:
      id:
        type: string
        examples:
        - veto.untitledWorkspace
      veto:
        type: boolean
  behavior:
  - if: input.veto
    then:
    - title: Shutdown was prevented
      source: src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:95-97
      set:
        state.vetoes: = state.vetoes + [input.id]
  - return:
      vetoed: = input.veto
- component: lifecycle-service
  name: on-will-shutdown
  kind: event
  summary: 'vscode:onWillUnload: fire onWillShutdown (participants join their work, default joiners before last joiners), flush storage with the shutdown reason, then onDidShutdown and acknowledge to the
    main process. Subscribers declare subscribe: [lifecycle-service.on-will-shutdown].'
  sources:
  - src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:63-76
  - src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:158-203
  request: WorkbenchShutdownRequest
  behavior:
  - set:
      state.will_shutdown: true
  - title: Fire onWillShutdown, participants join
    source: src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:165-184
    publish: lifecycle-service.on-will-shutdown
    delivery: sync
    input:
      reason: = input.reason
  - title: Persist the shutdown reason for the next startup
    source: src/vs/workbench/services/lifecycle/common/lifecycleService.ts:58-62
    call: storage-db.workspace-write
    input:
      key: lifecyle.lastShutdownReason
      value: = input.reason
    on_error: continue
  - title: Fire onDidShutdown and acknowledge
    source: src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:71-75
    set:
      state.did_shutdown: true
  - return:
      acknowledged: true
- component: lifecycle-service
  name: set-phase
  kind: function
  summary: 'AbstractLifecycleService.phase setter: phases only move forward (Starting 1, Ready 2, Restored 3, Eventually 4); reaching a phase opens its barrier.'
  sources:
  - src/vs/workbench/services/lifecycle/common/lifecycleService.ts:92-111
  request:
    type: object
    required:
    - phase
    properties:
      phase:
        type: integer
        minimum: 1
        maximum: 4
  errors:
  - code: lifecycle-cannot-go-backwards
    status: 0
    retryable: false
  behavior:
  - if: input.phase < state.phase
    then:
    - title: Lifecycle cannot go backwards
      source: src/vs/workbench/services/lifecycle/common/lifecycleService.ts:93-95
      fail:
        code: lifecycle-cannot-go-backwards
        message: Lifecycle cannot go backwards
  - if: input.phase == state.phase
    then:
    - return:
        phase: = state.phase
        changed: false
  - set:
      state.phase: = input.phase
  - return:
      phase: = input.phase
      changed: true
- component: native-workspace-editing-service
  name: on-before-shutdown
  kind: event
  subscribe:
  - lifecycle-service.on-before-shutdown
  summary: 'saveUntitledBeforeShutdown: when the window closes or loads another workspace while an untitled workspace is open, ask to save it (Save / Don''t Save / Cancel); Cancel vetoes the shutdown.'
  sources:
  - src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:71-76
  - src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:78-157
  request:
    type: object
    properties:
      reason:
        type: string
  behavior:
  - if: '!(input.reason in [''load'', ''close''])'
    then:
    - title: Only interested when the window closes or loads
      source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:79-81
      return:
        veto: false
  - call: workspace-context.get-workspace
    as: ws
  - if: '!vars.ws.value.untitled_workspace'
    then:
    - title: Not an untitled workspace
      source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:83-86
      return:
        veto: false
  - call: native-host-service.get-window-count
    input: {}
    as: wc
  - if: input.reason == 'close' && vars.wc.value.count == 1
    then:
    - title: Windows/Linux quit when the last window closes, do not ask
      source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:88-91
      return:
        veto: false
  - if: '!config[''window-confirm-save-untitled-workspace'']'
    then:
    - title: No confirmation configured, discard the untitled workspace
      source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:93-98
      call: workspace-context.set-folders
      input:
        folders: = vars.ws.value.folders
        untitled_workspace: false
    - return:
        veto: false
  - title: Ask whether to save the workspace configuration
    source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:100-150
    choice: save_workspace
    default: dont_save
    options:
      save:
      - title: Save As a workspace file, then delete the untitled one
        source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:107-130
        call: workspace-context.set-folders
        input:
          folders: = vars.ws.value.folders
          untitled_workspace: false
      - call: lifecycle-service.veto
        input:
          id: veto.untitledWorkspace
          veto: false
      - return:
          veto: false
      dont_save:
      - title: Delete the untitled workspace
        source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:133-139
        call: workspace-context.set-folders
        input:
          folders: = vars.ws.value.folders
          untitled_workspace: false
      - call: lifecycle-service.veto
        input:
          id: veto.untitledWorkspace
          veto: false
      - return:
          veto: false
      cancel:
      - title: Cancel keeps the window open
        source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:141-147
        call: lifecycle-service.veto
        input:
          id: veto.untitledWorkspace
          veto: true
      - return:
          veto: true
- component: native-workspace-editing-service
  name: add-folders
  kind: function
  summary: 'addFolders / doAddFolders: in a single-folder or empty window adding folders creates and enters an untitled multi-root workspace (extension hosts are stopped, may be vetoed, and restarted);
    in a workspace the folders are added to it. Adding the folder that is already open is a no-op.'
  sources:
  - src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:189-229
  - src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:260-281
  - src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:178-209
  request:
    type: object
    required:
    - folders
    properties:
      folders:
        type: array
        items:
          type: string
        examples:
        - - file:///work/lib
  response:
    type: object
    properties:
      entered_workspace:
        type: boolean
      folders:
        type: array
        items:
          type: string
  behavior:
  - call: workspace-context.get-workspace
    as: ws
  - set:
      vars.merged: = vars.ws.value.folders + input.folders.filter(f, !(f in vars.ws.value.folders))
  - if: vars.ws.value.workbench_state == 'workspace'
    then:
    - title: Already a workspace, add the folders to it
      source: src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:219-228
      call: workspace-context.set-folders
      input:
        folders: = vars.merged
        untitled_workspace: = vars.ws.value.untitled_workspace
    - return:
        entered_workspace: false
        folders: = vars.merged
  - if: (vars.ws.value.workbench_state == 'empty' && size(vars.merged) == 0) || (vars.ws.value.workbench_state == 'folder' && size(vars.merged) == 1)
    then:
    - title: No-op for the current state
      source: src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:212-214
      return:
        entered_workspace: false
        folders: = vars.ws.value.folders
  - title: Stop the extension hosts before entering a multi-root workspace
    source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:179-182
    call: extension-service.stop-extension-hosts
    input:
      reason: Opening a multi-root workspace
      auto: false
    as: stopped
  - if: '!vars.stopped.value.stopped'
    then:
    - title: A participant vetoed stopping the extension hosts
      source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:180-182
      return:
        entered_workspace: false
        folders: = vars.ws.value.folders
  - title: Create and enter the untitled workspace with all folders
    source: src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:260-281
    call: workspace-context.set-folders
    input:
      folders: = vars.merged
      untitled_workspace: true
  - title: Restart the extension hosts in the new workspace
    source: src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:206-208
    call: extension-service.start-extension-hosts
  - return:
      entered_workspace: true
      folders: = vars.merged
