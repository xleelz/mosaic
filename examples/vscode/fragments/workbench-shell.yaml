      changed: true
- component: workspace-trust-management-service
  name: update-workspace-trust
  kind: function
  summary: 'updateWorkspaceTrust / calculateWorkspaceTrust: recompute trust (all workspace folders trusted; empty window uses security.workspace.trust.emptyWindow), and when it changed store it and fire
    onDidChangeTrust.'
  sources:
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:338-358
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:303-336
  request:
    type: object
