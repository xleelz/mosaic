- component: extension-management-service
  name: install-from-gallery
  kind: function
  summary: 'ExtensionManagementService.installFromGallery: fetch the manifest, ask for workspace trust when the extension does not support untrusted workspaces (Cancel throws CancellationError), then install
    on the extension management server through its ''extensions'' channel.'
  sources:
  - src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:512-546
  request:
    type: object
    required:
    - gallery
    properties:
      gallery:
        type: object
        properties:
          id:
            type: string
            examples:
            - ms-python.python
          publisher:
            type: string
          version:
            type: string
          signed:
            type: boolean
            default: true
          compatible:
            type: boolean
            default: true
          last_updated:
            type: integer
          main:
            type: string
          untrusted_workspaces_supported:
            type: boolean
      pinned:
        type: boolean
        default: false
  errors:
  - code: canceled
    status: 0
    retryable: false
  behavior:
  - title: Untrusted-workspace support from the manifest (true when trust is disabled or there is no main entry point, else the declared capability, else false)
    source: src/vs/workbench/services/extensions/common/extensionManifestPropertiesService.ts:314-347
    set:
      vars.supported: '= !config[''security-workspace-trust-enabled''] || !(has(input.gallery.main) && input.gallery.main != '''') ? true : (has(input.gallery.untrusted_workspaces_supported) ? input.gallery.untrusted_workspaces_supported
        : false)'
  - if: '!vars.supported'
    then:
    - title: The extension requires a trusted workspace, request trust
      source: src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:1008-1024
      call: workspace-trust-request-service.request-workspace-trust
      input:
        message: Enabling this extension requires a trusted workspace.
      as: trust
    - if: vars.trust.value.trusted == null
      then:
      - title: Trust request canceled
        source: src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:1021-1023
        fail:
          code: canceled
          message: Canceled
  - title: Install on the extension management server (the 'extensions' channel)
    source: src/vs/workbench/services/extensionManagement/common/extensionManagementService.ts:545
    call: extension-management-channel.install-from-gallery
    input:
      gallery: = input.gallery
      pinned: = input.pinned
    as: installed
  - return: = vars.installed.value
