    input:
      language_id: typescript
  sources:
  - src/vs/workbench/services/language/common/languageService.ts:287-291
  tags:
  - writes
scenarios:
- id: workbench-shell-open-editor-preview
  flow: workbench-shell-open-editor
  fixtures:
  - one-window-folder
  - workbench-shell-seed
  expect:
  - result.ok && result.value.opened && !result.value.pinned && result.value.is_new && result.value.group_id == 1
  - state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts'] && state['editor-groups@w1'].groups[0].preview == 'file:///work/app/src/main.ts'
- id: workbench-shell-open-editor-replaces-preview
  flow: workbench-shell-open-editor
  fixtures:
  - one-window-folder
  - workbench-shell-seed
  state:
    editor-groups@w1:
      groups:
      - id: 1
        editors:
        - file:///work/app/src/main.ts
        active: file:///work/app/src/main.ts
        preview: file:///work/app/src/main.ts
        sticky: []
        mru:
        - file:///work/app/src/main.ts
        locked: false
      active_group: 1
  input:
    resource: file:///work/app/src/util.ts
  expect:
  - state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/util.ts']
  - state['editor-groups@w1'].groups[0].preview == 'file:///work/app/src/util.ts' && state['editor-groups@w1'].groups[0].active == 'file:///work/app/src/util.ts'
- id: workbench-shell-open-editor-preview-disabled
  flow: workbench-shell-open-editor
  fixtures:
  - one-window-folder
  - workbench-shell-seed
  config:
    workbench-editor-enable-preview: false
  state:
    editor-groups@w1:
      groups:
      - id: 1
        editors:
        - file:///work/app/src/main.ts
        active: file:///work/app/src/main.ts
        preview: file:///work/app/src/main.ts
        sticky: []
        mru:
        - file:///work/app/src/main.ts
        locked: false
      active_group: 1
  input:
    resource: file:///work/app/src/util.ts
  expect:
  - result.value.pinned
  - state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts', 'file:///work/app/src/util.ts'] && state['editor-groups@w1'].groups[0].preview == 'file:///work/app/src/main.ts'
- id: workbench-shell-open-editor-pinned-after-active
  flow: workbench-shell-open-editor
  fixtures:
  - one-window-folder
  - workbench-shell-seed
  state:
    editor-groups@w1:
      groups:
      - id: 1
        editors:
        - file:///work/app/src/main.ts
        - file:///work/app/src/util.ts
        - file:///work/app/README.md
        active: file:///work/app/src/util.ts
        preview: null
        sticky: []
        mru:
        - file:///work/app/src/util.ts
        - file:///work/app/src/main.ts
        - file:///work/app/README.md
        locked: false
      active_group: 1
  input:
    resource: file:///work/app/package.json
    options:
      pinned: true
  expect:
  - state['editor-groups@w1'].groups[0].editors == ['file:///work/app/src/main.ts', 'file:///work/app/src/util.ts', 'file:///work/app/package.json', 'file:///work/app/README.md']
  - state['editor-groups@w1'].groups[0].mru[0] == 'file:///work/app/package.json'
