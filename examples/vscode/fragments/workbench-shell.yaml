- id: workbench-shell-language-detection-worker
  name: Language detection worker starts
  entry:
    caller: workbench-window
    interface: language-detection-web-worker.bootstrap
  sources:
  - src/vs/workbench/services/languageDetection/browser/languageDetectionWebWorkerMain.ts:9
- id: workbench-shell-textmate-worker
  name: TextMate tokenization worker starts
  entry:
    caller: workbench-window
    interface: text-mate-tokenization-worker.bootstrap
  sources:
  - src/vs/workbench/services/textMate/browser/backgroundTokenization/worker/textMateTokenizationWorker.workerMain.ts:9
- id: workbench-shell-command-palette-list
  name: Type in the command palette and list the matching commands
  entry:
    caller: user
    interface: commands-quick-access.get-picks
    input:
      filter: ''
  sources:
  - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:77-200
  tags:
  - feature:commands-and-keybindings
- id: workbench-shell-command-palette-run
  name: Accept a command palette pick and run it
  entry:
    caller: user
    interface: commands-quick-access.accept
    input:
      command_id: workbench.action.closeActiveEditor
      label: 'View: Close Editor'
  sources:
  - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:303-324
  tags:
  - writes
  - feature:commands-and-keybindings
- id: workbench-shell-resolve-variables
  name: Resolve ${...} variables in a launch or task configuration string
  entry:
    caller: user
    interface: configuration-resolver-service.resolve-async
    input:
      folder_uri: file:///work/app
      value: abc ${workspaceFolder} xyz
  sources:
  - src/vs/workbench/services/configurationResolver/common/variableResolver.ts:83-94
- id: workbench-shell-account-policy
  name: The default account's policy data changes and the account policy values are recomputed
  entry:
    caller: user
    interface: account-policy-service.on-did-change-policy-data
    input:
      signed_in: true
  sources:
  - src/vs/workbench/services/policies/common/accountPolicyService.ts:127-135
  tags:
  - writes
- id: workbench-shell-banner-show
  name: Show a banner item (e.g. the restricted-mode banner) in the banner part
  entry:
    caller: user
    interface: banner-part.show
    input:
      id: workbench.banner.restrictedMode
      message: Restricted Mode is intended for safe code browsing. Trust this folder to enable all features.
  sources:
  - src/vs/workbench/browser/parts/banner/bannerPart.ts:175-179
  tags:
  - writes
  - feature:workspace-trust
- id: workbench-shell-request-language-features
