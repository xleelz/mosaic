- component: editor-service
  name: open-editor
  kind: function
  summary: 'IEditorService.openEditor: resolve the editor through the resolver, find the target group (explicit id, SIDE_GROUP, an already-opened group when revealIfOpen, else the active group skipping
    locked groups) and open it there. The seam every area calls to open an editor.'
  sources:
  - src/vs/workbench/services/editor/browser/editorService.ts:540-599
  - src/vs/workbench/services/editor/common/editorGroupFinder.ts:101-232
  attributes:
    seam: true
    callers: all
  request: WorkbenchOpenEditorRequest
  response: WorkbenchOpenEditorResult
  errors:
  - code: invalid-editor-group-provided
    status: 0
    retryable: false
    summary: an explicit group id that does not exist (EditorPart.assertGroupView)
  behavior:
  - set:
      vars.o: '= has(input.options) ? input.options : {}'
      vars.pref: '= has(input.group) ? input.group : -1'
  - title: Resolve the untyped input to an editor
    source: src/vs/workbench/services/editor/browser/editorService.ts:549-563
    call: editor-resolver-service.resolve-editor
    input:
      resource: = input.resource
    as: resolved
  - call: modal-editor-part.get-group
    as: modal
  - set:
      vars.use_modal: = config['workbench-editor-use-modal']
      vars.requires_modal: = input.resource.split(':')[0] in vars.modal.value.requires_modal_schemes
  - if: vars.requires_modal && vars.use_modal != 'off'
    then:
    - title: An editor with the RequiresModal capability opens in the modal editor part (unless workbench.editor.useModal is off)
      source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:105-110
      call: editor-parts.create-modal-editor-part
      as: mp
    - call: editor-group-model.open-editor
      input:
        group: = vars.mp.value.group
        resource: = input.resource
        pinned: '= has(vars.o.pinned) ? vars.o.pinned : true'
        active: true
      as: mres
    - call: modal-editor-part.put-group
      input:
        group: = vars.mres.value.group
    - return:
        opened: true
        resource: = input.resource
        group_id: -4
        pinned: true
        is_new: = vars.mres.value.is_new
  - if: vars.modal.value.open && vars.use_modal != 'all' && !(has(vars.o.preserve_focus) && vars.o.preserve_focus)
    then:
    - title: A normal editor opened while the modal part is open goes to the main part and closes the modal part (unless preserveFocus)
      source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:58-72
      call: modal-editor-part.close
  - call: editor-groups.get-state
    as: st
  - set:
      vars.gs: = vars.st.value.groups
      vars.ag: = vars.st.value.active_group
      vars.mru: = vars.st.value.group_mru
  - set:
      vars.active_g: = vars.gs.filter(g, g.id == vars.ag)[0]
      vars.locked_for: = vars.gs.filter(g, g.locked && !(input.resource in g.editors)).map(g, g.id)
  - if: vars.pref >= 1
    then:
    - title: Explicit group identifier
      source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:119-121
      if: '!vars.gs.exists(g, g.id == vars.pref)'
      then:
      - fail:
          code: invalid-editor-group-provided
          message: Invalid editor group provided!
    - set:
        vars.target: = vars.pref
    else:
    - if: vars.pref == -2
      then:
      - title: SIDE_GROUP, use the group to the side or create one
        source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:124-135
        set:
          vars.ia: = lists.range(size(vars.gs)).filter(i, vars.gs[i].id == vars.ag)[0]
      - if: vars.ia + 1 < size(vars.gs) && !(vars.gs[vars.ia + 1].id in vars.locked_for)
        then:
        - set:
            vars.target: = vars.gs[vars.ia + 1].id
        else:
        - call: editor-part.add-group
          input:
            location_id: = vars.ag
            direction: right
          as: added
        - set:
            vars.target: = vars.added.value.group_id
      else:
      - set:
          vars.opened_in: = vars.mru.filter(id, vars.gs.exists(g, g.id == id && input.resource in g.editors))
      - if: ((has(vars.o.reveal_if_opened) && vars.o.reveal_if_opened) || config['workbench-editor-reveal-if-open']) && size(vars.opened_in) > 0
        then:
        - title: revealIfOpen, prefer a group where the editor is already opened
          source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:167-189
          set:
            vars.target: = vars.opened_in[0]
        else:
        - if: vars.ag in vars.locked_for
          then:
          - title: Active group is locked, take the most recent unlocked group or add one
            source: src/vs/workbench/services/editor/common/editorGroupFinder.ts:205-225
            set:
              vars.unlocked: = vars.mru.filter(id, !(id in vars.locked_for))
          - if: size(vars.unlocked) > 0
            then:
            - set:
                vars.target: = vars.unlocked[0]
            else:
            - call: editor-part.add-group
              input:
                location_id: = vars.ag
                direction: right
              as: added2
            - set:
                vars.target: = vars.added2.value.group_id
          else:
          - set:
              vars.target: = vars.ag
  - title: Open in the target group
    source: src/vs/workbench/services/editor/browser/editorService.ts:598
    call: editor-group-view.open-editor
    input:
      group_id: = vars.target
      resource: = input.resource
      options: = vars.o
    as: opened
  - return: = vars.opened.value
