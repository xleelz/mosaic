- component: workspace-trust-management-service
  name: get-uri-trust-info
  kind: function
  summary: 'getUriTrustInfo / doGetUriTrustInfo: a URI is trusted when it equals or lies under a trusted URI (the longest match wins); everything is trusted when the feature is disabled.'
  sources:
