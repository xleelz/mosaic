- component: editor-service
  name: save
  kind: function
  summary: 'IEditorService.save: a normal save pins the editor on an explicit save and saves it through the text file service with the full save options; Save As runs sequentially: open the editor pinned,
    save it under a new resource (the target picker), then replace the editor with the saved one in its group. success only when the save produced a result.'
  sources:
  - src/vs/workbench/services/editor/browser/editorService.ts:968-1048
  request:
    type: object
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      reason:
        type: string
        default: explicit
      save_as:
        type: boolean
        default: false
      force:
        type: boolean
        default: false
      skip_save_participants:
        type: boolean
        default: false
  response:
    type: object
    properties:
      success:
        type: boolean
      resource:
        type: string
  behavior:
  - set:
      vars.opts: '= {''reason'': input.reason, ''force'': input.force, ''skip_save_participants'': input.skip_save_participants}'
  - call: editor-groups.get-state
    as: st
  - set:
      vars.in_groups: = vars.st.value.groups.filter(g, input.resource in g.editors).map(g, g.id)
  - if: input.save_as
    then:
    - title: Save As is sequential; open the editor pinned first so the user can review it
      source: src/vs/workbench/services/editor/browser/editorService.ts:1013-1022
      call: editor-service.open-editor
      input:
        resource: = input.resource
        options:
          pinned: true
      as: opened
    - title: Save under a new resource (the save dialog picks the target)
      source: src/vs/workbench/services/editor/browser/editorService.ts:1024
      call: text-file-service.save-as
      input:
        source: = input.resource
        target: null
        options: = vars.opts
      as: sa
      on_error: continue
    - if: '!vars.sa.ok || !has(vars.sa.value.resource) || vars.sa.value.resource == '''' || (has(vars.sa.value.saved) && !vars.sa.value.saved)'
      then:
      - title: Failed or canceled, abort
        source: src/vs/workbench/services/editor/browser/editorService.ts:1027-1029
        return:
          success: false
    - if: vars.sa.value.resource != input.resource
      then:
      - title: Replace the editor with the saved one, preserving its place
        source: src/vs/workbench/services/editor/browser/editorService.ts:1031-1043
        call: editor-group-view.replace-editor
        input:
          group_id: = vars.opened.value.group_id
          editor: = input.resource
          replacement: = vars.sa.value.resource
    - return:
        success: true
        resource: = vars.sa.value.resource
  - if: input.reason == 'explicit'
    then:
    - title: Use save as a hint to pin the editor
      source: src/vs/workbench/services/editor/browser/editorService.ts:1002-1005
      foreach: = vars.in_groups
      as: gid
      steps:
      - call: editor-group-view.set-editor-state
        input:
          group_id: = vars.gid
          resource: = input.resource
          op: pin
  - title: Save with the given options (reason, force, skip save participants)
    source: src/vs/workbench/services/editor/browser/editorService.ts:1007-1008
    call: text-file-service.save
    input:
      resource: = input.resource
      options: = vars.opts
    as: s
    on_error: continue
  - return:
      success: = vars.s.ok && !(has(vars.s.value.saved) && !vars.s.value.saved)
      resource: = input.resource
