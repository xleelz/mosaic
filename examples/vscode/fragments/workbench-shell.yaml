- component: editor-commands
  name: navigate-editor
  kind: function
  summary: 'AbstractNavigateEditorAction: open the next/previous/first/last editor; nextEditor/previousEditor continue into the next (previous) group that has editors, wrapping around; the InGroup variants
    wrap inside the group.'
  sources:
  - src/vs/workbench/browser/parts/editor/editorActions.ts:1243-1262
  - src/vs/workbench/browser/parts/editor/editorActions.ts:1287-1313
  request:
    type: object
    required:
    - scope
    properties:
      scope:
        type: string
        enum:
        - next
        - previous
        - first
        - last
      in_group:
        type: boolean
  behavior:
  - call: editor-groups.get-state
    as: st
  - set:
      vars.gs: = vars.st.value.groups
      vars.g: = vars.st.value.groups.filter(g, g.id == vars.st.value.active_group)[0]
  - if: size(vars.g.editors) == 0
    then:
    - return:
        opened: false
  - set:
      vars.i: '= vars.g.active == null ? -1 : lists.range(size(vars.g.editors)).filter(i, vars.g.editors[i] == vars.g.active)[0]'
      vars.gi: = lists.range(size(vars.gs)).filter(i, vars.gs[i].id == vars.g.id)[0]
      vars.ing: = has(input.in_group) && input.in_group
  - set:
      vars.next_g: = (lists.range(size(vars.gs) - 1).map(k, vars.gs[(vars.gi + k + 1) % size(vars.gs)]).filter(g, size(g.editors) > 0) + [vars.g])[0]
      vars.prev_g: = (lists.range(size(vars.gs) - 1).map(k, vars.gs[(vars.gi - k - 1 + size(vars.gs)) % size(vars.gs)]).filter(g, size(g.editors) > 0) + [vars.g])[0]
  - set:
      vars.pick: '= input.scope == ''first'' ? [vars.g.id, vars.g.editors[0]] : (input.scope == ''last'' ? [vars.g.id, vars.g.editors[size(vars.g.editors) - 1]] : (input.scope == ''next'' ? (vars.i + 1
        < size(vars.g.editors) ? [vars.g.id, vars.g.editors[vars.i + 1]] : (vars.ing ? [vars.g.id, vars.g.editors[0]] : [vars.next_g.id, vars.next_g.editors[0]])) : (vars.i > 0 ? [vars.g.id, vars.g.editors[vars.i
        - 1]] : (vars.ing ? [vars.g.id, vars.g.editors[size(vars.g.editors) - 1]] : [vars.prev_g.id, vars.prev_g.editors[size(vars.prev_g.editors) - 1]]))))'
  - title: Open the navigated editor in its group
    source: src/vs/workbench/browser/parts/editor/editorActions.ts:1257-1260
    call: editor-group-view.open-editor
    input:
      group_id: = vars.pick[0]
      resource: = vars.pick[1]
  - return:
      opened: true
      group_id: = vars.pick[0]
      resource: = vars.pick[1]
