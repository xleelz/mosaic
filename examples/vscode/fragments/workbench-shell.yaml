  name: notify
  kind: function
  summary: 'NotificationService.notify / info / warn / error: add the notification at the top of the model, closing a duplicate; with do-not-disturb on, non-error notifications are silent (no toast).'
  sources:
  - src/vs/workbench/services/notification/common/notificationService.ts:193-230
