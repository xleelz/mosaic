- component: commands-quick-access
  name: get-picks
  kind: function
  summary: '_getPicks over getGlobalCommandPicks: CommandPalette menu items whose when clause matches the context (eval over the context key values), filtered by label or exact command id, recently used
    commands first (newest first), the rest in menu order.'
  sources:
  - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:77-200
  - src/vs/workbench/contrib/quickaccess/browser/commandsQuickAccess.ts:226-262
  request:
    type: object
    properties:
      filter:
        type: string
        default: ''
        examples:
        - pin
  response:
    type: object
    properties:
      picks:
        type: array
  behavior:
  - set:
      vars.filter: '= has(input.filter) ? input.filter : ""'
  - title: The context keys the menu items' when clauses read
    source: src/vs/platform/actions/common/menuService.ts:301-315
    set:
      vars.keys: = replace(replace(replace(state.items.filter(k, has(k.when)).map(k, k.when).join(" "), "'[^']*'", " "), "(==|!=)\\s*[A-Za-z0-9_.:/-]+", " "), "[^A-Za-z0-9_.:-]+", " ").trim().split(" ").filter(x,
        x != "" && x != "true" && x != "false")
      vars.ctx: {}
  - title: Read each key from the context key service
    source: src/vs/platform/actions/common/menuService.ts:181
    foreach: = vars.keys
    as: key
    steps:
    - if: '!(vars.key in vars.ctx)'
      then:
      - call: context-key-service.get-context-key-value
        input:
          key: = vars.key
        as: kv
      - set:
          vars.ctx: '= merge(vars.ctx, {vars.key: vars.kv.value.value})'
  - title: Each when clause becomes a CEL rule (bare key truthy, key == value, &&, ||, !)
    source: src/vs/platform/contextkey/common/contextkey.ts:1652-1659
    set:
      vars.rules: '= state.items.map(k, !has(k.when) ? "true" : replace(replace(replace(replace(k.when, "([A-Za-z_][A-Za-z0-9_.:-]*)\\s*(==|!=)\\s*''?([A-Za-z0-9_.:/-]+)''?", "#$1#$2@$3@"), "(^|[^@#A-Za-z0-9_.:-])([A-Za-z_][A-Za-z0-9_.:-]*)",
        "$1%$2%"), "%([^%]+)%", "!(c[\"$1\"] in [null, false, \"\", 0])"), "#([^#]+)#(==|!=)@([^@]*)@", "(c[\"$1\"] $2 \"$3\")"))'
  - title: menuService.getMenuActions(CommandPalette) keeps the items whose when clause holds
    source: src/vs/platform/actions/common/menuService.ts:326
    set:
      vars.visible: '= lists.range(size(state.items)).filter(i, eval(vars.rules[i], {"c": vars.ctx})).map(i, state.items[i])'
  - title: Keep picks whose label matches the filter, or whose command id equals it
    source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:99-121
    set:
      vars.picks: = vars.visible.filter(p, vars.filter == "" || p.label.lowerAscii().contains(vars.filter.lowerAscii()) || p.command_id == vars.filter)
  - set:
      vars.recent: = vars.picks.filter(p, p.command_id in state.history)
      vars.rest: = vars.picks.filter(p, !(p.command_id in state.history))
  - title: Sort by MRU order (the higher history counter first), the rest after
    source: src/vs/platform/quickinput/browser/commandsQuickAccess.ts:152-183
    set:
      vars.sorted: = lists.range(size(vars.recent)).map(r, vars.recent.filter(p, size(vars.recent.filter(q, state.history[q.command_id] > state.history[p.command_id])) == r)[0]) + vars.rest
  - return:
      picks: '= vars.sorted.map(p, {"command_id": p.command_id, "label": p.label, "recently_used": p.command_id in state.history})'
- component: commands-quick-access
  name: accept
  kind: function
  summary: 'A pick''s accept: push the command into the commands history, then await ICommandService.executeCommand; an error other than cancellation shows an error dialog.'
  sources:
  - src/vs/platform/quickinput/browser/commandsQuickAccess.ts:303-324
  request:
    type: object
    required:
    - command_id
    properties:
      command_id:
        type: string
        examples:
