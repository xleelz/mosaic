      vars.ng: '= {''id'': vars.g.id, ''editors'': vars.editors, ''active'': vars.active ? input.resource : vars.g.active, ''preview'': vars.pinned ? ((vars.g.preview != null && vars.g.preview in vars.editors)
        ? vars.g.preview : null) : input.resource, ''sticky'': vars.sticky ? vars.g.sticky + [input.resource] : vars.g.sticky, ''mru'': vars.active ? [input.resource] + vars.mru0 : vars.mru0 + [input.resource],
