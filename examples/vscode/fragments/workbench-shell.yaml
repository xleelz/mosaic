- component: banner-part
  name: show
  kind: function
  summary: 'BannerPart.show: (re)insert the item by id, then render the active item (the last one with the highest priority) and make the banner part visible.'
  sources:
  - src/vs/workbench/browser/parts/banner/bannerPart.ts:175-205
  request:
    type: object
    required:
    - id
    - message
    properties:
      id:
        type: string
        examples:
        - workbench.banner.restrictedMode
      message:
        type: string
        examples:
        - Restricted Mode is intended for safe code browsing. Trust this folder to enable all features.
      priority:
        type: integer
        default: 0
      actions:
        type: array
        default: []
  behavior:
  - set:
      vars.item: '= {"id": input.id, "message": input.message, "priority": has(input.priority) ? input.priority : 0, "actions": has(input.actions) ? input.actions : []}'
  - title: items.delete(id) then items.set(id, item), so a re-shown item moves to the end
    source: src/vs/workbench/browser/parts/banner/bannerPart.ts:175-179
    set:
      state.items: = state.items.filter(i, i.id != input.id) + [vars.item]
  - call: banner-part.render-active-item
    as: r
  - return: = vars.r.value
- component: banner-part
  name: hide
  kind: function
  summary: 'BannerPart.hide: drop the item by id and render the next active item; the part hides when none is left.'
  sources:
  - src/vs/workbench/browser/parts/banner/bannerPart.ts:170-173
  request:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        examples:
        - workbench.banner.restrictedMode
  behavior:
  - set:
      state.items: = state.items.filter(i, i.id != input.id)
  - call: banner-part.render-active-item
    as: r
  - return: = vars.r.value
- component: banner-part
  name: render-active-item
  kind: function
  summary: 'renderActiveItem: the active item is the last one whose priority is at least every other''s; none hides the part (setVisibility(false)), one shows it.'
  sources:
  - src/vs/workbench/browser/parts/banner/bannerPart.ts:181-250
  behavior:
  - set:
      vars.top: = state.items.filter(c, state.items.all(o, c.priority >= o.priority))
  - if: size(vars.top) == 0
    then:
    - title: No item left, hide the banner part
      source: src/vs/workbench/browser/parts/banner/bannerPart.ts:198-203
      set:
        state.active: null
        state.visible: false
    - return:
        visible: false
        active: null
  - title: Render the item and show the banner part
    source: src/vs/workbench/browser/parts/banner/bannerPart.ts:204-250
    set:
      state.active: = vars.top[size(vars.top) - 1].id
      state.visible: true
  - return:
      visible: true
      active: = state.active
- component: banner-part
  name: get-state
  kind: function
  summary: The banner part's items, active item and visibility (the read path for show and hide).
