configs:
- id: security-workspace-trust-enabled
  type: boolean
  value: true
  default: true
  summary: security.workspace.trust.enabled; registered default true, product.json sets no override, so deployed = default. Read by WorkspaceTrustEnablementService.isWorkspaceTrustEnabled.
  sources:
  - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:799-805
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:82-88
  attributes:
    key: security.workspace.trust.enabled
    owner: workbench-shell
- id: workbench-editor-enable-preview
  type: boolean
  value: true
  default: true
  summary: workbench.editor.enablePreview; deployed = default (no product.json override). When false every opened editor is pinned.
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:331-335
  - src/vs/workbench/browser/parts/editor/editor.ts:56
  attributes:
    key: workbench.editor.enablePreview
- id: workbench-editor-open-positioning
  type: string
  value: right
  default: right
  summary: workbench.editor.openPositioning (left|right|first|last); deployed = default.
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:351-356
  - src/vs/workbench/common/editor/editorGroupModel.ts:245
  attributes:
    key: workbench.editor.openPositioning
- id: workbench-editor-focus-recent-editor-after-close
  type: boolean
  value: true
  default: true
  summary: workbench.editor.focusRecentEditorAfterClose; true picks the MRU editor after closing the active one, false the right (or left) neighbour.
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:321-325
  - src/vs/workbench/common/editor/editorGroupModel.ts:246
  attributes:
    key: workbench.editor.focusRecentEditorAfterClose
- id: workbench-editor-close-empty-groups
  type: boolean
  value: true
  default: true
  summary: workbench.editor.closeEmptyGroups; when the last editor of a group closes, the group is removed (unless it is the only group).
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:363-368
  - src/vs/workbench/browser/parts/editor/editorGroupView.ts:1617
  attributes:
    key: workbench.editor.closeEmptyGroups
- id: workbench-editor-reveal-if-open
  type: boolean
  value: false
  default: false
  summary: workbench.editor.revealIfOpen; when true an editor already opened in another group is revealed there instead of opening in the active group.
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:369-373
  - src/vs/workbench/services/editor/common/editorGroupFinder.ts:168
  attributes:
    key: workbench.editor.revealIfOpen
- id: security-workspace-trust-empty-window
  type: boolean
  value: true
  default: true
  summary: security.workspace.trust.emptyWindow (registered in contrib/workspace)
  sources:
  - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:845-850
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:333
  attributes:
    boundary: true
    owner: workbench-contribs
    key: security.workspace.trust.emptyWindow
- id: security-workspace-trust-untrusted-files
  type: string
  value: prompt
  default: prompt
  summary: security.workspace.trust.untrustedFiles (prompt|open|newWindow)
  sources:
  - src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:832-838
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:730-732
  attributes:
    boundary: true
    owner: workbench-contribs
    key: security.workspace.trust.untrustedFiles
- id: window-confirm-save-untitled-workspace
  type: boolean
  value: true
  default: true
  summary: window.confirmSaveUntitledWorkspace (registered in workbench/electron-browser)
  sources:
  - src/vs/workbench/electron-browser/desktop.contribution.ts:166-170
  - src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:93
  attributes:
    boundary: true
    owner: main-process
    key: window.confirmSaveUntitledWorkspace
- id: workbench-editor-use-modal
  type: string
  value: some
  default: some
  summary: 'workbench.editor.useModal: off never opens editors modal (wins over RequiresModal), some opens only editors that require it, all opens every editor modal.'
  sources:
  - src/vs/workbench/browser/workbench.contribution.ts:374-388
  - src/vs/workbench/services/editor/common/editorService.ts:46-55
  attributes:
    key: workbench.editor.useModal
schemas:
- id: WorkbenchOpenEditorRequest
  summary: 'IEditorService.openEditor(untyped resource input, preferred group). group: a GroupIdentifier >= 1, or ACTIVE_GROUP -1 / SIDE_GROUP -2.'
  schema:
    type: object
    required:
    - resource
    properties:
      resource:
        type: string
        examples:
        - file:///work/app/src/main.ts
      group:
        type: integer
        default: -1
      options:
        type: object
        properties:
          pinned:
            type: boolean
          sticky:
            type: boolean
          inactive:
            type: boolean
          preserve_focus:
            type: boolean
          reveal_if_opened:
            type: boolean
          index:
            type: integer
        default: {}
- id: WorkbenchOpenEditorResult
  summary: The opened editor pane, reduced to where the editor landed. opened=false when the open was skipped (IEditorPane undefined).
  schema:
    type: object
    required:
    - opened
    properties:
      opened:
        type: boolean
      resource:
        type: string
      group_id:
        type: integer
      pinned:
        type: boolean
      is_new:
        type: boolean
- id: WorkbenchEditorGroup
  summary: 'One editor group as the editor-groups anchor stores it (EditorGroupModel state): editors in tab order, the active and the preview editor, sticky editors, MRU order and the lock.'
  schema:
    type: object
    required:
    - id
    - editors
    properties:
      id:
        type: integer
      editors:
        type: array
        items:
          type: string
      active:
        type:
        - string
        - 'null'
      preview:
        type:
        - string
        - 'null'
      sticky:
        type: array
        items:
          type: string
      mru:
        type: array
        items:
          type: string
      locked:
        type: boolean
- id: WorkbenchShutdownRequest
  summary: 'The vscode:onBeforeUnload / vscode:onWillUnload payload: the ShutdownReason in kebab-case.'
  schema:
    type: object
    required:
    - reason
    properties:
      reason:
        type: string
        enum:
        - close
        - quit
        - reload
        - load
        examples:
        - close
      window_id:
        type: string
        examples:
        - w1
components:
- id: editor-service
  name: EditorService
  kind: service
  layer: workbench
  parent: workbench
  summary: 'IEditorService: opens, closes, saves and reverts editors across all editor groups of a window; resolves the target group and editor.'
  sources:
  - src/vs/workbench/services/editor/common/editorService.ts:17
  - src/vs/workbench/services/editor/browser/editorService.ts:1135
  - src/vs/workbench/services/editor/browser/editorService.ts:540-599
- id: editor-resolver-service
  name: EditorResolverService
  kind: service
  layer: workbench
  parent: workbench
  summary: 'IEditorResolverService: maps an untyped resource input to an editor (the default text editor unless an association or override picks another).'
  sources:
  - src/vs/workbench/services/editor/common/editorResolverService.ts:25
  - src/vs/workbench/services/editor/browser/editorResolverService.ts:1026
  - src/vs/workbench/services/editor/browser/editorResolverService.ts:129-230
- id: editor-parts
  name: EditorParts
  kind: service
  layer: workbench
  parent: workbench
  summary: 'IEditorGroupsService: the main editor part plus auxiliary and modal parts; forwards group operations to the active part.'
  sources:
  - src/vs/workbench/services/editor/common/editorGroupsService.ts:21
  - src/vs/workbench/browser/parts/editor/editorParts.ts:1042
- id: editor-part
  name: EditorPart
  kind: module
  layer: workbench
  parent: editor-parts
  summary: 'The grid of editor groups: add, remove, merge, find and activate groups, apply layouts. Group state lives in the editor-groups anchor (groups kept in grid appearance order).'
  sources:
  - src/vs/workbench/browser/parts/editor/editorPart.ts:619-660
  - src/vs/workbench/browser/parts/editor/editorPart.ts:822-884
  - src/vs/workbench/browser/parts/editor/editorPart.ts:942-1010
- id: editor-group-view
  name: EditorGroupView
  kind: module
  layer: workbench
  parent: editor-part
  summary: 'One editor group: decides pinned/preview on open, runs the close confirmation for dirty editors (save / don''t save / cancel) and closes editors, removing the group when it becomes empty.'
  sources:
  - src/vs/workbench/browser/parts/editor/editorGroupView.ts:1190-1260
  - src/vs/workbench/browser/parts/editor/editorGroupView.ts:1558-1600
  - src/vs/workbench/browser/parts/editor/editorGroupView.ts:1738-1883
- id: editor-group-model
  name: EditorGroupModel
  kind: function
  layer: workbench
  parent: editor-group-view
  summary: 'The pure list logic of a group: insert position (openPositioning), the single preview editor, sticky editors and the next active editor on close (MRU or neighbour).'
  sources:
  - src/vs/workbench/common/editor/editorGroupModel.ts:290-420
  - src/vs/workbench/common/editor/editorGroupModel.ts:511-587
- id: history-service
  name: HistoryService
  kind: service
  layer: workbench
  parent: workbench
  summary: 'IHistoryService: recently closed editors (reopen, batched per close operation, bounded to 20) and the editor history (clear).'
  sources:
  - src/vs/workbench/services/history/common/history.ts:12
  - src/vs/workbench/services/history/browser/historyService.ts:1272
  - src/vs/workbench/services/history/browser/historyService.ts:663-716
  state:
    initial:
      recently_closed: []
      history: []
      batch_id: 0
      last_batch_key: -1
- id: file-dialog-service
  name: FileDialogService
  kind: service
  layer: workbench
  parent: workbench
  summary: 'IFileDialogService: the save confirmation (Save / Don''t Save / Cancel) shown when a dirty editor closes.'
  sources:
  - src/vs/platform/dialogs/common/dialogs.ts:536
  - src/vs/workbench/services/dialogs/browser/fileDialogService.ts:295
- id: lifecycle-service
  name: NativeLifecycleService
  kind: service
  layer: workbench
  parent: workbench
  summary: 'ILifecycleService (desktop: NativeLifecycleService, web: BrowserLifecycleService): lifecycle phases, and the shutdown handshake with the main process (onBeforeShutdown with vetos and a final
    veto, onWillShutdown with joiners, onDidShutdown).'
  sources:
  - src/vs/workbench/services/lifecycle/common/lifecycle.ts:10
  - src/vs/workbench/services/lifecycle/electron-browser/lifecycleService.ts:210
  - src/vs/workbench/services/lifecycle/browser/lifecycleService.ts:222
  - src/vs/workbench/services/lifecycle/common/lifecycleService.ts:14-131
  state:
    initial:
      phase: 4
      vetoes: []
      will_shutdown: false
      shutdown_reason: null
      veto_count: 0
- id: native-workspace-editing-service
  name: NativeWorkspaceEditingService
  kind: service
  layer: workbench
  parent: workbench
  summary: 'IWorkspaceEditingService (desktop): add/remove workspace folders (entering an untitled multi-root workspace from a single folder) and the before-shutdown prompt to save an untitled workspace.'
  sources:
  - src/vs/workbench/services/workspaces/common/workspaceEditing.ts:12
  - src/vs/workbench/services/workspaces/electron-browser/workspaceEditingService.ts:214
  - src/vs/workbench/services/workspaces/browser/abstractWorkspaceEditingService.ts:186-258
- id: workspace-trust-management-service
  name: WorkspaceTrustManagementService
  kind: service
  layer: workbench
  parent: workspace-context
  summary: 'IWorkspaceTrustManagementService (one owner for all areas): computes workspace trust from the trusted-URI list persisted in application storage, sets trust for URIs and the workspace, and fires
    onDidChangeTrust.'
  sources:
  - src/vs/platform/workspace/common/workspaceTrust.ts:39
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:91-150
  - src/vs/workbench/electron-browser/desktop.main.ts:341-342
  state:
    initial:
      uri_trust_info: []
      accepts_out_of_workspace_files: false
- id: workspace-trust-enablement-service
  name: WorkspaceTrustEnablementService
  kind: function
  layer: workbench
  parent: workspace-context
  summary: 'IWorkspaceTrustEnablementService: trust is enabled unless disabled on the command line or by security.workspace.trust.enabled.'
  sources:
  - src/vs/platform/workspace/common/workspaceTrust.ts:31
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:71-89
- id: workspace-trust-request-service
  name: WorkspaceTrustRequestService
  kind: service
  layer: workbench
  parent: workspace-context
  summary: 'IWorkspaceTrustRequestService: modal workspace trust requests (one pending at a time), open-files trust requests governed by security.workspace.trust.untrustedFiles, and the startup request.'
  sources:
  - src/vs/platform/workspace/common/workspaceTrust.ts:78
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:984
  - src/vs/workbench/services/workspaces/common/workspaceTrust.ts:697-922
  state:
    initial:
      pending_workspace_request: false
      pending_open_files_request: false
- id: keybinding-service
  name: WorkbenchKeybindingService
  kind: service
  layer: workbench
  parent: workbench
