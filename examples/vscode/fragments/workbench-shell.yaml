- component: keybinding-service
  name: dispatch
  kind: function
  summary: 'Keydown dispatch: resolve the pressed chord (after any pending chords) against the keybinding table, last matching when clause wins; enter multi-chord mode when more chords are needed (status
    message, left after 5 s); report a key combination that is not a command; otherwise run the command through ICommandService (not awaited in the code), warning on failure.'
  sources:
  - src/vs/workbench/services/keybinding/browser/keybindingService.ts:278-292
  - src/vs/platform/keybinding/common/abstractKeybindingService.ts:306-404
  - src/vs/platform/keybinding/common/keybindingResolver.ts:320-392
  request:
    type: object
    required:
    - keypress
    properties:
      keypress:
        type: string
        examples:
        - ctrl+w
      context:
        type: object
        default: {}
  response:
    type: object
    properties:
      kind:
        type: string
        enum:
        - no-matching-kb
        - more-chords-needed
        - kb-found
      command_id:
        type: string
      prevent_default:
        type: boolean
  behavior:
  - if: size(state.current_chords) > 0 && now - state.chord_at > 5000
    then:
    - title: More than 5 s since the last chord, chord mode was left
      source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:175-191
      set:
        state.current_chords: []
  - set:
      vars.chords: = state.current_chords + [input.keypress]
  - set:
      vars.cands: = state.keybindings.filter(k, size(k.chords) >= size(vars.chords) && lists.range(size(vars.chords)).all(i, k.chords[i] == vars.chords[i]))
  - title: The context keys the candidates' when clauses read (comparison values and string literals are not keys)
    source: src/vs/platform/keybinding/common/keybindingResolver.ts:392-397
    set:
      vars.keys: = replace(replace(replace(vars.cands.filter(k, has(k.when)).map(k, k.when).join(" "), "'[^']*'", " "), "(==|!=)\\s*[A-Za-z0-9_.:/-]+", " "), "[^A-Za-z0-9_.:-]+", " ").trim().split(" ").filter(x,
        x != "" && x != "true" && x != "false")
      vars.ctx: {}
  - title: contextKeyService.getContext(target), read key by key as ContextKeyExpression.evaluate does
    source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:334
    foreach: = vars.keys
    as: key
    steps:
    - if: '!(vars.key in vars.ctx)'
      then:
      - call: context-key-service.get-context-key-value
        input:
          key: = vars.key
        as: kv
      - set:
          vars.ctx: '= merge(vars.ctx, {vars.key: vars.kv.value.value})'
  - title: The focused target's scoped context keys (input.context) overlay the root context
    source: src/vs/platform/contextkey/browser/contextKeyService.ts:598-615
    set:
      vars.ctx: '= has(input.context) ? merge(vars.ctx, input.context) : vars.ctx'
  - title: Each when clause becomes a CEL rule (a bare key is truthy, key == value compares, &&, || and ! keep their meaning)
    source: src/vs/platform/contextkey/common/contextkey.ts:805-807
    set:
      vars.rules: '= vars.cands.map(k, !has(k.when) ? "true" : replace(replace(replace(replace(k.when, "([A-Za-z_][A-Za-z0-9_.:-]*)\\s*(==|!=)\\s*''?([A-Za-z0-9_.:/-]+)''?", "#$1#$2@$3@"), "(^|[^@#A-Za-z0-9_.:-])([A-Za-z_][A-Za-z0-9_.:-]*)",
        "$1%$2%"), "%([^%]+)%", "!(c[\"$1\"] in [null, false, \"\", 0])"), "#([^#]+)#(==|!=)@([^@]*)@", "(c[\"$1\"] $2 \"$3\")"))'
  - title: _findCommand walks the candidates from last to first and keeps those whose when clause evaluates true (eval against the context)
    source: src/vs/platform/keybinding/common/keybindingResolver.ts:380-390
    set:
      vars.match: '= lists.range(size(vars.cands)).filter(i, eval(vars.rules[i], {"c": vars.ctx})).map(i, vars.cands[i])'
  - if: size(vars.match) == 0
    then:
    - if: size(state.current_chords) > 0
      then:
      - title: In chord mode, the combination is not a command
        source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:344-352
        call: notification-service.status
        input:
          message: = 'The key combination (' + vars.chords.join(', ') + ') is not a command.'
          hide_after_ms: 10000
      - set:
          state.current_chords: []
      - return:
          kind: no-matching-kb
          prevent_default: true
    - return:
        kind: no-matching-kb
        prevent_default: false
  - set:
      vars.kb: = vars.match[size(vars.match) - 1]
  - if: size(vars.chords) < size(vars.kb.chords)
    then:
    - title: More chords needed, enter multi-chord mode
      source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:357-365
      set:
        state.current_chords: = vars.chords
        state.chord_at: = now
    - call: notification-service.status
      input:
        message: = '(' + vars.chords.join(', ') + ') was pressed. Waiting for second key of chord...'
    - return:
        kind: more-chords-needed
        prevent_default: true
  - title: Keybinding found, leave chord mode and invoke the command
    source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:367-398
    set:
      state.current_chords: []
      state.last_command: = vars.kb.command
  - title: KbFound runs the command through ICommandService.executeCommand (args only when the keybinding has them); a rejection becomes a warning
    source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:384-391
    call: command-service.execute-command
    input:
      command_id: = vars.kb.command
      args: '= has(vars.kb.args) ? [vars.kb.args] : []'
    on_error:
    - title: A failing command shows a warning
      source: src/vs/platform/keybinding/common/abstractKeybindingService.ts:388-390
      call: notification-service.notify
      input:
        severity: warning
        message: = error.message
  - return:
      kind: kb-found
      command_id: = vars.kb.command
      prevent_default: true
