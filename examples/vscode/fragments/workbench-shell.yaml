- component: workbench-contributions-registry
  name: start
  kind: function
  summary: 'WorkbenchContributionsRegistry.start: instantiate the contributions of phases already reached (Starting, Ready) synchronously; later phases wait for lifecycleService.when(phase). A contribution
    that throws is logged and skipped.'
  sources:
  - src/vs/workbench/common/contributions.ts:246-262
  - src/vs/workbench/common/contributions.ts:283-312
  behavior:
  - title: BlockStartup contributions
    source: src/vs/workbench/common/contributions.ts:300-312
    foreach: = [1]
    as: ph
    steps:
    - call: navigable-container-manager.create
      on_error: continue
    - call: dialog-handler-contribution.create
      on_error: continue
    - call: default-account-provider-contribution.create
      on_error: continue
    - call: extension-gallery-account-provider-contribution.create
      on_error: continue
  - title: BlockRestore contributions
    source: src/vs/workbench/common/contributions.ts:300-312
    foreach: = [2]
    as: ph
    steps:
    - call: text-input-actions-provider.create
      on_error: continue
    - call: editor-auto-save.create
      on_error: continue
    - call: editor-status-contribution.create
      on_error: continue
    - call: untitled-text-editor-working-copy-editor-handler.create
      on_error: continue
    - call: dynamic-editor-configurations.create
      on_error: continue
    - call: linux-accessibility-contribution.create
      on_error: continue
    - call: agent-host-prewarm-contribution.create
      on_error: continue
    - call: configuration-default-overrides-contribution.create
      on_error: continue
    - call: browser-remote-connection-failure-notification-contribution.create
      on_error: continue
    - call: remote-connection-failure-notification-contribution.create
      on_error: continue
    - call: text-mate-tokenization-instantiator.create
      on_error: continue
  - set:
      state.created: = state.created + [1, 2]
  - return:
      phases:
      - 1
      - 2
- component: workbench-contributions-registry
  name: instantiate-phase
  kind: function
  summary: 'doInstantiateByPhase for Restored and Eventually: create the contributions when idle (Eventually only after the Restored ones finished).'
  sources:
  - src/vs/workbench/common/contributions.ts:296-366
  request:
    type: object
    required:
    - phase
    properties:
      phase:
        type: integer
        enum:
        - 3
        - 4
  behavior:
  - if: input.phase == 3
    then:
    - title: AfterRestored contributions, when idle
      source: src/vs/workbench/common/contributions.ts:318-333
      foreach: = [3]
      as: ph
      steps:
      - call: dynamic-workbench-security-configuration.create
        on_error: continue
      - call: register-configuration-schemas-contribution.create
        on_error: continue
      - call: extension-bisect-ui.create
        on_error: continue
      - call: resource-label-formatters-handler.create
        on_error: continue
      - call: account-policy-gate-contribution.create
        on_error: continue
      - call: managed-settings-update-contribution.create
        on_error: continue
      - call: policy-telemetry-contribution.create
        on_error: continue
      - call: initialize-other-resources-contribution.create
        on_error: continue
    else:
    - title: Eventually contributions, when idle
      source: src/vs/workbench/common/contributions.ts:327-329
      foreach: = [4]
      as: ph
      steps:
      - call: configuration-migration-workbench-contribution.create
        on_error: continue
      - call: dynamic-window-configuration.create
        on_error: continue
  - set:
      state.created: = state.created + [input.phase]
  - return:
      phase: = input.phase
