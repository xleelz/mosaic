schema_version: 1
id: vscode
scenarios:
  # A1 verified: workbench.action.chat.submit -> ChatWidget.acceptInput -> ChatService.sendRequest
  # (chatServiceImpl.ts:1540-1670) -> _sendRequestAsync: activateByEvent onChatParticipant:<id> (2138)
  # -> ChatAgentService.invokeAgent (2182) -> MainThreadChatAgents2 -> ExtHostChatAgents2.$invokeAgent;
  # progress chunks stream back ($handleProgressChunk, mainThreadChatAgents2.ts:481) into
  # model.acceptResponseProgress (chatServiceImpl.ts:1862-1883).
  # Routing: agent = detected ?? @-mentioned (ChatRequestAgentPart) ?? default (2135, 1652);
  # default for the widget's mode, which defaults to Agent (chatInputPart.ts:1205).
  - id: bench-a1-default-participant
    name: A1 plain request goes to the default participant on eh1 and the response is recorded
    flow: chat-submit
    fixtures: [full-window]
    input: {input_value: 'Explain what src/main.ts does'}
    expect:
      - result.ok && result.value.accepted && result.value.kind == 'sent'
      - calls_by_instance['chat-service.send-request@w1'] == 1
      - calls_by_instance['chat-service.run-request@w1'] == 1
      - trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onChatParticipant:github.copilot.default')
      - calls_by_instance['ext-host-chat-agents2.invoke-agent@eh1'] == 1
      - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'success'
      - "!state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].pending"
  # Probe: an @-mentioned participant must receive the request (chatServiceImpl.ts:1652-1653, 2135).
  - id: bench-a1-at-mention-routes
    name: A1 @vscode routes to github.copilot.vscode (probe)
    flow: chat-submit
    fixtures: [full-window]
    input: {input_value: '@vscode how do I change the theme'}
    state:
      chat-agent-service@w1:
        agents:
          github.copilot.default: {extension: GitHub.copilot-chat, has_impl: true, is_default: true, locations: [panel], modes: [ask]}
          github.copilot.vscode: {extension: GitHub.copilot-chat, has_impl: true, is_default: false, locations: [panel], modes: [ask, edit, agent]}
    expect:
      - result.ok && result.value.kind == 'sent'
      - trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-chat-agents2.invoke-agent' && e.input.agent_id == 'github.copilot.vscode')
  # Probe: the response streams into the chat view (progress chunks), and the participant reaches a model.
  - id: bench-a1-response-streams
    name: A1 the response streams back as progress (probe)
    flow: chat-submit
    fixtures: [full-window]
    input: {input_value: 'Explain what src/main.ts does'}
    expect:
      - "calls['language-models-service.send-chat-request'] > 0 || calls['ext-host-language-models.start-chat-request'] > 0"
      - trace.exists(e, e.type == 'call.start' && e.interface.contains('progress'))
