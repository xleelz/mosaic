schema_version: 1
id: vscode
# D1 verified (debugConfigurationManager.ts:418-481 selects the first launch.json config;
# debugCommands.ts:764-777 F5; debugService.ts:354-451 startDebugging; debugSession.ts:346-430
# initialize then launchOrAttach; rawDebugSession.ts:111-113 'initialized' event;
# debugSession.ts:1071-1097 sendAllBreakpoints then configurationDone; debugService.ts:1225-1237
# with supportsConfigurationDoneRequest all breakpoint requests go in parallel;
# extHostDebugService.ts:607-704 $startDASession resolves the descriptor and starts the adapter).
scenarios:
  - id: bench-d1-f5-dap-order
    name: "D1: F9 on src/main.ts:2, then F5 with launch.json's first config selected: initialize -> launch -> (initialized) setBreakpoints, setFunctionBreakpoints -> configurationDone"
    fixtures: [full-window]
    # ConfigurationManager.selectConfiguration picks the first launch.json config at startup
    # (debugConfigurationManager.ts:477-481); full-window seeds the config but not the selection.
    state:
      configuration-manager@w1: {selected: Launch Program}
    steps:
      - {flow: debug-toggle-breakpoint, as: bp}
      - {flow: debug-start-selected, as: f5}
    expect:
      - "steps.f5.result.ok && steps.f5.result.value.started"
      - "state['debug-model@w1'].sessions['session-1'].name == 'Launch Program' && state['debug-model@w1'].sessions['session-1'].request == 'launch'"
      - "calls['configuration-manager.get-selected-configuration'] == 1 && calls['adapter-manager.guess-debugger'] == 0"
      # the adapter is started through the extension host relay before any DAP request
      - >-
        trace.filter(e, e.type == 'call.start' && e.interface == 'ext-host-debug-service.start-da-session')[0].seq
        < trace.filter(e, e.type == 'call.start' && e.interface == 'debug-adapter.handle-request')[0].seq
      - "calls_by_instance['ext-host-debug-service.start-da-session@eh1'] == 1"
      - >-
        trace.filter(e, e.type == 'call.start' && e.interface == 'debug-adapter.handle-request').map(e, e.input.command)
        == ['initialize', 'launch', 'setBreakpoints', 'setFunctionBreakpoints', 'configurationDone']
      # the initialized event arrives after launch was sent and before setBreakpoints
      - >-
        trace.filter(e, e.type == 'call.start' && e.interface == 'raw-debug-session.on-adapter-event' && e.input.event == 'initialized').size() == 1
      - "state['debug-model@w1'].sessions['session-1'].state != 'inactive'"

  - id: bench-d1-f5-default-world
    name: "D1 in the unmodified full-window world: launch.json is seeded but nothing selects it, so F5 guesses a debugger"
    fixtures: [full-window]
    steps:
      - {flow: debug-start-selected, as: f5}
    expect:
      # The code would start 'Launch Program'; the model guesses instead (world/model gap).
      - "steps.f5.result.ok && steps.f5.result.value.started"
      - "calls['adapter-manager.guess-debugger'] == 1"
      - "state['debug-model@w1'].sessions['session-1'].name != 'Launch Program'"

  - id: bench-d1-gap-adapter-process-start
    name: "D1 gap: $startDASession should resolve the adapter descriptor and start the adapter process (extHostDebugService.ts:612-703)"
    fixtures: [full-window]
    state:
      configuration-manager@w1: {selected: Launch Program}
    steps:
      - {flow: debug-start-selected, as: f5}
    expect:
      - "calls['debug-adapter.start-session'] == 1"
