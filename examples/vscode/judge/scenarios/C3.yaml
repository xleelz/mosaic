schema_version: 1
id: vscode
scenarios:
  # Code: ShowAllCommandsAction.run -> quickAccess.show('>') (contrib/quickaccess/browser/commandsQuickAccess.ts:291-293);
  # each pick's accept pushes to commandsHistory then awaits commandService.executeCommand(commandId)
  # (platform/quickinput/browser/commandsQuickAccess.ts:303-323).
  # The model stops after quickAccess.show: no provider lists commands and no pick accept runs one.
  - id: bench-c3-command-palette
    name: "C3: F1 opens quick access with '>' (listing and accept are not modeled)"
    fixtures: [full-window]
    steps:
      - interface: quickaccess-quick-access-contribution.cmd-workbench-action-showcommands
        caller: user
        input: {}
        as: open
    expect:
      - "steps.open.result.ok && steps.open.result.value.prefix == '>'"
      - "state['quick-input-service@w1'].prefix == '>' && state['quick-input-service@w1'].visible"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'quick-input-service.quick-access-show' && e.input.prefix == '>')"
      # the rest of the code path (pick accepted -> ICommandService.executeCommand) has no entity to drive
      - "calls['command-service.execute-command'] == 0"
