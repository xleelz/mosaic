schema_version: 1
id: vscode
scenarios:
  # X5 (corrected): RPCProtocol marks the host Unresponsive when a request has no *acknowledgement*
  # for UNRESPONSIVE_TIME = 3 s, checked by a 1 s RunOnceScheduler (rpcProtocol.ts:119, 158, 182-218),
  # so ~3-4 s, not ~10 s. The state change goes ExtensionHostManager -> AbstractExtensionService
  # onDidChangeResponsiveChange. The reaction is ExtensionsAutoProfiler (local process only, needs a
  # perf baseline and an inspect port): it profiles for 5 s or until responsive, writes the profile,
  # sends exthostunresponsive telemetry, marks the extension in Running Extensions, and only when one
  # extension took >= 95% and >= 5 s shows a SILENT warning prompt ("took a very long time ...",
  # Show Extensions / report), once per extension, at most 3 (extensionsAutoProfiler.ts:77-245).
  # There is no "restart" offer on this path.
  - id: bench-x5-unresponsive-detected
    name: "X5: a blocked host (no ack for 6 s) is flagged unresponsive after 3 s + the 1 s check, then responsive again"
    flow: exthost-unresponsive
    fixtures: [full-window]
    faults:
      - {target: ext-host-rpc-protocol.receive-request, type: latency, latency_ms: 6000}
    expect:
      - "result.ok && !result.value.responsive && !result.value.acknowledged"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'extension-service.on-host-responsive-state').map(e, e.input.responsive) == [false, true]"
      - "trace.exists(e, e.type == 'timeout' && e.interface == 'ext-host-rpc-protocol.receive-request' && e.t >= 3000 && e.t <= 4100)"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'ext-host-rpc-protocol.receive-request' && e.late)"
      - "calls_by_instance['ext-host-rpc-protocol.receive-request@eh1'] == 1"
      - "state['extension-service@w1'].host_responsive && state['rpc-protocol@w1'].responsive"
      # the host is not restarted for being unresponsive
      - "calls['extension-service.start-extension-hosts'] == 0 && calls['notification-service.prompt'] == 0"

  # The reaction to the unresponsive event: the auto profiler. Expected to start a profiling session.
  - id: bench-x5-unresponsive-auto-profiler
    name: "X5: the unresponsive event reaches ExtensionsAutoProfiler, which profiles the host"
    flow: exthost-unresponsive
    fixtures: [full-window]
    faults:
      - {target: ext-host-rpc-protocol.receive-request, type: latency, latency_ms: 6000}
    expect:
      - "result.ok && !result.value.responsive"
      - "trace.exists(e, e.type == 'call.start' && e.component == 'extensions-auto-profiler')"
