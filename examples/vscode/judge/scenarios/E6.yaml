schema_version: 1
id: vscode
scenarios:
  - id: bench-e6-auto-save-skips-format
    name: "E6: afterDelay auto save with editor.formatOnSave on; the participant sees reason auto and does not format"
    fixtures: [full-auto-save-after-delay, editor-main-open, editor-ts-providers]
    config:
      editor-format-on-save: true
    steps:
      - flow: editor-type-text
        as: t1
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
    expect:
      - "!steps.get.result.value.model.dirty"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save')[0].input.options.reason == 'auto'"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'format-on-save-participant.participate').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'format-on-save-participant.participate')[0].input.reason == 'auto'"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'format-on-save-participant.participate')[0].output.formatted == 'none'"
      - "!trace.exists(e, e.type == 'call.start' && (e.interface.startsWith('format.') || e.interface == 'ext-host-language-features.provide-document-formatting-edits'))"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"// import { add } from './util';\\nconsole.log(add(1, 2));\\n\""

  # Control: the same world, saved explicitly (Ctrl+S command) formats.
  - id: bench-e6-explicit-save-formats
    name: "E6 control: an explicit save in the same world formats"
    fixtures: [full-format-on-save, editor-ts-providers]
    flow: files-save
    input: {command_id: workbench.action.files.save, resource: "file:///work/app/src/main.ts"}
    expect:
      - "result.ok && result.value.result.success"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'format.format-document-with-selected-provider')"
