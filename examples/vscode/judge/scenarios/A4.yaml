schema_version: 1
id: vscode
scenarios:
  # A4 verified: workbench.action.chat.cancel (chatExecuteActions.ts:986-988) ->
  # ChatService.cancelCurrentRequestForSession (chatServiceImpl.ts:2613-2645): no pending request -> logged no-op;
  # else CancellableRequest.cancel() = toolsService.cancelToolCallsForRequest + token cancel (136-142),
  # the pending request is removed, and the token listener calls model.cancelRequest -> response.cancel()
  # (chatServiceImpl.ts:1987-2003, chatModel.ts:3726-3729); progressCallback drops later chunks (1863).
  - id: bench-a4-cancel-in-flight
    name: A4 cancel marks the in-flight response canceled and frees the session
    flow: chat-cancel
    fixtures: [full-window]
    state:
      chat-service@w1:
        sessions:
          vscode-chat-session://local/s1:
            pending: true
            pending_request_id: request_1
            requests:
              - {agent_id: github.copilot.default, id: request_1, message: long task, response: in-progress}
    steps:
      - {flow: chat-cancel, as: c}
      - {flow: chat-view-model, as: r}
    expect:
      - steps.c.result.ok && steps.c.result.value.canceled
      - trace.exists(e, e.type == 'call.start' && e.interface == 'chat-service.cancel-current-request-for-session' && e.input.source == 'cancelAction')
      - "!steps.r.result.value.session.pending && steps.r.result.value.session.requests[0].response == 'canceled'"
      - calls['ext-host-chat-agents2.invoke-agent'] == 0
  - id: bench-a4-cancel-nothing-pending
    name: A4 cancel with nothing in flight is a no-op
    flow: chat-cancel
    fixtures: [full-window]
    expect:
      - result.ok && !result.value.canceled
      - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests == []
  # Probe: cancelling also cancels the request's pending tool calls (CancellableRequest.cancel, 137-139)
  # and the token reaches the participant on the extension host.
  - id: bench-a4-cancel-propagates
    name: A4 cancellation reaches tool calls and the extension host (probe)
    flow: chat-cancel
    fixtures: [full-window]
    state:
      chat-service@w1:
        sessions:
          vscode-chat-session://local/s1:
            pending: true
            pending_request_id: request_1
            requests:
              - {agent_id: github.copilot.default, id: request_1, message: long task, response: in-progress}
    expect:
      - result.ok && result.value.canceled
      - trace.exists(e, e.type == 'call.start' && e.interface.startsWith('language-model-tools-service.cancel'))
  # Probe: a cancel issued while the participant is streaming. Steps never overlap, so the cancel step
  # starts only after the request completed: it can't interleave (simulator gap).
  - id: bench-a4-cancel-during-stream
    name: A4 cancel during streaming (probe, exposes the step-overlap gap)
    fixtures: [full-window]
    steps:
      - {flow: chat-submit, as: s, input: {input_value: 'long task'}}
      - {flow: chat-cancel, as: c, at_ms: 100}
    expect:
      - steps.c.result.value.canceled
      - state['chat-service@w1'].sessions['vscode-chat-session://local/s1'].requests[0].response == 'canceled'
