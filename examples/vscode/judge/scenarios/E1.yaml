schema_version: 1
id: vscode
scenarios:
  - id: bench-e1-save-dirty-file-ctrl-s
    name: "E1: Ctrl+S resolves to workbench.action.files.save; editor -> text file service -> participants -> write; model clean, saved_version_id == version_id, disk changed"
    fixtures: [full-dirty-editor]
    steps:
      - flow: workbench-shell-keybinding-dispatch
        input: {keypress: ctrl+s}
        as: key
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
    expect:
      - "steps.key.result.ok && steps.key.result.value.kind == 'kb-found' && steps.key.result.value.command_id == 'workbench.action.files.save'"
      - "!steps.get.result.value.model.dirty && steps.get.result.value.model.saved_version_id == steps.get.result.value.model.version_id"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2))\\n\""
      # path: keybinding -> command service -> file command -> editor service -> text file service -> model save -> participants -> write
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['keybinding-service.dispatch','command-service.execute-command','file-commands.cmd-workbench-action-files-save','editor-service.save','text-file-service.save','text-file-models.save','text-file-save-participant.participate','text-file-service.write','file-service.write-file','disk.write-file']).map(e, e.interface) == ['keybinding-service.dispatch','command-service.execute-command','file-commands.cmd-workbench-action-files-save','editor-service.save','text-file-service.save','text-file-models.save','text-file-save-participant.participate','text-file-service.write','file-service.write-file','disk.write-file']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.save' && e.input.options.reason == 'explicit' && e.input.options.force)"
      - "calls['disk.write-file'] == 1"

  # Same case from the command entry (the keybinding hop above aborts: the command needs input.resource
  # and the command service passes args [] - the code resolves the active editor instead).
  - id: bench-e1-save-dirty-file-command
    name: "E1 (from the command): workbench.action.files.save on the active dirty editor"
    fixtures: [full-dirty-editor]
    steps:
      - flow: files-save
        input: {command_id: workbench.action.files.save, resource: "file:///work/app/src/main.ts"}
        as: save
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
    expect:
      - "steps.save.result.ok && steps.save.result.value.result.success"
      - "!steps.get.result.value.model.dirty && steps.get.result.value.model.saved_version_id == steps.get.result.value.model.version_id"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2))\\n\""
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['file-commands.cmd-workbench-action-files-save','editor-service.save','text-file-service.save','text-file-models.save','text-file-save-participant.participate','text-file-service.write','file-service.write-file','disk.write-file']).map(e, e.interface) == ['file-commands.cmd-workbench-action-files-save','editor-service.save','text-file-service.save','text-file-models.save','text-file-save-participant.participate','text-file-service.write','file-service.write-file','disk.write-file']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.save' && e.input.options.reason == 'explicit' && e.input.options.force)"
      - "calls['disk.write-file'] == 1"
