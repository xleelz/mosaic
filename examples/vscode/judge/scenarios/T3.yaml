schema_version: 1
id: vscode
# T3 verified: PtyHostService._startPtyHost's connection.onDidProcessExit (ptyHostService.ts:161-173):
# fire onPtyHostExit, then unless quit was requested restart while _restartCount <= MaxRestarts (5)
# (so up to 6 restarts), otherwise log "giving up". restartPtyHost -> _startPtyHost fires onPtyHostStart.
# Renderer: BaseTerminalBackend logs the exit, and on the next onPtyHostStart fires onPtyHostRestart
# (baseTerminalBackend.ts:47-60); LocalTerminalBackend drops and reconnects its direct proxy
# (localTerminalBackend.ts:104-108); every TerminalProcessManager marks itself disconnected, then a
# normal terminal prints "Restarting the terminal because the connection to the shell process was
# lost..." and relaunches with its shell launch config (a NEW shell; the old one is gone), while a
# feature terminal without reconnection properties (e.g. a task) is reported exited with -1
# (terminalProcessManager.ts:589-615).
scenarios:
  - id: bench-t3-restart
    name: "T3: the pty host exits with code 1 after a terminal was created: the main process restarts it"
    fixtures: [full-window]
    steps:
      - {flow: terminal-create, as: c}
      - {flow: pty-host-exit, input: {code: 1}, as: x}
    expect:
      - "steps.c.result.ok && steps.x.result.ok && steps.x.result.value.restarted"
      - "state['pty-host-service'].restart_count == 1 && state['pty-host-service'].started"
      - "calls['pty-host-main.start-pty-host'] == 2"

  - id: bench-t3-gap-terminals-relaunch
    name: "T3 gap: after the restart the renderer reconnects and the normal terminal relaunches a new shell on the new pty host"
    fixtures: [full-window]
    steps:
      - {flow: terminal-create, as: c}
      - {flow: pty-host-exit, input: {code: 1}, as: x}
    expect:
      # the old pty died with the host
      - "!('1' in state['pty-service'].ptys) || state['pty-service'].ptys.size() > 1"
      # LocalTerminalBackend reconnects its direct proxy on onPtyHostRestart
      - "calls['local-terminal-backend.connect-to-direct-proxy'] == 2"
      # TerminalProcessManager relaunches the shell: a second createProcess and spawn
      - "calls['pty-service.create-process'] == 2 && calls['terminal-process.start'] == 2"
      - "size(state['terminal-service@w1'].instances) == 1"

  - id: bench-t3-max-restarts
    name: "T3 bound: restart while restart_count <= 5; the sixth crash after 5 restarts still restarts, the seventh gives up"
    fixtures: [full-window]
    state:
      pty-host-service: {started: true, restart_count: 5}
    steps:
      - {flow: pty-host-exit, input: {code: 1}, as: sixth}
      - {flow: pty-host-exit, input: {code: 1}, as: seventh}
    expect:
      - "steps.sixth.result.value.restarted && !steps.seventh.result.value.restarted"
      - "ctx.pty_host_gave_up && state['pty-host-service'].restart_count == 6"
