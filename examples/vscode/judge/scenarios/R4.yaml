schema_version: 1
id: vscode
scenarios:
  - id: bench-r4-oss-check-finds-nothing
    name: "R4 (deployed OSS, autoUpdate on): the update check runs at startup and every 12 h but returns early without a gallery; nothing updates"
    flow: rs-ext-auto-update
    fixtures: [full-window]
    state:
      extensions-profile-scanner-service:
        profile_extensions:
          ms-python.python: {id: ms-python.python, is_builtin: false, pinned: false, source: gallery, version: 2026.16.0}
    expect:
      - "config['extensions-auto-update'] == 'on' && config['extensions-auto-check-updates'] && config['extensions-updates-check-interval-ms'] == 43200000"
      - "calls['extensions-workbench-service.check-for-updates'] == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'extensions-workbench-service.check-for-updates').map(e, e.t) .exists(t, t >= 43200000)"
      - "trace.exists(e, e.type == 'note' && e.title == 'No gallery, nothing to check')"
      - "calls['marketplace-gallery-endpoint.extension-query'] == 0 && calls['extensions-workbench-service.auto-update-extensions'] == 0 && calls['extension-management-service.update-from-gallery'] == 0"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].version == '2026.16.0'"
  - id: bench-r4-marketplace-auto-update
    name: "R4 (Marketplace-enabled product): an outdated extension published long ago is found outdated at the first check and auto updated through the 'extensions' channel"
    flow: rs-ext-auto-update
    fixtures: [full-window, remote-server-marketplace]
    state:
      extensions-profile-scanner-service:
        profile_extensions:
          ms-python.python: {id: ms-python.python, is_builtin: false, pinned: false, source: gallery, version: 2026.16.0}
      marketplace-gallery-endpoint:
        catalog:
          ms-python.python: {last_updated: 1700000000000}
    expect:
      - "calls['extension-management-service.update-from-gallery'] == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'extension-management-service.update-from-gallery')[0].t < 43200000"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-management-channel.install-from-gallery') && trace.exists(e, e.type == 'call.start' && e.interface == 'extensions-downloader.download')"
      - "'ms-python.python' in ctx.auto_updated"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].version == '2026.18.0'"
      - "state['extensions-workbench-service@w1'].outdated == []"
