schema_version: 1
id: vscode
scenarios:
  - id: bench-e8-revert-dirty-file
    name: "E8: workbench.action.files.revert on the dirty editor; reload from disk, not dirty, no write"
    fixtures: [full-dirty-editor]
    steps:
      - flow: files-revert
        input: {command_id: workbench.action.files.revert, resource: "file:///work/app/src/main.ts"}
        as: revert
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
      - flow: editor-read-model
        input: {uri: "file:///work/app/src/main.ts"}
        as: text
    expect:
      - "steps.revert.result.ok"
      - "!steps.get.result.value.model.dirty"
      - "steps.get.result.value.model.value == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""
      # the editor's text model shows the disk content too (the text file model IS the text model in the code)
      - "steps.text.result.value.value == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""
      - "calls['file-service.write-file'] == 0 && calls['disk.write-file'] == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['file-commands.cmd-workbench-action-files-revert','text-file-service.revert','text-file-models.revert','text-file-models.resolve','file-service.read-file']).map(e, e.interface) == ['file-commands.cmd-workbench-action-files-revert','text-file-service.revert','text-file-models.revert','text-file-models.resolve','file-service.read-file']"
      - "state['dirty-files-indicator@w1'].badge == 0"
