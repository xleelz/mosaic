schema_version: 1
id: vscode
scenarios:
  # X1 from the real trigger: opening src/main.ts. In the code the language service fires
  # onLanguage:typescript (and the bare onLanguage) when the model requests rich language features
  # (languageService.ts:287-291). Does the model's open-editor path reach the extension service?
  - id: bench-x1-open-ts-file
    name: "X1: opening a .ts file fires onLanguage:typescript and activates the TS extension once in eh1"
    fixtures: [full-window]
    # Round 2: the full-window world pre-loads main.ts's text model, so opening it never creates a
    # model (and never sets its language). Open util.ts, a .ts file on disk with no model yet.
    steps:
      - flow: workbench-shell-open-editor
        input: {resource: "file:///work/app/src/util.ts"}
        as: open
    expect:
      - "steps.open.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onLanguage:typescript')"
      - "'vscode.typescript-language-features' in state['extension-registry@w1'].activated"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] >= 1"

  # X1 from the seam: the activation event itself (what the language service would send).
  - id: bench-x1-activate-onlanguage-typescript
    name: "X1 (seam): onLanguage:typescript, then a second open; TS activate() runs once in eh1, markdown untouched"
    fixtures: [full-window]
    steps:
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:typescript", activation_kind: normal}
        as: first
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:typescript", activation_kind: normal}
        as: second
    expect:
      - "steps.first.result.ok && steps.first.result.value.activated == ['vscode.typescript-language-features']"
      - "steps.second.result.ok && steps.second.result.value.activated == [] && steps.second.result.value.cached"
      - "calls['third-party-extension.activate'] == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'third-party-extension.activate').map(e, e.input.extension_id) == ['vscode.typescript-language-features']"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['extension-service.activate-by-event','extension-host-manager.activate-by-event','ext-host-extension-service.activate-by-event','extensions-activator.activate-by-event','extensions-activator.handle-activation-request','ext-host-extension-service.activate-extension','main-thread-extension-service.on-will-activate-extension','third-party-extension.activate','main-thread-extension-service.on-did-activate-extension']).map(e, e.interface) == ['extension-service.activate-by-event','extension-host-manager.activate-by-event','ext-host-extension-service.activate-by-event','extensions-activator.activate-by-event','extensions-activator.handle-activation-request','ext-host-extension-service.activate-extension','main-thread-extension-service.on-will-activate-extension','third-party-extension.activate','main-thread-extension-service.on-did-activate-extension','extension-service.activate-by-event','extension-host-manager.activate-by-event']"
      - "state['extension-registry@w1'].activated == ['vscode.typescript-language-features']"
      - "!('vscode.markdown-language-features' in state['extensions-activator@eh1'].operations)"
      - "state['extensions-activator@eh1'].operations['vscode.typescript-language-features'] == 'activated'"
