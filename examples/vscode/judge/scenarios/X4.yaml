schema_version: 1
id: vscode
scenarios:
  # X4 (verified, made precise): the local host's exit reaches NativeExtensionService._onExtensionHostCrashed
  # (nativeExtensionService.ts:150-231). Every host is stopped (abstractExtensionService.ts:888-890), the
  # crash is registered in ExtensionHostCrashTracker (5 min window, limit 3, :1549-1572); while fewer than
  # 3 crashes are recorded the host auto-restarts with a 5 s status message (startExtensionHosts, which
  # replays _allRequestedActivateEvents, :969). The 3rd crash within 5 minutes shows the prompt
  # (built: Start Extension Bisect / Restart Extension Host / Learn More) and does not restart.
  - id: bench-x4-crash-restart-limit
    name: "X4: two crashes auto-restart and re-activate; the third within 5 minutes prompts and stays stopped"
    fixtures: [full-window]
    state:
      extension-registry@w1: {activated: ["vscode.git", "vscode.typescript-language-features"]}
      extension-service@w1: {requested_events: ["onLanguage:typescript"]}
      extensions-activator@eh1:
        already_activated_events: ["*", "onLanguage:typescript"]
        operations: {"vscode.git": activated, "vscode.typescript-language-features": activated}
    choices: {extension-service.on-extension-host-crashed.user_action: dismiss}
    steps:
      - flow: exthost-crash
        input: {code: 1, signal: ""}
        as: c1
      - flow: exthost-crash
        input: {code: 1, signal: ""}
        at_ms: 60000
        as: c2
      - flow: exthost-crash
        input: {code: 1, signal: ""}
        at_ms: 120000
        as: c3
    expect:
      - "steps.c1.result.ok && steps.c1.result.value.restarted && steps.c1.result.value.reason == 'auto-restart'"
      - "steps.c2.result.ok && steps.c2.result.value.restarted && steps.c2.result.value.reason == 'auto-restart'"
      - "steps.c3.result.ok && !steps.c3.result.value.restarted && steps.c3.result.value.reason == 'prompt-shown'"
      - "calls['notification-service.status'] == 2 && calls['notification-service.prompt'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notification-service.prompt' && e.input.choices == ['Start Extension Bisect', 'Restart Extension Host', 'Learn More'])"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notification-service.status' && e.input.hide_after_ms == 5000)"
      - "calls['extension-service.start-extension-hosts'] == 2"
      - "size(state['extension-host-crash-tracker@w1'].recent_crashes) == 3"
      - "state['extension-service@w1'].host_state == 'stopped' && state['extension-service@w1'].restarts == 2"
      # extensions activate again in each new host: '*' (git) and the replayed onLanguage:typescript
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'third-party-extension.activate').map(e, e.input.extension_id) == ['vscode.git', 'vscode.typescript-language-features', 'vscode.git', 'vscode.typescript-language-features']"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'ext-host-extension-service.activate-by-event').map(e, e.input.activation_event) == ['onLanguage:typescript', 'onLanguage:typescript']"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] == 2"
