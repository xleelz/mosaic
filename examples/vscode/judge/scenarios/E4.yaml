schema_version: 1
id: vscode
scenarios:
  - id: bench-e4-save-conflict-then-overwrite
    name: "E4: disk copy newer than the model's mtime; save fails file-modified-since, Compare/Overwrite offered; Overwrite saves with ignoreModifiedSince (etag disabled)"
    fixtures: [full-dirty-editor]
    state:
      disk:
        files:
          file:///work/app/src/main.ts:
            content: "// changed elsewhere\n"
            mtime: 1793318500000
            size: 21
    steps:
      - flow: files-save
        input: {command_id: workbench.action.files.save, resource: "file:///work/app/src/main.ts"}
        as: save
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: after_fail
      - flow: files-save-error-action
        input: {resource: "file:///work/app/src/main.ts", action: overwrite}
        as: overwrite
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
    expect:
      # the first save is refused by the dirty-write check, not by a fault
      - "steps.save.result.ok && !steps.save.result.value.result.success"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'file-service.write-file' && has(e.error) && e.error.code == 'file-modified-since')"
      - "steps.after_fail.result.value.model.dirty && steps.after_fail.result.value.model.conflict"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notification-service.notify' && e.input.actions == ['compare', 'overwrite'] && e.input.message == 'stale-save-error')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'notification-service.notify')"
      # overwrite: the second write carries a disabled etag and succeeds; disk has the user's content
      - "steps.overwrite.result.ok && steps.overwrite.result.value.saved"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'file-service.write-file').map(e, e.input.etag)[1] == '' && trace.filter(e, e.type == 'call.start' && e.interface == 'file-service.write-file').map(e, e.input.etag)[0] != ''"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save')[1].input.options.ignore_modified_since && trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save')[1].input.options.reason == 'explicit'"
      - "!steps.get.result.value.model.dirty && !steps.get.result.value.model.conflict"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2))\\n\""
      - "!('file:///work/app/src/main.ts' in state['text-file-save-error-handler@w1'].messages)"
