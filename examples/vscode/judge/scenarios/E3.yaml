schema_version: 1
id: vscode
scenarios:
  # Corrected expectation: files.participants.timeout bounds only working-copy FILE OPERATION participants
  # (create/rename/delete). The only bounded text-file save participant is the extension host's
  # onWillSaveTextDocument participant: 1750 ms in the renderer (mainThreadSaveParticipant.ts:35-38).
  # Its rejection is logged (textFileSaveParticipant.ts:71-73), later participants still run and the
  # save goes ahead (written within ~1750 ms + format + write).
  - id: bench-e3-exthost-participant-hangs
    name: "E3a: onWillSave in eh1 never answers; aborted after 1750 ms, logged, format still runs, the save goes ahead"
    fixtures: [full-format-on-save, editor-ts-providers]
    faults:
      # round 2: hang the extension host side ($participateInSave); the 1750 ms bound is the renderer's
      # timer around it (mainThreadSaveParticipant.ts:33-38), inside ext-host-save-participant.participate
      - {target: ext-host-document-save-participant.participate-in-save, type: timeout}
    steps:
      - flow: files-save
        input: {command_id: workbench.action.files.save, resource: "file:///work/app/src/main.ts"}
        as: save
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
    expect:
      - "steps.save.result.ok && steps.save.result.value.result.success"
      - "!steps.get.result.value.model.dirty"
      - "calls['format-on-save-participant.participate'] == 1 && calls['disk.write-file'] == 1"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""
      # the code's budget: the renderer gives up on the extension host after 1750 ms
      # round 2 (path): the renderer's 1750 ms timer is timeout_ms on its call to the eh1 side, so the
      # timeout event is recorded on that callee, ext-host-document-save-participant.participate-in-save
      - "trace.exists(e, e.type == 'timeout' && e.interface == 'ext-host-document-save-participant.participate-in-save' && e.t < 2000)"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'disk.write-file')[0].t < 2500"

  # A built-in participant (format on save, via the TS formatter) that never finishes: no timeout in the
  # code; after 5 s a cancellable "Skip" progress shows (textFileSaveParticipant.ts:49-55, 81-83);
  # Skip cancels the remaining participants and the save goes ahead unformatted. The model has no Skip
  # (no choice/cancel source); the simulator's 30 s default hang timeout stands in for it.
  - id: bench-e3-formatter-hangs
    name: "E3b: the formatter never answers; the save goes ahead with the unformatted content and is not failed"
    fixtures: [full-format-on-save, editor-ts-providers]
    faults:
      - {target: ext-host-language-features.provide-document-formatting-edits, type: timeout}
    # Round 2: Skip is the user's action on the progress notification, shown after 5000 ms for a dirty
    # file (textFileSaveParticipant.ts:47-91), so it is a later, overlapping step; the save waits for it.
    steps:
      - flow: files-save
        input: {command_id: workbench.action.files.save, resource: "file:///work/app/src/main.ts"}
        as: save
        await: false
      - interface: text-file-save-participant.skip
        caller: user
        input: {resource: "file:///work/app/src/main.ts"}
        at_ms: 6000
        as: skip
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
        at_ms: 8000
    expect:
      - "steps.save.result.ok && steps.save.result.value.result.success"
      - "!steps.get.result.value.model.dirty"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2))\\n\""
      - "calls['disk.write-file'] == 1"
      # the code's path: the user's Skip (a progress cancel) ends participation
      - "steps.skip.result.value.skipped"
