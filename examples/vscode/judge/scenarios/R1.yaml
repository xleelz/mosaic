schema_version: 1
id: vscode
scenarios:
  - id: bench-r1-connect-and-ext-host
    name: "R1: window connects the management connection to srv1, then the remote extension host connection starts there"
    fixtures: [full-window, remote-server-srv1]
    steps:
      - flow: rs-remote-connect
        input:
          commit: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
          reconnection_token: tok-m1
          remote_authority: ssh-remote+dev-box
        as: c
      - flow: rs-remote-ext-host-connect
        input:
          auth: tok-dev
          commit: 2c33b50b16c472efe58357d1d2a8a5414bc23fbf
          desired_connection_type: extension-host
          is_reconnection: false
          reconnection_token: tok-eh1
        as: eh
      - flow: rs-remote-connection-state
        as: st
    expect:
      - "steps.c.result.ok && steps.eh.result.ok && steps.st.result.value.is_connected"
      # management connection: resolve authority -> socket -> server handshake, remembered on srv1 by token
      - "'tok-m1' in state['remote-extension-host-agent-server@srv1'].management_connections"
      - "state['management-persistent-connection@w1'].connection_state == 'connection-gain'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'remote-authority-resolver-service.resolve-authority')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'remote-socket-factory-service.connect')"
      - "trace.exists(e, e.type == 'note' && e.title == 'New ManagementConnection, remembered by token')"
      # extension host connection: the server marks itself active and starts an ExtensionHostConnection
      - "calls['server-lifetime-service.active'] >= 1 && calls['extension-host-connection.start'] == 1"
  - id: bench-r1-workspace-extension-runs-remotely
    name: "R1 (path): the remote extension host gets the workspace extensions and starts them (not modeled: expected to fail)"
    # round 2: placement happens in the window's extension service, not on the server, so enter at
    # the window's extension host startup (exthost-start) in a remote window: the remote-folder world
    # on top of full-window, with the hosts not yet started (abstractExtensionService.ts:466-487).
    fixtures: [full-window, remote-folder, remote-server-srv1]
    state:
      ext-host-extension-service@eh1: {eager_activated: false, ready_to_run: false, started: false}
      extension-host-manager@w1: {has_started: false}
      extension-service@w1: {host_state: stopped, ready: false}
    steps:
      - flow: exthost-start
        as: eh
    expect:
      # ExtensionHostConnection.start forks bootstrap-fork (extensionHostConnection.ts:247-290);
      # the workbench places extensionKind 'workspace' extensions on the remote host
      # (extensionHostKind.ts:47-88, extensionManifestPropertiesService.ts:271). The model only records exit info.
      - "calls['extension-host-manager.start'] >= 1 || calls['extension-host-manager.create'] >= 1"
