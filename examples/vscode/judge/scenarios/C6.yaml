schema_version: 1
id: vscode
scenarios:
  # Code: Configuration.getConsolidatedConfigurationModel (platform/configuration/common/configurationModels.ts:1033-1046):
  # default.merge(application, user, workspace, memory) (1065-1070), then the folder model of the resource's root (1048-1063, 1072-1085),
  # THEN .override(overrideIdentifier) on the consolidated model (1035-1037), then policy on top (1038-1044).
  # So a [typescript] value at any layer beats a general value at any layer (user [typescript] > workspace general).
  - id: bench-c6-default
    name: "C6: nothing set, the registered default"
    flow: pc-get-configuration-value
    fixtures: [full-window]
    input: {key: editor.formatOnSave}
    expect:
      - "result.ok && result.value.value == false"
      - "calls['settings-store.workspace-read'] == 1 && calls['settings-store.user-read'] == 1"
  - id: bench-c6-user-over-default
    name: "C6: user over default"
    flow: pc-get-configuration-value
    fixtures: [full-window]
    input: {key: editor.formatOnSave}
    state:
      settings-store: {user: {editor.formatOnSave: true}}
    expect:
      - "result.ok && result.value.value == true"
  - id: bench-c6-workspace-over-user
    name: "C6: workspace over user"
    flow: pc-get-configuration-value
    fixtures: [full-window]
    input: {key: editor.formatOnSave}
    state:
      settings-store: {user: {editor.formatOnSave: true}, workspace: {editor.formatOnSave: false}}
    expect:
      - "result.ok && result.value.value == false"
      - "calls['settings-store.user-read'] == 0"
  - id: bench-c6-folder-over-workspace
    name: "C6: folder settings of the resource's root over workspace settings (multi-root)"
    flow: pc-get-configuration-value
    fixtures: [full-window]
    input: {key: editor.formatOnSave, resource: "file:///work/app/src/main.ts"}
    state:
      settings-store:
        workspace: {editor.formatOnSave: false}
        folder: {"file:///work/app": {editor.formatOnSave: true}}
    expect:
      - "result.ok && result.value.value == true"
  - id: bench-c6-language-override-over-general
    name: "C6: user [typescript] override beats the general workspace value"
    flow: pc-get-configuration-value
    fixtures: [full-window]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      settings-store:
        user: {"[typescript]": {editor.formatOnSave: true}}
        workspace: {editor.formatOnSave: false}
    expect:
      - "result.ok && result.value.value == true"
  - id: bench-c6-language-override-same-layer
    name: "C6: [typescript] over the general value in the same (user) layer"
    flow: pc-get-configuration-value
    fixtures: [full-window]
    input: {key: editor.formatOnSave, override_identifier: typescript}
    state:
      settings-store:
        user: {editor.formatOnSave: false, "[typescript]": {editor.formatOnSave: true}}
    expect:
      - "result.ok && result.value.value == true"
