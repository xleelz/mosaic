schema_version: 1
id: vscode
scenarios:
  - id: bench-e5-auto-save-after-delay
    name: "E5a: files.autoSave=afterDelay; one keystroke; the file saves with reason auto files.autoSaveDelay (1000 ms) later"
    fixtures: [full-auto-save-after-delay, editor-main-open]
    steps:
      - flow: editor-type-text
        as: t1
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
    expect:
      - "steps.t1.result.ok"
      - "!steps.get.result.value.model.dirty && steps.get.result.value.model.saved_version_id == steps.get.result.value.model.version_id"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save').size() == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save')[0].input.options.reason == 'auto'"
      # the save fires files.autoSaveDelay after the edit's dirty/content events, from the auto save timer
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save')[0].t >= 1000 && trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save')[0].t < 1100"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'editor-auto-save.run-auto-save').size() == 2"
      - "state['disk'].files['file:///work/app/src/main.ts'].content.startsWith('// import')"
      - "state['editor-auto-save@w1'].scheduled == {}"

  # The debounce: a second edit 500 ms after the first should push the save out to t = 1500.
  # Scenario steps drain their timers before the next step starts, so the second keystroke
  # cannot land while the first auto save timer is pending (simulator gap).
  - id: bench-e5-auto-save-debounce
    name: "E5b: a second keystroke 500 ms later restarts the delay; one auto save at ~1500 ms"
    fixtures: [full-auto-save-after-delay, editor-main-open]
    steps:
      - flow: editor-type-text
        as: t1
      - flow: editor-type-text
        input: {args: {text: x}}
        at_ms: 500
        as: t2
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        at_ms: 3000
        as: get
    expect:
      - "steps.t2.start_ms == 500"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save').size() == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'text-file-models.save')[0].t >= 1500"
