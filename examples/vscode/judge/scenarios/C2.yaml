schema_version: 1
id: vscode
scenarios:
  # Code: Ctrl+W is bound twice at the same weight: closeActiveEditor (when undefined, editorCommands.ts:835-843)
  # and closeGroup (when activeEditorGroupEmpty && multipleEditorGroups, editorCommands.ts:863-876).
  # KeybindingResolver._findCommand walks candidates from last to first and returns the first whose when matches.
  - id: bench-c2-when-true
    name: "C2: Ctrl+W with an empty active group among several resolves to closeGroup"
    flow: workbench-shell-keybinding-dispatch
    fixtures: [full-window]
    input:
      keypress: ctrl+w
      # round 2: the code's when clause reads two keys (editorCommands.ts:866, contextkeys.ts:100,104);
      # the combined key was never a real context key.
      context: {activeEditorGroupEmpty: true, multipleEditorGroups: true}
    expect:
      - "result.ok && result.value.kind == 'kb-found' && result.value.command_id == 'workbench.action.closeGroup'"
      - "calls['editor-commands.cmd-workbench-action-closegroup'] == 1 && calls['editor-commands.cmd-workbench-action-closeactiveeditor'] == 0"
      - "state['keybinding-service@w1'].last_command == 'workbench.action.closeGroup'"
      # code path: KeybindingService always runs the command through ICommandService.executeCommand
      - "calls['command-service.execute-command'] >= 1"
  - id: bench-c2-when-false-falls-through
    name: "C2: Ctrl+W with the when clause false falls through to closeActiveEditor"
    flow: workbench-shell-keybinding-dispatch
    fixtures: [full-window]
    input:
      keypress: ctrl+w
      context: {activeEditorGroupEmpty: false, multipleEditorGroups: true}
    expect:
      - "result.ok && result.value.kind == 'kb-found' && result.value.command_id == 'workbench.action.closeActiveEditor'"
      - "calls['editor-commands.cmd-workbench-action-closegroup'] == 0 && calls['editor-commands.cmd-workbench-action-closeactiveeditor'] == 1"
  - id: bench-c2-editor-text-focus-none
    name: "C2: a binding gated on editorTextFocus does not resolve without focus (no other binding: none)"
    flow: workbench-shell-keybinding-dispatch
    fixtures: [full-window]
    state:
      keybinding-service:
        keybindings:
          - {chords: [ctrl+shift+i], command: editor.action.formatDocument, when: editorTextFocus}
    input:
      keypress: ctrl+shift+i
      context: {editorTextFocus: false}
    expect:
      - "result.ok && result.value.kind == 'no-matching-kb' && !result.value.prevent_default"
      - "calls['command-service.execute-command'] == 0"
  - id: bench-c2-editor-text-focus-true
    name: "C2: the same binding resolves when editorTextFocus is true and runs through the command service"
    flow: workbench-shell-keybinding-dispatch
    fixtures: [full-window]
    state:
      keybinding-service:
        keybindings:
          - {chords: [ctrl+shift+i], command: editor.action.formatDocument, when: editorTextFocus}
    input:
      keypress: ctrl+shift+i
      context: {editorTextFocus: true}
    expect:
      - "result.ok && result.value.kind == 'kb-found' && result.value.command_id == 'editor.action.formatDocument'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'command-service.execute-command' && e.input.command_id == 'editor.action.formatDocument')"
  - id: bench-c2-context-from-context-key-service
    name: "C2 path: the context comes from the context key service, not from the key event"
    flow: workbench-shell-keybinding-dispatch
    fixtures: [full-window]
    state:
      keybinding-service:
        keybindings:
          - {chords: [ctrl+shift+i], command: editor.action.formatDocument, when: editorTextFocus}
      context-key-service:
        values: {editorTextFocus: true}
    input:
      keypress: ctrl+shift+i
    expect:
      - "result.ok && result.value.kind == 'kb-found'"
