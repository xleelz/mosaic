schema_version: 1
id: vscode
scenarios:
  - id: bench-c1-unknown-command
    name: "C1: executing an unknown command id is rejected with command not found"
    flow: pc-execute-command
    fixtures: [full-window]
    input:
      command_id: workbench.action.judgeDoesNotExist
    expect:
      - "!result.ok && result.error.code == 'command-not-found'"
      - "result.error.message == \"command 'workbench.action.judgeDoesNotExist' not found\""
      # path: registry lookup misses, onCommand + * activation both awaited, then _tryExecuteCommand rejects
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onCommand:workbench.action.judgeDoesNotExist')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == '*')"
      - "calls['command-service.activate-star'] == 1 && calls['command-service.try-execute-command'] == 1"
      - "calls['commands-registry.get-command'] == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'command-service.activate-star')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'command-service.try-execute-command')[0].seq"
  - id: bench-c1-known-command-control
    name: "C1 control: a registered command runs its handler"
    flow: pc-execute-command
    fixtures: [full-window]
    input:
      command_id: noop
    expect:
      - "result.ok"
      - "calls['commands-registry.cmd-noop'] == 1 && calls['command-service.activate-star'] == 0"
