schema_version: 1
id: vscode
# T1 verified: TerminalService.createTerminal (terminalService.ts:975-1097) -> TerminalInstanceService
# -> TerminalProcessManager.createProcess -> LocalTerminalBackend.createProcess
# (electron-browser/localTerminalBackend.ts:206-222): _connectToDirectProxy acquires a message port
# ('vscode:createPtyHostMessageChannel', :114-160), which makes the main process's PtyHostService
# start the pty host on demand (ptyHostService.ts:53-57, 112-115, 144-197), then
# $createProcess on the pty host's PtyService (ptyService.ts:319-365) and LocalPty.start ->
# PtyService.start -> PersistentTerminalProcess.start -> TerminalProcess.start spawns the shell
# with node-pty (terminalProcess.ts:206-307). Data: TerminalProcess.onProcessData ->
# TerminalDataBufferer (ptyService.ts:828-830) -> directProxy.onProcessData ->
# LocalPty.handleData (localTerminalBackend.ts:152) -> TerminalProcessManager -> xterm.
scenarios:
  - id: bench-t1-create-terminal
    name: "T1: create a terminal: the renderer connects to the pty host (started on demand), creates a pty there, and the shell spawns"
    flow: terminal-create
    fixtures: [full-window]
    expect:
      - "result.ok"
      - >-
        ['terminal-service.create-terminal', 'terminal-process-manager.create-process', 'local-terminal-backend.create-process',
         'local-terminal-backend.connect-to-direct-proxy', 'pty-host-service.ensure-pty-host', 'pty-host-main.start-pty-host',
         'pty-service.create-process', 'local-pty.start', 'pty-service.start', 'terminal-process.start'].all(i,
          trace.exists(e, e.type == 'call.start' && e.interface == i))
      # order: pty host up before the pty is created, created before it is started
      - >-
        trace.filter(e, e.type == 'call.start' && e.interface == 'pty-host-main.start-pty-host')[0].seq
        < trace.filter(e, e.type == 'call.start' && e.interface == 'pty-service.create-process')[0].seq
        && trace.filter(e, e.type == 'call.start' && e.interface == 'pty-service.create-process')[0].seq
        < trace.filter(e, e.type == 'call.start' && e.interface == 'terminal-process.start')[0].seq
      # renderer-side calls run in window w1; the pty host and main process are singletons
      - "calls_by_instance['local-terminal-backend.create-process@w1'] == 1 && calls['pty-host-main.start-pty-host'] == 1"
      - "trace.exists(e, e.type == 'choice' && e.key.endsWith('launch') && e.option == 'spawned')"
      - "state['pty-service'].ptys['1'].started && state['pty-service'].ptys['1'].pid == 4242"
      - "size(state['terminal-service@w1'].instances) == 1"

  - id: bench-t1-gap-data-stream
    name: "T1 gap: shell output streams pty host -> renderer (onProcessData -> LocalPty.handleData)"
    flow: terminal-create
    fixtures: [full-window]
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface.matches('(?i)(process-data|handle-data|on-data)'))"
