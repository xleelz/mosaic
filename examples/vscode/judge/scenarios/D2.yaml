schema_version: 1
id: vscode
# D2 verified: the adapter (js-debug, in the extension host) exits -> debugAdapter.onExit ->
# $acceptDAExit (extHostDebugService.ts:690-695) -> MainThreadDebugService fires the
# ExtensionHostDebugAdapter's exit -> RawDebugSession onExit: code != 0 -> shutdown(new Error('exit code: N'))
# (rawDebugSession.ts:100-107) -> disconnect with a 200 ms timeout because of the error
# (rawDebugSession.ts:602-606) -> stopAdapter -> fireAdapterExitEvent with e.error
# (rawDebugSession.ts:619-645) -> DebugSession.onDidExitAdapter -> shutdown (session Inactive,
# threads cleared) and onDidEndAdapter (debugSession.ts:1482-1506) -> DebugService:
# notificationService.error("Debug adapter process has terminated unexpectedly (exit code: N)")
# (debugService.ts:749-756), onDidEndSession, the toolbar hides once the state is Inactive.
scenarios:
  - id: bench-d2-adapter-exit-teardown
    name: "D2: after F5, the adapter's exit is fed in where RawDebugSession's onExit handler calls shutdown; the session ends"
    fixtures: [full-window]
    state:
      configuration-manager@w1: {selected: Launch Program}
    steps:
      - {flow: debug-start-selected, as: f5}
      # No interface models the adapter process exit ($acceptDAExit / debugAdapter.onExit); this
      # step enters at the handler's target, RawDebugSession.shutdown.
      - interface: raw-debug-session.shutdown
        caller: debug-adapter
        input: {session_id: session-1}
        as: exit
    expect:
      - "steps.f5.result.ok && steps.f5.result.value.started"
      - "steps.exit.result.ok"
      - "state['debug-model@w1'].sessions['session-1'].state == 'inactive'"
      - "calls['debug-session.on-did-exit-adapter'] == 1 && calls['debug-service.on-did-end-adapter'] == 1"
      - "calls['ext-host-debug-service.stop-da-session'] == 1"
      - "ctx.debug_session_ended == 'session-1'"

  - id: bench-d2-gap-error-notification
    name: "D2 gap: an unexpected exit carries the error, the disconnect waits only 200 ms, and the user sees 'Debug adapter process has terminated unexpectedly'"
    fixtures: [full-window]
    state:
      configuration-manager@w1: {selected: Launch Program}
    steps:
      - {flow: debug-start-selected, as: f5}
      # round 2: enter where the code does, debugAdapter.onExit with a non-zero code
      # (rawDebugSession.ts:100-107, modeled by raw-debug-session.on-adapter-exit since the fix round)
      - interface: raw-debug-session.on-adapter-exit
        caller: debug-adapter
        input: {session_id: session-1, code: 1}
        as: exit
    expect:
      - "calls['notification-service.notify'] >= 1"
      - >-
        trace.exists(e, e.type == 'call.start' && e.interface == 'raw-debug-session.send'
        && e.input.command == 'disconnect' && e.input.timeout_ms == 200)
