schema_version: 1
id: vscode
scenarios:
  # X2 (verified/corrected): '*' is not fired by the renderer after startup finished. The extension
  # host activates '*' itself, eagerly, in _startExtensionHost -> _handleEagerExtensions
  # (extHostExtensionService.ts:800-820, 671-686), right after $startExtensionHost opens
  # readyToRunExtensions; onStartupFinished runs only after the eager ('*', workspaceContains,
  # resolver) activations or 10 s (Promise.race, :681-683).
  - id: bench-x2-star-activation-at-host-start
    name: "X2: vscode.git activates on '*' eagerly in eh1 when the host starts, before onStartupFinished"
    fixtures: [full-window]
    state:
      ext-host-extension-service@eh1: {eager_activated: false, ready_to_run: false, started: false}
      extension-host-manager@w1: {has_started: false}
      extension-service@w1: {host_state: stopped, ready: false}
    steps:
      - flow: exthost-start
        as: start
    expect:
      - "steps.start.result.ok && steps.start.result.value.started && steps.start.result.value.ready"
      - "state['extension-registry@w1'].activated == ['vscode.git']"
      - "state['extensions-activator@eh1'].operations == {'vscode.git': 'activated'}"
      - "'*' in state['extensions-activator@eh1'].already_activated_events"
      - "state['ext-host-extension-service@eh1'].started && state['ext-host-extension-service@eh1'].eager_activated"
      - "calls_by_instance['ext-host-extension-service.start-extension-host@eh1'] == 1"
      # path: renderer starts the host, the HOST activates '*' (startup=true) and only then runs onStartupFinished
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['extension-service.initialize','extension-host-manager.start','ext-host-extension-service.start-extension-host','ext-host-extension-service.start-extension-host-internal','ext-host-extension-service.handle-eager-extensions','extensions-activator.activate-by-event','third-party-extension.activate','ext-host-extension-service.activate-all-startup-finished']).map(e, e.interface) == ['extension-service.initialize','extension-host-manager.start','ext-host-extension-service.start-extension-host','ext-host-extension-service.start-extension-host-internal','ext-host-extension-service.handle-eager-extensions','extensions-activator.activate-by-event','third-party-extension.activate','ext-host-extension-service.activate-all-startup-finished']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'extensions-activator.activate-by-event' && e.input.activation_event == '*' && e.input.startup)"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'third-party-extension.activate').map(e, e.input.extension_id) == ['vscode.git']"
      # the renderer itself never sends '*' on this path
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == '*')"
