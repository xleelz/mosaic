schema_version: 1
id: vscode
scenarios:
  # X7 (verified): ExtHostCommands.executeCommand -> _doExecuteCommand: the id is not registered in
  # the extension host, so $executeCommand(id, [], retry=true) crosses RPC (extHostCommands.ts:173-227).
  # MainThreadCommands.$executeCommand: no args, so no retry; ICommandService.executeCommand
  # (mainThreadCommands.ts:80-92). The command service runs the registered SAVE_FILE_COMMAND_ID handler:
  # saveSelectedEditors(..., {reason: EXPLICIT, force: true}, args) on the active editor
  # (fileCommands.ts:505-508), then the save goes as in E1.
  - id: bench-x7-extension-executes-save
    name: "X7: vscode.commands.executeCommand('workbench.action.files.save') from eh1 saves the active dirty editor as in E1"
    flow: exthost-api-call
    fixtures: [full-dirty-editor]
    input:
      api: commands-execute-command
      args: {extension_id: vscode.git, command: workbench.action.files.save}
    expect:
      - "result.ok"
      - "calls_by_instance['main-thread-commands.execute-command@w1'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'main-thread-commands.execute-command' && e.input.command_id == 'workbench.action.files.save' && e.input.retry && size(e.input.args) == 0)"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['vscode-api.commands-execute-command','ext-host-commands.execute-command','main-thread-commands.execute-command','command-service.execute-command','file-commands.cmd-workbench-action-files-save','editor-service.save','text-file-service.save','text-file-models.save','text-file-save-participant.participate','text-file-service.write','file-service.write-file','disk.write-file']).map(e, e.interface) == ['vscode-api.commands-execute-command','ext-host-commands.execute-command','main-thread-commands.execute-command','command-service.execute-command','file-commands.cmd-workbench-action-files-save','editor-service.save','text-file-service.save','text-file-models.save','text-file-save-participant.participate','text-file-service.write','file-service.write-file','disk.write-file']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.save' && e.input.options.reason == 'explicit' && e.input.options.force)"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
      # round 2: the version id lives in the editor's text model (DESIGN §13.1 item 14)
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].saved_version_id == state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2))\\n\""
      - "calls['disk.write-file'] == 1"

  # Control: the same RPC crossing with workbench.action.files.saveFiles, whose modeled handler needs
  # no resource. Shows the extension -> MainThreadCommands -> ICommandService seam works and that the
  # X7 abort is in the save handler's request contract.
  - id: bench-x7-control-save-files
    name: "X7 (control): executeCommand('workbench.action.files.saveFiles') from eh1 crosses RPC and saves the dirty file"
    flow: exthost-api-call
    fixtures: [full-dirty-editor]
    input:
      api: commands-execute-command
      args: {extension_id: vscode.git, command: workbench.action.files.saveFiles}
    expect:
      - "result.ok"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['ext-host-commands.execute-command','main-thread-commands.execute-command','command-service.execute-command','file-commands.cmd-workbench-action-files-savefiles']).map(e, e.interface) == ['ext-host-commands.execute-command','main-thread-commands.execute-command','command-service.execute-command','file-commands.cmd-workbench-action-files-savefiles']"
      - "calls['disk.write-file'] == 1"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
