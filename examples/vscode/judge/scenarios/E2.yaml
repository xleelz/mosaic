schema_version: 1
id: vscode
scenarios:
  - id: bench-e2-format-on-save
    name: "E2: explicit save with editor.formatOnSave formats through the TS formatter before the write; the written content is the formatted text"
    fixtures: [full-format-on-save, editor-ts-providers]
    steps:
      - flow: files-save
        input: {command_id: workbench.action.files.save, resource: "file:///work/app/src/main.ts"}
        as: save
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
    expect:
      - "steps.save.result.ok && steps.save.result.value.result.success"
      - "!steps.get.result.value.model.dirty && steps.get.result.value.model.saved_version_id == steps.get.result.value.model.version_id"
      # formatted text (the provider adds the missing semicolon) is what reaches the disk
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'file-service.write-file')[0].input.content == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""
      # path: participant -> format silent -> provider in eh1 -> edit applied to the text model -> text file model content -> then the write
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['text-file-models.save','format-on-save-participant.participate','format.format-document-with-selected-provider','ext-host-language-features.provide-document-formatting-edits','text-model.push-edit-operations','text-file-models.on-model-content-changed','file-service.write-file']).map(e, e.interface) == ['text-file-models.save','format-on-save-participant.participate','format.format-document-with-selected-provider','ext-host-language-features.provide-document-formatting-edits','text-model.push-edit-operations','text-file-models.on-model-content-changed','file-service.write-file']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'format.format-document-with-selected-provider' && e.input.mode == 'silent')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-language-features.provide-document-formatting-edits' && e.instance == 'eh1')"
