schema_version: 1
id: vscode
scenarios:
  - id: bench-e7-undo-to-saved-is-clean
    name: "E7: type then undo; the text model reverts to the previous text and alternative version; the text file model is clean again"
    fixtures: [full-window, editor-main-open]
    steps:
      - flow: editor-type-text
        as: t
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: dirty
      - flow: editor-run-command
        input: {command_id: undo}
        as: u
      - flow: editor-read-model
        as: r
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: clean
    expect:
      - "steps.dirty.result.value.model.dirty"
      - "steps.r.result.value.value == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\" && steps.r.result.value.alternative_version_id == 1"
      - "!steps.clean.result.value.model.dirty"
      # path: editor undo command -> TextModel.undo -> undo/redo service -> element undo -> text file model content listener (undoing)
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['text-model.undo','undo-redo-service.undo','edit-stack.undo','text-model.apply-undo-redo','text-file-models.on-model-content-changed'] && e.t >= steps.u.start_ms).map(e, e.interface) == ['text-model.undo','undo-redo-service.undo','edit-stack.undo','text-model.apply-undo-redo','text-file-models.on-model-content-changed']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.on-model-content-changed' && e.input.is_undoing_or_redoing && e.input.alternative_version_id == 1)"
      - "calls['undo-redo-service.undo'] == 1 && state['dirty-files-indicator@w1'].badge == 0"

  # The text file model must compare the text model's alternative version with the alternative
  # version remembered at save (bufferSavedVersionId = getAlternativeVersionId(),
  # textFileEditorModel.ts:1107 and 714). Type, undo, save (Ctrl+S forces the save of the clean
  # model), type, undo: the second undo returns to the saved alternative version (1), so the code
  # marks the model clean. The model stores its own version_id as saved_version_id instead.
  - id: bench-e7-undo-to-version-saved-after-undo
    name: "E7b: save right after an undo, type, undo: back at the saved alternative version, clean"
    fixtures: [full-window, editor-main-open]
    steps:
      - flow: editor-type-text
        as: t1
      - flow: editor-run-command
        input: {command_id: undo}
        as: u1
      - flow: files-save
        input: {command_id: workbench.action.files.save, resource: "file:///work/app/src/main.ts"}
        as: save
      - flow: editor-type-text
        input: {args: {text: x}}
        as: t2
      - flow: editor-run-command
        input: {command_id: undo}
        as: u2
      - flow: editor-read-model
        as: text
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: after_undo
    expect:
      - "steps.save.result.ok && steps.save.result.value.result.success"
      - "steps.text.result.value.alternative_version_id == 1 && steps.text.result.value.value == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""
      - "!steps.after_undo.result.value.model.dirty"
