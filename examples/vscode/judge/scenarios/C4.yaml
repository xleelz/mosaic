schema_version: 1
id: vscode
scenarios:
  # Code: NativeWorkingCopyBackupTracker.shouldBackupBeforeShutdown (workingCopyBackupTracker.ts:162-209):
  # reason CLOSE with files.hotExit=onExit backs up only when the window count is 1 on Windows/Linux
  # (the app quits); with other windows open (or macOS) it backs up nothing and confirmBeforeShutdown prompts.
  # files.hotExit default onExit (files.contribution.ts:128).
  - id: bench-c4-close-last-window-hot-exit
    name: "C4: closing the only window with a dirty file backs it up and closes with no prompt"
    flow: window-close
    fixtures: [full-dirty-editor]
    expect:
      - "result.ok"
      - "'file:///work/app/src/main.ts' in state['native-working-copy-backup-service@w1'].backups"
      - "state['native-working-copy-backup-service@w1'].backups['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2))\\n\""
      - "trace.exists(e, e.type == 'note' && e.title == 'Last window closes on Windows/Linux, the app quits, back up')"
      - "trace.exists(e, e.type == 'note' && e.title == 'All modified working copies are backed up, no veto (hot exit)')"
      # no Save / Don't Save / Cancel prompt
      - "!trace.exists(e, e.type == 'note' && e.title == 'No backup; confirm saving the remaining modified working copies')"
      - "calls['text-file-models.save'] == 0"
      # order: onBeforeShutdown, then final veto (backups), then onWillShutdown, then the main process quits
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'native-working-copy-backup-service.backup')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'lifecycle-service.on-will-shutdown')[0].seq"
      - "calls['lifecycle-main-service.before-quit'] == 1"
      - "state['lifecycle-service@w1'].shutdown_reason == 'close'"
  - id: bench-c4-close-one-of-two-windows-prompts
    name: "C4 corrected: with another window open, onExit does not back up and the user is asked; Cancel keeps the window"
    flow: window-close
    fixtures: [full-two-windows]
    state:
      text-file-models@w1:
        models:
          "file:///work/app/src/main.ts": {dirty: true, language_id: typescript, mtime: 1793318400000, saved_version_id: 1, value: "x", version_id: 2}
    choices:
      native-working-copy-backup-tracker.on-final-before-shutdown-decide.confirm: cancel
    expect:
      - "trace.exists(e, e.type == 'note' && e.title == 'No backup; confirm saving the remaining modified working copies')"
      - "!('file:///work/app/src/main.ts' in state['native-working-copy-backup-service@w1'].backups)"
      - "calls['lifecycle-main-service.before-quit'] == 0"
      - "calls['lifecycle-service.on-will-shutdown'] == 0"
  - id: bench-c4-restart-restores-dirty
    name: "C4: after restart the backup resolves the model dirty"
    fixtures: [full-window]
    # the files seed pre-resolves main.ts (scenario state merges into it), so the restored file is util.ts,
    # which has no text file model yet: a fresh renderer after restart.
    state:
      native-working-copy-backup-service@w1:
        backups:
          "file:///work/app/src/util.ts": {content: "export const add = (a: number, b: number) => a + b; // unsaved\n", version_id: 2, meta: {mtime: 1793318400000}}
    steps:
      - interface: native-working-copy-backup-tracker.constructor
        caller: workbench
        input: {}
        as: tracker
      - interface: text-file-models.resolve
        caller: workbench
        input: {resource: "file:///work/app/src/util.ts"}
        as: resolve
    expect:
      - "steps.tracker.result.ok && steps.tracker.result.value.unrestored == 1"
      - "steps.resolve.result.ok"
      - "state['text-file-models@w1'].models['file:///work/app/src/util.ts'].dirty"
      # round 2: text lives in the editor's text model (DESIGN §13.1 item 14), not the text-file model
      - "state['text-model@w1'].models['file:///work/app/src/util.ts'].value == \"export const add = (a: number, b: number) => a + b; // unsaved\\n\""
      - "trace.exists(e, e.type == 'note' && e.title == 'Restored from backup, the model starts dirty')"
