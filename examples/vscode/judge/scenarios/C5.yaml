schema_version: 1
id: vscode
scenarios:
  # Code: EditorGroupView.closeEditor -> handleCloseConfirmation -> doHandleCloseConfirmation
  # (editorGroupView.ts:1738-1883): dirty, not open in another group, autoSave off -> fileDialogService.showSaveConfirm;
  # CANCEL returns veto=true and the editor stays open. files.hotExit plays no part in closing an editor.
  - id: bench-c5-close-dirty-editor-cancel
    name: "C5: closing a dirty editor asks Save / Don't Save / Cancel; Cancel keeps it open"
    flow: workbench-shell-close-editor
    fixtures: [full-dirty-editor]
    choices:
      file-dialog-service.show-save-confirm.confirm: cancel
    expect:
      - "result.ok"
      - "calls['file-dialog-service.show-save-confirm'] == 1"
      - "trace.exists(e, e.type == 'note' && e.title == 'Cancel vetoes the close')"
      - "trace.exists(e, e.type == 'note' && e.title == 'Vetoed, keep the editor open')"
      - "calls['editor-group-view.do-close-editors'] == 0"
      - "calls['text-file-service.save'] == 0 && calls['text-file-service.revert'] == 0"
      - "'file:///work/app/src/main.ts' in state['editor-groups@w1'].groups[0].editors"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
      # the prompt is not a hot-exit decision
      - "calls['native-working-copy-backup-service.backup'] == 0"
  - id: bench-c5-close-dirty-editor-dont-save
    name: "C5 control: Don't Save reverts and closes"
    flow: workbench-shell-close-editor
    fixtures: [full-dirty-editor]
    choices:
      file-dialog-service.show-save-confirm.confirm: dont_save
    expect:
      - "calls['text-file-service.revert'] >= 1 && calls['editor-group-view.do-close-editors'] == 1"
      - "!('file:///work/app/src/main.ts' in state['editor-groups@w1'].groups[0].editors)"
  - id: bench-c5-close-dirty-editor-save
    name: "C5 control: Save saves and closes"
    flow: workbench-shell-close-editor
    fixtures: [full-dirty-editor]
    choices:
      file-dialog-service.show-save-confirm.confirm: save
    expect:
      - "calls['text-file-service.save'] >= 1 && calls['editor-group-view.do-close-editors'] == 1"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
