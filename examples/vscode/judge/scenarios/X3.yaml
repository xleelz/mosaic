schema_version: 1
id: vscode
scenarios:
  # X3 (verified): ActivationOperation._activate catches the throw, stores a FailedExtension,
  # calls $onExtensionActivationError and logs (extHostExtensionActivator.ts:422-452); the
  # activateByEvent promise still resolves. MainThreadExtensionService.$onExtensionActivationError
  # sends telemetry (abstractExtensionService.ts:1289-1304) and, in a built product with no missing
  # dependency, only console.error (mainThreadExtensionService.ts:102-108). The host keeps running.
  - id: bench-x3-activate-throws-others-still-activate
    name: "X3: TS activate() throws; the error is reported, eh1 keeps running, markdown still activates"
    fixtures: [full-window]
    steps:
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:typescript", activation_kind: normal}
        choices: {third-party-extension.activate.outcome: throws}
        as: ts
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:markdown", activation_kind: normal}
        as: md
    expect:
      - "steps.ts.result.ok && steps.ts.result.value.activated == []"
      - "steps.md.result.ok && steps.md.result.value.activated == ['vscode.markdown-language-features']"
      - "state['extensions-activator@eh1'].operations == {'vscode.typescript-language-features': 'failed', 'vscode.markdown-language-features': 'activated'}"
      - "calls_by_instance['main-thread-extension-service.on-extension-activation-error@w1'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'main-thread-extension-service.on-extension-activation-error' && e.input.extension_id == 'vscode.typescript-language-features' && e.input.missing_dependency == '')"
      # built product: console only, no notification
      - "calls['notification-service.notify'] == 0"
      # the host is not affected: no stop, crash or restart
      - "state['extension-service@w1'].host_state == 'running'"
      - "calls['extension-service.do-stop-extension-hosts'] == 0 && calls['extension-service.on-extension-host-crashed'] == 0"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] == 2"
      # the failed extension is not re-activated: its operation is cached as failed (FailedExtension)
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'third-party-extension.activate').map(e, e.input.extension_id) == ['vscode.typescript-language-features', 'vscode.markdown-language-features']"
      # no onDidActivate for the failed one
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'main-thread-extension-service.on-did-activate-extension').map(e, e.input.extension_id) == ['vscode.markdown-language-features']"
