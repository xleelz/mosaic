schema_version: 1
id: vscode
scenarios:
  # A3 verified: McpServer.start -> McpServerConnection.start -> initialize handshake
  # (mcpServerRequestHandler.ts:102-155); with a live handler McpServer._populateLiveData (mcpServer.ts:608,
  # 1224-1260) sends tools/list (mcpServerRequestHandler.ts:510-511, refreshed on
  # notifications/tools/list_changed, 374) and sets server.tools; McpLanguageModelToolContribution._syncTools
  # registers each Model-visible tool with ILanguageModelToolsService.registerTool + McpToolImplementation
  # (mcpLanguageModelToolContribution.ts:118-173). A model tool call -> LanguageModelToolsService.invokeTool ->
  # McpToolImplementation.invoke (265) -> McpServer.callOn (starts if needed, 360-380) -> tools/call
  # (mcpServer.ts:1409, mcpServerRequestHandler.ts:517-518).
  # Correction: tools are also registered from the cached tool list before the server ever starts
  # (cacheState Cached, mcpServer.ts:452-482); the server is started lazily on the first call or by autostart.
  - id: bench-a3-start-server
    name: A3 starting a trusted server runs the MCP initialize handshake and goes Running
    flow: agents-mcp-start-server
    fixtures: [full-window, agents-mcp-servers]
    input: {server_id: github}
    expect:
      - result.ok && result.value.state == 'running'
      - trace.exists(e, e.type == 'call.start' && e.interface == 'allowed-mcp-servers-service.check-server-allowed')
      - trace.exists(e, e.type == 'call.start' && e.interface == 'extension-service.activate-by-event' && e.input.activation_event == 'onMcpCollection:mcp.config.usrlocal')
      - calls['mcp-registry.resolve-connection'] == 1 && calls['mcp-server.initialize'] == 1
      - state['mcp-server-runtime@w1'].servers['github'].state == 'running'
      - state['mcp-server-runtime@w1'].servers['github'].cache_state == 'live'
  # Probe: after initialize the server's tools are listed (tools/list) and registered as LM tools.
  - id: bench-a3-tools-listed-and-registered
    name: A3 tools/list after start, tools registered with the tools service (probe)
    flow: agents-mcp-start-server
    fixtures: [full-window, agents-mcp-servers]
    input: {server_id: github}
    expect:
      - result.ok && result.value.state == 'running'
      - trace.exists(e, e.type == 'call.start' && e.interface.startsWith('mcp-server.') && e.interface.contains('list'))
      - trace.exists(e, e.type == 'call.start' && e.interface.startsWith('language-model-tools-service.register'))
  - id: bench-a3-tool-call-goes-to-server
    name: A3 an MCP tool call starts the server if needed and sends tools/call
    flow: agents-mcp-tool-invoke
    fixtures: [full-window, agents-mcp-servers]
    input: {server_id: github, tool: search_issues}
    expect:
      - result.ok
      - calls['mcp-server.initialize'] == 1 && calls['mcp-server.tools-call'] == 1
      - trace.exists(e, e.type == 'call.start' && e.interface == 'mcp-server.tools-call' && e.input.name == 'search_issues')
      - state['mcp-server-runtime@w1'].servers['github'].state == 'running'
  # Probe: the agent's tool call through LanguageModelToolsService reaches the MCP implementation.
  - id: bench-a3-lm-tool-dispatches-to-mcp
    name: A3 lm-tool-invoke of a registered MCP tool reaches tools/call (probe)
    flow: lm-tool-invoke
    fixtures: [full-window, agents-mcp-servers]
    input: {tool_id: mcp_github_search_issues, call_id: call_7}
    state:
      language-model-tools-service@w1:
        tools:
          mcp_github_search_issues: {has_impl: true, needs_confirmation: false, reference_name: search_issues, source: mcp}
    expect:
      - result.ok
      - calls['mcp-tool-implementation.invoke'] == 1 && calls['mcp-server.tools-call'] == 1
