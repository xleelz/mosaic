schema_version: 1
id: vscode
scenarios:
  # X6 (verified, made precise): workspace.applyEdit -> ExtHostBulkEdits.applyWorkspaceEdit ->
  # $tryApplyWorkspaceEdit(dto, undefined, metadata?.isRefactoring ?? false) (extHostBulkEdits.ts:33) ->
  # MainThreadBulkEdits -> IBulkEditService.apply(edits, {respectAutoSaveConfig: isRefactoring})
  # (mainThreadBulkEdits.ts:31-36) -> BulkEdit.perform -> BulkTextEdits (resolves a model reference,
  # pushes edit operations) -> the text file model becomes dirty. No save, except when
  # metadata.isRefactoring && files.refactoring.autoSave (default true) && more than one resource
  # (bulkEditService.ts:272-274, 332-341), which is not the case here.
  - id: bench-x6-apply-edit-closed-file
    name: "X6: applyEdit on src/main.ts (model resolved by the seed, no editor open): crosses RPC, applies to the text model, dirty, no write"
    flow: exthost-api-call
    fixtures: [full-window]
    input:
      api: workspace-apply-edit
      args:
        extension_id: vscode.git
        edit: {edits: [{resource: "file:///work/app/src/main.ts", text: "// x\n"}]}
    expect:
      - "result.ok && result.value.applied"
      - "calls_by_instance['main-thread-bulk-edits.try-apply-workspace-edit@w1'] == 1 && calls_by_instance['bulk-edit-service.apply@w1'] == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['vscode-api.workspace-apply-edit','ext-host-bulk-edits.apply-workspace-edit','main-thread-bulk-edits.try-apply-workspace-edit','bulk-edit-service.apply','bulk-edit.perform']).map(e, e.interface) == ['vscode-api.workspace-apply-edit','ext-host-bulk-edits.apply-workspace-edit','main-thread-bulk-edits.try-apply-workspace-edit','bulk-edit-service.apply','bulk-edit.perform']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'bulk-edit-service.apply' && !e.input.respect_auto_save_config)"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
      - "calls['text-file-service.save'] == 0 && calls['disk.write-file'] == 0"
      - "state['disk'].files['file:///work/app/src/main.ts'].content == \"import { add } from './util';\\nconsole.log(add(1, 2));\\n\""

  - id: bench-x6-apply-edit-open-dirty-file
    name: "X6: applyEdit on the open (already dirty) editor: applied to the text model, still dirty, no write"
    flow: exthost-api-call
    fixtures: [full-dirty-editor]
    input:
      api: workspace-apply-edit
      args:
        extension_id: vscode.git
        edit: {edits: [{resource: "file:///work/app/src/main.ts", text: "// x\n"}]}
    expect:
      - "result.ok && result.value.applied"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['vscode-api.workspace-apply-edit','ext-host-bulk-edits.apply-workspace-edit','main-thread-bulk-edits.try-apply-workspace-edit','bulk-edit-service.apply','bulk-edit.perform']).map(e, e.interface) == ['vscode-api.workspace-apply-edit','ext-host-bulk-edits.apply-workspace-edit','main-thread-bulk-edits.try-apply-workspace-edit','bulk-edit-service.apply','bulk-edit.perform']"
      - "state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty"
      - "state['text-model@w1'].models['file:///work/app/src/main.ts'].version_id > 2"
      - "calls['text-file-service.save'] == 0 && calls['disk.write-file'] == 0"

  - id: bench-x6-apply-edit-unloaded-file
    name: "X6: applyEdit on src/util.ts, which has no text file model yet: the model is resolved from disk, edited, dirty, not saved"
    flow: exthost-api-call
    fixtures: [full-window]
    input:
      api: workspace-apply-edit
      args:
        extension_id: vscode.git
        edit: {edits: [{resource: "file:///work/app/src/util.ts", text: "// x\n"}]}
    expect:
      - "result.ok && result.value.applied"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'text-file-models.resolve' && e.input.resource == 'file:///work/app/src/util.ts')"
      - "state['text-file-models@w1'].models['file:///work/app/src/util.ts'].dirty"
      - "calls['text-file-service.save'] == 0 && calls['disk.write-file'] == 0"

  # The only auto-save on this path: isRefactoring + files.refactoring.autoSave (true) + > 1 resource.
  - id: bench-x6-apply-edit-refactoring-two-files-saves
    name: "X6 (variant): a refactoring edit across two files is saved when files.refactoring.autoSave is on"
    flow: exthost-api-call
    fixtures: [full-window]
    input:
      api: workspace-apply-edit
      args:
        extension_id: vscode.git
        metadata: {is_refactoring: true}
        edit: {edits: [{resource: "file:///work/app/src/main.ts", text: "// x\n"}, {resource: "file:///work/app/src/util.ts", text: "// y\n"}]}
    expect:
      - "result.ok && result.value.applied"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'bulk-edit-service.apply' && e.input.respect_auto_save_config)"
      - "calls['text-file-service.save'] == 2"
      - "!state['text-file-models@w1'].models['file:///work/app/src/main.ts'].dirty && !state['text-file-models@w1'].models['file:///work/app/src/util.ts'].dirty"
