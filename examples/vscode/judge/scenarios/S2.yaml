schema_version: 1
id: vscode
# S2 verified: search.action.cancel -> cancelSearch(accessor) -> SearchView.cancelSearch
# (searchActionsTopBar.ts:42-52, 282-286; searchView.ts:1434-1440) -> SearchModelImpl.cancelSearch
# cancels currentCancelTokenSource (searchModel.ts:381-387); results already shown stay.
# SearchService races the provider promise with the token (searchService.ts:186-189, 221);
# MainThreadSearch passes the token to $provideTextSearchResults (mainThreadSearch.ts:222-229),
# whose RPC cancellation reaches the extension host; RipgrepTextSearchEngine's
# token.onCancellationRequested -> cancel() -> rgProc.kill() (ripgrepTextSearchEngine.ts:68, 109-115).
scenarios:
  - id: bench-s2-cancel-keeps-results
    name: "S2: search, then search.action.cancel: the token is canceled and results already received stay in the view"
    fixtures: [full-window]
    steps:
      - {flow: search-find-in-files, as: find}
      - interface: search-actions.cmd-search-action-cancel
        caller: user
        input: {command_id: search.action.cancel}
        as: cancel
    expect:
      - "steps.find.result.ok && steps.cancel.result.ok"
      # the code only cancels the token; the model's handler calls search-model.clear instead
      - "calls['search-model.clear'] == 0"
      - "size(state['search-model@w1'].results) > 0"

  - id: bench-s2-token-canceled-before-provider
    name: "S2 (what the model can express): a token canceled while providers activate rejects with Canceled before the provider is asked"
    fixtures: [full-window]
    steps:
      - interface: search-service.text-search-split-sync-async
        caller: search-model
        input:
          query: {pattern: add, folders: ["file:///work/app"], max_results: 20000}
          token: {canceled: true}
        as: s
    expect:
      - "!steps.s.result.ok && steps.s.result.error.code == 'canceled'"
      - "calls['ext-host-search.provide-text-search-results'] == 0"
