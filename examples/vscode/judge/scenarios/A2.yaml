schema_version: 1
id: vscode
scenarios:
  # A2 verified (languageModelToolsService.ts:493-760): the invocation part is appended to the response
  # (651-658); when prepareToolInvocation returns confirmationMessages and nothing auto-confirms
  # (shouldAutoConfirm 1409-1435; chat.tools.global.autoApprove default false, chat.shared.contribution.ts:832-833)
  # it awaits IChatToolInvocation.awaitConfirmation (679-681). Denied -> throw CancellationError (684-686);
  # the Copilot loop turns that into the tool result "The user cancelled the tool call." (isCancelled)
  # (extensions/copilot/src/extension/prompts/node/panel/toolCalling.tsx:694-697). Skipped -> a text result
  # (687-695). Approved -> impl.invoke (741-745), for an extension tool via $invokeTool on the extension host.
  - id: bench-a2-approve-runs
    name: A2 approving the confirmation runs the extension tool on eh1
    flow: lm-tool-invoke
    fixtures: [full-window]
    input: {tool_id: copilot_findFiles, call_id: call_9}
    state:
      language-model-tools-service@w1:
        tools:
          copilot_findFiles: {extension: GitHub.copilot-chat, has_impl: true, needs_confirmation: true, reference_name: fileSearch, source: extension}
    choices:
      chat-tool-invocation.await-confirmation.user_confirmation: allow
    expect:
      - result.ok && result.value.outcome == 'completed' && result.value.confirmed_by == 'user-action'
      - trace.exists(e, e.type == 'call.end' && e.interface == 'chat-tool-invocation.begin' && e.output.state == 'waiting-for-confirmation')
      - trace.exists(e, e.type == 'choice' && e.key == 'chat-tool-invocation.await-confirmation.user_confirmation' && e.option == 'allow')
      - calls_by_instance['ext-host-language-model-tools.invoke-tool@eh1'] == 1
      - state['chat-tool-invocation@w1'].invocations['call_9'].state == 'completed'
  - id: bench-a2-deny-refuses
    name: A2 denying the confirmation never runs the tool and fails with a cancellation
    flow: lm-tool-invoke
    fixtures: [full-window]
    input: {tool_id: copilot_findFiles, call_id: call_9}
    state:
      language-model-tools-service@w1:
        tools:
          copilot_findFiles: {extension: GitHub.copilot-chat, has_impl: true, needs_confirmation: true, reference_name: fileSearch, source: extension}
    choices:
      chat-tool-invocation.await-confirmation.user_confirmation: deny
    expect:
      - "!result.ok && result.error.code == 'canceled'"
      - calls['ext-host-language-model-tools.invoke-tool'] == 0
      - calls['chat-tool-invocation.complete'] == 0
      - state['chat-tool-invocation@w1'].invocations['call_9'].state == 'denied'
  - id: bench-a2-accept-command-then-run
    name: A2 the Accept command confirms the waiting invocation, which then runs
    fixtures: [full-window]
    state:
      language-model-tools-service@w1:
        tools:
          copilot_findFiles: {extension: GitHub.copilot-chat, has_impl: true, needs_confirmation: true, reference_name: fileSearch, source: extension}
      chat-tool-invocation@w1:
        invocations:
          call_9: {confirmed_by: '', state: waiting-for-confirmation, tool_id: copilot_findFiles}
    steps:
      - {flow: chat-accept-tool, as: a, input: {call_id: call_9}}
      - {flow: lm-tool-invoke, as: i, input: {tool_id: copilot_findFiles, call_id: call_9}}
    expect:
      - steps.a.result.value.confirmed
      - steps.i.result.ok && steps.i.result.value.outcome == 'completed' && steps.i.result.value.confirmed_by == 'user-action'
      - "!trace.exists(e, e.type == 'choice' && e.key == 'chat-tool-invocation.await-confirmation.user_confirmation')"
      - calls_by_instance['ext-host-language-model-tools.invoke-tool@eh1'] == 1
  - id: bench-a2-no-confirmation-needed
    name: A2 control - a tool that needs no confirmation runs without waiting
    flow: lm-tool-invoke
    fixtures: [full-window]
    input: {tool_id: manage_todo_list, call_id: call_8}
    expect:
      - result.ok && result.value.confirmed_by == 'confirmation-not-needed'
      - calls['chat-tool-invocation.await-confirmation'] == 0
