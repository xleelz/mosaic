schema_version: 1
id: vscode
scenarios:
  # X8 (verified, made precise): with security.workspace.trust.enabled (default true) and the folder
  # untrusted, ExtensionEnablementService gives every extension whose manifest says
  # capabilities.untrustedWorkspaces.supported == false the state DisabledByTrustRequirement
  # (extensionEnablementService.ts:494-495, 600-610; extensionManifestPropertiesService.ts:314-340;
  # product.json has no extensionUntrustedWorkspaceSupport overrides). _resolveExtensions keeps only
  # enabled extensions (checkEnabledAndProposedAPI(..., ignoreWorkspaceTrust=false),
  # abstractExtensionService.ts:525-533, 1441-1477), so they are never registered or sent to eh1.
  # git and typescript-language-features declare supported: false; markdown-language-features
  # declares 'limited' and stays enabled. WorkspaceTrustUXHandler.updateWorkbenchIndicators shows the
  # restricted-mode banner (security.workspace.trust.banner = untilDismissed, not dismissed) with
  # Manage / Learn More (workspace.contribution.ts:432-443, 555-590). The startup modal is not shown:
  # security.workspace.trust.startupPrompt defaults to 'never' (workspace.contribution.ts:806-808).
  - id: bench-x8-untrusted-ts-not-activated
    name: "X8: restricted mode: opening a .ts file does not activate typescript-language-features"
    fixtures: [full-untrusted]
    # round 2: the trust filter runs when the window resolves and registers extensions
    # (abstractExtensionService.ts:466-487, 525-533); full-untrusted seeds a registry as if that had
    # already happened without the filter, so start the hosts first, from stopped.
    state:
      ext-host-extension-service@eh1: {eager_activated: false, ready_to_run: false, started: false}
      extension-host-manager@w1: {has_started: false}
      extension-service@w1: {host_state: stopped, ready: false}
    steps:
      - flow: exthost-start
        as: start
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:typescript", activation_kind: normal}
        as: ts
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:markdown", activation_kind: normal}
        as: md
    expect:
      - "steps.ts.result.ok && steps.ts.result.value.activated == []"
      - "!('vscode.typescript-language-features' in state['extension-registry@w1'].activated)"
      - "!('vscode.typescript-language-features' in state['extension-registry@w1'].extensions)"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] == 1"
      # markdown supports untrusted workspaces ('limited'), so it still activates
      - "steps.md.result.ok && steps.md.result.value.activated == ['vscode.markdown-language-features']"

  - id: bench-x8-untrusted-startup-no-git
    name: "X8: restricted mode: the host starts without git ('*' activates nothing) and the banner shows"
    fixtures: [full-untrusted]
    state:
      ext-host-extension-service@eh1: {eager_activated: false, ready_to_run: false, started: false}
      extension-host-manager@w1: {has_started: false}
      extension-service@w1: {host_state: stopped, ready: false}
    steps:
      - flow: exthost-start
        as: start
      # round 2: the banner comes from the WorkspaceTrustUXHandler contribution once trust is
      # initialized (workspace.contribution.ts:488-523 -> updateWorkbenchIndicators 432-444), not
      # from the extension host start; run that startup entry too.
      - interface: workspace-trust-ux-handler.show-modal-on-start
        caller: workbench
        as: trust
    expect:
      - "steps.start.result.ok && steps.start.result.value.started"
      - "size(state['extension-registry@w1'].activated) == 0"
      - "calls['third-party-extension.activate'] == 0"
      - "trace.exists(e, e.type == 'call.start' && e.component == 'banner-part')"
