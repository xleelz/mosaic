schema_version: 1
id: vscode
scenarios:
  # Code: EditorGroupModel.openEditor finds the existing editor (findEditor) and only re-activates/pins it
  # (editorGroupModel.ts:290-296, 404-425); the editor pane then resolves the input through
  # TextFileEditorModelManager.resolve, which returns the existing model without creating one
  # (textFileEditorModelManager.ts:380-428). Default workbench.editor.revealIfOpen=false only matters with several groups.
  - id: bench-c7-open-already-open
    name: "C7: opening a file already open in the group activates the existing editor, no second model"
    flow: workbench-shell-open-editor
    fixtures: [full-window]
    state:
      editor-groups@w1:
        active_group: 1
        groups:
          - {id: 1, active: "file:///work/app/src/util.ts", editors: ["file:///work/app/src/main.ts", "file:///work/app/src/util.ts"], preview: null, sticky: [], mru: ["file:///work/app/src/util.ts", "file:///work/app/src/main.ts"], locked: false}
    input:
      resource: file:///work/app/src/main.ts
    expect:
      - "result.ok && result.value.opened && !result.value.is_new"
      - "trace.exists(e, e.type == 'note' && e.title == 'Existing editor, pin it if asked and make it active')"
      - "state['editor-groups@w1'].groups[0].active == 'file:///work/app/src/main.ts'"
      - "size(state['editor-groups@w1'].groups[0].editors) == 2"
      - "calls['model-service.create-model'] == 0"
      # code path: the pane resolves the input via TextFileEditorModelManager.resolve, which reuses the model
      - "calls['text-file-models.resolve'] == 1"
  - id: bench-c7-open-new-control
    name: "C7 control: opening a file that is not open adds an editor (and would resolve a model)"
    flow: workbench-shell-open-editor
    fixtures: [full-window]
    input:
      resource: file:///work/app/src/util.ts
    expect:
      - "result.ok && result.value.is_new"
      - "'file:///work/app/src/util.ts' in state['editor-groups@w1'].groups[0].editors"
      - "calls['text-file-models.resolve'] == 1"
