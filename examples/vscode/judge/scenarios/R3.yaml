schema_version: 1
id: vscode
scenarios:
  - id: bench-r3-oss-no-marketplace
    name: "R3 (deployed OSS product.json, no extensionsGallery): install by id fails at the gallery query; nothing is downloaded"
    flow: rs-ext-install
    fixtures: [full-window]
    input: {arg: ms-python.python}
    expect:
      - "!result.ok && result.error.code == 'no-extension-gallery-service-configured'"
      - "calls['extension-gallery-service.get-extensions'] == 1 && calls['marketplace-gallery-endpoint.extension-query'] == 0"
      - "calls['extension-management-channel.install-from-gallery'] == 0 && calls['extensions-downloader.download'] == 0"
      - "!('ms-python.python' in state['extensions-profile-scanner-service'].profile_extensions)"
  - id: bench-r3-marketplace-install
    name: "R3 (Marketplace-enabled product): query, install over the 'extensions' channel: download, verify, extract, add to profile, fire onDidInstallExtensions, delta into the running host"
    flow: rs-ext-install
    fixtures: [full-window, remote-server-marketplace]
    input: {arg: ms-python.python}
    expect:
      - "result.ok"
      - "state['extensions-profile-scanner-service'].profile_extensions['ms-python.python'].version == '2026.18.0'"
      # path order: gallery query -> workbench ExtensionManagementService -> 'extensions' channel -> node ExtensionManagementService
      #   -> download VSIX -> signature archive + verify -> extract -> add to profile
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['extension-gallery-service.get-extensions','extension-management-service.install-from-gallery','extension-management-channel.install-from-gallery','node-extension-management-service.install-from-gallery','extensions-downloader.download','extension-signature-verification-service.verify','extensions-scanner.extract-user-extension','extensions-profile-scanner-service.add-extensions-to-profile']).map(e, e.interface) == ['extension-gallery-service.get-extensions','extension-management-service.install-from-gallery','extension-management-channel.install-from-gallery','node-extension-management-service.install-from-gallery','extensions-downloader.download','extension-signature-verification-service.verify','extensions-scanner.extract-user-extension','extensions-profile-scanner-service.add-extensions-to-profile']"
      - "calls['extensions-workbench-service.on-did-install-extensions'] >= 1"
  - id: bench-r3-marketplace-install-no-reload
    name: "R3 (path): the installed extension is added to the running extension host without a reload (deltaExtensions)"
    flow: rs-ext-install
    fixtures: [full-window, remote-server-marketplace]
    input: {arg: ms-python.python}
    expect:
      # code: ExtensionService listens to IWorkbenchExtensionManagementService.onDidInstallExtensions / profile changes,
      # then _handleDeltaExtensions -> canAddExtension -> extensionHostManager.deltaExtensions
      - "calls['extension-service.handle-delta-extensions'] >= 1 || calls['extension-host-manager.delta-extensions'] >= 1"
