schema_version: 1
id: vscode
scenarios:
  - id: bench-e9-external-change-clean-model
    name: "E9: src/main.ts changes on disk while open and clean; the change event reloads the model with the new content, no prompt"
    fixtures: [full-window, editor-main-open]
    state:
      disk:
        files:
          file:///work/app/src/main.ts:
            content: "// changed on disk\n"
            mtime: 1793318500000
            size: 19
    steps:
      # entry is the TextFileEditorModelManager listener: no flow starts at the watcher / file service
      - flow: files-external-change
        input: {changes: [{resource: "file:///work/app/src/main.ts", type: updated}]}
        as: change
      - flow: files-model-get
        input: {resource: "file:///work/app/src/main.ts"}
        as: get
      - flow: editor-read-model
        input: {uri: "file:///work/app/src/main.ts"}
        as: text
    expect:
      - "steps.change.result.ok && steps.change.result.value.reloaded == ['file:///work/app/src/main.ts']"
      - "!steps.get.result.value.model.dirty && steps.get.result.value.model.value == '// changed on disk\\n'"
      # no prompt of any kind
      - "calls['notification-service.notify'] == 0 && calls['dialog-service.confirm'] == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['text-file-models.on-did-files-change','text-file-models.resolve','file-service.read-file']).map(e, e.interface) == ['text-file-models.on-did-files-change','text-file-models.resolve','file-service.read-file']"
      # the editor's buffer (the same TextModel in the code) shows the new content
      - "steps.text.result.value.value == '// changed on disk\\n'"
