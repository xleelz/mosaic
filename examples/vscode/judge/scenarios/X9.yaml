schema_version: 1
id: vscode
scenarios:
  # X9 (verified): each renderer window has its own NativeExtensionService and its own local
  # extension host process (one ExtensionHostManager per window; the main process
  # ExtensionHostStarter spawns one utility process per request). activateByEvent only reaches the
  # managers of its own window (abstractExtensionService.ts:1027-1053).
  - id: bench-x9-two-windows-isolated
    name: "X9: activating onLanguage:typescript in w1 runs only in eh1; w2/eh2 are untouched until w2 asks"
    fixtures: [full-two-windows]
    steps:
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:typescript", activation_kind: normal}
        on: w1
        as: w1act
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:typescript", activation_kind: normal}
        on: w2
        as: w2act
    expect:
      - "steps.w1act.result.ok && steps.w1act.result.value.activated == ['vscode.typescript-language-features']"
      - "steps.w2act.result.ok && steps.w2act.result.value.activated == ['vscode.typescript-language-features']"
      # each window's request went to its own host, exactly once
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] == 1 && calls_by_instance['ext-host-extension-service.activate-by-event@eh2'] == 1"
      - "calls_by_instance['extension-host-manager.activate-by-event@w1'] == 1 && calls_by_instance['extension-host-manager.activate-by-event@w2'] == 1"
      - "state['extension-registry@w1'].activated == ['vscode.typescript-language-features'] && state['extension-registry@w2'].activated == ['vscode.typescript-language-features']"
      - "state['extensions-activator@eh1'].operations == {'vscode.typescript-language-features': 'activated'} && state['extensions-activator@eh2'].operations == {'vscode.typescript-language-features': 'activated'}"
      # the second window's activation was not a cache hit from the first
      - "!steps.w2act.result.value.cached"
      # TS activate() ran twice in total: once per host
      - "calls['third-party-extension.activate'] == 2"

  - id: bench-x9-w1-only
    name: "X9: activating in w1 leaves w2's registry and eh2's activator untouched"
    fixtures: [full-two-windows]
    steps:
      - flow: exthost-activate-by-event
        input: {activation_event: "onLanguage:typescript", activation_kind: normal}
        on: w1
        as: w1act
    expect:
      - "steps.w1act.result.ok && steps.w1act.result.value.activated == ['vscode.typescript-language-features']"
      - "calls_by_instance['ext-host-extension-service.activate-by-event@eh1'] == 1"
      - "!('ext-host-extension-service.activate-by-event@eh2' in calls_by_instance) || calls_by_instance['ext-host-extension-service.activate-by-event@eh2'] == 0"
      - "size(state['extension-registry@w2'].activated) == 0"
      - "!('extensions-activator@eh2' in state) || size(state['extensions-activator@eh2'].operations) == 0"
      - "state['extension-registry@w1'].activated == ['vscode.typescript-language-features']"
