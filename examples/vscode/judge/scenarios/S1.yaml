schema_version: 1
id: vscode
# S1 verified: search.maxResults defaults to DEFAULT_MAX_SEARCH_RESULTS = 20000
# (search.common.contribution.ts:83-87, search.ts:32) and SearchView puts it in the query
# (searchView.ts:1670). SearchService.textSearchSplitSyncAsync searches open editors locally
# and the rest through the provider for the scheme (searchService.ts:116-222, 271-327). For
# file:// the provider is the extension host's RipgrepSearchProvider (api/node/extHostSearch.ts:93-101),
# reached through MainThreadSearch $provideTextSearchResults (mainThreadSearch.ts:222-229). It
# spawns rg in a child process of the extension host (ripgrepTextSearchEngine.ts:83), streams
# matches through progress (:97-105, $handleTextMatch -> onProgress), and when the parser counts
# maxResults it emits hitLimit, kills rg and resolves {limitHit: true}
# (ripgrepTextSearchEngine.ts:117-121, 160-161, 386).
scenarios:
  - id: bench-s1-text-search
    name: "S1: Find in files 'add': the query (maxResults 20000) goes from the search view through SearchService to the extension host's text search provider"
    flow: search-find-in-files
    fixtures: [full-window]
    expect:
      - "result.ok"
      - "config['search-max-results'] == 20000"
      - >-
        trace.exists(e, e.type == 'call.start' && e.interface == 'ext-host-search.provide-text-search-results'
        && e.instance == 'eh1' && e.input.scheme == 'file' && e.input.query.max_results == 20000)
      - >-
        trace.filter(e, e.type == 'call.start' && e.interface == 'search-service.text-search-split-sync-async')[0].seq
        < trace.filter(e, e.type == 'call.start' && e.interface == 'ext-host-search.provide-text-search-results')[0].seq
      - "calls_by_instance['ext-host-search.provide-text-search-results@eh1'] == 1"
      - "state['search-view@w1'].result_count > 0 && !state['search-view@w1'].limit_hit"

  - id: bench-s1-gap-provider-limit
    name: "S1 gap: with search.maxResults 2 the ripgrep provider stops at 2 results and reports limitHit"
    flow: search-find-in-files
    fixtures: [full-window]
    config:
      search-max-results: 2
    expect:
      - "result.ok"
      - "state['search-view@w1'].limit_hit"
      - "state['search-view@w1'].result_count <= 2"
