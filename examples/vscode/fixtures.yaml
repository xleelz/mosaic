          "file:///work/app/.vscode/tasks.json": {content: "{\"version\":\"2.0.0\",\"tasks\":[{\"label\":\"build\",\"type\":\"shell\",\"command\":\"tsc -p .\",\"group\":\"build\",\"problemMatcher\":[\"$tsc\"]}]}\n", mtime: 1793318400000, size: 126}
          "file:///work/app/.git/HEAD": {content: "ref: refs/heads/main\n", mtime: 1793318400000, size: 21}
      git-binary: {repositories: {"/work/app": {head: main, branches: [main], user: {name: dev, email: dev@example.com}, staged: [], changes: []}}}
      settings-store: {user: {}, workspace: {}}
      storage-db: {global: {}, workspace: {}}

  - id: one-window-folder
    summary: "base-workspace opened in window w1, with extension host eh1 running; built-in extensions registered, none activated; folder trusted."
    extends: [base-workspace]
    topology: {workbench-window: [w1], extension-host: [eh1]}
    state:
      "workspace-context@w1": {folders: ["file:///work/app"], trusted: true}
      "editor-groups@w1": {groups: [{id: 1, editors: [], active: null}], active_group: 1}
      "text-file-models@w1": {models: {}}
      "extension-registry@w1":
        activated: []
        extensions:
          vscode.git: {activation_events: ["*"], main: "./out/main", enabled: true}
          vscode.typescript-language-features: {activation_events: ["onLanguage:typescript", "onLanguage:javascript"], main: "./out/extension", enabled: true}
          vscode.markdown-language-features: {activation_events: ["onLanguage:markdown"], main: "./out/extension", enabled: true}
          ms-vscode.js-debug: {activation_events: ["onDebugResolve:node", "onDebugInitialConfigurations", "onDebugDynamicConfigurations"], main: "./src/extension.js", enabled: true}

  - id: two-windows
    summary: "w1 on /work/app and w2 on /work/lib, with extension hosts eh1 and eh2."
    extends: [one-window-folder]
    topology: {workbench-window: [w1, w2], extension-host: [eh1, eh2]}
    state:
      disk:
        files:
          "file:///work/lib": {type: directory, mtime: 1793318400000, size: 0}
          "file:///work/lib/index.ts": {content: "export const lib = 1;\n", mtime: 1793318400000, size: 22}
      "workspace-context@w2": {folders: ["file:///work/lib"], trusted: true}
      "editor-groups@w2": {groups: [{id: 1, editors: [], active: null}], active_group: 1}
      "text-file-models@w2": {models: {}}
      "extension-registry@w2":
        activated: []
        extensions:
          vscode.git: {activation_events: ["*"], main: "./out/main", enabled: true}
          vscode.typescript-language-features: {activation_events: ["onLanguage:typescript", "onLanguage:javascript"], main: "./out/extension", enabled: true}

  - id: untrusted-folder
    summary: "one-window-folder, with the folder not trusted (restricted mode)."
    extends: [one-window-folder]
    state:
      "workspace-context@w1": {folders: ["file:///work/app"], trusted: false}

  - id: dirty-editor
    summary: "one-window-folder with src/main.ts open in group 1 and modified (version 2, unsaved)."
    extends: [one-window-folder]
    state:
      "editor-groups@w1": {groups: [{id: 1, editors: ["file:///work/app/src/main.ts"], active: "file:///work/app/src/main.ts"}], active_group: 1}
      # Document text has one owner (shared_data document-text): the editor's text-model holds
      # the text and versions; text-file models hold only file state (FIXES.md contract 2).
      "text-model@w1":
        models:
          "file:///work/app/src/main.ts": {value: "import { add } from './util';\nconsole.log(add(1, 2))\n", version_id: 2, alternative_version_id: 2, language_id: typescript}
      "text-file-models@w1":
        models:
          "file:///work/app/src/main.ts": {saved_version_id: 1, dirty: true, mtime: 1793318400000}

  - id: format-on-save
    summary: "dirty-editor with editor.formatOnSave enabled."
    extends: [dirty-editor]
    config: {editor-format-on-save: true}

  - id: auto-save-after-delay
    summary: "one-window-folder with files.autoSave = afterDelay (1000 ms)."
    extends: [one-window-folder]
    config: {files-auto-save: "afterDelay"}

