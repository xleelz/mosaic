# Shared worlds for the VS Code ontology (pipeline stage 3). Owned by the coordinator.
# Configs here are references (attributes.boundary). The owning area defines the real
# entity with its full sources, and the merge defers to it (DESIGN §13.1 item 4).
schema_version: 1
id: vscode

configs:
  - {id: files-auto-save, type: string, value: "off", default: "off", summary: "files.autoSave (desktop default off; afterDelay on web)", sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:261-263"], attributes: {boundary: true, owner: files-search-scm, key: files.autoSave}}
  - {id: files-auto-save-delay, type: integer, value: 1000, default: 1000, summary: "files.autoSaveDelay in ms", sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:275-277"], attributes: {boundary: true, owner: files-search-scm, key: files.autoSaveDelay}}
  - {id: files-hot-exit, type: string, value: "onExit", default: "onExit", summary: "files.hotExit", sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:321"], attributes: {boundary: true, owner: main-process, key: files.hotExit}}
  - {id: editor-format-on-save, type: boolean, value: false, default: false, summary: "editor.formatOnSave (no registered default, so false)", sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:391-394"], attributes: {boundary: true, owner: files-search-scm, key: editor.formatOnSave}}
  - {id: editor-format-on-save-mode, type: string, value: "file", default: "file", summary: "editor.formatOnSaveMode", sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:396-398"], attributes: {boundary: true, owner: editor, key: editor.formatOnSaveMode}}
  - {id: files-participants-timeout, type: integer, value: 60000, default: 60000, summary: "files.participants.timeout in ms", sources: ["src/vs/workbench/contrib/files/browser/files.contribution.ts:380-382"], attributes: {boundary: true, owner: files-search-scm, key: files.participants.timeout}}
  - {id: security-workspace-trust-enabled, type: boolean, value: true, default: true, summary: "security.workspace.trust.enabled", sources: ["src/vs/workbench/contrib/workspace/browser/workspace.contribution.ts:799-801"], attributes: {boundary: true, owner: workbench-shell, key: security.workspace.trust.enabled}}
  - {id: extensions-auto-update, type: string, value: "on", default: "on", summary: "extensions.autoUpdate", sources: ["src/vs/workbench/contrib/extensions/browser/extensions.contribution.ts:139-140"], attributes: {boundary: true, owner: remote-server, key: extensions.autoUpdate}}
