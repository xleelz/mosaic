# Shared starting worlds for the Cassandra ontology (DESIGN.md §11.7).
# Owned by the coordinator; see notes/fixtures.md for the per-component seeding
# contract. Instances are n1..n4; endpoint strings such as 10.0.0.1 are gone.
# Generated from one table and node list so every copy of the schema, the ring
# and the gossip view agrees (schema version digest included).
schema_version: 1
id: cassandra
fixtures:
- id: base-schema
  name: Base schema
  summary: 'Keyspaces ks1 and shop (SimpleStrategy, RF 3) with every table the areas use, seeded on every component that keeps a keyspace or table list. Plain keys: the same on every node.'
  state:
    schema:
      version: v:index:shop.users_city_sai{users.city};index:shop.users_email_idx{users.email};keyspace:ks1{SimpleStrategy:3};keyspace:shop{SimpleStrategy:3};table:ks1.events{id timeuuid,payload text};table:ks1.page_views{url text,views bigint};table:ks1.users{id text,name text,email text,city text};table:shop.accounts{id uuid,balance decimal};table:shop.entries{id uuid,body text};table:shop.orders{id uuid,total decimal};table:shop.page_views{url text,views bigint};table:shop.users{id text,name text,email text,city text}
      keyspaces:
        ks1: {name: ks1, exists: true, durable_writes: true, replication: {class: SimpleStrategy, replication_factor: 3}, tables: [events, page_views, users]}
        shop: {name: shop, exists: true, durable_writes: true, replication: {class: SimpleStrategy, replication_factor: 3}, tables: [accounts, entries, orders, page_views, users]}
    schema-keyspace:
      rows:
        index:shop.users_city_sai: {kind: index, keyspace: shop, name: users_city_sai, def: {table: users, column: city, kind: sai}, sig: 'index:shop.users_city_sai{users.city}'}
        index:shop.users_email_idx: {kind: index, keyspace: shop, name: users_email_idx, def: {table: users, column: email, kind: legacy_local_table}, sig: 'index:shop.users_email_idx{users.email}'}
        keyspace:ks1: {kind: keyspace, keyspace: ks1, name: ks1, def: {class: SimpleStrategy, replication_factor: 3}, sig: 'keyspace:ks1{SimpleStrategy:3}'}
        keyspace:shop: {kind: keyspace, keyspace: shop, name: shop, def: {class: SimpleStrategy, replication_factor: 3}, sig: 'keyspace:shop{SimpleStrategy:3}'}
        table:ks1.events: {kind: table, keyspace: ks1, name: events, def: {columns: [id timeuuid, payload text], partition_key: [id]}, sig: 'table:ks1.events{id timeuuid,payload text}'}
        table:ks1.page_views: {kind: table, keyspace: ks1, name: page_views, def: {columns: [url text, views bigint], partition_key: [url]}, sig: 'table:ks1.page_views{url text,views bigint}'}
        table:ks1.users: {kind: table, keyspace: ks1, name: users, def: {columns: [id text, name text, email text, city text], partition_key: [id]}, sig: 'table:ks1.users{id text,name text,email text,city text}'}
        table:shop.accounts: {kind: table, keyspace: shop, name: accounts, def: {columns: [id uuid, balance decimal], partition_key: [id]}, sig: 'table:shop.accounts{id uuid,balance decimal}'}
        table:shop.entries: {kind: table, keyspace: shop, name: entries, def: {columns: [id uuid, body text], partition_key: [id]}, sig: 'table:shop.entries{id uuid,body text}'}
        table:shop.orders: {kind: table, keyspace: shop, name: orders, def: {columns: [id uuid, total decimal], partition_key: [id]}, sig: 'table:shop.orders{id uuid,total decimal}'}
        table:shop.page_views: {kind: table, keyspace: shop, name: page_views, def: {columns: [url text, views bigint], partition_key: [url]}, sig: 'table:shop.page_views{url text,views bigint}'}
        table:shop.users: {kind: table, keyspace: shop, name: users, def: {columns: [id text, name text, email text, city text], partition_key: [id]}, sig: 'table:shop.users{id text,name text,email text,city text}'}
    keyspace:
      durable_writes: {ks1: true, shop: true, system: true}
      tables:
        ks1.events: {cdc: false, skip_commitlog: false}
        ks1.page_views: {cdc: false, skip_commitlog: false}
        ks1.users: {cdc: false, skip_commitlog: false}
        shop.accounts: {cdc: false, skip_commitlog: false}
        shop.entries: {cdc: false, skip_commitlog: false}
        shop.orders: {cdc: false, skip_commitlog: false}
        shop.page_views: {cdc: false, skip_commitlog: false}
        shop.users: {cdc: false, skip_commitlog: false}
        system.batches: {cdc: false, skip_commitlog: false}
    column-family-store:
      tables:
        ks1.events: {durable_writes: true, allow_auto_snapshot: true}
        ks1.page_views: {durable_writes: true, allow_auto_snapshot: true}
        ks1.users: {durable_writes: true, allow_auto_snapshot: true}
        shop.accounts: {durable_writes: true, allow_auto_snapshot: true}
        shop.entries: {durable_writes: true, allow_auto_snapshot: true}
        shop.orders: {durable_writes: true, allow_auto_snapshot: true}
        shop.page_views: {durable_writes: true, allow_auto_snapshot: true}
        shop.users: {durable_writes: true, allow_auto_snapshot: true}
        system.batches: {durable_writes: true, allow_auto_snapshot: false}
    view-manager: {views_by_base_table: {ks1.events: [], ks1.page_views: [], ks1.users: [], shop.accounts: [], shop.entries: [], shop.orders: [], shop.page_views: [], shop.users: []}}
    secondary-index-manager: {indexes: {shop.users.email: {name: users_email_idx, kind: legacy_local_table, sstable_indexes: 0}, shop.users.city: {name: users_city_sai, kind: sai, sstable_indexes: 3}}}
    token-metadata: {default_rf: 3, keyspace_rf: {ks1: 3, shop: 3}}
    storage-service:
      distributed_keyspaces: [ks1, shop]
      user_tables:
      - {keyspace: ks1, table: events}
      - {keyspace: ks1, table: page_views}
      - {keyspace: ks1, table: users}
      - {keyspace: shop, table: accounts}
      - {keyspace: shop, table: entries}
      - {keyspace: shop, table: orders}
      - {keyspace: shop, table: page_views}
      - {keyspace: shop, table: users}
    abstract-replication-strategy: {strategies: {default: SimpleStrategy, ks1: SimpleStrategy, shop: SimpleStrategy}}
    storage-service-mbean:
      keyspaces: [system, system_schema, system_auth, system_distributed, system_traces, ks1, shop]
      distributed_keyspaces: [system_auth, system_distributed, system_traces, ks1, shop]
      tables:
        system: [local, peers_v2]
        system_schema: [tables]
        system_auth: [roles]
        system_distributed: [repair_history]
        system_traces: [sessions, events]
        ks1: [events, page_views, users]
        shop: [accounts, entries, orders, page_views, users]
    repair-coordinator: {schema_tables: {ks1: [events, page_views, users], shop: [accounts, entries, orders, page_views, users]}}
    snapshot-manager: {schema_tables: {ks1: [events, page_views, users], shop: [accounts, entries, orders, page_views, users]}}
    auto-repair: {keyspaces: [ks1, shop]}
    cassandra-table-repair-manager: {digests: {ks1.events: d41d8cd9, ks1.page_views: d41d8cd9, ks1.users: d41d8cd9, shop.accounts: d41d8cd9, shop.entries: d41d8cd9, shop.orders: d41d8cd9, shop.page_views: d41d8cd9, shop.users: d41d8cd9}}
- id: auth-users
  name: Password auth with roles
  summary: PasswordAuthenticator and CassandraAuthorizer, the roles cassandra (superuser, password cassandra), alice (password s3cret, member of analyst) and analyst (no login), and a fresh, not yet logged-in client state.
  state:
    auth-config: {authenticator: PasswordAuthenticator, authorizer: CassandraAuthorizer, role_manager: CassandraRoleManager}
    auth-keyspace:
      roles:
        cassandra: {role: cassandra, is_superuser: true, can_login: true, salted_hash: 'bcrypt:cassandra', member_of: [], password_updated_at: 0}
        alice: {role: alice, is_superuser: false, can_login: true, salted_hash: 'bcrypt:s3cret', member_of: [analyst], password_updated_at: 0}
        analyst: {role: analyst, is_superuser: false, can_login: false, salted_hash: '', member_of: [], password_updated_at: 0}
      role_members: {analyst|alice: {role: analyst, member: alice}}
      role_permissions: {analyst|data/shop: {role: analyst, resource: data/shop, permissions: [SELECT]}, alice|data/shop/orders: {role: alice, resource: data/shop/orders, permissions: [MODIFY]}}
      identity_to_roles: {'spiffe://shop/app': {identity: 'spiffe://shop/app', role: alice}}
      cidr_groups: {office: {cidr_group: office, cidrs: [10.0.0.0/24]}}
    client-state: {user: ''}
