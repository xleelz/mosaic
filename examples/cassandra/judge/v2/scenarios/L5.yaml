schema_version: 1
id: cassandra
scenarios:
  - id: bench-l5
    flow: cql-select
    fixtures: [three-node-rf3]
    name: "L5: SERIAL read: v1 legacyReadWithPaxos finishes n1's in-progress proposal (re-propose + commit at QUORUM), re-prepares, proposes an empty update (never committed), then fetchRows at QUORUM"
    input:
      options: {consistency: SERIAL}
      statement:
        keyspace: shop
        table: users
        type: SELECT
        partition_keys:
          - {partition_key: "user:42", token: -7509452495886106294}
    state:
      paxos-state@n1:
        rows:
          shop.users:user:42:
            accepted_ballot: 1793318300000000
            accepted_columns: {name: Ada}
            accepted_empty: false
            committed_ballot: 0
            committed_columns: {}
            promised: 1793318300000000
            promised_write: 1793318300000000
    expect:
      - "size(result.value.rows) == 1 && result.value.rows[0].name == 'Ada'"
      - "calls['storage-proxy.legacy-read-with-paxos'] == 1 && calls['paxos.read'] == 0"
      - "ctx.unfinishedCommit == true && calls['storage-proxy.prepare-paxos'] == 2"
      # replayed commit at QUORUM; our own empty proposal is never committed
      - "calls['storage-proxy.commit-paxos'] == 1 && trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.commit-paxos' && e.input.consistency == 'QUORUM' && e.input.proposal.columns.name == 'Ada')"
      - "calls['storage-proxy.propose-paxos'] == 2 && trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.propose-paxos' && e.input.proposal.update_empty == true)"
      - "state['paxos-state@n3'].rows['shop.users:user:42'].committed_columns.name == 'Ada'"
      # then the read at QUORUM sees the replayed value
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.fetch-rows' && e.input.consistency == 'QUORUM')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.commit-paxos')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.fetch-rows')[0].seq"
