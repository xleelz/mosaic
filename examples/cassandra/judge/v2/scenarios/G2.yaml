# G2 (round 2). Verified: FailureDetector.interpret (FailureDetector.java:335-370): phi = (now-tLast)/mean
# (ArrivalWindow.phi, :541-547); convict when PHI_FACTOR*phi > phi_convict_threshold, PHI_FACTOR =
# 1/ln10 (:98, :360), threshold 8 (Config.java:177; yaml:1471 commented), i.e. > ~18.42 s of silence at
# a 1 s mean. Skipped after a local pause > max_local_pause 5000 ms (:344-354;
# CassandraRelevantProperties.java:352). Listener Gossiper.convict -> markDead -> subscribers' onDead
# (Gossiper.java:606-628, 1502-1531). StorageService.onDead interrupts outbound and notifies DOWN
# (StorageService.java:3884-3890). Hints are not a subscriber: dispatch stops via FailureDetector.isAlive
# in HintsStore.isLive (HintsStore.java:146-150) and HintsDispatchExecutor's shouldAbort (:288).
schema_version: 1
id: cassandra
scenarios:
- id: bench-g2-rounds-convict-at-19s
  name: 'G2 end to end: n2 stops answering at t=0; n1 gossips every second; the round at 18 s (phi*0.434 = 7.8) keeps it up, the round at 19 s (8.25) convicts it; StorageService.onDead
    interrupts outbound and sends DOWN'
  fixtures:
  - three-node-rf3
  state:
    failure-detector@n1:
      arrival_samples:
        n3:
          t_last_ms: 1793318460000
          mean_ms: 1000
  faults:
  - target: gossip-digest-syn-verb-handler.do-verb
    type: error
    code: unreachable
    instance: n2
  steps:
  - flow: membership-gossip-round
    at_ms: 1000
  - flow: membership-gossip-round
    at_ms: 2000
  - flow: membership-gossip-round
    at_ms: 3000
  - flow: membership-gossip-round
    at_ms: 4000
  - flow: membership-gossip-round
    at_ms: 5000
  - flow: membership-gossip-round
    at_ms: 6000
  - flow: membership-gossip-round
    at_ms: 7000
  - flow: membership-gossip-round
    at_ms: 8000
  - flow: membership-gossip-round
    at_ms: 9000
  - flow: membership-gossip-round
    at_ms: 10000
  - flow: membership-gossip-round
    at_ms: 11000
  - flow: membership-gossip-round
    at_ms: 12000
  - flow: membership-gossip-round
    at_ms: 13000
  - flow: membership-gossip-round
    at_ms: 14000
  - flow: membership-gossip-round
    at_ms: 15000
  - flow: membership-gossip-round
    at_ms: 16000
  - flow: membership-gossip-round
    at_ms: 17000
  - flow: membership-gossip-round
    at_ms: 18000
  - flow: membership-gossip-round
    at_ms: 19000
  expect:
  - trace.filter(e, e.type == 'call.start' && e.interface == 'gossiper.mark-dead' && e.instance == 'n1').size() == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossiper.mark-dead' && e.input.endpoint == 'n2' && e.t >= 19000)
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''gossiper.convict'' && e.t < 19000)'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-service.on-dead' && e.instance == 'n1' && e.input.endpoint == 'n2')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'messaging-service.interrupt-outbound' && e.input.endpoint == 'n2')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'server-event-notifier.on-down' && e.input.endpoint == 'n2')
  - state['gossiper@n1'].endpoint_state_map.n2.alive == false && 'n2' in state['gossiper@n1'].unreachable_endpoints && !('n2' in state['gossiper@n1'].live_endpoints)
- id: bench-g2-local-pause
  name: 'G2: the first interpret in 20 s means this node paused (> 5 s): nobody is convicted, and the next round 1 s later is still inside the pause window'
  fixtures:
  - three-node-rf3
  state:
    failure-detector@n1:
      last_interpret_ms: 1793318400000
  steps:
  - flow: membership-gossip-round
    at_ms: 20000
  - flow: membership-gossip-round
    at_ms: 21000
  expect:
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''gossiper.convict'')'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'failure-detector.interpret' && e.output.skipped == 'local pause' && e.t < 21000)
  - trace.exists(e, e.type == 'call.end' && e.interface == 'failure-detector.interpret' && e.output.skipped == 'recent local pause' && e.t >= 21000)
- id: bench-g2-hints-not-subscribed
  name: 'G2: conviction of n2 calls no hints interface; the next dispatch poll skips n2''s store because FailureDetector.isAlive is now false'
  fixtures:
  - three-node-rf3
  state:
    failure-detector@n1:
      arrival_samples:
        n3:
          t_last_ms: 1793318460000
          mean_ms: 1000
    hints-catalog@n1:
      stores:
        6d194555-f6eb-41d0-c000-000000000002:
          host_id: 6d194555-f6eb-41d0-c000-000000000002
    hints-store@n1:
      hints:
        h1:
          host_id: 6d194555-f6eb-41d0-c000-000000000002
          size_bytes: 512
          stage: file
          creation_time: 1793318400000
          key: h1
          hint:
            creation_time: 1793318400000
            gcgs: 864000
            mutation:
              keyspace: shop
              table: orders
              partition_key: order:1
              token: -4069959284402364209
              timestamp: 1793318400000000
              columns:
                total: 42
  faults:
  - target: gossip-digest-syn-verb-handler.do-verb
    type: error
    code: unreachable
    instance: n2
  steps:
  - flow: membership-gossip-round
    at_ms: 19000
    as: round
  - flow: hb-hints-dispatch
    at_ms: 20000
    as: poll
  expect:
  - '!trace.exists(e, e.type == ''call.start'' && e.interface.startsWith(''hints'') && e.t < 20000)'
  - steps.poll.result.value.scheduled == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'hints-store.is-live' && e.output.live == false)
  - size(state['hints-store@n1'].hints) == 1
- id: bench-g2-dispatch-aborts-when-down
  name: 'G2: a dispatch task for n2 whose FailureDetector.isAlive turned false aborts (shouldAbort) and keeps the file'
  flow: hb-hints-dispatch-task
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
      live_endpoints:
      - n3
      unreachable_endpoints:
      - n2
    hints-catalog@n1:
      stores:
        6d194555-f6eb-41d0-c000-000000000002:
          host_id: 6d194555-f6eb-41d0-c000-000000000002
    hints-store@n1:
      hints:
        h1:
          host_id: 6d194555-f6eb-41d0-c000-000000000002
          size_bytes: 512
          stage: file
          creation_time: 1793318400000
          key: h1
          hint:
            creation_time: 1793318400000
            gcgs: 864000
            mutation:
              keyspace: shop
              table: orders
              partition_key: order:1
              token: -4069959284402364209
              timestamp: 1793318400000000
              columns:
                total: 42
  expect:
  - calls_by_instance['hint-verb-handler.do-verb@n2'] == 0
  - size(state['hints-store@n1'].hints) == 1
