schema_version: 1
id: cassandra
scenarios:
  - id: bench-b1
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B1: LOGGED batch over two partitions, all up: batchlog to n2+n3 (CL TWO), then the mutations at QUORUM, then BATCH_REMOVE"
    expect:
      - "result.ok && result.value.kind == 'VOID'"
      # BS:444 mutateAtomic = isLogged && mutations.size() > 1
      - "ctx.batchPartitions == 2 && ctx.mutateAtomically == true && calls['storage-proxy.mutate-atomically'] == 1 && calls['storage-proxy.mutate'] == 0"
      # forBatchlogWrite: min(2, live non-local nodes) -> n2, n3 at CL TWO (RP:238-276, 295-318)
      - "ctx.batchlogEndpoints == ['n2', 'n3'] && trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.sync-write-to-batchlog' && e.input.consistency == 'TWO')"
      - "calls_by_instance['batch-store-verb-handler.do-verb@n2'] == 1 && calls_by_instance['batch-store-verb-handler.do-verb@n3'] == 1 && calls_by_instance['batchlog-manager.store@n1'] == 0"
      # availability check (wrapBatchResponseHandler) for every mutation before the batchlog write
      - "calls['storage-proxy.wrap-batch-response-handler'] == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.wrap-batch-response-handler')[1].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.sync-write-to-batchlog')[0].seq"
      # batchlog write strictly before any mutation
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.sync-write-to-batchlog')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.sync-write-batched-mutations')[0].seq"
      - "calls['mutation-verb-handler.do-verb'] == 4 && calls['storage-proxy.perform-locally'] == 2"
      # removal once every mutation reached its CL: BATCH_REMOVE to the same two batchlog nodes, no callback
      - "calls['storage-proxy.async-remove-from-batchlog'] == 1 && calls_by_instance['batch-remove-verb-handler.do-verb@n2'] == 1 && calls_by_instance['batch-remove-verb-handler.do-verb@n3'] == 1"
      - "size(state['batchlog-manager@n2'].batches) == 0 && size(state['batchlog-manager@n3'].batches) == 0"
