schema_version: 1
id: cassandra
scenarios:
  - id: bench-t1
    flow: native-execute
    fixtures: [three-node-rf3]
    name: "T1: EXECUTE with an id not in the prepared cache: PreparedQueryNotFoundException, UNPREPARED (0x2500), nothing processed"
    input:
      statement_id: "md5:never-prepared"
    expect:
      - "!result.ok && result.error.code == 'unprepared' && result.error.status == 9472"
      - "result.error.message.startsWith('Prepared query with ID md5:never-prepared not found')"
      - "calls['query-processor.get-prepared'] == 1 && calls['query-processor.process-prepared'] == 0 && calls['storage-proxy.read'] == 0"
  - id: bench-t1-before-page-size
    flow: native-execute
    fixtures: [three-node-rf3]
    name: "T1: the cache lookup comes before the page-size check"
    input:
      statement_id: "md5:never-prepared"
      options: {page_size: 0}
    expect:
      - "!result.ok && result.error.code == 'unprepared'"
  - id: bench-t1-reprepare-then-execute
    fixtures: [three-node-rf3]
    name: "T1: the driver's response (client side, not server behavior): EXECUTE fails UNPREPARED, PREPARE the same query, EXECUTE the returned id succeeds"
    steps:
      - {flow: native-execute, as: e1, input: {statement_id: "md5:SELECT name, email FROM shop.users WHERE id = ?"}}
      - {flow: native-prepare, as: prep}
      - {flow: native-execute, as: e2, input: {statement_id: "= steps.prep.result.value.result.statement_id", result_metadata_id: "= steps.prep.result.value.result.result_metadata_id"}}
    expect:
      - "!steps.e1.result.ok && steps.e1.result.error.code == 'unprepared'"
      - "steps.prep.result.ok && steps.prep.result.value.result.kind == 'PREPARED' && steps.prep.result.value.result.statement_id == 'md5:SELECT name, email FROM shop.users WHERE id = ?'"
      - "steps.e2.result.ok && calls['query-processor.process-prepared'] == 1"
