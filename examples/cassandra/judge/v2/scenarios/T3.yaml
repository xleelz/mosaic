schema_version: 1
id: cassandra
scenarios:
  - id: bench-t3-default-backpressure
    flow: native-query
    fixtures: [three-node-rf3]
    name: "T3 (deployed: throw_on_overload false): bytes in flight over the per-IP limit -> backpressure (paused, warning), not overloaded"
    state:
      client-resource-limits: {endpoint_in_flight_bytes: 107374150}
    expect:
      - "config['native-transport-throw-on-overload'] == false"
      - "result.ok && ctx.connection_paused && ctx.backpressure == 'BYTES_IN_FLIGHT'"
      - "result.value.warnings[0].contains('bytes in flight')"
      - "calls['query-processor.process'] == 1"
  - id: bench-t3-throw-on-overload
    flow: native-query
    fixtures: [three-node-rf3]
    name: "T3: client sets THROW_ON_OVERLOAD: the same breach is OverloadedException (0x1001), not dispatched"
    state:
      client-resource-limits: {endpoint_in_flight_bytes: 107374150}
      cql-message-handler: {throw_on_overload: true}
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.status == 4097"
      - "result.error.message.startsWith('Request breached limit on bytes in flight')"
      - "calls['dispatcher.dispatch'] == 0 && calls['query-processor.process'] == 0"
  - id: bench-t3-rate-limit-disabled
    flow: native-query
    fixtures: [three-node-rf3]
    name: "T3: deployed native_transport_rate_limiting_enabled false: an exhausted limiter is ignored"
    state:
      client-resource-limits: {permit_available: false, permit_delay_ms: 5}
      cql-message-handler: {throw_on_overload: true}
    expect:
      - "config['native-transport-rate-limiting-enabled'] == false"
      - "result.ok && calls['query-processor.process'] == 1"
  - id: bench-t3-rate-limit-enabled-throw
    flow: native-query
    fixtures: [three-node-rf3]
    name: "T3: with rate limiting enabled and THROW_ON_OVERLOAD, an exhausted limiter is OverloadedException"
    config: {native-transport-rate-limiting-enabled: true}
    state:
      client-resource-limits: {permit_available: false}
      cql-message-handler: {throw_on_overload: true}
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.status == 4097"
      - "calls['query-processor.process'] == 0"
  - id: bench-t3-queue-timeout
    flow: native-query
    fixtures: [three-node-rf3]
    name: "T3: queued longer than native_transport_timeout (12s): OverloadedException 'Query timed out before it could start'"
    input:
      queue_time_ms: 12500
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.status == 4097 && result.error.message == 'Query timed out before it could start'"
      - "calls['query-processor.parse'] == 0"
  - id: bench-t3-shutting-down
    flow: native-query
    fixtures: [three-node-rf3]
    name: "T3: server shutting down: OverloadedException (Dispatcher)"
    state:
      server-connection-tracker: {running: false}
    expect:
      - "!result.ok && result.error.code == 'overloaded'"
