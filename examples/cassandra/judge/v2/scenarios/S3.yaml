schema_version: 1
id: cassandra
scenarios:
  - id: bench-s3
    fixtures: [three-node-rf3]
    name: "S3: deployed AllowAllAuthenticator - STARTUP answered READY with no AUTHENTICATE; a QUERY then runs as anonymous"
    steps:
      - {flow: native-startup, as: start}
      - {flow: native-query, as: q}
    expect:
      - "steps.start.result.ok && steps.start.result.value.type == 'READY'"
      - "state['server-connection@n1'].stage == 'READY' && state['client-state@n1'].user == 'anonymous'"
      - "calls['startup-message.execute'] == 1 && calls['transport.auth-response-message'] == 0"
      - "!trace.exists(e, e.type == 'call.start' && e.interface.startsWith('password-authenticator'))"
      - "steps.q.result.ok && steps.q.result.value.type == 'RESULT'"
