schema_version: 1
id: cassandra
scenarios:
  - id: bench-w5
    flow: cql-write
    name: "W5: INSERT at ONE, n3 times out: success after the first ack, n3 hinted when its callback expires"
    fixtures: [three-node-rf3]
    input:
      options: {consistency: ONE}
      statement: {type: INSERT, keyspace: shop, table: users, columns: {id: "user:42", name: Ada, email: ada@example.com}}
    faults:
      - {target: mutation-verb-handler.do-verb, type: timeout, instance: n3}
    expect:
      - "result.ok && ctx.block_for == 1"
      # the client answer comes before the write timeout
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'query-processor.process')[0].t < 200"
      - "calls['storage-proxy.submit-hint'] == 1 && ctx.hinted == ['n3']"
      # the hint is submitted only after n3's callback expires (late, after the client already has its answer)
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint').all(e, e.t >= 2000 && 'n3' in e.input.targets)"
