# H3 (round 2). Verified: hinted_handoff_enabled false makes shouldHint return false first
# (StorageProxy.java:2444-2447), so neither down replicas (sendToHintedReplicas, :1549-1560) nor
# timed-out/failed ones (AbstractWriteResponseHandler.java:309) are hinted; the outcome is otherwise
# unchanged. CL ANY with no live replica (coordinator not a replica): nothing signals the handler,
# get() times out after write_request_timeout 2000 ms (AbstractWriteResponseHandler.java:112-127),
# mutate catches the WriteTimeoutException for ANY and calls hintMutations (StorageProxy.java:907-912,
# 968-988), which hints nobody; the client sees success after ~2 s and the write is stored nowhere.
schema_version: 1
id: cassandra
scenarios:
- id: bench-h3-quorum-one-down-no-hint
  name: 'H3: QUORUM, n2 down, handoff disabled: success with 2 acks, shouldHint refuses, nothing is hinted'
  flow: coordinator-write
  fixtures:
  - three-node-rf3
  config:
    hinted-handoff-enabled: false
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
      live_endpoints:
      - n3
      unreachable_endpoints:
      - n2
  input:
    consistency: QUORUM
    mutations:
    - keyspace: shop
      table: orders
      partition_key: order:1
      token: -4069959284402364209
      counter: false
      timestamp: 1793318400000000
      columns:
        total: 42
  expect:
  - result.ok && result.value.acks == 2 && result.value.block_for == 2
  - trace.exists(e, e.type == 'call.end' && e.interface == 'storage-proxy.should-hint' && e.output.should_hint == false && e.output.reason == 'hinted handoff disabled')
  - '!trace.exists(e, e.type == ''call.start'' && (e.interface == ''storage-proxy.submit-hint'' || e.interface == ''hints-service.write''))'
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''mutation-verb-handler.do-verb'' && e.instance == ''n2'')'
- id: bench-h3-one-timeout-no-hint
  name: 'H3: ONE, n3 times out, handoff disabled: success after the first ack, no hint for n3'
  flow: coordinator-write
  fixtures:
  - three-node-rf3
  config:
    hinted-handoff-enabled: false
  faults:
  - target: mutation-verb-handler.do-verb
    type: timeout
    instance: n3
  input:
    consistency: ONE
    mutations:
    - keyspace: shop
      table: orders
      partition_key: order:1
      token: -4069959284402364209
      counter: false
      timestamp: 1793318400000000
      columns:
        total: 42
  expect:
  - result.ok && result.value.block_for == 1 && duration_ms < 100
  - '!trace.exists(e, e.type == ''call.start'' && (e.interface == ''storage-proxy.submit-hint'' || e.interface == ''hints-service.write''))'
- id: bench-h3-any-no-live-replica-silent-success
  name: 'H3 refined: ANY, n1 coordinates a token whose replicas n2, n4, n3 are all down, handoff disabled: success after the 2 s write timeout, stored nowhere'
  flow: coordinator-write
  fixtures:
  - four-node-rf3
  config:
    hinted-handoff-enabled: false
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
        n3:
          alive: false
        n4:
          alive: false
      live_endpoints: []
      unreachable_endpoints:
      - n2
      - n3
      - n4
  input:
    consistency: ANY
    mutations:
    - keyspace: shop
      table: orders
      partition_key: order:1
      token: -4069959284402364209
      counter: false
      timestamp: 1793318400000000
      columns:
        total: 42
  expect:
  - result.ok
  - duration_ms >= 2000
  - '!trace.exists(e, e.type == ''call.start'' && (e.interface == ''storage-proxy.submit-hint'' || e.interface == ''hints-service.write'' || e.interface == ''mutation-verb-handler.do-verb''))'
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''mutation.apply-future'')'
- id: bench-h3-contrast-enabled
  name: 'Contrast: the same QUORUM write with handoff enabled has the same outcome and hints n2'
  flow: coordinator-write
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
      live_endpoints:
      - n3
      unreachable_endpoints:
      - n2
  input:
    consistency: QUORUM
    mutations:
    - keyspace: shop
      table: orders
      partition_key: order:1
      token: -4069959284402364209
      counter: false
      timestamp: 1793318400000000
      columns:
        total: 42
  expect:
  - result.ok && result.value.acks == 2 && result.value.block_for == 2
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n2' in e.input.targets)
