schema_version: 1
id: cassandra
scenarios:
  - id: bench-b5
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B5: UNLOGGED batch: no batchlog, StorageProxy.mutate sends the mutations directly (WriteType UNLOGGED_BATCH)"
    input:
      statement:
        batch_type: UNLOGGED
    expect:
      - "result.ok && result.value.kind == 'VOID' && size(result.value.warnings) == 0"
      - "ctx.mutateAtomically == false && calls['storage-proxy.mutate-atomically'] == 0 && calls['storage-proxy.mutate'] == 1"
      - "calls['replica-plans.for-batchlog-write'] == 0 && calls['batch-store-verb-handler.do-verb'] == 0 && calls['batch-remove-verb-handler.do-verb'] == 0 && calls['batchlog-manager.store'] == 0"
      - "calls['mutation-verb-handler.do-verb'] == 4 && calls['storage-proxy.perform-locally'] == 2"
      - "ctx.write_type == 'UNLOGGED_BATCH' && trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.perform-write' && e.input.write_type == 'UNLOGGED_BATCH')"
