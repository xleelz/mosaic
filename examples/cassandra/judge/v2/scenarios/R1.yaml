schema_version: 1
id: cassandra
scenarios:
  - id: bench-r1-quorum-all-up
    name: "R1: QUORUM, all up: one data read (n3), one digest read (local n1), digests match, data returned"
    flow: coordinator-read
    fixtures: [three-node-rf3]
    input:
      consistency: QUORUM
      read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 100, columns: [name], digest: false, limit: 100}
    state:
      skip-list-memtable@n1:
        cells:
          "shop.users:user:42:name": {column: name, keyspace: shop, partition_key: "user:42", replica: n1, table: users, timestamp: 1000, value: Ada}
      skip-list-memtable@n2:
        cells:
          "shop.users:user:42:name": {column: name, keyspace: shop, partition_key: "user:42", replica: n2, table: users, timestamp: 1000, value: Ada}
      skip-list-memtable@n3:
        cells:
          "shop.users:user:42:name": {column: name, keyspace: shop, partition_key: "user:42", replica: n3, table: users, timestamp: 1000, value: Ada}
    expect:
      - "result.ok"
      - "ctx.read_executor == 'speculating' && ctx.read.contacts == ['n3', 'n1']"
      # one data request to the first replica in ring order (n3), digest to n1 (local, last)
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'read-command-verb-handler.do-verb').size() == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'read-command-verb-handler.do-verb' && e.instance == 'n3' && e.input.read_command.digest == false)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy-local-read-runnable.run' && e.instance == 'n1' && e.input.read_command.digest == true)"
      - "calls['read-command-verb-handler.do-verb'] == 1 && calls['storage-proxy-local-read-runnable.run'] == 1"
      - "ctx.digest_mismatch == false && ctx.speculated == false && calls['read-repair-verb-handler.do-verb'] == 0"
      - "result.value.rows[0].cells.exists(c, c.column == 'name' && c.value == 'Ada')"
      - "duration_ms < 2500"
