schema_version: 1
id: cassandra
scenarios:
  - id: bench-p1
    flow: rs-nodetool-repair-full
    fixtures: [three-node-rf3]
    name: "P1: full parallel repair of ks1.users, n3 diverged: prepare, Merkle trees on all three replicas, compare, sync the mismatching pairs by streaming, cleanup"
    state:
      cassandra-table-repair-manager@n3:
        digests: {ks1.users: 9f86d081}
    expect:
      - "result.ok && ctx.repairOutcome == 'completed'"
      - "calls_by_instance['repair-message-verb-handler.do-verb-prepare-msg@n2'] == 1 && calls_by_instance['repair-message-verb-handler.do-verb-prepare-msg@n3'] == 1"
      - "calls['repair-message-verb-handler.do-verb-snapshot-msg'] == 0 && calls['paxos-cleanup.cleanup'] == 0"
      - "calls_by_instance['repair-message-verb-handler.do-verb-validation-req@n1'] == 1 && calls_by_instance['repair-message-verb-handler.do-verb-validation-req@n2'] == 1 && calls_by_instance['repair-message-verb-handler.do-verb-validation-req@n3'] == 1"
      - "ctx.syncTasks == 2 && calls['local-sync-task.start-sync'] == 1 && calls['symmetric-remote-sync-task.start-sync'] == 1"
      - "calls['stream-plan.execute'] == 2"
      - "calls['repair-message-verb-handler.do-verb-cleanup-msg'] == 2"
      - "calls['repair-message-verb-handler.do-verb-prepare-consistent-req'] == 0 && calls['repair-message-verb-handler.do-verb-finalize-propose-msg'] == 0 && calls['pending-anti-compaction.run'] == 0"
  - id: bench-p1-in-sync
    flow: rs-nodetool-repair-full
    fixtures: [three-node-rf3]
    name: "P1: trees match: no sync task, nothing streamed"
    expect:
      - "result.ok && ctx.repairOutcome == 'completed'"
      - "calls['repair-message-verb-handler.do-verb-validation-req'] == 3 && ctx.syncTasks == 0 && calls['stream-plan.execute'] == 0"
  - id: bench-p1-replica-down
    flow: rs-nodetool-repair-full
    fixtures: [three-node-rf3]
    name: "P1: a dead replica fails the repair without forceRepair (RepairRunnable: 'Endpoint not alive')"
    state:
      gossiper@n1:
        endpoint_state_map: {n3: {alive: false}}
        live_endpoints: [n2]
        unreachable_endpoints: [n3]
    expect:
      - "ctx.repairOutcome != 'completed'"
      - "calls['repair-message-verb-handler.do-verb-validation-req'] == 0"
