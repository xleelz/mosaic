schema_version: 1
id: cassandra
scenarios:
  - id: bench-c1-flush-triggers-stcs
    flow: memtable-force-flush
    fixtures: [one-node]
    name: "C1: a dirty flush adds a 4th similar-size sstable, replaceFlushed submits background compaction, deployed default STCS picks the bucket of 4 and merges them"
    state:
      abstract-commit-log-segment-manager: {active_segments: 3}
      memtable-pool: {allocated_bytes: 600}
      skip-list-memtable:
        stats:
          shop.users: {bytes: 600, operations: 3, partitions: 2}
      tracker:
        views:
          shop.users:
            strategy: SizeTieredCompactionStrategy
            auto_compaction_enabled: true
            min_threshold: 4
            max_threshold: 32
            compacting: []
            sstables:
              - {id: nb-1, size_mb: 1, level: 0, age_s: 3600, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, pending_repair: '', unowned_mb: 0, window: 0, read_rate: 0, max_timestamp: 1000}
              - {id: nb-2, size_mb: 1, level: 0, age_s: 3000, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, pending_repair: '', unowned_mb: 0, window: 0, read_rate: 0, max_timestamp: 1001}
              - {id: nb-3, size_mb: 1, level: 0, age_s: 2000, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, pending_repair: '', unowned_mb: 0, window: 0, read_rate: 0, max_timestamp: 1002}
    expect:
      - "result.ok && result.value.sstables == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'compaction-manager.submit-background')"
      - "calls['size-tiered-compaction-strategy.get-next-background-task'] >= 1 && calls['compaction-task.execute'] == 1"
      - "size(state['tracker@n1'].views['shop.users'].sstables) == 1"
  - id: bench-c1-stcs-purge
    flow: background-compaction
    fixtures: [one-node]
    name: "C1: deployed default STCS (min_threshold 4) merges 4 similar sstables; only gc_grace-droppable tombstones that shadow nothing are purged; recheck finds nothing"
    expect:
      - "state['tracker@n1'].views['shop.users'].strategy == 'SizeTieredCompactionStrategy'"
      - "result.ok && result.value.submitted == 1 && calls['compaction-task.execute'] == 1"
      - "size(state['tracker@n1'].views['shop.users'].sstables) == 1 && state['tracker@n1'].views['shop.users'].sstables[0].size_mb == 42"
      - "ctx.tombstones_purged == 50 && state['tracker@n1'].views['shop.users'].sstables[0].tombstones == 110"
      - "calls['compaction-manager-background-compaction-candidate.run'] == 2 && ctx.background_result == 'no_task'"
  - id: bench-c1-below-threshold
    flow: background-compaction
    fixtures: [one-node]
    name: "C1: three sstables do not reach min_threshold: no compaction"
    state:
      tracker:
        views:
          shop.users:
            sstables:
              - {id: nb-1, size_mb: 10, level: 0, age_s: 3600, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, pending_repair: '', unowned_mb: 0, window: 0, read_rate: 0, max_timestamp: 1000}
              - {id: nb-2, size_mb: 12, level: 0, age_s: 3600, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, pending_repair: '', unowned_mb: 0, window: 0, read_rate: 0, max_timestamp: 1001}
              - {id: nb-3, size_mb: 9, level: 0, age_s: 3600, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, pending_repair: '', unowned_mb: 0, window: 0, read_rate: 0, max_timestamp: 1002}
    expect:
      - "result.ok && calls['compaction-task.execute'] == 0 && size(state['tracker@n1'].views['shop.users'].sstables) == 3"
  # Round 3: the round-2 probe bench-c1-probe-gc-grace-not-evaluated pinned the wrong claim (tombstones_purged == 0
  # and the ancient city tombstone kept). The fix evaluates gc_grace, so the probe is replaced by the code's behavior.
  - id: bench-c1-gc-grace-purges-old-tombstone
    flow: background-compaction
    fixtures:
    - one-node
    name: 'C1 (round 3, replaces the round-2 probe): a cell tombstone deleted long before now - gc_grace (864000 s) that shadows nothing outside the 4 compacted sstables or the memtable is purged (gcBefore = now - gcGraceSeconds, ColumnFamilyStore.java:1970-1973;
      CompactionController.getPurgeEvaluator :245-284)'
    state:
      tracker:
        views:
          shop.users:
            sstables:
            - id: nb-1
              size_mb: 10
              level: 0
              age_s: 3600
              tombstones: 0
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 1000
              partitions:
                user:42:
                  cells:
                  - column: name
                    timestamp: 1000
                    value: Ada
            - id: nb-2
              size_mb: 12
              level: 0
              age_s: 3600
              tombstones: 0
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 1001
              partitions: {}
            - id: nb-3
              size_mb: 9
              level: 0
              age_s: 3600
              tombstones: 0
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 1002
              partitions: {}
            - id: nb-4
              size_mb: 11
              level: 0
              age_s: 3600
              tombstones: 1
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 2500
              partitions:
                user:42:
                  cells:
                  - column: city
                    deleted: true
                    timestamp: 2500
                    value: null
    expect:
    - result.ok && calls['compaction-task.execute'] == 1 && ctx.tombstones_purged == 1
    - '!state[''tracker@n1''].views[''shop.users''].sstables[0].partitions[''user:42''].cells.exists(c, c.column == ''city'')'
    - state['tracker@n1'].views['shop.users'].sstables[0].partitions['user:42'].cells.exists(c, c.column == 'name' && c.value == 'Ada')
  - id: bench-c1-gc-grace-keeps-recent-tombstone
    flow: background-compaction
    fixtures:
    - one-node
    name: 'C1 (round 3): the same tombstone deleted 100 s before now is inside gc_grace and survives the compaction'
    state:
      tracker:
        views:
          shop.users:
            sstables:
            - id: nb-1
              size_mb: 10
              level: 0
              age_s: 3600
              tombstones: 0
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 1000
              partitions:
                user:42:
                  cells:
                  - column: name
                    timestamp: 1000
                    value: Ada
            - id: nb-2
              size_mb: 12
              level: 0
              age_s: 3600
              tombstones: 0
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 1001
              partitions: {}
            - id: nb-3
              size_mb: 9
              level: 0
              age_s: 3600
              tombstones: 0
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 1002
              partitions: {}
            - id: nb-4
              size_mb: 11
              level: 0
              age_s: 3600
              tombstones: 1
              purgeable_tombstones: 0
              droppable_tombstone_ratio: 0
              fully_expired: false
              repaired: false
              pending_repair: ''
              unowned_mb: 0
              window: 0
              read_rate: 0
              max_timestamp: 1793318300000000
              partitions:
                user:42:
                  cells:
                  - column: city
                    deleted: true
                    timestamp: 1793318300000000
                    value: null
    expect:
    - result.ok && calls['compaction-task.execute'] == 1 && ctx.tombstones_purged == 0
    - state['tracker@n1'].views['shop.users'].sstables[0].partitions['user:42'].cells.exists(c, c.column == 'city' && c.deleted)
