schema_version: 1
id: cassandra
scenarios:
  - id: bench-s2
    flow: native-query
    fixtures: [three-node-rf3]
    name: "S2: CREATE TABLE of an existing table over QUERY is AlreadyExistsException (0x2400), thrown before any schema write"
    input:
      query: "CREATE TABLE shop.orders (id uuid PRIMARY KEY, total decimal)"
      statement: {type: CREATE_TABLE, keyspace: shop, table: orders, columns: [id uuid, total decimal], partition_key: [id], fully_qualified: true, bind_markers: 0}
    expect:
      - "!result.ok && result.error.code == 'already-exists' && result.error.status == 9216"
      - "result.error.message == 'Cannot add already existing table \"orders\" to keyspace \"shop\"'"
      - "calls['create-table-statement.apply'] == 1 && calls['schema-keyspace.apply-changes'] == 0"
      - "calls['migration-coordinator.announce'] == 0 && calls['migration-coordinator.push-schema-mutations'] == 0 && calls['keyspace.init-cf'] == 0"
      - "state['schema@n1'].version == state['schema@n2'].version"
  - id: bench-s2-if-not-exists
    flow: native-query
    fixtures: [three-node-rf3]
    name: "S2: IF NOT EXISTS: empty diff, Void result, nothing written, announced or pushed"
    input:
      query: "CREATE TABLE IF NOT EXISTS shop.orders (id uuid PRIMARY KEY, total decimal)"
      statement: {type: CREATE_TABLE, keyspace: shop, table: orders, if_not_exists: true, columns: [id uuid, total decimal], partition_key: [id], fully_qualified: true, bind_markers: 0}
    expect:
      - "result.ok && result.value.type == 'RESULT' && result.value.result.kind == 'VOID'"
      - "calls['create-table-statement.apply'] == 1 && calls['schema-keyspace.apply-changes'] == 0 && calls['migration-coordinator.announce'] == 0 && calls['migration-coordinator.push-schema-mutations'] == 0"
