schema_version: 1
id: cassandra
scenarios:
  - id: bench-r3-quorum-two-down-unavailable
    name: "R3: QUORUM with n2 and n3 down in n1's gossip view: Unavailable (required 2, alive 1) before any message is sent"
    flow: coordinator-read
    fixtures: [three-node-rf3]
    input:
      consistency: QUORUM
      read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 100, columns: [name], digest: false, limit: 100}
    state:
      gossiper@n1:
        live_endpoints: []
        unreachable_endpoints: [n2, n3]
        endpoint_state_map:
          n2: {alive: false}
          n3: {alive: false}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "result.error.data.required == 2 && result.error.data.alive == 1"
      - "calls['read-command-verb-handler.do-verb'] == 0 && calls['storage-proxy-local-read-runnable.run'] == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'replica-plans.assure-sufficient-live-replicas')"
  - id: bench-r3-cql-unavailable
    name: "R3 end to end: the CQL client gets the Unavailable error (0x1000)"
    flow: cql-select
    fixtures: [three-node-rf3]
    state:
      gossiper@n1:
        live_endpoints: []
        unreachable_endpoints: [n2, n3]
        endpoint_state_map:
          n2: {alive: false}
          n3: {alive: false}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "calls['read-command-verb-handler.do-verb'] == 0"
