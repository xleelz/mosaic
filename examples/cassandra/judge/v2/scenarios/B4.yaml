schema_version: 1
id: cassandra
scenarios:
  - id: bench-b4-fail
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B4: LOGGED batch of 60000 bytes over two partitions -> InvalidRequestException 'Batch too large', nothing written"
    input:
      statement:
        statements:
          - {columns: {name: a}, keyspace: shop, partition_keys: [{partition_key: "user:42", token: -4069959284402364209}], size_bytes: 30000, table: users, type: INSERT}
          - {columns: {name: b}, keyspace: shop, partition_keys: [{partition_key: "user:7", token: 512}], size_bytes: 30000, table: users, type: INSERT}
    expect:
      - "!result.ok && result.error.code == 'invalid' && result.error.status == 8704 && result.error.message == 'Batch too large'"
      - "calls['storage-proxy.mutate-with-triggers'] == 0 && calls['replica-plans.for-batchlog-write'] == 0 && calls['keyspace.apply'] == 0"
  - id: bench-b4-warn
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B4: 6000-byte batch over two partitions -> one client warning, executed normally"
    input:
      statement:
        statements:
          - {columns: {name: a}, keyspace: shop, partition_keys: [{partition_key: "user:42", token: -4069959284402364209}], size_bytes: 3000, table: users, type: INSERT}
          - {columns: {name: b}, keyspace: shop, partition_keys: [{partition_key: "user:7", token: 512}], size_bytes: 3000, table: users, type: INSERT}
    expect:
      - "result.ok && size(result.value.warnings) == 1 && result.value.warnings[0].contains('exceeding specified threshold of 5120')"
      - "calls['storage-proxy.mutate-atomically'] == 1 && calls['storage-proxy.async-remove-from-batchlog'] == 1"
  - id: bench-b4-unlogged-fail
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B4: the size check also applies to UNLOGGED batches (executeWithoutConditions)"
    input:
      statement:
        batch_type: UNLOGGED
        statements:
          - {columns: {name: a}, keyspace: shop, partition_keys: [{partition_key: "user:42", token: -4069959284402364209}], size_bytes: 30000, table: users, type: INSERT}
          - {columns: {name: b}, keyspace: shop, partition_keys: [{partition_key: "user:7", token: 512}], size_bytes: 30000, table: users, type: INSERT}
    expect:
      - "!result.ok && result.error.code == 'invalid' && result.error.message == 'Batch too large'"
      - "calls['storage-proxy.mutate-with-triggers'] == 0"
  - id: bench-b4-single-partition
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B4: a 60000-byte batch on ONE partition is not checked (mutations.size() <= 1, BS:333-335)"
    input:
      statement:
        statements:
          - {columns: {name: a}, keyspace: shop, partition_keys: [{partition_key: "user:42", token: -4069959284402364209}], size_bytes: 30000, table: users, type: INSERT}
          - {columns: {email: b}, keyspace: shop, partition_keys: [{partition_key: "user:42", token: -4069959284402364209}], size_bytes: 30000, table: users, type: INSERT}
    expect:
      - "result.ok && size(result.value.warnings) == 0"
      - "ctx.batchPartitions == 1 && ctx.mutateAtomically == false && calls['storage-proxy.mutate-atomically'] == 0 && calls['storage-proxy.mutate'] == 1"
