schema_version: 1
id: cassandra
scenarios:
  - id: bench-w6
    flow: coordinator-write
    name: "W6: INSERT at ANY, every replica down (n1 coordinates without being a replica): success, the single hint is the ack"
    fixtures: [four-node-rf3]
    input:
      consistency: ANY
      mutations:
        - {keyspace: shop, table: users, partition_key: "user:7", token: -100, counter: false, timestamp: 1793318400000000, columns: {name: Grace}}
    state:
      gossiper@n1: {endpoint_state_map: {n2: {alive: false}, n3: {alive: false}, n4: {alive: false}}}
    expect:
      - "result.ok && result.value.acks == 1 && result.value.block_for == 1"
      - "calls['replica-plans.assure-sufficient-live-replicas'] == 1 && calls['mutation-verb-handler.do-verb'] == 0 && calls['storage-proxy.perform-locally'] == 0"
      # one HintRunnable for all three replicas, run synchronously as the ack for ANY
      - "calls['storage-proxy.submit-hint'] == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint').map(e, size(e.input.targets)) == [3]"
      - "calls['storage-proxy-hint-runnable.run'] == 1"
      - "ctx.hinted.size() == 3 && 'n2' in ctx.hinted && 'n3' in ctx.hinted && 'n4' in ctx.hinted"
