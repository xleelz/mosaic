schema_version: 1
id: cassandra
# Wrong-claim probe (expected to FAIL on the current model). A LOGGED batch writing shop.users and
# shop.orders on the SAME partition key is one Mutation holding one PartitionUpdate per table
# (BatchUpdatesCollector.java:193-231, MutationBuilder.modifications keyed by TableId).
# The model's batch-statement.get-mutations merges the second statement's columns into the first
# statement's mutation, so `total` is written to shop.users and nothing reaches shop.orders.
scenarios:
  - id: bench-b1-xtable
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B1 probe: same partition, two tables -> one mutation, both tables updated"
    input:
      statement:
        statements:
          - {columns: {name: a}, keyspace: shop, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], size_bytes: 100, table: users, type: INSERT}
          - {columns: {total: 5}, keyspace: shop, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], size_bytes: 100, table: orders, type: INSERT}
    expect:
      # mutations.size() == 1 -> not atomic, plain mutate (BS:444)
      - "result.ok && ctx.batchPartitions == 1 && calls['storage-proxy.mutate-atomically'] == 0"
      # the code writes `total` to shop.orders, never to shop.users
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'keyspace.apply' && e.input.mutation.table == 'users' && has(e.input.mutation.columns.total))"
  # Round 3: positive check of the fix (the probe above only asserts what must not happen)
  - id: bench-b1-xtable-positive
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B1-xtable (round 3 check): both tables written on every replica, in one mutation"
    input:
      statement:
        statements:
          - {columns: {name: a}, keyspace: shop, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], size_bytes: 100, table: users, type: INSERT}
          - {columns: {total: 5}, keyspace: shop, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], size_bytes: 100, table: orders, type: INSERT}
    expect:
      - "result.ok"
      - "['n1','n2','n3'].all(n, ('shop.orders:k1:total' in state['skip-list-memtable@' + n].cells) && ('shop.users:k1:name' in state['skip-list-memtable@' + n].cells))"
      - "!('shop.users:k1:total' in state['skip-list-memtable@n1'].cells)"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'commit-log.add').size() == 3"
