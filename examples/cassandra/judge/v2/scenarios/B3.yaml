schema_version: 1
id: cassandra
scenarios:
  - id: bench-b3
    flow: hb-batchlog-replay
    fixtures: [three-node-rf3]
    name: "B3: replay after RING_DELAY 30s then every 10s; only batches older than 2 x write_request_timeout (4000ms); throttle 1024 KiB / 3 endpoints"
    state:
      batchlog-manager@n1:
        batches:
          b-old:
            gc_grace_seconds: 864000
            id: b-old
            mutations:
              - {columns: {total: 42}, keyspace: shop, partition_key: "order:1", table: orders, timestamp: 1793318390000000, token: -4069959284402364209}
            version: 12
            written_at_ms: 1793318390000
          b-young:
            gc_grace_seconds: 864000
            id: b-young
            mutations:
              - {columns: {total: 7}, keyspace: shop, partition_key: "order:2", table: orders, timestamp: 1793318427000000, token: 1622840367226573521}
            version: 12
            written_at_ms: 1793318427000
    expect:
      # first pass at RING_DELAY (30s): b-old (40s old) replayed; b-young (written at 27s, 3s old < 4s) is not
      - "passes[0].start_ms == 30000 && passes[0].result.ok && passes[0].result.value.replayed == 1"
      # second pass 10s after pass 1 ENDS (scheduleWithFixedDelay): b-young now ~13s old -> replayed
      - "passes[1].start_ms > 40000 && passes[1].start_ms < 41000 && passes[1].result.value.replayed == 1"
      - "ctx.replayThrottleKiBPerEndpoint == 341"
      - "size(state['batchlog-manager@n1'].batches) == 0 && state['batchlog-manager@n1'].total_batches_replayed == 2"
      - "calls_by_instance['mutation-verb-handler.do-verb@n2'] == 2 && calls_by_instance['mutation-verb-handler.do-verb@n3'] == 2"
      - "calls['hints-service.flush-and-fsync-blockingly'] == 2"
