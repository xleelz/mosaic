# G1 (round 2). Verified: Gossiper.start schedules GossipTask with scheduleWithFixedDelay every
# intervalInMillis = 1000 (Gossiper.java:142, 2028-2031). Each run bumps the local heartbeat (:348),
# builds digests (:353), SYNs one random live member (:362, :984-1003), with probability
# unreachable/(live+1) SYNs an unreachable non-dead member (:1015-1030), and when the live target was
# not a seed or live < seeds, gossips to a seed (always when no live member, else with probability
# seeds/(live+unreachable); never when self is the only seed) (:384-385, :1035-1054); then
# doStatusCheck (:389). SYN -> ACK (GossipDigestSynVerbHandler.java:42-120), ACK -> ACK2
# (GossipDigestAckVerbHandler.java:41-110), ACK2 applied (GossipDigestAck2VerbHandler.java:34-55).
schema_version: 1
id: cassandra
scenarios:
- id: bench-g1-round-full-exchange
  name: 'G1: a round on n1 (only seed, all live) bumps its heartbeat, SYNs one live member, which ACKs; n1 ACK2s; the peer learns n1''s new heartbeat; no unreachable or seed SYN; status
    check runs'
  flow: membership-gossip-round
  fixtures:
  - three-node-rf3
  expect:
  - result.ok && result.value.gossiped && result.value.to in ['n2', 'n3']
  - state['gossiper@n1'].endpoint_state_map.n1.heartbeat > 400
  - trace.filter(e, e.type == 'call.start' && e.interface == 'gossip-digest-syn-verb-handler.do-verb').size() == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossip-digest-syn-verb-handler.do-verb' && e.instance == result.value.to)
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossip-digest-ack-verb-handler.do-verb' && e.instance == 'n1')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossip-digest-ack2-verb-handler.do-verb' && e.instance == result.value.to)
  - state['gossiper@' + result.value.to].endpoint_state_map.n1.heartbeat == state['gossiper@n1'].endpoint_state_map.n1.heartbeat
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossiper.do-status-check' && e.instance == 'n1')
- id: bench-g1-round-unreachable-and-seed
  name: 'G1: a round on n2 (four nodes, n4 unreachable) with both rolls forced to send: an unreachable SYN to n4, and a seed SYN to n1 only when the live target was not n1'
  fixtures:
  - four-node-rf3
  state:
    gossiper@n2:
      endpoint_state_map:
        n4:
          alive: false
      live_endpoints:
      - n1
      - n3
      unreachable_endpoints:
      - n4
  choices:
    gossiper.maybe-gossip-to-unreachable-member.roll: send
    gossiper.maybe-gossip-to-seed.roll: send
  steps:
  - flow: membership-gossip-round
    'on': n2
    as: r
  expect:
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossip-digest-syn-verb-handler.do-verb' && e.instance == 'n4')
  - trace.filter(e, e.type == 'call.start' && e.interface == 'gossip-digest-syn-verb-handler.do-verb' && e.instance == 'n1').size() == 1
  - 'steps.r.result.value.to == ''n1'' ? !trace.exists(e, e.type == ''call.end'' && e.interface == ''gossiper.maybe-gossip-to-seed'' && e.output.sent == true) : trace.exists(e, e.type
    == ''call.end'' && e.interface == ''gossiper.maybe-gossip-to-seed'' && e.output.sent == true)'
- id: bench-g1-round-nonseed-target-then-seed
  name: 'G1: n2 sees only n3 live (n1, n4 unreachable); the live SYN goes to non-seed n3, so maybeGossipToSeed runs and (roll forced) SYNs seed n1'
  fixtures:
  - four-node-rf3
  state:
    gossiper@n2:
      endpoint_state_map:
        n1:
          alive: false
        n4:
          alive: false
      live_endpoints:
      - n3
      unreachable_endpoints:
      - n1
      - n4
  choices:
    gossiper.maybe-gossip-to-unreachable-member.roll: skip
    gossiper.maybe-gossip-to-seed.roll: send
  steps:
  - flow: membership-gossip-round
    'on': n2
    as: r
  expect:
  - steps.r.result.value.to == 'n3'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'gossiper.maybe-gossip-to-seed' && e.output.sent == true && e.output.to == 'n1')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossip-digest-syn-verb-handler.do-verb' && e.instance == 'n1')
- id: bench-g1-scheduled-every-second
  name: 'G1 schedule (round 2 expected to fail; passes in round 3): after Gossiper.start the GossipTask runs every 1000 ms (scheduleWithFixedDelay)'
  fixtures:
  - three-node-rf3
  steps:
  - interface: gossiper.start
    caller: membership
    input:
      generation: 1793318400
  expect:
  - trace.filter(e, e.type == 'call.start' && e.interface == 'gossiper-gossip-task.run' && e.instance == 'n1').size() >= 3
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossiper-gossip-task.run' && e.t >= 1000 && e.t < 1100)
