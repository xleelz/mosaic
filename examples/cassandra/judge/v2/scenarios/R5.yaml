schema_version: 1
id: cassandra
scenarios:
  - id: bench-r5-silent-replica-all-up-speculates
    name: "R5 (corrected): QUORUM, all up, the data replica n3 never answers: speculation sends data to n2 at 2500ms and the read succeeds"
    flow: coordinator-read
    fixtures: [three-node-rf3]
    input:
      consistency: QUORUM
      read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 100, columns: [name], digest: false, limit: 100}
    state:
      skip-list-memtable@n1:
        cells:
          "shop.users:user:42:name": {column: name, keyspace: shop, partition_key: "user:42", replica: n1, table: users, timestamp: 1000, value: Ada}
      skip-list-memtable@n2:
        cells:
          "shop.users:user:42:name": {column: name, keyspace: shop, partition_key: "user:42", replica: n2, table: users, timestamp: 1000, value: Ada}
    faults:
      - {target: read-command-verb-handler.do-verb, type: timeout, instance: n3}
    expect:
      - "result.ok"
      - "ctx.speculated && ctx.speculated_kind == 'data' && ctx.speculated_to == 'n2'"
      - "duration_ms >= 2500 && duration_ms < 5000"
      - "result.value.rows[0].cells.exists(c, c.column == 'name' && c.value == 'Ada')"
  - id: bench-r5-no-spare-replica-read-timeout
    name: "R5 (corrected): QUORUM, n2 down, data replica n3 silent: NeverSpeculating executor, ReadTimeout at 5000ms with received 1 of 2, no data"
    flow: coordinator-read
    fixtures: [three-node-rf3]
    input:
      consistency: QUORUM
      read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 100, columns: [name], digest: false, limit: 100}
    state:
      gossiper@n1:
        live_endpoints: [n3]
        unreachable_endpoints: [n2]
        endpoint_state_map:
          n2: {alive: false}
    faults:
      - {target: read-command-verb-handler.do-verb, type: timeout, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'read-timeout' && result.error.status == 4608"
      - "result.error.data.received == 1 && result.error.data.block_for == 2 && result.error.data.data_present == false && result.error.data.consistency == 'QUORUM'"
      - "ctx.read_executor == 'never_insufficient' && ctx.speculated == false"
      - "duration_ms >= 5000 && duration_ms < 5100"
  - id: bench-r5-cql-read-timeout
    name: "R5 end to end: the client gets ReadTimeout (0x1200)"
    flow: cql-select
    fixtures: [three-node-rf3]
    state:
      gossiper@n1:
        live_endpoints: [n3]
        unreachable_endpoints: [n2]
        endpoint_state_map:
          n2: {alive: false}
    faults:
      - {target: read-command-verb-handler.do-verb, type: timeout, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'read-timeout' && result.error.status == 4608"
