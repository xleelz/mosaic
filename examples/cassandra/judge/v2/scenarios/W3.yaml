schema_version: 1
id: cassandra
scenarios:
  - id: bench-w3
    flow: cql-write
    name: "W3: INSERT at QUORUM, n2 and n3 down: Unavailable before any send, no hints"
    fixtures: [three-node-rf3]
    input:
      options: {consistency: QUORUM}
      statement: {type: INSERT, keyspace: shop, table: users, columns: {id: "user:42", name: Ada, email: ada@example.com}}
    state:
      gossiper@n1: {endpoint_state_map: {n2: {alive: false}, n3: {alive: false}}}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "result.error.data.required == 2 && result.error.data.alive == 1"
      - "calls['replica-plans.assure-sufficient-live-replicas'] == 1"
      - "calls['storage-proxy.send-to-hinted-replicas'] == 0 && calls['mutation-verb-handler.do-verb'] == 0 && calls['storage-proxy.perform-locally'] == 0"
      - "calls['storage-proxy.submit-hint'] == 0 && calls['storage-proxy.should-hint'] == 0 && calls['storage-proxy-hint-runnable.run'] == 0"
