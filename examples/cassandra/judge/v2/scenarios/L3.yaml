schema_version: 1
id: cassandra
scenarios:
  - id: bench-l3
    flow: cql-conditional-write
    fixtures: [three-node-rf3]
    name: "L3: LWT with n2 and n3 down: UnavailableException(SERIAL, required 2, alive 1) from forPaxos before any ballot"
    input:
      statement:
        keyspace: shop
        table: users
        type: INSERT
        if_not_exists: true
        columns: {name: Ada}
        partition_keys:
          - {partition_key: "user:42", token: -7509452495886106294}
    state:
      gossiper@n1:
        endpoint_state_map:
          n2: {alive: false}
          n3: {alive: false}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "result.error.data.consistency == 'SERIAL' && result.error.data.required == 2 && result.error.data.alive == 1"
      - "calls['replica-plans.for-paxos'] == 1 && calls['ballot-generator.next-ballot'] == 0 && calls['storage-proxy.prepare-paxos'] == 0"
      - "calls['prepare-verb-handler.do-verb'] == 0 && calls['storage-proxy.read-one'] == 0"
