schema_version: 1
id: cassandra
scenarios:
  - id: bench-b2
    flow: cql-batch
    fixtures: [three-node-rf3]
    name: "B2: LOGGED batch with n3 down: batchlog on n2 only (CL ONE), mutations succeed at QUORUM, n3 hinted, batchlog removed"
    state:
      gossiper@n1:
        endpoint_state_map:
          n3: {alive: false}
    expect:
      - "result.ok && result.value.kind == 'VOID'"
      - "ctx.batchlogEndpoints == ['n2'] && trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.sync-write-to-batchlog' && e.input.consistency == 'ONE')"
      - "calls_by_instance['batch-store-verb-handler.do-verb@n2'] == 1 && calls_by_instance['batch-store-verb-handler.do-verb@n3'] == 0"
      # no message to n3; each mutation hinted for n3 (shouldHint + submitHint)
      - "calls_by_instance['mutation-verb-handler.do-verb@n3'] == 0 && calls_by_instance['mutation-verb-handler.do-verb@n2'] == 2"
      - "calls['storage-proxy.submit-hint'] == 2 && trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n3' in e.input.targets)"
      # QUORUM reached for every mutation -> batchlog removed
      - "calls['storage-proxy.async-remove-from-batchlog'] == 1 && calls_by_instance['batch-remove-verb-handler.do-verb@n2'] == 1"
      - "size(state['batchlog-manager@n2'].batches) == 0"
