schema_version: 1
id: cassandra
scenarios:
  - id: bench-w8
    flow: replica-mutation-verb
    name: "W8: replica n2 appends to the commit log, then writes the memtable, then replies MUTATION_RSP without waiting for an fsync (periodic, last sync recent)"
    fixtures: [three-node-rf3]
    state:
      abstract-commit-log-service@n2: {last_synced_at_ms: 1793318395000}   # synced 5s before the request
    expect:
      - "result.ok && result.value.verb == 'MUTATION_RSP' && result.value.from == 'n2'"
      - "config['commitlog-sync'] == 'periodic' && config['commitlog-sync-period-ms'] == 10000"
      - "calls_by_instance['commit-log.add@n2'] == 1 && calls_by_instance['cassandra-table-write-handler.write@n2'] == 1"
      # commit log append (beginWrite) strictly before the memtable write
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'commit-log.add' && e.instance == 'n2')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'cassandra-table-write-handler.write' && e.instance == 'n2')[0].seq"
      # no fsync and no wait for one on the write path
      - "calls['commitlog-disk.segment-sync'] == 0 && calls['abstract-commit-log-service.await-sync-at'] == 0"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'periodic-commit-log-service.maybe-wait-for-sync' && e.output.waited == false)"
      - "size(state['commit-log@n2'].segments_on_disk['CommitLog-8-1.log'].entries) == 1"
  - id: bench-w8-lag
    flow: replica-mutation-verb
    name: "W8 (lag block): the last sync is 20s old (> 1.5 x 10000ms), so the writer waits for a sync before the memtable write"
    fixtures: [three-node-rf3]
    state:
      abstract-commit-log-service@n2: {last_synced_at_ms: 1793318380000}
    expect:
      - "result.ok && result.value.verb == 'MUTATION_RSP'"
      - "config['periodic-commitlog-sync-lag-block-ms'] == 15000"
      - "calls_by_instance['abstract-commit-log-service.await-sync-at@n2'] == 1 && ctx.waitedOnCommit == true && calls['commitlog-disk.segment-sync'] >= 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'abstract-commit-log-service.await-sync-at')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'cassandra-table-write-handler.write')[0].seq"
