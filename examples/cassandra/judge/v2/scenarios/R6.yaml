- id: bench-r6-tombstone-overwhelming-read-failure
  name: 'R6: 200000 tombstones on the data replica n3: TombstoneOverwhelmingException, a READ_TOO_MANY_TOMBSTONES failure response, ReadFailure at once without speculation'
  flow: coordinator-read
  fixtures:
  - three-node-rf3
  input: *id002
  state:
    tracker@n1:
      views:
        shop.users:
          sstables:
          - age_s: 3600
            droppable_tombstone_ratio: 0
            fully_expired: false
            id: nb-1
            level: 0
            max_timestamp: 1000
            partitions:
              user:42:
                cells:
                - column: name
                  timestamp: 1000
                  value: Ada
                tombstones: 0
            pending_repair: ''
            purgeable_tombstones: 0
            read_rate: 0
            repaired: false
            size_mb: 10
            tombstones: 0
            unowned_mb: 0
            window: 0
    tracker@n3:
      views:
        shop.users:
          sstables:
          - age_s: 3600
            droppable_tombstone_ratio: 0
            fully_expired: false
            id: nb-1
            level: 0
            max_timestamp: 1000
            partitions:
              user:42:
                cells:
                - column: name
                  timestamp: 1000
                  value: Ada
                tombstones: 200000
            pending_repair: ''
            purgeable_tombstones: 0
            read_rate: 0
            repaired: false
            size_mb: 10
            tombstones: 0
            unowned_mb: 0
            window: 0
  expect:
  - '!result.ok && result.error.code == ''read-failure'' && result.error.status == 4864'
  - result.error.data.failure_reasons == ['READ_TOO_MANY_TOMBSTONES'] && result.error.data.block_for == 2
  - ctx.speculated == false
  - trace.exists(e, e.type == 'call.end' && e.interface == 'read-command.execute-locally' && e.instance == 'n3' && e.error.code == 'tombstone-overwhelming')
  - state['read-command@n3'].tombstone_failures == 1
