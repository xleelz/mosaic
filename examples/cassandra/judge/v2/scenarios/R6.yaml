schema_version: 1
id: cassandra
scenarios:
- id: bench-r6-warning-from-coordinator-local-read
  name: 'R6: 5000 tombstones on the coordinator n1 (its own digest read): warning logged and returned to the client through ClientWarn'
  flow: native-query
  fixtures:
  - three-node-rf3
  input: &id001
    query: SELECT name FROM shop.users WHERE id = 'user:42'
    statement:
      bind_markers: 0
      columns:
        name: ''
      fully_qualified: true
      keyspace: shop
      partition_keys:
      - partition_key: user:42
        token: 100
      table: users
      type: SELECT
  state:
    tracker@n1:
      views:
        shop.users:
          sstables:
          - age_s: 3600
            droppable_tombstone_ratio: 0
            fully_expired: false
            id: nb-1
            level: 0
            max_timestamp: 1000
            partitions:
              user:42:
                cells:
                - column: name
                  timestamp: 1000
                  value: Ada
                tombstones: 5000
            pending_repair: ''
            purgeable_tombstones: 0
            read_rate: 0
            repaired: false
            size_mb: 10
            tombstones: 0
            unowned_mb: 0
            window: 0
    tracker@n3:
      views:
        shop.users:
          sstables:
          - age_s: 3600
            droppable_tombstone_ratio: 0
            fully_expired: false
            id: nb-1
            level: 0
            max_timestamp: 1000
            partitions:
              user:42:
                cells:
                - column: name
                  timestamp: 1000
                  value: Ada
                tombstones: 0
            pending_repair: ''
            purgeable_tombstones: 0
            read_rate: 0
            repaired: false
            size_mb: 10
            tombstones: 0
            unowned_mb: 0
            window: 0
  expect:
  - result.ok
  - state['read-command@n1'].tombstone_warnings == 1
  - has(result.value.warnings) && result.value.warnings.exists(w, w.contains('5000 tombstone cells'))
