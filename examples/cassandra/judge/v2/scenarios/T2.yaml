schema_version: 1
id: cassandra
scenarios:
  - id: bench-t2
    flow: native-query
    fixtures: [three-node-rf3]
    name: "T2: QUERY with a misspelled keyword: the parser's SyntaxException, SYNTAX_ERROR (0x2000); nothing executes"
    input:
      query: "SELEC name FROM shop.users WHERE id = 'user:42'"
    expect:
      - "!result.ok && result.error.code == 'syntax-error' && result.error.status == 8192"
      - "result.error.message.contains('SELEC')"
      - "calls['query-processor.parse'] == 1 && calls['cql-fragment-parser.parse-any-unhandled'] == 1"
      - "calls['query-processor.process'] == 0 && calls['storage-proxy.read'] == 0"
