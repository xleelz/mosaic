schema_version: 1
id: cassandra
scenarios:
  - id: bench-r4-one-slow-replica-speculates
    name: "R4: ONE, the chosen replica n3 answers after 4000ms; at start + 2500ms (initial sampleReadLatency = read timeout / 2) a data request goes to the first uncontacted candidate, n1, whose response is returned"
    flow: coordinator-read
    fixtures: [three-node-rf3]
    input:
      consistency: ONE
      read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 100, columns: [name], digest: false, limit: 100}
    state:
      skip-list-memtable@n1:
        cells:
          "shop.users:user:42:name": {column: name, keyspace: shop, partition_key: "user:42", replica: n1, table: users, timestamp: 1000, value: Ada}
      skip-list-memtable@n3:
        cells:
          "shop.users:user:42:name": {column: name, keyspace: shop, partition_key: "user:42", replica: n3, table: users, timestamp: 1000, value: Ada}
    faults:
      - {target: read-command-verb-handler.do-verb, type: latency, latency_ms: 4000, instance: n3}
    expect:
      - "result.ok"
      - "ctx.read_executor == 'speculating' && ctx.read.contacts[0] == 'n3'"
      - "ctx.speculated && ctx.speculated_kind == 'data' && ctx.speculated_to == 'n1'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy-local-read-runnable.run' && e.instance == 'n1' && e.input.read_command.digest == false && e.t >= 2500)"
      - "duration_ms >= 2500 && duration_ms < 4000"
      - "result.value.rows[0].cells.exists(c, c.column == 'name' && c.value == 'Ada')"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'read-command-verb-handler.do-verb' && e.instance == 'n3' && e.late)"
  - id: bench-r4-sampled-latency-used
    name: "R4: with a sampled 99p of 20ms the speculation fires at about 20ms, not 2500ms"
    flow: coordinator-read
    fixtures: [three-node-rf3]
    input:
      consistency: ONE
      read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 100, columns: [name], digest: false, limit: 100}
    state:
      abstract-read-executor:
        table_params:
          shop.users: {read_repair: BLOCKING, speculative_retry: 99p, sample_read_latency_ms: 20}
    faults:
      - {target: read-command-verb-handler.do-verb, type: latency, latency_ms: 4000, instance: n3}
    expect:
      - "result.ok && ctx.speculated && ctx.speculated_to == 'n1'"
      - "duration_ms >= 20 && duration_ms < 500"
