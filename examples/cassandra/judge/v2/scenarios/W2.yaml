schema_version: 1
id: cassandra
scenarios:
  - id: bench-w2
    flow: cql-write
    name: "W2: INSERT at QUORUM, n3 down per the failure detector: success, n3 hinted"
    fixtures: [three-node-rf3]
    input:
      options: {consistency: QUORUM}
      statement: {type: INSERT, keyspace: shop, table: users, columns: {id: "user:42", name: Ada, email: ada@example.com}}
    state:
      gossiper@n1: {endpoint_state_map: {n3: {alive: false}}}
    expect:
      - "result.ok && ctx.acks == 2 && ctx.block_for == 2"
      - "calls_by_instance['mutation-verb-handler.do-verb@n2'] == 1 && calls['mutation-verb-handler.do-verb'] == 1"
      - "calls_by_instance['storage-proxy.perform-locally@n1'] == 1"
      - "calls['storage-proxy.submit-hint'] == 1 && ctx.hinted == ['n3']"
      # shouldHint ran for the down replica and passed (downtime under max_hint_window, host id in ring)
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'storage-proxy.should-hint' && e.output.should_hint == true)"
      # the hint is submitted before the sends (StorageProxy.java:1563 precedes 1566-1576)
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'mutation-verb-handler.do-verb')[0].seq"
      # the hint reaches the hint store for n3's host id
      - "calls['storage-proxy-hint-runnable.run'] == 1"
