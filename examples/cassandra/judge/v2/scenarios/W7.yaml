schema_version: 1
id: cassandra
scenarios:
  - id: bench-w7
    flow: cql-write
    name: "W7: INSERT at ALL, n2 down: Unavailable (required 3, alive 2) before any send"
    fixtures: [three-node-rf3]
    input:
      options: {consistency: ALL}
      statement: {type: INSERT, keyspace: shop, table: users, columns: {id: "user:42", name: Ada, email: ada@example.com}}
    state:
      gossiper@n1: {endpoint_state_map: {n2: {alive: false}}}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "result.error.data.required == 3 && result.error.data.alive == 2"
      - "calls['mutation-verb-handler.do-verb'] == 0 && calls['storage-proxy.perform-locally'] == 0 && calls['storage-proxy.submit-hint'] == 0"
