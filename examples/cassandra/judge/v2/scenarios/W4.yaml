schema_version: 1
id: cassandra
scenarios:
  - id: bench-w4
    flow: cql-write
    name: "W4: INSERT at QUORUM, n2 and n3 alive per the FD but never answer: WriteTimeout 1/2 SIMPLE at 2000ms, both hinted on callback expiry"
    fixtures: [three-node-rf3]
    input:
      options: {consistency: QUORUM}
      statement: {type: INSERT, keyspace: shop, table: users, columns: {id: "user:42", name: Ada, email: ada@example.com}}
    faults:
      - {target: mutation-verb-handler.do-verb, type: timeout}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.status == 4352"
      - "result.error.data.received == 1 && result.error.data.block_for == 2 && result.error.data.write_type == 'SIMPLE'"
      - "config['write-request-timeout-ms'] == 2000 && duration_ms >= 2000 && duration_ms < 2200"
      - "calls['replica-plans.assure-sufficient-live-replicas'] == 1 && calls_by_instance['storage-proxy.perform-locally@n1'] == 1"
      - "calls['storage-proxy.submit-hint'] == 2 && ctx.hinted.size() == 2 && 'n2' in ctx.hinted && 'n3' in ctx.hinted"
      # hints are written when each callback expires, i.e. after the write timeout, not before the send
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint').all(e, e.t >= 2000)"
