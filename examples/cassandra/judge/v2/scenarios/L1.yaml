schema_version: 1
id: cassandra
scenarios:
  - id: bench-l1
    flow: cql-conditional-write
    fixtures: [three-node-rf3]
    name: "L1: INSERT ... IF NOT EXISTS, no contention: v1 prepare (majority), QUORUM read, propose, commit at QUORUM; [applied] true"
    input:
      statement:
        keyspace: shop
        table: users
        type: INSERT
        if_not_exists: true
        columns: {name: Ada}
        partition_keys:
          - {partition_key: "user:42", token: -7509452495886106294}
    expect:
      - "result.ok && result.value.applied == true && result.value.rows[0]['[applied]'] == true"
      # paxos_variant unset -> v1 (Config.java:1051) -> legacyCas (SP:325-328)
      - "calls['storage-proxy.legacy-cas'] == 1 && calls['paxos.cas'] == 0"
      - "calls['ballot-generator.next-ballot'] == 1 && ctx.casContentions == 0"
      # prepare: local + PAXOS_PREPARE_REQ to n2, n3 (all live contacts)
      - "calls_by_instance['paxos-state.legacy-prepare@n1'] == 1 && calls_by_instance['prepare-verb-handler.do-verb@n2'] == 1 && calls_by_instance['prepare-verb-handler.do-verb@n3'] == 1"
      # precondition read at QUORUM, after the prepare and before the propose
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.read-one' && e.input.consistency == 'QUORUM')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.prepare-paxos')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.read-one')[0].seq && trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.read-one')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.propose-paxos')[0].seq"
      - "ctx.casConditionMet == true && calls['paxos-state.legacy-propose'] == 3"
      # commit on all three replicas, applied to the commit log and memtable
      - "calls['storage-proxy.commit-paxos'] == 1 && ctx.commitAcks >= 2 && calls['paxos-state.commit-direct'] == 3"
      - "calls_by_instance['commit-log.add@n1'] == 1 && calls_by_instance['commit-log.add@n2'] == 1 && calls_by_instance['commit-log.add@n3'] == 1"
      - "state['paxos-state@n3'].rows['shop.users:user:42'].committed_columns.name == 'Ada'"
      - "calls['storage-proxy.mutate-with-triggers'] == 0"
