          rack: rack1
          tokens:
          - -6148914691236517206
          rpc_ready: true
          update_ms: 0
        n2:
          endpoint: n2
          alive: true
          status: NORMAL
          generation: 1793314800
          heartbeat: 350
          max_version: 360
          host_id: 6d194555-f6eb-41d0-c000-000000000002
          dc: datacenter1
          rack: rack1
          tokens:
          - 0
          rpc_ready: true
          update_ms: 0
        n3:
          endpoint: n3
          alive: true
          status: NORMAL
          generation: 1793314800
          heartbeat: 330
          max_version: 340
          host_id: 6d194555-f6eb-41d0-c000-000000000003
          dc: datacenter1
          rack: rack1
          tokens:
          - 6148914691236517205
          rpc_ready: true
          update_ms: 0
    failure-detector@n4:
      local_endpoint: n4
      arrival_samples:
        n1:
          t_last_ms: 1793318400000
          mean_ms: 1000
        n2:
          t_last_ms: 1793318400000
          mean_ms: 1000
        n3:
          t_last_ms: 1793318400000
          mean_ms: 1000
    token-metadata@n4:
      ring:
      - token: -6148914691236517206
        endpoint: n1
      - token: 0
        endpoint: n2
      - token: 6148914691236517205
        endpoint: n3
      host_ids:
        n1: 6d194555-f6eb-41d0-c000-000000000001
        n2: 6d194555-f6eb-41d0-c000-000000000002
        n3: 6d194555-f6eb-41d0-c000-000000000003
      bootstrap_tokens: []
      leaving_endpoints: []
      moving_endpoints: []
      pending_ranges: []
    storage-service@n4:
      local_endpoint: n4
      is_seed: false
      saved_tokens: []
      num_tokens: 1
      bootstrap_state: NEEDS_BOOTSTRAP
      initialized: false
      joined: false
      operation_mode: STARTING
  steps:
  - flow: membership-node-startup
    'on': n4
    as: join
  expect:
  - trace.exists(e, e.type == 'call.start' && e.interface == 'stream-plan.execute' && e.input.peer == 'n1' && '(-6148914691236517206,0]' in e.input.ranges)
  - trace.exists(e, e.type == 'call.start' && e.interface == 'stream-plan.execute' && e.input.peer == 'n2' && '(0,6148914691236517205]' in e.input.ranges)
  - trace.exists(e, e.type == 'call.start' && e.interface == 'stream-plan.execute' && e.input.peer == 'n3' && '(6148914691236517205,-7686143364045646507]' in e.input.ranges)
- id: bench-g3-fresh-node-local-state
