# G3 (round 2). Verified: on the joining node StorageService.bootstrap (StorageService.java:2208-2264)
# gossips TOKENS + STATUS=BOOT (:2216-2224), sleeps RING_DELAY 30 s (:2225-2226), requires a seed
# (:2232-2233), streams via BootStrapper/RangeStreamer, which excludes this node and picks a source per
# range (RangeStreamer.java:237-243, 314), then bootstrapFinished/finishJoiningRing -> NORMAL (:1428ff).
# Peers: handleStateBootstrap (:3123) records bootstrap tokens and pending ranges; writes include the
# pending replica and blockFor grows by the pending count (ConsistencyLevel.java:172-190);
# handleStateNormal (:3311) moves it into the ring.
schema_version: 1
id: cassandra
scenarios:
- id: bench-g3-join-end-to-end
  # round 3 (timing only): gossip rounds now run from Gossiper.start (Gossiper.java:2028-2031) and land after the
  # join, carrying NORMAL to n1 first. In the code n4 gossips BOOT during the RING_DELAY sleep
  # (StorageService.java:2216-2226), so the injected BOOT ACK2 now arrives at 5 s and the write at 10 s, inside
  # RING_DELAY; NORMAL at 40 s, after the join. Assertions unchanged.
  max_virtual_ms: 120000
  name: 'G3: n4 (not a seed) starts: BOOT with its token, RING_DELAY, streams from n1-n3, NORMAL. n1 learns BOOT through gossip, a QUORUM write then also goes to pending n4 (blockFor
    3); n1 learns NORMAL and n4 enters its ring'
  fixtures:
  - three-node-rf3
  topology:
    cassandra-node:
    - n1
    - n2
    - n3
    - n4
  state:
    gossiper@n4:
      local_endpoint: n4
      seeds:
      - n1
      configured_seeds:
      - n1
      local_time_s: 1793318400
      live_endpoints:
      - n1
      - n2
      - n3
      unreachable_endpoints: []
      endpoint_state_map:
        n4:
          endpoint: n4
          alive: true
          generation: 1793318400
          heartbeat: 0
          max_version: 0
          host_id: 6d194555-f6eb-41d0-c000-000000000004
          dc: datacenter1
          rack: rack1
          update_ms: 0
        n1:
          endpoint: n1
          alive: true
          status: NORMAL
          generation: 1793314800
          heartbeat: 400
          max_version: 420
          host_id: 6d194555-f6eb-41d0-c000-000000000001
          dc: datacenter1
          rack: rack1
          tokens:
          - -6148914691236517206
          rpc_ready: true
          update_ms: 0
        n2:
          endpoint: n2
          alive: true
          status: NORMAL
          generation: 1793314800
          heartbeat: 350
          max_version: 360
          host_id: 6d194555-f6eb-41d0-c000-000000000002
          dc: datacenter1
          rack: rack1
          tokens:
          - 0
          rpc_ready: true
          update_ms: 0
        n3:
          endpoint: n3
          alive: true
          status: NORMAL
          generation: 1793314800
          heartbeat: 330
          max_version: 340
          host_id: 6d194555-f6eb-41d0-c000-000000000003
          dc: datacenter1
          rack: rack1
          tokens:
          - 6148914691236517205
          rpc_ready: true
          update_ms: 0
    failure-detector@n4:
      local_endpoint: n4
      arrival_samples:
        n1:
          t_last_ms: 1793318400000
          mean_ms: 1000
        n2:
          t_last_ms: 1793318400000
          mean_ms: 1000
        n3:
          t_last_ms: 1793318400000
          mean_ms: 1000
    token-metadata@n4:
      ring:
      - token: -6148914691236517206
        endpoint: n1
      - token: 0
        endpoint: n2
      - token: 6148914691236517205
        endpoint: n3
      host_ids:
        n1: 6d194555-f6eb-41d0-c000-000000000001
        n2: 6d194555-f6eb-41d0-c000-000000000002
        n3: 6d194555-f6eb-41d0-c000-000000000003
      bootstrap_tokens: []
      leaving_endpoints: []
      moving_endpoints: []
      pending_ranges: []
    storage-service@n4:
      local_endpoint: n4
      is_seed: false
      saved_tokens: []
      num_tokens: 1
      bootstrap_state: NEEDS_BOOTSTRAP
      initialized: false
      joined: false
      operation_mode: STARTING
  steps:
  - flow: membership-node-startup
    'on': n4
    as: join
  - flow: membership-gossip-ack2
    'on': n1
    input:
      from: n4
      states:
      - endpoint: n4
        generation: 1793318400
        heartbeat: 3
        max_version: 5
        host_id: 6d194555-f6eb-41d0-c000-000000000004
        dc: datacenter1
        rack: rack1
        tokens:
        - -7686143364045646507
        status: BOOT
    as: boot
    at_ms: 5000
  - flow: coordinator-write
    'on': n1
    input:
      consistency: QUORUM
      mutations:
      - keyspace: shop
        table: orders
        partition_key: order:9
        token: 100
        counter: false
        timestamp: 1793318400000000
        columns:
          total: 1
    as: write
    at_ms: 10000
  - flow: membership-gossip-ack2
    'on': n1
    input:
      from: n4
      states:
      - endpoint: n4
        generation: 1793318400
        heartbeat: 40
        max_version: 50
        host_id: 6d194555-f6eb-41d0-c000-000000000004
        dc: datacenter1
        rack: rack1
        tokens:
        - -7686143364045646507
        status: NORMAL
        rpc_ready: true
    as: normal
    at_ms: 40000
  expect:
  - steps.join.result.ok && steps.join.result.value.operation_mode == 'NORMAL' && state['storage-service@n4'].bootstrap_state == 'COMPLETED'
  - steps.join.duration_ms >= 30000
  - trace.exists(e, e.type == 'call.start' && e.interface == 'gossiper.add-local-application-state' && e.instance == 'n4' && e.input.value == 'BOOT')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'range-streamer.fetch-async' && e.instance == 'n4')
  - state['token-metadata@n4'].ring.exists(r, r.endpoint == 'n4')
  - steps.write.result.ok && steps.write.result.value.block_for == 3
  - trace.exists(e, e.type == 'call.start' && e.interface == 'mutation-verb-handler.do-verb' && e.instance == 'n4')
  - state['token-metadata@n1'].ring.exists(r, r.endpoint == 'n4' && r.token == -7686143364045646507)
  - state['token-metadata@n1'].bootstrap_tokens == [] && size(state['token-metadata@n1'].pending_ranges) == 0
- id: bench-g3-strict-sources
  name: 'G3 (round 2 expected to fail; passes in round 3): under cassandra.consistent.rangemovement (default true) each range is fetched from the old replica that loses it (RangeStreamer.java:501-512): (n1,n2]
