schema_version: 1
id: cassandra
scenarios:
  - id: bench-w1
    flow: cql-write
    name: "W1: INSERT at QUORUM, all replicas up"
    fixtures: [three-node-rf3]
    input:
      options: {consistency: QUORUM}
      statement: {type: INSERT, keyspace: shop, table: users, columns: {id: "user:42", name: Ada, email: ada@example.com}}
    expect:
      - "result.ok"
      - "calls['storage-proxy.mutate-with-triggers'] == 1 && calls['storage-proxy.mutate'] == 1"
      - "calls_by_instance['mutation-verb-handler.do-verb@n2'] == 1 && calls_by_instance['mutation-verb-handler.do-verb@n3'] == 1"
      - "!('mutation-verb-handler.do-verb@n1' in calls_by_instance) || calls_by_instance['mutation-verb-handler.do-verb@n1'] == 0"
      - "calls_by_instance['storage-proxy.perform-locally@n1'] == 1"
      - "calls['storage-proxy.submit-hint'] == 0"
      - "ctx.block_for == 2 && ctx.write_type == 'SIMPLE'"
