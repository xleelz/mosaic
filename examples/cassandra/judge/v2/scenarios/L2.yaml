schema_version: 1
id: cassandra
scenarios:
  - id: bench-l2
    fixtures: [three-node-rf3]
    name: "L2: UPDATE ... IF name = 'Bob' on a row whose name is Ada: [applied] false with current values; v1 still proposes (and a quorum accepts) an empty update, no commit"
    steps:
      - flow: cql-conditional-write
        as: seed
        input:
          statement:
            keyspace: shop
            table: users
            type: INSERT
            if_not_exists: true
            columns: {name: Ada}
            partition_keys:
              - {partition_key: "user:42", token: -7509452495886106294}
      - flow: cql-conditional-write
        as: upd
        input:
          statement:
            keyspace: shop
            table: users
            type: UPDATE
            if_not_exists: false
            conditions: {name: Bob}
            columns: {name: Cy}
            partition_keys:
              - {partition_key: "user:42", token: -7509452495886106294}
    expect:
      - "steps.seed.result.ok && steps.seed.result.value.applied == true"
      - "result.ok && result.value.applied == false && result.value.rows[0]['[applied]'] == false && result.value.rows[0].name == 'Ada'"
      - "ctx.casConditionMet == false"
      # the empty proposal is sent and accepted by all 3 (second propose round), commit only once (the seed's)
      - "calls['storage-proxy.propose-paxos'] == 2 && calls['paxos-state.legacy-propose'] == 6"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.propose-paxos' && e.input.proposal.update_empty == true)"
      - "calls['storage-proxy.commit-paxos'] == 1"
      - "state['paxos-state@n2'].rows['shop.users:user:42'].committed_columns.name == 'Ada' && state['paxos-state@n2'].rows['shop.users:user:42'].accepted_empty == true"
