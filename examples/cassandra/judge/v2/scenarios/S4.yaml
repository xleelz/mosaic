schema_version: 1
id: cassandra
scenarios:
  - id: bench-s4
    fixtures: [three-node-rf3, auth-users]
    name: "S4: PasswordAuthenticator: STARTUP -> AUTHENTICATE; AUTH_RESPONSE with a wrong password -> bad-credentials (0x0100); connection stays AUTHENTICATING"
    steps:
      - {flow: native-startup, as: start}
      - {flow: native-auth-response, as: auth, input: {username: alice, password: wrong}}
    expect:
      - "steps.start.result.ok && steps.start.result.value.type == 'AUTHENTICATE' && steps.start.result.value.authenticator == 'org.apache.cassandra.auth.PasswordAuthenticator'"
      - "!steps.auth.result.ok && steps.auth.result.error.code == 'bad-credentials' && steps.auth.result.error.status == 256"
      - "steps.auth.result.error.message == 'Provided username alice and/or password are incorrect'"
      - "calls['password-authenticator-plain-text-sasl-authenticator.evaluate-response'] == 1 && calls['password-authenticator.authenticate'] == 1 && calls['password-authenticator-credentials-cache.get'] == 1"
      - "calls['client-state.login'] == 0 && state['server-connection@n1'].stage == 'AUTHENTICATING' && state['client-state@n1'].user == ''"
  - id: bench-s4-good-password
    fixtures: [three-node-rf3, auth-users]
    name: "S4 control: the right password authenticates (AUTH_SUCCESS) and logs in alice"
    steps:
      - {flow: native-startup, as: start}
      - {flow: native-auth-response, as: auth, input: {username: alice, password: s3cret}}
    expect:
      - "steps.auth.result.ok && calls['client-state.login'] == 1 && state['client-state@n1'].user == 'alice' && state['server-connection@n1'].stage == 'READY'"
