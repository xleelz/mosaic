schema_version: 1
id: cassandra
scenarios:
  - id: bench-w2
    flow: coordinator-write
    name: "W2: INSERT at QUORUM, one replica down per the failure detector (down 10 min, inside max_hint_window 3h)"
    input:
      consistency: QUORUM
      mutations:
        - {keyspace: ks1, table: users, partition_key: "user:42", token: 100, timestamp: 1730000000000000, counter: false, columns: {name: Ada}}
    state:
      gossiper:
        endpoint_state_map:
          10.0.0.2: {alive: false, down_since_ms: -600000}
    expect:
      - "result.ok && result.value.block_for == 2 && result.value.acks == 2"
      - "calls['mutation-verb-handler.do-verb'] == 1 && calls['storage-proxy.perform-locally'] == 1 && calls['commit-log.add'] == 2"
      - "calls['storage-proxy.should-hint'] == 1 && calls['storage-proxy.submit-hint'] == 1 && ctx.hinted == ['10.0.0.2']"
      - "calls['storage-proxy-hint-runnable.run'] == 1 && calls['hints-service.write'] == 1 && ctx.hintsCreated == 1"
