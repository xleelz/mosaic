schema_version: 1
id: cassandra
scenarios:
  # Verified expectation (5.0.9): doStatusCheck calls FailureDetector.interpret per endpoint
  # (Gossiper.java:1154). phi = (now - tLast) / mean (FailureDetector.java:541-547); conviction when
  # PHI_FACTOR * phi > phi_convict_threshold (8, Config.java:177; conf/cassandra.yaml:1471 commented), with
  # PHI_FACTOR = 1/ln(10) (FailureDetector.java:99, 360), i.e. about 18.4 mean intervals of silence. Skipped after a
  # local pause > 5 s (:344-353). Listeners: Gossiper.convict -> markDead (Gossiper.java:606-628, 1502-1531) ->
  # subscribers' onDead; StorageService.onDead interrupts outbound connections and notifies clients DOWN
  # (StorageService.java:3884-3890). Correction: hints are NOT a gossip subscriber in 5.0.9 - dispatch stops because
  # HintsStore.isLive / the dispatcher's shouldAbort read FailureDetector.isAlive (HintsStore.java:146-150,
  # HintsDispatchExecutor.java:288).
  - id: bench-g2-convict-after-18-5s
    flow: membership-gossip-round
    name: 10.0.0.2 silent 18.5 s with a 1 s mean (0.434 * 18.5 = 8.03 > 8) - convicted, marked DOWN, subscribers notified
    state:
      failure-detector:
        arrival_samples: {"10.0.0.2": {mean_ms: 1000, t_last_ms: -18500}}
    expect:
      - "ctx.convicted == ['10.0.0.2'] && calls['gossiper.convict'] == 1 && calls['gossiper.mark-dead'] == 1"
      - "state.gossiper.endpoint_state_map['10.0.0.2'].alive == false && state.gossiper.unreachable_endpoints == ['10.0.0.2']"
      - "state.gossiper.live_endpoints == ['10.0.0.3']"
      - "calls['storage-service.on-dead'] == 1 && calls['server-event-notifier.on-down'] == 1 && ctx.interrupted_outbound == ['10.0.0.2']"
      - "calls['hints-service.pause-dispatch'] == 0 && calls['hints-dispatch-trigger.run'] == 0"
  - id: bench-g2-no-convict-at-18s
    flow: membership-gossip-round
    name: 10.0.0.2 silent 18 s (0.434 * 18 = 7.82 < 8) - not convicted (phi > 8 alone would have convicted)
    state:
      failure-detector:
        arrival_samples: {"10.0.0.2": {mean_ms: 1000, t_last_ms: -18000}}
    expect:
      - "!has(ctx.convicted) && calls['gossiper.mark-dead'] == 0"
      - "state.gossiper.endpoint_state_map['10.0.0.2'].alive == true"
  - id: bench-g2-local-pause
    flow: membership-gossip-round
    name: The previous interpret was 10 s ago (local pause > 5 s) - nobody is convicted
    state:
      failure-detector:
        last_interpret_ms: -10000
        arrival_samples: {"10.0.0.2": {mean_ms: 1000, t_last_ms: -30000}}
    expect:
      - "!has(ctx.convicted) && state.gossiper.endpoint_state_map['10.0.0.2'].alive == true"
  - id: bench-g2-dispatch-aborts-when-down
    flow: hb-hints-dispatch-task
    name: A dispatch task for 10.0.0.2 after it was convicted - the dispatcher's shouldAbort (FD.isAlive) stops it, file kept
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false, down_since_ms: -1000}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
      hints-catalog:
        stores:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002": {holder: 10.0.0.1, host_id: 6d194555-f6eb-41d0-c000-000000000002, key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002"}
      hints-store:
        hints:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1":
            creation_time: 0
            hint: {creation_time: 0, gcgs: 864000, mutation: {columns: {status: placed}, keyspace: ks1, partition_key: "user:42", table: orders, timestamp: 1, token: 100}}
            holder: 10.0.0.1
            host_id: 6d194555-f6eb-41d0-c000-000000000002
            key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1"
            size_bytes: 512
            stage: file
    expect:
      - "calls['hint-verb-handler.do-verb'] == 0 && size(state['hints-store'].hints) == 1"
      - "calls['failure-detector.is-alive'] >= 1"
