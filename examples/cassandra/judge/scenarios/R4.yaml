schema_version: 1
id: cassandra
scenarios:
  - id: bench-r4
    flow: coordinator-read
    name: "Judge R4: ONE, the chosen replica (10.0.0.3) does not answer; 99p speculative retry sends a data request to 10.0.0.1 and returns its data"
    input:
      consistency: ONE
    state:
      skip-list-memtable:
        cells:
          "10.0.0.1:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.1, table: users, timestamp: 2000, value: Ada}
    faults:
      - {target: read-command-verb-handler.do-verb, type: timeout, calls: [1]}
    expect:
      - "result.ok && size(result.value.rows) == 1 && result.value.rows[0].cells[0].value == 'Ada'"
      - "ctx.read_executor == 'speculating' && ctx.speculated == true && ctx.speculated_kind == 'data' && ctx.speculated_to == '10.0.0.1'"
      - "calls['read-command-verb-handler.do-verb'] == 1 && calls['storage-proxy-local-read-runnable.run'] == 1"
  - id: bench-r4-slow-not-hung
    flow: coordinator-read
    name: "Judge R4 (probe): ONE, the chosen replica answers after 3000ms, past the 2500ms speculation threshold; code speculates at 2500ms"
    input:
      consistency: ONE
    faults:
      - {target: read-command-verb-handler.do-verb, type: latency, latency_ms: 3000, calls: [1]}
    expect:
      - "result.ok"
      - "ctx.speculated == true"
