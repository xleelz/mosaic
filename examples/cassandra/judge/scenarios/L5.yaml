schema_version: 1
id: cassandra
scenarios:
- id: bench-l5
  flow: cql-select
  name: 'L5: SERIAL read completes an in-progress proposal (re-propose + commit at QUORUM), proposes an empty update (never committed), then reads at QUORUM'
  input:
    options:
      consistency: SERIAL
    statement:
      keyspace: shop
      table: users
      type: SELECT
      columns:
        name: null
      partition_keys:
      - partition_key: user:42
        token: -7509452495886106294
  state:
    keyspace:
      tables:
        shop.users:
          cdc: false
          skip_commitlog: false
        system.batches:
          cdc: false
          skip_commitlog: false
      durable_writes:
        shop: true
        system: true
    paxos-state:
      rows:
        10.0.0.2:user:42:
          accepted_ballot: 1767225500000000
          accepted_columns:
            name: Grace
          accepted_empty: false
          committed_ballot: 0
          committed_columns: {}
          promised: 1767225500000000
          promised_write: 1767225500000000
  expect:
  - result.ok && size(result.value.rows) == 1 && result.value.rows[0].cells.exists(c, c.column == 'name' && c.value == 'Grace')
  - calls['storage-proxy.read-with-paxos'] == 1 && calls['storage-proxy.legacy-read-with-paxos'] == 1 && calls['storage-proxy.read-regular'] == 0
  - ctx.unfinishedCommit == true && calls['storage-proxy.prepare-paxos'] == 2
  - calls['storage-proxy.propose-paxos'] == 2 && calls['storage-proxy.commit-paxos'] == 1 && ctx.commitAcks == 3
  - state['paxos-state'].rows['10.0.0.3:user:42'].committed_columns.name == 'Grace'
  - state['paxos-state'].rows['10.0.0.2:user:42'].accepted_empty == true && state['paxos-state'].rows['10.0.0.2:user:42'].accepted_ballot == ctx.lastBallot
  - state['paxos-state'].rows['10.0.0.2:user:42'].committed_ballot < ctx.lastBallot
  - calls['storage-proxy.fetch-rows'] == 1 && calls['storage-proxy.read-one'] == 0
