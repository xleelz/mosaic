schema_version: 1
id: cassandra
scenarios:
  - id: bench-t1
    flow: native-execute
    name: "T1: EXECUTE with an id not in the prepared-statement cache - PreparedQueryNotFoundException, UNPREPARED (0x2500), before any processing"
    input:
      statement_id: "md5:never-prepared"
    expect:
      - "!result.ok && result.error.code == 'unprepared' && result.error.status == 9472"
      - "result.error.message.startsWith('Prepared query with ID md5:never-prepared not found')"
      - "calls['query-processor.get-prepared'] == 1 && calls['query-processor-prepared-statements.get-if-present'] == 1 && ctx.preparedFound == false"
      - "calls['query-processor.process-prepared'] == 0 && calls['storage-proxy.read'] == 0"
  - id: bench-t1-unprepared-before-page-size
    flow: native-execute
    name: "T1: the cache lookup comes before the page-size check, so an unknown id with page_size 0 is still UNPREPARED"
    input:
      statement_id: "md5:never-prepared"
      options: {page_size: 0}
    expect:
      - "!result.ok && result.error.code == 'unprepared'"
