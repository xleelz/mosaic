schema_version: 1
id: cassandra
scenarios:
  - id: bench-p1
    flow: rs-nodetool-repair-full
    name: "P1: full repair, 10.0.0.3 diverged - Merkle trees from all three replicas, compared, mismatching pairs synced by streaming"
    state:
      cassandra-table-repair-manager:
        digests:
          10.0.0.3:ks1.users: 9f86d081
    expect:
      - "result.ok && ctx.repairOutcome == 'completed'"
      # prepare to the neighbours; deployed paxos_variant v1 means no paxos repair step
      - "calls['repair-message-verb-handler.do-verb-prepare-msg'] == 2 && calls['paxos-cleanup.cleanup'] == 0"
      # parallel (the nodetool default): no snapshot; a validation compaction on each of the 3 replicas
      - "calls['repair-message-verb-handler.do-verb-snapshot-msg'] == 0"
      - "calls['repair-message-verb-handler.do-verb-validation-req'] == 3"
      # trees compared: two differing pairs -> sync tasks, streamed
      - "ctx.syncTasks == 2 && calls['local-sync-task.start-sync'] == 1 && calls['symmetric-remote-sync-task.start-sync'] == 1"
      - "'10.0.0.1<->10.0.0.3' in ctx.streamedPairs && '10.0.0.2<->10.0.0.3' in ctx.streamedPairs && calls['stream-plan.execute'] == 2"
      - "calls['repair-message-verb-handler.do-verb-cleanup-msg'] == 2"
      # a full repair never runs anticompaction or the incremental finalize protocol
      - "calls['repair-message-verb-handler.do-verb-finalize-propose-msg'] == 0"
  - id: bench-p1-in-sync
    flow: rs-nodetool-repair-full
    name: "P1: full repair, trees match - no sync tasks, nothing streamed"
    expect:
      - "result.ok && ctx.repairOutcome == 'completed'"
      - "calls['repair-message-verb-handler.do-verb-validation-req'] == 3 && ctx.syncTasks == 0 && calls['stream-plan.execute'] == 0"
