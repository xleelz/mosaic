schema_version: 1
id: cassandra
scenarios:
  - id: bench-c1
    flow: background-compaction
    name: "C1: deployed default SizeTieredCompactionStrategy picks a bucket of 4 similar sstables (min_threshold 4), merges them, purges only the gc_grace-droppable tombstones"
    expect:
      - "state.tracker.views['10.0.0.1:shop.users'].strategy == 'SizeTieredCompactionStrategy' && state.tracker.views['10.0.0.1:shop.users'].min_threshold == 4"
      - "result.ok && result.value.submitted == 1"
      - "calls['size-tiered-compaction-strategy.get-next-background-task'] >= 1 && calls['compaction-task.execute'] == 1"
      # 4 inputs -> 1 output; 160 tombstones in, 50 purgeable (older than gc_grace, shadowing nothing) -> 110 kept
      - "size(state.tracker.views['10.0.0.1:shop.users'].sstables) == 1 && state.tracker.views['10.0.0.1:shop.users'].sstables[0].size_mb == 42"
      - "ctx.tombstones_purged == 50 && state.tracker.views['10.0.0.1:shop.users'].sstables[0].tombstones == 110"
      - "calls['data-disk.sstable-write'] == 1 && calls['lifecycle-transaction.commit'] == 1"
      # the candidate resubmits; the recheck finds nothing more to do
      - "calls['compaction-manager-background-compaction-candidate.run'] == 2 && ctx.background_result == 'no_task'"
  - id: bench-c1-below-threshold
    flow: background-compaction
    name: "C1: three sstables do not reach min_threshold, no compaction"
    state:
      tracker:
        views:
          "10.0.0.1:shop.users":
            sstables:
              - {id: nb-1, size_mb: 10, level: 0, age_s: 3600, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, unowned_mb: 0, window: 0}
              - {id: nb-2, size_mb: 12, level: 0, age_s: 3600, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, unowned_mb: 0, window: 0}
              - {id: nb-3, size_mb: 9, level: 0, age_s: 3600, tombstones: 0, purgeable_tombstones: 0, droppable_tombstone_ratio: 0, fully_expired: false, repaired: false, unowned_mb: 0, window: 0}
    expect:
      - "result.ok && calls['compaction-task.execute'] == 0 && size(state.tracker.views['10.0.0.1:shop.users'].sstables) == 3"
  - id: bench-c1-flush-trigger
    flow: memtable-force-flush
    name: "C1 probe (contract seam): a dirty flush writes an sstable but never calls CompactionManager.submitBackground (ColumnFamilyStore.replaceFlushed does)"
    state:
      abstract-commit-log-segment-manager:
        active_segments: 3
      memtable-pool:
        allocated_bytes: 600
      skip-list-memtable:
        stats:
          "10.0.0.1:ks1.users": {bytes: 600, operations: 3, partitions: 2}
    expect:
      - "result.ok && result.value.sstables == 1 && calls['data-disk.sstable-write'] == 1"
      - "calls['compaction-manager.submit-background'] == 0"
