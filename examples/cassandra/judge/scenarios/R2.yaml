schema_version: 1
id: cassandra
scenarios:
  - id: bench-r2
    flow: coordinator-read
    name: "Judge R2: QUORUM, data replica 10.0.0.3 is stale; the digest from 10.0.0.1 mismatches, full data reads, newest wins, blocking read repair to 10.0.0.3 before the response"
    input:
      consistency: QUORUM
    state:
      keyspace:
        tables:
          shop.users: {cdc: false, skip_commitlog: false}
      skip-list-memtable:
        cells:
          "10.0.0.3:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.3, table: users, timestamp: 1000, value: Old}
          "10.0.0.1:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.1, table: users, timestamp: 2000, value: New}
          "10.0.0.2:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 2000, value: New}
    expect:
      - "result.ok"
      - "ctx.digest_mismatch == true && ctx.read_repair == 'BLOCKING'"
      - "size(result.value.rows) == 1 && result.value.rows[0].cells.exists(c, c.column == 'name' && c.value == 'New' && c.timestamp == 2000)"
      - "ctx.stale_replicas == ['10.0.0.3'] && calls['read-repair-verb-handler.do-verb'] == 1"
      - "calls['read-command-verb-handler.do-verb'] == 2 && calls['storage-proxy-local-read-runnable.run'] == 2"
      - "state['skip-list-memtable'].cells['10.0.0.3:shop.users:user:42:name'].value == 'New'"
  - id: bench-r2-tombstone-wins
    flow: coordinator-read
    name: "Judge R2 (probe): 10.0.0.3 holds name=Ada@1000, this node holds a newer cell tombstone@2000. Code: replicas return unfiltered data with the tombstone, the merge hides Ada, the row is empty and read repair sends the tombstone to 10.0.0.3"
    input:
      consistency: QUORUM
    state:
      keyspace:
        tables:
          shop.users: {cdc: false, skip_commitlog: false}
      skip-list-memtable:
        cells:
          "10.0.0.3:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.3, table: users, timestamp: 1000, value: Ada}
          "10.0.0.1:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.1, table: users, timestamp: 2000, value: null, deleted: true}
    expect:
      - "result.ok && ctx.digest_mismatch == true"
      - "size(result.value.rows) == 0 || !result.value.rows[0].cells.exists(c, c.column == 'name' && c.value == 'Ada')"
      - "ctx.stale_replicas == ['10.0.0.3']"
      - "state['skip-list-memtable'].cells['10.0.0.1:shop.users:user:42:name'].deleted == true"
