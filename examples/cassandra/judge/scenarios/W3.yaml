schema_version: 1
id: cassandra
scenarios:
  - id: bench-w3
    flow: coordinator-write
    name: "W3: INSERT at QUORUM, two replicas down - Unavailable before any mutation is sent"
    input:
      consistency: QUORUM
      mutations:
        - {keyspace: ks1, table: users, partition_key: "user:42", token: 100, timestamp: 1730000000000000, counter: false, columns: {name: Ada}}
    state:
      gossiper:
        endpoint_state_map:
          10.0.0.2: {alive: false, down_since_ms: -600000}
          10.0.0.3: {alive: false, down_since_ms: -600000}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "result.error.data.required == 2 && result.error.data.alive == 1"
      - "calls['replica-plans.assure-sufficient-live-replicas'] == 1 && calls['storage-proxy.send-to-hinted-replicas'] == 0"
      - "calls['mutation-verb-handler.do-verb'] == 0 && calls['storage-proxy.perform-locally'] == 0 && calls['commit-log.add'] == 0"
      - "calls['storage-proxy.submit-hint'] == 0 && calls['hints-service.write'] == 0"
