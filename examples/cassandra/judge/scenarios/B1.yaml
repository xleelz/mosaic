schema_version: 1
id: cassandra
scenarios:
- id: bench-b1
  flow: cql-batch
  name: 'B1: LOGGED batch over two partitions, all up: BATCH_STORE to the two other live nodes (CL TWO) before any mutation, then the mutations, then BATCH_REMOVE once every mutation reached the batch CL'
  state:
    keyspace:
      tables:
        shop.users:
          cdc: false
          skip_commitlog: false
        shop.orders:
          cdc: false
          skip_commitlog: false
        system.batches:
          cdc: false
          skip_commitlog: false
      durable_writes:
        shop: true
        system: true
  expect:
  - result.ok && result.value.kind == 'VOID'
  - calls['batch-statement.execute-without-conditions'] == 1 && ctx.mutateAtomically == true && calls['storage-proxy.mutate-atomically'] == 1
  - calls['replica-plans.for-batchlog-write'] == 1 && ctx.batchlogEndpoints == ['10.0.0.2', '10.0.0.3']
  - calls['storage-proxy.sync-write-to-batchlog'] == 1 && calls['batch-store-verb-handler.do-verb'] == 2 && calls['batchlog-manager.store'] == 2 && ctx.batchlogAcks == 2
  - calls['storage-proxy.sync-write-batched-mutations'] == 1 && calls['storage-proxy.send-to-hinted-replicas'] == 2 && calls['mutation-verb-handler.do-verb'] == 4 && ctx.mutationAcks == [3, 3]
  - ctx.writeType == 'BATCH' && ctx.batchCl == 'QUORUM' && size(ctx.hinted) == 0
  - ctx.batchlogRemoved == true && calls['storage-proxy.async-remove-from-batchlog'] == 1 && calls['batch-remove-verb-handler.do-verb'] == 2 && calls['batchlog-manager.remove'] == 2
  - size(state['batchlog-manager'].batches) == 0
