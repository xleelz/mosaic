schema_version: 1
id: cassandra
scenarios:
  - id: bench-w5
    flow: coordinator-write
    name: "W5: INSERT at ONE, one remote replica times out"
    input:
      consistency: ONE
      mutations:
        - {keyspace: ks1, table: users, partition_key: "user:42", token: 100, timestamp: 1730000000000000, counter: false, columns: {name: Ada}}
    faults:
      - {target: mutation-verb-handler.do-verb, type: timeout, calls: [1]}
    expect:
      - "result.ok && result.value.block_for == 1 && result.value.acks >= 1"
      - "calls['mutation-verb-handler.do-verb'] == 2 && calls['storage-proxy.perform-locally'] == 1"
      - "calls['storage-proxy.submit-hint'] == 1 && size(ctx.hinted) == 1 && calls['hints-service.write'] == 1"
