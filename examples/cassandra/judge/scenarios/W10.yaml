schema_version: 1
id: cassandra
scenarios:
  - id: bench-w10
    flow: commitlog-replay-startup
    name: "W10: replay reapplies the unflushed entries to the memtables (not the commit log), skips the already persisted one, then flushes"
    expect:
      - "result.ok && result.value.replayed == 2"
      - "calls['keyspace.apply'] == 2 && calls['commit-log.add'] == 0 && ctx.replaySkippedPersisted == true"
      - "state['skip-list-memtable'].cells['10.0.0.1:ks1.users:user:43:name'].value == 'bob' && state['skip-list-memtable'].cells['10.0.0.1:ks1.users:user:44:name'].value == 'carol'"
      - "!('10.0.0.1:ks1.users:user:42:name' in state['skip-list-memtable'].cells)"
      - "calls['commit-log-replayer.block-for-writes'] == 1 && calls['data-disk.sstable-write'] >= 1 && calls['commitlog-disk.segment-delete'] == 1"
  - id: bench-w10-startup-order
    flow: daemon-startup
    name: "W10 (order): the daemon replays the commit log in setup, before initServer and before the native transport starts"
    expect:
      - "result.ok && result.value.setup_completed"
      - "calls['commit-log.recover-segments-on-disk'] == 1 && calls['storage-service.init-server'] == 1 && calls['cassandra-daemon.start'] == 1"
      - "calls['commit-log.recover-files'] == 0"
