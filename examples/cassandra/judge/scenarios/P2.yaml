schema_version: 1
id: cassandra
scenarios:
  - id: bench-p2
    flow: rs-nodetool-repair-incremental
    name: "P2: incremental repair with 10.0.0.3 diverged - prepare + anticompaction (pending repair), validation, sync, finalize"
    state:
      cassandra-table-repair-manager:
        digests:
          10.0.0.3:ks1.users: 9f86d081
    expect:
      - "result.ok && ctx.repairOutcome == 'completed' && ctx.irCoordinatorState == 'FINALIZED'"
      - "calls['repair-message-verb-handler.do-verb-prepare-consistent-req'] == 3 && calls['pending-anti-compaction.run'] == 3"
      - "calls['repair-message-verb-handler.do-verb-validation-req'] == 3 && ctx.syncTasks == 2 && calls['stream-plan.execute'] == 2"
      - "calls['repair-message-verb-handler.do-verb-finalize-propose-msg'] == 3 && calls['repair-message-verb-handler.do-verb-finalize-commit-msg'] == 3"
      - "state['local-sessions'].sessions['10.0.0.3:6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FINALIZED'"
