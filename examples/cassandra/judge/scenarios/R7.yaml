schema_version: 1
id: cassandra
scenarios:
  - id: bench-r7
    flow: replica-read
    name: "Judge R7: replica 10.0.0.2 merges its memtable and sstables for user:42; per column the newest cell wins and a newer cell tombstone hides the older sstable value"
    state:
      data-disk:
        sstables:
          "10.0.0.2:shop.users:user:42": {columns: {name: Old, email: ada@old.example, city: Paris}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.2, size_bytes: 300, sstable_count: 2, table: users, timestamp: 2000, token: 4242, tombstones: 0}
      skip-list-memtable:
        cells:
          "10.0.0.2:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 3000, value: New}
          "10.0.0.2:shop.users:user:42:email": {column: email, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 2500, value: null, deleted: true}
    expect:
      - "result.ok && !result.value.digest_response && size(result.value.partitions) == 1"
      - "result.value.partitions[0].cells.exists(c, c.column == 'name' && c.value == 'New' && c.timestamp == 3000)"
      - "result.value.partitions[0].cells.exists(c, c.column == 'city' && c.value == 'Paris' && c.timestamp == 2000)"
      - "!result.value.partitions[0].cells.exists(c, c.column == 'email' && c.value == 'ada@old.example')"
      - "calls['skip-list-memtable.cells-query'] == 1 && calls['big-table-reader.row-iterator'] == 1 && ctx.tombstones_scanned == 1"
  - id: bench-r7-partition-deletion
    flow: replica-read
    name: "Judge R7: an sstable partition deletion at 2500 hides the memtable cell written at 2000 (and at 2500: deletes() is ts <= markedForDeleteAt) but not the one at 3000"
    state:
      data-disk:
        sstables:
          "10.0.0.2:shop.users:user:42": {columns: {}, deleted: true, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.2, size_bytes: 40, sstable_count: 1, table: users, timestamp: 2500, token: 4242, tombstones: 1}
      skip-list-memtable:
        cells:
          "10.0.0.2:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 2000, value: Old}
          "10.0.0.2:shop.users:user:42:email": {column: email, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 2500, value: same@ts.example}
          "10.0.0.2:shop.users:user:42:city": {column: city, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 3000, value: Rome}
    expect:
      - "result.ok && size(result.value.partitions) == 1 && size(result.value.partitions[0].cells) == 1"
      - "result.value.partitions[0].cells[0].column == 'city' && result.value.partitions[0].cells[0].value == 'Rome'"
  - id: bench-r7-bloom-skip
    flow: replica-read
    name: "Judge R7: the key is in no sstable (key range / bloom filter rule it out): only the memtable answers, no index or data read"
    state:
      skip-list-memtable:
        cells:
          "10.0.0.2:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 3000, value: New}
    expect:
      - "result.ok && size(result.value.partitions) == 1 && result.value.partitions[0].cells[0].value == 'New'"
      - "ctx.sstable_skip == 'BLOOM_FILTER' && calls['auto-saving-cache.get-key'] == 0"
  - id: bench-r7-equal-timestamp-tiebreak
    flow: replica-read
    name: "Judge R7 (probe): memtable name='Aaa'@1000 and sstable name='Zed'@1000. Cells.reconcile breaks a timestamp tie by the greater value, so 'Zed' wins"
    state:
      data-disk:
        sstables:
          "10.0.0.2:shop.users:user:42": {columns: {name: Zed}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.2, size_bytes: 100, sstable_count: 1, table: users, timestamp: 1000, token: 4242, tombstones: 0}
      skip-list-memtable:
        cells:
          "10.0.0.2:shop.users:user:42:name": {column: name, keyspace: shop, partition_key: user:42, replica: 10.0.0.2, table: users, timestamp: 1000, value: Aaa}
    expect:
      - "result.ok && result.value.partitions[0].cells[0].value == 'Zed'"
