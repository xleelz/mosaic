schema_version: 1
id: cassandra
scenarios:
  # Verified expectation (5.0.9): StorageProxy.shouldHint (StorageProxy.java:2442-2501) refuses a hint when
  # Gossiper.getEndpointDowntime (Gossiper.java:541-548, time since the endpoint entered unreachableEndpoints)
  # exceeds max_hint_window (conf/cassandra.yaml:80, 3h) or, with hint_window_persistent_enabled (Config.java:117,
  # default true), when the oldest stored hint for the host is older than now - 3h (StorageProxy.java:2473-2479;
  # HintsStore.java:133-144 returns Long.MAX_VALUE when there is none). The write itself is unaffected.
  - id: bench-h2-down-past-window-no-hint
    flow: coordinator-write
    name: QUORUM write, 10.0.0.2 down for 11,000 s (> 3h) - write succeeds, no hint written
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false, down_since_ms: -11000000}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
    expect:
      - "result.ok && result.value.acks == 2"
      - "calls['storage-proxy.should-hint'] >= 1 && calls['gossiper.get-endpoint-downtime'] >= 1"
      - "calls['hints-service.find-oldest-hint-timestamp'] == 0"
      - "calls['storage-proxy.submit-hint'] == 0 && size(state['hints-buffer'].hints) == 0 && size(state['hints-store'].hints) == 0"
      - "calls['mutation-verb-handler.do-verb'] == 1"
  - id: bench-h2-down-inside-window-hinted
    flow: coordinator-write
    name: Control - 10.0.0.2 down for 10,000 s (< 3h), no stored hints - it is hinted
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false, down_since_ms: -10000000}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
    expect:
      - "result.ok && result.value.acks == 2"
      - "calls['hints-service.find-oldest-hint-timestamp'] == 1"
      - "calls['storage-proxy.submit-hint'] == 1 && ctx.hinted == ['10.0.0.2']"
  - id: bench-h2-persistent-window-old-hint
    flow: coordinator-write
    name: Persistent window - down 1 h, but the oldest stored hint is 4 h old - no hint
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false, down_since_ms: -3600000}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
      hints-catalog:
        stores:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002": {holder: 10.0.0.1, host_id: 6d194555-f6eb-41d0-c000-000000000002, key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002"}
      hints-store:
        hints:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:7:1":
            creation_time: -14400000
            hint: {creation_time: -14400000, gcgs: 864000, mutation: {columns: {status: placed}, keyspace: ks1, partition_key: "user:7", table: users, timestamp: 1, token: 100}}
            holder: 10.0.0.1
            host_id: 6d194555-f6eb-41d0-c000-000000000002
            key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:7:1"
            size_bytes: 512
            stage: file
    expect:
      - "result.ok && result.value.acks == 2"
      - "calls['hints-service.find-oldest-hint-timestamp'] == 1 && calls['storage-proxy.submit-hint'] == 0"
  - id: bench-h2-persistent-window-recent-hint
    flow: coordinator-write
    name: Persistent window - down 1 min, one hint stored 1 min ago - the code still hints (oldest hint is inside 3h)
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false, down_since_ms: -60000}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
      hints-catalog:
        stores:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002": {holder: 10.0.0.1, host_id: 6d194555-f6eb-41d0-c000-000000000002, key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002"}
      hints-store:
        hints:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:7:1":
            creation_time: -60000
            hint: {creation_time: -60000, gcgs: 864000, mutation: {columns: {status: placed}, keyspace: ks1, partition_key: "user:7", table: users, timestamp: 1, token: 100}}
            holder: 10.0.0.1
            host_id: 6d194555-f6eb-41d0-c000-000000000002
            key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:7:1"
            size_bytes: 512
            stage: writing
    expect:
      - "result.ok && result.value.acks == 2"
      - "calls['hints-service.find-oldest-hint-timestamp'] == 1"
      - "calls['storage-proxy.submit-hint'] == 1 && ctx.hinted == ['10.0.0.2']"
  - id: bench-h2-downtime-clock-survives-failed-echo
    flow: membership-gossip-ack2
    name: Down 11,000 s; a newer heartbeat arrives and the echo times out - the unreachable timestamp (downtime clock) must not reset
    input:
      states:
        - {endpoint: 10.0.0.2, generation: 1761800000, heartbeat: 355, max_version: 365, status: NORMAL, tokens: [0]}
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false, down_since_ms: -11000000}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
    faults:
      - {target: echo-verb-handler.do-verb, type: timeout}
    expect:
      - "state.gossiper.endpoint_state_map['10.0.0.2'].alive == false"
      - "state.gossiper.endpoint_state_map['10.0.0.2'].down_since_ms == -11000000"
