schema_version: 1
id: cassandra
scenarios:
- id: bench-b5
  flow: cql-batch
  name: 'B5: UNLOGGED batch over two partitions: no batchlog, each mutation goes straight to its replicas through StorageProxy.mutate'
  input:
    statement:
      batch_type: UNLOGGED
  state:
    keyspace:
      tables:
        shop.users:
          cdc: false
          skip_commitlog: false
        shop.orders:
          cdc: false
          skip_commitlog: false
        system.batches:
          cdc: false
          skip_commitlog: false
      durable_writes:
        shop: true
        system: true
  expect:
  - result.ok && result.value.kind == 'VOID' && size(result.value.warnings) == 0
  - ctx.mutateAtomically == false && calls['storage-proxy.mutate-with-triggers'] == 1 && calls['storage-proxy.mutate'] == 1
  - calls['storage-proxy.mutate-atomically'] == 0 && calls['replica-plans.for-batchlog-write'] == 0 && calls['batch-store-verb-handler.do-verb'] == 0 && calls['batch-remove-verb-handler.do-verb'] == 0
  - calls['storage-proxy.send-to-hinted-replicas'] == 2 && calls['mutation-verb-handler.do-verb'] == 4 && calls['keyspace.apply'] == 2
  - ctx.write_type == 'UNLOGGED_BATCH'
