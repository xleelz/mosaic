schema_version: 1
id: cassandra
scenarios:
  - id: bench-w6
    flow: coordinator-write
    name: "W6: INSERT at ANY, every replica down; 4-node ring so the coordinator (10.0.0.1) is not a replica of token -100 (replicas .2, .4, .3)"
    input:
      consistency: ANY
      mutations:
        - {keyspace: ks1, table: users, partition_key: "user:7", token: -100, timestamp: 1730000000000000, counter: false, columns: {name: Grace}}
    state:
      gossiper:
        endpoint_state_map:
          10.0.0.2: {alive: false, down_since_ms: -600000}
          10.0.0.3: {alive: false, down_since_ms: -600000}
          10.0.0.4: {alive: false, down_since_ms: -600000, dc: datacenter1, endpoint: 10.0.0.4, generation: 1761800000, heartbeat: 300, host_id: 6d194555-f6eb-41d0-c000-000000000004, load: 1048576, max_version: 300, rack: rack1, rpc_ready: true, status: NORMAL, tokens: [3000000000000000000], update_ms: 0}
      token-metadata:
        host_ids:
          10.0.0.1: 6d194555-f6eb-41d0-c000-000000000001
          10.0.0.2: 6d194555-f6eb-41d0-c000-000000000002
          10.0.0.3: 6d194555-f6eb-41d0-c000-000000000003
          10.0.0.4: 6d194555-f6eb-41d0-c000-000000000004
        ring:
          - {endpoint: 10.0.0.1, token: -6148914691236517206}
          - {endpoint: 10.0.0.2, token: 0}
          - {endpoint: 10.0.0.4, token: 3000000000000000000}
          - {endpoint: 10.0.0.3, token: 6148914691236517205}
    expect:
      - "result.ok && result.value.block_for == 1 && result.value.acks == 1"
      - "calls['replica-plans.assure-sufficient-live-replicas'] == 1"
      - "calls['mutation-verb-handler.do-verb'] == 0 && calls['storage-proxy.perform-locally'] == 0 && calls['commit-log.add'] == 0"
      - "size(ctx.hinted) == 3 && calls['storage-proxy-hint-runnable.run'] >= 1 && calls['hints-service.write'] >= 1"
