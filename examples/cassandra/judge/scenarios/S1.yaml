schema_version: 1
id: cassandra
scenarios:
  - id: bench-s1
    flow: create-table
    name: "S1: CREATE TABLE applies locally, announces the version via gossip, pushes SCHEMA_PUSH_REQ to live peers"
    input:
      keyspace: shop
      table: customers
    expect:
      - "result.ok && result.value.kind == 'SCHEMA_CHANGE' && result.value.change == 'CREATED' && result.value.target == 'TABLE'"
      # local apply through system_schema, then the new ColumnFamilyStore
      - "calls['schema-keyspace.apply-changes'] >= 1 && calls['keyspace.init-cf'] == 1"
      - "'10.0.0.1:table:shop.customers' in state['schema-keyspace'].rows"
      # version announced through the SCHEMA gossip application state
      - "calls['migration-coordinator.announce'] == 1 && calls['gossiper.add-local-application-state'] >= 1 && ctx.announced_version != ''"
      # asynchronous push to both live peers, which apply it
      - "calls['schema-push-verb-handler.do-verb'] == 2 && ctx.schema_pushed_to.size() == 2"
      - "'10.0.0.2:table:shop.customers' in state['schema-keyspace'].rows && '10.0.0.3:table:shop.customers' in state['schema-keyspace'].rows"
  - id: bench-s1-peer-down
    flow: create-table
    name: "S1 variant: a down peer (not in Gossiper.liveEndpoints) is not pushed to"
    input:
      keyspace: shop
      table: customers
    state:
      gossiper:
        live_endpoints: ["10.0.0.2"]
        endpoint_state_map: {"10.0.0.3": {alive: false}}
    expect:
      - "result.ok && result.value.kind == 'SCHEMA_CHANGE'"
      - "calls['schema-push-verb-handler.do-verb'] == 1 && ctx.schema_pushed_to == ['10.0.0.2']"
      - "!('10.0.0.3:table:shop.customers' in state['schema-keyspace'].rows)"
  - id: bench-s1-alive-flag-only
    flow: create-table
    name: "S1 probe (contract seam): marking .3 down only via endpoint_state_map.alive still pushes to it, because gossiper.get-live-members reads live_endpoints"
    input:
      keyspace: shop
      table: customers
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.3": {alive: false}}
    expect:
      - "result.ok"
      - "calls['schema-push-verb-handler.do-verb'] == 2 && '10.0.0.3' in ctx.schema_pushed_to"
