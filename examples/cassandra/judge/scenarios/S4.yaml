schema_version: 1
id: cassandra
scenarios:
  - id: bench-s4
    flow: native-auth-response
    name: "S4: PasswordAuthenticator, wrong password in AUTH_RESPONSE - bad-credentials (0x0100), connection stays AUTHENTICATING"
    input:
      username: alice
      password: wrong
    state:
      auth-config:
        authenticator: PasswordAuthenticator
      client-state:
        user: ''
      server-connection:
        stage: AUTHENTICATING
    expect:
      - "!result.ok && result.error.code == 'bad-credentials' && result.error.status == 256"
      - "result.error.message == 'Provided username alice and/or password are incorrect'"
      # path: SASL PLAIN evaluateResponse completes, getAuthenticatedUser -> authenticate -> credentials cache -> checkpw fails
      - "calls['password-authenticator-plain-text-sasl-authenticator.evaluate-response'] == 1 && calls['password-authenticator.authenticate'] == 1 && calls['password-authenticator-credentials-cache.get'] == 1"
      - "calls['client-state.login'] == 0 && ctx.auth == 'failure'"
      - "state['server-connection'].stage == 'AUTHENTICATING' && state['client-state'].user == ''"
  - id: bench-s4-startup-challenge
    flow: native-startup
    name: "S4 precondition: PasswordAuthenticator answers STARTUP with AUTHENTICATE"
    state:
      auth-config:
        authenticator: PasswordAuthenticator
    expect:
      - "result.ok && result.value.type == 'AUTHENTICATE' && result.value.authenticator == 'org.apache.cassandra.auth.PasswordAuthenticator'"
      - "state['server-connection'].stage == 'AUTHENTICATING'"
