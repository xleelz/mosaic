schema_version: 1
id: cassandra
scenarios:
  - id: bench-r5
    flow: coordinator-read
    name: "Judge R5 (corrected): QUORUM, 10.0.0.2 down and the data replica 10.0.0.3 never answers; no spare to speculate to, ReadTimeout (0x1200) at 5000ms with received 1 < blockFor 2, data_present false"
    input:
      consistency: QUORUM
    state:
      gossiper:
        endpoint_state_map:
          10.0.0.2: {alive: false}
    faults:
      - {target: read-command-verb-handler.do-verb, type: timeout}
    expect:
      - "!result.ok && result.error.code == 'read-timeout' && result.error.status == 4608"
      - "result.error.data.received == 1 && result.error.data.block_for == 2 && result.error.data.data_present == false"
      - "ctx.read_executor == 'never_insufficient' && calls['read-command-verb-handler.do-verb'] == 1 && calls['storage-proxy-local-read-runnable.run'] == 1"
      - "duration_ms >= 5000 && duration_ms < 5100"
  - id: bench-r5-all-up-speculates
    flow: coordinator-read
    name: "Judge R5 (original premise): QUORUM, all up, the data replica 10.0.0.3 never answers; 99p speculation sends data to 10.0.0.2 and the read succeeds (no timeout)"
    input:
      consistency: QUORUM
    faults:
      - {target: read-command-verb-handler.do-verb, type: timeout, calls: [1]}
    expect:
      - "result.ok && ctx.speculated == true && ctx.speculated_to == '10.0.0.2' && ctx.speculated_kind == 'data'"
      - "calls['read-command-verb-handler.do-verb'] == 2"
  - id: bench-r5-cql
    flow: cql-select
    name: "Judge R5 (via CQL): QUORUM, 10.0.0.3 down; the data replica 10.0.0.2 never answers; the timeout reaches the client as read-timeout"
    input:
      options: {consistency: QUORUM}
    state:
      gossiper:
        endpoint_state_map:
          10.0.0.3: {alive: false}
    faults:
      - {target: read-command-verb-handler.do-verb, type: timeout}
    expect:
      - "!result.ok && result.error.code == 'read-timeout' && result.error.status == 4608 && result.error.data.received == 1 && result.error.data.block_for == 2"
