schema_version: 1
id: cassandra
scenarios:
- id: bench-b4-fail
  flow: cql-batch
  name: 'B4: LOGGED batch over two partitions totalling 52000 B (> 50 KiB = 51200 B): InvalidRequestException "Batch too large" before any write'
  input:
    statement:
      batch_type: LOGGED
      statements:
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:42
          token: -4069959284402364209
        size_bytes: 26000
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:7
          token: 512
        size_bytes: 26000
  state: &id001
    keyspace:
      tables:
        shop.users:
          cdc: false
          skip_commitlog: false
        shop.orders:
          cdc: false
          skip_commitlog: false
        system.batches:
          cdc: false
          skip_commitlog: false
      durable_writes:
        shop: true
        system: true
  expect:
  - '!result.ok && result.error.code == ''invalid'' && result.error.status == 8704 && result.error.message == ''Batch too large'''
  - ctx.batchRefused == 'too_large' && calls['batch-statement.execute-without-conditions'] == 1
  - calls['storage-proxy.mutate-with-triggers'] == 0 && calls['storage-proxy.mutate-atomically'] == 0 && calls['batch-store-verb-handler.do-verb'] == 0 && calls['mutation-verb-handler.do-verb'] == 0
- id: bench-b4-warn
  flow: cql-batch
  name: 'B4: LOGGED batch over two partitions totalling 6000 B (> 5 KiB, < 50 KiB): one client warning, batch still executed atomically'
  input:
    statement:
      batch_type: LOGGED
      statements:
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:42
          token: -4069959284402364209
        size_bytes: 3000
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:7
          token: 512
        size_bytes: 3000
  state: *id001
  expect:
  - result.ok && size(result.value.warnings) == 1 && result.value.warnings[0].contains('exceeding specified threshold of 5120 by 880')
  - '!has(ctx.batchRefused) && ctx.mutateAtomically == true && calls[''storage-proxy.mutate-atomically''] == 1 && calls[''batch-store-verb-handler.do-verb''] == 2'
- id: bench-b4-unlogged-fail
  flow: cql-batch
  name: 'B4: the size check is not LOGGED-only: an UNLOGGED multi-partition batch over 50 KiB is refused too'
  input:
    statement:
      batch_type: UNLOGGED
      statements:
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:42
          token: -4069959284402364209
        size_bytes: 26000
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:7
          token: 512
        size_bytes: 26000
  state: *id001
  expect:
  - '!result.ok && result.error.code == ''invalid'' && result.error.message == ''Batch too large'''
  - calls['storage-proxy.mutate-with-triggers'] == 0
- id: bench-b4-single-partition
  flow: cql-batch
  name: 'B4: two statements on ONE partition (one Mutation) totalling 60000 B are not size-checked (mutations.size() <= 1)'
  input:
    statement:
      batch_type: LOGGED
      statements:
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:42
          token: -4069959284402364209
        size_bytes: 30000
      - type: INSERT
        keyspace: shop
        table: users
        columns:
          bio: '...'
        partition_keys:
        - partition_key: user:42
          token: -4069959284402364209
        size_bytes: 30000
  state: *id001
  expect:
  - result.ok && size(result.value.warnings) == 0
  - ctx.mutateAtomically == false && calls['storage-proxy.mutate-atomically'] == 0 && calls['batch-store-verb-handler.do-verb'] == 0
