schema_version: 1
id: cassandra
scenarios:
  - id: bench-w4
    flow: coordinator-write
    name: "W4: INSERT at QUORUM, both remote replicas alive per the FD but never answer"
    input:
      consistency: QUORUM
      mutations:
        - {keyspace: ks1, table: users, partition_key: "user:42", token: 100, timestamp: 1730000000000000, counter: false, columns: {name: Ada}}
    faults:
      - {target: mutation-verb-handler.do-verb, type: timeout}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.status == 4352"
      - "result.error.data.received == 1 && result.error.data.block_for == 2 && result.error.data.write_type == 'SIMPLE'"
      - "calls['storage-proxy.perform-locally'] == 1 && calls['commit-log.add'] == 1"
      - "calls['storage-proxy.submit-hint'] == 2 && size(ctx.hinted) == 2 && calls['hints-service.write'] == 2"
      - "faults == 2 && duration_ms >= 2000"
