schema_version: 1
id: cassandra
scenarios:
  - id: bench-r1
    flow: coordinator-read
    name: "Judge R1: QUORUM read, all up: one data read + one digest read (blockFor 2), digests match"
    input:
      consistency: QUORUM
    expect:
      - "result.ok"
      - "ctx.read_executor == 'speculating' && ctx.digest_mismatch == false && ctx.speculated == false"
      - "calls['read-command-verb-handler.do-verb'] == 1 && calls['storage-proxy-local-read-runnable.run'] == 1"
      - "calls['read-repair-verb-handler.do-verb'] == 0"
