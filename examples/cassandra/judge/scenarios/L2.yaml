schema_version: 1
id: cassandra
scenarios:
- id: bench-l2
  flow: cql-conditional-write
  name: 'L2: UPDATE ... IF balance = 50 on a row holding 100: [applied] false with the current value; v1 still proposes (and a quorum accepts) an empty update, nothing is committed'
  input:
    statement:
      keyspace: shop
      table: accounts
      type: UPDATE
      if_not_exists: false
      columns:
        balance: 90
      conditions:
        balance: 50
      partition_keys:
      - partition_key: user:42
        token: -7509452495886106294
  state:
    skip-list-memtable:
      cells:
        10.0.0.1:shop.accounts:user:42:balance:
          column: balance
          keyspace: shop
          partition_key: user:42
          replica: 10.0.0.1
          table: accounts
          timestamp: 1000
          value: 100
        10.0.0.2:shop.accounts:user:42:balance:
          column: balance
          keyspace: shop
          partition_key: user:42
          replica: 10.0.0.2
          table: accounts
          timestamp: 1000
          value: 100
        10.0.0.3:shop.accounts:user:42:balance:
          column: balance
          keyspace: shop
          partition_key: user:42
          replica: 10.0.0.3
          table: accounts
          timestamp: 1000
          value: 100
    keyspace:
      tables:
        shop.accounts:
          cdc: false
          skip_commitlog: false
        system.batches:
          cdc: false
          skip_commitlog: false
      durable_writes:
        shop: true
        system: true
  expect:
  - result.ok && result.value.applied == false && ctx.casApplied == false
  - size(result.value.rows) == 1 && result.value.rows[0].cells[0].column == 'balance' && result.value.rows[0].cells[0].value == 100
  - ctx.paxosVariant == 'v1' && calls['storage-proxy.legacy-cas'] == 1
  - calls['paxos-state.legacy-prepare'] == 3 && calls['storage-proxy.read-one'] == 1 && ctx.casConditionMet == false
  - calls['cas-request.make-updates'] == 0
  - calls['storage-proxy.propose-paxos'] == 1 && calls['paxos-state.legacy-propose'] == 3
  - state['paxos-state'].rows['10.0.0.2:user:42'].accepted_empty == true && state['paxos-state'].rows['10.0.0.2:user:42'].accepted_ballot == ctx.lastBallot
  - calls['storage-proxy.commit-paxos'] == 0 && calls['paxos-commit-request-handler.do-verb'] == 0 && calls['keyspace.apply'] == 0
  - state['paxos-state'].rows['10.0.0.2:user:42'].committed_ballot == 0
