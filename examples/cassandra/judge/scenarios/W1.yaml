schema_version: 1
id: cassandra
scenarios:
  - id: bench-w1
    flow: coordinator-write
    name: "W1: INSERT at QUORUM, all replicas up"
    input:
      consistency: QUORUM
      mutations:
        - {keyspace: ks1, table: users, partition_key: "user:42", token: 100, timestamp: 1730000000000000, counter: false, columns: {name: Ada}}
    expect:
      - "result.ok && result.value.path == 'standard' && result.value.block_for == 2 && result.value.acks >= 2"
      - "calls['replica-plans.assure-sufficient-live-replicas'] == 1"
      - "calls['mutation-verb-handler.do-verb'] == 2 && calls['storage-proxy.perform-locally'] == 1"
      - "calls['keyspace.apply'] >= 1 && calls['commit-log.add'] >= 1"
      - "calls['storage-proxy.submit-hint'] == 0 && size(ctx.hinted) == 0 && ctx.write_type == 'SIMPLE'"
