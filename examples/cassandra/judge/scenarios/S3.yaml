schema_version: 1
id: cassandra
scenarios:
  - id: bench-s3
    flow: native-startup
    name: "S3: deployed AllowAllAuthenticator - STARTUP answered READY, no AUTHENTICATE, user is anonymous"
    expect:
      - "result.ok && result.value.type == 'READY'"
      - "state['auth-config'].authenticator == 'AllowAllAuthenticator'"
      - "state['server-connection'].stage == 'READY' && state['client-state'].user == 'anonymous'"
      - "calls['startup-message.execute'] == 1"
      - "calls['transport.auth-response-message'] == 0 && calls['password-authenticator.new-sasl-negotiator'] == 0"
