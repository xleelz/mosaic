schema_version: 1
id: cassandra
scenarios:
  - id: bench-t3-default-backpressure
    flow: native-query
    name: "T3 (deployed config, THROW_ON_OVERLOAD unset): bytes-in-flight over the per-IP limit -> backpressure (connection paused, client warning), NOT overloaded"
    state:
      client-resource-limits:
        endpoint_in_flight_bytes: 107374150
    expect:
      - "result.ok && ctx.connection_paused && ctx.backpressure == 'BYTES_IN_FLIGHT'"
      - "result.value.warnings[0].contains('bytes in flight')"
      - "calls['query-processor.process'] == 1"
  - id: bench-t3-throw-on-overload
    flow: native-query
    name: "T3: with THROW_ON_OVERLOAD=1 on the connection, the same breach is OverloadedException (0x1001) and the request is discarded"
    state:
      client-resource-limits:
        endpoint_in_flight_bytes: 107374150
      cql-message-handler:
        throw_on_overload: true
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.status == 4097"
      - "result.error.message.startsWith('Request breached limit on bytes in flight')"
      - "calls['dispatcher.dispatch'] == 0 && calls['query-processor.process'] == 0"
  - id: bench-t3-rate-limit-disabled
    flow: native-query
    name: "T3: native_transport_rate_limiting_enabled is false (Config.java:299, cassandra.yaml:1076 commented) - an exhausted limiter is never consulted"
    state:
      client-resource-limits:
        permit_available: false
        permit_delay_ms: 5
      cql-message-handler:
        throw_on_overload: true
    expect:
      - "state['client-resource-limits'].rate_limiting_enabled == false"
      - "result.ok && !has(ctx.overload) && calls['query-processor.process'] == 1"
  - id: bench-t3-queue-timeout
    flow: native-query
    name: "T3: a request queued longer than native_transport_timeout (12s) is OverloadedException('Query timed out before it could start') regardless of THROW_ON_OVERLOAD"
    input:
      queue_time_ms: 12500
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.status == 4097 && result.error.message == 'Query timed out before it could start'"
      - "calls['query-processor.parse'] == 0"
