schema_version: 1
id: cassandra
scenarios:
  # Corrected expectation (5.0.9): no gossip/FD subscriber triggers hint dispatch. HintsService.startDispatch
  # schedules HintsDispatchTrigger every 10 s (HintsService.java:226-229); the trigger keeps stores that are
  # isLive (HintsStore.java:146-150: endpoint known AND FailureDetector.isAlive) and have files or a writer
  # (HintsDispatchTrigger.java:52-71). Delivered files are deleted (HintsDispatchExecutor.java:296-301).
  - id: bench-h1-up-dispatched-and-deleted
    flow: hb-hints-dispatch
    name: Periodic trigger, 10.0.0.2 alive - its hints file is sent as HINT_REQ and deleted
    state:
      hints-catalog:
        stores:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002": {holder: 10.0.0.1, host_id: 6d194555-f6eb-41d0-c000-000000000002, key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002"}
      hints-store:
        hints:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1":
            creation_time: 0
            hint: {creation_time: 0, gcgs: 864000, mutation: {columns: {status: placed}, keyspace: ks1, partition_key: "user:42", table: orders, timestamp: 1, token: 100}}
            holder: 10.0.0.1
            host_id: 6d194555-f6eb-41d0-c000-000000000002
            key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1"
            size_bytes: 512
            stage: file
    expect:
      - "passes[0].result.value.scheduled == 1"
      - "calls['hints-store.is-live'] >= 1 && calls['failure-detector.is-alive'] >= 1"
      - "calls['hints-dispatch-executor-dispatch-hints-task.run'] == 1 && calls['hints-dispatcher.dispatch'] == 1"
      - "calls['hint-verb-handler.do-verb'] == 1 && calls['mutation.apply-future'] == 1"
      - "size(state['hints-store'].hints) == 0"
  - id: bench-h1-down-kept
    flow: hb-hints-dispatch
    name: Periodic trigger, 10.0.0.2 down in gossip - store skipped, file kept
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
      hints-catalog:
        stores:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002": {holder: 10.0.0.1, host_id: 6d194555-f6eb-41d0-c000-000000000002, key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002"}
      hints-store:
        hints:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1":
            creation_time: 0
            hint: {creation_time: 0, gcgs: 864000, mutation: {columns: {status: placed}, keyspace: ks1, partition_key: "user:42", table: orders, timestamp: 1, token: 100}}
            holder: 10.0.0.1
            host_id: 6d194555-f6eb-41d0-c000-000000000002
            key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1"
            size_bytes: 512
            stage: file
    expect:
      - "passes[0].result.value.scheduled == 0 && passes[1].result.value.scheduled == 0"
      - "calls['failure-detector.is-alive'] >= 2 && calls['hints-dispatch-executor.dispatch'] == 0"
      - "calls['hint-verb-handler.do-verb'] == 0 && size(state['hints-store'].hints) == 1"
  - id: bench-h1-up-event-does-not-dispatch
    flow: membership-gossip-ack2
    name: 10.0.0.2 comes back via gossip (echo, markAlive, onAlive) - no hint dispatch is triggered by the event
    input:
      states:
        - {endpoint: 10.0.0.2, generation: 1761800000, heartbeat: 355, max_version: 365, status: NORMAL, tokens: [0]}
    state:
      gossiper:
        endpoint_state_map: {"10.0.0.2": {alive: false}}
        live_endpoints: ["10.0.0.3"]
        unreachable_endpoints: ["10.0.0.2"]
      hints-catalog:
        stores:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002": {holder: 10.0.0.1, host_id: 6d194555-f6eb-41d0-c000-000000000002, key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002"}
      hints-store:
        hints:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1":
            creation_time: 0
            hint: {creation_time: 0, gcgs: 864000, mutation: {columns: {status: placed}, keyspace: ks1, partition_key: "user:42", table: orders, timestamp: 1, token: 100}}
            holder: 10.0.0.1
            host_id: 6d194555-f6eb-41d0-c000-000000000002
            key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1"
            size_bytes: 512
            stage: file
    expect:
      - "state.gossiper.endpoint_state_map['10.0.0.2'].alive == true && calls['echo-verb-handler.do-verb'] == 1"
      - "calls['server-event-notifier.on-up'] == 1"
      - "calls['hints-dispatch-trigger.run'] == 0 && calls['hints-dispatch-executor.dispatch'] == 0 && calls['hint-verb-handler.do-verb'] == 0"
      - "size(state['hints-store'].hints) == 1"
  - id: bench-h1-comes-back-between-passes
    flow: hb-hints-dispatch
    name: 10.0.0.2 down at the first trigger run (FD says dead) and up at the next - delivered 10 s later
    state:
      hints-catalog:
        stores:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002": {holder: 10.0.0.1, host_id: 6d194555-f6eb-41d0-c000-000000000002, key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002"}
      hints-store:
        hints:
          "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1":
            creation_time: 0
            hint: {creation_time: 0, gcgs: 864000, mutation: {columns: {status: placed}, keyspace: ks1, partition_key: "user:42", table: orders, timestamp: 1, token: 100}}
            holder: 10.0.0.1
            host_id: 6d194555-f6eb-41d0-c000-000000000002
            key: "10.0.0.1:6d194555-f6eb-41d0-c000-000000000002:user:42:1"
            size_bytes: 512
            stage: file
    faults:
      - {target: failure-detector.is-alive, type: error, code: endpoint-down, calls: [1]}
    expect:
      - "passes[0].result.value.scheduled == 0 && passes[1].result.value.scheduled == 1"
      - "ctx.dispatchStartedAt >= 10000 && calls['hint-verb-handler.do-verb'] == 1"
      - "size(state['hints-store'].hints) == 0"
