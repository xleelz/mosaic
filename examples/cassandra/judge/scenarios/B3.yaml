schema_version: 1
id: cassandra
scenarios:
- id: bench-b3
  flow: hb-batchlog-replay
  name: 'B3: batchlog replay every 10s replays batches older than BATCHLOG_REPLAY_TIMEOUT (2 x write_request_timeout = 4000ms), throttled to batchlog_replay_throttle / ring size'
  state:
    keyspace:
      tables:
        shop.orders:
          cdc: false
          skip_commitlog: false
        system.batches:
          cdc: false
          skip_commitlog: false
      durable_writes:
        shop: true
        system: true
    batchlog-manager:
      batches:
        10.0.0.1:0f6a6c40-9d5e-11ef-8000-000000000001:
          gc_grace_seconds: 864000
          id: 0f6a6c40-9d5e-11ef-8000-000000000001
          key: 10.0.0.1:0f6a6c40-9d5e-11ef-8000-000000000001
          mutations:
          - columns:
              status: placed
            keyspace: shop
            partition_key: user:42
            table: orders
            timestamp: 1793350800000000
            token: -4069959284402364209
          replica: 10.0.0.1
          version: 12
          written_at_ms: -10000
        10.0.0.1:0f6a6c40-9d5e-11ef-8000-000000000002:
          gc_grace_seconds: 864000
          id: 0f6a6c40-9d5e-11ef-8000-000000000002
          key: 10.0.0.1:0f6a6c40-9d5e-11ef-8000-000000000002
          mutations:
          - columns:
              status: shipped
            keyspace: shop
            partition_key: user:7
            table: orders
            timestamp: 1793350800000001
            token: 1234
          replica: 10.0.0.1
          version: 12
          written_at_ms: -1000
  expect:
  - passes[0].result.ok && passes[0].result.value.replayed == 1
  - passes[1].start_ms >= 10000 && passes[1].result.value.replayed == 1
  - ctx.replayThrottleKiBPerEndpoint == 341 && calls['batchlog-manager.set-rate'] == 2
  - calls['batchlog-manager-replaying-batch.send-single-replay-mutation'] == 2 && calls['mutation.apply'] == 2 && calls['mutation-verb-handler.do-verb'] == 4
  - calls['hints-service.flush-and-fsync-blockingly'] == 2 && calls['batchlog-manager.remove'] == 2
  - size(state['batchlog-manager'].batches) == 0 && state['batchlog-manager'].total_batches_replayed == 2
  - state['batchlog-manager'].last_replayed_ms >= passes[1].start_ms - 4000 && state['batchlog-manager'].last_replayed_ms < passes[1].start_ms
