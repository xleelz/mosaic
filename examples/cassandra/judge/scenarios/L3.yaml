schema_version: 1
id: cassandra
scenarios:
- id: bench-l3
  flow: cql-conditional-write
  name: 'L3: LWT with two of three replicas down: Unavailable for SERIAL (required 2, alive 1) before any Paxos message'
  input:
    statement:
      keyspace: shop
      table: users
      type: INSERT
      if_not_exists: true
      columns:
        name: Ada
      partition_keys:
      - partition_key: user:42
        token: -7509452495886106294
  state:
    gossiper:
      endpoint_state_map:
        10.0.0.2:
          alive: false
        10.0.0.3:
          alive: false
  expect:
  - '!result.ok && result.error.code == ''unavailable'' && result.error.status == 4096'
  - result.error.data.consistency == 'SERIAL' && result.error.data.required == 2 && result.error.data.alive == 1
  - calls['storage-proxy.legacy-cas'] == 1 && calls['storage-proxy.do-paxos'] == 1 && calls['replica-plans.for-paxos'] == 1
  - calls['ballot-generator.next-ballot'] == 0 && calls['prepare-verb-handler.do-verb'] == 0 && calls['paxos-state.legacy-prepare'] == 0
  - calls['storage-proxy.read-one'] == 0 && calls['storage-proxy.propose-paxos'] == 0
