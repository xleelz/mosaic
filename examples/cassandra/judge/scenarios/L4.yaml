schema_version: 1
id: cassandra
scenarios:
- id: bench-l4
  flow: cql-conditional-write
  name: 'L4: LWT under contention: prepare rejected by a higher ballot, random back-off and re-prepare until cas_contention_timeout (1000ms), then write timeout with write_type CAS'
  input:
    statement:
      keyspace: shop
      table: users
      type: INSERT
      if_not_exists: true
      columns:
        name: Ada
      partition_keys:
      - partition_key: user:42
        token: -7509452495886106294
  state:
    paxos-state:
      rows:
        10.0.0.2:user:42:
          accepted_ballot: 0
          accepted_columns: {}
          accepted_empty: true
          committed_ballot: 0
          committed_columns: {}
          promised: 1767225605000000
          promised_write: 1767225605000000
  faults:
  - target: prepare-verb-handler.do-verb
    type: latency
    latency_ms: 950
    calls:
    - 1
  expect:
  - '!result.ok && result.error.code == ''write-timeout'' && result.error.status == 4352'
  - result.error.data.write_type == 'CAS' && result.error.data.consistency == 'SERIAL' && result.error.data.received == 0 && result.error.data.block_for == 2
  - result.error.data.contentions >= 1 && ctx.prepareRejected == true
  - calls['storage-proxy.legacy-cas'] == 1 && calls['storage-proxy.prepare-paxos'] >= 1
  - calls['storage-proxy.read-one'] == 0 && calls['storage-proxy.propose-paxos'] == 0 && calls['storage-proxy.commit-paxos'] == 0
  - duration_ms >= 1000
- id: bench-l4-retry
  flow: cql-conditional-write
  name: 'L4 (path): one rejection by a higher ballot, back-off, re-prepare with a ballot above it, then apply'
  input:
    statement:
      keyspace: shop
      table: users
      type: INSERT
      if_not_exists: true
      columns:
        name: Ada
      partition_keys:
      - partition_key: user:42
        token: -7509452495886106294
  state:
    paxos-state:
      rows:
        10.0.0.2:user:42:
          accepted_ballot: 0
          accepted_columns: {}
          accepted_empty: true
          committed_ballot: 0
          committed_columns: {}
          promised: 1767225605000000
          promised_write: 1767225605000000
  expect:
  - result.ok && result.value.applied == true && ctx.casContentions == 1
  - ctx.prepareRejected == true && calls['ballot-generator.next-ballot'] == 2 && calls['storage-proxy.prepare-paxos'] == 2
  - state['paxos-state'].rows['10.0.0.2:user:42'].promised == 1767225605000001
  - calls['storage-proxy.propose-paxos'] == 1 && calls['storage-proxy.commit-paxos'] == 1
