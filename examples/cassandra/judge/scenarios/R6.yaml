schema_version: 1
id: cassandra
scenarios:
  - id: bench-r6-warn
    flow: coordinator-read
    name: "Judge R6: 5000 tombstones (> tombstone_warn_threshold 1000, < 100000) on every replica, token 100 (data from 10.0.0.3, digest from this node): the read succeeds; each contacted replica logs the warning; this node's local read also calls ClientWarn.warn, so the client gets the warning"
    input:
      consistency: QUORUM
    state:
      data-disk:
        sstables:
          "10.0.0.1:shop.users:user:42": {columns: {name: Ada}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.1, size_bytes: 100, sstable_count: 3, table: users, timestamp: 1000, token: 100, tombstones: 5000}
          "10.0.0.2:shop.users:user:42": {columns: {name: Ada}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.2, size_bytes: 100, sstable_count: 3, table: users, timestamp: 1000, token: 100, tombstones: 5000}
          "10.0.0.3:shop.users:user:42": {columns: {name: Ada}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.3, size_bytes: 100, sstable_count: 3, table: users, timestamp: 1000, token: 100, tombstones: 5000}
    expect:
      - "result.ok"
      - "ctx.tombstone_warning == 5000 && state['read-command'].tombstone_warnings == 2"
      - "calls['client-warn.warn'] >= 1"
  - id: bench-r6-fail
    flow: cql-select
    name: "Judge R6: 150000 tombstones (> tombstone_failure_threshold 100000) on every replica: replicas throw TombstoneOverwhelmingException, answer READ_TOO_MANY_TOMBSTONES, the coordinator fails with ReadFailure (0x1300)"
    input:
      options: {consistency: QUORUM}
    state:
      data-disk:
        sstables:
          "10.0.0.1:shop.users:user:42": {columns: {name: Ada}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.1, size_bytes: 100, sstable_count: 3, table: users, timestamp: 1000, token: 100, tombstones: 150000}
          "10.0.0.2:shop.users:user:42": {columns: {name: Ada}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.2, size_bytes: 100, sstable_count: 3, table: users, timestamp: 1000, token: 100, tombstones: 150000}
          "10.0.0.3:shop.users:user:42": {columns: {name: Ada}, keyspace: shop, partition_key: user:42, purgeable_tombstones: 0, replica: 10.0.0.3, size_bytes: 100, sstable_count: 3, table: users, timestamp: 1000, token: 100, tombstones: 150000}
    expect:
      - "!result.ok && result.error.code == 'read-failure' && result.error.status == 4864"
      - "'READ_TOO_MANY_TOMBSTONES' in result.error.data.failure_reasons && result.error.data.received == 0"
      - "state['read-command'].tombstone_failures >= 1 && ctx.speculated == false"
