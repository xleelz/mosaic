schema_version: 1
id: cassandra
scenarios:
  - id: bench-s2
    flow: create-table
    name: "S2: CREATE TABLE of an existing table is AlreadyExistsException (0x2400) before any schema write"
    input:
      keyspace: shop
      table: orders
    expect:
      - "!result.ok && result.error.code == 'already-exists' && result.error.status == 9216"
      - "result.error.message == 'Cannot add already existing table \"orders\" to keyspace \"shop\"'"
      - "calls['create-table-statement.apply'] == 1 && calls['schema-keyspace.apply-changes'] == 0"
      - "calls['migration-coordinator.announce'] == 0 && calls['migration-coordinator.push-schema-mutations'] == 0 && calls['keyspace.init-cf'] == 0"
  - id: bench-s2-if-not-exists
    flow: create-table
    name: "S2: with IF NOT EXISTS the transformation is a no-op: empty diff, Void result, nothing announced or pushed"
    input:
      keyspace: shop
      table: orders
      if_not_exists: true
    expect:
      - "result.ok && result.value.kind == 'VOID'"
      - "calls['schema-keyspace.apply-changes'] == 0 && calls['migration-coordinator.announce'] == 0 && calls['migration-coordinator.push-schema-mutations'] == 0"
