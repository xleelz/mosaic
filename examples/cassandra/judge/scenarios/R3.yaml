schema_version: 1
id: cassandra
scenarios:
  - id: bench-r3
    flow: cql-select
    name: "Judge R3: SELECT at QUORUM with 10.0.0.2 and 10.0.0.3 down: Unavailable (0x1000), required 2 alive 1, no replica contacted"
    input:
      options: {consistency: QUORUM}
    state:
      gossiper:
        endpoint_state_map:
          10.0.0.2: {alive: false}
          10.0.0.3: {alive: false}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "result.error.data.alive == 1 && result.error.data.required == 2"
      - "calls['storage-proxy.read'] == 1 && calls['replica-plans.assure-sufficient-live-replicas'] == 1"
      - "calls['read-command-verb-handler.do-verb'] == 0 && calls['storage-proxy-local-read-runnable.run'] == 0"
