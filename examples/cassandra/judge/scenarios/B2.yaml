schema_version: 1
id: cassandra
scenarios:
- id: bench-b2
  flow: cql-batch
  name: 'B2: LOGGED batch with 10.0.0.3 down: batchlog on the one live remote node (CL ONE), mutations succeed at QUORUM, 10.0.0.3 is hinted without a message, and the batchlog is removed because both mutations
    reached QUORUM'
  state:
    keyspace:
      tables:
        shop.users:
          cdc: false
          skip_commitlog: false
        shop.orders:
          cdc: false
          skip_commitlog: false
        system.batches:
          cdc: false
          skip_commitlog: false
      durable_writes:
        shop: true
        system: true
    gossiper:
      endpoint_state_map:
        10.0.0.3:
          alive: false
  expect:
  - result.ok && result.value.kind == 'VOID'
  - ctx.batchlogEndpoints == ['10.0.0.2'] && calls['batch-store-verb-handler.do-verb'] == 1 && ctx.batchlogAcks == 1
  - calls['storage-proxy.send-to-hinted-replicas'] == 2 && calls['mutation-verb-handler.do-verb'] == 2 && ctx.mutationAcks == [2, 2]
  - ctx.hinted == ['10.0.0.3', '10.0.0.3'] && calls['storage-proxy.should-hint'] == 2 && calls['storage-proxy.submit-hint'] == 2 && calls['hints-service.write'] == 2
  - state['hints-service'].total_hints == 2 && size(state['hints-buffer'].hints) == 2
  - ctx.batchlogRemoved == true && calls['batchlog-manager.remove'] == 1 && size(state['batchlog-manager'].batches) == 0
