schema_version: 1
id: cassandra
scenarios:
  - id: bench-w8
    flow: replica-mutation-verb
    name: "W8: replica apply - commit log append, then memtable, MUTATION_RSP without waiting for fsync (periodic, 10000ms)"
    state:
      abstract-commit-log-service: {commitlog_sync: periodic, sync_period_ms: 10000, sync_lag_block_ms: 15000, last_synced_at_ms: 0}
    expect:
      - "result.ok && result.value.verb == 'MUTATION_RSP' && result.value.from == '10.0.0.2'"
      - "calls['commit-log.add'] == 1 && calls['commitlog-disk.segment-append'] == 1 && ctx.commitLog == 'appended'"
      - "calls['periodic-commit-log-service.maybe-wait-for-sync'] == 1 && calls['abstract-commit-log-service.await-sync-at'] == 0 && calls['commitlog-disk.segment-sync'] == 0 && !has(ctx.waitedOnCommit)"
      - "calls['skip-list-memtable.put'] == 1 && state['skip-list-memtable'].cells['10.0.0.2:ks1.users:user:42:name'].value == 'alice'"
  - id: bench-w8-order
    flow: replica-mutation-verb
    name: "W8 (order): a failed commit log append leaves the memtable untouched, so the append comes first"
    faults:
      - {target: commitlog-disk.segment-append, type: error, code: io-error}
    expect:
      - "!result.ok && result.error.code == 'fs-write-error'"
      - "calls['commit-log.add'] == 1 && calls['skip-list-memtable.put'] == 0 && calls['cassandra-table-write-handler.write'] == 0"
