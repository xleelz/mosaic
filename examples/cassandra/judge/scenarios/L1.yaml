schema_version: 1
id: cassandra
scenarios:
  - id: bench-l1
    flow: cql-conditional-write
    name: "L1: INSERT ... IF NOT EXISTS, no contention: v1 prepare, QUORUM read, propose, commit; [applied] true"
    input:
      statement:
        keyspace: shop
        table: users
        type: INSERT
        if_not_exists: true
        columns: {name: Ada}
        partition_keys:
          - {partition_key: "user:42", token: -7509452495886106294}
    state:
      # write-path's schema state only knows ks1.*; declare shop.users so the commit is applied, not skipped
      keyspace:
        tables:
          shop.users: {cdc: false, skip_commitlog: false}
          system.batches: {cdc: false, skip_commitlog: false}
        durable_writes: {shop: true, system: true}
    expect:
      - "result.ok && result.value.applied == true && result.value.rows[0]['[applied]'] == true"
      # deployed paxos_variant v1 -> StorageProxy.legacyCas
      - "ctx.paxosVariant == 'v1' && calls['storage-proxy.legacy-cas'] == 1 && calls['paxos.cas'] == 0"
      # one round each, no contention
      - "calls['ballot-generator.next-ballot'] == 1 && ctx.casContentions == 0"
      # prepare/promise: 2 PAXOS_PREPARE_REQ messages + local prepare, all 3 promise
      - "calls['storage-proxy.prepare-paxos'] == 1 && calls['prepare-verb-handler.do-verb'] == 2 && calls['paxos-state.legacy-prepare'] == 3"
      # precondition read at QUORUM, then condition evaluated
      - "calls['storage-proxy.read-one'] == 1 && ctx.casConditionMet == true"
      # propose/accept from all 3, then commit to all 3 (QUORUM commit consistency)
      - "calls['storage-proxy.propose-paxos'] == 1 && calls['paxos-state.legacy-propose'] == 3"
      - "calls['storage-proxy.commit-paxos'] == 1 && calls['paxos-state.commit-direct'] == 3 && ctx.commitAcks == 3"
      - "calls['keyspace.apply'] == 3 && !has(ctx.unknownTable)"
      - "calls['storage-proxy.mutate-with-triggers'] == 0"
