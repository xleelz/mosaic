schema_version: 1
id: cassandra
scenarios:
  - id: bench-w9
    flow: memtable-force-flush
    name: "W9: flushing a dirty memtable writes an SSTable to the data directory and discards commit log segments up to the flush position"
    state:
      abstract-commit-log-segment-manager: {active_segments: 3}
      memtable-pool: {allocated_bytes: 600}
      skip-list-memtable:
        stats:
          10.0.0.1:ks1.users: {bytes: 600, operations: 3, partitions: 2}
    expect:
      - "result.ok && result.value.flushed == true && result.value.sstables == 1"
      - "calls['data-disk.sstable-write'] == 1 && state['column-family-store'].live_sstables['10.0.0.1:ks1.users'] == 1"
      - "calls['commit-log.discard-completed-segments'] == 1 && calls['commitlog-disk.segment-delete'] >= 1"
      - "state['abstract-commit-log-segment-manager'].active_segments < 3"
      - "state['skip-list-memtable'].stats['10.0.0.1:ks1.users'].partitions == 0 && state['memtable-pool'].allocated_bytes == 0"
