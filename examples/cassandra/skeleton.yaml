# Shared skeleton for the Apache Cassandra ontology built directly from code
# (cassandra-5.0.9, b5f2a54). It holds only external actors, the node and its
# package-level subsystems, and on-disk storage, all with canonical ids. Area
# agents model internals as children (parent: <id here>) in their own fragments.
# attributes.owner names the area that models each component's internals.
#
# One JVM, many roles: every Cassandra node runs the same code. The node we
# follow is the coordinator for client requests; the replicas it messages are
# the same subsystems on other nodes. Internode messages are calls to the
# receiving verb handler's interface (kind: verb), so a fault on the Nth call to
# a handler fails the Nth replica contacted. See BRIEF.md "Cluster convention".
schema_version: 1
id: cassandra
name: Apache Cassandra 5.0 (built from code)
description: >-
  Apache Cassandra modelled directly from its source code at cassandra-5.0.9 by
  area agents, as a benchmark of mosaic's code-to-ontology generation.
source:
  repo: apache/cassandra
  sha: b5f2a54210d541339c2e7c17a794195cac0e67c2

components:
  # External actors
  - {id: cql-client, name: CQL client, kind: client, layer: clients, summary: An application using a native-protocol driver (or cqlsh)., attributes: {owner: transport}}
  - {id: operator, name: Operator, kind: client, layer: clients, summary: "A person or tool using nodetool, JMX or the standalone tools.", attributes: {owner: ops}}

  # The node (one JVM) and its subsystems, by package
  - {id: cassandra-node, name: Cassandra node, kind: service, layer: node, sources: [src/java/org/apache/cassandra/service/CassandraDaemon.java], summary: One Cassandra process. Every node runs the same code and can coordinate or serve as a replica., attributes: {owner: ops}}
  - {id: transport, name: Native transport, kind: module, layer: protocol, parent: cassandra-node, sources: [src/java/org/apache/cassandra/transport/Server.java], summary: The CQL native protocol server (port 9042)., attributes: {owner: transport}}
  - {id: cql, name: CQL layer, kind: module, layer: query, parent: cassandra-node, sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java], summary: "Parsing, preparing and executing CQL statements.", attributes: {owner: cql}}
  - {id: coordination, name: Request coordination, kind: module, layer: coordination, parent: cassandra-node, sources: [src/java/org/apache/cassandra/service/StorageProxy.java], summary: "Replica selection, consistency levels, response handlers, read repair and speculative retry.", attributes: {owner: coordination}}
  - {id: paxos, name: Paxos (LWT), kind: module, layer: coordination, parent: cassandra-node, sources: [src/java/org/apache/cassandra/service/paxos/Paxos.java], summary: Lightweight transactions (compare-and-set)., attributes: {owner: paxos}}
  - {id: write-path, name: Local write path, kind: module, layer: storage, parent: cassandra-node, sources: [src/java/org/apache/cassandra/db/Keyspace.java], summary: "Applying mutations locally: commit log, memtables and flush.", attributes: {owner: write-path}}
  - {id: read-path, name: Local read path, kind: module, layer: storage, parent: cassandra-node, sources: [src/java/org/apache/cassandra/db/ReadCommand.java], summary: "Local reads over memtables and SSTables, compaction and secondary indexes.", attributes: {owner: read-path}}
  - {id: hints-batchlog, name: Hints and batchlog, kind: module, layer: durability, parent: cassandra-node, sources: [src/java/org/apache/cassandra/hints/HintsService.java, src/java/org/apache/cassandra/batchlog/BatchlogManager.java], summary: Hinted handoff and the logged-batch log., attributes: {owner: hints-batchlog}}
  - {id: membership, name: Membership and ring, kind: module, layer: cluster, parent: cassandra-node, sources: [src/java/org/apache/cassandra/gms/Gossiper.java, src/java/org/apache/cassandra/service/StorageService.java], summary: "Gossip, failure detection, token metadata and node lifecycle (bootstrap, decommission, move).", attributes: {owner: membership}}
  - {id: repair-streaming, name: Repair and streaming, kind: module, layer: cluster, parent: cassandra-node, sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java, src/java/org/apache/cassandra/streaming/StreamSession.java], summary: Anti-entropy repair and SSTable streaming between nodes., attributes: {owner: repair-streaming}}
  - {id: schema-auth, name: Schema and auth, kind: module, layer: metadata, parent: cassandra-node, sources: [src/java/org/apache/cassandra/schema/Schema.java, src/java/org/apache/cassandra/auth/AuthConfig.java], summary: "Schema changes and their propagation, authentication, authorization and roles.", attributes: {owner: schema-auth}}
  - {id: messaging, name: Internode messaging, kind: module, layer: network, parent: cassandra-node, sources: [src/java/org/apache/cassandra/net/MessagingService.java], summary: "Internode connections, verbs, callbacks and expiry (port 7000).", attributes: {owner: membership}}
  - {id: node-ops, name: Operations surface, kind: module, layer: ops, parent: cassandra-node, sources: [src/java/org/apache/cassandra/service/StorageServiceMBean.java], summary: "JMX MBeans, nodetool, virtual tables, startup checks and background executors.", attributes: {owner: ops}}

  # Local storage (shared infrastructure)
  - {id: commitlog-disk, name: Commit log directory, kind: datastore, layer: disk, summary: Commit log segments on local disk., attributes: {owner: shared}}
  - {id: data-disk, name: Data directories, kind: datastore, layer: disk, summary: "SSTables, snapshots and system keyspace files on local disk.", attributes: {owner: shared}}
  - {id: hints-disk, name: Hints directory, kind: datastore, layer: disk, summary: Hint files on local disk., attributes: {owner: shared}}
