# Profile for the Cassandra 5.0.9 build. The build predates the profile format
# (examples/_profile-template/profile.yaml); this file holds only what the checks read.
profile_version: 1
id: cassandra
name: Apache Cassandra 5.0.9 (built from code)
workspace: examples/cassandra

snapshot:
  repo: apache/cassandra
  ref: cassandra-5.0.9
  path: /home/lbethay/.cache/cassandra-bench/cassandra-5.0.9

# Areas and owned paths, from BRIEF.md's ownership table (method-level overrides left out); read
# by test_targets.py to place each test file.
areas:
  - id: transport
    owns: [src/java/org/apache/cassandra/transport/**, src/java/org/apache/cassandra/service/NativeTransportService.java, src/java/org/apache/cassandra/service/ClientState.java, src/java/org/apache/cassandra/service/QueryState.java, src/java/org/apache/cassandra/service/ClientWarn.java]
  - id: cql
    owns: [src/java/org/apache/cassandra/cql3/**]
  - id: coordination
    owns: [src/java/org/apache/cassandra/service/StorageProxy.java, src/java/org/apache/cassandra/service/reads/**, src/java/org/apache/cassandra/service/*ResponseHandler.java, src/java/org/apache/cassandra/service/pager/**, src/java/org/apache/cassandra/locator/**, src/java/org/apache/cassandra/db/ConsistencyLevel.java]
  - id: paxos
    owns: [src/java/org/apache/cassandra/service/paxos/**, src/java/org/apache/cassandra/service/CASRequest.java]
  - id: write-path
    owns: [src/java/org/apache/cassandra/db/commitlog/**, src/java/org/apache/cassandra/db/memtable/**, src/java/org/apache/cassandra/db/Keyspace.java, src/java/org/apache/cassandra/db/Mutation*.java, src/java/org/apache/cassandra/db/CounterMutation*.java, src/java/org/apache/cassandra/db/ColumnFamilyStore.java, src/java/org/apache/cassandra/db/WriteType.java, src/java/org/apache/cassandra/db/view/**]
  - id: read-path
    owns: [src/java/org/apache/cassandra/db/*ReadCommand*.java, src/java/org/apache/cassandra/db/ReadExecutionController.java, src/java/org/apache/cassandra/db/rows/**, src/java/org/apache/cassandra/db/partitions/**, src/java/org/apache/cassandra/db/filter/**, src/java/org/apache/cassandra/io/**, src/java/org/apache/cassandra/db/compaction/**, src/java/org/apache/cassandra/db/lifecycle/**, src/java/org/apache/cassandra/index/**, src/java/org/apache/cassandra/cache/**]
  - id: hints-batchlog
    owns: [src/java/org/apache/cassandra/hints/**, src/java/org/apache/cassandra/batchlog/**, src/java/org/apache/cassandra/service/BatchlogResponseHandler.java]
  - id: membership
    owns: [src/java/org/apache/cassandra/gms/**, src/java/org/apache/cassandra/net/**, src/java/org/apache/cassandra/dht/**, src/java/org/apache/cassandra/locator/TokenMetadata.java, src/java/org/apache/cassandra/service/StorageService.java, src/java/org/apache/cassandra/service/PendingRangeCalculatorService.java, src/java/org/apache/cassandra/service/LoadBroadcaster.java]
  - id: repair-streaming
    owns: [src/java/org/apache/cassandra/repair/**, src/java/org/apache/cassandra/streaming/**, src/java/org/apache/cassandra/db/streaming/**, src/java/org/apache/cassandra/service/ActiveRepairService.java, src/java/org/apache/cassandra/service/AutoRepairService.java, src/java/org/apache/cassandra/service/snapshot/**]
  - id: schema-auth
    owns: [src/java/org/apache/cassandra/schema/**, src/java/org/apache/cassandra/auth/**, src/java/org/apache/cassandra/cql3/statements/schema/**]
  - id: ops
    owns: [src/java/org/apache/cassandra/tools/**, src/java/org/apache/cassandra/service/CassandraDaemon.java, src/java/org/apache/cassandra/service/StartupChecks.java, src/java/org/apache/cassandra/db/virtual/**, src/java/org/apache/cassandra/tracing/**, src/java/org/apache/cassandra/audit/**, src/java/org/apache/cassandra/fql/**, src/java/org/apache/cassandra/concurrent/**, src/java/org/apache/cassandra/config/**, src/java/org/apache/cassandra/utils/**, src/java/org/apache/cassandra/metrics/**, src/java/org/apache/cassandra/security/**, src/java/org/apache/cassandra/service/*MBean.java]

# The tests test_targets.py maps to their code (test-targets.json, for --tests).
oracle:
  test_dirs: [test/unit, test/distributed]
  include: ["**/*Test.java"]
  exclude: []

# Ratcheted check thresholds (DESIGN §16.1; the template's section 12). Measured 2026-11-02 at
# today's values, so the current model passes the full gate. They only go down; never raise one.
gates:
  strict_stubs: true                  # 0 stub disagreements
  max_exemption_issues: 0
  max_internal_assertions: 0.359      # the highest fragment share, write-path.yaml 96/268, rounded up
  max_clock_ids: 4
  max_unknown_inputs: 2
  max_racy: 0.556                     # the highest fragment share, paxos.yaml 5/9, rounded up
  max_seam_names: 0
  min_test_reach: 0.476               # the lowest area, cql 50/105, rounded down
  # Exploration (--explore 'race|concurr' --schedules 20) is recorded, not gated:
  # 0 of 21 scenarios fail.
  # max_explore_failures: unset
