      server-connection-tracker:
        registrations:
          "TOPOLOGY_CHANGE:10.0.1.6:40000": {event_type: TOPOLOGY_CHANGE, channel: "10.0.1.6:40000", version: 4}
    expect:
      - "calls['cql-client.event-message'] == 1 && calls['dispatcher.event-dispatcher'] == 0"
      - "state['server-event-notifier@n1'].latest_events['n2'].topology == 'REMOVED_NODE' && state['server-event-notifier@n1'].latest_events['n2'].status == 'DOWN'"
  - id: move-moved-node-sent
    flow: endpoint-move-event
    fixtures: [three-node-rf3]
    state:
      server-connection-tracker:
        registrations:
          "TOPOLOGY_CHANGE:10.0.1.5:51234": {event_type: TOPOLOGY_CHANGE, channel: "10.0.1.5:51234", version: 5}
    expect:
      - "calls['cql-client.event-message'] == 1 && state['server-event-notifier@n1'].latest_events['n2'].topology == 'MOVED_NODE'"
  - id: schema-change-pushed
    flow: schema-change-event
    fixtures: [three-node-rf3]
    state:
      server-connection-tracker:
        registrations:
          "SCHEMA_CHANGE:10.0.1.5:51234": {event_type: SCHEMA_CHANGE, channel: "10.0.1.5:51234", version: 5}
          "SCHEMA_CHANGE:10.0.1.6:40000": {event_type: SCHEMA_CHANGE, channel: "10.0.1.6:40000", version: 4}
          "STATUS_CHANGE:10.0.1.7:40001": {event_type: STATUS_CHANGE, channel: "10.0.1.7:40001", version: 5}
    expect:
      - "calls['cql-client.event-message'] == 2 && ctx.event_recipients == 2"

  # ---------------------------------------------------------------- session checks
  - id: permission-allow-all
    flow: client-permission-check
    fixtures: [three-node-rf3]
    expect:
      - "result.ok && calls['authenticated-user.get-permissions'] == 0"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'authenticated-user.get-permissions')"
  - id: permission-granted
    flow: client-permission-check
    fixtures: [three-node-rf3, auth-users]
    name: alice holds MODIFY on shop.orders
    input: {table: orders, permission: MODIFY}
    state:
      client-state: {user: alice}
    expect:
      - "result.ok && calls['authenticated-user.get-permissions'] == 1"
  - id: permission-denied
    flow: client-permission-check
    fixtures: [three-node-rf3, auth-users]
    name: No permission anywhere on the resource chain
    input: {permission: ALTER}
    state:
      client-state: {user: mallory}
    expect:
      - "!result.ok && result.error.code == 'unauthorized' && result.error.status == 8448 && result.error.message.contains('has no ALTER permission')"
      - "calls['authenticated-user.get-permissions'] == 3"
  - id: permission-not-logged-in
    flow: client-permission-check
    fixtures: [three-node-rf3]
    state:
      client-state: {user: ""}
    expect:
      - "!result.ok && result.error.code == 'unauthorized' && result.error.message == 'You have not logged in'"
  - id: permission-system-keyspace-ddl
    flow: client-permission-check
    fixtures: [three-node-rf3]
    input: {keyspace: system, table: local, permission: DROP}
    expect:
      - "!result.ok && result.error.code == 'unauthorized' && result.error.message == 'system keyspace is not user-modifiable.'"
  - id: permission-no-keyspace
    flow: client-permission-check
    fixtures: [three-node-rf3]
    input: {keyspace: ""}
    expect:
      - "!result.ok && result.error.code == 'invalid' && result.error.message == 'You have not set a keyspace for this session'"
  - id: not-anonymous-refused
    flow: client-not-anonymous-check
    name: "AllowAllAuthenticator: the session is anonymous"
    expect:
      - "!result.ok && result.error.code == 'unauthorized' && result.error.message == 'You have to be logged in and not anonymous to perform this request'"
  - id: not-anonymous-logged-in
    flow: client-not-anonymous-check
    fixtures: [auth-users]
    state:
      client-state: {user: alice}
    expect:
      - "result.ok && result.value.user == 'alice'"
  - id: not-anonymous-not-logged-in
    flow: client-not-anonymous-check
    fixtures: [auth-users]
    expect:
      - "!result.ok && result.error.message == 'You have not logged in'"
  - id: use-existing-keyspace
    flow: client-use-keyspace
    fixtures: [base-schema]
    expect:
      - "result.ok && state['client-state'].keyspace == 'shop'"
  - id: use-missing-keyspace
    flow: client-use-keyspace
    fixtures: [base-schema]
    input: {keyspace: nope}
    expect:
      - "!result.ok && result.error.code == 'invalid' && state['client-state'].keyspace == ''"
  - id: use-before-login-skips-validation
    flow: client-use-keyspace
    fixtures: [base-schema]
    state:
      client-state: {user: ""}
    expect:
      - "result.ok && calls['schema.get-keyspace-metadata'] == 0 && state['client-state'].keyspace == 'shop'"
  - id: timestamp-generated
    flow: request-timestamp
    expect:
      - "result.ok && calls['client-state.get-timestamp'] == 1 && result.value.timestamp == state['client-state'].last_timestamp_micros"
  - id: timestamp-monotonic-when-clock-behind
    flow: request-timestamp
    state:
      client-state: {last_timestamp_micros: 1730246400000000}
    expect:
      - "result.ok && result.value.timestamp == 1730246400000001"
      - "state['client-state'].last_timestamp_micros == 1730246400000001"
  - id: timestamp-cached-for-request
    flow: request-timestamp
    state:
      query-state: {timestamp: 1730246400123456}
    expect:
      - "result.ok && result.value.timestamp == 1730246400123456 && calls['client-state.get-timestamp'] == 0"

  # ---------------------------------------------------------------- multi-step (sessions) and capacity
  - id: startup-then-query-deployed
    name: "Deployed AllowAllAuthenticator: STARTUP, then QUERY on the same connection"
    fixtures: [three-node-rf3]
    steps:
      - {flow: native-startup, as: start}
      - {flow: native-query, as: q}
    expect:
      - "steps.start.result.ok && steps.start.result.value.type == 'READY'"
      - "steps.q.result.ok && steps.q.result.value.type == 'RESULT'"
      - "state['server-connection@n1'].stage == 'READY' && state['client-state@n1'].user == 'anonymous'"
  - id: startup-auth-then-query
    name: "PasswordAuthenticator: STARTUP, AUTH_RESPONSE, then QUERY"
    fixtures: [three-node-rf3, auth-users]
    steps:
      - {flow: native-startup, as: start}
      - {flow: native-auth-response, as: auth}
      - {flow: native-query, as: q}
    expect:
      - "steps.start.result.value.type == 'AUTHENTICATE'"
      - "steps.auth.result.ok && steps.auth.result.value.type == 'AUTH_SUCCESS'"
      - "steps.q.result.ok && steps.q.result.value.type == 'RESULT'"
      - "state['client-state@n1'].user == 'alice' && state['server-connection@n1'].stage == 'READY'"
  - id: query-before-auth-refused
    name: "PasswordAuthenticator: STARTUP, then QUERY without AUTH_RESPONSE"
    fixtures: [three-node-rf3, auth-users]
    steps:
      - {flow: native-startup, as: start}
      - {flow: native-query, as: q}
    expect:
      - "steps.start.result.value.type == 'AUTHENTICATE'"
      - "!steps.q.result.ok && steps.q.result.error.code == 'protocol-error' && steps.q.result.error.message == 'Unexpected message QUERY, expecting SASL_RESPONSE'"
      - "state['server-connection@n1'].stage == 'AUTHENTICATING' && !trace.exists(e, e.type == 'call.start' && e.interface == 'query-processor.parse')"
  - id: bad-password-then-retry
    name: Wrong password leaves the connection AUTHENTICATING, and a retry with the right one succeeds
    fixtures: [three-node-rf3, auth-users]
    steps:
      - {flow: native-startup, as: start}
      - {flow: native-auth-response, as: bad, input: {password: wrong}}
      - {flow: native-auth-response, as: good}
    expect:
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'bad-credentials' && steps.bad.result.error.status == 256"
      - "steps.good.result.ok && state['client-state@n1'].user == 'alice' && state['server-connection@n1'].stage == 'READY'"
  - id: prepare-then-execute
    name: PREPARE, then EXECUTE the returned id
    fixtures: [three-node-rf3]
    steps:
      - {flow: native-prepare, as: prep}
      - flow: native-execute
        as: exec
        input: {statement_id: "= steps.prep.result.value.result.statement_id", result_metadata_id: "= steps.prep.result.value.result.result_metadata_id"}
    expect:
      - "steps.prep.result.ok && steps.prep.result.value.result.kind == 'PREPARED'"
      - "steps.exec.result.ok && steps.exec.result.value.type == 'RESULT' && ctx.metadata_changed == false"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'query-processor.process-prepared' && e.instance == 'n1')"
  - id: unprepared-then-reprepare-then-execute
    name: "EXECUTE an unknown id (UNPREPARED), PREPARE, EXECUTE again: what a driver does"
    fixtures: [three-node-rf3]
    steps:
      - {flow: native-execute, as: miss, input: {statement_id: "md5:never-prepared"}}
      - {flow: native-prepare, as: prep}
      - flow: native-execute
        as: exec
        input: {statement_id: "= steps.prep.result.value.result.statement_id", result_metadata_id: "= steps.prep.result.value.result.result_metadata_id"}
    expect:
      - "!steps.miss.result.ok && steps.miss.result.error.code == 'unprepared' && steps.miss.result.error.status == 9472"
      - "steps.exec.result.ok"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'query-processor.process-prepared').size() == 1"
  - id: register-then-node-down
    name: REGISTER STATUS_CHANGE, then a node goes down and the client gets the event
    fixtures: [three-node-rf3]
    steps:
      - {flow: native-register, as: reg, input: {event_types: [STATUS_CHANGE]}}
      - {flow: endpoint-down-event, as: down}
    expect:
      - "steps.reg.result.ok && 'STATUS_CHANGE:10.0.1.5:51234' in state['server-connection-tracker@n1'].registrations"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'cql-client.event-message' && e.input.event.change == 'DOWN' && e.input.event.address == 'n2:9042')"
  - id: node-down-twice-sends-once
    name: Two DOWN notifications for the same node; the second is a duplicate
    fixtures: [three-node-rf3]
    state:
      server-connection-tracker:
        registrations:
          "STATUS_CHANGE:10.0.1.5:51234": {event_type: STATUS_CHANGE, channel: "10.0.1.5:51234", version: 5}
    steps:
      - {flow: endpoint-down-event, as: first}
      - {flow: endpoint-down-event, as: second}
      - {flow: endpoint-up-event, as: up}
    expect:
      - "ctx.event_suppressed == 'duplicate'"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'cql-client.event-message').map(e, e.input.event.change) == ['DOWN', 'UP']"
      - "state['server-event-notifier@n1'].latest_events['n2'].status == 'UP'"
  - id: use-keyspace-then-unqualified-query
    name: USE shop, then a QUERY naming the table without its keyspace
    fixtures: [three-node-rf3]
    steps:
      - {flow: client-use-keyspace, as: use}
      - flow: native-query
        as: q
        input: {query: "SELECT name FROM users WHERE id = 'user:42'", statement: {type: SELECT, keyspace: "", table: users, fully_qualified: false, bind_markers: 0}}
    expect:
      - "steps.use.result.ok && state['client-state@n1'].keyspace == 'shop'"
      - "steps.q.result.ok && steps.q.result.value.type == 'RESULT'"
  - id: stop-then-query-refused
    name: nodetool disablebinary (stop), then a QUERY on a still-open connection
    steps:
      - {flow: native-transport-stop, as: stop}
      - {flow: native-query, as: q}
    expect:
      - "!state['server-connection-tracker'].running"
      - "!steps.q.result.ok && steps.q.result.error.code == 'overloaded' && steps.q.result.error.message == 'Server is shutting down'"
  - id: stop-start-then-query
    name: Stop, start again, then QUERY
    fixtures: [three-node-rf3]
    steps:
      - {flow: native-transport-stop, as: stop}
      - {flow: native-transport-start, as: start}
      - {flow: native-query, as: q}
    expect:
      - "steps.start.result.ok && state['server-connection-tracker@n1'].running"
      - "steps.q.result.ok"
  - id: batch-then-select
    name: LOGGED BATCH inserting an order, then SELECT it
    fixtures: [three-node-rf3]
    steps:
      - flow: native-batch
        as: b
        input:
          queries:
            - {kind: 0, query: "INSERT INTO shop.orders (id, total) VALUES (?, ?)", statement: {type: INSERT, keyspace: shop, table: orders, fully_qualified: true, bind_markers: 2, partition_keys: [{partition_key: "order:1001", token: 1622840367226573521}], columns: {total: "19.99"}}, values: ["order:1001", "19.99"]}
      - flow: native-query
        as: r
        input:
          query: "SELECT total FROM shop.orders WHERE id = 'order:1001'"
          statement: {type: SELECT, keyspace: shop, table: orders, fully_qualified: true, bind_markers: 0, partition_keys: [{partition_key: "order:1001", token: 1622840367226573521}], columns: {total: ""}}
    expect:
      - "steps.b.result.ok"
      - "steps.r.result.ok && size(steps.r.result.value.result.rows) == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'query-processor.process-batch' && e.instance == 'n1')"
  - id: auth-storm-queues-on-auth-executor
    flow: auth-connection-storm
    name: "Five AUTH_RESPONSEs with 3s password checks: the fifth waits for one of the 4 auth workers"
    fixtures: [three-node-rf3, auth-users]
    state:
      server-connection: {stage: AUTHENTICATING}
    faults:
      - {target: password-authenticator-plain-text-sasl-authenticator.get-authenticated-user, type: latency, latency_ms: 3000}
    expect:
      - "result.ok && result.value.succeeded == 5"
      - "trace.exists(e, e.type == 'queue' && e.component == 'dispatcher-auth-executor')"
      - "!trace.exists(e, e.type == 'queue' && e.component == 'dispatcher-request-executor')"
  - id: auth-storm-times-out-in-queue
    flow: auth-connection-storm
    name: "Five AUTH_RESPONSEs with 12.5s password checks: the fifth waited past native_transport_timeout"
    fixtures: [three-node-rf3, auth-users]
    state:
      server-connection: {stage: AUTHENTICATING}
    faults:
      - {target: password-authenticator-plain-text-sasl-authenticator.get-authenticated-user, type: latency, latency_ms: 12500}
    expect:
      - "result.ok && result.value.succeeded == 4 && result.value.overloaded == 1"
      - "trace.exists(e, e.type == 'queue' && e.component == 'dispatcher-auth-executor')"
      - "ctx.timed_out_before_processing"
  - id: query-rate-limiter-ignored-when-disabled
    flow: native-query
    name: "Deployed config: the rate limiter is off, so an exhausted limiter changes nothing (THROW_ON_OVERLOAD set)"
    fixtures: [three-node-rf3]
    state:
      cql-message-handler: {throw_on_overload: true}
      client-resource-limits: {permit_available: false}
    expect:
      - "result.ok && !has(ctx.overload) && calls['client-resource-limits.release'] == 0"
      - "state['client-resource-limits@n1'].endpoint_in_flight_bytes == 96"

configs:
  # Native transport settings the transport area reads (DESIGN.md §11.6). value = deployed
  # (conf/cassandra.yaml, else the Config.java default), default = code default.
  - {id: native-transport-port, type: integer, value: 9042, default: 9042, summary: CQL native protocol port., sources: [conf/cassandra.yaml:1023, src/java/org/apache/cassandra/config/Config.java:279], attributes: {key: native_transport_port}}
  - {id: native-transport-port-ssl, type: integer, value: 9042, default: 9042, summary: "Separate TLS port. Unset (yaml :1032 commented, Config null), so DatabaseDescriptor returns native_transport_port and one server runs.", sources: [src/java/org/apache/cassandra/config/Config.java:282, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:3116-3119], attributes: {key: native_transport_port_ssl}}
  - {id: client-encryption-policy, type: string, value: UNENCRYPTED, default: UNENCRYPTED, summary: "client_encryption_options.enabled false and optional unset give TlsEncryptionPolicy UNENCRYPTED.", sources: [conf/cassandra.yaml:1699-1701, src/java/org/apache/cassandra/config/EncryptionOptions.java:420-433], attributes: {key: client_encryption_options}}
  - {id: native-transport-max-threads, type: integer, value: 128, default: 128, summary: "Native-Transport-Requests executor size (the dispatcher-request-executor capacity).", sources: [conf/cassandra.yaml:1035, src/java/org/apache/cassandra/config/Config.java:283], attributes: {key: native_transport_max_threads}}
  - {id: native-transport-max-auth-threads, type: integer, value: 4, default: 4, summary: "Native-Transport-Auth-Requests executor size; below 1 sends AUTH_RESPONSE to the request executor.", sources: [conf/cassandra.yaml:1038, src/java/org/apache/cassandra/config/Config.java:287], attributes: {key: native_transport_max_auth_threads}}
  - {id: native-transport-max-frame-size-bytes, type: integer, value: 16777216, default: 16777216, summary: Largest unframed (pre-v5) envelope; 16MiB., sources: [conf/cassandra.yaml:1044, src/java/org/apache/cassandra/config/Config.java:285], attributes: {key: native_transport_max_frame_size}}
  - {id: native-transport-max-concurrent-connections, type: integer, value: -1, default: -1, summary: "Global connection limit; -1 disables it (and with the per-IP limit also -1 the handler is not installed).", sources: [conf/cassandra.yaml:1048, src/java/org/apache/cassandra/config/Config.java:289], attributes: {key: native_transport_max_concurrent_connections}}
  - {id: native-transport-max-concurrent-connections-per-ip, type: integer, value: -1, default: -1, summary: Per-client-IP connection limit; -1 disables it., sources: [conf/cassandra.yaml:1052, src/java/org/apache/cassandra/config/Config.java:290], attributes: {key: native_transport_max_concurrent_connections_per_ip}}
  - {id: native-transport-allow-older-protocols, type: boolean, value: true, default: true, summary: Accept V3 and V4 as well as V5., sources: [conf/cassandra.yaml:1056, src/java/org/apache/cassandra/config/Config.java:292], attributes: {key: native_transport_allow_older_protocols}}
  - {id: native-transport-idle-timeout-ms, type: integer, value: 0, default: 0, summary: "Idle connections are never closed (yaml :1067 shows 60000ms commented out).", sources: [conf/cassandra.yaml:1067, src/java/org/apache/cassandra/config/Config.java:139], attributes: {key: native_transport_idle_timeout}}
  - {id: native-transport-rate-limiting-enabled, type: boolean, value: false, default: false, summary: "Global request rate limiter off, so the limiter is never consulted on the deployed node.", sources: [conf/cassandra.yaml:1076, src/java/org/apache/cassandra/config/Config.java:299], attributes: {key: native_transport_rate_limiting_enabled}}
  - {id: native-transport-max-requests-per-second, type: integer, value: 1000000, default: 1000000, summary: Rate of the global request limiter when enabled., sources: [conf/cassandra.yaml:1077, src/java/org/apache/cassandra/config/Config.java:300], attributes: {key: native_transport_max_requests_per_second}}
  - {id: native-transport-max-request-data-in-flight-bytes, type: integer, value: 429496729, default: 429496729, summary: "Global bytes-in-flight reserve. Unset, so heap/10; the value assumes a 4GiB heap.", sources: [src/java/org/apache/cassandra/config/Config.java:297-298, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:649-652], attributes: {key: native_transport_max_request_data_in_flight}}
  - {id: native-transport-max-request-data-in-flight-per-ip-bytes, type: integer, value: 107374182, default: 107374182, summary: "Per-IP bytes-in-flight reserve. Unset, so heap/40 (4GiB heap assumed).", sources: [src/java/org/apache/cassandra/config/Config.java:295-296, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:654-656], attributes: {key: native_transport_max_request_data_in_flight_per_ip}}
  - {id: native-transport-max-message-size-bytes, type: integer, value: 16777216, default: 16777216, summary: "Largest CQL message. Unset, so min(max_mutation_size, both in-flight limits); 16MiB is an assumed value.", sources: [src/java/org/apache/cassandra/config/Config.java:288, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:3237-3244], attributes: {key: native_transport_max_message_size}}
  - {id: native-transport-throw-on-overload, type: boolean, value: false, default: false, summary: "v5 default when STARTUP omits THROW_ON_OVERLOAD: apply backpressure, don't refuse.", sources: [src/java/org/apache/cassandra/config/Config.java:1393, src/java/org/apache/cassandra/transport/PipelineConfigurator.java:309-314], attributes: {key: native_transport_throw_on_overload}}
  - {id: native-transport-queue-max-item-age-threshold, type: number, value: 1.7976931348623157e308, default: 1.7976931348623157e308, summary: "Double.MAX_VALUE: the queue-age backpressure check never trips on the deployed node.", sources: [src/java/org/apache/cassandra/config/Config.java:1394, src/java/org/apache/cassandra/transport/Dispatcher.java:341-349], attributes: {key: native_transport_queue_max_item_age_threshold}}
  - {id: native-transport-min-backoff-on-queue-overload-ms, type: integer, value: 10, default: 10, summary: QueueBackpressure minimum delay., sources: [src/java/org/apache/cassandra/config/Config.java:1395, src/java/org/apache/cassandra/transport/QueueBackpressure.java:121-124], attributes: {key: native_transport_min_backoff_on_queue_overload}}
  - {id: native-transport-max-backoff-on-queue-overload-ms, type: integer, value: 200, default: 200, summary: QueueBackpressure maximum delay., sources: [src/java/org/apache/cassandra/config/Config.java:1396, src/java/org/apache/cassandra/transport/QueueBackpressure.java:121-124], attributes: {key: native_transport_max_backoff_on_queue_overload}}
  - {id: native-transport-timeout-ms, type: integer, value: 12000, default: 12000, summary: "Client deadline from enqueue: requests queued longer are refused OVERLOADED, and no coordinator work outlives it.", sources: [src/java/org/apache/cassandra/config/Config.java:1399, src/java/org/apache/cassandra/transport/Dispatcher.java:268-271], attributes: {key: native_transport_timeout}}
  - {id: consecutive-message-errors-threshold, type: integer, value: 1, default: 1, summary: "Errors in one frame beyond this turn fatal and close the connection.", sources: [src/java/org/apache/cassandra/config/Config.java:855, src/java/org/apache/cassandra/transport/CQLMessageHandler.java:345], attributes: {key: consecutive_message_errors_threshold}}
