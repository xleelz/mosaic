# Area: transport. The CQL native protocol server (transport/**), the native
# transport service lifecycle (service/NativeTransportService.java) and the
# per-connection session objects (service/ClientState.java, QueryState.java,
# ClientWarn.java). Every source is relative to the cassandra-5.0.9 checkout
# (b5f2a54210). The node we follow is the coordinator that owns the client's
# TCP connection; one connection is modeled per run.
schema_version: 1
id: cassandra

components:
  # ------------------------------------------------------------ lifecycle
  - id: native-transport-service
    name: NativeTransportService
    kind: service
    parent: transport
    layer: protocol
    summary: Lazily builds the netty event loop group and one or two Server instances (plain and TLS port), then starts and stops them.
    sources: [src/java/org/apache/cassandra/service/NativeTransportService.java:48-205]
    state:
      initial:
        initialized: false
  - id: pipeline-configurator
    name: PipelineConfigurator
    kind: module
    parent: transport
    layer: protocol
    summary: "Binds the server socket and builds each channel's netty pipeline: the initial (pre-STARTUP) pipeline, then the framed v5 pipeline or the legacy pre-v5 pipeline."
    sources: [src/java/org/apache/cassandra/transport/PipelineConfigurator.java:62-402]
    state:
      initial:
        channel_throw_on_overload: false
        pipeline: initial
  - id: connection-limit-handler
    name: ConnectionLimitHandler
    kind: module
    parent: transport
    layer: protocol
    summary: Shared channel handler that closes new connections beyond native_transport_max_concurrent_connections (global) or ..._per_ip.
    sources: [src/java/org/apache/cassandra/transport/ConnectionLimitHandler.java:46-149]
    state:
      initial:
        connections: 0
        client_ip_connections: 0
  - id: server-connection-tracker
    name: Server.ConnectionTracker
    kind: module
    parent: transport
    layer: protocol
    summary: "All open client channels, the per-event-type channel groups filled by REGISTER, and the server's running flag."
    sources: [src/java/org/apache/cassandra/transport/Server.java:276-360]
    state:
      initial:
        running: true
        channels: 0
        registrations: {}
  - id: server-event-notifier
    name: Server.EventNotifier
    kind: module
    parent: transport
    layer: protocol
    summary: Subscribes to endpoint lifecycle and schema changes and turns them into TOPOLOGY_CHANGE, STATUS_CHANGE and SCHEMA_CHANGE events for registered clients.
    sources: [src/java/org/apache/cassandra/transport/Server.java:396-609]
    state:
      initial:
        broadcast_native_address: ""
        latest_events: {}
        pending_joined: {}

  # ------------------------------------------------------------ framing and admission
  - id: initial-connection-handler
    name: InitialConnectionHandler
    kind: module
    parent: transport
    layer: protocol
    summary: First inbound handler on a new channel. Answers OPTIONS itself, turns STARTUP into a ServerConnection and reconfigures the pipeline, and rejects anything else and closes.
    sources: [src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:52-175]
  - id: envelope-decoder
    name: Envelope.Decoder
    kind: module
    parent: transport
    layer: protocol
    summary: Parses the 9-byte envelope header (version and direction, flags, stream id, opcode, body length) and enforces native_transport_max_frame_size.
    sources: [src/java/org/apache/cassandra/transport/Envelope.java:195-497]
  - id: protocol-version
    name: ProtocolVersion
    kind: function
    parent: transport
    layer: protocol
    summary: "Decodes the version byte: V3, V4, V5 and V6-beta are supported; V1/V2 and DSE versions are refused; older-than-V5 can be disallowed."
    sources: [src/java/org/apache/cassandra/transport/ProtocolVersion.java:38-176]
  - id: cql-message-handler
    name: CQLMessageHandler
    kind: module
    parent: transport
    layer: protocol
    summary: "v5+ framed inbound processor. Per message it acquires bytes-in-flight capacity, applies the global request rate limiter and the queue-age check, then either throws OverloadedException (THROW_ON_OVERLOAD) or processes and pauses the connection."
    sources: [src/java/org/apache/cassandra/transport/CQLMessageHandler.java:78-862]
    state:
      initial:
        throw_on_overload: false
  - id: pre-v5-handlers-legacy-dispatch-handler
    name: PreV5Handlers.LegacyDispatchHandler
    kind: module
    parent: transport
    layer: protocol
    summary: "Pre-v5 (V3, V4) equivalent of CQLMessageHandler's admission: checkLimits, then dispatch; backpressure pauses channel autoRead."
    sources: [src/java/org/apache/cassandra/transport/PreV5Handlers.java:56-270]
  - id: client-resource-limits
    name: ClientResourceLimits
    kind: limiter
    parent: transport
    layer: protocol
    summary: Per-endpoint and global bytes-in-flight reserves for client requests and the global request rate limiter.
    sources: [src/java/org/apache/cassandra/transport/ClientResourceLimits.java:38-297]
    state:
      initial:
        endpoint_in_flight_bytes: 0
        global_in_flight_bytes: 0
        permit_available: true
        permit_delay_ms: 0
  - id: dispatcher
    name: Dispatcher
    kind: module
    parent: transport
    layer: protocol
    summary: "Hands each decoded request to Native-Transport-Requests (or Native-Transport-Auth-Requests for AUTH_RESPONSE), times out requests that queued past native_transport_timeout, executes them and flushes the response."
    sources: [src/java/org/apache/cassandra/transport/Dispatcher.java:53-518]
    tags: [incidental]
    description: "Incidental state: the oldest queued task's age (a load reading that scenarios set) and the QueueBackpressure incident severity."
    state:
      initial:
        oldest_task_queue_ms: 0
        queue_backpressure_severity: 0
  - id: dispatcher-request-executor
    name: Dispatcher.requestExecutor (Native-Transport-Requests)
    kind: pool
    parent: dispatcher
    layer: protocol
    summary: "SEP executor that runs every request except authentication; native_transport_max_threads (128) workers. A request that finds every worker busy waits in the queue, and its wait counts against native_transport_timeout."
    description: "capacity.concurrency is the deployed native_transport_max_threads; mosaic's capacity takes a literal, so a config override of native-transport-max-threads does not resize it."
    sources:
      - src/java/org/apache/cassandra/transport/Dispatcher.java:58-61
      - conf/cassandra.yaml:1035
    capacity: {concurrency: 128}
  - id: dispatcher-auth-executor
    name: Dispatcher.authExecutor (Native-Transport-Auth-Requests)
    kind: pool
    parent: dispatcher
    layer: protocol
    summary: "Small separate pool for AUTH_RESPONSE/CREDENTIALS (native_transport_max_auth_threads, 4) so expensive bcrypt checks during a connection storm cannot starve other requests (CASSANDRA-17812)."
    description: capacity.concurrency is the deployed native_transport_max_auth_threads (a literal, as for the request executor).
    sources:
      - src/java/org/apache/cassandra/transport/Dispatcher.java:63-80
      - conf/cassandra.yaml:1038
    capacity: {concurrency: 4}

  # ------------------------------------------------------------ connection and session
  - id: server-connection
    name: ServerConnection
    kind: module
    parent: transport
    layer: protocol
    summary: "One client connection: its protocol version, ClientState, SASL negotiator and stage state machine (ESTABLISHED, AUTHENTICATING, READY)."
    sources: [src/java/org/apache/cassandra/transport/ServerConnection.java:34-146]
    state:
      initial:
        stage: READY
        version: 5
        sasl_negotiator: false
  - id: client-state
    name: ClientState
    kind: module
    parent: transport
    layer: protocol
    summary: "Per-connection session state: logged-in user, current keyspace, driver info, plus the node-wide monotonic timestamp clock and the login and permission checks CQL statements call."
    sources: [src/java/org/apache/cassandra/service/ClientState.java:68-651]
    state:
      initial:
        user: anonymous
        keyspace: ""
        driver_name: ""
        driver_version: ""
        issued_prepared_statements_use_warning: false
        last_timestamp_micros: 0
        permissions: {}
  - id: query-state
    name: QueryState
    kind: function
    parent: transport
    layer: protocol
    summary: Wraps a ClientState for one request and caches the server-generated timestamp and nowInSeconds so the whole request uses one value.
    sources: [src/java/org/apache/cassandra/service/QueryState.java:30-117]
    state:
      initial:
        timestamp: -9223372036854775808
  - id: client-warn
    name: ClientWarn
    kind: function
    parent: transport
    tags: [incidental]
    layer: protocol
    summary: Executor-local list of warnings collected during a request and attached to its response (protocol V4+).
    sources: [src/java/org/apache/cassandra/service/ClientWarn.java:26-90]
    state:
      initial:
        capturing: false
        warnings: []
  - id: message-request
    name: Message.Request
    kind: function
    parent: transport
    layer: protocol
    summary: Base of every request message. execute() opens a tracing session for traceable messages when the TRACING flag is set, runs the subclass and stamps the tracing id.
    sources: [src/java/org/apache/cassandra/transport/Message.java:198-285]
  - id: error-message
    name: ErrorMessage
    kind: function
    parent: transport
    layer: protocol
    summary: Maps any Throwable to an ERROR response (TransportException codes, else SERVER_ERROR) and downgrades codes older protocol versions cannot carry.
    sources: [src/java/org/apache/cassandra/transport/messages/ErrorMessage.java:44-506]

  # ------------------------------------------------------------ request messages
  - {id: startup-message, name: StartupMessage, kind: function, parent: transport, layer: protocol, summary: "STARTUP (opcode 1): validates CQL_VERSION and COMPRESSION, records driver info, answers READY or AUTHENTICATE.", sources: [src/java/org/apache/cassandra/transport/messages/StartupMessage.java:36-142], state: {initial: {snappy_available: true}}}
  - {id: options-message, name: OptionsMessage, kind: function, parent: transport, layer: protocol, summary: "OPTIONS (opcode 5) after negotiation: answers SUPPORTED with CQL versions, compressions and protocol versions.", sources: [src/java/org/apache/cassandra/transport/messages/OptionsMessage.java:37-86]}
  - {id: auth-response, name: AuthResponse, kind: function, parent: transport, layer: protocol, summary: "AUTH_RESPONSE (opcode 15): feeds the SASL token to the connection's negotiator, logs the user in on completion.", sources: [src/java/org/apache/cassandra/transport/messages/AuthResponse.java:36-99]}
  - {id: register-message, name: RegisterMessage, kind: function, parent: transport, layer: protocol, summary: "REGISTER (opcode 11): adds the channel to the tracker's group for each requested event type.", sources: [src/java/org/apache/cassandra/transport/messages/RegisterMessage.java:28-85]}
  - {id: query-message, name: QueryMessage, kind: function, parent: transport, layer: protocol, summary: "QUERY (opcode 7): parse and process one CQL string through the configured QueryHandler.", sources: [src/java/org/apache/cassandra/transport/messages/QueryMessage.java:44-155]}
  - {id: prepare-message, name: PrepareMessage, kind: function, parent: transport, layer: protocol, summary: "PREPARE (opcode 9): prepare a CQL string, optionally against a per-message keyspace (v5 flag 0x01).", sources: [src/java/org/apache/cassandra/transport/messages/PrepareMessage.java:42-149]}
  - {id: execute-message, name: ExecuteMessage, kind: function, parent: transport, layer: protocol, summary: "EXECUTE (opcode 10): look up a prepared statement by id, execute it, and decide result-metadata flags.", sources: [src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:50-247]}
  - {id: batch-message, name: BatchMessage, kind: function, parent: transport, layer: protocol, summary: "BATCH (opcode 13): prepare or look up each statement, check bind counts and statement kinds, then process one BatchStatement.", sources: [src/java/org/apache/cassandra/transport/messages/BatchMessage.java:52-268]}

  # ------------------------------------------------------------ boundary stubs (other areas)
  - {id: query-processor, name: QueryProcessor, kind: module, parent: cql, sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java], attributes: {boundary: true, owner: cql}}
  - {id: password-authenticator, name: PasswordAuthenticator, kind: module, parent: schema-auth, sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java], attributes: {boundary: true, owner: schema-auth}}
  - {id: password-authenticator-plain-text-sasl-authenticator, name: PasswordAuthenticator.PlainTextSaslAuthenticator, kind: function, parent: password-authenticator, sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:247-313], attributes: {boundary: true, owner: schema-auth}}
  - {id: query-processor-prepared-statements, name: QueryProcessor.preparedStatements, kind: cache, parent: query-processor, sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:244-247], attributes: {boundary: true, owner: cql}}
  - {id: authenticated-user, name: AuthenticatedUser, kind: module, parent: schema-auth, sources: [src/java/org/apache/cassandra/auth/AuthenticatedUser.java], attributes: {boundary: true, owner: schema-auth}}
  - {id: auth-config, name: AuthConfig, kind: module, parent: schema-auth, sources: [src/java/org/apache/cassandra/auth/AuthConfig.java:41-130], attributes: {boundary: true, owner: schema-auth}}
  - {id: schema, name: Schema, kind: module, parent: schema-auth, sources: [src/java/org/apache/cassandra/schema/Schema.java], attributes: {boundary: true, owner: schema-auth}}
  - {id: tracing, name: Tracing, kind: module, parent: node-ops, sources: [src/java/org/apache/cassandra/tracing/Tracing.java], attributes: {boundary: true, owner: ops}}
  - {id: storage-service, name: StorageService, kind: module, parent: membership, sources: [src/java/org/apache/cassandra/service/StorageService.java], attributes: {boundary: true, owner: membership}}

interfaces:
  # =================================================================== native-protocol messages (entries)
  - component: transport
    name: startup-message
    kind: cql
    summary: "STARTUP (opcode 1). On a fresh channel the InitialConnectionHandler takes it; on an already negotiated channel it reaches the Dispatcher and is refused."
    sources:
      - src/java/org/apache/cassandra/transport/messages/StartupMessage.java:72-127
      - src/java/org/apache/cassandra/transport/Message.java:78
    attributes: {opcode: 1}
    request: TransportStartupRequest
    response: TransportResponse
    errors:
      - {code: protocol-error, status: 10}
      - {code: overloaded, status: 4097}
    behavior:
      - if: "!input.negotiated"
        then:
          - call: initial-connection-handler.decode
            input: {type: STARTUP, header: "= input.header", client_address: "= input.client_address", message: {options: "= input.options"}}
            as: r
          - return: "= vars.r.value"
      - call: cql-message-handler.process-one-contained-message
        input: {type: STARTUP, header: "= input.header", connection_version: "= input.connection_version", queue_time_ms: 0, client_address: "= input.client_address", message: {options: "= input.options"}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: options-message
    kind: cql
    summary: OPTIONS (opcode 5). Answered by the InitialConnectionHandler before STARTUP, or by OptionsMessage.execute through the Dispatcher afterwards (drivers use it as a heartbeat).
    sources:
      - src/java/org/apache/cassandra/transport/messages/OptionsMessage.java:62-79
      - src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:78-96
    attributes: {opcode: 5}
    request: TransportOptionsRequest
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}, {code: overloaded, status: 4097}]
    behavior:
      - if: "!input.negotiated"
        then:
          - call: initial-connection-handler.decode
            input: {type: OPTIONS, header: "= input.header", client_address: "= input.client_address", message: {}}
            as: r
          - return: "= vars.r.value"
      - call: cql-message-handler.process-one-contained-message
        input: {type: OPTIONS, header: "= input.header", connection_version: "= input.connection_version", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: {}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: auth-response-message
    kind: cql
    summary: "AUTH_RESPONSE (opcode 15): one SASL round. Only valid while the connection is AUTHENTICATING."
    sources:
      - src/java/org/apache/cassandra/transport/messages/AuthResponse.java:72-98
      - src/java/org/apache/cassandra/transport/Message.java:92
    attributes: {opcode: 15}
    request: TransportAuthResponseRequest
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}, {code: bad-credentials, status: 256}, {code: overloaded, status: 4097}]
    behavior:
      - call: transport.route-request
        input: {type: AUTH_RESPONSE, header: "= input.header", connection_version: "= input.connection_version", negotiated: "= input.negotiated", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: {username: "= input.username", password: "= input.password"}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: register-message
    kind: cql
    summary: "REGISTER (opcode 11): subscribe this connection to TOPOLOGY_CHANGE, STATUS_CHANGE, SCHEMA_CHANGE or TRACE_COMPLETE events."
    sources:
      - src/java/org/apache/cassandra/transport/messages/RegisterMessage.java:66-78
      - src/java/org/apache/cassandra/transport/Message.java:88
    attributes: {opcode: 11}
    request: TransportRegisterRequest
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}, {code: overloaded, status: 4097}]
    behavior:
      - call: transport.route-request
        input: {type: REGISTER, header: "= input.header", connection_version: "= input.connection_version", negotiated: "= input.negotiated", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: {event_types: "= input.event_types", channel: "= input.client_address"}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: query-message
    kind: cql
    summary: "QUERY (opcode 7): an unprepared CQL string with its QueryOptions (consistency, paging, serial consistency)."
    sources:
      - src/java/org/apache/cassandra/transport/messages/QueryMessage.java:102-133
      - src/java/org/apache/cassandra/transport/Message.java:84
    attributes: {opcode: 7}
    request: TransportQueryRequest
    response: TransportResponse
    errors: &cqlRequestErrors
      - {code: protocol-error, status: 10}
      - {code: server-error, status: 0}
      - {code: overloaded, status: 4097}
      - {code: unavailable, status: 4096}
      - {code: is-bootstrapping, status: 4098}
      - {code: truncate-error, status: 4099}
      - {code: write-timeout, status: 4352}
      - {code: read-timeout, status: 4608}
      - {code: read-failure, status: 4864}
      - {code: function-failure, status: 5120}
      - {code: write-failure, status: 5376}
      - {code: cdc-write-failure, status: 5632}
      - {code: cas-write-unknown, status: 5888}
      - {code: syntax-error, status: 8192}
      - {code: unauthorized, status: 8448}
      - {code: invalid, status: 8704}
      - {code: config-error, status: 8960}
      - {code: already-exists, status: 9216}
      - {code: unprepared, status: 9472}
    behavior:
      - call: transport.route-request
        input: {type: QUERY, header: "= input.header", connection_version: "= input.connection_version", negotiated: "= input.negotiated", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: {query: "= input.query", statement: "= input.statement", options: "= input.options"}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: prepare-message
    kind: cql
    summary: "PREPARE (opcode 9): returns a statement id and result metadata id for later EXECUTE."
    sources:
      - src/java/org/apache/cassandra/transport/messages/PrepareMessage.java:122-142
      - src/java/org/apache/cassandra/transport/Message.java:86
    attributes: {opcode: 9}
    request: TransportPrepareRequest
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - call: transport.route-request
        input: {type: PREPARE, header: "= input.header", connection_version: "= input.connection_version", negotiated: "= input.negotiated", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: {query: "= input.query", statement: "= input.statement", keyspace: "= input.keyspace"}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: execute-message
    kind: cql
    summary: "EXECUTE (opcode 10): run a prepared statement by id with bound values."
    sources:
      - src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:131-211
      - src/java/org/apache/cassandra/transport/Message.java:87
    attributes: {opcode: 10}
    request: TransportExecuteRequest
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - call: transport.route-request
        input: {type: EXECUTE, header: "= input.header", connection_version: "= input.connection_version", negotiated: "= input.negotiated", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: {statement_id: "= input.statement_id", result_metadata_id: "= input.result_metadata_id", values: "= input.values", options: "= input.options"}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: batch-message
    kind: cql
    summary: "BATCH (opcode 13): LOGGED, UNLOGGED or COUNTER batch of query strings and prepared ids."
    sources:
      - src/java/org/apache/cassandra/transport/messages/BatchMessage.java:173-241
      - src/java/org/apache/cassandra/transport/Message.java:90
    attributes: {opcode: 13}
    request: TransportBatchRequest
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - call: transport.route-request
        input: {type: BATCH, header: "= input.header", connection_version: "= input.connection_version", negotiated: "= input.negotiated", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: {batch_type: "= input.batch_type", queries: "= input.queries", options: "= input.options"}}
        as: r
      - return: "= vars.r.value"
  - component: transport
    name: route-request
    kind: function
    summary: "Which pipeline stage receives an inbound envelope: the InitialConnectionHandler before negotiation, CQLMessageHandler for v5+ framed connections, the legacy handlers for V3/V4."
    sources:
      - src/java/org/apache/cassandra/transport/PipelineConfigurator.java:276-345
      - src/java/org/apache/cassandra/transport/PipelineConfigurator.java:388-402
    request: TransportRoutedRequest
    response: TransportResponse
    behavior:
      - if: "!input.negotiated"
        then:
          - title: Request before STARTUP
            detail: The channel still has its initial pipeline, so the InitialConnectionHandler sees the envelope.
            source: src/java/org/apache/cassandra/transport/PipelineConfigurator.java:264-265
            call: initial-connection-handler.decode
            input: {type: "= input.type", header: "= input.header", client_address: "= input.client_address", message: "= input.message"}
            as: r
          - return: "= vars.r.value"
      - if: "input.connection_version >= 5"
        then:
          - call: cql-message-handler.process-one-contained-message
            input: {type: "= input.type", header: "= input.header", connection_version: "= input.connection_version", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: "= input.message"}
            as: r
          - return: "= vars.r.value"
      - call: pre-v5-handlers-legacy-dispatch-handler.channel-read0
        input: {type: "= input.type", header: "= input.header", connection_version: "= input.connection_version", queue_time_ms: "= input.queue_time_ms", client_address: "= input.client_address", message: "= input.message"}
        as: r
      - return: "= vars.r.value"

  # =================================================================== lifecycle
  - component: native-transport-service
    name: start
    kind: function
    summary: Initialize (once) and start every native transport Server.
    sources:
      - src/java/org/apache/cassandra/service/NativeTransportService.java:130-135
      - src/java/org/apache/cassandra/service/NativeTransportService.java:61-125
    response: {type: object, properties: {servers: {type: integer}}}
    errors: [{code: illegal-state-exception, status: 0}]
    behavior:
      - if: "config['native-transport-port'] != config['native-transport-port-ssl'] && config['client-encryption-policy'] == 'UNENCRYPTED'"
        then:
          - title: SSL port without client encryption
            source: src/java/org/apache/cassandra/service/NativeTransportService.java:101-102
            fail: {code: illegal-state-exception, status: 0, message: Encryption must be enabled in client_encryption_options for native_transport_port_ssl}
      - title: One server per port
        detail: "native_transport_port_ssl defaults to native_transport_port (DatabaseDescriptor.getNativeTransportPortSSL), so the deployed node runs a single server on 9042 with the configured TLS policy."
        source: src/java/org/apache/cassandra/service/NativeTransportService.java:92-120
        set:
          vars.servers: "= config['native-transport-port'] != config['native-transport-port-ssl'] ? [{'port': config['native-transport-port'], 'tls': 'UNENCRYPTED'}, {'port': config['native-transport-port-ssl'], 'tls': config['client-encryption-policy']}] : [{'port': config['native-transport-port'], 'tls': config['client-encryption-policy']}]"
          state.initialized: true
      - foreach: "= vars.servers"
        as: srv
        steps:
          - call: transport.start
            input: {port: "= vars.srv.port", tls_encryption_policy: "= vars.srv.tls"}
      - set: {ctx.native_servers: "= size(vars.servers)"}
      - return: {servers: "= size(vars.servers)"}
  - component: native-transport-service
    name: stop
    kind: function
    summary: Stop every server (nodetool disablebinary, drain, shutdown).
    sources: [src/java/org/apache/cassandra/service/NativeTransportService.java:140-148]
    behavior:
      - call: transport.stop
        input: {force: false}
  - component: transport
    name: start
    kind: function
    summary: Server.start binds the socket through the pipeline configurator and flips the running flag.
    sources: [src/java/org/apache/cassandra/transport/Server.java:135-148]
    request: {type: object, properties: {port: {type: integer, default: 9042}, tls_encryption_policy: {type: string, default: UNENCRYPTED}}}
    errors: [{code: illegal-state-exception, status: 0}]
    behavior:
      - call: server-connection-tracker.is-running
        as: running
      - if: "vars.running.value.running"
        then:
          - return: {started: false}
      - call: pipeline-configurator.initialize-channel
        input: {port: "= input.port"}
        as: bound
        on_error:
          - title: Bind failed
            source: src/java/org/apache/cassandra/transport/Server.java:142-144
            fail: {code: illegal-state-exception, status: 0, message: "= 'Failed to bind port ' + string(input.port)"}
      - call: server-connection-tracker.set-running
        input: {running: true}
      - return: {started: true}
  - component: transport
    name: stop
    kind: function
    summary: Server.stop clears the running flag and closes every channel.
    sources:
      - src/java/org/apache/cassandra/transport/Server.java:124-128
      - src/java/org/apache/cassandra/transport/Server.java:184-204
    request: {type: object, properties: {force: {type: boolean, default: false}}}
    behavior:
      - call: server-connection-tracker.set-running
        input: {running: false}
      - set: {ctx.channels_closed: true}
  - component: pipeline-configurator
    name: initialize-channel
    kind: io
    summary: Binds the server bootstrap to rpc_address:native_transport_port with the channel initializer.
    sources: [src/java/org/apache/cassandra/transport/PipelineConfigurator.java:129-150]
    request: {type: object, properties: {port: {type: integer, default: 9042}}}
    latency_ms: {min: 1, max: 5}
  - component: pipeline-configurator
    name: configure-initial-pipeline
    kind: function
    summary: "Per accepted channel: connection limit handler (only when a limit is set), idle-state handler (only when native_transport_idle_timeout > 0), envelope encoder, InitialConnectionHandler and exception handler."
    sources: [src/java/org/apache/cassandra/transport/PipelineConfigurator.java:235-274]
    request: {type: object, properties: {client_address: {type: string, default: "10.0.1.5:51234"}}}
    response: {type: object, properties: {accepted: {type: boolean}, idle_timeout_ms: {type: integer}}}
    behavior:
      - call: connection-limit-handler.channel-active
        input: {client_address: "= input.client_address"}
        as: limit
      - if: "!vars.limit.value.accepted"
        then:
          - set: {ctx.connection_closed: true}
          - return: {accepted: false, idle_timeout_ms: "= config['native-transport-idle-timeout-ms']"}
      - call: server-connection-tracker.add-connection
        input: {client_address: "= input.client_address"}
      - set: {state.pipeline: initial, ctx.connection_closed: false, ctx.idle_handler: "= config['native-transport-idle-timeout-ms'] > 0"}
      - return: {accepted: true, idle_timeout_ms: "= config['native-transport-idle-timeout-ms']"}
  - component: pipeline-configurator
    name: configure-modern-pipeline
    kind: function
    summary: "After the STARTUP response is written on a v5+ connection: frame decoder/encoder (lz4 or none), CQLMessageHandler with throwOnOverload from the STARTUP option or native_transport_throw_on_overload, event dispatcher."
    sources: [src/java/org/apache/cassandra/transport/PipelineConfigurator.java:276-345]
    request: {type: object, properties: {options: {type: object}}}
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - set:
          vars.fromOptions: "= has(input.options.THROW_ON_OVERLOAD) && input.options.THROW_ON_OVERLOAD != '' ? input.options.THROW_ON_OVERLOAD : ''"
      - title: THROW_ON_OVERLOAD
        detail: The client's STARTUP option wins; when absent the yaml default native_transport_throw_on_overload (false) applies.
        source: src/java/org/apache/cassandra/transport/PipelineConfigurator.java:309-314
        set:
          state.channel_throw_on_overload: "= vars.fromOptions == '' ? config['native-transport-throw-on-overload'] : vars.fromOptions == '1'"
          state.pipeline: modern
      - call: cql-message-handler.configure
        input: {throw_on_overload: "= state.channel_throw_on_overload"}
      - set: {ctx.pipeline: modern, ctx.throw_on_overload: "= state.channel_throw_on_overload"}
  - component: pipeline-configurator
    name: configure-legacy-pipeline
    kind: function
    summary: "Pre-v5: envelope decoder, decompressor/compressor, message decoder/encoder and the LegacyDispatchHandler; configured before the STARTUP response."
    sources: [src/java/org/apache/cassandra/transport/PipelineConfigurator.java:388-402]
    behavior:
      - set: {state.pipeline: legacy, ctx.pipeline: legacy}
  - component: connection-limit-handler
    name: channel-active
    kind: function
    summary: Count the new channel against the global and per-IP limits; close it when either is exceeded.
    sources:
      - src/java/org/apache/cassandra/transport/ConnectionLimitHandler.java:83-131
      - src/java/org/apache/cassandra/transport/PipelineConfigurator.java:239-245
    request: {type: object, properties: {client_address: {type: string, default: "10.0.1.5:51234"}}}
    response: {type: object, properties: {accepted: {type: boolean}, installed: {type: boolean}}}
    behavior:
      - if: "config['native-transport-max-concurrent-connections'] <= 0 && config['native-transport-max-concurrent-connections-per-ip'] <= 0"
        then:
          - title: Handler not installed
            detail: "Both limits default to -1 (cassandra.yaml leaves them commented), so PipelineConfigurator never adds the handler."
            source: src/java/org/apache/cassandra/transport/PipelineConfigurator.java:240-245
            return: {accepted: true, installed: false}
      - set: {state.connections: "= state.connections + 1"}
      - if: "config['native-transport-max-concurrent-connections'] > 0 && state.connections > config['native-transport-max-concurrent-connections']"
        then:
          - title: Global connection limit exceeded
            source: src/java/org/apache/cassandra/transport/ConnectionLimitHandler.java:93-98
            set: {ctx.connection_limit: global}
          - return: {accepted: false, installed: true}
      - if: "config['native-transport-max-concurrent-connections-per-ip'] > 0"
        then:
          - set: {state.client_ip_connections: "= state.client_ip_connections + 1"}
          - if: "state.client_ip_connections > config['native-transport-max-concurrent-connections-per-ip']"
            then:
              - title: Per-IP connection limit exceeded
                source: src/java/org/apache/cassandra/transport/ConnectionLimitHandler.java:121-127
                set: {ctx.connection_limit: per-ip}
              - return: {accepted: false, installed: true}
      - return: {accepted: true, installed: true}

  # =================================================================== framing
  - component: initial-connection-handler
    name: decode
    kind: function
    summary: Handle the first envelopes on a channel, before the protocol pipeline is configured.
    sources: [src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:67-174]
    request: TransportRoutedRequest
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - call: envelope-decoder.decode
        input: {header: "= input.header", type: "= input.type"}
      - if: "input.type == 'OPTIONS'"
        then:
          - title: OPTIONS answered directly
            detail: The initial handler builds SUPPORTED itself and writes it; the Dispatcher and OptionsMessage.execute are not involved.
            source: src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:78-96
            set: {ctx.options_answered_by: initial-connection-handler}
          - return:
              type: SUPPORTED
              supported:
                CQL_VERSION: ["3.4.7"]
                COMPRESSION: [snappy, lz4]
                PROTOCOL_VERSIONS: [3/v3, 4/v4, 5/v5, 6/v6-beta]
      - if: "input.type == 'STARTUP'"
        then:
          - title: Create the ServerConnection
            source: src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:99-111
            call: server-connection.new-connection
            input: {version: "= input.header.version", client_address: "= input.client_address"}
          - when: "input.header.version < 5"
            title: Legacy pipeline configured before the response
            source: src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:142-150
            call: pipeline-configurator.configure-legacy-pipeline
          - title: STARTUP executes on the event loop
            detail: "Dispatcher.processRequest is called directly with Overload.NONE and immediate RequestTime: no executor hop, no isRunning check, no queue timeout."
            source: src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:152-155
            call: dispatcher.process-request
            input: {type: STARTUP, version: "= input.header.version", backpressure: NONE, queue_time_ms: 0, tracing: false, message: "= input.message"}
            as: resp
            on_error: continue
          - when: "input.header.version >= 5"
            title: Modern pipeline configured once the response is written
            detail: "The listener runs on a successful write, which includes an ERROR response: the v5 pipeline is configured even when STARTUP failed."
            source: src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:114-126
            call: pipeline-configurator.configure-modern-pipeline
            input: {options: "= input.message.options"}
          - if: "!vars.resp.ok"
            then:
              - fail: "= vars.resp.error"
          - return: "= vars.resp.value"
      - set: {ctx.connection_closed: true}
      - title: Anything else before STARTUP
        detail: The error is written and the channel closed, because the connection is in an unusable state.
        source: src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:159-167
        fail: {code: protocol-error, status: 10, message: "= 'Unexpected message ' + input.type + ', expecting STARTUP or OPTIONS'"}
  - component: envelope-decoder
    name: decode
    kind: function
    summary: "Unframed (initial and pre-v5) envelope decoding: protocol version, beta flag, opcode and direction, body length against native_transport_max_frame_size."
    sources: [src/java/org/apache/cassandra/transport/Envelope.java:343-455]
    request: {type: object, required: [header], properties: {header: TransportEnvelopeHeader, type: {type: string}}}
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - call: protocol-version.decode
        input: {version: "= input.header.version"}
      - call: envelope-decoder.decode-flags
        input: {header: "= input.header"}
      - if: "input.header.body_size + 9 > config['native-transport-max-frame-size-bytes']"
        then:
          - title: Frame too long
            detail: "The decoder enters discard mode and fails with a fatal ProtocolException once the body is skipped (native_transport_max_frame_size 16MiB, Config.java:285)."
            source: src/java/org/apache/cassandra/transport/Envelope.java:428-439
            set: {ctx.connection_closed: true}
          - fail: {code: protocol-error, status: 10, message: "= 'Request is too big: length ' + string(input.header.body_size + 9) + ' exceeds maximum allowed length ' + string(int(config['native-transport-max-frame-size-bytes']))"}
      - return: {version: "= input.header.version"}
  - component: envelope-decoder
    name: extract-header
    kind: function
    summary: Framed (v5+) header extraction inside CQLMessageHandler. Never throws; returns a failed result carrying the ProtocolException, stream id and body length.
    sources: [src/java/org/apache/cassandra/transport/Envelope.java:221-266]
    request: {type: object, required: [header], properties: {header: TransportEnvelopeHeader}}
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - if: "input.header.body_size < 0"
        then:
          - source: src/java/org/apache/cassandra/transport/Envelope.java:237-239
            fail: {code: protocol-error, status: 10, message: "= 'Invalid value for envelope header body length field: ' + string(input.header.body_size)"}
      - call: protocol-version.decode
        input: {version: "= input.header.version"}
      - call: envelope-decoder.decode-flags
        input: {header: "= input.header"}
      - return: {version: "= input.header.version"}
  - component: envelope-decoder
    name: decode-flags
    kind: function
    summary: A beta protocol version (V6) must carry the USE_BETA flag.
    sources: [src/java/org/apache/cassandra/transport/Envelope.java:457-466]
    request: {type: object, required: [header], properties: {header: TransportEnvelopeHeader}}
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - if: "input.header.version == 6 && !input.header.use_beta"
        then:
          - fail: {code: protocol-error, status: 10, message: "Beta version of the protocol used (6/v6-beta), but USE_BETA flag is unset"}
  - component: protocol-version
    name: decode
    kind: function
    summary: Map the version byte to a supported ProtocolVersion or refuse it.
    sources:
      - src/java/org/apache/cassandra/transport/ProtocolVersion.java:102-132
      - src/java/org/apache/cassandra/transport/ProtocolVersion.java:42-47
    request: {type: object, required: [version], properties: {version: {type: integer, default: 5}}}
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - if: "input.version == 1 || input.version == 2"
        then:
          - title: Unsupported old version
            detail: The error carries forcedProtocolVersion, so it is encoded with the client's own version and the driver can downgrade.
            source: src/java/org/apache/cassandra/transport/ProtocolVersion.java:110-117
            set: {ctx.forced_protocol_version: "= input.version"}
          - fail: {code: protocol-error, status: 10, message: "= 'Invalid or unsupported protocol version (' + string(input.version) + '); supported versions are (3/v3, 4/v4, 5/v5, 6/v6-beta)'"}
      - if: "input.version == 65 || input.version == 66"
        then:
          - title: DSE protocol version
            detail: Refused with a silent ProtocolException (not counted or logged as a protocol error).
            source: src/java/org/apache/cassandra/transport/ProtocolVersion.java:118-122
            fail: {code: protocol-error, status: 10, message: "= 'Invalid or unsupported protocol version (' + string(input.version) + '); supported versions are (3/v3, 4/v4, 5/v5, 6/v6-beta)'"}
      - if: "input.version < 3 || input.version > 6"
        then:
          - source: src/java/org/apache/cassandra/transport/ProtocolVersion.java:124-125
            fail: {code: protocol-error, status: 10, message: "= 'Invalid or unsupported protocol version (' + string(input.version) + '); supported versions are (3/v3, 4/v4, 5/v5, 6/v6-beta)'"}
      - if: "!config['native-transport-allow-older-protocols'] && input.version < 5"
        then:
          - title: Older protocols disallowed
            detail: "native_transport_allow_older_protocols is true in cassandra.yaml:1056, so V3 and V4 are accepted on the deployed node."
            source: src/java/org/apache/cassandra/transport/ProtocolVersion.java:128-129
            fail: {code: protocol-error, status: 10, message: "= 'Rejecting Protocol Version ' + string(input.version) + ' < 5/v5.'"}
      - return: {version: "= input.version"}

  # =================================================================== admission (v5 and legacy)
  - component: cql-message-handler
    name: configure
    kind: function
    summary: The CQLMessageHandler is constructed per connection with its throwOnOverload flag.
    sources: [src/java/org/apache/cassandra/transport/CQLMessageHandler.java:116-150]
    request: {type: object, properties: {throw_on_overload: {type: boolean, default: false}}}
    behavior:
      - set: {state.throw_on_overload: "= input.throw_on_overload"}
  - component: cql-message-handler
    name: process-one-contained-message
    kind: function
    summary: "Admission for one envelope inside a v5 frame: header checks, bytes-in-flight, rate limit and queue age; throw or apply backpressure."
    sources: [src/java/org/apache/cassandra/transport/CQLMessageHandler.java:177-265]
    request: TransportRoutedRequest
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}, {code: overloaded, status: 4097}, {code: invalid, status: 8704}]
    behavior:
      - call: envelope-decoder.extract-header
        input: {header: "= input.header"}
        as: hdr
        on_error:
          - title: Header error
            detail: "The first error in a frame is not fatal: the error is sent on the stream and the body skipped. More than consecutive_message_errors_threshold (1) errors in one frame turn fatal and close the connection."
            source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:330-362
            set: {ctx.connection_closed: false}
          - fail: "= error"
      - if: "input.header.version != input.connection_version"
        then:
          - source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:186-192
            fail: {code: protocol-error, status: 10, message: "= 'Invalid message version. Got ' + string(input.header.version) + ' but previous messages on this connection had version ' + string(input.connection_version)"}
      - if: "input.header.body_size > config['native-transport-max-message-size-bytes']"
        then:
          - title: Message larger than native_transport_max_message_size
            detail: "Only possible for a multi-frame (large) message; it is consumed and discarded. Multi-frame messages before READY are refused fatally instead."
            source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:537-556
            set: {ctx.request_discarded: true}
          - fail: {code: invalid, status: 8704, message: "= 'CQL Message of size ' + string(input.header.body_size) + ' bytes exceeds allowed maximum of ' + string(int(config['native-transport-max-message-size-bytes'])) + ' bytes'"}
      - set: {vars.backpressure: NONE, vars.delay: -1}
      - if: "state.throw_on_overload"
        then:
          - call: client-resource-limits.try-allocate
            input: {bytes: "= input.header.body_size", force: false}
            as: alloc
          - if: "vars.alloc.value.outcome != 'SUCCESS'"
            then:
              - title: Discard and throw (bytes in flight)
                source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:198-204
                set: {ctx.request_discarded: true, ctx.overload: BYTES_IN_FLIGHT}
              - fail: {code: overloaded, status: 4097, message: "Request breached limit on bytes in flight. Server is currently in an overloaded state and cannot accept more requests."}
          - call: client-resource-limits.try-reserve
            as: permit
          - call: dispatcher.has-queue-capacity
            as: queue
          - set:
              vars.backpressure: "= vars.permit.value.enabled && !vars.permit.value.granted ? 'REQUESTS' : (!vars.queue.value.has_capacity ? 'QUEUE_TIME' : 'NONE')"
          - if: "vars.backpressure != 'NONE'"
            then:
              - title: Discard and throw (rate or queue)
                detail: The bytes already allocated are released before the error is sent; the connection keeps reading.
                source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:206-217
                call: client-resource-limits.release
                input: {bytes: "= input.header.body_size"}
              - set: {ctx.request_discarded: true, ctx.overload: "= vars.backpressure"}
              - fail: {code: overloaded, status: 4097, message: "= vars.backpressure == 'REQUESTS' ? 'Request breached global limit of ' + string(vars.permit.value.rate) + ' requests/second. Server is currently in an overloaded state and cannot accept more requests.' : 'Request has spent over the maximum queue age threshold of native_transport_timeout in the queue'"}
        else:
          - call: client-resource-limits.try-allocate
            input: {bytes: "= input.header.body_size", force: true}
            as: alloc
          - when: "vars.alloc.value.outcome != 'SUCCESS'"
            title: Bytes in flight over limit
            detail: The capacity is taken anyway (queued on the endpoint wait queue) and the request is processed; the decoder stops reading.
            source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:223-224
            set: {vars.backpressure: BYTES_IN_FLIGHT}
          - call: client-resource-limits.reserve-and-get-delay
            as: rate
          - when: "vars.rate.value.enabled"
            set:
              vars.delay: "= vars.rate.value.delay_ms"
              vars.backpressure: "= vars.backpressure == 'NONE' && vars.rate.value.delay_ms > 0 ? 'REQUESTS' : vars.backpressure"
          - when: "vars.backpressure == 'NONE'"
            call: dispatcher.has-queue-capacity
            as: queue
          - when: "vars.backpressure == 'NONE' && !vars.queue.value.has_capacity"
            call: dispatcher.mark-and-get-delay
            as: qdelay
          - when: "vars.backpressure == 'NONE' && !vars.queue.value.has_capacity && vars.qdelay.value.delay_ms > 0"
            set: {vars.backpressure: QUEUE_TIME, vars.delay: "= vars.qdelay.value.delay_ms"}
          - when: "vars.backpressure != 'NONE'"
            title: Backpressure instead of rejection
            detail: "The request is still processed; the frame decoder is paused and, when there is a delay, a wakeup task reactivates it later."
            source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:245-261
            set: {ctx.connection_paused: true, ctx.backpressure: "= vars.backpressure", ctx.wakeup_delay_ms: "= vars.delay"}
      - call: cql-message-handler.process-request
        input: {type: "= input.type", version: "= input.connection_version", backpressure: "= vars.backpressure", queue_time_ms: "= input.queue_time_ms", tracing: "= input.header.tracing", message: "= input.message"}
        as: r
      - return: "= vars.r.value"
  - component: cql-message-handler
    name: process-request
    kind: function
    summary: Decode the CQL message body and hand it to the Dispatcher; a decode error is sent on the stream and capacity released.
    sources: [src/java/org/apache/cassandra/transport/CQLMessageHandler.java:385-421]
    request: TransportDispatchRequest
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - when: "input.type == 'BATCH'"
        title: Body decode
        detail: Message.Decoder runs the opcode's codec; BATCH is the codec with validation that can fail.
        source: src/java/org/apache/cassandra/transport/CQLMessageHandler.java:390
        call: batch-message.decode
        input: {batch_type: "= input.message.batch_type", queries: "= input.message.queries"}
      - call: dispatcher.dispatch
        input: "= input"
        as: r
      - return: "= vars.r.value"
  - component: pre-v5-handlers-legacy-dispatch-handler
    name: channel-read0
    kind: function
    summary: "Pre-v5: envelope decode, checkLimits, then dispatch with the connection's current backpressure state."
    sources: [src/java/org/apache/cassandra/transport/PreV5Handlers.java:82-88]
    request: TransportRoutedRequest
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}, {code: overloaded, status: 4097}]
    behavior:
      - call: envelope-decoder.decode
        input: {header: "= input.header", type: "= input.type"}
      - when: "input.type == 'BATCH'"
        call: batch-message.decode
        input: {batch_type: "= input.message.batch_type", queries: "= input.message.queries"}
      - call: pre-v5-handlers-legacy-dispatch-handler.check-limits
        input: {body_size: "= input.header.body_size"}
        as: limits
      - call: dispatcher.dispatch
        input: {type: "= input.type", version: "= input.connection_version", backpressure: "= vars.limits.value.backpressure", queue_time_ms: "= input.queue_time_ms", tracing: "= input.header.tracing", message: "= input.message"}
        as: r
      - return: "= vars.r.value"
  - component: pre-v5-handlers-legacy-dispatch-handler
    name: check-limits
    kind: function
    summary: Pre-v5 overload checks. With THROW_ON_OVERLOAD the request is dropped with OverloadedException; otherwise autoRead is turned off.
    sources: [src/java/org/apache/cassandra/transport/PreV5Handlers.java:151-218]
    request: {type: object, properties: {body_size: {type: integer, default: 96}}}
    response: {type: object, properties: {backpressure: {type: string}}}
    errors: [{code: overloaded, status: 4097}]
    behavior:
      - call: server-connection.is-throw-on-overload
        as: tho
      - if: "vars.tho.value.throw_on_overload"
        then:
          - call: client-resource-limits.try-allocate
            input: {bytes: "= input.body_size", force: false}
            as: alloc
          - if: "vars.alloc.value.outcome != 'SUCCESS'"
            then:
              - source: src/java/org/apache/cassandra/transport/PreV5Handlers.java:157-160
                set: {ctx.request_discarded: true, ctx.overload: BYTES_IN_FLIGHT}
              - fail: {code: overloaded, status: 4097, message: "Request breached limit on bytes in flight. Server is currently in an overloaded state and cannot accept more requests."}
          - call: client-resource-limits.try-reserve
            as: permit
          - call: dispatcher.has-queue-capacity
            as: queue
          - set: {vars.bp: "= vars.permit.value.enabled && !vars.permit.value.granted ? 'REQUESTS' : (!vars.queue.value.has_capacity ? 'QUEUE_TIME' : 'NONE')"}
          - if: "vars.bp != 'NONE'"
            then:
              - source: src/java/org/apache/cassandra/transport/PreV5Handlers.java:162-173
                call: client-resource-limits.release
                input: {bytes: "= input.body_size"}
              - set: {ctx.request_discarded: true, ctx.overload: "= vars.bp"}
              - fail: {code: overloaded, status: 4097, message: "= 'Request overloaded: ' + vars.bp"}
          - return: {backpressure: NONE}
      - set: {vars.bp: NONE}
      - call: client-resource-limits.try-allocate
        input: {bytes: "= input.body_size", force: true}
        as: alloc
      - when: "vars.alloc.value.outcome != 'SUCCESS'"
        title: Pause on bytes in flight
        source: src/java/org/apache/cassandra/transport/PreV5Handlers.java:182-187
        set: {vars.bp: BYTES_IN_FLIGHT, ctx.connection_paused: true}
      - call: client-resource-limits.reserve-and-get-delay
        as: rate
      - when: "vars.rate.value.enabled && vars.bp == 'NONE' && vars.rate.value.delay_ms > 0"
        set: {vars.bp: REQUESTS, ctx.connection_paused: true, ctx.wakeup_delay_ms: "= vars.rate.value.delay_ms"}
      - when: "vars.bp == 'NONE'"
        call: dispatcher.has-queue-capacity
        as: queue
      - when: "vars.bp == 'NONE' && !vars.queue.value.has_capacity"
        call: dispatcher.mark-and-get-delay
        as: qdelay
      - when: "vars.bp == 'NONE' && !vars.queue.value.has_capacity && vars.qdelay.value.delay_ms > 0"
        source: src/java/org/apache/cassandra/transport/PreV5Handlers.java:201-216
        set: {vars.bp: QUEUE_TIME, ctx.connection_paused: true, ctx.wakeup_delay_ms: "= vars.qdelay.value.delay_ms"}
      - set: {ctx.backpressure: "= vars.bp"}
      - return: {backpressure: "= vars.bp"}
  - component: client-resource-limits
    name: try-allocate
    kind: function
    summary: "Allocate request bytes against the endpoint reserve (native_transport_max_request_data_in_flight_per_ip) and the global reserve (native_transport_max_request_data_in_flight); force=true allocates even past the limits."
    sources:
      - src/java/org/apache/cassandra/transport/ClientResourceLimits.java:190-210
      - src/java/org/apache/cassandra/config/DatabaseDescriptor.java:649-656
    request: {type: object, properties: {bytes: {type: integer, default: 96}, force: {type: boolean, default: false}}}
    response: {type: object, properties: {outcome: {type: string, enum: [SUCCESS, INSUFFICIENT_ENDPOINT, INSUFFICIENT_GLOBAL]}}}
    behavior:
      - set:
          vars.outcome: "= state.endpoint_in_flight_bytes + input.bytes > config['native-transport-max-request-data-in-flight-per-ip-bytes'] ? 'INSUFFICIENT_ENDPOINT' : (state.global_in_flight_bytes + input.bytes > config['native-transport-max-request-data-in-flight-bytes'] ? 'INSUFFICIENT_GLOBAL' : 'SUCCESS')"
      - when: "vars.outcome == 'SUCCESS' || input.force"
        set:
          state.endpoint_in_flight_bytes: "= state.endpoint_in_flight_bytes + input.bytes"
          state.global_in_flight_bytes: "= state.global_in_flight_bytes + input.bytes"
      - return: {outcome: "= vars.outcome"}
  - component: client-resource-limits
    name: release
    kind: function
    summary: Return request bytes to both reserves.
    sources: [src/java/org/apache/cassandra/transport/ClientResourceLimits.java:215-218]
    request: {type: object, properties: {bytes: {type: integer, default: 96}}}
    behavior:
      - set:
          state.endpoint_in_flight_bytes: "= state.endpoint_in_flight_bytes - input.bytes"
          state.global_in_flight_bytes: "= state.global_in_flight_bytes - input.bytes"
  - component: client-resource-limits
    name: try-reserve
    kind: function
    summary: "GLOBAL_REQUEST_LIMITER.tryReserve, used with THROW_ON_OVERLOAD: a permit now or nothing. Only consulted when native_transport_rate_limiting_enabled (false by default)."
    sources:
      - src/java/org/apache/cassandra/transport/ClientResourceLimits.java:46
      - src/java/org/apache/cassandra/transport/CQLMessageHandler.java:206-207
    response: {type: object, properties: {enabled: {type: boolean}, granted: {type: boolean}, rate: {type: integer}}}
    behavior:
      - return: {enabled: "= config['native-transport-rate-limiting-enabled']", granted: "= !config['native-transport-rate-limiting-enabled'] || state.permit_available", rate: "= int(config['native-transport-max-requests-per-second'])"}
  - component: client-resource-limits
    name: reserve-and-get-delay
    kind: function
    summary: GLOBAL_REQUEST_LIMITER.reserveAndGetDelay, used without THROW_ON_OVERLOAD. The permit is always reserved; a positive delay means backpressure.
    sources:
      - src/java/org/apache/cassandra/transport/ClientResourceLimits.java:46
      - src/java/org/apache/cassandra/transport/CQLMessageHandler.java:226-234
    response: {type: object, properties: {enabled: {type: boolean}, delay_ms: {type: integer}}}
    behavior:
      - return: {enabled: "= config['native-transport-rate-limiting-enabled']", delay_ms: "= config['native-transport-rate-limiting-enabled'] && !state.permit_available ? state.permit_delay_ms : 0"}

  # =================================================================== dispatch
  - component: dispatcher
    name: dispatch
    kind: queue
    summary: Refuse when the server is stopping, pick the executor, submit a RequestProcessor.
    sources:
      - src/java/org/apache/cassandra/transport/Dispatcher.java:102-127
      - src/java/org/apache/cassandra/transport/Dispatcher.java:303-308
    request: TransportDispatchRequest
    response: TransportResponse
    errors: [{code: overloaded, status: 4097}]
    behavior:
      - call: server-connection-tracker.is-running
        as: running
      - if: "!vars.running.value.running"
        then:
          - title: Server is shutting down
            detail: "OverloadedException is used because clients would defunct the connection on any other error code."
            source: src/java/org/apache/cassandra/transport/Dispatcher.java:105-116
            set: {ctx.shutting_down: true}
          - fail: {code: overloaded, status: 4097, message: Server is shutting down}
      - title: Executor
        detail: "AUTH_RESPONSE and CREDENTIALS go to Native-Transport-Auth-Requests (native_transport_max_auth_threads 4) so bcrypt cannot starve normal requests; everything else to Native-Transport-Requests (native_transport_max_threads 128)."
        source: src/java/org/apache/cassandra/transport/Dispatcher.java:118-125
        set:
          ctx.executor: "= config['native-transport-max-auth-threads'] > 0 && (input.type == 'AUTH_RESPONSE' || input.type == 'CREDENTIALS') ? 'Native-Transport-Auth-Requests' : 'Native-Transport-Requests'"
      - title: Submit a RequestProcessor
        detail: "The request waits for a free worker of the chosen executor (capacity); the time it waits is added to its queue time."
        source: src/java/org/apache/cassandra/transport/Dispatcher.java:125
        call: "= ctx.executor == 'Native-Transport-Auth-Requests' ? 'dispatcher-auth-executor.run' : 'dispatcher-request-executor.run'"
        targets: [dispatcher-auth-executor.run, dispatcher-request-executor.run]
        input:
          type: "= input.type"
          version: "= input.version"
          backpressure: "= input.backpressure"
          queue_time_ms: "= input.queue_time_ms"
          tracing: "= input.tracing"
          message: "= input.message"
          enqueued_at_ms: "= now"
        as: r
      - return: "= vars.r.value"
  - component: dispatcher-request-executor
    name: run
    kind: function
    summary: "RequestProcessor.run on a Native-Transport-Requests worker: the request's queue time is the wait for this worker plus any earlier queueing; then processRequest."
    sources: [src/java/org/apache/cassandra/transport/Dispatcher.java:303-308]
    request:
      type: object
      required: [type]
      properties:
        type: {type: string}
        version: {type: integer, default: 5}
        backpressure: {type: string, default: NONE}
        queue_time_ms: {type: integer, default: 0}
        tracing: {type: boolean, default: false}
        message: {type: object}
        enqueued_at_ms: {type: integer, default: 0}
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - set: {vars.waited: "= now - input.enqueued_at_ms"}
      - set: {ctx.executor_wait_ms: "= vars.waited"}
      - call: dispatcher.process-request
        input: {type: "= input.type", version: "= input.version", backpressure: "= input.backpressure", queue_time_ms: "= input.queue_time_ms + vars.waited", tracing: "= input.tracing", message: "= input.message"}
        as: r
      - return: "= vars.r.value"
  - component: dispatcher-auth-executor
    name: run
    kind: function
    summary: "RequestProcessor.run on a Native-Transport-Auth-Requests worker: the request's queue time is the wait for this worker plus any earlier queueing; then processRequest."
    sources: [src/java/org/apache/cassandra/transport/Dispatcher.java:303-308]
    request:
      type: object
      required: [type]
      properties:
        type: {type: string}
        version: {type: integer, default: 5}
        backpressure: {type: string, default: NONE}
        queue_time_ms: {type: integer, default: 0}
        tracing: {type: boolean, default: false}
        message: {type: object}
        enqueued_at_ms: {type: integer, default: 0}
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - set: {vars.waited: "= now - input.enqueued_at_ms"}
      - set: {ctx.executor_wait_ms: "= vars.waited"}
      - call: dispatcher.process-request
        input: {type: "= input.type", version: "= input.version", backpressure: "= input.backpressure", queue_time_ms: "= input.queue_time_ms + vars.waited", tracing: "= input.tracing", message: "= input.message"}
        as: r
      - return: "= vars.r.value"
  - component: dispatcher
    name: has-queue-capacity
    kind: function
    summary: "True unless the oldest queued request has waited longer than native_transport_timeout x native_transport_queue_max_item_age_threshold (Double.MAX_VALUE by default, so always true)."
    sources: [src/java/org/apache/cassandra/transport/Dispatcher.java:341-349]
    response: {type: object, properties: {has_capacity: {type: boolean}}}
    behavior:
      - return:
          has_capacity: "= config['native-transport-queue-max-item-age-threshold'] <= 0.0 || double(state.oldest_task_queue_ms) < double(int(config['native-transport-timeout-ms'])) * config['native-transport-queue-max-item-age-threshold']"
  - component: dispatcher
    name: mark-and-get-delay
    kind: function
    summary: "QueueBackpressure.DEFAULT: each incident raises severity; delay = min(max_backoff 200ms, severity x min_backoff 10ms)."
    sources:
      - src/java/org/apache/cassandra/transport/QueueBackpressure.java:51-60
      - src/java/org/apache/cassandra/transport/QueueBackpressure.java:121-124
    response: {type: object, properties: {delay_ms: {type: integer}}}
    behavior:
      - set: {state.queue_backpressure_severity: "= state.queue_backpressure_severity == 0 ? 1 : state.queue_backpressure_severity"}
      - return:
          delay_ms: "= state.queue_backpressure_severity * config['native-transport-min-backoff-on-queue-overload-ms'] < config['native-transport-max-backoff-on-queue-overload-ms'] ? state.queue_backpressure_severity * config['native-transport-min-backoff-on-queue-overload-ms'] : config['native-transport-max-backoff-on-queue-overload-ms']"
  - component: dispatcher
    name: process-request
    kind: function
    summary: "Run one request: queue-timeout check, warnings capture, backpressure warning, connection stage check, execute, stage transition, attach warnings."
    sources:
      - src/java/org/apache/cassandra/transport/Dispatcher.java:355-424
      - src/java/org/apache/cassandra/transport/Dispatcher.java:429-454
    request: TransportDispatchRequest
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - if: "input.queue_time_ms > config['native-transport-timeout-ms']"
        then:
          - title: Timed out in the queue
            detail: "A request that waited longer than native_transport_timeout (12s, Config.java:1399) is refused before it starts, whatever its type."
            source: src/java/org/apache/cassandra/transport/Dispatcher.java:359-368
            set: {ctx.timed_out_before_processing: true}
          - fail: {code: overloaded, status: 4097, message: Query timed out before it could start}
      - when: "input.version >= 4"
        source: src/java/org/apache/cassandra/transport/Dispatcher.java:370-371
        call: client-warn.capture-warnings
      - when: "input.backpressure != 'NONE'"
        title: Backpressure warning
        source: src/java/org/apache/cassandra/transport/Dispatcher.java:378-410
        call: client-warn.warn
        input:
          text: "= input.backpressure == 'REQUESTS' ? 'Request breached global limit of 1000000 requests/second and triggered backpressure.' : (input.backpressure == 'BYTES_IN_FLIGHT' ? 'Request breached limit(s) on bytes in flight and triggered backpressure.' : 'Request has spent over the queue max item age threshold of the maximum timeout 12000ms in the queue')"
      - call: server-connection.validate-new-message
        input: {type: "= input.type", version: "= input.version"}
      - call: message-request.execute
        input: {type: "= input.type", version: "= input.version", tracing: "= input.tracing", message: "= input.message"}
        as: resp
        on_error:
          - title: Exception to ERROR response
            source: src/java/org/apache/cassandra/transport/Dispatcher.java:436-445
            call: error-message.from-exception
            input: {code: "= error.code", status: "= has(error.status) && error.status != null ? error.status : 0", message: "= error.message", version: "= input.version"}
            as: mapped
          - call: client-warn.reset-warnings
          - fail: "= vars.mapped.value"
      - call: server-connection.apply-state-transition
        input: {request_type: "= input.type", response_type: "= vars.resp.value.type"}
      - call: client-warn.get-warnings
        as: warns
      - call: client-warn.reset-warnings
      - set: {vars.out: "= vars.resp.value"}
      - when: "size(vars.warns.value.warnings) > 0"
        set: {vars.out.warnings: "= vars.warns.value.warnings", ctx.response_warnings: "= vars.warns.value.warnings"}
      - set: {ctx.response_type: "= vars.out.type"}
      - return: "= vars.out"
  - component: dispatcher
    name: event-dispatcher
    kind: event
    summary: "v5+ channels: an EventMessage is encoded with stream id -1 and flushed through the channel's Flusher like a response."
    sources: [src/java/org/apache/cassandra/transport/Dispatcher.java:507-517]
    request: TransportEventDelivery
    behavior:
      - call: cql-client.event-message
        input: "= input"

  # =================================================================== connection and session
  - component: server-connection
    name: new-connection
    kind: function
    summary: A ServerConnection starts ESTABLISHED with a fresh external ClientState.
    sources:
      - src/java/org/apache/cassandra/transport/ServerConnection.java:43-49
      - src/java/org/apache/cassandra/transport/Connection.java:34-41
    request: {type: object, properties: {version: {type: integer, default: 5}, client_address: {type: string, default: "10.0.1.5:51234"}}}
    behavior:
      - set: {state.stage: ESTABLISHED, state.version: "= input.version", state.sasl_negotiator: false}
      - call: client-state.for-external-calls
        input: {client_address: "= input.client_address"}
  - component: server-connection
    name: validate-new-message
    kind: function
    summary: The stage gate. ESTABLISHED accepts only STARTUP and OPTIONS, AUTHENTICATING only AUTH_RESPONSE/CREDENTIALS, READY anything but STARTUP.
    sources: [src/java/org/apache/cassandra/transport/ServerConnection.java:61-83]
    request: {type: object, required: [type], properties: {type: {type: string}, version: {type: integer}}}
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - if: "state.stage == 'ESTABLISHED' && input.type != 'STARTUP' && input.type != 'OPTIONS'"
        then:
          - fail: {code: protocol-error, status: 10, message: "= 'Unexpected message ' + input.type + ', expecting STARTUP or OPTIONS'"}
      - if: "state.stage == 'AUTHENTICATING' && input.type != 'AUTH_RESPONSE' && input.type != 'CREDENTIALS'"
        then:
          - fail: {code: protocol-error, status: 10, message: "= 'Unexpected message ' + input.type + ', expecting SASL_RESPONSE'"}
      - if: "state.stage == 'READY' && input.type == 'STARTUP'"
        then:
          - fail: {code: protocol-error, status: 10, message: "Unexpected message STARTUP, the connection is already initialized"}
      - return: {stage: "= state.stage"}
  - component: server-connection
    name: apply-state-transition
    kind: function
    summary: "STARTUP answered AUTHENTICATE goes to AUTHENTICATING, answered READY goes to READY; AUTH_RESPONSE answered AUTH_SUCCESS (or READY) goes to READY and drops the negotiator."
    sources: [src/java/org/apache/cassandra/transport/ServerConnection.java:85-114]
    request: {type: object, properties: {request_type: {type: string}, response_type: {type: string}}}
    behavior:
      - if: "state.stage == 'ESTABLISHED' && input.request_type == 'STARTUP'"
        then:
          - set: {state.stage: "= input.response_type == 'AUTHENTICATE' ? 'AUTHENTICATING' : (input.response_type == 'READY' ? 'READY' : state.stage)"}
      - if: "state.stage == 'AUTHENTICATING' && (input.response_type == 'READY' || input.response_type == 'AUTH_SUCCESS')"
        then:
          - set: {state.stage: READY, state.sasl_negotiator: false}
      - set: {ctx.stage: "= state.stage"}
  - component: server-connection
    name: get-sasl-negotiator
    kind: function
    summary: Lazily create the authenticator's SASL negotiator for this connection (with the client's TLS certificates when present).
    sources: [src/java/org/apache/cassandra/transport/ServerConnection.java:116-122]
    behavior:
      - when: "!state.sasl_negotiator"
        call: password-authenticator.new-sasl-negotiator
      - set: {state.sasl_negotiator: true}
  - component: server-connection
    name: is-throw-on-overload
    kind: function
    summary: "Pre-v5 connections hold throwOnOverload as set by StartupMessage from the THROW_ON_OVERLOAD option only."
    sources:
      - src/java/org/apache/cassandra/transport/Connection.java:53-61
      - src/java/org/apache/cassandra/transport/messages/StartupMessage.java:111
    response: {type: object, properties: {throw_on_overload: {type: boolean}}}
    behavior:
      - call: pipeline-configurator.get-channel-throw-on-overload
        as: t
      - return: {throw_on_overload: "= vars.t.value.throw_on_overload"}
  - component: pipeline-configurator
    name: get-channel-throw-on-overload
    kind: function
    summary: The throw-on-overload flag in force for the modeled channel.
    sources: [src/java/org/apache/cassandra/transport/Connection.java:58-61]
    response: {type: object, properties: {throw_on_overload: {type: boolean}}}
    behavior:
      - return: {throw_on_overload: "= state.channel_throw_on_overload"}
  - component: pipeline-configurator
    name: set-channel-throw-on-overload
    kind: function
    summary: StartupMessage sets the connection's throwOnOverload from the THROW_ON_OVERLOAD option ("1" means true; no yaml fallback here).
    sources: [src/java/org/apache/cassandra/transport/messages/StartupMessage.java:111]
    request: {type: object, properties: {throw_on_overload: {type: boolean, default: false}}}
    behavior:
      - set: {state.channel_throw_on_overload: "= input.throw_on_overload"}
  - component: client-state
    name: for-external-calls
    kind: function
    summary: "A native-protocol ClientState. When the authenticator does not require authentication (AllowAllAuthenticator, deployed) the user is ANONYMOUS from the start; otherwise nobody is logged in."
    sources:
      - src/java/org/apache/cassandra/service/ClientState.java:208-211
      - src/java/org/apache/cassandra/service/ClientState.java:171-177
    request: {type: object, properties: {client_address: {type: string, default: "10.0.1.5:51234"}}}
    behavior:
      - call: auth-config.get-backends
        as: be
      - set:
          state.user: "= vars.be.value.require_authentication ? '' : 'anonymous'"
          state.keyspace: ""
          state.issued_prepared_statements_use_warning: false
  - component: client-state
    name: set-client-options
    kind: function
    summary: Record the STARTUP options and the driver name and version (visible in system_views.clients).
    sources:
      - src/java/org/apache/cassandra/service/ClientState.java:323-336
    request: {type: object, properties: {driver_name: {type: string}, driver_version: {type: string}}}
    behavior:
      - set: {state.driver_name: "= input.driver_name", state.driver_version: "= input.driver_version"}
  - component: client-state
    name: login
    kind: function
    summary: Accept the authenticated user if anonymous or allowed to log in (role LOGIN); otherwise AuthenticationException.
    sources: [src/java/org/apache/cassandra/service/ClientState.java:377-395]
    request: {type: object, properties: {user: {type: string, default: alice}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - if: "input.user == 'anonymous'"
        then:
          - set: {state.user: anonymous}
          - return: {user: anonymous}
      - call: authenticated-user.can-login
        input: {user: "= input.user"}
        as: can
        on_error:
          - source: src/java/org/apache/cassandra/service/ClientState.java:391-394
            fail: {code: bad-credentials, status: 256, message: "= 'Unable to perform authentication: ' + error.message"}
      - if: "!vars.can.value.can_login"
        then:
          - source: src/java/org/apache/cassandra/service/ClientState.java:381-382
            fail: {code: bad-credentials, status: 256, message: "= input.user + ' is not permitted to log in'"}
      - set: {state.user: "= input.user"}
      - return: {user: "= input.user"}
  - component: client-state
    name: get-raw-keyspace
    kind: function
    summary: The session keyspace, or none ("" here, null in code).
    sources: [src/java/org/apache/cassandra/service/ClientState.java:353-356]
    response: {type: object, properties: {keyspace: {type: string}}}
    behavior:
      - return: {keyspace: "= state.keyspace"}
  - component: client-state
    name: set-keyspace
    kind: function
    summary: "USE <keyspace>: validated against the schema only once a user is set (anonymous counts)."
    sources: [src/java/org/apache/cassandra/service/ClientState.java:365-372]
    request: {type: object, required: [keyspace], properties: {keyspace: {type: string, examples: [shop]}}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - if: "state.user != ''"
        then:
          - call: schema.get-keyspace-metadata
            input: {keyspace: "= input.keyspace"}
            as: ks
          - if: "!vars.ks.value.exists"
            then:
              - fail: {code: invalid, status: 8704, message: "= 'Keyspace \\'' + input.keyspace + '\\' does not exist'"}
      - set: {state.keyspace: "= input.keyspace", ctx.session_keyspace: "= input.keyspace"}
      - return: {keyspace: "= input.keyspace"}
  - component: client-state
    name: clone-with-keyspace-if-set
    kind: function
    summary: PREPARE (v5 keyspace flag) and BATCH (options keyspace) work on a copy of the ClientState with that keyspace; the session keyspace is untouched.
    sources: [src/java/org/apache/cassandra/service/ClientState.java:220-227]
    request: {type: object, properties: {keyspace: {type: string, default: ""}}}
    response: {type: object, properties: {keyspace: {type: string}}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - if: "input.keyspace == ''"
        then:
          - return: {keyspace: "= state.keyspace"}
      - if: "state.user != ''"
        then:
          - call: schema.get-keyspace-metadata
            input: {keyspace: "= input.keyspace"}
            as: ks
          - if: "!vars.ks.value.exists"
            then:
              - source: src/java/org/apache/cassandra/service/ClientState.java:369-370
                fail: {code: invalid, status: 8704, message: "= 'Keyspace \\'' + input.keyspace + '\\' does not exist'"}
      - return: {keyspace: "= input.keyspace"}
  - component: client-state
    name: validate-login
    kind: function
    summary: A user must be set, have access to this datacenter and to the client IP.
    sources: [src/java/org/apache/cassandra/service/ClientState.java:565-580]
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - if: "state.user == ''"
        then:
          - fail: {code: unauthorized, status: 8448, message: You have not logged in}
      - return: {user: "= state.user"}
  - component: client-state
    name: ensure-not-anonymous
    kind: function
    summary: "validateLogin, then refuse the anonymous user (DDL on roles, GRANT, LIST and similar)."
    sources: [src/java/org/apache/cassandra/service/ClientState.java:582-587]
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.validate-login
      - if: "state.user == 'anonymous'"
        then:
          - title: Anonymous user refused
            detail: "Under the deployed AllowAllAuthenticator every connection is anonymous, so these statements always fail."
            source: src/java/org/apache/cassandra/service/ClientState.java:585-586
            fail: {code: unauthorized, status: 8448, message: You have to be logged in and not anonymous to perform this request}
      - return: {user: "= state.user"}
  - component: client-state
    name: get-user
    kind: function
    summary: "The session user, whether it is anonymous, and isSuper: true whenever the authenticator does not require authentication (AllowAllAuthenticator, deployed), else the user's superuser status."
    sources:
      - src/java/org/apache/cassandra/service/ClientState.java:641-644
      - src/java/org/apache/cassandra/service/ClientState.java:602-605
    response: {type: object, properties: {user: {type: string}, is_anonymous: {type: boolean}, is_super: {type: boolean}}}
    behavior:
      - call: auth-config.get-backends
        as: be
      - if: "!vars.be.value.require_authentication"
        then:
          - return: {user: "= state.user", is_anonymous: "= state.user == 'anonymous'", is_super: true}
      - if: "state.user == '' || state.user == 'anonymous'"
        then:
          - return: {user: "= state.user", is_anonymous: "= state.user == 'anonymous'", is_super: false}
      - call: authenticated-user.is-super
        input: {user: "= state.user"}
        as: sup
      - return: {user: "= state.user", is_anonymous: false, is_super: "= vars.sup.value.is_super"}
  - component: client-state
    name: ensure-table-permission
    kind: function
    summary: "Permission check that CQL statements call from checkAccess: keyspace set, logged in, no DDL on system keyspaces, protected auth tables, then the authorizer (AllowAllAuthorizer deployed: always allowed)."
    sources:
      - src/java/org/apache/cassandra/service/ClientState.java:415-418
      - src/java/org/apache/cassandra/service/ClientState.java:451-473
    request:
      type: object
      required: [keyspace, permission]
      properties:
        keyspace: {type: string, default: shop}
        table: {type: string, default: users}
        permission: {type: string, enum: [SELECT, MODIFY, CREATE, ALTER, DROP, AUTHORIZE, DESCRIBE, EXECUTE], default: SELECT}
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - if: "input.keyspace == ''"
        then:
          - source: src/java/org/apache/cassandra/service/ClientState.java:635-639
            fail: {code: invalid, status: 8704, message: You have not set a keyspace for this session}
      - call: client-state.validate-login
      - if: "(input.permission == 'ALTER' || input.permission == 'DROP' || input.permission == 'CREATE') && (input.keyspace == 'system' || input.keyspace == 'system_schema')"
        then:
          - title: Local system keyspace is not user-modifiable
            source: src/java/org/apache/cassandra/service/ClientState.java:544-552
            fail: {code: unauthorized, status: 8448, message: "= input.keyspace + ' keyspace is not user-modifiable.'"}
      - call: client-state.ensure-permission
        input: {resource: "= 'data/' + input.keyspace + '/' + input.table", keyspace: "= input.keyspace", permission: "= input.permission"}
      - return: {allowed: true}
  - component: client-state
    name: ensure-permission
    kind: function
    summary: "No-op unless the authorizer requires authorization; then the user's permissions on the resource chain (table, keyspace, all keyspaces) must contain the permission."
    sources:
      - src/java/org/apache/cassandra/service/ClientState.java:475-504
      - src/java/org/apache/cassandra/service/ClientState.java:528-542
    request: {type: object, properties: {resource: {type: string, default: data/shop/users}, keyspace: {type: string, default: shop}, permission: {type: string, default: SELECT}}}
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: auth-config.get-backends
        as: be
      - if: "!vars.be.value.require_authorization"
        then:
          - title: Authorization disabled
            detail: "authorizer: AllowAllAuthorizer (cassandra.yaml:217) has requireAuthorization() false."
            source: src/java/org/apache/cassandra/service/ClientState.java:477-478
            return: {allowed: true}
      - set:
          vars.parts: "= input.resource.split('/')"
      - title: Resource chain
        detail: "Resources.chain: the table, its keyspace, then all keyspaces (auth_from_root false, so most specific first). Superusers get every permission from the authorizer itself; ClientState has no superuser shortcut."
        source: src/java/org/apache/cassandra/service/ClientState.java:523-536
        set:
          vars.chain: "= input.resource.startsWith('data/') && size(vars.parts) == 3 ? [input.resource, 'data/' + vars.parts[1], 'data'] : (input.resource.startsWith('data/') && size(vars.parts) == 2 ? [input.resource, 'data'] : [input.resource])"
      - foreach: "= vars.chain"
        as: r
        max: 3
        steps:
          - call: authenticated-user.get-permissions
            input: {user: "= state.user", resource: "= vars.r"}
            as: perms
          - if: "input.permission in vars.perms.value.permissions"
            then:
              - return: {allowed: true}
      - source: src/java/org/apache/cassandra/service/ClientState.java:538-541
        fail: {code: unauthorized, status: 8448, message: "= 'User ' + state.user + ' has no ' + input.permission + ' permission on <' + input.resource + '> or any of its parents'"}
  - component: client-state
    name: warn-about-use-with-prepared-statements
    kind: function
    summary: Once per connection, warn that USE plus unqualified prepared statements is an anti-pattern.
    sources: [src/java/org/apache/cassandra/service/ClientState.java:623-633]
    request: {type: object, properties: {statement_id: {type: string}, prepared_keyspace: {type: string}}}
    behavior:
      - if: "!state.issued_prepared_statements_use_warning"
        then:
          - call: client-warn.warn
            input: {text: "= '`USE <keyspace>` with prepared statements is considered to be an anti-pattern due to ambiguity in non-qualified table names. Keyspace used: ' + state.keyspace + ', statement keyspace: ' + input.prepared_keyspace + ', statement id: ' + input.statement_id"}
          - set: {state.issued_prepared_statements_use_warning: true}
  - component: client-state
    name: get-timestamp
    kind: function
    summary: "Node-wide strictly monotonic microsecond clock: max(now in micros, last + 1)."
    sources: [src/java/org/apache/cassandra/service/ClientState.java:233-243]
    response: {type: object, properties: {timestamp: {type: integer}}}
    behavior:
      - set: {vars.current: "= now * 1000"}
      - set: {vars.ts: "= state.last_timestamp_micros >= vars.current ? state.last_timestamp_micros + 1 : vars.current"}
      - set: {state.last_timestamp_micros: "= vars.ts"}
      - return: {timestamp: "= vars.ts"}
  - component: query-state
    name: get-timestamp
    kind: function
    summary: Generate the request's server-side timestamp once and reuse it for every later call in the same request.
    sources: [src/java/org/apache/cassandra/service/QueryState.java:67-72]
    response: {type: object, properties: {timestamp: {type: integer}}}
    behavior:
      - if: "state.timestamp == -9223372036854775808"
        then:
          - call: client-state.get-timestamp
            as: ts
          - set: {state.timestamp: "= vars.ts.value.timestamp"}
      - set: {ctx.request_timestamp: "= state.timestamp"}
      - return: {timestamp: "= state.timestamp"}
  - component: query-state
    name: get-client-state
    kind: function
    summary: The request's ClientState, in the shape the CQL layer reads (keyspace, user, anonymous, superuser).
    sources: [src/java/org/apache/cassandra/service/QueryState.java:108-111]
    response: {type: object, properties: {keyspace: {type: string}, user: {type: string}, is_anonymous: {type: boolean}, is_super: {type: boolean}}}
    behavior:
      - call: client-state.get-raw-keyspace
        as: ks
      - call: client-state.get-user
        as: u
      - return: {keyspace: "= vars.ks.value.keyspace", user: "= vars.u.value.user", is_anonymous: "= vars.u.value.is_anonymous", is_super: "= vars.u.value.is_super"}
  - component: client-warn
    name: capture-warnings
    kind: function
    summary: Start collecting warnings for this request (executor-local state).
    sources: [src/java/org/apache/cassandra/service/ClientWarn.java:53-56]
    behavior:
      - set: {state.capturing: true, state.warnings: []}
  - component: client-warn
    name: warn
    kind: function
    summary: Add a warning when capturing (dropped otherwise, e.g. on V3 connections); each is truncated to 65535 characters.
    sources:
      - src/java/org/apache/cassandra/service/ClientWarn.java:46-51
      - src/java/org/apache/cassandra/service/ClientWarn.java:77-88
    request: {type: object, required: [text], properties: {text: {type: string}}}
    behavior:
      - when: "state.capturing"
        set: {state.warnings: "= state.warnings + [input.text]"}
  - component: client-warn
    name: get-warnings
    kind: function
    summary: The collected warnings (null when none).
    sources: [src/java/org/apache/cassandra/service/ClientWarn.java:58-64]
    response: {type: object, properties: {warnings: {type: array, items: {type: string}}}}
    behavior:
      - return: {warnings: "= state.capturing ? state.warnings : []"}
  - component: client-warn
    name: reset-warnings
    kind: function
    summary: Clear the executor-local warning state after the response is built.
    sources: [src/java/org/apache/cassandra/service/ClientWarn.java:66-69]
    behavior:
      - set: {state.capturing: false, state.warnings: []}

  # =================================================================== execute
  - component: message-request
    name: execute
    kind: function
    summary: "Tracing wrapper: QUERY, PREPARE, EXECUTE and BATCH are traceable; with the TRACING header flag a session is opened, the subclass runs and the response carries the tracing id."
    sources: [src/java/org/apache/cassandra/transport/Message.java:230-265]
    request: {type: object, required: [type], properties: {type: {type: string}, version: {type: integer}, tracing: {type: boolean}, message: {type: object}}}
    response: TransportResponse
    behavior:
      - set: {vars.traceable: "= input.type in ['QUERY', 'PREPARE', 'EXECUTE', 'BATCH']"}
      - when: "vars.traceable && input.tracing"
        title: Tracing session
        detail: "Probabilistic tracing (nodetool settraceprobability, 0 by default) would also open one; not modeled."
        source: src/java/org/apache/cassandra/transport/Message.java:235-248
        call: tracing.new-session
        as: session
      - set: {vars.m: "= input.message"}
      - set: {vars.m.version: "= input.version", vars.m.tracing: "= vars.traceable && input.tracing"}
      - call: "= {'STARTUP': 'startup-message.execute', 'OPTIONS': 'options-message.execute', 'AUTH_RESPONSE': 'auth-response.execute', 'REGISTER': 'register-message.execute', 'QUERY': 'query-message.execute', 'PREPARE': 'prepare-message.execute', 'EXECUTE': 'execute-message.execute', 'BATCH': 'batch-message.execute'}[input.type]"
        targets: [startup-message.execute, options-message.execute, auth-response.execute, register-message.execute, query-message.execute, prepare-message.execute, execute-message.execute, batch-message.execute]
        input: "= vars.m"
        as: resp
        on_error:
          - when: "vars.traceable && input.tracing"
            call: tracing.stop-session
          - fail: "= error"
      - when: "vars.traceable && input.tracing"
        call: tracing.stop-session
      - set: {vars.out: "= vars.resp.value"}
      - when: "vars.traceable && input.tracing"
        set: {vars.out.tracing_id: "= vars.session.value.session_id", ctx.tracing_id: "= vars.session.value.session_id"}
      - return: "= vars.out"
  - component: startup-message
    name: execute
    kind: function
    summary: Validate CQL_VERSION (must not be below 2.99.0) and COMPRESSION, set throwOnOverload and driver info, answer READY or AUTHENTICATE.
    sources: [src/java/org/apache/cassandra/transport/messages/StartupMessage.java:72-127]
    request: {type: object, properties: {options: {type: object}, version: {type: integer}}}
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - set:
          vars.cql: "= has(input.options.CQL_VERSION) ? input.options.CQL_VERSION : ''"
          vars.compression: "= has(input.options.COMPRESSION) ? input.options.COMPRESSION.lowerAscii() : ''"
      - if: "vars.cql == ''"
        then:
          - source: src/java/org/apache/cassandra/transport/messages/StartupMessage.java:74-76
            fail: {code: protocol-error, status: 10, message: Missing value CQL_VERSION in STARTUP message}
      - if: "!vars.cql.matches('^[0-9]+\\\\.[0-9]+\\\\.[0-9]+.*$')"
        then:
          - source: src/java/org/apache/cassandra/transport/messages/StartupMessage.java:83-86
            fail: {code: protocol-error, status: 10, message: "= 'Invalid version value: ' + vars.cql"}
      - if: "int(vars.cql.split('.')[0]) < 2 || (int(vars.cql.split('.')[0]) == 2 && int(vars.cql.split('.')[1]) < 99)"
        then:
          - title: CQL version below 2.99.0
            source: src/java/org/apache/cassandra/transport/messages/StartupMessage.java:80-81
            fail: {code: protocol-error, status: 10, message: "= 'CQL version ' + vars.cql + ' is not supported by the binary protocol (supported version are >= 3.0.0)'"}
      - if: "vars.compression == 'snappy'"
        then:
          - if: "!state.snappy_available"
            then:
              - fail: {code: protocol-error, status: 10, message: This instance does not support Snappy compression}
          - if: "input.version >= 5"
            then:
              - source: src/java/org/apache/cassandra/transport/messages/StartupMessage.java:96-97
                fail: {code: protocol-error, status: 10, message: Snappy compression is not supported in protocol V5}
      - if: "vars.compression != '' && vars.compression != 'snappy' && vars.compression != 'lz4'"
        then:
          - source: src/java/org/apache/cassandra/transport/messages/StartupMessage.java:105-108
            fail: {code: protocol-error, status: 10, message: "= 'Unknown compression algorithm: ' + vars.compression"}
      - set: {ctx.compression: "= vars.compression"}
      - call: pipeline-configurator.set-channel-throw-on-overload
        input: {throw_on_overload: "= has(input.options.THROW_ON_OVERLOAD) && input.options.THROW_ON_OVERLOAD == '1'"}
      - call: client-state.set-client-options
        input:
          driver_name: "= has(input.options.DRIVER_NAME) ? input.options.DRIVER_NAME : ''"
          driver_version: "= has(input.options.DRIVER_VERSION) ? input.options.DRIVER_VERSION : ''"
      - call: auth-config.get-backends
        as: be
      - if: "vars.be.value.require_authentication"
        then:
          - title: Authentication required
            detail: The configured authenticator's AUTHENTICATE message names its class; the client must answer with AUTH_RESPONSE.
            source: src/java/org/apache/cassandra/transport/messages/StartupMessage.java:122-124
            return: {type: AUTHENTICATE, authenticator: "= 'org.apache.cassandra.auth.' + vars.be.value.authenticator"}
      - title: No authentication
        detail: "authenticator: AllowAllAuthenticator (cassandra.yaml:198) does not require authentication, so the connection is READY at once."
        source: src/java/org/apache/cassandra/transport/messages/StartupMessage.java:125-126
        return: {type: READY}
  - component: options-message
    name: execute
    kind: function
    summary: SUPPORTED with CQL_VERSION 3.4.7, COMPRESSION (snappy when the library loads, always lz4) and PROTOCOL_VERSIONS.
    sources:
      - src/java/org/apache/cassandra/transport/messages/OptionsMessage.java:62-79
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:84
    response: TransportResponse
    behavior:
      - set: {ctx.options_answered_by: options-message}
      - return:
          type: SUPPORTED
          supported:
            CQL_VERSION: ["3.4.7"]
            COMPRESSION: [snappy, lz4]
            PROTOCOL_VERSIONS: [3/v3, 4/v4, 5/v5, 6/v6-beta]
  - component: auth-response
    name: execute
    kind: function
    summary: "One SASL step: evaluate the response; when complete, obtain the user, log in and answer AUTH_SUCCESS; otherwise AUTH_CHALLENGE. AuthenticationException becomes an ERROR response."
    description: "The token is SASL PLAIN bytes (authzId NUL authnId NUL password); the model carries it already split into username and password, as schema-auth's negotiator takes it."
    sources: [src/java/org/apache/cassandra/transport/messages/AuthResponse.java:72-98]
    request: {type: object, properties: {username: {type: string}, password: {type: string}}}
    response: TransportResponse
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - call: server-connection.get-sasl-negotiator
      - call: password-authenticator-plain-text-sasl-authenticator.evaluate-response
        input: {username: "= input.username", password: "= input.password"}
        as: step
        on_error:
          - set: {ctx.auth: failure}
          - fail: "= error"
      - if: "!vars.step.value.complete"
        then:
          - return: {type: AUTH_CHALLENGE, token: ""}
      - call: password-authenticator-plain-text-sasl-authenticator.get-authenticated-user
        input: {username: "= input.username", password: "= input.password", complete: true}
        as: user
        on_error:
          - title: Authentication failed
            detail: ClientMetrics.markAuthFailure and AuthEvents.notifyAuthFailure; the ERROR is a normal response, so the connection stays AUTHENTICATING and the client may retry.
            source: src/java/org/apache/cassandra/transport/messages/AuthResponse.java:92-97
            set: {ctx.auth: failure}
          - fail: "= error"
      - call: client-state.login
        input: {user: "= vars.user.value.user"}
        on_error:
          - source: src/java/org/apache/cassandra/transport/messages/AuthResponse.java:92-97
            set: {ctx.auth: failure}
          - fail: "= error"
      - set: {ctx.auth: success, ctx.user: "= vars.user.value.user"}
      - return: {type: AUTH_SUCCESS}
  - component: register-message
    name: execute
    kind: function
    summary: Register the channel for each event type in order; an event type newer than the connection's protocol version fails the rest.
    sources: [src/java/org/apache/cassandra/transport/messages/RegisterMessage.java:66-78]
    request: {type: object, properties: {event_types: {type: array, items: {type: string}}, channel: {type: string}, version: {type: integer}}}
    response: TransportResponse
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - foreach: "= input.event_types"
        as: et
        max: 4
        steps:
          - if: "vars.et == 'TRACE_COMPLETE' && input.version < 4"
            then:
              - title: Event too new for this protocol version
                detail: "TRACE_COMPLETE needs V4; TOPOLOGY_CHANGE, STATUS_CHANGE and SCHEMA_CHANGE need V3, the oldest supported version. Types registered before this one stay registered."
                source: src/java/org/apache/cassandra/transport/Event.java:35-38
                fail: {code: protocol-error, status: 10, message: "= 'Event ' + vars.et + ' not valid for protocol version ' + string(input.version)"}
          - call: server-connection-tracker.register
            input: {event_type: "= vars.et", channel: "= input.channel", version: "= input.version"}
      - return: {type: READY}
  - component: query-message
    name: execute
    kind: function
    summary: Reject page size 0, parse and process through the QueryHandler (QueryProcessor unless cassandra.custom_query_handler_class is set); honour SKIP_METADATA.
    sources:
      - src/java/org/apache/cassandra/transport/messages/QueryMessage.java:102-133
      - src/java/org/apache/cassandra/service/ClientState.java:112-132
    request: {type: object, properties: {query: {type: string}, statement: {type: object}, options: TransportQueryOptions, tracing: {type: boolean}, version: {type: integer}}}
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - if: "input.options.page_size == 0"
        then:
          - source: src/java/org/apache/cassandra/transport/messages/QueryMessage.java:107-108
            fail: {code: protocol-error, status: 10, message: The page size cannot be 0}
      - when: "input.tracing"
        source: src/java/org/apache/cassandra/transport/messages/QueryMessage.java:135-147
        call: tracing.begin
        input: {request: Execute CQL3 query, parameters: {query: "= input.query", consistency_level: "= input.options.consistency"}}
      - call: query-state.get-client-state
        as: cs
      - set:
          vars.opts: {consistency: "= input.options.consistency", serial_consistency: "= input.options.serial_consistency", page_size: "= input.options.page_size", keyspace: "= input.options.keyspace", values: []}
      - source: src/java/org/apache/cassandra/transport/messages/QueryMessage.java:115-116
        call: query-processor.parse
        input: {query: "= input.query", statement: "= input.statement", options: "= vars.opts", client_state: "= vars.cs.value"}
        fill: true
        as: stmt
      - source: src/java/org/apache/cassandra/transport/messages/QueryMessage.java:117
        call: query-processor.process
        input: {statement: "= vars.stmt.value", options: "= vars.opts", client_state: "= vars.cs.value"}
        fill: true
        as: result
      - set: {vars.res: "= vars.result.value"}
      - when: "input.options.skip_metadata && vars.res.kind == 'ROWS'"
        source: src/java/org/apache/cassandra/transport/messages/QueryMessage.java:120-121
        set: {vars.res.skip_metadata: true}
      - return: {type: RESULT, result: "= vars.res"}
  - component: prepare-message
    name: execute
    kind: function
    summary: Prepare against the session keyspace or the v5 per-message keyspace.
    sources: [src/java/org/apache/cassandra/transport/messages/PrepareMessage.java:122-142]
    request: {type: object, properties: {query: {type: string}, statement: {type: object}, keyspace: {type: string}, tracing: {type: boolean}}}
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - when: "input.tracing"
        source: src/java/org/apache/cassandra/transport/messages/PrepareMessage.java:126-127
        call: tracing.begin
        input: {request: Preparing CQL3 query, parameters: {query: "= input.query"}}
      - call: client-state.clone-with-keyspace-if-set
        input: {keyspace: "= input.keyspace"}
        as: ks
      - call: query-state.get-client-state
        as: cs
      - source: src/java/org/apache/cassandra/transport/messages/PrepareMessage.java:129-132
        call: query-processor.prepare
        input:
          query: "= input.query"
          statement: "= input.statement"
          client_state: {keyspace: "= vars.ks.value.keyspace", user: "= vars.cs.value.user", is_anonymous: "= vars.cs.value.is_anonymous", is_super: "= vars.cs.value.is_super"}
        fill: true
        as: prepared
      - set: {vars.res: "= vars.prepared.value"}
      - title: Result metadata id
        detail: "ResultMessage.Prepared carries the result metadata id (a digest of the result columns); the model uses 'meta:<keyspace>.<table>' as that digest."
        source: src/java/org/apache/cassandra/transport/messages/ResultMessage.java:211-230
        set: {vars.res.result_metadata_id: "= 'meta:' + (has(input.statement.keyspace) ? input.statement.keyspace : vars.ks.value.keyspace) + '.' + (has(input.statement.table) ? input.statement.table : '')"}
      - return: {type: RESULT, result: "= vars.res"}
  - component: execute-message
    name: execute
    kind: function
    summary: "Look up the prepared statement (UNPREPARED when evicted or never prepared here), warn about USE with unqualified statements, reject page size 0, process, then set the result-metadata flags."
    sources: [src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:131-211]
    request: {type: object, properties: {statement_id: {type: string}, result_metadata_id: {type: string}, values: {type: array}, options: TransportQueryOptions, tracing: {type: boolean}, version: {type: integer}}}
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - call: query-processor.get-prepared
        input: {statement_id: "= input.statement_id"}
        as: p
      - if: "has(vars.p.value.found) && !vars.p.value.found"
        then:
          - title: Prepared statement not found
            detail: "The driver re-prepares on UNPREPARED and retries the EXECUTE."
            source: src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:137-139
            fail: {code: unprepared, status: 9472, message: "= 'Prepared query with ID ' + input.statement_id + ' not found (either the query was not prepared on this host (maybe the host has been restarted?) or you have prepared too many queries and it has been evicted from the internal cache)'"}
      - set:
          vars.st: "= vars.p.value.statement"
      - set:
          vars.lwt: "= (has(vars.st.conditions) && size(vars.st.conditions) > 0) || (has(vars.st.if_exists) && vars.st.if_exists) || (has(vars.st.if_not_exists) && vars.st.if_not_exists)"
          vars.meta: "= 'meta:' + vars.st.keyspace + '.' + vars.st.table"
      - call: client-state.get-raw-keyspace
        as: ks
      - if: "!vars.p.value.fully_qualified && vars.ks.value.keyspace != vars.p.value.keyspace && vars.st.type != 'BATCH'"
        then:
          - title: Unqualified statement on another keyspace
            source: src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:141-152
            call: client-state.warn-about-use-with-prepared-statements
            input: {statement_id: "= input.statement_id", prepared_keyspace: "= vars.p.value.keyspace"}
      - if: "input.options.page_size == 0"
        then:
          - title: Page size checked after the lookup
            source: src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:157-158
            fail: {code: protocol-error, status: 10, message: The page size cannot be 0}
      - when: "input.tracing"
        source: src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:213-240
        call: tracing.begin
        input: {request: Execute CQL3 prepared query, parameters: {query: "= vars.p.value.query"}}
      - call: query-state.get-client-state
        as: cs
      - source: src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:165-169
        call: query-processor.process-prepared
        input:
          statement: "= vars.st"
          options: {consistency: "= input.options.consistency", serial_consistency: "= input.options.serial_consistency", page_size: "= input.options.page_size", keyspace: "= input.options.keyspace", values: "= input.values"}
          client_state: "= vars.cs.value"
        fill: true
        as: result
      - set: {vars.res: "= vars.result.value"}
      - if: "vars.res.kind == 'ROWS' && input.version >= 5 && !vars.lwt"
        then:
          - title: V5 result metadata id
            detail: "The client's result_metadata_id is compared with the new rows' metadata id ('meta:<keyspace>.<table>' in the model); a mismatch sets METADATA_CHANGED, a match plus SKIP_METADATA skips it. LWTs always get full metadata without the flag."
            source: src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:179-193
            set:
              vars.res.result_metadata_id: "= vars.meta"
              vars.res.metadata_changed: "= vars.meta != input.result_metadata_id"
              vars.res.skip_metadata: "= vars.meta == input.result_metadata_id && input.options.skip_metadata"
      - if: "vars.res.kind == 'ROWS' && input.version < 5"
        then:
          - title: Pre-V5 skip metadata
            detail: The prepared statement's metadata id and the result's are the same digest in the model, so SKIP_METADATA alone decides.
            source: src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:194-200
            set: {vars.res.skip_metadata: "= input.options.skip_metadata"}
      - set: {ctx.metadata_changed: "= has(vars.res.metadata_changed) ? vars.res.metadata_changed : false"}
      - return: {type: RESULT, result: "= vars.res"}
  - component: batch-message
    name: decode
    kind: function
    summary: "BATCH codec: type byte 0 LOGGED, 1 UNLOGGED, 2 COUNTER; each query kind 0 (string) or 1 (prepared id)."
    sources: [src/java/org/apache/cassandra/transport/messages/BatchMessage.java:56-76]
    request: {type: object, properties: {batch_type: {type: integer}, queries: {type: array}}}
    errors: [{code: protocol-error, status: 10}]
    behavior:
      - foreach: "= input.queries"
        as: q
        max: 100
        steps:
          - if: "vars.q.kind != 0 && vars.q.kind != 1"
            then:
              - source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:64-70
                fail: {code: protocol-error, status: 10, message: "= 'Invalid query kind in BATCH messages. Must be 0 or 1 but got ' + string(vars.q.kind)"}
      - if: "input.batch_type < 0 || input.batch_type > 2"
        then:
          - source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:121-131
            fail: {code: protocol-error, status: 10, message: "= 'Invalid BATCH message type ' + string(input.batch_type)"}
  - component: batch-message
    name: execute
    kind: function
    summary: "Prepare every query string and look up every id (UNPREPARED if missing), check bind counts, then require every statement to be INSERT, UPDATE or DELETE before processing the batch."
    sources: [src/java/org/apache/cassandra/transport/messages/BatchMessage.java:173-241]
    request: {type: object, properties: {batch_type: {type: integer}, queries: {type: array}, options: TransportQueryOptions, tracing: {type: boolean}}}
    response: TransportResponse
    errors: *cqlRequestErrors
    behavior:
      - when: "input.tracing"
        source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:243-253
        call: tracing.begin
        input: {request: Execute batch of CQL3 queries, parameters: {consistency_level: "= input.options.consistency"}}
      - call: query-state.get-client-state
        as: cs
      - call: client-state.clone-with-keyspace-if-set
        input: {keyspace: "= input.options.keyspace"}
        as: bks
      - set: {vars.types: [], vars.stmts: []}
      - foreach: "= input.queries"
        as: q
        max: 100
        steps:
          - if: "vars.q.kind == 0"
            then:
              - title: Query string
                detail: Prepared against a ClientState clone carrying the options keyspace; not cached.
                source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:187-192
                call: query-processor.parse-and-prepare
                input:
                  query: "= vars.q.query"
                  statement: "= vars.q.statement"
                  client_state: {keyspace: "= vars.bks.value.keyspace", user: "= vars.cs.value.user", is_anonymous: "= vars.cs.value.is_anonymous", is_super: "= vars.cs.value.is_super"}
                fill: true
                as: p
            else:
              - call: query-processor.get-prepared
                input: {statement_id: "= vars.q.id"}
                as: p
              - if: "has(vars.p.value.found) && !vars.p.value.found"
                then:
                  - source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:195-197
                    fail: {code: unprepared, status: 9472, message: "= 'Prepared query with ID ' + vars.q.id + ' not found'"}
          - set: {vars.st: "= vars.p.value.statement"}
          - set: {vars.markers: "= has(vars.st.bind_markers) ? vars.st.bind_markers : 0"}
          - if: "size(vars.q.values) != vars.markers"
            then:
              - source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:200-204
                fail: {code: invalid, status: 8704, message: "= 'There were ' + string(vars.markers) + ' markers(?) in CQL but ' + string(size(vars.q.values)) + ' bound variables'"}
          - set: {vars.types: "= vars.types + [vars.st.type]", vars.stmts: "= vars.stmts + [vars.st]"}
      - if: "vars.types.exists(t, !(t in ['INSERT', 'UPDATE', 'DELETE']))"
        then:
          - title: Only modification statements
            detail: Checked only after every statement was prepared and bound.
            source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:212-223
            fail: {code: invalid, status: 8704, message: "Invalid statement in batch: only UPDATE, INSERT and DELETE statements are allowed."}
      - title: One BatchStatement
        source: src/java/org/apache/cassandra/transport/messages/BatchMessage.java:227-230
        call: query-processor.process-batch
        input:
          statement: {type: BATCH, batch_type: "= ['LOGGED', 'UNLOGGED', 'COUNTER'][input.batch_type]", keyspace: "= size(vars.stmts) > 0 ? vars.stmts[0].keyspace : vars.bks.value.keyspace", table: "= size(vars.stmts) > 0 ? vars.stmts[0].table : ''", statements: "= vars.stmts"}
          options: {consistency: "= input.options.consistency", serial_consistency: "= input.options.serial_consistency", page_size: "= input.options.page_size", keyspace: "= input.options.keyspace", values: []}
          client_state: "= vars.cs.value"
        fill: true
        as: result
      - return: {type: RESULT, result: "= vars.result.value"}
  - component: error-message
    name: from-exception
    kind: function
    summary: "TransportExceptions keep their code; anything else becomes SERVER_ERROR. Then codes the client's version cannot carry are downgraded."
    sources:
      - src/java/org/apache/cassandra/transport/messages/ErrorMessage.java:437-476
      - src/java/org/apache/cassandra/transport/messages/ErrorMessage.java:350-386
    request: {type: object, properties: {code: {type: string}, status: {type: integer}, message: {type: string}, version: {type: integer}}}
    response: {type: object, properties: {code: {type: string}, status: {type: integer}, message: {type: string}}}
    behavior:
      - set:
          vars.known:
            protocol-error: 10
            bad-credentials: 256
            unavailable: 4096
            overloaded: 4097
            is-bootstrapping: 4098
            truncate-error: 4099
            write-timeout: 4352
            read-timeout: 4608
            read-failure: 4864
            function-failure: 5120
            write-failure: 5376
            cdc-write-failure: 5632
            cas-write-unknown: 5888
            syntax-error: 8192
            unauthorized: 8448
            invalid: 8704
            config-error: 8960
            already-exists: 9216
            unprepared: 9472
            server-error: 0
      - if: "!(input.code in vars.known)"
        then:
          - title: Unexpected exception
            detail: Not a TransportException, so it is logged and wrapped in ServerError.
            source: src/java/org/apache/cassandra/transport/messages/ErrorMessage.java:471-475
            set: {ctx.error_downgraded_from: "= input.code"}
          - return: {code: server-error, status: 0, message: "= input.message"}
      - if: "input.version < 4 && (input.code == 'read-failure' || input.code == 'write-failure' || input.code == 'function-failure' || input.code == 'cdc-write-failure')"
        then:
          - title: Pre-V4 downgrade
            source: src/java/org/apache/cassandra/transport/messages/ErrorMessage.java:352-365
            set: {ctx.error_downgraded_from: "= input.code"}
          - return:
              code: "= input.code == 'read-failure' ? 'read-timeout' : (input.code == 'write-failure' ? 'write-timeout' : 'invalid')"
              status: "= input.code == 'read-failure' ? 4608 : (input.code == 'write-failure' ? 4352 : 8704)"
              message: "= input.message"
      - if: "input.version < 5 && input.code == 'cas-write-unknown'"
        then:
          - title: Pre-V5 downgrade
            detail: "CAS_WRITE_UNKNOWN does not exist before V5: the client sees WRITE_TIMEOUT with write type CAS."
            source: src/java/org/apache/cassandra/transport/messages/ErrorMessage.java:368-382
            set: {ctx.error_downgraded_from: "= input.code"}
          - return: {code: write-timeout, status: 4352, message: "= input.message"}
      - return: {code: "= input.code", status: "= vars.known[input.code]", message: "= input.message"}

  # =================================================================== events
  - component: server-connection-tracker
    name: is-running
    kind: function
    summary: Server.isRunning, read by the Dispatcher through the tracker.
    sources:
      - src/java/org/apache/cassandra/transport/Server.java:304-307
      - src/java/org/apache/cassandra/transport/Server.java:113
    response: {type: object, properties: {running: {type: boolean}}}
    behavior:
      - return: {running: "= state.running"}
  - component: server-connection-tracker
    name: set-running
    kind: function
    summary: Server.start sets the running flag after binding; Server.stop clears it and closes all channels.
    sources:
      - src/java/org/apache/cassandra/transport/Server.java:146-147
      - src/java/org/apache/cassandra/transport/Server.java:126-127
    request: {type: object, properties: {running: {type: boolean, default: true}}}
    behavior:
      - set: {state.running: "= input.running", ctx.server_running: "= input.running"}
      - when: "!input.running"
        set: {state.channels: 0}
  - component: server-connection-tracker
    name: add-connection
    kind: function
    summary: Track a new channel (and its protocol version per client address).
    sources: [src/java/org/apache/cassandra/transport/Server.java:296-302]
    request: {type: object, properties: {client_address: {type: string}}}
    behavior:
      - set: {state.channels: "= state.channels + 1"}
  - component: server-connection-tracker
    name: register
    kind: store
    summary: Add the channel to the event type's channel group.
    sources: [src/java/org/apache/cassandra/transport/Server.java:309-312]
    request: {type: object, required: [event_type, channel], properties: {event_type: {type: string}, channel: {type: string}, version: {type: integer}}}
    store: {table: registrations, op: put, key: "= input.event_type + ':' + input.channel", value: "= input"}
  - component: server-connection-tracker
    name: registered-channels
    kind: store
    summary: The channels registered for one event type.
    sources: [src/java/org/apache/cassandra/transport/Server.java:316]
    request: {type: object, required: [event_type], properties: {event_type: {type: string}}}
    store: {table: registrations, op: query, where: "row.event_type == input.event_type"}
  - component: server-connection-tracker
    name: send
    kind: event
    summary: "Deliver an event to every channel registered for its type: written straight to pre-v5 channels, through the event dispatcher (flusher) for v5+."
    sources: [src/java/org/apache/cassandra/transport/Server.java:314-326]
    request: {type: object, required: [event], properties: {event: TransportEvent}}
    behavior:
      - call: server-connection-tracker.registered-channels
        input: {event_type: "= input.event.type"}
        as: chans
      - foreach: "= vars.chans.value"
        as: ch
        steps:
          - if: "vars.ch.version < 5"
            then:
              - source: src/java/org/apache/cassandra/transport/Server.java:319-320
                call: cql-client.event-message
                input: {channel: "= vars.ch.channel", stream_id: -1, event: "= input.event", delivery: pre-v5-write-and-flush}
            else:
              - source: src/java/org/apache/cassandra/transport/Server.java:322-325
                call: dispatcher.event-dispatcher
                input: {channel: "= vars.ch.channel", stream_id: -1, event: "= input.event", delivery: v5-flusher}
      - set: {ctx.event_recipients: "= size(vars.chans.value)"}
  - component: cql-client
    name: event-message
    kind: cql
    summary: "EVENT (opcode 12) pushed to a client that REGISTERed for its type, on stream id -1."
    sources:
      - src/java/org/apache/cassandra/transport/messages/EventMessage.java:26-61
      - src/java/org/apache/cassandra/transport/Message.java:89
    request: TransportEventDelivery
  - component: cql-client
    name: concurrent-auth-responses
    kind: cql
    summary: "Many connections send AUTH_RESPONSE at once (a connection storm). The scenario's lever for the auth executor's capacity: with slow password checks the extra requests queue behind native_transport_max_auth_threads workers."
    description: "Client-side load generator, not server code. Each item of `connections` is one AUTH_RESPONSE; a failed one is recorded instead of failing the burst."
    sources:
      - src/java/org/apache/cassandra/transport/Dispatcher.java:63-80
    request:
      type: object
      properties:
        connections: {type: array, items: {type: integer}, default: [1, 2, 3, 4, 5]}
        coordinator: {type: string, default: n1, description: The node the client connections are open to.}
        username: {type: string, default: alice}
        password: {type: string, default: s3cret}
    response: {type: object, properties: {succeeded: {type: integer}, overloaded: {type: integer}}}
    behavior:
      - parallel: "= input.connections"
        as: conn
        steps:
          - call: transport.auth-response-message
            on: "= input.coordinator"
            input: {username: "= input.username", password: "= input.password"}
            fill: true
            as: r
            on_error: continue
          - return: {ok: "= vars.r.ok", code: "= vars.r.ok ? '' : vars.r.error.code"}
        join: {need: all}
        as_result: storm
      - set:
          ctx.storm_codes: "= vars.storm.results.map(x, x.value.code)"
      - return:
          succeeded: "= size(vars.storm.results.filter(x, x.value.ok))"
          overloaded: "= size(vars.storm.results.filter(x, x.value.code == 'overloaded'))"
  - component: server-event-notifier
    name: latest-event-get
    kind: store
    summary: The last status and topology event sent for an endpoint (duplicates from StorageService are suppressed against it).
    sources: [src/java/org/apache/cassandra/transport/Server.java:400-402]
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string}}}
    store: {table: latest_events, op: get, key: "= input.endpoint", default: {status: "", topology: ""}}
  - component: server-event-notifier
    name: latest-event-put
    kind: store
    summary: Record the last event sent for an endpoint.
    sources: [src/java/org/apache/cassandra/transport/Server.java:379-393]
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string}, status: {type: string}, topology: {type: string}}}
    store: {table: latest_events, op: put, key: "= input.endpoint", value: {status: "= input.status", topology: "= input.topology"}}
  - component: server-event-notifier
    name: pending-joined-add
    kind: store
    summary: A joined endpoint whose native transport is not ready yet; NEW_NODE is deferred until it comes UP.
    sources: [src/java/org/apache/cassandra/transport/Server.java:403-405]
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string}}}
    store: {table: pending_joined, op: put, key: "= input.endpoint", value: {pending: true}}
  - component: server-event-notifier
    name: pending-joined-remove
    kind: store
    summary: Remove an endpoint from the pending NEW_NODE set (returns null when it was not pending).
    sources: [src/java/org/apache/cassandra/transport/Server.java:473]
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string}}}
    store: {table: pending_joined, op: delete, key: "= input.endpoint"}
  - component: server-event-notifier
    name: send
    kind: function
    summary: "Node events about another endpoint whose native address equals our own broadcast native address are dropped (rpc_address localhost case); everything else goes to the tracker."
    sources: [src/java/org/apache/cassandra/transport/Server.java:427-447]
    request: {type: object, required: [endpoint, event], properties: {endpoint: {type: string}, event: TransportEvent}}
    behavior:
      - call: storage-service.get-nativeaddress
        input: {endpoint: "= self", with_port: true}
        as: own
      - title: Our broadcast native address
        detail: "FBUtilities.getBroadcastNativeAddressAndPort: this node's native address, unless broadcast_rpc_address/rpc_address make it something else (state broadcast_native_address, empty when not overridden)."
        source: src/java/org/apache/cassandra/transport/Server.java:438
        set: {vars.own_native: "= state.broadcast_native_address != '' ? state.broadcast_native_address : vars.own.value.native_address"}
      - if: "input.endpoint != self && input.event.address == vars.own_native"
        then:
          - title: Own native address
            source: src/java/org/apache/cassandra/transport/Server.java:437-439
            set: {ctx.event_suppressed: own-native-address}
          - return: {sent: false}
      - call: server-connection-tracker.send
        input: {event: "= input.event"}
      - return: {sent: true}
  - component: server-event-notifier
    name: on-status-change
    kind: function
    summary: "Send STATUS_CHANGE unless the endpoint's last status is the same. Note: the new LatestEvent keeps no topology (forStatusChange(status, null))."
    sources: [src/java/org/apache/cassandra/transport/Server.java:499-511]
    request: {type: object, required: [endpoint, status, address], properties: {endpoint: {type: string}, status: {type: string, enum: [UP, DOWN]}, address: {type: string}}}
    behavior:
      - call: server-event-notifier.latest-event-get
        input: {endpoint: "= input.endpoint"}
        as: prev
      - if: "vars.prev.value.status == input.status"
        then:
          - title: Duplicate status suppressed
            source: src/java/org/apache/cassandra/transport/Server.java:504-505
            set: {ctx.event_suppressed: duplicate}
          - return: {sent: false}
      - title: Record the status, forgetting the topology
        detail: "LatestEvent.forStatusChange(event.status, null) passes null as prev, so the remembered topology change is cleared; a repeated NEW_NODE after a status change is sent again."
        source: src/java/org/apache/cassandra/transport/Server.java:507
        call: server-event-notifier.latest-event-put
        input: {endpoint: "= input.endpoint", status: "= input.status", topology: ""}
      - call: server-event-notifier.send
        input: {endpoint: "= input.endpoint", event: {type: STATUS_CHANGE, change: "= input.status", address: "= input.address"}}
        as: s
      - return: {sent: "= vars.s.value.sent"}
  - component: server-event-notifier
    name: on-topology-change
    kind: function
    summary: Send TOPOLOGY_CHANGE unless the endpoint's last topology change is the same; the last status is kept.
    sources: [src/java/org/apache/cassandra/transport/Server.java:485-497]
    request: {type: object, required: [endpoint, change, address], properties: {endpoint: {type: string}, change: {type: string, enum: [NEW_NODE, REMOVED_NODE, MOVED_NODE]}, address: {type: string}}}
    behavior:
      - call: server-event-notifier.latest-event-get
        input: {endpoint: "= input.endpoint"}
        as: prev
      - if: "vars.prev.value.topology == input.change"
        then:
          - set: {ctx.event_suppressed: duplicate}
          - return: {sent: false}
      - call: server-event-notifier.latest-event-put
        input: {endpoint: "= input.endpoint", status: "= vars.prev.value.status", topology: "= input.change"}
      - call: server-event-notifier.send
        input: {endpoint: "= input.endpoint", event: {type: TOPOLOGY_CHANGE, change: "= input.change", address: "= input.address"}}
        as: s
      - return: {sent: "= vars.s.value.sent"}
  - component: server-event-notifier
    name: on-up
    kind: event
    subscribe: [endpoint-lifecycle.on-up]
    summary: "Endpoint UP (from StorageService's lifecycle subscribers): first a deferred NEW_NODE if the endpoint was pending, then STATUS_CHANGE UP."
    sources: [src/java/org/apache/cassandra/transport/Server.java:470-477]
    request: TransportEndpointEvent
    behavior:
      - call: storage-service.get-nativeaddress
        input: {endpoint: "= input.endpoint", with_port: true}
        as: addr
      - call: server-event-notifier.pending-joined-remove
        input: {endpoint: "= input.endpoint"}
        as: pending
      - when: "vars.pending.value != null"
        title: Deferred NEW_NODE
        source: src/java/org/apache/cassandra/transport/Server.java:473-474
        call: server-event-notifier.on-join-cluster
        input: {endpoint: "= input.endpoint"}
      - call: server-event-notifier.on-status-change
        input: {endpoint: "= input.endpoint", status: UP, address: "= vars.addr.value.native_address"}
  - component: server-event-notifier
    name: on-down
    kind: event
    subscribe: [endpoint-lifecycle.on-down]
    summary: Endpoint DOWN becomes STATUS_CHANGE DOWN.
    sources: [src/java/org/apache/cassandra/transport/Server.java:479-483]
    request: TransportEndpointEvent
    behavior:
      - call: storage-service.get-nativeaddress
        input: {endpoint: "= input.endpoint", with_port: true}
        as: addr
      - call: server-event-notifier.on-status-change
        input: {endpoint: "= input.endpoint", status: DOWN, address: "= vars.addr.value.native_address"}
  - component: server-event-notifier
    name: on-join-cluster
    kind: event
    subscribe: [endpoint-lifecycle.on-join-cluster]
    summary: "A joined endpoint becomes NEW_NODE, but only once it reports RPC ready; until then it is parked in the pending set."
    sources: [src/java/org/apache/cassandra/transport/Server.java:449-456]
    request: TransportEndpointEvent
    behavior:
      - call: storage-service.is-rpc-ready
        input: {endpoint: "= input.endpoint"}
        as: ready
      - if: "!vars.ready.value.ready"
        then:
          - title: Not ready for clients yet
            source: src/java/org/apache/cassandra/transport/Server.java:452-453
            call: server-event-notifier.pending-joined-add
            input: {endpoint: "= input.endpoint"}
          - set: {ctx.new_node_deferred: true}
          - return: {sent: false}
      - call: storage-service.get-nativeaddress
        input: {endpoint: "= input.endpoint", with_port: true}
        as: addr
      - call: server-event-notifier.on-topology-change
        input: {endpoint: "= input.endpoint", change: NEW_NODE, address: "= vars.addr.value.native_address"}
  - component: server-event-notifier
    name: on-leave-cluster
    kind: event
    subscribe: [endpoint-lifecycle.on-leave-cluster]
    summary: A departed endpoint becomes REMOVED_NODE.
    sources: [src/java/org/apache/cassandra/transport/Server.java:458-462]
    request: TransportEndpointEvent
    behavior:
      - call: storage-service.get-nativeaddress
        input: {endpoint: "= input.endpoint", with_port: true}
        as: addr
      - call: server-event-notifier.on-topology-change
        input: {endpoint: "= input.endpoint", change: REMOVED_NODE, address: "= vars.addr.value.native_address"}
  - component: server-event-notifier
    name: on-move
    kind: event
    subscribe: [endpoint-lifecycle.on-move]
    summary: A moved endpoint becomes MOVED_NODE.
    sources: [src/java/org/apache/cassandra/transport/Server.java:464-468]
    request: TransportEndpointEvent
    behavior:
      - call: storage-service.get-nativeaddress
        input: {endpoint: "= input.endpoint", with_port: true}
        as: addr
      - call: server-event-notifier.on-topology-change
        input: {endpoint: "= input.endpoint", change: MOVED_NODE, address: "= vars.addr.value.native_address"}
  - component: server-event-notifier
    name: on-create-keyspace
    kind: event
    subscribe: [schema-change.on-create-keyspace]
    summary: Schema listener; CREATED KEYSPACE becomes SCHEMA_CHANGE (not deduplicated).
    sources: [src/java/org/apache/cassandra/transport/Server.java:513-517]
    request: TransportSchemaChangeEvent
    behavior:
      - call: server-connection-tracker.send
        input: {event: {type: SCHEMA_CHANGE, change: CREATED, target: KEYSPACE, keyspace: "= input.keyspace", name: ""}}
  - component: server-event-notifier
    name: on-create-table
    kind: event
    subscribe: [schema-change.on-create-table]
    summary: CREATED TABLE becomes SCHEMA_CHANGE.
    sources: [src/java/org/apache/cassandra/transport/Server.java:519-523]
    request: TransportSchemaChangeEvent
    behavior:
      - call: server-connection-tracker.send
        input: {event: {type: SCHEMA_CHANGE, change: CREATED, target: TABLE, keyspace: "= input.keyspace", name: "= input.name"}}
  - component: server-event-notifier
    name: on-alter-keyspace
    kind: event
    subscribe: [schema-change.on-alter-keyspace]
    summary: UPDATED KEYSPACE becomes SCHEMA_CHANGE.
    sources: [src/java/org/apache/cassandra/transport/Server.java:545-549]
    request: TransportSchemaChangeEvent
    behavior:
      - call: server-connection-tracker.send
        input: {event: {type: SCHEMA_CHANGE, change: UPDATED, target: KEYSPACE, keyspace: "= input.keyspace", name: ""}}
  - component: server-event-notifier
    name: on-alter-table
    kind: event
    subscribe: [schema-change.on-alter-table]
    summary: UPDATED TABLE becomes SCHEMA_CHANGE (whether or not the change affects prepared statements).
    sources: [src/java/org/apache/cassandra/transport/Server.java:551-555]
    request: TransportSchemaChangeEvent
    behavior:
      - call: server-connection-tracker.send
        input: {event: {type: SCHEMA_CHANGE, change: UPDATED, target: TABLE, keyspace: "= input.keyspace", name: "= input.name"}}
  - component: server-event-notifier
    name: on-drop-keyspace
    kind: event
    subscribe: [schema-change.on-drop-keyspace]
    summary: DROPPED KEYSPACE becomes SCHEMA_CHANGE.
    sources: [src/java/org/apache/cassandra/transport/Server.java:577-581]
    request: TransportSchemaChangeEvent
    behavior:
      - call: server-connection-tracker.send
        input: {event: {type: SCHEMA_CHANGE, change: DROPPED, target: KEYSPACE, keyspace: "= input.keyspace", name: ""}}
  - component: server-event-notifier
    name: on-drop-table
    kind: event
    subscribe: [schema-change.on-drop-table]
    summary: DROPPED TABLE becomes SCHEMA_CHANGE.
    sources: [src/java/org/apache/cassandra/transport/Server.java:583-587]
    request: TransportSchemaChangeEvent
    behavior:
      - call: server-connection-tracker.send
        input: {event: {type: SCHEMA_CHANGE, change: DROPPED, target: TABLE, keyspace: "= input.keyspace", name: "= input.name"}}

  # =================================================================== boundary stubs
  # query-processor.* copy cql's contract (cql.yaml): requests CqlParseRequest / CqlRequest,
  # responses CqlStatement / CqlResultMessage / CqlPrepared. The schemas are inlined here
  # because only the owner defines the named ones.
  - component: query-processor
    name: parse
    kind: function
    summary: QueryHandler.parse - parse the CQL string against the client state with the options' keyspace (owner cql).
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:345-348]
    attributes: {boundary: true, owner: cql}
    request: &cqlParseRequest
      type: object
      required: [query, statement]
      properties:
        query: {type: string}
        statement: &cqlStatement
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [SELECT, INSERT, UPDATE, DELETE, BATCH, USE, TRUNCATE, DESCRIBE, ADD_IDENTITY, DROP_IDENTITY], default: SELECT}
            keyspace: {type: string, default: shop}
            table: {type: string, default: users}
            fully_qualified: {type: boolean, default: true}
            conditions: {type: object, default: {}}
            if_not_exists: {type: boolean, default: false}
            if_exists: {type: boolean, default: false}
            bind_markers: {type: integer, default: 0}
            batch_type: {type: string, enum: [LOGGED, UNLOGGED, COUNTER], default: LOGGED}
            statements: {type: array, items: {type: object}, default: []}
        options: &cqlQueryOptions
          type: object
          properties:
            consistency: {type: string, default: ONE}
            serial_consistency: {type: string, default: SERIAL}
            values: {type: array, items: {type: string}, default: []}
            page_size: {type: integer, default: 5000}
            timestamp: {type: integer, default: 0}
            keyspace: {type: string, default: ""}
        client_state: &cqlClientState
          type: object
          properties:
            keyspace: {type: string, default: shop}
            user: {type: string, default: anonymous}
            is_anonymous: {type: boolean, default: true}
            is_super: {type: boolean, default: false}
    response: *cqlStatement
    errors: &cqlParseErrors [{code: syntax-error, status: 8192}, {code: invalid, status: 8704}]
  - component: query-processor
    name: process
    kind: function
    summary: QueryHandler.process - authorize, validate and execute a parsed statement (owner cql).
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:359-370]
    attributes: {boundary: true, owner: cql}
    request: &cqlRequest
      type: object
      required: [statement]
      properties:
        statement: *cqlStatement
        options: *cqlQueryOptions
        client_state: *cqlClientState
    response: &cqlResultMessage
      type: object
      properties:
        kind: {type: string, enum: [VOID, ROWS, SET_KEYSPACE, PREPARED], examples: [ROWS]}
        rows: {type: array, items: {type: object}, default: []}
        applied: {type: boolean, default: true}
        has_more_pages: {type: boolean, default: false}
        keyspace: {type: string, default: ""}
        statement_id: {type: string, examples: ["md5:shopSELECT name, email FROM users WHERE id = ?"]}
        warnings: {type: array, items: {type: string}, default: []}
    errors: &cqlExecErrors
      - {code: invalid, status: 8704}
      - {code: unauthorized, status: 8448}
      - {code: unavailable, status: 4096}
      - {code: write-timeout, status: 4352}
      - {code: read-timeout, status: 4608}
      - {code: read-failure, status: 4864}
      - {code: write-failure, status: 5376}
      - {code: cas-write-unknown, status: 5888}
      - {code: is-bootstrapping, status: 4098}
      - {code: truncate-error, status: 4099}
      - {code: overloaded, status: 4097}
      - {code: server-error, status: 0}
  - component: query-processor
    name: prepare
    kind: function
    summary: QueryHandler.prepare - prepare and cache a statement, returning ResultMessage.Prepared (owner cql).
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:728-784]
    attributes: {boundary: true, owner: cql}
    request: *cqlParseRequest
    response: *cqlResultMessage
    errors: *cqlParseErrors
  - component: query-processor
    name: get-prepared
    kind: function
    summary: "QueryHandler.getPrepared - prepared statement cache lookup; a miss returns {found: false} (owner cql). Pass-through copy of the owner's behavior so the standalone fragment reads the same cache rows."
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:244-247]
    attributes: {boundary: true, owner: cql}
    request: {type: object, required: [statement_id], properties: {statement_id: {type: string}}}
    response: {type: object}
    behavior:
      - call: query-processor-prepared-statements.get-if-present
        input: {statement_id: "= input.statement_id"}
        as: c
        on_error: continue
      - if: "vars.c.ok"
        then:
          - return: "= vars.c.value"
      - return: {found: false, statement_id: "= input.statement_id"}
  - component: query-processor-prepared-statements
    name: get-if-present
    kind: cache
    summary: The prepared statement cache (owner cql).
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:244-247]
    attributes: {boundary: true, owner: cql}
    request: {type: object, required: [statement_id], properties: {statement_id: {type: string}}}
    response:
      type: object
      properties:
        statement_id: {type: string}
        query: {type: string}
        keyspace: {type: string}
        fully_qualified: {type: boolean}
        statement: *cqlStatement
        size_bytes: {type: integer}
    errors: [{code: prepared-statement-not-cached, status: 404}]
    store: {table: entries, op: get, key: "= input.statement_id", not_found: prepared-statement-not-cached}
  - component: query-processor
    name: process-prepared
    kind: function
    summary: QueryHandler.processPrepared - execute a prepared statement with bound values (owner cql).
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:851-871]
    attributes: {boundary: true, owner: cql}
    request: *cqlRequest
    response: *cqlResultMessage
    errors: *cqlExecErrors
  - component: query-processor
    name: process-batch
    kind: function
    summary: QueryHandler.processBatch - execute a BatchStatement (owner cql; logged batches reach hints-batchlog through StorageProxy).
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:883-891]
    attributes: {boundary: true, owner: cql}
    request: *cqlRequest
    response: *cqlResultMessage
    errors: *cqlExecErrors
  - component: query-processor
    name: parse-and-prepare
    kind: function
    summary: QueryProcessor.parseAndPrepare - prepare a batch's query string without caching it (owner cql).
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:441-472]
    attributes: {boundary: true, owner: cql}
    request: *cqlParseRequest
    response:
      type: object
      properties:
        statement_id: {type: string, default: ""}
        query: {type: string}
        keyspace: {type: string, default: shop}
        fully_qualified: {type: boolean, default: true}
        statement:
          type: object
          required: [type]
          properties:
            type: {type: string, examples: [INSERT]}
            keyspace: {type: string, default: shop}
            table: {type: string, default: orders}
            fully_qualified: {type: boolean, default: true}
            bind_markers: {type: integer, examples: [3]}
            conditions: {type: object, default: {}}
        size_bytes: {type: integer, default: 3072}
    errors: *cqlParseErrors
  - component: password-authenticator
    name: new-sasl-negotiator
    kind: function
    summary: PasswordAuthenticator.newSaslNegotiator - a fresh PlainTextSaslAuthenticator per connection (owner schema-auth).
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:236-239]
    attributes: {boundary: true, owner: schema-auth}
    response: {type: object, properties: {negotiator: {type: string}}}
  - component: password-authenticator-plain-text-sasl-authenticator
    name: evaluate-response
    kind: function
    summary: "PlainTextSaslAuthenticator.evaluateResponse - decode the SASL PLAIN token (authzId NUL authnId NUL password, given already split); completes in one step (owner schema-auth)."
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:253-258]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, properties: {username: {type: string, default: alice}, password: {type: string, default: s3cret}}}
    response: {type: object, properties: {complete: {type: boolean, default: true}}}
    errors: [{code: bad-credentials, status: 256}]
  - component: password-authenticator-plain-text-sasl-authenticator
    name: get-authenticated-user
    kind: function
    summary: PlainTextSaslAuthenticator.getAuthenticatedUser - authenticate the decoded credentials against system_auth.roles (owner schema-auth).
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:265-270]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, properties: {username: {type: string, default: alice}, password: {type: string, default: s3cret}, complete: {type: boolean, default: true}}}
    response: {type: object, properties: {user: {type: string, examples: [alice]}}}
    errors: [{code: bad-credentials, status: 256}]
  - component: authenticated-user
    name: can-login
    kind: function
    summary: AuthenticatedUser.canLogin - the primary role's LOGIN attribute (owner schema-auth).
    sources: [src/java/org/apache/cassandra/auth/AuthenticatedUser.java:131-140]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, properties: {user: {type: string, default: alice}}}
    response: {type: object, properties: {can_login: {type: boolean, default: true}}}
    errors: [{code: unauthorized, status: 8448}]
  - component: auth-config
    name: get-backends
    kind: function
    summary: "The installed authenticator and authorizer with their requireAuthentication/requireAuthorization flags (owner schema-auth). Pass-through copy of the owner's accessor so scenarios seed the same auth-config state in both runs; unset means the deployed AllowAllAuthenticator/AllowAllAuthorizer (cassandra.yaml:198, :217)."
    sources: [src/java/org/apache/cassandra/auth/AuthConfig.java:69-90]
    attributes: {boundary: true, owner: schema-auth}
    response:
      type: object
      properties:
        authenticator: {type: string}
        authorizer: {type: string}
        role_manager: {type: string}
        require_authentication: {type: boolean}
        require_authorization: {type: boolean}
        authorizer_component: {type: string}
        cidr_authorizer: {type: string}
    behavior:
      - set:
          vars.authn: "= has(state.authenticator) ? state.authenticator : 'AllowAllAuthenticator'"
          vars.authz: "= has(state.authorizer) ? state.authorizer : 'AllowAllAuthorizer'"
      - return:
          authenticator: "= vars.authn"
          authorizer: "= vars.authz"
          role_manager: CassandraRoleManager
          require_authentication: "= vars.authn == 'PasswordAuthenticator' || vars.authn.startsWith('MutualTls')"
          require_authorization: "= vars.authz != 'AllowAllAuthorizer'"
          authorizer_component: "= vars.authz == 'CassandraAuthorizer' ? 'cassandra-authorizer' : 'allow-all-authorizer'"
          cidr_authorizer: AllowAllCIDRAuthorizer
  - component: authenticated-user
    name: is-super
    kind: function
    summary: AuthenticatedUser.isSuper - not anonymous and superuser status through Roles (owner schema-auth).
    sources: [src/java/org/apache/cassandra/auth/AuthenticatedUser.java:83-86]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, properties: {user: {type: string, default: alice}}}
    response: {type: object, properties: {is_super: {type: boolean, default: false}}}
  - component: authenticated-user
    name: get-permissions
    kind: function
    summary: AuthenticatedUser.getPermissions - the user's permissions on one resource through the permissions cache; superusers get everything from the authorizer (owner schema-auth).
    sources: [src/java/org/apache/cassandra/auth/AuthenticatedUser.java:126-129]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, properties: {user: {type: string}, resource: {type: string}}}
    response: {type: object, properties: {permissions: {type: array, items: {type: string}, default: [SELECT, MODIFY]}}}
    errors: [{code: unauthorized, status: 8448}]
  - component: schema
    name: get-keyspace-metadata
    kind: function
    summary: Schema.getKeyspaceMetadata - null (exists false) when the keyspace is unknown (owner schema-auth).
    sources: [src/java/org/apache/cassandra/schema/Schema.java:318-324]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, required: [keyspace], properties: {keyspace: {type: string}}}
    response: {type: object, properties: {exists: {type: boolean}, name: {type: string}}}
    store: {table: keyspaces, op: get, key: "= input.keyspace", default: {exists: false}}
  - component: tracing
    name: new-session
    kind: function
    summary: Tracing.newSession - open a tracing session for this request (owner ops).
    sources: [src/java/org/apache/cassandra/tracing/Tracing.java:174-178]
    attributes: {boundary: true, owner: ops}
    response: {type: object, properties: {session_id: {type: string, examples: [5f0c2a40-7a9e-11ef-8f1a-3b2d4c5e6f70]}}}
  - component: tracing
    name: begin
    kind: function
    summary: Tracing.begin - record the request and its parameters in system_traces.sessions (owner ops).
    sources: [src/java/org/apache/cassandra/tracing/Tracing.java:236-239]
    attributes: {boundary: true, owner: ops}
    request: {type: object, properties: {request: {type: string}, parameters: {type: object}}}
  - component: tracing
    name: stop-session
    kind: function
    summary: Tracing.stopSession (owner ops).
    sources: [src/java/org/apache/cassandra/tracing/Tracing.java:201-215]
    attributes: {boundary: true, owner: ops}
  - component: storage-service
    name: get-nativeaddress
    kind: function
    summary: StorageService.getNativeaddress - an endpoint's native transport address from gossip (owner membership).
    sources: [src/java/org/apache/cassandra/service/StorageService.java:2446-2460]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {endpoint: {type: string}, with_port: {type: boolean}}}
    response: {type: object, properties: {native_address: {type: string, examples: ["n2:9042"]}}}
  - component: storage-service
    name: is-rpc-ready
    kind: function
    summary: StorageService.isRpcReady - whether the endpoint has gossiped RPC_READY (owner membership).
    sources: [src/java/org/apache/cassandra/service/StorageService.java:3074-3078]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {endpoint: {type: string}}}
    response: {type: object, properties: {ready: {type: boolean, default: true}}}

schemas:
  - id: TransportEnvelopeHeader
    summary: "Native protocol envelope header (Envelope.Header): version byte with direction bit, flags, 16-bit stream id, opcode, 32-bit body length."
    schema:
      type: object
      properties:
        version: {type: integer, default: 5, minimum: 1, maximum: 127}
        stream_id: {type: integer, default: 1}
        body_size: {type: integer, default: 96}
        tracing: {type: boolean, default: false}
        use_beta: {type: boolean, default: false}
  - id: TransportQueryOptions
    summary: "Wire QueryOptions as the transport reads them (decoded by cql3 QueryOptions.codec): consistency, page size, SKIP_METADATA, serial consistency, v5 keyspace."
    schema:
      type: object
      properties:
        consistency: {type: string, enum: [ANY, ONE, TWO, THREE, QUORUM, ALL, LOCAL_QUORUM, EACH_QUORUM, SERIAL, LOCAL_SERIAL, LOCAL_ONE, NODE_LOCAL], default: LOCAL_QUORUM}
        serial_consistency: {type: string, enum: [SERIAL, LOCAL_SERIAL], default: SERIAL}
        page_size: {type: integer, default: 5000}
        skip_metadata: {type: boolean, default: false}
        keyspace: {type: string, default: ""}
  - id: TransportStartupRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: false}
        client_address: {type: string, default: "10.0.1.5:51234"}
        options:
          type: object
          properties:
            CQL_VERSION: {type: string, default: "3.4.7"}
            COMPRESSION: {type: string, default: ""}
            DRIVER_NAME: {type: string, default: DataStax Java Driver}
            DRIVER_VERSION: {type: string, default: "4.17.0"}
            THROW_ON_OVERLOAD: {type: string, default: ""}
  - id: TransportOptionsRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: false}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
  - id: TransportAuthResponseRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: true}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
        username: {type: string, default: alice, description: "authnId of the SASL PLAIN token (authzId NUL authnId NUL password)"}
        password: {type: string, default: s3cret}
  - id: TransportRegisterRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: true}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
        event_types: {type: array, items: {type: string, enum: [TOPOLOGY_CHANGE, STATUS_CHANGE, SCHEMA_CHANGE, TRACE_COMPLETE]}, default: [TOPOLOGY_CHANGE, STATUS_CHANGE, SCHEMA_CHANGE]}
  - id: TransportQueryRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: true}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
        query: {type: string, default: "SELECT name, email FROM shop.users WHERE id = 'user:42'"}
        statement:
          description: "The structure the CQL grammar produces for the query (CqlStatement, owner cql); cql's parse takes it alongside the string."
          type: object
          default: {type: SELECT, keyspace: shop, table: users, fully_qualified: true, bind_markers: 0}
        options: {$ref: TransportQueryOptions}
  - id: TransportPrepareRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: true}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
        query: {type: string, default: "SELECT name, email FROM shop.users WHERE id = ?"}
        statement:
          description: The structure the CQL grammar produces for the query (CqlStatement, owner cql).
          type: object
          default: {type: SELECT, keyspace: shop, table: users, fully_qualified: true, bind_markers: 1}
        keyspace: {type: string, default: ""}
  - id: TransportExecuteRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: true}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
        statement_id: {type: string, default: "md5:SELECT name, email FROM shop.users WHERE id = ?"}
        result_metadata_id: {type: string, default: "meta:shop.users"}
        values: {type: array, default: ["user:42"]}
        options: {$ref: TransportQueryOptions}
  - id: TransportBatchRequest
    schema:
      type: object
      properties:
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: true}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
        batch_type: {type: integer, default: 0, minimum: 0, maximum: 255}
        queries:
          type: array
          default:
            - {kind: 0, query: "INSERT INTO shop.orders (id, user_id, total) VALUES (?, ?, ?)", statement: {type: INSERT, keyspace: shop, table: orders, fully_qualified: true, bind_markers: 3, partition_keys: [{partition_key: "order:1001", token: 1622840367226573521}], columns: {user_id: "user:42", total_cents: 1999}}, values: ["1001", "42", "19.99"]}
            - {kind: 1, id: "md5:UPDATE shop.users SET last_order = ? WHERE id = ?", values: ["1001", "user:42"]}
        options: {$ref: TransportQueryOptions}
  - id: TransportRoutedRequest
    summary: An inbound envelope with its decoded body, as it moves through the pipeline.
    schema:
      type: object
      required: [type, header]
      properties:
        type: {type: string, enum: [STARTUP, OPTIONS, AUTH_RESPONSE, CREDENTIALS, REGISTER, QUERY, PREPARE, EXECUTE, BATCH]}
        header: {$ref: TransportEnvelopeHeader}
        connection_version: {type: integer, default: 5}
        negotiated: {type: boolean, default: true}
        queue_time_ms: {type: integer, default: 0}
        client_address: {type: string, default: "10.0.1.5:51234"}
        message: {type: object}
  - id: TransportDispatchRequest
    summary: What the Dispatcher receives for one request (Message.Request, Overload state and queue wait).
    schema:
      type: object
      required: [type]
      properties:
        type: {type: string}
        version: {type: integer, default: 5}
        backpressure: {type: string, enum: [NONE, REQUESTS, BYTES_IN_FLIGHT, QUEUE_TIME], default: NONE}
        queue_time_ms: {type: integer, default: 0}
        tracing: {type: boolean, default: false}
        message: {type: object}
  - id: TransportResultMessage
    summary: "RESULT (opcode 8) body: Void, Rows, SetKeyspace, Prepared or SchemaChange (ResultMessage subclasses)."
    schema:
      type: object
      properties:
        kind: {type: string, enum: [VOID, ROWS, SET_KEYSPACE, PREPARED, SCHEMA_CHANGE], examples: [ROWS]}
        rows: {type: array, items: {type: object}, maxItems: 2}
        keyspace: {type: string, examples: [shop]}
        statement_id: {type: string, examples: [6b1f3c0e9a2d4e5f8a7b6c5d4e3f2a1b]}
        result_metadata_id: {type: string, examples: [c0ffee00c0ffee00c0ffee00c0ffee00]}
        metadata_changed: {type: boolean, default: false}
        skip_metadata: {type: boolean, default: false}
        applied: {type: boolean}
        has_more_pages: {type: boolean}
        warnings: {type: array, items: {type: string}}
  - id: TransportResponse
    summary: "The response message written back on the request's stream: READY, AUTHENTICATE, SUPPORTED, RESULT, AUTH_CHALLENGE or AUTH_SUCCESS (ERROR is the failure result)."
    schema:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [READY, AUTHENTICATE, SUPPORTED, RESULT, AUTH_CHALLENGE, AUTH_SUCCESS]}
        authenticator: {type: string}
        supported: {type: object}
        result: {$ref: TransportResultMessage}
        token: {type: string}
        warnings: {type: array, items: {type: string}}
        tracing_id: {type: string}
  - id: TransportEvent
    summary: "Event body: TOPOLOGY_CHANGE / STATUS_CHANGE (change, node address) or SCHEMA_CHANGE (change, target, keyspace, name)."
    schema:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [TOPOLOGY_CHANGE, STATUS_CHANGE, SCHEMA_CHANGE, TRACE_COMPLETE]}
        change: {type: string}
        address: {type: string}
        target: {type: string}
        keyspace: {type: string}
        name: {type: string}
  - id: TransportEventDelivery
    summary: An EVENT message delivered to one registered channel.
    schema:
      type: object
      properties:
        channel: {type: string}
        stream_id: {type: integer, const: -1}
        event: {$ref: TransportEvent}
        delivery: {type: string, enum: [pre-v5-write-and-flush, v5-flusher]}
  - id: TransportEndpointEvent
    summary: An IEndpointLifecycleSubscriber callback argument.
    schema:
      type: object
      required: [endpoint]
      properties:
        endpoint: {type: string, default: n2}
  - id: TransportSchemaChangeEvent
    summary: A SchemaChangeListener callback reduced to keyspace and element name.
    schema:
      type: object
      required: [keyspace]
      properties:
        keyspace: {type: string, default: shop}
        name: {type: string, default: users}

flows:
  - id: native-startup
    name: STARTUP on a new connection
    tags: [writes]
    description: "Fresh channel: the InitialConnectionHandler creates the ServerConnection, StartupMessage validates options and the connection becomes READY (AllowAllAuthenticator) or AUTHENTICATING."
    entry: {caller: cql-client, interface: transport.startup-message}
    sources: [src/java/org/apache/cassandra/transport/InitialConnectionHandler.java:98-157]
  - id: native-options
    name: OPTIONS before and after STARTUP
    entry: {caller: cql-client, interface: transport.options-message}
    sources: [src/java/org/apache/cassandra/transport/messages/OptionsMessage.java:62-79]
  - id: native-auth-response
    name: SASL AUTH_RESPONSE
    tags: [writes]
    entry: {caller: cql-client, interface: transport.auth-response-message}
    sources: [src/java/org/apache/cassandra/transport/messages/AuthResponse.java:72-98]
  - id: native-register
    name: REGISTER for server events
    tags: [writes]
    entry: {caller: cql-client, interface: transport.register-message}
    sources: [src/java/org/apache/cassandra/transport/messages/RegisterMessage.java:66-78]
  - id: native-query
    name: QUERY through admission, dispatch and the CQL layer
    entry: {caller: cql-client, interface: transport.query-message, deadline_ms: 12000}
    sources: [src/java/org/apache/cassandra/transport/messages/QueryMessage.java:102-133]
  - id: native-prepare
    name: PREPARE
    tags: [writes]
    entry: {caller: cql-client, interface: transport.prepare-message, deadline_ms: 12000}
    sources: [src/java/org/apache/cassandra/transport/messages/PrepareMessage.java:122-142]
  - id: native-execute
    name: EXECUTE a prepared statement
    entry: {caller: cql-client, interface: transport.execute-message, deadline_ms: 12000}
    sources: [src/java/org/apache/cassandra/transport/messages/ExecuteMessage.java:131-211]
  - id: native-batch
    name: BATCH of statements
    tags: [writes]
    entry: {caller: cql-client, interface: transport.batch-message, deadline_ms: 12000}
    sources: [src/java/org/apache/cassandra/transport/messages/BatchMessage.java:173-241]
  - id: auth-connection-storm
    name: Burst of AUTH_RESPONSE messages on the auth executor
    entry: {caller: cql-client, interface: cql-client.concurrent-auth-responses}
    sources: [src/java/org/apache/cassandra/transport/Dispatcher.java:63-80]
  - id: client-connection-accept
    name: Accept a client TCP connection
    entry: {caller: cql-client, interface: pipeline-configurator.configure-initial-pipeline}
    sources: [src/java/org/apache/cassandra/transport/PipelineConfigurator.java:152-170]
  - id: native-transport-start
    name: Start the native transport
    tags: [writes]
    entry: {caller: cassandra-node, interface: native-transport-service.start}
    sources: [src/java/org/apache/cassandra/service/CassandraDaemon.java:809-826]
  - id: native-transport-stop
    name: Stop the native transport
    tags: [writes]
    entry: {caller: cassandra-node, interface: native-transport-service.stop}
    sources: [src/java/org/apache/cassandra/service/CassandraDaemon.java:833-837]
  - id: endpoint-down-event
    name: Node DOWN pushed to registered clients
    tags: [writes]
    entry: {caller: membership, interface: server-event-notifier.on-down, input: {endpoint: n2}}
    sources: [src/java/org/apache/cassandra/transport/Server.java:479-511]
  - id: endpoint-up-event
    name: Node UP (with deferred NEW_NODE) pushed to registered clients
    entry: {caller: membership, interface: server-event-notifier.on-up, input: {endpoint: n2}}
    sources: [src/java/org/apache/cassandra/transport/Server.java:470-477]
  - id: endpoint-join-event
    name: Node joined pushed as NEW_NODE
    entry: {caller: membership, interface: server-event-notifier.on-join-cluster, input: {endpoint: n2}}
    sources: [src/java/org/apache/cassandra/transport/Server.java:449-456]
  - id: endpoint-leave-event
    name: Node left pushed as REMOVED_NODE
    entry: {caller: membership, interface: server-event-notifier.on-leave-cluster, input: {endpoint: n2}}
    sources: [src/java/org/apache/cassandra/transport/Server.java:458-462]
  - id: endpoint-move-event
    name: Node moved pushed as MOVED_NODE
    entry: {caller: membership, interface: server-event-notifier.on-move, input: {endpoint: n2}}
    sources: [src/java/org/apache/cassandra/transport/Server.java:464-468]
  - id: schema-change-event
    name: Table created pushed as SCHEMA_CHANGE
    entry: {caller: schema-auth, interface: server-event-notifier.on-create-table, input: {keyspace: shop, name: orders}}
    sources: [src/java/org/apache/cassandra/transport/Server.java:519-523]
  - id: client-permission-check
    name: Table permission check called by CQL statements
    entry: {caller: cql, interface: client-state.ensure-table-permission}
    sources: [src/java/org/apache/cassandra/service/ClientState.java:415-473]
  - id: client-not-anonymous-check
    name: Logged-in, non-anonymous check called by role and permission statements
    entry: {caller: schema-auth, interface: client-state.ensure-not-anonymous}
    sources: [src/java/org/apache/cassandra/service/ClientState.java:582-587]
  - id: client-use-keyspace
    name: USE keyspace on the session
    tags: [writes]
    entry: {caller: cql, interface: client-state.set-keyspace, input: {keyspace: shop}}
    sources: [src/java/org/apache/cassandra/service/ClientState.java:365-372]
  - id: request-timestamp
    name: Server-side write timestamp for a request
    entry: {caller: cql, interface: query-state.get-timestamp}
    sources: [src/java/org/apache/cassandra/service/QueryState.java:67-72]

scenarios:
  # ---------------------------------------------------------------- STARTUP
  - id: startup-ready-allow-all
    flow: native-startup
    name: "AllowAllAuthenticator: STARTUP answered READY"
    expect:
      - "result.ok && result.value.type == 'READY'"
      - "state['server-connection'].stage == 'READY' && state['client-state'].user == 'anonymous'"
      - "state['client-state'].driver_name == 'DataStax Java Driver'"
      - "ctx.pipeline == 'modern' && ctx.throw_on_overload == false"
      - "calls['dispatcher.dispatch'] == 0 && calls['dispatcher.process-request'] == 1"
  - id: startup-authenticate-password
    flow: native-startup
    fixtures: [auth-users]
    name: "PasswordAuthenticator: STARTUP answered AUTHENTICATE"
    expect:
      - "result.ok && result.value.type == 'AUTHENTICATE' && result.value.authenticator == 'org.apache.cassandra.auth.PasswordAuthenticator'"
      - "state['server-connection'].stage == 'AUTHENTICATING' && state['client-state'].user == ''"
  - id: startup-missing-cql-version
    flow: native-startup
    input: {options: {CQL_VERSION: ""}}
    expect:
      - "!result.ok && result.error.code == 'protocol-error' && result.error.status == 10"
      - "result.error.message == 'Missing value CQL_VERSION in STARTUP message'"
      - "state['server-connection'].stage == 'ESTABLISHED'"
      - "ctx.pipeline == 'modern'"
  - id: startup-cql-version-too-old
    flow: native-startup
    input: {options: {CQL_VERSION: "2.0.0"}}
    expect:
      - "!result.ok && result.error.code == 'protocol-error' && result.error.message.contains('not supported by the binary protocol')"
      - "state['server-connection'].stage == 'ESTABLISHED'"
  - id: startup-snappy-on-v5
    flow: native-startup
    input: {options: {COMPRESSION: snappy}}
    expect:
      - "!result.ok && result.error.message == 'Snappy compression is not supported in protocol V5'"
      - "state['server-connection'].stage == 'ESTABLISHED'"
  - id: startup-snappy-on-v4
    flow: native-startup
    input: {header: {version: 4}, connection_version: 4, options: {COMPRESSION: Snappy}}
    expect:
      - "result.ok && result.value.type == 'READY' && ctx.compression == 'snappy'"
      - "ctx.pipeline == 'legacy' && calls['pipeline-configurator.configure-modern-pipeline'] == 0"
      - "state['server-connection'].stage == 'READY' && state['pipeline-configurator'].pipeline == 'legacy'"
  - id: startup-unknown-compression
    flow: native-startup
    input: {options: {COMPRESSION: zstd}}
    expect:
      - "!result.ok && result.error.message == 'Unknown compression algorithm: zstd'"
      - "state['server-connection'].stage == 'ESTABLISHED'"
  - id: startup-protocol-v2-refused
    flow: native-startup
    input: {header: {version: 2}}
    expect:
      - "!result.ok && result.error.code == 'protocol-error' && result.error.message.startsWith('Invalid or unsupported protocol version (2)')"
      - "ctx.forced_protocol_version == 2 && calls['server-connection.new-connection'] == 0"
  - id: startup-beta-without-flag
    flow: native-startup
    input: {header: {version: 6}}
    expect:
      - "!result.ok && result.error.message.contains('USE_BETA flag is unset')"
  - id: startup-beta-with-flag
    flow: native-startup
    input: {header: {version: 6, use_beta: true}}
    expect:
      - "result.ok && state['server-connection'].version == 6"
  - id: startup-older-protocols-disallowed
    flow: native-startup
    input: {header: {version: 4}}
    config: {native-transport-allow-older-protocols: false}
    expect:
      - "!result.ok && result.error.message == 'Rejecting Protocol Version 4 < 5/v5.'"
  - id: startup-on-ready-connection
    flow: native-startup
    input: {negotiated: true}
    expect:
      - "!result.ok && result.error.code == 'protocol-error' && result.error.message == 'Unexpected message STARTUP, the connection is already initialized'"
      - "calls['initial-connection-handler.decode'] == 0 && calls['startup-message.execute'] == 0"
  - id: startup-throw-on-overload-option
    flow: native-startup
    input: {options: {THROW_ON_OVERLOAD: "1"}}
    expect:
      - "result.ok && ctx.throw_on_overload == true && state['cql-message-handler'].throw_on_overload == true"

  # ---------------------------------------------------------------- OPTIONS
  - id: options-before-startup
    flow: native-options
    expect:
      - "result.ok && result.value.type == 'SUPPORTED' && result.value.supported.PROTOCOL_VERSIONS == ['3/v3', '4/v4', '5/v5', '6/v6-beta']"
      - "ctx.options_answered_by == 'initial-connection-handler' && calls['dispatcher.process-request'] == 0"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'dispatcher.process-request')"
  - id: options-heartbeat-after-startup
    flow: native-options
    input: {negotiated: true}
    expect:
      - "result.ok && result.value.type == 'SUPPORTED' && result.value.supported.CQL_VERSION == ['3.4.7']"
      - "ctx.options_answered_by == 'options-message' && calls['dispatcher.dispatch'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'options-message.execute')"

  # ---------------------------------------------------------------- AUTH_RESPONSE
  - id: auth-response-success
    flow: native-auth-response
    fixtures: [three-node-rf3, auth-users]
    state:
      server-connection: {stage: AUTHENTICATING}
    expect:
      - "result.ok && result.value.type == 'AUTH_SUCCESS'"
      - "state['server-connection@n1'].stage == 'READY' && state['client-state@n1'].user == 'alice'"
      - "ctx.executor == 'Native-Transport-Auth-Requests' && ctx.auth == 'success'"
      - "calls['authenticated-user.can-login'] == 1"
  - id: auth-response-bad-credentials
    flow: native-auth-response
    fixtures: [three-node-rf3, auth-users]
    state:
      server-connection: {stage: AUTHENTICATING}
    faults:
      - {target: password-authenticator-plain-text-sasl-authenticator.get-authenticated-user, type: error, code: bad-credentials, status: 256, message: "Provided username alice and/or password are incorrect"}
    expect:
      - "!result.ok && result.error.code == 'bad-credentials' && result.error.status == 256"
      - "state['server-connection@n1'].stage == 'AUTHENTICATING' && state['client-state@n1'].user == '' && ctx.auth == 'failure'"
  - id: auth-response-role-lookup-fails
    flow: native-auth-response
    fixtures: [three-node-rf3, auth-users]
    state:
      server-connection: {stage: AUTHENTICATING}
    faults:
      - {target: authenticated-user.can-login, type: error, code: unavailable, status: 4096, message: "Cannot achieve consistency level LOCAL_ONE"}
    expect:
      - "!result.ok && result.error.code == 'bad-credentials' && result.error.message.startsWith('Unable to perform authentication')"
      - "state['server-connection@n1'].stage == 'AUTHENTICATING'"
  - id: auth-response-before-startup
    flow: native-auth-response
    fixtures: [three-node-rf3]
    state:
      server-connection: {stage: ESTABLISHED}
    expect:
      - "!result.ok && result.error.message == 'Unexpected message AUTH_RESPONSE, expecting STARTUP or OPTIONS'"
      - "calls['auth-response.execute'] == 0"
  - id: auth-response-without-auth-executor
    flow: native-auth-response
    fixtures: [three-node-rf3, auth-users]
    state:
      server-connection: {stage: AUTHENTICATING}
    config: {native-transport-max-auth-threads: 0}
    expect:
      - "result.ok && ctx.executor == 'Native-Transport-Requests'"
      - "state['server-connection@n1'].stage == 'READY'"

  # ---------------------------------------------------------------- REGISTER
  - id: register-events
    flow: native-register
    expect:
      - "result.ok && result.value.type == 'READY'"
      - "size(state['server-connection-tracker'].registrations) == 3 && 'STATUS_CHANGE:10.0.1.5:51234' in state['server-connection-tracker'].registrations"
  - id: register-trace-complete-on-v3
    flow: native-register
    input: {header: {version: 3}, connection_version: 3, event_types: [STATUS_CHANGE, TRACE_COMPLETE]}
    expect:
      - "!result.ok && result.error.message == 'Event TRACE_COMPLETE not valid for protocol version 3'"
      - "size(state['server-connection-tracker'].registrations) == 1"

  # ---------------------------------------------------------------- QUERY
  - id: query-rows
    flow: native-query
    fixtures: [three-node-rf3]
    expect:
      - "result.ok && result.value.type == 'RESULT'"
      - "calls['query-processor.parse'] == 1 && calls['query-processor.process'] == 1"
      - "ctx.executor == 'Native-Transport-Requests' && ctx.stage == 'READY' && !has(result.value.warnings)"
      - "state['client-resource-limits@n1'].endpoint_in_flight_bytes == 96"
  - id: query-page-size-zero
    flow: native-query
    fixtures: [three-node-rf3]
    input: {options: {page_size: 0}}
    expect:
      - "!result.ok && result.error.code == 'protocol-error' && result.error.message == 'The page size cannot be 0'"
      - "calls['query-processor.parse'] == 0"
  - id: query-syntax-error
    flow: native-query
    fixtures: [three-node-rf3]
    input: {query: "SELEC * FROM shop.users"}
    faults:
      - {target: query-processor.parse, type: error, code: syntax-error, status: 8192, message: "line 1:0 no viable alternative at input 'SELEC'"}
    expect:
      - "!result.ok && result.error.code == 'syntax-error' && result.error.status == 8192"
      - "calls['query-processor.process'] == 0"
  - id: query-unavailable
    flow: native-query
    fixtures: [three-node-rf3]
    faults:
      - {target: query-processor.process, type: error, code: unavailable, status: 4096, message: "Cannot achieve consistency level LOCAL_QUORUM"}
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
  - id: query-cas-unknown-v4-downgraded
    flow: native-query
    fixtures: [three-node-rf3]
    input: {header: {version: 4}, connection_version: 4, query: "UPDATE shop.users SET email = 'a@b.c' WHERE id = 42 IF EXISTS"}
    faults:
      - {target: query-processor.process, type: error, code: cas-write-unknown, status: 5888, message: "CAS operation result is unknown - proposal accepted by 1 but not a quorum."}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.status == 4352"
      - "ctx.error_downgraded_from == 'cas-write-unknown' && calls['pre-v5-handlers-legacy-dispatch-handler.channel-read0'] == 1"
  - id: query-cas-unknown-v5
    flow: native-query
    fixtures: [three-node-rf3]
    faults:
      - {target: query-processor.process, type: error, code: cas-write-unknown, status: 5888, message: "CAS operation result is unknown - proposal accepted by 1 but not a quorum."}
    expect:
      - "!result.ok && result.error.code == 'cas-write-unknown' && result.error.status == 5888 && !has(ctx.error_downgraded_from)"
  - id: query-read-failure-v3-downgraded
    flow: native-query
    fixtures: [three-node-rf3]
    input: {header: {version: 3}, connection_version: 3}
    faults:
      - {target: query-processor.process, type: error, code: read-failure, status: 4864, message: "Operation failed - received 1 responses and 1 failures"}
    expect:
      - "!result.ok && result.error.code == 'read-timeout' && result.error.status == 4608"
  - id: query-unexpected-exception
    flow: native-query
    fixtures: [three-node-rf3]
    faults:
      - {target: query-processor.process, type: error, code: null-pointer-exception, message: "NullPointerException"}
    expect:
      - "!result.ok && result.error.code == 'server-error' && result.error.status == 0 && ctx.error_downgraded_from == 'null-pointer-exception'"
  - id: query-server-shutting-down
    flow: native-query
    fixtures: [three-node-rf3]
    state:
      server-connection-tracker: {running: false}
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.status == 4097 && result.error.message == 'Server is shutting down'"
      - "calls['message-request.execute'] == 0 && ctx.shutting_down"
  - id: query-timed-out-in-queue
    flow: native-query
    fixtures: [three-node-rf3]
    input: {queue_time_ms: 12500}
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.message == 'Query timed out before it could start'"
      - "calls['server-connection.validate-new-message'] == 0 && calls['query-processor.parse'] == 0"
  - id: query-throw-on-overload-bytes-in-flight
    flow: native-query
    fixtures: [three-node-rf3]
    state:
      cql-message-handler: {throw_on_overload: true}
      client-resource-limits: {endpoint_in_flight_bytes: 107374150}
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.message.startsWith('Request breached limit on bytes in flight')"
      - "calls['dispatcher.dispatch'] == 0 && ctx.request_discarded && ctx.overload == 'BYTES_IN_FLIGHT'"
      - "state['client-resource-limits@n1'].endpoint_in_flight_bytes == 107374150"
  - id: query-backpressure-bytes-in-flight
    flow: native-query
    fixtures: [three-node-rf3]
    state:
      client-resource-limits: {endpoint_in_flight_bytes: 107374150}
    expect:
      - "result.ok && ctx.connection_paused && ctx.backpressure == 'BYTES_IN_FLIGHT'"
      - "result.value.warnings[0].contains('bytes in flight')"
      - "state['client-resource-limits@n1'].endpoint_in_flight_bytes == 107374246"
  - id: query-rate-limited-throw
    flow: native-query
    fixtures: [three-node-rf3]
    state:
      cql-message-handler: {throw_on_overload: true}
      client-resource-limits: {permit_available: false}
    config: {native-transport-rate-limiting-enabled: true}
    expect:
      - "!result.ok && result.error.code == 'overloaded' && result.error.message.contains('requests/second')"
      - "ctx.overload == 'REQUESTS' && state['client-resource-limits@n1'].endpoint_in_flight_bytes == 0 && calls['client-resource-limits.release'] == 1"
  - id: query-rate-limited-backpressure
