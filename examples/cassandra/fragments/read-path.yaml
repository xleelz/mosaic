    'on': n1
    input:
      track_warnings: true
    as: r
  state:
    tracker@n1:
      views:
        shop.users:
          sstables:
          - id: nb-1
            size_mb: 10
            level: 0
            repaired: false
            pending_repair: ''
            max_timestamp: 1000
            read_rate: 0.0
            partitions:
              user:42:
                cells:
                - column: name
                  value: Ada
                  timestamp: 1000
                size_bytes: 4096
  config:
    read-thresholds-enabled: true
    local-read-size-fail-threshold-kib: 1
  expect:
  - result.ok && result.value.warnings == ['local-read-size-too-large'] && trace.exists(e, e.interface == 'read-command.execute-locally' && e.error != null)
- id: read-unindexed-column-filters-storage
  name: An expression on an unindexed column has no index plan; the range is read from storage
  fixtures:
