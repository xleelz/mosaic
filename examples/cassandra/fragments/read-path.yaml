  - interface: secondary-index-manager.truncate-all-indexes-blocking
    caller: operator
    'on': n1
    as: t
    input:
      truncated_at: 5
  expect:
  - ctx.indexes_truncated && trace.exists(e, e.interface == 'active-compactions.begin-compaction' && e.input.type == 'VIEW_BUILD') && size(state['active-compactions@n1'].compactions) == 0
- id: counter-read-before-write
  name: The single-partition local read used by counters returns the partition (tombstones included)
  fixtures:
