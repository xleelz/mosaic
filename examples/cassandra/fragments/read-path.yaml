  - flow: enable-auto-compaction
    as: e
  - interface: tracker.get-view
    caller: operator
    'on': n1
    input:
      keyspace: shop
      table: users
    as: rb
  expect:
  - result.value.auto_compaction_enabled && size(result.value.sstables) == 1 && state['tracker@n1'].views['shop.users'].auto_compaction_enabled
- id: rebuild-index-then-index-read
  flow: rebuild-secondary-index
  name: Rebuilding a non-queryable index makes the next 2i read succeed
  fixtures:
  - one-node
  state:
    secondary-index-manager:
      non_queryable:
      - users_email_idx
  steps:
  - flow: rebuild-secondary-index
    as: r
  - flow: replica-read
    'on': n1
    input:
      read_command:
        kind: partition_range
        keyspace: shop
        table: users
        partition_key: ''
        token: 4242
        limit: 100
        index_expression:
          column: email
          value: ada@example.com
    as: rd
  expect:
  - steps.r.result.value.rebuilt == ['users_email_idx'] && result.ok && size(state['secondary-index-manager@n1'].non_queryable) == 0
- id: flush-then-read
  flow: flush-adds-sstable
  name: A flushed sstable becomes live and the next read returns its data
  fixtures:
  - one-node
  steps:
  - flow: flush-adds-sstable
    as: f
  - flow: replica-read
    'on': n1
    input:
      read_command:
        kind: single_partition
        keyspace: shop
        table: users
        partition_key: user:42
        token: 4242
        limit: 100
    as: rd
  expect:
  - result.ok && result.value.partitions[0].cells[0].value == 'Flushed' && state['tracker@n1'].views['shop.users'].sstables.exists(s, s.id == 'nb-50')
- id: flush-new-table-then-read
  flow: flush-adds-sstable
  name: The first sstable of a table creates its View
  fixtures:
  - one-node
  steps:
  - flow: flush-adds-sstable
    input:
      table: orders
    as: f
  - interface: tracker.get-view
    caller: operator
    'on': n1
    input:
      keyspace: shop
      table: orders
    as: rb
  expect:
  - result.value.sstables[0].id == 'nb-50' && !has(result.value.missing) && size(state['tracker@n1'].views['shop.orders'].sstables) == 1
- id: incremental-repair-finalized-promotes
  flow: incremental-repair-pending
  name: Anticompaction marks the sstables pending; after the session is FINALIZED the next background check promotes them to repaired
  fixtures:
  - one-node
  state:
    local-sessions:
      sessions:
        s1:
          session_id: s1
          state: PREPARING
  steps:
  - flow: incremental-repair-pending
    as: pac
  - flow: background-compaction
    as: while_running
  - interface: local-sessions.save-session
    caller: repair-streaming
    'on': n1
    input:
      key: s1
      row:
        session_id: s1
        state: FINALIZED
  - flow: background-compaction
    as: after
  expect:
  - steps.pac.result.value.marked == 4
  - state['tracker@n1'].views['shop.users'].sstables.all(s, s.repaired && s.pending_repair == '')
  - ctx.repair_finished == 'promoted' && size(state['compaction-task@n1'].history) == 1
- id: incremental-repair-failed-demotes
  flow: incremental-repair-pending
  name: A failed session sends its pending sstables back to unrepaired
  fixtures:
  - one-node
  state:
    local-sessions:
      sessions:
        s1:
          session_id: s1
          state: FAILED
  steps:
  - flow: incremental-repair-pending
    as: pac
  - interface: tracker.get-view
    caller: operator
    'on': n1
    input:
      keyspace: shop
      table: users
    as: mid
  - flow: background-compaction
    as: bc
  expect:
  - steps.mid.result.value.sstables.all(s, s.pending_repair == 's1')
  - ctx.repair_finished == 'demoted'
  - state['tracker@n1'].views['shop.users'].sstables.all(s, !s.repaired && s.pending_repair == '')
- id: coordinator-local-read-warning-to-clientwarn
  flow: coordinator-local-read
  name: On the coordinator's own read a tombstone warning goes to ClientWarn on n1 (W3)
  fixtures:
  - three-node-rf3
  state:
    tracker@n1:
      views:
        shop.users:
          sstables:
          - id: nb-1
            size_mb: 10
            level: 0
            repaired: false
            pending_repair: ''
            droppable_tombstone_ratio: 0.0
            age_s: 3600
            fully_expired: false
            tombstones: 0
            purgeable_tombstones: 0
            unowned_mb: 0
            window: 0
            read_rate: 0.0
            max_timestamp: 1000
            partitions:
              user:42:
                cells:
                - column: name
                  value: Ada
                  timestamp: 1000
                tombstones: 5000
  expect:
  - result.ok && state['read-command@n1'].tombstone_warnings == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'client-warn.warn' && e.instance == 'n1' && e.input.text.contains('5000 tombstone cells'))
- id: cache-set-capacity-each-cache
  name: setcachecapacity resizes each cache
  fixtures:
