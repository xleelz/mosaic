- component: index-summary-manager
  name: set-resize-interval-in-minutes
  kind: jmx
  summary: 'JMX ResizeIntervalInMinutes setter: reschedule the redistribution task, keeping elapsed time; a negative interval cancels it.'
  attributes:
    mbean: org.apache.cassandra.db:type=IndexSummaries
    attribute: ResizeIntervalInMinutes
  sources:
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:116-148
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManagerMBean.java:49
  request:
    type: object
    required:
    - minutes
    properties:
      minutes:
        type: integer
        examples:
        - 30
      elapsed_minutes:
        type: integer
        default: 0
  behavior:
  - set:
      vars.old: = state.resize_interval_minutes
      vars.elapsed: '= has(input.elapsed_minutes) ? input.elapsed_minutes : 0'
      state.resize_interval_minutes: = input.minutes
  - if: input.minutes < 0
    then:
    - title: Negative interval; cancel and do not reschedule
      source: src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:134-138
      set:
        state.scheduled: false
    - return:
        scheduled: false
  - title: Reschedule with the remaining delay and the new fixed delay
    source: src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:122-147
    set:
      state.scheduled: true
      state.initial_delay_minutes: '= !state.scheduled || vars.old < 0 ? input.minutes : (input.minutes - vars.elapsed > 0 ? input.minutes - vars.elapsed : 0)'
  - return:
      scheduled: true
      initial_delay_minutes: = state.initial_delay_minutes
