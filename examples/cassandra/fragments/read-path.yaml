- component: column-family-store
  name: force-compaction-keys-ignoring-gc-grace
  kind: function
  summary: Compact the sstables holding the given keys, purging their tombstones regardless of gc_grace_seconds.
  sources:
  - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2559-2577
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
        examples:
        - shop
      table:
        type: string
        examples:
        - users
      keys:
        type: array
        items:
          type: string
        default:
        - user:42
  response:
    type: object
    properties:
      compacted:
        type: integer
  behavior:
  - set:
      vars.replica: = self
  - call: tracker.get-view
    input:
      replica: = vars.replica
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.ids: = vars.view.value.sstables.filter(s, !(s.id in vars.view.value.compacting)).map(s, s.id)
  - if: size(vars.ids) == 0
    then:
    - title: No sstables hold the keys
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1036-1040
      return:
        compacted: 0
  - call: tracker.try-modify
    input:
      replica: = vars.replica
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.ids
      compacting: = vars.view.value.compacting
  - title: The keys go into partitionKeySetIgnoreGcGrace, so the purger drops all of their tombstones
    source: src/java/org/apache/cassandra/db/compaction/CompactionIterator.java:386-390
