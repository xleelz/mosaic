schema_version: 1
id: cassandra
components:
- id: read-command-verb-handler
  name: ReadCommandVerbHandler
  kind: function
  parent: read-path
  layer: storage
  summary: Replica-side handler of READ_REQ and RANGE_REQ; runs the command locally and replies with data or a digest.
  sources:
  - src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:42-135
  state:
    initial:
      out_of_range_reads: 0
      dropped_reads: 0
- id: read-command
  name: ReadCommand
  kind: function
  parent: read-path
  layer: storage
  summary: 'Executes a read locally: picks an index searcher or storage, purges, enforces tombstone and read-size thresholds, applies limits.'
  sources:
  - src/java/org/apache/cassandra/db/ReadCommand.java:426-503
  state:
    initial:
      tombstone_warnings: 0
      tombstone_failures: 0
- id: single-partition-read-command
  name: SinglePartitionReadCommand
  kind: module
  parent: read-path
  layer: storage
  summary: Reads one partition through the row cache or by merging memtables and sstables.
  sources:
  - src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:487-855
  state:
    initial:
      row_cached_tables: []
- id: partition-range-read-command
  name: PartitionRangeReadCommand
  kind: module
  parent: read-command
  layer: storage
  summary: Sequential scan of a token range over memtables and the live sstables that intersect it.
  sources:
  - src/java/org/apache/cassandra/db/PartitionRangeReadCommand.java:312-380
- id: read-execution-controller
  name: ReadExecutionController
  kind: module
  parent: read-command
  layer: storage
  summary: Holds the read OpOrder group for the base table (and the index table), and whether repaired data is tracked.
  sources:
  - src/java/org/apache/cassandra/db/ReadExecutionController.java:129-171
- id: big-table-reader
  name: BigTableReader
  kind: module
  parent: read-path
  layer: storage
  summary: 'BIG-format sstable reader: min/max key range, bloom filter, key cache, index summary and index scan to find a partition.'
  description: 'The deployed format is BIG: sstable.selected_format is commented out in conf/cassandra.yaml and Config.java defaults to BigFormat.NAME. With storage_compatibility_mode CASSANDRA_4 the written
    version is "nb".'
  sources:
  - src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:126-134
  - src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:214-361
  - src/java/org/apache/cassandra/config/Config.java:373
  state:
    initial:
      key_cache_enabled: true
      suspect: []
- id: bti-table-reader
  name: BtiTableReader
  kind: module
  parent: read-path
  layer: storage
  summary: 'Trie-indexed (BTI) sstable reader: min/max keys, bloom filter, then the partition trie; no key cache. Not the deployed format.'
  sources:
  - src/java/org/apache/cassandra/io/sstable/format/bti/BtiTableReader.java:222-260
- id: sstable-reader-global-tidy
  name: SSTableReader.GlobalTidy
  kind: module
  parent: read-path
  layer: storage
  summary: Per-sstable shared state; syncs the sstable's read meter to system.sstable_activity every five minutes when enabled.
  sources:
  - src/java/org/apache/cassandra/io/sstable/format/SSTableReader.java:1632-1660
  state:
    initial:
      obsolete: false
      keyspace: shop
      persisted: 0
- id: auto-saving-cache
  name: AutoSavingCache
  kind: module
  parent: read-path
  layer: storage
  summary: 'The key, row and counter caches (CacheService instances): lookups, periodic saving to saved_caches and loading at startup.'
  description: 'key_cache_size is empty in cassandra.yaml (auto: min(5% heap, 100MiB)), row_cache_size is 0MiB (row cache off), key_cache_save_period 4h, row_cache_save_period 0s, counter_cache_save_period
    7200s. The three cache instances are tables of this component''s state; the schema version written into saved caches mirrors Schema.instance.getVersion().'
  sources:
  - src/java/org/apache/cassandra/cache/AutoSavingCache.java:71-293
  state:
    initial:
      key_cache: {}
      row_cache: {}
      counter_cache: {}
      schema_version: 59adb24e-f3cd-3e02-97f0-5b395827453f
      key_cache_save_scheduled: false
      row_cache_save_scheduled: false
      counter_cache_save_scheduled: false
  tags:
  - incidental
- id: auto-saving-cache-writer
  name: AutoSavingCache.Writer
  kind: function
  parent: auto-saving-cache
  layer: storage
  summary: Writes one cache's keys to the saved_caches directory (temp file then rename), as a compaction-tracked operation.
  sources:
  - src/java/org/apache/cassandra/cache/AutoSavingCache.java:295-460
- id: compaction-manager
  name: CompactionManager
  kind: module
  parent: read-path
  layer: storage
  summary: Schedules background, major, user-defined and cleanup compactions on the compaction executor; cache writes; stop and pause.
  description: 'concurrent_compactors is commented out in cassandra.yaml, so DatabaseDescriptor sets min(8, max(2, min(cores, data dirs))): 2 with one data directory. compaction_throughput is 64MiB/s. automatic_sstable_upgrade
    is commented out (Config default false). compacting_cf_count stands for CompactionManager.compactingCF for the table under test and is seeded, not maintained.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:141-263
  - src/java/org/apache/cassandra/config/DatabaseDescriptor.java:777-778
  state:
    initial:
      executor_active_tasks: 0
      compacting_cf_count: 0
      global_compaction_pause_count: 0
      flush_in_progress: []
      next_generation: 500
      cache_writes: 0
- id: compaction-manager-background-compaction-candidate
  name: CompactionManager.BackgroundCompactionCandidate
  kind: function
  parent: compaction-manager
  layer: storage
  summary: The executor task that asks the strategy for the next background task when it runs, executes it, and resubmits if it compacted.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:343-409
- id: compaction-strategy-manager
  name: CompactionStrategyManager
  kind: module
  parent: read-path
  layer: storage
  summary: Holds a strategy instance per repaired, unrepaired and pending-repair group; hands out background, maximal and user-defined tasks.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:197-239
  - src/java/org/apache/cassandra/schema/CompactionParams.java:79-104
- id: size-tiered-compaction-strategy
  name: SizeTieredCompactionStrategy
  kind: strategy
  parent: compaction-strategy-manager
  layer: storage
  summary: 'Default strategy: compacts a bucket of 4 to 32 similar-size sstables, else one sstable with enough droppable tombstones.'
  description: 'default_compaction is commented out in cassandra.yaml, so CompactionParams.DEFAULT is SizeTieredCompactionStrategy with min_threshold 4 and max_threshold 32. Bucket options: bucket_low 0.5,
    bucket_high 1.5, min_sstable_size 50MiB. Tombstone compaction: tombstone_threshold 0.2, tombstone_compaction_interval 86400s.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:79-230
  - src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategyOptions.java:26-28
  - src/java/org/apache/cassandra/db/compaction/AbstractCompactionStrategy.java:69-72
- id: leveled-compaction-strategy
  name: LeveledCompactionStrategy
  kind: strategy
  parent: compaction-strategy-manager
  layer: storage
  summary: 'Leveled compaction: 160MiB sstables, fanout 10; asks the manifest for candidates, falls back to a tombstone compaction.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/LeveledCompactionStrategy.java:131-182
- id: leveled-manifest
  name: LeveledManifest
  kind: module
  parent: leveled-compaction-strategy
  layer: storage
  summary: Scores levels; size-tiers L0 first when it holds more than 32 sstables and a higher level needs work.
  sources:
  - src/java/org/apache/cassandra/db/compaction/LeveledManifest.java:199-317
  state:
    initial:
      disable_stcs_in_l0: false
      max_sstable_size_mb: 160
      level_max_mb:
        '1': 1600
        '2': 16000
        '3': 160000
        '4': 1600000
        '5': 16000000
        '6': 160000000
        '7': 1600000000
        '8': 16000000000
- id: time-window-compaction-strategy
  name: TimeWindowCompactionStrategy
  kind: strategy
  parent: compaction-strategy-manager
  layer: storage
  summary: 'Buckets sstables by time window: STCS inside the current window, whole older windows with 2 or more sstables, plus fully expired sstables.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/TimeWindowCompactionStrategy.java:83-361
- id: unified-compaction-strategy
  name: UnifiedCompactionStrategy
  kind: strategy
  parent: compaction-strategy-manager
  layer: storage
  summary: 'UCS with the default scaling parameter T4: compacts a density level once it holds 4 sstables, plus fully expired sstables.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/UnifiedCompactionStrategy.java:220-344
  - src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:612
- id: compaction-task
  name: CompactionTask
  kind: function
  parent: read-path
  layer: storage
  summary: 'Runs one compaction: expired-sstable drop, disk space check, merge with tombstone purge, write, commit, history.'
  description: snapshot_before_compaction is false in cassandra.yaml. disk_free_mb stands for Directories.hasDiskSpaceForCompactionsAndStreams; history stands for system.compaction_history. capacity 2 =
    concurrent_compactors (DatabaseDescriptor default with one data directory).
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionTask.java:122-299
  - src/java/org/apache/cassandra/db/compaction/AbstractCompactionTask.java:96-112
  state:
    initial:
      disk_free_mb: 1000000
      next_generation: 100
      history: []
      aborted: 0
  capacity:
    concurrency: 2
- id: compaction-controller
  name: CompactionController
  kind: module
  parent: compaction-task
  layer: storage
  summary: 'Decides which tombstones are purgeable: older than gc_grace and shadowing nothing in overlapping sstables or memtables.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionController.java:245-284
- id: compaction-iterator
  name: CompactionIterator
  kind: module
  parent: compaction-task
  layer: storage
  summary: Merges the input scanners, purges tombstones through the controller and aborts when a stop is requested.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionIterator.java:341-410
  - src/java/org/apache/cassandra/db/compaction/CompactionIterator.java:720-746
- id: active-compactions
  name: ActiveCompactions
  kind: registry
  parent: compaction-manager
  layer: storage
  summary: 'The registry of running operations (CompactionInfo.Holder): compactions, cache saves, index summary redistribution; stop flags.'
  description: stop_requested_types is a scenario lever for a stopCompaction(type) that arrives while an operation is running.
  sources:
  - src/java/org/apache/cassandra/db/compaction/ActiveCompactions.java:38-55
  - src/java/org/apache/cassandra/db/compaction/CompactionInfo.java:249-269
  state:
    initial:
      compactions: []
      stop_requested_types: []
- id: tracker
  name: Tracker
  kind: datastore
  parent: read-path
  layer: storage
  summary: 'Owns each table''s View: the live sstables and the set marked compacting; atomic view swaps.'
  description: 'Each row also carries the table''s compaction parameters (strategy, thresholds, enabled), which really live in the table''s schema and the CompactionStrategyManager; the model keeps them
    beside the view. Each sstable entry also holds its partitions ({pk: {cells, deletion_ts, tombstones, purgeable_tombstones}}), max_timestamp, read_rate (hotness) and pending_repair. The View is per instance.'
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/Tracker.java:115-150
  state:
    initial:
      views:
        shop.users:
          auto_compaction_enabled: true
          strategy: SizeTieredCompactionStrategy
          min_threshold: 4
          max_threshold: 32
          compacting: []
          sstables:
          - id: nb-1
            size_mb: 10
            level: 0
            repaired: false
            droppable_tombstone_ratio: 0.0
            age_s: 3600
            fully_expired: false
            tombstones: 100
            purgeable_tombstones: 40
            unowned_mb: 0
            window: 0
            pending_repair: ''
            read_rate: 0.0
            max_timestamp: 1000
          - id: nb-2
            size_mb: 12
            level: 0
            repaired: false
            droppable_tombstone_ratio: 0.0
            age_s: 3000
            fully_expired: false
            tombstones: 50
            purgeable_tombstones: 0
            unowned_mb: 0
            window: 0
            pending_repair: ''
            read_rate: 0.0
            max_timestamp: 1001
          - id: nb-3
            size_mb: 9
            level: 0
            repaired: false
            droppable_tombstone_ratio: 0.0
            age_s: 2000
            fully_expired: false
            tombstones: 0
            purgeable_tombstones: 0
            unowned_mb: 0
            window: 0
            pending_repair: ''
            read_rate: 0.0
            max_timestamp: 1002
          - id: nb-4
            size_mb: 11
            level: 0
            repaired: false
            droppable_tombstone_ratio: 0.0
            age_s: 1000
            fully_expired: false
            tombstones: 10
            purgeable_tombstones: 10
            unowned_mb: 0
            window: 0
            pending_repair: ''
            read_rate: 0.0
            max_timestamp: 1003
- id: lifecycle-transaction
  name: LifecycleTransaction
  kind: module
  parent: tracker
  layer: storage
  summary: 'Transaction over sstable replacement: prepare (log obsoletions), commit (point of no return) or abort (restore originals).'
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/LifecycleTransaction.java:215-300
- id: index-summary-manager
  name: IndexSummaryManager
  kind: executor
  parent: read-path
  layer: storage
  summary: Periodically redistributes the fixed index summary memory pool across BIG sstables by read rate (every 60 minutes).
  description: 'index_summary_resize_interval is 60m in cassandra.yaml; index_summary_capacity is empty (auto: 5% of heap).'
  sources:
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:100-148
  state:
    initial:
      resize_interval_minutes: 60
      scheduled: true
      initial_delay_minutes: 60
      redistributions: 0
- id: index-summary-redistribution
  name: IndexSummaryRedistribution
  kind: function
  parent: index-summary-manager
  layer: storage
  summary: Resamples each sstable's index summary up or down so the total fits the pool; runs as a global compaction-tracked operation.
  sources:
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryRedistribution.java:363-366
- id: secondary-index-manager
  name: SecondaryIndexManager
  kind: module
  parent: read-path
  layer: storage
  summary: 'Per-table index registry: picks the best index query plan for a row filter and refuses non-queryable indexes.'
  description: default_secondary_index is commented out in cassandra.yaml, so CREATE INDEX without USING builds legacy_local_table (CassandraIndex).
  sources:
  - src/java/org/apache/cassandra/index/SecondaryIndexManager.java:314-321
  - src/java/org/apache/cassandra/index/SecondaryIndexManager.java:1245-1290
  - src/java/org/apache/cassandra/config/Config.java:900
  state:
    initial:
      indexes:
        shop.users.email:
          name: users_email_idx
          kind: legacy_local_table
          sstable_indexes: 0
        shop.users.city:
          name: users_city_sai
          kind: sai
          sstable_indexes: 3
      non_queryable: []
- id: cassandra-index-searcher
  name: CassandraIndexSearcher
  kind: module
  parent: secondary-index-manager
  layer: storage
  summary: 'Legacy 2i search: read the hidden index table partition for the value, then fetch and re-check each base partition.'
  sources:
  - src/java/org/apache/cassandra/index/internal/CassandraIndexSearcher.java:56-103
- id: storage-attached-index-searcher
  name: StorageAttachedIndexSearcher
  kind: module
  parent: secondary-index-manager
  layer: storage
  summary: 'SAI search: build the per-sstable index view (guardrail on referenced indexes), iterate matching primary keys, fetch rows.'
  sources:
  - src/java/org/apache/cassandra/index/sai/plan/StorageAttachedIndexSearcher.java:82-171
- id: query-controller
  name: QueryController (SAI)
  kind: module
  parent: storage-attached-index-searcher
  layer: storage
  summary: Enforces the sai_sstable_indexes_per_query warn (32) and fail (-1, disabled) guardrail.
  sources:
  - src/java/org/apache/cassandra/index/sai/plan/QueryController.java:323-345
  - src/java/org/apache/cassandra/config/Config.java:939-940
- id: index-status-manager
  name: IndexStatusManager
  kind: module
  parent: read-path
  layer: storage
  summary: 'Coordinator-side: drops replicas whose index is not queryable (from gossiped status) and fails the read when too few remain.'
  sources:
  - src/java/org/apache/cassandra/index/IndexStatusManager.java:64-133
  state:
    initial:
      peer_index_status: {}
- id: cells
  name: Cells
  kind: function
  parent: read-path
  layer: storage
  summary: Cell reconciliation rules (Cells.reconcile).
  sources:
  - src/java/org/apache/cassandra/db/rows/Cells.java:80-128
- id: pending-repair-manager
  name: PendingRepairManager
  kind: module
  parent: compaction-strategy-manager
  layer: storage
  summary: Holds sstables of incremental repair sessions in progress and promotes or demotes them when the session completes.
  sources:
  - src/java/org/apache/cassandra/db/compaction/PendingRepairManager.java:61-540
- id: pending-repair-manager-repair-finished-compaction-task
  name: PendingRepairManager.RepairFinishedCompactionTask
  kind: function
  parent: pending-repair-manager
  layer: storage
  summary: Metadata-only task moving a finished session's sstables out of pending.
  sources:
  - src/java/org/apache/cassandra/db/compaction/PendingRepairManager.java:498-540
- id: client-warn
  name: ClientWarn
  kind: function
  parent: transport
  layer: protocol
  tags:
  - incidental
  summary: Boundary stub for transport's ClientWarn.
  attributes:
    boundary: true
    owner: transport
- id: local-sessions
  name: LocalSessions
  kind: module
  parent: repair-streaming
  summary: Boundary stub for repair-streaming's LocalSessions.
  attributes:
    boundary: true
    owner: repair-streaming
- id: column-family-store
  name: ColumnFamilyStore (flush and truncate)
  kind: module
  layer: storage
  parent: write-path
  summary: Boundary stub for write-path's ColumnFamilyStore; read-path defines its compaction, threshold and index operations.
  attributes:
    boundary: true
    owner: write-path
- id: skip-list-memtable
  name: SkipListMemtable
  kind: datastore
  parent: write-path
  layer: storage
  summary: Boundary stub for write-path's default memtable; its cells table is the replica's readable copy of written data.
  attributes:
    boundary: true
    owner: write-path
- id: storage-service
  name: StorageService
  kind: module
  parent: membership
  summary: Boundary stub for membership's node lifecycle state.
  attributes:
    boundary: true
    owner: membership
- id: token-metadata
  name: TokenMetadata
  kind: module
  parent: membership
  summary: Boundary stub for membership's token ring and pending ranges.
  attributes:
    boundary: true
    owner: membership
schemas:
- id: ReadPathReadCommand
  summary: A ReadCommand as sent in READ_REQ / RANGE_REQ (SinglePartitionReadCommand or PartitionRangeReadCommand), the shared read_command shape.
  schema:
    type: object
    required:
    - keyspace
    - table
    properties:
      kind:
        type: string
        enum:
        - single_partition
        - partition_range
        default: single_partition
      keyspace:
        type: string
        examples:
        - shop
      table:
        type: string
        examples:
        - users
      partition_key:
        type: string
        examples:
        - user:42
      token:
        type: integer
        examples:
        - 4242
      start_token:
        type: integer
        default: -9223372036854775807
      end_token:
        type: integer
        default: 9223372036854775807
      columns:
        default: []
      limit:
        type: integer
        default: 100
      digest:
        type: boolean
        default: false
      index_expression:
        type: object
        default: {}
        properties:
          column:
            type: string
          value:
            type: string
- id: ReadPathCell
  summary: One live cell after reconciliation (the newest write per column wins).
  schema:
    type: object
    properties:
      column:
        type: string
        examples:
        - name
      value:
        examples:
        - Ada
      timestamp:
        type: integer
        examples:
        - 1700000000000000
      deleted:
        type: boolean
        default: false
- id: ReadPathPartition
  summary: 'One partition in a read result, unfiltered: tombstone cells (deleted true) and the partition deletion (deletion_ts, -1 when none) travel with the data.'
  schema:
    type: object
    properties:
      partition_key:
        type: string
        examples:
        - user:42
      cells:
        type: array
        items:
          $ref: ReadPathCell
      timestamp:
        type: integer
        examples:
        - 1700000000000000
      deletion_ts:
        type: integer
        default: -1
- id: ReadPathReadResponse
  summary: 'ReadResponse: a data response (partitions) or a digest response; the READ_RSP / RANGE_RSP payload.'
  schema:
    type: object
    properties:
      from:
        type: string
        examples:
        - n1
      digest_response:
        type: boolean
        default: false
      digest:
        type: string
        examples:
        - md5:user:42|name=Ada@1700000000000000
      partitions:
        type: array
        default: []
        items:
          $ref: ReadPathPartition
      repaired_data_tracked:
        type: boolean
        default: false
      warnings:
        type: array
        items:
          type: string
- id: ReadPathLocalResult
  summary: What executeLocally hands to createResponse.
  schema:
    type: object
    properties:
      partitions:
        type: array
        items:
          $ref: ReadPathPartition
      tombstones_scanned:
        type: integer
      size_bytes:
        type: integer
      used_index:
        type: boolean
      repaired_data_tracked:
        type: boolean
- id: ReadPathStorageResult
  summary: Merged memtable and sstable output for one query, before purging and thresholds.
  schema:
    type: object
    properties:
      partitions:
        type: array
        items:
          $ref: ReadPathPartition
      tombstones:
        type: integer
      purgeable_tombstones:
        type: integer
      sstables_iterated:
        type: integer
      size_bytes:
        type: integer
- id: ReadPathTableRef
  summary: Identifies a table; the instance is the one the call runs on.
  schema:
    type: object
    properties:
      replica:
        type: string
        examples:
        - n1
      keyspace:
        type: string
        examples:
        - shop
      table:
        type: string
        examples:
        - users
- id: ReadPathCompactionTaskSpec
  summary: A compaction task handed out by a strategy.
  schema:
    type: object
    properties:
      found:
        type: boolean
      sstable_ids:
        type: array
        items:
          type: string
      operation_type:
        type: string
      level:
        type: integer
- id: ReadPathAllSSTableOpStatus
  summary: CompactionManager.AllSSTableOpStatus.
  schema:
    type: object
    properties:
      status:
        type: string
        enum:
        - SUCCESSFUL
        - ABORTED
        - UNABLE_TO_CANCEL
      status_code:
        type: integer
interfaces:
- component: read-command-verb-handler
  name: do-verb
  kind: verb
  summary: 'Handle READ_REQ / RANGE_REQ on the replica instance it is sent to: bootstrap and token-range checks, local execution, data or digest reply (tombstones included).'
  attributes:
    verb: READ_REQ
    verbs:
    - READ_REQ
    - RANGE_REQ
    stage: READ
  sources:
  - src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:50-135
  - src/java/org/apache/cassandra/net/Verb.java:140
  - src/java/org/apache/cassandra/net/Verb.java:142
  request:
    type: object
    required:
    - read_command
    properties:
      from:
        type: string
        examples:
        - n1
      read_command:
        $ref: ReadPathReadCommand
      track_repaired_data:
        type: boolean
        default: false
      track_warnings:
        type: boolean
        default: false
  response: ReadPathReadResponse
  errors:
  - code: runtime
    summary: Cannot service reads while bootstrapping; failure response with reason UNKNOWN.
  - code: tombstone-overwhelming
    summary: Failure response with reason READ_TOO_MANY_TOMBSTONES (code 1).
  - code: local-read-size-too-large
    summary: Failure response (reason UNKNOWN) when read thresholds are on and the local read exceeds local_read_size_fail_threshold.
  - code: query-referencing-too-many-indexes
    summary: SAI guardrail failure; failure response (reason UNKNOWN).
  - code: index-not-available
    summary: The local index is not queryable; failure response (reason UNKNOWN).
  - code: corrupt-sstable
    summary: IO error reading an sstable; failure response (reason UNKNOWN).
  - code: timeout
    retryable: true
    summary: 'No response: dropped (out-of-range rejection) or discarded after the verb''s deadline.'
  behavior:
  - set:
      vars.start: = now
      vars.single: = !has(input.read_command.kind) || input.read_command.kind != 'partition_range'
      vars.track_warnings: = has(input.track_warnings) && input.track_warnings
      vars.track_repaired: = has(input.track_repaired_data) && input.track_repaired_data
  - title: Verb deadline
    detail: READ_REQ expires after read_request_timeout, RANGE_REQ after range_request_timeout; the command's monitoring deadline is the message's expiry.
    source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:85-86
    set:
      vars.timeout: '= vars.single ? config[''read-request-timeout-ms''] : config[''range-request-timeout-ms'']'
  - call: storage-service.is-bootstrap-mode
    as: boot
  - if: has(vars.boot.value.bootstrap_mode) && vars.boot.value.bootstrap_mode
    then:
    - title: Replica refuses reads while bootstrapping
      source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:52-55
      set:
        ctx.read_refused: bootstrapping
    - title: The inbound sink turns the exception into a failure response
      detail: READ_REQ carries CALL_BACK_ON_FAILURE, so InboundSink.fail replies with RequestFailureReason.forException(RuntimeException) = UNKNOWN.
      source: src/java/org/apache/cassandra/net/InboundSink.java:81-91
      fail:
        code: runtime
        message: Cannot service reads while bootstrapping!
        data:
          failure_reason: UNKNOWN
          failure_code: 0
  - if: vars.single
    then:
    - choice: token_ownership
      default: owned
      options:
        owned:
        - title: Token owned or pending on this replica
        not_owned:
        - title: Read for a token this replica neither owns nor has pending
          detail: Counted, and logged when log_out_of_token_range_requests (default true).
          source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:66-74
          set:
            state.out_of_range_reads: = state.out_of_range_reads + 1
            ctx.out_of_range_read: true
        - if: config['reject-out-of-token-range-requests']
          then:
          - title: Request dropped without a response
            source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:76-78
            set:
              state.dropped_reads: = state.dropped_reads + 1
              ctx.read_dropped: true
          - wait: = vars.timeout + 1
          - fail:
              code: timeout
              retryable: true
              message: out-of-range read dropped; no response sent
  - title: Execute the command locally
    source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:92-96
    call: read-command.execute-locally
    input:
      read_command: = input.read_command
      track_repaired_data: = vars.track_repaired
      track_warnings: = vars.track_warnings
    as: local
    on_error:
    - if: error.code in ['tombstone-overwhelming', 'local-read-size-too-large', 'query-referencing-too-many-indexes'] && vars.track_warnings
      then:
      - title: Reject swallowed; an empty response carries the failure as a message parameter
        source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:97-111
        set:
          ctx.reject_param: = error.code
      - return:
          from: = self
          digest_response: = has(input.read_command.digest) && input.read_command.digest
          digest: 'md5:'
          partitions: []
          warnings:
          - = error.code
    - title: Failure response to the coordinator
      detail: RequestFailureReason.forException maps TombstoneOverwhelmingException to READ_TOO_MANY_TOMBSTONES and every other exception to UNKNOWN.
      source: src/java/org/apache/cassandra/exceptions/RequestFailureReason.java:82-91
      fail: '= {''code'': error.code, ''message'': error.message, ''data'': {''failure_reason'': error.code == ''tombstone-overwhelming'' ? ''READ_TOO_MANY_TOMBSTONES'' : ''UNKNOWN'', ''failure_code'':
        error.code == ''tombstone-overwhelming'' ? 1 : 0}}'
  - if: now - vars.start > vars.timeout
    then:
    - title: Deadline passed during the read; partial response discarded
      source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:116-134
      set:
        state.dropped_reads: = state.dropped_reads + 1
        ctx.read_discarded: true
    - fail:
        code: timeout
        retryable: true
        message: Discarding partial response (timed out)
  - call: read-command.create-response
    input:
      replica: = self
      read_command: = input.read_command
      result: = vars.local.value
    as: resp
  - title: Response enqueued to the coordinator
    source: src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java:123-129
    return: = vars.resp.value
- component: read-command
  name: execute-locally
  kind: function
  summary: 'ReadCommand.executeLocally on this instance: index searcher or storage, purge, read-size and tombstone thresholds (ClientWarn on a tombstone warning), limits. Returns unfiltered partitions:
    tombstones are kept.'
  sources:
  - src/java/org/apache/cassandra/db/ReadCommand.java:426-503
  request:
    type: object
    properties:
      read_command:
        $ref: ReadPathReadCommand
      track_repaired_data:
        type: boolean
        default: false
      track_warnings:
        type: boolean
        default: false
  response: ReadPathLocalResult
  errors:
  - code: tombstone-overwhelming
  - code: local-read-size-too-large
  - code: index-not-available
  - code: query-referencing-too-many-indexes
  - code: corrupt-sstable
  behavior:
  - set:
      vars.rc: '= has(input.read_command) ? input.read_command : input'
      vars.track_repaired: = has(input.track_repaired_data) && input.track_repaired_data
      vars.track_warnings: = has(input.track_warnings) && input.track_warnings
      vars.used_index: false
  - set:
      vars.single: = !has(vars.rc.kind) || vars.rc.kind != 'partition_range'
      vars.has_index: = has(vars.rc.index_expression) && has(vars.rc.index_expression.column)
  - call: read-execution-controller.for-command
    input:
      keyspace: = vars.rc.keyspace
      table: = vars.rc.table
      track_repaired_data: = vars.track_repaired
      uses_index: = vars.has_index
    as: controller
  - if: vars.has_index
    then:
    - call: secondary-index-manager.get-best-index-query-plan-for
      input:
        keyspace: = vars.rc.keyspace
        table: = vars.rc.table
        column: = vars.rc.index_expression.column
      as: plan
    - if: vars.plan.value.found
      then:
      - title: Index query plan found; refuse if the index is not queryable here
        source: src/java/org/apache/cassandra/db/ReadCommand.java:434-447
        call: secondary-index-manager.check-queryability
        input:
          index_name: = vars.plan.value.index_name
      - set:
          vars.used_index: true
          ctx.read_index: = vars.plan.value.index_name
      - if: vars.plan.value.index_kind == 'sai'
        then:
        - call: storage-attached-index-searcher.search
          input:
            read_command: = vars.rc
            index_name: = vars.plan.value.index_name
            sstable_indexes: = vars.plan.value.sstable_indexes
          as: data
        else:
        - call: cassandra-index-searcher.search
          input:
            read_command: = vars.rc
            index_name: = vars.plan.value.index_name
          as: data
  - if: '!vars.used_index'
    then:
    - title: No usable index; query storage directly
      source: src/java/org/apache/cassandra/db/ReadCommand.java:452
      set:
        vars.used_index: false
    - if: vars.single
      then:
      - call: single-partition-read-command.query-storage
        input:
          read_command: = vars.rc
          tracking_repaired_status: = vars.controller.value.tracking_repaired_status
        as: data
      else:
      - call: partition-range-read-command.query-storage
        input:
          read_command: = vars.rc
        as: data
  - title: Purgeable tombstones are dropped before counting; the rest are counted on the merged output
    detail: 'withoutPurgeableTombstones removes tombstones older than gc_grace that shadow nothing. Counted: every tombstone cell that survives the merge, plus the range/row tombstones each sstable partition
      carries.'
    source: src/java/org/apache/cassandra/db/ReadCommand.java:865-887
    set:
      vars.cell_tombstones: = sum([0] + vars.data.value.partitions.map(p, size(p.cells.filter(c, c.deleted))))
      vars.size: = vars.data.value.size_bytes
      vars.respect: = !(vars.rc.keyspace.lowerAscii() in ['system', 'system_schema', 'system_views', 'system_virtual_schema'])
  - set:
      vars.tombstones: = vars.cell_tombstones + vars.data.value.tombstones - vars.data.value.purgeable_tombstones
  - if: vars.respect && vars.track_warnings && config['local-read-size-fail-threshold-kib'] > 0 && vars.size >= config['local-read-size-fail-threshold-kib'] * 1024
    then:
    - title: Local read size over local_read_size_fail_threshold; query aborted
      detail: Only tracked when the command tracks warnings (read_thresholds_enabled) and a threshold is set; both are off in the deployed config.
      source: src/java/org/apache/cassandra/db/ReadCommand.java:712-728
      fail:
        code: local-read-size-too-large
        message: = 'Query attempted to read ' + string(vars.size) + ' bytes; query aborted (see local_read_size_fail_threshold)'
  - if: vars.respect && vars.tombstones > config['tombstone-failure-threshold']
    then:
    - set:
        state.tombstone_failures: = state.tombstone_failures + 1
        ctx.tombstones_scanned: = vars.tombstones
    - title: Scanned more than tombstone_failure_threshold tombstones; query aborted
      source: src/java/org/apache/cassandra/db/ReadCommand.java:588-603
      fail:
        code: tombstone-overwhelming
        message: Scanned over tombstone_failure_threshold tombstones; query aborted
        data:
          tombstones: = vars.tombstones
  - if: vars.respect && vars.tombstones > config['tombstone-warn-threshold']
    then:
    - title: Tombstone warning logged (tombstone_warn_threshold)
      source: src/java/org/apache/cassandra/db/ReadCommand.java:629-634
      set:
        state.tombstone_warnings: = state.tombstone_warnings + 1
        ctx.tombstone_warning: = vars.tombstones
    - if: '!vars.track_warnings'
      then:
      - title: Without TRACK_WARNINGS the warning goes to ClientWarn (seen by the client when this is the coordinator's own read)
        source: src/java/org/apache/cassandra/db/ReadCommand.java:635-638
        call: client-warn.warn
        input:
          text: = 'Read ' + string(sum([0] + vars.data.value.partitions.map(p, size(p.cells.filter(c, !c.deleted))))) + ' live rows and ' + string(vars.tombstones) + ' tombstone cells for query SELECT *
            FROM ' + vars.rc.keyspace + '.' + vars.rc.table + ' (see tombstone_warn_threshold)'
        on_error: continue
  - set:
      ctx.tombstones_scanned: = vars.tombstones
      vars.lim: '= has(vars.rc.limit) && vars.rc.limit > 0 ? vars.rc.limit : 1000000'
  - title: Apply the row filter and limits (tombstones still travel with the data)
    source: src/java/org/apache/cassandra/db/ReadCommand.java:463-494
    return:
      partitions: '= size(vars.data.value.partitions) > vars.lim ? vars.data.value.partitions.slice(0, vars.lim) : vars.data.value.partitions'
      tombstones_scanned: = vars.tombstones
      size_bytes: = vars.size
      used_index: = vars.used_index
      repaired_data_tracked: = vars.controller.value.tracking_repaired_status
- component: read-command
  name: create-response
  kind: function
  summary: 'ReadCommand.createResponse: a digest response for digest queries, otherwise a data response; both are computed over the unfiltered partitions, tombstones included.'
  sources:
  - src/java/org/apache/cassandra/db/ReadCommand.java:366-375
  request:
    type: object
    properties:
      replica:
        type: string
      read_command:
        $ref: ReadPathReadCommand
      result:
        $ref: ReadPathLocalResult
  response: ReadPathReadResponse
  behavior:
  - set:
      vars.digest: '= ''md5:'' + input.result.partitions.map(p, p.partition_key + (has(p.deletion_ts) && p.deletion_ts >= 0 ? ''!del@'' + string(p.deletion_ts) : '''') + ''|'' + p.cells.map(c, c.column
        + ''='' + (c.deleted ? ''<tombstone>'' : string(c.value)) + ''@'' + string(c.timestamp)).sort().join('','')).join('';'')'
      vars.is_digest: = has(input.read_command.digest) && input.read_command.digest
      vars.from: '= has(input.replica) ? input.replica : self'
  - if: vars.is_digest
    then:
    - title: Digest query; only a hash of the unfiltered result is returned
      source: src/java/org/apache/cassandra/db/ReadResponse.java:70-74
      return:
        from: = vars.from
        digest_response: true
        digest: = vars.digest
        partitions: []
        repaired_data_tracked: false
  - title: Data response; the unfiltered partitions are serialized, tombstones included
    source: src/java/org/apache/cassandra/db/ReadResponse.java:46-50
    return:
      from: = vars.from
      digest_response: false
      digest: = vars.digest
      partitions: = input.result.partitions
      repaired_data_tracked: = input.result.repaired_data_tracked
- component: read-execution-controller
  name: for-command
  kind: function
  summary: Opens the read OpOrder on the base table, and on the index table plus a write context when an index is used.
  sources:
  - src/java/org/apache/cassandra/db/ReadExecutionController.java:129-171
  request:
    type: object
    properties:
      keyspace:
        type: string
      table:
        type: string
      track_repaired_data:
        type: boolean
        default: false
      uses_index:
        type: boolean
        default: false
  response:
    type: object
    properties:
      tracking_repaired_status:
        type: boolean
      index_controller:
        type: boolean
  behavior:
  - return:
      tracking_repaired_status: = has(input.track_repaired_data) && input.track_repaired_data
      index_controller: = has(input.uses_index) && input.uses_index
- component: single-partition-read-command
  name: query-storage
  kind: function
  summary: Row cache when enabled for the table and repaired data is not tracked; otherwise memtables and sstables.
  sources:
  - src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:487-495
  request:
    type: object
    properties:
      read_command:
        $ref: ReadPathReadCommand
      tracking_repaired_status:
        type: boolean
        default: false
  response: ReadPathStorageResult
  behavior:
  - set:
      vars.table_key: = input.read_command.keyspace + '.' + input.read_command.table
      vars.tracking: = has(input.tracking_repaired_status) && input.tracking_repaired_status
  - if: config['row-cache-size-mib'] > 0 && vars.table_key in state.row_cached_tables && !vars.tracking
    then:
    - title: Row cache enabled for this table
      detail: isRowCacheEnabled needs caching rows on the table and a row cache capacity above 0; row_cache_size is 0MiB in cassandra.yaml.
      source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:3259-3265
      call: single-partition-read-command.get-through-cache
      input:
        read_command: = input.read_command
      as: cached
    - return: = vars.cached.value
  - call: single-partition-read-command.query-memtable-and-disk
    input:
      read_command: = input.read_command
    as: res
  - return: = vars.res.value
- component: single-partition-read-command
  name: get-through-cache
  kind: function
  summary: 'Row cache read: a hit is served from the cached partition; a miss reads the full partition, caches it and filters it.'
  sources:
  - src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:506-647
  request:
    type: object
    properties:
      read_command:
        $ref: ReadPathReadCommand
  response: ReadPathStorageResult
  behavior:
  - set:
      vars.key: = input.read_command.keyspace + '.' + input.read_command.table + ':' + input.read_command.partition_key
  - call: auto-saving-cache.get-row
    input:
      key: = vars.key
    as: cached
  - if: has(vars.cached.value.sentinel) && vars.cached.value.sentinel
    then:
    - title: Another read is populating the cache (sentinel); read normally without caching
      source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:519-525
      set:
        ctx.row_cache: miss_race
    - call: single-partition-read-command.query-memtable-and-disk
      input:
        read_command: = input.read_command
      as: raced
    - return: = vars.raced.value
  - if: has(vars.cached.value.partition)
    then:
    - title: Row cache hit; no memtable or sstable is read
      source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:528-536
      set:
        ctx.row_cache: hit
    - return:
        partitions:
        - = vars.cached.value.partition
        tombstones: 0
        purgeable_tombstones: 0
        sstables_iterated: 0
        size_bytes: 0
  - title: Row cache miss; read the whole partition from memtables and sstables
    source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:542-565
    set:
      ctx.row_cache: miss
  - call: single-partition-read-command.query-memtable-and-disk
    input:
      read_command: = input.read_command
    as: full
  - if: size(vars.full.value.partitions) > 0
    then:
    - title: Replace the sentinel with the partition read
      source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:604-611
      call: auto-saving-cache.put-row
      input:
        key: = vars.key
        partition: = vars.full.value.partitions[0]
  - return: = vars.full.value
- component: single-partition-read-command
  name: query-memtable-and-disk
  kind: function
  summary: Read every memtable, then the live sstables in descending max timestamp, stopping at sstables older than a partition deletion already seen; merge cell by cell with Cells.reconcile. Tombstones
    are kept.
  description: Memtable cells come from write-path's SkipListMemtable cells table (tombstones are cells with deleted true or a null value). SSTables are the Tracker View of this instance; each sstable holds
    its partitions. The names-filter timestamp-order path (queryMemtableAndSSTablesInTimestampOrder) returns the same result and is not modeled separately.
  sources:
  - src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:658-666
  - src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:679-855
  request:
    type: object
    properties:
      read_command:
        $ref: ReadPathReadCommand
  response: ReadPathStorageResult
  behavior:
  - set:
      vars.rc: '= has(input.read_command) ? input.read_command : input'
  - title: Read each memtable (always unrepaired)
    source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:715-734
    call: skip-list-memtable.cells-query
    input:
      keyspace: = vars.rc.keyspace
      table: = vars.rc.table
    as: mem
    on_error: continue
  - set:
      vars.cells: '= vars.mem.ok && type(vars.mem.value) == list ? vars.mem.value.filter(c, c.partition_key == vars.rc.partition_key).map(c, {''column'': c.column, ''value'': c.value, ''timestamp'': c.timestamp,
        ''deleted'': (''deleted'' in c && c.deleted) || c.value == null}) : []'
      vars.deletion_ts: -1
      vars.tombstones: 0
      vars.purgeable: 0
      vars.iterated: 0
      vars.size: 0
  - call: tracker.get-view
    input:
      keyspace: = vars.rc.keyspace
      table: = vars.rc.table
    as: view
  - title: Live sstables sorted by descending max timestamp
    source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:744-750
    set:
      vars.sstables: '= vars.view.value.sstables.sortBy(s, -(''max_timestamp'' in s ? s.max_timestamp : 0))'
  - foreach: = vars.sstables
    as: s
    max: 1000
    steps:
    - if: '(''max_timestamp'' in vars.s ? vars.s.max_timestamp : 0) < vars.deletion_ts'
      then:
      - title: An sstable older than a partition deletion already seen cannot hold anything live; stop
        source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:764-767
        set:
          ctx.sstable_skip: OLDER_THAN_PARTITION_TOMBSTONE
      - break: true
    - call: big-table-reader.row-iterator
      input:
        keyspace: = vars.rc.keyspace
        table: = vars.rc.table
        partition_key: = vars.rc.partition_key
        sstable: = vars.s
      as: part
    - when: vars.part.value.found
      set:
        vars.cells: = vars.cells + vars.part.value.cells
        vars.deletion_ts: '= vars.part.value.deletion_ts > vars.deletion_ts ? vars.part.value.deletion_ts : vars.deletion_ts'
        vars.tombstones: = vars.tombstones + vars.part.value.tombstones
        vars.purgeable: = vars.purgeable + vars.part.value.purgeable_tombstones
        vars.iterated: = vars.iterated + 1
        vars.size: = vars.size + vars.part.value.size_bytes
  - title: Merge the iterators with Cells.reconcile; a partition deletion hides cells at or below its timestamp
    source: src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:907-930
    call: cells.reconcile
    input:
      cells: = vars.cells
      deletion_ts: = vars.deletion_ts
    as: merged
  - return:
      partitions: '= size(vars.merged.value.cells) > 0 || vars.deletion_ts >= 0 ? [{''partition_key'': vars.rc.partition_key, ''cells'': vars.merged.value.cells, ''deletion_ts'': vars.deletion_ts, ''timestamp'':
        size(vars.merged.value.cells) > 0 ? math.greatest([vars.deletion_ts] + vars.merged.value.cells.map(c, c.timestamp)) : vars.deletion_ts}] : []'
      tombstones: = vars.tombstones
      purgeable_tombstones: = vars.purgeable
      sstables_iterated: = vars.iterated
      size_bytes: = vars.size
- component: partition-range-read-command
  name: query-storage
  kind: function
  summary: 'Range scan: memtable partitions plus every live sstable partition in the token range, merged per partition with Cells.reconcile. Tombstones are kept.'
  description: Memtable cells carry no token in write-path's model, so they are not filtered by the token range. Partitions are not re-sorted by token. The row-cache check per partition (checkCacheFilter)
    is not modeled because the row cache is off by default.
  sources:
  - src/java/org/apache/cassandra/db/PartitionRangeReadCommand.java:312-380
  request:
    type: object
    properties:
      read_command:
        $ref: ReadPathReadCommand
  response: ReadPathStorageResult
  behavior:
  - set:
      vars.rc: = input.read_command
      vars.start_token: '= has(input.read_command.start_token) ? input.read_command.start_token : -9223372036854775807'
      vars.end_token: '= has(input.read_command.end_token) ? input.read_command.end_token : 9223372036854775807'
  - title: Read the memtables over the data range
    source: src/java/org/apache/cassandra/db/PartitionRangeReadCommand.java:322-328
    call: skip-list-memtable.cells-query
    input:
      keyspace: = vars.rc.keyspace
      table: = vars.rc.table
    as: mem
    on_error: continue
  - call: tracker.get-view
    input:
      keyspace: = vars.rc.keyspace
      table: = vars.rc.table
    as: view
  - title: Scan every live sstable that intersects the range
    source: src/java/org/apache/cassandra/db/PartitionRangeReadCommand.java:331-346
    set:
      vars.mem_cells: '= vars.mem.ok && type(vars.mem.value) == list ? vars.mem.value.filter(c, !(''token'' in c) || (c.token > vars.start_token && c.token <= vars.end_token)) : []'
      vars.parts: '= vars.view.value.sstables.filter(s, ''partitions'' in s).map(s, s.partitions.map(k, merge(s.partitions[k], {''partition_key'': k}))).flatten().filter(p, !(''token'' in p) || (p.token
        > vars.start_token && p.token <= vars.end_token))'
      vars.out: []
  - set:
      vars.keys: = (vars.mem_cells.map(c, c.partition_key) + vars.parts.map(p, p.partition_key)).distinct()
      vars.tombstones: '= sum([0] + vars.parts.map(p, ''tombstones'' in p ? p.tombstones : 0))'
      vars.purgeable: '= sum([0] + vars.parts.map(p, ''purgeable_tombstones'' in p ? p.purgeable_tombstones : 0))'
  - title: Merge memtable and sstable iterators lazily, partition by partition
    source: src/java/org/apache/cassandra/db/PartitionRangeReadCommand.java:355-366
    foreach: = vars.keys
    as: k
    max: 1000
    steps:
    - set:
        vars.pp: = vars.parts.filter(p, p.partition_key == vars.k)
    - set:
        vars.del: '= math.greatest([-1] + vars.pp.map(p, ''deletion_ts'' in p ? p.deletion_ts : -1))'
        vars.kc: '= vars.mem_cells.filter(c, c.partition_key == vars.k).map(c, {''column'': c.column, ''value'': c.value, ''timestamp'': c.timestamp, ''deleted'': (''deleted'' in c && c.deleted) || c.value
          == null}) + vars.pp.map(p, ''cells'' in p ? p.cells : []).flatten()'
    - call: cells.reconcile
      input:
        cells: = vars.kc
        deletion_ts: = vars.del
      as: m
    - when: size(vars.m.value.cells) > 0 || vars.del >= 0
      set:
        vars.out: '= vars.out + [{''partition_key'': vars.k, ''cells'': vars.m.value.cells, ''deletion_ts'': vars.del, ''timestamp'': math.greatest([vars.del] + vars.m.value.cells.map(c, c.timestamp))}]'
  - return:
      partitions: = vars.out
      tombstones: = vars.tombstones
      purgeable_tombstones: = vars.purgeable
      sstables_iterated: = size(vars.view.value.sstables)
      size_bytes: 0
- component: big-table-reader
  name: row-iterator
  kind: function
  summary: 'Find a partition in one BIG sstable: min/max key range and bloom filter, key cache, index summary and index scan, then read its cells.'
  sources:
  - src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:126-134
  - src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:214-361
  request:
    type: object
    properties:
      keyspace:
        type: string
      table:
        type: string
      partition_key:
        type: string
      sstable:
        type: object
  response:
    type: object
    properties:
      found:
        type: boolean
      cells:
        type: array
        items:
          $ref: ReadPathCell
      deletion_ts:
        type: integer
      tombstones:
        type: integer
      purgeable_tombstones:
        type: integer
      size_bytes:
        type: integer
  errors:
  - code: corrupt-sstable
    summary: CorruptSSTableException after an IOException; the sstable is marked suspect.
  behavior:
  - set:
      vars.parts: '= ''partitions'' in input.sstable ? input.sstable.partitions : {}'
      vars.key: = input.keyspace + '.' + input.table + ':' + input.partition_key + ':' + input.sstable.id
  - if: '!(input.partition_key in vars.parts)'
    then:
    - title: Min/max key range or bloom filter rules the key out; no index or data read
      source: src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:255-263
      set:
        ctx.sstable_skip: BLOOM_FILTER
    - return:
        found: false
        cells: []
        deletion_ts: -1
        tombstones: 0
        purgeable_tombstones: 0
        size_bytes: 0
  - if: state.key_cache_enabled
    then:
    - call: auto-saving-cache.get-key
      input:
        key: = vars.key
      as: kc
    - if: has(vars.kc.value.position)
      then:
      - title: Key cache hit; the index entry comes from the cache
        source: src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:265-274
        set:
          ctx.key_cache: hit
      else:
      - title: Key cache miss; binary search the index summary and scan the partition index
        source: src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:276-300
        set:
          ctx.key_cache: miss
      - title: Cache the exact index entry found
        source: src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:337-345
        call: auto-saving-cache.put-key
        input:
          key: = vars.key
          position: 0
  - title: Read the partition from the data file
    source: src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:136-144
    call: data-disk.sstable-read
    input:
      instance: = self
      keyspace: = input.keyspace
      table: = input.table
      sstable_id: = input.sstable.id
      partition_key: = input.partition_key
    on_error:
    - set:
        state.suspect: = state.suspect + [input.sstable.id]
    - title: IO error marks the sstable suspect and raises CorruptSSTableException
      source: src/java/org/apache/cassandra/io/sstable/format/big/BigTableReader.java:352-356
      fail:
        code: corrupt-sstable
        message: '= ''Corrupted sstable '' + input.sstable.id + '': '' + error.code'
  - set:
      vars.p: = vars.parts[input.partition_key]
  - return:
      found: true
      cells: '= (''cells'' in vars.p ? vars.p.cells : []).map(c, {''column'': c.column, ''value'': (''value'' in c) ? c.value : null, ''timestamp'': c.timestamp, ''deleted'': (''deleted'' in c && c.deleted)
        || !(''value'' in c) || c.value == null})'
      deletion_ts: '= ''deletion_ts'' in vars.p ? vars.p.deletion_ts : -1'
      tombstones: '= ''tombstones'' in vars.p ? vars.p.tombstones : 0'
      purgeable_tombstones: '= ''purgeable_tombstones'' in vars.p ? vars.p.purgeable_tombstones : 0'
      size_bytes: '= ''size_bytes'' in vars.p ? vars.p.size_bytes : 0'
- component: secondary-index-manager
  name: get-best-index-query-plan-for
  kind: function
  summary: Pick the index group whose query plan serves the row filter (a custom expression's target index wins).
  sources:
  - src/java/org/apache/cassandra/index/SecondaryIndexManager.java:1245-1290
  request:
    type: object
    properties:
      keyspace:
        type: string
      table:
        type: string
      column:
        type: string
  response:
    type: object
    properties:
      found:
        type: boolean
      index_name:
        type: string
      index_kind:
        type: string
      sstable_indexes:
        type: integer
  behavior:
  - set:
      vars.k: = input.keyspace + '.' + input.table + '.' + input.column
  - if: '!(vars.k in state.indexes)'
    then:
    - title: No applicable index
      source: src/java/org/apache/cassandra/index/SecondaryIndexManager.java:1273-1277
      return:
        found: false
        index_name: ''
        index_kind: ''
        sstable_indexes: 0
  - return:
      found: true
      index_name: = state.indexes[vars.k].name
      index_kind: = state.indexes[vars.k].kind
      sstable_indexes: = state.indexes[vars.k].sstable_indexes
- component: secondary-index-manager
  name: check-queryability
  kind: function
  summary: Throw IndexNotAvailableException when an index of the plan is not queryable on this instance (building or failed).
  sources:
  - src/java/org/apache/cassandra/index/SecondaryIndexManager.java:314-321
  request:
    type: object
    properties:
      index_name:
        type: string
  errors:
  - code: index-not-available
  behavior:
  - if: input.index_name in state.non_queryable
    then:
    - title: Index not queryable on this replica
      source: src/java/org/apache/cassandra/index/SecondaryIndexManager.java:318-319
      fail:
        code: index-not-available
        message: = 'The secondary index ' + input.index_name + ' is not yet available'
  - return:
      queryable: true
- component: cassandra-index-searcher
  name: search
  kind: function
  summary: Read the hidden index table partition keyed by the indexed value, then read each base partition it names and keep the ones whose live value still matches.
  sources:
  - src/java/org/apache/cassandra/index/internal/CassandraIndexSearcher.java:80-103
  request:
    type: object
    properties:
      read_command:
        $ref: ReadPathReadCommand
      index_name:
        type: string
  response: ReadPathStorageResult
  behavior:
  - set:
      vars.rc: = input.read_command
  - title: Query the index table (partition key = indexed value, one clustering entry per base partition key)
    source: src/java/org/apache/cassandra/index/internal/CassandraIndexSearcher.java:96-103
    call: single-partition-read-command.query-memtable-and-disk
    input:
      read_command:
        keyspace: = vars.rc.keyspace
        table: = vars.rc.table + '.' + input.index_name
        partition_key: = vars.rc.index_expression.value
        token: 0
    as: idx
  - set:
      vars.base_keys: '= size(vars.idx.value.partitions) > 0 ? vars.idx.value.partitions[0].cells.filter(c, !c.deleted).map(c, c.column) : []'
      vars.out: []
      vars.tombstones: = vars.idx.value.tombstones
  - foreach: = vars.base_keys
    as: bk
    max: 1000
    steps:
    - call: single-partition-read-command.query-memtable-and-disk
      input:
        read_command:
          keyspace: = vars.rc.keyspace
          table: = vars.rc.table
          partition_key: = vars.bk
          token: 0
      as: base
    - title: Keep base rows whose live value still matches; stale index entries are dropped
      source: src/java/org/apache/cassandra/index/internal/CassandraIndexSearcher.java:80-94
      set:
        vars.out: = vars.out + vars.base.value.partitions.filter(p, p.cells.exists(c, !c.deleted && c.column == vars.rc.index_expression.column && string(c.value) == vars.rc.index_expression.value))
        vars.tombstones: = vars.tombstones + vars.base.value.tombstones
  - return:
      partitions: = vars.out
      tombstones: = vars.tombstones
      purgeable_tombstones: 0
      sstables_iterated: = size(vars.base_keys)
      size_bytes: 0
- component: storage-attached-index-searcher
  name: search
  kind: function
  summary: 'SAI search: check the referenced-index guardrail, then iterate primary keys matching the expression over memtable and sstable indexes.'
  description: The on-disk SAI structures are not modeled; matching rows are found by filtering the memtable and sstable partitions on the live value of the indexed column.
  sources:
  - src/java/org/apache/cassandra/index/sai/plan/StorageAttachedIndexSearcher.java:132-151
  - src/java/org/apache/cassandra/index/sai/plan/QueryController.java:248-262
  request:
    type: object
    properties:
      read_command:
        $ref: ReadPathReadCommand
      index_name:
        type: string
      sstable_indexes:
        type: integer
  response: ReadPathStorageResult
  errors:
  - code: query-referencing-too-many-indexes
  behavior:
  - set:
      vars.rc: = input.read_command
      vars.col: = input.read_command.index_expression.column
      vars.val: = input.read_command.index_expression.value
  - call: query-controller.maybe-trigger-guardrails
    input:
      referenced_indexes: = input.sstable_indexes
  - title: Iterate the primary keys matched by the memtable and sstable indexes and read their rows
    detail: Modeled as a full-range local read filtered on the indexed column.
    source: src/java/org/apache/cassandra/index/sai/plan/StorageAttachedIndexSearcher.java:205-215
    call: partition-range-read-command.query-storage
    input:
      read_command:
        kind: partition_range
        keyspace: = vars.rc.keyspace
        table: = vars.rc.table
        start_token: -9223372036854775807
        end_token: 9223372036854775807
    as: scan
  - title: Rows whose indexed column matches the expression
    source: src/java/org/apache/cassandra/index/sai/plan/StorageAttachedIndexSearcher.java:192-215
    return:
      partitions: = vars.scan.value.partitions.filter(p, p.cells.exists(c, !c.deleted && c.column == vars.col && string(c.value) == vars.val))
      tombstones: = vars.scan.value.tombstones
      purgeable_tombstones: = vars.scan.value.purgeable_tombstones
      sstables_iterated: = vars.scan.value.sstables_iterated
      size_bytes: 0
- component: query-controller
  name: maybe-trigger-guardrails
  kind: function
  summary: Fail when one expression touches more sstable indexes than sai_sstable_indexes_per_query_fail_threshold; warn above the warn threshold.
  sources:
  - src/java/org/apache/cassandra/index/sai/plan/QueryController.java:323-345
  request:
    type: object
    properties:
      referenced_indexes:
        type: integer
  errors:
  - code: query-referencing-too-many-indexes
  behavior:
  - if: config['sai-sstable-indexes-per-query-fail-threshold'] > 0 && input.referenced_indexes > config['sai-sstable-indexes-per-query-fail-threshold']
    then:
    - title: Too many sstable indexes referenced; query aborted
      source: src/java/org/apache/cassandra/index/sai/plan/QueryController.java:331-340
      fail:
        code: query-referencing-too-many-indexes
        message: = 'Query attempted to read from too many indexes (' + string(input.referenced_indexes) + ')'
  - if: config['sai-sstable-indexes-per-query-warn-threshold'] > 0 && input.referenced_indexes > config['sai-sstable-indexes-per-query-warn-threshold']
    then:
    - title: Referenced-indexes warning added to the response parameters
      source: src/java/org/apache/cassandra/index/sai/plan/QueryController.java:342-345
      set:
        ctx.sai_index_warning: = input.referenced_indexes
  - return:
      ok: true
- component: index-status-manager
  name: filter-for-query
  kind: function
  summary: Coordinator-side replica filter for index reads; throws ReadFailureException (INDEX_NOT_AVAILABLE) rather than Unavailable when live replicas lack a queryable index.
  sources:
  - src/java/org/apache/cassandra/index/IndexStatusManager.java:89-133
  - src/java/org/apache/cassandra/locator/ReplicaPlans.java:656
  request:
    type: object
    required:
    - keyspace
    - index_name
    - live_replicas
    - block_for
    properties:
      keyspace:
        type: string
        examples:
        - shop
      index_name:
        type: string
        examples:
        - users_email_idx
      index_kind:
        type: string
        enum:
        - legacy_local_table
        - sai
        default: legacy_local_table
      consistency:
        type: string
        examples:
        - QUORUM
      live_replicas:
        type: array
        items:
          type: string
        examples:
        - - n1
          - n2
          - n3
      block_for:
        type: integer
        examples:
        - 2
  response:
    type: object
    properties:
      replicas:
        type: array
        items:
          type: string
  errors:
  - code: read-failure
    status: 4864
    summary: ReadFailureException with reason INDEX_NOT_AVAILABLE per excluded replica.
  behavior:
  - set:
      vars.skey: = input.keyspace + '.' + input.index_name
      vars.ok_states: '= has(input.index_kind) && input.index_kind == ''sai'' ? [''BUILD_SUCCEEDED'', ''UNKNOWN''] : [''BUILD_SUCCEEDED'', ''UNKNOWN'', ''FULL_REBUILD_STARTED'']'
  - title: Keep replicas whose gossiped index status is queryable (UNKNOWN counts as queryable)
    source: src/java/org/apache/cassandra/index/IndexStatusManager.java:94-111
    set:
      vars.queryable: '= input.live_replicas.filter(r, (r in state.peer_index_status && vars.skey in state.peer_index_status[r] ? state.peer_index_status[r][vars.skey] : ''UNKNOWN'') in vars.ok_states)'
      vars.succeeded: = input.live_replicas.filter(r, r in state.peer_index_status && vars.skey in state.peer_index_status[r] && state.peer_index_status[r][vars.skey] == 'BUILD_SUCCEEDED')
  - if: size(vars.queryable) != size(input.live_replicas) && input.block_for <= size(input.live_replicas) && input.block_for > size(vars.queryable)
    then:
    - title: Not enough queryable replicas; read failure instead of unavailable
      source: src/java/org/apache/cassandra/index/IndexStatusManager.java:118-130
      set:
        ctx.index_read_failure: true
    - fail:
        code: read-failure
        status: 4864
        message: '= ''Operation failed - received '' + string(size(vars.queryable)) + '' responses and '' + string(size(input.live_replicas) - size(vars.queryable)) + '' failures: INDEX_NOT_AVAILABLE'''
        data:
          received: = size(vars.queryable)
          block_for: = input.block_for
          failure_reason: INDEX_NOT_AVAILABLE
          excluded: = input.live_replicas.filter(r, !(r in vars.queryable))
  - title: Replicas with queryable but not fully built indexes go last
    source: src/java/org/apache/cassandra/index/IndexStatusManager.java:113-115
    return:
      replicas: = vars.queryable.filter(r, r in vars.succeeded) + vars.queryable.filter(r, !(r in vars.succeeded))
