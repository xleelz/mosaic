      - o1
  expect:
  - result.value.compacted == 0 && !trace.exists(e, e.type == 'call.start' && e.interface == 'compaction-task.execute')
- id: user-defined-cleanup-inactive-file
  name: forceUserDefinedCleanup skips a file that is not a live sstable
  fixtures:
