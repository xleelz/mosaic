    caller: operator
    'on': n1
    as: u
    input: *id007
  expect:
  - steps.r.result.value.status == 'SUCCESSFUL' && result.value.status == 'SUCCESSFUL'
  - state['compaction-task@n1'].history.filter(h, h.type == 'SCRUB').size() == 4 && state['compaction-task@n1'].history.filter(h, h.type == 'UPGRADE_SSTABLES').size() == 4
- id: garbage-collect-empty-table
  name: A table with no sstables has nothing to garbage collect
