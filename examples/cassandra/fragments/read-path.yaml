scenarios:
- id: read-data-memtable-newer-than-sstable
  flow: replica-read
  name: Data read on n2 merges memtable and sstable cell by cell; the newer memtable cell wins
  fixtures: &id001
  - three-node-rf3
  state:
    skip-list-memtable@n2:
      cells:
        shop.users:user:42:city:
          replica: n2
          keyspace: shop
          table: users
          partition_key: user:42
          column: city
          value: London
          timestamp: 2000
    tracker@n2:
      views:
        shop.users:
          sstables:
          - &id002
            id: nb-1
            size_mb: 10
            level: 0
            repaired: false
            pending_repair: ''
            droppable_tombstone_ratio: 0.0
            age_s: 3600
            fully_expired: false
            tombstones: 0
            purgeable_tombstones: 0
            unowned_mb: 0
            window: 0
            read_rate: 0.0
            max_timestamp: 1000
            partitions:
              user:42:
                cells:
                - column: name
                  value: Ada
                  timestamp: 1000
                - column: city
                  value: Paris
                  timestamp: 1000
                tombstones: 3
  expect:
  - result.ok && !result.value.digest_response && size(result.value.partitions) == 1
  - result.value.partitions[0].cells.exists(c, c.column == 'city' && c.value == 'London' && c.timestamp == 2000)
  - result.value.partitions[0].cells.exists(c, c.column == 'name' && c.value == 'Ada' && c.timestamp == 1000) && result.value.partitions[0].timestamp == 2000
  - result.value.from == 'n2' && result.value.digest == 'md5:user:42|city=London@2000,name=Ada@1000'
  - calls_by_instance['big-table-reader.row-iterator@n2'] == 1 && ctx.key_cache == 'miss' && ctx.tombstones_scanned == 3
  - '''shop.users:user:42:nb-1'' in state[''auto-saving-cache@n2''].key_cache'
- id: read-digest-only
  flow: replica-read
  name: Digest request returns only the digest
  fixtures: *id001
