            age_s: 3600
            fully_expired: false
            tombstones: 0
            purgeable_tombstones: 0
            unowned_mb: 0
            window: 0
            read_rate: 0.0
            max_timestamp: 1000
            partitions:
              user:42:
                cells:
                - column: name
                  value: Ada
                  timestamp: 1000
  input:
