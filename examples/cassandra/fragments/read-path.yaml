- component: auto-saving-cache
  name: schedule-saving
  kind: function
  summary: Cancel any previous save task and, when the save period is above 0, schedule submitWrite every period on optionalTasks.
  sources:
  - src/java/org/apache/cassandra/cache/AutoSavingCache.java:158-179
  request:
    type: object
    properties:
      cache_type:
        type: string
        enum:
        - KEY_CACHE
        - ROW_CACHE
        - COUNTER_CACHE
        examples:
        - KEY_CACHE
      save_period_s:
        type: integer
        examples:
        - 14400
      keys_to_save:
        type: integer
        default: 2147483647
  behavior:
  - set:
      vars.type: '= has(input.cache_type) ? input.cache_type : ''KEY_CACHE'''
  - set:
      vars.period: '= has(input.save_period_s) ? input.save_period_s : (vars.type == ''KEY_CACHE'' ? config[''key-cache-save-period-s''] : (vars.type == ''ROW_CACHE'' ? config[''row-cache-save-period-s'']
        : config[''counter-cache-save-period-s'']))'
  - title: Cancel any in-flight schedule (an in-progress save is not interrupted)
    source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:160-164
    set:
      vars.scheduled: = vars.period > 0
  - if: vars.type == 'KEY_CACHE'
    then:
    - set:
        state.key_cache_save_scheduled: = vars.scheduled
        state.key_cache_save_period_set: = vars.period
  - if: vars.type == 'ROW_CACHE'
    then:
    - set:
        state.row_cache_save_scheduled: = vars.scheduled
        state.row_cache_save_period_set: = vars.period
  - if: vars.type == 'COUNTER_CACHE'
    then:
    - set:
        state.counter_cache_save_scheduled: = vars.scheduled
        state.counter_cache_save_period_set: = vars.period
  - title: Schedule with a fixed delay of the save period when it is above 0
    source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:165-178
    return:
      scheduled: = vars.scheduled
      period_s: = vars.period
- component: auto-saving-cache
  name: submit-write
  kind: function
  summary: 'The periodic save task: build a Writer over the cache''s keys and submit it to the compaction executor.'
  sources:
  - src/java/org/apache/cassandra/cache/AutoSavingCache.java:166-177
  - src/java/org/apache/cassandra/cache/AutoSavingCache.java:290-293
  request:
    type: object
    properties:
      cache_type:
        type: string
        enum:
        - KEY_CACHE
        - ROW_CACHE
        - COUNTER_CACHE
        examples:
        - KEY_CACHE
      keys_to_save:
        type: integer
        default: 2147483647
  behavior:
  - set:
      vars.types: '= has(input.cache_type) ? [input.cache_type] : [''KEY_CACHE'', ''ROW_CACHE'', ''COUNTER_CACHE'']'
      vars.written: 0
  - foreach: = vars.types
    as: t
    steps:
    - set:
        vars.keys: '= vars.t == ''KEY_CACHE'' ? state.key_cache.map(k, k) : (vars.t == ''ROW_CACHE'' ? state.row_cache.map(k, k) : state.counter_cache.map(k, k))'
    - call: compaction-manager.submit-cache-write
      input:
        cache_type: = vars.t
        keys: = vars.keys
        keys_to_save: '= has(input.keys_to_save) ? input.keys_to_save : 2147483647'
        schema_version: = state.schema_version
      as: w
    - set:
        vars.written: = vars.written + vars.w.value.written
  - return:
      written: = vars.written
- component: auto-saving-cache
  name: load-saved
  kind: function
  summary: 'Startup load of a saved cache: refuse on schema version mismatch or checksum error (non-fatal), stop at cache_load_timeout (30s).'
  sources:
  - src/java/org/apache/cassandra/cache/AutoSavingCache.java:181-286
  request:
    type: object
    required:
    - cache_type
    properties:
      cache_type:
        type: string
        enum:
        - KEY_CACHE
        - ROW_CACHE
        - COUNTER_CACHE
        examples:
        - KEY_CACHE
  response:
    type: object
    properties:
      loaded:
        type: integer
  behavior:
  - call: data-disk.saved-cache-read
    input:
      cache_type: = input.cache_type
    as: file
    on_error:
    - title: Checksum or read error; harmless, the cache starts empty
      source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:268-277
      set:
        ctx.cache_load: '= ''error: '' + error.code'
    - return:
        loaded: 0
  - if: '!has(vars.file.value.schema_version)'
    then:
    - title: No saved cache files
      source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:208
      set:
        ctx.cache_load: none
    - return:
        loaded: 0
  - if: vars.file.value.schema_version != state.schema_version
    then:
    - title: Saved cache schema version differs; logged as a harmless error and nothing is loaded
      source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:220-225
      set:
        ctx.cache_load: schema_mismatch
    - return:
        loaded: 0
  - title: Deserialize entries until EOF or cache_load_timeout (30s, commented out in cassandra.yaml)
    source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:228-266
    set:
      ctx.cache_load: loaded
  - if: input.cache_type == 'KEY_CACHE'
    then:
    - foreach: = vars.file.value.keys
      as: k
      max: 1000
      steps:
      - call: auto-saving-cache.put-key
        input:
          key: = vars.k
          position: 0
  - return:
      loaded: = size(vars.file.value.keys)
- component: auto-saving-cache-writer
  name: save-cache
  kind: function
  summary: Delete old files; skip an empty cache; write schema version and up to keys_to_save keys to temp files, then rename.
  sources:
  - src/java/org/apache/cassandra/cache/AutoSavingCache.java:349-430
  request:
    type: object
    properties:
      cache_type:
        type: string
      keys:
        type: array
        items:
          type: string
      keys_to_save:
        type: integer
      schema_version:
        type: string
  behavior:
  - if: size(input.keys) == 0
    then:
    - title: Cache is empty; old files deleted and nothing written
      source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:351-358
      set:
        ctx.cache_save: empty
    - return:
        written: 0
  - set:
      vars.keys: '= size(input.keys) > input.keys_to_save ? input.keys.slice(0, input.keys_to_save) : input.keys'
  - title: Write schema version and keys to temp files, then rename over the old files
    source: src/java/org/apache/cassandra/cache/AutoSavingCache.java:362-420
    call: data-disk.saved-cache-write
    input:
      cache_type: = input.cache_type
      schema_version: = input.schema_version
      keys: = vars.keys
  - set:
      ctx.cache_save: written
  - return:
      written: = size(vars.keys)
- component: compaction-manager
  name: submit-background
  kind: function
  summary: Submit a background compaction check for a table unless autocompaction is off or the table is already compacting on a saturated executor.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:230-263
  request: ReadPathTableRef
  response:
    type: object
    properties:
      submitted:
        type: integer
      reason:
        type: string
  behavior:
  - set:
      vars.replica: = self
      vars.keyspace: '= has(input.keyspace) ? input.keyspace : '''''
      vars.table: '= has(input.table) ? input.table : '''''
  - call: tracker.get-view
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
    as: view
  - if: '!vars.view.value.auto_compaction_enabled'
    then:
    - title: Autocompaction is disabled; nothing submitted
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:232-236
      set:
        ctx.background_compaction: disabled
    - return:
        submitted: 0
        reason: autocompaction_disabled
  - if: 'state.compacting_cf_count > 0 && state.executor_active_tasks >= (''executor_max_pool_size'' in state ? state.executor_max_pool_size : config[''concurrent-compactors''])'
    then:
    - title: Table already compacting and no idle compaction thread; skip
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:244-250
      set:
        ctx.background_compaction: busy
    - return:
        submitted: 0
        reason: busy
  - title: Submit a BackgroundCompactionCandidate to the compaction executor
    source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:257-262
    emit: compaction-manager-background-compaction-candidate.run
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
  - set:
      ctx.background_submissions: '= has(ctx.background_submissions) ? ctx.background_submissions + 1 : 1'
  - return:
      submitted: 1
      reason: submitted
- component: compaction-manager-background-compaction-candidate
  name: run
  kind: function
  summary: Ask the strategy manager for the next task at run time, execute it, and resubmit only if a compaction ran.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:353-389
  request: ReadPathTableRef
  behavior:
  - set:
      vars.replica: = self
      vars.keyspace: '= has(input.keyspace) ? input.keyspace : '''''
      vars.table: '= has(input.table) ? input.table : '''''
  - call: compaction-strategy-manager.get-next-background-task
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
    as: task
  - if: '!vars.task.value.found'
    then:
    - title: No compaction needed; the upgrade check is off (automatic_sstable_upgrade false), so no resubmission
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:366-371
      set:
        ctx.background_result: no_task
    - return:
        ran: false
  - if: vars.task.value.operation_type == 'REPAIR_FINISHED'
    then:
    - title: A repair-finished task only rewrites sstable metadata
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:373-376
      call: pending-repair-manager-repair-finished-compaction-task.run-may-throw
      input:
        keyspace: = vars.keyspace
        table: = vars.table
        sstable_ids: = vars.task.value.sstable_ids
        session_id: = vars.task.value.session_id
        repaired: = vars.task.value.repaired
    - set:
        ctx.background_result: repair_finished
    - emit: compaction-manager.submit-background
      input:
        keyspace: = vars.keyspace
        table: = vars.table
    - return:
        ran: true
  - call: compaction-task.execute
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
      sstable_ids: = vars.task.value.sstable_ids
      operation_type: = vars.task.value.operation_type
      level: = vars.task.value.level
      user_defined: false
    as: exec
    on_error:
    - title: The task failed; the executor logs it and the candidate does not resubmit
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:377-383
      set:
        ctx.background_result: = error.code
    - fail: '= {''code'': error.code, ''message'': error.message}'
  - set:
      ctx.background_result: compacted
  - title: A compaction ran, so check again for more work
    source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:382-383
    emit: compaction-manager.submit-background
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
  - return:
      ran: true
- component: compaction-manager
  name: perform-maximal
  kind: function
  summary: 'Major compaction: get maximal tasks (one per repaired/unrepaired group) with compactions disabled, run them and wait.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:986-1030
  request:
    type: object
    properties:
      replica:
        type: string
        examples:
        - n1
      keyspace:
        type: string
        examples:
        - shop
      table:
        type: string
        examples:
        - users
      split_output:
        type: boolean
        default: false
  behavior:
  - set:
      vars.replica: = self
      vars.keyspace: '= has(input.keyspace) ? input.keyspace : '''''
      vars.table: '= has(input.table) ? input.table : '''''
  - call: compaction-strategy-manager.get-maximal-tasks
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
    as: tasks
  - if: size(vars.tasks.value.tasks) == 0
    then:
    - return:
        tasks: 0
  - if: size(vars.tasks.value.tasks) > 1
    then:
    - title: Repaired and unrepaired data are compacted separately; the result is not a single sstable
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1025-1026
      set:
        ctx.major_compaction_split: true
  - foreach: = vars.tasks.value.tasks
    as: t
    steps:
    - title: Run each maximal task on the compaction executor and wait
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1009-1022
      call: compaction-task.execute
      input:
        replica: = vars.replica
        keyspace: = vars.keyspace
        table: = vars.table
        sstable_ids: = vars.t.sstable_ids
        operation_type: MAJOR_COMPACTION
        level: 0
        user_defined: false
  - return:
      tasks: = size(vars.tasks.value.tasks)
- component: compaction-manager
  name: force-user-defined-compaction
  kind: jmx
  summary: 'JMX forceUserDefinedCompaction(dataFiles): resolve each Data.db file to its table, skip unknown schemas, compact per table and wait.'
  attributes:
    mbean: org.apache.cassandra.db:type=CompactionManager
    operation: forceUserDefinedCompaction
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManagerMBean.java:44
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1155-1179
  request:
    type: object
    required:
    - data_files
    properties:
      replica:
        type: string
      data_files:
        type: string
        examples:
        - /var/lib/cassandra/data/shop/users-1b2c/nb-1-big-Data.db,/var/lib/cassandra/data/shop/users-1b2c/nb-2-big-Data.db
  behavior:
  - set:
      vars.files: = input.data_files.split(',').map(f, f.trim())
      vars.entries: []
      vars.replica: = self
  - foreach: = vars.files
    as: f
    steps:
    - set:
        vars.parts: = vars.f.split('/')
    - set:
        vars.ks: = vars.parts[size(vars.parts) - 3]
        vars.tbl: = vars.parts[size(vars.parts) - 2].split('-')[0]
        vars.sid: = vars.parts[size(vars.parts) - 1].split('-big-')[0]
    - call: tracker.get-view
      input:
        replica: = vars.replica
        keyspace: = vars.ks
        table: = vars.tbl
      as: v
    - if: '''missing'' in vars.v.value'
      then:
      - title: Schema does not exist for the file; skipped
        source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1164-1168
        set:
          ctx.udc_skipped: '= has(ctx.udc_skipped) ? ctx.udc_skipped + [vars.f] : [vars.f]'
      - continue: true
    - set:
        vars.entries: '= vars.entries + [{''keyspace'': vars.ks, ''table'': vars.tbl, ''id'': vars.sid}]'
  - set:
      vars.tables: = vars.entries.map(e, e.keyspace + '/' + e.table).distinct()
  - foreach: = vars.tables
    as: t
    steps:
    - title: Submit a user-defined task per table and wait
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1174-1178
      call: compaction-manager.submit-user-defined
      input:
        replica: = vars.replica
        keyspace: = vars.t.split('/')[0]
        table: = vars.t.split('/')[1]
        sstable_ids: = vars.entries.filter(e, e.keyspace + '/' + e.table == vars.t).map(e, e.id)
  - return:
      tables: = size(vars.tables)
- component: compaction-manager
  name: submit-user-defined
  kind: function
  summary: 'On the executor: look up the requested sstables among the live set, skip inactive ones, run the user-defined tasks.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1239-1282
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstable_ids:
        type: array
        items:
          type: string
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.active: = vars.view.value.sstables.filter(s, s.id in input.sstable_ids).map(s, s.id)
  - if: size(vars.active) == 0
    then:
    - title: No active sstables to compact
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1263-1266
      set:
        ctx.udc_result: no_files
    - return:
        compacted: 0
  - call: compaction-strategy-manager.get-user-defined-tasks
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.active
    as: tasks
  - foreach: = vars.tasks.value.tasks
    as: t
    steps:
    - call: compaction-task.execute
      input:
        keyspace: = input.keyspace
        table: = input.table
        sstable_ids: = vars.t.sstable_ids
        operation_type: COMPACTION
        level: 0
        user_defined: true
  - when: size(vars.tasks.value.tasks) > 0
    set:
      ctx.udc_result: compacted
  - return:
      compacted: = size(vars.tasks.value.tasks)
- component: compaction-manager
  name: perform-cleanup
  kind: function
  summary: 'Cleanup: abort while the node has pending ranges; otherwise rewrite each sstable holding unowned data and skip the rest.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:617-677
  request:
    type: object
    properties:
      replica:
        type: string
        examples:
        - n1
      keyspace:
        type: string
        examples:
        - shop
      table:
        type: string
        examples:
        - users
      jobs:
        type: integer
        default: 2
  response: ReadPathAllSSTableOpStatus
  behavior:
  - set:
      vars.replica: = self
      vars.keyspace: '= has(input.keyspace) ? input.keyspace : '''''
      vars.table: '= has(input.table) ? input.table : '''''
  - call: token-metadata.get-pending-ranges
    input:
      keyspace: = vars.keyspace
      endpoint: = vars.replica
    as: pending
  - if: size(vars.pending.value.ranges) > 0
    then:
    - title: Cleanup cannot run while the node has pending ranges
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:621-625
      set:
        ctx.cleanup: aborted_pending_ranges
    - return:
        status: ABORTED
        status_code: 1
  - call: tracker.get-view
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
    as: view
  - set:
      vars.candidates: = vars.view.value.sstables.filter(s, !(s.id in vars.view.value.compacting))
  - set:
      vars.need: = vars.candidates.filter(s, 'unowned_mb' in s && s.unowned_mb > 0)
  - if: size(vars.need) == 0
    then:
    - title: Every sstable is fully contained in owned ranges; nothing to clean up
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:651-664
      set:
        ctx.cleanup: nothing_to_do
    - return:
        status: SUCCESSFUL
        status_code: 0
  - title: Mark the sstables needing cleanup as compacting
    source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:432
    call: tracker.try-modify
    input:
      replica: = vars.replica
      keyspace: = vars.keyspace
      table: = vars.table
      sstable_ids: = vars.need.map(s, s.id)
      compacting: = vars.view.value.compacting
    as: txn
    on_error:
    - title: Could not mark the sstables (another operation holds them)
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:437-439
      set:
        ctx.cleanup: unable_to_cancel
    - return:
        status: UNABLE_TO_CANCEL
        status_code: 2
  - foreach: = vars.need
    as: s
    steps:
    - call: compaction-manager.do-cleanup-one
      input:
        replica: = vars.replica
        keyspace: = vars.keyspace
        table: = vars.table
        sstable: = vars.s
        has_indexes: false
  - set:
      ctx.cleanup: done
  - return:
      status: SUCCESSFUL
      status_code: 0
- component: compaction-manager
  name: do-cleanup-one
  kind: function
  summary: 'Clean one sstable: drop it whole when it intersects no owned range (and the table has no index), else rewrite only owned partitions.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1408-1496
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstable:
        type: object
      has_indexes:
        type: boolean
        default: false
  behavior:
  - if: '!input.has_indexes && input.sstable.unowned_mb >= input.sstable.size_mb'
    then:
    - title: The sstable intersects no owned range; drop it entirely
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1418-1425
      call: lifecycle-transaction.commit
      input:
        keyspace: = input.keyspace
        table: = input.table
        obsolete_ids:
        - = input.sstable.id
        release_ids:
        - = input.sstable.id
        new_sstables: []
    - return:
        dropped: true
  - set:
      vars.new_id: = 'nb-' + string(state.next_generation)
      state.next_generation: = state.next_generation + 1
  - title: Rewrite the owned partitions into a new sstable
    source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1436-1480
    call: data-disk.sstable-write
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_id: = vars.new_id
      size_mb: = input.sstable.size_mb - input.sstable.unowned_mb
  - call: lifecycle-transaction.commit
    input:
      keyspace: = input.keyspace
      table: = input.table
      obsolete_ids:
      - = input.sstable.id
      release_ids:
      - = input.sstable.id
      new_sstables:
      - id: = vars.new_id
        size_mb: = input.sstable.size_mb - input.sstable.unowned_mb
        level: = input.sstable.level
        repaired: = input.sstable.repaired
        droppable_tombstone_ratio: = input.sstable.droppable_tombstone_ratio
        age_s: 0
        fully_expired: false
        tombstones: = input.sstable.tombstones
        purgeable_tombstones: = input.sstable.purgeable_tombstones
        unowned_mb: 0
        window: = input.sstable.window
  - return:
      dropped: false
      new_sstable: = vars.new_id
- component: compaction-manager
  name: force-user-defined-cleanup
  kind: jmx
  summary: 'JMX forceUserDefinedCleanup(dataFiles): refuses (logs an error) before the node has joined the ring; otherwise cleans each named sstable.'
  attributes:
    mbean: org.apache.cassandra.db:type=CompactionManager
    operation: forceUserDefinedCleanup
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManagerMBean.java:54
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1182-1236
  request:
    type: object
    required:
    - data_files
    properties:
      replica:
        type: string
      data_files:
        type: string
        examples:
        - /var/lib/cassandra/data/shop/users-1b2c/nb-1-big-Data.db
  behavior:
  - set:
      vars.files: = input.data_files.split(',').map(f, f.trim())
      vars.replica: = self
  - call: storage-service.is-joined
    as: joined
  - if: '!vars.joined.value.joined'
    then:
    - title: Cleanup cannot run before a node has joined the ring
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1203-1207
      set:
        ctx.cleanup: not_joined
    - return:
        cleaned: 0
  - set:
      vars.cleaned: 0
  - foreach: = vars.files
    as: f
    steps:
    - set:
        vars.parts: = vars.f.split('/')
    - set:
        vars.ks: = vars.parts[size(vars.parts) - 3]
        vars.tbl: = vars.parts[size(vars.parts) - 2].split('-')[0]
        vars.sid: = vars.parts[size(vars.parts) - 1].split('-big-')[0]
    - call: tracker.get-view
      input:
        replica: = vars.replica
        keyspace: = vars.ks
        table: = vars.tbl
      as: v
    - set:
        vars.match: = vars.v.value.sstables.filter(s, s.id == vars.sid)
    - if: size(vars.match) == 0
      then:
      - title: Not an active sstable; skipped
        source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1219-1222
        continue: true
    - call: tracker.try-modify
      input:
        replica: = vars.replica
        keyspace: = vars.ks
        table: = vars.tbl
        sstable_ids:
        - = vars.sid
        compacting: = vars.v.value.compacting
    - call: compaction-manager.do-cleanup-one
      input:
        replica: = vars.replica
        keyspace: = vars.ks
        table: = vars.tbl
        sstable: = vars.match[0]
        has_indexes: false
    - set:
        vars.cleaned: = vars.cleaned + 1
  - set:
      ctx.cleanup: done
  - return:
      cleaned: = vars.cleaned
- component: compaction-manager
  name: stop-compaction
  kind: jmx
  summary: 'JMX stopCompaction(type): request a stop on every running operation of that OperationType.'
  attributes:
    mbean: org.apache.cassandra.db:type=CompactionManager
    operation: stopCompaction
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManagerMBean.java:66
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:2217-2226
  request:
    type: object
    required:
    - type
    properties:
      type:
        type: string
        examples:
        - COMPACTION
  errors:
  - code: illegal-argument
    summary: OperationType.valueOf rejects an unknown type name.
  behavior:
  - if: '!(input.type in [''CLEANUP'', ''SCRUB'', ''UPGRADE_SSTABLES'', ''VERIFY'', ''MAJOR_COMPACTION'', ''RELOCATE'', ''GARBAGE_COLLECT'', ''FLUSH'', ''WRITE'', ''ANTICOMPACTION'', ''VALIDATION'', ''INDEX_BUILD'',
      ''VIEW_BUILD'', ''COMPACTION'', ''TOMBSTONE_COMPACTION'', ''UNKNOWN'', ''STREAM'', ''KEY_CACHE_SAVE'', ''ROW_CACHE_SAVE'', ''COUNTER_CACHE_SAVE'', ''INDEX_SUMMARY''])'
    then:
    - title: Unknown operation type
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:2219
      fail:
        code: illegal-argument
        message: = 'No enum constant OperationType.' + input.type
  - call: active-compactions.get-compactions
    as: active
  - set:
      vars.matching: = vars.active.value.compactions.filter(c, c.type == input.type)
  - foreach: = vars.matching
    as: c
    steps:
    - title: Request a stop on the matching holder
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:2220-2224
      call: active-compactions.stop
      input:
        id: = vars.c.id
  - return:
      stopped: = size(vars.matching)
- component: compaction-manager
  name: stop-compaction-by-id
  kind: jmx
  summary: 'JMX stopCompactionById(compactionId): request a stop on the running operation with that task id.'
  attributes:
    mbean: org.apache.cassandra.db:type=CompactionManager
    operation: stopCompactionById
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManagerMBean.java:74
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:2228-2236
  request:
    type: object
    required:
    - compaction_id
    properties:
      compaction_id:
        type: string
        examples:
        - compaction-100
  behavior:
  - call: active-compactions.get-compactions
    as: active
  - set:
      vars.matching: = vars.active.value.compactions.filter(c, c.id == input.compaction_id)
  - foreach: = vars.matching
    as: c
    steps:
    - title: Request a stop on the holder with that id
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:2230-2235
      call: active-compactions.stop
      input:
        id: = vars.c.id
  - return:
      stopped: = size(vars.matching)
- component: compaction-manager
  name: submit-cache-write
  kind: function
  summary: Run a cache Writer on the compaction executor unless a save of that cache type is already in progress.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1928-1964
  request:
    type: object
    properties:
      cache_type:
        type: string
      keys:
        type: array
        items:
          type: string
      keys_to_save:
        type: integer
      schema_version:
        type: string
  behavior:
  - if: input.cache_type in state.flush_in_progress
    then:
    - title: Cache flushing already in progress; skip
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1939-1943
      set:
        ctx.cache_save: skipped_in_progress
    - return:
        written: 0
        skipped: true
  - set:
      vars.id: = 'cache-save-' + string(state.cache_writes)
      state.cache_writes: = state.cache_writes + 1
  - call: active-compactions.begin-compaction
    input:
      id: = vars.id
      type: = input.cache_type + '_SAVE'
      keyspace: ''
      table: ''
  - call: auto-saving-cache-writer.save-cache
    input:
      cache_type: = input.cache_type
      keys: = input.keys
      keys_to_save: = input.keys_to_save
      schema_version: = input.schema_version
    as: saved
  - title: Tracked as an active operation while it runs
    source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1946-1954
    call: active-compactions.finish-compaction
    input:
      id: = vars.id
  - return:
      written: = vars.saved.value.written
      skipped: false
- component: compaction-manager
  name: is-global-compaction-paused
  kind: function
  summary: True while any caller holds a global compaction pause (pauseGlobalCompaction).
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:2502-2505
  response:
    type: object
    properties:
      paused:
        type: boolean
  behavior:
  - return:
      paused: = state.global_compaction_pause_count > 0
- component: compaction-strategy-manager
  name: get-next-background-task
  kind: function
  summary: First promote or demote the sstables of finished incremental repairs; then return the first non-null task from the strategy instances (the code orders suppliers by remaining tasks; the model
    asks unrepaired, then repaired).
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:197-239
  request: ReadPathTableRef
  response: ReadPathCompactionTaskSpec
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.v: = vars.view.value
  - if: '!vars.v.auto_compaction_enabled'
    then:
    - title: Strategy manager disabled
      source: src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:203-204
      return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - title: Promote or demote sstables from completed repairs first
    source: src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:208-216
    call: pending-repair-manager.get-next-repair-finished-task
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: rf
  - if: vars.rf.value.found
    then:
    - return: = vars.rf.value
  - set:
      vars.uncompacting: = vars.v.sstables.filter(s, !(s.id in vars.v.compacting) && !('pending_repair' in s && s.pending_repair != ''))
      vars.npt: = 'never_purge_tombstones' in vars.v && vars.v.never_purge_tombstones
      vars.target: '= vars.v.strategy == ''LeveledCompactionStrategy'' ? ''leveled-compaction-strategy.get-next-background-task'' : (vars.v.strategy == ''TimeWindowCompactionStrategy'' ? ''time-window-compaction-strategy.get-next-background-task''
        : (vars.v.strategy == ''UnifiedCompactionStrategy'' ? ''unified-compaction-strategy.get-next-background-task'' : ''size-tiered-compaction-strategy.get-next-background-task''))'
  - title: Unrepaired strategy instance
    source: src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:219-231
    call: = vars.target
    targets:
    - size-tiered-compaction-strategy.get-next-background-task
    - leveled-compaction-strategy.get-next-background-task
    - time-window-compaction-strategy.get-next-background-task
    - unified-compaction-strategy.get-next-background-task
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstables: = vars.uncompacting.filter(s, !('repaired' in s && s.repaired))
      compacting: = vars.v.compacting
      min_threshold: = vars.v.min_threshold
      max_threshold: = vars.v.max_threshold
      never_purge_tombstones: = vars.npt
    as: unrepaired
  - if: vars.unrepaired.value.found
    then:
    - return: = vars.unrepaired.value
  - title: Repaired strategy instance
    source: src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:226-231
    call: = vars.target
    targets:
    - size-tiered-compaction-strategy.get-next-background-task
    - leveled-compaction-strategy.get-next-background-task
    - time-window-compaction-strategy.get-next-background-task
    - unified-compaction-strategy.get-next-background-task
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstables: = vars.uncompacting.filter(s, 'repaired' in s && s.repaired)
      compacting: = vars.v.compacting
      min_threshold: = vars.v.min_threshold
      max_threshold: = vars.v.max_threshold
      never_purge_tombstones: = vars.npt
    as: repaired
  - return: = vars.repaired.value
- component: compaction-strategy-manager
  name: get-maximal-tasks
  kind: function
  summary: With compactions cancelled and disabled, each repaired/unrepaired group marks all its sstables into one maximal task.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:1076-1100
  - src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:205-216
  request: ReadPathTableRef
  response:
    type: object
    properties:
      tasks:
        type: array
        items:
          $ref: ReadPathCompactionTaskSpec
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - title: runWithCompactionsDisabled interrupts running compactions and releases their sstables
    source: src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:1078-1083
    call: tracker.apply
    input:
      keyspace: = input.keyspace
      table: = input.table
      changes:
        compacting: []
    on_error: continue
  - set:
      vars.groups: = [vars.view.value.sstables.filter(s, !('repaired' in s && s.repaired)).map(s, s.id), vars.view.value.sstables.filter(s, 'repaired' in s && s.repaired).map(s, s.id)].filter(g, size(g)
        > 0)
  - set:
      vars.all: = vars.view.value.sstables.map(s, s.id)
  - if: size(vars.all) > 0
    then:
    - call: tracker.try-modify
      input:
        keyspace: = input.keyspace
        table: = input.table
        sstable_ids: = vars.all
        compacting: []
      on_error: continue
  - return:
      tasks: '= vars.groups.map(g, {''found'': true, ''sstable_ids'': g, ''operation_type'': ''MAJOR_COMPACTION'', ''level'': 0})'
- component: compaction-strategy-manager
  name: get-user-defined-tasks
  kind: function
  summary: Split the requested sstables by repair status; each group becomes a user-defined task if its sstables can be marked compacting.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionStrategyManager.java:1112-1130
  - src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:218-230
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstable_ids:
        type: array
        items:
          type: string
  response:
    type: object
    properties:
      tasks:
        type: array
        items:
          $ref: ReadPathCompactionTaskSpec
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.req: = vars.view.value.sstables.filter(s, s.id in input.sstable_ids)
  - set:
      vars.groups: = [vars.req.filter(s, !('repaired' in s && s.repaired)).map(s, s.id), vars.req.filter(s, 'repaired' in s && s.repaired).map(s, s.id)].filter(g, size(g) > 0)
  - call: tracker.try-modify
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = input.sstable_ids
      compacting: = vars.view.value.compacting
    as: txn
    on_error: continue
  - if: '!vars.txn.ok'
    then:
    - title: Unable to mark the sstables for compaction (a background compaction got them first)
      source: src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:222-227
      set:
        ctx.udc_result: unable_to_mark
    - return:
        tasks: []
  - return:
      tasks: '= vars.groups.map(g, {''found'': true, ''sstable_ids'': g, ''operation_type'': ''COMPACTION'', ''level'': 0})'
- component: size-tiered-compaction-strategy
  name: get-next-background-task
  kind: function
  summary: 'STCS: bucket by size (within 0.5x-1.5x of the bucket average, or all under 50MiB), trim each bucket to max_threshold hottest sstables, pick the hottest bucket with at least min_threshold; else
    the largest tombstone-heavy sstable.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:79-108
  - src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:178-203
  request:
    type: object
    properties:
      keyspace:
        type: string
      table:
        type: string
      sstables:
        type: array
        items:
          type: object
      compacting:
        type: array
        items:
          type: string
      min_threshold:
        type: integer
      max_threshold:
        type: integer
      never_purge_tombstones:
        type: boolean
        default: false
  response: ReadPathCompactionTaskSpec
  behavior:
  - set:
      vars.buckets: []
  - title: getBuckets over the sstables sorted by size
    source: src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:248-290
    foreach: = input.sstables.sortBy(s, s.size_mb)
    as: s
    max: 1000
    steps:
    - set:
        vars.fit: = lists.range(size(vars.buckets)).filter(i, (double(vars.s.size_mb) > vars.buckets[i].avg * 0.5 && double(vars.s.size_mb) < vars.buckets[i].avg * 1.5) || (vars.s.size_mb < 50 && vars.buckets[i].avg
          < 50.0))
    - if: size(vars.fit) > 0
      then:
      - set:
          vars.buckets: '= vars.buckets.transformList(i, b, i == vars.fit[0] ? {''files'': b.files + [vars.s], ''avg'': (b.avg * double(size(b.files)) + double(vars.s.size_mb)) / double(size(b.files) +
            1)} : b)'
      else:
      - set:
          vars.buckets: '= vars.buckets + [{''files'': [vars.s], ''avg'': double(vars.s.size_mb)}]'
  - title: Trim each bucket to its max_threshold hottest sstables; keep buckets with at least min_threshold
    source: src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:116-152
    set:
      vars.pruned: []
  - foreach: = vars.buckets
    as: bk
    steps:
    - set:
        vars.fs: '= vars.bk.files.sortBy(f, -(''read_rate'' in f ? double(f.read_rate) : 0.0))'
    - set:
        vars.fs: '= vars.fs.slice(0, size(vars.fs) > input.max_threshold ? input.max_threshold : size(vars.fs))'
    - when: size(vars.fs) >= input.min_threshold
      set:
        vars.pruned: '= vars.pruned + [{''files'': vars.fs, ''hot'': sum([0.0] + vars.fs.map(f, ''read_rate'' in f ? double(f.read_rate) : 0.0)), ''avg'': double(sum([0] + vars.fs.map(f, f.size_mb))) /
          double(size(vars.fs))}]'
  - if: size(vars.pruned) > 0
    then:
    - title: The hottest bucket wins; on equal hotness the comparator ranks the larger average size higher, and Collections.max takes it
      source: src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:45-56
      set:
        vars.chosen: = vars.pruned.filter(b, vars.pruned.all(o, o.hot < b.hot || (o.hot == b.hot && o.avg <= b.avg)))[0].files
        ctx.stcs_pick: bucket
    else:
    - title: No bucket qualifies; look for one sstable worth a tombstone compaction
      detail: Droppable tombstone ratio above tombstone_threshold 0.2, older than tombstone_compaction_interval 86400s, not neverPurgeTombstones, and no overlap that would keep the tombstones.
      source: src/java/org/apache/cassandra/db/compaction/AbstractCompactionStrategy.java:397-447
      set:
        vars.drop: '= has(input.never_purge_tombstones) && input.never_purge_tombstones ? [] : input.sstables.filter(s, ''droppable_tombstone_ratio'' in s && s.droppable_tombstone_ratio > 0.2 && s.age_s
          >= 86400 && !(''overlaps'' in s && s.overlaps))'
    - if: size(vars.drop) == 0
      then:
      - set:
          ctx.stcs_pick: none
      - return:
          found: false
          sstable_ids: []
          operation_type: ''
          level: 0
    - title: Compact the largest such sstable alone
      source: src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:95-107
      set:
        vars.chosen: = [vars.drop.filter(s, vars.drop.all(o, o.size_mb <= s.size_mb))[0]]
        ctx.stcs_pick: tombstone
  - title: Mark the candidates compacting (Tracker.tryModify)
    source: src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:198-201
    call: tracker.try-modify
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.chosen.map(s, s.id)
      compacting: = input.compacting
    as: txn
    on_error: continue
  - if: '!vars.txn.ok'
    then:
    - title: Could not acquire references; retry later
      source: src/java/org/apache/cassandra/db/compaction/SizeTieredCompactionStrategy.java:189-196
      return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - return:
      found: true
      sstable_ids: = vars.chosen.map(s, s.id)
      operation_type: COMPACTION
      level: 0
- component: leveled-compaction-strategy
  name: get-next-background-task
  kind: function
  summary: 'LCS: the manifest''s candidates, else one sstable for a tombstone compaction; mark them and build a LeveledCompactionTask.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/LeveledCompactionStrategy.java:131-182
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstables:
        type: array
        items:
          type: object
      compacting:
        type: array
        items:
          type: string
      min_threshold:
        type: integer
      max_threshold:
        type: integer
  response: ReadPathCompactionTaskSpec
  behavior:
  - call: leveled-manifest.get-compaction-candidates
    input:
      sstables: = input.sstables
      max_threshold: = input.max_threshold
      min_threshold: = input.min_threshold
    as: cand
  - set:
      vars.ids: = vars.cand.value.sstable_ids
      vars.level: = vars.cand.value.level
      vars.op: COMPACTION
  - if: '!vars.cand.value.found'
    then:
    - set:
        vars.drop: = input.sstables.filter(s, 'droppable_tombstone_ratio' in s && s.droppable_tombstone_ratio > 0.2 && s.age_s >= 86400 && !('overlaps' in s && s.overlaps))
    - if: size(vars.drop) == 0
      then:
      - title: No compaction necessary
        source: src/java/org/apache/cassandra/db/compaction/LeveledCompactionStrategy.java:138-146
        return:
          found: false
          sstable_ids: []
          operation_type: ''
          level: 0
    - title: Tombstone compaction of one sstable in its own level
      source: src/java/org/apache/cassandra/db/compaction/LeveledCompactionStrategy.java:147-151
      set:
        vars.ids: = [vars.drop[0].id]
        vars.level: = vars.drop[0].level
        vars.op: TOMBSTONE_COMPACTION
  - call: tracker.try-modify
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.ids
      compacting: = input.compacting
    as: txn
    on_error: continue
  - if: '!vars.txn.ok'
    then:
    - return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - title: LeveledCompactionTask (or a single-sstable uplevel task)
    source: src/java/org/apache/cassandra/db/compaction/LeveledCompactionStrategy.java:166-178
    return:
      found: true
      sstable_ids: = vars.ids
      operation_type: = vars.op
      level: = vars.level
- component: leveled-manifest
  name: get-compaction-candidates
  kind: function
  summary: Score levels from the top; when a level needs work but L0 has more than 32 sstables, size-tier L0 first; else compact L0 into L1.
  sources:
  - src/java/org/apache/cassandra/db/compaction/LeveledManifest.java:199-302
  request:
    type: object
    properties:
      sstables:
        type: array
        items:
          type: object
      max_threshold:
        type: integer
      min_threshold:
        type: integer
  response: ReadPathCompactionTaskSpec
  behavior:
  - set:
      vars.l0: = input.sstables.filter(s, s.level == 0)
  - title: Is L0 far enough behind to size-tier it (more than 32 sstables, STCS in L0 not disabled)?
    source: src/java/org/apache/cassandra/db/compaction/LeveledManifest.java:304-317
    set:
      vars.stcs_l0: = !state.disable_stcs_in_l0 && size(vars.l0) > 32
  - foreach:
    - 8
    - 7
    - 6
    - 5
    - 4
    - 3
    - 2
    - 1
    as: lvl
    steps:
    - set:
        vars.in_level: = input.sstables.filter(s, s.level == vars.lvl)
        vars.lsum: 0
    - foreach: = vars.in_level
      as: s
      max: 1000
      steps:
      - set:
          vars.lsum: = vars.lsum + vars.s.size_mb
    - if: vars.lsum * 1000 > state.level_max_mb[string(vars.lvl)] * 1001
      then:
      - if: vars.stcs_l0
        then:
        - title: L0 is too far behind; size-tier L0 before the higher level
          source: src/java/org/apache/cassandra/db/compaction/LeveledManifest.java:268-271
          set:
            ctx.lcs_pick: stcs_in_l0
        - return:
            found: true
            sstable_ids: = vars.l0.slice(0, input.max_threshold).map(s, s.id)
            operation_type: COMPACTION
            level: 0
      - title: Level over its target size (score above 1.001); compact one of its sstables into the next level
        source: src/java/org/apache/cassandra/db/compaction/LeveledManifest.java:258-283
        set:
          ctx.lcs_pick: = 'L' + string(vars.lvl)
      - return:
          found: true
          sstable_ids: = [vars.in_level[0].id] + input.sstables.filter(s, s.level == vars.lvl + 1).map(s, s.id)
          operation_type: COMPACTION
          level: = vars.lvl + 1
  - if: size(vars.l0) == 0
    then:
    - return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - set:
      vars.cands: '= vars.l0.slice(0, size(vars.l0) > input.max_threshold ? input.max_threshold : size(vars.l0))'
      vars.total: 0
  - foreach: = vars.cands
    as: s
    max: 1000
    steps:
    - set:
        vars.total: = vars.total + vars.s.size_mb
  - if: size(vars.cands) < 2
    then:
    - title: Fewer than two L0 candidates; fall back to the L0 size-tiering candidate if any
      source: src/java/org/apache/cassandra/db/compaction/LeveledManifest.java:566-569
      return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - title: Standard L0 compaction; with more than a full sstable of data, include the overlapping L1 sstables and promote
    source: src/java/org/apache/cassandra/db/compaction/LeveledManifest.java:556-565
    set:
      ctx.lcs_pick: L0
  - return:
      found: true
      sstable_ids: '= vars.total > state.max_sstable_size_mb ? vars.cands.map(s, s.id) + input.sstables.filter(s, s.level == 1).map(s, s.id) : vars.cands.map(s, s.id)'
      operation_type: COMPACTION
      level: '= vars.total > state.max_sstable_size_mb ? 1 : 0'
- component: time-window-compaction-strategy
  name: get-next-background-task
  kind: function
  summary: 'TWCS: newest window first; STCS within the current window (min_threshold), any older window with 2 or more sstables, plus fully expired sstables.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/TimeWindowCompactionStrategy.java:83-106
  - src/java/org/apache/cassandra/db/compaction/TimeWindowCompactionStrategy.java:303-361
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstables:
        type: array
        items:
          type: object
      compacting:
        type: array
        items:
          type: string
      min_threshold:
        type: integer
      max_threshold:
        type: integer
  response: ReadPathCompactionTaskSpec
  behavior:
  - if: size(input.sstables) == 0
    then:
    - return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - set:
      vars.expired: = input.sstables.filter(s, 'fully_expired' in s && s.fully_expired).map(s, s.id)
      vars.windows: = input.sstables.filter(s, !('fully_expired' in s && s.fully_expired)).map(s, s.window).distinct().sort().reverse()
      vars.chosen: []
  - set:
      vars.now: '= size(vars.windows) > 0 ? vars.windows[0] : 0'
  - foreach: = vars.windows
    as: w
    steps:
    - set:
        vars.in_w: = input.sstables.filter(s, !('fully_expired' in s && s.fully_expired) && s.window == vars.w)
    - if: vars.w >= vars.now && size(vars.in_w) >= input.min_threshold
      then:
      - title: Current window has enough sstables; size-tier inside it
        source: src/java/org/apache/cassandra/db/compaction/TimeWindowCompactionStrategy.java:320-336
        set:
          vars.chosen: '= vars.in_w.slice(0, size(vars.in_w) > input.max_threshold ? input.max_threshold : size(vars.in_w)).map(s, s.id)'
      - break: true
    - if: vars.w < vars.now && size(vars.in_w) >= 2
      then:
      - title: An older window with 2 or more sstables is compacted whole
        source: src/java/org/apache/cassandra/db/compaction/TimeWindowCompactionStrategy.java:343-351
        set:
          vars.chosen: '= vars.in_w.slice(0, size(vars.in_w) > input.max_threshold ? input.max_threshold : size(vars.in_w)).map(s, s.id)'
      - break: true
  - title: Fully expired sstables join the task
    source: src/java/org/apache/cassandra/db/compaction/TimeWindowCompactionStrategy.java:140-146
    set:
      vars.chosen: = vars.chosen + vars.expired
  - if: size(vars.chosen) == 0
    then:
    - return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - call: tracker.try-modify
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.chosen
      compacting: = input.compacting
    as: txn
    on_error: continue
  - if: '!vars.txn.ok'
    then:
    - return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - return:
      found: true
      sstable_ids: = vars.chosen
      operation_type: COMPACTION
      level: 0
- component: unified-compaction-strategy
  name: get-next-background-task
  kind: function
  summary: 'UCS (T4): compact the lowest density level holding at least 4 sstables, adding fully expired sstables.'
  description: 'Density levels are approximated by size: under 100MiB (the UCS minimum sstable size), under 400MiB, under 1600MiB, above. Sharding is not modeled.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/UnifiedCompactionStrategy.java:220-231
  - src/java/org/apache/cassandra/db/compaction/UnifiedCompactionStrategy.java:325-344
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstables:
        type: array
        items:
          type: object
      compacting:
        type: array
        items:
          type: string
      min_threshold:
        type: integer
      max_threshold:
        type: integer
  response: ReadPathCompactionTaskSpec
  behavior:
  - set:
      vars.expired: = input.sstables.filter(s, 'fully_expired' in s && s.fully_expired).map(s, s.id)
      vars.live: = input.sstables.filter(s, !('fully_expired' in s && s.fully_expired))
  - set:
      vars.levels: = [vars.live.filter(s, s.size_mb < 100), vars.live.filter(s, s.size_mb >= 100 && s.size_mb < 400), vars.live.filter(s, s.size_mb >= 400 && s.size_mb < 1600), vars.live.filter(s, s.size_mb
        >= 1600)].filter(l, size(l) >= 4)
  - title: 'Threshold from scaling parameter T4: 4 sstables per level'
    source: src/java/org/apache/cassandra/db/compaction/UnifiedCompactionStrategy.java:111-114
    set:
      vars.chosen: '= (size(vars.levels) > 0 ? vars.levels[0].map(s, s.id) : []) + vars.expired'
  - if: size(vars.chosen) == 0
    then:
    - return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - call: tracker.try-modify
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.chosen
      compacting: = input.compacting
    as: txn
    on_error: continue
  - if: '!vars.txn.ok'
    then:
    - title: A transaction could not be created
      source: src/java/org/apache/cassandra/db/compaction/UnifiedCompactionStrategy.java:242-248
      return:
        found: false
        sstable_ids: []
        operation_type: ''
        level: 0
  - return:
      found: true
      sstable_ids: = vars.chosen
      operation_type: COMPACTION
      level: 0
- component: compaction-task
  name: execute
  kind: function
  summary: 'CompactionTask.runMayThrow under AbstractCompactionTask.execute: drop expired, fit disk space, merge and purge, write, commit; abort on stop.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionTask.java:122-299
  - src/java/org/apache/cassandra/db/compaction/AbstractCompactionTask.java:96-112
  request:
    type: object
    required:
    - keyspace
    - table
    - sstable_ids
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstable_ids:
        type: array
        items:
          type: string
      operation_type:
        type: string
        default: COMPACTION
      level:
        type: integer
        default: 0
      user_defined:
        type: boolean
        default: false
      ignore_gc_grace:
        type: boolean
        default: false
  errors:
  - code: runtime
    summary: Not enough space for compaction; CompactionManager counts it aborted.
  - code: compaction-interrupted
    summary: A stop was requested; the transaction aborts and the originals stay live.
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.originals: = vars.view.value.sstables.filter(s, s.id in input.sstable_ids)
      vars.user_defined: = has(input.user_defined) && input.user_defined
      vars.op: '= has(input.operation_type) ? input.operation_type : ''COMPACTION'''
  - if: size(vars.originals) == 0
    then:
    - title: Empty transaction; nothing to do
      source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:128-129
      return:
        compacted: false
  - if: config['snapshot-before-compaction']
    then:
    - title: Snapshot before compaction (snapshot_before_compaction)
      source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:135-139
      set:
        ctx.compaction_snapshot: true
  - title: Fully expired sstables are dropped without being read
    source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:187-191
    set:
      vars.expired: = vars.originals.filter(s, 'fully_expired' in s && s.fully_expired)
      vars.ne: = vars.originals.filter(s, !('fully_expired' in s && s.fully_expired))
      vars.total: 0
      vars.removed: []
  - foreach: = vars.ne
    as: s
    max: 1000
    steps:
    - set:
        vars.total: = vars.total + vars.s.size_mb
  - foreach: = vars.ne
    as: unused
    max: 1000
    steps:
    - if: vars.total <= state.disk_free_mb
      then:
      - break: true
    - if: '''disk_space_check_enabled'' in vars.view.value && !vars.view.value.disk_space_check_enabled && vars.op == ''COMPACTION'''
      then:
      - title: Compaction space check disabled for the table (compactionDiskSpaceCheck(false)); compact everything
        source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:386-390
        break: true
    - if: '!vars.user_defined && size(vars.originals) - size(vars.removed) > 1'
      then:
      - set:
          vars.rem: = vars.ne.filter(s, !(s.id in vars.removed))
      - set:
          vars.big: = vars.rem.filter(s, vars.rem.all(o, o.size_mb <= s.size_mb))[0]
      - title: Not enough disk space; drop the largest sstable from the compaction
        source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:98-115
        set:
          vars.removed: = vars.removed + [vars.big.id]
          vars.total: = vars.total - vars.big.size_mb
          ctx.compaction_scope_reduced: true
      else:
      - set:
          state.aborted: = state.aborted + 1
          ctx.compaction_result: no_disk_space
      - call: lifecycle-transaction.abort
        input:
          keyspace: = input.keyspace
          table: = input.table
          release_ids: = vars.originals.map(s, s.id)
      - title: Not enough space for compaction; the task throws
        source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:421-441
        fail:
          code: runtime
          message: = 'Not enough space for compaction of ' + input.keyspace + '.' + input.table + ', expected write size = ' + string(vars.total) + 'MiB'
  - set:
      vars.compact: = vars.ne.filter(s, !(s.id in vars.removed))
      vars.task_id: = 'compaction-' + string(state.next_generation)
      vars.new_id: = 'nb-' + string(state.next_generation)
      state.next_generation: = state.next_generation + 1
  - title: Register the compaction as active
    source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:212
    call: active-compactions.begin-compaction
    input:
      id: = vars.task_id
      type: = vars.op
      keyspace: = input.keyspace
      table: = input.table
  - call: active-compactions.is-stop-requested
    input:
      id: = vars.task_id
      type: = vars.op
      global: false
    as: stop
  - if: vars.stop.value.stop_requested
    then:
    - call: active-compactions.finish-compaction
      input:
        id: = vars.task_id
    - call: lifecycle-transaction.abort
      input:
        keyspace: = input.keyspace
        table: = input.table
        release_ids: = vars.originals.map(s, s.id)
    - set:
        ctx.compaction_result: interrupted
    - title: Stop requested; the iterator throws CompactionInterruptedException
      source: src/java/org/apache/cassandra/db/compaction/CompactionIterator.java:726-746
      fail:
        code: compaction-interrupted
        message: '= ''Compaction interrupted: '' + vars.task_id'
  - title: gcBefore = nowInSec - gc_grace_seconds, the table's parameter (TableParams default 864000 s, 10 days)
    source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1970-1973
    set:
      vars.gcgs: "= 'gc_grace_seconds' in vars.view.value ? vars.view.value.gc_grace_seconds : 864000"
      vars.ign: = has(input.ignore_gc_grace) && input.ignore_gc_grace
      vars.npt: "= 'never_purge_tombstones' in vars.view.value && vars.view.value.never_purge_tombstones"
      vars.cids: = vars.originals.map(s, s.id)
  - set:
      vars.gc_before: = now / 1000 - vars.gcgs
      vars.others: = vars.view.value.sstables.filter(s, !(s.id in vars.cids))
      vars.tsum: 0
      vars.psum: 0
      vars.ssum: 0
  - title: The purge evaluator also looks at the memtables that hold the key
    source: src/java/org/apache/cassandra/db/compaction/CompactionController.java:265-275
    call: skip-list-memtable.cells-query
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: mem
    on_error: continue
  - set:
      vars.memcells: "= vars.mem.ok && type(vars.mem.value) == list ? vars.mem.value : []"
  - foreach: = vars.compact
    as: s
    max: 1000
    steps:
    - title: An sstable with no partition data carries only summary counts, so its precomputed purgeable count stands in for the per-cell test
      set:
        vars.tsum: "= vars.tsum + ('partitions' in vars.s ? 0 : ('tombstones' in vars.s ? vars.s.tombstones : 0))"
        vars.psum: "= vars.psum + ('partitions' in vars.s || vars.npt ? 0 : (vars.ign ? ('tombstones' in vars.s ? vars.s.tombstones : 0) : ('purgeable_tombstones' in vars.s ? vars.s.purgeable_tombstones : 0)))"
        vars.ssum: = vars.ssum + vars.s.size_mb
  - set:
      vars.cpsum: = vars.psum
      vars.newparts: {}
      vars.pkeys: = vars.compact.filter(s, 'partitions' in s).map(s, s.partitions.map(k, k)).flatten().distinct()
  - title: The CompactionIterator merges each partition across the inputs (Cells.reconcile), then PurgeFunction drops the tombstones the controller says are purgeable
    source: src/java/org/apache/cassandra/db/compaction/CompactionIterator.java:341-410
    foreach: = vars.pkeys
    as: pk
    max: 1000
    steps:
    - set:
        vars.pp: = vars.compact.filter(s, 'partitions' in s && vars.pk in s.partitions).map(s, s.partitions[vars.pk])
    - set:
        vars.pdel: "= math.greatest([-1] + vars.pp.map(p, 'deletion_ts' in p ? p.deletion_ts : -1))"
        vars.pcells: "= vars.pp.map(p, 'cells' in p ? p.cells : []).flatten()"
    - call: cells.reconcile
      input:
        cells: = vars.pcells
        deletion_ts: = vars.pdel
      as: pm
    - title: "getPurgeEvaluator: the smallest timestamp of the overlapping sstables (not in this compaction) and memtables that hold the key"
      source: src/java/org/apache/cassandra/db/compaction/CompactionController.java:245-284
      set:
        vars.ovts: "= vars.others.filter(s, 'partitions' in s && vars.pk in s.partitions).map(s, s.partitions.map(k, s.partitions[k]).map(p, ('cells' in p ? p.cells.map(c, c.timestamp) : []) + ('deletion_ts' in p && p.deletion_ts >= 0 ? [p.deletion_ts] : [])).flatten()).flatten() + (vars.memcells.exists(c, c.partition_key == vars.pk) ? vars.memcells.map(c, c.timestamp) : [])"
    - set:
        vars.hasov: = size(vars.ovts) > 0
        vars.minov: "= size(vars.ovts) > 0 ? math.least(vars.ovts) : 0"
    - title: "PurgeFunction: purge when localDeletionTime < gcBefore (or gc_grace is ignored) and the timestamp is below every overlapping timestamp; never when neverPurgeTombstones. A tombstone's localDeletionTime is its write time, timestamp (us) / 1000000"
      source: src/java/org/apache/cassandra/db/partitions/PurgeFunction.java:36-45
      set:
        vars.keep: = vars.pm.value.cells.filter(c, !(c.deleted && !vars.npt && (vars.ign || c.timestamp / 1000000 < vars.gc_before) && (!vars.hasov || c.timestamp < vars.minov)))
        vars.pdel_purged: = vars.pdel >= 0 && !vars.npt && (vars.ign || vars.pdel / 1000000 < vars.gc_before) && (!vars.hasov || vars.pdel < vars.minov)
    - set:
        vars.keepdel: "= vars.pdel_purged ? -1 : vars.pdel"
        vars.psum: "= vars.psum + size(vars.pm.value.cells) - size(vars.keep) + (vars.pdel_purged ? 1 : 0)"
    - when: size(vars.keep) > 0 || vars.keepdel >= 0
      set:
        vars.newparts: "= merge(vars.newparts, {vars.pk: {'cells': vars.keep, 'deletion_ts': vars.keepdel}})"
  - title: Tombstones purged by the merge; the new sstable keeps the surviving ones
    source: src/java/org/apache/cassandra/db/compaction/CompactionController.java:245-284
    set:
      ctx.tombstones_purged: = vars.psum
      vars.tleft: "= vars.tsum - vars.cpsum + size(vars.newparts.map(k, vars.newparts[k]).map(p, p.cells.filter(c, c.deleted).map(c, 1) + (p.deletion_ts >= 0 ? [1] : [])).flatten())"
  - if: size(vars.compact) > 0
    then:
    - title: Write the merged partitions to a new sstable (rate limited by compaction_throughput 64MiB/s)
      source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:222-240
      call: data-disk.sstable-write
      input:
        keyspace: = input.keyspace
        table: = input.table
        sstable_id: = vars.new_id
        size_mb: = vars.ssum
  - title: writer.finish() commits the transaction (point of no return)
    source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:243-244
    call: lifecycle-transaction.commit
    input:
      keyspace: = input.keyspace
      table: = input.table
      obsolete_ids: = vars.compact.map(s, s.id) + vars.expired.map(s, s.id)
      release_ids: = vars.originals.map(s, s.id)
      new_sstables: '= size(vars.compact) == 0 ? [] : [{''id'': vars.new_id, ''size_mb'': vars.ssum, ''level'': has(input.level) ? input.level : 0, ''repaired'': ''repaired'' in vars.compact[0] ? vars.compact[0].repaired
        : false, ''droppable_tombstone_ratio'': 0.0, ''age_s'': 0, ''fully_expired'': false, ''tombstones'': vars.tleft, ''purgeable_tombstones'': 0, ''unowned_mb'': 0, ''window'': ''window''
        in vars.compact[0] ? vars.compact[0].window : 0, ''pending_repair'': '''', ''read_rate'': 0.0, ''max_timestamp'': math.greatest([0] + vars.compact.map(s, ''max_timestamp'' in s ? s.max_timestamp
        : 0)), ''partitions'': vars.newparts}]'
  - call: active-compactions.finish-compaction
    input:
      id: = vars.task_id
  - title: Record the result in system.compaction_history
    source: src/java/org/apache/cassandra/db/compaction/CompactionTask.java:271-272
    set:
      state.history: '= state.history + [{''id'': vars.task_id, ''keyspace'': input.keyspace, ''table'': input.table, ''type'': vars.op, ''inputs'': size(vars.compact) + size(vars.expired), ''output'':
        size(vars.compact) == 0 ? '''' : vars.new_id, ''bytes_in_mb'': vars.ssum}]'
      ctx.compaction_result: compacted
  - return:
      compacted: true
      task_id: = vars.task_id
      output: '= size(vars.compact) == 0 ? '''' : vars.new_id'
      inputs: = size(vars.compact)
      expired_dropped: = size(vars.expired)
      excluded_for_space: = vars.removed
- component: lifecycle-transaction
  name: commit
  kind: function
  summary: 'prepareToCommit then commit: log obsoletions, swap new readers into the View, release the compacting marks.'
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/LifecycleTransaction.java:215-255
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      obsolete_ids:
        type: array
        items:
          type: string
      release_ids:
        type: array
        items:
          type: string
      new_sstables:
        type: array
        items:
          type: object
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - title: Commit the transaction log, then mark obsolete and notify (no rollback past this point)
    source: src/java/org/apache/cassandra/db/lifecycle/LifecycleTransaction.java:232-255
    call: tracker.apply
    input:
      keyspace: = input.keyspace
      table: = input.table
      changes:
        sstables: = vars.view.value.sstables.filter(s, !(s.id in input.obsolete_ids)) + input.new_sstables
        compacting: = vars.view.value.compacting.filter(id, !(id in input.release_ids))
  - return:
      committed: true
- component: lifecycle-transaction
  name: abort
  kind: function
  summary: Undo the transaction; the originals stay live and are no longer marked compacting.
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/LifecycleTransaction.java:262-300
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      release_ids:
        type: array
        items:
          type: string
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - title: Restore the originals and release the compacting marks
    source: src/java/org/apache/cassandra/db/lifecycle/LifecycleTransaction.java:281-298
    call: tracker.apply
    input:
      keyspace: = input.keyspace
      table: = input.table
      changes:
        compacting: = vars.view.value.compacting.filter(id, !(id in input.release_ids))
  - return:
      aborted: true
- component: tracker
  name: get-view
  kind: store
  summary: Read a table's current View (live sstables and the compacting set).
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/Tracker.java:135-138
  request:
    type: object
    properties:
      keyspace:
        type: string
      table:
        type: string
  store:
    table: views
    op: get
    key: = input.keyspace + '.' + input.table
    default:
      missing: true
      sstables: []
      compacting: []
      auto_compaction_enabled: true
      strategy: SizeTieredCompactionStrategy
      min_threshold: 4
      max_threshold: 32
- component: tracker
  name: try-modify
  kind: store
  summary: Mark sstables compacting if none of them already is; otherwise no transaction (null).
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/Tracker.java:123-130
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      sstable_ids:
        type: array
        items:
          type: string
      compacting:
        type: array
        items:
          type: string
  errors:
  - code: conflict
    status: 409
    summary: 'permitCompacting failed: an sstable is already compacting.'
  store:
    table: views
    op: update
    key: = input.keyspace + '.' + input.table
    value: '= {''compacting'': input.compacting + input.sstable_ids}'
    where: row != null && input.sstable_ids.all(id, !(id in row.compacting))
- component: tracker
  name: apply
  kind: store
  summary: Atomically swap in a modified View.
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/Tracker.java:135-150
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      changes:
        type: object
  store:
    table: views
    op: update
    key: = input.keyspace + '.' + input.table
    value: = input.changes
- component: active-compactions
  name: begin-compaction
  kind: function
  summary: Register a running operation (a CompactionInfo.Holder).
  sources:
  - src/java/org/apache/cassandra/db/compaction/ActiveCompactions.java:43-46
  request:
    type: object
    properties:
      id:
        type: string
      type:
        type: string
      keyspace:
        type: string
      table:
        type: string
  behavior:
  - set:
      state.compactions: '= state.compactions + [{''id'': input.id, ''type'': input.type, ''keyspace'': input.keyspace, ''table'': input.table, ''stop_requested'': false}]'
  - return:
      registered: true
- component: active-compactions
  name: finish-compaction
  kind: function
  summary: Unregister an operation and add its bytes to the compaction metrics.
  sources:
  - src/java/org/apache/cassandra/db/compaction/ActiveCompactions.java:48-55
  request:
    type: object
    properties:
      id:
        type: string
  behavior:
  - set:
      state.compactions: = state.compactions.filter(c, c.id != input.id)
  - return:
      finished: true
- component: active-compactions
  name: get-compactions
  kind: function
  summary: Snapshot of the running operations.
  sources:
  - src/java/org/apache/cassandra/db/compaction/ActiveCompactions.java:38-41
  response:
    type: object
    properties:
      compactions:
        type: array
        items:
          type: object
  behavior:
  - return:
      compactions: = state.compactions
- component: active-compactions
  name: stop
  kind: function
  summary: 'CompactionInfo.Holder.stop() on a registered holder: sets its stop-requested flag; the operation aborts at its next check.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionInfo.java:254-257
  request:
    type: object
    properties:
      id:
        type: string
  behavior:
  - set:
      state.compactions: '= state.compactions.map(c, c.id == input.id ? {''id'': c.id, ''type'': c.type, ''keyspace'': c.keyspace, ''table'': c.table, ''stop_requested'': true} : c)'
  - return:
      stopped: true
- component: active-compactions
  name: is-stop-requested
  kind: function
  summary: 'Holder.isStopRequested: its own flag, or (for global operations) a global compaction pause.'
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionInfo.java:265-268
  request:
    type: object
    properties:
      id:
        type: string
      type:
        type: string
      global:
        type: boolean
  response:
    type: object
    properties:
      stop_requested:
        type: boolean
  behavior:
  - set:
      vars.paused: false
  - if: input.global
    then:
    - call: compaction-manager.is-global-compaction-paused
      as: p
    - set:
        vars.paused: = vars.p.value.paused
  - return:
      stop_requested: = state.compactions.exists(c, c.id == input.id && c.stop_requested) || input.type in state.stop_requested_types || vars.paused
- component: index-summary-manager
  name: redistribute-summaries
  kind: function
  summary: Redistribute the index summary pool by read rate, skipped while global compaction is paused; an interruption is only logged.
  sources:
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:239-275
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:141-147
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManagerMBean.java:41
  response:
    type: object
    properties:
      redistributed:
        type: boolean
      reason:
        type: string
  behavior:
  - call: compaction-manager.is-global-compaction-paused
    as: paused
  - if: vars.paused.value.paused
    then:
    - title: Global compaction is paused; skip
      source: src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:241-242
      set:
        ctx.index_summary: skipped_paused
    - return:
        redistributed: false
        reason: paused
  - call: index-summary-redistribution.redistribute-summaries
    as: r
    on_error:
    - if: error.code == 'compaction-interrupted'
      then:
      - title: Index summary redistribution interrupted; logged at info
        source: src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:254-257
        set:
          ctx.index_summary: interrupted
      - return:
          redistributed: false
          reason: interrupted
    - title: Any other error is logged and rethrown
      source: src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:258-262
      fail: '= {''code'': error.code, ''message'': error.message}'
  - set:
      state.redistributions: = state.redistributions + 1
      ctx.index_summary: redistributed
  - return:
      redistributed: true
      reason: done
- component: index-summary-redistribution
  name: redistribute-summaries
  kind: function
  summary: Run the resampling as an active global operation; it stops when a stop or a global pause is requested.
  sources:
  - src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryManager.java:286-290
  errors:
  - code: compaction-interrupted
  behavior:
  - call: active-compactions.begin-compaction
    input:
      id: index-summary
      type: INDEX_SUMMARY
      keyspace: ''
      table: ''
  - call: active-compactions.is-stop-requested
    input:
      id: index-summary
      type: INDEX_SUMMARY
      global: true
    as: stop
  - call: active-compactions.finish-compaction
    input:
      id: index-summary
  - if: vars.stop.value.stop_requested
    then:
    - title: Stop requested during resampling
      source: src/java/org/apache/cassandra/io/sstable/indexsummary/IndexSummaryRedistribution.java:363-366
