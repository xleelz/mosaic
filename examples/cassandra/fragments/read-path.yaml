  steps:
  - interface: auto-saving-cache.set-capacity
    caller: operator
    'on': n1
    as: r
    input:
      cache_type: KEY_CACHE
      capacity_bytes: 1
  - interface: auto-saving-cache.set-capacity
    caller: operator
    'on': n1
    as: b
    input:
      cache_type: ROW_CACHE
      capacity_bytes: 2
  - interface: auto-saving-cache.set-capacity
    caller: operator
    'on': n1
    as: c
    input:
      cache_type: COUNTER_CACHE
      capacity_bytes: 3
  expect:
  - state['auto-saving-cache@n1'].key_cache_capacity_bytes == 1 && state['auto-saving-cache@n1'].row_cache_capacity_bytes == 2 && state['auto-saving-cache@n1'].counter_cache_capacity_bytes == 3
- id: cache-clear-row-and-counter
  name: invalidaterowcache and invalidatecountercache empty their caches
  fixtures:
  - one-node
  steps:
  - interface: auto-saving-cache.clear
    caller: operator
    'on': n1
    as: r
    input:
      cache_type: ROW_CACHE
  - interface: auto-saving-cache.clear
    caller: operator
    'on': n1
    as: b
    input:
      cache_type: COUNTER_CACHE
  state:
    auto-saving-cache:
      row_cache:
        k:
          partition: {}
      counter_cache:
        c:
          v: 1
  expect:
  - size(state['auto-saving-cache@n1'].row_cache) == 0 && size(state['auto-saving-cache@n1'].counter_cache) == 0
- id: cache-schedule-counter-default-period
  name: Rescheduling the counter cache save
  fixtures:
  - one-node
