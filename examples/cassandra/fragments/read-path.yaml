  expect:
  - result.value.scheduled && state['auto-saving-cache@n1'].counter_cache_save_period_set == result.value.period_s && state['auto-saving-cache@n1'].counter_cache_save_scheduled
- id: keys-ignoring-gc-grace-empty-table
  name: 'No sstables hold the keys: nothing compacts'
  fixtures:
