- component: compaction-manager
  name: force-compaction-for-token-range
  kind: function
  summary: With compactions disabled, compact the live sstables intersecting the token ranges as user-defined tasks (MAJOR_COMPACTION).
  description: Sstable bounds are not modeled, so every live sstable counts as intersecting a non-empty range list.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1032-1085
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
        examples:
        - shop
      table:
        type: string
        examples:
        - users
      ranges:
        type: array
        items:
          type: string
        default: []
  behavior:
  - set:
      vars.replica: = self
  - call: tracker.get-view
    input:
      replica: = vars.replica
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.ids: '= has(input.ranges) && size(input.ranges) > 0 ? vars.view.value.sstables.map(s, s.id) : []'
  - if: size(vars.ids) == 0
    then:
    - title: No sstables found for the provided token range
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1036-1040
      return:
        compacted: 0
  - call: compaction-strategy-manager.get-user-defined-tasks
    input:
      replica: = vars.replica
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.ids
    as: tasks
  - foreach: = vars.tasks.value.tasks
    as: t
    steps:
    - title: Each task runs as MAJOR_COMPACTION on the compaction executor
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1058-1066
      call: compaction-task.execute
      input:
        replica: = vars.replica
        keyspace: = input.keyspace
        table: = input.table
        sstable_ids: = vars.t.sstable_ids
        operation_type: MAJOR_COMPACTION
        level: 0
        user_defined: true
  - return:
      compacted: = size(vars.ids)
