  expect:
  - result.value.rebuilt == [] && state['secondary-index-manager@n1'].non_queryable == ['users_email_idx']
- id: row-cache-sentinel-race
  name: 'Another read holds the row cache sentinel: read normally without caching'
  fixtures:
  - one-node
  steps:
  - flow: replica-read
    'on': n1
    as: r
  state:
    single-partition-read-command:
      row_cached_tables:
