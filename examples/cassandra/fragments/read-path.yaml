  - flow: user-defined-cleanup
    input:
      data_files: /var/lib/cassandra/data/shop/users-1b2c/nb-77-big-Data.db
    as: r
  expect:
  - result.value.cleaned == 0 && size(state['tracker@n1'].views['shop.users'].sstables) == 4
- id: verify-reads-in-place
  name: nodetool verify checks every sstable without rewriting it
  fixtures:
  - one-node
  steps:
  - interface: compaction-manager.perform-verify
    caller: operator
    'on': n1
    as: r
    input: &id007
      keyspace: shop
      table: users
  expect:
  - result.value.status == 'SUCCESSFUL' && state['tracker@n1'].views['shop.users'].sstables.map(s, s.id) == ['nb-1', 'nb-2', 'nb-3', 'nb-4'] && size(state['tracker@n1'].views['shop.users'].compacting) ==
    0
- id: scrub-and-upgrade-rewrite-each
  name: scrub and upgradesstables rewrite each sstable in its own transaction
  fixtures:
