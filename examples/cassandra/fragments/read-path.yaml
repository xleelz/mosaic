  steps:
  - interface: compaction-manager.set-concurrent-compactors
    caller: operator
    'on': n1
    as: r
    input:
      value: 4
  - interface: compaction-manager.set-concurrent-view-builders
    caller: operator
    'on': n1
    as: v
    input:
      value: 3
  - interface: compaction-manager.set-rate-in-bytes
    caller: operator
    'on': n1
    as: rt
    input:
      bytes_per_second: 0
  - interface: compaction-manager.get-pending-tasks
    caller: operator
    'on': n1
    as: pt
  expect:
  - state['compaction-manager@n1'].executor_max_pool_size == 4 && state['compaction-manager@n1'].view_builders == 3 && state['compaction-manager@n1'].compaction_rate_bytes == -1.0 && result.value.pending_tasks
    == 0
- id: relocate-and-disable-autocompaction
  name: relocatesstables is a no-op with one data directory; disableautocompaction turns the strategy off
  fixtures:
  - one-node
  steps:
  - interface: compaction-manager.relocate-sstables
    caller: operator
