  expect:
  - result.ok && ctx.row_cache == 'miss_race' && state['auto-saving-cache@n1'].row_cache['shop.users:user:42'].sentinel
- id: read-meter-system-keyspace
  name: System keyspace sstables have no read meter
  fixtures:
  - one-node
  steps:
  - interface: sstable-reader-global-tidy.maybe-persist-sstable-read-meter
