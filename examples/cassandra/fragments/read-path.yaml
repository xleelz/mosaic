- component: cells
  name: reconcile
  kind: function
  summary: 'Cells.reconcile over every version of each column: the higher timestamp wins; on a tie a tombstone wins, then the greater value. Cells at or below the partition deletion are dropped. Tombstone
    cells are kept.'
  sources:
  - src/java/org/apache/cassandra/db/rows/Cells.java:80-128
  request:
    type: object
    properties:
      cells:
        type: array
        items:
          $ref: ReadPathCell
      deletion_ts:
        type: integer
        default: -1
  response:
    type: object
    properties:
      cells:
        type: array
        items:
          $ref: ReadPathCell
  behavior:
  - set:
      vars.all: '= input.cells.filter(c, c.timestamp > (has(input.deletion_ts) ? input.deletion_ts : -1)).map(c, {''column'': c.column, ''value'': (''deleted'' in c && c.deleted) ? null : c.value, ''timestamp'':
        c.timestamp, ''deleted'': (''deleted'' in c && c.deleted) || c.value == null})'
  - title: Per column, keep the cell that beats or ties every other version
    source: src/java/org/apache/cassandra/db/rows/Cells.java:95-120
    return:
      cells: = vars.all.map(c, c.column).distinct().sort().map(n, vars.all.filter(c, c.column == n && vars.all.filter(o, o.column == n).all(o, o.timestamp < c.timestamp || (o.timestamp == c.timestamp &&
        (c.deleted || (!o.deleted && string(c.value) >= string(o.value))))))[0])
- component: pending-repair-manager
  name: get-next-repair-finished-task
  kind: function
  summary: For the first pending-repair session that is no longer in progress (FINALIZED, FAILED or unknown), mark its sstables compacting and hand out a RepairFinishedCompactionTask.
  sources:
  - src/java/org/apache/cassandra/db/compaction/PendingRepairManager.java:355-365
  - src/java/org/apache/cassandra/db/compaction/PendingRepairManager.java:266-276
  request: ReadPathTableRef
  response: ReadPathCompactionTaskSpec
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.sessions: = vars.view.value.sstables.filter(s, 'pending_repair' in s && s.pending_repair != '' && !(s.id in vars.view.value.compacting)).map(s, s.pending_repair).distinct().sort()
  - foreach: = vars.sessions
    as: sid
    steps:
    - call: local-sessions.get-session
      input:
        key: = vars.sid
      as: sess
      on_error: continue
    - set:
        vars.st: '= vars.sess.ok && has(vars.sess.value.state) ? vars.sess.value.state : ''NONE'''
    - if: '!(vars.st in [''FINALIZED'', ''FAILED'', ''NONE''])'
      then:
      - title: Session still in progress; its sstables stay pending (canCleanup is false)
        source: src/java/org/apache/cassandra/db/compaction/PendingRepairManager.java:426-429
        continue: true
    - set:
        vars.ids: = vars.view.value.sstables.filter(s, 'pending_repair' in s && s.pending_repair == vars.sid).map(s, s.id)
    - call: tracker.try-modify
      input:
        keyspace: = input.keyspace
        table: = input.table
        sstable_ids: = vars.ids
        compacting: = vars.view.value.compacting
      as: txn
      on_error: continue
    - if: vars.txn.ok
      then:
      - title: getFinalSessionRepairedAt is the session's repairedAt when FINALIZED, else UNREPAIRED
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1147-1160
        return:
          found: true
          sstable_ids: = vars.ids
          operation_type: REPAIR_FINISHED
          level: 0
          session_id: = vars.sid
          repaired: = vars.st == 'FINALIZED'
  - return:
      found: false
      sstable_ids: []
      operation_type: ''
      level: 0
- component: pending-repair-manager-repair-finished-compaction-task
  name: run-may-throw
  kind: function
  summary: Move the session's sstables from pending to repaired (repairedAt set) after FINALIZED, or back to unrepaired after a failed session, by rewriting metadata only (mutateRepaired).
  sources:
  - src/java/org/apache/cassandra/db/compaction/PendingRepairManager.java:498-540
  request:
    type: object
    properties:
      keyspace:
        type: string
      table:
        type: string
      sstable_ids:
        type: array
        items:
          type: string
      session_id:
        type: string
      repaired:
        type: boolean
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - title: mutateRepaired(originals, repairedAt, NO_PENDING_REPAIR)
    source: src/java/org/apache/cassandra/db/compaction/PendingRepairManager.java:528-532
    call: tracker.apply
    input:
      keyspace: = input.keyspace
      table: = input.table
      changes:
        sstables: '= vars.view.value.sstables.map(s, s.id in input.sstable_ids ? merge(s, {''pending_repair'': '''', ''repaired'': input.repaired}) : s)'
        compacting: = vars.view.value.compacting.filter(id, !(id in input.sstable_ids))
  - set:
      ctx.repair_finished: '= input.repaired ? ''promoted'' : ''demoted'''
  - return:
      moved: = size(input.sstable_ids)
- component: compaction-manager
  name: submit-pending-anti-compaction
  kind: function
  summary: 'Incremental repair''s anticompaction: sstables fully inside the repaired ranges get pendingRepair = session and stay UNREPAIRED (metadata rewrite only); they leave the normal strategies until
    the session completes.'
  description: Sstable token bounds are not modeled, so every live, non-compacting sstable counts as fully contained.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:817-880
  request:
    type: object
    required:
    - keyspace
    - session_id
    properties:
      keyspace:
        type: string
        examples:
        - shop
      tables:
        type: array
        items:
          type: string
        examples:
        - - users
      session_id:
        type: string
        examples:
        - s1
  response:
    type: object
    properties:
      marked:
        type: integer
  behavior:
  - set:
      vars.marked: 0
  - foreach: '= has(input.tables) ? input.tables : []'
    as: t
    steps:
    - call: tracker.get-view
      input:
        keyspace: = input.keyspace
        table: = vars.t
      as: view
    - set:
        vars.ids: = vars.view.value.sstables.filter(s, !(s.id in vars.view.value.compacting) && !('repaired' in s && s.repaired) && !('pending_repair' in s && s.pending_repair != '')).map(s, s.id)
    - title: mutateRepaired(fullyContained, UNREPAIRED_SSTABLE, sessionID)
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:870-874
      call: tracker.apply
      input:
        keyspace: = input.keyspace
        table: = vars.t
        changes:
          sstables: '= vars.view.value.sstables.map(s, s.id in vars.ids ? merge(s, {''pending_repair'': input.session_id, ''repaired'': false}) : s)'
      on_error: continue
    - set:
        vars.marked: = vars.marked + size(vars.ids)
  - return:
      marked: = vars.marked
- component: tracker
  name: add-sstables
  kind: function
  summary: 'Tracker.addSSTables: make newly flushed (or loaded) sstables live in the View and notify, then the caller submits a background compaction.'
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/Tracker.java:252-270
  request:
    type: object
    required:
    - keyspace
    - table
    - sstables
    properties:
      keyspace:
        type: string
        examples:
        - shop
      table:
        type: string
        examples:
        - users
      sstables:
        type: array
        items:
          type: object
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - call: tracker.put-view
    input:
      keyspace: = input.keyspace
      table: = input.table
      view: '= merge(omit(vars.view.value, ''missing''), {''sstables'': vars.view.value.sstables + input.sstables})'
  - return:
      live: = size(vars.view.value.sstables) + size(input.sstables)
- component: tracker
  name: put-view
  kind: store
  summary: Write a table's whole View (used when a table's first sstable arrives).
  sources:
  - src/java/org/apache/cassandra/db/lifecycle/Tracker.java:135-150
  request:
    type: object
    properties:
      keyspace:
        type: string
      table:
        type: string
      view:
        type: object
  store:
    table: views
    op: put
    key: = input.keyspace + '.' + input.table
    value: = input.view
