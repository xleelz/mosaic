    type: error
    code: io-error
  expect:
  - '!result.ok && result.error.code == ''io-error'' && state[''index-summary-manager@n1''].redistributions == 0'
configs:
- id: read-request-timeout-ms
  type: integer
  value: 5000
  default: 5000
  summary: 'read_request_timeout: READ_REQ expiry.'
  sources:
  - conf/cassandra.yaml:1322
  - src/java/org/apache/cassandra/config/Config.java:145
  attributes:
    boundary: true
    owner: coordination
- id: range-request-timeout-ms
  type: integer
  value: 10000
  default: 10000
  summary: 'range_request_timeout: RANGE_REQ expiry.'
  sources:
  - conf/cassandra.yaml:1326
  - src/java/org/apache/cassandra/config/Config.java:148
  attributes:
    boundary: true
    owner: coordination
- id: tombstone-warn-threshold
  type: integer
  value: 1000
  default: 1000
  summary: More tombstones than this in one read logs a warning (and ClientWarn).
  sources:
  - conf/cassandra.yaml:1814
  - src/java/org/apache/cassandra/config/Config.java:534
- id: tombstone-failure-threshold
  type: integer
  value: 100000
  default: 100000
  summary: More tombstones than this aborts the read (TombstoneOverwhelmingException).
  sources:
  - conf/cassandra.yaml:1815
  - src/java/org/apache/cassandra/config/Config.java:535
- id: read-thresholds-enabled
  type: boolean
  value: false
  default: false
  summary: Coordinator read size/tombstone tracking (TRACK_WARNINGS); commented out in cassandra.yaml.
  sources:
  - conf/cassandra.yaml:2015
  - src/java/org/apache/cassandra/config/Config.java:526
- id: local-read-size-warn-threshold-kib
  type: integer
  value: -1
  default: -1
  summary: local_read_size_warn_threshold; unset (null) in both, -1 here.
  sources:
  - conf/cassandra.yaml:2025
  - src/java/org/apache/cassandra/config/Config.java:529
- id: local-read-size-fail-threshold-kib
  type: integer
  value: -1
  default: -1
  summary: local_read_size_fail_threshold; unset (null) in both, -1 here.
  sources:
  - conf/cassandra.yaml:2026
  - src/java/org/apache/cassandra/config/Config.java:530
- id: row-cache-size-mib
  type: integer
  value: 0
  default: 0
  summary: row_cache_size; 0 disables the row cache.
  sources:
  - conf/cassandra.yaml:564
  - src/java/org/apache/cassandra/config/Config.java:474
- id: key-cache-save-period-s
  type: integer
  value: 14400
  default: 14400
  summary: key_cache_save_period.
  sources:
  - conf/cassandra.yaml:538
  - src/java/org/apache/cassandra/config/Config.java:470
- id: row-cache-save-period-s
  type: integer
  value: 0
  default: 0
  summary: row_cache_save_period; 0 never saves.
  sources:
  - conf/cassandra.yaml:575
  - src/java/org/apache/cassandra/config/Config.java:476
- id: counter-cache-save-period-s
  type: integer
  value: 7200
  default: 7200
  summary: counter_cache_save_period.
  sources:
  - conf/cassandra.yaml:603
  - src/java/org/apache/cassandra/config/Config.java:482
- id: cache-load-timeout-s
  type: integer
  value: 30
  default: 30
  summary: cache_load_timeout; commented out in cassandra.yaml.
  sources:
  - conf/cassandra.yaml:617
  - src/java/org/apache/cassandra/config/Config.java:488
- id: concurrent-compactors
  type: integer
  value: 2
  default: 2
  summary: concurrent_compactors; commented out, so DatabaseDescriptor uses min(8, max(2, min(cores, data dirs))) = 2 with one data directory.
  sources:
  - conf/cassandra.yaml:1230
  - src/java/org/apache/cassandra/config/DatabaseDescriptor.java:777-778
- id: compaction-throughput-mib-per-sec
  type: integer
  value: 64
  default: 64
  summary: compaction_throughput.
  sources:
  - conf/cassandra.yaml:1251
  - src/java/org/apache/cassandra/config/Config.java:337
- id: snapshot-before-compaction
  type: boolean
  value: false
  default: false
  summary: snapshot_before_compaction.
  sources:
  - conf/cassandra.yaml:1141
  - src/java/org/apache/cassandra/config/Config.java:312
- id: automatic-sstable-upgrade
  type: boolean
  value: false
  default: false
  summary: automatic_sstable_upgrade; commented out.
