- component: compaction-manager
  name: parallel-all-sstable-operation
  kind: function
  summary: Mark all of a table's sstables, then run the operation on each sstable in its own transaction on the compaction executor.
  sources:
  - src/java/org/apache/cassandra/db/compaction/CompactionManager.java:424-494
  request:
    type: object
    properties:
      replica:
        type: string
      keyspace:
        type: string
      table:
        type: string
      operation_type:
        type: string
  response: ReadPathAllSSTableOpStatus
  behavior:
  - call: tracker.get-view
    input:
      keyspace: = input.keyspace
      table: = input.table
    as: view
  - set:
      vars.sstables: = vars.view.value.sstables.filter(s, !(s.id in vars.view.value.compacting))
  - if: size(vars.sstables) == 0
    then:
    - title: No sstables to process
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:442-446
      return:
        status: SUCCESSFUL
        status_code: 0
  - call: tracker.try-modify
    input:
      keyspace: = input.keyspace
      table: = input.table
      sstable_ids: = vars.sstables.map(s, s.id)
      compacting: = vars.view.value.compacting
    as: txn
    on_error:
    - title: Could not cancel the compactions holding the sstables
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:437-439
      return:
        status: UNABLE_TO_CANCEL
        status_code: 2
  - if: input.operation_type == 'VERIFY'
    then:
    - call: lifecycle-transaction.abort
      input:
        keyspace: = input.keyspace
        table: = input.table
        release_ids: = vars.sstables.map(s, s.id)
    - return:
        status: SUCCESSFUL
        status_code: 0
  - foreach: = vars.sstables
    as: s
    steps:
    - title: One transaction per sstable
      source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:448-468
      call: compaction-task.execute
      input:
        keyspace: = input.keyspace
        table: = input.table
        sstable_ids:
        - = vars.s.id
        operation_type: = input.operation_type
        level: = vars.s.level
        user_defined: true
  - return:
      status: SUCCESSFUL
      status_code: 0
