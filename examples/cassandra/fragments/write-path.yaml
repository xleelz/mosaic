    state:
      abstract-commit-log-segment-manager: {available_segment: false, on_disk_size_bytes: 8589934592}
      skip-list-memtable: {stats: {"shop.users": {operations: 10, partitions: 3, bytes: 3000}}}
    expect:
      - "result.ok && ctx.commitLogOverTotalSpace == true"
      - "calls['column-family-store.force-flush'] == 1 && calls['flushing-flush-runnable.call'] == 1"
