  - component: commit-log
    name: discard-completed-segments
    kind: function
    summary: After a flush, mark the table clean in the active segments up to the flushed position and archive/discard segments that became unused.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:345-383]
    request: WritePathTableRef
    response: WritePathCommitLogPosition
    description: >-
      Segment files are the commit-log state's segments_on_disk, ordered oldest first by id. An entry
      records the tables marked clean in clean_tables; it is already_persisted once every table of its
      mutation (table plus updates) is clean. The flush's upper bound lies in the allocating segment, so the
      walk stops there, and that segment is never unused (isStillAllocating).
    behavior:
      - call: commit-log-segment.get-cdc-state
        as: cur
      - call: commit-log.segments-query
        as: files
      - set:
          vars.ordered: "= vars.files.value.sortBy(f, has(f.id) ? f.id : 0)"
          vars.discarded: 0
      - title: Walk the active segments oldest to newest
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:361
        foreach: "= vars.ordered"
        as: f
        steps:
          - title: markClean - the table's entries up to the flushed position are now covered by an sstable
            source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:364
            set:
              vars.marked: "= vars.f.entries.map(e, e.mutation.keyspace == input.keyspace && (has(e.mutation.updates) && size(e.mutation.updates) > 0 ? e.mutation.updates.map(u, u.table) : [e.mutation.table]).exists(t, t == input.table) ? merge(e, {'clean_tables': (has(e.clean_tables) ? e.clean_tables : []) + [input.table], 'already_persisted': (has(e.mutation.updates) && size(e.mutation.updates) > 0 ? e.mutation.updates.map(u, u.table) : [e.mutation.table]).all(t, t == input.table || (has(e.clean_tables) && t in e.clean_tables))}) : e)"
              vars.allocating: "= has(vars.f.id) && vars.f.id == vars.cur.value.segment_id"
          - if: "vars.marked.all(e, has(e.already_persisted) && e.already_persisted) && !vars.allocating"
            then:
              - title: isUnused - every table in the segment is clean, so this segment is archived and discarded
                source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:366-370
                call: abstract-commit-log-segment-manager.archive-and-discard
                input: {name: "= vars.f.name", id: "= has(vars.f.id) ? vars.f.id : 0"}
              - set: {vars.discarded: "= vars.discarded + 1"}
            else:
              - title: Still dirty for another table (or still allocating) - not safe to delete, keep it with this table marked clean
                source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:371-376
                call: commit-log.segments-put
                input: {key: "= vars.f.name", row: "= merge(vars.f, {'entries': vars.marked})"}
          - if: "vars.allocating"
            then:
              - title: Stop at the segment containing the flush's upper bound
                source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:379-381
              - break: true
      - set: {ctx.segmentsDiscarded: "= vars.discarded"}

  - component: commit-log
    name: set-cdc-block-writes
    kind: jmx
    summary: CommitLogMBean.setCDCBlockWrites - requires CDC; turning blocking off re-permits a FORBIDDEN current segment.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLog.java:459-470
      - src/java/org/apache/cassandra/db/commitlog/CommitLog.java:487-493
      - src/java/org/apache/cassandra/db/commitlog/CommitLogMBean.java:94
    request: {type: object, required: [value], properties: {value: {type: boolean, default: false}}}
    response: {type: object, properties: {old_value: {type: boolean}, new_value: {type: boolean}}}
    errors:
      - {code: illegal-state, summary: "IllegalStateException: CDC is not enabled"}
    behavior:
      - if: "!config['cdc-enabled']"
        then:
          - title: ensureCDCEnabled - Preconditions.checkState fails
            source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:489
            fail: {code: illegal-state, message: CDC is not enabled. Unable to set block_writes.}
      - call: commit-log-segment.get-cdc-state
        as: seg
      - when: "!input.value && vars.seg.value.cdc_state == 'FORBIDDEN'"
        title: Blocking turned off - the FORBIDDEN current segment becomes PERMITTED
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:465-467
        call: commit-log-segment.set-cdc-state
        input: {cdc_state: PERMITTED}
      - set: {vars.old: "= 'cdc_block_writes' in state ? state.cdc_block_writes : config['cdc-block-writes']", state.cdc_block_writes: "= input.value"}
      - return: {old_value: "= vars.old", new_value: "= input.value"}

  - component: commit-log
