    expect:
      - "result.ok && result.value.action == 'wait'"
      - "!('shop.users' in state['column-family-store@n1'].live_sstables)"

  - id: wp-cleaner-below-threshold
    flow: memtable-cleaner
    fixtures: [one-node]
    name: Pool below memtable_cleanup_threshold - the cleaner waits
    expect:
      - "result.ok && result.value.cleaned == false && calls['abstract-allocator-memtable.flush-largest-memtable'] == 0"
