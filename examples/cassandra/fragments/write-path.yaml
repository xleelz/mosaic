      - "steps.c.result.ok && steps.r.result.ok && steps.r.result.value.value == 1"

  # ---------------------------------------------------------------- local apply on the coordinator
  - id: wp-local-apply
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: The coordinator is a replica and applies locally without messaging itself
    expect:
      - "result.ok && result.value.applied == true && calls['mutation-verb-handler.do-verb'] == 0"
      - "calls['commit-log.add'] == 1 && state['skip-list-memtable@n1'].cells['shop.users:user:42:name'].value == 'alice'"
  - id: wp-local-apply-then-read
    fixtures: [one-node]
    name: A local apply is readable from the node's memtable
    steps:
      - {flow: coordinator-local-apply, as: w}
      - {interface: skip-list-memtable.cells-get, caller: read-path, as: r, input: {key: "shop.users:user:42:name"}}
    expect:
      - "state['commit-log@n1'].appended == 1"
      - "steps.w.result.ok && steps.r.result.value.value == 'alice'"
  - id: wp-local-apply-two-tables
    fixtures: [one-node]
    name: One mutation with PartitionUpdates for shop.users and shop.orders under one key - one commit log entry, each table's memtable gets its own columns
    steps:
      - flow: coordinator-local-apply
        as: w
        input:
          mutation:
            keyspace: shop
            table: users
            partition_key: k1
            token: 77
            timestamp: 1000
            columns: {name: a}
            updates:
              - {table: users, columns: {name: a}}
              - {table: orders, columns: {total: 5}}
      - {interface: skip-list-memtable.cells-get, caller: read-path, as: ru, input: {key: "shop.users:k1:name"}}
      - {interface: skip-list-memtable.cells-get, caller: read-path, as: ro, input: {key: "shop.orders:k1:total"}}
    expect:
      - "steps.w.result.ok && state['commit-log@n1'].appended == 1 && calls['cassandra-table-write-handler.write'] == 2"
      - "steps.ru.result.value.value == 'a' && steps.ro.result.value.value == 5"
      - "!('shop.users:k1:total' in state['skip-list-memtable@n1'].cells) && !('shop.orders:k1:name' in state['skip-list-memtable@n1'].cells)"
  - id: wp-two-tables-flush-one-then-replay
    fixtures: [one-node]
    name: A two-table mutation, then a flush of users - the entry stays dirty for orders, and a replay re-applies only the orders update
    steps:
      - flow: coordinator-local-apply
        as: w
        input:
          mutation:
            keyspace: shop
            table: users
            partition_key: k1
            token: 77
            timestamp: 1000
            columns: {name: a}
            updates:
              - {table: users, columns: {name: a}}
              - {table: orders, columns: {total: 5}}
      - {flow: memtable-force-flush, as: f, input: {keyspace: shop, table: users, reason: USER_FORCED}}
      - {flow: commitlog-replay-startup, as: rp}
    expect:
      - "steps.f.result.value.flushed && state['commit-log@n1'].appended == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'keyspace.apply' && e.input.write_commit_log == false && e.input.mutation.table == 'orders' && size(e.input.mutation.updates) == 1)"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-table-write-handler.write' && e.input.mutation.table == 'users' && e.seq > trace.filter(x, x.type == 'call.start' && x.interface == 'commit-log.recover-segments-on-disk')[0].seq)"
  - id: wp-local-apply-unknown-table
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: A table missing locally - the commit log append still happens, then the update is skipped (Keyspace.java:624-634)
    input: {mutation: {table: dropped_table}}
    expect:
      - "result.ok && result.value.applied == false && ctx.unknownTable == 'shop.dropped_table'"
      - "state['commit-log@n1'].appended == 1 && calls['skip-list-memtable.put'] == 0"
  - id: wp-local-apply-view-lock-timeout
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: Local (non-deferrable, droppable) apply with a contended view lock fails with write-timeout
    state: {view-manager: {views_by_base_table: {shop.users: [users_by_city]}}}
    choices: {view-manager.acquire-lock-for.lock: contended}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.data.write_type == 'VIEW'"
      - "state['commit-log@n1'].appended == 0"

  # ---------------------------------------------------------------- commit log sync thread
  - id: wp-sync-periodic-cadence
    flow: commitlog-periodic-sync
    fixtures: [one-node]
    name: Only the wake-up after commitlog_sync_period (10000ms) fsyncs
    expect:
      - "passes[0].result.ok && passes[0].result.value.flushed == false"
      - "passes[1].result.value.flushed == false && passes[2].result.value.flushed == true"
      - "calls['commitlog-disk.segment-sync'] == 1 && state['abstract-commit-log-service@n1'].sync_count == 1"
  - id: wp-sync-requested
    flow: commitlog-periodic-sync
    fixtures: [one-node]
    name: A requested extra sync fsyncs on the next wake-up
    state: {abstract-commit-log-service: {sync_requested: true}}
    expect:
      - "passes[0].result.value.flushed == true && state['abstract-commit-log-service@n1'].sync_requested == false"
  - id: wp-sync-failure-stop
    flow: commitlog-periodic-sync
    fixtures: [one-node]
    name: "fsync fails with commit_failure_policy: stop - transports stopped, sync thread terminates"
    faults:
      - {target: commitlog-disk.segment-sync, type: error, code: io-error}
    expect:
      - "!passes[2].result.ok && passes[2].result.error.code == 'terminate'"
      - "ctx.transportsStopped == true && state['abstract-commit-log-service@n1'].terminated == true"
  - id: wp-sync-failure-ignore
    flow: commitlog-periodic-sync
    fixtures: [one-node]
    name: "fsync fails with commit_failure_policy: ignore - logged, thread keeps running"
    config: {commit-failure-policy: ignore}
    faults:
      - {target: commitlog-disk.segment-sync, type: error, code: io-error}
    expect:
      - "passes[2].result.ok && passes[2].result.value.flushed == false && ctx.syncThread == 'error-ignored'"
      - "state['abstract-commit-log-service@n1'].terminated == false"
  - id: wp-sync-then-lagging-write
    fixtures: [one-node]
    name: The sync thread's last sync time decides whether a later local write blocks
    steps:
      - {flow: commitlog-periodic-sync, as: s}
      - {flow: coordinator-local-apply, at_ms: 20000, as: w}
    expect:
      - "steps.s.result.ok && steps.w.result.ok && ctx.waitedOnCommit == true"
      - "state['abstract-commit-log-service@n1'].sync_count == 1"

  # ---------------------------------------------------------------- segment allocator
  - id: wp-allocator-reserve-present
    flow: commitlog-segment-allocator
