    name: setCDCOnRepairEnabled with CDC on, read back through isCDCOnRepairEnabled
    config: {cdc-enabled: true}
    steps:
      - {flow: commitlog-jmx-cdc-on-repair, as: s}
      - {interface: commit-log.is-cdc-on-repair-enabled, caller: operator, as: g}
    expect:
      - "steps.s.result.ok && steps.g.result.value.value == false && state['commit-log@n1'].cdc_on_repair_enabled == false"

  # ---------------------------------------------------------------- flush
  - id: wp-flush-dirty
    flow: memtable-force-flush
    fixtures: [one-node]
    name: Dirty memtable - switch, write an sstable, submit background compaction, discard clean segments, release memory
    state:
      skip-list-memtable: {stats: {"shop.users": {operations: 3, partitions: 2, bytes: 600}}}
      memtable-pool: {allocated_bytes: 600}
      abstract-commit-log-segment-manager: {active_segments: 3}
      commit-log:
        segments_on_disk:
          CommitLog-8-0.log:
            id: 0
            name: CommitLog-8-0.log
            entries:
              - mutation: {keyspace: shop, table: users, partition_key: "user:1", token: 11, timestamp: 1000, columns: {name: a}}
          CommitLog-8-00.log:
            id: 0
            name: CommitLog-8-00.log
            entries:
              - mutation: {keyspace: shop, table: users, partition_key: "user:2", token: 12, timestamp: 1001, columns: {name: b}}
    expect:
      - "result.ok && result.value.flushed == true && result.value.sstables == 1"
      - "calls['flushing-flush-runnable.call'] == 1 && calls['commit-log.discard-completed-segments'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'compaction-manager.submit-background')"
      # both older segments held only shop.users, so both became unused and were deleted one by one
      - "calls['abstract-commit-log-segment-manager.archive-and-discard'] == 2 && calls['commitlog-disk.segment-delete'] == 2 && state['abstract-commit-log-segment-manager@n1'].active_segments == 1"
      - "size(state['commit-log@n1'].segments_on_disk) == 0"
      - "state['skip-list-memtable@n1'].stats['shop.users'].partitions == 0 && state['memtable-pool@n1'].allocated_bytes == 0"
      - "state['column-family-store@n1'].live_sstables['shop.users'] == 1 && state['column-family-store@n1'].pending_flushes == 0"
  - id: wp-write-flush-read
    fixtures: [one-node]
    name: Write, flush, then read back - the data stays readable and the table has one live sstable
    steps:
      - {flow: coordinator-local-apply, as: w}
      - {flow: memtable-force-flush, as: f}
      - {interface: column-family-store.live-sstables-get, caller: read-path, as: n, input: {key: "shop.users"}}
      - {interface: single-partition-read-command.query-memtable-and-disk, caller: read-path, as: r, input: {read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 4242, kind: single_partition, limit: 100}}}
    expect:
      - "state['column-family-store@n1'].pending_flushes == 0 && state['skip-list-memtable@n1'].stats['shop.users'].partitions == 0"
      # the flushed memtable is reclaimed: its cells now live only in the new sstable, which the read finds
      - "!('shop.users:user:42:name' in state['skip-list-memtable@n1'].cells) && !('shop.users:user:42' in state['skip-list-memtable@n1'].partitions)"
      - "steps.f.result.value.flushed == true && steps.n.result.value == 1 && steps.r.result.value.sstables_iterated == 1"
      - "steps.r.result.value.partitions[0].cells.exists(c, c.column == 'name' && c.value == 'alice')"
  - id: wp-flush-clean
    flow: memtable-force-flush
    fixtures: [one-node]
    name: Clean memtable - no switch, no sstable
    expect:
      - "!('shop.users' in state['column-family-store@n1'].live_sstables)"
      - "result.ok && result.value.flushed == false && ctx.flushOutcome == 'clean'"
      - "calls['column-family-store.switch-memtable'] == 0 && calls['flushing-flush-runnable.call'] == 0 && calls['compaction-manager.submit-background'] == 0"
  - id: wp-flush-write-fails
    flow: memtable-force-flush
    fixtures: [one-node]
    name: sstable write fails - the error reaches the waiter and the commit log is kept
    state:
      skip-list-memtable: {stats: {"shop.users": {operations: 3, partitions: 2, bytes: 600}}}
    faults:
      - {target: data-disk.sstable-write, type: error, code: fs-write-error, status: 0}
    expect:
      - "!result.ok && result.error.code == 'fs-write-error' && ctx.flushOutcome == 'failed'"
      - "ctx.commitLogRetained == true && calls['commit-log.discard-completed-segments'] == 0 && calls['compaction-manager.submit-background'] == 0"
      - "calls['skip-list-memtable.discard'] == 0 && state['column-family-store@n1'].pending_flushes == 0"
  - id: wp-flush-owned-ranges-change
    flow: memtable-force-flush
    fixtures: [one-node]
    name: OWNED_RANGES_CHANGE does not switch an allocator memtable
    input: {reason: OWNED_RANGES_CHANGE}
    state:
      skip-list-memtable: {stats: {"shop.users": {operations: 3, partitions: 2, bytes: 600}}}
    expect:
      - "result.ok && result.value.flushed == false && ctx.flushOutcome == 'not-switched'"
      - "state['skip-list-memtable@n1'].stats['shop.users'].partitions == 2"
  - id: wp-flush-segments-still-dirty
    flow: memtable-force-flush
    fixtures: [one-node]
    name: The only older segment is still dirty for shop.orders - flush succeeds, users is marked clean, no segment is discarded
    state:
      skip-list-memtable: {stats: {"shop.users": {operations: 3, partitions: 2, bytes: 600}}}
      abstract-commit-log-segment-manager: {active_segments: 3}
      commit-log:
        segments_on_disk:
          CommitLog-8-0.log:
            id: 0
            name: CommitLog-8-0.log
            entries:
              - mutation: {keyspace: shop, table: users, partition_key: "user:2", token: 12, timestamp: 1001, columns: {name: b}}
              - mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 13, timestamp: 1002, columns: {total: 1}}
    expect:
      - "result.ok && result.value.flushed == true && calls['commitlog-disk.segment-delete'] == 0 && calls['abstract-commit-log-segment-manager.archive-and-discard'] == 0"
      - "state['abstract-commit-log-segment-manager@n1'].active_segments == 3"
      - "state['commit-log@n1'].segments_on_disk['CommitLog-8-0.log'].entries.exists(e, e.mutation.table == 'users' && e.already_persisted) && state['commit-log@n1'].segments_on_disk['CommitLog-8-0.log'].entries.exists(e, e.mutation.table == 'orders' && !(has(e.already_persisted) && e.already_persisted))"

  - id: wp-period-flush-disabled
    flow: memtable-period-flush
    fixtures: [one-node]
    name: memtable_flush_period_in_ms 0 (default) - nothing scheduled
    expect:
      - "result.ok && result.value.action == 'none' && calls['skip-list-memtable.is-clean'] == 0"
      - "!('shop.users' in state['column-family-store@n1'].live_sstables)"
  - id: wp-period-flush-expired-dirty
    flow: memtable-period-flush
    fixtures: [one-node]
