# write-path fragment of the Cassandra 5.0.9 ontology (built from code).
# Owns: db/commitlog/**, db/memtable/**, db/Keyspace.java, db/Mutation*.java,
# db/CounterMutation*.java, ColumnFamilyStore flush and truncate, db/WriteType.java,
# db/view/**, CDC. Also claims the replica-side handlers of MUTATION_REQ,
# COUNTER_MUTATION_REQ, PAXOS2_COMMIT_REMOTE_REQ and TRUNCATE_REQ, the
# Cassandra*WriteHandler classes, and the memtable memory pool/cleaner
# (utils/memory) because they only exist for the write path. See notes/write-path.md.
schema_version: 1
id: cassandra

components:
  # ---------------------------------------------------------------- verb handlers
  - id: mutation-verb-handler
    name: MutationVerbHandler
    kind: handler
    layer: storage
    parent: write-path
    summary: Replica side of MUTATION_REQ and PAXOS2_COMMIT_REMOTE_REQ; drops expired messages, checks size, forwards, applies and replies.
    sources: [src/java/org/apache/cassandra/db/MutationVerbHandler.java:29-94, src/java/org/apache/cassandra/net/Verb.java:116]
    description: Runs on the MUTATION stage, a pool of concurrent_writes (32) threads per node (capacity).
    capacity: {concurrency: 32}
  - id: abstract-mutation-verb-handler
    name: AbstractMutationVerbHandler
    kind: handler
    layer: storage
    parent: write-path
    summary: Shared doVerb/processMessage for mutation verbs; checks token ownership and optionally rejects out-of-range writes.
    sources: [src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:36-81]
  - id: counter-mutation-verb-handler
    name: CounterMutationVerbHandler
    kind: handler
    layer: storage
    parent: write-path
    summary: Replica (leader) side of COUNTER_MUTATION_REQ; hands the counter mutation to StorageProxy.applyCounterMutationOnLeader.
    sources: [src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java:30-55, src/java/org/apache/cassandra/net/Verb.java:137]
    description: Runs on the COUNTER_MUTATION stage, a pool of concurrent_counter_writes (32) threads per node (capacity).
    capacity: {concurrency: 32}
  - id: truncate-verb-handler
    name: TruncateVerbHandler
    kind: handler
    layer: storage
    parent: write-path
    summary: Replica side of TRUNCATE_REQ; truncates the table locally and replies with a TruncateResponse.
    sources: [src/java/org/apache/cassandra/db/TruncateVerbHandler.java:28-47]

  # ---------------------------------------------------------------- mutations and keyspace
  - id: mutation
    name: Mutation
    kind: module
    layer: storage
    parent: write-path
    summary: A set of partition updates for one partition key in one keyspace; validates its size and applies through Keyspace.
    sources: [src/java/org/apache/cassandra/db/Mutation.java:55-300]
  - id: counter-mutation
    name: CounterMutation
    kind: module
    layer: storage
    parent: write-path
    summary: Counter update applied on the leader replica - takes striped counter locks, reads current values (cache then table), writes the result mutation.
    sources: [src/java/org/apache/cassandra/db/CounterMutation.java:55-335]
  - id: keyspace
    name: Keyspace
    kind: module
    layer: storage
    parent: write-path
    summary: Applies mutations locally - MV locks, commit log append, view updates, memtable write; flushes all tables of a keyspace.
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:85-785]
    description: >-
      tables and durable_writes are this node's view of the schema (Keyspace instances and their
      ColumnFamilyStores); the base-schema fixture seeds them, init-cf and drop-cf maintain them.
    state:
      initial:
        durable_writes: {}
        tables: {}
  - id: cassandra-keyspace-write-handler
    name: CassandraKeyspaceWriteHandler
    kind: module
    layer: storage
    parent: write-path
    summary: Starts a write - opens the write OpOrder group and appends to the commit log when the write must be durable.
    sources: [src/java/org/apache/cassandra/db/CassandraKeyspaceWriteHandler.java:32-131]
  - id: cassandra-table-write-handler
    name: CassandraTableWriteHandler
    kind: module
    layer: storage
    parent: write-path
    summary: Writes one partition update into its table (ColumnFamilyStore.apply).
    sources: [src/java/org/apache/cassandra/db/CassandraTableWriteHandler.java:24-40]

  # ---------------------------------------------------------------- column family store (flush, truncate)
  - id: column-family-store
    name: ColumnFamilyStore (flush and truncate)
    kind: module
    layer: storage
    parent: write-path
    summary: Per-table store - memtable apply, memtable switch and flush, truncate, snapshots taken by truncate.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:194-260]
    state:
      initial:
        tables: {}
        pending_flushes: 0
        memtable_switch_count: 0
        live_sstables: {}
        truncation_records: {}
        snapshots: {}
        paxos_repair_history: {}
  - id: column-family-store-flush
    name: ColumnFamilyStore.Flush
    kind: task
    layer: storage
    parent: column-family-store
    summary: Flush task on the MemtableFlushWriter executor - waits on the write barrier, writes sstables per disk, commits, reclaims the memtable.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1175-1411, src/java/org/apache/cassandra/db/ColumnFamilyStore.java:206-208]
    description: The MemtableFlushWriter pool has memtable_flush_writers (2) threads per node (capacity).
    capacity: {concurrency: 2}
  - id: column-family-store-post-flush
    name: ColumnFamilyStore.PostFlush
    kind: task
    layer: storage
    parent: column-family-store
    summary: Post-flush task on the single-threaded MemtablePostFlush executor - discards commit log segments unless the flush failed.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1123-1165, src/java/org/apache/cassandra/db/ColumnFamilyStore.java:211-213]
    description: The MemtablePostFlush executor is single-threaded (capacity 1), so a flush future completes only after every earlier flush.
    capacity: {concurrency: 1}

  # ---------------------------------------------------------------- memtables
  - id: skip-list-memtable
    name: SkipListMemtable
    kind: datastore
    layer: storage
    parent: write-path
    summary: "Default memtable (memtable: default inherits skiplist). Each node (instance) holds its own partitions; cells are reconciled by timestamp."
    description: >-
      State is per instance. Store keys are keyspace.table + ':' + partition_key (partitions), with
      ':' + column appended for cells, and keyspace.table for the current memtable's stats. The cells
      table holds only unflushed data: a flush writes the switched-out memtable's partitions into a new
      sstable in read-path's Tracker View and then discards them here, so reads after a flush find the
      rows in the sstable. stats describe
      the current (unflushed) memtable and are reset by switch-out.
    sources:
      - src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:66-140
      - src/java/org/apache/cassandra/db/memtable/SkipListMemtableFactory.java:30-47
    state:
      initial: {partitions: {}, cells: {}, stats: {}}
  - id: abstract-allocator-memtable
    name: AbstractAllocatorMemtable
    kind: module
    layer: storage
    parent: write-path
    summary: Memtable base with a pool allocator - periodic flush scheduling, shouldSwitch, and the flush-largest-memtable cleaner.
    sources: [src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:55-324]
  - id: flushing-flush-runnable
    name: Flushing.FlushRunnable
    kind: task
    layer: storage
    parent: write-path
    summary: Writes the sorted contents of a memtable range to one sstable writer on a per-disk flush executor.
    sources: [src/java/org/apache/cassandra/db/memtable/Flushing.java:130-201]
  - id: memtable-allocator
    name: MemtableAllocator
    kind: module
    layer: storage
    parent: write-path
    summary: Per-memtable allocator; blocks writers when the memtable pool is full until a flush releases memory.
    sources: [src/java/org/apache/cassandra/utils/memory/MemtableAllocator.java:31-303]
  - id: memtable-pool
    name: MemtablePool (SlabPool for heap_buffers)
    kind: pool
    layer: storage
    parent: write-path
    summary: The node's memtable memory pool (one per instance) with a limit and a cleanup threshold that triggers the cleaner thread.
    sources:
      - src/java/org/apache/cassandra/utils/memory/MemtablePool.java:42-262
      - src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:77-112
    state:
      initial:
        allocated_bytes: 0
        reclaiming_bytes: 0
  - id: memtable-cleaner-thread-clean
    name: MemtableCleanerThread.Clean
    kind: task
    layer: storage
    parent: write-path
    summary: Infinite-loop task that flushes the largest memtable whenever the pool needs cleaning.
    sources: [src/java/org/apache/cassandra/utils/memory/MemtableCleanerThread.java:44-112]

  # ---------------------------------------------------------------- commit log
  - id: commit-log
    name: CommitLog
    kind: module
    layer: storage
    parent: write-path
    summary: Commit log facade - add (allocate, write, wait per sync mode), sync, replay at startup, discard after flush, CDC JMX switches.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:75-160]
    description: >-
      segments_on_disk stands for the commit log directory - every appended entry lands in its segment
      file, and replay at startup lists these files (CommitLog.getUnmanagedFiles). cdc_block_writes and
      cdc_on_repair_enabled appear in state only after the JMX setters change them; until then the
      config value applies.
    state:
      initial:
        appended: 0
        segments_on_disk: {}
  - id: abstract-commit-log-service
    name: AbstractCommitLogService
    kind: executor
    layer: storage
    parent: write-path
    summary: Commit log sync thread and the per-write wait policy; the SyncRunnable loop is modeled as sync-runnable-run on this component because it reads the service's fields.
    sources: [src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:51-145]
    description: >-
      last_synced_at_ms is -1 until the sync thread's first iteration, which records the start time,
      as the constructor does with lastSyncedAt = now (AbstractCommitLogService.java:62).
    state:
      initial:
        marker_interval_ms: 100
        last_synced_at_ms: -1
        sync_requested: false
        sync_count: 0
        written: 0
        terminated: false
  - id: periodic-commit-log-service
    name: PeriodicCommitLogService
    kind: executor
    layer: storage
    parent: write-path
    summary: "commitlog_sync: periodic (deployed) - acks before fsync; blocks writers only when the last sync lags by more than the block interval."
    sources: [src/java/org/apache/cassandra/db/commitlog/PeriodicCommitLogService.java:26-46]
  - id: batch-commit-log-service
    name: BatchCommitLogService
    kind: executor
    layer: storage
    parent: write-path
    summary: "commitlog_sync: batch - every write requests a sync and waits for it."
    sources: [src/java/org/apache/cassandra/db/commitlog/BatchCommitLogService.java:22-44]
  - id: group-commit-log-service
    name: GroupCommitLogService
    kind: executor
    layer: storage
    parent: write-path
    summary: "commitlog_sync: group - writes wait for the next sync, which runs every commitlog_sync_group_window."
    sources: [src/java/org/apache/cassandra/db/commitlog/GroupCommitLogService.java:27-43]
  - id: abstract-commit-log-segment-manager
    name: AbstractCommitLogSegmentManager
    kind: module
    layer: storage
    parent: write-path
    summary: Segment lifecycle - the COMMIT-LOG-ALLOCATOR thread keeps one reserve segment, advances allocation, flushes dirty tables over commitlog_total_space, discards clean segments.
    sources: [src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:69-120]
    state:
      initial:
        active_segments: 1
        available_segment: true
        reserve_cdc_state: PERMITTED
        on_disk_size_bytes: 67108864
        dirty_tables:
          - {keyspace: shop, table: users}
  - id: commit-log-segment-manager-standard
    name: CommitLogSegmentManagerStandard
    kind: module
    layer: storage
    parent: abstract-commit-log-segment-manager
    summary: Segment manager used when cdc_enabled is false (deployed).
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerStandard.java:24-69]
  - id: commit-log-segment-manager-cdc
    name: CommitLogSegmentManagerCDC
    kind: module
    layer: storage
    parent: abstract-commit-log-segment-manager
    summary: Segment manager used when cdc_enabled is true - tracks cdc_raw usage and rejects CDC mutations on FORBIDDEN segments.
    description: The CDCSizeTracker inner class's counters are kept in this component's state.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:48-452]
    state:
      initial:
        cdc_size_in_progress_bytes: 0
  - id: commit-log-segment
    name: CommitLogSegment
    kind: datastore
    layer: storage
    parent: write-path
    summary: The segment currently allocated from (allocatingFrom) - an mmap'd 32MiB file (commitlog_disk_access_mode legacy, uncompressed -> mmap).
    description: The state stands for whichever segment is allocatingFrom; discard-unused-tail closes it and the state rolls to the next segment.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:66-130
      - src/java/org/apache/cassandra/db/commitlog/MemoryMappedSegment.java:40-135
      - src/java/org/apache/cassandra/config/DatabaseDescriptor.java:1525-1528
    state:
      initial:
        id: 1
        position: 0
        free_bytes: 33554432
        cdc_state: PERMITTED
  - id: commit-log-archiver
    name: CommitLogArchiver
    kind: module
    layer: storage
    parent: write-path
    summary: Runs archive_command / restore_command from commitlog_archiving.properties (all empty as shipped, so a no-op).
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:55-125]
  - id: commit-log-replayer
    name: CommitLogReplayer
    kind: module
    layer: storage
    parent: write-path
    summary: Startup replay - reads segments, skips positions already persisted in sstables, re-applies the rest, then flushes.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:72-115]
  - id: commit-log-replayer-mutation-initiator
    name: CommitLogReplayer.MutationInitiator
    kind: task
    layer: storage
    parent: commit-log-replayer
    summary: Submits each replayed mutation to Stage.MUTATION, filtering out already-persisted table updates.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:281-333]
  - id: commit-log-reader
    name: CommitLogReader
    kind: module
    layer: storage
    parent: write-path
    summary: Reads a segment's descriptor and sync sections, verifies CRCs, and hands mutations to the replayer.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReader.java:50-140]

  # ---------------------------------------------------------------- materialized views
  - id: view-manager
    name: ViewManager
    kind: module
    layer: storage
    parent: write-path
    summary: Per-keyspace registry of materialized views; decides whether a mutation affects a view and hands out striped view locks.
    sources: [src/java/org/apache/cassandra/db/view/ViewManager.java:56-207]
    state:
      initial:
        views_by_base_table: {}
  - id: table-views
    name: TableViews
    kind: module
    layer: storage
    parent: write-path
    summary: The views of one base table; reads existing rows, generates view mutations and sends them through StorageProxy.mutateMV.
    sources: [src/java/org/apache/cassandra/db/view/TableViews.java:52-171]
  - id: view
    name: View
    kind: module
    layer: storage
    parent: write-path
    summary: One materialized view; starts and stops its builder.
    sources: [src/java/org/apache/cassandra/db/view/View.java:48-266]
  - id: view-builder
    name: ViewBuilder
    kind: module
    layer: storage
    parent: write-path
    summary: Builds a view over the local ranges with ViewBuilderTasks on the compaction executor; records status in system tables.
    description: built-views rows stand for system.built_views / system_distributed.view_build_status.
    sources: [src/java/org/apache/cassandra/db/view/ViewBuilder.java:60-249]
    state:
      initial: {built_views: {}}
  - id: view-builder-task
    name: ViewBuilderTask
    kind: task
    layer: storage
    parent: write-path
    summary: Builds one token range of a view - waits for schema agreement, iterates base keys, sends view mutations.
    description: Runs on the view build executor, concurrent_materialized_view_builders (1) threads (capacity).
    capacity: {concurrency: 1}
    sources: [src/java/org/apache/cassandra/db/view/ViewBuilderTask.java:66-273]

  - id: view-utils
    name: ViewUtils
    kind: function
    layer: storage
    parent: write-path
    summary: Pairs a base replica with the view replica at the same position in the view token's (local-DC) replica list.
    sources: [src/java/org/apache/cassandra/db/view/ViewUtils.java:32-105]
  - {id: snapshot-manager, name: SnapshotManager, parent: repair-streaming, sources: [src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:48-172], attributes: {boundary: true, owner: repair-streaming}}

  # ---------------------------------------------------------------- boundary stub components
  - {id: storage-proxy, name: StorageProxy, parent: coordination, sources: [src/java/org/apache/cassandra/service/StorageProxy.java], attributes: {boundary: true, owner: coordination}}
  - {id: storage-service, name: StorageService, parent: membership, sources: [src/java/org/apache/cassandra/service/StorageService.java], attributes: {boundary: true, owner: membership}}
  - {id: gossiper, name: Gossiper, parent: membership, sources: [src/java/org/apache/cassandra/gms/Gossiper.java], attributes: {boundary: true, owner: membership}}
  - {id: single-partition-read-command, name: SinglePartitionReadCommand, parent: read-path, sources: [src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java], attributes: {boundary: true, owner: read-path}}
  - {id: secondary-index-manager, name: SecondaryIndexManager, parent: read-path, sources: [src/java/org/apache/cassandra/index/SecondaryIndexManager.java], attributes: {boundary: true, owner: read-path}}
  - {id: tracker, name: Tracker, parent: read-path, sources: [src/java/org/apache/cassandra/db/lifecycle/Tracker.java:115-150], attributes: {boundary: true, owner: read-path}}
  - {id: compaction-manager, name: CompactionManager, parent: read-path, sources: [src/java/org/apache/cassandra/db/compaction/CompactionManager.java], attributes: {boundary: true, owner: read-path}}
  - {id: active-repair-service, name: ActiveRepairService, parent: repair-streaming, sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java], attributes: {boundary: true, owner: repair-streaming}}

configs:
  - {id: commitlog-sync, type: string, value: periodic, summary: "Commit log sync mode (periodic, batch or group). Config.java has no default (null); the yaml sets periodic.", sources: [conf/cassandra.yaml:634, src/java/org/apache/cassandra/config/Config.java:391], attributes: {key: commitlog_sync}}
  - {id: commitlog-sync-period-ms, type: integer, value: 10000, default: 0, summary: "Periodic sync interval. Deployed 10000ms; the code default is 0ms.", sources: [conf/cassandra.yaml:636, src/java/org/apache/cassandra/config/Config.java:395], attributes: {key: commitlog_sync_period}}
  - {id: periodic-commitlog-sync-lag-block-ms, type: integer, value: 15000, default: 15000, summary: "Writers block when the last sync is older than this. Unset in both places, so DatabaseDescriptor uses 1.5 x commitlog_sync_period.", sources: [conf/cassandra.yaml:641, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:3423-3429], attributes: {key: periodic_commitlog_sync_lag_block}}
  - {id: commitlog-sync-group-window-ms, type: integer, value: 0, default: 0, summary: "Group mode window. The yaml's 1000ms is commented out; group mode with 0ms fails to start.", sources: [conf/cassandra.yaml:629, src/java/org/apache/cassandra/config/Config.java:393], attributes: {key: commitlog_sync_group_window}}
  - {id: commitlog-segment-size-bytes, type: integer, value: 33554432, default: 33554432, summary: "Commit log segment size (32MiB).", sources: [conf/cassandra.yaml:660, src/java/org/apache/cassandra/config/Config.java:397], attributes: {key: commitlog_segment_size}}
  - {id: max-mutation-size-bytes, type: integer, value: 16777216, default: 16777216, summary: "Largest accepted mutation. Unset, so half of commitlog_segment_size.", sources: [conf/cassandra.yaml:652, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:898-899], attributes: {key: max_mutation_size}}
  - {id: commitlog-total-space-bytes, type: integer, value: 8589934592, default: 8589934592, summary: "Commit log space before flushing dirty tables. Unset; min(8192MiB, 1/4 of the volume), modeled as 8GiB.", sources: [conf/cassandra.yaml:883, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:664-674], attributes: {key: commitlog_total_space}}
  - {id: commitlog-archive-command, type: string, value: "", default: "", summary: "archive_command from commitlog_archiving.properties (empty as shipped).", sources: [conf/commitlog_archiving.properties, src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:127], attributes: {key: archive_command}}
  - {id: commitlog-restore-directories, type: string, value: "", default: "", summary: "restore_directories from commitlog_archiving.properties (empty as shipped).", sources: [conf/commitlog_archiving.properties, src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:129], attributes: {key: restore_directories}}
  - {id: commitlog-ignore-replay-errors, type: boolean, value: false, default: false, summary: "-Dcassandra.commitlog.ignorereplayerrors (unset).", sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:537], attributes: {key: cassandra.commitlog.ignorereplayerrors}}
  - {id: commit-failure-policy, type: string, value: stop, default: stop, summary: "What a commit log error does (die, stop, stop_commit, ignore).", sources: [conf/cassandra.yaml:488, src/java/org/apache/cassandra/config/Config.java:125], attributes: {key: commit_failure_policy}}
  - {id: cdc-enabled, type: boolean, value: false, default: false, summary: "Change data capture (selects CommitLogSegmentManagerCDC).", sources: [conf/cassandra.yaml:413, src/java/org/apache/cassandra/config/Config.java:410], attributes: {key: cdc_enabled}}
  - {id: cdc-block-writes, type: boolean, value: true, default: true, summary: "Reject CDC writes when cdc_raw is full (the yaml line is commented).", sources: [conf/cassandra.yaml:418, src/java/org/apache/cassandra/config/Config.java:413], attributes: {key: cdc_block_writes}}
  - {id: cdc-on-repair-enabled, type: boolean, value: true, default: true, summary: "Replay streamed CDC data through the write path (the yaml line is commented).", sources: [conf/cassandra.yaml:425, src/java/org/apache/cassandra/config/Config.java:416], attributes: {key: cdc_on_repair_enabled, boundary: true, owner: repair-streaming}}
  - {id: cdc-total-space-bytes, type: integer, value: 4294967296, default: 0, summary: "cdc_raw allowance. Config default 0MiB means min(4096MiB, 1/8 of the volume), modeled as 4GiB.", sources: [conf/cassandra.yaml:923, src/java/org/apache/cassandra/config/Config.java:419, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:684-694], attributes: {key: cdc_total_space}}
  - {id: memtable-heap-space-bytes, type: integer, value: 2147483648, default: 2147483648, summary: "Memtable pool limit. Unset; 1/4 of the heap, assuming an 8GiB heap.", sources: [conf/cassandra.yaml:797, src/java/org/apache/cassandra/config/Config.java:187], attributes: {key: memtable_heap_space}}
  - {id: memtable-cleanup-threshold, type: number, value: 0.3333, default: 0.3333, summary: "Pool fraction that triggers the cleaner. Unset (the yaml's 0.11 is commented); 1 / (memtable_flush_writers + 1).", sources: [conf/cassandra.yaml:812, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:761-763], attributes: {key: memtable_cleanup_threshold}}
  - {id: memtable-flush-writers, type: integer, value: 2, default: 0, summary: "MemtableFlushWriter threads (the flush executor's capacity). Config 0 means 2 for one data directory.", sources: [conf/cassandra.yaml:912, src/java/org/apache/cassandra/config/DatabaseDescriptor.java:753-755], attributes: {key: memtable_flush_writers}}
  - {id: concurrent-writes, type: integer, value: 32, default: 32, summary: "MUTATION stage threads (mutation-verb-handler capacity).", sources: [conf/cassandra.yaml:723, src/java/org/apache/cassandra/config/Config.java:180], attributes: {key: concurrent_writes}}
  - {id: concurrent-counter-writes, type: integer, value: 32, default: 32, summary: "COUNTER_MUTATION stage threads (counter-mutation-verb-handler capacity).", sources: [conf/cassandra.yaml:724, src/java/org/apache/cassandra/config/Config.java:181], attributes: {key: concurrent_counter_writes}}
  - {id: auto-snapshot, type: boolean, value: true, default: true, summary: "Snapshot a table before truncate or drop.", sources: [conf/cassandra.yaml:1147, src/java/org/apache/cassandra/config/Config.java:313], attributes: {key: auto_snapshot}}
  - {id: log-out-of-token-range-requests, type: boolean, value: true, default: true, summary: log_out_of_token_range_requests., sources: [src/java/org/apache/cassandra/config/Config.java:792]}
  - {id: reject-out-of-token-range-requests, type: boolean, value: false, default: false, summary: "Reject such writes with a failure response (not in the yaml).", sources: [src/java/org/apache/cassandra/config/Config.java:793], attributes: {key: reject_out_of_token_range_requests, boundary: true, owner: coordination}}
  - {id: concurrent-materialized-view-builders, type: integer, value: 1, default: 1, summary: "View build executor threads (view-builder-task capacity).", sources: [conf/cassandra.yaml:1242, src/java/org/apache/cassandra/config/Config.java:346], attributes: {key: concurrent_materialized_view_builders, boundary: true, owner: read-path}}
  - {id: write-request-timeout-ms, type: integer, value: 2000, default: 2000, summary: "Coordinator write timeout; write-path also bounds the materialized-view lock wait with it.", sources: [conf/cassandra.yaml:1330, src/java/org/apache/cassandra/config/Config.java:151], attributes: {key: write_request_timeout, boundary: true, owner: coordination}}
  - {id: counter-write-request-timeout-ms, type: integer, value: 5000, default: 5000, summary: "Counter write timeout; CounterMutation also bounds its lock wait with it.", sources: [conf/cassandra.yaml:1334, src/java/org/apache/cassandra/config/Config.java:154], attributes: {key: counter_write_request_timeout, boundary: true, owner: coordination}}

schemas:
  - id: WritePathMutation
    summary: A Mutation (one partition key, one keyspace) as it travels in MUTATION_REQ and through the local write path.
    schema:
      type: object
      required: [keyspace, table, partition_key, token, timestamp, columns]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        partition_key: {type: string, examples: ["user:42"]}
        token: {type: integer, examples: [4242]}
        timestamp: {type: integer, examples: [1730000000000000]}
        columns: {type: object, examples: [{name: alice, city: paris}]}
        serialized_size: {type: integer, minimum: 0, default: 220}
        partition_deletion: {type: boolean, default: false, description: "DELETE of the whole partition (partition-level DeletionTime at this mutation's timestamp)"}
        cells:
          type: array
          default: []
          description: Optional cells with their own timestamps, for mutations built from a cell list (read repair) or carrying cell tombstones (deleted true); CEL cannot build a map from a list. A null value in columns is also a cell tombstone.
          items:
            type: object
            required: [column, timestamp]
            properties:
              column: {type: string}
              value: {}
              timestamp: {type: integer}
              deleted: {type: boolean, default: false}
        updates:
          type: array
          default: []
          description: >-
            Every PartitionUpdate of the Mutation, one per table of the same keyspace and partition key
            (Mutation.modifications is keyed by TableId). When present and non-empty it is the complete list,
            and table, columns, cells and partition_deletion above mirror the first entry; when absent or empty
            the mutation is the single update above. Entries default their keyspace, partition_key, token and
            timestamp to the mutation's. A batch that writes two tables under one partition key builds one
            Mutation holding both (Mutation.java:65, 147; BatchUpdatesCollector.java:193-231), and
            Keyspace.applyInternal writes every update into its own table's memtable (Keyspace.java:626-653).
          items:
            type: object
            required: [table]
            properties:
              table: {type: string, examples: [orders]}
              columns: {type: object, default: {}}
              timestamp: {type: integer, description: Defaults to the mutation's timestamp.}
              partition_deletion: {type: boolean, default: false}
              cells: {type: array, default: [], items: {type: object}}
  - id: WritePathMutationMessage
    summary: A MUTATION_REQ (or PAXOS2_COMMIT_REMOTE_REQ) message as received by a replica.
    schema:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
        forward_to: {type: array, items: {type: string}, default: [], description: "FORWARD_TO header: other instances in this DC to relay to"}
  - id: WritePathMutationResponse
    summary: The empty MUTATION_RSP / COUNTER_MUTATION_RSP a replica sends back.
    schema:
      type: object
      required: [from, verb]
      properties:
        verb: {type: string, enum: [MUTATION_RSP, COUNTER_MUTATION_RSP]}
  - id: WritePathCounterMutation
    summary: A CounterMutation - a mutation carrying counter deltas plus the client's consistency level.
    schema:
      type: object
      required: [mutation, consistency]
      properties:
        mutation: {$ref: WritePathMutation}
        consistency: {type: string, enum: [ONE, TWO, THREE, QUORUM, LOCAL_QUORUM, EACH_QUORUM, ALL, LOCAL_ONE, ANY], default: ONE}
  - id: WritePathCommitLogPosition
    summary: A CommitLogPosition (segment id, byte offset). NONE is (-1, 0).
    schema:
      type: object
      properties:
        segment_id: {type: integer, examples: [1]}
        position: {type: integer, examples: [0]}
  - id: WritePathFlushRequest
    summary: A request to flush one table's memtable on one replica.
    schema:
      type: object
      required: [keyspace, table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        reason:
          type: string
          default: USER_FORCED
          enum: [COMMITLOG_DIRTY, MEMTABLE_LIMIT, MEMTABLE_PERIOD_EXPIRED, INDEX_BUILD_STARTED, INDEX_BUILD_COMPLETED, INDEX_REMOVED, INDEX_TABLE_FLUSH, VIEW_BUILD_STARTED, INTERNALLY_FORCED, USER_FORCED, STARTUP, DRAIN, SNAPSHOT, TRUNCATE, DROP, STREAMING, STREAMS_RECEIVED, VALIDATION, ANTICOMPACTION, SCHEMA_CHANGE, OWNED_RANGES_CHANGE, UNIT_TESTS]
  - id: WritePathFlushResult
    summary: Outcome of a flush request.
    schema:
      type: object
      properties:
        flushed: {type: boolean}
        sstables: {type: integer}
        commit_log_upper_bound: {$ref: WritePathCommitLogPosition}
  - id: WritePathCommitLogSegmentFile
    summary: A commit log segment file found on disk at startup, with the entries it contains.
    schema:
      type: object
      required: [name, entries]
      properties:
        name: {type: string, examples: [CommitLog-8-1730000000001.log]}
        header_corrupt: {type: boolean, default: false}
        entries:
          type: array
          items:
            type: object
            required: [mutation]
            properties:
              mutation: {$ref: WritePathMutation}
              already_persisted: {type: boolean, default: false}
              corrupt: {type: boolean, default: false}
  - id: WritePathKeyspaceApply
    summary: Arguments of Keyspace.apply / applyFuture / applyInternal.
    schema:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
        write_commit_log: {type: boolean}
        update_indexes: {type: boolean}
        is_droppable: {type: boolean}
        is_deferrable: {type: boolean}
  - id: WritePathApplyResult
    summary: Outcome of a local apply.
    schema:
      type: object
      properties:
        applied: {type: boolean}
        commit_log_position: {$ref: WritePathCommitLogPosition}
  - id: WritePathTableRef
    summary: One table on one replica.
    schema:
      type: object
      required: [keyspace, table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}

interfaces:
  # ====================================================================== verb handlers
  - component: mutation-verb-handler
    name: do-verb
    kind: verb
    attributes: {verb: MUTATION_REQ, also_handles: PAXOS2_COMMIT_REMOTE_REQ, stage: MUTATION, response_verb: MUTATION_RSP}
    summary: A replica receives MUTATION_REQ - drop if expired, validate size, forward to same-DC replicas, apply locally, reply MUTATION_RSP.
    description: >-
      The coordinator sees one of three things: MUTATION_RSP (success), a failure response
      (an exception escaped doVerb, so InboundSink answers with RequestFailureReason.UNKNOWN; the
      error code names the exception), or nothing (expired message, or WriteTimeoutException from
      the MV lock), modeled as code timeout so it matches the coordinator's callback expiry.
    sources:
      - src/java/org/apache/cassandra/db/MutationVerbHandler.java:44-70
      - src/java/org/apache/cassandra/net/Verb.java:116
      - src/java/org/apache/cassandra/net/Verb.java:186
      - src/java/org/apache/cassandra/net/InboundSink.java:80-110
    request: WritePathMutationMessage
    response: WritePathMutationResponse
    errors:
      - {code: timeout, retryable: true, summary: "No reply: message expired, or the MV lock timed out (WriteTimeoutException swallowed)"}
      - {code: unknown-table, summary: "Failure response (INCOMPATIBLE_SCHEMA): the payload names a table this node does not know, so deserialization fails"}
      - {code: mutation-exceeded-max-size, status: 8704, summary: "Failure response: mutation larger than max_mutation_size"}
      - {code: request-failure, summary: "Failure response (UNKNOWN): out-of-range token with reject_out_of_token_range_requests"}
      - {code: cdc-write, status: 5632, summary: "Failure response: CDCWriteException, cdc_raw is full"}
      - {code: fs-write-error, status: 0, summary: "Failure response: commit log write failed (FSWriteError)"}
    behavior:
      - if: "deadline != null && now > deadline"
        then:
          - set: {ctx.replicaOutcome: dropped}
          - title: Expired message dropped without a reply
            detail: InboundMessageHandler checks the header's expiry before deserializing, and MutationVerbHandler.doVerb checks it again (MutationVerbHandler.java:47-52); approxTime.now() > expiresAtNanos (the request's deadline, write_request_timeout from its creation); the drop is counted and nothing is sent, so the coordinator's callback expires.
            source: src/java/org/apache/cassandra/net/InboundMessageHandler.java:414-423
            fail: {code: timeout, retryable: true, message: "= 'replica ' + self + ' dropped an expired MUTATION_REQ; the coordinator callback expires after write_request_timeout'"}
      - title: Deserializing the payload resolves each table id against the local schema (Schema.getExistingTableMetadata)
        source: src/java/org/apache/cassandra/db/partitions/PartitionUpdate.java:723
        call: keyspace.get-column-family-store
        input: {keyspace: "= input.mutation.keyspace", table: "= input.mutation.table"}
        as: cfs
      - if: "!vars.cfs.value.exists"
        then:
          - set: {ctx.replicaOutcome: failure-response, ctx.failureReason: INCOMPATIBLE_SCHEMA}
          - title: UnknownTableException while deserializing - onFailedDeserialize answers with a failure response at once
            source: src/java/org/apache/cassandra/net/InboundMessageHandlers.java:247-256
            fail: {code: unknown-table, message: "= 'Couldn\\'t find table ' + input.mutation.keyspace + '.' + input.mutation.table + '. If a table was just created, this is likely due to the schema not being fully propagated.'", data: {failure_reason: INCOMPATIBLE_SCHEMA}}
      - title: Reject an oversized mutation
        source: src/java/org/apache/cassandra/db/MutationVerbHandler.java:54
        call: mutation.validate-size
        input: {mutation: "= input.mutation"}
        on_error:
          - set: {ctx.replicaOutcome: failure-response, ctx.failureReason: UNKNOWN}
          - title: The exception escapes doVerb; InboundSink sends a failure response (CALL_BACK_ON_FAILURE)
            source: src/java/org/apache/cassandra/net/InboundSink.java:80-90
            fail: "= error"
      - when: "has(input.forward_to) && size(input.forward_to) > 0"
        title: Relay the mutation to the other replicas named in FORWARD_TO; they reply to the original coordinator
        source: src/java/org/apache/cassandra/db/MutationVerbHandler.java:56-59
        foreach: "= input.forward_to"
        as: target
        steps:
          - emit: mutation-verb-handler.do-verb
            on: "= vars.target"
            input:
              mutation: "= input.mutation"
      - call: abstract-mutation-verb-handler.process-message
        input: {mutation: "= input.mutation", handler: mutation-verb-handler}
        on_error:
          - if: "error.code == 'write-timeout'"
            then:
              - set: {ctx.replicaOutcome: no-reply}
              - title: WriteTimeoutException from the apply future is swallowed; no reply is sent
                source: src/java/org/apache/cassandra/db/MutationVerbHandler.java:39-42
                fail: {code: timeout, retryable: true, message: "= 'replica ' + self + ' did not reply: ' + error.message"}
          - set: {ctx.replicaOutcome: failure-response, ctx.failureReason: UNKNOWN}
          - title: The exception escapes doVerb; InboundSink sends a failure response
            source: src/java/org/apache/cassandra/net/InboundSink.java:80-90
            fail: "= error"
      - set: {ctx.replicaOutcome: applied}
      - title: Reply MUTATION_RSP once the local apply completes
        source: src/java/org/apache/cassandra/db/MutationVerbHandler.java:33-37
        return: {from: "= self", verb: MUTATION_RSP}

  - component: mutation-verb-handler
    name: apply-mutation
    kind: function
    summary: Apply the mutation through Mutation.applyFuture and respond when the future completes.
    sources: [src/java/org/apache/cassandra/db/MutationVerbHandler.java:72-76]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
    response: WritePathApplyResult
    behavior:
      - call: mutation.apply-future
        input: {mutation: "= input.mutation"}
        as: applied
      - return: "= vars.applied.value"

  - component: abstract-mutation-verb-handler
    name: process-message
    kind: function
    summary: Check that this node owns (or is pending for) the token; log, count and optionally reject out-of-range writes; then apply.
    sources: [src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:47-80]
    request:
      type: object
      required: [mutation, handler]
      properties:
        mutation: {$ref: WritePathMutation}
        counter_mutation: {$ref: WritePathCounterMutation}
        handler: {type: string, enum: [mutation-verb-handler, counter-mutation-verb-handler]}
    response: WritePathApplyResult
    errors:
      - {code: request-failure, summary: "failureResponse(RequestFailureReason.UNKNOWN) for an out-of-range token when reject_out_of_token_range_requests is true"}
    behavior:
      - title: Is this endpoint a natural or pending replica for the token?
        source: src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:77-80
        call: storage-service.is-endpoint-valid-for-write
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token"}
        as: owned
      - choice: token_ownership
        default: "= vars.owned.value.valid ? 'owned' : 'not_owned'"
        options:
          owned:
            - title: Token owned or pending here
          not_owned:
            - set: {ctx.outOfRangeWrite: true}
            - when: "config['log-out-of-token-range-requests']"
              title: Count the out-of-range write and log it (log_out_of_token_range_requests, default true)
              source: src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:53-62
            - when: "config['reject-out-of-token-range-requests']"
              title: Reject with a failure response (reject_out_of_token_range_requests, default false)
              source: src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:63-75
              fail: {code: request-failure, message: "= 'token ' + string(input.mutation.token) + ' is neither owned nor pending on ' + self", data: {failure_reason: UNKNOWN}}
      - call: "= input.handler + '.apply-mutation'"
        targets: [mutation-verb-handler.apply-mutation, counter-mutation-verb-handler.apply-mutation]
        input: "= input"
        as: applied
      - return: "= vars.applied.value"

  - component: counter-mutation-verb-handler
    name: do-verb
    kind: verb
    attributes: {verb: COUNTER_MUTATION_REQ, stage: COUNTER_MUTATION, response_verb: COUNTER_MUTATION_RSP}
    summary: The leader replica receives COUNTER_MUTATION_REQ (inherits doVerb) and applies it as the counter leader.
    description: No expiry or size check here (AbstractMutationVerbHandler.doVerb); the reply is sent by a callback once the leader's write meets the consistency level.
    sources:
      - src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:41-45
      - src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java:30-55
      - src/java/org/apache/cassandra/net/Verb.java:137
    request:
      type: object
      required: [counter_mutation]
      properties:
        counter_mutation: {$ref: WritePathCounterMutation}
    response: WritePathMutationResponse
    errors:
      - {code: request-failure, summary: Out-of-range token rejected}
    behavior:
      - call: abstract-mutation-verb-handler.process-message
        input:
          mutation: "= input.counter_mutation.mutation"
          counter_mutation: "= input.counter_mutation"
          handler: counter-mutation-verb-handler
        on_error:
          - set: {ctx.replicaOutcome: failure-response}
          - title: The exception escapes doVerb; InboundSink sends a failure response
            source: src/java/org/apache/cassandra/net/InboundSink.java:80-90
            fail: "= error"
      - set: {ctx.replicaOutcome: applied}
      - return: {from: "= self", verb: COUNTER_MUTATION_RSP}

  - component: counter-mutation-verb-handler
    name: apply-mutation
    kind: function
    summary: Hand the counter mutation to StorageProxy.applyCounterMutationOnLeader with a callback that sends the empty response.
    sources: [src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java:36-54]
    request:
      type: object
      required: [counter_mutation]
      properties:
        counter_mutation: {$ref: WritePathCounterMutation}
    response: WritePathApplyResult
    behavior:
      - title: Apply as counter leader without blocking this thread (avoids distributed deadlock, CASSANDRA-4578)
        source: src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java:42-53
        call: storage-proxy.apply-counter-mutation-on-leader
        input: {counter_mutation: "= input.counter_mutation", local_dc: dc1}
      - return: {applied: true, commit_log_position: {segment_id: -1, position: 0}}

  - component: truncate-verb-handler
    name: do-verb
    kind: verb
    attributes: {verb: TRUNCATE_REQ, stage: MUTATION, response_verb: TRUNCATE_RSP}
    summary: Truncate the table locally (ColumnFamilyStore.truncateBlocking) and reply with TruncateResponse(success).
    sources:
      - src/java/org/apache/cassandra/db/TruncateVerbHandler.java:34-46
      - src/java/org/apache/cassandra/net/Verb.java:134
    request:
      type: object
      required: [keyspace, table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
    response:
      type: object
      properties:
        keyspace: {type: string}
        table: {type: string}
        success: {type: boolean}
    behavior:
      - call: column-family-store.truncate-blocking
        input: {keyspace: "= input.keyspace", table: "= input.table"}
      - title: Reply TRUNCATE_RSP with success
        source: src/java/org/apache/cassandra/db/TruncateVerbHandler.java:43-45
        return: {keyspace: "= input.keyspace", table: "= input.table", success: true}

  # ====================================================================== Mutation, CounterMutation
  - component: mutation
    name: validate-size
    kind: function
    summary: Reject a mutation whose serialized size plus the 12-byte commit log entry overhead exceeds max_mutation_size.
    sources:
      - src/java/org/apache/cassandra/db/Mutation.java:169-177
      - src/java/org/apache/cassandra/db/IMutation.java:31
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:93
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
    response:
      type: object
      properties:
        total_size: {type: integer}
    errors:
      - {code: mutation-exceeded-max-size, status: 8704, summary: MutationExceededMaxSizeException extends InvalidRequestException}
    behavior:
      - set:
          vars.total: "= (has(input.mutation.serialized_size) ? input.mutation.serialized_size : 220) + 12"
      - if: "vars.total > int(config['max-mutation-size-bytes'])"
        then:
          - set: {ctx.oversizedMutation: true}
          - title: MutationExceededMaxSizeException
            source: src/java/org/apache/cassandra/db/MutationExceededMaxSizeException.java:46-50
            fail: {code: mutation-exceeded-max-size, status: 8704, message: "= 'Rejected an oversized mutation (' + string(vars.total) + '/' + string(int(config['max-mutation-size-bytes'])) + ') for keyspace: ' + input.mutation.keyspace"}
      - return: {total_size: "= vars.total"}

  - component: mutation
    name: apply
    kind: function
    summary: Mutation.apply() - blocking local apply with the keyspace's durable_writes setting.
    sources: [src/java/org/apache/cassandra/db/Mutation.java:247-270]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
    response: WritePathApplyResult
    behavior:
      - call: keyspace.apply
        input:
          mutation: "= input.mutation"
          update_indexes: true
          is_droppable: true
        as: applied
      - return: "= vars.applied.value"

  - component: mutation
    name: apply-future
    kind: function
    summary: Mutation.applyFuture() - deferrable local apply used by MutationVerbHandler.
    sources: [src/java/org/apache/cassandra/db/Mutation.java:241-245]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
    response: WritePathApplyResult
    behavior:
      - call: keyspace.apply-future
        input:
          mutation: "= input.mutation"
        as: applied
      - return: "= vars.applied.value"

  - component: counter-mutation
    name: apply-counter-mutation
    kind: function
    summary: On the leader - lock the counter cells, read current values (counter cache, then the table), build and apply the result mutation.
    description: Called by StorageProxy's counter write task on the leader; the returned mutation is then replicated by coordination.
    sources:
      - src/java/org/apache/cassandra/db/CounterMutation.java:115-151
      - src/java/org/apache/cassandra/db/CounterMutation.java:328-331
    request: WritePathCounterMutation
    response:
      type: object
      properties:
        mutation: {$ref: WritePathMutation}
    errors:
      - {code: write-timeout, status: 4352, summary: "Counter locks not acquired within counter_write_request_timeout (5000ms)"}
    behavior:
      - choice: locks
        default: acquired
        options:
          acquired:
            - title: Striped counter locks acquired in order
              source: src/java/org/apache/cassandra/db/CounterMutation.java:158-177
          timeout:
            - set: {ctx.counterLockTimeout: true}
            - wait: "= int(config['counter-write-request-timeout-ms'])"
            - title: tryLock timed out after counter_write_request_timeout; WriteTimeoutException(COUNTER)
              source: src/java/org/apache/cassandra/db/CounterMutation.java:165-169
              fail:
                code: write-timeout
                status: 4352
                message: Timed out acquiring counter locks
                data:
                  write_type: COUNTER
                  consistency: "= input.consistency"
                  received: 0
                  block_for: "= input.consistency == 'ALL' ? 3 : (input.consistency in ['QUORUM', 'LOCAL_QUORUM', 'EACH_QUORUM'] ? 2 : (input.consistency == 'TWO' ? 2 : (input.consistency == 'THREE' ? 3 : 1)))"
      - choice: counter_cache
        default: miss
        options:
          hit:
            - set: {ctx.counterRead: cache}
            - title: All current values found in the counter cache
              source: src/java/org/apache/cassandra/db/CounterMutation.java:213-219
          miss:
            - set: {ctx.counterRead: table}
            - title: Read the remaining current values from memtables and sstables
              source: src/java/org/apache/cassandra/db/CounterMutation.java:221-222
              call: single-partition-read-command.query-memtable-and-disk
              input:
                read_command:
                  keyspace: "= input.mutation.keyspace"
                  table: "= input.mutation.table"
                  partition_key: "= input.mutation.partition_key"
                  token: "= input.mutation.token"
                  columns: "= input.mutation.columns.map(k, k)"
                  limit: 1
                  digest: false
      - title: New global shard per cell - clock = max(now, current clock + 1), count = current + delta; update the counter cache
        source: src/java/org/apache/cassandra/db/CounterMutation.java:231-240
        set:
          vars.result: "= {'keyspace': input.mutation.keyspace, 'table': input.mutation.table, 'partition_key': input.mutation.partition_key, 'token': input.mutation.token, 'timestamp': input.mutation.timestamp, 'columns': input.mutation.columns}"
      - title: Apply the result mutation locally (result.apply())
        source: src/java/org/apache/cassandra/db/CounterMutation.java:142-144
        call: mutation.apply
        input: {mutation: "= vars.result"}
      - return: {mutation: "= vars.result"}

  # ====================================================================== Keyspace
  - component: keyspace
    name: apply
    kind: function
    summary: Keyspace.apply - blocking, non-deferrable local apply (used by Mutation.apply, commit log replay, hints, batchlog).
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:483-511]
    request: WritePathKeyspaceApply
    response: WritePathApplyResult
    behavior:
      - call: keyspace.apply-internal
        input:
          mutation: "= input.mutation"
          write_commit_log: "= has(input.write_commit_log) ? input.write_commit_log : (input.mutation.keyspace in state.durable_writes ? state.durable_writes[input.mutation.keyspace] : true)"
          update_indexes: "= has(input.update_indexes) ? input.update_indexes : true"
          is_droppable: "= has(input.is_droppable) ? input.is_droppable : true"
          is_deferrable: false
        as: applied
      - return: "= vars.applied.value"

  - component: keyspace
    name: apply-future
    kind: function
    summary: Keyspace.applyFuture - droppable and deferrable apply; a contended view lock re-queues the work on Stage.MUTATION.
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:472-481]
    request: WritePathKeyspaceApply
    response: WritePathApplyResult
    behavior:
      - call: keyspace.apply-internal
        input:
          mutation: "= input.mutation"
          write_commit_log: "= has(input.write_commit_log) ? input.write_commit_log : (input.mutation.keyspace in state.durable_writes ? state.durable_writes[input.mutation.keyspace] : true)"
          update_indexes: true
          is_droppable: true
          is_deferrable: true
        as: applied
      - return: "= vars.applied.value"

  - component: keyspace
    name: apply-internal
    kind: function
    summary: Append to the commit log, then update memtables and indexes; with views, take the view partition locks and push view updates first.
    sources:
      - src/java/org/apache/cassandra/db/Keyspace.java:513-673
      - src/java/org/apache/cassandra/db/Keyspace.java:585-587
    request: WritePathKeyspaceApply
    response: WritePathApplyResult
    errors:
      - {code: write-timeout, status: 4352, summary: "WriteTimeoutException(VIEW, LOCAL_ONE, 0, 1): view lock not acquired within write_request_timeout"}
      - {code: cdc-write, status: 5632}
      - {code: fs-write-error, status: 0}
    behavior:
      - set:
          vars.tk: "= input.mutation.keyspace + '.' + input.mutation.table"
          vars.durable: "= has(input.write_commit_log) ? input.write_commit_log : (input.mutation.keyspace in state.durable_writes ? state.durable_writes[input.mutation.keyspace] : true)"
          vars.update_indexes: "= has(input.update_indexes) ? input.update_indexes : true"
          vars.droppable: "= has(input.is_droppable) ? input.is_droppable : true"
          vars.affected: false
          vars.views: []
      - set:
          vars.known: "= vars.tk in state.tables"
          vars.tp: "= vars.tk in state.tables ? state.tables[vars.tk] : {'cdc': false, 'skip_commitlog': false}"
          vars.upds: "= has(input.mutation.updates) && size(input.mutation.updates) > 0 ? input.mutation.updates.map(u, omit(merge(merge(omit(input.mutation, 'updates', 'columns', 'cells', 'partition_deletion'), {'columns': {}, 'cells': [], 'partition_deletion': false}), u), 'updates')) : [omit(input.mutation, 'updates')]"
      - when: "vars.update_indexes && vars.known"
        title: Does any materialized view of this table see the update?
        source: src/java/org/apache/cassandra/db/Keyspace.java:535
        call: view-manager.updates-affect-view
        input: {keyspace: "= input.mutation.keyspace", table: "= input.mutation.table"}
        as: va
      - when: "vars.update_indexes && vars.known"
        set: {vars.affected: "= vars.va.value.affected", vars.views: "= vars.va.value.views"}
      - when: "vars.affected"
        title: Take the view partition lock (tryLock on a striped lock keyed by partition key and table)
        source: src/java/org/apache/cassandra/db/Keyspace.java:537-614
        call: view-manager.acquire-lock-for
        input: {lock_key: "= vars.tk + ':' + input.mutation.partition_key"}
        as: lock
        retry:
          max_attempts: "= int(config['write-request-timeout-ms']) / 100"
          backoff_ms: 100
          codes: [lock-contended]
          title: Lock contended - re-queue on Stage.MUTATION (deferrable) or sleep and retry, until write_request_timeout
          source: src/java/org/apache/cassandra/db/Keyspace.java:578-606
        on_error:
          - if: "vars.droppable"
            then:
              - set: {ctx.viewLockOutcome: write-timeout}
              - title: Lock not acquired within write_request_timeout - WriteTimeoutException(VIEW)
                source: src/java/org/apache/cassandra/db/Keyspace.java:561-577
                fail:
                  code: write-timeout
                  status: 4352
                  message: Could not acquire MV lock
                  data: {write_type: VIEW, consistency: LOCAL_ONE, received: 0, block_for: 1}
          - set: {ctx.viewLockOutcome: retried-past-model-bound}
          - title: Non-droppable writes (e.g. commit log replay) never time out - they keep deferring or sleeping 10ms until the lock is free; the model stops after write_request_timeout / 100 attempts and proceeds
            source: src/java/org/apache/cassandra/db/Keyspace.java:559-606
      - when: "vars.affected"
        set: {ctx.viewLockAttempts: "= vars.lock.attempts"}
      - title: Begin the write - append to the commit log if durable (before any per-table check)
        source: src/java/org/apache/cassandra/db/Keyspace.java:625
        call: cassandra-keyspace-write-handler.begin-write
        input:
          mutation: "= input.mutation"
          make_durable: "= vars.durable"
          cdc: "= vars.tp.cdc"
          skip_commitlog: "= vars.tp.skip_commitlog"
        as: wctx
      - set: {vars.applied: 0}
      - title: For each PartitionUpdate of the mutation (one per table)
        source: src/java/org/apache/cassandra/db/Keyspace.java:626
        foreach: "= vars.upds"
        as: upd
        steps:
          - if: "!((vars.upd.keyspace + '.' + vars.upd.table) in state.tables)"
            then:
              - set: {ctx.unknownTable: "= vars.upd.keyspace + '.' + vars.upd.table"}
              - title: No ColumnFamilyStore for the update's table - logged and skipped, after the commit log append
                source: src/java/org/apache/cassandra/db/Keyspace.java:627-634
              - continue: true
          - when: "vars.affected && vars.upd.table == input.mutation.table"
            title: Create and push the materialized view mutations from this base replica
            source: src/java/org/apache/cassandra/db/Keyspace.java:637-651
            call: table-views.push-view-replica-updates
            input:
              mutation: "= vars.upd"
              write_commit_log: "= vars.durable"
              views: "= vars.views"
          - title: Write the update into its table's memtable
            source: src/java/org/apache/cassandra/db/Keyspace.java:653
            call: cassandra-table-write-handler.write
            input: {mutation: "= vars.upd", update_indexes: "= vars.update_indexes"}
          - set: {vars.applied: "= vars.applied + 1"}
      - return: {applied: "= vars.applied > 0", commit_log_position: "= vars.wctx.value.position"}

  - component: keyspace
    name: flush
    kind: function
    summary: Flush every table of a keyspace (used after commit log replay with reason STARTUP).
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:680-686]
    request:
      type: object
      required: [keyspace]
      properties:
        keyspace: {type: string, examples: [ks1]}
        reason: {type: string, default: STARTUP}
    response:
      type: object
      properties:
        tables: {type: integer}
    behavior:
      - set:
          vars.tables: "= state.tables.filter(k, k.startsWith(input.keyspace + '.'))"
      - foreach: "= vars.tables"
        as: tk
        steps:
          - call: column-family-store.force-flush
            input:
              keyspace: "= input.keyspace"
              table: "= vars.tk.split('.')[1]"
              reason: "= has(input.reason) ? input.reason : 'STARTUP'"
      - return: {tables: "= size(vars.tables)"}

  - component: keyspace
    name: get-column-family-store
    kind: function
    summary: The table's ColumnFamilyStore on this node, if the table is known locally (Keyspace.getColumnFamilyStore).
    sources:
      - src/java/org/apache/cassandra/db/Keyspace.java:215-230
      - src/java/org/apache/cassandra/schema/SchemaProvider.java:43-55
    request: {type: object, required: [keyspace, table], properties: {keyspace: {type: string, examples: [ks1]}, table: {type: string, examples: [users]}}}
    response: {type: object, properties: {exists: {type: boolean}}}
    behavior:
      - return: {exists: "= (input.keyspace + '.' + input.table) in state.tables"}

  - component: cassandra-keyspace-write-handler
    name: begin-write
    kind: function
    summary: Open the write OpOrder group and, when durable, append the mutation (minus tables whose memtable skips the commit log) to the commit log.
    sources:
      - src/java/org/apache/cassandra/db/CassandraKeyspaceWriteHandler.java:41-65
      - src/java/org/apache/cassandra/db/CassandraKeyspaceWriteHandler.java:67-100
    request:
      type: object
      required: [mutation, make_durable]
      properties:
        mutation: {$ref: WritePathMutation}
        make_durable: {type: boolean, default: true}
        cdc: {type: boolean, default: false}
        skip_commitlog: {type: boolean, default: false}
    response:
      type: object
      properties:
        position: {$ref: WritePathCommitLogPosition}
        durable: {type: boolean}
    behavior:
      - if: "!input.make_durable"
        then:
          - set: {ctx.commitLog: skipped-not-durable}
          - title: durable_writes = false - no commit log append
            source: src/java/org/apache/cassandra/db/CassandraKeyspaceWriteHandler.java:50-54
            return: {position: {segment_id: -1, position: 0}, durable: false}
      - if: "has(input.skip_commitlog) && input.skip_commitlog"
        then:
          - set: {ctx.commitLog: skipped-by-memtable}
          - title: Every table's memtable factory says writesShouldSkipCommitLog
            source: src/java/org/apache/cassandra/db/CassandraKeyspaceWriteHandler.java:80-83
            return: {position: {segment_id: -1, position: 0}, durable: false}
      - title: Appending to commitlog
        source: src/java/org/apache/cassandra/db/CassandraKeyspaceWriteHandler.java:98-99
        call: commit-log.add
        input: {mutation: "= input.mutation", cdc: "= has(input.cdc) ? input.cdc : false"}
        as: pos
      - set: {ctx.commitLog: appended}
      - return: {position: "= vars.pos.value", durable: true}

  - component: cassandra-table-write-handler
    name: write
    kind: function
    summary: Adding to the table's memtable (ColumnFamilyStore.apply).
    sources: [src/java/org/apache/cassandra/db/CassandraTableWriteHandler.java:33-39]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
        update_indexes: {type: boolean, default: true}
    behavior:
      - call: column-family-store.apply
        input: {mutation: "= input.mutation", update_indexes: "= has(input.update_indexes) ? input.update_indexes : true"}

  # ====================================================================== ColumnFamilyStore
  - component: column-family-store
    name: apply
    kind: function
    summary: Put the update into the current memtable (with an index UpdateTransaction), invalidate the row cache entry, record metrics.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1467-1503]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
        update_indexes: {type: boolean, default: true}
    behavior:
      - title: Put into the memtable chosen for this write's OpOrder group and commit log position
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1475-1477
        call: skip-list-memtable.put
        input: {mutation: "= input.mutation"}
      - title: Invalidate the cached partition (row cache) and record write metrics
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1478-1491

  - component: column-family-store
    name: force-flush
    kind: function
    summary: ColumnFamilyStore.forceFlush(reason) - switch and flush the memtable if it (or an index memtable) is dirty, else wait for prior flushes. Called by nodetool flush, drain, commit log pressure, truncate and view builds.
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1059-1112
      - src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:130-143
    request: WritePathFlushRequest
    response: WritePathFlushResult
    behavior:
      - set:
          vars.reason: "= has(input.reason) ? input.reason : 'USER_FORCED'"
      - call: skip-list-memtable.is-clean
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: clean
      - if: "vars.clean.value.clean"
        then:
          - set: {ctx.flushOutcome: clean}
          - title: Memtables clean - no switch; return a future on the prior flushes
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1070-1073
            return: {flushed: false, sstables: 0, commit_log_upper_bound: {segment_id: -1, position: 0}}
      - if: "vars.reason == 'OWNED_RANGES_CHANGE'"
        then:
          - set: {ctx.flushOutcome: not-switched}
          - title: shouldSwitch(OWNED_RANGES_CHANGE) is false for allocator memtables
            source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:138-139
            return: {flushed: false, sstables: 0, commit_log_upper_bound: {segment_id: -1, position: 0}}
      - title: shouldSwitch is true - switch the memtable if it is still current
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1094-1100
        call: column-family-store.switch-memtable
        input: {keyspace: "= input.keyspace", table: "= input.table", reason: "= vars.reason"}
        as: sw
      - return: "= vars.sw.value"

  - component: column-family-store
    name: force-blocking-flush
    kind: function
    summary: forceFlush and wait on the returned future.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1114-1117]
    request: WritePathFlushRequest
    response: WritePathFlushResult
    behavior:
      - call: column-family-store.force-flush
        input: "= input"
        as: f
      - return: "= vars.f.value"

  - component: column-family-store
    name: signal-flush-required
    kind: function
    summary: A memtable asks its owner to flush it (period expired, or chosen by the cleaner); switches it if it is still current, without an isClean check.
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1435-1439
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1014-1023
    request: WritePathFlushRequest
    response: WritePathFlushResult
    behavior:
      - call: column-family-store.switch-memtable
        input:
          keyspace: "= input.keyspace"
          table: "= input.table"
          reason: "= has(input.reason) ? input.reason : 'MEMTABLE_LIMIT'"
        as: sw
      - return: "= vars.sw.value"

  - component: column-family-store
    name: switch-memtable
    kind: function
    summary: Swap in a new memtable behind a write barrier, run Flush on MemtableFlushWriter and PostFlush on MemtablePostFlush; the future completes after PostFlush.
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1025-1056
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:206-213
    request: WritePathFlushRequest
    response: WritePathFlushResult
    errors:
      - {code: fs-write-error, status: 0, summary: The flush failed; PostFlush rethrows to every waiter}
    behavior:
      - set:
          state.pending_flushes: "= state.pending_flushes + 1"
      - title: Enqueuing flush (logFlush)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1046-1056
      - title: Flush constructor - create the new memtable, switch it in, issue the write barrier and fix the commit log upper bound
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1183-1227
        call: skip-list-memtable.switch-out
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: old
      - title: Flush runs on the MemtableFlushWriter pool (memtable_flush_writers = 2)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1038-1039
        call: column-family-store-flush.run
        input:
          keyspace: "= input.keyspace"
          table: "= input.table"
          truncate: false
          partitions: "= vars.old.value.partitions"
          bytes: "= vars.old.value.bytes"
          cells: "= vars.old.value.cells"
          partition_rows: "= vars.old.value.partition_rows"
        as: run
      - set: {state.memtable_switch_count: "= state.memtable_switch_count + 1"}
      - title: PostFlush runs on the single-threaded MemtablePostFlush executor, after all prior flushes
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1040-1041
        call: column-family-store-post-flush.call
        input: {keyspace: "= input.keyspace", table: "= input.table", flush_failure: "= vars.run.value.flush_failure"}
        as: post
        on_error:
          - set: {state.pending_flushes: "= state.pending_flushes - 1", ctx.flushOutcome: failed}
          - fail: "= error"
      - set: {state.pending_flushes: "= state.pending_flushes - 1", ctx.flushOutcome: flushed}
      - return: {flushed: true, sstables: "= vars.run.value.sstables", commit_log_upper_bound: "= vars.post.value"}

  - component: column-family-store
    name: dump-memtable
    kind: function
    summary: Switch out the memtable and discard it without writing (Flush with truncate=true); used by truncate of non-durable tables.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2832-2846]
    request: WritePathTableRef
    response: WritePathFlushResult
    behavior:
      - call: skip-list-memtable.switch-out
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: old
      - call: column-family-store-flush.run
        input:
          keyspace: "= input.keyspace"
          table: "= input.table"
          truncate: true
          partitions: "= vars.old.value.partitions"
          bytes: "= vars.old.value.bytes"
          cells: "= vars.old.value.cells"
          partition_rows: "= vars.old.value.partition_rows"
      - call: column-family-store-post-flush.call
        input: {keyspace: "= input.keyspace", table: "= input.table", flush_failure: ""}
        as: post
      - return: {flushed: false, sstables: 0, commit_log_upper_bound: "= vars.post.value"}

  - component: column-family-store
    name: truncate-blocking
    kind: function
    summary: Truncate without tombstones - flush (or dump) the memtable, abort repairs, auto-snapshot, drop the sstables, truncate indexes and views, save the truncation record.
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2740-2830
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:3277-3280
    request: WritePathTableRef
    response:
      type: object
      properties:
        truncated: {type: boolean}
        truncated_at: {type: integer}
        snapshot: {type: boolean}
    behavior:
      - set:
          vars.tk: "= input.keyspace + '.' + input.table"
      - set:
          vars.params: "= vars.tk in state.tables ? state.tables[vars.tk] : {'durable_writes': true, 'allow_auto_snapshot': true}"
      - set:
          vars.auto: "= config['auto-snapshot'] && vars.params.allow_auto_snapshot"
      - title: Stop any running view build (viewManager.stopBuild)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2770
      - if: "vars.params.durable_writes || vars.auto"
        then:
          - set: {ctx.truncateMemtable: flushed}
          - title: Durable or auto_snapshot - flush first so the truncation point covers everything written before it
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2775-2781
            call: column-family-store.force-blocking-flush
            input: {keyspace: "= input.keyspace", table: "= input.table", reason: TRUNCATE}
        else:
          - set: {ctx.truncateMemtable: dumped}
          - title: Neither durable nor auto_snapshot - discard the memtable without writing it
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2782-2789
            call: column-family-store.dump-memtable
            input: {keyspace: "= input.keyspace", table: "= input.table"}
      - set: {vars.truncated_at: "= now"}
      - title: Abort parent repair sessions on this table so stale data is not streamed back
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2803-2807
        call: active-repair-service.abort
        input: {table: "= vars.tk", message: "= 'Stopping parent sessions due to truncation of ' + vars.tk"}
      - when: "vars.auto"
        title: auto_snapshot (cassandra.yaml true) - snapshot truncated-<millis>-<table>
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2810-2811
        call: column-family-store.snapshot
        input:
          keyspace: "= input.keyspace"
          table: "= input.table"
          snapshot_name: "= 'truncated-' + string(now) + '-' + input.table"
      - title: Drop sstables not newer than truncatedAt
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2813
        call: column-family-store.discard-sstables
        input: {keyspace: "= input.keyspace", table: "= input.table", truncated_at: "= vars.truncated_at"}
      - title: Truncate secondary indexes
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2815
        call: secondary-index-manager.truncate-all-indexes-blocking
        input: {truncated_at: "= vars.truncated_at"}
      - title: Truncate the views of this table (viewManager.truncateBlocking)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2816
      - title: Save the truncation record (system.local truncated_at) so replay skips older commit log entries
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2818
        call: column-family-store.truncation-records-put
        input: {key: "= vars.tk", row: {truncated_at: "= vars.truncated_at"}}
      - title: Invalidate the row and counter caches, then restart view builds
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2819-2827
      - return: {truncated: true, truncated_at: "= vars.truncated_at", snapshot: "= vars.auto"}

  - component: column-family-store
    name: snapshot
    kind: function
    summary: Snapshot the table - flush a dirty memtable first (SNAPSHOT), then hard-link the live sstables.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2334-2389]
    request:
      type: object
      required: [keyspace, table, snapshot_name]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        snapshot_name: {type: string, examples: [truncated-1730000000000-users]}
        ephemeral: {type: boolean, default: false}
        ttl_seconds: {type: integer, default: 0}
    errors:
      - {code: illegal-argument-exception, summary: "validateSnapshotName: name contains the path separator or is '.' / '..'"}
      - {code: illegal-state-exception, summary: Ephemeral snapshot with a TTL}
    behavior:
      - if: "has(input.ephemeral) && input.ephemeral && has(input.ttl_seconds) && input.ttl_seconds > 0"
        then:
          - title: An ephemeral snapshot cannot have a TTL
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2139-2142
            fail: {code: illegal-state-exception, message: "= 'can not take ephemeral snapshot (' + input.snapshot_name + ') while ttl is specified too'"}
      - if: "input.snapshot_name.contains('/') || input.snapshot_name == '.' || input.snapshot_name == '..'"
        then:
          - set: {ctx.snapshotNameRejected: true}
          - title: validateSnapshotName - path separator or reserved name (the character whitelist applies only with -Dcassandra.snapshot.validation=true, default false)
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2168-2186
            fail: {code: illegal-argument-exception, message: "= input.snapshot_name.contains('/') ? 'Snapshot name cannot contain /' : 'Snapshot name \\'' + input.snapshot_name + '\\' is reserved'"}
      - call: skip-list-memtable.is-clean
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: clean
      - when: "!vars.clean.value.clean"
        title: Dirty memtable - switch and wait (FlushReason.SNAPSHOT)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2377-2386
        call: column-family-store.switch-memtable
        input: {keyspace: "= input.keyspace", table: "= input.table", reason: SNAPSHOT}
      - title: Hard-link the live sstables into the snapshot directory
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2388
        call: data-disk.snapshot-create
        input: {keyspace: "= input.keyspace", table: "= input.table", snapshot_name: "= input.snapshot_name"}
      - call: column-family-store.snapshots-put
        input: {key: "= input.snapshot_name", row: {keyspace: "= input.keyspace", table: "= input.table"}}
      - title: createSnapshot writes the manifest and registers the TableSnapshot (StorageService.addSnapshot)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2205-2232
        call: snapshot-manager.add-snapshot
        input:
          key: "= input.keyspace + '.' + input.table + ':' + input.snapshot_name"
          row:
            keyspace: "= input.keyspace"
            table: "= input.table"
            tag: "= input.snapshot_name"
            created_at: "= now"
            expires_at: "= has(input.ttl_seconds) && input.ttl_seconds > 0 ? now + input.ttl_seconds * 1000 : 0"
            ephemeral: "= has(input.ephemeral) ? input.ephemeral : false"

  - component: column-family-store
    name: discard-sstables
    kind: function
    summary: Mark obsolete every live sstable not newer than truncatedAt.
    description: >-
      Truncate flushed the memtable just before (or dumped it for a non-durable table), so every live
      sstable in the table's Tracker View predates truncatedAt and is dropped; writes after that point stay
      in the memtable.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:3295-3319]
    request:
      type: object
      required: [keyspace, table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        truncated_at: {type: integer}
    behavior:
      - call: column-family-store.live-sstables-put
        input: {key: "= input.keyspace + '.' + input.table", row: 0}
      - title: Collect the live sstables not newer than truncatedAt
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:3301-3312
        call: tracker.get-view
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: view
      - when: "size(vars.view.value.sstables) > 0"
        title: markObsolete drops them from the View
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:3314-3318
        call: tracker.apply
        input:
          keyspace: "= input.keyspace"
          table: "= input.table"
          changes: {sstables: []}

  - component: column-family-store
    name: add-to-tracker
    kind: function
    summary: "data.addSSTables / data.replaceFlushed: append a new sstable to the table's View in read-path's Tracker (so reads and compaction see it)."
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1679-1681
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1835-1837
    request:
      type: object
      required: [keyspace, table, sstable_id]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        sstable_id: {type: string, examples: [flush-1]}
        size_mb: {type: integer, default: 1}
        pending_repair: {type: string, default: "", description: "SSTable metadata pendingRepair (the incremental repair session), empty for none"}
        partitions: {type: object, default: {}, description: "The sstable's partitions, keyed by partition key: {cells, deletion_ts, tombstones, purgeable_tombstones, size_bytes, token} (read-path's View shape)"}
        max_timestamp: {type: integer, default: 0}
    behavior:
      - title: Tracker.addSSTables / replaceFlushed makes the new sstable live in the table's View
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1836-1837
        call: tracker.add-sstables
        input:
          keyspace: "= input.keyspace"
          table: "= input.table"
          sstables:
            - id: "= input.sstable_id"
              size_mb: "= has(input.size_mb) ? input.size_mb : 1"
              level: 0
              repaired: false
              pending_repair: "= has(input.pending_repair) ? input.pending_repair : ''"
              partitions: "= has(input.partitions) ? input.partitions : {}"
              max_timestamp: "= has(input.max_timestamp) ? input.max_timestamp : 0"
              droppable_tombstone_ratio: 0.0
              age_s: 0
              fully_expired: false
              tombstones: "= has(input.partitions) ? sum([0] + input.partitions.map(k, input.partitions[k].tombstones)) : 0"
              purgeable_tombstones: 0
              unowned_mb: 0
              window: 0

  - {component: column-family-store, name: live-sstables-get, kind: store, summary: "Live sstable count per replica and table (the CFS Tracker view).", sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1379], request: {type: object, properties: {key: {type: string}}}, store: {table: live_sstables, op: get, key: "= input.key", default: 0}}
  - {component: column-family-store, name: live-sstables-incr, kind: store, summary: "Add flushed sstables to the live set (replaceFlushed).", sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1379], request: {type: object, properties: {key: {type: string}, delta: {type: integer}}}, store: {table: live_sstables, op: incr, key: "= input.key", value: "= input.delta"}}
  - {component: column-family-store, name: live-sstables-put, kind: store, summary: "Replace the live sstable count (truncate drops them).", sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:3314-3318], request: {type: object, properties: {key: {type: string}, row: {type: integer}}}, store: {table: live_sstables, op: put, key: "= input.key", value: "= input.row"}}
  - {component: column-family-store, name: truncation-records-put, kind: store, summary: "Truncation record (SystemKeyspace.saveTruncationRecord).", sources: [src/java/org/apache/cassandra/db/SystemKeyspace.java:749-755], request: {type: object, properties: {key: {type: string}, row: {type: object}}}, store: {table: truncation_records, op: put, key: "= input.key", value: "= input.row"}}
  - {component: column-family-store, name: snapshots-get, kind: store, summary: "A snapshot on this node by name (Directories.snapshotExists).", sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2391-2394], request: {type: object, properties: {key: {type: string}}}, errors: [{code: not_found, status: 404}], store: {table: snapshots, op: get, key: "= input.key"}}
  - {component: column-family-store, name: snapshots-put, kind: store, summary: "Snapshots taken on this replica.", sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2388], request: {type: object, properties: {key: {type: string}, row: {type: object}}}, store: {table: snapshots, op: put, key: "= input.key", value: "= input.row"}}

  - component: column-family-store-flush
    name: run
    kind: task
    summary: Wait for writes before the barrier, mark the memtable flushing, write it to sstables (or discard it when clean or truncating), commit, reclaim.
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1229-1274
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1276-1404
    request:
      type: object
      required: [keyspace, table, truncate, partitions, bytes]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        truncate: {type: boolean, default: false}
        partitions: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0}
        cells: {type: array, default: [], items: {type: object}, description: The retired memtable's cells (skip-list-memtable.switch-out)}
        partition_rows: {type: array, default: [], items: {type: object}, description: The retired memtable's partitions}
    response:
      type: object
      properties:
        sstables: {type: integer}
        flush_failure: {type: string}
    behavior:
      - title: Wait on the write barrier, then move the memtable to the flushing set
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1236-1248
      - if: "input.truncate || input.partitions == 0"
        then:
          - title: Clean or truncating - replaceFlushed with no sstables and reclaim the memtable
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1281-1286
            call: skip-list-memtable.discard
            input: {keyspace: "= input.keyspace", table: "= input.table", bytes: "= input.bytes", cells: "= has(input.cells) ? input.cells : []", partition_rows: "= has(input.partition_rows) ? input.partition_rows : []"}
          - return: {sstables: 0, flush_failure: ""}
      - set:
          vars.cells: "= has(input.cells) ? input.cells : []"
          vars.rows: "= has(input.partition_rows) ? input.partition_rows : []"
      - title: Split the memtable over the data directories and run a FlushRunnable per disk
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1298-1316
        call: flushing-flush-runnable.call
        input: {keyspace: "= input.keyspace", table: "= input.table", partitions: "= input.partitions", cells: "= vars.cells", partition_rows: "= vars.rows"}
        as: fr
        on_error:
          - set: {ctx.flushFailure: "= error.code"}
          - title: Abort the writers and the transaction; record flushFailure - the memtable is not reclaimed
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1318-1324
            return: {sstables: 0, flush_failure: "= error.code"}
      - title: Commit the lifecycle transaction and add the new sstable to the live set (replaceFlushed)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1352-1379
        call: column-family-store.live-sstables-incr
        input: {key: "= input.keyspace + '.' + input.table", delta: 1}
      - title: Tracker.replaceFlushed publishes the new sstable in the table's View
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1836-1837
        call: column-family-store.add-to-tracker
        input: {keyspace: "= input.keyspace", table: "= input.table", sstable_id: "= 'flush-' + string(now)", size_mb: "= input.bytes / 1048576 + 1", partitions: "= vars.fr.value.sstable_partitions", max_timestamp: "= vars.fr.value.max_timestamp"}
      - title: replaceFlushed submits a background compaction check once the flush added sstables
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1838-1839
        call: compaction-manager.submit-background
        input: {keyspace: "= input.keyspace", table: "= input.table"}
      - title: Reclaim the memtable after a read barrier (MemtableReclaimMemory); its data now lives only in the sstable
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1391-1404
        call: skip-list-memtable.discard
        input: {keyspace: "= input.keyspace", table: "= input.table", bytes: "= input.bytes", cells: "= vars.cells", partition_rows: "= vars.rows"}
      - return: {sstables: 1, flush_failure: ""}

  - component: column-family-store-post-flush
    name: call
    kind: task
    summary: Once the flush latch opens, discard commit log segments up to the memtable's upper bound - unless the flush failed, in which case rethrow.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1134-1164]
    request:
      type: object
      required: [keyspace, table, flush_failure]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        flush_failure: {type: string, default: ""}
    response: WritePathCommitLogPosition
    behavior:
      - if: "input.flush_failure != ''"
        then:
          - set: {ctx.commitLogRetained: true}
          - title: A failed flush keeps its commit log segments; the error is rethrown to every waiter
            source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1147-1161
            fail: {code: "= input.flush_failure", status: 0, message: "= 'flush of ' + input.keyspace + '.' + input.table + ' failed'"}
      - title: Mark the table clean in the commit log up to the upper bound and discard unused segments
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1149-1153
        call: commit-log.discard-completed-segments
        input: {keyspace: "= input.keyspace", table: "= input.table"}

  # ====================================================================== memtable
  - component: skip-list-memtable
    name: put
    kind: function
    summary: Merge a partition update into the memtable, allocating pool memory first; cells (live or tombstone) reconcile by timestamp, and a partition deletion shadows every older cell.
    description: >-
      Tombstones are stored as cells with deleted true and value null (read-path's cells-query counts them
      against the tombstone thresholds). A partition-level deletion is recorded on the partition row
      (deletion_timestamp) and also written as a tombstone over each older cell of the partition, so
      reads through cells-query see it; later cells not newer than the deletion are dropped.
    sources:
      - src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:106-138
      - src/java/org/apache/cassandra/db/rows/Cells.java:79-128
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
    response:
      type: object
      properties:
        new_partition: {type: boolean}
        cells_written: {type: integer}
    behavior:
      - set:
          vars.mt: "= input.mutation.keyspace + '.' + input.mutation.table"
          vars.pk: "= input.mutation.keyspace + '.' + input.mutation.table + ':' + input.mutation.partition_key"
          vars.size: "= has(input.mutation.serialized_size) ? input.mutation.serialized_size : 220"
          vars.pdel_req: "= has(input.mutation.partition_deletion) && input.mutation.partition_deletion"
          vars.written: 0
      - call: skip-list-memtable.partitions-get
        input: {key: "= vars.pk"}
        as: prev
        on_error: continue
      - set:
          vars.old_pdel: "= vars.prev.ok && 'deletion_timestamp' in vars.prev.value ? vars.prev.value.deletion_timestamp : -1"
      - set:
          vars.pdel: "= vars.pdel_req && input.mutation.timestamp > vars.old_pdel ? input.mutation.timestamp : vars.old_pdel"
      - title: Allocate memtable memory (row overhead only for a new partition; may block when the pool is full)
        source: src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:109-127
        call: memtable-allocator.allocate
        input:
          bytes: "= vars.size + (vars.prev.ok ? 0 : 128)"
          keyspace: "= input.mutation.keyspace"
          table: "= input.mutation.table"
      - when: "!vars.prev.ok || vars.pdel != vars.old_pdel"
        call: skip-list-memtable.partitions-put
        input:
          key: "= vars.pk"
          row: {keyspace: "= input.mutation.keyspace", table: "= input.mutation.table", partition_key: "= input.mutation.partition_key", token: "= has(input.mutation.token) ? input.mutation.token : 0", deletion_timestamp: "= vars.pdel"}
      - when: "vars.pdel != vars.old_pdel"
        title: Partition deletion (DeletionTime) - shadow every cell of the partition not newer than it
        source: src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:130
        call: skip-list-memtable.cells-query
        input: {keyspace: "= input.mutation.keyspace", table: "= input.mutation.table"}
        as: pcells
      - when: "vars.pdel != vars.old_pdel"
        foreach: "= vars.pcells.value.filter(c, c.partition_key == input.mutation.partition_key && c.timestamp <= vars.pdel && !('deleted' in c && c.deleted))"
        as: oc
        max: 1000
        steps:
          - call: skip-list-memtable.cells-put
            input:
              key: "= vars.pk + ':' + vars.oc.column"
              row: {keyspace: "= input.mutation.keyspace", table: "= input.mutation.table", partition_key: "= input.mutation.partition_key", column: "= vars.oc.column", value: null, deleted: true, timestamp: "= vars.pdel"}
          - set: {vars.written: "= vars.written + 1"}
      - title: AtomicBTreePartition.addAll - reconcile each cell (a null value is a cell tombstone) with the existing one
        source: src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:130
        set:
          vars.incoming: "= input.mutation.columns.map(k, {'column': k, 'value': input.mutation.columns[k], 'timestamp': input.mutation.timestamp, 'deleted': input.mutation.columns[k] == null}) + (has(input.mutation.cells) ? input.mutation.cells.map(c, {'column': c.column, 'value': ('deleted' in c && c.deleted) ? null : c.value, 'timestamp': c.timestamp, 'deleted': ('deleted' in c && c.deleted) || c.value == null}) : [])"
      - foreach: "= vars.incoming"
        as: nc
        steps:
          - if: "vars.nc.timestamp <= vars.pdel"
            then:
              - title: Shadowed by the partition deletion
                source: src/java/org/apache/cassandra/db/rows/Cells.java:83-84
              - continue: true
          - call: skip-list-memtable.cells-get
            input: {key: "= vars.pk + ':' + vars.nc.column"}
            as: cell
            on_error: continue
          - set:
              vars.old_del: "= vars.cell.ok && (('deleted' in vars.cell.value && vars.cell.value.deleted) || vars.cell.value.value == null)"
          - title: Higher timestamp wins; on a tie a tombstone beats a live cell, then the greater value wins
            source: src/java/org/apache/cassandra/db/rows/Cells.java:83-128
            if: "!vars.cell.ok || vars.nc.timestamp > vars.cell.value.timestamp || (vars.nc.timestamp == vars.cell.value.timestamp && ((vars.nc.deleted && !vars.old_del) || (vars.nc.deleted == vars.old_del && !vars.nc.deleted && string(vars.nc.value) > string(vars.cell.value.value))))"
            then:
              - call: skip-list-memtable.cells-put
                input:
                  key: "= vars.pk + ':' + vars.nc.column"
                  row:
                    keyspace: "= input.mutation.keyspace"
                    table: "= input.mutation.table"
                    partition_key: "= input.mutation.partition_key"
                    column: "= vars.nc.column"
                    value: "= vars.nc.value"
                    deleted: "= vars.nc.deleted"
                    timestamp: "= vars.nc.timestamp"
              - set: {vars.written: "= vars.written + 1"}
      - title: Update live data size, operation count and stats
        source: src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:131-137
        call: skip-list-memtable.stats-incr
        input:
          key: "= vars.mt"
          delta: {operations: 1, partitions: "= vars.prev.ok ? 0 : 1", bytes: "= vars.size"}
      - return: {new_partition: "= !vars.prev.ok", cells_written: "= vars.written"}

  - component: skip-list-memtable
    name: is-clean
    kind: function
    summary: True when the current memtable holds no partitions.
    sources: [src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:94-98]
    request: WritePathTableRef
    response:
      type: object
      properties:
        clean: {type: boolean}
    behavior:
      - call: skip-list-memtable.stats-get
        input: {key: "= input.keyspace + '.' + input.table"}
        as: s
        on_error: continue
      - return: {clean: "= !vars.s.ok || vars.s.value.partitions == 0"}

  - component: skip-list-memtable
    name: switch-out
    kind: function
    summary: Retire the current memtable behind the write barrier (a fresh one takes new writes); its allocator starts discarding.
    sources:
      - src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:162-166
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1206-1215
    description: >-
      The model keeps one cells and partitions table per node, so the retired memtable's contents are
      returned as a snapshot (what the flush writes and later reclaims); writes after the switch land in the
      same tables as the new memtable's contents.
    request: WritePathTableRef
    response:
      type: object
      properties:
        operations: {type: integer}
        partitions: {type: integer}
        bytes: {type: integer}
        cells: {type: array, items: {type: object}}
        partition_rows: {type: array, items: {type: object}}
    behavior:
      - set: {vars.key: "= input.keyspace + '.' + input.table"}
      - title: The retired memtable's partitions and cells (Memtable.getFlushSet)
        source: src/java/org/apache/cassandra/db/memtable/SkipListMemtable.java:246-250
        call: skip-list-memtable.cells-query
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: cells
      - call: skip-list-memtable.partitions-query
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: prows
      - call: skip-list-memtable.stats-get
        input: {key: "= vars.key"}
        as: s
        on_error: continue
      - set:
          vars.st: "= vars.s.ok ? vars.s.value : {'operations': 0, 'partitions': 0, 'bytes': 0}"
      - call: skip-list-memtable.stats-put
        input: {key: "= vars.key", row: {operations: 0, partitions: 0, bytes: 0}}
      - title: allocator.setDiscarding - the old memtable's memory becomes reclaiming
        source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:165
        call: memtable-allocator.set-discarding
        input: {bytes: "= vars.st.bytes"}
      - return: {operations: "= vars.st.operations", partitions: "= vars.st.partitions", bytes: "= vars.st.bytes", cells: "= vars.cells.value", partition_rows: "= vars.prows.value"}

  - component: skip-list-memtable
    name: discard
    kind: function
    summary: Discard a flushed memtable - its partitions and cells are dropped (reads now go to the sstable) - and release its memory to the pool.
    description: >-
      Only the snapshot taken at switch-out is dropped. A cell rewritten after the switch (a different
      timestamp or value) belongs to the new memtable and stays.
    sources: [src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:168-172]
    request:
      type: object
      required: [keyspace, table, bytes]
      properties:
        keyspace: {type: string}
        table: {type: string}
        bytes: {type: integer, minimum: 0}
        cells: {type: array, default: [], items: {type: object}}
        partition_rows: {type: array, default: [], items: {type: object}}
    behavior:
      - set:
          vars.old_cells: "= has(input.cells) ? input.cells : []"
          vars.old_rows: "= has(input.partition_rows) ? input.partition_rows : []"
      - call: skip-list-memtable.cells-query
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: cur
      - title: The discarded memtable's cells are gone; the flushed sstable now serves them
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1391-1404
        foreach: "= vars.cur.value.filter(c, vars.old_cells.exists(o, o.partition_key == c.partition_key && o.column == c.column && o.timestamp == c.timestamp && o.value == c.value))"
        as: c
        max: 1000
        steps:
          - call: skip-list-memtable.cells-delete
            input: {key: "= vars.c.keyspace + '.' + vars.c.table + ':' + vars.c.partition_key + ':' + vars.c.column"}
      - foreach: "= vars.old_rows"
        as: r
        max: 1000
        steps:
          - call: skip-list-memtable.partitions-delete
            input: {key: "= vars.r.keyspace + '.' + vars.r.table + ':' + vars.r.partition_key"}
      - call: memtable-allocator.set-discarded
        input: {bytes: "= input.bytes"}

