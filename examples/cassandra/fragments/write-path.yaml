      - {interface: column-family-store.live-sstables-get, caller: read-path, as: n, input: {key: "shop.users"}}
    expect:
      - "state['skip-list-memtable@n1'].stats['shop.users'].partitions == 0"
      - "steps.p.result.value.action == 'flushed' && steps.n.result.value == 1"
  - id: wp-period-flush-expired-clean
    flow: memtable-period-flush
    fixtures: [one-node]
    name: Period expired on a clean memtable - reschedule
    input: {memtable_flush_period_in_ms: 3600000, memtable_age_ms: 3600000}
    expect:
      - "result.ok && result.value.action == 'rescheduled' && calls['column-family-store.signal-flush-required'] == 0"
      - "!('shop.users' in state['column-family-store@n1'].live_sstables)"
  - id: wp-period-flush-not-yet
    flow: memtable-period-flush
    fixtures: [one-node]
    name: Period not yet expired
