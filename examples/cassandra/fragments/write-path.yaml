      - "calls_by_instance['abstract-commit-log-segment-manager.allocator-runnable-run@n2'] == 1 && state['abstract-commit-log-segment-manager@n2'].available_segment == true"
      - "state['abstract-commit-log-service@n2'].sync_requested == true && 'CommitLog-8-2.log' in state['commit-log@n2'].segments_on_disk"
  - id: wp-mutation-segment-full-no-reserve
    flow: replica-mutation-verb
