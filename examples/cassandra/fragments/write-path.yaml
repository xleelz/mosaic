      - "state['column-family-store@n1'].live_sstables['shop.users'] == 1"
  - id: wp-period-flush-then-count
    fixtures: [one-node]
    name: A write, then the expired period flush - the table gains a live sstable
    steps:
      - {flow: coordinator-local-apply, as: w}
