  - id: wp-cleaner-then-count
    fixtures: [one-node]
    name: After the cleaner flushes, the table has a live sstable
    state:
      memtable-pool: {allocated_bytes: 1000000000}
      skip-list-memtable: {stats: {"shop.users": {operations: 100, partitions: 50, bytes: 1000000000}}}
