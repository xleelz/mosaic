  - component: abstract-commit-log-service
    name: finish-write-for
    kind: function
    summary: After the entry is written, wait for sync as the configured service requires.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:278-287
      - src/java/org/apache/cassandra/db/commitlog/CommitLog.java:116-129
    behavior:
      - call: "= config['commitlog-sync'] + '-commit-log-service.maybe-wait-for-sync'"
        targets: [periodic-commit-log-service.maybe-wait-for-sync, batch-commit-log-service.maybe-wait-for-sync, group-commit-log-service.maybe-wait-for-sync]
        input:
          last_synced_at_ms: "= state.last_synced_at_ms"
          sync_lag_block_ms: "= int(config['periodic-commitlog-sync-lag-block-ms'])"
          group_window_ms: "= int(config['commitlog-sync-group-window-ms'])"
      - set: {state.written: "= state.written + 1"}

  - component: abstract-commit-log-service
    name: request-extra-sync
    kind: function
    summary: Set syncRequested and wake the sync thread.
    sources: [src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:289-297]
    behavior:
      - set: {state.sync_requested: true}

  - component: abstract-commit-log-service
    name: await-sync-at
    kind: function
    summary: Block the writer until the sync thread completes a sync at or after the given time.
    description: Modeled by running the sync thread's next iteration inline, as a flushing iteration (the writer returns only once a sync at or after its time has completed).
    sources: [src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:317-328]
    behavior:
      - set: {state.sync_requested: true}
      - call: abstract-commit-log-service.sync-runnable-run

  - component: abstract-commit-log-service
    name: sync-runnable-run
    kind: task
    summary: "One iteration of the PERIODIC-COMMIT-LOG-SYNCER loop (SyncRunnable.run): fsync when the period elapsed or a sync was requested, else only write markers; errors go through commit_failure_policy."
    sources:
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:147-225
    response: {type: object, properties: {flushed: {type: boolean}, terminated: {type: boolean}}}
    errors:
      - {code: terminate, summary: TerminateException - the sync thread ends (commit_failure_policy stop/stop_commit/die)}
    behavior:
      - if: "state.terminated"
        then:
          - title: The sync thread has terminated; nothing syncs any more
            return: {flushed: false, terminated: true}
      - when: "state.last_synced_at_ms < 0"
        title: First iteration - lastSyncedAt starts at the service's construction time
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:62
        set: {state.last_synced_at_ms: "= now"}
      - set:
          vars.period: "= config['commitlog-sync'] == 'group' ? int(config['commitlog-sync-group-window-ms']) : int(config['commitlog-sync-period-ms'])"
      - set:
          vars.flush: "= state.last_synced_at_ms + vars.period <= now || state.sync_requested"
      - title: Sync markers, and fsync when the period has elapsed or a sync was requested
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:177-197
        call: commit-log.sync
        input: {flush: "= vars.flush"}
        on_error:
          - call: commit-log.handle-commit-error
            input: {message: Failed to persist commits to disk}
            as: h
          - if: "!vars.h.value.continue_processing"
            then:
              - set: {state.terminated: true, ctx.syncThread: terminated}
              - title: TerminateException - the sync thread stops
                source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:218-221
                fail: {code: terminate, message: "= 'commit log sync failed: ' + error.code"}
          - set: {ctx.syncThread: error-ignored}
          - title: Ignored - sleep a marker interval before the next attempt
            source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:222-223
            wait: "= state.marker_interval_ms"
          - return: {flushed: false, terminated: false}
      - when: "vars.flush"
        set:
          state.last_synced_at_ms: "= now"
          state.sync_requested: false
          state.sync_count: "= state.sync_count + 1"
      - return: {flushed: "= vars.flush", terminated: false}

  - component: periodic-commit-log-service
    name: maybe-wait-for-sync
    kind: function
    summary: Periodic mode - ack immediately unless the last sync is older than periodic_commitlog_sync_lag_block (1.5 x 10000ms), then wait for a sync.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/PeriodicCommitLogService.java:28-45
      - src/java/org/apache/cassandra/config/DatabaseDescriptor.java:3423-3429
    request:
      type: object
      properties:
        last_synced_at_ms: {type: integer, default: -1, description: "-1 until the sync thread first runs (no lag yet)"}
        sync_lag_block_ms: {type: integer, default: 15000}
        group_window_ms: {type: integer, default: 0}
    response: {type: object, properties: {waited: {type: boolean}}}
    behavior:
      - if: "input.last_synced_at_ms >= 0 && input.last_synced_at_ms < now - input.sync_lag_block_ms"
        then:
          - set: {ctx.waitedOnCommit: true}
          - title: Sync lags beyond the block interval - the writer waits for the next sync
            source: src/java/org/apache/cassandra/db/commitlog/PeriodicCommitLogService.java:38-44
            call: abstract-commit-log-service.await-sync-at
          - return: {waited: true}
      - return: {waited: false}

  - component: batch-commit-log-service
    name: maybe-wait-for-sync
    kind: function
    summary: Batch mode - request a sync and wait until this entry is on disk.
    sources: [src/java/org/apache/cassandra/db/commitlog/BatchCommitLogService.java:36-42]
    request: {type: object, properties: {last_synced_at_ms: {type: integer}, sync_lag_block_ms: {type: integer}, group_window_ms: {type: integer}}}
    response: {type: object, properties: {waited: {type: boolean}}}
    behavior:
      - call: abstract-commit-log-service.request-extra-sync
      - set: {ctx.waitedOnCommit: true}
      - title: awaitDiskSync
        source: src/java/org/apache/cassandra/db/commitlog/BatchCommitLogService.java:41
        call: abstract-commit-log-service.await-sync-at
      - return: {waited: true}

  - component: group-commit-log-service
    name: maybe-wait-for-sync
    kind: function
    summary: Group mode - wait for the next sync, which runs every commitlog_sync_group_window.
    sources: [src/java/org/apache/cassandra/db/commitlog/GroupCommitLogService.java:34-40]
    request: {type: object, properties: {last_synced_at_ms: {type: integer}, sync_lag_block_ms: {type: integer}, group_window_ms: {type: integer}}}
    response: {type: object, properties: {waited: {type: boolean}}}
    behavior:
      - set: {ctx.waitedOnCommit: true}
      - wait: "= has(input.group_window_ms) ? input.group_window_ms : 0"
      - title: awaitDiskSync
        source: src/java/org/apache/cassandra/db/commitlog/GroupCommitLogService.java:39
        call: abstract-commit-log-service.await-sync-at
      - return: {waited: true}

  - component: abstract-commit-log-segment-manager
    name: allocator-runnable-run
    kind: task
    summary: "One iteration of the COMMIT-LOG-ALLOCATOR loop (AllocatorRunnable.run): create the reserve segment, then flush tables if over commitlog_total_space."
    sources:
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:150-161
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:163-238
    response: {type: object, properties: {created: {type: boolean}}}
    errors:
      - {code: terminate, summary: TerminateException - the allocator thread ends}
    behavior:
      - if: "state.available_segment"
        then:
          - title: A reserve segment exists - wait on managerThreadWaitCondition
            source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:220-231
            return: {created: false}
      - title: No segments in reserve; creating a fresh one
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:185-192
        call: abstract-commit-log-segment-manager.create-segment
        as: seg
        on_error:
          - call: commit-log.handle-commit-error
            input: {message: Failed managing commit log segments}
            as: h
          - if: "!vars.h.value.continue_processing"
            then:
              - set: {ctx.allocatorThread: terminated}
              - title: Discard the reserve and terminate the allocator thread
                source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:206-210
                fail: {code: terminate, message: "= 'commit log segment creation failed: ' + error.code"}
          - set: {ctx.allocatorThread: error-ignored}
          - title: Ignored - sleep 1s and retry later
            source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:213
            wait: 1000
          - return: {created: false}
      - set:
          state.available_segment: true
          state.reserve_cdc_state: "= vars.seg.value.cdc_state"
          state.on_disk_size_bytes: "= state.on_disk_size_bytes + int(config['commitlog-segment-size-bytes'])"
      - title: If over commitlog_total_space, flush the tables dirty in the oldest segments
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:200
        call: abstract-commit-log-segment-manager.maybe-flush-to-reclaim
      - return: {created: true}

  - component: abstract-commit-log-segment-manager
    name: create-segment
    kind: function
    summary: Build a new segment with the configured builder (mmap for the deployed config) via the concrete manager.
    sources: [src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:271-278]
    response: {type: object, properties: {cdc_state: {type: string, enum: [PERMITTED, FORBIDDEN, CONTAINS]}}}
    behavior:
      - call: "= config['cdc-enabled'] ? 'commit-log-segment-manager-cdc.create-segment' : 'commit-log-segment-manager-standard.create-segment'"
        targets: [commit-log-segment-manager-standard.create-segment, commit-log-segment-manager-cdc.create-segment]
        as: seg
      - return: "= vars.seg.value"

  - component: abstract-commit-log-segment-manager
    name: maybe-flush-to-reclaim
    kind: function
    summary: When on-disk segments exceed commitlog_total_space, force-flush the tables dirty in the oldest segments so they can be recycled.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:246-264
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:445-503
    response: {type: object, properties: {flushed_tables: {type: integer}}}
    behavior:
      - if: "int(config['commitlog-total-space-bytes']) - state.on_disk_size_bytes >= 0"
        then:
          - return: {flushed_tables: 0}
      - set: {ctx.commitLogOverTotalSpace: true}
      - foreach: "= state.dirty_tables"
        as: t
        steps:
          - title: forceFlush(COMMITLOG_DIRTY) for each dirty table
            source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:481-497
            call: column-family-store.force-flush
            input: {keyspace: "= vars.t.keyspace", table: "= vars.t.table", reason: COMMITLOG_DIRTY}
      - return: {flushed_tables: "= size(state.dirty_tables)"}

  - component: abstract-commit-log-segment-manager
    name: advance-allocating-from
    kind: function
    summary: The current segment is full - switch to the reserve segment (waiting for the allocator if there is none), wake the allocator, archive the old segment, request a sync.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:295-348
    behavior:
      - if: "!state.available_segment"
        then:
          - set: {ctx.waitedForSegment: true}
          - title: No reserve segment - awaitAvailableSegment blocks the writer until the allocator thread creates one
            source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:337-348
            call: abstract-commit-log-segment-manager.allocator-runnable-run
      - title: activeSegments.add(allocatingFrom = availableSegment)
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:307-313
        set:
          state.active_segments: "= state.active_segments + 1"
          state.available_segment: false
      - title: Discard the old segment's unused tail (the model's segment state rolls to the new segment)
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:323-331
        call: commit-log-segment.discard-unused-tail
        input: {next_cdc_state: "= state.reserve_cdc_state"}
      - call: commit-log-archiver.maybe-archive
        input: {name: old-segment}
      - title: Wake the allocator thread to prepare the next reserve
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:321
        emit: abstract-commit-log-segment-manager.allocator-runnable-run
      - title: Request an extra sync so the old segment is synced promptly
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:334
        call: commit-log.request-extra-sync

  - component: abstract-commit-log-segment-manager
    name: archive-and-discard
    kind: function
    summary: Discard one segment that became unused after a flush marked it clean (after archiving, when archive_command is set).
    description: archive_command is empty as shipped, so archiving always succeeds and the file is deleted now; a failed archive (not modeled) would leave it for the archive script (AbstractCommitLogSegmentManager.java:407-412).
    sources:
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:402-414
    request:
      type: object
      required: [name]
      properties:
        name: {type: string, examples: [CommitLog-8-0.log]}
        id: {type: integer, examples: [0]}
    response: {type: object, properties: {deleted: {type: boolean}}}
    behavior:
      - title: Wait for the archive command (a no-op as shipped)
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:404
        call: commit-log-archiver.maybe-wait-for-archiving
        input: {name: "= input.name"}
      - title: Remove the segment from the active set and delete its file
        source: src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerStandard.java:31-37
        call: commitlog-disk.segment-delete
        input: {name: "= input.name"}
      - call: commit-log.segments-delete
        input: {key: "= input.name"}
      - set:
          state.on_disk_size_bytes: "= state.active_segments > 1 ? state.on_disk_size_bytes - int(config['commitlog-segment-size-bytes']) : state.on_disk_size_bytes"
          state.active_segments: "= state.active_segments > 1 ? state.active_segments - 1 : 1"
      - return: {deleted: true}

  - component: abstract-commit-log-segment-manager
    name: sync
    kind: function
    summary: Sync every active segment up to the allocating one; mmap segments write markers in memory and msync only when flushing.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:625-635
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:303-360
    request: {type: object, required: [flush], properties: {flush: {type: boolean}}}
    behavior:
      - when: "input.flush"
        title: MemoryMappedSegment.flush - force the mapped buffer to disk
        source: src/java/org/apache/cassandra/db/commitlog/MemoryMappedSegment.java:89-110
        call: commitlog-disk.segment-sync
        input: {flush: true}

  - component: commit-log-segment-manager-standard
    name: allocate
    kind: function
    summary: Allocate from the current segment, advancing to a new segment when it is full.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerStandard.java:39-60]
    request:
      type: object
      required: [size]
      properties:
        size: {type: integer, minimum: 0}
        cdc: {type: boolean, default: false}
        cdc_block_writes: {type: boolean, default: true}
    response:
      type: object
      properties:
        allocated: {type: boolean}
        segment_id: {type: integer}
        position: {type: integer}
    behavior:
      - call: commit-log-segment.allocate
        input: {size: "= input.size"}
        as: a
      - if: "vars.a.value.allocated"
        then:
          - return: "= vars.a.value"
      - title: Segment full - advance to a new segment with enough room
        source: src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerStandard.java:52-57
        call: abstract-commit-log-segment-manager.advance-allocating-from
      - call: commit-log-segment.allocate
        input: {size: "= input.size"}
        as: b
      - return: "= vars.b.value"

  - component: commit-log-segment-manager-standard
    name: create-segment
    kind: function
    summary: Create a segment file and write its header.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerStandard.java:62-68]
    response: {type: object, properties: {cdc_state: {type: string, enum: [PERMITTED, FORBIDDEN, CONTAINS]}}}
    behavior:
      - call: commitlog-disk.segment-create
        input: {size_bytes: 33554432}
      - return: {cdc_state: PERMITTED}

  - component: commit-log-segment-manager-cdc
    name: allocate
    kind: function
    summary: Like the standard allocate, but a CDC mutation on a FORBIDDEN segment (cdc_raw over cdc_total_space with cdc_block_writes) throws CDCWriteException.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:159-190
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:212-228
    request:
      type: object
      required: [size]
      properties:
        size: {type: integer, minimum: 0}
        cdc: {type: boolean, default: false}
        cdc_block_writes: {type: boolean, default: true}
    response:
      type: object
      properties:
        allocated: {type: boolean}
        segment_id: {type: integer}
        position: {type: integer}
    errors:
      - {code: cdc-write, status: 5632, summary: CDCWriteException (ExceptionCode.CDC_WRITE_FAILURE 0x1600)}
    behavior:
      - call: commit-log-segment.get-cdc-state
        as: seg
      - call: commit-log-segment-manager-cdc.permit-segment-maybe
        input: {cdc_state: "= vars.seg.value.cdc_state", cdc_block_writes: "= input.cdc_block_writes"}
        as: p
      - if: "input.cdc && vars.p.value.cdc_state == 'FORBIDDEN'"
        then:
          - set: {ctx.cdcRejected: true}
          - title: Rejecting mutation - free up space in cdc_raw by processing CDC logs
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:214-226
            fail: {code: cdc-write, status: 5632, message: "Rejecting mutation: CDC space in cdc_raw is exhausted"}
      - call: commit-log-segment.allocate
        input: {size: "= input.size"}
        as: a
      - set: {vars.result: "= vars.a.value"}
      - if: "!vars.a.value.allocated"
        then:
          - call: abstract-commit-log-segment-manager.advance-allocating-from
          - call: commit-log-segment.get-cdc-state
            as: seg2
          - call: commit-log-segment-manager-cdc.permit-segment-maybe
            input: {cdc_state: "= vars.seg2.value.cdc_state", cdc_block_writes: "= input.cdc_block_writes"}
            as: p2
          - if: "input.cdc && vars.p2.value.cdc_state == 'FORBIDDEN'"
            then:
              - set: {ctx.cdcRejected: true}
              - fail: {code: cdc-write, status: 5632, message: "Rejecting mutation: CDC space in cdc_raw is exhausted"}
          - call: commit-log-segment.allocate
            input: {size: "= input.size"}
            as: b
          - set: {vars.result: "= vars.b.value"}
      - when: "input.cdc"
        title: The segment now CONTAINS CDC data
        source: src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:186-187
        call: commit-log-segment.set-cdc-state
        input: {cdc_state: CONTAINS}
      - return: "= vars.result"

  - component: commit-log-segment-manager-cdc
    name: permit-segment-maybe
    kind: function
    summary: Re-permit a FORBIDDEN segment when blocking is off or cdc_raw has room again.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:192-210]
    request: {type: object, required: [cdc_state], properties: {cdc_state: {type: string}, cdc_block_writes: {type: boolean}}}
    response: {type: object, properties: {cdc_state: {type: string}}}
    behavior:
      - if: "input.cdc_state != 'FORBIDDEN'"
        then:
          - return: {cdc_state: "= input.cdc_state"}
      - if: "!input.cdc_block_writes || state.cdc_size_in_progress_bytes + int(config['commitlog-segment-size-bytes']) < int(config['cdc-total-space-bytes'])"
        then:
          - call: commit-log-segment.set-cdc-state
            input: {cdc_state: PERMITTED}
          - set: {state.cdc_size_in_progress_bytes: "= state.cdc_size_in_progress_bytes + int(config['commitlog-segment-size-bytes'])"}
          - return: {cdc_state: PERMITTED}
      - return: {cdc_state: FORBIDDEN}

  - component: commit-log-segment-manager-cdc
    name: create-segment
    kind: function
    summary: Create a segment and classify it - FORBIDDEN when blocking and cdc_raw would exceed cdc_total_space, else PERMITTED (and hard-linked into cdc_raw).
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:236-249
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:326-358
    response: {type: object, properties: {cdc_state: {type: string, enum: [PERMITTED, FORBIDDEN, CONTAINS]}}}
    behavior:
      - call: commitlog-disk.segment-create
        input: {size_bytes: 33554432}
      - if: "state.cdc_size_in_progress_bytes + int(config['commitlog-segment-size-bytes']) > int(config['cdc-total-space-bytes'])"
        then:
          - title: Over the CDC allowance - the new segment is FORBIDDEN for CDC writes
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerCDC.java:335-337
            return: {cdc_state: FORBIDDEN}
      - set: {state.cdc_size_in_progress_bytes: "= state.cdc_size_in_progress_bytes + int(config['commitlog-segment-size-bytes'])"}
      - return: {cdc_state: PERMITTED}

  - component: commit-log-segment
    name: allocate
    kind: function
    summary: Reserve bytes in the segment buffer, or report that the segment is full (null).
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:197-223
      - src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:239-255
    request: {type: object, required: [size], properties: {size: {type: integer, minimum: 0}}}
    response:
      type: object
      properties:
        allocated: {type: boolean}
        segment_id: {type: integer}
        position: {type: integer}
    behavior:
      - if: "input.size >= state.free_bytes"
        then:
          - return: {allocated: false, segment_id: "= state.id", position: -1}
      - set: {vars.pos: "= state.position"}
      - set:
          state.position: "= state.position + input.size"
          state.free_bytes: "= state.free_bytes - input.size"
      - return: {allocated: true, segment_id: "= state.id", position: "= vars.pos"}

  - component: commit-log-segment
    name: discard-unused-tail
    kind: function
    summary: Make the rest of the full segment unwritable; in the model the state then becomes the next allocating segment.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:257-287]
    request: {type: object, properties: {next_cdc_state: {type: string, default: PERMITTED}}}
    behavior:
      - set:
          state.id: "= state.id + 1"
          state.position: 0
          state.free_bytes: "= int(config['commitlog-segment-size-bytes'])"
          state.cdc_state: "= has(input.next_cdc_state) ? input.next_cdc_state : 'PERMITTED'"

  - component: commit-log-segment
    name: get-cdc-state
    kind: function
    summary: The segment's CDC state.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:670-673]
    response: {type: object, properties: {cdc_state: {type: string}, segment_id: {type: integer}}}
    behavior:
      - return: {cdc_state: "= state.cdc_state", segment_id: "= state.id"}

  - component: commit-log-segment
    name: set-cdc-state
    kind: function
    summary: Change the CDC state (CONTAINS is sticky).
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:675-700]
    request: {type: object, required: [cdc_state], properties: {cdc_state: {type: string, enum: [PERMITTED, FORBIDDEN, CONTAINS]}}}
    response: {type: object, properties: {old_state: {type: string}}}
    behavior:
      - set: {vars.old: "= state.cdc_state"}
      - when: "state.cdc_state != 'CONTAINS'"
        set: {state.cdc_state: "= input.cdc_state"}
      - return: {old_state: "= vars.old"}

  - component: commit-log-archiver
    name: maybe-archive
    kind: function
    summary: Submit archive_command for a segment; a no-op when archive_command is empty (as shipped).
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:195-238
    request: {type: object, properties: {name: {type: string, examples: [CommitLog-8-1730000000001.log]}}}
    response: {type: object, properties: {archived: {type: boolean}}}
    behavior:
      - if: "config['commitlog-archive-command'] == ''"
        then:
          - title: archive_command is empty - nothing to do
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:197-198
            return: {archived: false}
      - title: Run archive_command on the archiver executor
        source: src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:200-209
        return: {archived: true}

  - component: commit-log-archiver
    name: maybe-wait-for-archiving
    kind: function
    summary: Wait for a pending archive task; true when the segment may be deleted now.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:240-268]
    request: {type: object, properties: {name: {type: string}}}
    response: {type: object, properties: {success: {type: boolean}}}
    behavior:
      - return: {success: true}

  - component: commit-log-archiver
    name: maybe-restore-archive
    kind: function
    summary: Copy archived segments back from restore_directories with restore_command; a no-op when restore_directories is empty.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:270-332]
    response: {type: object, properties: {restored: {type: integer}}}
    behavior:
      - if: "config['commitlog-restore-directories'] == ''"
        then:
          - title: restore_directories empty - nothing to restore
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogArchiver.java:272-273
            return: {restored: 0}
      - return: {restored: 1}

  - component: commit-log-replayer
    name: replay-files
    kind: function
    summary: Read each segment in id order; only the last one tolerates a truncated tail.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:197-209]
    request:
      type: object
      required: [segments]
      properties:
        segments: {type: array, items: {$ref: WritePathCommitLogSegmentFile}}
    behavior:
      - foreach: "= input.segments"
        as: seg
        index: i
        steps:
          - call: commit-log-reader.read-commit-log-segment
            input: {segment: "= vars.seg", tolerate_truncation: "= vars.i == size(input.segments) - 1"}

  - component: commit-log-replayer
    name: replay-path
    kind: function
    summary: Replay one file.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:189-195]
    request:
      type: object
      required: [segment]
      properties:
        segment: {$ref: WritePathCommitLogSegmentFile}
        tolerate_truncation: {type: boolean, default: false}
    behavior:
      - call: commit-log-reader.read-commit-log-segment
        input: {segment: "= input.segment", tolerate_truncation: "= has(input.tolerate_truncation) ? input.tolerate_truncation : false"}

  - component: commit-log-replayer
    name: handle-mutation
    kind: function
    summary: Queue a read mutation for application, bounding outstanding replay futures and bytes.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:512-531]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
        already_persisted: {type: boolean, default: false}
        clean_tables: {type: array, default: [], items: {type: string}}
    behavior:
      - call: commit-log-replayer-mutation-initiator.initiate-mutation
        input: {mutation: "= input.mutation", already_persisted: "= has(input.already_persisted) ? input.already_persisted : false", clean_tables: "= has(input.clean_tables) ? input.clean_tables : []"}

  - component: commit-log-replayer
    name: should-skip-segment-on-error
    kind: function
    summary: Decide on a replay read error - permissible errors (torn tail of the last segment) are ignored; otherwise commit_failure_policy may stop replay.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:533-547]
    request: {type: object, required: [permissible], properties: {message: {type: string}, permissible: {type: boolean}}}
    response: {type: object, properties: {skip: {type: boolean}}}
    errors:
      - {code: commit-log-replay-exception, summary: CommitLogReplayException - startup fails}
    behavior:
      - if: "input.permissible"
        then:
          - set: {ctx.replayErrorIgnored: permissible}
          - title: Ignoring commit log replay error likely due to incomplete flush to disk
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:535-536
            return: {skip: false}
      - if: "config['commitlog-ignore-replay-errors']"
        then:
          - set: {ctx.replayErrorIgnored: property}
          - return: {skip: false}
      - call: commit-log.handle-commit-error
        input: {message: Failed commit log replay}
        as: h
      - if: "!vars.h.value.continue_processing"
        then:
          - set: {ctx.replayStopped: true}
          - title: Replay stopped; startup fails unless -Dcassandra.commitlog.ignorereplayerrors=true
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:539-545
            fail: {code: commit-log-replay-exception, message: "= input.message"}
      - set: {ctx.replayErrorIgnored: policy}
      - return: {skip: false}

  - component: commit-log-replayer
    name: handle-unrecoverable-error
    kind: function
    summary: Same decision as shouldSkipSegmentOnError, used for descriptor and section errors.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:549-556]
    request: {type: object, required: [permissible], properties: {message: {type: string}, permissible: {type: boolean}}}
    behavior:
      - call: commit-log-replayer.should-skip-segment-on-error
        input: "= input"

  - component: commit-log-replayer
    name: block-for-writes
    kind: function
    summary: Wait for replayed mutations, flush every replayed keyspace (STARTUP) and system.batches, return the replay count.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:239-275]
    response: {type: object, properties: {replayed: {type: integer}}}
    behavior:
      - foreach: "= ctx.replayedKeyspaces"
        as: ks
        steps:
          - title: Flush the replayed keyspace (FlushReason.STARTUP)
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:258-264
            call: keyspace.flush
            input: {keyspace: "= vars.ks", reason: STARTUP}
      - when: "!('system' in ctx.replayedKeyspaces)"
        title: Also flush system.batches (INTERNALLY_FORCED)
        source: src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:267-270
        call: column-family-store.force-flush
        input: {keyspace: system, table: batches, reason: INTERNALLY_FORCED}
      - return: {replayed: "= ctx.replayedMutations"}

  - component: commit-log-replayer-mutation-initiator
    name: initiate-mutation
    kind: task
    summary: On Stage.MUTATION - drop updates already persisted in sstables or truncated, apply the rest without the commit log.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:284-332]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
        already_persisted: {type: boolean, default: false}
        clean_tables: {type: array, default: [], items: {type: string}, description: Tables of this entry already flushed (marked clean); their updates are not replayed}
    response: {type: object, properties: {replayed: {type: boolean}}}
    behavior:
      - if: "has(input.already_persisted) && input.already_persisted"
        then:
          - set: {ctx.replaySkippedPersisted: true}
          - title: Position covered by persisted sstable intervals or the truncation record - shouldReplay is false
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:314
            return: {replayed: false}
      - set:
          vars.clean: "= has(input.clean_tables) ? input.clean_tables : []"
          vars.upds: "= has(input.mutation.updates) && size(input.mutation.updates) > 0 ? input.mutation.updates.map(u, omit(merge(merge(omit(input.mutation, 'updates', 'columns', 'cells', 'partition_deletion'), {'columns': {}, 'cells': [], 'partition_deletion': false}), u), 'updates')) : [omit(input.mutation, 'updates')]"
      - title: Keep only the PartitionUpdates whose table has not persisted this position (shouldReplay per table id)
        source: src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:307-321
        set:
          vars.keep: "= vars.upds.filter(u, !(u.table in vars.clean))"
      - set:
          vars.replay: "= size(vars.keep) == 0 ? input.mutation : (size(vars.upds) == 1 ? input.mutation : merge(vars.keep[0], {'updates': vars.keep}))"
      - title: Apply on Stage.MUTATION without writing the commit log again (not droppable)
        source: src/java/org/apache/cassandra/db/commitlog/CommitLogReplayer.java:326-331
        call: keyspace.apply
        input: {mutation: "= vars.replay", write_commit_log: false, update_indexes: true, is_droppable: false}
      - set:
          ctx.replayedMutations: "= ctx.replayedMutations + 1"
          ctx.replayedKeyspaces: "= input.mutation.keyspace in ctx.replayedKeyspaces ? ctx.replayedKeyspaces : ctx.replayedKeyspaces + [input.mutation.keyspace]"
      - return: {replayed: true}

  - component: commit-log-reader
    name: read-commit-log-segment
    kind: function
    summary: Read the descriptor, then each sync section; a bad mutation CRC is reported to the handler and the reader continues with the next entry.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLogReader.java:161-288
      - src/java/org/apache/cassandra/db/commitlog/CommitLogReader.java:383-395
    request:
      type: object
      required: [segment, tolerate_truncation]
      properties:
        segment: {$ref: WritePathCommitLogSegmentFile}
        tolerate_truncation: {type: boolean}
    response: {type: object, properties: {mutations_read: {type: integer}}}
    behavior:
      - if: "has(input.segment.header_corrupt) && input.segment.header_corrupt"
        then:
          - title: Could not read commit log descriptor - unrecoverable for this file
            source: src/java/org/apache/cassandra/db/commitlog/CommitLogReader.java:191-199
            call: commit-log-replayer.handle-unrecoverable-error
            input: {message: "= 'Could not read commit log descriptor in file ' + input.segment.name", permissible: "= input.tolerate_truncation"}
          - return: {mutations_read: 0}
      - call: commitlog-disk.segment-read
        input: {name: "= input.segment.name"}
      - set: {vars.read: 0}
      - foreach: "= input.segment.entries"
        as: e
        steps:
          - if: "has(vars.e.corrupt) && vars.e.corrupt"
            then:
              - title: Mutation checksum failure - permissible only in the tail of the last segment
                source: src/java/org/apache/cassandra/db/commitlog/CommitLogReader.java:384-393
                call: commit-log-replayer.should-skip-segment-on-error
                input: {message: "= 'Mutation checksum failure in ' + input.segment.name", permissible: "= input.tolerate_truncation"}
              - continue: true
          - call: commit-log-replayer.handle-mutation
            input: {mutation: "= vars.e.mutation", already_persisted: "= has(vars.e.already_persisted) ? vars.e.already_persisted : false", clean_tables: "= has(vars.e.clean_tables) ? vars.e.clean_tables : []"}
          - set: {vars.read: "= vars.read + 1"}
      - return: {mutations_read: "= vars.read"}

  # ====================================================================== views
  - component: view-manager
    name: updates-affect-view
    kind: function
    summary: True when any view of the updated table selects the update.
    sources: [src/java/org/apache/cassandra/db/view/ViewManager.java:73-93]
    request: {type: object, required: [keyspace, table], properties: {keyspace: {type: string}, table: {type: string}}}
    response: {type: object, properties: {affected: {type: boolean}, views: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.k: "= input.keyspace + '.' + input.table"
      - set:
          vars.views: "= vars.k in state.views_by_base_table ? state.views_by_base_table[vars.k] : []"
      - return: {affected: "= size(vars.views) > 0", views: "= vars.views"}

  - component: view-manager
    name: acquire-lock-for
    kind: function
    summary: tryLock on a striped lock (concurrent_materialized_view_writes x 1024 stripes); null when contended.
    sources:
      - src/java/org/apache/cassandra/db/view/ViewManager.java:198-206
      - src/java/org/apache/cassandra/db/view/ViewManager.java:60
    request: {type: object, properties: {lock_key: {type: string}}}
    response: {type: object, properties: {acquired: {type: boolean}}}
    errors:
      - {code: lock-contended, retryable: true, summary: tryLock returned false}
    behavior:
      - choice: lock
        default: acquired
        options:
          acquired:
            - return: {acquired: true}
          contended:
            - fail: {code: lock-contended, retryable: true, message: "= 'view lock held for ' + input.lock_key"}

  - component: table-views
    name: push-view-replica-updates
    kind: function
    summary: Read the existing base rows, generate view mutations, and send them through StorageProxy.mutateMV.
    description: The model keeps the base partition key for the view row; the real view key is derived from the view's primary key.
    sources:
      - src/java/org/apache/cassandra/db/view/TableViews.java:136-171
    request:
      type: object
      required: [mutation, views]
      properties:
        mutation: {$ref: WritePathMutation}
        write_commit_log: {type: boolean, default: true}
        views: {type: array, items: {type: string}, examples: [[users_by_city]]}
    response: {type: object, properties: {view_mutations: {type: integer}}}
    behavior:
      - title: Read the existing rows the update touches (local read)
        source: src/java/org/apache/cassandra/db/view/TableViews.java:151-164
        call: single-partition-read-command.execute-locally
        input:
          read_command:
            keyspace: "= input.mutation.keyspace"
            table: "= input.mutation.table"
            partition_key: "= input.mutation.partition_key"
            token: "= input.mutation.token"
            columns: "= input.mutation.columns.map(k, k)"
            limit: 1
            digest: false
      - title: ViewUpdateGenerator builds one mutation per affected view (generateViewUpdates)
        source: src/java/org/apache/cassandra/db/view/TableViews.java:189-200
        set:
          vars.vm: "= input.views.map(v, {'keyspace': input.mutation.keyspace, 'table': v, 'partition_key': input.mutation.partition_key, 'token': input.mutation.token, 'timestamp': input.mutation.timestamp, 'columns': input.mutation.columns})"
      - when: "size(vars.vm) > 0"
        title: Send the view mutations to their paired view replicas
        source: src/java/org/apache/cassandra/db/view/TableViews.java:169-170
        call: storage-proxy.mutate-mv
        input:
          partition_key: "= input.mutation.partition_key"
          mutations: "= vars.vm"
          write_commit_log: "= has(input.write_commit_log) ? input.write_commit_log : true"
      - return: {view_mutations: "= size(vars.vm)"}

  - component: view
    name: build
    kind: function
    summary: Stop any current builder and start a new ViewBuilder (on view creation, schema reload, or after truncate).
    sources: [src/java/org/apache/cassandra/db/view/View.java:206-215]
    request:
      type: object
      required: [keyspace, view, base_table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        view: {type: string, examples: [users_by_city]}
        base_table: {type: string, examples: [users]}
    response: {type: object, properties: {built: {type: boolean}, already_built: {type: boolean}, stopped: {type: boolean}, keys_built: {type: integer}}}
    behavior:
      - call: view-builder.start
        input: "= input"
        as: b
      - return: "= vars.b.value"

  - component: view-builder
    name: start
    kind: function
    summary: Skip a view already marked built (only re-publishing its distributed status); otherwise record the build start, flush the base table and build.
    sources: [src/java/org/apache/cassandra/db/view/ViewBuilder.java:84-108]
    request:
      type: object
      required: [keyspace, view, base_table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        view: {type: string, examples: [users_by_city]}
        base_table: {type: string, examples: [users]}
    response: {type: object, properties: {built: {type: boolean}, already_built: {type: boolean}, stopped: {type: boolean}, keys_built: {type: integer}}}
    behavior:
      - set: {vars.k: "= input.keyspace + '.' + input.view"}
      - call: view-builder.built-views-get
        input: {key: "= vars.k"}
        as: st
        on_error: continue
      - if: "vars.st.ok && vars.st.value.built"
        then:
          - set: {ctx.viewBuild: already-built}
          - when: "!vars.st.value.replicated"
            title: Built locally but not yet replicated - update system_distributed status
            source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:89-90
            call: view-builder.update-distributed
            input: {keyspace: "= input.keyspace", view: "= input.view"}
          - title: View already marked built
            source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:86-91
            return: {built: true, already_built: true, stopped: false, keys_built: 0}
      - title: Record the build start in system_distributed.view_build_status
        source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:94
      - title: Flush the base table (VIEW_BUILD_STARTED) so the build reads sstables only
        source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:96-98
        call: column-family-store.force-blocking-flush
        input: {keyspace: "= input.keyspace", table: "= input.base_table", reason: VIEW_BUILD_STARTED}
      - call: view-builder.build
        input: {keyspace: "= input.keyspace", view: "= input.view", base_table: "= input.base_table"}
        as: b
      - return: "= vars.b.value"

  - component: view-builder
    name: build
    kind: function
    summary: Split the unbuilt local ranges into tasks on the compaction executor; on success mark the view built, on failure retry in 5 minutes (or stop if interrupted).
    sources:
      - src/java/org/apache/cassandra/db/view/ViewBuilder.java:130-204
      - src/java/org/apache/cassandra/db/view/ViewBuilder.java:206-211
    request:
      type: object
      required: [keyspace, view, base_table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        view: {type: string, examples: [users_by_city]}
        base_table: {type: string, examples: [users]}
        ranges: {type: array, items: {type: string}, default: ["(-9223372036854775808,0]", "(0,9223372036854775807]"]}
        keys: {type: array, items: {type: string}, default: ["user:42", "user:43"]}
    response: {type: object, properties: {built: {type: boolean}, already_built: {type: boolean}, stopped: {type: boolean}, keys_built: {type: integer}}}
    behavior:
      - set:
          vars.k: "= input.keyspace + '.' + input.view"
          vars.ranges: "= has(input.ranges) ? input.ranges : ['(-9223372036854775808,0]', '(0,9223372036854775807]']"
          vars.keys: "= has(input.keys) ? input.keys : ['user:42', 'user:43']"
          vars.failure: ""
          vars.keys_built: 0
      - title: Local ranges not yet built, split into NUM_TASKS ranges
        source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:138-160
      - title: Submit one ViewBuilderTask per range and wait for all of them (FutureCombiner.allOf); the view build executor runs them concurrent_materialized_view_builders (1) at a time
        source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:164-177
        parallel: "= vars.ranges"
        as: r
        join: {need: all}
        as_result: tasks
        steps:
          - call: compaction-manager.submit-view-builder
            input: {keyspace: "= input.keyspace", view: "= input.view", range: "= vars.r"}
          - call: view-builder-task.call
            input: {keyspace: "= input.keyspace", view: "= input.view", base_table: "= input.base_table", range: "= vars.r", keys: "= vars.keys"}
            as: t
            on_error:
              - return: {failure: "= error.code", keys: 0}
          - return: {failure: "", keys: "= vars.t.value.keys_built"}
      - set:
          vars.failures: "= vars.tasks.results.map(x, x.value.failure).filter(f, f != '')"
          vars.keys_built: "= sum(vars.tasks.results.map(x, x.value.keys))"
      - set:
          vars.failure: "= size(vars.failures) > 0 ? (vars.failures.exists(f, f == 'compaction-interrupted') ? 'compaction-interrupted' : vars.failures[0]) : ''"
      - if: "vars.failure == 'compaction-interrupted'"
        then:
          - set: {ctx.viewBuild: stopped}
          - title: Interrupted by a compaction stop - stop the build
            source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:190-195
            return: {built: false, already_built: false, stopped: true, keys_built: "= vars.keys_built"}
      - if: "vars.failure != ''"
        then:
          - set: {ctx.viewBuild: retry-scheduled, ctx.viewBuildRetryInMs: 300000}
          - title: Materialized View failed to complete, sleeping 5 minutes before restarting
            source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:196-200
            return: {built: false, already_built: false, stopped: false, keys_built: "= vars.keys_built"}
      - set: {ctx.viewBuild: built}
      - title: All ranges built - mark the view built (finishViewBuildStatus) and publish it
        source: src/java/org/apache/cassandra/db/view/ViewBuilder.java:206-211
        call: view-builder.built-views-put
        input: {key: "= vars.k", row: {built: true, replicated: false}}
      - call: view-builder.update-distributed
        input: {keyspace: "= input.keyspace", view: "= input.view"}
      - return: {built: true, already_built: false, stopped: false, keys_built: "= vars.keys_built"}

  - component: view-builder
    name: update-distributed
    kind: function
    summary: Record the successful build in system_distributed and mark it replicated (retried in 5 minutes on failure).
    sources: [src/java/org/apache/cassandra/db/view/ViewBuilder.java:213-225]
    request: {type: object, required: [keyspace, view], properties: {keyspace: {type: string}, view: {type: string}}}
    behavior:
      - call: view-builder.built-views-put
        input: {key: "= input.keyspace + '.' + input.view", row: {built: true, replicated: true}}

  - {component: view-builder, name: built-views-get, kind: store, summary: "View build status (system.built_views and its replicated flag).", sources: [src/java/org/apache/cassandra/db/view/ViewBuilder.java:86-89], request: {type: object, properties: {key: {type: string}}}, errors: [{code: not_found, status: 404}], store: {table: built_views, op: get, key: "= input.key"}}
  - {component: view-builder, name: built-views-put, kind: store, summary: "Write the view build status.", sources: [src/java/org/apache/cassandra/db/view/ViewBuilder.java:209-218], request: {type: object, properties: {key: {type: string}, row: {type: object}}}, store: {table: built_views, op: put, key: "= input.key", value: "= input.row"}}

  - component: view-builder-task
    name: call
    kind: task
    summary: Wait up to 10s for schema agreement, then for each base key in the range read it and send the generated view mutations; checkpoint progress.
    sources:
      - src/java/org/apache/cassandra/db/view/ViewBuilderTask.java:121-195
      - src/java/org/apache/cassandra/db/view/ViewBuilderTask.java:92-119
    request:
      type: object
      required: [keyspace, view, base_table, range, keys]
      properties:
        keyspace: {type: string}
        view: {type: string}
        base_table: {type: string}
        range: {type: string}
        keys: {type: array, items: {type: string}}
    response: {type: object, properties: {keys_built: {type: integer}}}
    errors:
      - {code: compaction-interrupted, summary: StoppedException when interrupted by a compaction stop}
    behavior:
      - title: Wait for schema agreement so peers know the view table
        source: src/java/org/apache/cassandra/db/view/ViewBuilderTask.java:135-137
        call: gossiper.wait-for-schema-agreement
        input: {max_wait_ms: 10000}
        as: sa
      - when: "!vars.sa.value.agreed"
        title: Failed to get schema to converge - build anyway
        source: src/java/org/apache/cassandra/db/view/ViewBuilderTask.java:136-137
        set: {ctx.viewSchemaConverged: false}
      - foreach: "= input.keys"
        as: key
        steps:
          - title: buildKey - read the base partition and send its view mutations
            source: src/java/org/apache/cassandra/db/view/ViewBuilderTask.java:103-117
            call: storage-proxy.mutate-mv
            input:
              partition_key: "= vars.key"
              mutations:
                - keyspace: "= input.keyspace"
                  table: "= input.view"
                  partition_key: "= vars.key"
                  token: 0
                  timestamp: "= now * 1000"
                  columns: {}
              write_commit_log: true
      - title: Save the completed range status (updateViewBuildStatus with range.right)
        source: src/java/org/apache/cassandra/db/view/ViewBuilderTask.java:178-185
      - return: {keys_built: "= size(input.keys)"}

  # ====================================================================== reconciliation: owned operations other areas call
  - component: column-family-store
    name: add-sstables
    kind: function
    summary: Add sstables (streamed or imported) to the live set, then submit background compaction.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1679-1683]
    request:
      type: object
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        files: {type: integer, default: 1}
        pending_repair: {type: string, default: "", description: "The incremental repair session the sstables were written pending (streamed in during incremental repair, CassandraStreamReader.java:105,135); empty for none"}
    response: {type: object, properties: {}}
    behavior:
      - title: data.addSSTables - the Tracker publishes the new sstables to readers
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1681
        call: column-family-store.live-sstables-incr
        input:
          key: "= input.keyspace + '.' + input.table"
          delta: "= has(input.files) ? input.files : 1"
      - call: column-family-store.add-to-tracker
        input: {keyspace: "= input.keyspace", table: "= input.table", sstable_id: "= 'added-' + string(now)", size_mb: 1, pending_repair: "= has(input.pending_repair) ? input.pending_repair : ''"}
      - title: CompactionManager.submitBackground (read-path)
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1682
        call: compaction-manager.submit-background
        input: {keyspace: "= input.keyspace", table: "= input.table"}

  - component: column-family-store
    name: import-new-sstables
    kind: jmx
    attributes: {mbean: "org.apache.cassandra.db:type=Tables", operation: importNewSSTables}
    summary: "ColumnFamilyStoreMBean.importNewSSTables (nodetool import): SSTableImporter verifies each source directory, copies or moves the sstables in, builds SSTable-attached indexes and adds them; returns the directories that failed."
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:865-910
      - src/java/org/apache/cassandra/db/ColumnFamilyStoreMBean.java:191-197
      - src/java/org/apache/cassandra/db/SSTableImporter.java:77-244
    request:
      type: object
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        src_paths: {type: array, items: {type: string}, default: [/tmp/import/ks1/users]}
    response:
      type: object
      properties:
        failed_directories: {type: array, items: {type: string}, default: []}
    behavior:
      - set:
          vars.paths: "= has(input.src_paths) ? input.src_paths : ['/tmp/import/ks1/users']"
          vars.failed: []
      - foreach: "= vars.paths"
        as: dir
        steps:
          - choice: verification
            default: passes
            options:
              passes:
                - title: Verify sstables and tokens, then move them into the data directories
                  source: src/java/org/apache/cassandra/db/SSTableImporter.java:89-135
              fails:
                - title: Verification failed - the directory is recorded as failed and skipped
                  source: src/java/org/apache/cassandra/db/SSTableImporter.java:137-150
                  set: {vars.failed: "= vars.failed + [vars.dir]"}
      - set: {ctx.importFailedDirectories: "= vars.failed"}
      - when: "size(vars.failed) < size(vars.paths)"
        title: Build missing SSTable-attached indexes, then add the new sstables to the Tracker
        source: src/java/org/apache/cassandra/db/SSTableImporter.java:224-230
        call: column-family-store.add-sstables
        input: {keyspace: "= input.keyspace", table: "= input.table", files: "= size(vars.paths) - size(vars.failed)"}
      - return: {failed_directories: "= vars.failed"}

  - component: column-family-store
    name: load-new-sstables
    kind: jmx
    attributes: {mbean: "org.apache.cassandra.db:type=Tables", operation: loadNewSSTables}
    summary: "ColumnFamilyStoreMBean.loadNewSSTables (deprecated nodetool refresh): import whatever new sstables sit in the table's own data directories, resetting their level."
    sources:
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:849-863
      - src/java/org/apache/cassandra/db/ColumnFamilyStoreMBean.java:253
    request:
      type: object
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
    response: {type: object, properties: {}}
    behavior:
      - title: SSTableImporter with resetLevel(true) over the table's own directories
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:860-862
        call: column-family-store.add-sstables
        input: {keyspace: "= input.keyspace", table: "= input.table", files: 1}

  - component: column-family-store
    name: on-paxos-repair-complete
    kind: function
    summary: Record that the ranges are Paxos-repaired up to a ballot (the table's Paxos repair history).
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1960-1963]
    request:
      type: object
      properties:
        table_id: {type: string, examples: [bank.accounts]}
        ranges: {type: array, items: {type: string}, examples: [["(-9223372036854775808,0]"]]}
        low_bound: {type: integer, examples: [1767225600000000]}
    response: {type: object, properties: {}}
    behavior:
      - call: column-family-store.paxos-repair-history-put
        input:
          key: "= has(input.table_id) ? input.table_id : 'unknown'"
          row: {ranges: "= has(input.ranges) ? input.ranges : []", low_bound: "= has(input.low_bound) ? input.low_bound : 0"}

  - component: column-family-store
    name: sync-paxos-repair-history
    kind: function
    summary: Merge a received Paxos repair history into this table's history (optionally flushing it).
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1955-1958]
    request:
      type: object
      properties:
        table_id: {type: string, examples: [bank.accounts]}
        history: {type: object, examples: [{}]}
    response: {type: object, properties: {}}
    behavior:
      - call: column-family-store.paxos-repair-history-put
        input:
          key: "= has(input.table_id) ? input.table_id : 'unknown'"
          row: {history: "= has(input.history) ? input.history : {}"}

  - {component: column-family-store, name: paxos-repair-history-put, kind: store, summary: "Paxos repair history per table (PaxosRepairHistory in system.paxos_repair_history).", sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1945-1963], request: {type: object, properties: {key: {type: string}, row: {type: object}}}, store: {table: paxos_repair_history, op: put, key: "= input.key", value: "= input.row"}}

  - component: column-family-store
    name: reload
    kind: function
    summary: Apply altered table metadata - compaction thresholds and crc_check_chance (unless changed at runtime), compaction strategy params, indexes, memtable switch on schema change.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:382-405]
    request:
      type: object
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
    response: {type: object, properties: {}}
    behavior:
      - title: Refresh runtime settings, compaction strategy params and indexes from the new metadata
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:386-400
      - title: Switch the memtable when the comparator or memtable factory changed (FlushReason.SCHEMA_CHANGE)
        source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:135-137

  - component: commit-log
    name: start
    kind: function
    summary: Start the segment manager (first segment and the COMMIT-LOG-ALLOCATOR thread) and the sync service thread.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:137-156]
    request: {type: object, properties: {}}
    response: {type: object, properties: {}}
    behavior:
      - title: segmentManager.start - builder, allocator thread, first allocating segment
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:150-161
      - title: executor.start - the sync thread (commitlog_sync periodic)
        source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:148-156

  - component: keyspace
    name: open
    kind: function
    summary: Keyspace.open - return the Keyspace instance, creating it (and a ColumnFamilyStore per table) on first use.
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:148-163]
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}}}
    response: {type: object, properties: {keyspace: {type: string}}}
    behavior:
      - when: "has(input.keyspace) && !(input.keyspace in state.durable_writes)"
        title: Schema.maybeAddKeyspaceInstance - construct the Keyspace (durable_writes from its params) and init each table's store
        source: src/java/org/apache/cassandra/db/Keyspace.java:160-163
        set:
          state.durable_writes: "= merge(state.durable_writes, {input.keyspace: true})"
      - return: {keyspace: "= has(input.keyspace) ? input.keyspace : ''"}

  - component: keyspace
    name: init-cf
    kind: function
    summary: Keyspace.initCf - create a table's ColumnFamilyStore, or reload it if it already exists.
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:446-470]
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}, table: {type: string, examples: [users]}}}
    response: {type: object, properties: {created: {type: boolean}}}
    behavior:
      - if: "has(input.keyspace) && has(input.table) && (input.keyspace + '.' + input.table) in state.tables"
        then:
          - title: Existing store - reload it
            source: src/java/org/apache/cassandra/db/Keyspace.java:463-469
            call: column-family-store.reload
            input: {keyspace: "= input.keyspace", table: "= input.table"}
          - return: {created: false}
      - title: New table - ColumnFamilyStore.createColumnFamilyStore (creates directories, loads sstables) and registers it
        source: src/java/org/apache/cassandra/db/Keyspace.java:453-462
        set:
          state.tables: "= merge(state.tables, {input.keyspace + '.' + input.table: {'cdc': false, 'skip_commitlog': false}})"
      - return: {created: true}

  - component: keyspace
    name: drop-cf
    kind: function
    summary: Keyspace.dropCf - unregister the table's store, then unload it (flush when durable) and invalidate it, deleting data when asked.
    sources:
      - src/java/org/apache/cassandra/db/Keyspace.java:389-401
      - src/java/org/apache/cassandra/db/Keyspace.java:411-416
      - src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2848-2854
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}, table: {type: string, examples: [users]}, drop_data: {type: boolean, default: true}}}
    response: {type: object, properties: {}}
    behavior:
      - title: unloadCf - durable tables flush (FlushReason.DROP) to clear their commit log dirty regions
        source: src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2850-2853
        call: column-family-store.force-blocking-flush
        input: {keyspace: "= has(input.keyspace) ? input.keyspace : 'ks1'", table: "= has(input.table) ? input.table : 'users'", reason: DROP}
      - title: invalidate(expectMBean, dropData) - the store is removed from the keyspace and its sstables deleted when dropData
        source: src/java/org/apache/cassandra/db/Keyspace.java:392-415
        set:
          state.tables: "= has(input.keyspace) && has(input.table) ? omit(state.tables, input.keyspace + '.' + input.table) : state.tables"

  - component: keyspace
    name: unload
    kind: function
    summary: Keyspace.unload - unload every table of a dropped keyspace and release its metrics.
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:400-408]
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}, drop_data: {type: boolean, default: true}}}
    response: {type: object, properties: {}}
    behavior:
      - set:
          vars.ks: "= has(input.keyspace) ? input.keyspace : ''"
      - foreach: "= state.tables.filter(k, k.startsWith(vars.ks + '.'))"
        as: tk
        steps:
          - title: unloadCf for each table
            source: src/java/org/apache/cassandra/db/Keyspace.java:405-406
            call: column-family-store.force-blocking-flush
            input: {keyspace: "= vars.ks", table: "= vars.tk.split('.')[1]", reason: DROP}
      - title: The Keyspace instance and its stores are released
        source: src/java/org/apache/cassandra/db/Keyspace.java:407
        set:
          state.tables: "= state.tables.transformMap(k, v, !k.startsWith(vars.ks + '.'), v)"
          state.durable_writes: "= omit(state.durable_writes, vars.ks)"

  - component: keyspace
    name: get-column-family-stores
    kind: function
    summary: The tables of a keyspace (Keyspace.open(name).getColumnFamilyStores()).
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:210-213]
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}}}
    response: {type: object, properties: {tables: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.ks: "= has(input.keyspace) ? input.keyspace : ''"
      - return:
          tables: "= state.tables.filter(k, k.startsWith(vars.ks + '.')).map(k, k.split('.')[1])"

  - component: view-utils
    name: get-view-natural-endpoint
    kind: function
    summary: The view replica paired with this base replica - itself if it is a view replica, else the view replica at its index among the non-shared local-DC replicas; none during range movements.
    sources: [src/java/org/apache/cassandra/db/view/ViewUtils.java:60-104]
    request: {type: object, properties: {keyspace: {type: string}, base_token: {type: integer}, view_token: {type: integer}}}
    response: {type: object, properties: {endpoint: {type: string}}}
    behavior:
      - choice: pairing
        default: self
        options:
          self:
            - title: This node is also a view replica for the view token - pair with itself
              source: src/java/org/apache/cassandra/db/view/ViewUtils.java:66-68
              return: {endpoint: "= self"}
          remote:
            - title: Pair with the view replica at this node's index among base-only replicas (local DC); the model names another node
              source: src/java/org/apache/cassandra/db/view/ViewUtils.java:75-103
              return: {endpoint: "= self == 'n2' ? 'n3' : 'n2'"}
          none:
            - title: This node is not a base replica of the key (range movement) - empty
              source: src/java/org/apache/cassandra/db/view/ViewUtils.java:99-101
              return: {endpoint: ""}

  - component: snapshot-manager
    name: add-snapshot
    kind: store
    attributes: {boundary: true, owner: repair-streaming}
    summary: "StorageService.addSnapshot -> SnapshotManager.addSnapshot."
    sources:
      - src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:102-110
      - src/java/org/apache/cassandra/service/StorageService.java:7269-7271
    request:
      type: object
      properties:
        key: {type: string}
        row:
          type: object
          properties:
            keyspace: {type: string}
            table: {type: string}
            tag: {type: string}
            created_at: {type: integer}
            expires_at: {type: integer}
            ephemeral: {type: boolean}
    store: {table: snapshots, op: put, key: "= input.key", value: "= input.row"}

  # ====================================================================== boundary stubs
  - component: storage-proxy
    name: apply-counter-mutation-on-leader
    kind: function
    attributes: {boundary: true, owner: coordination}
    summary: The leader applies the counter mutation and replicates the result (performWrite with counterWritePerformer).
    sources: [src/java/org/apache/cassandra/service/StorageProxy.java:1806-1810]
    request:
      type: object
      required: [counter_mutation]
      properties:
        counter_mutation: {$ref: WritePathCounterMutation}
        local_dc: {type: string, examples: [dc1]}
    response: {type: object}
  - component: storage-proxy
    name: mutate-mv
    kind: function
    attributes: {boundary: true, owner: coordination}
    summary: Send view mutations to the paired view replicas (local apply when paired with itself, batchlog otherwise).
    sources: [src/java/org/apache/cassandra/service/StorageProxy.java:1010-1113]
    request:
      type: object
      required: [partition_key, mutations]
      properties:
        partition_key: {type: string}
        mutations: {type: array, items: {$ref: WritePathMutation}}
        write_commit_log: {type: boolean}
  - component: storage-service
    name: is-endpoint-valid-for-write
    kind: function
    attributes: {boundary: true, owner: membership}
    summary: Is the token in this node's natural or pending ranges for the keyspace?
    sources: [src/java/org/apache/cassandra/service/StorageService.java:5209-5213]
    request:
      type: object
      required: [keyspace, token]
      properties:
        keyspace: {type: string}
        token: {type: integer}
    response:
      type: object
      properties:
        valid: {type: boolean, default: true}
  - component: gossiper
    name: wait-for-schema-agreement
    kind: function
    attributes: {boundary: true, owner: membership}
    summary: Wait until all live nodes report the same schema version, up to a timeout.
    sources: [src/java/org/apache/cassandra/gms/Gossiper.java:2519]
    request: {type: object, properties: {max_wait_ms: {type: integer}}}
    response: {type: object, properties: {agreed: {type: boolean, default: true}}}
  - component: single-partition-read-command
    name: query-memtable-and-disk
    kind: function
    attributes: {boundary: true, owner: read-path}
    summary: Local read of one partition over memtables and sstables (no read repair, no coordinator).
    sources: [src/java/org/apache/cassandra/db/SinglePartitionReadCommand.java:658]
    request:
      type: object
      required: [read_command]
      properties:
        read_command:
          type: object
          required: [keyspace, table, partition_key]
          properties:
            keyspace: {type: string}
            table: {type: string}
            partition_key: {type: string}
            token: {type: integer}
            columns: {type: array, items: {type: string}}
            limit: {type: integer}
            digest: {type: boolean}
    response: {type: object}
  - component: single-partition-read-command
    name: execute-locally
    kind: function
    attributes: {boundary: true, owner: read-path}
    summary: Execute a read command against the local node.
    sources: [src/java/org/apache/cassandra/db/ReadCommand.java:426]
    request:
      type: object
      required: [read_command]
      properties:
        read_command:
          type: object
          required: [keyspace, table, partition_key]
          properties:
            keyspace: {type: string}
            table: {type: string}
            partition_key: {type: string}
            token: {type: integer}
            columns: {type: array, items: {type: string}}
            limit: {type: integer}
            digest: {type: boolean}
    response: {type: object}
  - component: secondary-index-manager
    name: truncate-all-indexes-blocking
    kind: function
    attributes: {boundary: true, owner: read-path}
    summary: Truncate every index of the table.
    sources: [src/java/org/apache/cassandra/index/SecondaryIndexManager.java:907]
    request: {type: object, properties: {truncated_at: {type: integer}}}
  - component: compaction-manager
    name: submit-background
    kind: function
    attributes: {boundary: true, owner: read-path}
    summary: Submit a background compaction check for a table.
    sources: [src/java/org/apache/cassandra/db/compaction/CompactionManager.java:230-263]
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}}}
    response: {type: object, properties: {submitted: {type: integer}, reason: {type: string}}}
  - component: tracker
    name: add-sstables
    kind: function
    attributes: {boundary: true, owner: read-path}
    summary: "Tracker.addSSTables: make newly flushed (or loaded) sstables live in the View."
    sources: [src/java/org/apache/cassandra/db/lifecycle/Tracker.java:252-270]
    request:
      type: object
      required: [keyspace, table, sstables]
      properties:
        keyspace: {type: string}
        table: {type: string}
        sstables: {type: array, items: {type: object}}
  - component: compaction-manager
    name: submit-view-builder
    kind: function
    attributes: {boundary: true, owner: read-path}
    summary: Run a ViewBuilderTask on the compaction executor (concurrent_materialized_view_builders = 1).
    sources: [src/java/org/apache/cassandra/db/compaction/CompactionManager.java:1986-1989]
    request: {type: object, properties: {keyspace: {type: string}, view: {type: string}, range: {type: string}}}
  - component: active-repair-service
    name: abort
    kind: function
    attributes: {boundary: true, owner: repair-streaming}
    summary: Abort parent repair sessions matching a predicate.
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:1095]
    request: {type: object, properties: {table: {type: string}, message: {type: string}}}

  # shared disks
  - {component: commitlog-disk, name: segment-create, kind: io, attributes: {boundary: true, owner: shared}, summary: "Create and map a new commit log segment file.", sources: [src/java/org/apache/cassandra/db/commitlog/MemoryMappedSegment.java:40-70], request: {type: object, properties: {size_bytes: {type: integer}}}, latency_ms: {min: 1, max: 5}}
  - {component: commitlog-disk, name: segment-append, kind: io, attributes: {boundary: true, owner: shared}, summary: "Write an entry into the mapped segment buffer (no fsync).", sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:313-334], request: {type: object, properties: {segment_id: {type: integer}, position: {type: integer}, size: {type: integer}}}}
  - {component: commitlog-disk, name: segment-sync, kind: io, attributes: {boundary: true, owner: shared}, summary: "Force the mapped segment to disk (msync).", sources: [src/java/org/apache/cassandra/db/commitlog/MemoryMappedSegment.java:89-110], request: {type: object, properties: {flush: {type: boolean}}}, latency_ms: {min: 1, max: 10}}
  - {component: commitlog-disk, name: segment-read, kind: io, attributes: {boundary: true, owner: shared}, summary: "Read a segment file during replay.", sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogReader.java:178], request: {type: object, properties: {name: {type: string}}}, latency_ms: {min: 1, max: 20}}
  - {component: commitlog-disk, name: segment-delete, kind: io, attributes: {boundary: true, owner: shared}, summary: "Delete a segment file.", sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegmentManagerStandard.java:33-35], request: {type: object, properties: {name: {type: string}}}}
  - {component: data-disk, name: sstable-write, kind: io, attributes: {boundary: true, owner: shared}, summary: "Write a flushed sstable (data, index, filter, stats components).", sources: [src/java/org/apache/cassandra/db/memtable/Flushing.java:171], request: {type: object, properties: {keyspace: {type: string}, table: {type: string}, replica: {type: string}, partitions: {type: integer}}}, latency_ms: {min: 5, max: 50}}
  - {component: data-disk, name: snapshot-create, kind: io, attributes: {boundary: true, owner: shared}, summary: "Hard-link live sstables into a snapshot directory.", sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2137-2160], request: {type: object, properties: {keyspace: {type: string}, table: {type: string}, snapshot_name: {type: string}}}, latency_ms: {min: 1, max: 10}}

flows:
  - id: replica-mutation-verb
    name: Replica applies MUTATION_REQ
    description: The coordinator (n1) sends MUTATION_REQ to replica n2, which validates, appends to the commit log, writes the memtable and replies. The request carries write_request_timeout as its deadline (the message's expiresAt).
    sources: [src/java/org/apache/cassandra/db/MutationVerbHandler.java:44-70]
    tags: [writes]
    entry:
      caller: messaging
      interface: mutation-verb-handler.do-verb
      on: n2
      deadline_ms: "= config['write-request-timeout-ms']"
      input:
        mutation: {keyspace: shop, table: users, partition_key: "user:42", token: 4242, timestamp: "= now * 1000", columns: {name: alice, city: paris}, serialized_size: 220}
  - id: replica-counter-mutation-verb
    name: Leader replica receives COUNTER_MUTATION_REQ
    sources: [src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java:36-54]
    entry:
      caller: messaging
      interface: counter-mutation-verb-handler.do-verb
      on: n2
      input:
        counter_mutation:
          consistency: QUORUM
          mutation: {keyspace: shop, table: page_views, partition_key: "page:7", token: 777, timestamp: "= now * 1000", columns: {views: 1}, serialized_size: 120}
  - id: counter-leader-apply
    name: Counter leader applies a CounterMutation
    sources: [src/java/org/apache/cassandra/db/CounterMutation.java:129-151]
    tags: [writes]
    entry:
      caller: coordination
      interface: counter-mutation.apply-counter-mutation
      input:
        consistency: QUORUM
        mutation: {keyspace: shop, table: page_views, partition_key: "page:7", token: 777, timestamp: "= now * 1000", columns: {views: 1}, serialized_size: 120}
  - id: coordinator-local-apply
    name: Coordinator applies locally as a replica (performLocally -> Mutation.apply)
    sources: [src/java/org/apache/cassandra/db/Mutation.java:266-270]
    tags: [writes]
    entry:
      caller: coordination
      interface: mutation.apply
      input:
        mutation: {keyspace: shop, table: users, partition_key: "user:42", token: 4242, timestamp: "= now * 1000", columns: {name: alice}, serialized_size: 220}
  - id: commitlog-periodic-sync
    name: Commit log sync thread (periodic, commitlog_sync_period 10000ms)
    description: Three wake-ups 5s apart; only the one 10s after the first has passed the sync period, so only it fsyncs.
    sources: [src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogService.java:148-225]
    tags: [writes]
    entry:
      caller: write-path
      interface: abstract-commit-log-service.sync-runnable-run
      repeat: {count: 3, interval_ms: 5000}
  - id: commitlog-segment-allocator
    name: COMMIT-LOG-ALLOCATOR prepares a reserve segment
    sources: [src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:150-238]
    tags: [writes]
    entry:
      caller: write-path
      interface: abstract-commit-log-segment-manager.allocator-runnable-run
  - id: commitlog-replay-startup
    name: Commit log replay at startup
    description: Replays the segment files in this node's commit log directory (commit-log segments_on_disk).
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:182-218]
    tags: [writes]
    entry:
      caller: cassandra-node
      interface: commit-log.recover-segments-on-disk
  - id: commitlog-jmx-recover
    name: CommitLogMBean.recover(path)
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:248-251]
    tags: [writes]
    entry:
      caller: operator
      interface: commit-log.recover
      input:
        path: /var/lib/cassandra/commitlog-restore/CommitLog-8-1730000000009.log
        segment:
          name: CommitLog-8-1730000000009.log
          entries:
            - {mutation: {keyspace: shop, table: users, partition_key: "user:50", token: 5050, timestamp: 1793318300000000, columns: {name: dave}}}
  - id: commitlog-jmx-cdc-block-writes
    name: CommitLogMBean.setCDCBlockWrites
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:459-470]
    tags: [writes]
    entry:
      caller: operator
      interface: commit-log.set-cdc-block-writes
      input: {value: false}
  - id: commitlog-jmx-cdc-on-repair
    name: CommitLogMBean.setCDCOnRepairEnabled
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:479-485]
    tags: [writes]
    entry:
      caller: operator
      interface: commit-log.set-cdc-on-repair-enabled
      input: {value: false}
  - id: memtable-force-flush
    name: Force-flush a table (nodetool flush, drain, commit log pressure)
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1065-1075]
    tags: [writes]
    entry:
      caller: node-ops
      interface: column-family-store.force-flush
      input: {keyspace: shop, table: users, reason: USER_FORCED}
  - id: memtable-period-flush
    name: memtable_flush_period_in_ms task
    sources: [src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:211-243]
    tags: [writes]
    entry:
      caller: write-path
      interface: abstract-allocator-memtable.schedule-flush
      input: {keyspace: shop, table: users, memtable_flush_period_in_ms: 0, memtable_age_ms: 0}
  - id: memtable-cleaner
    name: MemtableCleanerThread iteration
    sources: [src/java/org/apache/cassandra/utils/memory/MemtableCleanerThread.java:70-90]
    tags: [writes]
    entry:
      caller: write-path
      interface: memtable-cleaner-thread-clean.run
      input: {keyspace: shop, table: users}
  - id: replica-truncate-verb
    name: Replica applies TRUNCATE_REQ
    sources: [src/java/org/apache/cassandra/db/TruncateVerbHandler.java:34-46]
    tags: [writes]
    entry:
      caller: messaging
      interface: truncate-verb-handler.do-verb
      on: n2
      input: {keyspace: shop, table: users}
  - id: view-build
    name: Materialized view build
    sources: [src/java/org/apache/cassandra/db/view/ViewBuilder.java:84-204]
    tags: [writes]
    entry:
      caller: schema-auth
      interface: view.build
      input: {keyspace: shop, view: users_by_city, base_table: users}
  - id: cfs-import-new-sstables
    name: ColumnFamilyStoreMBean.importNewSSTables (nodetool import)
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:881-893]
    tags: [writes]
    entry:
      caller: operator
      interface: column-family-store.import-new-sstables
      input: {keyspace: shop, table: users, src_paths: [/tmp/import/a, /tmp/import/b]}
  - id: cfs-load-new-sstables
    name: ColumnFamilyStoreMBean.loadNewSSTables (nodetool refresh)
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:858-863]
    tags: [writes]
    entry:
      caller: operator
      interface: column-family-store.load-new-sstables
      input: {keyspace: shop, table: users}
  - id: table-snapshot
    name: Snapshot one table
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2375-2389]
    tags: [writes]
    entry:
      caller: repair-streaming
      interface: column-family-store.snapshot
      input: {keyspace: shop, table: users, snapshot_name: backup1}
  - id: schema-drop-table
    name: Schema drops a table (Keyspace.dropCf)
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:390-401]
    tags: [writes]
    entry:
      caller: schema-auth
      interface: keyspace.drop-cf
      input: {keyspace: shop, table: users, drop_data: true}

  - id: schema-init-table
    name: Schema creates or reloads a table's store (Keyspace.initCf)
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:449-470]
    tags: [writes]
    entry:
      caller: schema-auth
      interface: keyspace.init-cf
      input: {keyspace: shop, table: customers}
  - id: schema-open-keyspace
    name: Schema opens a keyspace (Keyspace.open)
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:148-163]
    tags: [writes]
    entry:
      caller: schema-auth
      interface: keyspace.open
      input: {keyspace: inventory}
  - id: schema-unload-keyspace
    name: Schema unloads a dropped keyspace (Keyspace.unload)
    sources: [src/java/org/apache/cassandra/db/Keyspace.java:403-408]
    tags: [writes]
    entry:
      caller: schema-auth
      interface: keyspace.unload
      input: {keyspace: ks1, drop_data: true}
  - id: view-pairing
    name: Pair a base replica with its view replica (ViewUtils.getViewNaturalEndpoint)
    sources: [src/java/org/apache/cassandra/db/view/ViewUtils.java:60-104]
    entry:
      caller: coordination
      interface: view-utils.get-view-natural-endpoint
      input: {keyspace: shop, base_token: 4242, view_token: 777}
  - id: paxos-repair-complete
    name: Record a completed Paxos repair on a table
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1960-1963]
    tags: [writes]
    entry:
      caller: paxos
      interface: column-family-store.on-paxos-repair-complete
      input: {table_id: shop.accounts, ranges: ["(-9223372036854775808,0]"], low_bound: 1793318400000000}
  - id: paxos-repair-history-sync
    name: Merge a received Paxos repair history
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:1955-1958]
    tags: [writes]
    entry:
      caller: paxos
      interface: column-family-store.sync-paxos-repair-history
      input: {table_id: shop.accounts, history: {"(-9223372036854775808,0]": 1793318400000000}}
  - id: commitlog-start
    name: CommitLog.start at daemon setup
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:140-156]
    entry:
      caller: cassandra-node
      interface: commit-log.start

scenarios:
  # ---------------------------------------------------------------- replica MUTATION_REQ (n1 coordinates, n2 applies)
  - id: wp-mutation-applied
    flow: replica-mutation-verb
    fixtures: [three-node-rf3]
    name: Happy path on n2 - commit log append, memtable write, MUTATION_RSP before any fsync (periodic)
    expect:
      - "result.ok && result.value.verb == 'MUTATION_RSP' && result.value.from == 'n2'"
      - "calls_by_instance['commit-log.add@n2'] == 1 && calls['commitlog-disk.segment-append'] == 1 && calls['commitlog-disk.segment-sync'] == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'commit-log.add')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'skip-list-memtable.put')[0].seq"
      - "state['skip-list-memtable@n2'].cells['shop.users:user:42:name'].value == 'alice' && state['skip-list-memtable@n2'].stats['shop.users'].partitions == 1"
      - "!('shop.users:user:42:name' in state['skip-list-memtable@n1'].cells)"
      - "size(state['commit-log@n2'].segments_on_disk['CommitLog-8-1.log'].entries) == 1"
  - id: wp-mutation-write-then-read
    fixtures: [three-node-rf3]
    name: A MUTATION_REQ applied on n2 is readable from n2's memtable, and only there
    steps:
      - {flow: replica-mutation-verb, as: w}
      - {interface: skip-list-memtable.cells-get, caller: read-path, on: n2, as: r, input: {key: "shop.users:user:42:city"}}
      - {interface: skip-list-memtable.cells-get, caller: read-path, on: n3, as: r3, input: {key: "shop.users:user:42:city"}}
    expect:
      - "state['commit-log@n2'].appended == 1 && state['commit-log@n3'].appended == 0"
      - "steps.w.result.ok && steps.r.result.ok && steps.r.result.value.value == 'paris'"
      - "!steps.r3.result.ok"
  - id: wp-mutation-expired-dropped
    flow: replica-mutation-verb
    fixtures: [three-node-rf3]
    name: A MUTATION_REQ that starts after its deadline (write_request_timeout) is dropped without a reply
    faults:
      - {target: mutation-verb-handler.do-verb, type: latency, latency_ms: 3000, instance: n2}
    expect:
      - "!result.ok && result.error.code in ['timeout', 'deadline_exceeded']"
      - "ctx.replicaOutcome == 'dropped' && !('shop.users:user:42:name' in state['skip-list-memtable@n2'].cells)"
