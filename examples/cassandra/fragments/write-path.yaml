    state: {abstract-commit-log-segment-manager: {available_segment: false}}
    config: {commit-failure-policy: ignore}
    faults:
      - {target: commitlog-disk.segment-create, type: error, code: io-error}
    expect:
      - "result.ok && result.value.created == false && duration_ms >= 1000"
      - "state['abstract-commit-log-segment-manager@n1'].available_segment == false"

  # ---------------------------------------------------------------- replay
  - id: wp-replay-skips-persisted
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: Replay re-applies unflushed entries only, without the commit log, then flushes and deletes the file
    state:
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            id: 1
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:42", token: 4242, timestamp: 1793318300000000, columns: {name: alice}}, already_persisted: true}
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}}
              - {mutation: {keyspace: shop, table: users, partition_key: "user:44", token: 4444, timestamp: 1793318300000002, columns: {name: carol}}}
    expect:
      - "result.ok && result.value.replayed == 2"
      - "calls['keyspace.apply'] == 2 && calls['commit-log.add'] == 0 && ctx.replaySkippedPersisted == true"
      - "calls['keyspace.flush'] == 1 && calls['flushing-flush-runnable.call'] >= 1 && calls['commitlog-disk.segment-delete'] == 1"
      - "state['tracker@n1'].views['shop.users'].sstables.exists(s, 'partitions' in s && 'user:43' in s.partitions && s.partitions['user:43'].cells.exists(c, c.column == 'name' && c.value == 'bob')) && size(state['commit-log@n1'].segments_on_disk) == 0"
  - id: wp-replay-no-files
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: No commit log files - skip replay
    expect:
      - "size(state['commit-log@n1'].segments_on_disk) == 0"
      - "result.ok && result.value.replayed == 0 && calls['commit-log-reader.read-commit-log-segment'] == 0"
  - id: wp-replay-torn-tail-tolerated
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: Corrupt entry in the last segment is tolerated (incomplete flush)
    state:
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}}
              - {mutation: {keyspace: shop, table: users, partition_key: "user:44", token: 4444, timestamp: 1793318300000002, columns: {name: carol}}, corrupt: true}
    expect:
      - "result.ok && result.value.replayed == 1 && ctx.replayErrorIgnored == 'permissible'"
      - "!('shop.users:user:44:name' in state['skip-list-memtable@n1'].cells)"
  - id: wp-replay-corrupt-stops-startup
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: Corrupt entry in a non-final segment with policy stop - CommitLogReplayException
    state:
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}, corrupt: true}
          CommitLog-8-2.log:
            name: CommitLog-8-2.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:44", token: 4444, timestamp: 1793318300000002, columns: {name: carol}}}
    expect:
      - "!result.ok && result.error.code == 'commit-log-replay-exception' && ctx.replayStopped == true"
      - "calls['commitlog-disk.segment-delete'] == 0 && size(state['commit-log@n1'].segments_on_disk) == 2"
  - id: wp-replay-corrupt-ignore-policy
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: Same corruption with commit_failure_policy ignore - skip the entry and continue
    config: {commit-failure-policy: ignore}
    state:
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}, corrupt: true}
          CommitLog-8-2.log:
            name: CommitLog-8-2.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:44", token: 4444, timestamp: 1793318300000002, columns: {name: carol}}}
    expect:
      - "result.ok && result.value.replayed == 1 && ctx.replayErrorIgnored == 'policy'"
      - "state['tracker@n1'].views['shop.users'].sstables.exists(s, 'partitions' in s && 'user:44' in s.partitions && s.partitions['user:44'].cells.exists(c, c.column == 'name' && c.value == 'carol'))"
  - id: wp-replay-bad-descriptor-last-segment
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: Unreadable descriptor in the last segment is permissible
    state:
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            header_corrupt: true
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}}
    expect:
      - "size(state['commit-log@n1'].segments_on_disk) == 0"
      - "result.ok && result.value.replayed == 0 && ctx.replayErrorIgnored == 'permissible'"
  - id: wp-write-flush-then-replay
    fixtures: [one-node]
    name: A write lands in the commit log; after a flush marks it persisted, a replay skips it
    steps:
      - {flow: coordinator-local-apply, as: w}
      - {flow: memtable-force-flush, as: f}
      - {flow: commitlog-replay-startup, as: rp}
    expect:
      - "steps.w.result.ok && steps.f.result.value.flushed == true"
      - "steps.rp.result.ok && steps.rp.result.value.replayed == 0 && ctx.replaySkippedPersisted == true"
      - "size(state['commit-log@n1'].segments_on_disk) == 0"
  - id: wp-write-then-replay
    fixtures: [one-node]
    name: An unflushed write is replayed from the commit log at the next startup and is readable
    steps:
      - {flow: coordinator-local-apply, as: w}
      - {flow: commitlog-replay-startup, as: rp}
      - {interface: single-partition-read-command.query-memtable-and-disk, caller: read-path, as: r, input: {read_command: {keyspace: shop, table: users, partition_key: "user:42", token: 4242, kind: single_partition, limit: 100}}}
    expect:
      - "steps.rp.result.value.replayed == 1 && steps.r.result.value.partitions[0].cells.exists(c, c.column == 'name' && c.value == 'alice')"
      - "size(state['commit-log@n1'].segments_on_disk) == 0"

  - id: wp-jmx-recover
    flow: commitlog-jmx-recover
    fixtures: [one-node]
    name: CommitLogMBean.recover replays one file
    expect:
      - "result.ok && result.value.replayed == 1 && calls['keyspace.apply'] == 1 && calls['commit-log.add'] == 0"
      - "state['tracker@n1'].views['shop.users'].sstables.exists(s, 'partitions' in s && 'user:50' in s.partitions && s.partitions['user:50'].cells.exists(c, c.column == 'name' && c.value == 'dave'))"
  - id: wp-jmx-recover-then-read
    fixtures: [one-node]
    name: A recovered file's data is readable
    steps:
      - {flow: commitlog-jmx-recover, as: rc}
      - {interface: single-partition-read-command.query-memtable-and-disk, caller: read-path, as: r, input: {read_command: {keyspace: shop, table: users, partition_key: "user:50", token: 5050, kind: single_partition, limit: 100}}}
    expect:
      - "state['commit-log@n1'].appended == 0"
      - "steps.rc.result.ok && steps.r.result.value.partitions[0].cells.exists(c, c.column == 'name' && c.value == 'dave')"
  - id: wp-jmx-cdc-block-writes-disabled
    flow: commitlog-jmx-cdc-block-writes
    fixtures: [one-node]
    name: setCDCBlockWrites with cdc_enabled false - IllegalStateException
    expect:
      - "!result.ok && result.error.code == 'illegal-state' && !('cdc_block_writes' in state['commit-log@n1'])"
  - id: wp-jmx-cdc-block-writes-permits
    flow: commitlog-jmx-cdc-block-writes
    fixtures: [one-node]
    name: Turning cdc block_writes off re-permits a FORBIDDEN segment
    config: {cdc-enabled: true}
    state: {commit-log-segment: {cdc_state: FORBIDDEN}}
    expect:
      - "result.ok && result.value.old_value == true && state['commit-log@n1'].cdc_block_writes == false"
      - "state['commit-log-segment@n1'].cdc_state == 'PERMITTED'"
  - id: wp-jmx-cdc-block-writes-then-write
    fixtures: [one-node]
    name: After block_writes is turned off, a CDC write over the cdc_raw limit is accepted
    config: {cdc-enabled: true}
    state:
      keyspace: {tables: {shop.users: {cdc: true}}}
      commit-log-segment: {cdc_state: FORBIDDEN}
      commit-log-segment-manager-cdc: {cdc_size_in_progress_bytes: 4294967296}
    steps:
      - {flow: commitlog-jmx-cdc-block-writes, as: j}
      - {interface: commit-log.get-cdc-block-writes, caller: operator, as: g}
      - {flow: coordinator-local-apply, as: w}
    expect:
      - "steps.j.result.ok && steps.g.result.value.value == false && steps.w.result.ok"
      - "state['commit-log-segment@n1'].cdc_state == 'CONTAINS'"
  - id: wp-jmx-cdc-on-repair-disabled
    flow: commitlog-jmx-cdc-on-repair
