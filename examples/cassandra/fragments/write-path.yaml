      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.apply-counter-mutation-on-leader' && e.instance == 'n2')"
  - id: wp-counter-verb-out-of-range-rejected
    flow: replica-counter-mutation-verb
