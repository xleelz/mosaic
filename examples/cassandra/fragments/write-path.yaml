  - component: abstract-allocator-memtable
    name: schedule-flush
    kind: task
    summary: The self-recurring ScheduledExecutors task for memtable_flush_period_in_ms - flush an expired dirty memtable, reschedule a clean one.
    description: Scheduled only when the table's memtable_flush_period_in_ms > 0 (TableParams default 0, so normally never).
    sources:
      - src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:204-243
      - src/java/org/apache/cassandra/schema/TableParams.java:363
    request:
      type: object
      required: [keyspace, table]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        memtable_flush_period_in_ms: {type: integer, default: 0}
        memtable_age_ms: {type: integer, default: 0}
    response:
      type: object
      properties:
        action: {type: string, enum: [none, wait, rescheduled, flushed]}
    behavior:
      - if: "input.memtable_flush_period_in_ms <= 0"
        then:
          - title: memtable_flush_period_in_ms is 0 - no flush is scheduled
            source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:204-209
            return: {action: none}
      - if: "input.memtable_age_ms < input.memtable_flush_period_in_ms"
        then:
          - return: {action: wait}
      - call: skip-list-memtable.is-clean
        input: {keyspace: "= input.keyspace", table: "= input.table"}
        as: clean
      - if: "vars.clean.value.clean"
        then:
          - title: Still clean - reschedule instead of switching
            source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:231-235
            return: {action: rescheduled}
      - title: Expired and dirty - signalFlushRequired(MEMTABLE_PERIOD_EXPIRED)
        source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:236-241
        call: column-family-store.signal-flush-required
        input: {keyspace: "= input.keyspace", table: "= input.table", reason: MEMTABLE_PERIOD_EXPIRED}
      - return: {action: flushed}

  - component: abstract-allocator-memtable
    name: flush-largest-memtable
    kind: function
    summary: The MemtableCleaner - flush the memtable with the largest on- or off-heap ownership ratio (MEMTABLE_LIMIT).
    sources: [src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:245-318]
    request: WritePathTableRef
    response:
      type: object
      properties:
        flushed: {type: boolean}
    behavior:
      - choice: largest
        default: found
        options:
          found:
            - title: Flushing largest memtable to free up room
              source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:287-297
              call: column-family-store.signal-flush-required
              input:
                keyspace: "= input.keyspace"
                table: "= input.table"
                reason: MEMTABLE_LIMIT
            - return: {flushed: true}
          none:
            - title: No allocator-backed memtable found
              source: src/java/org/apache/cassandra/db/memtable/AbstractAllocatorMemtable.java:310-315
              return: {flushed: false}

  - component: flushing-flush-runnable
    name: call
    kind: task
    summary: Write the memtable's sorted partitions to an sstable writer (skipping fully-deleted batchlog partitions).
    sources:
      - src/java/org/apache/cassandra/db/memtable/Flushing.java:151-194
    request:
      type: object
      required: [keyspace, table, partitions]
      properties:
        keyspace: {type: string}
        table: {type: string}
        partitions: {type: integer}
        cells: {type: array, default: [], items: {type: object}}
        partition_rows: {type: array, default: [], items: {type: object}}
    response:
      type: object
      properties:
        partitions_written: {type: integer}
        sstable_partitions: {type: object, description: "partition key -> {cells, deletion_ts, tombstones, purgeable_tombstones, size_bytes, token}"}
        max_timestamp: {type: integer}
    behavior:
      - set:
          vars.cells: "= has(input.cells) ? input.cells : []"
          vars.rows: "= has(input.partition_rows) ? input.partition_rows : []"
      - set:
          vars.pks: "= (vars.rows.map(r, r.partition_key) + vars.cells.map(c, c.partition_key)).distinct()"
      - title: Each partition's rows and tombstones, in the memtable's sorted order (cells and partition deletion kept)
        source: src/java/org/apache/cassandra/db/memtable/Flushing.java:157-174
        set:
          vars.parts: "= vars.pks.transformMapEntry(i, pk, {pk: merge(vars.rows.exists(r, r.partition_key == pk && 'token' in r) ? {'token': vars.rows.filter(r, r.partition_key == pk && 'token' in r)[0].token} : {}, {'cells': vars.cells.filter(c, c.partition_key == pk).map(c, {'column': c.column, 'value': c.value, 'timestamp': c.timestamp, 'deleted': ('deleted' in c && c.deleted) || c.value == null}), 'deletion_ts': math.greatest([-1] + vars.rows.filter(r, r.partition_key == pk && 'deletion_timestamp' in r).map(r, r.deletion_timestamp)), 'tombstones': size(vars.cells.filter(c, c.partition_key == pk && (('deleted' in c && c.deleted) || c.value == null))), 'purgeable_tombstones': 0, 'size_bytes': 220 * size(vars.cells.filter(c, c.partition_key == pk))})})"
          vars.max_ts: "= math.greatest([0] + vars.cells.map(c, c.timestamp) + vars.rows.filter(r, 'deletion_timestamp' in r).map(r, r.deletion_timestamp))"
      - title: Append each non-empty partition to the sstable writer
        source: src/java/org/apache/cassandra/db/memtable/Flushing.java:157-174
        call: data-disk.sstable-write
        input: {keyspace: "= input.keyspace", table: "= input.table", partitions: "= input.partitions"}
      - return: {partitions_written: "= input.partitions", sstable_partitions: "= vars.parts", max_timestamp: "= vars.max_ts"}

  - component: memtable-allocator
    name: allocate
    kind: function
    summary: Allocate memtable memory from the pool; when it is full the writer blocks on hasRoom until a flush releases memory.
    sources: [src/java/org/apache/cassandra/utils/memory/MemtableAllocator.java:168-197]
    request:
      type: object
      required: [bytes]
      properties:
        bytes: {type: integer, minimum: 0, examples: [348]}
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
    response:
      type: object
      properties:
        allocated: {type: boolean}
        blocked: {type: boolean}
    behavior:
      - call: memtable-pool.try-allocate
        input: {bytes: "= input.bytes"}
        as: a
      - if: "vars.a.value.allocated"
        then:
          - return: {allocated: true, blocked: false}
      - set: {ctx.memtableAllocationBlocked: true}
      - title: Pool full - block on hasRoom; the cleaner flushes the largest memtable, which frees memory when it is reclaimed
        detail: The model runs that flush inline, since the blocked writer only resumes after it.
        source: src/java/org/apache/cassandra/utils/memory/MemtableAllocator.java:185-195
        call: abstract-allocator-memtable.flush-largest-memtable
        input:
          keyspace: "= has(input.keyspace) ? input.keyspace : 'ks1'"
          table: "= has(input.table) ? input.table : 'users'"
      - call: memtable-pool.try-allocate
        input: {bytes: "= input.bytes"}
        as: b
      - when: "!vars.b.value.allocated"
        title: Still full - writes blocking a flush barrier allocate past the limit
        source: src/java/org/apache/cassandra/utils/memory/MemtableAllocator.java:180-184
        call: memtable-pool.allocated
        input: {bytes: "= input.bytes"}
      - return: {allocated: true, blocked: true}

  - component: memtable-allocator
    name: set-discarding
    kind: function
    summary: The memtable was switched out; its owned memory counts as reclaiming.
    sources: [src/java/org/apache/cassandra/utils/memory/MemtableAllocator.java:83-87]
    request: {type: object, required: [bytes], properties: {bytes: {type: integer, minimum: 0}}}
    behavior:
      - call: memtable-pool.reclaiming
        input: {bytes: "= input.bytes"}

  - component: memtable-allocator
    name: set-discarded
    kind: function
    summary: The memtable was flushed and discarded; release its memory to the pool.
    sources: [src/java/org/apache/cassandra/utils/memory/MemtableAllocator.java:93-97]
    request: {type: object, required: [bytes], properties: {bytes: {type: integer, minimum: 0}}}
    behavior:
      - call: memtable-pool.released
        input: {bytes: "= input.bytes"}

  - component: memtable-pool
    name: try-allocate
    kind: function
    summary: Allocate if under the limit; above memtable_cleanup_threshold trigger the cleaner thread.
    sources:
      - src/java/org/apache/cassandra/utils/memory/MemtablePool.java:151-161
      - src/java/org/apache/cassandra/utils/memory/MemtablePool.java:177-190
    request: {type: object, required: [bytes], properties: {bytes: {type: integer, minimum: 0}}}
    response: {type: object, properties: {allocated: {type: boolean}}}
    behavior:
      - if: "state.allocated_bytes + input.bytes > int(config['memtable-heap-space-bytes'])"
        then:
          - return: {allocated: false}
      - set: {state.allocated_bytes: "= state.allocated_bytes + input.bytes"}
      - when: "double(state.allocated_bytes) > double(state.reclaiming_bytes) + double(int(config['memtable-heap-space-bytes'])) * double(config['memtable-cleanup-threshold'])"
        title: Above the cleanup threshold - trigger the MemtableCleanerThread
        source: src/java/org/apache/cassandra/utils/memory/MemtablePool.java:125-135
        emit: memtable-cleaner-thread-clean.run
      - return: {allocated: true}

  - component: memtable-pool
    name: allocated
    kind: function
    summary: Account an allocation bypassing the limit.
    sources: [src/java/org/apache/cassandra/utils/memory/MemtablePool.java:177-185]
    request: {type: object, required: [bytes], properties: {bytes: {type: integer, minimum: 0}}}
    behavior:
      - set: {state.allocated_bytes: "= state.allocated_bytes + input.bytes"}

  - component: memtable-pool
    name: reclaiming
    kind: function
    summary: Mark memory of a switched-out memtable as reclaiming.
    sources: [src/java/org/apache/cassandra/utils/memory/MemtablePool.java:199-204]
    request: {type: object, required: [bytes], properties: {bytes: {type: integer, minimum: 0}}}
    behavior:
      - set: {state.reclaiming_bytes: "= state.reclaiming_bytes + input.bytes"}

  - component: memtable-pool
    name: released
    kind: function
    summary: Release a discarded memtable's memory and signal blocked writers (hasRoom).
    sources: [src/java/org/apache/cassandra/utils/memory/MemtablePool.java:192-197]
    request: {type: object, required: [bytes], properties: {bytes: {type: integer, minimum: 0}}}
    behavior:
      - set:
          state.allocated_bytes: "= state.allocated_bytes - input.bytes < 0 ? 0 : state.allocated_bytes - input.bytes"
          state.reclaiming_bytes: "= state.reclaiming_bytes - input.bytes < 0 ? 0 : state.reclaiming_bytes - input.bytes"

  - component: memtable-pool
    name: needs-cleaning
    kind: function
    summary: Used memory above reclaiming + limit x cleanup_threshold.
    sources:
      - src/java/org/apache/cassandra/utils/memory/MemtablePool.java:86-89
      - src/java/org/apache/cassandra/utils/memory/MemtablePool.java:125-147
    response: {type: object, properties: {needs_cleaning: {type: boolean}}}
    behavior:
      - return:
          needs_cleaning: "= double(state.allocated_bytes) > double(state.reclaiming_bytes) + double(int(config['memtable-heap-space-bytes'])) * double(config['memtable-cleanup-threshold'])"

  - component: memtable-cleaner-thread-clean
    name: run
    kind: task
    summary: One iteration of the cleaner loop - wait until the pool needs cleaning, then flush the largest memtable.
    sources:
      - src/java/org/apache/cassandra/utils/memory/MemtableCleanerThread.java:70-106
      - src/java/org/apache/cassandra/utils/memory/MemtableCleanerThread.java:118-123
    request: WritePathTableRef
    response: {type: object, properties: {cleaned: {type: boolean}}}
    behavior:
      - call: memtable-pool.needs-cleaning
        as: n
      - if: "!vars.n.value.needs_cleaning"
        then:
          - title: Pool below the threshold - wait for a signal
            source: src/java/org/apache/cassandra/utils/memory/MemtableCleanerThread.java:73-80
            return: {cleaned: false}
      - title: Invoke the cleaner (flushLargestMemtable)
        source: src/java/org/apache/cassandra/utils/memory/MemtableCleanerThread.java:81-89
        call: abstract-allocator-memtable.flush-largest-memtable
        input:
          keyspace: "= has(input.keyspace) ? input.keyspace : 'ks1'"
          table: "= has(input.table) ? input.table : 'users'"
        as: f
      - return: {cleaned: "= vars.f.value.flushed"}

  # ====================================================================== commit log
  - component: commit-log
    name: add
    kind: function
    summary: Validate size, serialize, allocate space in the current segment, write the checksummed entry, then wait as the sync mode requires.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:294-343]
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {$ref: WritePathMutation}
        cdc: {type: boolean, default: false}
    response: WritePathCommitLogPosition
    errors:
      - {code: mutation-exceeded-max-size, status: 8704}
      - {code: cdc-write, status: 5632}
      - {code: fs-write-error, status: 0}
    behavior:
      - call: mutation.validate-size
        input: {mutation: "= input.mutation"}
      - title: Allocate (size + 12-byte entry overhead) from the segment manager chosen by cdc_enabled
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:306-311
        call: "= config['cdc-enabled'] ? 'commit-log-segment-manager-cdc.allocate' : 'commit-log-segment-manager-standard.allocate'"
        targets: [commit-log-segment-manager-standard.allocate, commit-log-segment-manager-cdc.allocate]
        input:
          size: "= (has(input.mutation.serialized_size) ? input.mutation.serialized_size : 220) + 12"
          cdc: "= has(input.cdc) ? input.cdc : false"
          cdc_block_writes: "= 'cdc_block_writes' in state ? state.cdc_block_writes : config['cdc-block-writes']"
        as: alloc
      - title: Write length + CRC, mutation + CRC into the mapped segment buffer
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:313-334
        call: commitlog-disk.segment-append
        input: {segment_id: "= vars.alloc.value.segment_id", position: "= vars.alloc.value.position", size: "= (has(input.mutation.serialized_size) ? input.mutation.serialized_size : 220) + 12"}
        on_error:
          - title: IOException becomes FSWriteError
            source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:327-330
            fail: {code: fs-write-error, status: 0, message: "= 'commit log write failed: ' + error.code"}
      - set: {state.appended: "= state.appended + 1", vars.seg_name: "= 'CommitLog-8-' + string(vars.alloc.value.segment_id) + '.log'"}
      - call: commit-log.segments-get
        input: {key: "= vars.seg_name"}
        as: segfile
      - title: The entry is now part of the segment file on disk (replayed at the next startup unless flushed first)
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:313-333
        call: commit-log.segments-put
        input:
          key: "= vars.seg_name"
          row:
            name: "= vars.seg_name"
            id: "= vars.alloc.value.segment_id"
            entries: "= vars.segfile.value.entries + [{'mutation': input.mutation, 'already_persisted': false}]"
      - title: finishWriteFor - wait for sync according to commitlog_sync
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:336
        call: abstract-commit-log-service.finish-write-for
      - return: {segment_id: "= vars.alloc.value.segment_id", position: "= vars.alloc.value.position"}

  - component: commit-log
    name: sync
    kind: function
    summary: Write sync markers for the active segments, and fsync them when flush is true.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:278-284]
    request: {type: object, required: [flush], properties: {flush: {type: boolean}}}
    behavior:
      - call: abstract-commit-log-segment-manager.sync
        input: {flush: "= input.flush"}

  - component: commit-log
    name: request-extra-sync
    kind: function
    summary: Preempt the sync thread so it syncs now.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:286-292]
    behavior:
      - call: abstract-commit-log-service.request-extra-sync

  - component: commit-log
    name: handle-commit-error
    kind: function
    summary: Apply commit_failure_policy (cassandra.yaml stop) to a commit log error - stop transports and/or end the thread, or ignore.
    sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:575-596]
    request: {type: object, properties: {message: {type: string}}}
    response: {type: object, properties: {continue_processing: {type: boolean}}}
    behavior:
      - if: "config['commit-failure-policy'] == 'ignore'"
        then:
          - title: "commit_failure_policy: ignore - log and carry on"
            source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:590-592
            return: {continue_processing: true}
      - when: "config['commit-failure-policy'] == 'die' || config['commit-failure-policy'] == 'stop'"
        title: "die/stop - StorageService.stopTransports (die also kills the JVM via JVMStabilityInspector)"
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:582-585
        set: {ctx.transportsStopped: true}
      - title: Log and terminate the failing thread
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:586-589
        return: {continue_processing: false}

  - component: commit-log
    name: recover-segments-on-disk
    kind: function
    summary: At startup, archive and restore segments, replay every unmanaged segment file in the commit log directory, then delete the replayed files.
    description: The files come from the commit log directory (this node's segments_on_disk), not from the request; a segments list in the request is ignored.
    sources:
      - src/java/org/apache/cassandra/db/commitlog/CommitLog.java:163-218
      - src/java/org/apache/cassandra/service/CassandraDaemon.java:345
    request: {type: object, properties: {}}
    response: {type: object, properties: {replayed: {type: integer}}}
    errors:
      - {code: commit-log-replay-exception, summary: Replay stopped by commit_failure_policy}
    behavior:
      - title: getUnmanagedFiles - list the segment files in the commit log directory
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:168-174
        call: commit-log.segments-query
        as: files
      - foreach: "= vars.files.value"
        as: seg
        steps:
          - title: Submit each file to the archiver before recovery (CASSANDRA-6904), and wait for it
            source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:187-191
            call: commit-log-archiver.maybe-archive
            input: {name: "= vars.seg.name"}
          - call: commit-log-archiver.maybe-wait-for-archiving
            input: {name: "= vars.seg.name"}
      - call: commit-log-archiver.maybe-restore-archive
      - title: List the files again, since restore may have added segments
        source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:196-197
        call: commit-log.segments-query
        as: files2
      - if: "size(vars.files2.value) == 0"
        then:
          - title: No commitlog files found; skipping replay
            source: src/java/org/apache/cassandra/db/commitlog/CommitLog.java:199-202
            return: {replayed: 0}
      - call: commit-log.recover-files
        input: {segments: "= vars.files2.value"}
        as: r
      - foreach: "= vars.files2.value"
        as: seg
        steps:
          - title: Delete the replayed segment file
            source: src/java/org/apache/cassandra/db/commitlog/AbstractCommitLogSegmentManager.java:421-426
            call: commitlog-disk.segment-delete
            input: {name: "= vars.seg.name"}
          - call: commit-log.segments-delete
            input: {key: "= vars.seg.name"}
      - return: {replayed: "= vars.r.value.replayed"}

  - {component: commit-log, name: segments-get, kind: store, summary: "One segment file in the commit log directory (an empty file when absent).", sources: [src/java/org/apache/cassandra/db/commitlog/CommitLogSegment.java:174-182], request: {type: object, properties: {key: {type: string}}}, store: {table: segments_on_disk, op: get, key: "= input.key", default: {entries: []}}}
  - {component: commit-log, name: segments-put, kind: store, summary: Write a segment file's contents., sources: [src/java/org/apache/cassandra/db/commitlog/CommitLog.java:313-333], request: {type: object, properties: {key: {type: string}, row: {type: object}}}, store: {table: segments_on_disk, op: put, key: "= input.key", value: "= input.row"}}
