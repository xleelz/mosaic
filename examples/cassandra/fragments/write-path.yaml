          "shop.users:user:42:name": {keyspace: shop, table: users, partition_key: "user:42", column: name, value: zoe, timestamp: 1793318500000000}
    input: {mutation: {columns: {}, partition_deletion: true, timestamp: 1793318400000000}}
    expect:
      - "result.ok && state['skip-list-memtable@n2'].partitions['shop.users:user:42'].deletion_timestamp == 1793318400000000"
      - "state['skip-list-memtable@n2'].cells['shop.users:user:42:city'].deleted == true"
      - "state['skip-list-memtable@n2'].cells['shop.users:user:42:name'].value == 'zoe'"
