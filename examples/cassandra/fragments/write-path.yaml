    name: A reserve segment already exists - nothing to do
    expect:
      - "result.ok && result.value.created == false && calls['commitlog-disk.segment-create'] == 0"
      - "state['abstract-commit-log-segment-manager@n1'].on_disk_size_bytes == 67108864"
  - id: wp-allocator-creates-reserve
