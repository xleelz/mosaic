    input: {mutation: {columns: {}, cells: [{column: email, deleted: true, timestamp: 1793318300000000}]}}
    expect:
      - "result.ok && state['skip-list-memtable@n2'].cells['shop.users:user:42:email'].value == 'a@x'"
  - id: wp-mutation-partition-deletion
