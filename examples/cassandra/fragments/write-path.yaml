      - "steps.c.result.value.cleaned == true && steps.n.result.value == 1"

  # ---------------------------------------------------------------- truncate
  - id: wp-truncate-auto-snapshot
    flow: replica-truncate-verb
    fixtures: [three-node-rf3]
    name: auto_snapshot true - flush, snapshot, drop data, save truncation record
    state:
      "skip-list-memtable@n2":
        stats: {"shop.users": {operations: 1, partitions: 1, bytes: 300}}
        cells: {"shop.users:user:42:name": {keyspace: shop, table: users, partition_key: "user:42", column: name, value: alice, timestamp: 1}}
    expect:
      - "result.ok && result.value.success == true && ctx.truncateMemtable == 'flushed'"
      - "calls['flushing-flush-runnable.call'] == 1 && calls['data-disk.snapshot-create'] == 1 && calls['active-repair-service.abort'] == 1"
      - "!('shop.users:user:42:name' in state['skip-list-memtable@n2'].cells)"
      - "'shop.users' in state['column-family-store@n2'].truncation_records"
  - id: wp-truncate-no-snapshot-not-durable
    flow: replica-truncate-verb
    fixtures: [three-node-rf3]
    name: auto_snapshot false and durable_writes false - dump the memtable, no snapshot
    config: {auto-snapshot: false}
    state:
      column-family-store: {tables: {shop.users: {durable_writes: false}}}
      skip-list-memtable: {stats: {"shop.users": {operations: 1, partitions: 1, bytes: 300}}}
    expect:
      - "result.ok && ctx.truncateMemtable == 'dumped'"
      - "calls['flushing-flush-runnable.call'] == 0 && calls['data-disk.snapshot-create'] == 0"
      - "state['skip-list-memtable@n2'].stats['shop.users'].partitions == 0"
  - id: wp-truncate-no-snapshot-durable
    flow: replica-truncate-verb
    fixtures: [three-node-rf3]
    name: auto_snapshot false but durable - still flush first, no snapshot
    config: {auto-snapshot: false}
    state:
      skip-list-memtable: {stats: {"shop.users": {operations: 1, partitions: 1, bytes: 300}}}
    expect:
      - "result.ok && ctx.truncateMemtable == 'flushed'"
      - "calls['flushing-flush-runnable.call'] == 1 && calls['data-disk.snapshot-create'] == 0"
      - "state['column-family-store@n2'].live_sstables['shop.users'] == 0"
  - id: wp-write-truncate-read
    fixtures: [three-node-rf3]
    name: Write on n2, truncate on n2, then the row is gone
    steps:
      - {flow: replica-mutation-verb, as: w}
      - {flow: replica-truncate-verb, as: t}
      - {interface: skip-list-memtable.cells-get, caller: read-path, on: n2, as: r, input: {key: "shop.users:user:42:name"}}
    expect:
      - "'shop.users' in state['column-family-store@n2'].truncation_records"
      - "steps.w.result.ok && steps.t.result.ok && !steps.r.result.ok"

  # ---------------------------------------------------------------- views
  - id: wp-view-build-fresh
    flow: view-build
    fixtures: [one-node]
    name: New view - flush the base table, build two ranges one at a time, mark built and replicated
    expect:
      - "result.ok && result.value.built == true && result.value.keys_built == 4"
      - "calls['view-builder-task.call'] == 2 && calls['storage-proxy.mutate-mv'] == 4"
      - "calls['column-family-store.force-blocking-flush'] == 1 && calls['gossiper.wait-for-schema-agreement'] == 2"
      - "state['view-builder@n1'].built_views['shop.users_by_city'].replicated == true"
  - id: wp-view-build-then-status
    fixtures: [one-node]
    name: The finished build is recorded in the view build status
    steps:
      - {flow: view-build, as: b}
      - {interface: view-builder.built-views-get, caller: operator, as: st, input: {key: "shop.users_by_city"}}
    expect:
      - "state['view-builder@n1'].built_views['shop.users_by_city'].built == true"
      - "steps.b.result.value.built == true && steps.st.result.value.built == true && steps.st.result.value.replicated == true"
  - id: wp-view-build-already-built
    flow: view-build
    fixtures: [one-node]
    name: View already built - only publish the distributed status
    state: {view-builder: {built_views: {shop.users_by_city: {built: true, replicated: false}}}}
    expect:
      - "result.ok && result.value.already_built == true && calls['view-builder-task.call'] == 0"
      - "calls['column-family-store.force-blocking-flush'] == 0 && state['view-builder@n1'].built_views['shop.users_by_city'].replicated == true"
  - id: wp-view-build-task-fails
    flow: view-build
    fixtures: [one-node]
    name: A build task fails - retry scheduled in 5 minutes, view not marked built
    faults:
      - {target: view-builder-task.call, type: error, code: write-timeout, status: 4352, calls: [1]}
    expect:
      - "result.ok && result.value.built == false && ctx.viewBuild == 'retry-scheduled' && ctx.viewBuildRetryInMs == 300000"
      - "!('shop.users_by_city' in state['view-builder@n1'].built_views)"
  - id: wp-view-build-interrupted
    flow: view-build
    fixtures: [one-node]
    name: Compaction stop interrupts the build - builder stops
    faults:
      - {target: view-builder-task.call, type: error, code: compaction-interrupted}
    expect:
      - "result.ok && result.value.stopped == true && ctx.viewBuild == 'stopped'"
      - "!('shop.users_by_city' in state['view-builder@n1'].built_views)"

  # ---------------------------------------------------------------- import, load, snapshot, drop
  - id: wp-import-all-verified
    flow: cfs-import-new-sstables
    fixtures: [one-node]
    name: Both directories verify; their sstables join the live set and a background compaction is submitted
    expect:
      - "result.ok && size(result.value.failed_directories) == 0"
      - "state['column-family-store@n1'].live_sstables['shop.users'] == 2 && calls['compaction-manager.submit-background'] >= 1"
  - id: wp-import-then-count
    fixtures: [one-node]
    name: Imported sstables are visible in the table's live set
    steps:
      - {flow: cfs-import-new-sstables, as: i}
      - {interface: column-family-store.live-sstables-get, caller: read-path, as: n, input: {key: "shop.users"}}
    expect:
      - "state['column-family-store@n1'].live_sstables['shop.users'] == 2"
      - "steps.i.result.ok && steps.n.result.value == 2"
  - id: wp-import-verification-fails
    flow: cfs-import-new-sstables
    fixtures: [one-node]
    name: Verification fails - every directory is returned as failed and nothing is added
    choices: {column-family-store.import-new-sstables.verification: fails}
    expect:
      - "result.ok && result.value.failed_directories == ['/tmp/import/a', '/tmp/import/b']"
      - "calls['column-family-store.add-sstables'] == 0 && !('shop.users' in state['column-family-store@n1'].live_sstables)"
  - id: wp-load-new-sstables
    flow: cfs-load-new-sstables
    fixtures: [one-node]
    name: Refresh adds the new sstables found in the table directory
    expect:
      - "result.ok && calls['column-family-store.add-sstables'] == 1"
      - "state['column-family-store@n1'].live_sstables['shop.users'] == 1"
  - id: wp-load-then-count
    fixtures: [one-node]
    name: Refreshed sstables are visible in the table's live set
    steps:
      - {flow: cfs-load-new-sstables, as: l}
      - {interface: column-family-store.live-sstables-get, caller: read-path, as: n, input: {key: "shop.users"}}
    expect:
      - "state['column-family-store@n1'].live_sstables['shop.users'] == 1"
      - "steps.l.result.ok && steps.n.result.value == 1"
  - id: wp-snapshot-registered
    flow: table-snapshot
    fixtures: [one-node]
    name: Snapshot hard-links sstables and registers the TableSnapshot
    expect:
      - "result.ok && calls['data-disk.snapshot-create'] == 1"
      - "state['snapshot-manager@n1'].snapshots['shop.users:backup1'].tag == 'backup1'"
  - id: wp-snapshot-then-exists
    fixtures: [one-node]
    name: A taken snapshot exists afterwards
    steps:
      - {flow: table-snapshot, as: s}
      - {interface: column-family-store.snapshots-get, caller: operator, as: g, input: {key: backup1}}
    expect:
      - "'shop.users:backup1' in state['snapshot-manager@n1'].snapshots"
      - "steps.s.result.ok && steps.g.result.ok && steps.g.result.value.table == 'users'"
  - id: wp-snapshot-bad-name
    flow: table-snapshot
    fixtures: [one-node]
    name: A snapshot name with a path separator is rejected before any hard link
    input: {snapshot_name: ../../etc}
    expect:
      - "!result.ok && result.error.code == 'illegal-argument-exception' && calls['data-disk.snapshot-create'] == 0"
  - id: wp-snapshot-reserved-name
    flow: table-snapshot
    fixtures: [one-node]
    name: A reserved snapshot name ('..') is rejected
    input: {snapshot_name: ".."}
    expect:
      - "!result.ok && result.error.code == 'illegal-argument-exception' && result.error.message.contains('reserved')"
  - id: wp-snapshot-ephemeral-ttl
    flow: table-snapshot
    fixtures: [one-node]
    name: An ephemeral snapshot with a TTL is refused
    input: {ephemeral: true, ttl_seconds: 3600}
    expect:
      - "!result.ok && result.error.code == 'illegal-state-exception'"
  - id: wp-drop-table-flushes
    flow: schema-drop-table
    fixtures: [one-node]
    name: Dropping a durable table with a dirty memtable flushes it first (FlushReason.DROP), then unregisters it
    state:
      skip-list-memtable: {stats: {"shop.users": {operations: 1, partitions: 1, bytes: 300}}}
    expect:
      - "result.ok && calls['flushing-flush-runnable.call'] == 1"
      - "!('shop.users' in state['keyspace@n1'].tables) && 'shop.orders' in state['keyspace@n1'].tables"
  - id: wp-drop-table-then-write
    fixtures: [three-node-rf3]
    name: After a table is dropped on n2, a MUTATION_REQ for it fails there with INCOMPATIBLE_SCHEMA
    steps:
      - {flow: schema-drop-table, on: n2, as: d}
      - {interface: keyspace.get-column-family-store, caller: messaging, on: n2, as: g, input: {keyspace: shop, table: users}}
      - {flow: replica-mutation-verb, as: w}
    expect:
      - "!('shop.users' in state['keyspace@n2'].tables) && 'shop.users' in state['keyspace@n1'].tables"
      - "steps.d.result.ok && steps.g.result.value.exists == false"
      - "!steps.w.result.ok && steps.w.result.error.code == 'unknown-table'"

  # ---------------------------------------------------------------- schema lifecycle, pairing, paxos history, start
  - id: wp-init-new-table
    flow: schema-init-table
    fixtures: [one-node]
    name: A new table gets a store and becomes known to the write path
    expect:
      - "result.ok && result.value.created == true && 'shop.customers' in state['keyspace@n1'].tables"
  - id: wp-init-existing-table-reloads
    flow: schema-init-table
    fixtures: [one-node]
    name: Re-initializing an existing table reloads its store
    input: {table: users}
    expect:
      - "result.ok && result.value.created == false && calls['column-family-store.reload'] == 1"
      - "size(state['keyspace@n1'].tables) == 9"
  - id: wp-init-then-write
    fixtures: [three-node-rf3]
    name: After a table is created on n2, MUTATION_REQs for it are applied there
    steps:
      - {flow: schema-init-table, on: n2, as: c}
      - {flow: replica-mutation-verb, as: w, input: {mutation: {table: customers}}}
    expect:
      - "steps.c.result.ok && steps.w.result.ok"
      - "state['skip-list-memtable@n2'].cells['shop.customers:user:42:name'].value == 'alice'"
  - id: wp-open-keyspace
    flow: schema-open-keyspace
    fixtures: [one-node]
    name: Opening a new keyspace records it with durable writes
    expect:
      - "result.ok && state['keyspace@n1'].durable_writes['inventory'] == true"
  - id: wp-open-then-list
    fixtures: [one-node]
    name: A freshly opened keyspace has no tables yet
    steps:
      - {flow: schema-open-keyspace, as: o}
      - {interface: keyspace.get-column-family-stores, caller: schema-auth, as: t, input: {keyspace: inventory}}
    expect:
      - "steps.o.result.ok && size(steps.t.result.value.tables) == 0 && 'inventory' in state['keyspace@n1'].durable_writes"
  - id: wp-unload-keyspace
    flow: schema-unload-keyspace
    fixtures: [one-node]
    name: Unloading ks1 flushes and releases its three tables
    expect:
      - "result.ok && calls['column-family-store.force-blocking-flush'] == 3"
      - "!('ks1.users' in state['keyspace@n1'].tables) && 'shop.users' in state['keyspace@n1'].tables && !('ks1' in state['keyspace@n1'].durable_writes)"
  - id: wp-unload-then-list
    fixtures: [one-node]
    name: An unloaded keyspace lists no tables
    steps:
      - {flow: schema-unload-keyspace, as: u}
      - {interface: keyspace.get-column-family-stores, caller: schema-auth, as: t, input: {keyspace: ks1}}
      - {interface: keyspace.get-column-family-stores, caller: schema-auth, as: s, input: {keyspace: shop}}
    expect:
      - "steps.u.result.ok && size(steps.t.result.value.tables) == 0 && size(steps.s.result.value.tables) == 5"
      - "!('ks1.events' in state['keyspace@n1'].tables)"
  - id: wp-view-pair-self
    flow: view-pairing
    fixtures: [three-node-rf3]
    name: The base replica is also a view replica - it pairs with itself
    expect: ["result.ok && result.value.endpoint == 'n1'"]
  - id: wp-view-pair-remote
    flow: view-pairing
    fixtures: [three-node-rf3]
    name: The base replica pairs with another node's view replica
    choices: {view-utils.get-view-natural-endpoint.pairing: remote}
    expect: ["result.ok && result.value.endpoint == 'n2'"]
  - id: wp-view-pair-none
    flow: view-pairing
    fixtures: [three-node-rf3]
    name: During a range movement there is no paired endpoint
    choices: {view-utils.get-view-natural-endpoint.pairing: none}
    expect: ["result.ok && result.value.endpoint == ''"]
  - id: wp-paxos-repair-complete
    flow: paxos-repair-complete
    fixtures: [one-node]
    name: The repaired ranges and low bound are recorded in the table's Paxos repair history
    expect:
      - "result.ok && state['column-family-store@n1'].paxos_repair_history['shop.accounts'].low_bound == 1793318400000000"
  - id: wp-paxos-history-sync
    flow: paxos-repair-history-sync
    fixtures: [one-node]
    name: A received history is merged into the table's history
    expect:
      - "result.ok && 'shop.accounts' in state['column-family-store@n1'].paxos_repair_history"
  - id: wp-paxos-history-sync-twice
    fixtures: [one-node]
    name: A completed repair after a history sync leaves the table's history at the repaired low bound
    steps:
      - {flow: paxos-repair-history-sync, as: s}
      - {flow: paxos-repair-complete, as: c}
    expect:
      - "steps.c.result.ok && steps.s.result.ok && state['column-family-store@n1'].paxos_repair_history['shop.accounts'].low_bound == 1793318400000000"
  - id: wp-commitlog-start
    flow: commitlog-start
    fixtures: [one-node]
    name: CommitLog.start starts the segment manager and the sync thread
    expect: ["result.ok && trace.exists(e, e.type == 'note' && e.title.startsWith('segmentManager.start'))"]

  # ---------------------------------------------------------------- remaining branches
  - id: wp-group-commitlog
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: Group mode - the write waits for the next sync after the group window
    config: {commitlog-sync: group, commitlog-sync-group-window-ms: 1000}
    expect:
      - "result.ok && calls['group-commit-log-service.maybe-wait-for-sync'] == 1 && duration_ms >= 1000"
      - "state['abstract-commit-log-service@n1'].sync_count == 1"
  - id: wp-skip-commitlog-memtable
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: A table whose memtable writes skip the commit log is not appended
    state: {keyspace: {tables: {shop.users: {skip_commitlog: true}}}}
    expect:
      - "result.ok && ctx.commitLog == 'skipped-by-memtable' && state['commit-log@n1'].appended == 0"
  - id: wp-cdc-allocator-new-segment
    flow: commitlog-segment-allocator
    fixtures: [one-node]
    name: With CDC on, a new reserve segment is PERMITTED and counted against cdc_total_space
    config: {cdc-enabled: true}
    state: {abstract-commit-log-segment-manager: {available_segment: false}}
    expect:
      - "result.ok && state['abstract-commit-log-segment-manager@n1'].reserve_cdc_state == 'PERMITTED'"
      - "state['commit-log-segment-manager-cdc@n1'].cdc_size_in_progress_bytes == 33554432"
  - id: wp-cdc-allocator-over-allowance
    flow: commitlog-segment-allocator
    fixtures: [one-node]
    name: With cdc_raw full, the new reserve segment is FORBIDDEN for CDC writes
    config: {cdc-enabled: true}
    state:
      abstract-commit-log-segment-manager: {available_segment: false}
      commit-log-segment-manager-cdc: {cdc_size_in_progress_bytes: 4294967296}
    expect:
      - "result.ok && state['abstract-commit-log-segment-manager@n1'].reserve_cdc_state == 'FORBIDDEN'"
  - id: wp-cdc-advance-to-forbidden-segment
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: A CDC write fills its segment and the next segment is FORBIDDEN - CDCWriteException
    config: {cdc-enabled: true}
    state:
      keyspace: {tables: {shop.users: {cdc: true}}}
      commit-log-segment: {free_bytes: 100}
      abstract-commit-log-segment-manager: {reserve_cdc_state: FORBIDDEN}
      commit-log-segment-manager-cdc: {cdc_size_in_progress_bytes: 4294967296}
    expect:
      - "!result.ok && result.error.code == 'cdc-write' && ctx.cdcRejected == true"
      - "state['commit-log-segment@n1'].id == 2 && state['commit-log@n1'].appended == 0"
  - id: wp-cdc-advance-permitted
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: A CDC write fills its segment and continues in the next, permitted segment
    config: {cdc-enabled: true}
    state:
      keyspace: {tables: {shop.users: {cdc: true}}}
      commit-log-segment: {free_bytes: 100}
    expect:
      - "result.ok && state['commit-log-segment@n1'].id == 2 && state['commit-log-segment@n1'].cdc_state == 'CONTAINS'"
  - id: wp-replay-ignore-errors-property
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: -Dcassandra.commitlog.ignorereplayerrors=true skips a corrupt entry even under policy stop
    config: {commitlog-ignore-replay-errors: true}
    state:
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}, corrupt: true}
          CommitLog-8-2.log:
            name: CommitLog-8-2.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:44", token: 4444, timestamp: 1793318300000002, columns: {name: carol}}}
    expect:
      - "result.ok && result.value.replayed == 1 && ctx.replayErrorIgnored == 'property'"
      - "state['tracker@n1'].views['shop.users'].sstables.exists(s, 'partitions' in s && 'user:44' in s.partitions && s.partitions['user:44'].cells.exists(c, c.column == 'name' && c.value == 'carol'))"
  - id: wp-replay-with-archiving
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: With archive_command and restore_directories set, files are archived and restored before replay
    config: {commitlog-archive-command: "/bin/ln %path /backup/%name", commitlog-restore-directories: /backup}
    state:
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}}
    expect:
      - "result.ok && result.value.replayed == 1 && calls['commit-log-archiver.maybe-archive'] == 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'commit-log-archiver.maybe-restore-archive' && e.output.restored == 1)"
      - "size(state['commit-log@n1'].segments_on_disk) == 0"
  - id: wp-replay-view-lock-non-droppable
    flow: commitlog-replay-startup
    fixtures: [one-node]
    name: Replayed writes are not droppable - a contended view lock never times them out
    choices: {view-manager.acquire-lock-for.lock: contended}
    state:
      view-manager: {views_by_base_table: {shop.users: [users_by_city]}}
      commit-log:
        segments_on_disk:
          CommitLog-8-1.log:
            name: CommitLog-8-1.log
            entries:
              - {mutation: {keyspace: shop, table: users, partition_key: "user:43", token: 4343, timestamp: 1793318300000001, columns: {name: bob}}}
    expect:
      - "result.ok && result.value.replayed == 1 && ctx.viewLockOutcome == 'retried-past-model-bound'"
      - "state['tracker@n1'].views['shop.users'].sstables.exists(s, 'partitions' in s && 'user:43' in s.partitions && s.partitions['user:43'].cells.exists(c, c.column == 'name' && c.value == 'bob'))"
  - id: wp-cleaner-no-memtable
    flow: memtable-cleaner
    fixtures: [one-node]
    name: Above the threshold but no allocator memtable is found - nothing flushed
    choices: {abstract-allocator-memtable.flush-largest-memtable.largest: none}
    state: {memtable-pool: {allocated_bytes: 1000000000}}
    expect:
      - "result.ok && result.value.cleaned == false && calls['flushing-flush-runnable.call'] == 0"
      - "state['memtable-pool@n1'].allocated_bytes == 1000000000"
  - id: wp-pool-full-nothing-to-flush
    flow: coordinator-local-apply
    fixtures: [one-node]
    name: Pool full and nothing to flush - a write blocking a flush barrier allocates past the limit
    config: {memtable-heap-space-bytes: 1000}
    choices: {abstract-allocator-memtable.flush-largest-memtable.largest: none}
    state: {memtable-pool: {allocated_bytes: 900}}
    expect:
      - "result.ok && ctx.memtableAllocationBlocked == true && state['memtable-pool@n1'].allocated_bytes > 1000"
  - id: wp-sync-after-termination
    flow: commitlog-periodic-sync
    fixtures: [one-node]
    name: After the sync thread terminates (policy stop) no later iteration syncs
    state: {abstract-commit-log-service: {sync_requested: true}}
    faults:
      - {target: commitlog-disk.segment-sync, type: error, code: io-error}
    expect:
      - "!passes[0].result.ok && passes[1].result.value.terminated == true && passes[2].result.value.terminated == true"
      - "state['abstract-commit-log-service@n1'].sync_count == 0"
  - id: wp-snapshot-flushes-dirty-memtable
    flow: table-snapshot
    fixtures: [one-node]
    name: A dirty memtable is flushed (SNAPSHOT) before the hard links are made
    state:
      skip-list-memtable: {stats: {"shop.users": {operations: 1, partitions: 1, bytes: 300}}}
    expect:
      - "result.ok && calls['column-family-store.switch-memtable'] == 1 && calls['flushing-flush-runnable.call'] == 1"
      - "state['column-family-store@n1'].live_sstables['shop.users'] == 1"
  - id: wp-paxos-complete-then-sync
    fixtures: [one-node]
    name: A history sync after a completed repair replaces the table's history entry with the merged history
    steps:
      - {flow: paxos-repair-complete, as: c}
      - {flow: paxos-repair-history-sync, as: s}
    expect:
      - "steps.c.result.ok && steps.s.result.ok && 'history' in state['column-family-store@n1'].paxos_repair_history['shop.accounts']"
