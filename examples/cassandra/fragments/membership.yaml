    failure-detector@n2:
      arrival_samples:
        n1: {t_last_ms: 1793318400000, mean_ms: 1000}
        n3: {t_last_ms: 1793318400000, mean_ms: 1000}
    failure-detector@n3:
      arrival_samples:
