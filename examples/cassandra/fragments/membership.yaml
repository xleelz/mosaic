- component: storage-service
  name: rebuild
  kind: function
  summary: Streams this node's ranges from other replicas (optionally from one DC, keyspace or token set); refuses invalid arguments and a concurrent rebuild.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:1515-1600']
  request:
    type: object
    properties:
      source_dc: {type: string, default: ''}
      keyspace: {type: string, default: ''}
      tokens: {type: string, default: ''}
      specific_sources: {type: string, default: ''}
      exclude_local_dc: {type: boolean, default: false}
  errors:
  - {code: illegal-argument-exception}
  - {code: illegal-state-exception}
  behavior:
  - if: has(input.source_dc) && input.source_dc == 'datacenter1' && has(input.exclude_local_dc) && input.exclude_local_dc
    then:
    - fail: {code: illegal-argument-exception, message: 'Cannot set source data center to be local data center, when excludeLocalDataCenter flag is set'}
  - if: has(input.source_dc) && input.source_dc != '' && input.source_dc != 'datacenter1'
    then:
    - fail: {code: illegal-argument-exception, message: '= ''Provided datacenter \'''' + input.source_dc + ''\'' is not a valid datacenter, available datacenters are: datacenter1'''}
  - if: (!has(input.keyspace) || input.keyspace == '') && has(input.tokens) && input.tokens != ''
    then:
    - fail: {code: illegal-argument-exception, message: Cannot specify tokens without keyspace.}
  - if: state.is_rebuilding
    then:
    - fail: {code: illegal-state-exception, message: Node is still rebuilding. Check nodetool netstats.}
  - set: {state.is_rebuilding: true}
  - call: range-streamer.fetch-async
    input: {operation: REBUILD, keyspaces: = state.distributed_keyspaces}
    as: st
    on_error: continue
  - set: {state.is_rebuilding: false}
  - if: '!vars.st.ok'
    then:
    - fail: {code: runtime-exception, message: '= ''Error while rebuilding node: '' + vars.st.error.code'}
  - return: {rebuilt: true}
- component: storage-service
  name: resume-bootstrap
  kind: function
  summary: Resumes a failed bootstrap from the saved tokens; returns false when the node is not in an interrupted bootstrap.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:2320-2400']
