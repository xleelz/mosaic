  entry:
    caller: messaging
    interface: gossip-shutdown-verb-handler.do-verb
    input:
      from: n2
      state:
        endpoint: n2
        generation: 1793314800
        heartbeat: 360
        max_version: 370
        status: shutdown
        tokens: [0]
        host_id: 6d194555-f6eb-41d0-c000-000000000002
        dc: datacenter1
        rack: rack1
        load: 1048576
        rpc_ready: false
  sources: ['src/java/org/apache/cassandra/net/Verb.java:147']
- id: membership-echo
  name: ECHO_REQ received
  entry:
    caller: messaging
    interface: echo-verb-handler.do-verb
    input: {from: n2}
  sources: ['src/java/org/apache/cassandra/net/Verb.java:150']
- id: membership-ping
