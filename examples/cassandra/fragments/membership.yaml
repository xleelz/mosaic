    caller: messaging
    interface: gossip-digest-syn-verb-handler.do-verb
    input:
      from: n2
      cluster_name: = config['cluster-name']
      partitioner: = config['partitioner']
      digests:
      - {endpoint: n1, generation: 1793314800, max_version: 420}
      - {endpoint: n2, generation: 1793314800, max_version: 360}
      - {endpoint: n3, generation: 1793314800, max_version: 340}
  sources: ['src/java/org/apache/cassandra/net/Verb.java:144']
- id: membership-gossip-ack
