# Membership fragment: gossip, failure detection, token metadata, node lifecycle
# (StorageService start/bootstrap/decommission/move/removenode/drain) and the
# internode messaging service with its callbacks and expiry.
#
# Every node runs its own instance (n1..n4, from fixtures.yaml); gossip state,
# arrival windows and token metadata are per instance, and GOSSIP_DIGEST_SYN,
# ACK and ACK2 travel between instances with `on:`.
#
# CONTRACT (read by coordination, hints-batchlog, paxos and others):
#   failure-detector.is-alive {endpoint} -> {endpoint, alive}: this node's view
#       (state gossiper@<node>.endpoint_state_map.<ep>.alive); always true for self.
#   token-metadata.get-write-endpoints {keyspace, token} -> {keyspace, token, natural, pending, replicas}
#   gossiper.get-endpoint-downtime {endpoint} -> {downtime_ms}: now - down_since_ms
#       (set by mark-dead only; markAlive's markDead keeps it).
#   Gossip subscribers: subscribe to endpoint-state-change-subscriber.{on-join,
#       on-change, on-alive, on-dead, on-remove, on-restart} (published sync).
schema_version: 1
id: cassandra
configs:
- id: phi-convict-threshold
  type: number
  value: 8.0
  default: 8.0
  summary: Phi above which the failure detector convicts (cassandra.yaml leaves it commented out).
  sources: ['conf/cassandra.yaml:1471', 'src/java/org/apache/cassandra/config/Config.java:177']
- id: gossip-interval-ms
  type: integer
  value: 1000
  default: 1000
  summary: Period of the GossipTask (a constant).
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:142']
- id: gossip-task-rounds
  type: integer
  value: 60
  default: 60
  summary: 'Model bound, not a Cassandra setting: the GossipTask runs every gossip interval until gossiper.stop, but a simulated timer needs a finite count (at most 1000 per run), so gossiper.start schedules this many rounds (60 s of gossip). Lower it to stop the periodic task sooner.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2028-2031']
- id: ring-delay-ms
  type: integer
  value: 30000
  default: 30000
  summary: 'RING_DELAY: the time a joining, leaving or moving node waits for the ring to settle (-Dcassandra.ring_delay_ms).'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:313-325', 'src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:430']
- id: gossip-quarantine-delay-ms
  type: integer
  value: 60000
  default: 60000
  summary: QUARANTINE_DELAY = 2 * RING_DELAY; the fat-client timeout is half of it and the failed-bootstrap timeout ten times that.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:143', 'src/java/org/apache/cassandra/gms/Gossiper.java:158']
- id: very-long-time-ms
  type: integer
  value: 259200000
  default: 259200000
  summary: 'aVeryLongTime (3 days): the default expiry of a dead endpoint state.'
  sources: ['src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:624', 'src/java/org/apache/cassandra/gms/Gossiper.java:2434-2437']
- id: max-local-pause-ms
  type: integer
  value: 5000
  default: 5000
  summary: A pause of this node longer than this suppresses convictions.
  sources: ['src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:352', 'src/java/org/apache/cassandra/gms/FailureDetector.java:80-89']
- id: fd-initial-value-ms
  type: integer
  value: 2000
  default: 2000
  summary: The first arrival interval recorded for an endpoint (2 * gossip interval).
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:110-118', 'src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:225']
- id: broadcast-interval-ms
  type: integer
  value: 60000
  default: 60000
  summary: Period of the LOAD broadcast.
  sources: ['src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:76', 'src/java/org/apache/cassandra/service/LoadBroadcaster.java:37']
- id: shutdown-announce-delay-ms
  type: integer
  value: 2000
  default: 2000
  summary: How long Gossiper.stop waits after sending GOSSIP_SHUTDOWN.
  sources: ['src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:493', 'src/java/org/apache/cassandra/gms/Gossiper.java:2297']
- id: consistent-range-movement
  type: boolean
  value: true
  default: true
  summary: Refuse to bootstrap while other nodes bootstrap, leave or move.
  sources: ['src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:176', 'src/java/org/apache/cassandra/service/StorageService.java:2108-2120']
- id: transfer-hints-on-decommission
  type: boolean
  value: true
  default: true
  summary: Stream hints to a peer on decommission (cassandra.yaml leaves it commented out).
  sources: ['conf/cassandra.yaml:120', 'src/java/org/apache/cassandra/config/Config.java:452']
- id: auto-bootstrap
  type: boolean
  value: true
  default: true
  summary: Bootstrap a new non-seed node (not set in cassandra.yaml).
  sources: ['src/java/org/apache/cassandra/config/Config.java:111']
- id: num-tokens
  type: integer
  value: 16
  summary: Tokens per node. cassandra.yaml sets 16; Config.java leaves it null. The model's ring keeps one token per node (storage-service.num_tokens), so this value is informational.
  sources: ['conf/cassandra.yaml:42', 'src/java/org/apache/cassandra/config/Config.java:132']
- id: cluster-name
  type: string
  attributes: {boundary: true}
  value: Test Cluster
  default: Test Cluster
  summary: Checked on every GOSSIP_DIGEST_SYN.
  sources: ['conf/cassandra.yaml:26', 'src/java/org/apache/cassandra/config/Config.java:81']
- id: partitioner
  type: string
  attributes: {boundary: true}
  value: org.apache.cassandra.dht.Murmur3Partitioner
  summary: Checked on every GOSSIP_DIGEST_SYN; Config.java has no default.
  sources: ['conf/cassandra.yaml:389', 'src/java/org/apache/cassandra/config/Config.java:109']
- id: block-for-peers-timeout-ms
  type: integer
  value: 10000
  default: 10000
  summary: PING timeout (block_for_peers_timeout_in_secs * 1000).
  sources: ['src/java/org/apache/cassandra/config/Config.java:694', 'src/java/org/apache/cassandra/config/DatabaseDescriptor.java:2386-2389']
- id: request-timeout-ms
  type: integer
  value: 10000
  default: 10000
  attributes: {boundary: true}
  summary: rpcTimeout (ECHO, GOSSIP_SHUTDOWN and other misc verbs).
  sources: ['conf/cassandra.yaml:1349', 'src/java/org/apache/cassandra/config/Config.java:142']
- id: read-request-timeout-ms
  type: integer
  value: 5000
  default: 5000
  attributes: {boundary: true}
  summary: Read timeout; part of the minimum rpc timeout.
  sources: ['conf/cassandra.yaml:1322', 'src/java/org/apache/cassandra/config/Config.java:145']
- id: range-request-timeout-ms
  type: integer
  value: 10000
  default: 10000
  attributes: {boundary: true}
  summary: Range read timeout; part of the minimum rpc timeout.
  sources: ['conf/cassandra.yaml:1326', 'src/java/org/apache/cassandra/config/Config.java:148']
- id: write-request-timeout-ms
  type: integer
  value: 2000
  default: 2000
  attributes: {boundary: true}
  summary: Write timeout; the minimum rpc timeout, so the callback reaper runs every 1000 ms.
  sources: ['conf/cassandra.yaml:1330', 'src/java/org/apache/cassandra/config/Config.java:151']
- id: counter-write-request-timeout-ms
  type: integer
  value: 5000
  default: 5000
  attributes: {boundary: true}
  summary: Counter write timeout; part of the minimum rpc timeout.
  sources: ['conf/cassandra.yaml:1334', 'src/java/org/apache/cassandra/config/Config.java:154']
- id: truncate-request-timeout-ms
  type: integer
  value: 60000
  default: 60000
  attributes: {boundary: true}
  summary: Truncate timeout; part of the minimum rpc timeout.
  sources: ['conf/cassandra.yaml:1345', 'src/java/org/apache/cassandra/config/Config.java:160']
components:
- id: gossiper
  name: Gossiper
  kind: module
  parent: membership
  layer: cluster
  summary: Owns the endpoint state map, the live and unreachable sets, seeds and the quarantine of removed endpoints.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:120-200']
  state:
    initial:
      enabled: true
      in_shadow_round: false
      first_syn_sent: true
      release_version: 5.0.9
      configured_seeds: []
      seeds: []
      live_endpoints: []
      unreachable_endpoints: []
      inflight_echo: []
      just_removed: []
      endpoint_state_map: {}
- id: gossiper-gossip-task
  name: Gossiper.GossipTask
  kind: function
  parent: gossiper
  layer: cluster
  summary: The once-a-second gossip round scheduled by Gossiper.start.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:337-400']
- id: failure-detector
  name: FailureDetector
  kind: module
  parent: membership
  layer: cluster
  summary: Phi accrual failure detector. Convicts an endpoint when PHI_FACTOR * phi exceeds phi_convict_threshold (8).
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:64-102']
  state:
    initial:
      phi_factor: 0.4342944819032518
      last_interpret_ms: 0
      last_pause_ms: 0
      arrival_samples: {}
- id: endpoint-state-change-subscriber
  name: IEndpointStateChangeSubscriber
  kind: module
  parent: membership
  layer: cluster
  summary: The gossiper's subscriber list. Its event interfaces are the topics StorageService, LoadBroadcaster and other areas subscribe to.
  sources: ['src/java/org/apache/cassandra/gms/IEndpointStateChangeSubscriber.java:24-58']
- id: gossip-verb-handler
  name: GossipVerbHandler
  kind: function
  parent: membership
  layer: cluster
  summary: Base class of the gossip digest handlers; records when the gossip stage last processed a message.
  sources: ['src/java/org/apache/cassandra/gms/GossipVerbHandler.java:24-30']
- id: gossip-digest-syn-verb-handler
  name: GossipDigestSynVerbHandler
  kind: function
  parent: membership
  layer: cluster
  summary: Receives GOSSIP_DIGEST_SYN, compares digests and answers with GOSSIP_DIGEST_ACK.
  sources: ['src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:36-131']
- id: gossip-digest-ack-verb-handler
  name: GossipDigestAckVerbHandler
  kind: function
  parent: membership
  layer: cluster
  summary: Receives GOSSIP_DIGEST_ACK, applies the states it carries and answers with GOSSIP_DIGEST_ACK2.
  sources: ['src/java/org/apache/cassandra/gms/GossipDigestAckVerbHandler.java:35-104']
- id: gossip-digest-ack2-verb-handler
  name: GossipDigestAck2VerbHandler
  kind: function
  parent: membership
  layer: cluster
  summary: Receives GOSSIP_DIGEST_ACK2 and applies the states it carries.
  sources: ['src/java/org/apache/cassandra/gms/GossipDigestAck2VerbHandler.java:28-54']
- id: gossip-shutdown-verb-handler
  name: GossipShutdownVerbHandler
  kind: function
  parent: membership
  layer: cluster
  summary: Receives GOSSIP_SHUTDOWN from a peer that is shutting down and marks it down.
  sources: ['src/java/org/apache/cassandra/gms/GossipShutdownVerbHandler.java:26-50']
- id: echo-verb-handler
  name: EchoVerbHandler
  kind: function
  parent: membership
  layer: cluster
  summary: Answers ECHO_REQ (sent by Gossiper.markAlive) unless this node is shutting down.
  sources: ['src/java/org/apache/cassandra/service/EchoVerbHandler.java:30-49']
- id: token-metadata
  name: TokenMetadata
  kind: module
  parent: membership
  layer: cluster
  summary: 'The token ring: normal tokens, bootstrapping tokens, leaving and moving endpoints, host ids and pending ranges.'
  description: The model keeps one token per node (cassandra.yaml num_tokens is 16) so ring walks stay small. Natural replicas are computed with SimpleStrategy's walk (one DC, one rack); replication factors
    per keyspace are model inputs here because the schema area owns keyspace metadata.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:55-117']
  state:
    initial:
      default_rf: 3
      keyspace_rf: {}
      ring: []
      bootstrap_tokens: []
      leaving_endpoints: []
      moving_endpoints: []
      pending_ranges: []
      host_ids: {}
- id: pending-range-calculator-service
  name: PendingRangeCalculatorService
  kind: module
  parent: membership
  layer: cluster
  summary: Single-threaded executor that recalculates pending ranges after every ring change.
  sources: ['src/java/org/apache/cassandra/service/PendingRangeCalculatorService.java:39-62']
- id: storage-service
  name: StorageService (lifecycle)
  kind: module
  parent: membership
  layer: cluster
  summary: 'Node lifecycle: startup and ring join, bootstrap, decommission, move, removenode, drain, and the gossip subscriber that turns STATUS changes into ring changes.'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:956-1063']
  state:
    initial:
      operation_mode: NORMAL
      joined: true
      initialized: true
      is_shutdown: false
      is_decommissioning: false
      is_rebuilding: false
      is_bootstrap_mode: false
      bootstrap_state: COMPLETED
      start_gossip: true
      join_ring: true
      is_seed: false
      replacing: false
      survey_mode: false
      override_decommission: false
      num_tokens: 1
      saved_tokens: []
      replicating_nodes: []
      distributed_keyspaces: []
      user_tables: []
- id: load-broadcaster
  name: LoadBroadcaster
  kind: function
  parent: membership
  layer: cluster
  summary: Publishes this node's on-disk load as the LOAD gossip state every 60 s.
  sources: ['src/java/org/apache/cassandra/service/LoadBroadcaster.java:35-94']
  state:
    initial:
      broadcast_interval_ms: 60000
      local_load_bytes: 2097152
      load_info: {}
- id: boot-strapper
  name: BootStrapper
  kind: function
  parent: membership
  layer: cluster
  summary: Picks bootstrap tokens and streams the ranges a joining node will own.
  sources: ['src/java/org/apache/cassandra/dht/BootStrapper.java:63-130']
- id: range-streamer
  name: RangeStreamer
  kind: function
  parent: membership
  layer: cluster
  summary: Works out sources for the ranges to fetch and hands them to a StreamPlan.
  sources: ['src/java/org/apache/cassandra/dht/RangeStreamer.java:81-120']
- id: messaging-service
  name: MessagingService
  kind: module
  parent: messaging
  layer: network
  summary: Sends internode messages, registers response callbacks and manages outbound connection pools.
  sources: ['src/java/org/apache/cassandra/net/MessagingService.java:207-260']
- id: request-callbacks
  name: RequestCallbacks
  kind: module
  parent: messaging
  layer: network
  summary: Map of outstanding response callbacks keyed by (message id, peer), with a reaper that expires them at half the minimum rpc timeout.
  sources: ['src/java/org/apache/cassandra/net/RequestCallbacks.java:58-72']
  state:
    initial:
      expiration_interval_ms: 1000
      callbacks: {}
- id: request-callback
  name: RequestCallback
  kind: function
  parent: messaging
  layer: network
  summary: The callback a sender registers; onResponse or onFailure is invoked when the reply arrives or the request expires.
  sources: ['src/java/org/apache/cassandra/net/RequestCallback.java:31-58']
- id: response-verb-handler
  name: ResponseVerbHandler
  kind: function
  parent: messaging
  layer: network
  summary: Handles every *_RSP verb by removing the matching callback and invoking it.
  sources: ['src/java/org/apache/cassandra/net/ResponseVerbHandler.java:29-61']
- id: ping-verb-handler
  name: PingVerbHandler
  kind: function
  parent: messaging
  layer: network
  summary: Answers PING_REQ on the requested connection type (used by the startup connectivity check).
  sources: ['src/java/org/apache/cassandra/net/PingVerbHandler.java:20-29']
- id: outbound-message-queue
  name: OutboundMessageQueue
  kind: queue
  parent: messaging
  layer: network
  summary: Per-connection queue; while disconnected it prunes expired messages every 100 ms.
  sources: ['src/java/org/apache/cassandra/net/OutboundMessageQueue.java:209-220']
  state:
    initial:
      queue: []
- id: outbound-connections-unused-connection-monitor
  name: OutboundConnections.UnusedConnectionMonitor
  kind: function
  parent: messaging
  layer: network
  summary: Periodically interrupts idle outbound connections and closes those to endpoints gossip no longer knows.
  sources: ['src/java/org/apache/cassandra/net/OutboundConnections.java:273-340']
  state:
    initial:
      connections: []
  tags: [incidental]
  description: Its per-endpoint submitted-message counters are metrics, so its state is incidental.
- id: server-event-notifier
  name: Server.EventNotifier
  parent: transport
  attributes: {boundary: true, owner: transport}
  sources: ['src/java/org/apache/cassandra/transport/Server.java:396']
- id: stream-plan
  name: StreamPlan
  parent: repair-streaming
  attributes: {boundary: true, owner: repair-streaming}
  sources: ['src/java/org/apache/cassandra/streaming/StreamPlan.java:39']
- id: hints-service
  name: HintsService
  parent: hints-batchlog
  attributes: {boundary: true, owner: hints-batchlog}
  sources: ['src/java/org/apache/cassandra/hints/HintsService.java:71']
- id: batchlog-manager
  name: BatchlogManager
  parent: hints-batchlog
  attributes: {boundary: true, owner: hints-batchlog}
  sources: ['src/java/org/apache/cassandra/batchlog/BatchlogManager.java:87']
- id: messaging-service-mbean-impl
  name: MessagingServiceMBeanImpl
  kind: module
  parent: messaging
  summary: MessagingService's JMX operations and metrics.
  sources: ['src/java/org/apache/cassandra/net/MessagingServiceMBeanImpl.java:276-279']
- id: column-family-store
  name: ColumnFamilyStore
  parent: write-path
  attributes: {boundary: true, owner: write-path}
  sources: ['src/java/org/apache/cassandra/db/ColumnFamilyStore.java:194']
schemas:
- id: MembershipEndpointState
  summary: 'One endpoint''s gossip state (EndpointState: heartbeat plus application states). ''alive'' is local only and never gossiped.'
  schema:
    type: object
    required: [endpoint, generation, heartbeat, max_version, status]
    properties:
      endpoint:
        type: string
        examples: [n2]
      generation:
        type: integer
        examples: [1793314800]
      heartbeat:
        type: integer
        examples: [350]
      max_version:
        type: integer
        examples: [360]
      status:
        type: string
        enum: [NORMAL, BOOT, BOOT_REPLACE, LEAVING, LEFT, MOVING, removing, removed, hibernate, shutdown, '']
        examples: [NORMAL]
      host_id:
        type: string
        examples: [6d194555-f6eb-41d0-c000-000000000002]
      dc:
        type: string
        examples: [datacenter1]
      rack:
        type: string
        examples: [rack1]
      tokens:
        type: array
        items: {type: integer}
        examples:
        - [0]
      load:
        type: integer
        examples: [1048576]
      rpc_ready: {type: boolean, default: true}
      alive: {type: boolean}
- id: MembershipGossipDigest
  schema:
    type: object
    required: [endpoint, generation, max_version]
    properties:
      endpoint:
        type: string
        examples: [n2]
      generation:
        type: integer
        examples: [1793314800]
      max_version:
        type: integer
        examples: [360]
- id: MembershipGossipDigestSyn
  summary: GossipDigestSyn plus the message's from/to.
  schema:
    type: object
    required: [from, cluster_name, partitioner, digests]
    properties:
      from:
        type: string
        examples: [n2]
      cluster_name:
        type: string
        examples: [Test Cluster]
      partitioner:
        type: string
        examples: [org.apache.cassandra.dht.Murmur3Partitioner]
      digests:
        type: array
        items: {$ref: MembershipGossipDigest}
- id: MembershipGossipDigestAck
  schema:
    type: object
    required: [from, digests, states]
    properties:
      from:
        type: string
        examples: [n2]
      digests:
        type: array
        items: {$ref: MembershipGossipDigest}
      states:
        type: array
        items: {$ref: MembershipEndpointState}
- id: MembershipGossipDigestAck2
  schema:
    type: object
    required: [from, states]
    properties:
      from:
        type: string
        examples: [n2]
      states:
        type: array
        items: {$ref: MembershipEndpointState}
- id: MembershipGossipShutdown
  schema:
    type: object
    required: [from]
    properties:
      from:
        type: string
        examples: [n2]
      state: {$ref: MembershipEndpointState}
- id: MembershipEndpoint
  schema:
    type: object
    required: [endpoint]
    properties:
      endpoint:
        type: string
        examples: [n2]
- id: MembershipIsAliveResponse
  schema:
    type: object
    required: [endpoint, alive]
    properties:
      endpoint:
        type: string
        examples: [n2]
      alive: {type: boolean}
- id: MembershipReplicaLookupRequest
  schema:
    type: object
    required: [keyspace, token]
    properties:
      keyspace:
        type: string
        examples: [ks1]
      token:
        type: integer
        examples: [100]
- id: MembershipReplicaLookupResponse
  schema:
    type: object
    required: [keyspace, token, natural, pending, replicas]
    properties:
      keyspace:
        type: string
        examples: [ks1]
      token:
        type: integer
        examples: [100]
      natural:
        type: array
        items: {type: string}
        examples:
        - [n3, n1, n2]
      pending:
        type: array
        items: {type: string}
        examples:
        - []
      replicas:
        type: array
        items: {type: string}
        examples:
        - [n3, n1, n2]
- id: MembershipInternodeResponse
  summary: A response message as ResponseVerbHandler sees it.
  schema:
    type: object
    required: [id, from, verb]
    properties:
      id:
        type: integer
        examples: [7001]
      from:
        type: string
        examples: [n2]
      verb:
        type: string
        enum: [ECHO_RSP, PING_RSP, FAILURE_RSP, REQUEST_RSP, INTERNAL_RSP]
        examples: [ECHO_RSP]
      failure: {type: boolean, default: false}
      failure_reason:
        type: string
        enum: [UNKNOWN, READ_TOO_MANY_TOMBSTONES, TIMEOUT, INCOMPATIBLE_SCHEMA, READ_SIZE, NODE_DOWN]
        examples: [UNKNOWN]
- id: MembershipLifecycleResult
  schema:
    type: object
    required: [operation_mode]
    properties:
      operation_mode:
        type: string
        enum: [STARTING, NORMAL, JOINING, JOINING_FAILED, LEAVING, DECOMMISSIONED, DECOMMISSION_FAILED, MOVING, DRAINING, DRAINED]
        examples: [NORMAL]
      detail: {type: string}
interfaces:
- component: failure-detector
  name: is-alive
  kind: function
  summary: 'Whether this node thinks an endpoint is up: always true for itself, otherwise its own gossiper''s EndpointState.isAlive (false when unknown).'
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:299-311', 'src/java/org/apache/cassandra/gms/EndpointState.java:248-251']
  request: MembershipEndpoint
  response: MembershipIsAliveResponse
  behavior:
  - if: input.endpoint == self
    then:
    - title: This node is always alive to itself
      source: src/java/org/apache/cassandra/gms/FailureDetector.java:301-302
      return: {endpoint: = input.endpoint, alive: true}
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.endpoint}
    as: ep
  - return: {endpoint: = input.endpoint, alive: = !has(vars.ep.value.unknown) && has(vars.ep.value.alive) && vars.ep.value.alive}
- component: failure-detector
  name: report
  kind: function
  summary: Records a heartbeat arrival for an endpoint in this node's arrival window (the first sample seeds the 2000 ms initial interval).
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:313-333', 'src/java/org/apache/cassandra/gms/FailureDetector.java:509-533']
  request: MembershipEndpoint
  store:
    table: arrival_samples
    op: put
    key: = input.endpoint
    value: {t_last_ms: = now, mean_ms: '= input.endpoint in state.arrival_samples ? state.arrival_samples[input.endpoint].mean_ms : config[''fd-initial-value-ms'']'}
- component: failure-detector
  name: arrival-samples-get
  kind: function
  summary: Reads an endpoint's arrival window (arrivalSamples.get).
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:337-341']
  request: MembershipEndpoint
  store:
    table: arrival_samples
    op: get
    key: = input.endpoint
    default: {missing: true}
- component: failure-detector
  name: remove
  kind: function
  summary: Drops an endpoint's arrival window.
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:389-392']
  request: MembershipEndpoint
  store: {table: arrival_samples, op: delete, key: = input.endpoint}
- component: failure-detector
  name: interpret
  kind: function
  summary: Computes phi for an endpoint and convicts it when PHI_FACTOR * phi > phi_convict_threshold, unless this node itself paused for more than max_local_pause.
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:335-378', 'src/java/org/apache/cassandra/gms/FailureDetector.java:541-547']
  request: MembershipEndpoint
  response:
    type: object
    properties:
      endpoint: {type: string}
      phi: {type: number}
      convicted: {type: boolean}
      skipped: {type: string}
  behavior:
  - call: failure-detector.arrival-samples-get
    input: {endpoint: = input.endpoint}
    as: win
  - if: has(vars.win.value.missing)
    then:
    - return: {endpoint: = input.endpoint, convicted: false, skipped: no arrival window}
  - title: lastInterpret starts at construction time
    detail: The detector sets lastInterpret when it is created, so the first interpret never sees a pause.
    source: src/java/org/apache/cassandra/gms/FailureDetector.java:77-78
    set: {vars.diff: '= state.last_interpret_ms == 0 ? 0 : now - state.last_interpret_ms', state.last_interpret_ms: = now}
  - if: vars.diff > config['max-local-pause-ms']
    then:
    - title: Local pause detected, nobody is marked down
      detail: The time since the previous interpret exceeds max_local_pause, so this node was probably paused (GC) and silence is not the peers' fault.
      source: src/java/org/apache/cassandra/gms/FailureDetector.java:345-350
      set: {state.last_pause_ms: = now, ctx.fd_local_pause: true}
    - return: {endpoint: = input.endpoint, convicted: false, skipped: local pause}
  - if: state.last_pause_ms != 0 && now - state.last_pause_ms < config['max-local-pause-ms']
    then:
    - title: Still inside the pause window
      source: src/java/org/apache/cassandra/gms/FailureDetector.java:351-355
      return: {endpoint: = input.endpoint, convicted: false, skipped: recent local pause}
  - set: {vars.phi: = double(now - vars.win.value.t_last_ms) / double(vars.win.value.mean_ms)}
  - if: state.phi_factor * vars.phi > config['phi-convict-threshold']
    then:
    - title: Convict when PHI_FACTOR * phi exceeds the threshold
      source: src/java/org/apache/cassandra/gms/FailureDetector.java:360-367
      call: gossiper.convict
      input: {endpoint: = input.endpoint, phi: = vars.phi}
    - return: {endpoint: = input.endpoint, phi: = vars.phi, convicted: true}
  - return: {endpoint: = input.endpoint, phi: = vars.phi, convicted: false}
- component: failure-detector
  name: force-conviction
  kind: function
  summary: Notifies the listeners (the Gossiper) that an endpoint is convicted, regardless of phi.
  sources: ['src/java/org/apache/cassandra/gms/FailureDetector.java:380-387']
  request: MembershipEndpoint
  behavior:
  - call: gossiper.convict
    input: {endpoint: = input.endpoint, phi: '= config[''phi-convict-threshold'']'}
- component: gossiper
  name: get-endpoint-state-for-endpoint
  kind: function
  summary: Reads an endpoint's state from the endpoint state map (unknown endpoints come back with unknown=true).
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1234-1237']
  request: MembershipEndpoint
  store:
    table: endpoint_state_map
    op: get
    key: = input.endpoint
    default:
      endpoint: = input.endpoint
      unknown: true
      alive: false
      status: ''
      generation: 0
      heartbeat: 0
      max_version: 0
      tokens: []
- component: gossiper
  name: endpoint-state-map-put
  kind: function
  summary: Puts a whole endpoint state into the map (handleMajorStateChange, markAsShutdown).
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1552']
  request:
    type: object
    required: [endpoint, state]
    properties:
      endpoint: {type: string}
      state: {$ref: MembershipEndpointState}
  store: {table: endpoint_state_map, op: put, key: = input.endpoint, value: = input.state}
- component: gossiper
  name: endpoint-state-map-remove
  kind: function
  summary: Removes an endpoint's state from the map.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:706']
  request: MembershipEndpoint
  store: {table: endpoint_state_map, op: delete, key: = input.endpoint}
- component: gossiper
  name: endpoint-state-mark-alive
  kind: function
  summary: EndpointState.markAlive plus updateTimestamp.
  sources: ['src/java/org/apache/cassandra/gms/EndpointState.java:254-257']
  request: MembershipEndpoint
  errors:
  - {code: not_found}
  store:
    table: endpoint_state_map
    op: update
    key: = input.endpoint
    value: {alive: true, update_ms: = now}
- component: gossiper
  name: endpoint-state-mark-dead
  kind: function
  summary: EndpointState.markDead only clears isAlive; the down-since time is kept by the gossiper's unreachable map.
  sources: ['src/java/org/apache/cassandra/gms/EndpointState.java:260-263']
  request: MembershipEndpoint
  errors:
  - {code: not_found}
  store:
    table: endpoint_state_map
    op: update
    key: = input.endpoint
    value: {alive: false}
- component: gossiper
  name: endpoint-state-add-application-states
  kind: function
  summary: Merges newer application states (and the heartbeat) into an endpoint's state.
  sources: ['src/java/org/apache/cassandra/gms/EndpointState.java:166-180']
  request:
    type: object
    required: [endpoint, changes]
    properties:
      endpoint: {type: string}
      changes: {type: object}
  errors:
  - {code: not_found}
  store: {table: endpoint_state_map, op: update, key: = input.endpoint, value: = input.changes}
- component: gossiper
  name: endpoint-state-update-heart-beat
  kind: function
  summary: Increments this node's heartbeat version at the start of each gossip round.
  sources: ['src/java/org/apache/cassandra/gms/EndpointState.java:100-104']
  store:
    table: endpoint_state_map
    op: incr
    key: = self
    value: {heartbeat: 1, max_version: 1}
- component: gossiper
  name: is-enabled
  kind: function
  summary: Whether the gossip task is scheduled, plus whether a shadow round is running and a SYN was sent.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2305-2309']
  response:
    type: object
    properties:
      enabled: {type: boolean}
      in_shadow_round: {type: boolean}
      first_syn_sent: {type: boolean}
  behavior:
  - return: {enabled: = state.enabled, in_shadow_round: = state.in_shadow_round, first_syn_sent: = state.first_syn_sent}
- component: gossiper
  name: get-live-members
  kind: function
  summary: The live endpoints plus this node.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:502-508']
  response:
    type: object
    properties:
      members:
        type: array
        items: {type: string}
  behavior:
  - return: {members: '= state.endpoint_state_map.filter(e, e != self && (!has(state.endpoint_state_map[e].alive) || state.endpoint_state_map[e].alive)) + [self]'}
- component: gossiper
  name: seen-any-seed
  kind: function
  summary: Whether the endpoint state map holds any seed.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:447-475']
  response:
    type: object
    properties:
      seen: {type: boolean}
  behavior:
  - return: {seen: '= state.seeds.exists(s, s in state.endpoint_state_map)'}
- component: gossiper
  name: get-seeds
  kind: function
  summary: The current seed list (without this node unless configured so).
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2187-2196', 'src/java/org/apache/cassandra/gms/GossiperMBean.java:36']
  response:
    type: object
    properties:
      seeds:
        type: array
        items: {type: string}
  behavior:
  - return: {seeds: = state.seeds}
- component: gossiper-gossip-task
  name: run
  kind: function
  summary: 'One gossip round on this node: bump the heartbeat, build digests, SYN a random live member, maybe an unreachable one, maybe a seed, then run the status check.'
  attributes: {schedule: 'every gossip-interval-ms (1000), scheduleWithFixedDelay'}
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:337-400', 'src/java/org/apache/cassandra/gms/Gossiper.java:2028-2031']
  behavior:
  - {call: gossiper.is-enabled, as: en}
  - if: '!vars.en.value.enabled'
    then:
    - title: gossiper.stop cancelled the scheduled task
      source: src/java/org/apache/cassandra/gms/Gossiper.java:2301-2302
      return: {gossiped: false}
  - {title: Update the local heartbeat, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:348-349', call: gossiper.endpoint-state-update-heart-beat}
  - {call: gossiper.make-gossip-digest, as: dig}
  - if: size(vars.dig.value.digests) == 0
    then:
    - return: {gossiped: false}
  - title: Gossip to a random live member
    source: src/java/org/apache/cassandra/gms/Gossiper.java:362-363
    call: gossiper.do-gossip-to-live-member
    input: {digests: = vars.dig.value.digests}
    as: live
  - title: Maybe gossip to an unreachable member
    source: src/java/org/apache/cassandra/gms/Gossiper.java:365-366
    call: gossiper.maybe-gossip-to-unreachable-member
    input: {digests: = vars.dig.value.digests}
  - title: Maybe gossip to a seed
    detail: Only when the live member chosen was not a seed, or fewer live endpoints than seeds are known.
    source: src/java/org/apache/cassandra/gms/Gossiper.java:384-385
    call: gossiper.maybe-gossip-to-seed
    input: {digests: = vars.dig.value.digests, gossiped_to_seed: = vars.live.value.to_seed}
  - {call: gossiper.do-status-check}
  - return: {gossiped: true, to: = vars.live.value.to}
- component: gossiper
  name: make-gossip-digest
  kind: function
  summary: One digest (endpoint, generation, max version) per endpoint in the state map, including this node.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:811-844']
  response:
    type: object
    properties:
      digests:
        type: array
        items: {$ref: MembershipGossipDigest}
  behavior:
  - set:
      vars.digests: []
  - foreach: = state.endpoint_state_map
    as: es
    index: ep
    steps:
    - set: {vars.digests: '= vars.digests + [{''endpoint'': vars.ep, ''generation'': vars.es.generation, ''max_version'': vars.es.max_version}]'}
  - return: {digests: = vars.digests}
- component: gossiper
  name: do-gossip-to-live-member
  kind: function
  summary: Sends the SYN to one live endpoint drawn at random and reports whether it was a seed.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1006-1012', 'src/java/org/apache/cassandra/gms/Gossiper.java:984-1003']
  request:
    type: object
    properties:
      digests:
        type: array
        items: {$ref: MembershipGossipDigest}
  response:
    type: object
    properties:
      sent: {type: boolean}
      to: {type: string}
      to_seed: {type: boolean}
  behavior:
  - title: Live peers are the endpoints whose state is marked alive (markAlive/markDead keep liveEndpoints in step)
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1437-1472
    set: {vars.live: '= state.endpoint_state_map.filter(e, e != self && (!has(state.endpoint_state_map[e].alive) || state.endpoint_state_map[e].alive))'}
  - if: size(vars.live) == 0
    then:
    - return: {sent: false, to: '', to_seed: false}
  - title: Pick the target with random.nextInt(size)
    source: src/java/org/apache/cassandra/gms/Gossiper.java:988-993
    set: {vars.to: '= vars.live[size(vars.live) == 1 ? 0 : random(size(vars.live))]', state.first_syn_sent: true}
  - title: Send GOSSIP_DIGEST_SYN (fire and forget)
    source: src/java/org/apache/cassandra/gms/Gossiper.java:998
    emit: gossip-digest-syn-verb-handler.do-verb
    'on': = vars.to
    input: {from: = self, cluster_name: '= config[''cluster-name'']', partitioner: '= config[''partitioner'']', digests: = input.digests}
  - return: {sent: true, to: = vars.to, to_seed: = vars.to in state.seeds}
- component: gossiper
  name: maybe-gossip-to-unreachable-member
  kind: function
  summary: With probability unreachable / (live + 1), sends the SYN to an unreachable endpoint that is not in a dead state.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1015-1030']
  request:
    type: object
    properties:
      digests:
        type: array
        items: {$ref: MembershipGossipDigest}
  behavior:
  - set: {vars.live: '= state.endpoint_state_map.filter(e, e != self && (!has(state.endpoint_state_map[e].alive) || state.endpoint_state_map[e].alive))', vars.unreachable: '= state.endpoint_state_map.filter(e, e != self && has(state.endpoint_state_map[e].alive) && !state.endpoint_state_map[e].alive)'}
  - if: size(vars.unreachable) == 0
    then:
    - return: {sent: false}
  - set: {vars.candidates: '= vars.unreachable.filter(e, !has(state.endpoint_state_map[e].status) || !(state.endpoint_state_map[e].status in [''removing'', ''removed'', ''LEFT'', ''hibernate'']))', vars.prob: =
        double(size(vars.unreachable)) / double(size(vars.live) + 1)}
  - title: random.nextDouble() < probability
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1022-1024
    choice: roll
    default: '= size(vars.candidates) > 0 && double(random(1000000)) / 1000000.0 < vars.prob ? ''send'' : ''skip'''
    options:
      send:
      - set: {vars.to: '= vars.candidates[size(vars.candidates) == 1 ? 0 : random(size(vars.candidates))]'}
      - emit: gossip-digest-syn-verb-handler.do-verb
        'on': = vars.to
        input: {from: = self, cluster_name: '= config[''cluster-name'']', partitioner: '= config[''partitioner'']', digests: = input.digests}
      - return: {sent: true, to: = vars.to}
      skip:
      - return: {sent: false}
- component: gossiper
  name: maybe-gossip-to-seed
  kind: function
  summary: Gossips to a random seed when no live endpoint is known, or with probability seeds / (live + unreachable); never when this node is the only seed.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1033-1056']
  request:
    type: object
    properties:
      digests:
        type: array
        items: {$ref: MembershipGossipDigest}
      gossiped_to_seed: {type: boolean}
  behavior:
  - set: {vars.live: '= state.endpoint_state_map.filter(e, e != self && (!has(state.endpoint_state_map[e].alive) || state.endpoint_state_map[e].alive))', vars.unreachable: '= state.endpoint_state_map.filter(e, e != self && has(state.endpoint_state_map[e].alive) && !state.endpoint_state_map[e].alive)'}
  - if: has(input.gossiped_to_seed) && input.gossiped_to_seed && size(vars.live) >= size(state.seeds)
    then:
    - return: {sent: false}
  - if: size(state.seeds) == 0 || (size(state.seeds) == 1 && state.seeds[0] == self)
    then:
    - title: This node is the only seed
      source: src/java/org/apache/cassandra/gms/Gossiper.java:1038-1041
      return: {sent: false}
  - set: {vars.seed: '= state.seeds[size(state.seeds) == 1 ? 0 : random(size(state.seeds))]', vars.prob: '= size(vars.live) == 0 ? 1.0 : double(size(state.seeds)) / double(size(vars.live)
        + size(vars.unreachable))'}
  - choice: roll
    default: '= vars.prob >= 1.0 || double(random(1000000)) / 1000000.0 <= vars.prob ? ''send'' : ''skip'''
    options:
      send:
      - title: Send the SYN to a seed
        source: src/java/org/apache/cassandra/gms/Gossiper.java:1043-1053
        emit: gossip-digest-syn-verb-handler.do-verb
        'on': = vars.seed
        input: {from: = self, cluster_name: '= config[''cluster-name'']', partitioner: '= config[''partitioner'']', digests: = input.digests}
      - return: {sent: true, to: = vars.seed}
      skip:
      - return: {sent: false}
- component: gossiper
  name: do-status-check
  kind: function
  summary: Runs the failure detector over every other endpoint, evicts silent fat clients and expired dead states, and ends expired quarantines.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1126-1206', 'src/java/org/apache/cassandra/gms/Gossiper.java:1208-1213']
  behavior:
  - foreach: = state.endpoint_state_map
    as: es
    index: ep
    steps:
    - if: vars.ep == self
      then:
      - {continue: true}
    - title: Interpret the failure detector
      source: src/java/org/apache/cassandra/gms/Gossiper.java:1154
      call: failure-detector.interpret
      input: {endpoint: = vars.ep}
    - call: gossiper.get-endpoint-state-for-endpoint
      input: {endpoint: = vars.ep}
      as: cur
    - if: has(vars.cur.value.unknown)
      then:
      - {continue: true}
    - call: token-metadata.is-member
      input: {endpoint: = vars.ep}
      as: mem
    - set: {vars.dead_state: '= vars.cur.value.status in [''removing'', ''removed'', ''LEFT'', ''hibernate'']', vars.quarantined: '= state.just_removed.exists(j, j.endpoint == vars.ep)', vars.fat_timeout: '=
          vars.cur.value.status in [''BOOT'', ''BOOT_REPLACE''] ? (config[''gossip-quarantine-delay-ms''] / 2 * 10) : (config[''gossip-quarantine-delay-ms''] / 2)', vars.silent_ms: '= now - (has(vars.cur.value.update_ms)
          ? vars.cur.value.update_ms : now)'}
    - if: '!vars.dead_state && !vars.mem.value.member && !vars.quarantined && vars.silent_ms > vars.fat_timeout'
      then:
      - {title: Silent fat client is removed from gossip, detail: 'A gossip-only member (not dead, not in the token ring) silent for longer than the fat client timeout (QUARANTINE_DELAY / 2 = 30 s) is removed
          and evicted.', source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1158-1178'}
      - call: gossiper.remove-endpoint
        input: {endpoint: = vars.ep}
      - call: gossiper.evict-from-membership
        input: {endpoint: = vars.ep}
      - set: {ctx.evicted: '= (has(ctx.evicted) ? ctx.evicted : []) + [vars.ep]'}
      - {continue: true}
    - if: '!(has(vars.cur.value.alive) && vars.cur.value.alive) && now > (has(vars.cur.value.expire_time_ms) ? vars.cur.value.expire_time_ms : now + config[''very-long-time-ms'']) && !vars.mem.value.member'
      then:
      - {title: Expired dead state is evicted, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1180-1190'}
      - call: gossiper.evict-from-membership
        input: {endpoint: = vars.ep}
      - set: {ctx.evicted: '= (has(ctx.evicted) ? ctx.evicted : []) + [vars.ep]'}
  - title: Quarantines older than QUARANTINE_DELAY end
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1194-1205
    set: {state.just_removed: '= state.just_removed.filter(j, now - j.at_ms <= config[''gossip-quarantine-delay-ms''])'}
- component: gossiper
  name: convict
  kind: function
  summary: 'Failure detector listener: marks a convicted live endpoint down (or as shut down when its status is shutdown). Runs on the GOSSIP stage.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:606-628', 'src/java/org/apache/cassandra/gms/Gossiper.java:575-598', 'src/java/org/apache/cassandra/gms/Gossiper.java:585']
  request:
    type: object
    required: [endpoint]
    properties:
      endpoint: {type: string}
      phi: {type: number}
  behavior:
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.endpoint}
    as: ep
  - if: has(vars.ep.value.unknown) || !(has(vars.ep.value.alive) && vars.ep.value.alive)
    then:
    - {title: Unknown or already down, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:610-614'}
    - return: {convicted: false}
  - if: vars.ep.value.status == 'shutdown'
    then:
    - call: gossiper.mark-as-shutdown
      input: {endpoint: = input.endpoint}
    else:
    - call: gossiper.mark-dead
      input: {endpoint: = input.endpoint}
  - set: {ctx.convicted: '= (has(ctx.convicted) ? ctx.convicted : []) + [input.endpoint]'}
  - return: {convicted: true}
- component: gossiper
  name: mark-dead
  kind: function
  summary: Marks an endpoint down, moves it from the live set to the unreachable set (recording when) and notifies subscribers (onDead).
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1502-1531']
  request: MembershipEndpoint
  behavior:
  - call: gossiper.endpoint-state-mark-dead
    input: {endpoint: = input.endpoint}
  - title: silentlyMarkDead puts the endpoint in the unreachable map with the time
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1522-1530
    call: gossiper.endpoint-state-set-down-since
    input: {endpoint: = input.endpoint}
  - set: {state.live_endpoints: '= state.live_endpoints.filter(e, e != input.endpoint)', state.unreachable_endpoints: '= state.unreachable_endpoints.exists(e, e == input.endpoint) ? state.unreachable_endpoints
        : state.unreachable_endpoints + [input.endpoint]', state.inflight_echo: '= state.inflight_echo.filter(e, e != input.endpoint)'}
  - title: Notify subscribers (onDead)
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1509-1510
    publish: endpoint-state-change-subscriber.on-dead
    delivery: sync
    input: {endpoint: = input.endpoint}
- component: gossiper
  name: mark-alive
  kind: function
  summary: Before marking an endpoint up, marks it dead locally (without touching its down-since time) and sends ECHO_REQ; only the echo response marks it alive.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1437-1478', 'src/java/org/apache/cassandra/net/Verb.java:150']
  request: MembershipEndpoint
  behavior:
  - call: gossiper.endpoint-state-mark-dead
    input: {endpoint: = input.endpoint}
  - if: state.inflight_echo.exists(e, e == input.endpoint)
    then:
    - title: An echo is already in flight
      source: src/java/org/apache/cassandra/gms/Gossiper.java:1441-1443
      return: {echo_sent: false}
  - set: {state.inflight_echo: '= state.inflight_echo + [input.endpoint]'}
  - title: Send ECHO_REQ with a callback
    detail: Asynchronous. The callback's onResponse removes the in-flight echo and calls realMarkAlive; onFailure only removes it, so the endpoint stays down.
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1445-1472
    emit: messaging-service.send-with-callback
    input: {verb: ECHO_REQ, id: 9001, peer: = input.endpoint, timeout_ms: '= config[''request-timeout-ms'']'}
  - return: {echo_sent: true}
- component: gossiper
  name: remove-inflight-echo
  kind: function
  summary: Removes an endpoint from the in-flight echo set and says whether it was there.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1453']
  request: MembershipEndpoint
  response:
    type: object
    properties:
      was_inflight: {type: boolean}
  behavior:
  - set: {vars.was: '= state.inflight_echo.exists(e, e == input.endpoint)', state.inflight_echo: '= state.inflight_echo.filter(e, e != input.endpoint)'}
  - return: {was_inflight: = vars.was}
- component: gossiper
  name: real-mark-alive
  kind: function
  summary: Marks an endpoint up, adds it to the live set and notifies subscribers (onAlive).
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1481-1499']
  request: MembershipEndpoint
  behavior:
  - call: gossiper.endpoint-state-mark-alive
    input: {endpoint: = input.endpoint}
  - title: InetAddress is now UP
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1486-1492
    set: {state.live_endpoints: '= state.live_endpoints.exists(e, e == input.endpoint) ? state.live_endpoints : state.live_endpoints + [input.endpoint]', state.unreachable_endpoints: '= state.unreachable_endpoints.filter(e,
        e != input.endpoint)'}
  - publish: endpoint-state-change-subscriber.on-alive
    delivery: sync
    input: {endpoint: = input.endpoint}
- component: gossiper
  name: mark-as-shutdown
  kind: function
  summary: Marks a peer that announced its shutdown as down with status shutdown at the highest version, forces conviction and notifies onChange.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:660-680', 'src/java/org/apache/cassandra/gms/Gossiper.java:636-653']
  request:
    type: object
    required: [endpoint]
    properties:
      endpoint: {type: string}
      state: {$ref: MembershipEndpointState}
  behavior:
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.endpoint}
    as: ep
  - if: has(vars.ep.value.unknown)
    then:
    - return: {marked: false}
  - if: has(input.state) && input.state.status != 'shutdown'
    then:
    - title: The remote state must carry status shutdown
      source: src/java/org/apache/cassandra/gms/Gossiper.java:666-667
      fail: {code: assertion-error, message: 'Remote shutdown sent but was not with a shutdown status?'}
  - title: Status shutdown at the highest possible version
    source: src/java/org/apache/cassandra/gms/Gossiper.java:666-673
    call: gossiper.endpoint-state-add-application-states
    input:
      endpoint: = input.endpoint
      changes: {status: shutdown, rpc_ready: false, max_version: 2147483647}
  - call: gossiper.mark-dead
    input: {endpoint: = input.endpoint}
  - call: failure-detector.force-conviction
    input: {endpoint: = input.endpoint}
  - publish: endpoint-state-change-subscriber.on-change
    delivery: sync
    input: {endpoint: = input.endpoint, state: STATUS_WITH_PORT, value: shutdown}
  - return: {marked: true}
- component: gossiper
  name: handle-major-state-change
  kind: function
  summary: 'A new endpoint or a new generation: store the remote state, notify onRestart, mark alive (via echo) or dead, then notify onJoin.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1539-1574']
  request:
    type: object
    required: [endpoint, state]
    properties:
      endpoint: {type: string}
      state: {$ref: MembershipEndpointState}
  behavior:
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.endpoint}
    as: prev
  - call: gossiper.endpoint-state-map-put
    input: {endpoint: = input.endpoint, state: = input.state}
  - if: '!has(vars.prev.value.unknown)'
    then:
    - title: Known endpoint restarted (onRestart)
      source: src/java/org/apache/cassandra/gms/Gossiper.java:1554-1558
      publish: endpoint-state-change-subscriber.on-restart
      delivery: sync
      input: {endpoint: = input.endpoint, was_alive: = has(vars.prev.value.alive) && vars.prev.value.alive}
  - set: {vars.dead_state: '= input.state.status in [''removing'', ''removed'', ''LEFT'', ''hibernate'']'}
  - if: '!vars.dead_state'
    then:
    - title: Mark alive (echo first)
      source: src/java/org/apache/cassandra/gms/Gossiper.java:1560-1561
      call: gossiper.mark-alive
      input: {endpoint: = input.endpoint}
    else:
    - title: Dead state, mark dead
      source: src/java/org/apache/cassandra/gms/Gossiper.java:1562-1566
      call: gossiper.mark-dead
      input: {endpoint: = input.endpoint}
  - title: Notify onJoin
    source: src/java/org/apache/cassandra/gms/Gossiper.java:1567-1568
    publish: endpoint-state-change-subscriber.on-join
    delivery: sync
    input: {endpoint: = input.endpoint, status: = input.state.status}
  - if: input.state.status == 'shutdown'
    then:
    - call: gossiper.mark-as-shutdown
      input: {endpoint: = input.endpoint}
- component: gossiper
  name: notify-failure-detector
  kind: function
  summary: Reports heartbeats to the failure detector for remote states with a newer generation or a newer heartbeat version.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1385-1433']
  request:
    type: object
    required: [states]
    properties:
      states:
        type: array
        items: {$ref: MembershipEndpointState}
  behavior:
  - foreach: = input.states
    as: rs
    steps:
    - call: gossiper.get-endpoint-state-for-endpoint
      input: {endpoint: = vars.rs.endpoint}
      as: loc
    - if: has(vars.loc.value.unknown)
      then:
      - {continue: true}
    - if: vars.rs.generation > vars.loc.value.generation
      then:
      - if: '!(has(vars.loc.value.alive) && vars.loc.value.alive)'
        then:
        - {title: Generation changed; relearn intervals if it was down, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1408-1419'}
        - call: failure-detector.remove
          input: {endpoint: = vars.rs.endpoint}
      - call: failure-detector.report
        input: {endpoint: = vars.rs.endpoint}
      - {continue: true}
    - if: vars.rs.generation == vars.loc.value.generation && vars.rs.heartbeat > vars.loc.value.max_version
      then:
      - {title: Same generation and a newer heartbeat, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1422-1431'}
      - call: failure-detector.report
        input: {endpoint: = vars.rs.endpoint}
- component: gossiper
  name: apply-state-locally
  kind: function
  summary: 'Applies received endpoint states to this node''s map: new endpoints and newer generations are major state changes; newer versions in the same generation are merged and STATUS changes notified.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1710-1786', 'src/java/org/apache/cassandra/gms/Gossiper.java:1788-1845']
  request:
    type: object
    required: [states]
    properties:
      states:
        type: array
        items: {$ref: MembershipEndpointState}
  response:
    type: object
    properties:
      applied: {type: integer}
  behavior:
  - set: {vars.applied: 0}
  - foreach: = input.states
    as: rs
    steps:
    - if: vars.rs.endpoint == self && !state.in_shadow_round
      then:
      - {continue: true}
    - if: state.just_removed.exists(j, j.endpoint == vars.rs.endpoint)
      then:
      - title: Ignore quarantined endpoints
        source: src/java/org/apache/cassandra/gms/Gossiper.java:1719-1724
        set: {ctx.quarantine_ignored: '= (has(ctx.quarantine_ignored) ? ctx.quarantine_ignored : []) + [vars.rs.endpoint]'}
      - {continue: true}
    - call: gossiper.get-endpoint-state-for-endpoint
      input: {endpoint: = vars.rs.endpoint}
      as: loc
    - if: has(vars.loc.value.unknown)
      then:
      - title: New endpoint
        source: src/java/org/apache/cassandra/gms/Gossiper.java:1779-1784
        call: failure-detector.report
        input: {endpoint: = vars.rs.endpoint}
      - call: gossiper.handle-major-state-change
        input: {endpoint: = vars.rs.endpoint, state: = vars.rs}
      - set: {vars.applied: = vars.applied + 1}
      - {continue: true}
    - if: vars.rs.generation > now / 1000 + 31536000
      then:
      - title: Unbelievable generation is ignored
        source: src/java/org/apache/cassandra/gms/Gossiper.java:1745-1749
        set: {ctx.invalid_generation: = vars.rs.endpoint}
      - {continue: true}
    - if: vars.rs.generation > vars.loc.value.generation
      then:
      - title: Newer generation (restart)
        source: src/java/org/apache/cassandra/gms/Gossiper.java:1750-1756
        call: gossiper.handle-major-state-change
        input: {endpoint: = vars.rs.endpoint, state: = vars.rs}
      - set: {vars.applied: = vars.applied + 1}
      - {continue: true}
    - if: vars.rs.generation == vars.loc.value.generation
      then:
      - if: vars.rs.max_version > vars.loc.value.max_version
        then:
        - title: Newer versions are merged
          source: src/java/org/apache/cassandra/gms/Gossiper.java:1757-1766
          call: gossiper.endpoint-state-add-application-states
          input:
            endpoint: = vars.rs.endpoint
            changes: {status: = vars.rs.status, heartbeat: = vars.rs.heartbeat, max_version: = vars.rs.max_version, tokens: '= has(vars.rs.tokens) ? vars.rs.tokens : vars.loc.value.tokens'}
        - set: {vars.applied: = vars.applied + 1}
        - if: vars.rs.status != vars.loc.value.status
          then:
          - title: STATUS changes are notified first
            source: src/java/org/apache/cassandra/gms/Gossiper.java:1814-1827
            publish: endpoint-state-change-subscriber.on-change
            delivery: sync
            input: {endpoint: = vars.rs.endpoint, state: STATUS_WITH_PORT, value: = vars.rs.status}
      - if: '!(has(vars.loc.value.alive) && vars.loc.value.alive) && !(vars.loc.value.status in [''removing'', ''removed'', ''LEFT'', ''hibernate'']) && !(vars.rs.status in [''removing'', ''removed'', ''LEFT'',
          ''hibernate''])'
        then:
        - title: A down endpoint that is not dead gets an echo
          source: src/java/org/apache/cassandra/gms/Gossiper.java:1770-1771
          call: gossiper.mark-alive
          input: {endpoint: = vars.rs.endpoint}
      - {continue: true}
    - title: Older generation is ignored
      source: src/java/org/apache/cassandra/gms/Gossiper.java:1773-1777
      set: {ctx.older_generation_ignored: = vars.rs.endpoint}
  - return: {applied: = vars.applied}
- component: gossiper
  name: examine-gossiper
  kind: function
  summary: 'Compares received digests with local state: requests what the sender has that is newer, sends what this node has that is newer.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1946-2004', 'src/java/org/apache/cassandra/gms/Gossiper.java:1866-1872']
  request:
    type: object
    required: [digests]
    properties:
      digests:
        type: array
        items: {$ref: MembershipGossipDigest}
  response:
    type: object
    properties:
      delta_digests:
        type: array
        items: {$ref: MembershipGossipDigest}
      delta_states:
        type: array
        items: {$ref: MembershipEndpointState}
  behavior:
  - set:
      vars.dd: []
      vars.ds: []
  - foreach: = input.digests
    as: d
    steps:
    - call: gossiper.get-endpoint-state-for-endpoint
      input: {endpoint: = vars.d.endpoint}
      as: loc
    - set: {vars.l: = vars.loc.value}
    - if: has(vars.l.unknown)
      then:
      - {title: 'Nothing local, request everything', source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1998-2002'}
      - set: {vars.dd: '= vars.dd + [{''endpoint'': vars.d.endpoint, ''generation'': vars.d.generation, ''max_version'': 0}]'}
      - {continue: true}
    - if: vars.d.generation == vars.l.generation && vars.d.max_version == vars.l.max_version
      then:
      - {continue: true}
    - if: vars.d.generation > vars.l.generation
      then:
      - {title: 'Sender has a newer generation, request everything', source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1968-1972'}
      - set: {vars.dd: '= vars.dd + [{''endpoint'': vars.d.endpoint, ''generation'': vars.d.generation, ''max_version'': 0}]'}
      - {continue: true}
    - if: vars.d.generation < vars.l.generation || vars.d.endpoint == self
      then:
      - {title: 'Sender is behind (or asks about this node), send everything', source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1973-1977'}
      - set: {vars.ds: '= vars.ds + [vars.l]'}
      - {continue: true}
    - if: vars.d.max_version > vars.l.max_version
      then:
      - {title: 'Same generation, request or send the newer versions', source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1987-1995'}
      - set: {vars.dd: '= vars.dd + [{''endpoint'': vars.d.endpoint, ''generation'': vars.d.generation, ''max_version'': vars.l.max_version}]'}
      else:
      - set: {vars.ds: '= vars.ds + [vars.l]'}
  - return: {delta_digests: = vars.dd, delta_states: = vars.ds}
- component: gossiper
  name: examine-shadow-state
  kind: function
  summary: For a shadow-round SYN (no digests), every known non-empty endpoint state.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1893-1938']
  response:
    type: object
    properties:
      states:
        type: array
        items: {$ref: MembershipEndpointState}
  behavior:
  - set:
      vars.ds: []
  - foreach: = state.endpoint_state_map
    as: es
    steps:
    - set: {vars.ds: '= vars.ds + [vars.es]'}
  - return: {states: = vars.ds}
- component: gossiper
  name: get-state-for-version-bigger-than
  kind: function
  summary: The local state of an endpoint if it holds anything newer than the given version.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1325-1371']
  request:
    type: object
    required: [endpoint, version]
    properties:
      endpoint: {type: string}
      version: {type: integer}
  response:
    type: object
    properties:
      found: {type: boolean}
      state: {$ref: MembershipEndpointState}
  behavior:
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.endpoint}
    as: loc
  - if: '!has(vars.loc.value.unknown) && vars.loc.value.max_version > input.version'
    then:
    - return: {found: true, state: = vars.loc.value}
  - return: {found: false}
- component: gossiper
  name: maybe-finish-shadow-round
  kind: function
  summary: Leaves the startup shadow round once a respondent sends a full ACK.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2319-2357']
  request:
    type: object
    required: [respondent, respondent_in_shadow_round]
    properties:
      respondent: {type: string}
      respondent_in_shadow_round: {type: boolean}
      states:
        type: array
        items: {$ref: MembershipEndpointState}
  behavior:
  - if: '!state.in_shadow_round'
    then:
    - return: {finished: false}
  - if: '!input.respondent_in_shadow_round'
    then:
    - title: Full ACK received, exit the shadow round
      source: src/java/org/apache/cassandra/gms/Gossiper.java:2335-2339
      set: {state.in_shadow_round: false, ctx.shadow_round_finished_by: = input.respondent}
    - return: {finished: true}
  - title: Respondent is also in a shadow round
    source: src/java/org/apache/cassandra/gms/Gossiper.java:2341-2350
    set: {ctx.seed_in_shadow_round: = input.respondent}
  - return: {finished: false}
- component: gossiper
  name: remove-endpoint
  kind: function
  summary: 'Removes an endpoint from gossip but keeps its state: notifies onRemove, drops it from seeds and the live and unreachable sets, quarantines it and closes connections.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:718-746', 'src/java/org/apache/cassandra/gms/Gossiper.java:774-779']
  request: MembershipEndpoint
  behavior:
  - title: Subscribers first (onRemove)
    source: src/java/org/apache/cassandra/gms/Gossiper.java:721-723
    publish: endpoint-state-change-subscriber.on-remove
    delivery: sync
    input: {endpoint: = input.endpoint}
  - set: {state.seeds: '= state.seeds.filter(s, s != input.endpoint)', state.inflight_echo: '= state.inflight_echo.filter(e, e != input.endpoint)', state.live_endpoints: '= state.live_endpoints.filter(e,
        e != input.endpoint)', state.unreachable_endpoints: '= state.unreachable_endpoints.filter(e, e != input.endpoint)', state.just_removed: '= state.just_removed.filter(j, j.endpoint != input.endpoint)
        + [{''endpoint'': input.endpoint, ''at_ms'': now}]'}
  - call: messaging-service.close-outbound
    input: {endpoint: = input.endpoint}
- component: gossiper
  name: evict-from-membership
  kind: function
  summary: Removes an endpoint from gossip completely, including its state and failure-detector window, and quarantines it.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:701-713']
  request: MembershipEndpoint
  behavior:
  - set: {state.inflight_echo: '= state.inflight_echo.filter(e, e != input.endpoint)', state.unreachable_endpoints: '= state.unreachable_endpoints.filter(e, e != input.endpoint)', state.just_removed: '=
        state.just_removed.filter(j, j.endpoint != input.endpoint) + [{''endpoint'': input.endpoint, ''at_ms'': now}]'}
  - call: gossiper.endpoint-state-map-remove
    input: {endpoint: = input.endpoint}
  - call: failure-detector.remove
    input: {endpoint: = input.endpoint}
- component: gossiper
  name: add-local-application-state
  kind: function
  summary: Sets one of this node's application states at a higher version and fires onChange for it.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2262-2282', 'src/java/org/apache/cassandra/gms/Gossiper.java:2245-2260', 'src/java/org/apache/cassandra/gms/ApplicationState.java:30-75']
  request:
    type: object
    required: [state]
    properties:
      state:
        type: string
        enum: [STATUS, LOAD, SCHEMA, DC, RACK, RELEASE_VERSION, REMOVAL_COORDINATOR, INTERNAL_IP, RPC_ADDRESS, X_11_PADDING, SEVERITY, NET_VERSION, HOST_ID, TOKENS, RPC_READY, INTERNAL_ADDRESS_AND_PORT,
          NATIVE_ADDRESS_AND_PORT, STATUS_WITH_PORT, SSTABLE_VERSIONS, DISK_USAGE, INDEX_STATUS, X1, X2, X3, X4, X5, X6, X7, X8, X9, X10]
        examples: [STATUS_WITH_PORT]
      value:
        type: string
        examples: [NORMAL]
      tokens:
        type: array
        items: {type: integer}
      load: {type: integer}
  behavior:
  - set: {vars.me: '= state.endpoint_state_map[self]'}
  - call: gossiper.endpoint-state-add-application-states
    input: {endpoint: = self, changes: '= input.state == ''TOKENS'' ? {''tokens'': input.tokens, ''max_version'': vars.me.max_version + 1} : input.state == ''LOAD'' ? {''load'': input.load, ''max_version'':
        vars.me.max_version + 1} : input.state == ''RPC_READY'' ? {''rpc_ready'': input.value == ''true'', ''max_version'': vars.me.max_version + 1} : input.state == ''SCHEMA'' ? {''schema_version'': input.value,
        ''max_version'': vars.me.max_version + 1} : !(input.state in [''STATUS'', ''STATUS_WITH_PORT'']) ? {''app_states'': {input.state: has(input.value) ? input.value : ''''}, ''max_version'': vars.me.max_version
        + 1} : input.value == ''MOVING'' ? {''status'': input.value, ''max_version'': vars.me.max_version + 1, ''moving_to'': input.tokens[0]} : {''status'': input.value, ''max_version'': vars.me.max_version
        + 1}'}
  - title: Fire onChange
    source: src/java/org/apache/cassandra/gms/Gossiper.java:2259
    publish: endpoint-state-change-subscriber.on-change
    delivery: sync
    input: {endpoint: = self, state: = input.state, value: '= has(input.value) ? input.value : ''''', load: '= has(input.load) ? input.load : 0'}
- component: gossiper
  name: start
  kind: function
  summary: Builds the seed list (the configured seeds without this node), creates this node's endpoint state with the new generation if it has none, and schedules the gossip task every second.
  description: 'The GossipTask runs every 1000 ms until gossiper.stop; the model schedules config gossip-task-rounds rounds (default 60), the first one interval after start. Timer deliveries wait for the caller''s call tree, so when init-server starts gossip the rounds land after RING_DELAY and the join; scenarios that need gossip during RING_DELAY add overlapping `membership-gossip-round` steps (`at_ms`).'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2014-2032', 'src/java/org/apache/cassandra/gms/Gossiper.java:2126-2137', 'src/java/org/apache/cassandra/gms/Gossiper.java:2198-2204']
  request:
    type: object
    properties:
      generation:
        type: integer
        examples: [1793318400]
  behavior:
  - title: buildSeedsList adds every configured seed except this node
    source: src/java/org/apache/cassandra/gms/Gossiper.java:2126-2137
    set: {state.seeds: '= (state.seeds + state.configured_seeds.filter(s, s != self && !(s in state.seeds)))'}
  - if: '!(self in state.endpoint_state_map)'
    then:
    - title: maybeInitializeLocalState creates the local state (putIfAbsent) with the new generation, marked alive; no STATUS yet (read as empty)
      source: src/java/org/apache/cassandra/gms/Gossiper.java:2198-2204
      set:
        '= ''state.endpoint_state_map.'' + self': '= {''endpoint'': self, ''alive'': true, ''generation'': has(input.generation) ? input.generation : now / 1000, ''heartbeat'': 0, ''max_version'': 0, ''status'': '''', ''tokens'': [], ''update_ms'': now}'
  - title: Schedule the GossipTask with a fixed delay of 1000 ms
    source: src/java/org/apache/cassandra/gms/Gossiper.java:2028-2031
    set: {state.enabled: true}
  - title: GossipTask every gossip interval, first after one interval
    source: src/java/org/apache/cassandra/gms/Gossiper.java:2028-2031
    emit: gossiper-gossip-task.run
    'on': = self
    after_ms: '= config[''gossip-interval-ms'']'
    every_ms: '= config[''gossip-interval-ms'']'
    count: '= config[''gossip-task-rounds'']'
- component: gossiper
  name: force-newer-generation
  kind: function
  summary: Increments this node's generation by one, keeping its heartbeat version (forceNewerGenerationUnsafe).
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2206-2210', 'src/java/org/apache/cassandra/gms/HeartBeatState.java:85-88']
  behavior:
  - set: {'= ''state.endpoint_state_map.'' + self + ''.generation''': '= state.endpoint_state_map[self].generation + 1'}
- component: gossiper
  name: stop
  kind: function
  summary: Announces shutdown (status shutdown, GOSSIP_SHUTDOWN to every live endpoint, a 2 s pause) when joined, then cancels the gossip task.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2284-2303']
  behavior:
  - {call: storage-service.is-joined, as: joined}
  - set: {vars.me: '= state.endpoint_state_map[self]'}
  - if: vars.joined.value.joined && !(vars.me.status in ['removing', 'removed', 'LEFT', 'hibernate', 'BOOT', 'BOOT_REPLACE'])
    then:
    - title: Announce shutdown
      source: src/java/org/apache/cassandra/gms/Gossiper.java:2289-2291
      call: gossiper.add-local-application-state
      input: {state: STATUS_WITH_PORT, value: shutdown}
    - foreach: '= state.endpoint_state_map.filter(e, e != self && (!has(state.endpoint_state_map[e].alive) || state.endpoint_state_map[e].alive))'
      as: ep
      steps:
      - title: Send GOSSIP_SHUTDOWN
        source: src/java/org/apache/cassandra/gms/Gossiper.java:2294-2296
        emit: gossip-shutdown-verb-handler.do-verb
        'on': = vars.ep
        input: {from: = self, state: '= state.endpoint_state_map[self]'}
    - {title: Wait for the announcement to spread, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:2297', wait: '= config[''shutdown-announce-delay-ms'']'}
  - title: Cancel the gossip task
    source: src/java/org/apache/cassandra/gms/Gossiper.java:2301-2302
    set: {state.enabled: false}
- component: gossiper
  name: assassinate-endpoint
  kind: function
  attributes: {jmx: 'org.apache.cassandra.net:type=Gossiper assassinateEndpoint'}
  summary: 'JMX: forcibly gossips an endpoint as LEFT after checking for RING_DELAY that its generation and heartbeat do not change.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:914-965', 'src/java/org/apache/cassandra/gms/Gossiper.java:900-904', 'src/java/org/apache/cassandra/gms/GossiperMBean.java:30', 'src/java/org/apache/cassandra/gms/GossiperMBean.java:32']
  request:
    type: object
    required: [address]
    properties:
      address:
        type: string
        examples: [n3]
  errors:
  - {code: runtime-exception}
  behavior:
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.address}
    as: ep
  - if: '!has(vars.ep.value.unknown)'
    then:
    - {title: Sleep RING_DELAY and check the endpoint is silent, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:929-930', wait: '= config[''ring-delay-ms'']'}
    - title: Did its generation or heartbeat change?
      source: src/java/org/apache/cassandra/gms/Gossiper.java:932-938
      choice: still_silent
      default: unchanged
      options:
        unchanged: []
        generation_changed:
        - fail: {code: runtime-exception, message: '= ''Endpoint still alive: '' + input.address + '' generation changed while trying to assassinate it'''}
        heartbeat_changed:
        - fail: {code: runtime-exception, message: '= ''Endpoint still alive: '' + input.address + '' heartbeat changed while trying to assassinate it'''}
  - call: token-metadata.get-tokens
    input: {endpoint: = input.address}
    as: tk
  - title: Gossip the endpoint as LEFT with a newer generation
    source: src/java/org/apache/cassandra/gms/Gossiper.java:958-961
    call: gossiper.handle-major-state-change
    input:
      endpoint: = input.address
      state: {endpoint: = input.address, generation: '= has(vars.ep.value.unknown) ? now / 1000 + 60 : vars.ep.value.generation + 1', heartbeat: 9999, max_version: 9999, status: LEFT, tokens: '= size(vars.tk.value.tokens)
          > 0 ? vars.tk.value.tokens : [42]', expire_time_ms: '= now + config[''very-long-time-ms'']'}
  - {title: Let four gossip rounds spread it, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:962', wait: '= 4 * config[''gossip-interval-ms'']'}
  - return: {assassinated: = input.address}
- component: gossip-verb-handler
  name: do-verb
  kind: function
  summary: Records the message creation time as the gossip stage's last processed time (used by the status check's backlog guard).
  sources: ['src/java/org/apache/cassandra/gms/GossipVerbHandler.java:26-29']
  request:
    type: object
    properties:
      created_at_ms: {type: integer}
  behavior:
  - set: {ctx.gossip_last_processed_ms: '= has(input.created_at_ms) ? input.created_at_ms : now'}
- component: gossip-digest-syn-verb-handler
  name: do-verb
  kind: verb
  attributes: {verb: GOSSIP_DIGEST_SYN, stage: GOSSIP, timeout: 'longTimeout (max(request_timeout, 5 min))'}
  summary: 'Handles GOSSIP_DIGEST_SYN on the receiving node: drops it on a cluster or partitioner mismatch, otherwise answers the sender with GOSSIP_DIGEST_ACK carrying the digests to request and the states
    to send.'
  sources: ['src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:42-113', 'src/java/org/apache/cassandra/net/Verb.java:144']
  request: MembershipGossipDigestSyn
  response:
    type: object
    properties:
      outcome: {type: string}
  behavior:
  - {call: gossiper.is-enabled, as: g}
  - if: '!vars.g.value.enabled && !vars.g.value.in_shadow_round'
    then:
    - title: Gossip disabled
      source: src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:47-52
      return: {outcome: ignored}
  - if: input.cluster_name != config['cluster-name']
    then:
    - title: ClusterName mismatch
      source: src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:55-60
      return: {outcome: dropped, reason: cluster name mismatch}
  - if: input.partitioner != '' && input.partitioner != config['partitioner']
    then:
    - title: Partitioner mismatch
      source: src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:62-66
      return: {outcome: dropped, reason: partitioner mismatch}
  - if: '!vars.g.value.enabled && vars.g.value.in_shadow_round'
    then:
    - if: size(input.digests) > 0
      then:
      - {title: Both nodes are in a shadow round, source: 'src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:75-91'}
      - return: {outcome: ignored}
    - emit: gossip-digest-ack-verb-handler.do-verb
      'on': = input.from
      input:
        from: = self
        digests: []
        states: []
    - return: {outcome: minimal ack}
  - if: size(input.digests) == 0
    then:
    - {title: Shadow-round SYN gets every state, source: 'src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:104-106', call: gossiper.examine-shadow-state, as: sh}
    - emit: gossip-digest-ack-verb-handler.do-verb
      'on': = input.from
      input:
        from: = self
        digests: []
        states: = vars.sh.value.states
    - return: {outcome: shadow reply, states: = size(vars.sh.value.states)}
  - call: gossiper.examine-gossiper
    input: {digests: = input.digests}
    as: ex
  - title: Send GOSSIP_DIGEST_ACK to the sender
    source: src/java/org/apache/cassandra/gms/GossipDigestSynVerbHandler.java:110
    emit: gossip-digest-ack-verb-handler.do-verb
    'on': = input.from
    input: {from: = self, digests: = vars.ex.value.delta_digests, states: = vars.ex.value.delta_states}
  - call: gossip-verb-handler.do-verb
    input: {created_at_ms: = now}
  - return: {outcome: ack, requested: '= vars.ex.value.delta_digests.map(d, d.endpoint)', sent: = size(vars.ex.value.delta_states)}
- component: gossip-digest-ack-verb-handler
  name: do-verb
  kind: verb
  attributes: {verb: GOSSIP_DIGEST_ACK, stage: GOSSIP}
  summary: 'Handles GOSSIP_DIGEST_ACK on the SYN''s sender: in a shadow round it may end the round; otherwise it applies the states (if a SYN was sent) and answers with GOSSIP_DIGEST_ACK2.'
  sources: ['src/java/org/apache/cassandra/gms/GossipDigestAckVerbHandler.java:41-103', 'src/java/org/apache/cassandra/net/Verb.java:145']
  request: MembershipGossipDigestAck
  response:
    type: object
    properties:
      outcome: {type: string}
  behavior:
  - {call: gossiper.is-enabled, as: g}
  - if: '!vars.g.value.enabled && !vars.g.value.in_shadow_round'
    then:
    - title: Gossip disabled
      source: src/java/org/apache/cassandra/gms/GossipDigestAckVerbHandler.java:46-51
      return: {outcome: ignored}
  - if: vars.g.value.in_shadow_round
    then:
    - title: In a shadow round, this ACK may end it
      source: src/java/org/apache/cassandra/gms/GossipDigestAckVerbHandler.java:58-66
      call: gossiper.maybe-finish-shadow-round
      input: {respondent: = input.from, respondent_in_shadow_round: = size(input.digests) == 0 && size(input.states) == 0, states: = input.states}
    - return: {outcome: shadow round}
  - if: size(input.states) > 0
    then:
    - if: '!vars.g.value.first_syn_sent'
      then:
      - title: Unrequested ACK before any SYN was sent
        source: src/java/org/apache/cassandra/gms/GossipDigestAckVerbHandler.java:73-78
        return: {outcome: unrequested}
    - call: gossiper.notify-failure-detector
      input: {states: = input.states}
    - call: gossiper.apply-state-locally
      input: {states: = input.states}
  - set:
      vars.delta: []
  - foreach: = input.digests
    as: d
    steps:
    - title: Reply everything when asked about this node
      source: src/java/org/apache/cassandra/gms/GossipDigestAckVerbHandler.java:87-95
      call: gossiper.get-state-for-version-bigger-than
      input: {endpoint: = vars.d.endpoint, version: '= vars.d.endpoint == self ? -1 : vars.d.max_version'}
      as: s
    - if: vars.s.value.found
      then:
      - set: {vars.delta: '= vars.delta + [vars.s.value.state]'}
  - title: Send GOSSIP_DIGEST_ACK2 to the peer
    source: src/java/org/apache/cassandra/gms/GossipDigestAckVerbHandler.java:97-100
    emit: gossip-digest-ack2-verb-handler.do-verb
    'on': = input.from
    input: {from: = self, states: = vars.delta}
  - call: gossip-verb-handler.do-verb
    input: {created_at_ms: = now}
  - return: {outcome: ack2, sent: = size(vars.delta)}
- component: gossip-digest-ack2-verb-handler
  name: do-verb
  kind: verb
  attributes: {verb: GOSSIP_DIGEST_ACK2, stage: GOSSIP}
  summary: Handles GOSSIP_DIGEST_ACK2 on the receiving node by reporting heartbeats and applying the states it carries.
  sources: ['src/java/org/apache/cassandra/gms/GossipDigestAck2VerbHandler.java:34-53', 'src/java/org/apache/cassandra/net/Verb.java:146']
  request: MembershipGossipDigestAck2
  response:
    type: object
    properties:
      outcome: {type: string}
      applied: {type: integer}
  behavior:
  - {call: gossiper.is-enabled, as: g}
  - if: '!vars.g.value.enabled'
    then:
    - title: Gossip disabled
      source: src/java/org/apache/cassandra/gms/GossipDigestAck2VerbHandler.java:41-46
      return: {outcome: ignored}
  - call: gossiper.notify-failure-detector
    input: {states: = input.states}
  - call: gossiper.apply-state-locally
    input: {states: = input.states}
    as: ap
  - call: gossip-verb-handler.do-verb
    input: {created_at_ms: = now}
  - return: {outcome: applied, applied: = vars.ap.value.applied}
- component: gossip-shutdown-verb-handler
  name: do-verb
  kind: verb
  attributes: {verb: GOSSIP_SHUTDOWN, stage: GOSSIP}
  summary: Handles GOSSIP_SHUTDOWN by marking the sender as shut down, unless the message carries an older generation than the one known.
  sources: ['src/java/org/apache/cassandra/gms/GossipShutdownVerbHandler.java:32-48', 'src/java/org/apache/cassandra/net/Verb.java:147']
  request: MembershipGossipShutdown
  response:
    type: object
    properties:
      outcome: {type: string}
  behavior:
  - {call: gossiper.is-enabled, as: g}
  - if: '!vars.g.value.enabled'
    then:
    - title: Gossip disabled
      source: src/java/org/apache/cassandra/gms/GossipShutdownVerbHandler.java:34-38
      return: {outcome: ignored}
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.from}
    as: prev
  - if: '!has(input.state)'
    then:
    - call: gossiper.mark-as-shutdown
      input: {endpoint: = input.from}
    - return: {outcome: marked}
  - if: vars.prev.value.generation > input.state.generation
    then:
    - title: Older generation than the local one
      source: src/java/org/apache/cassandra/gms/GossipShutdownVerbHandler.java:43-47
      return: {outcome: ignored older generation}
  - call: gossiper.mark-as-shutdown
    input: {endpoint: = input.from, state: = input.state}
  - return: {outcome: marked}
- component: echo-verb-handler
  name: do-verb
  kind: verb
  attributes: {verb: ECHO_REQ, stage: GOSSIP, timeout: request_timeout}
  summary: Answers ECHO_REQ with an empty ECHO_RSP unless this node is shutting down.
  sources: ['src/java/org/apache/cassandra/service/EchoVerbHandler.java:36-48', 'src/java/org/apache/cassandra/net/Verb.java:150']
  request:
    type: object
    required: [from]
    properties:
      from:
        type: string
        examples: [n2]
  response:
    type: object
    properties:
      responded: {type: boolean}
  behavior:
  - {call: storage-service.is-shutdown, as: sd}
  - if: vars.sd.value.shutdown
    then:
    - title: Shutting down, no ECHO_RSP
      source: src/java/org/apache/cassandra/service/EchoVerbHandler.java:44-47
      return: {responded: false}
  - return: {responded: true}
- component: ping-verb-handler
  name: do-verb
  kind: verb
  attributes: {verb: PING_REQ, stage: GOSSIP, timeout: block_for_peers_timeout_in_secs}
  summary: Answers PING_REQ with an empty PING_RSP on the connection type the request names.
  sources: ['src/java/org/apache/cassandra/net/PingVerbHandler.java:25-28', 'src/java/org/apache/cassandra/net/Verb.java:152']
  request:
    type: object
    required: [from]
    properties:
      from:
        type: string
        examples: [n2]
      connection_type:
        type: string
        enum: [URGENT_MESSAGES, SMALL_MESSAGES, LARGE_MESSAGES]
        examples: [SMALL_MESSAGES]
  response:
    type: object
    properties:
      responded: {type: boolean}
      connection_type: {type: string}
  behavior:
  - return: {responded: true, connection_type: '= has(input.connection_type) ? input.connection_type : ''SMALL_MESSAGES'''}
- component: messaging-service
  name: send-with-callback
  kind: function
  summary: Registers a response callback that expires with the verb's timeout, then sends the request to the peer instance; a missing reply surfaces as onFailure(TIMEOUT) when the callback expires.
  sources: ['src/java/org/apache/cassandra/net/MessagingService.java:402-408', 'src/java/org/apache/cassandra/net/MessagingService.java:452-463']
  request:
    type: object
    required: [verb, id, peer, timeout_ms]
    properties:
      verb:
        type: string
        enum: [ECHO_REQ, PING_REQ]
        examples: [ECHO_REQ]
      id:
        type: integer
        examples: [9001]
      peer:
        type: string
        examples: [n2]
      timeout_ms:
        type: integer
        examples: [10000]
  response:
    type: object
    properties:
      responded: {type: boolean}
      failure_reason: {type: string}
  behavior:
  - call: request-callbacks.add-with-expiration
    input: {id: = input.id, peer: = input.peer, verb: = input.verb, expires_at_ms: = now + input.timeout_ms, invoke_on_failure: true}
  - title: Send the request
    call: '= input.verb == ''PING_REQ'' ? ''ping-verb-handler.do-verb'' : ''echo-verb-handler.do-verb'''
    targets: [echo-verb-handler.do-verb, ping-verb-handler.do-verb]
    'on': = input.peer
    input: {from: = self}
    timeout_ms: = input.timeout_ms
    as: reply
    on_error: continue
  - if: vars.reply.ok && vars.reply.value.responded
    then:
    - title: The response arrives through ResponseVerbHandler
      call: response-verb-handler.do-verb
      input: {id: = input.id, from: = input.peer, verb: '= input.verb == ''PING_REQ'' ? ''PING_RSP'' : ''ECHO_RSP''', failure: false}
    - return: {responded: true}
  - {title: No response before the callback expires, detail: The reaper runs every min-rpc-timeout / 2 and removes callbacks whose deadline passed., source: 'src/java/org/apache/cassandra/net/RequestCallbacks.java:124-140',
    wait: '= vars.reply.ok ? input.timeout_ms : 0'}
  - call: request-callbacks.remove-and-expire
    input: {id: = input.id, peer: = input.peer}
  - return: {responded: false, failure_reason: TIMEOUT}
- component: messaging-service
  name: interrupt-outbound
  kind: function
  summary: Interrupts the outbound connections to an endpoint (they reconnect on demand).
  sources: ['src/java/org/apache/cassandra/net/MessagingService.java:531-539']
  request: MembershipEndpoint
  behavior:
  - set: {ctx.interrupted_outbound: '= (has(ctx.interrupted_outbound) ? ctx.interrupted_outbound : []) + [input.endpoint]'}
- component: messaging-service
  name: close-outbound
  kind: function
  summary: Closes the outbound connections to an endpoint after a delay, once it is believed never to be contacted again.
  sources: ['src/java/org/apache/cassandra/net/MessagingService.java:499-509']
  request: MembershipEndpoint
  behavior:
  - set: {ctx.closed_outbound: '= (has(ctx.closed_outbound) ? ctx.closed_outbound : []) + [input.endpoint]'}
- component: messaging-service
  name: close-outbound-now
  kind: function
  summary: Closes an endpoint's outbound connection pool immediately.
  sources: ['src/java/org/apache/cassandra/net/MessagingService.java:510-518']
  request: MembershipEndpoint
  behavior:
  - set: {ctx.closed_outbound: '= (has(ctx.closed_outbound) ? ctx.closed_outbound : []) + [input.endpoint]'}
- component: request-callbacks
  name: add-with-expiration
  kind: function
  summary: Registers a callback under (message id, peer) with the message's expiry deadline.
  sources: ['src/java/org/apache/cassandra/net/RequestCallbacks.java:96-102']
  request:
    type: object
    required: [id, peer, expires_at_ms]
    properties:
      id: {type: integer}
      peer: {type: string}
      verb: {type: string}
      expires_at_ms: {type: integer}
      invoke_on_failure: {type: boolean}
  store: {table: callbacks, op: put, key: '= string(input.id) + '':'' + input.peer', value: = input}
- component: request-callbacks
  name: remove
  kind: function
  summary: Removes and returns the callback for (id, peer), or null when unset or already expired.
  sources: ['src/java/org/apache/cassandra/net/RequestCallbacks.java:86-91']
  request:
    type: object
    required: [id, peer]
    properties:
      id: {type: integer}
      peer: {type: string}
  store: {table: callbacks, op: delete, key: '= string(input.id) + '':'' + input.peer'}
- component: request-callbacks
  name: remove-and-expire
  kind: function
  summary: Removes a callback and expires it; callbacks that want failures get onFailure(TIMEOUT) on the INTERNAL_RESPONSE stage.
  sources: ['src/java/org/apache/cassandra/net/RequestCallbacks.java:118-122', 'src/java/org/apache/cassandra/net/RequestCallbacks.java:149-158', 'src/java/org/apache/cassandra/net/RequestCallbacks.java:274-300']
  request:
    type: object
    required: [id, peer]
    properties:
      id: {type: integer}
      peer: {type: string}
  behavior:
  - call: request-callbacks.remove
    input: {id: = input.id, peer: = input.peer}
    as: ci
  - if: vars.ci.value == null
    then:
    - return: {expired: false}
  - if: has(vars.ci.value.invoke_on_failure) && vars.ci.value.invoke_on_failure
    then:
    - {title: Expired callback is failed with TIMEOUT, source: 'src/java/org/apache/cassandra/net/RequestCallbacks.java:156-157'}
    - emit: request-callback.on-failure
      input: {from: = input.peer, reason: TIMEOUT, id: = input.id, verb: '= has(vars.ci.value.verb) ? vars.ci.value.verb : '''''}
  - set: {ctx.expired_callbacks: '= (has(ctx.expired_callbacks) ? ctx.expired_callbacks : 0) + 1'}
  - return: {expired: true}
- component: request-callbacks
  name: expire
  kind: function
  summary: 'Reaper task: expires every callback whose deadline has passed.'
  attributes: {schedule: every min rpc timeout / 2 = 1000 ms (write_request_timeout 2000 ms is the minimum)}
  sources: ['src/java/org/apache/cassandra/net/RequestCallbacks.java:124-140', 'src/java/org/apache/cassandra/net/RequestCallbacks.java:66-72', 'src/java/org/apache/cassandra/net/RequestCallbacks.java:302-305',
    'src/java/org/apache/cassandra/config/DatabaseDescriptor.java:2282-2290']
  behavior:
  - foreach: = state.callbacks
    as: cb
    index: k
    steps:
    - if: now > vars.cb.expires_at_ms
      then:
      - {title: Past its deadline, source: 'src/java/org/apache/cassandra/net/RequestCallbacks.java:130-136'}
      - call: request-callbacks.remove-and-expire
        input: {id: = vars.cb.id, peer: = vars.cb.peer}
  - return: {remaining: = size(state.callbacks)}
- component: request-callback
  name: on-response
  kind: function
  summary: The sender's response handler (coordination's response handlers implement it).
  sources: ['src/java/org/apache/cassandra/net/RequestCallback.java:36']
  request:
    type: object
    properties:
      from: {type: string}
      id: {type: integer}
      verb: {type: string}
  behavior:
  - set: {ctx.callback_responses: '= (has(ctx.callback_responses) ? ctx.callback_responses : 0) + 1'}
  - if: has(input.verb) && input.verb == 'ECHO_RSP'
    then:
    - {title: The echo callback registered by Gossiper.markAlive, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1450-1456'}
    - call: gossiper.remove-inflight-echo
      input: {endpoint: = input.from}
      as: inf
    - if: vars.inf.value.was_inflight
      then:
      - call: gossiper.real-mark-alive
        input: {endpoint: = input.from}
- component: request-callback
  name: on-failure
  kind: function
  summary: The sender's failure handler, invoked with a RequestFailureReason.
  sources: ['src/java/org/apache/cassandra/net/RequestCallback.java:41-45']
  request:
    type: object
    properties:
      from: {type: string}
      id: {type: integer}
      reason: {type: string}
      verb: {type: string}
  behavior:
  - set: {ctx.callback_failures: '= (has(ctx.callback_failures) ? ctx.callback_failures : 0) + 1', ctx.last_failure_reason: '= has(input.reason) ? input.reason : ''UNKNOWN'''}
  - if: has(input.verb) && input.verb in ['ECHO_REQ', 'ECHO_RSP']
    then:
    - {title: A failed echo leaves the endpoint down, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:1466-1470'}
    - call: gossiper.remove-inflight-echo
      input: {endpoint: = input.from}
    - set: {ctx.echo_failed: '= (has(ctx.echo_failed) ? ctx.echo_failed : []) + [input.from]'}
- component: response-verb-handler
  name: do-verb
  kind: verb
  attributes: {verb: 'ECHO_RSP, PING_RSP, FAILURE_RSP, REQUEST_RSP, INTERNAL_RSP and every other *_RSP', stage: REQUEST_RESPONSE}
  summary: Removes the callback for (id, from); drops the response if it already expired, otherwise invokes onFailure for failure responses or onResponse.
  sources: ['src/java/org/apache/cassandra/net/ResponseVerbHandler.java:36-60', 'src/java/org/apache/cassandra/net/Verb.java:149', 'src/java/org/apache/cassandra/net/Verb.java:151', 'src/java/org/apache/cassandra/net/Verb.java:209',
    'src/java/org/apache/cassandra/net/Verb.java:219', 'src/java/org/apache/cassandra/net/Verb.java:222']
  request: MembershipInternodeResponse
  response:
    type: object
    properties:
      delivered: {type: boolean}
      outcome: {type: string}
  behavior:
  - call: request-callbacks.remove
    input: {id: = input.id, peer: = input.from}
    as: ci
  - if: vars.ci.value == null
    then:
    - {title: Callback already removed (expired), source: 'src/java/org/apache/cassandra/net/ResponseVerbHandler.java:39-45'}
    - set: {ctx.response_dropped: true}
    - return: {delivered: false, outcome: callback already removed}
  - if: has(input.failure) && input.failure
    then:
    - {title: Failure response, source: 'src/java/org/apache/cassandra/net/ResponseVerbHandler.java:51-54'}
    - call: request-callback.on-failure
      input: {from: = input.from, id: = input.id, verb: = input.verb, reason: '= has(input.failure_reason) ? input.failure_reason : ''UNKNOWN'''}
    - return: {delivered: true, outcome: failure}
  - call: request-callback.on-response
    input: {from: = input.from, id: = input.id, verb: = input.verb}
  - return: {delivered: true, outcome: response}
- component: outbound-message-queue
  name: maybe-prune-expired
  kind: function
  summary: While the connection is disconnected, drops queued messages whose timeout passed and expires their callbacks.
  attributes: {schedule: every 100 ms while disconnected}
  sources: ['src/java/org/apache/cassandra/net/OutboundMessageQueue.java:209-220', 'src/java/org/apache/cassandra/net/OutboundConnection.java:1403-1407', 'src/java/org/apache/cassandra/net/OutboundConnection.java:475-483']
  behavior:
  - set: {vars.expired: '= state.queue.filter(m, now > m.expires_at_ms)', state.queue: '= state.queue.filter(m, now <= m.expires_at_ms)'}
  - foreach: = vars.expired
    as: m
    steps:
    - title: Dropping message whose timeout expired before reaching the network
      source: src/java/org/apache/cassandra/net/OutboundConnection.java:477-481
      call: request-callbacks.remove-and-expire
      input: {id: = vars.m.id, peer: = vars.m.peer}
  - return: {pruned: = size(vars.expired)}
- component: outbound-connections-unused-connection-monitor
  name: close-unused-since-last-run
  kind: function
  summary: Closes all connections to an endpoint gossip does not know when none carried traffic since the last run; otherwise interrupts each idle connection.
  attributes: {schedule: scheduleWithFixedDelay from MessagingService}
  sources: ['src/java/org/apache/cassandra/net/OutboundConnections.java:294-335', 'src/java/org/apache/cassandra/net/OutboundConnections.java:337-340']
  behavior:
  - foreach: = state.connections
    as: c
    steps:
    - if: '!has(vars.c.prev_small)'
      then:
      - {continue: true}
    - if: vars.c.small != vars.c.prev_small && vars.c.large != vars.c.prev_large && vars.c.urgent != vars.c.prev_urgent
      then:
      - {continue: true}
    - call: gossiper.get-endpoint-state-for-endpoint
      input: {endpoint: = vars.c.peer}
      as: known
    - if: vars.c.small == vars.c.prev_small && vars.c.large == vars.c.prev_large && vars.c.urgent == vars.c.prev_urgent && has(vars.known.value.unknown)
      then:
      - {title: 'Idle and unknown to gossip, close entirely', source: 'src/java/org/apache/cassandra/net/OutboundConnections.java:313-321'}
      - call: messaging-service.close-outbound-now
        input: {endpoint: = vars.c.peer}
      - {continue: true}
    - title: Interrupt the idle connection types
      source: src/java/org/apache/cassandra/net/OutboundConnections.java:323-330
      set: {ctx.interrupted_idle: '= (has(ctx.interrupted_idle) ? ctx.interrupted_idle : []) + [vars.c.peer]'}
  - set: {state.connections: '= state.connections.map(c, {''peer'': c.peer, ''small'': c.small, ''large'': c.large, ''urgent'': c.urgent, ''prev_small'': c.small, ''prev_large'': c.large, ''prev_urgent'':
        c.urgent})'}
- component: token-metadata
  name: ring-iterator
  kind: function
  summary: Walks the ring from the first token at or after the given token, wrapping around, and collects the first rf distinct endpoints (SimpleStrategy.calculateNaturalReplicas).
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:1191-1225', 'src/java/org/apache/cassandra/locator/TokenMetadata.java:1167-1179', 'src/java/org/apache/cassandra/locator/SimpleStrategy.java:60-83']
  request:
    type: object
    required: [token, rf]
    properties:
      token:
        type: integer
        examples: [100]
      rf:
        type: integer
        examples: [3]
      exclude:
        type: array
        items: {type: string}
      extra:
        type: array
        items: {type: object}
  response:
    type: object
    properties:
      token: {type: integer}
      replicas:
        type: array
        items: {type: string}
  behavior:
  - set: {vars.ring: '= state.ring.filter(e, !(e.endpoint in (has(input.exclude) ? input.exclude : []))) + (has(input.extra) ? input.extra : [])'}
  - set:
      vars.sorted: = vars.ring.map(e, e.token).sort()
      vars.replicas: []
  - if: size(vars.sorted) == 0
    then:
    - return:
        token: = input.token
        replicas: []
  - title: First token at or after the search token, wrapping to the start
    source: src/java/org/apache/cassandra/locator/TokenMetadata.java:1171-1177
    set: {vars.idx: '= size(vars.sorted.filter(x, x < input.token)) == size(vars.sorted) ? 0 : size(vars.sorted.filter(x, x < input.token))'}
  - set: {vars.rotated: '= vars.sorted.slice(vars.idx, size(vars.sorted)) + vars.sorted.slice(0, vars.idx)'}
  - foreach: = vars.rotated
    as: t
    steps:
    - if: size(vars.replicas) >= input.rf
      then:
      - {break: true}
    - set: {vars.ep: '= vars.ring.filter(e, e.token == vars.t)[0].endpoint'}
    - title: Add the endpoint unless it is already a replica
      source: src/java/org/apache/cassandra/locator/SimpleStrategy.java:74-80
      set: {vars.replicas: '= vars.ep in vars.replicas ? vars.replicas : vars.replicas + [vars.ep]'}
  - return: {token: = input.token, replicas: = vars.replicas}
- component: token-metadata
  name: get-write-endpoints
  kind: function
  summary: 'CONTRACT: the natural replicas (ring walk with the keyspace''s RF) and the pending replicas for a token; replicas = natural + pending.'
  description: Coordination's replica plans read this. natural is in ring order (primary first). pending comes from the pending ranges computed by PendingRangeCalculatorService. The keyspace's RF is token-metadata.keyspace_rf
    (default_rf 3 otherwise).
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:1333-1337', 'src/java/org/apache/cassandra/locator/TokenMetadata.java:1320-1327']
  request: MembershipReplicaLookupRequest
  response: MembershipReplicaLookupResponse
  behavior:
  - set: {vars.rf: '= input.keyspace in state.keyspace_rf ? state.keyspace_rf[input.keyspace] : state.default_rf'}
  - call: token-metadata.ring-iterator
    input: {token: = input.token, rf: = vars.rf}
    as: nat
  - set: {vars.pending: '= state.pending_ranges.filter(r, (r.keyspace == input.keyspace || r.keyspace == ''*'') && (r.left < r.right ? (input.token > r.left && input.token <= r.right) : (input.token > r.left
        || input.token <= r.right))).map(r, r.endpoint)'}
  - set: {vars.pending_only: '= vars.pending.filter(p, !(p in vars.nat.value.replicas))'}
  - return: {keyspace: = input.keyspace, token: = input.token, natural: = vars.nat.value.replicas, pending: = vars.pending_only, replicas: = vars.nat.value.replicas + vars.pending_only}
- component: token-metadata
  name: pending-endpoints-for-token
  kind: function
  summary: The endpoints whose pending ranges contain the token.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:1320-1327']
  request: MembershipReplicaLookupRequest
  response:
    type: object
    properties:
      token: {type: integer}
      pending:
        type: array
        items: {type: string}
  behavior:
  - return: {token: = input.token, pending: '= state.pending_ranges.filter(r, (r.keyspace == input.keyspace || r.keyspace == ''*'') && (r.left < r.right ? (input.token > r.left && input.token <= r.right)
        : (input.token > r.left || input.token <= r.right))).map(r, r.endpoint)'}
- component: token-metadata
  name: is-member
  kind: function
  summary: Whether an endpoint owns normal tokens in the ring.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:608-621']
  request: MembershipEndpoint
  response:
    type: object
    properties:
      member: {type: boolean}
  behavior:
  - return: {member: '= state.ring.exists(e, e.endpoint == input.endpoint)'}
- component: token-metadata
  name: get-tokens
  kind: function
  summary: The normal tokens an endpoint owns.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:592-606']
  request: MembershipEndpoint
  response:
    type: object
    properties:
      tokens:
        type: array
        items: {type: integer}
  behavior:
  - return: {tokens: '= state.ring.filter(e, e.endpoint == input.endpoint).map(e, e.token)'}
- component: token-metadata
  name: get-all-endpoints
  kind: function
  summary: The ring's endpoints once all leaving endpoints are gone (cloneAfterAllLeft().getAllEndpoints()).
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:713-738', 'src/java/org/apache/cassandra/locator/TokenMetadata.java:1077-1088']
  response:
    type: object
    properties:
      endpoints:
        type: array
        items: {type: string}
  behavior:
  - return: {endpoints: '= state.ring.map(e, e.endpoint).filter(e, !(e in state.leaving_endpoints)).distinct()'}
- component: token-metadata
  name: get-replication-factor
  kind: function
  summary: Model helper for Keyspace.open(ks).getReplicationStrategy().getReplicationFactor(), as StorageService's lifecycle checks read it.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:5359']
  request:
    type: object
    required: [keyspace]
    properties:
      keyspace:
        type: string
        examples: [ks1]
  response:
    type: object
    properties:
      keyspace: {type: string}
      rf: {type: integer}
  behavior:
  - return: {keyspace: = input.keyspace, rf: '= input.keyspace in state.keyspace_rf ? state.keyspace_rf[input.keyspace] : state.default_rf'}
- component: token-metadata
  name: get-endpoint-for-host-id
  kind: function
  summary: The endpoint that owns a host id, or empty.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:323-335']
  request:
    type: object
    required: [host_id]
    properties:
      host_id: {type: string}
  response:
    type: object
    properties:
      endpoint: {type: string}
  behavior:
  - set: {vars.matches: '= state.host_ids.filter(ep, state.host_ids[ep] == input.host_id)'}
  - return: {endpoint: '= size(vars.matches) > 0 ? vars.matches[0] : '''''}
- component: token-metadata
  name: get-host-id
  kind: function
  summary: The host id of an endpoint, or empty.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:309-321']
  request: MembershipEndpoint
  response:
    type: object
    properties:
      host_id: {type: string}
  behavior:
  - return: {host_id: '= input.endpoint in state.host_ids ? state.host_ids[input.endpoint] : '''''}
- component: token-metadata
  name: get-range-movements
  kind: function
  summary: Bootstrapping tokens, leaving endpoints and moving endpoints (getBootstrapTokens, getSizeOfLeavingEndpoints, getSizeOfMovingEndpoints).
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:1064-1075', 'src/java/org/apache/cassandra/locator/TokenMetadata.java:1124-1165']
  response:
    type: object
    properties:
      bootstrapping: {type: integer}
      leaving: {type: integer}
      moving: {type: integer}
  behavior:
  - return: {bootstrapping: = size(state.bootstrap_tokens), leaving: = size(state.leaving_endpoints), moving: = size(state.moving_endpoints)}
- component: token-metadata
  name: update-normal-tokens
  kind: function
  summary: Makes an endpoint a normal ring member with the given tokens, removing it from bootstrapping, leaving and moving.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:191-196', 'src/java/org/apache/cassandra/locator/TokenMetadata.java:204-251']
  request:
    type: object
    required: [endpoint, tokens]
    properties:
      endpoint: {type: string}
      tokens:
        type: array
        items: {type: integer}
      host_id: {type: string}
  behavior:
  - set: {state.ring: '= state.ring.filter(e, e.endpoint != input.endpoint && !(e.token in input.tokens)) + input.tokens.map(t, {''token'': t, ''endpoint'': input.endpoint})', state.bootstrap_tokens: '=
        state.bootstrap_tokens.filter(b, b.endpoint != input.endpoint && !(b.token in input.tokens))', state.leaving_endpoints: '= state.leaving_endpoints.filter(l, l != input.endpoint)', state.moving_endpoints: '=
        state.moving_endpoints.filter(m, m.endpoint != input.endpoint)'}
- component: token-metadata
  name: add-bootstrap-tokens
  kind: function
  summary: Records an endpoint's bootstrapping tokens.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:352-355']
  request:
    type: object
    required: [endpoint, tokens]
    properties:
      endpoint: {type: string}
      tokens:
        type: array
        items: {type: integer}
  behavior:
  - set: {state.bootstrap_tokens: '= state.bootstrap_tokens.filter(b, b.endpoint != input.endpoint) + input.tokens.map(t, {''token'': t, ''endpoint'': input.endpoint})'}
- component: token-metadata
  name: add-leaving-endpoint
  kind: function
  summary: Marks an endpoint as leaving.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:459-472']
  request: MembershipEndpoint
  behavior:
  - set: {state.leaving_endpoints: '= state.leaving_endpoints.exists(l, l == input.endpoint) ? state.leaving_endpoints : state.leaving_endpoints + [input.endpoint]'}
- component: token-metadata
  name: add-moving-endpoint
  kind: function
  summary: Marks an endpoint as moving to a new token.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:479-492']
  request:
    type: object
    required: [endpoint, token]
    properties:
      endpoint: {type: string}
      token: {type: integer}
  behavior:
  - set: {state.moving_endpoints: '= state.moving_endpoints.filter(m, m.endpoint != input.endpoint) + [{''token'': input.token, ''endpoint'': input.endpoint}]'}
- component: token-metadata
  name: remove-endpoint
  kind: function
  summary: Removes an endpoint's tokens, bootstrap tokens, leaving and moving entries and host id from the ring.
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:494-521']
  request: MembershipEndpoint
  behavior:
  - set: {state.ring: '= state.ring.filter(e, e.endpoint != input.endpoint)', state.bootstrap_tokens: '= state.bootstrap_tokens.filter(b, b.endpoint != input.endpoint)', state.leaving_endpoints: '= state.leaving_endpoints.filter(l,
        l != input.endpoint)', state.moving_endpoints: '= state.moving_endpoints.filter(m, m.endpoint != input.endpoint)'}
- component: token-metadata
  name: calculate-pending-ranges
  kind: function
  summary: 'Pending ranges: ranges that leaving endpoints give to new replicas, every range a bootstrapping endpoint will replicate, and the new range of a moving endpoint.'
  sources: ['src/java/org/apache/cassandra/locator/TokenMetadata.java:855-875', 'src/java/org/apache/cassandra/locator/TokenMetadata.java:877-915', 'src/java/org/apache/cassandra/locator/TokenMetadata.java:920-1000']
  behavior:
  - if: size(state.bootstrap_tokens) == 0 && size(state.leaving_endpoints) == 0 && size(state.moving_endpoints) == 0
    then:
    - {title: 'Nothing is moving, pending ranges are empty', source: 'src/java/org/apache/cassandra/locator/TokenMetadata.java:889-897'}
    - set:
        state.pending_ranges: []
    - return: {pending: 0}
  - set:
      vars.pending: []
      vars.ring_tokens: = state.ring.map(e, e.token).sort()
      vars.leaving: = state.leaving_endpoints
  - title: Ranges affected by leaving endpoints go to their new replicas
    source: src/java/org/apache/cassandra/locator/TokenMetadata.java:933-954
    when: size(state.leaving_endpoints) > 0
    foreach: = vars.ring_tokens
    as: t
    steps:
    - call: token-metadata.ring-iterator
      input: {token: = vars.t, rf: = state.default_rf}
      as: cur
    - if: vars.leaving.exists(l, l in vars.cur.value.replicas)
      then:
      - call: token-metadata.ring-iterator
        input: {token: = vars.t, rf: = state.default_rf, exclude: = vars.leaving}
        as: after
      - set: {vars.pred: '= vars.ring_tokens.filter(x, x < vars.t).size() > 0 ? vars.ring_tokens.filter(x, x < vars.t)[vars.ring_tokens.filter(x, x < vars.t).size() - 1] : vars.ring_tokens[size(vars.ring_tokens)
            - 1]'}
      - set: {vars.pending: '= vars.pending + vars.after.value.replicas.filter(ep, !(ep in vars.cur.value.replicas)).map(ep, {''keyspace'': ''*'', ''left'': vars.pred, ''right'': vars.t, ''endpoint'': ep})'}
  - title: A bootstrapping endpoint is pending for every range it will replicate
    source: src/java/org/apache/cassandra/locator/TokenMetadata.java:966-976
    when: size(state.bootstrap_tokens) > 0
    foreach: = state.bootstrap_tokens.map(b, b.endpoint).distinct()
    as: bep
    steps:
    - set: {vars.extra: '= state.bootstrap_tokens.filter(b, b.endpoint == vars.bep)'}
    - set: {vars.btokens: '= (state.ring.filter(e, !(e.endpoint in vars.leaving)) + vars.extra).map(e, e.token).sort()'}
    - foreach: = vars.btokens
      as: bt
      steps:
      - call: token-metadata.ring-iterator
        input: {token: = vars.bt, rf: = state.default_rf, exclude: = vars.leaving, extra: = vars.extra}
        as: br
      - if: vars.bep in vars.br.value.replicas
        then:
        - set: {vars.bpred: '= vars.btokens.filter(x, x < vars.bt).size() > 0 ? vars.btokens.filter(x, x < vars.bt)[vars.btokens.filter(x, x < vars.bt).size() - 1] : vars.btokens[size(vars.btokens) - 1]'}
        - set: {vars.pending: '= vars.pending + [{''keyspace'': ''*'', ''left'': vars.bpred, ''right'': vars.bt, ''endpoint'': vars.bep}]'}
  - title: A moving endpoint is pending for its new primary range
    source: src/java/org/apache/cassandra/locator/TokenMetadata.java:983-999
    when: size(state.moving_endpoints) > 0
    foreach: = state.moving_endpoints
    as: mv
    steps:
    - set: {vars.mpred: '= vars.ring_tokens.filter(x, x < vars.mv.token).size() > 0 ? vars.ring_tokens.filter(x, x < vars.mv.token)[vars.ring_tokens.filter(x, x < vars.mv.token).size() - 1] : vars.ring_tokens[size(vars.ring_tokens)
          - 1]'}
    - set: {vars.pending: '= vars.pending + [{''keyspace'': ''*'', ''left'': vars.mpred, ''right'': vars.mv.token, ''endpoint'': vars.mv.endpoint}]'}
  - set: {state.pending_ranges: = vars.pending}
  - return: {pending: = size(vars.pending)}
- component: pending-range-calculator-service
  name: update
  kind: function
  summary: Triggers a pending-range recalculation for every distributed keyspace on the PendingRangeCalculator executor.
  sources: ['src/java/org/apache/cassandra/service/PendingRangeCalculatorService.java:68-73', 'src/java/org/apache/cassandra/service/PendingRangeCalculatorService.java:53-62']
  behavior:
  - {call: token-metadata.calculate-pending-ranges, as: calc}
  - set: {ctx.pending_range_updates: '= (has(ctx.pending_range_updates) ? ctx.pending_range_updates : 0) + 1'}
  - return: {pending: = vars.calc.value.pending}
- component: pending-range-calculator-service
  name: block-until-finished
  kind: function
  summary: Waits for any queued pending-range calculation to finish.
  sources: ['src/java/org/apache/cassandra/service/PendingRangeCalculatorService.java:75-78']
  behavior:
  - title: The model calculates synchronously, so there is nothing to wait for
    set: {ctx.pending_range_synced: true}
- component: storage-service
  name: is-shutdown
  kind: function
  summary: Whether drain has started.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:396-399']
  response:
    type: object
    properties:
      shutdown: {type: boolean}
  behavior:
  - return: {shutdown: = state.is_shutdown}
- component: storage-service
  name: is-joined
  kind: function
  summary: Whether this node is a ring member and not in write survey mode.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:1500-1503']
  response:
    type: object
    properties:
      joined: {type: boolean}
  behavior:
  - call: token-metadata.is-member
    input: {endpoint: = self}
    as: mem
  - return: {joined: = vars.mem.value.member && !state.survey_mode}
- component: storage-service
  name: on-change
  kind: function
  subscribe: [endpoint-state-change-subscriber.on-change]
  summary: 'Gossip subscriber: STATUS changes drive the ring (BOOT adds bootstrap tokens, NORMAL and shutdown make the node a member, LEAVING marks it leaving, LEFT excises it, MOVING marks it moving, removing/removed
    handle removenode).'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:2813-2850']
  request:
    type: object
    required: [endpoint, state, value]
    properties:
      endpoint:
        type: string
        examples: [n2]
      state:
        type: string
        enum: [STATUS, LOAD, SCHEMA, DC, RACK, RELEASE_VERSION, REMOVAL_COORDINATOR, INTERNAL_IP, RPC_ADDRESS, X_11_PADDING, SEVERITY, NET_VERSION, HOST_ID, TOKENS, RPC_READY, INTERNAL_ADDRESS_AND_PORT,
          NATIVE_ADDRESS_AND_PORT, STATUS_WITH_PORT, SSTABLE_VERSIONS, DISK_USAGE, INDEX_STATUS, X1, X2, X3, X4, X5, X6, X7, X8, X9, X10]
        examples: [STATUS_WITH_PORT]
      value:
        type: string
        examples: [NORMAL]
      load: {type: integer}
  behavior:
  - if: '!(input.state in [''STATUS'', ''STATUS_WITH_PORT''])'
    then:
    - title: Other application states update peer info for ring members
      source: src/java/org/apache/cassandra/service/StorageService.java:2851-2900
      return: {handled: peer info}
  - call: gossiper.get-endpoint-state-for-endpoint
    input: {endpoint: = input.endpoint}
    as: es
  - set: {vars.tokens: '= has(vars.es.value.tokens) ? vars.es.value.tokens : []'}
  - call: token-metadata.is-member
    input: {endpoint: = input.endpoint}
    as: mem
  - set: {ctx.status_changes: '= (has(ctx.status_changes) ? ctx.status_changes : []) + [input.endpoint + '':'' + input.value]'}
  - if: input.value == 'BOOT'
    then:
    - if: vars.mem.value.member
      then:
      - {title: handleStateBootstrap, source: 'src/java/org/apache/cassandra/service/StorageService.java:3123-3151'}
      - call: token-metadata.remove-endpoint
        input: {endpoint: = input.endpoint}
    - call: token-metadata.add-bootstrap-tokens
      input: {endpoint: = input.endpoint, tokens: = vars.tokens}
    - {call: pending-range-calculator-service.update}
    - return: {handled: BOOT}
  - if: input.value == 'NORMAL' || input.value == 'shutdown'
    then:
    - if: size(vars.tokens) > 0
      then:
      - {title: handleStateNormal, detail: The endpoint's gossiped tokens become normal tokens; a node that was not a member is announced as joined (only for NORMAL)., source: 'src/java/org/apache/cassandra/service/StorageService.java:3311-3401'}
      - call: token-metadata.update-normal-tokens
        input: {endpoint: = input.endpoint, tokens: = vars.tokens}
    - if: '!vars.mem.value.member && input.value == ''NORMAL'' && input.endpoint != self'
      then:
      - {title: notifyJoined, source: 'src/java/org/apache/cassandra/service/StorageService.java:3395-3398'}
      - call: server-event-notifier.on-join-cluster
        input: {endpoint: = input.endpoint}
    - {call: pending-range-calculator-service.update}
    - return: {handled: = input.value}
  - if: input.value == 'LEAVING'
    then:
    - title: handleStateLeaving
      source: src/java/org/apache/cassandra/service/StorageService.java:3408-3420
      call: token-metadata.add-leaving-endpoint
      input: {endpoint: = input.endpoint}
    - {call: pending-range-calculator-service.update}
    - return: {handled: LEAVING}
  - if: input.value == 'LEFT'
    then:
    - title: handleStateLeft excises the endpoint
      source: src/java/org/apache/cassandra/service/StorageService.java:3428-3437
      call: storage-service.excise
      input: {endpoint: = input.endpoint, tokens: = vars.tokens}
    - return: {handled: LEFT}
  - if: input.value == 'MOVING'
    then:
    - title: handleStateMoving
      source: src/java/org/apache/cassandra/service/StorageService.java:3445-3458
      call: token-metadata.add-moving-endpoint
      input: {endpoint: = input.endpoint, token: '= has(vars.es.value.moving_to) ? vars.es.value.moving_to : vars.tokens[0]'}
    - {call: pending-range-calculator-service.update}
    - return: {handled: MOVING}
  - if: input.value == 'removing' || input.value == 'removed'
    then:
    - if: vars.mem.value.member && input.value == 'removed'
      then:
      - {title: handleStateRemoving, source: 'src/java/org/apache/cassandra/service/StorageService.java:3466-3516'}
      - call: storage-service.excise
        input: {endpoint: = input.endpoint, tokens: = vars.tokens}
      else:
      - if: vars.mem.value.member
        then:
        - call: token-metadata.add-leaving-endpoint
          input: {endpoint: = input.endpoint}
        - {call: pending-range-calculator-service.update}
    - return: {handled: = input.value}
  - return: {handled: none}
- component: storage-service
  name: excise
  kind: function
  summary: Removes a departed endpoint from gossip and the ring, schedules deletion of its hints after min rpc timeout + write timeout, announces it left and recalculates pending ranges.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:3518-3543']
  request:
    type: object
    required: [endpoint]
    properties:
      endpoint: {type: string}
      tokens:
        type: array
        items: {type: integer}
  behavior:
  - call: token-metadata.is-member
    input: {endpoint: = input.endpoint}
    as: mem
  - call: token-metadata.get-host-id
    input: {endpoint: = input.endpoint}
    as: hid
  - if: vars.mem.value.member && vars.hid.value.host_id != ''
    then:
    - title: Delete its hints after min rpc timeout + write timeout
      source: src/java/org/apache/cassandra/service/StorageService.java:3522-3529
      emit: hints-service.excise
      after_ms: = [int(config['request-timeout-ms']), int(config['read-request-timeout-ms']), int(config['range-request-timeout-ms']), int(config['write-request-timeout-ms']), int(config['counter-write-request-timeout-ms']),
        int(config['truncate-request-timeout-ms'])].sort()[0] + int(config['write-request-timeout-ms'])
      input: {host_id: = vars.hid.value.host_id}
  - call: gossiper.remove-endpoint
    input: {endpoint: = input.endpoint}
  - call: token-metadata.remove-endpoint
    input: {endpoint: = input.endpoint}
  - if: input.endpoint != self
    then:
    - title: notifyLeft
      source: src/java/org/apache/cassandra/service/StorageService.java:3535
      call: server-event-notifier.on-leave-cluster
      input: {endpoint: = input.endpoint}
  - {call: pending-range-calculator-service.update}
- component: storage-service
  name: on-alive
  kind: function
  subscribe: [endpoint-state-change-subscriber.on-alive]
  summary: A ring member coming up is announced to clients (notifyUp) when it is RPC-ready.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:3872-3876', 'src/java/org/apache/cassandra/service/StorageService.java:3032-3039']
  request: MembershipEndpoint
  behavior:
  - call: token-metadata.is-member
    input: {endpoint: = input.endpoint}
    as: mem
  - if: vars.mem.value.member
    then:
    - call: server-event-notifier.on-up
      input: {endpoint: = input.endpoint}
- component: storage-service
  name: on-dead
  kind: function
  subscribe: [endpoint-state-change-subscriber.on-dead]
  summary: Interrupts outbound connections to a dead endpoint and announces it down to clients (notifyDown).
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:3884-3890', 'src/java/org/apache/cassandra/service/StorageService.java:3041-3045']
  request: MembershipEndpoint
  behavior:
  - call: messaging-service.interrupt-outbound
    input: {endpoint: = input.endpoint}
  - call: server-event-notifier.on-down
    input: {endpoint: = input.endpoint}
- component: storage-service
  name: on-join
  kind: function
  subscribe: [endpoint-state-change-subscriber.on-join]
  summary: Processes a newly seen endpoint's STATUS before its other application states, by re-firing onChange.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:3847-3870']
  request:
    type: object
    required: [endpoint]
    properties:
      endpoint: {type: string}
      status: {type: string}
  behavior:
  - if: has(input.status) && input.status != ''
    then:
    - title: Gossiper.doOnChangeNotifications for STATUS_WITH_PORT
      source: src/java/org/apache/cassandra/service/StorageService.java:3861-3862
      publish: endpoint-state-change-subscriber.on-change
      delivery: sync
      input: {endpoint: = input.endpoint, state: STATUS_WITH_PORT, value: = input.status, load: 0}
- component: storage-service
  name: on-remove
  kind: function
  subscribe: [endpoint-state-change-subscriber.on-remove]
  summary: Removes an endpoint gossip dropped from the ring and recalculates pending ranges.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:3878-3882']
  request: MembershipEndpoint
  behavior:
  - call: token-metadata.remove-endpoint
    input: {endpoint: = input.endpoint}
  - {call: pending-range-calculator-service.update}
- component: storage-service
  name: on-restart
  kind: function
  subscribe: [endpoint-state-change-subscriber.on-restart]
  summary: A restarted endpoint that was still marked up is first treated as dead so its connections reset.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:3892-3903']
  request:
    type: object
    required: [endpoint]
    properties:
      endpoint: {type: string}
      was_alive: {type: boolean}
  behavior:
  - if: has(input.was_alive) && input.was_alive
    then:
    - call: storage-service.on-dead
      input: {endpoint: = input.endpoint}
- component: storage-service
  name: init-server
  kind: function
  summary: 'Startup: prepare to join (gossip, messaging, host id), then join the token ring (bootstrapping when needed).'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:966-1063']
  response: MembershipLifecycleResult
  errors:
  - {code: config-error, status: 8960}
  - {code: unsupported-operation-exception}
  - {code: illegal-state-exception}
  behavior:
  - if: '!state.start_gossip'
    then:
    - {title: Gossip disabled by -Dcassandra.start_gossip=false, source: 'src/java/org/apache/cassandra/service/StorageService.java:1021-1026'}
    - set: {state.initialized: true}
    - return: {operation_mode: = state.operation_mode, detail: not starting gossip}
  - {call: storage-service.prepare-to-join}
  - if: state.join_ring
    then:
    - {title: Join the ring unless -Dcassandra.join_ring=false, source: 'src/java/org/apache/cassandra/service/StorageService.java:1041-1060'}
    - {call: storage-service.join-token-ring}
    else:
    - call: gossiper.add-local-application-state
      input: {state: STATUS_WITH_PORT, value: hibernate}
  - set: {state.initialized: true}
  - return: {operation_mode: = state.operation_mode}
- component: storage-service
  name: prepare-to-join
  kind: function
  summary: Refuses to rejoin a decommissioned node, starts listening for internode messages, starts gossip with a new generation and starts the background broadcasters.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:1140-1241']
  errors:
  - {code: config-error, status: 8960}
  behavior:
  - if: state.joined
    then:
    - return: {prepared: false}
  - if: state.bootstrap_state == 'DECOMMISSIONED' && !state.override_decommission
    then:
    - {title: A decommissioned node will not rejoin, source: 'src/java/org/apache/cassandra/service/StorageService.java:1146-1157'}
    - fail: {code: config-error, status: 8960, message: 'This node was decommissioned and will not rejoin the ring unless -Dcassandra.override_decommission=true has been set, or all existing data is removed
          and the node is bootstrapped again'}
  - {title: 'Listen for internode messages, then start gossip', source: 'src/java/org/apache/cassandra/service/StorageService.java:1163-1219', call: gossiper.start}
  - title: Start LoadBroadcaster, DiskUsageBroadcaster, hint dispatch and the batchlog
    source: src/java/org/apache/cassandra/service/StorageService.java:1235-1238
    set: {ctx.background_started: true}
- component: storage-service
  name: join-token-ring
  kind: function
  summary: Bootstraps when auto_bootstrap is on, bootstrap has not completed and this node is not a seed; otherwise reuses saved tokens. Then finishes joining unless streaming failed or survey mode is on.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:1266-1358', 'src/java/org/apache/cassandra/service/StorageService.java:1130-1133', 'src/java/org/apache/cassandra/config/Config.java:111']
  errors:
  - {code: config-error, status: 8960}
  behavior:
  - set: {state.joined: true, vars.should_bootstrap: '= config[''auto-bootstrap''] && state.bootstrap_state != ''COMPLETED'' && !state.is_seed', vars.data_available: true}
  - if: vars.should_bootstrap
    then:
    - {call: storage-service.prepare-for-bootstrap, as: prep}
    - call: storage-service.bootstrap
      input: {tokens: = vars.prep.value.tokens}
      as: bs
    - set: {vars.data_available: = vars.bs.value.success, vars.tokens: = vars.prep.value.tokens}
    else:
    - if: size(state.saved_tokens) == 0
      then:
      - {call: boot-strapper.get-bootstrap-tokens, as: bt}
      - set: {vars.tokens: = vars.bt.value.tokens}
      else:
      - if: size(state.saved_tokens) != state.num_tokens
        then:
        - {title: Saved token count must match num_tokens, source: 'src/java/org/apache/cassandra/service/StorageService.java:1313-1316'}
        - fail: {code: config-error, status: 8960, message: = 'Cannot change the number of tokens from ' + string(size(state.saved_tokens)) + ' to ' + string(state.num_tokens)}
      - set: {vars.tokens: = state.saved_tokens}
  - if: '!state.survey_mode'
    then:
    - if: vars.data_available
      then:
      - {title: Finish joining only when the data is available, source: 'src/java/org/apache/cassandra/service/StorageService.java:1322-1347'}
      - call: storage-service.finish-joining-ring
        input: {tokens: = vars.tokens}
      else:
      - set: {ctx.join_warning: Some data streaming failed. Use nodetool to check bootstrap state and resume.}
- component: storage-service
  name: prepare-for-bootstrap
  kind: function
  summary: Marks bootstrap IN_PROGRESS, waits for schema and pending ranges, refuses concurrent range movements under consistent range movement, refuses if already a member, then picks tokens.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:2092-2196', 'src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:176']
  response:
    type: object
    properties:
      tokens:
        type: array
        items: {type: integer}
  errors:
  - {code: unsupported-operation-exception}
  behavior:
  - set: {state.bootstrap_state: IN_PROGRESS, state.operation_mode: JOINING}
  - {call: pending-range-calculator-service.block-until-finished}
  - {call: token-metadata.get-range-movements, as: mv}
  - if: config['consistent-range-movement'] && (vars.mv.value.bootstrapping > 0 || vars.mv.value.leaving > 0 || vars.mv.value.moving > 0)
    then:
    - {title: 'Other bootstrapping, leaving or moving nodes', source: 'src/java/org/apache/cassandra/service/StorageService.java:2108-2120'}
    - fail: {code: unsupported-operation-exception, message: 'Other bootstrapping/leaving/moving nodes detected, cannot bootstrap while cassandra.consistent.rangemovement is true'}
  - call: token-metadata.is-member
    input: {endpoint: = self}
    as: mem
  - if: vars.mem.value.member
    then:
    - {title: Already a member of the ring, source: 'src/java/org/apache/cassandra/service/StorageService.java:2125-2129'}
    - fail: {code: unsupported-operation-exception, message: 'This node is already a member of the token ring; bootstrap aborted. (If replacing a dead node, remove the old one from the ring first.)'}
  - {call: boot-strapper.get-bootstrap-tokens, as: bt}
  - return: {tokens: = vars.bt.value.tokens}
- component: storage-service
  name: bootstrap
  kind: function
  summary: Gossips BOOT with the new tokens, sleeps RING_DELAY so others compute pending ranges, checks a seed was seen, then streams; failure leaves the node JOINING_FAILED.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:2208-2264', 'src/java/org/apache/cassandra/service/StorageService.java:313-325']
  request:
    type: object
    required: [tokens]
    properties:
      tokens:
        type: array
        items: {type: integer}
  response:
    type: object
    properties:
      success: {type: boolean}
  errors:
  - {code: illegal-state-exception}
  behavior:
  - set: {state.is_bootstrap_mode: true, state.saved_tokens: = input.tokens}
  - call: gossiper.add-local-application-state
    input: {state: TOKENS, tokens: = input.tokens}
  - title: Gossip STATUS BOOT
    source: src/java/org/apache/cassandra/service/StorageService.java:2216-2224
    call: gossiper.add-local-application-state
    input: {state: STATUS_WITH_PORT, value: BOOT}
  - {title: Sleep RING_DELAY for pending range setup, source: 'src/java/org/apache/cassandra/service/StorageService.java:2225-2226', wait: '= config[''ring-delay-ms'']'}
  - {call: gossiper.seen-any-seed, as: seed}
  - if: '!vars.seed.value.seen'
    then:
    - {title: No seed seen, source: 'src/java/org/apache/cassandra/service/StorageService.java:2234-2235'}
    - fail: {code: illegal-state-exception, message: Unable to contact any seeds}
  - call: boot-strapper.bootstrap
    input: {tokens: = input.tokens, keyspaces: = state.distributed_keyspaces}
    as: stream
    on_error: continue
  - if: vars.stream.ok
    then:
    - title: Bootstrap completed
      source: src/java/org/apache/cassandra/service/StorageService.java:2254-2256
      set: {state.is_bootstrap_mode: false}
    - return: {success: true}
  - title: Streaming failed, bootstrap must be resumed
    source: src/java/org/apache/cassandra/service/StorageService.java:2258-2263
    set: {state.operation_mode: JOINING_FAILED}
  - return: {success: false}
- component: storage-service
  name: finish-joining-ring
  kind: function
  summary: Marks bootstrap COMPLETED and sets the tokens, which gossips NORMAL and makes this node a ring member.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:1428-1439']
  request:
    type: object
    required: [tokens]
    properties:
      tokens:
        type: array
        items: {type: integer}
  behavior:
  - set: {state.operation_mode: JOINING, state.bootstrap_state: COMPLETED}
  - call: storage-service.set-tokens
    input: {tokens: = input.tokens}
- component: storage-service
  name: set-tokens
  kind: function
  summary: Saves the tokens, gossips TOKENS and STATUS NORMAL, updates token metadata and moves to NORMAL.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:527-538', 'src/java/org/apache/cassandra/service/StorageService.java:540-549']
  request:
    type: object
    required: [tokens]
    properties:
      tokens:
        type: array
        items: {type: integer}
  behavior:
  - set: {state.saved_tokens: = input.tokens}
  - call: gossiper.add-local-application-state
    input: {state: TOKENS, tokens: = input.tokens}
  - call: gossiper.add-local-application-state
    input: {state: STATUS_WITH_PORT, value: NORMAL}
  - call: token-metadata.update-normal-tokens
    input: {endpoint: = self, tokens: = input.tokens}
  - set: {state.operation_mode: NORMAL}
- component: storage-service
  name: decommission
  kind: function
  summary: 'Leaves the ring: refuses when this node is not a member, is the last normal node, is not NORMAL, or (without force) would leave fewer nodes than RF; then LEAVING, stream ranges and hints, LEFT,
    and shut down gossip and messaging.'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:5298-5422', 'src/java/org/apache/cassandra/config/Config.java:452']
  request:
    type: object
    properties:
      force: {type: boolean, default: false}
  response: MembershipLifecycleResult
  errors:
  - {code: unsupported-operation-exception}
  - {code: illegal-state-exception}
  - {code: runtime-exception}
  behavior:
  - if: state.operation_mode == 'DECOMMISSIONED'
    then:
    - {title: Already decommissioned, source: 'src/java/org/apache/cassandra/service/StorageService.java:5300-5304'}
    - return: {operation_mode: DECOMMISSIONED, detail: already decommissioned}
  - if: state.is_decommissioning
    then:
    - return: {operation_mode: = state.operation_mode, detail: still decommissioning}
  - {call: token-metadata.get-all-endpoints, as: all}
  - if: state.operation_mode != 'LEAVING'
    then:
    - call: token-metadata.is-member
      input: {endpoint: = self}
      as: mem
    - if: '!vars.mem.value.member'
      then:
      - {title: Not a ring member, source: 'src/java/org/apache/cassandra/service/StorageService.java:5316-5317'}
      - fail: {code: unsupported-operation-exception, message: local node is not a member of the token ring yet}
    - if: size(vars.all.value.endpoints) < 2 && self in vars.all.value.endpoints
      then:
      - {title: Last normal node, source: 'src/java/org/apache/cassandra/service/StorageService.java:5318-5319'}
      - fail: {code: unsupported-operation-exception, message: no other normal nodes in the ring; decommission would be pointless}
    - if: state.operation_mode != 'NORMAL' && state.operation_mode != 'DECOMMISSION_FAILED'
      then:
      - {title: Not NORMAL, source: 'src/java/org/apache/cassandra/service/StorageService.java:5320-5321'}
      - fail: {code: unsupported-operation-exception, message: = 'Node in ' + state.operation_mode + ' state; wait for status to become normal or restart'}
  - set: {state.is_decommissioning: true}
  - {call: pending-range-calculator-service.block-until-finished}
  - if: state.operation_mode != 'LEAVING'
    then:
    - foreach: = state.distributed_keyspaces
      as: ks
      steps:
      - call: token-metadata.get-replication-factor
        input: {keyspace: = vars.ks}
        as: rf
      - if: '!(has(input.force) && input.force) && size(vars.all.value.endpoints) <= vars.rf.value.rf && self in vars.all.value.endpoints'
        then:
        - {title: Not enough nodes to keep RF (checked unless forced), detail: 'The exception is thrown inside the try block, so the mode becomes DECOMMISSION_FAILED.', source: 'src/java/org/apache/cassandra/service/StorageService.java:5355-5367'}
        - set: {state.operation_mode: DECOMMISSION_FAILED, state.is_decommissioning: false}
        - fail: {code: unsupported-operation-exception, message: '= ''Not enough live nodes to maintain replication factor in keyspace '' + vars.ks + '' (RF = '' + string(vars.rf.value.rf) + '', N = ''
              + string(size(vars.all.value.endpoints)) + ''). Perform a forceful decommission to ignore.'''}
      - call: token-metadata.pending-endpoints-for-token
        input: {keyspace: = vars.ks, token: '= state.saved_tokens[0]'}
        as: pend
      - if: self in vars.pend.value.pending
        then:
        - {title: Data is moving to this node, source: 'src/java/org/apache/cassandra/service/StorageService.java:5370-5371'}
        - set: {state.operation_mode: DECOMMISSION_FAILED, state.is_decommissioning: false}
        - fail: {code: unsupported-operation-exception, message: data is currently moving to this node; unable to leave the ring}
  - title: startLeaving
    source: src/java/org/apache/cassandra/service/StorageService.java:5289-5296
    call: gossiper.add-local-application-state
    input: {state: STATUS_WITH_PORT, value: LEAVING}
  - call: token-metadata.add-leaving-endpoint
    input: {endpoint: = self}
  - {call: pending-range-calculator-service.update}
  - title: Sleep max(RING_DELAY, batchlog timeout) for batch processing and pending range setup
    source: src/java/org/apache/cassandra/service/StorageService.java:5376-5378
    set: {state.operation_mode: LEAVING}
  - {wait: '= config[''ring-delay-ms'']'}
  - {call: storage-service.unbootstrap, as: unb, on_error: continue}
  - if: '!vars.unb.ok'
    then:
    - title: Streaming failed
      source: src/java/org/apache/cassandra/service/StorageService.java:5406-5411
      set: {state.operation_mode: DECOMMISSION_FAILED, state.is_decommissioning: false}
    - fail: {code: runtime-exception, message: '= ''Error while decommissioning node: '' + vars.unb.error.code'}
  - {title: 'Shut down client servers, gossip and messaging', source: 'src/java/org/apache/cassandra/service/StorageService.java:5384-5395', call: gossiper.stop}
  - title: DECOMMISSIONED
    source: src/java/org/apache/cassandra/service/StorageService.java:5396-5397
    set: {state.bootstrap_state: DECOMMISSIONED, state.operation_mode: DECOMMISSIONED, state.is_decommissioning: false}
  - return: {operation_mode: DECOMMISSIONED}
- component: storage-service
  name: unbootstrap
  kind: function
  summary: Streams this node's ranges to their new owners while the batchlog replays; hints are transferred (or deleted) after the batchlog replay, concurrently with the stream; then the node leaves the
    ring.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:5454-5490', 'src/java/org/apache/cassandra/service/StorageService.java:5437-5452', 'src/java/org/apache/cassandra/service/StorageService.java:5424-5435']
  behavior:
  - {title: The ranges this node gives away and their new owners (getChangedReplicasForLeaving), source: 'src/java/org/apache/cassandra/service/StorageService.java:5437-5452', call: token-metadata.get-pending-range-maps,
    as: pm}
  - set: {vars.moves: '= vars.pm.value.ranges.filter(r, r.endpoint != self)'}
  - set: {vars.targets: '= vars.moves.map(r, r.endpoint).distinct()'}
  - set: {vars.plans: '= state.distributed_keyspaces.map(ks, vars.targets.map(t, {''keyspace'': ks, ''peer'': t, ''ranges'': vars.moves.filter(r, r.endpoint == t).map(r, ''('' + string(r.left) + '','' +
        string(r.right) + '']'')})).flatten()'}
  - title: Batchlog replay and range streaming start together; hints follow the batchlog replay
    source: src/java/org/apache/cassandra/service/StorageService.java:5462-5487
    branches:
    - - parallel: = vars.plans
        as: plan
        steps:
        - call: stream-plan.execute
          input: {operation: UNBOOTSTRAP, initiator: = self, peer: = vars.plan.peer, peers: '= [vars.plan.peer]', keyspace: = vars.plan.keyspace, ranges: = vars.plan.ranges, request_ranges: false, transfer_ranges: true}
        join: {need: all}
        on_insufficient: {code: stream-exception, summary: Stream failed}
    - - {title: Replay the batchlog, source: 'src/java/org/apache/cassandra/service/StorageService.java:5462-5467', call: batchlog-manager.start-batchlog-replay}
      - if: config['transfer-hints-on-decommission']
        then:
        - {call: storage-service.get-preferred-hints-stream-target, as: target}
        - title: Stream hints to the closest live peer
          source: src/java/org/apache/cassandra/service/StorageService.java:5471-5475
          call: hints-service.transfer-hints
          input: {target_host_id: = vars.target.value.host_id}
        else:
        - {title: Pause dispatch and delete hints, source: 'src/java/org/apache/cassandra/service/StorageService.java:5476-5482', call: hints-service.pause-dispatch}
    join: {need: all}
    as_result: ub
    on_insufficient: {code: runtime-exception, summary: Error while decommissioning node}
  - set: {ctx.unbootstrap_targets: = vars.targets}
  - title: leaveRing
    source: src/java/org/apache/cassandra/service/StorageService.java:5426-5428
    set: {state.bootstrap_state: NEEDS_BOOTSTRAP}
  - call: token-metadata.remove-endpoint
    input: {endpoint: = self}
  - {call: pending-range-calculator-service.update}
  - title: Gossip LEFT and announce it for max(RING_DELAY, 2 gossip intervals)
    source: src/java/org/apache/cassandra/service/StorageService.java:5430-5434
    call: gossiper.add-local-application-state
    input: {state: STATUS_WITH_PORT, value: LEFT}
  - {wait: '= int(config[''ring-delay-ms'']) > 2 * int(config[''gossip-interval-ms'']) ? config[''ring-delay-ms''] : 2 * int(config[''gossip-interval-ms''])'}
- component: storage-service
  name: move
  kind: function
  summary: 'Moves a single-token node to a new token: refuses an owned token, a vnode node, or data moving to this node; gossips MOVING, sleeps RING_DELAY, streams, then sets the new token.'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:5527-5612']
  request:
    type: object
    required: [new_token]
    properties:
      new_token:
        type: integer
        examples: [3074457345618258602]
  response: MembershipLifecycleResult
  errors:
  - {code: io-exception}
  - {code: unsupported-operation-exception}
  - {code: runtime-exception}
  behavior:
  - call: token-metadata.get-tokens
    input: {endpoint: = self}
    as: mine
  - {call: token-metadata.get-all-endpoints, as: all}
  - call: token-metadata.ring-iterator
    input: {token: = input.new_token, rf: 1}
    as: primary
  - call: token-metadata.get-tokens
    input: {endpoint: '= vars.primary.value.replicas[0]'}
    as: ptoks
  - if: input.new_token in vars.ptoks.value.tokens
    then:
    - {title: Target token already owned, source: 'src/java/org/apache/cassandra/service/StorageService.java:5552-5553'}
    - fail: {code: io-exception, message: = 'target token ' + string(input.new_token) + ' is already owned by another node.'}
  - if: size(vars.mine.value.tokens) > 1
    then:
    - {title: Nodes with more than one token cannot move, source: 'src/java/org/apache/cassandra/service/StorageService.java:5559-5563'}
    - fail: {code: unsupported-operation-exception, message: This node has more than one token and cannot be moved thusly.}
  - {call: pending-range-calculator-service.block-until-finished}
  - call: token-metadata.pending-endpoints-for-token
    input: {keyspace: '*', token: '= vars.mine.value.tokens[0]'}
    as: pend
  - if: self in vars.pend.value.pending
    then:
    - {title: Data is moving to this node, source: 'src/java/org/apache/cassandra/service/StorageService.java:5569-5574'}
    - fail: {code: unsupported-operation-exception, message: data is currently moving to this node; unable to leave the ring}
  - title: Gossip MOVING with the new token
    detail: The local onChange (handleStateMoving) marks this node moving in token metadata.
    source: src/java/org/apache/cassandra/service/StorageService.java:5576-5578
    call: gossiper.add-local-application-state
    input: {state: STATUS_WITH_PORT, value: MOVING, tokens: '= [input.new_token]'}
  - set: {state.operation_mode: MOVING}
  - {title: Sleep RING_DELAY before streaming, source: 'src/java/org/apache/cassandra/service/StorageService.java:5580-5581', wait: '= config[''ring-delay-ms'']'}
  - title: Fetch new ranges and stream old ranges
    source: src/java/org/apache/cassandra/service/StorageService.java:5583-5602
    call: stream-plan.execute
    input: {operation: RELOCATION, peers: '= vars.all.value.endpoints.filter(e, e != self)'}
    as: st
    on_error: continue
  - if: '!vars.st.ok'
    then:
    - fail: {code: runtime-exception, message: '= ''Interrupted while waiting for stream/fetch ranges to finish: '' + vars.st.error.code'}
  - title: Set the new token
    source: src/java/org/apache/cassandra/service/StorageService.java:5608
    call: storage-service.set-tokens
    input: {tokens: '= [input.new_token]'}
  - return: {operation_mode: = state.operation_mode}
- component: storage-service
  name: remove-node
  kind: function
  summary: 'Removes a dead node by host id: refuses unknown, non-member, self or live nodes and concurrent removals; marks it leaving, waits for replicas to re-replicate, then excises it and gossips removed.'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:5683-5755']
  request:
    type: object
    required: [host_id]
    properties:
      host_id:
        type: string
        examples: [6d194555-f6eb-41d0-c000-000000000003]
  response:
    type: object
    properties:
      removed: {type: string}
  errors:
  - {code: unsupported-operation-exception}
  behavior:
  - call: token-metadata.get-endpoint-for-host-id
    input: {host_id: = input.host_id}
    as: ep
  - if: vars.ep.value.endpoint == ''
    then:
    - fail: {code: unsupported-operation-exception, message: Host ID not found.}
  - set: {vars.endpoint: = vars.ep.value.endpoint}
  - call: token-metadata.is-member
    input: {endpoint: = vars.endpoint}
    as: mem
  - if: '!vars.mem.value.member'
    then:
    - fail: {code: unsupported-operation-exception, message: Node to be removed is not a member of the token ring}
  - if: vars.endpoint == self
    then:
    - fail: {code: unsupported-operation-exception, message: Cannot remove self}
  - {call: gossiper.get-live-members, as: live}
  - if: vars.endpoint in vars.live.value.members
    then:
    - {title: The node is alive, source: 'src/java/org/apache/cassandra/service/StorageService.java:5699-5700'}
    - fail: {code: unsupported-operation-exception, message: = 'Node ' + vars.endpoint + ' is alive and owns this ID. Use decommission command to remove it from the ring'}
  - if: size(state.replicating_nodes) > 0
    then:
    - fail: {code: unsupported-operation-exception, message: 'This node is already processing a removal. Wait for it to complete, or use ''removenode force'' if this has failed.'}
  - call: token-metadata.get-tokens
    input: {endpoint: = vars.endpoint}
    as: tk
  - title: Mark it leaving and recalculate pending ranges
    source: src/java/org/apache/cassandra/service/StorageService.java:5732-5733
    call: token-metadata.add-leaving-endpoint
    input: {endpoint: = vars.endpoint}
  - {call: pending-range-calculator-service.update}
  - call: token-metadata.pending-endpoints-for-token
    input: {keyspace: '*', token: '= vars.tk.value.tokens[0]'}
    as: gainers
  - title: Live new replicas must confirm re-replication
    source: src/java/org/apache/cassandra/service/StorageService.java:5712-5729
    set: {state.replicating_nodes: = vars.gainers.value.pending}
  - title: Wait for REPLICATION_FINISHED from every replicating node
    source: src/java/org/apache/cassandra/service/StorageService.java:5740-5746
    choice: replication
    default: confirmed
    options:
      confirmed:
      - set:
          state.replicating_nodes: []
      never_confirmed:
      - set: {ctx.removenode_blocked: true}
      - return: {removed: ''}
  - call: storage-service.excise
    input: {endpoint: = vars.endpoint, tokens: = vars.tk.value.tokens}
  - title: Gossip that the tokens were removed
    source: src/java/org/apache/cassandra/service/StorageService.java:5751
    set: {ctx.advertised_token_removed: = vars.endpoint}
  - return: {removed: = vars.endpoint}
- component: storage-service
  name: drain
  kind: function
  summary: 'Shuts the node off to writes: stops the batchlog, hint dispatch, client servers, gossip (announcing shutdown) and messaging, then flushes every table and shuts down the commit log.'
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:5840-5996', 'src/java/org/apache/cassandra/service/StorageService.java:5835-5838']
  response: MembershipLifecycleResult
  behavior:
  - if: state.is_shutdown
    then:
    - {title: Already drained, source: 'src/java/org/apache/cassandra/service/StorageService.java:5842-5847'}
    - return: {operation_mode: = state.operation_mode, detail: 'Cannot drain node (did it already happen?)'}
  - set: {state.is_shutdown: true, state.operation_mode: DRAINING}
  - {title: Pause hint dispatch, source: 'src/java/org/apache/cassandra/service/StorageService.java:5871', call: hints-service.pause-dispatch}
  - {title: Stop gossip (announces shutdown), source: 'src/java/org/apache/cassandra/service/StorageService.java:5876', call: gossiper.stop}
  - foreach: = state.user_tables
    as: tb
    steps:
    - title: Flush each table (failures are logged and ignored)
      source: src/java/org/apache/cassandra/service/StorageService.java:5915-5938
      call: column-family-store.force-flush
      input: {keyspace: = vars.tb.keyspace, table: = vars.tb.table, reason: DRAIN}
      on_error: continue
  - title: Shut down the commit log and executors
    source: src/java/org/apache/cassandra/service/StorageService.java:5963-5983
    set: {state.operation_mode: DRAINED}
  - return: {operation_mode: DRAINED}
- component: boot-strapper
  name: get-bootstrap-tokens
  kind: function
  summary: 'Chooses tokens for a joining node: initial_token if set, else allocation for allocate_tokens_for_local_replication_factor (3).'
  description: The model's allocation picks the midpoint of the first ring range instead of running TokenAllocation.
  sources: ['src/java/org/apache/cassandra/dht/BootStrapper.java:156-181']
  response:
    type: object
    properties:
      tokens:
        type: array
        items: {type: integer}
  behavior:
  - {call: token-metadata.get-all-endpoints, as: all}
  - call: token-metadata.ring-iterator
    input: {token: -9223372036854775807, rf: 1}
    as: first
  - call: token-metadata.get-tokens
    input: {endpoint: '= vars.first.value.replicas[0]'}
    as: ft
  - return: {tokens: '= [vars.ft.value.tokens[0] - 1537228672809129301]'}
- component: boot-strapper
  name: bootstrap
  kind: function
  summary: Builds a RangeStreamer for this node's pending ranges in every distributed keyspace and fetches them.
  sources: ['src/java/org/apache/cassandra/dht/BootStrapper.java:63-85']
  request:
    type: object
    required: [tokens]
    properties:
      tokens:
        type: array
        items: {type: integer}
      keyspaces:
        type: array
        items: {type: string}
  behavior:
  - call: range-streamer.fetch-async
    input: {operation: BOOTSTRAP, keyspaces: '= has(input.keyspaces) ? input.keyspaces : []', tokens: = input.tokens}
- component: range-streamer
  name: fetch-async
  kind: function
  summary: 'For each range this node will own (its pending ranges), picks the source per keyspace: under consistent range movement with more nodes than RF, the one old replica that is not a replica after the join (the replica losing the range); otherwise the first old replica. Then streams each source''s ranges, per keyspace, concurrently.'
  sources: ['src/java/org/apache/cassandra/dht/RangeStreamer.java:697-782', 'src/java/org/apache/cassandra/dht/RangeStreamer.java:494-521', 'src/java/org/apache/cassandra/dht/RangeStreamer.java:394-416', 'src/java/org/apache/cassandra/dht/RangeStreamer.java:237-243']
  request:
    type: object
    required: [operation]
    properties:
      operation:
        type: string
        examples: [BOOTSTRAP]
      keyspaces:
        type: array
        items: {type: string}
        examples:
        - [ks1, shop]
      tokens:
        type: array
        description: The joining node's tokens (bootstrap); without them strict sources are not used.
        items: {type: integer}
  errors:
  - {code: assertion-error}
  - {code: illegal-state-exception}
  - {code: stream-exception}
  behavior:
  - {call: token-metadata.get-pending-range-maps, as: pm}
  - {call: token-metadata.get-size-of-all-endpoints, as: size}
  - set:
      vars.fetch: []
      vars.mine: '= has(input.tokens) ? input.tokens.map(t, {''token'': t, ''endpoint'': self}) : []'
  - title: Cluster size counts host ids, which include this joining node (prepareToJoin registers it before it owns tokens)
    source: src/java/org/apache/cassandra/service/StorageService.java:1208
    set: {vars.nodes: '= vars.size.value.count + (size(vars.mine) > 0 ? 1 : 0)'}
  - foreach: '= has(input.keyspaces) ? input.keyspaces : []'
    as: ks
    steps:
    - call: token-metadata.get-replication-factor
      input: {keyspace: = vars.ks}
      as: rf
    - title: Strict sources only when bootstrapping with tokens, consistent range movement on and more nodes than RF
      source: src/java/org/apache/cassandra/dht/RangeStreamer.java:394-416
      set: {vars.strict: '= config[''consistent-range-movement''] && input.operation == ''BOOTSTRAP'' && size(vars.mine) > 0 && vars.nodes > vars.rf.value.rf'}
    - foreach: = vars.pm.value.ranges.filter(x, x.endpoint == self)
      as: r
      steps:
      - title: Who replicates the range now (never this node)
        source: src/java/org/apache/cassandra/dht/RangeStreamer.java:237-243
        call: token-metadata.ring-iterator
        input: {token: = vars.r.right, rf: = vars.rf.value.rf, exclude: '= [self]'}
        as: old
      - title: Who replicates it once this node owns its tokens (tmdAfter)
        source: src/java/org/apache/cassandra/dht/RangeStreamer.java:428-435
        call: token-metadata.ring-iterator
        input: {token: = vars.r.right, rf: = vars.rf.value.rf, exclude: '= [self]', extra: = vars.mine}
        as: after
      - set: {vars.losing: '= vars.old.value.replicas.filter(e, !(e in vars.after.value.replicas))'}
      - if: size(vars.old.value.replicas) == 0
        then:
        - title: No replica holds the range
          source: src/java/org/apache/cassandra/dht/RangeStreamer.java:556-558
          fail: {code: illegal-state-exception, message: '= ''Failed to find endpoints to fetch ('' + string(vars.r.left) + '','' + string(vars.r.right) + '']'''}
      - if: vars.strict && size(vars.old.value.replicas) == vars.rf.value.rf
        then:
        - if: size(vars.losing) > 1
          then:
          - title: More than one replica loses the range
            source: src/java/org/apache/cassandra/dht/RangeStreamer.java:511-512
            fail: {code: assertion-error, message: '= ''Expected <= 1 endpoint but found '' + string(vars.losing)'}
        - title: Fetch from the old replica that loses the range (or, when none does, the first old full replica)
          source: src/java/org/apache/cassandra/dht/RangeStreamer.java:494-538
          set: {vars.source: '= size(vars.losing) == 1 ? vars.losing[0] : vars.old.value.replicas[0]'}
        else:
        - title: Without strict consistency, the first old replica (SimpleSnitch keeps ring order)
          source: src/java/org/apache/cassandra/dht/RangeStreamer.java:542-551
          set: {vars.source: '= vars.old.value.replicas[0]'}
      - set: {vars.fetch: '= vars.fetch + [{''keyspace'': vars.ks, ''source'': vars.source, ''range'': ''('' + string(vars.r.left) + '','' + string(vars.r.right) + '']''}]'}
  - set: {vars.sources: '= vars.fetch.map(f, f.source).distinct()'}
  - set: {vars.plans: '= vars.fetch.map(f, f.keyspace + ''/'' + f.source).distinct().map(k, {''keyspace'': k.split(''/'')[0], ''peer'': k.split(''/'')[1], ''ranges'': vars.fetch.filter(f, f.keyspace + ''/'' + f.source == k).map(f, f.range)})'}
  - title: Stream every source's ranges concurrently
    source: src/java/org/apache/cassandra/dht/RangeStreamer.java:760-782
    parallel: = vars.plans
    as: plan
    steps:
    - call: stream-plan.execute
      input: {operation: = input.operation, initiator: = self, peer: = vars.plan.peer, peers: '= [vars.plan.peer]', keyspace: = vars.plan.keyspace, ranges: = vars.plan.ranges, request_ranges: true, transfer_ranges: false}
    join: {need: all}
    on_insufficient: {code: stream-exception, summary: Stream failed}
  - return: {sources: = vars.sources, plans: = size(vars.plans)}
- component: load-broadcaster
  name: start-broadcasting
  kind: function
  summary: 'The scheduled runnable: when gossip is enabled, publishes this node''s load as the LOAD application state (first after 2 s, then every 60 s).'
  attributes: {schedule: 'initial delay 2000 ms, then every broadcast_interval_ms (60000)'}
  sources: ['src/java/org/apache/cassandra/service/LoadBroadcaster.java:76-93', 'src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:76']
  behavior:
  - {call: gossiper.is-enabled, as: g}
  - if: '!vars.g.value.enabled'
    then:
    - return: {broadcast: false}
  - title: Disseminate load info
    source: src/java/org/apache/cassandra/service/LoadBroadcaster.java:88-89
    call: gossiper.add-local-application-state
    input: {state: LOAD, load: = state.local_load_bytes}
  - return: {broadcast: true}
- component: load-broadcaster
  name: on-change
  kind: function
  subscribe: [endpoint-state-change-subscriber.on-change]
  summary: Records LOAD values gossiped by every endpoint; other application states are ignored.
  sources: ['src/java/org/apache/cassandra/service/LoadBroadcaster.java:50-55']
  request:
    type: object
    required: [endpoint, state]
    properties:
      endpoint: {type: string}
      state: {type: string}
      value: {type: string}
      load: {type: integer}
  behavior:
  - if: input.state != 'LOAD'
    then:
    - return: {recorded: false}
  - set: {ctx.load_info_updated: = input.endpoint}
  - return: {recorded: true}
- component: gossiper
  name: get-endpoint-downtime
  kind: function
  summary: Milliseconds since an unreachable endpoint was marked down; 0 when it is not unreachable.
  description: The mark-down time is endpoint_state_map.<ep>.down_since_ms (set by mark-dead). A scenario that marks a node down for longer than max_hint_window sets it, for example {alive false, down_since_ms
    -11000000}.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:541-548', 'src/java/org/apache/cassandra/gms/GossiperMBean.java:26']
  request: MembershipEndpoint
  response:
    type: object
    properties:
      downtime_ms: {type: integer}
  behavior:
  - set: {vars.row: '= input.endpoint in state.endpoint_state_map ? state.endpoint_state_map[input.endpoint] : {}'}
  - set: {vars.down: = input.endpoint in state.unreachable_endpoints || (has(vars.row.alive) && !vars.row.alive)}
  - return: {downtime_ms: '= vars.down && has(vars.row.down_since_ms) ? now - vars.row.down_since_ms : 0'}
- component: gossiper
  name: get-min-version
  kind: function
  summary: The lowest release version gossiped by any endpoint (null on timeout); every modeled node runs 5.0.9.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2591-2608']
  request:
    type: object
    properties:
      timeout_ms: {type: integer}
  response:
    type: string
    examples: [5.0.9]
  behavior:
  - {return: = state.release_version}
- component: gossiper
  name: get-unreachable-token-owners
  kind: function
  summary: Unreachable endpoints that own tokens in the ring.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:529-539']
  response:
    type: object
    properties:
      endpoints:
        type: array
        items: {type: string}
  behavior:
  - set:
      vars.out: []
  - foreach: '= state.endpoint_state_map.filter(e, e != self && has(state.endpoint_state_map[e].alive) && !state.endpoint_state_map[e].alive)'
    as: ep
    steps:
    - call: token-metadata.is-member
      input: {endpoint: = vars.ep}
      as: mem
    - if: vars.mem.value.member
      then:
      - set: {vars.out: '= vars.out + [vars.ep]'}
  - return: {endpoints: = vars.out}
- component: gossiper
  name: is-alive
  kind: function
  summary: 'Gossiper.isAlive: the endpoint''s state is alive and not a dead state (LEFT, removing, removed, hibernate); false when unknown.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:1576-1591']
  request: MembershipEndpoint
  response: MembershipIsAliveResponse
  behavior:
  - set: {vars.row: '= input.endpoint in state.endpoint_state_map ? state.endpoint_state_map[input.endpoint] : {}'}
  - return: {endpoint: = input.endpoint, alive: '= has(vars.row.alive) && vars.row.alive && !(has(vars.row.status) && vars.row.status in [''removing'', ''removed'', ''LEFT'', ''hibernate''])'}
- component: gossiper
  name: reload-seeds
  kind: function
  summary: 'JMX: re-reads the seed provider (minus this node); an empty result keeps the current seeds.'
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2139-2185', 'src/java/org/apache/cassandra/gms/GossiperMBean.java:34']
  response:
    type: object
    properties:
      seeds:
        type: array
        items: {type: string}
  behavior:
  - set: {vars.fresh: '= state.configured_seeds.filter(x, x != self)'}
  - if: size(vars.fresh) == 0
    then:
    - {title: An empty new list keeps the current seeds, source: 'src/java/org/apache/cassandra/gms/Gossiper.java:2164-2168'}
    - return: {seeds: = state.seeds}
  - set: {state.seeds: = vars.fresh}
  - return: {seeds: = vars.fresh}
- component: gossiper
  name: wait-for-schema-agreement
  kind: function
  summary: Polls with backoff (50 ms doubling to 1 s) until every live token owner reports the same schema version, up to max_wait_ms.
  sources: ['src/java/org/apache/cassandra/gms/Gossiper.java:2519-2538']
  request:
    type: object
    properties:
      max_wait_ms: {type: integer}
  response:
    type: object
    properties:
      agreed: {type: boolean}
  behavior:
  - title: Do the live token owners agree on the schema version?
    detail: Schema versions are not part of the modeled gossip state, so agreement is a choice.
    choice: agreement
    default: agreed
    options:
      agreed:
      - return: {agreed: true}
      disagree:
