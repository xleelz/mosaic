scenarios:
- id: mem-is-alive-live-peer
  flow: membership-failure-detector-is-alive
  fixtures: [three-node-rf3]
  expect: [result.ok && result.value.alive == true, 'calls[''gossiper.get-endpoint-state-for-endpoint''] == 1']
- id: mem-is-alive-down-peer
  flow: membership-failure-detector-is-alive
  fixtures: [three-node-rf3]
  state:
    gossiper@n1:
      endpoint_state_map:
        n2: {alive: false}
  expect: [result.ok && result.value.alive == false]
- id: mem-is-alive-views-differ
  name: Liveness is each node's own view
  fixtures: [three-node-rf3]
  state:
    gossiper@n1:
      endpoint_state_map:
        n3: {alive: false}
  steps:
  - flow: membership-failure-detector-is-alive
    input: {endpoint: n3}
    as: from_n1
  - flow: membership-failure-detector-is-alive
    input: {endpoint: n3}
    'on': n2
    as: from_n2
  expect: [steps.from_n1.result.value.alive == false && steps.from_n2.result.value.alive == true]
- id: mem-is-alive-self
  flow: membership-failure-detector-is-alive
  fixtures: [three-node-rf3]
  input: {endpoint: n1}
  state:
    gossiper@n1:
      endpoint_state_map:
        n1: {alive: false}
  expect: [result.value.alive == true, 'calls[''gossiper.get-endpoint-state-for-endpoint''] == 0']
- id: mem-is-alive-unknown-endpoint
  flow: membership-failure-detector-is-alive
  fixtures: [three-node-rf3]
  input: {endpoint: n9}
  expect: [result.ok && result.value.alive == false]
- id: mem-replicas-rf3
  flow: membership-replica-lookup
  fixtures: [three-node-rf3]
  expect: ['result.value.natural == [''n3'', ''n1'', ''n2'']', 'result.value.pending == [] && result.value.replicas == result.value.natural']
- id: mem-replicas-wrap-around
  flow: membership-replica-lookup
  fixtures: [three-node-rf3]
  input: {token: 7000000000000000000}
  expect: ['result.value.natural == [''n1'', ''n2'', ''n3'']']
- id: mem-replicas-exact-token
  flow: membership-replica-lookup
  fixtures: [three-node-rf3]
  input: {token: 0}
  expect: ['result.value.natural == [''n2'', ''n3'', ''n1'']']
- id: mem-replicas-rf1
  flow: membership-replica-lookup
  fixtures: [three-node-rf3]
  input: {keyspace: ks_rf1}
  state:
    token-metadata@n1:
      keyspace_rf: {ks_rf1: 1}
  expect: ['result.value.natural == [''n3''] && size(result.value.replicas) == 1']
- id: mem-replicas-unknown-keyspace-default-rf
  flow: membership-replica-lookup
  fixtures: [three-node-rf3]
  input: {keyspace: other_ks}
  expect: [size(result.value.natural) == 3]
- id: mem-replicas-four-nodes-coordinator-not-replica
  flow: membership-replica-lookup
  fixtures: [four-node-rf3]
  input: {keyspace: shop, token: -5}
  expect: ['result.value.natural == [''n2'', ''n4'', ''n3'']']
- id: mem-replicas-with-pending
  name: A bootstrapping node is a pending replica
  flow: membership-replica-lookup
  fixtures: [three-node-rf3]
  state:
    token-metadata@n1:
      pending_ranges:
      - {keyspace: '*', left: 0, right: 3074457345618258602, endpoint: n4}
  expect: ['result.value.pending == [''n4'']', 'result.value.replicas == [''n3'', ''n1'', ''n2'', ''n4'']']
- id: mem-replicas-wrapping-pending-range
  flow: membership-replica-lookup
  fixtures: [three-node-rf3]
  input: {token: -7000000000000000000}
  state:
    token-metadata@n1:
      pending_ranges:
      - {keyspace: ks1, left: 6148914691236517205, right: -6148914691236517206, endpoint: n4}
  expect: ['result.value.pending == [''n4'']']
- id: mem-ring-sorted
  flow: membership-ring
  fixtures: [four-node-rf3]
  expect: ['result.value.tokens == [-6148914691236517206, 0, 3000000000000000000, 6148914691236517205]', 'result.value.ring.map(r, r.endpoint) == [''n1'', ''n2'', ''n4'', ''n3'']']
- id: mem-round-happy
  name: 'One round: SYN to a live peer, which requests n1''s newer state; ACK and ACK2 carry it across'
  flow: membership-gossip-round
  fixtures: [three-node-rf3]
  state:
    failure-detector@n1:
      arrival_samples:
        n2: {t_last_ms: 1793318400000, mean_ms: 1000}
        n3: {t_last_ms: 1793318400000, mean_ms: 1000}
    failure-detector@n2:
      arrival_samples:
        n1: {t_last_ms: 1793318400000, mean_ms: 1000}
        n3: {t_last_ms: 1793318400000, mean_ms: 1000}
    failure-detector@n3:
      arrival_samples:
        n1: {t_last_ms: 1793318400000, mean_ms: 1000}
        n2: {t_last_ms: 1793318400000, mean_ms: 1000}
  expect: [result.ok && result.value.gossiped, 'state[''gossiper@n1''].endpoint_state_map.n1.heartbeat == 401', 'calls[''gossip-digest-syn-verb-handler.do-verb''] == 1 && calls[''gossip-digest-ack-verb-handler.do-verb'']
      == 1 && calls[''gossip-digest-ack2-verb-handler.do-verb''] == 1', 'trace.exists(e, e.type == ''call.start'' && e.interface == ''gossip-digest-ack-verb-handler.do-verb'' && e.instance == ''n1'')',
    'trace.exists(e, e.type == ''call.start'' && e.interface == ''gossip-digest-ack2-verb-handler.do-verb'' && e.instance == result.value.to)', 'state[''gossiper@'' + result.value.to].endpoint_state_map.n1.heartbeat
      == 401', 'calls[''failure-detector.interpret''] == 2 && !has(ctx.convicted)']
- id: mem-gossip-converges
  name: n3 starts LEAVING; three rounds (n3, n2, n1) spread it to every node's view and token metadata
  fixtures: [three-node-rf3]
  state:
    failure-detector@n1:
      arrival_samples:
        n2: {t_last_ms: 1793318400000, mean_ms: 1000}
        n3: {t_last_ms: 1793318400000, mean_ms: 1000}
    failure-detector@n2:
      arrival_samples:
        n1: {t_last_ms: 1793318400000, mean_ms: 1000}
        n3: {t_last_ms: 1793318400000, mean_ms: 1000}
    failure-detector@n3:
      arrival_samples:
        n1: {t_last_ms: 1793318400000, mean_ms: 1000}
        n2: {t_last_ms: 1793318400000, mean_ms: 1000}
  steps:
  - interface: gossiper.add-local-application-state
    caller: membership
    'on': n3
    input: {state: STATUS_WITH_PORT, value: LEAVING}
    as: leave
  - {flow: membership-gossip-round, 'on': n3, at_ms: 1000, as: r1}
  - {flow: membership-gossip-round, 'on': n2, at_ms: 2000, as: r2}
  - {flow: membership-gossip-round, 'on': n1, at_ms: 3000, as: r3}
