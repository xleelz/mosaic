  name: check-service-allowed-to-start
  kind: function
  summary: Refuses to start a service (gossip, native transport, auto compaction, hinted handoff) while draining, after drain, or when not NORMAL on a node that joins the ring.
  sources: ['src/java/org/apache/cassandra/service/StorageService.java:6059-6069']
  request:
