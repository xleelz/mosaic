      - "calls['paxos-repair.start'] == 3 && ctx.repairedUncommittedKeys == 1 && calls['column-family-store.on-paxos-repair-complete'] == 3"
      - "state['paxos-ballot-tracker@n2'].low_bound > 1793318400000000 && ctx.cleanupCompleteLowBound == state['paxos-ballot-tracker@n2'].low_bound"
      - "duration_ms >= 1000"
  - id: paxos-cleanup-then-repair-key
    flow: paxos-cleanup
    name: "The raised low bound is read back: a later key repair on the same table finds the key already settled"
    fixtures: [three-node-rf3]
    steps:
      - {flow: paxos-cleanup, as: c}
      - {flow: paxos-key-repair, as: k}
    expect:
      - "steps.c.result.ok && steps.k.result.ok && steps.k.result.value.successful == true"
      - "state['paxos-ballot-tracker@n3'].low_bound > 1793318400000000"
  - id: paxos-cleanup-start-prepare-failure
    flow: paxos-cleanup
    name: "A failure response to the start-prepare fails the cleanup"
    fixtures: [three-node-rf3]
    faults:
      - {target: paxos-start-prepare-cleanup.do-verb, type: error, code: request-failure, instance: n2}
    expect:
      - "!result.ok && result.error.code == 'paxos-cleanup-exception' && calls['paxos-finish-prepare-cleanup.finish'] == 0"
      - "state['paxos-ballot-tracker@n1'].low_bound == 0"
  - id: paxos-cleanup-ranges-not-replicated
    flow: paxos-cleanup
    name: "An endpoint that does not replicate the ranges rejects the cleanup; the session fails"
    fixtures: [three-node-rf3]
    choices: {paxos-cleanup-request.do-verb.ranges_replicated: not_replicated}
    expect:
      - "!result.ok && result.error.code == 'paxos-cleanup-exception' && result.error.message.contains('Some ranges are not replicated')"
      - "calls['paxos-cleanup-request.do-verb'] == 1 && calls['paxos-cleanup-complete.run'] == 0"
      - "state['paxos-ballot-tracker@n2'].low_bound > 1793318400000000"
  - id: paxos-cleanup-key-repair-fails
    flow: paxos-cleanup
    name: "A key repair cannot reach a quorum (two replicas down): the endpoint reports failure and the session fails"
    fixtures: [three-node-rf3]
    state:
      gossiper@n1: {endpoint_state_map: {n2: {alive: false}, n3: {alive: false}}}
    expect:
      - "!result.ok && result.error.code == 'paxos-cleanup-exception' && ctx.localCleanupFailed == true"
      - "calls['paxos-cleanup-complete.run'] == 0"
      - "state['paxos-ballot-tracker@n1'].low_bound > 1793318400000000"
  - id: paxos-cleanup-skipped-replicas
    flow: paxos-cleanup
    name: "With skipped replicas the completion marks nothing repaired"
    fixtures: [three-node-rf3]
    input: {skipped_replicas: true}
    expect:
      - "result.ok && ctx.cleanupCompleteLowBound == 0 && calls['paxos-cleanup-complete.do-verb'] == 3"
      - "state['paxos-ballot-tracker@n3'].low_bound > 1793318400000000"

  # ------------------------------------------------------------- auto repair
  - id: paxos-auto-repair-starts
    flow: paxos-auto-repair
    name: "Each maintenance pass (first after 300s) starts an auto repair for the table with uncommitted state"
    fixtures: [three-node-rf3]
    expect:
      - "passes[0].result.ok && passes[1].result.ok && passes[0].start_ms >= 300000 && passes[1].start_ms >= 600000"
      - "calls['storage-service.auto-repair-paxos'] == 2 && ctx.autoRepairedTables == ['shop.accounts']"
      - "ctx.evictedHungRepairs == true && ctx.consolidatedFiles == true"
  - id: paxos-auto-repair-disabled
    flow: paxos-auto-repair
    name: "Auto repairs disabled (cassandra.disable_paxos_auto_repairs): nothing is started"
    fixtures: [three-node-rf3]
    state:
      paxos-uncommitted-tracker: {auto_repairs_enabled: false}
    expect:
      - "calls['storage-service.auto-repair-paxos'] == 0 && ctx.autoRepairsSkipped == true && ctx.evictedHungRepairs == true"
  - id: paxos-auto-repair-paxos-repair-disabled
    flow: paxos-auto-repair
    name: "paxos_repair_enabled false disables auto repair too"
    fixtures: [three-node-rf3]
    config: {paxos-repair-enabled: false}
    expect:
      - "calls['storage-service.auto-repair-paxos'] == 0 && ctx.autoRepairsSkipped == true"
  - id: paxos-auto-repair-skips-replicated-system
    flow: paxos-auto-repair
    name: "Replicated system keyspaces are never auto-repaired"
    fixtures: [three-node-rf3]
    state:
      paxos-uncommitted-tracker:
        tables:
          system_auth.roles: {num_files: 2, uncommitted_keys: []}
    expect:
      - "ctx.autoRepairedTables == ['shop.accounts'] && calls['storage-service.auto-repair-paxos'] == 2"

  # ------------------------------------------------------------- more error paths
  - id: cas-v1-propose-timeout
    flow: lwt-cas
    name: "v1 propose: both remote replicas answer with failures, which only log; the propose times out (write_type CAS)"
    fixtures: [three-node-rf3]
    faults:
      - {target: propose-verb-handler.do-verb, type: error, code: request-failure}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.data.write_type == 'CAS' && result.error.data.block_for == 3"
      - "duration_ms >= 2000 && duration_ms < 2100"
      - "state['paxos-state@n1'].rows['shop.accounts:acct-42'].accepted_columns.balance == 80"
  - id: cas-v1-commit-failures
    flow: lwt-cas
    name: "v1 commit: both remote replicas answer the commit with failures; blockFor can no longer be met (write failure, SIMPLE)"
    fixtures: [three-node-rf3]
    faults:
      - {target: paxos-commit-request-handler.do-verb, type: error, code: request-failure}
    expect:
      - "!result.ok && result.error.code == 'write-failure' && result.error.status == 5376 && result.error.data.write_type == 'SIMPLE'"
      - "result.error.data.failures == 2 && duration_ms < 1000"
      - "state['paxos-state@n1'].rows['shop.accounts:acct-42'].committed_columns.balance == 80"
  - id: serial-read-v1-replay-commit-timeout
    flow: lwt-serial-read
    name: "v1 SERIAL read: replaying an in-progress write times out at commit; the read reports a read timeout"
    fixtures: [three-node-rf3]
    state:
      paxos-state@n1: {rows: {"shop.accounts:acct-42": {promised: 1793318300000000, promised_write: 1793318300000000, accepted_ballot: 1793318300000000, accepted_empty: false, accepted_columns: {balance: 70}, committed_ballot: 0, committed_columns: {}}}}
    faults:
      - {target: paxos-commit-request-handler.do-verb, type: timeout}
    expect:
      - "!result.ok && result.error.code == 'read-timeout' && ctx.unfinishedCommit == true"
      - "calls['storage-proxy.fetch-rows'] == 0"
      - "state['paxos-state@n1'].rows['shop.accounts:acct-42'].committed_columns.balance == 70"
  - id: cas-v2-invalid-serial-consistency
    flow: lwt-cas
    name: "v2: serial consistency must be SERIAL or LOCAL_SERIAL"
    fixtures: [three-node-rf3]
    config: {paxos-variant: v2}
    input: {consistency: ONE}
    expect:
      - "!result.ok && result.error.code == 'invalid' && calls['paxos.begin'] == 0"
  - id: cas-v2-invalid-commit-consistency
    flow: lwt-cas
    name: "v2: commit consistency LOCAL_SERIAL is refused"
    fixtures: [three-node-rf3]
    config: {paxos-variant: v2}
    input: {commit_consistency: LOCAL_SERIAL}
    expect:
      - "!result.ok && result.error.code == 'invalid' && result.error.message.contains('LOCAL_SERIAL is not supported')"
  - id: cas-v2-contention-deadline
    flow: lwt-cas
    name: "v2 prepare answers (rejections) arrive after the propose deadline: the prepare is a maybe-failure, reported as a CAS write timeout at cas_contention_timeout"
    fixtures: [three-node-rf3]
    config: {paxos-variant: v2}
    state:
      paxos-state@n2: {rows: {"shop.accounts:acct-42": {promised: 1793318405000000, promised_write: 1793318405000000, accepted_ballot: 0, accepted_empty: true, accepted_columns: {}, committed_ballot: 0, committed_columns: {}}}}
      paxos-state@n3: {rows: {"shop.accounts:acct-42": {promised: 1793318405000000, promised_write: 1793318405000000, accepted_ballot: 0, accepted_empty: true, accepted_columns: {}, committed_ballot: 0, committed_columns: {}}}}
    faults:
      - {target: paxos-prepare-request-handler.do-verb, type: latency, latency_ms: 990}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.data.write_type == 'CAS'"
      - "calls['paxos-prepare.prepare'] == 1 && calls['paxos-propose.propose'] == 0 && duration_ms >= 1000 && duration_ms < 1100"
      - "state['paxos-state@n2'].rows['shop.accounts:acct-42'].promised == 1793318405000000"
  - id: serial-read-v2-multi-partition
    flow: lwt-serial-read
    name: "v2: a SERIAL read of several partitions is refused"
    fixtures: [three-node-rf3]
    config: {paxos-variant: v2}
    input: {group_size: 3}
    expect:
      - "!result.ok && result.error.code == 'invalid' && calls['paxos.begin'] == 0"
  - id: serial-read-v2-propose-timeout
    flow: lwt-serial-read
    name: "v2 SERIAL read without stability: the empty proposal reaches no quorum, read timeout"
    fixtures: [three-node-rf3]
    config: {paxos-variant: v2}
    state:
      paxos-state@n1: {rows: {"shop.accounts:acct-42": {promised: 1793318300000000, promised_write: 1793318300000000, accepted_ballot: 0, accepted_empty: true, accepted_columns: {}, committed_ballot: 0, committed_columns: {}}}}
    faults:
      - {target: paxos-propose-request-handler.do-verb, type: timeout}
    expect:
      - "!result.ok && result.error.code == 'read-timeout' && calls['paxos-propose.propose'] == 1"
      - "duration_ms >= 5000 && duration_ms < 5100"
      - "state['paxos-state@n1'].rows['shop.accounts:acct-42'].accepted_empty == true"
  - id: v2-propose-not-owned
    flow: paxos-v2-propose-replica
    name: "n1 does not own token -5 in four nodes: it refuses the proposal with a failure"
    fixtures: [four-node-rf3]
    steps:
      - {flow: paxos-v2-propose-replica, on: n1, as: q, input: {commit: {token: -5}}}
    expect:
      - "!steps.q.result.ok && steps.q.result.error.code == 'request-failure' && calls['paxos-state.accept-if-latest'] == 0"
      - "!('shop.accounts:acct-42' in state['paxos-state@n1'].rows)"
  - id: v2-refresh-not-owned
    flow: paxos-v2-prepare-refresh-replica
    name: "n1 does not own token -5 in four nodes: it refuses the refresh with a failure"
    fixtures: [four-node-rf3]
    steps:
      - {flow: paxos-v2-prepare-refresh-replica, on: n1, as: r, input: {missing_commit: {token: -5}}}
    expect:
      - "!steps.r.result.ok && steps.r.result.error.code == 'request-failure' && calls['paxos-state.commit'] == 0"
      - "!('shop.accounts:acct-42' in state['paxos-state@n1'].rows)"
  - id: v2-repair-query-not-owned
    flow: paxos-key-repair
    name: "PAXOS2_REPAIR_REQ to n1, which does not own token -5 in four nodes: failure response"
    fixtures: [four-node-rf3]
    steps:
      - {interface: paxos-repair-request-handler.do-verb, caller: messaging, on: n1, as: q, input: {keyspace: shop, table: accounts, partition_key: "acct-42", token: -5}}
    expect:
      - "!steps.q.result.ok && steps.q.result.error.code == 'request-failure' && calls['paxos-state.maybe-load'] == 0"
      - "!('shop.accounts:acct-42' in state['paxos-state@n1'].rows)"
  - id: paxos-cleanup-low-bound-kept
    flow: paxos-cleanup
    name: "Finish-prepare with a high bound below the current low bound leaves the low bound alone"
    fixtures: [three-node-rf3]
    state:
      paxos-ballot-tracker: {low_bound: 1793318500000000}
    expect:
      - "result.ok && calls['paxos-ballot-tracker.update-low-bound'] == 3"
      - "state['paxos-ballot-tracker@n2'].low_bound == 1793318500000000"
  - id: paxos-cleanup-low-bound-flush-fails
    flow: paxos-cleanup
    name: "Persisting the low bound fails on n2: failure responses, and the cleanup fails"
    fixtures: [three-node-rf3]
    faults:
      - {target: paxos-ballot-tracker.update-low-bound, type: error, code: fs-write-error, instance: n2}
    expect:
      - "!result.ok && result.error.code == 'paxos-cleanup-exception' && calls['paxos-cleanup-session.run'] == 0"
      - "state['paxos-ballot-tracker@n1'].low_bound > 1793318400000000 && state['paxos-ballot-tracker@n2'].low_bound == 0"
  - id: paxos-cleanup-history-sync-fails
    flow: paxos-cleanup
    name: "Syncing the repair history fails on n3: a failure response fails the cleanup"
    fixtures: [three-node-rf3]
    faults:
      - {target: column-family-store.sync-paxos-repair-history, type: error, code: runtime-exception, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'paxos-cleanup-exception' && calls['paxos-cleanup-session.run'] == 0"
      - "state['paxos-ballot-tracker@n3'].low_bound > 1793318400000000"
  - id: paxos-cleanup-request-fails
    flow: paxos-cleanup
    name: "The cleanup request to an endpoint gets a failure response: the session fails"
    fixtures: [three-node-rf3]
    faults:
      - {target: paxos-cleanup-request.do-verb, type: error, code: request-failure, instance: n2}
    expect:
      - "!result.ok && result.error.code == 'paxos-cleanup-exception' && result.error.message.contains('for cleanup request')"
      - "calls['paxos-cleanup-complete.run'] == 0 && state['paxos-ballot-tracker@n2'].low_bound > 1793318400000000"
  - id: paxos-cleanup-recent-and-unknown-keys
    flow: paxos-cleanup
    name: "The local coordinator skips a key of unknown consistency and waits out a ballot that may still be in flight"
    fixtures: [three-node-rf3]
    state:
      paxos-uncommitted-tracker:
        tables:
          shop.accounts: {num_files: 1, uncommitted_keys: [{partition_key: "acct-7", ballot: 1793318300000000, consistency: ""}, {partition_key: "acct-42", ballot: 1793318400000000, consistency: SERIAL}]}
    expect:
      - "result.ok && ctx.repairedUncommittedKeys == 1 && calls['paxos-repair.start'] == 3"
      - "trace.exists(e, e.type == 'note' && e.title.startsWith('Unknown consistency'))"
      - "duration_ms >= 2000"
      - "state['paxos-ballot-tracker@n2'].low_bound > 1793318400000000"
