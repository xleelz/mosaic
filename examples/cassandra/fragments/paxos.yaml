      - "calls['paxos-prepare-refresh-request-handler.do-verb'] >= 1 && calls['paxos-prepare.prepare'] == 1"
      - "state['paxos-state@n2'].rows['shop.accounts:acct-42'].committed_ballot > 0 || state['paxos-state@n3'].rows['shop.accounts:acct-42'].committed_ballot > 0"
  - id: cas-v2-propose-timeout
