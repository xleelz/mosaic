    input: {if_not_exists: false, if_exists: true}
    state:
      paxos-state@n1: {rows: {"shop.accounts:acct-42": {promised: 1793318300000000, promised_write: 1793318300000000, accepted_ballot: 0, accepted_empty: true, accepted_columns: {}, committed_ballot: 0, committed_columns: {}}}}
    expect:
