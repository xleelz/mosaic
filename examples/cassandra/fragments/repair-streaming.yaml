  # ================================================================ validation on the participant
  - component: validation-manager
    name: submit-validation
    kind: function
    summary: "ValidationManager.submitValidation/doValidation: on the validation executor, iterate the table's data for the ranges into Merkle trees; any failure becomes an empty response."
    sources:
      - src/java/org/apache/cassandra/repair/ValidationManager.java:185-213
      - src/java/org/apache/cassandra/repair/ValidationManager.java:101-163
      - src/java/org/apache/cassandra/db/repair/CassandraTableRepairManager.java:64-68
    request:
      type: object
      properties:
        replica: {type: string}
        initiator: {type: string}
        parent_session: {type: string}
        session_id: {type: string}
        keyspace: {type: string}
        table: {type: string}
        ranges: {type: array, items: {type: string}}
        is_incremental: {type: boolean}
        preview_kind: {type: string}
    response: {type: object, properties: {ok: {type: boolean}, endpoint: {type: string}, digest: {type: string}}}
    behavior:
      - title: Build the validation iterator (the read-only 'validation compaction')
        detail: Incremental repairs validate only the SSTables pending this session; full repairs validate everything.
        source: src/java/org/apache/cassandra/repair/ValidationManager.java:124-140
        call: cassandra-table-repair-manager.get-validation-iterator
        input: {replica: "= self", keyspace: "= input.keyspace", table: "= input.table", ranges: "= input.ranges", is_incremental: "= input.is_incremental"}
        as: it
        on_error:
          - title: A validation failure must still answer the initiator
            source: src/java/org/apache/cassandra/repair/ValidationManager.java:196-207
            call: validator.fail
            input: "= {'replica': self, 'initiator': input.initiator, 'parent_session': input.parent_session, 'session_id': input.session_id, 'keyspace': input.keyspace, 'table': input.table, 'reason': error.message}"
            as: failed
          - return: "= vars.failed.value"
      - call: validator.complete
        input:
          replica: "= self"
          initiator: "= input.initiator"
          parent_session: "= input.parent_session"
          session_id: "= input.session_id"
          keyspace: "= input.keyspace"
          table: "= input.table"
          digest: "= vars.it.value.digest"
        as: done
      - return: "= vars.done.value"

  - component: cassandra-table-repair-manager
    name: get-validation-iterator
    kind: store
    summary: "CassandraTableRepairManager.getValidationIterator: this replica's data for the ranges, summarised as its Merkle root (the table's digest)."
    sources:
      - src/java/org/apache/cassandra/db/repair/CassandraTableRepairManager.java:58-62
      - src/java/org/apache/cassandra/db/repair/CassandraValidationIterator.java
    request: {type: object, properties: {replica: {type: string}, keyspace: {type: string}, table: {type: string}, ranges: {type: array}, is_incremental: {type: boolean}}}
    response: {type: object, properties: {digest: {type: string}}}
    behavior:
      - set:
          vars.key: "= input.keyspace + '.' + input.table"
      - return: {digest: "= vars.key in state.digests ? state.digests[vars.key] : 'empty'"}

  - component: cassandra-table-repair-manager
    name: get-table-data
    kind: function
    summary: "The data the outgoing SSTable sections carry for each table (the model's stand-in for the selected SSTables, CassandraStreamManager.java:96-130)."
    sources: [src/java/org/apache/cassandra/db/streaming/CassandraStreamManager.java:96-130]
    request: {type: object, properties: {keyspace: {type: string}, tables: {type: array, items: {type: string}}}}
    response: {type: object, properties: {data: {type: array}}}
    behavior:
      - return:
          data: "= input.tables.filter(t, input.keyspace + '.' + t in state.digests).map(t, {'table': input.keyspace + '.' + t, 'digest': state.digests[input.keyspace + '.' + t]})"

  - component: cassandra-table-repair-manager
    name: add-streamed-data
    kind: function
    summary: "Streamed SSTables become part of the table (CassandraStreamReceiver.finished -> addSSTables): the received data versions merge into this replica's data."
    sources: [src/java/org/apache/cassandra/db/streaming/CassandraStreamReceiver.java:256-260]
    request: {type: object, properties: {data: {type: array, items: {type: object}}}}
    response: {type: object, properties: {}}
    behavior:
      - foreach: "= input.data"
        as: d
        steps:
          - set:
              state.digests: "= merge(state.digests, {vars.d.table: ((vars.d.table in state.digests ? state.digests[vars.d.table].split('+') : []) + vars.d.digest.split('+')).distinct().sort().join('+')})"

  - component: cassandra-table-repair-manager
    name: incremental-session-completed
    kind: function
    summary: "CassandraTableRepairManager.incrementalSessionCompleted: CompactionManager.submitBackground(cfs), so the pending-repair strategy promotes or releases the session's SSTables."
    sources: [src/java/org/apache/cassandra/db/repair/CassandraTableRepairManager.java:70-74]
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}, session_id: {type: string}}}
    response: {type: object, properties: {}}
    behavior:
      - call: compaction-manager.submit-background
        input: {keyspace: "= input.keyspace", table: "= input.table"}

  - component: cassandra-table-repair-manager
    name: snapshot
    kind: function
    summary: "CassandraTableRepairManager.snapshot: on the RepairSnapshotExecutor, an ephemeral snapshot of the SSTables intersecting the ranges (skipped if it already exists unless forced)."
    sources: [src/java/org/apache/cassandra/db/repair/CassandraTableRepairManager.java:76-101]
    request: {type: object, properties: {replica: {type: string}, keyspace: {type: string}, table: {type: string}, name: {type: string}, ranges: {type: array}}}
    response: {type: object, properties: {}}
    errors:
      - {code: runtime-exception}
    behavior:
      - call: column-family-store.snapshot
        input: {replica: "= self", keyspace: "= input.keyspace", table: "= input.table", snapshot_name: "= input.name", ephemeral: true}
        on_error:
          - fail: {code: runtime-exception, message: "= 'Unable to take a snapshot ' + input.name + ' on ' + input.keyspace + '.' + input.table"}
  - component: validator
    name: complete
    kind: function
    summary: "Validator.complete: the trees are done; respond on the ANTI_ENTROPY stage."
    sources: [src/java/org/apache/cassandra/repair/Validator.java:222-237]
    attributes: {stage: ANTI_ENTROPY}
    request: {type: object, properties: {replica: {type: string}, initiator: {type: string}, parent_session: {type: string}, session_id: {type: string}, keyspace: {type: string}, table: {type: string}, digest: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}, endpoint: {type: string}, digest: {type: string}}}
    behavior:
      - call: validator.respond
        input: "= {'replica': self, 'initiator': input.initiator, 'parent_session': input.parent_session, 'session_id': input.session_id, 'keyspace': input.keyspace, 'table': input.table, 'ok': true, 'digest': input.digest}"
        as: r
      - return: "= vars.r.value"

  - component: validator
    name: fail
    kind: function
    summary: "Validator.fail: responds with a ValidationResponse that has no trees."
    sources: [src/java/org/apache/cassandra/repair/Validator.java:244-248]
    request: {type: object, properties: {replica: {type: string}, initiator: {type: string}, parent_session: {type: string}, session_id: {type: string}, keyspace: {type: string}, table: {type: string}, reason: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}, endpoint: {type: string}}}
    behavior:
      - call: validator.respond
        input: "= {'replica': self, 'initiator': input.initiator, 'parent_session': input.parent_session, 'session_id': input.session_id, 'keyspace': input.keyspace, 'table': input.table, 'ok': false, 'digest': ''}"
        as: r
      - return: "= vars.r.value"

  - component: validator
    name: respond
    kind: function
    summary: "Validator.respond: VALIDATION_RSP to a remote initiator (with retries when enabled); a local initiator gets it straight into handleMessage on the ANTI_ENTROPY stage."
    sources:
      - src/java/org/apache/cassandra/repair/Validator.java:280-308
      - src/java/org/apache/cassandra/repair/Validator.java:253-268
    request: {type: object, properties: {replica: {type: string}, initiator: {type: string}, parent_session: {type: string}, session_id: {type: string}, keyspace: {type: string}, table: {type: string}, ok: {type: boolean}, digest: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}, endpoint: {type: string}, digest: {type: string}}}
    behavior:
      - set:
          vars.msg: {verb: VALIDATION_RSP, from: "= self", parent_session: "= input.parent_session", session_id: "= input.session_id", keyspace: "= input.keyspace", table: "= input.table", ok: "= input.ok", digest: "= input.digest"}
      - if: "self != input.initiator"
        then:
          - title: Remote initiator. VALIDATION_RSP
            source: src/java/org/apache/cassandra/repair/Validator.java:283-287
            call: repair-message.send-message-with-retries
            input: {verb: VALIDATION_RSP, endpoint: "= input.initiator", message: "= vars.msg"}
            as: r
            on_error:
              - title: The VALIDATION_RSP was lost
                detail: It is sent with the no-op callback; the coordinator's ValidationTask never completes.
                source: src/java/org/apache/cassandra/repair/messages/RepairMessage.java:166-169
                return: {ok: false, endpoint: "= self", lost: true}
          - return: "= vars.r.value.tree_response"
      - title: Local initiator. Hand the response to ActiveRepairService on ANTI_ENTROPY (moving trees off heap)
        source: src/java/org/apache/cassandra/repair/Validator.java:295-307
        call: active-repair-service.handle-message
        input: "= vars.msg"
        as: l
      - return: "= vars.l.value.tree_response"

  - component: streaming-repair-task
    name: run
    kind: function
    summary: "StreamingRepairTask.run: a REPAIR StreamPlan from src (this node) with dst (request, and transfer unless asymmetric); SYNC_RSP to the initiator with the outcome."
    sources:
      - src/java/org/apache/cassandra/repair/StreamingRepairTask.java:82-106
      - src/java/org/apache/cassandra/repair/StreamingRepairTask.java:118-134
    request:
      type: object
      properties:
        initiator: {type: string}
        src: {type: string}
        dst: {type: string}
        parent_session: {type: string}
        session_id: {type: string}
        keyspace: {type: string}
        table: {type: string}
        ranges: {type: array}
        pending_repair: {type: string}
        preview_kind: {type: string}
        asymmetric: {type: boolean}
    response: {type: object, properties: {success: {type: boolean}, src: {type: string}, dst: {type: string}}}
    behavior:
      - call: stream-plan.execute
        input:
          plan_id: "a83d5f20-9d3c-11ef-a8d2-5b1c0e7f4a21"
          operation: REPAIR
          initiator: "= input.src"
          peer: "= input.dst"
          keyspace: "= input.keyspace"
          table: "= input.table"
          ranges: "= input.ranges"
          request_ranges: true
          transfer_ranges: "= !input.asymmetric"
          pending_repair: "= input.pending_repair"
          preview_kind: "= input.preview_kind"
          flush_before_transfer: "= input.pending_repair == ''"
        as: st
        on_error: continue
      - title: SYNC_RSP to the initiator (success true on onSuccess, false on onFailure)
        source: src/java/org/apache/cassandra/repair/StreamingRepairTask.java:119-134
        call: repair-message.send-message-with-retries
        input:
          verb: SYNC_RSP
          endpoint: "= input.initiator"
          message: {verb: SYNC_RSP, from: "= input.src", src: "= input.src", dst: "= input.dst", parent_session: "= input.parent_session", session_id: "= input.session_id", keyspace: "= input.keyspace", table: "= input.table", success: "= vars.st.ok"}
        as: rsp
      - return: "= vars.rsp.value.sync_response"

  # ================================================================ consistent repair: participant (LocalSessions)
  - component: local-sessions
    name: handle-prepare-message
    kind: function
    summary: "LocalSessions.handlePrepareMessage: creates the local session (PREPARING), acks, runs PendingAntiCompaction, then PREPARE_CONSISTENT_RSP with the outcome."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:853-921]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.get-parent-repair-session
        input: {key: "= input.parent_session"}
        as: prs
        on_error:
          - title: No parent session. Failure response and a negative PREPARE_CONSISTENT_RSP
            source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:862-873
            call: repair-message.send-message-with-retries
            input:
              verb: PREPARE_CONSISTENT_RSP
              endpoint: "= input.coordinator"
              message: {verb: PREPARE_CONSISTENT_RSP, from: "= self", parent_session: "= input.parent_session", participant: "= self", success: false}
            as: neg
          - return: {ack: true, prepare_response: "= vars.neg.value.prepare_response"}
      - call: local-sessions.save-session
        input: {key: "= input.parent_session", row: {session_id: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants", keyspace: "= vars.prs.value.keyspace", tables: "= vars.prs.value.tables", state: PREPARING, last_update: "= now / 1000"}}
      - title: Isolate the data with PendingAntiCompaction
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:882-887
        call: pending-anti-compaction.run
        input: {replica: "= self", parent_session: "= input.parent_session", keyspace: "= vars.prs.value.keyspace", tables: "= vars.prs.value.tables"}
        as: pac
        on_error: continue
      - if: "vars.pac.ok"
        then:
          - title: Prepared. Positive PREPARE_CONSISTENT_RSP
            source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:890-902
            call: local-sessions.update-session
            input: {key: "= input.parent_session", row: {state: PREPARED, last_update: "= now / 1000"}}
          - call: repair-message.send-message-with-retries
            input:
              verb: PREPARE_CONSISTENT_RSP
              endpoint: "= input.coordinator"
              message: {verb: PREPARE_CONSISTENT_RSP, from: "= self", parent_session: "= input.parent_session", participant: "= self", success: true}
            as: rsp
          - return: {ack: true, prepare_response: "= vars.rsp.value.prepare_response"}
      - title: Anticompaction failed. Negative PREPARE_CONSISTENT_RSP, then fail the local session
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:905-920
        call: repair-message.send-message-with-retries
        input:
          verb: PREPARE_CONSISTENT_RSP
          endpoint: "= input.coordinator"
          message: {verb: PREPARE_CONSISTENT_RSP, from: "= self", parent_session: "= input.parent_session", participant: "= self", success: false}
        as: neg2
      - call: local-sessions.fail-session
        input: {replica: "= self", session_id: "= input.parent_session", coordinator: "= input.coordinator", send_message: false}
      - return: {ack: true, prepare_response: "= vars.neg2.value.prepare_response"}

  - component: local-sessions
    name: maybe-set-repairing
    kind: function
    summary: "LocalSessions.maybeSetRepairing: the first VALIDATION_REQ moves an incremental session to REPAIRING."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:955-963]
    request: {type: object, properties: {replica: {type: string}, session_id: {type: string}}}
    response: {type: object, properties: {}}
    behavior:
      - call: local-sessions.get-session
        input: {key: "= input.session_id"}
        as: s
      - when: "vars.s.value.state != 'NONE' && vars.s.value.state != 'REPAIRING'"
        call: local-sessions.update-session
        input: {key: "= input.session_id", row: {state: REPAIRING, last_update: "= now / 1000"}}

  - component: local-sessions
    name: is-session-in-progress
    kind: store
    summary: "LocalSessions.isSessionInProgress (via the session state): exists and not FINALIZED or FAILED."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1109-1116]
    request: {type: object, properties: {key: {type: string}}}
    store: {table: sessions, op: get, key: "= input.key", default: {state: NONE}}

  - component: local-sessions
    name: handle-finalize-propose-message
    kind: function
    summary: "LocalSessions.handleFinalizeProposeMessage: REPAIRING -> FINALIZE_PROMISED, sync system.repairs, FINALIZE_PROMISE_MSG to the coordinator; unknown sessions get a failure response and FAILED_SESSION_MSG."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:965-1003]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: local-sessions.get-session
        input: {key: "= input.parent_session"}
        as: s
      - title: Unknown session. Failure response and FAILED_SESSION_MSG to the coordinator
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:972-978
        if: "vars.s.value.state == 'NONE'"
        then:
          - emit: repair-message.send-message-with-retries
            input:
              verb: FAILED_SESSION_MSG
              endpoint: "= input.from"
              message: {verb: FAILED_SESSION_MSG, from: "= self", parent_session: "= input.parent_session"}
          - return: {ack: true, promise: {participant: "= self", promised: false}}
      - title: Only a REPAIRING session can promise
        detail: maybeSetStateAndSave returns false otherwise and nothing is sent back.
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:983-984
        if: "vars.s.value.state != 'REPAIRING'"
        then:
          - return: {ack: true, promise: {participant: "= self", promised: false}}
      - call: local-sessions.update-session
        input: {key: "= input.parent_session", row: {state: FINALIZE_PROMISED, last_update: "= now / 1000"}}
      - title: Flush system.repairs before promising, then FINALIZE_PROMISE_MSG
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:986-996
        call: repair-message.send-message-with-retries
        input:
          verb: FINALIZE_PROMISE_MSG
          endpoint: "= input.from"
          message: {verb: FINALIZE_PROMISE_MSG, from: "= self", parent_session: "= input.parent_session", participant: "= self", promised: true}
        as: pm
      - return: {ack: true, promise: "= vars.pm.value.promise"}

  - component: local-sessions
    name: handle-finalize-commit-message
    kind: function
    summary: "LocalSessions.handleFinalizeCommitMessage: FINALIZE_PROMISED -> FINALIZED; the SSTables are promoted to repaired later by compaction."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1025-1042]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: local-sessions.get-session
        input: {key: "= input.parent_session"}
        as: s
      - if: "vars.s.value.state == 'NONE'"
        then:
          - return: {ack: false, reason: unknown repair session}
      - if: "vars.s.value.state == 'FINALIZE_PROMISED'"
        then:
          - call: local-sessions.update-session
            input: {key: "= input.parent_session", row: {state: FINALIZED, last_update: "= now / 1000"}}
          - call: local-sessions.session-completed
            input: {session_id: "= input.parent_session", keyspace: "= vars.s.value.keyspace", tables: "= vars.s.value.tables"}
      - return: {ack: true}

  - component: local-sessions
    name: handle-fail-session-message
    kind: function
    summary: "LocalSessions.handleFailSessionMessage: fails the local session without messaging back."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1044-1048]
    request: RepairStreamingRepairMessage
    response: {type: object, properties: {}}
    behavior:
      - call: local-sessions.fail-session
        input: {replica: "= self", session_id: "= input.parent_session", coordinator: "= input.from", send_message: false}

  - component: local-sessions
    name: fail-session
    kind: function
    summary: "LocalSessions.failSession: any state but FINALIZED becomes FAILED; optionally FAILED_SESSION_MSG to the coordinator."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:768-800]
    request: {type: object, properties: {replica: {type: string}, session_id: {type: string}, coordinator: {type: string}, send_message: {type: boolean}}}
    response: {type: object, properties: {}}
    behavior:
      - call: local-sessions.get-session
        input: {key: "= input.session_id"}
        as: s
      - if: "vars.s.value.state == 'NONE'"
        then:
          - return: {}
      - title: A FINALIZED session cannot fail
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:784-788
        when: "vars.s.value.state != 'FINALIZED' && vars.s.value.state != 'FAILED'"
        call: local-sessions.update-session
        input: {key: "= input.session_id", row: {state: FAILED, last_update: "= now / 1000"}}
      - when: "vars.s.value.state != 'FINALIZED' && vars.s.value.state != 'FAILED'"
        call: local-sessions.session-completed
        input: {session_id: "= input.session_id", keyspace: "= has(vars.s.value.keyspace) ? vars.s.value.keyspace : ''", tables: "= has(vars.s.value.tables) ? vars.s.value.tables : []"}
      - when: "input.send_message && vars.s.value.state != 'FINALIZED'"
        emit: repair-message.send-message-with-retries
        input:
          verb: FAILED_SESSION_MSG
          endpoint: "= input.coordinator"
          message: {verb: FAILED_SESSION_MSG, from: "= self", parent_session: "= input.session_id"}

  - component: local-sessions
    name: cleanup
    kind: function
    summary: "LocalSessions.cleanup (every 10 minutes from ActiveRepairService.start): auto-fails sessions idle for a day, deletes completed ones after a day, and asks peers for the outcome of sessions idle for an hour."
    sources:
      - src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:473-517
      - src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:455-467
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:265-271
    request: {type: object, properties: {replica: {type: string, examples: ["n1"]}}}
    response: {type: object, properties: {failed: {type: integer}, deleted: {type: integer}, status_requests: {type: integer}}}
    behavior:
      - call: local-sessions.list-sessions
        input: {}
        as: all
      - set:
          vars.nowSec: "= now / 1000"
          vars.failed: 0
          vars.deleted: 0
          vars.asked: 0
      - foreach: "= vars.all.value"
        as: s
        steps:
          - set:
              vars.completed: "= vars.s.state == 'FINALIZED' || vars.s.state == 'FAILED'"
          - if: "!vars.completed && vars.nowSec > vars.s.last_update + 86400"
            then:
              - title: Auto-fail a session idle for cassandra.repair_fail_timeout_seconds (1 day)
                source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:487-491
                call: local-sessions.fail-session
                input: {replica: "= self", session_id: "= vars.s.session_id", coordinator: "= vars.s.coordinator", send_message: false}
              - set: {vars.failed: "= vars.failed + 1"}
              - continue: true
          - if: "vars.completed && vars.nowSec > vars.s.last_update + 86400"
            then:
              - title: Delete a completed session after cassandra.repair_delete_timeout_seconds (1 day), unless FINALIZED and not superseded, or it still has data
                source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:492-510
                when: "!(vars.s.state == 'FINALIZED' && !vars.s.superseded) && !vars.s.has_data"
                call: local-sessions.delete-session
                input: {key: "= vars.s.session_id"}
              - when: "!(vars.s.state == 'FINALIZED' && !vars.s.superseded) && !vars.s.has_data"
                set: {vars.deleted: "= vars.deleted + 1"}
              - continue: true
          - if: "!vars.completed && vars.nowSec > vars.s.last_update + 3600"
            then:
              - title: Ask the other participants for the outcome after cassandra.repair_status_check_timeout_seconds (1 hour)
                source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:511-514
                call: local-sessions.send-status-request
                input: {replica: "= self", session_id: "= vars.s.session_id", participants: "= vars.s.participants"}
              - set: {vars.asked: "= vars.asked + 1"}
      - return: {failed: "= vars.failed", deleted: "= vars.deleted", status_requests: "= vars.asked"}

  - component: local-sessions
    name: send-status-request
    kind: function
    summary: "LocalSessions.sendStatusRequest: STATUS_REQ (no callback) to every other live participant."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1050-1062]
    request: {type: object, properties: {replica: {type: string}, session_id: {type: string}, participants: {type: array, items: {type: string}}}}
    response: {type: object, properties: {}}
    behavior:
      - foreach: "= input.participants.filter(p, p != self)"
        as: p
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.p"}
            as: fd
          - when: "vars.fd.value.alive"
            call: repair-message-verb-handler.do-verb-status-req
            on: "= vars.p"
            input: {verb: STATUS_REQ, from: "= self", parent_session: "= input.session_id"}
            timeout_ms: 120000
            on_error: continue

  - component: local-sessions
    name: handle-status-request
    kind: function
    summary: "LocalSessions.handleStatusRequest: STATUS_RSP with the local state (FAILED for an unknown session)."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1064-1079]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: local-sessions.get-session
        input: {key: "= input.parent_session"}
        as: s
      - title: STATUS_RSP back to the asking node
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1069-1078
        call: repair-message-verb-handler.do-verb-status-rsp
        on: "= input.from"
        input: {verb: STATUS_RSP, from: "= self", parent_session: "= input.parent_session", state: "= vars.s.value.state == 'NONE' ? 'FAILED' : vars.s.value.state"}
        timeout_ms: 120000
        on_error: continue
      - return: {ack: true, status_response: {state: "= vars.s.value.state == 'NONE' ? 'FAILED' : vars.s.value.state"}}

  - component: local-sessions
    name: handle-status-response
    kind: function
    summary: "LocalSessions.handleStatusResponse: adopts FINALIZED or FAILED from a peer; any other state just refreshes lastUpdate."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1081-1104]
    request: RepairStreamingRepairMessage
    response: {type: object, properties: {}}
    behavior:
      - call: local-sessions.get-session
        input: {key: "= input.parent_session"}
        as: s
      - if: "vars.s.value.state == 'NONE'"
        then:
          - return: {}
      - if: "input.state == 'FINALIZED' || input.state == 'FAILED'"
        then:
          - title: Only valid transitions are allowed (FINALIZED and FAILED are terminal; only FINALIZE_PROMISED may become FINALIZED)
            source: src/java/org/apache/cassandra/repair/consistent/ConsistentSession.java:168-182
            when: "!(input.state == vars.s.value.state || input.state in {'PREPARING': ['PREPARED', 'FAILED'], 'PREPARED': ['REPAIRING', 'FAILED'], 'REPAIRING': ['FINALIZE_PROMISED', 'FAILED'], 'FINALIZE_PROMISED': ['FINALIZED', 'FAILED'], 'FINALIZED': [], 'FAILED': []}[vars.s.value.state])"
            fail: {code: illegal-argument-exception, message: "= 'Invalid state transition ' + vars.s.value.state + ' -> ' + input.state"}
          - call: local-sessions.update-session
            input: {key: "= input.parent_session", row: {state: "= input.state", last_update: "= now / 1000"}}
        else:
          - call: local-sessions.update-session
            input: {key: "= input.parent_session", row: {last_update: "= now / 1000"}}

  - component: local-sessions
    name: get-session
    kind: store
    summary: "LocalSessions.getSession (keyed replica:session_id in the model)."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:671-675]
    request: {type: object, properties: {key: {type: string}}}
    store: {table: sessions, op: get, key: "= input.key", default: {state: NONE}}
  - component: local-sessions
    name: session-completed
    kind: function
    summary: "LocalSessions.sessionCompleted: for each table, the table repair manager's incrementalSessionCompleted submits a background compaction, which promotes (FINALIZED) or demotes (FAILED) the session's pending SSTables (PendingRepairManager, read-path)."
    sources:
      - src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1006-1016
      - src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:756-761
    request: {type: object, properties: {session_id: {type: string}, keyspace: {type: string}, tables: {type: array, items: {type: string}}}}
    response: {type: object, properties: {}}
    behavior:
      - foreach: "= has(input.tables) ? input.tables : []"
        as: t
        steps:
          - call: cassandra-table-repair-manager.incremental-session-completed
            input: {keyspace: "= input.keyspace", table: "= vars.t", session_id: "= input.session_id"}

  - component: local-sessions
    name: is-session-finalized
    kind: function
    summary: "LocalSessions.isSessionFinalized: PendingRepairManager asks it before promoting a session's SSTables to repaired."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:1118-1122]
    request: {type: object, properties: {session_id: {type: string}}}
    response: {type: object, properties: {finalized: {type: boolean}}}
    behavior:
      - return: {finalized: "= input.session_id in state.sessions && state.sessions[input.session_id].state == 'FINALIZED'"}

  - component: local-sessions
    name: save-session
    kind: store
    summary: "LocalSessions.putSessionUnsafe plus save (system.repairs)."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:677-704]
    request: {type: object, properties: {key: {type: string}, row: {type: object}}}
    store: {table: sessions, op: put, key: "= input.key", value: "= input.row"}
  - component: local-sessions
    name: update-session
    kind: store
    summary: "LocalSessions.setStateAndSave / maybeSetStateAndSave."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:738-763]
    request: {type: object, properties: {key: {type: string}, row: {type: object}}}
    store: {table: sessions, op: update, key: "= input.key", value: "= input.row"}
  - component: local-sessions
    name: list-sessions
    kind: store
    summary: The in-memory sessions map that cleanup walks.
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:481]
    request: {type: object, properties: {}}
    store: {table: sessions, op: query}
  - component: local-sessions
    name: delete-session
    kind: store
    summary: "LocalSessions.deleteSession: removes the session from memory and system.repairs."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:802-815]
