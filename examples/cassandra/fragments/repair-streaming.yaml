- id: rs-repair-then-repair-again-finds-sync
  flow: rs-nodetool-repair-full
  name: "Repair n3, then repair again: the second repair finds the replicas in sync"
  description: The first repair streams the differing data both ways; the second repair validates equal trees and creates no sync task. The status read back through getParentRepairStatus is COMPLETED.
  fixtures: &id001
  - three-node-rf3
  state:
    "cassandra-table-repair-manager@n3":
      digests:
        ks1.users: 9f86d081
  steps:
  - flow: rs-nodetool-repair-full
    as: first
  - flow: rs-nodetool-repair-full
    as: second
  - interface: active-repair-service.get-repair-status
    caller: operator
    input:
      cmd: 2
    as: status
  expect:
  - "steps.first.result.value.cmd == 1 && steps.second.result.value.cmd == 2"
  - "steps.status.result.value.status == 'COMPLETED'"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'local-sync-task.start-sync').size() == 1"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'symmetric-remote-sync-task.start-sync').size() == 1"
  - "state['cassandra-table-repair-manager@n2'].digests['ks1.users'] == '9f86d081+d41d8cd9'"
- id: rs-incremental-repair-then-finalized-read
  flow: rs-nodetool-repair-incremental
  name: "Incremental repair, then PendingRepairManager asks whether the session is finalized"
  description: "After FINALIZE_COMMIT each replica reports the session FINALIZED (LocalSessions.isSessionFinalized), and sessionCompleted submitted a background compaction for the table that promotes the pending SSTables."
  fixtures: *id001
  steps:
  - flow: rs-nodetool-repair-incremental
    as: ir
  - interface: local-sessions.is-session-finalized
    caller: compaction-manager
    'on': n2
    input:
      session_id: 6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21
    as: fin
  expect:
  - steps.ir.result.ok
  - steps.fin.result.value.finalized
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'compaction-manager.submit-pending-anti-compaction' && e.instance == 'n2' && e.input.session_id == '6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21')"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'compaction-manager.submit-background' && e.instance == 'n2')"
  - "state['local-sessions@n3'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FINALIZED'"
- id: rs-preview-then-status
  flow: rs-nodetool-repair-preview
  name: "Preview repair, then read the parent status message"
  fixtures: *id001
  state:
    "cassandra-table-repair-manager@n3":
      digests:
        ks1.users: 9f86d081
