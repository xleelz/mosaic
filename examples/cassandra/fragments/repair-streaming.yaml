  # ================================================================ ActiveRepairService operations called by ops and write-path
  - component: active-repair-service
    name: get-repair-status
    kind: store
    summary: "ActiveRepairService.getRepairStatus: the recorded parent status and messages for a command (null when unknown or expired after a day; an empty status in the model)."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:532-536]
    request: {type: object, properties: {cmd: {type: integer, default: 1}}}
    response: {type: object, properties: {status: {type: string}, messages: {type: array, items: {type: string}}}}
    store: {table: repair_status, op: get, key: "= string(input.cmd)", default: {status: "", messages: []}}
  - component: active-repair-service
    name: start
    kind: function
    summary: "ActiveRepairService.start: LocalSessions.start loads system.repairs, then LocalSessions.cleanup is scheduled every repair_cleanup_interval_seconds (10 minutes)."
    sources:
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:265-271
      - src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:380-420
    request: {type: object, properties: {}}
    response: {type: object, properties: {}}
    behavior:
      - title: Load the incremental repair sessions persisted in system.repairs
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:386-409
        set: {ctx.localSessionsStarted: true}
      - title: Schedule LocalSessions.cleanup at a fixed rate (the incremental-session-cleanup flow)
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:268-270
        set: {ctx.irCleanupScheduled: true}
  - component: active-repair-service
    name: terminate-sessions
    kind: function
    summary: "ActiveRepairService.terminateSessions (nodetool repair --stop / forceTerminateAllRepairSessions): force-shuts every running RepairSession and clears all parent sessions."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:515-523]
    request: {type: object, properties: {}}
    response: {type: object, properties: {terminated: {type: integer}}}
    behavior:
      - call: active-repair-service.sessions-list
        input: {}
        as: running
      - title: forceShutdown(IOException 'Terminate session is called') for every running session
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:517-521
        set: {ctx.terminatedRepairSessions: "= size(vars.running.value)"}
      - call: active-repair-service.parent-repair-sessions-list
        input: {}
        as: parents
      - title: parentRepairSessions.clear()
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:522
        foreach: "= vars.parents.value"
        as: prs
        steps:
          - call: active-repair-service.parent-repair-sessions-remove
            input: {key: "= vars.prs.key"}
      - return: {terminated: "= size(vars.running.value)"}
  - component: active-repair-service
    name: fail-session
    kind: function
    summary: "ActiveRepairService.failSession (nodetool repair_admin cancel): LocalSessions.cancelSession."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:297-302]
    request: {type: object, properties: {session: {type: string, examples: ["6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21"]}, force: {type: boolean, default: false}}}
    response: {type: object, properties: {}}
    errors:
      - {code: illegal-argument-exception}
    behavior:
      - call: local-sessions.cancel-session
        input: {replica: "= self", session_id: "= input.session", force: "= input.force"}
  - component: active-repair-service
    name: cleanup-pending
    kind: function
    summary: "ActiveRepairService.cleanupPending (nodetool repair_admin cleanup): for each table, releases the repair data of completed incremental sessions intersecting the ranges."
    sources:
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:410-428
      - src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:341-353
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}, ranges: {type: string}}}
    response: {type: object, properties: {sessions: {type: integer}}}
    behavior:
      - call: local-sessions.list-sessions
        input: {}
        as: all
      - title: Candidates are completed (FINALIZED or FAILED) sessions; ColumnFamilyStore.releaseRepairData moves their SSTables out of pending
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:343-353
        set:
          vars.done: "= vars.all.value.filter(x, (x.state == 'FINALIZED' || x.state == 'FAILED'))"
      - return: {sessions: "= size(vars.done)"}
  - component: active-repair-service
    name: abort
    kind: function
    summary: "ActiveRepairService.abort: removes every parent repair session matching the predicate (truncate and drop pass 'includes this table')."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:1095-1109]
    request: {type: object, properties: {table: {type: string, examples: [users]}, message: {type: string}}}
    response: {type: object, properties: {removed: {type: integer}}}
    behavior:
      - call: active-repair-service.parent-repair-sessions-list
        input: {}
        as: parents
      - set:
          vars.matching: "= vars.parents.value.filter(x, has(x.row.tables) && input.table in x.row.tables)"
      - foreach: "= vars.matching"
        as: prs
        steps:
          - call: active-repair-service.remove-parent-repair-session
            input: {key: "= vars.prs.key", parent_session: "= vars.prs.key"}
      - return: {removed: "= size(vars.matching)"}
  - component: active-repair-service
    name: parent-repair-sessions-list
    kind: function
    summary: The parentRepairSessions map, iterated by abort and terminateSessions.
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:1098-1102]
    request: {type: object, properties: {}}
    response: {type: array, items: {type: object}}
    behavior:
      - return: "= state.parent_repair_sessions.map(k, {'key': k, 'row': state.parent_repair_sessions[k]})"
  - component: active-repair-service
    name: sessions-list
    kind: store
    summary: The running RepairSessions (sessions.values()).
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:518]
    request: {type: object, properties: {}}
    store: {table: sessions, op: query}
  - component: local-sessions
    name: cancel-session
    kind: function
    summary: "LocalSessions.cancelSession: only the coordinator (or --force) may cancel; the session becomes FAILED and the other participants get FAILED_SESSION_MSG."
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:359-375]
    request: {type: object, properties: {replica: {type: string}, session_id: {type: string}, force: {type: boolean}}}
    response: {type: object, properties: {}}
    errors:
      - {code: illegal-argument-exception}
    behavior:
      - call: local-sessions.get-session
        input: {key: "= input.session_id"}
        as: s
      - title: The session must exist
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:363
        when: "vars.s.value.state == 'NONE'"
        fail: {code: illegal-argument-exception, message: "= 'Session ' + input.session_id + ' does not exist'"}
      - title: Cancel from the coordinator or use --force
        source: src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:364-366
        when: "!input.force && vars.s.value.coordinator != self"
        fail: {code: illegal-argument-exception, message: "= 'Cancel session ' + input.session_id + ' from it\\'s coordinator (' + vars.s.value.coordinator + ') or use --force'"}
      - title: FINALIZED cannot become FAILED (invalid transition)
        source: src/java/org/apache/cassandra/repair/consistent/ConsistentSession.java:168-182
        when: "vars.s.value.state == 'FINALIZED'"
        fail: {code: illegal-argument-exception, message: Invalid state transition FINALIZED -> FAILED}
      - call: local-sessions.update-session
        input: {key: "= input.session_id", row: {state: FAILED, last_update: "= now / 1000"}}
      - foreach: "= vars.s.value.participants.filter(p, p != self)"
        as: p
        steps:
          - emit: repair-message.send-message-with-retries
            input:
              verb: FAILED_SESSION_MSG
              endpoint: "= vars.p"
              message: {verb: FAILED_SESSION_MSG, from: "= self", parent_session: "= input.session_id"}

