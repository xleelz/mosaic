    code: io-error
    instance: n2
  expect:
  - "ctx.repairOutcome == 'failed'"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 1"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'FAILED'"
- id: rs-remote-sync-stream-fails
  flow: rs-nodetool-repair-full
  name: Streaming between two remote replicas fails
