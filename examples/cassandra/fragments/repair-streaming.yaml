    store: {table: sessions, op: delete, key: "= input.key"}

  # ================================================================ repair tasks
  - component: normal-repair-task
    name: perform-unsafe
    kind: function
    summary: "NormalRepairTask.performUnsafe: runRepair over the (force-filtered) common ranges, not incremental."
    sources:
      - src/java/org/apache/cassandra/repair/NormalRepairTask.java:49-53
      - src/java/org/apache/cassandra/repair/AbstractRepairTask.java:90-104
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, keyspace: {type: string}, tables: {type: array}, option: RepairStreamingRepairOption, common_range: RepairStreamingCommonRange, participants: {type: array}, force: {type: boolean}}}
    response: {type: object, properties: {has_failed: {type: boolean}, first_error: {type: string}, message: {type: string}}}
    behavior:
      - call: active-repair-service.submit-repair-session
        input:
          parent_session: "= input.parent_session"
          session_id: "7a11c3d0-9d3c-11ef-a8d2-5b1c0e7f4a21"
          coordinator: "= input.coordinator"
          keyspace: "= input.keyspace"
          tables: "= input.tables"
          common_range: "= input.common_range"
          option: "= input.option"
          is_incremental: false
        as: r
      - return:
          has_failed: "= vars.r.value.has_failed"
          first_error: "= vars.r.value.first_error"
          results: "= vars.r.value.results"
          message: Repair completed successfully

  - component: incremental-repair-task
    name: perform-unsafe
    kind: function
    summary: "IncrementalRepairTask.performUnsafe: registers a CoordinatorSession over all participants plus this node, then executes it around runRepair."
    sources: [src/java/org/apache/cassandra/repair/IncrementalRepairTask.java:54-69]
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, keyspace: {type: string}, tables: {type: array}, option: RepairStreamingRepairOption, common_range: RepairStreamingCommonRange, participants: {type: array}, force: {type: boolean}}}
    response: {type: object, properties: {has_failed: {type: boolean}, first_error: {type: string}, message: {type: string}}}
    behavior:
      - set:
          vars.all: "= input.participants + [input.coordinator]"
      - call: coordinator-sessions.register-session
        input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= vars.all", force: "= input.force"}
      - call: coordinator-session.execute
        input:
          parent_session: "= input.parent_session"
          coordinator: "= input.coordinator"
          participants: "= vars.all"
          keyspace: "= input.keyspace"
          tables: "= input.tables"
          option: "= input.option"
          common_range: "= input.common_range"
        as: r
      - return: {has_failed: false, first_error: "", message: Repair completed successfully, results: "= vars.r.value.results"}

  - component: preview-repair-task
    name: perform-unsafe
    kind: function
    summary: "PreviewRepairTask.performUnsafe: runRepair with the preview kind, then summarises the sync stats ('Previewed data was in sync' or 'Preview complete')."
    sources: [src/java/org/apache/cassandra/repair/PreviewRepairTask.java:68-98]
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, keyspace: {type: string}, tables: {type: array}, option: RepairStreamingRepairOption, common_range: RepairStreamingCommonRange, participants: {type: array}, force: {type: boolean}}}
    response: {type: object, properties: {has_failed: {type: boolean}, first_error: {type: string}, message: {type: string}}}
    behavior:
      - call: active-repair-service.submit-repair-session
        input:
          parent_session: "= input.parent_session"
          session_id: "7a11c3d0-9d3c-11ef-a8d2-5b1c0e7f4a21"
          coordinator: "= input.coordinator"
          keyspace: "= input.keyspace"
          tables: "= input.tables"
          common_range: "= input.common_range"
          option: "= input.option"
          is_incremental: false
        as: r
      - if: "vars.r.value.has_failed"
        then:
          - return: {has_failed: true, first_error: "= vars.r.value.first_error", message: ""}
      - set:
          vars.diffs: "= vars.r.value.results.map(j, j.stats).flatten()"
      - title: Summarise the previewed differences
        detail: An empty SyncStatSummary means the replicas agree. A REPAIRED preview with mismatches may snapshot the replicas when snapshot_on_repaired_data_mismatch is set (false by default).
        source: src/java/org/apache/cassandra/repair/PreviewRepairTask.java:76-94
        set:
          vars.message: "= size(vars.diffs) == 0 ? (input.option.preview_kind == 'REPAIRED' ? 'Repaired data is in sync' : 'Previewed data was in sync') : (input.option.preview_kind == 'REPAIRED' ? 'Repaired data is inconsistent' : 'Preview complete') + ' (' + string(size(vars.diffs)) + ' endpoint pairs out of sync)'"
          ctx.previewMismatches: "= size(vars.diffs)"
      - return: {has_failed: false, first_error: "", message: "= 'Repair preview completed successfully; ' + vars.message"}

  # ================================================================ RepairSession / RepairJob
  - component: repair-session
    name: start
    kind: function
    summary: "RepairSession.start: fails if any neighbor is dead (unless replicas were skipped), then runs one RepairJob per table; the first failing job fails the session."
    sources: [src/java/org/apache/cassandra/repair/RepairSession.java:290-376]
    request:
      type: object
      properties:
        parent_session: {type: string}
        session_id: {type: string}
        coordinator: {type: string}
        keyspace: {type: string}
        tables: {type: array, items: {type: string}}
        common_range: RepairStreamingCommonRange
        option: RepairStreamingRepairOption
        is_incremental: {type: boolean}
    response: {type: object, properties: {session_id: {type: string}, repair_job_results: {type: array, items: {type: object}}}}
    errors:
      - {code: io-exception}
    behavior:
      - title: No neighbors to repair with
        source: src/java/org/apache/cassandra/repair/RepairSession.java:305-316
        if: "size(input.common_range.endpoints) == 0"
        then:
          - return: {session_id: "= input.session_id", repair_job_results: []}
      - title: Every neighbor must be alive
        source: src/java/org/apache/cassandra/repair/RepairSession.java:318-334
        foreach: "= input.common_range.endpoints"
        as: ep
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.ep"}
            as: fd
          - when: "!vars.fd.value.alive && !input.common_range.has_skipped_replicas"
            fail: {code: io-exception, message: "= 'Cannot proceed on repair because a neighbor (' + vars.ep + ') is dead: session failed'"}
      - set:
          vars.results: []
      - title: One RepairJob per table on the Repair#N executor (job_threads)
        source: src/java/org/apache/cassandra/repair/RepairSession.java:336-375
        foreach: "= input.tables"
        as: t
        steps:
          - call: repair-job.run
            input:
              parent_session: "= input.parent_session"
              session_id: "= input.session_id"
              coordinator: "= input.coordinator"
              keyspace: "= input.keyspace"
              table: "= vars.t"
              ranges: "= input.common_range.ranges"
              endpoints: "= input.common_range.endpoints"
              has_skipped_replicas: "= input.common_range.has_skipped_replicas"
              option: "= input.option"
              is_incremental: "= input.is_incremental"
            as: job
          - set: {vars.results: "= vars.results + [vars.job.value]"}
      - return: {session_id: "= input.session_id", repair_job_results: "= vars.results"}

  - component: repair-session
    name: validation-complete
    kind: function
    summary: "RepairSession.validationComplete: matches the Merkle tree to its ValidationTask; acks the VALIDATION_RSP."
    sources: [src/java/org/apache/cassandra/repair/RepairSession.java:224-245]
    request: RepairStreamingRepairMessage
    response: {type: object, properties: {ok: {type: boolean}, endpoint: {type: string}, digest: {type: string}}}
    behavior:
      - call: validation-task.trees-received
        input: {endpoint: "= input.from", ok: "= input.ok", digest: "= input.digest"}
        as: t
      - return: "= vars.t.value"

  - component: repair-session
    name: sync-complete
    kind: function
    summary: "RepairSession.syncComplete: completes the remote sync task for the node pair with the SYNC_RSP outcome."
    sources: [src/java/org/apache/cassandra/repair/RepairSession.java:253-265]
    request: RepairStreamingRepairMessage
    response: {type: object, properties: {success: {type: boolean}, src: {type: string}, dst: {type: string}}}
    behavior:
      - return: {success: "= input.success", src: "= input.src", dst: "= input.dst"}

  - component: repair-job
    name: run
    kind: function
    summary: "RepairJob.run: optional Paxos repair; snapshots unless parallel or incremental; Merkle tree validation (parallel, sequential or DC-aware); sync tasks from tree differences."
    sources:
      - src/java/org/apache/cassandra/repair/RepairJob.java:118-236
      - src/java/org/apache/cassandra/repair/RepairJob.java:238-265
      - src/java/org/apache/cassandra/repair/RepairJob.java:364-387
      - src/java/org/apache/cassandra/repair/RepairJob.java:493-606
    request:
      type: object
      properties:
        parent_session: {type: string}
        session_id: {type: string}
        coordinator: {type: string}
        keyspace: {type: string}
        table: {type: string}
        ranges: {type: array, items: {type: string}}
        endpoints: {type: array, items: {type: string}}
        has_skipped_replicas: {type: boolean}
        option: RepairStreamingRepairOption
        is_incremental: {type: boolean}
    response: {type: object, properties: {table: {type: string}, stats: {type: array, items: {type: object}}}}
    errors:
      - {code: repair-exception}
      - {code: no-such-repair-session-exception}
    behavior:
      - set:
          vars.all: "= input.endpoints + [input.coordinator]"
          vars.desc: {parent_session: "= input.parent_session", session_id: "= input.session_id", keyspace: "= input.keyspace", table: "= input.table", ranges: "= input.ranges"}
      - title: Paxos repair first (paxos_repair_enabled, and paxos_variant v2 with repairPaxos, or paxosOnly)
        detail: The deployed paxos_variant is v1 (commented out in cassandra.yaml, Config default v1), so nodetool's repairPaxos=true does nothing unless --paxos-only.
        source: src/java/org/apache/cassandra/repair/RepairJob.java:127-138
        when: "config['paxos-repair-enabled'] && ((config['paxos-variant'] != 'v1' && input.option.repair_paxos) || input.option.paxos_only)"
        call: paxos-cleanup.cleanup
        input: {endpoints: "= vars.all", keyspace: "= input.keyspace", table: "= input.table", ranges: "= input.ranges", skipped_replicas: "= input.has_skipped_replicas", coordinator: "= input.coordinator"}
      - title: Paxos-only repair ends here
        source: src/java/org/apache/cassandra/repair/RepairJob.java:140-160
        if: "input.option.paxos_only"
        then:
          - return: {table: "= input.table", stats: []}
      - title: Snapshot every endpoint unless the repair is parallel (incremental repair isolates data itself)
        source: src/java/org/apache/cassandra/repair/RepairJob.java:162-193
        if: "input.option.parallelism != 'parallel' && !input.is_incremental"
        then:
          - parallel: "= vars.all"
            as: ep
            steps:
              - call: snapshot-task.run
                input: {desc: "= vars.desc", endpoint: "= vars.ep", coordinator: "= input.coordinator"}
                on_error:
                  - return: {ok: false, message: "= error.message"}
              - return: {ok: true, message: ""}
            join: {need: all}
            as_result: snaps
          - title: FutureCombiner.allOf. A failed snapshot fails the job
            source: src/java/org/apache/cassandra/repair/RepairJob.java:183-186
            when: "vars.snaps.results.exists(r, !r.value.ok)"
            fail: {code: runtime-exception, message: "= vars.snaps.results.filter(r, !r.value.ok)[0].value.message"}
      - set:
          vars.trees: []
          vars.validationErrors: []
      - title: Parallel repair sends every VALIDATION_REQ at once (this node included) and waits for all trees
        source: src/java/org/apache/cassandra/repair/RepairJob.java:493-509
        if: "input.option.parallelism == 'parallel'"
        then:
          - parallel: "= vars.all"
            as: ep
            steps:
              - call: validation-task.run
                input: {desc: "= vars.desc", endpoint: "= vars.ep", coordinator: "= input.coordinator", preview_kind: "= input.option.preview_kind"}
                as: tree
                on_error:
                  - return: {ok: false, message: "= error.message"}
              - return: {ok: true, tree: "= vars.tree.value"}
            join: {need: all}
            as_result: vals
          - set:
              vars.trees: "= vars.vals.results.filter(r, r.value.ok).map(r, r.value.tree)"
              vars.validationErrors: "= vars.vals.results.filter(r, !r.value.ok).map(r, r.value.message)"
        else:
          - title: Sequential (and DC-aware within one DC) chains the requests; the next one is sent only from the previous one's onSuccess, so a failure stops the rest
            source: src/java/org/apache/cassandra/repair/RepairJob.java:514-552
            foreach: "= vars.all"
            as: ep
            steps:
              - call: validation-task.run
                input: {desc: "= vars.desc", endpoint: "= vars.ep", coordinator: "= input.coordinator", preview_kind: "= input.option.preview_kind"}
                as: tree
                on_error: continue
              - if: "vars.tree.ok"
                then:
                  - set: {vars.trees: "= vars.trees + [vars.tree.value]"}
                else:
                  - set: {vars.validationErrors: "= vars.validationErrors + [vars.tree.error.message]"}
                  - break: true
      - set:
          ctx.validationRequests: "= (has(ctx.validationRequests) ? ctx.validationRequests : 0) + size(vars.trees) + size(vars.validationErrors)"
      - title: Any failed validation fails the job (and the session)
        source: src/java/org/apache/cassandra/repair/RepairJob.java:219-234
        when: "size(vars.validationErrors) > 0"
        fail: {code: repair-exception, message: "= vars.validationErrors[0]"}
      - call: repair-job.create-standard-sync-tasks
        input: {trees: "= vars.trees", local: "= input.coordinator", pull_repair: "= input.option.pull_repair", ranges: "= input.ranges"}
        as: tasks
      - title: The parent session must still exist before syncing
        source: src/java/org/apache/cassandra/repair/RepairJob.java:366-385
        call: active-repair-service.get-parent-repair-session
        input: {key: "= input.parent_session"}
      - set:
          vars.stats: []
          ctx.syncTasks: "= (has(ctx.syncTasks) ? ctx.syncTasks : 0) + size(vars.tasks.value.tasks)"
      - title: Every sync task runs at once; FutureCombiner.allOf fails the job on the first failure
        source: src/java/org/apache/cassandra/repair/RepairJob.java:374-381
        parallel: "= vars.tasks.value.tasks"
        as: task
        steps:
          - if: "vars.task.type == 'local'"
            then:
              - call: local-sync-task.start-sync
                input:
                  desc: "= vars.desc"
                  local: "= input.coordinator"
                  peer: "= vars.task.peer"
                  ranges: "= vars.task.ranges"
                  pending_repair: "= input.is_incremental ? input.parent_session : ''"
                  request_ranges: "= vars.task.request_ranges"
                  transfer_ranges: "= vars.task.transfer_ranges"
                  preview_kind: "= input.option.preview_kind"
                as: st
                on_error:
                  - return: {ok: false, message: "= error.message"}
            else:
              - call: symmetric-remote-sync-task.start-sync
                input:
                  desc: "= vars.desc"
                  coordinator: "= input.coordinator"
                  src: "= vars.task.primary"
                  dst: "= vars.task.peer"
                  ranges: "= vars.task.ranges"
                  preview_kind: "= input.option.preview_kind"
                as: st
                on_error:
                  - return: {ok: false, message: "= error.message"}
          - return: {ok: true, stat: "= vars.st.value"}
        join: {need: all}
        as_result: syncs
      - when: "vars.syncs.results.exists(r, !r.value.ok)"
        source: src/java/org/apache/cassandra/repair/RepairJob.java:219-234
        fail: {code: repair-exception, message: "= vars.syncs.results.filter(r, !r.value.ok)[0].value.message"}
      - set:
          vars.stats: "= vars.syncs.results.map(r, r.value.stat)"
      - return: {table: "= input.table", stats: "= vars.stats"}

  - component: repair-job
    name: create-standard-sync-tasks
    kind: function
    summary: "RepairJob.createStandardSyncTasks: differences every pair of trees; a pair involving this node is a LocalSyncTask, any other pair a SymmetricRemoteSyncTask."
    sources: [src/java/org/apache/cassandra/repair/RepairJob.java:295-361]
    request:
      type: object
      properties:
        trees: {type: array, items: {type: object}}
        local: {type: string}
        pull_repair: {type: boolean}
        ranges: {type: array, items: {type: string}}
    response: {type: object, properties: {tasks: {type: array, items: {type: object}}}}
    behavior:
      - set:
          vars.tasks: []
      - foreach: "= input.trees"
        as: r1
        index: i
        steps:
          - foreach: "= input.trees.slice(vars.i + 1, size(input.trees))"
            as: r2
            steps:
              - title: MerkleTrees.difference. Nothing to do for identical trees
                source: src/java/org/apache/cassandra/repair/RepairJob.java:318-322
                when: "vars.r1.digest != vars.r2.digest"
                if: "vars.r1.endpoint == input.local || vars.r2.endpoint == input.local"
                then:
                  - title: Local pair. Pull, and push unless pull repair
                    source: src/java/org/apache/cassandra/repair/RepairJob.java:325-340
                    set:
                      vars.tasks: "= vars.tasks + [{'type': 'local', 'primary': input.local, 'peer': vars.r1.endpoint == input.local ? vars.r2.endpoint : vars.r1.endpoint, 'ranges': input.ranges, 'request_ranges': true, 'transfer_ranges': !input.pull_repair}]"
                else:
                  - title: Remote pair. Forward a symmetric sync
                    source: src/java/org/apache/cassandra/repair/RepairJob.java:349-352
                    set:
                      vars.tasks: "= vars.tasks + [{'type': 'symmetric', 'primary': vars.r1.endpoint, 'peer': vars.r2.endpoint, 'ranges': input.ranges, 'request_ranges': true, 'transfer_ranges': true}]"
      - return: {tasks: "= vars.tasks"}

  - component: snapshot-task
    name: run
    kind: function
    summary: "SnapshotTask.run: SNAPSHOT_MSG to one endpoint; a failure fails the job with 'Could not create snapshot at X'."
    sources: [src/java/org/apache/cassandra/repair/SnapshotTask.java:49-88]
    request: {type: object, properties: {desc: {type: object}, endpoint: {type: string}, coordinator: {type: string}}}
    response: {type: object, properties: {endpoint: {type: string}}}
    errors:
      - {code: runtime-exception}
    behavior:
      - call: repair-message.send-message-with-retries
        input:
          verb: SNAPSHOT_MSG
          endpoint: "= input.endpoint"
          message:
            verb: SNAPSHOT_MSG
            from: "= input.coordinator"
            parent_session: "= input.desc.parent_session"
            session_id: "= input.desc.session_id"
            keyspace: "= input.desc.keyspace"
            table: "= input.desc.table"
            ranges: "= input.desc.ranges"
        as: s
        on_error:
          - fail: {code: runtime-exception, message: "= 'Could not create snapshot at ' + input.endpoint + '; ' + error.code"}
      - return: {endpoint: "= input.endpoint"}

  - component: validation-task
    name: run
    kind: function
    summary: "ValidationTask.run: VALIDATION_REQ to the endpoint; completes with its tree, or fails on a messaging failure or an empty (failed) response."
    sources:
      - src/java/org/apache/cassandra/repair/ValidationTask.java:57-64
      - src/java/org/apache/cassandra/repair/messages/RepairMessage.java:252-276
    request: {type: object, properties: {desc: {type: object}, endpoint: {type: string}, coordinator: {type: string}, preview_kind: {type: string}}}
    response: {type: object, properties: {endpoint: {type: string}, digest: {type: string}}}
    errors:
      - {code: repair-exception}
    behavior:
      - call: repair-message.send-message-with-retries
        input:
          verb: VALIDATION_REQ
          endpoint: "= input.endpoint"
          message:
            verb: VALIDATION_REQ
            from: "= input.coordinator"
            parent_session: "= input.desc.parent_session"
            session_id: "= input.desc.session_id"
            keyspace: "= input.desc.keyspace"
            table: "= input.desc.table"
            ranges: "= input.desc.ranges"
            preview_kind: "= input.preview_kind"
            now_in_sec: "= now / 1000"
        as: v
        on_error:
          - title: sendMessageWithFailureCB turns the messaging failure into a RepairException
            source: src/java/org/apache/cassandra/repair/messages/RepairMessage.java:263-267
            fail: {code: repair-exception, message: "= 'Got VALIDATION_REQ failure from ' + input.endpoint + ': ' + (error.code == 'timeout' ? 'TIMEOUT' : 'UNKNOWN')"}
      - title: An empty ValidationResponse means validation failed on that endpoint
        source: src/java/org/apache/cassandra/repair/ValidationTask.java:71-82
        when: "!vars.v.value.tree_response.ok"
        fail: {code: repair-exception, message: "= 'Validation failed in ' + input.endpoint"}
      - return: {endpoint: "= input.endpoint", digest: "= vars.v.value.tree_response.digest"}

  - component: validation-task
    name: trees-received
    kind: function
    summary: "ValidationTask.treesReceived: null trees fail the task; otherwise it completes with a TreeResponse."
    sources: [src/java/org/apache/cassandra/repair/ValidationTask.java:71-82]
    request: {type: object, properties: {endpoint: {type: string}, ok: {type: boolean}, digest: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}, endpoint: {type: string}, digest: {type: string}}}
    behavior:
      - return: {ok: "= input.ok", endpoint: "= input.endpoint", digest: "= input.ok ? input.digest : ''"}

  - component: local-sync-task
    name: start-sync
    kind: function
    summary: "LocalSyncTask.startSync: a REPAIR StreamPlan between this node and the peer (request, and transfer unless pull repair); flushes first only for non-incremental repair."
    sources:
      - src/java/org/apache/cassandra/repair/LocalSyncTask.java:80-125
      - src/java/org/apache/cassandra/repair/LocalSyncTask.java:160-183
      - src/java/org/apache/cassandra/repair/SyncTask.java:78-96
    request:
      type: object
      properties:
        desc: {type: object}
        local: {type: string}
        peer: {type: string}
        ranges: {type: array, items: {type: string}}
        pending_repair: {type: string}
        request_ranges: {type: boolean}
        transfer_ranges: {type: boolean}
        preview_kind: {type: string}
    response: {type: object, properties: {nodes: {type: array}, ranges: {type: array}, streamed: {type: boolean}}}
    behavior:
      - call: stream-plan.execute
        input:
          plan_id: "9c4e2a10-9d3c-11ef-a8d2-5b1c0e7f4a21"
          operation: REPAIR
          initiator: "= input.local"
          peer: "= input.peer"
          keyspace: "= input.desc.keyspace"
          table: "= input.desc.table"
          ranges: "= input.ranges"
          request_ranges: "= input.request_ranges"
          transfer_ranges: "= input.transfer_ranges"
          pending_repair: "= input.pending_repair"
          preview_kind: "= input.preview_kind"
          flush_before_transfer: "= input.pending_repair == ''"
        as: stream
      - set:
          ctx.streamedPairs: "= (has(ctx.streamedPairs) ? ctx.streamedPairs : []) + [input.local + '<->' + input.peer]"
      - return: {nodes: ["= input.local", "= input.peer"], ranges: "= input.ranges", streamed: "= vars.stream.value.files_sent + vars.stream.value.files_received > 0"}

  - component: symmetric-remote-sync-task
    name: start-sync
    kind: function
    summary: "SymmetricRemoteSyncTask.startSync: SYNC_REQ to the first replica of the pair; completes on SYNC_RSP, failing when success=false."
    sources:
      - src/java/org/apache/cassandra/repair/SymmetricRemoteSyncTask.java:50-73
      - src/java/org/apache/cassandra/repair/SyncTask.java:114-120
    request:
      type: object
      properties:
        desc: {type: object}
        coordinator: {type: string}
        src: {type: string}
        dst: {type: string}
        ranges: {type: array, items: {type: string}}
        preview_kind: {type: string}
    response: {type: object, properties: {nodes: {type: array}, ranges: {type: array}, streamed: {type: boolean}}}
    errors:
      - {code: repair-exception}
    behavior:
      - call: repair-message.send-message-with-retries
        input:
          verb: SYNC_REQ
          endpoint: "= input.src"
          message:
            verb: SYNC_REQ
            from: "= input.coordinator"
            initiator: "= input.coordinator"
            src: "= input.src"
            dst: "= input.dst"
            parent_session: "= input.desc.parent_session"
            session_id: "= input.desc.session_id"
            keyspace: "= input.desc.keyspace"
            table: "= input.desc.table"
            ranges: "= input.ranges"
            preview_kind: "= input.preview_kind"
            asymmetric: false
        as: s
        on_error:
          - fail: {code: repair-exception, message: "= 'Got SYNC_REQ failure from ' + input.src + ': ' + (error.code == 'timeout' ? 'TIMEOUT' : 'UNKNOWN')"}
      - set:
          ctx.streamedPairs: "= (has(ctx.streamedPairs) ? ctx.streamedPairs : []) + [input.src + '<->' + input.dst]"
      - title: SYNC_RSP with success=false fails the task
        source: src/java/org/apache/cassandra/repair/SymmetricRemoteSyncTask.java:62-73
        when: "!vars.s.value.sync_response.success"
        fail: {code: repair-exception, message: "= 'Sync failed between ' + input.src + ' and ' + input.dst"}
      - return: {nodes: ["= input.src", "= input.dst"], ranges: "= input.ranges", streamed: true}

  # ================================================================ consistent (incremental) repair: coordinator
  - component: coordinator-sessions
    name: register-session
    kind: function
    summary: "CoordinatorSessions.registerSession: needs the parent session; refuses a duplicate or a forced repair that would promote data."
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSessions.java:63-86]
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, participants: {type: array}, force: {type: boolean}}}
    response: {type: object, properties: {state: {type: string}}}
    errors:
      - {code: no-such-repair-session-exception}
    behavior:
      - call: active-repair-service.get-parent-repair-session
        input: {key: "= input.parent_session"}
        as: prs
      - title: Forced incremental repairs cannot promote data
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSessions.java:69-70
        when: "input.force && vars.prs.value.repaired_at != 0"
        fail: {code: illegal-argument-exception, message: cannot promote data for forced incremental repairs}
      - call: coordinator-sessions.set-state
        input: {session_id: "= input.parent_session", state: PREPARING}
      - return: {state: PREPARING}

  - component: coordinator-sessions
    name: handle-prepare-response
    kind: function
    summary: Routes PREPARE_CONSISTENT_RSP to the coordinator session (failure response when it is gone).
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSessions.java:102-114]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: coordinator-session.handle-prepare-response
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: coordinator-sessions
    name: handle-finalize-promise-message
    kind: function
    summary: Routes FINALIZE_PROMISE_MSG to the coordinator session.
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSessions.java:116-128]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: coordinator-session.handle-finalize-promise
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: coordinator-sessions
    name: handle-fail-session-message
    kind: function
    summary: A FAILED_SESSION_MSG fails the coordinator session if this node coordinates it.
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSessions.java:130-137]
    request: RepairStreamingRepairMessage
    response: {type: object, properties: {}}
    behavior:
      - when: "input.parent_session in state.sessions && !(state.sessions[input.parent_session].state in ['FINALIZED', 'FAILED'])"
        call: coordinator-sessions.set-state
        input: {session_id: "= input.parent_session", state: FAILED}

  - component: coordinator-sessions
    name: set-state
    kind: store
    summary: "CoordinatorSession.setState / setAll: the coordinator-side state of the incremental session (PREPARING, PREPARED, REPAIRING, FINALIZE_PROMISED, FINALIZED, FAILED)."
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:125-163]
    request: {type: object, properties: {session_id: {type: string}, state: {type: string}}}
    store: {table: sessions, op: put, key: "= input.session_id", value: {state: "= input.state"}}

  - component: coordinator-sessions
    name: get-session
    kind: store
    summary: "CoordinatorSessions.getSession (state NONE when this node does not coordinate it)."
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSessions.java:88-91]
    request: {type: object, properties: {session_id: {type: string}}}
    store: {table: sessions, op: get, key: "= input.session_id", default: {state: NONE}}

  - component: coordinator-session
    name: execute
    kind: function
    summary: "CoordinatorSession.execute: prepare, then the repair sessions, then finalize propose and commit; any failure fails the session."
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:341-387]
    request:
      type: object
      properties:
        parent_session: {type: string}
        coordinator: {type: string}
        participants: {type: array, items: {type: string}}
        keyspace: {type: string}
        tables: {type: array}
        option: RepairStreamingRepairOption
        common_range: RepairStreamingCommonRange
    response: {type: object, properties: {results: {type: array}}}
    errors:
      - {code: repair-exception}
      - {code: some-repair-failed-exception}
    behavior:
      - call: coordinator-session.prepare
        input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants"}
      - title: setRepairing, then run the repair sessions
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:349-355
        call: coordinator-sessions.set-state
        input: {session_id: "= input.parent_session", state: REPAIRING}
      - call: active-repair-service.submit-repair-session
        input:
          parent_session: "= input.parent_session"
          session_id: "7a11c3d0-9d3c-11ef-a8d2-5b1c0e7f4a21"
          coordinator: "= input.coordinator"
          keyspace: "= input.keyspace"
          tables: "= input.tables"
          common_range: "= input.common_range"
          option: "= input.option"
          is_incremental: true
        as: r
        on_error:
          - call: coordinator-session.fail
            input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants", failed: []}
          - fail: "= {'code': error.code, 'message': error.message}"
      - title: Any failed session fails the whole incremental repair (SomeRepairFailedException)
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:358-367
        if: "vars.r.value.has_failed"
        then:
          - call: coordinator-session.fail
            input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants", failed: []}
          - fail: {code: some-repair-failed-exception, message: some repair failed, data: {first_error: "= vars.r.value.first_error"}}
      - call: coordinator-session.finalize-propose
        input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants"}
        on_error:
          - call: coordinator-session.fail
            input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants", failed: []}
          - fail: "= {'code': error.code, 'message': error.message}"
      - call: coordinator-session.finalize-commit
        input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants"}
      - return: {results: "= vars.r.value.results"}

  - component: coordinator-session
    name: prepare
    kind: function
    summary: "CoordinatorSession.prepare: PREPARE_CONSISTENT_REQ to every participant (this node included); waits for every PREPARE_CONSISTENT_RSP and fails if any is negative."
    sources:
      - src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:175-191
      - src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:193-231
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, participants: {type: array, items: {type: string}}}}
    response: {type: object, properties: {prepared: {type: boolean}}}
    errors:
      - {code: repair-exception}
    behavior:
      - title: PREPARE_CONSISTENT_REQ to every participant at once; the prepare completes when every PREPARE_CONSISTENT_RSP is in
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:182-190
        parallel: "= input.participants"
        as: p
        steps:
          - call: repair-message.send-message-with-retries
            input:
              verb: PREPARE_CONSISTENT_REQ
              endpoint: "= vars.p"
              message: {verb: PREPARE_CONSISTENT_REQ, parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants"}
            as: pr
            on_error:
              - return: {participant: "= vars.p", answered: false, success: false}
          - return: {participant: "= vars.p", answered: true, success: "= vars.pr.value.prepare_response.success"}
        join: {need: all}
        as_result: prep
      - set:
          vars.silent: "= vars.prep.results.filter(r, !r.value.answered).map(r, r.value.participant)"
          vars.failed: "= vars.prep.results.filter(r, r.value.answered && !r.value.success).map(r, r.value.participant)"
      - title: No PREPARE_CONSISTENT_RSP from a participant
        detail: The request uses the no-op callback, so the real prepareFuture never completes and the repair waits. The model fails instead so the run ends.
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:182-190
        when: "size(vars.silent) > 0"
        fail: {code: repair-exception, message: "= 'no PREPARE_CONSISTENT_RSP from ' + vars.silent.join(', ') + ' (the real coordinator waits indefinitely)'"}
      - if: "size(vars.failed) > 0"
        then:
          - call: coordinator-session.fail
            input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", participants: "= input.participants", failed: "= vars.failed"}
          - fail: {code: repair-exception, message: "= 'Incremental repair session ' + input.parent_session + ' has failed'"}
      - call: coordinator-sessions.set-state
        input: {session_id: "= input.parent_session", state: PREPARED}
      - return: {prepared: true}

  - component: coordinator-session
    name: handle-prepare-response
    kind: function
    summary: "CoordinatorSession.handlePrepareResponse: acks, records the participant PREPARED or FAILED."
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:193-231]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: coordinator-sessions.get-session
        input: {session_id: "= input.parent_session"}
        as: cs
      - title: A response to an already failed session gets a failure response
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:197-202
        if: "vars.cs.value.state == 'FAILED'"
        then:
          - return: {ack: false, prepare_response: {participant: "= input.participant", success: false}}
      - return: {ack: true, prepare_response: {participant: "= input.participant", success: "= input.success"}}

  - component: coordinator-session
    name: finalize-propose
    kind: function
    summary: "CoordinatorSession.finalizePropose: FINALIZE_PROPOSE_MSG to every participant; a rejected promise fails the session."
    sources:
      - src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:238-248
      - src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:250-281
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, participants: {type: array, items: {type: string}}}}
    response: {type: object, properties: {promised: {type: boolean}}}
    errors:
      - {code: repair-exception}
    behavior:
      - title: FINALIZE_PROPOSE_MSG to every participant at once; the propose completes when every FINALIZE_PROMISE_MSG is in
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:238-248
        parallel: "= input.participants"
        as: p
        steps:
          - call: repair-message.send-message-with-retries
            input:
              verb: FINALIZE_PROPOSE_MSG
              endpoint: "= vars.p"
              message: {verb: FINALIZE_PROPOSE_MSG, parent_session: "= input.parent_session"}
            as: fp
          - return: {participant: "= vars.p", promised: "= vars.fp.value.promise.promised"}
        join: {need: all}
        as_result: props
      - title: Finalization rejected by a participant
        source: src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:266-270
        when: "vars.props.results.exists(r, !r.value.promised)"
        fail: {code: repair-exception, message: "= 'Incremental repair session ' + input.parent_session + ' has failed'"}
      - call: coordinator-sessions.set-state
        input: {session_id: "= input.parent_session", state: FINALIZE_PROMISED}
      - return: {promised: true}

  - component: coordinator-session
    name: handle-finalize-promise
    kind: function
    summary: "CoordinatorSession.handleFinalizePromise: acks and records FINALIZE_PROMISED for the participant."
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:250-281]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: coordinator-sessions.get-session
        input: {session_id: "= input.parent_session"}
        as: cs
      - if: "vars.cs.value.state == 'FAILED'"
        then:
          - return: {ack: false, promise: {participant: "= input.participant", promised: false}}
      - return: {ack: true, promise: {participant: "= input.participant", promised: "= input.promised"}}

  - component: coordinator-session
    name: finalize-commit
    kind: function
    summary: "CoordinatorSession.finalizeCommit: FINALIZE_COMMIT_MSG to every participant and the session becomes FINALIZED."
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:283-294]
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, participants: {type: array, items: {type: string}}}}
    response: {type: object, properties: {}}
    behavior:
      - foreach: "= input.participants"
        as: p
        steps:
          - emit: repair-message.send-message-with-retries
            input:
              verb: FINALIZE_COMMIT_MSG
              endpoint: "= vars.p"
              message: {verb: FINALIZE_COMMIT_MSG, from: "= input.coordinator", parent_session: "= input.parent_session"}
      - call: coordinator-sessions.set-state
        input: {session_id: "= input.parent_session", state: FINALIZED}

  - component: coordinator-session
    name: fail
    kind: function
    summary: "CoordinatorSession.fail: FAILED_SESSION_MSG to every participant not already failed, then FAILED."
    sources:
      - src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:296-326
    request: {type: object, properties: {parent_session: {type: string}, coordinator: {type: string}, participants: {type: array}, failed: {type: array}}}
    response: {type: object, properties: {}}
    behavior:
      - call: coordinator-sessions.set-state
        input: {session_id: "= input.parent_session", state: FAILED}
      - foreach: "= input.participants.filter(p, !(p in input.failed))"
        as: p
        steps:
          - emit: repair-message.send-message-with-retries
            input:
              verb: FAILED_SESSION_MSG
              endpoint: "= vars.p"
              message: {verb: FAILED_SESSION_MSG, from: "= input.coordinator", parent_session: "= input.parent_session"}

  # ================================================================ RepairMessage (send with retries)
  - component: repair-message
    name: send-message-with-retries
    kind: function
    summary: "RepairMessage.sendMessageWithRetries: sends a repair verb with a callback; a TIMEOUT is retried with exponential backoff only when repair.retries is enabled (disabled in the deployed config). A failure response or exhausted retries reaches the caller."
    sources:
      - src/java/org/apache/cassandra/repair/messages/RepairMessage.java:137-144
      - src/java/org/apache/cassandra/repair/messages/RepairMessage.java:177-250
      - src/java/org/apache/cassandra/repair/messages/RepairMessage.java:302-311
      - src/java/org/apache/cassandra/net/Verb.java:164
      - src/java/org/apache/cassandra/net/Verb.java:484-493
    request:
      type: object
      properties:
        verb: {type: string}
        endpoint: {type: string, examples: [n2]}
        message: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    errors:
      - {code: request-failure, summary: "Failure response (RequestFailureReason.UNKNOWN) from the receiver."}
      - {code: timeout, retryable: true, summary: "Callback expired: repair_request_timeout 120000ms without retries, request_timeout 10000ms with retries; VALIDATION_RSP waits max(request_timeout, 5min)."}
    behavior:
      - set:
          vars.target: >-
            = {'PREPARE_MSG': 'repair-message-verb-handler.do-verb-prepare-msg',
               'SNAPSHOT_MSG': 'repair-message-verb-handler.do-verb-snapshot-msg',
               'VALIDATION_REQ': 'repair-message-verb-handler.do-verb-validation-req',
               'VALIDATION_RSP': 'repair-message-verb-handler.do-verb-validation-rsp',
               'SYNC_REQ': 'repair-message-verb-handler.do-verb-sync-req',
               'SYNC_RSP': 'repair-message-verb-handler.do-verb-sync-rsp',
               'CLEANUP_MSG': 'repair-message-verb-handler.do-verb-cleanup-msg',
               'PREPARE_CONSISTENT_REQ': 'repair-message-verb-handler.do-verb-prepare-consistent-req',
               'PREPARE_CONSISTENT_RSP': 'repair-message-verb-handler.do-verb-prepare-consistent-rsp',
               'FINALIZE_PROPOSE_MSG': 'repair-message-verb-handler.do-verb-finalize-propose-msg',
               'FINALIZE_PROMISE_MSG': 'repair-message-verb-handler.do-verb-finalize-promise-msg',
               'FINALIZE_COMMIT_MSG': 'repair-message-verb-handler.do-verb-finalize-commit-msg',
               'FAILED_SESSION_MSG': 'repair-message-verb-handler.do-verb-failed-session-msg'}[input.verb]
      - title: "Callback expiry: repair_request_timeout without retries (VALIDATION_RSP: max(request_timeout, 5 min)); request_timeout per attempt with retries. A TIMEOUT is retried with exponential backoff only when repair.retries is configured"
        source: src/java/org/apache/cassandra/net/Verb.java:484-493
        call: "= vars.target"
        on: "= input.endpoint"
        targets:
          - repair-message-verb-handler.do-verb-prepare-msg
          - repair-message-verb-handler.do-verb-snapshot-msg
          - repair-message-verb-handler.do-verb-validation-req
          - repair-message-verb-handler.do-verb-validation-rsp
          - repair-message-verb-handler.do-verb-sync-req
          - repair-message-verb-handler.do-verb-sync-rsp
          - repair-message-verb-handler.do-verb-cleanup-msg
          - repair-message-verb-handler.do-verb-prepare-consistent-req
          - repair-message-verb-handler.do-verb-prepare-consistent-rsp
          - repair-message-verb-handler.do-verb-finalize-propose-msg
          - repair-message-verb-handler.do-verb-finalize-promise-msg
          - repair-message-verb-handler.do-verb-finalize-commit-msg
          - repair-message-verb-handler.do-verb-failed-session-msg
        input: "= merge(input.message, {'from': self})"
        timeout_ms: "= config['repair-retries-max-attempts'] > 0 ? config['request-timeout-ms'] : (input.verb == 'VALIDATION_RSP' ? (config['request-timeout-ms'] > 300000 ? config['request-timeout-ms'] : 300000) : config['repair-request-timeout-ms'])"
        retry:
          max_attempts: "= config['repair-retries-max-attempts'] + 1"
          backoff_ms: 200
          multiplier: 2
          max_backoff_ms: 1000
          codes: [timeout]
          source: src/java/org/apache/cassandra/repair/messages/RepairMessage.java:202-212
        as: rsp
      - title: A failure response reaches the final callback's onFailure
        source: src/java/org/apache/cassandra/repair/messages/RepairMessage.java:302-306
        when: "!vars.rsp.value.ack"
        fail: {code: request-failure, message: "= 'failure response from ' + input.endpoint + ': ' + (has(vars.rsp.value.reason) ? vars.rsp.value.reason : 'UNKNOWN')", data: {reason: UNKNOWN}}
      - return: "= vars.rsp.value"

  # ================================================================ RepairMessageVerbHandler
  - component: repair-message-verb-handler
    name: do-verb
    kind: verb
    summary: "RepairMessageVerbHandler.doVerb: dispatches every repair verb by Verb; an exception removes the parent session."
    attributes: {verb: "PREPARE_MSG|SNAPSHOT_MSG|VALIDATION_REQ|VALIDATION_RSP|SYNC_REQ|SYNC_RSP|CLEANUP_MSG|PREPARE_CONSISTENT_REQ|PREPARE_CONSISTENT_RSP|FINALIZE_PROPOSE_MSG|FINALIZE_PROMISE_MSG|FINALIZE_COMMIT_MSG|FAILED_SESSION_MSG|STATUS_REQ|STATUS_RSP"}
    sources:
      - src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:98-370
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: >-
          = {'PREPARE_MSG': 'repair-message-verb-handler.do-verb-prepare-msg',
             'SNAPSHOT_MSG': 'repair-message-verb-handler.do-verb-snapshot-msg',
             'VALIDATION_REQ': 'repair-message-verb-handler.do-verb-validation-req',
             'VALIDATION_RSP': 'repair-message-verb-handler.do-verb-validation-rsp',
             'SYNC_REQ': 'repair-message-verb-handler.do-verb-sync-req',
             'SYNC_RSP': 'repair-message-verb-handler.do-verb-sync-rsp',
             'CLEANUP_MSG': 'repair-message-verb-handler.do-verb-cleanup-msg',
             'PREPARE_CONSISTENT_REQ': 'repair-message-verb-handler.do-verb-prepare-consistent-req',
             'PREPARE_CONSISTENT_RSP': 'repair-message-verb-handler.do-verb-prepare-consistent-rsp',
             'FINALIZE_PROPOSE_MSG': 'repair-message-verb-handler.do-verb-finalize-propose-msg',
             'FINALIZE_PROMISE_MSG': 'repair-message-verb-handler.do-verb-finalize-promise-msg',
             'FINALIZE_COMMIT_MSG': 'repair-message-verb-handler.do-verb-finalize-commit-msg',
             'FAILED_SESSION_MSG': 'repair-message-verb-handler.do-verb-failed-session-msg',
             'STATUS_REQ': 'repair-message-verb-handler.do-verb-status-req',
             'STATUS_RSP': 'repair-message-verb-handler.do-verb-status-rsp'}[input.verb]
        targets:
          - repair-message-verb-handler.do-verb-prepare-msg
          - repair-message-verb-handler.do-verb-snapshot-msg
          - repair-message-verb-handler.do-verb-validation-req
          - repair-message-verb-handler.do-verb-validation-rsp
          - repair-message-verb-handler.do-verb-sync-req
          - repair-message-verb-handler.do-verb-sync-rsp
          - repair-message-verb-handler.do-verb-cleanup-msg
          - repair-message-verb-handler.do-verb-prepare-consistent-req
          - repair-message-verb-handler.do-verb-prepare-consistent-rsp
          - repair-message-verb-handler.do-verb-finalize-propose-msg
          - repair-message-verb-handler.do-verb-finalize-promise-msg
          - repair-message-verb-handler.do-verb-finalize-commit-msg
          - repair-message-verb-handler.do-verb-failed-session-msg
          - repair-message-verb-handler.do-verb-status-req
          - repair-message-verb-handler.do-verb-status-rsp
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: repair-message-verb-handler
    name: do-verb-prepare-msg
    kind: verb
    summary: "PREPARE_MSG: register the ParticipateState (dedup), check disk headroom and pending compactions, check every table still exists, register the parent session, ack."
    attributes: {verb: PREPARE_MSG}
    sources:
      - src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:107-158
      - src/java/org/apache/cassandra/net/Verb.java:169
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.participate
        input: {key: "= input.parent_session"}
        as: existing
      - title: Duplicate PREPARE_MSG (a retry) is answered from the existing state
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:111-116
        if: "vars.existing.value.status != 'NONE'"
        then:
          - return: {ack: "= vars.existing.value.status != 'FAILED'"}
      - call: active-repair-service.verify-disk-headroom-threshold
        input: {replica: "= self"}
        as: disk
      - title: Not enough disk headroom. Failure response
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:117-123
        if: "!vars.disk.value.ok"
        then:
          - call: active-repair-service.register-participate
            input: {key: "= input.parent_session", row: {status: FAILED, coordinator: "= input.from"}}
          - return: {ack: false, reason: Not enough disk headroom to perform repair}
      - call: active-repair-service.verify-compactions-pending-threshold
        input: {replica: "= self"}
        as: comp
      - title: Too many pending compactions. Failure response
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:124-131
        if: "!vars.comp.value.ok"
        then:
          - call: active-repair-service.register-participate
            input: {key: "= input.parent_session", row: {status: FAILED, coordinator: "= input.from"}}
          - return: {ack: false, reason: Too many pending compactions}
      - title: A table dropped during prepare fails it
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:133-146
        if: "input.tables.exists(t, input.keyspace + '.' + t in state.dropped_tables)"
        then:
          - return: {ack: false, reason: Table was dropped during prepare phase of repair}
      - call: active-repair-service.register-participate
        input: {key: "= input.parent_session", row: {status: ACCEPTED, coordinator: "= input.from"}}
      - title: Register the parent repair session and ack
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:147-156
        call: active-repair-service.register-parent-repair-session
        input:
          key: "= input.parent_session"
          row: {coordinator: "= input.from", keyspace: "= input.keyspace", tables: "= input.tables", ranges: "= input.ranges", is_incremental: "= input.is_incremental", repaired_at: "= input.repaired_at", is_global: "= input.is_global", preview_kind: "= input.preview_kind", has_snapshots: false}
      - return: {ack: true}

  - component: repair-message-verb-handler
    name: do-verb-snapshot-msg
    kind: verb
    summary: "SNAPSHOT_MSG: needs a known repair and table; takes the ephemeral repair snapshot once per parent session, then acks."
    attributes: {verb: SNAPSHOT_MSG}
    sources:
      - src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:160-196
      - src/java/org/apache/cassandra/net/Verb.java:170
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.participate
        input: {key: "= input.parent_session"}
        as: p
      - if: "vars.p.value.status == 'NONE'"
        then:
          - return: {ack: false, reason: "= 'Unknown repair ' + input.parent_session"}
      - if: "input.keyspace + '.' + input.table in state.dropped_tables"
        then:
          - return: {ack: false, reason: Table was dropped during snapshot phase of repair}
      - call: active-repair-service.mark-parent-repair-session-snapshotted
        input: {key: "= input.parent_session"}
      - title: Ephemeral snapshot named after the parent session (cleaned on restart if the repair dies)
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:180-193
        call: cassandra-table-repair-manager.snapshot
        input: {replica: "= self", keyspace: "= input.keyspace", table: "= input.table", name: "= input.parent_session", ranges: "= input.ranges"}
      - return: {ack: true}

  - component: repair-message-verb-handler
    name: do-verb-validation-req
    kind: verb
    summary: "VALIDATION_REQ: needs a known repair and table; marks the incremental session REPAIRING, acks, then submits the validation compaction whose tree goes back as VALIDATION_RSP."
    attributes: {verb: VALIDATION_REQ}
    sources:
      - src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:198-270
      - src/java/org/apache/cassandra/net/Verb.java:166
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.participate
        input: {key: "= input.parent_session"}
        as: p
      - title: Unknown repair. Failure response
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:203-208
        if: "vars.p.value.status == 'NONE'"
        then:
          - return: {ack: false, reason: "= 'Unknown repair ' + input.parent_session"}
      - title: Table dropped during validation. Failure response
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:218-225
        if: "input.keyspace + '.' + input.table in state.dropped_tables"
        then:
          - return: {ack: false, reason: Table was dropped during validation phase of repair}
      - call: local-sessions.maybe-set-repairing
        input: {replica: "= self", session_id: "= input.parent_session"}
      - call: active-repair-service.get-parent-repair-session
        input: {key: "= input.parent_session"}
        as: prs
        on_error:
          - title: Parent repair session removed. Failure response
            source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:243-249
            return: {ack: false, reason: Parent repair session has been removed}
      - title: Ack, then run the validation compaction
        source: src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:250-262
        call: validation-manager.submit-validation
        input:
          replica: "= self"
          initiator: "= input.from"
          parent_session: "= input.parent_session"
          session_id: "= input.session_id"
          keyspace: "= input.keyspace"
          table: "= input.table"
          ranges: "= input.ranges"
          is_incremental: "= vars.prs.value.is_incremental"
          preview_kind: "= vars.prs.value.preview_kind"
        as: v
      - return: {ack: true, tree_response: "= vars.v.value"}

  - component: repair-message-verb-handler
    name: do-verb-validation-rsp
    kind: verb
    summary: "VALIDATION_RSP (on the coordinator): handed to ActiveRepairService.handleMessage."
    attributes: {verb: VALIDATION_RSP}
    sources:
      - src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:353-355
      - src/java/org/apache/cassandra/net/Verb.java:165
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.handle-message
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: repair-message-verb-handler
    name: do-verb-sync-req
    kind: verb
    summary: "SYNC_REQ: needs a known repair; runs a StreamingRepairTask between src (this node) and dst, then acks. The SYNC_RSP follows when streaming ends."
    attributes: {verb: SYNC_REQ}
    sources:
      - src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:272-301
      - src/java/org/apache/cassandra/net/Verb.java:168
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.participate
        input: {key: "= input.parent_session"}
        as: p
      - if: "vars.p.value.status == 'NONE'"
        then:
          - return: {ack: false, reason: "= 'Unknown repair ' + input.parent_session"}
      - call: local-sessions.is-session-in-progress
        input: {key: "= input.parent_session"}
        as: ir
      - call: streaming-repair-task.run
        input:
          initiator: "= input.initiator"
          src: "= input.src"
          dst: "= input.dst"
          parent_session: "= input.parent_session"
          session_id: "= input.session_id"
          keyspace: "= input.keyspace"
          table: "= input.table"
          ranges: "= input.ranges"
          pending_repair: "= vars.ir.value.state != 'NONE' && vars.ir.value.state != 'FINALIZED' && vars.ir.value.state != 'FAILED' ? input.parent_session : ''"
          preview_kind: "= input.preview_kind"
          asymmetric: "= input.asymmetric"
        as: t
      - return: {ack: true, sync_response: "= vars.t.value"}

  - component: repair-message-verb-handler
    name: do-verb-sync-rsp
    kind: verb
    summary: "SYNC_RSP (on the coordinator): handed to ActiveRepairService.handleMessage."
    attributes: {verb: SYNC_RSP}
    sources:
      - src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:353-355
      - src/java/org/apache/cassandra/net/Verb.java:167
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.handle-message
        input: "= input"
        as: r
      - return: "= vars.r.value"

