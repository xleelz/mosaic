  state:
    "stream-session@n2":
      disk_full: true
  expect:
  - "!result.ok && result.error.code == 'stream-exception'"
  - "result.error.message.contains('Remote peer n2 failed stream session')"
  - "calls['stream-session.receive'] == 0 && ctx.streamFailures == 1"
  - "!trace.exists(e, e.type == 'call.start' && e.interface == 'stream-session.receive')"
