  description: "SomeRepairFailedException fails the CoordinatorSession (FAILED_SESSION_MSG to all three) and RepairCoordinator.fail sends it again to the neighbors; the reason is the session's error."
  fixtures:
  - three-node-rf3
  faults:
  - target: cassandra-table-repair-manager.get-validation-iterator
    type: error
    code: io-error
    instance: n2
  expect:
  - "ctx.repairOutcome == 'failed'"
  - "ctx.repairFailure.contains('Validation failed in n2')"
  - "calls['repair-message-verb-handler.do-verb-finalize-propose-msg'] == 0"
  - "calls['repair-message-verb-handler.do-verb-failed-session-msg'] == 5"
  - "state['local-sessions@n1'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FAILED'"
- id: rs-incremental-repair-streams-pending-data
  flow: rs-nodetool-repair-incremental
  name: "Incremental repair streams only the isolated (pending) SSTables, without a pre-transfer flush"
  fixtures:
  - three-node-rf3
  state:
    "cassandra-table-repair-manager@n3":
      digests:
        ks1.users: 9f86d081
  expect:
  - "ctx.repairOutcome == 'completed'"
  - ctx.syncTasks == 2
  - "calls['column-family-store.force-flush'] == 5"
  - "state['coordinator-sessions@n1'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FINALIZED'"
  # the receiving writers carry the stream header's pendingRepair (CassandraStreamReader.java:105,135)
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'column-family-store.add-sstables').size() == 4"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'column-family-store.add-sstables').all(e, e.input.pending_repair == '6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21')"
