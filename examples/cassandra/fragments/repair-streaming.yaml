  - "ctx.repairFailure == 'Incremental repair session 6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21 has failed'"
  - "state['coordinator-sessions@n1'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FAILED'"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 0"
  - "calls['repair-message-verb-handler.do-verb-finalize-propose-msg'] == 0"
  - "state['local-sessions@n3'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FAILED'"
  - "state['local-sessions@n2'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FAILED'"
- id: rs-incremental-repair-validation-fails
  flow: rs-nodetool-repair-incremental
