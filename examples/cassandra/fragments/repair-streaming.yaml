  - "state['active-repair-service@n1'].repair_status['1'].status == 'FAILED'"
- id: rs-full-repair-validation-fails
  flow: rs-nodetool-repair-full
  name: Validation fails on n2
  description: "The replica answers VALIDATION_RSP without trees; the job, the session and the command fail. Parallel repair still requested the other trees."
  fixtures:
  - three-node-rf3
  faults:
