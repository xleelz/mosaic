  - component: pending-anti-compaction
    name: run
    kind: function
    summary: "PendingAntiCompaction.run: flush, acquire the unrepaired SSTables of the ranges (retrying for acquire_retry_seconds) and mark them pending repair; conflicting sessions fail the prepare."
    sources:
      - src/java/org/apache/cassandra/db/repair/PendingAntiCompaction.java:368-382
      - src/java/org/apache/cassandra/db/repair/PendingAntiCompaction.java:120-164
      - src/java/org/apache/cassandra/db/repair/PendingAntiCompaction.java:296-316
    request: {type: object, properties: {replica: {type: string}, parent_session: {type: string}, keyspace: {type: string}, tables: {type: array, items: {type: string}}}}
    response: {type: object, properties: {}}
    errors:
      - {code: sstable-acquisition-exception}
    behavior:
      - foreach: "= input.tables"
        as: t
        steps:
          - title: Flush before acquiring SSTables (FlushReason.ANTICOMPACTION)
            source: src/java/org/apache/cassandra/db/repair/PendingAntiCompaction.java:373-374
            call: column-family-store.force-flush
            input: {keyspace: "= input.keyspace", table: "= vars.t", reason: ANTICOMPACTION}
      - title: SSTables pending another unfinalized session cannot be acquired
        source: src/java/org/apache/cassandra/db/repair/PendingAntiCompaction.java:138-148
        when: "state.conflicting_session != ''"
        fail: {code: sstable-acquisition-exception, message: "= 'Prepare phase for incremental repair session ' + input.parent_session + ' has failed because it encountered intersecting sstables belonging to another incremental repair session (' + state.conflicting_session + '). This is caused by starting an incremental repair session before a previous one has completed. Check nodetool repair_admin for hung sessions and fix them.'"}
      - title: Anticompaction rewrites the acquired SSTables as unrepaired with pendingRepair = this session (CompactionManager.submitPendingAntiCompaction -> performAnticompaction -> mutateRepaired)
        source: src/java/org/apache/cassandra/db/repair/PendingAntiCompaction.java:316-328
        call: compaction-manager.submit-pending-anti-compaction
        input: {keyspace: "= input.keyspace", tables: "= input.tables", session_id: "= input.parent_session"}

  # ================================================================ streaming
  - component: stream-plan
    name: execute
    kind: function
    summary: "StreamPlan.execute: requestRanges(from, ranges) and transferRanges(to, ranges) build one StreamSession per peer; StreamResultFuture.createInitiator starts them all. Called by repair and by the range streamers (bootstrap, rebuild, decommission, move, removenode)."
    sources:
      - src/java/org/apache/cassandra/streaming/StreamPlan.java:195-198
      - src/java/org/apache/cassandra/streaming/StreamPlan.java:106-131
    request: RepairStreamingStreamPlan
    response: RepairStreamingStreamState
    errors:
      - {code: stream-exception}
    behavior:
      - title: Legacy single-peer form (peer or peers, ranges, request_ranges/transfer_ranges); decommission (UNBOOTSTRAP) transfers, the other range streamers fetch
        source: src/java/org/apache/cassandra/streaming/StreamPlan.java:106-131
        set:
          vars.op: "= has(input.operation) ? input.operation : 'BOOTSTRAP'"
          vars.legacyPeers: "= has(input.peers) && size(input.peers) > 0 ? input.peers : (has(input.peer) && input.peer != '' ? [input.peer] : [])"
          vars.legacyRanges: "= has(input.ranges) ? input.ranges : []"
      - set:
          vars.legacyTransfer: "= has(input.transfer_ranges) ? input.transfer_ranges : vars.op == 'UNBOOTSTRAP'"
          vars.legacyRequest: "= has(input.request_ranges) ? input.request_ranges : vars.op != 'UNBOOTSTRAP'"
      - set:
          vars.requests: "= has(input.requests) ? input.requests : (vars.legacyRequest ? vars.legacyPeers.map(p, {'peer': p, 'ranges': vars.legacyRanges}) : [])"
          vars.transfers: "= has(input.transfers) ? input.transfers : (vars.legacyTransfer ? vars.legacyPeers.map(p, {'peer': p, 'ranges': vars.legacyRanges}) : [])"
          vars.keyspace: "= has(input.keyspace) ? input.keyspace : 'ks1'"
      - set:
          vars.tables: "= has(input.tables) && size(input.tables) > 0 ? input.tables : (has(input.table) && input.table != '' ? [input.table] : [])"
      - title: No column families named means every table of the keyspace
        source: src/java/org/apache/cassandra/streaming/StreamSession.java:473-488
        when: "size(vars.tables) == 0"
        call: keyspace.get-column-family-stores
        input: {keyspace: "= vars.keyspace"}
        as: cfs
      - set:
          vars.allTables: "= size(vars.tables) > 0 ? vars.tables : vars.cfs.value.tables"
          vars.peers: "= (vars.requests.map(r, r.peer) + vars.transfers.map(t, t.peer)).distinct()"
      - call: stream-result-future.create-initiator
        input:
          plan_id: "= has(input.plan_id) ? input.plan_id : '9c4e2a10-9d3c-11ef-a8d2-5b1c0e7f4a21'"
          operation: "= vars.op"
          keyspace: "= vars.keyspace"
          tables: "= vars.allTables"
          sessions: "= vars.peers.map(p, {'peer': p, 'request_ranges': vars.requests.filter(r, r.peer == p).map(r, r.ranges).flatten(), 'transfer_ranges': vars.transfers.filter(t, t.peer == p).map(t, t.ranges).flatten()})"
          pending_repair: "= has(input.pending_repair) ? input.pending_repair : ''"
          preview_kind: "= has(input.preview_kind) ? input.preview_kind : 'NONE'"
          flush_before_transfer: "= has(input.flush_before_transfer) ? input.flush_before_transfer : true"
        as: f
      - return: "= vars.f.value"

  - component: stream-result-future
    name: create-initiator
    kind: function
    summary: "StreamResultFuture.createInitiator: registers with StreamManager, inits every session and connects them all at once (connectAllStreamSessions); completes when all finish, failing with StreamException if one failed."
    sources:
      - src/java/org/apache/cassandra/streaming/StreamResultFuture.java:88-109
      - src/java/org/apache/cassandra/streaming/StreamResultFuture.java:235-264
      - src/java/org/apache/cassandra/streaming/StreamCoordinator.java:101-113
    request:
      type: object
      properties:
        plan_id: {type: string}
        operation: {type: string}
        keyspace: {type: string}
        tables: {type: array, items: {type: string}}
        sessions: {type: array, items: {type: object}}
        pending_repair: {type: string}
        preview_kind: {type: string}
        flush_before_transfer: {type: boolean}
    response: RepairStreamingStreamState
    errors:
      - {code: stream-exception}
    behavior:
      - call: stream-manager.register-initiator
        input: {key: "= input.plan_id", row: {operation: "= input.operation", peers: "= input.sessions.map(x, x.peer)"}}
      - title: Every session starts at once; the plan completes when the last one finishes
        source: src/java/org/apache/cassandra/streaming/StreamCoordinator.java:109-113
        parallel: "= input.sessions"
        as: sess
        steps:
          - call: stream-coordinator.connect
            input:
              plan_id: "= input.plan_id"
              operation: "= input.operation"
              peer: "= vars.sess.peer"
              keyspace: "= input.keyspace"
              tables: "= input.tables"
              request_ranges: "= vars.sess.request_ranges"
              transfer_ranges: "= vars.sess.transfer_ranges"
              pending_repair: "= input.pending_repair"
              preview_kind: "= input.preview_kind"
              flush_before_transfer: "= input.flush_before_transfer"
            as: c
          - return: "= {'peer': vars.sess.peer, 'state': vars.c.value.state, 'files_sent': vars.c.value.files_sent, 'files_received': vars.c.value.files_received, 'failure_reason': vars.c.value.failure_reason}"
        join: {need: all}
        as_result: done
      - set:
          vars.states: "= vars.done.results.map(r, r.value)"
      - set:
          vars.failed: "= vars.states.filter(x, x.state == 'FAILED')"
      - title: maybeComplete. Any failed session fails the plan
        source: src/java/org/apache/cassandra/streaming/StreamResultFuture.java:239-252
        when: "size(vars.failed) > 0"
        fail: {code: stream-exception, message: "= 'Stream failed: ' + vars.failed.map(x, 'Session peer ' + x.peer + ' ' + x.failure_reason).join('; ')"}
      - return: "= {'plan_id': input.plan_id, 'state': 'COMPLETE', 'files_sent': sum(vars.states.map(x, x.files_sent)), 'files_received': sum(vars.states.map(x, x.files_received)), 'failure_reason': '', 'preview': input.preview_kind != 'NONE'}"

  - component: stream-coordinator
    name: connect
    kind: function
    summary: "StreamCoordinator.startSession for one peer's session."
    sources:
      - src/java/org/apache/cassandra/streaming/StreamCoordinator.java:265-269
    request: RepairStreamingStreamSession
    response: RepairStreamingStreamState
    behavior:
      - call: stream-session.start
        input: "= input"
        as: s
      - return: "= vars.s.value"

  - component: stream-session
    name: start
    kind: function
    summary: "StreamSession.start on the initiator (this instance): StreamInitMessage and PrepareSynMessage to the peer, PrepareSynAck handling (disk check, PrepareAck), file streaming, completion; any error closes the session FAILED."
    sources:
      - src/java/org/apache/cassandra/streaming/StreamSession.java:385-415
      - src/java/org/apache/cassandra/streaming/StreamSession.java:685-697
      - src/java/org/apache/cassandra/streaming/StreamSession.java:824-842
      - src/java/org/apache/cassandra/streaming/StreamSession.java:1264-1290
      - src/java/org/apache/cassandra/streaming/StreamSession.java:1171-1179
    request: RepairStreamingStreamSession
    response: RepairStreamingStreamState
    behavior:
      - title: A session with no requests and no transfers completes at once
        source: src/java/org/apache/cassandra/streaming/StreamSession.java:387-392
        if: "size(input.request_ranges) == 0 && size(input.transfer_ranges) == 0"
        then:
          - return: {state: COMPLETE, files_sent: 0, files_received: 0, failure_reason: ""}
      - set:
          vars.sendFiles: 0
          vars.sendData: []
      - if: "size(input.transfer_ranges) > 0"
        then:
          - title: addTransferRanges flushes first when the plan asks (not for incremental repair)
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:445-450
            when: "input.flush_before_transfer"
            foreach: "= input.tables"
            as: t
            steps:
              - call: column-family-store.force-flush
                input: {keyspace: "= input.keyspace", table: "= vars.t", reason: STREAMING}
          - call: cassandra-stream-manager.create-outgoing-streams
            input: {keyspace: "= input.keyspace", tables: "= input.tables", ranges: "= input.transfer_ranges", pending_repair: "= input.pending_repair", preview_kind: "= input.preview_kind"}
            as: out
          - set: {vars.sendFiles: "= vars.out.value.files", vars.sendData: "= vars.out.value.data"}
      - title: StreamInitMessage, then PrepareSynMessage with the requests and transfer summaries
        source: src/java/org/apache/cassandra/streaming/StreamSession.java:685-697
        call: stream-session.prepare-syn
        on: "= input.peer"
        input:
          from: "= self"
          operation: "= input.operation"
          keyspace: "= input.keyspace"
          tables: "= input.tables"
          requests: "= input.request_ranges"
          summary_files: "= vars.sendFiles"
          pending_repair: "= input.pending_repair"
          preview_kind: "= input.preview_kind"
        as: syn
        on_error:
          - call: stream-session.on-error
            input: {peer: "= input.peer", reason: "= error.code == 'timeout' || error.code == 'unavailable' ? 'Failed because there was an java.nio.channels.ClosedChannelException with state=PREPARING' : 'Remote peer ' + input.peer + ' failed stream session'"}
            as: err
          - return: "= vars.err.value"
      - if: "input.operation == 'REPAIR' && vars.syn.value.summary_files > 0"
        then:
          - title: PrepareSynAck. Check disk space and pending compactions for the incoming repair streams
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:824-828
            call: stream-session.check-available-disk-space-and-compactions
            input: {incoming_files: "= vars.syn.value.summary_files"}
            as: disk
          - if: "!vars.disk.value.ok"
            then:
              - call: stream-session.on-error
                input: {peer: "= input.peer", reason: Not enough disk space for stream}
                as: err2
              - return: "= vars.err2.value"
      - title: Preview sessions complete after the prepare phase without moving files
        source: src/java/org/apache/cassandra/streaming/StreamSession.java:838-841
        if: "input.preview_kind != 'NONE'"
        then:
          - return: {state: COMPLETE, files_sent: 0, files_received: 0, failure_reason: "", preview: true}
      - if: "vars.syn.value.summary_files > 0"
        then:
          - title: PrepareAckMessage. The follower may now stream to us
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:829-836
            call: stream-session.prepare-ack
            on: "= input.peer"
            input: {from: "= self", operation: "= input.operation", keyspace: "= input.keyspace", tables: "= input.tables", files: "= vars.syn.value.summary_files", data: "= vars.syn.value.data", pending_repair: "= input.pending_repair", preview_kind: "= input.preview_kind"}
            as: ack
            on_error:
              - call: stream-session.on-error
                input: {peer: "= input.peer", reason: "= 'Remote peer ' + input.peer + ' failed stream session'"}
                as: err3
              - return: "= vars.err3.value"
      - if: "vars.sendFiles > 0"
        then:
          - title: startStreamingFiles. OutgoingStreamMessages to the peer, each acknowledged with ReceivedMessage
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:1264-1290
            call: stream-session.receive
            on: "= input.peer"
            input: {from: "= self", operation: "= input.operation", keyspace: "= input.keyspace", tables: "= input.tables", files: "= vars.sendFiles", data: "= vars.sendData", pending_repair: "= input.pending_repair", preview_kind: "= input.preview_kind"}
            as: sent
            on_error:
              - call: stream-session.on-error
                input: {peer: "= input.peer", reason: "= 'Remote peer ' + input.peer + ' failed stream session'"}
                as: err4
              - return: "= vars.err4.value"
          - call: stream-transfer-task.complete
            input: {peer: "= input.peer", files: "= vars.sendFiles"}
      - title: Both sides done. The follower's CompleteMessage closes the session COMPLETE
        source: src/java/org/apache/cassandra/streaming/StreamSession.java:1124-1179
        return: {state: COMPLETE, files_sent: "= vars.sendFiles", files_received: "= vars.syn.value.summary_files", failure_reason: ""}

  - component: stream-session
    name: prepare-syn
    kind: stream
    summary: "PREPARE_SYN on the follower (this instance; StreamSession.prepare/prepareAsync): for repair, check disk space; validate and add the requested ranges as transfers (always flushing); record what it will receive; reply PrepareSynAck."
    attributes: {message: PREPARE_SYN}
    sources:
      - src/java/org/apache/cassandra/streaming/StreamSession.java:769-822
      - src/java/org/apache/cassandra/streaming/StreamSession.java:1008-1032
      - src/java/org/apache/cassandra/streaming/StreamResultFuture.java:111-135
    request:
      type: object
      properties:
        from: {type: string}
        operation: {type: string}
        keyspace: {type: string}
        tables: {type: array, items: {type: string}}
        requests: {type: array, items: {type: string}}
        summary_files: {type: integer}
        pending_repair: {type: string}
        preview_kind: {type: string}
    response: {type: object, properties: {summary_files: {type: integer}, data: {type: array}, state: {type: string}}}
    errors:
      - {code: runtime-exception}
      - {code: stream-request-out-of-token-range-exception}
    behavior:
      - if: "input.operation == 'REPAIR' && input.summary_files > 0"
        then:
          - call: stream-session.check-available-disk-space-and-compactions
            input: {incoming_files: "= input.summary_files"}
            as: disk
          - title: Not enough disk space. The follower fails the session (SessionFailedMessage)
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:856-873
            when: "!vars.disk.value.ok"
            fail: {code: runtime-exception, message: Not enough disk space for stream}
      - set:
          vars.files: 0
          vars.data: []
      - if: "size(input.requests) > 0"
        then:
          - set:
              vars.rejected: []
          - title: Requested ranges must be owned by this node
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:1017-1031
            foreach: "= input.requests"
            as: r
            steps:
              - call: token-metadata.get-write-endpoints
                input: {keyspace: "= input.keyspace", token: "= int(vars.r.substring(vars.r.indexOf(',') + 1, size(vars.r) - 1))"}
                as: owners
              - when: "!(self in vars.owners.value.natural)"
                set: {vars.rejected: "= vars.rejected + [vars.r]"}
          - when: "size(vars.rejected) > 0"
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:1030-1031
            fail: {code: stream-request-out-of-token-range-exception, message: "= 'Stream request for ranges outside the token ranges owned by ' + self + ': ' + vars.rejected.join(', ')"}
          - title: Always flush on a stream request
            source: src/java/org/apache/cassandra/streaming/StreamSession.java:1021
            foreach: "= input.tables"
            as: t
            steps:
              - call: column-family-store.force-flush
                input: {keyspace: "= input.keyspace", table: "= vars.t", reason: STREAMING}
          - call: cassandra-stream-manager.create-outgoing-streams
            input: {keyspace: "= input.keyspace", tables: "= input.tables", ranges: "= input.requests", pending_repair: "= input.pending_repair", preview_kind: "= input.preview_kind"}
            as: out
          - set: {vars.files: "= vars.out.value.files", vars.data: "= vars.out.value.data"}
      - return: {summary_files: "= vars.files", data: "= vars.data", state: "= input.preview_kind != 'NONE' ? 'COMPLETE' : 'PREPARING'"}

  - component: stream-session
    name: prepare-ack
    kind: stream
    summary: "PREPARE_ACK on the follower: start streaming its files to the initiator (refused for preview sessions)."
    attributes: {message: PREPARE_ACK}
    sources: [src/java/org/apache/cassandra/streaming/StreamSession.java:844-850]
    request: {type: object, properties: {from: {type: string}, operation: {type: string}, keyspace: {type: string}, tables: {type: array}, files: {type: integer}, data: {type: array}, pending_repair: {type: string, default: ""}, preview_kind: {type: string}}}
    response: {type: object, properties: {sent: {type: integer}}}
    errors:
      - {code: runtime-exception}
    behavior:
      - when: "input.preview_kind != 'NONE'"
        fail: {code: runtime-exception, message: Cannot receive PrepareAckMessage for preview session}
      - call: stream-session.receive
        on: "= input.from"
        input: {from: "= self", operation: "= input.operation", keyspace: "= input.keyspace", tables: "= input.tables", files: "= input.files", data: "= input.data", pending_repair: "= has(input.pending_repair) ? input.pending_repair : ''", preview_kind: "= input.preview_kind"}
      - return: {sent: "= input.files"}

  - component: stream-session
    name: receive
    kind: stream
    summary: "STREAM (IncomingStreamMessage) on the receiver (this instance): ReceivedMessage back, then the receive task; refused for preview sessions."
    attributes: {message: STREAM}
    sources: [src/java/org/apache/cassandra/streaming/StreamSession.java:1070-1104]
    request: {type: object, properties: {from: {type: string}, operation: {type: string}, keyspace: {type: string}, tables: {type: array}, files: {type: integer}, data: {type: array}, pending_repair: {type: string, default: ""}, preview_kind: {type: string}}}
    response: {type: object, properties: {received: {type: integer}}}
    errors:
      - {code: runtime-exception}
    behavior:
      - when: "input.preview_kind != 'NONE'"
        fail: {code: runtime-exception, message: Cannot receive files for preview session}
      - call: stream-receive-task.received
        input: "= input"
      - set:
          ctx.filesStreamed: "= (has(ctx.filesStreamed) ? ctx.filesStreamed : 0) + input.files"
      - return: {received: "= input.files"}

  - component: stream-session
    name: on-error
    kind: function
    summary: "StreamSession.onError: sends SessionFailedMessage if connected and closes the session FAILED (EOF before completion means the peer is probably down)."
    sources:
      - src/java/org/apache/cassandra/streaming/StreamSession.java:704-744
      - src/java/org/apache/cassandra/streaming/StreamSession.java:527-573
    request: {type: object, properties: {peer: {type: string}, reason: {type: string}}}
    response: RepairStreamingStreamState
    behavior:
      - set:
          ctx.streamFailures: "= (has(ctx.streamFailures) ? ctx.streamFailures : 0) + 1"
      - return: {state: FAILED, files_sent: 0, files_received: 0, failure_reason: "= input.reason"}

  - component: stream-session
    name: check-available-disk-space-and-compactions
    kind: function
    summary: "Disk space and pending-compaction check for incoming repair streams on this instance (skipped when skip_stream_disk_space_check)."
    sources:
      - src/java/org/apache/cassandra/streaming/StreamSession.java:856-873
      - src/java/org/apache/cassandra/streaming/StreamSession.java:880-899
    request: {type: object, properties: {incoming_files: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    behavior:
      - title: skip_stream_disk_space_check skips the check
        source: src/java/org/apache/cassandra/streaming/StreamSession.java:858-859
        when: "config['skip-stream-disk-space-check']"
        return: {ok: true}
      - return: {ok: "= input.incoming_files == 0 || !state.disk_full"}

  - component: stream-transfer-task
    name: complete
    kind: function
    summary: "StreamTransferTask.complete: each ReceivedMessage cancels the stream_transfer_task_timeout (12h) and, once all files are acked, completes the task."
    sources:
      - src/java/org/apache/cassandra/streaming/StreamTransferTask.java:80-100
      - src/java/org/apache/cassandra/streaming/StreamSession.java:1039-1058
    request: {type: object, properties: {peer: {type: string}, files: {type: integer}}}
    response: {type: object, properties: {}}

  - component: stream-receive-task
    name: received
    kind: function
    summary: "StreamReceiveTask.received: counts files; when all arrived, OnCompletionRunnable finishes the receiver for each table (or aborts if the table was dropped)."
    sources: [src/java/org/apache/cassandra/streaming/StreamReceiveTask.java:72-150]
    request: {type: object, properties: {from: {type: string}, operation: {type: string}, keyspace: {type: string}, tables: {type: array}, files: {type: integer}, data: {type: array}, pending_repair: {type: string, default: ""}}}
    response: {type: object, properties: {}}
    behavior:
      - foreach: "= input.tables"
        as: t
        steps:
          - call: cassandra-stream-receiver.finished
            input:
              keyspace: "= input.keyspace"
              table: "= vars.t"
              operation: "= input.operation"
              files: "= size(input.tables) > 0 ? (input.files / size(input.tables) > 0 ? input.files / size(input.tables) : 1) : input.files"
              data: "= input.data.filter(d, d.table == input.keyspace + '.' + vars.t)"
              pending_repair: "= has(input.pending_repair) ? input.pending_repair : ''"

  - component: cassandra-stream-receiver
    name: finished
    kind: function
    summary: "CassandraStreamReceiver.finished: CDC tables (cdc_on_repair_enabled) and tables with views on repair (materialized_views_on_repair_enabled) replay through the write path; others add the SSTables directly. Either way the streamed data becomes this replica's data."
    sources:
      - src/java/org/apache/cassandra/db/streaming/CassandraStreamReceiver.java:236-290
      - src/java/org/apache/cassandra/db/streaming/CassandraStreamReceiver.java:195-228
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}, operation: {type: string}, files: {type: integer}, data: {type: array}, pending_repair: {type: string, default: ""}}}
    response: {type: object, properties: {write_path: {type: boolean}}}
    behavior:
      - set:
          vars.name: "= input.keyspace + '.' + input.table"
      - set:
          vars.writePath: "= (vars.name in state.cdc_tables && config['cdc-on-repair-enabled']) || (input.operation in ['REPAIR', 'BOOTSTRAP', 'REBUILD', 'BULK_LOAD'] && vars.name in state.tables_with_views && config['materialized-views-on-repair-enabled'])"
      - if: "vars.writePath"
        then:
          - title: Replay the streamed partitions as mutations through Keyspace.apply
            source: src/java/org/apache/cassandra/db/streaming/CassandraStreamReceiver.java:202-228
            call: keyspace.apply
            input:
              mutation: {keyspace: "= input.keyspace", table: "= input.table", partition_key: "streamed", token: 0, timestamp: 0, columns: {}}
              write_commit_log: "= vars.name in state.cdc_tables"
              update_indexes: true
              is_droppable: false
        else:
          - title: "The SSTables were written with the stream header's pendingRepair (the incremental repair session, or none), so they arrive pending that session"
            source: src/java/org/apache/cassandra/db/streaming/CassandraStreamReader.java:105-135
          - title: Add the SSTables to the table
            source: src/java/org/apache/cassandra/db/streaming/CassandraStreamReceiver.java:256-260
            call: column-family-store.add-sstables
            input: {keyspace: "= input.keyspace", table: "= input.table", files: "= input.files", pending_repair: "= has(input.pending_repair) ? input.pending_repair : ''"}
      - title: The streamed partitions are now part of this replica's data (what the next validation reads)
        source: src/java/org/apache/cassandra/db/streaming/CassandraStreamReceiver.java:256-260
        call: cassandra-table-repair-manager.add-streamed-data
        input: {data: "= input.data"}
      - return: {write_path: "= vars.writePath"}

  - component: cassandra-stream-manager
    name: create-outgoing-streams
    kind: function
    summary: "CassandraStreamManager.createOutgoingStreams: the SSTable sections overlapping the ranges (pending this repair only for incremental repair, the preview predicate for previews), per table."
    sources: [src/java/org/apache/cassandra/db/streaming/CassandraStreamManager.java:90-140]
    request: {type: object, properties: {keyspace: {type: string}, tables: {type: array}, ranges: {type: array}, pending_repair: {type: string}, preview_kind: {type: string}}}
    response: {type: object, properties: {files: {type: integer}, data: {type: array}}}
    behavior:
      - call: cassandra-table-repair-manager.get-table-data
        input: {keyspace: "= input.keyspace", tables: "= input.tables"}
        as: d
      - return:
          files: "= sum(input.tables.map(t, input.keyspace + '.' + t in state.sstables ? state.sstables[input.keyspace + '.' + t] : 1))"
          data: "= vars.d.value.data"

  - component: stream-manager
    name: register-initiator
    kind: store
    summary: "StreamManager.registerInitiator: tracks the plan for JMX and the streaming virtual table until it completes."
    sources: [src/java/org/apache/cassandra/streaming/StreamManager.java:359-367]
    request: {type: object, properties: {key: {type: string}, row: {type: object}}}
    store: {table: streams, op: put, key: "= input.key", value: "= input.row"}

  - component: streaming-multiplexed-channel
    name: keep-alive-task
    kind: function
    summary: "KeepAliveTask: every streaming_keep_alive_period (300s), sends KeepAliveMessage on the control channel; cancels itself once the channel closes."
    sources:
      - src/java/org/apache/cassandra/streaming/async/StreamingMultiplexedChannel.java:425-460
      - src/java/org/apache/cassandra/streaming/async/StreamingMultiplexedChannel.java:462-482
    request: {type: object, properties: {peer: {type: string, examples: ["n2"]}}}
    response: {type: object, properties: {sent: {type: boolean}}}
    behavior:
      - title: Channel closed. Cancel the keep-alive task
        source: src/java/org/apache/cassandra/streaming/async/StreamingMultiplexedChannel.java:441-446
        if: "!state.connected || state.closed"
        then:
          - set: {ctx.keepAliveCancelled: true}
          - return: {sent: false}
      - title: KeepAliveMessage (a NOP for the receiver; keeps the TCP connection open)
        source: src/java/org/apache/cassandra/streaming/async/StreamingMultiplexedChannel.java:451-459
        set: {state.keep_alives_sent: "= state.keep_alives_sent + 1"}
      - return: {sent: true}

  - component: replication-done-verb-handler
    name: do-verb
    kind: verb
    summary: "REPLICATION_DONE_REQ: StorageService.confirmReplication(from), then REPLICATION_DONE_RSP."
    attributes: {verb: REPLICATION_DONE_REQ}
    sources:
      - src/java/org/apache/cassandra/streaming/ReplicationDoneVerbHandler.java:34-39
      - src/java/org/apache/cassandra/net/Verb.java:181
      - src/java/org/apache/cassandra/net/Verb.java:182
    request: {type: object, properties: {from: {type: string, examples: ["n2"]}}}
    response: {type: object, properties: {ack: {type: boolean}}}
    behavior:
      - call: storage-service.confirm-replication
        input: {endpoint: "= input.from"}
      - return: {ack: true}

  # ================================================================ snapshots (handler and manager)
  - component: snapshot-verb-handler
    name: do-verb
    kind: verb
    summary: "SNAPSHOT_REQ: clear the snapshot, take a diagnostic snapshot (RepairedDataMismatch- or DuplicateRows- names), or snapshot the table; then SNAPSHOT_RSP."
    attributes: {verb: SNAPSHOT_REQ}
    sources:
      - src/java/org/apache/cassandra/service/SnapshotVerbHandler.java:42-63
      - src/java/org/apache/cassandra/net/Verb.java:183
      - src/java/org/apache/cassandra/net/Verb.java:184
      - src/java/org/apache/cassandra/utils/DiagnosticSnapshotService.java:105-109
    request: RepairStreamingSnapshotCommand
    response: {type: object, properties: {ack: {type: boolean}}}
    behavior:
      - if: "input.clear_snapshot"
        then:
          - title: Clear the named snapshot in the keyspace
            source: src/java/org/apache/cassandra/service/SnapshotVerbHandler.java:45-48
            call: storage-service.clear-snapshot
            input: {tag: "= input.snapshot_name", keyspaces: ["= input.keyspace"], older_than_seconds: 0}
        else:
          - if: "input.snapshot_name.startsWith('RepairedDataMismatch-') || input.snapshot_name.startsWith('DuplicateRows-')"
            then:
              - title: Diagnostic snapshot request
                source: src/java/org/apache/cassandra/service/SnapshotVerbHandler.java:49-55
                call: diagnostic-snapshot-service.snapshot
                input: {keyspace: "= input.keyspace", column_family: "= input.column_family", snapshot_name: "= input.snapshot_name", from: "= input.from"}
            else:
              - title: Snapshot the table
                source: src/java/org/apache/cassandra/service/SnapshotVerbHandler.java:56-59
                call: column-family-store.snapshot
                input: {replica: "= self", keyspace: "= input.keyspace", table: "= input.column_family", snapshot_name: "= input.snapshot_name"}
      - title: SNAPSHOT_RSP to the requester
        source: src/java/org/apache/cassandra/service/SnapshotVerbHandler.java:61-62
        return: {ack: true}

  - component: snapshot-manager
    name: add-snapshot
    kind: store
    summary: "StorageService.addSnapshot -> SnapshotManager.addSnapshot: expiring snapshots join the cleanup queue (the model tracks every snapshot)."
    sources:
      - src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:102-110
      - src/java/org/apache/cassandra/service/StorageService.java:7269-7271
    request: {type: object, properties: {key: {type: string}, row: RepairStreamingTableSnapshot}}
    store: {table: snapshots, op: put, key: "= input.key", value: "= input.row"}
  - component: snapshot-manager
    name: get-snapshot
    kind: store
    summary: "Directories.snapshotExists for one table and tag (keyed replica:keyspace.table:tag)."
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2380-2383]
    request: {type: object, properties: {key: {type: string}}}
    store: {table: snapshots, op: get, key: "= input.key", default: {tag: ""}}
  - component: snapshot-manager
    name: load-snapshots
    kind: store
    summary: "SnapshotManager.loadSnapshots: the snapshots found on disk (SnapshotLoader)."
    sources: [src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:112-120]
    request: {type: object, properties: {}}
    store: {table: snapshots, op: query}
  - component: snapshot-manager
    name: snapshots-remove
    kind: store
    summary: The expiringSnapshots.remove step of clearSnapshot.
    sources: [src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:164]
    request: {type: object, properties: {key: {type: string}}}
    store: {table: snapshots, op: delete, key: "= input.key"}

  - component: snapshot-manager
    name: clear-snapshot
    kind: function
    summary: "SnapshotManager.clearSnapshot: removes every directory of the snapshot (rate limited) and forgets it."
    sources: [src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:159-165]
    request: RepairStreamingTableSnapshot
    response: {type: object, properties: {}}
    behavior:
      - call: data-disk.snapshot-remove
        input: {keyspace: "= input.keyspace", table: "= input.table", tag: "= input.tag"}
      - call: snapshot-manager.snapshots-remove
        input: {key: "= input.keyspace + '.' + input.table + ':' + input.tag"}

  - component: snapshot-manager
    name: clear-expired-snapshots
    kind: function
    summary: "SnapshotManager.clearExpiredSnapshots (SnapshotCleanup executor, every 60s after 5s): removes expiring snapshots whose TTL has passed."
    sources:
      - src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:142-154
      - src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:129-140
    request: {type: object, properties: {}}
    response: {type: object, properties: {cleared: {type: integer}}}
    behavior:
      - call: snapshot-manager.load-snapshots
        input: {}
        as: all
      - set:
          vars.expired: "= vars.all.value.filter(s, s.expires_at > 0 && s.expires_at <= now)"
      - foreach: "= vars.expired"
        as: s
        steps:
          - call: snapshot-manager.clear-snapshot
            input: "= vars.s"
      - return: {cleared: "= size(vars.expired)"}

  # ================================================================ auto repair
  - component: auto-repair
    name: repair
    kind: function
    summary: "AutoRepair.repair (scheduled every repair_check_interval, 5m): if enabled and it is this node's turn, runs RepairCoordinators for its assignments."
    sources:
      - src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:161-281
      - src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:142-146
      - src/java/org/apache/cassandra/repair/autorepair/AutoRepairConfig.java:185-188
    request: {type: object, properties: {repair_type: {type: string, enum: [FULL, INCREMENTAL, PREVIEW_REPAIRED], examples: [FULL]}}}
    response: {type: object, properties: {ran: {type: boolean}, reason: {type: string}}}
    behavior:
      - title: Disabled unless -Dcassandra.autorepair.enable=true and auto_repair.enabled (both off when deployed)
        source: src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:163-168
        if: "!(config['autorepair-jvm-enable'] && config['auto-repair-enabled'])"
        then:
          - set: {ctx.autoRepair: disabled}
          - return: {ran: false, reason: disabled}
      - title: Not run in an ignored data center
        source: src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:186-190
        if: "state.local_dc in state.ignore_dcs"
        then:
          - return: {ran: false, reason: ignored datacenter}
      - title: Whose turn is it (system_distributed.auto_repair_history and priorities)
        source: src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:204-206
        choice: turn
        default: NOT_MY_TURN
        options:
          NOT_MY_TURN:
            - set: {ctx.autoRepair: waiting}
            - return: {ran: false, reason: Waiting for my turn}
          MY_TURN:
            - set: {ctx.autoRepair: running}
      - foreach: "= state.keyspaces"
        as: ks
        steps:
          - title: One RepairCoordinator per assignment, primary range only by default
            source: src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:342-360
            call: repair-coordinator.run
            input:
              cmd: 1
              keyspace: "= vars.ks"
              coordinator: "n1"
              parent_session: "6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21"
              option: {parallelism: parallel, primary_range: true, incremental: "= input.repair_type == 'INCREMENTAL'", preview_kind: "= input.repair_type == 'PREVIEW_REPAIRED' ? 'REPAIRED' : 'NONE'", trace: false, force: false, pull_repair: false, ignore_unreplicated_keyspaces: true, repair_paxos: false, paxos_only: false, optimise_streams: false, job_threads: 1, ranges: ["(-6148914691236517206,0]"], column_families: [], data_centers: [], hosts: [], is_global: true}
              ranges: ["(-6148914691236517206,0]"]
            on_error: continue
      - return: {ran: true, reason: repaired}

flows:
  - id: rs-nodetool-repair-full
    tags: [writes]
    name: nodetool repair --full (StorageService.repairAsync)
    description: A full parallel repair of ks1 coordinated by n1. repairAsync returns the command number; the RepairCoordinator runs asynchronously (an emit), so scenarios assert its effects on state and ctx.
    entry:
      caller: operator
      interface: storage-service.repair-async
      input:
        keyspace: ks1
        options: {parallelism: parallel, primaryRange: "false", incremental: "false", jobThreads: "1", trace: "false", columnFamilies: users, pullRepair: "false", forceRepair: "false", previewKind: NONE, optimiseStreams: "false", ignoreUnreplicatedKeyspaces: "false", repairPaxos: "true", paxosOnly: "false", ranges: "", dataCenters: "", hosts: ""}
    sources:
      - src/java/org/apache/cassandra/service/StorageService.java:4766-4803
      - src/java/org/apache/cassandra/repair/RepairCoordinator.java:290-332
  - id: rs-nodetool-repair-incremental
    tags: [writes]
    name: nodetool repair (incremental, the nodetool default)
    description: An incremental repair of ks1. The consistent-repair protocol wraps the repair session. PREPARE_CONSISTENT, then validation and sync, then FINALIZE_PROPOSE and FINALIZE_COMMIT.
    entry:
      caller: operator
      interface: storage-service.repair-async
      input:
        keyspace: ks1
        options: {parallelism: parallel, primaryRange: "false", incremental: "true", jobThreads: "1", trace: "false", columnFamilies: users, pullRepair: "false", forceRepair: "false", previewKind: NONE, optimiseStreams: "false", ignoreUnreplicatedKeyspaces: "false", repairPaxos: "true", paxosOnly: "false", ranges: "", dataCenters: "", hosts: ""}
    sources:
      - src/java/org/apache/cassandra/repair/IncrementalRepairTask.java:54-69
      - src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:341-387
  - id: rs-nodetool-repair-preview
    tags: [writes]
    name: nodetool repair --preview
    description: A preview of a full repair. Validation and stream planning only; no data moves.
    entry:
      caller: operator
      interface: storage-service.repair-async
      input:
        keyspace: ks1
        options: {parallelism: parallel, primaryRange: "false", incremental: "false", jobThreads: "1", trace: "false", columnFamilies: users, pullRepair: "false", forceRepair: "false", previewKind: ALL, optimiseStreams: "false", ignoreUnreplicatedKeyspaces: "false", repairPaxos: "false", paxosOnly: "false", ranges: "", dataCenters: "", hosts: ""}
    sources: [src/java/org/apache/cassandra/repair/PreviewRepairTask.java:68-98]
  - id: rs-repair-verb-received
    tags: [writes]
    name: A repair verb arrives at a replica (RepairMessageVerbHandler.doVerb)
    description: Inbound repair messages on n2, dispatched by verb.
    entry:
      caller: messaging
      interface: repair-message-verb-handler.do-verb
      on: n2
      input: {verb: VALIDATION_REQ, from: "n1", parent_session: "6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21", session_id: "7a11c3d0-9d3c-11ef-a8d2-5b1c0e7f4a21", keyspace: ks1, table: users, ranges: ["(-6148914691236517206,0]"], preview_kind: NONE, now_in_sec: 0}
    sources: [src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:98-370]
  - id: rs-incremental-session-cleanup
    tags: [writes]
    name: LocalSessions.cleanup (ActiveRepairService.start schedules it every 10 minutes)
    entry:
      caller: active-repair-service
      interface: local-sessions.cleanup
      input: {}
      repeat: {count: 1, interval_ms: 600000, initial_delay_ms: 0}
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:265-271]
  - id: rs-stream-plan-execute
    tags: [writes]
    name: Execute a stream plan (bootstrap-style range fetch)
    description: n1 requests a range of ks1.users from n2, as RangeStreamer does for bootstrap and rebuild.
    entry:
      caller: membership
      interface: stream-plan.execute
      input: {plan_id: "9c4e2a10-9d3c-11ef-a8d2-5b1c0e7f4a21", operation: BOOTSTRAP, keyspace: ks1, tables: [users], requests: [{peer: n2, ranges: ["(-6148914691236517206,0]"]}], transfers: [], pending_repair: "", preview_kind: NONE, flush_before_transfer: true}
    sources: [src/java/org/apache/cassandra/streaming/StreamPlan.java:195-198]
  - id: rs-streaming-keep-alive
    name: Streaming keep-alive task (every streaming_keep_alive_period)
    entry:
      caller: streaming-multiplexed-channel
      interface: streaming-multiplexed-channel.keep-alive-task
      input: {peer: "n2"}
      repeat: {count: 3, interval_ms: 300000, initial_delay_ms: 300000}
    sources: [src/java/org/apache/cassandra/streaming/async/StreamingMultiplexedChannel.java:462-482]
  - id: rs-replication-done-received
    name: REPLICATION_DONE_REQ arrives (removenode re-replication finished on a peer)
    entry:
      caller: messaging
      interface: replication-done-verb-handler.do-verb
      input: {from: "n2"}
    sources: [src/java/org/apache/cassandra/streaming/ReplicationDoneVerbHandler.java:34-39]
  - id: rs-nodetool-snapshot
    tags: [writes]
    name: nodetool snapshot (StorageService.takeSnapshot)
    entry:
      caller: operator
      interface: storage-service.take-snapshot
      input: {tag: backup-2026-10-30, entities: [ks1], ttl_seconds: 0, skip_flush: false}
    sources: [src/java/org/apache/cassandra/service/StorageService.java:4334-4353]
  - id: rs-nodetool-clearsnapshot
    tags: [writes]
    name: nodetool clearsnapshot (StorageService.clearSnapshot)
    entry:
      caller: operator
      interface: storage-service.clear-snapshot
      input: {tag: backup-2026-10-30, keyspaces: [ks1], older_than_seconds: 0}
    sources: [src/java/org/apache/cassandra/service/StorageService.java:4583-4627]
  - id: rs-snapshot-ttl-cleanup
    tags: [writes]
    name: Expired snapshot cleanup (SnapshotManager, every 60s)
    entry:
      caller: snapshot-manager
      interface: snapshot-manager.clear-expired-snapshots
      input: {}
      repeat: {count: 2, interval_ms: 60000, initial_delay_ms: 5000}
    sources: [src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:131-140]
  - id: rs-snapshot-req-received
    tags: [writes]
    name: SNAPSHOT_REQ arrives at this node
    entry:
      caller: messaging
      interface: snapshot-verb-handler.do-verb
      input: {from: "n2", keyspace: ks1, column_family: users, snapshot_name: backup-2026-10-30, clear_snapshot: false}
    sources: [src/java/org/apache/cassandra/service/SnapshotVerbHandler.java:42-63]
  - id: rs-auto-repair-tick
    tags: [writes]
    name: AutoRepair scheduler tick
    entry:
      caller: auto-repair
      interface: auto-repair.repair
      input: {repair_type: FULL}
    sources: [src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:136-146]

  - id: rs-repair-admin-cancel
    tags: [writes]
    name: nodetool repair_admin cancel (ActiveRepairService.failSession)
    entry:
      caller: operator
      interface: active-repair-service.fail-session
      input: {session: "6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21", force: false}
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:297-302]
  - id: rs-repair-terminate
    tags: [writes]
    name: Terminate all repair sessions (nodetool repair --stop)
    entry:
      caller: operator
      interface: active-repair-service.terminate-sessions
      input: {}
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:515-523]
  - id: rs-repair-abort-for-table
    tags: [writes]
    name: Abort parent repair sessions that include a table (truncate or drop)
    entry:
      caller: write-path
      interface: active-repair-service.abort
      input: {table: users, message: truncating}
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:1095-1109]

scenarios:
- id: rs-full-repair-in-sync
  flow: rs-nodetool-repair-full
  name: "Full repair, replicas already agree"
  description: "Prepare goes to the two neighbors, Merkle trees come from all three nodes (the coordinator validates itself through messaging), no differences, CLEANUP_MSG to the neighbors."
  fixtures:
  - three-node-rf3
  expect:
  - "result.ok && result.value.cmd == 1"
  - "ctx.repairOutcome == 'completed'"
  - "calls['repair-message-verb-handler.do-verb-prepare-msg'] == 2"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 3"
  - "calls['repair-message-verb-handler.do-verb-validation-rsp'] == 2"
  - "calls['repair-message-verb-handler.do-verb-snapshot-msg'] == 0"
  - "ctx.syncTasks == 0 && calls['stream-plan.execute'] == 0"
  - "calls['repair-message-verb-handler.do-verb-cleanup-msg'] == 2"
  - "calls['paxos-cleanup.cleanup'] == 0"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'COMPLETED'"
  - "size(state['active-repair-service@n1'].parent_repair_sessions) == 0"
- id: rs-full-repair-node3-diverged
  flow: rs-nodetool-repair-full
  name: "Full repair, n3 has different data"
  description: "Trees of n3 differ from both others. The pair (n1, n3) becomes a LocalSyncTask streamed by the coordinator; the pair (n2, n3) a SymmetricRemoteSyncTask forwarded to n2 with SYNC_REQ."
  fixtures:
  - three-node-rf3
  state:
    "cassandra-table-repair-manager@n3":
      digests:
        ks1.users: 9f86d081
  expect:
  - "ctx.repairOutcome == 'completed'"
  - ctx.syncTasks == 2
  - "calls['local-sync-task.start-sync'] == 1 && calls['symmetric-remote-sync-task.start-sync'] == 1"
  - "calls['repair-message-verb-handler.do-verb-sync-req'] == 1 && calls['repair-message-verb-handler.do-verb-sync-rsp'] == 1"
  - "'n1<->n3' in ctx.streamedPairs && 'n2<->n3' in ctx.streamedPairs"
  - "calls['stream-plan.execute'] == 2 && calls['stream-session.receive'] == 4"
  - "calls['column-family-store.add-sstables'] == 4"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'column-family-store.add-sstables').all(e, e.input.pending_repair == '')"
  - "calls['column-family-store.force-flush'] == 4"
  - "state['cassandra-table-repair-manager@n1'].digests['ks1.users'] == '9f86d081+d41d8cd9'"
  - "state['cassandra-table-repair-manager@n2'].digests['ks1.users'] == state['cassandra-table-repair-manager@n1'].digests['ks1.users'] && state['cassandra-table-repair-manager@n3'].digests['ks1.users'] == state['cassandra-table-repair-manager@n1'].digests['ks1.users']"
- id: rs-full-repair-replica-down
  flow: rs-nodetool-repair-full
  name: "A replica is down, so prepare fails"
  description: "Without --force a dead participant fails the prepare at once ('Endpoint not alive'); no Merkle trees are requested and FAILED_SESSION_MSG goes to every participant."
  fixtures:
  - three-node-rf3
  state:
    "gossiper@n1":
      endpoint_state_map:
        n3:
          alive: false
      live_endpoints:
      - n2
      unreachable_endpoints:
      - n3
  expect:
  - "result.ok && ctx.repairOutcome == 'failed'"
  - "ctx.repairFailure == 'Endpoint not alive: n3'"
  - "calls['repair-message-verb-handler.do-verb-prepare-msg'] == 0"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 0"
  - "calls['repair-message-verb-handler.do-verb-failed-session-msg'] == 2"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'FAILED'"
  - "state['active-repair-service@n1'].repair_status['1'].messages[1] == 'Repair command #1 finished with error'"
- id: rs-full-repair-forced-dead-replica
  flow: rs-nodetool-repair-full
  name: --force repairs with the live replicas only
  description: "forceRepair drops the dead n3 from the participants; the remaining two nodes repair, and the ranges count as skipped rather than successful."
  fixtures:
  - three-node-rf3
  input:
    options:
      forceRepair: "true"
  state:
    "gossiper@n1":
      endpoint_state_map:
        n3:
          alive: false
      live_endpoints:
      - n2
      unreachable_endpoints:
      - n3
  expect:
  - "ctx.repairOutcome == 'completed'"
  - "ctx.repairParticipants == ['n2']"
  - "calls['repair-message-verb-handler.do-verb-prepare-msg'] == 1"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 2"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'COMPLETED'"
- id: rs-full-repair-prepare-timeout
  flow: rs-nodetool-repair-full
  name: A participant never answers PREPARE_MSG
  description: "The prepare promise is bounded by request_timeout (10s), shorter than the PREPARE_MSG callback expiry (repair_request_timeout 120s)."
  fixtures:
  - three-node-rf3
  faults:
  - target: repair-message-verb-handler.do-verb-prepare-msg
    type: timeout
    instance: n3
  expect:
  - "ctx.repairOutcome == 'failed'"
  - "ctx.repairFailure == 'Did not get replies from all endpoints.'"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 0"
  - "duration_ms >= 10000 && duration_ms < 120000"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'FAILED'"
- id: rs-full-repair-prepare-rejected-disk-headroom
  flow: rs-nodetool-repair-full
  name: A participant rejects PREPARE_MSG for lack of disk headroom
  description: "With repair_disk_headroom_reject_ratio 0.2 and 90% disk usage on n2, the replica answers with a failure response."
