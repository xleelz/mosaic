  # ================================================================ RepairOption
  - component: repair-option
    name: parse
    kind: function
    summary: RepairOption.parse. Defaults to sequential parallelism and full repair when keys are absent; refuses invalid combinations.
    sources: [src/java/org/apache/cassandra/repair/messages/RepairOption.java:174-276]
    request: RepairStreamingRepairSpec
    response: RepairStreamingRepairOption
    errors:
      - {code: illegal-argument-exception}
    behavior:
      - set:
          vars.par: "= has(input.parallelism) && input.parallelism in ['parallel', 'dc_parallel'] ? input.parallelism : 'sequential'"
          vars.preview: "= has(input.previewKind) && input.previewKind != '' ? input.previewKind : 'NONE'"
          vars.jobThreads: "= has(input.jobThreads) && input.jobThreads != '' ? int(input.jobThreads) : 1"
          vars.dcs: "= has(input.dataCenters) && input.dataCenters != '' ? input.dataCenters.split(',').map(x, x.trim()) : []"
          vars.hosts: "= has(input.hosts) && input.hosts != '' ? input.hosts.split(',').map(x, x.trim()) : []"
          vars.cfs: "= has(input.columnFamilies) && input.columnFamilies != '' ? input.columnFamilies.split(',').map(x, x.trim()) : []"
          vars.rawRanges: "= has(input.ranges) && input.ranges != '' ? input.ranges.split(',').filter(r, size(r.split(':')) >= 2) : []"
          vars.incremental: "= has(input.incremental) && input.incremental.lowerAscii() == 'true'"
          vars.primary: "= has(input.primaryRange) && input.primaryRange.lowerAscii() == 'true'"
          vars.pull: "= has(input.pullRepair) && input.pullRepair.lowerAscii() == 'true'"
          vars.force: "= has(input.forceRepair) && input.forceRepair.lowerAscii() == 'true'"
          vars.paxos: "= has(input.repairPaxos) && input.repairPaxos.lowerAscii() == 'true'"
          vars.paxosOnly: "= has(input.paxosOnly) && input.paxosOnly.lowerAscii() == 'true'"
      - title: Preview repairs cannot repair Paxos
        source: src/java/org/apache/cassandra/repair/messages/RepairOption.java:188-192
        if: "vars.preview != 'NONE' && (vars.paxos || vars.paxosOnly)"
        then:
          - fail: {code: illegal-argument-exception, message: "= vars.paxos ? 'repairPaxos must be set to false for preview repairs' : 'paxosOnly must be set to false for preview repairs'"}
      - title: Start and end tokens must differ
        source: src/java/org/apache/cassandra/repair/messages/RepairOption.java:76-81
        when: "vars.rawRanges.exists(r, r.split(':')[0].trim() == r.split(':')[1].trim())"
        fail: {code: illegal-argument-exception, message: Start and end tokens must be different.}
      - title: At most 4 job threads
        source: src/java/org/apache/cassandra/repair/messages/RepairOption.java:251-254
        when: "vars.jobThreads > 4"
        fail: {code: illegal-argument-exception, message: Too many job threads. Max is 4}
      - title: -dc and -hosts are exclusive
        source: src/java/org/apache/cassandra/repair/messages/RepairOption.java:255-258
        when: "size(vars.dcs) > 0 && size(vars.hosts) > 0"
        fail: {code: illegal-argument-exception, message: Cannot combine -dc and -hosts options.}
      - title: Primary-range repair must run on every node (or -local only)
        source: src/java/org/apache/cassandra/repair/messages/RepairOption.java:259-262
        when: "vars.primary && ((size(vars.dcs) > 0 && !(size(vars.dcs) == 1 && 'datacenter1' in vars.dcs)) || size(vars.hosts) > 0)"
        fail: {code: illegal-argument-exception, message: You need to run primary range repair on all nodes in the cluster.}
      - title: Pull repair needs exactly two hosts and explicit ranges
        source: src/java/org/apache/cassandra/repair/messages/RepairOption.java:263-273
        if: "vars.pull && (size(vars.hosts) != 2 || size(vars.rawRanges) == 0)"
        then:
          - fail: {code: illegal-argument-exception, message: "= size(vars.hosts) != 2 ? 'Pull repair can only be performed between two hosts. Please specify two hosts, one of which must be this host.' : 'Token ranges must be specified when performing pull repair. Please specify at least one token range which both hosts have in common.'"}
      - return:
          parallelism: "= vars.par"
          primary_range: "= vars.primary"
          incremental: "= vars.incremental"
          preview_kind: "= vars.preview"
          trace: "= has(input.trace) && input.trace.lowerAscii() == 'true'"
          force: "= vars.force"
          pull_repair: "= vars.pull"
          ignore_unreplicated_keyspaces: "= has(input.ignoreUnreplicatedKeyspaces) && input.ignoreUnreplicatedKeyspaces.lowerAscii() == 'true'"
          repair_paxos: "= vars.paxos"
          paxos_only: "= vars.paxosOnly"
          optimise_streams: "= has(input.optimiseStreams) && input.optimiseStreams.lowerAscii() == 'true'"
          job_threads: "= vars.jobThreads"
          ranges: "= vars.rawRanges.map(r, '(' + r.split(':')[0].trim() + ',' + r.split(':')[1].trim() + ']')"
          column_families: "= vars.cfs"
          data_centers: "= vars.dcs"
          hosts: "= vars.hosts"
          is_global: "= size(vars.dcs) == 0 && size(vars.hosts) == 0"

  # ================================================================ RepairCoordinator
  - component: repair-coordinator
    name: run
    kind: function
    summary: "RepairCoordinator.run: setup, neighbors and ranges, prepare, repair task, then success (with CLEANUP_MSG) or fail (with FAILED_SESSION_MSG)."
    sources:
      - src/java/org/apache/cassandra/repair/RepairCoordinator.java:273-332
      - src/java/org/apache/cassandra/repair/RepairCoordinator.java:334-342
      - src/java/org/apache/cassandra/repair/RepairCoordinator.java:373-419
      - src/java/org/apache/cassandra/repair/RepairCoordinator.java:445-480
    request:
      type: object
      properties:
        cmd: {type: integer, examples: [1]}
        keyspace: {type: string, examples: [ks1]}
        coordinator: {type: string, examples: ["n1"]}
        parent_session: {type: string, examples: ["6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21"]}
        option: RepairStreamingRepairOption
        ranges: {type: array, items: {type: string}}
    response: {type: object, properties: {status: {type: string}, message: {type: string}}}
    behavior:
      - title: Record IN_PROGRESS for the command
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:292-293
        call: active-repair-service.record-repair-status
        input: {cmd: "= input.cmd", status: IN_PROGRESS, messages: []}
      - set:
          vars.tables: "= size(input.option.column_families) > 0 ? input.option.column_families : (input.keyspace in state.schema_tables ? state.schema_tables[input.keyspace] : [])"
      - title: Empty keyspace, skipping repair
        detail: SkipRepairException; the command completes successfully without contacting anyone.
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:339-340
        if: "size(vars.tables) == 0"
        then:
          - call: active-repair-service.record-repair-status
            input: {cmd: "= input.cmd", status: COMPLETED, messages: ["= input.parent_session + ' Empty keyspace, skipping repair: ' + input.keyspace"]}
          - set: {ctx.repairOutcome: skipped}
          - return: {status: COMPLETED, message: skipped}
      - title: Find the neighbors sharing the ranges
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:373-401
        call: active-repair-service.get-neighbors
        input:
          keyspace: "= input.keyspace"
          coordinator: "= input.coordinator"
          ranges: "= input.ranges"
          data_centers: "= input.option.data_centers"
          hosts: "= input.option.hosts"
        as: nb
        on_error:
          - call: repair-coordinator.fail
            input: {cmd: "= input.cmd", parent_session: "= input.parent_session", coordinator: "= input.coordinator", reason: "= error.message", participants: []}
          - return: {status: FAILED, message: "= error.message"}
      - if: "size(vars.nb.value.neighbors) == 0"
        then:
          - title: No neighbors for the range
            detail: With --ignore-unreplicated-keyspaces the command is skipped; otherwise RepairException.warn aborts it.
            source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:387-397
            if: "input.option.ignore_unreplicated_keyspaces"
            then:
              - call: active-repair-service.record-repair-status
                input: {cmd: "= input.cmd", status: COMPLETED, messages: [unreplicated keyspace is ignored]}
              - set: {ctx.repairOutcome: skipped}
              - return: {status: COMPLETED, message: skipped}
          - call: repair-coordinator.fail
            input: {cmd: "= input.cmd", parent_session: "= input.parent_session", coordinator: "= input.coordinator", reason: "= 'Nothing to repair for ' + input.ranges.join(',') + ' in ' + input.keyspace + ' - aborting'", participants: []}
          - return: {status: FAILED}
      - set:
          vars.alive: []
      - title: With --force, drop neighbors the failure detector considers dead
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:410-417
        foreach: "= vars.nb.value.neighbors"
        as: ep
        steps:
          - if: "input.option.force"
            then:
              - call: failure-detector.is-alive
                input: {endpoint: "= vars.ep"}
                as: fd
              - when: "vars.fd.value.alive"
                set: {vars.alive: "= vars.alive + [vars.ep]"}
            else:
              - set: {vars.alive: "= vars.alive + [vars.ep]"}
      - set:
          vars.excludeDead: "= size(vars.alive) != size(vars.nb.value.neighbors)"
          vars.participants: "= vars.alive"
          ctx.repairParticipants: "= vars.alive"
      - title: Prepare all participants (PREPARE_MSG)
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:445-456
        call: active-repair-service.prepare-for-repair
        input:
          parent_session: "= input.parent_session"
          coordinator: "= input.coordinator"
          endpoints: "= vars.participants"
          option: "= input.option"
          force: "= vars.excludeDead"
          keyspace: "= input.keyspace"
          tables: "= vars.tables"
          ranges: "= input.ranges"
        as: prep
        on_error:
          - call: repair-coordinator.fail
            input: {cmd: "= input.cmd", parent_session: "= input.parent_session", coordinator: "= input.coordinator", reason: "= error.message", participants: "= vars.participants"}
          - return: {status: FAILED, message: "= error.message"}
      - title: Force mode removes dead endpoints from the common range
        detail: When every neighbor of a range is dead the range is skipped; 'Not enough live endpoints for a repair' if nothing remains.
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:617-650
        set:
          vars.commonRange:
            endpoints: "= vars.participants"
            trans_endpoints: []
            ranges: "= vars.nb.value.ranges"
            has_skipped_replicas: "= vars.excludeDead"
      - set:
          vars.taskInput:
            parent_session: "= input.parent_session"
            coordinator: "= input.coordinator"
            keyspace: "= input.keyspace"
            tables: "= vars.tables"
            option: "= input.option"
            common_range: "= vars.commonRange"
            participants: "= vars.participants"
            force: "= vars.excludeDead"
      - title: Pick the repair task (preview, incremental or normal)
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:458-480
        if: "input.option.preview_kind != 'NONE'"
        then:
          - call: preview-repair-task.perform-unsafe
            input: "= vars.taskInput"
            as: task
            on_error: continue
        else:
          - if: "input.option.incremental"
            then:
              - call: incremental-repair-task.perform-unsafe
                input: "= vars.taskInput"
                as: task
                on_error: continue
            else:
              - call: normal-repair-task.perform-unsafe
                input: "= vars.taskInput"
                as: task
                on_error: continue
      - if: "!vars.task.ok"
        then:
          - title: The repair task failed
            detail: notifyError (ignored for SomeRepairFailedException) then fail(failure.getMessage()); the reason falls back to the first session error.
            source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:310-315
            call: repair-coordinator.fail
            input: {cmd: "= input.cmd", parent_session: "= input.parent_session", coordinator: "= input.coordinator", reason: "= has(vars.task.error.data) && has(vars.task.error.data.first_error) ? vars.task.error.data.first_error : vars.task.error.message", participants: "= vars.participants"}
          - return: {status: FAILED}
      - if: "vars.task.value.has_failed"
        then:
          - title: Some ranges failed
            detail: CoordinatedRepairResult.hasFailed() -> fail(null); the reason is the first error reported by a session callback.
            source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:320-324
            call: repair-coordinator.fail
            input: {cmd: "= input.cmd", parent_session: "= input.parent_session", coordinator: "= input.coordinator", reason: "= vars.task.value.first_error", participants: "= vars.participants"}
          - return: {status: FAILED}
      - title: Success. Record COMPLETED and send CLEANUP_MSG to participants
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:325-329
        call: active-repair-service.record-repair-status
        input: {cmd: "= input.cmd", status: COMPLETED, messages: ["= vars.task.value.message"]}
      - set:
          ctx.repairOutcome: completed
          ctx.repairMessage: "= vars.task.value.message"
      - call: active-repair-service.clean-up
        input: {parent_session: "= input.parent_session", coordinator: "= input.coordinator", endpoints: "= vars.participants"}
      - title: complete() removes the parent repair session (clearing repair snapshots)
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:242-271
        call: active-repair-service.remove-parent-repair-session
        input: {key: "= input.parent_session", parent_session: "= input.parent_session"}
      - return: {status: COMPLETED, message: "= vars.task.value.message"}

  - component: repair-coordinator
    name: fail
    kind: function
    summary: "RepairCoordinator.fail: tells every participant FAILED_SESSION_MSG, records FAILED with the reason, and removes the parent session."
    sources:
      - src/java/org/apache/cassandra/repair/RepairCoordinator.java:213-240
      - src/java/org/apache/cassandra/repair/RepairCoordinator.java:163-188
    request:
      type: object
      properties:
        cmd: {type: integer}
        parent_session: {type: string}
        coordinator: {type: string}
        reason: {type: string}
        participants: {type: array, items: {type: string}}
    response: {type: object, properties: {status: {type: string}}}
    behavior:
      - foreach: "= input.participants"
        as: p
        steps:
          - title: FAILED_SESSION_MSG to each participant (with retries when enabled)
            source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:226-231
            emit: repair-message.send-message-with-retries
            input:
              verb: FAILED_SESSION_MSG
              endpoint: "= vars.p"
              message: {verb: FAILED_SESSION_MSG, from: "= input.coordinator", parent_session: "= input.parent_session"}
      - title: Record FAILED with the reason first
        source: src/java/org/apache/cassandra/repair/RepairCoordinator.java:232-237
        call: active-repair-service.record-repair-status
        input: {cmd: "= input.cmd", status: FAILED, messages: ["= input.reason", "= 'Repair command #' + string(input.cmd) + ' finished with error'"]}
      - set:
          ctx.repairOutcome: failed
          ctx.repairFailure: "= input.reason"
      - call: active-repair-service.remove-parent-repair-session
        input: {key: "= input.parent_session", parent_session: "= input.parent_session"}
      - return: {status: FAILED}

  # ================================================================ ActiveRepairService
  - component: active-repair-service
    name: get-neighbors
    kind: function
    summary: "ActiveRepairService.getNeighbors: the other replicas of the local range containing the requested range, filtered by -dc or -hosts."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:546-615]
    request:
      type: object
      properties:
        keyspace: {type: string}
        coordinator: {type: string}
        ranges: {type: array, items: {type: string}}
        data_centers: {type: array, items: {type: string}}
        hosts: {type: array, items: {type: string}}
    response: {type: object, properties: {neighbors: {type: array, items: {type: string}}, ranges: {type: array, items: {type: string}}}}
    errors:
      - {code: illegal-argument-exception}
    behavior:
      - call: storage-service.get-local-replicas
        input: {keyspace: "= input.keyspace"}
        as: local
      - set:
          vars.t: "= input.ranges[0]"
      - set:
          vars.tl: "= int(vars.t.substring(1, vars.t.indexOf(',')))"
          vars.tr: "= int(vars.t.substring(vars.t.indexOf(',') + 1, size(vars.t) - 1))"
      - title: Find the local range that contains the requested range
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:553-569
        set:
          vars.known: >-
            = vars.local.value.ranges.filter(k,
              (int(k.substring(1, k.indexOf(','))) < int(k.substring(k.indexOf(',') + 1, size(k) - 1))
                ? (vars.tl < vars.tr && int(k.substring(1, k.indexOf(','))) <= vars.tl && vars.tr <= int(k.substring(k.indexOf(',') + 1, size(k) - 1)))
                : ((vars.tl < vars.tr && (vars.tl >= int(k.substring(1, k.indexOf(','))) || vars.tr <= int(k.substring(k.indexOf(',') + 1, size(k) - 1))))
                   || (vars.tl >= vars.tr && vars.tl >= int(k.substring(1, k.indexOf(','))) && vars.tr <= int(k.substring(k.indexOf(',') + 1, size(k) - 1))))))
      - title: A range not contained in a local range has no neighbors
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:571-572
        if: "size(vars.known) == 0"
        then:
          - return: {neighbors: [], ranges: "= input.ranges"}
      - title: The replicas of the containing range (getRangeToAddressMap)
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:550
        call: token-metadata.get-write-endpoints
        input:
          keyspace: "= input.keyspace"
          token: "= int(vars.known[0].substring(vars.known[0].indexOf(',') + 1, size(vars.known[0]) - 1))"
        as: reps
      - title: The neighbors are the range's replicas other than this node
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:574-575
        set:
          vars.neighbors: "= vars.reps.value.natural.filter(e, e != input.coordinator)"
      - if: "size(input.hosts) > 0"
        then:
          - title: The current host must be part of the repair
            source: src/java/org/apache/cassandra/service/ActiveRepairService.java:598-599
            when: "!(input.coordinator in input.hosts)"
            fail: {code: illegal-argument-exception, message: The current host must be part of the repair}
          - set:
              vars.specified: "= input.hosts.filter(h, h == input.coordinator || h in vars.neighbors)"
          - title: Specified hosts must share the range
            source: src/java/org/apache/cassandra/service/ActiveRepairService.java:601-607
            when: "size(vars.specified) <= 1"
            fail: {code: illegal-argument-exception, message: "= 'Specified hosts ' + input.hosts.join(',') + ' do not share range ' + vars.t + ' needed for repair.'"}
          - set:
              vars.neighbors: "= vars.specified.filter(h, h != input.coordinator)"
      - return: {neighbors: "= vars.neighbors", ranges: "= input.ranges"}

  - component: active-repair-service
    name: prepare-for-repair
    kind: function
    summary: "ActiveRepairService.prepareForRepair: admission checks, register the parent session, PREPARE_MSG to every live participant, bounded by request_timeout."
    sources:
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:665-718
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:720-767
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:812-829
    request:
      type: object
      properties:
        parent_session: {type: string}
        coordinator: {type: string}
        endpoints: {type: array, items: {type: string}}
        option: RepairStreamingRepairOption
        force: {type: boolean}
        keyspace: {type: string}
        tables: {type: array, items: {type: string}}
        ranges: {type: array, items: {type: string}}
    response: {type: object, properties: {prepared: {type: array, items: {type: string}}}}
    errors:
      - {code: runtime-exception}
    behavior:
      - call: active-repair-service.verify-disk-headroom-threshold
        input: {replica: "= input.coordinator"}
        as: disk
      - title: Reject the repair when disk usage leaves too little headroom
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:667-668
        when: "!vars.disk.value.ok"
        fail: {code: runtime-exception, message: "Rejecting incoming repair, disk usage above threshold"}
      - call: active-repair-service.verify-compactions-pending-threshold
        input: {replica: "= input.coordinator"}
        as: comp
      - title: Reject the repair when pending compactions exceed reject_repair_compaction_threshold
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:670-671
        when: "!vars.comp.value.ok"
        fail: {code: runtime-exception, message: "Rejecting incoming repair, pending compactions above threshold"}
      - title: repairedAt is set only for global, non-forced incremental repairs
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:621-634
        set:
          vars.repairedAt: "= input.option.incremental && input.option.is_global && !input.force ? now : 0"
      - call: active-repair-service.register-parent-repair-session
        input:
          key: "= input.parent_session"
          row: {coordinator: "= input.coordinator", keyspace: "= input.keyspace", tables: "= input.tables", ranges: "= input.ranges", is_incremental: "= input.option.incremental", repaired_at: "= vars.repairedAt", is_global: "= input.option.is_global", preview_kind: "= input.option.preview_kind", has_snapshots: false}
      - call: active-repair-service.register-participate
        input: {key: "= input.parent_session", row: {status: ACCEPTED, coordinator: "= input.coordinator"}}
      - set:
          vars.live: []
      - foreach: "= input.endpoints"
        as: ep
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.ep"}
            as: fd
          - if: "vars.fd.value.alive"
            then:
              - set: {vars.live: "= vars.live + [vars.ep]"}
            else:
              - title: A dead participant
                detail: Forced full repairs skip it; otherwise the prepare fails at once with 'Endpoint not alive'.
                source: src/java/org/apache/cassandra/service/ActiveRepairService.java:686-703
                if: "input.force && !input.option.incremental"
                then:
                  - continue: true
                else:
                  - call: active-repair-service.remove-parent-repair-session
                    input: {key: "= input.parent_session", parent_session: "= input.parent_session"}
                  - fail: {code: runtime-exception, message: "= 'Endpoint not alive: ' + vars.ep"}
      - title: PREPARE_MSG to every live participant at once; the promise completes when all have answered, bounded by request_timeout
        detail: With repair retries disabled the PREPARE_MSG callback would expire only after repair_request_timeout, so the request_timeout timer on the promise decides ('Did not get replies from all endpoints.').
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:684-717
        parallel: "= vars.live"
        as: ep
        steps:
          - call: repair-message.send-message-with-retries
            input:
              verb: PREPARE_MSG
              endpoint: "= vars.ep"
              message:
                verb: PREPARE_MSG
                parent_session: "= input.parent_session"
                keyspace: "= input.keyspace"
                tables: "= input.tables"
                ranges: "= input.ranges"
                is_incremental: "= input.option.incremental"
                repaired_at: "= vars.repairedAt"
                is_global: "= input.option.is_global"
                preview_kind: "= input.option.preview_kind"
            timeout_ms: "= config['request-timeout-ms']"
            as: pr
            on_error:
              - return: {endpoint: "= vars.ep", ok: false, timeout: "= error.code == 'timeout'"}
          - return: {endpoint: "= vars.ep", ok: true, timeout: false}
        join: {need: all}
        as_result: prep
      - set:
          vars.answers: "= vars.prep.results.map(r, r.value)"
      - set:
          vars.failed: "= vars.answers.filter(x, !x.ok && !x.timeout).map(x, x.endpoint)"
          vars.prepared: "= vars.answers.filter(x, x.ok).map(x, x.endpoint)"
      - title: A participant that never answered fails the prepare when the request_timeout timer fires
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:706-715
        if: "vars.answers.exists(x, x.timeout)"
        then:
          - call: active-repair-service.remove-parent-repair-session
            input: {key: "= input.parent_session", parent_session: "= input.parent_session"}
          - fail: {code: runtime-exception, message: Did not get replies from all endpoints.}
      - title: Negative replies fail the prepare
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:750-764
        if: "size(vars.failed) > 0"
        then:
          - call: active-repair-service.remove-parent-repair-session
            input: {key: "= input.parent_session", parent_session: "= input.parent_session"}
          - fail: {code: runtime-exception, message: "= 'Got negative replies from endpoints [' + vars.failed.join(', ') + ']'"}
      - return: {prepared: "= vars.prepared"}

  - component: active-repair-service
    name: verify-disk-headroom-threshold
    kind: function
    summary: Refuses repair when disk usage + repair_disk_headroom_reject_ratio > 1 (ratio 0.0 by default, so never).
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:650-663]
    request: {type: object, properties: {replica: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    behavior:
      - set:
          vars.usage: "= state.disk_usage"
      - set:
          vars.ratio: "= config['repair-disk-headroom-reject-ratio']"
      - return: {ok: "= !(vars.usage == 0 || vars.ratio == 0 ? (vars.usage > 1 || vars.ratio > 1) : vars.usage + vars.ratio > 1.0)"}

  - component: active-repair-service
    name: verify-compactions-pending-threshold
    kind: function
    summary: Refuses repair when pending compactions exceed reject_repair_compaction_threshold (Integer.MAX_VALUE by default).
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:636-648]
    request: {type: object, properties: {replica: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    behavior:
      - call: compaction-manager.get-pending-tasks
        input: {}
        as: pending
      - return: {ok: "= !(vars.pending.value.pending_tasks > config['reject-repair-compaction-threshold'])"}

  - component: active-repair-service
    name: submit-repair-session
    kind: function
    summary: "ActiveRepairService.submitRepairSession: creates and starts a RepairSession for one common range; the session's failure becomes a failed range."
    sources:
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:440-482
      - src/java/org/apache/cassandra/repair/AbstractRepairTask.java:57-130
    request:
      type: object
      properties:
        parent_session: {type: string}
        session_id: {type: string}
        coordinator: {type: string}
        keyspace: {type: string}
        tables: {type: array, items: {type: string}}
        common_range: RepairStreamingCommonRange
        option: RepairStreamingRepairOption
        is_incremental: {type: boolean}
    response:
      type: object
      properties:
        has_failed: {type: boolean}
        first_error: {type: string}
        successful_ranges: {type: array, items: {type: string}}
        skipped_ranges: {type: array, items: {type: string}}
        failed_ranges: {type: array, items: {type: string}}
        results: {type: array, items: {type: object}}
    errors:
      - {code: illegal-argument-exception}
    behavior:
      - title: Paxos repair cannot run in a preview repair
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:454-455
        when: "input.option.repair_paxos && input.option.preview_kind != 'NONE'"
        fail: {code: illegal-argument-exception, message: cannot repair paxos in a preview repair}
      - title: No session for an empty endpoint set or no tables
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:457-461
        if: "size(input.common_range.endpoints) == 0 || size(input.tables) == 0"
        then:
          - return: {has_failed: false, first_error: "", successful_ranges: [], skipped_ranges: [], failed_ranges: [], results: []}
      - call: active-repair-service.sessions-put
        input: {key: "= input.session_id", row: {parent_session: "= input.parent_session", known: true}}
      - title: Start the RepairSession
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:463-480
        call: repair-session.start
        input:
          parent_session: "= input.parent_session"
          session_id: "= input.session_id"
          coordinator: "= input.coordinator"
          keyspace: "= input.keyspace"
          tables: "= input.tables"
          common_range: "= input.common_range"
          option: "= input.option"
          is_incremental: "= input.is_incremental"
        as: session
        on_error: continue
      - call: active-repair-service.sessions-remove
        input: {key: "= input.session_id"}
      - title: A failed session marks its ranges failed (FutureCombiner.successfulOf keeps a null result)
        detail: The RepairSessionCallback reports 'Repair session X for range Y failed with error Z' through notifyError, which becomes the command's first error.
        source: src/java/org/apache/cassandra/repair/AbstractRepairTask.java:123-129
        if: "!vars.session.ok"
        then:
          - set: {ctx.firstSessionError: "= 'Repair session ' + input.session_id + ' for range [' + input.common_range.ranges.join(', ') + '] failed with error ' + vars.session.error.message"}
          - return: {has_failed: true, first_error: "= ctx.firstSessionError", successful_ranges: [], skipped_ranges: [], failed_ranges: "= input.common_range.ranges", results: []}
      - title: Ranges with skipped (dead) replicas are not recorded as successful
        source: src/java/org/apache/cassandra/repair/CoordinatedRepairResult.java:65-80
        return:
          has_failed: false
          first_error: ""
          successful_ranges: "= input.common_range.has_skipped_replicas ? [] : input.common_range.ranges"
          skipped_ranges: "= input.common_range.has_skipped_replicas ? input.common_range.ranges : []"
          failed_ranges: []
          results: "= vars.session.value.repair_job_results"

  - component: active-repair-service
    name: handle-message
    kind: function
    summary: "ActiveRepairService.handleMessage: routes VALIDATION_RSP and SYNC_RSP to the running RepairSession; acks and drops them when the session is gone."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:900-938]
    request: RepairStreamingRepairMessage
    response: RepairStreamingRepairAck
    behavior:
      - call: active-repair-service.sessions-get
        input: {key: "= input.session_id"}
        as: s
      - title: Unknown session. Ack and drop (release any Merkle trees)
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:906-924
        if: "!vars.s.value.known"
        then:
          - set: {ctx.droppedRepairResponses: "= (has(ctx.droppedRepairResponses) ? ctx.droppedRepairResponses : 0) + 1"}
          - return: {ack: true, tree_response: {ok: false, endpoint: "= input.from", dropped: true}, sync_response: {success: false, dropped: true}}
      - if: "input.verb == 'VALIDATION_RSP'"
        then:
          - call: repair-session.validation-complete
            input: "= input"
            as: v
          - return: {ack: true, tree_response: "= vars.v.value"}
      - call: repair-session.sync-complete
        input: "= input"
        as: sc
      - return: {ack: true, sync_response: "= vars.sc.value"}

  - component: active-repair-service
    name: clean-up
    kind: function
    summary: "ActiveRepairService.cleanUp: CLEANUP_MSG to every live participant; failures are only logged."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:773-810]
    request:
      type: object
      properties:
        parent_session: {type: string}
        coordinator: {type: string}
        endpoints: {type: array, items: {type: string}}
    response: {type: object, properties: {}}
    behavior:
      - foreach: "= input.endpoints"
        as: ep
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.ep"}
            as: fd
          - when: "vars.fd.value.alive"
            title: CLEANUP_MSG (retried without a version check)
            source: src/java/org/apache/cassandra/service/ActiveRepairService.java:781-799
            emit: repair-message.send-message-with-retries
            input:
              verb: CLEANUP_MSG
              endpoint: "= vars.ep"
              message: {verb: CLEANUP_MSG, from: "= input.coordinator", parent_session: "= input.parent_session"}

  - component: active-repair-service
    name: remove-parent-repair-session
    kind: function
    summary: "ActiveRepairService.removeParentRepairSession: drops the parent session and, if repair snapshots were taken, clears them on the snapshot executor."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:874-898]
    request:
      type: object
      properties:
        key: {type: string}
        replica: {type: string}
        parent_session: {type: string}
    response: {type: object, properties: {}}
    behavior:
      - call: active-repair-service.parent-repair-sessions-remove
        input: {key: "= input.key"}
        as: removed
      - title: Clear the ephemeral repair snapshots named after the parent session
        source: src/java/org/apache/cassandra/service/ActiveRepairService.java:881-896
        if: "vars.removed.value != null && vars.removed.value.has_snapshots"
        then:
          - foreach: "= vars.removed.value.tables"
            as: t
            steps:
              - emit: column-family-store.clear-snapshot
                input: {replica: "= self", keyspace: "= vars.removed.value.keyspace", table: "= vars.t", tag: "= input.parent_session"}

  - component: active-repair-service
    name: register-parent-repair-session
    kind: store
    summary: "registerParentRepairSession: puts a ParentRepairSession in parentRepairSessions (keyed replica:parent_session in the model)."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:831-845]
    request: {type: object, properties: {key: {type: string}, row: {type: object}}}
    store: {table: parent_repair_sessions, op: put, key: "= input.key", value: "= input.row"}
  - component: active-repair-service
    name: get-parent-repair-session
    kind: store
    summary: "getParentRepairSession: throws NoSuchRepairSessionException when the session was removed (failed or aborted)."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:856-862]
    request: {type: object, properties: {key: {type: string}}}
    errors:
      - {code: no-such-repair-session-exception}
    store: {table: parent_repair_sessions, op: get, key: "= input.key", not_found: no-such-repair-session-exception}
  - component: active-repair-service
    name: mark-parent-repair-session-snapshotted
    kind: store
    summary: "ParentRepairSession.setHasSnapshots: records that repair snapshots exist so removal clears them."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:1014-1018]
    request: {type: object, properties: {key: {type: string}}}
    errors:
      - {code: no-such-repair-session-exception}
    store: {table: parent_repair_sessions, op: update, key: "= input.key", value: {has_snapshots: true}, not_found: no-such-repair-session-exception}
  - component: active-repair-service
    name: parent-repair-sessions-remove
    kind: store
    summary: The parentRepairSessions.remove step of removeParentRepairSession.
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:876]
    request: {type: object, properties: {key: {type: string}}}
    store: {table: parent_repair_sessions, op: delete, key: "= input.key"}
  - component: active-repair-service
    name: register-participate
    kind: store
    summary: "register(ParticipateState): the participant's record of a repair it accepted (repair state cache)."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:1207-1217]
    request: {type: object, properties: {key: {type: string}, row: {type: object}}}
    store: {table: participates, op: put, key: "= input.key", value: "= input.row"}
  - component: active-repair-service
    name: participate
    kind: store
    summary: "participate(id): the ParticipateState, or none (status NONE in the model)."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:1224-1227]
    request: {type: object, properties: {key: {type: string}}}
    store: {table: participates, op: get, key: "= input.key", default: {status: NONE}}
  - component: active-repair-service
    name: record-repair-status
    kind: store
    summary: "recordRepairStatus: the parent repair status by command number (IN_PROGRESS, COMPLETED, FAILED), read by getParentRepairStatus."
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:525-530]
    request: {type: object, properties: {cmd: {type: integer}, status: {type: string}, messages: {type: array, items: {type: string}}}}
    store: {table: repair_status, op: put, key: "= string(input.cmd)", value: {status: "= input.status", messages: "= input.messages"}}
  - component: active-repair-service
    name: sessions-put
    kind: store
    summary: The sessions.put of submitRepairSession (running RepairSessions by session id).
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:466]
    request: {type: object, properties: {key: {type: string}, row: {type: object}}}
    store: {table: sessions, op: put, key: "= input.key", value: "= input.row"}
  - component: active-repair-service
    name: sessions-get
    kind: store
    summary: The sessions.get of handleMessage.
    sources: [src/java/org/apache/cassandra/service/ActiveRepairService.java:904]
    request: {type: object, properties: {key: {type: string}}}
    store: {table: sessions, op: get, key: "= input.key", default: {known: false}}
