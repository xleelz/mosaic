  expect:
  - "ctx.repairOutcome == 'failed'"
  - "ctx.repairFailure == 'Got negative replies from endpoints [n2]'"
  - "state['active-repair-service@n2'].participates['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].status == 'FAILED'"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 0"
- id: rs-full-repair-table-dropped
  flow: rs-nodetool-repair-full
  name: The table was dropped on the replicas
  description: PREPARE_MSG checks every table id still exists; both replicas answer with a failure response.
  fixtures:
  - three-node-rf3
  state:
    repair-message-verb-handler:
