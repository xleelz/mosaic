  expect:
  - "ctx.repairOutcome == 'completed'"
  - retries == 1
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 4"
  - "duration_ms >= 10000 && duration_ms < 120000"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'COMPLETED'"
- id: rs-sequential-repair-snapshots
  flow: rs-nodetool-repair-full
  name: Sequential repair snapshots every replica first
  description: Non-parallel full repair sends SNAPSHOT_MSG to all three nodes; the ephemeral snapshots named after the parent session are cleared when each node drops its parent session.
  fixtures:
  - three-node-rf3
  input:
    options:
      parallelism: sequential
  expect:
  - "ctx.repairOutcome == 'completed'"
  - "calls['repair-message-verb-handler.do-verb-snapshot-msg'] == 3"
  - "calls['column-family-store.snapshot'] == 3"
  - "calls['column-family-store.clear-snapshot'] == 3"
  - "size(state['snapshot-manager@n1'].snapshots) == 0"
- id: rs-sequential-validation-stops-at-failure
  flow: rs-nodetool-repair-full
  name: Sequential validation stops at the first failed tree
  description: "In sequential mode the next VALIDATION_REQ is sent only when the previous tree arrives, so one failure stops the rest."
  fixtures:
  - three-node-rf3
  input:
    options:
      parallelism: sequential
  faults:
  - target: cassandra-table-repair-manager.get-validation-iterator
