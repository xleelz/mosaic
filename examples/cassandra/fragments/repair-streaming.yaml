  - "ctx.repairFailure.contains('failed with error Validation failed in n2')"
  - "calls['repair-message-verb-handler.do-verb-validation-req'] == 3"
  - "calls['validator.fail'] == 1"
  - "calls['repair-message-verb-handler.do-verb-failed-session-msg'] == 2"
  - "calls['stream-plan.execute'] == 0"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'FAILED'"
- id: rs-full-repair-validation-request-timeout
  flow: rs-nodetool-repair-full
  name: VALIDATION_REQ times out
  description: With retries disabled the callback expires after repair_request_timeout (120s) and the RepairException fails the session.
  fixtures:
  - three-node-rf3
  faults:
  - target: repair-message-verb-handler.do-verb-validation-req
    type: timeout
    instance: n2
  expect:
  - "ctx.repairOutcome == 'failed'"
  - "ctx.repairFailure.contains('Got VALIDATION_REQ failure from n2: TIMEOUT')"
  - "retries == 0 && duration_ms >= 120000"
  - "state['active-repair-service@n1'].repair_status['1'].status == 'FAILED'"
  - duration_ms < 125000
- id: rs-full-repair-retries-enabled
  flow: rs-nodetool-repair-full
  name: With repair.retries enabled a timed-out VALIDATION_REQ is retried
  description: "Not the deployed config. Each attempt waits request_timeout (10s), then backs off and retries."
  fixtures:
  - three-node-rf3
  config:
    repair-retries-max-attempts: 10
  faults:
  - target: repair-message-verb-handler.do-verb-validation-req
    type: timeout
    instance: n2
    calls:
