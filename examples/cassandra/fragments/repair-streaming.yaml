- id: rs-incremental-repair-in-sync
  flow: rs-nodetool-repair-incremental
  name: "Incremental repair, replicas agree"
  description: "PREPARE_CONSISTENT_REQ to all three nodes (this node too), anticompaction on each, validation without snapshots, then FINALIZE_PROPOSE and FINALIZE_COMMIT; every local session ends FINALIZED."
  fixtures:
  - three-node-rf3
  expect:
  - "ctx.repairOutcome == 'completed'"
  - "state['coordinator-sessions@n1'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FINALIZED'"
  - "calls['repair-message-verb-handler.do-verb-prepare-consistent-req'] == 3 && calls['repair-message-verb-handler.do-verb-prepare-consistent-rsp'] == 3"
  - "calls['pending-anti-compaction.run'] == 3"
  - "calls['repair-message-verb-handler.do-verb-snapshot-msg'] == 0"
  - "calls['repair-message-verb-handler.do-verb-finalize-propose-msg'] == 3 && calls['repair-message-verb-handler.do-verb-finalize-promise-msg'] == 3"
  - "calls['repair-message-verb-handler.do-verb-finalize-commit-msg'] == 3"
  - "state['local-sessions@n1'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FINALIZED'"
  - "state['local-sessions@n2'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FINALIZED'"
  - "state['local-sessions@n3'].sessions['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].state == 'FINALIZED'"
- id: rs-incremental-repair-anticompaction-conflict
  flow: rs-nodetool-repair-incremental
  name: n3 still holds SSTables of an unfinished incremental session
  description: "Its PendingAntiCompaction fails, it replies PREPARE_CONSISTENT_RSP false, the coordinator sends FAILED_SESSION_MSG to the others and the repair fails before validation."
  fixtures:
