  - "state['cassandra-table-repair-manager@n3'].digests['ks1.users'] == '9f86d081'"
- id: rs-prepare-then-validate-on-replica
  flow: rs-repair-verb-received
  name: "PREPARE_MSG, then VALIDATION_REQ on the same replica is accepted"
  description: The participate state and parent session that PREPARE_MSG registered on n2 let the later VALIDATION_REQ through (without it the replica answers Unknown repair).
  fixtures: *id001
  steps:
  - flow: rs-repair-verb-received
    as: prep
    'on': n2
    input:
      verb: PREPARE_MSG
      tables:
      - users
      is_incremental: false
      is_global: true
      repaired_at: 0
  - flow: rs-repair-verb-received
    as: val
    'on': n2
  - interface: active-repair-service.get-parent-repair-session
    caller: operator
    'on': n2
    input:
      key: 6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21
    as: prs
  expect:
  - "steps.prep.result.value.ack && steps.val.result.value.ack"
  - "calls['validation-manager.submit-validation'] == 1"
  - "state['active-repair-service@n2'].participates['6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21'].status == 'ACCEPTED'"
  - "steps.prs.result.value.coordinator == 'n1'"
