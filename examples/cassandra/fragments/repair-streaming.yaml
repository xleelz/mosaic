# repair-streaming fragment of the Cassandra 5.0.9 ontology (built from code).
# Owns repair/**, streaming/**, db/streaming/**, db/repair/** (by function),
# service/ActiveRepairService.java, service/AutoRepairService.java,
# service/snapshot/**, service/SnapshotVerbHandler.java and the repair and
# snapshot methods of StorageService and ColumnFamilyStore (by function).
# The node we follow is n1; replicas are n2 and n3 (3 nodes,
# RF 3, SimpleSnitch datacenter1). See notes/repair-streaming.md.
schema_version: 1
id: cassandra

configs:
  - {id: request-timeout-ms, type: integer, value: 10000, default: 10000, summary: "request_timeout: the default internode request timeout (bounds the repair prepare phase, and each repair message attempt when retries are on).", sources: [conf/cassandra.yaml:1349, src/java/org/apache/cassandra/config/Config.java:142], attributes: {boundary: true}}
  - {id: repair-request-timeout-ms, type: integer, value: 120000, default: 120000, summary: "repair_request_timeout: callback expiry of repair verbs when repair retries are disabled (not set in cassandra.yaml).", sources: [src/java/org/apache/cassandra/config/Config.java:163, src/java/org/apache/cassandra/net/Verb.java:484-488]}
  - {id: repair-retries-max-attempts, type: integer, value: 0, default: 0, summary: "repair.retries.max_attempts: 0 means retries are DISABLED (the yaml block is commented out; RetrySpec.DEFAULT_MAX_ATTEMPTS = DISABLED).", sources: [conf/cassandra.yaml:863-872, src/java/org/apache/cassandra/config/RetrySpec.java:98]}
  - {id: reject-repair-compaction-threshold, type: integer, value: 2147483647, default: 2147483647, summary: "reject_repair_compaction_threshold: refuse repair prepare and repair streams above this many pending compactions (commented out; Integer.MAX_VALUE).", sources: [conf/cassandra.yaml:2325, src/java/org/apache/cassandra/config/Config.java:347]}
  - {id: repair-disk-headroom-reject-ratio, type: number, value: 0.0, default: 0.0, summary: "repair_disk_headroom_reject_ratio: refuse repair when disk usage + ratio > 1 (commented out; 0.0 disables it).", sources: [conf/cassandra.yaml:2331, src/java/org/apache/cassandra/config/Config.java:352]}
  - {id: paxos-variant, type: string, value: v1, default: v1, summary: "paxos_variant: v1 deployed (commented out), so repairPaxos is a no-op in RepairJob.", sources: [conf/cassandra.yaml:1602, src/java/org/apache/cassandra/config/Config.java:1051], attributes: {boundary: true}}
  - {id: paxos-repair-enabled, type: boolean, value: true, default: true, summary: "paxos_repair_enabled (not set in cassandra.yaml).", sources: [src/java/org/apache/cassandra/config/Config.java:1100], attributes: {boundary: true}}
  - {id: streaming-keep-alive-period-ms, type: integer, value: 300000, default: 300000, summary: "streaming_keep_alive_period 300s (commented out in cassandra.yaml).", sources: [conf/cassandra.yaml:1419, src/java/org/apache/cassandra/config/Config.java:167]}
  - {id: stream-transfer-task-timeout-ms, type: integer, value: 43200000, default: 43200000, summary: "stream_transfer_task_timeout 12h: an unacknowledged outgoing file times the session out (not set in cassandra.yaml).", sources: [src/java/org/apache/cassandra/config/Config.java:175]}
  - {id: skip-stream-disk-space-check, type: boolean, value: false, default: false, summary: "skip_stream_disk_space_check (not set in cassandra.yaml).", sources: [src/java/org/apache/cassandra/config/Config.java:701]}
  - {id: cdc-on-repair-enabled, type: boolean, value: true, default: true, summary: "cdc_on_repair_enabled (commented out): CDC tables replay streamed data through the commit log.", sources: [conf/cassandra.yaml:425, src/java/org/apache/cassandra/config/Config.java:416]}
  - {id: materialized-views-on-repair-enabled, type: boolean, value: true, default: true, summary: "materialized_views_on_repair_enabled (commented out): tables with views replay streamed data through the write path.", sources: [conf/cassandra.yaml:1988, src/java/org/apache/cassandra/config/Config.java:600]}
  - {id: auto-repair-enabled, type: boolean, value: false, default: false, summary: "auto_repair.enabled (the auto_repair block is commented out; AutoRepairConfig() is disabled).", sources: [conf/cassandra.yaml:2342, src/java/org/apache/cassandra/repair/autorepair/AutoRepairConfig.java:125-133]}
  - {id: autorepair-jvm-enable, type: boolean, value: false, default: false, summary: "-Dcassandra.autorepair.enable (system property, default false); auto repair also needs it.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:62]}
  - {id: auto-repair-check-interval-ms, type: integer, value: 300000, default: 300000, summary: "auto_repair.repair_check_interval 5m.", sources: [conf/cassandra.yaml:2342, src/java/org/apache/cassandra/repair/autorepair/AutoRepairConfig.java:55]}
  - {id: snapshot-min-allowed-ttl-s, type: integer, value: 60, default: 60, summary: "-Dcassandra.snapshot.min_allowed_ttl_seconds.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:513]}
  - {id: snapshot-cleanup-initial-delay-ms, type: integer, value: 5000, default: 5000, summary: "-Dcassandra.snapshot.ttl_cleanup_initial_delay_seconds 5.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:509]}
  - {id: snapshot-cleanup-period-ms, type: integer, value: 60000, default: 60000, summary: "-Dcassandra.snapshot.ttl_cleanup_period_seconds 60.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:511]}
  - {id: repair-cleanup-interval-ms, type: integer, value: 600000, default: 600000, summary: "-Dcassandra.repair_cleanup_interval_seconds 600: LocalSessions.cleanup period.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:407]}
  - {id: repair-fail-timeout-s, type: integer, value: 86400, default: 86400, summary: "-Dcassandra.repair_fail_timeout_seconds: an idle local session is failed after a day.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:409]}
  - {id: repair-delete-timeout-s, type: integer, value: 86400, default: 86400, summary: "-Dcassandra.repair_delete_timeout_seconds: a completed local session is deleted after a day.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:408]}
  - {id: repair-status-check-timeout-s, type: integer, value: 3600, default: 3600, summary: "-Dcassandra.repair_status_check_timeout_seconds: an idle session asks its peers for the outcome after an hour.", sources: [src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:411]}

components:
  # ---------------------------------------------------------------- boundary stubs (other owners)
  - id: storage-service
    name: StorageService
    kind: module
    parent: membership
    sources: [src/java/org/apache/cassandra/service/StorageService.java]
    summary: Node lifecycle and the StorageServiceMBean surface. Membership owns it; repair-streaming owns its repair and snapshot operations.
    attributes: {boundary: true, owner: membership}
  - id: gossiper
    name: Gossiper
    kind: module
    parent: membership
    sources: [src/java/org/apache/cassandra/gms/Gossiper.java]
    summary: Gossip and the endpoint state map that liveness is read from (scenarios seed endpoint_state_map for the merged model).
    attributes: {boundary: true, owner: membership}
  - id: token-metadata
    name: TokenMetadata
    kind: module
    parent: membership
    sources: [src/java/org/apache/cassandra/locator/TokenMetadata.java]
    summary: The token ring, natural and pending replicas.
    attributes: {boundary: true, owner: membership}
  - id: failure-detector
    name: FailureDetector
    kind: module
    parent: membership
    sources: [src/java/org/apache/cassandra/gms/FailureDetector.java]
    summary: Phi-accrual failure detector; the view of endpoint liveness.
    attributes: {boundary: true, owner: membership}
  - id: column-family-store
    name: ColumnFamilyStore
    kind: module
    parent: write-path
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java]
    summary: One table's memtables and SSTables. Write-path owns flush and truncate; repair-streaming owns snapshot and clearSnapshot.
    attributes: {boundary: true, owner: write-path}
  - id: keyspace
    name: Keyspace
    kind: module
    parent: write-path
    sources: [src/java/org/apache/cassandra/db/Keyspace.java]
    summary: A keyspace's tables and its local mutation apply path.
    attributes: {boundary: true, owner: write-path}
  - id: compaction-manager
    name: CompactionManager
    kind: module
    parent: read-path
    sources: [src/java/org/apache/cassandra/db/compaction/CompactionManager.java]
    summary: Compaction executors, including the validation executor used by repair.
    attributes: {boundary: true, owner: read-path}
  - id: paxos-cleanup
    name: PaxosCleanup
    kind: function
    parent: paxos
    sources: [src/java/org/apache/cassandra/service/paxos/cleanup/PaxosCleanup.java]
    summary: Paxos repair (cleanup of uncommitted Paxos state) run before data repair.
    attributes: {boundary: true, owner: paxos}
  - id: diagnostic-snapshot-service
    name: DiagnosticSnapshotService
    kind: module
    parent: node-ops
    sources: [src/java/org/apache/cassandra/utils/DiagnosticSnapshotService.java]
    summary: Rate-limited diagnostic snapshots on repaired-data mismatch or duplicate rows.
    attributes: {boundary: true, owner: ops}

  # ---------------------------------------------------------------- repair: coordinator side
  - id: repair-option
    name: RepairOption
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/messages/RepairOption.java:174-276]
    summary: Parses the JMX repair spec (Map<String,String>) and refuses invalid combinations.
  - id: repair-coordinator
    name: RepairCoordinator
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/RepairCoordinator.java:94-653]
    summary: One repair command (repair:N). Computes neighbors, prepares participants, runs the repair task and records the parent status.
    state:
      initial:
        schema_tables: {}
  - id: active-repair-service
    name: ActiveRepairService
    kind: module
    parent: repair-streaming
    sources:
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:145-270
      - src/java/org/apache/cassandra/service/ActiveRepairService.java:947-1020
    summary: Per-node repair registry. Parent repair sessions, participate states, running RepairSessions, the prepare phase, cleanup and admission thresholds.
    state:
      initial:
        disk_usage: 0.0
        parent_repair_sessions: {}
        participates: {}
        sessions: {}
        repair_status: {}
  - id: normal-repair-task
    name: NormalRepairTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/NormalRepairTask.java:26-54]
    summary: Full (non-incremental, non-preview) repair. Submits one RepairSession per common range.
  - id: incremental-repair-task
    name: IncrementalRepairTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/IncrementalRepairTask.java:31-70]
    summary: Incremental repair. Wraps the repair sessions in a consistent CoordinatorSession (prepare, repair, finalize).
  - id: preview-repair-task
    name: PreviewRepairTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/PreviewRepairTask.java:41-177]
    summary: Preview repair. Runs validation and stream planning without transferring data, then reports whether replicas are in sync.
  - id: repair-session
    name: RepairSession
    kind: module
    parent: repair-streaming
    sources:
      - src/java/org/apache/cassandra/repair/RepairSession.java:109-402
      - src/java/org/apache/cassandra/repair/RepairSession.java:467-494
    summary: Repairs one common range across its endpoints, one RepairJob per table. Fails when a neighbor is dead or convicted.
  - id: repair-job
    name: RepairJob
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/RepairJob.java:67-614]
    summary: Repairs one table. Optional Paxos repair, snapshots for sequential repair, Merkle tree validation, then sync tasks.
  - id: snapshot-task
    name: SnapshotTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/SnapshotTask.java:36-89]
    summary: Asks one endpoint to snapshot the table before a sequential or DC-parallel validation.
  - id: validation-task
    name: ValidationTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/ValidationTask.java:37-116]
    summary: Requests a Merkle tree from one endpoint and completes when the tree arrives.
  - id: local-sync-task
    name: LocalSyncTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/LocalSyncTask.java:51-206]
    summary: Sync between the coordinator and one replica. Streams directly from this node.
  - id: symmetric-remote-sync-task
    name: SymmetricRemoteSyncTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/SymmetricRemoteSyncTask.java:41-83]
    summary: Sync between two remote replicas. Forwards a SYNC_REQ to one of them and waits for SYNC_RSP.
  - id: coordinator-sessions
    name: CoordinatorSessions
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSessions.java:46-138]
    summary: Registry of incremental-repair coordinator sessions on the coordinating node.
    state:
      initial:
        sessions: {}
  - id: coordinator-session
    name: CoordinatorSession
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/consistent/CoordinatorSession.java:66-388]
    summary: The coordinator side of a consistent (incremental) repair. Prepare, repair, finalize propose and commit, or fail.
  - id: repair-message
    name: RepairMessage
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/messages/RepairMessage.java:60-312]
    summary: Sends repair verbs with the configured retry policy. Retries are disabled in the deployed config.
  # ---------------------------------------------------------------- repair: participant side
  - id: repair-message-verb-handler
    name: RepairMessageVerbHandler
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/RepairMessageVerbHandler.java:60-466]
    summary: Handles every repair verb on the receiving node (PREPARE_MSG through STATUS_RSP).
    state:
      initial:
        dropped_tables: []
  - id: validation-manager
    name: ValidationManager
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/ValidationManager.java:46-214]
    summary: Runs a validation compaction (read-only scan) and builds Merkle trees sized to repair_session_space.
  - id: validator
    name: Validator
    kind: function
    parent: repair-streaming
    sources:
      - src/java/org/apache/cassandra/repair/Validator.java:61-309
      - src/java/org/apache/cassandra/repair/Validator.java:236
      - src/java/org/apache/cassandra/repair/Validator.java:295-307
    summary: Hashes partitions into the Merkle trees and sends the result (or an empty failure response) to the initiator.
  - id: cassandra-table-repair-manager
    name: CassandraTableRepairManager
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/db/repair/CassandraTableRepairManager.java:42-102]
    summary: Table-level repair hooks. The validation iterator over the local data, and ephemeral repair snapshots.
    description: >-
      digests stands in for this replica's data of each table (keyed keyspace.table, seeded by the
      base-schema fixture): a '+'-joined, sorted set of data versions. Validation reads it as the
      Merkle root; streamed data merges into it, so a second repair finds the replicas in sync.
    state:
      initial:
        digests: {}
  - id: streaming-repair-task
    name: StreamingRepairTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/StreamingRepairTask.java:53-135]
    summary: On a replica that received SYNC_REQ, streams the differing ranges with the other replica and replies SYNC_RSP.
  - id: local-sessions
    name: LocalSessions
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/repair/consistent/LocalSessions.java:122-1184]
    summary: The participant side of incremental repair. Local session state machine, persisted in system.repairs, with periodic cleanup.
    state:
      initial:
        sessions: {}
  - id: pending-anti-compaction
    name: PendingAntiCompaction
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/db/repair/PendingAntiCompaction.java:68-390]
    summary: Isolates the unrepaired SSTables of an incremental session (marks them pending repair), refusing conflicting sessions.
    state:
      initial:
        conflicting_session: ""
  # ---------------------------------------------------------------- streaming
  - id: stream-plan
    name: StreamPlan
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamPlan.java:39-228]
    summary: Builder for a streaming operation (repair, bootstrap, rebuild...). Requests and transfers ranges per peer, then executes.
  - id: stream-result-future
    name: StreamResultFuture
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamResultFuture.java:53-280]
    summary: The future of a stream plan. Completes when every session finishes and fails with StreamException if any session failed.
  - id: stream-coordinator
    name: StreamCoordinator
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamCoordinator.java:41-360]
    summary: Holds the stream sessions of a plan, per peer, and connects them (all at once, or sequentially).
  - id: stream-session
    name: StreamSession
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamSession.java:163-1444]
    summary: Streaming with one peer. Init, prepare (SYN, SYNACK, ACK), file streaming, completion or failure.
    state:
      initial:
        disk_full: false
  - id: stream-transfer-task
    name: StreamTransferTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamTransferTask.java:45-204]
    summary: Outgoing files of one table in a session. Completes when every file is acknowledged (ReceivedMessage).
  - id: stream-receive-task
    name: StreamReceiveTask
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamReceiveTask.java:39-173]
    summary: Incoming files of one table. When all have arrived, hands them to the receiver on a completion executor.
  - id: cassandra-stream-receiver
    name: CassandraStreamReceiver
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/db/streaming/CassandraStreamReceiver.java:59-302]
    summary: Adds received SSTables to the table, or replays them through the write path for CDC and materialized-view tables.
    state:
      initial:
        cdc_tables: []
        tables_with_views: []
  - id: cassandra-stream-manager
    name: CassandraStreamManager
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/db/streaming/CassandraStreamManager.java:66-168]
    summary: Selects the SSTable sections to stream for a set of ranges (all, pending-repair only, or preview predicate).
    state:
      initial:
        sstables: {}
  - id: stream-manager
    name: StreamManager
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamManager.java:55-483]
    tags: [incidental]
    summary: Registry of initiated and followed streams on this node (JMX StreamManagerMBean, streaming virtual table).
    state:
      initial:
        streams: {}
  - id: streaming-multiplexed-channel
    name: StreamingMultiplexedChannel
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/async/StreamingMultiplexedChannel.java:90-530]
    tags: [incidental]
    summary: Control and file channels of a stream session, with the keep-alive task.
    state:
      initial:
        connected: true
        closed: false
        keep_alives_sent: 0
  - id: stream-manager-stream-rate-limiter
    name: StreamManager.StreamRateLimiter
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/StreamManager.java:97-215]
    tags: [incidental]
    summary: Global outbound streaming throttles (stream_throughput_outbound 24MiB/s and the inter-DC and entire-SSTable variants; 0 disables).
    state:
      initial:
        rate_updates: 0
  - id: replication-done-verb-handler
    name: ReplicationDoneVerbHandler
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/streaming/ReplicationDoneVerbHandler.java:28-40]
    summary: Receives REPLICATION_DONE_REQ after removenode re-replication and confirms it to StorageService.
  # ---------------------------------------------------------------- snapshots
  - id: snapshot-verb-handler
    name: SnapshotVerbHandler
    kind: function
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/service/SnapshotVerbHandler.java:37-64]
    summary: Handles SNAPSHOT_REQ (take, clear, or diagnostic snapshot) from another node.
  - id: snapshot-manager
    name: SnapshotManager
    kind: module
    parent: repair-streaming
    sources: [src/java/org/apache/cassandra/service/snapshot/SnapshotManager.java:48-172]
    summary: Tracks snapshots on disk and removes expiring (TTL) snapshots periodically.
    state:
      initial:
        snapshots: {}
        schema_tables: {}
  # ---------------------------------------------------------------- auto repair
  - id: auto-repair
    name: AutoRepair
    kind: module
    parent: repair-streaming
    sources:
      - src/java/org/apache/cassandra/repair/autorepair/AutoRepair.java:75-629
      - src/java/org/apache/cassandra/service/AutoRepairService.java
    summary: Optional built-in repair scheduler. Disabled unless -Dcassandra.autorepair.enable=true and auto_repair.enabled.
    state:
      initial:
        ignore_dcs: []
        local_dc: datacenter1
        keyspaces: []

schemas:
  - id: RepairStreamingRepairSpec
    summary: The JMX repair spec map (Map<String,String>) built by nodetool repair (tools/nodetool/Repair.java createOptions).
    schema:
      type: object
      properties:
        parallelism: {type: string, enum: [sequential, parallel, dc_parallel], examples: [parallel]}
        primaryRange: {type: string, examples: ["false"]}
        incremental: {type: string, examples: ["false"]}
        jobThreads: {type: string, examples: ["1"]}
        trace: {type: string, examples: ["false"]}
        columnFamilies: {type: string, examples: [""]}
        pullRepair: {type: string, examples: ["false"]}
        forceRepair: {type: string, examples: ["false"]}
        previewKind: {type: string, enum: [NONE, ALL, REPAIRED, UNREPAIRED], examples: [NONE]}
        optimiseStreams: {type: string, examples: ["false"]}
        ignoreUnreplicatedKeyspaces: {type: string, examples: ["false"]}
        repairPaxos: {type: string, examples: ["true"]}
        paxosOnly: {type: string, examples: ["false"]}
        ranges: {type: string, examples: [""]}
        dataCenters: {type: string, examples: [""]}
        hosts: {type: string, examples: [""]}
  - id: RepairStreamingRepairOption
    summary: A parsed RepairOption.
    schema:
      type: object
      properties:
        parallelism: {type: string, enum: [sequential, parallel, dc_parallel]}
        primary_range: {type: boolean}
        incremental: {type: boolean}
        preview_kind: {type: string, enum: [NONE, ALL, REPAIRED, UNREPAIRED]}
        trace: {type: boolean}
        force: {type: boolean}
        pull_repair: {type: boolean}
        ignore_unreplicated_keyspaces: {type: boolean}
        repair_paxos: {type: boolean}
        paxos_only: {type: boolean}
        optimise_streams: {type: boolean}
        job_threads: {type: integer}
        ranges: {type: array, items: {type: string}}
        column_families: {type: array, items: {type: string}}
        data_centers: {type: array, items: {type: string}}
        hosts: {type: array, items: {type: string}}
        is_global: {type: boolean}
  - id: RepairStreamingCommonRange
    summary: CommonRange. The endpoints (neighbors, not the coordinator) sharing a set of ranges.
    schema:
      type: object
      properties:
        endpoints: {type: array, items: {type: string}, examples: [["n2", "n3"]]}
        trans_endpoints: {type: array, items: {type: string}, examples: [[]]}
        ranges: {type: array, items: {type: string}}
        has_skipped_replicas: {type: boolean, default: false}
  - id: RepairStreamingRepairMessage
    summary: A repair verb payload (RepairJobDesc plus the per-verb fields of PrepareMessage, ValidationRequest/Response, SyncRequest/Response, PrepareConsistentRequest/Response, FinalizePropose/Promise/Commit, FailSession, CleanupMessage, StatusRequest/Response).
    schema:
      type: object
      properties:
        verb: {type: string, enum: [PREPARE_MSG, SNAPSHOT_MSG, VALIDATION_REQ, VALIDATION_RSP, SYNC_REQ, SYNC_RSP, CLEANUP_MSG, PREPARE_CONSISTENT_REQ, PREPARE_CONSISTENT_RSP, FINALIZE_PROPOSE_MSG, FINALIZE_PROMISE_MSG, FINALIZE_COMMIT_MSG, FAILED_SESSION_MSG, STATUS_REQ, STATUS_RSP]}
        from: {type: string, examples: ["n1"]}
        parent_session: {type: string, examples: ["6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a21"]}
        session_id: {type: string, examples: ["7a11c3d0-9d3c-11ef-a8d2-5b1c0e7f4a21"]}
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        tables: {type: array, items: {type: string}}
        ranges: {type: array, items: {type: string}}
        is_incremental: {type: boolean}
        is_global: {type: boolean}
        repaired_at: {type: integer}
        preview_kind: {type: string}
        now_in_sec: {type: integer}
        initiator: {type: string}
        src: {type: string}
        dst: {type: string}
        asymmetric: {type: boolean}
        success: {type: boolean}
        ok: {type: boolean}
        digest: {type: string}
        coordinator: {type: string}
        participants: {type: array, items: {type: string}}
        participant: {type: string}
        promised: {type: boolean}
        state: {type: string}
  - id: RepairStreamingRepairAck
    summary: What the sender observes for a repair verb. ack=true is the empty REPAIR_RSP; ack=false is a failure response (RequestFailureReason.UNKNOWN). The *_response fields carry the separate reply message (VALIDATION_RSP, SYNC_RSP, PREPARE_CONSISTENT_RSP, FINALIZE_PROMISE_MSG, STATUS_RSP) back through the simulated call chain.
    schema:
      type: object
      properties:
        ack: {type: boolean, default: true}
        reason: {type: string}
        tree_response: {type: object}
        sync_response: {type: object}
        prepare_response: {type: object}
        promise: {type: object}
        status_response: {type: object}
  - id: RepairStreamingStreamPlan
    summary: "A StreamPlan: requestRanges(from, keyspace, ranges, tables) and transferRanges(to, keyspace, ranges, tables), one session per peer. requests/transfers carry {peer, ranges}; an empty tables list means every table of the keyspace. The single-peer fields (peer, peers, ranges, table, request_ranges, transfer_ranges) are still accepted."
    schema:
      type: object
      properties:
        plan_id: {type: string, examples: ["9c4e2a10-9d3c-11ef-a8d2-5b1c0e7f4a21"]}
        operation: {type: string, enum: [REPAIR, BOOTSTRAP, REBUILD, RESTORE_REPLICA_COUNT, UNBOOTSTRAP, RELOCATION, BULK_LOAD], examples: [BOOTSTRAP]}
        keyspace: {type: string, examples: [ks1]}
        tables: {type: array, items: {type: string}, examples: [[users]]}
        requests: {type: array, items: {type: object, properties: {peer: {type: string}, ranges: {type: array, items: {type: string}}}}, examples: [[{peer: n2, ranges: ["(-6148914691236517206,0]"]}]]}
        transfers: {type: array, items: {type: object, properties: {peer: {type: string}, ranges: {type: array, items: {type: string}}}}, examples: [[]]}
        pending_repair: {type: string, default: ""}
        preview_kind: {type: string, default: NONE}
        flush_before_transfer: {type: boolean, default: true}
        peer: {type: string}
        peers: {type: array, items: {type: string}}
        ranges: {type: array, items: {type: string}}
        table: {type: string}
        request_ranges: {type: boolean}
        transfer_ranges: {type: boolean}
  - id: RepairStreamingStreamSession
    summary: One StreamSession with a peer, from the initiator's side.
    schema:
      type: object
      properties:
        plan_id: {type: string}
        operation: {type: string}
        peer: {type: string}
        keyspace: {type: string}
        tables: {type: array, items: {type: string}}
        request_ranges: {type: array, items: {type: string}}
        transfer_ranges: {type: array, items: {type: string}}
        pending_repair: {type: string}
        preview_kind: {type: string}
        flush_before_transfer: {type: boolean}
  - id: RepairStreamingStreamState
    summary: The outcome of a stream plan or session (StreamState / SessionInfo).
    schema:
      type: object
      properties:
        plan_id: {type: string}
        state: {type: string, enum: [INITIALIZED, PREPARING, STREAMING, WAIT_COMPLETE, COMPLETE, FAILED, ABORTED]}
        files_sent: {type: integer}
        files_received: {type: integer}
        failure_reason: {type: string}
        preview: {type: boolean}
  - id: RepairStreamingSnapshotCommand
    summary: SnapshotCommand, the SNAPSHOT_REQ payload.
    schema:
      type: object
      properties:
        from: {type: string, examples: ["n2"]}
        keyspace: {type: string, examples: [ks1]}
        column_family: {type: string, examples: [users]}
        snapshot_name: {type: string, examples: [backup-2026-10-30]}
        clear_snapshot: {type: boolean, default: false}
  - id: RepairStreamingTableSnapshot
    summary: A TableSnapshot row tracked by SnapshotManager, keyed replica:keyspace.table:tag.
    schema:
      type: object
      properties:
        replica: {type: string}
        keyspace: {type: string}
        table: {type: string}
        tag: {type: string}
        created_at: {type: integer}
        expires_at: {type: integer}
        ephemeral: {type: boolean}

interfaces:
  # ================================================================ boundary stubs
  - component: storage-service
    name: get-local-replicas
    kind: function
    summary: "The ranges this node replicates for a keyspace (StorageService.getLocalReplicas(keyspace).onlyFull().ranges())."
    sources: [src/java/org/apache/cassandra/service/StorageService.java]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}}}
    response:
      type: object
      properties:
        ranges:
          type: array
          items: {type: string}
          examples: [["(-6148914691236517206,0]", "(0,6148914691236517205]", "(6148914691236517205,-6148914691236517206]"]]
  - component: token-metadata
    name: get-write-endpoints
    kind: function
    summary: "CONTRACT: the natural replicas (ring walk with the keyspace's RF) and the pending replicas for a token; replicas = natural + pending."
    sources: [src/java/org/apache/cassandra/locator/TokenMetadata.java:1333-1337]
    attributes: {boundary: true, owner: membership}
    request:
      type: object
      required: [keyspace, token]
      properties:
        keyspace: {type: string, examples: [ks1]}
        token: {type: integer, examples: [100]}
    response:
      type: object
      required: [keyspace, token, natural, pending, replicas]
      properties:
        keyspace: {type: string, examples: [ks1]}
        token: {type: integer, examples: [100]}
        natural: {type: array, items: {type: string}, examples: [["n1", "n2", "n3"]]}
        pending: {type: array, items: {type: string}, examples: [[]]}
        replicas: {type: array, items: {type: string}, examples: [["n1", "n2", "n3"]]}
  - component: token-metadata
    name: get-replication-factor
    kind: function
    summary: "Model helper for Keyspace.open(ks).getReplicationStrategy().getReplicationFactor()."
    sources: [src/java/org/apache/cassandra/service/StorageService.java:5359]
    attributes: {boundary: true, owner: membership}
    request: {type: object, required: [keyspace], properties: {keyspace: {type: string, examples: [ks1]}}}
    response: {type: object, properties: {keyspace: {type: string}, rf: {type: integer, examples: [3]}}}
  - component: storage-service
    name: get-operation-mode
    kind: function
    summary: The node's operation mode (STARTING, JOINING, NORMAL, LEAVING, DECOMMISSIONED, MOVING, DRAINING, DRAINED).
    sources: [src/java/org/apache/cassandra/service/StorageService.java]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {}}
    response: {type: object, properties: {mode: {type: string, examples: [NORMAL]}}}
  - component: storage-service
    name: confirm-replication
    kind: function
    summary: Removes an endpoint from the set awaiting replication confirmation during removenode.
    sources: [src/java/org/apache/cassandra/service/StorageService.java]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {endpoint: {type: string, examples: ["n2"]}}}
    response: {type: object, properties: {}}
  - component: failure-detector
    name: is-alive
    kind: function
    summary: Whether the failure detector considers an endpoint alive.
    sources: [src/java/org/apache/cassandra/gms/FailureDetector.java]
    attributes: {boundary: true, owner: membership}
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string, examples: ["n2"]}}}
    response: {type: object, properties: {endpoint: {type: string}, alive: {type: boolean, default: true}}}
  - component: column-family-store
    name: force-flush
    kind: function
    summary: Flushes the table's memtable to an SSTable.
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java]
    attributes: {boundary: true, owner: write-path}
    request:
      type: object
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        replica: {type: string, examples: ["n1"]}
        reason: {type: string, examples: [STREAMING]}
    response: {type: object, properties: {flushed: {type: boolean}, sstables: {type: integer}}}
  - component: column-family-store
    name: add-sstables
    kind: function
    summary: "Adds streamed SSTables to the table's live set (and builds non-SSTable-attached indexes). Streamed SSTables keep the pendingRepair they were written with (empty when not an incremental repair)."
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java]
    attributes: {boundary: true, owner: write-path}
    request:
      type: object
      properties:
        keyspace: {type: string}
        table: {type: string}
        files: {type: integer}
        pending_repair: {type: string, default: ""}
    response: {type: object, properties: {}}
  - component: keyspace
    name: apply
    kind: function
    summary: Applies a mutation locally (commit log, memtable, views).
    sources: [src/java/org/apache/cassandra/db/Keyspace.java]
    attributes: {boundary: true, owner: write-path}
    request:
      type: object
      required: [mutation]
      properties:
        mutation: {type: object}
        replica: {type: string}
        write_commit_log: {type: boolean}
        update_indexes: {type: boolean}
        is_droppable: {type: boolean}
    response: {type: object, properties: {}}
  - component: keyspace
    name: get-column-family-stores
    kind: function
    summary: The tables of a keyspace (Keyspace.open(name).getColumnFamilyStores()).
    sources: [src/java/org/apache/cassandra/db/Keyspace.java]
    attributes: {boundary: true, owner: write-path}
    request: {type: object, properties: {keyspace: {type: string, examples: [ks1]}}}
    response: {type: object, properties: {tables: {type: array, items: {type: string}, examples: [[users]]}}}
  - component: compaction-manager
    name: get-pending-tasks
    kind: function
    summary: Estimated pending compaction tasks on this node.
    sources: [src/java/org/apache/cassandra/db/compaction/CompactionManager.java]
    attributes: {boundary: true, owner: read-path}
    request: {type: object, properties: {}}
    response: {type: object, properties: {pending_tasks: {type: integer, default: 0}}}
  - component: compaction-manager
    name: submit-pending-anti-compaction
    kind: function
    summary: "Incremental repair's anticompaction: SSTables inside the repaired ranges get pendingRepair = session and stay UNREPAIRED (read-path's contract)."
    sources: [src/java/org/apache/cassandra/db/compaction/CompactionManager.java:817-880]
    attributes: {boundary: true, owner: read-path}
    request:
      type: object
      required: [keyspace, session_id]
      properties:
        keyspace: {type: string, examples: [shop]}
        tables: {type: array, items: {type: string}, examples: [[users]]}
        session_id: {type: string, examples: [s1]}
    response: {type: object, properties: {marked: {type: integer}}}
  - component: compaction-manager
    name: submit-background
    kind: function
    summary: "CompactionManager.submitBackground: a background compaction check for the table."
    sources: [src/java/org/apache/cassandra/db/compaction/CompactionManager.java:230-263]
    attributes: {boundary: true, owner: read-path}
    request: {type: object, properties: {keyspace: {type: string, examples: [shop]}, table: {type: string, examples: [users]}}}
    response: {type: object, properties: {submitted: {type: integer}, reason: {type: string}}}
  - component: paxos-cleanup
    name: cleanup
    kind: function
    summary: Repairs uncommitted Paxos state for the ranges on all endpoints before data repair.
    sources: [src/java/org/apache/cassandra/service/paxos/cleanup/PaxosCleanup.java]
    attributes: {boundary: true, owner: paxos}
    request:
      type: object
      properties:
        endpoints: {type: array, items: {type: string}}
        keyspace: {type: string}
        table: {type: string}
        ranges: {type: array, items: {type: string}}
        skipped_replicas: {type: boolean}
        coordinator: {type: string}
    response: {type: object, properties: {}}
    errors: [{code: paxos-cleanup-exception, summary: "PaxosCleanupException (a failure response, a timeout or a failed endpoint)"}]
  - component: diagnostic-snapshot-service
    name: snapshot
    kind: function
    summary: Takes a rate-limited diagnostic snapshot requested by another node.
    sources: [src/java/org/apache/cassandra/utils/DiagnosticSnapshotService.java]
    attributes: {boundary: true, owner: ops}
    request:
      type: object
      properties:
        keyspace: {type: string}
        column_family: {type: string}
        snapshot_name: {type: string}
        from: {type: string}
    response: {type: object, properties: {}}
  - component: data-disk
    name: snapshot-remove
    kind: io
    summary: Deletes a snapshot directory (rate limited by snapshot_links_per_second).
    attributes: {boundary: true, owner: shared}
    request:
      type: object
      properties:
        keyspace: {type: string}
        table: {type: string}
        tag: {type: string}
    response: {type: object, properties: {}}

  # ================================================================ JMX entry points (StorageService, owned here by function)
  - component: storage-service
    name: repair-async
    kind: function
    summary: "StorageServiceMBean.repairAsync: parses the spec, picks the ranges, and submits a RepairCoordinator to the Repair-Task executor. Returns the command number at once."
    attributes: {mbean: "org.apache.cassandra.db:type=StorageService", operation: repairAsync}
    sources:
      - src/java/org/apache/cassandra/service/StorageService.java:4766-4769
      - src/java/org/apache/cassandra/service/StorageService.java:4771-4775
      - src/java/org/apache/cassandra/service/StorageService.java:4777-4803
      - src/java/org/apache/cassandra/service/StorageService.java:4848-4870
    request:
      type: object
      required: [keyspace]
      properties:
        keyspace: {type: string, examples: [ks1]}
        options: {$ref: RepairStreamingRepairSpec}
    response: {type: object, properties: {cmd: {type: integer}}}
    errors:
      - {code: illegal-argument-exception, summary: Invalid repair options (RepairOption.parse or createRepairTask).}
    behavior:
      - call: repair-option.parse
        input: "= input.options"
        as: opt
      - set:
          vars.local: "= self"
      - title: The local data center must be part of the repair
        source: src/java/org/apache/cassandra/service/StorageService.java:4850-4853
        when: "size(vars.opt.value.data_centers) > 0 && !('datacenter1' in vars.opt.value.data_centers)"
        fail:
          code: illegal-argument-exception
          message: "= 'the local data center must be part of the repair; requested ' + vars.opt.value.data_centers.join(',') + ' but DC is datacenter1'"
      - call: storage-service.get-local-replicas
        input: {keyspace: "= input.keyspace"}
        as: localReplicas
      - call: token-metadata.get-replication-factor
        input: {keyspace: "= input.keyspace"}
        as: rfv
      - set:
          vars.localRanges: "= vars.localReplicas.value.ranges"
          vars.rf: "= vars.rfv.value.rf"
      - title: Ranges default to the node's full local replicas (or primary ranges with -pr)
        detail: With no -st/-et, repair covers getLocalReplicas(keyspace).onlyFull().ranges(); -pr uses getPrimaryRanges. With RF=N on N nodes every local range is also replicated on every other node.
        source: src/java/org/apache/cassandra/service/StorageService.java:4779-4796
        set:
          vars.ranges: "= size(vars.opt.value.ranges) > 0 ? vars.opt.value.ranges : vars.localRanges"
      - title: Nothing to repair when there are no ranges or RF < 2
        detail: The command returns 0 and no RepairCoordinator is created.
        source: src/java/org/apache/cassandra/service/StorageService.java:4797-4798
        if: "size(vars.ranges) == 0 || vars.rf < 2"
        then:
          - set: {ctx.repairOutcome: "not run: RF < 2 or no ranges"}
          - return: {cmd: 0}
      - title: nextRepairCommand.incrementAndGet(); each command gets a new parent session (TimeUUID)
        source: src/java/org/apache/cassandra/service/StorageService.java:4800-4801
        set:
          ctx.repairCmd: "= (has(ctx.repairCmd) ? ctx.repairCmd : 0) + 1"
      - set:
          vars.cmd: "= ctx.repairCmd"
          vars.parent: "= '6f2b1a40-9d3c-11ef-a8d2-5b1c0e7f4a2' + string(ctx.repairCmd)"
      - title: Submit the RepairCoordinator to the Repair-Task executor
        detail: repairCommandExecutor (repair_command_pool_size, queue strategy by default) runs RepairCoordinator.run asynchronously; repairAsync returns the command number immediately.
        source: src/java/org/apache/cassandra/service/StorageService.java:4800-4802
        emit: repair-coordinator.run
        input:
          cmd: "= vars.cmd"
          keyspace: "= input.keyspace"
          coordinator: "= vars.local"
          parent_session: "= vars.parent"
          option: "= vars.opt.value"
          ranges: "= vars.ranges"
      - return: {cmd: "= vars.cmd"}

  - component: storage-service
    name: take-snapshot
    kind: jmx
    summary: "StorageServiceMBean.takeSnapshot(tag, options, entities): snapshots keyspaces, or ks.table entities, after validating the request."
    attributes: {mbean: "org.apache.cassandra.db:type=StorageService", operation: takeSnapshot}
    sources:
      - src/java/org/apache/cassandra/service/StorageService.java:4334-4353
      - src/java/org/apache/cassandra/service/StorageService.java:4457-4490
      - src/java/org/apache/cassandra/service/StorageService.java:4503-4556
    request:
      type: object
      properties:
        tag: {type: string, examples: [backup-2026-10-30]}
        entities: {type: array, items: {type: string}, examples: [[ks1]]}
        ttl_seconds: {type: integer, default: 0}
        skip_flush: {type: boolean, default: false}
    response: {type: object, properties: {snapshots: {type: integer}}}
    errors:
      - {code: illegal-argument-exception}
      - {code: io-exception}
    behavior:
      - title: A snapshot TTL must be at least 60 seconds
        detail: cassandra.snapshot.min_allowed_ttl_seconds defaults to 60.
        source: src/java/org/apache/cassandra/service/StorageService.java:4336-4342
        when: "input.ttl_seconds > 0 && input.ttl_seconds < 60"
        fail: {code: illegal-argument-exception, message: ttl for snapshot must be at least 60 seconds}
      - call: storage-service.get-operation-mode
        input: {}
        as: mode
      - title: No snapshot while bootstrapping
        source: src/java/org/apache/cassandra/service/StorageService.java:4459-4460
        when: "vars.mode.value.mode == 'JOINING'"
        fail: {code: io-exception, message: Cannot snapshot until bootstrap completes}
      - title: A snapshot name is required
        source: src/java/org/apache/cassandra/service/StorageService.java:4461-4462
        when: "input.tag == ''"
        fail: {code: io-exception, message: You must supply a snapshot name.}
      - title: Entities are ks.table pairs or keyspace names (empty means every keyspace)
        source: src/java/org/apache/cassandra/service/StorageService.java:4345-4352
        set:
          vars.multiTable: "= size(input.entities) > 0 && input.entities[0].contains('.')"
      - when: "vars.multiTable && input.entities.exists(e, size(e.split('.')) != 2)"
        source: src/java/org/apache/cassandra/service/StorageService.java:4538-4542
        fail: {code: illegal-argument-exception, message: "Cannot take a snapshot on secondary index or invalid column family name. You must supply a column family name in the form of keyspace.columnfamily"}
      - set:
          vars.keyspaces: "= size(input.entities) == 0 ? ['ks1'] : input.entities"
      - set:
          vars.targets: "= vars.multiTable ? input.entities : []"
      - title: Keyspace snapshots cover every table of each keyspace
        source: src/java/org/apache/cassandra/service/StorageService.java:4464-4476
        when: "!vars.multiTable"
        foreach: "= vars.keyspaces"
        as: ks
        steps:
          - call: keyspace.get-column-family-stores
            input: {keyspace: "= vars.ks"}
            as: cfs
          - set: {vars.targets: "= vars.targets + vars.cfs.value.tables.map(t, vars.ks + '.' + t)"}
      - title: Refuse when the snapshot already exists (checked for every target before any is taken)
        source: src/java/org/apache/cassandra/service/StorageService.java:4478-4480
        foreach: "= vars.targets"
        as: target
        steps:
          - call: snapshot-manager.get-snapshot
            input: {key: "= vars.target + ':' + input.tag"}
            as: existing
          - when: "vars.existing.value.tag != ''"
            fail: {code: io-exception, message: "= 'Snapshot ' + input.tag + ' already exists.'"}
      - title: Keyspace.snapshot snapshots each matching table
        source: src/java/org/apache/cassandra/db/Keyspace.java:251-262
        foreach: "= vars.targets"
        as: target
        steps:
          - call: column-family-store.snapshot
            input:
              replica: "= self"
              keyspace: "= vars.target.split('.')[0]"
              table: "= vars.target.split('.')[1]"
              snapshot_name: "= input.tag"
              ttl_seconds: "= input.ttl_seconds"
              ephemeral: false
      - return: {snapshots: "= size(vars.targets)"}

  - component: storage-service
    name: clear-snapshot
    kind: jmx
    summary: "StorageServiceMBean.clearSnapshot(options, tag, keyspaces): removes snapshots by tag (all when empty), optionally only those older than a duration."
    attributes: {mbean: "org.apache.cassandra.db:type=StorageService", operation: clearSnapshot}
    sources:
      - src/java/org/apache/cassandra/service/StorageService.java:4578-4627
      - src/java/org/apache/cassandra/service/StorageService.java:4641-4649
    request:
      type: object
      properties:
        tag: {type: string, examples: [backup-2026-10-30]}
        keyspaces: {type: array, items: {type: string}, examples: [[ks1]]}
        older_than_seconds: {type: integer, default: 0}
    response: {type: object, properties: {cleared: {type: integer}}}
    behavior:
      - call: snapshot-manager.load-snapshots
        input: {}
        as: all
      - title: TableSnapshot.shouldClearSnapshot filters by keyspace, tag and creation time
        detail: An empty tag clears every snapshot (ephemeral ones included); older_than keeps snapshots created after now - duration.
        source: src/java/org/apache/cassandra/service/StorageService.java:4641-4649
        set:
          vars.toClear: "= vars.all.value.filter(s, (size(input.keyspaces) == 0 || s.keyspace in input.keyspaces) && (input.tag == '' || s.tag == input.tag) && (input.older_than_seconds == 0 || s.created_at < now - input.older_than_seconds * 1000))"
      - foreach: "= vars.toClear"
        as: snap
        steps:
          - call: snapshot-manager.clear-snapshot
            input: "= vars.snap"
      - return: {cleared: "= size(vars.toClear)"}

  # ================================================================ snapshots on ColumnFamilyStore (owned here by function)
  - component: column-family-store
    name: snapshot
    kind: function
    summary: Snapshot the table. Flush a dirty memtable first (SNAPSHOT), then hard-link the live SSTables (write-path's contract).
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java:2334-2389]
    attributes: {boundary: true, owner: write-path}
    request:
      type: object
      required: [keyspace, table, snapshot_name]
      properties:
        keyspace: {type: string, examples: [ks1]}
        table: {type: string, examples: [users]}
        replica: {type: string, examples: ["n2"]}
        snapshot_name: {type: string, examples: [truncated-1730000000000-users]}
        ephemeral: {type: boolean, default: false}
        ttl_seconds: {type: integer, default: 0}
    errors:
      - {code: illegal-argument-exception, summary: "validateSnapshotName: name contains the path separator or is '.' / '..'"}
      - {code: illegal-state-exception, summary: Ephemeral snapshot with a TTL}

