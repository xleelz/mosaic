        - 1.0
      - endpoint: n2
        latencies_ms:
        - 2.0
        - 2.0
        - 2.0
      - endpoint: n3
        latencies_ms:
        - 20.0
        - 20.0
        - 20.0
  steps:
  - flow: dynamic-snitch-update
    as: u
