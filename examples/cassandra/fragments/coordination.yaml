# Coordination area fragment of the Cassandra 5.0.9 ontology, built from code.
# Owns StorageProxy (except CAS, mutateAtomically and submitHint), the write and
# truncate response handlers, service/reads/**, service/pager/**, locator/**
# (except TokenMetadata and pending ranges) and db/ConsistencyLevel.
# Also claims db/ReadRepairVerbHandler and db/TruncateVerbHandler, which no row of
# the ownership table names (see notes/coordination.md).
#
# Shared shapes are inlined with YAML anchors because only their owners define
# the named schemas (WritePathMutation, ReadPathReadCommand).
schema_version: 1
id: cassandra

configs:
  - {id: write-request-timeout-ms, type: integer, value: 2000, default: 2000, summary: "write_request_timeout: how long the coordinator waits for write acks (AbstractWriteResponseHandler.get).", sources: ["conf/cassandra.yaml:1330", "src/java/org/apache/cassandra/config/Config.java:151"]}
  - {id: read-request-timeout-ms, type: integer, value: 5000, default: 5000, summary: "read_request_timeout: how long the coordinator waits for single-partition read responses (ReadCallback.awaitResults) and for read-repair writes.", sources: ["conf/cassandra.yaml:1322", "src/java/org/apache/cassandra/config/Config.java:145"]}
  - {id: range-request-timeout-ms, type: integer, value: 10000, default: 10000, summary: "range_request_timeout: how long the coordinator waits for range read responses.", sources: ["conf/cassandra.yaml:1326", "src/java/org/apache/cassandra/config/Config.java:148"]}
  - {id: counter-write-request-timeout-ms, type: integer, value: 5000, default: 5000, summary: "counter_write_request_timeout: the write timeout for COUNTER writes (AbstractWriteResponseHandler.currentTimeoutNanos).", sources: ["conf/cassandra.yaml:1334", "src/java/org/apache/cassandra/config/Config.java:154"]}
  - {id: truncate-request-timeout-ms, type: integer, value: 60000, default: 60000, summary: "truncate_request_timeout: how long TruncateResponseHandler.get waits for every live member.", sources: ["conf/cassandra.yaml:1345", "src/java/org/apache/cassandra/config/Config.java:160"]}
  - {id: hinted-handoff-enabled, type: boolean, value: true, default: true, summary: "hinted_handoff_enabled: StorageProxy.shouldHint refuses every hint when false.", sources: ["conf/cassandra.yaml:68", "src/java/org/apache/cassandra/config/Config.java:112"]}
  - {id: hinted-handoff-disabled-datacenters, type: array, value: [], default: [], summary: "hinted_handoff_disabled_datacenters (commented out in the yaml): datacenters whose replicas are never hinted.", sources: ["conf/cassandra.yaml:72", "src/java/org/apache/cassandra/config/Config.java:113"]}
  - {id: max-hint-window-ms, type: integer, value: 10800000, default: 10800000, summary: "max_hint_window 3h: no new hints for a replica down longer than this.", sources: ["conf/cassandra.yaml:80", "src/java/org/apache/cassandra/config/Config.java:115"]}
  - {id: hint-window-persistent-enabled, type: boolean, value: true, default: true, summary: "hint_window_persistent_enabled (commented out in the yaml): the window also expires once the oldest stored hint is older than max_hint_window.", sources: ["conf/cassandra.yaml:152", "src/java/org/apache/cassandra/config/Config.java:117"]}
  - {id: max-hints-size-per-host-bytes, type: integer, value: 0, default: 0, summary: "max_hints_size_per_host (commented out; 0 = unlimited).", sources: ["conf/cassandra.yaml:111", "src/java/org/apache/cassandra/config/Config.java:448"]}
  - {id: partition-denylist-enabled, type: boolean, value: false, default: false, summary: "partition_denylist_enabled (commented out in the yaml).", sources: ["conf/cassandra.yaml:1438", "src/java/org/apache/cassandra/config/Config.java:759"]}
  - {id: denylist-writes-enabled, type: boolean, value: true, default: true, summary: "denylist_writes_enabled (commented out in the yaml).", sources: ["conf/cassandra.yaml:1440", "src/java/org/apache/cassandra/config/Config.java:761"]}
  - {id: denylist-reads-enabled, type: boolean, value: true, default: true, summary: "denylist_reads_enabled (commented out in the yaml).", sources: ["conf/cassandra.yaml:1441", "src/java/org/apache/cassandra/config/Config.java:763"]}
  - {id: denylist-range-reads-enabled, type: boolean, value: true, default: true, summary: "denylist_range_reads_enabled (commented out in the yaml).", sources: ["conf/cassandra.yaml:1442", "src/java/org/apache/cassandra/config/Config.java:765"]}
  - {id: dynamic-snitch-update-interval-ms, type: integer, value: 100, default: 100, summary: "dynamic_snitch_update_interval: how often DynamicEndpointSnitch rescores endpoints.", sources: ["conf/cassandra.yaml:1561", "src/java/org/apache/cassandra/config/Config.java:426"]}
  - {id: dynamic-snitch-reset-interval-ms, type: integer, value: 600000, default: 600000, summary: "dynamic_snitch_reset_interval: how often latency samples are dropped (Config.java default 10m).", sources: ["conf/cassandra.yaml:1565", "src/java/org/apache/cassandra/config/Config.java:428"]}
  - {id: dynamic-snitch-badness-threshold, type: number, value: 1.0, default: 1.0, summary: "dynamic_snitch_badness_threshold: reorder only when a replica scores worse than (1 + threshold) x the best.", sources: ["conf/cassandra.yaml:1573", "src/java/org/apache/cassandra/config/Config.java:429"]}
  - {id: reject-out-of-token-range-requests, type: boolean, value: false, default: false, summary: "reject_out_of_token_range_requests (not in the yaml): refuse mutations for tokens the replica neither owns nor is pending for.", sources: ["src/java/org/apache/cassandra/config/Config.java:793"]}
  - {id: initial-sample-read-latency-ms, type: integer, value: 2500, default: 2500, summary: "ColumnFamilyStore.sampleReadLatencyMicros before any latency is measured: read_request_timeout / 2. The speculative-retry threshold.", sources: ["src/java/org/apache/cassandra/db/ColumnFamilyStore.java:498"]}
  - {id: initial-additional-write-latency-ms, type: integer, value: 1000, default: 1000, summary: "ColumnFamilyStore.additionalWriteLatencyMicros before any latency is measured: write_request_timeout / 2. When read repair speculates its writes.", sources: ["src/java/org/apache/cassandra/db/ColumnFamilyStore.java:499"]}

schemas:
  - id: CoordinationWriteRequest
    summary: "Arguments of StorageProxy.mutateWithTriggers / mutate: the mutations of one statement or unlogged batch and the consistency level."
    schema:
      type: object
      required: [mutations, consistency]
      properties:
        mutations:
          type: array
          minItems: 1
          description: "Every mutation of the statement or batch (mutateWithTriggers takes the whole list; a logged batch sends several)."
          items:
            allOf:
              - &mutation
                type: object
                required: [keyspace, table, partition_key, token, timestamp, columns]
                properties:
                  keyspace: {type: string, examples: [shop]}
                  table: {type: string, examples: [users]}
                  partition_key: {type: string, examples: ["user:42"]}
                  token: {type: integer, examples: [100]}
                  timestamp: {type: integer, examples: [1730000000000000]}
                  columns: {type: object, examples: [{name: Ada, email: ada@example.com}]}
                  partition_deletion: {type: boolean, default: false, description: "a partition-level deletion at this mutation's timestamp (read repair of a partition tombstone)"}
                  cells: {type: array, default: [], description: "cells with their own timestamps (read repair); deleted true marks a cell tombstone", items: {type: object, properties: {column: {type: string}, value: {}, timestamp: {type: integer}, deleted: {type: boolean}}}}
              - type: object
                properties:
                  counter: {type: boolean, default: false, description: "true for a CounterMutation (IMutation instanceof CounterMutation)"}
        consistency: &consistency
          type: string
          enum: [ANY, ONE, TWO, THREE, QUORUM, ALL, LOCAL_QUORUM, EACH_QUORUM, SERIAL, LOCAL_SERIAL, LOCAL_ONE, NODE_LOCAL]
          default: QUORUM
        mutate_atomically: {type: boolean, default: false, description: "true for a logged batch (BatchStatement passes mutateAtomically)"}

  - id: CoordinationWriteResult
    summary: What the coordinator learned from a write (no CQL result; void in Java).
    schema:
      type: object
      properties:
        consistency: {type: string}
        path: {type: string, enum: [standard, atomic, hinted-for-any]}
        write_type: {type: string}
        acks: {type: integer}
        block_for: {type: integer}
        hinted: {type: array, items: {type: string}}

  - id: CoordinationWriteHandlerState
    summary: "An AbstractWriteResponseHandler after the sends: blockFor, the candidate count and the acks and failures it saw."
    schema:
      type: object
      properties:
        handler: {type: string, enum: [WriteResponseHandler, DatacenterWriteResponseHandler, DatacenterSyncWriteResponseHandler]}
        consistency: {type: string}
        write_type: {type: string, enum: [SIMPLE, UNLOGGED_BATCH, BATCH, COUNTER, BATCH_LOG, CAS, VIEW, CDC]}
        block_for: {type: integer, examples: [2]}
        candidates: {type: integer, examples: [3]}
        acks: {type: integer, examples: [2]}
        failures: {type: integer, examples: [0]}
        failure_reasons: {type: array, items: {type: string, enum: [TIMEOUT, UNKNOWN, READ_TOO_MANY_TOMBSTONES]}}
        hinted: {type: array, items: {type: string}}
        plan: {type: object}
        timeout_ms: {type: integer, description: "write_request_timeout, or counter_write_request_timeout for COUNTER"}
        start_ms: {type: integer, description: "when the sends started (the handler's request time)"}
        acks_at: {type: array, items: {type: integer}, description: "virtual time of every ack, late ones included"}
        failure_events: {type: array, items: {type: object, properties: {replica: {type: string}, reason: {type: string}, t: {type: integer}}}}
        hint_ack: {type: integer, description: "1 when a CL.ANY hint counted as the ack"}
        join_ok: {type: boolean}

  - id: CoordinationReplicaPlan
    summary: "A ReplicaPlan: natural and pending replicas, which are live, which to contact, and how many must answer."
    schema:
      type: object
      properties:
        keyspace: {type: string}
        token: {type: integer}
        consistency: {type: string}
        rf: {type: integer}
        strategy: {type: string}
        natural: {type: array, items: {type: string}}
        pending: {type: array, items: {type: string}}
        live_and_down: {type: array, items: {type: string}}
        replicas: {type: array, items: {type: string}}
        live: {type: array, items: {type: string}}
        candidates: {type: array, items: {type: string}}
        contacts: {type: array, items: {type: string}}
        live_uncontacted: {type: array, items: {type: string}}
        block_for: {type: integer}
        local: {type: string}

  - id: CoordinationReadRequest
    summary: "Arguments of StorageProxy.read: a single-partition read command (a Group of one) and the consistency level."
    schema:
      type: object
      required: [read_command, consistency]
      properties:
        read_command: &read_command
          type: object
          required: [keyspace, table]
          properties:
            kind: {type: string, enum: [single_partition, partition_range], default: single_partition}
            keyspace: {type: string, examples: [shop]}
            table: {type: string, examples: [users]}
            partition_key: {type: string, examples: ["user:42"]}
            token: {type: integer, examples: [100]}
            start_token: {type: integer}
            end_token: {type: integer}
            columns: {examples: [[name, email]]}
            limit: {type: integer, examples: [100]}
            digest: {type: boolean, default: false}
        consistency:
          type: string
          enum: [ANY, ONE, TWO, THREE, QUORUM, ALL, LOCAL_QUORUM, EACH_QUORUM, SERIAL, LOCAL_SERIAL, LOCAL_ONE, NODE_LOCAL]
          default: QUORUM

  - id: CoordinationReadResult
    summary: The rows a coordinated read returns (a PartitionIterator in Java).
    schema:
      type: object
      properties:
        rows: {type: array, items: {type: object}}
        timestamp: {type: integer}
        repaired: {type: array, items: {type: string}}

  - id: CoordinationReplicaResponse
    summary: "One replica's answer as the coordinator's callback records it: a data or digest ReadResponse, or a failure with its RequestFailureReason."
    schema:
      type: object
      properties:
        from: {type: string}
        ok: {type: boolean}
        is_digest: {type: boolean}
        digest: {type: string}
        timestamp: {type: integer}
        partitions: {type: array, items: {type: object}}
        reason: {type: string}
        t: {type: integer, description: "virtual time the coordinator received it"}

  - id: CoordinationReadResponseView
    summary: "The fields of read-path's ReadResponse (READ_RSP / RANGE_RSP payload) the coordinator reads: digest and partitions of cells."
    schema: &read_response
      type: object
      properties:
        from: {type: string, examples: ["n2"]}
        digest_response: {type: boolean, default: false}
        digest: {type: string, examples: ["md5:user:42|name=Ada@1730000000000000"]}
        partitions:
          type: array
          examples: [[{partition_key: "user:42", cells: [{column: name, value: Ada, timestamp: 1730000000000000}], timestamp: 1730000000000000}]]
          items:
            type: object
            properties:
              partition_key: {type: string}
              cells: {type: array, items: {type: object, properties: {column: {type: string}, value: {}, timestamp: {type: integer}, deleted: {type: boolean, default: false}}}}
              timestamp: {type: integer}
              deletion_ts: {type: integer, default: -1, description: "partition deletion timestamp, -1 when none"}
  - id: CoordinationReadExecutor
    summary: "An AbstractReadExecutor: its kind (from the table's speculative_retry), replica plan and read repair strategy."
    schema:
      type: object
      properties:
        type: {type: string, enum: [never, never_insufficient, speculating, always]}
        plan: {type: object}
        initial_data_requests: {type: integer}
        sample_read_latency_ms: {type: integer}
        read_repair: {type: string, enum: [BLOCKING, NONE]}
        speculative_retry: {type: string}
        command: {type: object}
        consistency: {type: string}

  - id: CoordinationRangeReadRequest
    summary: "Arguments of StorageProxy.getRangeSlice: a PartitionRangeReadCommand over a token range and the consistency level."
    schema:
      type: object
      required: [command, consistency]
      properties:
        command:
          type: object
          required: [keyspace, table]
          properties:
            keyspace: {type: string, examples: [shop]}
            table: {type: string, examples: [users]}
            start_token: {type: integer, description: "range left bound; Murmur3 minimum token (Long.MIN_VALUE) for a full scan", examples: [-9223372036854775808]}
            end_token: {type: integer, examples: [-9223372036854775808]}
            limit: {type: integer, examples: [100]}
            filtered: {type: boolean, default: false, description: "the command has a row filter or index query (replica filtering protection)"}
        consistency:
          type: string
          enum: [ONE, TWO, THREE, QUORUM, ALL, LOCAL_QUORUM, EACH_QUORUM, LOCAL_ONE]
          default: QUORUM

components:
  # ---------------------------------------------------------------- StorageProxy
  - id: storage-proxy
    name: StorageProxy
    kind: module
    parent: coordination
    layer: coordination
    summary: "The coordinator: picks replicas, sends mutations and reads, waits for the consistency level, hints, and runs read repair."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:187-266"]
    state:
      initial:
        max_hints_in_progress: 1024
        total_hints_in_progress: 0
        hints_in_progress: {}
    description: >-
      Deployed settings StorageProxy reads are config entities (hinted-handoff-enabled,
      max-hint-window-ms, hint-window-persistent-enabled, max-hints-size-per-host-bytes,
      the denylist switches and the request timeouts). State keeps the hint backpressure
      counters: max_hints_in_progress is 128 * available processors (StorageProxy.java:202),
      1024 on an 8-core node; hints_in_progress is keyed by instance.
  - id: storage-proxy-local-read-runnable
    name: StorageProxy.LocalReadRunnable
    kind: function
    parent: storage-proxy
    layer: coordination
    summary: "Runs a read on the coordinator itself on the READ stage instead of messaging itself, and feeds the result to the read callback."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2178-2275"]
  - id: storage-proxy-local-mutation-runnable
    name: StorageProxy.LocalMutationRunnable
    kind: function
    parent: storage-proxy
    layer: coordination
    summary: "Applies a mutation on the coordinator itself on the MUTATION stage; a runnable that missed its deadline is turned into a hint for the local node."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2623-2680"]
  - id: storage-proxy-droppable-runnable
    name: StorageProxy.DroppableRunnable
    kind: function
    parent: storage-proxy
    layer: coordination
    summary: "A stage task (counter write, local read) that is dropped without running once its verb's deadline has passed."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2586-2616"]

  # --------------------------------------------------------- write response handlers
  - id: abstract-write-response-handler
    name: AbstractWriteResponseHandler
    kind: module
    parent: coordination
    layer: coordination
    summary: "Counts write acks and failures for one mutation, decides success, WriteTimeout or WriteFailure, and hints replicas that fail."
    sources: ["src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:65-376"]
  - id: write-response-handler
    name: WriteResponseHandler
    kind: function
    parent: abstract-write-response-handler
    layer: coordination
    summary: "Blocks for blockFor acks from any replica (ONE, TWO, THREE, QUORUM, ALL, ANY)."
    sources: ["src/java/org/apache/cassandra/service/WriteResponseHandler.java:35-72"]
  - id: datacenter-write-response-handler
    name: DatacenterWriteResponseHandler
    kind: function
    parent: abstract-write-response-handler
    layer: coordination
    summary: "Counts only acks from the local datacenter (LOCAL_ONE, LOCAL_QUORUM)."
    sources: ["src/java/org/apache/cassandra/service/DatacenterWriteResponseHandler.java:34-68"]
  - id: datacenter-sync-write-response-handler
    name: DatacenterSyncWriteResponseHandler
    kind: function
    parent: abstract-write-response-handler
    layer: coordination
    summary: "Blocks for a quorum in every datacenter (EACH_QUORUM with NetworkTopologyStrategy)."
    sources: ["src/java/org/apache/cassandra/service/DatacenterSyncWriteResponseHandler.java:39-109"]
  - id: truncate-response-handler
    name: TruncateResponseHandler
    kind: function
    parent: coordination
    layer: coordination
    summary: "Waits for every live ring member to acknowledge a truncate; any failure aborts it."
    sources: ["src/java/org/apache/cassandra/service/TruncateResponseHandler.java:44-115"]

  # ------------------------------------------------------------- consistency, plans
  - id: consistency-level
    name: ConsistencyLevel
    kind: module
    parent: coordination
    layer: coordination
    summary: "How many replicas each consistency level blocks for, for reads and for writes (adding pending replicas)."
    sources: ["src/java/org/apache/cassandra/db/ConsistencyLevel.java:35-278"]
  - id: replica-plans
    name: ReplicaPlans
    kind: module
    parent: coordination
    layer: coordination
    summary: "Builds replica plans for writes, reads, range reads, read repair and Paxos, and throws Unavailable when too few replicas are live."
    sources: ["src/java/org/apache/cassandra/locator/ReplicaPlans.java:82-794"]
  - id: replica-layout
    name: ReplicaLayout
    kind: function
    parent: coordination
    layer: coordination
    summary: "The natural and pending replicas of a token (writes), or its live natural replicas sorted by the snitch (reads)."
    sources: ["src/java/org/apache/cassandra/locator/ReplicaLayout.java:39-349"]
  - id: abstract-replication-strategy
    name: AbstractReplicationStrategy
    kind: module
    parent: coordination
    layer: coordination
    summary: "A keyspace's replication strategy: computes (and caches) natural replicas from the token ring and picks the write response handler class."
    sources: ["src/java/org/apache/cassandra/locator/AbstractReplicationStrategy.java:56-205"]
    state:
      initial:
        strategies:
          default: SimpleStrategy
    description: >-
      Replication settings come from each keyspace's schema (schema-auth owns the DDL).
      The ring walk itself (SimpleStrategy / NetworkTopologyStrategy calculateNaturalReplicas)
      and the per-keyspace replication factor are read through membership's TokenMetadata
      contract (token-metadata.get-write-endpoints, token-metadata.get-replication-factor),
      so a scenario sets the ring and RF in one place. State maps keyspace name to strategy
      class, used only to pick the EACH_QUORUM response handler; 'default' applies to keyspaces
      not listed.
  - id: simple-strategy
    name: SimpleStrategy
    kind: function
    parent: abstract-replication-strategy
    layer: coordination
    summary: "Places replicas on the next RF distinct endpoints clockwise on the ring from the token. Its ring walk is evaluated by membership's token-metadata.get-write-endpoints."
    sources: ["src/java/org/apache/cassandra/locator/SimpleStrategy.java:46-90"]
  - id: network-topology-strategy
    name: NetworkTopologyStrategy
    kind: function
    parent: abstract-replication-strategy
    layer: coordination
    summary: "Places RF replicas per datacenter, walking the ring and preferring distinct racks. With SimpleSnitch (one DC, one rack) this equals the SimpleStrategy walk."
    sources: ["src/java/org/apache/cassandra/locator/NetworkTopologyStrategy.java:61-250"]
  - id: local-strategy
    name: LocalStrategy
    kind: function
    parent: abstract-replication-strategy
    layer: coordination
    summary: "The only replica is the local node (system keyspaces)."
    sources: ["src/java/org/apache/cassandra/locator/LocalStrategy.java:30-70"]

  # ---------------------------------------------------------------------- snitches
  - id: dynamic-endpoint-snitch
    name: DynamicEndpointSnitch
    kind: module
    parent: coordination
    layer: coordination
    summary: "Wraps the configured snitch and reorders replicas by measured latency when one is much worse than another; rescored every 100ms, reset every 10min."
    sources: ["src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:51-420"]
    state:
      initial:
        samples: []
        scores: []
    description: >-
      dynamic_snitch is true (Config.java:424; not set in conf/cassandra.yaml), so
      DatabaseDescriptor wraps endpoint_snitch in this class (DatabaseDescriptor.java:1443,1671).
      dynamic_snitch_update_interval 100ms (yaml:1561), dynamic_snitch_reset_interval
      600000ms (yaml:1565), dynamic_snitch_badness_threshold 1.0 (yaml:1573). samples is a
      list of {endpoint, latencies_ms}; scores a list of {endpoint, score}.
  - id: simple-snitch
    name: SimpleSnitch
    kind: function
    parent: dynamic-endpoint-snitch
    layer: coordination
    summary: "The deployed endpoint_snitch: every node is in datacenter1/rack1 and proximity sorting is a no-op."
    sources: ["src/java/org/apache/cassandra/locator/SimpleSnitch.java:25-54"]
    description: "endpoint_snitch: SimpleSnitch (conf/cassandra.yaml:1556)."
  - id: gossiping-property-file-snitch
    name: GossipingPropertyFileSnitch
    kind: function
    parent: coordination
    layer: coordination
    summary: "Alternative snitch: the local DC and rack come from cassandra-rackdc.properties and others' from gossip. Not deployed."
    sources: ["src/java/org/apache/cassandra/locator/GossipingPropertyFileSnitch.java:36-140"]
  - id: property-file-snitch
    name: PropertyFileSnitch
    kind: function
    parent: coordination
    layer: coordination
    summary: "Alternative snitch reading every node's DC and rack from cassandra-topology.properties. Not deployed."
    sources: ["src/java/org/apache/cassandra/locator/PropertyFileSnitch.java:50-140"]
  - id: endpoint-snitch-info
    name: EndpointSnitchInfo
    kind: function
    parent: coordination
    layer: coordination
    summary: "JMX view of the snitch (getDatacenter, getRack, getSnitchName)."
    sources: ["src/java/org/apache/cassandra/locator/EndpointSnitchInfo.java:25-56"]

  # ----------------------------------------------------------------- read executors
  - id: abstract-read-executor
    name: AbstractReadExecutor
    kind: module
    parent: coordination
    layer: coordination
    summary: "Sends one data request and digest requests for a single-partition read, speculates per the table's speculative_retry, and starts read repair on a digest mismatch."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:64-482"]
    state:
      initial:
        table_params:
          default: {speculative_retry: 99p, read_repair: BLOCKING}
    description: >-
      Table parameters, keyed '<keyspace>.<table>' over 'default': speculative_retry '99p'
      (TableParams.java:366) and read_repair BLOCKING (TableParams.java:374). The
      speculation threshold is ColumnFamilyStore.sampleReadLatencyMicros, which starts at
      read_request_timeout/2 (config initial-sample-read-latency-ms, ColumnFamilyStore.java:498)
      and is later recalculated from the coordinator read latency percentile
      (ColumnFamilyStore.java:594); a table entry may set sample_read_latency_ms.
  - id: abstract-read-executor-never-speculating-read-executor
    name: AbstractReadExecutor.NeverSpeculatingReadExecutor
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "No speculation: speculative_retry NONE, EACH_QUORUM, or no uncontacted live replica."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:262-288"]
  - id: abstract-read-executor-speculating-read-executor
    name: AbstractReadExecutor.SpeculatingReadExecutor
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "Waits for the sampled latency percentile, then sends one extra data or digest request if the consistency level is not yet met."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:290-361"]
  - id: abstract-read-executor-always-speculating-read-executor
    name: AbstractReadExecutor.AlwaysSpeculatingReadExecutor
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "speculative_retry ALWAYS: contacts blockFor + 1 replicas up front, two of them for data."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:363-392"]
  - id: percentile-speculative-retry-policy
    name: PercentileSpeculativeRetryPolicy
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "Default policy (99p): speculate after the table's 99th percentile coordinator read latency."
    sources: ["src/java/org/apache/cassandra/service/reads/PercentileSpeculativeRetryPolicy.java:33-80"]
  - id: never-speculative-retry-policy
    name: NeverSpeculativeRetryPolicy
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "speculative_retry = 'NONE'."
    sources: ["src/java/org/apache/cassandra/service/reads/NeverSpeculativeRetryPolicy.java:24-60"]
  - id: always-speculative-retry-policy
    name: AlwaysSpeculativeRetryPolicy
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "speculative_retry = 'ALWAYS'."
    sources: ["src/java/org/apache/cassandra/service/reads/AlwaysSpeculativeRetryPolicy.java:24-60"]
  - id: fixed-speculative-retry-policy
    name: FixedSpeculativeRetryPolicy
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "speculative_retry = 'Nms': speculate after a fixed delay."
    sources: ["src/java/org/apache/cassandra/service/reads/FixedSpeculativeRetryPolicy.java:30-80"]
  - id: hybrid-speculative-retry-policy
    name: HybridSpeculativeRetryPolicy
    kind: function
    parent: abstract-read-executor
    layer: coordination
    summary: "speculative_retry = 'MIN(99p,50ms)' or 'MAX(...)': combines a percentile and a fixed delay."
    sources: ["src/java/org/apache/cassandra/service/reads/HybridSpeculativeRetryPolicy.java:30-120"]
  - id: read-callback
    name: ReadCallback
    kind: function
    parent: coordination
    layer: coordination
    summary: "Collects read responses until blockFor responses including one data response arrive, and decides ReadTimeout or ReadFailure."
    sources: ["src/java/org/apache/cassandra/service/reads/ReadCallback.java:58-267"]
  - id: digest-resolver
    name: DigestResolver
    kind: function
    parent: coordination
    layer: coordination
    summary: "Compares the digests of the responses; a match returns the data response unchanged."
    sources: ["src/java/org/apache/cassandra/service/reads/DigestResolver.java:44-167"]
  - id: data-resolver
    name: DataResolver
    kind: function
    parent: coordination
    layer: coordination
    summary: "Merges full data responses (newest timestamp wins) and feeds the differences to read repair."
    sources: ["src/java/org/apache/cassandra/service/reads/DataResolver.java:62-330"]
  - id: replica-filtering-protection
    name: ReplicaFilteringProtection
    kind: function
    parent: data-resolver
    layer: coordination
    summary: "For filtering and index queries above ONE: re-reads rows that some replica filtered out, so stale replicas cannot hide newer data."
    sources: ["src/java/org/apache/cassandra/service/reads/ReplicaFilteringProtection.java:96-200"]
    description: "replica_filtering_protection cached_rows_warn_threshold 2000, cached_rows_fail_threshold 32000 (conf/cassandra.yaml:1822-1835)."
  - id: short-read-partitions-protection
    name: ShortReadPartitionsProtection
    kind: function
    parent: data-resolver
    layer: coordination
    summary: "When a replica returned exactly the limit and the merged result came up short, asks that replica for more partitions."
    sources: ["src/java/org/apache/cassandra/service/reads/ShortReadPartitionsProtection.java:51-200"]
  - id: coordinator-warnings
    name: CoordinatorWarnings
    kind: function
    parent: coordination
    layer: coordination
    summary: "Aggregates replica tombstone and size warnings for the client (read_thresholds_enabled is false by default)."
    sources: ["src/java/org/apache/cassandra/service/reads/thresholds/CoordinatorWarnings.java:38-120"]

  # ------------------------------------------------------------------- read repair
  - id: abstract-read-repair
    name: AbstractReadRepair
    kind: module
    parent: coordination
    layer: coordination
    summary: "After a digest mismatch, re-reads full data from the contacted replicas (speculating one more if slow) and resolves it."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/AbstractReadRepair.java:52-205"]
  - id: blocking-read-repair
    name: BlockingReadRepair
    kind: function
    parent: abstract-read-repair
    layer: coordination
    summary: "read_repair = BLOCKING (the default): the read does not return until the repair mutations are acknowledged."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/BlockingReadRepair.java:50-118"]
  - id: read-only-read-repair
    name: ReadOnlyReadRepair
    kind: function
    parent: abstract-read-repair
    layer: coordination
    summary: "read_repair = NONE: reconciles the data responses but never sends repair mutations."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/ReadOnlyReadRepair.java:38-75"]
  - id: blocking-partition-repair
    name: BlockingPartitionRepair
    kind: function
    parent: blocking-read-repair
    layer: coordination
    summary: "Sends READ_REPAIR_REQ mutations to the stale replicas of one partition and waits for enough acks, speculating to uncontacted replicas."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:59-256"]
  - id: row-iterator-merge-listener
    name: RowIteratorMergeListener
    kind: function
    parent: blocking-read-repair
    layer: coordination
    summary: "While merging replica rows, records what each replica is missing and builds one repair mutation per stale replica."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/RowIteratorMergeListener.java:57-399"]
  - id: read-repair-verb-handler
    name: ReadRepairVerbHandler
    kind: function
    parent: coordination
    layer: coordination
    summary: "Replica side of READ_REPAIR_REQ: applies the repair mutation and acknowledges (no hint on timeout)."
    sources: ["src/java/org/apache/cassandra/db/ReadRepairVerbHandler.java:25-44"]
    state:
      initial:
        out_of_range_writes: 0
    description: "reject-out-of-token-range-requests is a config (false, Config.java:793); state counts out-of-range writes."

  # -------------------------------------------------------------------- range reads
  - id: range-commands
    name: RangeCommands
    kind: function
    parent: coordination
    layer: coordination
    summary: "Entry of a coordinated range read: splits the range on ring tokens, estimates concurrency and iterates the sub-range plans."
    sources: ["src/java/org/apache/cassandra/service/reads/range/RangeCommands.java:41-150"]
  - id: replica-plan-iterator
    name: ReplicaPlanIterator
    kind: function
    parent: range-commands
    layer: coordination
    summary: "Splits the queried range at every ring token and builds a range replica plan per piece."
    sources: ["src/java/org/apache/cassandra/service/reads/range/ReplicaPlanIterator.java:45-131"]
  - id: replica-plan-merger
    name: ReplicaPlanMerger
    kind: function
    parent: range-commands
    layer: coordination
    summary: "Merges consecutive range plans while their shared live replicas still satisfy the consistency level."
    sources: ["src/java/org/apache/cassandra/service/reads/range/ReplicaPlanMerger.java:32-73"]
  - id: range-command-iterator
    name: RangeCommandIterator
    kind: function
    parent: range-commands
    layer: coordination
    summary: "Sends RANGE_REQ for batches of sub-ranges (all data requests, no digests, no speculation) and concatenates the resolved results."
    sources: ["src/java/org/apache/cassandra/service/reads/range/RangeCommandIterator.java:60-302"]
  - id: single-range-response
    name: SingleRangeResponse
    kind: function
    parent: range-commands
    layer: coordination
    summary: "One sub-range's pending response: awaits its read callback, then resolves the data."
    sources: ["src/java/org/apache/cassandra/service/reads/range/SingleRangeResponse.java:31-75"]
  - id: scan-all-ranges-command-iterator
    name: ScanAllRangesCommandIterator
    kind: function
    parent: range-commands
    layer: coordination
    summary: "Top-K (vector/ANN) queries: queries every range of every replica at once."
    sources: ["src/java/org/apache/cassandra/service/reads/range/ScanAllRangesCommandIterator.java:59-115"]

  # -------------------------------------------------------------------------- pagers
  - id: abstract-query-pager
    name: AbstractQueryPager
    kind: module
    parent: coordination
    layer: coordination
    summary: "Fetches one page of a query: caps it at the remaining limit, rebuilds the query from the paging state and runs it at the client's consistency level."
    sources: ["src/java/org/apache/cassandra/service/pager/AbstractQueryPager.java:30-110"]
  - id: single-partition-pager
    name: SinglePartitionPager
    kind: function
    parent: abstract-query-pager
    layer: coordination
    summary: "Pages within one partition, resuming after the last returned row."
    sources: ["src/java/org/apache/cassandra/service/pager/SinglePartitionPager.java:32-106"]
  - id: partition-range-query-pager
    name: PartitionRangeQueryPager
    kind: function
    parent: abstract-query-pager
    layer: coordination
    summary: "Pages a range query, resuming at the last returned partition key."
    sources: ["src/java/org/apache/cassandra/service/pager/PartitionRangeQueryPager.java:29-148"]
  - id: multi-partition-pager
    name: MultiPartitionPager
    kind: function
    parent: abstract-query-pager
    layer: coordination
    summary: "Pages an IN query by chaining one SinglePartitionPager per partition."
    sources: ["src/java/org/apache/cassandra/service/pager/MultiPartitionPager.java:48-234"]

  # ----------------------------------------------------------- boundary components
  - {id: failure-detector, name: FailureDetector, kind: module, parent: membership, layer: cluster, sources: [src/java/org/apache/cassandra/gms/FailureDetector.java], summary: "Phi-accrual failure detector (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: token-metadata, name: TokenMetadata, kind: module, parent: membership, layer: cluster, sources: [src/java/org/apache/cassandra/locator/TokenMetadata.java], summary: "The token ring and pending ranges (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: gossiper, name: Gossiper, kind: module, parent: membership, layer: cluster, sources: [src/java/org/apache/cassandra/gms/Gossiper.java], summary: "Gossip state, live and unreachable members (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: storage-service, name: StorageService, kind: module, parent: membership, layer: cluster, sources: [src/java/org/apache/cassandra/service/StorageService.java], summary: "Node lifecycle and ring view (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: hints-service, name: HintsService, kind: module, parent: hints-batchlog, layer: durability, sources: [src/java/org/apache/cassandra/hints/HintsService.java], summary: "Hint storage and dispatch (owned by hints-batchlog).", attributes: {boundary: true, owner: hints-batchlog}}
  - {id: partition-denylist, name: PartitionDenylist, kind: function, parent: schema-auth, layer: metadata, sources: [src/java/org/apache/cassandra/schema/PartitionDenylist.java], summary: "Denylisted partition keys (owned by schema-auth).", attributes: {boundary: true, owner: schema-auth}}
  - {id: keyspace, name: Keyspace, kind: module, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/Keyspace.java], summary: "Local apply of mutations (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: view-manager, name: ViewManager, kind: module, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/view/ViewManager.java], summary: "Materialized views of a keyspace (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: mutation-verb-handler, name: MutationVerbHandler, kind: handler, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/MutationVerbHandler.java], summary: "Replica side of MUTATION_REQ (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: counter-mutation-verb-handler, name: CounterMutationVerbHandler, kind: handler, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java], summary: "Leader side of COUNTER_MUTATION_REQ (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: counter-mutation, name: CounterMutation, kind: module, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/CounterMutation.java], summary: "Counter read-modify-write on the leader (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: column-family-store, name: ColumnFamilyStore, kind: module, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java], summary: "A table's local store (flush and truncate owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: read-command-verb-handler, name: ReadCommandVerbHandler, kind: function, parent: read-path, layer: storage, sources: [src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java], summary: "Replica side of READ_REQ and RANGE_REQ (owned by read-path).", attributes: {boundary: true, owner: read-path}}
  - {id: read-command, name: ReadCommand, kind: function, parent: read-path, layer: storage, sources: [src/java/org/apache/cassandra/db/ReadCommand.java], summary: "Local execution of a read command (owned by read-path).", attributes: {boundary: true, owner: read-path}}
  - {id: truncate-verb-handler, name: TruncateVerbHandler, kind: handler, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/TruncateVerbHandler.java], summary: "Replica side of TRUNCATE_REQ (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: view-utils, name: ViewUtils, kind: function, parent: write-path, layer: storage, sources: [src/java/org/apache/cassandra/db/view/ViewUtils.java], summary: "Pairs a base replica with its view replica (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: batchlog-manager, name: BatchlogManager, kind: module, parent: hints-batchlog, layer: durability, sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java], summary: "The local batchlog table and its replay (owned by hints-batchlog).", attributes: {boundary: true, owner: hints-batchlog}}

interfaces:
  # =========================================================== StorageProxy: writes
  - component: storage-proxy
    name: mutate-with-triggers
    kind: function
    summary: "Coordinator entry for INSERT, UPDATE, DELETE and batches: denylist check, triggers, then mutateAtomically for logged batches and view updates, else mutate."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1116-1160"]
    request: CoordinationWriteRequest
    response: CoordinationWriteResult
    errors:
      - &err-invalid {code: invalid, status: 8704, summary: InvalidRequestException}
      - &err-unavailable {code: unavailable, status: 4096, summary: UnavailableException}
      - &err-overloaded {code: overloaded, status: 4097, summary: OverloadedException}
      - &err-write-timeout {code: write-timeout, status: 4352, summary: WriteTimeoutException}
      - &err-write-failure {code: write-failure, status: 5376, summary: WriteFailureException}
    behavior:
      - set: {ctx.consistency: "= input.consistency", ctx.hinted: [], ctx.phase: started}
      - when: "config['partition-denylist-enabled'] && config['denylist-writes-enabled']"
        title: Partition denylist check
        detail: "partition_denylist_enabled is commented out in conf/cassandra.yaml:1438 and defaults to false (Config.java:759), so this check is skipped in the deployed config."
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1122-1137"
        foreach: "= input.mutations"
        as: m
        steps:
          - call: partition-denylist.is-key-permitted
            input: {keyspace: "= vars.m.keyspace", table: "= vars.m.table", partition_key: "= vars.m.partition_key"}
            as: permit
          - if: "!vars.permit.value.permitted"
            then:
              - set: {ctx.phase: denylisted}
              - title: Write to a denylisted partition refused
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:1128-1134"
                fail: {code: invalid, status: 8704, message: "= 'Unable to write to denylisted partition [' + vars.m.partition_key + '] in ' + vars.m.keyspace + '/' + vars.m.table"}
      - title: Triggers
        detail: "TriggerExecutor.execute returns null when no table has triggers (none are configured); triggers/ has no owning area and is not modelled."
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1141"
      - call: view-manager.updates-affect-view
        input: {keyspace: "= input.mutations[0].keyspace", table: "= input.mutations[0].table"}
        as: view
      - if: "input.mutate_atomically || vars.view.value.affected"
        then:
          - set: {ctx.phase: atomic}
          - title: Logged batch or view update goes through the batchlog
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1151-1156"
            call: storage-proxy.mutate-atomically
            input:
              mutations: "= input.mutations"
              consistency: "= input.consistency"
              require_quorum_for_remove: "= vars.view.value.affected"
          - return: {consistency: "= input.consistency", path: atomic}
      - call: storage-proxy.mutate
        input: {mutations: "= input.mutations", consistency: "= input.consistency"}
        as: w
      - return: "= vars.w.value"

  - component: storage-proxy
    name: mutate
    kind: function
    summary: "Sends every mutation to its replicas, then waits for each response handler; for CL.ANY a timeout or failure turns into hints and success."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:878-957"]
    request:
      type: object
      required: [mutations, consistency]
      properties:
        mutations: {type: array, items: {type: object}}
        consistency: *consistency
    response: CoordinationWriteResult
    errors: [*err-unavailable, *err-overloaded, *err-write-timeout, *err-write-failure]
    behavior:
      - set:
          vars.write_type: "= size(input.mutations) <= 1 ? 'SIMPLE' : 'UNLOGGED_BATCH'"
          vars.handlers: []
          ctx.write_type: "= size(input.mutations) <= 1 ? 'SIMPLE' : 'UNLOGGED_BATCH'"
      - title: Send each mutation
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:889-895"
        foreach: "= input.mutations"
        as: m
        steps:
          - if: "has(vars.m.counter) && vars.m.counter"
            then:
              - call: storage-proxy.mutate-counter
                input: {mutation: "= vars.m", consistency: "= input.consistency"}
                as: h
            else:
              - call: storage-proxy.perform-write
                input: {mutation: "= vars.m", consistency: "= input.consistency", write_type: "= vars.write_type", performer: standard}
                as: h
          - set: {vars.handlers: "= vars.handlers + [vars.h.value]"}
      - title: Cheap quorum upgrade for non-counter writes
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:897-902"
        foreach: "= vars.handlers.filter(h, h.write_type != 'COUNTER')"
        as: hs
        steps:
          - call: abstract-write-response-handler.maybe-try-additional-replicas
            input: {plan: "= vars.hs.plan"}
      - title: Wait for each response handler
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:904-906"
        foreach: "= vars.handlers"
        as: hs
        steps:
          - call: abstract-write-response-handler.get
            input: "= vars.hs"
            as: done
            on_error:
              - if: "input.consistency == 'ANY' && (error.code == 'write-timeout' || error.code == 'write-failure')"
                then:
                  - title: CL.ANY hints every non-counter mutation instead of failing
                    source: "src/java/org/apache/cassandra/service/StorageProxy.java:908-912"
                    foreach: "= input.mutations.filter(x, !(has(x.counter) && x.counter))"
                    as: hm
                    steps:
                      - call: storage-proxy.hint-mutation
                        input: {mutation: "= vars.hm"}
                  - set: {ctx.phase: hinted for ANY}
                  - return: {consistency: ANY, path: hinted-for-any, write_type: "= vars.write_type", hinted: "= ctx.hinted"}
              - set: {ctx.phase: "= error.code"}
              - title: Write timeout, failure, unavailable or overload propagates to the client
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:915-946"
                fail: "= error"
      - set: {ctx.phase: written}
      - return:
          consistency: "= input.consistency"
          path: standard
          write_type: "= vars.write_type"
          acks: "= vars.done.value.acks"
          block_for: "= vars.done.value.block_for"
          hinted: "= has(ctx.hinted) ? ctx.hinted : []"

  - component: storage-proxy
    name: perform-write
    kind: function
    summary: "Builds the write replica plan (Unavailable when too few are live), picks the response handler and hands the mutation to the write performer, which sends and collects the acks."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1371-1395"]
    request:
      type: object
      required: [mutation, consistency, write_type, performer]
      properties:
        mutation: *mutation
        consistency: *consistency
        write_type: {type: string, enum: [SIMPLE, UNLOGGED_BATCH, COUNTER]}
        performer: {type: string, enum: [standard, counter, counter_on_coordinator]}
    response: CoordinationWriteHandlerState
    errors: [*err-unavailable, *err-overloaded]
    behavior:
      - call: replica-plans.for-write
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token", consistency: "= input.consistency", selector: write_normal}
        as: plan
      - call: abstract-replication-strategy.get-write-response-handler
        input: {consistency: "= input.consistency", strategy: "= vars.plan.value.strategy", live_and_down: "= vars.plan.value.live_and_down"}
        as: rh
      - title: The handler's timeout is the counter or the plain write timeout, from the request's start
        source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:152-159"
        set:
          vars.timeout: "= input.write_type == 'COUNTER' ? config['counter-write-request-timeout-ms'] : config['write-request-timeout-ms']"
          vars.start: "= now"
      - if: "input.performer == 'standard'"
        then:
          - title: standardWritePerformer sends to the hinted replicas on the MUTATION stage
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:226-230"
            call: storage-proxy.send-to-hinted-replicas
            input:
              mutation: "= input.mutation"
              plan: "= vars.plan.value"
              contacts: "= vars.plan.value.contacts"
              consistency: "= input.consistency"
              stage: MUTATION
              hint_on_failure: true
              block_for: "= vars.plan.value.block_for"
              timeout_ms: "= vars.timeout"
              await: true
            as: sent
            on_error: continue
        else:
          - title: Counter performers apply on the leader, then replicate to the others
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:238-251"
            call: storage-proxy.counter-write-task
            input: {mutation: "= input.mutation", plan: "= vars.plan.value", consistency: "= input.consistency", timeout_ms: "= vars.timeout"}
            as: sent
            on_error: continue
      - if: "!vars.sent.ok && !(vars.sent.error.code in ['write-failure', 'timeout'])"
        then:
          - title: Overloaded (hint backpressure) or another refusal before any send
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1585-1599"
            fail: "= vars.sent.error"
      - return:
          handler: "= vars.rh.value.handler"
          consistency: "= input.consistency"
          write_type: "= input.write_type"
          block_for: "= vars.plan.value.block_for"
          candidates: "= vars.rh.value.candidates"
          timeout_ms: "= vars.timeout"
          start_ms: "= vars.start"
          acks: "= size(ctx.write.acks_at.filter(t, t <= now)) + ctx.write.hint_ack"
          acks_at: "= ctx.write.acks_at"
          failure_events: "= ctx.write.failures"
          failures: "= size(ctx.write.failures.filter(f, f.t <= now))"
          failure_reasons: "= ctx.write.failures.filter(f, f.t <= now).map(f, f.reason)"
          hint_ack: "= ctx.write.hint_ack"
          join_ok: "= vars.sent.ok"
          hinted: "= ctx.write.hinted"
          plan: "= vars.plan.value"
  - component: storage-proxy
    name: send-to-hinted-replicas
    kind: function
    summary: "Hints every down contact in one HintRunnable, then sends to the live ones at once (applying locally on this node, MUTATION_REQ elsewhere) and waits for blockFor acks; a replica that fails or times out is hinted when its callback fails."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1475-1583"]
    request:
      type: object
      required: [mutation, plan, contacts, consistency]
      properties:
        mutation: *mutation
        plan: CoordinationReplicaPlan
        contacts: {type: array, items: {type: string}}
        consistency: *consistency
        stage: {type: string, enum: [MUTATION, COUNTER_MUTATION, VIEW_MUTATION]}
        hint_on_failure: {type: boolean, default: true}
        block_for: {type: integer, description: "acks still needed from these contacts"}
        timeout_ms: {type: integer}
        await: {type: boolean, default: true, description: "false for asynchronous writes (view updates): the sends go out, nothing waits"}
    response:
      type: object
      properties:
        acks: {type: integer}
        hinted: {type: array, items: {type: string}}
    errors:
      - *err-overloaded
      - {code: write-failure, status: 5376, summary: "the join can no longer reach blockFor; abstract-write-response-handler.get decides between WriteTimeout and WriteFailure"}
      - {code: timeout, retryable: true, summary: "the join timed out at the write timeout"}
    behavior:
      - set:
          vars.to_hint: []
          vars.live: []
          vars.block_for: "= has(input.block_for) ? input.block_for : (has(input.plan.block_for) ? input.plan.block_for : size(input.contacts))"
          vars.timeout: "= has(input.timeout_ms) ? input.timeout_ms : config['write-request-timeout-ms']"
          ctx.write: {acks_at: [], failures: [], hint_ack: 0, hinted: []}
      - foreach: "= input.contacts"
        as: r
        steps:
          - call: storage-proxy.check-hint-overload
            input: {replica: "= vars.r"}
          - if: "vars.r in input.plan.live"
            then:
              - set: {vars.live: "= vars.live + [vars.r]"}
            else:
              - title: Replica is down; its response is marked expired and it may be hinted
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:1549-1560"
                call: storage-proxy.should-hint
                input: {replica: "= vars.r"}
                as: sh
              - when: "vars.sh.value.should_hint"
                set: {vars.to_hint: "= vars.to_hint + [vars.r]"}
      - when: "size(vars.to_hint) > 0"
        title: Hint every replica known to be down in one HintRunnable
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1563-1564"
        call: storage-proxy.submit-hint
        input: {mutation: "= input.mutation", targets: "= vars.to_hint", consistency: "= input.consistency"}
      - title: For CL.ANY the stored hint counts as the acknowledgement
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:2813-2815"
        set:
          ctx.write.hint_ack: "= size(vars.to_hint) > 0 && input.consistency == 'ANY' ? 1 : 0"
          ctx.write.hinted: "= vars.to_hint"
          ctx.hinted: "= (has(ctx.hinted) ? ctx.hinted : []) + vars.to_hint"
      - title: "Send to every live contact at once: apply locally on this node, MUTATION_REQ to the others; wait for blockFor acks or the write timeout"
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1566-1576"
        parallel: "= vars.live"
        as: r
        join: {need: "= (!has(input.await) || input.await) ? math.greatest(0, vars.block_for - ctx.write.hint_ack) : 0"}
        timeout_ms: "= vars.timeout"
        on_insufficient: {code: write-failure, status: 5376}
        as_result: join
        steps:
          - if: "vars.r == self"
            then:
              - title: The coordinator is a replica, so it applies the mutation locally instead of messaging itself
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:1566-1570"
                call: storage-proxy.perform-locally
                input: {mutation: "= input.mutation", stage: "= has(input.stage) ? input.stage : 'MUTATION'"}
                as: local
              - if: "!vars.local.value.ok"
                then:
                  - set: {ctx.write.failures: "= ctx.write.failures + [{'replica': vars.r, 'reason': 'UNKNOWN', 't': now}]"}
                  - fail: {code: "= vars.local.value.reason", message: local apply failed}
            else:
              - call: mutation-verb-handler.do-verb
                on: "= vars.r"
                input: {from: "= self", mutation: "= input.mutation"}
                timeout_ms: "= vars.timeout"
                as: resp
                on_error: continue
              - if: "!vars.resp.ok"
                then:
                  - title: "No ack: the callback expires (TIMEOUT) or the replica answers with a failure"
                    source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:293-311"
                    set:
                      ctx.write.failures: "= ctx.write.failures + [{'replica': vars.r, 'reason': vars.resp.error.code == 'timeout' ? 'TIMEOUT' : 'UNKNOWN', 't': now}]"
                  - if: "!has(input.hint_on_failure) || input.hint_on_failure"
                    then:
                      - call: storage-proxy.should-hint
                        input: {replica: "= vars.r"}
                        as: shf
                      - if: "vars.shf.value.should_hint"
                        then:
                          - title: onFailure hints the failed replica (hintOnFailure), when its callback fails
                            source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:309-310"
                            call: storage-proxy.submit-hint
                            input: {mutation: "= input.mutation", targets: ["= vars.r"]}
                          - set:
                              ctx.write.hinted: "= ctx.write.hinted + [vars.r]"
                              ctx.hinted: "= (has(ctx.hinted) ? ctx.hinted : []) + [vars.r]"
                  - fail: "= vars.resp.error"
          - call: write-response-handler.on-response
            input: {from: "= vars.r", acks: "= size(ctx.write.acks_at)", block_for: "= vars.block_for"}
          - set: {ctx.write.acks_at: "= ctx.write.acks_at + [now]"}
      - return: {acks: "= vars.join.received + ctx.write.hint_ack", hinted: "= ctx.write.hinted"}
  - component: storage-proxy
    name: perform-locally
    kind: function
    summary: "Runs a LocalMutationRunnable on the stage: applies the mutation on this node and reports success or failure to the response handler."
    sources:
      - "src/java/org/apache/cassandra/service/StorageProxy.java:1674-1707"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:2623-2680"
    request:
      type: object
      required: [mutation]
      properties:
        mutation: *mutation
        stage: {type: string}
    response: {type: object, properties: {ok: {type: boolean}, reason: {type: string}}}
    behavior:
      - call: keyspace.apply
        input: {mutation: "= input.mutation"}
        as: applied
        on_error:
          - title: Local apply failed; the handler records a failure from this node
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1685-1690"
            return: {ok: false, reason: "= error.code"}
      - return: {ok: true, reason: ""}
  - component: storage-proxy
    name: check-hint-overload
    kind: function
    summary: "Refuses the write with Overloaded when too many hints are in flight and this replica already has some."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1585-1599"]
    request: {type: object, required: [replica], properties: {replica: {type: string, examples: ["n2"]}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors: [*err-overloaded]
    behavior:
      - if: "state.total_hints_in_progress > state.max_hints_in_progress && input.replica in state.hints_in_progress && state.hints_in_progress[input.replica] > 0"
        then:
          - call: storage-proxy.should-hint
            input: {replica: "= input.replica"}
            as: sh
          - if: "vars.sh.value.should_hint"
            then:
              - set: {ctx.phase: overloaded}
              - title: Too many hints in flight
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:1592-1597"
                fail: {code: overloaded, status: 4097, message: "= 'Too many in flight hints: ' + string(state.total_hints_in_progress) + ' destination: ' + input.replica"}
      - return: {ok: true}

  - component: storage-proxy
    name: should-hint
    kind: function
    summary: "Whether to store a hint for a replica: hinted handoff on, not self, DC not disabled, still in the ring, down less than max_hint_window, under the size cap."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2423-2501"]
    request:
      type: object
      properties:
        replica: {type: string, examples: ["n3"]}
        endpoint: {type: string, description: "alias of replica used by some callers"}
        try_enable_persistent_window: {type: boolean, default: true}
    response:
      type: object
      properties:
        should_hint: {type: boolean, default: true}
        reason: {type: string}
    behavior:
      - set:
          vars.ep: "= has(input.replica) ? input.replica : input.endpoint"
          vars.persistent: "= !has(input.try_enable_persistent_window) || input.try_enable_persistent_window"
      - if: "!config['hinted-handoff-enabled']"
        then:
          - title: hinted_handoff_enabled is false
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:2444-2447"
            return: {should_hint: false, reason: hinted handoff disabled}
      - if: "vars.ep == self"
        then:
          - return: {should_hint: false, reason: replica is self}
      - if: "size(config['hinted-handoff-disabled-datacenters']) > 0"
        then:
          - call: simple-snitch.get-datacenter
            input: {endpoint: "= vars.ep"}
            as: dc
          - if: "vars.dc.value.datacenter in config['hinted-handoff-disabled-datacenters']"
            then:
              - title: Hints disabled for the replica's datacenter
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:2449-2458"
                return: {should_hint: false, reason: datacenter disabled}
      - call: gossiper.get-endpoint-downtime
        input: {endpoint: "= vars.ep"}
        as: down
      - set: {vars.expired: "= vars.down.value.downtime_ms > config['max-hint-window-ms']"}
      - title: StorageService.getHostIdForEndpoint reads TokenMetadata's host id
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:2465"
        call: token-metadata.get-host-id
        input: {endpoint: "= vars.ep"}
        as: hid
      - if: "!has(vars.hid.value.host_id) || vars.hid.value.host_id == ''"
        then:
          - title: Endpoint is no longer part of the ring
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:2465-2470"
            return: {should_hint: false, reason: not part of ring}
      - if: "vars.persistent && config['hint-window-persistent-enabled'] && !vars.expired"
        then:
          - title: Persistent hint window
            detail: "hint_window_persistent_enabled (Config.java:117, true): the window also expires once the oldest stored hint for this host is older than max_hint_window."
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:2473-2479"
            call: hints-service.find-oldest-hint-timestamp
            input: {host_id: "= vars.hid.value.host_id"}
            as: oldest
          - set: {vars.expired: "= now - config['max-hint-window-ms'] > vars.oldest.value.timestamp"}
      - if: "vars.expired"
        then:
          - title: Replica down longer than max_hint_window (3h)
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:2481-2486"
            return: {should_hint: false, reason: hint window expired}
      - if: "config['max-hints-size-per-host-bytes'] > 0"
        then:
          - call: hints-service.get-total-hints-size
            input: {host_id: "= vars.hid.value.host_id"}
            as: size
          - if: "vars.size.value.bytes > config['max-hints-size-per-host-bytes']"
            then:
              - title: Hints for this host reached max_hints_size_per_host
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:2488-2498"
                return: {should_hint: false, reason: hints size limit}
      - return: {should_hint: true, reason: ok}
  - component: storage-proxy
    name: hint-mutation
    kind: function
    summary: "CL.ANY fallback: hints a mutation for every replica, live or down, that shouldHint accepts, in one HintRunnable."
    sources:
      - "src/java/org/apache/cassandra/service/StorageProxy.java:977-989"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:968-975"
    request: {type: object, required: [mutation], properties: {mutation: *mutation}}
    response: {type: object, properties: {hinted: {type: array, items: {type: string}}}}
    behavior:
      - call: replica-layout.for-token-write-live-and-down
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token"}
        as: layout
      - set: {vars.targets: []}
      - foreach: "= vars.layout.value.all"
        as: r
        steps:
          - call: storage-proxy.should-hint
            input: {replica: "= vars.r"}
            as: sh
          - when: "vars.sh.value.should_hint"
            set: {vars.targets: "= vars.targets + [vars.r]"}
      - when: "size(vars.targets) > 0"
        title: One submitHint for every target
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:988"
        call: storage-proxy.submit-hint
        input: {mutation: "= input.mutation", targets: "= vars.targets"}
      - set: {ctx.hinted: "= (has(ctx.hinted) ? ctx.hinted : []) + vars.targets"}
      - return: {hinted: "= vars.targets"}
  # ----------------------------------------------------------- counters
  - component: storage-proxy
    name: mutate-counter
    kind: function
    summary: "Counter write: picks a live leader replica; applies on this node if it is the leader, else forwards COUNTER_MUTATION_REQ to the leader and waits for one ack."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1723-1755"]
    request:
      type: object
      required: [mutation, consistency]
      properties:
        mutation: *mutation
        consistency: *consistency
    response: CoordinationWriteHandlerState
    errors: [*err-unavailable, *err-overloaded]
    behavior:
      - call: storage-proxy.find-suitable-replica
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token", consistency: "= input.consistency"}
        as: leader
      - if: "vars.leader.value.endpoint == vars.leader.value.local"
        then:
          - set: {ctx.counter_leader: self}
          - title: This node is the leader; apply here and replicate
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1727-1730"
            call: storage-proxy.perform-write
            input: {mutation: "= input.mutation", consistency: "= input.consistency", write_type: COUNTER, performer: counter_on_coordinator}
            as: h
          - return: "= vars.h.value"
      - set: {ctx.counter_leader: "= vars.leader.value.endpoint"}
      - title: Fail fast if the consistency level cannot be met (plan built only for its sufficiency check)
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1733-1739"
        call: replica-plans.for-write
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token", consistency: "= input.consistency", selector: write_all}
      - set: {vars.start: "= now"}
      - title: Forward the counter mutation to the leader
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1746-1752"
        call: counter-mutation-verb-handler.do-verb
        on: "= vars.leader.value.endpoint"
        input: {from: "= self", counter_mutation: {mutation: "= input.mutation", consistency: "= input.consistency"}}
        timeout_ms: "= config['counter-write-request-timeout-ms']"
        as: fwd
        on_error: continue
      - return:
          handler: WriteResponseHandler
          consistency: ONE
          write_type: COUNTER
          block_for: 1
          candidates: 1
          timeout_ms: "= config['counter-write-request-timeout-ms']"
          start_ms: "= vars.start"
          acks: "= vars.fwd.ok ? 1 : 0"
          acks_at: "= vars.fwd.ok ? [now] : []"
          failure_events: "= vars.fwd.ok ? [] : [{'replica': vars.leader.value.endpoint, 'reason': vars.fwd.error.code == 'timeout' ? 'TIMEOUT' : 'UNKNOWN', 't': now}]"
          failures: "= vars.fwd.ok ? 0 : 1"
          failure_reasons: "= vars.fwd.ok ? [] : [vars.fwd.error.code == 'timeout' ? 'TIMEOUT' : 'UNKNOWN']"
          hint_ack: 0
          join_ok: "= vars.fwd.ok"
          hinted: []
          plan: {contacts: ["= vars.leader.value.endpoint"], live_uncontacted: []}

  - component: storage-proxy
    name: find-suitable-replica
    kind: function
    summary: "Counter leader choice: a random live, RPC-ready natural replica in the local datacenter; Unavailable if none is live."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1767-1802"]
    request:
      type: object
      required: [keyspace, token, consistency]
      properties:
        keyspace: {type: string, examples: [shop]}
        token: {type: integer, examples: [100]}
        consistency: *consistency
    response: {type: object, properties: {endpoint: {type: string}, local: {type: string}}}
    errors: [*err-unavailable]
    behavior:
      - call: abstract-replication-strategy.get-natural-replicas-for-token
        input: {keyspace: "= input.keyspace", token: "= input.token"}
        as: nat
      - set: {vars.ready: []}
      - foreach: "= vars.nat.value.replicas"
        as: r
        steps:
          - call: storage-service.is-rpc-ready
            input: {endpoint: "= vars.r"}
            as: rpc
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.r"}
            as: alive
          - when: "vars.rpc.value.ready && vars.alive.value.alive"
            set: {vars.ready: "= vars.ready + [vars.r]"}
      - if: "size(vars.ready) == 0"
        then:
          - call: consistency-level.block-for
            input: {consistency: "= input.consistency", rf: "= vars.nat.value.rf", strategy: "= vars.nat.value.strategy"}
            as: bf
          - title: No live replica can lead the counter update
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1781-1783"
            fail: {code: unavailable, status: 4096, message: "= 'Cannot achieve consistency level ' + input.consistency", data: {consistency: "= input.consistency", required: "= vars.bf.value.block_for", alive: 0}}
      - title: Pick a random replica in the local datacenter (every node is in datacenter1 under SimpleSnitch)
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1785-1801"
        choice: leader
        default: first
        options:
          first: [{set: {vars.idx: 0}}]
          second: [{set: {vars.idx: 1}}]
          third: [{set: {vars.idx: 2}}]
      - return: {endpoint: "= vars.ready[math.least(vars.idx, size(vars.ready) - 1)]", local: "= self"}

  - component: storage-proxy
    name: counter-write-task
    kind: function
    summary: "On the leader (COUNTER_MUTATION stage): read-modify-write the counter locally, count that as one ack, then send the resulting mutation to the other replicas."
    sources:
      - "src/java/org/apache/cassandra/service/StorageProxy.java:1820-1838"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:238-251"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:1806-1818"
    request:
      type: object
      required: [mutation, plan, consistency]
      properties:
        mutation: *mutation
        plan: CoordinationReplicaPlan
        consistency: *consistency
        timeout_ms: {type: integer}
    response:
      type: object
      properties:
        acks: {type: integer}
        hinted: {type: array, items: {type: string}}
    errors:
      - {code: write-failure, status: 5376, summary: "the replication join can no longer reach blockFor"}
      - {code: timeout, retryable: true, summary: "the replication join timed out"}
    behavior:
      - call: counter-mutation.apply-counter-mutation
        input: {mutation: "= input.mutation", consistency: "= input.consistency"}
        as: applied
      - title: The leader's own apply is the first ack
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1834-1835"
        call: write-response-handler.on-response
        input: {from: "= self", acks: 0, block_for: "= input.plan.block_for"}
      - set: {vars.leader_ack: "= now"}
      - title: Replicate the resulting mutation to every other replica (no hint on failure for counters); blockFor - 1 more acks are needed
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1835"
        call: storage-proxy.send-to-hinted-replicas
        input:
          mutation: "= has(vars.applied.value.mutation) ? vars.applied.value.mutation : input.mutation"
          plan: "= input.plan"
          contacts: "= input.plan.contacts.filter(e, e != self)"
          consistency: "= input.consistency"
          stage: COUNTER_MUTATION
          hint_on_failure: false
          block_for: "= input.plan.block_for - 1"
          timeout_ms: "= has(input.timeout_ms) ? input.timeout_ms : config['counter-write-request-timeout-ms']"
          await: true
        as: sent
        on_error:
          - set: {ctx.write.acks_at: "= [vars.leader_ack] + ctx.write.acks_at"}
          - fail: "= error"
      - set: {ctx.write.acks_at: "= [vars.leader_ack] + ctx.write.acks_at"}
      - return: {acks: "= vars.sent.value.acks + 1", hinted: "= vars.sent.value.hinted"}
  # ============================================================ StorageProxy: reads
  - component: storage-proxy
    name: read
    kind: function
    summary: "Coordinator entry for single-partition reads: refuses while bootstrapping, checks the denylist, sends SERIAL reads to Paxos and the rest to readRegular."
    sources:
      - "src/java/org/apache/cassandra/service/StorageProxy.java:1858-1886"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:1888-1896"
    request: CoordinationReadRequest
    response: CoordinationReadResult
    errors:
      - *err-invalid
      - *err-unavailable
      - &err-is-bootstrapping {code: is-bootstrapping, status: 4098, summary: IsBootstrappingException}
      - &err-read-timeout {code: read-timeout, status: 4608, summary: ReadTimeoutException}
      - &err-read-failure {code: read-failure, status: 4864, summary: ReadFailureException}
    behavior:
      - set: {ctx.consistency: "= input.consistency"}
      - call: storage-proxy.is-safe-to-perform-read
        input: {keyspaces: ["= input.read_command.keyspace"]}
        as: safe
      - if: "!vars.safe.value.safe"
        then:
          - set: {ctx.phase: bootstrapping}
          - title: A bootstrapping node refuses non-system reads
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1861-1868"
            fail: {code: is-bootstrapping, status: 4098, message: Cannot read from a bootstrapping node}
      - when: "config['partition-denylist-enabled'] && config['denylist-reads-enabled']"
        title: Partition denylist check (off in the deployed config)
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:1870-1881"
        call: partition-denylist.is-key-permitted
        input: {keyspace: "= input.read_command.keyspace", table: "= input.read_command.table", partition_key: "= input.read_command.partition_key"}
        as: permit
      - if: "config['partition-denylist-enabled'] && config['denylist-reads-enabled'] && !vars.permit.value.permitted"
        then:
          - fail: {code: invalid, status: 8704, message: "= 'Unable to read denylisted partition [' + input.read_command.partition_key + ']'"}
      - if: "input.consistency == 'SERIAL' || input.consistency == 'LOCAL_SERIAL'"
        then:
          - title: SERIAL and LOCAL_SERIAL reads go through Paxos
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1883-1885"
            call: storage-proxy.read-with-paxos
            input: {read_command: "= input.read_command", consistency: "= input.consistency"}
            as: px
          - return: "= vars.px.value"
      - call: storage-proxy.read-regular
        input: {read_command: "= input.read_command", consistency: "= input.consistency"}
        as: r
      - return: "= vars.r.value"

  - component: storage-proxy
    name: is-safe-to-perform-read
    kind: function
    summary: "Reads are safe unless this node is bootstrapping; queries that touch only local system keyspaces are always safe."
    sources:
      - "src/java/org/apache/cassandra/service/StorageProxy.java:1888-1896"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:1840-1846"
    request:
      type: object
      properties:
        keyspaces: {type: array, items: {type: string}, description: "keyspaces of the queries; omitted for the no-argument overload"}
    response: {type: object, properties: {safe: {type: boolean, default: true}}}
    behavior:
      - call: storage-service.is-bootstrap-mode
        as: bs
      - set: {vars.system_only: "= has(input.keyspaces) && size(input.keyspaces) > 0 && input.keyspaces.all(k, k in ['system', 'system_schema'])"}
      - return: {safe: "= !vars.bs.value.bootstrap_mode || vars.system_only"}

  - component: storage-proxy
    name: read-one
    kind: function
    summary: "Single-partition read of one command (used by the CAS precondition read)."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1848-1852"]
    request: CoordinationReadRequest
    response: CoordinationReadResult
    errors: [*err-unavailable, *err-is-bootstrapping, *err-read-timeout, *err-read-failure]
    behavior:
      - call: storage-proxy.read
        input: {read_command: "= input.read_command", consistency: "= input.consistency"}
        as: r
      - return: "= vars.r.value"

  - component: storage-proxy
    name: read-regular
    kind: function
    summary: "Non-serial read: fetchRows, recording unavailable, timeout and failure metrics before rethrowing."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2004-2059"]
    request: CoordinationReadRequest
    response: CoordinationReadResult
    errors: [*err-unavailable, *err-read-timeout, *err-read-failure]
    behavior:
      - call: storage-proxy.fetch-rows
        input: {read_command: "= input.read_command", consistency: "= input.consistency"}
        as: rows
        on_error:
          - set: {ctx.phase: "= error.code"}
          - title: Unavailable, read timeout and read failure are counted, then rethrown
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:2021-2043"
            fail: "= error"
      - set: {ctx.phase: read}
      - return: "= vars.rows.value"

  - component: storage-proxy
    name: fetch-rows
    kind: function
    summary: "Runs the read executor: data and digest requests to the contacts at once (with a speculative request after the sampled latency), wait for blockFor responses, read-repair on a digest mismatch, then block on the repair writes."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2106-2176"]
    request: CoordinationReadRequest
    response: CoordinationReadResult
    errors: [*err-unavailable, *err-read-timeout, *err-read-failure]
    behavior:
      - call: abstract-read-executor.get-read-executor
        input: {command: "= input.read_command", consistency: "= input.consistency"}
        as: ex
      - set: {ctx.read: {start: "= now", responses: [], contacts: "= vars.ex.value.plan.contacts"}}
      - call: abstract-read-executor.execute-async
        input: {executor: "= vars.ex.value"}
        as: sent
        on_error: continue
      - call: abstract-read-executor.await-responses
        input: {executor: "= vars.ex.value", join_ok: "= vars.sent.ok"}
        as: aw
      - if: "vars.aw.value.repair_started"
        then:
          - call: abstract-read-executor.await-read-repair
            input: {executor: "= vars.ex.value"}
            as: rr
          - set: {vars.result: "= vars.rr.value.result", vars.repairs: "= vars.rr.value.result.partition_repairs"}
        else:
          - set: {vars.result: "= vars.aw.value.result", vars.repairs: []}
      - call: storage-proxy.concat-and-block-on-repair
        input: {repairs: "= vars.repairs"}
      - return:
          rows: "= vars.result.partitions"
          timestamp: "= vars.result.timestamp"
          repaired: "= vars.repairs.map(x, x.targets).flatten()"
  - component: storage-proxy
    name: concat-and-block-on-repair
    kind: function
    summary: "When the result is consumed, waits for every partition repair to be acknowledged (speculative repair writes already went out after the additional-write latency)."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2067-2093"]
    request: {type: object, properties: {repairs: {type: array, items: {type: object}}}}
    response: {type: object, properties: {repairs: {type: integer}}}
    errors: [*err-read-timeout]
    behavior:
      - set: {vars.pending: "= input.repairs.filter(r, has(r.targets) && size(r.targets) > 0)"}
      - foreach: "= vars.pending"
        as: rp
        steps:
          - call: blocking-read-repair.await-writes
            input: {repair: "= vars.rp"}
      - return: {repairs: "= size(vars.pending)"}
  - component: storage-proxy-local-read-runnable
    name: run
    kind: function
    summary: "Executes the read command on this node, builds the ReadResponse and hands it to the callback (or a failure: tombstones, unknown)."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2195-2257"]
    request:
      type: object
      required: [read_command, replica]
      properties:
        read_command: *read_command
        replica: {type: string, examples: ["n1"]}
    response: CoordinationReplicaResponse
    behavior:
      - call: read-command.execute-locally
        input: {read_command: "= input.read_command"}
        as: res
        on_error:
          - title: A local read failure is reported to the callback as a failure from this node
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:2243-2254"
            call: read-callback.on-failure
            input: {from: "= input.replica", code: "= error.code", is_digest: "= has(input.read_command.digest) && input.read_command.digest"}
            as: f
          - return: "= vars.f.value"
      - title: createResponse builds the data or digest response from the local result
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:2207-2211"
        call: read-command.create-response
        input: {read_command: "= input.read_command", result: "= vars.res.value"}
        as: resp
      - title: handler.response(response) feeds ReadCallback.onResponse
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:2228-2231"
        call: read-callback.on-response
        input: {from: "= input.replica", response: "= vars.resp.value", is_digest: "= has(input.read_command.digest) && input.read_command.digest"}
        as: rec
      - return: "= vars.rec.value"
  # ------------------------------------------------------------- range reads
  - component: storage-proxy
    name: get-range-slice
    kind: function
    summary: "Coordinator entry for range scans and secondary index queries: denylist check, then RangeCommands."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2277-2294"]
    request: CoordinationRangeReadRequest
    response: CoordinationReadResult
    errors: [*err-invalid, *err-unavailable, *err-read-timeout, *err-read-failure]
    behavior:
      - set: {ctx.consistency: "= input.consistency"}
      - when: "config['partition-denylist-enabled'] && config['denylist-range-reads-enabled']"
        title: Denylisted keys inside the range refuse the scan (off in the deployed config)
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:2281-2292"
        call: partition-denylist.get-denied-keys-in-range-count
        input: {keyspace: "= input.command.keyspace", table: "= input.command.table"}
        as: denied
      - if: "config['partition-denylist-enabled'] && config['denylist-range-reads-enabled'] && vars.denied.value.count > 0"
        then:
          - fail: {code: invalid, status: 8704, message: "= 'Attempted to read a range containing ' + string(vars.denied.value.count) + ' denylisted keys'"}
      - call: range-commands.partitions
        input: {command: "= input.command", consistency: "= input.consistency"}
        as: p
      - return: "= vars.p.value"

  - component: range-commands
    name: partitions
    kind: function
    summary: "Splits the range into per-token pieces, merges pieces whose live replicas overlap enough, and queries them."
    sources:
      - "src/java/org/apache/cassandra/service/reads/range/RangeCommands.java:56-66"
      - "src/java/org/apache/cassandra/service/reads/range/RangeCommands.java:69-116"
    request: CoordinationRangeReadRequest
    response: CoordinationReadResult
    errors: [*err-unavailable, *err-read-timeout, *err-read-failure]
    behavior:
      - call: replica-plan-iterator.get-restricted-ranges
        input: {keyspace: "= input.command.keyspace", start_token: "= input.command.start_token", end_token: "= input.command.end_token"}
        as: ranges
      - title: Concurrency factor
        detail: "concurrencyFactor = ceil(limit / estimated rows per range), capped at min(ranges, 10 * cores). The model queries the merged plans one after another."
        source: "src/java/org/apache/cassandra/service/reads/range/RangeCommands.java:84-101"
      - call: replica-plan-merger.merge
        input: {keyspace: "= input.command.keyspace", consistency: "= input.consistency", ranges: "= vars.ranges.value.ranges"}
        as: merged
      - set: {ctx.range_count: "= size(vars.ranges.value.ranges)", ctx.range_plans: "= size(vars.merged.value.plans)"}
      - call: range-command-iterator.send-next-requests
        input: {command: "= input.command", consistency: "= input.consistency", plans: "= vars.merged.value.plans"}
        as: res
      - return: "= vars.res.value"

  - component: replica-plan-iterator
    name: get-restricted-ranges
    kind: function
    summary: "Cuts the queried range at every ring token: (min, t1], (t1, t2], ..., (tn, min]."
    sources: ["src/java/org/apache/cassandra/service/reads/range/ReplicaPlanIterator.java:91-131"]
    request:
      type: object
      properties:
        keyspace: {type: string}
        start_token: {type: integer}
        end_token: {type: integer}
    response: {type: object, properties: {ranges: {type: array, items: {type: object}}}}
    behavior:
      - call: token-metadata.sorted-tokens
        as: ring
      - set: {vars.tokens: "= vars.ring.value.ring.map(t, t.token).sort()", vars.ranges: [], vars.left: "= input.start_token"}
      - foreach: "= vars.tokens"
        as: t
        steps:
          - set: {vars.ranges: "= vars.ranges + [{'left': vars.left, 'right': vars.t}]", vars.left: "= vars.t"}
      - set: {vars.ranges: "= vars.ranges + [{'left': vars.left, 'right': input.end_token}]"}
      - return: {ranges: "= vars.ranges"}

  - component: replica-plan-merger
    name: merge
    kind: function
    summary: "Builds a range replica plan per piece and merges consecutive plans while their shared live candidates still meet the consistency level."
    sources:
      - "src/java/org/apache/cassandra/service/reads/range/ReplicaPlanMerger.java:46-72"
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:774-793"
    request:
      type: object
      properties:
        keyspace: {type: string}
        consistency: {type: string}
        ranges: {type: array, items: {type: object}}
    response: {type: object, properties: {plans: {type: array, items: {type: object}}}}
    errors: [*err-unavailable]
    behavior:
      - set: {vars.plans: [], vars.cur: null}
      - foreach: "= input.ranges"
        as: rg
        steps:
          - call: replica-plans.for-range-read
            input: {keyspace: "= input.keyspace", consistency: "= input.consistency", left: "= vars.rg.left", right: "= vars.rg.right"}
            as: p
          - if: "vars.cur == null"
            then:
              - set: {vars.cur: "= vars.p.value"}
            else:
              - set: {vars.shared: "= vars.cur.candidates.filter(e, e in vars.p.value.candidates)"}
              - if: "vars.cur.right != vars.cur.min_token && size(vars.shared) >= vars.cur.block_for"
                then:
                  - set:
                      vars.cur: "= {'keyspace': vars.cur.keyspace, 'consistency': vars.cur.consistency, 'left': vars.cur.left, 'right': vars.rg.right, 'min_token': vars.cur.min_token, 'candidates': vars.shared, 'contacts': vars.shared.slice(0, math.least(vars.cur.block_for, size(vars.shared))), 'block_for': vars.cur.block_for, 'rf': vars.cur.rf, 'local': vars.cur.local, 'vnodes': vars.cur.vnodes + 1}"
                else:
                  - set: {vars.plans: "= vars.plans + [vars.cur]", vars.cur: "= vars.p.value"}
      - when: "vars.cur != null"
        set: {vars.plans: "= vars.plans + [vars.cur]"}
      - return: {plans: "= vars.plans"}

  - component: range-command-iterator
    name: send-next-requests
    kind: function
    summary: "Queries each merged sub-range and concatenates the resolved partitions (blocking on any read repair)."
    sources:
      - "src/java/org/apache/cassandra/service/reads/range/RangeCommandIterator.java:223-256"
      - "src/java/org/apache/cassandra/service/reads/range/RangeCommandIterator.java:101-149"
    request:
      type: object
      properties:
        command: {type: object}
        consistency: {type: string}
        plans: {type: array, items: {type: object}}
    response: CoordinationReadResult
    errors: [*err-unavailable, *err-read-timeout, *err-read-failure]
    behavior:
      - set: {vars.rows: [], vars.repairs: [], vars.queried: 0}
      - foreach: "= input.plans"
        as: p
        steps:
          - call: range-command-iterator.query
            input: {command: "= input.command", consistency: "= input.consistency", plan: "= vars.p"}
            on_error: continue
          - call: single-range-response.compute-next
            input: {command: "= input.command", consistency: "= input.consistency", plan: "= vars.p"}
            as: q
          - set:
              vars.rows: "= vars.rows + vars.q.value.partitions"
              vars.repairs: "= vars.repairs + vars.q.value.partition_repairs"
              vars.queried: "= vars.queried + vars.p.vnodes"
      - set: {ctx.ranges_queried: "= vars.queried"}
      - call: storage-proxy.concat-and-block-on-repair
        input: {repairs: "= vars.repairs"}
      - return: {rows: "= vars.rows"}
  - component: range-command-iterator
    name: query
    kind: function
    summary: "Queries one sub-range: locally on the READ stage when this node is the only contact, else RANGE_REQ to every contact at once, waiting for all of them until range_request_timeout."
    sources: ["src/java/org/apache/cassandra/service/reads/range/RangeCommandIterator.java:188-221"]
    request:
      type: object
      properties:
        command: {type: object}
        consistency: {type: string}
        plan: {type: object}
    response: {type: object, properties: {received: {type: integer}}}
    errors:
      - {code: read-failure, status: 4864, summary: "a contact failed; single-range-response.compute-next classifies it"}
      - {code: timeout, retryable: true, summary: "range_request_timeout passed"}
    behavior:
      - set:
          vars.cmd: "= {'kind': 'partition_range', 'keyspace': input.command.keyspace, 'table': input.command.table, 'start_token': input.plan.left, 'end_token': input.plan.right, 'limit': has(input.command.limit) ? input.command.limit : 100, 'digest': false}"
          ctx.range: {responses: [], start: "= now"}
      - if: "size(input.plan.contacts) == 1 && input.plan.contacts[0] == self"
        then:
          - title: Only this node is contacted, so the range is read locally on the READ stage
            source: "src/java/org/apache/cassandra/service/reads/range/RangeCommandIterator.java:205-208"
            call: storage-proxy-local-read-runnable.run
            input: {read_command: "= vars.cmd", replica: "= self"}
            as: lr
          - set: {ctx.range.responses: "= [merge(vars.lr.value, {'t': now})]"}
          - return: {received: "= vars.lr.value.ok ? 1 : 0"}
      - title: Send RANGE_REQ (data, never digest) to every contact at once, this node included through messaging; there is no speculation for ranges
        source: "src/java/org/apache/cassandra/service/reads/range/RangeCommandIterator.java:209-218"
        parallel: "= input.plan.contacts"
        as: r
        join: {need: "= input.plan.block_for"}
        timeout_ms: "= config['range-request-timeout-ms']"
        on_insufficient: {code: read-failure, status: 4864}
        as_result: join
        steps:
          - call: read-command-verb-handler.do-verb
            on: "= vars.r"
            input: {from: "= self", read_command: "= vars.cmd"}
            timeout_ms: "= config['range-request-timeout-ms']"
            as: resp
            on_error: continue
          - if: "vars.resp.ok"
            then:
              - call: read-callback.on-response
                input: {from: "= vars.r", response: "= vars.resp.value", is_digest: false}
                as: rec
            else:
              - call: read-callback.on-failure
                input: {from: "= vars.r", code: "= vars.resp.error.code", is_digest: false}
                as: rec
          - set: {ctx.range.responses: "= ctx.range.responses + [merge(vars.rec.value, {'t': now})]"}
          - if: "!vars.rec.value.ok"
            then:
              - fail: {code: "= vars.rec.value.reason", message: range read failed}
      - return: {received: "= vars.join.received"}

  - component: single-range-response
    name: compute-next
    kind: function
    summary: "Waits on the sub-range's read callback (the responses received by now), then resolves the data through the DataResolver."
    sources:
      - "src/java/org/apache/cassandra/service/reads/range/SingleRangeResponse.java:52-75"
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:735"
    request:
      type: object
      properties:
        command: {type: object}
        consistency: {type: string}
        plan: {type: object}
    response: {type: object, properties: {partitions: {type: array, items: {type: object}}, timestamp: {type: integer}, partition_repairs: {type: array, items: {type: object}}}}
    errors: [*err-read-timeout, *err-read-failure]
    behavior:
      - set: {vars.responses: "= ctx.range.responses.filter(r, r.t <= now)"}
      - call: read-callback.await-results
        input: {responses: "= vars.responses", block_for: "= input.plan.block_for", contacts_count: "= size(input.plan.contacts)", consistency: "= input.consistency"}
      - call: data-resolver.resolve
        input:
          command: "= input.command"
          responses: "= vars.responses.filter(x, x.ok)"
          consistency: "= input.consistency"
          read_repair: BLOCKING
          keyspace: "= input.command.keyspace"
          token: "= input.plan.right"
        as: res
      - return: "= vars.res.value"
  # ------------------------------------------------------------- truncate
  - component: storage-proxy
    name: truncate-blocking
    kind: function
    summary: "TRUNCATE: requires every token owner to be up, sends TRUNCATE_REQ to every live ring member and waits for all of them."
    sources:
      - "src/java/org/apache/cassandra/service/StorageProxy.java:2511-2545"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:2551-2554"
    request:
      type: object
      required: [keyspace, table]
      properties:
        keyspace: {type: string, examples: [shop]}
        table: {type: string, examples: [users]}
    response: {type: object, properties: {truncated: {type: boolean}, responses: {type: integer}}}
    errors:
      - *err-unavailable
      - &err-timeout {code: timeout, summary: "java.util.concurrent.TimeoutException; TruncateStatement wraps it in TruncateException (truncate-error, 0x1003)"}
      - &err-truncate {code: truncate-error, status: 4099, summary: TruncateException}
    behavior:
      - call: gossiper.get-unreachable-token-owners
        as: down
      - if: "size(vars.down.value.endpoints) > 0"
        then:
          - call: gossiper.get-live-members
            as: live
          - set: {ctx.phase: truncate refused}
          - title: Truncate needs every node up (it is treated as CL.ALL)
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:2514-2522"
            fail:
              code: unavailable
              status: 4096
              message: Cannot achieve consistency level ALL
              data: {consistency: ALL, required: "= size(vars.live.value.members) + size(vars.down.value.endpoints)", alive: "= size(vars.live.value.members)"}
      - call: storage-service.get-live-ring-members
        input: {include_self: true}
        as: members
      - title: Send TRUNCATE_REQ to every live ring member, this node included, and wait for all of them
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:2524-2544"
        call: truncate-response-handler.get
        input: {members: "= vars.members.value.endpoints", keyspace: "= input.keyspace", table: "= input.table"}
        as: got
      - set: {ctx.phase: truncated}
      - return: {truncated: true, responses: "= vars.got.value.responses"}
  - component: truncate-response-handler
    name: on-response
    kind: function
    summary: "Counts one TRUNCATE_RSP; signals once every live member answered."
    sources:
      - "src/java/org/apache/cassandra/service/TruncateResponseHandler.java:94-100"
      - "src/java/org/apache/cassandra/net/Verb.java:133"
    request: {type: object, properties: {responses: {type: integer}, response_count: {type: integer}}}
    response: {type: object, properties: {responses: {type: integer}, signaled: {type: boolean}}}
    behavior:
      - return: {responses: "= input.responses + 1", signaled: "= input.responses + 1 >= input.response_count"}

  - component: truncate-response-handler
    name: get
    kind: function
    summary: "The TRUNCATE_REQ sends and their callbacks: waits for every live member until truncate_request_timeout; any failure response aborts with TruncateException, a missing answer times out."
    sources:
      - "src/java/org/apache/cassandra/service/TruncateResponseHandler.java:63-108"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:2527-2533"
    request:
      type: object
      properties:
        members: {type: array, items: {type: string}}
        keyspace: {type: string}
        table: {type: string}
    response: {type: object, properties: {responses: {type: integer}}}
    errors: [*err-timeout, *err-truncate]
    behavior:
      - parallel: "= input.members"
        as: e
        join: {need: all}
        timeout_ms: "= config['truncate-request-timeout-ms']"
        title: "onFailure signals at once (TruncateException); without every answer the wait ends at truncate_request_timeout (TimeoutException)"
        source: "src/java/org/apache/cassandra/service/TruncateResponseHandler.java:76-107"
        on_insufficient: {code: truncate-error, status: 4099}
        as_result: join
        steps:
          - call: truncate-verb-handler.do-verb
            on: "= vars.e"
            input: {from: "= self", keyspace: "= input.keyspace", table: "= input.table"}
            timeout_ms: "= config['truncate-request-timeout-ms']"
            as: r
            on_error: continue
          - if: "!vars.r.ok && vars.r.error.code == 'timeout'"
            then:
              - title: The callback has not failed before the handler's own timeout
                wait: 1
              - fail: "= vars.r.error"
          - if: "!vars.r.ok"
            then:
              - fail: "= vars.r.error"
          - call: truncate-response-handler.on-response
            input: {responses: 0, response_count: "= size(input.members)"}
      - return: {responses: "= vars.join.received"}
  # ======================================================= write response handlers
  - component: write-response-handler
    name: on-response
    kind: function
    summary: "Counts one MUTATION_RSP or COUNTER_MUTATION_RSP (or the local apply); signals when blockFor acks are in."
    sources:
      - "src/java/org/apache/cassandra/service/WriteResponseHandler.java:58-66"
      - "src/java/org/apache/cassandra/net/Verb.java:115"
      - "src/java/org/apache/cassandra/net/Verb.java:136"
    request: {type: object, properties: {from: {type: string}, acks: {type: integer}, block_for: {type: integer}}}
    response: {type: object, properties: {acks: {type: integer}, signaled: {type: boolean}}}
    behavior:
      - return: {acks: "= input.acks + 1", signaled: "= input.acks + 1 >= input.block_for"}

  - component: abstract-write-response-handler
    name: get
    kind: function
    summary: "Waits until blockFor acks, or until enough replicas failed that blockFor can no longer be reached (WriteFailure, or WriteTimeout if every failure was a timeout), or until the write timeout from the request's start (WriteTimeout)."
    sources:
      - "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:112-159"
      - "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:227-245"
      - "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:293-311"
    request: CoordinationWriteHandlerState
    response: {type: object, properties: {acks: {type: integer}, block_for: {type: integer}, consistency: {type: string}, write_type: {type: string}}}
    errors: [*err-write-timeout, *err-write-failure]
    behavior:
      - set:
          ctx.acks: "= input.acks"
          ctx.block_for: "= input.block_for"
      - if: "input.join_ok"
        then:
          - return: {acks: "= input.acks", block_for: "= input.block_for", consistency: "= input.consistency", write_type: "= input.write_type"}
      - set:
          vars.deadline: "= input.start_ms + input.timeout_ms"
      - title: "onFailure signals early once blockFor + failures exceeds the candidate count (live and down replicas)"
        source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:298-307"
        set:
          vars.signal_at: "= input.failure_events.map(f, f.t).sort().filter(t, t <= vars.deadline && input.block_for + size(input.failure_events.filter(g, g.t <= t)) > input.candidates)"
      - if: "size(vars.signal_at) == 0"
        then:
          - title: Not signaled before the write timeout
            source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:119-127"
            wait: "= math.greatest(0, vars.deadline - now)"
          - set: {vars.received: "= size(input.acks_at.filter(t, t <= vars.deadline)) + input.hint_ack", ctx.acks: "= size(input.acks_at.filter(t, t <= vars.deadline)) + input.hint_ack"}
          - title: "Not enough acks before the write timeout (the received count is capped at blockFor - 1)"
            source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:140-150"
            fail:
              code: write-timeout
              status: 4352
              message: "= 'Operation timed out - received only ' + string(math.least(vars.received, input.block_for - 1)) + ' responses.'"
              data: {consistency: "= input.consistency", received: "= math.least(vars.received, input.block_for - 1)", block_for: "= input.block_for", write_type: "= input.write_type"}
      - wait: "= math.greatest(0, vars.signal_at[0] - now)"
      - set:
          vars.reasons: "= input.failure_events.filter(f, f.t <= vars.signal_at[0]).map(f, f.reason)"
          vars.received: "= size(input.acks_at.filter(t, t <= vars.signal_at[0])) + input.hint_ack"
      - if: "vars.reasons.all(r, r == 'TIMEOUT')"
        then:
          - title: Every failure was a timeout, so this is still a write timeout
            source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:131-134"
            fail:
              code: write-timeout
              status: 4352
              message: "= 'Operation timed out - received only ' + string(vars.received) + ' responses.'"
              data: {consistency: "= input.consistency", received: "= vars.received", block_for: "= input.block_for", write_type: "= input.write_type"}
      - title: Too many replicas failed to ever reach blockFor
        source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:129-137"
        fail:
          code: write-failure
          status: 5376
          message: "= 'Operation failed - received ' + string(vars.received) + ' responses and ' + string(size(vars.reasons)) + ' failures'"
          data: {consistency: "= input.consistency", received: "= vars.received", block_for: "= input.block_for", write_type: "= input.write_type", failures: "= size(vars.reasons)", failure_reasons: "= vars.reasons"}
  - component: abstract-write-response-handler
    name: maybe-try-additional-replicas
    kind: function
    summary: "Cheap quorum backup: if live replicas were left uncontacted (transient replication only), write to them after additional_write_policy latency."
    sources: ["src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:341-375"]
    request: {type: object, properties: {plan: {type: object}}}
    response: {type: object, properties: {sent: {type: boolean}}}
    behavior:
      - if: "!has(input.plan.live_uncontacted) || size(input.plan.live_uncontacted) == 0"
        then:
          - title: writeNormal contacts every replica, so nothing is left to try
            source: "src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:343-345"
            return: {sent: false}
      - return: {sent: true}

  - component: abstract-replication-strategy
    name: get-write-response-handler
    kind: function
    summary: "Picks DatacenterWriteResponseHandler for LOCAL_*, DatacenterSyncWriteResponseHandler for EACH_QUORUM with NTS, else WriteResponseHandler."
    sources: ["src/java/org/apache/cassandra/locator/AbstractReplicationStrategy.java:144-205"]
    request:
      type: object
      properties:
        consistency: {type: string}
        strategy: {type: string}
        live_and_down: {type: array, items: {type: string}}
    response: {type: object, properties: {handler: {type: string}, candidates: {type: integer}}}
    behavior:
      - title: ideal_consistency_level is unset (yaml:1883 commented, Config.java:560 null), so no ideal-CL delegate is attached
        source: "src/java/org/apache/cassandra/locator/AbstractReplicationStrategy.java:180-202"
      - return:
          handler: "= input.consistency in ['LOCAL_ONE', 'LOCAL_QUORUM', 'LOCAL_SERIAL', 'NODE_LOCAL'] ? 'DatacenterWriteResponseHandler' : (input.consistency == 'EACH_QUORUM' && input.strategy == 'NetworkTopologyStrategy' ? 'DatacenterSyncWriteResponseHandler' : 'WriteResponseHandler')"
          candidates: "= size(input.live_and_down)"

  # ================================================================= replica plans
  - component: replica-plans
    name: for-write
    kind: function
    summary: "Write plan: natural + pending replicas, which are live, all of them as contacts; Unavailable if live < blockForWrite."
    sources:
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:447-492"
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:494-540"
    request:
      type: object
      required: [keyspace, token, consistency]
      properties:
        keyspace: {type: string, examples: [shop]}
        token: {type: integer, examples: [100]}
        consistency: *consistency
        selector: {type: string, enum: [write_normal, write_all], default: write_normal}
    response: CoordinationReplicaPlan
    errors: [*err-unavailable]
    behavior:
      - call: replica-layout.for-token-write-live-and-down
        input: {keyspace: "= input.keyspace", token: "= input.token"}
        as: layout
      - set: {vars.live: []}
      - foreach: "= vars.layout.value.all"
        as: r
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.r"}
            as: a
          - when: "vars.a.value.alive"
            set: {vars.live: "= vars.live + [vars.r]"}
      - call: consistency-level.block-for-write
        input: {consistency: "= input.consistency", rf: "= vars.layout.value.rf", strategy: "= vars.layout.value.strategy", pending: "= size(vars.layout.value.pending)"}
        as: bf
      - call: replica-plans.assure-sufficient-live-replicas
        input: {consistency: "= input.consistency", live: "= vars.live", block_for: "= vars.bf.value.block_for"}
      - title: "writeNormal / writeAll: with no transient replicas every natural and pending replica, live or down, is a contact"
        source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:513-522"
        return:
          keyspace: "= input.keyspace"
          token: "= input.token"
          consistency: "= input.consistency"
          rf: "= vars.layout.value.rf"
          strategy: "= vars.layout.value.strategy"
          natural: "= vars.layout.value.natural"
          pending: "= vars.layout.value.pending"
          live_and_down: "= vars.layout.value.all"
          replicas: "= vars.layout.value.all"
          live: "= vars.live"
          contacts: "= vars.layout.value.all"
          live_uncontacted: []
          block_for: "= vars.bf.value.block_for"
          local: "= self"

  - component: replica-plans
    name: for-read
    kind: function
    summary: "Read plan: live natural replicas sorted by the snitch are the candidates; the first blockFor (+1 for ALWAYS speculation) are contacted; Unavailable if too few."
    sources:
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:716-735"
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:649-689"
    request:
      type: object
      required: [keyspace, token, consistency]
      properties:
        keyspace: {type: string, examples: [shop]}
        token: {type: integer, examples: [100]}
        consistency: *consistency
        always_speculate: {type: boolean, default: false}
    response: CoordinationReplicaPlan
    errors: [*err-unavailable]
    behavior:
      - call: replica-layout.for-token-read-live-sorted
        input: {keyspace: "= input.keyspace", token: "= input.token"}
        as: layout
      - call: consistency-level.block-for
        input: {consistency: "= input.consistency", rf: "= vars.layout.value.rf", strategy: "= vars.layout.value.strategy"}
        as: bf
      - set:
          vars.candidates: "= vars.layout.value.live"
          vars.count: "= vars.bf.value.block_for + (has(input.always_speculate) && input.always_speculate ? 1 : 0)"
      - set: {vars.contacts: "= vars.candidates.slice(0, math.least(vars.count, size(vars.candidates)))"}
      - call: replica-plans.assure-sufficient-live-replicas
        input: {consistency: "= input.consistency", live: "= vars.contacts", block_for: "= vars.bf.value.block_for"}
      - return:
          keyspace: "= input.keyspace"
          token: "= input.token"
          consistency: "= input.consistency"
          rf: "= vars.layout.value.rf"
          strategy: "= vars.layout.value.strategy"
          natural: "= vars.layout.value.natural"
          candidates: "= vars.candidates"
          contacts: "= vars.contacts"
          block_for: "= vars.bf.value.block_for"
          local: "= self"

  - component: replica-plans
    name: for-range-read
    kind: function
    summary: "Range read plan for one piece of the ring: live natural replicas of its right token, sorted; the first blockFor are contacted (no speculation)."
    sources: ["src/java/org/apache/cassandra/locator/ReplicaPlans.java:737-757"]
    request:
      type: object
      required: [keyspace, consistency, left, right]
      properties:
        keyspace: {type: string}
        consistency: {type: string}
        left: {type: integer}
        right: {type: integer}
    response: {type: object}
    errors: [*err-unavailable]
    behavior:
      - call: replica-plans.for-read
        input: {keyspace: "= input.keyspace", token: "= input.right", consistency: "= input.consistency", always_speculate: false}
        as: p
      - call: token-metadata.sorted-tokens
        as: ring
      - return:
          keyspace: "= input.keyspace"
          consistency: "= input.consistency"
          left: "= input.left"
          right: "= input.right"
          min_token: "= vars.ring.value.min_token"
          candidates: "= vars.p.value.candidates"
          contacts: "= vars.p.value.contacts"
          block_for: "= vars.p.value.block_for"
          rf: "= vars.p.value.rf"
          local: "= vars.p.value.local"
          vnodes: 1

  - component: replica-plans
    name: for-read-repair
    kind: function
    summary: "Read-repair write plan: live replicas already contacted by the read, plus more live ones until blockForWrite is reached."
    sources:
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:442-445"
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:559-603"
    request:
      type: object
      properties:
        keyspace: {type: string}
        token: {type: integer}
        consistency: {type: string}
        read_contacts: {type: array, items: {type: string}}
    response: CoordinationReplicaPlan
    errors: [*err-unavailable]
    behavior:
      - call: replica-plans.for-write
        input: {keyspace: "= input.keyspace", token: "= input.token", consistency: "= input.consistency", selector: write_normal}
        as: w
      - set: {vars.contacts: "= vars.w.value.live.filter(e, e in input.read_contacts)"}
      - set: {vars.extra: "= vars.w.value.live.filter(e, !(e in vars.contacts))"}
      - set: {vars.add: "= math.greatest(0, vars.w.value.block_for - size(vars.contacts))"}
      - set: {vars.contacts: "= vars.contacts + vars.extra.slice(0, math.least(vars.add, size(vars.extra)))"}
      - return:
          keyspace: "= input.keyspace"
          token: "= input.token"
          consistency: "= input.consistency"
          live: "= vars.w.value.live"
          contacts: "= vars.contacts"
          live_uncontacted: "= vars.w.value.live.filter(e, !(e in vars.contacts))"
          block_for: "= vars.w.value.block_for"
          local: "= vars.w.value.local"

  - component: replica-plans
    name: for-paxos
    kind: function
    summary: "Paxos plan: natural + pending replicas (local DC only for LOCAL_SERIAL), live ones as contacts, requiredParticipants = all/2 + 1; Unavailable when fewer are live or more than one is pending."
    sources: ["src/java/org/apache/cassandra/locator/ReplicaPlans.java:612-647"]
    request:
      type: object
      properties:
        keyspace: {type: string, examples: [shop]}
        partition_key: {type: string, examples: ["user:42"]}
        token: {type: integer, examples: [100]}
        consistency: {type: string, enum: [SERIAL, LOCAL_SERIAL], default: SERIAL}
    response:
      type: object
      properties:
        consistency: {type: string}
        replicas: {type: array, items: {type: string}}
        live: {type: array, items: {type: string}}
        pending: {type: array, items: {type: string}}
        required_participants: {type: integer}
        local_endpoint: {type: string}
    errors: [*err-unavailable]
    behavior:
      - call: replica-layout.for-token-write-live-and-down
        input: {keyspace: "= input.keyspace", token: "= input.token"}
        as: layout
      - set: {vars.live: []}
      - foreach: "= vars.layout.value.all"
        as: r
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.r"}
            as: a
          - when: "vars.a.value.alive"
            set: {vars.live: "= vars.live + [vars.r]"}
      - set: {vars.required: "= size(vars.layout.value.all) / 2 + 1"}
      - if: "size(vars.live) < vars.required"
        then:
          - title: Fewer live replicas than a Paxos majority
            source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:630-635"
            fail: {code: unavailable, status: 4096, message: "= 'Cannot achieve consistency level ' + input.consistency", data: {consistency: "= input.consistency", required: "= vars.required", alive: "= size(vars.live)"}}
      - if: "size(vars.layout.value.pending) > 1"
        then:
          - title: LWT refused with more than one pending range movement
            source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:637-644"
            fail: {code: unavailable, status: 4096, message: "= 'Cannot perform LWT operation as there is more than one (' + string(size(vars.layout.value.all)) + ') pending range movement'", data: {consistency: "= input.consistency", required: "= size(vars.layout.value.all) + 1", alive: "= size(vars.live)"}}
      - return:
          consistency: "= input.consistency"
          replicas: "= vars.layout.value.all"
          live: "= vars.live"
          pending: "= vars.layout.value.pending"
          required_participants: "= vars.required"
          local_endpoint: "= self"

  - component: replica-plans
    name: assure-sufficient-live-replicas
    kind: function
    summary: "Throws Unavailable when fewer live replicas than blockFor (ANY always passes: a local hint is acceptable)."
    sources: ["src/java/org/apache/cassandra/locator/ReplicaPlans.java:130-198"]
    request:
      type: object
      properties:
        consistency: {type: string}
        live: {type: array, items: {type: string}}
        block_for: {type: integer}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors: [*err-unavailable]
    behavior:
      - if: "input.consistency == 'ANY'"
        then:
          - return: {ok: true}
      - if: "size(input.live) < input.block_for"
        then:
          - set: {ctx.phase: unavailable}
          - title: Live replicas do not satisfy the consistency level
            detail: "Every node is in datacenter1 under SimpleSnitch, so the LOCAL_ONE, LOCAL_QUORUM and EACH_QUORUM branches count the same replicas as the default branch."
            source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:186-194"
            fail:
              code: unavailable
              status: 4096
              message: "= 'Cannot achieve consistency level ' + input.consistency"
              data: {consistency: "= input.consistency", required: "= input.block_for", alive: "= size(input.live)"}
      - return: {ok: true}

  - component: replica-layout
    name: for-token-write-live-and-down
    kind: function
    summary: "Natural replicas (from the replication strategy) and pending replicas (from TokenMetadata) of a token, live or down."
    sources: ["src/java/org/apache/cassandra/locator/ReplicaLayout.java:205-223"]
    request:
      type: object
      required: [keyspace, token]
      properties:
        keyspace: {type: string, examples: [shop]}
        token: {type: integer, examples: [100]}
    response:
      type: object
      properties:
        natural: {type: array, items: {type: string}}
        pending: {type: array, items: {type: string}}
        all: {type: array, items: {type: string}}
        replicas: {type: array, items: {type: string}}
        rf: {type: integer}
        strategy: {type: string}
    behavior:
      - call: abstract-replication-strategy.get-natural-replicas-for-token
        input: {keyspace: "= input.keyspace", token: "= input.token"}
        as: nat
      - title: A replica both natural and pending keeps its natural (full) entry
        source: "src/java/org/apache/cassandra/locator/ReplicaLayout.java:215-223"
        set: {vars.pending: "= vars.nat.value.pending.filter(e, !(e in vars.nat.value.replicas))"}
      - return:
          natural: "= vars.nat.value.replicas"
          pending: "= vars.pending"
          all: "= vars.nat.value.replicas + vars.pending"
          replicas: "= vars.nat.value.replicas + vars.pending"
          rf: "= vars.nat.value.rf"
          strategy: "= vars.nat.value.strategy"
  - component: replica-layout
    name: for-token-read-live-sorted
    kind: function
    summary: "Natural replicas of a token sorted by the (dynamic) snitch, keeping only those the failure detector thinks are alive."
    sources: ["src/java/org/apache/cassandra/locator/ReplicaLayout.java:329-335"]
    request:
      type: object
      properties:
        keyspace: {type: string, examples: [shop]}
        token: {type: integer, examples: [100]}
    response:
      type: object
      properties:
        natural: {type: array, items: {type: string}}
        live: {type: array, items: {type: string}}
        rf: {type: integer}
        strategy: {type: string}
    behavior:
      - call: abstract-replication-strategy.get-natural-replicas-for-token
        input: {keyspace: "= input.keyspace", token: "= input.token"}
        as: nat
      - call: dynamic-endpoint-snitch.sorted-by-proximity
        input: {replicas: "= vars.nat.value.replicas"}
        as: sorted
      - set: {vars.live: []}
      - foreach: "= vars.sorted.value.replicas"
        as: r
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.r"}
            as: a
          - when: "vars.a.value.alive"
            set: {vars.live: "= vars.live + [vars.r]"}
      - return: {natural: "= vars.nat.value.replicas", live: "= vars.live", rf: "= vars.nat.value.rf", strategy: "= vars.nat.value.strategy"}

  - component: consistency-level
    name: block-for
    kind: function
    summary: "Replicas a level blocks for: ONE/LOCAL_ONE/ANY 1, TWO 2, THREE 3, QUORUM/SERIAL/LOCAL_* RF/2+1, ALL RF."
    sources:
      - "src/java/org/apache/cassandra/db/ConsistencyLevel.java:133-170"
      - "src/java/org/apache/cassandra/db/ConsistencyLevel.java:91-106"
    request:
      type: object
      properties:
        consistency: {type: string}
        rf: {type: integer}
        strategy: {type: string}
    response: {type: object, properties: {block_for: {type: integer}}}
    errors: [{code: unsupported-operation, status: 0, summary: "UnsupportedOperationException (server error) for NODE_LOCAL"}]
    behavior:
      - if: "input.consistency == 'NODE_LOCAL'"
        then:
          - title: NODE_LOCAL has no blockFor
            source: "src/java/org/apache/cassandra/db/ConsistencyLevel.java:167-168"
            fail: {code: unsupported-operation, status: 0, message: "Invalid consistency level: NODE_LOCAL"}
      - set: {vars.q: "= input.rf / 2 + 1"}
      - return:
          block_for: "= input.consistency in ['ONE', 'LOCAL_ONE', 'ANY'] ? 1 : (input.consistency == 'TWO' ? 2 : (input.consistency == 'THREE' ? 3 : (input.consistency == 'ALL' ? input.rf : vars.q)))"

  - component: consistency-level
    name: block-for-write
    kind: function
    summary: "blockFor plus pending replicas (none added for ANY; only local-DC pending for LOCAL_*)."
    sources: ["src/java/org/apache/cassandra/db/ConsistencyLevel.java:172-192"]
    request:
      type: object
      properties:
        consistency: {type: string}
        rf: {type: integer}
        strategy: {type: string}
        pending: {type: integer}
    response: {type: object, properties: {block_for: {type: integer}}}
    behavior:
      - call: consistency-level.block-for
        input: {consistency: "= input.consistency", rf: "= input.rf", strategy: "= input.strategy"}
        as: bf
      - return: {block_for: "= vars.bf.value.block_for + (input.consistency == 'ANY' ? 0 : input.pending)"}

  - component: abstract-replication-strategy
    name: get-natural-replicas-for-token
    kind: function
    summary: "Natural replicas of a token: the (cached) result of the strategy's calculateNaturalReplicas over TokenMetadata's ring, with the keyspace's RF."
    sources: ["src/java/org/apache/cassandra/locator/AbstractReplicationStrategy.java:88-110"]
    request:
      type: object
      required: [keyspace, token]
      properties:
        keyspace: {type: string, examples: [shop]}
        token: {type: integer, examples: [100]}
    response:
      type: object
      properties:
        replicas: {type: array, items: {type: string}}
        pending: {type: array, items: {type: string}}
        rf: {type: integer}
        strategy: {type: string}
    behavior:
      - title: calculateNaturalReplicas walks TokenMetadata's ring (membership evaluates the walk)
        source: "src/java/org/apache/cassandra/locator/AbstractReplicationStrategy.java:99-106"
        call: token-metadata.get-write-endpoints
        input: {keyspace: "= input.keyspace", token: "= input.token"}
        as: ep
      - call: token-metadata.get-replication-factor
        input: {keyspace: "= input.keyspace"}
        as: rf
      - return:
          replicas: "= vars.ep.value.natural"
          pending: "= vars.ep.value.pending"
          rf: "= vars.rf.value.rf"
          strategy: "= input.keyspace in state.strategies ? state.strategies[input.keyspace] : state.strategies['default']"
  # ====================================================================== snitches
  - component: dynamic-endpoint-snitch
    name: sorted-by-proximity
    kind: function
    summary: "Keeps the subsnitch's order unless some replica's latency score exceeds (1 + badness_threshold) times the corresponding best score; then sorts by score."
    sources: ["src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:174-258"]
    request: {type: object, properties: {replicas: {type: array, items: {type: string}}}}
    response: {type: object, properties: {replicas: {type: array, items: {type: string}}, by_score: {type: boolean}}}
    behavior:
      - if: "size(input.replicas) < 2"
        then:
          - return: {replicas: "= input.replicas", by_score: false}
      - call: simple-snitch.sorted-by-proximity
        input: {replicas: "= input.replicas"}
        as: sub
      - set: {vars.sc: "= vars.sub.value.replicas.map(e, state.scores.exists(s, s.endpoint == e) ? double(state.scores.filter(s, s.endpoint == e)[0].score) : 0.0)"}
      - set: {vars.best: "= vars.sc.sort()", vars.bad: false}
      - foreach: "= vars.sc"
        as: s
        index: i
        steps:
          - when: "vars.s > vars.best[vars.i] * (1.0 + double(int(config['dynamic-snitch-badness-threshold'])))"
            set: {vars.bad: true}
      - if: "vars.bad"
        then:
          - title: A replica is much slower than another; order by latency score
            source: "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:218-225"
            return:
              replicas: "= vars.sub.value.replicas.sortBy(e, state.scores.exists(s, s.endpoint == e) ? double(state.scores.filter(s, s.endpoint == e)[0].score) : 0.0)"
              by_score: true
      - return: {replicas: "= vars.sub.value.replicas", by_score: false}

  - component: dynamic-endpoint-snitch
    name: update-scores
    kind: function
    summary: "Every dynamic_snitch_update_interval (100ms): score each endpoint as its median latency divided by the worst median."
    sources:
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:281-324"
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:91-97"
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:108-113"
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:120-130"
    request: {type: object, properties: {}}
    response: {type: object, properties: {scored: {type: integer}}}
    behavior:
      - set: {vars.med: "= state.samples.map(s, {'endpoint': s.endpoint, 'median': double(s.latencies_ms.sort()[size(s.latencies_ms) / 2])})"}
      - set: {vars.max: "= math.greatest([1.0] + vars.med.map(m, m.median))"}
      - title: Scores are median / max latency (severity from gossip is added when set)
        source: "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:313-323"
        set: {state.scores: "= vars.med.map(m, {'endpoint': m.endpoint, 'score': m.median / vars.max})"}
      - return: {scored: "= size(vars.med)"}

  - component: dynamic-endpoint-snitch
    name: reset
    kind: function
    summary: "Every dynamic_snitch_reset_interval (600000ms): drop all latency samples so recovered nodes can win back traffic."
    sources:
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:326-329"
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:98-106"
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:111"
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:132-140"
    request: {type: object, properties: {}}
    response: {type: object, properties: {cleared: {type: integer}}}
    behavior:
      - set: {vars.n: "= size(state.samples)"}
      - set: {state.samples: []}
      - return: {cleared: "= vars.n"}

  - component: dynamic-endpoint-snitch
    name: set-severity
    kind: function
    summary: "JMX setSeverity: publishes this node's SEVERITY in gossip, which other coordinators add to its score and use to pick a forwarding replica."
    sources:
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:372-381"
      - "src/java/org/apache/cassandra/locator/DynamicEndpointSnitchMBean.java:56"
    request: {type: object, required: [severity], properties: {severity: {type: number, examples: [2.5]}}}
    response: {type: object, properties: {severity: {type: number}}}
    behavior:
      - call: gossiper.add-local-application-state
        input: {state: SEVERITY, value: "= string(input.severity)"}
      - return: {severity: "= input.severity"}

  - component: simple-snitch
    name: sorted-by-proximity
    kind: function
    summary: "No-op: SimpleSnitch returns the replicas in ring order."
    sources: ["src/java/org/apache/cassandra/locator/SimpleSnitch.java:40-45"]
    request: {type: object, properties: {replicas: {type: array, items: {type: string}}}}
    response: {type: object, properties: {replicas: {type: array, items: {type: string}}}}
    behavior:
      - return: {replicas: "= input.replicas"}

  - component: simple-snitch
    name: get-datacenter
    kind: function
    summary: "Always datacenter1."
    sources: ["src/java/org/apache/cassandra/locator/SimpleSnitch.java:27-38"]
    request: {type: object, properties: {endpoint: {type: string}}}
    response: {type: object, properties: {datacenter: {type: string}}}
    behavior:
      - return: {datacenter: datacenter1}

  # ================================================================= read executors
  - component: abstract-read-executor
    name: get-read-executor
    kind: function
    summary: "Builds the read plan and picks the executor: never (NONE, EACH_QUORUM, or no spare replica), always (ALWAYS), else speculating."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:190-219"]
    request:
      type: object
      properties:
        command: *read_command
        consistency: *consistency
    response: CoordinationReadExecutor
    errors: [*err-unavailable]
    behavior:
      - set: {vars.params: "= merge(state.table_params['default'], (input.command.keyspace + '.' + input.command.table) in state.table_params ? state.table_params[input.command.keyspace + '.' + input.command.table] : {})"}
      - call: replica-plans.for-read
        input: {keyspace: "= input.command.keyspace", token: "= input.command.token", consistency: "= input.consistency", always_speculate: "= vars.params.speculative_retry == 'ALWAYS'"}
        as: plan
      - set:
          vars.type: "= (vars.params.speculative_retry == 'NONE' || input.consistency == 'EACH_QUORUM') ? 'never' : (size(vars.plan.value.contacts) == size(vars.plan.value.candidates) ? 'never_insufficient' : (vars.params.speculative_retry == 'ALWAYS' ? 'always' : 'speculating'))"
      - set:
          vars.initial: "= vars.type == 'speculating' ? (vars.plan.value.block_for < size(vars.plan.value.contacts) ? 2 : 1) : (vars.type == 'always' ? (size(vars.plan.value.contacts) > 1 ? 2 : 1) : 1)"
          ctx.read_executor: "= vars.type"
      - return:
          type: "= vars.type"
          plan: "= vars.plan.value"
          initial_data_requests: "= vars.initial"
          sample_read_latency_ms: "= has(vars.params.sample_read_latency_ms) ? vars.params.sample_read_latency_ms : config['initial-sample-read-latency-ms']"
          read_repair: "= vars.params.read_repair"
          speculative_retry: "= vars.params.speculative_retry"
          command: "= input.command"
          consistency: "= input.consistency"

  - component: abstract-read-executor
    name: execute-async
    kind: function
    summary: "Sends full data requests to the first initialDataRequestCount contacts and digest requests to the rest, all at once; a speculating executor adds one more request after the sampled latency if blockFor is not met by then. Waits for blockFor responses or the read timeout."
    sources:
      - "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:178-185"
      - "src/java/org/apache/cassandra/service/reads/ReadCallback.java:128-130"
    request: {type: object, properties: {executor: CoordinationReadExecutor}}
    response: {type: object, properties: {received: {type: integer}}}
    errors:
      - {code: read-failure, status: 4864, summary: "the join can no longer reach blockFor; await-responses classifies it"}
      - {code: timeout, retryable: true, summary: "the join timed out at read_request_timeout"}
    behavior:
      - set: {vars.contacts: "= input.executor.plan.contacts"}
      - set: {vars.data: "= vars.contacts.slice(0, math.least(input.executor.initial_data_requests, size(vars.contacts)))"}
      - set:
          vars.items: "= vars.contacts.map(e, {'replica': e, 'digest': !(e in vars.data), 'speculative': false}) + (input.executor.type == 'speculating' ? [{'replica': '', 'digest': false, 'speculative': true}] : [])"
      - title: "All requests go out together; the speculative one waits for the sampled latency (maybeTryAdditionalReplicas)"
        source: "src/java/org/apache/cassandra/service/StorageProxy.java:2128-2140"
        parallel: "= vars.items"
        as: it
        stagger_ms: "= vars.it.speculative ? input.executor.sample_read_latency_ms : 0"
        join:
          need: "= input.executor.plan.block_for"
          # Fail-fast: a failure response signals the callback once blockFor + failures > contacts
          # (ReadCallback.java:247-248); the unsent speculative request does not hold the read open.
          count_unstarted: false
        timeout_ms: "= math.greatest(1, int(ctx.read.start) + int(config['read-request-timeout-ms']) - now)"
        on_insufficient: {code: read-failure, status: 4864}
        as_result: join
        steps:
          - if: "vars.it.speculative"
            then:
              - title: "Starts at the request start plus the sampled read latency (99p; 2500ms before any sample), through stagger_ms; skipped when the read is already decided"
                source: "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:230-253"
                call: abstract-read-executor.maybe-try-additional-replicas
                input: {executor: "= input.executor"}
                as: spec
              - return: "= vars.spec.value"
          - call: abstract-read-executor.make-requests
            input: {command: "= input.executor.command", replicas: ["= vars.it.replica"], digest: "= vars.it.digest", local: "= input.executor.plan.local", block_for: "= input.executor.plan.block_for"}
            as: mr
          - set: {ctx.read.responses: "= ctx.read.responses + [merge(vars.mr.value.responses[0], {'t': now})]"}
          - if: "!vars.mr.value.responses[0].ok"
            then:
              - fail: {code: "= vars.mr.value.responses[0].reason", message: replica read failed}
          - return: "= vars.mr.value.responses[0]"
      - return: {received: "= vars.join.received"}
  - component: abstract-read-executor
    name: make-requests
    kind: function
    summary: "Sends READ_REQ to each remote replica, then runs the local read (if this node is one of them) last on the READ stage."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:134-167"]
    request:
      type: object
      properties:
        command: *read_command
        replicas: {type: array, items: {type: string}}
        digest: {type: boolean}
        local: {type: string}
        block_for: {type: integer}
    response: {type: object, properties: {responses: {type: array, items: CoordinationReplicaResponse}}}
    behavior:
      - set:
          vars.responses: []
          vars.has_local: "= input.local in input.replicas"
          vars.cmd: "= {'kind': 'single_partition', 'keyspace': input.command.keyspace, 'table': input.command.table, 'partition_key': input.command.partition_key, 'token': input.command.token, 'columns': has(input.command.columns) ? input.command.columns : [], 'limit': has(input.command.limit) ? input.command.limit : 100, 'digest': input.digest}"
      - foreach: "= input.replicas.filter(e, e != input.local)"
        as: r
        steps:
          - call: read-command-verb-handler.do-verb
            on: "= vars.r"
            input: {from: "= self", read_command: "= vars.cmd"}
            timeout_ms: 5000
            as: resp
            on_error: continue
          - if: "vars.resp.ok"
            then:
              - call: read-callback.on-response
                input: {from: "= vars.r", response: "= vars.resp.value", is_digest: "= input.digest"}
                as: rec
            else:
              - title: "No response: the callback fails with TIMEOUT at expiry, or the replica sends a failure response"
                source: "src/java/org/apache/cassandra/service/reads/ReadCallback.java:241-250"
                call: read-callback.on-failure
                input: {from: "= vars.r", code: "= vars.resp.error.code", is_digest: "= input.digest"}
                as: rec
          - set: {vars.responses: "= vars.responses + [vars.rec.value]"}
      - if: "vars.has_local"
        then:
          - title: Local read last, on the READ stage
            source: "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:161-166"
            call: storage-proxy-local-read-runnable.run
            input: {read_command: "= vars.cmd", replica: "= input.local"}
            as: lr
          - set: {vars.responses: "= vars.responses + [vars.lr.value]"}
      - return: {responses: "= vars.responses"}
  - component: abstract-read-executor
    name: maybe-try-additional-replicas
    kind: function
    summary: "At the speculation point: if the callback is not yet satisfied (and no failure decided it), send one more request to the first uncontacted candidate: data if no data has arrived yet, else a digest."
    sources:
      - "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:230-253"
      - "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:305-351"
    request: {type: object, properties: {executor: CoordinationReadExecutor}}
    response: CoordinationReplicaResponse
    errors: [{code: no-speculation, summary: "nothing was sent: the read was already decided, there is no latency sample, or no spare replica"}]
    behavior:
      - set: {vars.seen: "= ctx.read.responses.filter(r, r.t <= now)"}
      - set:
          vars.ok: "= vars.seen.filter(r, r.ok)"
          vars.failures: "= size(vars.seen.filter(r, !r.ok))"
          vars.data_present: "= vars.seen.exists(r, r.ok && !r.is_digest)"
      - set:
          vars.signaled: "= (size(vars.ok) >= input.executor.plan.block_for && vars.data_present) || (input.executor.plan.block_for + vars.failures > size(ctx.read.contacts))"
      - if: "input.executor.sample_read_latency_ms > config['read-request-timeout-ms'] || vars.signaled"
        then:
          - title: "No speculation: no useful latency sample, or blockFor already met (or failed) by now"
            source: "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:234-252"
            fail: {code: no-speculation, message: the read was already decided}
      - set: {vars.uncontacted: "= input.executor.plan.candidates.filter(e, !(e in ctx.read.contacts))"}
      - if: "size(vars.uncontacted) == 0"
        then:
          - title: No spare replica to speculate to
            source: "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:329-337"
            fail: {code: no-speculation, message: no uncontacted replica}
      - set:
          ctx.speculated: true
          ctx.speculated_to: "= vars.uncontacted[0]"
          ctx.speculated_kind: "= vars.data_present ? 'digest' : 'data'"
          ctx.read.contacts: "= ctx.read.contacts + [vars.uncontacted[0]]"
      - title: Speculate to the first uncontacted candidate (added to the plan's contacts for read repair)
        source: "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:313-349"
        call: abstract-read-executor.make-requests
        input: {command: "= input.executor.command", replicas: "= [vars.uncontacted[0]]", digest: "= vars.data_present", local: "= input.executor.plan.local", block_for: "= input.executor.plan.block_for"}
        as: more
      - set: {ctx.read.responses: "= ctx.read.responses + [merge(vars.more.value.responses[0], {'t': now})]"}
      - if: "!vars.more.value.responses[0].ok"
        then:
          - fail: {code: "= vars.more.value.responses[0].reason", message: speculative read failed}
      - return: "= vars.more.value.responses[0]"
  - component: abstract-read-executor
    name: await-responses
    kind: function
    summary: "Decides the read from the responses received by now: ReadTimeout or ReadFailure, or the data response when the digests match, or read repair on a mismatch."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:408-444"]
    request:
      type: object
      properties:
        executor: CoordinationReadExecutor
        join_ok: {type: boolean}
    response: {type: object, properties: {repair_started: {type: boolean}, result: {type: object}}}
    errors: [*err-read-timeout, *err-read-failure]
    behavior:
      - set: {vars.responses: "= ctx.read.responses.filter(r, r.t <= now)", ctx.speculated: "= has(ctx.speculated) && ctx.speculated"}
      - call: read-callback.await-results
        input: {responses: "= vars.responses", block_for: "= input.executor.plan.block_for", contacts_count: "= size(ctx.read.contacts)", consistency: "= input.executor.consistency"}
      - call: digest-resolver.responses-match
        input: {responses: "= vars.responses.filter(r, r.ok)"}
        as: m
      - if: "vars.m.value.match"
        then:
          - call: digest-resolver.get-data
            input: {responses: "= vars.responses.filter(r, r.ok)"}
            as: d
          - set: {ctx.digest_mismatch: false}
          - return: {repair_started: false, result: "= vars.d.value"}
      - set: {ctx.digest_mismatch: true}
      - title: Digest mismatch starts read repair
        source: "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:432-443"
        call: abstract-read-repair.start-repair
        input: {executor: "= input.executor", contacts: "= ctx.read.contacts"}
        on_error: continue
      - return: {repair_started: true}
  - component: abstract-read-executor
    name: maybe-send-additional-data-requests
    kind: function
    summary: "At the speculation point of the repair reads: read repair may speculate one more data request."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:469-475"]
    request: {type: object, properties: {executor: CoordinationReadExecutor}}
    response: CoordinationReplicaResponse
    behavior:
      - call: abstract-read-repair.maybe-send-additional-reads
        input: {executor: "= input.executor"}
        as: r
      - return: "= vars.r.value"
  - component: abstract-read-executor
    name: await-read-repair
    kind: function
    summary: "Waits for the repair's data responses; a timeout is reported with the original consistency level and blockFor - 1 received (CASSANDRA-7947)."
    sources: ["src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:446-462"]
    request: {type: object, properties: {executor: CoordinationReadExecutor}}
    response: {type: object, properties: {result: {type: object}}}
    errors: [*err-read-timeout, *err-read-failure]
    behavior:
      - call: abstract-read-repair.await-reads
        input: {executor: "= input.executor"}
        as: r
        on_error:
          - if: "error.code == 'read-timeout'"
            then:
              - title: Timed out waiting on digest mismatch repair requests
                source: "src/java/org/apache/cassandra/service/reads/AbstractReadExecutor.java:452-460"
                fail: {code: read-timeout, status: 4608, message: "Operation timed out - received only partial responses.", data: {consistency: "= input.executor.consistency", received: "= input.executor.plan.block_for - 1", block_for: "= input.executor.plan.block_for", data_present: true}}
          - fail: "= error"
      - return: "= vars.r.value"
  # ======================================================== callbacks and resolvers
  - component: read-callback
    name: on-response
    kind: function
    summary: "Records one READ_RSP or RANGE_RSP (resolver.preprocess); the coordinator's view of a replica's data or digest."
    sources:
      - "src/java/org/apache/cassandra/service/reads/ReadCallback.java:186-211"
      - "src/java/org/apache/cassandra/net/Verb.java:139"
      - "src/java/org/apache/cassandra/net/Verb.java:141"
    request:
      type: object
      properties:
        from: {type: string}
        response: *read_response
        is_digest: {type: boolean}
    response: CoordinationReplicaResponse
    behavior:
      - set: {vars.parts: "= has(input.response.partitions) ? input.response.partitions : []"}
      - return:
          from: "= input.from"
          ok: true
          is_digest: "= input.is_digest"
          digest: "= has(input.response.digest) ? input.response.digest : ''"
          partitions: "= input.is_digest ? [] : vars.parts"
          timestamp: "= math.greatest([0] + vars.parts.map(p, has(p.timestamp) ? p.timestamp : 0))"
          reason: ""

  - component: read-callback
    name: on-failure
    kind: function
    summary: "Records a replica failure with its RequestFailureReason: TIMEOUT at callback expiry, READ_TOO_MANY_TOMBSTONES, else UNKNOWN."
    sources:
      - "src/java/org/apache/cassandra/service/reads/ReadCallback.java:241-250"
      - "src/java/org/apache/cassandra/exceptions/RequestFailureReason.java:82-91"
    request: {type: object, properties: {from: {type: string}, code: {type: string}, is_digest: {type: boolean}}}
    response: CoordinationReplicaResponse
    behavior:
      - return:
          from: "= input.from"
          ok: false
          is_digest: "= input.is_digest"
          reason: "= input.code == 'timeout' ? 'TIMEOUT' : (input.code == 'tombstone-overwhelming' ? 'READ_TOO_MANY_TOMBSTONES' : 'UNKNOWN')"
  - component: read-callback
    name: await-results
    kind: function
    summary: "After the read timeout or a signal: success with blockFor responses and data; else ReadFailure if a failure was not a timeout, ReadTimeout otherwise."
    sources:
      - "src/java/org/apache/cassandra/service/reads/ReadCallback.java:128-179"
      - "src/java/org/apache/cassandra/service/reads/ReadCallback.java:241-250"
    request:
      type: object
      properties:
        responses: {type: array, items: CoordinationReplicaResponse}
        block_for: {type: integer}
        contacts_count: {type: integer}
        consistency: {type: string}
    response: {type: object, properties: {received: {type: integer}, data_present: {type: boolean}}}
    errors: [*err-read-timeout, *err-read-failure]
    behavior:
      - set:
          vars.received: "= size(input.responses.filter(r, r.ok))"
          vars.data_present: "= input.responses.exists(r, r.ok && !r.is_digest)"
          vars.reasons: "= input.responses.filter(r, !r.ok).map(r, r.reason)"
      - set:
          vars.signaled: "= (vars.received >= input.block_for && vars.data_present) || (input.block_for + size(vars.reasons) > input.contacts_count)"
          vars.failed: "= size(vars.reasons) > 0 && (input.block_for > vars.received || !vars.data_present)"
      - set:
          vars.timedout: "= vars.failed ? vars.reasons.all(x, x == 'TIMEOUT') : !vars.signaled"
          ctx.received: "= vars.received"
      - if: "vars.signaled && !vars.failed"
        then:
          - return: {received: "= vars.received", data_present: "= vars.data_present"}
      - if: "vars.timedout"
        then:
          - title: Read timeout
            source: "src/java/org/apache/cassandra/service/reads/ReadCallback.java:176-178"
            fail: {code: read-timeout, status: 4608, message: "= 'Operation timed out - received only ' + string(vars.received) + ' responses.'", data: {consistency: "= input.consistency", received: "= vars.received", block_for: "= input.block_for", data_present: "= vars.data_present"}}
      - title: Read failure (a replica answered with a failure such as READ_TOO_MANY_TOMBSTONES)
        source: "src/java/org/apache/cassandra/service/reads/ReadCallback.java:176-177"
        fail: {code: read-failure, status: 4864, message: "= 'Operation failed - received ' + string(vars.received) + ' responses and ' + string(size(vars.reasons)) + ' failures'", data: {consistency: "= input.consistency", received: "= vars.received", block_for: "= input.block_for", data_present: "= vars.data_present", failure_reasons: "= vars.reasons"}}

  - component: digest-resolver
    name: responses-match
    kind: function
    summary: "True when every full replica's digest is equal (or only one response arrived)."
    sources: ["src/java/org/apache/cassandra/service/reads/DigestResolver.java:105-134"]
    request: {type: object, properties: {responses: {type: array, items: CoordinationReplicaResponse}}}
    response: {type: object, properties: {match: {type: boolean}}}
    behavior:
      - choice: digests
        default: "= size(input.responses) <= 1 || size(input.responses.map(r, r.digest).distinct()) <= 1 ? 'match' : 'mismatch'"
        options:
          match:
            - return: {match: true}
          mismatch:
            - title: Digests differ
              source: "src/java/org/apache/cassandra/service/reads/DigestResolver.java:122-127"
              return: {match: false}

  - component: digest-resolver
    name: get-data
    kind: function
    summary: "Returns the data response unchanged when digests match."
    sources: ["src/java/org/apache/cassandra/service/reads/DigestResolver.java:77-103"]
    request: {type: object, properties: {responses: {type: array, items: CoordinationReplicaResponse}}}
    response: {type: object, properties: {partitions: {type: array, items: {type: object}}, timestamp: {type: integer}, from: {type: string}, partition_repairs: {type: array, items: {type: object}}}}
    behavior:
      - set: {vars.data: "= input.responses.filter(r, !r.is_digest)[0]"}
      - title: The single data response is filtered (tombstones dropped) before it reaches the client
        source: "src/java/org/apache/cassandra/service/reads/DigestResolver.java:81-84"
        return: {partitions: "= vars.data.partitions.map(p, merge(p, {'cells': p.cells.filter(c, !(has(c.deleted) && c.deleted))})).filter(p, size(p.cells) > 0)", timestamp: "= vars.data.timestamp", from: "= vars.data.from", partition_repairs: []}
  - component: data-resolver
    name: resolve
    kind: function
    summary: "Reconciles full data responses cell by cell (newest timestamp wins), applying replica filtering and short read protection, and lets the merge listener build repairs."
    sources:
      - "src/java/org/apache/cassandra/service/reads/DataResolver.java:92-130"
      - "src/java/org/apache/cassandra/service/reads/DataResolver.java:201-215"
    request:
      type: object
      properties:
        command: {type: object}
        responses: {type: array, items: CoordinationReplicaResponse}
        consistency: {type: string}
        read_repair: {type: string}
        keyspace: {type: string}
        token: {type: integer}
    response: {type: object, properties: {partitions: {type: array, items: {type: object}}, timestamp: {type: integer}, partition_repairs: {type: array, items: {type: object}}}}
    errors: [*err-read-timeout]
    behavior:
      - if: "has(input.command.filtered) && input.command.filtered && !(input.consistency in ['ONE', 'LOCAL_ONE', 'NODE_LOCAL'])"
        then:
          - title: Filtering or index query above ONE uses replica filtering protection
            source: "src/java/org/apache/cassandra/service/reads/DataResolver.java:122-123"
            call: replica-filtering-protection.execute-read-command
            input: {command: "= input.command", source: "= input.responses[0].from", consistency: "= input.consistency"}
      - set:
          vars.allp: "= input.responses.map(r, r.partitions).flatten().map(p, merge({'deletion_ts': -1, 'cells': []}, p))"
      - set:
          vars.by_key: "= vars.allp.map(p, p.partition_key).distinct().map(k, {'k': k, 'del': math.greatest([-1] + vars.allp.filter(p, p.partition_key == k).map(p, p.deletion_ts)), 'cells': vars.allp.filter(p, p.partition_key == k).map(p, p.cells).flatten()})"
      - set:
          vars.cands: "= vars.by_key.map(e, {'k': e.k, 'del': e.del, 'cols': e.cells.map(c, c.column).distinct().map(col, e.cells.filter(c, c.column == col && c.timestamp == math.greatest(e.cells.filter(d, d.column == col).map(d, d.timestamp))))})"
      - title: "Unfiltered merge: per column the newest cell wins; on a tie a tombstone wins, then the greater value (Cells.reconcile); a partition deletion shadows cells at or below it. Tombstones stay in the merged data."
        source: "src/java/org/apache/cassandra/service/reads/DataResolver.java:291-330"
        set:
          vars.merged: "= vars.cands.map(e, {'partition_key': e.k, 'deletion_ts': e.del, 'cells': e.cols.map(cs, cs.exists(c, has(c.deleted) && c.deleted) ? cs.filter(c, has(c.deleted) && c.deleted)[0] : cs.sortBy(c, string(c.value))[size(cs) - 1]).filter(c, c.timestamp > e.del)}).map(p, merge(p, {'timestamp': math.greatest([0, p.deletion_ts] + p.cells.map(c, c.timestamp))}))"
      - title: Only after merging (and after the repairs are computed) are tombstones filtered out of what the client sees
        source: "src/java/org/apache/cassandra/service/reads/DataResolver.java:315-317"
        set:
          vars.live: "= vars.merged.map(p, merge(p, {'cells': p.cells.filter(c, !(has(c.deleted) && c.deleted))})).filter(p, size(p.cells) > 0)"
      - set: {vars.newest: "= math.greatest([0] + vars.merged.map(p, p.timestamp))"}
      - choice: short_read
        default: none
        options:
          none: []
          partitions_short:
            - title: A replica returned exactly the limit while the merged result is short; ask it for more partitions
              source: "src/java/org/apache/cassandra/service/reads/DataResolver.java:205-213"
              call: short-read-partitions-protection.execute-read-command
              input: {command: "= input.command", source: "= input.responses[0].from"}
      - call: row-iterator-merge-listener.close
        input:
          responses: "= input.responses"
          merged: "= vars.merged"
          read_repair: "= input.read_repair"
          consistency: "= input.consistency"
          keyspace: "= input.keyspace"
          token: "= input.token"
          command: "= input.command"
        as: ml
      - return: {partitions: "= vars.live", timestamp: "= vars.newest", partition_repairs: "= vars.ml.value.repairs"}
  - component: replica-filtering-protection
    name: execute-read-command
    kind: function
    summary: "Re-queries a replica for rows another replica's filtered result may have hidden (local runnable on the READ stage, or READ_REQ)."
    sources: ["src/java/org/apache/cassandra/service/reads/ReplicaFilteringProtection.java:162-186"]
    request: {type: object, properties: {command: {type: object}, source: {type: string}, consistency: {type: string}}}
    response: {type: object}
    behavior:
      - set: {vars.cmd: "= has(input.command.start_token) ? {'kind': 'partition_range', 'keyspace': input.command.keyspace, 'table': input.command.table, 'start_token': input.command.start_token, 'end_token': has(input.command.end_token) ? input.command.end_token : input.command.start_token, 'limit': has(input.command.limit) ? input.command.limit : 100, 'digest': false} : {'kind': 'single_partition', 'keyspace': input.command.keyspace, 'table': input.command.table, 'partition_key': has(input.command.partition_key) ? input.command.partition_key : '', 'token': has(input.command.token) ? input.command.token : 0, 'limit': has(input.command.limit) ? input.command.limit : 100, 'digest': false}"}
      - if: "input.source == self"
        then:
          - call: storage-proxy-local-read-runnable.run
            input: {read_command: "= vars.cmd", replica: "= input.source"}
            as: lr
          - return: "= vars.lr.value"
      - call: read-command-verb-handler.do-verb
        on: "= input.source"
        input: {from: "= self", read_command: "= vars.cmd"}
        timeout_ms: 5000
        as: r
      - return: "= vars.r.value"

  - component: short-read-partitions-protection
    name: execute-read-command
    kind: function
    summary: "Fetches the additional partitions from the short replica (local runnable on the READ stage, or READ_REQ / RANGE_REQ)."
    sources: ["src/java/org/apache/cassandra/service/reads/ShortReadPartitionsProtection.java:178-195"]
    request: {type: object, properties: {command: {type: object}, source: {type: string}}}
    response: {type: object}
    behavior:
      - set: {vars.cmd: "= has(input.command.start_token) ? {'kind': 'partition_range', 'keyspace': input.command.keyspace, 'table': input.command.table, 'start_token': input.command.start_token, 'end_token': has(input.command.end_token) ? input.command.end_token : input.command.start_token, 'limit': has(input.command.limit) ? input.command.limit : 100, 'digest': false} : {'kind': 'single_partition', 'keyspace': input.command.keyspace, 'table': input.command.table, 'partition_key': has(input.command.partition_key) ? input.command.partition_key : '', 'token': has(input.command.token) ? input.command.token : 0, 'limit': has(input.command.limit) ? input.command.limit : 100, 'digest': false}"}
      - if: "input.source == self"
        then:
          - call: storage-proxy-local-read-runnable.run
            input: {read_command: "= vars.cmd", replica: "= input.source"}
            as: lr
          - return: "= vars.lr.value"
      - call: read-command-verb-handler.do-verb
        on: "= input.source"
        input: {from: "= self", read_command: "= vars.cmd"}
        timeout_ms: 5000
        as: r
      - return: "= vars.r.value"

  # ==================================================================== read repair
  - component: abstract-read-repair
    name: start-repair
    kind: function
    summary: "Re-sends full data reads to every contacted replica under a fresh read callback, speculating one more after the sampled latency, and waits for blockFor responses until the read deadline."
    sources:
      - "src/java/org/apache/cassandra/service/reads/repair/AbstractReadRepair.java:126-154"
      - "src/java/org/apache/cassandra/service/StorageProxy.java:2150-2161"
    request: {type: object, properties: {executor: CoordinationReadExecutor, contacts: {type: array, items: {type: string}}}}
    response: {type: object, properties: {received: {type: integer}}}
    errors:
      - {code: read-failure, status: 4864, summary: "the repair reads can no longer reach blockFor"}
      - {code: timeout, retryable: true, summary: "the repair reads timed out at the read deadline"}
    behavior:
      - set: {ctx.read_repair: "= input.executor.read_repair", ctx.repair: {responses: [], contacts: "= input.contacts"}}
      - parallel: "= input.contacts.map(e, {'replica': e, 'speculative': false}) + [{'replica': '', 'speculative': true}]"
        as: it
        join: {need: "= input.executor.plan.block_for"}
        timeout_ms: "= math.greatest(1, int(ctx.read.start) + int(config['read-request-timeout-ms']) - now)"
        on_insufficient: {code: read-failure, status: 4864}
        as_result: join
        steps:
          - if: "vars.it.speculative"
            then:
              - wait: "= input.executor.sample_read_latency_ms"
              - call: abstract-read-executor.maybe-send-additional-data-requests
                input: {executor: "= input.executor"}
                as: extra
              - return: "= vars.extra.value"
          - call: abstract-read-repair.send-read-command
            input: {command: "= input.executor.command", to: "= vars.it.replica", local: "= input.executor.plan.local", speculative: false}
            as: s
          - set: {ctx.repair.responses: "= ctx.repair.responses + [merge(vars.s.value, {'t': now})]"}
          - if: "!vars.s.value.ok"
            then:
              - fail: {code: "= vars.s.value.reason", message: repair read failed}
          - return: "= vars.s.value"
      - return: {received: "= vars.join.received"}
  - component: abstract-read-repair
    name: send-read-command
    kind: function
    summary: "One full data read for repair: locally on the READ stage for this node, else READ_REQ."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/AbstractReadRepair.java:93-121"]
    request:
      type: object
      properties:
        command: *read_command
        to: {type: string}
        local: {type: string}
        speculative: {type: boolean}
    response: CoordinationReplicaResponse
    behavior:
      - set: {vars.cmd: "= {'kind': 'single_partition', 'keyspace': input.command.keyspace, 'table': input.command.table, 'partition_key': input.command.partition_key, 'token': input.command.token, 'columns': has(input.command.columns) ? input.command.columns : [], 'limit': has(input.command.limit) ? input.command.limit : 100, 'digest': false}"}
      - if: "input.to == input.local"
        then:
          - title: This node reads locally on the READ stage
            source: "src/java/org/apache/cassandra/service/reads/repair/AbstractReadRepair.java:97-101"
            call: storage-proxy-local-read-runnable.run
            input: {read_command: "= vars.cmd", replica: "= input.local"}
            as: lr
          - return: "= vars.lr.value"
      - call: read-command-verb-handler.do-verb
        on: "= input.to"
        input: {from: "= self", read_command: "= vars.cmd"}
        timeout_ms: 5000
        as: resp
        on_error: continue
      - if: "vars.resp.ok"
        then:
          - call: read-callback.on-response
            input: {from: "= input.to", response: "= vars.resp.value", is_digest: false}
            as: rec
          - return: "= vars.rec.value"
      - call: read-callback.on-failure
        input: {from: "= input.to", code: "= vars.resp.error.code", is_digest: false}
        as: f
      - return: "= vars.f.value"
  - component: abstract-read-repair
    name: maybe-send-additional-reads
    kind: function
    summary: "If the level is at least QUORUM (not EACH_QUORUM) and the repair reads have not met blockFor by the sampled latency, read from one more uncontacted candidate."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/AbstractReadRepair.java:176-204"]
    request: {type: object, properties: {executor: CoordinationReadExecutor}}
    response: CoordinationReplicaResponse
    errors: [{code: no-speculation, summary: "nothing was sent"}]
    behavior:
      - set:
          vars.ok: "= ctx.repair.responses.filter(r, r.t <= now && r.ok)"
          vars.q: "= input.executor.plan.rf / 2 + 1"
      - set:
          vars.should: "= input.executor.consistency != 'EACH_QUORUM' && input.executor.plan.block_for >= vars.q && input.executor.sample_read_latency_ms <= config['read-request-timeout-ms']"
          vars.satisfied: "= size(vars.ok) >= input.executor.plan.block_for"
          vars.uncontacted: "= input.executor.plan.candidates.filter(e, !(e in ctx.repair.contacts))"
      - if: "!vars.should || vars.satisfied || size(vars.uncontacted) == 0"
        then:
          - fail: {code: no-speculation, message: repair reads need no speculation}
      - set: {ctx.repair_read_speculated_to: "= vars.uncontacted[0]", ctx.repair.contacts: "= ctx.repair.contacts + [vars.uncontacted[0]]"}
      - call: abstract-read-repair.send-read-command
        input: {command: "= input.executor.command", to: "= vars.uncontacted[0]", local: "= input.executor.plan.local", speculative: true}
        as: s
      - set: {ctx.repair.responses: "= ctx.repair.responses + [merge(vars.s.value, {'t': now})]"}
      - if: "!vars.s.value.ok"
        then:
          - fail: {code: "= vars.s.value.reason", message: speculative repair read failed}
      - return: "= vars.s.value"
  - component: abstract-read-repair
    name: await-reads
    kind: function
    summary: "Decides the repair reads from the full data responses received by now, then resolves them through the DataResolver (which builds the repairs)."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/AbstractReadRepair.java:156-174"]
    request: {type: object, properties: {executor: CoordinationReadExecutor}}
    response: {type: object, properties: {result: {type: object}}}
    errors: [*err-read-timeout, *err-read-failure]
    behavior:
      - set: {vars.responses: "= ctx.repair.responses.filter(r, r.t <= now)"}
      - call: read-callback.await-results
        input: {responses: "= vars.responses", block_for: "= input.executor.plan.block_for", contacts_count: "= size(ctx.repair.contacts)", consistency: "= input.executor.consistency"}
      - call: data-resolver.resolve
        input:
          command: "= input.executor.command"
          responses: "= vars.responses.filter(r, r.ok)"
          consistency: "= input.executor.consistency"
          read_repair: "= input.executor.read_repair"
          keyspace: "= input.executor.command.keyspace"
          token: "= input.executor.command.token"
        as: res
      - return: {result: "= vars.res.value"}
  - component: row-iterator-merge-listener
    name: close
    kind: function
    summary: "After the merge, builds one repair mutation per replica whose copy of a partition differs from the merged result and hands them to the read repair."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/RowIteratorMergeListener.java:365-399"]
    request:
      type: object
      properties:
        responses: {type: array, items: CoordinationReplicaResponse}
        merged: {type: array, items: {type: object}}
        read_repair: {type: string}
        consistency: {type: string}
        keyspace: {type: string}
        token: {type: integer}
        command: {type: object}
    response: {type: object, properties: {repairs: {type: array, items: {type: object}}, stale: {type: array, items: {type: string}}}}
    errors: [*err-unavailable]
    behavior:
      - if: "input.read_repair == 'NONE'"
        then:
          - title: "read_repair = NONE: ReadOnlyReadRepair merges with a no-op listener, so nothing is repaired"
            source: "src/java/org/apache/cassandra/service/reads/repair/ReadOnlyReadRepair.java:46-50"
            return: {repairs: [], stale: []}
      - title: A replica is stale for a partition when its cells differ from the merged cells
        source: "src/java/org/apache/cassandra/service/reads/repair/RowIteratorMergeListener.java:382-396"
        set:
          vars.per_partition: "= input.merged.map(m, {'partition': m, 'stale': input.responses.filter(r, !r.partitions.map(q, merge({'deletion_ts': -1, 'cells': []}, q)).exists(p, p.partition_key == m.partition_key && (p.deletion_ts >= 0 ? '!del@' + string(p.deletion_ts) : '') + '|' + p.cells.map(c, c.column + '=' + (has(c.deleted) && c.deleted ? '<tombstone>' : string(c.value)) + '@' + string(c.timestamp)).sort().join(',') == (m.deletion_ts >= 0 ? '!del@' + string(m.deletion_ts) : '') + '|' + m.cells.map(x, x.column + '=' + (has(x.deleted) && x.deleted ? '<tombstone>' : string(x.value)) + '@' + string(x.timestamp)).sort().join(','))).map(r, r.from)})"
      - choice: divergence
        default: "= vars.per_partition.exists(e, size(e.stale) > 0) ? 'stale_replicas' : 'in_sync'"
        options:
          in_sync:
            - return: {repairs: [], stale: []}
          stale_replicas:
            - set:
                vars.todo: "= vars.per_partition.exists(e, size(e.stale) > 0) ? vars.per_partition.filter(e, size(e.stale) > 0) : [{'partition': (size(input.merged) > 0 ? input.merged[0] : {'partition_key': has(input.command.partition_key) ? input.command.partition_key : '', 'cells': [], 'timestamp': 0, 'deletion_ts': -1}), 'stale': [input.responses[size(input.responses) - 1].from]}]"
            - set:
                ctx.stale_replicas: "= vars.todo.map(e, e.stale).flatten().distinct()"
                vars.repairs: []
            - foreach: "= vars.todo"
              as: e
              steps:
                - call: replica-plans.for-read-repair
                  input: {keyspace: "= input.keyspace", token: "= input.token", consistency: "= input.consistency", read_contacts: "= input.responses.map(r, r.from)"}
                  as: wp
                - title: "Each stale replica's diff: the merged cells its own copy lacks or holds older, and the partition deletion if its own is older"
                  source: "src/java/org/apache/cassandra/service/reads/repair/RowIteratorMergeListener.java:382-398"
                  set:
                    vars.own: "= vars.e.stale.filter(x, x in vars.wp.value.contacts).map(x, {'replica': x, 'p': input.responses.filter(r, r.from == x).map(r, r.partitions.map(q, merge({'deletion_ts': -1, 'cells': []}, q)).filter(q, q.partition_key == vars.e.partition.partition_key)).flatten()})"
                - set:
                    vars.diffs: "= vars.own.map(o, {'replica': o.replica, 'del': vars.e.partition.deletion_ts >= 0 && (size(o.p) == 0 || o.p[0].deletion_ts < vars.e.partition.deletion_ts), 'cells': vars.e.partition.cells.filter(c, size(o.p) == 0 || !o.p[0].cells.exists(d, d.column == c.column && d.timestamp == c.timestamp && (has(d.deleted) && d.deleted) == (has(c.deleted) && c.deleted) && string(d.value) == string(c.value)))})"
                - title: One repair mutation per stale replica in the repair write plan, carrying only that replica's diff
                  source: "src/java/org/apache/cassandra/service/reads/repair/RowIteratorMergeListener.java:382-398"
                  call: blocking-read-repair.repair-partition
                  input:
                    # A replica with an empty diff gets no mutation (createRepairMutation returns null). The
                    # forced 'stale_replicas' choice with no real divergence keeps the merged partition.
                    mutations: "= vars.diffs.filter(d, d.del || size(d.cells) > 0).map(d, {'replica': d.replica, 'mutation': {'keyspace': input.keyspace, 'table': input.command.table, 'partition_key': vars.e.partition.partition_key, 'token': input.token, 'timestamp': d.del ? vars.e.partition.deletion_ts : vars.e.partition.timestamp, 'partition_deletion': d.del, 'columns': {}, 'cells': d.cells}}) + (vars.diffs.exists(d, d.del || size(d.cells) > 0) ? [] : vars.diffs.map(d, {'replica': d.replica, 'mutation': {'keyspace': input.keyspace, 'table': input.command.table, 'partition_key': vars.e.partition.partition_key, 'token': input.token, 'timestamp': vars.e.partition.deletion_ts >= 0 ? vars.e.partition.deletion_ts : vars.e.partition.timestamp, 'partition_deletion': vars.e.partition.deletion_ts >= 0, 'columns': {}, 'cells': vars.e.partition.cells}}))"
                    write_plan: "= vars.wp.value"
                  as: rp
                - set: {vars.repairs: "= vars.repairs + [vars.rp.value]"}
            - return: {repairs: "= vars.repairs", stale: "= ctx.stale_replicas"}
  - component: blocking-read-repair
    name: repair-partition
    kind: function
    summary: "Creates a BlockingPartitionRepair for the partition: sends its repair mutations and records how many acks are still missing at the read deadline."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/BlockingReadRepair.java:111-117"]
    request:
      type: object
      properties:
        mutations: {type: array, items: {type: object, required: [replica, mutation], properties: {replica: {type: string}, mutation: *mutation}}}
        write_plan: CoordinationReplicaPlan
    response: {type: object}
    behavior:
      - set:
          vars.targets: "= input.mutations.map(m, m.replica)"
      - set:
          vars.block_for: "= math.greatest(0, input.write_plan.block_for - size(input.write_plan.contacts.filter(e, !(e in vars.targets))))"
      - call: blocking-partition-repair.send-initial-repairs
        input: {mutations: "= input.mutations", write_plan: "= input.write_plan", block_for: "= vars.block_for"}
        as: s
        on_error: continue
      - return:
          targets: "= vars.targets"
          block_for: "= vars.block_for"
          acked: "= vars.s.ok ? vars.s.value.acked : vars.s.error.data.received"
          waiting_on: "= vars.s.ok ? 0 : math.greatest(0, vars.block_for - vars.s.error.data.received)"
          write_plan: "= input.write_plan"
  - component: blocking-partition-repair
    name: send-initial-repairs
    kind: function
    summary: "Sends READ_REPAIR_REQ with its own diff to each stale replica at once and waits for blockFor (minus the contacts that needed nothing) acks until the read deadline; after the additional-write latency, the merged unacked diffs also go to each live uncontacted replica, whose ack counts in lieu."
    sources:
      - "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:145-163"
      - "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:69-98"
      - "src/java/org/apache/cassandra/service/reads/repair/BlockingReadRepair.java:83-95"
    request:
      type: object
      properties:
        mutations: {type: array, items: {type: object, required: [replica, mutation], properties: {replica: {type: string}, mutation: *mutation}}}
        write_plan: CoordinationReplicaPlan
        block_for: {type: integer}
    response: {type: object, properties: {acked: {type: integer}}}
    errors: [{code: read-timeout, status: 4608, summary: "fewer than blockFor acks by the read deadline"}]
    behavior:
      - set:
          ctx.repair_writes: {acks_at: []}
          ctx.repair_mutations_sent: "= size(input.mutations)"
          vars.deadline: "= int(ctx.read.start) + int(config['read-request-timeout-ms'])"
      - title: "mergeUnackedUpdates: the speculated update is the union of the per-replica diffs"
        source: "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:132-137"
        set:
          vars.merged_diff: "= size(input.mutations) == 0 ? {} : merge(input.mutations[0].mutation, {'partition_deletion': input.mutations.exists(m, m.mutation.partition_deletion), 'cells': input.mutations.map(m, m.mutation.cells).flatten().map(c, c.column).distinct().map(col, input.mutations.map(m, m.mutation.cells).flatten().filter(c, c.column == col)[0])})"
      - parallel: "= input.mutations.map(m, {'replica': m.replica, 'mutation': m.mutation, 'extra': false}) + input.write_plan.live_uncontacted.map(c, {'replica': c, 'mutation': vars.merged_diff, 'extra': true})"
        as: it
        join: {need: "= input.block_for"}
        timeout_ms: "= math.greatest(1, vars.deadline - now)"
        on_insufficient: {code: read-timeout, status: 4608}
        as_result: join
        steps:
          - if: "vars.it.extra"
            then:
              - title: Wait the additional-write latency before speculating repair writes
                source: "src/java/org/apache/cassandra/service/reads/repair/BlockingReadRepair.java:73-80"
                wait: "= config['initial-additional-write-latency-ms']"
              - call: blocking-read-repair.maybe-send-additional-writes
                input: {mutation: "= vars.it.mutation", replica: "= vars.it.replica", block_for: "= input.block_for", deadline: "= vars.deadline"}
                as: extra
              - return: "= vars.extra.value"
          - title: "READ_REPAIR_REQ is a separate verb so a timeout writes no hint; it expires after write_request_timeout"
            source: "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:157-159"
            call: read-repair-verb-handler.do-verb
            on: "= vars.it.replica"
            input: {from: "= self", mutation: "= vars.it.mutation"}
            timeout_ms: "= config['write-request-timeout-ms']"
            as: ack
            on_error: continue
          - if: "!vars.ack.ok"
            then:
              - title: "No failure callback for repair writes: the missing ack just counts down to the read deadline"
                source: "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:118-122"
                wait: "= math.greatest(0, vars.deadline - now) + 1"
              - fail: "= vars.ack.error"
          - call: blocking-partition-repair.on-response
            input: {from: "= vars.it.replica", waiting_on: "= math.greatest(0, input.block_for - size(ctx.repair_writes.acks_at))"}
          - set: {ctx.repair_writes.acks_at: "= ctx.repair_writes.acks_at + [now]"}
      - return: {acked: "= vars.join.received"}
  - component: blocking-partition-repair
    name: on-response
    kind: function
    summary: "Counts one READ_REPAIR_RSP (failures are ignored: the callback does not ask for failure responses)."
    sources:
      - "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:111-122"
      - "src/java/org/apache/cassandra/net/Verb.java:119"
    request: {type: object, properties: {from: {type: string}, waiting_on: {type: integer}}}
    response: {type: object, properties: {waiting_on: {type: integer}}}
    behavior:
      - return: {waiting_on: "= math.greatest(0, input.waiting_on - 1)"}

  - component: blocking-read-repair
    name: maybe-send-additional-writes
    kind: function
    summary: "After the additional-write latency, a partition repair that is still waiting speculates its merged update."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/BlockingReadRepair.java:73-80"]
    request: {type: object, properties: {mutation: *mutation, replica: {type: string}, block_for: {type: integer}, deadline: {type: integer}}}
    response: {type: object}
    errors: [{code: no-speculation, summary: "the repair was already acknowledged"}]
    behavior:
      - call: blocking-partition-repair.maybe-send-additional-writes
        input: "= input"
        as: r
      - return: "= vars.r.value"
  - component: blocking-partition-repair
    name: maybe-send-additional-writes
    kind: function
    summary: "If the repair is still waiting, send the merged unacked update to a live uncontacted replica; its ack counts in lieu of a missing one."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:198-240"]
    request: {type: object, properties: {mutation: *mutation, replica: {type: string}, block_for: {type: integer}, deadline: {type: integer}}}
    response: {type: object}
    errors: [{code: no-speculation, summary: "the repair was already acknowledged"}]
    behavior:
      - if: "size(ctx.repair_writes.acks_at.filter(t, t <= now)) >= input.block_for"
        then:
          - title: Every repair was acknowledged in time
            source: "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:200-201"
            fail: {code: no-speculation, message: repair already acknowledged}
      - set: {ctx.repair_writes_speculated: true}
      - title: Send the merged unacked update to an uncontacted replica
        source: "src/java/org/apache/cassandra/service/reads/repair/BlockingPartitionRepair.java:217-239"
        call: read-repair-verb-handler.do-verb
        on: "= input.replica"
        input: {from: "= self", mutation: "= input.mutation"}
        timeout_ms: "= config['write-request-timeout-ms']"
        as: ack
        on_error: continue
      - if: "!vars.ack.ok"
        then:
          - wait: "= math.greatest(0, input.deadline - now) + 1"
          - fail: "= vars.ack.error"
      - set: {ctx.repair_writes.acks_at: "= ctx.repair_writes.acks_at + [now]"}
      - return: {acked: true}
  - component: blocking-read-repair
    name: await-writes
    kind: function
    summary: "Waits until the read deadline (read_request_timeout 5000ms) for repair acks; a repair still waiting fails the read with ReadTimeout."
    sources: ["src/java/org/apache/cassandra/service/reads/repair/BlockingReadRepair.java:82-109"]
    request: {type: object, properties: {repair: {type: object}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors: [*err-read-timeout]
    behavior:
      - if: "input.repair.waiting_on > 0"
        then:
          - set: {ctx.phase: read repair timed out}
          - title: Timed out while read-repairing after receiving all data and digest responses
            source: "src/java/org/apache/cassandra/service/reads/repair/BlockingReadRepair.java:96-107"
            fail:
              code: read-timeout
              status: 4608
              message: Operation timed out while read-repairing
              data: {consistency: "= input.repair.write_plan.consistency", received: "= math.least(input.repair.block_for - input.repair.waiting_on, input.repair.block_for - 1)", block_for: "= input.repair.block_for", data_present: true}
      - return: {ok: true}

  - component: read-repair-verb-handler
    name: do-verb
    kind: verb
    summary: "Replica side of READ_REPAIR_REQ: out-of-range check, apply the mutation, empty response."
    sources:
      - "src/java/org/apache/cassandra/db/ReadRepairVerbHandler.java:29-43"
      - "src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:42-67"
      - "src/java/org/apache/cassandra/net/Verb.java:120"
    attributes: {verb: READ_REPAIR_REQ}
    request:
      type: object
      required: [mutation]
      properties:
        from: {type: string, examples: [n1]}
        mutation: *mutation
    response: {type: object, properties: {acked: {type: boolean}, from: {type: string}}}
    errors: [{code: unknown, summary: "failure response RequestFailureReason.UNKNOWN for an out-of-range mutation when reject_out_of_token_range_requests is true"}]
    behavior:
      - call: storage-service.is-endpoint-valid-for-write
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token", replica: "= self"}
        as: valid
      - if: "!vars.valid.value.valid"
        then:
          - set: {state.out_of_range_writes: "= state.out_of_range_writes + 1"}
          - if: "config['reject-out-of-token-range-requests']"
            then:
              - title: Mutation for a token this replica neither owns nor is pending for
                source: "src/java/org/apache/cassandra/db/AbstractMutationVerbHandler.java:63-64"
                fail: {code: unknown, message: "= 'Receiving mutation(s) for token(s) neither owned nor pending: ' + string(input.mutation.token)"}
      - call: keyspace.apply
        input: {mutation: "= input.mutation"}
      - return: {acked: true, from: "= self"}

  # ========================================================================= pagers
  - component: abstract-query-pager
    name: fetch-page
    kind: function
    summary: "Fetches the next page: page size capped at the remaining limit, query rebuilt from the paging state, run at the client's consistency level."
    sources:
      - "src/java/org/apache/cassandra/service/pager/AbstractQueryPager.java:63-77"
      - "src/java/org/apache/cassandra/service/pager/SinglePartitionPager.java:86-94"
      - "src/java/org/apache/cassandra/service/pager/PartitionRangeQueryPager.java:77-110"
    request:
      type: object
      required: [kind, command, page_size, remaining, consistency]
      properties:
        kind: {type: string, enum: [single_partition, partition_range], default: single_partition}
        command: *read_command
        page_size: {type: integer, examples: [5000]}
        remaining: {type: integer, examples: [12000]}
        exhausted: {type: boolean, default: false}
        consistency: *consistency
    response:
      type: object
      properties:
        rows: {type: array, items: {type: object}}
        page_size: {type: integer}
        remaining: {type: integer}
        exhausted: {type: boolean}
    errors: [*err-unavailable, *err-read-timeout, *err-read-failure]
    behavior:
      - if: "input.exhausted || input.remaining <= 0"
        then:
          - title: An exhausted pager returns an empty page without querying
            source: "src/java/org/apache/cassandra/service/pager/AbstractQueryPager.java:65-66"
            return: {rows: [], page_size: 0, remaining: 0, exhausted: true}
      - set: {vars.page: "= math.least(input.page_size, input.remaining)"}
      - set: {vars.cmd: "= {'kind': 'single_partition', 'keyspace': input.command.keyspace, 'table': input.command.table, 'partition_key': input.command.partition_key, 'token': input.command.token, 'columns': has(input.command.columns) ? input.command.columns : [], 'limit': vars.page, 'digest': false}"}
      - if: "input.kind == 'partition_range'"
        then:
          - title: The range query resumes at the last returned partition key
            source: "src/java/org/apache/cassandra/service/pager/PartitionRangeQueryPager.java:77-110"
            call: storage-proxy.get-range-slice
            input: {command: {keyspace: "= input.command.keyspace", table: "= input.command.table", start_token: "= input.command.token", end_token: -9223372036854775808, limit: "= vars.page", filtered: false}, consistency: "= input.consistency"}
            as: r
        else:
          - title: "SinglePartitionReadCommand.execute runs StorageProxy.read (read-path hop elided)"
            source: "src/java/org/apache/cassandra/service/pager/AbstractQueryPager.java:76"
            call: storage-proxy.read
            input: {read_command: "= vars.cmd", consistency: "= input.consistency"}
            as: r
      - return: {rows: "= vars.r.value.rows", page_size: "= vars.page", remaining: "= input.remaining - vars.page", exhausted: "= input.remaining - vars.page <= 0"}

  # ============================================= coordination interfaces other areas call
  - component: consistency-level
    name: validate-for-read
    kind: function
    summary: "ANY is refused for reads."
    sources: ["src/java/org/apache/cassandra/db/ConsistencyLevel.java:208-215"]
    request: {type: object, required: [consistency], properties: {consistency: *consistency}}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors: [*err-invalid]
    behavior:
      - if: "input.consistency == 'ANY'"
        then:
          - title: ANY is write-only
            source: "src/java/org/apache/cassandra/db/ConsistencyLevel.java:212-213"
            fail: {code: invalid, status: 8704, message: ANY ConsistencyLevel is only supported for writes}
      - return: {ok: true}

  - component: consistency-level
    name: validate-for-write
    kind: function
    summary: "SERIAL and LOCAL_SERIAL are refused for plain writes."
    sources: ["src/java/org/apache/cassandra/db/ConsistencyLevel.java:217-225"]
    request: {type: object, required: [consistency], properties: {consistency: *consistency}}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors: [*err-invalid]
    behavior:
      - if: "input.consistency == 'SERIAL' || input.consistency == 'LOCAL_SERIAL'"
        then:
          - title: Serial consistency needs a conditional update
            source: "src/java/org/apache/cassandra/db/ConsistencyLevel.java:221-223"
            fail: {code: invalid, status: 8704, message: You must use conditional updates for serializable writes}
      - return: {ok: true}

  - component: consistency-level
    name: validate-counter-for-write
    kind: function
    summary: "Counter writes refuse ANY and the serial levels."
    sources: ["src/java/org/apache/cassandra/db/ConsistencyLevel.java:252-259"]
    request: {type: object, required: [consistency], properties: {consistency: *consistency, table: {type: string, examples: [page_views]}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors: [*err-invalid]
    behavior:
      - if: "input.consistency == 'ANY'"
        then:
          - title: ANY is not supported for counters
            source: "src/java/org/apache/cassandra/db/ConsistencyLevel.java:254-255"
            fail: {code: invalid, status: 8704, message: "= 'Consistency level ANY is not yet supported for counter table ' + (has(input.table) ? input.table : '')"}
      - if: "input.consistency == 'SERIAL' || input.consistency == 'LOCAL_SERIAL'"
        then:
          - title: Counters are not serializable
            source: "src/java/org/apache/cassandra/db/ConsistencyLevel.java:257-258"
            fail: {code: invalid, status: 8704, message: Counter operations are inherently non-serializable}
      - return: {ok: true}

  - component: replica-plans
    name: for-batchlog-write
    kind: function
    summary: "Batchlog replicas for a logged batch: up to two live local-DC nodes other than this one (any node when the DC has two or fewer); CL is ONE for one endpoint, else TWO; Unavailable when none."
    sources:
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:238-277"
      - "src/java/org/apache/cassandra/locator/ReplicaPlans.java:280-357"
    request: {type: object, properties: {is_any: {type: boolean, default: false}}}
    response:
      type: object
      properties:
        endpoints: {type: array, items: {type: string}}
        consistency: {type: string, enum: [ONE, TWO]}
    errors: [*err-unavailable]
    behavior:
      - title: Every endpoint of the local datacenter (all are in datacenter1/rack1 under SimpleSnitch)
        source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:243-247"
        call: token-metadata.get-all-endpoints
        as: all
      - if: "size(vars.all.value.endpoints) <= 2"
        then:
          - title: "Two or fewer nodes in the DC: use them all, dead or alive, this node included"
            source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:296-298"
            set: {vars.chosen: "= vars.all.value.endpoints"}
        else:
          - set: {vars.validated: []}
          - title: Drop this node and endpoints the failure detector thinks are down
            source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:300-308"
            foreach: "= vars.all.value.endpoints.filter(e, e != self)"
            as: e
            steps:
              - call: failure-detector.is-alive
                input: {endpoint: "= vars.e"}
                as: a
              - when: "vars.a.value.alive"
                set: {vars.validated: "= vars.validated + [vars.e]"}
          - if: "size(vars.validated) <= 2"
            then:
              - set: {vars.chosen: "= vars.validated"}
            else:
              - title: "One rack left: shuffle and take two (batchlog_endpoint_strategy random_remote)"
                source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:345-357"
                choice: pick
                default: first_two
                options:
                  first_two: [{set: {vars.chosen: "= vars.validated.slice(0, 2)"}}]
                  last_two: [{set: {vars.chosen: "= vars.validated.slice(size(vars.validated) - 2, size(vars.validated))"}}]
      - set: {vars.cl: "= size(vars.chosen) == 1 ? 'ONE' : 'TWO'"}
      - if: "size(vars.chosen) == 0"
        then:
          - if: "has(input.is_any) && input.is_any"
            then:
              - title: "CL.ANY falls back to this node, but the plan keeps CL TWO (computed before the fallback)"
                source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:254-260"
                set: {vars.chosen: "= [self]"}
            else:
              - title: No live batchlog endpoint in the local DC
                source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:261-266"
                fail: {code: unavailable, status: 4096, message: "Cannot achieve consistency level TWO for batchlog in local DC, required:2, available:0", data: {consistency: TWO, required: 2, alive: 0}}
      - title: forWrite checks the chosen endpoints against the batchlog consistency level
        source: "src/java/org/apache/cassandra/locator/ReplicaPlans.java:270-276"
        call: replica-plans.assure-sufficient-live-replicas
        input: {consistency: "= vars.cl", live: "= vars.chosen", block_for: "= vars.cl == 'ONE' ? 1 : 2"}
      - return: {endpoints: "= vars.chosen", consistency: "= vars.cl"}

  - component: storage-proxy
    name: applies-locally
    kind: function
    summary: "Whether this node is a natural or pending replica of the mutation's token."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:991-999"]
    request: {type: object, required: [mutation], properties: {mutation: *mutation}}
    response: {type: object, properties: {applies_locally: {type: boolean, default: true}}}
    behavior:
      - call: replica-layout.for-token-write-live-and-down
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token"}
        as: layout
      - return: {applies_locally: "= self in vars.layout.value.all"}

  - component: storage-proxy
    name: apply-counter-mutation-on-leader
    kind: function
    summary: "On the leader that received COUNTER_MUTATION_REQ: performWrite with the counter performer, then wait for the client's consistency level before the verb handler replies."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1806-1810"]
    request:
      type: object
      required: [counter_mutation]
      properties:
        counter_mutation:
          type: object
          required: [mutation, consistency]
          properties:
            mutation: *mutation
            consistency: {type: string, enum: [ONE, TWO, THREE, QUORUM, LOCAL_QUORUM, EACH_QUORUM, ALL, LOCAL_ONE, ANY], default: ONE}
        local_dc: {type: string, examples: [datacenter1]}
    response: {type: object, properties: {acks: {type: integer}, block_for: {type: integer}, consistency: {type: string}, write_type: {type: string}}}
    errors: [*err-unavailable, *err-overloaded, *err-write-timeout, *err-write-failure]
    behavior:
      - call: storage-proxy.perform-write
        input: {mutation: "= input.counter_mutation.mutation", consistency: "= input.counter_mutation.consistency", write_type: COUNTER, performer: counter}
        as: h
      - title: The verb handler's callback answers the forwarding coordinator only once this handler signals
        source: "src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java:30-55"
        call: abstract-write-response-handler.get
        input: "= vars.h.value"
        as: done
      - return: "= vars.done.value"

  - component: storage-proxy
    name: mutate-mv
    kind: function
    summary: "Base replica sends materialized view updates to its paired view replicas: apply locally when paired with itself, else a BATCH write at ONE, with a local batchlog entry as the safety net."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1010-1113"]
    request:
      type: object
      required: [partition_key, mutations]
      properties:
        partition_key: {type: string, examples: ["user:42"]}
        base_token: {type: integer, examples: [100]}
        mutations: {type: array, minItems: 1, items: *mutation}
        write_commit_log: {type: boolean, default: true}
    response:
      type: object
      properties:
        path: {type: string, enum: [local-batchlog, paired]}
        applied_locally: {type: integer}
        sent: {type: integer}
        batchlogged: {type: integer}
    errors: [*err-unavailable, *err-overloaded]
    behavior:
      - call: storage-service.is-joined
        as: joined
      - if: "!vars.joined.value.joined"
        then:
          - title: "Starting, joining or moving (modelled as: not joined): everything goes to the local batchlog"
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1024-1028"
            call: batchlog-manager.store
            input: {replica: "= self", batch: {id: view-batch, creation_time: "= now", mutations: "= input.mutations"}}
          - return: {path: local-batchlog, applied_locally: 0, sent: 0, batchlogged: "= size(input.mutations)"}
      - set: {vars.non_local: [], vars.applied: 0, vars.sent: 0}
      - foreach: "= input.mutations"
        as: m
        steps:
          - call: view-utils.get-view-natural-endpoint
            input: {keyspace: "= vars.m.keyspace", base_token: "= has(input.base_token) ? input.base_token : vars.m.token", view_token: "= vars.m.token"}
            as: paired
          - call: token-metadata.get-write-endpoints
            input: {keyspace: "= vars.m.keyspace", token: "= vars.m.token"}
            as: we
          - if: "vars.paired.value.endpoint == ''"
            then:
              - title: No paired endpoint (range movement); keep it for the local batchlog
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:1053-1063"
                set: {vars.non_local: "= vars.non_local + [vars.m]"}
              - continue: true
          - if: "vars.paired.value.endpoint == self && vars.joined.value.joined && size(vars.we.value.pending) == 0"
            then:
              - title: Paired with itself and nothing pending; apply the view mutation locally
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:1064-1083"
                call: keyspace.apply
                input: {mutation: "= vars.m", replica: "= self", write_commit_log: "= !has(input.write_commit_log) || input.write_commit_log"}
              - set: {vars.applied: "= vars.applied + 1"}
            else:
              - set: {vars.non_local: "= vars.non_local + [vars.m]", vars.targets: "= [vars.paired.value.endpoint] + vars.we.value.pending.filter(e, e != vars.paired.value.endpoint)", vars.live: []}
              - foreach: "= vars.targets"
                as: t
                steps:
                  - call: failure-detector.is-alive
                    input: {endpoint: "= vars.t"}
                    as: a
                  - when: "vars.a.value.alive"
                    set: {vars.live: "= vars.live + [vars.t]"}
              - title: "Write to the paired view replica (and pending ones) at ONE, WriteType BATCH, on the VIEW_MUTATION stage; not awaited"
                source: "src/java/org/apache/cassandra/service/StorageProxy.java:1084-1105"
                call: storage-proxy.send-to-hinted-replicas
                input:
                  mutation: "= vars.m"
                  plan: {live: "= vars.live", local: "= self", block_for: 1}
                  contacts: "= vars.targets"
                  consistency: ONE
                  stage: VIEW_MUTATION
                  hint_on_failure: true
                  block_for: 1
                  timeout_ms: "= config['write-request-timeout-ms']"
                  await: false
              - set: {vars.sent: "= vars.sent + 1"}
      - if: "size(vars.non_local) > 0"
        then:
          - title: Non-local view mutations are stored in the local batchlog until their writes are acknowledged
            source: "src/java/org/apache/cassandra/service/StorageProxy.java:1101-1103"
            call: batchlog-manager.store
            input: {replica: "= self", batch: {id: view-batch, creation_time: "= now", mutations: "= vars.non_local"}}
      - return: {path: paired, applied_locally: "= vars.applied", sent: "= vars.sent", batchlogged: "= size(vars.non_local)"}

  # ================================================================= boundary stubs
  # --- hints-batchlog and paxos methods of StorageProxy (contracts copied from their fragments)
  - component: storage-proxy
    name: submit-hint
    kind: function
    summary: "Stores a hint of the mutation for one target on the MUTATION stage (HintsService.write); for CL.ANY it also acks the handler."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:2776-2820"]
    attributes: {boundary: true, owner: hints-batchlog}
    request:
      type: object
      required: [mutation, targets]
      properties:
        mutation: *mutation
        targets: {type: array, minItems: 1, items: {type: string, examples: ["n2"]}}
        consistency: {type: string, examples: [QUORUM]}
        coordinator: {type: string, default: "n1"}
    response: {type: object, properties: {queued: {type: boolean}, counted_as_ack: {type: boolean}}}
  - component: storage-proxy
    name: mutate-atomically
    kind: function
    summary: "Logged batch: write the batchlog to other nodes, then the mutations, then remove the batchlog."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1173-1256"]
    attributes: {boundary: true, owner: hints-batchlog}
    request:
      type: object
      required: [mutations, consistency]
      properties:
        mutations: {type: array, minItems: 1, items: *mutation}
        consistency: {type: string, examples: [QUORUM]}
        require_quorum_for_remove: {type: boolean, default: false}
        coordinator: {type: string, default: "n1"}
    errors: [*err-unavailable, *err-write-timeout, *err-write-failure]
  - component: storage-proxy
    name: read-with-paxos
    kind: function
    summary: "SERIAL / LOCAL_SERIAL read through Paxos."
    sources: ["src/java/org/apache/cassandra/service/StorageProxy.java:1898-1904"]
    attributes: {boundary: true, owner: paxos}
    request:
      type: object
      required: [consistency, read_command]
      properties:
        consistency: {type: string, enum: [SERIAL, LOCAL_SERIAL], default: SERIAL}
        read_command: *read_command
        group_size: {type: integer, default: 1}
    response:
      type: object
      properties:
        rows: {type: array, items: {type: object}}
    errors: [*err-invalid, *err-unavailable, *err-read-timeout, *err-read-failure]
  - component: batchlog-manager
    name: store
    kind: store
    summary: "Writes a batch as one row of the local system.batches table."
    sources: ["src/java/org/apache/cassandra/batchlog/BatchlogManager.java:134-165"]
    attributes: {boundary: true, owner: hints-batchlog}
    request:
      type: object
      required: [replica, batch]
      properties:
        replica: {type: string, examples: ["n1"]}
        batch:
          type: object
          required: [id, creation_time, mutations]
          properties:
            id: {type: string, examples: ["0f6a6c40-9d5e-11ef-8000-000000000001"]}
            creation_time: {type: integer, examples: [0]}
            mutations: {type: array, minItems: 1, items: *mutation}

  # --- membership (contracts copied from membership.yaml where it defines them)
  - component: failure-detector
    name: is-alive
    kind: function
    summary: Whether the failure detector considers an endpoint alive (this node always is).
    sources: ["src/java/org/apache/cassandra/gms/FailureDetector.java:299-311"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string, examples: ["n2"]}}}
    response: {type: object, required: [endpoint, alive], properties: {endpoint: {type: string}, alive: {type: boolean}}}
    store: {table: endpoints, op: get, key: "= input.endpoint", default: {endpoint: "= input.endpoint", alive: true}}
  - component: token-metadata
    name: get-write-endpoints
    kind: function
    summary: "CONTRACT: the natural replicas (ring walk with the keyspace's RF, primary first) and the pending replicas of a token; replicas = natural + pending."
    sources: ["src/java/org/apache/cassandra/locator/TokenMetadata.java:1333-1337"]
    attributes: {boundary: true, owner: membership}
    request:
      type: object
      required: [keyspace, token]
      properties:
        keyspace: {type: string, examples: [shop]}
        token: {type: integer, examples: [100]}
    response:
      type: object
      required: [keyspace, token, natural, pending, replicas]
      properties:
        keyspace: {type: string}
        token: {type: integer}
        natural: {type: array, items: {type: string}}
        pending: {type: array, items: {type: string}}
        replicas: {type: array, items: {type: string}}
    store:
      table: write_endpoints
      op: get
      key: "= string(input.token)"
      default:
        keyspace: "= input.keyspace"
        token: "= input.token"
        natural: ["n3", "n1", "n2"]
        pending: []
        replicas: ["n3", "n1", "n2"]
  - component: token-metadata
    name: get-replication-factor
    kind: function
    summary: "The keyspace's replication factor (Keyspace.getReplicationStrategy().getReplicationFactor())."
    sources: ["src/java/org/apache/cassandra/service/StorageService.java:5359"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, required: [keyspace], properties: {keyspace: {type: string, examples: [shop]}}}
    response: {type: object, properties: {keyspace: {type: string}, rf: {type: integer}}}
    store: {table: replication_factor, op: get, key: "= input.keyspace", default: {keyspace: "= input.keyspace", rf: 3}}
  - component: token-metadata
    name: sorted-tokens
    kind: function
    summary: "TokenMetadata.sortedTokens: every normal token with its endpoint, in ring order, plus the partitioner's minimum token."
    sources: [src/java/org/apache/cassandra/locator/TokenMetadata.java]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {}}
    response:
      type: object
      properties:
        ring: {type: array, items: {type: object, properties: {token: {type: integer}, endpoint: {type: string}}}}
        min_token: {type: integer}
    store:
      table: rings
      op: get
      key: ring
      default:
        min_token: -9223372036854775808
        ring:
          - {token: -6148914691236517206, endpoint: "n1"}
          - {token: 0, endpoint: "n2"}
          - {token: 6148914691236517205, endpoint: "n3"}
  - component: token-metadata
    name: get-host-id
    kind: function
    summary: The host id of an endpoint, or empty when it is not part of the ring.
    sources: ["src/java/org/apache/cassandra/locator/TokenMetadata.java:309-321"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string, examples: ["n2"]}}}
    response: {type: object, properties: {host_id: {type: string}}}
    store: {table: host_ids, op: get, key: "= input.endpoint", default: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}}
  - component: token-metadata
    name: get-all-endpoints
    kind: function
    summary: The ring's endpoints once all leaving endpoints are gone.
    sources: ["src/java/org/apache/cassandra/locator/TokenMetadata.java:713-738"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {}}
    response: {type: object, properties: {endpoints: {type: array, items: {type: string}}}}
    store: {table: all_endpoints, op: get, key: ring, default: {endpoints: ["n1", "n2", "n3"]}}
  - component: gossiper
    name: get-endpoint-downtime
    kind: function
    summary: Milliseconds since the endpoint was marked down (0 if up).
    sources: ["src/java/org/apache/cassandra/gms/Gossiper.java:541-548"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, required: [endpoint], properties: {endpoint: {type: string}}}
    response: {type: object, properties: {downtime_ms: {type: integer}}}
    store: {table: downtime, op: get, key: "= input.endpoint", default: {downtime_ms: 0}}
  - component: gossiper
    name: get-unreachable-token-owners
    kind: function
    summary: Token-owning endpoints the gossiper considers unreachable.
    sources: [src/java/org/apache/cassandra/gms/Gossiper.java]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {}}
    response: {type: object, properties: {endpoints: {type: array, items: {type: string}}}}
    store: {table: unreachable_token_owners, op: get, key: ring, default: {endpoints: []}}
  - component: gossiper
    name: get-live-members
    kind: function
    summary: The live endpoints plus this node.
    sources: ["src/java/org/apache/cassandra/gms/Gossiper.java:502-508"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {}}
    response: {type: object, properties: {members: {type: array, items: {type: string}}}}
    store: {table: live_members, op: get, key: ring, default: {members: ["n1", "n2", "n3"]}}
  - component: gossiper
    name: add-local-application-state
    kind: function
    summary: Publishes one of this node's application states (here SEVERITY) in gossip.
    sources: [src/java/org/apache/cassandra/gms/Gossiper.java]
    attributes: {boundary: true, owner: membership}
    request:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [SEVERITY]}
        value: {type: string}
  - component: storage-service
    name: is-bootstrap-mode
    kind: function
    summary: Whether an endpoint is still bootstrapping (StorageService.isBootstrapMode).
    sources: ["src/java/org/apache/cassandra/service/StorageService.java:2405"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {}}
    response: {type: object, properties: {bootstrap_mode: {type: boolean, default: false}}}
    store: {table: mode, op: get, key: local, default: {bootstrap_mode: false}}
  - component: storage-service
    name: is-joined
    kind: function
    summary: Whether this node is a ring member and not in write survey mode.
    sources: ["src/java/org/apache/cassandra/service/StorageService.java:1500-1503"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {}}
    response: {type: object, properties: {joined: {type: boolean}}}
    store: {table: joined, op: get, key: local, default: {joined: true}}
  - component: storage-service
    name: is-rpc-ready
    kind: function
    summary: Whether an endpoint has gossiped RPC_READY (accepts client requests).
    sources: ["src/java/org/apache/cassandra/service/StorageService.java:3074-3078"]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {endpoint: {type: string}}}
    response: {type: object, properties: {ready: {type: boolean, default: true}}}
    store: {table: rpc_ready, op: get, key: "= input.endpoint", default: {ready: true}}
  - component: storage-service
    name: get-live-ring-members
    kind: function
    summary: Live endpoints that own tokens (including this node).
    sources: [src/java/org/apache/cassandra/service/StorageService.java]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {include_self: {type: boolean}}}
    response: {type: object, properties: {endpoints: {type: array, items: {type: string}}}}
    store: {table: live_ring_members, op: get, key: ring, default: {endpoints: ["n1", "n2", "n3"]}}
  - component: storage-service
    name: is-endpoint-valid-for-write
    kind: function
    summary: Whether the token is in this replica's natural or pending ranges for the keyspace.
    sources: ["src/java/org/apache/cassandra/service/StorageService.java:5209-5213"]
    attributes: {boundary: true, owner: membership}
    request:
      type: object
      required: [keyspace, token]
      properties:
        keyspace: {type: string}
        token: {type: integer}
        replica: {type: string}
    response: {type: object, properties: {valid: {type: boolean, default: true}}}
    store: {table: valid_for_write, op: get, key: "= has(input.replica) ? input.replica : 'local'", default: {valid: true}}

  # --- ops
  # --- hints-batchlog
  - component: hints-service
    name: find-oldest-hint-timestamp
    kind: function
    summary: Creation time (ms) of the oldest stored hint for a host, Long.MAX_VALUE when none.
    sources: ["src/java/org/apache/cassandra/hints/HintsService.java:453-456"]
    attributes: {boundary: true, owner: hints-batchlog}
    request: {type: object, required: [host_id], properties: {host_id: {type: string}, holder: {type: string, default: "n1"}}}
    response: {type: object, properties: {timestamp: {type: integer}}}
    store: {table: oldest_hint, op: get, key: "= input.host_id", default: {timestamp: 9223372036854775807}}
  - component: hints-service
    name: get-total-hints-size
    kind: function
    summary: Bytes of hints stored on disk for a host.
    sources: [src/java/org/apache/cassandra/hints/HintsService.java]
    attributes: {boundary: true, owner: hints-batchlog}
    request: {type: object, required: [host_id], properties: {host_id: {type: string}, holder: {type: string, default: "n1"}}}
    response: {type: object, properties: {bytes: {type: integer}}}
    store: {table: hints_size, op: get, key: "= input.host_id", default: {bytes: 0}}

  # --- schema-auth
  - component: partition-denylist
    name: is-key-permitted
    kind: function
    summary: Whether a partition key is not denylisted.
    sources: [src/java/org/apache/cassandra/schema/PartitionDenylist.java]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}, partition_key: {type: string}}}
    response: {type: object, properties: {permitted: {type: boolean, default: true}}}
    store: {table: denied, op: get, key: "= input.keyspace + '.' + input.table + ':' + input.partition_key", default: {permitted: true}}
  - component: partition-denylist
    name: get-denied-keys-in-range-count
    kind: function
    summary: Number of denylisted keys inside a range of a table.
    sources: [src/java/org/apache/cassandra/schema/PartitionDenylist.java]
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}}}
    response: {type: object, properties: {count: {type: integer}}}
    store: {table: denied_ranges, op: get, key: "= input.keyspace + '.' + input.table", default: {count: 0}}

  # --- write-path (contracts copied from write-path.yaml)
  - component: keyspace
    name: apply
    kind: function
    summary: "Keyspace.apply: blocking local apply of a mutation on one replica (commit log, then memtable)."
    sources: ["src/java/org/apache/cassandra/db/Keyspace.java:483-511"]
    attributes: {boundary: true, owner: write-path}
    request:
      type: object
      required: [mutation]
      properties:
        mutation: *mutation
        replica: {type: string, examples: ["n1"]}
        write_commit_log: {type: boolean}
    response: {type: object, properties: {applied: {type: boolean}}}
  - component: view-manager
    name: updates-affect-view
    kind: function
    summary: True when any view of the updated table selects the update.
    sources: ["src/java/org/apache/cassandra/db/view/ViewManager.java:73-93"]
    attributes: {boundary: true, owner: write-path}
    request: {type: object, required: [keyspace, table], properties: {keyspace: {type: string}, table: {type: string}}}
    response: {type: object, properties: {affected: {type: boolean}, views: {type: array, items: {type: string}}}}
    store: {table: views, op: get, key: "= input.keyspace + '.' + input.table", default: {affected: false, views: []}}
  - component: view-utils
    name: get-view-natural-endpoint
    kind: function
    summary: "The view replica paired with this base replica (same position in the view token's replica list), or none during range movements."
    sources: ["src/java/org/apache/cassandra/db/view/ViewUtils.java:60-90"]
    attributes: {boundary: true, owner: write-path}
    request: {type: object, properties: {keyspace: {type: string}, base_token: {type: integer}, view_token: {type: integer}}}
    response: {type: object, properties: {endpoint: {type: string, description: "'' when there is no paired endpoint"}}}
    description: "Standalone mirror of write-path's choice point (self / remote / none) so scenarios validate without write-path; the owner's definition replaces it in the merge."
    behavior:
      - choice: pairing
        default: self
        options:
          self: [{return: {endpoint: "n1"}}]
          remote: [{return: {endpoint: "n2"}}]
          none: [{return: {endpoint: ""}}]
  - component: mutation-verb-handler
    name: do-verb
    kind: verb
    summary: "Replica side of MUTATION_REQ: apply locally and reply MUTATION_RSP, a failure response, or nothing (timeout)."
    sources: [src/java/org/apache/cassandra/db/MutationVerbHandler.java]
    attributes: {boundary: true, owner: write-path, verb: MUTATION_REQ}
    request:
      type: object
      required: [mutation]
      properties:
        from: {type: string, examples: ["n1"]}
        mutation: *mutation
    response: {type: object, required: [from, verb], properties: {from: {type: string}, verb: {type: string, enum: [MUTATION_RSP, COUNTER_MUTATION_RSP]}}}
  - component: counter-mutation-verb-handler
    name: do-verb
    kind: verb
    summary: "Leader side of COUNTER_MUTATION_REQ: applies the counter update as leader and replies once its own write meets the consistency level."
    sources: [src/java/org/apache/cassandra/db/CounterMutationVerbHandler.java]
    attributes: {boundary: true, owner: write-path, verb: COUNTER_MUTATION_REQ}
    request:
      type: object
      required: [counter_mutation]
      properties:
        from: {type: string, examples: ["n1"]}
        counter_mutation:
          type: object
          required: [mutation, consistency]
          properties:
            mutation: *mutation
            consistency: {type: string, enum: [ONE, TWO, THREE, QUORUM, LOCAL_QUORUM, EACH_QUORUM, ALL, LOCAL_ONE, ANY], default: ONE}
    response: {type: object, required: [from, verb], properties: {from: {type: string}, verb: {type: string, enum: [MUTATION_RSP, COUNTER_MUTATION_RSP]}}}
  - component: counter-mutation
    name: apply-counter-mutation
    kind: function
    summary: "Leader read-modify-write: locks the counter cells, reads current values and applies the resulting mutation locally."
    sources: [src/java/org/apache/cassandra/db/CounterMutation.java]
    attributes: {boundary: true, owner: write-path}
    request:
      type: object
      required: [mutation, consistency]
      properties:
        mutation: *mutation
        consistency: {type: string, enum: [ONE, TWO, THREE, QUORUM, LOCAL_QUORUM, EACH_QUORUM, ALL, LOCAL_ONE, ANY], default: ONE}
        replica: {type: string}
    response: {type: object, properties: {mutation: *mutation}}
    errors: [*err-write-timeout]
  - component: column-family-store
    name: truncate-blocking
    kind: function
    summary: "Local truncate of a table on one replica: flush, snapshot (auto_snapshot), discard SSTables."
    sources: [src/java/org/apache/cassandra/db/ColumnFamilyStore.java]
    attributes: {boundary: true, owner: write-path}
    request: {type: object, required: [keyspace, table], properties: {replica: {type: string}, keyspace: {type: string}, table: {type: string}}}
    response: {type: object, properties: {truncated: {type: boolean}}}
  - component: truncate-verb-handler
    name: do-verb
    kind: verb
    summary: "Replica side of TRUNCATE_REQ: truncate locally and reply with TruncateResponse."
    sources: [src/java/org/apache/cassandra/db/TruncateVerbHandler.java]
    attributes: {boundary: true, owner: write-path, verb: TRUNCATE_REQ}
    request:
      type: object
      required: [keyspace, table]
      properties:
        from: {type: string, examples: ["n1"]}
        keyspace: {type: string, examples: [shop]}
        table: {type: string, examples: [users]}

  # --- read-path (contracts copied from read-path.yaml)
  - component: read-command-verb-handler
    name: do-verb
    kind: verb
    summary: "Replica side of READ_REQ and RANGE_REQ: executes the command locally and returns a data or digest ReadResponse, or a failure response."
    sources: [src/java/org/apache/cassandra/db/ReadCommandVerbHandler.java]
    attributes: {boundary: true, owner: read-path, verb: READ_REQ}
    request:
      type: object
      required: [read_command]
      properties:
        from: {type: string, examples: ["n1"]}
        read_command: *read_command
        track_repaired_data: {type: boolean, default: false}
        track_warnings: {type: boolean, default: false}
    response: *read_response
    errors:
      - {code: tombstone-overwhelming, summary: "Failure response with reason READ_TOO_MANY_TOMBSTONES."}
      - {code: timeout, retryable: true, summary: "No response before the verb's deadline."}
  - component: read-command
    name: execute-locally
    kind: function
    summary: "ReadCommand.executeLocally on one replica's memtables and SSTables."
    sources: [src/java/org/apache/cassandra/db/ReadCommand.java]
    attributes: {boundary: true, owner: read-path}
    request:
      type: object
      properties:
        replica: {type: string}
        read_command: *read_command
        track_repaired_data: {type: boolean, default: false}
    response:
      type: object
      properties:
        partitions:
          type: array
          examples: [[{partition_key: "user:42", cells: [{column: name, value: Ada, timestamp: 1730000000000000}], timestamp: 1730000000000000}]]
          items: {type: object}
    errors: [{code: tombstone-overwhelming}]
  - component: read-command
    name: create-response
    kind: function
    summary: "ReadCommand.createResponse: a digest response for digest queries, else a data response (with its digest)."
    sources: [src/java/org/apache/cassandra/db/ReadCommand.java]
    attributes: {boundary: true, owner: read-path}
    request:
      type: object
      properties:
        replica: {type: string}
        read_command: *read_command
        result: {type: object}
    response: *read_response

flows:
- id: coordinator-write
  name: Coordinated write (INSERT / UPDATE / DELETE / unlogged batch)
  description: The CQL layer hands mutations to StorageProxy.mutateWithTriggers; the coordinator sends them to every replica and waits for the consistency level.
  entry:
    caller: cql
    interface: storage-proxy.mutate-with-triggers
    input:
      consistency: QUORUM
      mutations:
      - keyspace: shop
        table: users
        partition_key: user:42
        token: 100
        timestamp: 1730000000000000
        columns:
          name: Ada
          email: ada@example.com
        counter: false
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:1116-1160
  tags:
  - writes
- id: counter-write
  name: Coordinated counter write
  description: 'A counter UPDATE: StorageProxy.mutate routes the CounterMutation to a leader replica, which reads, increments and replicates.'
  entry:
    caller: cql
    interface: storage-proxy.mutate
    input:
      consistency: QUORUM
      mutations:
      - keyspace: shop
        table: page_views
        partition_key: page:home
        token: 100
        timestamp: 1730000000000000
        columns:
          views: 1
        counter: true
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:1723-1755
  tags:
  - writes
- id: coordinator-read
  name: Coordinated single-partition read
  description: 'SELECT of one partition: data request to the closest replica, digests to the rest, speculative retry, read repair on mismatch.'
  entry:
    caller: cql
    interface: storage-proxy.read
    input:
      consistency: QUORUM
      read_command:
        keyspace: shop
        table: users
        partition_key: user:42
        token: 100
        columns:
        - name
        - email
        limit: 100
        digest: false
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:1858-1886
- id: range-read
  name: Coordinated range read
  description: 'SELECT without a partition key (or a secondary index query): the ring is cut into sub-ranges, merged where replicas overlap, and each queried with RANGE_REQ.'
  entry:
    caller: cql
    interface: storage-proxy.get-range-slice
    input:
      consistency: QUORUM
      command:
        keyspace: shop
        table: users
        start_token: -9223372036854775808
        end_token: -9223372036854775808
        limit: 100
        filtered: false
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:2277-2294
- id: truncate
  name: TRUNCATE on every node
  description: TruncateStatement calls StorageProxy.truncateBlocking, which needs every token owner up and every live member to answer.
  entry:
    caller: cql
    interface: storage-proxy.truncate-blocking
    input:
      keyspace: shop
      table: users
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:2511-2545
  tags:
  - writes
- id: paged-read
  name: Paged query (one page)
  description: 'The CQL layer pages a SELECT: each fetchPage runs the read with the page size as the limit.'
  entry:
    caller: cql
    interface: abstract-query-pager.fetch-page
    input:
      kind: single_partition
      page_size: 5000
      remaining: 12000
      exhausted: false
      consistency: QUORUM
      command:
        keyspace: shop
        table: users
        partition_key: user:42
        token: 100
        columns:
        - name
        - email
        limit: 12000
        digest: false
  sources:
  - src/java/org/apache/cassandra/service/pager/AbstractQueryPager.java:63-77
- id: read-repair-replica
  name: Replica applies a read-repair mutation
  description: A replica receives READ_REPAIR_REQ from a coordinator and applies the repair.
  entry:
    caller: messaging
    interface: read-repair-verb-handler.do-verb
    input:
      from: n1
      mutation:
        keyspace: shop
        table: users
        partition_key: user:42
        token: 100
        timestamp: 1730000000000000
        columns:
          name: Ada
          email: ada@example.com
    'on': n2
  sources:
  - src/java/org/apache/cassandra/db/ReadRepairVerbHandler.java:29-43
  tags:
  - writes
- id: dynamic-snitch-update
  name: Dynamic snitch rescoring (every 100ms)
  description: ScheduledExecutors.scheduledTasks runs updateScores every dynamic_snitch_update_interval.
  entry:
    caller: cassandra-node
    interface: dynamic-endpoint-snitch.update-scores
    repeat:
      count: 3
      interval_ms: 100
  sources:
  - src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:108-113
  tags:
  - writes
- id: dynamic-snitch-reset
  name: Dynamic snitch reset (every 10 minutes)
  description: ScheduledExecutors.scheduledTasks clears the latency samples every dynamic_snitch_reset_interval.
  entry:
    caller: cassandra-node
    interface: dynamic-endpoint-snitch.reset
    repeat:
      count: 2
      interval_ms: 600000
  sources:
  - src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:108-113
  tags:
  - writes
- id: snitch-set-severity
  name: Operator sets this node's severity (JMX)
  description: DynamicEndpointSnitchMBean.setSeverity gossips a badness that peers add to this node's score.
  entry:
    caller: operator
    interface: dynamic-endpoint-snitch.set-severity
    input:
      severity: 2.5
  sources:
  - src/java/org/apache/cassandra/locator/DynamicEndpointSnitch.java:372-381
- id: counter-leader
  name: Leader replica applies a forwarded counter update
  description: CounterMutationVerbHandler hands a forwarded counter mutation to StorageProxy.applyCounterMutationOnLeader on this node.
  entry:
    caller: messaging
    interface: storage-proxy.apply-counter-mutation-on-leader
    input:
      local_dc: datacenter1
      counter_mutation:
        consistency: QUORUM
        mutation:
          keyspace: shop
          table: page_views
          partition_key: page:home
          token: 100
          timestamp: 1730000000000000
          columns:
            views: 1
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:1806-1810
  tags:
  - writes
- id: view-mutation
  name: Base replica pushes materialized view updates
  description: Keyspace.apply on a base replica calls StorageProxy.mutateMV for the view mutations it generated.
  entry:
    caller: write-path
    interface: storage-proxy.mutate-mv
    input:
      partition_key: user:42
      base_token: 100
      write_commit_log: true
      mutations:
      - keyspace: shop
        table: users_by_email
        partition_key: ada@example.com
        token: 200
        timestamp: 1730000000000000
        columns:
          user_id: user:42
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:1010-1113
  tags:
  - writes
- id: batchlog-endpoints
  name: Choose batchlog replicas for a logged batch
  description: mutateAtomically asks ReplicaPlans.forBatchlogWrite where to store the batchlog.
  entry:
    caller: hints-batchlog
    interface: replica-plans.for-batchlog-write
    input:
      is_any: false
  sources:
  - src/java/org/apache/cassandra/locator/ReplicaPlans.java:238-277
- id: applies-locally
  name: Is this node a replica of a mutation?
  description: StorageProxy.appliesLocally, used by batchlog replay.
  entry:
    caller: hints-batchlog
    interface: storage-proxy.applies-locally
    input:
      mutation:
        keyspace: shop
        table: users
        partition_key: user:42
        token: 100
        timestamp: 1730000000000000
        columns:
          name: Ada
  sources:
  - src/java/org/apache/cassandra/service/StorageProxy.java:991-999
- id: validate-write-consistency
  name: Validate a write's consistency level
  description: ModificationStatement and BatchStatement validate the consistency level before executing.
  entry:
    caller: cql
    interface: consistency-level.validate-for-write
    input:
      consistency: QUORUM
  sources:
  - src/java/org/apache/cassandra/db/ConsistencyLevel.java:217-225
- id: validate-read-consistency
  name: Validate a read's consistency level
  description: SelectStatement validates the consistency level before executing.
  entry:
    caller: cql
    interface: consistency-level.validate-for-read
    input:
      consistency: QUORUM
  sources:
  - src/java/org/apache/cassandra/db/ConsistencyLevel.java:208-215
- id: validate-counter-consistency
  name: Validate a counter write's consistency level
  description: Counter updates validate the consistency level before executing.
  entry:
    caller: cql
    interface: consistency-level.validate-counter-for-write
    input:
      consistency: QUORUM
      table: page_views
  sources:
  - src/java/org/apache/cassandra/db/ConsistencyLevel.java:252-259

scenarios:
- id: write-quorum-all-ack
  flow: coordinator-write
  name: QUORUM write, every replica acknowledges
  fixtures:
  - three-node-rf3
  expect:
  - result.ok && result.value.path == 'standard' && result.value.acks >= 2 && result.value.block_for == 2
  - calls['mutation-verb-handler.do-verb'] == 2 && calls['storage-proxy.perform-locally'] == 1
  - calls['storage-proxy.submit-hint'] == 0 && ctx.write_type == 'SIMPLE'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'mutation-verb-handler.do-verb' && e.instance == 'n3')
- id: write-unlogged-batch-two-mutations
  flow: coordinator-write
  name: 'Unlogged batch of two mutations: each is sent to its replicas, write type UNLOGGED_BATCH'
  fixtures:
  - three-node-rf3
  input:
    mutations:
    - keyspace: shop
      table: users
      partition_key: user:42
      token: 100
      timestamp: 1730000000000000
      columns:
        name: Ada
      counter: false
    - keyspace: shop
      table: users
      partition_key: user:43
      token: 200
      timestamp: 1730000000000000
      columns:
        name: Alan
      counter: false
  expect:
  - result.ok && result.value.write_type == 'UNLOGGED_BATCH' && ctx.write_type == 'UNLOGGED_BATCH'
  - calls['storage-proxy.perform-write'] == 2 && calls['abstract-write-response-handler.get'] == 2
  - trace.exists(e, e.type == 'call.start' && e.interface == 'mutation-verb-handler.do-verb' && e.instance == 'n3')
- id: write-quorum-one-down-hinted
  flow: coordinator-write
  name: 'QUORUM write, one replica down: succeeds and hints it'
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
  expect:
  - result.ok && result.value.acks == 2
  - calls['mutation-verb-handler.do-verb'] == 1 && calls['storage-proxy.submit-hint'] == 1
  - ctx.hinted == ['n2']
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n2' in e.input.targets)
- id: write-quorum-two-down-unavailable
  flow: coordinator-write
  name: 'QUORUM write, two replicas down: Unavailable before anything is sent'
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
        n3:
          alive: false
  expect:
  - '!result.ok && result.error.code == ''unavailable'' && result.error.status == 4096'
  - result.error.data.required == 2 && result.error.data.alive == 1
  - calls['mutation-verb-handler.do-verb'] == 0 && calls['storage-proxy.perform-locally'] == 0 && calls['storage-proxy.submit-hint'] == 0
- id: write-all-one-down-unavailable
  flow: coordinator-write
  name: ALL write with one replica down is Unavailable
  fixtures:
  - three-node-rf3
  input:
    consistency: ALL
  state:
    gossiper@n1:
      endpoint_state_map:
        n3:
          alive: false
  expect:
  - '!result.ok && result.error.code == ''unavailable'' && result.error.data.required == 3 && result.error.data.alive == 2'
  - calls['mutation-verb-handler.do-verb'] == 0
- id: write-one-replica-timeout-hinted
  flow: coordinator-write
  name: 'ONE write, a live replica times out: still succeeds, the timed-out replica is hinted'
  fixtures:
  - three-node-rf3
  input:
    consistency: ONE
  faults:
  - target: mutation-verb-handler.do-verb
    type: timeout
    instance: n3
  expect:
  - result.ok && result.value.block_for == 1 && result.value.acks == 1 && duration_ms < 100
  - calls['storage-proxy.submit-hint'] == 1 && ctx.hinted == ['n3']
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n3' in e.input.targets)
- id: write-quorum-two-timeouts
  flow: coordinator-write
  name: 'QUORUM write, both remote replicas time out: WriteTimeout with 1 of 2 acks, both hinted'
  fixtures:
  - three-node-rf3
  faults:
  - target: mutation-verb-handler.do-verb
    type: timeout
  expect:
  - '!result.ok && result.error.code == ''write-timeout'' && result.error.status == 4352'
  - result.error.data.received == 1 && result.error.data.block_for == 2 && result.error.data.write_type == 'SIMPLE'
  - calls['storage-proxy.submit-hint'] == 2 && size(ctx.hinted) == 2
  - duration_ms >= 2000 && duration_ms < 2100
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n2' in e.input.targets)
- id: write-quorum-replica-failures
  flow: coordinator-write
  name: 'QUORUM write, both remote replicas answer with failures: WriteFailure'
  fixtures:
  - three-node-rf3
  faults:
  - target: mutation-verb-handler.do-verb
    type: error
    code: write-error
    status: 500
  expect:
  - '!result.ok && result.error.code == ''write-failure'' && result.error.status == 5376'
  - result.error.data.failures == 2 && result.error.data.block_for == 2
  - calls['storage-proxy.submit-hint'] == 2
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n3' in e.input.targets)
- id: write-quorum-timeout-and-failure
  flow: coordinator-write
  name: 'QUORUM write, one remote times out and one fails: the failure alone can''t signal (2 + 1 = 3 candidates), and the handler''s deadline (from the request start) passes before the timed-out callback
    expires, so WriteTimeout'
  fixtures:
  - three-node-rf3
  faults:
  - target: mutation-verb-handler.do-verb
    type: timeout
    instance: n3
  - target: mutation-verb-handler.do-verb
    type: error
    code: write-error
    status: 500
    instance: n2
  expect:
  - '!result.ok && result.error.code == ''write-timeout'' && result.error.data.received == 1'
  - duration_ms >= 2000 && duration_ms < 2100
  - calls['storage-proxy.submit-hint'] == 2
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n3' in e.input.targets)
- id: write-quorum-down-plus-failure-times-out
  flow: coordinator-write
  name: 'QUORUM write, one replica down and one fails: WriteTimeout, because the never-sent request is not a failure'
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
  faults:
  - target: mutation-verb-handler.do-verb
    type: error
    code: write-error
    status: 500
  expect:
  - '!result.ok && result.error.code == ''write-timeout'' && result.error.data.received == 1'
  - calls['storage-proxy.submit-hint'] == 2
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint' && 'n2' in e.input.targets)
- id: write-any-all-replicas-down
  flow: coordinator-write
  name: 'ANY write with every replica down, coordinator not a replica (4-node ring, token -100 -> n2, .4, .3): the hint is the ack'
  fixtures:
  - four-node-rf3
  input:
    consistency: ANY
    mutations:
    - keyspace: shop
      table: users
      partition_key: user:7
      token: -100
      timestamp: 1730000000000000
      columns:
        name: Grace
      counter: false
  state:
    gossiper@n1:
      endpoint_state_map:
        n4:
          alive: false
        n2:
          alive: false
        n3:
          alive: false
  expect:
  - result.ok && result.value.acks == 1 && result.value.block_for == 1
  - calls['mutation-verb-handler.do-verb'] == 0 && calls['storage-proxy.perform-locally'] == 0
  - calls['storage-proxy.submit-hint'] == 1 && size(ctx.hinted) == 3
  - trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.submit-hint').map(e, size(e.input.targets)) == [3]
- id: write-hints-disabled
  flow: coordinator-write
  name: 'hinted_handoff_enabled false: a down replica is not hinted'
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
  expect:
  - result.ok && calls['storage-proxy.submit-hint'] == 0 && ctx.hinted == []
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''storage-proxy.submit-hint'')'
  config:
    hinted-handoff-enabled: false
- id: write-hint-window-expired
  flow: coordinator-write
  name: 'Replica down longer than max_hint_window (3h): no hint'
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
          down_since_ms: -11000000
  expect:
  - result.ok && calls['storage-proxy.submit-hint'] == 0
  - calls['hints-service.find-oldest-hint-timestamp'] == 0
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''storage-proxy.submit-hint'')'
- id: write-denylisted-partition
  flow: coordinator-write
  name: 'Denylist enabled and the key is denylisted: InvalidRequest, nothing sent'
  fixtures:
  - three-node-rf3
  state:
    partition-denylist:
      denied:
        shop.users:user:42:
          permitted: false
  expect:
  - '!result.ok && result.error.code == ''invalid'' && result.error.status == 8704'
  - calls['replica-plans.for-write'] == 0 && ctx.phase == 'denylisted'
  config:
    partition-denylist-enabled: true
- id: write-logged-batch-atomic
  flow: coordinator-write
  name: Logged batch goes to mutateAtomically (batchlog), not mutate
  fixtures:
  - three-node-rf3
  input:
    mutate_atomically: true
  expect:
  - result.ok && result.value.path == 'atomic'
  - calls['storage-proxy.mutate-atomically'] == 1 && calls['storage-proxy.mutate'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-atomically' && e.instance == 'n1')
- id: write-view-update-atomic
  flow: coordinator-write
  name: A write to a table with materialized views is made atomic through the batchlog
  fixtures:
  - three-node-rf3
  state:
    view-manager:
      views_by_base_table:
        shop.users:
        - users_by_email
  expect:
  - result.ok && result.value.path == 'atomic' && calls['storage-proxy.mutate-atomically'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-atomically' && e.instance == 'n1')
- id: write-hint-overload
  flow: coordinator-write
  name: 'Too many hints in flight and the down replica already has some: Overloaded'
  fixtures:
  - three-node-rf3
  state:
    storage-proxy:
      total_hints_in_progress: 2000
      hints_in_progress:
        n2: 5
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
  expect:
  - '!result.ok && result.error.code == ''overloaded'' && result.error.status == 4097'
  - calls['mutation-verb-handler.do-verb'] == 0
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''mutation-verb-handler.do-verb'')'
- id: write-coordinator-not-replica
  flow: coordinator-write
  name: 'Coordinator is not a replica (4-node ring, token -100): all three replicas get MUTATION_REQ, nothing applied locally'
  fixtures:
  - four-node-rf3
  input:
    mutations:
    - keyspace: shop
      table: users
      partition_key: user:7
      token: -100
      timestamp: 1730000000000000
      columns:
        name: Grace
      counter: false
  expect:
  - result.ok && calls['mutation-verb-handler.do-verb'] == 3 && calls['storage-proxy.perform-locally'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'mutation-verb-handler.do-verb' && e.instance == 'n4')
- id: write-any-timeout-falls-back-to-hints
  flow: coordinator-write
  name: 'ANY write where every live replica fails: the coordinator hints everything and reports success'
  fixtures:
  - four-node-rf3
  input:
    consistency: ANY
    mutations:
    - keyspace: shop
      table: users
      partition_key: user:7
      token: -100
      timestamp: 1730000000000000
      columns:
        name: Grace
      counter: false
  faults:
  - target: mutation-verb-handler.do-verb
    type: error
    code: write-error
    status: 500
  expect:
  - result.ok && result.value.path == 'hinted-for-any'
  - calls['storage-proxy.hint-mutation'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.hint-mutation' && e.instance == 'n1')
- id: write-pending-replica-raises-block-for
  flow: coordinator-write
  name: A pending (bootstrapping) replica is written to and raises blockFor to 3
  fixtures:
  - three-node-rf3
  state:
    token-metadata@n1:
      pending_ranges:
      - keyspace: '*'
        left: 0
        right: 6148914691236517205
        endpoint: n4
    gossiper@n1:
      endpoint_state_map:
        n4:
          endpoint: n4
          alive: true
          status: BOOT
          generation: 1793314800
          heartbeat: 300
          max_version: 300
          host_id: 6d194555-f6eb-41d0-c000-000000000004
          dc: datacenter1
          rack: rack1
          tokens:
          - 3000000000000000000
          load: 0
          rpc_ready: false
          update_ms: 0
  expect:
  - result.ok && result.value.block_for == 3 && result.value.acks >= 3
  - calls['mutation-verb-handler.do-verb'] == 3
  - trace.exists(e, e.type == 'call.start' && e.interface == 'mutation-verb-handler.do-verb' && e.instance == 'n4')
  topology:
    cassandra-node:
    - n1
    - n2
    - n3
    - n4
- id: counter-forwarded-to-leader
  flow: counter-write
  name: 'Counter write: the leader is another replica, so the coordinator forwards COUNTER_MUTATION_REQ'
  fixtures:
  - three-node-rf3
  expect:
  - result.ok && ctx.counter_leader == 'n3'
  - calls['counter-mutation-verb-handler.do-verb'] == 1 && ctx.counter_leader == 'n3'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'counter-mutation-verb-handler.do-verb' && e.instance == 'n3')
- id: counter-coordinator-is-leader
  flow: counter-write
  name: 'Counter write: this node is picked as leader, applies the counter and replicates'
  fixtures:
  - three-node-rf3
  choices:
    storage-proxy.find-suitable-replica.leader: second
  expect:
  - result.ok && ctx.counter_leader == 'self'
  - calls['storage-proxy.counter-write-task'] == 1 && calls['mutation-verb-handler.do-verb'] == 2
  - calls['counter-mutation-verb-handler.do-verb'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.counter-write-task' && e.instance == 'n1')
- id: counter-no-live-replica
  flow: counter-write
  name: 'Counter write with no live replica: Unavailable. This node always counts itself alive (FailureDetector.java:301-302), so it must not be a replica: 4-node ring, token -100, replicas n2, .4 and .3
    all down'
  fixtures:
  - four-node-rf3
  input:
    mutations:
    - keyspace: shop
      table: page_views
      partition_key: page:about
      token: -100
      timestamp: 1730000000000000
      columns:
        views: 1
      counter: true
  state:
    gossiper@n1:
      endpoint_state_map:
        n4:
          alive: false
        n2:
          alive: false
        n3:
          alive: false
  expect:
  - '!result.ok && result.error.code == ''unavailable'' && result.error.data.alive == 0'
  - calls['counter-mutation-verb-handler.do-verb'] == 0
- id: counter-leader-timeout
  flow: counter-write
  name: 'Counter leader does not answer within counter_write_request_timeout (5000ms): WriteTimeout at CL ONE'
  fixtures:
  - three-node-rf3
  faults:
  - target: counter-mutation-verb-handler.do-verb
    type: timeout
  expect:
  - '!result.ok && result.error.code == ''write-timeout'' && result.error.data.write_type == ''COUNTER'''
  - result.error.data.consistency == 'ONE' && duration_ms >= 5000
- id: read-quorum-digests-match
  flow: coordinator-read
  name: 'QUORUM read: data from n3, digest from this node, digests match'
  fixtures:
  - three-node-rf3
  expect:
  - result.ok
  - calls['read-command-verb-handler.do-verb'] == 1 && calls['storage-proxy-local-read-runnable.run'] == 1
  - ctx.read_executor == 'speculating' && ctx.digest_mismatch == false && calls['read-repair-verb-handler.do-verb'] == 0
- id: read-one-closest-replica
  flow: coordinator-read
  name: ONE read goes to the first replica in ring order (SimpleSnitch does not prefer the local node)
  fixtures:
  - three-node-rf3
  input:
    consistency: ONE
  expect:
  - result.ok && calls['read-command-verb-handler.do-verb'] == 1 && calls['storage-proxy-local-read-runnable.run'] == 0
- id: read-bootstrapping-refused
  flow: coordinator-read
  name: A bootstrapping coordinator refuses reads
  fixtures:
  - three-node-rf3
  state:
    storage-service:
      is_bootstrap_mode: true
  expect:
  - '!result.ok && result.error.code == ''is-bootstrapping'' && result.error.status == 4098'
  - calls['replica-plans.for-read'] == 0
- id: read-quorum-two-down-unavailable
  flow: coordinator-read
  name: 'QUORUM read with two replicas down: Unavailable'
  fixtures:
  - three-node-rf3
  state:
    gossiper@n1:
      endpoint_state_map:
        n2:
          alive: false
        n3:
          alive: false
  expect:
  - '!result.ok && result.error.code == ''unavailable'' && result.error.data.alive == 1'
  - calls['read-command-verb-handler.do-verb'] == 0
- id: read-digest-mismatch-read-repair
  flow: coordinator-read
  name: 'Digest mismatch: full data reads, newest wins, a READ_REPAIR_REQ goes to the stale replica'
  fixtures:
  - three-node-rf3
  choices:
    digest-resolver.responses-match.digests: mismatch
    row-iterator-merge-listener.close.divergence: stale_replicas
  expect:
