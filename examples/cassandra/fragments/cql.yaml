# Area fragment: cql (cql3/** except cql3/statements/schema/** and the role,
# permission and auth statements owned by schema-auth).
#
# The CQL layer turns a native-protocol QUERY, PREPARE, EXECUTE or BATCH into
# StorageProxy calls. Statements are modelled as structured CqlStatement
# objects: the simulator cannot run the ANTLR grammar, so the caller supplies
# the parsed structure next to the query text and the parser only decides
# whether the text is syntactically acceptable. See notes/cql.md.
schema_version: 1
id: cassandra

components:
  # --- QueryProcessor and the prepared statement cache -----------------------
  - id: query-processor
    name: QueryProcessor
    kind: module
    layer: query
    parent: cql
    summary: The default QueryHandler. Parses, prepares and executes statements and owns the prepared statement cache.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:82-130
    attributes: {owner: cql}
    state:
      initial:
        new_prepared_statement_behaviour: false
        last_minute_evictions_count: 0
        persisted_prepared_statements: 0
  - id: query-processor-prepared-statements
    name: QueryProcessor.preparedStatements (Caffeine cache)
    kind: cache
    layer: query
    parent: query-processor
    summary: In-memory prepared statement cache keyed by MD5(keyspace + query), bounded by weight. Evictions are persisted removals from system.prepared_statements.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:111-118
    attributes: {owner: cql}
    state:
      initial:
        entries: {}
  - id: query-processor-statement-invalidating-listener
    name: QueryProcessor.StatementInvalidatingListener
    kind: module
    layer: query
    parent: query-processor
    summary: Schema listener that drops cached prepared statements when their table, keyspace or functions change.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:975-1134
    attributes: {owner: cql}
  - id: cql-fragment-parser
    name: CQLFragmentParser
    kind: function
    layer: query
    parent: cql
    summary: Runs the ANTLR CqlLexer/CqlParser over a query string and throws the first syntax error.
    sources:
      - src/java/org/apache/cassandra/cql3/CQLFragmentParser.java:63-83
    attributes: {owner: cql}
  - id: statement-restrictions
    name: StatementRestrictions
    kind: module
    layer: query
    parent: cql
    summary: Validates WHERE-clause restrictions at prepare time (partition key completeness, filtering).
    sources:
      - src/java/org/apache/cassandra/cql3/restrictions/StatementRestrictions.java:585-601
    attributes: {owner: cql}

  # --- SELECT ---------------------------------------------------------------
  - id: select-statement
    name: SelectStatement
    kind: module
    layer: query
    parent: cql
    summary: Executes SELECT through StorageProxy.read (partition-restricted) or StorageProxy.getRangeSlice (key range), paging when needed.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:109-120
    attributes: {owner: cql}
  - id: select-statement-raw-statement
    name: SelectStatement.RawStatement
    kind: function
    layer: query
    parent: select-statement
    summary: Prepares a parsed SELECT against the table metadata and refuses filtering without ALLOW FILTERING.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:1182-1275
    attributes: {owner: cql}

  # --- INSERT, UPDATE, DELETE -------------------------------------------------
  - id: modification-statement
    name: ModificationStatement
    kind: module
    layer: query
    parent: cql
    summary: Shared execution of INSERT, UPDATE and DELETE. Builds mutations and sends them to StorageProxy.mutateWithTriggers, or a CAS to StorageProxy.cas when the statement has IF conditions.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:76-159
    attributes: {owner: cql}
  - id: modification-statement-parsed
    name: ModificationStatement.Parsed
    kind: function
    layer: query
    parent: modification-statement
    summary: Prepares INSERT, UPDATE and DELETE (table lookup, conditions, attributes), delegating to the concrete prepareInternal.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:923-1055
    attributes: {owner: cql}
  - id: update-statement
    name: UpdateStatement
    kind: module
    layer: query
    parent: modification-statement
    summary: INSERT and UPDATE. Adds a row (with primary key liveness on INSERT) and its column operations to the partition update.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UpdateStatement.java:48-111
    attributes: {owner: cql}
  - id: update-statement-parsed-insert
    name: UpdateStatement.ParsedInsert
    kind: function
    layer: query
    parent: update-statement
    summary: Prepares INSERT ... VALUES. Refuses counter tables and empty column lists.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UpdateStatement.java:113-201
    attributes: {owner: cql}
  - id: update-statement-parsed-update
    name: UpdateStatement.ParsedUpdate
    kind: function
    layer: query
    parent: update-statement
    summary: Prepares UPDATE ... SET. Refuses primary key columns in SET.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UpdateStatement.java:272-336
    attributes: {owner: cql}
  - id: delete-statement
    name: DeleteStatement
    kind: module
    layer: query
    parent: modification-statement
    summary: DELETE. Chooses partition deletion, row deletion, range tombstone or column deletion.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DeleteStatement.java:46-124
    attributes: {owner: cql}
  - id: delete-statement-parsed
    name: DeleteStatement.Parsed
    kind: function
    layer: query
    parent: delete-statement
    summary: Prepares DELETE, including the rule that conditional deletes restrict the whole primary key.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DeleteStatement.java:126-195
    attributes: {owner: cql}
  - id: cql3-cas-request
    name: CQL3CasRequest
    kind: module
    layer: query
    parent: modification-statement
    summary: The CASRequest the CQL layer hands to Paxos. Holds the IF conditions and the updates, and decides whether the conditions apply to the current partition.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/CQL3CasRequest.java:49-91
    attributes: {owner: cql}

  # --- BATCH ----------------------------------------------------------------
  - id: batch-statement
    name: BatchStatement
    kind: module
    layer: query
    parent: cql
    summary: LOGGED, UNLOGGED and COUNTER batches. Enforces batch-size thresholds and sends one mutateWithTriggers call, atomic only for multi-partition logged batches, or one CAS for conditional batches.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:61-136
    attributes: {owner: cql}
  - id: batch-statement-parsed
    name: BatchStatement.Parsed
    kind: function
    layer: query
    parent: batch-statement
    summary: Prepares BEGIN ... APPLY BATCH sent as a QUERY string.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:611-662
    attributes: {owner: cql}

  # --- USE, TRUNCATE, DESCRIBE -------------------------------------------------
  - id: use-statement
    name: UseStatement
    kind: module
    layer: query
    parent: cql
    summary: USE <keyspace>. Sets the connection's keyspace.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UseStatement.java:37-93
    attributes: {owner: cql}
  - id: truncate-statement
    name: TruncateStatement
    kind: module
    layer: query
    parent: cql
    summary: TRUNCATE <table>. Delegates to StorageProxy.truncateBlocking and maps unavailability and timeouts to TruncateException.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:42-131
    attributes: {owner: cql}
  - id: describe-statement
    name: DescribeStatement
    kind: module
    layer: query
    parent: cql
    summary: Server-side DESCRIBE. Always local, reads the distributed schema and pages by row offset tied to the schema version.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:66-181
    attributes: {owner: cql}
  - id: describe-statement-listing
    name: DescribeStatement.Listing
    kind: function
    layer: query
    parent: describe-statement
    summary: DESCRIBE TABLES, TYPES, FUNCTIONS and AGGREGATES.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:256-288
    attributes: {owner: cql}
  - id: describe-statement-keyspaces
    name: DescribeStatement.keyspaces (anonymous)
    kind: function
    layer: query
    parent: describe-statement
    summary: DESCRIBE KEYSPACES.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:325-349
    attributes: {owner: cql}
  - id: describe-statement-schema
    name: DescribeStatement.schema (anonymous)
    kind: function
    layer: query
    parent: describe-statement
    summary: DESCRIBE [FULL] SCHEMA.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:354-382
    attributes: {owner: cql}
  - id: describe-statement-element
    name: DescribeStatement.Element
    kind: function
    layer: query
    parent: describe-statement
    summary: DESCRIBE KEYSPACE, TABLE, INDEX, MATERIALIZED VIEW, TYPE, FUNCTION or AGGREGATE.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:387-431
    attributes: {owner: cql}
  - id: describe-statement-generic
    name: DescribeStatement.generic (anonymous)
    kind: function
    layer: query
    parent: describe-statement
    summary: DESCRIBE <name>. Resolves the name as keyspace, table, index or view, in that order.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:626-684
    attributes: {owner: cql}
  - id: describe-statement-cluster
    name: DescribeStatement.cluster (anonymous)
    kind: function
    layer: query
    parent: describe-statement
    summary: DESCRIBE CLUSTER. Cluster name, partitioner, snitch and, for a non-system current keyspace, range ownership.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:689-786
    attributes: {owner: cql}

  # --- Identity statements ---------------------------------------------------
  - id: authentication-statement
    name: AuthenticationStatement
    kind: module
    layer: query
    parent: cql
    summary: Base of the role and identity statements. Executes against the ClientState and rewrites permission failures into a friendlier message.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/AuthenticationStatement.java:32-74
    attributes: {owner: cql}
  - id: add-identity-statement
    name: AddIdentityStatement
    kind: function
    layer: query
    parent: authentication-statement
    summary: ADD IDENTITY '<identity>' TO ROLE '<role>' (mTLS identity-to-role binding).
    sources:
      - src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:39-90
    attributes: {owner: cql}
  - id: drop-identity-statement
    name: DropIdentityStatement
    kind: function
    layer: query
    parent: authentication-statement
    summary: DROP IDENTITY '<identity>'.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:38-102
    attributes: {owner: cql}

  # --- Boundary stub components (owned elsewhere) ------------------------------
  - {id: storage-proxy, name: StorageProxy, kind: module, layer: coordination, parent: coordination, sources: [src/java/org/apache/cassandra/service/StorageProxy.java], attributes: {boundary: true, owner: coordination}}
  - {id: consistency-level, name: ConsistencyLevel, kind: module, layer: coordination, parent: coordination, sources: [src/java/org/apache/cassandra/db/ConsistencyLevel.java], attributes: {boundary: true, owner: coordination}}
  - {id: schema, name: Schema, kind: module, layer: metadata, parent: schema-auth, sources: [src/java/org/apache/cassandra/schema/Schema.java], attributes: {boundary: true, owner: schema-auth}}
  - {id: cassandra-role-manager, name: CassandraRoleManager, kind: module, layer: security, parent: schema-auth, sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java], attributes: {boundary: true, owner: schema-auth}}
  - {id: roles, name: Roles, kind: module, layer: security, parent: schema-auth, sources: [src/java/org/apache/cassandra/auth/Roles.java], attributes: {boundary: true, owner: schema-auth}}
  - {id: client-state, name: ClientState, kind: module, layer: protocol, parent: transport, sources: [src/java/org/apache/cassandra/service/ClientState.java], attributes: {boundary: true, owner: transport}}
  - {id: storage-service, name: StorageService, kind: module, layer: cluster, parent: membership, sources: [src/java/org/apache/cassandra/service/StorageService.java], attributes: {boundary: true, owner: membership}}
  - {id: gossiper, name: Gossiper, kind: module, layer: cluster, parent: membership, sources: [src/java/org/apache/cassandra/gms/Gossiper.java], attributes: {boundary: true, owner: membership}}
  - {id: read-command, name: ReadCommand, kind: function, layer: storage, parent: read-path, sources: [src/java/org/apache/cassandra/db/ReadCommand.java], attributes: {boundary: true, owner: read-path}}
  - {id: mutation, name: Mutation, kind: module, layer: storage, parent: write-path, sources: [src/java/org/apache/cassandra/db/Mutation.java], attributes: {boundary: true, owner: write-path}}
  - {id: authorization-statement, name: AuthorizationStatement, kind: module, layer: query, parent: schema-auth, sources: ['src/java/org/apache/cassandra/cql3/statements/AuthorizationStatement.java:34-65'], attributes: {boundary: true, owner: schema-auth}}
  - {id: alter-schema-statement, name: AlterSchemaStatement, kind: module, layer: query, parent: schema-auth, sources: ['src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:43-137'], attributes: {boundary: true, owner: schema-auth}}
  - {id: create-role-statement, name: CreateRoleStatement, kind: function, layer: query, parent: schema-auth, sources: ['src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:32-130'], attributes: {boundary: true, owner: schema-auth}}
  - {id: alter-role-statement, name: AlterRoleStatement, kind: function, layer: query, parent: schema-auth, sources: ['src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:34-136'], attributes: {boundary: true, owner: schema-auth}}
  - {id: drop-role-statement, name: DropRoleStatement, kind: function, layer: query, parent: schema-auth, sources: ['src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:31-80'], attributes: {boundary: true, owner: schema-auth}}
  - {id: role-management-statement, name: RoleManagementStatement, kind: module, layer: query, parent: schema-auth, sources: ['src/java/org/apache/cassandra/cql3/statements/RoleManagementStatement.java:31-56'], attributes: {boundary: true, owner: schema-auth}}
  - {id: grant-role-statement, name: GrantRoleStatement, kind: function, layer: query, parent: role-management-statement, sources: ['src/java/org/apache/cassandra/cql3/statements/GrantRoleStatement.java:31-55'], attributes: {boundary: true, owner: schema-auth}}
  - {id: revoke-role-statement, name: RevokeRoleStatement, kind: function, layer: query, parent: role-management-statement, sources: ['src/java/org/apache/cassandra/cql3/statements/RevokeRoleStatement.java:31-55'], attributes: {boundary: true, owner: schema-auth}}
  - {id: permissions-management-statement, name: PermissionsManagementStatement, kind: module, layer: query, parent: authorization-statement, sources: ['src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:32-72'], attributes: {boundary: true, owner: schema-auth}}
  - {id: grant-permissions-statement, name: GrantPermissionsStatement, kind: function, layer: query, parent: permissions-management-statement, sources: ['src/java/org/apache/cassandra/cql3/statements/GrantPermissionsStatement.java:40-95'], attributes: {boundary: true, owner: schema-auth}}
  - {id: revoke-permissions-statement, name: RevokePermissionsStatement, kind: function, layer: query, parent: permissions-management-statement, sources: ['src/java/org/apache/cassandra/cql3/statements/RevokePermissionsStatement.java:38-81'], attributes: {boundary: true, owner: schema-auth}}
  - {id: list-roles-statement, name: ListRolesStatement, kind: function, layer: query, parent: authorization-statement, sources: ['src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:42-147'], attributes: {boundary: true, owner: schema-auth}}
  - {id: list-permissions-statement, name: ListPermissionsStatement, kind: function, layer: query, parent: authorization-statement, sources: ['src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:37-148'], attributes: {boundary: true, owner: schema-auth}}

configs:
  - {id: prepared-statements-cache-size-mib, type: integer, value: 10, default: 10, summary: "prepared_statements_cache_size is empty (auto) in cassandra.yaml and null in Config.java; DatabaseDescriptor resolves it to max(heap/256, 10) MiB. The model uses the 10 MiB floor because the heap depends on the host.", attributes: {key: prepared_statements_cache_size}, sources: ["conf/cassandra.yaml:508", "src/java/org/apache/cassandra/config/Config.java:585", "src/java/org/apache/cassandra/config/DatabaseDescriptor.java:795-798"]}
  - {id: enable-nodelocal-queries, type: boolean, value: false, default: false, summary: "System property cassandra.enable_nodelocal_queries; not set by the deployed JVM options, so getBoolean() is false.", attributes: {key: cassandra.enable_nodelocal_queries}, sources: ["src/java/org/apache/cassandra/config/CassandraRelevantProperties.java:219"]}
  - {id: force-new-prepared-statement-behaviour, type: boolean, value: false, default: false, summary: "Not in cassandra.yaml; Config.java default false.", attributes: {key: force_new_prepared_statement_behaviour}, sources: ["src/java/org/apache/cassandra/config/Config.java:119"]}
  - {id: allow-filtering-enabled, type: boolean, value: true, default: true, summary: "Guardrail; commented out in cassandra.yaml.", attributes: {key: allow_filtering_enabled}, sources: ["conf/cassandra.yaml:2173", "src/java/org/apache/cassandra/config/Config.java:906"]}
  - {id: read-consistency-levels-disallowed, type: array, value: [], default: [], summary: "Guardrail; commented out in cassandra.yaml.", attributes: {key: read_consistency_levels_disallowed}, sources: ["conf/cassandra.yaml:2109", "src/java/org/apache/cassandra/config/Config.java:883"]}
  - {id: write-consistency-levels-disallowed, type: array, value: [], default: [], summary: "Guardrail; commented out in cassandra.yaml.", attributes: {key: write_consistency_levels_disallowed}, sources: ["conf/cassandra.yaml:2113", "src/java/org/apache/cassandra/config/Config.java:885"]}
  - {id: user-timestamps-enabled, type: boolean, value: true, default: true, summary: "Guardrail; commented out in cassandra.yaml.", attributes: {key: user_timestamps_enabled}, sources: ["conf/cassandra.yaml:2069", "src/java/org/apache/cassandra/config/Config.java:886"]}
  - {id: drop-truncate-table-enabled, type: boolean, value: true, default: true, summary: "Guardrail; commented out in cassandra.yaml.", attributes: {key: drop_truncate_table_enabled}, sources: ["conf/cassandra.yaml:2082", "src/java/org/apache/cassandra/config/Config.java:889"]}
  - {id: use-statements-enabled, type: boolean, value: true, default: true, summary: "Commented out in cassandra.yaml.", attributes: {key: use_statements_enabled}, sources: ["conf/cassandra.yaml:2003", "src/java/org/apache/cassandra/config/Config.java:611"]}
  - {id: batch-size-warn-threshold-kib, type: integer, value: 5, default: 5, summary: "Multi-partition batches above this get a client warning.", attributes: {key: batch_size_warn_threshold}, sources: ["conf/cassandra.yaml:1840", "src/java/org/apache/cassandra/config/Config.java:330"]}
  - {id: batch-size-fail-threshold-kib, type: integer, value: 50, default: 50, summary: "Multi-partition batches above this are refused (Batch too large).", attributes: {key: batch_size_fail_threshold}, sources: ["conf/cassandra.yaml:1844", "src/java/org/apache/cassandra/config/Config.java:332"]}
  - {id: unlogged-batch-across-partitions-warn-threshold, type: integer, value: 10, default: 10, summary: "UNLOGGED batches over more partitions get a client warning.", attributes: {key: unlogged_batch_across_partitions_warn_threshold}, sources: ["conf/cassandra.yaml:1847", "src/java/org/apache/cassandra/config/Config.java:334"]}
  - {id: cluster-name, type: string, value: Test Cluster, default: Test Cluster, summary: "Reference to membership's config; DESCRIBE CLUSTER shows it.", attributes: {boundary: true, owner: membership}, sources: ["conf/cassandra.yaml:26", "src/java/org/apache/cassandra/config/Config.java:81"]}
  - {id: partitioner, type: string, value: org.apache.cassandra.dht.Murmur3Partitioner, summary: "Reference to membership's config; DESCRIBE CLUSTER shows it without the org.apache.cassandra.dht. prefix.", attributes: {boundary: true, owner: membership}, sources: ["conf/cassandra.yaml:389", "src/java/org/apache/cassandra/config/Config.java:109"]}
  - {id: endpoint-snitch, type: string, value: SimpleSnitch, default: "", summary: "Set in cassandra.yaml; Config.java has no default (null).", attributes: {key: endpoint_snitch}, sources: ["conf/cassandra.yaml:1556", "src/java/org/apache/cassandra/config/Config.java:423"]}

schemas:
  - id: CqlPartitionKey
    summary: One partition key value of a statement and its Murmur3 token (computed by the partitioner, supplied here).
    schema:
      type: object
      required: [partition_key, token]
      properties:
        partition_key: {type: string, examples: ["user:42"]}
        token: {type: integer, examples: [-4069959284402364209]}
  - id: CqlStatement
    summary: >-
      A parsed CQL statement as the prepared CQLStatement object holds it (type, table and the
      table flags captured from TableMetadata at prepare time, WHERE partition keys, columns,
      IF conditions and USING attributes). 0 means "not set" for using_timestamp, using_ttl and limit.
    schema:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [SELECT, INSERT, UPDATE, DELETE, BATCH, USE, TRUNCATE, DESCRIBE, ADD_IDENTITY, DROP_IDENTITY, CREATE_KEYSPACE, ALTER_KEYSPACE, DROP_KEYSPACE, CREATE_TABLE, DROP_TABLE, ALTER_TABLE_ALTER_COLUMN, ALTER_TABLE_MASK_COLUMN, ALTER_TABLE_ADD_COLUMNS, ALTER_TABLE_DROP_COLUMNS, ALTER_TABLE_RENAME_COLUMNS, ALTER_TABLE_ALTER_OPTIONS, ALTER_TABLE_DROP_COMPACT_STORAGE, CREATE_TYPE, ALTER_TYPE_ADD_FIELD, ALTER_TYPE_RENAME_FIELDS, ALTER_TYPE_ALTER_FIELD, DROP_TYPE, CREATE_INDEX, DROP_INDEX, CREATE_VIEW, ALTER_VIEW, DROP_VIEW, CREATE_FUNCTION, DROP_FUNCTION, CREATE_AGGREGATE, DROP_AGGREGATE, CREATE_TRIGGER, DROP_TRIGGER, CREATE_ROLE, ALTER_ROLE, DROP_ROLE, GRANT_ROLE, REVOKE_ROLE, GRANT_PERMISSIONS, REVOKE_PERMISSIONS, LIST_ROLES, LIST_USERS, LIST_PERMISSIONS], default: SELECT}
        name: {type: string, default: "", description: "DDL: the type, index, view, function, aggregate or trigger name (schema-auth's SchemaAuthDdlRequest)."}
        partition_key: {type: array, items: {type: string}, default: [], description: "DDL: CREATE TABLE partition key columns."}
        replication: {type: object, default: {}, description: "DDL: keyspace replication."}
        or_replace: {type: boolean, default: false}
        role_statement: {type: object, default: {}, description: "For role, permission and LIST statements, schema-auth's SchemaAuthRoleStatement (role, grantee, permissions, resource, options, ...)."}
        keyspace: {type: string, default: shop}
        table: {type: string, default: users}
        fully_qualified: {type: boolean, default: true}
        table_kind: {type: string, enum: [regular, counter, view, virtual], default: regular}
        table_has_clustering: {type: boolean, default: false}
        has_views: {type: boolean, default: false}
        partition_keys:
          type: array
          items: {$ref: CqlPartitionKey}
          default: [{partition_key: "user:42", token: -4069959284402364209}]
        clustering: {type: string, default: ""}
        columns: {default: {}, description: "DML: a map from column name to value (SELECT: the selected names). DDL: a list of 'name type' definitions, as schema-auth's SchemaAuthDdlRequest has it."}
        conditions: {type: object, default: {}}
        if_not_exists: {type: boolean, default: false}
        if_exists: {type: boolean, default: false}
        using_timestamp: {type: integer, default: 0}
        using_ttl: {type: integer, default: 0}
        requires_read: {type: boolean, default: false}
        allow_filtering: {type: boolean, default: false}
        needs_filtering: {type: boolean, default: false}
        limit: {type: integer, default: 0}
        bind_markers: {type: integer, default: 0}
        size_bytes: {type: integer, default: 120}
        prepared_size_bytes: {type: integer, default: 3072}
        batch_type: {type: string, enum: [LOGGED, UNLOGGED, COUNTER], default: LOGGED}
        statements: {type: array, items: {type: object}, default: []}
        describe_target: {type: string, enum: [KEYSPACES, TABLES, TYPES, FUNCTIONS, AGGREGATES, SCHEMA, KEYSPACE, TABLE, INDEX, VIEW, TYPE, FUNCTION, AGGREGATE, CLUSTER, GENERIC], default: KEYSPACES}
        describe_name: {type: string, default: ""}
        describe_full: {type: boolean, default: false}
        identity: {type: string, default: "spiffe://shop.example/app"}
        role: {type: string, default: app_role}
  - id: CqlQueryOptions
    summary: QueryOptions from the native protocol (consistency, serial consistency, bound values, paging, client timestamp, keyspace).
    schema:
      type: object
      properties:
        consistency: {type: string, enum: [ANY, ONE, TWO, THREE, QUORUM, ALL, LOCAL_QUORUM, EACH_QUORUM, SERIAL, LOCAL_SERIAL, LOCAL_ONE, NODE_LOCAL], default: ONE}
        serial_consistency: {type: string, enum: [SERIAL, LOCAL_SERIAL], default: SERIAL}
        values: {type: array, items: {type: string}, default: []}
        page_size: {type: integer, default: 5000}
        timestamp: {type: integer, default: 0}
        keyspace: {type: string, default: ""}
        paging_state: {type: object, default: {}}
  - id: CqlClientState
    summary: The parts of the connection's ClientState the CQL layer reads. Under AllowAllAuthenticator the user is ANONYMOUS_USER.
    schema:
      type: object
      properties:
        keyspace: {type: string, default: shop}
        user: {type: string, default: anonymous}
        is_anonymous: {type: boolean, default: true}
        is_super: {type: boolean, default: false}
  - id: CqlRequest
    summary: A statement with its options and client state, as QueryHandler.process/processPrepared/processBatch and CQLStatement.execute receive them.
    schema:
      type: object
      required: [statement]
      properties:
        statement: {$ref: CqlStatement}
        options: {$ref: CqlQueryOptions}
        client_state: {$ref: CqlClientState}
  - id: CqlParseRequest
    summary: A query string with the structure the grammar would produce for it.
    schema:
      type: object
      required: [query, statement]
      properties:
        query: {type: string, examples: ["SELECT name, email FROM shop.users WHERE id = 'user:42'"]}
        statement: {$ref: CqlStatement}
        options: {$ref: CqlQueryOptions}
        client_state: {$ref: CqlClientState}
  - id: CqlPrepared
    summary: QueryHandler.Prepared, a cached prepared statement.
    schema:
      type: object
      properties:
        statement_id: {type: string}
        query: {type: string}
        keyspace: {type: string}
        fully_qualified: {type: boolean}
        statement: {$ref: CqlStatement}
        size_bytes: {type: integer}
  - id: CqlResultMessage
    summary: A ResultMessage (VOID, ROWS, SET_KEYSPACE or PREPARED) plus the client warnings ClientWarn attaches.
    schema:
      type: object
      properties:
        kind: {type: string, enum: [VOID, ROWS, SET_KEYSPACE, PREPARED, SCHEMA_CHANGE], default: VOID}
        change: {type: string}
        target: {type: string}
        name: {type: string}
        paging_state: {type: object, description: "DESCRIBE paging state (schema_version, offset) when has_more_pages"}
        rows: {type: array, items: {type: object}, default: []}
        applied: {type: boolean, default: true}
        has_more_pages: {type: boolean, default: false}
        keyspace: {type: string, default: ""}
        statement_id: {type: string, default: ""}
        warnings: {type: array, items: {type: string}, default: []}
  - id: CqlMutation
    summary: A mutation as the CQL layer builds it (the write-path WritePathMutation shape plus the fields this layer sets).
    schema:
      type: object
      properties:
        keyspace: {type: string}
        table: {type: string}
        partition_key: {type: string}
        token: {type: integer}
        timestamp: {type: integer}
        columns: {type: object}
        ttl: {type: integer}
        deletion: {type: string, enum: [none, partition, row, range, columns]}
        partition_deletion: {type: boolean, description: "write-path contract: a partition-level DeletionTime at the mutation timestamp (DELETE of a whole partition; also a full-row DELETE, since the model has no clustering rows)"}
        cells: {type: array, items: {type: object, properties: {column: {type: string}, value: {}, timestamp: {type: integer}, deleted: {type: boolean}}}, description: cell tombstones for DELETE of named columns}
        counter: {type: boolean}
        primary_key_liveness: {type: boolean}
        updates: {type: array, items: {type: object}, description: "write-path contract (WritePathMutation.updates): when non-empty, every PartitionUpdate of this keyspace and partition key, one per table; the top-level table, columns and cells mirror the first. A batch on two tables with the same key yields one Mutation holding both (BatchUpdatesCollector.java:193-231)."}
  - id: CqlDescribeRequest
    schema:
      type: object
      properties:
        statement: {$ref: CqlStatement}
        client_state: {$ref: CqlClientState}
        keyspaces: {type: array, items: {type: object}}

interfaces:
  # =========================================================================
  # QueryProcessor
  # =========================================================================
  - component: query-processor
    name: parse
    kind: function
    summary: QueryHandler.parse. Parses the query against the client state with the options' keyspace applied.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:345-348
    request: CqlParseRequest
    response: CqlStatement
    errors: &parseErrors
      - {code: syntax-error, status: 8192}
      - {code: invalid, status: 8704}
    behavior:
      - title: Apply the protocol-level keyspace to a copy of the client state
        detail: ClientState.cloneWithKeyspaceIfSet(options.getKeyspace()); a keyspace in QUERY options (protocol v5) overrides USE.
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:347
        set:
          vars.cs:
            keyspace: "= input.options.keyspace != '' ? input.options.keyspace : input.client_state.keyspace"
            user: "= input.client_state.user"
            is_anonymous: "= input.client_state.is_anonymous"
            is_super: "= input.client_state.is_super"
      - call: query-processor.get-statement
        input: {query: "= input.query", statement: "= input.statement", client_state: "= vars.cs"}
        as: stmt
      - return: "= vars.stmt.value"

  - component: query-processor
    name: get-statement
    kind: function
    summary: Parses the string, sets the keyspace on qualified statements and prepares the raw statement.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:893-905
    request: CqlParseRequest
    response: CqlStatement
    errors: *parseErrors
    behavior:
      - call: query-processor.parse-statement
        input: {query: "= input.query"}
      - set:
          vars.qualified: "= input.statement.type in ['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'BATCH', 'TRUNCATE']"
      - if: "vars.qualified && !input.statement.fully_qualified && input.client_state.keyspace == ''"
        then:
          - title: No keyspace for an unqualified table
            detail: QualifiedStatement.setKeyspace calls ClientState.getKeyspace, which refuses when no keyspace was set by USE or the protocol.
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:900-901
            fail: {code: invalid, status: 8704, message: "No keyspace has been specified. USE a keyspace, or explicitly specify keyspace.tablename"}
      - title: QualifiedStatement.setKeyspace, take the session keyspace for unqualified tables
        detail: The keyspace comes from ClientState.getKeyspace() only when the statement names none (QualifiedStatement.java:44-53); each statement of a batch is qualified separately.
        source: src/java/org/apache/cassandra/cql3/statements/QualifiedStatement.java:44-53
        set:
          vars.stmt: "= vars.qualified && !input.statement.fully_qualified ? merge(input.statement, {'keyspace': (input.statement.keyspace == '' || input.statement.type == 'BATCH') ? input.client_state.keyspace : input.statement.keyspace, 'statements': has(input.statement.statements) ? input.statement.statements.map(b, (!has(b.keyspace) || b.keyspace == '' || (has(b.fully_qualified) && !b.fully_qualified)) ? merge(b, {'keyspace': input.client_state.keyspace}) : b) : []}) : input.statement"
      - title: Prepare the raw statement
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:902-904
        when: "input.statement.type == 'SELECT'"
        call: select-statement-raw-statement.prepare
        input: {statement: "= vars.stmt", client_state: "= input.client_state"}
      - when: "input.statement.type in ['INSERT', 'UPDATE', 'DELETE']"
        call: modification-statement-parsed.prepare
        input: {statement: "= vars.stmt", client_state: "= input.client_state"}
      - when: "input.statement.type == 'BATCH'"
        call: batch-statement-parsed.prepare
        input: {statement: "= vars.stmt", client_state: "= input.client_state"}
      - when: "!(input.statement.type in ['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'BATCH'])"
        title: Raw statement is its own prepared form
        detail: UseStatement, TruncateStatement, DescribeStatement and AuthenticationStatement return this from prepare; their checks run at validate and execute time. DDL and role statements are prepared by schema-auth's classes, whose checks also run at validate and execute time.
        source: src/java/org/apache/cassandra/cql3/statements/UseStatement.java:46-49
      - return: "= vars.stmt"

  - component: query-processor
    name: parse-statement
    kind: function
    summary: QueryProcessor.parseStatement. Parses with CqlParser::query; syntax errors surface as SyntaxException.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:923-945
    request: {type: object, required: [query], properties: {query: {type: string}}}
    errors:
      - {code: syntax-error, status: 8192}
    behavior:
      - title: Run the ANTLR parser
        detail: A CassandraException (the SyntaxException from the error collector) is rethrown as is; other failures become SyntaxException too.
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:925-944
        call: cql-fragment-parser.parse-any-unhandled
        input: {query: "= input.query"}
      - return: {parsed: true}

  - component: cql-fragment-parser
    name: parse-any-unhandled
    kind: function
    summary: Lexes and parses the string and throws the first syntax error collected by ErrorCollector.
    description: >-
      The model only checks that the text starts with a statement keyword the grammar knows; it
      cannot run the real grammar.
    sources:
      - src/java/org/apache/cassandra/cql3/CQLFragmentParser.java:63-83
    request: {type: object, required: [query], properties: {query: {type: string}}}
    errors:
      - {code: syntax-error, status: 8192}
    behavior:
      - if: '!input.query.matches("(?i)^\\s*(SELECT|INSERT|UPDATE|DELETE|BEGIN|USE|TRUNCATE|DESCRIBE|DESC|ADD|DROP|CREATE|ALTER|GRANT|REVOKE|LIST)\\b")'
        then:
          - title: Syntax error
            detail: errorCollector.throwFirstSyntaxError() throws SyntaxException for the first lexer or parser error.
            source: src/java/org/apache/cassandra/cql3/CQLFragmentParser.java:80
            fail: {code: syntax-error, status: 8192, message: "= 'line 1:0 no viable alternative at input \\'' + input.query.split(' ')[0] + '\\''"}
      - return: {parsed: true}

  - component: query-processor
    name: process
    kind: function
    summary: QueryHandler.process for an unprepared QUERY. Checks the bound value count, then processStatement.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:359-370
    request: CqlRequest
    response: CqlResultMessage
    errors: &execErrors
      - {code: invalid, status: 8704}
      - {code: unauthorized, status: 8448}
      - {code: unavailable, status: 4096}
      - {code: write-timeout, status: 4352}
      - {code: read-timeout, status: 4608}
      - {code: read-failure, status: 4864}
      - {code: write-failure, status: 5376}
      - {code: cas-write-unknown, status: 5888}
      - {code: is-bootstrapping, status: 4098}
      - {code: truncate-error, status: 4099}
      - {code: overloaded, status: 4097}
      - {code: server-error, status: 0}
      - {code: already-exists, status: 9216}
      - {code: config-error, status: 8960}
    behavior:
      - if: "size(input.options.values) != input.statement.bind_markers"
        then:
          - title: Wrong number of bound values
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:363-364
            fail: {code: invalid, status: 8704, message: Invalid amount of bind variables}
      - call: query-processor.process-statement
        input: "= input"
        as: res
      - return: "= vars.res.value"

  - component: query-processor
    name: process-prepared
    kind: function
    summary: QueryHandler.processPrepared for EXECUTE. Checks markers against values, then processStatement.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:851-871
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - if: "!(size(input.options.values) == 0 && input.statement.bind_markers == 0) && size(input.options.values) != input.statement.bind_markers"
        then:
          - title: Markers and values disagree
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:858-862
            fail: {code: invalid, status: 8704, message: "= 'there were ' + string(input.statement.bind_markers) + ' markers(?) in CQL but ' + string(size(input.options.values)) + ' bound variables'"}
      - call: query-processor.process-statement
        input: "= input"
        as: res
      - return: "= vars.res.value"

  - component: query-processor
    name: process-statement
    kind: function
    summary: Authorize, validate, then execute (or execute locally for NODE_LOCAL). A null result becomes Void.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:266-279
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - set:
          vars.kind: "= input.statement.type in ['CREATE_KEYSPACE', 'ALTER_KEYSPACE', 'DROP_KEYSPACE', 'CREATE_TABLE', 'DROP_TABLE', 'ALTER_TABLE_ALTER_COLUMN', 'ALTER_TABLE_MASK_COLUMN', 'ALTER_TABLE_ADD_COLUMNS', 'ALTER_TABLE_DROP_COLUMNS', 'ALTER_TABLE_RENAME_COLUMNS', 'ALTER_TABLE_ALTER_OPTIONS', 'ALTER_TABLE_DROP_COMPACT_STORAGE', 'CREATE_TYPE', 'ALTER_TYPE_ADD_FIELD', 'ALTER_TYPE_RENAME_FIELDS', 'ALTER_TYPE_ALTER_FIELD', 'DROP_TYPE', 'CREATE_INDEX', 'DROP_INDEX', 'CREATE_VIEW', 'ALTER_VIEW', 'DROP_VIEW', 'CREATE_FUNCTION', 'DROP_FUNCTION', 'CREATE_AGGREGATE', 'DROP_AGGREGATE', 'CREATE_TRIGGER', 'DROP_TRIGGER'] ? 'ddl' : (input.statement.type in ['CREATE_ROLE', 'ALTER_ROLE', 'DROP_ROLE', 'GRANT_ROLE', 'REVOKE_ROLE', 'GRANT_PERMISSIONS', 'REVOKE_PERMISSIONS', 'LIST_ROLES', 'LIST_USERS', 'LIST_PERMISSIONS'] ? 'role' : 'cql')"
          vars.comp: "= {'SELECT': 'select-statement', 'INSERT': 'modification-statement', 'UPDATE': 'modification-statement', 'DELETE': 'modification-statement', 'BATCH': 'batch-statement', 'USE': 'use-statement', 'TRUNCATE': 'truncate-statement', 'DESCRIBE': 'describe-statement', 'ADD_IDENTITY': 'add-identity-statement', 'DROP_IDENTITY': 'drop-identity-statement'}"
          vars.roleAuth: "= {'CREATE_ROLE': 'create-role-statement.authorize', 'ALTER_ROLE': 'alter-role-statement.authorize', 'DROP_ROLE': 'drop-role-statement.authorize', 'GRANT_ROLE': 'role-management-statement.authorize', 'REVOKE_ROLE': 'role-management-statement.authorize', 'GRANT_PERMISSIONS': 'permissions-management-statement.authorize', 'REVOKE_PERMISSIONS': 'permissions-management-statement.authorize', 'LIST_ROLES': '', 'LIST_USERS': '', 'LIST_PERMISSIONS': ''}"
          vars.roleVal: "= {'CREATE_ROLE': 'create-role-statement.validate', 'ALTER_ROLE': 'alter-role-statement.validate', 'DROP_ROLE': 'drop-role-statement.validate', 'GRANT_ROLE': 'role-management-statement.validate', 'REVOKE_ROLE': 'role-management-statement.validate', 'GRANT_PERMISSIONS': 'grant-permissions-statement.validate', 'REVOKE_PERMISSIONS': 'permissions-management-statement.validate', 'LIST_ROLES': 'list-roles-statement.validate', 'LIST_USERS': 'list-roles-statement.validate', 'LIST_PERMISSIONS': 'list-permissions-statement.validate'}"
          vars.roleExe: "= {'CREATE_ROLE': 'create-role-statement.execute', 'ALTER_ROLE': 'alter-role-statement.execute', 'DROP_ROLE': 'drop-role-statement.execute', 'GRANT_ROLE': 'grant-role-statement.execute', 'REVOKE_ROLE': 'revoke-role-statement.execute', 'GRANT_PERMISSIONS': 'grant-permissions-statement.execute', 'REVOKE_PERMISSIONS': 'revoke-permissions-statement.execute', 'LIST_ROLES': 'list-roles-statement.execute', 'LIST_USERS': 'list-roles-statement.execute', 'LIST_PERMISSIONS': 'list-permissions-statement.execute'}"
      - set:
          vars.auth: "= vars.kind == 'cql' ? vars.comp[input.statement.type] + '.authorize' : (vars.kind == 'role' ? vars.roleAuth[input.statement.type] : 'alter-schema-statement.authorize')"
          vars.val: "= vars.kind == 'cql' ? vars.comp[input.statement.type] + '.validate' : (vars.kind == 'role' ? vars.roleVal[input.statement.type] : 'alter-schema-statement.validate')"
          vars.exe: "= vars.kind == 'ddl' ? 'alter-schema-statement.execute' : (vars.kind == 'role' ? vars.roleExe[input.statement.type] : ((input.statement.type in ['ADD_IDENTITY', 'DROP_IDENTITY'] ? 'authentication-statement' : vars.comp[input.statement.type]) + '.execute'))"
          vars.req: "= vars.kind == 'ddl' ? input : (vars.kind == 'role' ? merge(input.statement.role_statement, {'user': input.client_state.user, 'statement': input.statement.type == 'LIST_USERS' ? 'list-users-statement' : ''}) : input)"
      - title: processStatement is generic over CQLStatement
        detail: DML, USE, TRUNCATE, DESCRIBE and identity statements are cql's. DDL statements (AlterSchemaStatement subclasses, statement.type CREATE_TABLE and so on) are schema-auth's and take this same request; role, permission and LIST statements are schema-auth's and take their SchemaAuthRoleStatement shape plus the executing user. ListRolesStatement and ListPermissionsStatement.authorize are not modelled by schema-auth.
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:266-279
        set: {ctx.statementKind: "= vars.kind"}
      - title: statement.authorize(clientState)
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:271
        when: "vars.auth != ''"
        call: "= vars.auth"
        fill: true
        targets: [select-statement.authorize, modification-statement.authorize, batch-statement.authorize, use-statement.authorize, truncate-statement.authorize, describe-statement.authorize, add-identity-statement.authorize, drop-identity-statement.authorize, alter-schema-statement.authorize, create-role-statement.authorize, alter-role-statement.authorize, drop-role-statement.authorize, role-management-statement.authorize, permissions-management-statement.authorize]
        input: "= vars.req"
      - title: statement.validate(clientState)
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:272
        when: "vars.val != ''"
        call: "= vars.val"
        fill: true
        targets: [select-statement.validate, modification-statement.validate, batch-statement.validate, use-statement.validate, truncate-statement.validate, describe-statement.validate, add-identity-statement.validate, drop-identity-statement.validate, alter-schema-statement.validate, create-role-statement.validate, alter-role-statement.validate, drop-role-statement.validate, role-management-statement.validate, grant-permissions-statement.validate, permissions-management-statement.validate, list-roles-statement.validate, list-permissions-statement.validate]
        input: "= vars.req"
      - if: "input.options.consistency == 'NODE_LOCAL'"
        then:
          - title: NODE_LOCAL skips the coordinator
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:274-276
            call: query-processor.process-node-local-statement
            input: "= input"
            as: local
          - return: "= vars.local.value"
      - title: statement.execute(queryState, options, requestTime)
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:276
        call: "= vars.exe"
        fill: true
        targets: [select-statement.execute, modification-statement.execute, batch-statement.execute, use-statement.execute, truncate-statement.execute, describe-statement.execute, authentication-statement.execute, alter-schema-statement.execute, create-role-statement.execute, alter-role-statement.execute, drop-role-statement.execute, grant-role-statement.execute, revoke-role-statement.execute, grant-permissions-statement.execute, revoke-permissions-statement.execute, list-roles-statement.execute, list-permissions-statement.execute]
        input: "= vars.req"
        as: res
      - set: {ctx.statementType: "= input.statement.type"}
      - title: A null result becomes Void
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:278
        return: "= vars.res.value == null ? {'kind': 'VOID', 'rows': [], 'warnings': []} : vars.res.value"

  - component: query-processor
    name: process-node-local-statement
    kind: function
    summary: NODE_LOCAL execution. Refused unless -Dcassandra.enable_nodelocal_queries=true; only writes and SELECT are allowed.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:281-292
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:294-335
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - if: "!config['enable-nodelocal-queries']"
        then:
          - title: NODE_LOCAL disabled
            detail: cassandra.enable_nodelocal_queries is unset in the deployed JVM options, so getBoolean() is false.
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:283-284
            fail: {code: invalid, status: 8704, message: NODE_LOCAL consistency level is highly dangerous and should be used only for debugging purposes}
      - if: "input.statement.type in ['INSERT', 'UPDATE', 'DELETE', 'BATCH']"
        then:
          - title: Apply the write on this node only
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:294-310
            call: "= (input.statement.type == 'BATCH' ? 'batch-statement' : 'modification-statement') + '.execute-locally'"
            targets: [modification-statement.execute-locally, batch-statement.execute-locally]
            input: "= input"
            as: w
          - set: {ctx.nodeLocal: write}
          - return: "= vars.w.value"
      - if: "input.statement.type == 'SELECT'"
        then:
          - call: storage-service.is-bootstrap-mode
            input: {}
            as: boot
          - if: "vars.boot.value.bootstrap_mode && !(input.statement.keyspace in ['system', 'system_schema'])"
            then:
              - title: Local read refused while bootstrapping
                source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:317-322
                fail: {code: is-bootstrapping, status: 4098, message: Cannot read from a bootstrapping node}
          - title: Read this node's data only
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:325-328
            call: select-statement.execute-locally
            input: "= input"
            as: r
          - set: {ctx.nodeLocal: read}
          - return: "= vars.r.value"
      - title: Statement type not allowed at NODE_LOCAL
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:290-291
        fail: {code: invalid, status: 8704, message: "NODE_LOCAL consistency level can only be used with BATCH, UPDATE, INSERT, DELETE, and SELECT statements"}

  - component: query-processor
    name: process-batch
    kind: function
    summary: QueryHandler.processBatch for a native BATCH message. No NODE_LOCAL routing here.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:883-891
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - title: Authorize every statement of the batch
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:887
        call: batch-statement.authorize
        input: "= input"
      - title: Batch-level validation (counters, timestamps, conditions)
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:888
        call: batch-statement.validate-batch
        input: "= input"
      - title: Per-statement validation
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:889
        call: batch-statement.validate
        input: "= input"
      - call: batch-statement.execute
        input: "= input"
        as: res
      - return: "= vars.res.value"

  - component: query-processor
    name: prepare
    kind: function
    summary: QueryHandler.prepare for PREPARE. Returns a cached id when both keyspace variants are cached, else parses, prepares and stores.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:728-784
    request: CqlParseRequest
    response: CqlResultMessage
    errors: *parseErrors
    behavior:
      - set:
          vars.ks: "= input.client_state.keyspace"
          vars.idNoKs: "= 'md5:' + input.query"
          vars.idKs: "= 'md5:' + input.client_state.keyspace + input.query"
      - call: query-processor.use-new-prepared-statement-behaviour
        input: {}
        as: nb
      - title: Look up both cache keys
        detail: MD5(query) and MD5(keyspace + query); only safe to return a cached id when both are present.
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:731-736
        call: query-processor-prepared-statements.get-if-present
        input: {statement_id: "= vars.idNoKs"}
        as: c1
        on_error: continue
      - call: query-processor-prepared-statements.get-if-present
        input: {statement_id: "= vars.idKs"}
        as: c2
        on_error: continue
      - if: "vars.c1.ok && vars.c2.ok"
        then:
          - set: {ctx.prepareCacheHit: true}
          - if: "vars.nb.value == true && vars.c1.value.fully_qualified"
            then:
              - title: Cached, fully qualified
                source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:742-743
                return: {kind: PREPARED, statement_id: "= vars.idNoKs", rows: [], warnings: []}
          - if: "vars.nb.value == true && vars.ks != '' && !vars.c2.value.fully_qualified"
            then:
              - title: Cached, unqualified
                source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:745-746
                return: {kind: PREPARED, statement_id: "= vars.idKs", rows: [], warnings: []}
          - if: "vars.nb.value != true"
            then:
              - title: Cached, legacy pre-4.0.2 id
                source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:749-752
                return: {kind: PREPARED, statement_id: "= vars.idKs", rows: [], warnings: []}
      - set: {ctx.prepareCacheHit: false}
      - title: Parse and prepare
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:754
        call: query-processor.parse-and-prepare
        input: {query: "= input.query", statement: "= input.statement", client_state: "= input.client_state"}
        as: p
      - if: "input.statement.bind_markers > 65535"
        then:
          - title: Too many bind markers
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:757-759
            fail: {code: invalid, status: 8704, message: "= 'Too many markers(?). ' + string(input.statement.bind_markers) + ' markers exceed the allowed maximum of 65535'"}
      - if: "vars.p.value.fully_qualified"
        then:
          - title: Store fully qualified statement without keyspace
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:761-770
            call: query-processor.store-prepared-statement
            input: {query: "= input.query", keyspace: "", prepared: "= vars.p.value"}
            as: a
          - when: "vars.ks != ''"
            call: query-processor.store-prepared-statement
            input: {query: "= input.query", keyspace: "= vars.ks", prepared: "= vars.p.value"}
            as: b
          - if: "vars.nb.value != true && vars.ks != ''"
            then:
              - return: "= vars.b.value"
          - return: "= vars.a.value"
      - title: Unqualified statement, warn and store under both ids
        detail: ClientState.warnAboutUseWithPreparedStatements warns the client once per id about USE with prepared statements.
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:773-782
        set: {ctx.useWithPreparedWarning: true}
      - call: query-processor.store-prepared-statement
        input: {query: "= input.query", keyspace: "= vars.ks", prepared: "= vars.p.value"}
        as: b
      - call: query-processor.store-prepared-statement
        input: {query: "= input.query", keyspace: "", prepared: "= vars.p.value"}
        as: a
      - if: "vars.nb.value != true"
        then:
          - return: "= vars.a.value"
      - return: "= vars.b.value"

  - component: query-processor
    name: use-new-prepared-statement-behaviour
    kind: function
    summary: True once forced or once every node is at least 4.0.2 (CASSANDRA-15252 id scheme).
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:690-726
    response: {type: boolean}
    behavior:
      - if: "state.new_prepared_statement_behaviour || config['force-new-prepared-statement-behaviour']"
        then:
          - return: true
      - title: Ask gossip for the minimum version in the cluster
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:697
        call: gossiper.get-min-version
        input: {timeout_ms: 2000}
        as: v
      - if: "!(vars.v.value.startsWith('3.') || vars.v.value in ['4.0.0', '4.0.1'])"
        then:
          - title: Fully upgraded
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:698-702
            set: {state.new_prepared_statement_behaviour: true}
      - return: "= state.new_prepared_statement_behaviour"

  - component: query-processor
    name: parse-and-prepare
    kind: function
    summary: Parses a query string, sets its keyspace, prepares and validates it, and measures it for the cache.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:441-472
    request: CqlParseRequest
    response: CqlPrepared
    errors: *parseErrors
    behavior:
      - call: query-processor.parse-statement
        input: {query: "= input.query"}
      - set:
          vars.qualified: "= input.statement.type in ['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'BATCH', 'TRUNCATE']"
          vars.comp: "= {'SELECT': 'select-statement', 'INSERT': 'modification-statement', 'UPDATE': 'modification-statement', 'DELETE': 'modification-statement', 'BATCH': 'batch-statement', 'USE': 'use-statement', 'TRUNCATE': 'truncate-statement', 'DESCRIBE': 'describe-statement', 'ADD_IDENTITY': 'add-identity-statement', 'DROP_IDENTITY': 'drop-identity-statement'}[input.statement.type in ['CREATE_KEYSPACE', 'ALTER_KEYSPACE', 'DROP_KEYSPACE', 'CREATE_TABLE', 'DROP_TABLE', 'ALTER_TABLE_ALTER_COLUMN', 'ALTER_TABLE_MASK_COLUMN', 'ALTER_TABLE_ADD_COLUMNS', 'ALTER_TABLE_DROP_COLUMNS', 'ALTER_TABLE_RENAME_COLUMNS', 'ALTER_TABLE_ALTER_OPTIONS', 'ALTER_TABLE_DROP_COMPACT_STORAGE', 'CREATE_TYPE', 'ALTER_TYPE_ADD_FIELD', 'ALTER_TYPE_RENAME_FIELDS', 'ALTER_TYPE_ALTER_FIELD', 'DROP_TYPE', 'CREATE_INDEX', 'DROP_INDEX', 'CREATE_VIEW', 'ALTER_VIEW', 'DROP_VIEW', 'CREATE_FUNCTION', 'DROP_FUNCTION', 'CREATE_AGGREGATE', 'DROP_AGGREGATE', 'CREATE_TRIGGER', 'DROP_TRIGGER'] || input.statement.type in ['CREATE_ROLE', 'ALTER_ROLE', 'DROP_ROLE', 'GRANT_ROLE', 'REVOKE_ROLE', 'GRANT_PERMISSIONS', 'REVOKE_PERMISSIONS', 'LIST_ROLES', 'LIST_USERS', 'LIST_PERMISSIONS'] ? 'SELECT' : input.statement.type]"
      - if: "vars.qualified && !input.statement.fully_qualified && input.client_state.keyspace == ''"
        then:
          - title: No keyspace for an unqualified table
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:449-454
            fail: {code: invalid, status: 8704, message: "No keyspace has been specified. USE a keyspace, or explicitly specify keyspace.tablename"}
      - title: QualifiedStatement.setKeyspace, take the session keyspace for unqualified tables
        detail: The keyspace comes from ClientState.getKeyspace() only when the statement names none (QualifiedStatement.java:44-53); each statement of a batch is qualified separately.
        source: src/java/org/apache/cassandra/cql3/statements/QualifiedStatement.java:44-53
        set:
          vars.stmt: "= vars.qualified && !input.statement.fully_qualified ? merge(input.statement, {'keyspace': (input.statement.keyspace == '' || input.statement.type == 'BATCH') ? input.client_state.keyspace : input.statement.keyspace, 'statements': has(input.statement.statements) ? input.statement.statements.map(b, (!has(b.keyspace) || b.keyspace == '' || (has(b.fully_qualified) && !b.fully_qualified)) ? merge(b, {'keyspace': input.client_state.keyspace}) : b) : []}) : input.statement"
      - title: raw.prepare(clientState)
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:458
        when: "input.statement.type == 'SELECT'"
        call: select-statement-raw-statement.prepare
        input: {statement: "= vars.stmt", client_state: "= input.client_state"}
      - when: "input.statement.type in ['INSERT', 'UPDATE', 'DELETE']"
        call: modification-statement-parsed.prepare
        input: {statement: "= vars.stmt", client_state: "= input.client_state"}
      - when: "input.statement.type == 'BATCH'"
        call: batch-statement-parsed.prepare
        input: {statement: "= vars.stmt", client_state: "= input.client_state"}
      - title: statement.validate(clientState) at prepare time
        detail: DDL validate is a no-op and role-statement validate is schema-auth's, so only cql statements are validated here.
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:459
        when: "input.statement.type in ['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'BATCH', 'USE', 'TRUNCATE', 'DESCRIBE', 'ADD_IDENTITY', 'DROP_IDENTITY']"
        call: "= vars.comp + '.validate'"
        targets: [select-statement.validate, modification-statement.validate, batch-statement.validate, use-statement.validate, truncate-statement.validate, describe-statement.validate, add-identity-statement.validate, drop-identity-statement.validate]
        input: {statement: "= vars.stmt", client_state: "= input.client_state", options: {}}
        fill: true
      - return:
          statement_id: ""
          query: "= input.query"
          keyspace: "= vars.stmt.keyspace"
          fully_qualified: "= vars.qualified && input.statement.fully_qualified"
          statement: "= vars.stmt"
          size_bytes: "= vars.stmt.prepared_size_bytes"

  - component: query-processor
    name: store-prepared-statement
    kind: function
    summary: Caches a prepared statement under MD5(keyspace + query) and persists new entries to system.prepared_statements.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:818-838
    request:
      type: object
      required: [query, keyspace, prepared]
      properties:
        query: {type: string}
        keyspace: {type: string}
        prepared: {$ref: CqlPrepared}
    response: CqlResultMessage
    errors:
      - {code: invalid, status: 8704}
    behavior:
      - set:
          vars.id: "= 'md5:' + input.keyspace + input.query"
      - if: "input.prepared.size_bytes + 16 > config['prepared-statements-cache-size-mib'] * 1048576"
        then:
          - title: Statement larger than the whole cache
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:825-829
            fail: {code: invalid, status: 8704, message: "= 'Prepared statement of size ' + string(input.prepared.size_bytes) + ' bytes is larger than allowed maximum of ' + string(config['prepared-statements-cache-size-mib']) + ' MB'"}
      - title: Put if absent
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:831
        call: query-processor-prepared-statements.put-if-absent
        input:
          statement_id: "= vars.id"
          query: "= input.query"
          keyspace: "= input.prepared.keyspace"
          fully_qualified: "= input.prepared.fully_qualified"
          statement: "= input.prepared.statement"
          size_bytes: "= input.prepared.size_bytes"
        as: put
        on_error: continue
      - if: "vars.put.ok"
        then:
          - title: Persist to system.prepared_statements
            detail: SystemKeyspace.writePreparedStatement, only when this call inserted the entry, so it is reloaded on restart.
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:832-833
            set: {state.persisted_prepared_statements: "= state.persisted_prepared_statements + 1"}
      - return: {kind: PREPARED, statement_id: "= vars.id", rows: [], warnings: []}

  - component: query-processor
    name: get-prepared
    kind: function
    summary: QueryHandler.getPrepared. A cache lookup; a miss returns null and the transport answers UNPREPARED.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:244-247
    request: {type: object, required: [statement_id], properties: {statement_id: {type: string, examples: ["md5:SELECT name FROM shop.users WHERE id = ?"]}}}
    response: {type: object}
    behavior:
      - call: query-processor-prepared-statements.get-if-present
        input: {statement_id: "= input.statement_id"}
        as: c
        on_error: continue
      - if: "vars.c.ok"
        then:
          - set: {ctx.preparedFound: true}
          - return:
              found: true
              statement_id: "= vars.c.value.statement_id"
              query: "= vars.c.value.query"
              keyspace: "= vars.c.value.keyspace"
              fully_qualified: "= vars.c.value.fully_qualified"
              statement: "= vars.c.value.statement"
              size_bytes: "= vars.c.value.size_bytes"
      - title: Not cached (null)
        detail: ExecuteMessage and BatchMessage turn null into PreparedQueryNotFoundException (UNPREPARED, 0x2500).
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:246
        set: {ctx.preparedFound: false}
      - return: {found: false, statement_id: "= input.statement_id"}

  - component: query-processor
    name: report-last-minute-evictions
    kind: function
    summary: Scheduled every minute on ScheduledExecutors.scheduledTasks. Logs how many prepared statements were evicted for lack of cache space and resets the count.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:120-126
    behavior:
      - if: "state.last_minute_evictions_count > 0"
        then:
          - title: Warn about evictions
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:122-125
            set:
              ctx.evictionWarnings: "= (has(ctx.evictionWarnings) ? ctx.evictionWarnings : 0) + 1"
              ctx.lastEvictionWarning: "= string(state.last_minute_evictions_count) + ' prepared statements discarded in the last minute because cache limit reached (' + string(config['prepared-statements-cache-size-mib']) + ' MiB)'"
      - title: getAndSet(0)
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:121
        set: {state.last_minute_evictions_count: 0}
      - return: {}

  - component: query-processor
    name: process-query-string
    kind: function
    summary: "QueryProcessor.process(String query, ConsistencyLevel cl[, values]): parses an internal CQL string with an internal QueryState and executes it through the normal distributed path."
    description: >-
      Pass-through for callers that hold only the query text (auth tables, distributed system
      keyspaces). The model checks the syntax; without a parsed statement structure it cannot run
      the statement, so it returns an empty row set. Callers that need the effect model their own
      table store.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:377-393
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:337-343
    request:
      type: object
      required: [query, consistency]
      properties:
        query: {type: string, examples: ["SELECT * FROM system_auth.roles WHERE role = ?"]}
        consistency: {type: string, examples: [LOCAL_QUORUM]}
    response:
      type: object
      properties:
        rows: {type: array, items: {type: object}, default: []}
    errors:
      - {code: unavailable, status: 4096}
      - {code: write-timeout, status: 4352}
      - {code: read-timeout, status: 4608}
      - {code: invalid, status: 8704}
      - {code: syntax-error, status: 8192}
    behavior:
      - title: parse with QueryState.forInternalCalls, then process
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:384-387
        call: query-processor.parse-statement
        input: {query: "= input.query"}
      - set: {ctx.internalQueries: "= (has(ctx.internalQueries) ? ctx.internalQueries : 0) + 1"}
      - return: {rows: []}
  - component: query-processor
    name: preload-prepared-statements
    kind: function
    summary: "Startup: re-prepares every statement saved in system.prepared_statements into the cache; statements that no longer prepare are removed."
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:165-206
    request: {type: object, properties: {}}
    response: {type: object, properties: {count: {type: integer, default: 0}}}
    behavior:
      - title: SystemKeyspace.loadPreparedStatements, parseAndPrepare each, put in the cache
        detail: The model counts the statements persisted by store-prepared-statement in this run; the cache rows themselves are already in query-processor-prepared-statements.
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:174-199
        set: {ctx.preloadedPrepared: "= state.persisted_prepared_statements"}
      - return: {count: "= state.persisted_prepared_statements"}
  - component: query-processor
    name: clear-prepared-statements
    kind: function
    summary: Invalidates the whole prepared statement cache and, unless memory_only, truncates system.prepared_statements.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:208-213
    request: {type: object, properties: {memory_only: {type: boolean, default: false}}}
    response: {type: object, properties: {}}
    behavior:
      - call: query-processor-prepared-statements.as-map
        input: {}
        as: all
      - foreach: "= vars.all.value"
        as: row
        steps:
          - title: preparedStatements.invalidateAll()
            source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:210
            call: query-processor-prepared-statements.invalidate
            input: {statement_id: "= vars.row.statement_id"}
      - when: "!input.memory_only"
        title: SystemKeyspace.resetPreparedStatements()
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:211-212
        set: {state.persisted_prepared_statements: 0}
      - return: {}

  # --- Prepared statement cache (store) --------------------------------------
  - component: query-processor-prepared-statements
    name: get-if-present
    kind: cache
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:244-247
    request: {type: object, required: [statement_id], properties: {statement_id: {type: string}}}
    response: CqlPrepared
    errors:
      - {code: prepared-statement-not-cached, status: 404}
    store: {table: entries, op: get, key: "= input.statement_id", not_found: prepared-statement-not-cached}
  - component: query-processor-prepared-statements
    name: put-if-absent
    kind: cache
    summary: "Cache.get(id, k -> prepared): inserts only when absent."
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:831
    request: CqlPrepared
    errors:
      - {code: already-cached, status: 409}
    store: {table: entries, op: put, key: "= input.statement_id", value: "= input", where: "row == null", conflict: already-cached}
  - component: query-processor-prepared-statements
    name: invalidate
    kind: cache
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:1009-1013
    request: {type: object, required: [statement_id], properties: {statement_id: {type: string}}}
    store: {table: entries, op: delete, key: "= input.statement_id"}
  - component: query-processor-prepared-statements
    name: as-map
    kind: cache
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:979-980
    store: {table: entries, op: query}

  # --- Schema change invalidation ----------------------------------------------
  - component: query-processor-statement-invalidating-listener
    name: on-drop-table
    kind: event
    subscribe: [schema-change-notifier.on-drop-table]
    summary: Drops every cached SELECT, modification or batch that touches the dropped table, from memory and system.prepared_statements.
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:1117-1122
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:977-1015
    request: {type: object, required: [keyspace, table], properties: {keyspace: {type: string, examples: [shop]}, table: {type: string, examples: [users]}}}
    behavior:
      - call: query-processor-prepared-statements.as-map
        input: {}
        as: all
      - set: {vars.removed: 0}
      - foreach: "= vars.all.value"
        as: row
        steps:
          - set:
              vars.s: "= vars.row.statement"
          - if: "(vars.s.type in ['SELECT', 'INSERT', 'UPDATE', 'DELETE'] && vars.s.keyspace == input.keyspace && (input.table == '' || vars.s.table == input.table)) || (vars.s.type == 'BATCH' && has(vars.s.statements) && vars.s.statements.exists(b, has(b.keyspace) && b.keyspace == input.keyspace && (input.table == '' || (has(b.table) && b.table == input.table))))"
            then:
              - title: shouldInvalidate, remove from cache and system table
                source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:1026-1059
                call: query-processor-prepared-statements.invalidate
                input: {statement_id: "= vars.row.statement_id"}
              - set: {vars.removed: "= vars.removed + 1"}
      - set: {ctx.invalidatedPrepared: "= vars.removed"}
      - return: {removed: "= vars.removed"}
  - component: query-processor-statement-invalidating-listener
    name: on-drop-keyspace
    kind: event
    subscribe: [schema-change-notifier.on-drop-keyspace]
    summary: Drops every cached statement on the dropped keyspace (cfName null matches every table).
    sources:
      - src/java/org/apache/cassandra/cql3/QueryProcessor.java:1110-1115
    request: {type: object, required: [keyspace], properties: {keyspace: {type: string, examples: [shop]}}}
    behavior:
      - title: removeInvalidPreparedStatements(keyspace, null)
        source: src/java/org/apache/cassandra/cql3/QueryProcessor.java:1113
        call: query-processor-statement-invalidating-listener.on-drop-table
        input: {keyspace: "= input.keyspace", table: ""}
        as: r
      - return: "= vars.r.value"

  # =========================================================================
  # Prepare-time components
  # =========================================================================
  - component: select-statement-raw-statement
    name: prepare
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:1213-1275
    request: CqlRequest
    response: CqlStatement
    errors: [{code: invalid, status: 8704}]
    behavior:
      - title: Schema.validateTable
        source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:1215
        call: schema.validate-table
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table"}
      - call: statement-restrictions.process-partition-key-restrictions
        input: {statement_type: SELECT, partition_keys: "= input.statement.partition_keys"}
      - if: "!input.statement.allow_filtering && size(input.statement.partition_keys) == 0 && input.statement.needs_filtering"
        then:
          - title: Filtering requires ALLOW FILTERING
            detail: checkNeedsFiltering, for key-range or index queries whose row filter is not served by an index.
            source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:1602-1612
            fail: {code: invalid, status: 8704, message: "Cannot execute this query as it might involve data filtering and thus may have unpredictable performance. If you want to execute this query despite the performance unpredictability, use ALLOW FILTERING"}
      - return: "= input.statement"

  - component: statement-restrictions
    name: process-partition-key-restrictions
    kind: function
    summary: Non-SELECT statements must restrict every partition key column with EQ or IN.
    sources:
      - src/java/org/apache/cassandra/cql3/restrictions/StatementRestrictions.java:585-601
    request:
      type: object
      properties:
        statement_type: {type: string}
        partition_keys: {type: array, items: {$ref: CqlPartitionKey}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - if: "input.statement_type != 'SELECT' && size(input.partition_keys) == 0"
        then:
          - title: Partition key missing
            source: src/java/org/apache/cassandra/cql3/restrictions/StatementRestrictions.java:592-594
            fail: {code: invalid, status: 8704, message: "Some partition key parts are missing: id"}
      - return: {ok: true}

  - component: modification-statement-parsed
    name: prepare
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:951-961
    request: CqlRequest
    response: CqlStatement
    errors: [{code: invalid, status: 8704}]
    behavior:
      - title: Schema.validateTable
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:953
        call: schema.validate-table
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table"}
      - if: "size(input.statement.conditions) > 0 && input.statement.using_timestamp > 0"
        then:
          - title: Column conditions with USING TIMESTAMP
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:1001-1003
            fail: {code: invalid, status: 8704, message: Cannot provide custom timestamp for conditional updates}
      - set:
          vars.target: "= input.statement.type == 'INSERT' ? 'update-statement-parsed-insert' : (input.statement.type == 'UPDATE' ? 'update-statement-parsed-update' : 'delete-statement-parsed')"
      - title: prepareInternal
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:960
        call: "= vars.target + '.prepare-internal'"
        targets: [update-statement-parsed-insert.prepare-internal, update-statement-parsed-update.prepare-internal, delete-statement-parsed.prepare-internal]
        input: "= input"
      - if: "(size(input.statement.conditions) > 0 || input.statement.if_not_exists || input.statement.if_exists) && input.statement.table_kind == 'counter'"
        then:
          - title: No conditions on counter tables
            detail: Checked in the ModificationStatement constructor that prepareInternal ends with.
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:122-126
            fail: {code: invalid, status: 8704, message: Conditional updates are not supported on counter tables}
      - return: "= input.statement"

  - component: update-statement-parsed-insert
