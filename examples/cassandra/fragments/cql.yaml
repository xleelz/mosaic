  # --- Migration: DDL and role statements through QUERY, multi-step round trips, read-backs ---
  - id: cql-ddl-create-table
    flow: cql-ddl
    fixtures: [three-node-rf3]
    name: CREATE TABLE through QUERY reaches AlterSchemaStatement.execute
    expect:
      - "result.ok && result.value.kind == 'SCHEMA_CHANGE' && ctx.statementKind == 'ddl'"
      - "calls['alter-schema-statement.authorize'] == 1 && calls['alter-schema-statement.validate'] == 1 && calls['alter-schema-statement.execute'] == 1 && calls['select-statement.authorize'] == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'alter-schema-statement.execute' && e.input.statement.type == 'CREATE_TABLE' && e.input.statement.table == 'customers')"
  - id: cql-ddl-create-existing-table
    flow: cql-ddl
    fixtures: [three-node-rf3]
    name: CREATE TABLE of an existing table is refused by schema-auth
    input:
      statement: {table: users, columns: [id text, name text]}
    expect:
      - "!result.ok && calls['alter-schema-statement.execute'] == 1"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-with-triggers')"
  - id: cql-ddl-then-describe
    fixtures: [three-node-rf3]
    name: CREATE TABLE then DESCRIBE TABLE reads the new table back
    steps:
      - {flow: cql-ddl, as: ddl}
      - {flow: cql-describe, as: desc, input: {statement: {describe_target: TABLE, keyspace: shop, describe_name: customers}}}
    expect:
      - "'table:shop.customers' in state['schema-keyspace@n1'].rows"
      - "steps.ddl.result.ok && steps.ddl.result.value.kind == 'SCHEMA_CHANGE'"
      - "steps.desc.result.ok && steps.desc.result.value.rows[0].name == 'customers'"
  - id: cql-role-create
    state: {client-state: {user: cassandra}}
    flow: cql-role
    fixtures: [three-node-rf3, auth-users]
    name: CREATE ROLE through QUERY runs authorize, validate and execute of CreateRoleStatement
    expect:
      - "result.ok && ctx.statementKind == 'role'"
      - "calls['create-role-statement.authorize'] == 1 && calls['create-role-statement.validate'] == 1 && calls['create-role-statement.execute'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'create-role-statement.execute' && e.input.role == 'bob' && e.input.user == 'cassandra')"
  - id: cql-role-create-unauthorized
    state: {client-state: {user: alice}}
    flow: cql-role
    fixtures: [three-node-rf3, auth-users]
    name: A non-superuser without CREATE on roles is refused before execute
    input: {client_state: {user: alice, is_anonymous: false, is_super: false}}
    expect:
      - "!result.ok && result.error.code == 'unauthorized' && calls['create-role-statement.execute'] == 0"
  - id: cql-role-then-list
    state: {client-state: {user: cassandra}}
    fixtures: [three-node-rf3, auth-users]
    name: CREATE ROLE then LIST ROLES reads the new role back
    steps:
      - {flow: cql-role, as: create}
      - {flow: cql-role, as: list, input: {statement: {type: LIST_ROLES, role_statement: {role: "", grantee: "", recursive: true}}}}
      - {interface: cassandra-role-manager.is-existing-role, caller: cql, as: exists, input: {role: bob}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'create-role-statement.execute' && e.input.role == 'bob' && e.instance == 'n1')"
      - "steps.create.result.ok"
      - "steps.list.result.ok && steps.list.result.value.rows.exists(r, r.role == 'bob')"
      - "steps.exists.result.ok && steps.exists.result.value.exists == true"
  - id: cql-prepare-then-execute
    fixtures: [three-node-rf3]
    name: PREPARE, look the id up as EXECUTE does, then EXECUTE the cached statement
    steps:
      - {flow: cql-prepare, as: prep}
      - {flow: cql-get-prepared, as: get, input: {statement_id: "= steps.prep.result.value.statement_id"}}
      - {flow: cql-execute-prepared, as: exe, input: {statement: "= steps.get.result.value.statement", options: {values: ["user:42"]}}}
    expect:
      - "steps.prep.result.ok && steps.prep.result.value.kind == 'PREPARED'"
      - "steps.get.result.value.found == true && steps.get.result.value.statement_id == steps.prep.result.value.statement_id"
      - "steps.exe.result.ok && steps.exe.result.value.kind == 'ROWS'"
      - "steps.prep.result.value.statement_id in state['query-processor-prepared-statements@n1'].entries"
  - id: cql-describe-paging-round-trip
    fixtures: [three-node-rf3]
    name: DESCRIBE KEYSPACES page by page with the returned paging state
    steps:
      - {flow: cql-describe, as: p1, input: {options: {page_size: 1}}}
      - {flow: cql-describe, as: p2, input: {options: {page_size: 1, paging_state: "= steps.p1.result.value.paging_state"}}}
    expect:
      - "steps.p1.result.ok && steps.p1.result.value.has_more_pages == true && steps.p1.result.value.paging_state.offset == 1"
      - "steps.p2.result.ok && size(steps.p2.result.value.rows) == 1 && steps.p2.result.value.rows[0].name != steps.p1.result.value.rows[0].name"
  - id: cql-write-then-read
    fixtures: [three-node-rf3]
    name: INSERT at QUORUM then SELECT reads the row back
    steps:
      - {flow: cql-write, as: w}
      - {flow: cql-select, as: r, input: {statement: {columns: {name: null}}}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-with-triggers' && e.instance == 'n1')"
      - "steps.w.result.ok"
      - "steps.r.result.ok && steps.r.result.value.rows.exists(row, has(row.name) && row.name == 'Ada')"
  - id: cql-delete-then-read
    fixtures: [three-node-rf3]
    name: INSERT, DELETE the partition, then SELECT finds no live name
    steps:
      - {flow: cql-write, as: w}
      - {flow: cql-delete, as: d}
      - {flow: cql-select, as: r, input: {statement: {columns: {name: null}}}}
    expect:
      - "steps.w.result.ok && steps.d.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-with-triggers' && e.input.mutations[0].partition_deletion == true)"
      - "steps.r.result.ok && !steps.r.result.value.rows.exists(row, has(row.name) && row.name == 'Ada')"
  - id: cql-lwt-then-read-and-retry
    fixtures: [three-node-rf3]
    name: INSERT IF NOT EXISTS applies, SELECT reads it, a second INSERT IF NOT EXISTS is not applied
    steps:
      - {flow: cql-conditional-write, as: first}
      - {flow: cql-select, as: r, input: {statement: {columns: {name: null}}}}
      - {flow: cql-conditional-write, as: second, input: {statement: {columns: {name: Grace}}}}
    expect:
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.cas').size() == 2"
      - "steps.first.result.ok && steps.first.result.value.rows[0]['[applied]'] == true"
      - "steps.r.result.ok && steps.r.result.value.rows.exists(row, has(row.name) && row.name == 'Ada')"
      - "steps.second.result.ok && steps.second.result.value.applied == false && steps.second.result.value.rows[0]['[applied]'] == false"
      - "steps.second.result.value.rows[0].name == 'Ada'"
  - id: cql-batch-then-read
    fixtures: [three-node-rf3]
    name: LOGGED batch then SELECT reads the users row back
    steps:
      - {flow: cql-batch, as: b}
