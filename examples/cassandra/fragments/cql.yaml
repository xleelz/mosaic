    response:
      type: object
      examples: [{"-3074457345618258603": ["10.0.0.1", "10.0.0.2", "10.0.0.3"], "3074457345618258602": ["10.0.0.2", "10.0.0.3", "10.0.0.1"], "9223372036854775807": ["10.0.0.3", "10.0.0.1", "10.0.0.2"]}]
  - component: gossiper
    name: get-min-version
    kind: function
    sources: [src/java/org/apache/cassandra/gms/Gossiper.java:2591]
    attributes: {boundary: true, owner: membership}
    request: {type: object, properties: {timeout_ms: {type: integer}}}
    response: {type: string, examples: ["5.0.9"]}
  - component: read-command
    name: execute-locally
    kind: function
    summary: Reads this node's memtables and SSTables for one command.
    sources:
      - src/java/org/apache/cassandra/db/ReadCommand.java:426-507
    attributes: {boundary: true, owner: read-path}
    request:
      type: object
      properties:
        read_command: *readCommandShape
        replica: {type: string}
    response:
      type: object
      properties:
        partitions:
          type: array
          items:
            type: object
            properties:
              partition_key: {type: string}
              timestamp: {type: integer}
              cells: {type: array, items: {type: object, properties: {column: {type: string}, value: {}, timestamp: {type: integer}}}}
          examples: [[{partition_key: "user:42", timestamp: 1730000000000000, cells: [{column: name, value: Ada, timestamp: 1730000000000000}]}]]
  - component: mutation
    name: apply
    kind: function
    summary: Mutation.apply, the local write (commit log and memtable) through Keyspace.apply.
    sources: [src/java/org/apache/cassandra/db/Mutation.java:266]
    attributes: {boundary: true, owner: write-path}
    request:
      type: object
      required: [mutation]
      properties:
        mutation:
          type: object
          required: [keyspace, table, partition_key, token, timestamp, columns]
          properties:
            keyspace: {type: string}
            table: {type: string}
            partition_key: {type: string}
            token: {type: integer}
            timestamp: {type: integer}
            columns: {type: object}
            partition_deletion: {type: boolean, default: false}
            cells: {type: array, items: {type: object}}
        replica: {type: string}
    response: {type: object}

  # --- schema-auth statements reached from process-statement (owner: schema-auth) ---
  - component: alter-schema-statement
    name: authorize
    kind: function
    summary: The DDL statement's authorize(ClientState), per statement class (schema-auth).
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/CreateTableStatement.java:162-165']
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object}
    errors: [{code: unauthorized, status: 8448}, {code: invalid, status: 8704}]
  - component: alter-schema-statement
    name: validate
    kind: function
    summary: AlterSchemaStatement.validate; statement validation happens in apply (schema-auth).
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:53-59']
    attributes: {boundary: true, owner: schema-auth}
    request: {type: object}
  - component: alter-schema-statement
    name: execute
    kind: function
    summary: 'AlterSchemaStatement.execute: guard system keyspaces, run the transformation through Schema.transform, grant the creator permissions on new resources, and return SCHEMA_CHANGE (or Void for an
      empty diff).'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:61-76
    - src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:107-137
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: already-exists
      status: 9216
    - code: config-error
      status: 8960
    - code: unauthorized
      status: 8448
  - component: create-role-statement
    name: authorize
    kind: function
    summary: CREATE on all roles; creating a superuser role requires being a superuser (the anonymous user never is).
    sources:
    - src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:50-58
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: unauthorized
      status: 8448
  - component: create-role-statement
    name: validate
    kind: function
    summary: 'validate: options valid, non-empty name, then ensureNotAnonymous (so under the deployed AllowAllAuthenticator every CREATE ROLE stops here), then refuse an existing role unless IF NOT EXISTS.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:60-82
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: create-role-statement
    name: execute
    kind: function
    summary: 'execute: IF NOT EXISTS on an existing role does nothing; otherwise create the role, set datacenters when the network authorizer requires it, set CIDR groups, and grant the creator ALTER, DROP,
      AUTHORIZE and DESCRIBE on the new role.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:84-130
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: unavailable
      status: 4096
    - code: write-timeout
      status: 4352
  - component: alter-role-statement
    name: authorize
    kind: function
    summary: No one may change their own superuser status (or that of a role granted to them); only superusers change superuser status, datacenters or CIDR groups; a non-superuser may alter its own alterable
      options (PASSWORD with PasswordAuthenticator) or needs ALTER on the other role.
    sources:
    - src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:83-119
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: unauthorized
      status: 8448
  - component: alter-role-statement
    name: validate
    kind: function
    summary: 'validate: refuse an empty ALTER, then ensureNotAnonymous, then require the role to exist unless IF EXISTS.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:57-81
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: alter-role-statement
    name: execute
    kind: function
    summary: 'execute: IF EXISTS on a missing role does nothing; otherwise alter the role''s options (and datacenters / CIDR groups when given).'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:121-136
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: overloaded
      status: 4097
  - component: drop-role-statement
    name: authorize
    kind: function
    summary: DROP on the role; dropping an existing superuser role requires being a superuser.
    sources:
    - src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:42-52
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: unauthorized
      status: 8448
  - component: drop-role-statement
    name: validate
    kind: function
    summary: 'validate: ensureNotAnonymous, the role must exist unless IF EXISTS, and you cannot drop your own login role.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:54-65
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: drop-role-statement
    name: execute
    kind: function
    summary: 'execute: drop the role, then revoke every permission held by it and on it, its datacenter and CIDR permissions.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:67-80
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
  - component: role-management-statement
    name: authorize
    kind: function
    summary: GRANT/REVOKE role requires AUTHORIZE on the granted role.
    sources:
    - src/java/org/apache/cassandra/cql3/statements/RoleManagementStatement.java:42-45
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: unauthorized
      status: 8448
  - component: role-management-statement
    name: validate
    kind: function
    summary: 'validate: ensureNotAnonymous; both the role and the grantee must exist.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/RoleManagementStatement.java:47-56
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: grant-role-statement
    name: execute
    kind: function
    summary: GRANT role TO grantee - roleManager.grantRole.
    sources:
    - src/java/org/apache/cassandra/cql3/statements/GrantRoleStatement.java:38-42
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: invalid
      status: 8704
  - component: revoke-role-statement
    name: execute
    kind: function
    summary: REVOKE role FROM revokee - roleManager.revokeRole.
    sources:
    - src/java/org/apache/cassandra/cql3/statements/RevokeRoleStatement.java:38-42
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: invalid
      status: 8704
  - component: permissions-management-statement
    name: authorize
    kind: function
    summary: GRANT/REVOKE permissions require AUTHORIZE on the resource (or a parent) and each granted permission itself.
    sources:
    - src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:61-72
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: unauthorized
      status: 8448
  - component: permissions-management-statement
    name: validate
    kind: function
    summary: 'validate: ensureNotAnonymous, the grantee role must exist, and the resource must exist.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:45-59
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: grant-permissions-statement
    name: validate
    kind: function
    summary: 'Adds to the base validation: on non-virtual system keyspaces only SELECT, DESCRIBE and ALTER may be granted.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/GrantPermissionsStatement.java:47-62
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: grant-permissions-statement
    name: execute
    kind: function
    summary: 'execute: authorizer.grant; warn the client about permissions the role already had (unless ALL was given).'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/GrantPermissionsStatement.java:64-86
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: unsupported-operation
      status: 0
  - component: revoke-permissions-statement
    name: execute
    kind: function
    summary: 'execute: authorizer.revoke; warn the client about permissions the role did not have.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/RevokePermissionsStatement.java:45-67
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: unsupported-operation
      status: 0
  - component: list-roles-statement
    name: validate
    kind: function
    summary: 'validate: ensureNotAnonymous; a named grantee must exist. authorize() is empty.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:70-80
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: list-roles-statement
    name: execute
    kind: function
    summary: 'execute: with DESCRIBE on all roles (asked of the authorizer directly, not the cache) list every role or the grantee''s; otherwise only your own roles, or the grantee''s when you hold it.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:82-115
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: unauthorized
      status: 8448
  - component: list-permissions-statement
    name: validate
    kind: function
    summary: 'validate: ensureNotAnonymous; the resource and the grantee must exist. authorize() is empty (checked in validate and in IAuthorizer.list).'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:67-86
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448
  - component: list-permissions-statement
    name: execute
    kind: function
    summary: 'execute: IAuthorizer.list over the resource (and its parents when recursive, the default); UnsupportedOperationException (AllowAllAuthorizer) becomes InvalidRequestException.'
    sources:
    - src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:89-135
    attributes:
      boundary: true
      owner: schema-auth
    request:
      type: object
    response:
      type: object
    errors:
    - code: invalid
      status: 8704
    - code: unauthorized
      status: 8448

flows:
  - id: cql-parse-query
    name: Parse a QUERY string into a prepared statement
    description: QueryMessage calls QueryHandler.parse before process. Syntax, keyspace and prepare-time checks.
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:345-348]
    entry:
      caller: cql-client
      interface: query-processor.parse
      input:
        query: "SELECT name, email FROM shop.users WHERE id = 'user:42'"
        statement: {type: SELECT, keyspace: shop, table: users, columns: {name: null, email: null}}
  - id: cql-select
    name: SELECT through StorageProxy
    sources: [src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:280-366]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: SELECT, keyspace: shop, table: users, columns: {name: null, email: null}}
        options: {consistency: QUORUM}
  - id: cql-write
    tags: [writes]
    name: INSERT, UPDATE and DELETE without conditions
    sources: [src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:491-536]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: INSERT, keyspace: shop, table: users, columns: {name: Ada, email: ada@example.com}}
        options: {consistency: QUORUM}
  - id: cql-delete
    tags: [writes]
    name: DELETE (partition, row and column deletions)
    sources: [src/java/org/apache/cassandra/cql3/statements/DeleteStatement.java:59-112]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: DELETE, keyspace: shop, table: users}
        options: {consistency: QUORUM}
  - id: cql-conditional-write
    tags: [writes]
    name: Lightweight transaction (INSERT ... IF NOT EXISTS, UPDATE ... IF)
    sources: [src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:538-579]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: INSERT, keyspace: shop, table: users, columns: {name: Ada}, if_not_exists: true}
        options: {consistency: QUORUM, serial_consistency: SERIAL}
  - id: cql-cas-condition-check
    name: Evaluate a CQL3CasRequest against the partition Paxos read
    sources: [src/java/org/apache/cassandra/cql3/statements/CQL3CasRequest.java:215-225]
    entry:
      caller: paxos
      interface: cql3-cas-request.applies-to
      input: {row_exists: false, if_not_exists: true}
  - id: cql-batch
    tags: [writes]
    name: Native BATCH message through processBatch
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:883-891]
    entry:
      caller: cql-client
      interface: query-processor.process-batch
      input:
        statement:
          type: BATCH
          batch_type: LOGGED
          keyspace: shop
          table: users
          statements:
            - {type: INSERT, keyspace: shop, table: users, partition_keys: [{partition_key: "user:42", token: -4069959284402364209}], columns: {name: Ada}, size_bytes: 120}
            - {type: INSERT, keyspace: shop, table: orders, partition_keys: [{partition_key: "order:9001", token: 1622840367226573521}], columns: {user_id: "user:42", total_cents: 4200}, size_bytes: 140}
        options: {consistency: QUORUM}
  - id: cql-prepare
    tags: [writes]
    name: PREPARE and the prepared statement cache
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:728-784]
    entry:
      caller: cql-client
      interface: query-processor.prepare
      input:
        query: "SELECT name FROM shop.users WHERE id = ?"
        statement: {type: SELECT, keyspace: shop, table: users, columns: {name: null}, bind_markers: 1}
        client_state: {keyspace: ""}
  - id: cql-execute-prepared
    name: EXECUTE of a prepared statement
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:851-871]
    entry:
      caller: cql-client
      interface: query-processor.process-prepared
      input:
        statement: {type: SELECT, keyspace: shop, table: users, columns: {name: null}, bind_markers: 1}
        options: {consistency: LOCAL_QUORUM, values: ["user:42"]}
  - id: cql-get-prepared
    name: Look up a prepared statement by id
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:244-247]
    entry:
      caller: transport
      interface: query-processor.get-prepared
      input: {statement_id: "md5:SELECT name FROM shop.users WHERE id = ?"}
  - id: cql-use
    tags: [writes]
    name: USE keyspace
    sources: [src/java/org/apache/cassandra/cql3/statements/UseStatement.java:63-68]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: USE, keyspace: shop}
  - id: cql-truncate
    tags: [writes]
    name: TRUNCATE table
    sources: [src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:66-88]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: TRUNCATE, keyspace: shop, table: orders}
  - id: cql-describe
    name: Server-side DESCRIBE
    sources: [src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:129-181]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: DESCRIBE, describe_target: KEYSPACES, keyspace: ""}
        client_state: {keyspace: ""}
  - id: cql-identity
    tags: [writes]
    name: ADD IDENTITY and DROP IDENTITY
    sources: [src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:39-90]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: ADD_IDENTITY, identity: "spiffe://shop.example/app", role: app_role}
  - id: cql-prepared-eviction-report
    name: Minute report of prepared statement evictions
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:120-126]
    entry:
      caller: cassandra-node
      interface: query-processor.report-last-minute-evictions
      repeat: {count: 2, interval_ms: 60000, initial_delay_ms: 60000}
  - id: cql-invalidate-on-drop-table
    name: Drop cached prepared statements when a table is dropped
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:1117-1122]
    entry:
      caller: schema-auth
      interface: query-processor-statement-invalidating-listener.on-drop-table
      input: {keyspace: shop, table: users}
  - id: cql-invalidate-on-drop-keyspace
    name: Drop cached prepared statements when a keyspace is dropped
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:1110-1115]
    entry:
      caller: schema-auth
      interface: query-processor-statement-invalidating-listener.on-drop-keyspace
      input: {keyspace: shop}

  - id: cql-ddl
    tags: [writes]
    name: DDL through QUERY (dispatched to schema-auth's AlterSchemaStatement)
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:266-279]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement: {type: CREATE_TABLE, keyspace: shop, table: customers, columns: [id uuid, name text], partition_key: [id]}
        client_state: {keyspace: shop}
  - id: cql-role
    tags: [writes]
    name: Role and permission statements through QUERY (dispatched to schema-auth)
    sources: [src/java/org/apache/cassandra/cql3/QueryProcessor.java:266-279]
    entry:
      caller: cql-client
      interface: query-processor.process
      input:
        statement:
          type: CREATE_ROLE
          role_statement: {role: bob, options: {superuser_set: false, superuser: false, login_set: true, login: true, password: b0bpass}}
        client_state: {user: cassandra, is_anonymous: false, is_super: true}

scenarios:
  # --- parse -------------------------------------------------------------------
  - id: cql-parse-select-ok
    flow: cql-parse-query
    fixtures: [three-node-rf3]
    name: A fully qualified SELECT parses and prepares
    expect:
      - "result.ok && result.value.type == 'SELECT'"
      - "calls['cql-fragment-parser.parse-any-unhandled'] == 1 && calls['schema.validate-table'] == 1"
  - id: cql-parse-syntax-error
    flow: cql-parse-query
    fixtures: [three-node-rf3]
    name: Misspelled keyword is a SyntaxException
    input: {query: "SELEKT name FROM shop.users"}
    expect:
      - "!result.ok && result.error.code == 'syntax-error' && result.error.status == 8192"
      - "result.error.message.contains('SELEKT')"
      - "calls['schema.validate-table'] == 0"
  - id: cql-parse-unqualified-without-keyspace
    flow: cql-parse-query
    fixtures: [three-node-rf3]
    name: Unqualified table with no USE keyspace
    input:
      query: "SELECT name FROM users WHERE id = 'user:42'"
      statement: {fully_qualified: false}
      client_state: {keyspace: ""}
    expect:
      - "!result.ok && result.error.code == 'invalid' && result.error.message.startsWith('No keyspace has been specified')"
      - "calls['select-statement-raw-statement.prepare'] == 0"
  - id: cql-parse-options-keyspace-overrides
    flow: cql-parse-query
    fixtures: [three-node-rf3]
    name: The protocol keyspace option qualifies an unqualified table
    input:
      query: "SELECT name FROM users WHERE id = 'user:42'"
      statement: {fully_qualified: false}
      client_state: {keyspace: ""}
      options: {keyspace: shop}
    expect:
      - "result.ok && calls['select-statement-raw-statement.prepare'] == 1 && result.value.keyspace == 'shop'"
  - id: cql-parse-filtering-requires-allow-filtering
    flow: cql-parse-query
    fixtures: [three-node-rf3]
    name: Non-key filter without ALLOW FILTERING is refused at prepare time
    input:
      query: "SELECT name FROM shop.users WHERE email = 'ada@example.com'"
      statement: {partition_keys: [], needs_filtering: true}
    expect:
      - "!result.ok && result.error.code == 'invalid' && result.error.message.contains('use ALLOW FILTERING')"
  - id: cql-parse-filtering-allowed
    flow: cql-parse-query
    fixtures: [three-node-rf3]
    name: The same query with ALLOW FILTERING prepares
    input:
