  # =========================================================================
  # SELECT
  # =========================================================================
  - component: select-statement
    name: authorize
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:241-272
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - title: SELECT permission (on the base table for a view)
        source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:243-253
        call: client-state.ensure-table-permission
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table", permission: SELECT}
      - return: {authorized: true}

  - component: select-statement
    name: validate
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:274-278
    request: CqlRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - if: "input.statement.allow_filtering && !config['allow-filtering-enabled'] && !input.client_state.is_super && !(input.statement.keyspace in ['system', 'system_schema', 'system_auth', 'system_distributed', 'system_traces', 'system_views', 'system_virtual_schema'])"
        then:
          - title: allow_filtering guardrail
            detail: Guardrails apply to ordinary users only (Guardrail.enabled checks isOrdinaryUser).
            source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:276-277
            fail: {code: invalid, status: 8704, message: "Guardrail allow_filtering violated: Querying with ALLOW FILTERING is not allowed"}
      - return: {valid: true}

  - component: select-statement
    name: execute
    kind: function
    summary: Distributed SELECT. Single-partition (or IN) reads go to StorageProxy.read, key-range reads to StorageProxy.getRangeSlice; a pager is used when the limit exceeds the page size.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:280-366
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - title: cl.validateForRead()
        source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:285
        call: consistency-level.validate-for-read
        input: {consistency: "= input.options.consistency"}
      - if: "input.options.consistency in config['read-consistency-levels-disallowed'] && !input.client_state.is_super"
        then:
          - title: read_consistency_levels guardrail
            source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:286
            fail: {code: invalid, status: 8704, message: "= 'Guardrail read_consistency_levels violated: Provided values [' + input.options.consistency + '] are not allowed for read consistency levels'"}
      - set:
          vars.paged: "= input.options.page_size > 0 && (input.statement.limit <= 0 || input.statement.limit > input.options.page_size)"
          vars.limit: "= input.options.page_size > 0 && (input.statement.limit <= 0 || input.statement.limit > input.options.page_size) ? input.options.page_size : input.statement.limit"
          vars.cols: "= input.statement.columns.map(c, c)"
      - set:
          ctx.selectPaged: "= vars.paged"
      - if: "size(input.statement.partition_keys) == 0"
        then:
          - title: Key-range query, PartitionRangeReadCommand
            detail: getQuery picks getRangeCommand when restrictions.isKeyRange(); paged queries go through PartitionRangeQueryPager, which also calls getRangeSlice.
            source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:403-408
            call: storage-proxy.get-range-slice
            input:
              command: {keyspace: "= input.statement.keyspace", table: "= input.statement.table", start_token: -9223372036854775808, end_token: -9223372036854775808, limit: "= vars.limit > 0 ? vars.limit : 100", filtered: "= input.statement.allow_filtering"}
              consistency: "= input.options.consistency"
            as: read
          - set: {ctx.readPath: range, vars.rows: "= vars.read.value.rows"}
        else:
          - set: {vars.rows: []}
          - foreach: "= input.statement.partition_keys"
            as: k
            steps:
              - title: Partition-restricted query, one SinglePartitionReadCommand per key
                detail: The code sends one SinglePartitionReadCommand.Group (IN gives several commands); coordination's contract takes one read_command per call, so the model calls once per key. Paged queries go through SinglePartitionPager or MultiPartitionPager, which call StorageProxy.read page by page. SERIAL and LOCAL_SERIAL are passed through; StorageProxy.read routes them to the Paxos read.
                source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:414
                call: storage-proxy.read
                input:
                  read_command: {kind: single_partition, keyspace: "= input.statement.keyspace", table: "= input.statement.table", partition_key: "= vars.k.partition_key", token: "= vars.k.token", columns: "= vars.cols", limit: "= vars.limit > 0 ? vars.limit : 100", digest: false}
                  consistency: "= input.options.consistency"
                as: read
              - set: {vars.rows: "= vars.rows + (has(vars.read.value.rows) ? vars.read.value.rows : [])"}
          - set: {ctx.readPath: single-partition}
      - title: processResults
        source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:427-430
        call: select-statement.process
        input: {partitions: "= vars.rows", columns: "= vars.cols", limit: "= input.statement.limit"}
        as: rs
      - set:
          vars.more: "= vars.paged && size(vars.rows) >= input.options.page_size"
          vars.rows: "= vars.rs.value.rows"
      - title: Paging state only when the pager is not exhausted
        source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:549-550
        set: {ctx.hasMorePages: "= vars.more"}
      - return: {kind: ROWS, rows: "= vars.rows", has_more_pages: "= vars.more", warnings: []}

  - component: select-statement
    name: execute-locally
    kind: function
    summary: executeInternal. Reads this node's data through ReadCommand.executeLocally without a coordinator.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:574-577
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:579-623
    request: CqlRequest
    response: CqlResultMessage
    behavior:
      - set: {vars.rows: []}
      - foreach: "= input.statement.partition_keys"
        as: k
        steps:
          - title: query.executeInternal(executionController)
            source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:604
            call: read-command.execute-locally
            input:
              read_command: {kind: single_partition, keyspace: "= input.statement.keyspace", table: "= input.statement.table", partition_key: "= vars.k.partition_key", token: "= vars.k.token", columns: "= input.statement.columns.map(c, c)", limit: "= input.statement.limit > 0 ? input.statement.limit : 100", digest: false}
            as: lr
          - set: {vars.rows: "= vars.rows + (has(vars.lr.value.partitions) ? vars.lr.value.partitions : [])"}
      - title: processResults
        source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:604-607
        call: select-statement.process
        input: {partitions: "= vars.rows", columns: "= input.statement.columns.map(c, c)", limit: "= input.statement.limit"}
        as: rs
      - return: {kind: ROWS, rows: "= vars.rs.value.rows", has_more_pages: false, warnings: []}

  # =========================================================================
  # INSERT / UPDATE / DELETE
  # =========================================================================
  - component: modification-statement
    name: authorize
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:247-269
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - title: MODIFY on the table
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:249
        call: client-state.ensure-table-permission
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table", permission: MODIFY}
      - when: "size(input.statement.conditions) > 0 || input.statement.if_not_exists || input.statement.if_exists || input.statement.has_views"
        title: SELECT too, for conditional updates (they can read) or tables with views
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:252-264
        call: client-state.ensure-table-permission
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table", permission: SELECT}
      - return: {authorized: true}

  - component: modification-statement
    name: validate
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:271-283
    request: CqlRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - set:
          vars.hc: "= size(input.statement.conditions) > 0 || input.statement.if_not_exists || input.statement.if_exists"
          vars.ts: "= input.statement.using_timestamp > 0"
          vars.counter: "= input.statement.table_kind == 'counter'"
          vars.virtual: "= input.statement.table_kind == 'virtual'"
      - if: "vars.hc && vars.ts"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:273", fail: {code: invalid, status: 8704, message: Cannot provide custom timestamp for conditional updates}}]
      - if: "vars.counter && vars.ts"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:274", fail: {code: invalid, status: 8704, message: Cannot provide custom timestamp for counter updates}}]
      - if: "vars.counter && input.statement.using_ttl > 0"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:275", fail: {code: invalid, status: 8704, message: Cannot provide custom TTL for counter updates}}]
      - if: "input.statement.table_kind == 'view'"
        then:
          - title: Writes to a materialized view are refused
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:276
            fail: {code: invalid, status: 8704, message: Cannot directly modify a materialized view}
      - if: "vars.virtual && vars.ts"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:277", fail: {code: invalid, status: 8704, message: Custom timestamp is not supported by virtual tables}}]
      - if: "vars.virtual && input.statement.using_ttl > 0"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:278", fail: {code: invalid, status: 8704, message: Expiring columns are not supported by virtual tables}}]
      - if: "vars.virtual && vars.hc"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:279", fail: {code: invalid, status: 8704, message: Conditional updates are not supported by virtual tables}}]
      - if: "vars.ts && !config['user-timestamps-enabled'] && !input.client_state.is_super"
        then:
          - title: user_timestamps guardrail
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:281-282
            fail: {code: invalid, status: 8704, message: "Guardrail user_timestamps violated: User provided timestamps (USING TIMESTAMP) is not allowed"}
      - return: {valid: true}

  - component: modification-statement
    name: execute
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:491-503
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - if: "(input.options.consistency in config['write-consistency-levels-disallowed'] || input.options.serial_consistency in config['write-consistency-levels-disallowed']) && !input.client_state.is_super"
        then:
          - title: write_consistency_levels guardrail
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:497-498
            fail: {code: invalid, status: 8704, message: "= 'Guardrail write_consistency_levels violated: Provided values [' + input.options.consistency + '] are not allowed for write consistency levels'"}
      - if: "size(input.statement.conditions) > 0 || input.statement.if_not_exists || input.statement.if_exists"
        then:
          - title: IF conditions, go through Paxos
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:500-501
            call: modification-statement.execute-with-condition
            input: "= input"
            as: cas
          - return: "= vars.cas.value"
      - call: modification-statement.execute-without-condition
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: modification-statement
    name: execute-without-condition
    kind: function
    summary: Validates the consistency level for writes, builds the mutations and hands them to StorageProxy.mutateWithTriggers (never atomically).
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:505-536
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - if: "input.statement.table_kind == 'virtual'"
        then:
          - title: Virtual tables apply in-process
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:508-509
            call: modification-statement.execute-internal-without-condition
            input: "= input"
          - return: {kind: VOID, rows: [], warnings: []}
      - if: "input.statement.table_kind == 'counter'"
        then:
          - title: cl.validateCounterForWrite
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:512-513
            call: consistency-level.validate-counter-for-write
            input: {consistency: "= input.options.consistency", table: "= input.statement.table"}
        else:
          - title: cl.validateForWrite
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:514-515
            call: consistency-level.validate-for-write
            input: {consistency: "= input.options.consistency"}
      - title: Disk-usage and timestamp guardrails
        detail: validateDiskUsage only acts when the replica_disk_usage guardrail is enabled (data_disk_usage_percentage thresholds are -1 by default) and a replica is full; validateTimestamp only when USING TIMESTAMP is set and the maximum/minimum timestamp thresholds (unset by default) are configured.
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:517-518
      - set:
          vars.ts: "= input.options.timestamp > 0 ? input.options.timestamp : now * 1000"
      - title: Build the mutations
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:520-526
        call: modification-statement.get-mutations
        input: {statement: "= input.statement", options: "= input.options", client_state: "= input.client_state", timestamp: "= vars.ts", local: false}
        as: m
      - set:
          ctx.lastMutations: "= vars.m.value.mutations"
      - if: "size(vars.m.value.mutations) > 0"
        then:
          - title: StorageProxy.mutateWithTriggers(mutations, cl, false)
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:527-529
            call: storage-proxy.mutate-with-triggers
            input: {mutations: "= vars.m.value.mutations", consistency: "= input.options.consistency", mutate_atomically: false}
          - set: {ctx.mutateAtomically: false}
      - title: Modifications return null (Void)
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:535
        return: {kind: VOID, rows: [], warnings: []}

  - component: modification-statement
    name: get-mutations
    kind: function
    summary: Builds the partition keys, adds the updates per key and turns them into Mutation, CounterMutation or VirtualMutation.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:739-751
    request: &addUpdatesRequest
      type: object
      properties:
        statement: {$ref: CqlStatement}
        options: {$ref: CqlQueryOptions}
        client_state: {$ref: CqlClientState}
        timestamp: {type: integer}
        local: {type: boolean, default: false}
    response: &mutationsResponse
      type: object
      properties:
        mutations: {type: array, items: {$ref: CqlMutation}}
    errors: *execErrors
    behavior:
      - call: modification-statement.add-updates
        input: "= input"
        as: u
      - title: collector.toMutations
        detail: SingleTableUpdatesCollector wraps counter tables in CounterMutation (with the statement's CL) and virtual tables in VirtualMutation; Mutation.validateSize (write-path) can still refuse an oversized mutation.
        source: src/java/org/apache/cassandra/cql3/statements/SingleTableUpdatesCollector.java:97-117
        return: {mutations: "= vars.u.value.mutations"}

  - component: modification-statement
    name: add-updates
    kind: function
    summary: Validates the keys, performs the read-before-write some list operations need, and adds one partition update per key.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:753-821
    request: *addUpdatesRequest
    response: *mutationsResponse
    errors: *execErrors
    behavior:
      - foreach: "= input.statement.partition_keys"
        as: k
        steps:
          - if: "vars.k.partition_key == ''"
            then:
              - title: Empty partition key
                detail: buildPartitionKeyNames runs QueryProcessor.validateKey on every key.
                source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:369-377
                fail: {code: invalid, status: 8704, message: Key may not be empty}
      - if: "input.statement.requires_read"
        then:
          - title: Read-before-write must be a valid read consistency
            detail: Setting or deleting a list element by index or deleting by value needs the current list.
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:430-437
            call: consistency-level.validate-for-read
            input: {consistency: "= input.options.consistency"}
            on_error:
              - fail: {code: invalid, status: 8704, message: "= 'Write operation require a read but consistency ' + input.options.consistency + ' is not supported on reads'"}
          - if: "input.local"
            then:
              - title: Local read of the lists
                source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:450-458
                call: read-command.execute-locally
                input:
                  read_command: {kind: single_partition, keyspace: "= input.statement.keyspace", table: "= input.statement.table", partition_key: "= input.statement.partition_keys[0].partition_key", token: "= input.statement.partition_keys[0].token", columns: "= input.statement.columns.map(c, c)", limit: 100, digest: false}
            else:
              - foreach: "= input.statement.partition_keys"
                as: rk
                steps:
                  - title: Distributed read of the lists at the write's consistency level
                    detail: One read per key; the code reads them as one SinglePartitionReadCommand.Group.
                    source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:460-463
                    call: storage-proxy.read
                    input:
                      read_command: {kind: single_partition, keyspace: "= input.statement.keyspace", table: "= input.statement.table", partition_key: "= vars.rk.partition_key", token: "= vars.rk.token", columns: "= input.statement.columns.map(c, c)", limit: 100, digest: false}
                      consistency: "= input.options.consistency"
          - set: {ctx.readBeforeWrite: true}
      - set:
          vars.target: "= input.statement.type == 'DELETE' ? 'delete-statement' : 'update-statement'"
          vars.ts: "= input.statement.using_timestamp > 0 ? input.statement.using_timestamp : input.timestamp"
          vars.mutations: []
      - foreach: "= input.statement.partition_keys"
        as: k
        steps:
          - title: addUpdateForKey for each partition key
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:798-819
            call: "= vars.target + '.add-update-for-key'"
            targets: [update-statement.add-update-for-key, delete-statement.add-update-for-key]
            input: {statement: "= input.statement", partition_key: "= vars.k.partition_key", token: "= vars.k.token", timestamp: "= vars.ts"}
            as: upd
          - set: {vars.mutations: "= vars.mutations + [vars.upd.value]"}
      - return: {mutations: "= vars.mutations"}

  - component: update-statement
    name: add-update-for-key
    kind: function
    summary: Adds the row (with primary key liveness on INSERT only, CASSANDRA-6782) and the static row to the partition update.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UpdateStatement.java:64-106
    request: &addUpdateForKeyRequest
      type: object
      properties:
        statement: {$ref: CqlStatement}
        partition_key: {type: string}
        token: {type: integer}
        timestamp: {type: integer}
    response: CqlMutation
    behavior:
      - title: Row liveness only for INSERT
        source: src/java/org/apache/cassandra/cql3/statements/UpdateStatement.java:72-73
        return:
          keyspace: "= input.statement.keyspace"
          table: "= input.statement.table"
          partition_key: "= input.partition_key"
          token: "= input.token"
          timestamp: "= input.timestamp"
          columns: "= input.statement.columns"
          ttl: "= input.statement.using_ttl"
          deletion: none
          counter: "= input.statement.table_kind == 'counter'"
          primary_key_liveness: "= input.statement.type == 'INSERT'"

  - component: delete-statement
    name: add-update-for-key
    kind: function
    summary: Partition deletion, row deletion, range tombstone, or deletion of named columns.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DeleteStatement.java:59-112
    request: *addUpdateForKeyRequest
    response: CqlMutation
    errors: [{code: invalid, status: 8704}]
    behavior:
      - if: "size(input.statement.columns) > 0 && input.statement.clustering == '' && input.statement.table_has_clustering"
        then:
          - title: Column deletion over a whole partition of rows
            source: src/java/org/apache/cassandra/cql3/statements/DeleteStatement.java:94-95
            fail: {code: invalid, status: 8704, message: Range deletions are not supported for specific columns}
      - set:
          vars.kind: "= size(input.statement.columns) > 0 ? 'columns' : (input.statement.clustering == '' ? 'partition' : 'row')"
      - title: Choose the tombstone
        source: src/java/org/apache/cassandra/cql3/statements/DeleteStatement.java:67-86
        return:
          keyspace: "= input.statement.keyspace"
          table: "= input.statement.table"
          partition_key: "= input.partition_key"
          token: "= input.token"
          timestamp: "= input.timestamp"
          columns: "= input.statement.columns"
          ttl: 0
          deletion: "= vars.kind"
          partition_deletion: "= vars.kind != 'columns'"
          cells: "= vars.kind == 'columns' ? input.statement.columns.map(c, {'column': c, 'value': null, 'timestamp': input.timestamp, 'deleted': true}) : []"
          counter: "= input.statement.table_kind == 'counter'"
          primary_key_liveness: false

  - component: modification-statement
    name: execute-with-condition
    kind: function
    summary: Builds a CQL3CasRequest and runs StorageProxy.cas with the serial consistency for Paxos and the regular one for the commit.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:538-554
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:556-579
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - if: "size(input.statement.partition_keys) > 1"
        then:
          - title: IN on the partition key with IF
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:561-563
            fail: {code: invalid, status: 8704, message: "= 'IN on the partition key is not supported with conditional ' + (input.statement.type == 'DELETE' ? 'deletions' : 'updates')"}
      - title: StorageProxy.cas(keyspace, table, key, request, serialCL, CL)
        detail: The update's timestamp comes from the Paxos ballot in CQL3CasRequest.makeUpdates, which is why USING TIMESTAMP is refused for conditional updates.
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:542-550
        call: storage-proxy.cas
        input:
          keyspace: "= input.statement.keyspace"
          table: "= input.statement.table"
          partition_key: "= input.statement.partition_keys[0].partition_key"
          token: "= input.statement.partition_keys[0].token"
          conditions: "= input.statement.conditions"
          if_not_exists: "= input.statement.if_not_exists"
          if_exists: "= input.statement.if_exists"
          columns: "= input.statement.columns"
          consistency: "= input.options.serial_consistency"
          commit_consistency: "= input.options.consistency"
        as: cas
      - set: {ctx.casApplied: "= vars.cas.value.applied"}
      - title: buildCasResultSet
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:600-603
        call: modification-statement.build-cas-result-set
        input:
          applied: "= vars.cas.value.applied"
          partitions: "= has(vars.cas.value.rows) ? vars.cas.value.rows : []"
          columns_with_conditions: "= input.statement.if_not_exists || input.statement.if_exists ? [] : input.statement.conditions.map(c, c)"
          wildcard: "= input.statement.if_not_exists || input.statement.if_exists"
          is_batch: false
        as: rs
      - return: {kind: ROWS, applied: "= vars.cas.value.applied", rows: "= vars.rs.value.rows", warnings: []}

  - component: modification-statement
    name: execute-locally
    kind: function
    summary: NODE_LOCAL / internal execution. Applies mutations on this node, or runs a local, non-Paxos CAS.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:679-684
    request: CqlRequest
    response: CqlResultMessage
    behavior:
      - if: "size(input.statement.conditions) > 0 || input.statement.if_not_exists || input.statement.if_exists"
        then:
          - title: casInternal, read and compare locally
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:706-727
            call: read-command.execute-locally
            input:
              read_command: {kind: single_partition, keyspace: "= input.statement.keyspace", table: "= input.statement.table", partition_key: "= input.statement.partition_keys[0].partition_key", token: "= input.statement.partition_keys[0].token", columns: "= input.statement.conditions.map(c, c)", limit: 1, digest: false}
            as: cur
          - set:
              vars.parts: "= has(vars.cur.value.partitions) ? vars.cur.value.partitions : []"
          - title: The current row from the local read
            call: select-statement.process
            input: {partitions: "= vars.parts", columns: [], limit: 1}
            as: currow
          - title: Evaluate the conditions on the local row
            call: cql3-cas-request.applies-to
            input: {row_exists: "= size(vars.currow.value.rows) > 0", current: "= size(vars.currow.value.rows) > 0 ? vars.currow.value.rows[0] : {}", conditions: "= input.statement.conditions", if_not_exists: "= input.statement.if_not_exists", if_exists: "= input.statement.if_exists"}
            as: ok
          - if: "!vars.ok.value.applies"
            then:
              - call: modification-statement.build-cas-result-set
                input: {applied: false, partitions: "= vars.parts", columns_with_conditions: "= input.statement.conditions.map(c, c)", wildcard: "= input.statement.if_not_exists || input.statement.if_exists", is_batch: false}
                as: rs
              - return: {kind: ROWS, applied: false, rows: "= vars.rs.value.rows", warnings: []}
          - call: mutation.apply
            input:
              mutation: {keyspace: "= input.statement.keyspace", table: "= input.statement.table", partition_key: "= input.statement.partition_keys[0].partition_key", token: "= input.statement.partition_keys[0].token", timestamp: "= now * 1000", columns: "= input.statement.columns"}
          - return: {kind: ROWS, applied: true, rows: [{"[applied]": true}], warnings: []}
      - call: modification-statement.execute-internal-without-condition
        input: "= input"
      - return: {kind: VOID, rows: [], warnings: []}

  - component: modification-statement
    name: execute-internal-without-condition
    kind: function
    summary: Builds the mutations with local reads and applies each one on this node (Mutation.apply).
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:686-694
    request: CqlRequest
    behavior:
      - call: modification-statement.get-mutations
        input: {statement: "= input.statement", options: "= input.options", client_state: "= input.client_state", timestamp: "= input.options.timestamp > 0 ? input.options.timestamp : now * 1000", local: true}
        as: m
      - foreach: "= vars.m.value.mutations"
        as: mu
        steps:
          - title: mutation.apply()
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:691-692
            call: mutation.apply
            input: {mutation: "= vars.mu"}
      - set: {ctx.locallyApplied: "= size(vars.m.value.mutations)"}
      - return: {applied: "= size(vars.m.value.mutations)"}

  - component: modification-statement
    name: build-cas-result-set
    kind: function
    summary: "The CAS result: one [applied] boolean column, followed on failure by the current values of the condition columns (every column for IF [NOT] EXISTS)."
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:605-619
      - src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:645-677
    request:
      type: object
      properties:
        applied: {type: boolean, default: true}
        partitions: {type: array, items: {type: object}, default: []}
        columns_with_conditions: {type: array, items: {type: string}, default: []}
        wildcard: {type: boolean, default: false}
        is_batch: {type: boolean, default: false}
    response: {type: object, properties: {rows: {type: array, items: {type: object}}}}
    behavior:
      - if: "input.applied"
        then:
          - title: Success, the single [applied] = true column
            source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:613-619
            return: {rows: [{"[applied]": true}]}
      - set: {vars.row: {"[applied]": false}}
      - title: Failure, append the current values of the condition columns
        detail: Paxos hands back the partition it read (raw cells); Selection.forColumns (or wildcard) picks the condition columns, merged after the [applied] column. An empty partition leaves only [applied] = false.
        source: src/java/org/apache/cassandra/cql3/statements/ModificationStatement.java:650-676
        foreach: "= size(input.partitions) > 0 ? [input.partitions[0]] : []"
        as: p
        steps:
          - if: "has(vars.p.cells)"
            then:
              - foreach: "= vars.p.cells"
                as: c
                steps:
                  - when: "!(has(vars.c.deleted) && vars.c.deleted) && (input.wildcard || vars.c.column in input.columns_with_conditions)"
                    set: {vars.row: "= merge(vars.row, {vars.c.column: vars.c.value})"}
            else:
              - set: {vars.row: "= merge(omit(vars.p, '[applied]'), vars.row)"}
      - return: {rows: ["= vars.row"]}

  - component: select-statement
    name: process
    kind: function
    summary: Turns the partitions a read returns into CQL rows of the selected columns, then trims to the user limit.
    description: The coordinator hands back partitions of cells; each live cell of a selected column becomes a column of the row. Rows that already are column maps pass through. The partition key column is not added, since the model does not carry key column names.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:994-1021
      - src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:1089-1150
    request:
      type: object
      properties:
        partitions: {type: array, items: {type: object}, default: []}
        columns: {type: array, items: {type: string}, default: []}
        limit: {type: integer, default: 0}
    response: {type: object, properties: {rows: {type: array, items: {type: object}}}}
    behavior:
      - set: {vars.rows: []}
      - foreach: "= input.partitions"
        as: p
        steps:
          - if: "!has(vars.p.cells)"
            then:
              - set: {vars.rows: "= vars.rows + [vars.p]"}
              - continue: true
          - set: {vars.row: {}}
          - title: processPartition, one value per selected column
            source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:1127-1150
            foreach: "= vars.p.cells"
            as: c
            steps:
              - when: "!(has(vars.c.deleted) && vars.c.deleted) && (size(input.columns) == 0 || vars.c.column in input.columns)"
                set: {vars.row: "= merge(vars.row, {vars.c.column: vars.c.value})"}
          - when: "size(vars.row) > 0"
            set: {vars.rows: "= vars.rows + [vars.row]"}
      - title: cqlRows.trim(userLimit)
        source: src/java/org/apache/cassandra/cql3/statements/SelectStatement.java:1019
        return: {rows: "= input.limit > 0 && size(vars.rows) > input.limit ? vars.rows.slice(0, input.limit) : vars.rows"}

  - component: cql3-cas-request
    name: applies-to
    kind: function
    summary: CASRequest.appliesTo. IF NOT EXISTS needs no row, IF EXISTS needs a row, column conditions must all hold on the row.
    description: >-
      Paxos calls this with the partition it read at the Paxos consistency level. The model
      compares conditions by equality only; ColumnCondition also supports <, <=, IN, CONTAINS and
      collection element conditions.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/CQL3CasRequest.java:215-225
    request:
      type: object
      properties:
        row_exists: {type: boolean, default: false}
        current: {type: object, default: {}}
        conditions: {type: object, default: {}}
        if_not_exists: {type: boolean, default: true}
        if_exists: {type: boolean, default: false}
    response: {type: object, properties: {applies: {type: boolean}}}
    behavior:
      - if: "input.if_not_exists"
        then:
          - title: NotExistCondition
            source: src/java/org/apache/cassandra/cql3/statements/CQL3CasRequest.java:356-359
            return: {applies: "= !input.row_exists"}
      - if: "input.if_exists"
        then:
          - title: ExistCondition
            source: src/java/org/apache/cassandra/cql3/statements/CQL3CasRequest.java:369-372
            return: {applies: "= input.row_exists"}
      - title: ColumnsConditions, every bound condition must apply to the row
        source: src/java/org/apache/cassandra/cql3/statements/CQL3CasRequest.java:393-403
        return: {applies: "= input.row_exists && input.conditions.all(c, c in input.current && input.current[c] == input.conditions[c])"}

  # =========================================================================
  # BATCH
  # =========================================================================
  - component: batch-statement
    name: authorize
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:167-171
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - foreach: "= input.statement.statements"
        as: s
        steps:
          - call: modification-statement.authorize
            input: {statement: "= vars.s", client_state: "= input.client_state"}
            fill: true
      - return: {authorized: true}

  - component: batch-statement
    name: validate
    kind: function
    summary: validate(ClientState). Validates every statement of the batch.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:258-262
    request: CqlRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - foreach: "= input.statement.statements"
        as: s
        steps:
          - call: modification-statement.validate
            input: {statement: "= vars.s", client_state: "= input.client_state"}
            fill: true
      - return: {valid: true}

  - component: batch-statement
    name: validate-batch
    kind: function
    summary: validate(). Batch-wide rules on TTL, timestamps, counters, virtual tables and conditional batches.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:174-245
    request: CqlRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - set:
          vars.st: "= input.statement.statements"
          vars.tsSet: "= input.statement.using_timestamp > 0"
      - set:
          vars.hasConditions: "= vars.st.exists(s, (has(s.conditions) && size(s.conditions) > 0) || (has(s.if_not_exists) && s.if_not_exists) || (has(s.if_exists) && s.if_exists))"
          vars.hasCounters: "= vars.st.exists(s, has(s.table_kind) && s.table_kind == 'counter')"
          vars.hasNonCounters: "= vars.st.exists(s, !has(s.table_kind) || s.table_kind != 'counter')"
          vars.hasVirtual: "= vars.st.exists(s, has(s.table_kind) && s.table_kind == 'virtual')"
          vars.hasRegular: "= vars.st.exists(s, !has(s.table_kind) || s.table_kind != 'virtual')"
          vars.stmtTs: "= vars.st.exists(s, has(s.using_timestamp) && s.using_timestamp > 0)"
      - if: "input.statement.using_ttl > 0"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:176-177", fail: {code: invalid, status: 8704, message: Global TTL on the BATCH statement is not supported.}}]
      - if: "vars.tsSet && vars.hasConditions"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:182-183", fail: {code: invalid, status: 8704, message: Cannot provide custom timestamp for conditional BATCH}}]
      - if: "vars.tsSet && input.statement.batch_type == 'COUNTER'"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:185-186", fail: {code: invalid, status: 8704, message: Cannot provide custom timestamp for counter BATCH}}]
      - if: "vars.tsSet && vars.stmtTs"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:197-198", fail: {code: invalid, status: 8704, message: Timestamp must be set either on BATCH or individual statements}}]
      - if: "vars.tsSet && vars.hasCounters"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:211-212", fail: {code: invalid, status: 8704, message: Cannot provide custom timestamp for a BATCH containing counters}}]
      - if: "input.statement.batch_type == 'COUNTER' && vars.hasNonCounters"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:214-215", fail: {code: invalid, status: 8704, message: Cannot include non-counter statement in a counter batch}}]
      - if: "vars.hasCounters && vars.hasNonCounters"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:217-218", fail: {code: invalid, status: 8704, message: Counter and non-counter mutations cannot exist in the same batch}}]
      - if: "input.statement.batch_type == 'LOGGED' && vars.hasCounters"
        then:
          - title: Counters cannot go through the batchlog
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:220-221
            fail: {code: invalid, status: 8704, message: Cannot include a counter statement in a logged batch}
      - if: "input.statement.batch_type == 'LOGGED' && vars.hasVirtual"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:223-224", fail: {code: invalid, status: 8704, message: Cannot include a virtual table statement in a logged batch}}]
      - if: "vars.hasVirtual && vars.hasRegular"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:226-227", fail: {code: invalid, status: 8704, message: Mutations for virtual and regular tables cannot exist in the same batch}}]
      - if: "vars.hasConditions && vars.hasVirtual"
        then: [{source: "src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:229-230", fail: {code: invalid, status: 8704, message: Conditional BATCH statements cannot include mutations for virtual tables}}]
      - if: "vars.hasConditions && size(vars.st) > 0 && vars.st.exists(s, s.keyspace != vars.st[0].keyspace || s.table != vars.st[0].table)"
        then:
          - title: Conditional batch on one table only
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:232-243
            fail: {code: invalid, status: 8704, message: Batch with conditions cannot span multiple tables}
      - return: {valid: true}

  - component: batch-statement
    name: execute
    kind: function
    summary: Runs the batch. Conditional batches become one CAS; others become one mutateWithTriggers call.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:400-432
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - if: "(input.options.consistency in config['write-consistency-levels-disallowed'] || input.options.serial_consistency in config['write-consistency-levels-disallowed']) && !input.client_state.is_super"
        then:
          - title: write_consistency_levels guardrail
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:416-417
            fail: {code: invalid, status: 8704, message: "= 'Guardrail write_consistency_levels violated: Provided values [' + input.options.consistency + '] are not allowed for write consistency levels'"}
      - title: Per-statement disk usage guardrail (disabled by default)
        source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:419-420
      - set:
          vars.st: "= input.statement.statements"
      - if: "vars.st.exists(s, (has(s.conditions) && size(s.conditions) > 0) || (has(s.if_not_exists) && s.if_not_exists) || (has(s.if_exists) && s.if_exists))"
        then:
          - title: Conditional batch
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:422-423
            call: batch-statement.execute-with-conditions
            input: "= input"
            as: cas
          - return: "= vars.cas.value"
      - if: "vars.st.exists(s, has(s.table_kind) && s.table_kind == 'virtual')"
        then:
          - title: Virtual-table batch applies in-process
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:425-426
            call: batch-statement.execute-locally
            input: "= input"
          - return: {kind: VOID, rows: [], warnings: []}
      - set:
          vars.ts: "= input.statement.using_timestamp > 0 ? input.statement.using_timestamp : (input.options.timestamp > 0 ? input.options.timestamp : now * 1000)"
      - call: batch-statement.get-mutations
        input: {statement: "= input.statement", options: "= input.options", client_state: "= input.client_state", timestamp: "= vars.ts", local: false}
        as: m
      - title: executeWithoutConditions
        source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:428-429
        call: batch-statement.execute-without-conditions
        input: {mutations: "= vars.m.value.mutations", size_bytes: "= vars.m.value.size_bytes", consistency: "= input.options.consistency", batch_type: "= input.statement.batch_type"}
        as: r
      - return: {kind: VOID, rows: [], warnings: "= vars.r.value.warnings"}

  - component: batch-statement
    name: get-mutations
    kind: function
    summary: Adds every statement's updates into one collector. Statements on the same keyspace and partition key share one Mutation, which holds one PartitionUpdate per table.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:270-329
      - src/java/org/apache/cassandra/cql3/statements/BatchUpdatesCollector.java:193-231
    request: *addUpdatesRequest
    response:
      type: object
      properties:
        mutations: {type: array, items: {$ref: CqlMutation}}
        size_bytes: {type: integer}
    errors: *execErrors
    behavior:
      - set: {vars.mutations: [], vars.keys: [], vars.size: 0}
      - foreach: "= input.statement.statements"
        as: s
        steps:
          - title: statement.addUpdates(collector, keys, ...)
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:304-315
            call: modification-statement.add-updates
            input: {statement: "= vars.s", options: "= input.options", client_state: "= input.client_state", timestamp: "= input.timestamp", local: "= input.local"}
            fill: true
            as: u
          - set: {vars.size: "= vars.size + (has(vars.s.size_bytes) ? vars.s.size_bytes : 120)"}
          - foreach: "= vars.u.value.mutations"
            as: mu
            steps:
              - set: {vars.mk: "= vars.mu.keyspace + ':' + vars.mu.partition_key"}
              - if: "!(vars.mk in vars.keys)"
                then:
                  - title: New MutationBuilder for this keyspace and partition key
                    source: src/java/org/apache/cassandra/cql3/statements/BatchUpdatesCollector.java:107-131
                    set:
                      vars.keys: "= vars.keys + [vars.mk]"
                      vars.mutations: "= vars.mutations + [merge(vars.mu, {'updates': []})]"
                else:
                  - if: "vars.mutations.exists(m, m.keyspace + ':' + m.partition_key == vars.mk && (m.table == vars.mu.table || m.updates.exists(p, p.table == vars.mu.table)))"
                    then:
                      - title: Same table and partition, merge into the table's PartitionUpdate builder
                        source: src/java/org/apache/cassandra/cql3/statements/BatchUpdatesCollector.java:93-105
                        set:
                          vars.mutations: "= vars.mutations.map(m, m.keyspace + ':' + m.partition_key != vars.mk ? m : merge(m.table == vars.mu.table ? merge(m, {'columns': merge(m.columns, vars.mu.columns)}) : m, {'updates': m.updates.map(p, p.table == vars.mu.table ? merge(p, {'columns': merge(p.columns, vars.mu.columns)}) : p)}))"
                    else:
                      - title: Another table, same partition - a second PartitionUpdate in the same Mutation (modifications keyed by TableId)
                        source: src/java/org/apache/cassandra/cql3/statements/BatchUpdatesCollector.java:207-216
                        set:
                          vars.mutations: "= vars.mutations.map(m, m.keyspace + ':' + m.partition_key == vars.mk ? merge(m, {'updates': (size(m.updates) == 0 ? [omit(m, 'updates', 'keyspace', 'partition_key', 'token')] : m.updates) + [omit(vars.mu, 'keyspace', 'partition_key', 'token')]}) : m)"
      - title: One mutation per keyspace and partition key
        detail: BatchUpdatesCollector (or SingleTableUpdatesCollector for one table) keeps one Mutation per keyspace and key, with one PartitionUpdate per table. Once a second table joins, `updates` is the complete list and the top-level table, columns and cells mirror its first entry (write-path's WritePathMutation contract); a single-table mutation keeps `updates` empty. A LOGGED batch on tables with gc_grace_seconds 0 adds a client warning.
        source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:294-328
        set: {ctx.batchPartitions: "= size(vars.mutations)"}
      - return: {mutations: "= vars.mutations", size_bytes: "= vars.size"}

  - component: batch-statement
    name: execute-without-conditions
    kind: function
    summary: Size and partition-count thresholds, then StorageProxy.mutateWithTriggers, atomic only for LOGGED batches touching more than one partition.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:434-447
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:331-367
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:369-397
    request:
      type: object
      properties:
        mutations: {type: array, items: {$ref: CqlMutation}}
        size_bytes: {type: integer}
        consistency: {type: string}
        batch_type: {type: string}
    response: {type: object, properties: {warnings: {type: array, items: {type: string}}}}
    errors: *execErrors
    behavior:
      - if: "size(input.mutations) == 0"
        then:
          - return: {warnings: []}
      - set: {vars.warnings: []}
      - if: "size(input.mutations) > 1 && input.size_bytes > config['batch-size-warn-threshold-kib'] * 1024"
        then:
          - if: "input.size_bytes > config['batch-size-fail-threshold-kib'] * 1024"
            then:
              - title: Batch over batch_size_fail_threshold
                detail: Only multi-partition batches are checked (CASSANDRA-10876).
                source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:351-358
                set: {ctx.batchRefused: too_large}
              - fail: {code: invalid, status: 8704, message: Batch too large}
          - title: Batch over batch_size_warn_threshold
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:360-365
            set:
              vars.warnings: "= vars.warnings + ['Batch for [' + input.mutations[0].keyspace + '.' + input.mutations[0].table + '] is of size ' + string(input.size_bytes) + ', exceeding specified threshold of ' + string(config['batch-size-warn-threshold-kib'] * 1024) + ' by ' + string(input.size_bytes - config['batch-size-warn-threshold-kib'] * 1024) + '.']"
      - if: "input.batch_type != 'LOGGED' && size(input.mutations) > config['unlogged-batch-across-partitions-warn-threshold']"
        then:
          - title: Unlogged batch across many partitions
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:371-395
            set:
              vars.warnings: "= vars.warnings + ['Unlogged batch covering ' + string(size(input.mutations)) + ' partitions detected against table [' + input.mutations[0].keyspace + '.' + input.mutations[0].table + ']. You should use a logged batch for atomicity, or asynchronous writes for performance.']"
      - set:
          vars.atomic: "= input.batch_type == 'LOGGED' && size(input.mutations) > 1"
      - set: {ctx.mutateAtomically: "= vars.atomic", ctx.clientWarnings: "= vars.warnings"}
      - title: StorageProxy.mutateWithTriggers(mutations, cl, mutateAtomic)
        detail: A LOGGED batch on a single partition is not written to the batchlog; it is already atomic as one mutation.
        source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:443-445
        call: storage-proxy.mutate-with-triggers
        input: {mutations: "= input.mutations", consistency: "= input.consistency", mutate_atomically: "= vars.atomic"}
      - return: {warnings: "= vars.warnings"}

  - component: batch-statement
    name: execute-with-conditions
    kind: function
    summary: A conditional batch must hit one partition of one table; it becomes one CAS.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:460-487
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:489-552
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - set:
          vars.st: "= input.statement.statements"
      - set:
          vars.first: "= vars.st[0].partition_keys[0].partition_key"
          vars.conditional: "= vars.st.filter(s, has(s.conditions) && size(s.conditions) > 0)"
      - foreach: "= vars.st"
        as: s
        steps:
          - if: "size(vars.s.partition_keys) > 1"
            then:
              - title: IN on the partition key in a conditional batch
                detail: Thrown as IllegalArgumentException, not InvalidRequestException, so the client receives a SERVER_ERROR.
                source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:503-504
                fail: {code: server-error, status: 0, message: "Batch with conditions cannot span multiple partitions (you cannot use IN on the partition key)"}
          - if: "vars.s.partition_keys[0].partition_key != vars.first"
            then:
              - title: Conditional batch across partitions
                source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:510-513
                fail: {code: invalid, status: 8704, message: Batch with conditions cannot span multiple partitions}
      - title: StorageProxy.cas for the whole batch
        source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:469-477
        call: storage-proxy.cas
        input:
          keyspace: "= vars.st[0].keyspace"
          table: "= vars.st[0].table"
          partition_key: "= vars.first"
          token: "= vars.st[0].partition_keys[0].token"
          conditions: "= size(vars.conditional) > 0 ? vars.conditional[0].conditions : {}"
          if_not_exists: "= vars.st.exists(s, has(s.if_not_exists) && s.if_not_exists)"
          if_exists: "= vars.st.exists(s, has(s.if_exists) && s.if_exists)"
          columns: "= has(vars.st[0].columns) ? vars.st[0].columns : {}"
          consistency: "= input.options.serial_consistency"
          commit_consistency: "= input.options.consistency"
        as: cas
      - set: {ctx.casApplied: "= vars.cas.value.applied"}
      - title: ModificationStatement.buildCasResultSet with isBatch true
        detail: For batches the primary key columns are added to the condition columns to disambiguate rows; IF [NOT] EXISTS in any statement selects every column.
        source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:478-485
        call: modification-statement.build-cas-result-set
        input:
          applied: "= vars.cas.value.applied"
          partitions: "= has(vars.cas.value.rows) ? vars.cas.value.rows : []"
          columns_with_conditions: "= size(vars.conditional) > 0 ? vars.conditional[0].conditions.map(c, c) : []"
          wildcard: "= vars.st.exists(s, (has(s.if_not_exists) && s.if_not_exists) || (has(s.if_exists) && s.if_exists))"
          is_batch: true
        as: rs
      - return: {kind: ROWS, applied: "= vars.cas.value.applied", rows: "= vars.rs.value.rows", warnings: []}

  - component: batch-statement
    name: execute-locally
    kind: function
    summary: Internal / NODE_LOCAL batch. Applies the batch's mutations on this node without the batchlog.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:559-568
      - src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:570-578
    request: CqlRequest
    response: CqlResultMessage
    behavior:
      - call: batch-statement.get-mutations
        input: {statement: "= input.statement", options: "= input.options", client_state: "= input.client_state", timestamp: "= input.options.timestamp > 0 ? input.options.timestamp : now * 1000", local: true}
        as: m
      - foreach: "= vars.m.value.mutations"
        as: mu
        steps:
          - title: mutation.apply()
            source: src/java/org/apache/cassandra/cql3/statements/BatchStatement.java:575-576
            call: mutation.apply
            input: {mutation: "= vars.mu"}
      - set: {ctx.locallyApplied: "= size(vars.m.value.mutations)"}
      - return: {kind: VOID, rows: [], warnings: []}

  # =========================================================================
  # USE
  # =========================================================================
  - component: use-statement
    name: authorize
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UseStatement.java:51-55
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.validate-login
        input: {}
      - return: {authorized: true}
  - component: use-statement
    name: validate
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UseStatement.java:57-61
    request: CqlRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - if: "!config['use-statements-enabled']"
        then:
          - title: USE disabled
            source: src/java/org/apache/cassandra/cql3/statements/UseStatement.java:59
            fail: {code: invalid, status: 8704, message: USE statements prohibited. (see use_statements_enabled in cassandra.yaml)}
      - return: {valid: true}
  - component: use-statement
    name: execute
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/UseStatement.java:63-68
    request: CqlRequest
    response: CqlResultMessage
    errors: [{code: invalid, status: 8704}]
    behavior:
      - title: ClientState.setKeyspace
        detail: The keyspace must exist when a user is set, which is always the case under AllowAllAuthenticator (ANONYMOUS_USER).
        source: src/java/org/apache/cassandra/cql3/statements/UseStatement.java:66
        call: client-state.set-keyspace
        input: {keyspace: "= input.statement.keyspace"}
      - set: {ctx.keyspaceSet: "= input.statement.keyspace"}
      - return: {kind: SET_KEYSPACE, keyspace: "= input.statement.keyspace", rows: [], warnings: []}

  # =========================================================================
  # TRUNCATE
  # =========================================================================
  - component: truncate-statement
    name: authorize
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:54-57
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.ensure-table-permission
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table", permission: MODIFY}
      - return: {authorized: true}
  - component: truncate-statement
    name: validate
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:59-63
    request: CqlRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: schema.validate-table
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table"}
      - if: "!config['drop-truncate-table-enabled'] && !input.client_state.is_super"
        then:
          - title: drop_truncate_table_enabled guardrail
            source: src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:62
            fail: {code: invalid, status: 8704, message: "Guardrail drop_truncate_table_enabled violated: DROP and TRUNCATE TABLE functionality is not allowed"}
      - return: {valid: true}
  - component: truncate-statement
    name: execute
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:66-88
    request: CqlRequest
    response: CqlResultMessage
    errors: *execErrors
    behavior:
      - if: "input.statement.table_kind == 'view'"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:71-72
            title: Views are truncated through their base table
            fail: {code: invalid, status: 8704, message: Cannot TRUNCATE materialized view directly; must truncate base table instead}
      - if: "input.statement.table_kind == 'virtual'"
        then:
          - title: Virtual table truncate in-process
            source: src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:74-77
            set: {ctx.truncated: virtual}
          - return: {kind: VOID, rows: [], warnings: []}
      - title: StorageProxy.truncateBlocking
        source: src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:80
        call: storage-proxy.truncate-blocking
        input: {keyspace: "= input.statement.keyspace", table: "= input.statement.table"}
        on_error:
          - if: "error.code in ['unavailable', 'timeout-exception', 'timeout']"
            then:
              - title: Unavailable or timed out becomes TruncateException
                source: src/java/org/apache/cassandra/cql3/statements/TruncateStatement.java:83-86
                fail: {code: truncate-error, status: 4099, message: "= 'Error during truncate: ' + error.message"}
          - fail: "= {'code': error.code, 'status': error.status, 'message': error.message}"
      - set: {ctx.truncated: distributed}
      - return: {kind: VOID, rows: [], warnings: []}

  # =========================================================================
  # DESCRIBE
  # =========================================================================
  - component: describe-statement
    name: authorize
    kind: function
    summary: No permission check; DESCRIBE only reads schema metadata.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:113-116
    request: CqlRequest
    behavior:
      - return: {authorized: true}
  - component: describe-statement
    name: validate
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:118-121
    request: CqlRequest
    behavior:
      - return: {valid: true}
  - component: describe-statement
    name: execute
    kind: function
    summary: DESCRIBE is always executed locally, whatever the consistency level.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:129-133
    request: CqlRequest
    response: CqlResultMessage
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: describe-statement.execute-locally
        input: "= input"
        as: r
      - return: "= vars.r.value"
  - component: describe-statement
    name: execute-locally
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:135-181
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:208-236
    request: CqlRequest
    response: CqlResultMessage
    errors: [{code: invalid, status: 8704}]
    behavior:
      - title: Schema.getDistributedSchemaBlocking plus local and virtual keyspaces
        source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:137-143
        call: schema.get-distributed-schema-blocking
        input: {}
        as: sch
      - if: "has(input.options.paging_state.schema_version) && input.options.paging_state.schema_version != vars.sch.value.version"
        then:
          - title: Schema changed between pages
            source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:227-228
            fail: {code: invalid, status: 8704, message: "The schema has changed since the previous page of the DESCRIBE statement result. Please retry the DESCRIBE statement."}
      - set:
          vars.offset: "= has(input.options.paging_state.offset) ? input.options.paging_state.offset : 0"
          vars.impl: "= {'KEYSPACES': 'describe-statement-keyspaces', 'TABLES': 'describe-statement-listing', 'TYPES': 'describe-statement-listing', 'FUNCTIONS': 'describe-statement-listing', 'AGGREGATES': 'describe-statement-listing', 'SCHEMA': 'describe-statement-schema', 'KEYSPACE': 'describe-statement-element', 'TABLE': 'describe-statement-element', 'INDEX': 'describe-statement-element', 'VIEW': 'describe-statement-element', 'TYPE': 'describe-statement-element', 'FUNCTION': 'describe-statement-element', 'AGGREGATE': 'describe-statement-element', 'CLUSTER': 'describe-statement-cluster', 'GENERIC': 'describe-statement-generic'}[input.statement.describe_target]"
      - title: describe(state, keyspaces)
        source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:164
        call: "= vars.impl + '.describe'"
        targets: [describe-statement-keyspaces.describe, describe-statement-listing.describe, describe-statement-schema.describe, describe-statement-element.describe, describe-statement-cluster.describe, describe-statement-generic.describe]
        input: {statement: "= input.statement", client_state: "= input.client_state", keyspaces: "= vars.sch.value.keyspaces"}
        as: d
      - set:
          vars.all: "= vars.d.value.rows"
      - set:
          vars.start: "= vars.offset > size(vars.all) ? size(vars.all) : vars.offset"
      - set:
          vars.end: "= input.options.page_size > 0 && vars.start + input.options.page_size < size(vars.all) ? vars.start + input.options.page_size : size(vars.all)"
      - set:
          vars.rows: "= vars.all.slice(vars.start, vars.end)"
      - title: Page by row offset, paging state carries the schema version
        source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:165-178
        set: {ctx.describeRows: "= size(vars.rows)"}
      - set:
          vars.more: "= input.options.page_size > 0 && size(vars.rows) == input.options.page_size"
      - title: The paging state carries the next offset and the schema version
        source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:177-178
        return: {kind: ROWS, rows: "= vars.rows", has_more_pages: "= vars.more", paging_state: "= vars.more ? {'schema_version': vars.sch.value.version, 'offset': vars.start + input.options.page_size} : {}", warnings: []}

  - component: describe-statement-keyspaces
    name: describe
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:330-333
    request: CqlDescribeRequest
    behavior:
      - return: {rows: "= input.keyspaces.map(k, {'keyspace_name': k.name, 'type': 'keyspace', 'name': k.name})"}

  - component: describe-statement-listing
    name: describe
    kind: function
    summary: Lists element names of the current keyspace, or of every keyspace when none is set.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:266-273
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:247-251
    request: CqlDescribeRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - set:
          vars.ks: "= input.client_state.keyspace"
          vars.field: "= input.statement.describe_target.lowerAscii()"
          vars.type: "= {'TABLES': 'table', 'TYPES': 'type', 'FUNCTIONS': 'function', 'AGGREGATES': 'aggregate'}[input.statement.describe_target]"
          vars.rows: []
      - if: "vars.ks != '' && !input.keyspaces.exists(k, k.name == vars.ks)"
        then:
          - title: Current keyspace not found
            source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:249-250
            fail: {code: invalid, status: 8704, message: "= '\\'' + vars.ks + '\\' not found in keyspaces'"}
      - foreach: "= input.keyspaces"
        as: k
        steps:
          - if: "(vars.ks == '' || vars.k.name == vars.ks) && vars.field in vars.k"
            then:
              - foreach: "= vars.k[vars.field]"
                as: e
                steps:
                  - set: {vars.rows: "= vars.rows + [{'keyspace_name': vars.k.name, 'type': vars.type, 'name': vars.e}]"}
      - return: {rows: "= vars.rows"}

  - component: describe-statement-schema
    name: describe
    kind: function
    summary: Every keyspace (system ones only with FULL) with its CREATE statements.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:359-365
    request: CqlDescribeRequest
    behavior:
      - set: {vars.rows: []}
      - foreach: "= input.keyspaces"
        as: k
        steps:
          - if: "input.statement.describe_full || !(vars.k.name in ['system', 'system_schema', 'system_auth', 'system_distributed', 'system_traces', 'system_views', 'system_virtual_schema'])"
            then:
              - set: {vars.rows: "= vars.rows + [{'keyspace_name': vars.k.name, 'type': 'keyspace', 'name': vars.k.name, 'create_statement': 'CREATE KEYSPACE ' + vars.k.name + ' ...'}] + vars.k.tables.map(t, {'keyspace_name': vars.k.name, 'type': 'table', 'name': t, 'create_statement': 'CREATE TABLE ' + vars.k.name + '.' + t + ' ...'})"}
      - return: {rows: "= vars.rows"}

  - component: describe-statement-element
    name: describe
    kind: function
    summary: One schema element with its CREATE statement; KEYSPACE also lists the keyspace's tables.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:409-416
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:471-489
    request: CqlDescribeRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - set:
          vars.ks: "= input.statement.keyspace != '' ? input.statement.keyspace : input.client_state.keyspace"
      - if: "vars.ks == ''"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:411-412
            title: No keyspace
            fail: {code: invalid, status: 8704, message: No keyspace specified and no current keyspace}
      - if: "!input.keyspaces.exists(k, k.name == vars.ks)"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:249-250
            fail: {code: invalid, status: 8704, message: "= '\\'' + vars.ks + '\\' not found in keyspaces'"}
      - set:
          vars.k: "= input.keyspaces.filter(k, k.name == vars.ks)[0]"
      - if: "input.statement.describe_target == 'KEYSPACE'"
        then:
          - title: getKeyspaceElements
            source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:441-464
            return: {rows: "= [{'keyspace_name': vars.ks, 'type': 'keyspace', 'name': vars.ks, 'create_statement': 'CREATE KEYSPACE ' + vars.ks + ' ...'}] + vars.k.tables.map(t, {'keyspace_name': vars.ks, 'type': 'table', 'name': t, 'create_statement': 'CREATE TABLE ' + vars.ks + '.' + t + ' ...'})"}
      - set:
          vars.field: "= {'TABLE': 'tables', 'INDEX': 'indexes', 'VIEW': 'views', 'TYPE': 'types', 'FUNCTION': 'functions', 'AGGREGATE': 'aggregates'}[input.statement.describe_target]"
          vars.label: "= {'TABLE': 'Table', 'INDEX': 'Index', 'VIEW': 'Materialized view', 'TYPE': 'User defined type', 'FUNCTION': 'User defined function', 'AGGREGATE': 'User defined aggregate'}[input.statement.describe_target]"
      - if: "!(vars.field in vars.k) || !(input.statement.describe_name in vars.k[vars.field])"
        then:
          - title: Element not found
            source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:475-476
            fail: {code: invalid, status: 8704, message: "= vars.label + ' \\'' + input.statement.describe_name + '\\' not found in ' + (input.statement.describe_target == 'TABLE' ? 'keyspace ' : '') + '\\'' + vars.ks + '\\''"}
      - return: {rows: [{keyspace_name: "= vars.ks", type: "= input.statement.describe_target.lowerAscii()", name: "= input.statement.describe_name", create_statement: "= 'CREATE ' + input.statement.describe_target + ' ' + vars.ks + '.' + input.statement.describe_name + ' ...'"}]}

  - component: describe-statement-generic
    name: describe
    kind: function
    summary: Resolves DESCRIBE <name> as a keyspace, then a table, an index, a view, and delegates to that element.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:631-670
    request: CqlDescribeRequest
    errors: [{code: invalid, status: 8704}]
    behavior:
      - set:
          vars.name: "= input.statement.describe_name"
      - if: "input.statement.keyspace == '' && input.keyspaces.exists(k, k.name == vars.name)"
        then:
          - title: The name is a keyspace
            source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:639-640
            call: describe-statement-element.describe
            input: {statement: {type: DESCRIBE, describe_target: KEYSPACE, keyspace: "= vars.name", describe_name: ""}, client_state: "= input.client_state", keyspaces: "= input.keyspaces"}
            fill: true
            as: d
          - return: "= vars.d.value"
      - set:
          vars.ks: "= input.statement.keyspace != '' ? input.statement.keyspace : (input.client_state.keyspace != '' ? input.client_state.keyspace : vars.name)"
      - if: "!input.keyspaces.exists(k, k.name == vars.ks)"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:646
            fail: {code: invalid, status: 8704, message: "= '\\'' + vars.ks + '\\' not found in keyspaces'"}
      - set:
          vars.k: "= input.keyspaces.filter(k, k.name == vars.ks)[0]"
      - set:
          vars.target: "= vars.name in vars.k.tables ? 'TABLE' : ((has(vars.k.indexes) && vars.name in vars.k.indexes) ? 'INDEX' : ((has(vars.k.views) && vars.name in vars.k.views) ? 'VIEW' : ''))"
      - if: "vars.target == ''"
        then:
          - title: Not a table, index or view
            source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:662
            fail: {code: invalid, status: 8704, message: "= '\\'' + vars.name + '\\' not found in keyspace \\'' + vars.ks + '\\''"}
      - title: Delegate to table(), index() or view()
        source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:647-659
        call: describe-statement-element.describe
        input: {statement: {type: DESCRIBE, describe_target: "= vars.target", keyspace: "= vars.ks", describe_name: "= vars.name"}, client_state: "= input.client_state", keyspaces: "= input.keyspaces"}
        fill: true
        as: d
      - return: "= vars.d.value"

  - component: describe-statement-cluster
    name: describe
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:714-736
      - src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:738-741
    request: CqlDescribeRequest
    behavior:
      - set:
          vars.ks: "= input.client_state.keyspace"
      - if: "vars.ks != '' && !(vars.ks in ['system', 'system_schema', 'system_auth', 'system_distributed', 'system_traces', 'system_views', 'system_virtual_schema'])"
        then:
          - title: Range ownership for the current keyspace
            source: src/java/org/apache/cassandra/cql3/statements/DescribeStatement.java:723-733
            call: storage-service.get-range-to-address-map
            input: {keyspace: "= vars.ks"}
            as: ranges
          - set: {ctx.rangeOwnership: true}
          - return: {rows: [{cluster: "= config['cluster-name']", partitioner: "= config['partitioner'].replace('org.apache.cassandra.dht.', '')", snitch: "= config['endpoint-snitch']", range_ownership: "= vars.ranges.value"}]}
      - set: {ctx.rangeOwnership: false}
      - return: {rows: [{cluster: "= config['cluster-name']", partitioner: "= config['partitioner'].replace('org.apache.cassandra.dht.', '')", snitch: "= config['endpoint-snitch']"}]}

  # =========================================================================
  # ADD / DROP IDENTITY
  # =========================================================================
  - component: authentication-statement
    name: execute
    kind: function
    summary: execute(QueryState, ...) delegates to the subclass's execute(ClientState).
    sources:
      - src/java/org/apache/cassandra/cql3/statements/AuthenticationStatement.java:40-44
    request: CqlRequest
    response: CqlResultMessage
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: "= (input.statement.type == 'ADD_IDENTITY' ? 'add-identity-statement' : 'drop-identity-statement') + '.execute'"
        targets: [add-identity-statement.execute, drop-identity-statement.execute]
        input: "= input"
      - return: {kind: VOID, rows: [], warnings: []}
  - component: authentication-statement
    name: check-permission
    kind: function
    summary: ClientState.ensurePermission, with an UnauthorizedException rethrown under a friendlier message.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/AuthenticationStatement.java:55-67
    request: {type: object, properties: {permission: {type: string}, resource: {type: string}, user: {type: string}}}
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.ensure-permission
        input: {permission: "= input.permission", resource: "= input.resource"}
        on_error:
          - title: Friendlier message
            source: src/java/org/apache/cassandra/cql3/statements/AuthenticationStatement.java:61-66
            fail: {code: unauthorized, status: 8448, message: "= 'User ' + input.user + ' does not have sufficient privileges to perform the requested operation'"}
      - return: {authorized: true}

  - component: add-identity-statement
    name: authorize
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:53-60
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: authentication-statement.check-permission
        input: {permission: CREATE, resource: roles, user: "= input.client_state.user"}
      - if: "!input.client_state.is_super"
        then:
          - call: cassandra-role-manager.is-super
            input: {role: "= input.statement.role"}
            as: sup
          - if: "vars.sup.value.is_super"
            then:
              - title: Only superusers bind identities to superuser roles
                source: src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:58-59
                fail: {code: unauthorized, status: 8448, message: Only superusers can bind identities to a role with superuser status}
      - return: {authorized: true}
  - component: add-identity-statement
    name: validate
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:62-73
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}, {code: invalid, status: 8704}]
    behavior:
      - if: "input.client_state.is_anonymous"
        then:
          - title: state.ensureNotAnonymous()
            detail: Under the deployed AllowAllAuthenticator every connection is ANONYMOUS_USER, so ADD IDENTITY always stops here.
            source: src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:64
            fail: {code: unauthorized, status: 8448, message: You have to be logged in and not anonymous to perform this request}
      - call: cassandra-role-manager.is-existing-role
        input: {role: "= input.statement.role"}
        as: role
      - if: "!vars.role.value.exists"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:66-69
            fail: {code: invalid, status: 8704, message: "= 'Can not add identity for non-existent role \\'' + input.statement.role + '\\''"}
      - if: "!input.statement.if_not_exists"
        then:
          - call: cassandra-role-manager.is-existing-identity
            input: {identity: "= input.statement.identity"}
            as: idn
          - if: "vars.idn.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:71-72
                fail: {code: invalid, status: 8704, message: "= input.statement.identity + ' already exists'"}
      - return: {valid: true}
  - component: add-identity-statement
    name: execute
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:82-89
    request: CqlRequest
    behavior:
      - call: cassandra-role-manager.is-existing-identity
        input: {identity: "= input.statement.identity"}
        as: idn
        when: "input.statement.if_not_exists"
      - if: "!input.statement.if_not_exists || !vars.idn.value.exists"
        then:
          - title: IRoleManager.addIdentity
            source: src/java/org/apache/cassandra/cql3/statements/AddIdentityStatement.java:84-87
            call: cassandra-role-manager.add-identity
            input: {identity: "= input.statement.identity", role: "= input.statement.role"}
          - set: {ctx.identityAdded: true}
      - return: {}

  - component: drop-identity-statement
    name: authorize
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:50-74
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: cassandra-role-manager.role-for-identity
        input: {identity: "= input.statement.identity"}
        as: rfi
      - if: "!has(vars.rfi.value.role) || vars.rfi.value.role == null || vars.rfi.value.role == ''"
        then:
          - title: Unbound identity, DROP on all roles
            source: src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:54-57
            call: authentication-statement.check-permission
            input: {permission: DROP, resource: roles, user: "= input.client_state.user"}
          - return: {authorized: true}
      - title: DROP on the bound role
        source: src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:61-63
        call: authentication-statement.check-permission
        input: {permission: DROP, resource: "= 'roles/' + vars.rfi.value.role", user: "= input.client_state.user"}
      - if: "!input.client_state.is_super"
        then:
          - call: roles.has-superuser-status
            input: {role: "= vars.rfi.value.role"}
            as: su
          - if: "vars.su.value.is_super"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:64-70
                fail: {code: unauthorized, status: 8448, message: Only superusers can remove identity bindings from a role with superuser status}
      - return: {authorized: true}
  - component: drop-identity-statement
    name: validate
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:76-85
    request: CqlRequest
    errors: [{code: unauthorized, status: 8448}, {code: invalid, status: 8704}]
    behavior:
      - if: "input.client_state.is_anonymous"
        then:
          - title: state.ensureNotAnonymous()
            source: src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:78
            fail: {code: unauthorized, status: 8448, message: You have to be logged in and not anonymous to perform this request}
      - if: "!input.statement.if_exists"
        then:
          - call: cassandra-role-manager.is-existing-identity
            input: {identity: "= input.statement.identity"}
            as: idn
          - if: "!vars.idn.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:80-83
                fail: {code: invalid, status: 8704, message: "= 'identity \\'' + input.statement.identity + '\\' doesn\\'t exist'"}
      - return: {valid: true}
  - component: drop-identity-statement
    name: execute
    kind: function
    sources:
      - src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:93-101
    request: CqlRequest
    behavior:
      - call: cassandra-role-manager.is-existing-identity
        input: {identity: "= input.statement.identity"}
        as: idn
        when: "input.statement.if_exists"
      - if: "!input.statement.if_exists || vars.idn.value.exists"
        then:
          - title: IRoleManager.dropIdentity
            source: src/java/org/apache/cassandra/cql3/statements/DropIdentityStatement.java:96-99
            call: cassandra-role-manager.drop-identity
            input: {identity: "= input.statement.identity"}
          - set: {ctx.identityDropped: true}
      - return: {}

