    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-with-triggers' && e.input.mutate_atomically == true)"
      - "steps.b.result.ok"
      - "steps.r.result.ok && steps.r.result.value.rows.exists(row, has(row.name) && row.name == 'Ada')"
  - id: cql-batch-two-tables-same-partition-then-read
    fixtures: [three-node-rf3]
    name: LOGGED batch writing shop.users and shop.orders under one key, then SELECT reads each table back
    steps:
      - flow: cql-batch
        as: b
        input:
          statement:
            statements:
              - {type: INSERT, keyspace: shop, table: users, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], columns: {name: a}}
              - {type: INSERT, keyspace: shop, table: orders, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], columns: {total: 5}}
      - {flow: cql-select, as: o, input: {statement: {table: orders, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], columns: {total: null}}}}
      - {flow: cql-select, as: u, input: {statement: {table: users, partition_keys: [{partition_key: "k1", token: -4069959284402364209}], columns: {name: null, total: null}}}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-with-triggers' && e.input.mutate_atomically == false)"
      - "steps.b.result.ok"
      - "steps.o.result.ok && steps.o.result.value.rows.exists(row, has(row.total) && row.total == 5)"
      - "steps.u.result.ok && steps.u.result.value.rows.exists(row, has(row.name) && row.name == 'a')"
      - "!steps.u.result.value.rows.exists(row, has(row.total) && row.total != null)"
