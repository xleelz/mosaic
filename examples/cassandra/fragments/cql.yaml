      - {flow: cql-truncate, as: t}
      - {flow: cql-select, as: r, input: {statement: {table: orders, partition_keys: [{partition_key: "order:9001", token: 1622840367226573521}], columns: {total: null}}}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'storage-proxy.mutate-with-triggers' && e.instance == 'n1')"
      - "steps.w.result.ok && steps.t.result.ok"
      - "steps.r.result.ok && size(steps.r.result.value.rows) == 0"
