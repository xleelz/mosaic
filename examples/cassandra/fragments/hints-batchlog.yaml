# hints-batchlog fragment of the Cassandra 5.0.9 ontology (built from code).
# Owns hints/**, batchlog/**, service/BatchlogResponseHandler.java,
# StorageProxy.mutateAtomically and its batchlog helpers, and StorageProxy.submitHint.
# Instances: every component runs per node (cassandra-node group n1..n3 from the
# shared fixtures); endpoints are instance names and per-node state is keyed
# <component>@<instance>. Times are epoch ms on the one clock (now).
schema_version: 1
id: cassandra

schemas:
  - id: HintsBatchlogBatch
    summary: "batchlog.Batch: a logged batch as stored in the batchlog (id, creation time in micros, the mutations)."
    schema:
      type: object
      required: [id, creation_time, mutations]
      properties:
        id: {type: string, description: "TimeUUID of the batch (nextTimeUUID on the coordinator).", examples: ["0f6a6c40-9d5e-11ef-8000-000000000001"]}
        creation_time: {type: integer, description: "FBUtilities.timestampMicros() at batch creation (now * 1000).", examples: [1793318400000000]}
        gc_grace_seconds: {type: integer, description: "Smallest gc_grace_seconds of the batch's tables (Mutation.smallestGCGS), used by replay expiry.", examples: [864000]}
        mutations:
          type: array
          minItems: 1
          maxItems: 2
          items: &mutation
            type: object
            required: [keyspace, table, partition_key, token, timestamp, columns]
            properties:
              keyspace: {type: string, examples: [shop]}
              table: {type: string, examples: [orders]}
              partition_key: {type: string, examples: ["user:42"]}
              token: {type: integer, examples: [-4069959284402364209]}
              timestamp: {type: integer, examples: [1793350800000000]}
              columns: {type: object, examples: [{status: placed, total_cents: 4200}]}
  - id: HintsBatchlogBatchRow
    summary: "A row of a node's system.batches (id timeuuid, mutations list<blob>, version int), keyed by id."
    schema:
      type: object
      required: [id, written_at_ms, version, mutations]
      properties:
        id: {type: string, examples: ["0f6a6c40-9d5e-11ef-8000-000000000001"]}
        written_at_ms: {type: integer, description: "id.unix(MILLISECONDS): the batch's TimeUUID time.", examples: [1793318390000]}
        version: {type: integer, description: "MessagingService.current_version: 12 (VERSION_40) under the deployed storage_compatibility_mode CASSANDRA_4.", examples: [12]}
        gc_grace_seconds: {type: integer, examples: [864000]}
        mutations: {type: array, items: *mutation}
  - id: HintsBatchlogHint
    summary: "hints.Hint: a mutation, its creation time (ms) and the smallest gc_grace_seconds of its tables (the hint TTL)."
    schema:
      type: object
      required: [mutation, creation_time, gcgs]
      properties:
        mutation: *mutation
        creation_time: {type: integer, examples: [0]}
        gcgs: {type: integer, examples: [864000]}
  - id: HintsBatchlogHintRow
    summary: "One hint held for a target host: in the HintsBuffer (stage buffered), in the open HintsWriter file (writing) or in a closed file on the dispatch queue (file)."
    schema:
      type: object
      required: [key, host_id, stage, hint]
      properties:
        key: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002:order:1:1793318400000000"]}
        host_id: {type: string, description: "Host ID of the hint's target.", examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
        stage: {type: string, enum: [buffered, writing, file]}
        creation_time: {type: integer, examples: [0]}
        size_bytes: {type: integer, examples: [512]}
        hint: {$ref: HintsBatchlogHint}
  - id: HintsBatchlogHintMessage
    summary: "hints.HintMessage (HINT_REQ payload): the target host id and the hint; hint is null and unknown_table_id set when the receiver can't decode a dropped table."
    schema:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
        hint: {$ref: HintsBatchlogHint}
        unknown_table_id: {type: string, examples: ["5a1c395e-b41f-11e5-9f22-ba0be0483c18"]}

components:
  # ------------------------------------------------------------ batchlog
  - id: batchlog-manager
    name: BatchlogManager
    kind: module
    parent: hints-batchlog
    layer: durability
    summary: "Stores and removes batchlog rows in system.batches and replays failed batches every 10 s (after RING_DELAY) on the single-threaded BatchlogTasks executor."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:87-118
      - conf/cassandra.yaml:157
    state:
      initial:
        batches: {}
        total_batches_replayed: 0
        last_replayed_ms: 0
        replay_throttle_kib_per_endpoint: 0
  - id: batchlog-manager-rate-limiter
    name: BatchlogManager.rateLimiter
    kind: module
    parent: batchlog-manager
    layer: durability
    summary: "The replay's Guava RateLimiter (SmoothBursty, 1 s burst), created at Double.MAX_VALUE bytes/s. acquire(n) waits only for the debt of earlier acquires; its own bytes push back the next caller."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:102]
    state:
      initial:
        bytes_per_sec: 0
        stored: 0.0
        next_free_us: 0
  - id: batchlog-manager-replaying-batch
    name: BatchlogManager.ReplayingBatch
    kind: function
    parent: batchlog-manager
    layer: durability
    summary: "One batch being replayed: drops truncated tables, skips expired batches, applies locally, sends to live replicas, hints dead ones and hints undelivered ones on timeout."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:337-519]
  - id: batchlog-manager-replaying-batch-replay-write-response-handler
    name: BatchlogManager.ReplayingBatch.ReplayWriteResponseHandler
    kind: response-handler
    parent: batchlog-manager-replaying-batch
    layer: durability
    summary: "WriteResponseHandler that blocks for every live remote replica and remembers which ones did not answer (undelivered)."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:525-549]
  - id: batch-store-verb-handler
    name: BatchStoreVerbHandler
    kind: verb-handler
    parent: hints-batchlog
    layer: durability
    summary: "BATCH_STORE_REQ: store the batch in the local batchlog and reply."
    sources: [src/java/org/apache/cassandra/batchlog/BatchStoreVerbHandler.java:24-33]
  - id: batch-remove-verb-handler
    name: BatchRemoveVerbHandler
    kind: verb-handler
    parent: hints-batchlog
    layer: durability
    summary: "BATCH_REMOVE_REQ: delete the batch from the local batchlog. Sends no response."
    sources: [src/java/org/apache/cassandra/batchlog/BatchRemoveVerbHandler.java:24-32]
  - id: batchlog-response-handler
    name: BatchlogResponseHandler
    kind: response-handler
    parent: hints-batchlog
    layer: durability
    summary: "Wraps a mutation's write handler; counts down requiredBeforeFinish acks (the batch consistency level) and then acks the batch's BatchlogCleanup."
    sources: [src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:30-91]
    state:
      initial:
        handlers: {}
  - id: batchlog-response-handler-batchlog-cleanup
    name: BatchlogResponseHandler.BatchlogCleanup
    kind: function
    parent: batchlog-response-handler
    layer: durability
    summary: "Counts mutations still waiting for their batch consistency level; at zero runs the callback (asyncRemoveFromBatchlog)."
    sources: [src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:93-122]
    state:
      initial:
        cleanups: {}
  - id: storage-proxy-hint-runnable
    name: StorageProxy.HintRunnable
    kind: task
    parent: hints-batchlog
    layer: durability
    summary: "The MUTATION-stage task submitHint queues: resolves host ids, stamps the creation time and writes the hint to HintsService."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:2708-2734
      - src/java/org/apache/cassandra/service/StorageProxy.java:2781-2828

  # ------------------------------------------------------------ hints
  - id: hints-service
    name: HintsService
    kind: module
    parent: hints-batchlog
    layer: durability
    summary: "Entry point for writing, flushing, dispatching, pausing, deleting, excising and transferring hints. Dispatch starts paused and is unpaused by startDispatch at node start."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:71-128
      - conf/cassandra.yaml:68
      - conf/cassandra.yaml:93
      - conf/cassandra.yaml:102
    state:
      initial:
        dispatch_paused: false
        shut_down: false
        total_hints: 0
  - id: hints-catalog
    name: HintsCatalog
    kind: registry
    parent: hints-service
    layer: durability
    summary: "Map of host id to HintsStore for the hints directory; stores are created on first write."
    sources: [src/java/org/apache/cassandra/hints/HintsCatalog.java:46-147]
    state:
      initial:
        stores: {}
  - id: hints-buffer-pool
    name: HintsBufferPool
    kind: pool
    parent: hints-service
    layer: durability
    summary: "Hands out allocations in the current HintsBuffer (32 MiB minimum, at most MAX_HINT_BUFFERS=3) and swaps full buffers out for flushing."
    sources: [src/java/org/apache/cassandra/hints/HintsBufferPool.java:34-140]
  - id: hints-buffer
    name: HintsBuffer
    kind: buffer
    parent: hints-buffer-pool
    layer: durability
    summary: "In-memory slab of serialized hints with per-host-id offset queues."
    sources: [src/java/org/apache/cassandra/hints/HintsBuffer.java:55-146]
    state:
      initial:
        hints: {}
  - id: hints-write-executor
    name: HintsWriteExecutor
    kind: executor
    parent: hints-service
    layer: durability
    summary: "Single-threaded executor that flushes buffers into per-host hint files, rolls files at max_hints_file_size and fsyncs writers."
    capacity: {concurrency: 1}
    sources:
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:46-258
      - conf/cassandra.yaml:106
  - id: hints-store
    name: HintsStore
    kind: store
    parent: hints-catalog
    layer: durability
    summary: "Per-host hints: the open writer (current file) and the dispatch queue of closed files, with dispatch offsets and expiry."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:52-338]
    state:
      initial:
        hints: {}
  - id: hints-dispatch-trigger
    name: HintsDispatchTrigger
    kind: task
    parent: hints-service
    layer: durability
    summary: "Every 10 s: for each live store with files or an open writer, schedules dispatch of its files and closes its writer for the next run."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchTrigger.java:34-77]
  - id: hints-dispatch-executor
    name: HintsDispatchExecutor
    kind: executor
    parent: hints-service
    layer: durability
    summary: "HintsDispatcher thread pool (max_hints_delivery_threads=2); at most one dispatch task per host id (scheduledDispatches)."
    state:
      initial:
        scheduled: {}
    sources:
      - src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:51-145
      - conf/cassandra.yaml:93
  - id: hints-dispatch-executor-dispatch-hints-task
    name: HintsDispatchExecutor.DispatchHintsTask
    kind: task
    parent: hints-dispatch-executor
    layer: durability
    summary: "Delivers a store's files in order, rate-limited by hinted_handoff_throttle; converts files for hosts that left the ring; keeps the offset of a partially delivered file. Runs on the HintsDispatcher pool of max_hints_delivery_threads (2)."
    capacity: {concurrency: 2}
    sources:
      - src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:202-340
      - conf/cassandra.yaml:88
  - id: hints-dispatch-executor-transfer-hints-task
    name: HintsDispatchExecutor.TransferHintsTask
    kind: task
    parent: hints-dispatch-executor
    layer: durability
    summary: "Decommission: dispatches every store's files to one target node, retrying once after 10 s."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:147-200]
  - id: hints-dispatcher
    name: HintsDispatcher
    kind: function
    parent: hints-dispatch-executor-dispatch-hints-task
    layer: durability
    summary: "Reads a hints file page by page, sends each hint as HINT_REQ and aborts the page on any failure, timeout, dead target or pause."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatcher.java:51-263]
  - id: hint-verb-handler
    name: HintVerbHandler
    kind: verb-handler
    parent: hints-batchlog
    layer: durability
    summary: "HINT_REQ: validate and apply a delivered hint, or store/re-address it when this node is not its final replica."
    sources: [src/java/org/apache/cassandra/hints/HintVerbHandler.java:45-124]
  - id: hint
    name: Hint
    kind: value
    parent: hints-batchlog
    layer: durability
    summary: "A hint; applies its mutation only while live (creation + min(gcgs, maxHintTTL) seconds) and without tables truncated since."
    sources: [src/java/org/apache/cassandra/hints/Hint.java:60-160]
  - id: hints-cleanup-trigger
    name: HintsCleanupTrigger
    kind: task
    parent: hints-service
    layer: durability
    summary: "Hourly: when auto_hints_cleanup_enabled, deletes expired files of orphaned stores (host id no longer in the ring). Disabled in the deployed config."
    sources:
      - src/java/org/apache/cassandra/hints/HintsCleanupTrigger.java:35-70
      - conf/cassandra.yaml:115

  # ------------------------------------------------------------ boundary stub components
  - {id: storage-proxy, name: StorageProxy, kind: module, parent: coordination, sources: [src/java/org/apache/cassandra/service/StorageProxy.java], summary: "Request coordination entry points (owned by coordination).", attributes: {boundary: true, owner: coordination}}
  - {id: replica-plans, name: ReplicaPlans, kind: module, parent: coordination, sources: [src/java/org/apache/cassandra/locator/ReplicaPlans.java], summary: "Replica plan construction (owned by coordination).", attributes: {boundary: true, owner: coordination}}
  - {id: replica-layout, name: ReplicaLayout, kind: function, parent: coordination, sources: [src/java/org/apache/cassandra/locator/ReplicaLayout.java], summary: "Natural and pending replica layouts (owned by coordination).", attributes: {boundary: true, owner: coordination}}
  - {id: failure-detector, name: FailureDetector, kind: module, parent: membership, sources: [src/java/org/apache/cassandra/gms/FailureDetector.java], summary: "Phi-accrual failure detector (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: storage-service, name: StorageService, kind: module, parent: membership, sources: [src/java/org/apache/cassandra/service/StorageService.java], summary: "Node lifecycle and host-id/endpoint lookups (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: gossiper, name: Gossiper, kind: module, parent: membership, sources: [src/java/org/apache/cassandra/gms/Gossiper.java], summary: "Endpoint state map; scenarios mark nodes down here (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: token-metadata, name: TokenMetadata, kind: module, parent: membership, sources: [src/java/org/apache/cassandra/locator/TokenMetadata.java], summary: "Token ring (owned by membership).", attributes: {boundary: true, owner: membership}}
  - {id: mutation, name: Mutation, kind: module, parent: write-path, sources: [src/java/org/apache/cassandra/db/Mutation.java], summary: "A mutation and its local apply (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: mutation-verb-handler, name: MutationVerbHandler, kind: handler, parent: write-path, sources: [src/java/org/apache/cassandra/db/MutationVerbHandler.java], summary: "MUTATION_REQ on a replica (owned by write-path).", attributes: {boundary: true, owner: write-path}}
  - {id: schema, name: Schema, kind: module, parent: schema-auth, sources: [src/java/org/apache/cassandra/schema/Schema.java], summary: "Schema registry (owned by schema-auth).", attributes: {boundary: true, owner: schema-auth}}

interfaces:
  # ============================================================ logged batches (coordinator side)
  - component: storage-proxy
    name: mutate-atomically
    kind: function
    summary: "Logged batch: check every mutation's replicas, write the batch to the batchlog, write the mutations, and remove the batchlog entry once every mutation reaches the batch consistency level."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:1173-1255
      - src/java/org/apache/cassandra/service/StorageProxy.java:1150-1156
    request:
      type: object
      required: [mutations, consistency]
      properties:
        mutations: {type: array, minItems: 1, items: *mutation}
        consistency: &consistency {type: string, enum: [ONE, TWO, THREE, QUORUM, ALL, LOCAL_QUORUM, EACH_QUORUM, LOCAL_ONE, ANY], examples: [QUORUM]}
        require_quorum_for_remove: {type: boolean, default: false, description: "True when the batch updates a materialized view (mutateWithTriggers passes updatesView)."}
    response:
      type: object
      properties:
        batch_id: {type: string}
        batchlog_removed: {type: boolean}
        acks: {type: array, items: {type: integer}}
    errors:
      - &err-unavailable {code: unavailable, status: 4096, retryable: false, summary: "UnavailableException: not enough live replicas, or no live batchlog endpoint."}
      - &err-write-timeout {code: write-timeout, status: 4352, retryable: false, summary: "WriteTimeoutException (write_type BATCH_LOG or BATCH)."}
      - &err-write-failure {code: write-failure, status: 5376, retryable: false, summary: "WriteFailureException (write_type BATCH_LOG or BATCH)."}
    behavior:
      - title: Choose the batch consistency level
        detail: "requireQuorumForRemove upgrades to QUORUM, except that ALL and EACH_QUORUM are kept. The batch level decides when the batchlog entry may be removed."
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1189-1200
        set:
          vars.batchCl: "= input.consistency in ['ALL', 'EACH_QUORUM'] ? input.consistency : ((has(input.require_quorum_for_remove) && input.require_quorum_for_remove) ? 'QUORUM' : input.consistency)"
          vars.wrappers: []
          vars.started: "= now"
          ctx.writeType: BATCH
      - title: Pick the batchlog endpoints
        detail: "Up to two live nodes of the local DC, never this node unless the DC is that small; UnavailableException if none."
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1203
        call: replica-plans.for-batchlog-write
        input: {is_any: "= vars.batchCl == 'ANY'"}
        as: blplan
      - set:
          vars.batchId: "= '0f6a6c40-' + self + '-' + string(now)"
          ctx.batchlogEndpoints: "= vars.blplan.value.endpoints"
          ctx.batchCl: "= vars.batchCl"
      - title: Check every mutation's replicas before writing anything
        detail: "wrapBatchResponseHandler builds each replica plan (throwing UnavailableException when the consistency level can't be met) but sends nothing."
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1208-1220
        foreach: "= input.mutations"
        as: m
        steps:
          - call: storage-proxy.wrap-batch-response-handler
            input: {mutation: "= vars.m", consistency: "= input.consistency", batch_consistency: "= vars.batchCl"}
            as: wrapper
          - set: {vars.wrappers: "= vars.wrappers + [vars.wrapper.value]"}
      - title: Write the batch to the batchlog and wait for it (WriteResponseHandler.get, timed from the request start)
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1222-1223
        call: storage-proxy.sync-write-to-batchlog
        input:
          batch: {id: "= vars.batchId", creation_time: "= now * 1000", mutations: "= input.mutations"}
          endpoints: "= vars.blplan.value.endpoints"
          consistency: "= vars.blplan.value.consistency"
        on_error:
          - if: "error.code == 'timeout' || error.code == 'deadline_exceeded'"
            then:
              - title: Batchlog write timed out - WriteTimeoutException (BATCH_LOG)
                detail: "No mutation has been sent. Any batchlog copy that did land will be replayed by that node later."
                source: src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:140-150
                fail: {code: write-timeout, status: 4352, message: "Operation timed out - received only some responses for the batchlog write", data: {write_type: BATCH_LOG, consistency: "= vars.blplan.value.consistency", received: "= has(error.data) && error.data != null && has(error.data.received) ? error.data.received : 0", block_for: "= vars.blplan.value.consistency == 'TWO' ? 2 : 1"}}
          - fail: "= error"
      - set: {ctx.writeType: BATCH}
      - title: Write the mutations and wait for each consistency level
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1225-1226
        call: storage-proxy.sync-write-batched-mutations
        input:
          wrappers: "= vars.wrappers"
          consistency: "= input.consistency"
          batch_id: "= vars.batchId"
          batchlog_endpoints: "= vars.blplan.value.endpoints"
          wait_ms: "= now - vars.started >= config['write-request-timeout-ms'] ? 0.0 : double(config['write-request-timeout-ms']) - double(now - vars.started)"
        as: writes
      - return: {batch_id: "= vars.batchId", batchlog_removed: "= vars.writes.value.batchlog_removed", acks: "= vars.writes.value.acks"}

  - component: storage-proxy
    name: wrap-batch-response-handler
    kind: function
    summary: "Builds a mutation's replica plan (availability check) and its BatchlogResponseHandler: blockFor from the plan, requiredBeforeFinish from the batch consistency."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:1398-1419
      - src/java/org/apache/cassandra/db/ConsistencyLevel.java:133-170
    request:
      type: object
      required: [mutation, consistency, batch_consistency]
      properties:
        mutation: *mutation
        consistency: *consistency
        batch_consistency: *consistency
    response:
      type: object
      properties:
        mutation: *mutation
        plan: {type: object}
        block_for: {type: integer}
        required_before_finish: {type: integer}
    errors: [*err-unavailable]
    behavior:
      - title: Replica plan for the mutation's token (throws UnavailableException)
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1407-1410
        call: replica-plans.for-write
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token", consistency: "= input.consistency"}
        as: plan
      - set:
          vars.rf: "= has(vars.plan.value.rf) ? vars.plan.value.rf : size(vars.plan.value.natural)"
      - title: requiredBeforeFinish = batchConsistencyLevel.blockFor(rs) (no pending)
        detail: "ConsistencyLevel.blockFor with the plan's replication factor (single DC)."
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1415-1417
        set:
          vars.required: "= (input.batch_consistency in ['ONE', 'LOCAL_ONE', 'ANY']) ? 1 : (input.batch_consistency == 'TWO' ? 2 : (input.batch_consistency == 'THREE' ? 3 : (input.batch_consistency == 'ALL' ? vars.rf : vars.rf / 2 + 1)))"
      - return:
          mutation: "= input.mutation"
          plan: "= vars.plan.value"
          block_for: "= vars.plan.value.block_for"
          required_before_finish: "= vars.required"

  - component: storage-proxy
    name: sync-write-to-batchlog
    kind: function
    summary: "Sends BATCH_STORE_REQ to every batchlog endpoint at once (or stores locally on the MUTATION stage) and waits for ONE or TWO acks; a failure response that makes them unreachable is a WriteFailureException, no answer by write_request_timeout a timeout."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:1286-1306
      - src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:112-150
      - conf/cassandra.yaml:1330
    request:
      type: object
      required: [batch, endpoints, consistency]
      properties:
        batch: {$ref: HintsBatchlogBatch}
        endpoints: {type: array, items: {type: string}, examples: [[n2, n3]]}
        consistency: {type: string, enum: [ONE, TWO], examples: [TWO]}
    response: {type: object, properties: {acks: {type: integer}}}
    errors: [*err-write-failure, {code: timeout, retryable: true, summary: "No blockFor acks within write_request_timeout (the caller reports WriteTimeoutException BATCH_LOG)."}]
    behavior:
      - set:
          vars.blockFor: "= input.consistency == 'TWO' ? 2 : 1"
          ctx.writeType: BATCH_LOG
      - title: Send the batch to every batchlog endpoint and wait for blockFor acks
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1296-1305
        parallel: "= input.endpoints"
        as: e
        steps:
          - if: "vars.e == self"
            then:
              - title: Store the batch locally on the MUTATION stage
                source: src/java/org/apache/cassandra/service/StorageProxy.java:1300-1301
                call: batchlog-manager.store
                input: {batch: "= input.batch"}
            else:
              - title: Send BATCH_STORE_REQ to the batchlog endpoint
                source: src/java/org/apache/cassandra/service/StorageProxy.java:1302-1303
                call: batch-store-verb-handler.do-verb
                on: "= vars.e"
                input: {from: "= self", batch: "= input.batch"}
                timeout_ms: "= config['write-request-timeout-ms']"
        join: {need: "= vars.blockFor"}
        timeout_ms: "= config['write-request-timeout-ms']"
        as_result: acks
        on_insufficient: {code: write-failure, status: 5376}
      - set: {ctx.batchlogAcks: "= vars.acks.received"}
      - return: {acks: "= vars.acks.received"}

  - component: storage-proxy
    name: sync-write-batched-mutations
    kind: function
    summary: "Sends every batched mutation to all its replicas at once through sendToHintedReplicas (live and down contacts). Every response reaches the mutation's BatchlogResponseHandler, including responses after its wait is over, so the batchlog is removed when the last mutation reaches the batch consistency level. Then waits on each handler in order."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:1341-1355
    request:
      type: object
      required: [wrappers, consistency, batch_id, batchlog_endpoints]
      properties:
        wrappers: {type: array, items: {type: object}}
        consistency: *consistency
        batch_id: {type: string}
        batchlog_endpoints: {type: array, items: {type: string}}
        wait_ms: {type: number, description: "What is left of write_request_timeout, which get() measures from the request start (currentTimeoutNanos). Defaults to the whole timeout."}
    response:
      type: object
      properties:
        batchlog_removed: {type: boolean, description: "True when the remove was sent before the handlers were awaited. Later responses can still remove the batchlog."}
        acks: {type: array, items: {type: integer}}
    errors: [*err-write-timeout, *err-write-failure, {code: overloaded, status: 4097, summary: "OverloadedException from sendToHintedReplicas (too many hints in flight)."}]
    behavior:
      - title: All mutations are sent before any handler is awaited
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1346-1351
        parallel: "= input.wrappers"
        as: w
        index: wi
        steps:
          - set: {vars.handler: "= input.batch_id + '-m' + string(vars.wi)"}
          - call: batchlog-response-handler.collect-responses
            input:
              handler_id: "= vars.handler"
              mutation: "= vars.w.mutation"
              plan: "= vars.w.plan"
              consistency: "= input.consistency"
              block_for: "= vars.w.block_for"
              required_before_finish: "= vars.w.required_before_finish"
              batch_id: "= input.batch_id"
              mutations: "= size(input.wrappers)"
              batchlog_endpoints: "= input.batchlog_endpoints"
              wait_ms: "= has(input.wait_ms) ? input.wait_ms : config['write-request-timeout-ms']"
            as: got
            on_error: continue
          - if: "!vars.got.ok && vars.got.error.code == 'overloaded'"
            then:
              - fail: "= vars.got.error"
          - set:
              vars.acks: "= vars.got.ok ? vars.got.value.acks : (has(vars.got.error.data) && vars.got.error.data != null && has(vars.got.error.data.received) ? vars.got.error.data.received : 0)"
          - title: The responses received by the end of the wait count down the batch handler's requiredBeforeFinish
            source: src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:51-56
            call: batchlog-response-handler.on-response
            input:
              handler_id: "= vars.handler"
              required_before_finish: "= vars.w.required_before_finish"
              acks: "= vars.acks"
              batch_id: "= input.batch_id"
              mutations: "= size(input.wrappers)"
              batchlog_endpoints: "= input.batchlog_endpoints"
            as: br
          - return:
              acks: "= vars.acks"
              failures: "= !vars.got.ok && vars.got.error.code == 'write-failure' && has(vars.got.error.data) && vars.got.error.data != null && has(vars.got.error.data.failed) ? vars.got.error.data.failed : 0"
              block_for: "= vars.w.block_for"
              candidates: "= size(has(vars.w.plan.live_and_down) ? vars.w.plan.live_and_down : vars.w.plan.replicas)"
              removed: "= vars.br.value.batchlog_removed"
        join: {need: all}
        as_result: sends
        on_insufficient: {code: overloaded, status: 4097, retryable: true}
      - set:
          vars.outcomes: "= vars.sends.results.map(r, r.value)"
          vars.removed: "= vars.sends.results.exists(r, r.value.removed)"
      - set:
          ctx.mutationAcks: "= vars.outcomes.map(o, o.acks)"
          ctx.batchlogRemoveSent: "= vars.removed"
      - title: Wait on each mutation's handler in order; the first that falls short throws
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1353-1354
        foreach: "= vars.outcomes"
        as: o
        steps:
          - call: batchlog-response-handler.get
            input: {acks: "= vars.o.acks", failures: "= vars.o.failures", block_for: "= vars.o.block_for", candidates: "= vars.o.candidates", consistency: "= input.consistency", write_type: BATCH}
      - return: {batchlog_removed: "= vars.removed", acks: "= vars.outcomes.map(o, o.acks)"}

  - component: batchlog-response-handler
    name: collect-responses
    kind: function
    summary: "One batched mutation's sendToHintedReplicas, seen from its BatchlogResponseHandler: hint the down contacts, send to the live ones, and count responses until blockFor acks, until failures make blockFor unreachable, or until the write timeout. Responses after that still count down requiredBeforeFinish."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:1349-1354
      - src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:112-150
      - src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:293-311
    request:
      type: object
      required: [handler_id, mutation, plan, consistency, block_for, required_before_finish, batch_id, mutations, batchlog_endpoints]
      properties:
        handler_id: {type: string, examples: ["0f6a6c40-n1-1793318400000-m0"]}
        mutation: *mutation
        plan: {type: object}
        consistency: *consistency
        block_for: {type: integer, examples: [2]}
        required_before_finish: {type: integer, examples: [2]}
        batch_id: {type: string}
        mutations: {type: integer, examples: [2]}
        batchlog_endpoints: {type: array, items: {type: string}}
        wait_ms: {type: number, description: "How long get() still waits: the rest of write_request_timeout since the request start.", examples: [1995]}
    response: {type: object, properties: {acks: {type: integer}}}
    errors:
      - {code: write-failure, status: 5376, summary: "Failure responses make blockFor unreachable (data: received, failed)."}
      - {code: timeout, retryable: true, summary: "Fewer than blockFor acks by the write timeout (data: received)."}
    behavior:
      - set:
          vars.contacts: "= has(input.plan.live_and_down) ? input.plan.live_and_down : input.plan.replicas"
          vars.timeout: "= config['write-request-timeout-ms']"
          vars.wait: "= has(input.wait_ms) ? input.wait_ms : config['write-request-timeout-ms']"
      - set:
          vars.targets: "= vars.contacts.filter(r, r in input.plan.live).map(r, {'contacts': [r], 'live': true}) + (vars.contacts.exists(r, !(r in input.plan.live)) ? [{'contacts': vars.contacts.filter(r, !(r in input.plan.live)), 'live': false}] : [])"
      - title: "Hint the down contacts together and send to each live contact at once; wait for blockFor acks"
        detail: "get() waits for what is left of write_request_timeout since the request start; each MUTATION callback expires write_request_timeout after its own send, and a response after that is dropped. A response between the two still reaches the handler."
        source: src/java/org/apache/cassandra/service/StorageProxy.java:1349-1354
        parallel: "= vars.targets"
        as: t
        index: ti
        steps:
          - set: {vars.t0: "= now"}
          - call: storage-proxy.send-to-hinted-replicas
            input:
              mutation: "= input.mutation"
              plan: "= input.plan"
              contacts: "= vars.t.contacts"
              consistency: "= input.consistency"
              stage: MUTATION
              block_for: "= vars.t.live ? 1 : 0"
            as: sent
            on_error: continue
          - if: "vars.sent.ok && vars.sent.value.acks > 0"
            then:
              - return: {acks: "= vars.sent.value.acks"}
          - if: "!vars.t.live"
            then:
              - title: A down contact gets no message, so its response never comes (CL ANY counts the hint instead)
                source: src/java/org/apache/cassandra/service/StorageProxy.java:1549-1564
                wait: "= vars.timeout + 1"
              - fail: {code: replica-down, message: "= 'no response from ' + vars.t.contacts.join(',')"}
          - if: "now - vars.t0 >= vars.wait"
            then:
              - title: An expired callback counts as a failure only after get() has already timed out
                source: src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:126-127
                wait: 0.001
              - fail: {code: timeout, message: "= 'no response from ' + vars.t.contacts[0]"}
          - title: A failure response counts toward failures; blockFor + failures > candidates fails the wait
            source: src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:296-306
            fail: {code: failure-response, message: "= 'failure from ' + vars.t.contacts[0]"}
        join: {need: "= input.block_for"}
        timeout_ms: "= vars.wait"
        as_result: replies
        on_insufficient: {code: write-failure, status: 5376}
        on_late:
          - when: "vars.late.ok"
            title: A response after the wait still counts down requiredBeforeFinish and can trigger the batchlog cleanup
            source: src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:51-56
            call: batchlog-response-handler.on-response
            input:
              handler_id: "= input.handler_id"
              required_before_finish: "= input.required_before_finish"
              acks: "= vars.late.value.acks"
              batch_id: "= input.batch_id"
              mutations: "= input.mutations"
              batchlog_endpoints: "= input.batchlog_endpoints"
      - return: {acks: "= sum(vars.replies.results.filter(r, r.ok && !r.late).map(r, r.value.acks))"}

  - component: storage-proxy
    name: async-remove-from-batchlog
    kind: function
    summary: "Fire-and-forget BATCH_REMOVE_REQ to every batchlog endpoint (or a local remove on the MUTATION stage)."
    sources: [src/java/org/apache/cassandra/service/StorageProxy.java:1308-1321]
    request:
      type: object
      required: [batch_id, endpoints]
      properties:
        batch_id: {type: string}
        endpoints: {type: array, items: {type: string}}
    response: {type: object, properties: {sent: {type: integer}}}
    behavior:
      - foreach: "= input.endpoints"
        as: e
        steps:
          - if: "vars.e == self"
            then:
              - title: Remove locally on the MUTATION stage
                source: src/java/org/apache/cassandra/service/StorageProxy.java:1316-1317
                emit: batchlog-manager.remove
                input: {id: "= input.batch_id"}
            else:
              - title: Send BATCH_REMOVE_REQ without a callback
                source: src/java/org/apache/cassandra/service/StorageProxy.java:1318-1319
                emit: batch-remove-verb-handler.do-verb
                on: "= vars.e"
                input: {from: "= self", id: "= input.batch_id"}
      - set: {ctx.batchlogRemoved: true}
      - return: {sent: "= size(input.endpoints)"}

  - component: batchlog-response-handler
    name: on-response
    kind: function
    summary: "Responses for the wrapped mutation: each is forwarded to the wrapped handler and decrements requiredBeforeFinish, whether or not the client is still waiting; when it reaches zero the batch's BatchlogCleanup is acked (once)."
    sources: [src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:51-56]
    request:
      type: object
      required: [handler_id, required_before_finish, batch_id, mutations, batchlog_endpoints]
      properties:
        handler_id: {type: string, description: "This mutation's handler in the batch.", examples: ["0f6a6c40-n1-1793318400000-m0"]}
        required_before_finish: {type: integer, description: "batchConsistencyLevel.blockFor(rs), the handler's starting count.", examples: [2]}
        acks: {type: integer, default: 1, description: "Number of responses counted in this call."}
        batch_id: {type: string}
        mutations: {type: integer, description: "mutations.size(), BatchlogCleanup's starting count.", examples: [2]}
        batchlog_endpoints: {type: array, items: {type: string}}
    response: {type: object, properties: {required_before_finish: {type: integer}, finished: {type: boolean}, batchlog_removed: {type: boolean}}}
    behavior:
      - set:
          vars.acks: "= has(input.acks) ? input.acks : 1"
          vars.left: "= input.handler_id in state.handlers ? state.handlers[input.handler_id] : input.required_before_finish"
      - set:
          vars.finished: "= vars.left > 0 && vars.left - vars.acks <= 0"
          "= 'state.handlers.' + input.handler_id": "= vars.left - vars.acks"
      - if: "vars.finished"
        then:
          - title: requiredBeforeFinish reached zero - ack the batch's cleanup
            source: src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:54-55
            call: batchlog-response-handler-batchlog-cleanup.ack-mutation
            input: {batch_id: "= input.batch_id", mutations_waiting_for: "= input.mutations", batchlog_endpoints: "= input.batchlog_endpoints"}
            as: cl
          - return: {required_before_finish: "= vars.left - vars.acks", finished: true, batchlog_removed: "= vars.cl.value.invoke"}
      - return: {required_before_finish: "= vars.left - vars.acks", finished: false, batchlog_removed: false}

  - component: batchlog-response-handler
    name: get
    kind: function
    summary: "Waits on the wrapped write handler: success at blockFor acks, WriteFailureException once failures make blockFor unreachable, otherwise WriteTimeoutException after write_request_timeout."
    sources:
      - src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:68-71
      - src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:112-150
    request:
      type: object
      required: [acks, failures, block_for, candidates]
      properties:
        acks: {type: integer, examples: [3]}
        failures: {type: integer, examples: [0]}
        block_for: {type: integer, examples: [2]}
        candidates: {type: integer, examples: [3]}
        consistency: *consistency
        write_type: {type: string, examples: [BATCH]}
    response: {type: object, properties: {acks: {type: integer}}}
    errors: [*err-write-timeout, *err-write-failure]
    behavior:
      - if: "input.acks >= input.block_for"
        then:
          - return: {acks: "= input.acks"}
      - if: "input.block_for + input.failures > input.candidates"
        then:
          - title: Failures make the consistency level unreachable - WriteFailureException
            source: src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:129-137
            fail: {code: write-failure, status: 5376, message: "Operation failed - received fewer responses than required", data: {write_type: "= input.write_type", consistency: "= input.consistency", received: "= input.acks", block_for: "= input.block_for", failures: "= input.failures"}}
      - title: Not enough acks before write_request_timeout - WriteTimeoutException
        source: src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:140-150
        fail: {code: write-timeout, status: 4352, message: "Operation timed out - received only some responses", data: {write_type: "= input.write_type", consistency: "= input.consistency", received: "= input.acks", block_for: "= input.block_for"}}

  - component: batchlog-response-handler-batchlog-cleanup
    name: ack-mutation
    kind: function
    summary: "One more mutation reached its batch consistency level; when none is left, invoke the callback, asyncRemoveFromBatchlog."
    sources:
      - src/java/org/apache/cassandra/service/BatchlogResponseHandler.java:107-116
      - src/java/org/apache/cassandra/service/StorageProxy.java:1205-1207
    request:
      type: object
      required: [batch_id, mutations_waiting_for, batchlog_endpoints]
      properties:
        batch_id: {type: string}
        mutations_waiting_for: {type: integer, description: "The starting count, mutations.size(), used the first time this batch is acked.", examples: [2]}
        batchlog_endpoints: {type: array, items: {type: string}, examples: [[n2, n3]]}
    response: {type: object, properties: {mutations_waiting_for: {type: integer}, invoke: {type: boolean}}}
    behavior:
      - set:
          vars.left: "= (input.batch_id in state.cleanups ? state.cleanups[input.batch_id] : input.mutations_waiting_for) - 1"
      - set:
          "= 'state.cleanups.' + input.batch_id": "= vars.left"
      - if: "vars.left == 0"
        then:
          - title: Every mutation reached the batch consistency level - remove the batchlog entry
            source: src/java/org/apache/cassandra/service/StorageProxy.java:1206-1207
            call: storage-proxy.async-remove-from-batchlog
            input: {batch_id: "= input.batch_id", endpoints: "= input.batchlog_endpoints"}
      - return:
          mutations_waiting_for: "= vars.left"
          invoke: "= vars.left == 0"

  # ============================================================ batchlog storage and verbs
  - component: batch-store-verb-handler
    name: do-verb
    kind: verb
    summary: "BATCH_STORE_REQ on a batchlog replica: store the batch in its system.batches, then reply BATCH_STORE_RSP."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchStoreVerbHandler.java:28-32
      - src/java/org/apache/cassandra/net/Verb.java:122
      - src/java/org/apache/cassandra/net/Verb.java:121
    attributes: {verb: BATCH_STORE_REQ, response_verb: BATCH_STORE_RSP}
    request:
      type: object
      required: [batch]
      properties:
        from: {type: string, examples: [n1]}
        batch: {$ref: HintsBatchlogBatch}
    response: {type: object, properties: {responded: {type: boolean}}}
    behavior:
      - call: batchlog-manager.store
        input: {batch: "= input.batch"}
      - title: Reply BATCH_STORE_RSP to the coordinator
        source: src/java/org/apache/cassandra/batchlog/BatchStoreVerbHandler.java:31
        return: {responded: true}

  - component: batch-remove-verb-handler
    name: do-verb
    kind: verb
    summary: "BATCH_REMOVE_REQ on a batchlog replica: delete the batch row. No BATCH_REMOVE_RSP is ever sent."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchRemoveVerbHandler.java:28-31
      - src/java/org/apache/cassandra/net/Verb.java:124
      - src/java/org/apache/cassandra/net/Verb.java:123
    attributes: {verb: BATCH_REMOVE_REQ, response_verb: BATCH_REMOVE_RSP}
    request:
      type: object
      required: [id]
      properties:
        from: {type: string, examples: [n1]}
        id: {type: string, examples: ["0f6a6c40-n1-1793318400000"]}
    response: {type: object, properties: {responded: {type: boolean}}}
    behavior:
      - call: batchlog-manager.remove
        input: {id: "= input.id"}
      - title: No response is sent (the handler only removes)
        source: src/java/org/apache/cassandra/batchlog/BatchRemoveVerbHandler.java:30
        return: {responded: false}

  - component: batchlog-manager
    name: store
    kind: store
    summary: "Write the batch as one row of this node's system.batches (timestamp = batch creation time, version, serialized mutations)."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:134-165]
    request:
      type: object
      required: [batch]
      properties:
        batch: {$ref: HintsBatchlogBatch}
    store:
      table: batches
      op: put
      key: "= input.batch.id"
      value:
        id: "= input.batch.id"
        written_at_ms: "= input.batch.creation_time / 1000"
        version: 12
        gc_grace_seconds: "= has(input.batch.gc_grace_seconds) ? input.batch.gc_grace_seconds : 864000"
        mutations: "= input.batch.mutations"

  - component: batchlog-manager
    name: remove
    kind: store
    summary: "Delete the batch: a full-partition tombstone on system.batches for the id."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:125-132]
    request:
      type: object
      required: [id]
      properties:
        id: {type: string, examples: ["0f6a6c40-n1-1793318400000"]}
    store: {table: batches, op: delete, key: "= input.id"}

  - component: batchlog-manager
    name: query-batches
    kind: store
    summary: "SELECT id, mutations, version FROM system.batches WHERE token(id) > token(lastReplayedUuid) AND token(id) <= token(limitUuid) (LocalPartitioner over TimeUUID, so token order is time order)."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:217-223]
    request:
      type: object
      properties:
        after_ms: {type: integer}
        limit_ms: {type: integer}
    store:
      table: batches
      op: query
      where: "(!has(input.after_ms) || row.written_at_ms > input.after_ms) && (!has(input.limit_ms) || row.written_at_ms <= input.limit_ms)"

  - component: batchlog-manager
    name: count-all-batches
    kind: jmx
    summary: "BatchlogManagerMBean.countAllBatches: SELECT count(*) FROM system.batches on this node."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:167-176
      - src/java/org/apache/cassandra/batchlog/BatchlogManagerMBean.java:27
    request: {type: object}
    response: {type: object, properties: {count: {type: integer}}}
    behavior:
      - call: batchlog-manager.query-batches
        input: {}
        as: rows
      - return: {count: "= size(vars.rows.value)"}

  - component: batchlog-manager
    name: start
    kind: function
    summary: "Registers the MBean and schedules replayFailedBatches with a fixed delay of 10 s after RING_DELAY (30 s)."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:110-118]
    request: {type: object}
    response: {type: object, properties: {scheduled: {type: boolean}}}
    behavior:
      - title: Schedule batchlog replay every REPLAY_INTERVAL (10 s) after RING_DELAY (30 s)
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:114-117
        emit: batchlog-manager.replay-failed-batches
        input: {}
        after_ms: 30000
      - return: {scheduled: true}

  - component: batchlog-manager
    name: force-batchlog-replay
    kind: jmx
    summary: "BatchlogManagerMBean.forceBatchlogReplay: submit a replay and wait for it."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:183-192
      - src/java/org/apache/cassandra/batchlog/BatchlogManagerMBean.java:37
    request: {type: object}
    response: {type: object, properties: {replayed: {type: integer}}}
    behavior:
      - title: forceBatchlogReplay waits on startBatchlogReplay's future
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:183-186
        call: batchlog-manager.start-batchlog-replay
        input: {}
        as: r
      - return: {replayed: "= vars.r.value.replayed"}

  - component: batchlog-manager
    name: start-batchlog-replay
    kind: function
    summary: "Submit replayFailedBatches to the single-threaded BatchlogTasks executor (after any replay in progress) and return its future. Called by forceBatchlogReplay and by StorageService on decommission and drain."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:188-192]
    request: {type: object}
    response: {type: object, properties: {replayed: {type: integer}}}
    behavior:
      - title: Queue the replay behind any replay already running
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:190-191
        call: batchlog-manager.replay-failed-batches
        input: {}
        as: r
      - return: {replayed: "= vars.r.value.replayed"}

  - component: batchlog-manager
    name: set-rate
    kind: function
    summary: "Set the replay rate limiter to batchlog_replay_throttle / ring size (KiB/s per endpoint); 0 per endpoint means unthrottled. Called on every replay and by StorageService.setBatchlogReplayThrottleInKB."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:235-248
      - conf/cassandra.yaml:157
    request: {type: object, properties: {throttle_kib: {type: integer, default: 1024}}}
    response: {type: object, properties: {endpoint_throttle_kib: {type: integer}, unthrottled: {type: boolean}}}
    behavior:
      - set: {vars.kib: "= has(input.throttle_kib) ? input.throttle_kib : config['batchlog-replay-throttle-kib']"}
      - call: token-metadata.get-size-of-all-endpoints
        as: ring
      - if: "vars.ring.value.count <= 0"
        then:
          - title: No endpoints in the ring - rate unchanged
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:237-238
            return: {endpoint_throttle_kib: 0, unthrottled: false}
      - title: Per-endpoint throttle in KiB/s (integer division); 0 means Double.MAX_VALUE bytes/s
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:240-243
        set:
          state.replay_throttle_kib_per_endpoint: "= vars.kib / vars.ring.value.count"
          ctx.replayThrottleKiBPerEndpoint: "= vars.kib / vars.ring.value.count"
      - title: The limiter's rate is the per-endpoint throttle x 1024 bytes/s, set only when it changes
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:243-247
        call: batchlog-manager-rate-limiter.set-rate
        input: {bytes_per_sec: "= (vars.kib / vars.ring.value.count) * 1024"}
      - return: {endpoint_throttle_kib: "= vars.kib / vars.ring.value.count", unthrottled: "= vars.kib / vars.ring.value.count == 0"}

  - component: batchlog-manager
    name: replay-failed-batches
    kind: scheduled
    summary: "Replays every batch older than BATCHLOG_REPLAY_TIMEOUT (2 x write_request_timeout = 4000 ms) written since the last replay, throttled; hints what can't be delivered, fsyncs the hints, then deletes the batches."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:200-227
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:260-330
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:110-118
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:95
      - conf/cassandra.yaml:1330
    request: {type: object}
    response: {type: object, properties: {replayed: {type: integer}, cancelled: {type: boolean}}}
    behavior:
      - set:
          vars.unfinished: []
          vars.hinted: []
          vars.removedNow: 0
      - title: Cancel when there are no endpoints in the ring
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:206-211
        call: token-metadata.get-size-of-all-endpoints
        as: ring
      - if: "vars.ring.value.count <= 0"
        then:
          - return: {replayed: 0, cancelled: true}
      - title: Throttle replay to batchlog_replay_throttle / ring size
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:212
        call: batchlog-manager.set-rate
        input: {throttle_kib: "= config['batchlog-replay-throttle-kib']"}
        as: rate
      - set: {vars.limit: "= now - 2 * config['write-request-timeout-ms']"}
      - title: Read batches written after the last replay and at least BATCHLOG_REPLAY_TIMEOUT ago
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:214-223
        call: batchlog-manager.query-batches
        input: {after_ms: "= state.last_replayed_ms", limit_ms: "= vars.limit"}
        as: rows
      - foreach: "= vars.rows.value"
        as: b
        steps:
          - title: Send each batch out for replay without waiting
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:271-286
            call: batchlog-manager-replaying-batch.replay
            input: {batch: "= vars.b"}
            as: rb
          - if: "vars.rb.value.sent > 0"
            then:
              - set:
                  vars.unfinished: "= vars.unfinished + [vars.rb.value]"
                  vars.hinted: "= vars.hinted + vars.rb.value.hinted"
            else:
              - title: Nothing to send (expired, or every table truncated) - delete the batch now
                source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:282-286
                call: batchlog-manager.remove
                input: {id: "= vars.b.id"}
              - set:
                  state.total_batches_replayed: "= state.total_batches_replayed + 1"
                  vars.removedNow: "= vars.removedNow + 1"
      - title: Finish the page - wait on each handler, hint the undelivered
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:319-330
        foreach: "= vars.unfinished"
        as: u
        steps:
          - call: batchlog-manager-replaying-batch.finish
            input: {batch: "= vars.u"}
            as: fin
          - set: {vars.hinted: "= vars.hinted + vars.fin.value.hinted"}
      - title: Make the hints durable before deleting the batches
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:312-313
        call: hints-service.flush-and-fsync-blockingly
        input: {host_ids: "= vars.hinted"}
      - title: Delete the replayed batches
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:315-316
        foreach: "= vars.unfinished"
        as: u
        steps:
          - call: batchlog-manager.remove
            input: {id: "= vars.u.id"}
      - source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:225
        title: Advance lastReplayedUuid to the limit
        set:
          state.last_replayed_ms: "= vars.limit"
          state.total_batches_replayed: "= state.total_batches_replayed + size(vars.unfinished)"
          ctx.batchesReplayed: "= (has(ctx.batchesReplayed) ? ctx.batchesReplayed : 0) + size(vars.unfinished) + vars.removedNow"
      - return: {replayed: "= size(vars.unfinished) + vars.removedNow", cancelled: false}

  - component: batchlog-manager-rate-limiter
    name: set-rate
    kind: function
    summary: "RateLimiter.setRate (SmoothBursty): bank the permits earned since the last acquire, then rescale them to the new 1 s burst. Leaving Double.MAX_VALUE fills the bucket."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:243-247
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:102
    request: {type: object, required: [bytes_per_sec], properties: {bytes_per_sec: {type: integer, description: "0 means Double.MAX_VALUE (unthrottled).", examples: [349184]}}}
    response: {type: object, properties: {changed: {type: boolean}, stored: {type: number}}}
    behavior:
      - if: "input.bytes_per_sec == state.bytes_per_sec"
        then:
          - title: rateLimiter.getRate() already equals the throughput - nothing to do
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:244
            return: {changed: false, stored: "= state.stored"}
      - if: "state.bytes_per_sec == 0"
        then:
          - title: From Double.MAX_VALUE every elapsed microsecond banks the whole burst, so the bucket starts full
            detail: "resync caps storedPermits at maxPermits (Double.MAX_VALUE); doSetRate then scales it to the new maxPermits (1 s of the new rate)."
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:246
            set:
              vars.stored: "= double(input.bytes_per_sec)"
        else:
          - title: Bank the permits earned since nextFreeTicket at the old rate (capped at 1 s), then rescale to the new rate
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:246
            set:
              vars.earned: "= now_us > state.next_free_us ? double(now_us - state.next_free_us) * double(state.bytes_per_sec) / 1000000.0 : 0.0"
          - set:
              vars.banked: "= state.stored + vars.earned > double(state.bytes_per_sec) ? double(state.bytes_per_sec) : state.stored + vars.earned"
          - set:
              vars.stored: "= input.bytes_per_sec == 0 ? 0.0 : vars.banked * double(input.bytes_per_sec) / double(state.bytes_per_sec)"
      - set:
          state.bytes_per_sec: "= input.bytes_per_sec"
          state.stored: "= vars.stored"
          state.next_free_us: "= now_us > state.next_free_us ? now_us : state.next_free_us"
      - return: {changed: true, stored: "= vars.stored"}

  - component: batchlog-manager-rate-limiter
    name: acquire
    kind: function
    summary: "RateLimiter.acquire(bytes): wait until the next free ticket (the debt of earlier acquires), spend banked permits first and push nextFreeTicket back by the rest at the current rate. Unthrottled never waits."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:367
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:102
    request: {type: object, required: [bytes], properties: {bytes: {type: integer, examples: [1024]}}}
    response: {type: object, properties: {waited_us: {type: integer}}}
    behavior:
      - if: "state.bytes_per_sec == 0"
        then:
          - title: Double.MAX_VALUE bytes/s - no wait
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:246
            return: {waited_us: 0}
      - title: Bank the permits earned since the next free ticket (at most 1 s worth)
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:367
        set:
          vars.banked: "= now_us > state.next_free_us ? (state.stored + double(now_us - state.next_free_us) * double(state.bytes_per_sec) / 1000000.0) : state.stored"
          vars.ticket: "= now_us > state.next_free_us ? now_us : state.next_free_us"
      - set:
          vars.banked: "= vars.banked > double(state.bytes_per_sec) ? double(state.bytes_per_sec) : vars.banked"
      - set:
          vars.spend: "= double(input.bytes) < vars.banked ? double(input.bytes) : vars.banked"
      - title: This request is granted at the ticket; the bytes not covered by banked permits push the next ticket back
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:367
        set:
          state.stored: "= vars.banked - vars.spend"
          state.next_free_us: "= vars.ticket + int((double(input.bytes) - vars.spend) * 1000000.0 / double(state.bytes_per_sec))"
          vars.waited: "= vars.ticket - now_us"
      - when: "vars.waited > 0"
        title: Sleep until the ticket
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:367
        wait: "= double(vars.waited) / 1000.0"
      - return: {waited_us: "= vars.waited"}

  - component: batchlog-manager-replaying-batch
    name: replay
    kind: function
    summary: "Skip an empty or expired batch (written_at + smallest gc_grace_seconds <= now); otherwise send every mutation at once, then acquire the rate limiter for the batch's bytes."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:354-370
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:450-461
    request:
      type: object
      required: [batch]
      properties:
        batch: {$ref: HintsBatchlogBatchRow}
    response:
      type: object
      properties:
        id: {type: string}
        sent: {type: integer}
        written_at_ms: {type: integer}
        gc_grace_seconds: {type: integer}
        handlers: {type: array, items: {type: object}}
        hinted: {type: array, items: {type: string}}
    behavior:
      - set:
          vars.gcgs: "= has(input.batch.gc_grace_seconds) ? input.batch.gc_grace_seconds : 864000"
          vars.handlers: []
          vars.hinted: []
      - if: "size(input.batch.mutations) == 0"
        then:
          - title: Every table truncated since the batch was written - nothing to replay
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:358-359
            return: {id: "= input.batch.id", sent: 0, written_at_ms: "= input.batch.written_at_ms", gc_grace_seconds: "= vars.gcgs", handlers: [], hinted: []}
      - if: "input.batch.written_at_ms / 1000 + vars.gcgs <= now / 1000"
        then:
          - title: Batch older than gc_grace_seconds - dropped, not replayed
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:361-363
            set: {ctx.batchExpired: true}
          - return: {id: "= input.batch.id", sent: 0, written_at_ms: "= input.batch.written_at_ms", gc_grace_seconds: "= vars.gcgs", handlers: [], hinted: []}
      - title: sendReplays sends every mutation without waiting
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:450-461
        parallel: "= input.batch.mutations"
        as: m
        steps:
          - call: batchlog-manager-replaying-batch.send-single-replay-mutation
            input: {mutation: "= vars.m", written_at_ms: "= input.batch.written_at_ms"}
            as: h
            on_error: continue
          - return: "= vars.h.ok ? {'ok': true, 'handler': vars.h.value} : {'ok': false, 'error': vars.h.error}"
        join: {need: all}
        as_result: sends
      - if: "vars.sends.results.exists(r, !r.value.ok)"
        then:
          - title: An inline local apply failed - the exception escapes the replay task
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:484-486
            fail: "= vars.sends.results.filter(r, !r.value.ok)[0].value.error"
      - set:
          vars.handlers: "= vars.sends.results.map(r, r.value.handler)"
          vars.hinted: "= vars.sends.results.map(r, r.value.handler.hinted).flatten()"
          vars.bytes: "= size(input.batch.mutations) * 512"
      - title: Acquire the replay rate limiter for the batch's bytes, after sending
        detail: "RateLimiter.acquire(replayedBytes), assuming 512 bytes per serialized mutation. It waits for the earlier batches' debt, not this batch's bytes."
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:367
        call: batchlog-manager-rate-limiter.acquire
        input: {bytes: "= vars.bytes"}
      - return: {id: "= input.batch.id", sent: "= size(vars.handlers)", written_at_ms: "= input.batch.written_at_ms", gc_grace_seconds: "= vars.gcgs", handlers: "= vars.handlers", hinted: "= vars.hinted"}

  - component: batchlog-manager-replaying-batch
    name: send-single-replay-mutation
    kind: function
    summary: "Apply locally (inline, errors not caught) if this node is a replica, hint every dead replica directly (no shouldHint, no hint window), and send MUTATION_REQ to every live remote replica at once; the handler records who did not answer within the write timeout."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:469-511]
    request:
      type: object
      required: [mutation, written_at_ms]
      properties:
        mutation: *mutation
        written_at_ms: {type: integer, examples: [1793318390000]}
    response:
      type: object
      properties:
        mutation: *mutation
        contacts: {type: array, items: {type: string}}
        undelivered: {type: array, items: {type: string}}
        hinted: {type: array, items: {type: string}}
    behavior:
      - call: replica-layout.for-token-write-live-and-down
        input: {keyspace: "= input.mutation.keyspace", token: "= input.mutation.token"}
        as: layout
      - set:
          vars.all: "= has(vars.layout.value.all) ? vars.layout.value.all : vars.layout.value.replicas"
          vars.contacts: []
          vars.hinted: []
      - when: "self in vars.all"
        title: This node is a replica - apply inline, errors propagate and stall the replay
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:484-486
        call: mutation.apply
        input: {mutation: "= input.mutation"}
      - foreach: "= vars.all.filter(r, r != self)"
        as: r
        steps:
          - call: failure-detector.is-alive
            input: {endpoint: "= vars.r"}
            as: fd
            on_error: continue
          - if: "vars.fd.ok && vars.fd.value.alive == true"
            then:
              - set: {vars.contacts: "= vars.contacts + [vars.r]"}
            else:
              - call: storage-service.get-host-id-for-endpoint
                input: {endpoint: "= vars.r"}
                as: hid
                on_error: continue
              - if: "vars.hid.ok && has(vars.hid.value.host_id) && vars.hid.value.host_id != ''"
                then:
                  - title: Dead replica - write a hint directly, ignoring the hint window and hinted_handoff_enabled
                    source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:491-502
                    call: hints-service.write
                    input: {host_ids: ["= vars.hid.value.host_id"], hint: {mutation: "= input.mutation", creation_time: "= input.written_at_ms", gcgs: 864000}}
                  - set: {vars.hinted: "= vars.hinted + [vars.hid.value.host_id]"}
      - title: Send MUTATION_REQ (CALL_BACK_ON_FAILURE) to every live remote replica; the handler waits for all of them
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:504-509
        parallel: "= vars.contacts"
        as: c
        steps:
          - call: mutation-verb-handler.do-verb
            on: "= vars.c"
            input: {mutation: "= input.mutation"}
            timeout_ms: "= config['write-request-timeout-ms']"
            as: sent
            on_error: continue
          - if: "!vars.sent.ok"
            then:
              - title: The handler's hintOnFailure also hints the replica (on failure or expiry)
                source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:529-533
                call: storage-proxy.should-hint
                input: {replica: "= vars.c"}
                as: sh
                on_error: continue
              - when: "vars.sh.ok && vars.sh.value.should_hint == true"
                call: storage-proxy.submit-hint
                input: {mutation: "= input.mutation", targets: ["= vars.c"]}
                on_error: continue
          - return: {endpoint: "= vars.c", delivered: "= vars.sent.ok"}
        join: {need: all}
        as_result: acks
      - return:
          mutation: "= input.mutation"
          contacts: "= vars.contacts"
          undelivered: "= vars.acks.results.filter(r, !r.value.delivered).map(r, r.value.endpoint)"
          hinted: "= vars.hinted"

  - component: batchlog-manager-replaying-batch
    name: finish
    kind: function
    summary: "Wait on each mutation's replay handler; at the first timeout or failure, hint the undelivered endpoints of that and every later mutation."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:372-390]
    request:
      type: object
      required: [batch]
      properties:
        batch: {type: object}
    response: {type: object, properties: {hinted: {type: array, items: {type: string}}}}
    behavior:
      - foreach: "= input.batch.handlers"
        as: h
        index: i
        steps:
          - call: batchlog-manager-replaying-batch-replay-write-response-handler.get
            input: {contacts: "= vars.h.contacts", undelivered: "= vars.h.undelivered"}
            as: g
            on_error: continue
          - if: "!vars.g.ok"
            then:
              - title: Replay write timed out or failed - hint the rest from here
                source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:381-387
                call: batchlog-manager-replaying-batch.write-hints-for-undelivered-endpoints
                input: {start_from: "= vars.i", handlers: "= input.batch.handlers", written_at_ms: "= input.batch.written_at_ms", gc_grace_seconds: "= input.batch.gc_grace_seconds"}
                as: wh
              - return: {hinted: "= vars.wh.value.hinted"}
      - return: {hinted: []}

  - component: batchlog-manager-replaying-batch
    name: write-hints-for-undelivered-endpoints
    kind: function
    summary: "Unless the batch has expired, write a hint (creation time = batch write time) to every undelivered endpoint of handlers start_from..end."
    sources: [src/java/org/apache/cassandra/batchlog/BatchlogManager.java:420-448]
    request:
      type: object
      required: [start_from, handlers, written_at_ms]
      properties:
        start_from: {type: integer}
        handlers: {type: array, items: {type: object}}
        written_at_ms: {type: integer}
        gc_grace_seconds: {type: integer}
    response: {type: object, properties: {hinted: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.gcgs: "= has(input.gc_grace_seconds) ? input.gc_grace_seconds : 864000"
          vars.hinted: []
      - if: "input.written_at_ms / 1000 + vars.gcgs <= now / 1000"
        then:
          - title: Batch expired - no hints
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:424-426
            return: {hinted: []}
      - foreach: "= input.handlers.slice(input.start_from, size(input.handlers))"
        as: h
        steps:
          - set: {vars.nodes: []}
          - foreach: "= vars.h.undelivered"
            as: addr
            steps:
              - call: storage-service.get-host-id-for-endpoint
                input: {endpoint: "= vars.addr"}
                as: hid
                on_error: continue
              - when: "vars.hid.ok && has(vars.hid.value.host_id) && vars.hid.value.host_id != ''"
                set: {vars.nodes: "= vars.nodes + [vars.hid.value.host_id]"}
          - when: "size(vars.nodes) > 0"
            title: Hint the undelivered mutation
            source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:442-444
            call: hints-service.write
            input: {host_ids: "= vars.nodes", hint: {mutation: "= vars.h.mutation", creation_time: "= input.written_at_ms", gcgs: "= vars.gcgs"}}
          - set: {vars.hinted: "= vars.hinted + vars.nodes"}
      - return: {hinted: "= vars.hinted"}

  - component: batchlog-manager-replaying-batch-replay-write-response-handler
    name: get
    kind: function
    summary: "blockFor = every live remote contact; any undelivered contact means the replay write timed out or failed."
    sources:
      - src/java/org/apache/cassandra/batchlog/BatchlogManager.java:536-548
      - src/java/org/apache/cassandra/service/AbstractWriteResponseHandler.java:112-150
    request:
      type: object
      required: [contacts, undelivered]
      properties:
        contacts: {type: array, items: {type: string}}
        undelivered: {type: array, items: {type: string}}
    response: {type: object, properties: {acks: {type: integer}}}
    errors: [*err-write-timeout]
    behavior:
      - if: "size(input.undelivered) == 0"
        then:
          - return: {acks: "= size(input.contacts)"}
      - title: Some contact did not answer - WriteTimeoutException (UNLOGGED_BATCH)
        source: src/java/org/apache/cassandra/batchlog/BatchlogManager.java:532
        fail: {code: write-timeout, status: 4352, message: "replay write timed out", data: {write_type: UNLOGGED_BATCH, consistency: ONE, received: "= size(input.contacts) - size(input.undelivered)", block_for: "= size(input.contacts)"}}

  # ============================================================ hint writing
  - component: storage-proxy
    name: submit-hint
    kind: function
    summary: "Queue a HintRunnable on the MUTATION stage for the targets (counting hints in progress). With a CL ANY response handler the written hint counts as the ack."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:2776-2828
      - src/java/org/apache/cassandra/service/StorageProxy.java:2813-2815
    request:
      type: object
      required: [mutation, targets]
      properties:
        mutation: *mutation
        targets: {type: array, minItems: 1, items: {type: string, examples: [n2]}}
        consistency: {type: string, description: "Consistency level of the response handler; absent when the handler is null (hintOnFailure, Paxos commit).", examples: [QUORUM]}
    response:
      type: object
      properties:
        queued: {type: boolean}
        counted_as_ack: {type: boolean}
    behavior:
      - set:
          ctx.hintsSubmitted: "= (has(ctx.hintsSubmitted) ? ctx.hintsSubmitted : []) + input.targets"
      - if: "has(input.consistency) && input.consistency == 'ANY'"
        then:
          - title: CL ANY - the coordinator's handler waits for the hint write, which counts as an ack
            source: src/java/org/apache/cassandra/service/StorageProxy.java:2813-2815
            call: storage-proxy-hint-runnable.run
            input: {mutation: "= input.mutation", targets: "= input.targets"}
          - return: {queued: true, counted_as_ack: true}
      - title: Submit the HintRunnable to the MUTATION stage
        source: src/java/org/apache/cassandra/service/StorageProxy.java:2822-2828
        emit: storage-proxy-hint-runnable.run
        input: {mutation: "= input.mutation", targets: "= input.targets"}
      - return: {queued: true, counted_as_ack: false}

  - component: storage-proxy-hint-runnable
    name: run
    kind: stage-task
    summary: "Resolve each target's host id (dropping endpoints no longer in the ring), stamp the creation time and write one hint for all of them."
    sources:
      - src/java/org/apache/cassandra/service/StorageProxy.java:2787-2817
      - src/java/org/apache/cassandra/service/StorageProxy.java:2717-2733
      - src/java/org/apache/cassandra/config/Config.java:453
    attributes: {stage: MUTATION}
    request:
      type: object
      required: [mutation, targets]
      properties:
        mutation: *mutation
        targets: {type: array, items: {type: string, examples: [n2]}}
    response: {type: object, properties: {host_ids: {type: array, items: {type: string}}}}
    behavior:
      - set: {vars.hostIds: []}
      - foreach: "= input.targets"
        as: t
        steps:
          - call: storage-service.get-host-id-for-endpoint
            input: {endpoint: "= vars.t"}
            as: hid
            on_error: continue
          - if: "vars.hid.ok && has(vars.hid.value.host_id) && vars.hid.value.host_id != ''"
            then:
              - set: {vars.hostIds: "= vars.hostIds + [vars.hid.value.host_id]"}
            else:
              - title: Endpoint not part of the ring - hint discarded
                source: src/java/org/apache/cassandra/service/StorageProxy.java:2800-2801
                set: {ctx.hintsDiscarded: "= (has(ctx.hintsDiscarded) ? ctx.hintsDiscarded : []) + [vars.t]"}
      - title: Creation time is now (use_creation_time_for_hint_ttl backdates it to the request start)
        source: src/java/org/apache/cassandra/service/StorageProxy.java:2804-2809
        call: hints-service.write
        input:
          host_ids: "= vars.hostIds"
          hint: {mutation: "= input.mutation", creation_time: "= now", gcgs: 864000}
      - set: {ctx.hintsCreated: "= (has(ctx.hintsCreated) ? ctx.hintsCreated : 0) + size(vars.hostIds)"}
      - return: {host_ids: "= vars.hostIds"}

  - component: hints-service
    name: write
    kind: function
    summary: "Write a hint for a set of host ids: refuse after shutdown, make sure their stores exist, append to the buffer pool and count StorageMetrics.totalHints."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:161-183
    request:
      type: object
      required: [host_ids, hint]
      properties:
        host_ids: {type: array, items: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}}
        hint: {$ref: HintsBatchlogHint}
    response: {type: object, properties: {written: {type: integer}}}
    errors: [{code: illegal-state-exception, summary: "HintsService is shut down and can't accept new hints."}]
    behavior:
      - if: "state.shut_down"
        then:
          - title: Shut down - refuse the hint
            source: src/java/org/apache/cassandra/hints/HintsService.java:163-164
            fail: {code: illegal-state-exception, message: "HintsService is shut down and can't accept new hints"}
      - title: Make sure the HintsStore of every host exists, or dispatch won't trigger
        source: src/java/org/apache/cassandra/hints/HintsService.java:166-167
        call: hints-catalog.maybe-load-stores
        input: {host_ids: "= input.host_ids"}
      - call: hints-buffer-pool.write
        input: {host_ids: "= input.host_ids", hint: "= input.hint"}
      - source: src/java/org/apache/cassandra/hints/HintsService.java:171
        title: Count StorageMetrics.totalHints
        set: {state.total_hints: "= state.total_hints + size(input.host_ids)"}
      - return: {written: "= size(input.host_ids)"}

  - component: hints-service
    name: write-for-all-replicas
    kind: function
    summary: "Re-address a hint to every current replica of its token that shouldHint allows (live and down, without the persistent window check)."
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:188-203]
    request:
      type: object
      required: [hint]
      properties:
        hint: {$ref: HintsBatchlogHint}
    response: {type: object, properties: {host_ids: {type: array, items: {type: string}}}}
    behavior:
      - call: replica-layout.for-token-write-live-and-down
        input: {keyspace: "= input.hint.mutation.keyspace", token: "= input.hint.mutation.token"}
        as: layout
      - set: {vars.hostIds: []}
      - foreach: "= has(vars.layout.value.all) ? vars.layout.value.all : vars.layout.value.replicas"
        as: r
        steps:
          - title: Keep the replicas shouldHint(replica, false) allows (it refuses this node)
            source: src/java/org/apache/cassandra/hints/HintsService.java:197-200
            call: storage-proxy.should-hint
            input: {replica: "= vars.r", try_enable_persistent_window: false}
            as: sh
            on_error: continue
          - when: "vars.sh.ok && vars.sh.value.should_hint == true"
            call: storage-service.get-host-id-for-endpoint
            input: {endpoint: "= vars.r"}
            as: hid
            on_error: continue
          - when: "vars.sh.ok && vars.sh.value.should_hint == true && vars.hid.ok && has(vars.hid.value.host_id) && vars.hid.value.host_id != ''"
            set: {vars.hostIds: "= vars.hostIds + [vars.hid.value.host_id]"}
      - call: hints-service.write
        input: {host_ids: "= vars.hostIds", hint: "= input.hint"}
      - set: {ctx.hintsReaddressed: "= (has(ctx.hintsReaddressed) ? ctx.hintsReaddressed : 0) + size(vars.hostIds)"}
      - return: {host_ids: "= vars.hostIds"}

  - component: hints-catalog
    name: maybe-load-stores
    kind: function
    summary: "Create the HintsStore of each host id if it doesn't exist yet."
    sources: [src/java/org/apache/cassandra/hints/HintsCatalog.java:91-95]
    request:
      type: object
      required: [host_ids]
      properties:
        host_ids: {type: array, items: {type: string}}
    behavior:
      - foreach: "= input.host_ids"
        as: h
        steps:
          - call: hints-catalog.get
            input: {host_id: "= vars.h"}

  - component: hints-catalog
    name: get
    kind: store
    summary: "stores.computeIfAbsent(hostId, HintsStore::create): this node's store row for the host id."
    sources: [src/java/org/apache/cassandra/hints/HintsCatalog.java:97-105]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
    store:
      table: stores
      op: put
      key: "= input.host_id"
      value: {host_id: "= input.host_id"}

  - component: hints-catalog
    name: stores
    kind: store
    summary: "All HintsStore instances of this node."
    sources: [src/java/org/apache/cassandra/hints/HintsCatalog.java:86-89]
    request: {type: object}
    store: {table: stores, op: query}

  - component: hints-catalog
    name: excise-store
    kind: store
    summary: "Remove the HintsStore instance of a host id from the catalog (after its hints are deleted)."
    sources: [src/java/org/apache/cassandra/hints/HintsCatalog.java:143-147]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    store: {table: stores, op: delete, key: "= input.host_id"}

  - component: hints-buffer-pool
    name: write
    kind: function
    summary: "Serialize the hint once into the current buffer and record its offset under each host id (a full buffer is switched and flushed)."
    sources:
      - src/java/org/apache/cassandra/hints/HintsBufferPool.java:59-84
      - src/java/org/apache/cassandra/hints/HintsBuffer.java:225-230
    request:
      type: object
      required: [host_ids, hint]
      properties:
        host_ids: {type: array, items: {type: string}}
        hint: {$ref: HintsBatchlogHint}
    behavior:
      - foreach: "= input.host_ids"
        as: h
        steps:
          - call: hints-buffer.put
            input: {host_id: "= vars.h", hint: "= input.hint"}

  - component: hints-buffer
    name: put
    kind: store
    summary: "Record the hint's offset in the host id's queue of the current buffer."
    sources: [src/java/org/apache/cassandra/hints/HintsBuffer.java:199-207]
    request:
      type: object
      required: [host_id, hint]
      properties:
        host_id: {type: string}
        hint: {$ref: HintsBatchlogHint}
    store:
      table: hints
      op: put
      key: "= input.host_id + ':' + input.hint.mutation.partition_key + ':' + string(input.hint.mutation.timestamp)"
      value:
        key: "= input.host_id + ':' + input.hint.mutation.partition_key + ':' + string(input.hint.mutation.timestamp)"
        host_id: "= input.host_id"
        stage: buffered
        creation_time: "= input.hint.creation_time"
        size_bytes: 512
        hint: "= input.hint"

  - component: hints-buffer
    name: consuming-hints-iterator
    kind: store
    summary: "The buffered hints (optionally of some host ids), in offset order."
    sources: [src/java/org/apache/cassandra/hints/HintsBuffer.java:115-146]
    request:
      type: object
      properties:
        host_ids: {type: array, items: {type: string}}
    store: {table: hints, op: query, where: "!has(input.host_ids) || row.host_id in input.host_ids"}

  - component: hints-buffer
    name: consume
    kind: store
    summary: "Poll one offset off the host's queue (the consuming part of consumingHintsIterator)."
    sources: [src/java/org/apache/cassandra/hints/HintsBuffer.java:134-144]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    store: {table: hints, op: delete, key: "= input.key"}

  - component: hints-write-executor
    name: flush-buffer-pool
    kind: scheduled
    summary: "Every hints_flush_period (10000 ms): flush the current buffer into each host's hints file. FSError goes to the disk failure policy and propagates."
    sources:
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:91-94
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:157-180
      - src/java/org/apache/cassandra/hints/HintsService.java:116-121
      - conf/cassandra.yaml:102
    request: {type: object}
    response: {type: object, properties: {flushed: {type: integer}}}
    errors: [{code: fs-write-error, summary: "FSWriteError writing a hints file."}]
    behavior:
      - call: hints-write-executor.flush
        input: {}
        as: f
      - return: {flushed: "= vars.f.value.flushed"}

  - component: hints-write-executor
    name: flush-buffer-pool-stores
    kind: function
    summary: "Flush only the given stores' hints out of the current buffer (used before fsync by batchlog replay and excise)."
    sources:
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:99-102
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:182-199
    request:
      type: object
      required: [host_ids]
      properties:
        host_ids: {type: array, items: {type: string}}
    response: {type: object, properties: {flushed: {type: integer}}}
    behavior:
      - call: hints-write-executor.flush
        input: {host_ids: "= input.host_ids"}
        as: f
      - return: {flushed: "= vars.f.value.flushed"}

  - component: hints-write-executor
    name: flush
    kind: function
    summary: "Append buffered hints to the host's open writer (opening one if needed); roll to a new file at max_hints_file_size (128 MiB)."
    sources:
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:217-257
      - conf/cassandra.yaml:106
    request:
      type: object
      properties:
        host_ids: {type: array, items: {type: string}}
    response: {type: object, properties: {flushed: {type: integer}}}
    errors: [{code: fs-write-error, summary: "FSWriteError writing a hints file."}]
    behavior:
      - call: hints-buffer.consuming-hints-iterator
        input: "= has(input.host_ids) ? {'host_ids': input.host_ids} : {}"
        as: rows
      - foreach: "= vars.rows.value"
        as: h
        steps:
          - title: Append to the host's current hints file
            source: src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:241-249
            call: hints-disk.hints-file-append
            input: {host_id: "= vars.h.host_id", bytes: "= vars.h.size_bytes"}
          - call: hints-store.append
            input: {row: "= vars.h"}
          - call: hints-buffer.consume
            input: {key: "= vars.h.key"}
      - return: {flushed: "= size(vars.rows.value)"}

  - component: hints-write-executor
    name: fsync-writers-blockingly
    kind: function
    summary: "fsync the open writers of the given stores and wait."
    sources:
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:104-118
      - src/java/org/apache/cassandra/hints/HintsWriteExecutor.java:201-215
    request:
      type: object
      required: [host_ids]
      properties:
        host_ids: {type: array, items: {type: string}}
    behavior:
      - when: "size(input.host_ids) > 0"
        call: hints-disk.hints-file-fsync
        input: {host_ids: "= input.host_ids"}

  - component: hints-service
    name: flush-and-fsync-blockingly
    kind: function
    summary: "Flush the given hosts' buffered hints to their files and fsync them, blocking (batchlog replay calls this before deleting batches)."
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:210-215]
    request:
      type: object
      required: [host_ids]
      properties:
        host_ids: {type: array, items: {type: string}}
    behavior:
      - call: hints-write-executor.flush-buffer-pool-stores
        input: {host_ids: "= input.host_ids"}
      - call: hints-write-executor.fsync-writers-blockingly
        input: {host_ids: "= input.host_ids"}

  # ------------------------------------------------------------ hints store
  - component: hints-store
    name: append
    kind: store
    summary: "A hint written into the store's open HintsWriter file (getOrOpenWriter)."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:295-320]
    request: {type: object, required: [row], properties: {row: {$ref: HintsBatchlogHintRow}}}
    store:
      table: hints
      op: put
      key: "= input.row.key"
      value: "= {'key': input.row.key, 'host_id': input.row.host_id, 'stage': 'writing', 'creation_time': input.row.creation_time, 'size_bytes': input.row.size_bytes, 'hint': input.row.hint}"

  - component: hints-store
    name: query
    kind: store
    summary: "The node's hints on disk: the open writers' files and the closed files on the dispatch queues (optionally one host, one stage)."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:242-245]
    request:
      type: object
      properties:
        host_id: {type: string}
        stage: {type: string, enum: [writing, file]}
    store: {table: hints, op: query, where: "(!has(input.host_id) || row.host_id == input.host_id) && (!has(input.stage) || row.stage == input.stage)"}

  - component: hints-store
    name: offer-last
    kind: store
    summary: "Put a closed file at the end of the dispatch queue."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:162-165]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    store: {table: hints, op: update, key: "= input.key", value: {stage: file}}

  - component: hints-store
    name: delete
    kind: store
    summary: "Delete a hints file (and its checksum file) from disk."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:228-240]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    store: {table: hints, op: delete, key: "= input.key"}

  - component: hints-store
    name: close-writer
    kind: function
    summary: "Close the open writer and offer its file to the dispatch queue."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:322-331]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    behavior:
      - call: hints-store.query
        input: {host_id: "= input.host_id", stage: writing}
        as: open
      - foreach: "= vars.open.value"
        as: h
        steps:
          - call: hints-store.offer-last
            input: {key: "= vars.h.key"}

  - component: hints-store
    name: delete-all-hints
    kind: function
    summary: "Delete every file on the dispatch queue and every corrupted file; the open writer's file is left alone."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:167-181]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    response: {type: object, properties: {deleted: {type: integer}}}
    behavior:
      - call: hints-store.query
        input: {host_id: "= input.host_id", stage: file}
        as: files
      - foreach: "= vars.files.value"
        as: h
        steps:
          - call: hints-disk.hints-file-delete
            input: {host_id: "= vars.h.host_id"}
          - call: hints-store.delete
            input: {key: "= vars.h.key"}
      - return: {deleted: "= size(vars.files.value)"}

  - component: hints-store
    name: delete-expired-hints
    kind: function
    summary: "Delete files whose lastModified + Schema.largestGcgs() <= now. largestGcgs is in seconds but is added to milliseconds, so files expire 864000 ms (14.4 minutes) after their last write."
    sources:
      - src/java/org/apache/cassandra/hints/HintsStore.java:183-226
      - src/java/org/apache/cassandra/schema/Schema.java:272-279
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    response: {type: object, properties: {deleted: {type: integer}}}
    behavior:
      - call: schema.largest-gcgs
        as: gc
      - call: hints-store.query
        input: {host_id: "= input.host_id", stage: file}
        as: files
      - set: {vars.deleted: 0}
      - foreach: "= vars.files.value"
        as: h
        steps:
          - when: "vars.h.creation_time + vars.gc.value.gcgs <= now"
            title: Expired (lastModified ms + largestGcgs seconds-as-ms)
            source: src/java/org/apache/cassandra/hints/HintsStore.java:199-203
            call: hints-store.delete
            input: {key: "= vars.h.key"}
          - when: "vars.h.creation_time + vars.gc.value.gcgs <= now"
            set: {vars.deleted: "= vars.deleted + 1"}
      - return: {deleted: "= vars.deleted"}

  - component: hints-store
    name: find-oldest-hint-timestamp
    kind: function
    summary: "Timestamp (epoch ms, from now) of the first file on the dispatch queue, else of the open writer, else Long.MAX_VALUE."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:133-144]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    response: {type: object, properties: {timestamp: {type: integer}}}
    behavior:
      - call: hints-store.query
        input: {host_id: "= input.host_id"}
        as: rows
      - return: {timestamp: "= size(vars.rows.value) == 0 ? 9223372036854775807 : math.least(vars.rows.value.map(r, r.creation_time))"}

  - component: hints-store
    name: get-total-file-size
    kind: function
    summary: "Total size of the store's files (dispatch queue, corrupted files and the open writer)."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:260-271]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    response: {type: object, properties: {bytes: {type: integer}}}
    behavior:
      - call: hints-store.query
        input: {host_id: "= input.host_id"}
        as: rows
      - return: {bytes: "= sum(vars.rows.value.map(r, r.size_bytes))"}

  - component: hints-store
    name: is-live
    kind: function
    summary: "The host id still maps to an endpoint and this node's failure detector thinks it is alive."
    sources: [src/java/org/apache/cassandra/hints/HintsStore.java:146-150]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    response: {type: object, properties: {live: {type: boolean}, address: {type: string}}}
    behavior:
      - call: storage-service.get-endpoint-for-host-id
        input: {host_id: "= input.host_id"}
        as: addr
        on_error: continue
      - if: "!vars.addr.ok || !has(vars.addr.value.endpoint) || vars.addr.value.endpoint == ''"
        then:
          - return: {live: false, address: ""}
      - call: failure-detector.is-alive
        input: {endpoint: "= vars.addr.value.endpoint"}
        as: fd
        on_error: continue
      - return: {live: "= vars.fd.ok && vars.fd.value.alive == true", address: "= vars.addr.value.endpoint"}

  # ------------------------------------------------------------ dispatch
  - component: hints-service
    name: is-dispatch-paused
    kind: function
    summary: "The shared isDispatchPaused flag (true from construction until startDispatch)."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:471-475
      - src/java/org/apache/cassandra/hints/HintsService.java:113
    request: {type: object}
    response: {type: object, properties: {paused: {type: boolean}}}
    behavior:
      - return: {paused: "= state.dispatch_paused"}

  - component: hints-service
    name: start-dispatch
    kind: function
    summary: "Unpause dispatch and schedule HintsDispatchTrigger every 10 s after an initial 10 s (called from StorageService.initServer)."
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:217-230]
    request: {type: object}
    errors: [{code: illegal-state-exception, summary: "HintsService is shut down and cannot be restarted."}]
    behavior:
      - if: "state.shut_down"
        then:
          - fail: {code: illegal-state-exception, message: "HintsService is shut down and cannot be restarted"}
      - set: {state.dispatch_paused: false}
      - title: Schedule the dispatch trigger with a fixed delay of 10 s, first run after 10 s
        source: src/java/org/apache/cassandra/hints/HintsService.java:226-229
        emit: hints-dispatch-trigger.run
        input: {}
        after_ms: 10000

  - component: hints-service
    name: pause-dispatch
    kind: jmx
    summary: "HintsServiceMBean.pauseDispatch: set isDispatchPaused; running dispatches stop at the next hint."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:232-238
      - src/java/org/apache/cassandra/hints/HintsServiceMBean.java:28
    request: {type: object}
    response: {type: object, properties: {paused: {type: boolean}}}
    behavior:
      - set: {state.dispatch_paused: true}
      - return: {paused: true}

  - component: hints-service
    name: resume-dispatch
    kind: jmx
    summary: "HintsServiceMBean.resumeDispatch: clear isDispatchPaused."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:240-246
      - src/java/org/apache/cassandra/hints/HintsServiceMBean.java:33
    request: {type: object}
    response: {type: object, properties: {paused: {type: boolean}}}
    behavior:
      - set: {state.dispatch_paused: false}
      - return: {paused: false}

  - component: hints-service
    name: delete-all-hints
    kind: jmx
    summary: "HintsServiceMBean.deleteAllHints: delete every store's dispatchable files (not files being written or dispatched)."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:319-322
      - src/java/org/apache/cassandra/hints/HintsCatalog.java:118-133
      - src/java/org/apache/cassandra/hints/HintsServiceMBean.java:39
    request: {type: object}
    response: {type: object, properties: {deleted: {type: integer}}}
    behavior:
      - call: hints-catalog.stores
        input: {}
        as: stores
      - set: {vars.deleted: 0}
      - foreach: "= vars.stores.value"
        as: s
        steps:
          - call: hints-store.delete-all-hints
            input: {host_id: "= vars.s.host_id"}
            as: d
          - set: {vars.deleted: "= vars.deleted + vars.d.value.deleted"}
      - return: {deleted: "= vars.deleted"}

  - component: hints-service
    name: delete-all-hints-for-endpoint
    kind: jmx
    summary: "HintsServiceMBean.deleteAllHintsForEndpoint: resolve the address to a host id (IllegalArgumentException if unknown) and delete that store's files."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:329-354
      - src/java/org/apache/cassandra/hints/HintsServiceMBean.java:45
    request:
      type: object
      required: [address]
      properties:
        address: {type: string, examples: [n2]}
    response: {type: object, properties: {deleted: {type: integer}}}
    errors: [{code: illegal-argument-exception, summary: "Can't delete hints for unknown address."}]
    behavior:
      - call: storage-service.get-host-id-for-endpoint
        input: {endpoint: "= input.address"}
        as: hid
        on_error: continue
      - if: "!vars.hid.ok || !has(vars.hid.value.host_id) || vars.hid.value.host_id == ''"
        then:
          - title: Unknown address
            source: src/java/org/apache/cassandra/hints/HintsService.java:350-352
            fail: {code: illegal-argument-exception, message: "= 'Can\\'t delete hints for unknown address ' + input.address"}
      - call: hints-store.delete-all-hints
        input: {host_id: "= vars.hid.value.host_id"}
        as: d
      - return: {deleted: "= vars.d.value.deleted"}

  - component: hints-service
    name: find-oldest-hint-timestamp
    kind: function
    summary: "Oldest hint timestamp held for a host, in epoch ms on the one clock (shouldHint's persistent hint window compares it with now - max_hint_window)."
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:453-456]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
    response: {type: object, properties: {timestamp: {type: integer}}}
    behavior:
      - call: hints-catalog.get
        input: {host_id: "= input.host_id"}
      - call: hints-store.find-oldest-hint-timestamp
        input: {host_id: "= input.host_id"}
        as: t
      - return: {timestamp: "= vars.t.value.timestamp"}

  - component: hints-service
    name: get-total-hints-size
    kind: function
    summary: "Bytes of hint files held for a host, 0 without a store (shouldHint's max_hints_size_per_host check reads it)."
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:253-259]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
    response: {type: object, properties: {bytes: {type: integer}}}
    behavior:
      - call: hints-store.get-total-file-size
        input: {host_id: "= input.host_id"}
        as: s
      - return: {bytes: "= vars.s.value.bytes"}

  - component: hints-service
    name: excise
    kind: function
    summary: "A host left the ring (removenode/assassinate): flush and close its writer, interrupt its dispatch, delete its files and drop its store."
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:372-401]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
    response: {type: object, properties: {excised: {type: boolean}}}
    behavior:
      - call: hints-write-executor.flush-buffer-pool-stores
        input: {host_ids: ["= input.host_id"]}
      - call: hints-store.close-writer
        input: {host_id: "= input.host_id"}
      - call: hints-dispatch-executor.interrupt-dispatch
        input: {host_id: "= input.host_id"}
      - call: hints-store.delete-all-hints
        input: {host_id: "= input.host_id"}
      - call: hints-catalog.excise-store
        input: {host_id: "= input.host_id"}
      - return: {excised: true}

  - component: hints-service
    name: transfer-hints
    kind: function
    summary: "Decommission: flush and close all writers, resume dispatch, wait for running dispatches, then transfer every store's files to one target node."
    sources:
      - src/java/org/apache/cassandra/hints/HintsService.java:419-444
    request:
      type: object
      required: [target_host_id]
      properties:
        target_host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000003"]}
    response: {type: object, properties: {transferred: {type: boolean}}}
    errors: [{code: runtime-exception, summary: "Failed to transfer all hints."}]
    behavior:
      - call: hints-write-executor.flush-buffer-pool
        input: {}
      - call: hints-catalog.stores
        input: {}
        as: stores
      - title: Close all writers
        source: src/java/org/apache/cassandra/hints/HintsService.java:422
        foreach: "= vars.stores.value"
        as: s
        steps:
          - call: hints-store.close-writer
            input: {host_id: "= vars.s.host_id"}
      - title: Unpause dispatch, or transfer() returns immediately
        source: src/java/org/apache/cassandra/hints/HintsService.java:437-438
        call: hints-service.resume-dispatch
      - call: hints-dispatch-executor.transfer
        input: {target_host_id: "= input.target_host_id"}
      - return: {transferred: true}

  - component: hints-dispatch-trigger
    name: run
    kind: scheduled
    summary: "Every 10 s unless paused: for each store not already scheduled that is live (host in the ring and alive per this node's failure detector) and has files or an open writer, schedule dispatch of its files and close its writer. This poll, not a gossip event, is what delivers hints to a node that came back."
    sources:
      - src/java/org/apache/cassandra/hints/HintsDispatchTrigger.java:52-71
      - src/java/org/apache/cassandra/hints/HintsService.java:226-229
    request: {type: object}
    response: {type: object, properties: {scheduled: {type: integer}}}
    behavior:
      - set: {vars.scheduled: 0}
      - call: hints-service.is-dispatch-paused
        as: p
      - if: "vars.p.value.paused"
        then:
          - title: Dispatch paused - do nothing
            source: src/java/org/apache/cassandra/hints/HintsDispatchTrigger.java:54-55
            return: {scheduled: 0}
      - call: hints-catalog.stores
        input: {}
        as: stores
      - foreach: "= vars.stores.value"
        as: s
        steps:
          - call: hints-dispatch-executor.is-scheduled
            input: {host_id: "= vars.s.host_id"}
            as: sched
          - if: "vars.sched.value.scheduled"
            then:
              - title: A dispatch for this host is already running - skip
                source: src/java/org/apache/cassandra/hints/HintsDispatchTrigger.java:58
                continue: true
          - call: hints-store.is-live
            input: {host_id: "= vars.s.host_id"}
            as: live
          - if: "!vars.live.value.live"
            then:
              - title: Host not in the ring or not alive - skip
                source: src/java/org/apache/cassandra/hints/HintsDispatchTrigger.java:59
                continue: true
          - call: hints-store.query
            input: {host_id: "= vars.s.host_id"}
            as: rows
          - set:
              vars.hasFiles: "= vars.rows.value.exists(r, r.stage == 'file')"
              vars.writing: "= vars.rows.value.exists(r, r.stage == 'writing')"
          - when: "vars.hasFiles"
            title: Schedule dispatch of the store's files
            source: src/java/org/apache/cassandra/hints/HintsDispatchTrigger.java:66-67
            call: hints-dispatch-executor.dispatch
            input: {host_id: "= vars.s.host_id"}
          - when: "vars.hasFiles"
            set: {vars.scheduled: "= vars.scheduled + 1"}
          - when: "vars.writing"
            title: Close the open writer so the next run dispatches it
            source: src/java/org/apache/cassandra/hints/HintsDispatchTrigger.java:69-70
            call: hints-store.close-writer
            input: {host_id: "= vars.s.host_id"}
      - return: {scheduled: "= vars.scheduled"}

  - component: hints-dispatch-executor
    name: is-scheduled
    kind: function
    summary: "scheduledDispatches.containsKey(hostId)."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:92-95]
    request: {type: object, required: [host_id], properties: {host_id: {type: string}}}
    response: {type: object, properties: {scheduled: {type: boolean}}}
    behavior:
      - return: {scheduled: "= input.host_id in state.scheduled"}

  - component: hints-dispatch-executor
    name: dispatch
    kind: function
    summary: "Submit a DispatchHintsTask for the host id unless one is already scheduled (computeIfAbsent)."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:97-114]
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string}
    behavior:
      - if: "input.host_id in state.scheduled"
        then:
          - return: {}
      - set: {state.scheduled: "= merge(state.scheduled, {input.host_id: true})"}
      - title: Run the task on the HintsDispatcher pool (max_hints_delivery_threads)
        source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:113
        emit: hints-dispatch-executor-dispatch-hints-task.run
        input: {host_id: "= input.host_id"}

  - component: hints-dispatch-executor
    name: done
    kind: function
    summary: "A dispatch task finished: scheduledDispatches.remove(hostId) (DispatchHintsTask.run's finally)."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:235-238]
    request: {type: object, required: [host_id], properties: {host_id: {type: string}}}
    behavior:
      - set: {state.scheduled: "= omit(state.scheduled, input.host_id)"}

  - component: hints-dispatch-executor
    name: interrupt-dispatch
    kind: function
    summary: "Cancel (interrupt) the host id's scheduled dispatch task, if any."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:139-145]
    request: {type: object, required: [host_id], properties: {host_id: {type: string}}}
    behavior:
      - set:
          ctx.dispatchInterrupted: "= input.host_id"
          state.scheduled: "= omit(state.scheduled, input.host_id)"

  - component: hints-dispatch-executor
    name: transfer
    kind: function
    summary: "Submit a TransferHintsTask and return its future."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:116-119]
    request:
      type: object
      required: [target_host_id]
      properties:
        target_host_id: {type: string}
    behavior:
      - call: hints-dispatch-executor-transfer-hints-task.run
        input: {target_host_id: "= input.target_host_id"}

  - component: hints-dispatch-executor-transfer-hints-task
    name: run
    kind: task
    summary: "Dispatch every store's files to the target node; if files remain, wait 10 s and try once more, then fail."
    sources: [src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:163-199]
    request:
      type: object
      required: [target_host_id]
      properties:
        target_host_id: {type: string}
    errors: [{code: runtime-exception, summary: "Failed to transfer all hints."}]
    behavior:
      - call: hints-catalog.stores
        input: {}
        as: stores
      - foreach: "= vars.stores.value"
        as: s
        steps:
          - call: hints-dispatch-executor-dispatch-hints-task.run
            input: {host_id: "= vars.s.host_id", to_host_id: "= input.target_host_id", is_transfer: true}
      - call: hints-store.query
        input: {stage: file}
        as: left
      - if: "size(vars.left.value) == 0"
        then:
          - return: {transferred: true}
      - title: Some hints left - retry once in 10 seconds
        source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:172-176
        wait: 10000
      - foreach: "= vars.stores.value"
        as: s
        steps:
          - call: hints-dispatch-executor-dispatch-hints-task.run
            input: {host_id: "= vars.s.host_id", to_host_id: "= input.target_host_id", is_transfer: true}
      - call: hints-store.query
        input: {stage: file}
        as: left2
      - if: "size(vars.left2.value) > 0"
        then:
          - title: Failed to transfer all hints
            source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:185-189
            fail: {code: runtime-exception, message: "= 'Failed to transfer all hints to ' + input.target_host_id"}
      - return: {transferred: true}

  - component: hints-dispatch-executor-dispatch-hints-task
    name: run
    kind: task
    summary: "Deliver the store's closed files in order to the host (or, on transfer, to the target node); convert files for a host that left the ring; stop at the first partially delivered file."
    sources:
      - src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:229-339
      - conf/cassandra.yaml:88
    request:
      type: object
      required: [host_id]
      properties:
        host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
        to_host_id: {type: string, default: "", description: "Dispatch destination; the store's own host id unless transferring (empty)."}
        is_transfer: {type: boolean, default: false}
    response: {type: object, properties: {delivered: {type: integer}, completed: {type: boolean}, converted: {type: integer}}}
    behavior:
      - set:
          vars.dest: "= (has(input.to_host_id) && input.to_host_id != '') ? input.to_host_id : input.host_id"
          ctx.dispatchStartedAt: "= now"
      - call: hints-dispatch-executor-dispatch-hints-task.dispatch
        input: {host_id: "= input.host_id", dest: "= vars.dest", is_transfer: "= has(input.is_transfer) && input.is_transfer"}
        as: d
        on_error: continue
      - title: finally scheduledDispatches.remove(hostId)
        source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:235-238
        call: hints-dispatch-executor.done
        input: {host_id: "= input.host_id"}
      - if: "!vars.d.ok"
        then:
          - fail: "= vars.d.error"
      - return: "= vars.d.value"

  - component: hints-dispatch-executor-dispatch-hints-task
    name: dispatch
    kind: function
    summary: "The task body: stop if paused, convert the files of a host that left the ring, otherwise deliver them (rate-limited by hinted_handoff_throttle / other nodes), deleting a fully delivered file and keeping the offset of a partial one."
    sources:
      - src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:241-325
      - src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:213-221
    request:
      type: object
      required: [host_id, dest]
      properties:
        host_id: {type: string}
        dest: {type: string}
        is_transfer: {type: boolean}
    response: {type: object, properties: {delivered: {type: integer}, completed: {type: boolean}, converted: {type: integer}}}
    behavior:
      - call: hints-service.is-dispatch-paused
        as: p
      - if: "vars.p.value.paused"
        then:
          - return: {delivered: 0, completed: false, converted: 0}
      - call: hints-store.query
        input: {host_id: "= input.host_id", stage: file}
        as: files
      - if: "size(vars.files.value) == 0"
        then:
          - return: {delivered: 0, completed: true, converted: 0}
      - call: storage-service.get-endpoint-for-host-id
        input: {host_id: "= input.dest"}
        as: addr
        on_error: continue
      - if: "!vars.addr.ok || !has(vars.addr.value.endpoint) || vars.addr.value.endpoint == ''"
        then:
          - title: Host left the ring - convert each hint into hints for the current replicas
            source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:278-280
            foreach: "= vars.files.value"
            as: h
            steps:
              - call: hints-service.write-for-all-replicas
                input: {hint: "= vars.h.hint"}
              - call: hints-store.delete
                input: {key: "= vars.h.key"}
          - return: {delivered: 0, completed: true, converted: "= size(vars.files.value)"}
      - call: token-metadata.get-size-of-all-endpoints
        as: ring
      - set:
          ctx.dispatchThrottleBytesPerSec: "= config['hinted-handoff-throttle-kib'] * 1024 / ((has(input.is_transfer) && input.is_transfer) ? 1 : math.greatest(1, vars.ring.value.count - 1))"
      - title: Deliver the files to the endpoint
        source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:283-296
        call: hints-dispatcher.dispatch
        input: {host_id: "= input.host_id", address: "= vars.addr.value.endpoint", hints: "= vars.files.value", throttle_bytes_per_sec: "= ctx.dispatchThrottleBytesPerSec"}
        as: d
      - if: "vars.d.value.completed"
        then:
          - title: File fully delivered - delete it
            source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:296-301
            foreach: "= vars.files.value"
            as: h
            steps:
              - call: hints-disk.hints-file-delete
                input: {host_id: "= input.host_id"}
              - call: hints-store.delete
                input: {key: "= vars.h.key"}
          - set: {ctx.hintsDelivered: "= (has(ctx.hintsDelivered) ? ctx.hintsDelivered : 0) + size(vars.files.value)"}
          - return: {delivered: "= size(vars.files.value)", completed: true, converted: 0}
      - title: Partially delivered - remember the page offset, put the file back first, stop
        source: src/java/org/apache/cassandra/hints/HintsDispatchExecutor.java:320-325
        set: {ctx.dispatchAborted: "= vars.d.value.reason"}
      - return: {delivered: 0, completed: false, converted: 0}

  - component: hints-dispatcher
    name: dispatch
    kind: function
    summary: "Send the page's hints as HINT_REQ (aborting before sending if the target is down or dispatch is paused), then await every callback; any failure or timeout aborts the page. Reading is rate-limited."
    sources:
      - src/java/org/apache/cassandra/hints/HintsDispatcher.java:98-210
      - src/java/org/apache/cassandra/hints/HintsDispatcher.java:226-261
    request:
      type: object
      required: [host_id, address, hints]
      properties:
        host_id: {type: string}
        address: {type: string, examples: [n2]}
        hints: {type: array, items: {$ref: HintsBatchlogHintRow}}
        throttle_bytes_per_sec: {type: integer, default: 524288}
    response: {type: object, properties: {completed: {type: boolean}, reason: {type: string}, success: {type: integer}, failures: {type: integer}, timeouts: {type: integer}}}
    behavior:
      - call: failure-detector.is-alive
        input: {endpoint: "= input.address"}
        as: fd
        on_error: continue
      - call: hints-service.is-dispatch-paused
        as: p
      - if: "!(vars.fd.ok && vars.fd.value.alive == true) || vars.p.value.paused"
        then:
          - title: Abort requested (target down or dispatch paused) - stop sending
            source: src/java/org/apache/cassandra/hints/HintsDispatcher.java:182-186
            return: {completed: false, reason: abort-requested, success: 0, failures: 0, timeouts: 0}
      - title: The rate limiter meters the page's bytes as the reader reads them
        source: src/java/org/apache/cassandra/hints/HintsReader.java:338-339
        wait: "= (has(input.throttle_bytes_per_sec) && input.throttle_bytes_per_sec > 0) ? sum(input.hints.map(h, h.size_bytes)) * 1000 / input.throttle_bytes_per_sec : 0"
      - title: Send every hint of the page with a callback, then await them all
        source: src/java/org/apache/cassandra/hints/HintsDispatcher.java:137-151
        parallel: "= input.hints"
        as: h
        steps:
          - title: Send HINT_REQ with a callback (expires after write_request_timeout)
            source: src/java/org/apache/cassandra/hints/HintsDispatcher.java:192-198
            call: hint-verb-handler.do-verb
            on: "= input.address"
            input: {from: "= self", host_id: "= input.host_id", hint: "= vars.h.hint"}
            timeout_ms: "= config['write-request-timeout-ms']"
            as: sent
            on_error: continue
          - return: {ok: "= vars.sent.ok", timeout: "= !vars.sent.ok && vars.sent.error.code == 'timeout'"}
        join: {need: all}
        as_result: page
      - set:
          vars.success: "= size(vars.page.results.filter(r, r.value.ok))"
          vars.timeouts: "= size(vars.page.results.filter(r, r.value.timeout))"
          vars.failures: "= size(vars.page.results.filter(r, !r.value.ok && !r.value.timeout))"
      - if: "vars.failures > 0 || vars.timeouts > 0"
        then:
          - title: A failure or timeout in the page - abort it
            source: src/java/org/apache/cassandra/hints/HintsDispatcher.java:155-159
            return: {completed: false, reason: page-failed, success: "= vars.success", failures: "= vars.failures", timeouts: "= vars.timeouts"}
      - return: {completed: true, reason: "", success: "= vars.success", failures: 0, timeouts: 0}

  - component: hint-verb-handler
    name: do-verb
    kind: verb
    summary: "HINT_REQ on the target: skip undecodable or invalid hints, store hints meant for another host, re-address hints for ranges no longer owned, otherwise apply and reply HINT_RSP (no reply if the apply fails)."
    sources:
      - src/java/org/apache/cassandra/hints/HintVerbHandler.java:51-123
      - src/java/org/apache/cassandra/net/Verb.java:118
      - src/java/org/apache/cassandra/net/Verb.java:117
    attributes: {verb: HINT_REQ, response_verb: HINT_RSP}
    request:
      type: object
      required: [host_id]
      properties:
        from: {type: string, examples: [n1]}
        host_id: {type: string, examples: ["6d194555-f6eb-41d0-c000-000000000002"]}
        hint: {$ref: HintsBatchlogHint}
        unknown_table_id: {type: string, default: "", description: "Set (and hint null) when the receiver could not decode the hint because its table is unknown."}
    response: {type: object, properties: {responded: {type: boolean}, outcome: {type: string}}}
    errors: [{code: no-response, summary: "The hint's apply failed; no HINT_RSP is sent and the sender times out."}]
    behavior:
      - if: "!has(input.hint) || input.hint == null || (has(input.unknown_table_id) && input.unknown_table_id != '')"
        then:
          - title: Unknown table (dropped) - reply without applying
            source: src/java/org/apache/cassandra/hints/HintVerbHandler.java:61-69
            set: {ctx.hintOutcome: unknown-table}
          - return: {responded: true, outcome: unknown-table}
      - choice: validation
        default: valid
        options:
          valid:
            - set: {ctx.hintValidated: true}
          invalid:
            - title: PartitionUpdate.validate failed (MarshalException) - reply, skip the hint
              source: src/java/org/apache/cassandra/hints/HintVerbHandler.java:72-81
              set: {ctx.hintOutcome: invalid}
            - return: {responded: true, outcome: invalid}
      - call: storage-service.get-local-host-uuid
        as: local
      - if: "input.host_id != vars.local.value.host_id"
        then:
          - title: Not the final destination (hint transferred by a decommissioning node) - store it locally
            source: src/java/org/apache/cassandra/hints/HintVerbHandler.java:83-89
            call: hints-service.write
            input: {host_ids: ["= input.host_id"], hint: "= input.hint"}
          - set: {ctx.hintOutcome: stored-for-other-host}
          - return: {responded: true, outcome: stored-for-other-host}
      - call: storage-proxy.applies-locally
        input: {mutation: "= input.hint.mutation"}
        as: owns
        on_error: continue
      - if: "!vars.owns.ok || vars.owns.value.applies_locally != true"
        then:
          - title: Token no longer owned or pending here - re-address the hint to all replicas
            source: src/java/org/apache/cassandra/hints/HintVerbHandler.java:90-111
            call: hints-service.write-for-all-replicas
            input: {hint: "= input.hint"}
          - set: {ctx.hintOutcome: readdressed}
          - return: {responded: true, outcome: readdressed}
      - title: The common path - apply the hint
        source: src/java/org/apache/cassandra/hints/HintVerbHandler.java:113-117
        call: hint.apply-future
        input: {hint: "= input.hint"}
        as: applied
        on_error: continue
      - if: "!vars.applied.ok"
        then:
          - title: Apply failed - logged at debug, no HINT_RSP; the sender's callback times out
            source: src/java/org/apache/cassandra/hints/HintVerbHandler.java:116
            set: {ctx.hintOutcome: apply-failed}
          - wait: "= config['write-request-timeout-ms'] + 1"
          - fail: {code: no-response, message: "hint apply failed; no response sent"}
      - set: {ctx.hintOutcome: "= vars.applied.value.applied ? 'applied' : 'expired'"}
      - return: {responded: true, outcome: "= vars.applied.value.applied ? 'applied' : 'expired'"}

  - component: hint
    name: apply-future
    kind: function
    summary: "Apply the hint's mutation on this node if the hint is still live (creation + min(gcgs, maxHintTTL) s > now); otherwise succeed without applying."
    sources:
      - src/java/org/apache/cassandra/hints/Hint.java:98-113
      - src/java/org/apache/cassandra/hints/Hint.java:131-159
    request: {type: object, required: [hint], properties: {hint: {$ref: HintsBatchlogHint}}}
    response: {type: object, properties: {applied: {type: boolean}}}
    behavior:
      - if: "input.hint.creation_time + input.hint.gcgs * 1000 <= now"
        then:
          - title: Hint expired (older than its gc_grace_seconds) - dropped
            source: src/java/org/apache/cassandra/hints/Hint.java:139-147
            return: {applied: false}
      - title: Apply the mutation without tables truncated since the hint was created
        source: src/java/org/apache/cassandra/hints/Hint.java:102-109
        call: mutation.apply-future
        input: {mutation: "= input.hint.mutation"}
      - return: {applied: true}

  - component: hints-cleanup-trigger
    name: run
    kind: scheduled
    summary: "Hourly: if auto_hints_cleanup_enabled, find stores whose host id no longer maps to an endpoint, close their writer, interrupt dispatch and delete their expired files."
    sources:
      - src/java/org/apache/cassandra/hints/HintsCleanupTrigger.java:47-69
      - src/java/org/apache/cassandra/hints/HintsService.java:123-125
      - conf/cassandra.yaml:115
    request: {type: object}
    response: {type: object, properties: {orphans: {type: integer}}}
    behavior:
      - if: "!config['auto-hints-cleanup-enabled']"
        then:
          - title: auto_hints_cleanup_enabled is false (deployed) - nothing to do
            source: src/java/org/apache/cassandra/hints/HintsCleanupTrigger.java:49-50
            return: {orphans: 0}
      - set: {vars.orphans: 0}
      - call: hints-catalog.stores
        input: {}
        as: stores
      - foreach: "= vars.stores.value"
        as: s
        steps:
          - call: storage-service.get-endpoint-for-host-id
            input: {host_id: "= vars.s.host_id"}
            as: addr
            on_error: continue
          - if: "vars.addr.ok && has(vars.addr.value.endpoint) && vars.addr.value.endpoint != ''"
            then:
              - continue: true
          - title: Orphaned store - close its writer and interrupt its dispatch
            source: src/java/org/apache/cassandra/hints/HintsCleanupTrigger.java:57-66
            call: hints-store.close-writer
            input: {host_id: "= vars.s.host_id"}
          - call: hints-dispatch-executor.interrupt-dispatch
            input: {host_id: "= vars.s.host_id"}
          - title: Delete its expired files on the optional tasks executor
            source: src/java/org/apache/cassandra/hints/HintsCleanupTrigger.java:67-68
            emit: hints-store.delete-expired-hints
            input: {host_id: "= vars.s.host_id"}
          - set: {vars.orphans: "= vars.orphans + 1"}
      - return: {orphans: "= vars.orphans"}

