configs:
  - id: write-request-timeout-ms
    type: integer
    value: 2000
    default: 2000
    summary: "write_request_timeout: how long the coordinator waits for write acks (batchlog store, batched mutations, replay writes, HINT_REQ callbacks). Read here as a reference; coordination owns it."
    sources: [conf/cassandra.yaml:1330, src/java/org/apache/cassandra/config/Config.java:151]
    attributes: {boundary: true, owner: coordination}
  - id: hints-flush-period-ms
    type: integer
    value: 10000
    default: 10000
    summary: "hints_flush_period: how often HintsService flushes the hint buffers to the hint files."
    sources: [conf/cassandra.yaml:102, src/java/org/apache/cassandra/config/Config.java:445]
  - id: max-hints-delivery-threads
    type: integer
    value: 2
    default: 2
    summary: "max_hints_delivery_threads: size of the HintsDispatcher pool (the dispatch task's capacity)."
    sources: [conf/cassandra.yaml:93, src/java/org/apache/cassandra/config/Config.java:443]
  - id: hinted-handoff-throttle-kib
    type: integer
    value: 1024
    default: 1024
    summary: "hinted_handoff_throttle: KiB/s of hints delivered to one host, divided by the number of other nodes (1 on transfer)."
    sources: [conf/cassandra.yaml:88, src/java/org/apache/cassandra/config/Config.java:439]
  - id: max-hints-file-size-mib
    type: integer
    value: 128
    default: 128
    summary: "max_hints_file_size: a hints writer rolls to a new file past this size."
    sources: [conf/cassandra.yaml:106, src/java/org/apache/cassandra/config/Config.java:447]
  - id: auto-hints-cleanup-enabled
    type: boolean
    value: false
    default: false
    summary: "auto_hints_cleanup_enabled: whether the hourly HintsCleanupTrigger deletes expired files of orphaned stores."
    sources: [conf/cassandra.yaml:115, src/java/org/apache/cassandra/config/Config.java:451]
  - id: batchlog-replay-throttle-kib
    type: integer
    value: 1024
    default: 1024
    summary: "batchlog_replay_throttle: KiB/s for batchlog replay, divided by the ring size."
    sources: [conf/cassandra.yaml:157, src/java/org/apache/cassandra/config/Config.java:441]
  - id: use-creation-time-for-hint-ttl
    type: boolean
    value: true
    default: true
    summary: "use_creation_time_for_hint_ttl (absent from cassandra.yaml): a hint's creation time is backdated to the request start."
    sources: [src/java/org/apache/cassandra/config/Config.java:453]

