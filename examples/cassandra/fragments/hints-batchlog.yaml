  - id: hb-hints-excise
    name: Excise a removed host's hints
    entry: {caller: membership, interface: hints-service.excise, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}}
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:372-401]
    tags: [writes]
  - id: hb-hint-window-lookup
    name: Oldest hint lookup for the persistent hint window
    entry: {caller: coordination, interface: hints-service.find-oldest-hint-timestamp, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}}
    sources: [src/java/org/apache/cassandra/hints/HintsService.java:453-456]

scenarios:
  # ---------------------------------------------------------------- logged batch
  - id: hb-logged-batch-happy
    flow: hb-logged-batch
    name: Logged batch at QUORUM, all replicas up
    fixtures: [three-node-rf3]
    expect:
      - "result.ok && result.value.batchlog_removed == true"
      - "calls_by_instance['batch-store-verb-handler.do-verb@n2'] == 1 && calls_by_instance['batch-store-verb-handler.do-verb@n3'] == 1"
      - "calls['batch-remove-verb-handler.do-verb'] == 2 && size(state['batchlog-manager@n2'].batches) == 0 && size(state['batchlog-manager@n3'].batches) == 0"
      - "calls['storage-proxy.submit-hint'] == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'batch-store-verb-handler.do-verb')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'storage-proxy.send-to-hinted-replicas')[0].seq"
  - id: hb-logged-batch-no-batchlog-endpoint
    flow: hb-logged-batch
    name: No batchlog endpoint - unavailable before anything is written
    fixtures: [three-node-rf3]
    faults: [{target: replica-plans.for-batchlog-write, type: unavailable, status: 4096}]
    expect:
      - "!result.ok && result.error.code == 'unavailable' && result.error.status == 4096"
      - "calls['storage-proxy.wrap-batch-response-handler'] == 0 && calls['batch-store-verb-handler.do-verb'] == 0"
  - id: hb-logged-batch-replicas-unavailable
    flow: hb-logged-batch
    name: CL ALL with a replica down - unavailable before the batchlog write
    fixtures: [three-node-rf3]
    input: {consistency: ALL}
    state: {"gossiper@n1": {endpoint_state_map: {n3: {alive: false}}}}
    expect:
      - "!result.ok && result.error.code == 'unavailable'"
      - "calls['batch-store-verb-handler.do-verb'] == 0 && calls['batchlog-manager.store'] == 0"
      - "size(state['batchlog-manager@n2'].batches) == 0"
  - id: hb-logged-batch-batchlog-timeout
    flow: hb-logged-batch
    name: One batchlog endpoint hangs - write timeout BATCH_LOG at write_request_timeout, no mutation sent
    fixtures: [three-node-rf3]
    faults: [{target: batch-store-verb-handler.do-verb, type: timeout, instance: n3}]
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.status == 4352"
      - "result.error.data.write_type == 'BATCH_LOG' && result.error.data.received == 1 && result.error.data.block_for == 2"
      - "calls['storage-proxy.send-to-hinted-replicas'] == 0 && duration_ms >= 2000"
      - "size(state['batchlog-manager@n2'].batches) == 1 && size(state['batchlog-manager@n3'].batches) == 0"
  - id: hb-logged-batch-batchlog-failure
    flow: hb-logged-batch
    name: A batchlog endpoint replies with a failure - write failure BATCH_LOG at once
    fixtures: [three-node-rf3]
    faults: [{target: batch-store-verb-handler.do-verb, type: error, code: write-failure-response, instance: n2}]
    expect:
      - "!result.ok && result.error.code == 'write-failure' && result.error.status == 5376"
      - "calls['storage-proxy.send-to-hinted-replicas'] == 0 && duration_ms < 2000"
      - "size(state['batchlog-manager@n3'].batches) == 1"
  - id: hb-logged-batch-replica-timeout-hinted
    flow: hb-logged-batch
    name: One replica hangs - QUORUM still met, the replica is hinted, the batchlog removed
    fixtures: [three-node-rf3]
    faults: [{target: mutation-verb-handler.do-verb, type: timeout, instance: n2}]
    expect:
      - "result.ok && result.value.batchlog_removed == true"
      - "calls['storage-proxy.submit-hint'] == 2 && state['hints-service@n1'].total_hints == 2"
      - "size(state['batchlog-manager@n2'].batches) == 0 && size(state['batchlog-manager@n3'].batches) == 0"
  - id: hb-logged-batch-quorum-timeout
    flow: hb-logged-batch
    name: Two replicas hang - write timeout BATCH at 2000 ms (mutations sent in parallel), batchlog kept for replay
    fixtures: [three-node-rf3]
    faults:
      - {target: mutation-verb-handler.do-verb, type: timeout, instance: n2}
      - {target: mutation-verb-handler.do-verb, type: timeout, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.data.write_type == 'BATCH'"
      - "result.error.data.received == 1 && result.error.data.block_for == 2"
      - "calls['batch-remove-verb-handler.do-verb'] == 0 && size(state['batchlog-manager@n2'].batches) == 1 && size(state['batchlog-manager@n3'].batches) == 1"
      - "duration_ms >= 2000 && duration_ms < 3000"
  - id: hb-logged-batch-replica-failure
    flow: hb-logged-batch
    name: Two replicas reply with failures - write failure BATCH
    fixtures: [three-node-rf3]
    faults:
      - {target: mutation-verb-handler.do-verb, type: error, code: write-failure-response, instance: n2}
      - {target: mutation-verb-handler.do-verb, type: error, code: write-failure-response, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'write-failure' && result.error.status == 5376"
      - "result.error.data.write_type == 'BATCH' && result.error.data.failures == 2"
      - "size(state['batchlog-manager@n2'].batches) == 1"
  - id: hb-logged-batch-replica-down-hinted
    flow: hb-logged-batch
    name: A replica is down (gossip) - hinted without a message, QUORUM met, batchlog on the one live remote node
    fixtures: [three-node-rf3]
    state: {"gossiper@n1": {endpoint_state_map: {n2: {alive: false}}}}
    expect:
      - "result.ok && result.value.batchlog_removed == true"
      - "calls_by_instance['batch-store-verb-handler.do-verb@n3'] == 1 && calls['batch-store-verb-handler.do-verb'] == 1 && calls['batch-remove-verb-handler.do-verb'] == 1"
      - "calls['storage-proxy.submit-hint'] == 2 && state['hints-service@n1'].total_hints == 2"
      - "size(state['batchlog-manager@n3'].batches) == 0"
  - id: hb-logged-batch-view-quorum-for-remove
    flow: hb-logged-batch
    name: "View update at ONE: client succeeds on the local ack, but the batchlog stays until QUORUM acks"
    fixtures: [three-node-rf3]
    input: {consistency: ONE, require_quorum_for_remove: true}
    faults:
      - {target: mutation-verb-handler.do-verb, type: timeout, instance: n2}
      - {target: mutation-verb-handler.do-verb, type: timeout, instance: n3}
    expect:
      - "result.ok && result.value.batchlog_removed == false && ctx.batchCl == 'QUORUM'"
      - "calls['batch-remove-verb-handler.do-verb'] == 0 && size(state['batchlog-manager@n2'].batches) == 1"
  - id: hb-logged-batch-view-late-ack-removes
    flow: hb-logged-batch
    name: "View update at ONE: the client returns on the local ack; a remote ack after that completes QUORUM and removes the batchlog"
    fixtures: [three-node-rf3]
    input: {consistency: ONE, require_quorum_for_remove: true}
    faults:
      - {target: mutation-verb-handler.do-verb, type: latency, latency_ms: 300}
    expect:
      - "result.ok && result.value.batchlog_removed == false && ctx.batchCl == 'QUORUM'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'batchlog-response-handler.on-response' && e.late == true && e.t >= 300)"
      - "calls['batch-remove-verb-handler.do-verb'] == 2 && size(state['batchlog-manager@n2'].batches) == 0 && size(state['batchlog-manager@n3'].batches) == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'batch-remove-verb-handler.do-verb').all(e, e.t >= 300)"
  - id: hb-logged-batch-timeout-late-ack-removes
    flow: hb-logged-batch
    name: "QUORUM with n2 down and a slow batchlog write: get() times out 2000 ms after the request start, but n3's ack at 2200 ms is inside its callback's expiry, reaches requiredBeforeFinish and removes the batchlog"
    fixtures: [three-node-rf3]
    state: {"gossiper@n1": {endpoint_state_map: {n2: {alive: false}}}}
    faults:
      - {target: batch-store-verb-handler.do-verb, type: latency, latency_ms: 300, instance: n3}
      - {target: mutation-verb-handler.do-verb, type: latency, latency_ms: 1900, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.data.write_type == 'BATCH' && result.error.data.received == 1"
      - "calls['batch-remove-verb-handler.do-verb'] == 1 && size(state['batchlog-manager@n3'].batches) == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'batch-remove-verb-handler.do-verb').all(e, e.t >= 2200)"
  - id: hb-logged-batch-ack-after-expiry-dropped
    flow: hb-logged-batch
    name: "QUORUM with n2 down: n3 answers after its callback expired, so the response is dropped and the batchlog stays for replay"
    fixtures: [three-node-rf3]
    state: {"gossiper@n1": {endpoint_state_map: {n2: {alive: false}}}}
    faults:
      - {target: mutation-verb-handler.do-verb, type: latency, latency_ms: 2500, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.data.received == 1"
      - "calls['batch-remove-verb-handler.do-verb'] == 0 && size(state['batchlog-manager@n3'].batches) == 1"
  - id: hb-logged-batch-any-hints-count
    flow: hb-logged-batch
    name: "CL ANY with a replica down: the hint is written synchronously and counts as an ack"
    fixtures: [three-node-rf3]
    input: {consistency: ANY}
    state: {"gossiper@n1": {endpoint_state_map: {n2: {alive: false}}}}
    expect:
      - "result.ok && result.value.batchlog_removed == true"
      - "calls['storage-proxy.submit-hint'] == 2 && calls['storage-proxy-hint-runnable.run'] == 2 && state['hints-service@n1'].total_hints == 2"
  - id: hb-logged-batch-any-no-batchlog-endpoint
    flow: hb-logged-batch
    name: "CL ANY with both other nodes down: forBatchlogWrite falls back to this node but keeps CL TWO, so the batch is unavailable"
    fixtures: [three-node-rf3]
    input: {consistency: ANY}
    state: {"gossiper@n1": {endpoint_state_map: {n2: {alive: false}, n3: {alive: false}}}}
    expect:
      - "!result.ok && result.error.code == 'unavailable'"
      - "calls['batch-store-verb-handler.do-verb'] == 0 && calls['batchlog-manager.store'] == 0 && calls['storage-proxy.submit-hint'] == 0"
      - "size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-logged-batch-timeout-then-replay
    name: "Write then read: a batch whose mutations time out stays in n2's batchlog; n2's replay 10 s later delivers it and deletes it"
    fixtures: [three-node-rf3]
    faults: [{target: mutation-verb-handler.do-verb, type: timeout, instance: n3}, {target: mutation-verb-handler.do-verb, type: timeout, instance: n2}]
    steps:
      - {flow: hb-logged-batch, as: write}
      - {interface: batchlog-manager.count-all-batches, caller: operator, on: n2, input: {}, as: before}
      - {flow: hb-jmx-force-batchlog-replay, on: n2, at_ms: 10000, as: replay}
      - {interface: batchlog-manager.count-all-batches, caller: operator, on: n2, input: {}, as: after}
    expect:
      - "!steps.write.result.ok && steps.write.result.error.code == 'write-timeout'"
      - "steps.before.result.value.count == 1 && steps.replay.result.value.replayed == 1 && steps.after.result.value.count == 0"
      - "calls_by_instance['batchlog-manager-replaying-batch.send-single-replay-mutation@n2'] == 2 && size(state['batchlog-manager@n2'].batches) == 0"

  # ---------------------------------------------------------------- batchlog verbs
  - id: hb-batch-store-stores-and-replies
    flow: hb-batch-store-verb
    name: BATCH_STORE_REQ stores the batch row on n2 and replies
    fixtures: [three-node-rf3]
    input: {batch: {id: "b-1", creation_time: 1793318400000000}}
    expect:
      - "result.ok && result.value.responded == true"
      - "'b-1' in state['batchlog-manager@n2'].batches && state['batchlog-manager@n2'].batches['b-1'].version == 12"
      - "!('b-1' in state['batchlog-manager@n1'].batches)"
  - id: hb-batch-store-then-count
    name: "Write then read: BATCH_STORE on n2, then countAllBatches on n2 sees it and on n1 does not"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-batch-store-verb, input: {batch: {id: "b-1", creation_time: 1793318400000000}}}
      - {interface: batchlog-manager.count-all-batches, caller: operator, on: n2, input: {}, as: n2count}
      - {interface: batchlog-manager.count-all-batches, caller: operator, on: n1, input: {}, as: n1count}
    expect:
      - "steps.n2count.result.value.count == 1 && steps.n1count.result.value.count == 0"
      - "'b-1' in state['batchlog-manager@n2'].batches"
  - id: hb-batch-remove-no-response
    flow: hb-batch-remove-verb
    name: BATCH_REMOVE_REQ deletes the row and sends nothing back
    fixtures: [three-node-rf3]
    state:
      batchlog-manager@n2:
        batches:
          "b-1": {id: "b-1", written_at_ms: 1793318400000, version: 12, gc_grace_seconds: 864000, mutations: []}
    expect:
      - "result.ok && result.value.responded == false"
      - "size(state['batchlog-manager@n2'].batches) == 0"
  - id: hb-batch-store-remove-count
    name: "Write then read: BATCH_STORE then BATCH_REMOVE on n2, then countAllBatches is 0"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-batch-store-verb, input: {batch: {id: "b-1", creation_time: 1793318400000000}}}
      - {flow: hb-batch-remove-verb, input: {id: "b-1"}}
      - {interface: batchlog-manager.count-all-batches, caller: operator, on: n2, input: {}, as: count}
    expect:
      - "steps.count.result.value.count == 0"
      - "size(state['batchlog-manager@n2'].batches) == 0"

  # ---------------------------------------------------------------- batchlog replay
  - id: hb-replay-stale-batch
    flow: hb-batchlog-replay
    name: The first replay runs after RING_DELAY (30 s) and replays a batch older than 4 s to all replicas
    fixtures: [three-node-rf3]
    state: &stale-batch
      batchlog-manager@n1:
        batches:
          "b-old":
            id: "b-old"
            written_at_ms: 1793318390000
            version: 12
            gc_grace_seconds: 864000
            mutations:
              - {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}
    expect:
      - "passes[0].start_ms >= 30000 && passes[0].result.ok && passes[0].result.value.replayed == 1 && passes[1].result.value.replayed == 0"
      - "calls_by_instance['mutation.apply@n1'] == 1 && calls_by_instance['mutation-verb-handler.do-verb@n2'] == 1 && calls_by_instance['mutation-verb-handler.do-verb@n3'] == 1"
      - "size(state['batchlog-manager@n1'].batches) == 0 && state['batchlog-manager@n1'].total_batches_replayed == 1"
      - "ctx.replayThrottleKiBPerEndpoint == 341 && size(state['hints-buffer@n1'].hints) == 0"
  - id: hb-replay-young-batch-waits
    flow: hb-batchlog-replay
    name: A batch younger than BATCHLOG_REPLAY_TIMEOUT waits for the next pass
    fixtures: [three-node-rf3]
    state:
      batchlog-manager@n1:
        batches:
          "b-young":
            id: "b-young"
            written_at_ms: 1793318428000
            version: 12
            gc_grace_seconds: 864000
            mutations:
              - {keyspace: shop, table: orders, partition_key: "order:7", token: 1234, timestamp: 1793318428000000, columns: {total: 7}}
    expect:
      - "passes[0].result.value.replayed == 0 && passes[1].result.value.replayed == 1"
      - "calls['batchlog-manager-replaying-batch.send-single-replay-mutation'] == 1 && size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-replay-dead-replica-hinted
    flow: hb-batchlog-replay
    name: A dead replica gets a hint directly (no shouldHint, no hint window); the batch is deleted after fsync
    fixtures: [three-node-rf3]
    state:
      batchlog-manager@n1:
        batches:
          "b-old":
            id: "b-old"
            written_at_ms: 1793318390000
            version: 12
            gc_grace_seconds: 864000
            mutations:
              - {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}
      gossiper@n1: {endpoint_state_map: {n2: {alive: false}}}
    expect:
      - "passes[0].result.ok && calls['mutation-verb-handler.do-verb'] == 1 && calls['storage-proxy.should-hint'] == 0"
      - "size(state['hints-buffer@n1'].hints) == 0 && size(state['hints-store@n1'].hints) == 1"
      - "calls['hints-disk.hints-file-fsync'] == 1 && size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-replay-timeout-hinted-twice
    flow: hb-batchlog-replay
    name: A replay write times out - hinted by the handler's hintOnFailure and again by writeHintsForUndeliveredEndpoints
    fixtures: [three-node-rf3]
    state: *stale-batch
    faults: [{target: mutation-verb-handler.do-verb, type: timeout, instance: n2}]
    expect:
      - "passes[0].result.ok && calls['batchlog-manager-replaying-batch.write-hints-for-undelivered-endpoints'] == 1"
      - "calls['storage-proxy.submit-hint'] == 1 && calls['hints-service.write'] == 2"
      - "size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-replay-expired-batch-dropped
    flow: hb-batchlog-replay
    name: A batch older than gc_grace_seconds is deleted without replay
    fixtures: [three-node-rf3]
    state:
      batchlog-manager@n1:
        batches:
          "b-expired":
            id: "b-expired"
            written_at_ms: 1792454399000
            version: 12
            gc_grace_seconds: 864000
            mutations:
              - {keyspace: shop, table: orders, partition_key: "order:9", token: 99, timestamp: 1792454399000000, columns: {total: 9}}
    expect:
      - "passes[0].result.value.replayed == 1 && ctx.batchExpired == true"
      - "calls['mutation-verb-handler.do-verb'] == 0 && calls['mutation.apply'] == 0 && size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-replay-local-apply-fails
    flow: hb-batchlog-replay
    name: The inline local apply fails - the replay task aborts and the batch stays
    fixtures: [three-node-rf3]
    state: *stale-batch
    faults: [{target: mutation.apply, type: error, code: write-failure-local, instance: n1}]
    expect:
      - "!passes[0].result.ok && passes[0].result.error.code == 'write-failure-local'"
      - "size(state['batchlog-manager@n1'].batches) == 1 && state['batchlog-manager@n1'].total_batches_replayed == 0"
  - id: hb-replay-write-then-replay
    name: "Write then read: a batch stored on n1, replayed 5 s later, is gone from countAllBatches"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-batch-store-verb, on: n1, input: {batch: {id: "b-1", creation_time: 1793318400000000, mutations: [{keyspace: shop, table: orders, partition_key: "order:3", token: 77, timestamp: 1793318400000000, columns: {total: 3}}]}}}
      - {flow: hb-batchlog-replay, at_ms: 5000, as: replay}
      - {interface: batchlog-manager.count-all-batches, caller: operator, input: {}, as: count}
    expect:
      - "steps.replay.result.value.replayed == 1 && steps.count.result.value.count == 0"
      - "calls_by_instance['mutation-verb-handler.do-verb@n2'] == 1"
      - "size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-jmx-force-replay
    flow: hb-jmx-force-batchlog-replay
    name: forceBatchlogReplay replays a stale batch and waits
    fixtures: [three-node-rf3]
    state: *stale-batch
    expect:
      - "result.ok && result.value.replayed == 1 && size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-replay-throttle-charges-next-batch
    flow: hb-jmx-force-batchlog-replay
    name: "Throttle 3 KiB/s over 3 endpoints = 1 KiB/s each: the first batch spends the 1 s burst, the second is granted at once but pushes the ticket 1 s back, so only the third waits (about 1 s, not 1 s per batch)"
    fixtures: [three-node-rf3]
    config: {batchlog-replay-throttle-kib: 3}
    state:
      batchlog-manager@n1:
        batches:
          "b-1": {id: "b-1", written_at_ms: 1793318390000, version: 12, gc_grace_seconds: 864000, mutations: [{keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}, {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}]}
          "b-2": {id: "b-2", written_at_ms: 1793318390000, version: 12, gc_grace_seconds: 864000, mutations: [{keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}, {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}]}
          "b-3": {id: "b-3", written_at_ms: 1793318390000, version: 12, gc_grace_seconds: 864000, mutations: [{keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}, {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318390000000, columns: {total: 42}}]}
    expect:
      - "result.ok && result.value.replayed == 3 && size(state['batchlog-manager@n1'].batches) == 0"
      - "ctx.replayThrottleKiBPerEndpoint == 1 && state['batchlog-manager-rate-limiter@n1'].bytes_per_sec == 1024"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'batchlog-manager-rate-limiter.acquire').map(e, e.output.waited_us).filter(w, w == 0).size() == 2"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'batchlog-manager-rate-limiter.acquire').map(e, e.output.waited_us).exists(w, w > 800000 && w < 1000000)"
      - "size(trace.filter(e, e.type == 'call.end' && e.interface == 'batchlog-manager-rate-limiter.acquire')) == 3 && duration_ms >= 900 && duration_ms < 1500"
  - id: hb-jmx-count-batches
    flow: hb-jmx-count-all-batches
    name: countAllBatches counts this node's batchlog rows
    fixtures: [three-node-rf3]
    state:
      batchlog-manager@n1:
        batches:
          "a": {id: a, written_at_ms: 1793318400000, version: 12, mutations: []}
          "b": {id: b, written_at_ms: 1793318400000, version: 12, mutations: []}
    expect: ["result.ok && result.value.count == 2"]

  # ---------------------------------------------------------------- hint writing
  - id: hb-submit-hint-buffered
    flow: hb-submit-hint
    name: A hint is queued on the MUTATION stage and lands in n1's buffer under n2's host id
    fixtures: [three-node-rf3]
    expect:
      - "result.ok && result.value.queued == true && result.value.counted_as_ack == false"
      - "size(state['hints-buffer@n1'].hints) == 1 && state['hints-service@n1'].total_hints == 1"
      - "'6d194555-f6eb-41d0-c000-000000000002' in state['hints-catalog@n1'].stores"
  - id: hb-submit-hint-target-left-ring
    flow: hb-submit-hint
    name: The target is no longer in the ring - the hint is discarded
    fixtures: [three-node-rf3]
    faults: [{target: storage-service.get-host-id-for-endpoint, type: error, code: not-in-ring}]
    expect:
      - "result.ok && ctx.hintsDiscarded == ['n2']"
      - "calls['hints-service.write'] == 1 && size(state['hints-buffer@n1'].hints) == 0"
  - id: hb-submit-hint-any
    flow: hb-submit-hint
    name: With a CL ANY handler the hint write counts as the ack
    fixtures: [three-node-rf3]
    input: {consistency: ANY}
    expect:
      - "result.ok && result.value.counted_as_ack == true && calls['storage-proxy-hint-runnable.run'] == 1"
      - "state['hints-service@n1'].total_hints == 1"
  - id: hb-submit-hint-service-shut-down
    flow: hb-submit-hint
    name: HintsService shut down - the stage task fails, the caller is unaffected
    fixtures: [three-node-rf3]
    state: {hints-service@n1: {shut_down: true}}
    expect:
      - "result.ok && size(state['hints-buffer@n1'].hints) == 0 && state['hints-service@n1'].total_hints == 0"
  - id: hb-submit-hint-then-window
    name: "Write then read: a hint submitted, flushed, then findOldestHintTimestamp returns its epoch-ms creation time"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-submit-hint, as: submit}
      - {flow: hb-hints-flush, at_ms: 10000}
      - {flow: hb-hint-window-lookup, as: oldest}
    expect:
      - "steps.submit.result.ok && steps.oldest.result.value.timestamp >= 1793318400000 && steps.oldest.result.value.timestamp < 1793318410000"
      - "size(state['hints-store@n1'].hints) == 1"

  # ---------------------------------------------------------------- flush
  - id: hb-flush-moves-buffer-to-files
    flow: hb-hints-flush
    name: The periodic flush (after hints_flush_period) writes buffered hints into the hosts' open files
    fixtures: [three-node-rf3]
    state: &buffered
      hints-buffer@n1:
        hints:
          "6d194555-f6eb-41d0-c000-000000000002:order:1:1": {key: "6d194555-f6eb-41d0-c000-000000000002:order:1:1", host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: buffered, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
          "6d194555-f6eb-41d0-c000-000000000003:order:2:1": {key: "6d194555-f6eb-41d0-c000-000000000003:order:2:1", host_id: "6d194555-f6eb-41d0-c000-000000000003", stage: buffered, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:2", token: 2, timestamp: 1, columns: {}}}}
    expect:
      - "passes[0].start_ms >= 10000 && result.ok && result.value.flushed == 2 && calls['hints-disk.hints-file-append'] == 2"
      - "size(state['hints-buffer@n1'].hints) == 0 && size(state['hints-store@n1'].hints) == 2"
      - "state['hints-store@n1'].hints['6d194555-f6eb-41d0-c000-000000000002:order:1:1'].stage == 'writing'"
  - id: hb-flush-disk-failure
    flow: hb-hints-flush
    name: The hints disk fails - FSWriteError propagates, hints stay buffered
    fixtures: [three-node-rf3]
    state: *buffered
    faults: [{target: hints-disk.hints-file-append, type: error, code: fs-write-error}]
    expect:
      - "!result.ok && result.error.code == 'fs-write-error'"
      - "size(state['hints-buffer@n1'].hints) == 2 && size(state['hints-store@n1'].hints) == 0"
  - id: hb-flush-then-size
    name: "Write then read: a hint submitted and flushed is counted by getTotalHintsSize"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-submit-hint}
      - {flow: hb-hints-flush, as: flush}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}, as: size}
    expect:
      - "steps.flush.result.value.flushed == 1 && steps.size.result.value.bytes == 512"
      - "size(state['hints-store@n1'].hints) == 1 && size(state['hints-buffer@n1'].hints) == 0"

  # ---------------------------------------------------------------- dispatch
  - id: hb-dispatch-delivered
    flow: hb-hints-dispatch
    name: The first poll (10 s) dispatches a closed hints file for a live host to n2, which applies it; the file is deleted
    fixtures: [three-node-rf3]
    state: &file-ready
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-store@n1:
        hints:
          "6d194555-f6eb-41d0-c000-000000000002:order:1:1": {key: "6d194555-f6eb-41d0-c000-000000000002:order:1:1", host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318400000000, columns: {total: 42}}}}
    expect:
      - "passes[0].start_ms >= 10000 && passes[0].result.value.scheduled == 1 && calls_by_instance['hint-verb-handler.do-verb@n2'] == 1"
      - "calls_by_instance['mutation.apply-future@n2'] == 1 && ctx.hintOutcome == 'applied'"
      - "size(state['hints-store@n1'].hints) == 0 && ctx.hintsDelivered == 1 && size(state['hints-dispatch-executor@n1'].scheduled) == 0"
  - id: hb-dispatch-writer-closed-then-delivered
    flow: hb-hints-dispatch
    name: An open writer is closed on one poll and its file delivered on the next
    fixtures: [three-node-rf3]
    state:
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-store@n1:
        hints:
          "6d194555-f6eb-41d0-c000-000000000002:order:1:1": {key: "6d194555-f6eb-41d0-c000-000000000002:order:1:1", host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: writing, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318400000000, columns: {total: 42}}}}
    expect:
      - "passes[0].result.value.scheduled == 0 && passes[1].result.value.scheduled == 1"
      - "calls['hint-verb-handler.do-verb'] == 1 && size(state['hints-store@n1'].hints) == 0"
  - id: hb-dispatch-paused
    flow: hb-hints-dispatch
    name: Dispatch paused - nothing is sent
    fixtures: [three-node-rf3]
    state:
      hints-service@n1: {dispatch_paused: true}
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-store@n1:
        hints:
          "6d194555-f6eb-41d0-c000-000000000002:order:1:1": {key: "6d194555-f6eb-41d0-c000-000000000002:order:1:1", host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
    expect:
      - "calls['hints-catalog.stores'] == 0 && calls['hint-verb-handler.do-verb'] == 0 && size(state['hints-store@n1'].hints) == 1"
  - id: hb-dispatch-already-scheduled
    flow: hb-hints-dispatch
    name: A store whose dispatch is still running is skipped (isScheduled)
    fixtures: [three-node-rf3]
    state:
      hints-dispatch-executor@n1: {scheduled: {"6d194555-f6eb-41d0-c000-000000000002": true}}
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-store@n1:
        hints:
          "6d194555-f6eb-41d0-c000-000000000002:order:1:1": {key: "6d194555-f6eb-41d0-c000-000000000002:order:1:1", host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
    expect:
      - "calls['hints-store.is-live'] == 0 && calls['hints-dispatch-executor.dispatch'] == 0 && size(state['hints-store@n1'].hints) == 1"
  - id: hb-dispatch-target-down
    flow: hb-hints-dispatch
    name: The target is down in n1's view - its store is skipped and the hints kept
    fixtures: [three-node-rf3]
    state:
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-store@n1:
        hints:
          "6d194555-f6eb-41d0-c000-000000000002:order:1:1": {key: "6d194555-f6eb-41d0-c000-000000000002:order:1:1", host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
      gossiper@n1: {endpoint_state_map: {n2: {alive: false}}}
    expect:
      - "calls['hints-dispatch-executor.dispatch'] == 0 && calls['hint-verb-handler.do-verb'] == 0"
      - "size(state['hints-store@n1'].hints) == 1"
  - id: hb-dispatch-timeout-retried
    flow: hb-hints-dispatch
    name: A HINT_REQ times out - the page aborts, the file is kept and delivered on the next poll
    fixtures: [three-node-rf3]
    state: *file-ready
    faults: [{target: hint-verb-handler.do-verb, type: timeout, calls: [1]}]
    expect:
      - "calls['hint-verb-handler.do-verb'] == 2 && ctx.dispatchAborted == 'page-failed'"
      - "size(state['hints-store@n1'].hints) == 0"
  - id: hb-dispatch-orphan-skipped
    flow: hb-hints-dispatch
    name: "The host left the ring: the poll skips the store (isLive needs an address), so its hints are never converted here"
    fixtures: [three-node-rf3]
    state: *file-ready
    faults: [{target: storage-service.get-endpoint-for-host-id, type: error, code: not-in-ring}]
    expect:
      - "calls['hints-dispatch-executor.dispatch'] == 0 && calls['hints-service.write-for-all-replicas'] == 0"
      - "size(state['hints-store@n1'].hints) == 1"
  - id: hb-dispatch-node-comes-back
    name: "H1: n2 is down when hinted; the 10 s poll skips it; after n2 is marked alive the next polls close the writer and deliver"
    fixtures: [three-node-rf3]
    state: {"gossiper@n1": {endpoint_state_map: {n2: {alive: false}}}}
    steps:
      - {flow: hb-submit-hint, as: submit}
      - {flow: hb-hints-flush, at_ms: 10000}
      - {flow: hb-hints-dispatch, at_ms: 20000, as: poll1}
      - {interface: gossiper.real-mark-alive, caller: membership, input: {endpoint: n2}, at_ms: 25000}
      - {flow: hb-hints-dispatch, at_ms: 30000, as: poll2}
      - {flow: hb-hints-dispatch, at_ms: 40000, as: poll3}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}, as: size}
    expect:
      - "steps.poll1.result.value.scheduled == 0 && steps.poll2.result.value.scheduled == 0 && steps.poll3.result.value.scheduled == 1"
      - "calls_by_instance['hint-verb-handler.do-verb@n2'] == 1 && steps.size.result.value.bytes == 0"
      - "size(state['hints-store@n1'].hints) == 0 && size(state['hints-dispatch-executor@n1'].scheduled) == 0"
  - id: hb-dispatch-task-converts
    flow: hb-hints-dispatch-task
    name: A dispatch task finds the host gone - each hint is re-addressed to the current replicas
    fixtures: [three-node-rf3]
    state: *file-ready
    faults: [{target: storage-service.get-endpoint-for-host-id, type: error, code: not-in-ring}]
    expect:
      - "result.ok && result.value.converted == 1 && calls['hints-service.write-for-all-replicas'] == 1"
      - "calls['storage-proxy.should-hint'] == 3 && size(state['hints-store@n1'].hints) == 0"
      - "calls['hints-service.write'] == 1 && state['hints-service@n1'].total_hints > 0"
  - id: hb-dispatch-task-delivers
    flow: hb-hints-dispatch-task
    name: A dispatch task delivers the store's file
    fixtures: [three-node-rf3]
    state: *file-ready
    expect:
      - "result.ok && result.value.completed == true && result.value.delivered == 1 && size(state['hints-store@n1'].hints) == 0"
  - id: hb-dispatch-task-then-size
    name: "Write then read: after a dispatch task delivers, getTotalHintsSize for n2 is 0"
    fixtures: [three-node-rf3]
    state: *file-ready
    steps:
      - {flow: hb-hints-dispatch-task, as: task}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}, as: size}
    expect:
      - "steps.task.result.value.delivered == 1 && steps.size.result.value.bytes == 0"
      - "size(state['hints-store@n1'].hints) == 0"

  # ---------------------------------------------------------------- HINT_REQ handler
  - id: hb-hint-verb-applied
    flow: hb-hint-verb
    name: The hint is validated, applied on n2 and acknowledged
    fixtures: [three-node-rf3]
    expect:
      - "result.ok && result.value.responded == true && result.value.outcome == 'applied'"
      - "calls_by_instance['mutation.apply-future@n2'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'mutation.apply-future' && e.instance == 'n2') && !trace.exists(e, e.type == 'call.start' && e.interface == 'mutation.apply-future' && e.instance == 'n1')"
  - id: hb-hint-verb-unknown-table
    flow: hb-hint-verb
    name: The hint's table was dropped - acknowledged without applying
    fixtures: [three-node-rf3]
    input: {unknown_table_id: "5a1c395e-b41f-11e5-9f22-ba0be0483c18"}
    expect:
      - "result.ok && result.value.outcome == 'unknown-table' && calls['mutation.apply-future'] == 0 && size(state['hints-buffer@n2'].hints) == 0"
  - id: hb-hint-verb-invalid
    flow: hb-hint-verb
    name: Validation fails - acknowledged and skipped
    fixtures: [three-node-rf3]
    choices: {hint-verb-handler.do-verb.validation: invalid}
    expect:
      - "result.ok && result.value.outcome == 'invalid' && calls['mutation.apply-future'] == 0 && size(state['hints-buffer@n2'].hints) == 0"
  - id: hb-hint-verb-other-host
    flow: hb-hint-verb
    name: A hint for n3 delivered to n2 (transferred on decommission) is stored in n2's hints
    fixtures: [three-node-rf3]
    input: {host_id: "6d194555-f6eb-41d0-c000-000000000003"}
    expect:
      - "result.ok && result.value.outcome == 'stored-for-other-host' && calls['mutation.apply-future'] == 0"
      - "size(state['hints-buffer@n2'].hints) == 1"
  - id: hb-hint-verb-other-host-then-size
    name: "Write then read: a hint for n3 stored on n2, flushed, is counted in n2's hints for n3"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-hint-verb, input: {host_id: "6d194555-f6eb-41d0-c000-000000000003"}}
      - {flow: hb-hints-flush, on: n2}
      - {interface: hints-service.get-total-hints-size, caller: coordination, on: n2, input: {host_id: "6d194555-f6eb-41d0-c000-000000000003"}, as: size}
    expect:
      - "steps.size.result.value.bytes == 512"
      - "size(state['hints-store@n2'].hints) == 1"
  - id: hb-hint-verb-not-owned
    flow: hb-hint-verb
    name: The token is no longer owned here - the hint is re-addressed to all current replicas
    fixtures: [three-node-rf3]
    faults: [{target: storage-proxy.applies-locally, type: error, code: not-a-replica}]
    expect:
      - "result.ok && result.value.outcome == 'readdressed' && calls['hints-service.write-for-all-replicas'] == 1"
      - "calls['mutation.apply-future'] == 0"
      - "size(state['hints-buffer@n2'].hints) > 0"
  - id: hb-hint-verb-apply-fails
    flow: hb-hint-verb
    name: The apply fails - no HINT_RSP is sent
    fixtures: [three-node-rf3]
    faults: [{target: mutation.apply-future, type: error, code: write-failure-local}]
    expect:
      - "!result.ok && result.error.code == 'no-response' && ctx.hintOutcome == 'apply-failed'"
  - id: hb-hint-verb-expired
    flow: hb-hint-verb
    name: An expired hint is acknowledged but not applied
    fixtures: [three-node-rf3]
    input: {hint: {creation_time: 1792454399999}}
    expect:
      - "result.ok && result.value.outcome == 'expired' && calls['mutation.apply-future'] == 0 && size(state['hints-buffer@n2'].hints) == 0"

  # ---------------------------------------------------------------- JMX hint operations
  - id: hb-jmx-pause
    flow: hb-jmx-pause-dispatch
    name: pauseDispatch sets the paused flag
    fixtures: [three-node-rf3]
    expect: ["result.ok && state['hints-service@n1'].dispatch_paused == true"]
  - id: hb-jmx-pause-then-read
    name: "Write then read: pauseDispatch, then isDispatchPaused is true"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-jmx-pause-dispatch}
      - {interface: hints-service.is-dispatch-paused, caller: operator, as: p}
    expect:
      - "steps.p.result.value.paused == true"
      - "state['hints-service@n1'].dispatch_paused == true"
  - id: hb-jmx-resume
    flow: hb-jmx-resume-dispatch
    name: resumeDispatch clears the paused flag
    fixtures: [three-node-rf3]
    state: {hints-service@n1: {dispatch_paused: true}}
    expect: ["result.ok && state['hints-service@n1'].dispatch_paused == false"]
  - id: hb-jmx-pause-resume-then-read
    name: "Write then read: pause, resume, then isDispatchPaused is false"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-jmx-pause-dispatch}
      - {flow: hb-jmx-resume-dispatch}
      - {interface: hints-service.is-dispatch-paused, caller: operator, as: p}
    expect:
      - "steps.p.result.value.paused == false"
      - "state['hints-service@n1'].dispatch_paused == false"
  - id: hb-jmx-delete-all
    flow: hb-jmx-delete-all-hints
    name: deleteAllHints deletes dispatchable files but not the open writer's
    fixtures: [three-node-rf3]
    state:
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-store@n1:
        hints:
          "f1": {key: f1, host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
          "w1": {key: w1, host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: writing, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:2", token: 2, timestamp: 1, columns: {}}}}
    expect:
      - "result.ok && result.value.deleted == 1 && size(state['hints-store@n1'].hints) == 1 && 'w1' in state['hints-store@n1'].hints"
  - id: hb-jmx-delete-all-then-size
    name: "Write then read: a hint flushed into the open writer survives deleteAllHints (getTotalHintsSize still 512)"
    fixtures: [three-node-rf3]
    steps:
      - {flow: hb-submit-hint}
      - {flow: hb-hints-flush}
      - {flow: hb-jmx-delete-all-hints, as: del}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}, as: size}
    expect:
      - "steps.del.result.value.deleted == 0 && steps.size.result.value.bytes == 512"
      - "size(state['hints-store@n1'].hints) == 1"
  - id: hb-jmx-delete-for-endpoint
    flow: hb-jmx-delete-hints-for-endpoint
    name: deleteAllHintsForEndpoint deletes that host's files
    fixtures: [three-node-rf3]
    state: *file-ready
    expect: ["result.ok && result.value.deleted == 1 && size(state['hints-store@n1'].hints) == 0"]
  - id: hb-jmx-delete-for-endpoint-then-size
    name: "Write then read: deleteAllHintsForEndpoint n2, then getTotalHintsSize for n2 is 0"
    fixtures: [three-node-rf3]
    state: *file-ready
    steps:
      - {flow: hb-jmx-delete-hints-for-endpoint}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}, as: size}
    expect:
      - "steps.size.result.value.bytes == 0"
      - "size(state['hints-store@n1'].hints) == 0"
  - id: hb-jmx-delete-for-unknown-endpoint
    flow: hb-jmx-delete-hints-for-endpoint
    name: An unknown address is refused
    fixtures: [three-node-rf3]
    faults: [{target: storage-service.get-host-id-for-endpoint, type: error, code: not-in-ring}]
    expect: ["!result.ok && result.error.code == 'illegal-argument-exception'"]

  # ---------------------------------------------------------------- cleanup, transfer, excise, window
  - id: hb-cleanup-disabled
    flow: hb-hints-cleanup
    name: auto_hints_cleanup_enabled is false in the deployed config - nothing happens
    fixtures: [three-node-rf3]
    expect: ["result.ok && result.value.orphans == 0 && calls['hints-catalog.stores'] == 0 && config['auto-hints-cleanup-enabled'] == false && size(state['hints-store@n1'].hints) == 0"]
  - id: hb-cleanup-orphan-expired
    flow: hb-hints-cleanup
    name: "Cleanup enabled: an orphaned file last written 15 minutes before the run is deleted (gcgs seconds added as ms)"
    fixtures: [three-node-rf3]
    config: {auto-hints-cleanup-enabled: true}
    state: &orphans
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000009": {host_id: "6d194555-f6eb-41d0-c000-000000000009"}
      hints-store@n1:
        hints:
          "old": {key: old, host_id: "6d194555-f6eb-41d0-c000-000000000009", stage: file, creation_time: 1793321100000, size_bytes: 512, hint: {creation_time: 1793321100000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
          "new": {key: new, host_id: "6d194555-f6eb-41d0-c000-000000000009", stage: file, creation_time: 1793321940000, size_bytes: 512, hint: {creation_time: 1793321940000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:2", token: 2, timestamp: 1, columns: {}}}}
    expect:
      - "passes[0].start_ms >= 3600000 && result.ok && result.value.orphans == 1 && calls['hints-store.delete-expired-hints'] == 1"
      - "size(state['hints-store@n1'].hints) == 1 && 'new' in state['hints-store@n1'].hints"
  - id: hb-cleanup-orphan-then-size
    name: "Write then read: after the cleanup, getTotalHintsSize for the orphaned host counts only the recent file"
    fixtures: [three-node-rf3]
    config: {auto-hints-cleanup-enabled: true}
    state: *orphans
    steps:
      - {flow: hb-hints-cleanup, at_ms: 3600000}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000009"}, as: size}
    expect:
      - "steps.size.result.value.bytes == 512"
      - "size(state['hints-store@n1'].hints) == 1 && 'new' in state['hints-store@n1'].hints"
  - id: hb-cleanup-store-not-orphaned
    flow: hb-hints-cleanup
    name: "Cleanup enabled: a store whose host is still in the ring is left alone"
    fixtures: [three-node-rf3]
    config: {auto-hints-cleanup-enabled: true}
    state:
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
    expect: ["result.ok && result.value.orphans == 0 && calls['hints-store.delete-expired-hints'] == 0 && size(state['hints-catalog@n1'].stores) == 1"]
  - id: hb-transfer-ok
    flow: hb-hints-transfer
    name: Decommission transfers every file to the target
    fixtures: [three-node-rf3]
    state: *file-ready
    expect:
      - "result.ok && result.value.transferred == true && calls['hint-verb-handler.do-verb'] == 1"
      - "size(state['hints-store@n1'].hints) == 0 && state['hints-service@n1'].dispatch_paused == false"
  - id: hb-transfer-then-size
    name: "Write then read: after the transfer, n1 holds no hints for n2"
    fixtures: [three-node-rf3]
    state: *file-ready
    steps:
      - {flow: hb-hints-transfer}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}, as: size}
    expect:
      - "steps.size.result.value.bytes == 0"
      - "size(state['hints-store@n1'].hints) == 0"
  - id: hb-transfer-fails
    flow: hb-hints-transfer
    name: The target never acknowledges - one retry after 10 s, then RuntimeException
    fixtures: [three-node-rf3]
    state: *file-ready
    faults: [{target: hint-verb-handler.do-verb, type: timeout}]
    expect:
      - "!result.ok && result.error.code == 'runtime-exception' && calls['hint-verb-handler.do-verb'] == 2"
      - "duration_ms >= 14000 && size(state['hints-store@n1'].hints) == 1"
  - id: hb-excise-removes-everything
    flow: hb-hints-excise
    name: Excise flushes, closes and deletes all of a host's hints and drops its store
    fixtures: [three-node-rf3]
    state: &excise-state
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-buffer@n1:
        hints:
          "b1": {key: b1, host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: buffered, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
      hints-store@n1:
        hints:
          "f1": {key: f1, host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:2", token: 2, timestamp: 1, columns: {}}}}
    expect:
      - "result.ok && size(state['hints-buffer@n1'].hints) == 0 && size(state['hints-store@n1'].hints) == 0"
      - "size(state['hints-catalog@n1'].stores) == 0"
  - id: hb-excise-then-size
    name: "Write then read: after excise, getTotalHintsSize for the host is 0"
    fixtures: [three-node-rf3]
    state: *excise-state
    steps:
      - {flow: hb-hints-excise}
      - {interface: hints-service.get-total-hints-size, caller: coordination, input: {host_id: "6d194555-f6eb-41d0-c000-000000000002"}, as: size}
    expect:
      - "steps.size.result.value.bytes == 0"
      - "size(state['hints-catalog@n1'].stores) == 0"
  - id: hb-window-no-hints
    flow: hb-hint-window-lookup
    name: No hints for the host - Long.MAX_VALUE
    fixtures: [three-node-rf3]
    expect: ["result.ok && result.value.timestamp == 9223372036854775807 && '6d194555-f6eb-41d0-c000-000000000002' in state['hints-catalog@n1'].stores"]
  - id: hb-window-oldest
    flow: hb-hint-window-lookup
    name: The oldest held hint's timestamp, in epoch ms
    fixtures: [three-node-rf3]
    state:
      hints-store@n1:
        hints:
          "a": {key: a, host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793311200000, size_bytes: 512, hint: {creation_time: 1793311200000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: 1, timestamp: 1, columns: {}}}}
          "b": {key: b, host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: writing, creation_time: 1793318340000, size_bytes: 512, hint: {creation_time: 1793318340000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:2", token: 2, timestamp: 1, columns: {}}}}
    expect: ["result.ok && result.value.timestamp == 1793311200000 && size(state['hints-store@n1'].hints) == 2"]
  - id: hb-batchlog-start-schedules-replay
    name: "BatchlogManager.start: the first replay runs RING_DELAY (30 s) after start and replays an old batch"
    fixtures: [three-node-rf3]
    state: *stale-batch
    steps:
      - {interface: batchlog-manager.start, caller: membership, as: start}
    expect:
      - "steps.start.result.value.scheduled == true && calls['batchlog-manager.replay-failed-batches'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'batchlog-manager.replay-failed-batches' && e.t >= 30000)"
      - "size(state['batchlog-manager@n1'].batches) == 0"
  - id: hb-start-dispatch-schedules-poll
    name: "HintsService.startDispatch: the first dispatch poll runs 10 s after start and delivers a ready file"
    fixtures: [three-node-rf3]
    state:
      hints-service@n1: {dispatch_paused: true}
      hints-catalog@n1:
        stores:
          "6d194555-f6eb-41d0-c000-000000000002": {host_id: "6d194555-f6eb-41d0-c000-000000000002"}
      hints-store@n1:
        hints:
          "6d194555-f6eb-41d0-c000-000000000002:order:1:1": {key: "6d194555-f6eb-41d0-c000-000000000002:order:1:1", host_id: "6d194555-f6eb-41d0-c000-000000000002", stage: file, creation_time: 1793318400000, size_bytes: 512, hint: {creation_time: 1793318400000, gcgs: 864000, mutation: {keyspace: shop, table: orders, partition_key: "order:1", token: -4069959284402364209, timestamp: 1793318400000000, columns: {total: 42}}}}
    steps:
      - {interface: hints-service.start-dispatch, caller: membership}
    expect:
      - "state['hints-service@n1'].dispatch_paused == false && size(state['hints-store@n1'].hints) == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'hints-dispatch-trigger.run' && e.t >= 10000)"
