        type: string
        default: ''
  behavior:
  - if: ('entire-sstable-throughput' in input.options && input.options['entire-sstable-throughput']) && ('mib' in input.options && input.options['mib'])
    then:
    - title: -e and -m are exclusive
      source: src/java/org/apache/cassandra/tools/nodetool/SetInterDCStreamThroughput.java:45
      fail:
        code: illegal-argument-exception
        message: You cannot use -e and -m at the same time
  - if: '''entire-sstable-throughput'' in input.options && input.options[''entire-sstable-throughput'']'
    then:
    - title: Invoke StorageServiceMBean.setEntireSSTableInterDCStreamThroughputMebibytesPerSec over JMX
      source: src/java/org/apache/cassandra/service/StorageServiceMBean.java:801
      call: storage-service-mbean.set-entire-sstable-inter-dcstream-throughput-mebibytes-per-sec
      input:
        value: "= int(input.args[0])"
    - return:
        output: "= ''"
  - if: '''mib'' in input.options && input.options[''mib'']'
    then:
    - title: Invoke StorageServiceMBean.setInterDCStreamThroughputMebibytesPerSec over JMX
      source: src/java/org/apache/cassandra/service/StorageServiceMBean.java:790
      call: storage-service-mbean.set-inter-dcstream-throughput-mebibytes-per-sec
      input:
        value: "= int(input.args[0])"
    - return:
        output: "= ''"
  - title: Invoke StorageServiceMBean.setInterDCStreamThroughputMbitPerSec over JMX
    source: src/java/org/apache/cassandra/service/StorageServiceMBean.java:770
    call: storage-service-mbean.set-inter-dcstream-throughput-mbit-per-sec
    input:
      value: "= int(input.args[0])"
  - return:
      output: "= ''"
