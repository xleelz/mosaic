- component: nodetool-repair
  name: execute
  kind: function
  summary: "nodetool repair: for each non-local-strategy keyspace (system_distributed only when named) run a RepairRunner; any failure is wrapped as \"Error occurred during repair\"."
  sources:
  - src/java/org/apache/cassandra/tools/nodetool/Repair.java:44-205
  request:
    $ref: OpsNodetoolArgs
  response:
    type: object
    properties:
      output:
        type: string
        default: ''
  behavior:
  - if: ('pr' in input.options && input.options['pr']) && ('dc' in input.options || 'hosts' in input.options)
    then:
    - title: Primary range repair must run on all nodes
      source: src/java/org/apache/cassandra/tools/nodetool/Repair.java:137-138
      fail:
        code: runtime-exception
        message: Primary range repair should be performed on all nodes in the cluster.
  - call: node-tool-node-tool-cmd.parse-optional-keyspace
    as: ks
    input:
      keyspace: "= input.keyspace"
      set: NON_LOCAL_STRATEGY
  - title: "createOptions: RepairOption keys; incremental unless --full"
    source: src/java/org/apache/cassandra/tools/nodetool/Repair.java:168-204
    set:
      vars.opts:
        parallelism: "= 'seq' in input.options && input.options['seq'] ? 'sequential' : ('dcpar' in input.options && input.options['dcpar'] ? 'dc_parallel' : 'parallel')"
        primaryRange: "= 'pr' in input.options && input.options['pr'] ? 'true' : 'false'"
        incremental: "= 'full' in input.options && input.options['full'] ? 'false' : 'true'"
        jobThreads: '1'
        trace: 'false'
        columnFamilies: "= input.tables.join(',')"
        pullRepair: 'false'
        forceRepair: "= 'force' in input.options && input.options['force'] ? 'true' : 'false'"
        previewKind: NONE
        optimiseStreams: 'false'
        ignoreUnreplicatedKeyspaces: 'false'
        repairPaxos: 'true'
        paxosOnly: 'false'
  - set:
      vars.runs: 0
  - foreach: "= vars.ks.value.keyspaces"
    as: k
    steps:
    - if: input.keyspace == '' && vars.k == 'system_distributed'
      then:
      - title: system_distributed is repaired only when named (CASSANDRA-9621)
        source: src/java/org/apache/cassandra/tools/nodetool/Repair.java:143-145
        continue: true
    - title: NodeProbe.repairAsync registers a RepairRunner as notification listener and runs it
      source: src/java/org/apache/cassandra/tools/NodeProbe.java:519-544
      call: repair-runner.run
      input:
        keyspace: "= vars.k"
        options: "= vars.opts"
      on_error:
      - fail:
          code: runtime-exception
          message: Error occurred during repair
          data:
            root_cause: "= error.message"
    - set:
        vars.runs: "= vars.runs + 1"
  - set:
      ctx.opsRepairRuns: "= vars.runs"
  - return:
      output: "= 'repaired ' + string(vars.runs) + ' keyspace(s)'"
