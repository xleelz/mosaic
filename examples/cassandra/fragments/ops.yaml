    - nodetool-truncate-hints.execute
    - nodetool-update-cidrgroup.execute
    - nodetool-upgrade-sstable.execute
    - nodetool-verify.execute
    input: "= input.args"
    as: cmd
    on_error:
    - if: error.code in ['illegal-argument-exception', 'illegal-state-exception']
      then:
      - title: "badUse: exit 1"
        source: src/java/org/apache/cassandra/tools/NodeTool.java:277-289
        set:
          ctx.opsExitStatus: 1
          ctx.opsErrorCode: "= error.code"
      - return:
          exit_status: 1
          output: "= 'nodetool: ' + error.message"
    - title: "Any other Throwable: print the root cause, exit 2"
      source: src/java/org/apache/cassandra/tools/NodeTool.java:289-293
      set:
        ctx.opsExitStatus: 2
        ctx.opsErrorCode: "= error.code"
    - return:
        exit_status: 2
        output: "= 'error: ' + (error.data != null && 'root_cause' in error.data ? error.data.root_cause : error.message)"
  - set:
      ctx.opsExitStatus: 0
  - return:
      exit_status: 0
      output: "= vars.cmd.value.output"
