- component: trace-state-impl
  name: execute-mutation
  kind: queue
  summary: "TraceStateImpl.executeMutation: submit mutateWithCatch to Stage.TRACING and remember the future."
  sources:
  - src/java/org/apache/cassandra/tracing/TraceStateImpl.java:104-110
  request:
    $ref: OpsTraceEvent
  response: *id001
  behavior:
  - set:
      state.pending: "= state.pending + 1"
  - title: Stage.TRACING runs mutateWithCatch
    source: src/java/org/apache/cassandra/tracing/TraceStateImpl.java:106
    emit: trace-state-impl.mutate-with-catch
    input: "= input"
  - return: {}
- component: trace-state-impl
  name: mutate-with-catch
  kind: function
  summary: "TraceStateImpl.mutateWithCatch: StorageProxy.mutate at CL ANY; OverloadedException is logged and swallowed."
  sources:
  - src/java/org/apache/cassandra/tracing/TraceStateImpl.java:112-122
  request:
    $ref: OpsTraceEvent
  response: *id001
  behavior:
  - title: Write the trace row at consistency ANY
    source: src/java/org/apache/cassandra/tracing/TraceStateImpl.java:116
    call: storage-proxy.mutate
    as: w
    on_error: continue
    input:
      consistency: ANY
      mutations:
      - keyspace: system_traces
        table: events
        partition_key: "= input.session_id"
        token: 0
        timestamp: 0
        columns:
          activity: "= input.activity"
  - if: "!vars.w.ok && vars.w.error.code == 'overloaded'"
    then:
    - title: Too many nodes are overloaded to save trace events
      source: src/java/org/apache/cassandra/tracing/TraceStateImpl.java:118-121
      set:
        state.dropped_overloaded: "= state.dropped_overloaded + 1"
        ctx.opsTraceDropped: true
  - if: "!vars.w.ok && vars.w.error.code != 'overloaded'"
    then:
    - title: Other failures escape the stage task (logged by the executor)
      source: src/java/org/apache/cassandra/tracing/TraceStateImpl.java:116
      fail: "= vars.w.error"
  - set:
      state.pending: "= state.pending - 1"
  - return: {}
