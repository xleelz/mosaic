- component: node-tool
  name: execute
  kind: function
  summary: "NodeTool.execute: parse the command, connect over JMX, run it, and map exceptions to exit status 1 (bad use) or 2 (error, root cause printed)."
  sources:
  - src/java/org/apache/cassandra/tools/NodeTool.java:96-296
  - src/java/org/apache/cassandra/tools/NodeTool.java:444-464
  request:
    type: object
    properties:
      command:
        type: string
        description: the command name as typed (for example flush, repair, "repair_admin cancel")
        examples:
        - flush
      args:
        $ref: OpsNodetoolArgs
      host:
        type: string
        default: 127.0.0.1
      port:
        type: integer
        default: 7199
    required:
    - command
    - args
  response:
    $ref: OpsNodetoolResult
  behavior:
  - if: input.command in state.readonly_commands
    then:
    - title: Read-only report command (getter calls only; not modeled)
      source: src/java/org/apache/cassandra/tools/NodeTool.java:98-252
      set:
        ctx.opsExitStatus: 0
    - return:
        exit_status: 0
        output: "= 'read-only report: ' + input.command"
  - if: "!(input.command in state.commands)"
    then:
    - title: "airline: unknown command (badUse, exit 1)"
      source: src/java/org/apache/cassandra/tools/NodeTool.java:277-290
      set:
        ctx.opsExitStatus: 1
    - return:
        exit_status: 1
        output: "= 'nodetool: Found unexpected parameters: [' + input.command + ']'"
  - title: "NodeToolCmd.connect: a failed JMX connection prints and exits 1"
    source: src/java/org/apache/cassandra/tools/NodeTool.java:444-464
    call: node-probe.connect
    input:
      host: "= input.host"
      port: "= input.port"
    as: conn
    on_error:
    - set:
        ctx.opsExitStatus: 1
    - return:
        exit_status: 1
        output: "= 'nodetool: Failed to connect to \\'' + input.host + ':' + string(int(input.port)) + '\\' - ' + error.code + ': \\'' + error.message + '\\'.'"
  - title: parse.run(...) -> runInternal -> execute(probe)
    source: src/java/org/apache/cassandra/tools/NodeTool.java:274-276
    call: "= state.commands[input.command] + '.execute'"
    targets:
    - nodetool-assassinate.execute
    - nodetool-bootstrap-resume.execute
    - nodetool-cleanup.execute
    - nodetool-clear-snapshot.execute
    - nodetool-compact.execute
