- component: storage-service-mbean
  name: force-keyspace-cleanup
  kind: jmx
  summary: "StorageService.forceKeyspaceCleanup: refuse for local system keyspaces and while this node has pending ranges, then performCleanup per table."
  sources:
  - src/java/org/apache/cassandra/service/StorageServiceMBean.java:399
  - src/java/org/apache/cassandra/service/StorageService.java:4154-4172
  attributes:
    mbean: StorageServiceMBean
    operation: forceKeyspaceCleanup
  request:
    type: object
    properties:
      keyspace: *id005
      tables: *id007
      jobs:
        type: integer
        default: 2
    required:
    - keyspace
  response:
    type: object
    properties:
      status_code:
        type: integer
        default: 0
      status:
        type: string
        default: SUCCESSFUL
  errors:
  - *id006
  - *id008
  behavior:
  - if: input.keyspace in state.local_system_keyspaces
    then:
    - title: Cleanup of a local system keyspace is refused
      source: src/java/org/apache/cassandra/service/StorageService.java:4156-4157
      fail:
        code: runtime-exception
        message: Cleanup of the system keyspace is neither necessary nor wise
  - call: token-metadata.get-pending-ranges
    as: pr
    input:
      keyspace: "= input.keyspace"
      endpoint: "= self"
  - choice: pending_ranges
    default: "= size(vars.pr.value.ranges) > 0 ? 'pending' : 'none'"
    options:
      none: []
      pending:
      - title: Node is involved in a membership change
        source: src/java/org/apache/cassandra/service/StorageService.java:4159-4160
        fail:
          code: runtime-exception
          message: Node is involved in cluster membership changes. Not safe to run cleanup.
  - set:
      vars.status: SUCCESSFUL
  - call: storage-service-mbean.get-valid-column-families
    as: cfs
    input:
      keyspace: "= input.keyspace"
      tables: "= input.tables"
  - foreach: "= vars.cfs.value.tables"
    as: t
    steps:
    - title: Run the job for this table
      source: src/java/org/apache/cassandra/service/StorageService.java:4154-4172
      call: compaction-manager.perform-cleanup
      as: r
      input:
        replica: "= self"
        keyspace: "= input.keyspace"
        table: "= vars.t"
        jobs: "= input.jobs"
    - choice: op_status
      default: "= vars.r.value.status"
      options:
        SUCCESSFUL:
        - set:
            vars.one: SUCCESSFUL
        ABORTED:
        - set:
            vars.one: ABORTED
        UNABLE_TO_CANCEL:
        - set:
            vars.one: UNABLE_TO_CANCEL
    - when: vars.one != 'SUCCESSFUL'
      set:
        vars.status: "= vars.one"
  - title: Return AllSSTableOpStatus.statusCode (0 SUCCESSFUL, 1 ABORTED, 2 UNABLE_TO_CANCEL)
    source: src/java/org/apache/cassandra/db/compaction/CompactionManager.java:502
    return:
      status_code: "= vars.status == 'SUCCESSFUL' ? 0 : (vars.status == 'ABORTED' ? 1 : 2)"
      status: "= vars.status"
