- component: node-tool-node-tool-cmd
  name: parse-optional-keyspace
  kind: function
  summary: "NodeToolCmd.parseOptionalKeyspace: the given keyspace, or all / non-system / non-local-strategy keyspaces; each must exist on the node."
  sources:
  - src/java/org/apache/cassandra/tools/NodeTool.java:476-502
  request:
    type: object
    properties:
      keyspace:
        type: string
        default: ''
      set:
        type: string
        enum:
        - ALL
        - NON_SYSTEM
        - NON_LOCAL_STRATEGY
        default: ALL
  response:
    type: object
    properties:
      keyspaces:
        type: array
        items:
          type: string
  errors:
  - *id006
  behavior:
  - call: storage-service-mbean.get-keyspaces
    as: all
  - if: input.keyspace != ''
    then:
    - set:
        vars.list:
        - "= input.keyspace"
    else:
    - if: input.set == 'ALL'
      then:
      - set:
          vars.list: "= vars.all.value.keyspaces"
      else:
      - call: storage-service-mbean.get-non-local-strategy-keyspaces
        as: nl
      - set:
          vars.list: "= vars.nl.value.keyspaces"
  - foreach: "= vars.list"
    as: k
    steps:
    - if: "!(vars.k in vars.all.value.keyspaces)"
      then:
      - title: Unknown keyspace
        source: src/java/org/apache/cassandra/tools/NodeTool.java:498
        fail:
          code: illegal-argument-exception
          message: "= 'Keyspace [' + vars.k + '] does not exist.'"
  - return:
      keyspaces: "= vars.list"
- component: repair-runner
  name: run
  kind: function
  summary: "RepairRunner.run: repairAsync; 0 means nothing to repair (RF 1); otherwise wait for COMPLETE or ERROR notifications, then confirm with getParentRepairStatus."
  sources:
  - src/java/org/apache/cassandra/tools/RepairRunner.java:63-91
  - src/java/org/apache/cassandra/tools/RepairRunner.java:126-146
  - src/java/org/apache/cassandra/tools/RepairRunner.java:148-186
  request:
    type: object
    properties:
      keyspace: *id005
      options:
        type: object
        properties: {}
        default: {}
    required:
    - keyspace
  response:
    type: object
    properties:
      cmd:
        type: integer
      status:
        type: string
  errors:
  - *id008
  - *id009
  behavior:
  - title: "ssProxy.repairAsync(keyspace, options): StorageServiceMBean.repairAsync, modeled by repair-streaming"
    source: src/java/org/apache/cassandra/tools/RepairRunner.java:65
    call: storage-service.repair-async
    as: cmd
    input:
      keyspace: "= input.keyspace"
      options: "= input.options"
  - title: "The JMX operation behind ssProxy.repairAsync: StorageServiceMBean.repairAsync"
    source: src/java/org/apache/cassandra/service/StorageServiceMBean.java:476
  - choice: started
    default: "= vars.cmd.value.cmd > 0 ? 'started' : 'nothing_to_repair'"
    options:
      nothing_to_repair:
      - title: Replication factor is 1. No repair is needed
        source: src/java/org/apache/cassandra/tools/RepairRunner.java:66-71
        set:
          ctx.opsRepairOutcome: nothing to repair
      - return:
          cmd: 0
          status: NONE
      started: []
  - title: Wait for progress notifications tagged repair:<cmd>
    source: src/java/org/apache/cassandra/tools/RepairRunner.java:74-78
    choice: notification
    default: complete
    options:
      complete: []
      error:
      - title: An ERROR progress event fails the run
        source: src/java/org/apache/cassandra/tools/RepairRunner.java:135-140
        set:
          ctx.opsRepairOutcome: error notification
      - fail:
          code: runtime-exception
          message: "Repair job has failed with the error message: Repair session failed. Check the logs on the repair participants for further details"
      connection_closed:
      - title: JMX connection closed
        source: src/java/org/apache/cassandra/tools/RepairRunner.java:117-124
        set:
          ctx.opsRepairOutcome: connection closed
      - fail:
          code: io-exception
          message: "= 'JMX connection closed. You should check server log for repair status of keyspace ' + input.keyspace + '(Subsequent keyspaces are not going to be repaired).'"
  - title: "Notifications are lossy: confirm with getParentRepairStatus"
    source: src/java/org/apache/cassandra/tools/RepairRunner.java:79-85
    call: storage-service-mbean.get-parent-repair-status
    as: st
    input:
      cmd: "= vars.cmd.value.cmd"
  - choice: parent_status
    default: "= vars.st.value.status in ['COMPLETED', 'FAILED', 'IN_PROGRESS'] ? vars.st.value.status : 'UNKNOWN'"
    options:
      COMPLETED:
      - set:
          ctx.opsRepairOutcome: completed
      UNKNOWN:
      - title: "No recorded status: the message is printed, no error is raised"
        source: src/java/org/apache/cassandra/tools/RepairRunner.java:152-157
        set:
          ctx.opsRepairOutcome: completed (status not found)
      IN_PROGRESS:
      - set:
          ctx.opsRepairOutcome: in progress after completion signal
      FAILED:
      - title: FAILED parent status becomes an IOException with the first message
        source: src/java/org/apache/cassandra/tools/RepairRunner.java:165-173
        set:
          ctx.opsRepairOutcome: failed
      - fail:
          code: io-exception
          message: "= size(vars.st.value.messages) > 0 ? vars.st.value.messages[0] : 'Repair failed'"
  - return:
      cmd: "= vars.cmd.value.cmd"
      status: "= vars.st.value.status"
- component: nodetool-flush
  name: execute
  kind: function
  summary: "nodetool flush: forceKeyspaceFlush for the named keyspace (or all keyspaces); any server error is wrapped as \"Error occurred during flushing\"."
  sources:
  - src/java/org/apache/cassandra/tools/nodetool/Flush.java:29-52
  request:
    $ref: OpsNodetoolArgs
  response:
    type: object
    properties:
      output:
        type: string
        default: ''
  behavior:
  - call: node-tool-node-tool-cmd.parse-optional-keyspace
    as: ks
    input:
      keyspace: "= input.keyspace"
      set: ALL
  - foreach: "= vars.ks.value.keyspaces"
    as: k
    steps:
    - title: Invoke StorageServiceMBean.forceKeyspaceFlush over JMX
      source: src/java/org/apache/cassandra/service/StorageServiceMBean.java:463
      call: storage-service-mbean.force-keyspace-flush
      input:
        keyspace: "= vars.k"
        tables: "= input.tables"
      on_error:
      - fail:
          code: runtime-exception
          message: Error occurred during flushing
          data:
            root_cause: "= error.message"
  - return:
      output: "= 'flushed ' + string(size(vars.ks.value.keyspaces)) + ' keyspace(s)'"
- component: nodetool-cleanup
  name: execute
  kind: function
  summary: "nodetool cleanup: per non-local-strategy keyspace (local system keyspaces skipped) run forceKeyspaceCleanup; status 2 makes nodetool fail."
  sources:
  - src/java/org/apache/cassandra/tools/nodetool/Cleanup.java:31-63
  request:
    $ref: OpsNodetoolArgs
  response:
    type: object
    properties:
      output:
        type: string
        default: ''
  behavior:
  - call: node-tool-node-tool-cmd.parse-optional-keyspace
    as: ks
    input:
      keyspace: "= input.keyspace"
      set: NON_LOCAL_STRATEGY
  - set:
      vars.failed: false
      vars.out: ''
  - call: storage-service-mbean.get-concurrent-compactors
    as: cc
  - when: '''jobs'' in input.options && input.options[''jobs''] > vars.cc.value.value'
    title: "checkJobs: warn when --jobs exceeds concurrent_compactors"
    source: src/java/org/apache/cassandra/tools/NodeProbe.java:396-401
    set:
      vars.out: "= 'jobs (' + string(int(input.options['jobs'])) + ') is bigger than configured concurrent_compactors (' + string(int(vars.cc.value.value)) + ') on the host, using at most ' + string(int(vars.cc.value.value)) + ' threads; '"
  - foreach: "= vars.ks.value.keyspaces"
    as: k
    steps:
    - if: vars.k in ['system', 'system_schema']
      then:
      - continue: true
    - title: Invoke StorageServiceMBean.forceKeyspaceCleanup over JMX
      source: src/java/org/apache/cassandra/service/StorageServiceMBean.java:399
      call: storage-service-mbean.force-keyspace-cleanup
      input:
        keyspace: "= vars.k"
        tables: "= input.tables"
        jobs: "= 'jobs' in input.options ? input.options['jobs'] : 2"
      on_error:
      - fail:
          code: runtime-exception
          message: Error occurred during cleanup
          data:
            root_cause: "= error.message"
      as: r
    - title: "NodeProbe.perform: 1 prints \"Aborted\", 2 marks the probe failed"
      source: src/java/org/apache/cassandra/tools/NodeProbe.java:447-460
      if: vars.r.value.status_code == 1
      then:
      - set:
          vars.out: "= vars.out + 'Aborted cleaning up for at least one table in keyspace ' + vars.k + ', check server logs for more information. '"
    - if: vars.r.value.status_code == 2
      then:
      - set:
          vars.failed: true
