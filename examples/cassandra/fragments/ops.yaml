  behavior:
  - set:
      vars.tag: "= 'tag' in input.options ? input.options['tag'] : '1730284800000'"
      vars.kt: "= 'kt-list' in input.options ? input.options['kt-list'] : ''"
  - if: vars.tag.contains(':')
    then:
    - title: Snapshot name cannot contain the path separator
      source: src/java/org/apache/cassandra/tools/nodetool/Snapshot.java:77-80
      fail:
        code: runtime-exception
        message: Error during taking a snapshot
        data:
          root_cause: 'Snapshot name cannot contain :'
  - if: vars.kt != '' && input.keyspace != ''
    then:
    - title: kt-list and keyspaces are exclusive
      source: src/java/org/apache/cassandra/tools/nodetool/Snapshot.java:85-90
      fail:
        code: runtime-exception
        message: Error during taking a snapshot
        data:
          root_cause: When specifying the Keyspace table list (using -kt,--kt-list,-kc,--kc.list), you must not also specify keyspaces to snapshot
  - title: Invoke StorageServiceMBean.takeSnapshot over JMX
    source: src/java/org/apache/cassandra/service/StorageServiceMBean.java:267
    call: storage-service.take-snapshot
