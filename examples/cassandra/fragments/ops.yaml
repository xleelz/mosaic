- component: audit-log-filter
  name: is-filtered
  kind: function
  summary: "AuditLogFilter.isFiltered: an entry is dropped when its keyspace, category or user is excluded, or not in a non-empty include set."
  sources:
  - src/java/org/apache/cassandra/audit/AuditLogFilter.java:135-160
  request:
    type: object
    properties:
      entry:
        $ref: OpsAuditLogEntry
      filter:
        type: object
        properties: {}
    required:
    - entry
    - filter
  response:
    type: object
    properties:
      filtered:
        type: boolean
  behavior:
  - set:
      vars.f: "= input.filter"
      vars.e: "= input.entry"
  - set:
      vars.ks: "= (size(vars.f.excluded_keyspaces) > 0 && vars.e.keyspace in vars.f.excluded_keyspaces) || !(size(vars.f.included_keyspaces) == 0 || vars.e.keyspace in vars.f.included_keyspaces)"
      vars.cat: "= (size(vars.f.excluded_categories) > 0 && vars.e.category in vars.f.excluded_categories) || !(size(vars.f.included_categories) == 0 || vars.e.category in vars.f.included_categories)"
      vars.usr: "= (size(vars.f.excluded_users) > 0 && vars.e.user in vars.f.excluded_users) || !(size(vars.f.included_users) == 0 || vars.e.user in vars.f.included_users)"
  - title: Exclude set first, then a non-empty include set
    source: src/java/org/apache/cassandra/audit/AuditLogFilter.java:154-160
    return:
      filtered: "= vars.ks || vars.cat || vars.usr"
- component: bin-audit-logger
  name: log
  kind: function
  summary: "BinAuditLogger.log: append the entry to the binary log queue (blocking per audit_logging_options.block, default true)."
  sources:
  - src/java/org/apache/cassandra/audit/BinAuditLogger.java:87-95
