- component: cassandra-daemon
  name: activate
  kind: function
  summary: "CassandraDaemon.activate: applyConfig, registerNativeAccess, setup, start; any Throwable escaping is logged and the JVM exits with status 3."
  sources:
  - src/java/org/apache/cassandra/service/CassandraDaemon.java:718-771
  - src/java/org/apache/cassandra/service/CassandraDaemon.java:863-866
  request: *id003
  response:
    $ref: OpsStartupResult
  errors:
  - code: startup-exception
    summary: startup halted; data.exit_code is the process exit status
  - code: configuration-exception
    summary: configuration rejected; data.exit_code is the process exit status
  behavior:
  - title: "applyConfig: DatabaseDescriptor.daemonInitialization"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:723-723
    call: database-descriptor.daemon-initialization
    as: cfg
    on_error:
    - title: Exception encountered during startup
      source: src/java/org/apache/cassandra/service/CassandraDaemon.java:748-765
      detail: "activate() catches the Throwable and calls exitOrFail(3, ...): System.exit(3) when not run managed."
      fail:
        code: configuration-exception
        message: "= error.message"
        data:
          exit_code: 3
  - title: "registerNativeAccess: NativeAccessMBean"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:773-776
  - call: cassandra-daemon.setup
    as: setup
    on_error:
    - if: error.code == 'startup-exception' || error.code == 'configuration-exception'
      then:
      - fail: "= error"
    - title: Exception encountered during startup
      source: src/java/org/apache/cassandra/service/CassandraDaemon.java:746-765
      fail:
        code: "= error.code"
        message: "= error.message"
        data:
          exit_code: 3
  - call: cassandra-daemon.start
    as: start
  - title: Startup complete
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:744
    return:
      setup_completed: true
      native_transport_started: "= vars.start.value.native_transport_started"
      message: "= vars.start.value.native_transport_started ? 'Startup complete' : 'Startup complete; client transports not started'"
- component: cassandra-daemon
  name: setup
  kind: function
  summary: "CassandraDaemon.setup: JMX, commit log, startup checks, local metadata, schema, virtual keyspaces, caches, commit log replay, background tasks, initServer, gossip settle, audit log."
  sources:
  - src/java/org/apache/cassandra/service/CassandraDaemon.java:229-455
  request: *id003
  response: *id003
  errors:
  - code: startup-exception
  - code: configuration-exception
  - &id008
    code: runtime-exception
    summary: RuntimeException
  behavior:
  - title: "maybeInitJmx: local-only JMX on 7199 (cassandra-env.sh LOCAL_JMX=yes, no authentication)"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:139-185
  - title: Start the commit log
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:256
    call: commit-log.start
  - title: "runStartupChecks: a StartupException exits with its return code"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:457-468
    call: startup-checks.verify
  - title: Snapshot system tables on version change; persist local metadata (first SystemKeyspace write)
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:262-273
  - title: Populate token metadata before flushing
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:278
    call: storage-service.populate-token-metadata
  - title: Load schema from disk
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:283
    call: schema.load-from-disk
  - title: "setupVirtualKeyspaces: system_virtual_schema"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:534-537
    call: virtual-keyspace-registry.register
    input:
      keyspace: system_virtual_schema
  - title: "setupVirtualKeyspaces: system_views"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:537
    call: virtual-keyspace-registry.register
    input:
      keyspace: system_views
  - title: scrubDataDirectories, Keyspace.setInitialized, open keyspaces with auto-compaction disabled until gossip settles
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:295-319
  - title: "loadRowAndKeyCacheAsync: key and row cache loads run concurrently; get() waits for both, and a failure is only logged"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:573-583
    parallel:
    - KEY_CACHE
    - ROW_CACHE
    as: cache
    join:
      need: all
    as_result: cacheLoads
    steps:
    - title: AutoSavingCache.loadSavedAsync (row_cache_size 0MiB, so the row cache is empty)
      source: src/java/org/apache/cassandra/service/CassandraDaemon.java:321-329
      call: auto-saving-cache.load-saved
      input:
        cache_type: "= vars.cache"
      on_error: continue
  - title: Replay commit log segments found on disk; an IOException becomes a RuntimeException
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:345-352
    call: commit-log.recover-segments-on-disk
    as: replay
    input:
      segments: []
    on_error:
    - fail:
        code: runtime-exception
        message: "= error.message"
  - title: Re-populate token metadata after replay
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:353
    call: storage-service.populate-token-metadata
  - title: cleanupSizeEstimates; schedule SizeEstimatesRecorder every 300 s after 30 s (cassandra.size_recorder_interval)
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:365-371
  - title: Start ActiveRepairService and StreamManager
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:373-374
    call: active-repair-service.start
  - title: Preload prepared statements
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:377
    call: query-processor.preload-prepared-statements
  - title: initServer; a ConfigurationException exits with status 1
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:380-389
    call: storage-service.init-server
    on_error:
    - if: error.code in ['config-error', 'configuration-exception']
      then:
      - fail:
          code: configuration-exception
          message: Fatal configuration error
          data:
            exit_code: 1
    - title: Other failures propagate to activate() (exit 3)
      source: src/java/org/apache/cassandra/service/CassandraDaemon.java:381-389
      fail: "= error"
  - title: Schedule the materialized view build after RING_DELAY
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:393-401
  - when: "!state.local_address_is_loopback"
    title: Wait for gossip to settle (skipped on loopback)
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:404-405
    call: gossiper.wait-to-settle
  - title: doAuthSetup
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:406
  - call: database-descriptor.get-autocompaction-on-startup-enabled
    as: ac
  - title: Reload stores and re-enable auto-compaction when autocompaction_on_startup_enabled
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:408-428
    set:
      ctx.opsAutocompactionReenabled: "= vars.ac.value.enabled"
  - title: Initialise the audit log manager
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:431
    call: audit-log-manager.initialize
  - title: Schedule the background compaction submitter every 1 min after 5 min
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:435
  - title: Schedule speculative retry threshold updates every read_request_timeout (5000 ms)
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:438-441
  - title: "initializeClientTransports: create NativeTransportService (not started yet)"
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:562-568
  - title: Auth cache warming disabled by default; start Paxos auto repairs
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:447-452
  - title: completeSetup
    source: src/java/org/apache/cassandra/service/CassandraDaemon.java:586-590
    set:
      state.setup_completed: true
  - return: {}
- component: cassandra-daemon
  name: start
  kind: function
  summary: "CassandraDaemon.start: wait for peer connectivity, then start client transports unless validateTransportsCanStart refuses (logged, not fatal)."
