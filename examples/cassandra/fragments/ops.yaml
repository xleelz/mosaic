  summary: "nodetool snapshot: validate the tag and options, then takeSnapshot for keyspaces (or a keyspace.table list); IOExceptions become \"Error during taking a snapshot\"."
  sources:
  - src/java/org/apache/cassandra/tools/nodetool/Snapshot.java:39-120
