      tag: "= vars.tag"
      skip_flush: "= 'skip-flush' in input.options ? input.options['skip-flush'] : false"
      ttl_seconds: "= 'ttl' in input.options ? input.options['ttl'] : 0"
      entities: "= vars.kt != '' ? vars.kt.split(',') : (input.keyspace != '' ? [input.keyspace] + input.args : [])"
    on_error:
    - if: error.code == 'io-exception'
      then:
      - fail:
          code: runtime-exception
          message: Error during taking a snapshot
          data:
            root_cause: "= error.message"
    - fail: "= error"
  - return:
      output: "= 'Snapshot directory: ' + vars.tag"
