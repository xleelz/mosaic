schemas:
- id: OpsNodetoolArgs
  summary: Parsed nodetool arguments, the fields an airline command object carries (NodeTool commands).
  schema:
    type: object
    properties:
      keyspace:
        type: string
        description: First positional argument when the command takes [<keyspace> <tables>...]; empty means not given.
        default: ''
      tables:
        type: array
        items:
          type: string
        description: Remaining positional table names.
        default: []
      args:
        type: array
        items:
          type: string
        description: Other positional arguments, in order.
        default: []
      options:
        type: object
        properties: {}
        default: {}
        description: Command options by long name (for example force, jobs, tag).
- id: OpsNodetoolResult
  summary: "What NodeTool.execute returns to main(): the process exit status and what it printed."
  schema:
    type: object
    properties:
      exit_status:
        type: integer
        description: 0 success, 1 bad use (IllegalArgument/IllegalState or parse errors, or JMX connect failure), 2 any other error.
        default: 0
      output:
        type: string
        default: ''
    required:
    - exit_status
- id: OpsStartupResult
  summary: Outcome of CassandraDaemon.activate.
  schema:
    type: object
    properties:
      setup_completed:
        type: boolean
        default: true
      native_transport_started:
        type: boolean
        default: true
      message:
        type: string
        default: Startup complete
- id: OpsAuditLogEntry
  summary: An AuditLogEntry as built by AuditLogManager (audit/AuditLogEntry.java).
  schema:
    type: object
    properties:
      user:
        type: string
        examples:
        - cassandra
      keyspace:
        type: string
        examples:
        - ks1
      type:
        type: string
        description: AuditLogEntryType name
        examples:
        - SELECT
      category:
        type: string
        enum:
        - QUERY
        - DML
        - DDL
        - DCL
        - OTHER
        - AUTH
        - ERROR
        - PREPARE
        - TRANSACTION
        examples:
        - QUERY
      operation:
        type: string
        examples:
        - SELECT * FROM ks1.users WHERE id = 42
      source:
        type: string
        examples:
        - /10.0.0.9:51234
    required:
    - keyspace
    - category
    - user
- id: OpsTraceEvent
  summary: A trace session row or event written to system_traces (tracing/TraceKeyspace.java).
  schema:
    type: object
    properties:
      session_id:
        type: string
        examples:
        - 4c5f2a10-9b1e-11ef-8f3a-0242ac120002
      request:
        type: string
        examples:
        - Execute CQL3 query
      activity:
        type: string
        examples:
        - Parsing SELECT * FROM ks1.users WHERE id = 42
      trace_type:
        type: string
        enum:
        - QUERY
        - REPAIR
        default: QUERY
      ttl_seconds:
        type: integer
        default: 86400
configs:
- id: start-native-transport
  type: boolean
  value: true
  default: true
  summary: "start_native_transport: CassandraDaemon starts the CQL server at startup."
  sources:
  - conf/cassandra.yaml:1020
  - src/java/org/apache/cassandra/config/Config.java:278
- id: autocompaction-on-startup-enabled
  type: boolean
  value: true
  default: true
  summary: "autocompaction_on_startup_enabled (not in cassandra.yaml): re-enable auto-compaction once gossip settles."
  sources:
  - src/java/org/apache/cassandra/config/Config.java:833
- id: auth-cache-warming-enabled
  type: boolean
  value: false
  default: false
