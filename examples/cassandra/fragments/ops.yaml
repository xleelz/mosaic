- component: nodetool-set-timeout
  name: execute
  kind: function
  summary: "nodetool settimeout <type> <ms>: dispatch to the matching DatabaseDescriptor timeout setter; an unknown type is an IllegalArgumentException."
  sources:
  - src/java/org/apache/cassandra/tools/nodetool/SetTimeout.java:31-55
  request:
    $ref: OpsNodetoolArgs
  response:
    type: object
    properties:
      output:
        type: string
        default: ''
  behavior:
  - if: size(input.args) != 2
    then:
    - title: checkArgument
      source: src/java/org/apache/cassandra/tools/nodetool/SetTimeout.java:42
      fail:
        code: illegal-argument-exception
        message: Timeout type followed by value in ms (0 disables socket streaming timeout). Type should be one of (read, range, write, counterwrite, cascontention, truncate, internodeconnect, internodeuser, internodestreaminguser, misc (general rpc_timeout_in_ms))
  - set:
      vars.targets:
        misc: storage-service-mbean.set-rpc-timeout
        read: storage-service-mbean.set-read-rpc-timeout
        range: storage-service-mbean.set-range-rpc-timeout
        write: storage-service-mbean.set-write-rpc-timeout
        counterwrite: storage-service-mbean.set-counter-write-rpc-timeout
        cascontention: storage-service-mbean.set-cas-contention-timeout
        truncate: storage-service-mbean.set-truncate-rpc-timeout
        internodeconnect: storage-service-mbean.set-internode-tcp-connect-timeout-in-ms
        internodeuser: storage-service-mbean.set-internode-tcp-user-timeout-in-ms
        internodestreaminguser: storage-service-mbean.set-internode-streaming-tcp-user-timeout-in-ms
  - if: "!(input.args[0] in vars.targets)"
    then:
    - title: NodeProbe.setTimeout rejects an unknown type
      source: src/java/org/apache/cassandra/tools/nodetool/SetTimeout.java:31-55
      fail:
        code: illegal-argument-exception
        message: Timeout type requires one of (read, range, write, counterwrite, cascontention, truncate, internodeconnect, internodeuser, internodestreaminguser, misc (general rpc_timeout_in_ms))
  - title: NodeProbe.setTimeout calls the setter for the type over JMX
    source: src/java/org/apache/cassandra/tools/nodetool/SetTimeout.java:31-55
    call: "= vars.targets[input.args[0]]"
    input:
      value: "= int(input.args[1])"
    targets:
    - storage-service-mbean.set-rpc-timeout
    - storage-service-mbean.set-read-rpc-timeout
    - storage-service-mbean.set-range-rpc-timeout
    - storage-service-mbean.set-write-rpc-timeout
    - storage-service-mbean.set-counter-write-rpc-timeout
    - storage-service-mbean.set-cas-contention-timeout
    - storage-service-mbean.set-truncate-rpc-timeout
    - storage-service-mbean.set-internode-tcp-connect-timeout-in-ms
    - storage-service-mbean.set-internode-tcp-user-timeout-in-ms
    - storage-service-mbean.set-internode-streaming-tcp-user-timeout-in-ms
    on_error:
    - if: error.code == 'illegal-argument-exception'
      then:
      - title: Rethrown as IllegalArgumentException
        source: src/java/org/apache/cassandra/tools/nodetool/SetTimeout.java:50-55
        fail:
          code: illegal-argument-exception
          message: "= error.message"
    - fail:
        code: illegal-argument-exception
        message: "= error.message"
  - return:
      output: "= ''"
