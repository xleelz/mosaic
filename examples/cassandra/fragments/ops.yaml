scenarios:
- id: startup-happy-path
  flow: daemon-startup
  name: "Clean start: checks pass, commit log replayed, native transport started"
  fixtures:
  - three-node-rf3
  expect:
  - result.ok && result.value.native_transport_started
  - calls['startup-checks.verify'] == 1 && calls['commit-log.recover-segments-on-disk'] == 1 && calls['storage-service.init-server'] == 1
  - calls['native-transport-service.start'] == 1 && calls['storage-service.set-rpc-ready'] == 1 && calls['gossiper.wait-to-settle'] == 1
  - state['cassandra-daemon@n1'].setup_completed && state['cassandra-daemon@n1'].native_transport_running
  - state['virtual-keyspace-registry@n1'].keyspaces == ['system_virtual_schema', 'system_views'] && !state['audit-log-manager@n1'].listener_registered
- id: startup-commitlog-dir-unwritable
  flow: daemon-startup
  name: "checkDataDirs: commit log directory lacks permissions -> exit 3"
  fixtures:
  - three-node-rf3
  state:
    startup-checks:
      data_dirs:
        /var/lib/cassandra/commitlog:
          exists: true
          can_create: true
          writable: false
  expect:
  - "!result.ok && result.error.code == 'startup-exception' && result.error.data.exit_code == 3"
  - result.error.message == 'Insufficient permissions on directory /var/lib/cassandra/commitlog'
  - calls['commit-log.start'] == 1 && calls['schema.load-from-disk'] == 0 && calls['native-transport-service.start'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'commit-log.start' && e.instance == 'n1')
- id: startup-data-dir-cannot-be-created
  flow: daemon-startup
  name: "checkDataDirs: a missing directory that cannot be created -> exit 3"
  fixtures:
  - three-node-rf3
  state:
    startup-checks:
      data_dirs:
        /var/lib/cassandra/hints:
          exists: false
          can_create: false
          writable: false
  expect:
  - "!result.ok && result.error.data.exit_code == 3 && result.error.message.startsWith('Has no permission to create directory')"
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-dc-mismatch
  flow: daemon-startup
  name: "checkDatacenter: snitch DC differs from the saved DC -> exit 100"
  fixtures:
  - three-node-rf3
  state:
    startup-checks:
      stored_dc: dc1
  expect:
  - "!result.ok && result.error.code == 'startup-exception' && result.error.data.exit_code == 100"
  - result.error.message.contains('differs from previous data center (dc1)')
  - calls['storage-service.populate-token-metadata'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-dc-check-disabled
  flow: daemon-startup
  name: "check_dc disabled: a DC change no longer stops startup"
  fixtures:
  - three-node-rf3
  config:
    startup-checks-check-dc-enabled: false
  state:
    startup-checks:
      stored_dc: dc1
  expect:
  - result.ok && calls['storage-service.init-server'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-service.init-server' && e.instance == 'n1')
- id: startup-rack-mismatch
  flow: daemon-startup
  name: "checkRack: snitch rack differs -> exit 100"
  fixtures:
  - three-node-rf3
  state:
    startup-checks:
      stored_rack: rack2
  expect:
  - "!result.ok && result.error.data.exit_code == 100 && result.error.message.contains('rack')"
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-native-library-missing
  flow: daemon-startup
  name: checkNativeLibraryInitialization fails -> exit 1
  fixtures:
  - three-node-rf3
  state:
    startup-checks:
      native_library_ok: false
  expect:
  - "!result.ok && result.error.data.exit_code == 1"
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-invalid-config
  flow: daemon-startup
  name: cassandra.yaml rejected by daemonInitialization -> exit 3 before anything starts
  fixtures:
  - three-node-rf3
  state:
    database-descriptor:
      config_valid: false
  expect:
  - "!result.ok && result.error.code == 'configuration-exception' && result.error.data.exit_code == 3"
  - calls['commit-log.start'] == 0 && calls['startup-checks.verify'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-commitlog-replay-fails
  flow: daemon-startup
  name: Commit log replay throws IOException -> RuntimeException -> exit 3
  fixtures:
  - three-node-rf3
  faults:
  - target: commit-log.recover-segments-on-disk
    type: error
    code: io-exception
    message: corrupt segment CommitLog-7-1730284800000.log
  expect:
  - "!result.ok && result.error.code == 'runtime-exception' && result.error.data.exit_code == 3"
  - calls['storage-service.init-server'] == 0 && calls['native-transport-service.start'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-init-server-config-error
  flow: daemon-startup
  name: initServer throws ConfigurationException -> exit 1 (Fatal configuration error)
  fixtures:
  - three-node-rf3
  faults:
  - target: storage-service.init-server
    type: error
    code: config-error
    message: Saved cluster name Test Cluster != configured name Prod
  expect:
  - "!result.ok && result.error.code == 'configuration-exception' && result.error.data.exit_code == 1 && result.error.message == 'Fatal configuration error'"
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-bootstrap-incomplete
  flow: daemon-startup
  name: "Joined but bootstrap not completed: transports stay down, startup still completes"
  fixtures:
  - three-node-rf3
  choices:
    cassandra-daemon.validate-transports-can-start.bootstrap: incomplete
  expect:
  - result.ok && !result.value.native_transport_started && calls['native-transport-service.start'] == 0
  - ctx.opsTransportsSkipped.startsWith('Node is not yet bootstrapped completely')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-native-transport-disabled
  flow: daemon-startup
  name: "start_native_transport: false -> not started, can be enabled later with nodetool enablebinary"
  fixtures:
  - three-node-rf3
  config:
    start-native-transport: false
  expect:
  - result.ok && !result.value.native_transport_started && calls['native-transport-service.start'] == 0 && calls['storage-service.set-rpc-ready'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cassandra-daemon.activate' && e.instance == 'n1')
- id: startup-key-cache-load-fails
  flow: daemon-startup
  name: "Saved key cache cannot be loaded: logged, startup continues"
  fixtures:
  - three-node-rf3
  faults:
  - target: auto-saving-cache.load-saved
    type: error
    code: io-exception
    calls:
    - 1
  expect:
  - result.ok && calls['auto-saving-cache.load-saved'] == 2 && faults == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'auto-saving-cache.load-saved' && e.instance == 'n1')
- id: repair-all-keyspaces
  flow: nodetool-repair
  name: Repair every non-local keyspace; system_distributed is skipped when not named
  fixtures:
  - three-node-rf3
  expect:
  - result.ok && result.value.exit_status == 0
  - calls['repair-runner.run'] == 4 && calls['storage-service.repair-async'] == 4 && ctx.opsRepairRuns == 4
  - calls['storage-service-mbean.get-parent-repair-status'] == 4 && ctx.opsRepairOutcome.startsWith('completed')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-service-mbean.get-parent-repair-status' && e.instance == 'n1')
- id: repair-full
  flow: nodetool-repair
  name: nodetool repair --full sends incremental=false (incremental is the default)
  fixtures:
  - three-node-rf3
  input:
    args:
      keyspace: ks1
      options:
        full: true
  expect:
  - result.ok && result.value.exit_status == 0
  - calls['storage-service.repair-async'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'storage-service.repair-async' && e.instance == 'n1')
- id: repair-named-system-distributed
  flow: nodetool-repair
  name: system_distributed is repaired when named explicitly
  fixtures:
  - three-node-rf3
  input:
    args:
      keyspace: system_distributed
  expect:
  - result.ok && result.value.exit_status == 0
  - calls['repair-runner.run'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'repair-runner.run' && e.instance == 'n1')
- id: repair-parent-status-failed
  flow: nodetool-repair
  name: "Parent repair session FAILED: IOException wrapped, exit 2, later keyspaces not repaired"
  fixtures:
  - three-node-rf3
  choices:
    repair-runner.run.parent_status: FAILED
  expect:
  - result.ok && result.value.exit_status == 2
  - "result.value.output.startsWith('error: ')"
  - calls['repair-runner.run'] == 1 && ctx.opsRepairOutcome == 'failed'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'repair-runner.run' && e.instance == 'n1')
- id: repair-error-notification
  flow: nodetool-repair
  name: An ERROR progress notification fails the repair (exit 2)
  fixtures:
  - three-node-rf3
  input:
    args:
      keyspace: ks1
  choices:
    repair-runner.run.notification: error
  expect:
  - result.ok && result.value.exit_status == 2
  - result.value.output.contains('Repair job has failed with the error message')
  - calls['storage-service-mbean.get-parent-repair-status'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'node-tool.execute' && e.instance == 'n1')
- id: repair-jmx-connection-closed
  flow: nodetool-repair
  name: "JMX connection drops while waiting: IOException, exit 2"
  fixtures:
  - three-node-rf3
  input:
    args:
      keyspace: ks1
  choices:
    repair-runner.run.notification: connection_closed
  expect:
  - result.ok && result.value.exit_status == 2
  - result.value.output.contains('JMX connection closed')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'node-tool.execute' && e.instance == 'n1')
- id: repair-rf1-nothing-to-do
  flow: nodetool-repair
  name: "repairAsync returns 0 (RF 1): nothing to repair, no status polling"
  fixtures:
  - three-node-rf3
  input:
    args:
      keyspace: ks1
  choices:
    repair-runner.run.started: nothing_to_repair
  expect:
  - result.ok && result.value.exit_status == 0
  - calls['storage-service-mbean.get-parent-repair-status'] == 0 && ctx.opsRepairOutcome == 'nothing to repair'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'node-tool.execute' && e.instance == 'n1')
- id: repair-primary-range-with-dc
  flow: nodetool-repair
  name: -pr with -dc is refused client side (RuntimeException, exit 2)
  fixtures:
  - three-node-rf3
  input:
    args:
      options:
        pr: true
        dc: dc1
  expect:
  - result.ok && result.value.exit_status == 2
  - "result.value.output == 'error: Primary range repair should be performed on all nodes in the cluster.'"
  - calls['node-tool-node-tool-cmd.parse-optional-keyspace'] == 0 && calls['storage-service.repair-async'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'node-tool.execute' && e.instance == 'n1')
- id: repair-unknown-keyspace
  flow: nodetool-repair
  name: "Unknown keyspace: IllegalArgumentException from argument parsing, exit 1"
  fixtures:
  - three-node-rf3
  input:
    args:
      keyspace: nosuch
  expect:
  - result.ok && result.value.exit_status == 1
  - "result.value.output == 'nodetool: Keyspace [nosuch] does not exist.'"
  - calls['repair-runner.run'] == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'node-tool.execute' && e.instance == 'n1')
- id: repair-jmx-unreachable
  flow: nodetool-repair
  name: "Node not reachable on 7199: connect fails, exit 1"
  fixtures:
