- component: database-descriptor
  name: daemon-initialization
  kind: function
  summary: "DatabaseDescriptor.daemonInitialization: load cassandra.yaml through YamlConfigurationLoader, applyAll, then AuthConfig.applyAuth."
  sources:
  - src/java/org/apache/cassandra/config/DatabaseDescriptor.java:245-265
  - src/java/org/apache/cassandra/config/DatabaseDescriptor.java:391-400
  request: &id001
    type: object
    properties: {}
  response: *id001
  errors:
  - code: configuration-exception
    summary: "ConfigurationException: invalid cassandra.yaml"
  behavior:
  - if: "!state.config_valid"
    then:
    - title: Invalid configuration
      source: src/java/org/apache/cassandra/config/DatabaseDescriptor.java:250-264
      detail: loadConfig/applyAll reject the yaml with a ConfigurationException; activate() catches it.
      fail:
        code: configuration-exception
        message: "Invalid yaml: cassandra.yaml"
  - title: Config loaded and applied
    source: src/java/org/apache/cassandra/config/DatabaseDescriptor.java:262-264
    return: {}
- component: startup-checks
  name: verify
  kind: function
  summary: "StartupChecks.verify: run every pre-flight check in order, then each post-action; the first StartupException aborts startup."
  sources:
  - src/java/org/apache/cassandra/service/StartupChecks.java:176-193
  request: *id001
  response: *id001
  errors:
  - code: startup-exception
    summary: StartupException; data.exit_code is its returnCode (1 machine state, 3 disk state, 100 config)
  behavior:
  - title: checkNativeLibraryInitialization
    source: src/java/org/apache/cassandra/service/StartupChecks.java:409-420
    detail: Fails with ERR_WRONG_MACHINE_STATE (1) when JNA could not initialise.
    if: "!state.native_library_ok"
    then:
    - fail:
        code: startup-exception
        message: 'The native library could not be initialized properly. '
        data:
          exit_code: 1
  - title: "checkDataDirs: data, commitlog, saved_caches and hints directories"
    source: src/java/org/apache/cassandra/service/StartupChecks.java:561-594
    detail: A missing directory is created; failing that, or lacking full permissions, is ERR_WRONG_DISK_STATE (3).
    foreach: "= state.data_dirs"
    as: dir
    index: path
    steps:
    - if: "!vars.dir.exists && !vars.dir.can_create"
      then:
      - fail:
          code: startup-exception
          message: "= 'Has no permission to create directory ' + vars.path"
          data:
            exit_code: 3
    - if: "!vars.dir.writable"
      then:
      - fail:
          code: startup-exception
          message: "= 'Insufficient permissions on directory ' + vars.path"
          data:
            exit_code: 3
  - title: checkSSTablesFormat
    source: src/java/org/apache/cassandra/service/StartupChecks.java:596-709
    detail: SSTables in a format this version cannot read stop startup with ERR_WRONG_DISK_STATE (3).
    if: state.sstables_need_upgrade
    then:
    - fail:
        code: startup-exception
        message: Detected unreadable sstables, please check NEWS.txt and ensure that you have upgraded through all required intermediate versions, running upgradesstables
        data:
          exit_code: 3
  - title: checkDatacenter
    source: src/java/org/apache/cassandra/service/StartupChecks.java:736-771
    detail: The snitch DC must match the DC saved in system.local, unless check_dc is disabled; mismatch is ERR_WRONG_CONFIG (100).
    if: config['startup-checks-check-dc-enabled'] && state.stored_dc != '' && state.stored_dc != state.current_dc
    then:
    - fail:
        code: startup-exception
        data:
          exit_code: 100
        message: "= \"Cannot start node if snitch's data center (\" + state.current_dc + ') differs from previous data center (' + state.stored_dc + ').'"
  - title: checkRack
    source: src/java/org/apache/cassandra/service/StartupChecks.java:773-808
    detail: Same rule for the rack; mismatch is ERR_WRONG_CONFIG (100).
    if: config['startup-checks-check-rack-enabled'] && state.stored_rack != '' && state.stored_rack != state.current_rack
    then:
    - fail:
        code: startup-exception
        data:
          exit_code: 100
        message: "= \"Cannot start node if snitch's rack (\" + state.current_rack + ') differs from previous rack (' + state.stored_rack + ').'"
  - title: checkLegacyAuthTables
    source: src/java/org/apache/cassandra/service/StartupChecks.java:810-822
    detail: Pre-2.2 auth tables still present stop startup with ERR_WRONG_CONFIG (100).
    if: state.legacy_auth_tables_present
    then:
    - fail:
        code: startup-exception
        message: Legacy auth tables credentials, users, permissions in keyspace system_auth still exist and have not been properly migrated.
        data:
          exit_code: 100
  - title: All checks passed; run post-actions (failures only logged)
    source: src/java/org/apache/cassandra/service/StartupChecks.java:185-196
    return: {}
