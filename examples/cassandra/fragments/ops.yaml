- component: audit-log-manager
  name: query-success
  kind: function
  summary: "AuditLogManager.querySuccess: build an AuditLogEntry for a successful CQL query and log it unless filtered."
  sources:
  - src/java/org/apache/cassandra/audit/AuditLogManager.java:242-252
  - src/java/org/apache/cassandra/audit/AuditLogManager.java:136-142
  request:
    $ref: OpsAuditLogEntry
  response:
    type: object
    properties:
      logged:
        type: boolean
  behavior:
  - if: "!state.listener_registered"
    then:
    - title: Not registered as a QueryEvents listener
      source: src/java/org/apache/cassandra/audit/AuditLogManager.java:89-93
      detail: With audit logging disabled the manager never registers, so no entry is produced (the installed logger is NoOpAuditLogger).
      return:
        logged: false
  - call: audit-log-filter.is-filtered
    as: flt
    input:
      entry: "= input"
      filter:
        included_keyspaces: "= state.included_keyspaces"
        excluded_keyspaces: "= state.excluded_keyspaces"
        included_categories: "= state.included_categories"
        excluded_categories: "= state.excluded_categories"
        included_users: "= state.included_users"
        excluded_users: "= state.excluded_users"
  - if: vars.flt.value.filtered
    then:
    - set:
        ctx.opsAuditFiltered: true
    - return:
        logged: false
  - title: Hand the entry to the configured logger
    source: src/java/org/apache/cassandra/audit/AuditLogManager.java:138-141
    call: bin-audit-logger.log
    input: "= input"
  - set:
      state.logged: "= state.logged + 1"
      ctx.opsAuditFiltered: false
  - return:
      logged: true
- component: audit-log-manager
  name: enable
  kind: function
  summary: "AuditLogManager.enable: swap in the configured logger (unless the class is unchanged), always reload the filters, register as listener."
  sources:
  - src/java/org/apache/cassandra/audit/AuditLogManager.java:187-218
  request:
    type: object
    properties:
      logger:
        type: string
        default: BinAuditLogger
      included_keyspaces:
        type: array
        items:
          type: string
        default: []
      excluded_keyspaces:
        type: array
        items:
          type: string
        default:
        - system
        - system_schema
        - system_virtual_schema
      included_categories:
        type: array
        items:
          type: string
        default: []
      excluded_categories:
        type: array
        items:
          type: string
        default: []
      included_users:
        type: array
        items:
          type: string
        default: []
      excluded_users:
        type: array
        items:
          type: string
        default: []
  response: *id001
  errors:
  - code: configuration-exception
    summary: logger class not on the classpath
  behavior:
  - set:
      state.included_keyspaces: "= input.included_keyspaces"
      state.excluded_keyspaces: "= input.excluded_keyspaces"
      state.included_categories: "= input.included_categories"
      state.excluded_categories: "= input.excluded_categories"
      state.included_users: "= input.included_users"
      state.excluded_users: "= input.excluded_users"
    title: Filters are rebuilt in the finally block, even when the logger is unchanged
    source: src/java/org/apache/cassandra/audit/AuditLogManager.java:203-210
  - set:
      state.logger: "= input.logger"
      state.enabled: true
      state.listener_registered: true
    title: Register with QueryEvents and AuthEvents, then stop the old logger
    source: src/java/org/apache/cassandra/audit/AuditLogManager.java:213-218
  - return: {}
- component: audit-log-manager
  name: is-enabled
