  name: get-valid-column-families
  kind: function
  summary: "StorageService.getValidColumnFamilies: validate the keyspace (not virtual, exists) and resolve table names; an unknown table is an IllegalArgumentException."
  sources:
  - src/java/org/apache/cassandra/service/StorageService.java:4731-4735
  - src/java/org/apache/cassandra/service/StorageService.java:4559-4572
  - src/java/org/apache/cassandra/db/Keyspace.java:688-739
  - src/java/org/apache/cassandra/db/Keyspace.java:215-221
  request:
    type: object
    properties:
      keyspace: &id005
        type: string
        examples:
        - ks1
