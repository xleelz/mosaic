      - call: query-processor.process-query-string
        input: {query: "DELETE FROM system_auth.identity_to_role WHERE identity = ?", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.identities-delete
        input: {identity: "= input.identity"}
  # ===================================== reconciliation: interfaces callers use
  - component: schema
    name: validate-table
    kind: function
    summary: "Schema.validateTable: non-empty table name, the keyspace must exist (KeyspaceNotDefinedException, an InvalidRequestException) and so must the table or view."
    description: Local and virtual system keyspaces are hard-coded in the code, not stored in system_schema; the model accepts any table in them.
    sources: [src/java/org/apache/cassandra/schema/Schema.java:429-443]
    request: {type: object, required: [keyspace, table], properties: {keyspace: {type: string, default: shop}, table: {type: string, default: users}}}
    response: {type: object, properties: {keyspace: {type: string}, table: {type: string}, columns: {type: array, items: {type: string}}}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - if: "input.table == ''"
        then:
          - source: src/java/org/apache/cassandra/schema/Schema.java:431-432
            fail: {code: invalid, status: 8704, message: non-empty table is required}
      - if: "input.keyspace in ['system', 'system_schema', 'system_views', 'system_virtual_schema']"
        then: [{return: {keyspace: "= input.keyspace", table: "= input.table"}}]
      - call: schema-keyspace.rows-query
        input: {keyspace: "= input.keyspace", kind: ""}
        as: rows
      - if: "!vars.rows.value.exists(r, r.kind == 'keyspace')"
        then:
          - source: src/java/org/apache/cassandra/schema/Schema.java:434-436
            fail: {code: invalid, status: 8704, message: "= 'keyspace ' + input.keyspace + ' does not exist'"}
      - if: "!vars.rows.value.exists(r, r.kind in ['table', 'view'] && r.name == input.table)"
        then:
          - source: src/java/org/apache/cassandra/schema/Schema.java:438-440
            fail: {code: invalid, status: 8704, message: "= 'table ' + input.table + ' does not exist'"}
      - return: {keyspace: "= input.keyspace", table: "= input.table", columns: "= vars.rows.value.filter(r, r.kind in ['table', 'view'] && r.name == input.table)[0].def.columns"}
  - component: schema
    name: get-distributed-schema-blocking
    kind: function
    summary: "Schema.getDistributedSchemaBlocking (synchronized): the distributed keyspaces and the version, consistently."
    sources: [src/java/org/apache/cassandra/schema/Schema.java:506-509]
    response:
      type: object
      properties:
        version: {type: string}
        keyspaces: {type: array, items: {type: object}}
    behavior:
      - call: schema-keyspace.rows-query
        input: {keyspace: "", kind: ""}
        as: rows
      - return:
          version: "= state.version"
          keyspaces: "= vars.rows.value.filter(k, k.kind == 'keyspace').map(k, {'name': k.name, 'tables': vars.rows.value.filter(r, r.kind == 'table' && r.keyspace == k.name).map(r, r.name), 'indexes': vars.rows.value.filter(r, r.kind == 'index' && r.keyspace == k.name).map(r, r.name), 'views': vars.rows.value.filter(r, r.kind == 'view' && r.keyspace == k.name).map(r, r.name), 'types': vars.rows.value.filter(r, r.kind == 'type' && r.keyspace == k.name).map(r, r.name), 'functions': vars.rows.value.filter(r, r.kind == 'function' && r.keyspace == k.name).map(r, r.name), 'aggregates': vars.rows.value.filter(r, r.kind == 'aggregate' && r.keyspace == k.name).map(r, r.name)})"
  - component: schema
    name: largest-gcgs
    kind: function
    summary: "Schema.largestGcgs: the largest gc_grace_seconds over all tables (Integer.MIN_VALUE when there are none)."
    description: Table params are not modelled; every table has the default gc_grace_seconds 864000 (10 days).
    sources: [src/java/org/apache/cassandra/schema/Schema.java:272-279]
    request: {type: object}
    response: {type: object, properties: {gcgs: {type: integer, examples: [864000]}}}
    behavior:
      - call: schema-keyspace.rows-query
        input: {keyspace: "", kind: table}
        as: rows
      - return: {gcgs: "= size(vars.rows.value) > 0 ? 864000 : -2147483648"}
  - component: schema
    name: load-from-disk
    kind: function
    summary: "Schema.loadFromDisk at startup: updateHandler.reset(true) - read system_schema, merge it, announce the version."
    sources: [src/java/org/apache/cassandra/schema/Schema.java:152-157]
    request: {type: object, properties: {}}
    response: {type: object, properties: {}}
    behavior:
