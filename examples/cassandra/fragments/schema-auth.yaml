        input: {role: "= input.role"}
        as: ex
      - if: "vars.ex.value.exists"
        then:
          - call: roles.has-superuser-status
            input: {role: "= input.role"}
            as: target
          - call: authenticated-user.is-super
            input: {user: "= input.user"}
            as: me
          - if: "vars.target.value.is_super && !vars.me.value.is_super"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:48-51
                fail: {code: unauthorized, status: 8448, message: Only superusers can drop a role with superuser status}
      - return: {}
  - component: drop-role-statement
    name: validate
    kind: function
    summary: "validate: ensureNotAnonymous, the role must exist unless IF EXISTS, and you cannot drop your own login role."
    sources: [src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:54-65]
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.ensure-not-anonymous
      - if: "!input.if_exists"
        then:
          - call: cassandra-role-manager.is-existing-role
            input: {role: "= input.role"}
            as: ex
          - if: "!vars.ex.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:59-60
                fail: {code: invalid, status: 8704, message: "= input.role + \" doesn't exist\""}
      - if: "input.user == input.role"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:62-64
            fail: {code: invalid, status: 8704, message: Cannot DROP primary role for current login}
      - return: {}
  - component: drop-role-statement
    name: execute
    kind: function
    summary: "execute: drop the role, then revoke every permission held by it and on it, its datacenter and CIDR permissions."
    sources: [src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:67-80]
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    behavior:
      - if: "input.if_exists"
        then:
          - call: cassandra-role-manager.is-existing-role
            input: {role: "= input.role"}
            as: ex
          - if: "!vars.ex.value.exists"
            then: [{return: {kind: VOID}}]
      - call: cassandra-role-manager.drop-role
        input: {performer: "= input.user", role: "= input.role"}
      - call: auth-config.get-backends
        as: b
      - title: authorizer.revokeAllFrom(role) and revokeAllOn(role)
        source: src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:75-76
        call: "= vars.b.value.authorizer_component + '.revoke-all-from'"
        targets: [cassandra-authorizer.revoke-all-from, allow-all-authorizer.revoke-all-from]
        input: {role: "= input.role"}
      - call: "= vars.b.value.authorizer_component + '.revoke-all-on'"
        targets: [cassandra-authorizer.revoke-all-on, allow-all-authorizer.revoke-all-on]
        input: {resource: "= 'roles/' + input.role"}
      - return: {kind: VOID}

  - component: role-management-statement
    name: authorize
    kind: function
    summary: GRANT/REVOKE role requires AUTHORIZE on the granted role.
    sources: [src/java/org/apache/cassandra/cql3/statements/RoleManagementStatement.java:42-45]
    request: SchemaAuthRoleStatement
    errors: [{code: unauthorized, status: 8448}]
    behavior:
