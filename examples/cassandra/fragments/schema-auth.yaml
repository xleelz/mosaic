        then:
          - source: src/java/org/apache/cassandra/cql3/statements/RoleManagementStatement.java:51-52
            fail: {code: invalid, status: 8704, message: "= input.role + \" doesn't exist\""}
      - call: cassandra-role-manager.is-existing-role
        input: {role: "= input.grantee"}
        as: g
      - if: "!vars.g.value.exists"
        then:
