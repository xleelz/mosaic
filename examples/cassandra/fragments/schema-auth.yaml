flows:
  - id: create-keyspace
    name: CREATE KEYSPACE
    description: 'CREATE KEYSPACE through AlterSchemaStatement.execute: apply on the coordinator, digest, merge, announce through gossip, then push SCHEMA_PUSH_REQ to live peers asynchronously.'
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement:
          type: CREATE_KEYSPACE
          keyspace: inventory
          replication: {class: SimpleStrategy, replication_factor: 3}
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:63-88']
    tags: [writes]
  - id: create-table
    name: CREATE TABLE
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement:
          type: CREATE_TABLE
          keyspace: shop
          table: customers
          columns: [id uuid, name text]
          partition_key: [id]
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/CreateTableStatement.java:97-124']
    tags: [writes]
  - id: alter-keyspace
    name: ALTER KEYSPACE
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement:
          type: ALTER_KEYSPACE
          keyspace: shop
          replication: {class: SimpleStrategy, replication_factor: 5}
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:69-97']
    tags: [writes]
  - id: drop-keyspace
    name: DROP KEYSPACE
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement: {type: DROP_KEYSPACE, keyspace: shop}
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/DropKeyspaceStatement.java:41-52']
    tags: [writes]
  - id: drop-table
    name: DROP TABLE
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement: {type: DROP_TABLE, keyspace: shop, table: orders}
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/DropTableStatement.java:50-80']
    tags: [writes]
  - id: alter-table
    name: ALTER TABLE
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement:
          type: ALTER_TABLE_ADD_COLUMNS
          keyspace: shop
          table: orders
          columns: [note text]
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/AlterTableStatement.java:104-123']
    tags: [writes]
  - id: type-ddl
    name: CREATE, ALTER and DROP TYPE
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement:
          type: CREATE_TYPE
          keyspace: shop
          name: address
          columns: [street text, city text]
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/CreateTypeStatement.java:78-112']
    tags: [writes]
  - id: other-ddl
    name: Index, view, function, aggregate and trigger DDL
    entry:
      caller: cql
      interface: alter-schema-statement.execute
      input:
        statement:
          type: CREATE_INDEX
          keyspace: shop
          table: orders
          name: orders_total_idx
          columns: [total]
    sources: ['src/java/org/apache/cassandra/cql3/statements/schema/CreateIndexStatement.java:116-278']
    tags: [writes]
  - id: schema-push-receive
    name: SCHEMA_PUSH_REQ received
    entry:
      caller: messaging
      interface: schema-push-verb-handler.do-verb
      input:
        from: n1
        mutations:
          - op: put
            kind: table
            keyspace: shop
            name: customers
            def:
              columns: [id uuid, name text]
              partition_key: [id]
            sig: table:shop.customers{id uuid,name text}
      'on': n2
    sources: ['src/java/org/apache/cassandra/schema/SchemaPushVerbHandler.java:51-61']
    tags: [writes]
  - id: schema-pull
    name: Gossip reports a different schema version
    description: DefaultSchemaUpdateHandler.onChange(SCHEMA) of a live ring member reports the version to MigrationCoordinator, which pulls the peer's schema with SCHEMA_PULL_REQ and merges it.
    entry:
      caller: membership
      interface: migration-coordinator.report-endpoint-version
      input: {endpoint: n2, version: 'v:peer-newer'}
    sources: ['src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:157-168']
    tags: [writes]
  - id: schema-periodic-pull
    name: Periodic pull of unreceived schema versions
    entry:
      caller: node-ops
      interface: migration-coordinator.pull-unreceived-schema-versions
      repeat: {count: 2, interval_ms: 60000, initial_delay_ms: 60000}
    sources: ['src/java/org/apache/cassandra/schema/MigrationCoordinator.java:257-265']
    tags: [writes]
  - id: schema-version-request
    name: SCHEMA_VERSION_REQ received
    entry:
      caller: messaging
      interface: schema-version-verb-handler.do-verb
      input: {to: n3, from: n1}
    sources: ['src/java/org/apache/cassandra/schema/SchemaVersionVerbHandler.java:36-41']
  - id: reset-local-schema
    name: Reset the local schema (nodetool resetlocalschema)
    entry: {caller: node-ops, interface: schema.reset-local-schema}
    sources: ['src/java/org/apache/cassandra/schema/Schema.java:620-642']
    tags: [writes]
  - id: reload-local-schema
    name: Reload the local schema from disk (nodetool reloadlocalschema)
    entry: {caller: node-ops, interface: schema.reload-schema-and-announce-version}
    sources: ['src/java/org/apache/cassandra/schema/Schema.java:583-586']
    tags: [writes]
  - id: auth-config-startup
    name: Auth backends at startup (AuthConfig.applyAuth)
    entry: {caller: cassandra-node, interface: auth-config.apply-auth}
    sources: ['src/java/org/apache/cassandra/auth/AuthConfig.java:41-130']
  - id: permission-check
    name: Permission lookup (AuthenticatedUser.getPermissions)
    description: ClientState asks for the user's permissions on each resource of the chain; this flow is one such lookup.
    entry:
      caller: transport
      interface: authenticated-user.get-permissions
      input: {user: alice, resource: data/shop/orders}
    sources: ['src/java/org/apache/cassandra/auth/AuthenticatedUser.java:126-129']
  - id: permission-check-cached
    name: Permission lookup twice within the validity period
    entry:
      caller: transport
      interface: authenticated-user.get-permissions
      input: {user: alice, resource: data/shop/orders}
      repeat: {count: 2, interval_ms: 500}
    sources: ['src/java/org/apache/cassandra/auth/PermissionsCache.java:44-47']
  - id: permission-check-expired
    name: Permission lookup twice, further apart than the validity period
    entry:
      caller: transport
      interface: authenticated-user.get-permissions
