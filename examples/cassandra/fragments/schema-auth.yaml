  # ============================================== identities (mTLS), role manager side
  - component: authorization-statement
    name: maybe-correct-resource
    kind: function
    summary: "maybeCorrectResource: a table-level data resource without a keyspace gets the session keyspace."
    sources: [src/java/org/apache/cassandra/cql3/statements/AuthorizationStatement.java:56-65]
    request: {type: object, properties: {resource: {type: string, default: data/shop/orders}}}
    response: {type: object, properties: {resource: {type: string}}}
    behavior:
      - return: {resource: "= input.resource"}
  - {component: auth-keyspace, name: identities-get, kind: store, summary: "SELECT role FROM system_auth.identity_to_role WHERE identity = ?", sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:176-187], request: {type: object, properties: {identity: {type: string}}}, store: {table: identity_to_roles, op: get, key: "= input.identity", default: {missing: true}}}
  - {component: auth-keyspace, name: identities-put, kind: store, summary: "INSERT INTO system_auth.identity_to_role (identity, role)", sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:202-213], request: {type: object, properties: {identity: {type: string}, role: {type: string}}}, store: {table: identity_to_roles, op: put, key: "= input.identity", value: "= {'identity': input.identity, 'role': input.role}"}}
  - {component: auth-keyspace, name: identities-delete, kind: store, summary: "DELETE FROM system_auth.identity_to_role WHERE identity = ?", sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:226-232], request: {type: object, properties: {identity: {type: string}}}, store: {table: identity_to_roles, op: delete, key: "= input.identity"}}
  - component: cassandra-role-manager
    name: is-existing-identity
    kind: function
    summary: isExistingIdentity - SELECT identity FROM identity_to_role at auth_read_consistency_level.
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:215-224]
    request: {type: object, properties: {identity: {type: string}}}
    response: {type: object, properties: {exists: {type: boolean}}}
    behavior:
      - call: auth-properties.get-read-consistency-level
        as: cl
      - call: query-processor.process-query-string
        input: {query: "SELECT identity from system_auth.identity_to_role where identity=?", consistency: "= vars.cl.value.consistency"}
      - call: auth-keyspace.identities-get
        input: {identity: "= input.identity"}
        as: row
      - return: {exists: "= !has(vars.row.value.missing)"}
  - component: cassandra-role-manager
    name: role-for-identity
    kind: function
    summary: roleForIdentity - the role bound to an identity, or none.
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:176-187]
    request: {type: object, properties: {identity: {type: string}}}
    response: {type: object, properties: {role: {type: string}}}
    behavior:
      - call: auth-properties.get-read-consistency-level
        as: cl
      - call: select-statement.execute
        input: {statement: {type: SELECT, keyspace: system_auth, table: identity_to_role, partition_keys: [{partition_key: "= input.identity", token: 0}]}, options: {consistency: "= vars.cl.value.consistency"}, client_state: {user: system, is_super: true}}
        fill: true
      - call: auth-keyspace.identities-get
        input: {identity: "= input.identity"}
        as: row
      - return: {role: "= has(vars.row.value.missing) ? '' : vars.row.value.role"}
  - component: cassandra-role-manager
    name: add-identity
    kind: function
    summary: "addIdentity: an identity already bound to a role is an IllegalStateException; otherwise INSERT at auth_write_consistency_level."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:201-213]
    request: {type: object, properties: {identity: {type: string}, role: {type: string}}}
    errors: [{code: illegal-state, status: 0}]
    behavior:
      - call: cassandra-role-manager.is-existing-identity
        input: {identity: "= input.identity"}
        as: ex
      - if: "vars.ex.value.exists"
        then:
          - source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:204-207
            fail: {code: illegal-state, status: 0, message: "= 'Identity is already associated with another role, cannot associate it with role ' + input.role"}
      - call: auth-properties.get-write-consistency-level
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "INSERT INTO system_auth.identity_to_role (identity, role) VALUES (?, ?)", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.identities-put
        input: {identity: "= input.identity", role: "= input.role"}
  - component: cassandra-role-manager
    name: drop-identity
    kind: function
    summary: dropIdentity - DELETE FROM identity_to_role at auth_write_consistency_level.
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:226-232]
    request: {type: object, properties: {identity: {type: string}}}
    behavior:
      - call: auth-properties.get-write-consistency-level
