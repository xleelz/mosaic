  - component: role-management-statement
    name: validate
    kind: function
    summary: "validate: ensureNotAnonymous; both the role and the grantee must exist."
    sources: [src/java/org/apache/cassandra/cql3/statements/RoleManagementStatement.java:47-56]
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
