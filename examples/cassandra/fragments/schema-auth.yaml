  # ================================================================ auth core
  - component: auth-config
    name: apply-auth
    kind: function
    summary: "AuthConfig.applyAuth at startup: instantiate the configured backends (AllowAll* when unset) and refuse inconsistent combinations."
    sources: [src/java/org/apache/cassandra/auth/AuthConfig.java:41-130]
    response: {type: object, properties: {authenticator: {type: string}, authorizer: {type: string}}}
    errors: [{code: config-error, status: 8960}]
    behavior:
      - title: Configured backends (cassandra.yaml), unless already installed state overrides them
        set:
          vars.c: "= {'authenticator': has(state.authenticator) ? state.authenticator : config['authenticator'], 'authorizer': has(state.authorizer) ? state.authorizer : config['authorizer'], 'role_manager': has(state.role_manager) ? state.role_manager : config['role-manager'], 'network_authorizer': has(state.network_authorizer) ? state.network_authorizer : config['network-authorizer'], 'cidr_authorizer': has(state.cidr_authorizer) ? state.cidr_authorizer : config['cidr-authorizer']}"
      - set: {vars.authn: "= vars.c.authenticator == 'PasswordAuthenticator' || vars.c.authenticator.startsWith('MutualTls')"}
      - if: "!vars.authn && vars.c.authorizer != 'AllowAllAuthorizer'"
        then:
          - title: An authorizer that requires authorization needs an authenticator that requires authentication
            source: src/java/org/apache/cassandra/auth/AuthConfig.java:75-79
            fail: {code: config-error, status: 8960, message: "= 'org.apache.cassandra.auth.' + vars.c.authorizer + ' has authorization enabled which requires org.apache.cassandra.auth.' + vars.c.authenticator + ' to enable authentication'"}
      - if: "vars.c.authenticator == 'PasswordAuthenticator' && vars.c.role_manager != 'CassandraRoleManager'"
        then:
          - source: src/java/org/apache/cassandra/auth/AuthConfig.java:87-88
            fail: {code: config-error, status: 8960, message: org.apache.cassandra.auth.PasswordAuthenticator requires org.apache.cassandra.auth.CassandraRoleManager}
      - if: "!vars.authn && (vars.c.network_authorizer != 'AllowAllNetworkAuthorizer' || vars.c.cidr_authorizer != 'AllowAllCIDRAuthorizer')"
        then:
          - source: src/java/org/apache/cassandra/auth/AuthConfig.java:101-117
            fail: {code: config-error, status: 8960, message: "= 'network or CIDR authorizer can\\'t be used with ' + vars.c.authenticator"}
      - return: {authenticator: "= vars.c.authenticator", authorizer: "= vars.c.authorizer"}
