      - if: "vars.rows.value.exists(r, r.kind == 'aggregate' && r.name == input.name) && !input.or_replace"
        then:
          - if: "input.if_not_exists"
            then: [{return: {mutations: [], warnings: [], created_resources: []}}]
          - source: src/java/org/apache/cassandra/cql3/statements/schema/CreateAggregateStatement.java:212-216
            fail: {code: invalid, status: 8704, message: "= \"Aggregate '\" + input.keyspace + '.' + input.name + \"' already exists\""}
      - return:
          mutations:
            - {op: put, kind: aggregate, keyspace: "= input.keyspace", name: "= input.name", def: {state_function: "= input.state_function"}, sig: "= 'aggregate:' + input.keyspace + '.' + input.name"}
          warnings: []
          event: {change: CREATED, target: AGGREGATE, keyspace: "= input.keyspace", name: "= input.name"}
          created_resources: ["= 'functions/' + input.keyspace + '/' + input.name"]

