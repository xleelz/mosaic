schemas:
  - id: SchemaAuthSchemaStatement
    summary: "A parsed DDL statement as AlterSchemaStatement.execute sees it. 'statement' is the component id of the statement class (inner ALTER TABLE/TYPE classes included)."
    schema:
      type: object
      required: [statement, keyspace]
      properties:
        statement:
          type: string
          default: create-keyspace-statement
          enum: [create-keyspace-statement, alter-keyspace-statement, drop-keyspace-statement, create-table-statement, drop-table-statement, alter-table-statement-alter-column, alter-table-statement-mask-column, alter-table-statement-add-columns, alter-table-statement-drop-columns, alter-table-statement-rename-columns, alter-table-statement-alter-options, alter-table-statement-drop-compact-storage, create-type-statement, alter-type-statement-add-field, alter-type-statement-rename-fields, alter-type-statement-alter-field, drop-type-statement, create-index-statement, drop-index-statement, create-view-statement, alter-view-statement, drop-view-statement, create-function-statement, drop-function-statement, create-aggregate-statement, drop-aggregate-statement, create-trigger-statement, drop-trigger-statement]
        keyspace: {type: string, default: inventory}
        table: {type: string, default: items, description: "Table the statement targets (base table for views, indexes and triggers)."}
        name: {type: string, default: "", description: "Name of the type, index, view, function, aggregate or trigger."}
        columns: {type: array, items: {type: string}, default: [id uuid, qty int], description: "Column or field definitions as 'name type'; for DROP and RENAME just the names (RENAME: [old, new])."}
        partition_key: {type: array, items: {type: string}, default: [id]}
        replication:
          type: object
          properties:
            class: {type: string, default: SimpleStrategy, description: "Empty when the REPLICATION option is absent."}
            replication_factor: {type: integer, default: 3}
        options: {type: string, default: "", description: "Table options (ALTER TABLE ... WITH), trigger class, or masking function."}
        custom_class: {type: string, default: "", description: "CREATE CUSTOM INDEX ... USING <class>."}
        language: {type: string, default: java}
        state_function: {type: string, default: ""}
        if_not_exists: {type: boolean, default: false}
        if_exists: {type: boolean, default: false}
        or_replace: {type: boolean, default: false}
        locally: {type: boolean, default: false, description: "true for executeLocally (no announce, no push)."}
        user: {type: string, default: anonymous, description: "ClientState.getUser(); anonymous under the deployed AllowAllAuthenticator."}
  - id: SchemaAuthDdlRequest
    summary: "A DDL statement as QueryProcessor.processStatement hands it to CQLStatement.authorize/validate/execute: cql's CqlRequest shape (statement, options, client_state). statement.type names the statement class; ALTER TABLE and ALTER TYPE carry the inner alteration in the type."
    schema:
      type: object
      required: [statement]
      properties:
        statement:
          type: object
          required: [type, keyspace]
          properties:
            type: {type: string, default: CREATE_KEYSPACE, enum: [CREATE_KEYSPACE, ALTER_KEYSPACE, DROP_KEYSPACE, CREATE_TABLE, DROP_TABLE, ALTER_TABLE_ALTER_COLUMN, ALTER_TABLE_MASK_COLUMN, ALTER_TABLE_ADD_COLUMNS, ALTER_TABLE_DROP_COLUMNS, ALTER_TABLE_RENAME_COLUMNS, ALTER_TABLE_ALTER_OPTIONS, ALTER_TABLE_DROP_COMPACT_STORAGE, CREATE_TYPE, ALTER_TYPE_ADD_FIELD, ALTER_TYPE_RENAME_FIELDS, ALTER_TYPE_ALTER_FIELD, DROP_TYPE, CREATE_INDEX, DROP_INDEX, CREATE_VIEW, ALTER_VIEW, DROP_VIEW, CREATE_FUNCTION, DROP_FUNCTION, CREATE_AGGREGATE, DROP_AGGREGATE, CREATE_TRIGGER, DROP_TRIGGER]}
            keyspace: {type: string, default: inventory}
            table: {type: string, default: items}
            name: {type: string, default: ""}
            columns: {type: array, items: {type: string}, default: [id uuid, qty int]}
            partition_key: {type: array, items: {type: string}, default: [id]}
            replication:
              type: object
              properties:
                class: {type: string, default: SimpleStrategy}
                replication_factor: {type: integer, default: 3}
            options: {type: string, default: ""}
            custom_class: {type: string, default: ""}
            language: {type: string, default: java}
            state_function: {type: string, default: ""}
            if_not_exists: {type: boolean, default: false}
            if_exists: {type: boolean, default: false}
            or_replace: {type: boolean, default: false}
        options: {type: object, properties: {consistency: {type: string, default: ONE}}}
        client_state: {type: object, properties: {user: {type: string, default: anonymous}, keyspace: {type: string, default: ""}}}
  - id: SchemaAuthSchemaMutation
    summary: "One schema mutation against system_schema (a row put or a partition delete)."
    schema:
      type: object
      required: [op, kind, keyspace, name]
      properties:
        op: {type: string, enum: [put, delete]}
        kind: {type: string, enum: [keyspace, table, view, type, index, function, aggregate, trigger]}
        keyspace: {type: string, examples: [inventory]}
        name: {type: string, examples: [items]}
        def: {type: object}
        sig: {type: string, examples: ["table:inventory.items{id uuid,qty int}"]}
  - id: SchemaAuthTransformation
    summary: "The Keyspaces diff a statement's apply produced, as schema mutations, plus its client warnings, SCHEMA_CHANGE event and created resources."
    schema:
      type: object
      properties:
        mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}
        warnings: {type: array, items: {type: string}}
        event:
          type: object
          properties:
            change: {type: string, enum: [CREATED, UPDATED, DROPPED]}
            target: {type: string, enum: [KEYSPACE, TABLE, TYPE, FUNCTION, AGGREGATE]}
            keyspace: {type: string}
            name: {type: string}
        created_resources: {type: array, items: {type: string}}
  - id: SchemaAuthDiffEntry
    summary: One changed schema element after the mutations are applied on a replica.
    schema:
      type: object
      properties:
        kind: {type: string}
        keyspace: {type: string}
        name: {type: string}
        table: {type: string}
        change: {type: string, enum: [created, altered, dropped]}
  - id: SchemaAuthSchemaChangeResult
    summary: "ResultMessage of a DDL statement: Void when the diff was empty, else SCHEMA_CHANGE."
    schema:
      type: object
      properties:
        kind: {type: string, enum: [VOID, SCHEMA_CHANGE]}
        change: {type: string}
        target: {type: string}
        keyspace: {type: string}
        name: {type: string}
  - id: SchemaAuthSchemaVerbRequest
    summary: "An internode schema message; the receiving node is the call's instance. SCHEMA_PUSH_REQ carries mutations; SCHEMA_PULL_REQ and SCHEMA_VERSION_REQ carry none."
    schema:
      type: object
      properties:
        from: {type: string, default: n1}
        mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}
  - id: SchemaAuthRole
    summary: "A Role as CassandraRoleManager loads it from system_auth.roles (is_null marks Roles.nullRole())."
    schema:
      type: object
      properties:
        role: {type: string, examples: [alice]}
        is_superuser: {type: boolean, default: false}
        can_login: {type: boolean, default: true}
        member_of: {type: array, items: {type: string}}
        is_null: {type: boolean, default: false}
  - id: SchemaAuthRoleOptions
    summary: RoleOptions of CREATE/ALTER ROLE (the *_set flags say whether the option was given).
    schema:
      type: object
      properties:
        superuser_set: {type: boolean, default: false}
        superuser: {type: boolean, default: false}
        login_set: {type: boolean, default: true}
        login: {type: boolean, default: true}
        password: {type: string, default: s3cret}
  - id: SchemaAuthRoleStatement
    summary: "A role, permission or LIST statement plus the executing user (ClientState.getUser())."
    schema:
      type: object
      properties:
        statement: {type: string, default: "", description: "list-users-statement for LIST USERS; otherwise unused."}
        user: {type: string, default: cassandra}
        role: {type: string, default: bob}
        grantee: {type: string, default: alice}
        options: {$ref: SchemaAuthRoleOptions}
        permissions: {type: array, items: {type: string}, default: [SELECT]}
        resource: {type: string, default: data/shop}
        recursive: {type: boolean, default: true}
        if_exists: {type: boolean, default: false}
        if_not_exists: {type: boolean, default: false}
  - id: SchemaAuthStatementResult
    summary: "ResultMessage of a role or permission statement: Void (execute returned null) or Rows."
    schema:
      type: object
      properties:
        kind: {type: string, enum: [VOID, ROWS]}
        rows: {type: array, items: {type: object}}
  - id: SchemaAuthPermissionRequest
    summary: A permission lookup for one user on one resource.
    schema:
      type: object
      properties:
        user: {type: string, default: alice}
        resource: {type: string, default: data/shop/orders}
  - id: SchemaAuthPermissionSet
    summary: The permissions a user holds on one resource.
    schema:
      type: object
      properties:
        permissions: {type: array, items: {type: string}, examples: [[SELECT, MODIFY]]}
  - id: SchemaAuthPermissionChange
    summary: IAuthorizer.grant / revoke arguments.
    schema:
      type: object
      properties:
        performer: {type: string, default: cassandra}
        permissions: {type: array, items: {type: string}, default: [SELECT]}
        resource: {type: string, default: data/shop}
        grantee: {type: string, default: bob}
  - id: SchemaAuthCacheSetting
    summary: An AuthCacheMBean setter call.
    schema:
      type: object
      properties:
        cache: {type: string, default: PermissionsCache, enum: [PermissionsCache, RolesCache, CredentialsCache, NetworkPermissionsCache, JmxPermissionsCache]}
        value: {type: integer, default: 5000}
        enabled: {type: boolean, default: true}

interfaces:
  # ======================================================== DDL entry point
  - component: alter-schema-statement
    name: authorize
    kind: function
    summary: "The DDL statement's authorize(ClientState): the permission each statement class requires, checked by ClientState (CREATE on ALL KEYSPACES for CREATE KEYSPACE, CREATE on ALL TABLES for CREATE TABLE/TYPE, ALTER or DROP on the keyspace, table or type scope, CREATE or ALTER/DROP on function resources, superuser for triggers)."
    sources:
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:95-98
      - src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:104-107
      - src/java/org/apache/cassandra/cql3/statements/schema/DropKeyspaceStatement.java:59-62
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateTableStatement.java:162-165
      - src/java/org/apache/cassandra/cql3/statements/schema/DropTableStatement.java:87-90
      - src/java/org/apache/cassandra/cql3/statements/schema/AlterTableStatement.java:130-133
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateTypeStatement.java:121-124
      - src/java/org/apache/cassandra/cql3/statements/schema/AlterTypeStatement.java:62-65
      - src/java/org/apache/cassandra/cql3/statements/schema/DropTypeStatement.java:121-124
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateIndexStatement.java:285-288
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateViewStatement.java:355-358
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateFunctionStatement.java:173-181
      - src/java/org/apache/cassandra/cql3/statements/schema/DropFunctionStatement.java:140-151
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:88-91
      - src/java/org/apache/cassandra/cql3/statements/schema/DropTriggerStatement.java:74-77
    request: SchemaAuthDdlRequest
    errors: [{code: unauthorized, status: 8448}, {code: invalid, status: 8704}]
    behavior:
      - set:
          vars.t: "= input.statement.type"
          vars.ks: "= input.statement.keyspace"
      - if: "vars.t in ['CREATE_TRIGGER', 'DROP_TRIGGER']"
        then:
          - call: client-state.get-user
            as: u
          - if: "!vars.u.value.is_super"
            then:
              - title: ensureIsSuperuser
                source: src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:88-91
                fail: {code: unauthorized, status: 8448, message: "= vars.t == 'CREATE_TRIGGER' ? 'Only superusers are allowed to perform CREATE TRIGGER queries' : 'Only superusers are allowed to perfrom DROP TRIGGER queries'"}
          - return: {}
      - set:
          vars.permission: >-
            = vars.t.startsWith('CREATE_') && !(vars.t in ['CREATE_INDEX', 'CREATE_VIEW', 'CREATE_FUNCTION', 'CREATE_AGGREGATE']) ? 'CREATE'
            : vars.t in ['CREATE_FUNCTION', 'CREATE_AGGREGATE'] ? (input.statement.or_replace ? 'ALTER' : 'CREATE')
            : vars.t.startsWith('DROP_') && !(vars.t in ['DROP_INDEX', 'DROP_VIEW']) ? 'DROP' : 'ALTER'
          vars.resource: >-
            = vars.t == 'CREATE_KEYSPACE' ? 'data'
            : vars.t in ['ALTER_KEYSPACE', 'DROP_KEYSPACE'] ? 'data/' + input.statement.keyspace
            : vars.t in ['CREATE_TABLE', 'CREATE_TYPE', 'DROP_TYPE'] || vars.t.startsWith('ALTER_TYPE_') ? 'data/' + input.statement.keyspace + '/*'
            : vars.t in ['CREATE_FUNCTION', 'CREATE_AGGREGATE'] ? (input.statement.or_replace ? 'functions/' + input.statement.keyspace + '/' + input.statement.name : 'functions/' + input.statement.keyspace)
            : vars.t in ['DROP_FUNCTION', 'DROP_AGGREGATE'] ? 'functions/' + input.statement.keyspace + '/' + input.statement.name
            : 'data/' + input.statement.keyspace + '/' + input.statement.table
      - title: ClientState.ensure*Permission(permission, resource)
        call: client-state.ensure-permission
        input: {resource: "= vars.resource", keyspace: "= vars.t == 'CREATE_KEYSPACE' ? '' : vars.ks", permission: "= vars.permission"}
      - return: {}
  - component: alter-schema-statement
    name: validate
    kind: function
    summary: "AlterSchemaStatement.validate caches the ClientState for guardrails; statement validation happens later, in apply(). The guardrails it runs (keyspace and table counts, table properties, compact tables) are disabled in the deployed config."
    sources:
      - src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:53-59
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:117-124
      - src/java/org/apache/cassandra/cql3/statements/schema/CreateTableStatement.java:126-155
    request: SchemaAuthDdlRequest
    behavior:
      - return: {}
  - component: alter-schema-statement
    name: execute
    kind: function
    summary: "CQLStatement.execute for a DDL statement: execute(state, false). Entry point from QueryProcessor.processStatement."
    sources: [src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:61-65]
    request: SchemaAuthDdlRequest
    response: SchemaAuthSchemaChangeResult
    errors: [{code: invalid, status: 8704}, {code: already-exists, status: 9216}, {code: config-error, status: 8960}, {code: unauthorized, status: 8448}]
    behavior:
      - call: alter-schema-statement.execute-with-state
        input: "= merge(omit(input.statement, 'type'), {'statement': input.statement.type.startsWith('ALTER_TABLE_') ? 'alter-table-statement-' + input.statement.type.substring(12).lowerAscii().replace('_', '-') : (input.statement.type.startsWith('ALTER_TYPE_') ? 'alter-type-statement-' + input.statement.type.substring(11).lowerAscii().replace('_', '-') : input.statement.type.lowerAscii().replace('_', '-') + '-statement'), 'user': has(input.client_state) ? input.client_state.user : 'anonymous', 'locally': false})"
        fill: true
        as: r
      - return: "= vars.r.value"
  - component: alter-schema-statement
    name: execute-locally
    kind: function
    summary: "executeLocally: execute(state, true) - applied on this node only, without announce or push."
    sources: [src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:73-76]
    request: SchemaAuthDdlRequest
    response: SchemaAuthSchemaChangeResult
    behavior:
      - call: alter-schema-statement.execute-with-state
        input: "= merge(omit(input.statement, 'type'), {'statement': input.statement.type.startsWith('ALTER_TABLE_') ? 'alter-table-statement-' + input.statement.type.substring(12).lowerAscii().replace('_', '-') : (input.statement.type.startsWith('ALTER_TYPE_') ? 'alter-type-statement-' + input.statement.type.substring(11).lowerAscii().replace('_', '-') : input.statement.type.lowerAscii().replace('_', '-') + '-statement'), 'user': has(input.client_state) ? input.client_state.user : 'anonymous', 'locally': true})"
        fill: true
        as: r
      - return: "= vars.r.value"
  - component: alter-schema-statement
    name: execute-with-state
    kind: function
    summary: "AlterSchemaStatement.execute(QueryState, boolean locally): guard system keyspaces, run the transformation through Schema.transform, grant the creator permissions on new resources, and return SCHEMA_CHANGE (or Void for an empty diff)."
    description: >-
      QueryProcessor calls authorize(), then validate() (which only caches the ClientState and runs
      guardrails), then execute(); executeLocally() is execute(state, true). Validation of the
      statement itself happens inside apply(), called from Schema.transform. The statement returns
      as soon as the local node has applied the change: the push to peers is asynchronous and the
      coordinator does not wait for schema agreement.
    sources:
      - src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:107-137
    request: SchemaAuthSchemaStatement
    response: SchemaAuthSchemaChangeResult
    errors:
      - {code: invalid, status: 8704}
      - {code: already-exists, status: 9216}
      - {code: config-error, status: 8960}
      - {code: unauthorized, status: 8448}
    behavior:
      - title: Local system keyspaces are not user-modifiable
        detail: isLocalSystemKeyspace covers system, system_schema and the virtual keyspaces, so the virtual-keyspace check after it never fires for them.
        source: src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:109-110
        if: "input.keyspace.lowerAscii() in ['system', 'system_schema', 'system_views', 'system_virtual_schema']"
        then:
          - fail: {code: invalid, status: 8704, message: "= \"System keyspace '\" + input.keyspace + \"' is not user-modifiable\""}
      - title: Validate the keyspace name
        source: src/java/org/apache/cassandra/schema/KeyspaceMetadata.java:63-71
        if: "!input.keyspace.matches('^[A-Za-z0-9_]+$')"
        then:
          - fail: {code: invalid, status: 8704, message: "= 'Keyspace name must not be empty and must contain alphanumeric or underscore characters only (got \"' + input.keyspace + '\")'"}
      - if: "size(input.keyspace) > 48"
        then:
          - title: Name longer than SchemaConstants.NAME_LENGTH (48)
            source: src/java/org/apache/cassandra/schema/KeyspaceMetadata.java:68-70
            fail: {code: invalid, status: 8704, message: "= 'Keyspace name must not be more than 48 characters long (got ' + string(size(input.keyspace)) + ' characters for \"' + input.keyspace + '\")'"}
      - title: Schema.instance.transform(this, locally)
        source: src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:118
        call: schema.transform
        input: "= input"
        as: result
      - title: Client warnings of a non-empty diff
        source: src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:120
        foreach: "= vars.result.value.warnings"
        as: w
        steps:
          - call: client-warn.warn
            input: {text: "= vars.w"}
      - if: "vars.result.value.empty"
        then:
          - title: Empty diff returns Void
            detail: "IF NOT EXISTS / IF EXISTS no-ops and no-change alterations: nothing is written, announced or pushed."
            source: src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:122-123
            set: {ctx.ddl_result: VOID}
          - return: {kind: VOID}
      - if: "input.user != 'anonymous' && size(vars.result.value.created_resources) > 0"
        then:
          - title: Grant the creator all applicable permissions on created resources
            detail: Skipped for the anonymous user (always the case under AllowAllAuthenticator). UnsupportedOperationException from the authorizer is ignored.
            source: src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:132-134
            call: auth-config.get-backends
            as: backends
          - foreach: "= vars.result.value.created_resources"
            as: r
            steps:
              - call: "= vars.r.startsWith('functions') ? 'function-resource.applicable-permissions' : 'data-resource.applicable-permissions'"
                targets: [function-resource.applicable-permissions, data-resource.applicable-permissions]
                input: {resource: "= vars.r"}
                as: applicable
              - title: authorizer.grant(SYSTEM_USER, applicablePermissions, resource, primaryRole)
                source: src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:147-161
                call: "= vars.backends.value.authorizer_component + '.grant'"
                targets: [cassandra-authorizer.grant, allow-all-authorizer.grant]
                input: {performer: system, permissions: "= vars.applicable.value.permissions", resource: "= vars.r", grantee: "= input.user"}
                on_error: continue
      - set: {ctx.ddl_result: SCHEMA_CHANGE}
      - title: ResultMessage.SchemaChange(schemaChangeEvent(diff))
        source: src/java/org/apache/cassandra/cql3/statements/schema/AlterSchemaStatement.java:136
        return:
          kind: SCHEMA_CHANGE
          change: "= vars.result.value.event.change"
          target: "= vars.result.value.event.target"
          keyspace: "= vars.result.value.event.keyspace"
          name: "= vars.result.value.event.name"

  - component: schema
    name: transform
    kind: function
    summary: Schema.transform delegates to the configured SchemaUpdateHandler (DefaultSchemaUpdateHandler on a daemon).
    sources: [src/java/org/apache/cassandra/schema/Schema.java:606-614]
    request: SchemaAuthSchemaStatement
    behavior:
      - call: default-schema-update-handler.apply
        input: "= input"
        as: r
      - return: "= vars.r.value"

  - component: default-schema-update-handler
    name: apply
    kind: function
    summary: "DefaultSchemaUpdateHandler.apply (synchronized): run the statement's apply over the current keyspaces, convert the diff to mutations, apply them to system_schema, recompute the digest, merge into Schema, announce, and push to peers asynchronously."
    sources: [src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:227-253]
    request: SchemaAuthSchemaStatement
    behavior:
      - title: transformation.apply(before.getKeyspaces())
        detail: The statement validates itself here and throws its InvalidRequest, AlreadyExists or Configuration exception straight to the client.
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:230-232
        call: "= input.statement.startsWith('alter-table-statement-') ? 'alter-table-statement.apply' : (input.statement.startsWith('alter-type-statement-') ? 'alter-type-statement.apply' : input.statement + '.apply')"
        targets: [alter-table-statement.apply, alter-type-statement.apply, create-keyspace-statement.apply, alter-keyspace-statement.apply, drop-keyspace-statement.apply, create-table-statement.apply, drop-table-statement.apply, create-type-statement.apply, drop-type-statement.apply, create-index-statement.apply, drop-index-statement.apply, create-view-statement.apply, alter-view-statement.apply, drop-view-statement.apply, create-function-statement.apply, drop-function-statement.apply, create-aggregate-statement.apply, drop-aggregate-statement.apply, create-trigger-statement.apply, drop-trigger-statement.apply]
        input: "= input"
        as: t
      - if: "size(vars.t.value.mutations) == 0"
        then:
          - title: Empty diff
            source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:234-235
            return: {empty: true, warnings: [], created_resources: [], diff: [], version: ""}
      - title: SchemaKeyspace.convertSchemaDiffToMutations(diff, timestamp)
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:237
        call: schema-keyspace.convert-schema-diff-to-mutations
        input: {mutations: "= vars.t.value.mutations"}
        as: muts
      - title: SchemaKeyspace.applyChanges(mutations)
        detail: Mutation.apply on the local system_schema tables (write path, commit log); not the replicated write path.
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:238
        call: schema-keyspace.apply-changes
        input: {mutations: "= vars.muts.value.mutations"}
        as: applied
      - title: New content digest
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:240
        call: schema-keyspace.calculate-schema-digest
        input: {}
        as: digest
      - call: default-schema-update-handler.update-schema
        input: {version: "= vars.digest.value.version", diff: "= vars.applied.value.diff", locally: "= input.locally"}
      - if: "!input.locally"
        then:
          - title: Push the mutations to live peers on the MIGRATION stage
            detail: Asynchronous; the client gets its result without waiting.
            source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:244-250
            emit: migration-coordinator.push-schema-mutations
            input: {mutations: "= vars.muts.value.mutations"}
      - return:
          empty: false
          version: "= vars.digest.value.version"
          diff: "= vars.applied.value.diff"
          warnings: "= vars.t.value.warnings"
          event: "= vars.t.value.event"
          created_resources: "= vars.t.value.created_resources"

  - component: default-schema-update-handler
    name: update-schema
    kind: function
    summary: "updateSchema: when the diff is non-empty or the version moved, store the new schema, run the Schema.mergeAndUpdateVersion callback, and announce the version through gossip unless local."
    sources: [src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:255-271]
    request:
      type: object
      properties:
        version: {type: string}
        diff: {type: array, items: {$ref: SchemaAuthDiffEntry}}
        locally: {type: boolean, default: false}
    behavior:
      - call: schema.get-version
        as: cur
      - if: "size(input.diff) == 0 && input.version == vars.cur.value.version"
        then:
          - title: Schema update is empty - skipping
            source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:267-270
            return: {updated: false}
      - title: updateCallback.accept(update, true) - Schema.mergeAndUpdateVersion with dropData
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:259-261
        call: schema.merge-and-update-version
        input: {version: "= input.version", diff: "= input.diff", drop_data: true}
      - when: "!input.locally"
        title: migrationCoordinator.announce(version)
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:262-265
        call: migration-coordinator.announce
        input: {version: "= input.version"}
      - return: {updated: true}

  - component: schema
    name: merge-and-update-version
    kind: function
    summary: "mergeAndUpdateVersion: notify pre-changes, merge the diff into Keyspace/ColumnFamilyStore instances (drops, creates, alters), notify listeners, and set the new version (also saved in system.local)."
    sources:
      - src/java/org/apache/cassandra/schema/Schema.java:594-604
      - src/java/org/apache/cassandra/schema/Schema.java:644-649
    request:
      type: object
      properties:
        version: {type: string}
        diff: {type: array, items: {$ref: SchemaAuthDiffEntry}}
        drop_data: {type: boolean, default: true}
    behavior:
      - foreach: "= input.diff"
        as: d
        steps:
          - if: "vars.d.kind == 'keyspace' && vars.d.change == 'created'"
            then:
              - title: createKeyspace - Keyspace.open, then recalculate pending ranges (CASSANDRA-15433)
                source: src/java/org/apache/cassandra/schema/Schema.java:688-706
                call: keyspace.open
                input: {keyspace: "= vars.d.keyspace"}
              - call: pending-range-calculator-service.calculate-pending-ranges
                input: {keyspace: "= vars.d.keyspace"}
              - call: schema-change-notifier.notify-keyspace-created
                input: {keyspace: "= vars.d.keyspace"}
          - if: "vars.d.kind in ['table', 'view'] && vars.d.change == 'created'"
            then:
              - title: createTable / createView - keyspace.initCf
                source: src/java/org/apache/cassandra/schema/Schema.java:753-765
                call: keyspace.init-cf
                input: {keyspace: "= vars.d.keyspace", table: "= vars.d.name"}
          - if: "vars.d.kind in ['table', 'view'] && vars.d.change == 'dropped'"
            then:
              - title: dropTable / dropView - keyspace.dropCf(id, dropData)
                source: src/java/org/apache/cassandra/schema/Schema.java:740-751
                call: keyspace.drop-cf
                input: {keyspace: "= vars.d.keyspace", table: "= vars.d.name", drop_data: "= input.drop_data"}
          - if: "(vars.d.kind in ['table', 'view'] && vars.d.change == 'altered') || vars.d.kind in ['index', 'trigger']"
            then:
              - title: alterTable / alterView - ColumnFamilyStore.reload
                detail: Indexes and triggers are part of the table metadata, so their changes reload the base table.
                source: src/java/org/apache/cassandra/schema/Schema.java:767-779
                call: column-family-store.reload
                input: {keyspace: "= vars.d.keyspace", table: "= vars.d.table"}
          - if: "vars.d.kind == 'keyspace' && vars.d.change == 'dropped'"
            then:
              - title: dropKeyspace - unload the keyspace instance, then notify
                source: src/java/org/apache/cassandra/schema/Schema.java:708-738
                call: keyspace.unload
                input: {keyspace: "= vars.d.keyspace", drop_data: "= input.drop_data"}
              - call: schema-change-notifier.notify-keyspace-dropped
                input: {keyspace: "= vars.d.keyspace", diff: "= input.diff.filter(x, x.keyspace == vars.d.keyspace)"}
      - set:
          vars.altered: "= input.diff.filter(x, !(x.kind == 'keyspace' && x.change != 'altered') && !(x.change == 'dropped' && input.diff.exists(k, k.kind == 'keyspace' && k.change == 'dropped' && k.keyspace == x.keyspace)) && !(x.change == 'created' && input.diff.exists(k, k.kind == 'keyspace' && k.change == 'created' && k.keyspace == x.keyspace)))"
      - when: "size(vars.altered) > 0"
        title: alterKeyspace - notify listeners of the altered keyspace
        source: src/java/org/apache/cassandra/schema/Schema.java:651-686
        call: schema-change-notifier.notify-keyspace-altered
        input: {diff: "= vars.altered"}
      - title: updateVersion and SystemKeyspace.updateSchemaVersion
        source: src/java/org/apache/cassandra/schema/Schema.java:601-603
        set: {state.version: "= input.version", ctx.local_schema_version: "= input.version"}
      - return: {version: "= input.version"}

  - component: schema
    name: get-version
    kind: function
    summary: Schema.getVersion - the (possibly stale) local schema version.
    sources: [src/java/org/apache/cassandra/schema/Schema.java:497-500]
    latency_ms: 0
    response: {type: object, properties: {version: {type: string}}}
    behavior:
      - return: {version: "= has(state.version) ? state.version : 'v:'"}

  - component: schema
    name: get-keyspace-metadata
    kind: function
    summary: Schema.getKeyspaceMetadata - the local keyspace definition, exists false when unknown.
    sources: [src/java/org/apache/cassandra/schema/Schema.java:318-322]
    request: {type: object, required: [keyspace], properties: {keyspace: {type: string, default: shop}}}
    response: {type: object, properties: {exists: {type: boolean}, name: {type: string}, replication: {type: object}}}
    behavior:
      - call: schema-keyspace.rows-get
        input: {key: "= 'keyspace:' + input.keyspace"}
        as: ks
      - return: {exists: "= !has(vars.ks.value.missing)", name: "= input.keyspace", replication: "= has(vars.ks.value.missing) ? {} : vars.ks.value.def"}

  - component: schema
    name: reset-local-schema
    kind: function
    summary: "Schema.resetLocalSchema (nodetool resetlocalschema via StorageService): drop the local schema and re-fetch it from live peers, failing when none answer within SCHEMA_DELAY_MILLIS."
    sources: [src/java/org/apache/cassandra/schema/Schema.java:620-642]
    errors:
      - {code: invalid, status: 8704}
      - {code: server-error, status: 0}
    behavior:
      - call: gossiper.get-live-members
        as: live
      - if: "vars.live.value.members.all(e, e == self)"
        then:
          - title: No other live nodes
            source: src/java/org/apache/cassandra/schema/Schema.java:624-625
            fail: {code: invalid, status: 8704, message: Cannot reset local schema when there are no other live nodes}
      - title: updateHandler.clear() and wait up to SCHEMA_DELAY_MILLIS (30000 ms)
        detail: SCHEMA_DELAY_MILLIS is 30s unless -Dcassandra.schema_delay_ms is set (StorageService.java:325-338).
        source: src/java/org/apache/cassandra/schema/Schema.java:627-632
        call: default-schema-update-handler.clear
        as: cleared
      - if: "!vars.cleared.value.completed"
        then:
          - title: No schema received from other nodes
            source: src/java/org/apache/cassandra/schema/Schema.java:630-633
            fail: {code: server-error, status: 0, message: Schema reset failed - no schema received from other nodes}
      - set: {ctx.local_schema_reset: completed}
      - return: {reset: true}

  - component: schema
    name: reload-schema-and-announce-version
    kind: function
    summary: "Schema.reloadSchemaAndAnnounceVersion (nodetool reloadlocalschema): re-read system_schema from disk, merge the difference, and announce the version."
    sources:
      - src/java/org/apache/cassandra/schema/Schema.java:583-586
      - src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:273-298
    behavior:
      - call: schema-keyspace.calculate-schema-digest
        input: {}
        as: digest
      - title: reset(true) -> reload() -> updateSchema(update, false)
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:273-281
        call: default-schema-update-handler.update-schema
        input: {version: "= vars.digest.value.version", diff: [], locally: false}
        as: u
      - return: {version: "= vars.digest.value.version", updated: "= vars.u.value.updated"}

  - component: schema-change-notifier
    name: notify-keyspace-created
    kind: function
    summary: "Listeners hear onCreateKeyspace then each created type, table, view, function and aggregate (the native transport pushes a SCHEMA_CHANGE event to registered clients)."
    sources: [src/java/org/apache/cassandra/schema/SchemaChangeNotifier.java:49-57]
    request: {type: object, properties: {keyspace: {type: string}}}
    behavior:
      - set: {ctx.notified_created: "= input.keyspace"}
  - component: schema-change-notifier
    name: notify-keyspace-altered
    kind: function
    summary: "Listeners hear drops first, then creates, then alterations of the keyspace's elements; AuthSchemaChangeListener revokes permissions on dropped tables, functions and aggregates."
    sources: [src/java/org/apache/cassandra/schema/SchemaChangeNotifier.java:59-83]
    request: {type: object, properties: {diff: {type: array, items: {$ref: SchemaAuthDiffEntry}}}}
    behavior:
      - foreach: "= input.diff"
        as: d
        steps:
          - when: "vars.d.change == 'dropped' && vars.d.kind == 'table'"
            title: notifyDropTable -> AuthSchemaChangeListener.onDropTable
            source: src/java/org/apache/cassandra/schema/SchemaChangeNotifier.java:65
            call: auth-schema-change-listener.on-drop-table
            input: {keyspace: "= vars.d.keyspace", table: "= vars.d.name"}
          - when: "vars.d.change == 'dropped' && vars.d.kind in ['function', 'aggregate']"
            title: notifyDropFunction / notifyDropAggregate
            source: src/java/org/apache/cassandra/schema/SchemaChangeNotifier.java:62-63
            call: auth-schema-change-listener.on-drop-function
            input: {keyspace: "= vars.d.keyspace", name: "= vars.d.name"}
      - set: {ctx.notified_altered: "= size(input.diff)"}
  - component: schema-change-notifier
    name: notify-keyspace-dropped
    kind: function
    summary: Listeners hear the drop of every aggregate, function, view, table and type, then onDropKeyspace.
    sources: [src/java/org/apache/cassandra/schema/SchemaChangeNotifier.java:85-93]
    request: {type: object, properties: {keyspace: {type: string}, diff: {type: array, items: {$ref: SchemaAuthDiffEntry}}}}
    behavior:
      - foreach: "= input.diff.filter(x, x.kind == 'table')"
        as: d
        steps:
          - call: auth-schema-change-listener.on-drop-table
            input: {keyspace: "= vars.d.keyspace", table: "= vars.d.name"}
      - title: notifyDropKeyspace -> AuthSchemaChangeListener.onDropKeyspace
        source: src/java/org/apache/cassandra/schema/SchemaChangeNotifier.java:92
        call: auth-schema-change-listener.on-drop-keyspace
        input: {keyspace: "= input.keyspace"}
      - set: {ctx.notified_dropped: "= input.keyspace"}

  # ===================================================== system_schema store
  - component: schema-keyspace
    name: convert-schema-diff-to-mutations
    kind: function
    summary: "Turns the Keyspaces diff into one mutation per keyspace partition, stamped with the statement's timestamp (micros)."
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:296-333]
    request: {type: object, properties: {mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}}}
    behavior:
      - return: {mutations: "= input.mutations"}
  - component: schema-keyspace
    name: apply-changes
    kind: function
    summary: "SchemaKeyspace.applyChanges: apply each schema mutation to this replica's system_schema rows. Returns the resulting diff (created, altered, dropped), as fetchKeyspaces + Keyspaces.diff would compute it."
    sources:
      - src/java/org/apache/cassandra/schema/SchemaKeyspace.java:1424-1429
      - src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:200-225
    request:
      type: object
      properties:
        mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}
    behavior:
      - set: {vars.diff: []}
      - foreach: "= input.mutations"
        as: m
        steps:
          - set: {vars.key: "= vars.m.kind + ':' + (vars.m.kind == 'keyspace' ? vars.m.keyspace : vars.m.keyspace + '.' + vars.m.name)"}
          - call: schema-keyspace.rows-get
            input: {key: "= vars.key"}
            as: existing
          - if: "vars.m.op == 'put'"
            then:
              - set: {vars.change: "= has(vars.existing.value.missing) ? 'created' : (vars.existing.value.sig != vars.m.sig ? 'altered' : 'unchanged')"}
              - call: schema-keyspace.rows-put
                input:
                  key: "= vars.key"
                  row: {kind: "= vars.m.kind", keyspace: "= vars.m.keyspace", name: "= vars.m.name", def: "= vars.m.def", sig: "= vars.m.sig"}
            else:
              - set: {vars.change: "= has(vars.existing.value.missing) ? 'unchanged' : 'dropped'"}
              - call: schema-keyspace.rows-delete
                input: {key: "= vars.key"}
          - when: "vars.change != 'unchanged'"
            set:
              vars.diff: "= vars.diff + [{'kind': vars.m.kind, 'keyspace': vars.m.keyspace, 'name': vars.m.name, 'change': vars.change, 'table': has(vars.m.def.table) ? vars.m.def.table : vars.m.name}]"
      - return: {diff: "= vars.diff"}
  - component: schema-keyspace
    name: calculate-schema-digest
    kind: function
    summary: "calculateSchemaDigest: digest every non-system schema row; the result is the content-based schema version, so two replicas with the same rows report the same version."
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:374-394]
    request: {type: object, properties: {}}
    response: {type: object, properties: {version: {type: string}}}
    behavior:
      - call: schema-keyspace.rows-query
        input: {keyspace: "", kind: ""}
        as: rows
      - return: {version: "= 'v:' + vars.rows.value.map(r, r.sig).join(';')"}
  - component: schema-keyspace
    name: convert-schema-to-mutations
    kind: function
    summary: convertSchemaToMutations - the whole schema of this replica as mutations (the answer to a schema pull).
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:415-423]
    request: {type: object, properties: {}}
    response: {type: object, properties: {mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}}}
    behavior:
      - call: schema-keyspace.rows-query
        input: {keyspace: "", kind: ""}
        as: rows
      - return: {mutations: "= vars.rows.value.map(r, {'op': 'put', 'kind': r.kind, 'keyspace': r.keyspace, 'name': r.name, 'def': r.def, 'sig': r.sig})"}
  - component: schema-keyspace
    name: truncate
    kind: function
    summary: SchemaKeyspace.truncate - truncate every schema table (used by a requested schema reset).
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:358-362]
    request: {type: object, properties: {}}
    behavior:
      - call: schema-keyspace.rows-query
        input: {keyspace: "", kind: ""}
        as: rows
      - foreach: "= vars.rows.value"
        as: r
        steps:
          - call: schema-keyspace.rows-delete
            input: {key: "= vars.r.kind + ':' + (vars.r.kind == 'keyspace' ? vars.r.keyspace : vars.r.keyspace + '.' + vars.r.name)"}
  - component: schema-keyspace
    name: rows-get
    kind: store
    summary: Read one system_schema row of one replica.
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:1431-1442]
    request: {type: object, required: [key], properties: {key: {type: string, default: "keyspace:shop"}}}
    store: {table: rows, op: get, key: "= input.key", default: {missing: true}}
  - component: schema-keyspace
    name: rows-put
    kind: store
    summary: Write one system_schema row of one replica (Mutation.apply on the schema tables).
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:1424-1427]
    request: {type: object, required: [key, row], properties: {key: {type: string}, row: {type: object}}}
    store: {table: rows, op: put, key: "= input.key", value: "= input.row"}
  - component: schema-keyspace
    name: rows-delete
    kind: store
    summary: Delete one system_schema row of one replica (a partition or row tombstone).
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:1424-1427]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    store: {table: rows, op: delete, key: "= input.key"}
  - component: schema-keyspace
    name: rows-query
    kind: store
    summary: Scan one replica's system_schema rows, optionally for one keyspace or kind, in key order.
    sources: [src/java/org/apache/cassandra/schema/SchemaKeyspace.java:374-394]
    request: {type: object, properties: {keyspace: {type: string, default: ""}, kind: {type: string, default: ""}}}
    store: {table: rows, op: query, where: "(input.keyspace == '' || row.keyspace == input.keyspace) && (input.kind == '' || row.kind == input.kind)"}

  # ============================================== update handler (received)
  - component: default-schema-update-handler
    name: apply-mutations
    kind: function
    summary: "applyMutations (synchronized): apply received schema mutations to system_schema, recompute the digest, and merge the diff of the affected keyspaces. A push is ignored while a schema reset is pending."
    sources:
      - src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:93-99
      - src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:200-225
    request:
      type: object
      properties:
        mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}
        via: {type: string, enum: [push, pull], default: push}
    behavior:
      - if: "input.via == 'push' && state.requested_reset"
        then:
          - title: Push ignored while requestedReset is set
            source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:94-98
            set: {ctx.push_ignored: true}
          - return: {ignored: true, version: "", diff: []}
      - call: schema-keyspace.apply-changes
        input: {mutations: "= input.mutations"}
        as: ch
      - call: schema-keyspace.calculate-schema-digest
        input: {}
        as: digest
      - title: updateSchema(update, false) - merge on this node and announce its new version
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:222-224
        call: default-schema-update-handler.update-schema
        input: {version: "= vars.digest.value.version", diff: "= vars.ch.value.diff", locally: false}
      - return: {ignored: false, version: "= vars.digest.value.version", diff: "= vars.ch.value.diff"}

  - component: default-schema-update-handler
    name: apply-mutations-from-coordinator
    kind: function
    summary: "Callback for pulled schema: if a reset was requested and the peer sent anything, truncate the local schema first and complete the reset, then apply the mutations."
    sources: [src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:333-343]
    request:
      type: object
      properties:
        from: {type: string, default: n2}
        mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}
    behavior:
      - if: "state.requested_reset && size(input.mutations) > 0"
        then:
          - title: Reset requested - truncate the schema tables and complete the reset
            source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:335-341
            call: schema-keyspace.truncate
            input: {}
          - set: {state.requested_reset: false, ctx.reset_truncated: true}
      - call: default-schema-update-handler.apply-mutations
        input: {mutations: "= input.mutations", via: pull}
        as: r
      - return: "= vars.r.value"

  - component: default-schema-update-handler
    name: get-schema-mutations
    kind: function
    summary: "The registered SCHEMA_PULL_REQ handler's payload: the full schema as mutations, or nothing while a reset is pending."
    sources:
      - src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:100-109
      - src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:345-351
    request: {type: object, properties: {}}
    response: {type: object, properties: {mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}}}
    behavior:
      - if: "state.requested_reset"
        then:
          - return: {mutations: []}
      - call: schema-keyspace.convert-schema-to-mutations
        input: {}
        as: m
      - return: {mutations: "= vars.m.value.mutations"}

  - component: default-schema-update-handler
    name: get-schema-version-for-coordinator
    kind: function
    summary: The version MigrationCoordinator compares against - the empty version while a reset is pending.
    sources: [src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:325-331]
    latency_ms: 0
    response: {type: object, properties: {version: {type: string}}}
    behavior:
      - if: "state.requested_reset"
        then:
          - return: {version: "v:"}
      - call: schema.get-version
        as: v
      - return: {version: "= vars.v.value.version"}

  - component: default-schema-update-handler
    name: clear
    kind: function
    summary: "clear(): flag a requested reset and reset the migration coordinator so that it re-reports every live endpoint's version and pulls; the reset completes when the first non-empty pulled schema is applied."
    sources: [src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:311-323]
    response: {type: object, properties: {completed: {type: boolean}}}
    behavior:
      - if: "!state.requested_reset"
        then:
          - set: {state.requested_reset: true}
          - call: migration-coordinator.reset
      - return: {completed: "= !state.requested_reset"}

  # ================================================== migration coordinator
  - component: migration-coordinator
    name: announce
    kind: function
    summary: "Publish the schema version in the SCHEMA gossip application state; peers that see a different version pull."
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:574-579]
    request: {type: object, properties: {version: {type: string}}}
    behavior:
      - call: gossiper.add-local-application-state
        input: {state: SCHEMA, value: "= input.version"}
      - set: {ctx.announced_version: "= input.version"}

  - component: migration-coordinator
    name: push-schema-mutations
    kind: function
    summary: "Send SCHEMA_PUSH_REQ with the mutations to every live member except this node whose messaging version is known and current. Fire-and-forget: there is no callback, so a lost push is only repaired by a later pull."
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:747-776]
    request: {type: object, properties: {mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}}}
    behavior:
      - set: {ctx.schema_pushed_to: [], ctx.schema_push_ignored: []}
      - call: gossiper.get-live-members
        as: live
      - foreach: "= vars.live.value.members"
        as: ep
        steps:
          - if: "vars.ep == self || !(vars.ep in state.peers) || state.peers[vars.ep].messaging_version != state.current_messaging_version"
            then:
              - title: shouldPushSchemaTo - skip self and peers with unknown or different messaging versions
                source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:770-776
                set: {ctx.schema_push_ignored: "= ctx.schema_push_ignored + [vars.ep]"}
              - continue: true
          - title: messagingService.send(SCHEMA_PUSH_REQ, endpoint) - no callback, delivered asynchronously
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:755-759
            emit: schema-push-verb-handler.do-verb
            on: "= vars.ep"
            input: {from: "= self", mutations: "= input.mutations"}
          - set: {ctx.schema_pushed_to: "= ctx.schema_pushed_to + [vars.ep]"}
      - return: {destinations: "= ctx.schema_pushed_to", ignored: "= ctx.schema_push_ignored"}

  - component: migration-coordinator
    name: report-endpoint-version
    kind: function
    summary: "reportEndpointVersion (gossip SCHEMA change of a live ring member): record the endpoint's version, mark it received when it equals ours, otherwise queue the endpoint and try to pull."
    sources:
      - src/java/org/apache/cassandra/schema/MigrationCoordinator.java:428-463
      - src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:157-168
    request:
      type: object
      required: [endpoint, version]
      properties:
        endpoint: {type: string, default: n2}
        version: {type: string, default: "v:peer-newer"}
    response: {type: object, properties: {pulled: {type: boolean}, reason: {type: string}}}
    behavior:
      - call: migration-coordinator.endpoint-versions-get
        input: {endpoint: "= input.endpoint"}
        as: cur
      - if: "!has(vars.cur.value.missing) && vars.cur.value.version == input.version"
        then:
          - title: Already known
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:439-444
            return: {pulled: false, reason: already-known}
      - call: migration-coordinator.endpoint-versions-put
        input: {endpoint: "= input.endpoint", version: "= input.version"}
      - call: default-schema-update-handler.get-schema-version-for-coordinator
        as: local
      - if: "vars.local.value.version == input.version"
        then:
          - title: Same as the local schema - mark received
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:446-451
            call: migration-coordinator.version-info-put
            input: {version: "= input.version", row: {version: "= input.version", received: true, endpoint: "= input.endpoint"}}
          - return: {pulled: false, reason: same-as-local}
      - title: requestQueue.addFirst(endpoint)
        source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:452-456
        call: migration-coordinator.version-info-put
        input: {version: "= input.version", row: {version: "= input.version", received: false, endpoint: "= input.endpoint"}}
      - call: migration-coordinator.maybe-pull-schema
        input: {endpoint: "= input.endpoint", version: "= input.version"}
        as: p
      - return: "= vars.p.value"

  - component: migration-coordinator
    name: maybe-pull-schema
    kind: function
    summary: "maybePullSchema: pull an unreceived version from a queued endpoint that we may pull from (at most 3 outstanding requests per version)."
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:282-319]
    request: {type: object, properties: {endpoint: {type: string, default: n2}, version: {type: string, default: "v:peer-newer"}}}
    response: {type: object, properties: {pulled: {type: boolean}, reason: {type: string}}}
    behavior:
      - call: migration-coordinator.version-info-get
        input: {version: "= input.version"}
        as: info
      - call: default-schema-update-handler.get-schema-version-for-coordinator
        as: local
      - if: "has(vars.info.value.missing) || vars.info.value.received || vars.local.value.version == input.version"
        then:
          - title: Nothing to pull
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:284-288
            return: {pulled: false, reason: received-or-same}
      - call: migration-coordinator.should-pull-from-endpoint
        input: {endpoint: "= input.endpoint"}
        as: ok
      - if: "!vars.ok.value.pull"
        then:
          - title: Endpoint not suitable - back to the queue; the periodic task retries
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:309-318
            return: {pulled: false, reason: "= vars.ok.value.reason"}
      - call: migration-coordinator.schedule-schema-pull
        input: {endpoint: "= input.endpoint", version: "= input.version"}
        as: s
      - return: "= vars.s.value"

  - component: migration-coordinator
    name: should-pull-from-endpoint
    kind: function
    summary: "shouldPullFromEndpoint: not ourselves, gossip state known, same release major, same messaging version, not a gossip-only member."
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:354-400]
    request: {type: object, properties: {endpoint: {type: string, default: n2}}}
    response: {type: object, properties: {pull: {type: boolean}, reason: {type: string}}}
    behavior:
      - if: "input.endpoint == self"
        then: [{return: {pull: false, reason: local-endpoint}}]
      - if: "!(input.endpoint in state.peers)"
        then: [{return: {pull: false, reason: unknown-endpoint-state}}]
      - if: "!state.peers[input.endpoint].release_version.startsWith(state.release_major)"
        then:
          - title: Different release major in gossip
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:369-380
            return: {pull: false, reason: different-major-version}
      - if: "state.peers[input.endpoint].messaging_version != state.current_messaging_version"
        then:
          - title: Incompatible schema format (messaging version)
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:382-392
            return: {pull: false, reason: incompatible-messaging-version}
      - if: "state.peers[input.endpoint].gossip_only"
        then:
          - source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:394-398
            title: Gossip-only member
            return: {pull: false, reason: gossip-only-member}
      - return: {pull: true, reason: ok}

  - component: migration-coordinator
    name: schedule-schema-pull
    kind: function
    summary: "scheduleSchemaPull: pull immediately when our schema is empty or we started less than MIGRATION_DELAY (60 s) ago (after a 1 s backoff when the last pull from that endpoint failed); otherwise schedule the pull MIGRATION_DELAY later on nonPeriodicTasks."
    description: The immediate case is submitted to the MIGRATION executor and starts at once, so it runs inline. The delayed cases are timers.
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:548-572]
    request: {type: object, properties: {endpoint: {type: string}, version: {type: string}}}
    response: {type: object, properties: {pulled: {type: boolean}, reason: {type: string}}}
    behavior:
      - call: default-schema-update-handler.get-schema-version-for-coordinator
        as: local
      - title: shouldPullImmediately
        source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:402-416
        set: {vars.immediate: "= vars.local.value.version == 'v:' || state.uptime_ms < config['migration-delay-ms']"}
      - call: migration-coordinator.last-pull-failures-get
        input: {endpoint: "= input.endpoint"}
        as: lf
      - if: "vars.immediate && !has(vars.lf.value.missing)"
        then:
          - title: Previous pull from this endpoint failed - retry after PULL_BACKOFF_INTERVAL_MS (1000)
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:554-558
            emit: migration-coordinator.pull-schema
            after_ms: 1000
            input: {endpoint: "= input.endpoint", version: "= input.version"}
          - return: {pulled: false, reason: backoff}
      - if: "!vars.immediate"
        then:
          - title: Postpone by MIGRATION_DELAY_IN_MS
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:565-569
            set: {ctx.pull_postponed_ms: "= config['migration-delay-ms']"}
          - emit: migration-coordinator.pull-schema
            after_ms: "= config['migration-delay-ms']"
            input: {endpoint: "= input.endpoint", version: "= input.version"}
          - return: {pulled: false, reason: postponed}
      - call: migration-coordinator.pull-schema
        input: {endpoint: "= input.endpoint", version: "= input.version"}
        as: r
      - return: "= vars.r.value"

  - component: migration-coordinator
    name: pull-schema
    kind: function
    summary: "pullSchema: if the endpoint is alive and still suitable, send SCHEMA_PULL_REQ with a callback that expires after request_timeout."
    sources:
      - src/java/org/apache/cassandra/schema/MigrationCoordinator.java:659-687
    request: {type: object, properties: {endpoint: {type: string, default: n2}, version: {type: string}}}
    response: {type: object, properties: {pulled: {type: boolean}, reason: {type: string}}}
    behavior:
      - call: gossiper.is-alive
        input: {endpoint: "= input.endpoint"}
        as: alive
      - if: "!vars.alive.value.alive"
        then:
          - title: "Can't send schema pull request: node is down"
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:661-666
            call: migration-coordinator-callback.on-failure
            input: {endpoint: "= input.endpoint", version: "= input.version"}
          - return: {pulled: false, reason: endpoint-down}
      - call: migration-coordinator.should-pull-from-endpoint
        input: {endpoint: "= input.endpoint"}
        as: ok
      - if: "!vars.ok.value.pull"
        then:
          - title: Endpoint changed (e.g. restarted on a higher major) - fail the pull
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:671-676
            call: migration-coordinator-callback.on-failure
            input: {endpoint: "= input.endpoint", version: "= input.version"}
          - return: {pulled: false, reason: "= vars.ok.value.reason"}
      - title: sendWithCallback(SCHEMA_PULL_REQ) - the callback expires after request_timeout
        source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:682-687
        call: schema-pull-verb-handler.do-verb
        on: "= input.endpoint"
        input: {from: "= self"}
        timeout_ms: "= config['request-timeout-ms']"
        as: resp
        on_error: continue
      - if: "!vars.resp.ok"
        then:
          - title: Callback onFailure (expired or failed)
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:618-626
            call: migration-coordinator-callback.on-failure
            input: {endpoint: "= input.endpoint", version: "= input.version"}
          - return: {pulled: false, reason: "= 'pull-failed: ' + vars.resp.error.code"}
      - call: migration-coordinator-callback.on-response
        input: {endpoint: "= input.endpoint", version: "= input.version", mutations: "= vars.resp.value.mutations"}
        as: cb
      - return: {pulled: "= vars.cb.value.applied", reason: "= vars.cb.value.reason"}

  - component: migration-coordinator-callback
    name: on-response
    kind: function
    summary: "Callback.response: merge the pulled mutations if the version is still unreceived and differs from ours; a merge exception counts as a failed pull."
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:628-651]
    request:
      type: object
      properties:
        endpoint: {type: string}
        version: {type: string}
        mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}
    response: {type: object, properties: {applied: {type: boolean}, reason: {type: string}}}
    behavior:
      - call: migration-coordinator.version-info-get
        input: {version: "= input.version"}
        as: info
      - call: default-schema-update-handler.get-schema-version-for-coordinator
        as: local
      - if: "(has(vars.info.value.missing) || !vars.info.value.received) && vars.local.value.version != input.version"
        then:
          - title: shouldApplySchemaFor - schemaUpdateCallback.accept(endpoint, mutations)
            source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:637-647
            call: default-schema-update-handler.apply-mutations-from-coordinator
            input: {from: "= input.endpoint", mutations: "= input.mutations"}
            as: merged
            on_error:
              - title: Unable to merge schema - fail()
                source: src/java/org/apache/cassandra/schema/MigrationCoordinator.java:643-646
                call: migration-coordinator.pull-complete
                input: {endpoint: "= input.endpoint", version: "= input.version", successful: false}
              - return: {applied: false, reason: merge-failed}
          - call: migration-coordinator.pull-complete
            input: {endpoint: "= input.endpoint", version: "= input.version", successful: true}
          - set: {ctx.schema_pulled_from: "= input.endpoint"}
          - return: {applied: true, reason: merged}
      - call: migration-coordinator.pull-complete
        input: {endpoint: "= input.endpoint", version: "= input.version", successful: true}
      - return: {applied: false, reason: already-received}

  - component: migration-coordinator-callback
    name: on-failure
    kind: function
    summary: Callback.onFailure - pullComplete(endpoint, info, false).
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:618-626]
    request: {type: object, properties: {endpoint: {type: string}, version: {type: string}}}
    behavior:
      - call: migration-coordinator.pull-complete
        input: {endpoint: "= input.endpoint", version: "= input.version", successful: false}
      - set: {ctx.schema_pull_failed: "= input.endpoint"}

  - component: migration-coordinator
    name: pull-complete
    kind: function
    summary: "pullComplete: mark the version received and clear the endpoint's failure on success; remember the failure otherwise. The endpoint goes back to the request queue."
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:689-704]
    request: {type: object, properties: {endpoint: {type: string}, version: {type: string}, successful: {type: boolean}}}
    behavior:
      - if: "input.successful"
        then:
          - call: migration-coordinator.version-info-put
            input: {version: "= input.version", row: {version: "= input.version", received: true, endpoint: "= input.endpoint"}}
          - call: migration-coordinator.last-pull-failures-delete
            input: {endpoint: "= input.endpoint"}
        else:
          - call: migration-coordinator.last-pull-failures-put
            input: {endpoint: "= input.endpoint"}

  - component: migration-coordinator
    name: pull-unreceived-schema-versions
    kind: function
    summary: "Periodic task (every cassandra.schema_pull_interval_ms, 60 s): retry pulling every version not yet received that has no outstanding request."
    sources:
      - src/java/org/apache/cassandra/schema/MigrationCoordinator.java:257-280
    behavior:
      - call: migration-coordinator.version-info-query
        as: pending
      - set: {ctx.periodic_pull_candidates: "= size(vars.pending.value)"}
      - foreach: "= vars.pending.value"
        as: info
        steps:
          - call: migration-coordinator.maybe-pull-schema
            input: {endpoint: "= vars.info.endpoint", version: "= vars.info.version"}

  - component: migration-coordinator
    name: reset
    kind: function
    summary: "reset(): forget every endpoint version and version info, then re-report the version of every live member (ours, or the one in its gossip state)."
    sources:
      - src/java/org/apache/cassandra/schema/MigrationCoordinator.java:521-531
      - src/java/org/apache/cassandra/schema/MigrationCoordinator.java:496-514
    behavior:
      - set: {state.endpoint_versions: {}, state.version_info: {}}
      - call: gossiper.get-live-members
        as: live
      - foreach: "= vars.live.value.members"
        as: ep
        steps:
          - if: "vars.ep == self"
            then:
              - call: default-schema-update-handler.get-schema-version-for-coordinator
                as: lv
              - call: migration-coordinator.report-endpoint-version
                input: {endpoint: "= vars.ep", version: "= vars.lv.value.version"}
            else:
              - when: "vars.ep in state.peers"
                call: migration-coordinator.report-endpoint-version
                input: {endpoint: "= vars.ep", version: "= state.peers[vars.ep].schema_version"}

  - component: migration-coordinator
    name: endpoint-versions-get
    kind: store
    summary: endpointVersions.get(endpoint)
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:221]
    request: {type: object, properties: {endpoint: {type: string}}}
    store: {table: endpoint_versions, op: get, key: "= input.endpoint", default: {missing: true}}
  - component: migration-coordinator
    name: endpoint-versions-put
    kind: store
    summary: endpointVersions.put(endpoint, version)
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:439]
    request: {type: object, properties: {endpoint: {type: string}, version: {type: string}}}
    store: {table: endpoint_versions, op: put, key: "= input.endpoint", value: "= {'endpoint': input.endpoint, 'version': input.version}"}
  - component: migration-coordinator
    name: version-info-get
    kind: store
    summary: versionInfo.get(version)
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:220]
    request: {type: object, properties: {version: {type: string}}}
    store: {table: version_info, op: get, key: "= input.version", default: {missing: true}}
  - component: migration-coordinator
    name: version-info-put
    kind: store
    summary: Create or update a VersionInfo (received flag, queued endpoint).
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:156-218]
    request: {type: object, properties: {version: {type: string}, row: {type: object}}}
    store: {table: version_info, op: put, key: "= input.version", value: "= input.row"}
  - component: migration-coordinator
    name: version-info-query
    kind: store
    summary: Versions not received yet.
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:270-279]
    store: {table: version_info, op: query, where: "!row.received"}
  - component: migration-coordinator
    name: last-pull-failures-get
    kind: store
    summary: lastPullFailures.contains(endpoint)
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:230]
    request: {type: object, properties: {endpoint: {type: string}}}
    store: {table: last_pull_failures, op: get, key: "= input.endpoint", default: {missing: true}}
  - component: migration-coordinator
    name: last-pull-failures-put
    kind: store
    summary: lastPullFailures.add(endpoint)
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:698]
    request: {type: object, properties: {endpoint: {type: string}}}
    store: {table: last_pull_failures, op: put, key: "= input.endpoint", value: "= {'endpoint': input.endpoint}"}
  - component: migration-coordinator
    name: last-pull-failures-delete
    kind: store
    summary: lastPullFailures.remove(endpoint)
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:694]
    request: {type: object, properties: {endpoint: {type: string}}}
    store: {table: last_pull_failures, op: delete, key: "= input.endpoint"}

  # ========================================================= verb handlers
  - component: schema-push-verb-handler
    name: do-verb
    kind: verb
    summary: "SCHEMA_PUSH_REQ on the receiving node: run every registered handler (DefaultSchemaUpdateHandler.applyMutations unless a reset is pending)."
    sources:
      - src/java/org/apache/cassandra/schema/SchemaPushVerbHandler.java:51-61
      - src/java/org/apache/cassandra/net/Verb.java:156
    attributes: {verb: SCHEMA_PUSH_REQ}
    request: SchemaAuthSchemaVerbRequest
    errors: [{code: unsupported-operation, status: 0}]
    behavior:
      - call: default-schema-update-handler.apply-mutations
        input: {mutations: "= input.mutations", via: push}
        as: r
      - return: "= vars.r.value"
  - component: schema-pull-verb-handler
    name: do-verb
    kind: verb
    summary: "SCHEMA_PULL_REQ on the receiving node: reply SCHEMA_PULL_RSP with the node's full schema as mutations."
    sources:
      - src/java/org/apache/cassandra/schema/SchemaPullVerbHandler.java:48-56
      - src/java/org/apache/cassandra/net/Verb.java:157-158
    attributes: {verb: SCHEMA_PULL_REQ}
    request: SchemaAuthSchemaVerbRequest
    response: {type: object, properties: {mutations: {type: array, items: {$ref: SchemaAuthSchemaMutation}}}}
    behavior:
      - call: default-schema-update-handler.get-schema-mutations
        input: {}
        as: m
      - return: {mutations: "= vars.m.value.mutations"}
  - component: schema-version-verb-handler
    name: do-verb
    kind: verb
    summary: "SCHEMA_VERSION_REQ (StorageProxy.describeSchemaVersions): reply SCHEMA_VERSION_RSP with Schema.instance.getVersion()."
    sources:
      - src/java/org/apache/cassandra/schema/SchemaVersionVerbHandler.java:36-41
      - src/java/org/apache/cassandra/net/Verb.java:159-160
    attributes: {verb: SCHEMA_VERSION_REQ}
    request: SchemaAuthSchemaVerbRequest
    response: {type: object, properties: {version: {type: string}}}
    behavior:
      - title: Schema.instance.getVersion() on the receiving node
        source: src/java/org/apache/cassandra/schema/SchemaVersionVerbHandler.java:39-40
        call: schema.get-version
        as: d
      - return: {version: "= vars.d.value.version"}

  # ======================================================== DDL statements
  - component: create-keyspace-statement
    name: apply
    kind: function
    summary: "CreateKeyspaceStatement.apply: REPLICATION is mandatory; an existing keyspace is a no-op with IF NOT EXISTS and AlreadyExists otherwise; LocalStrategy is reserved."
    description: "authorize() requires CREATE on ALL KEYSPACES (CreateKeyspaceStatement.java:95-98); the creator is granted all permissions on data/<ks> and functions/<ks>."
    sources: [src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:63-104]
    request: SchemaAuthSchemaStatement
    response: SchemaAuthTransformation
    errors: [{code: invalid, status: 8704}, {code: already-exists, status: 9216}]
    behavior:
      - if: "input.replication.class == ''"
        then:
          - title: Missing mandatory option 'replication'
            source: src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:67-68
            fail: {code: invalid, status: 8704, message: "Missing mandatory option 'replication'"}
      - title: SimpleStrategy guardrail passes
        detail: simplestrategy_enabled is commented out (cassandra.yaml:2176) so Config.java:907 default true applies.
        source: src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:70-71
      - call: schema-keyspace.rows-get
        input: {key: "= 'keyspace:' + input.keyspace"}
        as: ks
      - if: "!has(vars.ks.value.missing)"
        then:
          - if: "input.if_not_exists"
            then:
              - title: IF NOT EXISTS on an existing keyspace - unchanged schema
                source: src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:73-76
                return: {mutations: [], warnings: [], created_resources: []}
          - title: AlreadyExistsException
            source: src/java/org/apache/cassandra/cql3/statements/schema/CreateKeyspaceStatement.java:78
