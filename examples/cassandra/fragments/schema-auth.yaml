  - component: permissions-management-statement
    name: authorize
    kind: function
    summary: "GRANT/REVOKE permissions require AUTHORIZE on the resource (or a parent) and each granted permission itself."
    sources: [src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:61-72]
    request: SchemaAuthRoleStatement
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.ensure-permission
        input: {resource: "= input.resource", keyspace: "", permission: AUTHORIZE}
      - foreach: "= input.permissions"
        as: p
        steps:
          - call: client-state.ensure-permission
            input: {resource: "= input.resource", keyspace: "", permission: "= vars.p"}
      - return: {}
  - component: permissions-management-statement
    name: validate
    kind: function
    summary: "validate: ensureNotAnonymous, the grantee role must exist, and the resource must exist."
    sources: [src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:45-59]
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.ensure-not-anonymous
      - call: cassandra-role-manager.is-existing-role
        input: {role: "= input.grantee"}
        as: g
      - if: "!vars.g.value.exists"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:50-51
            fail: {code: invalid, status: 8704, message: "= 'Role ' + input.grantee + \" doesn't exist\""}
      - title: maybeCorrectResource - qualify an unqualified table with the session keyspace
        source: src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:53-55
        call: authorization-statement.maybe-correct-resource
        input: {resource: "= input.resource"}
      - if: "input.resource.startsWith('data')"
        then:
          - call: data-resource.exists
            input: {resource: "= input.resource"}
            as: ex
          - if: "!vars.ex.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/PermissionsManagementStatement.java:57-58
                fail: {code: invalid, status: 8704, message: "= 'Resource ' + input.resource + \" doesn't exist\""}
      - return: {}
  - component: grant-permissions-statement
    name: validate
    kind: function
    summary: "Adds to the base validation: on non-virtual system keyspaces only SELECT, DESCRIBE and ALTER may be granted."
    sources: [src/java/org/apache/cassandra/cql3/statements/GrantPermissionsStatement.java:47-62]
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - call: permissions-management-statement.validate
        input: "= input"
      - set: {vars.parts: "= input.resource.split('/')"}
      - if: "vars.parts[0] == 'data' && size(vars.parts) >= 2 && vars.parts[1] in ['system', 'system_schema', 'system_auth', 'system_distributed', 'system_traces'] && input.permissions.exists(p, !(p in ['SELECT', 'DESCRIBE', 'ALTER']))"
        then:
          - title: Permission.INVALID_FOR_SYSTEM_KEYSPACES
            source: src/java/org/apache/cassandra/cql3/statements/GrantPermissionsStatement.java:53-60
            fail: {code: unauthorized, status: 8448, message: "Granting permissions on system keyspaces is strictly limited, this operation is not permitted"}
      - return: {}
  - component: grant-permissions-statement
    name: execute
    kind: function
    summary: "execute: authorizer.grant; warn the client about permissions the role already had (unless ALL was given)."
    sources: [src/java/org/apache/cassandra/cql3/statements/GrantPermissionsStatement.java:64-86]
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    errors: [{code: unsupported-operation, status: 0}]
    behavior:
      - call: auth-config.get-backends
        as: b
      - call: "= vars.b.value.authorizer_component + '.grant'"
        targets: [cassandra-authorizer.grant, allow-all-authorizer.grant]
        input: {performer: "= input.user", permissions: "= input.permissions", resource: "= input.resource", grantee: "= input.grantee"}
        as: g
      - set: {vars.already: "= input.permissions.filter(p, !(p in vars.g.value.granted))"}
      - when: "size(vars.already) > 0"
        title: ClientWarn - already granted
        source: src/java/org/apache/cassandra/cql3/statements/GrantPermissionsStatement.java:71-83
        call: client-warn.warn
        input: {text: "= \"Role '\" + input.grantee + \"' was already granted \" + vars.already.join(', ') + ' on ' + input.resource"}
      - set: {ctx.granted: "= vars.g.value.granted"}
      - return: {kind: VOID}
  - component: revoke-permissions-statement
    name: execute
    kind: function
    summary: "execute: authorizer.revoke; warn the client about permissions the role did not have."
    sources: [src/java/org/apache/cassandra/cql3/statements/RevokePermissionsStatement.java:45-67]
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    errors: [{code: unsupported-operation, status: 0}]
    behavior:
      - call: auth-config.get-backends
        as: b
      - call: "= vars.b.value.authorizer_component + '.revoke'"
        targets: [cassandra-authorizer.revoke, allow-all-authorizer.revoke]
        input: {performer: "= input.user", permissions: "= input.permissions", resource: "= input.resource", grantee: "= input.grantee"}
        as: r
      - set: {vars.absent: "= input.permissions.filter(p, !(p in vars.r.value.revoked))"}
      - when: "size(vars.absent) > 0"
        title: ClientWarn - was not granted
        source: src/java/org/apache/cassandra/cql3/statements/RevokePermissionsStatement.java:52-64
        call: client-warn.warn
        input: {text: "= \"Role '\" + input.grantee + \"' was not granted \" + vars.absent.join(', ') + ' on ' + input.resource"}
      - set: {ctx.revoked: "= vars.r.value.revoked"}
      - return: {kind: VOID}

  - component: list-roles-statement
    name: validate
    kind: function
    summary: "validate: ensureNotAnonymous; a named grantee must exist. authorize() is empty."
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:70-80
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.ensure-not-anonymous
      - if: "input.grantee != ''"
        then:
          - call: cassandra-role-manager.is-existing-role
            input: {role: "= input.grantee"}
            as: ex
          - if: "!vars.ex.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:74-75
                fail: {code: invalid, status: 8704, message: "= '<role ' + input.grantee + \"> doesn't exist\""}
      - return: {}
  - component: list-roles-statement
    name: execute
    kind: function
    summary: "execute: with DESCRIBE on all roles (asked of the authorizer directly, not the cache) list every role or the grantee's; otherwise only your own roles, or the grantee's when you hold it."
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:82-115
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: auth-config.get-backends
        as: b
      - call: "= vars.b.value.authorizer_component + '.authorize'"
        targets: [cassandra-authorizer.authorize, allow-all-authorizer.authorize]
        input: {user: "= input.user", resource: roles}
        as: root
      - if: "'DESCRIBE' in vars.root.value.permissions"
        then:
          - if: "input.grantee == ''"
            then:
              - call: cassandra-role-manager.get-all-roles
                as: all
              - set: {vars.names: "= vars.all.value.roles"}
            else:
              - call: cassandra-role-manager.get-roles
                input: {role: "= input.grantee", include_inherited: "= input.recursive"}
                as: gr
              - set: {vars.names: "= vars.gr.value.roles"}
        else:
          - if: "input.grantee == ''"
            then:
              - call: cassandra-role-manager.get-roles
                input: {role: "= input.user", include_inherited: "= input.recursive"}
                as: mine
              - set: {vars.names: "= vars.mine.value.roles"}
            else:
              - call: cassandra-role-manager.get-roles
                input: {role: "= input.user", include_inherited: true}
                as: mine
              - if: "!(input.grantee in vars.mine.value.roles)"
                then:
                  - source: src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:100-103
                    fail: {code: unauthorized, status: 8448, message: "= 'You are not authorized to view roles granted to ' + input.grantee + ' '"}
              - call: cassandra-role-manager.get-roles
                input: {role: "= input.grantee", include_inherited: "= input.recursive"}
                as: gr
              - set: {vars.names: "= vars.gr.value.roles"}
      - if: "size(vars.names) == 0"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:109-110
            return: {kind: VOID}
      - call: "= input.statement == 'list-users-statement' ? 'list-users-statement.format-results' : 'list-roles-statement.format-results'"
        targets: [list-users-statement.format-results, list-roles-statement.format-results]
        input: {roles: "= vars.names"}
        as: rows
      - set: {ctx.listed: "= vars.rows.value.rows.map(r, r.role)"}
      - return: {kind: ROWS, rows: "= vars.rows.value.rows"}
  - component: list-roles-statement
    name: format-results
    kind: function
    summary: "One row per role: role, super (the role's own flag), login, options, datacenters."
    sources: [src/java/org/apache/cassandra/cql3/statements/ListRolesStatement.java:117-134]
    request: {type: object, properties: {roles: {type: array, items: {type: string}}}}
    response: {type: object, properties: {rows: {type: array, items: {type: object}}}}
    behavior:
      - set: {vars.rows: []}
      - foreach: "= input.roles"
        as: r
        steps:
          - call: cassandra-role-manager.is-super
            input: {role: "= vars.r"}
            as: su
          - call: cassandra-role-manager.can-login
            input: {role: "= vars.r"}
            as: cl
          - set: {vars.rows: "= vars.rows + [{'role': vars.r, 'super': vars.su.value.is_super, 'login': vars.cl.value.can_login, 'datacenters': 'ALL'}]"}
      - return: {rows: "= vars.rows"}
  - component: list-users-statement
    name: format-results
    kind: function
    summary: "LIST USERS: only roles that can log in; super is Roles.hasSuperuserStatus (inherited)."
    sources: [src/java/org/apache/cassandra/cql3/statements/ListUsersStatement.java:47-65]
    request: {type: object, properties: {roles: {type: array, items: {type: string}}}}
    response: {type: object, properties: {rows: {type: array, items: {type: object}}}}
