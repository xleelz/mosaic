  - id: s1-schema-agreement-push-and-pull
    name: 'S1: CREATE TABLE answers before agreement; the push reaches n2, n3 misses it and converges by pulling after gossip and MIGRATION_DELAY'
    description: n1 applies, announces and pushes asynchronously (DefaultSchemaUpdateHandler.java:244-250). The push to n3 is lost. One gossip round later n3 hears the new SCHEMA version (DefaultSchemaUpdateHandler.java:157-168), postpones the pull by migration-delay-ms (MigrationCoordinator.java:565-569), then pulls from n1 and merges. SCHEMA_VERSION_REQ then shows all three agree.
    fixtures: &id001 [three-node-rf3]
    faults:
      - {target: schema-push-verb-handler.do-verb, instance: n3, type: unavailable}
    steps:
      - {flow: create-table, as: ddl, 'on': n1}
      - interface: default-schema-update-handler.on-change
        caller: membership
        'on': n3
        at_ms: 1000
        as: gossip
        input: {endpoint: n1, state: SCHEMA, value: = ctx.announced_version}
      - interface: schema-version-verb-handler.do-verb
        caller: messaging
        'on': n3
        at_ms: 70000
        as: v3
        input: {from: n1}
    expect:
      - steps.ddl.result.ok && steps.ddl.result.value.kind == 'SCHEMA_CHANGE' && steps.ddl.duration_ms < 100
      - faults == 1 && calls_by_instance['schema-push-verb-handler.do-verb@n2'] == 1
      - steps.gossip.result.ok && steps.gossip.result.value.reason == 'postponed'
      - trace.exists(e, e.type == 'call.start' && e.interface == 'schema-pull-verb-handler.do-verb' && e.instance == 'n1' && e.t >= 61000)
      - state['schema@n1'].version == state['schema@n2'].version && state['schema@n2'].version == state['schema@n3'].version && state['schema@n3'].version.contains('table:shop.customers')
      - steps.v3.result.value.version == state['schema@n1'].version && 'table:shop.customers' in state['schema-keyspace@n3'].rows
  - id: s1-gossip-same-version-no-pull
    flow: gossip-schema-change
    name: A gossiped version equal to ours needs no pull
    fixtures: *id001
    input:
      value: = "v:index:shop.users_city_sai{users.city};index:shop.users_email_idx{users.email};keyspace:ks1{SimpleStrategy:3};keyspace:shop{SimpleStrategy:3};table:ks1.events{id timeuuid,payload text};table:ks1.page_views{url text,views bigint};table:ks1.users{id text,name text,email text,city text};table:shop.accounts{id uuid,balance decimal};table:shop.entries{id uuid,body text};table:shop.orders{id uuid,total decimal};table:shop.page_views{url text,views bigint};table:shop.users{id text,name text,email text,city text}"
    expect: ['result.ok && !result.value.pulled && calls[''schema-pull-verb-handler.do-verb''] == 0']
