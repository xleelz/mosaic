      - set: {vars.prefix: "= {'PermissionsCache': 'permissions', 'RolesCache': 'roles', 'CredentialsCache': 'credentials', 'NetworkPermissionsCache': 'roles', 'JmxPermissionsCache': 'permissions'}[input.cache]"}
      - set:
          vars.cfg: "= merge({'validity_ms': config[vars.prefix + '-validity-ms'], 'update_interval_ms': config[vars.prefix + '-update-interval-ms'], 'max_entries': config[vars.prefix + '-cache-max-entries'], 'active_update': config[vars.prefix + '-cache-active-update']}, vars.prefix in state.config ? state.config[vars.prefix] : {})"
      - if: "!input.enabled || vars.cfg.validity_ms <= 0"
        then:
          - title: cache == null - loadFunction.apply(k) on every call
            source: src/java/org/apache/cassandra/auth/AuthCache.java:225-226
            return: {hit: false, cached: false}
      - call: auth-cache.entries-get
        input: {cache: "= input.cache", key: "= input.key", validity_ms: "= vars.cfg.validity_ms"}
        as: e
      - if: "has(vars.e.value.missing)"
        then: [{return: {hit: false, cached: true}}]
      - return: {hit: true, cached: true, value: "= vars.e.value.value"}
  - {component: auth-cache, name: entries-get, kind: store, summary: "LoadingCache lookup; entries expire validity_ms after they were written (expireAfterWrite).", sources: [src/java/org/apache/cassandra/auth/AuthCache.java:342-348], request: {type: object, properties: {cache: {type: string}, key: {type: string}, validity_ms: {type: integer, default: 2000}}}, store: {table: entries, op: get, key: "= input.cache + '|' + input.key", where: "now - row.loaded_at < input.validity_ms", default: {missing: true}}}
  - {component: auth-cache, name: entries-put, kind: store, summary: Store a loaded value with its load time., sources: [src/java/org/apache/cassandra/auth/AuthCache.java:342-348], request: {type: object, properties: {cache: {type: string}, key: {type: string}, value: {}}}, store: {table: entries, op: put, key: "= input.cache + '|' + input.key", value: "= {'cache': input.cache, 'key': input.key, 'value': input.value, 'loaded_at': now}"}}
  - {component: auth-cache, name: entries-delete, kind: store, summary: "AuthCache.invalidate(k) - cache.invalidate(k).", sources: [src/java/org/apache/cassandra/auth/AuthCache.java:243-247], request: {type: object, properties: {cache: {type: string}, key: {type: string}}}, store: {table: entries, op: delete, key: "= input.cache + '|' + input.key"}}
  - {component: auth-cache, name: entries-query, kind: store, summary: Every cached key of one cache., sources: [src/java/org/apache/cassandra/auth/AuthCache.java:207-213], request: {type: object, properties: {cache: {type: string}}}, store: {table: entries, op: query, where: "row.cache == input.cache"}}
  - {component: auth-cache, name: config-update, kind: store, summary: "Apply a setter through its DatabaseDescriptor delegate.", sources: [src/java/org/apache/cassandra/auth/AuthCache.java:253-315], request: {type: object, properties: {prefix: {type: string}, changes: {type: object}}}, store: {table: config, op: put, key: "= input.prefix", value: "= merge(input.prefix in state.config ? state.config[input.prefix] : {}, input.changes)"}}
  - component: auth-cache
    name: invalidate
    kind: jmx
    summary: "AuthCacheMBean.invalidate: drop the whole cache by re-initialising it (initCache(null))."
    sources:
      - src/java/org/apache/cassandra/auth/AuthCacheMBean.java:23
      - src/java/org/apache/cassandra/auth/AuthCache.java:234-237
    request: {type: object, properties: {cache: {type: string, default: RolesCache}}}
    behavior:
      - call: auth-cache.entries-query
        input: {cache: "= input.cache"}
        as: all
      - foreach: "= vars.all.value"
        as: e
        steps:
          - call: auth-cache.entries-delete
            input: {cache: "= input.cache", key: "= vars.e.key"}
      - call: auth-cache.init-cache
        input: {cache: "= input.cache", enabled: true}
      - set: {ctx.cache_invalidated: "= input.cache"}
  - component: auth-cache
    name: set-validity
    kind: jmx
    summary: "AuthCacheMBean.setValidity: set the validity (expiry) and re-initialise the cache; refused when -Dcassandra.disable_auth_caches_remote_configuration is set."
    sources:
      - src/java/org/apache/cassandra/auth/AuthCacheMBean.java:25
      - src/java/org/apache/cassandra/auth/AuthCache.java:253-260
    request: SchemaAuthCacheSetting
    behavior:
      - call: auth-cache.config-update
        input: {prefix: "= {'PermissionsCache': 'permissions', 'RolesCache': 'roles', 'CredentialsCache': 'credentials', 'NetworkPermissionsCache': 'roles', 'JmxPermissionsCache': 'permissions'}[input.cache]", changes: {validity_ms: "= input.value"}}
      - call: auth-cache.init-cache
        input: {cache: "= input.cache", enabled: true}
  - component: auth-cache
    name: set-update-interval
    kind: jmx
    summary: AuthCacheMBean.setUpdateInterval - the refreshAfterWrite interval; re-initialises the cache.
    sources:
      - src/java/org/apache/cassandra/auth/AuthCacheMBean.java:29
      - src/java/org/apache/cassandra/auth/AuthCache.java:271-278
    request: SchemaAuthCacheSetting
    behavior:
      - call: auth-cache.config-update
        input: {prefix: "= {'PermissionsCache': 'permissions', 'RolesCache': 'roles', 'CredentialsCache': 'credentials', 'NetworkPermissionsCache': 'roles', 'JmxPermissionsCache': 'permissions'}[input.cache]", changes: {update_interval_ms: "= input.value"}}
      - call: auth-cache.init-cache
        input: {cache: "= input.cache", enabled: true}
  - component: auth-cache
    name: set-max-entries
    kind: jmx
    summary: AuthCacheMBean.setMaxEntries - the cache's maximum size; re-initialises the cache.
    sources:
      - src/java/org/apache/cassandra/auth/AuthCacheMBean.java:33
      - src/java/org/apache/cassandra/auth/AuthCache.java:289-296
    request: SchemaAuthCacheSetting
    behavior:
      - call: auth-cache.config-update
        input: {prefix: "= {'PermissionsCache': 'permissions', 'RolesCache': 'roles', 'CredentialsCache': 'credentials', 'NetworkPermissionsCache': 'roles', 'JmxPermissionsCache': 'permissions'}[input.cache]", changes: {max_entries: "= input.value"}}
      - call: auth-cache.init-cache
        input: {cache: "= input.cache", enabled: true}
  - component: auth-cache
    name: set-active-update
    kind: jmx
    summary: "AuthCacheMBean.setActiveUpdate: with active update the cache refreshes after the validity period and a CacheRefresher reloads every key each update interval."
    sources:
      - src/java/org/apache/cassandra/auth/AuthCacheMBean.java:39
      - src/java/org/apache/cassandra/auth/AuthCache.java:308-315
    request: SchemaAuthCacheSetting
    behavior:
      - call: auth-cache.config-update
        input: {prefix: "= {'PermissionsCache': 'permissions', 'RolesCache': 'roles', 'CredentialsCache': 'credentials', 'NetworkPermissionsCache': 'roles', 'JmxPermissionsCache': 'permissions'}[input.cache]", changes: {active_update: "= input.enabled"}}
      - call: auth-cache.init-cache
        input: {cache: "= input.cache", enabled: true}
  - component: auth-cache
    name: init-cache
    kind: function
    summary: "initCache: no cache when disabled or validity <= 0; cancel any running refresher; with active update schedule CacheRefresher at a fixed rate of update_interval on optionalTasks."
    sources: [src/java/org/apache/cassandra/auth/AuthCache.java:329-376]
    request: {type: object, properties: {cache: {type: string}, enabled: {type: boolean, default: true}}}
    response: {type: object, properties: {cache_enabled: {type: boolean}, refresher_scheduled: {type: boolean}}}
    behavior:
      - set: {vars.prefix: "= {'PermissionsCache': 'permissions', 'RolesCache': 'roles', 'CredentialsCache': 'credentials', 'NetworkPermissionsCache': 'roles', 'JmxPermissionsCache': 'permissions'}[input.cache]"}
      - set:
          vars.cfg: "= merge({'validity_ms': config[vars.prefix + '-validity-ms'], 'update_interval_ms': config[vars.prefix + '-update-interval-ms'], 'max_entries': config[vars.prefix + '-cache-max-entries'], 'active_update': config[vars.prefix + '-cache-active-update']}, vars.prefix in state.config ? state.config[vars.prefix] : {})"
      - if: "!input.enabled || vars.cfg.validity_ms <= 0"
        then:
          - source: src/java/org/apache/cassandra/auth/AuthCache.java:331-335
            title: No cache
            return: {cache_enabled: false, refresher_scheduled: false}
      - if: "vars.cfg.active_update"
        then:
          - title: scheduleAtFixedRate(CacheRefresher, updateInterval, updateInterval)
            source: src/java/org/apache/cassandra/auth/AuthCache.java:366-374
            set: {ctx.refresher_scheduled: "= input.cache"}
          - emit: cache-refresher.run
            every_ms: "= vars.cfg.update_interval_ms"
            count: 3
            input: {cache: "= input.cache"}
          - return: {cache_enabled: true, refresher_scheduled: true}
      - return: {cache_enabled: true, refresher_scheduled: false}
  - component: cache-refresher
    name: run
    kind: function
    summary: "CacheRefresher.run: unless the node is decommissioned, refresh every cached key and drop keys whose reloaded value matches the invalidation condition (the credentials sentinel)."
    sources: [src/java/org/apache/cassandra/auth/CacheRefresher.java:50-77]
    request: {type: object, properties: {cache: {type: string, default: CredentialsCache}}}
    behavior:
      - call: auth-cache.entries-query
        input: {cache: "= input.cache"}
        as: all
      - foreach: "= vars.all.value"
        as: e
        steps:
          - if: "input.cache == 'CredentialsCache' && vars.e.value == ''"
            then:
              - title: invalidationCondition - NO_SUCH_CREDENTIAL is never kept
                source: src/java/org/apache/cassandra/auth/CacheRefresher.java:66-70
                call: auth-cache.entries-delete
                input: {cache: "= input.cache", key: "= vars.e.key"}
            else:
              - title: cache.refresh(key)
                source: src/java/org/apache/cassandra/auth/CacheRefresher.java:64
                call: auth-cache.entries-put
                input: {cache: "= input.cache", key: "= vars.e.key", value: "= vars.e.value"}
      - set: {ctx.refreshed: "= size(vars.all.value)"}

  - component: permissions-cache
    name: get-permissions
    kind: function
    summary: "PermissionsCache.getPermissions: (user, resource) through the cache, loaded by authorizer.authorize. The cache only exists when the authorizer requires authorization, so under AllowAllAuthorizer every lookup calls the authorizer."
    sources: [src/java/org/apache/cassandra/auth/PermissionsCache.java:28-47]
    request: SchemaAuthPermissionRequest
    response: SchemaAuthPermissionSet
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: auth-config.get-backends
        as: b
      - call: auth-cache.get
        input: {cache: PermissionsCache, key: "= input.user + '|' + input.resource", enabled: "= vars.b.value.require_authorization"}
        as: c
      - if: "vars.c.value.hit"
        then:
          - set: {ctx.permissions_cache: hit}
          - return: {permissions: "= vars.c.value.value"}
      - title: loadFunction - authorizer.authorize(user, resource)
        source: src/java/org/apache/cassandra/auth/PermissionsCache.java:39
        call: "= vars.b.value.authorizer_component + '.authorize'"
        targets: [cassandra-authorizer.authorize, allow-all-authorizer.authorize]
        input: {user: "= input.user", resource: "= input.resource"}
        as: p
      - when: "vars.c.value.cached"
        call: auth-cache.entries-put
        input: {cache: PermissionsCache, key: "= input.user + '|' + input.resource", value: "= vars.p.value.permissions"}
      - set: {ctx.permissions_cache: "= vars.c.value.cached ? 'miss' : 'disabled'"}
      - return: {permissions: "= vars.p.value.permissions"}
  - component: permissions-cache
    name: invalidate-permissions
    kind: jmx
    summary: PermissionsCacheMBean.invalidatePermissions(role, resource) - drop one cached entry.
    sources:
      - src/java/org/apache/cassandra/auth/PermissionsCacheMBean.java:25
      - src/java/org/apache/cassandra/auth/PermissionsCache.java:49-52
    request: {type: object, properties: {role: {type: string, default: alice}, resource: {type: string, default: data/shop/orders}}}
    behavior:
      - call: auth-cache.entries-delete
        input: {cache: PermissionsCache, key: "= input.role + '|' + input.resource"}
  - component: roles-cache
    name: get-roles
    kind: function
    summary: "RolesCache.getRoles: the role's granted roles through the cache, loaded by roleManager.getRoleDetails. The cache only exists when the authenticator requires authentication."
    sources:
      - src/java/org/apache/cassandra/auth/RolesCache.java:30-70
      - src/java/org/apache/cassandra/auth/Roles.java:38
    request: {type: object, properties: {role: {type: string, default: alice}}}
    response: {type: object, properties: {roles: {type: array, items: {$ref: SchemaAuthRole}}}}
    behavior:
      - call: auth-config.get-backends
        as: b
      - call: auth-cache.get
        input: {cache: RolesCache, key: "= input.role", enabled: "= vars.b.value.require_authentication"}
        as: c
      - if: "vars.c.value.hit"
        then:
          - set: {ctx.roles_cache: hit}
          - return: {roles: "= vars.c.value.value"}
      - call: cassandra-role-manager.get-role-details
        input: {role: "= input.role"}
        as: d
      - when: "vars.c.value.cached"
        call: auth-cache.entries-put
        input: {cache: RolesCache, key: "= input.role", value: "= vars.d.value.roles"}
      - set: {ctx.roles_cache: "= vars.c.value.cached ? 'miss' : 'disabled'"}
      - return: {roles: "= vars.d.value.roles"}
  - component: roles-cache
    name: invalidate-roles
    kind: jmx
    summary: RolesCacheMBean.invalidateRoles(role) - drop one cached entry (nodetool invalidaterolescache).
    sources:
      - src/java/org/apache/cassandra/auth/RolesCacheMBean.java:25
      - src/java/org/apache/cassandra/auth/RolesCache.java:81-84
    request: {type: object, properties: {role: {type: string, default: alice}}}
    behavior:
      - call: auth-cache.entries-delete
        input: {cache: RolesCache, key: "= input.role"}
  - component: network-permissions-cache
    name: invalidate-network-permissions
    kind: jmx
    summary: NetworkPermissionsCacheMBean.invalidateNetworkPermissions(role).
    sources:
      - src/java/org/apache/cassandra/auth/NetworkPermissionsCacheMBean.java:28
      - src/java/org/apache/cassandra/auth/NetworkPermissionsCache.java:44-47
    request: {type: object, properties: {role: {type: string, default: alice}}}
    behavior:
      - call: auth-cache.entries-delete
        input: {cache: NetworkPermissionsCache, key: "= input.role"}
  - component: authorization-proxy-jmx-permissions-cache
    name: invalidate-permissions
    kind: jmx
    summary: JmxPermissionsCacheMBean.invalidatePermissions(role).
    sources: [src/java/org/apache/cassandra/auth/jmx/AuthorizationProxy.java:585-593]
    request: {type: object, properties: {role: {type: string, default: alice}}}
    behavior:
      - call: auth-cache.entries-delete
        input: {cache: JmxPermissionsCache, key: "= input.role"}
  - component: password-authenticator-credentials-cache
    name: get
    kind: function
    summary: "CredentialsCache: role -> salted hash, loaded by queryHashedPassword. Always enabled (enableCache is () -> true)."
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:317-333]
    request: {type: object, properties: {username: {type: string, default: alice}}}
    response: {type: object, properties: {hash: {type: string}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - call: auth-cache.get
        input: {cache: CredentialsCache, key: "= input.username", enabled: true}
        as: c
      - if: "vars.c.value.hit"
        then:
          - set: {ctx.credentials_cache: hit}
          - return: {hash: "= vars.c.value.value"}
      - call: password-authenticator.query-hashed-password
        input: {username: "= input.username"}
        as: h
      - when: "vars.c.value.cached"
        call: auth-cache.entries-put
        input: {cache: CredentialsCache, key: "= input.username", value: "= vars.h.value.hash"}
      - set: {ctx.credentials_cache: miss}
      - return: {hash: "= vars.h.value.hash"}
  - component: password-authenticator-credentials-cache
    name: invalidate-credentials
    kind: jmx
    summary: CredentialsCacheMBean.invalidateCredentials(role) - also used internally to expunge the NO_SUCH_CREDENTIAL sentinel.
    sources:
      - src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:335-338
      - src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:345
    request: {type: object, properties: {role: {type: string, default: alice}}}
    behavior:
      - call: auth-cache.entries-delete
        input: {cache: CredentialsCache, key: "= input.role"}

  # resources
  - component: data-resource
    name: applicable-permissions
    kind: function
    summary: "Root and keyspace: CREATE ALTER DROP SELECT MODIFY AUTHORIZE UNMASK SELECT_MASKED; all tables: the same; a table: everything but CREATE."
    sources: [src/java/org/apache/cassandra/auth/DataResource.java:261-274]
    request: {type: object, properties: {resource: {type: string, default: data/shop}}}
    response: SchemaAuthPermissionSet
    behavior:
      - set: {vars.parts: "= input.resource.split('/')"}
      - return:
          permissions: "= size(vars.parts) == 3 && vars.parts[2] != '*' ? ['ALTER', 'DROP', 'SELECT', 'MODIFY', 'AUTHORIZE', 'UNMASK', 'SELECT_MASKED'] : ['CREATE', 'ALTER', 'DROP', 'SELECT', 'MODIFY', 'AUTHORIZE', 'UNMASK', 'SELECT_MASKED']"
  - component: data-resource
    name: exists
    kind: function
    summary: "DataResource.exists: the root always; a keyspace or all-tables resource when the keyspace is in the schema (or virtual); a table when it is in the schema."
    sources: [src/java/org/apache/cassandra/auth/DataResource.java:245-259]
    request: {type: object, properties: {resource: {type: string, default: data/shop}}}
    response: {type: object, properties: {exists: {type: boolean}}}
    behavior:
      - set: {vars.parts: "= input.resource.split('/')"}
      - if: "size(vars.parts) == 1"
        then: [{return: {exists: true}}]
      - if: "vars.parts[1] in ['system', 'system_schema', 'system_auth', 'system_distributed', 'system_traces', 'system_views', 'system_virtual_schema']"
        then: [{return: {exists: true}}]
      - call: schema-keyspace.rows-get
        input: {key: "= size(vars.parts) == 3 && vars.parts[2] != '*' ? 'table:' + vars.parts[1] + '.' + vars.parts[2] : 'keyspace:' + vars.parts[1]"}
        as: row
      - return: {exists: "= !has(vars.row.value.missing)"}
  - component: role-resource
    name: applicable-permissions
    kind: function
    summary: "roles (all roles): CREATE ALTER DROP AUTHORIZE DESCRIBE; one role: ALTER DROP AUTHORIZE DESCRIBE."
    sources: [src/java/org/apache/cassandra/auth/RoleResource.java:150-153]
    request: {type: object, properties: {resource: {type: string, default: roles/bob}}}
    response: SchemaAuthPermissionSet
    behavior:
      - return:
          permissions: "= input.resource == 'roles' ? ['CREATE', 'ALTER', 'DROP', 'AUTHORIZE', 'DESCRIBE'] : ['ALTER', 'DROP', 'AUTHORIZE', 'DESCRIBE']"
  - component: function-resource
    name: applicable-permissions
    kind: function
    summary: "functions and functions/<ks>: CREATE ALTER DROP AUTHORIZE EXECUTE; one function: ALTER DROP AUTHORIZE EXECUTE."
    sources: [src/java/org/apache/cassandra/auth/FunctionResource.java:288-300]
    request: {type: object, properties: {resource: {type: string, default: functions/inventory}}}
    response: SchemaAuthPermissionSet
    behavior:
      - return:
          permissions: "= size(input.resource.split('/')) <= 2 ? ['CREATE', 'ALTER', 'DROP', 'AUTHORIZE', 'EXECUTE'] : ['ALTER', 'DROP', 'AUTHORIZE', 'EXECUTE']"

  # ======================================================== authenticators
  - component: allow-all-authenticator
    name: new-sasl-negotiator
    kind: function
    summary: "Deployed authenticator: requireAuthentication() is false, so the server answers STARTUP with READY and never asks for credentials; the shared negotiator completes immediately."
    sources:
      - src/java/org/apache/cassandra/auth/AllowAllAuthenticator.java:32-35
      - src/java/org/apache/cassandra/auth/AllowAllAuthenticator.java:50-53
    response: {type: object, properties: {negotiator: {type: string}}}
    behavior:
      - return: {negotiator: allow-all-authenticator-negotiator}
  - component: allow-all-authenticator
    name: legacy-authenticate
    kind: function
    summary: AllowAllAuthenticator.legacyAuthenticate - always the anonymous user.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthenticator.java:55-58]
    response: {type: object, properties: {user: {type: string}}}
    behavior:
      - return: {user: anonymous}
  - component: allow-all-authenticator-negotiator
    name: get-authenticated-user
    kind: function
    summary: Negotiator.getAuthenticatedUser - AuthenticatedUser.ANONYMOUS_USER.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthenticator.java:73-76]
    response: {type: object, properties: {user: {type: string}}}
    behavior:
      - set: {ctx.logged_in_as: anonymous}
      - return: {user: anonymous}

  - component: password-authenticator
    name: new-sasl-negotiator
    kind: function
    summary: PasswordAuthenticator.newSaslNegotiator - a fresh PlainTextSaslAuthenticator per connection.
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:236-239]
    response: {type: object, properties: {negotiator: {type: string}}}
    behavior:
      - return: {negotiator: password-authenticator-plain-text-sasl-authenticator}
  - component: password-authenticator
    name: authenticate
    kind: function
    summary: "authenticate: look the salted hash up through the credentials cache; an unknown role (sentinel) is expunged from the cache and refused; a wrong password is refused with the same message."
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:140-168]
    request: {type: object, properties: {username: {type: string, default: alice}, password: {type: string, default: s3cret}}}
    response: {type: object, properties: {user: {type: string}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - call: password-authenticator-credentials-cache.get
        input: {username: "= input.username"}
        as: h
      - if: "vars.h.value.hash == ''"
        then:
          - title: NO_SUCH_CREDENTIAL - invalidate the cached sentinel, then refuse
            source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:145-162
            call: password-authenticator-credentials-cache.invalidate-credentials
            input: {role: "= input.username"}
          - fail: {code: bad-credentials, status: 256, message: "= 'Provided username ' + input.username + ' and/or password are incorrect'"}
      - if: "vars.h.value.hash != 'bcrypt:' + input.password"
        then:
          - title: BCrypt.checkpw fails
            source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:164-165
            fail: {code: bad-credentials, status: 256, message: "= 'Provided username ' + input.username + ' and/or password are incorrect'"}
      - set: {ctx.logged_in_as: "= input.username"}
      - return: {user: "= input.username"}
  - component: password-authenticator
    name: query-hashed-password
    kind: function
    summary: "queryHashedPassword: SELECT salted_hash FROM system_auth.roles at QUORUM for 'cassandra' and auth_read_consistency_level (LOCAL_QUORUM) otherwise; a missing row or hash yields the sentinel; a failed read becomes AuthenticationException."
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:170-196]
    request: {type: object, properties: {username: {type: string, default: alice}}}
    response: {type: object, properties: {hash: {type: string}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - call: cassandra-role-manager.consistency-for-role-read
        input: {role: "= input.username"}
        as: cl
      - call: select-statement.execute
        input: {statement: {type: SELECT, keyspace: system_auth, table: roles, partition_keys: [{partition_key: "= input.username", token: 0}]}, options: {consistency: "= vars.cl.value.consistency"}, client_state: {user: system, is_super: true}}
        fill: true
        on_error:
          - title: RequestExecutionException -> AuthenticationException
            source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:192-195
            fail: {code: bad-credentials, status: 256, message: "= 'Unable to perform authentication: ' + error.message"}
      - call: auth-keyspace.roles-get
        input: {key: "= input.username"}
        as: row
      - if: "has(vars.row.value.missing) || vars.row.value.salted_hash == ''"
        then:
          - source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:183-188
            title: No such credential - sentinel
            return: {hash: ""}
      - return: {hash: "= vars.row.value.salted_hash"}
  - component: password-authenticator
    name: legacy-authenticate
    kind: function
    summary: legacyAuthenticate (protocol v1 CREDENTIALS) - username and password keys are required.
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:223-234]
    request: {type: object, properties: {username: {type: string, default: alice}, password: {type: string, default: s3cret}}}
    response: {type: object, properties: {user: {type: string}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - if: "input.username == ''"
        then:
          - source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:226-227
            fail: {code: bad-credentials, status: 256, message: "Required key 'username' is missing"}
      - if: "input.password == ''"
        then:
          - source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:229-231
            fail: {code: bad-credentials, status: 256, message: "= \"Required key 'password' is missing for provided username \" + input.username"}
      - call: password-authenticator.authenticate
        input: {username: "= input.username", password: "= input.password"}
        as: u
      - return: "= vars.u.value"
  - component: password-authenticator-plain-text-sasl-authenticator
    name: evaluate-response
    kind: function
    summary: "evaluateResponse: decode the SASL PLAIN token authzId NUL authnId NUL password (given here already split); empty or NUL-containing parts are refused. Completes in one step."
    sources:
      - src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:253-258
      - src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:284-312
    request: {type: object, properties: {username: {type: string, default: alice}, password: {type: string, default: s3cret}}}
    response: {type: object, properties: {complete: {type: boolean}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - if: "input.password == ''"
        then:
          - source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:305-306
            fail: {code: bad-credentials, status: 256, message: Password must not be null}
      - if: "input.username == ''"
        then:
          - source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:307-308
            fail: {code: bad-credentials, status: 256, message: Authentication ID must not be null}
      - return: {complete: true}
  - component: password-authenticator-plain-text-sasl-authenticator
    name: get-authenticated-user
    kind: function
    summary: "getAuthenticatedUser: refuse before negotiation completes, then authenticate the decoded credentials. ClientState.login then checks LOGIN (transport)."
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:265-270]
    request: {type: object, properties: {username: {type: string, default: alice}, password: {type: string, default: s3cret}, complete: {type: boolean, default: true}}}
    response: {type: object, properties: {user: {type: string}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - if: "!input.complete"
        then:
          - source: src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:267-268
            fail: {code: bad-credentials, status: 256, message: SASL negotiation not complete}
      - call: password-authenticator.authenticate
        input: {username: "= input.username", password: "= input.password"}
        as: u
      - return: "= vars.u.value"

  # ========================================================== authorizers
  - component: allow-all-authorizer
    name: authorize
    kind: function
    summary: AllowAllAuthorizer.authorize - every applicable permission on the resource.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthorizer.java:31-34]
    request: SchemaAuthPermissionRequest
    response: SchemaAuthPermissionSet
    behavior:
      - call: "= input.resource.startsWith('roles') ? 'role-resource.applicable-permissions' : (input.resource.startsWith('functions') ? 'function-resource.applicable-permissions' : 'data-resource.applicable-permissions')"
        targets: [role-resource.applicable-permissions, function-resource.applicable-permissions, data-resource.applicable-permissions]
        input: {resource: "= input.resource"}
        as: a
      - return: {permissions: "= vars.a.value.permissions"}
  - component: allow-all-authorizer
    name: grant
    kind: function
    summary: GRANT is unsupported by AllowAllAuthorizer.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthorizer.java:36-39]
    request: SchemaAuthPermissionChange
    errors: [{code: unsupported-operation, status: 0}]
    behavior:
      - fail: {code: unsupported-operation, status: 0, message: GRANT operation is not supported by AllowAllAuthorizer}
  - component: allow-all-authorizer
    name: revoke
    kind: function
    summary: REVOKE is unsupported by AllowAllAuthorizer.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthorizer.java:41-44]
    request: SchemaAuthPermissionChange
    errors: [{code: unsupported-operation, status: 0}]
    behavior:
      - fail: {code: unsupported-operation, status: 0, message: REVOKE operation is not supported by AllowAllAuthorizer}
  - component: allow-all-authorizer
    name: list
    kind: function
    summary: LIST PERMISSIONS is unsupported by AllowAllAuthorizer.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthorizer.java:54-57]
    errors: [{code: unsupported-operation, status: 0}]
    behavior:
      - fail: {code: unsupported-operation, status: 0, message: LIST PERMISSIONS operation is not supported by AllowAllAuthorizer}
  - component: allow-all-authorizer
    name: revoke-all-from
    kind: function
    summary: No-op.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthorizer.java:46-48]
    behavior:
      - return: {}
  - component: allow-all-authorizer
    name: revoke-all-on
    kind: function
    summary: No-op.
    sources: [src/java/org/apache/cassandra/auth/AllowAllAuthorizer.java:50-52]
    behavior:
      - return: {}

  - component: cassandra-authorizer
    name: authorize
    kind: function
    summary: "CassandraAuthorizer.authorize: a superuser gets every applicable permission; otherwise the union of role_permissions rows for the user's primary role and every role granted to it. A failed read becomes UnauthorizedException."
    sources: [src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:73-95]
    request: SchemaAuthPermissionRequest
    response: SchemaAuthPermissionSet
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: authenticated-user.is-super
        input: {user: "= input.user"}
        as: su
      - if: "vars.su.value.is_super"
        then:
          - title: Superuser - resource.applicablePermissions()
            source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:79-80
            call: allow-all-authorizer.authorize
            input: {user: "= input.user", resource: "= input.resource"}
            as: all
          - return: {permissions: "= vars.all.value.permissions"}
      - call: roles.get-role-details
        input: {role: "= input.user"}
        as: rd
      - set: {vars.perms: []}
      - foreach: "= vars.rd.value.roles"
        as: r
        steps:
          - call: cassandra-authorizer.add-permissions-for-role
            input: {role: "= vars.r.role", resource: "= input.resource"}
            as: ap
            on_error:
              - title: RequestExecutionException -> UnauthorizedException
                source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:90-94
                fail: {code: unauthorized, status: 8448, message: "= 'Unable to perform authorization of permissions: ' + error.message"}
          - set: {vars.perms: "= vars.perms + vars.ap.value.permissions.filter(p, !(p in vars.perms))"}
      - return: {permissions: "= vars.perms"}
  - component: cassandra-authorizer
    name: add-permissions-for-role
    kind: function
    summary: addPermissionsForRole - SELECT permissions FROM role_permissions WHERE role = ? AND resource = ? at auth_read_consistency_level.
    sources: [src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:254-273]
    request: {type: object, properties: {role: {type: string}, resource: {type: string}}}
    response: SchemaAuthPermissionSet
    behavior:
      - call: auth-properties.get-read-consistency-level
        as: cl
      - call: select-statement.execute
        input: {statement: {type: SELECT, keyspace: system_auth, table: role_permissions, partition_keys: [{partition_key: "= input.role", token: 0}]}, options: {consistency: "= vars.cl.value.consistency"}, client_state: {user: system, is_super: true}}
        fill: true
      - call: auth-keyspace.role-permissions-get
        input: {role: "= input.role", resource: "= input.resource"}
        as: row
      - return: {permissions: "= has(vars.row.value.missing) ? [] : vars.row.value.permissions"}
  - component: cassandra-authorizer
    name: grant
    kind: function
    summary: "grant: read the existing permissions at LOCAL_ONE (hard-coded), add the missing ones to role_permissions and the resource -> role index at auth_write_consistency_level; return what was newly granted."
    sources:
      - src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:97-112
      - src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:218-242
      - src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:301-309
    request: SchemaAuthPermissionChange
    response: {type: object, properties: {granted: {type: array, items: {type: string}}}}
    behavior:
      - title: getExistingPermissions at ConsistencyLevel.LOCAL_ONE
        source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:222-227
        call: query-processor.process-query-string
        input: {query: "SELECT permissions FROM system_auth.role_permissions WHERE role = ? AND resource = ?", consistency: LOCAL_ONE}
      - call: auth-keyspace.role-permissions-get
        input: {role: "= input.grantee", resource: "= input.resource"}
        as: row
      - set: {vars.existing: "= has(vars.row.value.missing) ? [] : vars.row.value.permissions"}
      - set: {vars.missing: "= input.permissions.filter(p, !(p in vars.existing))"}
      - if: "size(vars.missing) > 0"
        then:
          - call: auth-properties.get-write-consistency-level
            as: wcl
          - title: modifyRolePermissions '+' and addLookupEntry
            source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:105-109
            call: query-processor.process-query-string
            input: {query: "UPDATE system_auth.role_permissions SET permissions = permissions + {...}", consistency: "= vars.wcl.value.consistency"}
          - call: auth-keyspace.role-permissions-put
            input: {role: "= input.grantee", resource: "= input.resource", permissions: "= vars.existing + vars.missing"}
          - call: query-processor.process-query-string
            input: {query: "INSERT INTO system_auth.resource_role_permissons_index (resource, role)", consistency: "= vars.wcl.value.consistency"}
          - set: {ctx.permission_write_consistency: "= vars.wcl.value.consistency"}
      - return: {granted: "= vars.missing"}
  - component: cassandra-authorizer
    name: revoke
    kind: function
    summary: "revoke: read the existing permissions at LOCAL_ONE; remove those present and remove the index entry (even when other permissions on the resource remain); return what was revoked."
    sources: [src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:114-128]
    request: SchemaAuthPermissionChange
    response: {type: object, properties: {revoked: {type: array, items: {type: string}}}}
    behavior:
      - call: query-processor.process-query-string
        input: {query: "SELECT permissions FROM system_auth.role_permissions WHERE role = ? AND resource = ?", consistency: LOCAL_ONE}
      - call: auth-keyspace.role-permissions-get
        input: {role: "= input.grantee", resource: "= input.resource"}
        as: row
      - set: {vars.existing: "= has(vars.row.value.missing) ? [] : vars.row.value.permissions.filter(p, p in input.permissions)"}
      - if: "size(vars.existing) > 0"
        then:
          - call: auth-properties.get-write-consistency-level
            as: wcl
          - title: modifyRolePermissions '-' and removeLookupEntry
            source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:121-125
            call: query-processor.process-query-string
            input: {query: "UPDATE system_auth.role_permissions SET permissions = permissions - {...}", consistency: "= vars.wcl.value.consistency"}
          - call: auth-keyspace.role-permissions-put
            input: {role: "= input.grantee", resource: "= input.resource", permissions: "= vars.row.value.permissions.filter(p, !(p in input.permissions))"}
          - call: query-processor.process-query-string
            input: {query: "DELETE FROM system_auth.resource_role_permissons_index WHERE resource = ? and role = ?", consistency: "= vars.wcl.value.consistency"}
      - return: {revoked: "= vars.existing"}
  - component: cassandra-authorizer
    name: list
    kind: function
    summary: "list: unless the performer is a superuser, the system user, a member of the grantee, or has DESCRIBE on all roles or on the grantee, refuse; then list role_permissions rows of the grantee and every role it inherits (or everyone)."
    sources: [src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:311-338]
    request:
      type: object
      properties:
        performer: {type: string, default: cassandra}
        permissions: {type: array, items: {type: string}}
        resource: {type: string, default: ""}
        grantee: {type: string, default: ""}
    response: {type: object, properties: {details: {type: array, items: {type: object}}}}
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: authenticated-user.is-super
        input: {user: "= input.performer"}
        as: su
      - set: {vars.allowed: "= vars.su.value.is_super || input.performer == 'system'"}
      - if: "!vars.allowed"
        then:
          - call: authenticated-user.get-roles
            input: {user: "= input.performer"}
            as: mine
          - set: {vars.allowed: "= input.grantee in vars.mine.value.roles"}
      - if: "!vars.allowed"
        then:
          - call: authenticated-user.get-permissions
            input: {user: "= input.performer", resource: roles}
            as: rootp
          - set: {vars.allowed: "= 'DESCRIBE' in vars.rootp.value.permissions"}
      - if: "!vars.allowed && input.grantee != ''"
        then:
          - call: authenticated-user.get-permissions
            input: {user: "= input.performer", resource: "= 'roles/' + input.grantee"}
            as: gp
          - set: {vars.allowed: "= 'DESCRIBE' in vars.gp.value.permissions"}
      - if: "!vars.allowed"
        then:
          - source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:321-327
            title: Not authorized to view the permissions
            fail: {code: unauthorized, status: 8448, message: "= 'You are not authorized to view ' + (input.grantee == '' ? 'everyone' : input.grantee) + \"'s permissions\""}
      - if: "input.grantee == ''"
        then:
          - call: cassandra-authorizer.list-permissions-for-role
            input: {permissions: "= input.permissions", resource: "= input.resource", role: ""}
            as: everyone
          - return: {details: "= vars.everyone.value.details"}
      - call: cassandra-role-manager.get-roles
        input: {role: "= input.grantee", include_inherited: true}
        as: rs
      - set: {vars.details: []}
      - foreach: "= vars.rs.value.roles"
        as: r
        steps:
          - call: cassandra-authorizer.list-permissions-for-role
            input: {permissions: "= input.permissions", resource: "= input.resource", role: "= vars.r"}
            as: d
          - set: {vars.details: "= vars.details + vars.d.value.details"}
      - return: {details: "= vars.details"}
  - component: cassandra-authorizer
    name: list-permissions-for-role
    kind: function
    summary: listPermissionsForRole - SELECT role, resource, permissions FROM role_permissions [WHERE resource / role] at auth_read_consistency_level, keeping the requested permissions.
    sources: [src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:340-389]
    request: {type: object, properties: {permissions: {type: array, items: {type: string}}, resource: {type: string}, role: {type: string}}}
    response: {type: object, properties: {details: {type: array, items: {type: object}}}}
    behavior:
      - call: auth-properties.get-read-consistency-level
        as: cl
      - call: query-processor.process-query-string
        input: {query: "SELECT role, resource, permissions FROM system_auth.role_permissions", consistency: "= vars.cl.value.consistency"}
      - call: auth-keyspace.role-permissions-query
        input: {role: "= input.role", resource: "= input.resource"}
        as: rows
      - set: {vars.details: []}
      - foreach: "= vars.rows.value"
        as: row
        steps:
          - set: {vars.details: "= vars.details + vars.row.permissions.filter(p, p in input.permissions).map(p, {'role': vars.row.role, 'resource': vars.row.resource, 'permission': p})"}
      - return: {details: "= vars.details"}
  - component: cassandra-authorizer
    name: revoke-all-from
    kind: function
    summary: "revokeAllFrom (DROP ROLE): read the role's resources, then delete its index entries and role_permissions rows in one logged batch. Failures are logged and swallowed."
    sources: [src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:135-170]
    request: {type: object, properties: {role: {type: string, default: bob}}}
    behavior:
      - call: auth-properties.get-read-consistency-level
        as: cl
      - call: query-processor.process-query-string
        input: {query: "SELECT resource FROM system_auth.role_permissions WHERE role = ?", consistency: "= vars.cl.value.consistency"}
        as: sel
        on_error: continue
      - if: "!vars.sel.ok"
        then:
          - title: Failure logged - permissions of the dropped role are left behind
            source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:166-169
            set: {ctx.revoke_all_from_failed: true}
          - return: {}
      - call: auth-keyspace.role-permissions-query
        input: {role: "= input.role", resource: ""}
        as: rows
      - title: executeLoggedBatch at auth_write_consistency_level
        source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:435-441
        call: auth-properties.get-write-consistency-level
        as: wcl
      - call: query-processor.process-batch
        input: {statement: {type: BATCH, keyspace: system_auth, table: role_permissions}, options: {consistency: "= vars.wcl.value.consistency"}, client_state: {user: system, is_super: true}}
        fill: true
        as: batch
        on_error: continue
      - when: "vars.batch.ok"
        foreach: "= vars.rows.value"
        as: r
        steps:
          - call: auth-keyspace.role-permissions-delete
            input: {role: "= vars.r.role", resource: "= vars.r.resource"}
  - component: cassandra-authorizer
    name: revoke-all-on
    kind: function
    summary: "revokeAllOn (DROP KEYSPACE/TABLE/FUNCTION/ROLE): read the roles holding permissions on the resource from the index, then delete them in one logged batch. Failures are logged and swallowed."
    sources: [src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:175-208]
    request: {type: object, properties: {resource: {type: string, default: data/shop}}}
    behavior:
      - call: auth-properties.get-read-consistency-level
        as: cl
      - call: query-processor.process-query-string
        input: {query: "SELECT role FROM system_auth.resource_role_permissons_index WHERE resource = ?", consistency: "= vars.cl.value.consistency"}
        as: sel
        on_error: continue
      - if: "!vars.sel.ok"
        then:
          - source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:204-207
            title: Failure logged - stale permissions remain
            set: {ctx.revoke_all_on_failed: true}
          - return: {}
      - call: auth-keyspace.role-permissions-query
        input: {role: "", resource: "= input.resource"}
        as: rows
      - title: executeLoggedBatch at auth_write_consistency_level
        source: src/java/org/apache/cassandra/auth/CassandraAuthorizer.java:435-441
        call: auth-properties.get-write-consistency-level
        as: wcl
      - call: query-processor.process-batch
        input: {statement: {type: BATCH, keyspace: system_auth, table: role_permissions}, options: {consistency: "= vars.wcl.value.consistency"}, client_state: {user: system, is_super: true}}
        fill: true
        as: batch
        on_error: continue
      - when: "vars.batch.ok"
        foreach: "= vars.rows.value"
        as: r
        steps:
          - call: auth-keyspace.role-permissions-delete
            input: {role: "= vars.r.role", resource: "= vars.r.resource"}
      - set: {ctx.revoked_all_on: "= input.resource"}

  - component: auth-schema-change-listener
    name: on-drop-keyspace
    kind: function
    summary: "onDropKeyspace: revoke all permissions on data/<ks>, data/<ks>/* and functions/<ks>."
    sources: [src/java/org/apache/cassandra/auth/AuthSchemaChangeListener.java:32-38]
    request: {type: object, properties: {keyspace: {type: string}}}
    behavior:
      - call: auth-config.get-backends
        as: b
      - foreach: "= ['data/' + input.keyspace, 'data/' + input.keyspace + '/*', 'functions/' + input.keyspace]"
        as: r
        steps:
          - call: "= vars.b.value.authorizer_component + '.revoke-all-on'"
            targets: [cassandra-authorizer.revoke-all-on, allow-all-authorizer.revoke-all-on]
            input: {resource: "= vars.r"}
  - component: auth-schema-change-listener
    name: on-drop-table
    kind: function
    summary: "onDropTable: revoke all permissions on data/<ks>/<table>."
    sources: [src/java/org/apache/cassandra/auth/AuthSchemaChangeListener.java:40-44]
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}}}
    behavior:
      - call: auth-config.get-backends
        as: b
      - call: "= vars.b.value.authorizer_component + '.revoke-all-on'"
        targets: [cassandra-authorizer.revoke-all-on, allow-all-authorizer.revoke-all-on]
        input: {resource: "= 'data/' + input.keyspace + '/' + input.table"}
  - component: auth-schema-change-listener
    name: on-drop-function
    kind: function
    summary: "onDropFunction / onDropAggregate: revoke all permissions on the function resource."
    sources: [src/java/org/apache/cassandra/auth/AuthSchemaChangeListener.java:46-58]
    request: {type: object, properties: {keyspace: {type: string}, name: {type: string}}}
    behavior:
      - call: auth-config.get-backends
        as: b
      - call: "= vars.b.value.authorizer_component + '.revoke-all-on'"
        targets: [cassandra-authorizer.revoke-all-on, allow-all-authorizer.revoke-all-on]
        input: {resource: "= 'functions/' + input.keyspace + '/' + input.name"}

  # ========================================================= role manager
  - component: cassandra-role-manager
    name: consistency-for-role-read
    kind: function
    summary: "QUORUM for the default 'cassandra' role, auth_read_consistency_level (LOCAL_QUORUM) for every other role."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:721-726]
    latency_ms: 0
    request: {type: object, properties: {role: {type: string, default: alice}}}
    response: {type: object, properties: {consistency: {type: string}}}
    behavior:
      - if: "input.role == 'cassandra'"
        then: [{return: {consistency: QUORUM}}]
      - call: auth-properties.get-read-consistency-level
        as: cl
      - return: {consistency: "= vars.cl.value.consistency"}
  - component: cassandra-role-manager
    name: consistency-for-role-write
    kind: function
    summary: "QUORUM for the default 'cassandra' role, auth_write_consistency_level (EACH_QUORUM) for every other role."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:713-719]
    latency_ms: 0
    request: {type: object, properties: {role: {type: string, default: alice}}}
    response: {type: object, properties: {consistency: {type: string}}}
    behavior:
      - if: "input.role == 'cassandra'"
        then: [{return: {consistency: QUORUM}}]
      - call: auth-properties.get-write-consistency-level
        as: cl
      - return: {consistency: "= vars.cl.value.consistency"}
  - component: cassandra-role-manager
    name: get-role
    kind: function
    summary: "getRole: the prepared SELECT * FROM system_auth.roles WHERE role = ? at consistencyForRoleRead; Roles.nullRole() when absent. Read failures propagate."
    sources:
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:544-559
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:101-120
    request: {type: object, properties: {role: {type: string, default: alice}}}
    response: SchemaAuthRole
    errors: [{code: unavailable, status: 4096}, {code: read-timeout, status: 4608}]
    behavior:
      - call: cassandra-role-manager.consistency-for-role-read
        input: {role: "= input.role"}
        as: cl
      - call: select-statement.execute
        input: {statement: {type: SELECT, keyspace: system_auth, table: roles, partition_keys: [{partition_key: "= input.role", token: 0}]}, options: {consistency: "= vars.cl.value.consistency"}, client_state: {user: system, is_super: true}}
        fill: true
      - set: {ctx.role_read_consistency: "= vars.cl.value.consistency"}
      - call: auth-keyspace.roles-get
        input: {key: "= input.role"}
        as: row
      - if: "has(vars.row.value.missing)"
        then:
          - title: Roles.nullRole()
            source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:554-555
            return: {role: "", is_superuser: false, can_login: false, member_of: [], is_null: true}
      - return: {role: "= vars.row.value.role", is_superuser: "= vars.row.value.is_superuser", can_login: "= vars.row.value.can_login", member_of: "= vars.row.value.member_of", is_null: false}
  - component: cassandra-role-manager
    name: get-role-details
    kind: function
    summary: "getRoleDetails: the role plus every role reachable through member_of (collectRoles, recursive, each visited once). The RolesCache loader."
    description: The model follows memberships two levels deep.
    sources:
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:367-374
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:522-542
    request: {type: object, properties: {role: {type: string, default: alice}}}
    response: {type: object, properties: {roles: {type: array, items: {$ref: SchemaAuthRole}}}}
    behavior:
      - call: cassandra-role-manager.get-role
        input: {role: "= input.role"}
        as: r
      - if: "vars.r.value.is_null"
        then: [{return: {roles: []}}]
      - set: {vars.roles: "= [vars.r.value]", vars.seen: "= [input.role]"}
      - foreach: "= vars.r.value.member_of"
        as: m
        steps:
          - if: "!(vars.m in vars.seen)"
            then:
              - call: cassandra-role-manager.get-role
                input: {role: "= vars.m"}
                as: g
              - set: {vars.seen: "= vars.seen + [vars.m]", vars.roles: "= vars.g.value.is_null ? vars.roles : vars.roles + [vars.g.value]"}
              - foreach: "= vars.g.value.member_of"
                as: m2
                steps:
                  - if: "!(vars.m2 in vars.seen)"
                    then:
                      - call: cassandra-role-manager.get-role
                        input: {role: "= vars.m2"}
                        as: g2
                      - set: {vars.seen: "= vars.seen + [vars.m2]", vars.roles: "= vars.g2.value.is_null ? vars.roles : vars.roles + [vars.g2.value]"}
      - return: {roles: "= vars.roles"}
  - component: cassandra-role-manager
    name: get-roles
    kind: function
    summary: "getRoles(grantee, includeInherited): role names; without inheritance the role plus its direct member_of."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:356-365]
    request: {type: object, properties: {role: {type: string, default: alice}, include_inherited: {type: boolean, default: true}}}
    response: {type: object, properties: {roles: {type: array, items: {type: string}}}}
    behavior:
      - if: "input.include_inherited"
        then:
          - call: cassandra-role-manager.get-role-details
            input: {role: "= input.role"}
            as: d
          - return: {roles: "= vars.d.value.roles.map(x, x.role)"}
      - call: cassandra-role-manager.get-role
        input: {role: "= input.role"}
        as: r
      - return: {roles: "= vars.r.value.is_null ? [] : [input.role] + vars.r.value.member_of"}
  - component: cassandra-role-manager
    name: get-all-roles
    kind: function
    summary: getAllRoles - SELECT role FROM system_auth.roles hard-coded at QUORUM.
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:376-390]
    response: {type: object, properties: {roles: {type: array, items: {type: string}}}}
    behavior:
      - call: query-processor.process-query-string
        input: {query: "SELECT role from system_auth.roles", consistency: QUORUM}
      - call: auth-keyspace.roles-query
        as: rows
      - return: {roles: "= vars.rows.value.map(r, r.role)"}
  - component: cassandra-role-manager
    name: is-existing-role
    kind: function
    summary: isExistingRole - getRole is not the null role.
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:423-426]
    request: {type: object, properties: {role: {type: string, default: bob}}}
    response: {type: object, properties: {exists: {type: boolean}}}
    behavior:
      - call: cassandra-role-manager.get-role
        input: {role: "= input.role"}
        as: r
      - return: {exists: "= !vars.r.value.is_null"}
  - component: cassandra-role-manager
    name: is-super
    kind: function
    summary: "isSuper(role): the role's own is_superuser column (no inheritance, unlike Roles.hasSuperuserStatus); read failures become UnauthorizedException."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:392-403]
    request: {type: object, properties: {role: {type: string, default: alice}}}
    response: {type: object, properties: {is_super: {type: boolean}}}
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: cassandra-role-manager.get-role
        input: {role: "= input.role"}
        as: r
        on_error:
          - source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:398-402
            fail: {code: unauthorized, status: 8448, message: "= 'Unable to perform authorization of super-user permission: ' + error.message"}
      - return: {is_super: "= vars.r.value.is_superuser"}
  - component: cassandra-role-manager
    name: can-login
    kind: function
    summary: canLogin(role) - the role's own can_login column; read failures become UnauthorizedException.
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:405-416]
    request: {type: object, properties: {role: {type: string, default: alice}}}
    response: {type: object, properties: {can_login: {type: boolean}}}
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: cassandra-role-manager.get-role
        input: {role: "= input.role"}
        as: r
        on_error:
          - source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:411-415
            fail: {code: unauthorized, status: 8448, message: "= 'Unable to perform authorization of login permission: ' + error.message"}
      - return: {can_login: "= vars.r.value.can_login"}
  - component: cassandra-role-manager
    name: create-role
    kind: function
    summary: "createRole: refuse when identities already map to the role, then INSERT INTO system_auth.roles (role, is_superuser, can_login[, salted_hash]) at consistencyForRoleWrite (EACH_QUORUM; QUORUM for 'cassandra')."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:263-286]
    request: {type: object, properties: {performer: {type: string}, role: {type: string, default: bob}, options: {$ref: SchemaAuthRoleOptions}}}
    errors: [{code: unavailable, status: 4096}, {code: write-timeout, status: 4352}]
    behavior:
      - call: cassandra-role-manager.consistency-for-role-read
        input: {role: "= input.role"}
        as: rcl
      - title: identitiesForRole - SELECT identity FROM system_auth.identity_to_role (no identities in this model)
        source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:266-270
        call: query-processor.process-query-string
        input: {query: "SELECT identity FROM system_auth.identity_to_role WHERE role = ? ALLOW FILTERING", consistency: "= vars.rcl.value.consistency"}
      - call: cassandra-role-manager.consistency-for-role-write
        input: {role: "= input.role"}
        as: wcl
      - title: INSERT INTO system_auth.roles at consistencyForRoleWrite
        source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:271-285
        call: query-processor.process-query-string
        input: {query: "INSERT INTO system_auth.roles (role, is_superuser, can_login, salted_hash) VALUES (...)", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.roles-put
        input:
          key: "= input.role"
          row: {role: "= input.role", is_superuser: "= input.options.superuser", can_login: "= input.options.login", salted_hash: "= input.options.password == '' ? '' : 'bcrypt:' + input.options.password", member_of: [], password_updated_at: "= now"}
      - set: {ctx.role_write_consistency: "= vars.wcl.value.consistency"}
  - component: cassandra-role-manager
    name: drop-role
    kind: function
    summary: "dropRole: DELETE the roles row at consistencyForRoleWrite, remove the role from every member's member_of and delete its role_members partition, and remove its identities."
    sources:
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:288-297
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:604-625
    request: {type: object, properties: {performer: {type: string}, role: {type: string, default: bob}}}
    behavior:
      - call: cassandra-role-manager.consistency-for-role-write
        input: {role: "= input.role"}
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "DELETE FROM system_auth.roles WHERE role = ?", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.roles-delete
        input: {key: "= input.role"}
      - call: cassandra-role-manager.consistency-for-role-read
        input: {role: "= input.role"}
        as: rcl
      - title: removeAllMembers - SELECT member FROM role_members WHERE role = ?
        source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:607-613
        call: query-processor.process-query-string
        input: {query: "SELECT member FROM system_auth.role_members WHERE role = ?", consistency: "= vars.rcl.value.consistency"}
      - call: auth-keyspace.role-members-query
        input: {role: "= input.role"}
        as: members
      - foreach: "= vars.members.value"
        as: mem
        steps:
          - call: cassandra-role-manager.modify-role-membership
            input: {grantee: "= vars.mem.member", role: "= input.role", op: "-"}
          - call: auth-keyspace.role-members-delete
            input: {role: "= input.role", member: "= vars.mem.member"}
  - component: cassandra-role-manager
    name: alter-role
    kind: function
    summary: "alterRole: rate-limit password changes, then UPDATE system_auth.roles SET <options> at consistencyForRoleWrite."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:299-316]
    request: {type: object, properties: {performer: {type: string}, role: {type: string, default: alice}, options: {$ref: SchemaAuthRoleOptions}}}
    errors: [{code: overloaded, status: 4097}]
    behavior:
      - when: "input.options.password != ''"
        call: cassandra-role-manager.enforce-password-update-rate-limit
        input: {performer: "= input.performer", role: "= input.role"}
      - call: cassandra-role-manager.consistency-for-role-write
        input: {role: "= input.role"}
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "UPDATE system_auth.roles SET ... WHERE role = ?", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.roles-get
        input: {key: "= input.role"}
        as: row
      - call: auth-keyspace.roles-put
        input:
          key: "= input.role"
          row:
            role: "= input.role"
            is_superuser: "= input.options.superuser_set ? input.options.superuser : vars.row.value.is_superuser"
            can_login: "= input.options.login_set ? input.options.login : vars.row.value.can_login"
            salted_hash: "= input.options.password != '' ? 'bcrypt:' + input.options.password : vars.row.value.salted_hash"
            member_of: "= vars.row.value.member_of"
            password_updated_at: "= input.options.password != '' ? now : vars.row.value.password_updated_at"
  - component: cassandra-role-manager
    name: enforce-password-update-rate-limit
    kind: function
    summary: "A role's password may change at most every cassandra.role_password_update_min_interval_in_ms (5000 ms): the salted_hash writetime is read at consistencyForRole (QUORUM for 'cassandra', LOCAL_ONE otherwise)."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:655-688]
    request: {type: object, properties: {performer: {type: string}, role: {type: string}}}
    errors: [{code: overloaded, status: 4097}]
    behavior:
      - call: select-statement.execute
        input: {statement: {type: SELECT, keyspace: system_auth, table: roles, partition_keys: [{partition_key: "= input.role", token: 0}]}, options: {consistency: "= input.role == 'cassandra' ? 'QUORUM' : 'LOCAL_ONE'"}, client_state: {user: system, is_super: true}}
        fill: true
      - call: auth-keyspace.roles-get
        input: {key: "= input.role"}
        as: row
      - if: "!has(vars.row.value.missing) && vars.row.value.password_updated_at > 0 && now - vars.row.value.password_updated_at <= config['role-password-update-min-interval-ms']"
        then:
          - title: Password changed too recently - OverloadedException
            source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:684-686
            fail: {code: overloaded, status: 4097, message: "= 'Password for role ' + input.role + ' can only be changed every ' + string(int(config['role-password-update-min-interval-ms'])) + 'ms.'"}
  - component: cassandra-role-manager
    name: grant-role
    kind: function
    summary: "grantRole: refuse when the grantee already has the role or when granting would create a cycle; add the role to the grantee's member_of and record the membership."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:318-337]
    request: {type: object, properties: {performer: {type: string}, role: {type: string, default: analyst}, grantee: {type: string, default: bob}}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: cassandra-role-manager.get-roles
        input: {role: "= input.grantee", include_inherited: true}
        as: gr
      - if: "input.role in vars.gr.value.roles"
        then:
          - source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:321-324
            title: Grantee is already a member
            fail: {code: invalid, status: 8704, message: "= input.grantee + ' is a member of ' + input.role"}
      - call: cassandra-role-manager.get-roles
        input: {role: "= input.role", include_inherited: true}
        as: rr
      - if: "input.grantee in vars.rr.value.roles"
        then:
          - title: Circular grant
            source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:325-328
            fail: {code: invalid, status: 8704, message: "= input.role + ' is a member of ' + input.grantee"}
      - call: cassandra-role-manager.modify-role-membership
        input: {grantee: "= input.grantee", role: "= input.role", op: "+"}
      - call: cassandra-role-manager.consistency-for-role-write
        input: {role: "= input.role"}
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "INSERT INTO system_auth.role_members (role, member) values (...)", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.role-members-put
        input: {role: "= input.role", member: "= input.grantee"}
  - component: cassandra-role-manager
    name: revoke-role
    kind: function
    summary: "revokeRole: refuse unless the revokee directly holds the role; remove it from member_of and delete the membership."
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:339-354]
    request: {type: object, properties: {performer: {type: string}, role: {type: string, default: analyst}, grantee: {type: string, default: alice}}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: cassandra-role-manager.get-roles
        input: {role: "= input.grantee", include_inherited: false}
        as: gr
      - if: "!(input.role in vars.gr.value.roles)"
        then:
          - source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:342-345
            fail: {code: invalid, status: 8704, message: "= input.grantee + ' is not a member of ' + input.role"}
      - call: cassandra-role-manager.modify-role-membership
        input: {grantee: "= input.grantee", role: "= input.role", op: "-"}
      - call: cassandra-role-manager.consistency-for-role-write
        input: {role: "= input.role"}
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "DELETE FROM system_auth.role_members WHERE role = ? and member = ?", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.role-members-delete
        input: {role: "= input.role", member: "= input.grantee"}
  - component: cassandra-role-manager
    name: modify-role-membership
    kind: function
    summary: modifyRoleMembership - UPDATE system_auth.roles SET member_of = member_of +/- {role} WHERE role = grantee at consistencyForRoleWrite(grantee).
    sources: [src/java/org/apache/cassandra/auth/CassandraRoleManager.java:561-574]
    request: {type: object, properties: {grantee: {type: string}, role: {type: string}, op: {type: string, enum: ["+", "-"]}}}
    behavior:
      - call: cassandra-role-manager.consistency-for-role-write
        input: {role: "= input.grantee"}
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "= 'UPDATE system_auth.roles SET member_of = member_of ' + input.op + ' {...} WHERE role = ?'", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.roles-get
        input: {key: "= input.grantee"}
        as: row
      - when: "!has(vars.row.value.missing)"
        call: auth-keyspace.roles-put
        input:
          key: "= input.grantee"
          row:
            role: "= vars.row.value.role"
            is_superuser: "= vars.row.value.is_superuser"
            can_login: "= vars.row.value.can_login"
            salted_hash: "= vars.row.value.salted_hash"
            password_updated_at: "= vars.row.value.password_updated_at"
            member_of: "= input.op == '+' ? vars.row.value.member_of + [input.role] : vars.row.value.member_of.filter(x, x != input.role)"
  - component: cassandra-role-manager
    name: schedule-setup-task
    kind: function
    summary: "setup() schedules a self-recurring task after cassandra.superuser_setup_delay_ms (10 s): when it is safe to read, create the default superuser; on any failure (or when not yet safe) reschedule."
    sources:
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:164-173
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:485-505
    response: {type: object, properties: {done: {type: boolean}}}
    behavior:
      - if: "has(ctx.setup_done) && ctx.setup_done"
        then:
          - title: The task succeeded earlier and was not rescheduled
            return: {done: true}
      - call: storage-proxy.is-safe-to-perform-read
        as: safe
      - if: "!vars.safe.value.safe"
        then:
          - title: Not safe to perform reads yet - reschedule
            source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:489-494
            set: {ctx.setup_rescheduled: "= has(ctx.setup_rescheduled) ? ctx.setup_rescheduled + 1 : 1"}
          - return: {done: false}
      - call: cassandra-role-manager.setup-default-role
        as: d
        on_error:
          - title: Setup task failed with error, rescheduling
            source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:499-503
            set: {ctx.setup_rescheduled: "= has(ctx.setup_rescheduled) ? ctx.setup_rescheduled + 1 : 1"}
          - return: {done: false}
      - set: {ctx.setup_done: true}
      - return: {done: true}
  - component: cassandra-role-manager
    name: setup-default-role
    kind: function
    summary: "setupDefaultRole: if no role exists (the 'cassandra' row at ONE, then at QUORUM, then any row at QUORUM), insert 'cassandra'/'cassandra' as a login superuser at QUORUM USING TIMESTAMP 0. Read failures propagate (some nodes were not ready)."
    sources:
      - src/java/org/apache/cassandra/auth/CassandraRoleManager.java:443-483
    errors: [{code: unavailable, status: 4096}]
    behavior:
      - title: hasExistingRoles - 'cassandra' at ONE
        source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:478-482
        call: query-processor.process-query-string
        input: {query: "SELECT * FROM system_auth.roles WHERE role = 'cassandra'", consistency: ONE}
      - call: auth-keyspace.roles-query
        as: rows
      - if: "size(vars.rows.value) == 0"
        then:
          - title: then 'cassandra' at QUORUM and any role (LIMIT 1) at QUORUM
            source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:481-482
            call: query-processor.process-query-string
            input: {query: "SELECT * FROM system_auth.roles LIMIT 1", consistency: QUORUM}
          - title: Create the default superuser at QUORUM, USING TIMESTAMP 0
            source: src/java/org/apache/cassandra/auth/CassandraRoleManager.java:450-455
            call: query-processor.process-query-string
            input: {query: "INSERT INTO system_auth.roles (role, is_superuser, can_login, salted_hash) VALUES ('cassandra', true, true, '...') USING TIMESTAMP 0", consistency: QUORUM}
          - call: auth-keyspace.roles-put
            input: {key: cassandra, row: {role: cassandra, is_superuser: true, can_login: true, salted_hash: "bcrypt:cassandra", member_of: [], password_updated_at: 0}}
          - set: {ctx.default_superuser_created: true}
      - return: {}

  # ===================================================== role statements
  - component: create-role-statement
    name: authorize
    kind: function
    summary: "CREATE on all roles; creating a superuser role requires being a superuser (the anonymous user never is)."
    sources: [src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:50-58]
    request: SchemaAuthRoleStatement
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: authentication-statement.check-permission
        input: {user: "= input.user", permission: CREATE, resource: roles}
      - if: "input.options.superuser_set && input.options.superuser"
        then:
          - call: authenticated-user.is-super
            input: {user: "= input.user"}
            as: su
          - if: "!vars.su.value.is_super"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:55-56
                fail: {code: unauthorized, status: 8448, message: Only superusers can create a role with superuser status}
      - return: {}
  - component: create-role-statement
    name: validate
    kind: function
    summary: "validate: options valid, non-empty name, then ensureNotAnonymous (so under the deployed AllowAllAuthenticator every CREATE ROLE stops here), then refuse an existing role unless IF NOT EXISTS."
    sources: [src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:60-82]
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - if: "input.role == ''"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:64-65
            fail: {code: invalid, status: 8704, message: "Role name can't be an empty string"}
      - title: ensureNotAnonymous before any existence check (avoids leaking role names)
        source: src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:77-78
        call: client-state.ensure-not-anonymous
      - if: "!input.if_not_exists"
        then:
          - call: cassandra-role-manager.is-existing-role
            input: {role: "= input.role"}
            as: ex
          - if: "vars.ex.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:80-81
                fail: {code: invalid, status: 8704, message: "= input.role + ' already exists'"}
      - return: {}
  - component: create-role-statement
    name: execute
    kind: function
    summary: "execute: IF NOT EXISTS on an existing role does nothing; otherwise create the role, set datacenters when the network authorizer requires it, set CIDR groups, and grant the creator ALTER, DROP, AUTHORIZE and DESCRIBE on the new role."
    sources: [src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:84-130]
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    errors: [{code: unavailable, status: 4096}, {code: write-timeout, status: 4352}]
    behavior:
      - if: "input.if_not_exists"
        then:
          - call: cassandra-role-manager.is-existing-role
            input: {role: "= input.role"}
            as: ex
          - if: "vars.ex.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:86-88
                title: Role exists - nothing to do
                return: {kind: VOID}
      - call: cassandra-role-manager.create-role
        input: {performer: "= input.user", role: "= input.role", options: "= input.options"}
      - title: Network authorizer does not require authorization (AllowAllNetworkAuthorizer) - no datacenter list
        source: src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:91-94
      - if: "input.user != 'anonymous'"
        then:
          - call: auth-config.get-backends
            as: b
          - title: grantPermissionsToCreator (UnsupportedOperationException ignored)
            source: src/java/org/apache/cassandra/cql3/statements/CreateRoleStatement.java:110-130
            call: "= vars.b.value.authorizer_component + '.grant'"
            targets: [cassandra-authorizer.grant, allow-all-authorizer.grant]
            input: {performer: system, permissions: [ALTER, DROP, AUTHORIZE, DESCRIBE], resource: "= 'roles/' + input.role", grantee: "= input.user"}
            on_error: continue
      - return: {kind: VOID}

  - component: alter-role-statement
    name: authorize
    kind: function
    summary: "No one may change their own superuser status (or that of a role granted to them); only superusers change superuser status, datacenters or CIDR groups; a non-superuser may alter its own alterable options (PASSWORD with PasswordAuthenticator) or needs ALTER on the other role."
    sources: [src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:83-119]
    request: SchemaAuthRoleStatement
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: authenticated-user.is-super
        input: {user: "= input.user"}
        as: su
      - if: "input.options.superuser_set"
        then:
          - call: authenticated-user.get-roles
            input: {user: "= input.user"}
            as: mine
          - if: "input.role in vars.mine.value.roles"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:88-90
                fail: {code: unauthorized, status: 8448, message: "You aren't allowed to alter your own superuser status or that of a role granted to you"}
          - if: "!vars.su.value.is_super"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:92-93
                fail: {code: unauthorized, status: 8448, message: Only superusers are allowed to alter superuser status}
      - if: "vars.su.value.is_super"
        then: [{return: {}}]
      - if: "input.user == input.role"
        then:
          - call: auth-config.get-backends
            as: b
          - if: "input.options.login_set || (input.options.password != '' && vars.b.value.authenticator != 'PasswordAuthenticator')"
            then:
              - title: Option not in IRoleManager.alterableOptions()
                source: src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:106-112
                fail: {code: unauthorized, status: 8448, message: "= \"You aren't allowed to alter \" + (input.options.login_set ? 'LOGIN' : 'PASSWORD')"}
          - return: {}
      - call: authentication-statement.check-permission
        input: {user: "= input.user", permission: ALTER, resource: "= 'roles/' + input.role"}
      - return: {}
  - component: alter-role-statement
    name: validate
    kind: function
    summary: "validate: refuse an empty ALTER, then ensureNotAnonymous, then require the role to exist unless IF EXISTS."
    sources: [src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:57-81]
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - if: "!input.options.superuser_set && !input.options.login_set && input.options.password == ''"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:61-62
            fail: {code: invalid, status: 8704, message: "ALTER [ROLE|USER] can't be empty"}
      - call: client-state.ensure-not-anonymous
      - call: cassandra-role-manager.is-existing-role
        input: {role: "= input.role"}
        as: ex
      - if: "!vars.ex.value.exists && !input.if_exists"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:77-80
            fail: {code: invalid, status: 8704, message: "= 'Role ' + input.role + \" doesn't exist\""}
      - return: {}
  - component: alter-role-statement
    name: execute
    kind: function
    summary: "execute: IF EXISTS on a missing role does nothing; otherwise alter the role's options (and datacenters / CIDR groups when given)."
    sources: [src/java/org/apache/cassandra/cql3/statements/AlterRoleStatement.java:121-136]
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    errors: [{code: overloaded, status: 4097}]
    behavior:
      - if: "input.if_exists"
        then:
          - call: cassandra-role-manager.is-existing-role
            input: {role: "= input.role"}
            as: ex
          - if: "!vars.ex.value.exists"
            then: [{return: {kind: VOID}}]
      - call: cassandra-role-manager.alter-role
        input: {performer: "= input.user", role: "= input.role", options: "= input.options"}
      - return: {kind: VOID}

  - component: drop-role-statement
    name: authorize
    kind: function
    summary: "DROP on the role; dropping an existing superuser role requires being a superuser."
    sources: [src/java/org/apache/cassandra/cql3/statements/DropRoleStatement.java:42-52]
    request: SchemaAuthRoleStatement
    errors: [{code: unauthorized, status: 8448}]
    behavior:
      - call: authentication-statement.check-permission
        input: {user: "= input.user", permission: DROP, resource: "= 'roles/' + input.role"}
