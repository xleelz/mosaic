scenarios:
  - id: create-keyspace-propagates
    flow: create-keyspace
    name: 'CREATE KEYSPACE: applied locally, announced, pushed to both live peers'
    fixtures: [three-node-rf3]
    expect:
      - result.ok && result.value.kind == 'SCHEMA_CHANGE' && result.value.change == 'CREATED' && result.value.target == 'KEYSPACE' && result.value.keyspace == 'inventory'
      - '''keyspace:inventory'' in state[''schema-keyspace@n1''].rows && ''keyspace:inventory'' in state[''schema-keyspace@n2''].rows && ''keyspace:inventory'' in state[''schema-keyspace@n3''].rows'
      - calls_by_instance['keyspace.open@n1'] == 1 && calls_by_instance['keyspace.open@n2'] == 1 && calls_by_instance['keyspace.open@n3'] == 1 && calls['pending-range-calculator-service.calculate-pending-ranges'] == 3
      - calls_by_instance['schema-push-verb-handler.do-verb@n2'] == 1 && calls_by_instance['schema-push-verb-handler.do-verb@n3'] == 1 && ctx.schema_pushed_to == ['n2', 'n3'] && ctx.schema_push_ignored == ['n1']
      - state['schema@n1'].version == state['schema@n2'].version && state['schema@n2'].version == state['schema@n3'].version && state['schema@n1'].version.contains('keyspace:inventory{SimpleStrategy:3}')
      - calls['cassandra-authorizer.grant'] == 0 && calls['allow-all-authorizer.grant'] == 0
  - id: create-keyspace-if-not-exists-noop
    flow: create-keyspace
    name: IF NOT EXISTS on an existing keyspace returns Void and changes nothing
    fixtures: [three-node-rf3]
    input:
      statement: {keyspace: shop, if_not_exists: true}
    expect:
      - result.ok && result.value.kind == 'VOID'
      - calls['schema-keyspace.apply-changes'] == 0 && calls['migration-coordinator.announce'] == 0 && calls['migration-coordinator.push-schema-mutations'] == 0
  - id: create-keyspace-already-exists
    flow: create-keyspace
    name: An existing keyspace without IF NOT EXISTS is AlreadyExists
    fixtures: [three-node-rf3]
    input:
      statement: {keyspace: shop}
    expect:
      - '!result.ok && result.error.code == ''already-exists'' && result.error.status == 9216'
      - calls['schema-keyspace.apply-changes'] == 0
  - id: create-keyspace-missing-replication
    flow: create-keyspace
    name: REPLICATION is mandatory
    fixtures: [three-node-rf3]
    input:
      statement:
        replication: {class: ''}
    expect:
      - '!result.ok && result.error.code == ''invalid'' && result.error.message == "Missing mandatory option ''replication''"'
  - id: create-keyspace-local-strategy
    flow: create-keyspace
    name: LocalStrategy is reserved
    fixtures: [three-node-rf3]
    input:
      statement:
        replication: {class: LocalStrategy}
    expect:
      - '!result.ok && result.error.status == 8704 && result.error.message.contains(''LocalStrategy is reserved'')'
  - id: create-keyspace-system-keyspace
    flow: create-keyspace
    name: Local system keyspaces are refused before the transformation
    fixtures: [three-node-rf3]
    input:
      statement: {keyspace: system_schema}
    expect:
      - '!result.ok && result.error.code == ''invalid'' && result.error.message.contains(''is not user-modifiable'')'
      - calls['schema.transform'] == 0
  - id: create-keyspace-invalid-name
    flow: create-keyspace
    name: Keyspace names are alphanumeric and underscore only
    fixtures: [three-node-rf3]
    input:
      statement: {keyspace: bad-name}
    expect:
      - '!result.ok && result.error.code == ''invalid'' && result.error.message.startsWith(''Keyspace name must not be empty'')'
  - id: create-keyspace-push-lost
    flow: create-keyspace
    name: A lost SCHEMA_PUSH_REQ does not fail the statement; that peer stays behind until it pulls
    fixtures: [three-node-rf3]
    faults:
      - {target: schema-push-verb-handler.do-verb, instance: n2, type: unavailable}
    expect:
      - result.ok && result.value.kind == 'SCHEMA_CHANGE'
      - '!(''keyspace:inventory'' in state[''schema-keyspace@n2''].rows) && ''keyspace:inventory'' in state[''schema-keyspace@n3''].rows'
      - faults == 1 && ctx.schema_pushed_to == ['n2', 'n3']
  - id: create-keyspace-mixed-version-peer
    flow: create-keyspace
    name: A peer on another messaging version is not pushed to
    fixtures: [three-node-rf3]
    state:
      migration-coordinator@n1:
        peers:
          n3: {messaging_version: 12}
    expect:
      - result.ok && calls['schema-push-verb-handler.do-verb'] == 1 && ctx.schema_pushed_to == ['n2'] && 'n3' in ctx.schema_push_ignored
      - '!(''keyspace:inventory'' in state[''schema-keyspace@n3''].rows)'
  - id: create-keyspace-execute-locally
    name: executeLocally applies without announcing or pushing
    fixtures: [three-node-rf3]
    expect:
      - result.ok && result.value.kind == 'SCHEMA_CHANGE' && 'keyspace:inventory' in state['schema-keyspace@n1'].rows
      - calls['migration-coordinator.announce'] == 0 && calls['migration-coordinator.push-schema-mutations'] == 0 && !('keyspace:inventory' in state['schema-keyspace@n2'].rows)
    steps:
      - interface: alter-schema-statement.execute-locally
        caller: cql
        input:
          statement:
            type: CREATE_KEYSPACE
            keyspace: inventory
            replication: {class: SimpleStrategy, replication_factor: 3}
