  - component: alter-keyspace-statement
    name: apply
    kind: function
    summary: "AlterKeyspaceStatement.apply: swap the replication params; refuse LocalStrategy, range movements in progress, and unsafe transient changes. Increasing RF warns that a full repair is needed."
    description: "authorize() requires ALTER on the keyspace (AlterKeyspaceStatement.java:104-107). Range movements are read from gossip (membership); the model takes them as a choice."
    sources:
      - src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:69-97
      - src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:109-143
    request: SchemaAuthSchemaStatement
    response: SchemaAuthTransformation
    errors: [{code: invalid, status: 8704}, {code: config-error, status: 8960}]
    behavior:
      - call: schema-keyspace.rows-get
        input: {key: "= 'keyspace:' + input.keyspace"}
        as: ks
      - if: "has(vars.ks.value.missing)"
        then:
          - if: "input.if_exists"
            then: [{return: {mutations: [], warnings: [], created_resources: []}}]
          - source: src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:74-78
            title: Keyspace doesn't exist
            fail: {code: invalid, status: 8704, message: "= \"Keyspace '\" + input.keyspace + \"' doesn't exist\""}
      - if: "input.replication.class == 'LocalStrategy'"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:86-87
            fail: {code: invalid, status: 8704, message: "Unable to use given strategy class: LocalStrategy is reserved for internal use."}
      - choice: range_movements
        default: none
        options:
          none:
            - title: validateNoRangeMovements - every live or unreachable endpoint is NORMAL
              source: src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:126-143
          in_progress:
            - title: An endpoint is joining, leaving or moving
              source: src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:139-142
              fail: {code: config-error, status: 8960, message: "Cannot alter RF while some endpoints are not in normal state (no range movements)"}
      - set:
          vars.sig: "= 'keyspace:' + input.keyspace + '{' + input.replication.class + ':' + string(input.replication.replication_factor) + '}'"
      - if: "vars.sig == vars.ks.value.sig"
        then:
          - title: Same params - empty diff
            return: {mutations: [], warnings: [], created_resources: []}
      - title: clientWarnings - RF increase needs a full repair
        source: src/java/org/apache/cassandra/cql3/statements/schema/AlterKeyspaceStatement.java:109-124
        set:
          vars.warnings: "= input.replication.replication_factor > vars.ks.value.def.replication_factor ? ['When increasing replication factor you need to run a full (-full) repair to distribute the data.'] : []"
      - return:
          mutations:
            - {op: put, kind: keyspace, keyspace: "= input.keyspace", name: "= input.keyspace", def: "= input.replication", sig: "= vars.sig"}
          warnings: "= vars.warnings"
          event: {change: UPDATED, target: KEYSPACE, keyspace: "= input.keyspace", name: ""}
          created_resources: []

