            fail: {code: invalid, status: 8704, message: "= input.grantee + \" doesn't exist\""}
      - return: {}
  - component: grant-role-statement
    name: execute
    kind: function
    summary: GRANT role TO grantee - roleManager.grantRole.
    sources: [src/java/org/apache/cassandra/cql3/statements/GrantRoleStatement.java:38-42]
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    errors: [{code: invalid, status: 8704}]
