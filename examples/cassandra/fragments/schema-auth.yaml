    summary: "DropAggregateStatement.apply: the aggregate must exist (IF EXISTS otherwise) and be unambiguous."
    description: "authorize() requires DROP on each matching aggregate (DropAggregateStatement.java:123-134)."
    sources: [src/java/org/apache/cassandra/cql3/statements/schema/DropAggregateStatement.java:67-121]
