        input: {}
        as: digest
      - title: reset(true) -> reload() -> updateSchema(update, false)
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:273-288
        call: default-schema-update-handler.update-schema
        input: {version: "= vars.digest.value.version", diff: [], locally: false}
      - return: {}
  - component: partition-denylist
    name: is-key-permitted
    kind: function
    summary: "isKeyPermitted: true unless partition_denylist_enabled and the key is in the table's denylist entry. Callers in StorageProxy also check the enabled flag first."
    sources: [src/java/org/apache/cassandra/schema/PartitionDenylist.java:302-329]
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}, partition_key: {type: string}}}
    response: {type: object, properties: {permitted: {type: boolean, default: true}}}
    store: {table: denied, op: get, key: "= input.keyspace + '.' + input.table + ':' + input.partition_key", default: {permitted: true}}
  - component: partition-denylist
    name: get-denied-keys-in-range-count
    kind: function
    summary: getDeniedKeysInRangeCount - denylisted keys of a table inside a token range (0 when disabled).
    sources: [src/java/org/apache/cassandra/schema/PartitionDenylist.java:343-370]
    request: {type: object, properties: {keyspace: {type: string}, table: {type: string}}}
    response: {type: object, properties: {count: {type: integer}}}
    store: {table: denied_ranges, op: get, key: "= input.keyspace + '.' + input.table", default: {count: 0}}
  - component: password-authenticator
    name: evaluate-response
    kind: function
    summary: "The connection's SaslNegotiator.evaluateResponse as transport calls it: split the SASL PLAIN token (NUL rendered as \\0) and hand it to PlainTextSaslAuthenticator."
    sources:
      - src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:236-239
      - src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:253-258
    request: {type: object, properties: {token: {type: string, default: "\\0alice\\0s3cret"}}}
    response: {type: object, properties: {complete: {type: boolean, default: true}, challenge: {type: string, default: ""}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - set: {vars.parts: "= input.token.split('\\\\0')"}
      - set:
          vars.user: "= size(vars.parts) >= 2 ? vars.parts[size(vars.parts) - 2] : ''"
          vars.pass: "= size(vars.parts) >= 1 ? vars.parts[size(vars.parts) - 1] : ''"
      - call: password-authenticator-plain-text-sasl-authenticator.evaluate-response
        input: {username: "= vars.user", password: "= vars.pass"}
      - set: {state.username: "= vars.user", state.password: "= vars.pass"}
      - return: {complete: true, challenge: ""}
  - component: password-authenticator
    name: get-authenticated-user
    kind: function
    summary: "The connection's SaslNegotiator.getAuthenticatedUser as transport calls it: authenticate the credentials decoded by evaluate-response."
    sources: [src/java/org/apache/cassandra/auth/PasswordAuthenticator.java:265-270]
    response: {type: object, properties: {user: {type: string, examples: [alice]}}}
    errors: [{code: bad-credentials, status: 256}]
    behavior:
      - call: password-authenticator-plain-text-sasl-authenticator.get-authenticated-user
        input: {username: "= has(state.username) ? state.username : ''", password: "= has(state.password) ? state.password : ''", complete: "= has(state.username)"}
        as: u
      - return: "= vars.u.value"
  - component: cidr-groups-mapping-manager
    name: update-cidr-group
    kind: jmx
    summary: "CIDRGroupsMappingManagerMBean.updateCidrGroup: validate each CIDR, then UPDATE system_auth.cidr_groups at auth_write_consistency_level. Works even with AllowAllCIDRAuthorizer."
    sources:
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManagerMBean.java:51
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:176-191
    request: {type: object, properties: {group: {type: string, examples: [office]}, cidrs: {type: array, items: {type: string}, default: [10.0.0.0/24]}}}
    response: {type: object, properties: {}}
    behavior:
      - call: auth-properties.get-write-consistency-level
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "UPDATE system_auth.cidr_groups SET cidrs = {...} WHERE cidr_group = ?", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.cidr-groups-put
        input: {group: "= input.group", cidrs: "= input.cidrs"}
      - return: {}
  - component: cidr-groups-mapping-manager
    name: drop-cidr-group
    kind: jmx
    summary: "CIDRGroupsMappingManagerMBean.dropCidrGroup: a missing group is a RuntimeException; otherwise DELETE at auth_write_consistency_level."
    sources:
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManagerMBean.java:58
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:206-213
    request: {type: object, properties: {group: {type: string, examples: [office]}}}
    response: {type: object, properties: {}}
    errors: [{code: runtime, status: 0}]
    behavior:
      - call: auth-keyspace.cidr-groups-get
        input: {group: "= input.group"}
        as: g
      - if: "has(vars.g.value.missing)"
        then:
          - source: src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:208-210
            fail: {code: runtime, status: 0, message: "= \"CIDR group '\" + input.group + \"' doesn't exists\""}
      - call: auth-properties.get-write-consistency-level
        as: wcl
      - call: query-processor.process-query-string
        input: {query: "DELETE FROM system_auth.cidr_groups WHERE cidr_group = ?", consistency: "= vars.wcl.value.consistency"}
      - call: auth-keyspace.cidr-groups-delete
        input: {group: "= input.group"}
      - return: {}
  - component: cidr-groups-mapping-manager
    name: load-cidr-groups-cache
    kind: jmx
    summary: "loadCidrGroupsCache delegates to the CIDR authorizer; AllowAllCIDRAuthorizer (deployed) refuses with InvalidRequestException."
    sources:
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManagerMBean.java:78
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:246-249
    request: {type: object, properties: {}}
    response: {type: object, properties: {}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: auth-config.get-backends
        as: b
      - if: "vars.b.value.cidr_authorizer == 'AllowAllCIDRAuthorizer'"
        then:
          - source: src/java/org/apache/cassandra/auth/AllowAllCIDRAuthorizer.java:56-59
            fail: {code: invalid, status: 8704, message: Load CIDR groups cache operation not supported by AllowAllCIDRAuthorizer}
      - set: {ctx.cidr_groups_cache_loaded: true}
      - return: {}
  - component: cidr-permissions-manager
    name: invalidate-cidr-permissions-cache
    kind: jmx
    summary: "invalidateCidrPermissionsCache delegates to the CIDR authorizer; AllowAllCIDRAuthorizer (deployed) refuses with InvalidRequestException."
    sources:
      - src/java/org/apache/cassandra/auth/CIDRPermissionsManagerMBean.java:31
      - src/java/org/apache/cassandra/auth/CIDRPermissionsManager.java:216-219
    request: {type: object, properties: {role: {type: string, default: ""}}}
    response: {type: object, properties: {invalidated: {type: boolean}}}
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: auth-config.get-backends
        as: b
      - if: "vars.b.value.cidr_authorizer == 'AllowAllCIDRAuthorizer'"
        then:
          - source: src/java/org/apache/cassandra/auth/AllowAllCIDRAuthorizer.java:50-53
            fail: {code: invalid, status: 8704, message: Invalidate CIDR permissions cache operation not supported by AllowAllCIDRAuthorizer}
      - return: {invalidated: true}
  - {component: auth-keyspace, name: cidr-groups-get, kind: store, summary: "SELECT cidrs FROM system_auth.cidr_groups WHERE cidr_group = ?", sources: [src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:158-174], request: {type: object, properties: {group: {type: string}}}, store: {table: cidr_groups, op: get, key: "= input.group", default: {missing: true}}}
  - {component: auth-keyspace, name: cidr-groups-put, kind: store, summary: "UPDATE system_auth.cidr_groups SET cidrs", sources: [src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:183-190], request: {type: object, properties: {group: {type: string}, cidrs: {type: array, items: {type: string}}}}, store: {table: cidr_groups, op: put, key: "= input.group", value: "= {'cidr_group': input.group, 'cidrs': input.cidrs}"}}
  - {component: auth-keyspace, name: cidr-groups-delete, kind: store, summary: "DELETE FROM system_auth.cidr_groups", sources: [src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:196-203], request: {type: object, properties: {group: {type: string}}}, store: {table: cidr_groups, op: delete, key: "= input.group"}}

  - component: default-schema-update-handler
    name: on-change
    kind: event
    summary: "IEndpointStateChangeSubscriber.onChange: when a live ring member's SCHEMA application state changes in gossip, report its version to the MigrationCoordinator (which pulls if it differs)."
    description: Registered with the Gossiper in the constructor (DefaultSchemaUpdateHandler.java:92). Membership's gossip delivers it; scenarios call it on the node that hears the change.
    sources: [src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:157-168]
    request:
      type: object
      required: [endpoint, state]
      properties:
        endpoint: {type: string, default: n1}
        state: {type: string, default: SCHEMA}
        value: {type: string}
    response: {type: object, properties: {pulled: {type: boolean}, reason: {type: string}}}
    behavior:
      - if: "input.state != 'SCHEMA'"
        then: [{return: {pulled: false, reason: not-schema}}]
      - title: Ignore dead endpoints (Gossiper.isDeadState) and non-members
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:162-163
        call: gossiper.is-alive
        input: {endpoint: "= input.endpoint"}
        as: alive
      - if: "!vars.alive.value.alive"
        then: [{return: {pulled: false, reason: endpoint-dead}}]
      - title: migrationCoordinator.reportEndpointVersion(endpoint, version)
        source: src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:165
        call: migration-coordinator.report-endpoint-version
        input: {endpoint: "= input.endpoint", version: "= input.value"}
        as: r
      - return: "= vars.r.value"
  - component: cidr-groups-mapping-manager
    name: get-cidrs-of-cidr-group-as-strings
    kind: jmx
    summary: "CIDRGroupsMappingManagerMBean.getCidrsOfCidrGroupAsStrings: SELECT the group's CIDRs at auth_read_consistency_level (empty when the group is unknown)."
    sources:
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManagerMBean.java:44
      - src/java/org/apache/cassandra/auth/CIDRGroupsMappingManager.java:158-174
    request: {type: object, properties: {group: {type: string, examples: [office]}}}
    response: {type: object, properties: {cidrs: {type: array, items: {type: string}}}}
    behavior:
      - call: auth-properties.get-read-consistency-level
        as: cl
      - call: select-statement.execute
        input: {statement: {type: SELECT, keyspace: system_auth, table: cidr_groups, partition_keys: [{partition_key: "= input.group", token: 0}]}, options: {consistency: "= vars.cl.value.consistency"}, client_state: {user: system, is_super: true}}
        fill: true
      - call: auth-keyspace.cidr-groups-get
        input: {group: "= input.group"}
        as: g
      - return: {cidrs: "= has(vars.g.value.missing) ? [] : vars.g.value.cidrs"}

