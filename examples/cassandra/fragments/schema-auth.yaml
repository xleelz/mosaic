  - component: create-trigger-statement
    name: apply
    kind: function
    summary: "CreateTriggerStatement.apply: keyspace and table must exist, not a view, trigger name unique (IF NOT EXISTS otherwise), and the trigger class must load from the triggers directory."
    description: "authorize() requires superuser (CreateTriggerStatement.java:88-91)."
    sources: [src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:48-86]
    request: SchemaAuthSchemaStatement
    response: SchemaAuthTransformation
    errors: [{code: invalid, status: 8704}]
    behavior:
      - call: schema-keyspace.rows-query
        input: {keyspace: "= input.keyspace", kind: ""}
        as: rows
      - if: "!vars.rows.value.exists(r, r.kind == 'keyspace')"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:50-52
            fail: {code: invalid, status: 8704, message: "= \"Keyspace '\" + input.keyspace + \"' doesn't exist\""}
      - set: {vars.table: "= vars.rows.value.filter(r, r.kind in ['table', 'view'] && r.name == input.table)"}
      - if: "size(vars.table) == 0"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:54-56
            fail: {code: invalid, status: 8704, message: "= \"Table '\" + input.table + \"' doesn't exist\""}
      - if: "vars.table[0].kind == 'view'"
        then:
          - source: src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:58-59
            fail: {code: invalid, status: 8704, message: Cannot CREATE TRIGGER for a materialized view}
      - if: "vars.rows.value.exists(r, r.kind == 'trigger' && r.name == input.table + '.' + input.name)"
        then:
          - if: "input.if_not_exists"
            then: [{return: {mutations: [], warnings: [], created_resources: []}}]
          - source: src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:61-68
            fail: {code: invalid, status: 8704, message: "= \"Trigger '\" + input.name + \"' already exists\""}
      - choice: trigger_class
        default: loads
        options:
          loads:
            - title: TriggerExecutor.loadTriggerInstance succeeds
              source: src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:70-73
          not_found:
            - source: src/java/org/apache/cassandra/cql3/statements/schema/CreateTriggerStatement.java:74-77
              title: Trigger class couldn't be loaded
              fail: {code: invalid, status: 8704, message: "= \"Trigger class '\" + input.options + \"' couldn't be loaded\""}
      - return:
          mutations:
            - {op: put, kind: trigger, keyspace: "= input.keyspace", name: "= input.table + '.' + input.name", def: {table: "= input.table", class: "= input.options"}, sig: "= 'trigger:' + input.keyspace + '.' + input.table + '.' + input.name"}
          warnings: []
          event: {change: UPDATED, target: TABLE, keyspace: "= input.keyspace", name: "= input.table"}
          created_resources: []

