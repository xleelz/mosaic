          - set: {vars.rows: "= vars.rows + [{'role': vars.r, 'super': vars.su.value.is_super, 'datacenters': 'ALL'}]"}
      - return: {rows: "= vars.rows"}

  - component: list-permissions-statement
    name: validate
    kind: function
    summary: "validate: ensureNotAnonymous; the resource and the grantee must exist. authorize() is empty (checked in validate and in IAuthorizer.list)."
    sources:
      - src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:67-86
    request: SchemaAuthRoleStatement
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - call: client-state.ensure-not-anonymous
      - if: "input.resource.startsWith('data')"
        then:
          - call: data-resource.exists
            input: {resource: "= input.resource"}
            as: ex
          - if: "!vars.ex.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:75-76
                fail: {code: invalid, status: 8704, message: "= input.resource + \" doesn't exist\""}
      - if: "input.grantee != ''"
        then:
          - call: cassandra-role-manager.is-existing-role
            input: {role: "= input.grantee"}
            as: g
          - if: "!vars.g.value.exists"
            then:
              - source: src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:79-80
                fail: {code: invalid, status: 8704, message: "= '<role ' + input.grantee + \"> doesn't exist\""}
      - return: {}
  - component: list-permissions-statement
    name: execute
    kind: function
    summary: "execute: IAuthorizer.list over the resource (and its parents when recursive, the default); UnsupportedOperationException (AllowAllAuthorizer) becomes InvalidRequestException."
    sources: [src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:89-135]
    request: SchemaAuthRoleStatement
    response: SchemaAuthStatementResult
    errors: [{code: invalid, status: 8704}, {code: unauthorized, status: 8448}]
    behavior:
      - set: {vars.parts: "= input.resource.split('/')"}
      - set:
          vars.chain: "= input.resource == '' || !input.recursive ? [input.resource] : (size(vars.parts) == 3 ? [input.resource, vars.parts[0] + '/' + vars.parts[1], vars.parts[0]] : (size(vars.parts) == 2 ? [input.resource, vars.parts[0]] : [input.resource]))"
      - call: auth-config.get-backends
        as: b
      - set: {vars.details: []}
      - foreach: "= vars.chain"
        as: r
        steps:
          - call: "= vars.b.value.authorizer_component + '.list'"
            targets: [cassandra-authorizer.list, allow-all-authorizer.list]
            input: {performer: "= input.user", permissions: "= input.permissions", resource: "= vars.r", grantee: "= input.grantee"}
            as: l
            on_error:
              - if: "error.code == 'unsupported-operation'"
                then:
                  - source: src/java/org/apache/cassandra/cql3/statements/ListPermissionsStatement.java:114-117
                    title: UnsupportedOperationException -> InvalidRequestException
                    fail: {code: invalid, status: 8704, message: "= error.message"}
              - fail: "= {'code': error.code, 'status': error.status, 'message': error.message}"
          - set: {vars.details: "= vars.details + vars.l.value.details"}
      - if: "size(vars.details) == 0"
        then: [{return: {kind: VOID}}]
      - return: {kind: ROWS, rows: "= vars.details"}

