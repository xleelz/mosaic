# schema-auth fragment: schema changes and their propagation (DDL statements,
# DefaultSchemaUpdateHandler, MigrationCoordinator, the SCHEMA_* verbs) and
# authentication, authorization and role management (auth/**, role and
# permission statements). Built from cassandra-5.0.9 (b5f2a54210).
#
# Deployed config (conf/cassandra.yaml): authenticator AllowAllAuthenticator,
# authorizer AllowAllAuthorizer, role_manager CassandraRoleManager,
# network_authorizer AllowAllNetworkAuthorizer, cidr_authorizer
# AllowAllCIDRAuthorizer, roles/permissions/credentials_validity 2000ms,
# auth_read_consistency_level LOCAL_QUORUM and auth_write_consistency_level
# EACH_QUORUM (Config.java defaults), user_defined_functions_enabled false,
# materialized_views_enabled false, sasi_indexes_enabled false,
# drop_compact_storage_enabled false, request_timeout 10000ms.
#
# Model conventions:
# - Nodes are instances n1..n3 of cassandra-node (fixtures.yaml, three-node-rf3);
#   n1 coordinates by default. Each instance keeps its own schema, system_schema
#   rows, migration-coordinator view and auth tables.
# - system_schema rows live in schema-keyspace.state.rows keyed
#   "<kind>:<keyspace>[.<name>]" on each instance, seeded by base-schema. Each row
#   has a "sig" string; the schema version is "v:" + the instance's sigs joined in
#   key order, a content digest like SchemaKeyspace.calculateSchemaDigest.
# - system_auth tables live in auth-keyspace.state; every access first calls the
#   cql boundary with the consistency level the code uses, so a fault there
#   reproduces unavailable/timeout behaviour.
schema_version: 1
id: cassandra

components:
  # ---------------------------------------------------------------- schema
  - {id: schema, name: Schema, kind: module, parent: schema-auth, layer: metadata, sources: [src/java/org/apache/cassandra/schema/Schema.java:86-127], summary: "The node's in-memory schema: distributed keyspaces, the schema version, and the merge of schema diffs into Keyspace and ColumnFamilyStore instances.", state: {initial: {version: "v:"}}}
  - {id: default-schema-update-handler, name: DefaultSchemaUpdateHandler, kind: module, parent: schema-auth, layer: metadata, sources: [src/java/org/apache/cassandra/schema/DefaultSchemaUpdateHandler.java:55-110], summary: "Applies local schema transformations and received schema mutations, announces versions, pushes changes, and answers schema pulls.", state: {initial: {requested_reset: false}}}
  - id: migration-coordinator
    name: MigrationCoordinator
    kind: module
    parent: schema-auth
    layer: metadata
    sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:98-265]
    summary: "Tracks the schema version each endpoint reports through gossip and pulls schema it has not seen; pushes local changes to live peers."
    description: >-
      endpoint_versions, version_info and last_pull_failures mirror the fields of the same names.
      peers is this node's view of each peer's gossip application state (RELEASE_VERSION, SCHEMA)
      and MessagingService version; fixtures.yaml seeds it per instance (three-node-rf3) so
      scenarios can vary it. Liveness is read through membership's gossiper interfaces.
    state:
      initial:
        release_major: "5.0"
        current_messaging_version: 13
        uptime_ms: 3600000
        peers: {}
        endpoint_versions: {}
        version_info: {}
        last_pull_failures: {}
  - {id: migration-coordinator-callback, name: MigrationCoordinator.Callback, kind: function, parent: migration-coordinator, layer: metadata, sources: [src/java/org/apache/cassandra/schema/MigrationCoordinator.java:607-657], summary: "The SCHEMA_PULL_REQ callback: merges the pulled mutations or records the pull as failed."}
