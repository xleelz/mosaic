schema_version: 1
id: vllm
scenarios:
  - id: bench-e6
    name: "E6: n=2 fans out two child requests that share the prompt's full KV blocks"
    description: >-
      Corrected expectation (v0.32.0). The fan-out is in AsyncLLM.add_request, not in the engine
      core: a ParentRequest names the children '0_<id>' and '1_<id>', admission counts n, each
      child is registered in the OutputProcessor with the parent and sent as its own ADD
      (async_llm.py:525-556, parallel_sampling.py:84-96). The engine core schedules them as two
      independent requests. They share KV only through automatic prefix caching: allocate_slots
      caches each full block as it is allocated (kv_cache_manager.py:606-616), so the second
      child's get_computed_blocks hits the first child's full prompt blocks (at most
      num_tokens - 1, kv_cache_manager.py:264-320); the partial last block is not shared, and
      with prefix caching off nothing is shared. The OutputProcessor merges the children through
      ParentRequest.get_outputs: the parent RequestOutput is finished only when both children
      are (parallel_sampling.py:102-128), and its request_id is the external id.
      Prompt: 40 tokens = 2 full blocks of 16 + 8.
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: engine-core-busy-loop
        input: {iterations: 14}
        as: loop
        await: false
      - flow: async-llm-generate
        input:
          priority: 0
          prompt_token_ids: [128000, 1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030, 1031, 1032, 1033, 1034, 1035, 1036, 1037, 1038]
          request_id: chatcmpl-abc123
          sampling_params: {max_tokens: 4, n: 2, stop: [], temperature: 0.8}
        at_ms: 0
        as: gen
    expect:
      # fan-out in the client: two output-processor registrations and two ADDs with child ids
      - "calls['output-processor.add-request'] == 2 && calls['async-mp-client.add-request-async'] == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.add-request').map(e, e.input.request_id) == ['0_chatcmpl-abc123-00000001', '1_chatcmpl-abc123-00000001']"
      # KV sharing through the prefix cache: the second child hits the first child's 2 full blocks (32 tokens), not the partial block
      - "state['kv-cache-manager'].prefix_cache_stats.hits == 32 && state['kv-cache-manager'].prefix_cache_stats.requests == 2"
      - "calls['block-pool.touch'] >= 1"
      # both children finish and are freed
      - "state.scheduler.requests == {} && state['output-processor'].request_states == {}"
      # outcome: one finished parent output aggregating both completions
      - "steps.gen.result.ok && steps.gen.result.value.items[size(steps.gen.result.value.items)-1].finished"
      # round 2: a RequestOutput's tokens live per completion (outputs[i].token_ids); read the final output's completions
      - "size(steps.gen.result.value.items[size(steps.gen.result.value.items)-1].completions.map(c, c.token_ids).flatten()) == 8"
