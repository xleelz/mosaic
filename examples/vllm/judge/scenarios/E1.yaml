schema_version: 1
id: vllm
scenarios:
  - id: bench-e1
    name: "E1: vllm serve startup on TP 1"
    description: >-
      Verified against v0.32.0: setup_server binds the port first (launcher.py:378-398), then
      create_engine_config builds VllmConfig, AsyncLLM starts the EngineCore process
      (core.py:1391), EngineCore.__init__ builds the executor (uni for world size 1: the worker
      runs inside the engine-core process, no worker process is spawned, parallel.py:1044-1080),
      the worker loads the model (weights downloaded by the loader), _initialize_kv_caches
      profiles memory, sizes and allocates the KV cache, then compile_or_warm_up_model captures
      CUDA graphs (core.py:261-379, gpu_worker.py:915-960); the busy loop starts; only then does
      the API server get supported tasks, init app state and serve_http (entry.py:116-160).
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    expect:
      - "result.ok"
      # config resolved into VllmConfig before the engine is built
      - "calls['engine-args.create-engine-config'] == 1 && calls['vllm-config.post-init'] >= 1"
      # uni executor: one in-process worker on rank0, no multiproc worker spawn
      - "calls['uni-proc-executor.init-executor'] == 1 && !trace.exists(e, e.type == 'call.start' && e.interface.startsWith('multiproc-executor.'))"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.load-model' && e.instance == 'rank0')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'weight-utils.download-weights-from-hf' && e.instance == 'rank0')"
      # order: setup socket < config < engine core < executor < load < profile < kv alloc < warmup/capture < busy loop < serve_http
      - >-
        trace.filter(e, e.type == 'call.start' && e.interface in ['launcher.setup-server', 'engine-args.create-engine-config',
        'engine-core-proc.run-engine-core', 'uni-proc-executor.init-executor', 'gpu-worker-impl.load-model',
        'gpu-worker-impl.determine-available-memory', 'gpu-model-runner.initialize-kv-cache', 'gpu-model-runner.capture-model',
        'api-server-entry.build-and-serve', 'launcher.serve-http']).map(e, e.interface) ==
        ['launcher.setup-server', 'engine-args.create-engine-config', 'engine-core-proc.run-engine-core',
        'uni-proc-executor.init-executor', 'gpu-worker-impl.load-model', 'gpu-worker-impl.determine-available-memory',
        'gpu-model-runner.initialize-kv-cache', 'gpu-model-runner.capture-model', 'api-server-entry.build-and-serve', 'launcher.serve-http']
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-model-runner.profile-run' && e.instance == 'rank0')"
      - "state['gpu-model-runner@rank0'].kv_cache_initialized && state['gpu-model-runner@rank0'].model_loaded"
      - "state['cuda-graph-manager@rank0'].graphs_captured"
      # the busy loop starts after the engine core is constructed
      - "calls['engine-core-proc.run-busy-loop'] >= 1"
      - "state['app-state'].initialized"
  - id: bench-e1-tp4
    name: "E1 on TP 4: the mp executor spawns one worker process per rank"
    description: >-
      With world size 4 the backend is mp (parallel.py:1044-1076); MultiprocExecutor makes one
      WorkerProc per rank and waits for all of them to be READY (multiproc_executor.py), and every
      rank loads its shard and allocates its KV cache.
    flow: serving-api-cli-serve
    fixtures: [full-tp4-llama-70b]
    expect:
      - "result.ok"
      - "calls['multiproc-executor.init-executor'] == 1 && calls['uni-proc-executor.init-executor'] == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.load-model').map(e, e.instance) == ['rank0', 'rank1', 'rank2', 'rank3']"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-model-runner.initialize-kv-cache').size() == 4"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-model-runner.capture-model').size() == 4"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-model-runner.capture-model')[3].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'launcher.serve-http')[0].seq"
