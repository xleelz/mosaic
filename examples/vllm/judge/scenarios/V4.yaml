schema_version: 1
id: vllm
scenarios:
  - id: bench-v4
    name: "V4: unknown model name"
    description: >
      Code: OpenAIServing._check_model (serve/engine/serving.py:49-84) accepts an empty model or a
      served name (base_model_paths) or a loaded LoRA; otherwise returns ErrorResponse NotFoundError
      404 "The model `x` does not exist. Valid aliases: llama-8b." before _preflight and rendering.
      The HF repo id is not accepted when --served-model-name is set.
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: serving-api-chat-completion
        as: unknown
        input:
          path: /v1/chat/completions
          body:
            model: gpt-4o
            messages: [{role: user, content: "What is the capital of France?"}]
            max_tokens: 16
      - flow: serving-api-chat-completion
        as: hfpath
        input:
          path: /v1/chat/completions
          body:
            model: meta-llama/Llama-3.1-8B-Instruct
            messages: [{role: user, content: "What is the capital of France?"}]
            max_tokens: 16
    expect:
      - "!steps.unknown.result.ok && steps.unknown.result.error.status == 404 && steps.unknown.result.error.code == 'NotFoundError'"
      - "steps.unknown.result.error.message == 'The model `gpt-4o` does not exist. Valid aliases: llama-8b.'"
      - "!steps.hfpath.result.ok && steps.hfpath.result.error.status == 404"
      # path: _check_model consulted the LoRA table, then refused before preflight, rendering and generate
      - "calls['base-serving.check-model'] == 2 && calls['openai-serving-models.lookup-lora'] == 2"
      - "calls['generate-base-serving.preflight'] == 0 && calls['online-renderer.render-chat'] == 0"
      - "calls['async-llm.generate'] == 0 && calls['engine-core-proc.process-input-sockets'] == 0"
