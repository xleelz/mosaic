schema_version: 1
id: vllm
scenarios:
  - id: bench-k3
    name: "K3 max_num_seqs 2: a third request waits until a running one finishes, then is admitted"
    fixtures: [full-small-batch-limits]
    steps:
      - {flow: scheduler-add-request, as: a1, input: {request_id: chatcmpl-r1, prompt_token_ids: [128000, 1, 2, 3], sampling_params: {max_tokens: 16}}}
      - {flow: scheduler-add-request, as: a2, input: {request_id: chatcmpl-r2, prompt_token_ids: [128000, 4, 5, 6], sampling_params: {max_tokens: 16}}}
      - {flow: scheduler-add-request, as: a3, input: {request_id: chatcmpl-r3, prompt_token_ids: [128000, 7, 8, 9], sampling_params: {max_tokens: 16}}}
      - {flow: scheduler-schedule, as: s1, input: {}}
      - {flow: scheduler-update-from-output, as: u1, input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [chatcmpl-r1, chatcmpl-r2], sampled_token_ids: [[40], [41]]}}}
      - {flow: scheduler-schedule, as: s2, input: {}}
      - {flow: scheduler-update-from-output, as: u2, input: {scheduler_output: "= steps.s2.result.value", model_runner_output: {req_ids: [chatcmpl-r1, chatcmpl-r2], sampled_token_ids: [[128009], [42]]}}}
      - {flow: scheduler-schedule, as: s3, input: {}}
    expect:
      - "config['max-num-seqs'] == 2"
      # token budget (64) is not the limit: only 8 tokens scheduled, r3 still waits
      - "steps.s1.result.value.num_scheduled_tokens == {'chatcmpl-r1': 4, 'chatcmpl-r2': 4}"
      - "steps.s2.result.value.num_scheduled_tokens == {'chatcmpl-r1': 1, 'chatcmpl-r2': 1}"
      - "steps.s3.result.value.num_scheduled_tokens == {'chatcmpl-r2': 1, 'chatcmpl-r3': 4}"
      - "steps.s3.result.value.scheduled_new_reqs.map(r, r.req_id) == ['chatcmpl-r3']"
      - "state.scheduler.running == ['chatcmpl-r2', 'chatcmpl-r3'] && state.scheduler.waiting == []"
      # path: the waiting pass stops on the max_num_seqs check (twice), r3 is never looked up before s3
      - "trace.filter(e, e.type == 'note' && e.title == 'max_num_seqs requests already running').size() == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.get-computed-blocks').map(e, e.input.request_id) == ['chatcmpl-r1', 'chatcmpl-r2', 'chatcmpl-r3']"
