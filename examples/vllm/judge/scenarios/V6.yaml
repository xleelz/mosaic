schema_version: 1
id: vllm
scenarios:
  - id: bench-v6
    name: "V6: temperature 0 is greedy (argmax) and repeatable"
    description: >
      Two identical chat requests with temperature 0, one after the other, while the busy loop runs.
      Code: SamplingParams.__post_init__ (sampling_params.py:612-617) resets top_p/top_k/min_p for
      temperature < 1e-5 and sampling_type is GREEDY (865-866); in Model Runner V2 the sampler skips
      every logits processor and the temperature kernel, and the Gumbel kernel takes a plain argmax
      at temperature 0 (worker/gpu/sample/gumbel.py:22-43, 165-176). Identical logits give identical
      tokens; across different batch compositions this holds only with VLLM_BATCH_INVARIANT.
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, input: {iterations: 120}, as: loop, await: false}
      - flow: serving-api-chat-completion
        at_ms: 0
        as: a
        input:
          path: /v1/chat/completions
          headers: {X-Request-Id: v6a}
          body:
            model: llama-8b
            messages: [{role: user, content: "What is the capital of France?"}]
            max_tokens: 16
            temperature: 0
      - flow: serving-api-chat-completion
        as: b
        input:
          path: /v1/chat/completions
          headers: {X-Request-Id: v6b}
          body:
            model: llama-8b
            messages: [{role: user, content: "What is the capital of France?"}]
            max_tokens: 16
            temperature: 0
    expect:
      - "steps.a.result.ok && steps.b.result.ok"
      # path: temperature 0 reaches the engine and the GPU sampler as a greedy row
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.request_id == 'chatcmpl-v6a' && e.input.sampling_params.temperature == 0)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'sampler.add-request' && e.instance == 'rank0' && e.input.sampling_params.temperature == 0)"
      - "calls['gumbel.gumbel-sample-kernel'] == 32 && calls['gumbel.temperature-kernel'] == 0 && calls['topk-topp-triton.apply-top-k-top-p'] == 0 && calls['min-p.min-p-kernel'] == 0"
      # outcome: argmax over the same prompt yields the same completion both times
      - "steps.a.result.value.choices[0].message.content == steps.b.result.value.choices[0].message.content"
