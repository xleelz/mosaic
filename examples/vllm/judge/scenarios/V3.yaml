schema_version: 1
id: vllm
scenarios:
  - id: bench-v3
    name: "V3: chat prompt longer than max_model_len"
    description: >
      max_model_len lowered to 10 so the 14-token rendered chat prompt exceeds it. Code: the
      renderer's _token_len_check (renderers/params.py:515-537) raises VLLMValidationError, which
      create_error_response maps to 400 with type BadRequestError (not invalid_request_error);
      AsyncLLM.generate is never called, so nothing reaches the engine core.
    fixtures: [full-tp1-llama-8b]
    config: {max-model-len: 10}
    steps:
      - {flow: engine-core-busy-loop, input: {iterations: 5}, as: loop, await: false}
      - flow: serving-api-chat-completion
        at_ms: 0
        as: chat
        input:
          path: /v1/chat/completions
          headers: {X-Request-Id: v3}
          body:
            model: llama-8b
            messages: [{role: user, content: "What is the capital of France?"}]
            max_tokens: 16
    expect:
      - "!steps.chat.result.ok && steps.chat.result.error.status == 400 && steps.chat.result.error.code == 'BadRequestError'"
      - "steps.chat.result.error.message.contains('maximum context length is 10') && steps.chat.result.error.message.contains('14 input tokens')"
      # path: refused in the renderer's token length check, before generate / the engine core
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'base-renderer.tokenize-prompt' && e.error != null && e.error.code == 'BadRequestError')"
      - "calls['async-llm.generate'] == 0 && calls['input-processor.process-inputs'] == 0"
      - "calls['engine-core-proc.process-input-sockets'] == 0 && calls['scheduler.add-request'] == 0"
