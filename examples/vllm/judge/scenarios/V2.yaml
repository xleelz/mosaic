schema_version: 1
id: vllm
scenarios:
  - id: bench-v2
    name: "V2: streaming chat completion (stream: true), max_tokens 16"
    description: >
      Same request as V1 with stream true and include_usage. Code: the route returns a
      StreamingResponse over chat_completion_stream_generator, which iterates AsyncLLM.generate's
      per-step DELTA outputs: first chunk carries the role, then one chunk per engine output,
      the finish_reason on the last content chunk, an optional usage chunk, then data: [DONE].
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, input: {iterations: 60}, as: loop, await: false}
      - flow: serving-api-chat-completion
        at_ms: 0
        as: chat
        input:
          path: /v1/chat/completions
          headers: {X-Request-Id: v2}
          body:
            model: llama-8b
            messages: [{role: user, content: "What is the capital of France?"}]
            max_tokens: 16
            stream: true
            stream_options: {include_usage: true}
    expect:
      # outcome
      - "steps.chat.result.ok && steps.chat.result.value.stream"
      - "steps.chat.result.value.events[0].object == 'chat.completion.chunk' && steps.chat.result.value.events[0].choices[0].delta.role == 'assistant'"
      - "steps.chat.result.value.events[size(steps.chat.result.value.events) - 1].data == '[DONE]'"
      - "steps.chat.result.value.events[size(steps.chat.result.value.events) - 2].usage.completion_tokens == 16"
      - "steps.chat.result.value.events.exists(ev, has(ev.choices) && size(ev.choices) > 0 && ev.choices[0].finish_reason == 'length')"
      - "steps.chat.result.value.events.filter(ev, has(ev.choices) && size(ev.choices) > 0 && has(ev.choices[0].delta.content) && ev.choices[0].delta.content != '').size() > 1"
      # path the code takes: one engine output per step reaches the request's collector
      - "calls['request-output-collector.put'] == 16"
      # Code path: chunks are produced while generate is still running (the stream generator iterates
      # the generate async-iterator). The model awaits generate to completion first; this asserts the code's order.
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'openai-serving-chat.chat-completion-stream-generator')[0].seq < trace.filter(e, e.type == 'call.end' && e.interface == 'async-llm.generate')[0].seq"
