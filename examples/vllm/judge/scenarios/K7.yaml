schema_version: 1
id: vllm
scenarios:
  - id: bench-k7
    name: "K7 prefix caching off: the shared 512-token prefix is recomputed and no block is reused"
    fixtures: [full-prefix-caching-off]
    steps:
      - {flow: scheduler-add-request, as: a1, input: {request_id: chatcmpl-r1, prompt_segments: [{key: sys-512, num_tokens: 512}, {key: user-a, num_tokens: 100}], sampling_params: {max_tokens: 16}}}
      - {flow: scheduler-schedule, as: s1, input: {}}
      - {flow: scheduler-update-from-output, as: u1, input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [chatcmpl-r1], sampled_token_ids: [[128009]]}}}
      - {flow: scheduler-add-request, as: a2, input: {request_id: chatcmpl-r2, prompt_segments: [{key: sys-512, num_tokens: 512}, {key: user-b, num_tokens: 60}], sampling_params: {max_tokens: 16}}}
      - {flow: scheduler-schedule, as: s2, input: {}}
    expect:
      - "config['enable-prefix-caching'] == false"
      - "steps.s2.result.value.num_scheduled_tokens == {'chatcmpl-r2': 572}"
      - "steps.s2.result.value.scheduled_new_reqs[0].num_computed_tokens == 0"
      - "size(steps.s2.result.value.scheduled_new_reqs[0].block_ids) == 36"
      - "calls['block-pool.get-cached-block'] == 0 && calls['block-pool.touch'] == 0"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.get-computed-blocks').map(e, e.output.num_computed_tokens) == [0, 0]"
      # r1's 39 freed blocks are all uncached, so they go to the front in reverse (LIFO); r2 pops 39, 38, ... 4
      - "steps.s2.result.value.scheduled_new_reqs[0].block_ids == lists.range(36).map(i, 39 - i)"
      - "state['block-pool'].free_tail == []"

  - id: bench-k7-no-hashing
    name: "K7 path: with prefix caching off, the code never hashes request blocks (no block_hasher) and never registers blocks in the prefix cache"
    fixtures: [full-prefix-caching-off]
    steps:
      - {flow: scheduler-add-request, as: a1, input: {request_id: chatcmpl-r1, prompt_segments: [{key: sys-512, num_tokens: 512}, {key: user-a, num_tokens: 100}], sampling_params: {max_tokens: 16}}}
      - {flow: scheduler-schedule, as: s1, input: {}}
      - {flow: scheduler-update-from-output, as: u1, input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [chatcmpl-r1], sampled_token_ids: [[791]]}}}
    expect:
      # vllm/v1/engine/core.py:231-238: request_block_hasher is None unless prefix caching (or a connector) is on
      - "steps.a1.result.value.num_block_hashes == 0 && state.scheduler.requests['chatcmpl-r1'].block_hashes == []"
      # vllm/v1/core/kv_cache_manager.py:782-792: cache_blocks is a no-op when caching is disabled (also on the async path)
      - "state['block-pool'].cached == {} && state['block-pool'].block_hash == {}"
      - "calls['full-attention-manager.cache-blocks'] == 0"
