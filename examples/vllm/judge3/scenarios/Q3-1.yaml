schema_version: 1
id: vllm
scenarios:
- id: bench-q3-1-a-b
  name: Q3-1 (a)(b) two 3000-token prompts capped at 512 each
  fixtures:
  - full-tp1-llama-8b
  config:
    long-prefill-token-threshold: 512
    max-num-batched-tokens: 2048
  steps:
  - flow: scheduler-add-request
    as: add_p1
    input:
      request_id: p1
      prompt_segments:
      - key: doc-p1
        num_tokens: 3000
      sampling_params:
        max_tokens: 16
  - flow: scheduler-add-request
    as: add_p2
    input:
      request_id: p2
      prompt_segments:
      - key: doc-p2
        num_tokens: 3000
      sampling_params:
        max_tokens: 16
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-schedule
    as: s4
    input: {}
  - flow: scheduler-schedule
    as: s5
    input: {}
  - flow: scheduler-schedule
    as: s6
    input: {}
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''p1'': 512, ''p2'': 512} && steps.s1.result.value.total_num_scheduled_tokens == 1024'
  - '[steps.s2, steps.s3, steps.s4, steps.s5].all(s, s.result.value.num_scheduled_tokens == {''p1'': 512, ''p2'': 512})'
  - 'steps.s6.result.value.num_scheduled_tokens == {''p1'': 440, ''p2'': 440}'
  - steps.s2.result.value.scheduled_cached_reqs.req_ids == ['p1', 'p2'] && steps.s2.result.value.scheduled_new_reqs == []
  - state.scheduler.requests['p1'].num_output_placeholders == 1 && !state.scheduler.requests['p1'].is_prefill_chunk && state.scheduler.requests['p1'].num_computed_tokens == 3000
- id: bench-q3-1-c
  name: Q3-1 (c) a lone request is not capped
  fixtures:
  - full-tp1-llama-8b
  config:
    long-prefill-token-threshold: 512
    max-num-batched-tokens: 2048
  steps:
  - flow: scheduler-add-request
    as: add_p1
    input:
      request_id: p1
      prompt_segments:
      - key: doc-p1
        num_tokens: 3000
      sampling_params:
        max_tokens: 16
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''p1'': 2048}'
  - 'steps.s2.result.value.num_scheduled_tokens == {''p1'': 952}'
- id: bench-q3-1-c-deployed
  name: Q3-1 (c) on the deployed H100 budget 8192 the lone prompt finishes in one step
  fixtures:
  - full-tp1-llama-8b
  config:
    long-prefill-token-threshold: 512
  steps:
  - flow: scheduler-add-request
    as: add_p1
    input:
      request_id: p1
      prompt_segments:
      - key: doc-p1
        num_tokens: 3000
      sampling_params:
        max_tokens: 16
  - flow: scheduler-schedule
    as: s1
    input: {}
  expect:
  - config['max-num-batched-tokens'] == 8192
  - 'steps.s1.result.value.num_scheduled_tokens == {''p1'': 3000}'
