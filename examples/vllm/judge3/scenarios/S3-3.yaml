schema_version: 1
id: vllm
scenarios:
  - id: bench-s3-3-a
    name: "S3-3 (a) tools without tool_choice default to auto, refused without --enable-auto-tool-choice"
    fixtures: [full-tp1-llama-8b]
    input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: "weather in Paris?"}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: {$absent: true}}}
    flow: serving-api-chat-completion
    expect:
      - "!result.ok && result.error.status == 400 && result.error.message == '\"auto\" tool choice requires --enable-auto-tool-choice and --tool-call-parser to be set'"
      - "calls['online-renderer.render-chat'] == 1 && calls['hf-renderer.render-messages'] == 0"
      - "calls['async-llm.generate'] == 0 && calls['engine-core.add-request'] == 0"
  - id: bench-s3-3-b
    name: "S3-3 (b) required and named tool_choice need --tool-call-parser"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, as: req, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: "weather?"}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: required}}}
      - {flow: serving-api-chat-completion, as: named, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: "weather?"}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: {type: function, function: {name: get_weather}}}}}
    expect:
      - "!steps.req.result.ok && steps.req.result.error.status == 400 && steps.req.result.error.message == 'tool_choice=\"required\" requires --tool-call-parser to be set'"
      - "!steps.named.result.ok && steps.named.result.error.status == 400 && steps.named.result.error.message == 'tool_choice=function \"get_weather\" requires --tool-call-parser to be set'"
      - "calls['hf-renderer.render-messages'] == 0 && calls['async-llm.generate'] == 0"
  - id: bench-s3-3-c
    name: "S3-3 (c) tool_choice none: 200, plain content, tools still rendered into the template"
    fixtures: [full-tp1-llama-8b]
    max_events: 200000
    flow: serving-api-chat-completion
    input: {path: /v1/chat/completions, body: {model: llama-8b, max_tokens: 2, messages: [{role: user, content: "weather?"}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: none}}
    expect:
      - "result.ok && result.value.choices[0].message.content != '' && (!has(result.value.choices[0].message.tool_calls) || size(result.value.choices[0].message.tool_calls) == 0)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'hf-renderer.safe-apply-chat-template' && json(e.input).contains('get_weather'))"
      - "calls['engine-core.add-request'] == 1"
  - id: bench-s3-3-d
    name: "S3-3 (d) request-shape errors fire in ChatCompletionRequest's validators whatever the flags"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, as: empty, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], tools: []}}}
      - {flow: serving-api-chat-completion, as: notools, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], tool_choice: auto, tools: {$absent: true}}}}
      - {flow: serving-api-chat-completion, as: any, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], tool_choice: any, tools: [{type: function, function: {name: get_weather}}]}}}
      - {flow: serving-api-chat-completion, as: nomatch, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], tool_choice: {type: function, function: {name: get_time}}, tools: [{type: function, function: {name: get_weather}}]}}}
    expect:
      - "!steps.empty.result.ok && steps.empty.result.error.status == 400 && steps.empty.result.error.message == '`tools` must not be an empty array. Either provide at least one tool or omit the field entirely. (parameter=tools)' && steps.empty.result.error.data.param == 'tools'"
      - "!steps.notools.result.ok && steps.notools.result.error.status == 400 && steps.notools.result.error.message == 'When using `tool_choice`, `tools` must be set. (parameter=tool_choice)' && steps.notools.result.error.data.param == 'tool_choice'"
      - "!steps.any.result.ok && steps.any.result.error.status == 400 && steps.any.result.error.message == 'Invalid value for `tool_choice`: any! Only named tools, \"none\", \"auto\" or \"required\" are supported. (parameter=tool_choice)'"
      - "!steps.nomatch.result.ok && steps.nomatch.result.error.status == 400 && steps.nomatch.result.error.message == 'The tool specified in `tool_choice` does not match any of the specified `tools` (parameter=tool_choice)'"
      - "calls['online-renderer.render-chat'] == 0 && calls['async-llm.generate'] == 0"
