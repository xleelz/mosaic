schema_version: 1
id: vllm
scenarios:
- id: bench-q3-5
  name: Q3-5 prefix-cache stats at admission and KV usage
  fixtures:
  - full-tp1-llama-8b
  config:
    num-gpu-blocks-override: 1001
    max-num-batched-tokens: 2048
  state:
    block-pool:
      num_gpu_blocks: 1001
  steps:
  - flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-make-stats
    as: st1
    input: {}
  - flow: scheduler-finish-requests
    as: fa
    input:
      request_ids:
      - a
      finished_status: FINISHED_STOPPED
  - flow: scheduler-add-request
    as: add_b
    input:
      request_id: b
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-make-stats
    as: st2
    input: {}
  - flow: scheduler-add-request
    as: add_w
    input:
      request_id: w
      prompt_segments:
      - key: doc-big
        num_tokens: 20000
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-make-stats
    as: st3
    input: {}
  - flow: scheduler-finish-requests
    as: fb
    input:
      request_ids:
      - b
      finished_status: FINISHED_STOPPED
  - flow: scheduler-finish-requests
    as: fw
    input:
      request_ids:
      - w
      finished_status: FINISHED_STOPPED
  - flow: scheduler-make-stats
    as: st4
    input: {}
  expect:
  - steps.st1.result.value.prefix_cache_stats.queries == 100 && steps.st1.result.value.prefix_cache_stats.hits == 0 && steps.st1.result.value.prefix_cache_stats.requests == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.record-prefix-cache-stats' && e.input.num_tokens == 100 && e.input.num_hits == 0)
  - 'steps.st2.result.value.prefix_cache_stats.queries == 100 && steps.st2.result.value.prefix_cache_stats.hits == 96 && steps.s2.result.value.num_scheduled_tokens == {''b'': 4}'
  - steps.s3.result.value.scheduled_new_reqs == [] && steps.st3.result.value.prefix_cache_stats.queries == 0 && steps.st3.result.value.prefix_cache_stats.hits == 0 && steps.st3.result.value.num_waiting_reqs
    == 1
  - '// one 100-token request holds 7 of 1000 usable blocks

    steps.st1.result.value.kv_cache_usage > 0.00699 && steps.st1.result.value.kv_cache_usage < 0.00701'
  - steps.st4.result.value.kv_cache_usage == 0.0 && size(state['block-pool'].cached) == 6
