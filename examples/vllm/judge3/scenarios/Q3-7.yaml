schema_version: 1
id: vllm
scenarios:
- id: bench-q3-7-abc
  name: Q3-7 the LoRA cap defers without blocking the queue
  fixtures:
  - full-tp1-llama-8b
  config:
    enable-lora: true
    max-loras: 1
  steps:
  - flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-a
        num_tokens: 40
      sampling_params:
        max_tokens: 50
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-add-request
    as: add_b
    input:
      request_id: b
      prompt_segments:
      - key: doc-b
        num_tokens: 40
      sampling_params:
        max_tokens: 50
      lora_request:
        lora_name: chat
        lora_int_id: 2
        lora_path: /models/lora/chat
  - flow: scheduler-add-request
    as: add_c
    input:
      request_id: c
      prompt_segments:
      - key: doc-c
        num_tokens: 40
      sampling_params:
        max_tokens: 50
  - flow: scheduler-add-request
    as: add_d
    input:
      request_id: d
      prompt_segments:
      - key: doc-d
        num_tokens: 40
      sampling_params:
        max_tokens: 50
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-make-stats
    as: st2
    input: {}
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-finish-requests
    as: fa
    input:
      request_ids:
      - a
      finished_status: FINISHED_STOPPED
  - flow: scheduler-schedule
    as: s4
    input: {}
  - flow: scheduler-finish-requests
    as: fd
    input:
      request_ids:
      - d
      finished_status: FINISHED_STOPPED
  - flow: scheduler-schedule
    as: s5
    input: {}
  expect:
  - '// (a) B is skipped; C and D are admitted in the same step

    steps.s2.result.value.num_scheduled_tokens == {''a'': 1, ''c'': 40, ''d'': 40}'
  - trace.exists(n, n.type == 'note' && n.title == 'Admitting it would exceed max_loras; skip this request this step')
  - '// (b) B stays at the front of waiting while any sql request is scheduled

    !(''b'' in steps.s3.result.value.num_scheduled_tokens) && !(''b'' in steps.s4.result.value.num_scheduled_tokens) && steps.s4.result.value.num_scheduled_tokens == {''c'': 1, ''d'': 1}'
  - 'steps.s5.result.value.num_scheduled_tokens == {''b'': 40, ''c'': 1}'
  - '// (c) C (base) never counts toward max_loras

    ''c'' in steps.s2.result.value.num_scheduled_tokens'
- id: bench-q3-7-d
  name: Q3-7 (d) SchedulerStats split the held request out as deferred
  fixtures:
  - full-tp1-llama-8b
  config:
    enable-lora: true
    max-loras: 1
  steps:
  - flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-a
        num_tokens: 40
      sampling_params:
        max_tokens: 50
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-add-request
    as: add_b
    input:
      request_id: b
      prompt_segments:
      - key: doc-b
        num_tokens: 40
      sampling_params:
        max_tokens: 50
      lora_request:
        lora_name: chat
        lora_int_id: 2
        lora_path: /models/lora/chat
  - flow: scheduler-add-request
    as: add_c
    input:
      request_id: c
      prompt_segments:
      - key: doc-c
        num_tokens: 40
      sampling_params:
        max_tokens: 50
  - flow: scheduler-add-request
    as: add_d
    input:
      request_id: d
      prompt_segments:
      - key: doc-d
        num_tokens: 40
      sampling_params:
        max_tokens: 50
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-make-stats
    as: st2
    input: {}
  expect:
  - '// (d) SchedulerStats while B is held: 1 waiting, of which 1 deferred

    steps.st2.result.value.num_waiting_reqs == 0 && steps.st2.result.value.num_skipped_waiting_reqs == 1'
