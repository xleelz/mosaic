schema_version: 1
id: vllm
scenarios:
- id: bench-q3-2-ab
  name: Q3-2 (a)(b) W1 at the head fails the full-prompt gate and blocks W2
  fixtures:
  - full-tp1-llama-8b
  config:
    num-gpu-blocks-override: 1000
    max-num-batched-tokens: 2048
  state: &id001
    block-pool:
      num_gpu_blocks: 1000
  steps:
  - &id002
    flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-a
        num_tokens: 7989
      sampling_params:
        max_tokens: 2000
  - &id003
    flow: scheduler-schedule
    as: p1
    input: {}
  - &id004
    flow: scheduler-schedule
    as: p2
    input: {}
  - &id005
    flow: scheduler-schedule
    as: p3
    input: {}
  - &id006
    flow: scheduler-schedule
    as: p4
    input: {}
  - &id007
    interface: block-pool.get-num-free-blocks
    caller: engine-core
    as: f0
  - &id008
    flow: scheduler-add-request
    as: add_w1
    input:
      request_id: w1
      prompt_segments:
      - key: doc-w1
        num_tokens: 8800
      sampling_params:
        max_tokens: 2000
  - &id009
    flow: scheduler-add-request
    as: add_w2
    input:
      request_id: w2
      prompt_segments:
      - key: doc-w2
        num_tokens: 160
      sampling_params:
        max_tokens: 2000
  - flow: scheduler-schedule
    as: s5
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: c5
  - interface: block-pool.get-num-free-blocks
    caller: engine-core
    as: f5
  expect:
  - steps.f0.result.value.num_free_blocks == 499
  - 'steps.s5.result.value.num_scheduled_tokens == {''a'': 1} && steps.s5.result.value.scheduled_new_reqs == []'
  - 'steps.c5.result.value == {''num_running'': 1, ''num_waiting'': 2} && state.scheduler.waiting == [''w1'', ''w2'']'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.allocate-slots' && e.input.request_id == 'w1' && e.input.full_sequence_must_fit == true) && trace.exists(n, n.type == 'note'
    && n.title == 'The whole prompt would not fit; refuse admission')
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''kv-cache-manager.allocate-slots'' && e.input.request_id == ''w2'')'
  - steps.f5.result.value.num_free_blocks == 499
  - trace.exists(n, n.type == 'note' && n.title == 'Not enough KV blocks; stop admitting this step')
- id: bench-q3-2-c
  name: Q3-2 (c) without the full-ISL gate W1 is admitted with a 2047-token chunk, later preempts itself
  fixtures:
  - full-tp1-llama-8b
  config:
    num-gpu-blocks-override: 1000
    max-num-batched-tokens: 2048
    scheduler-reserve-full-isl: false
  state: *id001
  steps:
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - flow: scheduler-schedule
    as: s5
    input: {}
  - flow: scheduler-schedule
    as: s6
    input: {}
  - flow: scheduler-schedule
    as: s7
    input: {}
  - flow: scheduler-schedule
    as: s8
    input: {}
  - flow: scheduler-schedule
    as: s9
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - 'steps.s5.result.value.num_scheduled_tokens == {''a'': 1, ''w1'': 2047}'
  - '[steps.s6, steps.s7, steps.s8, steps.s9].exists(s, ''w1'' in s.result.value.preempted_req_ids && !(''w1'' in s.result.value.num_scheduled_tokens) && s.result.value.scheduled_new_reqs == [])'
  - steps.s8.result.value.preempted_req_ids == ['w1'] && state.scheduler.waiting == ['w1', 'w2'] && state.scheduler.requests['w1'].num_computed_tokens == 0
- id: bench-q3-2-d
  name: Q3-2 (d) watermark 0.1 keeps 100 blocks free for admissions while A runs
  fixtures:
  - full-tp1-llama-8b
  config:
    num-gpu-blocks-override: 1000
    max-num-batched-tokens: 2048
    watermark: 0.1
  state: *id001
  steps: &id010
  - flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-a
        num_tokens: 14389
      sampling_params:
        max_tokens: 2000
  - flow: scheduler-schedule
    as: p1
    input: {}
  - flow: scheduler-schedule
    as: p2
    input: {}
  - flow: scheduler-schedule
    as: p3
    input: {}
  - flow: scheduler-schedule
    as: p4
    input: {}
  - flow: scheduler-schedule
    as: p5
    input: {}
  - flow: scheduler-schedule
    as: p6
    input: {}
  - flow: scheduler-schedule
    as: p7
    input: {}
  - flow: scheduler-schedule
    as: p8
    input: {}
  - interface: block-pool.get-num-free-blocks
    caller: engine-core
    as: f0
  - flow: scheduler-add-request
    as: add_w2
    input:
      request_id: w2
      prompt_segments:
      - key: doc-w2
        num_tokens: 160
      sampling_params:
        max_tokens: 2000
  - flow: scheduler-schedule
    as: s9
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: c9
  expect:
  - 'steps.p1.result.value.num_scheduled_tokens == {''a'': 2048} && steps.p1.result.value.scheduled_new_reqs.size() == 1'
  - 'steps.p8.result.value.num_scheduled_tokens == {''a'': 14389 - 7*2048}'
  - steps.f0.result.value.num_free_blocks == 99
  - 'steps.s9.result.value.num_scheduled_tokens == {''a'': 1} && steps.c9.result.value.num_waiting == 1'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.allocate-slots' && e.input.request_id == 'w2' && e.input.has_scheduled_reqs == true) && trace.exists(n, n.type == 'note' &&
    n.title == 'The whole prompt would not fit; refuse admission')
- id: bench-q3-2-d-control
  name: 'Q3-2 (d) control: no watermark, W2 is admitted'
  fixtures:
  - full-tp1-llama-8b
  config:
    num-gpu-blocks-override: 1000
    max-num-batched-tokens: 2048
  state: *id001
  steps: *id010
  expect:
  - 'steps.s9.result.value.num_scheduled_tokens == {''a'': 1, ''w2'': 160}'
