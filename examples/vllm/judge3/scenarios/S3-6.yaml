schema_version: 1
id: vllm
scenarios:
  - id: bench-s3-6-ab
    name: "S3-6 (a,b) online beam search runs in the API process: one max_tokens=1 request per live beam per step, logprobs 2*beam_width"
    fixtures: [full-tp1-llama-8b]
    max_events: 600000
    flow: serving-api-completion
    input: {path: /v1/completions, headers: {X-Request-Id: bs}, body: {model: llama-8b, prompt: "The capital of France is", use_beam_search: true, n: 3, max_tokens: 8}}
    expect:
      - "result.ok && size(result.value.choices) == 3 && result.value.choices.map(c, c.index) == [0, 1, 2]"
      - "result.value.choices.all(c, c.finish_reason in ['stop', 'length'])"
      # step 1 has one beam, later steps up to beam_width: every engine request is a one-token step of a beam
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.generate').all(e, e.input.sampling_params.max_tokens == 1 && e.input.sampling_params.logprobs == 6 && e.input.request_id.startsWith('cmpl-bs-') && e.input.request_id.contains('-beam-'))"
      - "calls['async-llm.generate'] >= 8 && calls['async-llm.generate'] <= 22"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && has(e.input.sampling_params.n) && e.input.sampling_params.n == 3)"
  - id: bench-s3-6-c
    name: "S3-6 (c) beam search with stream: true is refused before rendering"
    fixtures: [full-tp1-llama-8b]
    flow: serving-api-completion
    input: {path: /v1/completions, body: {model: llama-8b, prompt: "The capital of France is", use_beam_search: true, n: 3, max_tokens: 8, stream: true}}
    expect:
      - "!result.ok && result.error.status == 400 && result.error.message == 'Streaming is not currently supported with beam search'"
      - "calls['online-renderer.render-completion'] == 0 && calls['async-llm.generate'] == 0"
  - id: bench-s3-6-d
    name: "S3-6 (d) beam search with echo and logprobs is refused by the request validator"
    fixtures: [full-tp1-llama-8b]
    flow: serving-api-completion
    input: {path: /v1/completions, body: {model: llama-8b, prompt: "The capital of France is", use_beam_search: true, n: 3, max_tokens: 8, echo: true, logprobs: 1}}
    expect:
      - "!result.ok && result.error.status == 400 && result.error.message == '`echo` with `logprobs` is not supported with beam search because beam search does not compute prompt logprobs. (parameter=echo)' && result.error.data.param == 'echo'"
      - "calls['online-renderer.render-completion'] == 0 && calls['async-llm.generate'] == 0"
