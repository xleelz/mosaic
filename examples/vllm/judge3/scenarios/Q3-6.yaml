schema_version: 1
id: vllm
scenarios:
- id: bench-q3-6-a
  name: Q3-6 (a) without dev mode the route is 404
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: dev-cache-router.post-reset-prefix-cache
    caller: api-client
    as: r
    input:
      path: /reset_prefix_cache
      query:
        reset_running_requests: false
        reset_external: false
  expect:
  - '!steps.r.result.ok && steps.r.result.error.status == 404'
  - calls['async-llm.reset-prefix-cache'] == 0
- id: bench-q3-6-b
  name: 'Q3-6 (b) dev mode, idle engine: success and the next identical prompt misses'
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-server-dev-mode: true
  steps:
  - flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-finish-requests
    as: fa
    input:
      request_ids:
      - a
      finished_status: FINISHED_STOPPED
  - interface: dev-cache-router.post-reset-prefix-cache
    caller: api-client
    as: r
    input:
      path: /reset_prefix_cache
      query:
        reset_running_requests: false
        reset_external: false
  - flow: scheduler-add-request
    as: add_b
    input:
      request_id: b
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - 'steps.r.result.ok && steps.r.result.value == {''success'': true}'
  - 'state[''block-pool''].cached.size() == 0 || steps.s2.result.value.num_scheduled_tokens == {''b'': 100}'
  - 'steps.s2.result.value.num_scheduled_tokens == {''b'': 100}'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.reset-prefix-cache') && trace.exists(e, e.type == 'call.start' && e.interface == 'block-pool.reset-prefix-cache')
- id: bench-q3-6-c
  name: 'Q3-6 (c) a running request holds blocks: 200 success false, nothing reset'
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-server-dev-mode: true
  steps:
  - flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: dev-cache-router.post-reset-prefix-cache
    caller: api-client
    as: r
    input:
      path: /reset_prefix_cache
      query:
        reset_running_requests: false
        reset_external: false
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - 'steps.r.result.ok && steps.r.result.value == {''success'': false}'
  - size(state['block-pool'].cached) == 6
  - 'steps.s2.result.value.num_scheduled_tokens == {''a'': 1}'
  - trace.exists(n, n.type == 'note' && n.title == 'Blocks still in use; reset refused')
- id: bench-q3-6-d
  name: Q3-6 (d) reset_running_requests preempts all running, then the reset succeeds; they resume by recompute
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-server-dev-mode: true
  steps:
  - flow: scheduler-add-request
    as: add_a
    input:
      request_id: a
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-add-request
    as: add_b
    input:
      request_id: b
      prompt_segments:
      - key: doc-y
        num_tokens: 50
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: dev-cache-router.post-reset-prefix-cache
    caller: api-client
    as: r
    input:
      path: /reset_prefix_cache
      query:
        reset_running_requests: true
        reset_external: false
  - flow: scheduler-make-stats
    as: st0
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-make-stats
    as: st2
    input: {}
  expect:
  - 'steps.r.result.ok && steps.r.result.value == {''success'': true}'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.preempt-request' && e.input.request_id == 'b') && calls['scheduler.preempt-request'] == 2
  - 'steps.s2.result.value.num_scheduled_tokens == {''a'': 100, ''b'': 50} && state.scheduler.running == [''a'', ''b'']'
  - steps.st2.result.value.prefix_cache_stats.preempted_requests == 2 && steps.st2.result.value.prefix_cache_stats.preempted_hits == 0
