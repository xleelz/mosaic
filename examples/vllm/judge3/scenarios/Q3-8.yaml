schema_version: 1
id: vllm
scenarios:
- id: bench-q3-8-b
  name: Q3-8 (b) the scheduler stops P1 chunk 1 before image 3 (1608 tokens)
  fixtures:
  - full-tp1-llama-8b
  config:
    max-num-batched-tokens: 2048
    async-scheduling: false
  steps:
  - flow: scheduler-add-request
    as: add_p1
    input:
      request_id: p1
      prompt_segments:
      - key: p1-text0
        num_tokens: 8
      - key: p1-img0
        num_tokens: 800
      - key: p1-img1
        num_tokens: 800
      - key: p1-img2
        num_tokens: 800
      - key: p1-text1
        num_tokens: 92
      sampling_params:
        max_tokens: 8
  - flow: scheduler-schedule
    as: s1
    input: {}
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''p1'': 1608}'
  - calls['encoder-cache-manager.can-allocate'] > 0
- id: bench-q3-8-unit
  name: 'Q3-8 (b) unit: with a 2048 cache, image 3 does not fit after images 1 and 2 (the standalone manager)'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: encoder-cache-manager.init
    caller: scheduler
    as: i
    input:
      cache_size: 2048
  - interface: encoder-cache-manager.can-allocate
    caller: scheduler
    as: c1
    input:
      request_id: p1
      input_id: 0
      num_embeds: 800
      encoder_compute_budget: 2048
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: a1
    input:
      request_id: p1
      input_id: 0
      mm_hash: img0
      num_embeds: 800
  - interface: encoder-cache-manager.can-allocate
    caller: scheduler
    as: c2
    input:
      request_id: p1
      input_id: 1
      num_embeds: 800
      encoder_compute_budget: 1248
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: a2
    input:
      request_id: p1
      input_id: 1
      mm_hash: img1
      num_embeds: 800
  - interface: encoder-cache-manager.can-allocate
    caller: scheduler
    as: c3
    input:
      request_id: p1
      input_id: 2
      num_embeds: 800
      encoder_compute_budget: 448
  expect:
  - steps.c1.result.value.can_allocate && steps.c2.result.value.can_allocate && !steps.c3.result.value.can_allocate
