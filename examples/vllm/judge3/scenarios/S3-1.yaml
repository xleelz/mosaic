schema_version: 1
id: vllm
scenarios:
  - id: bench-s3-1
    name: "S3-1 sampling-parameter ranges are refused while SamplingParams is built in the API process"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, as: tneg, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], temperature: -0.5}}}
      - {flow: serving-api-chat-completion, as: thigh, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], temperature: 2.5}}}
      - {flow: serving-api-chat-completion, as: topp0, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], top_p: 0.0}}}
      - {flow: serving-api-chat-completion, as: topkm1, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], top_k: -1, max_tokens: 2}}}
      - {flow: serving-api-chat-completion, as: topkm2, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], top_k: -2}}}
      - {flow: serving-api-chat-completion, as: pres, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], presence_penalty: 2.5}}}
      - {flow: serving-api-chat-completion, as: rep0, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], repetition_penalty: 0.0}}}
      - {flow: serving-api-chat-completion, as: greedyn2, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], temperature: 0, n: 2}}}
      - {flow: serving-api-chat-completion, as: tiny, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], temperature: 0.005, max_tokens: 2}}}
    max_events: 200000
    expect:
      # (a) temperature
      - "!steps.tneg.result.ok && steps.tneg.result.error.status == 400 && steps.tneg.result.error.code == 'BadRequestError' && steps.tneg.result.error.message == 'temperature must be non-negative, got -0.5. (parameter=temperature, value=-0.5)' && steps.tneg.result.error.data.param == 'temperature'"
      - "!steps.thigh.result.ok && steps.thigh.result.error.status == 400 && steps.thigh.result.error.message == 'temperature must be in [0, 2], got 2.5. (parameter=temperature, value=2.5)' && steps.thigh.result.error.data.param == 'temperature'"
      # (b) top_p / top_k
      - "!steps.topp0.result.ok && steps.topp0.result.error.status == 400 && steps.topp0.result.error.message.startsWith('top_p must be in (0, 1], got 0') && steps.topp0.result.error.message.contains('(parameter=top_p, value=0') && steps.topp0.result.error.data.param == 'top_p'"
      - "steps.topkm1.result.ok"
      - "!steps.topkm2.result.ok && steps.topkm2.result.error.status == 400 && steps.topkm2.result.error.message == 'top_k must be 0 (disable), or at least 1, got -2.' && (!has(steps.topkm2.result.error.data.param) || steps.topkm2.result.error.data.param == null)"
      # (c) penalties
      - "!steps.pres.result.ok && steps.pres.result.error.status == 400 && steps.pres.result.error.message == 'presence_penalty must be in [-2, 2], got 2.5.' && (!has(steps.pres.result.error.data.param) || steps.pres.result.error.data.param == null)"
      - "!steps.rep0.result.ok && steps.rep0.result.error.status == 400 && steps.rep0.result.error.message.startsWith('repetition_penalty must be greater than zero, got 0')"
      # Python prints the coerced float 0.0; CEL prints 0 -- only the prefix is asserted (simulator float repr)
      # (d) greedy n, tiny temperature raised to 0.01
      - "!steps.greedyn2.result.ok && steps.greedyn2.result.error.status == 400 && steps.greedyn2.result.error.message == 'n must be 1 when using greedy sampling, got 2.'"
      - "steps.tiny.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.temperature == 0.01)"
      # path: every rejected request stops in the API process; only top_k=-1 and temperature=0.005 reach the engine
      - "calls['async-llm.generate'] == 2 && calls['engine-core.add-request'] == 2"
