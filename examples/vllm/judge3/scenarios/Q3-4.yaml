schema_version: 1
id: vllm
scenarios:
- id: bench-q3-4-a
  name: Q3-4 (a) prompt_logprobs skips reading a fully cached prompt
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: add_r0
    input:
      request_id: r0
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s0
    input: {}
  - flow: scheduler-finish-requests
    as: f0
    input:
      request_ids:
      - r0
      finished_status: FINISHED_STOPPED
  - flow: scheduler-make-stats
    as: st0
    input: {}
  - flow: scheduler-add-request
    as: add_r1
    input:
      request_id: r1
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
        prompt_logprobs: 1
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-make-stats
    as: st1
    input: {}
  - flow: scheduler-finish-requests
    as: f1
    input:
      request_ids:
      - r1
      finished_status: FINISHED_STOPPED
  expect:
  - 'steps.s0.result.value.num_scheduled_tokens == {''r0'': 100}'
  - 'steps.s1.result.value.num_scheduled_tokens == {''r1'': 100}'
  - '// a skipped lookup records nothing (kv_cache_manager.py:253-256)

    steps.st1.result.value.prefix_cache_stats.queries == 0'
- id: bench-q3-4-b
  name: Q3-4 (b) the prompt_logprobs request still writes the cache
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: add_r1
    input:
      request_id: r1
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
        prompt_logprobs: 1
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-finish-requests
    as: f1
    input:
      request_ids:
      - r1
      finished_status: FINISHED_STOPPED
  - flow: scheduler-add-request
    as: add_r2
    input:
      request_id: r2
      prompt_segments:
      - key: doc-x
        num_tokens: 100
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-make-stats
    as: st2
    input: {}
  expect:
  - 'steps.s2.result.value.num_scheduled_tokens == {''r2'': 4} && state.scheduler.requests[''r2''].num_cached_tokens == 96'
- id: bench-q3-4-c
  name: Q3-4 (c) echo + logprobs becomes prompt_logprobs on the engine request
  fixtures:
  - full-tp1-llama-8b
  flow: serving-api-completion
  input:
    body:
      model: llama-8b
      prompt: Hello there
      echo: true
      logprobs: 2
      max_tokens: 4
      stream: false
  expect:
  - trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.prompt_logprobs == 2)
- id: bench-q3-4-d
  name: Q3-4 (d) prompt_logprobs with stream is a 400 before the engine
  fixtures:
  - full-tp1-llama-8b
  flow: serving-api-completion
  input:
    body:
      model: llama-8b
      prompt: Hello there
      prompt_logprobs: 1
      max_tokens: 4
      stream: true
  expect:
  - '!result.ok && result.error.status == 400 && result.error.message.contains(''`prompt_logprobs` are not available when `stream=True`.'')'
  - calls['async-llm.generate'] == 0
