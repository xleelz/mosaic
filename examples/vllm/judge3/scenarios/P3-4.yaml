schema_version: 1
id: vllm
scenarios:
- id: bench-p3-4-a-b-default-async
  name: 'P3-4 (a)(b): default world uses step_with_batch_queue with a queue of 2; outputs lag one step'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: vllm-config.resolve-async-scheduling
    caller: engine-core
    input:
      async_scheduling:
        $null: true
      pipeline_parallel_size: 1
      use_v2_model_runner: true
      distributed_executor_backend: uni
      runner_type: generate
      speculative_method:
        $null: true
      disable_padded_drafter_batch: false
    as: res
  - interface: engine-core.init
    caller: engine-core
    as: init
  - interface: async-llm.add-request
    caller: api-server
    input:
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      request_id: chatcmpl-abc123
      sampling_params:
        max_tokens: 4
        n: 1
    as: add
  - flow: engine-core-busy-loop
    input:
      iterations: 2
    as: loop
  expect:
  - steps.res.result.value.async_scheduling == true
  - steps.init.result.value.batch_queue_size == 2
  - trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core.step-with-batch-queue') && !trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core.step')
  - trace.filter(e, e.type == 'call.end' && e.interface == 'engine-core.step-with-batch-queue')[0].output.outputs == null
  - trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.schedule').size() == 2
  - trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.update-from-output').size() == 1
  - trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.update-from-output')[0].seq > trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.schedule')[1].seq
  - trace.filter(e, e.type == 'call.start' && e.interface == 'executor.execute-model').size() == 2
- id: bench-p3-4-c-pp4-queue
  name: 'P3-4 (c): PP 4 with async scheduling sizes the batch queue to 5'
  fixtures:
  - full-tp4-llama-70b
  config:
    tensor-parallel-size: 1
    pipeline-parallel-size: 4
  steps:
  - interface: vllm-config.resolve-async-scheduling
    caller: engine-core
    input:
      async_scheduling:
        $null: true
      pipeline_parallel_size: 4
      use_v2_model_runner: true
      distributed_executor_backend: mp
      runner_type: generate
      speculative_method:
        $null: true
      disable_padded_drafter_batch: false
    as: res
  - interface: engine-core.init
    caller: engine-core
    as: init
  expect:
  - steps.res.result.value.async_scheduling == true
  - steps.init.result.value.batch_queue_size == 5
- id: bench-p3-4-c-pp4-last-rank-samples
  name: 'P3-4 (c): PP 4, only rank3 samples and broadcasts sampled tokens to ranks 0-2'
  fixtures:
  - full-tp1-llama-8b
  topology:
    gpu-worker:
    - rank0
    - rank1
    - rank2
    - rank3
  config:
    pipeline-parallel-size: 4
  state:
    gpu-model-runner@rank0:
      is_first_pp_rank: true
      is_last_pp_rank: false
      pp_rank: 0
    gpu-model-runner@rank1:
      is_first_pp_rank: false
      is_last_pp_rank: false
      pp_rank: 1
    gpu-model-runner@rank2:
      is_first_pp_rank: false
      is_last_pp_rank: false
      pp_rank: 2
    gpu-model-runner@rank3:
      is_first_pp_rank: false
      is_last_pp_rank: true
      pp_rank: 3
    gpu-worker-impl@rank0:
      is_first_pp_rank: true
      is_last_pp_rank: false
      pp_rank: 0
    gpu-worker-impl@rank1:
      is_first_pp_rank: false
      is_last_pp_rank: false
      pp_rank: 1
    gpu-worker-impl@rank2:
      is_first_pp_rank: false
      is_last_pp_rank: false
      pp_rank: 2
    gpu-worker-impl@rank3:
      is_first_pp_rank: false
      is_last_pp_rank: true
      pp_rank: 3
    pp-handler@rank0:
      queue:
      - null
      - null
      - null
      - null
    pp-handler@rank1:
      queue:
      - null
      - null
      - null
      - null
    pp-handler@rank2:
      queue:
      - null
      - null
      - null
      - null
  steps:
  - flow: wr-pipeline-parallel-step
    input: &id001
      num_scheduled_tokens:
        chatcmpl-abc123: 4
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        - 1234
        req_id: chatcmpl-abc123
        sampling_params:
          temperature: 0
      total_num_scheduled_tokens: 4
    'on': rank0
    as: e0
    await: false
  - flow: wr-pipeline-parallel-step
    input: *id001
    'on': rank1
    as: e1
    await: false
  - flow: wr-pipeline-parallel-step
    input: *id001
    'on': rank2
    as: e2
    await: false
  - flow: wr-pipeline-parallel-step
    input: *id001
    'on': rank3
    as: e3
    await: false
  - flow: wr-sample-tokens
    'on': rank3
    as: s3
  - flow: wr-sample-tokens
    'on': rank0
    as: s0
  - flow: wr-sample-tokens
    'on': rank1
    as: s1
  - flow: wr-sample-tokens
    'on': rank2
    as: s2
  expect:
  - calls_by_instance['sampler.sample@rank3'] == 1 && calls_by_instance['sampler.sample@rank0'] == 0 && calls_by_instance['sampler.sample@rank1'] == 0 && calls_by_instance['sampler.sample@rank2'] == 0
  - calls_by_instance['pp-handler.broadcast@rank3'] == 1
  - calls_by_instance['pp-handler.receive@rank0'] == 1 && calls_by_instance['pp-handler.receive@rank1'] == 1 && calls_by_instance['pp-handler.receive@rank2'] == 1
  - size(steps.s3.result.value.sampled_token_ids[0]) == 1 && steps.s0.result.value.req_ids == []
- id: bench-p3-4-d-no-async-pp4
  name: 'P3-4 (d): --no-async-scheduling with PP 4 keeps a batch queue of 4'
  fixtures:
  - full-tp4-llama-70b
  config:
    tensor-parallel-size: 1
    pipeline-parallel-size: 4
    async-scheduling: false
  steps:
  - interface: engine-core.init
    caller: engine-core
    as: init
  - interface: async-llm.add-request
    caller: api-server
    input:
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      request_id: chatcmpl-abc123
      sampling_params:
        max_tokens: 4
        n: 1
    as: add
  - flow: engine-core-busy-loop
    input:
      iterations: 1
    as: loop
  expect:
  - steps.init.result.value.batch_queue_size == 4
  - trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core.step-with-batch-queue')
- id: bench-p3-4-d-no-async-tp1
  name: 'P3-4 (d): --no-async-scheduling on TP 1 runs plain synchronous step()'
  fixtures:
  - full-tp1-llama-8b
  config:
    async-scheduling: false
  steps:
  - interface: vllm-config.resolve-async-scheduling
    caller: engine-core
    input:
      async_scheduling: false
      pipeline_parallel_size: 1
      use_v2_model_runner: true
      distributed_executor_backend: uni
      runner_type: generate
      speculative_method:
        $null: true
      disable_padded_drafter_batch: false
    as: res
  - interface: engine-core.init
    caller: engine-core
    as: init
  - interface: async-llm.add-request
    caller: api-server
    input:
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      request_id: chatcmpl-abc123
      sampling_params:
        max_tokens: 4
        n: 1
    as: add
  - flow: engine-core-busy-loop
    input:
      iterations: 1
    as: loop
  expect:
  - steps.res.result.value.async_scheduling == false
  - steps.init.result.value.batch_queue_size == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core.step') && !trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core.step-with-batch-queue')
  - trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.update-from-output').size() == 1
