schema_version: 1
id: vllm
scenarios:
- id: bench-s3-4-a
  name: S3-4 (a-c) Qwen2.5-VL with --limit-mm-per-prompt image=1 (a)
  fixtures: &id001
  - full-tp1-llama-8b
  config: &id002
    model: Qwen/Qwen2.5-VL-7B-Instruct
    served-model-name:
    - Qwen/Qwen2.5-VL-7B-Instruct
    model-is-multimodal: true
    limit-mm-per-prompt:
      image: 1
  max_events: 200000
  steps:
  - flow: serving-api-chat-completion
    as: two_images
    input:
      path: /v1/chat/completions
      body:
        model: Qwen/Qwen2.5-VL-7B-Instruct
        messages:
        - role: user
          content:
          - type: image_url
            image_url:
              url: http://example.com/a.jpg
          - type: image_url
            image_url:
              url: http://example.com/b.jpg
          - type: text
            text: compare
  expect:
  - '!steps.two_images.result.ok && steps.two_images.result.error.status == 400 && steps.two_images.result.error.message.startsWith(''At most 1 image(s) may be provided in one prompt.'') && steps.two_images.result.error.data.param == ''image'''
  - calls['base-processing-info.validate-num-items'] >= 1
  - calls['async-llm.generate'] == 0 && calls['engine-core.add-request'] == 0
- id: bench-s3-4-b
  name: S3-4 (a-c) Qwen2.5-VL with --limit-mm-per-prompt image=1 (b)
  fixtures: *id001
  config: *id002
  max_events: 200000
  steps:
  - flow: serving-api-chat-completion
    as: audio
    input:
      path: /v1/chat/completions
      body:
        model: Qwen/Qwen2.5-VL-7B-Instruct
        messages:
        - role: user
          content:
          - type: input_audio
            input_audio:
              data: AAAA
              format: wav
          - type: text
            text: transcribe
  expect:
  - '!steps.audio.result.ok && steps.audio.result.error.status == 400 && steps.audio.result.error.message.startsWith(''At most 0 audio(s) may be provided in one prompt.'')'
  - calls['base-processing-info.validate-num-items'] >= 1
  - calls['async-llm.generate'] == 0 && calls['engine-core.add-request'] == 0
- id: bench-s3-4-c
  name: S3-4 (a-c) Qwen2.5-VL with --limit-mm-per-prompt image=1 (c)
  fixtures: *id001
  config: *id002
  max_events: 200000
  steps:
  - flow: serving-api-chat-completion
    as: embeds
    input:
      path: /v1/chat/completions
      body:
        model: Qwen/Qwen2.5-VL-7B-Instruct
        messages:
        - role: user
          content:
          - type: image_embeds
            image_embeds: AAAA
          - type: text
            text: describe
  expect:
  - '!steps.embeds.result.ok && steps.embeds.result.error.status == 400 && steps.embeds.result.error.message.startsWith(''You must set `--enable-mm-embeds` to input `image_embeds`'')'
  - calls['async-llm.generate'] == 0 && calls['engine-core.add-request'] == 0
- id: bench-s3-4-d
  name: S3-4 (d) an image sent to the text-only llama-8b
  fixtures:
  - full-tp1-llama-8b
  flow: serving-api-multimodal-chat
  input:
    path: /v1/chat/completions
    body:
      model: llama-8b
      messages:
      - role: user
        content:
        - type: image_url
          image_url:
            url: http://example.com/a.jpg
        - type: text
          text: describe
  expect:
  - '!result.ok && result.error.status == 400 && result.error.code == ''BadRequestError'' && result.error.message == ''llama-8b is not a multimodal model'''
  - calls['async-llm.generate'] == 0 && calls['engine-core.add-request'] == 0
