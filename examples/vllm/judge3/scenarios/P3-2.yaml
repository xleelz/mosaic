schema_version: 1
id: vllm
scenarios:
  # (a) dense DP: each rank is a plain, independent EngineCoreProc (core.py:1473-1482):
  # no DPEngineCoreProc busy loop, no DP all-reduce, no dummy batch.
  - id: bench-p3-2a
    name: Dense DP 2 - each rank starts an independent EngineCoreProc
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    topology:
      engine-core-proc: [dp0, dp1]
    steps:
      - {interface: engine-core-proc.run-engine-core, caller: engine-core, input: {iterations: 2}, 'on': dp0, as: e0, await: false}
      - {interface: engine-core-proc.run-engine-core, caller: engine-core, input: {iterations: 2}, 'on': dp1, as: e1}
    expect:
      - "steps.e0.result.ok && steps.e1.result.ok"
      # each rank runs the plain busy loop, never the DP one
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.run-busy-loop' && e.instance == 'dp0')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.run-busy-loop' && e.instance == 'dp1')"
      - "calls['dp-engine-core-proc.run-busy-loop'] == 0 && calls['dp-engine-core-proc.has-global-unfinished-reqs'] == 0"
      - "calls['engine-core.execute-dummy-batch'] == 0"
      # each DP rank has its own engine core, scheduler and GPU (rank 1 -> the second GPU)
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.init-device').map(e, e.instance).exists(i, i != 'rank0')"

  # (b) the coordinator is needed for a dense model in internal LB mode (stats only),
  # vllm/config/vllm.py:858-862; wave coordination = is_moe (engine/utils.py:1227-1235).
  - id: bench-p3-2b
    name: Dense DP 2 - a coordinator is needed, for stats only
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    steps:
      - {interface: vllm-config.needs-dp-coordinator, caller: engine-core, input: {data_parallel_size: 2, is_moe: false, data_parallel_external_lb: false}, as: dense}
      - {interface: vllm-config.needs-dp-coordinator, caller: engine-core, input: {data_parallel_size: 2, is_moe: false, data_parallel_external_lb: true}, as: ext}
      # the front end consumes the coordinator's (waiting, running, kv) stats
      - {flow: dp-client-stats-update-task, input: {stats: {counts: [[1, 0, 0.0], [0, 2, 0.0]], running: false, wave: 0}}, as: st}
    expect:
      - "steps.dense.result.value.needs_dp_coordinator == true"
      - "steps.ext.result.value.needs_dp_coordinator == false"
      - "steps.st.result.ok"
      # the coordinator process itself (DPCoordinator, enable_wave_coordination = is_moe) is not modeled
      - "trace.exists(e, e.type == 'call.start' && e.interface.startsWith('dp-coordinator.'))"

  # (c) least-loaded routing with a rotating scan start: 4 requests -> 0, 1, 0, 1 (core_client.py:1647-1694)
  - id: bench-p3-2c
    name: Dense DP 2 - four requests on an idle server alternate ranks
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    topology:
      engine-core-proc: [dp0, dp1]
    steps:
      - {flow: dp-client-add-request, input: {request_id: chatcmpl-r1-00000001}, as: r1}
      - {flow: dp-client-add-request, input: {request_id: chatcmpl-r2-00000002}, as: r2}
      - {flow: dp-client-add-request, input: {request_id: chatcmpl-r3-00000003}, as: r3}
      - {flow: dp-client-add-request, input: {request_id: chatcmpl-r4-00000004}, as: r4}
    expect:
      - "[steps.r1.result.value.engine, steps.r2.result.value.engine, steps.r3.result.value.engine, steps.r4.result.value.engine] == ['dp0', 'dp1', 'dp0', 'dp1']"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-input-sockets' && e.instance == 'dp0').size() == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-input-sockets' && e.instance == 'dp1').size() == 2"

  # (c, KV penalty) score = max(inflight, waiting + running) + waiting * 6 * max(0, kv - 0.5)
  # dp0: waiting 1, running 0, kv 1.0 -> 1 + 3 = 4; dp1: waiting 0, running 3 -> 3. Code picks dp1.
  - id: bench-p3-2c-kv-penalty
    name: Dense DP 2 - a queue on a KV-bound engine pushes the request to the other rank
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    topology:
      engine-core-proc: [dp0, dp1]
    state:
      dp-lb-async-mp-client:
        lb_engines: [[1, 0, 1.0], [0, 3, 0.0]]
    steps:
      - {flow: dp-client-add-request, input: {request_id: chatcmpl-k1-00000001}, as: k1}
    expect:
      - "steps.k1.result.value.engine == 'dp1'"

  # (d) header X-data-parallel-rank -> data_parallel_rank (serving.py:219-232); range check (input_processor.py:392-400)
  - id: bench-p3-2d
    name: Dense DP 2 - pinned rank 1, out-of-range rank 5
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    topology:
      engine-core-proc: [dp0, dp1]
    steps:
      - {flow: dp-client-add-request, input: {request_id: chatcmpl-p1-00000001, data_parallel_rank: 1}, as: pin}
      - {flow: dp-client-add-request, input: {request_id: chatcmpl-p2-00000002, data_parallel_rank: 1}, as: pin2}
      - interface: input-processor.process-inputs
        caller: api-server
        input: {prompt_token_ids: [128000, 9906], request_id: bad, sampling_params: {max_tokens: 4}, data_parallel_rank: 5}
        as: bad
    expect:
      - "steps.pin.result.value.engine == 'dp1' && steps.pin2.result.value.engine == 'dp1'"
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'vllm-validation-error' && steps.bad.result.error.message == 'data_parallel_rank 5 is out of range [0, 2).'"
      # the HTTP header parse (and a non-integer header being ignored) is not modeled anywhere
      - "trace.exists(e, e.type == 'note' && e.title.contains('X-data-parallel-rank'))"
