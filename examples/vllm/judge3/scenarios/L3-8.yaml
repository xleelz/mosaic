schema_version: 1
id: vllm
scenarios:
  - id: bench-l3-8a
    name: "L3-8(a) LLM.generate without sampling_params takes generation_config.json defaults (temperature 0.6, top_p 0.9) with max_tokens 16"
    flow: serving-api-offline-generate
    fixtures: [full-tp1-llama-8b]
    state: {engine-core-proc: {client_kind: sync}}   # LLM builds a SyncMPClient (llm_engine.py:174-197); the world defaults to the async client
    input: {prompts: ["The capital of France is"], sampling_params: {$null: true}}
    expect:
      - "result.ok"
      - "calls['model-config.get-diff-sampling-param'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'llm-engine.add-request' && e.input.sampling_params.max_tokens == 16 && e.input.sampling_params.temperature == 0.6 && e.input.sampling_params.top_p == 0.9)"
      # code: ModelConfig.get_diff_sampling_param logs the override warning (vllm/config/model.py:1892-1899)
      - "has(ctx.generation_config_override_warning) && ctx.generation_config_override_warning"
  - id: bench-l3-8b
    name: "L3-8(b) three prompts with two SamplingParams raise before any request is added"
    flow: serving-api-offline-generate
    fixtures: [full-tp1-llama-8b]
    state: {engine-core-proc: {client_kind: sync}}   # LLM builds a SyncMPClient (llm_engine.py:174-197); the world defaults to the async client
    input: {prompts: ["a", "b", "c"], sampling_params: [{max_tokens: 16}, {max_tokens: 16}]}
    expect:
      - "!result.ok && result.error.message == 'The lengths of prompts (3) and params (2) must be the same.'"
      - "calls['llm-engine.add-request'] == 0 && calls['base-renderer.tokenize-prompt'] == 0 && calls['llm-engine.step'] == 0"
  - id: bench-l3-8c
    name: "L3-8(c) enqueue returns ids without stepping; wait_for_completion steps until none unfinished, outputs sorted by request id"
    fixtures: [full-tp1-llama-8b]
    state: {engine-core-proc: {client_kind: sync}}   # LLM builds a SyncMPClient (llm_engine.py:174-197); the world defaults to the async client
    max_events: 200000
    steps:
      - {interface: llm.enqueue, caller: python-user, input: {prompts: ["a", "b", "c"]}, as: enq}
      - {interface: llm.wait-for-completion, caller: python-user, input: {num_requests: {$absent: true}}, as: wait}
    expect:
      - "steps.enq.result.ok && steps.enq.result.value == ['0', '1', '2']"
      # no engine step before wait_for_completion begins
      - "trace.exists(w, w.type == 'call.start' && w.interface == 'llm.wait-for-completion' && trace.filter(x, x.type == 'call.start' && x.interface == 'llm-engine.step').all(x, x.seq > w.seq)) && calls['llm-engine.step'] > 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'llm-engine.has-unfinished-requests').size() >= 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'llm-engine.add-request').size() == 3"
      - "steps.wait.result.ok && size(steps.wait.result.value) == 3"
      - "steps.wait.result.value.map(o, o.request_id) == ['0', '1', '2']"
      - "steps.wait.result.value.all(o, o.finished)"
  - id: bench-l3-8d-default
    name: "L3-8(d) LLM defaults disable_log_stats=True, so get_metrics fails with 'Stat logging disabled'"
    fixtures: [full-tp1-llama-8b]
    state: {engine-core-proc: {client_kind: sync}}   # LLM builds a SyncMPClient (llm_engine.py:174-197); the world defaults to the async client
    steps:
      - {interface: llm.get-metrics, caller: python-user, input: {}, as: m}
    expect:
      - "!steps.m.result.ok && steps.m.result.error.message == 'Stat logging disabled'"
  - id: bench-l3-8d-enabled
    name: "L3-8(d) with disable_log_stats=False get_metrics returns a snapshot including vllm:request_success"
    fixtures: [full-tp1-llama-8b]
    state: {engine-core-proc: {client_kind: sync}}   # LLM builds a SyncMPClient (llm_engine.py:174-197); the world defaults to the async client
    config: {disable-log-stats: false}
    steps:
      - {interface: llm.get-metrics, caller: python-user, input: {}, as: m}
    expect:
      - "steps.m.result.ok"
      - "calls['reader.get-metrics-snapshot'] == 1"
      - "json(steps.m.result.value).contains('vllm:request_success')"
