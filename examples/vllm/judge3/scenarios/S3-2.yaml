schema_version: 1
id: vllm
scenarios:
- id: bench-s3-2-a
  name: 'S3-2 token-id validation: logit_bias, stop_token_ids, allowed_token_ids, token-id prompts, and the streamed refusal (a)'
  fixtures: &id001
  - full-tp1-llama-8b
  max_events: 300000
  steps:
  - flow: serving-api-chat-completion
    as: lb_oov
    input:
      path: /v1/chat/completions
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
        logit_bias:
          '200000': 10
  expect:
  - '!steps.lb_oov.result.ok && steps.lb_oov.result.error.status == 400 && steps.lb_oov.result.error.message.startsWith(''token_id(s) [200000] in logit_bias contain out-of-vocab token ids. Vocabulary size: 128256'') && steps.lb_oov.result.error.data.param == ''logit_bias'''
  - calls['engine-core.add-request'] == 0
- id: bench-s3-2-b
  name: 'S3-2 token-id validation: logit_bias, stop_token_ids, allowed_token_ids, token-id prompts, and the streamed refusal (b)'
  fixtures: *id001
  max_events: 300000
  steps:
  - flow: serving-api-chat-completion
    as: lb_str
    input:
      path: /v1/chat/completions
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
        logit_bias:
          abc: 5
  - flow: serving-api-chat-completion
    as: lb_clamp
    input:
      path: /v1/chat/completions
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
        logit_bias:
          '9906': 500
        max_tokens: 2
  expect:
  - '!steps.lb_str.result.ok && steps.lb_str.result.error.status == 400 && steps.lb_str.result.error.message.startsWith("logit_bias contains key(s) that cannot be converted to integer token IDs: [''abc'']") && steps.lb_str.result.error.data.param == ''logit_bias'''
  - steps.lb_clamp.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && has(e.input.sampling_params.logit_bias) && e.input.sampling_params.logit_bias['9906'] == 100.0)
  - calls['engine-core.add-request'] == 1
- id: bench-s3-2-c
  name: 'S3-2 token-id validation: logit_bias, stop_token_ids, allowed_token_ids, token-id prompts, and the streamed refusal (c)'
  fixtures: *id001
  max_events: 300000
  steps:
  - flow: serving-api-chat-completion
    as: stop_oov
    input:
      path: /v1/chat/completions
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
        stop_token_ids:
        - 128256
  - flow: serving-api-chat-completion
    as: allowed_empty
    input:
      path: /v1/chat/completions
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
        allowed_token_ids: []
  expect:
  - '!steps.stop_oov.result.ok && steps.stop_oov.result.error.status == 400 && steps.stop_oov.result.error.message.startsWith(''token_id(s) [128256] in stop_token_ids contain out-of-vocab token ids. Vocabulary size: 128256'') && steps.stop_oov.result.error.data.param == ''stop_token_ids'''
  - '!steps.allowed_empty.result.ok && steps.allowed_empty.result.error.status == 400 && steps.allowed_empty.result.error.message.startsWith(''allowed_token_ids is not None and empty!'') && steps.allowed_empty.result.error.data.param == ''allowed_token_ids'''
  - calls['engine-core.add-request'] == 0
- id: bench-s3-2-d
  name: 'S3-2 token-id validation: logit_bias, stop_token_ids, allowed_token_ids, token-id prompts, and the streamed refusal (d)'
  fixtures: *id001
  max_events: 300000
  steps:
  - flow: serving-api-completion
    as: p_oov
    input:
      path: /v1/completions
      body:
        model: llama-8b
        prompt:
        - 128000
        - 128256
  - flow: serving-api-completion
    as: p_ok
    input:
      path: /v1/completions
      body:
        model: llama-8b
        prompt:
        - 128000
        - 128255
        max_tokens: 2
  - flow: serving-api-completion
    as: p_neg
    input:
      path: /v1/completions
      body:
        model: llama-8b
        prompt:
        - 128000
        - -1
  expect:
  - '!steps.p_oov.result.ok && steps.p_oov.result.error.status == 400 && steps.p_oov.result.error.message == ''Token id 128256 is out of vocabulary'''
  - steps.p_ok.result.ok
  - '!steps.p_neg.result.ok && steps.p_neg.result.error.status == 400'
  - calls['engine-core.add-request'] == 1
- id: bench-s3-2-e
  name: 'S3-2 token-id validation: logit_bias, stop_token_ids, allowed_token_ids, token-id prompts, and the streamed refusal (e)'
  fixtures: *id001
  max_events: 300000
  steps:
  - flow: serving-api-chat-stream
    as: lb_stream
    input:
      path: /v1/chat/completions
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
        stream: true
        logit_bias:
          '200000': 10
  expect:
  - steps.lb_stream.result.ok
  - "steps.lb_stream.result.value.items.exists(i, json(i).contains('out-of-vocab') && json(i).contains('400') && json(i).contains('BadRequestError'))"
  - "!steps.lb_stream.result.value.items.exists(i, json(i).contains('assistant'))"
  - json(steps.lb_stream.result.value.items[size(steps.lb_stream.result.value.items) - 1]).contains('[DONE]')
  - calls['engine-core.add-request'] == 0
- id: bench-s3-2-e-probe
  name: "S3-2 (e) probe: a validation the model does implement (logprobs above max_logprobs), streamed"
  fixtures: [full-tp1-llama-8b]
  max_events: 300000
  steps:
  - {flow: serving-api-chat-stream, as: lp_stream, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], stream: true, logprobs: true, top_logprobs: 30}}}
  expect:
  - "steps.lp_stream.result.ok"
  - "steps.lp_stream.result.value.items.exists(i, json(i).contains('BadRequestError') && json(i).contains('400') && json(i).contains('greater than max allowed: 20'))"
  - "!steps.lp_stream.result.value.items.exists(i, json(i).contains('assistant'))"
  - "json(steps.lp_stream.result.value.items[size(steps.lp_stream.result.value.items) - 1]).contains('[DONE]')"
  - "calls['engine-core.add-request'] == 0"
