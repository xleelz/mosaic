schema_version: 1
id: vllm
scenarios:
- id: bench-s3-7-a
  name: 'S3-7 (a) --api-key sk-a: missing, wrong and non-bearer credentials get 401 {error: Unauthorized}; a lowercase bearer scheme is accepted; /v1/models is guarded and lists both served names'
  fixtures:
  - full-tp1-llama-8b
  max_events: 300000
  config:
    api-key:
    - sk-a
    served-model-name:
    - llama-8b
    - llama
  steps:
  - flow: serving-api-chat-completion
    as: nohdr
    input:
      path: /v1/chat/completions
      headers:
        Authorization:
          $absent: true
        X-Request-Id: r0
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
  - flow: serving-api-chat-completion
    as: wrong
    input:
      path: /v1/chat/completions
      headers:
        Authorization: Bearer wrong
        X-Request-Id: r1
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
  - flow: serving-api-chat-completion
    as: token
    input:
      path: /v1/chat/completions
      headers:
        Authorization: Token sk-a
        X-Request-Id: r2
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
  - flow: serving-api-chat-completion
    as: lower
    input:
      path: /v1/chat/completions
      headers:
        Authorization: bearer sk-a
        X-Request-Id: r3
      body:
        model: llama-8b
        max_tokens: 2
        messages:
        - role: user
          content: hi
  - flow: serving-api-models-list
    as: models_noauth
    input:
      path: /v1/models
      headers:
        Authorization:
          $absent: true
  - flow: serving-api-models-list
    as: models
    input:
      path: /v1/models
      headers:
        Authorization: Bearer sk-a
  expect:
  - '[steps.nohdr, steps.wrong, steps.token].all(s, !s.result.ok && s.result.error.status == 401 && s.result.error.message == ''Unauthorized'')'
  - steps.lower.result.ok
  - '!steps.models_noauth.result.ok && steps.models_noauth.result.error.status == 401'
  - steps.models.result.ok && steps.models.result.value.data.map(m, m.id) == ['llama-8b', 'llama']
  - calls['openai-serving-chat.create-chat-completion'] == 1 && calls['async-llm.generate'] == 1
- id: bench-s3-7-b
  name: S3-7 (b) unguarded routes answer without a key
  fixtures:
  - full-tp1-llama-8b
  config:
    api-key:
    - sk-a
  steps:
  - flow: serving-api-health
    as: health
    input:
      path: /health
  - interface: instrumentator-basic.get-version
    caller: api-client
    as: version
    input:
      path: /version
  - interface: sagemaker-router.get-ping
    caller: api-client
    as: ping
    input:
      path: /ping
  - interface: serving-tokenization.post-tokenize
    caller: api-client
    as: tok
    input:
      path: /tokenize
      headers:
        Authorization:
          $absent: true
      body:
        model: llama-8b
        prompt: Hello world
  - interface: serving-tokenization.post-detokenize
    caller: api-client
    as: detok
    input:
      path: /detokenize
      headers:
        Authorization:
          $absent: true
      body:
        model: llama-8b
        tokens:
        - 128000
        - 9906
        - 1917
  expect:
  - steps.health.result.ok && steps.version.result.ok && steps.ping.result.ok && steps.tok.result.ok && steps.detok.result.ok
  - trace.exists(e, e.type == 'call.end' && e.interface == 'authentication-middleware.call' && e.error == null && e.output.reason == 'unguarded')
- id: bench-s3-7-c
  name: 'S3-7 (c) X-Request-Id: the body id is chatcmpl-<header>; with --enable-request-id-headers the header is echoed'
  fixtures:
  - full-tp1-llama-8b
  max_events: 300000
  config:
    api-key:
    - sk-a
  steps:
  - flow: serving-api-chat-completion
    as: rid
    input:
      path: /v1/chat/completions
      headers:
        Authorization: Bearer sk-a
        X-Request-Id: trace-42
      body:
        model: llama-8b
        max_tokens: 2
        messages:
        - role: user
          content: hi
  expect:
  - steps.rid.result.ok && steps.rid.result.value.id == 'chatcmpl-trace-42'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.request_id == 'chatcmpl-trace-42')
  - has(steps.rid.result.value.headers) && steps.rid.result.value.headers['x-request-id'] == 'trace-42'
- id: bench-s3-7-d
  name: S3-7 (d) Content-Type text/plain gets 400 Bad Request from validate_json_request
  fixtures:
  - full-tp1-llama-8b
  config:
    api-key:
    - sk-a
  steps:
  - flow: serving-api-chat-completion
    as: ct
    input:
      path: /v1/chat/completions
      headers:
        Authorization: Bearer sk-a
        Content-Type: text/plain
      body:
        model: llama-8b
        messages:
        - role: user
          content: hi
  expect:
  - '!steps.ct.result.ok && steps.ct.result.error.status == 400 && steps.ct.result.error.message == "1 validation error:\n  Unsupported Media Type: Only ''application/json'' is allowed"'
  - calls['openai-serving-chat.create-chat-completion'] == 0
