schema_version: 1
id: vllm
scenarios:
  - id: bench-l3-4a
    name: "L3-4(a) --max-model-len 200000 fails config creation (ValueError) before any engine process starts"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: engine-args.create-engine-config, caller: api-server, input: {model: meta-llama/Llama-3.1-8B-Instruct, max_model_len: 200000}, as: cfg}
    expect:
      - "!steps.cfg.result.ok && steps.cfg.result.error.code == 'value-error'"
      - "calls['model-config.get-and-verify-max-len'] == 1 && calls['core-engine-proc-manager.launch'] == 0 && calls['async-llm.init'] == 0"
      # code text (vllm/config/model.py:2645-2665): derived is a float after `*= scaling_factor` (2616), and the model_max_length clause and caution text follow
      - "steps.cfg.result.error.message.startsWith(\"User-specified max_model_len (200000) is greater than the derived max_model_len (max_position_embeddings=131072.0 or model_max_length=None in model's config.json). To allow overriding this maximum, set the env var VLLM_ALLOW_LONG_MAX_MODEL_LEN=1. VLLM_ALLOW_LONG_MAX_MODEL_LEN must be used with extreme caution.\")"
  - id: bench-l3-4a-cli
    name: "L3-4(a) via `vllm serve --max-model-len 200000`: the server must not start"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    input: {argv: [serve], args: {model_tag: meta-llama/Llama-3.1-8B-Instruct, max_model_len: 200000}}
    expect:
      - "!result.ok && result.error.code == 'value-error'"
      - "calls['core-engine-proc-manager.launch'] == 0"
  - id: bench-l3-4b
    name: "L3-4(b) VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 turns the refusal into a warning; /v1/models reports 200000"
    fixtures: [full-tp1-llama-8b]
    config: {vllm-allow-long-max-model-len: true, max-model-len: 200000}
    steps:
      - {interface: engine-args.create-engine-config, caller: api-server, input: {model: meta-llama/Llama-3.1-8B-Instruct, max_model_len: 200000}, as: cfg}
      - {interface: openai-serving-models.show-available-models, caller: api-server, input: {}, as: models}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.max_model_len == 200000"
      - "ctx.long_max_model_len_warning"
      - "steps.models.result.value.data[0].max_model_len == 200000"
  - id: bench-l3-4c
    name: "L3-4(c) human-readable --max-model-len: 128K is 131072 (128k would be 128000; 1.5K is rejected by argparse)"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    input: {argv: [serve], args: {model_tag: meta-llama/Llama-3.1-8B-Instruct, max_model_len: "128K"}}
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'model-config.get-and-verify-max-len' && e.input.max_model_len == 131072)"
  - id: bench-l3-4d
    name: "L3-4(d) -1 (or auto) starts from the derived 131072, then auto-fits to KV memory (the full 131072 fits on one 80 GB GPU)"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: engine-args.create-engine-config, caller: api-server, input: {model: meta-llama/Llama-3.1-8B-Instruct, max_model_len: -1}, as: cfg}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.max_model_len == 131072"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'model-config.get-and-verify-max-len' && e.input.max_model_len == -1)"
