schema_version: 1
id: vllm
scenarios:
  - id: bench-l3-3a
    name: (a) after one length-finished chat, vllm:request_success{finished_reason=length} is 1 and the other reasons exist at 0
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: prometheus-registry.collect, caller: api-server, as: before}
      - {flow: serving-api-chat-completion, input: {body: {max_tokens: 16}}, as: chat}
      - {interface: prometheus-registry.collect, caller: api-server, as: after}
    expect:
      - "steps.chat.result.ok && steps.chat.result.value.choices[0].finish_reason == 'length'"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'prometheus-registry.incr' && e.input.name == 'vllm:request_success').size() == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'prometheus-registry.incr' && e.input.name == 'vllm:request_success' && e.input.value == 1)"
      # not reproduced: labels (model_name, engine, finished_reason), zero series from startup, a GET /metrics route
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'prometheus-registry.incr' && e.input.name == 'vllm:request_success' && has(e.input.labels) && e.input.labels.finished_reason == 'length')"
      - "size(steps.before.result.value) > 0"
  - id: bench-l3-3b
    name: (b) gauges idle at 0, TTFT/e2e histograms count 1, engine_sleep_state awake 1
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, input: {body: {max_tokens: 16}}, as: chat}
      - {interface: prometheus-registry.collect, caller: api-server, as: after}
    expect:
      - "steps.chat.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface in ['prometheus-registry.set', 'prometheus-registry.incr'] && e.input.name == 'vllm:num_requests_running')"
      - "trace.exists(e, e.type == 'call.start' && e.interface in ['prometheus-registry.set', 'prometheus-registry.incr'] && e.input.name == 'vllm:time_to_first_token_seconds')"
      - "trace.exists(e, e.type == 'call.start' && e.interface in ['prometheus-registry.set', 'prometheus-registry.incr'] && e.input.name == 'vllm:e2e_request_latency_seconds')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'prometheus-registry.set' && e.input.name == 'vllm:engine_sleep_state' && e.input.value.awake == 1)"
  - id: bench-l3-3c
    name: (c) --disable-log-stats - no StatLoggerManager, no vllm:* engine series
    fixtures: [full-tp1-llama-8b]
    config: {disable-log-stats: true}
    steps:
      - {flow: serving-api-chat-completion, input: {body: {max_tokens: 16}}, as: chat}
      - {interface: prometheus-registry.collect, caller: api-server, as: after}
    expect:
      - "steps.chat.result.ok"
      - "size(steps.after.result.value) == 0"
      - "calls['stat-logger-manager.record'] == 0 && calls['prometheus-registry.incr'] == 0"
