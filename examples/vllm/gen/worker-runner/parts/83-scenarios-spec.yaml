scenarios:
- id: wr-spec-eagle3-verify-and-propose
  name: An EAGLE3 decode step verifies 3 drafts in a FULL graph, accepts all plus a bonus token, and proposes the next drafts
  fixtures:
  - full-tp1-llama-8b
  config:
    speculative-method: eagle3
    num-speculative-tokens: 3
  state:
    gpu-model-runner:
      slots:
        chatcmpl-abc123:
          slot: 1023
          prefill_len: 100
          prompt_len: 100
      fresh_slots_used: 1
      speculator: target-dependent-ar-speculator
    sampler:
      slots:
        '1023':
          temperature: 0.0
          top_p: 1.0
          top_k: 128256
          min_p: 0.0
          seeded: false
          logprobs: -1
          penalties: false
          logit_bias: false
          thinking: false
          needs_processing: false
    cuda-graph-manager:
      decode_query_len: 4
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_new_reqs: []
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-abc123
        num_computed_tokens:
        - 100
        new_block_ids:
        - []
      num_scheduled_tokens:
        chatcmpl-abc123: 4
      total_num_scheduled_tokens: 4
      scheduled_spec_decode_tokens:
        chatcmpl-abc123:
        - 201
        - 202
        - 203
  - flow: wr-sample-tokens
    as: s
  - interface: gpu-worker-impl.take-draft-token-ids
    caller: engine-core
    as: d
  - interface: rejection-sampler.sample
    caller: gpu-model-runner
    as: lp
    input:
      want_logprobs: true
      rows:
      - req_id: chatcmpl-abc123
        slot: 1023
        is_final: true
        drafts:
        - 5
        - 6
  expect:
  - steps.s.result.value.sampled_token_ids[0].size() == 4 && steps.s.result.value.sampled_token_ids[0].slice(0, 3) == [201, 202, 203]
  - steps.d.result.value.req_ids == ['chatcmpl-abc123'] && steps.d.result.value.draft_token_ids == [[-1, -1, -1]]
  - state['gpu-model-runner@rank0'].draft_tokens['chatcmpl-abc123'] == [200, 201, 202]
- id: wr-spec-reject-first-draft
  name: When the target rejects the first draft only the resampled token is emitted
  fixtures:
  - full-tp1-llama-8b
  config:
    speculative-method: eagle3
    num-speculative-tokens: 3
  state:
    gpu-model-runner:
      slots:
        chatcmpl-abc123:
          slot: 1023
          prefill_len: 100
          prompt_len: 100
      fresh_slots_used: 1
      speculator: target-dependent-ar-speculator
    sampler:
      slots:
        '1023':
          temperature: 0.0
          top_p: 1.0
          top_k: 128256
          min_p: 0.0
          seeded: false
          logprobs: -1
          penalties: false
          logit_bias: false
          thinking: false
          needs_processing: false
    cuda-graph-manager:
      decode_query_len: 4
  choices:
    rejection-sampler.sample.acceptance: reject_first
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_new_reqs: []
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-abc123
        num_computed_tokens:
        - 100
        new_block_ids:
        - []
      num_scheduled_tokens:
        chatcmpl-abc123: 4
      total_num_scheduled_tokens: 4
      scheduled_spec_decode_tokens:
        chatcmpl-abc123:
        - 201
        - 202
        - 203
  - flow: wr-sample-tokens
    as: s
  expect:
  - size(steps.s.result.value.sampled_token_ids[0]) == 1 && ctx.num_accepted == [0]
  - calls['rejection-sampler.resample-kernel'] == 1 && state['gpu-model-runner@rank0'].execute_model_state == null
- id: wr-spec-no-drafts-no-speculator
  name: Before any speculative step take_draft_token_ids returns an empty DraftTokenIds
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: gpu-worker-impl.take-draft-token-ids
    caller: engine-core
    as: d
  expect:
  - "steps.d.result.ok && steps.d.result.value == {'req_ids': [], 'draft_token_ids': []}"
  - size(state['gpu-model-runner@rank0'].draft_tokens) == 0
- id: wr-spec-ngram-no-match
  name: An n-gram speculator with no match still proposes k drafts, each the last sampled token; the scheduler sees -1 placeholders
  fixtures:
  - full-tp1-llama-8b
  config:
    speculative-method: ngram
    num-speculative-tokens: 3
  state:
    gpu-model-runner:
      slots:
        chatcmpl-abc123:
          slot: 1023
          prefill_len: 100
          prompt_len: 100
      fresh_slots_used: 1
      speculator: ngram-gpu-speculator
    sampler:
      slots:
        '1023':
          temperature: 0.0
          top_p: 1.0
          top_k: 128256
          min_p: 0.0
          seeded: false
          logprobs: -1
          penalties: false
          logit_bias: false
          thinking: false
          needs_processing: false
  choices:
    ngram-gpu-speculator.propose.match: none
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-abc123
        num_computed_tokens:
        - 100
        new_block_ids:
        - []
      num_scheduled_tokens:
        chatcmpl-abc123: 1
      total_num_scheduled_tokens: 1
  - flow: wr-sample-tokens
    as: s
  - interface: gpu-worker-impl.take-draft-token-ids
    caller: engine-core
    as: d
  expect:
  - steps.d.result.value.draft_token_ids == [[-1, -1, -1]]
  - state['gpu-model-runner@rank0'].draft_tokens['chatcmpl-abc123'] == lists.range(3).map(i, steps.s.result.value.sampled_token_ids[0][0])
- id: wr-spec-init-speculator-methods
  name: init_speculator picks the speculator class per method; unknown methods are NotImplementedError
  fixtures:
  - full-tp1-llama-8b
  config:
    num-speculative-tokens: 3
  steps:
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: dflash
    input:
      method: dflash
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: dspark
    input:
      method: dspark
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: mtp
    input:
      method: mtp
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: eagle
    input:
      method: eagle
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: draft
    input:
      method: draft_model
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: ngram
    input:
      method: ngram_gpu
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: bad
    input:
      method: medusa
  expect:
  - steps.dflash.result.value.speculator == 'dflash-speculator' && steps.dspark.result.value.speculator == 'dspark-speculator'
  - steps.mtp.result.value.speculator == 'target-dependent-ar-speculator' && steps.eagle.result.value.speculator == 'target-dependent-ar-speculator'
  - steps.draft.result.value.speculator == 'standalone-ar-speculator' && steps.ngram.result.value.speculator == 'ngram-gpu-speculator'
  - steps.bad.result.error.code == 'not-implemented-error' && steps.bad.result.error.message == 'medusa is not supported yet.'
  - trace.filter(e, e.type == 'call.start' && e.interface == 'spec-decode.init-speculator').size() == 7
- id: wr-spec-init-dflash2-and-multi-module-mtp
  name: A DFlash2 draft architecture selects DFlash2; three MTP layers with 3 speculative tokens select multi-module MTP
  fixtures:
  - full-tp1-llama-8b
  config:
    num-speculative-tokens: 3
    speculative-draft-architecture: DFlash2DraftModel
    mtp-num-nextn-predict-layers: 3
    speculative-method: mtp
  state:
    gpu-model-runner:
      model_loaded: true
  steps:
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    as: d2
    input:
      method: dflash
  - interface: gpu-model-runner.init
    caller: gpu-worker-impl
    as: init
  expect:
  - steps.d2.result.value.speculator == 'dflash2-speculator'
  - steps.init.result.value.speculator == 'multi-module-mtp-speculator' && state['gpu-model-runner@rank0'].speculator == 'multi-module-mtp-speculator'
- id: wr-spec-propose-each-drafter
  name: DFlash, DFlash2, DSpark (adaptive verification), multi-module MTP and a standalone draft model each run their kernels
  fixtures:
  - full-tp1-llama-8b
  config:
    enable-adaptive-verification: true
    decode-context-parallel-size: 2
  steps:
  - interface: dflash-speculator.propose
    caller: gpu-model-runner
    as: df
    input:
      req_ids:
      - chatcmpl-abc123
      num_speculative_tokens: 4
  - interface: dflash2-speculator.propose
    caller: gpu-model-runner
    as: df2
    input:
      req_ids:
      - chatcmpl-abc123
      num_speculative_tokens: 4
  - interface: dspark-speculator.propose
    caller: gpu-model-runner
    as: ds
    input:
      req_ids:
      - chatcmpl-abc123
      num_speculative_tokens: 4
  - interface: multi-module-mtp-speculator.propose
    caller: gpu-model-runner
    as: mtp
    input:
      req_ids:
      - chatcmpl-abc123
      num_speculative_tokens: 2
  - interface: standalone-ar-speculator.propose
    caller: gpu-model-runner
    as: sa
    input:
      req_ids:
      - chatcmpl-abc123
      num_speculative_tokens: 2
  - interface: target-dependent-ar-speculator.propose
    caller: gpu-model-runner
    as: ea
    input:
      req_ids:
      - chatcmpl-abc123
      num_speculative_tokens: 1
  expect:
  - trace.exists(e, e.type == 'call.start' && e.interface == 'standalone-ar-speculator.prepare-prefill-inputs-kernel')
- id: wr-spec-drafters-empty-batch
  name: Drafters handed no requests or zero draft tokens return no drafts
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: dflash2-speculator.propose
    caller: gpu-model-runner
    as: a
    input:
      req_ids: []
      num_speculative_tokens: 4
  - interface: multi-module-mtp-speculator.propose
    caller: gpu-model-runner
    as: b
    input:
      req_ids: []
      num_speculative_tokens: 0
  - interface: standalone-ar-speculator.propose
    caller: gpu-model-runner
    as: c
    input:
      req_ids:
      - chatcmpl-abc123
      num_speculative_tokens: 0
  expect:
  - steps.a.result.value.draft_token_ids == {} && steps.b.result.value.draft_token_ids == {} && steps.c.result.value.draft_token_ids == {}
  - trace.exists(e, e.type == 'call.start' && e.interface == 'dflash2-speculator.cache-draft-logits-kernel')
- id: wr-pooling-model-step
  name: A pooling model pools right after the forward, without sampling
  fixtures:
  - full-tp1-llama-8b
  state:
    gpu-worker-impl:
      is_pooling_model: true
    gpu-model-runner:
      is_pooling_model: true
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_new_reqs:
      - req_id: embd-1
        prompt_token_ids:
        - 1
        - 2
        - 3
        block_ids:
        - 1
        num_computed_tokens: 0
      num_scheduled_tokens:
        embd-1: 3
      total_num_scheduled_tokens: 3
  - interface: gpu-model-runner.pool
    caller: gpu-worker-impl
    as: again
  expect:
  - steps.e.result.value.req_ids == ['embd-1'] && steps.e.result.value.pooler_output == ['embedding']
  - steps.again.result.value == null && state['gpu-model-runner@rank0'].execute_model_state == null
- id: wr-pooling-late-interaction-maxsim
  name: Late-interaction scoring uses the flash-maxsim kernel; a kernel failure disables it and falls back
  fixtures:
  - full-tp1-llama-8b
  faults:
  - target: late-interaction-runner.maxsim-rerank-kernel
    type: error
    code: runtime-error
    calls:
    - 2
  state:
    gpu-model-runner:
      is_pooling_model: true
    late-interaction-runner:
      queries:
      - q-1
      - q-2
  steps:
  - interface: pooling-runner.pool
    caller: gpu-model-runner
    as: p1
    input:
      req_ids:
      - doc-1
      - doc-2
      late_interaction: true
  - interface: late-interaction-runner.score
    caller: pooling-runner
    as: fail
    input:
      num_docs: 2
      shared_query: true
  - interface: late-interaction-runner.score
    caller: pooling-runner
    as: after
    input:
      num_docs: 1
      shared_query: true
  - interface: worker-base.release-late-interaction-query-cache
    caller: engine-core
    as: rel
    input:
      query_keys:
      - q-1
  - interface: gpu-worker-impl.reset-encoder-cache
    caller: engine-core
    as: reset
  expect:
  - steps.p1.result.value.pooler_output == [0.5, 0.5]
  - steps.fail.result.value.path == 'reference' && steps.after.result.value.path == 'reference' && state['late-interaction-runner@rank0'].flash_disabled
- id: wr-release-query-cache-generative
  name: A generative model has no late-interaction cache to release
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: worker-base.release-late-interaction-query-cache
    caller: engine-core
    as: rel
    input:
      query_keys:
      - q-1
  - interface: late-interaction-runner.score
    caller: pooling-runner
    as: ref
    input:
      num_docs: 2
      shared_query: false
  expect:
  - steps.rel.result.value.released == 0 && steps.ref.result.value.path == 'reference'
  - calls['late-interaction-runner.release-queries'] == 0 && !has(state['late-interaction-runner@rank0'].queries)
- id: wr-v1-runner-hybrid-dflash-step
  name: The V1 runner computes slot mappings, runs Mamba pre/post-processing, V1 rejection sampling and the DFlash drafter kernels
  fixtures:
  - full-tp1-llama-8b
  config:
    use-v2-model-runner: false
    speculative-method: dflash
    num-speculative-tokens: 2
  state:
    gpu-worker-impl:
      runner: v1
    gpu-model-runner-v1:
      hybrid: true
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-abc123
        num_computed_tokens:
        - 100
        new_block_ids:
        - []
      num_scheduled_tokens:
        chatcmpl-abc123: 3
      total_num_scheduled_tokens: 3
      scheduled_spec_decode_tokens:
        chatcmpl-abc123:
        - 7
        - 8
      new_block_ids_to_zero:
      - 3
  - flow: wr-sample-tokens
    as: s
  - flow: wr-sample-tokens
    as: s2
  - flow: wr-compile-or-warm-up
    as: warm
  expect:
  - steps.s.result.value.req_ids == ['chatcmpl-abc123'] && steps.s2.result.value == null
  - state['gpu-model-runner-v1@rank0'].pending == null
- id: wr-v1-runner-plain-step
  name: The V1 runner without drafts samples through top-k/top-p; an empty step returns at once
  fixtures:
  - full-tp1-llama-8b
  config:
    use-v2-model-runner: false
  state:
    gpu-worker-impl:
      runner: v1
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-abc123
        num_computed_tokens:
        - 100
        new_block_ids:
        - []
      num_scheduled_tokens:
        chatcmpl-abc123: 1
      total_num_scheduled_tokens: 1
  - flow: wr-sample-tokens
    as: s
  - flow: wr-execute-model
    as: empty
  expect:
  - steps.empty.result.value.req_ids == [] && state['gpu-model-runner-v1@rank0'].pending == null
