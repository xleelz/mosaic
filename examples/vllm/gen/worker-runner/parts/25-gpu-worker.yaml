  # ================= admin =================
  - component: gpu-worker-impl
    name: profile
    kind: rpc
    summary: "collective_rpc profile(is_start, prefix, delay_iterations, max_iterations): RuntimeError unless profiler_config.profiler is set; start validates the prefix, names the trace <prefix>_dp<d>_pp<p>_tp<t>_dcp<c>_ep<e>_rank<r>, creates the WorkerProfiler on the first start and starts it with the session's bounds; stop without a profiler only warns."
    sources: ["vllm/v1/worker/gpu_worker.py:1365-1421", "vllm/config/profiler.py:24-38", "vllm/distributed/utils.py:685-723"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}, {code: value-error, status: 0, retryable: false}]
    request: {type: object, properties: {is_start: {type: boolean, default: true}, profile_prefix: {type: string, default: "", examples: [bench], description: "None (here empty) means no prefix"}, delay_iterations: {type: ["integer", "null"], default: null}, max_iterations: {type: ["integer", "null"], default: null}}}
    response: {type: object, properties: {running: {type: boolean}, trace_name: {type: string}}}
    behavior:
      - if: "!('profiler' in config) || config['profiler'] == ''"
        then:
          - title: Profiling is not enabled
            source: "vllm/v1/worker/gpu_worker.py:1374-1380"
            fail: {code: runtime-error, status: 0, message: "Profiling is not enabled. Please set --profiler-config to enable profiling. Example: '--profiler-config.profiler=torch --profiler-config.torch_profiler_dir=YOUR_DIR_PATH_TO_DUMP_TRACE'"}
      - set:
          vars.prefix: "= has(input.profile_prefix) && input.profile_prefix != null && input.profile_prefix != '' ? input.profile_prefix : null"
          vars.r: "= self == '' ? 0 : int(self.substring(4))"
      - if: "input.is_start"
        then:
          - if: "vars.prefix != null && (size(vars.prefix) < 1 || size(vars.prefix) > 128 || !vars.prefix.matches('^[A-Za-z0-9][A-Za-z0-9._-]*$'))"
            then:
              - title: Invalid trace prefix
                source: "vllm/config/profiler.py:28-37"
                fail: {code: value-error, status: 0, message: "profile_prefix must be 1-128 ASCII characters, start with a letter or number, and contain only letters, numbers, '.', '_', or '-'"}
          - title: "The rank suffix names every parallel dimension, then the global rank"
            source: "vllm/distributed/utils.py:708-718"
            set:
              vars.suffix: "= 'dp0_pp' + string(vars.r / int(config['tensor-parallel-size'])) + '_tp' + string(vars.r % int(config['tensor-parallel-size'])) + '_dcp' + string(vars.r % int(config['decode-context-parallel-size'])) + '_ep' + string(vars.r % int(config['tensor-parallel-size'])) + '_rank' + string(vars.r)"
          - source: "vllm/v1/worker/gpu_worker.py:1390-1394"
            set: {vars.name: "= vars.prefix != null && vars.prefix != '' ? vars.prefix + '_' + vars.suffix : vars.suffix"}
          - if: "!state.profiler_created"
            then:
              - title: The profiler wrapper is created on the first start only
                source: "vllm/v1/worker/gpu_worker.py:1396-1401"
                call: worker-profiler.create
                input: {worker_name: "= vars.name"}
              - set: {state.profiler_created: true}
          - source: "vllm/v1/worker/gpu_worker.py:1403-1407"
            call: worker-profiler.start
            input: {delay_iterations: "= has(input.delay_iterations) ? input.delay_iterations : null", max_iterations: "= has(input.max_iterations) ? input.max_iterations : null"}
            as: st
          - set: {state.profiler_running: "= vars.st.value.running", state.trace_name: "= vars.name"}
          - return: {running: "= vars.st.value.running", trace_name: "= vars.name"}
      - if: "!state.profiler_created"
        then:
          - title: "Profiler was not started, nothing to stop (warning)"
            source: "vllm/v1/worker/gpu_worker.py:1409-1411"
            return: {running: false, trace_name: ""}
      - source: "vllm/v1/worker/gpu_worker.py:1412-1413"
        call: worker-profiler.stop
        input: {}
      - set: {state.profiler_running: false}
      - if: "config['profiler'] == 'proton'"
        then:
          - title: "Proton fixes its output name at construction, so the wrapper is recreated on the next start"
            source: "vllm/v1/worker/gpu_worker.py:1414-1421"
            set: {state.profiler_created: false}
      - return: {running: false, trace_name: "= state.trace_name"}
