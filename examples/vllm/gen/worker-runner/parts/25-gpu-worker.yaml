interfaces:
  # ================= startup =================
  - component: gpu-worker-impl
    name: init-device
    kind: rpc
    summary: "collective_rpc init_device: binds cuda:<local_rank>, initializes torch.distributed and the model-parallel groups (before the memory snapshot, so NCCL buffers are excluded), seeds RNGs, snapshots free memory, checks the gpu_memory_utilization budget, then builds the workspace and the V1 or V2 model runner."
    sources: ["vllm/v1/worker/gpu_worker.py:435-545"]
    latency_ms: 0
    errors:
      - {code: runtime-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    request:
      type: object
      properties:
        device_type: {type: string, default: cuda}
        rank: {type: integer, examples: [0]}
    response: {type: object, properties: {device: {type: string}, requested_memory: {type: integer}, runner: {type: string}}}
    behavior:
      - if: "input.device_type != 'cuda'"
        then:
          - title: Only CUDA devices are supported by this worker
            source: "vllm/v1/worker/gpu_worker.py:542-543"
            fail: {code: runtime-error, status: 0, message: "= 'Unsupported device type: ' + input.device_type"}
      - title: Initialize the distributed environment before the memory snapshot
        detail: "NCCL buffers are allocated here so the snapshot taken next excludes them."
        source: "vllm/v1/worker/gpu_worker.py:507-515"
        call: parallel-state.init-distributed-environment
        input: {world_size: "= int(config['tensor-parallel-size'])", rank: "= input.rank", backend: nccl}
      - title: "model_config.is_moe: get_num_experts() > 0 from the checkpoint's num_experts / moe_num_experts / n_routed_experts / num_local_experts, which initialize_model_parallel reads from the current config to build the EP group"
        source: "vllm/config/model.py:2276-2277"
        call: hf-hub.download-config
        input: {model: "= config['model']"}
        as: hf
        on_error: continue
      - set:
          vars.is_moe: "= vars.hf.ok && ((has(vars.hf.value.num_local_experts) && vars.hf.value.num_local_experts > 0) || (has(vars.hf.value.num_experts) && vars.hf.value.num_experts > 0) || (has(vars.hf.value.n_routed_experts) && vars.hf.value.n_routed_experts > 0) || (has(vars.hf.value.moe_num_experts) && vars.hf.value.moe_num_experts > 0))"
      - source: "vllm/v1/worker/gpu_worker.py:1673-1678"
        call: parallel-state.ensure-model-parallel-initialized
        input: {tensor_model_parallel_size: "= int(config['tensor-parallel-size'])", pipeline_model_parallel_size: 1, is_moe: "= vars.is_moe", enable_eplb: "= config['enable-eplb']"}
      - title: Snapshot free memory after NCCL init
        source: "vllm/v1/worker/gpu_worker.py:534"
        call: gpu-memory.snapshot
        input: {at_init: true}
        as: snap
      - title: Check free memory against ceil(total * gpu_memory_utilization)
        source: "vllm/v1/worker/gpu_worker.py:535-537"
        call: worker-utils.request-memory
        input: {total_bytes: "= vars.snap.value.total_bytes", free_bytes: "= vars.snap.value.free_bytes", external_weight_memory: 0}
        as: req
      - set:
          state.init_free_memory: "= vars.snap.value.free_bytes"
          state.requested_memory: "= vars.req.value.requested_memory"
          state.device_initialized: true
          state.runner: "= config['use-v2-model-runner'] ? 'v2' : 'v1'"
          state.pp_rank: "= self == '' ? 0 : int(self.substring(4)) / int(config['tensor-parallel-size'])"
          state.is_first_pp_rank: "= self == '' || int(self.substring(4)) / int(config['tensor-parallel-size']) == 0"
          state.is_last_pp_rank: "= self == '' || int(self.substring(4)) / int(config['tensor-parallel-size']) == int(config['pipeline-parallel-size']) - 1"
      - title: Build the workspace and the model runner (V2 unless use_v2_model_runner is false)
        source: "vllm/v1/worker/gpu_worker.py:547-579"
        if: "config['use-v2-model-runner']"
        then:
          - call: gpu-model-runner.init
            input: {}
      - return: {device: "= 'cuda:' + string(input.rank)", requested_memory: "= state.requested_memory", runner: "= state.runner"}
  - component: gpu-worker-impl
    name: load-model
    kind: rpc
    summary: "collective_rpc load_model: loads weights through the model runner inside the CuMem 'weights' pool (when sleep mode is on), then creates the weight transfer engine if weight_transfer_config is set."
    sources: ["vllm/v1/worker/gpu_worker.py:587-610"]
    latency_ms: 0
    request: {type: object, properties: {load_dummy_weights: {type: boolean, default: false}}}
    response: {type: object, properties: {model_memory_usage: {type: integer}, weight_transfer_engine: {type: boolean}}}
    behavior:
      - call: gpu-model-runner.load-model
        input: {load_dummy_weights: "= has(input.load_dummy_weights) && input.load_dummy_weights"}
        as: lm
      - set: {state.is_pooling_model: "= vars.lm.value.is_pooling_model"}
      - if: "config['weight-transfer-backend'] != ''"
        then:
          - title: Create the weight transfer engine once the model exists
            source: "vllm/v1/worker/gpu_worker.py:597-603"
            set: {state.weight_transfer_engine: true}
      - return: {model_memory_usage: "= vars.lm.value.model_memory_usage", weight_transfer_engine: "= state.weight_transfer_engine"}
  - component: gpu-worker-impl
    name: determine-available-memory
    kind: rpc
    summary: "collective_rpc determine_available_memory: the KV cache budget in bytes. kv_cache_memory_bytes short-circuits profiling; otherwise a max_num_batched_tokens dummy forward is profiled and available = requested - (consumed since init + transient peak) - CUDA graph estimate."
    sources: ["vllm/v1/worker/gpu_worker.py:633-807"]
    latency_ms: 0
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object}
    response: {type: integer, examples: [59745650279]}
    behavior:
      - title: "Bytes one KV block takes across all layers (page size * layers), for the block count the engine core derives from this budget (synthetic: the Worker returns only the byte budget; the engine core divides it in get_kv_cache_configs)"
        source: "vllm/v1/core/kv_cache_utils.py:1622-1628"
        call: gpu-model-runner.get-kv-cache-spec
        input: {}
        as: spec
      - set: {state.bytes_per_block: "= vars.spec.value.page_size_bytes * vars.spec.value.num_layers"}
      - if: "int(config['kv-cache-memory-bytes']) > 0"
        then:
          - title: kv_cache_memory_bytes given, skip memory profiling
            detail: "A profile run still compiles the model for max_num_batched_tokens; gpu_memory_utilization is not respected."
            source: "vllm/v1/worker/gpu_worker.py:649-673"
            call: gpu-model-runner.profile-run
            input: {}
          - set:
              state.available_kv_cache_memory_bytes: "= int(config['kv-cache-memory-bytes'])"
              state.num_gpu_blocks: "= int(config['kv-cache-memory-bytes']) / state.bytes_per_block"
          - return: "= int(config['kv-cache-memory-bytes'])"
      - title: "The profiling pass runs with the allocator's max_split_size_mb at 20, so workspace growth cannot pin a freed large segment"
        source: "vllm/v1/worker/gpu_worker.py:681-691"
        call: gpu-worker-impl.scoped-allocator-max-split
        input: {max_split_size_mb: 20}
      - title: Profile a dummy forward of max_num_batched_tokens
        source: "vllm/v1/worker/gpu_worker.py:677-691"
        call: gpu-model-runner.profile-run
        input: {}
        as: prof
      - set: {vars.cg_estimate: 0}
      - if: "config['cudagraph-mode'] != 'NONE' && !config['enforce-eager']"
        then:
          - title: Estimate CUDA graph memory when graphs will be captured
            source: "vllm/v1/worker/gpu_worker.py:700-704"
            call: gpu-model-runner.profile-cudagraph-memory
            input: {}
            as: cg
          - set: {vars.cg_estimate: "= vars.cg.value.cudagraph_memory_bytes"}
      - set:
          vars.cg_applied: "= config['vllm-memory-profiler-estimate-cudagraphs'] ? vars.cg_estimate : 0"
      - call: gpu-memory.snapshot
        input: {after_profile: true}
        as: after
      - if: "state.init_free_memory < vars.after.value.free_bytes"
        then:
          - title: Free memory grew during profiling
            detail: "Another process sharing the GPU released memory while vLLM profiled (CUDA; ROCm falls back to torch reserved instead)."
            source: "vllm/v1/worker/gpu_worker.py:717-728"
            fail: {code: assertion-error, status: 0, message: "= 'Error in memory profiling. Initial free memory ' + string(((state.init_free_memory * 100 + 536870912) / 1073741824) / 100) + '.' + (((state.init_free_memory * 100 + 536870912) / 1073741824) % 100 == 0 ? '0' : (((state.init_free_memory * 100 + 536870912) / 1073741824) % 10 == 0 ? string((((state.init_free_memory * 100 + 536870912) / 1073741824) % 100) / 10) : ((((state.init_free_memory * 100 + 536870912) / 1073741824) % 100) < 10 ? '0' : '') + string(((state.init_free_memory * 100 + 536870912) / 1073741824) % 100))) + ' GiB, current free memory ' + string(((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) / 100) + '.' + (((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) % 100 == 0 ? '0' : (((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) % 10 == 0 ? string((((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) % 100) / 10) : ((((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) % 100) < 10 ? '0' : '') + string(((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) % 100))) + ' GiB. This happens when other processes sharing the same container release GPU memory while vLLM is profiling during initialization. To fix this, ensure consistent GPU memory allocation or isolate vLLM in its own container.'"}
      - set:
          state.total_consumed: "= state.init_free_memory - vars.after.value.free_bytes"
          state.peak_activation_memory: "= vars.prof.value.peak_activation_bytes + vars.cg_applied"
          state.cudagraph_memory_estimate: "= vars.cg_estimate"
      - title: available = requested - non_kv_cache_memory - applied CUDA graph estimate
        source: "vllm/v1/worker/gpu_worker.py:740-744"
        set:
          state.available_kv_cache_memory_bytes: "= state.requested_memory - (state.total_consumed + vars.prof.value.peak_activation_bytes) - vars.cg_applied"
      - title: KV blocks this budget holds (available // bytes_per_block, as get_kv_cache_configs computes)
        source: "vllm/v1/core/kv_cache_utils.py:1627"
        set:
          state.num_gpu_blocks: "= state.available_kv_cache_memory_bytes > 0 ? state.available_kv_cache_memory_bytes / state.bytes_per_block : 0"
      - return: "= state.available_kv_cache_memory_bytes"
  - component: gpu-worker-impl
    name: get-num-gpu-blocks
    kind: function
    summary: "The KV block count the last determine_available_memory budget holds on this rank: available bytes // (page size * layers), the arithmetic of kv_cache_utils.get_kv_cache_configs for uniform full attention (block 16, Llama-3.1-8B: 2 MiB per block). Exposed so scheduler-kv's block pool can be seeded with num_gpu_blocks; not a Worker method (the engine core computes it from the worker's answer)."
    sources: ["vllm/v1/core/kv_cache_utils.py:1622-1628", "vllm/v1/worker/gpu_worker.py:740-744"]
    attributes: {synthetic: true, consumer: scheduler-kv}
    latency_ms: 0
    response: {type: object, properties: {num_gpu_blocks: {type: integer, examples: [28488]}, bytes_per_block: {type: integer, examples: [2097152]}, available_kv_cache_memory_bytes: {type: integer, examples: [59745650279]}}}
    behavior:
      - if: "state.num_gpu_blocks == 0"
        then:
          - title: Memory not profiled yet on this rank
            fail: {code: runtime-error, status: 0, message: "determine_available_memory has not run on this worker"}
      - return: {num_gpu_blocks: "= state.num_gpu_blocks", bytes_per_block: "= state.bytes_per_block", available_kv_cache_memory_bytes: "= state.available_kv_cache_memory_bytes"}
  - component: gpu-worker-impl
    name: get-kv-cache-spec
    kind: rpc
    summary: "collective_rpc get_kv_cache_spec: per-layer KV cache specs from the model runner."
    sources: ["vllm/v1/worker/gpu_worker.py:837-838"]
    latency_ms: 0
    response: {type: object, properties: {num_layers: {type: integer}, block_size: {type: integer}, page_size_bytes: {type: integer}}}
    behavior:
      - call: gpu-model-runner.get-kv-cache-spec
        input: {}
        as: spec
      - return: "= vars.spec.value"
  - component: gpu-worker-impl
    name: update-max-model-len
    kind: rpc
    summary: "collective_rpc update_max_model_len: adopts the engine's auto-fitted max_model_len (max_model_len=-1)."
    sources: ["vllm/v1/worker/gpu_worker.py:840-850"]
    latency_ms: 0
    request: {type: object, required: [max_model_len], properties: {max_model_len: {type: integer, examples: [65536]}}}
    response: {type: object, properties: {max_model_len: {type: integer}}}
    behavior:
      - call: gpu-model-runner.update-max-model-len
        input: {max_model_len: "= input.max_model_len"}
      - return: {max_model_len: "= input.max_model_len"}
  - component: gpu-worker-impl
    name: initialize-from-config
    kind: rpc
    summary: "collective_rpc initialize_from_config: records num_gpu_blocks, adopts layout and hash granularity, initializes the KV transfer connector, then allocates the KV cache through the model runner (CuMem 'kv_cache' pool under sleep mode)."
    sources: ["vllm/v1/worker/gpu_worker.py:852-905"]
    latency_ms: 0
    request:
      type: object
      properties:
        num_blocks: {type: integer, examples: [28488]}
        needs_kv_cache_zeroing: {type: boolean, default: false}
    response: {type: object, properties: {num_blocks: {type: integer}, kv_cache_bytes: {type: integer}}}
    behavior:
      - set: {vars.n: "= has(input.num_blocks) && input.num_blocks != null ? input.num_blocks : (has(input.num_gpu_blocks) ? input.num_gpu_blocks : state.num_gpu_blocks)"}
      - title: Record the engine's block count for warmup
        source: "vllm/v1/worker/gpu_worker.py:857"
        set: {state.num_gpu_blocks: "= vars.n"}
      - title: "KV tensors are allocated in the CuMem 'kv_cache' pool under sleep mode (no KV connector pool here)"
        source: "vllm/v1/worker/gpu_worker.py:879-897"
        call: gpu-model-runner.initialize-kv-cache
        input: {num_blocks: "= vars.n", allocation_pool: "= config['enable-sleep-mode'] ? dyn('kv_cache') : dyn(null)"}
        as: kv
      - set: {vars.zero: "= has(input.needs_kv_cache_zeroing) && input.needs_kv_cache_zeroing"}
      - if: "vars.zero"
        then:
          - title: Build KV-zero metadata outside the CuMem pool
            source: "vllm/v1/worker/gpu_worker.py:900-905"
            call: kv-block-zeroer.init
            input: {num_blocks: "= vars.n"}
      - return: {num_blocks: "= vars.n", kv_cache_bytes: "= vars.kv.value.kv_cache_bytes"}
  - component: gpu-worker-impl
    name: compile-or-warm-up-model
    kind: rpc
    summary: "collective_rpc compile_or_warm_up_model: warms up compile sizes, tunes kernels, captures CUDA graphs unless enforce_eager, logs the suggested --kv-cache-memory, (V1) warms the sampler, reseeds, freezes the GC heap."
    sources: ["vllm/v1/worker/gpu_worker.py:907-1092"]
    latency_ms: 0
    response: {type: object, properties: {cuda_graph_memory_bytes: {type: integer}, suggested_kv_cache_memory_bytes: {type: integer}}}
    behavior:
      - title: Dummy runs for compile sizes outside the capture sizes, then kernel warmup
        source: "vllm/v1/worker/gpu_worker.py:937-951"
        call: gpu-model-runner.dummy-run
        input: {num_tokens: "= int(config['max-num-batched-tokens'])", uniform_decode: false}
      - title: "V2 with JIT warmup: scheduler-realistic prefill and decode steps through the worker's execute_model and sample_tokens compile the kernels before capture"
        source: "vllm/v1/worker/gpu/warmup.py:218-247"
        when: "config['use-v2-model-runner'] && !config['enforce-eager']"
        set: {ctx.jit_warmup: true}
      - set: {vars.cg_bytes: 0}
      - if: "!config['enforce-eager']"
        then:
          - title: Capture CUDA graphs
            source: "vllm/v1/worker/gpu_worker.py:961-963"
            call: gpu-model-runner.capture-model
            input: {}
            as: cap
          - set: {vars.cg_bytes: "= vars.cap.value.cuda_graph_memory_bytes"}
      - set: {vars.suggested: 0}
      - if: "int(config['kv-cache-memory-bytes']) == 0"
        then:
          - title: Suggest --kv-cache-memory from the measured usage (150 MiB redundancy)
            source: "vllm/v1/worker/gpu_worker.py:980-1043"
            set:
              vars.suggested: "= state.requested_memory - (state.total_consumed + state.peak_activation_memory + vars.cg_bytes) - 157286400"
          - set: {state.suggested_kv_cache_memory_bytes: "= vars.suggested"}
      - if: "!config['use-v2-model-runner']"
        then:
          - title: V1 warms the sampler with a max_num_reqs dummy batch after capture
            source: "vllm/v1/worker/gpu_worker.py:1045-1063"
            call: gpu-model-runner-v1.dummy-sampler-run
            input: {num_tokens: "= int(config['max-num-seqs']) < int(config['max-num-batched-tokens']) ? int(config['max-num-seqs']) : int(config['max-num-batched-tokens'])"}
      - return: {cuda_graph_memory_bytes: "= vars.cg_bytes", suggested_kv_cache_memory_bytes: "= vars.suggested"}

  # ================= the step =================
  - component: gpu-worker-impl
    name: execute-model
    kind: rpc
    summary: "collective_rpc execute_model (the engine-core -> worker seam): waits for the previous step's PP sends, receives PP intermediate tensors on non-first ranks, runs the model runner's forward. The V2 runner returns None for generation (sample_tokens follows) or a ModelRunnerOutput when no forward ran; pooling models pool immediately."
    sources: ["vllm/v1/worker/gpu_worker.py:1300-1360", "vllm/v1/worker/worker_base.py:363-368"]
    latency_ms: 0
    request:
      allOf:
        - {$ref: SchedulerOutput}
        - type: object
          properties:
            scheduled_spec_decode_tokens: {type: object, description: "req_id -> draft token ids (-1 placeholders under async scheduling)"}
            new_block_ids_to_zero: {type: array, items: {type: integer}}
            preempted_req_ids: {type: array, items: {type: string}}
            kv_connector_metadata: {type: ["object", "null"], default: null, description: "SchedulerOutput.kv_connector_metadata (with a KV transfer connector)"}
            scheduled_encoder_inputs: {type: object, default: {}, description: "SchedulerOutput.scheduled_encoder_inputs: req_id -> indices of its mm_features to encode this step"}
            free_encoder_mm_hashes: {type: array, default: [], items: {type: string}, description: "SchedulerOutput.free_encoder_mm_hashes"}
    response:
      anyOf:
        - {$ref: ModelRunnerOutput}
        - {type: "null"}
    behavior:
      - if: "state.profiler_created"
        then:
          - title: "annotate_profile: the profiler steps once per execute_model (delayed start, max iterations)"
            source: "vllm/v1/worker/gpu_worker.py:1180-1187"
            call: worker-profiler.step
            input: {}
      - title: Apply the multimodal receiver cache to new requests (WorkerWrapperBase)
        source: "vllm/v1/worker/worker_base.py:355-363"
        when: "size(input.scheduled_new_reqs) > 0 && input.scheduled_new_reqs.exists(r, has(r.mm_features) && size(r.mm_features) > 0)"
        set: {ctx.mm_cache_applied: true}
      - if: "state.runner == 'v1'"
        then:
          - call: gpu-model-runner-v1.execute-model
            input: "= input"
            as: v1
          - return: "= vars.v1.value"
      - if: "has(state.pp_send_pending) && state.pp_send_pending"
        then:
          - title: Wait for the previous step's PP sends before overwriting their buffers
            source: "vllm/v1/worker/gpu_worker.py:1304-1309"
            set: {state.pp_send_pending: false}
      - if: "input.total_num_scheduled_tokens > 0 && has(state.is_first_pp_rank) && !state.is_first_pp_rank"
        then:
          - title: "A non-first PP rank receives the previous stage's intermediate tensors from its counterpart (same TP rank) in that stage; the hand-off is keyed by (stage, TP rank), TP rank 0 keeping the bare stage key"
            source: "vllm/v1/worker/gpu_worker.py:1311-1324"
            receive: "= 'pp-hidden:' + string(state.pp_rank) + ((self == '' || int(self.substring(4)) % int(config['tensor-parallel-size']) == 0) ? '' : ':tp' + string(int(self.substring(4)) % int(config['tensor-parallel-size'])))"
            as: hidden
            timeout_ms: 600000
      - call: gpu-model-runner.execute-model
        input: "= input"
        as: out
      - if: "vars.out.value != null && has(vars.out.value.intermediate_tensors)"
        then:
          - title: A non-last PP rank sends its intermediate tensors to the same TP rank of the next stage (non-blocking)
            source: "vllm/v1/worker/gpu_worker.py:1338-1351"
            put: "= 'pp-hidden:' + string(state.pp_rank + 1) + ((self == '' || int(self.substring(4)) % int(config['tensor-parallel-size']) == 0) ? '' : ':tp' + string(int(self.substring(4)) % int(config['tensor-parallel-size'])))"
            value: "= vars.out.value.intermediate_tensors"
          - set: {state.pp_send_pending: true}
          - if: "state.is_pooling_model"
            then:
              - call: gpu-model-runner.pool
                input: {}
                as: ppool
              - return: "= vars.ppool.value"
          - return: null
      - if: "vars.out.value == null && state.is_pooling_model"
        then:
          - title: Pooling models pool right after the forward (V2)
            source: "vllm/v1/worker/gpu_worker.py:1330-1336"
            call: gpu-model-runner.pool
            input: {}
            as: pooled
          - return: "= vars.pooled.value"
      - return: "= vars.out.value"
  - component: gpu-worker-impl
    name: sample-tokens
    kind: rpc
    summary: "collective_rpc sample_tokens: called right after execute_model returned None, with the scheduler's grammar output; returns the step's ModelRunnerOutput."
    sources: ["vllm/v1/worker/gpu_worker.py:1293-1298"]
    latency_ms: 0
    request:
      type: object
      properties:
        grammar_output: {type: ["object", "null"]}
    response:
      anyOf:
        - {$ref: ModelRunnerOutput}
        - {type: "null"}
    behavior:
      - if: "state.runner == 'v1'"
        then:
          - call: gpu-model-runner-v1.sample-tokens
            input: {grammar_output: "= has(input.grammar_output) ? input.grammar_output : null"}
            as: v1
          - return: "= vars.v1.value"
      - call: gpu-model-runner.sample-tokens
        input: {grammar_output: "= has(input.grammar_output) ? input.grammar_output : null"}
        as: out
      - return: "= vars.out.value"
  - component: gpu-worker-impl
    name: take-draft-token-ids
    kind: rpc
    summary: "collective_rpc take_draft_token_ids: the drafts the speculator proposed in the last sample_tokens, for the scheduler's next step."
    sources: ["vllm/v1/worker/gpu_worker.py:1362-1363"]
    latency_ms: 0
    response: {type: ["object", "null"], properties: {req_ids: {type: array}, draft_token_ids: {type: array}}}
    behavior:
      - call: gpu-model-runner.take-draft-token-ids
        input: {}
        as: d
      - return: "= vars.d.value"
  - component: gpu-worker-impl
    name: execute-dummy-batch
    kind: rpc
    summary: "collective_rpc execute_dummy_batch: a uniform-decode dummy forward so an idle DP rank joins its peers' collectives."
    sources: ["vllm/v1/worker/gpu_worker.py:1431-1437"]
    latency_ms: 0
    response: {type: object, properties: {num_tokens: {type: integer}}}
    behavior:
      - call: gpu-model-runner.dummy-run
        input: {num_tokens: 1, uniform_decode: true}
        as: d
      - return: {num_tokens: "= vars.d.value.num_tokens"}

  # ================= sleep mode =================
  - component: gpu-worker-impl
    name: sleep
    kind: rpc
    summary: "collective_rpc sleep(level): level 2 first saves model buffers (and preserved parameters) to CPU; the sleep backend offloads/discards pools; logs the memory freed. Asserts memory did not grow."
    sources: ["vllm/v1/worker/gpu_worker.py:294-330"]
    latency_ms: 0
    request: {type: object, properties: {level: {type: integer, enum: [1, 2], default: 1}}}
    response: {type: object, properties: {freed_bytes: {type: integer}}}
    behavior:
      - if: "input.level == 2"
        then:
          - title: Save model buffers to CPU before a level 2 sleep
            source: "vllm/v1/worker/gpu_worker.py:299-309"
            set: {state.saved_buffers: true}
      - title: Suspend through the sleep-mode backend
        source: "vllm/v1/worker/gpu_worker.py:311"
        call: cu-mem-allocator.sleep
        input: {level: "= input.level"}
        as: s
      - set: {state.sleep_level: "= input.level"}
      - return: {freed_bytes: "= vars.s.value.freed_bytes"}
  - component: gpu-worker-impl
    name: wake-up
    kind: rpc
    summary: "collective_rpc wake_up(tags): resumes the backend, restores the level-2 buffers when weights wake, synchronizes the device."
    sources: ["vllm/v1/worker/gpu_worker.py:332-356"]
    latency_ms: 0
    request: {type: object, properties: {tags: {type: array, items: {type: string}, default: []}}}
    response: {type: object, properties: {restored: {type: array}, buffers_restored: {type: boolean}}}
    behavior:
      - call: cu-mem-allocator.wake-up
        input: {tags: "= has(input.tags) ? input.tags : []"}
        as: w
      - set:
          vars.wake_weights: "= !has(input.tags) || size(input.tags) == 0 || 'weights' in input.tags"
      - set: {vars.restored_buffers: "= vars.wake_weights && state.saved_buffers"}
      - if: "vars.restored_buffers"
        then:
          - title: Copy the saved buffers back into the model
            source: "vllm/v1/worker/gpu_worker.py:340-346"
            set: {state.saved_buffers: false}
      - set: {state.sleep_level: "= vars.wake_weights ? 0 : state.sleep_level"}
      - call: worker-base.synchronize-device
        input: {}
      - return: {restored: "= vars.w.value.restored", buffers_restored: "= vars.restored_buffers"}
  - component: gpu-worker-impl
    name: discard
    kind: rpc
    summary: "collective_rpc discard(tags): drops suspended state for the tags through the sleep backend."
    sources: ["vllm/v1/worker/gpu_worker.py:358-359"]
    latency_ms: 0
    request: {type: object, properties: {tags: {type: array, items: {type: string}, examples: [["weights"]]}}}
    response: {type: object, properties: {discarded: {type: array}}}
    behavior:
      - call: cu-mem-allocator.discard
        input: {tags: "= input.tags"}
        as: d
      - return: {discarded: "= vars.d.value.discarded"}

