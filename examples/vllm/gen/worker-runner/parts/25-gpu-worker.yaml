    summary: "collective_rpc reset_encoder_cache."
    sources: ["vllm/v1/worker/gpu_worker.py:1126-1127"]
    latency_ms: 0
    response: {type: object, properties: {reset: {type: boolean}}}
    behavior:
      - call: gpu-model-runner.reset-encoder-cache
        input: {}
      - return: {reset: true}
  - component: gpu-worker-impl
    name: get-encoder-timing-stats
    kind: rpc
    summary: "collective_rpc get_encoder_timing_stats (multimodal encoder timings)."
    sources: ["vllm/v1/worker/gpu_worker.py:1176-1178"]
    latency_ms: 0
    response: {type: object, properties: {stats: {type: object}}}
    behavior:
      - call: gpu-model-runner.get-encoder-timing-stats
        input: {}
        as: s
      - return: "= vars.s.value"
  - component: gpu-worker-impl
    name: get-kv-connector-handshake-metadata
    kind: rpc
    summary: "collective_rpc get_kv_connector_handshake_metadata: None without a KV transfer group or when the connector exchanges no metadata; else {(pp_rank, tp_rank): metadata}."
    sources: ["vllm/v1/worker/gpu_worker.py:809-835"]
    latency_ms: 0
    response: {type: ["object", "null"], properties: {key: {type: string}}}
    behavior:
      - if: "config['kv-transfer-config'] == ''"
        then:
          - title: No KV transfer group
            source: "vllm/v1/worker/gpu_worker.py:816-817"
            return: null
      - return: {key: "pp0:tp0"}
  - component: gpu-worker-impl
    name: handle-ft-command
    kind: rpc
    summary: "collective_rpc handle_ft_command: forwards an FT command to the WorkerSentinel (asserts one exists: enable_fault_tolerance)."
    sources: ["vllm/v1/worker/gpu_worker.py:581-583"]
    latency_ms: 0
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, properties: {instruction: {type: string, examples: [retry]}}}
    response: {type: object, properties: {instruction: {type: string}, done: {type: boolean}}}
    behavior:
      - if: "!config['enable-fault-tolerance']"
        then:
          - title: No WorkerSentinel without enable_fault_tolerance
            source: "vllm/v1/worker/gpu_worker.py:217-218"
            fail: {code: assertion-error, status: 0, message: "assert self.worker_sentinel is not None"}
      - call: worker-sentinel.handle-command
        input: {instruction: "= input.instruction"}
        as: r
      - return: "= vars.r.value"
  - component: gpu-worker-impl
    name: elastic-ep-execute
    kind: rpc
    summary: "collective_rpc elastic_ep_execute: runs one elastic EP scaling method on the worker."
    sources: ["vllm/v1/worker/gpu_worker.py:1636-1637"]
    latency_ms: 0
    request: {type: object, properties: {execute_method: {type: string, examples: [receive_weights]}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    behavior:
      - call: elastic-ep-scaling-executor.execute
        input: {execute_method: "= input.execute_method"}
      - return: {ok: true}
  - component: gpu-worker-impl
    name: shutdown
    kind: rpc
    summary: "collective_rpc shutdown: unfreezes GC, shuts down KV/EC transfer, the profiler, the weight transfer engine and elastic EP, releases the model runner's GPU tensors and the CuMem pools."
    sources: ["vllm/v1/worker/gpu_worker.py:1606-1634"]
    latency_ms: 0
    response: {type: object, properties: {shut_down: {type: boolean}}}
    behavior:
      - if: "state.weight_transfer_engine"
        then:
          - call: weight-transfer-engine.shutdown
            input: {}
      - title: Release model weights, KV caches and workspace
        source: "vllm/v1/worker/gpu_worker.py:1620-1624"
        call: gpu-model-runner.shutdown
        input: {}
      - set: {state.shut_down: true, state.profiler_running: false}
      - return: {shut_down: true}

  # ---- the weight-update session flag (Worker._weight_update_active / _weight_update_is_draft) ----
  - component: weight-update-session
    name: get
    kind: io
    summary: "Reads the worker's weight-update session flags (no session: inactive)."
    sources: ["vllm/v1/worker/gpu_worker.py:226-227"]
    latency_ms: 0
    store: {table: sessions, op: get, key: "session", default: {active: false, is_draft: false}}
  - component: weight-update-session
    name: claim
    kind: io
    summary: "Opens a session only when none is active (the check-then-set of _start_weight_update, on the worker's single RPC thread)."
    sources: ["vllm/v1/worker/gpu_worker.py:1534-1548"]
    latency_ms: 0
    errors: [{code: session-active, status: 0, retryable: false}]
    request: {type: object, properties: {is_draft: {type: boolean, default: false}}}
    store: {table: sessions, op: put, key: "session", value: {active: true, is_draft: "= input.is_draft"}, where: "row == null || !row.active", conflict: session-active}
  - component: weight-update-session
    name: release
    kind: io
    summary: "Ends the session (finish, a failed chunk, or a failed start)."
    sources: ["vllm/v1/worker/gpu_worker.py:1581-1600"]
    latency_ms: 0
    errors: [{code: no-session, status: 0, retryable: false}]
    store: {table: sessions, op: put, key: "session", value: {active: false, is_draft: false}, where: "row != null && row.active", conflict: no-session}
