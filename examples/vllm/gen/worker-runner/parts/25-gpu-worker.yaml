  # ================= weight transfer (RL weight sync) =================
  - component: gpu-worker-impl
    name: init-weight-transfer-engine
    kind: rpc
    summary: "collective_rpc init_weight_transfer_engine: requires weight_transfer_config; parses init info and connects the engine to the trainer."
    sources: ["vllm/v1/worker/gpu_worker.py:1477-1496"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}]
    request: {type: object, properties: {init_info: {type: object}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    behavior:
      - if: "!state.weight_transfer_engine"
        then:
          - title: Weight transfer not configured
            source: "vllm/v1/worker/gpu_worker.py:1477-1482"
            fail: {code: runtime-error, status: 0, message: "Weight transfer not configured. Please set weight_transfer_config to enable weight transfer."}
      - call: weight-transfer-engine.init-transfer-engine
        input: {init_info: "= has(input.init_info) ? input.init_info : {}"}
      - return: {ok: true}
  - component: gpu-worker-impl
    name: shutdown-weight-transfer-engine
    kind: rpc
    summary: "collective_rpc shutdown_weight_transfer_engine: releases the trainer connection; refused during an active update."
    sources: ["vllm/v1/worker/gpu_worker.py:1498-1505"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}]
    response: {type: object, properties: {released: {type: boolean}}}
    behavior:
      - call: weight-update-session.get
        input: {}
        as: sess
      - if: "vars.sess.value.active"
        then:
          - fail: {code: runtime-error, status: 0, message: "Cannot release a trainer connection during a weight update"}
      - if: "state.weight_transfer_engine"
        then:
          - call: weight-transfer-engine.shutdown
            input: {}
          - return: {released: true}
      - return: {released: false}
  - component: gpu-worker-impl
    name: start-weight-update
    kind: rpc
    summary: "collective_rpc start_weight_update: opens an update session on the target model; refused when not configured or a session is already active."
    sources: ["vllm/v1/worker/gpu_worker.py:1507-1515"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}]
    response: {type: object, properties: {active: {type: boolean}, is_draft: {type: boolean}}}
    behavior:
      - call: gpu-worker-impl.start-weight-update-session
        input: {is_draft: false}
        as: s
      - return: "= vars.s.value"
  - component: gpu-worker-impl
    name: start-draft-weight-update
    kind: rpc
    summary: "collective_rpc start_draft_weight_update: like start_weight_update but retargets the engine at the speculative draft model."
    sources: ["vllm/v1/worker/gpu_worker.py:1517-1522"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}]
    response: {type: object, properties: {active: {type: boolean}, is_draft: {type: boolean}}}
    behavior:
      - call: gpu-worker-impl.start-weight-update-session
        input: {is_draft: true}
        as: s
      - return: "= vars.s.value"
  - component: gpu-worker-impl
    name: start-weight-update-session
    kind: function
    summary: "_start_weight_update: the shared checks and the session flag."
    sources: ["vllm/v1/worker/gpu_worker.py:1524-1548"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}]
    request: {type: object, properties: {is_draft: {type: boolean}}}
    response: {type: object, properties: {active: {type: boolean}, is_draft: {type: boolean}}}
    behavior:
      - if: "!state.weight_transfer_engine"
        then:
          - fail: {code: runtime-error, status: 0, message: "Weight transfer not configured. Please set weight_transfer_config to enable weight transfer."}
      - if: "input.is_draft"
        then:
          - title: A draft update needs a draft model
            source: "vllm/v1/worker/gpu_worker.py:1148-1163"
            if: "config['speculative-method'] == ''"
            then:
              - fail: {code: runtime-error, status: 0, message: "Draft model weight update requested, but no draft model is configured."}
      - title: One session at a time (the flag is checked and set on the worker's single RPC thread)
        source: "vllm/v1/worker/gpu_worker.py:1534-1538"
        call: weight-update-session.claim
        input: {is_draft: "= input.is_draft"}
        on_error:
          - fail: {code: runtime-error, status: 0, message: "start_weight_update called while a weight update is already active. Call finish_weight_update first."}
      - call: weight-transfer-engine.start-weight-update
        input: {}
        on_error:
          - title: A failed start resets the target and leaves no session
            source: "vllm/v1/worker/gpu_worker.py:1540-1546"
            call: weight-update-session.release
            input: {}
          - fail: "= error"
      - return: {active: true, is_draft: "= input.is_draft"}
  - component: gpu-worker-impl
    name: update-weights
    kind: rpc
    summary: "collective_rpc update_weights: loads one chunk into the session's model; a list is indexed by dp_index * world_size + rank. A failing chunk ends the session."
    sources: ["vllm/v1/worker/gpu_worker.py:1550-1585"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}]
    request: {type: object, properties: {update_info: {type: object}}}
    response: {type: object, properties: {chunks: {type: integer}}}
    behavior:
      - if: "!state.weight_transfer_engine"
        then:
          - fail: {code: runtime-error, status: 0, message: "Weight transfer not configured. Please set weight_transfer_config to enable weight transfer."}
      - call: weight-update-session.get
        input: {}
        as: sess
      - if: "!vars.sess.value.active"
        then:
          - title: update_weights before start_weight_update
            source: "vllm/v1/worker/gpu_worker.py:1567-1570"
            fail: {code: runtime-error, status: 0, message: "start_weight_update must be called before update_weights."}
      - call: weight-transfer-engine.update-weights
        input: {update_info: "= has(input.update_info) ? input.update_info : {}"}
        as: up
        on_error:
          - title: A failed chunk resets the session
            source: "vllm/v1/worker/gpu_worker.py:1581-1585"
            call: weight-update-session.release
            input: {}
          - fail: "= error"
      - set: {state.weight_chunks: "= (has(state.weight_chunks) ? state.weight_chunks : 0) + 1"}
      - return: {chunks: "= state.weight_chunks"}
  - component: gpu-worker-impl
    name: finish-weight-update
    kind: rpc
    summary: "collective_rpc finish_weight_update: closes the session; a non-draft update resets LoRA state because weight transfer bypasses reload_weights."
    sources: ["vllm/v1/worker/gpu_worker.py:1587-1604"]
    latency_ms: 0
    errors: [{code: runtime-error, status: 0, retryable: false}]
    response: {type: object, properties: {finished: {type: boolean}, lora_reset: {type: boolean}}}
    behavior:
      - if: "!state.weight_transfer_engine"
        then:
          - fail: {code: runtime-error, status: 0, message: "Weight transfer not configured. Please set weight_transfer_config to enable weight transfer."}
      - call: weight-update-session.get
        input: {}
        as: sess
      - if: "!vars.sess.value.active"
        then:
          - fail: {code: runtime-error, status: 0, message: "finish_weight_update called without a matching start_weight_update."}
      - call: weight-transfer-engine.finish-weight-update
        input: {}
      - call: weight-update-session.release
        input: {}
      - if: "!vars.sess.value.is_draft"
        then:
          - title: Reset LoRA state after a target-model update
            source: "vllm/v1/worker/gpu_worker.py:1602-1604"
            call: gpu-model-runner.reset-lora-state
            input: {}
          - return: {finished: true, lora_reset: true}
      - return: {finished: true, lora_reset: false}
  - component: gpu-worker-impl
    name: supports-draft-weight-updates
    kind: rpc
    summary: "collective_rpc supports_draft_weight_updates: true only with a weight transfer engine that supports drafts and a configured draft model."
    sources: ["vllm/v1/worker/gpu_worker.py:1135-1146"]
    latency_ms: 0
    response: {type: object, properties: {supported: {type: boolean}}}
    behavior:
      - if: "state.weight_transfer_engine && config['speculative-method'] != '' && config['speculative-method'] != 'ngram'"
        then: [{return: {supported: true}}]
      - return: {supported: false}

