# Area seed (RECONCILE decision 10): worker-runner's device and runner facts for the merged
# full-* worlds. Plain component keys; every rank starts the same.
fixtures:
  - id: worker-runner-seed
    summary: "A serving GPU worker after startup: V2 runner, Llama-3.1-8B loaded, KV cache sized (28,488 blocks on an H100 at 0.92), CUDA graphs captured for sizes up to 512."
    state:
      gpu-worker-impl: {device_initialized: true, runner: v2, init_free_memory: 85899345920, requested_memory: 79027398247, num_gpu_blocks: 0, bytes_per_block: 2097152}
      gpu-model-runner: {model_loaded: true, kv_cache_initialized: true, num_blocks: 28488}
      cuda-graph-manager: {graphs_captured: true}
  # Round 5: the model-type worlds' own KV numbers (each world's checkpoint, same H100 and 0.92 budget).
  # Each is what wr-load-model + wr-determine-available-memory compute there (bytes per block =
  # 2 * 16 * kv heads per rank * 128 * kv dtype bytes * layers; blocks = available // that).
  - id: worker-runner-moe-mixtral-8x7b-tp2-ep
    summary: "Mixtral-8x7B at TP 2: 46.7 GB of weights per rank, 4 KV heads per rank x 32 layers in bf16 = 1 MiB per block, 29,103,380,071 bytes available = 27,755 blocks per rank."
    attributes: {variant_of: moe-mixtral-8x7b-tp2-ep}
    state:
      gpu-worker-impl: {bytes_per_block: 1048576}
      gpu-model-runner: {num_blocks: 27755}
  - id: worker-runner-vl-qwen2-vl-7b
    summary: "Qwen2-VL-7B: 16.6 GB of weights, 4 KV heads x 28 layers in bf16 = 896 KiB per block, 59,223,421,543 bytes available = 64,548 blocks."
    attributes: {variant_of: vl-qwen2-vl-7b}
    state:
      gpu-worker-impl: {bytes_per_block: 917504}
      gpu-model-runner: {num_blocks: 64548}
  - id: worker-runner-fp8-llama-3-8b
    summary: "Llama-3-8B FP8 checkpoint, KV cache auto (bf16): 9.08 GB of weights, 2 MiB per block, 66,724,972,135 bytes available = 31,816 blocks."
    attributes: {variant_of: fp8-llama-3-8b}
    state:
      gpu-worker-impl: {bytes_per_block: 2097152}
      gpu-model-runner: {num_blocks: 31816}
  - id: worker-runner-fp8-llama-3-8b-kv-fp8
    summary: "The FP8 checkpoint with --kv-cache-dtype fp8: 1-byte KV elements, 1 MiB per block, 63,633 blocks from the same budget."
