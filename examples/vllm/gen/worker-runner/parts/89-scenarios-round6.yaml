# Fix round 6 (mechanism coverage) scenarios: oracle4 / judge4 absent mechanisms.
scenarios:
  - id: wr-r6-logprobs-returned
    name: "oracle4: sample_tokens returns the sampler's top-k logprobs (sampled token first, rank 1 for greedy) and prompt logprobs (one row per prompt position after the first) in the ModelRunnerOutput"
    description: "sampler.py:171-218, logprob.py:122-133, prompt_logprob.py:120-230, async_utils.py:173-200. The batch's num_logprobs is the largest request's; a request without prompt_logprobs has no prompt_logprobs_dict entry."
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: wr-execute-model
        as: e
        input:
          total_num_scheduled_tokens: 8
          num_scheduled_tokens: {lp: 4, nolp: 4}
          scheduled_new_reqs:
            - {req_id: lp, block_ids: [1], num_computed_tokens: 0, prompt_token_ids: [128000, 4438, 2362, 527], sampling_params: {temperature: 0.0, logprobs: 2, prompt_logprobs: 1}}
            - {req_id: nolp, block_ids: [2], num_computed_tokens: 0, prompt_token_ids: [128000, 4438, 2362, 528], sampling_params: {temperature: 0.0}}
      - {flow: wr-sample-tokens, as: s}
      - flow: wr-execute-model
        as: e2
        input:
          total_num_scheduled_tokens: 4
          num_scheduled_tokens: {plain: 4}
          scheduled_new_reqs:
            - {req_id: plain, block_ids: [3], num_computed_tokens: 0, prompt_token_ids: [128000, 4438, 2362, 529], sampling_params: {temperature: 0.0}}
      - {flow: wr-sample-tokens, as: s2}
    expect:
      - "steps.e.result.ok && steps.s.result.ok && steps.s.result.value.logprobs != null"
      - "size(steps.s.result.value.logprobs.logprob_token_ids) == 2 && steps.s.result.value.logprobs.logprob_token_ids.all(r, size(r) == 3)"
      - "steps.s.result.value.req_ids.all(id, steps.s.result.value.logprobs.logprob_token_ids[steps.s.result.value.req_ids.indexOf(id)][0] == steps.s.result.value.sampled_token_ids[steps.s.result.value.req_ids.indexOf(id)][0] && steps.s.result.value.logprobs.logprob_token_ids[steps.s.result.value.req_ids.indexOf(id)][1] == steps.s.result.value.sampled_token_ids[steps.s.result.value.req_ids.indexOf(id)][0])"
      - "steps.s.result.value.logprobs.sampled_token_ranks == [1, 1]"
      - "'lp' in steps.s.result.value.prompt_logprobs_dict && !('nolp' in steps.s.result.value.prompt_logprobs_dict)"
      - "steps.s.result.value.prompt_logprobs_dict['lp'].logprob_token_ids.map(r, r[0]) == [4438, 2362, 527] && steps.s.result.value.prompt_logprobs_dict['lp'].logprob_token_ids.all(r, size(r) == 2)"
      - "steps.s2.result.ok && steps.s2.result.value.logprobs == null && size(steps.s2.result.value.prompt_logprobs_dict) == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'llama-for-causal-lm.compute-logits' && e.input.num_tokens == 4)"
  - id: wr-r6-chunked-prompt-logprobs
    name: "A chunked prompt's prompt logprobs are held until its last chunk, which returns every prompt position after the first"
    description: "prompt_logprob.py:186-228: is_prompt_chunked keeps the chunk in in_progress_prompt_logprobs; the last chunk drops its final row and concatenates."
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: wr-execute-model
        as: e1
        input:
          total_num_scheduled_tokens: 4
          num_scheduled_tokens: {ch: 4}
          scheduled_new_reqs:
            - {req_id: ch, block_ids: [1], num_computed_tokens: 0, prompt_token_ids: [128000, 11, 12, 13, 14, 15, 16, 17], sampling_params: {temperature: 0.0, prompt_logprobs: 0}}
      - {flow: wr-sample-tokens, as: s1}
      - flow: wr-execute-model
        as: e2
        input:
          total_num_scheduled_tokens: 4
          num_scheduled_tokens: {ch: 4}
          scheduled_new_reqs: []
          scheduled_cached_reqs: {req_ids: [ch], num_computed_tokens: [4], new_block_ids: [[]]}
      - {flow: wr-sample-tokens, as: s2}
    expect:
      - "steps.s1.result.ok && size(steps.s1.result.value.prompt_logprobs_dict) == 0 && steps.s1.result.value.sampled_token_ids == [[]]"
      - "steps.s2.result.ok && steps.s2.result.value.prompt_logprobs_dict['ch'].logprob_token_ids.map(r, r[0]) == [11, 12, 13, 14, 15, 16, 17]"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'llama-for-causal-lm.compute-logits' && e.input.num_tokens == 4)"
  - id: wr-r6-bad-word-changes-sample
    name: "oracle4: a one-token bad word equal to the greedy token makes the row sample another token"
    description: "bad_words.py:79-91,165: the kernel stores -inf at the bad word's last token before the argmax."
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: wr-execute-model
        as: e1
        input:
          total_num_scheduled_tokens: 5
          num_scheduled_tokens: {p1: 5}
          scheduled_new_reqs:
            - {req_id: p1, block_ids: [1], num_computed_tokens: 0, prompt_token_ids: [128000, 4438, 2362, 527, 220], sampling_params: {temperature: 0.0}}
      - {flow: wr-sample-tokens, as: s1}
      - flow: wr-execute-model
        as: e2
        input:
          total_num_scheduled_tokens: 5
          num_scheduled_tokens: {p2: 5}
          scheduled_new_reqs:
            - {req_id: p2, block_ids: [2], num_computed_tokens: 0, prompt_token_ids: [128000, 4438, 2362, 527, 220], sampling_params: {temperature: 0.0, bad_words_token_ids: "= [[steps.s1.result.value.sampled_token_ids[0][0]]]"}}
      - {flow: wr-sample-tokens, as: s2}
    expect:
      - "steps.s1.result.ok && steps.s2.result.ok"
      - "steps.s2.result.value.sampled_token_ids[0][0] != steps.s1.result.value.sampled_token_ids[0][0]"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'bad-words-state.apply' && size(e.output.masked) == 1)"
  - id: wr-r6-prepare-attn-positions
    name: "oracle4: a hybrid model's MambaHybridModelState.prepare_attn and a plain model's DefaultModelState.prepare_attn pass the batch's positions to build_attn_metadata"
    description: "mamba_hybrid.py:230-341 (positions=input_batch.positions at :339), default.py:213-235, attn_utils.py:523-545 (CommonAttentionMetadata.positions)."
    fixtures: [full-tp1-llama-8b]
    state:
      gpu-model-runner:
        model: {architecture: HybridTestModel, dtype_bytes: 2, head_size: 128, hidden_size: 4096, is_hybrid: true, num_hidden_layers: 32, num_kv_heads: 8, uses_mrope: false, uses_prompt_embeds: false, vocab_size: 128256}
    steps:
      - flow: wr-execute-model
        as: e
        input:
          total_num_scheduled_tokens: 8
          num_scheduled_tokens: {hy: 8}
          scheduled_new_reqs:
            - {req_id: hy, block_ids: [5], num_computed_tokens: 0, prompt_token_ids: [1, 2, 3, 4, 5, 6, 7, 8]}
      - {flow: wr-sample-tokens, as: s}
    expect:
      - "steps.e.result.ok && steps.s.result.ok"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'mamba-hybrid-model-state.prepare-attn' && e.output.mamba.is_prefilling == [true] && e.output.positions == [0, 1, 2, 3, 4, 5, 6, 7])"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'flash-attention-metadata-builder.build' && e.input.common.positions == [0, 1, 2, 3, 4, 5, 6, 7])"
  - id: wr-r6-default-prepare-attn-decode-positions
    name: "A plain model's decode step: DefaultModelState.prepare_attn passes the positions after the computed tokens"
    description: "default.py:213-235; positions = num_computed_tokens + j (input_batch.py prepare_pos_seq_lens)."
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: wr-execute-model
        as: e1
        input:
          total_num_scheduled_tokens: 4
          num_scheduled_tokens: {d: 4}
          scheduled_new_reqs:
            - {req_id: d, block_ids: [5], num_computed_tokens: 0, prompt_token_ids: [128000, 9906, 1917, 13]}
      - {flow: wr-sample-tokens, as: s1}
      - flow: wr-execute-model
        as: e2
        input:
          total_num_scheduled_tokens: 1
          num_scheduled_tokens: {d: 1}
          scheduled_new_reqs: []
          scheduled_cached_reqs: {req_ids: [d], num_computed_tokens: [4], new_block_ids: [[]]}
      - {flow: wr-sample-tokens, as: s2}
    expect:
      - "steps.e2.result.ok && steps.s2.result.ok"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'flash-attention-metadata-builder.build').map(e, e.input.common.positions) == [[0, 1, 2, 3], [4]]"
  - id: wr-r6-min-tokens-enables-logit-bias
    name: "judge4: min_tokens alone enables the logit-bias stage (all_stop_token_ids always holds EOS), even with ignore_eos and no stop_token_ids"
    description: "logit_bias.py:96-112 keys on sampling_params.all_stop_token_ids; sampling_params.py:781-784 adds the EOS even under ignore_eos."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: sampler.add-request, caller: gpu-model-runner, input: {slot: 5, sampling_params: {temperature: 0.0, min_tokens: 3, ignore_eos: true}}, as: mt}
      - {interface: sampler.add-request, caller: gpu-model-runner, input: {slot: 6, sampling_params: {temperature: 0.0}}, as: plain}
    expect:
      - "steps.mt.result.value.needs_processing && !steps.plain.result.value.needs_processing"
      - "state['sampler@rank0'].slots['5'].logit_bias && !state['sampler@rank0'].slots['6'].seeded"
  - id: wr-r6-pooling-chunked-and-task
    name: "A pooling model: the runner keeps each request's pooling params, runs the model's pooler, and returns no output for a prompt still being prefilled; an unsupported task is refused with the supported list"
    description: "pooling_runner.py:66-88 (add_request, the ValueError text), :139-170 (pool and the finished mask), model_runner.py:1204-1211, 2306-2327."
    fixtures: [full-tp1-llama-8b]
    state:
      gpu-worker-impl: {is_pooling_model: true}
      gpu-model-runner: {is_pooling_model: true}
    steps:
      - flow: wr-execute-model
        as: e1
        input:
          total_num_scheduled_tokens: 4
          num_scheduled_tokens: {emb-a: 4}
          scheduled_new_reqs:
            - {req_id: emb-a, block_ids: [1], num_computed_tokens: 0, prompt_token_ids: [128000, 11, 12, 13, 14, 15, 16, 17], pooling_params: {task: embed}}
      - flow: wr-execute-model
        as: e2
        input:
          total_num_scheduled_tokens: 4
          num_scheduled_tokens: {emb-a: 4}
          scheduled_new_reqs: []
          scheduled_cached_reqs: {req_ids: [emb-a], num_computed_tokens: [4], new_block_ids: [[]]}
      - interface: pooling-runner.add-request
        caller: gpu-model-runner
        input: {req_id: gen-x, slot: 3, pooling_params: {task: generate}, supported_tasks: [token_embed, embed]}
        as: bad
    expect:
      - "steps.e1.result.ok && steps.e1.result.value.pooler_output == [null]"
      - "steps.e2.result.ok && size(steps.e2.result.value.pooler_output) == 1 && steps.e2.result.value.pooler_output[0] != null"
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'value-error' && steps.bad.result.error.message == \"Unsupported task: 'generate'. Supported tasks: ['embed', 'token_embed']\""
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'dispatch-pooler.forward' && e.input.requests[0].task == 'embed' && e.input.requests[0].prompt_len == 8)"
  - id: wr-r6-breakable-cudagraph-capture-then-replay
    name: "VLLM_USE_BREAKABLE_CUDAGRAPH: a PIECEWISE step goes through BreakableCUDAGraphWrapper; the first of a descriptor captures and runs the model, the next replays without entering it"
    description: "cudagraph_utils.py:189-194, 565-576 (run_pw_graph), breakable_cudagraph.py:318-343; without the env the compiled model runs (model_runner.py:2034-2042)."
    fixtures: [full-tp1-llama-8b]
    config: {vllm-use-breakable-cudagraph: true}
    steps:
      - {interface: cuda-graph-manager.run-pw-graph, caller: gpu-model-runner, as: first, input: {num_tokens: 16, num_prefill_tokens: 16, num_decode_reqs: 0, num_layers: 32}}
      - {interface: cuda-graph-manager.run-pw-graph, caller: gpu-model-runner, as: second, input: {num_tokens: 16, num_prefill_tokens: 16, num_decode_reqs: 0, num_layers: 32}}
    expect:
      - "steps.first.result.ok && steps.second.result.ok && steps.second.result.value.path == 'replay'"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'breakable-cuda-graph-wrapper.call').map(e, e.output.path) == ['capture', 'replay']"
      - "calls['llama-for-causal-lm.forward'] == 1"
  - id: wr-r6-eplb-unregistered-model-no-step
    name: "With EPLB on but no MoE model registered, a dummy run does not step EplbState; skip_eplb skips it too"
    description: "eplb_utils.py:46-62, 167-174; model_runner.py:817."
    fixtures: [full-tp1-llama-8b]
    config: {enable-eplb: true}
    steps:
      - {interface: gpu-model-runner.dummy-run, caller: gpu-worker-impl, as: unregistered, input: {num_tokens: 1, uniform_decode: true}}
      - {interface: gpu-model-runner.dummy-run, caller: gpu-worker-impl, as: skipped, input: {num_tokens: 1, uniform_decode: true, skip_eplb: true}}
    expect:
      - "steps.unregistered.result.ok && steps.skipped.result.ok"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'eplb-state.step')"
  - id: wr-r6-eplb-profile-run-steps-state
    name: "The profile run's dummy forward steps EPLB with is_profile on each rank of an MoE model, (a dummy step, flags from the run)"
    description: "profile_run -> _dummy_run(is_profile=True) under @step_eplb_after(is_dummy=True) (model_runner.py:817, 1003-1008; eplb_utils.py:46-62, 167-177); EplbState.step's profile branch (eplb_state.py:587-589)."
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-eplb: true}
    steps:
      - {flow: wr-load-model, on: rank0, as: load0}
      - {flow: wr-load-model, on: rank1, as: load1}
      - {flow: wr-determine-available-memory, on: rank0, as: prof0, await: false}
      - {flow: wr-determine-available-memory, on: rank1, as: prof1}
    expect:
      - "steps.prof0.result.ok && steps.prof1.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'eplb-state.step' && e.input.is_profile && e.input.is_dummy)"
  - id: wr-r6-forward-dispatch-resolves-architecture
    name: "In a world that never ran load_model, the forward goes to the class the registry resolves for the architecture, not to Llama"
    description: "registry.py:1376-1428; model_runner.py:2043-2044 runs self.model. The Qwen3-VL class isn't loaded in this world, so its forward raises; the point is which class runs."
    fixtures: [full-vl-qwen2-vl-7b]
    state:
      gpu-model-runner:
        model: {name: Qwen/Qwen3-VL-8B-Instruct, architecture: Qwen3VLForConditionalGeneration, num_hidden_layers: 36, num_kv_heads: 8, head_size: 128, dtype_bytes: 2, vocab_size: 151936, hidden_size: 4096, is_hybrid: false, uses_mrope: true, uses_prompt_embeds: false}
    steps:
      - {interface: gpu-model-runner.dummy-run, caller: gpu-worker-impl, as: d, input: {num_tokens: 1, uniform_decode: true, skip_eplb: true}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'qwen3-vl-for-conditional-generation.forward')"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'llama-for-causal-lm.forward')"
  - id: wr-r6-dummy-run-dp2-moe-forward-context
    name: "A dummy run of a MoE model under data parallelism runs its forward inside set_forward_context, which builds DPMetadata with this DP rank's token count before the model runs"
    description: "model_runner.py:2008-2027; forward_context.py:309-326. Each DP rank (TP 1) fills its own entry. The forward then stops in moe-runner on the seeded world's missing EP group (parallel-state), so this asserts the context, not a finished forward."
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {data-parallel-size: 2, tensor-parallel-size: 1, enable-expert-parallel: false}
    steps:
      - {flow: wr-load-model, on: rank1, as: load1}
      - {interface: gpu-model-runner.dummy-run, caller: gpu-worker-impl, on: rank1, as: d1, input: {num_tokens: 16, uniform_decode: false, is_profile: true, skip_eplb: true}}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'forward-context.set-forward-context' && e.output.dp_metadata.num_tokens_across_dp_cpu == [0, 16])"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'mixtral-for-causal-lm.forward')"
  - id: wr-r6-worker-seeds-from-config
    name: "A worker seeds from --seed at init_device and reseeds with its data-parallel index after warmup"
    description: "gpu_worker.py:520-521, 1060-1064; torch_utils.py:542-553."
    fixtures: [full-tp1-llama-8b]
    config: {seed: 1234}
    steps:
      - {flow: wr-init-device, as: i}
      - {flow: wr-load-model, as: l}
      - {flow: wr-compile-or-warm-up, as: w}
    expect:
      - "steps.i.result.ok && steps.w.result.ok"
      - "state['gpu-worker-impl@rank0'].random_seed == 1234 && state['gpu-worker-impl@rank0'].random_seed_dp_index == 0"
  - id: wr-r6-kv-spec-reads-resolved-cache-dtype
    name: "get_kv_cache_spec reads the resolved cache_config.cache_dtype: a config that resolved auto to fp8_e4m3 halves the worker's page"
    description: "arg_utils.py:2256-2259; torch_utils.py:512-529; attention.py:323-325."
    fixtures: [full-fp8-llama-3-8b]
    state:
      vllm-config: {resolved: {cache_config: {cache_dtype: fp8_e4m3}}}
    steps:
      - {interface: gpu-model-runner.get-kv-cache-spec, caller: gpu-worker-impl, as: spec}
    expect:
      - "steps.spec.result.value.page_size_bytes == 32768"

  - id: wr-r6-breakable-cudagraph-release-clears
    name: "Dropping the graph manager with VLLM_USE_BREAKABLE_CUDAGRAPH clears the wrapper's entries, so real capture doesn't replay a profiling graph"
    description: "cudagraph_utils.py:403-406, 961-962; breakable_cudagraph.py:271-273, 313-314."
    fixtures: [full-tp1-llama-8b]
    config: {vllm-use-breakable-cudagraph: true}
    steps:
      - {interface: cuda-graph-manager.run-pw-graph, caller: gpu-model-runner, as: first, input: {num_tokens: 16, num_prefill_tokens: 16, num_decode_reqs: 0, num_layers: 32}}
      - {interface: cuda-graph-manager.release, caller: gpu-model-runner, as: rel}
      - {interface: cuda-graph-manager.run-pw-graph, caller: gpu-model-runner, as: again, input: {num_tokens: 16, num_prefill_tokens: 16, num_decode_reqs: 0, num_layers: 32}}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'breakable-cuda-graph-wrapper.call').map(e, e.output.path) == ['capture', 'capture']"
      - "calls['breakable-cuda-graph-wrapper.clear-all-graphs'] == 1"
  - id: wr-r6-profile-run-profiles-encoder
    name: "A multimodal model's profile_run builds the MultiModalBudget and runs the encoder tower on the largest item; --skip-mm-profiling doesn't"
    description: "model_runner.py:993-1001; encoder_budget.py:115-140, 193-218; encoder_runner.py:111-147. Qwen2-VL at max_model_len 32768: one video item of 32768 tokens."
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {flow: wr-load-model, on: rank0, as: load}
      - {interface: encoder-runner.profile-encoder-cache, caller: gpu-model-runner, on: rank0, as: enc}
    expect:
      - "steps.enc.result.ok && steps.enc.result.value == {'profiled': true, 'modality': 'video', 'num_items': 1, 'encoder_budget': 32768}"
      - "calls['qwen2-vl-for-conditional-generation.embed-multimodal'] == 1 && trace.exists(e, e.type == 'call.start' && e.interface == 'qwen2-vl-for-conditional-generation.embed-multimodal' && e.input.mm_kwargs[0].grid_thw == [2, 256, 256])"
  - id: wr-r6-skip-mm-profiling
    name: "--skip-mm-profiling leaves the encoder out of the profile run"
    description: "model_runner.py:993-995."
    fixtures: [full-vl-qwen2-vl-7b]
    config: {skip-mm-profiling: true}
    steps:
      - {flow: wr-load-model, on: rank0, as: load}
      - {interface: gpu-model-runner.profile-run, caller: gpu-worker-impl, on: rank0, as: prof}
    expect:
      - "steps.prof.result.ok && calls['encoder-runner.profile-encoder-cache'] == 0 && !trace.exists(e, e.type == 'call.start' && e.interface == 'qwen2-vl-for-conditional-generation.embed-multimodal')"
