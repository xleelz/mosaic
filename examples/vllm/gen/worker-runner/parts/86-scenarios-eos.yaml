scenarios:
- id: wr-eos-at-natural-length
  name: A greedy request samples EOS at its natural length; min_tokens holds EOS back until enough tokens exist
  description: Natural length fixed to 3 (base 3, spread 1). The prefill samples output token 0, the decodes tokens 1 and 2; token 2 is EOS (128009). With min_tokens 5 the same position samples an ordinary
    token.
  fixtures:
  - full-tp1-llama-8b
  config:
    worker-runner-natural-output-tokens-base: 3
    worker-runner-natural-output-tokens-spread: 1
  steps:
  - flow: wr-execute-model
    as: e0
    input:
      scheduled_new_reqs:
      - req_id: chatcmpl-eos1
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        - 30
        block_ids:
        - 1
        num_computed_tokens: 0
        sampling_params:
          temperature: 0.0
      - req_id: chatcmpl-min5
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        - 30
        block_ids:
        - 2
        num_computed_tokens: 0
        sampling_params:
          temperature: 0.0
          min_tokens: 5
      num_scheduled_tokens:
        chatcmpl-eos1: 4
        chatcmpl-min5: 4
      total_num_scheduled_tokens: 8
  - flow: wr-sample-tokens
    as: s0
  - flow: wr-execute-model
    as: e1
    input:
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-eos1
        - chatcmpl-min5
        num_computed_tokens:
        - 4
        - 4
        new_block_ids:
        - []
        - []
      num_scheduled_tokens:
        chatcmpl-eos1: 1
        chatcmpl-min5: 1
      total_num_scheduled_tokens: 2
  - flow: wr-sample-tokens
    as: s1
  - flow: wr-execute-model
    as: e2
    input:
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-eos1
        - chatcmpl-min5
        num_computed_tokens:
        - 5
        - 5
        new_block_ids:
        - []
        - []
      num_scheduled_tokens:
        chatcmpl-eos1: 1
        chatcmpl-min5: 1
      total_num_scheduled_tokens: 2
  - flow: wr-sample-tokens
    as: s2
  expect:
  - steps.s0.result.value.sampled_token_ids.all(t, t[0] != 128009) && steps.s1.result.value.sampled_token_ids.all(t, t[0] != 128009)
  - steps.s2.result.value.req_ids == ['chatcmpl-eos1', 'chatcmpl-min5']
  - steps.s2.result.value.sampled_token_ids[0] == [128009] && steps.s2.result.value.sampled_token_ids[1] != [128009]
  - trace.filter(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.sample-tokens').size() == 3
- id: wr-eos-finishes-generation
  name: 'End to end: generation stops with finish_reason stop when the model samples EOS, before max_tokens'
  description: The worker samples EOS at the natural length (3 here); the scheduler's check_stop (sched/utils.py) finishes the request as FINISHED_STOPPED and the output processor reports finish_reason
    stop. With ignore_eos the same request runs to max_tokens.
  fixtures:
  - full-tp1-llama-8b
  config:
    worker-runner-natural-output-tokens-base: 3
    worker-runner-natural-output-tokens-spread: 1
  steps:
  - flow: engine-core-busy-loop
    as: loop
    await: false
    input:
      iterations: 40
  - flow: async-llm-generate
    as: gen
    at_ms: 0
    input:
      request_id: chatcmpl-eos2
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      priority: 0
      sampling_params:
        max_tokens: 16
        n: 1
        stop: []
        temperature: 0.0
  expect:
  - steps.gen.result.ok && steps.gen.result.value.value.finished
  - steps.gen.result.value.value.finish_reason == 'stop' && size(steps.gen.result.value.value.token_ids) <= 3
  - trace.exists(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.sample-tokens' && e.output != null && has(e.output.sampled_token_ids) && e.output.sampled_token_ids.exists(t, t == [128009]))
