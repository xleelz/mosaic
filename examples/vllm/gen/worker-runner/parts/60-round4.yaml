  - component: runner-kv-connector
    name: pre-forward
    kind: function
    summary: "KVConnector.pre_forward: a no-op without a connector; ActiveKVConnector binds the scheduler output's connector metadata (asserting it is there) before the forward."
    sources: ["vllm/v1/worker/gpu/kv_connector.py:33-40", "vllm/v1/worker/gpu/kv_connector.py:70-92"]
