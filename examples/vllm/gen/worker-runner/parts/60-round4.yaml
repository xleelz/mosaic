    summary: "KVConnector.no_forward: a step with no tokens to run still drives the connector (pre_forward, finish, post_forward) and returns a ModelRunnerOutput carrying only the KV connector output; without a connector, the empty output."
    sources: ["vllm/v1/worker/gpu/kv_connector.py:47-48", "vllm/v1/worker/gpu/kv_connector.py:153-161"]
    latency_ms: 0
    request: {type: object, properties: {kv_connector_metadata: {type: ["object", "null"], default: null}, finished_req_ids: {type: array, items: {type: string}, default: []}}}
