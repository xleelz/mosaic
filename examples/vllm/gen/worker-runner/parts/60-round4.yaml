  # ---------------- forward context ----------------
  - component: forward-context
    name: set-forward-context
    kind: function
    summary: "set_forward_context (entering the context manager): with data parallelism above 1 (or sequence-parallel MoE) on a MoE model it builds DPMetadata, asserting this rank's entry in num_tokens_across_dp equals num_tokens (a single-rank count when DP is 1); with a CUDA graph mode other than NONE and num_tokens it fills in a BatchDescriptor(num_tokens) when none is given; then the new ForwardContext replaces the current one (the previous is restored on exit)."
    sources: ["vllm/forward_context.py:277-362", "vllm/forward_context.py:88-108", "vllm/forward_context.py:230-276", "vllm/forward_context.py:30-58"]
    latency_ms: 0
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      properties:
        num_tokens: {type: ["integer", "null"], default: null}
        num_tokens_across_dp: {type: ["array", "null"], default: null, items: {type: integer}}
        cudagraph_runtime_mode: {type: string, default: NONE, enum: [NONE, PIECEWISE, FULL]}
        batch_descriptor: {type: ["object", "null"], default: null}
        has_attn_metadata: {type: boolean, default: true}
        is_moe_model: {type: boolean, default: false}
        dp_rank: {type: integer, default: 0}
    response: {type: object, properties: {cudagraph_runtime_mode: {type: string}, batch_descriptor: {type: ["object", "null"]}, dp_metadata: {type: ["object", "null"]}}}
    behavior:
      - set:
          vars.inp: "= merge({'num_tokens': null, 'num_tokens_across_dp': null, 'cudagraph_runtime_mode': 'NONE', 'batch_descriptor': null, 'has_attn_metadata': true, 'is_moe_model': false, 'dp_rank': 0}, input)"
      - set: {vars.dp: null, vars.across: "= vars.inp.num_tokens_across_dp"}
      - if: "int(config['data-parallel-size']) > 1 && vars.inp.is_moe_model && (vars.inp.has_attn_metadata || vars.inp.num_tokens != null)"
        then:
          - if: "vars.across == null"
            then:
              - title: "Without a precomputed count, DP ranks agree on token counts (coordinate_batch_across_dp)"
                source: "vllm/forward_context.py:309-320"
                set: {vars.across: "= lists.range(int(config['data-parallel-size'])).map(r, r == vars.inp.dp_rank ? vars.inp.num_tokens : 0)"}
          - if: "vars.across[vars.inp.dp_rank] != (vars.inp.num_tokens != null ? vars.inp.num_tokens : 0)"
            then:
              - title: This rank's entry must equal its batch size
                source: "vllm/forward_context.py:101-106"
                fail: {code: assertion-error, status: 0, message: "= string(vars.across[vars.inp.dp_rank]) + ' ' + string(vars.inp.num_tokens)"}
          - source: "vllm/forward_context.py:324-326"
            set: {vars.dp: "= {'num_tokens_across_dp_cpu': vars.across}"}
      - title: "A CUDA graph run with num_tokens gets a BatchDescriptor(num_tokens) when none is given"
        source: "vllm/forward_context.py:328-332"
        set:
          vars.bd: "= vars.inp.batch_descriptor != null ? vars.inp.batch_descriptor : (vars.inp.cudagraph_runtime_mode != 'NONE' && vars.inp.num_tokens != null ? dyn({'num_tokens': vars.inp.num_tokens, 'num_reqs': null, 'uniform': false, 'has_lora': false, 'num_active_loras': 0}) : dyn(null))"
      - title: The new context replaces the current one until the block exits
        source: "vllm/forward_context.py:263-276"
        set:
          state.previous: "= state.previous + [state.current]"
          state.current: "= {'cudagraph_runtime_mode': vars.inp.cudagraph_runtime_mode, 'batch_descriptor': vars.bd, 'dp_metadata': vars.dp, 'num_tokens': vars.inp.num_tokens}"
      - return: {cudagraph_runtime_mode: "= vars.inp.cudagraph_runtime_mode", batch_descriptor: "= vars.bd", dp_metadata: "= vars.dp"}
  - component: forward-context
    name: exit-forward-context
    kind: function
    summary: "Leaving set_forward_context: the previous forward context (usually none) is restored."
    sources: ["vllm/forward_context.py:360-363", "vllm/forward_context.py:263-276"]
    latency_ms: 0
    response: {type: object, properties: {restored: {type: ["object", "null"]}}}
    behavior:
      - set:
          vars.prev: "= size(state.previous) > 0 ? state.previous[size(state.previous) - 1] : null"
      - set:
          state.current: "= vars.prev"
          state.previous: "= size(state.previous) > 0 ? state.previous.slice(0, size(state.previous) - 1) : []"
      - return: {restored: "= vars.prev"}
  - component: forward-context
    name: get-forward-context
    kind: function
    summary: "get_forward_context / is_forward_context_available / in_piecewise_cudagraph: the current context; asking outside a forward is an AssertionError."
    sources: ["vllm/forward_context.py:205-228"]
    latency_ms: 0
    errors: [{code: assertion-error, status: 0, retryable: false}]
    response: {type: object, properties: {cudagraph_runtime_mode: {type: string}, batch_descriptor: {type: ["object", "null"]}, in_piecewise_cudagraph: {type: boolean}}}
    behavior:
      - if: "state.current == null"
        then:
          - source: "vllm/forward_context.py:210-213"
            fail: {code: assertion-error, status: 0, message: "Forward context is not set. Please use `set_forward_context` to set the forward context."}
      - return:
          cudagraph_runtime_mode: "= state.current.cudagraph_runtime_mode"
          batch_descriptor: "= state.current.batch_descriptor"
          in_piecewise_cudagraph: "= state.current.cudagraph_runtime_mode == 'PIECEWISE'"

  # ---------------- pooling, V1 spec metadata, encoder cache, EC connector ----------------
  - component: pooling-metadata
    name: build
    kind: function
    summary: "PoolingMetadata.__post_init__: every request's PoolingParams must name a task (ValueError otherwise); the tasks are kept in batch order. Each request also carries its PoolingStates (the hidden-state cache chunked ALL pooling accumulates, cleaned when the request finishes)."
    sources: ["vllm/v1/pool/metadata.py:57-84", "vllm/v1/pool/metadata.py:48-54"]
    latency_ms: 0
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [pooling_params], properties: {pooling_params: {type: array, items: {type: object, properties: {task: {type: ["string", "null"]}}}}, prompt_lens: {type: array, default: [], items: {type: integer}}}}
    response: {type: object, properties: {tasks: {type: array, items: {type: string}}, num_states: {type: integer}}}
    behavior:
      - set: {vars.tasks: "= input.pooling_params.filter(p, has(p.task) && p.task != null).map(p, p.task)"}
      - if: "size(vars.tasks) != size(input.pooling_params)"
        then:
          - source: "vllm/v1/pool/metadata.py:76-81"
            fail: {code: value-error, status: 0, message: "= 'Every pooling param must have a task set, but got ' + string(size(vars.tasks)) + ' tasks for ' + string(size(input.pooling_params)) + ' pooling params'"}
      - return: {tasks: "= vars.tasks", num_states: "= size(input.pooling_params)"}
  - component: spec-decode-metadata-v1
    name: make-dummy
    kind: function
    summary: "SpecDecodeMetadata.make_dummy (V1): from per-request draft ids, the flattened drafts, num_draft_tokens, cumulative draft and sampled (drafts + 1) counts, zeroed logits indices, and max_spec_len."
    sources: ["vllm/v1/spec_decode/metadata.py:26-66"]
    latency_ms: 0
    request: {type: object, required: [draft_token_ids], properties: {draft_token_ids: {type: array, items: {type: array, items: {type: integer}}}}}
    response: {type: object, properties: {draft_token_ids: {type: array}, num_draft_tokens: {type: array}, cu_num_draft_tokens: {type: array}, cu_num_sampled_tokens: {type: array}, num_logits: {type: integer}, max_spec_len: {type: integer}}}
    behavior:
      - set:
          vars.n: "= input.draft_token_ids.map(d, size(d))"
      - return:
          draft_token_ids: "= input.draft_token_ids.flatten()"
          num_draft_tokens: "= vars.n"
          cu_num_draft_tokens: "= lists.range(size(vars.n)).map(i, sum(vars.n.slice(0, i + 1)))"
          cu_num_sampled_tokens: "= lists.range(size(vars.n)).map(i, sum(vars.n.slice(0, i + 1)) + i + 1)"
          num_logits: "= sum(vars.n) + size(vars.n)"
          max_spec_len: "= vars.n.sortBy(x, -x)[0]"
  - component: encoder-cache
    name: add-request
    kind: function
    summary: "EncoderCache.add_request / remove_request: track a request's multimodal features (remove ignores unknown requests)."
    sources: ["vllm/v1/worker/gpu/mm/encoder_cache.py:18-25"]
    latency_ms: 0
    request: {type: object, required: [req_id], properties: {req_id: {type: string}, mm_features: {type: ["array", "null"], default: [], description: "null removes the request"}}}
    response: {type: object, properties: {num_requests: {type: integer}}}
    behavior:
      - if: "input.mm_features == null"
        then:
          - source: "vllm/v1/worker/gpu/mm/encoder_cache.py:24-25"
            set: {state.mm_features: "= omit(state.mm_features, input.req_id)"}
          - return: {num_requests: "= size(state.mm_features)"}
      - set: {state.mm_features: "= merge(state.mm_features, {input.req_id: input.mm_features})"}
      - return: {num_requests: "= size(state.mm_features)"}
  - component: encoder-cache
    name: free-encoder-cache
    kind: function
    summary: "EncoderCache.free_encoder_cache drops one mm hash's encoder output; reset_encoder_cache (after a weight update) drops them all so stale embeddings are never reused; reset_mm_cache is a no-op in V2."
    sources: ["vllm/v1/worker/gpu/mm/encoder_cache.py:27-42"]
    latency_ms: 0
    request: {type: object, properties: {mm_hash: {type: ["string", "null"], default: null, description: "null resets the whole cache"}}}
    response: {type: object, properties: {num_outputs: {type: integer}}}
    behavior:
      - if: "input.mm_hash == null"
        then:
          - source: "vllm/v1/worker/gpu/mm/encoder_cache.py:34-40"
            set: {state.encoder_outputs: {}}
          - return: {num_outputs: 0}
      - source: "vllm/v1/worker/gpu/mm/encoder_cache.py:41-42"
        set: {state.encoder_outputs: "= omit(state.encoder_outputs, input.mm_hash)"}
      - return: {num_outputs: "= size(state.encoder_outputs)"}
  - component: runner-ec-connector
    name: maybe-get-output
    kind: function
    summary: "ECConnector.maybe_get_output: none without a connector or without this step's EC metadata. Otherwise it binds the metadata, a producer starts saving and a consumer starts loading encoder caches, after the encoder runs a producer saves every newly computed mm hash, and finally finished sends and receives are collected and the metadata cleared."
    sources: ["vllm/v1/worker/gpu/ec_connector.py:23-89"]
    latency_ms: 0
    request:
      type: object
      properties:
        ec_connector_metadata: {type: ["object", "null"], default: null}
        is_producer: {type: boolean, default: false}
        is_consumer: {type: boolean, default: false}
        cached_before: {type: array, default: [], items: {type: string}}
        cached_after: {type: array, default: [], items: {type: string}}
    response: {type: ["object", "null"], properties: {started: {type: array}, saved: {type: array}}}
    behavior:
      - if: "input.ec_connector_metadata == null"
        then:
          - source: "vllm/v1/worker/gpu/ec_connector.py:53-55"
            return: null
      - title: Bind the metadata; producers start saving, consumers start loading
        source: "vllm/v1/worker/gpu/ec_connector.py:57-66"
        set:
          vars.started: "= (input.is_producer ? ['save'] : []) + (input.is_consumer ? ['load'] : [])"
      - title: After the encoder, a producer offloads each newly computed encoder output
        source: "vllm/v1/worker/gpu/ec_connector.py:68-74"
        set:
          vars.saved: "= input.is_producer ? input.cached_after.filter(h, !(h in input.cached_before)) : []"
      - source: "vllm/v1/worker/gpu/ec_connector.py:75-81"
        return: {started: "= vars.started", saved: "= vars.saved"}
  - component: cudagraph-dispatcher-v1
    name: initialize-cudagraph-keys
    kind: function
    summary: "CudagraphDispatcher.initialize_cudagraph_keys (V1): nothing with mode NONE; otherwise one mixed-mode key per capture size (PIECEWISE keys drop num_reqs and uniform), plus, when decode runs FULL as a separate routine, FULL uniform-decode keys for capture sizes between the decode query length and max_num_seqs x that length."
    sources: ["vllm/v1/cudagraph_dispatcher.py:164-231"]
    latency_ms: 0
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, required: [cudagraph_mode], properties: {cudagraph_mode: {type: string, enum: [NONE, PIECEWISE, FULL, FULL_DECODE_ONLY, FULL_AND_PIECEWISE]}, uniform_decode_query_len: {type: integer, default: 1}, capture_sizes: {type: ["array", "null"], items: {type: integer}}}}
    response: {type: object, properties: {mixed_keys: {type: array}, decode_keys: {type: array}}}
    behavior:
      - if: "input.cudagraph_mode == 'NONE'"
        then:
          - source: "vllm/v1/cudagraph_dispatcher.py:171-174"
            return: {mixed_keys: [], decode_keys: []}
      - set:
          vars.mixed: "= input.cudagraph_mode in ['PIECEWISE', 'FULL_AND_PIECEWISE'] ? 'PIECEWISE' : (input.cudagraph_mode == 'FULL' ? 'FULL' : 'NONE')"
      - if: "input.capture_sizes == null && (vars.mixed != 'NONE' || input.cudagraph_mode in ['FULL_DECODE_ONLY', 'FULL_AND_PIECEWISE'])"
        then:
          - source: "vllm/v1/cudagraph_dispatcher.py:187-189"
            fail: {code: assertion-error, status: 0, message: "Cudagraph capture sizes must be set when mixed mode is enabled."}
      - title: "Mixed-mode keys: every capture size (PIECEWISE ones match any request count)"
        source: "vllm/v1/cudagraph_dispatcher.py:186-201"
        set:
          vars.mk: "= vars.mixed == 'NONE' ? [] : input.capture_sizes.map(b, {'mode': vars.mixed, 'num_tokens': b, 'num_reqs': vars.mixed == 'PIECEWISE' ? dyn(null) : dyn(b)})"
      - title: "FULL uniform-decode keys when decode runs FULL as a separate routine"
        source: "vllm/v1/cudagraph_dispatcher.py:203-229"
        set:
          vars.dk: "= input.cudagraph_mode in ['FULL_DECODE_ONLY', 'FULL_AND_PIECEWISE'] ? input.capture_sizes.filter(b, b <= input.uniform_decode_query_len * int(config['max-num-seqs']) && b >= input.uniform_decode_query_len).map(b, {'mode': 'FULL', 'num_tokens': b, 'uniform': true}) : []"
      - return: {mixed_keys: "= vars.mk", decode_keys: "= vars.dk"}
  - component: dual-key-gumbel-watermarker
    name: sample
    kind: function
    summary: "DualKeyGumbelWatermarker.sample: alpha 0 samples with the draft key only, alpha 1 with the target key only; in between both keys sample and each row is routed to the draft key with probability 1 - alpha, which needs a random sampler (ValueError otherwise). context_width is the draft watermarker's."
    sources: ["vllm/v1/watermarking/gumbel.py:137-182"]
    latency_ms: 0
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [alpha], properties: {alpha: {type: number}, has_random_sampler: {type: boolean, default: true}, draft_context_width: {type: integer, default: 4}}}
    response: {type: object, properties: {keys: {type: array, items: {type: string}}, context_width: {type: integer}}}
    behavior:
      - if: "input.alpha == 0.0"
        then: [{source: "vllm/v1/watermarking/gumbel.py:147-150", return: {keys: [draft], context_width: "= input.draft_context_width"}}]
      - if: "input.alpha == 1.0"
        then: [{source: "vllm/v1/watermarking/gumbel.py:151-154", return: {keys: [target], context_width: "= input.draft_context_width"}}]
      - if: "!input.has_random_sampler"
        then:
          - source: "vllm/v1/watermarking/gumbel.py:155-156"
            fail: {code: value-error, status: 0, message: "dual-key Gumbel routing requires a random sampler"}
      - title: Both keys sample; each row keeps the draft key's token with probability 1 - alpha
        source: "vllm/v1/watermarking/gumbel.py:158-174"
        return: {keys: [draft, target], context_width: "= input.draft_context_width"}
  - component: gpu-model-runner-v1
    name: get-model
    kind: function
    summary: "GPUModelRunner.get_model (V1): the loaded model, unwrapped from its CUDA graph (or ubatch) wrapper; before load_model it raises ValueError."
    sources: ["vllm/v1/worker/gpu_model_runner.py:3112-3120"]
    latency_ms: 0
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, properties: {model_loaded: {type: boolean, default: true}}}
    response: {type: object, properties: {model: {type: string}}}
    behavior:
      - if: "!input.model_loaded"
        then:
          - source: "vllm/v1/worker/gpu_model_runner.py:3113-3114"
            fail: {code: value-error, status: 0, message: "Cannot get model before model has been initialized"}
      - return: {model: unwrapped}
