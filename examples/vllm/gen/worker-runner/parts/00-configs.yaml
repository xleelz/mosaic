# Configs worker-runner owns (its code reads them), boundary references to
# configs other areas own, and the labeled latency/memory assumptions.
configs:
  - id: gpu-memory-utilization
    type: number
    value: 0.92
    default: 0.92
    summary: "gpu_memory_utilization: the fraction of total device memory this vLLM instance may use (weights, activations, CUDA graphs and KV cache). Deployed = default (vllm serve sets nothing)."
    sources: ["vllm/config/cache.py:102", "vllm/engine/arg_utils.py:596"]
    attributes: {key: gpu_memory_utilization}
  - id: kv-cache-memory-bytes
    type: integer
    value: 0
    default: 0
    summary: "kv_cache_memory_bytes: per-GPU KV cache size; None (modeled as 0) means size it by profiling under gpu_memory_utilization. When set, profiling is skipped and gpu_memory_utilization is ignored."
    sources: ["vllm/config/cache.py:257", "vllm/engine/arg_utils.py:597"]
    attributes: {key: kv_cache_memory_bytes, none_is: 0}
  - id: vllm-memory-profiler-estimate-cudagraphs
    type: boolean
    value: true
    default: true
    summary: "VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: subtract the profiled CUDA graph memory from the KV cache budget (default on since v0.21.0)."
    sources: ["vllm/envs.py:328", "vllm/envs.py:2221-2222"]
    attributes: {key: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS, env: true}
  - id: vllm-compute-nans-in-logits
    type: boolean
    value: false
    default: false
    summary: "VLLM_COMPUTE_NANS_IN_LOGITS: count NaN logits per request before sampling."
    sources: ["vllm/v1/worker/gpu/sample/sampler.py:58"]
    attributes: {key: VLLM_COMPUTE_NANS_IN_LOGITS, env: true}
  - id: vllm-max-num-bad-words
    type: integer
    value: 128
    default: 128
    summary: "VLLM_MAX_NUM_BAD_WORDS: bad words allowed per request by the V2 sampler."
    sources: ["vllm/envs.py:115", "vllm/envs.py:1161-1162"]
    attributes: {key: VLLM_MAX_NUM_BAD_WORDS, env: true}
  - id: vllm-max-bad-words-total-tokens
    type: integer
    value: 1024
    default: 1024
    summary: "VLLM_MAX_BAD_WORDS_TOTAL_TOKENS: total bad-word tokens allowed per request."
    sources: ["vllm/envs.py:116", "vllm/envs.py:1166-1167"]
    attributes: {key: VLLM_MAX_BAD_WORDS_TOTAL_TOKENS, env: true}
  - id: logits-processors
    type: array
    value: []
    default: []
    summary: "logits_processors: custom logits processor classes or FQCN strings (<module>:<type>) the V2 model runner instantiates after installed entry-point plugins."
    sources: ["vllm/config/model.py:403", "vllm/engine/arg_utils.py:819-820"]
    attributes: {key: logits_processors}

  # References to configs other areas own (deployed value = their default).
  - {id: enforce-eager, type: boolean, value: false, default: false, summary: "enforce_eager: never capture CUDA graphs", sources: ["vllm/config/model.py:272", "vllm/engine/arg_utils.py:630"], attributes: {boundary: true, owner: config-platform, key: enforce_eager}}
  - {id: enable-sleep-mode, type: boolean, value: false, default: false, summary: "enable_sleep_mode: allocate weights and KV cache through the CuMem allocator so they can be offloaded or discarded", sources: ["vllm/config/model.py:366", "vllm/engine/arg_utils.py:780"], attributes: {boundary: true, owner: config-platform, key: enable_sleep_mode}}
  - {id: cudagraph-mode, type: string, value: FULL_AND_PIECEWISE, default: FULL_AND_PIECEWISE, summary: "compilation_config.cudagraph_mode resolved for the default -O2 level: FULL graphs for uniform decode, PIECEWISE for mixed batches", sources: ["vllm/config/compilation.py:610", "vllm/config/vllm.py:303"], attributes: {boundary: true, owner: kernels-ops, key: compilation_config.cudagraph_mode}}
  - {id: max-cudagraph-capture-size, type: integer, value: 0, default: 0, summary: "compilation_config.max_cudagraph_capture_size; None (0) derives min(max_num_seqs * decode_query_len * 2, 512) on non-Blackwell GPUs", sources: ["vllm/config/compilation.py:695", "vllm/config/vllm.py:2354-2363"], attributes: {boundary: true, owner: config-platform, key: max_cudagraph_capture_size, none_is: 0}}
  - {id: use-v2-model-runner, type: boolean, value: true, default: true, summary: "VllmConfig.use_v2_model_runner: VLLM_USE_V2_MODEL_RUNNER unset resolves to the V2 runner unless a feature it lacks is configured (Llama with default args: V2)", sources: ["vllm/config/vllm.py:703-739", "vllm/envs.py:311"], attributes: {boundary: true, owner: config-platform, key: use_v2_model_runner}}
  - {id: speculative-method, type: string, value: "", default: "", summary: "speculative_config.method; empty means no speculative decoding", sources: ["vllm/config/speculative.py"], attributes: {boundary: true, owner: config-platform, key: speculative_config.method}}
  - {id: num-speculative-tokens, type: integer, value: 0, default: 0, summary: "speculative_config.num_speculative_tokens", sources: ["vllm/config/speculative.py"], attributes: {boundary: true, owner: config-platform, key: speculative_config.num_speculative_tokens}}
  - {id: enable-lora, type: boolean, value: false, default: false, summary: "enable_lora", sources: ["vllm/engine/arg_utils.py:676"], attributes: {boundary: true, owner: config-platform, key: enable_lora}}
  - {id: profiler, type: string, value: "", default: "", summary: "profiler_config.profiler (torch, cuda, proton); empty means profiling is not enabled", sources: ["vllm/config/profiler.py:70"], attributes: {boundary: true, owner: config-platform, key: profiler_config.profiler}}
  - {id: weight-transfer-backend, type: string, value: "", default: "", summary: "weight_transfer_config.backend; empty means no weight transfer engine", sources: ["vllm/config/vllm.py"], attributes: {boundary: true, owner: config-platform, key: weight_transfer_config}}
  - {id: enable-fault-tolerance, type: boolean, value: false, default: false, summary: "parallel_config.enable_fault_tolerance: build a WorkerSentinel", sources: ["vllm/config/parallel.py:462"], attributes: {boundary: true, owner: engine-core, key: enable_fault_tolerance}}
  - {id: watermark-enabled, type: boolean, value: false, default: false, summary: "watermark_config is set (forces the V2 runner and the GPUWatermarkSampler)", sources: ["vllm/config/vllm.py:712-718"], attributes: {boundary: true, owner: config-platform, key: watermark_config}}
  - {id: enable-trace-replay, type: boolean, value: false, default: false, summary: "model_config.enable_trace_replay", sources: ["vllm/config/model.py"], attributes: {boundary: true, owner: config-platform, key: enable_trace_replay}}
  - {id: return-sampling-mask, type: boolean, value: false, default: false, summary: "model_config.return_sampling_mask", sources: ["vllm/config/model.py"], attributes: {boundary: true, owner: config-platform, key: return_sampling_mask}}
  - {id: enable-batch-sharded-sampling, type: boolean, value: false, default: false, summary: "parallel_config.enable_batch_sharded_sampling", sources: ["vllm/config/parallel.py"], attributes: {boundary: true, owner: config-platform, key: enable_batch_sharded_sampling}}
  - {id: decode-context-parallel-size, type: integer, value: 1, default: 1, summary: "decode_context_parallel_size", sources: ["vllm/config/parallel.py"], attributes: {boundary: true, owner: attention, key: decode_context_parallel_size}}
  - {id: kv-transfer-config, type: string, value: "", default: "", summary: "kv_transfer_config connector name; empty means no KV transfer group", sources: ["vllm/config/kv_transfer.py"], attributes: {boundary: true, owner: distributed, key: kv_transfer_config}}

  - {id: pipeline-parallel-size, type: integer, value: 1, default: 1, summary: "pipeline_parallel_size", sources: ["vllm/config/parallel.py:139"], attributes: {boundary: true, owner: distributed, key: pipeline_parallel_size}}
  - {id: seed, type: integer, value: 0, default: 0, summary: "--seed (model_config.seed): the global random seed every worker sets", sources: ["vllm/config/model.py:206"], attributes: {boundary: true, owner: config-platform, key: seed}}
  - {id: enable-eplb, type: boolean, value: false, default: false, summary: "parallel_config.enable_eplb", sources: ["vllm/config/parallel.py:205"], attributes: {boundary: true, owner: config-platform, key: enable_eplb}}

  - {id: convert, type: string, value: auto, default: auto, summary: "--convert: auto resolves to embed for a *ForCausalLM run with --runner pooling", sources: ["vllm/config/model.py:1349-1368"], attributes: {boundary: true, owner: config-platform, key: convert}}

  - {id: prefill-context-parallel-size, type: integer, value: 1, default: 1, summary: "prefill_context_parallel_size", sources: ["vllm/config/parallel.py:143"], attributes: {boundary: true, owner: distributed, key: prefill_context_parallel_size}}

  - {id: prompt-lookup-min, type: integer, value: 5, default: 5, summary: "speculative_config.prompt_lookup_min (ngram; both unset resolve to 5)", sources: ["vllm/config/speculative.py:1195-1200"], attributes: {boundary: true, owner: config-platform, key: speculative_config.prompt_lookup_min}}
  - {id: prompt-lookup-max, type: integer, value: 5, default: 5, summary: "speculative_config.prompt_lookup_max (ngram; both unset resolve to 5)", sources: ["vllm/config/speculative.py:1195-1200"], attributes: {boundary: true, owner: config-platform, key: speculative_config.prompt_lookup_max}}

  # Labeled assumptions: the code gives no number for these (see notes).
  - {id: worker-runner-non-torch-memory-bytes, type: integer, value: 1073741824, default: 1073741824, summary: "ASSUMPTION: device memory consumed outside the torch allocator by startup (CUDA context, NCCL buffers, cuBLAS workspaces): 1 GiB. memory_profiling measures it; the code has no constant.", sources: ["vllm/utils/mem_utils.py:312-321"], attributes: {assumption: true}}
  - {id: worker-runner-activation-bytes-per-token, type: integer, value: 196608, default: 196608, summary: "ASSUMPTION: transient activation peak per profiled token for Llama-3.1-8B in bf16 (192 KiB); profile_run measures it with a max_num_batched_tokens dummy batch.", sources: ["vllm/v1/worker/gpu/model_runner.py:1003-1008"], attributes: {assumption: true}}
  - {id: worker-runner-cudagraph-memory-bytes, type: integer, value: 536870912, default: 536870912, summary: "ASSUMPTION: CUDA graph pool memory profile_cudagraph_memory estimates for Llama-3.1-8B (0.5 GiB); the code measures and extrapolates it.", sources: ["vllm/v1/worker/gpu/cudagraph_utils.py:873-977"], attributes: {assumption: true}}
  - {id: worker-runner-prefill-us-per-token, type: integer, value: 55, default: 55, summary: "ASSUMPTION: forward cost per prefill token (microseconds) for Llama-3.1-8B bf16 on one H100-class GPU, about 18k tokens/s.", sources: ["vllm/v1/worker/gpu/model_runner.py:1996-2001"], attributes: {assumption: true}}
  - {id: worker-runner-decode-base-ms, type: integer, value: 6, default: 6, summary: "ASSUMPTION: fixed cost of one decode forward (weight reads), ms.", sources: ["vllm/v1/worker/gpu/model_runner.py:1996-2001"], attributes: {assumption: true}}
  - {id: worker-runner-decode-us-per-seq, type: integer, value: 40, default: 40, summary: "ASSUMPTION: added decode cost per running sequence, microseconds.", sources: ["vllm/v1/worker/gpu/model_runner.py:1996-2001"], attributes: {assumption: true}}
  - {id: worker-runner-natural-output-tokens-base, type: integer, value: 8, default: 8, summary: "ASSUMPTION: the model holds no logits, so a request's natural output length (where it samples EOS) is base + prompt_hash % spread tokens; this is the base.", sources: ["vllm/v1/worker/gpu/sample/gumbel.py:21-44"], attributes: {assumption: true}}
  - {id: worker-runner-natural-output-tokens-spread, type: integer, value: 57, default: 57, summary: "ASSUMPTION: the spread of the natural output length (see the base); 1 makes every request end after exactly base tokens.", sources: ["vllm/v1/worker/gpu/sample/gumbel.py:21-44"], attributes: {assumption: true}}
  - {id: worker-runner-eager-launch-overhead-ms, type: integer, value: 4, default: 4, summary: "ASSUMPTION: CPU kernel-launch overhead of an eager (no CUDA graph) forward, ms; a FULL graph replay avoids it.", sources: ["vllm/v1/worker/gpu/model_runner.py:1990-2001"], attributes: {assumption: true}}
  - {id: worker-runner-piecewise-launch-overhead-ms, type: integer, value: 1, default: 1, summary: "ASSUMPTION: launch overhead left by PIECEWISE graphs (attention runs outside the graphs), ms.", sources: ["vllm/v1/worker/gpu/cudagraph_utils.py:571-576"], attributes: {assumption: true}}
