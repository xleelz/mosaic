  description: 'get_kv_cache_configs: num_blocks = available_memory // (page_size_bytes * num_layers) (kv_cache_utils.py:1230-1260); the fp8 page is 2 * 16 * 8 * 128 * 1 bytes (cache.py:122-126, torch_utils.py:518-519). The page size comes from the worker''s get_kv_cache_spec (worker-runner).'
  fixtures:
  - full-fp8-llama-3-8b-kv-fp8
  steps:
  - interface: kv-cache-utils.get-kv-cache-configs
    caller: engine-core
    as: auto
    input:
      available_memory:
      - 59742896128
      bytes_per_block: 2097152
  - interface: kv-cache-utils.get-kv-cache-configs
    caller: engine-core
    as: fp8
    input:
      available_memory:
      - 59742896128
      bytes_per_block: 1048576
  expect:
  - '// both counts leave out the null block

