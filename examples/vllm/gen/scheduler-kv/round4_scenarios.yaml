- id: scheduler-kv-r4-encoder-cache-lifecycle
  name: 'Encoder cache: share an item, free it to freeable, evict oldest-first on demand, and reset to full capacity'
  fixtures: *id003
  steps:
  - interface: encoder-cache-manager.init
    caller: scheduler
    as: init
    input:
      cache_size: 20
  - interface: encoder-cache-manager.check-and-update-cache
    caller: scheduler
    as: miss
    input:
      request_id: r1
      input_id: 0
      mm_hash: img1
  - interface: encoder-cache-manager.can-allocate
    caller: scheduler
    as: budget
    input:
      request_id: r1
      input_id: 0
      num_embeds: 30
      encoder_compute_budget: 16
  - interface: encoder-cache-manager.can-allocate
    caller: scheduler
    as: fits
    input:
      request_id: r1
      input_id: 0
      num_embeds: 5
      encoder_compute_budget: 100
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: al1
    input:
      request_id: r1
      input_id: 0
      mm_hash: img1
      num_embeds: 5
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: al2
    input:
      request_id: r2
      input_id: 0
      mm_hash: img2
      num_embeds: 3
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: mismatch
    input:
      request_id: r2
      input_id: 1
