scenarios:
- id: scheduler-kv-r4-test-1
  name: Registering an already registered tier type raises ValueError
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: secondary-tier-factory.register-tier
    caller: engine-core
    as: dup
    input:
      tier_type: example
      module_path: some.module
      class_name: SomeClass
  expect:
  - steps.dup.result.error.code == 'value-error' && steps.dup.result.error.message.contains('is already registered')
  - trace.exists(e, e.type == 'call.end' && e.interface == 'secondary-tier-factory.register-tier')
  description: tests/v1/kv_offload/tiering/test_factory.py:164 test_duplicate_registration_raises
- id: scheduler-kv-r4-test-2
  name: 'Lookahead tokens count toward the blocks allocated: 3 new + 2 or 4 lookahead tokens at block size 4 need 2 blocks'
  fixtures:
  - tp1-llama-8b
  config:
    block-size: 4
    max-model-len: 100
  state:
    block-pool:
      num_gpu_blocks: 10
      next_fresh: 1
      free_front: []
      free_tail: []
      ref_cnt: {}
      block_hash: {}
      cached: {}
      hash_tokens: {}
  steps:
  - interface: kv-cache-manager.allocate-slots
    caller: scheduler
    as: c1
    input:
      request_id: '0'
      status: WAITING
      num_computed_tokens: 0
      num_tokens: 0
      num_new_tokens: 3
      num_lookahead_tokens: 2
  - interface: kv-cache-manager.allocate-slots
    caller: scheduler
    as: c2
    input:
      request_id: 0b
      status: WAITING
      num_computed_tokens: 0
      num_tokens: 0
      num_new_tokens: 3
      num_lookahead_tokens: 2
  - interface: kv-cache-manager.allocate-slots
    caller: scheduler
    as: c3
    input:
      request_id: 0c
      status: WAITING
      num_computed_tokens: 0
      num_tokens: 0
      num_new_tokens: 3
      num_lookahead_tokens: 4
  - interface: kv-cache-manager.get-block-ids
    caller: scheduler
    as: ids
    input:
      request_id: '0'
  expect:
  - size(steps.c1.result.value.block_ids) == 2 && size(steps.c2.result.value.block_ids) == 2 && size(steps.c3.result.value.block_ids) == 2
  - size(steps.ids.result.value.block_ids) == 2
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.get-block-ids')
  description: tests/v1/core/test_kv_cache_utils.py:2355 test_allocate_with_lookahead
- id: scheduler-kv-r4-test-3
  name: A sparse-MLA cache group mixing page sizes registers one [num_blocks, page] region per layer
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: kv-cache-utils.get-kv-cache-config-from-groups
    caller: engine-core
    as: cfg
    input:
      layout: LBNHC
      kv_cache_groups:
      - layer_names: &id001
        - model.layers.0.self_attn.attn
        - model.layers.0.self_attn.indexer.k_cache
        - model.layers.1.self_attn.attn
        - model.layers.1.self_attn.indexer.k_cache
        - model.layers.2.self_attn.attn
        - model.layers.2.self_attn.indexer.k_cache
        - model.layers.3.self_attn.attn
        - model.layers.3.self_attn.indexer.k_cache
        layer_pages:
          model.layers.0.self_attn.attn: 36864
          model.layers.0.self_attn.indexer.k_cache: 8448
          model.layers.1.self_attn.attn: 36864
          model.layers.1.self_attn.indexer.k_cache: 8448
          model.layers.2.self_attn.attn: 36864
          model.layers.2.self_attn.indexer.k_cache: 8448
          model.layers.3.self_attn.attn: 36864
          model.layers.3.self_attn.indexer.k_cache: 8448
      available_memory: 724992
  - interface: simple-cpu-offload-worker.register-kv-caches
    caller: engine-core
    as: reg
    input:
      num_blocks: = steps.cfg.result.value.num_blocks
      kv_cache_tensors: = steps.cfg.result.value.kv_cache_tensors
      layer_names: *id001
  expect:
  - steps.cfg.result.value.num_blocks == 4
  - steps.reg.result.value.regions.transformList(k, v, k).size() == 8
  - 'steps.reg.result.value.regions.transformList(k, v, v[0] == 4 && v[1] == (k.endsWith(''.attn'') ? 36864 : 8448)).all(b, b)'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'simple-cpu-offload-worker.register-kv-caches')
  description: tests/v1/simple_kv_offload/test_worker.py:480 test_register_mixed_page_sizes_in_one_cache_group
- id: scheduler-kv-r4-test-4
  name: A registered tier type creates an instance whose tier_type is that type
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: secondary-tier-factory.create-secondary-tier
    caller: engine-core
    as: tier
    input:
      tier_id: tier0
      tier_config:
        type: example
  - interface: example-secondary-tier-manager.get-num-chunks
    caller: engine-core
    as: n
    input:
      tier_id: tier0
  expect:
  - steps.tier.result.value.tier_type == 'example' && steps.tier.result.value.class_name == 'ExampleSecondaryTierManager'
  - steps.n.result.value.num_chunks == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'example-secondary-tier-manager.get-num-chunks')
  description: tests/v1/kv_offload/tiering/test_factory.py:74 test_create_tier_from_registry
- id: scheduler-kv-r4-test-5
  name: The example tier misses an empty key, then hits the two stored chunks and misses the third
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: example-secondary-tier-manager.init
    caller: engine-core
    as: tier
    input:
      tier_id: tier0
      tier_type: example
      custom_param: 67
      primary_row_stride: 16
  - interface: example-secondary-tier-manager.lookup
    caller: engine-core
    as: m0
    input:
      tier_id: tier0
      key: '0'
      req_id: test
  - interface: example-secondary-tier-manager.submit-store
    caller: engine-core
    as: ins
    input:
      tier_id: tier0
      job_id: 0
      keys:
      - '0'
      - '1'
      chunk_ids:
      - 0
      - 1
  - interface: example-secondary-tier-manager.lookup
    caller: engine-core
    as: h0
    input:
      tier_id: tier0
      key: '0'
      req_id: test
  - interface: example-secondary-tier-manager.lookup
    caller: engine-core
    as: h1
    input:
      tier_id: tier0
      key: '1'
      req_id: test
  - interface: example-secondary-tier-manager.lookup
    caller: engine-core
    as: m2
    input:
      tier_id: tier0
      key: '2'
      req_id: test
  expect:
  - steps.m0.result.value.result == 'MISS'
  - steps.h0.result.value.result == 'HIT' && steps.h1.result.value.result == 'HIT'
  - steps.m2.result.value.result == 'MISS'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'example-secondary-tier-manager.lookup')
  description: tests/v1/kv_offload/tiering/test_tiering_offloading.py:225 TestExampleSecondaryTierManager.test_basic_store_and_lookup
- id: scheduler-kv-r4-test-6
  name: The fatal monitor events include EVENT_DISCONNECTED and EVENT_CLOSED
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: zmq-transport.fatal-monitor-events
    caller: engine-core
    as: ev
    input: {}
  expect:
  - '''EVENT_DISCONNECTED'' in steps.ev.result.value.events && ''EVENT_CLOSED'' in steps.ev.result.value.events'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'zmq-transport.fatal-monitor-events')
  description: tests/v1/kv_offload/tiering/p2p/test_zmq_transport.py:344 TestExpandedMonitorEvents.test_fatal_events_include_disconnected_and_closed
- id: scheduler-kv-r4-cache-salt-isolates-prefix
  name: 'Judge W1/Q8a: a different cache_salt shares no prefix blocks; the same salt does'
  description: generate_block_hash_extra_keys puts ('cache_salt', salt) in the first block's hash; the chain carries it on (kv_cache_utils.py:647-650).
  fixtures: &id003
  - tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: salt-a1
      prompt_token_ids: &id002
      - 128000
      - 5000
      - 5001
      - 5002
      - 5003
      - 5004
      - 5005
      - 5006
      - 5007
      - 5008
      - 5009
      - 5010
      - 5011
      - 5012
      - 5013
      - 5014
      - 5015
      - 5016
      - 5017
      - 5018
      - 5019
      - 5020
      - 5021
      - 5022
      - 5023
      - 5024
      - 5025
      - 5026
      - 5027
      - 5028
      - 5029
      - 5030
      - 5031
      - 5032
      - 5033
      - 5034
      - 5035
      - 5036
      - 5037
      - 5038
      - 5039
      - 5040
      - 5041
      - 5042
      - 5043
      - 5044
      - 5045
      - 5046
      sampling_params:
        max_tokens: 4
      cache_salt: tenant-a
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: salt-b1
      prompt_token_ids: *id002
      sampling_params:
        max_tokens: 4
      cache_salt: tenant-b
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-add-request
    as: a3
    input:
      request_id: salt-a2
      prompt_token_ids: *id002
      sampling_params:
        max_tokens: 4
      cache_salt: tenant-a
  - flow: scheduler-schedule
    as: s3
    input: {}
  expect:
  - steps.s1.result.value.num_scheduled_tokens['salt-a1'] == 48
  - steps.s2.result.value.num_scheduled_tokens['salt-b1'] == 48
  - steps.s3.result.value.num_scheduled_tokens['salt-a2'] == 16
  - steps.a1.result.value.num_block_hashes == 3
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.schedule')
- id: scheduler-kv-r4-lora-isolates-prefix
  name: 'Judge W1/Q8b: two LoRA adapters share no prefix blocks; the same adapter does'
  description: _gen_lora_extra_hash_keys adds ('lora', name, path) to every block hash (kv_cache_utils.py:578-595).
  fixtures: *id003
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: lora-a1
      prompt_token_ids: *id002
      sampling_params:
        max_tokens: 4
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /adapters/a
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: lora-b1
      prompt_token_ids: *id002
      sampling_params:
        max_tokens: 4
      lora_request:
        lora_name: chat
        lora_int_id: 2
        lora_path: /adapters/b
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-add-request
    as: a3
    input:
      request_id: lora-a2
      prompt_token_ids: *id002
      sampling_params:
        max_tokens: 4
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /adapters/a
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-add-request
    as: a4
    input:
      request_id: base-1
      prompt_token_ids: *id002
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s4
    input: {}
  expect:
  - steps.s2.result.value.num_scheduled_tokens['lora-b1'] == 48
  - steps.s3.result.value.num_scheduled_tokens['lora-a2'] == 16
  - steps.s4.result.value.num_scheduled_tokens['base-1'] == 48
  - steps.s1.result.value.scheduled_new_reqs[0].lora_request.lora_int_id == 1
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.schedule')
- id: scheduler-kv-r4-max-loras-gate
  name: 'Judge L8a: with max_loras 2, a third adapter waits until a scheduled adapter''s request leaves'
  fixtures: *id003
  config:
    enable-lora: true
    max-loras: 2
  steps:
  - flow: scheduler-add-request
    as: r1
    input:
      request_id: l1
      prompt_token_ids: &id004
      - 128000
      - 9906
      - 1917
      sampling_params:
        max_tokens: 16
      lora_request:
        lora_name: a
        lora_int_id: 1
        lora_path: /a
  - flow: scheduler-add-request
    as: r2
    input:
      request_id: l2
      prompt_token_ids: *id004
      sampling_params:
        max_tokens: 16
      lora_request:
        lora_name: b
        lora_int_id: 2
        lora_path: /b
  - flow: scheduler-add-request
    as: r3
    input:
      request_id: l3
      prompt_token_ids: *id004
      sampling_params:
        max_tokens: 16
      lora_request:
        lora_name: c
        lora_int_id: 3
        lora_path: /c
  - flow: scheduler-add-request
    as: r4
    input:
      request_id: l4
      prompt_token_ids: *id004
      sampling_params:
        max_tokens: 16
      lora_request:
        lora_name: a
        lora_int_id: 1
        lora_path: /a
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-finish-requests
    as: f1
    input:
      request_ids:
      - l1
      - l4
  - flow: scheduler-schedule
    as: s3
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: counts
    input: {}
  expect:
  - steps.s1.result.value.scheduled_new_reqs.map(r, r.req_id) == ['l1', 'l2', 'l4']
  - '!(''l3'' in steps.s2.result.value.num_scheduled_tokens)'
  - steps.s3.result.value.scheduled_new_reqs.map(r, r.req_id) == ['l3']
  - steps.counts.result.value.num_waiting == 0 && steps.counts.result.value.num_running == 2
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.get-request-counts')
- id: scheduler-kv-r4-grammar-wait-and-promote
  name: 'Judge L4d/S10: a structured-output request waits for its grammar, is promoted once it compiles, and a failed compile finishes it with an error'
  description: Request status WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR (request.py:116-117); promotion and compile errors in _handle_blocked_waiting_request (scheduler.py:3191-3200) and update_from_output (2302-2326).
  fixtures: *id003
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: so-1
      prompt_token_ids: *id004
      sampling_params:
        max_tokens: 8
        structured_outputs:
          json:
            type: string
  - flow: scheduler-add-request
    as: add2
    input:
      request_id: so-2
      prompt_token_ids: *id004
      sampling_params:
        max_tokens: 8
        structured_outputs:
          grammar: root ::= x
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: structured-output-manager.grammar-init
    caller: engine-core
    as: g1
    input:
      request_id: so-1
      backend: xgrammar
      request_type: json
      grammar_spec: '{"type": "string"}'
  - interface: structured-output-manager.grammar-init
    caller: engine-core
    as: g2
    input:
      request_id: so-2
      backend: xgrammar
      request_type: bogus
      grammar_spec: root ::= x
  - flow: scheduler-schedule
    as: s2
    input: {}
  - interface: scheduler.get-grammar-bitmask
    caller: engine-core
    as: gb1
    input:
      scheduler_output: = steps.s1.result.value
  - interface: scheduler.get-grammar-bitmask
    caller: engine-core
    as: gb2
    input:
      scheduler_output: = steps.s2.result.value
  - flow: scheduler-update-from-output
    as: u2
    input:
      scheduler_output: = steps.s2.result.value
      model_runner_output:
        req_ids:
        - so-1
        sampled_token_ids:
        - - 1
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: counts
    input: {}
  expect:
  - steps.add.result.value.status == 'WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR'
  - steps.s1.result.value.total_num_scheduled_tokens == 0
  - steps.g1.result.value.status == 'ready' && steps.g2.result.value.status == 'failed'
  - 'steps.s2.result.value.num_scheduled_tokens == {''so-1'': 3}'
  - steps.gb1.result.value == null && steps.gb2.result.value.structured_output_request_ids == ['so-1'] && steps.gb2.result.value.num_acceptable_drafts == [0]
  - steps.u2.result.value.outputs.exists(o, o.request_id == 'so-2' && o.finish_reason == 'error')
  - steps.counts.result.value.num_waiting == 0 && steps.counts.result.value.num_running == 1
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.get-request-counts')
- id: scheduler-kv-r4-spec-decode-stats
  name: 'Judge P3c: verified drafts are counted in the step''s SpecDecodingStats; none when stats are off'
  fixtures: *id003
  config:
    speculative-method: eagle
    num-speculative-tokens: 3
    async-scheduling: false
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: sd-1
      prompt_token_ids: *id004
      sampling_params:
        max_tokens: 32
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-update-from-output
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids:
        - sd-1
        sampled_token_ids:
        - - 791
  - interface: scheduler.update-draft-token-ids
    caller: engine-core
    as: d1
    input:
      req_ids:
      - sd-1
      draft_token_ids:
      - - 201
        - 202
        - 203
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-update-from-output
    as: u2
    input:
      scheduler_output: = steps.s2.result.value
      model_runner_output:
        req_ids:
        - sd-1
        sampled_token_ids:
        - - 201
          - 202
          - 9
  - interface: scheduler.make-spec-decoding-stats
    caller: engine-core
    as: over
    input:
      num_draft_tokens: 3
      num_accepted_tokens: 5
  - interface: scheduler.make-spec-decoding-stats
    caller: engine-core
    as: none
    input:
      num_draft_tokens: 0
      num_accepted_tokens: 0
  expect:
  - steps.u1.result.value.scheduler_stats.spec_decoding_stats == null
  - steps.u2.result.value.scheduler_stats.spec_decoding_stats.num_draft_tokens == 3
  - steps.u2.result.value.scheduler_stats.spec_decoding_stats.num_accepted_tokens == 2
  - steps.u2.result.value.scheduler_stats.spec_decoding_stats.num_accepted_tokens_per_pos == [1, 1, 0]
  - steps.over.result.error.code == 'assertion-error' && steps.none.result.value == null
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.make-spec-decoding-stats')
