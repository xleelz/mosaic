    caller: scheduler
    as: floored
    input:
      num_computed_tokens: 0
      num_new_tokens: 40
      num_prompt_tokens: 40
      num_tokens: 40
      shared_prefix_boundary: 12
  - interface: hybrid-kv-cache-coordinator.find-longest-cache-hit
    caller: kv-cache-manager
    as: hit
    input:
      block_hashes:
      - f0
      - f1
      - f2
      - f3
      - f4
      - f5
      max_length: 23
      hash_block_size: 4
  expect:
  - steps.split.result.value.num_new_tokens == 12
  - steps.nojunction.result.value.end == 32 && steps.midblock.result.value.end == 16 && steps.decode.result.value.num_new_tokens == 1
  - steps.floored.result.value.end == 32
  - steps.hit.result.value.hit_length == 12 && steps.hit.result.value.mamba_block.block_id == 9
  - trace.exists(e, e.type == 'call.end' && e.interface == 'hybrid-kv-cache-coordinator.find-longest-cache-hit')
- id: scheduler-kv-r4-resolve-block-sizes
  name: 'Block-size resolution: one group hashes at its block size, hybrid groups schedule at the LCM and hash at the GCD or prefix_match_unit; bad units are refused'
  fixtures: *id003
  steps:
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: one
    input:
      groups:
      - kind: full_attention
        block_size: 16
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: one_bad
    input:
      groups:
      - kind: full_attention
        block_size: 16
      prefix_match_unit: 8
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: hyb
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: unit
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
      prefix_match_unit: 8
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: badunit
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
      prefix_match_unit: 12
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: noalign
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 48
        mamba_cache_mode: none
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: noncache
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: sliding_window
        block_size: 32
        prefix_cacheable: false
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
  expect:
  - steps.one.result.value.hash_block_size == 16 && steps.one_bad.result.error.code == 'value-error'
  - steps.hyb.result.value.scheduler_block_size == 64 && steps.hyb.result.value.hash_block_size == 16 && steps.unit.result.value.hash_block_size == 8
  - steps.badunit.result.error.code == 'value-error' && steps.noalign.result.value.hash_block_size == 48
  - steps.noncache.result.value.hash_block_size == 16
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-utils.resolve-kv-cache-block-sizes')
- id: scheduler-kv-r4-resolve-block-sizes-no-caching
  name: With prefix caching off and no connector, hybrid groups hash at the scheduler block size
  fixtures: *id003
  config:
    enable-prefix-caching: false
  steps:
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: r
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
  expect:
  - steps.r.result.value.hash_block_size == 64
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-utils.resolve-kv-cache-block-sizes')
- id: scheduler-kv-r4-scheduler-kv-cache-config
  name: The scheduler's KV config is the first worker's, with a uniform-type group represented by one layer spec; workers must agree on num_blocks
  fixtures: *id003
  steps:
  - interface: kv-cache-utils.generate-scheduler-kv-cache-config
    caller: engine-core
    as: ok
    input:
      kv_cache_configs:
      - num_blocks: 4
        kv_cache_groups:
        - layer_names:
          - a
          - b
          layer_specs:
          - kind: mla_attention
            head_size: 576
          - kind: mla_attention
            head_size: 132
      - num_blocks: 4
        kv_cache_groups:
        - layer_names:
          - a
          - b
  - interface: kv-cache-utils.generate-scheduler-kv-cache-config
    caller: engine-core
    as: bad
    input:
      kv_cache_configs:
      - num_blocks: 4
        kv_cache_groups: []
      - num_blocks: 5
        kv_cache_groups: []
  expect:
  - steps.ok.result.value.num_blocks == 4 && steps.ok.result.value.kv_cache_groups[0].spec.head_size == 576
  - steps.bad.result.error.code == 'assertion-error'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-utils.generate-scheduler-kv-cache-config')
- id: scheduler-kv-r4-rswa-gap
  name: R-SWA frees the gap between the prompt and the decode window (nothing without the prompt length)
  fixtures: *id003
  config:
    block-size: 4
  state:
    block-pool:
      num_gpu_blocks: 12
      next_fresh: 9
      free_front: []
      free_tail: []
      ref_cnt: {}
      block_hash: {}
      cached: {}
      hash_tokens: {}
      kv_event_queue: []
  steps:
  - interface: rswa-manager.remove-skipped-blocks
    caller: kv-cache-manager
    as: full
    input:
      request_id: r1
      processed_computed_tokens: 30
      rswa_window: 8
      block_ids:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
  - interface: rswa-manager.remove-skipped-blocks
    caller: kv-cache-manager
    as: gap
    input:
      request_id: r1
      processed_computed_tokens: 30
      rswa_window: 8
      num_prompt_tokens: 6
  - interface: rswa-manager.remove-skipped-blocks
    caller: kv-cache-manager
    as: again
    input:
      request_id: r1
      processed_computed_tokens: 30
      rswa_window: 8
      num_prompt_tokens: 6
  - interface: block-pool.get-num-free-blocks
    caller: kv-cache-manager
    as: free
    input: {}
  expect:
  - steps.full.result.value.freed == [] && steps.gap.result.value.freed == [5, 4, 3]
  - steps.gap.result.value.block_ids == [1, 2, 0, 0, 0, 6, 7, 8] && steps.again.result.value.freed == [] && steps.free.result.value.num_free_blocks == 6
  - trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-num-free-blocks')
- id: scheduler-kv-r4-chunked-local-hit
  name: 'Chunked local attention: blocks before the current chunk are free hits; the chunk''s cached blocks are adopted until a miss'
  fixtures: *id003
  config:
    block-size: 4
  state:
    block-pool:
      num_gpu_blocks: 10
      next_fresh: 6
      free_front: []
      free_tail: []
      ref_cnt: {}
      block_hash:
        '3': c2
        '5': c4
      cached:
        c2: 3
        c4: 5
      hash_tokens: {}
      kv_event_queue: []
  steps:
  - interface: chunked-local-attention-manager.find-longest-cache-hit
    caller: kv-cache-manager
    as: hit
    input:
      block_hashes:
      - c0
      - c1
      - c2
      - c3
      max_length: 15
      attention_chunk_size: 8
  - interface: chunked-local-attention-manager.find-longest-cache-hit
    caller: kv-cache-manager
    as: miss
    input:
      block_hashes:
      - c0
      - c1
      - c2
      - c3
      - c4
      max_length: 20
      attention_chunk_size: 8
  - interface: chunked-local-attention-manager.find-longest-cache-hit
    caller: kv-cache-manager
    as: edge
    input:
      block_hashes:
      - c0
      - c1
      - c2
      - c3
      max_length: 16
      attention_chunk_size: 8
  expect:
  - steps.hit.result.value.block_ids == [0, 0, 3] && steps.hit.result.value.hit_length == 12
  - steps.miss.result.value.block_ids == [0, 0, 0, 0, 5] && steps.edge.result.value.hit_length == 16
  - trace.exists(e, e.type == 'call.end' && e.interface == 'chunked-local-attention-manager.find-longest-cache-hit')
- id: scheduler-kv-r4-spec-registry
  name: The spec registry maps MLA to the full-attention manager via its MRO, honors group roles, and refuses conflicting registrations
  fixtures: *id003
  steps:
  - interface: kv-cache-spec-registry.register-all-kvcache-specs
    caller: kv-cache-manager
    as: reg
    input: {}
  - interface: kv-cache-spec-registry.get-manager-class
    caller: kv-cache-manager
    as: mla
    input:
      mro:
      - MLAAttentionSpec
      - FullAttentionSpec
      - AttentionSpec
      - KVCacheSpec
  - interface: kv-cache-spec-registry.get-manager-class
    caller: kv-cache-manager
    as: role
    input:
      mro:
      - FullAttentionSpec
      role: hisparse_source
  - interface: kv-cache-spec-registry.get-manager-class
    caller: kv-cache-manager
    as: none
    input:
      mro:
      - MyCustomSpec
      - KVCacheSpec
  - interface: kv-cache-spec-registry.register-all-kvcache-specs
    caller: kv-cache-manager
    as: conflict
    input:
      extra:
      - spec: MambaSpec
        manager: Other
        base: MambaSpec
  - interface: kv-cache-spec-registry.register-all-kvcache-specs
    caller: kv-cache-manager
    as: plugin
    input:
      extra:
      - spec: MyCustomSpec
        manager: FullAttentionManager
        base: FullAttentionSpec
  - interface: kv-cache-spec-registry.get-manager-class
    caller: kv-cache-manager
    as: custom
    input:
      mro:
      - MyCustomSpec
      - KVCacheSpec
  expect:
  - steps.reg.result.value.num_specs == 13 && steps.mla.result.value.manager == 'FullAttentionManager'
  - steps.role.result.value.manager == 'HiSparseSourceManager' && steps.none.result.value.manager == null
  - steps.conflict.result.error.code == 'assertion-error' && steps.custom.result.value.manager == 'FullAttentionManager'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-spec-registry.get-manager-class')
- id: scheduler-kv-r4-encoder-cache-evicts-only-what-it-needs
  name: 'Encoder cache eviction stops as soon as the new item fits: only the oldest unreferenced entry goes'
  fixtures: *id003
  steps:
  - interface: encoder-cache-manager.init
    caller: scheduler
    as: init
    input:
      cache_size: 10
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: a
    input:
      request_id: r1
      input_id: 0
      mm_hash: old
      num_embeds: 4
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: b
    input:
      request_id: r2
      input_id: 0
      mm_hash: new
      num_embeds: 4
  - interface: encoder-cache-manager.free
    caller: scheduler
    as: fa
    input:
      request_id: r1
      mm_hashes:
      - old
  - interface: encoder-cache-manager.free
    caller: scheduler
    as: fb
    input:
      request_id: r2
      mm_hashes:
      - new
  - interface: encoder-cache-manager.can-allocate
    caller: scheduler
    as: ev
    input:
      request_id: r3
      input_id: 0
      num_embeds: 5
      encoder_compute_budget: 100
  - interface: encoder-cache-manager.check-and-update-cache
    caller: scheduler
    as: still
    input:
      request_id: r3
      input_id: 0
      mm_hash: new
  expect:
  - steps.ev.result.value.evicted == ['old'] && steps.still.result.value.cached
  - trace.exists(e, e.type == 'call.end' && e.interface == 'encoder-cache-manager.check-and-update-cache')
