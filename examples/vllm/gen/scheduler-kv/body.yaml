  - {id: vllm-xpu-kernels, name: vllm-xpu-kernels (external), kind: external, layer: external, parent: kernels-ops, summary: "The vllm-xpu-kernels package providing the XPU _C ops (owned by kernels-ops).", attributes: {boundary: true, owner: kernels-ops}}

schemas:
  - id: SchedKvRequest
    summary: "The engine Request the scheduler admits (vllm/v1/request.py fields the scheduler reads)."
    schema:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        prompt_token_ids: {type: array, items: {type: integer}, examples: [[128000, 9906, 1917, 13, 3639, 374, 279, 6864, 315, 9822, 30]]}
        prompt_segments:
          type: array
          default: []
          description: "Modeling device for long prompts: consecutive token runs named by content key (equal keys = equal tokens). Replaces prompt_token_ids when non-empty."
          items: {type: object, required: [key, num_tokens], properties: {key: {type: string}, num_tokens: {type: integer}}}
        sampling_params:
          type: object
          properties:
            max_tokens: {type: integer, examples: [16]}
            min_tokens: {type: integer, examples: [0]}
            temperature: {type: number, examples: [0.0]}
            eos_token_id: {type: [integer, "null"], examples: [128009], description: "null when ignore_eos (engine-core sends null; vllm/sampling_params.py)."}
            stop_token_ids: {type: array, items: {type: integer}, examples: [[128001, 128008]]}
            ignore_eos: {type: boolean, examples: [false]}
            structured_outputs: {type: [object, "null"], description: "StructuredOutputsParams (json, regex, choice, grammar, json_object, structural_tag); a request with any constraint starts in WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR (request.py:116-117)."}
            prompt_logprobs: {type: [integer, "null"], default: null, description: "Prompt logprobs requested; unless skip_reading_prefix_cache is set, it defaults the request to skip reading the prefix cache (sampling_params.py:622-629)."}
            prompt_logprob_token_ids: {type: [array, "null"], default: null, items: {type: integer}}
            skip_reading_prefix_cache: {type: [boolean, "null"], default: null, description: "None resolves to prompt_logprobs is not None or prompt_logprob_token_ids is not None (sampling_params.py:622-629)."}
        arrival_time: {type: [number, "null"], default: null, description: "Engine arrival time; null means now."}
        priority: {type: integer, examples: [0]}
        grammar_id: {type: [string, "null"], default: null, description: "Set when the request uses structured output (its compiled grammar)."}
        kv_transfer_params: {type: [object, "null"], default: null, description: "P/D: e.g. {do_remote_prefill: true, ...} for the KV connector."}
        cache_salt: {type: [string, "null"], default: null, description: "Request.cache_salt: an extra key of the first block's hash, so tenants with different salts share no prefix blocks (kv_cache_utils.py:647-650)."}
        lora_request:
          type: [object, "null"]
          default: null
          description: "LoRARequest: its name and path are extra keys of every block hash (kv_cache_utils.py:578-595); its int id counts against max_loras (scheduler.py:941-951)."
          properties:
            lora_name: {type: string, examples: [sql-lora]}
            lora_int_id: {type: integer, examples: [1]}
            lora_path: {type: string, examples: [/adapters/sql-lora]}
        client_index: {type: integer, examples: [0]}
        mm_features:
          type: array
          default: []
          description: "Request.mm_features sorted by offset: each multimodal item's identifier (mm_hash), its placeholder range (offset, length) and its embedding count (PlaceholderRange.get_num_embeds; the length when every placeholder is an embedding)."
          items:
            type: object
            required: [identifier, offset, length]
            properties:
              identifier: {type: string, examples: [img-stop-sign]}
              modality: {type: string, examples: [image]}
              offset: {type: integer, examples: [8]}
              length: {type: integer, examples: [800]}
              num_embeds: {type: integer, examples: [800]}
  - id: SchedKvBlock
    summary: "A KV cache block as the prefix-cache lookup returns it."
    schema: {type: object, properties: {block_id: {type: integer}, ref_cnt: {type: integer}}}
  - id: SchedKvEngineCoreOutputs
    summary: "What update_from_output returns to the engine core: per-request outputs (EngineCoreOutput) for client 0."
    schema:
      type: object
      properties:
        outputs:
          type: array
          items:
            type: object
            properties:
              request_id: {type: string}
              new_token_ids: {type: array, items: {type: integer}}
              finish_reason: {type: [string, "null"], enum: [stop, length, abort, error, repetition, null]}
              stop_reason: {}
              num_cached_tokens: {type: integer}
              client_index: {type: integer}
              kv_transfer_params: {}
              events: {type: [array, "null"], description: "EngineCoreEvents taken from the request (QUEUED, SCHEDULED, PREEMPTED with timestamps); null when none. The output processor's IterationStats counts PREEMPTED events as num_preempted_reqs (vllm/v1/metrics/stats.py:576-577).", items: {type: object, properties: {type: {type: string, enum: [QUEUED, SCHEDULED, PREEMPTED]}, timestamp: {type: number}}}}
        finished_req_ids: {type: array, items: {type: string}}
