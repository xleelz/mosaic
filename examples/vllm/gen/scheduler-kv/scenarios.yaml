scenarios:
- id: scheduler-kv-add-request-then-schedule
  name: A new request is admitted and fully prefilled in one step
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
      - 1917
      - 13
      - 3639
      - 374
      - 279
      - 6864
      - 315
      - 9822
      - 30
      sampling_params:
        max_tokens: 16
      priority: 0
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: kv-cache-manager.get-block-ids
    caller: engine-core
    as: table
    input:
      request_id: chatcmpl-abc123
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.table.result.value.block_ids == [1]
  - steps.add.result.ok && steps.add.result.value.status == 'WAITING' && steps.add.result.value.num_block_hashes == 0
  - steps.s1.result.value.scheduled_new_reqs.size() == 1 && steps.s1.result.value.scheduled_new_reqs[0].req_id == 'chatcmpl-abc123'
  - steps.s1.result.value.num_scheduled_tokens['chatcmpl-abc123'] == 11 && steps.s1.result.value.total_num_scheduled_tokens == 11
  - steps.s1.result.value.scheduled_new_reqs[0].block_ids == [1]
  - 'steps.cnt.result.value == {''num_running'': 1, ''num_waiting'': 0}'
  - '// the async placeholder is the point: AsyncScheduler adds one per decoding request

    state.scheduler.requests[''chatcmpl-abc123''].num_output_placeholders == 1 && !state.scheduler.requests[''chatcmpl-abc123''].is_prefill_chunk'
- id: scheduler-kv-add-request-duplicate-id
  name: A second request with the same id trips the duplicate assertion
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.a1.result.ok
  - '!steps.a2.result.ok && steps.a2.result.error.code == ''assertion-error'' && steps.a2.result.error.message == ''duplicate request id'''
  - steps.cnt.result.value.num_waiting == 1
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.get-request-counts' && e.error == null)
- id: scheduler-kv-schedule-chunked-prefill
  name: A 200-token prompt prefills in 64-token chunks, then decodes
  fixtures:
  - small-batch-limits
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-long1
      prompt_segments:
      - key: doc-long
        num_tokens: 200
      sampling_params:
        max_tokens: 8
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-schedule
    as: s4
    input: {}
  - interface: kv-cache-manager.get-block-ids
    caller: engine-core
    as: tbl
    input:
      request_id: chatcmpl-long1
  expect:
  - steps.s1.result.value.num_scheduled_tokens['chatcmpl-long1'] == 64 && steps.s1.result.value.scheduled_new_reqs.size() == 1
  - steps.s2.result.value.num_scheduled_tokens['chatcmpl-long1'] == 64 && steps.s2.result.value.scheduled_cached_reqs.req_ids == ['chatcmpl-long1']
  - steps.s3.result.value.num_scheduled_tokens['chatcmpl-long1'] == 64
  - steps.s4.result.value.num_scheduled_tokens['chatcmpl-long1'] == 8
  - steps.s1.result.value.scheduled_new_reqs[0].block_ids == [1, 2, 3, 4] && steps.s2.result.value.scheduled_cached_reqs.new_block_ids == [[5, 6, 7, 8]]
  - size(steps.tbl.result.value.block_ids) == 13 && trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.schedule' && e.output.total_num_scheduled_tokens == 8)
- id: scheduler-kv-partial-prefill-emits-nothing
  name: The output of a partial prefill chunk produces no EngineCoreOutput
  fixtures:
  - small-batch-limits
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-long1
      prompt_segments:
      - key: doc-long
        num_tokens: 200
      sampling_params:
        max_tokens: 8
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-update-from-output
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids:
        - chatcmpl-long1
        sampled_token_ids:
        - []
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - steps.u1.result.ok && steps.u1.result.value.outputs == []
  - steps.s2.result.value.scheduled_cached_reqs.num_computed_tokens == [64] && trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.update-from-output' && e.output.outputs == [])
- id: scheduler-kv-chunked-prefill-off-blocks-long-prompt
  name: With chunked prefill off, a prompt longer than the token budget is not scheduled
  fixtures:
  - small-batch-limits
  config:
    enable-chunked-prefill: false
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-long1
      prompt_segments:
      - key: doc-long
        num_tokens: 200
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.s1.result.value.total_num_scheduled_tokens == 0 && steps.s1.result.value.scheduled_new_reqs == []
  - 'steps.cnt.result.value == {''num_running'': 0, ''num_waiting'': 1}'
  - calls['kv-cache-manager.allocate-slots'] == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.get-request-counts' && e.error == null)
- id: scheduler-kv-continuous-batching-budget-and-max-seqs
  name: Two requests share the 64-token budget; a third waits for a free sequence slot
  fixtures:
  - small-batch-limits
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: chatcmpl-r1
      prompt_segments:
      - key: q1
        num_tokens: 40
      sampling_params:
        max_tokens: 4
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: chatcmpl-r2
      prompt_segments:
      - key: q2
        num_tokens: 40
      sampling_params:
        max_tokens: 4
  - flow: scheduler-add-request
    as: a3
    input:
      request_id: chatcmpl-r3
      prompt_segments:
      - key: q3
        num_tokens: 10
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-r1'': 40, ''chatcmpl-r2'': 24}'
  - 'steps.s2.result.value.num_scheduled_tokens == {''chatcmpl-r1'': 1, ''chatcmpl-r2'': 16}'
  - 'steps.cnt.result.value == {''num_running'': 2, ''num_waiting'': 1}'
  - trace.exists(e, e.type == 'note' && e.title == 'max_num_seqs requests already running')
- id: scheduler-kv-long-prefill-threshold-caps-chunks
  name: long_prefill_token_threshold caps each prefill chunk when several requests compete
  fixtures:
  - tp1-llama-8b
  config:
    long-prefill-token-threshold: 32
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: chatcmpl-r1
      prompt_segments:
      - key: q1
        num_tokens: 100
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: chatcmpl-r2
      prompt_segments:
      - key: q2
        num_tokens: 100
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-r1'': 32, ''chatcmpl-r2'': 32}'
  - 'steps.s2.result.value.num_scheduled_tokens == {''chatcmpl-r1'': 32, ''chatcmpl-r2'': 32} && trace.exists(e, e.type == ''call.end'' && e.interface == ''scheduler.schedule'' && e.output.total_num_scheduled_tokens == 64)'
- id: scheduler-kv-async-scheduling-overlaps-decode
  name: Async scheduling schedules the next decode before the previous output arrives
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
      - 1917
      - 13
      - 3639
      - 374
      - 279
      - 6864
      - 315
      - 9822
      - 30
      sampling_params:
        max_tokens: 16
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-update-from-output
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids:
        - chatcmpl-abc123
        sampled_token_ids:
        - - 791
  expect:
  - 'steps.s2.result.value.num_scheduled_tokens == {''chatcmpl-abc123'': 1}'
  - steps.u1.result.value.outputs[0].new_token_ids == [791] && steps.u1.result.value.outputs[0].finish_reason == null
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.update-from-output' && size(e.output.outputs) == 1)
