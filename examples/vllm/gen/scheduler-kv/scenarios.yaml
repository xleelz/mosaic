      - 1917
      - 13
      - 3639
      - 374
      - 279
      - 6864
      - 315
      - 9822
      - 30
      sampling_params:
        max_tokens: 16
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-update-from-output
