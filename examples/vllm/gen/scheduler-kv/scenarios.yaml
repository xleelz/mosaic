  - steps.s2.result.value.scheduled_new_reqs[0].num_computed_tokens == 96 && steps.s2.result.value.num_scheduled_tokens['chatcmpl-h2'] == 4
  - steps.s2.result.value.scheduled_new_reqs[1].num_computed_tokens == 0 && steps.s2.result.value.num_scheduled_tokens['chatcmpl-h3'] == 104
  - '// the hybrid coordinator and the Mamba manager are the point of this test

    calls[''hybrid-kv-cache-coordinator.find-longest-cache-hit''] == 3 && calls[''mamba-manager.cache-blocks''] >= 1'
  - steps.ck.result.value.block != null && steps.st.result.value.prefix_cache_stats.hits == 96
  - trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-cached-block' && e.error == null)
- id: scheduler-kv-outlines-regex-validation
  name: The outlines validator rejects backreferences, look-arounds, word boundaries, leading anchors, json_object and grammar specs
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: structured-output-validate-outlines
    as: wb
    input:
      structured_outputs:
        regex: a\b
  - flow: structured-output-validate-outlines
    as: br
    input:
      structured_outputs:
        regex: (a)\1
  - flow: structured-output-validate-outlines
    as: la
    input:
      structured_outputs:
        regex: x(?=y)
  - flow: structured-output-validate-outlines
    as: an
    input:
      structured_outputs:
        regex: ^abc
  - flow: structured-output-validate-outlines
    as: ok
    input:
      structured_outputs:
        regex: '[a-z]+[0-9]{2}'
  - flow: structured-output-validate-outlines
    as: ch
    input:
      structured_outputs:
        choice:
        - 'yes'
        - 'no'
  - flow: structured-output-validate-outlines
    as: jo
    input:
      structured_outputs:
        json_object: true
  - flow: structured-output-validate-outlines
    as: gr
    input:
      structured_outputs:
        grammar: root ::= "a"
  - flow: structured-output-validate-outlines
    as: none
    input:
      structured_outputs: null
  - flow: structured-output-validate-outlines
    as: empty
    input:
      structured_outputs: {}
  - flow: structured-output-grammar-init
    as: g1
    input:
      request_id: chatcmpl-o1
      backend: outlines
      request_type: regex
      grammar_spec: '[a-z]+'
  - flow: structured-output-grammar-init
    as: g2
    input:
      request_id: chatcmpl-o2
      backend: outlines
      request_type: grammar
      grammar_spec: root ::= "a"
  - flow: structured-output-grammar-init
    as: g3
    input:
      request_id: chatcmpl-g1
      backend: guidance
      request_type: json
      grammar_spec: '{}'
  expect:
  - steps.wb.result.error.code == 'vllm-validation-error' && steps.br.result.error.code == 'vllm-validation-error' && steps.la.result.error.code == 'vllm-validation-error' && steps.an.result.error.code == 'vllm-validation-error'
  - steps.ok.result.value.valid && steps.ch.result.value.valid && steps.none.result.value.valid && steps.empty.result.value.valid
  - steps.jo.result.error.code == 'vllm-validation-error' && steps.gr.result.error.code == 'vllm-validation-error'
  - steps.g1.result.value.status == 'ready' && steps.g2.result.value.status == 'failed' && steps.g3.result.value.status == 'ready'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'structured-output-manager.grammar-init' && e.output.grammar_id == 'chatcmpl-o1' && e.output.status == 'ready')
- id: scheduler-kv-nixl-prefill-delays-free-until-sent
  name: On a prefill node a finished request keeps its blocks until the decoder's pull finishes, and returns the pull parameters
  fixtures:
  - full-tp1-llama-8b
  config:
    kv-connector: NixlConnector
    kv-role: kv_both
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-pd2
      prompt_segments:
      - key: pd-doc2
        num_tokens: 40
      sampling_params:
        max_tokens: 1
      kv_transfer_params:
        do_remote_decode: true
        do_remote_prefill: false
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-update-from-output
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids:
        - chatcmpl-pd2
        sampled_token_ids:
        - - 791
  - interface: scheduler.has-requests
    caller: engine-core
    as: h1
  - flow: scheduler-schedule
    as: s2
    input: {}
  - interface: scheduler.has-requests
    caller: engine-core
    as: h2
  - flow: scheduler-update-from-output
    as: u2
    input:
      scheduler_output: = steps.s2.result.value
      model_runner_output:
        req_ids: []
        sampled_token_ids: []
        kv_connector_output:
          finished_recving: []
          finished_sending:
          - chatcmpl-pd2
  - interface: scheduler.has-requests
    caller: engine-core
    as: h3
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.u1.result.value.outputs[0].finish_reason == 'length' && steps.u1.result.value.outputs[0].kv_transfer_params.do_remote_prefill
  - steps.u1.result.value.outputs[0].kv_transfer_params.remote_block_ids == [[1, 2, 3]]
  - steps.h1.result.value && steps.h2.result.value && !steps.h3.result.value
  - 'steps.cnt.result.value == {''num_running'': 0, ''num_waiting'': 0} && trace.exists(e, e.type == ''call.end'' && e.interface == ''scheduler.update-from-output'' && size(e.output.outputs) == 0)'
- id: scheduler-kv-regex-compile-timeout
  name: A nested-quantifier regex times out after VLLM_REGEX_COMPILATION_TIMEOUT_S and the grammar fails; a normal one compiles; 0 disables the guard
  description: tests/v1/structured_output/test_regex_compilation_timeout.py
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: structured-output-grammar-init
    as: bad
    input:
      request_id: chatcmpl-re1
      backend: xgrammar
      request_type: regex
      grammar_spec: (a+)+b
  - flow: structured-output-grammar-init
    as: good
    input:
      request_id: chatcmpl-re2
      backend: xgrammar
      request_type: regex
      grammar_spec: '[a-z]+'
  - interface: xgrammar-grammar.is-terminated
    caller: structured-output-manager
    as: g1
    input:
      grammar_id: chatcmpl-re1
  expect:
  - steps.bad.result.value.status == 'failed' && steps.bad.result.value.error == 'value-error' && steps.bad.duration_ms >= 5000 && steps.bad.duration_ms < 6000
  - steps.good.result.value.status == 'ready' && steps.g1.result.error.code == 'key-error'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'structured-output-manager.grammar-init' && e.output.status == 'ready')
- id: scheduler-kv-regex-compile-timeout-disabled
  name: With the timeout set to 0 the compile runs inline however long it takes
  fixtures:
  - tp1-llama-8b
  config:
    vllm-regex-compilation-timeout-s: 0
  steps:
  - flow: structured-output-grammar-init
    as: slow
    input:
      request_id: chatcmpl-re1
      backend: xgrammar
      request_type: regex
      grammar_spec: (a+)+b
  - interface: xgrammar-grammar.is-terminated
    caller: structured-output-manager
    as: g
    input:
      grammar_id: chatcmpl-re1
  expect:
  - steps.slow.result.value.status == 'ready' && steps.slow.duration_ms >= 60000
  - steps.g.result.ok && trace.exists(e, e.type == 'call.end' && e.interface == 'xgrammar-grammar.is-terminated' && e.output.terminated == false)
