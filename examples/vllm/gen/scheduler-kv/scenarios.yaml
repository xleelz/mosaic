  - interface: xgrammar-grammar.accept-tokens
    caller: structured-output-manager
    as: ad2
    input:
      grammar_id: g-default
      tokens:
      - 1
  - interface: xgrammar-grammar.accept-tokens
    caller: structured-output-manager
    as: ao2
    input:
      grammar_id: g-override
      tokens:
      - 1
  - interface: xgrammar-grammar.is-terminated
