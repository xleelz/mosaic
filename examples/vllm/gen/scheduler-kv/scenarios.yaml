  - flow: scheduler-schedule
    as: s3
    input: {}
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: look
    input:
      block_hash: pd-doc@96
  expect:
  - steps.s1.result.value.total_num_scheduled_tokens == 0 && steps.s2.result.value.total_num_scheduled_tokens == 0
  - trace.exists(e, e.type == 'call.start' && e.interface == 'kv-connector-base-v1.get-num-new-matched-tokens')
  - trace.exists(e, e.type == 'call.start' && e.interface == 'kv-connector-base-v1.build-connector-meta')
  - 'steps.s3.result.value.num_scheduled_tokens == {''chatcmpl-pd1'': 1} && steps.s3.result.value.scheduled_new_reqs[0].num_computed_tokens == 99'
  - steps.look.result.value.block != null && trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.schedule' && e.output.total_num_scheduled_tokens == 1)
- id: scheduler-kv-hybrid-replay-hits-mamba-checkpoint
  name: On a hybrid model a replayed prompt hits up to the Mamba checkpoint; a prompt sharing only an earlier prefix gets no hit
  fixtures:
  - tp1-llama-8b
  state:
    kv-cache-manager:
      kv_cache_groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 16
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: chatcmpl-h1
      prompt_segments:
      - key: sess-0
        num_tokens: 100
  - flow: scheduler-schedule-hybrid
    as: s1
    input: {}
  - flow: scheduler-finish-requests
    as: f1
    input:
      request_ids:
      - chatcmpl-h1
      finished_status: FINISHED_STOPPED
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: chatcmpl-h2
      prompt_segments:
      - key: sess-0
        num_tokens: 100
  - flow: scheduler-add-request
    as: a3
    input:
      request_id: chatcmpl-h3
      prompt_segments:
      - key: sess-0
        num_tokens: 64
      - key: other
        num_tokens: 40
  - flow: scheduler-schedule-hybrid
    as: s2
    input: {}
  - flow: scheduler-make-stats
    as: st
    input: {}
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: ck
    input:
