  fixtures:
  - tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
      - 1917
      sampling_params:
        max_tokens: 16
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-update-from-output
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids:
        - chatcmpl-abc123
        sampled_token_ids:
        - - 128009
  - flow: scheduler-schedule
    as: s2
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.u1.result.value.outputs[0].finish_reason == 'stop' && steps.u1.result.value.outputs[0].new_token_ids == [128009]
  - steps.s2.result.value.finished_req_ids == ['chatcmpl-abc123']
  - 'steps.cnt.result.value == {''num_running'': 0, ''num_waiting'': 0}'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.get-request-counts' && e.error == null)
