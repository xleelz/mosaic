- id: scheduler-kv-r3-test-3
  name: Three prompts prefill concurrently in 2-token chunks (long_prefill_token_threshold 2, budget 6) and each finishes with one output
  description: LLM(..., long_prefill_token_threshold=2, max_num_batched_tokens=6, max_num_seqs=3, enable_prefix_caching=True, block_size=16). The test's sampling defaults are replaced by max_tokens 1 (the test only checks one completion per prompt); the prompt is 9 tokens.
  fixtures:
  - tp1-llama-8b
  config:
    long-prefill-token-threshold: 2
    max-num-batched-tokens: 6
    max-num-seqs: 3
    async-scheduling: false
  steps:
  - flow: scheduler-add-request
    as: a0
    input:
      request_id: cmpl-r0
      prompt_token_ids: &id001
      - 1
      - 15043
      - 590
      - 1024
      - 338
      - 4755
      - 322
      - 306
      - 29871
      sampling_params:
        max_tokens: 1
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: cmpl-r1
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 1
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: cmpl-r2
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 1
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-update-from-output
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - []
        - []
        - []
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-update-from-output
    as: u2
    input:
      scheduler_output: = steps.s2.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - []
        - []
        - []
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-update-from-output
    as: u3
    input:
      scheduler_output: = steps.s3.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - []
        - []
        - []
  - flow: scheduler-schedule
    as: s4
    input: {}
  - flow: scheduler-update-from-output
    as: u4
    input:
      scheduler_output: = steps.s4.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
