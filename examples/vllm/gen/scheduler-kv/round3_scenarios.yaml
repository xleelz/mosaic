- id: scheduler-kv-r3-partial-entry-replaced-and-null
  name: A longer partial entry replaces the block's shorter one; the null block is never cached
  fixtures:
  - tp1-llama-8b
  state:
    block-pool:
      num_gpu_blocks: 3
      next_fresh: 1
      free_front: []
      free_tail: []
      ref_cnt: {}
      block_hash: {}
      cached: {}
      hash_tokens: {}
  steps:
  - interface: block-pool.get-new-blocks
    caller: kv-cache-manager
    as: alloc
    input:
      num_blocks: 2
  - interface: block-pool.cache-partial-block
    caller: kv-cache-manager
    as: p8
    input:
      block_id: 2
      block_hash: h@8
      num_tokens: 8
  - interface: block-pool.cache-partial-block
    caller: kv-cache-manager
    as: p10
    input:
      block_id: 2
      block_hash: h@10
      num_tokens: 10
  - interface: block-pool.cache-partial-block
    caller: kv-cache-manager
    as: nullblk
    input:
      block_id: 0
      block_hash: h@2
      num_tokens: 2
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: old
    input:
      block_hash: h@8
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: new
    input:
      block_hash: h@10
  expect:
  - steps.p10.result.value.removed == ['h@8'] && !steps.nullblk.result.value.cached
  - steps.old.result.value.block == null && steps.new.result.value.block.block_id == 2
  - trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-cached-block' && e.output.block != null)
