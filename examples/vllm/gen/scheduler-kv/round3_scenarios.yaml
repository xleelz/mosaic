- id: scheduler-kv-r3-test-6
  name: A partial-tail entry (hash at 10 tokens inside a 6-token block) is hit by a replay and by a longer request
  description: hash_block_size 2, block_size 6, pool of 3 blocks. The prefix-chain hash at 10 tokens is the same string for the original, the replay and the extended request (the model's hashes are prefix-determined), so one lookup stands for both.
  fixtures:
  - tp1-llama-8b
  state:
    block-pool:
      num_gpu_blocks: 3
      next_fresh: 1
      free_front: []
      free_tail: []
      ref_cnt: {}
      block_hash: {}
      cached: {}
      hash_tokens: {}
  steps:
  - interface: block-pool.get-new-blocks
    caller: kv-cache-manager
    as: alloc
    input:
      num_blocks: 2
  - interface: block-pool.cache-full-blocks
    caller: kv-cache-manager
    as: full
    input:
      block_ids:
      - 1
      block_hashes:
      - 0,0,1,1,2,2@6
  - interface: block-pool.cache-partial-block
    caller: kv-cache-manager
    as: part
    input:
      block_id: 2
      block_hash: 0,0,1,1,2,2,3,3,4,4@10
      num_tokens: 10
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: replay
    input:
      block_hash: 0,0,1,1,2,2,3,3,4,4@10
  expect:
  - steps.alloc.result.value.block_ids == [1, 2] && steps.part.result.value.cached
  - steps.replay.result.value.block.block_id == 2
  - trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-cached-block')
