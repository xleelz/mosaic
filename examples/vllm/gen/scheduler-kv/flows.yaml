flows:
  - id: scheduler-add-request
    name: Scheduler admits a request
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.add-request}
    sources: ["vllm/v1/core/sched/scheduler.py:2616-2647"]
  - id: scheduler-schedule
    name: One scheduler step (continuous batching)
    tags: [writes, "feature:continuous-batching", "feature:chunked-prefill", "feature:prefix-caching", "feature:preemption", "feature:priority-scheduling"]
    entry: {caller: engine-core, interface: scheduler.schedule}
    sources: ["vllm/v1/core/sched/scheduler.py:591-1556"]
  - id: scheduler-update-from-output
    name: Apply a step's model output
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.update-from-output}
    sources: ["vllm/v1/core/sched/scheduler.py:2026-2424"]
  - id: scheduler-finish-requests
    name: Abort or finish requests from outside the scheduler
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.finish-requests}
    sources: ["vllm/v1/core/sched/scheduler.py:2649-2712"]
  - id: scheduler-reset-prefix-cache
    name: Reset the prefix cache
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.reset-prefix-cache}
    sources: ["vllm/v1/core/sched/scheduler.py:2840-2883"]
  - id: scheduler-make-stats
    name: Scheduler stats (running, waiting, KV usage, prefix-cache hits)
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.make-stats}
    sources: ["vllm/v1/core/sched/scheduler.py:2915-2959"]
  - id: structured-output-grammar-init
    name: Compile a structured-output grammar
    tags: [writes, "feature:structured-outputs"]
    entry: {caller: engine-core, interface: structured-output-manager.grammar-init}
    sources: ["vllm/v1/structured_output/__init__.py:126-187"]
  - id: kv-offload-pin-mmap-region
    name: Pin the CPU offload region
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: kv-offload-cpu-gpu-worker.pin-mmap-region}
    sources: ["vllm/v1/kv_offload/cpu/gpu_worker.py:201-240", "vllm/v1/kv_offload/cpu/host_register.py:33-97"]
  - id: kv-offload-worker-view
    name: Carve a worker view of the shared offload region
    tags: [writes]
    entry: {caller: kv-offload, interface: shared-offload-region.create-next-worker-view}
    sources: ["vllm/v1/kv_offload/cpu/shared_offload_region.py:245-283"]
  - id: kv-offload-swap-blocks
    name: Batched CPU->GPU block swap
    tags: ["feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: swap-blocks-triton.swap-blocks-batch}
    sources: ["vllm/v1/kv_offload/cpu/swap_blocks_triton.py:49-74"]
  - id: kv-offload-dma-copy-loop
    name: DmaCopyBackend copy thread (busy loop)
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: dma-copy-backend.copy-loop, repeat: {count: 4, interval_ms: 0}}
    sources: ["vllm/v1/simple_kv_offload/copy_backend.py:103-130"]
  - id: kv-offload-disk-store-loop
    name: DiskBackend store thread (busy loop)
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: disk-store-thread.store-loop, repeat: {count: 3, interval_ms: 0}}
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:236-252"]
  - id: kv-offload-disk-load-loop
    name: DiskBackend load thread (busy loop)
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: disk-load-thread.load-loop, repeat: {count: 3, interval_ms: 0}}
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:270-286"]
  - id: kv-offload-async-lookup-worker
    name: AsyncLookupManager lookup thread (busy loop)
    tags: [writes]
    entry: {caller: kv-offload, interface: async-lookup-manager.worker, repeat: {count: 2, interval_ms: 0}}
    sources: ["vllm/v1/kv_offload/tiering/async_lookup.py:248-284"]
  - id: kv-offload-fs-io-worker
    name: DualQueueThreadPool IO thread (busy loop)
    tags: [writes]
    entry: {caller: kv-offload, interface: dual-queue-thread-pool.worker, repeat: {count: 4, interval_ms: 0}}
    sources: ["vllm/v1/kv_offload/tiering/fs/thread_pool.py:162-194"]
  - id: scheduler-schedule-hybrid
    name: A scheduler step on a hybrid (attention + Mamba) model
    description: "Same entry as scheduler-schedule, run with two KV cache groups so the HybridKVCacheCoordinator and MambaManager decide the prefix hit."
    tags: [writes, "feature:hybrid-kv-cache"]
    entry: {caller: engine-core, interface: scheduler.schedule}
    sources: ["vllm/v1/core/sched/scheduler.py:591-1556", "vllm/v1/core/kv_cache_coordinator.py:796-935"]
  - id: structured-output-validate-outlines
    name: Validate a structured-output request for the outlines backend
    tags: ["feature:structured-outputs"]
    entry: {caller: engine-core, interface: backend-outlines.validate-structured-output-request-outlines}
    sources: ["vllm/v1/structured_output/backend_outlines.py:195-238"]
  - id: scheduler-update-draft-token-ids
    name: Store the drafter's draft tokens (sync speculative decoding)
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.update-draft-token-ids}
    sources: ["vllm/v1/core/sched/scheduler.py:2550-2569"]
  - id: structured-output-validate-xgrammar
    name: Validate a structured-output request for the xgrammar backend
    tags: ["feature:structured-outputs"]
    entry: {caller: engine-core, interface: xgrammar-backend.validate-xgrammar-grammar}
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:407-504"]
