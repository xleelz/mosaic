# Hand-written part of the serving-api fragment; build.py merges it with the generated parts.
components:
  # ---------------------------------------------------------------- app plumbing
  - id: app-state
    name: API server app state
    kind: module
    parent: api-server
    layer: api
    summary: "init_app_state: the FastAPI app.state the route handlers read (supported tasks, serving handlers)."
    sources: ["vllm/entrypoints/launchers/api_server/app_state.py:24-176"]
    state:
      schema: {type: object, properties: {supported_tasks: {type: array, items: {type: string}}, initialized: {type: boolean}}}
      initial: {supported_tasks: [generate], initialized: true}
  - id: server-load-metrics
    name: Server load counter
    kind: metrics
    parent: app-state
    layer: api
    summary: "app.state.server_load_metrics: in-flight request count kept by load_aware_call when --enable-server-load-tracking is set."
    sources: ["vllm/entrypoints/serve/utils/api_utils.py:96-145", "vllm/entrypoints/launchers/api_server/app_state.py:175-176"]
    state:
      schema: {type: object, properties: {counters: {type: object, properties: {server_load_metrics: {type: integer}}}}}
      initial: {counters: {server_load_metrics: 0}}
  - id: authentication-middleware
    name: AuthenticationMiddleware
    kind: module
    parent: api-server
    layer: api
    summary: "Pure ASGI middleware: when --api-key is set, requests under /v1, /v2, /inference and /cohere need a matching Bearer token or get 401."
    sources: ["vllm/entrypoints/serve/middleware/authenticate.py:14-62", "vllm/entrypoints/serve/middleware/register.py:32-36"]
  - id: scaling-middleware
    name: ScalingMiddleware
    kind: module
    parent: api-server
    layer: api
    summary: "Refuses every HTTP request with 503 while an elastic-EP scale is in progress (a module-level flag AsyncLLM sets)."
    sources: ["vllm/entrypoints/serve/elastic_ep/middleware.py:9-48", "vllm/entrypoints/serve/middleware/register.py:43-47"]
    state:
      schema: {type: object, properties: {scaling_elastic_ep: {type: boolean}}}
      initial: {scaling_elastic_ep: false}
  - id: exception-handling
    name: Exception handlers
    kind: module
    parent: api-server
    layer: api
    summary: "The FastAPI exception handlers and create_error_response: map vLLM and raw exceptions to an ErrorResponse with an HTTP status."
    sources: ["vllm/entrypoints/serve/exception_handling/register.py:26-42", "vllm/entrypoints/serve/exception_handling/error_response.py:14-100"]
  - id: api-utils
    name: api_utils
    kind: module
    parent: api-server
    layer: api
    summary: "Route helpers: with_cancellation and its listen_for_disconnect loop, load_aware_call, get_max_tokens."
    sources: ["vllm/entrypoints/serve/utils/api_utils.py:36-202"]
    state:
      schema: {type: object, properties: {inbox: {type: array}, disconnected: {type: boolean}}}
      initial: {inbox: [], disconnected: false}
  - id: launcher
    name: launcher
    kind: module
    parent: api-server
    layer: api
    summary: "serve_http, the engine watchdog and terminate_if_errored: sets uvicorn's should_exit when the engine core died."
    sources: ["vllm/entrypoints/launchers/launcher.py:175-334"]
    state:
      schema: {type: object, properties: {server_should_exit: {type: boolean}, listening: {type: boolean}, shutdown_requested: {type: boolean}}}
      # the shared worlds model a server that is up (serve_http ran); run_server's setup_server clears it
      initial: {server_should_exit: false, listening: true, shutdown_requested: false}
  - id: api-server-entry
    name: api_server entry
    kind: module
    parent: api-server
    layer: process
    summary: "run_server, build_async_engine_client and build_and_serve: start the engine client, build the app, serve HTTP."
    sources: ["vllm/entrypoints/launchers/api_server/entry.py:35-236"]
  - id: openai-api-server
    name: openai.api_server (deprecated module)
    kind: module
    parent: api-server
    layer: process
    summary: "Deprecated `python -m vllm.entrypoints.openai.api_server`, forwarding to launchers.api_server.entry.main."
    sources: ["vllm/entrypoints/openai/api_server.py:50-59"]
  - id: grpc-server
    name: gRPC server launcher
    kind: module
    parent: api-server
    layer: process
    summary: "`vllm serve --grpc` and `python -m vllm.entrypoints.launchers.grpc_server`: an AsyncLLM behind a gRPC servicer."
    sources: ["vllm/entrypoints/launchers/grpc_server.py:174-208", "vllm/entrypoints/grpc_server.py:18-27"]
  - id: render-entry
    name: render server entry
    kind: module
    parent: api-server
    layer: process
    summary: "`vllm launch render`: a GPU-less FastAPI server that only renders (tokenizes) and derenders requests."
    sources: ["vllm/entrypoints/launchers/render/entry.py:21-129"]
  # ---------------------------------------------------------------- serving classes
  - id: base-serving
    name: BaseServing
    kind: module
    parent: api-server
    layer: api
    summary: "Shared request checks: the served-model name (or a loaded LoRA adapter) and the request id."
    sources: ["vllm/entrypoints/serve/engine/serving.py:31-213"]
  - id: generate-base-serving
    name: GenerateBaseServing
    kind: module
    parent: base-serving
    layer: api
    summary: "Base of the generative handlers: _preflight (engine dead, admission) and _raise_if_error (finish_reason error)."
    sources: ["vllm/entrypoints/generate/base/serving.py:129-300"]
  - id: openai-serving-models
    name: OpenAIServingModels
    kind: module
    parent: api-server
    layer: api
    summary: "The served base models and the LoRA adapters loaded at runtime (/v1/models, /v1/load_lora_adapter, /v1/unload_lora_adapter)."
    sources: ["vllm/entrypoints/openai/models/serving.py:80-363"]
    state:
      schema: {type: object, properties: {lora_requests: {type: object}, lora_id_counter: {type: integer}}}
      initial: {lora_requests: {}, lora_id_counter: 0}
  - id: online-renderer
    name: OnlineRenderer
    kind: module
    parent: api-server
    layer: api
    summary: "Request preprocessing for the online handlers: tool-choice and chat-template checks, then chat templating and tokenization."
    sources: ["vllm/renderers/online_renderer.py:154-760"]
  - id: base-renderer
    name: BaseRenderer
    kind: module
    parent: online-renderer
    layer: api
    summary: "Tokenization and its validators (truncation, max context length, out-of-vocabulary ids) and detokenization."
    sources: ["vllm/renderers/base.py:105-736", "vllm/renderers/params.py:243-560"]
  - id: hf-renderer
    name: HfRenderer
    kind: module
    parent: online-renderer
    layer: api
    summary: "Applies the Hugging Face chat template to the conversation and tokenizes the rendered prompt."
    sources: ["vllm/renderers/hf.py:945-1180"]
    state:
      schema: {type: object, properties: {added_tokens: {type: object}}}
      initial: {added_tokens: {}}
  - id: openai-serving-chat
    name: OpenAIServingChat
    kind: module
    parent: generate-base-serving
    layer: api
    summary: "POST /v1/chat/completions: render the conversation, call AsyncLLM.generate, return a full response or an SSE stream."
    sources: ["vllm/entrypoints/openai/chat_completion/serving.py:118-1333", "vllm/entrypoints/openai/chat_completion/api_router.py:41-112"]
  - id: openai-serving-chat-batch
    name: OpenAIServingChatBatch
    kind: module
    parent: openai-serving-chat
    layer: api
    summary: "POST /v1/chat/completions/batch: several conversations in one request, generated concurrently and returned together."
    sources: ["vllm/entrypoints/openai/chat_completion/batch_serving.py:34-350"]
  - id: openai-serving-completion
    name: OpenAIServingCompletion
    kind: module
    parent: generate-base-serving
    layer: api
    summary: "POST /v1/completions: one engine request per prompt, merged; full response or SSE stream."
    sources: ["vllm/entrypoints/openai/completion/serving.py:55-742"]
  - id: openai-serving-responses
    name: OpenAIServingResponses
    kind: module
    parent: generate-base-serving
    layer: api
    summary: "The Responses API: create (optionally stored and/or in the background), retrieve and cancel, with an in-memory response store."
    sources: ["vllm/entrypoints/openai/responses/serving.py:102-1192"]
    state:
      schema: {type: object, properties: {response_store: {type: object}, msg_store: {type: object}, background_tasks: {type: object}, seq: {type: integer}}}
      initial: {response_store: {}, msg_store: {}, background_tasks: {}, seq: 0}
  - id: serving-tokenization
    name: ServingTokenization
    kind: module
    parent: base-serving
    layer: api
    summary: "POST /tokenize, POST /detokenize and GET /tokenizer_info."
    sources: ["vllm/entrypoints/serve/tokenize/serving.py:32-195", "vllm/entrypoints/serve/tokenize/api_router.py:33-99"]
  - id: anthropic-serving-messages
    name: AnthropicServingMessages
    kind: module
    parent: openai-serving-chat
    layer: api
    summary: "The Anthropic Messages API on top of the chat handler: convert to a ChatCompletionRequest and back."
    sources: ["vllm/entrypoints/anthropic/serving.py:146-1268", "vllm/entrypoints/anthropic/api_router.py:51-119"]
  - id: cohere-serving-chat-v2
    name: CohereServingChatV2
    kind: module
    parent: openai-serving-chat
    layer: api
    summary: "The opt-in Cohere v2 chat API (VLLM_ENABLE_COHERE_API) on top of the chat handler."
    sources: ["vllm/entrypoints/cohere/api_router.py:118-206", "vllm/entrypoints/cohere/serving.py:300-320"]
  - id: pooling-base-serving
    name: PoolingBaseServing
    kind: module
    parent: base-serving
    layer: api
    summary: "The pooling pipeline: preprocess, one AsyncLLM.encode per input (merged), collect, postprocess."
    sources: ["vllm/entrypoints/pooling/base/serving.py:33-280"]
  - id: serving-embedding
    name: ServingEmbedding
    kind: module
    parent: pooling-base-serving
    layer: api
    summary: "POST /v1/embeddings and POST /v2/embed, registered only when the model supports the embed task."
    sources: ["vllm/entrypoints/pooling/embed/serving.py:42-220", "vllm/entrypoints/pooling/embed/api_router.py:20-61"]
  - id: serving-classification
    name: ServingClassification
    kind: module
    parent: pooling-base-serving
    layer: api
    summary: "POST /classify, registered only for classify-capable models."
    sources: ["vllm/entrypoints/pooling/classify/serving.py:28-72"]
  - id: serving-pooling
    name: ServingPooling
    kind: module
    parent: pooling-base-serving
    layer: api
    summary: "POST /pooling, registered when the model has a pooling task."
    sources: ["vllm/entrypoints/pooling/pooling/serving.py:35-191"]
  - id: serving-scores
    name: ServingScores
    kind: module
    parent: pooling-base-serving
    layer: api
    summary: "POST /score, /v1/score, /rerank, /v1/rerank and /v2/rerank, registered when the scoring API is enabled for the model."
    sources: ["vllm/entrypoints/pooling/scoring/serving.py:36-315", "vllm/entrypoints/pooling/scoring/api_router.py:37-111"]
  - id: serving-render
    name: ServingRender
    kind: module
    parent: base-serving
    layer: api
    summary: "Scale-out render routes: tokenize a request into a GenerateRequest without generating (403 unless scale-out is enabled)."
    sources: ["vllm/entrypoints/scale_out/render/serving.py:44-359", "vllm/entrypoints/scale_out/render/api_router.py:28-120"]
  - id: serving-derender
    name: ServingDerender
    kind: module
    parent: base-serving
    layer: api
    summary: "Scale-out derender routes: detokenize a token-level generate response into an OpenAI response."
    sources: ["vllm/entrypoints/scale_out/derender/serving.py:39-434", "vllm/entrypoints/scale_out/derender/api_router.py:31-126"]
  - id: serving-tokens
    name: ServingTokens
    kind: module
    parent: generate-base-serving
    layer: api
    summary: "Token-in/token-out generate and abort for disaggregated deployments."
    sources: ["vllm/entrypoints/scale_out/token_in_token_out/serving.py:114-821", "vllm/entrypoints/scale_out/token_in_token_out/api_router.py:46-111"]
  # ---------------------------------------------------------------- routers without a serving class
  - {id: instrumentator-health, name: health router, kind: module, parent: api-server, layer: api, summary: "GET /health: 200 when the engine is healthy, 503 when the engine core is dead.", sources: ["vllm/entrypoints/serve/instrumentator/health.py:15-33"]}
  - {id: instrumentator-basic, name: basic instrumentator router, kind: module, parent: api-server, layer: api, summary: "GET /load, GET /version and GET /kv_event_sources.", sources: ["vllm/entrypoints/serve/instrumentator/basic.py:15-63"]}
  - {id: dev-cache-router, name: dev cache router, kind: module, parent: api-server, layer: api, summary: "Dev-mode cache resets (prefix, multi-modal, encoder).", sources: ["vllm/entrypoints/serve/dev/cache/api_router.py:15-68"]}
  - {id: dev-sleep-router, name: dev sleep router, kind: module, parent: api-server, layer: api, summary: "Dev-mode sleep, wake-up and KV-cache release.", sources: ["vllm/entrypoints/serve/dev/sleep/api_router.py:15-65"]}
  - {id: dev-rpc-router, name: dev collective_rpc router, kind: module, parent: api-server, layer: api, summary: "Dev-mode POST /collective_rpc onto every worker.", sources: ["vllm/entrypoints/serve/dev/rpc/api_router.py:15-63"]}
  - {id: server-info-router, name: dev server_info router, kind: module, parent: api-server, layer: api, summary: "Dev-mode GET /server_info: the resolved VllmConfig, VLLM_* env vars and system info.", sources: ["vllm/entrypoints/serve/dev/server_info/api_router.py:20-63"]}
  - {id: profile-router, name: profile router, kind: module, parent: api-server, layer: api, summary: "POST /start_profile and /stop_profile, registered only when a profiler is configured.", sources: ["vllm/entrypoints/serve/profile/api_router.py:15-65"]}
  - {id: rl-online-router, name: RL online router, kind: module, parent: api-server, layer: api, summary: "Dev-mode RL control: pause/resume/abort generation, weight transfer and checks.", sources: ["vllm/entrypoints/rl/online/api_router.py:24-286"]}
  - {id: elastic-ep-router, name: elastic EP router, kind: module, parent: api-server, layer: api, summary: "POST /scale_elastic_ep and /is_scaling_elastic_ep (generate models).", sources: ["vllm/entrypoints/serve/elastic_ep/api_router.py:20-89"]}
  - {id: fault-tolerance-router, name: fault tolerance router, kind: module, parent: api-server, layer: api, summary: "POST /fault_tolerance/apply (202, recovery in the background) and GET /fault_tolerance/status.", sources: ["vllm/entrypoints/serve/fault_tolerance/api_router.py:20-100"]}
  - {id: sagemaker-router, name: SageMaker router, kind: module, parent: api-server, layer: api, summary: "GET/POST /ping (the health check) and POST /invocations (dispatch by request shape).", sources: ["vllm/entrypoints/serve/sagemaker/api_router.py:64-140"]}
  - id: dp-supervisor
    name: DPSupervisor
    kind: module
    parent: api-server
    layer: process
    summary: "Multi-port DP launcher: supervises one API server per local DP rank and serves /health, /ready, /readyz."
    sources: ["vllm/entrypoints/launchers/dp_supervisor.py:218-236"]
    state:
      schema: {type: object, properties: {is_ready: {type: boolean}}}
      initial: {is_ready: true}
  - id: weight-cache-health-state
    name: preload health state
    kind: module
    parent: api-server
    layer: process
    summary: "`vllm preload` weight-cache daemon's /health: 200 once marked ready and no daemon process has exited."
    sources: ["vllm/entrypoints/cli/preload.py:50-100"]
    state:
      schema: {type: object, properties: {ready: {type: boolean}, exited_processes: {type: integer}}}
      initial: {ready: false, exited_processes: 0}
  # ---------------------------------------------------------------- CLI
  - {id: cli-main, name: vllm CLI main, kind: module, parent: api-server, layer: cli, summary: "`vllm <subcommand>`: build the parser from the subcommand modules, validate and dispatch.", sources: ["vllm/entrypoints/cli/main.py:39-126"]}
  - {id: serve-subcommand, name: ServeSubcommand, kind: module, parent: cli-main, layer: cli, summary: "`vllm serve`: choose gRPC, headless, multi-port DP, multi-API-server or single API server mode.", sources: ["vllm/entrypoints/cli/serve.py:48-174"]}
  - {id: chat-command, name: ChatCommand, kind: module, parent: cli-main, layer: cli, summary: "`vllm chat`: an interactive (or -q one-shot) streaming chat client against a running server.", sources: ["vllm/entrypoints/cli/openai.py:169-248"]}
  - {id: complete-command, name: CompleteCommand, kind: module, parent: cli-main, layer: cli, summary: "`vllm complete`: a streaming completion client against a running server.", sources: ["vllm/entrypoints/cli/openai.py:251-322"]}
  - {id: run-batch-subcommand, name: RunBatchSubcommand, kind: module, parent: cli-main, layer: cli, summary: "`vllm run-batch`: run an OpenAI batch file offline.", sources: ["vllm/entrypoints/cli/run_batch.py:21-64"]}
  - {id: launch-subcommand, name: LaunchSubcommand, kind: module, parent: cli-main, layer: cli, summary: "`vllm launch <component>`: dispatch to a launch sub-subcommand.", sources: ["vllm/entrypoints/cli/launch.py:67-111"]}
  - {id: render-subcommand, name: RenderSubcommand, kind: module, parent: launch-subcommand, layer: cli, summary: "`vllm launch render`: start the GPU-less render server.", sources: ["vllm/entrypoints/cli/launch.py:46-64"]}
  - {id: run-batch, name: run_batch, kind: module, parent: api-server, layer: cli, summary: "Offline batch runner: read JSONL requests, run them concurrently through the serving handlers, write results.", sources: ["vllm/entrypoints/launchers/run_batch.py:555-901"]}
  - {id: openai-run-batch, name: openai.run_batch (deprecated module), kind: module, parent: api-server, layer: cli, summary: "Deprecated `python -m vllm.entrypoints.openai.run_batch`, forwarding to launchers.run_batch.", sources: ["vllm/entrypoints/openai/run_batch.py:19-30"]}
  # ---------------------------------------------------------------- offline LLM
  - id: llm
    name: LLM
    kind: module
    parent: api-server
    layer: offline
    summary: "The offline vllm.LLM class: renders and adds requests to an in-process LLMEngine and steps it to completion."
    sources: ["vllm/entrypoints/llm.py:80-911"]
    state:
      schema: {type: object, properties: {request_counter: {type: integer}, supported_tasks: {type: array}, default_sampling_params: {}}}
      initial: {request_counter: 0, supported_tasks: [generate], default_sampling_params: null}
  # ---------------------------------------------------------------- parsers
  - id: reasoning-parser-manager
    name: ReasoningParserManager
    kind: module
    parent: api-server
    layer: parsers
    summary: "Registry of reasoning parsers by name, eager and lazily imported (vllm.reasoning registers every built-in lazily at import)."
    sources: ["vllm/reasoning/abs_reasoning_parsers.py:200-270", "vllm/reasoning/__init__.py:21-184"]
    tags: [cache]
    state:
      schema: {type: object, properties: {reasoning_parsers: {type: object}, lazy_parsers: {type: object}}}
      initial:
        reasoning_parsers: {}
        lazy_parsers: {deepseek_v3: DeepSeekV3ReasoningParser, deepseek_v4: DeepSeekV4ParserReasoningAdapter, deepseek_v41: DeepSeekV41ParserReasoningAdapter, poolside_v1: PoolsideV1ReasoningParser, cohere_command3: CohereCommand3ReasoningParser, cohere_command4: CohereCommand4ReasoningParser, ernie45: Ernie45ReasoningParser, gemma4: Gemma4ParserReasoningAdapter, glm45: Glm47MoeParserReasoningAdapter, glm47: Glm47MoeParserReasoningAdapter, ling3: Ling3ParserReasoningAdapter, openai_gptoss: GptOssReasoningParser, granite: GraniteReasoningParser, granite_thinking_parser: GraniteThinkingParserReasoningAdapter, hf: ResponseTemplateReasoningParser, holo2: DeepSeekV3ReasoningWithThinkingParser, hunyuan_a13b: HunyuanA13BReasoningParser, hy_v3: HYV3ReasoningParser, hy_v4: HYV4ReasoningParser, kimi_k2: KimiK2ReasoningParser, kimi_k3: KimiK3ReasoningParser, k2_horizon: K2HorizonReasoningParser, mimo: MiMoParserReasoningAdapter, minicpmv: MiniCPMVParserReasoningAdapter, minimax_m2: MiniMaxM2ReasoningParser, minimax_m2_append_think: MiniMaxM2AppendThinkReasoningParser, minimax_m3: MiniMaxM3ReasoningParser, mistral: MistralParserReasoningAdapter, nemotron_v3: NemotronV3ParserReasoningAdapter, olmo3: Olmo3ReasoningParser, plamo3: Plamo3ParserReasoningAdapter, muse_glimmer: MuseGlimmerReasoningParser, qwen3: Qwen3ParserReasoningAdapter, seed_oss: SeedOssParserReasoningAdapter, step3: Step3ReasoningParser, step3p5: Step3p5ParserReasoningAdapter, inkling: InklingParserReasoningAdapter}
  - {id: glm47-moe-parser, name: Glm47MoeParser, kind: module, parent: api-server, layer: parsers, summary: "GLM-4.5/4.7 reasoning and tool-call parser on the declarative ParserEngine (starts in REASONING when thinking is on).", sources: ["vllm/parser/glm47_moe.py:100-240", "vllm/reasoning/glm47_moe_reasoning_parser.py:1-6"]}
  - {id: qwen3-parser, name: Qwen3Parser, kind: module, parent: api-server, layer: parsers, summary: "Qwen3 <think>/</think> reasoning and <tool_call> XML tool-call parser on the declarative ParserEngine; enable_thinking picks the initial state and whether to wait for reasoning.", sources: ["vllm/parser/qwen3.py:88-245"]}
  - {id: deepseek-v4-parser, name: DeepSeekV4Parser, kind: module, parent: api-server, layer: parsers, summary: "DeepSeek V4 DSML tool-call parser; its argument converter turns DSML parameters into JSON arguments.", sources: ["vllm/parser/deepseek_v4.py:40-260"]}
  - {id: model-config, name: ModelConfig, kind: module, parent: control, layer: control, summary: "ModelConfig (owned by config-platform).", sources: ["vllm/config/model.py:120-330"], attributes: {boundary: true, owner: config-platform}}

interfaces: []
flows: []
scenarios: []
