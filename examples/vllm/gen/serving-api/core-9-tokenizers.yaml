      - "steps.mistral.result.value.tokenizer_class == 'MistralTokenizer' && steps.pool.result.value.truncation_side == 'right'"
      - "steps.badmode.result.error.message == 'No tokenizer registered for tokenizer_mode=\\'nope\\'.' && steps.missing.result.error.code == 'os-error'"
      - "steps.hfmistral.result.error.code == 'value-error' && steps.renderer.result.value.renderer_class == 'HfRenderer'"
  - id: serving-api-tokenizer-encode-decode
    name: "TokenizerLike encode/decode/get_vocab: BOS added by default; skip_special_tokens drops <|eot_id|>"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: hf-tokenizer.encode, caller: api-server, as: enc, input: {text: "hello world"}}
      - {interface: hf-tokenizer.encode, caller: api-server, as: raw, input: {text: "hello world", add_special_tokens: false}}
      - {interface: hf-tokenizer.decode, caller: api-server, as: keep, input: {ids: [34173, 128009]}}
      - {interface: hf-tokenizer.decode, caller: api-server, as: skip, input: {ids: [34173, 128009], skip_special_tokens: true}}
      - {interface: hf-tokenizer.get-vocab, caller: api-server, as: v, input: {}}
    expect:
      - "steps.enc.result.value.ids == [128000, 1005, 1005] && steps.raw.result.value.ids == [1005, 1005]"
      - "steps.keep.result.value.text == ' t34173<|eot_id|>' && steps.skip.result.value.text == ' t34173'"
      - "steps.v.result.value.size == 128256"
