# Fix round 6 (mechanism coverage): the pooling, embedding and scoring endpoints end to end, the
# pooling task and its refusals, SageMaker routing by validation, LLM.encode's checks, the renderer's
# post-expansion truncation and the "at least N" over-long prompt text.
configs:
  - {id: enable-prompt-tokens-details, type: boolean, value: false, default: false, summary: "--enable-prompt-tokens-details: usage carries prompt_tokens_details (cached_tokens, multimodal_tokens)", sources: ["vllm/entrypoints/launchers/cli_args.py:148", "vllm/entrypoints/openai/chat_completion/serving.py:97-98"], attributes: {key: enable_prompt_tokens_details}}
  - {id: vllm-max-num-bad-words, type: integer, value: 128, default: 128, summary: "VLLM_MAX_NUM_BAD_WORDS (boundary copy): the most tokenized bad words SamplingParams.update_from_tokenizer accepts", sources: ["vllm/envs.py:1161-1162", "vllm/sampling_params.py:806"], attributes: {key: VLLM_MAX_NUM_BAD_WORDS, env: true, boundary: true, owner: worker-runner}}
  - {id: fingerprint-mode, type: string, value: full, default: full, summary: "--fingerprint-mode: full (vllm-<version>[-tpN][-ppN][-dpN][-ep]-<hash8>), hash (no parallelism), custom (--fingerprint-value) or none (no system_fingerprint)", sources: ["vllm/entrypoints/launchers/cli_args.py:214-223", "vllm/entrypoints/generate/api_router.py:89-96"], attributes: {key: fingerprint_mode}}
  - {id: fingerprint-value, type: string, value: null, default: null, summary: "--fingerprint-value: the literal system_fingerprint under --fingerprint-mode custom", sources: ["vllm/entrypoints/launchers/cli_args.py:224-225"], attributes: {key: fingerprint_value}}
  - {id: data-parallel-size, type: integer, value: 1, default: 1, summary: "data_parallel_size (boundary copy): a DP degree above 1 adds -dpN to the system fingerprint", sources: ["vllm/config/parallel.py:146", "vllm/entrypoints/serve/utils/fingerprint.py:78-80"], attributes: {key: data_parallel_size, boundary: true, owner: engine-core}}
  - {id: pipeline-parallel-size, type: integer, value: 1, default: 1, summary: "pipeline_parallel_size (boundary copy): a PP degree above 1 adds -ppN to the system fingerprint", sources: ["vllm/config/parallel.py:139", "vllm/entrypoints/serve/utils/fingerprint.py:75-77"], attributes: {key: pipeline_parallel_size, boundary: true, owner: distributed}}
  - {id: enable-expert-parallel, type: boolean, value: false, default: false, summary: "--enable-expert-parallel (boundary copy): adds -ep to the system fingerprint", sources: ["vllm/config/parallel.py:182-205", "vllm/entrypoints/serve/utils/fingerprint.py:81-82"], attributes: {key: enable_expert_parallel, boundary: true, owner: config-platform}}
components:
  - id: system-fingerprint
    name: vllm.entrypoints.serve.utils.fingerprint
    kind: module
    parent: api-server
    layer: api
    summary: "The system_fingerprint the generate handlers stamp on responses, built once per serving class from the configured --fingerprint-mode."
    sources: ["vllm/entrypoints/serve/utils/fingerprint.py:28-84"]
  - id: hermes2-pro-tool-parser
    name: Hermes2ProToolParser
    kind: module
    parent: api-server
    layer: parsers
    summary: "--tool-call-parser hermes (and qwen3_json): JSON tool calls inside <tool_call>...</tool_call> (an unterminated last one runs to the end); adjust_request also turns skip_special_tokens off so the tags survive detokenization."
    sources: ["vllm/tool_parsers/hermes_tool_parser.py:34-120"]
  - id: serving-generative-scoring
    name: ServingGenerativeScoring
    kind: module
    parent: base-serving
    layer: api
    summary: "POST /generative_scoring on a generate model: the probability that each label token comes next after query+item, read from one max_tokens=1 request per item with logprob_token_ids."
    sources: ["vllm/entrypoints/generate/generative_scoring/serving.py:159-458", "vllm/entrypoints/generate/generative_scoring/api_router.py:30-57"]
  - id: label-reads
    name: vllm.entrypoints.generate.label_reads
    kind: module
    parent: api-server
    layer: api
    summary: "next_token_label_reads: one-token reads, merged, each returning the full-vocabulary logprob of every label token."
    sources: ["vllm/entrypoints/generate/label_reads.py:14-76"]
  - id: pooling-factories
    name: vllm.entrypoints.pooling.factories
    kind: module
    parent: api-server
    layer: api
    summary: "Which pooling routes, handlers and IO processors exist: everything keys off model_config.get_pooling_task(supported_tasks) and enable_scoring_api; get_pooling_invocation_types lists the pooling request types /invocations tries."
    sources: ["vllm/entrypoints/pooling/factories.py:37-272", "vllm/entrypoints/pooling/utils.py:232-250"]
  - id: scoring-io-processor
    name: ScoringIOProcessor
    kind: module
    parent: serving-scores
    layer: api
    summary: "The scoring IO processors (bi-encoder, cross-encoder, late-interaction): validate the (data_1, data_2) shapes, check and apply max_tokens_per_query / max_tokens_per_doc, and build one engine input per prompt (bi-encoder) or per pair (cross-encoder)."
    sources: ["vllm/entrypoints/pooling/scoring/io_processor.py:95-752", "vllm/entrypoints/pooling/scoring/utils.py:42-141"]

interfaces:
  - component: system-fingerprint
    name: build-system-fingerprint
    kind: function
    latency_ms: 0
    summary: "build_system_fingerprint: none gives None; custom the --fingerprint-value; otherwise vllm-<version>, then (full mode) -tpN, -ppN, -dpN for degrees above 1 and -ep with expert parallelism, then the first 8 hex digits of vllm_config.compute_hash()."
    sources: ["vllm/entrypoints/serve/utils/fingerprint.py:49-84", "vllm/entrypoints/generate/base/serving.py:157-167"]
    request: {type: object, properties: {}}
    behavior:
      - if: "config['fingerprint-mode'] == 'none'"
        then: [{source: "vllm/entrypoints/serve/utils/fingerprint.py:53-54", return: {system_fingerprint: null}}]
      - if: "config['fingerprint-mode'] == 'custom'"
        then: [{source: "vllm/entrypoints/serve/utils/fingerprint.py:55-56", return: {system_fingerprint: "= config['fingerprint-value']"}}]
      - title: "hash8 = vllm_config.compute_hash()[:8] (ASSUMPTION: a sha256 over the model, dtype-independent parallel shape and max_model_len stands in for the full config hash)"
        source: "vllm/entrypoints/serve/utils/fingerprint.py:60-63"
        set:
          vars.hash8: "= sha256(json(['0.32.0', config['model'], config['max-model-len'], config['tensor-parallel-size'], config['pipeline-parallel-size'], config['data-parallel-size'], config['enable-expert-parallel']])).substring(0, 8)"
      - if: "config['fingerprint-mode'] == 'hash'"
        then: [{source: "vllm/entrypoints/serve/utils/fingerprint.py:65-66", return: {system_fingerprint: "= 'vllm-0.32.0-' + vars.hash8"}}]
      - title: "full: the non-trivial parallelism degrees between the version and the hash"
        source: "vllm/entrypoints/serve/utils/fingerprint.py:69-84"
        return:
          system_fingerprint: "= (['vllm-0.32.0'] + (config['tensor-parallel-size'] > 1 ? ['tp' + string(config['tensor-parallel-size'])] : []) + (config['pipeline-parallel-size'] > 1 ? ['pp' + string(config['pipeline-parallel-size'])] : []) + (config['data-parallel-size'] > 1 ? ['dp' + string(config['data-parallel-size'])] : []) + (config['enable-expert-parallel'] ? ['ep'] : []) + [vars.hash8]).join('-')"
  - component: hermes2-pro-tool-parser
    name: adjust-request
    kind: function
    summary: "Hermes2ProToolParser.adjust_request: ToolParser.adjust_request (a required or named tool choice forces a JSON schema), then, with tools and a tool_choice other than none, skip_special_tokens = False."
    sources: ["vllm/tool_parsers/hermes_tool_parser.py:58-67"]
    request: {type: object, properties: {body: {type: object}}, required: [body]}
    errors: [{code: value-error, status: 0}]
    behavior:
      - title: "super().adjust_request(request)"
        source: "vllm/tool_parsers/hermes_tool_parser.py:61"
        call: llama3-json-tool-parser.adjust-request
        input: {body: "= input.body"}
        as: base
      - if: "has(vars.base.value.tools) && vars.base.value.tools != null && size(vars.base.value.tools) > 0 && (!has(vars.base.value.tool_choice) || vars.base.value.tool_choice != 'none')"
        then: [{title: "The <tool_call> tags are special tokens in some checkpoints, so they must not be skipped", source: "vllm/tool_parsers/hermes_tool_parser.py:62-66", return: "= merge(vars.base.value, {'skip_special_tokens': false})"}]
      - return: "= vars.base.value"
  - component: hermes2-pro-tool-parser
    name: extract-tool-calls
    kind: function
    summary: "Hermes2ProToolParser.extract_tool_calls: no <tool_call> means plain content; otherwise every <tool_call>{json}</tool_call> (or a trailing unterminated one) becomes a function call with JSON-encoded arguments and the text before the first tag is the content; any decode error returns the whole output as content."
    sources: ["vllm/tool_parsers/hermes_tool_parser.py:69-119"]
    request: {type: object, properties: {model_output: {type: string, examples: ["<tool_call>{\"name\": \"get_weather\", \"arguments\": {\"city\": \"Paris\"}}</tool_call>"]}}, required: [model_output]}
    behavior:
      - if: "!input.model_output.contains('<tool_call>')"
        then: [{title: "Sanity check: no start token", source: "vllm/tool_parsers/hermes_tool_parser.py:74-78", return: {tools_called: false, tool_calls: [], content: "= input.model_output"}}]
      - title: "tool_call_regex.findall: each <tool_call>(.*?)</tool_call>, or a last <tool_call> running to the end of the output"
        source: "vllm/tool_parsers/hermes_tool_parser.py:38-40"
        set:
          vars.parts: "= input.model_output.split('<tool_call>').slice(1, size(input.model_output.split('<tool_call>'))).map(p, p.contains('</tool_call>') ? p.split('</tool_call>')[0] : p).map(p, p.trim())"
      - title: "json.loads every match; a match that is not a JSON object with name and arguments is an exception: log it and return the whole output as content"
        source: "vllm/tool_parsers/hermes_tool_parser.py:84-118"
        if: "!vars.parts.all(p, p.matches('(?s)^\\\\{.*\\\\}$'))"
        then: [{return: {tools_called: false, tool_calls: [], content: "= input.model_output"}}]
      - set:
          vars.calls: "= vars.parts.map(p, eval(p, {}))"
      - if: "!vars.calls.all(c, type(c) == map && 'name' in c && 'arguments' in c)"
        then: [{source: "vllm/tool_parsers/hermes_tool_parser.py:114-118", return: {tools_called: false, tool_calls: [], content: "= input.model_output"}}]
      - title: "ToolCall(type function, FunctionCall(name, arguments=json.dumps(arguments))); content is the text before the first tag, or None"
        source: "vllm/tool_parsers/hermes_tool_parser.py:95-113"
        return:
          tools_called: true
          tool_calls: "= vars.calls.map(c, {'type': 'function', 'function': {'name': c['name'], 'arguments': json(c['arguments'])}})"
          content: "= input.model_output.substring(0, input.model_output.indexOf('<tool_call>')) == '' ? dyn(null) : dyn(input.model_output.substring(0, input.model_output.indexOf('<tool_call>')))"
  - component: serve-subcommand
    name: run-multi-api-server
    kind: function
    summary: "run_multi_api_server: a multiprocess Prometheus directory when there is more than one API server; bind the listening socket once (SO_REUSEPORT when several servers share it); build the VllmConfig with _api_process_count; refuse runtime LoRA updating across processes; launch the engine cores, then one ApiServer_<i> process per API server on the shared socket, each a client of every engine."
    sources: ["vllm/entrypoints/cli/serve.py:269-382"]
    request: {type: object, properties: {api_server_count: {type: integer, examples: [4]}, host: {type: string, default: 0.0.0.0}, port: {type: integer, default: 8000}}, required: [api_server_count]}
    errors: [{code: value-error, status: 0, retryable: false}, {code: key-error, status: 0, retryable: false}]
    behavior:
      - title: "setup_multiprocess_prometheus: PROMETHEUS_MULTIPROC_DIR, so /metrics in any API server aggregates every process's samples"
        source: "vllm/entrypoints/cli/serve.py:282-283"
        set:
          vars.mp_prometheus: "= input.api_server_count > 1"
      - title: "setup_server(args, reuse_port=num_api_servers > 1): validate the parsers and bind the socket the API servers will share"
        source: "vllm/entrypoints/cli/serve.py:297"
        call: launcher.setup-server
        input: {host: "= input.host", port: "= input.port"}
        as: addr
      - title: "engine_args.create_engine_config with _api_process_count = N, _api_process_rank = -1"
        source: "vllm/entrypoints/cli/serve.py:306-312"
        call: engine-args.create-engine-config
        input: {model: "= config['model']"}
        fill: true
        as: vc
      - title: "Runtime LoRA loading can't be kept consistent across API processes"
        source: "vllm/entrypoints/cli/serve.py:314-317"
        if: "input.api_server_count > 1 && config['vllm-allow-runtime-lora-updating']"
        then: [{fail: {code: value-error, message: "VLLM_ALLOW_RUNTIME_LORA_UPDATING cannot be used with api_server_count > 1"}}]
      - title: "bind_engine_zmq_listeners(vllm_config, N), then launch_core_engines: one EngineCore process per local DP rank (plus the DP coordinator above DP 1), started before the API servers"
        source: "vllm/entrypoints/cli/serve.py:329-336"
        call: core-engine-proc-manager.launch-core-engines
        input: {api_server_count: "= input.api_server_count"}
        as: engines
      - title: "APIServerProcessManager: spawn ApiServer_0..ApiServer_<N-1> on the shared socket, each with the engines' input and output addresses; they are watched during engine startup, so one that dies aborts it"
        source: "vllm/entrypoints/cli/serve.py:358-372"
        set:
          vars.procs: "= lists.range(input.api_server_count).map(i, 'ApiServer_' + string(i))"
      - title: "wait_for_completion_or_failure: block until a process exits or a signal arrives"
        source: "vllm/entrypoints/cli/serve.py:378-382"
        return: {listen_address: "= vars.addr.value.listen_address", reuse_port: "= input.api_server_count > 1", multiprocess_prometheus: "= vars.mp_prometheus", api_server_processes: "= vars.procs", engines: "= has(vars.engines.value.engines) ? vars.engines.value.engines : null"}
  - component: sampling-params
    name: update-from-tokenizer
    kind: function
    summary: "SamplingParams.update_from_tokenizer (the engine's InputProcessor calls it): each bad word is encoded without special tokens, bare and with a leading space; the bare form must give a token, the spaced form counts only when it starts with a different token of the same length; past VLLM_MAX_NUM_BAD_WORDS, or with an id outside the vocabulary, it is a VLLMValidationError naming bad_words."
    sources: ["vllm/sampling_params.py:802-861"]
    request: {type: object, properties: {bad_words: {type: [array, "null"], items: {type: string}, default: null}, max_token_id: {type: integer, default: 128255}}}
    response: {type: object, properties: {bad_words_token_ids: {type: array, items: {type: array, items: {type: integer}}}}}
    errors: [{code: vllm-validation-error, status: 0, retryable: false}]
    behavior:
      - if: "!has(input.bad_words) || input.bad_words == null || size(input.bad_words) == 0"
        then: [{source: "vllm/sampling_params.py:803-804", return: {bad_words_token_ids: []}}]
      - title: "tokenizer.encode(prefix + bad_word.lstrip(), add_special_tokens=False) (ASSUMPTION: the word-per-token stand-in, so the spaced form encodes like the bare one and adds no entry)"
        source: "vllm/sampling_params.py:807-816"
        set:
          vars.ids: "= input.bad_words.map(w, w.trim() == '' ? [] : w.trim().split(' ').filter(x, x != '').map(x, x in {'Hello': 9906, 'world': 1917, 'The': 791, 'capital': 6864, 'of': 315, 'France': 9822, 'is': 374} ? {'Hello': 9906, 'world': 1917, 'The': 791, 'capital': 6864, 'of': 315, 'France': 9822, 'is': 374}[x] : 1000 + size(x)))"
      - if: "vars.ids.exists(t, size(t) == 0)"
        then: [{title: "The bare form must tokenize to something", source: "vllm/sampling_params.py:818-825", fail: {code: vllm-validation-error, message: bad_words entries must tokenize to at least one token., data: {param: bad_words, value: "= input.bad_words"}}}]
      - if: "size(vars.ids) > config['vllm-max-num-bad-words']"
        then: [{source: "vllm/sampling_params.py:836-845", fail: {code: vllm-validation-error, message: "= 'Too many bad words after tokenization: ' + string(config['vllm-max-num-bad-words'] + 1) + '. The max number is ' + string(config['vllm-max-num-bad-words']) + '.'", data: {param: bad_words, value: "= input.bad_words"}}}]
      - set:
          vars.bad: "= vars.ids.map(t, t.filter(i, i < 0 || i > input.max_token_id)).filter(l, size(l) > 0).map(l, l[0])"
      - if: "size(vars.bad) > 0"
        then: [{source: "vllm/sampling_params.py:847-861", fail: {code: vllm-validation-error, message: "= 'The model vocabulary size is ' + string(input.max_token_id + 1) + ', but the following tokens were specified as bad: [' + vars.bad.map(i, string(i)).join(', ') + ']. All token id values should be integers satisfying: 0 <= token_id <= ' + string(input.max_token_id) + '.'", data: {param: bad_words, value: "= input.bad_words"}}}]
      - return: {bad_words_token_ids: "= vars.ids"}
  - component: serving-generative-scoring
    name: create-generative-scoring
    kind: function
    summary: "create_generative_scoring: _check_model, the engine-alive and admission preflight for len(items), every label id inside [0, vocab_size), at least one label and one item, the LoRA adapter, then one prompt per item (query + item, or item + query, cut to max_model_len - 1), next_token_label_reads with max_tokens=1 and logprob_token_ids, and per item the first label's probability (softmax over the labels, or exp of the full-vocabulary logprob). Validation failures are ErrorResponses (400 BadRequestError)."
    sources: ["vllm/entrypoints/generate/generative_scoring/serving.py:185-325"]
    request:
      type: object
      properties:
        body:
          type: object
          properties:
            model: {type: [string, "null"], examples: [llama-8b]}
            query: {type: [string, array], examples: ["Is Paris the capital of France? Answer:"]}
            items: {type: array, items: {type: [string, array]}, examples: [[" Yes", " No"]]}
            label_token_ids: {type: array, items: {type: integer}, examples: [[9642, 2822]]}
            apply_softmax: {type: boolean, default: true}
            item_first: {type: boolean, default: false}
            add_special_tokens: {type: boolean, default: true}
            priority: {type: [integer, "null"], default: null}
            request_id: {type: [string, "null"], default: null}
        x_request_id: {type: [string, "null"]}
      required: [body]
    errors: [{code: BadRequestError, status: 400}, {code: NotFoundError, status: 404}, {code: engine-dead-error, status: 500}]
    behavior:
      - call: base-serving.check-model
        input: {model: "= has(input.body.model) && input.body.model != null ? input.body.model : ''"}
        as: model
      - title: "engine_client.errored raises the dead error; check_admission(len(items))"
        source: "vllm/entrypoints/generate/generative_scoring/serving.py:206-209"
        call: async-llm.check-admission
        input: {n: "= size(input.body.items)"}
      - title: "model_config.get_vocab_size(): the served checkpoint's vocab_size"
        source: "vllm/entrypoints/generate/generative_scoring/serving.py:218-219"
        call: hf-hub.download-config
        input: {model: "= config['model']"}
        as: hfc
        on_error: continue
      - set:
          vars.vocab: "= vars.hfc.ok && has(vars.hfc.value.vocab_size) ? vars.hfc.value.vocab_size : 128256"
          vars.bad: "= input.body.label_token_ids.filter(t, t < 0 || t >= (vars.hfc.ok && has(vars.hfc.value.vocab_size) ? vars.hfc.value.vocab_size : 128256))"
      - if: "size(vars.bad) > 0"
        then: [{title: "The first label id outside the vocabulary", source: "vllm/entrypoints/generate/generative_scoring/serving.py:219-224", fail: {code: BadRequestError, status: 400, message: "= 'label_token_id ' + string(vars.bad[0]) + ' is out of vocabulary range [0, ' + string(vars.vocab) + '). Please provide valid token IDs.'"}}]
      - if: "size(input.body.label_token_ids) == 0"
        then: [{source: "vllm/entrypoints/generate/generative_scoring/serving.py:226-229", fail: {code: BadRequestError, status: 400, message: label_token_ids must contain at least one token ID.}}]
      - if: "size(input.body.items) == 0"
        then: [{source: "vllm/entrypoints/generate/generative_scoring/serving.py:231-233", fail: {code: BadRequestError, status: 400, message: items must contain at least one item.}}]
      - call: base-serving.maybe-get-adapters
        input: {model: "= has(input.body.model) && input.body.model != null ? input.body.model : ''"}
        as: lora
      - set:
          vars.rid: "= 'generative-scoring-' + (has(input.x_request_id) && input.x_request_id != null ? input.x_request_id : (has(input.body.request_id) && input.body.request_id != null ? input.body.request_id : id('random-uuid', seq('random-uuid'))))"
      - call: serving-generative-scoring.build-prompts
        input: {query: "= input.body.query", items: "= input.body.items", item_first: "= has(input.body.item_first) && input.body.item_first", add_special_tokens: "= !has(input.body.add_special_tokens) || input.body.add_special_tokens"}
        as: prompts
      - title: "SamplingParams(max_tokens=1, logprobs=len(labels), logprob_token_ids=labels): the labels' logprobs come from the raw logits"
        source: "vllm/entrypoints/generate/generative_scoring/serving.py:250-262"
        call: label-reads.next-token-label-reads
        input: {request_id: "= vars.rid", prompts: "= vars.prompts.value.prompts", label_token_ids: "= input.body.label_token_ids", priority: "= has(input.body.priority) && input.body.priority != null ? input.body.priority : 0"}
        as: reads
        on_error:
          - title: "A ValueError out of the reads is an ErrorResponse (400)"
            source: "vllm/entrypoints/generate/generative_scoring/serving.py:288-293"
            fail: {code: BadRequestError, status: 400, message: "= error.message"}
      - title: "_compute_probabilities: softmax over just the labels (shifted by the max logprob), or exp(logprob); the first label's probability is the item's score (ASSUMPTION: exp(x) as (1 + x/1024)^1024, CEL has no exp)"
        source: "vllm/entrypoints/generate/generative_scoring/serving.py:296-318"
        set:
          vars.softmax: "= !has(input.body.apply_softmax) || input.body.apply_softmax"
          vars.e: "= vars.reads.value.reads.map(r, r.logprobs.map(x, 1.0 + (x - (!has(input.body.apply_softmax) || input.body.apply_softmax ? math.greatest(r.logprobs) : 0.0)) / 1024.0))"
      - foreach: "= lists.range(10)"
        as: k
        steps:
          - set: {vars.e: "= vars.e.map(l, l.map(y, y * y))"}
      - set:
          vars.scores: "= vars.e.map(l, vars.softmax ? l[0] / sum(l) : l[0])"
      - source: "vllm/entrypoints/generate/generative_scoring/serving.py:320-341"
        return:
          id: "= vars.rid"
          object: list
          created: "= now / 1000"
          model: "= vars.model.value.model_name"
          data: "= lists.range(size(vars.scores)).map(i, {'index': i, 'object': 'score', 'score': vars.scores[i]})"
          usage: {prompt_tokens: "= sum(vars.prompts.value.counts)", completion_tokens: "= size(vars.scores)", total_tokens: "= sum(vars.prompts.value.counts) + size(vars.scores)"}
  - component: serving-generative-scoring
    name: build-prompts
    kind: function
    summary: "_build_prompts: the query encoded once (with special tokens when asked), each item without them; item_first puts the item first; each prompt is cut to max_model_len - 1 to leave room for the one output token."
    sources: ["vllm/entrypoints/generate/generative_scoring/serving.py:343-405"]
    request: {type: object, properties: {query: {type: [string, array]}, items: {type: array}, item_first: {type: boolean, default: false}, add_special_tokens: {type: boolean, default: true}}, required: [query, items]}
    behavior:
      - if: "type(input.query) == string"
        then:
          - call: base-renderer.tokenize-prompt
            input: {prompt: "= input.query", max_total_tokens: null, add_special_tokens: "= input.add_special_tokens"}
            as: q
          - set: {vars.q: "= vars.q.value.prompt_token_ids"}
        else:
          - set: {vars.q: "= input.query"}
      - set:
          vars.prompts: []
          vars.max_prompt: "= config['max-model-len'] - 1"
      - foreach: "= input.items"
        as: item
        max: 64
        steps:
          - if: "type(vars.item) == string"
            then:
              - call: base-renderer.tokenize-prompt
                input: {prompt: "= vars.item", max_total_tokens: null, add_special_tokens: false}
                as: it
              - set: {vars.ids: "= vars.it.value.prompt_token_ids"}
            else:
              - set: {vars.ids: "= vars.item"}
          - set:
              vars.p: "= input.item_first ? vars.ids + vars.q : vars.q + vars.ids"
          - title: "Truncate to max_model_len - 1"
            source: "vllm/entrypoints/generate/generative_scoring/serving.py:394-397"
            set: {vars.prompts: "= vars.prompts + [size(vars.p) > vars.max_prompt ? vars.p.slice(0, vars.max_prompt) : vars.p]"}
      - return: {prompts: "= vars.prompts", counts: "= vars.prompts.map(p, size(p))"}
  - component: label-reads
    name: next-token-label-reads
    kind: function
    summary: "next_token_label_reads: one generate per prompt (<id>-<i>), merged; each read needs an output, a non-error finish, logprobs, and every label token among the first position's logprobs (ValueError naming the item otherwise)."
    sources: ["vllm/entrypoints/generate/label_reads.py:23-76"]
    request: {type: object, properties: {request_id: {type: string}, prompts: {type: array, items: {type: array, items: {type: integer}}}, label_token_ids: {type: array, items: {type: integer}}, priority: {type: integer, default: 0}}, required: [request_id, prompts, label_token_ids]}
    errors: [{code: value-error, status: 0}]
    behavior:
      - title: "engine_client.generate per prompt, merged with merge_async_iterators"
        source: "vllm/entrypoints/generate/label_reads.py:35-49"
        parallel: "= lists.range(size(input.prompts))"
        as: i
        steps:
          - call: async-llm.generate
            input: {request_id: "= input.request_id + '-' + string(vars.i)", prompt_token_ids: "= input.prompts[vars.i]", sampling_params: {max_tokens: 1, n: 1, logprobs: "= size(input.label_token_ids)"}, priority: "= input.priority"}
            as: g
          - return: "= vars.g.value"
        join: {need: all}
        as_result: outs
        on_insufficient: {code: value-error}
      - set:
          vars.res: "= vars.outs.results.sortBy(r, r.index).map(r, r.value)"
      - title: "finish_reason error: Generation error for item i"
        source: "vllm/entrypoints/generate/label_reads.py:60-61"
        if: "vars.res.exists(r, has(r.finish_reason) && r.finish_reason == 'error')"
        then: [{fail: {code: value-error, message: "= 'Generation error for item ' + string(lists.range(size(vars.res)).filter(i, has(vars.res[i].finish_reason) && vars.res[i].finish_reason == 'error')[0])"}}]
      - title: "No logprobs on the output (ASSUMPTION: the engine's RequestOutput carries them as logprobs[0], a map from token id to logprob)"
        source: "vllm/entrypoints/generate/label_reads.py:62-66"
        if: "vars.res.exists(r, !has(r.logprobs) || r.logprobs == null || size(r.logprobs) == 0)"
        then: [{fail: {code: value-error, message: "= 'No logprobs available for item ' + string(lists.range(size(vars.res)).filter(i, !has(vars.res[i].logprobs) || vars.res[i].logprobs == null || size(vars.res[i].logprobs) == 0)[0]) + '. This might indicate an issue with logprobs configuration.'"}}]
      - if: "vars.res.exists(r, input.label_token_ids.exists(t, !(string(t) in r.logprobs[0])))"
        then: [{source: "vllm/entrypoints/generate/label_reads.py:67-74", fail: {code: value-error, message: "= 'Token IDs ' + string(input.label_token_ids.filter(t, !(string(t) in vars.res.filter(r, input.label_token_ids.exists(x, !(string(x) in r.logprobs[0])))[0].logprobs[0]))) + ' not found in logprobs for item ' + string(lists.range(size(vars.res)).filter(i, input.label_token_ids.exists(t, !(string(t) in vars.res[i].logprobs[0])))[0]) + '. This might indicate the tokens are outside the model\\'s vocabulary.'"}}]
      - source: "vllm/entrypoints/generate/label_reads.py:75-76"
        return: {reads: "= vars.res.map(r, {'logprobs': input.label_token_ids.map(t, double(type(r.logprobs[0][string(t)]) == map ? r.logprobs[0][string(t)].logprob : r.logprobs[0][string(t)]))})"}
  - component: openai-serving-chat
    name: create-chat-logprobs
    kind: function
    latency_ms: 0
    summary: "_create_chat_logprobs: per sampled token, its decoded text, max(logprob, -9999.0) and UTF-8 bytes, and the first top_logprobs entries of the position's logprob dict (the sampled token first, then the top-k by rank, a repeated id kept once); a position without the sampled token's logprob gives only the token and its bytes."
    sources: ["vllm/entrypoints/openai/chat_completion/serving.py:1242-1333"]
    request: {type: object, properties: {token_ids: {type: array, items: {type: integer}}, logprobs: {type: [array, "null"], description: "per position the engine's entries {token_id, logprob, rank}, the sampled token first"}, top_logprobs: {type: [integer, "null"], default: 0}}, required: [token_ids]}
    behavior:
      - title: "One dict per position: dict(zip(token_ids, Logprob(logprob, rank, decoded_token))) keeps the first position of a repeated id (ASSUMPTION: the stand-in detokenizer decodes id N as ' tN', the Llama-3 special tokens by name; bytes over printable ASCII)"
        source: "vllm/entrypoints/openai/chat_completion/serving.py:1286-1288"
        set:
          vars.steps: "= lists.range(size(input.token_ids)).map(i, input.logprobs != null && i < size(input.logprobs) && input.logprobs[i] != null ? lists.range(size(input.logprobs[i])).filter(j, !lists.range(j).exists(k, input.logprobs[i][k].token_id == input.logprobs[i][j].token_id)).map(j, input.logprobs[i][j]) : [])"
          vars.n: "= has(input.top_logprobs) && input.top_logprobs != null ? input.top_logprobs : 0"
      - title: "ChatCompletionLogProbsContent per token; top_logprobs from _get_top_logprobs (i < top_logprobs, or all for -1)"
        source: "vllm/entrypoints/openai/chat_completion/serving.py:1299-1331"
        return:
          content: "= lists.range(size(input.token_ids)).map(i, !vars.steps[i].exists(e, e.token_id == input.token_ids[i]) ? {'token': (input.token_ids[i] == 128009 ? '<|eot_id|>' : (input.token_ids[i] == 128001 ? '<|end_of_text|>' : (input.token_ids[i] == 128000 ? '<|begin_of_text|>' : ' t' + string(input.token_ids[i])))), 'logprob': -9999.0, 'bytes': lists.range(size((input.token_ids[i] == 128009 ? '<|eot_id|>' : (input.token_ids[i] == 128001 ? '<|end_of_text|>' : (input.token_ids[i] == 128000 ? '<|begin_of_text|>' : ' t' + string(input.token_ids[i])))))).map(c, ' !\"#$%&\\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\\]^_`abcdefghijklmnopqrstuvwxyz{|}~'.indexOf((input.token_ids[i] == 128009 ? '<|eot_id|>' : (input.token_ids[i] == 128001 ? '<|end_of_text|>' : (input.token_ids[i] == 128000 ? '<|begin_of_text|>' : ' t' + string(input.token_ids[i])))).substring(c, c + 1)) + 32), 'top_logprobs': []} : {'token': (input.token_ids[i] == 128009 ? '<|eot_id|>' : (input.token_ids[i] == 128001 ? '<|end_of_text|>' : (input.token_ids[i] == 128000 ? '<|begin_of_text|>' : ' t' + string(input.token_ids[i])))), 'logprob': math.greatest([double(vars.steps[i].filter(e, e.token_id == input.token_ids[i])[0].logprob), -9999.0]), 'bytes': lists.range(size((input.token_ids[i] == 128009 ? '<|eot_id|>' : (input.token_ids[i] == 128001 ? '<|end_of_text|>' : (input.token_ids[i] == 128000 ? '<|begin_of_text|>' : ' t' + string(input.token_ids[i])))))).map(c, ' !\"#$%&\\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\\]^_`abcdefghijklmnopqrstuvwxyz{|}~'.indexOf((input.token_ids[i] == 128009 ? '<|eot_id|>' : (input.token_ids[i] == 128001 ? '<|end_of_text|>' : (input.token_ids[i] == 128000 ? '<|begin_of_text|>' : ' t' + string(input.token_ids[i])))).substring(c, c + 1)) + 32), 'top_logprobs': lists.range(size(vars.steps[i])).filter(j, vars.n == -1 || j < vars.n).map(j, {'token': (vars.steps[i][j].token_id == 128009 ? '<|eot_id|>' : (vars.steps[i][j].token_id == 128001 ? '<|end_of_text|>' : (vars.steps[i][j].token_id == 128000 ? '<|begin_of_text|>' : ' t' + string(vars.steps[i][j].token_id)))), 'logprob': math.greatest([double(vars.steps[i][j].logprob), -9999.0]), 'bytes': lists.range(size((vars.steps[i][j].token_id == 128009 ? '<|eot_id|>' : (vars.steps[i][j].token_id == 128001 ? '<|end_of_text|>' : (vars.steps[i][j].token_id == 128000 ? '<|begin_of_text|>' : ' t' + string(vars.steps[i][j].token_id)))))).map(c, ' !\"#$%&\\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\\\]^_`abcdefghijklmnopqrstuvwxyz{|}~'.indexOf((vars.steps[i][j].token_id == 128009 ? '<|eot_id|>' : (vars.steps[i][j].token_id == 128001 ? '<|end_of_text|>' : (vars.steps[i][j].token_id == 128000 ? '<|begin_of_text|>' : ' t' + string(vars.steps[i][j].token_id)))).substring(c, c + 1)) + 32)})})"
  - component: openai-serving-completion
    name: create-completion-logprobs
    kind: function
    latency_ms: 0
    summary: "_create_completion_logprobs: tokens, token_logprobs (max(logprob, -9999.0)), top_logprobs (a dict of the position's first logprobs + 1 entries, the sampled token first; OpenAI's 'top N + 1') and text_offset (each token's start, from the initial offset)."
    sources: ["vllm/entrypoints/openai/completion/serving.py:654-742"]
    request: {type: object, properties: {token_ids: {type: array, items: {type: integer}}, logprobs: {type: [array, "null"]}, num_logprobs: {type: integer, default: 0}, initial_text_offset: {type: integer, default: 0}}, required: [token_ids]}
    behavior:
      - source: "vllm/entrypoints/openai/completion/serving.py:677-698"
        set:
          vars.steps: "= lists.range(size(input.token_ids)).map(i, input.logprobs != null && i < size(input.logprobs) && input.logprobs[i] != null ? dyn(lists.range(size(input.logprobs[i])).filter(j, !lists.range(j).exists(k, input.logprobs[i][k].token_id == input.logprobs[i][j].token_id)).map(j, input.logprobs[i][j])) : dyn(null))"
          vars.toks: "= input.token_ids.map(t, (t == 128009 ? '<|eot_id|>' : (t == 128001 ? '<|end_of_text|>' : (t == 128000 ? '<|begin_of_text|>' : ' t' + string(t)))))"
          vars.n: "= has(input.num_logprobs) && input.num_logprobs != null ? input.num_logprobs : 0"
          vars.off0: "= has(input.initial_text_offset) && input.initial_text_offset != null ? input.initial_text_offset : 0"
      - title: "text_offset: the initial offset, then each previous token's length added"
        source: "vllm/entrypoints/openai/completion/serving.py:731-735"
        return:
          tokens: "= vars.toks"
          token_logprobs: "= lists.range(size(input.token_ids)).map(i, vars.steps[i] == null ? dyn(null) : dyn(math.greatest([double(vars.steps[i].filter(e, e.token_id == input.token_ids[i])[0].logprob), -9999.0])))"
          top_logprobs: "= lists.range(size(input.token_ids)).map(i, vars.steps[i] == null ? dyn(null) : dyn(lists.range(size(vars.steps[i])).filter(j, vars.n == -1 || vars.n >= j).map(j, vars.steps[i][j]).transformMapEntry(k, e, {(e.token_id == 128009 ? '<|eot_id|>' : (e.token_id == 128001 ? '<|end_of_text|>' : (e.token_id == 128000 ? '<|begin_of_text|>' : ' t' + string(e.token_id)))): math.greatest([double(e.logprob), -9999.0])})))"
          text_offset: "= lists.range(size(vars.toks)).map(i, vars.off0 + sum(lists.range(i).map(k, size(vars.toks[k]))))"
  # ------------------------------------------------------------------ pooling task resolution
  - component: pooling-factories
    name: get-pooling-task
    kind: function
    summary: "model_config.get_pooling_task(supported_tasks), as the pooling factories call it: --pooler-config's task when set (it must be supported), else the first supported of embed&token_classify, embed, classify, token_embed, token_classify, plugin; a generate-only model has none. enable_scoring_api: embed and token_embed models always; classify models only with num_labels == 1."
    sources: ["vllm/entrypoints/pooling/factories.py:118-140", "vllm/entrypoints/pooling/utils.py:232-250"]
    request: {type: object, properties: {pooler_task: {type: [string, "null"], default: null, description: "PoolerConfig.task (--pooler-config '{\"task\": ...}'); unset in every world"}, supported_tasks: {type: [array, "null"], items: {type: string}, default: null, description: "the offline LLM passes its own supported_tasks; the server reads app.state's"}}}
    errors: [{code: runtime-error, status: 0, retryable: false}]
    behavior:
      - if: "has(input.supported_tasks) && input.supported_tasks != null"
        then:
          - set: {vars.t: "= input.supported_tasks"}
        else:
          - call: app-state.supported-tasks
            as: tasks
          - set: {vars.t: "= vars.tasks.value"}
      - title: "ModelConfig.get_pooling_task: an explicit pooler task must be one the model supports (RuntimeError at startup)"
        source: "vllm/entrypoints/pooling/factories.py:118"
        if: "has(input.pooler_task) && input.pooler_task != null && !(input.pooler_task in vars.t)"
        then: [{fail: {code: runtime-error, message: "= 'Unsupported task: \\'' + input.pooler_task + '\\' Supported tasks: (' + vars.t.map(x, '\\'' + x + '\\'').join(', ') + (size(vars.t) == 1 ? ',' : '') + ')'"}}]
      - title: "Otherwise the priority order embed&token_classify, embed, classify, token_embed, token_classify, plugin (ASSUMPTION: no *ForTokenClassification architecture, whose token_classify would win first)"
        source: "vllm/entrypoints/pooling/factories.py:163"
        set:
          vars.task: "= has(input.pooler_task) && input.pooler_task != null ? dyn(input.pooler_task) : ('embed&token_classify' in vars.t ? dyn('embed&token_classify') : ('embed' in vars.t ? dyn('embed') : ('classify' in vars.t ? dyn('classify') : ('token_embed' in vars.t ? dyn('token_embed') : ('token_classify' in vars.t ? dyn('token_classify') : ('plugin' in vars.t ? dyn('plugin') : null))))))"
      - if: "vars.task == 'classify'"
        then:
          - title: "enable_scoring_api for a classifier reads hf_config.num_labels (ASSUMPTION: 1 when the hub row has no num_labels, as for single-logit rerankers)"
            source: "vllm/entrypoints/pooling/utils.py:243-248"
            call: hf-hub.download-config
            input: {model: "= config['model']"}
            as: hf
            on_error: continue
      - set:
          vars.num_labels: "= vars.task == 'classify' && vars.hf.ok && has(vars.hf.value.num_labels) ? vars.hf.value.num_labels : 1"
      - source: "vllm/entrypoints/pooling/utils.py:239-250"
        return:
          supported_tasks: "= vars.t"
          pooling_task: "= vars.task"
          score_type: "= vars.task == 'embed' ? dyn('bi-encoder') : (vars.task == 'classify' ? dyn('cross-encoder') : (vars.task == 'token_embed' ? dyn('late-interaction') : null))"
          enable_scoring_api: "= vars.task in ['embed', 'token_embed'] || (vars.task == 'classify' && vars.num_labels == 1)"
  # ------------------------------------------------------------------ the shared pooling pipeline
  - component: pooling-base-serving
    name: serve
    kind: function
    summary: "PoolingBaseServing.__call__: _init_ctx (request id, _check_model, pooling params, _maybe_get_adapters, the truncate_prompt_tokens check), _preprocessing (prompt_to_seq, render every prompt with the request's TokenizeParams; the first error propagates), _prepare_generators (PoolingParams.verify, one AsyncLLM.encode per prompt, merged), _collect_batch (an output error is a GenerationError), then the endpoint's response: EmbeddingResponse, ClassificationResponse or PoolingResponse."
    sources: ["vllm/entrypoints/pooling/base/serving.py:67-257"]
    request:
      type: object
      properties:
        task: {type: string, examples: [embed], description: "the engine pooling task the IO processor uses"}
        kind: {type: [string, "null"], default: null, description: "the response type: embed (EmbeddingResponse), classify (ClassificationResponse) or pooling (PoolingResponse); defaults to the task"}
        prefix: {type: string, examples: [embd]}
        body:
          type: object
          properties:
            model: {type: [string, "null"], examples: [llama-8b]}
            input: {type: [string, array], items: {type: [string, integer, array]}, default: [hello world]}
            truncate_prompt_tokens: {type: [integer, "null"], default: null}
            truncation_side: {type: [string, "null"], default: null}
            use_activation: {type: [boolean, "null"], default: null}
            dimensions: {type: [integer, "null"], default: null}
            request_id: {type: [string, "null"], default: null}
        x_request_id: {type: [string, "null"]}
      required: [task, body]
    errors: [{code: value-error, status: 0}, {code: generation-error, status: 0}, {code: vllm-validation-error, status: 0}, {code: vllm-not-found-error, status: 0}]
    behavior:
      - set:
          vars.kind: "= has(input.kind) && input.kind != null ? input.kind : input.task"
          vars.model: "= has(input.body.model) && input.body.model != null ? input.body.model : ''"
      - title: "_init_ctx: request id <prefix>-<X-Request-Id, else the body's request_id, else a random uuid>"
        source: "vllm/entrypoints/pooling/base/serving.py:113-116"
        set:
          vars.request_id: "= input.prefix + '-' + (has(input.x_request_id) && input.x_request_id != null ? input.x_request_id : (has(input.body.request_id) && input.body.request_id != null ? input.body.request_id : id('random-uuid', seq('random-uuid'))))"
      - title: "PoolingBaseServing._check_model returns None for an unknown name (it only resolves runtime LoRA), so the 404 comes from _maybe_get_adapters: 'The model `<name>` does not exist.'"
        source: "vllm/entrypoints/pooling/base/serving.py:117-121"
        call: base-serving.maybe-get-adapters
        input: {model: "= vars.model"}
        as: lora
      - set:
          vars.model_name: "= vars.lora.value.lora_request != null ? vars.model : (config['served-model-name'] != null ? config['served-model-name'][0] : config['model'])"
      - title: "_validate_request: truncate_prompt_tokens above max_model_len is a ValueError (before any tokenization)"
        source: "vllm/entrypoints/pooling/base/serving.py:244-255"
        if: "has(input.body.truncate_prompt_tokens) && input.body.truncate_prompt_tokens != null && input.body.truncate_prompt_tokens > config['max-model-len']"
        then: [{fail: {code: value-error, message: "truncate_prompt_tokens value is greater than max_model_len. Please request a smaller truncation size."}}]
      - title: "prompt_to_seq: a string, or one list of token ids, is one prompt; any other list is the sequence of prompts"
        source: "vllm/entrypoints/pooling/base/io_processor.py:136-139"
        set:
          vars.inputs: "= type(input.body.input) == string || (type(input.body.input) == list && size(input.body.input) > 0 && input.body.input.all(x, type(x) == int)) ? [input.body.input] : input.body.input"
      - if: "size(vars.inputs) == 0"
        then: [{source: "vllm/entrypoints/pooling/base/serving.py:86-89", fail: {code: value-error, message: You must pass at least one prompt}}]
      - title: "build_tok_params: max_total_tokens = max_model_len, max_output_tokens = 0, the request's truncation"
        source: "vllm/entrypoints/pooling/base/protocol.py:108-144"
        call: tokenize-params.post-init
        input: {max_total_tokens: "= config['max-model-len']", max_output_tokens: 0, max_total_tokens_param: max_model_len, truncate_prompt_tokens: "= has(input.body.truncate_prompt_tokens) ? input.body.truncate_prompt_tokens : null", truncation_side: "= has(input.body.truncation_side) ? input.body.truncation_side : null"}
      - set:
          vars.toks: []
      - title: "render_async per prompt under asyncio.gather: the first VLLMValidationError (an over-long prompt) propagates as a 400"
        source: "vllm/entrypoints/pooling/base/serving.py:91-93"
        foreach: "= vars.inputs"
        as: p
        max: 64
        steps:
          - call: base-renderer.tokenize-prompt
            input: "= type(vars.p) == list ? {'prompt_token_ids': vars.p, 'max_output_tokens': 0, 'truncate_prompt_tokens': has(input.body.truncate_prompt_tokens) ? input.body.truncate_prompt_tokens : null, 'truncation_side': has(input.body.truncation_side) ? input.body.truncation_side : null} : {'prompt': vars.p, 'max_output_tokens': 0, 'truncate_prompt_tokens': has(input.body.truncate_prompt_tokens) ? input.body.truncate_prompt_tokens : null, 'truncation_side': has(input.body.truncation_side) ? input.body.truncation_side : null}"
            as: tok
          - set:
              vars.toks: "= vars.toks + [vars.tok.value.prompt_token_ids]"
      - title: "_prepare_generators: pooling_params.verify(model_config)"
        source: "vllm/entrypoints/pooling/base/serving.py:158-160"
        call: pooling-params.verify
        input: {task: "= input.task", use_activation: "= has(input.body.use_activation) ? input.body.use_activation : null", dimensions: "= has(input.body.dimensions) ? input.body.dimensions : null"}
        as: pp
      - title: "One AsyncLLM.encode per prompt (<request_id>-<i>), merged by merge_async_iterators"
        source: "vllm/entrypoints/pooling/base/serving.py:162-187"
        parallel: "= lists.range(size(vars.toks))"
        as: i
        steps:
          - call: async-llm.encode
            input: {request_id: "= vars.request_id + '-' + string(vars.i)", prompt_token_ids: "= vars.toks[vars.i]", pooling_params: {task: "= input.task"}}
            as: e
            on_error: continue
          - return: "= {'error': vars.e.ok ? null : vars.e.error, 'data': !vars.e.ok || vars.e.value == null || !has(vars.e.value.outputs) ? [] : vars.e.value.outputs.data, 'prompt_tokens': size(vars.toks[vars.i])}"
        join: {need: all}
        as_result: outs
        on_insufficient: {code: generation-error}
      - title: "_collect_batch: an exception out of the merged iterator propagates (a validation error stays a 400)"
        source: "vllm/entrypoints/pooling/base/serving.py:203-213"
        foreach: "= vars.outs.results"
        as: o
        max: 64
        steps:
          - if: "vars.o.value.error != null"
            then: [{fail: "= vars.o.value.error"}]
      - title: "get_pooling_usage: the prompt token ids of every output"
        source: "vllm/entrypoints/pooling/utils.py:147-157"
        set:
          vars.ptoks: "= sum(vars.outs.results.map(r, r.value.prompt_tokens))"
          vars.sorted: "= vars.outs.results.sortBy(r, r.index)"
      - if: "vars.kind == 'pooling'"
        then:
          - title: "PoolingResponse: one PoolingResponseData(index, object pooling, data) per prompt"
            source: "vllm/entrypoints/pooling/pooling/serving.py:138-171"
            return: {id: "= vars.request_id", object: list, created: "= now / 1000", model: "= vars.model_name", data: "= vars.sorted.map(r, {'index': r.index, 'object': 'pooling', 'data': r.value.data})", usage: {prompt_tokens: "= vars.ptoks", total_tokens: "= vars.ptoks"}}
      - if: "vars.kind == 'classify'"
        then:
          - title: "ClassificationResponse: label = id2label[argmax(probs)], probs, num_classes per prompt"
            source: "vllm/entrypoints/pooling/classify/serving.py:34-72"
            return: {id: "= vars.request_id", object: list, created: "= now / 1000", model: "= vars.model_name", data: "= vars.sorted.map(r, {'index': r.index, 'label': null, 'probs': r.value.data, 'num_classes': size(r.value.data)})", usage: {prompt_tokens: "= vars.ptoks", total_tokens: "= vars.ptoks"}}
      - title: "EmbeddingResponse: one EmbeddingResponseData(index, object embedding, embedding) per prompt"
        source: "vllm/entrypoints/pooling/embed/serving.py:42-220"
        return:
          id: "= vars.request_id"
          object: list
          created: "= now / 1000"
          model: "= vars.model_name"
          data: "= vars.sorted.map(r, {'index': r.index, 'object': 'embedding', 'embedding': r.value.data})"
          usage: {prompt_tokens: "= vars.ptoks", total_tokens: "= vars.ptoks"}
  # ------------------------------------------------------------------ /pooling
  - component: serving-pooling
    name: verify-pooling-task
    kind: function
    summary: "ServingPooling._verify_pooling_task (get_io_processor): dimensions is refused; the task defaults to the model's pooling task (an IOProcessorRequest is plugin); a task other than the pooling task is 'Unsupported task' when the model lacks it, else a hint to switch --pooler-config.task; plugin needs an IOProcessor plugin. Every refusal is a VLLMValidationError naming task."
    sources: ["vllm/entrypoints/pooling/pooling/serving.py:56-100"]
    request:
      type: object
      properties:
        body: {type: object, properties: {task: {type: [string, "null"], default: null}, dimensions: {type: [integer, "null"], default: null}}}
        io_processor_plugin: {type: boolean, default: false, description: "has_io_processor(vllm_config, model_config.io_processor_plugin): no world installs one"}
      required: [body]
    errors: [{code: vllm-validation-error, status: 0, retryable: false}]
    behavior:
      - if: "has(input.body.dimensions) && input.body.dimensions != null"
        then: [{source: "vllm/entrypoints/pooling/pooling/serving.py:62-65", fail: {code: vllm-validation-error, message: dimensions is currently not supported, data: {param: dimensions}}}]
      - call: pooling-factories.get-pooling-task
        as: pt
      - title: "request.task defaults to the model's pooling task; a body with data (and no input or messages) is an IOProcessorRequest, whose task is plugin"
        source: "vllm/entrypoints/pooling/pooling/serving.py:67-74"
        set:
          vars.task: "= has(input.body.data) && input.body.data != null && !(has(input.body.input) && input.body.input != null) && !(has(input.body.messages) && input.body.messages != null) ? dyn('plugin') : (has(input.body.task) && input.body.task != null ? dyn(input.body.task) : vars.pt.value.pooling_task)"
          vars.tasks: "= vars.pt.value.supported_tasks"
      - if: "vars.task != 'plugin' && vars.task != vars.pt.value.pooling_task"
        then:
          - if: "!(vars.task in vars.tasks)"
            then: [{title: "A task the model does not support", source: "vllm/entrypoints/pooling/pooling/serving.py:78-83", fail: {code: vllm-validation-error, message: "= 'Unsupported task: \\'' + vars.task + '\\' Supported tasks: (' + vars.tasks.map(x, '\\'' + x + '\\'').join(', ') + (size(vars.tasks) == 1 ? ',' : '') + ')'", data: {param: task}}}]
          - title: "Supported, but not the task the pooler was built for"
            source: "vllm/entrypoints/pooling/pooling/serving.py:84-89"
            fail: {code: vllm-validation-error, message: "= 'Try switching the model\\'s pooling_task via --pooler-config.task ' + vars.task + '.'", data: {param: task}}
      - if: "vars.task == 'plugin' && !(has(input.io_processor_plugin) && input.io_processor_plugin) && vars.pt.value.pooling_task != 'plugin'"
        then: [{title: "No IOProcessor plugin among the io_processors", source: "vllm/entrypoints/pooling/pooling/serving.py:91-98", fail: {code: vllm-validation-error, message: "No IOProcessor plugin installed. Please refer to the documentation and to the 'prithvi_geospatial_mae_io_processor' offline inference example for more details.", data: {param: task}}}]
      - return: {pooling_task: "= vars.task"}
  - component: serving-pooling
    name: serve-pooling
    kind: function
    summary: "ServingPooling.__call__ for POST /pooling: the BeforeValidator rejects the removed normalize parameter and the removed score / encode tasks; get_io_processor verifies the task; then the shared pooling pipeline answers a PoolingResponse (data per prompt)."
    sources: ["vllm/entrypoints/pooling/pooling/serving.py:35-171", "vllm/entrypoints/pooling/pooling/protocol.py:96-114"]
    request:
      type: object
      properties:
        body:
          type: object
          properties:
            model: {type: [string, "null"], examples: [llama-8b]}
            input: {type: [string, array], items: {type: [string, integer, array]}, default: [hello world]}
            task: {type: [string, "null"], default: null}
            encoding_format: {type: string, default: float}
        x_request_id: {type: [string, "null"]}
      required: [body]
    errors: [{code: vllm-validation-error, status: 0, retryable: false}, {code: value-error, status: 0}]
    behavior:
      - title: "reject_removed_pooling_parameters (the request union's BeforeValidator): normalize was removed"
        source: "vllm/entrypoints/pooling/base/protocol.py:23-32"
        if: "has(input.body.normalize)"
        then: [{fail: {code: vllm-validation-error, message: "Parameter `normalize` was removed; use `use_activation` instead.", data: {param: normalize}}}]
      - title: "check_removed_pooling_task: score and encode are gone"
        source: "vllm/tasks.py:20-31"
        if: "has(input.body.task) && input.body.task in ['score', 'encode']"
        then: [{fail: {code: vllm-validation-error, message: "= input.body.task == 'score' ? '`score` task was removed; use `classify` instead.' : '`encode` task was removed; use `token_embed` or `token_classify` instead.'", data: {param: task}}}]
      - call: serving-pooling.verify-pooling-task
        input: {body: "= input.body"}
        as: v
      - call: pooling-base-serving.serve
        input: {task: "= vars.v.value.pooling_task", kind: pooling, prefix: pooling, body: "= input.body", x_request_id: "= has(input.x_request_id) ? input.x_request_id : null"}
        as: r
      - return: "= vars.r.value"
  # ------------------------------------------------------------------ scoring
  - component: scoring-io-processor
    name: valid-inputs
    kind: function
    summary: "valid_inputs_online + validate_score_input: a ScoreRequest's data_1/data_2 (queries+documents, queries+items, data_1+data_2 or text_1+text_2; a rerank's query and documents), each wrapped into a list; a multimodal item needs a multimodal model; data_1 must have one entry or as many as data_2, and neither may be empty."
    sources: ["vllm/entrypoints/pooling/scoring/io_processor.py:168-192", "vllm/entrypoints/pooling/scoring/utils.py:92-141"]
    request:
      type: object
      properties:
        data_1: {type: [string, object, array, "null"], examples: ["What is the capital of France?"]}
        data_2: {type: [string, object, array, "null"], examples: [The capital of France is Paris.]}
        is_multimodal_model: {type: boolean, default: false}
        architecture: {type: string, default: LlamaForCausalLM}
      required: [data_1, data_2]
    errors: [{code: vllm-validation-error, status: 0, retryable: false}]
    behavior:
      - title: "A single ScoreInput becomes a one-item list"
        source: "vllm/entrypoints/pooling/scoring/utils.py:132-136"
        set:
          vars.d1: "= type(input.data_1) == list ? input.data_1 : [input.data_1]"
          vars.d2: "= type(input.data_2) == list ? input.data_2 : [input.data_2]"
      - title: "_validate_mm_score_input: a content-part item (not a string) is refused on a text-only model"
        source: "vllm/entrypoints/pooling/scoring/utils.py:98-107"
        if: "!(has(input.is_multimodal_model) && input.is_multimodal_model) && (vars.d1 + vars.d2).exists(d, type(d) != string)"
        then: [{fail: {code: vllm-validation-error, message: "= 'MultiModalParam is not supported for ' + input.architecture"}}]
      - title: "_validate_score_input_lens: 1:1, 1:N or N:N, then neither side empty"
        source: "vllm/entrypoints/pooling/scoring/utils.py:111-123"
        if: "size(vars.d1) > 1 && size(vars.d1) != size(vars.d2)"
        then: [{fail: {code: vllm-validation-error, message: "Input lengths must be either 1:1, 1:N or N:N"}}]
      - if: "size(vars.d1) == 0"
        then: [{source: "vllm/entrypoints/pooling/scoring/utils.py:120-121", fail: {code: vllm-validation-error, message: At least one text element must be given}}]
      - if: "size(vars.d2) == 0"
        then: [{source: "vllm/entrypoints/pooling/scoring/utils.py:122-123", fail: {code: vllm-validation-error, message: At least one text_pair element must be given}}]
      - return: {data_1: "= vars.d1.map(d, type(d) == string ? d : (has(d.content) ? d.content : []))", data_2: "= vars.d2.map(d, type(d) == string ? d : (has(d.content) ? d.content : []))"}
  - component: scoring-io-processor
    name: get-token-limits
    kind: function
    summary: "_get_token_limits: max_tokens_per_query and max_tokens_per_doc (0 means no limit); a non-zero limit must be non-negative and below max_model_len (ValueError, a 400)."
    sources: ["vllm/entrypoints/pooling/scoring/io_processor.py:110-141"]
    request: {type: object, properties: {max_tokens_per_query: {type: [integer, "null"], default: 0}, max_tokens_per_doc: {type: [integer, "null"], default: 0}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set:
          vars.q: "= has(input.max_tokens_per_query) && input.max_tokens_per_query != null ? input.max_tokens_per_query : 0"
          vars.d: "= has(input.max_tokens_per_doc) && input.max_tokens_per_doc != null ? input.max_tokens_per_doc : 0"
      - title: "_validate_token_limit(max_tokens_per_query) when it is set"
        source: "vllm/entrypoints/pooling/scoring/io_processor.py:137-138"
        if: "vars.q != 0"
        then:
          - if: "vars.q < 0"
            then: [{source: "vllm/entrypoints/pooling/scoring/io_processor.py:111-112", fail: {code: value-error, message: max_tokens_per_query must be a non-negative integer}}]
          - if: "vars.q >= config['max-model-len']"
            then: [{source: "vllm/entrypoints/pooling/scoring/io_processor.py:113-117", fail: {code: value-error, message: "= 'max_tokens_per_query (' + string(vars.q) + ') must be less than max_model_len (' + string(config['max-model-len']) + ').'"}}]
      - title: "then max_tokens_per_doc"
        source: "vllm/entrypoints/pooling/scoring/io_processor.py:139-140"
        if: "vars.d != 0"
        then:
          - if: "vars.d < 0"
            then: [{source: "vllm/entrypoints/pooling/scoring/io_processor.py:111-112", fail: {code: value-error, message: max_tokens_per_doc must be a non-negative integer}}]
          - if: "vars.d >= config['max-model-len']"
            then: [{source: "vllm/entrypoints/pooling/scoring/io_processor.py:113-117", fail: {code: value-error, message: "= 'max_tokens_per_doc (' + string(vars.d) + ') must be less than max_model_len (' + string(config['max-model-len']) + ').'"}}]
      - return: {max_tokens_per_query: "= vars.q", max_tokens_per_doc: "= vars.d"}
  - component: scoring-io-processor
    name: truncate-text-to-tokens
    kind: function
    summary: "truncate_text_to_tokens: cut a text to at most max_tokens content tokens (no special tokens) at a character boundary; 0 or less gives the empty string (ASSUMPTION: the word-per-token stand-in tokenizer, so the first max_tokens words)."
    sources: ["vllm/entrypoints/pooling/scoring/utils.py:42-71"]
    request: {type: object, properties: {text: {type: string, examples: [The capital of France is Paris.]}, max_tokens: {type: integer, examples: [10]}}, required: [text, max_tokens]}
    behavior:
      - if: "input.max_tokens <= 0"
        then: [{source: "vllm/entrypoints/pooling/scoring/utils.py:53-54", return: {text: ""}}]
      - set:
          vars.words: "= input.text.split(' ')"
      - if: "size(vars.words) <= input.max_tokens"
        then: [{source: "vllm/entrypoints/pooling/scoring/utils.py:63-64", return: {text: "= input.text"}}]
      - title: "Slice the text at the end of the max_tokens-th token (offset_mapping), re-encoding until it fits"
        source: "vllm/entrypoints/pooling/scoring/utils.py:56-69"
        return: {text: "= vars.words.slice(0, input.max_tokens).join(' ')"}
  - component: serving-scores
    name: serve-score
    kind: function
    summary: "ServingScores.__call__ for /score and /rerank: the IO processor follows the model's pooling task (embed: bi-encoder, classify: cross-encoder, token_embed: late interaction). _init_ctx checks the model and truncate_prompt_tokens; the processor validates the inputs and the per-query/per-document token limits, then renders one engine input per prompt (bi-encoder: queries then documents, each embedded) or per (query, document) pair (cross-encoder, the classify task), every one tokenized with max_model_len and the request's truncation; usage counts the prompt token ids."
    sources: ["vllm/entrypoints/pooling/scoring/serving.py:36-107", "vllm/entrypoints/pooling/scoring/io_processor.py:216-357", "vllm/entrypoints/pooling/scoring/io_processor.py:442-752"]
    request:
      type: object
      properties:
        body:
          type: object
          properties:
            model: {type: [string, "null"], examples: [llama-8b]}
            queries: {type: [string, array, object, "null"], default: null}
            documents: {type: [string, array, object, "null"], default: null}
            items: {type: [string, array, object, "null"], default: null}
            data_1: {type: [string, array, object, "null"], default: null}
            data_2: {type: [string, array, object, "null"], default: null}
            text_1: {type: [string, array, object, "null"], default: null}
            text_2: {type: [string, array, object, "null"], default: null}
            query: {type: [string, object, "null"], default: null}
            top_n: {type: [integer, "null"], default: null}
            truncate_prompt_tokens: {type: [integer, "null"], default: null}
            truncation_side: {type: [string, "null"], default: null}
            max_tokens_per_query: {type: [integer, "null"], default: 0}
            max_tokens_per_doc: {type: [integer, "null"], default: 0}
            use_activation: {type: [boolean, "null"], default: null}
            request_id: {type: [string, "null"], default: null}
        prefix: {type: string, default: score}
        x_request_id: {type: [string, "null"]}
      required: [body]
    errors: [{code: value-error, status: 0}, {code: vllm-validation-error, status: 0}, {code: vllm-not-found-error, status: 0}, {code: generation-error, status: 0}]
    behavior:
      - call: pooling-factories.get-pooling-task
        as: pt
      - set:
          vars.prefix: "= has(input.prefix) ? input.prefix : 'score'"
          vars.score_type: "= vars.pt.value.score_type"
          vars.model: "= has(input.body.model) && input.body.model != null ? input.body.model : ''"
      - title: "The engine task of the scoring processor: classify for the cross-encoder, embed for the bi-encoder, token_embed for late interaction"
        source: "vllm/entrypoints/pooling/scoring/io_processor.py:216-218"
        set:
          vars.task: "= vars.score_type == 'cross-encoder' ? 'classify' : (vars.score_type == 'late-interaction' ? 'token_embed' : 'embed')"
          vars.rid: "= vars.prefix + '-' + (has(input.x_request_id) && input.x_request_id != null ? input.x_request_id : (has(input.body.request_id) && input.body.request_id != null ? input.body.request_id : id('random-uuid', seq('random-uuid'))))"
      - title: "_init_ctx: _maybe_get_adapters (PoolingBaseServing._check_model never 404s)"
        source: "vllm/entrypoints/pooling/base/serving.py:117-121"
        call: base-serving.maybe-get-adapters
        input: {model: "= vars.model"}
        as: lora
      - set:
          vars.model_name: "= vars.lora.value.lora_request != null ? vars.model : (config['served-model-name'] != null ? config['served-model-name'][0] : config['model'])"
      - title: "_validate_request: truncate_prompt_tokens above max_model_len"
        source: "vllm/entrypoints/pooling/base/serving.py:244-255"
        if: "has(input.body.truncate_prompt_tokens) && input.body.truncate_prompt_tokens != null && input.body.truncate_prompt_tokens > config['max-model-len']"
        then: [{fail: {code: value-error, message: "truncate_prompt_tokens value is greater than max_model_len. Please request a smaller truncation size."}}]
      - title: "valid_inputs_online: a RerankRequest scores query against documents; a ScoreRequest's data_1/data_2 are queries+documents, queries+items, data_1+data_2 or text_1+text_2 (the union's members in order)"
        source: "vllm/entrypoints/pooling/scoring/io_processor.py:181-192"
        set:
          vars.b: "= input.body"
      - set:
          vars.pair: "= vars.prefix == 'rerank' ? [has(vars.b.query) ? vars.b.query : null, has(vars.b.documents) ? vars.b.documents : null] : (has(vars.b.queries) && vars.b.queries != null && has(vars.b.documents) && vars.b.documents != null ? [vars.b.queries, vars.b.documents] : (has(vars.b.queries) && vars.b.queries != null && has(vars.b.items) && vars.b.items != null ? [vars.b.queries, vars.b.items] : (has(vars.b.data_1) && vars.b.data_1 != null && has(vars.b.data_2) && vars.b.data_2 != null ? [vars.b.data_1, vars.b.data_2] : [has(vars.b.text_1) ? vars.b.text_1 : null, has(vars.b.text_2) ? vars.b.text_2 : null])))"
      - if: "vars.pair[0] == null || vars.pair[1] == null"
        then:
          - title: "No member of the request type validates: RequestValidationError, 400 Bad Request (ASSUMPTION: reported as the first missing field)"
            source: "vllm/entrypoints/serve/exception_handling/handlers/validation.py:149-195"
            fail: {code: Bad Request, status: 400, message: "= '1 validation error:\\n  {\\'type\\': \\'missing\\', \\'loc\\': \\'body.' + (vars.prefix == 'rerank' ? (vars.pair[0] == null ? 'query' : 'documents') : (vars.pair[0] == null ? 'queries' : 'documents')) + '\\', \\'msg\\': \\'Field required\\', \\'input\\': \\'<dict of ' + string(size(vars.b)) + ' items>\\'}'", data: {param: "= 'body.' + (vars.prefix == 'rerank' ? (vars.pair[0] == null ? 'query' : 'documents') : (vars.pair[0] == null ? 'queries' : 'documents'))"}}
      - call: scoring-io-processor.valid-inputs
        input: {data_1: "= vars.pair[0]", data_2: "= vars.pair[1]", architecture: "= config['model']"}
        as: sd
      - call: scoring-io-processor.get-token-limits
        input: {max_tokens_per_query: "= has(vars.b.max_tokens_per_query) ? vars.b.max_tokens_per_query : 0", max_tokens_per_doc: "= has(vars.b.max_tokens_per_doc) ? vars.b.max_tokens_per_doc : 0"}
        as: lim
      - title: "build_tok_params: max_total_tokens = max_model_len, max_output_tokens = 0, the request's truncation"
        source: "vllm/entrypoints/pooling/scoring/protocol.py:69-75"
        call: tokenize-params.post-init
        input: {max_total_tokens: "= config['max-model-len']", max_output_tokens: 0, max_total_tokens_param: max_model_len, truncate_prompt_tokens: "= has(vars.b.truncate_prompt_tokens) ? vars.b.truncate_prompt_tokens : null", truncation_side: "= has(vars.b.truncation_side) ? vars.b.truncation_side : null"}
      - set:
          vars.d1: "= vars.sd.value.data_1"
          vars.d2: "= vars.sd.value.data_2"
          vars.tpt: "= has(vars.b.truncate_prompt_tokens) ? vars.b.truncate_prompt_tokens : null"
          vars.side: "= has(vars.b.truncation_side) ? vars.b.truncation_side : null"
          vars.texts: []
      - if: "vars.score_type == 'cross-encoder'"
        then:
          - title: "CrossEncoderIOProcessor: one ScoringRenderParams per document, the single query replicated"
            source: "vllm/entrypoints/pooling/scoring/io_processor.py:484-518"
            set:
              vars.qs: "= size(vars.d1) == 1 ? lists.range(size(vars.d2)).map(j, vars.d1[0]) : vars.d1"
          - title: "get_score_prompt: the query and the document are cut to their token limits before they are composed into one pair prompt"
            source: "vllm/entrypoints/pooling/scoring/io_processor.py:653-659"
            foreach: "= lists.range(size(vars.d2))"
            as: j
            max: 64
            steps:
              - set: {vars.qt: "= vars.qs[vars.j]", vars.dt: "= vars.d2[vars.j]"}
              - if: "vars.lim.value.max_tokens_per_query > 0 && type(vars.qt) == string"
                then:
                  - call: scoring-io-processor.truncate-text-to-tokens
                    input: {text: "= vars.qt", max_tokens: "= vars.lim.value.max_tokens_per_query"}
                    as: tq
                  - set: {vars.qt: "= vars.tq.value.text"}
              - if: "vars.lim.value.max_tokens_per_doc > 0 && type(vars.dt) == string"
                then:
                  - call: scoring-io-processor.truncate-text-to-tokens
                    input: {text: "= vars.dt", max_tokens: "= vars.lim.value.max_tokens_per_doc"}
                    as: td
                  - set: {vars.dt: "= vars.td.value.text"}
              - title: "tokenizer(text=query, text_pair=document) (use_sep_token; ASSUMPTION: one sequence, the separators not counted)"
                source: "vllm/entrypoints/pooling/scoring/io_processor.py:672-699"
                set: {vars.texts: "= vars.texts + [(type(vars.qt) == string ? vars.qt : '') + ' ' + (type(vars.dt) == string ? vars.dt : '')]"}
        else:
          - title: "BiEncoderIOProcessor: texts cut to their limits, then every query and every document is its own prompt (queries first)"
            source: "vllm/entrypoints/pooling/scoring/io_processor.py:223-267"
            foreach: "= lists.range(size(vars.d1) + size(vars.d2))"
            as: k
            max: 128
            steps:
              - set:
                  vars.t: "= vars.k < size(vars.d1) ? vars.d1[vars.k] : vars.d2[vars.k - size(vars.d1)]"
                  vars.lt: "= vars.k < size(vars.d1) ? vars.lim.value.max_tokens_per_query : vars.lim.value.max_tokens_per_doc"
              - if: "vars.lt > 0 && type(vars.t) == string"
                then:
                  - source: "vllm/entrypoints/pooling/scoring/io_processor.py:143-166"
                    call: scoring-io-processor.truncate-text-to-tokens
                    input: {text: "= vars.t", max_tokens: "= vars.lt"}
                    as: tt
                  - set: {vars.t: "= vars.tt.value.text"}
              - set: {vars.texts: "= vars.texts + [type(vars.t) == string ? vars.t : '']"}
      - set:
          vars.toks: []
      - title: "_preprocessing: render every engine input under asyncio.gather; an over-long prompt fails the request with its VLLMValidationError (a 400) before anything is encoded"
        source: "vllm/entrypoints/pooling/base/serving.py:83-93"
        foreach: "= vars.texts"
        as: text
        max: 128
        steps:
          - call: base-renderer.tokenize-prompt
            input: {prompt: "= vars.text", max_output_tokens: 0, truncate_prompt_tokens: "= vars.tpt", truncation_side: "= vars.side"}
            as: tok
          - set: {vars.toks: "= vars.toks + [vars.tok.value.prompt_token_ids]"}
      - title: "_prepare_generators: PoolingParams(task, use_activation).verify, then one AsyncLLM.encode per engine input, merged"
        source: "vllm/entrypoints/pooling/scoring/protocol.py:77-81"
        call: pooling-params.verify
        input: {task: "= vars.task", use_activation: "= has(vars.b.use_activation) ? vars.b.use_activation : null"}
        as: pp
      - source: "vllm/entrypoints/pooling/base/serving.py:162-187"
        parallel: "= lists.range(size(vars.toks))"
        as: i
        steps:
          - call: async-llm.encode
            input: {request_id: "= vars.rid + '-' + string(vars.i)", prompt_token_ids: "= vars.toks[vars.i]", pooling_params: {task: "= vars.task"}}
            as: e
            on_error: continue
          - return: "= {'error': vars.e.ok ? null : vars.e.error, 'data': !vars.e.ok || vars.e.value == null || !has(vars.e.value.outputs) || !has(vars.e.value.outputs.data) ? [1.0] : vars.e.value.outputs.data}"
        join: {need: all}
        as_result: outs
        on_insufficient: {code: generation-error}
      - title: "_collect_batch: the first error out of the merged generators propagates"
        source: "vllm/entrypoints/pooling/base/serving.py:203-211"
        foreach: "= vars.outs.results"
        as: o
        max: 128
        steps:
          - if: "vars.o.value.error != null"
            then: [{fail: "= vars.o.value.error"}]
      - set:
          vars.data: "= vars.outs.results.sortBy(r, r.index).map(r, r.value.data)"
          vars.ptoks: "= sum(vars.toks.map(t, size(t)))"
      - if: "vars.score_type == 'cross-encoder'"
        then:
          - title: "ScoringRequestOutput.from_base: the classifier's single logit is the pair's score"
            source: "vllm/entrypoints/pooling/scoring/serving.py:119-125"
            set:
              vars.scores: "= vars.data.map(x, size(x) > 0 ? double(x[0]) : 0.0)"
        else:
          - title: "_post_process: cosine similarity of query i (or the one query) with document i"
            source: "vllm/entrypoints/pooling/scoring/io_processor.py:325-357"
            set:
              vars.scores: "= lists.range(size(vars.d2)).map(j, [vars.data[size(vars.d1) == 1 ? 0 : j], vars.data[size(vars.d1) + j]]).map(p, size(p[0]) == size(p[1]) ? sum(lists.range(size(p[0])).map(k, double(p[0][k]) * double(p[1][k]))) / (math.sqrt(sum(p[0].map(x, double(x) * double(x)))) * math.sqrt(sum(p[1].map(x, double(x) * double(x)))) + 1e-12) : 0.0)"
      - title: "_build_response: usage counts the prompt token ids of every engine input"
        source: "vllm/entrypoints/pooling/scoring/serving.py:75-107"
        call: serving-scores.build-response
        input: {prefix: "= vars.prefix", request_id: "= vars.rid", model_name: "= vars.model_name", scores: "= vars.scores", documents: "= type(vars.pair[1]) == list ? vars.pair[1] : [vars.pair[1]]", top_n: "= has(vars.b.top_n) && vars.b.top_n != null ? vars.b.top_n : 0", num_prompt_tokens: "= vars.ptoks"}
        as: resp
      - return: "= vars.resp.value"
  # ------------------------------------------------------------------ LLM.encode
  - component: llm
    name: encode
    kind: function
    summary: "PoolingOfflineMixin.encode: a DataPrompt only for plugin; _verify_pooling_task against the resolved runner_type, the supported tasks and the model's pooling task; get_request_factory_offline (one PoolingParams for every prompt, or exactly one per prompt, each taking the task unless it names another); then _run_tiling_engine."
    sources: ["vllm/entrypoints/pooling/offline.py:62-195", "vllm/entrypoints/pooling/base/io_processor.py:183-241", "vllm/entrypoints/pooling/base/io_processor.py:307-321"]
    request:
      type: object
      properties:
        prompts: {type: [string, object, array], items: {type: [string, object, array, integer]}, default: [hello world]}
        pooling_params: {type: [object, array, "null"], items: {type: object}, default: null, description: "one PoolingParams for every prompt, a list with one per prompt, or None (the defaults)"}
        pooling_task: {type: [string, "null"], default: null}
      required: [prompts]
    errors: [{code: value-error, status: 0}, {code: vllm-validation-error, status: 0}]
    behavior:
      - if: "type(input.prompts) == map && 'data' in input.prompts && (!has(input.pooling_task) || input.pooling_task != 'plugin')"
        then: [{source: "vllm/entrypoints/pooling/offline.py:96-99", fail: {code: value-error, message: "The 'data' field is only supported for the 'plugin' pooling task."}}]
      - title: "self.runner_type is model_config.runner_type, resolved from --runner (auto picks pooling for a pooling architecture), not the raw option"
        source: "vllm/entrypoints/pooling/offline.py:137-142"
        call: model-config.post-init
        input: {model: "= config['model']", max_model_len: "= config['max-model-len']", runner: "= config['runner']", quantization: null, enforce_eager: false, language_model_only: false, mm_processor_device: null, mm_processor_kwargs: null, mm_encoder_attn_backend: null, mm_tensor_ipc: direct_rpc, hf_overrides: null}
        as: mc
        on_error: continue
      - set:
          vars.runner_type: "= vars.mc.ok && has(vars.mc.value.runner_type) ? vars.mc.value.runner_type : (config['runner'] == 'pooling' ? 'pooling' : 'generate')"
      - if: "vars.runner_type != 'pooling'"
        then: [{title: "_verify_pooling_task: not a pooling model", source: "vllm/entrypoints/pooling/offline.py:137-142", fail: {code: value-error, message: "LLM.encode() is only supported for pooling models. Try passing `--runner pooling` to use the model as a pooling model."}}]
      - if: "!has(input.pooling_task) || input.pooling_task == null"
        then: [{source: "vllm/entrypoints/pooling/offline.py:144-156", fail: {code: value-error, message: "\n                pooling_task required for `LLM.encode`.\n                Please use one of the more specific methods or set the pooling_task when using `LLM.encode`:\n                  - For embeddings, use `LLM.embed(...)` or `pooling_task=\"embed\"`.\n                  - For classification logits, use `LLM.classify(...)` or `pooling_task=\"classify\"`.\n                  - For similarity scores, use `LLM.score(...)`.\n                  - For rewards, `pooling_task=\"classify\"` or `pooling_task=\"token_classify\"`.\n                  - For token classification, use `pooling_task=\"token_classify\"`.\n                  - For multi-vector retrieval, use `pooling_task=\"token_embed\"`.\n                "}}]
      - set:
          vars.task: "= input.pooling_task"
          vars.tasks: "= state.supported_tasks"
      - if: "vars.task in ['embed', 'token_embed'] && !(vars.task in vars.tasks)"
        then: [{source: "vllm/entrypoints/pooling/offline.py:158-165", fail: {code: value-error, message: "Embedding API is not supported by this model. Try converting the model using `--convert embed`."}}]
      - if: "vars.task in ['classify', 'token_classify'] && !(vars.task in vars.tasks)"
        then: [{source: "vllm/entrypoints/pooling/offline.py:167-174", fail: {code: value-error, message: "Classification API is not supported by this model. Try converting the model using `--convert classify`."}}]
      - title: "self.pooling_task = model_config.get_pooling_task(self.supported_tasks)"
        source: "vllm/entrypoints/pooling/offline.py:46-48"
        call: pooling-factories.get-pooling-task
        input: {supported_tasks: "= vars.tasks"}
        as: pt
      - if: "vars.task != 'plugin' && vars.task != vars.pt.value.pooling_task"
        then:
          - if: "!(vars.task in vars.tasks)"
            then: [{source: "vllm/entrypoints/pooling/offline.py:177-182", fail: {code: value-error, message: "= 'Unsupported task: \\'' + vars.task + '\\' Supported tasks: (' + vars.tasks.map(x, '\\'' + x + '\\'').join(', ') + (size(vars.tasks) == 1 ? ',' : '') + ')'"}}]
          - source: "vllm/entrypoints/pooling/offline.py:183-187"
            fail: {code: value-error, message: "= 'Try switching the model\\'s pooling_task via `PoolerConfig(task=\"' + vars.task + '\")`'"}
      - if: "vars.task == 'plugin' && vars.pt.value.pooling_task != 'plugin'"
        then: [{source: "vllm/entrypoints/pooling/offline.py:189-195", fail: {code: value-error, message: "No IOProcessor plugin installed. Please refer to the documentation and to the 'prithvi_geospatial_mae_io_processor' offline inference example for more details."}}]
      - title: "prompt_to_seq: a string, a dict or one list of token ids is one prompt"
        source: "vllm/entrypoints/pooling/base/io_processor.py:188-189"
        set:
          vars.prompts: "= type(input.prompts) == string || type(input.prompts) == map || (type(input.prompts) == list && size(input.prompts) > 0 && input.prompts.all(x, type(x) == int)) ? [input.prompts] : input.prompts"
          vars.pp: "= has(input.pooling_params) ? input.pooling_params : null"
      - title: "_params_to_seq: a list of PoolingParams must match the prompts one to one"
        source: "vllm/entrypoints/pooling/base/io_processor.py:307-321"
        if: "vars.pp != null && type(vars.pp) == list && size(vars.pp) != size(vars.prompts)"
        then: [{fail: {code: vllm-validation-error, message: "= 'The lengths of prompts (' + string(size(vars.prompts)) + ') and params (' + string(size(vars.pp)) + ') must be the same.'"}}]
      - set:
          vars.params: "= vars.pp == null ? lists.range(size(vars.prompts)).map(i, {}) : (type(vars.pp) == list ? vars.pp : lists.range(size(vars.prompts)).map(i, vars.pp))"
      - title: "Each cloned PoolingParams takes the pooling task; one naming a different task is refused (plugin may overwrite it)"
        source: "vllm/entrypoints/pooling/base/io_processor.py:215-224"
        if: "vars.task != 'plugin' && vars.params.exists(p, has(p.task) && p.task != null && p.task != vars.task)"
        then:
          - set: {vars.bad: "= vars.params.filter(p, has(p.task) && p.task != null && p.task != vars.task)[0].task"}
          - fail: {code: vllm-validation-error, message: "= 'You cannot overwrite param.task=\\'' + vars.bad + '\\' with pooling_task=\\'' + vars.task + '\\'!'"}
      - title: "_run_tiling_engine: add the requests through LLMEngine and step it until they finish"
        source: "vllm/entrypoints/pooling/offline.py:120-134"
        call: llm.run-tiling-engine
        input: {prompts: "= vars.prompts", pooling_task: "= vars.task"}
        as: out
      - return: {num_outputs: "= size(vars.out.value)", pooling_task: "= vars.task", outputs: "= vars.out.value"}
  # ------------------------------------------------------------------ SageMaker /invocations
  - component: sagemaker-router
    name: post-invocations
    kind: http
    summary: "POST /invocations: JSON-decode the body (a decode error is an HTTPException 400), then try each enabled endpoint's request type in order with TypeAdapter.validate_python -- ChatCompletionRequest and CompletionRequest for a generate model; EmbeddingRequest or ClassificationRequest by pooling task, RerankRequest and ScoreRequest when scoring is enabled, PoolingRequest for any pooling model -- and call the first that validates. A pydantic ValidationError moves on; any other exception a validator raises (a VLLMValidationError) escapes to the app's handlers. No match is a 400 listing the type names."
    sources: ["vllm/entrypoints/serve/sagemaker/api_router.py:98-140", "vllm/entrypoints/pooling/factories.py:221-272", "vllm/entrypoints/generate/factories.py:16-41"]
    attributes: {method: POST, path: /invocations}
    request:
      type: object
      properties:
        path: {type: string, examples: [/invocations]}
        headers: {$ref: ServingHttpHeaders}
        body:
          type: [object, string]
          description: "the decoded JSON body; a string stands for raw bytes that are not JSON. The fields of every request type /invocations may validate as."
          properties:
            model: {type: string, examples: [llama-8b]}
            messages: {type: [array, "null"], items: {type: object}, default: null}
            prompt: {type: [array, string, integer, "null"], items: {type: string}, default: null}
            max_tokens: {type: [integer, "null"], default: null}
            stream_options: {type: [object, "null"], default: null}
            input: {type: [string, array, "null"], default: null}
            query: {type: [string, object, "null"], default: null}
            queries: {type: [string, array, "null"], default: null}
            documents: {type: [string, array, "null"], default: null}
            items: {type: [string, array, "null"], default: null}
            data_1: {type: [string, array, object, "null"], default: null}
            data_2: {type: [string, array, object, "null"], default: null}
            text_1: {type: [string, array, object, "null"], default: null}
            text_2: {type: [string, array, object, "null"], default: null}
            data: {type: [object, array, string, "null"], default: null}
            task: {type: [string, "null"], default: null}
      required: [path, body]
    errors: [{code: BadRequestError, status: 400}, {code: Bad Request, status: 400}, {code: NotFoundError, status: 404}, {code: InternalServerError, status: 500}, {code: UnprocessableEntityError, status: 422}, {code: ConnectionRefusedError, status: 0, retryable: true}]
    behavior:
      - call: launcher.accept-connection
      - title: "validate_json_request (the route dependency): a Content-Type other than application/json is refused"
        source: "vllm/entrypoints/serve/utils/api_utils.py:350-356"
        if: "has(input.headers) && input.headers != null && 'Content-Type' in input.headers && input.headers['Content-Type'].lowerAscii().split(';')[0].trim() != 'application/json'"
        then: [{fail: {code: Bad Request, status: 400, message: "1 validation error:\n  Unsupported Media Type: Only 'application/json' is allowed"}}]
      - if: "type(input.body) == string"
        then:
          - set:
              vars.raw: "= input.body.trim()"
          - title: "await raw_request.json() raised json.JSONDecodeError: HTTPException(400, 'JSON decode error: ...'), which vLLM's HTTPException handler answers with type Bad Request (ASSUMPTION: json's message for an empty body, an object with no quoted key, or anything else)"
            source: "vllm/entrypoints/serve/sagemaker/api_router.py:112-118"
            fail: {code: Bad Request, status: 400, message: "= 'JSON decode error: ' + (vars.raw == '' ? 'Expecting value: line 1 column 1 (char 0)' : (vars.raw.startsWith('{') && !vars.raw.substring(1).trim().startsWith('\"') && !vars.raw.substring(1).trim().startsWith('}') ? 'Expecting property name enclosed in double quotes: line 1 column ' + string(size(input.body) - size(input.body.substring(1).trim()) + 1) + ' (char ' + string(size(input.body) - size(input.body.substring(1).trim())) + ')' : 'Expecting value: line 1 column 1 (char 0)'))"}
      - set:
          vars.b: "= input.body.transformMap(k, v, v != null, v)"
          vars.names: []
      - call: app-state.supported-tasks
        as: tasks
      - title: "INVOCATION_TYPES: generate types first, then the pooling ones (earlier entries win)"
        source: "vllm/entrypoints/serve/sagemaker/api_router.py:81-89"
        call: pooling-factories.get-pooling-task
        as: pt
      - if: "'generate' in vars.tasks.value"
        then:
          - set: {vars.names: "= ['ChatCompletionRequest', 'CompletionRequest']"}
          - if: "has(vars.b.messages) && vars.b.messages != null && type(vars.b.messages) == list"
            then:
              - title: "ChatCompletionRequest: its before validators run first and a VLLMValidationError escapes the loop"
                source: "vllm/entrypoints/serve/sagemaker/api_router.py:126-130"
                call: openai-serving-chat.validate-request
                input: {body: "= vars.b"}
                as: cv
                on_error: continue
              - if: "!vars.cv.ok"
                then:
                  - call: exception-handling.vllm-error-handler
                    input: {code: "= vars.cv.error.code", status: "= has(vars.cv.error.status) ? vars.cv.error.status : 0", message: "= vars.cv.error.message", param: "= has(vars.cv.error.data) && vars.cv.error.data != null && 'param' in vars.cv.error.data ? vars.cv.error.data.param : null", value: "= has(vars.cv.error.data) && vars.cv.error.data != null && 'value' in vars.cv.error.data ? vars.cv.error.data.value : null"}
              - title: "It validates: await create_chat_completion(request, raw_request)"
                source: "vllm/entrypoints/serve/sagemaker/api_router.py:132"
                call: openai-serving-chat.post-v1-chat-completions
                input: {path: /v1/chat/completions, headers: "= has(input.headers) ? input.headers : {}", body: "= vars.b"}
                as: c
              - return: "= vars.c.value"
          - title: "CompletionRequest: no messages field means a missing-field ValidationError for chat, so the completion type is tried; its before validators (e.g. the missing prompt) raise VLLMValidationError, which escapes"
            source: "vllm/entrypoints/serve/sagemaker/api_router.py:126-130"
            call: openai-serving-completion.validate-request
            input: {body: "= vars.b"}
            as: pv
            on_error: continue
          - if: "!vars.pv.ok && vars.pv.error.code != 'Bad Request'"
            then:
              - call: exception-handling.vllm-error-handler
                input: {code: "= vars.pv.error.code", status: "= has(vars.pv.error.status) ? vars.pv.error.status : 0", message: "= vars.pv.error.message", param: "= has(vars.pv.error.data) && vars.pv.error.data != null && 'param' in vars.pv.error.data ? vars.pv.error.data.param : null", value: "= has(vars.pv.error.data) && vars.pv.error.data != null && 'value' in vars.pv.error.data ? vars.pv.error.data.value : null"}
          - if: "vars.pv.ok"
            then:
              - call: openai-serving-completion.post-v1-completions
                input: {path: /v1/completions, headers: "= has(input.headers) ? input.headers : {}", body: "= vars.b"}
                as: p
              - return: "= vars.p.value"
      - set:
          vars.task: "= vars.pt.value.pooling_task"
          vars.has_input: "= (has(vars.b.input) && vars.b.input != null) || (has(vars.b.messages) && vars.b.messages != null)"
      - title: "reject_removed_pooling_parameters, the BeforeValidator of the Embedding, Classification and Pooling request unions, raises VLLMValidationError, which escapes the loop"
        source: "vllm/entrypoints/pooling/base/protocol.py:23-32"
        if: "vars.task != null && has(vars.b.normalize)"
        then: [{call: exception-handling.vllm-error-handler, input: {code: vllm-validation-error, message: "Parameter `normalize` was removed; use `use_activation` instead.", param: normalize}}]
      - if: "vars.task == 'embed'"
        then:
          - set: {vars.names: "= vars.names + ['EmbeddingRequest']"}
          - if: "vars.has_input"
            then:
              - title: "EmbeddingRequest validates: create_embedding"
                source: "vllm/entrypoints/pooling/factories.py:233-239"
                call: pooling-base-serving.serve
                input: {task: embed, prefix: embd, body: "= vars.b", x_request_id: "= has(input.headers) && input.headers != null && 'X-Request-Id' in input.headers ? input.headers['X-Request-Id'] : null"}
                as: e
                on_error:
                  - call: exception-handling.vllm-error-handler
                    input: {code: "= error.code", status: "= error.status", message: "= error.message", param: "= has(error.data) && error.data != null && 'param' in error.data ? error.data.param : null", value: "= has(error.data) && error.data != null && 'value' in error.data ? error.data.value : null"}
              - return: "= vars.e.value"
      - if: "vars.task == 'classify'"
        then:
          - set: {vars.names: "= vars.names + ['ClassificationRequest']"}
          - if: "vars.has_input"
            then:
              - title: "ClassificationRequest validates: create_classify"
                source: "vllm/entrypoints/pooling/factories.py:241-247"
                call: pooling-base-serving.serve
                input: {task: classify, prefix: classify, body: "= vars.b", x_request_id: "= has(input.headers) && input.headers != null && 'X-Request-Id' in input.headers ? input.headers['X-Request-Id'] : null"}
                as: cl
                on_error:
                  - call: exception-handling.vllm-error-handler
                    input: {code: "= error.code", status: "= error.status", message: "= error.message", param: "= has(error.data) && error.data != null && 'param' in error.data ? error.data.param : null", value: "= has(error.data) && error.data != null && 'value' in error.data ? error.data.value : null"}
              - return: "= vars.cl.value"
      - if: "vars.pt.value.enable_scoring_api"
        then:
          - set: {vars.names: "= vars.names + ['RerankRequest', 'ScoreRequest']"}
          - title: "RerankRequest (query and documents) validates: do_rerank"
            source: "vllm/entrypoints/pooling/factories.py:249-255"
            if: "has(vars.b.query) && vars.b.query != null && has(vars.b.documents) && vars.b.documents != null"
            then:
              - call: serving-scores.serve-score
                input: {prefix: rerank, body: "= vars.b", x_request_id: "= has(input.headers) && input.headers != null && 'X-Request-Id' in input.headers ? input.headers['X-Request-Id'] : null"}
                as: rr
                on_error:
                  - call: exception-handling.vllm-error-handler
                    input: {code: "= error.code", status: "= error.status", message: "= error.message", param: "= has(error.data) && error.data != null && 'param' in error.data ? error.data.param : null", value: "= has(error.data) && error.data != null && 'value' in error.data ? error.data.value : null"}
              - return: "= vars.rr.value"
          - title: "ScoreRequest (queries+documents, queries+items, data_1+data_2 or text_1+text_2) validates: create_score"
            source: "vllm/entrypoints/pooling/factories.py:257-262"
            if: "(has(vars.b.queries) && vars.b.queries != null && ((has(vars.b.documents) && vars.b.documents != null) || (has(vars.b.items) && vars.b.items != null))) || (has(vars.b.data_1) && vars.b.data_1 != null && has(vars.b.data_2) && vars.b.data_2 != null) || (has(vars.b.text_1) && vars.b.text_1 != null && has(vars.b.text_2) && vars.b.text_2 != null)"
            then:
              - call: serving-scores.serve-score
