      - "calls['model-config.get-diff-sampling-param'] == 1 && steps.b3.result.value.temperature == 0.6"
      - "steps.b3b.result.value == steps.b3.result.value && steps.b3.result.value.top_p == 0.9"
  # ------------------------------------------------------------------ CLI and launchers
  - id: serving-api-cli-serve-single
    name: vllm serve starts one API server; the served app answers requests
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-cli-serve, as: serve}
      - {flow: serving-api-chat-completion, as: chat}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'cli-main.main' && e.error == null)"
      - "steps.serve.result.ok && steps.serve.result.value.mode == 'single-api-server' && steps.serve.result.value.listen_address == 'http://0.0.0.0:8000'"
      - "steps.chat.result.ok"
      - "calls['async-llm.from-vllm-config'] == 1"
