      - "steps.ft.result.value.status_code == 202 && calls['async-llm.handle-fault'] == 1"
      - "!steps.ftbad.result.ok && steps.ftbad.result.error.message.contains('Invalid instruction') && !steps.ftnone.result.ok"
      - "steps.fts.result.ok"
  - id: serving-api-elastic-ep-scale
    name: Elastic EP scale validation and error mapping
    fixtures: [full-tp1-llama-8b]
    # elastic EP scaling needs the Ray data-parallel backend (engine-core's DP client refuses mp)
    state: {dp-lb-async-mp-client: {data_parallel_backend: ray}}
    faults:
      - {target: async-llm.scale-elastic-ep, type: error, code: timeout-error, calls: [2]}
      - {target: async-llm.scale-elastic-ep, type: error, code: value-error, message: bad size, calls: [3]}
      - {target: async-llm.scale-elastic-ep, type: error, code: runtime-error, calls: [4]}
    steps:
      - {interface: elastic-ep-router.post-scale-elastic-ep, caller: api-client, as: ok, input: {path: /scale_elastic_ep, body: {new_data_parallel_size: 2}}}
      - {interface: elastic-ep-router.post-scale-elastic-ep, caller: api-client, as: t408, input: {path: /scale_elastic_ep, body: {new_data_parallel_size: 2, drain_timeout: 5}}}
      - {interface: elastic-ep-router.post-scale-elastic-ep, caller: api-client, as: v400, input: {path: /scale_elastic_ep, body: {new_data_parallel_size: 2}}}
      - {interface: elastic-ep-router.post-scale-elastic-ep, caller: api-client, as: e500, input: {path: /scale_elastic_ep, body: {new_data_parallel_size: 2}}}
      - {interface: elastic-ep-router.post-scale-elastic-ep, caller: api-client, as: missing, input: {path: /scale_elastic_ep, body: {}}}
      - {interface: elastic-ep-router.post-scale-elastic-ep, caller: api-client, as: neg, input: {path: /scale_elastic_ep, body: {new_data_parallel_size: 0}}}
      - {interface: elastic-ep-router.post-scale-elastic-ep, caller: api-client, as: drain, input: {path: /scale_elastic_ep, body: {new_data_parallel_size: 2, drain_timeout: -1}}}
    expect:
      - "steps.ok.result.ok && steps.ok.result.value.message == 'Scaled to 2 data parallel engines'"
      - "steps.t408.result.error.status == 408 && steps.v400.result.error.status == 400 && steps.e500.result.error.status == 500"
      - "steps.missing.result.error.message == 'new_data_parallel_size is required' && steps.neg.result.error.status == 400 && steps.drain.result.error.message.contains('drain_timeout')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.scale-elastic-ep' && e.input.new_data_parallel_size == 2)"
