      - {interface: llm.shutdown-weight-transfer-engine, caller: python-user, as: c2}
      - {interface: llm.start-weight-update, caller: python-user, as: c3}
      - {interface: llm.start-draft-weight-update, caller: python-user, as: c4}
      - {interface: llm.update-weights, caller: python-user, as: c5}
      - {interface: llm.finish-weight-update, caller: python-user, as: c6, input: {weight_version: v2}}
      - {interface: llm.finish-weight-update, caller: python-user, as: c6b, input: {}}
