      - "!steps.hcount.result.ok && steps.hcount.result.error.message.contains('cannot be used with --headless')"
      - "!steps.lb.result.ok && steps.lb.result.error.message.contains('more than one data parallel load balancing mode')"
      - "steps.mport.result.value.mode == 'dp-supervisor' && steps.multi.result.value.api_server_count == 4"
  - id: serving-api-cli-dispatch
    name: CLI main dispatch and the vllm chat client
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    # vllm chat/complete send no max_tokens, so the budget is max_model_len - prompt: a short context keeps each generation short.
    # The second chat turn carries the first answer, so with this context it gets the code's 400 (context length).
    config: {max-model-len: 24}
    steps:
      - {interface: cli-main.main, caller: operator, as: unknown, input: {argv: [frobnicate]}}
      - {interface: cli-main.main, caller: operator, as: omni, input: {argv: [serve, --omni]}}
      - {interface: cli-main.main, caller: operator, as: help, input: {argv: []}}
      - {interface: cli-main.main, caller: operator, as: chat, input: {argv: [chat], args: {quick: "What is the capital of France?"}}}
      - {interface: chat-command.cmd, caller: operator, as: chat2, input: {model_name: llama-8b, lines: [Hi, Thanks]}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'openai-serving-chat.post-v1-chat-completions')"
      - "!steps.unknown.result.ok && steps.unknown.result.error.data.exit_code == 2"
      - "!steps.omni.result.ok && steps.omni.result.error.data.exit_code == 1 && steps.help.result.value.printed_help"
      - "steps.chat.result.ok"
      - "steps.chat.result.value.model == 'llama-8b'"
      - "size(steps.chat.result.value.outputs) == 1"
      # internal on purpose: chat-command keeps the history and resends it (cli/openai.py); only the request shows it
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'openai-serving-chat.create-chat-completion').map(e, size(e.input.body.messages)) == [1, 1, 3]"
      - "!steps.chat2.result.ok && steps.chat2.result.error.status == 400 && steps.chat2.result.error.message.contains('maximum context length is 24')"
      - "calls['openai-serving-models.get-v1-models'] == 1"
  - id: serving-api-cli-dispatch-complete
    name: The vllm complete client and vllm launch render
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    # max_model_len must hold the default max_tokens (16) that `vllm complete` leaves to the server
    config: {max-model-len: 24}
    steps:
      - {interface: cli-main.main, caller: operator, as: complete, input: {argv: [complete], args: {quick: The capital of France is}}}
      - {interface: complete-command.cmd, caller: operator, as: complete2, input: {model_name: llama-8b, quick: Hello}}
      - {interface: cli-main.main, caller: operator, as: launch, input: {argv: [launch], args: {launch_component: render}}}
      - {interface: launch-subcommand.cmd, caller: operator, as: nolaunch, input: {}}
    expect:
