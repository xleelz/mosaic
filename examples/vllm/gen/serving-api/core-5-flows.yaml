      - "trace.exists(e, e.type == 'call.start' && e.interface == 'reasoning-parser-manager.get-reasoning-parser' && e.input.name == 'glm45')"
  - id: serving-api-multimodal-chat-text-only-model
    name: Image parts on a text-only model, and prompt_embeds without --enable-prompt-embeds, are refused with 400
    flow: serving-api-multimodal-chat
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-multimodal-chat, as: img}
      - {flow: serving-api-multimodal-chat, as: emb, input: {body: {messages: [{role: user, content: [{type: prompt_embeds, data: AAAAAAAAAAA=}, {type: text, text: hi}]}]}}}
    expect:
      - "!steps.img.result.ok && steps.img.result.error.status == 400 && steps.img.result.error.message.contains('text-only')"
      - "!steps.emb.result.ok && steps.emb.result.error.message.contains('--enable-prompt-embeds')"
      - "calls['async-llm.generate'] == 0"
  - id: serving-api-multimodal-chat-mixed-parts
    name: A multimodal model with prompt embeds enabled sends the image and the embeddings to the engine
    flow: serving-api-multimodal-chat
