flows:
  - id: serving-api-chat-completion
    name: OpenAI chat completion
    description: "POST /v1/chat/completions through the middleware, rendering, AsyncLLM.generate and the full or streaming generator."
    sources: ["vllm/entrypoints/openai/chat_completion/api_router.py:41-80"]
    entry: {caller: api-client, interface: openai-serving-chat.post-v1-chat-completions, input: {path: /v1/chat/completions}}
    tags: ["feature:openai-chat"]
  - id: serving-api-completion
    name: OpenAI text completion
    sources: ["vllm/entrypoints/openai/completion/api_router.py:35-72"]
    entry: {caller: api-client, interface: openai-serving-completion.post-v1-completions, input: {path: /v1/completions}}
  - id: serving-api-responses-create
    name: Responses API create
    description: "POST /v1/responses: stored, background or plain responses; writes the in-memory response store."
    tags: [writes]
    sources: ["vllm/entrypoints/openai/responses/api_router.py:48-77"]
    entry: {caller: api-client, interface: openai-serving-responses.post-v1-responses, input: {path: /v1/responses}}
  - id: serving-api-responses-retrieve
    name: Responses API retrieve
    sources: ["vllm/entrypoints/openai/responses/api_router.py:80-107"]
    entry: {caller: api-client, interface: openai-serving-responses.get-v1-responses-response-id, input: {path: /v1/responses/resp_1}}
  - id: serving-api-models-list
    name: List models
    sources: ["vllm/entrypoints/openai/models/api_router.py:20-25"]
    entry: {caller: api-client, interface: openai-serving-models.get-v1-models, input: {path: /v1/models}}
  - id: serving-api-lora-load
    name: Load a LoRA adapter at runtime
    tags: [writes]
    sources: ["vllm/entrypoints/serve/lora/api_router.py:63-74"]
    entry: {caller: api-client, interface: openai-serving-models.post-v1-load-lora-adapter, input: {path: /v1/load_lora_adapter}}
  - id: serving-api-health
    name: Health check
    sources: ["vllm/entrypoints/serve/instrumentator/health.py:22-33"]
    entry: {caller: api-client, interface: instrumentator-health.get-health, input: {path: /health}}
  - id: serving-api-engine-watchdog
    name: Engine watchdog
    description: "watchdog_loop: every 5 s check whether the engine core died and, if so, make uvicorn exit."
    tags: [writes]
    sources: ["vllm/entrypoints/launchers/launcher.py:312-320"]
    entry: {caller: api-server, interface: launcher.watchdog-loop, repeat: {count: 2, interval_ms: 0}}
  - id: serving-api-disconnect-listener
    name: Client disconnect listener
    description: "listen_for_disconnect: receive() until http.disconnect (one pass per received message)."
    tags: [writes]
    sources: ["vllm/entrypoints/serve/utils/api_utils.py:36-48"]
    entry: {caller: api-server, interface: api-utils.listen-for-disconnect, repeat: {count: 3, interval_ms: 1}}
  - id: serving-api-offline-generate
    name: Offline LLM.generate
    sources: ["vllm/entrypoints/llm.py:418-482"]
    entry: {caller: python-user, interface: llm.generate, input: {prompts: [The capital of France is]}}
  - id: serving-api-cli-serve
    name: vllm serve
    description: "`vllm serve`: CLI main -> ServeSubcommand -> run_server; records the supported tasks in the app state and serves HTTP."
    tags: [writes]
    sources: ["vllm/entrypoints/cli/main.py:125-126", "vllm/entrypoints/cli/serve.py:53-161"]
    entry: {caller: operator, interface: cli-main.main, input: {argv: [serve], args: {model_tag: meta-llama/Llama-3.1-8B-Instruct}}}
  - id: serving-api-run-batch
    name: vllm run-batch
    sources: ["vllm/entrypoints/cli/run_batch.py:27-46", "vllm/entrypoints/launchers/run_batch.py:887-901"]
    entry: {caller: operator, interface: run-batch-subcommand.cmd}
  - id: serving-api-anthropic-messages
    name: Anthropic Messages
    sources: ["vllm/entrypoints/anthropic/api_router.py:51-86"]
    entry: {caller: api-client, interface: anthropic-serving-messages.post-v1-messages, input: {path: /v1/messages}}

  - id: serving-api-chat-stream
    name: Streaming chat completion (SSE)
    description: "stream=true: the SSE generator iterates AsyncLLM.generate and yields one chunk per engine output."
    tags: ["feature:streaming"]
    sources: ["vllm/entrypoints/openai/chat_completion/serving.py:466-933"]
    entry: {caller: api-client, interface: openai-serving-chat.post-v1-chat-completions, input: {path: /v1/chat/completions, body: {stream: true, stream_options: {include_usage: true}}}}
  - id: serving-api-tool-calling
    name: Chat with tools and a tool-call parser
    description: "--enable-auto-tool-choice --tool-call-parser llama3_json: adjust_request for required/named choices, tool calls extracted from the output."
    tags: ["feature:tool-calling"]
    sources: ["vllm/tool_parsers/llama_tool_parser.py:76-160", "vllm/renderers/online_renderer.py:825-854"]
    entry: {caller: api-client, interface: openai-serving-chat.post-v1-chat-completions, input: {path: /v1/chat/completions, body: {tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: required}}}
  - id: serving-api-reasoning-outputs
    name: Chat with a reasoning parser
    description: "--reasoning-parser: the full generator splits the output into reasoning and content."
    tags: ["feature:reasoning-outputs"]
    sources: ["vllm/entrypoints/openai/chat_completion/serving.py:997-1010", "vllm/parser/engine/parser_engine.py:516-541"]
    entry: {caller: api-client, interface: openai-serving-chat.post-v1-chat-completions, input: {path: /v1/chat/completions}}
  - id: serving-api-multimodal-chat
    name: Chat with image and prompt-embeds content parts
    tags: ["feature:multimodal-inputs"]
    sources: ["vllm/renderers/chat_utils.py:1043-1110"]
    entry: {caller: api-client, interface: openai-serving-chat.post-v1-chat-completions, input: {path: /v1/chat/completions, body: {messages: [{role: user, content: [{type: image_url, image_url: {url: "data:image/jpeg;base64,/9j/4AAQ"}}, {type: text, text: Describe this image.}]}]}}}
  - id: serving-api-embeddings
    name: Embeddings and scoring
    tags: ["feature:pooling-embeddings"]
    sources: ["vllm/entrypoints/pooling/embed/api_router.py:28-43", "vllm/entrypoints/pooling/scoring/api_router.py:37-49"]
    entry: {caller: api-client, interface: serving-embedding.post-v1-embeddings, input: {path: /v1/embeddings}}

scenarios:
  # ------------------------------------------------------------------ chat
  - id: serving-api-chat-completion-happy
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    expect:
      - "result.ok && result.value.object == 'chat.completion' && result.value.id == 'chatcmpl-req-1'"
      - "result.value.model == 'llama-8b' && result.value.usage.prompt_tokens == 14"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.request_id == 'chatcmpl-req-1' && e.input.sampling_params.max_tokens == 16)"
      - "calls['async-llm.generate'] == 1"
  - id: serving-api-chat-completion-stream
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    input: {body: {stream: true, stream_options: {include_usage: true}}}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'openai-serving-chat.post-v1-chat-completions' && e.error == null)"
      - "result.ok && result.value.value.stream"
      - "result.value.value.events[0].choices[0].delta.role == 'assistant'"
      - "result.value.value.events[size(result.value.value.events) - 1].data == '[DONE]'"
      - "result.value.value.events[size(result.value.value.events) - 2].usage.prompt_tokens == 14"
  - id: serving-api-chat-completion-refusals
    name: Model, template, tool-choice and length refusals happen before the engine
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, as: model, input: {body: {model: gpt-4o}}}
      - {flow: serving-api-chat-completion, as: tmpl, input: {body: {chat_template: "{{ messages }}"}}}
      - {flow: serving-api-chat-completion, as: auto, input: {body: {tool_choice: auto, tools: [{type: function, function: {name: get_weather}}]}}}
      - {flow: serving-api-chat-completion, as: req, input: {body: {tool_choice: required, tools: [{type: function, function: {name: get_weather}}]}}}
    expect:
      - "!steps.model.result.ok && steps.model.result.error.code == 'NotFoundError' && steps.model.result.error.status == 404"
      - "steps.model.result.error.message.contains('Valid aliases: llama-8b')"
      - "!steps.tmpl.result.ok && steps.tmpl.result.error.status == 400 && steps.tmpl.result.error.message.contains('trust-request-chat-template')"
      - "!steps.auto.result.ok && steps.auto.result.error.message.contains('enable-auto-tool-choice')"
      - "!steps.req.result.ok && steps.req.result.error.message.contains('requires --tool-call-parser')"
      - "calls['async-llm.generate'] == 0"
  - id: serving-api-chat-completion-context-limits
    name: Prompt longer than max_model_len is refused; max_tokens is capped by the remaining context
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, as: long, input: {body: {max_tokens: 5}}}
    config: {max-model-len: 10}
    expect:
      - "!steps.long.result.ok && steps.long.result.error.code == 'BadRequestError' && steps.long.result.error.message.contains('maximum context length is 10')"
      - "calls['async-llm.generate'] == 0"
  - id: serving-api-chat-completion-max-tokens-capped
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    config: {max-model-len: 20}
    input: {body: {max_tokens: 15}}
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.max_tokens == 6)"
  - id: serving-api-chat-completion-get-max-tokens-overflow
    name: get_max_tokens raises ValueError when the prompt exceeds max_model_len
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: api-utils.get-max-tokens, caller: api-server, as: g, input: {prompt_len: 200, max_tokens: 16}}
      - {interface: exception-handling.create-error-response, caller: api-server, as: m, input: {code: value-error, status: 0, message: too long}}
    config: {max-model-len: 100}
    expect:
      - "!steps.g.result.ok && steps.g.result.error.code == 'value-error' && steps.g.result.error.message.contains('Input length (200)')"
      - "!steps.m.result.ok && steps.m.result.error.code == 'BadRequestError' && steps.m.result.error.status == 400"
  - id: serving-api-chat-completion-api-key
    name: --api-key guards /v1 routes but not /health
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    config: {api-key: [token-abc123]}
    steps:
      - {flow: serving-api-chat-completion, as: ok}
      - {flow: serving-api-chat-completion, as: bad, input: {headers: {Authorization: Bearer wrong}}}
      - {flow: serving-api-chat-completion, as: none, input: {headers: {Authorization: Basic token-abc123}}}
      - {flow: serving-api-health, as: health}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-chat.post-v1-chat-completions' && e.error != null).size() == 2"
      - "steps.ok.result.ok"
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'unauthorized' && steps.bad.result.error.status == 401"
      - "!steps.none.result.ok && steps.none.result.error.status == 401"
      - "steps.health.result.ok && steps.health.result.value.status_code == 200"
      - "calls['async-llm.generate'] == 1"
  - id: serving-api-chat-completion-engine-dead
    name: A dead engine core gives 500 and makes uvicorn exit
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    state:
      async-mp-client: {engine_dead: true}
    expect:
      - "!result.ok && result.error.code == 'InternalServerError' && result.error.status == 500"
      # internal on purpose: the point is the flag uvicorn's main loop reads (launcher.py:229-234); no route exposes it
      - "state.launcher.server_should_exit == true"
      - "calls['async-llm.generate'] == 0"
  - id: serving-api-chat-completion-engine-dead-keep-alive
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    config: {vllm-keep-alive-on-engine-death: true}
    state:
      async-mp-client: {engine_dead: true}
    expect:
      - "!result.ok && result.error.status == 500"
      # internal on purpose: keep-alive must leave uvicorn's should_exit unset (launcher.py:229-234)
      - "state.launcher.server_should_exit == false"
  - id: serving-api-chat-completion-overloaded
    name: Admission refusals and elastic-EP scaling answer 503
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, as: queue}
      - {interface: scaling-middleware.set-scaling-elastic-ep, caller: api-server, as: set, input: {value: true}}
      - {flow: serving-api-chat-completion, as: scaling}
      - {interface: elastic-ep-router.post-is-scaling-elastic-ep, caller: api-client, as: is, input: {path: /is_scaling_elastic_ep}}
    faults:
      - {target: async-llm.check-admission, type: error, code: queue-overflow-error, calls: [1]}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-chat.post-v1-chat-completions' && e.error != null).size() == 2"
      - "!steps.queue.result.ok && steps.queue.result.error.code == 'Service Unavailable' && steps.queue.result.error.status == 503"
      - "!steps.scaling.result.ok && steps.scaling.result.error.status == 503 && steps.scaling.result.error.message.contains('scaling')"
      - "steps.is.result.value.is_scaling_elastic_ep == true"
      - "calls['async-llm.generate'] == 0"
  - id: serving-api-chat-completion-client-disconnect
    name: The client disconnects mid-generation; the handler is cancelled and the load counter returns to zero
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    config: {enable-server-load-tracking: true}
    faults:
      - {target: async-llm.generate, type: latency, latency_ms: 200}
    steps:
      - {flow: serving-api-chat-completion, as: c, await: false}
      - {cancel: disconnect-chatcmpl-req-1, at_ms: 30}
      - {interface: instrumentator-basic.get-load, caller: api-client, as: load, at_ms: 500, input: {path: /load}}
    expect:
      - "steps.c.result.ok && steps.c.result.value.disconnected == true"
      - "steps.load.result.value.server_load == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.abort') && has(ctx.generate_canceled)"
  - id: serving-api-chat-completion-load-tracking
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    config: {enable-server-load-tracking: true}
    steps:
      - {flow: serving-api-chat-completion, as: c}
      - {flow: serving-api-chat-completion, as: bad, input: {body: {model: nope}}}
      - {interface: instrumentator-basic.get-load, caller: api-client, as: load, input: {path: /load}}
    expect:
      - "steps.c.result.ok && !steps.bad.result.ok"
      - "steps.load.result.value.server_load == 0"
      - "state['server-load-metrics'].counters.server_load_metrics == 0"
  - id: serving-api-chat-generation-error
    name: finish_reason error is a 500 for full responses and an error chunk mid-stream
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.chat-completion-full-generator, caller: api-server, as: full, input: {request_id: chatcmpl-x, model_name: llama-8b, prompt_len: 14, output: {request_id: chatcmpl-x, finished: true, finish_reason: error, num_outputs: 1, token_ids: [1, 2, 3, 4, 5, 6, 7], text: ""}}}
    expect:
      - "!steps.full.result.ok && steps.full.result.error.code == 'generation-error'"
  - id: serving-api-chat-batch
    name: Batch chat runs both conversations concurrently
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat-batch.post-v1-chat-completions-batch, caller: api-client, as: b, input: {path: /v1/chat/completions/batch, body: {max_tokens: 4}}}
    expect:
      - "steps.b.result.ok && size(steps.b.result.value.choices) == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.generate').map(e, e.input.request_id) == ['chatcmpl-req-1_0', 'chatcmpl-req-1_1']"
  # ------------------------------------------------------------------ completion
  - id: serving-api-completion-happy
    flow: serving-api-completion
    fixtures: [full-tp1-llama-8b]
    expect:
      - "result.ok && result.value.object == 'text_completion' && result.value.id == 'cmpl-req-1'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.request_id == 'cmpl-req-1-0')"
  - id: serving-api-completion-two-prompts
    name: Two prompts become two concurrent engine requests
    flow: serving-api-completion
    fixtures: [full-tp1-llama-8b]
    input: {body: {prompt: [The capital of France is, The capital of Chile is], stream: true}}
    expect:
      - "result.ok && result.value.stream && result.value.events[size(result.value.events) - 1].data == '[DONE]'"
      - "[0, 1].all(i, result.value.events.exists(ev, has(ev.choices) && ev.choices[0].index == i && ev.choices[0].finish_reason != null))"
      - "calls['async-llm.generate'] == 2 && trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.request_id == 'cmpl-req-1-1')"
  - id: serving-api-completion-refusals
    flow: serving-api-completion
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-completion, as: suffix, input: {body: {suffix: " Paris"}}}
      - {flow: serving-api-completion, as: echo, input: {body: {suffix: " Paris", echo: true}}}
      - {flow: serving-api-completion, as: beam, input: {body: {stream: true, use_beam_search: true}}}
    expect:
      - "!steps.suffix.result.ok && steps.suffix.result.error.message.contains('FIM')"
      - "!steps.echo.result.ok && steps.echo.result.error.message == 'Echo is unsupported with suffix.'"
      - "!steps.beam.result.ok && steps.beam.result.error.message.contains('beam search')"
      - "calls['async-llm.generate'] == 0"
  - id: serving-api-completion-engine-failure
    name: A failed engine request fails the merged completion with 500
    flow: serving-api-completion
    fixtures: [full-tp1-llama-8b]
    faults: [{target: async-llm.generate, type: error, code: engine-generate-error}]
    expect:
      - "!result.ok && result.error.code == 'InternalServerError' && result.error.status == 500"
  # ------------------------------------------------------------------ responses
  - id: oracle-build-serving-api-3
    name: "tests/entrypoints/openai/responses/test_stateful.py::test_store"
    description: "store defaults to true: the response is retrievable; with store=false it is not found (server started with VLLM_ENABLE_RESPONSES_API_STORE=1)."
    flow: serving-api-responses-create
    fixtures: [full-tp1-llama-8b]
    config: {vllm-enable-responses-api-store: true}
    steps:
      - {flow: serving-api-responses-create, as: r1, input: {body: {input: Hello!}}}
      - {flow: serving-api-responses-retrieve, as: g1, input: {path: "= '/v1/responses/' + steps.r1.result.value.id"}}
      - {flow: serving-api-responses-create, as: r2, input: {body: {input: Hello!, store: false}}}
      - {flow: serving-api-responses-retrieve, as: g2, input: {path: "= '/v1/responses/' + steps.r2.result.value.id"}}
    expect:
      - "steps.r1.result.ok && steps.r1.result.value.status in ['completed', 'incomplete']"
      - "steps.g1.result.ok && steps.g1.result.value.status == steps.r1.result.value.status && steps.g1.result.value.id == steps.r1.result.value.id"
      - "steps.r2.result.ok && steps.r2.result.value.status in ['completed', 'incomplete']"
      - "!steps.g2.result.ok && steps.g2.result.error.status == 404 && steps.g2.result.error.message.matches('Response with id .* not found.')"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-responses.post-v1-responses' && e.error == null).size() == 2"
  - id: serving-api-responses-create-store-disabled
    name: Without the store env var, store=true is dropped and background is refused
    flow: serving-api-responses-create
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-responses-create, as: plain}
      - {flow: serving-api-responses-retrieve, as: get, input: {path: /v1/responses/resp_1}}
      - {flow: serving-api-responses-create, as: bg, input: {body: {background: true}}}
      - {flow: serving-api-responses-create, as: bgnostore, input: {body: {background: true, store: false}}}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-responses.post-v1-responses' && e.error != null).size() == 2"
      - "steps.plain.result.ok && steps.plain.result.value.status in ['completed', 'incomplete']"
      - "!steps.get.result.ok && steps.get.result.error.status == 404"
      - "!steps.bg.result.ok && steps.bg.result.error.code == 'invalid_request_error' && steps.bg.result.error.status == 400"
      - "!steps.bgnostore.result.ok && steps.bgnostore.result.error.message == 'background can only be used when `store` is true'"
  - id: serving-api-responses-create-background
    name: A background response is queued, then completed by its task
    flow: serving-api-responses-create
    fixtures: [full-tp1-llama-8b]
    config: {vllm-enable-responses-api-store: true}
    steps:
      - {flow: serving-api-responses-create, as: b, await: false, input: {body: {background: true}}}
      - {flow: serving-api-responses-retrieve, as: q, at_ms: 20, input: {path: /v1/responses/resp_1}}
      - {flow: serving-api-responses-retrieve, as: g, at_ms: 5000, input: {path: /v1/responses/resp_1}}
      - {interface: openai-serving-responses.post-v1-responses-response-id-cancel, caller: api-client, as: c, input: {path: /v1/responses/resp_1/cancel}}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-responses.post-v1-responses-response-id-cancel' && e.error != null).size() == 1"
      - "steps.b.result.ok && steps.b.result.value.status == 'queued'"
      - "steps.q.result.ok && steps.q.result.value.status == 'queued'"
      - "steps.g.result.ok && steps.g.result.value.status in ['completed', 'incomplete']"
      - "!steps.c.result.ok && steps.c.result.error.message == 'Cannot cancel a synchronous response.'"
  - id: serving-api-responses-create-background-cancel
    name: Cancelling a running background response keeps it cancelled
    flow: serving-api-responses-create
    fixtures: [full-tp1-llama-8b]
    config: {vllm-enable-responses-api-store: true}
    faults: [{target: async-llm.generate, type: latency, latency_ms: 200}]
    steps:
      - {flow: serving-api-responses-create, as: b, await: false, input: {body: {background: true}}}
      - {interface: openai-serving-responses.post-v1-responses-response-id-cancel, caller: api-client, as: c, at_ms: 50, input: {path: /v1/responses/resp_1/cancel}}
      - {flow: serving-api-responses-retrieve, as: g, at_ms: 600, input: {path: /v1/responses/resp_1}}
      - {interface: openai-serving-responses.post-v1-responses-response-id-cancel, caller: api-client, as: missing, input: {path: /v1/responses/resp_9/cancel}}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-responses.post-v1-responses-response-id-cancel' && e.error == null).size() == 1"
      - "steps.c.result.ok && steps.c.result.value.status == 'cancelled'"
      - "steps.g.result.ok && steps.g.result.value.status == 'cancelled'"
      - "!steps.missing.result.ok && steps.missing.result.error.status == 404"
  - id: serving-api-responses-create-previous
