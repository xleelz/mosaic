      - "[steps.c1, steps.c3, steps.c4, steps.c5, steps.c6, steps.c6b].all(s, !s.result.ok)"
      - "calls['llm-engine.set-weight-version'] == 1 && calls['llm-engine.collective-rpc'] == 8"
