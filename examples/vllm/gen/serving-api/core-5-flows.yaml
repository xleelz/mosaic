    flow: serving-api-responses-create
    fixtures: [full-tp1-llama-8b]
    config: {vllm-enable-responses-api-store: true}
    steps:
      - {flow: serving-api-responses-create, as: r1, input: {body: {input: "Hello, my name is John."}}}
      - {flow: serving-api-responses-create, as: r2, input: {body: {input: "What is my name?", previous_response_id: resp_1}}}
      - {flow: serving-api-responses-create, as: bad, input: {body: {previous_response_id: resp_99}}}
      - {flow: serving-api-responses-create, as: both, input: {body: {previous_response_id: resp_1, previous_input_messages: [{role: user, content: hi}]}}}
    expect:
      - "steps.r1.result.ok && steps.r2.result.ok"
      # internal on purpose: previous_response_id is replayed into the renderer (serving.py); the response text alone can't show it
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'online-renderer.render-responses' && e.input.previous_messages != null && size(e.input.previous_messages) == 1 && e.input.previous_output_text != null)"
      - "!steps.bad.result.ok && steps.bad.result.error.status == 404"
      - "!steps.both.result.ok && steps.both.result.error.status == 400 && steps.both.result.error.message.contains('Only one of')"
