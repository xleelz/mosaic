    name: ServeSubcommand mode selection and its refusals
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: serve-subcommand.cmd, caller: operator, as: grpc, input: {grpc: true}}
      - {interface: serve-subcommand.cmd, caller: operator, as: headless, input: {headless: true}}
      - {interface: serve-subcommand.cmd, caller: operator, as: hcount, input: {headless: true, api_server_count: 2}}
      - {interface: serve-subcommand.cmd, caller: operator, as: lb, input: {data_parallel_external_lb: true, data_parallel_hybrid_lb: true}}
      - {interface: serve-subcommand.cmd, caller: operator, as: mport, input: {data_parallel_multi_port_external_lb: true}}
