  # ------------------------------------------------------------------ offline LLM
  - id: serving-api-offline-generate-happy
    flow: serving-api-offline-generate
    fixtures: [full-tp1-llama-8b]
    # LLM drives a SyncMPClient: engine-core outputs go to its outputs_queue (engine-core-proc client_kind sync)
    state:
      engine-core-proc: {client_kind: sync}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'llm.generate' && e.error == null).size() == 1"
      - "result.ok && size(result.value) == 1 && result.value[0].finished"
      - "calls['llm-engine.add-request'] == 1 && calls['llm-engine.step'] >= 1"
      - "result.value[0].request_id == '0'"
  - id: serving-api-offline-generate-batch
    name: Two prompts get request ids 0 and 1; a render failure aborts what was already added
    flow: serving-api-offline-generate
    fixtures: [full-tp1-llama-8b]
    # LLM drives a SyncMPClient: engine-core outputs go to its outputs_queue (engine-core-proc client_kind sync)
    state:
      engine-core-proc: {client_kind: sync}
    steps:
      - {flow: serving-api-offline-generate, as: two, input: {prompts: [The capital of France is, The capital of Chile is]}}
      - {interface: llm.generate, caller: python-user, as: dflt, input: {prompts: [Hi]}}
      - {interface: llm.generate, caller: python-user, as: mismatch, input: {prompts: [a, b], sampling_params: [{max_tokens: 1}]}}
    expect:
      - "steps.two.result.ok && size(steps.two.result.value) == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'llm-engine.add-request').map(e, e.input.request_id).slice(0, 2) == ['0', '1']"
      - "steps.dflt.result.ok && steps.dflt.result.value[0].request_id == '2'"
      - "!steps.mismatch.result.ok && steps.mismatch.result.error.code == 'vllm-validation-error'"
  - id: serving-api-offline-generate-render-failure
    flow: serving-api-offline-generate
    fixtures: [full-tp1-llama-8b]
    # LLM drives a SyncMPClient: engine-core outputs go to its outputs_queue (engine-core-proc client_kind sync)
    state:
      engine-core-proc: {client_kind: sync}
    config: {max-model-len: 4}
    input: {prompts: [one two, one two three four five]}
    expect:
      - "!result.ok && result.error.code == 'BadRequestError'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'llm-engine.abort-request' && e.input.request_ids == ['0'])"
