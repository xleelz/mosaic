  - id: serving-api-embeddings-and-score
    name: An embedding model answers /v1/embeddings and /score (bi-encoder, one encode per text, one score per pair)
    flow: serving-api-embeddings
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed]}
      async-llm: {supported_tasks: [embed]}
    steps:
      - {flow: serving-api-embeddings, as: emb}
      - {interface: serving-scores.post-score, caller: api-client, as: score, input: {path: /score, body: {queries: "What is the capital of France?", documents: [The capital of France is Paris., Paris is in France.]}}}
      - {interface: serving-scores.post-v1-rerank, caller: api-client, as: bad, input: {path: /v1/rerank, body: {queries: [a, b], documents: [c, d, e]}}}
    expect:
      - "steps.emb.result.ok && size(steps.emb.result.value.data) == 1"
      - "steps.score.result.ok && size(steps.score.result.value.data) == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.encode' && e.input.pooling_params.task == 'embed').size() == 4"
      - "!steps.bad.result.ok && steps.bad.result.error.status == 400"
