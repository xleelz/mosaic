      - "!steps.missing.result.ok && steps.missing.result.error.status == 400"
      - "steps.other.result.ok && ['sql-lora', 'other-lora'].all(n, steps.list.result.value.data.exists(m, m.id == n)) && !steps.list.result.value.data.exists(m, m.id == 'ghost-lora')"
