  # ------------------------------------------------------------------ parsers (in-build oracle)
  - id: oracle-build-serving-api-1
    name: "tests/parser/engine/test_deepseek_v4.py::TestArgConverter::test_string_param"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: deepseek-v4-parser.dsml-arg-converter, caller: api-server, as: r, input: {raw_args: "\n<｜DSML｜parameter name=\"city\" string=\"true\">杭州</｜DSML｜parameter>\n", partial: false}}
    expect:
      - "steps.r.result.ok && steps.r.result.value.arguments == {'city': '杭州'}"
  - id: serving-api-dsml-arg-types
    name: DSML non-string parameters are JSON-decoded, with a literal fallback; an unclosed tail needs partial
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: deepseek-v4-parser.dsml-arg-converter, caller: api-server, as: mixed, input: {raw_args: "\n<｜DSML｜parameter name=\"location\" string=\"true\">Tokyo</｜DSML｜parameter>\n<｜DSML｜parameter name=\"limit\" string=\"false\">10</｜DSML｜parameter>\n<｜DSML｜parameter name=\"active\" string=\"false\">false</｜DSML｜parameter>\n<｜DSML｜parameter name=\"items\" string=\"false\">[\"a\", \"b\"]</｜DSML｜parameter>\n", partial: false}}
      - {interface: deepseek-v4-parser.dsml-arg-converter, caller: api-server, as: bare, input: {raw_args: "<｜DSML｜parameter name=\"name\">alpha</｜DSML｜parameter><｜DSML｜parameter name=\"count\">7</｜DSML｜parameter>", partial: false}}
      - {interface: deepseek-v4-parser.dsml-arg-converter, caller: api-server, as: tail, input: {raw_args: "<｜DSML｜parameter name=\"a\" string=\"true\">x</｜DSML｜parameter><｜DSML｜parameter name=\"b\" string=\"true\">y", partial: false}}
      - {interface: deepseek-v4-parser.dsml-arg-converter, caller: api-server, as: ptail, input: {raw_args: "<｜DSML｜parameter name=\"a\" string=\"true\">x</｜DSML｜parameter><｜DSML｜parameter name=\"b\" string=\"true\">y", partial: true}}
      - {interface: deepseek-v4-parser.dsml-arg-converter, caller: api-server, as: junk, input: {raw_args: "<｜DSML｜parameter oops", partial: false}}
    expect:
      - "steps.mixed.result.value.arguments == {'location': 'Tokyo', 'limit': 10, 'active': false, 'items': ['a', 'b']}"
      - "steps.bare.result.value.arguments == {'name': 'alpha', 'count': 7}"
      - "steps.tail.result.value.arguments == {'a': 'x'} && steps.ptail.result.value.arguments == {'a': 'x', 'b': 'y'}"
      - "steps.junk.result.value.arguments == {}"
  - id: oracle-build-serving-api-2
    name: "tests/reasoning/test_glm4_moe_reasoning_parser.py::test_reasoning (non-streaming cases)"
    description: "glm45 resolves to the GLM-4.7 parser; each case checks reasoning, content and is_reasoning_end."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: reasoning-parser-manager.get-reasoning-parser, caller: api-server, as: cls, input: {name: glm45}}
      - {interface: glm47-moe-parser.extract-reasoning, caller: api-server, as: with_think, input: {model_output: "<think>This is a reasoning section</think>This is the rest"}}
      - {interface: glm47-moe-parser.is-reasoning-end, caller: api-server, as: with_think_end, input: {text: "<think>This is a reasoning section</think>This is the rest"}}
      - {interface: glm47-moe-parser.extract-reasoning, caller: api-server, as: without_think, input: {model_output: This is the rest}}
      - {interface: glm47-moe-parser.is-reasoning-end, caller: api-server, as: without_think_end, input: {text: This is the rest}}
      - {interface: glm47-moe-parser.extract-reasoning, caller: api-server, as: without_open, input: {model_output: "This is a reasoning section</think>This is the rest"}}
      - {interface: glm47-moe-parser.is-reasoning-end, caller: api-server, as: without_open_end, input: {text: "This is a reasoning section</think>This is the rest"}}
      - {interface: glm47-moe-parser.extract-reasoning, caller: api-server, as: complete, input: {model_output: "<think>This is a reasoning section</think>"}}
      - {interface: glm47-moe-parser.is-reasoning-end, caller: api-server, as: complete_end, input: {text: "<think>This is a reasoning section</think>"}}
      - {interface: glm47-moe-parser.extract-reasoning, caller: api-server, as: multiline, input: {model_output: "<think>This is a reasoning\nsection</think>This is the rest\nThat"}}
      - {interface: glm47-moe-parser.extract-reasoning, caller: api-server, as: only_open, input: {model_output: "<think>This is a reasoning section"}}
      - {interface: glm47-moe-parser.is-reasoning-end, caller: api-server, as: only_open_end, input: {text: "<think>This is a reasoning section"}}
    expect:
      - "steps.cls.result.value.parser_class == 'Glm47MoeParserReasoningAdapter'"
      - "steps.with_think.result.value.reasoning == 'This is a reasoning section' && steps.with_think.result.value.content == 'This is the rest' && steps.with_think_end.result.value.is_reasoning_end"
      - "steps.without_think.result.value.reasoning == 'This is the rest' && steps.without_think.result.value.content == null && !steps.without_think_end.result.value.is_reasoning_end"
      - "steps.without_open.result.value.reasoning == 'This is a reasoning section' && steps.without_open.result.value.content == 'This is the rest' && steps.without_open_end.result.value.is_reasoning_end"
      - "steps.complete.result.value.reasoning == 'This is a reasoning section' && steps.complete.result.value.content == null && steps.complete_end.result.value.is_reasoning_end"
      - "steps.multiline.result.value.reasoning == 'This is a reasoning\\nsection' && steps.multiline.result.value.content == 'This is the rest\\nThat'"
      - "steps.only_open.result.value.reasoning == 'This is a reasoning section' && steps.only_open.result.value.content == null && !steps.only_open_end.result.value.is_reasoning_end"
