    expect:
      - "!steps.nobody.result.ok && steps.nobody.result.error.message == 'Request body must be a JSON object'"
      - "!steps.noscale.result.ok && steps.noscale.result.error.status == 404"
      - "!steps.noscore.result.ok && steps.noscore.result.error.message == 'This model does not support the Scoring API.'"
      - "calls['async-llm.abort'] == 0"
  - id: serving-api-engine-start-failure
    name: The engine client fails to start; the server never serves
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    faults: [{target: async-llm.from-vllm-config, type: error, code: engine-dead-error, status: 500}]
    expect:
      - "!result.ok && result.error.code == 'engine-dead-error'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'launcher.serve-http')"
  - id: serving-api-responses-create-background-failed
    name: "A background task cancelled by something other than cancel_responses is marked failed; an engine exception leaves it queued"
    flow: serving-api-responses-create
    fixtures: [full-tp1-llama-8b]
    config: {vllm-enable-responses-api-store: true}
    faults:
      - {target: async-llm.generate, type: latency, latency_ms: 200, calls: [1]}
      - {target: async-llm.generate, type: error, code: engine-generate-error, calls: [2]}
    steps:
      - {flow: serving-api-responses-create, as: b, await: false, input: {body: {background: true}}}
      - {cancel: bg-resp_1, at_ms: 50}
      - {flow: serving-api-responses-retrieve, as: g, at_ms: 600, input: {path: /v1/responses/resp_1}}
      - {flow: serving-api-responses-create, as: b2, input: {body: {background: true}}}
      - {flow: serving-api-responses-retrieve, as: g2, input: {path: /v1/responses/resp_2}}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-responses.post-v1-responses' && e.error == null).size() == 2"
      - "steps.b.result.value.status == 'queued' && steps.g.result.value.status == 'failed'"
      - "steps.g2.result.value.status == 'queued'"
  # ------------------------------------------------------------------ fix round: sampling params, features
  - id: serving-api-chat-completion-sampling-params
    name: The chat route passes every sampling param to the engine; a missing temperature takes the generation config
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: serving-api-chat-completion, as: dflt}
      - {flow: serving-api-chat-completion, as: greedy, input: {body: {temperature: 0.0, top_p: 0.5, top_k: 5}}}
      - {flow: serving-api-chat-completion, as: full, input: {body: {temperature: 0.2, top_p: 0.5, top_k: 20, seed: 7, stop: [" t"], include_stop_str_in_output: true, ignore_eos: true, stop_token_ids: [128009], response_format: {type: json_object}}}}
    expect:
      - "steps.dflt.result.ok && steps.full.result.ok"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.generate')[0].input.sampling_params.temperature == 0.6 && trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.generate')[0].input.sampling_params.top_p == 0.9"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.generate')[0].input.sampling_params.output_kind == 'FINAL_ONLY'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.temperature == 0.0 && e.input.sampling_params.top_p == 1.0 && e.input.sampling_params.top_k == 0)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.stop == [' t'] && e.input.sampling_params.seed == 7 && e.input.sampling_params.top_k == 20 && e.input.sampling_params.include_stop_str_in_output && e.input.sampling_params.ignore_eos && e.input.sampling_params.structured_outputs.json_object == true && e.input.sampling_params.stop_token_ids == [128009])"
  - id: serving-api-chat-stream-per-step
    name: The SSE generator starts before generation ends and yields one chunk per engine output
    flow: serving-api-chat-stream
    fixtures: [full-tp1-llama-8b]
    expect:
      # stream=true: each SSE frame reached the client as an item, the same frames as the events list
      - "result.value.items == result.value.value.events"
      - "result.ok && result.value.value.stream && result.value.value.events[0].choices[0].delta.role == 'assistant'"
      - "result.value.value.events[size(result.value.value.events) - 1].data == '[DONE]'"
      - "result.value.value.events[size(result.value.value.events) - 2].usage.prompt_tokens == 14"
      - "result.value.value.events.exists(ev, has(ev.choices) && size(ev.choices) > 0 && ev.choices[0].finish_reason != null)"
      # internal on purpose: the SSE generator starts before generate's first output (streaming per engine step)
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'openai-serving-chat.chat-completion-stream-generator')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.generate')[0].seq"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.output_kind == 'DELTA')"
  - id: serving-api-chat-stream-engine-error
    name: An engine failure after the 200 becomes a data chunk followed by [DONE]
    flow: serving-api-chat-stream
    fixtures: [full-tp1-llama-8b]
    faults: [{target: async-llm.generate, type: error, code: engine-generate-error}]
    expect:
      - "result.ok && result.value.value.events[size(result.value.value.events) - 2].error.code == 500"
      - "result.value.value.events[size(result.value.value.events) - 1].data == '[DONE]'"
  - id: serving-api-tool-calling-required
    name: tool_choice required makes the llama3_json parser force a JSON schema; tool calls are parsed from JSON output
    flow: serving-api-tool-calling
    fixtures: [full-tp1-llama-8b]
    config: {tool-call-parser: llama3_json, enable-auto-tool-choice: true}
    steps:
      - {flow: serving-api-tool-calling, as: chat}
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, as: tc, input: {model_output: "<|python_tag|>{\"name\": \"get_weather\", \"parameters\": {\"city\": \"Paris\"}}"}}
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, as: plain, input: {model_output: The weather is fine.}}
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, as: nokey, input: {model_output: "{\"city\": \"Paris\"}"}}
      - {interface: llama3-json-tool-parser.adjust-request, caller: api-server, as: named, input: {body: {tools: [{type: function, function: {name: get_weather, parameters: {type: object}}}], tool_choice: {type: function, function: {name: get_weather}}}}}
      - {interface: llama3-json-tool-parser.adjust-request, caller: api-server, as: badname, input: {body: {tools: [{type: function, function: {name: get_weather, parameters: {type: object}}}], tool_choice: {type: function, function: {name: nope}}}}}
      - {interface: llama3-json-tool-parser.adjust-request, caller: api-server, as: tagged, input: {body: {tools: [{type: function, function: {name: get_weather}}], tool_choice: required, structured_outputs: {structural_tag: "{}"}}}}
      - {interface: llama3-json-tool-parser.adjust-request, caller: api-server, as: notools, input: {body: {tool_choice: required}}}
    expect:
      - "steps.chat.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.structured_outputs.json.type == 'array')"
      - "steps.tc.result.value.tools_called && steps.tc.result.value.tool_calls[0].function.name == 'get_weather' && steps.tc.result.value.tool_calls[0].function.arguments.city == 'Paris'"
      - "!steps.plain.result.value.tools_called && !steps.nokey.result.value.tools_called"
      - "steps.named.result.value.structured_outputs.json.type == 'object' && !steps.badname.result.ok"
      - "steps.tagged.result.value.structured_outputs.structural_tag == '{}' && !has(steps.notools.result.value.structured_outputs)"
  - id: serving-api-tool-calling-auto-extracts
    name: With auto tool choice the full generator runs the tool parser on the output
    flow: serving-api-tool-calling
    fixtures: [full-tp1-llama-8b]
    config: {tool-call-parser: llama3_json, enable-auto-tool-choice: true}
    input: {body: {tool_choice: auto}}
    expect:
      - "result.ok && result.value.choices[0].finish_reason != 'tool_calls'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'llama3-json-tool-parser.extract-tool-calls')"
  - id: serving-api-reasoning-outputs-split
    name: With --reasoning-parser glm45 the chat response carries the reasoning separately
    flow: serving-api-reasoning-outputs
    fixtures: [full-tp1-llama-8b]
