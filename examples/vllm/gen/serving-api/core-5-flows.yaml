      - {interface: exception-handling.create-error-response, caller: api-server, as: retry, input: {code: retryable-request-error, status: 0, message: KV load failed}}
      - {interface: exception-handling.create-error-response, caller: api-server, as: ni, input: {code: not-implemented-error, status: 0, message: not supported}}
