  - id: serving-api-edge-branches
    name: Error mapping, vocabulary and gate branches exercised directly
    fixtures: [full-tp1-llama-8b]
    config: {api-key: [token-abc123]}
    steps:
      - {interface: authentication-middleware.call, caller: api-client, as: unguarded, input: {path: /health, method: GET, headers: {}}}
      - {interface: base-renderer.tokenize-prompt, caller: api-server, as: oov, input: {prompt_token_ids: [128000, -1]}}
