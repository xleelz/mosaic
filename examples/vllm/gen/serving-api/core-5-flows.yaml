  - id: serving-api-offline-chat-and-queue
    name: LLM.chat, enqueue / enqueue_chat then wait_for_completion
    fixtures: [full-tp1-llama-8b]
    # LLM drives a SyncMPClient: engine-core outputs go to its outputs_queue (engine-core-proc client_kind sync)
    state:
      engine-core-proc: {client_kind: sync}
    steps:
      - {interface: llm.chat, caller: python-user, as: chat, input: {messages: [{role: user, content: "What is the capital of France?"}]}}
      - {interface: llm.enqueue, caller: python-user, as: q1, input: {prompts: [Hello]}}
      - {interface: llm.enqueue-chat, caller: python-user, as: q2, input: {messages: [{role: user, content: Hello}]}}
      - {interface: llm.wait-for-completion, caller: python-user, as: wait, input: {num_requests: 2}}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'llm.wait-for-completion' && e.error == null)"
      - "steps.chat.result.ok && steps.q1.result.value == ['1'] && steps.q2.result.value == ['2']"
