interfaces:
  - component: model-config
    name: get-diff-sampling-param
    kind: function
    summary: "ModelConfig.get_diff_sampling_param: sampling defaults from the model's generation_config.json (owned by config-platform)."
    sources: ["vllm/config/model.py:154"]
    attributes: {boundary: true, owner: config-platform}
    request: {type: object, properties: {}}
    response: {type: object, properties: {temperature: {type: number, examples: [0.6]}, top_p: {type: number, examples: [0.9]}}}
  # ------------------------------------------------------------------ LLM entry methods
  - component: llm
    name: get-default-sampling-params
    kind: function
    summary: "LLM.get_default_sampling_params: cache the model's generation-config defaults; SamplingParams() when it has none."
    sources: ["vllm/entrypoints/llm.py:411-416"]
    request: {type: object, properties: {}}
    behavior:
      - if: "state.default_sampling_params == null"
        then:
          - call: model-config.get-diff-sampling-param
            as: d
          - set: {state.default_sampling_params: "= state.default_sampling_params == null ? vars.d.value : state.default_sampling_params"}
      - if: "size(state.default_sampling_params) > 0"
        then: [{source: "vllm/entrypoints/llm.py:414-415", return: "= merge({'max_tokens': 16}, state.default_sampling_params)"}]
      - return: {max_tokens: 16, temperature: 1.0, top_p: 1.0}
  - component: llm
    name: generate
    kind: function
    summary: "LLM.generate: generative runners only; default sampling params; render and add every prompt, then step the engine until all finish."
    sources: ["vllm/entrypoints/llm.py:418-482"]
    request: {type: object, properties: {prompts: {type: [string, object, array], items: {type: [string, object, array, integer]}, default: [The capital of France is]}, sampling_params: {type: [object, array, "null"], default: null}}, required: [prompts]}
    errors: [{code: value-error, status: 0}, {code: vllm-validation-error, status: 0}]
    behavior:
      - if: "config['runner'] == 'pooling'"
        then: [{title: Not a generative model, source: "vllm/entrypoints/llm.py:459-465", fail: {code: value-error, message: "LLM.generate() is only supported for generative models. Try passing `--runner generate` to use the model as a generative model."}}]
      - if: "!has(input.sampling_params) || input.sampling_params == null"
        then:
          - call: llm.get-default-sampling-params
            as: dp
          - set: {vars.params: "= vars.dp.value"}
        else:
          - set: {vars.params: "= input.sampling_params"}
      - call: llm.add-completion-requests
        input: {prompts: "= input.prompts", params: "= vars.params"}
        as: added
      - source: "vllm/entrypoints/common/offline.py:362"
        call: llm.run-engine
        input: {num_requests: "= size(vars.added.value.request_ids)"}
        as: out
      - return: "= vars.out.value"
  - component: llm
    name: chat
    kind: function
    summary: "LLM.chat: chat-template each conversation, add it, and step the engine until all finish."
    sources: ["vllm/entrypoints/llm.py:617-717"]
    request: {type: object, properties: {messages: {type: array, minItems: 1, description: "one conversation (a list of messages) or a list of conversations", items: {type: [object, array], properties: {role: {type: string, examples: [user]}, content: {type: string, examples: ["What is the capital of France?"]}}}, default: [{role: user, content: "What is the capital of France?"}]}}, required: [messages]}
    errors: [{code: value-error, status: 0}]
    behavior:
      - if: "config['runner'] == 'pooling'"
        then: [{title: Not a generative model, source: "vllm/entrypoints/llm.py:692-698", fail: {code: value-error, message: "LLM.chat() is only supported for generative models. Try passing `--runner generate` to use the model as a generative model."}}]
      - call: llm.get-default-sampling-params
        as: dp
      - title: "conversation_to_seq: a list of message dicts is one conversation; otherwise each element is a conversation (one request and one output each)"
        source: "vllm/renderers/inputs/preprocess.py:57-66"
        set:
          vars.convs: "= size(input.messages) > 0 && input.messages.all(m, type(m) == map) ? [input.messages] : input.messages"
      - source: "vllm/entrypoints/common/offline.py:423-424"
        call: llm.add-chat-requests
        input: {conversations: "= vars.convs", params: "= vars.dp.value"}
        as: added
      - call: llm.run-engine
        input: {num_requests: "= size(vars.added.value.request_ids)"}
        as: out
      - return: "= vars.out.value"
  - component: llm
    name: enqueue
    kind: function
    summary: "LLM.enqueue: add requests without running the engine; returns their ids."
    sources: ["vllm/entrypoints/llm.py:484-532"]
    request: {type: object, properties: {prompts: {type: [string, object, array], items: {type: [string, object, array, integer]}, default: [The capital of France is]}}, required: [prompts]}
    errors: [{code: value-error, status: 0}]
    behavior:
      - if: "config['runner'] == 'pooling'"
        then: [{source: "vllm/entrypoints/llm.py:517-519", fail: {code: value-error, message: LLM.enqueue() is only supported for generative models.}}]
      - call: llm.get-default-sampling-params
        as: dp
      - call: llm.add-completion-requests
        input: {prompts: "= input.prompts", params: "= vars.dp.value"}
        as: added
      - return: "= vars.added.value.request_ids"
  - component: llm
    name: enqueue-chat
    kind: function
    summary: "LLM.enqueue_chat: add chat requests without running the engine."
    sources: ["vllm/entrypoints/llm.py:719-799"]
    request: {type: object, properties: {messages: {type: array, minItems: 1, description: "one conversation (a list of messages) or a list of conversations", items: {type: [object, array], properties: {role: {type: string, examples: [user]}, content: {type: string, examples: [Hello]}}}, default: [{role: user, content: Hello}]}}, required: [messages]}
    errors: [{code: value-error, status: 0}]
    behavior:
      - if: "config['runner'] == 'pooling'"
        then: [{source: "vllm/entrypoints/llm.py:719-799", fail: {code: value-error, message: LLM.enqueue_chat() is only supported for generative models.}}]
      - call: llm.get-default-sampling-params
        as: dp
      - title: "conversation_to_seq: one conversation or a list of them"
        source: "vllm/renderers/inputs/preprocess.py:57-66"
        call: llm.add-chat-requests
        input: {conversations: "= size(input.messages) > 0 && input.messages.all(m, type(m) == map) ? [input.messages] : input.messages", params: "= vars.dp.value"}
        as: added
      - return: "= vars.added.value.request_ids"
  - component: llm
    name: wait-for-completion
    kind: function
    summary: "LLM.wait_for_completion: run the engine over whatever is queued."
    sources: ["vllm/entrypoints/llm.py:549-572"]
    request: {type: object, properties: {num_requests: {type: integer, examples: [1]}}}
    behavior:
      - call: llm.run-engine
        input: {num_requests: "= has(input.num_requests) ? input.num_requests : 1"}
        as: out
      - return: "= vars.out.value"
  - component: llm
    name: embed
    kind: function
    summary: "LLM.embed: encode(pooling_task='embed') wrapped as EmbeddingRequestOutput."
    sources: ["vllm/entrypoints/pooling/offline.py:197-239"]
    request: {type: object, properties: {prompts: {type: array, items: {type: string}, default: [hello world]}}, required: [prompts]}
    behavior:
      - call: llm.encode
        input: {prompts: "= input.prompts", pooling_task: embed}
        as: e
      - return: "= vars.e.value"
  - component: llm
    name: classify
    kind: function
    summary: "LLM.classify: encode(pooling_task='classify')."
    sources: ["vllm/entrypoints/pooling/offline.py:241-283"]
    request: {type: object, properties: {prompts: {type: array, items: {type: string}, default: [hello world]}}, required: [prompts]}
    behavior:
      - call: llm.encode
        input: {prompts: "= input.prompts", pooling_task: classify}
        as: e
      - return: "= vars.e.value"
  - component: llm
    name: score
    kind: function
    summary: "LLM.score: pooling runners only; the model's score type picks the IO processor; then the pairs are run."
    sources: ["vllm/entrypoints/pooling/offline.py:285-394"]
    request: {type: object, properties: {data_1: {type: string, examples: ["What is the capital of France?"]}, data_2: {type: array, minItems: 1, maxItems: 1, items: {type: string, examples: [Paris is the capital of France.]}}}, required: [data_1, data_2]}
    errors: [{code: value-error, status: 0}]
    behavior:
      - if: "config['runner'] != 'pooling'"
        then: [{source: "vllm/entrypoints/pooling/offline.py:334-339", fail: {code: value-error, message: "LLM.score() is only supported for pooling models. Try passing `--runner pooling` to use the model as a pooling model."}}]
      - if: "!('score' in state.supported_tasks) && !('embed' in state.supported_tasks) && !('classify' in state.supported_tasks)"
        then: [{source: "vllm/entrypoints/pooling/offline.py:346-347", fail: {code: value-error, message: This model does not support the Scoring API.}}]
      - title: "The scoring IO processor builds the requests; they run through _run_tiling_engine"
        source: "vllm/entrypoints/pooling/offline.py:370-394"
        call: llm.run-tiling-engine
        input: {prompts: "= [input.data_1] + input.data_2", pooling_task: "= 'embed' in state.supported_tasks ? 'embed' : 'classify'"}
        as: out
      - return: {num_scores: "= size(input.data_2)", num_outputs: "= size(vars.out.value)"}
  # ------------------------------------------------------------------ offline mixin
  - component: llm
    name: add-completion-requests
    kind: function
    summary: "_add_completion_requests: per-prompt params must match the prompt count; render each prompt and add it (FINAL_ONLY); abort the added ones if one fails."
    sources: ["vllm/entrypoints/common/offline.py:304-338", "vllm/entrypoints/common/offline.py:539-586"]
    request: {type: object, properties: {prompts: {type: [string, object, array], items: {type: [string, object, array, integer]}}, params: {}}, required: [prompts]}
    errors: [{code: vllm-validation-error, status: 0}, {code: type-error, status: 0}]
    behavior:
      - title: "prompt_to_seq: a string, a dict or a non-empty list of ints is one prompt; any other list (including [] and [[]]) is the sequence itself"
        source: "vllm/entrypoints/common/offline.py:317"
        set:
          vars.prompts: "= type(input.prompts) == string || type(input.prompts) == map || (type(input.prompts) == list && size(input.prompts) > 0 && input.prompts.all(x, type(x) == int)) ? [input.prompts] : input.prompts"
      - if: "type(input.params) == list && size(input.params) != size(vars.prompts)"
        then: [{title: _params_to_seq length check, source: "vllm/entrypoints/common/offline.py:258-263", fail: {code: vllm-validation-error, message: "= 'The lengths of prompts (' + string(size(vars.prompts)) + ') and params (' + string(size(input.params)) + ') must be the same.'"}}]
      - set: {vars.ids: []}
      - title: Render one prompt, add it, then the next (engine work can start on the first)
        source: "vllm/entrypoints/common/offline.py:552-561"
        foreach: "= vars.prompts"
        as: p
        index: i
        steps:
          - title: "parse_dec_only_prompt: a list must hold only ints (a TokensPrompt); other types are a TypeError"
            source: "vllm/renderers/inputs/preprocess.py:129-155"
            if: "(type(vars.p) == list && !vars.p.all(x, type(x) == int)) || !(type(vars.p) in [string, list, map])"
            then: [{fail: {code: type-error, message: "= type(vars.p) == list ? 'Token prompt should be a list of integers' : 'Prompt should be a string, list of tokens, or dictionary'"}}]
          - title: "A TokensPrompt (a list of ids, or {prompt_token_ids}) skips tokenization; a text prompt is tokenized"
            source: "vllm/inputs/llm.py:111-127"
            call: base-renderer.tokenize-prompt
            input: "= type(vars.p) == list ? {'prompt_token_ids': vars.p} : (type(vars.p) == map && 'prompt_token_ids' in vars.p ? {'prompt_token_ids': vars.p.prompt_token_ids} : {'prompt': type(vars.p) == map ? vars.p.prompt : vars.p})"
            as: tok
            on_error:
              - when: "size(vars.ids) > 0"
                title: Abort the requests already added, then re-raise
                source: "vllm/entrypoints/common/offline.py:562-564"
                call: llm-engine.abort-request
                input: {request_ids: "= vars.ids", internal: true}
              - fail: "= error"
          - title: "request_id = next(request_counter); SamplingParams.output_kind = FINAL_ONLY; a dict prompt's multi_modal_data rides on the engine input"
            source: "vllm/entrypoints/common/offline.py:574-586"
            call: llm-engine.add-request
            input: "= merge({'request_id': string(state.request_counter), 'prompt_token_ids': vars.tok.value.prompt_token_ids, 'sampling_params': merge(type(input.params) == list ? input.params[vars.i] : input.params, {'output_kind': 'FINAL_ONLY'})}, type(vars.p) == map && 'multi_modal_data' in vars.p && vars.p.multi_modal_data != null ? {'multi_modal_data': vars.p.multi_modal_data} : {})"
          - set:
              vars.ids: "= vars.ids + [string(state.request_counter)]"
              state.request_counter: "= state.request_counter + 1"
      - return: {request_ids: "= vars.ids"}
  - component: llm
    name: add-chat-requests
    kind: function
    summary: "_add_chat_requests: chat-template each conversation, then add it like a completion prompt."
    sources: ["vllm/entrypoints/common/offline.py:403-461"]
    request: {type: object, properties: {conversations: {type: array, items: {type: array}}, params: {}}, required: [conversations]}
    behavior:
      - set: {vars.ids: []}
      - foreach: "= input.conversations"
        as: conv
        max: 16
        steps:
          - call: hf-renderer.render-messages
            input: {messages: "= vars.conv"}
            as: r
          - call: base-renderer.tokenize-prompt
            input: {prompt_token_ids: "= vars.r.value.prompt_token_ids"}
            as: tok
          - call: llm-engine.add-request
            input: {request_id: "= string(state.request_counter)", prompt_token_ids: "= vars.tok.value.prompt_token_ids", sampling_params: "= input.params"}
          - set:
              vars.ids: "= vars.ids + [string(state.request_counter)]"
              state.request_counter: "= state.request_counter + 1"
      - return: {request_ids: "= vars.ids"}
  - component: llm
    name: run-engine
    kind: function
    summary: "_run_engine: while the engine has unfinished requests, step it and keep the finished outputs; return them sorted by request id."
    sources: ["vllm/entrypoints/common/offline.py:589-642"]
    request: {type: object, properties: {num_requests: {type: integer, examples: [1]}}}
    behavior:
      - set: {vars.outputs: []}
      - title: "while has_unfinished_requests(): step(). With FINAL_ONLY each request yields exactly one finished output, so the loop also ends once every added request has one"
        source: "vllm/entrypoints/common/offline.py:610-616"
        foreach: "= lists.range(256)"
        as: step_no
        max: 256
        steps:
          - call: llm-engine.has-unfinished-requests
            as: hu
          - if: "!vars.hu.value || size(vars.outputs) >= input.num_requests"
            then: [{break: true}]
          - call: llm-engine.step
            as: st
          - set: {vars.outputs: "= vars.outputs + vars.st.value.request_outputs.filter(o, o.finished)"}
      - title: Sorted by request id (requests can finish out of order)
        source: "vllm/entrypoints/common/offline.py:638-642"
        return: "= vars.outputs.sortBy(o, int(o.request_id))"
  # ------------------------------------------------------------------ parsers
  - component: reasoning-parser-manager
    name: get-reasoning-parser
    kind: function
    summary: "ReasoningParserManager.get_reasoning_parser(name): an eager or lazily imported parser class, or KeyError."
    sources: ["vllm/reasoning/abs_reasoning_parsers.py:230-249"]
    attributes: {racy_in_code: "check-then-import-then-store with no lock: two first lookups of one lazy name both import the module and both store the class in reasoning_parsers (vllm/reasoning/abs_reasoning_parsers.py:257-268); the class is the same, so the race is benign"}
    request: {type: object, properties: {name: {type: string, examples: [glm45]}}, required: [name]}
    errors: [{code: key-error, status: 0}]
    behavior:
      - if: "input.name in state.reasoning_parsers"
        then: [{source: "vllm/reasoning/abs_reasoning_parsers.py:240-241", return: {parser_class: "= state.reasoning_parsers[input.name]"}}]
      - if: "!(input.name in state.lazy_parsers)"
        then: [{title: Unknown parser name, source: "vllm/reasoning/abs_reasoning_parsers.py:246-249", fail: {code: key-error, message: "= 'Reasoning parser \\'' + input.name + '\\' not found. Available parsers: ' + (state.reasoning_parsers.map(k, k).filter(k, !(k in state.lazy_parsers)) + state.lazy_parsers.map(k, k)).sortBy(k, k).join(', ')"}}]
      - title: Lazily registered parsers are imported and cached on first use
        source: "vllm/reasoning/abs_reasoning_parsers.py:257-268"
        set: {state.reasoning_parsers: "= merge(state.reasoning_parsers, {input.name: state.lazy_parsers[input.name]})"}
      - return: {parser_class: "= state.lazy_parsers[input.name]"}
  - component: qwen3-parser
    name: init
    kind: function
    summary: "Qwen3Parser(tokenizer, chat_template_kwargs=...): enable_thinking (default True) builds the cached qwen3_config: REASONING initial state and wait_for_reasoning when thinking, CONTENT and no wait otherwise."
    sources: ["vllm/parser/qwen3.py:224-245", "vllm/parser/qwen3.py:88-103"]
    request: {type: object, properties: {chat_template_kwargs: {type: [object, "null"], default: null}}}
    behavior:
      - title: "chat_kwargs.get('enable_thinking', True); a None kwargs dict counts as empty"
        source: "vllm/parser/qwen3.py:230-231"
        set:
          vars.thinking: "= has(input.chat_template_kwargs) && input.chat_template_kwargs != null && 'enable_thinking' in input.chat_template_kwargs ? input.chat_template_kwargs.enable_thinking : true"
      - title: "qwen3_config(thinking): initial_state and wait_for_reasoning both follow thinking; the CHATML turn boundaries end a turn"
        source: "vllm/parser/qwen3.py:100-103"
        return:
          thinking_enabled: "= vars.thinking"
          parser_engine_config:
            name: qwen3
            initial_state: "= vars.thinking ? 'REASONING' : 'CONTENT'"
            wait_for_reasoning: "= vars.thinking"
            terminals: {THINK_START: "<think>", THINK_END: "</think>", TOOL_START: "<tool_call>", TOOL_END: "</tool_call>"}
  - component: glm47-moe-parser
    name: extract-reasoning
    kind: function
    summary: "ParserEngine.extract_reasoning with the GLM-4.7 config: thinking starts in REASONING, <think> is swallowed, </think> switches to CONTENT."
    sources: ["vllm/parser/engine/parser_engine.py:516-541", "vllm/parser/glm47_moe.py:100-200"]
    request: {type: object, properties: {model_output: {type: string, examples: ["<think>This is a reasoning section</think>This is the rest"]}, thinking: {type: boolean, default: true}}, required: [model_output]}
    behavior:
      - if: "has(input.thinking) && !input.thinking"
        then:
          - title: Thinking disabled -- initial state CONTENT, no reasoning terminals
            source: "vllm/parser/glm47_moe.py:150-151"
            return: {reasoning: null, content: "= input.model_output == '' ? null : input.model_output"}
      - title: "Initial state REASONING; (REASONING, THINK_START) stays REASONING and emits nothing"
        source: "vllm/parser/glm47_moe.py:166-170"
        set:
          vars.text: "= input.model_output.startsWith('<think>') ? input.model_output.substring(7) : input.model_output"
      - if: "vars.text.contains('</think>')"
        then:
          - title: "(REASONING, THINK_END) -> CONTENT: text before is reasoning, text after is content"
            source: "vllm/parser/glm47_moe.py:136-140"
            set:
              vars.reasoning: "= vars.text.substring(0, vars.text.indexOf('</think>'))"
              vars.content: "= vars.text.substring(vars.text.indexOf('</think>') + 8)"
        else:
          - set: {vars.reasoning: "= vars.text", vars.content: ""}
      - title: Empty strings become None
        source: "vllm/parser/engine/parser_engine.py:536-541"
        return: {reasoning: "= vars.reasoning == '' ? null : vars.reasoning", content: "= vars.content == '' ? null : vars.content"}
  - component: glm47-moe-parser
    name: is-reasoning-end
    kind: function
    summary: "ParserEngine.is_reasoning_end: scan ids backwards; </think> ends reasoning, <think> or a turn boundary first means not ended (GLM waits for reasoning)."
    sources: ["vllm/parser/engine/parser_engine.py:658-680"]
    request: {type: object, properties: {text: {type: string, examples: ["<think>This is a reasoning section</think>This is the rest"]}}, required: [text]}
    behavior:
      - title: "The markers are single special tokens, so the backwards id scan is a last-occurrence comparison on the decoded text"
        source: "vllm/parser/engine/parser_engine.py:668-671"
        set:
          vars.end_at: "= input.text.lastIndexOf('</think>')"
          vars.start_at: "= input.text.lastIndexOf('<think>')"
          vars.boundary_at: "= math.greatest([input.text.lastIndexOf('<|system|>'), input.text.lastIndexOf('<|user|>'), input.text.lastIndexOf('<|assistant|>'), input.text.lastIndexOf('<|observation|>')])"
      - if: "vars.end_at >= 0 && vars.end_at > vars.start_at && vars.end_at > vars.boundary_at"
        then: [{title: The last reasoning marker is THINK_END, source: "vllm/parser/engine/parser_engine.py:671-673", return: {is_reasoning_end: true}}]
      - title: "A THINK_START (which opens reasoning) or a turn boundary came first, or nothing: wait_for_reasoning is true for GLM, so not ended"
        source: "vllm/parser/engine/parser_engine.py:674-680"
        return: {is_reasoning_end: false}
  - component: deepseek-v4-parser
    name: dsml-arg-converter
    kind: function
    summary: "_dsml_arg_converter: DSML <parameter name=.. string=..> blocks to a JSON arguments object; string=true keeps text, otherwise JSON with a literal fallback."
    sources: ["vllm/parser/deepseek_v4.py:60-112"]
    request: {type: object, properties: {raw_args: {type: string, examples: ["\n<｜DSML｜parameter name=\"city\" string=\"true\">杭州</｜DSML｜parameter>\n"]}, partial: {type: boolean, default: false}}, required: [raw_args]}
    behavior: []
