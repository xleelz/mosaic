configs:
  - id: max-num-queued-reqs
    type: integer
    value: null
    default: null
    summary: "max_num_queued_reqs: cap on unfinished requests the API server admits (AsyncLLM.check_admission); unset (no limit) by default and in every fixture."
    sources: ["vllm/config/scheduler.py:92", "vllm/engine/arg_utils.py:606"]
    attributes: {key: max_num_queued_reqs}
  - id: max-num-queued-tokens
    type: integer
    value: null
    default: null
    summary: "max_num_queued_tokens: cap on prompt tokens of requests still prefilling (AsyncLLM.check_admission); unset by default."
    sources: ["vllm/config/scheduler.py:105", "vllm/engine/arg_utils.py:607"]
    attributes: {key: max_num_queued_tokens}
  - id: async-scheduling
    type: boolean
    value: true
    default: null
    summary: "async_scheduling: AsyncScheduler overlaps the next schedule with the running step (output placeholders)"
    sources: ["vllm/config/scheduler.py:208", "vllm/config/vllm.py:1585-1644", "vllm/config/scheduler.py:229-233", "vllm/v1/core/sched/async_scheduler.py:25-57"]
    attributes: {boundary: true, owner: scheduler-kv, key: async_scheduling}
  - id: shutdown-timeout
    type: integer
    value: 0
    default: 0
    summary: "shutdown_timeout (seconds): 0 aborts in-flight requests on SIGTERM (mode abort); >0 drains them (EngineCoreProc._handle_shutdown)."
    sources: ["vllm/config/vllm.py:443", "vllm/engine/arg_utils.py:842"]
    attributes: {key: shutdown_timeout}
  - id: enable-fault-tolerance
    type: boolean
    value: false
    default: false
    summary: "enable_fault_tolerance: when true the busy loop is wrapped so an exception parks the engine (UNHEALTHY) instead of killing it."
    sources: ["vllm/config/parallel.py:462", "vllm/engine/arg_utils.py:836"]
    attributes: {key: enable_fault_tolerance}
  - id: engine-recovery-timeout-sec
    type: integer
    value: 120
    default: 120
    summary: "fault_tolerance_config.engine_recovery_timeout_sec: how long a faulted engine waits for a recovery instruction before raising."
    sources: ["vllm/config/fault_tolerance.py:12", "vllm/engine/arg_utils.py:833"]
    attributes: {key: engine_recovery_timeout_sec}
  - id: distributed-executor-backend
    type: string
    value: null
    default: null
    summary: "distributed_executor_backend: unset at the CLI; ParallelConfig resolves it to 'uni' when world_size is 1 (tp1 fixtures) and to 'mp' when the world fits on one node (tp4). Executor.get_class picks the executor class from it."
    sources: ["vllm/config/parallel.py:289", "vllm/config/parallel.py:1079-1080", "vllm/engine/arg_utils.py:513"]
    attributes: {key: distributed_executor_backend}
  - id: vllm-execute-model-timeout-seconds
    type: integer
    value: 300
    default: 300
    summary: "VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: the MultiprocExecutor's timeout for execute_model/sample_tokens collective RPCs."
    sources: ["vllm/envs.py:252", "vllm/envs.py:1872-1874"]
    attributes: {key: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS}
  - id: disable-log-stats
    type: boolean
    value: false
    default: false
    summary: "disable_log_stats: false for vllm serve, so AsyncLLM/LLMEngine log_stats is true and the StatLoggerManager records each step. The offline LLM class overrides it to true unless the caller passes it (vllm/entrypoints/llm.py:226-227)."
    sources: ["vllm/engine/arg_utils.py:612", "vllm/v1/engine/async_llm.py:287"]
    attributes: {key: disable_log_stats}

  - {id: enable-lora, type: boolean, value: false, default: false, summary: "--enable-lora: builds a LoRAConfig; without it the workers refuse add_lora", sources: ["vllm/engine/arg_utils.py:676", "vllm/engine/arg_utils.py:2650-2668"], attributes: {boundary: true, owner: config-platform, key: enable_lora}}
  - {id: profiler, type: string, value: "", default: "", summary: "--profiler-config.profiler (torch, cuda, proton): None ('' here) means profiling is off", sources: ["vllm/config/profiler.py:70", "vllm/engine/arg_utils.py:764"], attributes: {boundary: true, owner: config-platform, key: profiler_config.profiler, none_is: ""}}
  - {id: weight-transfer-backend, type: string, value: "", default: "", summary: "weight_transfer_config.backend: None ('' here) means no weight transfer engine", sources: ["vllm/config/vllm.py:440", "vllm/engine/arg_utils.py:844"], attributes: {boundary: true, owner: config-platform, key: weight_transfer_config, none_is: ""}}
  - id: data-parallel-size
    type: integer
    value: 1
    default: 1
    summary: "data_parallel_size: the number of engine-core processes (DP ranks); above 1 the API server uses a DP client that load-balances requests over them. Every shared fixture deploys 1."
    sources: ["vllm/config/parallel.py:146", "vllm/engine/arg_utils.py:537"]
    attributes: {key: data_parallel_size}
  - {id: speculative-method, type: string, value: "", default: "", summary: "speculative_config.method: None ('' here) means no speculative decoding", sources: ["vllm/config/speculative.py:399"], attributes: {boundary: true, owner: config-platform, key: speculative_config.method, none_is: ""}}
  - {id: pipeline-parallel-size, type: integer, value: 1, default: 1, summary: "pipeline_parallel_size (boundary copy): max_concurrent_batches is PP (+1 with async scheduling on the V2 runner)", sources: ["vllm/config/parallel.py:139", "vllm/config/vllm.py:577-587"], attributes: {boundary: true, owner: distributed, key: pipeline_parallel_size}}
  - {id: use-v2-model-runner, type: boolean, value: true, default: true, summary: "VllmConfig.use_v2_model_runner (boundary copy): async scheduling with PP needs the V2 runner", sources: ["vllm/config/vllm.py:703-739"], attributes: {boundary: true, owner: config-platform, key: use_v2_model_runner}}
  - {id: served-model-name, type: array, value: [llama-8b], default: null, summary: "--served-model-name (boundary copy): the first name is ModelConfig.served_model_name, the model_name label of every vllm:* metric; None means the model path", sources: ["vllm/config/model.py:325", "vllm/v1/metrics/loggers.py:499-500"], attributes: {boundary: true, owner: config-platform, key: served_model_name}}
  - {id: max-logprobs, type: integer, value: 20, default: 20, summary: "max_logprobs: the most sample logprobs a request may ask for (-1 = the vocab size)", sources: ["vllm/config/model.py:282"], attributes: {boundary: true, owner: config-platform, key: max_logprobs}}
  - {id: structured-outputs-backend, type: string, value: auto, default: auto, summary: "--structured-outputs-config.backend: auto picks xgrammar or guidance per request", sources: ["vllm/config/structured_outputs.py:20"], attributes: {boundary: true, owner: config-platform, key: structured_outputs_config.backend}}
  - {id: vllm-allow-insecure-serialization, type: boolean, value: false, default: false, summary: "VLLM_ALLOW_INSECURE_SERIALIZATION: let MsgpackEncoder fall back to pickle (cloudpickle for functions) for types msgpack can't encode, and MsgpackDecoder unpickle them", sources: ["vllm/envs.py:231", "vllm/envs.py:1726-1728"], attributes: {key: VLLM_ALLOW_INSECURE_SERIALIZATION, env: true}}
  - {id: vllm-ray-extra-env-var-prefixes-to-copy, type: string, value: "", default: "", summary: "VLLM_RAY_EXTRA_ENV_VAR_PREFIXES_TO_COPY: comma-separated env var prefixes copied to Ray actors on top of the built-in ones", sources: ["vllm/envs.py:190", "vllm/envs.py:1555-1557"], attributes: {key: VLLM_RAY_EXTRA_ENV_VAR_PREFIXES_TO_COPY, env: true}}
  - {id: vllm-ray-extra-env-vars-to-copy, type: string, value: "", default: "", summary: "VLLM_RAY_EXTRA_ENV_VARS_TO_COPY: comma-separated individual env var names copied to Ray actors", sources: ["vllm/envs.py:191"], attributes: {key: VLLM_RAY_EXTRA_ENV_VARS_TO_COPY, env: true}}
  - {id: vllm-worker-shutdown-timeout-seconds, type: integer, value: 5, default: 5, summary: "VLLM_WORKER_SHUTDOWN_TIMEOUT_SECONDS: how long MultiprocExecutor waits for workers to exit before SIGTERM (then 4 s more before SIGKILL)", sources: ["vllm/envs.py:253", "vllm/envs.py:1876-1878"], attributes: {key: VLLM_WORKER_SHUTDOWN_TIMEOUT_SECONDS}}
  - {id: vllm-ray-dp-placement-node-ips, type: string, value: "", default: "", summary: "VLLM_RAY_DP_PLACEMENT_NODE_IPS: comma-separated node IPs Ray DP placement groups may use; '' = no restriction", sources: ["vllm/envs.py:189", "vllm/envs.py:1549-1551"], attributes: {boundary: true, owner: config-platform, key: VLLM_RAY_DP_PLACEMENT_NODE_IPS, env: true}}

schemas:
  - id: EngineCoreOutput
    summary: "One request's slice of an engine step (vllm/v1/engine/__init__.py EngineCoreOutput): the new token ids and, when it finished, why."
    schema:
      type: object
      required: [request_id, new_token_ids]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123-00000001]}
        new_token_ids: {type: array, items: {type: integer}, examples: [[9906]]}
        finish_reason: {type: [string, "null"], enum: [stop, length, abort, error, repetition, null], description: "FinishReason; null while the request is still running"}
        stop_reason: {type: [string, integer, "null"], description: "the stop string, or the stop token id (int | str | None)"}
        new_logprobs: {type: ["object", "null"], default: null, description: "LogprobsLists for the new tokens {token_ids, logprobs, ranks} when the request asked for logprobs"}
        mm_cache_miss_hashes: {type: ["array", "null"], items: {type: string}, default: null, description: "mm hashes the P1 receiver cache couldn't find; the frontend drops them from its P0 sender cache"}
  - id: EngineCoreOutputs
    summary: "What the engine core sends a client per step or event (vllm/v1/engine/__init__.py EngineCoreOutputs): outputs, stats, a utility reply or a wave notice."
    schema:
      type: object
      properties:
        engine_index: {type: integer, default: 0}
        outputs: {type: array, items: {$ref: EngineCoreOutput}, default: []}
        scheduler_stats: {type: [object, "null"]}
        timestamp: {type: number}
        utility_output: {type: [object, "null"]}
        finished_requests: {type: array, items: {type: string}, default: []}
        weight_version: {type: string}
  - id: EngineCoreClientRequest
    summary: "What the API server hands the engine client: the EngineCoreRequest plus the request fields InputProcessor and the client fill in (vllm/v1/engine/__init__.py EngineCoreRequest, vllm/sampling_params.py)."
    schema:
      # Flat, not allOf over EngineCoreRequest: lints read the first
      # sampling_params of an allOf, which would hide the fields below.
      type: object
      required: [request_id, prompt_token_ids, sampling_params]
      properties:
            request_id: {type: string, examples: [chatcmpl-abc123]}
            prompt_token_ids: {type: array, items: {type: integer}, examples: [[128000, 9906, 1917]]}
            arrival_time: {type: number}
            priority: {type: integer, examples: [0]}
            external_req_id: {type: ["string", "null"], default: null, description: "set by assign_request_id; callers leave it unset"}
            data_parallel_rank: {type: ["integer", "null"], default: null}
            pooling_params: {type: ["object", "null"], default: null}
            abort_immediately: {type: boolean, default: false}
            client_index: {type: integer, default: 0}
            lora_request: {type: ["object", "null"], default: null, description: "LoRARequest {lora_name, lora_int_id, lora_path}", properties: {lora_name: {type: string}, lora_int_id: {type: integer}, lora_path: {type: string}}}
            cache_salt: {type: ["string", "null"], default: null, description: "the prompt's cache_salt: an extra key of the first block hash"}
            mm_features: {type: ["array", "null"], default: null, description: "MultiModalFeatureSpec items {mm_hash, data}; data is null when P0's sender cache says P1 already holds it", items: {type: object, properties: {mm_hash: {type: string}, identifier: {type: string}, modality: {type: string}, offset: {type: integer, description: "PlaceholderRange.offset in the prompt"}, length: {type: integer}, num_embeds: {type: integer}, data: {}}}}
            sampling_params:
              type: object
              properties:
                temperature: {type: number, default: 1.0, examples: [0.0]}
                top_p: {type: number, default: 1.0, examples: [1.0]}
                max_tokens: {type: ["integer", "null"], default: null, examples: [16], description: "null means up to max_model_len minus the prompt"}
                stop: {type: array, items: {type: string}, default: []}
                n: {type: integer, default: 1, examples: [1]}
                seed: {type: integer}
                ignore_eos: {type: boolean, default: false}
                output_kind: {type: string, enum: [cumulative, delta, final_only, CUMULATIVE, DELTA, FINAL_ONLY], default: cumulative}
                min_tokens: {type: integer, default: 0}
                stop_token_ids: {type: array, items: {type: integer}, default: []}
                include_stop_str_in_output: {type: boolean, default: false}
                structured_outputs: {type: ["object", "null"], default: null, properties: {regex: {type: string}, json: {}, choice: {type: array, items: {type: string}}, grammar: {type: string}, json_object: {type: ["boolean", "null"]}, structural_tag: {type: ["string", "null"]}, _backend: {type: ["string", "null"], description: "the backend auto resolved to"}}}
                logprobs: {type: ["integer", "null"], default: null, description: "number of sample logprobs per token (-1 = the vocab)"}
                skip_special_tokens: {type: boolean, default: true}
                eos_token_id: {type: ["integer", "null"], default: null}
                watermarking: {type: ["boolean", "null"], default: null, description: "per-request watermark switch; null follows the engine's watermark_config"}
                extra_args: {type: ["object", "null"], default: null}
  - id: EngineCoreRequestOutput
    summary: "The RequestOutput the output processor produces: its request_id is the external id, and it carries one completion per sampled sequence (DELTA: the new tokens; CUMULATIVE and FINAL_ONLY: all tokens so far)."
    schema:
      type: object
      properties:
        request_id: {type: string}
        kind: {type: string, enum: [delta, cumulative, final_only], default: cumulative}
        completions:
          type: array
          items: {type: object, properties: {index: {type: integer}, token_ids: {type: array, items: {type: integer}}, text: {type: string}, finish_reason: {type: ["string", "null"]}, stop_reason: {type: ["string", "integer", "null"]}}}
        text: {type: string}
        token_ids: {type: array, items: {type: integer}}
        finish_reason: {type: ["string", "null"]}
        stop_reason: {type: ["string", "integer", "null"]}
        finished: {type: boolean}
        num_cached_tokens: {type: integer, default: 0, description: "prefix-cache hits of the prompt, recorded from the first EngineCoreOutput"}
  - id: EngineCoreGenerateResult
    summary: "What a generate() consumer has seen when the stream ends: every RequestOutput, and the final finish reason."
    schema:
      type: object
      properties:
        request_id: {type: string}
        finished: {type: boolean}
        finish_reason: {type: [string, "null"]}
        num_outputs: {type: integer}
        token_ids: {type: array, items: {type: integer}}
        text: {type: string}
  - id: EngineCoreUtilityCall
    summary: "A UTILITY message: (client_index, call_id, method_name, args) sent by the client to EngineCoreProc."
    schema:
      type: object
      required: [method]
      properties:
        method: {type: string, examples: [is_sleeping]}
        engine: {type: ["string", "null"], default: null, description: "a DP engine instance (dp0, dp1, ...); null = the client's core engine"}
        args: {type: object, default: {}}
        client_index: {type: integer, default: 0}
  - id: EngineCoreUtilityResult
    summary: "UtilityOutput: the method's result, or the failure message the client turns into an Exception."
    schema:
      type: object
      properties:
        result: {}
        failure_message: {type: [string, "null"]}
