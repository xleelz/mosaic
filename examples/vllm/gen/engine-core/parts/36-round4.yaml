# Fix round 4 (coverage): functions vLLM's tests call that the model did not cover, and the
# test-hit inventory skips. See notes/engine-core.md, "Fix round 4".
configs:
  - {id: model, type: string, value: meta-llama/Llama-3.1-8B-Instruct, default: Qwen/Qwen3-0.6B, summary: "--model (boundary copy): the tokenizer defaults to the model path", sources: ["vllm/config/model.py:154"], attributes: {boundary: true, owner: config-platform, key: model}}
  - {id: skip-tokenizer-init, type: boolean, value: false, default: false, summary: "skip_tokenizer_init: no tokenizer is built, so get_tokenizer raises", sources: ["vllm/config/model.py:315"], attributes: {boundary: true, owner: config-platform, key: skip_tokenizer_init}}
  - {id: otlp-traces-endpoint, type: string, value: "", default: "", summary: "--otlp-traces-endpoint: None ('' here) means tracing is off", sources: ["vllm/config/observability.py:38"], attributes: {boundary: true, owner: config-platform, key: observability_config.otlp_traces_endpoint, none_is: ""}}
  - {id: enable-kv-cache-events, type: boolean, value: false, default: false, summary: "kv_events_config.enable_kv_cache_events (boundary copy)", sources: ["vllm/config/kv_events.py:14"], attributes: {boundary: true, owner: distributed, key: kv_events_config.enable_kv_cache_events}}
  - {id: kv-events-publisher, type: string, value: null, default: null, summary: "kv_events_config.publisher (boundary copy)", sources: ["vllm/config/kv_events.py:19"], attributes: {boundary: true, owner: distributed, key: kv_events_config.publisher}}
  - {id: vllm-elastic-ep-drain-requests, type: boolean, value: false, default: false, summary: "VLLM_ELASTIC_EP_DRAIN_REQUESTS: drain in-flight requests before committing an elastic-EP scale", sources: ["vllm/envs.py:327"], attributes: {key: VLLM_ELASTIC_EP_DRAIN_REQUESTS, env: true}}
  - {id: dp-sync-interval, type: integer, value: 16, default: 16, summary: "parallel_config.dp_sync_interval: the DP busy loop all-reduces the unfinished flag on step 1 and every Nth step after", sources: ["vllm/config/parallel.py:162", "vllm/v1/engine/core.py:2163"], attributes: {boundary: true, owner: config-platform, key: dp_sync_interval}}

components:
  - id: attention-metrics
    name: AttentionMetrics
    kind: module
    parent: engine-core
    layer: metrics
    summary: "The analytic FLOPs and bytes model of standard attention layers (vllm/v1/metrics/perf.py), built from the config alone: full and sliding-window sublayers, divided by TP heads and PP stages."
    sources: ["vllm/v1/metrics/perf.py:492-614"]
  - id: logprobs-processor
    name: LogprobsProcessor
    kind: module
    parent: engine-core
    layer: frontend
    summary: "Per-request sample logprobs in the output processor: one {token_id: Logprob} position per sampled token, cut to num_logprobs + 1 entries, and the cumulative logprob of the sampled tokens."
    sources: ["vllm/v1/engine/logprobs.py:31-71"]
    state:
      schema: {type: object, properties: {requests: {type: object}}}
      initial: {requests: {}}
  - id: logging-stat-logger
    name: LoggingStatLogger
    kind: module
    parent: engine-core
    layer: metrics
    tags: [metrics]
    summary: "The stdout stat logger: accumulates prompt and generation tokens between log intervals and keeps the last SchedulerStats."
    sources: ["vllm/v1/metrics/loggers.py:101-160"]
    state:
      schema: {type: object, properties: {num_prompt_tokens: {type: integer}, num_generation_tokens: {type: integer}, num_preemptions: {type: integer}, last_scheduler_stats: {type: [object, "null"]}, last_scheduler_stats_dict: {type: object}}}
      initial: {num_prompt_tokens: 0, num_generation_tokens: 0, num_preemptions: 0, last_scheduler_stats: null, last_scheduler_stats_dict: {}}
  - id: per-engine-stat-logger-adapter
    name: PerEngineStatLoggerAdapter
    kind: module
    parent: engine-core
    layer: metrics
    tags: [metrics]
    summary: "Wraps a per-engine stat logger factory (a custom StatLoggerBase) into one logger per DP engine index."
    sources: ["vllm/v1/metrics/loggers.py:448-462"]
    state:
      schema: {type: object, properties: {engine_indexes: {type: array}, records: {type: object}}}
      initial: {engine_indexes: [0], records: {}}
  - id: ray-executor-v2
    name: RayExecutorV2
    kind: module
    parent: engine-core
    layer: executor
    summary: "The Ray executor (V2): one RayWorkerProc actor per rank; a RayWorkerMonitor thread fails the executor when a worker's run task ends."
    sources: ["vllm/v1/executor/ray_executor_v2.py:480-535"]
    state:
      schema: {type: object, properties: {is_failed: {type: boolean}, shutting_down: {type: boolean}, dead_ranks: {type: array}}}
      initial: {is_failed: false, shutting_down: false, dead_ranks: []}
  - id: dp-engine-core-proc
    name: DPEngineCoreProc
    kind: module
    parent: engine-core
    layer: process
    summary: "EngineCoreProc for data_parallel_size > 1: request waves, dummy batches on idle ranks so MoE collectives line up, and an all-reduce of the unfinished flag across the DP group."
    sources: ["vllm/v1/engine/core.py:2143-2170"]
    state:
      schema: {type: object, properties: {engines_running: {type: boolean}, current_wave: {type: integer}, step_counter: {type: integer}, wave_complete: {type: array}}}
      initial: {engines_running: false, current_wave: 0, step_counter: 0, wave_complete: []}

flows:
  - id: dp-engine-core-busy-loop
    name: DP engine-core busy loop
    description: "DPEngineCoreProc.run_busy_loop on one DP rank: each pass processes input, steps, runs a dummy batch when the wave is live but nothing ran, and all-reduces the unfinished flag to end or continue the wave."
    tags: [writes, "feature:data-parallel"]
    sources: ["vllm/v1/engine/core.py:2327-2409"]
    entry: {caller: engine-core, interface: dp-engine-core-proc.run-busy-loop, input: {dp_rank: 0}, repeat: {count: 2, interval_ms: 1}}
  - id: dp-client-stats-update-task
    name: DP client stats update task
    description: "DPAsyncMPClient's stats task: each pass handles one coordinator message (FIRST_REQ, SCALE_ELASTIC_EP or a stats publish)."
    tags: [writes, "feature:data-parallel"]
    sources: ["vllm/v1/engine/core_client.py:1474-1576"]
    entry: {caller: api-server, interface: dp-lb-async-mp-client.run-engine-stats-update-task, input: {stats: {counts: [[1, 0], [0, 2]], wave: 1, running: true}}, repeat: {count: 2, interval_ms: 1}}
  - id: ray-v2-worker-monitor
    name: Ray V2 worker monitor
    description: "The RayWorkerMonitor thread: polls the workers' run refs until shutdown; a dead worker fails the executor and notifies the engine core."
    sources: ["vllm/v1/executor/ray_executor_v2.py:502-535"]
    entry: {caller: engine-core, interface: ray-executor-v2.monitor-workers, input: {max_polls: 120}}

interfaces:
  # ------------------------------------------------------------------ executor class facts
  - component: executor
    name: supports-async-scheduling
    kind: function
    summary: "Executor.supports_async_scheduling: False on the base class (and the Ray executor, which inherits it); the uniproc executor (and ExecutorWithExternalLauncher, which inherits it) and the multiproc executor return True."
    sources: ["vllm/v1/executor/abstract.py:441-444", "vllm/v1/executor/uniproc_executor.py:156-158", "vllm/v1/executor/multiproc_executor.py:564-566"]
    request: {type: object, required: [executor_class], properties: {executor_class: {type: string, enum: [Executor, UniProcExecutor, ExecutorWithExternalLauncher, MultiprocExecutor, RayDistributedExecutor], examples: [MultiprocExecutor]}}}
    response: {type: boolean}
    behavior:
      - if: "input.executor_class in ['UniProcExecutor', 'ExecutorWithExternalLauncher']"
        then:
          - title: "UniProcExecutor.supports_async_scheduling (inherited by ExecutorWithExternalLauncher)"
            source: "vllm/v1/executor/uniproc_executor.py:156-158"
            return: true
      - if: "input.executor_class == 'MultiprocExecutor'"
        then:
          - title: "MultiprocExecutor.supports_async_scheduling"
            source: "vllm/v1/executor/multiproc_executor.py:564-566"
            return: true
      - title: "Executor.supports_async_scheduling: the base class (and RayDistributedExecutor, which doesn't override it) says no"
        source: "vllm/v1/executor/abstract.py:441-444"
        return: false

  - component: ray-executor-v2
    name: monitor-workers
    kind: function
    summary: "RayExecutorV2.start_worker_monitor's RayWorkerMonitor thread: poll ray.wait on the workers' run refs every 5 s until the executor shuts down; a finished run ref is a dead worker: mark the executor failed, shut it down and fire the failure callback once."
    sources: ["vllm/v1/executor/ray_executor_v2.py:486-535"]
    attributes: {single_writer: "only the RayWorkerMonitor thread sets is_failed (vllm/v1/executor/ray_executor_v2.py:519); shutting_down is set by shutdown under shutdown_lock (vllm/v1/executor/ray_executor_v2.py:556-566) and only read through _should_stop"}
    request: {type: object, properties: {max_polls: {type: integer, default: 120, description: "simulation bound on the 5 s polls"}}}
    response: {type: object}
    behavior:
      - title: "while not _should_stop(): ray.wait(run_refs, num_returns=1, timeout=5.0)"
        source: "vllm/v1/executor/ray_executor_v2.py:502-512"
        foreach: "= lists.range(has(input.max_polls) ? input.max_polls : 120)"
        as: poll
        max: 1000
        steps:
          - if: "state.shutting_down"
            then:
              - title: "_should_stop(): the executor is shutting down"
                source: "vllm/v1/executor/ray_executor_v2.py:498-500"
                return: {handled: false, stopped: true}
          - wait: {signals: ["exit:gpu-worker@rank0", "exit:gpu-worker@rank1", "exit:gpu-worker@rank2", "exit:gpu-worker@rank3", "exit:gpu-worker@rank4", "exit:gpu-worker@rank5", "exit:gpu-worker@rank6", "exit:gpu-worker@rank7"], timeout_ms: 5000, on_timeout: continue, as: done}
          - if: "vars.done.reason == 'signal' && !state.shutting_down"
            then:
              - title: "A worker's run ref finished: it died; fail and shut down the executor"
                source: "vllm/v1/executor/ray_executor_v2.py:515-525"
                set: {state.is_failed: true, state.shutting_down: true, state.dead_ranks: "= [vars.done.data.instance]"}
              - title: "failure_callback() once: EXECUTOR_FAILED goes to the engine core"
                source: "vllm/v1/executor/ray_executor_v2.py:526-530"
                call: engine-core-proc.executor-fail-callback
              - return: {handled: true, dead_ranks: "= state.dead_ranks"}
      - return: {handled: false, stopped: false}

  # ------------------------------------------------------------------ perf metrics (attention)
  - component: attention-metrics
    name: from-vllm-config
    kind: function
    summary: "AttentionMetrics.from_vllm_config: the parser chain reads heads, layers, head size, TP and PP; SlidingWindowAttentionParser counts the sliding-window layers from layer_types (Gemma 2 alternates; any other SWA model is all sliding)."
    sources: ["vllm/v1/metrics/perf.py:285-294", "vllm/v1/metrics/perf.py:333-380", "vllm/v1/metrics/perf.py:386-452"]
    request:
      type: object
      required: [num_hidden_layers, num_attention_heads, hidden_size]
      properties:
        hidden_size: {type: integer, examples: [2048]}
        num_attention_heads: {type: integer, examples: [16]}
        num_key_value_heads: {type: integer, examples: [16]}
        num_hidden_layers: {type: integer, examples: [6]}
        head_dim: {type: ["integer", "null"], default: null, description: "hf head_dim; else hidden_size / num_attention_heads"}
        sliding_window: {type: ["integer", "null"], default: null}
        layer_types: {type: ["array", "null"], default: null, items: {type: string}}
        model_type: {type: string, default: ""}
        disable_sliding_window: {type: boolean, default: false}
        tensor_parallel_size: {type: integer, default: 1}
        pipeline_parallel_size: {type: integer, default: 1}
    response: {type: object}
    behavior:
      - title: "BaseConfigParser and BaseAttentionConfigParser: total heads (not divided by TP), layers, head size, TP and PP"
        source: "vllm/v1/metrics/perf.py:339-401"
        set:
          vars.sw: "= has(input.disable_sliding_window) && input.disable_sliding_window ? dyn(null) : (has(input.sliding_window) ? input.sliding_window : dyn(null))"
          vars.L: "= input.num_hidden_layers"
      - title: "SlidingWindowAttentionParser: count the sliding layers"
        source: "vllm/v1/metrics/perf.py:413-452"
        set:
          vars.num_swa: "= vars.sw == null || vars.sw <= 0 ? 0 : (has(input.layer_types) && input.layer_types != null ? input.layer_types.slice(0, int(math.least(size(input.layer_types), vars.L))).filter(t, t.lowerAscii().contains('sliding')).size() : (has(input.model_type) && input.model_type == 'gemma2' ? (vars.L + 1) / 2 : vars.L))"
      - if: "input.num_hidden_layers <= 0 || input.num_attention_heads <= 0"
        then:
          - title: "model_validate: every count must be > 0 (InvalidComponent)"
            source: "vllm/v1/metrics/perf.py:291-294"
            fail: {code: invalid-component, message: "Invalid attn config"}
      - return:
          num_hidden_layers: "= vars.L"
          hidden_size: "= input.hidden_size"
          num_attention_heads: "= input.num_attention_heads"
          num_key_value_heads: "= has(input.num_key_value_heads) ? input.num_key_value_heads : input.num_attention_heads"
          head_dim: "= has(input.head_dim) && input.head_dim != null ? input.head_dim : input.hidden_size / input.num_attention_heads"
          tp_size: "= has(input.tensor_parallel_size) ? input.tensor_parallel_size : 1"
          pp_size: "= has(input.pipeline_parallel_size) ? input.pipeline_parallel_size : 1"
          sliding_window: "= vars.sw"
          num_swa_layers: "= vars.num_swa"

  - component: attention-metrics
    name: get-num-flops-breakdown
    kind: function
    summary: "AttentionMetrics.get_num_flops_breakdown: qkv/out projections over all layers, and attn_qk/attn_av split into full layers (context) and sliding layers (context clamped to the window). Per GPU, heads divide by TP and each layer count divides by PP on its own, so a minority sliding layer is not rounded away."
    sources: ["vllm/v1/metrics/perf.py:534-614", "vllm/v1/metrics/perf.py:140-157", "vllm/v1/metrics/perf.py:187-197"]
    request:
      type: object
      required: [metrics, requests]
      properties:
        metrics: {type: object, description: "from-vllm-config's result"}
        requests: {type: array, description: "ExecutionContext: [num_tokens, context_len, is_prefill] per request", items: {type: array}, examples: [[[1, 4096, false]]]}
        per_gpu: {type: boolean, default: true}
    response: {type: object}
    behavior:
      - set:
          vars.m: "= input.metrics"
          vars.per_gpu: "= !has(input.per_gpu) || input.per_gpu"
      - title: "_layer_counts: L, L_full = L - L_swa and L_swa, each divided by pp_size separately per GPU"
        source: "vllm/v1/metrics/perf.py:534-560"
        set:
          vars.L: "= double(vars.m.num_hidden_layers) / (vars.per_gpu ? double(vars.m.pp_size) : 1.0)"
          vars.L_swa: "= double(vars.m.num_swa_layers) / (vars.per_gpu ? double(vars.m.pp_size) : 1.0)"
          vars.L_full: "= double(vars.m.num_hidden_layers - vars.m.num_swa_layers) / (vars.per_gpu ? double(vars.m.pp_size) : 1.0)"
      - title: "Tensor parallel splits the heads (at least one per GPU)"
        source: "vllm/v1/metrics/perf.py:590-593"
        set:
          vars.q: "= vars.per_gpu ? math.greatest(1, vars.m.num_attention_heads / vars.m.tp_size) : vars.m.num_attention_heads"
          vars.kv: "= vars.per_gpu ? math.greatest(1, vars.m.num_key_value_heads / vars.m.tp_size) : vars.m.num_key_value_heads"
      - title: "ExecutionContext: total tokens and the token x context products (clamped to the window for sliding layers)"
        source: "vllm/v1/metrics/perf.py:140-157"
        set:
          vars.T: "= sum(input.requests.map(r, r[0]))"
          vars.TC: "= sum(input.requests.map(r, r[0] * r[1]))"
          vars.TC_swa: "= vars.m.sliding_window == null ? 0 : sum(input.requests.map(r, r[0] * math.least(r[1], vars.m.sliding_window)))"
      - set:
          vars.attn: "= (vars.L_full > 0.0 ? 2.0 * double(vars.q) * double(vars.TC) * double(vars.m.head_dim) * vars.L_full : 0.0) + (vars.L_swa > 0.0 && vars.m.sliding_window != null ? 2.0 * double(vars.q) * double(vars.TC_swa) * double(vars.m.head_dim) * vars.L_swa : 0.0)"
      - return:
          qkv_proj: "= int(2.0 * double(vars.T) * double(vars.m.hidden_size) * double(vars.q + 2 * vars.kv) * double(vars.m.head_dim) * vars.L)"
          out_proj: "= int(2.0 * double(vars.T) * double(vars.m.hidden_size) * double(vars.q) * double(vars.m.head_dim) * vars.L)"
          attn_qk: "= int(vars.attn)"
          attn_av: "= int(vars.attn)"

  # ------------------------------------------------------------------ LogprobsProcessor
  - component: logprobs-processor
    name: update-sample-logprobs
    kind: function
    summary: "LogprobsProcessor._update_sample_logprobs: per sampled position add the sampled token's logprob to the cumulative logprob and append one position whose entries zip (token_ids, logprobs, ranks), where ranks has num_logprobs + 1 entries, so trailing columns a wider batch row padded with sentinels are dropped."
    sources: ["vllm/v1/engine/logprobs.py:72-125", "vllm/logprobs.py:178-209", "vllm/logprobs.py:173-175", "vllm/v1/outputs.py:34-56"]
    request:
      type: object
      required: [request_id, num_logprobs, logprobs_lists]
      properties:
        request_id: {type: string}
        num_logprobs: {type: integer, description: "-1 = every column"}
        logprobs_lists:
          type: object
          description: "LogprobsLists: one row per sampled token; the sampled token is column 0"
          properties:
            token_ids: {type: array, items: {type: array, items: {type: integer}}}
            logprobs: {type: array, items: {type: array, items: {type: number}}}
            ranks: {type: array, items: {type: integer}}
    response: {type: object, properties: {logprobs: {type: array}, cumulative_logprob: {type: number}}}
    behavior:
      - title: "from_new_request: cumulative_logprob starts at 0.0 and the position list (create_sample_logprobs) is empty"
        source: "vllm/v1/engine/logprobs.py:45-70"
        set:
          vars.cur: "= input.request_id in state.requests ? state.requests[input.request_id] : {'logprobs': [], 'cumulative_logprob': 0.0}"
          vars.lists: "= input.logprobs_lists"
      - foreach: "= lists.range(size(vars.lists.token_ids))"
        as: i
        steps:
          - title: "The sampler puts the sampled logprob first: it alone feeds cumulative_logprob"
            source: "vllm/v1/engine/logprobs.py:108-110"
            set:
              vars.width: "= input.num_logprobs == -1 ? size(vars.lists.logprobs[vars.i]) : int(math.least(input.num_logprobs + 1, size(vars.lists.token_ids[vars.i])))"
          - title: "append_logprobs_for_next_position: ranks = (sampled rank, 1..num_logprobs); zip stops at the shortest, so sentinel columns past num_logprobs + 1 never reach the user"
            source: "vllm/logprobs.py:186-209"
            set:
              vars.cur: "= {'cumulative_logprob': vars.cur.cumulative_logprob + double(vars.lists.logprobs[vars.i][0]), 'logprobs': vars.cur.logprobs + [lists.range(vars.width).map(j, {'token_id': vars.lists.token_ids[vars.i][j], 'logprob': double(vars.lists.logprobs[vars.i][j]), 'rank': j == 0 ? vars.lists.ranks[vars.i] : j})]}"
      - set: {state.requests: "= merge(state.requests, {input.request_id: vars.cur})"}
      - return: "= vars.cur"

  # ------------------------------------------------------------------ stat loggers
  - component: logging-stat-logger
    name: record
    kind: function
    summary: "LoggingStatLogger.record (StatLoggerBase.record's stdout logger): track the iteration's prompt and generation tokens and preemptions, and keep the latest SchedulerStats unless aggregated."
    sources: ["vllm/v1/metrics/loggers.py:217-253", "vllm/v1/metrics/loggers.py:161-167", "vllm/v1/metrics/loggers.py:65-72", "vllm/v1/metrics/stats.py:223-255"]
    request:
      type: object
      properties:
        iteration_stats: {type: ["object", "null"], default: null, properties: {num_prompt_tokens: {type: integer}, num_generation_tokens: {type: integer}, num_preempted_reqs: {type: integer}}}
        scheduler_stats: {type: ["object", "null"], default: null, description: "SchedulerStats (vllm/v1/metrics/stats.py:222-255): num_running_reqs, num_waiting_reqs, kv_cache_usage, ..."}
        engine_idx: {type: integer, default: 0}
        aggregated: {type: boolean, default: false}
    behavior:
      - if: "has(input.iteration_stats) && input.iteration_stats != null"
        then:
          - title: "_track_iteration_stats: computed prompt tokens and generation tokens accumulate until the next log()"
            source: "vllm/v1/metrics/loggers.py:161-167"
            set:
              state.num_prompt_tokens: "= state.num_prompt_tokens + (has(input.iteration_stats.num_prompt_tokens) ? input.iteration_stats.num_prompt_tokens : 0)"
              state.num_generation_tokens: "= state.num_generation_tokens + (has(input.iteration_stats.num_generation_tokens) ? input.iteration_stats.num_generation_tokens : 0)"
              state.num_preemptions: "= state.num_preemptions + (has(input.iteration_stats.num_preempted_reqs) ? input.iteration_stats.num_preempted_reqs : 0)"
      - if: "has(input.scheduler_stats) && input.scheduler_stats != null && !(has(input.aggregated) && input.aggregated)"
        then:
          - title: "Keep the latest SchedulerStats for the next log line"
            source: "vllm/v1/metrics/loggers.py:248-249"
            set: {state.last_scheduler_stats: "= input.scheduler_stats"}
      - return: {num_prompt_tokens: "= state.num_prompt_tokens", num_generation_tokens: "= state.num_generation_tokens"}

  - component: logging-stat-logger
    name: record-aggregated
    kind: function
    summary: "AggregatedLoggingStatLogger.record: an engine index it doesn't manage is ignored with a warning; otherwise LoggingStatLogger.record, and the SchedulerStats is kept per engine for aggregation."
    sources: ["vllm/v1/metrics/loggers.py:379-397"]
    request: {type: object, properties: {engine_indexes: {type: array, items: {type: integer}, default: [0]}, engine_idx: {type: integer, default: 0}, iteration_stats: {type: ["object", "null"], default: null}, scheduler_stats: {type: ["object", "null"], default: null}}}
    behavior:
      - if: "!((has(input.engine_idx) ? input.engine_idx : 0) in (has(input.engine_indexes) ? input.engine_indexes : [0]))"
        then:
          - title: "Unexpected engine_idx: warn and drop the record"
            source: "vllm/v1/metrics/loggers.py:386-388"
            return: {recorded: false}
      - call: logging-stat-logger.record
        input: {iteration_stats: "= has(input.iteration_stats) ? input.iteration_stats : null", scheduler_stats: "= has(input.scheduler_stats) ? input.scheduler_stats : null", engine_idx: "= has(input.engine_idx) ? input.engine_idx : 0", aggregated: true}
      - if: "has(input.scheduler_stats) && input.scheduler_stats != null"
        then:
          - set: {state.last_scheduler_stats_dict: "= merge(state.last_scheduler_stats_dict, {string(has(input.engine_idx) ? input.engine_idx : 0): input.scheduler_stats})"}
      - return: {recorded: true}

  - component: per-engine-stat-logger-adapter
    name: record
    kind: function
    summary: "PerEngineStatLoggerAdapter.record: route the record to the per-engine logger of engine_idx; an unknown index is ignored with a warning."
    sources: ["vllm/v1/metrics/loggers.py:448-462"]
    request: {type: object, properties: {engine_idx: {type: integer, default: 0}, iteration_stats: {type: ["object", "null"], default: null}, scheduler_stats: {type: ["object", "null"], default: null}}}
    behavior:
      - set: {vars.idx: "= has(input.engine_idx) ? input.engine_idx : 0"}
      - if: "!(vars.idx in state.engine_indexes)"
        then:
          - title: "Unexpected engine_idx: warn and drop the record"
            source: "vllm/v1/metrics/loggers.py:455-457"
            return: {recorded: false}
      - title: "per_engine_stat_loggers[engine_idx].record(...)"
        source: "vllm/v1/metrics/loggers.py:458-462"
        set: {state.records: "= merge(state.records, {string(vars.idx): (string(vars.idx) in state.records ? state.records[string(vars.idx)] : 0) + 1})"}
      - return: {recorded: true}

  # ------------------------------------------------------------------ AsyncLLM / LLMEngine getters (unskipped)
  - component: async-llm
    name: get-tokenizer
