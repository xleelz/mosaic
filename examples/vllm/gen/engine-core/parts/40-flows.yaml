flows:
  - id: engine-startup
    name: Engine startup (AsyncLLM.from_engine_args)
    description: "The API server builds AsyncLLM: executor class, stat-logger plugins, the engine-core process (executor, worker model load, memory profiling, KV cache sizing, warm-up), the READY handshake, then the busy loop starts."
    tags: [writes]
    sources: ["vllm/v1/engine/async_llm.py:269-291", "vllm/v1/engine/core.py:1391-1529"]
    entry: {caller: api-server, interface: async-llm.from-engine-args, input: {model: meta-llama/Llama-3.1-8B-Instruct, served_model_name: llama-8b}}
  - id: engine-core-busy-loop
    name: Engine-core busy loop
    description: "EngineCoreProc.run_busy_loop under fault_tolerant_wrapper: each iteration handles shutdown, drains the input queue, and steps (schedule -> execute_model on the ranks -> update_from_output -> outputs to the client); it re-schedules itself."
    tags: [writes]
    sources: ["vllm/v1/engine/core.py:1547-1558", "vllm/v1/fault_tolerance/engine_core_sentinel.py:176-194"]
    entry: {caller: engine-core, interface: engine-core-proc.run-busy-loop, input: {iterations: 40}}
  - id: async-llm-generate
    name: AsyncLLM.generate
    description: "One request from the API server: validate, admit, register, ADD over ZMQ, then stream RequestOutputs the output handler puts into the request's collector."
    tags: [writes]
    sources: ["vllm/v1/engine/async_llm.py:698-823"]
    entry:
      caller: api-server
      interface: async-llm.generate
      input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906, 11, 856, 836, 374], sampling_params: {max_tokens: 4, n: 1, temperature: 0.0, stop: []}, priority: 0}
  - id: async-llm-abort
    name: AsyncLLM.abort
    description: "Abort by request id: final ABORT output to the stream, ABORT to the engine core (aborts queue and input queue)."
    tags: [writes]
    sources: ["vllm/v1/engine/async_llm.py:911-922"]
    entry: {caller: api-server, interface: async-llm.abort, input: {request_ids: [chatcmpl-abc123], internal: false}}
  - id: llm-engine-add-request
    name: LLMEngine.add_request
    description: "The offline path: process inputs, register without a queue, ADD over the SyncMPClient."
    tags: [writes, "feature:offline-llm"]
    sources: ["vllm/v1/engine/llm_engine.py:229-317"]
    entry:
      caller: python-user
      interface: llm-engine.add-request
      input: {request_id: "0", prompt_token_ids: [128000, 9906, 11, 856, 836, 374], sampling_params: {max_tokens: 4, n: 1}}
  - id: llm-engine-step
    name: LLMEngine.step
    description: "Block for the next EngineCoreOutputs from the SyncMPClient and turn them into RequestOutputs."
    tags: ["feature:offline-llm"]
    sources: ["vllm/v1/engine/llm_engine.py:319-366"]
    entry: {caller: python-user, interface: llm-engine.step}
  - id: async-llm-sleep
    name: Sleep and wake up
    description: "AsyncLLM.sleep: pause the scheduler, then offload weights / discard the KV cache on the workers; wake_up reverses it."
    tags: [writes]
    sources: ["vllm/v1/engine/async_llm.py:1154-1175", "vllm/v1/engine/core.py:959-1019"]
    entry: {caller: api-server, interface: async-llm.sleep, input: {level: 1, mode: abort}}
  - id: async-llm-pause-generation
    name: Pause and resume generation
    description: "AsyncLLM.pause_generation: abort/wait/keep in-flight requests, set the scheduler's pause state, finish the pause when idle."
    tags: [writes]
    sources: ["vllm/v1/engine/async_llm.py:952-992", "vllm/v1/engine/core.py:2061-2103"]
    entry: {caller: api-server, interface: async-llm.pause-generation, input: {mode: abort, clear_cache: true}}
  - id: async-llm-lora
    name: LoRA adapters
    description: "AsyncLLM.add_lora/remove_lora/pin_lora/list_loras: utility calls the engine core turns into collective_rpc on every worker."
    sources: ["vllm/v1/engine/async_llm.py:1189-1203"]
    entry: {caller: api-server, interface: async-llm.add-lora, input: {lora_request: {lora_name: sql-adapter, lora_int_id: 1, lora_path: /models/lora/sql-adapter}}}
  - id: engine-shutdown
    name: Engine shutdown
    description: "AsyncLLM.shutdown: SIGTERM to the engine core, which aborts (shutdown_timeout 0) or drains in-flight requests, shuts the executor and every worker down and exits once idle; the process manager force-kills it after the grace; the client marks the engine dead."
    tags: [writes, "feature:graceful-shutdown"]
    sources: ["vllm/v1/engine/async_llm.py:296-308", "vllm/v1/engine/core.py:1626-1672"]
    entry: {caller: operator, interface: async-llm.shutdown}
  - id: engine-fault-tolerance
    name: Fault-tolerance instruction
    description: "AsyncLLM.handle_fault: an FT instruction (retry) goes straight to the sentinel, which resumes a parked engine."
    tags: [writes]
    sources: ["vllm/v1/engine/async_llm.py:1289-1293", "vllm/v1/fault_tolerance/engine_core_sentinel.py:50-138"]
    entry: {caller: operator, interface: async-llm.handle-fault, input: {request_id: ft-1, instruction: retry, params: {}}}
  - id: weight-version
    name: Weight version
    description: "AsyncLLM.update_weight_version / get_weight_version: the engine core's opaque weight version, attached to every later EngineCoreOutputs."
    tags: [writes]
    sources: ["vllm/v1/engine/async_llm.py:1357-1363", "vllm/v1/engine/core.py:1082-1087"]
    entry: {caller: api-server, interface: async-llm.update-weight-version, input: {new_version: step-200}}
  - id: metrics-histogram-buckets
    name: Histogram bucket families
    description: "histogram_buckets: the default Prometheus bucket boundaries per family, the 1-2-5 request-token series, and overrides."
    sources: ["vllm/v1/metrics/buckets.py:206-240"]
    entry: {caller: api-server, interface: buckets.histogram-buckets, input: {family: request_latency}}
  - id: async-llm-parallel-sampling
    name: Parallel sampling (n > 1)
    description: "AsyncLLM.generate with n > 1: ParentRequest fans the request out into n child requests sharing one stream; the output processor merges them, and the parent output finishes when every child has."
    tags: [writes, "feature:parallel-sampling"]
    sources: ["vllm/v1/engine/async_llm.py:529-556", "vllm/v1/engine/parallel_sampling.py:84-128"]
    entry:
      caller: api-server
      interface: async-llm.generate
      input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906, 11, 856, 836, 374], sampling_params: {max_tokens: 4, n: 2, temperature: 0.8, stop: []}, priority: 0}
  - id: dp-client-add-request
    name: Data-parallel request routing
    description: "With data_parallel_size > 1 the DPLBAsyncMPClient routes each ADD to the least-loaded engine-core process (instances dp0, dp1, ...) and fans utilities out to all of them."
    tags: [writes, "feature:data-parallel"]
    sources: ["vllm/v1/engine/core_client.py:1582-1697"]
    entry:
      caller: api-server
      interface: dp-lb-async-mp-client.add-request-async
      input: {request_id: chatcmpl-abc123-00000001, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, n: 1}, priority: 0, arrival_time: 0.0}

fixtures:
  - id: engine-core-seed
    summary: "engine-core's starting state for merged worlds: a live client with no requests, an awake executor, a running engine-core process with an async (AsyncLLM) client, a healthy sentinel."
    state:
      async-mp-client: {engine_dead: false, engine_status: {}}
      engine-core-proc: {shutdown_state: RUNNING, client_kind: async, aborts_queue: []}
      executor: {sleeping_tags: []}
      engine-core-sentinel: {status_type: HEALTHY, resumed: true}
  - id: engine-core-tp4-llama-70b-host
    summary: "The tp4 world's host as the deployment has it: four visible GPUs, so the TP 4 world size passes ParallelConfig's device check (parallel.py) before engine-core starts the multiproc executor. config-platform-seed describes a one-GPU host; this variant overrides its counts in the merged tp4 world only."
    attributes: {variant_of: tp4-llama-70b}
    state:
      platforms: {host: {nvml_available: true, nvml_gpu_count: 4, device_name: "NVIDIA H100 80GB HBM3", device_total_memory: 85899345920, device_count: 4, cpu_architecture: X86}}
