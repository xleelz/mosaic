  # ------------------------------------------------------------------ startup
  - id: engine-core-startup-tp1
    name: Startup on one GPU uses the in-process executor
    description: "world_size 1 resolves the uni backend: the engine core inits and loads the model on rank0 in-process, profiles free memory, sizes the KV cache (2000 blocks), warms up, and the READY handshake returns; the busy loop then starts."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-startup, as: up}
      - {interface: async-llm.get-supported-tasks, caller: api-server, as: tasks}
