  - id: engine-core-parallel-sampling-merge
    name: n=2 children share one stream; the parent output finishes when both children have
    description: "Both children (0_<id>, 1_<id>) are registered with the one parent queue; each child's output lands there as completion index 0 or 1; the stream ends only when no child remains, and its request_id is the external id."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
