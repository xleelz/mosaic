      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.finish-requests' && e.input.request_ids == ['chatcmpl-abc123'])"

  - id: engine-core-drain-wait
    name: wait_for_requests_to_drain returns at once when idle and times out when busy
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.wait-for-requests-to-drain, caller: api-server, as: idle, choices: *idle}
