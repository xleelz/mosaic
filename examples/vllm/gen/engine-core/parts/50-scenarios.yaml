      - {interface: async-llm.list-loras, caller: api-server, as: list}
      - {interface: async-llm.remove-lora, caller: api-server, as: rm, input: {lora_id: 1}}
    expect:
      - "steps.add.result.value == true && steps.pin.result.value == true && steps.rm.result.value == true"
      - "steps.list.result.value == [1]"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.add-lora').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.pin-lora').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.remove-lora').size() == 1"

  - id: engine-core-lora-invalid-id
