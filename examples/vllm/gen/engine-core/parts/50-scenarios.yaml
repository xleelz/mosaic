x-gen-input: &gen_input {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906, 11, 856, 836, 374], sampling_params: {max_tokens: 4, n: 1, temperature: 0.0, stop: []}, priority: 0}
x-idle: &idle {engine-core-proc.has-work.scheduler_has_requests: idle}
x-busy: &busy {engine-core-proc.has-work.scheduler_has_requests: busy}
x-add: &add {interface: async-llm.add-request, caller: api-server, as: add, input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906, 11, 856, 836, 374], sampling_params: {max_tokens: 4, n: 1}}}

scenarios:
  # ------------------------------------------------------------------ generate
  - id: engine-core-generate-happy
    name: A request streams to completion while the busy loop runs
    description: "The busy loop starts first (await: false); generate adds the request at t=0. The input thread queues the ADD, the next iteration hands it to the scheduler, and under async scheduling the step's outputs come back one iteration later through the output thread, the client's socket task and the output handler into the request's collector."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, input: *gen_input}
    expect:
      - "steps.gen.result.ok && steps.gen.result.value.value.finished"
      - "steps.gen.result.value.value.request_id == 'chatcmpl-abc123'"
      - "steps.gen.result.value.value.finish_reason in ['stop', 'length'] && size(steps.gen.result.value.value.token_ids) > 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.add-request' && e.input.request_id == 'chatcmpl-abc123-00000001')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.execute-model' && e.instance == 'rank0')"

  - id: engine-core-generate-batch-queue-lag
    name: Under async scheduling the first step returns no outputs
    description: "step_with_batch_queue launches the first batch and returns None (queue of 2 not full); the second call launches another batch and only then blocks on the first one and updates the scheduler."
    fixtures: [full-tp1-llama-8b]
    steps:
      - *add
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 2}}
    expect:
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.schedule').size() == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.update-from-output').size() == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.update-from-output')[0].seq > trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.schedule')[1].seq"

  - id: engine-core-generate-sync-step
    name: Without async scheduling every step returns its own outputs
    description: "async_scheduling off: step_fn is EngineCore.step; schedule, execute_model, sample (execute_model returned None only on the V1 runner path), update_from_output in one call."
    fixtures: [full-tp1-llama-8b]
    config: {async-scheduling: false}
    steps:
      - *add
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 2}}
    expect:
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.update-from-output').size() == 2"

  - id: engine-core-generate-empty-prompt
    name: An empty prompt is refused before anything is sent
    fixtures: [full-tp1-llama-8b]
    flow: async-llm-generate
    input: {prompt_token_ids: []}
    expect:
      - "!result.ok && result.error.code == 'vllm-validation-error' && result.error.message == 'The decoder prompt cannot be empty'"

  - id: engine-core-generate-prompt-too-long
    name: A prompt longer than max_model_len is refused
    fixtures: [full-tp1-llama-8b]
    config: {max-model-len: 4}
    flow: async-llm-generate
    expect:
      - "!result.ok && result.error.code == 'vllm-validation-error' && result.error.message.contains('is longer than the maximum model length of 4')"

  - id: engine-core-generate-prompt-fills-context
    name: A prompt exactly max_model_len long leaves no room for output
    fixtures: [full-tp1-llama-8b]
    config: {max-model-len: 6}
    flow: async-llm-generate
    expect:
      - "!result.ok && result.error.code == 'vllm-validation-error' && result.error.message.contains('plus the number of requested output tokens')"

  - id: engine-core-generate-queue-overflow
    name: max_num_queued_reqs rejects with QueueOverflowError (503)
    description: "One request is already in flight; with max_num_queued_reqs 1 the next is rejected before registration, and the admission rejection is counted."
    fixtures: [full-tp1-llama-8b]
    config: {max-num-queued-reqs: 1}
    state:
      output-processor: {request_states: {chatcmpl-old-00000009: {external_req_id: chatcmpl-old, prompt_len: 10, is_prefilling: false, output_text: "", num_output_tokens: 3, stop: [], parent: null, has_queue: true}}}
    steps:
      - {flow: async-llm-generate, as: gen}
      - {interface: async-llm.get-num-unfinished-requests, caller: api-server, as: n}
    expect:
      - "!steps.gen.result.ok && steps.gen.result.error.code == 'queue-overflow-error' && steps.gen.result.error.data.http_status == 503"
      - "steps.gen.result.error.message == 'The engine is currently busy and cannot accept new requests. Please try again later or on a different instance.'"
      - "steps.n.result.value == 1"
      - "state['prometheus-registry'].metrics['vllm:admission_rejections{model_name=\"llama-8b\",reason=\"max_num_queued_reqs\"}'] == 1"

  - id: engine-core-generate-queued-tokens-full
    name: max_num_queued_tokens rejects while prompts are still prefilling
    fixtures: [full-tp1-llama-8b]
    config: {max-num-queued-tokens: 8}
    state:
      output-processor: {request_states: {chatcmpl-old-00000009: {external_req_id: chatcmpl-old, prompt_len: 10, is_prefilling: true, output_text: "", num_output_tokens: 0, stop: [], parent: null, has_queue: true}}}
    flow: async-llm-generate
    expect:
      - "!result.ok && result.error.code == 'max-queued-tokens-error'"
      - "state['prometheus-registry'].metrics['vllm:admission_rejections{model_name=\"llama-8b\",reason=\"max_num_queued_tokens\"}'] == 1"
      - "result.error.message == 'The engine has reached its prefill token backlog limit. Please try again later or on a different instance.'"

  - id: engine-core-generate-engine-dead
    name: generate on a dead engine raises EngineDeadError without an abort
    fixtures: [full-tp1-llama-8b]
    state:
      async-mp-client: {engine_dead: true}
    flow: async-llm-generate
    expect:
      - "!result.ok && result.error.code == 'engine-dead-error' && result.error.status == 500"

  - id: engine-core-generate-stop-string
    name: A stop string ends the request in the detokenizer
    description: "The detokenized text contains the stop string, so the output processor finishes the request with finish_reason stop and the matched string as stop_reason; the engine had already finished it, so no abort is sent."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, n: 1, stop: [' t']}}}
    expect:
      - "steps.gen.result.ok && steps.gen.result.value.value.finish_reason == 'stop'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.finish-requests')"

  - id: engine-core-output-stop-string-aborts-engine
    name: A stop string the engine didn't see makes the frontend abort it
    description: "process_outputs gets a still-running output (finish_reason null) whose text hits a stop string: the frontend finishes it and returns it in reqs_to_abort for an ABORT to the engine core."
    fixtures: [full-tp1-llama-8b]
    state:
      output-processor: {request_states: {chatcmpl-abc123-00000001: {external_req_id: chatcmpl-abc123, prompt_len: 6, is_prefilling: true, output_text: "", num_output_tokens: 0, stop: [t42], parent: null, has_queue: true}}, external_req_ids: {chatcmpl-abc123: [chatcmpl-abc123-00000001]}}
      request-output-collector: {queues: {chatcmpl-abc123-00000001: {output: null, error: null}}}
    steps:
      - interface: async-llm.output-handler
        caller: api-server
        as: oh
        input: {outputs: {outputs: [{request_id: chatcmpl-abc123-00000001, new_token_ids: [42, 7], finish_reason: null, stop_reason: null}, {request_id: chatcmpl-gone-00000003, new_token_ids: [5], finish_reason: null, stop_reason: null}]}}
      - {interface: request-output-collector.get, caller: api-server, as: got, input: {request_id: chatcmpl-abc123-00000001}}
    expect:
      - "steps.oh.result.value.reqs_to_abort == ['chatcmpl-abc123-00000001']"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-input-sockets' && e.input.request_type == 'ABORT')"
      - "steps.got.result.value.output.finish_reason == 'stop' && steps.got.result.value.output.stop_reason == 't42'"

  - id: engine-core-generate-n2-fanout
    name: n=2 fans out two child requests
    description: "ParentRequest names the children 0_<id> and 1_<id>; admission counts 2 slots; each child is registered and sent as its own ADD."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.add-request, caller: api-server, as: add, input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, n: 2}}}
    expect:
      - "steps.add.result.value.children == ['0_chatcmpl-abc123-00000001', '1_chatcmpl-abc123-00000001']"
      - "channel_len('engine-core-input:') == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-input-sockets' && e.input.request_type == 'ADD').size() == 2"

  - id: engine-core-generate-client-disconnect
    name: A client disconnect aborts the request in both processes
    description: "The client goes away while generate awaits its collector: CancelledError makes generate abort the request internally (final ABORT output, ABORT to the engine core), and the next iteration finishes it in the scheduler."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, await: false, input: *gen_input}
      - {cancel: disconnect-chatcmpl-abc123, at_ms: 16}
    expect:
      - "!steps.gen.result.ok && steps.gen.result.error.code == 'canceled'"
      - "ctx.generate_canceled == 'chatcmpl-abc123-00000001'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.finish-requests' && e.input.request_ids == ['chatcmpl-abc123-00000001'])"

  - id: engine-core-generate-engine-dies-mid-step
    name: A worker failure mid-step kills the engine and fails the stream
    description: "execute_model raises on the second step: with fault tolerance off the busy loop dies, run_engine_core sends ENGINE_CORE_DEAD, the client marks the engine dead and the output handler propagates EngineDeadError into every stream."
    fixtures: [full-tp1-llama-8b]
    faults:
      - {target: gpu-worker-impl.execute-model, type: error, code: cuda-error, message: "CUDA error: an illegal memory access was encountered", calls: [2]}
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, input: *gen_input}
    expect:
      - "!steps.gen.result.ok && steps.gen.result.error.code == 'engine-dead-error'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.shutdown')"

  - id: engine-core-generate-fault-tolerant
    name: With fault tolerance the engine parks instead of dying
    description: "enable_fault_tolerance: the same failure goes to EngineCoreSentinel.on_fault, which aborts every request (the stream ends with finish_reason abort), marks the engine UNHEALTHY and pushes the status to the client; the engine stays alive."
    fixtures: [full-tp1-llama-8b]
    config: {enable-fault-tolerance: true}
    faults:
      - {target: gpu-worker-impl.execute-model, type: error, code: cuda-error, calls: [2]}
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, input: *gen_input}
    expect:
      - "steps.gen.result.ok && steps.gen.result.value.value.finish_reason == 'abort'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.finish-requests') && !trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.shutdown')"

  - id: engine-core-ft-recovery-timeout
    name: A parked engine dies when no recovery comes in time
    fixtures: [full-tp1-llama-8b]
    config: {enable-fault-tolerance: true, engine-recovery-timeout-sec: 0}
    state:
      engine-core-sentinel: {status_type: UNHEALTHY, resumed: false, fault_info: cuda-error, fault_at: 1793318400000}
    steps:
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 3}}
    expect:
      - "!steps.loop.result.ok && steps.loop.result.error.code == 'runtime-error' && steps.loop.result.error.message.contains('No recovery within 0s')"
      - "state['engine-core-proc'].dead && state['async-mp-client'].engine_dead"

  - id: engine-core-ft-parked-loop-waits
    name: A parked engine polls for recovery without stepping
    fixtures: [full-tp1-llama-8b]
    config: {enable-fault-tolerance: true}
    state:
      engine-core-sentinel: {status_type: UNHEALTHY, resumed: false, fault_info: cuda-error, fault_at: 1793318400000}
    steps:
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 3}}
    expect:
      - "steps.loop.result.ok && steps.loop.result.value.parked"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.schedule').size() == 0"

  - id: engine-core-ft-retry-resumes
    name: A retry instruction resumes a parked engine, a second one is rejected
    description: "handle_fault(retry) reaches the sentinel through the input thread even while the loop is parked: workers get handle_ft_command, the engine becomes HEALTHY and resumed; repeating it is rejected because the engine is no longer UNHEALTHY."
    fixtures: [full-tp1-llama-8b]
    config: {enable-fault-tolerance: true}
    state:
      engine-core-sentinel: {status_type: UNHEALTHY, resumed: false, fault_info: cuda-error, fault_at: 1793318400000}
    steps:
      - {flow: engine-fault-tolerance, as: retry}
      - {flow: engine-fault-tolerance, as: again}
      - {interface: async-llm.get-status, caller: operator, as: status}
    expect:
      - "steps.retry.result.ok && steps.retry.result.value.success"
      - "!steps.again.result.value.success && steps.again.result.value.reason.contains('status is HEALTHY')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.handle-ft-command').size() == 1"
      - "steps.status.result.value.engines['0'].ft_error.contains('status is HEALTHY')"

  # ------------------------------------------------------------------ tensor parallel / multiproc executor
  - id: engine-core-tp4-step-on-every-rank
    name: With TP 4 every step runs on all four ranks
    description: "world_size 4 resolves the mp backend: collective_rpc broadcasts execute_model and sample_tokens to rank0..rank3 through each WorkerProc and waits for all of them (the reply comes from the output rank)."
    fixtures: [full-tp4-llama-70b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, input: *gen_input}
    expect:
      - "steps.gen.result.ok && steps.gen.result.value.value.finished"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.execute-model' && e.instance == 'rank0').size() > 0 && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.execute-model' && e.instance == 'rank0').size() == trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.execute-model' && e.instance == 'rank3').size()"

  - id: engine-core-tp4-rank-timeout
    name: A rank that never answers times execute_model out after 300 s
    description: "One rank's execute_model hangs: the collective RPC's dequeue deadline (VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS) expires, TimeoutError('RPC call to execute_model timed out.') kills the busy loop and the engine."
    fixtures: [full-tp4-llama-70b]
    faults:
      - {target: gpu-worker-impl.execute-model, type: latency, latency_ms: 400000, instance: rank3}
    steps:
      - *add
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 3}}
    expect:
      - "!steps.loop.result.ok && steps.loop.result.error.code == 'timeout-error' && steps.loop.result.error.message == 'RPC call to execute_model timed out.'"
      - "steps.loop.result.error.code == 'timeout-error'"
      - "duration_ms >= 300000"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.shutdown')"

  - id: engine-core-tp4-worker-dies
    name: A dead worker process fails the executor and the engine
    description: "The worker monitor sees rank2's process exit: it marks the executor failed, shuts it down and puts EXECUTOR_FAILED on the engine's input queue; the busy loop raises RuntimeError('Executor failed.') and the engine dies."
    fixtures: [full-tp4-llama-70b]
    steps:
      - {interface: multiproc-executor.monitor-workers, caller: engine-core, as: died, input: {died_rank: rank2, exitcode: -9}}
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 3}}
      - {interface: async-llm.check-health, caller: api-server, as: health}
    expect:
      - "steps.died.result.value.handled"
      - "!steps.loop.result.ok && steps.loop.result.error.message == 'Executor failed.'"
      - "!steps.health.result.ok && steps.health.result.error.code == 'engine-dead-error'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.shutdown')"

  - id: engine-core-tp4-monitor-ignores-shutdown
    name: Worker exits during shutdown are not failures
    fixtures: [full-tp4-llama-70b]
    state:
      multiproc-executor: {is_failed: false, shutting_down: true}
    steps:
      - {interface: multiproc-executor.monitor-workers, caller: engine-core, as: died, input: {died_rank: rank1, exitcode: 0}}
    expect:
      - "!steps.died.result.value.handled"

  - id: engine-core-failed-executor-refuses-rpc
    name: A failed multiproc executor refuses every collective RPC
    fixtures: [full-tp4-llama-70b]
    state:
      multiproc-executor: {is_failed: true, shutting_down: true}
    steps:
      - {interface: async-llm.list-loras, caller: api-server, as: l}
    expect:
      - "!steps.l.result.ok && steps.l.result.error.code == 'exception' && steps.l.result.error.message == 'Call to list_loras method failed: Executor failed.'"

  - id: engine-core-worker-rpc-failure
    name: A worker exception becomes a FAILURE reply and a RuntimeError
    fixtures: [full-tp4-llama-70b]
    faults:
      - {target: gpu-worker-impl.list-loras, type: error, code: value-error, instance: rank1}
    steps:
      - {interface: async-llm.list-loras, caller: api-server, as: l}
    expect:
      - "!steps.l.result.ok && steps.l.result.error.message.startsWith('Call to list_loras method failed: ')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.list-loras' && e.instance == 'rank1').size() == 1"

  # ------------------------------------------------------------------ abort, shutdown
  - id: engine-core-abort-then-step
    name: An abort is acknowledged to the stream and applied by the next iteration
    description: "AsyncLLM.abort with the external id: the output processor maps it to the internal id, drops it and queues a final ABORT output; the ABORT goes on the engine's aborts queue and input queue; the next busy-loop iteration finishes it in the scheduler."
    fixtures: [full-tp1-llama-8b]
    state:
      output-processor: {request_states: {chatcmpl-abc123-00000001: {external_req_id: chatcmpl-abc123, prompt_len: 6, is_prefilling: false, output_text: " t9906", num_output_tokens: 1, stop: [], parent: null, has_queue: true}}, external_req_ids: {chatcmpl-abc123: [chatcmpl-abc123-00000001]}}
      request-output-collector: {queues: {chatcmpl-abc123-00000001: {output: null, error: null}}}
    steps:
      - {flow: async-llm-abort, as: ab}
      - {interface: request-output-collector.get, caller: api-server, as: got, input: {request_id: chatcmpl-abc123-00000001}}
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 1}}
    expect:
      - "steps.ab.result.value.aborted == ['chatcmpl-abc123-00000001']"
      - "steps.got.result.value.output.finish_reason == 'abort' && steps.got.result.value.output.finished"
      - "channel_len('engine-core-input:') == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.finish-requests' && e.input.request_ids == ['chatcmpl-abc123-00000001'])"

  - id: engine-core-abort-unknown-id
    name: Aborting an unknown id sends nothing to the engine
    fixtures: [full-tp1-llama-8b]
    flow: async-llm-abort
    input: {request_ids: [chatcmpl-nope], internal: false}
    expect:
      - "result.ok && result.value.aborted == []"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-input-sockets').size() == 0"

  - id: engine-core-abort-during-step
    name: An abort arriving mid-step is applied before update_from_output
    description: "The ABORT lands while the step runs: the input thread puts it on the aborts queue, and the step drains that queue (one batched abort) before update_from_output."
    fixtures: [full-tp1-llama-8b]
    config: {async-scheduling: false}
    steps:
      - *add
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 2}}
      - {interface: async-mp-client.abort-requests-async, caller: api-server, as: ab, at_ms: 27, input: {request_ids: [chatcmpl-abc123-00000001]}}
    expect:
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core.abort-requests')[0].seq < trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.update-from-output')[0].seq"
      - "size(state['engine-core-proc'].aborts_queue) == 0"

  - id: engine-core-shutdown-then-health
    name: After shutdown the engine reports dead
    description: "AsyncLLM.shutdown sends SIGTERM (shutdown requested) and runs the client's cleanup (engine_dead); check_health then raises EngineDeadError."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-shutdown, as: sd}
      - {interface: async-llm.check-health, caller: api-server, as: health}
    expect:
      - "steps.sd.result.ok"
      - "steps.sd.result.value.killed && steps.sd.duration_ms >= 5000"
      - "!steps.health.result.ok && steps.health.result.error.code == 'engine-dead-error'"
      - "trace.exists(e, e.type == 'kill')"

  - id: engine-core-shutdown-aborts-in-flight
    name: SIGTERM with shutdown_timeout 0 aborts everything, then the loop exits when idle
    description: "The next iteration sees REQUESTED: it finishes every request as aborted, sends the ABORT outputs, moves to SHUTTING_DOWN; with no work left the loop exits and the engine shuts down."
    fixtures: [full-tp1-llama-8b]
    state:
      engine-core-proc: {shutdown_state: RUNNING}
    steps:
      - {interface: engine-core-proc.signal-handler, caller: operator, as: sig, input: {signal: SIGTERM}}
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 2}, choices: *idle}
    expect:
      - "steps.sig.result.value.shutdown_state == 'REQUESTED'"
      - "steps.loop.result.ok && steps.loop.result.value.exited"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.finish-requests' && e.input.request_ids == null)"

  - id: engine-core-shutdown-drain
    name: With a shutdown timeout the engine drains instead of aborting
    fixtures: [full-tp1-llama-8b]
    config: {shutdown-timeout: 30}
    state:
      engine-core-proc: {shutdown_state: REQUESTED}
    steps:
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 1}, choices: *busy}
    expect:
      - "ctx.shutdown_mode == 'drain' && trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.finish-requests').size() == 0"

  - id: engine-core-add-rejected-in-shutdown
    name: New requests are rejected with ABORT once shutdown started
    fixtures: [full-tp1-llama-8b]
    state:
      engine-core-proc: {shutdown_state: SHUTTING_DOWN}
    steps:
      - {interface: engine-core-proc.process-input-sockets, caller: async-mp-client, as: in, input: {request_type: ADD, request: {request_id: chatcmpl-late-00000004, prompt_token_ids: [1, 2], sampling_params: {max_tokens: 4}}}}
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 1}, choices: *busy}
    expect:
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.add-request').size() == 0"

  - id: engine-core-utility-rejected-in-shutdown
    name: Utility calls fail with 'Server shutting down' during shutdown
    fixtures: [full-tp1-llama-8b]
    state:
      engine-core-proc: {shutdown_state: SHUTTING_DOWN}
    steps:
      - {interface: async-llm.is-sleeping, caller: api-server, as: s}
    expect:
      - "!steps.s.result.ok && steps.s.result.error.code == 'exception' && steps.s.result.error.message == 'Server shutting down'"

  - id: engine-core-utility-unknown-method
    name: An unknown utility method fails with its AttributeError text
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-mp-client.call-utility-async, caller: api-server, as: u, input: {method: no_such_method}}
    expect:
      - "!steps.u.result.ok && steps.u.result.error.message.contains(\"has no attribute 'no_such_method'\")"

  # ------------------------------------------------------------------ pause, sleep, wake
  - id: engine-core-pause-abort-idle
    name: pause_generation(abort) aborts in-flight requests and completes at once when idle
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: async-llm-pause-generation, as: p, choices: *idle}
      - {interface: async-llm.is-paused, caller: api-server, as: paused}
    expect:
      - "steps.p.result.ok && steps.p.result.value == null"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'engine-core-proc.pause-scheduler' && e.output.pending == false)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.set-pause-state' && e.input.pause_state == 'PAUSED_NEW')"
      - "calls['gpu-worker-impl.synchronize-device'] == 1 && calls['scheduler.reset-prefix-cache'] == 1"
      - "calls['scheduler.pause-state'] == 1"

  - id: engine-core-pause-keep-completes-when-idle
    name: pause_generation(keep) completes from the idle callback
    description: "keep sets PAUSED_ALL without aborting; the engine still has work, so the pause registers an idle callback and the utility reply waits; the next idle iteration runs it (device sync, cache clear) and the deferred reply completes pause_generation."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: async-llm-pause-generation, as: p, input: {mode: keep, clear_cache: false}, choices: *busy, await: false}
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 1}, choices: *idle, at_ms: 5}
    expect:
      - "steps.p.result.ok && steps.p.result.value == null && calls['scheduler.finish-requests'] == 0"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'engine-core-proc.pause-scheduler' && e.output.pending)"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'async-llm.pause-generation').all(e, e.t >= 5)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-output-sockets' && has(e.input.outputs.utility_output) && e.input.outputs.utility_output.failure_message == null)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.set-pause-state' && e.input.pause_state == 'PAUSED_ALL')"
      - "calls['scheduler.reset-prefix-cache'] == 0"

  - id: engine-core-pause-invalid-mode
    name: An invalid pause mode is a ValueError
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: engine-core-proc.pause-scheduler, caller: engine-core, as: p, input: {mode: freeze}}
    expect:
      - "!steps.p.result.ok && steps.p.result.error.code == 'value-error' && steps.p.result.error.message == 'Invalid pause mode: freeze'"

  - id: engine-core-resume-generation
    name: resume_generation unpauses the scheduler
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.resume-generation, caller: api-server, as: r}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.set-pause-state' && e.input.pause_state == 'UNPAUSED')"

  - id: engine-core-sleep-level1-then-wake
    name: Sleep level 1 offloads weights; wake_up restores and resumes scheduling
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: async-llm-sleep, as: sl, choices: *idle}
      - {interface: executor.is-sleeping, caller: engine-core, as: asleep}
      - {interface: async-llm.wake-up, caller: api-server, as: wake}
    expect:
      - "steps.sl.result.ok && steps.sl.result.value == null && trace.exists(e, e.type == 'call.end' && e.interface == 'engine-core.sleep' && e.output.level == 1 && !e.output.pending)"
      - "steps.asleep.result.value == true"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.sleep').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.wake-up').size() == 1"
      - "steps.wake.result.value == true"

  - id: engine-core-sleep-level0
    name: Sleep level 0 pauses scheduling only
    fixtures: [full-tp1-llama-8b]
    flow: async-llm-sleep
    input: {level: 0}
    choices: *idle
    expect:
      - "result.ok && result.value == null && trace.exists(e, e.type == 'call.end' && e.interface == 'engine-core.sleep' && e.output.level == 0)"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.sleep').size() == 0 && trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.reset-prefix-cache').size() == 0"

  - id: engine-core-sleep-deferred-while-busy
    name: Sleep waits for in-flight requests when the pause can't finish yet
    description: "Requests in flight: the pause is pending, so EngineCore.sleep returns a Future and the reply waits. Once the loop goes idle the pause callback finishes the pause, then sleeps the executor, and only then does the reply come (core.py:984-994)."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: async-llm-sleep, as: sl, input: {level: 1}, choices: *busy, await: false}
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 1}, choices: *idle, at_ms: 5}
    expect:
      - "steps.sl.result.ok && steps.sl.result.value == null"
      - "ctx.sleep_deferred && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.sleep').size() == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.sleep').all(e, e.t >= 5)"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'executor.sleep').all(s, trace.exists(f, f.type == 'call.end' && f.interface == 'engine-core.finish-pause' && f.t <= s.t))"

  - id: engine-core-sleep-twice-is-noop
    name: Sleeping executors don't sleep again
    fixtures: [full-tp1-llama-8b]
    state:
      executor: {sleeping_tags: [weights, kv_cache]}
    flow: async-llm-sleep
    choices: *idle
    expect:
      - "result.ok && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.sleep').size() == 0"

  - id: engine-core-wake-up-partial
    name: Waking only the weights keeps scheduling paused
    description: "With weights and kv_cache asleep, wake_up(['weights']) restores the weights but the executor is still partly asleep, so the scheduler stays paused; an unknown tag is ignored with a warning."
    fixtures: [full-tp1-llama-8b]
    state:
      executor: {sleeping_tags: [weights, kv_cache]}
    steps:
      - {interface: async-llm.wake-up, caller: api-server, as: w1, input: {tags: [weights]}}
      - {interface: async-llm.wake-up, caller: api-server, as: w2, input: {tags: [cuda_graphs]}}
      - {interface: async-llm.wake-up, caller: api-server, as: w3, input: {tags: [scheduling]}}
    expect:
      - "steps.w1.result.value == false"
      - "calls['scheduler.set-pause-state'] == 0 && calls['gpu-worker-impl.wake-up'] == 1"
      - "steps.w3.result.value == false"

  - id: engine-core-wake-up-when-awake
    name: wake_up on an awake engine resumes scheduling only
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.wake-up, caller: api-server, as: w}
    expect:
      - "steps.w.result.value == true && calls['gpu-worker-impl.wake-up'] == 0"
      - "calls['scheduler.set-pause-state'] == 1"

  - id: engine-core-release-kv-requires-pause
    name: release_kv_cache_memory refuses unless paused and idle
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.release-kv-cache-memory, caller: api-server, as: r}
    expect:
      - "!steps.r.result.ok && steps.r.result.error.message.contains('requires a completed pause first')"
      - "calls['gpu-worker-impl.discard'] == 0"

  # ------------------------------------------------------------------ LoRA, profile, weights, misc utilities
  - id: engine-core-lora-add-pin-list-remove
    name: LoRA adapters are loaded on every worker
    fixtures: [full-tp1-llama-8b, lora-adapter-on-disk]
    config: {enable-lora: true}
    steps:
      - {flow: async-llm-lora, as: add}
