          1_chatcmpl-p-00000001: {external_req_id: chatcmpl-p, prompt_len: 2, is_prefilling: false, output_text: "", num_output_tokens: 0, token_ids: [], output_kind: final_only, stop: [], parent: chatcmpl-p-00000001, index: 1, queue_id: chatcmpl-p-00000001, has_queue: true}
        parent_requests:
