  - id: oracle-build-engine-core-3
    name: "test_preprocess_error_handling: a preprocessing error fails one request, the engine keeps serving"
    description: "tests/v1/engine/test_preprocess_error_handling.py:13. EngineCore.preprocess_add_request raises ValueError for the first request (prompt [333]); the input thread answers it with an empty ERROR output, and a following normal request generates tokens and finishes with stop or length."
    fixtures: [full-tp1-llama-8b]
    state:
      engine-core-proc: {client_kind: sync}
    faults:
      - {target: engine-core.preprocess-add-request, type: error, code: value-error, message: "Simulated preprocessing error!", calls: [1]}
    steps:
      - {flow: llm-engine-add-request, as: bad, input: {request_id: fail-req, prompt_token_ids: [333], sampling_params: {max_tokens: 10, n: 1}}}
      - {flow: llm-engine-step, as: s1}
      - {flow: llm-engine-add-request, as: good, input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906, 11, 856, 836, 374], sampling_params: {max_tokens: 10, n: 1}}}
      - {flow: llm-engine-step, as: s2}
      - {flow: llm-engine-step, as: s3}
      - {flow: llm-engine-step, as: s4}
      - {flow: llm-engine-step, as: s5}
      - {flow: llm-engine-step, as: s6}
      - {flow: llm-engine-step, as: s7}
      - {flow: llm-engine-step, as: s8}
      - {flow: llm-engine-step, as: s9}
      - {flow: llm-engine-step, as: s10}
      - {flow: llm-engine-step, as: s11}
      - {flow: llm-engine-step, as: s12}
      - {flow: llm-engine-step, as: s13}
    expect:
      - "size(steps.s1.result.value.request_outputs) == 1"
      - "steps.s1.result.value.request_outputs[0].request_id == 'fail-req' && size(steps.s1.result.value.request_outputs[0].token_ids) == 0"
      - "steps.s1.result.value.request_outputs[0].finished && steps.s1.result.value.request_outputs[0].finish_reason == 'error'"
      - "[steps.s2, steps.s3, steps.s4, steps.s5, steps.s6, steps.s7, steps.s8, steps.s9, steps.s10, steps.s11, steps.s12, steps.s13].exists(st, st.result.value.request_outputs.exists(o, o.request_id == 'chatcmpl-abc123' && o.finished && o.finish_reason in ['stop', 'length']))"
      - "[steps.s2, steps.s3, steps.s4, steps.s5, steps.s6, steps.s7, steps.s8, steps.s9, steps.s10, steps.s11, steps.s12, steps.s13].exists(st, st.result.value.request_outputs.exists(o, o.request_id == 'chatcmpl-abc123' && size(o.token_ids) > 0))"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.add-request').size() == 1"

  - id: engine-core-generate-caller-cancel-token
    name: The caller's disconnect token cancels generate and aborts the request
    description: "serving-api passes its own disconnect token as cancel_token; cancelling it fails generate's pending await, and generate aborts the request in the output processor and the engine core."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 30}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, await: false, input: {request_id: chatcmpl-req-1, cancel_token: disconnect-req-1, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, n: 1}}}
      - {cancel: disconnect-req-1, at_ms: 16}
    expect:
      - "!steps.gen.result.ok && steps.gen.result.error.code == 'canceled'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-input-sockets' && e.input.request_type == 'ABORT' && e.input.request_ids == ['chatcmpl-req-1-00000001'])"

  - id: engine-core-errored-state
    name: errored reads the engine-dead state and the output handler's liveness
    description: "A dead engine (engine_dead seeded, as ENGINE_CORE_DEAD leaves it) or a finished output handler makes AsyncLLM.errored true; a live one is false."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.errored, caller: api-server, as: live}
      - {interface: async-mp-client.process-outputs-socket, caller: engine-core, as: dead, input: {dead: true}}
      - {interface: async-llm.errored, caller: api-server, as: after}
    expect:
      - "!steps.live.result.value.errored && steps.live.result.value.is_running"
      - "steps.after.result.value.errored && !steps.after.result.value.is_running"
      - "state['async-mp-client'].engine_dead && state['async-llm'].output_handler_done"

