      - "steps.up.result.ok && steps.up.result.value.executor_class == 'UniProcExecutor'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.initialize-from-config' && e.input.num_blocks == steps.up.result.value.num_gpu_blocks)"
      - "calls_by_instance['gpu-worker-impl.load-model@rank0'] == 1 && calls['gpu-worker-impl.compile-or-warm-up-model'] == 1"
      - "steps.tasks.result.value == ['generate']"

  - id: engine-core-startup-tp4
    name: Startup with TP 4 spawns a worker process per rank
    fixtures: [full-tp4-llama-70b]
    steps:
      - {flow: engine-startup, as: up}
    expect:
      - "steps.up.result.value.executor_class == 'MultiprocExecutor'"
