      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.list-loras').size() == 4"

  - id: engine-core-profile-start-twice
    name: A second start_profile is rejected while a session is active
    fixtures: [full-tp1-llama-8b]
    config: {profiler: torch}
    steps:
      - {interface: async-llm.start-profile, caller: api-server, as: p1}
      - {interface: async-llm.start-profile, caller: api-server, as: p2}
      - {interface: async-llm.stop-profile, caller: api-server, as: stop}
      - {interface: async-llm.start-profile, caller: api-server, as: p3}
    expect:
      - "steps.p1.result.ok && !steps.p2.result.ok && steps.p2.result.error.code == 'profiler-already-active-error'"
      - "steps.p3.result.ok && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.profile').size() == 3"

  - id: engine-core-profile-engine-failure-clears-session
    name: A failed profiler start clears the session
    fixtures: [full-tp1-llama-8b]
    config: {profiler: torch}
    faults:
      - {target: gpu-worker-impl.profile, type: error, code: runtime-error, calls: [1]}
    steps:
      - {interface: async-llm.start-profile, caller: api-server, as: p1}
      - {interface: async-llm.start-profile, caller: api-server, as: p2}
    expect:
      - "!steps.p1.result.ok && steps.p2.result.ok"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.profile').size() == 2"

  - id: engine-core-weight-version-write-read
    name: The weight version set by the trainer is read back and attached to outputs
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.get-weight-version, caller: api-server, as: before}
      - {flow: weight-version, as: set}
      - {interface: async-llm.get-weight-version, caller: api-server, as: after}
    expect:
      - "steps.before.result.value == 'default' && steps.after.result.value == 'step-200'"
      - "state['engine-core'].weights.current.weight_version == 'step-200'"

  - id: engine-core-weight-update-cycle
    name: An RL weight update runs start/update/finish on every worker and bumps the version
    fixtures: [full-tp4-llama-70b]
    config: {weight-transfer-backend: nccl}
    steps:
      - {flow: engine-startup, as: up}
      - {interface: async-llm.init-weight-transfer-engine, caller: api-server, as: init, input: {init_info: {backend: nccl}}}
      - {interface: async-llm.start-weight-update, caller: api-server, as: start}
      - {interface: async-llm.update-weights, caller: api-server, as: upd, input: {update_info: {names: [model.embed_tokens.weight]}}}
      - {interface: async-llm.finish-weight-update, caller: api-server, as: fin, input: {weight_version: step-300}}
      - {interface: async-llm.get-weight-version, caller: api-server, as: v}
    expect:
      - "state['engine-core'].weights.current.weight_version == 'step-300'"
      - "calls['gpu-worker-impl.update-weights'] == 4 && calls['gpu-worker-impl.finish-weight-update'] == 4"
      - "steps.v.result.value == 'step-300'"

  - id: engine-core-misc-utilities
    name: Cache resets, checksums and checkpoints are utility round trips
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.reset-prefix-cache, caller: api-server, as: rp}
      - {interface: async-llm.reset-mm-cache, caller: api-server, as: rm}
      - {interface: async-llm.reset-encoder-cache, caller: api-server, as: re}
      - {interface: async-llm.compute-weight-checksums, caller: api-server, as: ck}
      - {interface: async-llm.checkpoint-prepare, caller: api-server, as: cp}
      - {interface: async-llm.checkpoint-restore, caller: api-server, as: cr}
      - {interface: async-llm.collective-rpc, caller: api-server, as: rpc, input: {method: execute_dummy_batch}}
      - {interface: async-llm.is-sleeping, caller: api-server, as: sl}
      - {interface: async-llm.shutdown-weight-transfer-engine, caller: api-server, as: swt}
      - {interface: async-llm.start-draft-weight-update, caller: api-server, as: sdw}
    expect:
      - "steps.rp.result.value == true && steps.sl.result.value == false"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.reset-encoder-cache').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.reset-encoder-cache').size() == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.compute-weight-checksums').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.checkpoint-prepare').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.checkpoint-restore').size() == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.execute-dummy-batch').size() == 1"

