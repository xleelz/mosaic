        request_states:
          r-d-00000001: {external_req_id: r-d, prompt_len: 2, is_prefilling: false, output_text: " t1", num_output_tokens: 1, token_ids: [1], output_kind: delta, stop: [], parent: null, index: 0, queue_id: r-d-00000001, has_queue: false}
          r-c-00000002: {external_req_id: r-c, prompt_len: 2, is_prefilling: false, output_text: " t1", num_output_tokens: 1, token_ids: [1], output_kind: cumulative, stop: [], parent: null, index: 0, queue_id: r-c-00000002, has_queue: false}
          r-f-00000003: {external_req_id: r-f, prompt_len: 2, is_prefilling: false, output_text: " t1", num_output_tokens: 1, token_ids: [1], output_kind: final_only, stop: [], parent: null, index: 0, queue_id: r-f-00000003, has_queue: false}
        external_req_ids: {r-d: [r-d-00000001], r-c: [r-c-00000002], r-f: [r-f-00000003]}
    steps:
      - interface: output-processor.process-outputs
        caller: llm-engine
        as: p
        input: {outputs: [{request_id: r-d-00000001, new_token_ids: [2], finish_reason: length, stop_reason: null}, {request_id: r-c-00000002, new_token_ids: [2], finish_reason: length, stop_reason: null}, {request_id: r-f-00000003, new_token_ids: [2], finish_reason: length, stop_reason: null}]}
    expect:
      - "steps.p.result.value.request_outputs.map(o, o.request_id) == ['r-d', 'r-c', 'r-f']"
      - "steps.p.result.value.request_outputs.map(o, o.token_ids) == [[2], [1, 2], [1, 2]]"
      - "size(state['output-processor'].external_req_ids) == 0"

  - id: engine-core-graceful-shutdown-drain-teardown
    name: SIGTERM with a 5 s grace lets the engine abort, tear down the executor and exit
    description: "With the default grace the engine-core process handles SIGTERM: aborts the in-flight request, exits once idle, and its finally shuts the executor and the worker down, before the grace ends; nothing is killed."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 40}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, await: false, input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 64, n: 1}}}
      - {flow: engine-shutdown, as: sd, at_ms: 30}
    expect:
      - "steps.sd.result.ok && !steps.sd.result.value.killed"
      - "trace.filter(e, e.type == 'call.start' && e.interface in ['engine-core-proc.signal-handler', 'engine-core.shutdown', 'executor.shutdown', 'gpu-worker-impl.shutdown']).map(e, e.interface) == ['engine-core-proc.signal-handler', 'engine-core.shutdown', 'executor.shutdown', 'gpu-worker-impl.shutdown']"

  - id: engine-core-graceful-shutdown-zero-grace-kill
    name: shutdown_timeout 0 on CUDA kills the engine-core process right after SIGTERM
    description: "The API server shuts the client down with timeout=shutdown_timeout=0: the process manager sends SIGTERM and, with no grace, SIGKILLs the engine-core process tree before it can tear down."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 40}}
      - {flow: async-llm-generate, as: gen, at_ms: 0, await: false, input: {request_id: chatcmpl-abc123, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 64, n: 1}}}
      - {flow: engine-shutdown, as: sd, at_ms: 30, input: {timeout: 0}}
    expect:
      - "steps.sd.result.ok && steps.sd.result.value.killed"
      - "trace.exists(e, e.type == 'kill')"

  - id: engine-core-graceful-shutdown-tp4-workers
    name: The mp executor shuts every rank's worker down
    description: "The death pipes close together and each WorkerProc shuts its worker down on its own: every rank shuts down once, in no guaranteed order (multiproc_executor.py:509-542, 834-858)."
    tags: [concurrency]
    fixtures: [full-tp4-llama-70b]
    steps:
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 6}}
      - {flow: engine-shutdown, as: sd, at_ms: 2}
    expect:
      - "steps.sd.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.shutdown')"
    invariants:
      # every rank's worker shuts down exactly once; the order across ranks isn't guaranteed
      - "['rank0', 'rank1', 'rank2', 'rank3'].all(r, trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.shutdown' && e.instance == r).size() == 1)"

  - id: engine-core-tp4-output-rank-replies
    name: Only the output rank replies to execute_model
    fixtures: [full-tp4-llama-70b]
    steps:
      - *add
      - {flow: engine-core-busy-loop, as: loop, input: {iterations: 2}}
    expect:
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'multiproc-executor.execute-model').size() >= 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'worker-proc.execute-worker-rpc' && e.instance == '' && has(e.output.replied) && e.output.replied == false)"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'multiproc-executor.collective-rpc' && e.output != null && has(e.output.results)).exists(e, size(e.output.results) == 1 && e.output.results[0].rank == 'rank0')"

  - id: engine-core-tp4-nonoutput-rank-error-not-replied
    name: An exception on a non-output rank sends no reply
    fixtures: [full-tp4-llama-70b]
    faults:
      - {target: gpu-worker-impl.execute-model, instance: rank2, type: error, code: cuda-error, calls: [1]}
    steps:
      - *add
      - {flow: engine-core-busy-loop, as: loop, await: false, input: {iterations: 2}}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'executor.collective-rpc' && has(e.error) && e.error != null && e.error.code == 'timeout-error')"

  - id: engine-core-dp-routing-and-utilities
    name: The DP client spreads requests over engines and fans utilities out to all of them
    description: "data_parallel_size 2: two ADDs go to dp0 then dp1 (equal load, rotating start); an abort goes to the request's engine; wake_up is sent once per engine and is true only if all engines are awake."
    fixtures: [full-tp1-llama-8b]
    topology: {engine-core-proc: [dp0, dp1]}
    config: {data-parallel-size: 2}
    steps:
      - {flow: dp-client-add-request, as: a, input: {request_id: chatcmpl-a-00000001}}
      - {flow: dp-client-add-request, as: b, input: {request_id: chatcmpl-b-00000002}}
      - {interface: dp-lb-async-mp-client.abort-requests-async, caller: api-server, as: ab, input: {request_ids: [chatcmpl-a-00000001]}}
      - {interface: async-llm.wake-up, caller: api-server, as: w}
    expect:
      - "steps.a.result.value.engine == 'dp0' && steps.b.result.value.engine == 'dp1'"
      - "channel_len('engine-core-input:dp0') == 2 && channel_len('engine-core-input:dp1') == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core-proc.handle-utility' && e.instance == 'dp0').size() == 1 && trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core-proc.handle-utility' && e.instance == 'dp1').size() == 1"
      - "steps.w.result.value == true"

  - id: engine-core-llm-engine-from-engine-args-sync-client
    name: LLMEngine connects a SyncMPClient to the engine process
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: llm-engine.from-engine-args, caller: python-user, as: e}
    expect:
      - "steps.e.result.ok && state['engine-core-proc'].client_kind == 'sync'"

  - id: engine-core-structured-outputs-invalid-regex
    name: With the outlines backend an unbuildable regex is refused before anything is sent
    fixtures: [full-tp1-llama-8b]
    config: {structured-outputs-backend: outlines}
    steps:
      - {flow: async-llm-generate, as: bad, input: {request_id: chatcmpl-re, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, n: 1, structured_outputs: {regex: "(?<=a)b"}}}}
      - {flow: async-llm-generate, as: ok, input: {request_id: chatcmpl-re2, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, n: 1, structured_outputs: {regex: "[a-z]+"}}}}
    expect:
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'vllm-validation-error'"
      - "calls['backend-outlines.validate-structured-output-request-outlines'] == 2"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'scheduler.add-request' && e.input.request_id.startsWith('chatcmpl-re2')) || channel_len('engine-core-input:') == 1"

  - id: engine-core-ray-dp-placement-allowlist
    name: VLLM_RAY_DP_PLACEMENT_NODE_IPS confines the DP placement groups to the listed nodes
    description: "Four 8-GPU Ray nodes, master 10.0.0.1, DP 16 with 8 local ranks, allowlist 10.0.0.1,10.0.0.3: 8 groups on the master and 8 on .3, none on .2 or .4 (tests/v1/engine/test_dp_placement_node_allowlist.py:67)."
    fixtures: [full-tp1-llama-8b]
    config: {vllm-ray-dp-placement-node-ips: "10.0.0.1,10.0.0.3"}
    state:
      ray-cluster: {nodes: [{ip: 10.0.0.2, GPU: 8}, {ip: 10.0.0.1, GPU: 8}, {ip: 10.0.0.3, GPU: 8}, {ip: 10.0.0.4, GPU: 8}]}
    steps:
      - {interface: core-engine-actor-manager.create-dp-placement-groups, caller: api-server, as: pg, input: {data_parallel_size: 16, data_parallel_size_local: 8, world_size: 1, master_ip: 10.0.0.1}}
      - {interface: core-engine-actor-manager.create-dp-placement-groups, caller: api-server, as: short, input: {data_parallel_size: 24, data_parallel_size_local: 8, world_size: 1, master_ip: 10.0.0.1}}
    expect:
      - "steps.pg.result.ok && size(steps.pg.result.value.placement_groups) == 16"
      - "steps.pg.result.value.placement_groups.all(p, p.node_ip in ['10.0.0.1', '10.0.0.3']) && steps.pg.result.value.placement_groups[0].node_ip == '10.0.0.1'"
      - "!steps.short.result.ok && steps.short.result.error.code == 'value-error'"
      - "size(state['ray-cluster'].placement_groups) == 16"

  - id: engine-core-ray-dp-placement-master-too-small
    name: The DP master must fit its local ranks
    fixtures: [full-tp1-llama-8b]
    state:
      ray-cluster: {nodes: [{ip: 10.0.0.1, GPU: 4}, {ip: 10.0.0.2, GPU: 8}]}
    steps:
      - {interface: core-engine-actor-manager.create-dp-placement-groups, caller: api-server, as: pg, input: {data_parallel_size: 8, data_parallel_size_local: 8, world_size: 1, master_ip: 10.0.0.1}}
      - {interface: core-engine-actor-manager.create-dp-placement-groups, caller: api-server, as: dead, input: {data_parallel_size: 2, data_parallel_size_local: 1, world_size: 1, master_ip: 10.0.0.9}}
    expect:
      - "!steps.pg.result.ok && steps.pg.result.error.message.contains('on DP master node 10.0.0.1')"
      - "!steps.dead.result.ok && steps.dead.result.error.code == 'assertion-error'"
      - "size(state['ray-cluster'].placement_groups) == 0"

  # ------------------------------------------------------------------ serial_utils, Ray helpers (round 3)
  - id: engine-core-msgpack-custom-class-with-pickle
    name: With insecure serialization allowed a custom class round-trips through a pickle extension
    fixtures: [full-tp1-llama-8b]
    config: {vllm-allow-insecure-serialization: true}
    steps:
      - {interface: msgpack-serializer.encode, caller: api-server, as: enc, input: {obj: {kind: object, type: CustomClass, value: {value: test_value}}}}
      - {interface: msgpack-serializer.decode, caller: api-server, as: dec, input: {bufs: "= steps.enc.result.value.bufs", type: CustomClass}}
    expect:
      - "steps.enc.result.value.bufs[0].ext == 1"
      - "steps.dec.result.value.obj == {'kind': 'object', 'type': 'CustomClass', 'value': {'value': 'test_value'}}"

  - id: engine-core-msgpack-custom-class-without-pickle
    name: Without insecure serialization a custom class can't be encoded, and a pickle extension can't be decoded
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: msgpack-serializer.encode, caller: api-server, as: enc, input: {obj: {kind: object, type: CustomClass, value: {value: test_value}}}}
      - {interface: msgpack-serializer.decode, caller: api-server, as: dec, input: {bufs: [{ext: 1, type: CustomClass, data: {value: test_value}}]}}
      - {interface: msgpack-serializer.encode, caller: api-server, as: native, input: {obj: {kind: native, value: [1, 2]}}}
    expect:
      - "!steps.enc.result.ok && steps.enc.result.error.code == 'type-error' && steps.enc.result.error.message.contains('VLLM_ALLOW_INSECURE_SERIALIZATION=1')"
      - "!steps.dec.result.ok && steps.dec.result.error.code == 'not-implemented-error' && steps.dec.result.error.message == 'Extension type code 1 is not supported'"
      - "steps.native.result.ok && steps.native.result.value.bufs[0].value == [1, 2]"

  - id: engine-core-ray-metric-name-sanitized
    name: Ray metric names keep only letters, digits and underscores
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: ray-prometheus-metric.get-sanitized-opentelemetry-name, caller: api-server, as: ok, input: {name: valid_metric_123_abcDEF}}
      - {interface: ray-prometheus-metric.get-sanitized-opentelemetry-name, caller: api-server, as: mixed, input: {name: "vllm:engine_stats/time.latency_ms-99p"}}
    expect:
      - "steps.ok.result.value == 'valid_metric_123_abcDEF'"
      - "steps.mixed.result.value == 'vllm_engine_stats_time_latency_ms_99p'"

  - id: engine-core-ray-env-vars-to-copy
    name: Ray actors inherit prefixed, extra and additional env vars, minus excluded ones
    fixtures: [full-tp1-llama-8b]
    config: {vllm-ray-extra-env-var-prefixes-to-copy: " MYLIB_ , OTHER_ "}
    steps:
      - {interface: ray-env.get-env-vars-to-copy, caller: api-server, as: r, input: {environ: [CUSTOM_PLATFORM_VAR, NCCL_DEBUG, MYLIB_X, LMCACH_TYPO, HOME], additional_vars: [CUSTOM_PLATFORM_VAR], exclude_vars: [VLLM_HOST_IP]}}
    expect:
      - "'CUSTOM_PLATFORM_VAR' in steps.r.result.value && 'NCCL_DEBUG' in steps.r.result.value && 'MYLIB_X' in steps.r.result.value && 'PYTHONHASHSEED' in steps.r.result.value"
      - "!('LMCACH_TYPO' in steps.r.result.value) && !('HOME' in steps.r.result.value) && !('VLLM_HOST_IP' in steps.r.result.value)"

  - id: engine-core-llm-startup-error
    name: LLMEngine startup fails with 'Engine core initialization failed' when rank 0 can't load weights
    fixtures: [full-tp1-llama-8b]
    faults:
      - {target: gpu-worker-impl.load-model, type: error, code: runtime-error, message: "Simulated Error in startup!", instance: rank0}
    steps:
      - {interface: llm-engine.from-engine-args, caller: python-user, as: e}
    expect:
      - "!steps.e.result.ok && steps.e.result.error.message.contains('initialization failed')"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'kv-cache-utils.get-kv-cache-configs')"
