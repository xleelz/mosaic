      - {interface: async-llm.get-num-unfinished-requests, caller: api-server, as: left}
    expect:
      - "steps.left.result.value == 0"
      - "steps.gen.result.ok && steps.gen.result.value.value.finished && steps.gen.result.value.value.request_id == 'chatcmpl-abc123'"
      - "size(steps.gen.result.value.value.token_ids) >= 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'scheduler.add-request').map(e, e.input.request_id) == ['0_chatcmpl-abc123-00000001', '1_chatcmpl-abc123-00000001']"

