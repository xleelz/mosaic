  - id: engine-core-startup-bad-stat-plugin
    name: A stat-logger plugin that isn't a StatLoggerBase stops startup
    fixtures: [full-tp1-llama-8b]
    state:
      stat-logger-manager: {entry_points: {my_logger: {subclass_of_stat_logger_base: false}}}
    flow: engine-startup
    expect:
      - "!result.ok && result.error.code == 'type-error' && result.error.message.contains('my_logger')"
