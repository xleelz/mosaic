# Fix round 4 scenarios: blind findings (judge2 L3, P5, S4, S8, S9, S10, S11) and coverage rows.
scenarios:
  # ------------------------------------------------------------------ liveness monitors (judge2 L3, P5)
  - id: engine-core-engine-process-death-wakes-monitor
    name: A killed engine-core process wakes the client's liveness monitor, which marks the engine dead
    description: "MPClient.__init__ starts MPClientEngineMonitor, blocked on the engine processes' sentinels. Killing engine-core-proc delivers its exit; the monitor sets engine_dead and shuts the client down, and the output handler ends with EngineDeadError (judge2 L3 (a))."
    fixtures: [full-tp1-llama-8b]
    tags: [concurrency]
    steps:
      - {interface: async-llm.from-engine-args, caller: api-server, as: up}
      - {kill: {component: engine-core-proc}, at_ms: 5000}
      - {interface: async-llm.check-health, caller: api-server, at_ms: 5100, as: health}
    expect:
      - "steps.up.result.ok"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'core-engine-proc-manager.monitor-engine-liveness' && e.output.handled == true)"
      - "state['core-engine-proc-manager'].failed_proc_name == 'EngineCore'"
      - "state['async-mp-client'].engine_dead && state['async-llm'].output_handler_done"
      - "!steps.health.result.ok && steps.health.result.error.code == 'engine-dead-error'"

  - id: engine-core-shutdown-exit-not-a-failure
    name: The engine exit that shutdown causes is not reported as a failure
    description: "CoreEngineProcManager.shutdown sets manager_stopped before it terminates the process, so the monitor that wakes on the exit returns without marking a failed process."
    fixtures: [full-tp1-llama-8b]
    tags: [concurrency]
    steps:
      - {interface: async-llm.from-engine-args, caller: api-server, as: up}
      - {interface: async-llm.shutdown, caller: api-server, as: sd}
    expect:
      - "steps.up.result.ok && steps.sd.result.ok"
      - "!trace.exists(e, e.type == 'call.end' && e.interface == 'core-engine-proc-manager.monitor-engine-liveness' && e.output.handled == true)"
      - "state['core-engine-proc-manager'].failed_proc_name == null && state['core-engine-proc-manager'].manager_stopped"

  - id: engine-core-worker-death-wakes-executor-monitor
    name: A killed worker process wakes the MultiprocWorkerMonitor, which fails the executor and tells the engine
    description: "MultiprocExecutor._init_executor starts the worker monitor, blocked on every worker's sentinel. Killing rank2 marks the executor failed, shuts it down and fires the failure callback (EXECUTOR_FAILED on the engine's input queue) without any scenario step playing the sentinel (judge2 P5 (b))."
    fixtures: [full-tp4-llama-70b]
    tags: [concurrency]
    steps:
      - {interface: async-llm.from-engine-args, caller: api-server, as: up}
      - {kill: {component: gpu-worker, instance: rank2}, at_ms: 9000}
    expect:
      - "steps.up.result.ok"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'multiproc-executor.monitor-workers' && e.output.handled == true && e.output.died_rank == 'rank2')"
      - "state['multiproc-executor'].is_failed"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.executor-fail-callback')"

  # ------------------------------------------------------------------ detokenizer and stop strings (judge2 S4, S8, S9)
  - id: engine-core-detok-stop-string-across-tokens
    name: A stop string split across two tokens is found through the look-back and truncates the text
    description: "' t87126' then ' t61590' with stop '126 t615': the second update searches the new characters plus len(stop)-1 of look-back, finds the match starting in the previous token, truncates before it and keeps the completing token."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: incremental-detokenizer.update, caller: api-server, as: a, input: {new_token_ids: [87126], stop_terminated: false, output_text: " t34173", num_prev_tokens: 1, stop: ["126 t615"]}}
      - {interface: incremental-detokenizer.update, caller: api-server, as: b, input: {new_token_ids: [61590, 72222], stop_terminated: false, output_text: " t34173 t87126", num_prev_tokens: 2, stop: ["126 t615"]}}
    expect:
      - "steps.a.result.value.stop_string == null && steps.a.result.value.output_text == ' t34173 t87126'"
      - "steps.b.result.value.stop_string == '126 t615' && steps.b.result.value.output_text == ' t34173 t87'"
      - "steps.b.result.value.kept_token_ids == [61590]"

  - id: engine-core-detok-include-stop-and-min-tokens
    name: include_stop_str_in_output keeps the stop string; min_tokens hides an early match
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: incremental-detokenizer.update, caller: api-server, as: inc, input: {new_token_ids: [61590, 72222], stop_terminated: false, output_text: " t1", num_prev_tokens: 1, stop: [" t61590"], include_stop_str_in_output: true}}
      - {interface: incremental-detokenizer.update, caller: api-server, as: early, input: {new_token_ids: [61590], stop_terminated: false, output_text: "", num_prev_tokens: 0, stop: [" t61590"], min_tokens: 2}}
    expect:
      - "steps.inc.result.value.stop_string == ' t61590' && steps.inc.result.value.output_text == ' t1 t61590' && steps.inc.result.value.kept_token_ids == [61590]"
      - "steps.early.result.value.stop_string == null && steps.early.result.value.output_text == ' t61590'"

  - id: engine-core-detok-special-tokens
    name: skip_special_tokens drops the special token's text; without it the token text appears
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: incremental-detokenizer.update, caller: api-server, as: skip, input: {new_token_ids: [9906, 128009], stop_terminated: false, output_text: "", stop: []}}
      - {interface: incremental-detokenizer.update, caller: api-server, as: keep, input: {new_token_ids: [9906, 128009], stop_terminated: false, output_text: "", stop: [], skip_special_tokens: false}}
      - {interface: incremental-detokenizer.update, caller: api-server, as: eos, input: {new_token_ids: [9906, 128009], stop_terminated: true, output_text: "", stop: [], skip_special_tokens: false}}
    expect:
      - "steps.skip.result.value.output_text == ' t9906'"
      - "steps.keep.result.value.output_text == ' t9906<|eot_id|>'"
      - "steps.eos.result.value.output_text == ' t9906' && steps.eos.result.value.kept_token_ids == [9906, 128009]"

  - id: engine-core-output-stop-hold-back-delta
    name: DELTA streaming holds back len(stop)-1 characters until the request finishes
    description: "With stop ['126 t615'] (8 chars) a DELTA stream holds 7 characters back: the first output carries nothing, the second the first token's text, and the finishing output the rest of the truncated text, so the stop string never reaches the client."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: output-processor.add-request, caller: api-server, as: reg, input: {request: {request_id: r1, external_req_id: r1, prompt_token_ids: [128000, 9906], sampling_params: {output_kind: delta, stop: ["126 t615"], max_tokens: 16}}, has_queue: false}}
      - {interface: output-processor.process-outputs, caller: api-server, as: o1, input: {outputs: [{request_id: r1, new_token_ids: [34173]}]}}
      - {interface: output-processor.process-outputs, caller: api-server, as: o2, input: {outputs: [{request_id: r1, new_token_ids: [87126]}]}}
      - {interface: output-processor.process-outputs, caller: api-server, as: o3, input: {outputs: [{request_id: r1, new_token_ids: [61590]}]}}
    expect:
      - "steps.o1.result.value.request_outputs[0].completions[0].text == ''"
      - "steps.o2.result.value.request_outputs[0].completions[0].text == ' t34173'"
      - "steps.o3.result.value.request_outputs[0].completions[0].text == ' t87' && steps.o3.result.value.request_outputs[0].finish_reason == 'stop' && steps.o3.result.value.request_outputs[0].stop_reason == '126 t615'"
      - "steps.o3.result.value.reqs_to_abort == ['r1'] && state['output-processor'].request_states == {}"

  # ------------------------------------------------------------------ input validation (judge2 S6, S9, S11, L6)
  - id: engine-core-inputs-logprobs-over-max
    name: More sample logprobs than max_logprobs (20) is a validation error
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: input-processor.process-inputs, caller: api-server, as: ok, input: {request_id: a, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, logprobs: 20}}}
      - {interface: input-processor.process-inputs, caller: api-server, as: bad, input: {request_id: b, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, logprobs: 25}}}
    expect:
      - "steps.ok.result.ok && steps.ok.result.value.sampling_params.logprobs == 20"
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'vllm-validation-error' && steps.bad.result.error.message == 'Requested sample logprobs of 25, which is greater than max allowed: 20'"

  - id: engine-core-inputs-min-tokens-only-when-max-unset
    name: min_tokens is checked here only against the max_tokens an unset value resolves to
    description: "A set max_tokens was checked when SamplingParams was built (serving-api), so process_inputs passes min_tokens 8 > max_tokens 5 through; with max_tokens unset it resolves to max_model_len - prompt_len and checks against that."
    fixtures: [full-tp1-llama-8b]
    config: {max-model-len: 10}
    steps:
      - {interface: input-processor.process-inputs, caller: api-server, as: set, input: {request_id: a, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 5, min_tokens: 8}}}
      - {interface: input-processor.process-inputs, caller: api-server, as: unset, input: {request_id: b, prompt_token_ids: [128000, 9906], sampling_params: {min_tokens: 9}}}
    expect:
      - "steps.set.result.ok"
      - "!steps.unset.result.ok && steps.unset.result.error.message == 'min_tokens must be less than or equal to max_tokens=8, got 9.'"

  - id: engine-core-inputs-lora-and-cache-salt
    name: A LoRA request needs --enable-lora
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: input-processor.process-inputs, caller: api-server, as: loff, input: {request_id: a, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4}, lora_request: {lora_name: sql, lora_int_id: 1, lora_path: /adapters/sql}}}
    expect:
      - "!steps.loff.result.ok && steps.loff.result.error.message == 'Got lora_request sql but LoRA is not enabled!'"

  - id: engine-core-inputs-lora-and-cache-salt-carried
    name: With --enable-lora the LoRA request and the prompt's cache_salt ride on the EngineCoreRequest to the scheduler
    fixtures: [full-tp1-llama-8b]
    config: {enable-lora: true}
    steps:
      - {interface: input-processor.process-inputs, caller: api-server, as: lon, input: {request_id: b, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4}, lora_request: {lora_name: sql, lora_int_id: 1, lora_path: /adapters/sql}, cache_salt: s1}}
      - {interface: engine-core.preprocess-add-request, caller: engine-core, as: pre, input: "= steps.lon.result.value"}
    expect:
      - "steps.lon.result.ok && steps.lon.result.value.lora_request.lora_name == 'sql' && steps.lon.result.value.cache_salt == 's1'"
      - "steps.pre.result.value.lora_request.lora_int_id == 1 && steps.pre.result.value.cache_salt == 's1'"

  - id: engine-core-inputs-invalid-json-schema
    name: With backend auto an unparseable JSON schema is refused; a valid one resolves to xgrammar
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: input-processor.process-inputs, caller: api-server, as: bad, input: {request_id: a, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, structured_outputs: {json: "{\"type\": \"object\", \"properties\": {\"a\": {\"type\": "}}}}
      - {interface: input-processor.process-inputs, caller: api-server, as: good, input: {request_id: b, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, structured_outputs: {json: "{\"type\": \"object\"}"}}}}
    expect:
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'vllm-validation-error' && steps.bad.result.error.message == 'Invalid JSON grammar specification.'"
      - "steps.good.result.ok && steps.good.result.value.sampling_params.structured_outputs._backend == 'xgrammar'"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'xgrammar-backend.validate-xgrammar-grammar').size() == 2"

  - id: engine-core-structured-output-grammar-init
    name: A structured-output request starts compiling its grammar in the input thread and waits for it
    description: "preprocess_add_request calls grammar_init with the request's key (json, the schema text) and the resolved backend; the Request starts in WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR with its grammar id (judge2 S10)."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: engine-core.preprocess-add-request, caller: engine-core, as: pre, input: {request_id: so-1, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, structured_outputs: {json: "{\"type\": \"object\"}", _backend: xgrammar}, stop_token_ids: [128001], eos_token_id: 128009}}}
      - {interface: engine-core.preprocess-add-request, caller: engine-core, as: choice, input: {request_id: so-2, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 4, structured_outputs: {choice: [positive, negative]}}}}
    expect:
      - "steps.pre.result.ok && steps.pre.result.value.status == 'WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR' && steps.pre.result.value.grammar_id == 'so-1'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'structured-output-manager.grammar-init' && e.input.request_type == 'json' && e.input.backend == 'xgrammar' && e.input.stop_token_ids == [128001, 128009])"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'structured-output-manager.grammar-init' && e.input.request_id == 'so-2' && e.input.request_type == 'grammar' && e.input.grammar_spec == 'root ::= \"positive\" | \"negative\"')"

  # ------------------------------------------------------------------ coverage rows
  - id: engine-core-executor-supports-async-scheduling
    name: Which executors support async scheduling
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: executor.supports-async-scheduling, caller: engine-core, as: base, input: {executor_class: Executor}}
      - {interface: executor.supports-async-scheduling, caller: engine-core, as: uni, input: {executor_class: UniProcExecutor}}
      - {interface: executor.supports-async-scheduling, caller: engine-core, as: ext, input: {executor_class: ExecutorWithExternalLauncher}}
      - {interface: executor.supports-async-scheduling, caller: engine-core, as: mp, input: {executor_class: MultiprocExecutor}}
      - {interface: executor.supports-async-scheduling, caller: engine-core, as: ray, input: {executor_class: RayDistributedExecutor}}
    expect:
      - "!steps.base.result.value && steps.uni.result.value && steps.ext.result.value && steps.mp.result.value && !steps.ray.result.value"

  - id: engine-core-worker-rpc-failure-carries-message
    name: A worker exception reaches the executor as the worker's own message
    description: "_execute_worker_rpc hands the exception to handle_output; enqueue_output sends (FAILURE, str(e)), and collective_rpc raises RuntimeError naming it."
    fixtures: [full-tp4-llama-70b]
    faults:
      - {target: gpu-worker-impl.execute-dummy-batch, type: error, code: runtime-error, message: "test error", instance: rank0}
    steps:
      - {interface: worker-proc.execute-worker-rpc, caller: engine-core, as: rpc, input: {rank: rank0, method: execute_dummy_batch, args: {}, output_rank: rank0}}
      - {interface: multiproc-executor.collective-rpc, caller: engine-core, as: coll, input: {method: execute_dummy_batch, args: {}, unique_reply_rank: 0}}
    expect:
      - "!steps.rpc.result.ok && steps.rpc.result.error.code == 'runtime-error' && steps.rpc.result.error.message == 'test error'"
      - "!steps.coll.result.ok && steps.coll.result.error.message == \"Worker failed with error 'test error', please check the stack trace above for the root cause\""

  - id: engine-core-attention-metrics-pp-swa
    name: Attention FLOPs split full and sliding layers, each divided by PP on its own
    description: "A 6-layer model with one sliding layer (window 512) at PP 2: 2.5 full and 0.5 sliding layers per GPU (tests/v1/metrics/test_perf_metrics.py)."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: attention-metrics.from-vllm-config, caller: engine-core, as: m, input: {hidden_size: 2048, num_attention_heads: 16, num_key_value_heads: 16, num_hidden_layers: 6, head_dim: 128, sliding_window: 512, layer_types: [sliding_attention, full_attention, full_attention, full_attention, full_attention, full_attention], pipeline_parallel_size: 2}}
      - {interface: attention-metrics.get-num-flops-breakdown, caller: engine-core, as: f, input: {metrics: "= steps.m.result.value", requests: [[1, 4096, false]]}}
      - {interface: attention-metrics.from-vllm-config, caller: engine-core, as: gemma, input: {hidden_size: 2304, num_attention_heads: 8, num_hidden_layers: 26, sliding_window: 4096, model_type: gemma2}}
    expect:
      - "steps.m.result.value.num_swa_layers == 1"
      - "steps.f.result.value.attn_qk == 42991616 && steps.f.result.value.attn_av == 42991616 && steps.f.result.value.attn_qk < 50331648"
      - "steps.gemma.result.value.num_swa_layers == 13"

  - id: engine-core-logprobs-sentinel-columns
    name: Sample logprobs keep num_logprobs + 1 entries per position; the cumulative logprob sums the sampled ones
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: logprobs-processor.update-sample-logprobs, caller: api-server, as: a, input: {request_id: r, num_logprobs: 3, logprobs_lists: {token_ids: [[42, 100, 200, 300, 0, 0]], logprobs: [[-0.5, -1.0, -2.0, -3.0, -1.0e30, -1.0e30]], ranks: [1]}}}
      - {interface: logprobs-processor.update-sample-logprobs, caller: api-server, as: b, input: {request_id: r, num_logprobs: 3, logprobs_lists: {token_ids: [[7, 11, 13, 17]], logprobs: [[-0.25, -1.5, -2.5, -3.5]], ranks: [2]}}}
    expect:
      - "steps.a.result.value.logprobs[0].map(e, e.token_id) == [42, 100, 200, 300] && steps.a.result.value.cumulative_logprob == -0.5"
      - "steps.b.result.value.cumulative_logprob == -0.75 && size(steps.b.result.value.logprobs) == 2 && steps.b.result.value.logprobs[1][0].rank == 2"
      - "state['logprobs-processor'].requests['r'].cumulative_logprob == -0.75"

  - id: engine-core-stat-loggers-record
    name: StatLoggerManager.record reaches every logger; aggregated and per-engine loggers drop unknown engine indexes
    fixtures: [full-tp1-llama-8b]
    state:
      stat-logger-manager: {loggers: [LoggingStatLogger, CustomLogger, PrometheusStatLogger]}
    steps:
      - {interface: stat-logger-manager.record, caller: engine-core, as: r, input: {num_outputs: 3, finished: 1, num_prompt_tokens: 6, scheduler_stats: {num_running_reqs: 1, num_waiting_reqs: 0}}}
      - {interface: logging-stat-logger.record-aggregated, caller: engine-core, as: agg, input: {engine_indexes: [0, 1], engine_idx: 1, scheduler_stats: {num_running_reqs: 2}}}
      - {interface: logging-stat-logger.record-aggregated, caller: engine-core, as: stray, input: {engine_indexes: [0, 1], engine_idx: 5}}
      - {interface: per-engine-stat-logger-adapter.record, caller: engine-core, as: stray2, input: {engine_idx: 3}}
    expect:
      - "steps.r.result.ok && state['logging-stat-logger'].num_generation_tokens == 3 && state['logging-stat-logger'].num_prompt_tokens == 6"
      - "state['logging-stat-logger'].last_scheduler_stats.num_running_reqs == 1 && state['logging-stat-logger'].last_scheduler_stats_dict['1'].num_running_reqs == 2"
      - "state['per-engine-stat-logger-adapter'].records == {'0': 1}"
      - "steps.agg.result.value.recorded && !steps.stray.result.value.recorded && !steps.stray2.result.value.recorded"

  - id: engine-core-getters-tokenizer-tracing
    name: get_tokenizer, is_tracing_enabled
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.get-tokenizer, caller: api-server, as: tok}
      - {interface: llm-engine.get-tokenizer, caller: python-user, as: tok2}
      - {interface: async-llm.is-tracing-enabled, caller: api-server, as: tr}
    expect:
      - "steps.tok.result.value.name_or_path == 'meta-llama/Llama-3.1-8B-Instruct' && steps.tok2.result.value.name_or_path == 'meta-llama/Llama-3.1-8B-Instruct'"
      - "!steps.tr.result.value"

  - id: engine-core-getters-tracing-on-no-tokenizer
    name: An OTLP endpoint turns tracing on; skip_tokenizer_init leaves no tokenizer
    fixtures: [full-tp1-llama-8b]
    config: {otlp-traces-endpoint: "http://collector:4317", skip-tokenizer-init: true}
    steps:
      - {interface: async-llm.is-tracing-enabled, caller: api-server, as: tr}
      - {interface: async-llm.get-tokenizer, caller: api-server, as: none}
      - {interface: llm-engine.get-tokenizer, caller: python-user, as: none2}
    expect:
      - "steps.tr.result.value"
      - "!steps.none.result.ok && steps.none.result.error.code == 'value-error' && !steps.none2.result.ok"

  - id: engine-core-kv-event-sources
    name: Engines that report a KV-event config at READY become KV-event sources
    fixtures: [full-tp1-llama-8b]
    config: {enable-kv-cache-events: true, kv-events-publisher: zmq}
    steps:
      - {interface: async-llm.get-kv-event-sources, caller: api-server, as: before}
      - {interface: async-llm.from-engine-args, caller: api-server, as: up}
      - {interface: async-llm.get-kv-event-sources, caller: api-server, as: after}
    expect:
      - "steps.before.result.value == {}"
      - "steps.after.result.value['0'].publisher == 'zmq'"
      - "state['async-mp-client'].kv_event_sources == {'0': {'enable_kv_cache_events': true, 'publisher': 'zmq'}}"

  - id: engine-core-llm-engine-dp-unfinished-allreduce
    name: Offline DP ranks all-reduce their unfinished flag; an idle rank then runs a dummy batch
    fixtures: [full-tp1-llama-8b]
    tags: [concurrency]
    config: {data-parallel-size: 2}
    topology: {llm-engine: [dp0, dp1]}
    steps:
      - {interface: llm-engine.has-unfinished-requests-dp, caller: python-user, on: dp0, as: r0, await: false, input: {has_unfinished: false}}
      - {interface: llm-engine.has-unfinished-requests-dp, caller: python-user, on: dp1, as: r1, input: {has_unfinished: true}}
    expect:
      - "steps.r0.result.value && steps.r1.result.value"
      - "state['llm-engine@dp0'].should_execute_dummy_batch && !state['llm-engine@dp1'].should_execute_dummy_batch"

  - id: engine-core-dp-busy-loop-wave-ends
    name: When no DP rank has work the wave ends after a dummy pass and an all-reduce
    description: "Both DP ranks are in a wave (engines_running) with nothing scheduled: each runs a dummy batch, the all-reduce says no rank has work, rank 0 reports wave 0 complete, and both move to wave 1."
    fixtures: [full-tp1-llama-8b]
    tags: [concurrency]
    config: {data-parallel-size: 2}
    topology: {dp-engine-core-proc: [dp0, dp1]}
    state:
      dp-engine-core-proc@dp0: {engines_running: true}
      dp-engine-core-proc@dp1: {engines_running: true}
    steps:
      - {interface: dp-engine-core-proc.run-busy-loop, caller: engine-core, on: dp0, as: l0, await: false, input: {dp_rank: 0}}
      - {interface: dp-engine-core-proc.run-busy-loop, caller: engine-core, on: dp1, as: l1, input: {dp_rank: 1}}
    expect:
      - "steps.l0.result.ok && steps.l1.result.ok && !steps.l0.result.value.engines_running && steps.l0.result.value.dummy"
      - "state['dp-engine-core-proc@dp0'].wave_complete == [0] && state['dp-engine-core-proc@dp1'].wave_complete == []"
      - "state['dp-engine-core-proc@dp0'].current_wave == 1 && state['dp-engine-core-proc@dp1'].current_wave == 1"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'engine-core.execute-dummy-batch').size() == 2"

  - id: engine-core-dp-busy-loop-idle
    name: An idle DP rank outside a wave loops without syncing
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    topology: {dp-engine-core-proc: [dp0, dp1]}
    steps:
      - {interface: dp-engine-core-proc.run-busy-loop, caller: engine-core, on: dp0, as: l0, input: {dp_rank: 0}}
    expect:
      - "steps.l0.result.value.idle && state['dp-engine-core-proc@dp0'].current_wave == 0"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'dp-engine-core-proc.has-global-unfinished-reqs')"

  - id: engine-core-dp-client-stats-task
    name: The DP client's stats task tracks waves, running state and per-engine counts
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    steps:
      - {interface: dp-lb-async-mp-client.run-engine-stats-update-task, caller: api-server, as: first, input: {first_req: 1}}
      - {interface: dp-lb-async-mp-client.run-engine-stats-update-task, caller: api-server, as: st, input: {stats: {counts: [[2, 1], [0, 3], [5, 5]], wave: 4, running: false}}}
      - {interface: dp-lb-async-mp-client.run-engine-stats-update-task, caller: api-server, as: scale, input: {scale_elastic_ep: 3}}
    expect:
      - "steps.first.result.value.sent == [1, 0]"
      - "state['dp-lb-async-mp-client'].current_wave == 4 && !state['dp-lb-async-mp-client'].engines_running"
      - "steps.st.result.value.lb_engines == [[2, 1], [0, 3]]"
      - "!steps.scale.result.ok && steps.scale.result.error.code == 'assertion-error'"

  - id: engine-core-scale-elastic-ep
    name: Elastic EP scaling skips an unchanged size, respects the max DP size, then prepares and commits
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    steps:
      - {interface: async-llm.scale-elastic-ep, caller: api-server, as: same, input: {new_data_parallel_size: 2}}
      - {interface: async-llm.scale-elastic-ep, caller: api-server, as: big, input: {new_data_parallel_size: 16}}
      - {interface: async-llm.scale-elastic-ep, caller: api-server, as: ray, input: {new_data_parallel_size: 4}}
    state:
      dp-lb-async-mp-client: {lb_engines: [[0, 0], [0, 0]], data_parallel_backend: ray, elastic_ep_max_dp_size: 8, num_experts: 64, num_redundant_experts: 0, core_engines: 2}
    expect:
      - "steps.same.result.ok && !steps.same.result.value.scaled"
      - "!steps.big.result.ok && steps.big.result.error.code == 'value-error'"
      - "steps.ray.result.ok && steps.ray.result.value.scaled"
      - "state['async-llm'].data_parallel_size == 4 && state['dp-lb-async-mp-client'].core_engines == 4 && state['dp-lb-async-mp-client'].num_redundant_experts == 64"
      - "state['dp-lb-async-mp-client'].prepared_elastic_ep == null && size(state['dp-lb-async-mp-client'].lb_engines) == 4"

  - id: engine-core-scale-elastic-ep-not-ray
    name: Elastic EP scaling is refused on the mp DP backend
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    steps:
      - {interface: async-llm.scale-elastic-ep, caller: api-server, as: mp, input: {new_data_parallel_size: 4}}
    expect:
      - "!steps.mp.result.ok && steps.mp.result.error.message == 'Only ray DP backend supports scaling elastic EP'"

  - id: engine-core-streaming-input
    name: Streaming inputs refuse n > 1 and stop strings; chunks go in under one internal id, then the final request
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: async-llm.add-streaming-input-request, caller: api-server, as: n2, input: {request_id: s0, sampling_params: {n: 2, max_tokens: 4}, chunks: [{prompt_token_ids: [128000, 9906]}]}}
      - {interface: async-llm.add-streaming-input-request, caller: api-server, as: stop, input: {request_id: s1, sampling_params: {max_tokens: 4, stop: ["."]}, chunks: [{prompt_token_ids: [128000, 9906]}]}}
      - {interface: async-llm.add-streaming-input-request, caller: api-server, as: ok, input: {request_id: s2, sampling_params: {max_tokens: 4, output_kind: delta}, chunks: [{prompt_token_ids: [128000, 9906]}, {prompt_token_ids: [11, 856]}]}}
    expect:
      - "!steps.n2.result.ok && steps.n2.result.error.code == 'vllm-validation-error' && !steps.stop.result.ok"
      - "steps.ok.result.ok && steps.ok.result.value.added == 2 && steps.ok.result.value.finished_sent"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-mp-client.add-request-async' && e.input.request_id == steps.ok.result.value.request_id).size() == 3"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-mp-client.add-request-async' && has(e.input.resumable) && e.input.resumable).size() == 2"

  - id: engine-core-dp-busy-loop-flow-wave-then-idle
    name: The DP busy loop ends the live wave; the next sync starts the step count again
    description: "Both ranks are in wave 0 with nothing to do: rank 0's loop and rank 1's iteration run a dummy batch and all-reduce; the wave ends and the step counter resets, so the next _has_global_unfinished_reqs on each rank is step 1 and syncs again."
    fixtures: [full-tp1-llama-8b]
    tags: [concurrency]
    config: {data-parallel-size: 2}
    topology: {dp-engine-core-proc: [dp0, dp1]}
    state:
      dp-engine-core-proc@dp0: {engines_running: true}
      dp-engine-core-proc@dp1: {engines_running: true}
    steps:
      - {flow: dp-engine-core-busy-loop, on: dp0, as: loop, await: false}
      - {interface: dp-engine-core-proc.run-busy-loop, caller: engine-core, on: dp1, as: l1, input: {dp_rank: 1}}
      - {interface: dp-engine-core-proc.has-global-unfinished-reqs, caller: engine-core, on: dp0, as: g0, at_ms: 1000, await: false, input: {local_unfinished: false}}
      - {interface: dp-engine-core-proc.has-global-unfinished-reqs, caller: engine-core, on: dp1, as: g1, at_ms: 1000, input: {local_unfinished: true}}
    expect:
      - "steps.loop.result.ok && !steps.l1.result.value.engines_running"
      - "state['dp-engine-core-proc@dp0'].current_wave == 1 && state['dp-engine-core-proc@dp0'].wave_complete == [0]"
      - "steps.g0.result.value && steps.g1.result.value && state['dp-engine-core-proc@dp0'].step_counter == 1"

  - id: engine-core-dp-client-stats-flow
    name: The DP client's stats task keeps the latest wave and this client's engine counts
    fixtures: [full-tp1-llama-8b]
    config: {data-parallel-size: 2}
    steps:
      - {flow: dp-client-stats-update-task, as: st}
      - {interface: dp-lb-async-mp-client.get-core-engine-for-request, caller: api-server, as: pick, input: {request_id: r1, prompt_token_ids: [128000], sampling_params: {max_tokens: 1}}}
    expect:
      - "steps.st.result.ok && steps.st.result.value.lb_engines == [[1, 0], [0, 2]]"
      - "state['dp-lb-async-mp-client'].current_wave == 1 && state['dp-lb-async-mp-client'].engines_running"
      - "steps.pick.result.value.engine == 'dp0'"

  - id: engine-core-ray-v2-worker-monitor
    name: The Ray V2 worker monitor fails the executor when a worker dies, and stops on shutdown
    fixtures: [full-tp4-llama-70b]
    tags: [concurrency]
    steps:
      - {flow: ray-v2-worker-monitor, as: mon, await: false}
      - {kill: {component: gpu-worker, instance: rank1}, at_ms: 12000}
    expect:
      - "steps.mon.result.ok && steps.mon.result.value.handled && steps.mon.result.value.dead_ranks == ['rank1']"
      - "state['ray-executor-v2'].is_failed && trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.executor-fail-callback' && e.t >= 12000)"

  - id: engine-core-ray-v2-worker-monitor-shutdown
    name: A shutting-down Ray V2 executor's monitor exits without failing it
    fixtures: [full-tp4-llama-70b]
    state:
      ray-executor-v2: {shutting_down: true}
    steps:
      - {interface: ray-executor-v2.monitor-workers, caller: engine-core, as: mon}
    expect:
      - "steps.mon.result.value.stopped && !state['ray-executor-v2'].is_failed"

  - id: engine-core-mm-receiver-cache
    name: The engine core fills multimodal items from its P1 cache and clears it on reset_mm_cache
    description: "The first request sends the image item; the second sends only its hash (P0 knows P1 has it) and preprocess fills the data from the receiver cache. reset_mm_cache clears the cache, so the same hash-only item is then a MultiModalCacheMissError."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: engine-core.preprocess-add-request, caller: engine-core, as: first, input: {request_id: m1, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 1}, mm_features: [{mm_hash: img-1, data: {bytes: 1024, modality: image}}]}}
      - {interface: engine-core.preprocess-add-request, caller: engine-core, as: hit, input: {request_id: m2, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 1}, mm_features: [{mm_hash: img-1, data: null}]}}
      - {interface: engine-core.reset-mm-cache, caller: engine-core, as: reset}
      - {interface: engine-core.preprocess-add-request, caller: engine-core, as: miss, input: {request_id: m3, prompt_token_ids: [128000, 9906], sampling_params: {max_tokens: 1}, mm_features: [{mm_hash: img-1, data: null}]}}
    expect:
      - "steps.hit.result.ok && steps.hit.result.value.mm_features[0].data.bytes == 1024"
      - "steps.reset.result.ok && trace.exists(e, e.type == 'call.start' && e.interface == 'lru-key-replicated-receiver-cache.clear-cache')"
      - "!steps.miss.result.ok && steps.miss.result.error.code == 'multi-modal-cache-miss-error'"
