# models-layers: model loading (get_model, loaders, weight download, quantization dispatch).
components:
  - id: model-loader
    name: model_loader package (get_model, get_model_loader)
    kind: module
    parent: model-executor
    layer: models
    summary: "Picks the loader for --load-format and runs it: the worker's entry into model loading."
    sources: ["vllm/model_executor/model_loader/__init__.py:50-66", "vllm/model_executor/model_loader/__init__.py:123-143"]
    state:
      initial:
        loaders:
          auto: default-model-loader
          hf: default-model-loader
          dummy: dummy-model-loader
          fastsafetensors: default-model-loader
          instanttensor: default-model-loader
          ipc_cache: ipc-model-loader
          mistral: default-model-loader
          modelexpress: model-express-model-loader
          npcache: default-model-loader
          pt: default-model-loader
          runai_streamer: runai-model-streamer-loader
          runai_streamer_sharded: sharded-state-loader
          safetensors: default-model-loader
          sharded_state: sharded-state-loader
          tensorizer: tensorizer-loader
  - id: base-model-loader
    name: BaseModelLoader
    kind: module
    parent: model-loader
    layer: models
    summary: "The shared load sequence: build the model on the target device under the model dtype, load weights, then process weights into kernel formats."
    sources: ["vllm/model_executor/model_loader/base_loader.py:27-115"]
  - id: default-model-loader
    name: DefaultModelLoader
    kind: module
    parent: model-loader
    layer: models
    summary: "Loads safetensors/bin/pt checkpoints from a local path or the Hugging Face Hub and streams them into model.load_weights."
    sources: ["vllm/model_executor/model_loader/default_loader.py:55-145"]
  - id: dummy-model-loader
    name: DummyModelLoader
    kind: module
    parent: model-loader
    layer: models
    summary: "load_format=dummy: no download; every tensor gets random values, for benchmarking."
    sources: ["vllm/model_executor/model_loader/dummy_loader.py:21-48"]
  - id: ipc-model-loader
    name: IpcModelLoader
    kind: module
    parent: model-loader
    layer: models
    summary: "load_format=ipc_cache: maps post-processed weights from the per-GPU weight cache daemon over CUDA IPC, falling back to disk loading."
    sources: ["vllm/model_executor/model_loader/weight_cache/ipc_loader.py:62-119"]
  - id: model-loader-utils
    name: model_loader/utils.py
    kind: module
    parent: model-loader
    layer: models
    attributes:
      racy_in_code: "get_model_architecture reads _MODEL_ARCH_BY_HASH and then stores into it with no lock (vllm/model_executor/model_loader/utils.py:345-349); concurrent loads of the same key both resolve and the last write wins with an equal value"
    summary: "initialize_model, the cached architecture resolution and process_weights_after_loading."
    sources: ["vllm/model_executor/model_loader/utils.py:73-130", "vllm/model_executor/model_loader/utils.py:295-350"]
    state:
      initial:
        arch_cache: {}
  - id: weight-utils
    name: model_loader/weight_utils.py
    kind: module
    parent: model-loader
    layer: models
    summary: "Hub downloads under a per-model file lock, and building the quantization config from the checkpoint."
    sources: ["vllm/model_executor/model_loader/weight_utils.py:91-102", "vllm/model_executor/model_loader/weight_utils.py:192-395"]
  - id: auto-weights-loader
    name: AutoWeightsLoader
    kind: module
    parent: model-executor
    layer: models
    summary: "The generic recursive weight loader every model's load_weights delegates to: maps checkpoint names onto modules and calls each parameter's weight_loader."
    sources: ["vllm/model_executor/models/utils.py:216-217", "vllm/model_executor/models/utils.py:450-500"]
  - id: quantization
    name: layers/quantization package (get_quantization_config)
    kind: module
    parent: model-executor
    layer: quantization
    summary: "The quantization method table: method name to QuantizationConfig class."
    sources: ["vllm/model_executor/layers/quantization/__init__.py:15-50", "vllm/model_executor/layers/quantization/__init__.py:112-195"]
    state:
      initial:
        methods:
          awq: AutoAWQConfig
          awq_marlin: AutoAWQConfig
          auto_awq: AutoAWQConfig
          fp8: Fp8Config
          fbgemm_fp8: FBGEMMFp8Config
          fp_quant: FPQuantConfig
          modelopt: ModelOptFp8Config
          modelopt_fp4: ModelOptNvFp4Config
          modelopt_mxfp8: ModelOptMxFp8Config
          modelopt_mixed: ModelOptMixedPrecisionConfig
          auto_gptq: AutoGPTQConfig
          gptq: AutoGPTQConfig
          gptq_marlin: AutoGPTQConfig
          compressed-tensors: CompressedTensorsConfig
          experts_int8: ExpertsInt8Config
          quark: QuarkConfig
          moe_wna16: MoeWNA16Config
          torchao: TorchAOConfig
          inc: INCConfig
          mxfp4: Mxfp4Config
          gpt_oss_mxfp4: GptOssMxfp4Config
          deepseek_v4_fp8: DeepseekV4FP8Config
          humming: HummingConfig
          online: OnlineQuantizationConfig
          mxfp8: ModelOptMxFp8Config
          fp8_per_tensor: OnlineQuantizationConfig
          fp8_per_block: OnlineQuantizationConfig
          fp8_per_channel: OnlineQuantizationConfig
          int8_per_channel_weight_only: OnlineQuantizationConfig
          nvfp4_per_token: OnlineQuantizationConfig
        online_shorthands: [fp8_per_tensor, fp8_per_block, fp8_per_channel, int8_per_channel_weight_only, nvfp4_per_token, mxfp8]
  - id: fp8-config
    name: Fp8Config
    kind: module
    parent: quantization
    layer: quantization
    summary: "Serialized FP8 checkpoints: validates the activation scheme and block size, and hands out FP8 linear, MoE and KV-cache methods."
    sources: ["vllm/model_executor/layers/quantization/fp8.py:92-135"]

interfaces:
  - component: model-loader
    name: get-model
    kind: function
    summary: "get_model: choose the loader for the configured load format and load the model into this rank's GPU."
    sources: ["vllm/model_executor/model_loader/__init__.py:131-143"]
    tags: [writes]
    request: ModelsGetModelRequest
    response: ModelsLoadedModel
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: repository-not-found-error, status: 0, retryable: false}
    behavior:
      - title: get_model_loader refuses an unknown load format
        source: "vllm/model_executor/model_loader/__init__.py:123-128"
        if: "!(config['load-format'] in state.loaders)"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Load format `' + config['load-format'] + '` is not supported'"}
      - set:
          vars.loader: "= state.loaders[config['load-format']]"
      - title: ipc_cache maps weights from the weight cache daemon
        source: "vllm/model_executor/model_loader/__init__.py:56"
        if: "vars.loader == 'ipc-model-loader'"
        then:
          - call: ipc-model-loader.load-model
            input: "= input"
            as: ipc
          - return: "= vars.ipc.value"
      - title: loader.load_model(vllm_config, model_config)
        source: "vllm/model_executor/model_loader/__init__.py:138-143"
        call: base-model-loader.load-model
        input: {loader: "= vars.loader", model: "= input.model", hf_config: "= input.hf_config"}
        as: loaded
      - return: "= vars.loaded.value"

  - component: base-model-loader
    name: load-model
    kind: function
    summary: "BaseModelLoader.load_model: create the model under the model dtype on the target device, load its weights, then process them into kernel formats."
    sources: ["vllm/model_executor/model_loader/base_loader.py:62-115"]
    request:
      type: object
      required: [loader, model, hf_config]
      properties:
        loader: {type: string, examples: [default-model-loader]}
        model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}
        hf_config: {type: object}
    response: ModelsLoadedModel
    behavior:
      - title: model_config.hf_config is the config.json config-platform resolved for this model
        detail: "Fields the caller sends override the hub's config.json; an unknown repo keeps the caller's fields."
        source: "vllm/model_executor/model_loader/base_loader.py:65-72"
        call: hf-hub.download-config
        input: {model: "= input.model"}
        as: hubcfg
        on_error: continue
      - set:
          vars.hf: "= vars.hubcfg.ok ? merge(vars.hubcfg.value, input.hf_config.transformMap(k, v, v != null, v)) : input.hf_config"
      - title: create_model -> initialize_model (on the target device, model dtype)
        source: "vllm/model_executor/model_loader/base_loader.py:73-80"
        call: model-loader-utils.initialize-model
        input: {model: "= input.model", hf_config: "= vars.hf"}
        as: init
      - title: The parameters are allocated on this rank's GPU (target_device context)
        source: "vllm/model_executor/model_loader/base_loader.py:72-80"
        call: gpu-memory.allocate
        input: {kind: weights, bytes: "= vars.hf.weights_bytes / config['tensor-parallel-size']"}
      - title: self.load_weights(model, model_config)
        source: "vllm/model_executor/model_loader/base_loader.py:87-88"
        call: "= input.loader + '.load-weights'"
        targets: [default-model-loader.load-weights, dummy-model-loader.load-weights]
        input: {model: "= input.model", hf_config: "= vars.hf", component: "= vars.init.value.component", quant: "= vars.init.value.quant"}
        as: weights
      - title: process_weights_after_loading (quant repacking, attention scales)
        source: "vllm/model_executor/model_loader/base_loader.py:104-109"
        call: model-loader-utils.process-weights-after-loading
        input: {quant: "= vars.init.value.quant"}
      - return:
          model: "= input.model"
          arch: "= vars.init.value.arch"
          model_cls: "= vars.init.value.model_cls"
          component: "= vars.init.value.component"
          quant: "= vars.init.value.quant"
          loader: "= input.loader"
          weights_bytes_per_rank: "= vars.weights.value.weights_bytes_per_rank"

  - component: model-loader-utils
    name: initialize-model
    kind: function
    summary: "initialize_model: resolve the model class, pass the quant config its packed-module mapping, and construct the model with vllm_config and prefix."
    sources: ["vllm/model_executor/model_loader/utils.py:73-130"]
    request:
      type: object
      required: [model, hf_config]
      properties:
        model: {type: string}
        hf_config: ModelsHfConfig
    response: {type: object, properties: {component: {type: string}, arch: {type: string}, model_cls: {type: string}, quant: {type: string}}}
    behavior:
      - title: get_model_architecture(model_config)
        source: "vllm/model_executor/model_loader/utils.py:84-85"
        call: model-loader-utils.get-model-architecture
        input: {model: "= input.model", architectures: "= input.hf_config.architectures"}
        as: arch
      - set:
          vars.qname: "= ('quantization' in config && config['quantization'] != null) ? config['quantization'] : ((has(input.hf_config.quantization_config) && input.hf_config.quantization_config != null) ? input.hf_config.quantization_config.quant_method : '')"
          vars.quant: unquantized
      - title: ModelConfig._verify_quantization asks the override classes; ModelOpt checkpoints become modelopt / modelopt_fp4 / modelopt_mxfp8 / modelopt_mixed
        source: "vllm/model_executor/layers/quantization/modelopt.py:449-455"
        if: "vars.qname.startsWith('modelopt') && (has(input.hf_config.quantization_config) && input.hf_config.quantization_config != null)"
        then:
          - call: model-opt-quant-config-base.override-quantization-method
            input: {hf_quant_cfg: "= input.hf_config.quantization_config"}
            as: ov
          - when: "vars.ov.value.quantization != null"
            set: {vars.qname: "= vars.ov.value.quantization"}
      - title: vllm_config.quant_config is built from the checkpoint (ModelConfig resolves the method; get_quant_config builds it)
        source: "vllm/model_executor/model_loader/utils.py:87-88"
        if: "vars.qname != ''"
        then:
          - call: weight-utils.get-quant-config
            input: {quantization: "= vars.qname", hf_quant_config: "= (has(input.hf_config.quantization_config) && input.hf_config.quantization_config != null) ? input.hf_config.quantization_config : {}"}
            as: qc
          - set: {vars.quant: "= vars.qc.value.method"}
      - title: new-style model class(vllm_config=..., prefix=...)
        source: "vllm/model_executor/model_loader/utils.py:90-97"
        when: "vars.arch.value.component != 'auto-weights-loader'"
        call: "= vars.arch.value.component + '.init'"
        targets: [llama-for-causal-lm.init, mixtral-for-causal-lm.init]
        input: {hf_config: "= input.hf_config", quant: "= vars.quant"}
      - return: {component: "= vars.arch.value.component", arch: "= vars.arch.value.arch", model_cls: "= vars.arch.value.class_name", quant: "= vars.quant"}

  - component: model-loader-utils
    name: get-model-architecture
    kind: function
    summary: "get_model_architecture: resolve the class through the registry, cached per (model, convert type, runner, impl, architectures)."
    sources: ["vllm/model_executor/model_loader/utils.py:334-350", "vllm/model_executor/model_loader/utils.py:299-331"]
    tags: [writes]
    request:
      type: object
      required: [model, architectures]
      properties:
        model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}
        architectures: {type: array, items: {type: string, examples: [LlamaForCausalLM]}, minItems: 1, maxItems: 1}
    response: ModelsResolvedClass
    behavior:
      - set:
          vars.key: "= input.model.replace('/', '_').replace('-', '_').replace('.', '_') + '__' + input.architectures.join('_')"
      - title: _MODEL_ARCH_BY_HASH hit
        source: "vllm/model_executor/model_loader/utils.py:345-346"
        if: "vars.key in state.arch_cache"
        then:
          - return: "= state.arch_cache[vars.key]"
      - title: registry.resolve_model_cls(hf_config.architectures)
        source: "vllm/model_executor/model_loader/utils.py:302-307"
        call: model-registry.resolve-model-cls
        input: {architectures: "= input.architectures"}
        as: resolved
      - title: Warn when falling back to the Transformers backend; convert_type none keeps the class
        source: "vllm/model_executor/model_loader/utils.py:309-331"
        set:
          "= 'state.arch_cache.' + vars.key": "= vars.resolved.value"
      - return: "= vars.resolved.value"

  - component: model-loader-utils
    name: process-weights-after-loading
    kind: function
    summary: "process_weights_after_loading: every module with a QuantizeMethodBase repacks or quantizes its weights; attention layers set their scales."
    sources: ["vllm/model_executor/model_loader/utils.py:133-209"]
    request: {type: object, properties: {quant: {type: string, examples: [unquantized]}}}
    behavior:
      - title: Quant methods process weights after loading (e.g. FP8 transposes and requantizes)
        source: "vllm/model_executor/model_loader/utils.py:150-180"
        if: "input.quant == 'fp8' || input.quant == 'fp8_block'"
        then:
          - call: fp8-linear-method.process-weights-after-loading
            input: {block: "= input.quant == 'fp8_block'"}
      - title: Attention layers process their weights (KV-cache scales)
        source: "vllm/model_executor/model_loader/utils.py:192-200"
        return: {processed: true}

  - component: default-model-loader
    name: load-weights
    kind: function
    summary: "DefaultModelLoader.load_weights: stream the checkpoint into model.load_weights, then check every parameter was initialized (unquantized models)."
    sources: ["vllm/model_executor/model_loader/default_loader.py:484-518"]
    request:
      type: object
      required: [model, hf_config, component, quant]
      properties:
        model: {type: string}
        hf_config: ModelsHfConfig
        component: {type: string}
        quant: {type: string}
    response: {type: object, properties: {weights_bytes_per_rank: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: get_all_weights -> _prepare_weights (download if not local)
        source: "vllm/model_executor/model_loader/default_loader.py:367-380"
        call: default-model-loader.prepare-weights
        input: {model: "= input.model"}
        as: files
      - title: model.load_weights(self.get_all_weights(model_config, model))
        source: "vllm/model_executor/model_loader/default_loader.py:498"
        call: "= input.component + '.load-weights'"
        targets: [llama-for-causal-lm.load-weights, mixtral-for-causal-lm.load-weights, auto-weights-loader.load-weights]
        input: {model: "= input.model", hf_config: "= input.hf_config", quant: "= input.quant", weights_bytes: "= vars.files.value.weights_bytes", missing_params: "= vars.files.value.missing_params"}
        as: loaded
      - title: Strict check for unquantized models - every parameter must come from the checkpoint
        source: "vllm/model_executor/model_loader/default_loader.py:507-518"
        if: "input.quant == 'unquantized' && size(vars.files.value.missing_params) > 0"
        then:
          - source: "vllm/model_executor/model_loader/default_loader.py:562-567"
            fail: {code: value-error, status: 0, message: "= 'Following weights were not initialized from checkpoint: ' + vars.files.value.missing_params.join(', ')"}
      - return: {weights_bytes_per_rank: "= vars.loaded.value.weights_bytes_per_rank"}

  - component: default-model-loader
    name: prepare-weights
    kind: function
    summary: "_prepare_weights: pick the file patterns for the load format, download them unless the path is local, and refuse a checkpoint with no weight files."
    sources: ["vllm/model_executor/model_loader/default_loader.py:147-263"]
    request: {type: object, required: [model], properties: {model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}}}
    response: {type: object, properties: {weights_bytes: {type: integer}, missing_params: {type: array, items: {type: string}}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
      - code: value-error
        status: 0
        retryable: false
        reachable_by: "Unknown load_format raised at vllm/model_executor/model_loader/default_loader.py:202-203 only when DefaultModelLoader is built directly with a format outside hf/safetensors/fastsafetensors/instanttensor/mistral/pt/npcache; get_model routes only those formats here (vllm/model_executor/model_loader/__init__.py:50-66)"
    behavior:
      - title: load_format auto - mistral if consolidated*.safetensors exist, else hf
        source: "vllm/model_executor/model_loader/default_loader.py:170-203"
        set:
          vars.patterns: "= config['load-format'] in ['safetensors', 'fastsafetensors', 'instanttensor'] ? ['*.safetensors'] : (config['load-format'] == 'pt' ? ['*.pt'] : ['*.safetensors', '*.bin', '*.pt'])"
      - title: Not a local directory - download_weights_from_hf
        source: "vllm/model_executor/model_loader/default_loader.py:213-223"
        call: weight-utils.download-weights-from-hf
        input: {model: "= input.model", allow_patterns: "= vars.patterns"}
        as: dl
      - title: No weight files matched
        source: "vllm/model_executor/model_loader/default_loader.py:258-261"
        if: "vars.dl.value.weights_bytes == 0"
        then:
          - fail: {code: runtime-error, status: 0, message: "= 'Cannot find any model weights with `' + input.model + '`'"}
      - return: {weights_bytes: "= vars.dl.value.weights_bytes", missing_params: "= has(vars.dl.value.missing_params) ? vars.dl.value.missing_params : []"}

  - component: default-model-loader
    name: download-model
    kind: function
    summary: "download_model: run _prepare_weights only, so the checkpoint is cached before workers start."
    sources: ["vllm/model_executor/model_loader/default_loader.py:389-396"]
    request: {type: object, required: [model], properties: {model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}}}
    behavior:
      - call: default-model-loader.prepare-weights
        input: {model: "= input.model"}
        as: files
      - return: {downloaded: true, weights_bytes: "= vars.files.value.weights_bytes"}

  - component: dummy-model-loader
    name: load-weights
    kind: function
    summary: "DummyModelLoader.load_weights: no download; random values in every tensor (online-quant layers are materialized and processed)."
    sources: ["vllm/model_executor/model_loader/dummy_loader.py:32-48"]
    request:
      type: object
      required: [model, hf_config, component, quant]
      properties: {model: {type: string}, hf_config: ModelsHfConfig, component: {type: string}, quant: {type: string}}
    response: {type: object, properties: {weights_bytes_per_rank: {type: integer}}}
    behavior:
      - title: initialize_single_dummy_weight for every local tensor
        source: "vllm/model_executor/model_loader/dummy_loader.py:35-48"
        call: "= input.component + '.load-weights'"
        targets: [llama-for-causal-lm.load-weights, mixtral-for-causal-lm.load-weights, auto-weights-loader.load-weights]
        input: {model: "= input.model", hf_config: "= input.hf_config", quant: "= input.quant", weights_bytes: "= input.hf_config.weights_bytes", missing_params: []}
        as: loaded
      - return: {weights_bytes_per_rank: "= vars.loaded.value.weights_bytes_per_rank"}

  - component: weight-utils
    name: download-weights-from-hf
    kind: function
    summary: "download_weights_from_hf: narrow the patterns to one (or the index's file list), then snapshot_download under a per-model file lock."
    sources: ["vllm/model_executor/model_loader/weight_utils.py:431-537"]
    request:
      type: object
      required: [model]
      properties:
        model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}
        allow_patterns: {type: array, items: {type: string}}
    response: {type: object, properties: {weights_bytes: {type: integer}, missing_params: {type: array, items: {type: string}}}}
    errors:
      - {code: repository-not-found-error, status: 0, retryable: false}
    behavior:
      - title: Lock the model's download so concurrent ranks do not download twice
        source: "vllm/model_executor/model_loader/weight_utils.py:509-511"
        call: hf-hub.download-weights
        input: {model: "= input.model"}
        as: snap
      - return: {weights_bytes: "= vars.snap.value.weights_bytes", missing_params: "= has(vars.snap.value.missing_params) ? vars.snap.value.missing_params : []"}

  - component: weight-utils
    name: get-quant-config
    kind: function
    summary: "get_quant_config: build the QuantizationConfig from the checkpoint's quantization_config (or a quant config file, or an online shorthand)."
    sources: ["vllm/model_executor/model_loader/weight_utils.py:192-395"]
    request:
      type: object
      required: [quantization]
      properties:
        quantization: {type: string, examples: [fp8]}
        hf_quant_config: {type: object}
    response: {type: object, properties: {config_cls: {type: string}, method: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: Quantization method must be set
        source: "vllm/model_executor/model_loader/weight_utils.py:195-196"
        if: "input.quantization == ''"
        then:
          - fail: {code: value-error, status: 0, message: "Model quantization method is not specified in the config."}
      - source: "vllm/model_executor/model_loader/weight_utils.py:197"
        call: quantization.get-quantization-config
        input: {quantization: "= input.quantization"}
        as: cls
      - title: The checkpoint's quantization_config -> quant_cls.from_config
        source: "vllm/model_executor/model_loader/weight_utils.py:258-274"
        if: "has(input.hf_quant_config) && size(input.hf_quant_config) > 0"
        then:
          - if: "vars.cls.value.config_cls == 'Fp8Config'"
            then:
              - call: fp8-config.from-config
                input: "= input.hf_quant_config"
                as: fp8
              - return: {config_cls: Fp8Config, method: "= vars.fp8.value.method"}
          - return: {config_cls: "= vars.cls.value.config_cls", method: "= input.quantization"}
      - title: No checkpoint config - an online shorthand builds OnlineQuantizationConfig
        source: "vllm/model_executor/model_loader/weight_utils.py:370-374"
        if: "vars.cls.value.online"
        then:
          - return: {config_cls: OnlineQuantizationConfig, method: "= input.quantization"}
      - source: "vllm/model_executor/model_loader/weight_utils.py:375"
        fail: {code: value-error, status: 0, message: "= 'Cannot find the config file for ' + input.quantization"}

  - component: quantization
    name: get-quantization-config
    kind: function
    summary: "get_quantization_config: refuse an unknown method, else return its QuantizationConfig class."
    sources: ["vllm/model_executor/layers/quantization/__init__.py:112-195"]
    request: {type: object, required: [quantization], properties: {quantization: {type: string, examples: [fp8]}}}
    response: {type: object, properties: {config_cls: {type: string}, online: {type: boolean}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/model_executor/layers/quantization/__init__.py:113-114"
        if: "!(input.quantization in state.methods)"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Invalid quantization method: ' + input.quantization"}
      - title: method_to_config[quantization] (online shorthands map to OnlineQuantizationConfig)
        source: "vllm/model_executor/layers/quantization/__init__.py:156-195"
        return: {config_cls: "= state.methods[input.quantization]", online: "= input.quantization in state.online_shorthands"}

  - component: fp8-config
    name: from-config
    kind: function
    summary: "Fp8Config.from_config/__init__: only serialized FP8 checkpoints; a known activation scheme; block quantization needs a 2-D block and the dynamic scheme."
    sources: ["vllm/model_executor/layers/quantization/fp8.py:157-175", "vllm/model_executor/layers/quantization/fp8.py:95-135"]
    request:
      type: object
      required: [quant_method, activation_scheme]
      properties:
        quant_method: {type: string, examples: [fp8]}
        activation_scheme: {type: string, examples: [dynamic]}
        weight_block_size: {type: [array, "null"], items: {type: integer}, default: null}
    response: {type: object, properties: {method: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: Online fp8 was removed - use fp8_per_tensor
        source: "vllm/model_executor/layers/quantization/fp8.py:105-111"
        if: "!input.quant_method.contains('fp8')"
        then:
          - fail: {code: value-error, status: 0, message: "The `fp8` quantization method no longer supports online quantization. Please use `--quantization fp8_per_tensor` instead."}
      - source: "vllm/model_executor/layers/quantization/fp8.py:112-113"
        if: "!(input.activation_scheme in ['static', 'dynamic'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Unsupported activation scheme ' + input.activation_scheme"}
      - title: Block-wise FP8 (DeepSeek-style 128x128 blocks)
        source: "vllm/model_executor/layers/quantization/fp8.py:120-133"
        if: "has(input.weight_block_size) && input.weight_block_size != null"
        then:
          - if: "size(input.weight_block_size) != 2"
            then:
              - fail: {code: value-error, status: 0, message: "= 'The quantization block size of weight must have 2 dimensions, but got ' + string(size(input.weight_block_size)) + ' dimensions'"}
          - if: "input.activation_scheme != 'dynamic'"
            then:
              - fail: {code: value-error, status: 0, message: "= 'The block-wise quantization only supports dynamic activation scheme for now, but got ' + input.activation_scheme + ' activation scheme.'"}
          - return: {method: fp8_block}
      - return: {method: fp8}

  - component: fp8-config
    name: get-quant-method
    kind: function
    summary: "Fp8Config.get_quant_method: FP8 linear for linear layers (unless ignored), FP8 MoE for routed experts, FP8 KV-cache scales for attention."
    sources: ["vllm/model_executor/layers/quantization/fp8.py:177-212"]
    request:
      type: object
      required: [layer_kind, prefix]
      properties:
        layer_kind: {type: string, examples: [linear]}
        prefix: {type: string, examples: [model.layers.0.self_attn.qkv_proj]}
        ignored_layers: {type: array, items: {type: string}, default: []}
    response: {type: object, properties: {quant_method: {type: string}}}
    behavior:
      - set:
          vars.ignored: "= has(input.ignored_layers) && input.prefix in input.ignored_layers"
      - title: Linear layers
        source: "vllm/model_executor/layers/quantization/fp8.py:180-190"
        if: "input.layer_kind == 'linear'"
        then:
          - return: {quant_method: "= vars.ignored ? 'UnquantizedLinearMethod' : 'Fp8LinearMethod'"}
      - title: Routed experts
        source: "vllm/model_executor/layers/quantization/fp8.py:191-205"
        if: "input.layer_kind == 'routed_experts'"
        then:
          - return: {quant_method: "= vars.ignored ? 'UnquantizedFusedMoEMethod' : 'Fp8MoEMethod'"}
      - source: "vllm/model_executor/layers/quantization/fp8.py:206-208"
        if: "input.layer_kind == 'attention'"
        then:
          - return: {quant_method: Fp8KVCacheMethod}
      - return: {quant_method: none}

  - component: ipc-model-loader
    name: load-model
    kind: function
    summary: "IpcModelLoader.load_model: fetch tensors from the local GPU's weight cache daemon; on an unavailable daemon or a fingerprint mismatch fall back to disk when fallback is on."
    sources: ["vllm/model_executor/model_loader/weight_cache/ipc_loader.py:190-237"]
    request: ModelsGetModelRequest
    response: ModelsLoadedModel
    errors:
      - {code: weight-cache-unavailable-error, status: 0, retryable: false}
      - {code: cache-config-mismatch-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.fallback: "= has(config['model-loader-extra-config'].fallback) ? config['model-loader-extra-config'].fallback : true"
      - title: _fetch_entries -> get_state over the daemon's Unix socket (same GPU)
        source: "vllm/model_executor/model_loader/weight_cache/ipc_loader.py:345-360"
        call: weight-cache-daemon.handle-connection
        input:
          cmd: get_state
          cache_config: {model: "= input.model", tp_size: "= config['tensor-parallel-size']", tp_rank: "= self"}
        as: state_resp
        on_error: continue
      - title: Daemon unreachable - WeightCacheUnavailableError
        source: "vllm/model_executor/model_loader/weight_cache/ipc_loader.py:216-221"
        if: "!vars.state_resp.ok"
        then:
          - if: "!vars.fallback"
            then:
              - fail: {code: weight-cache-unavailable-error, status: 0, message: "= 'Weight cache daemon unavailable: ' + vars.state_resp.error.code"}
          - set: {ctx.ipc_fallback: unavailable}
          - title: Fall back to disk loading
            source: "vllm/model_executor/model_loader/weight_cache/ipc_loader.py:237"
            call: base-model-loader.load-model
            input: {loader: default-model-loader, model: "= input.model", hf_config: "= input.hf_config"}
            as: disk1
          - return: "= vars.disk1.value"
      - title: Fingerprint mismatch - CacheConfigMismatchError
        source: "vllm/model_executor/model_loader/weight_cache/ipc_loader.py:216-221"
        if: "vars.state_resp.value.status != 'ok'"
        then:
          - if: "!vars.fallback"
            then:
              - fail: {code: cache-config-mismatch-error, status: 0, message: "= 'Weight cache state: ' + vars.state_resp.value.status"}
          - set: {ctx.ipc_fallback: "= vars.state_resp.value.status"}
          - call: base-model-loader.load-model
            input: {loader: default-model-loader, model: "= input.model", hf_config: "= input.hf_config"}
            as: disk2
          - return: "= vars.disk2.value"
      - title: _build_model maps every tensor; process_weights_after_loading is skipped
        source: "vllm/model_executor/model_loader/weight_cache/ipc_loader.py:213-214"
        call: model-loader-utils.initialize-model
        input: {model: "= input.model", hf_config: "= input.hf_config"}
        as: init
      - when: "vars.init.value.component != 'auto-weights-loader'"
        call: "= vars.init.value.component + '.load-weights'"
        targets: [llama-for-causal-lm.load-weights, mixtral-for-causal-lm.load-weights]
        input: {model: "= input.model", hf_config: "= input.hf_config", quant: "= vars.init.value.quant", weights_bytes: "= input.hf_config.weights_bytes", missing_params: []}
      - set: {ctx.ipc_fallback: none}
      - return: {model: "= input.model", arch: "= vars.init.value.arch", model_cls: "= vars.init.value.model_cls", component: "= vars.init.value.component", quant: "= vars.init.value.quant", loader: ipc-model-loader, weights_bytes_per_rank: "= input.hf_config.weights_bytes / config['tensor-parallel-size']"}

  - component: auto-weights-loader
    name: load-weights
    kind: function
    summary: "AutoWeightsLoader.load_weights: apply the checkpoint-name mapper (plus the quant config's scale mappers) and load module by module; unknown names fail."
    sources: ["vllm/model_executor/models/utils.py:450-500"]
    request:
      type: object
      properties:
        model: {type: string}
        weights_bytes: {type: integer}
        unexpected_names: {type: array, items: {type: string}, default: []}
    response: {type: object, properties: {weights_bytes_per_rank: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: A checkpoint tensor with no matching module or parameter
        source: "vllm/model_executor/models/utils.py:441-448"
        if: "has(input.unexpected_names) && size(input.unexpected_names) > 0"
        then:
          - fail: {code: value-error, status: 0, message: "= 'There is no module or parameter named ' + input.unexpected_names[0]"}
      - title: Each parameter's weight_loader narrows its TP shard
        source: "vllm/model_executor/models/utils.py:461-470"
        return: {weights_bytes_per_rank: "= (has(input.weights_bytes) ? input.weights_bytes : 0) / config['tensor-parallel-size']"}
