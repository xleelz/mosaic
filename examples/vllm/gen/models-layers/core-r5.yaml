# models-layers fix round 5 (precision): Qwen2-VL, MoE parallel layout and expert counts,
# KV-cache quantization on attention layers, TurboQuant presets, the MxInt4 experts checks,
# MoE LoRA format validation, remote media fetching, and the round-5 unit-test interfaces.
components:
  - id: qwen2-vl-for-conditional-generation
    name: Qwen2VLForConditionalGeneration
    kind: module
    parent: model-executor
    layer: models
    summary: "Qwen2-VL: a Qwen2 vision transformer (patch embed, 32 blocks, 2x2 patch merger) plus a Qwen2ForCausalLM language model with M-RoPE. Holds this rank's loaded weights."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1286-1308", "vllm/model_executor/models/qwen2_vl.py:1402-1430"]
    state:
      initial: {loaded: false}
  - id: qwen2-vision-transformer
    name: Qwen2VisionTransformer
    kind: module
    parent: qwen2-vl-for-conditional-generation
    layer: models
    summary: "The Qwen2-VL vision tower: Conv3d patch embedding (temporal 2 x 14 x 14), depth x (LayerNorm, ViT attention, QuickGELU MLP), then a patch merger that turns every 2x2 patches into one language-model token."
    sources: ["vllm/model_executor/models/qwen2_vl.py:525-604", "vllm/model_executor/models/qwen2_vl.py:717-755"]
  - id: qwen2-model
    name: Qwen2Model / Qwen2ForCausalLM
    kind: module
    parent: qwen2-vl-for-conditional-generation
    layer: models
    summary: "The Qwen2 decoder stack Qwen2-VL wraps as its language model (embedding, decoder layers, final norm, LM head)."
    sources: ["vllm/model_executor/models/qwen2.py:324-456", "vllm/model_executor/models/qwen2.py:458-520"]
  - id: qwen2-vl-processing-info
    name: Qwen2VLProcessingInfo
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "Qwen2-VL's processing info: unlimited images and videos per prompt (the user limit applies), and the token count of an item from smart_resize and the patch grid."
    sources: ["vllm/model_executor/models/qwen2_vl.py:845-866", "vllm/model_executor/models/qwen2_vl.py:989-1058"]
  - id: fused-moe-layer
    name: fused_moe/layer.py (FusedMoEFactory helpers)
    kind: module
    parent: fused-moe
    layer: moe
    summary: "The module-level helpers FusedMoEFactory builds a routed-experts layer with: make_parallel_config and determine_expert_counts."
    sources: ["vllm/model_executor/layers/fused_moe/layer.py:43-85", "vllm/model_executor/layers/fused_moe/layer.py:232-255"]
  - id: turbo-quant-config
    name: TurboQuantConfig
    kind: module
    parent: quantization
    layer: quantization
    summary: "TurboQuant KV-cache quantization presets (turboquant_k8v4, _4bit_nc, _k3v4_nc, _3bit_nc) and the packed key/value slot sizes derived from them."
    sources: ["vllm/model_executor/layers/quantization/turboquant/config.py:20-41", "vllm/model_executor/layers/quantization/turboquant/config.py:44-175"]
    state:
      initial:
        presets:
          turboquant_k8v4: {key_quant_bits: 8, value_quant_bits: 4, norm_correction: false}
          turboquant_4bit_nc: {key_quant_bits: 4, value_quant_bits: 4, norm_correction: true}
          turboquant_k3v4_nc: {key_quant_bits: 3, value_quant_bits: 4, norm_correction: true}
          turboquant_3bit_nc: {key_quant_bits: 3, value_quant_bits: 3, norm_correction: true}
  - id: trtllm-mxint4-experts
    name: TrtLlmMxint4ExpertsMonolithic
    kind: module
    parent: fused-moe
    layer: moe
    summary: "FlashInfer TRT-LLM MxInt4 monolithic MoE experts (SM100 family): int4 weights in 32-groups, unquantized activations, SiLU/SwiGLU-OAI only, no EPLB."
    sources: ["vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:21-115"]
  - id: base-kv-cache-method
    name: BaseKVCacheMethod (Fp8KVCacheMethod)
    kind: module
    parent: quantization
    layer: quantization
    summary: "The quant method a quantized checkpoint gives each attention layer: it registers q/k/v/prob scale parameters for the checkpoint to fill, then turns them into the float scales the KV cache uses."
    sources: ["vllm/model_executor/layers/quantization/kv_cache.py:40-75"]
  - id: quant-config-utils
    name: quantization/utils/config_utils.py
    kind: module
    parent: quantization
    layer: quantization
    summary: "Layer-name matching for quantization targets and ignore lists: exact names, 're:' regexes (re.match), opt-in fnmatch, and per-shard matching of fused layers."
    sources: ["vllm/model_executor/layers/quantization/utils/config_utils.py:344-412"]
  - id: cohere-asr-for-conditional-generation
    name: CohereAsrForConditionalGeneration
    kind: module
    parent: model-executor
    layer: models
    summary: "Cohere's speech-to-text model; the streaming token estimate from an audio duration (registry-level otherwise)."
    sources: ["vllm/model_executor/models/cohere_asr.py:2189-2203"]
  - id: remote-media-host
    name: remote HTTP(S) media hosts
    kind: external
    parent: model-executor
    layer: multimodal
    summary: "Any HTTP(S) server a request's image_url points at, other than the vLLM public-assets bucket. Table `urls` holds what each URL serves, keyed by URL; a missing URL is a 404."
    sources: ["vllm/multimodal/media/connector.py:367-408"]
    attributes: {owner: models-layers}
    state:
      schema: {type: object, properties: {urls: {type: object}}}
      initial: {urls: {}}

  - id: flashinfer-ssu-backend
    name: FlashInferSSUBackend
    kind: module
    parent: model-executor
    layer: layers
    summary: "The FlashInfer Mamba selective-state-update backend: needs flashinfer.mamba at construction."
    sources: ["vllm/model_executor/layers/mamba/ops/ssu_dispatch.py:333-347"]

interfaces:
  # ------------------------------------------------------------------ Qwen2-VL
  - component: qwen2-vl-for-conditional-generation
    name: init
    kind: function
    summary: "Qwen2VLForConditionalGeneration(vllm_config, prefix): build the vision tower (Qwen2VisionTransformer) and the Qwen2ForCausalLM language model with M-RoPE; attention layers set up KV-cache quantization."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1402-1430"]
    tags: [writes]
    request:
      type: object
      required: [hf_config, quant]
      properties:
        hf_config: ModelsHfConfig
        quant: {type: string, examples: [unquantized]}
        kv_quant_method: {type: string, default: none}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.hf: "= input.hf_config", vars.tp: "= config['tensor-parallel-size']"}
      - title: "Qwen2-VL needs a vision_config (Qwen2VLConfig)"
        source: "vllm/model_executor/models/qwen2_vl.py:1404-1416"
        if: "!has(vars.hf.vision_config) || vars.hf.vision_config == null"
        then:
          - fail: {code: value-error, status: 0, message: "Qwen2VLForConditionalGeneration requires hf_config.vision_config"}
      - title: "Qwen2Attention: heads and KV heads split across TP ranks"
        source: "vllm/model_executor/models/qwen2.py:136-149"
        if: "vars.hf.num_attention_heads % vars.tp != 0 || (vars.hf.num_key_value_heads >= vars.tp && vars.hf.num_key_value_heads % vars.tp != 0) || (vars.hf.num_key_value_heads < vars.tp && vars.tp % vars.hf.num_key_value_heads != 0)"
        then:
          - fail: {code: assertion-error, status: 0, message: ""}
      - title: "The vision tower: patch embed, depth blocks and the patch merger"
        source: "vllm/model_executor/models/qwen2_vl.py:1410-1417"
        call: qwen2-vision-transformer.init
        input: {vision_config: "= vars.hf.vision_config"}
        as: vis
      - title: "Qwen2Attention's rotary embedding: rope_parameters carry mrope_section, so get_rope builds MRotaryEmbedding"
        source: "vllm/model_executor/models/qwen2.py:179-185"
        call: rotary-embedding.get-rope
        input:
          head_size: "= vars.hf.hidden_size / vars.hf.num_attention_heads"
          max_position: "= vars.hf.max_position_embeddings"
          rope_parameters: "= has(vars.hf.rope_scaling) && vars.hf.rope_scaling != null && has(vars.hf.rope_scaling.mrope_section) ? {'rope_type': 'default', 'mrope_section': vars.hf.rope_scaling.mrope_section} : {}"
        as: rope
      - title: "Each attention layer initializes its KV-cache scales and quant method"
        source: "vllm/model_executor/layers/attention/attention.py:157-226"
        call: attention-layer.init-kv-cache-quant
        input: {kv_quant_method: "= input.kv_quant_method"}
      - title: "init_vllm_registered_model(architectures=['Qwen2ForCausalLM']) for the language model"
        source: "vllm/model_executor/models/qwen2_vl.py:1419-1424"
        set:
          state.loaded: false
          state.tp_size: "= vars.tp"
          state.quant: "= input.quant"
          state.rope: "= vars.rope.value.cls"
          state.cfg:
            hidden_size: "= vars.hf.hidden_size"
            num_heads: "= vars.hf.num_attention_heads"
            num_kv_heads: "= vars.hf.num_key_value_heads"
            head_dim: "= vars.hf.hidden_size / vars.hf.num_attention_heads"
            intermediate_size: "= has(vars.hf.intermediate_size) && vars.hf.intermediate_size != null ? vars.hf.intermediate_size : vars.hf.hidden_size * 7 / 2"
            num_layers: "= vars.hf.num_hidden_layers"
            vocab_size: "= vars.hf.vocab_size"
            bytes_per_weight: "= input.quant == 'unquantized' ? 2.0 : 1.0"
            mrope_section: "= has(vars.hf.rope_scaling) && vars.hf.rope_scaling != null && has(vars.hf.rope_scaling.mrope_section) ? vars.hf.rope_scaling.mrope_section : null"
            image_token_id: "= has(vars.hf.image_token_id) ? vars.hf.image_token_id : 151655"
            video_token_id: "= has(vars.hf.video_token_id) ? vars.hf.video_token_id : 151656"
            vision: "= vars.vis.value"
      - return: {initialized: true, rope: "= vars.rope.value.cls"}

  - component: qwen2-vl-for-conditional-generation
    name: load-weights
    kind: function
    summary: "Qwen2VLForConditionalGeneration.load_weights: AutoWeightsLoader with hf_to_vllm_mapper (model.language_model. / model. -> language_model.model., model.visual. -> visual., lm_head. -> language_model.lm_head.)."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1852-1854", "vllm/model_executor/models/qwen2_vl.py:1295-1304"]
    tags: [writes]
    request:
      type: object
      properties:
        model: {type: string, examples: [Qwen/Qwen2-VL-7B-Instruct]}
        weights_bytes: {type: integer}
    response: {type: object, properties: {weights_bytes_per_rank: {type: integer}}}
    behavior:
      - title: "hf_to_vllm_mapper renames checkpoint prefixes before loading"
        source: "vllm/model_executor/models/qwen2_vl.py:1295-1304"
        call: weights-mapper.map-name
        input:
          key: "model.visual.patch_embed.proj.weight"
          prefix: [["model.language_model.", "language_model.model."], ["model.visual.", "visual."], ["lm_head.", "language_model.lm_head."], ["model.", "language_model.model."]]
        as: mapped
      - source: "vllm/model_executor/models/qwen2_vl.py:1852-1854"
        call: auto-weights-loader.load-weights
        input: {model: "= input.model", weights_bytes: "= input.weights_bytes"}
        as: awl
      - set:
          state.loaded: true
          state.model: "= input.model"
          state.weights_bytes_per_rank: "= vars.awl.value.weights_bytes_per_rank"
      - return: {weights_bytes_per_rank: "= vars.awl.value.weights_bytes_per_rank"}

  - component: qwen2-vl-for-conditional-generation
    name: embed-multimodal
    kind: function
    summary: "embed_multimodal (the runner's _execute_mm_encoder): parse pixel_values / image_embeds and their video counterparts in kwargs order, run the vision tower once per modality on the pixel inputs, and split the merged embeddings per item (t*h*w / merge^2 tokens each)."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1531-1573", "vllm/model_executor/models/qwen2_vl.py:1480-1529", "vllm/model_executor/models/qwen2_vl.py:1432-1478"]
    request:
      type: object
      properties:
        mm_kwargs:
          type: array
          default: []
          description: "the batch's multimodal items in kwargs order: {modality: image | video, kind: pixel_values | embeds, grid_thw: [t, h, w]}"
          items: {type: object}
    response:
      type: object
      properties:
        embeddings: {type: array, items: {type: object}}
        num_tokens: {type: integer}
    errors:
      - {code: attribute-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: "The runner only has a model after load_model"
        if: "!state.loaded"
        then:
          - fail: {code: attribute-error, status: 0, message: "model weights are not loaded on this rank"}
      - title: "No multimodal kwargs - an empty list"
        source: "vllm/model_executor/models/qwen2_vl.py:1551-1553"
        if: "size(input.mm_kwargs) == 0"
        then:
          - return: {embeddings: [], num_tokens: 0}
      - title: "Only image and video modalities"
        source: "vllm/model_executor/models/qwen2_vl.py:1352"
        if: "input.mm_kwargs.exists(m, !(m.modality in ['image', 'video']))"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Unsupported modality: ' + input.mm_kwargs.filter(m, !(m.modality in ['image', 'video']))[0].modality"}
      - set:
          vars.merge: "= state.cfg.vision.spatial_merge_size"
          vars.order: "= input.mm_kwargs[0].modality == 'image' ? ['image', 'video'] : ['video', 'image']"
      - title: "_parse_and_validate_multimodal_inputs keeps the modalities in kwargs order; each modality's items are processed together"
        source: "vllm/model_executor/models/qwen2_vl.py:1531-1548"
        set:
          vars.items: "= vars.order.map(mod, input.mm_kwargs.filter(m, m.modality == mod)).filter(g, size(g) > 0)"
      - set: {vars.out: []}
      - foreach: "= vars.items"
        as: group
        steps:
          - set:
              vars.pix: "= vars.group.filter(m, !has(m.kind) || m.kind == 'pixel_values')"
          - title: "Pixel inputs: self.visual(pixel_values, grid_thw) once for the modality (embeddings inputs skip the tower)"
            source: "vllm/model_executor/models/qwen2_vl.py:1489-1501"
            when: "size(vars.pix) > 0"
            call: qwen2-vision-transformer.forward
            input: {grid_thw: "= vars.pix.map(m, m.grid_thw)", vision: "= state.cfg.vision", tp: "= config['tensor-parallel-size']"}
          - title: "Split per item: grid_thw.prod(-1) // merge_size // merge_size"
            source: "vllm/model_executor/models/qwen2_vl.py:1503-1505"
            set:
              vars.out: "= vars.out + vars.group.map(m, {'modality': m.modality, 'num_tokens': m.grid_thw[0] * m.grid_thw[1] * m.grid_thw[2] / vars.merge / vars.merge, 'hidden_size': state.cfg.hidden_size})"
      - return: {embeddings: "= vars.out", num_tokens: "= sum(vars.out.map(e, e.num_tokens))"}

  - component: qwen2-vl-for-conditional-generation
    name: embed-input-ids
    kind: function
    summary: "SupportsMultiModal.embed_input_ids: text embeddings for input_ids, then _merge_multimodal_embeddings scatters the items' embeddings over the placeholder positions; a count mismatch is a ValueError."
    sources: ["vllm/model_executor/models/interfaces.py:481-515", "vllm/model_executor/models/utils.py:699-753"]
    request:
      type: object
      required: [num_tokens]
      properties:
        num_tokens: {type: integer, examples: [64]}
        mm_embeds: {type: array, items: {type: integer}, default: [], description: "tokens per multimodal embedding item (each a [n, hidden] tensor)"}
        num_placeholders: {type: integer, default: 0, description: "is_multimodal.sum(): placeholder positions in this step's tokens"}
    response: {type: object, properties: {num_tokens: {type: integer}, merged: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: "Text embeddings first (the language model's embed_input_ids)"
        source: "vllm/model_executor/models/interfaces.py:500-506"
        call: vocab-parallel-embedding.forward
        input: {num_tokens: "= input.num_tokens", vocab_size: "= state.cfg.vocab_size", hidden_size: "= state.cfg.hidden_size", tp: "= config['tensor-parallel-size']"}
      - title: "No multimodal embeddings - text only"
        source: "vllm/model_executor/models/interfaces.py:508-509"
        if: "size(input.mm_embeds) == 0"
        then:
          - return: {num_tokens: "= input.num_tokens", merged: 0}
      - title: "inputs_embeds[is_multimodal] = mm_embeds_flat fails when the counts differ"
        source: "vllm/model_executor/models/utils.py:736-751"
        if: "sum(input.mm_embeds) != input.num_placeholders"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Attempted to assign ' + input.mm_embeds.map(n, string(n)).join(' + ') + ' = ' + string(sum(input.mm_embeds)) + ' multimodal tokens to ' + string(input.num_placeholders) + ' placeholders'"}
      - return: {num_tokens: "= input.num_tokens", merged: "= sum(input.mm_embeds)"}

  - component: qwen2-vl-for-conditional-generation
    name: get-mrope-input-positions
    kind: function
    summary: "get_mrope_input_positions: 3 x N (t, h, w) positions. Text runs count up on all three rows; an item's grid (t, h/merge, w/merge) starts after the preceding text; video t indices scale by second_per_grid_ts x tokens_per_second. Returns the positions and mrope_position_delta = max + 1 - N."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1310-1392"]
    request:
      type: object
      required: [num_input_tokens]
      properties:
        num_input_tokens: {type: integer, examples: [12]}
        mm_features: {type: array, default: [], items: {type: object}, description: "{offset, modality, grid_thw: [t, h, w], second_per_grid_ts}; sorted by offset"}
        spatial_merge_size: {type: integer, default: 2}
        tokens_per_second: {type: number, default: 1.0}
    response:
      type: object
      properties:
        positions: {type: array, items: {type: array, items: {type: integer}}}
        mrope_position_delta: {type: integer}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.m: "= input.spatial_merge_size", vars.t: [], vars.h: [], vars.w: [], vars.st: 0, vars.next: 0}
      - foreach: "= input.mm_features"
        as: f
        steps:
          - title: "iter_mm_grid_thw: only image and video features"
            source: "vllm/model_executor/models/qwen2_vl.py:1351-1352"
            if: "!(vars.f.modality in ['image', 'video'])"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Unsupported modality: ' + vars.f.modality"}
          - title: "An image has exactly one frame"
            source: "vllm/model_executor/models/qwen2_vl.py:1330-1331"
            if: "vars.f.modality == 'image' && vars.f.grid_thw[0] != 1"
            then:
              - fail: {code: assertion-error, status: 0, message: "= 'Image must have 1 frame, got ' + string(vars.f.grid_thw[0])"}
          - set:
              vars.gt: "= vars.f.grid_thw[0]"
              vars.gh: "= vars.f.grid_thw[1] / vars.m"
              vars.gw: "= vars.f.grid_thw[2] / vars.m"
              vars.tf: "= vars.f.modality == 'video' ? (has(vars.f.second_per_grid_ts) && vars.f.second_per_grid_ts != null ? double(vars.f.second_per_grid_ts) : 1.0) * double(input.tokens_per_second) : 1.0"
              vars.tl: "= vars.f.offset - vars.st"
          - title: "Text before the item: arange(text_len) + st_idx on all three rows"
            source: "vllm/model_executor/models/qwen2_vl.py:1368-1372"
            set:
              vars.t: "= vars.t + lists.range(vars.tl).map(i, vars.next + i)"
              vars.h: "= vars.h + lists.range(vars.tl).map(i, vars.next + i)"
              vars.w: "= vars.w + lists.range(vars.tl).map(i, vars.next + i)"
              vars.base: "= vars.next + vars.tl"
          - title: "The item's grid indices + text_len + st_idx (t scaled by t_factor when it isn't 1)"
            source: "vllm/model_executor/models/qwen2_vl.py:1374-1378"
            set:
              vars.t: "= vars.t + lists.range(vars.gt * vars.gh * vars.gw).map(k, vars.base + int(double(k / (vars.gh * vars.gw)) * vars.tf))"
              vars.h: "= vars.h + lists.range(vars.gt * vars.gh * vars.gw).map(k, vars.base + (k / vars.gw) % vars.gh)"
              vars.w: "= vars.w + lists.range(vars.gt * vars.gh * vars.gw).map(k, vars.base + k % vars.gw)"
              vars.next: "= vars.base + math.greatest([int(double(vars.gt - 1) * vars.tf), vars.gh - 1, vars.gw - 1]) + 1"
              vars.st: "= vars.f.offset + vars.gt * vars.gh * vars.gw"
      - title: "Trailing text"
        source: "vllm/model_executor/models/qwen2_vl.py:1380-1385"
        when: "vars.st < input.num_input_tokens"
        set:
          vars.t: "= vars.t + lists.range(input.num_input_tokens - vars.st).map(i, vars.next + i)"
          vars.h: "= vars.h + lists.range(input.num_input_tokens - vars.st).map(i, vars.next + i)"
          vars.w: "= vars.w + lists.range(input.num_input_tokens - vars.st).map(i, vars.next + i)"
          vars.next: "= vars.next + input.num_input_tokens - vars.st"
      - title: "mrope_position_delta = llm_positions.max() + 1 - len(input_tokens)"
        source: "vllm/model_executor/models/qwen2_vl.py:1387-1390"
        return: {positions: ["= vars.t", "= vars.h", "= vars.w"], mrope_position_delta: "= vars.next - input.num_input_tokens"}

  - component: qwen2-vl-for-conditional-generation
    name: get-placeholder-str
    kind: function
    summary: "get_placeholder_str: the prompt text a chat image or video part becomes."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1393-1400"]
    request: {type: object, required: [modality], properties: {modality: {type: string, examples: [image]}}}
    response: {type: object, properties: {placeholder: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "input.modality.startsWith('image')"
        then:
          - return: {placeholder: "<|vision_start|><|image_pad|><|vision_end|>"}
      - if: "input.modality.startsWith('video')"
        then:
          - return: {placeholder: "<|vision_start|><|video_pad|><|vision_end|>"}
      - fail: {code: value-error, status: 0, message: "Only image or video modality is supported"}

  - component: qwen2-vl-for-conditional-generation
    name: forward
    kind: function
    summary: "Qwen2VLForConditionalGeneration.forward: run the language model on input_ids or the merged inputs_embeds, with (3, N) M-RoPE positions."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1811-1844"]
    request: ModelsForwardRequest
    response: ModelsForwardResult
    errors:
      - {code: attribute-error, status: 0, retryable: false}
    behavior:
      - title: "The runner only has a model after load_model"
        if: "!state.loaded"
        then:
          - fail: {code: attribute-error, status: 0, message: "model weights are not loaded on this rank"}
      - source: "vllm/model_executor/layers/attention/attention.py:700-721"
        call: attention-layer.get-attention-context
        input: "= input"
        as: md
      - source: "vllm/model_executor/models/qwen2_vl.py:1837-1843"
        call: qwen2-model.forward
        input: {num_tokens: "= input.num_tokens", cfg: "= state.cfg", tp: "= config['tensor-parallel-size']", quant: "= state.quant", attn_metadata: "= vars.md.value", inputs_embeds: "= has(input.inputs_embeds) && input.inputs_embeds"}
        as: out
      - return: {num_tokens: "= input.num_tokens", hidden_size: "= state.cfg.hidden_size", num_layers: "= state.cfg.num_layers", owner_ms: "= vars.out.value.owner_ms"}

  - component: qwen2-vl-for-conditional-generation
    name: compute-logits
    kind: function
    summary: "compute_logits: the language model's logits processor over the LM head."
    sources: ["vllm/model_executor/models/qwen2_vl.py:1846-1850"]
    request: ModelsLogitsRequest
    response: ModelsLogitsResult
    errors:
      - {code: attribute-error, status: 0, retryable: false}
    behavior:
      - if: "!state.loaded"
        then:
          - fail: {code: attribute-error, status: 0, message: "model weights are not loaded on this rank"}
      - source: "vllm/model_executor/models/qwen2.py:512-517"
        call: logits-processor.forward
        input: {num_tokens: "= input.num_tokens", hidden_size: "= state.cfg.hidden_size", vocab_size: "= state.cfg.vocab_size", tp: "= config['tensor-parallel-size']"}
        as: lg
      - return: "= vars.lg.value"

  - component: qwen2-model
    name: forward
    kind: function
    summary: "Qwen2Model.forward: inputs_embeds when the caller merged multimodal embeddings, else embed input_ids; the decoder layers; final RMSNorm. Qwen2DecoderLayer has LlamaDecoderLayer's structure (qkv bias aside), so the Llama layer stack models it, with M-RoPE."
    sources: ["vllm/model_executor/models/qwen2.py:402-451", "vllm/model_executor/models/qwen2.py:291-318"]
    request:
      type: object
      required: [num_tokens, cfg, tp, quant]
      properties:
        num_tokens: {type: integer}
        cfg: {type: object}
        tp: {type: integer}
        quant: {type: string}
        inputs_embeds: {type: boolean, default: false}
        attn_metadata: {type: object, default: {}}
    behavior:
      - set: {vars.emb_ms: 0}
      - title: "First PP rank: hidden_states = inputs_embeds, or embed_input_ids(input_ids)"
        source: "vllm/model_executor/models/qwen2.py:409-414"
        if: "!input.inputs_embeds"
        then:
          - call: vocab-parallel-embedding.forward
            input: {num_tokens: "= input.num_tokens", vocab_size: "= input.cfg.vocab_size", hidden_size: "= input.cfg.hidden_size", tp: "= input.tp"}
            as: emb
          - set: {vars.emb_ms: "= vars.emb.value.owner_ms"}
      - set: {vars.t0: "= now_us"}
      - title: "Decoder layer 0 runs in full"
        source: "vllm/model_executor/models/qwen2.py:425-434"
        call: llama-decoder-layer.forward
        input: {num_tokens: "= input.num_tokens", cfg: "= input.cfg", tp: "= input.tp", quant: "= input.quant", layer_repeat: "= input.cfg.num_layers", attn_metadata: "= input.attn_metadata"}
        as: layer
      - title: "Layers 1..n-1 cost what layer 0 cost"
        wait: "= double(input.cfg.num_layers - 1) * double(now_us - vars.t0) / 1000.0"
      - source: "vllm/model_executor/models/qwen2.py:446"
        call: rms-norm.forward-cuda
        input: {num_tokens: "= input.num_tokens", hidden_size: "= input.cfg.hidden_size", residual: true, layer_repeat: 1}
      - return: {owner_ms: "= vars.emb_ms + vars.layer.value.owner_ms * input.cfg.num_layers"}

  - component: qwen2-vision-transformer
    name: init
    kind: function
    summary: "Qwen2VisionTransformer.__init__: patch_size, temporal_patch_size, spatial_merge_size, embed_dim, depth, heads and mlp_ratio from vision_config; the 2-D rotary (head_dim / 2 rotated) for patch positions."
    sources: ["vllm/model_executor/models/qwen2_vl.py:535-603"]
    request: {type: object, required: [vision_config], properties: {vision_config: {type: object}}}
    response: {type: object}
    behavior:
      - set: {vars.v: "= input.vision_config"}
      - source: "vllm/model_executor/models/qwen2_vl.py:543-580"
        return:
          patch_size: "= has(vars.v.patch_size) ? vars.v.patch_size : 14"
          temporal_patch_size: "= has(vars.v.temporal_patch_size) ? vars.v.temporal_patch_size : 2"
          spatial_merge_size: "= has(vars.v.spatial_merge_size) ? vars.v.spatial_merge_size : 2"
          embed_dim: "= has(vars.v.embed_dim) ? vars.v.embed_dim : 1280"
          depth: "= has(vars.v.depth) ? vars.v.depth : 32"
          num_heads: "= has(vars.v.num_heads) ? vars.v.num_heads : 16"
          mlp_ratio: "= has(vars.v.mlp_ratio) ? vars.v.mlp_ratio : 4"
          out_hidden_size: "= has(vars.v.hidden_size) ? vars.v.hidden_size : 3584"

  - component: qwen2-vision-transformer
    name: forward
    kind: function
    summary: "Qwen2VisionTransformer.forward: patch-embed every patch, rotary patch positions, cu_seqlens per frame, depth ViT blocks (attention within each frame), then the merger (2x2 -> 1 token). Roofline latency: max(weight bytes / HBM BW, 2 x params x patches / peak) plus per-frame attention."
    sources: ["vllm/model_executor/models/qwen2_vl.py:717-755", "vllm/model_executor/models/qwen2_vl.py:662-715"]
    request:
      type: object
      required: [grid_thw, vision]
      properties:
        grid_thw: {type: array, items: {type: array, items: {type: integer}}}
        vision: {type: object}
        tp: {type: integer, default: 1}
    response: {type: object, properties: {num_patches: {type: integer}, num_tokens: {type: integer}}}
    behavior:
      - set:
          vars.v: "= input.vision"
          vars.patches: "= sum(input.grid_thw.map(g, g[0] * g[1] * g[2]))"
      - set:
          vars.params: "= double(vars.v.depth) * double(vars.v.embed_dim) * double(vars.v.embed_dim) * (4.0 + 2.0 * double(vars.v.mlp_ratio)) / double(input.tp)"
          vars.attn_flops: "= double(vars.v.depth) * 4.0 * double(vars.v.embed_dim) * double(sum(input.grid_thw.map(g, g[0] * g[1] * g[2] * g[1] * g[2]))) / double(input.tp)"
      - title: "cu_seqlens: one attention sequence per frame (h x w patches), repeated t times"
        source: "vllm/model_executor/models/qwen2_vl.py:681-687"
        wait: "= math.greatest(2.0 * vars.params / (double(config['gpu-hbm-bandwidth-gbps']) * 1000000.0), (2.0 * vars.params * double(vars.patches) + vars.attn_flops) / (double(config['gpu-dense-bf16-tflops']) * 1000000000.0))"
      - title: "The merger emits one token per spatial_merge_size^2 patches"
        source: "vllm/model_executor/models/qwen2_vl.py:476-522"
        return: {num_patches: "= vars.patches", num_tokens: "= vars.patches / (vars.v.spatial_merge_size * vars.v.spatial_merge_size)"}

  - component: qwen2-vl-processing-info
    name: get-supported-mm-limits
    kind: function
    summary: "get_supported_mm_limits: image and video, no fixed per-prompt maximum (None)."
    sources: ["vllm/model_executor/models/qwen2_vl.py:865-866"]
    response: {type: object}
    behavior:
      - return: {image: null, video: null}

  - component: qwen2-vl-processing-info
    name: get-num-image-tokens
    kind: function
    summary: "_get_vision_info for one image: smart_resize(h, w, factor = patch_size x merge_size, min/max pixels from the image processor's size), frames padded to temporal_patch_size, then (grid_t x grid_h x grid_w) // merge^2 tokens."
    sources: ["vllm/model_executor/models/qwen2_vl.py:989-1058", "vllm/model_executor/models/qwen2_vl.py:952-978"]
    request:
      type: object
      required: [image_width, image_height]
      properties:
        image_width: {type: integer, examples: [1300]}
        image_height: {type: integer, examples: [876]}
        num_frames: {type: integer, default: 1}
        patch_size: {type: integer, default: 14}
        spatial_merge_size: {type: integer, default: 2}
        temporal_patch_size: {type: integer, default: 2}
        min_pixels: {type: integer, default: 3136, description: "image processor size.shortest_edge (Qwen2-VL preprocessor_config.json: 56 x 56)"}
        max_pixels: {type: integer, default: 12845056, description: "image processor size.longest_edge (Qwen2-VL preprocessor_config.json)"}
        do_resize: {type: boolean, default: true}
    response:
      type: object
      properties:
        resized_width: {type: integer}
        resized_height: {type: integer}
        grid_thw: {type: array, items: {type: integer}}
        num_tokens: {type: integer}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.f: "= input.patch_size * input.spatial_merge_size"
          vars.h: "= double(input.image_height)"
          vars.w: "= double(input.image_width)"
      - title: "transformers smart_resize refuses an aspect ratio above 200"
        source: "vllm/model_executor/models/qwen2_vl.py:1018-1024"
        if: "input.do_resize && math.greatest(vars.h, vars.w) / math.least(vars.h, vars.w) > 200.0"
        then:
          - fail: {code: value-error, status: 0, message: "= 'absolute aspect ratio must be smaller than 200, got ' + string(math.greatest(vars.h, vars.w) / math.least(vars.h, vars.w))"}
      - title: "smart_resize: round each side to a multiple of factor"
        detail: "Python's round() rounds halves to even; CEL's math.round rounds them away from zero, so a side exactly at k.5 x factor can differ by one factor."
        source: "vllm/model_executor/models/qwen2_vl.py:1017-1024"
        set:
          vars.hb: "= input.do_resize ? int(math.round(vars.h / double(vars.f))) * vars.f : input.image_height"
          vars.wb: "= input.do_resize ? int(math.round(vars.w / double(vars.f))) * vars.f : input.image_width"
      - title: "Above max_pixels: scale down by beta = sqrt(h x w / max_pixels), flooring to the factor"
        when: "input.do_resize && vars.hb * vars.wb > input.max_pixels"
        set:
          vars.beta: "= math.sqrt(vars.h * vars.w / double(input.max_pixels))"
      - when: "input.do_resize && vars.hb * vars.wb > input.max_pixels"
        set:
          vars.hb: "= math.greatest(vars.f, int(math.floor(vars.h / vars.beta / double(vars.f))) * vars.f)"
          vars.wb: "= math.greatest(vars.f, int(math.floor(vars.w / vars.beta / double(vars.f))) * vars.f)"
      - title: "Below min_pixels: scale up by beta = sqrt(min_pixels / (h x w)), ceiling to the factor"
        when: "input.do_resize && vars.hb * vars.wb < input.min_pixels"
        set:
          vars.beta: "= math.sqrt(double(input.min_pixels) / (vars.h * vars.w))"
      - when: "input.do_resize && vars.hb * vars.wb < input.min_pixels"
        set:
          vars.hb: "= int(math.ceil(vars.h * vars.beta / double(vars.f))) * vars.f"
          vars.wb: "= int(math.ceil(vars.w * vars.beta / double(vars.f))) * vars.f"
      - title: "Frames padded to temporal_patch_size; grid = (frames / temporal, h / patch, w / patch)"
        source: "vllm/model_executor/models/qwen2_vl.py:1030-1040"
        set:
          vars.gt: "= math.greatest((input.num_frames + (input.temporal_patch_size - input.num_frames % input.temporal_patch_size) % input.temporal_patch_size) / input.temporal_patch_size, 1)"
          vars.gh: "= vars.hb / input.patch_size"
          vars.gw: "= vars.wb / input.patch_size"
      - return:
          resized_width: "= vars.wb"
          resized_height: "= vars.hb"
          grid_thw: ["= vars.gt", "= vars.gh", "= vars.gw"]
          num_tokens: "= vars.gt * vars.gh * vars.gw / (input.spatial_merge_size * input.spatial_merge_size)"

  # ------------------------------------------------------------------ MoE layout
  - component: fused-moe-parallel-config
    name: make
    kind: function
    summary: "FusedMoEParallelConfig.make: flatten TP across DP and PCP (dp x pcp x tp devices); EP when enable_expert_parallel and that product is above 1, and then every device owns whole experts (ep = flattened tp, MoE tp 1)."
    sources: ["vllm/model_executor/layers/fused_moe/config.py:1096-1105", "vllm/model_executor/layers/fused_moe/config.py:1107-1236"]
    request:
      type: object
      required: [tp_size, dp_size, pcp_size]
      properties:
        tp_size: {type: integer, examples: [2]}
        dp_size: {type: integer, examples: [1]}
        pcp_size: {type: integer, examples: [1]}
        tp_rank: {type: integer, default: 0}
        dp_rank: {type: integer, default: 0}
        pcp_rank: {type: integer, default: 0}
        enable_expert_parallel: {type: boolean, default: false}
        enable_eplb: {type: boolean, default: false}
        all2all_backend: {type: string, default: allgather_reducescatter}
    response: {type: object}
    behavior:
      - title: "use_ep = dp x pcp x tp > 1 and enable_expert_parallel"
        source: "vllm/model_executor/layers/fused_moe/config.py:1189-1192"
        set:
          vars.use_ep: "= input.dp_size * input.pcp_size * input.tp_size > 1 && input.enable_expert_parallel"
      - title: "flatten_tp_across_dp_and_pcp: there are dp x pcp x tp devices, so MoE shards across all of them"
        source: "vllm/model_executor/layers/fused_moe/config.py:1096-1105"
        set:
          vars.ftp: "= input.dp_size * input.pcp_size * input.tp_size"
          vars.frank: "= input.dp_rank * input.pcp_size * input.tp_size + input.pcp_rank * input.tp_size + (input.tp_size == 1 ? 0 : input.tp_rank)"
      - title: "No EP: experts are TP-sharded over every flattened device"
        source: "vllm/model_executor/layers/fused_moe/config.py:1202-1216"
        if: "!vars.use_ep"
        then:
          - return: {tp_size: "= vars.ftp", tp_rank: "= vars.frank", pcp_size: "= input.pcp_size", pcp_rank: "= input.pcp_rank", dp_size: "= input.dp_size", dp_rank: "= input.dp_rank", ep_size: 1, ep_rank: 0, use_ep: false, all2all_backend: "= input.all2all_backend", enable_eplb: "= input.enable_eplb"}
      - title: "EP: ep_size = the flattened tp size, ep_rank = its rank, MoE tp 1"
        source: "vllm/model_executor/layers/fused_moe/config.py:1217-1236"
        return: {tp_size: 1, tp_rank: 0, pcp_size: "= input.pcp_size", pcp_rank: "= input.pcp_rank", dp_size: "= input.dp_size", dp_rank: "= input.dp_rank", ep_size: "= vars.ftp", ep_rank: "= vars.frank", use_ep: true, all2all_backend: "= input.all2all_backend", enable_eplb: "= input.enable_eplb"}

  - component: fused-moe-layer
    name: determine-expert-counts
    kind: function
    summary: "determine_expert_counts: global = experts + redundant, logical = experts, fused shared experts = n_shared_experts when fusing (and set), else 0."
    sources: ["vllm/model_executor/layers/fused_moe/layer.py:72-85"]
    request:
      type: object
      required: [num_experts, num_redundant_experts, fuse_shared_experts]
      properties:
        num_experts: {type: integer, examples: [8]}
        num_redundant_experts: {type: integer, examples: [0]}
        n_shared_experts: {type: [integer, "null"], default: null}
        fuse_shared_experts: {type: boolean}
    response: {type: object, properties: {global_num_experts: {type: integer}, logical_num_experts: {type: integer}, num_fused_shared_experts: {type: integer}}}
    behavior:
      - source: "vllm/model_executor/layers/fused_moe/layer.py:78-85"
        return:
          global_num_experts: "= input.num_experts + input.num_redundant_experts"
          logical_num_experts: "= input.num_experts"
          num_fused_shared_experts: "= input.n_shared_experts != null && input.fuse_shared_experts ? input.n_shared_experts : 0"

  - component: trtllm-mxint4-experts
    name: is-supported-config
    kind: function
    summary: "FusedMoEExperts.is_supported_config for TrtLlmMxint4ExpertsMonolithic, in the base class's order: device (CUDA SM100 family + FlashInfer MxInt4), act_and_mul, activation (SILU, SWIGLUOAI), quant scheme (int4 static group-32 weights, no activation quant), parallel config (no all2all except AG/RS, no EPLB), routing method, float32 router logits only for DeepSeekV3/Simulated, Standard activation format."
    sources: ["vllm/model_executor/layers/fused_moe/modular_kernel.py:546-593", "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:44-115"]
    request:
      type: object
      required: [activation]
      properties:
        device_name: {type: string, default: "NVIDIA B200"}
        device_capability_family: {type: integer, default: 100}
        flashinfer_mxint4_available: {type: boolean, default: true}
        is_act_and_mul: {type: boolean, default: true}
        activation: {type: string, examples: [silu]}
        weight_key: {type: string, default: kInt4Static32}
        activation_key: {type: [string, "null"], default: null}
        use_all2all_kernels: {type: boolean, default: false}
        use_ag_rs_all2all_kernels: {type: boolean, default: false}
        enable_eplb: {type: boolean, default: false}
        routing_method: {type: string, default: Renormalize}
        router_logits_dtype: {type: [string, "null"], default: null}
        activation_format: {type: string, default: standard}
    response: {type: object, properties: {supported: {type: boolean}, reason: {type: [string, "null"]}}}
    behavior:
      - set:
          vars.act_name: "= {'silu': 'SILU', 'gelu': 'GELU', 'gelu_tanh': 'GELU_TANH', 'relu2': 'RELU2', 'swigluoai': 'SWIGLUOAI', 'situ': 'SITU', 'swiglustep': 'SWIGLUSTEP', 'silu_no_mul': 'SILU_NO_MUL', 'gelu_no_mul': 'GELU_NO_MUL', 'relu2_no_mul': 'RELU2_NO_MUL'}"
      - title: "_supports_current_device: CUDA, SM100 family, FlashInfer MxInt4 MoE installed"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:44-55"
        if: "input.device_capability_family != 100 || !input.flashinfer_mxint4_available"
        then:
          - return: {supported: false, reason: "= 'kernel does not support current device ' + input.device_name"}
      - title: "_supports_no_act_and_mul is False"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:57-59"
        if: "!input.is_act_and_mul"
        then:
          - return: {supported: false, reason: "kernel does not support no act_and_mul MLP layer"}
      - title: "_supports_activation: SILU and SWIGLUOAI only"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:68-73"
        if: "!(input.activation in ['silu', 'swigluoai'])"
        then:
          - return: {supported: false, reason: "= 'kernel does not support MoEActivation.' + (input.activation in vars.act_name ? vars.act_name[input.activation] : input.activation.upperAscii()) + ' activation'"}
      - title: "_supports_quant_scheme: (kInt4Static32, None)"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:61-66"
        if: "input.weight_key != 'kInt4Static32' || input.activation_key != null"
        then:
          - return: {supported: false, reason: "= 'kernel does not support quantization scheme ' + input.weight_key + 'x' + (input.activation_key == null ? 'None' : input.activation_key)"}
      - title: "_supports_parallel_config: no all2all kernels (AG/RS allowed) and no EPLB"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:75-82"
        if: "!((!input.use_all2all_kernels || input.use_ag_rs_all2all_kernels) && !input.enable_eplb)"
        then:
          - return: {supported: false, reason: "kernel does not support parallel config"}
      - title: "_supports_routing_method: Renormalize, RenormalizeNaive, DeepSeekV3, Llama4, Simulated"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:84-96"
        if: "!(input.routing_method in ['Renormalize', 'RenormalizeNaive', 'DeepSeekV3', 'Llama4', 'Simulated'])"
        then:
          - return: {supported: false, reason: "= 'kernel does not support routing method RoutingMethodType.' + input.routing_method"}
      - title: "_supports_router_logits_dtype: float32 logits only with DeepSeekV3 or Simulated routing"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:98-110"
        if: "input.router_logits_dtype == 'float32' && !(input.routing_method in ['DeepSeekV3', 'Simulated'])"
        then:
          - return: {supported: false, reason: "kernel does not support router logits dtype torch.float32"}
      - title: "activation_format is Standard"
        source: "vllm/model_executor/layers/fused_moe/experts/trtllm_mxint4_moe.py:112-114"
        if: "input.activation_format != 'standard'"
        then:
          - return: {supported: false, reason: "= 'kernel does not support ' + input.activation_format + ' activation format'"}
      - return: {supported: true, reason: null}

  # ------------------------------------------------------------------ KV-cache quantization
  - component: attention-layer
    name: init-kv-cache-quant
    kind: function
    summary: "_init_kv_cache_quant (Attention.__init__): set_default_quant_scales registers q/k/v/prob scales at 1.0; a quantized checkpoint's KV-cache method (Fp8KVCacheMethod, ModelOpt) refuses fp8_e5m2 and creates the checkpoint scale parameters."
    sources: ["vllm/model_executor/layers/attention/attention.py:157-226", "vllm/model_executor/layers/attention/attention.py:94-98"]
    tags: [writes]
    request:
      type: object
      properties:
        kv_quant_method: {type: string, default: none, description: "the quant config's method for Attention: none, Fp8KVCacheMethod, ModelOptKVCacheMethod or CompressedTensorsKVCacheMethod"}
        has_kv_cache_scheme: {type: boolean, default: true, description: "compressed-tensors only: the checkpoint declares a kv_cache_scheme"}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: "set_default_quant_scales: q/k/v/prob scales start at 1.0 (registered as buffers so weight loading can fill them)"
        source: "vllm/model_executor/layers/attention/attention.py:185"
        set:
          state.kv_scales: {q_scale: 1.0, k_scale: 1.0, v_scale: 1.0, prob_scale: 1.0, source: default}
          state.kv_quant_method: none
      - title: "should_load_quant_weights: no quant method (or the unquantized one) keeps the default scales"
        source: "vllm/model_executor/layers/attention/attention.py:197-200"
        if: "input.kv_quant_method == 'none'"
        then:
          - return: {kv_quant_method: none, scales: "= state.kv_scales"}
      - title: "fp8_e5m2 with a KV-cache quant method (except compressed-tensors with no kv_cache_scheme)"
        source: "vllm/model_executor/layers/attention/attention.py:201-219"
        if: "config['kv-cache-dtype'] == 'fp8_e5m2' && (input.kv_quant_method != 'CompressedTensorsKVCacheMethod' || input.has_kv_cache_scheme)"
        then:
          - fail: {code: value-error, status: 0, message: "fp8_e5m2 kv-cache is not supported with fp8 checkpoints."}
      - title: "quant_method.create_weights: q/k/v/prob scale parameters at the -1.0 sentinel, for the checkpoint to fill"
        source: "vllm/model_executor/layers/attention/attention.py:220-226"
        set:
          state.kv_quant_method: "= input.kv_quant_method"
          state.kv_scales: {q_scale: -1.0, k_scale: -1.0, v_scale: -1.0, prob_scale: -1.0, source: sentinel}
      - return: {kv_quant_method: "= input.kv_quant_method", scales: "= state.kv_scales"}

  - component: base-kv-cache-method
    name: process-weights-after-loading
    kind: function
    summary: "BaseKVCacheMethod.process_weights_after_loading: with a quantized KV cache, use the checkpoint's k/v scales (one missing: the larger for both; both missing: 1.0), q_scale defaults to k_scale with a warning, and scales of exactly 1.0 for fp8_e4m3 warn; prob scale 1.0 when absent. A scale the checkpoint has but the world doesn't give a value for is reported as 'checkpoint'."
    sources: ["vllm/model_executor/layers/quantization/kv_cache.py:77-170"]
    request:
      type: object
      properties:
        kv_cache_dtype: {type: string, examples: [fp8]}
        checkpoint_scales: {type: object, default: {}, description: "the per-tensor k_scale / v_scale / q_scale / prob_scale the checkpoint provides ('checkpoint': provided, value not in the world)"}
    response: {type: object}
    behavior:
      - set:
          vars.cs: "= input.checkpoint_scales"
          vars.quantized: "= input.kv_cache_dtype.startsWith('fp8') || input.kv_cache_dtype.startsWith('int8') || input.kv_cache_dtype.startsWith('nvfp4')"
      - set:
          vars.kp: "= 'k_scale' in vars.cs"
          vars.vp: "= 'v_scale' in vars.cs"
          vars.qp: "= 'q_scale' in vars.cs"
          vars.pp: "= 'prob_scale' in vars.cs"
      - set:
          vars.kval: "= vars.kp ? (type(vars.cs.k_scale) == string ? dyn('checkpoint') : dyn(double(vars.cs.k_scale))) : dyn(1.0)"
          vars.vval: "= vars.vp ? (type(vars.cs.v_scale) == string ? dyn('checkpoint') : dyn(double(vars.cs.v_scale))) : dyn(1.0)"
          vars.warn: []
      - title: "Unquantized KV cache: the scales stay as loaded"
        source: "vllm/model_executor/layers/quantization/kv_cache.py:104"
        if: "!vars.quantized"
        then:
          - return: {k_scale: "= vars.kval", v_scale: "= vars.vval", q_scale: "= vars.qp && type(vars.cs.q_scale) != string ? dyn(double(vars.cs.q_scale)) : dyn(1.0)", prob_scale: 1.0, warnings: [], source: "= vars.kp ? 'checkpoint' : 'default'"}
      - title: "Both k and v scales from the checkpoint; both missing (-1.0 sentinels) -> 1.0; one missing -> the larger for both"
        source: "vllm/model_executor/layers/quantization/kv_cache.py:105-121"
        set:
          vars.kf: "= vars.kp && vars.vp ? vars.kval : (!vars.kp && !vars.vp ? dyn(1.0) : (vars.kp ? vars.kval : vars.vval))"
          vars.vf: "= vars.kp && vars.vp ? vars.vval : (!vars.kp && !vars.vp ? dyn(1.0) : (vars.kp ? vars.kval : vars.vval))"
      - title: "The checkpoint has no q scale: q_scale = k_scale"
        source: "vllm/model_executor/layers/quantization/kv_cache.py:128-136"
        if: "!vars.qp"
        then:
          - set:
              vars.qf: "= vars.kf"
              vars.warn: "= vars.warn + ['Checkpoint does not provide a q scaling factor. Setting it to k_scale. This only matters for FP8 Attention backends (flash-attn or flashinfer).']"
        else:
          - set: {vars.qf: "= type(vars.cs.q_scale) == string ? dyn('checkpoint') : dyn(double(vars.cs.q_scale))"}
      - title: "k and v scales of exactly 1.0 for an fp8_e4m3 cache warn"
        source: "vllm/model_executor/layers/quantization/kv_cache.py:144-149"
        when: "vars.kf == dyn(1.0) && vars.vf == dyn(1.0) && !input.kv_cache_dtype.contains('e5m2')"
        set:
          vars.warn: "= vars.warn + ['Using KV cache scaling factor 1.0 for fp8_e4m3. If this is unintended, verify that k/v_scale scaling factors are properly set in the checkpoint.']"
      - title: "prob_scale is 1.0 unless the checkpoint has one"
        source: "vllm/model_executor/layers/quantization/kv_cache.py:157-162"
        return: {k_scale: "= vars.kf", v_scale: "= vars.vf", q_scale: "= vars.qf", prob_scale: "= vars.pp && type(vars.cs.prob_scale) != string ? dyn(double(vars.cs.prob_scale)) : dyn(1.0)", warnings: "= vars.warn", source: "= vars.kp || vars.vp ? 'checkpoint' : 'default'"}

  # ------------------------------------------------------------------ TurboQuant
  - component: turbo-quant-config
    name: from-cache-dtype
    kind: function
    summary: "TurboQuantConfig.from_cache_dtype: a named preset (key/value bits, norm correction) for the head dim; key packed size (FP8 keys: head_dim; else ceil(head_dim x bits / 8) + 2), value packed size (ceil(head_dim x bits / 8) + 4), and the slot size rounded up to even."
    sources: ["vllm/model_executor/layers/quantization/turboquant/config.py:215-235", "vllm/model_executor/layers/quantization/turboquant/config.py:20-41", "vllm/model_executor/layers/quantization/turboquant/config.py:95-175"]
    request:
      type: object
      required: [cache_dtype]
      properties:
        cache_dtype: {type: string, examples: [turboquant_k8v4]}
        head_dim: {type: integer, default: 128}
    response: {type: object}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: "Unknown preset"
        source: "vllm/model_executor/layers/quantization/turboquant/config.py:221-226"
        if: "!(input.cache_dtype in state.presets)"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Unknown TurboQuant cache dtype: \\'' + input.cache_dtype + '\\'. Valid presets: turboquant_k8v4, turboquant_4bit_nc, turboquant_k3v4_nc, turboquant_3bit_nc'"}
      - set: {vars.p: "= state.presets[input.cache_dtype]", vars.hd: "= input.head_dim"}
      - set:
          vars.key_fp8: "= vars.p.key_quant_bits == 8"
          vars.kpack: "= vars.p.key_quant_bits == 8 ? input.head_dim : (input.head_dim * vars.p.key_quant_bits + 7) / 8 + 2"
          vars.vpack: "= (input.head_dim * vars.p.value_quant_bits + 7) / 8 + 4"
      - set: {vars.slot: "= vars.kpack + vars.vpack"}
      - source: "vllm/model_executor/layers/quantization/turboquant/config.py:229-235"
        return:
          head_dim: "= input.head_dim"
          key_quant_bits: "= vars.p.key_quant_bits"
          value_quant_bits: "= vars.p.value_quant_bits"
          norm_correction: "= vars.p.norm_correction"
          key_fp8: "= vars.key_fp8"
          mse_bits: "= vars.key_fp8 ? vars.p.value_quant_bits : vars.p.key_quant_bits"
          key_mse_bits: "= vars.key_fp8 ? 0 : vars.p.key_quant_bits"
          n_centroids: "= vars.key_fp8 ? (vars.p.value_quant_bits == 4 ? 16 : 8) : (vars.p.key_quant_bits == 4 ? 16 : 8)"
          key_packed_size: "= vars.kpack"
          value_packed_size: "= vars.vpack"
          slot_size: "= vars.slot"
          slot_size_aligned: "= vars.slot + vars.slot % 2"

  # ------------------------------------------------------------------ quantization utils
  - component: quant-config-utils
    name: find-matching-patterns
    kind: function
    summary: "find_matching_patterns: patterns matching the layer itself win ([set]); otherwise, for a fused layer, one set of matching patterns per shard name; an unfused unmatched layer gives [set()]. Matching is is_equal_or_regex_match: 're:' prefixes are re.match regexes, others exact (or fnmatch when opted in)."
    sources: ["vllm/model_executor/layers/quantization/utils/config_utils.py:344-380", "vllm/model_executor/layers/quantization/utils/config_utils.py:392-412"]
    request:
      type: object
      required: [layer_name, patterns]
      properties:
        layer_name: {type: string, examples: [model.layers.0.self_attn.qkv_proj]}
        patterns: {type: array, items: {type: string}}
        fused_mapping: {type: object, default: {}}
        use_fnmatch: {type: boolean, default: false}
    response: {type: object, properties: {matches: {type: array, items: {type: array, items: {type: string}}}}}
    behavior:
      - title: "is_equal_or_regex_match against the layer name (re.match anchors at the start)"
        source: "vllm/model_executor/layers/quantization/utils/config_utils.py:356-362"
        set:
          vars.direct: "= input.patterns.filter(p, p.startsWith('re:') ? input.layer_name.matches('^(?:' + p.substring(3) + ')') : (p == input.layer_name || (input.use_fnmatch && input.layer_name.matches('^' + p.replace('.', '\\\\.').replace('*', '.*').replace('?', '.') + '$'))))"
      - if: "size(vars.direct) > 0"
        then:
          - return: {matches: ["= vars.direct"]}
      - set:
          vars.proj: "= input.layer_name.split('.')[size(input.layer_name.split('.')) - 1]"
      - title: "Not a fused layer and no direct match"
        source: "vllm/model_executor/layers/quantization/utils/config_utils.py:364-366"
        if: "!(vars.proj in input.fused_mapping)"
        then:
          - return: {matches: [[]]}
      - title: "One set of matching patterns per shard (layer_name with the projection replaced)"
        source: "vllm/model_executor/layers/quantization/utils/config_utils.py:368-380"
        return:
          matches: "= input.fused_mapping[vars.proj].map(sh, input.patterns.filter(p, p.startsWith('re:') ? input.layer_name.replace(vars.proj, sh).matches('^(?:' + p.substring(3) + ')') : (p == input.layer_name.replace(vars.proj, sh) || (input.use_fnmatch && input.layer_name.replace(vars.proj, sh).matches('^' + p.replace('.', '\\\\.').replace('*', '.*').replace('?', '.') + '$')))))"

  # ------------------------------------------------------------------ Cohere ASR
  - component: cohere-asr-for-conditional-generation
    name: get-num-audio-tokens
    kind: function
    summary: "get_num_audio_tokens (streaming estimate): hop = int(window_stride x sample_rate); frames = int(duration x sample_rate) // hop; tokens = ceil(frames / subsampling_factor)."
    sources: ["vllm/model_executor/models/cohere_asr.py:2189-2203"]
    request:
      type: object
      required: [audio_duration_s, preprocessor, encoder]
      properties:
        audio_duration_s: {type: number, examples: [10.0]}
        preprocessor: {type: object, description: "hf_config.preprocessor: sample_rate, window_stride (seconds)"}
        encoder: {type: object, description: "hf_config.encoder: subsampling_factor"}
    response: {type: object, properties: {num_tokens: {type: integer}}}
    behavior:
      - set:
          vars.hop: "= int(math.trunc(double(input.preprocessor.window_stride) * double(input.preprocessor.sample_rate)))"
      - set:
          vars.frames: "= int(math.trunc(double(input.audio_duration_s) * double(input.preprocessor.sample_rate))) / vars.hop"
      - source: "vllm/model_executor/models/cohere_asr.py:2201-2203"
        return:
          num_tokens: "= int(math.ceil(double(vars.frames) / double(input.encoder.subsampling_factor)))"

  # ------------------------------------------------------------------ media fetch
  - component: media-connector
    name: fetch-image
    kind: function
    summary: "MediaConnector.fetch_image(_async) -> load_from_url: data: URLs decode base64 (other encodings refused); http(s) URLs check --allowed-media-domains, then download (VLLM_IMAGE_FETCH_TIMEOUT); a 4xx (not 408/429) or bad URL becomes a 422; file: URLs need --allowed-local-media-path; any other scheme is a ValueError."
    sources: ["vllm/multimodal/media/connector.py:494-544", "vllm/multimodal/media/connector.py:367-466", "vllm/multimodal/media/connector.py:314-365", "vllm/multimodal/media/connector.py:58-125"]
    request:
      type: object
      required: [image_url]
      properties:
        image_url: {type: string, examples: ["https://vllm-public-assets.s3.us-west-2.amazonaws.com/vision_model_images/stop_sign.jpg"]}
        allowed_media_domains: {type: array, items: {type: string}, default: []}
        allowed_local_media_path: {type: string, default: ""}
    response: {type: object, properties: {source: {type: string}, bytes: {type: integer}, media_type: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: not-implemented-error, status: 0, retryable: false}
      - {code: runtime-error, status: 0, retryable: false}
      - {code: vllm-unprocessable-entity-error, status: 422, retryable: false}
      - {code: timeout-error, status: 0, retryable: true}
    behavior:
      - set: {vars.url: "= input.image_url"}
      - title: "data: URL (RFC 2397): data:[<mediatype>][;<param>]*[;base64],<data>"
        source: "vllm/multimodal/media/connector.py:376-377"
        if: "vars.url.size() >= 5 && vars.url.substring(0, 5).lowerAscii() == 'data:'"
        then:
          - title: "Missing ',' separator"
            source: "vllm/multimodal/media/connector.py:321-324"
            if: "!vars.url.substring(5).contains(',')"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Invalid data URL \\'' + (vars.url.size() > 32 ? vars.url.substring(0, 32) : vars.url) + '\\': missing \\',\\' separator.'"}
          - set: {vars.spec: "= vars.url.substring(5).split(',')[0]"}
          - title: "Only ;base64 data URLs"
            source: "vllm/multimodal/media/connector.py:326-329"
            if: "!vars.spec.contains(';') || vars.spec.split(';')[size(vars.spec.split(';')) - 1] != 'base64'"
            then:
              - fail: {code: not-implemented-error, status: 0, message: "Only base64 data URLs are supported for now."}
          - return: {source: data, bytes: "= (vars.url.size() - vars.url.indexOf(',') - 1) * 3 / 4", media_type: "= vars.spec.split(';')[0]"}
      - set:
          vars.scheme: "= vars.url.contains('://') ? vars.url.split('://')[0].lowerAscii() : ''"
          vars.host: "= vars.url.contains('://') ? vars.url.split('://')[1].split('/')[0].split(':')[0].lowerAscii() : ''"
      - if: "vars.scheme.startsWith('http')"
        then:
          - title: "_assert_url_in_allowed_media_domains"
            source: "vllm/multimodal/media/connector.py:356-365"
            if: "size(input.allowed_media_domains) > 0 && !(vars.host in input.allowed_media_domains)"
            then:
              - fail: {code: value-error, status: 0, message: "= 'The URL must be from one of the allowed domains: [' + input.allowed_media_domains.map(d, '\\'' + d + '\\'').join(', ') + ']. Input URL domain: ' + vars.host"}
          - title: "connection.get_bytes(url, timeout=VLLM_IMAGE_FETCH_TIMEOUT): the public-assets bucket, or another host"
            source: "vllm/multimodal/media/connector.py:388-399"
            if: "vars.host == 'vllm-public-assets.s3.us-west-2.amazonaws.com'"
            then:
              - call: vllm-public-assets-s3.get-object
                input: {key: "= vars.url.split('://')[1].substring(vars.url.split('://')[1].indexOf('/') + 1)"}
                timeout_ms: "= config['vllm-image-fetch-timeout-s'] * 1000"
                as: obj
                on_error:
                  - title: "_wrap_media_fetch_error: a 4xx other than 408/429 is a 422 naming image_url"
                    source: "vllm/multimodal/media/connector.py:80-89"
                    when: "error.status >= 400 && error.status < 500 && !(error.status in [408, 429])"
                    fail: {code: vllm-unprocessable-entity-error, status: 422, message: "= 'Failed to fetch media from URL: HTTP ' + string(error.status) + ' error'", data: {param: image_url, value: "= vars.url"}}
                  - fail: "= error"
              - return: {source: http, bytes: "= has(vars.obj.value.size) ? vars.obj.value.size : 0", media_type: "= has(vars.obj.value.content_type) ? vars.obj.value.content_type : 'image/jpeg'"}
          - call: remote-media-host.get
            input: {url: "= vars.url"}
            timeout_ms: "= config['vllm-image-fetch-timeout-s'] * 1000"
            as: obj
            on_error:
              - source: "vllm/multimodal/media/connector.py:80-89"
                when: "error.status >= 400 && error.status < 500 && !(error.status in [408, 429])"
                fail: {code: vllm-unprocessable-entity-error, status: 422, message: "= 'Failed to fetch media from URL: HTTP ' + string(error.status) + ' error'", data: {param: image_url, value: "= vars.url"}}
              - fail: "= error"
          - return: {source: http, bytes: "= has(vars.obj.value.size) ? vars.obj.value.size : 0", media_type: "= has(vars.obj.value.content_type) ? vars.obj.value.content_type : 'image/jpeg'"}
      - if: "vars.scheme == 'file'"
        then:
          - title: "_load_file_url needs --allowed-local-media-path"
            source: "vllm/multimodal/media/connector.py:339-343"
            if: "input.allowed_local_media_path == ''"
            then:
              - fail: {code: runtime-error, status: 0, message: "Cannot load local files without `--allowed-local-media-path`."}
          - set: {vars.path: "= vars.url.substring(7)"}
          - source: "vllm/multimodal/media/connector.py:345-352"
            if: "!vars.path.startsWith(input.allowed_local_media_path.endsWith('/') ? input.allowed_local_media_path : input.allowed_local_media_path + '/')"
            then:
              - fail: {code: value-error, status: 0, message: "= 'The file path ' + vars.path + ' must be a subpath of `--allowed-local-media-path ' + input.allowed_local_media_path + '`.'"}
          - call: local-disk.read-file
            input: {path: "= vars.path"}
            as: f
          - return: {source: file, bytes: "= has(vars.f.value.size) ? vars.f.value.size : 0", media_type: image}
      - source: "vllm/multimodal/media/connector.py:407-408"
        fail: {code: value-error, status: 0, message: "The URL must be either a HTTP, data or file URL."}

  - component: remote-media-host
    name: get
    kind: http
    summary: "GET <url> on a media host: rows of `urls` keyed by URL; a missing URL is a 404."
    sources: ["vllm/multimodal/media/connector.py:388-393"]
    request: {type: object, required: [url], properties: {url: {type: string, examples: ["https://example.com/a.jpg"]}}}
    response: {type: object, properties: {size: {type: integer}, content_type: {type: string}}}
    errors: [{code: not_found, status: 404, retryable: false}]
    store: {table: urls, op: get, key: "= input.url", not_found: not_found}

  # ------------------------------------------------------------------ LoRA validation
  - component: lru-cache-lora-model-manager
    name: validate-moe-lora-format
    kind: function
    summary: "_validate_moe_lora_format: skipped when the engine allows mixed MoE LoRA formats (is_moe and enable_mixed_moe_lora_format) and the request declares is_3d_lora_weight; otherwise an adapter whose LoRA for a 2D MoE wrapper (FusedMoEWithLoRA, not FusedMoE3DWithLoRA) is one fused 3D tensor is refused, naming the module."
    sources: ["vllm/lora/model_manager.py:1252-1271", "vllm/lora/model_manager.py:143-147"]
    request:
      type: object
      required: [adapter_id]
      properties:
        adapter_id: {type: integer, examples: [7]}
        is_3d_lora_weight: {type: boolean, default: false}
        lora_modules: {type: object, default: {}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: "self._enable_mixed_moe_lora_format = is_moe and lora_config.enable_mixed_moe_lora_format"
        source: "vllm/lora/model_manager.py:145-147"
        set:
          vars.mixed: "= state.is_moe && config['enable-mixed-moe-lora-format']"
      - title: "Mixed formats allowed and the request declares 3D weights - nothing to check"
        source: "vllm/lora/model_manager.py:1253-1256"
        if: "vars.mixed && input.is_3d_lora_weight"
        then:
          - return: {valid: true}
      - title: "Every 2D MoE wrapper (FusedMoEWithLoRA but not FusedMoE3DWithLoRA) whose adapter LoRA has a tensor lora_a"
        source: "vllm/lora/model_manager.py:1257-1263"
        set:
          vars.bad: "= state.modules.filter(m, state.modules[m] == 'FusedMoEWithLoRA' && m in input.lora_modules && has(input.lora_modules[m].lora_a_is_tensor) && input.lora_modules[m].lora_a_is_tensor)"
      - if: "size(vars.bad) > 0"
        then:
          - source: "vllm/lora/model_manager.py:1264-1271"
            fail: {code: value-error, status: 0, message: "= 'LoRA adapter ' + string(input.adapter_id) + ' contains fused 3D MoE weights for \\'' + vars.bad[0] + '\\', but the model uses a 2D MoE LoRA wrapper. Start the engine with enable_mixed_moe_lora_format=True (--enable-mixed-moe-lora-format) and set is_3d_lora_weight=True on the LoRA request.'"}
      - return: {valid: true}

  - component: lru-cache-lora-model-manager
    name: validate-modules-to-save
    kind: function
    summary: "_validate_modules_to_save: an adapter with modules_to_save needs the model's unique ClassificationHeadWithLoRA; the full module must match the head's name, its weight must be 2-D with 1..max_lora_cls_labels rows and input_size columns, and a bias must have one entry per row."
    sources: ["vllm/lora/model_manager.py:1273-1313"]
    request:
      type: object
      properties:
        modules_to_save: {type: array, items: {type: string}, default: []}
        weights: {type: object, default: {}, description: "the adapter's full-module weights: name -> {weight_shape, bias_shape}"}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/lora/model_manager.py:1274-1275"
        if: "size(input.modules_to_save) == 0"
        then:
          - return: {valid: true}
      - set: {vars.saved: "= input.modules_to_save[0]"}
      - source: "vllm/lora/model_manager.py:1277-1281"
        if: "state.classification_head == null"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Cannot load full module \\'' + vars.saved + '\\': the model does not expose a unique ClassificationHeadWithLoRA.'"}
      - set: {vars.head: "= state.classification_head"}
      - title: "_get_module_to_save_weights: the head's name, or it without the 'model.' prefix (pooling models)"
        source: "vllm/lora/model_manager.py:1236-1250"
        set:
          vars.wname: "= vars.head.module in input.weights ? vars.head.module : (vars.head.module.startsWith('model.') && vars.head.module.substring(6) in input.weights ? vars.head.module.substring(6) : '')"
