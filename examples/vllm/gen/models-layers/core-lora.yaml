# models-layers: LoRA adapter loading and the LoRA linear path; the weight cache daemon.
components:
  - id: lora
    name: vllm/lora package
    kind: module
    parent: model-executor
    layer: lora
    summary: "Multi-LoRA serving: adapter loading on workers, GPU slot management and the Punica LoRA kernels."
    sources: ["vllm/lora/worker_manager.py:27-34"]
  - id: lru-cache-worker-lora-manager
    name: LRUCacheWorkerLoRAManager
    kind: module
    parent: lora
    layer: lora
    summary: "Worker-side adapter manager (the GPU runner's default): loads requested adapters, evicting the least recently used when the CPU cache is full."
    sources: ["vllm/lora/worker_manager.py:245-252"]
  - id: lru-cache-lora-model-manager
    name: LRUCacheLoRAModelManager
    kind: module
    parent: lora
    layer: lora
    summary: "Registered adapters (CPU cache, capacity max_cpu_loras) and active adapters (GPU slots, max_loras), both LRU-ordered."
    sources: ["vllm/lora/model_manager.py:1378-1380", "vllm/lora/model_manager.py:73-120"]
    state:
      initial:
        registered: []
        active: []
        slots: []
  - id: peft-helper
    name: PEFTHelper
    kind: module
    parent: lora
    layer: lora
    summary: "Reads adapter_config.json and validates the adapter against the LoRA config (rank limit, no bias)."
    sources: ["vllm/lora/peft_helper.py:176-202"]
  - id: base-linear-layer-with-lora
    name: BaseLinearLayerWithLoRA
    kind: module
    parent: lora
    layer: lora
    summary: "Wraps a linear layer: base GEMM plus the LoRA delta through the Punica wrapper, optionally on an auxiliary CUDA stream."
    sources: ["vllm/lora/layers/base_linear.py:70-100"]
  - id: punica-wrapper-gpu
    name: PunicaWrapperGPU
    kind: module
    parent: lora
    layer: lora
    summary: "Batches LoRA application across requests: shrink (x @ A) into a buffer, expand (buffer @ B) into the output, per token's adapter."
    sources: ["vllm/lora/punica_wrapper/punica_gpu.py:33-50"]
  - id: lora-shrink-op
    name: lora/ops/triton_ops/lora_shrink_op.py
    kind: module
    parent: lora
    layer: lora
    summary: "The lora_shrink custom op and its Triton kernels."
    sources: ["vllm/lora/ops/triton_ops/lora_shrink_op.py:220-235"]
  - id: lora-expand-op
    name: lora/ops/triton_ops/lora_expand_op.py
    kind: module
    parent: lora
    layer: lora
    summary: "The lora_expand custom op and its Triton kernel."
    sources: ["vllm/lora/ops/triton_ops/lora_expand_op.py:135-150"]
  - id: weight-cache-daemon
    name: WeightCacheDaemon
    kind: service
    parent: model-executor
    layer: models
    summary: "One daemon per GPU (vllm preload) holding post-quantized, TP-sharded weights and serving CUDA IPC handles to restarting engines over a Unix socket."
    sources: ["vllm/model_executor/model_loader/weight_cache/daemon.py:175-241"]
    state:
      initial:
        weights_held: true
        cache_key: {model: meta-llama/Llama-3.1-8B-Instruct, tp_size: 1}
        memory_bytes: 16060522496

interfaces:
  # ---------------------------------------------------------------- adapter management
  - component: lru-cache-worker-lora-manager
    name: add-adapter
    kind: function
    summary: "LRUCacheWorkerLoRAManager.add_adapter: load and validate a new adapter first, evict the oldest if the CPU cache is full, register it; an existing one is only touched. Then activate it."
    sources: ["vllm/lora/worker_manager.py:289-325"]
    tags: [writes]
    request: ModelsLoRARequest
    response: {type: object, properties: {loaded: {type: boolean}}}
    errors:
      - {code: lora-adapter-not-found-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: list_adapters()
        source: "vllm/lora/worker_manager.py:295-296"
        call: lru-cache-lora-model-manager.list-adapters
        as: ls
      - title: New adapter (or load_inplace) - load it before evicting anything
        source: "vllm/lora/worker_manager.py:294-304"
        if: "!(input.lora_int_id in vars.ls.value.registered) || (has(input.load_inplace) && input.load_inplace)"
        then:
          - call: lru-cache-worker-lora-manager.load-adapter
            input: "= input"
          - title: Remove an existing copy (in-place reload)
            source: "vllm/lora/worker_manager.py:306-308"
            call: lru-cache-lora-model-manager.remove-adapter
            input: {adapter_id: "= input.lora_int_id"}
          - title: Evict the oldest when one more would exceed capacity (max_cpu_loras)
            source: "vllm/lora/worker_manager.py:310-314"
            call: lru-cache-lora-model-manager.add-adapter
            input: {adapter_id: "= input.lora_int_id", evict_if_full: true}
            as: added
          - set: {vars.loaded: "= vars.added.value.was_added"}
        else:
          - title: Already loaded - touch it in the LRU caches
            source: "vllm/lora/worker_manager.py:318-323"
            set: {vars.loaded: true}
      - title: activate_adapter moves it into a GPU slot
        source: "vllm/lora/worker_manager.py:324"
        call: lru-cache-lora-model-manager.activate-adapter
        input: {adapter_id: "= input.lora_int_id"}
      - return: {loaded: "= vars.loaded"}

  - component: lru-cache-worker-lora-manager
    name: load-adapter
    kind: function
    summary: "WorkerLoRAManager._load_adapter: resolve the path, read adapter_config.json via PEFTHelper, validate it, load the tensors on CPU; a missing adapter becomes LoRAAdapterNotFoundError."
    sources: ["vllm/lora/worker_manager.py:106-174"]
    request: ModelsLoRARequest
    response: {type: object, properties: {id: {type: integer}, rank: {type: integer}}}
    errors:
      - {code: lora-adapter-not-found-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: PEFTHelper.from_local_dir(lora_path) - read adapter_config.json
        source: "vllm/lora/worker_manager.py:119-123"
        call: peft-helper.from-local-dir
        input: {lora_path: "= input.lora_path"}
        as: peft
        on_error:
          - title: FileNotFoundError -> LoRAAdapterNotFoundError
            source: "vllm/lora/worker_manager.py:162-170"
            when: "error.code == 'file-not-found-error'"
            fail: {code: lora-adapter-not-found-error, status: 0, message: "= 'Loading lora ' + input.lora_name + ' failed: No adapter found for ' + input.lora_path"}
          - fail: "= error"
      - title: validate_legal against the LoRA config
        source: "vllm/lora/worker_manager.py:125-127"
        call: peft-helper.validate-legal
        input: "= vars.peft.value"
      - title: LoRAModel.from_local_checkpoint on CPU, then module-format validation
        source: "vllm/lora/worker_manager.py:139-160"
        return: {id: "= input.lora_int_id", rank: "= vars.peft.value.r"}

  - component: lru-cache-worker-lora-manager
    name: set-active-adapters
    kind: function
    summary: "set_active_adapters -> LRUCacheWorkerLoRAManager._apply_adapters: refuse more distinct adapters than GPU slots, then add (and activate) each."
    sources: ["vllm/lora/worker_manager.py:195-198", "vllm/lora/worker_manager.py:274-287"]
    tags: [writes]
    request:
      type: object
      required: [requests]
      properties:
        requests: {type: array, items: ModelsLoRARequest, maxItems: 4}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - title: More requested LoRAs than GPU slots (max_loras)
        source: "vllm/lora/worker_manager.py:280-285"
        if: "size(input.requests.map(r, r.lora_int_id).distinct()) > config['max-loras']"
        then:
          - fail: {code: runtime-error, status: 0, message: "= 'Number of requested LoRAs (' + string(size(input.requests.map(r, r.lora_int_id).distinct())) + ') is greater than the number of GPU LoRA slots (' + string(config['max-loras']) + ').'"}
      - source: "vllm/lora/worker_manager.py:286-287"
        foreach: "= input.requests"
        as: req
        steps:
          - call: lru-cache-worker-lora-manager.add-adapter
            input: "= vars.req"
      - return: {active: "= size(input.requests)"}

  - component: lru-cache-worker-lora-manager
    name: list-adapters
    kind: function
    summary: "list_adapters: the ids registered in the CPU adapter cache."
    sources: ["vllm/lora/worker_manager.py:241-242"]
    response: {type: object, properties: {registered: {type: array, items: {type: integer}}, active: {type: array, items: {type: integer}}, slots: {type: array}, pinned: {type: array, items: {type: integer}}}}
    behavior:
      - call: lru-cache-lora-model-manager.list-adapters
        as: ls
      - return: "= vars.ls.value"

  - component: lru-cache-lora-model-manager
    name: add-adapter
    kind: function
    summary: "Register an adapter in the CPU cache (evicting the oldest first when the worker asked for it), or touch it when present."
    sources: ["vllm/lora/model_manager.py:1381-1391", "vllm/lora/model_manager.py:1407-1411"]
    tags: [writes]
    request: {type: object, required: [adapter_id], properties: {adapter_id: {type: integer}, evict_if_full: {type: boolean}}}
    response: {type: object, properties: {was_added: {type: boolean}, evicted: {type: integer}}}
    behavior:
      - title: Already registered - touch the LRU order
        source: "vllm/lora/model_manager.py:1387-1390"
        if: "input.adapter_id in state.registered"
        then:
          - set: {state.registered: "= state.registered.filter(i, i != input.adapter_id) + [input.adapter_id]"}
          - return: {was_added: false, evicted: -1}
      - set: {vars.evicted: -1}
      - title: remove_oldest_adapter when len + 1 > capacity (max_cpu_loras)
        source: "vllm/lora/worker_manager.py:312-314"
        detail: "max_cpu_loras None resolves to max_loras in LoRAConfig._validate_lora_config (vllm/config/lora.py:120-121)."
        if: "has(input.evict_if_full) && input.evict_if_full && size(state.registered) + 1 > ('max-cpu-loras' in config && config['max-cpu-loras'] != null ? config['max-cpu-loras'] : config['max-loras'])"
        then:
          - title: remove_oldest skips pinned adapters; all pinned is an error
            source: "vllm/utils/cache.py:200-210"
            if: "state.registered.all(i, has(state.pinned) && i in state.pinned)"
            then:
              - fail: {code: runtime-error, status: 0, message: "All items are pinned, cannot remove oldest from the cache."}
          - set:
              vars.evicted: "= state.registered.filter(i, !(has(state.pinned) && i in state.pinned))[0]"
          - set:
              state.registered: "= state.registered.filter(i, i != vars.evicted)"
          - title: Evicting the CPU copy also deactivates its GPU slot
            source: "vllm/lora/model_manager.py:62-71"
            set:
              state.active: "= state.active.filter(i, i != vars.evicted)"
              state.slots: "= state.slots.map(s, s == vars.evicted ? null : s)"
      - source: "vllm/lora/model_manager.py:412-416"
        set: {state.registered: "= state.registered + [input.adapter_id]"}
      - return: {was_added: true, evicted: "= vars.evicted"}

  - component: lru-cache-lora-model-manager
    name: activate-adapter
    kind: function
    summary: "Activate into a GPU slot: evict the least recently active when all max_loras slots are used, take the first free slot and copy the LoRA weights in."
    sources: ["vllm/lora/model_manager.py:1393-1405", "vllm/lora/model_manager.py:346-404"]
    tags: [writes]
    request: {type: object, required: [adapter_id], properties: {adapter_id: {type: integer}}}
    response: {type: object, properties: {activated: {type: boolean}, slot: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: lora_index_to_id holds one entry per GPU slot (max_loras)
        source: "vllm/lora/model_manager.py:118"
        when: "size(state.slots) == 0"
        set: {state.slots: "= lists.range(config['max-loras']).map(i, null)"}
      - title: Already active - touch it
        source: "vllm/lora/model_manager.py:351-352"
        if: "input.adapter_id in state.active"
        then:
          - set: {state.active: "= state.active.filter(i, i != input.adapter_id) + [input.adapter_id]"}
          - return: {activated: false, slot: "= lists.range(size(state.slots)).filter(i, state.slots[i] == input.adapter_id)[0]"}
      - title: All GPU slots busy - deactivate the least recently used
        source: "vllm/lora/model_manager.py:1397-1402"
        if: "size(state.active) >= config['max-loras']"
        then:
          - title: remove_oldest on the active cache skips pinned adapters; all pinned is an error
            source: "vllm/utils/cache.py:200-210"
            if: "state.active.all(i, has(state.pinned) && i in state.pinned)"
            then:
              - fail: {code: runtime-error, status: 0, message: "All items are pinned, cannot remove oldest from the cache."}
          - set:
              vars.old: "= state.active.filter(i, !(has(state.pinned) && i in state.pinned))[0]"
          - set:
              state.active: "= state.active.filter(i, i != vars.old)"
              state.slots: "= state.slots.map(s, s == vars.old ? null : s)"
      - title: First free slot, else 'No free lora slots'
        source: "vllm/lora/model_manager.py:353-362"
        if: "!state.slots.exists(s, s == null)"
        then:
          - fail: {code: value-error, status: 0, message: "No free lora slots"}
      - set:
          vars.slot: "= lists.range(size(state.slots)).filter(i, state.slots[i] == null)[0]"
      - title: set_lora on every LoRA-wrapped module at the slot index
        source: "vllm/lora/model_manager.py:363-396"
        set:
          state.slots: "= lists.range(size(state.slots)).map(i, i == vars.slot ? input.adapter_id : state.slots[i])"
          state.active: "= state.active + [input.adapter_id]"
      - return: {activated: true, slot: "= vars.slot"}

  - component: lru-cache-lora-model-manager
    name: remove-adapter
    kind: function
    summary: "remove_adapter: deactivate, then drop it from the CPU cache."
    sources: ["vllm/lora/model_manager.py:1364-1369"]
    tags: [writes]
    request: {type: object, required: [adapter_id], properties: {adapter_id: {type: integer}}}
    response: {type: object, properties: {removed: {type: boolean}}}
    behavior:
      - source: "vllm/lora/model_manager.py:1365-1368"
        if: "!(input.adapter_id in state.registered)"
        then:
          - return: {removed: false}
      - set:
          state.registered: "= state.registered.filter(i, i != input.adapter_id)"
          state.active: "= state.active.filter(i, i != input.adapter_id)"
          state.slots: "= state.slots.map(s, s == input.adapter_id ? null : s)"
      - return: {removed: true}

  - component: lru-cache-lora-model-manager
    name: list-adapters
    kind: store
    summary: "list_adapters: the registered adapter ids, oldest first, and the active ones."
    sources: ["vllm/lora/model_manager.py:1371-1373"]
    behavior:
      - return: {registered: "= state.registered", active: "= state.active", slots: "= state.slots", pinned: "= has(state.pinned) ? state.pinned : []"}

  - component: peft-helper
    name: from-local-dir
    kind: function
    summary: "PEFTHelper.from_local_dir: open <lora_path>/adapter_config.json (FileNotFoundError if absent) and parse it."
    sources: ["vllm/lora/peft_helper.py:176-186"]
    request: {type: object, required: [lora_path], properties: {lora_path: {type: string, examples: [/adapters/sql-lora]}}}
    response: {type: object, properties: {r: {type: integer, examples: [8]}, bias: {type: string, examples: [none]}}}
    errors:
      - {code: file-not-found-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/lora/peft_helper.py:181-183"
        call: local-disk.read-file
        input: {path: "= input.lora_path + '/adapter_config.json'"}
        as: cfg
      - title: json.load(f) - the parsed adapter_config.json (the disk entry's `json` field)
        source: "vllm/lora/peft_helper.py:182-186"
        return: "= has(vars.cfg.value.json) ? vars.cfg.value.json : vars.cfg.value"

  - component: peft-helper
    name: validate-legal
    kind: function
    summary: "validate_legal: the adapter's rank (including rank_pattern) must not exceed max_lora_rank, and bias must be none."
    sources: ["vllm/lora/peft_helper.py:188-202"]
    request: {type: object, required: [r], properties: {r: {type: integer, examples: [8]}, bias: {type: string, examples: [none]}, lora_alpha: {type: integer, examples: [16]}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.msgs: "= (input.r > config['max-lora-rank'] ? ['LoRA rank ' + string(input.r) + ' is greater than max_lora_rank ' + string(config['max-lora-rank']) + '.'] : []) + ((has(input.bias) && input.bias != 'none') ? ['Adapter bias is not supported.'] : [])"
      - source: "vllm/lora/peft_helper.py:201-202"
        if: "size(vars.msgs) > 0"
        then:
          - fail: {code: value-error, status: 0, message: "= vars.msgs.join(' ')"}
      - return: {valid: true}

  # ---------------------------------------------------------------- LoRA linear path
  - component: base-linear-layer-with-lora
    name: apply
    kind: function
    summary: "BaseLinearLayerWithLoRA.apply: with VLLM_LORA_ENABLE_DUAL_STREAM the lora_linear_async custom op overlaps base GEMM and LoRA; otherwise base GEMM then the Punica LoRA add."
    sources: ["vllm/lora/layers/base_linear.py:198-212"]
    request: ModelsLoRALinearInput
    response: {type: object, properties: {path: {type: string}}}
    behavior:
      - title: Dual stream - torch.ops.vllm.lora_linear_async
        source: "vllm/lora/layers/base_linear.py:200-204"
        if: "config['vllm-lora-enable-dual-stream']"
        then:
          - call: base-linear-layer-with-lora.lora-linear-async
            input: "= input"
          - return: {path: async}
      - title: _apply_sync - base quant method GEMM
        source: "vllm/lora/layers/base_linear.py:208-212"
        call: unquantized-linear-method.apply
        input: {num_tokens: "= input.num_tokens", in_features: "= input.in_features", out_features: "= input.out_features", bytes_per_weight: 2, layer_repeat: 1, quant: unquantized, tp: 1}
      - title: _apply_lora_to_output - punica_wrapper.add_lora_linear
        source: "vllm/lora/layers/base_linear.py:231-233"
        call: punica-wrapper-gpu.add-lora-linear
        input: "= input"
      - return: {path: sync}

  - component: base-linear-layer-with-lora
    name: lora-linear-async
    kind: kernel
    summary: "torch.ops.vllm.lora_linear_async: run the base GEMM and the LoRA delta in parallel on the main and auxiliary streams."
    sources: ["vllm/lora/layers/base_linear.py:33-67", "vllm/lora/layers/base_linear.py:244-290"]
    request: ModelsLoRALinearInput
    latency_ms: 0
    behavior:
      - title: maybe_execute_in_parallel(base GEMM, LoRA add) on two CUDA streams
        source: "vllm/lora/layers/base_linear.py:283-290"
        branches:
          - - call: unquantized-linear-method.apply
              input: {num_tokens: "= input.num_tokens", in_features: "= input.in_features", out_features: "= input.out_features", bytes_per_weight: 2, layer_repeat: 1, quant: unquantized, tp: 1}
          - - call: punica-wrapper-gpu.add-lora-linear
              input: "= input"
        join: {need: all}
      - return: {path: async}

  - component: punica-wrapper-gpu
    name: add-lora-linear
    kind: function
    summary: "PunicaWrapperGPU.add_lora_linear: y += (x @ A[idx]) @ B[idx] per token: shrink into a float32 buffer, then expand into the output slices."
    sources: ["vllm/lora/punica_wrapper/punica_gpu.py:206-270"]
    request: ModelsLoRALinearInput
    behavior:
      - title: add_shrink -> lora_shrink
        source: "vllm/lora/punica_wrapper/punica_gpu.py:255-261"
        call: lora-shrink-op.lora-shrink
        input: {num_tokens: "= input.num_tokens", hidden_size: "= input.in_features", rank: "= input.rank", num_slices: "= input.num_slices", any_lora: "= input.any_lora"}
      - title: add_expand -> lora_expand
        source: "vllm/lora/punica_wrapper/punica_gpu.py:262-268"
        call: lora-expand-op.lora-expand
        input: {num_tokens: "= input.num_tokens", out_features: "= input.out_features", rank: "= input.rank", any_lora: "= input.any_lora"}

  - component: lora-shrink-op
    name: lora-shrink
    kind: kernel
    summary: "torch.ops.vllm.lora_shrink: return early when no token uses LoRA, else launch _lora_shrink_kernel over (M, N, slices x LoRAs), with a split-K reduce in batch-invariant mode."
    sources: ["vllm/lora/ops/triton_ops/lora_shrink_op.py:409-414", "vllm/lora/ops/triton_ops/lora_shrink_op.py:220-260"]
    request: {type: object, required: [num_tokens, hidden_size, rank], properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, rank: {type: integer}, num_slices: {type: integer}, any_lora: {type: boolean}}}
    latency_ms: "= input.any_lora ? double(input.num_tokens) * double(input.hidden_size) * 2.0 / (double(config['gpu-hbm-bandwidth-gbps']) * 1000000.0) : 0.0"
    behavior:
      - title: no_lora_flag - none of the tokens use LoRA
        source: "vllm/lora/ops/triton_ops/lora_shrink_op.py:276-278"
        if: "!input.any_lora"
        then:
          - return: {launched: false}
      - title: "Triton kernel _lora_shrink_kernel"
        source: "vllm/lora/ops/triton_ops/lora_shrink_op.py:101-216"
      - title: "Triton device function do_shrink_kernel"
        source: "vllm/lora/ops/triton_ops/kernel_utils.py:236-356"
      - title: "Triton device function mm_k (the K loop)"
        source: "vllm/lora/ops/triton_ops/kernel_utils.py:8-107"
      - title: "Split-K partials are reduced by _lora_shrink_reduce_kernel"
        source: "vllm/lora/ops/triton_ops/lora_shrink_op.py:26-98"
      - source: "vllm/lora/ops/triton_ops/lora_shrink_op.py:353"
        return: {launched: true}

  - component: lora-expand-op
    name: lora-expand
    kind: kernel
    summary: "torch.ops.vllm.lora_expand: return early when no token uses LoRA, else launch _lora_expand_kernel adding buffer @ B into the output slices."
    sources: ["vllm/lora/ops/triton_ops/lora_expand_op.py:283-288", "vllm/lora/ops/triton_ops/lora_expand_op.py:135-180"]
    request: {type: object, required: [num_tokens, out_features, rank], properties: {num_tokens: {type: integer}, out_features: {type: integer}, rank: {type: integer}, any_lora: {type: boolean}}}
