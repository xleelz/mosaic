  # ---------------------------------------------------------------- weight cache daemon
  - component: weight-cache-daemon
    name: serve-forever
    kind: rpc
    summary: "WeightCacheDaemon.serve_forever: accept one Unix-socket connection per pass, verify the peer is the same user, handle it; errors are reported to the client and never stop the loop."
    sources: ["vllm/model_executor/model_loader/weight_cache/daemon.py:332-386"]
    request: ModelsWeightCacheMessage
    response: ModelsWeightCacheReply
    behavior:
      - title: conn, _ = server.accept(); verify_peer_is_owner(conn)
        source: "vllm/model_executor/model_loader/weight_cache/daemon.py:366-371"
        if: "has(input.peer_is_owner) && !input.peer_is_owner"
        then:
          - title: Exception handling a client - send an error and keep serving
            source: "vllm/model_executor/model_loader/weight_cache/daemon.py:374-381"
            return: {status: error, message: "peer is not the daemon owner"}
      - source: "vllm/model_executor/model_loader/weight_cache/daemon.py:372"
        call: weight-cache-daemon.handle-connection
        input: "= input"
        as: reply
      - set: {ctx.daemon_last_status: "= vars.reply.value.status"}
      - return: "= vars.reply.value"

  - component: weight-cache-daemon
    name: handle-connection
    kind: rpc
    summary: "_handle_connection: dispatch get_state, get_memory and release; anything else is answered with an error message."
    sources: ["vllm/model_executor/model_loader/weight_cache/daemon.py:414-430"]
    request: ModelsWeightCacheMessage
    response: ModelsWeightCacheReply
    behavior:
      - source: "vllm/model_executor/model_loader/weight_cache/daemon.py:417-418"
        if: "input.cmd == 'get_state'"
        then:
          - call: weight-cache-daemon.handle-get-state
            input: "= input"
            as: st
          - return: "= vars.st.value"
      - title: get_memory - bytes allocated on this GPU
        source: "vllm/model_executor/model_loader/weight_cache/daemon.py:419-426"
        if: "input.cmd == 'get_memory'"
        then:
          - return: {status: ok, memory_bytes: "= state.weights_held ? state.memory_bytes : 0"}
      - source: "vllm/model_executor/model_loader/weight_cache/daemon.py:427-428"
        if: "input.cmd == 'release'"
        then:
          - call: weight-cache-daemon.handle-release
            as: rel
          - return: "= vars.rel.value"
      - source: "vllm/model_executor/model_loader/weight_cache/daemon.py:429-430"
        return: {status: error, message: "= 'Unknown command ' + input.cmd"}

  - component: weight-cache-daemon
    name: handle-get-state
    kind: rpc
    summary: "_handle_get_state: require a cache key, refuse a mismatching fingerprint, report released weights, else export IPC handles for every tensor."
    sources: ["vllm/model_executor/model_loader/weight_cache/daemon.py:432-463"]
    request: ModelsWeightCacheMessage
    response: ModelsWeightCacheReply
    behavior:
      - source: "vllm/model_executor/model_loader/weight_cache/daemon.py:434-436"
        if: "!has(input.cache_config) || input.cache_config == null"
        then:
          - return: {status: error, message: Missing cache_config}
      - title: WeightCacheKey.mismatched_fields
        source: "vllm/model_executor/model_loader/weight_cache/daemon.py:437-441"
        if: "input.cache_config.model != state.cache_key.model || input.cache_config.tp_size != state.cache_key.tp_size"
        then:
          - return: {status: mismatch, fields: "= input.cache_config.model != state.cache_key.model ? ['model'] : ['tp_size']"}
      - source: "vllm/model_executor/model_loader/weight_cache/daemon.py:442-444"
        if: "!state.weights_held"
        then:
          - return: {status: error, message: Weights were released}
      - title: export_entries(model) - CUDA IPC handles for every parameter and buffer
        source: "vllm/model_executor/model_loader/weight_cache/daemon.py:445-456"
        return: {status: ok, memory_bytes: "= state.memory_bytes"}

  - component: weight-cache-daemon
    name: handle-release
    kind: rpc
    summary: "_handle_release: drop the cached model and empty the CUDA cache (copy-mode engines release the daemon after cloning)."
    sources: ["vllm/model_executor/model_loader/weight_cache/daemon.py:465-473"]
    tags: [writes]
    response: ModelsWeightCacheReply
    behavior:
      - source: "vllm/model_executor/model_loader/weight_cache/daemon.py:466-467"
        set: {state.weights_held: false}
      - return: {status: ok}
