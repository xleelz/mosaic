  - component: base-processing-info
    name: get-hf-processor
    kind: function
    summary: "BaseProcessingInfo.get_hf_processor(**kwargs): delegate to the context; model subclasses pass their processor class."
    sources: ["vllm/multimodal/processing/context.py:468-472"]
    request:
      type: object
      required: [ctx]
      properties:
        ctx: {type: object}
        typ: {type: [array, "null"], items: {type: string}, default: null}
        kwargs: {type: object, default: {}}
    response: {type: object, properties: {processor_cls: {type: string}, kwargs: {type: object}}}
    errors:
      - {code: type-error, status: 0, retryable: false}
