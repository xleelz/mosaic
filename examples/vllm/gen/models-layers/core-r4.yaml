  # ------------------------------------------------------------- prompt updates
  - component: base-multi-modal-processor
    name: apply-prompt-updates
    kind: function
    summary: "_apply_prompt_updates: apply each item's first matching update on the token ids; if any item's target is not found (it tokenizes differently inside the prompt, e.g. 'foo' in 'food'), redo all updates on the decoded text, re-encode, and locate the placeholders in the new ids."
    sources: ["vllm/multimodal/processing/processor.py:1699-1735", "vllm/multimodal/processing/processor.py:1618-1680", "vllm/multimodal/processing/processor.py:1589-1616"]
    request:
      type: object
      required: [token_ids, mm_prompt_updates]
      properties:
        token_ids: {type: array, items: {type: integer}}
        mm_prompt_updates: {type: object, description: "modality -> per item, a list of {mode: replace|insert, target: [ids] | start | end, content: [ids]}"}
        tokenizer_vocab: {type: object, default: {}, description: "stand-in for info.get_tokenizer(): token id -> text; encode is greedy longest match over these pieces"}
    response: {type: object, properties: {token_ids: {type: array}, placeholders: {type: object}, via: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.out: "= input.token_ids", vars.pos: 0, vars.ph: {}, vars.unmatched: 0}
      - title: "_apply_token_matches_with_placeholders: each item takes its first update whose target occurs at or after the previous match"
        source: "vllm/multimodal/processing/processor.py:851-900"
        foreach: "= input.mm_prompt_updates"
        as: items
        index: modality
        steps:
          - foreach: "= vars.items"
            as: cands
            steps:
              - set: {vars.done: false}
              - foreach: "= vars.cands"
                as: u
                steps:
                  - set:
                      vars.tl: "= type(vars.u.target) == string ? 0 : size(vars.u.target)"
                  - set:
                      vars.hits: "= type(vars.u.target) == string ? (vars.u.target == 'start' ? [0] : [size(vars.out)]) : lists.range(size(vars.out) + 1).filter(j, j >= vars.pos && j + vars.tl <= size(vars.out) && vars.tl > 0 && vars.out.slice(j, j + vars.tl) == vars.u.target)"
                  - if: "size(vars.hits) > 0"
                    then:
                      - set:
                          vars.at: "= vars.u.mode == 'replace' ? vars.hits[0] : vars.hits[0] + vars.tl"
                          vars.cut: "= vars.hits[0] + vars.tl"
                      - set:
                          vars.out: "= vars.out.slice(0, vars.at) + vars.u.content + vars.out.slice(vars.cut, size(vars.out))"
                          vars.ph: "= merge(vars.ph, {vars.modality: (vars.modality in vars.ph ? vars.ph[vars.modality] : []) + [{'offset': vars.at, 'tokens': vars.u.content}]})"
                          vars.pos: "= vars.at + size(vars.u.content)"
                          vars.done: true
                      - break: true
              - if: "!vars.done"
                then:
                  - set: {vars.unmatched: "= vars.unmatched + 1"}
      - title: Every item matched in token space - done
        source: "vllm/multimodal/processing/processor.py:1712-1721"
        if: "vars.unmatched == 0"
        then:
          - return: {token_ids: "= vars.out", placeholders: "= vars.ph", via: tokens}
      - title: "_apply_prompt_updates_via_text: decode the prompt, find each target's decoded text, splice the decoded content"
        source: "vllm/multimodal/processing/processor.py:1635-1662"
        set:
          vars.text: "= input.token_ids.map(t, string(t) in input.tokenizer_vocab ? input.tokenizer_vocab[string(t)] : '').join('')"
          vars.segs: []
          vars.prev: 0
          vars.matched: []
      - foreach: "= input.mm_prompt_updates"
        as: items
        index: modality
        steps:
          - foreach: "= vars.items"
            as: cands
            steps:
              - foreach: "= vars.cands"
                as: u
                steps:
                  - set:
                      vars.tt: "= type(vars.u.target) == string ? '' : vars.u.target.map(t, string(t) in input.tokenizer_vocab ? input.tokenizer_vocab[string(t)] : '').join('')"
                  - set:
                      vars.idx: "= type(vars.u.target) == string ? (vars.u.target == 'start' ? 0 : size(vars.text)) : (vars.tt == '' ? -1 : vars.text.indexOf(vars.tt, vars.prev))"
                  - if: "vars.idx >= 0"
                    then:
                      - set:
                          vars.ins: "= vars.u.mode == 'replace' ? vars.idx : vars.idx + size(vars.tt)"
                          vars.end: "= vars.idx + size(vars.tt)"
                      - set:
                          vars.segs: "= vars.segs + [vars.text.substring(vars.prev, vars.ins), vars.u.content.map(t, string(t) in input.tokenizer_vocab ? input.tokenizer_vocab[string(t)] : '').join('')]"
                          vars.prev: "= vars.end"
                          vars.matched: "= vars.matched + [{'modality': vars.modality, 'tokens': vars.u.content}]"
                      - break: true
      - title: Encode the joined text (tokenizer.encode, add_special_tokens=False)
        source: "vllm/multimodal/processing/processor.py:1673-1678"
        set:
          vars.s: "= (vars.segs + [vars.text.substring(vars.prev, size(vars.text))]).join('')"
          vars.inv: "= input.tokenizer_vocab.transformMapEntry(k, v, {v: int(k)})"
          vars.ids: []
          vars.next: 0
      - foreach: "= lists.range(size(vars.s))"
        as: p
        max: 1000
        steps:
          - if: "vars.p < vars.next"
            then: [{continue: true}]
          - set:
              vars.ls: "= [4, 3, 2, 1].filter(l, vars.p + l <= size(vars.s) && vars.s.substring(vars.p, vars.p + l) in vars.inv)"
          - if: "size(vars.ls) == 0"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Cannot encode ' + vars.s.substring(vars.p, vars.p + 1)"}
          - set:
              vars.ids: "= vars.ids + [vars.inv[vars.s.substring(vars.p, vars.p + vars.ls[0])]]"
              vars.next: "= vars.p + vars.ls[0]"
      - title: "_find_mm_placeholders: locate each matched update's content in the new token ids"
        source: "vllm/multimodal/processing/processor.py:1729-1735"
        set: {vars.ph2: {}, vars.from: 0}
      - foreach: "= vars.matched"
        as: m
        steps:
          - set:
              vars.loc: "= lists.range(size(vars.ids) + 1).filter(j, j >= vars.from && j + size(vars.m.tokens) <= size(vars.ids) && vars.ids.slice(j, j + size(vars.m.tokens)) == vars.m.tokens)"
          - if: "size(vars.loc) > 0"
            then:
              - set:
                  vars.ph2: "= merge(vars.ph2, {vars.m.modality: (vars.m.modality in vars.ph2 ? vars.ph2[vars.m.modality] : []) + [{'offset': vars.loc[0], 'tokens': vars.m.tokens}]})"
                  vars.from: "= vars.loc[0] + size(vars.m.tokens)"
      - return: {token_ids: "= vars.ids", placeholders: "= vars.ph2", via: text}

  # ------------------------------------------------------------- placeholder ranges
  - component: placeholder-range
    name: get-num-embeds
    kind: function
    summary: "PlaceholderRange.get_num_embeds: the length, or the count of is_embed positions."
    sources: ["vllm/multimodal/inputs.py:149-158"]
    request:
      type: object
      required: [offset, length]
      properties: {offset: {type: integer}, length: {type: integer}, is_embed: {type: [array, "null"], items: {type: boolean}, default: null}}
    response: {type: object, properties: {num_embeds: {type: integer}}}
    behavior:
      - source: "vllm/multimodal/inputs.py:155-156"
        if: "input.is_embed == null"
        then:
          - return: {num_embeds: "= input.length"}
      - title: embeds_cumsum[-1], or 0 for an empty mask
        source: "vllm/multimodal/inputs.py:158"
        return: {num_embeds: "= size(input.is_embed.filter(b, b))"}

  - component: placeholder-range
    name: get-embeds-indices-in-range
    kind: function
    summary: "PlaceholderRange.get_embeds_indices_in_range: map a [start, end) window of placeholder positions to the encoder-output rows it covers."
    sources: ["vllm/multimodal/inputs.py:160-178"]
    request:
      type: object
      required: [offset, length, start_idx, end_idx]
      properties: {offset: {type: integer}, length: {type: integer}, start_idx: {type: integer}, end_idx: {type: integer}, is_embed: {type: [array, "null"], items: {type: boolean}, default: null}}
    response: {type: object, properties: {start: {type: integer}, end: {type: integer}}}
    behavior:
      - source: "vllm/multimodal/inputs.py:173-174"
        if: "input.is_embed == null"
        then:
          - return: {start: "= input.start_idx", end: "= input.end_idx"}
      - set:
          vars.cs: "= lists.range(size(input.is_embed)).map(i, size(input.is_embed.slice(0, i + 1).filter(b, b)))"
      - source: "vllm/multimodal/inputs.py:176-178"
        return:
          start: "= input.start_idx > 0 ? vars.cs[input.start_idx - 1] : 0"
          end: "= input.end_idx > 0 ? vars.cs[input.end_idx - 1] : 0"

  - component: placeholder-range
    name: extract-embeds-range
    kind: function
    summary: "PlaceholderRange.extract_embeds_range: the inclusive [start, end] prompt positions of each run of embedded tokens (the whole range without a mask)."
    sources: ["vllm/multimodal/inputs.py:180-205"]
    request:
      type: object
      required: [offset, length]
      properties: {offset: {type: integer}, length: {type: integer}, is_embed: {type: [array, "null"], items: {type: boolean}, default: null}}
    response: {type: object, properties: {ranges: {type: array}}}
    behavior:
      - source: "vllm/multimodal/inputs.py:194-195"
        if: "input.is_embed == null"
        then:
          - return: {ranges: "= [[input.offset, input.offset + input.length - 1]]"}
      - set:
          vars.n: "= size(input.is_embed)"
      - title: run starts where the mask rises, ends where it falls
        source: "vllm/multimodal/inputs.py:197-205"
        set:
          vars.starts: "= lists.range(vars.n).filter(i, input.is_embed[i] && (i == 0 || !input.is_embed[i - 1]))"
          vars.ends: "= lists.range(vars.n).filter(i, input.is_embed[i] && (i == vars.n - 1 || !input.is_embed[i + 1]))"
      - return: {ranges: "= lists.range(size(vars.starts)).map(k, [vars.starts[k] + input.offset, vars.ends[k] + input.offset])"}

  # ------------------------------------------------------------- video loading
  - component: video-loader-registry
    name: get-backend-for-video-processor
    kind: function
    summary: "get_video_loader_backend_for_processor: the loader backend registered for an HF video processor class name, or None."
    sources: ["vllm/multimodal/video.py:77-84", "vllm/multimodal/video.py:94-97"]
    request: {type: object, properties: {video_processor: {type: [string, "null"], examples: [Qwen2VLVideoProcessor]}}}
    response: {type: object, properties: {backend: {type: [string, "null"]}}}
    behavior:
      - source: "vllm/multimodal/video.py:81-82"
        if: "!has(input.video_processor) || input.video_processor == null"
        then:
          - return: {backend: null}
      - source: "vllm/multimodal/video.py:84"
        return: {backend: "= input.video_processor in state.processor2backend ? state.processor2backend[input.video_processor] : null"}

  - component: video-loader-registry
    name: load
    kind: function
    summary: "VIDEO_LOADER_REGISTRY.load(name) (ExtensionManager.load): instantiate the registered backend class; an unknown name fails the assertion."
    sources: ["vllm/utils/registry.py:37-41"]
    request: {type: object, required: [name], properties: {name: {type: string, examples: [opencv]}}}
    response: {type: object, properties: {name: {type: string}, loader_cls: {type: string}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/utils/registry.py:39-40"
        if: "!(input.name in state.name2class)"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'Extension class ' + input.name + ' not found'"}
      - return: {name: "= input.name", loader_cls: "= state.name2class[input.name]"}

  - component: video-loader-registry
    name: register
    kind: function
    summary: "VideoLoaderRegistry.register(name, video_processor=..., requires_gpu=...): register a loader class, the processor names it serves and whether it needs a GPU; a processor name that is not a string (or tuple of strings) is a TypeError."
    sources: ["vllm/multimodal/video.py:42-75"]
    tags: [writes]
    request:
      type: object
      required: [name, loader_cls]
      properties:
        name: {type: string, examples: [my_custom_video_loader]}
        loader_cls: {type: string, examples: [MyVideoBackend]}
        video_processor: {default: null, description: "a class name, a list of class names, or null"}
        requires_gpu: {type: boolean, default: false}
    errors:
      - {code: type-error, status: 0, retryable: false}
    behavior:
      - title: _normalize_registered_video_processors
        source: "vllm/multimodal/video.py:46-57"
        set:
          vars.procs: "= input.video_processor == null ? [] : (type(input.video_processor) == string ? [input.video_processor] : (type(input.video_processor) == list && input.video_processor.all(p, type(p) == string) ? input.video_processor : null))"
      - if: "vars.procs == null"
        then:
          - fail: {code: type-error, status: 0, message: "video_processor must be a class name or a tuple of class names"}
      - source: "vllm/multimodal/video.py:68-73"
        set:
          state.name2class: "= merge(state.name2class, {input.name: input.loader_cls})"
          state.requires_gpu: "= merge(state.requires_gpu, {input.name: input.requires_gpu})"
          state.processor2backend: "= merge(state.processor2backend, vars.procs.transformMapEntry(i, p, {p: input.name}))"
      - return: {registered: "= input.name", video_processors: "= vars.procs"}

  - component: video-media-io
    name: merge-kwargs
    kind: function
    summary: "VideoMediaIO.merge_kwargs: drop startup-only request keys (hw_decoders, pool_size, device), strip a request GPU backend (video_backend/backend) that was not configured at startup, shallow-merge over the defaults, then drop the default fps when the request sets only num_frames (and vice versa) and options the new backend does not accept."
    sources: ["vllm/multimodal/media/video.py:41-90", "vllm/multimodal/media/base.py:65-79", "vllm/multimodal/video_decoders/__init__.py:45-52"]
    request:
      type: object
      properties:
        default_kwargs: {type: [object, "null"], default: null}
        runtime_kwargs: {type: [object, "null"], default: null}
    response: {type: object}
    behavior:
      - set:
          vars.d: "= input.default_kwargs == null ? {} : input.default_kwargs"
          vars.has_rt: "= input.runtime_kwargs != null && size(input.runtime_kwargs) > 0"
          vars.rt: "= input.runtime_kwargs == null ? {} : input.runtime_kwargs"
      - if: "vars.has_rt"
        then:
          - title: Decoder pool sizing and the decode device are reserved at startup
            source: "vllm/multimodal/media/video.py:49-54"
            set:
              vars.rt: "= vars.rt.transformMap(k, v, !(k in ['hw_decoders', 'pool_size', 'device']), v)"
          - title: A request-level GPU backend not configured (and VRAM-reserved) at startup is stripped
            source: "vllm/multimodal/media/video.py:58-71"
            foreach: [video_backend, backend]
            as: key
            steps:
              - call: video-loader-registry.backend-requires-gpu
                input: {name: "= vars.key in vars.rt && vars.rt[vars.key] != null ? string(vars.rt[vars.key]) : ''"}
                as: gpu
              - if: "vars.key in vars.rt && vars.rt[vars.key] != null && vars.rt[vars.key] != '' && vars.gpu.value.requires_gpu && (!(vars.key in vars.d) || vars.d[vars.key] != vars.rt[vars.key])"
                then:
                  - set: {vars.rt: "= vars.rt.transformMap(k, v, k != vars.key, v)"}
      - title: MediaIO.merge_kwargs - shallow merge, request wins
        source: "vllm/multimodal/media/base.py:76-79"
        set: {vars.m: "= merge(vars.d, vars.rt)"}
      - if: "vars.has_rt"
        then:
          - title: fps and num_frames interact - a request setting one drops the other default
            source: "vllm/multimodal/media/video.py:77-81"
            set:
              vars.m: "= ('num_frames' in vars.rt && !('fps' in vars.rt)) ? vars.m.transformMap(k, v, k != 'fps', v) : (('fps' in vars.rt && !('num_frames' in vars.rt)) ? vars.m.transformMap(k, v, k != 'num_frames', v) : vars.m)"
          - title: Switching backend drops options only the startup backend accepts (incompatible_backend_options)
            source: "vllm/multimodal/media/video.py:83-89"
            if: "'backend' in vars.rt && vars.rt.backend != null && vars.rt.backend != '' && (!('backend' in vars.d) || vars.d.backend != vars.rt.backend)"
            then:
              - set:
                  vars.opts: "= {'opencv': [], 'torchcodec': ['num_ffmpeg_threads', 'seek_mode', 'device'], 'pynvvideocodec': ['hw_decoders'], 'deepstream': ['pool_size', 'timeout_sec']}"
              - set:
                  vars.drop: "= ('backend' in vars.d && string(vars.d.backend) in vars.opts ? vars.opts[string(vars.d.backend)] : []).filter(o, !(string(vars.rt.backend) in vars.opts && o in vars.opts[string(vars.rt.backend)]))"
              - set: {vars.m: "= vars.m.transformMap(k, v, !(k in vars.drop), v)"}
      - return: "= vars.m"

  - component: video-loader-registry
    name: backend-requires-gpu
    kind: function
    summary: "backend_requires_gpu: whether a backend name was registered as needing a GPU (unknown names do not)."
    sources: ["vllm/multimodal/video.py:90-91"]
    request: {type: object, required: [name], properties: {name: {type: string}}}
    response: {type: object, properties: {requires_gpu: {type: boolean}}}
    behavior:
      - if: "input.name in state.requires_gpu"
        then:
          - return: {requires_gpu: "= state.requires_gpu[input.name]"}
      - return: {requires_gpu: false}

  - component: video-media-io
    name: init
    kind: function
    summary: "VideoMediaIO.__init__: num_frames from the merged kwargs (32 by default); the loader backend is the kwargs' video_backend or VLLM_VIDEO_LOADER_BACKEND (opencv), loaded from the registry."
    sources: ["vllm/multimodal/media/video.py:92-117"]
    request: {type: object, properties: {kwargs: {type: object, default: {}}}}
    response: {type: object, properties: {num_frames: {type: integer}, loader_cls: {type: string}, kwargs: {type: object}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.backend: "= 'video_backend' in input.kwargs && input.kwargs.video_backend != null && input.kwargs.video_backend != '' ? string(input.kwargs.video_backend) : config['vllm-video-loader-backend']"
      - source: "vllm/multimodal/media/video.py:117"
        call: video-loader-registry.load
        input: {name: "= vars.backend"}
        as: loader
      - return:
          num_frames: "= 'num_frames' in input.kwargs ? input.kwargs.num_frames : config['media-io-video-num-frames']"
          loader_cls: "= vars.loader.value.loader_cls"
          kwargs: "= input.kwargs.transformMap(k, v, k != 'video_backend' && k != 'num_frames', v)"

  - component: media-connector
    name: merge-media-io-kwargs
    kind: function
    summary: "merge_media_io_kwargs: merge --media-io-kwargs (defaults) and a request's media_io_kwargs per modality with that modality's MediaIO.merge_kwargs (VideoMediaIO for video); None when both are empty."
    sources: ["vllm/multimodal/media/connector.py:129-148"]
    request:
      type: object
      properties:
        defaults: {type: [object, "null"], default: null, description: "null reads --media-io-kwargs"}
        overrides: {type: [object, "null"], default: null}
    response: {type: [object, "null"]}
    behavior:
      - set:
          vars.d: "= input.defaults != null ? input.defaults : config['media-io-kwargs']"
          vars.o: "= input.overrides == null ? {} : input.overrides"
      - source: "vllm/multimodal/media/connector.py:139-140"
        if: "size(vars.d) == 0 && size(vars.o) == 0"
        then:
          - return: null
      - set: {vars.merged: {}}
      - foreach: "= merge(vars.d, vars.o)"
        index: key
        as: ignored
        steps:
          - title: VideoMediaIO.merge_kwargs for video; other modalities merge shallowly
            source: "vllm/multimodal/media/connector.py:142-147"
            if: "vars.key == 'video'"
            then:
              - call: video-media-io.merge-kwargs
                input: {default_kwargs: "= 'video' in vars.d ? vars.d.video : null", runtime_kwargs: "= 'video' in vars.o ? vars.o.video : null"}
                as: v
              - set: {vars.merged: "= merge(vars.merged, {'video': vars.v.value})"}
            else:
              - set: {vars.merged: "= merge(vars.merged, {vars.key: merge(vars.key in vars.d && vars.d[vars.key] != null ? vars.d[vars.key] : {}, vars.key in vars.o && vars.o[vars.key] != null ? vars.o[vars.key] : {})})"}
      - return: "= vars.merged"

  # ------------------------------------------------------------- audio
  - component: audio
    name: normalize-audio
    kind: function
    summary: "normalize_audio: passthrough without a target; 1-D audio is mono; 2-D audio is (channels, time), transposed when it looks like (time, channels); reduce to mono by mean, first, max or sum; never expand channels."
    sources: ["vllm/multimodal/audio.py:100-174"]
    request:
      type: object
      required: [audio]
      properties:
        audio: {type: array, description: "1-D samples or a 2-D list of lists"}
        target_channels: {type: integer, default: 1}
        passthrough: {type: boolean, default: false, description: "AudioSpec(target_channels=None), i.e. PASSTHROUGH_AUDIO_SPEC"}
        channel_reduction: {type: string, default: mean, enum: [mean, first, max, sum]}
    response: {type: object, properties: {audio: {type: array}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.tc: "= input.target_channels"}
      - title: AudioSpec(target_channels=None) is passthrough
        source: "vllm/multimodal/audio.py:126-127"
        if: "input.passthrough"
        then:
          - return: {audio: "= input.audio"}
      - set:
          vars.ndim: "= size(input.audio) == 0 ? 1 : (type(input.audio[0]) == list ? (size(input.audio[0]) > 0 && type(input.audio[0][0]) == list ? 3 : 2) : 1)"
      - title: 1-D audio is already mono
        source: "vllm/multimodal/audio.py:130-133"
        if: "vars.ndim == 1"
        then:
          - if: "vars.tc == 1"
            then:
              - return: {audio: "= input.audio"}
          - fail: {code: value-error, status: 0, message: "= 'Cannot expand mono audio to ' + string(vars.tc) + ' channels'"}
      - source: "vllm/multimodal/audio.py:136-137"
        if: "vars.ndim != 2"
        then:
          - fail: {code: value-error, status: 0, message: "Unsupported audio shape. Expected 1D or 2D."}
      - title: shape[0] > shape[1] means (time, channels) - transpose
        source: "vllm/multimodal/audio.py:141-143"
        set:
          vars.a: "= size(input.audio) > size(input.audio[0]) ? lists.range(size(input.audio[0])).map(c, input.audio.map(row, row[c])) : input.audio"
      - set: {vars.ch: "= size(vars.a)"}
      - source: "vllm/multimodal/audio.py:147-149"
        if: "vars.ch == vars.tc"
        then:
          - return: {audio: "= vars.ch == 1 ? vars.a[0] : vars.a"}
      - source: "vllm/multimodal/audio.py:152-155"
        if: "vars.ch < vars.tc"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Cannot expand ' + string(vars.ch) + ' channels to ' + string(vars.tc)"}
      - if: "vars.tc == 1"
        then:
          - title: Reduce to mono by the spec's ChannelReduction
            source: "vllm/multimodal/audio.py:160-170"
            return:
              audio: "= lists.range(size(vars.a[0])).map(t, input.channel_reduction == 'first' ? double(vars.a[0][t]) : (input.channel_reduction == 'max' ? math.greatest(vars.a.map(r, double(r[t]))) : (input.channel_reduction == 'sum' ? sum(vars.a.map(r, double(r[t]))) : sum(vars.a.map(r, double(r[t]))) / double(vars.ch))))"
      - title: Reduce to N channels - keep the first N
        source: "vllm/multimodal/audio.py:171-174"
        return: {audio: "= vars.a.slice(0, vars.tc)"}

  # ------------------------------------------------------------- LoRA request
  - component: lora-request
    name: init
    kind: function
    summary: "LoRARequest(...).__post_init__: lora_int_id must be > 0 and lora_path non-empty; adapter_id, name and path alias the fields."
    sources: ["vllm/lora/request.py:37-54", "vllm/lora/request.py:24-29"]
    request:
      type: object
      required: [lora_name, lora_int_id]
      properties:
        lora_name: {type: string, examples: [sql-lora]}
        lora_int_id: {type: integer, examples: [1]}
        lora_path: {type: string, default: ""}
        base_model_name: {type: [string, "null"], default: null}
        load_inplace: {type: boolean, default: false}
    response: {type: object, properties: {adapter_id: {type: integer}, name: {type: string}, path: {type: string}, load_inplace: {type: boolean}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/lora/request.py:38-39"
        if: "input.lora_int_id < 1"
        then:
          - fail: {code: value-error, status: 0, message: "= 'id must be > 0, got ' + string(input.lora_int_id)"}
      - source: "vllm/lora/request.py:42"
        if: "input.lora_path == ''"
        then:
          - fail: {code: assertion-error, status: 0, message: "lora_path cannot be empty"}
      - title: adapter_id / name / path properties
        source: "vllm/lora/request.py:44-54"
        return: {adapter_id: "= input.lora_int_id", name: "= input.lora_name", path: "= input.lora_path", load_inplace: "= input.load_inplace"}

  - component: lora-request
    name: equals
    kind: function
    summary: "LoRARequest.__eq__/__hash__: two requests are the same adapter when their names match (ids and paths are ignored)."
    sources: ["vllm/lora/request.py:56-69"]
    request: {type: object, required: [a, b], properties: {a: {type: object}, b: {type: object}}}
    response: {type: object, properties: {equal: {type: boolean}}}
    behavior:
      - source: "vllm/lora/request.py:61"
        if: "input.a.lora_name == input.b.lora_name"
        then:
          - return: {equal: true}
      - return: {equal: false}

  # ------------------------------------------------------------- MoE enums
  - component: moe-activation
    name: from-str
    kind: function
    summary: "MoEActivation.from_str: resolve the alias (gelu_pytorch_tanh -> gelu_tanh), then the member with that value; unknown names raise ValueError listing the valid ones. Also returns is_gated, custom_op_name and without_mul."
    sources: ["vllm/model_executor/layers/fused_moe/activation.py:67-75", "vllm/model_executor/layers/fused_moe/activation.py:46-66", "vllm/model_executor/layers/fused_moe/activation.py:78-106"]
    request: {type: object, required: [s], properties: {s: {type: string, examples: [silu]}}}
    response: {type: object, properties: {value: {type: string}, is_gated: {type: boolean}, custom_op_name: {type: string}, without_mul: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.valid: ["silu", "gelu", "gelu_tanh", "relu2", "swigluoai", "situ", "swigluoai_uninterleave", "swiglustep", "silu_no_mul", "gelu_no_mul", "gelu_tanh_no_mul", "relu2_no_mul"]
          vars.s: "= input.s == 'gelu_pytorch_tanh' ? 'gelu_tanh' : input.s"
      - source: "vllm/model_executor/layers/fused_moe/activation.py:73-75"
        if: "!(vars.s in vars.valid)"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Unknown MoE activation: ' + vars.s + '. Valid activations: ' + vars.valid.join(', ')"}
      - title: is_gated, _CUSTOM_OP_NAMES and _WITHOUT_MUL
        source: "vllm/model_executor/layers/fused_moe/activation.py:83-106"
        return:
          value: "= vars.s"
          is_gated: "= !vars.s.endsWith('_no_mul')"
          custom_op_name: "= {'silu': 'silu_and_mul', 'gelu': 'gelu_and_mul', 'gelu_tanh': 'gelu_tanh_and_mul', 'situ': 'situ_and_mul', 'swigluoai': 'swigluoai_and_mul', 'swigluoai_uninterleave': 'silu_and_mul_with_clamp', 'swiglustep': 'swiglustep_and_mul', 'relu2': 'relu2', 'silu_no_mul': 'silu_and_mul', 'gelu_no_mul': 'gelu_and_mul', 'gelu_tanh_no_mul': 'gelu_tanh_and_mul', 'relu2_no_mul': 'relu2'}[vars.s]"
          without_mul: "= vars.s in ['silu', 'gelu', 'gelu_tanh', 'relu2'] ? vars.s + '_no_mul' : vars.s"

  - component: fused-moe-config
    name: get-routing-method-type
    kind: function
    summary: "get_routing_method_type: pick the RoutingMethodType (the FlashInfer routing enum) from the scoring function, renormalize, expert groups and a correction bias."
    sources: ["vllm/model_executor/layers/fused_moe/config.py:135-171", "vllm/model_executor/layers/fused_moe/config.py:105-132"]
    request:
      type: object
      required: [scoring_func, top_k, renormalize]
      properties:
        scoring_func: {type: string, examples: [softmax]}
        top_k: {type: integer, examples: [2]}
        renormalize: {type: boolean}
        num_expert_group: {type: [integer, "null"], default: null}
        has_e_score_bias: {type: boolean, default: false}
    response: {type: object, properties: {name: {type: string}, value: {type: integer}}}
    behavior:
      - set:
          vars.v: {Default: 0, Renormalize: 1, DeepSeekV3: 2, Llama4: 3, RenormalizeNaive: 4, TopK: 5, SigmoidRenorm: 6, MiniMax2: 7, Sigmoid: 8, Unspecified: 9, DeepseekV4: 100, Custom: 101, Simulated: 102}
      - title: sqrtsoftplus (DeepSeek V4)
        source: "vllm/model_executor/layers/fused_moe/config.py:142-148"
        if: "input.scoring_func == 'sqrtsoftplus'"
        then:
          - return: {name: "= input.renormalize ? 'DeepseekV4' : 'Unspecified'", value: "= input.renormalize ? 100 : 9"}
      - title: With a score-correction bias only sigmoid + renormalize has a kernel routing
        source: "vllm/model_executor/layers/fused_moe/config.py:150-158"
        if: "input.has_e_score_bias"
        then:
          - set:
              vars.n: "= input.scoring_func != 'sigmoid' || !input.renormalize ? 'Unspecified' : ((input.num_expert_group == null ? 0 : input.num_expert_group) > 0 ? 'DeepSeekV3' : 'MiniMax2')"
          - return: {name: "= vars.n", value: "= vars.v[vars.n]"}
      - source: "vllm/model_executor/layers/fused_moe/config.py:160-169"
        set:
          vars.n: "= input.scoring_func == 'sigmoid' ? (input.renormalize ? 'SigmoidRenorm' : 'Sigmoid') : (input.scoring_func == 'softmax' ? (input.renormalize ? 'RenormalizeNaive' : 'Default') : 'Unspecified')"
      - return: {name: "= vars.n", value: "= vars.v[vars.n]"}

  # ------------------------------------------------------------- weights mapper
  - component: weights-mapper
    name: map-name
    kind: function
    summary: "WeightsMapper._map_name_with_shard: apply the substring rules (first occurrence), the stacked rules (which also set a shard id), then prefix and suffix rules; any rule mapping to None drops the weight."
    sources: ["vllm/model_executor/models/utils.py:86-150"]
    request:
      type: object
      required: [key]
      properties:
        key: {type: string, examples: [model.layers.0.self_attn.q_proj.weight]}
        substr: {type: array, default: [], description: "ordered [orig, new|null] pairs (orig_to_new_substr)"}
        stacked: {type: array, default: [], description: "ordered [orig, new, shard_id] (orig_to_new_stacked)"}
        prefix: {type: array, default: []}
        suffix: {type: array, default: []}
    response: {type: object, properties: {name: {type: [string, "null"]}, shard_id: {}}}
    behavior:
      - set: {vars.key: "= input.key", vars.shard: null}
      - source: "vllm/model_executor/models/utils.py:117-123"
        foreach: "= input.substr"
        as: r
        steps:
          - if: "vars.key.contains(vars.r[0])"
            then:
              - if: "vars.r[1] == null"
                then:
                  - return: {name: null, shard_id: null}
              - set: {vars.key: "= vars.key.replace(vars.r[0], vars.r[1], 1)"}
      - source: "vllm/model_executor/models/utils.py:125-129"
        foreach: "= input.stacked"
        as: r
        steps:
          - if: "vars.key.contains(vars.r[0])"
            then:
              - set: {vars.key: "= vars.key.replace(vars.r[0], vars.r[1], 1)", vars.shard: "= vars.r[2]"}
      - source: "vllm/model_executor/models/utils.py:131-136"
        foreach: "= input.prefix"
        as: r
        steps:
          - if: "vars.key.startsWith(vars.r[0])"
            then:
              - if: "vars.r[1] == null"
                then:
                  - return: {name: null, shard_id: null}
              - set: {vars.key: "= vars.key.replace(vars.r[0], vars.r[1], 1)"}
      - source: "vllm/model_executor/models/utils.py:138-143"
        foreach: "= input.suffix"
        as: r
        steps:
          - if: "vars.key.endsWith(vars.r[0])"
            then:
              - if: "vars.r[1] == null"
                then:
                  - return: {name: null, shard_id: null}
              - set: {vars.key: "= vars.key.substring(0, size(vars.key) - size(vars.r[0])) + vars.r[1]"}
      - return: {name: "= vars.key", shard_id: "= vars.shard"}

  - component: weights-mapper
    name: apply
    kind: function
    summary: "WeightsMapper.apply: map every checkpoint weight name, drop the ones mapped to None, and yield a stacked weight once per shard id."
    sources: ["vllm/model_executor/models/utils.py:152-169"]
    request:
      type: object
      required: [names]
      properties:
        names: {type: array, items: {type: string}}
        substr: {type: array, default: []}
        stacked: {type: array, default: []}
        prefix: {type: array, default: []}
        suffix: {type: array, default: []}
    response: {type: object, properties: {weights: {type: array}}}
    behavior:
      - set: {vars.out: []}
      - foreach: "= input.names"
        as: n
        steps:
          - call: weights-mapper.map-name
            input: {key: "= vars.n", substr: "= input.substr", stacked: "= input.stacked", prefix: "= input.prefix", suffix: "= input.suffix"}
            as: m
          - title: Dropped weight
            source: "vllm/model_executor/models/utils.py:156-157"
            if: "vars.m.value.name == null"
            then: [{continue: true}]
          - title: One entry per shard id (a list loads into each shard in turn)
            source: "vllm/model_executor/models/utils.py:159-169"
            set:
              vars.out: "= vars.out + (vars.m.value.shard_id == null ? [{'name': vars.m.value.name, 'shard_id': null}] : (type(vars.m.value.shard_id) == list ? vars.m.value.shard_id.map(s, {'name': vars.m.value.name, 'shard_id': s}) : [{'name': vars.m.value.name, 'shard_id': vars.m.value.shard_id}]))"
      - return: {weights: "= vars.out"}

  # ------------------------------------------------------------- linear weight loaders
  - component: column-parallel-linear
    name: weight-loader
    kind: function
    summary: "ColumnParallelLinear.weight_loader: an unsharded checkpoint tensor is narrowed to this rank's rows (tp_rank * shard rows) along the output dim; the shapes must then match."
    sources: ["vllm/model_executor/layers/linear.py:576-593"]
    request:
      type: object
      required: [param_shape, loaded_shape, tp_rank]
      properties:
        param_shape: {type: array, items: {type: integer}, examples: [[1024, 4096]]}
        loaded_shape: {type: array, items: {type: integer}, examples: [[4096, 4096]]}
        tp_rank: {type: integer, examples: [0]}
        output_dim: {type: [integer, "null"], default: 0}
        is_sharded_weight: {type: boolean, default: false}
    response: {type: object, properties: {start_idx: {type: integer}, shard_size: {type: integer}, loaded_shape: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.ls: "= size(input.loaded_shape) == 0 ? [1] : input.loaded_shape", vars.start: 0, vars.size: 0}
      - source: "vllm/model_executor/layers/linear.py:582-585"
        if: "input.output_dim != null && !input.is_sharded_weight && size(input.loaded_shape) > 0"
        then:
          - set:
              vars.size: "= input.param_shape[input.output_dim]"
              vars.start: "= input.tp_rank * input.param_shape[input.output_dim]"
          - set:
              vars.ls: "= lists.range(size(input.loaded_shape)).map(d, d == input.output_dim ? (vars.start + vars.size <= input.loaded_shape[d] ? vars.size : math.greatest(0, input.loaded_shape[d] - vars.start)) : input.loaded_shape[d])"
      - source: "vllm/model_executor/layers/linear.py:592"
        if: "vars.ls != input.param_shape"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'param shape [' + input.param_shape.map(x, string(x)).join(', ') + '] != loaded shape [' + vars.ls.map(x, string(x)).join(', ') + ']'"}
      - return: {start_idx: "= vars.start", shard_size: "= vars.size", loaded_shape: "= vars.ls"}

  - component: row-parallel-linear
    name: weight-loader
    kind: function
    summary: "RowParallelLinear.weight_loader: narrow the checkpoint tensor to this rank's columns along the input dim; the shapes must then match."
    sources: ["vllm/model_executor/layers/linear.py:1735-1751"]
    request:
      type: object
      required: [param_shape, loaded_shape, tp_rank]
      properties:
        param_shape: {type: array, items: {type: integer}, examples: [[4096, 1024]]}
        loaded_shape: {type: array, items: {type: integer}, examples: [[4096, 4096]]}
        tp_rank: {type: integer, examples: [0]}
        input_dim: {type: [integer, "null"], default: 1}
        is_sharded_weight: {type: boolean, default: false}
    response: {type: object, properties: {start_idx: {type: integer}, shard_size: {type: integer}, loaded_shape: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.ls: "= size(input.loaded_shape) == 0 ? [1] : input.loaded_shape", vars.start: 0, vars.size: 0}
      - source: "vllm/model_executor/layers/linear.py:1740-1743"
        if: "input.input_dim != null && !input.is_sharded_weight && size(input.loaded_shape) > 0"
        then:
          - set:
              vars.size: "= input.param_shape[input.input_dim]"
              vars.start: "= input.tp_rank * input.param_shape[input.input_dim]"
          - set:
              vars.ls: "= lists.range(size(input.loaded_shape)).map(d, d == input.input_dim ? (vars.start + vars.size <= input.loaded_shape[d] ? vars.size : math.greatest(0, input.loaded_shape[d] - vars.start)) : input.loaded_shape[d])"
      - source: "vllm/model_executor/layers/linear.py:1750"
        if: "vars.ls != input.param_shape"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'param shape [' + input.param_shape.map(x, string(x)).join(', ') + '] != loaded shape [' + vars.ls.map(x, string(x)).join(', ') + ']'"}
      - return: {start_idx: "= vars.start", shard_size: "= vars.size", loaded_shape: "= vars.ls"}

  - component: replicated-linear
    name: weight-loader
    kind: function
    summary: "ReplicatedLinear.weight_loader: a 0-d scale becomes shape [1]; the checkpoint tensor must match the parameter exactly."
    sources: ["vllm/model_executor/layers/linear.py:401-409"]
    request:
      type: object
      required: [param_shape, loaded_shape]
      properties:
        param_shape: {type: array, items: {type: integer}}
        loaded_shape: {type: array, items: {type: integer}}
    response: {type: object, properties: {loaded_shape: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.ls: "= size(input.loaded_shape) == 0 ? [1] : input.loaded_shape"}
      - source: "vllm/model_executor/layers/linear.py:405-408"
        if: "vars.ls != input.param_shape"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'Tried to load weights of size [' + vars.ls.map(x, string(x)).join(', ') + ']to a parameter of size [' + input.param_shape.map(x, string(x)).join(', ') + ']'"}
      - return: {loaded_shape: "= vars.ls"}

  - component: merged-column-parallel-linear
    name: validate-shard-id
    kind: function
    summary: "MergedColumnParallelLinear.validate_shard_id: an int in range, None, or a tuple of consecutive in-range indices."
    sources: ["vllm/model_executor/layers/linear.py:732-757"]
    request:
      type: object
      required: [output_sizes]
      properties:
        output_sizes: {type: array, items: {type: integer}, examples: [[14336, 14336]]}
        shard_id: {default: null}
    response: {type: object, properties: {valid: {type: boolean}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.n: "= size(input.output_sizes)"}
      - source: "vllm/model_executor/layers/linear.py:733-739"
        if: "type(input.shard_id) == int"
        then:
          - if: "input.shard_id < 0 || input.shard_id >= vars.n"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Shard id should be between 0 and ' + string(vars.n - 1) + '. Got shard id ' + string(input.shard_id) + '.'"}
          - return: {valid: true}
      - source: "vllm/model_executor/layers/linear.py:740-741"
        if: "input.shard_id == null"
        then:
          - return: {valid: true}
      - source: "vllm/model_executor/layers/linear.py:742-756"
        if: "type(input.shard_id) == list"
        then:
          - if: "input.shard_id.exists(i, i < 0 || i >= vars.n)"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Shard id index ' + string(input.shard_id.filter(i, i < 0 || i >= vars.n)[0]) + ' should be between 0 and ' + string(vars.n - 1) + '. Got shard id (' + input.shard_id.map(x, string(x)).join(', ') + ').'"}
          - if: "size(input.shard_id) > 1 && lists.range(size(input.shard_id) - 1).exists(k, input.shard_id[k + 1] - input.shard_id[k] != 1)"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Shard id with multiple indices should be consecutive. Got shard id (' + input.shard_id.map(x, string(x)).join(', ') + ').'"}
          - return: {valid: true}
      - source: "vllm/model_executor/layers/linear.py:757"
        fail: {code: value-error, status: 0, message: "This line should not be reached"}

  - component: merged-column-parallel-linear
    name: weight-loader
    kind: function
    summary: "MergedColumnParallelLinear.weight_loader: an int shard id loads output_sizes[id] / tp rows at offset sum(output_sizes[:id]) / tp from the rank's slice of the checkpoint tensor; None or a tuple splits a fused checkpoint tensor and loads each logical shard in turn."
    sources: ["vllm/model_executor/layers/linear.py:759-867"]
    request:
      type: object
      required: [output_sizes, tp_size, tp_rank]
      properties:
        output_sizes: {type: array, items: {type: integer}, examples: [[14336, 14336]]}
        tp_size: {type: integer, examples: [1]}
        tp_rank: {type: integer, examples: [0]}
        shard_id: {default: null}
        output_dim: {type: [integer, "null"], default: 0}
    response: {type: object, properties: {shards: {type: array}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/model_executor/layers/linear.py:765"
        call: merged-column-parallel-linear.validate-shard-id
        input: {output_sizes: "= input.output_sizes", shard_id: "= input.shard_id"}
      - title: Fused checkpoint tensor (None or a tuple) - split along output_dim and load each shard
        source: "vllm/model_executor/layers/linear.py:771-822"
        if: "input.shard_id == null || type(input.shard_id) == list"
        then:
          - if: "input.output_dim == null"
            then:
              - return: {shards: [{shard_id: null, param_offset: 0, shard_size: -1, start_idx: 0}]}
          - set:
              vars.ids: "= input.shard_id == null ? lists.range(size(input.output_sizes)) : lists.range(input.shard_id[size(input.shard_id) - 1] - input.shard_id[0] + 1)"
          - return:
              shards: "= vars.ids.map(i, {'shard_id': i, 'param_offset': sum(input.output_sizes.slice(0, i)) / input.tp_size, 'shard_size': input.output_sizes[i] / input.tp_size, 'start_idx': input.tp_rank * (input.output_sizes[i] / input.tp_size)})"
      - title: One logical shard - offset and size divided by TP, narrowed at tp_rank * shard_size
        source: "vllm/model_executor/layers/linear.py:824-849"
        return:
          shards: "= [{'shard_id': input.shard_id, 'param_offset': sum(input.output_sizes.slice(0, input.shard_id)) / input.tp_size, 'shard_size': input.output_sizes[input.shard_id] / input.tp_size, 'start_idx': input.tp_rank * (input.output_sizes[input.shard_id] / input.tp_size)}]"

  - component: merged-column-parallel-linear
    name: load-weights
    kind: function
    summary: "MergedColumnParallelLinear.load_weights: for each (name, tensor) validate the tensor's shard_id, skip a missing bias, and hand it to the parameter's weight_loader; yields the loaded names."
    sources: ["vllm/model_executor/layers/linear.py:972-995"]
    request:
      type: object
      required: [weights, output_sizes, tp_size, tp_rank]
      properties:
        weights: {type: array, items: {type: object, description: "{name, shard_id}"}}
        output_sizes: {type: array, items: {type: integer}}
        tp_size: {type: integer}
        tp_rank: {type: integer}
        has_bias: {type: boolean, default: false}
    response: {type: object, properties: {loaded: {type: array}, shards: {type: array}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.loaded: [], vars.shards: []}
      - foreach: "= input.weights"
        as: w
        steps:
          - source: "vllm/model_executor/layers/linear.py:977"
            call: merged-column-parallel-linear.validate-shard-id
            input: {output_sizes: "= input.output_sizes", shard_id: "= has(vars.w.shard_id) ? vars.w.shard_id : null"}
          - title: param is None and the name is bias - skip
            source: "vllm/model_executor/layers/linear.py:985-986"
            if: "vars.w.name == 'bias' && !input.has_bias"
            then: [{continue: true}]
          - source: "vllm/model_executor/layers/linear.py:987"
            call: merged-column-parallel-linear.weight-loader
            input: {output_sizes: "= input.output_sizes", tp_size: "= input.tp_size", tp_rank: "= input.tp_rank", shard_id: "= has(vars.w.shard_id) ? vars.w.shard_id : null"}
            as: wl
          - set: {vars.loaded: "= vars.loaded + [vars.w.name]", vars.shards: "= vars.shards + vars.wl.value.shards"}
      - return: {loaded: "= vars.loaded", shards: "= vars.shards"}

  - component: qkv-parallel-linear
    name: load-weights
    kind: function
    summary: "QKVParallelLinear.load_weights: validate each tensor's shard id ('q', 'k', 'v' or None), skip a missing bias, and load it through weight_loader; yields the loaded names."
    sources: ["vllm/model_executor/layers/linear.py:1326-1349", "vllm/model_executor/layers/linear.py:1080-1086"]
    request:
      type: object
      required: [weights, num_heads, num_kv_heads, head_dim, tp_size]
      properties:
        weights: {type: array, items: {type: object, description: "{name, shard_id}"}}
        num_heads: {type: integer, examples: [32]}
        num_kv_heads: {type: integer, examples: [8]}
        head_dim: {type: integer, examples: [128]}
        tp_size: {type: integer, examples: [1]}
        tp_rank: {type: integer, default: 0}
        has_bias: {type: boolean, default: false}
    response: {type: object, properties: {loaded: {type: array}, shards: {type: array}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.loaded: [], vars.shards: []}
      - foreach: "= input.weights"
        as: w
        steps:
          - title: validate_shard_id
            source: "vllm/model_executor/layers/linear.py:1080-1086"
            if: "has(vars.w.shard_id) && vars.w.shard_id != null && !(vars.w.shard_id in ['q', 'k', 'v'])"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Shard id for QKVParallelLinear should be \\'q\\', \\'k\\', or \\'v\\', got shard id ' + string(vars.w.shard_id) + '.'"}
          - source: "vllm/model_executor/layers/linear.py:1339-1340"
            if: "vars.w.name == 'bias' && !input.has_bias"
            then: [{continue: true}]
          - if: "has(vars.w.shard_id) && vars.w.shard_id != null"
            then:
              - source: "vllm/model_executor/layers/linear.py:1341"
                call: qkv-parallel-linear.weight-loader
                input: {num_heads: "= input.num_heads", num_kv_heads: "= input.num_kv_heads", head_dim: "= input.head_dim", tp_size: "= input.tp_size", tp_rank: "= input.tp_rank", shard_id: "= vars.w.shard_id"}
                as: wl
              - set: {vars.shards: "= vars.shards + [merge(vars.wl.value, {'shard_id': vars.w.shard_id})]"}
          - set: {vars.loaded: "= vars.loaded + [vars.w.name]"}
      - return: {loaded: "= vars.loaded", shards: "= vars.shards"}

  # ------------------------------------------------------------- pooler activations
  - component: pooler-activation
    name: get-act-fn
    kind: function
    summary: "get_act_fn: regression -> identity, single-label -> classify(num_labels), multi-label -> sigmoid; else a sentence-transformers activation (only torch.nn.modules.*), else classify."
    sources: ["vllm/model_executor/layers/pooler/activations.py:19-60", "vllm/model_executor/layers/pooler/activations.py:80-87"]
    request:
      type: object
      properties:
        problem_type: {type: string, default: ""}
        num_labels: {type: [integer, "null"], default: 0}
        activation_fn: {type: [string, "null"], default: null, description: "sentence_transformers.activation_fn or sbert_ce_default_activation_function"}
        static_num_labels: {type: boolean, default: true}
    response: {type: object, properties: {kind: {type: string}, num_labels: {type: [integer, "null"]}, fn: {type: [string, "null"]}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.nl: "= input.static_num_labels ? input.num_labels : null"}
      - source: "vllm/model_executor/layers/pooler/activations.py:31-36"
        if: "input.problem_type in ['regression', 'single_label_classification', 'multi_label_classification']"
        then:
          - return:
              kind: "= {'regression': 'identity', 'single_label_classification': 'classify', 'multi_label_classification': 'multi_label'}[input.problem_type]"
              num_labels: "= input.problem_type == 'single_label_classification' ? vars.nl : null"
              fn: null
      - if: "input.activation_fn != null"
        then:
          - title: Only torch.nn.modules activations may be loaded
            source: "vllm/model_executor/layers/pooler/activations.py:51-56"
            if: "!input.activation_fn.startsWith('torch.nn.modules.')"
            then:
              - fail: {code: value-error, status: 0, message: "Loading of activation functions is restricted to torch.nn.modules for security reasons"}
          - title: PoolerActivation.wraps - Identity, Sigmoid/Softmax or a lambda around the module
            source: "vllm/model_executor/layers/pooler/activations.py:80-87"
            set: {vars.cls: "= input.activation_fn.split('.')[size(input.activation_fn.split('.')) - 1]"}
          - return:
              kind: "= vars.cls == 'Identity' ? 'identity' : (vars.cls in ['Sigmoid', 'Softmax'] ? 'classify' : 'lambda')"
              num_labels: null
              fn: "= vars.cls in ['Identity', 'Sigmoid', 'Softmax'] ? null : vars.cls"
      - source: "vllm/model_executor/layers/pooler/activations.py:60"
        return: {kind: classify, num_labels: "= vars.nl", fn: null}

  - component: pooler-activation
    name: forward
    kind: function
    summary: "PoolerActivation.forward: a list of tensors is activated one by one; classify uses sigmoid below 2 labels (num_labels None reads the last dim) else softmax. Element values are computed for identity, normalize-free lambda ReLU and 0-input sigmoid; other numerics are left to the kernels."
    sources: ["vllm/model_executor/layers/pooler/activations.py:93-100", "vllm/model_executor/layers/pooler/activations.py:134-158"]
    request:
      type: object
      required: [kind, pooled_data]
      properties:
        kind: {type: string, enum: [identity, classify, multi_label, lambda]}
        fn: {type: [string, "null"], default: null, examples: [ReLU]}
        num_labels: {type: [integer, "null"], default: null}
        pooled_data: {description: "a tensor (list of numbers or rows) or a list of tensors"}
        is_list: {type: boolean, default: false, description: "pooled_data is a Python list of tensors"}
    response: {type: object, properties: {out: {}, applied: {type: array}}}
    behavior:
      - set:
          vars.chunks: "= input.is_list ? input.pooled_data : [input.pooled_data]"
      - title: forward_chunk per chunk
        source: "vllm/model_executor/layers/pooler/activations.py:97-100"
        set:
          vars.applied: "= vars.chunks.map(c, input.kind == 'classify' ? ((input.num_labels != null ? input.num_labels : (size(c) > 0 && type(c[0]) == list ? size(c[0]) : size(c))) < 2 ? 'sigmoid' : 'softmax') : (input.kind == 'multi_label' ? 'sigmoid' : (input.kind == 'lambda' ? input.fn : 'identity')))"
      - title: Identity returns the data; a wrapped ReLU clamps at 0 (LambdaPoolerActivation.forward_chunk)
        source: "vllm/model_executor/layers/pooler/activations.py:157-158"
        set:
          vars.out: "= lists.range(size(vars.chunks)).map(i, vars.applied[i] == 'identity' ? vars.chunks[i] : (vars.applied[i] == 'ReLU' ? dyn(vars.chunks[i].map(x, math.greatest(double(x), 0.0))) : dyn(null)))"
      - return: {out: "= input.is_list ? vars.out : vars.out[0]", applied: "= vars.applied"}

  # ------------------------------------------------------------- lazy model hash
  - component: lazy-registered-model
    name: get-modelinfo-module-hash
    kind: function
    summary: "_LazyRegisteredModel._get_modelinfo_module_hash: hash the module file, or for a package __init__.py every .py under the package (sorted), each as relative path + NUL + bytes + NUL; a changed submodule changes the hash."
    sources: ["vllm/model_executor/models/registry.py:975-991"]
    request: {type: object, required: [model_path], properties: {model_path: {type: string, examples: [/tmp/model_package/__init__.py]}}}
    response: {type: object, properties: {hash: {type: string}, files: {type: array}}}
    behavior:
      - set:
          vars.root: "= input.model_path.substring(0, input.model_path.lastIndexOf('/') + 1)"
      - title: A package entry point hashes the whole package (rglob('*.py'))
        source: "vllm/model_executor/models/registry.py:977-981"
        if: "input.model_path.endsWith('/__init__.py')"
        then:
          - call: local-disk.list-files
            input: {prefix: "= vars.root"}
            as: ls
          - set: {vars.files: "= vars.ls.value.filter(f, f.path.endsWith('.py')).map(f, f)"}
        else:
          - call: local-disk.read-file
            input: {path: "= input.model_path"}
            as: one
          - set: {vars.files: "= [merge(vars.one.value, {'path': input.model_path})]"}
      - title: relative path, NUL, file bytes, NUL - for each file in sorted order
        source: "vllm/model_executor/models/registry.py:985-991"
        return:
          hash: "= sha256(vars.files.map(f, f.path.substring(size(vars.root), size(f.path)) + '\\u0000' + string(f.content) + '\\u0000').join(''))"
          files: "= vars.files.map(f, f.path.substring(size(vars.root), size(f.path)))"
