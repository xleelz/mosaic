# models-layers fix round 4 (coverage): multimodal processor caches, media IO kwargs, the video
# loader registry, processing-context getters, prompt-update fallback, placeholder ranges, audio
# normalization, LoRARequest, MoE activation / routing-method enums, WeightsMapper, linear weight
# loaders, pooler activations and the lazy-model module hash.
components:
  - id: multi-modal-cache-factories
    name: vllm/multimodal/cache/factories.py
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "Chooses the multimodal processor cache: none (non-multimodal model or --mm-processor-cache-gb 0), processor-only (no IPC with several API processes or DP), else --mm-processor-cache-type (lru by default) with a mirrored P1 receiver in the engine."
    sources: ["vllm/multimodal/cache/factories.py:23-107"]
  - id: multi-modal-processor-only-cache
    name: MultiModalProcessorOnlyCache
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "P0 cache used when IPC caching is off: keeps the processed item and its prompt updates, so a hit returns the cached item and skips the HF processor."
    sources: ["vllm/multimodal/cache/base.py:395-443"]
    state:
      initial: {entries: {}, order: [], used: 0}
  - id: lru-key-replicated-sender-cache
    name: LruKeyReplicatedSenderCache
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "P0 cache with IPC caching (lru): keeps only item metadata in the same LRU order as the P1 receiver, so a hit sends no data to the engine."
    sources: ["vllm/multimodal/cache/lru.py:22-83"]
    state:
      initial: {entries: {}, order: [], used: 0}
  - id: lru-key-replicated-receiver-cache
    name: LruKeyReplicatedReceiverCache
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "P1 cache in the engine-core process, mirrored with the P0 sender: data sent by P0 is stored, a missing payload is served from the cache, and a payload missing from both raises MultiModalCacheMissError."
    sources: ["vllm/multimodal/cache/lru.py:86-142"]
    state:
      initial: {entries: {}, order: [], used: 0}
  - id: input-processing-context
    name: InputProcessingContext
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "The model config and tokenizer a multimodal processor works with: tokenizer, HF config and HF processor getters with type checks."
    sources: ["vllm/multimodal/processing/context.py:213-224"]
  - id: video-loader-registry
    name: VideoLoaderRegistry (VIDEO_LOADER_REGISTRY)
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "Registry of video loader backends by name, the HF video processor class each one aligns with, and which backends need a GPU (deepstream, pynvvideocodec)."
    sources: ["vllm/multimodal/video.py:36-91", "vllm/multimodal/video.py:197-198"]
    state:
      initial:
        name2class:
          opencv: VideoBackend
          pynvvideocodec: PyNvVideoCodecVideoBackend
          qwen3_vl: Qwen3VLVideoBackend
          embedding_gemma2: EmbeddingGemma2VideoBackend
          qwen2_vl: Qwen2VLVideoBackend
          opencv_dynamic: DynamicVideoBackend
          glm46v: GLM46VVideoBackend
          glm5next: GLM5NextVideoBackend
          glmga: GLMGAVideoBackend
          molmo2: Molmo2VideoBackend
          nemotron_vl: NemotronVLVideoBackend
          openpangu: OpenPanguVideoBackend
          clef_omni: ClefOmniVideoBackend
          llava_onevision2: LlavaOnevision2VideoBackend
          minimax_m3_vl: MiniMaxM3VideoBackend
        processor2backend:
          Qwen3VLVideoProcessor: qwen3_vl
          Cosmos3EdgeVideoProcessor: qwen3_vl
          EmbeddingGemma2VideoProcessor: embedding_gemma2
          Qwen2VLVideoProcessor: qwen2_vl
          Glm4vVideoProcessor: opencv_dynamic
          Glm46VVideoProcessor: glm46v
          Glm5NextVideoProcessor: glm5next
          Glm5nextVideoProcessor: glm5next
          GlmgaVideoProcessor: glmga
          Molmo2VideoProcessor: molmo2
          LlavaOnevision2VideoProcessor: llava_onevision2
          MiniMaxM3VLVideoProcessor: minimax_m3_vl
        requires_gpu: {opencv: false, pynvvideocodec: true, deepstream: true}
  - id: video-media-io
    name: VideoMediaIO
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "Video media loader: merges --media-io-kwargs with a request's media_io_kwargs (startup-only and GPU-backend keys stripped), picks the video loader backend and samples num_frames."
    sources: ["vllm/multimodal/media/video.py:30-39"]
  - id: media-connector
    name: MediaConnector (merge_media_io_kwargs)
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "Fetches media for multimodal inputs; merge_media_io_kwargs merges config-level and per-request media_io_kwargs per modality with each MediaIO's merge_kwargs."
    sources: ["vllm/multimodal/media/connector.py:51-55", "vllm/multimodal/media/connector.py:151-158"]
  - id: placeholder-range
    name: PlaceholderRange
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "Where a multimodal item's placeholder tokens sit in the prompt (offset, length) and, through is_embed, which of them take encoder embeddings."
    sources: ["vllm/multimodal/inputs.py:121-147"]
  - id: audio
    name: vllm/multimodal/audio.py (normalize_audio)
    kind: module
    parent: multi-modal-registry
    layer: multimodal
    summary: "Audio helpers: AudioSpec/ChannelReduction and normalize_audio, which reduces multi-channel audio to the feature extractor's channel count."
    sources: ["vllm/multimodal/audio.py:54-97"]
  - id: lora-request
    name: LoRARequest
    kind: module
    parent: lora
    layer: lora
    summary: "The msgspec struct naming a LoRA adapter for a request: validated on construction, compared and hashed by name."
    sources: ["vllm/lora/request.py:8-35"]
  - id: moe-activation
    name: MoEActivation
    kind: module
    parent: fused-moe
    layer: moe
    summary: "Enum of MoE activations (gated and _no_mul variants), with the custom-op each maps to and the string aliases accepted from configs."
    sources: ["vllm/model_executor/layers/fused_moe/activation.py:21-45"]
  - id: fused-moe-config
    name: vllm/model_executor/layers/fused_moe/config.py (RoutingMethodType)
    kind: module
    parent: fused-moe
    layer: moe
    summary: "MoE configuration helpers: the RoutingMethodType enum passed to FlashInfer kernels and how a router's scoring function and flags select it."
    sources: ["vllm/model_executor/layers/fused_moe/config.py:105-132"]
  - id: weights-mapper
    name: WeightsMapper
    kind: module
    parent: model-executor
    layer: loader
    summary: "Renames checkpoint weight names to the vLLM module names (substring, stacked, prefix and suffix rules); a rule mapping to None drops the weight."
    sources: ["vllm/model_executor/models/utils.py:48-61"]
  - id: merged-column-parallel-linear
    name: MergedColumnParallelLinear
    kind: module
    parent: column-parallel-linear
    layer: layers
    summary: "Column-parallel linear made of several stacked outputs (gate_up_proj): each logical output is sharded over TP and loaded by integer shard id."
    sources: ["vllm/model_executor/layers/linear.py:672-730"]
  - id: replicated-linear
    name: ReplicatedLinear
    kind: module
    parent: model-executor
    layer: layers
    summary: "Linear layer replicated on every rank (no sharding); its loader requires the checkpoint tensor to match the parameter exactly."
    sources: ["vllm/model_executor/layers/linear.py:324-400"]
  - id: pooler-activation
    name: PoolerActivation (pooler/activations.py)
    kind: module
    parent: model-executor
    layer: pooling
    summary: "Activations applied to pooled outputs: identity, normalize, sigmoid (multi-label), classify (sigmoid below 2 labels, else softmax) or a wrapped torch.nn module; lists are activated item by item."
    sources: ["vllm/model_executor/layers/pooler/activations.py:79-100"]
  - id: lazy-registered-model
    name: _LazyRegisteredModel
    kind: module
    parent: model-registry
    layer: models
    summary: "A registry entry whose module is imported only in a subprocess; its _ModelInfo cache file is keyed by a hash of the module source (the whole package for an __init__.py)."
    sources: ["vllm/model_executor/models/registry.py:960-974"]

interfaces:
  # ------------------------------------------------------------- processor caches
  - component: multi-modal-cache-factories
    name: get-cache-type
    kind: function
    summary: "_get_cache_type: no cache for a text-only model or --mm-processor-cache-gb <= 0; processor_only when IPC is unsupported (data parallel without external LB); else --mm-processor-cache-type."
    sources: ["vllm/multimodal/cache/factories.py:23-46"]
    request: {type: object, properties: {supports_multimodal_inputs: {type: boolean, default: true}}}
    response: {type: object, properties: {cache_type: {type: [string, "null"]}}}
    behavior:
      - title: Not a multimodal model - no cache
        source: "vllm/multimodal/cache/factories.py:27-28"
        if: "!input.supports_multimodal_inputs"
        then:
          - return: {cache_type: null}
      - title: The cache is disabled
        source: "vllm/multimodal/cache/factories.py:31-33"
        if: "double(config['mm-processor-cache-gb']) <= 0.0"
        then:
          - return: {cache_type: null}
      - title: "IPC caching needs one API process and DP 1 (or external LB); the fixtures run one API server (_api_process_count 1)"
        source: "vllm/multimodal/cache/factories.py:36-43"
        if: "config['data-parallel-size'] != 1"
        then:
          - return: {cache_type: processor_only}
      - source: "vllm/multimodal/cache/factories.py:45-46"
        return: {cache_type: "= config['mm-processor-cache-type']"}

  - component: multi-modal-cache-factories
    name: processor-cache-from-config
    kind: function
    summary: "processor_cache_from_config: the P0 cache object for the cache type (shm is not modeled)."
    sources: ["vllm/multimodal/cache/factories.py:49-63"]
    request: {type: object, properties: {supports_multimodal_inputs: {type: boolean, default: true}}}
    response: {type: object, properties: {cache_type: {type: [string, "null"]}, component: {type: [string, "null"]}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - call: multi-modal-cache-factories.get-cache-type
        input: {supports_multimodal_inputs: "= input.supports_multimodal_inputs"}
        as: t
      - source: "vllm/multimodal/cache/factories.py:54-57"
        if: "vars.t.value.cache_type == null || vars.t.value.cache_type == 'processor_only'"
        then:
          - return: {cache_type: "= vars.t.value.cache_type", component: "= vars.t.value.cache_type == null ? dyn(null) : dyn('multi-modal-processor-only-cache')"}
      - source: "vllm/multimodal/cache/factories.py:58-59"
        if: "vars.t.value.cache_type == 'lru'"
        then:
          - return: {cache_type: lru, component: lru-key-replicated-sender-cache}
      - source: "vllm/multimodal/cache/factories.py:62-63"
        fail: {code: value-error, status: 0, message: "= 'Unknown cache type: ' + string(vars.t.value.cache_type)"}

  - component: multi-modal-cache-factories
    name: engine-receiver-cache-from-config
    kind: function
    summary: "engine_receiver_cache_from_config: the engine-core process gets the LRU receiver only for cache type lru (none for processor_only, shm or no cache)."
    sources: ["vllm/multimodal/cache/factories.py:77-87"]
    request: {type: object, properties: {supports_multimodal_inputs: {type: boolean, default: true}}}
    response: {type: object, properties: {component: {type: [string, "null"]}}}
    behavior:
      - call: multi-modal-cache-factories.get-cache-type
        input: {supports_multimodal_inputs: "= input.supports_multimodal_inputs"}
        as: t
      - source: "vllm/multimodal/cache/factories.py:82-85"
        return: {component: "= vars.t.value.cache_type == 'lru' ? dyn('lru-key-replicated-receiver-cache') : dyn(null)"}

  - component: multi-modal-processor-only-cache
    name: is-cached
    kind: function
    summary: "is_cached: whether each hash is cached, without touching the LRU order."
    sources: ["vllm/multimodal/cache/base.py:333-346", "vllm/multimodal/cache/base.py:415-417"]
    request: {type: object, required: [mm_hashes], properties: {mm_hashes: {type: array, items: {type: string}}}}
    response: {type: object, properties: {cached: {type: array, items: {type: boolean}}}}
    behavior:
      - source: "vllm/multimodal/cache/base.py:416-417"
        if: "size(input.mm_hashes) > 0"
        then:
          - return: {cached: "= input.mm_hashes.map(h, h in state.entries)"}
      - return: {cached: []}

  - component: multi-modal-processor-only-cache
    name: get-and-update
    kind: function
    summary: "get_and_update_item: a hit returns the cached item and prompt updates (and moves it to the LRU end); a miss stores the item if it fits (evicting the least recent) and returns it; an item bigger than the whole cache is served uncached."
    sources: ["vllm/multimodal/cache/base.py:419-431", "vllm/multimodal/cache/base.py:259-294", "vllm/utils/cache.py:159-175"]
    tags: [writes]
    request:
      type: object
      required: [mm_hash]
      properties:
        mm_hash: {type: string}
        item: {type: [object, "null"], default: null, description: "{modality, bytes, prompt_updates}, or null for an item P0 believes cached"}
    response: {type: object, properties: {item: {type: [object, "null"]}, prompt_updates: {type: object}, hit: {type: boolean}, stored: {type: boolean}, evicted: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - title: Hit - return the cached item (LRU get moves it to the end)
        source: "vllm/multimodal/cache/base.py:425-426"
        if: "input.mm_hash in state.entries"
        then:
          - set: {state.order: "= state.order.filter(h, h != input.mm_hash) + [input.mm_hash]"}
          - return: {item: "= state.entries[input.mm_hash].item", prompt_updates: "= state.entries[input.mm_hash].prompt_updates", hit: true, stored: false, evicted: []}
      - source: "vllm/multimodal/cache/base.py:428"
        if: "input.item == null"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'Expected a cached item for mm_hash=\\'' + input.mm_hash + '\\''"}
      - set:
          vars.cap: "= int(double(config['mm-processor-cache-gb']) * 1073741824.0)"
      - title: cache_if_fits - an item larger than the whole cache is processed uncached (warning)
        source: "vllm/multimodal/cache/base.py:284-294"
        if: "input.item.bytes > vars.cap"
        then:
          - return: {item: "= input.item", prompt_updates: "= input.item.prompt_updates", hit: false, stored: false, evicted: []}
      - set: {vars.used: "= state.used", vars.evicted: []}
      - title: LRUCache insert evicts least-recently-used items until the new one fits
        source: "vllm/utils/cache.py:159-175"
        foreach: "= state.order"
        as: h
        steps:
          - if: "vars.used + input.item.bytes <= vars.cap"
            then: [{break: true}]
          - set: {vars.used: "= vars.used - state.entries[vars.h].bytes", vars.evicted: "= vars.evicted + [vars.h]"}
      - set:
          state.entries: "= merge(state.entries.transformMap(k, v, !(k in vars.evicted), v), {input.mm_hash: {'bytes': input.item.bytes, 'item': input.item, 'prompt_updates': input.item.prompt_updates}})"
          state.order: "= state.order.filter(h, !(h in vars.evicted)) + [input.mm_hash]"
          state.used: "= vars.used + input.item.bytes"
      - source: "vllm/multimodal/cache/base.py:430-431"
        return: {item: "= input.item", prompt_updates: "= input.item.prompt_updates", hit: false, stored: true, evicted: "= vars.evicted"}

  - component: multi-modal-processor-only-cache
    name: clear-cache
    kind: function
    summary: "clear_cache: drop every cached item."
    sources: ["vllm/multimodal/cache/base.py:437-439"]
    tags: [writes]
    behavior:
      - set: {vars.n: "= size(state.order)"}
      - set: {state.entries: {}, state.order: [], state.used: 0}
      - return: {cleared: "= vars.n"}

  - component: lru-key-replicated-sender-cache
    name: is-cached
    kind: function
    summary: "is_cached: whether P1 holds each hash, read from the mirrored P0 metadata without touching the LRU order."
    sources: ["vllm/multimodal/cache/base.py:333-346", "vllm/multimodal/cache/lru.py:47-49"]
    request: {type: object, required: [mm_hashes], properties: {mm_hashes: {type: array, items: {type: string}}}}
    response: {type: object, properties: {cached: {type: array, items: {type: boolean}}}}
    behavior:
      - source: "vllm/multimodal/cache/lru.py:48-49"
        if: "size(input.mm_hashes) > 0"
        then:
          - return: {cached: "= input.mm_hashes.map(h, h in state.entries)"}
      - return: {cached: []}

  - component: lru-key-replicated-sender-cache
    name: get-and-update
    kind: function
    summary: "get_and_update_item: a hit sends no data (None) but returns the cached prompt updates; a miss records the item's metadata (same size and LRU order as P1) and sends the data."
    sources: ["vllm/multimodal/cache/lru.py:51-65", "vllm/multimodal/cache/base.py:259-294", "vllm/utils/cache.py:159-175"]
    tags: [writes]
    request:
      type: object
      required: [mm_hash]
      properties:
        mm_hash: {type: string}
        item: {type: [object, "null"], default: null}
    response: {type: object, properties: {item: {type: [object, "null"]}, prompt_updates: {type: object}, hit: {type: boolean}, stored: {type: boolean}, evicted: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - title: Hit - clear the data to avoid IPC, keep the prompt updates
        source: "vllm/multimodal/cache/lru.py:57-58"
        if: "input.mm_hash in state.entries"
        then:
          - set: {state.order: "= state.order.filter(h, h != input.mm_hash) + [input.mm_hash]"}
          - return: {item: null, prompt_updates: "= state.entries[input.mm_hash].prompt_updates", hit: true, stored: false, evicted: []}
      - source: "vllm/multimodal/cache/lru.py:60"
        if: "input.item == null"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'Expected a cached item for mm_hash=\\'' + input.mm_hash + '\\''"}
      - set:
          vars.cap: "= int(double(config['mm-processor-cache-gb']) * 1073741824.0)"
      - title: cache_if_fits - oversize items are sent every time and never cached
        source: "vllm/multimodal/cache/base.py:284-294"
        if: "input.item.bytes > vars.cap"
        then:
          - return: {item: "= input.item", prompt_updates: "= input.item.prompt_updates", hit: false, stored: false, evicted: []}
      - set: {vars.used: "= state.used", vars.evicted: []}
      - title: Evict least-recently-used metadata until the item fits (P1 evicts the same keys)
        source: "vllm/utils/cache.py:159-175"
        foreach: "= state.order"
        as: h
        steps:
          - if: "vars.used + input.item.bytes <= vars.cap"
            then: [{break: true}]
          - set: {vars.used: "= vars.used - state.entries[vars.h].bytes", vars.evicted: "= vars.evicted + [vars.h]"}
      - title: Store MultiModalProcessorCacheItemMetadata (size and prompt updates, not the data)
        source: "vllm/multimodal/cache/lru.py:62-64"
        set:
          state.entries: "= merge(state.entries.transformMap(k, v, !(k in vars.evicted), v), {input.mm_hash: {'bytes': input.item.bytes, 'prompt_updates': input.item.prompt_updates}})"
          state.order: "= state.order.filter(h, !(h in vars.evicted)) + [input.mm_hash]"
          state.used: "= vars.used + input.item.bytes"
      - source: "vllm/multimodal/cache/lru.py:65"
        return: {item: "= input.item", prompt_updates: "= input.item.prompt_updates", hit: false, stored: true, evicted: "= vars.evicted"}

  - component: lru-key-replicated-sender-cache
    name: invalidate
    kind: function
    summary: "invalidate: drop a stale shadow entry after P1 reported a cache miss, so the next request resends the data."
    sources: ["vllm/multimodal/cache/lru.py:79-83"]
    tags: [writes]
    request: {type: object, required: [mm_hash], properties: {mm_hash: {type: string}}}
    behavior:
      - if: "input.mm_hash in state.entries"
        then:
          - set:
              state.used: "= state.used - state.entries[input.mm_hash].bytes"
              state.entries: "= state.entries.transformMap(k, v, k != input.mm_hash, v)"
              state.order: "= state.order.filter(h, h != input.mm_hash)"
          - return: {removed: true}
      - return: {removed: false}

  - component: lru-key-replicated-sender-cache
    name: clear-cache
    kind: function
    summary: "clear_cache: drop all shadow metadata (AsyncLLM.reset_mm_cache clears P0, then the engine clears P1)."
    sources: ["vllm/multimodal/cache/lru.py:71-73"]
    tags: [writes]
    behavior:
      - set: {vars.n: "= size(state.order)"}
      - set: {state.entries: {}, state.order: [], state.used: 0}
      - return: {cleared: "= vars.n"}

  - component: lru-key-replicated-receiver-cache
    name: get-and-update-features
    kind: function
    summary: "get_and_update_features (P1): touch every item first, then store sent data or serve a None payload from the cache; every hash missing from both is collected into one MultiModalCacheMissError."
    sources: ["vllm/multimodal/cache/base.py:451-478"]
    tags: [writes]
    request:
      type: object
      required: [mm_features]
      properties:
        mm_features: {type: array, items: {type: object, description: "{mm_hash, data} where data is the item P0 sent or null"}}
    response: {type: object, properties: {mm_features: {type: array}}}
    errors:
      - {code: multi-modal-cache-miss-error, status: 0, retryable: true}
    behavior:
      - title: Touch every key first so an item in this request is not evicted by another
        source: "vllm/multimodal/cache/base.py:462-464"
        set: {state.order: "= state.order.filter(h, !(h in input.mm_features.map(f, f.mm_hash))) + input.mm_features.map(f, f.mm_hash).filter(h, h in state.order)"}
      - set: {vars.out: [], vars.missing: []}
      - source: "vllm/multimodal/cache/base.py:466-475"
        foreach: "= input.mm_features"
        as: f
        steps:
          - call: lru-key-replicated-receiver-cache.get-and-update
            input: {mm_hash: "= vars.f.mm_hash", item: "= vars.f.data"}
            as: r
            on_error:
              - set: {vars.missing: "= vars.missing + [vars.f.mm_hash]"}
              - continue: true
          - set: {vars.out: "= vars.out + [{'mm_hash': vars.f.mm_hash, 'data': vars.r.value.item}]"}
      - title: Raise once with every drifted hash so P0 can invalidate them all
        source: "vllm/multimodal/cache/base.py:476-477"
        if: "size(vars.missing) > 0"
        then:
          - fail: {code: multi-modal-cache-miss-error, status: 0, message: "= 'Multi-modal cache miss: ' + vars.missing.join(', ')", data: {mm_hashes: "= vars.missing"}}
      - return: {mm_features: "= vars.out"}

  - component: lru-key-replicated-receiver-cache
    name: get-and-update
    kind: function
    summary: "get_and_update_item (P1): sent data replaces any cached copy (stored if it fits); no data is served from the cache; no data and no entry raises MultiModalCacheMissError."
    sources: ["vllm/multimodal/cache/lru.py:109-130"]
    tags: [writes]
    request:
      type: object
      required: [mm_hash]
      properties:
        mm_hash: {type: string}
        item: {type: [object, "null"], default: null}
    response: {type: object, properties: {item: {type: object}}}
    errors:
      - {code: multi-modal-cache-miss-error, status: 0, retryable: true}
    behavior:
      - if: "input.item != null"
        then:
          - set: {vars.cap: "= int(double(config['mm-processor-cache-gb']) * 1073741824.0)"}
          - title: Drop any stale copy first, then cache_if_fits
            source: "vllm/multimodal/cache/lru.py:115-122"
            set:
              vars.used: "= input.mm_hash in state.entries ? state.used - state.entries[input.mm_hash].bytes : state.used"
              vars.order: "= state.order.filter(h, h != input.mm_hash)"
              vars.evicted: []
          - if: "input.item.bytes <= vars.cap"
            then:
              - foreach: "= vars.order"
                as: h
                steps:
                  - if: "vars.used + input.item.bytes <= vars.cap"
                    then: [{break: true}]
                  - set: {vars.used: "= vars.used - state.entries[vars.h].bytes", vars.evicted: "= vars.evicted + [vars.h]"}
              - set:
                  state.entries: "= merge(state.entries.transformMap(k, v, k != input.mm_hash && !(k in vars.evicted), v), {input.mm_hash: {'bytes': input.item.bytes, 'item': input.item}})"
                  state.order: "= vars.order.filter(h, !(h in vars.evicted)) + [input.mm_hash]"
                  state.used: "= vars.used + input.item.bytes"
              - return: {item: "= input.item"}
          - set:
              state.entries: "= state.entries.transformMap(k, v, k != input.mm_hash, v)"
              state.order: "= vars.order"
              state.used: "= vars.used"
          - return: {item: "= input.item"}
      - title: No data - serve the cached item
        source: "vllm/multimodal/cache/lru.py:124-125"
        if: "input.mm_hash in state.entries"
        then:
          - return: {item: "= state.entries[input.mm_hash].item"}
      - title: P0 trusted its shadow but the caches drifted - retryable miss
        source: "vllm/multimodal/cache/lru.py:127-130"
        fail: {code: multi-modal-cache-miss-error, status: 0, message: "= 'Multi-modal cache miss: ' + input.mm_hash", data: {mm_hashes: ["= input.mm_hash"]}}

  - component: lru-key-replicated-receiver-cache
    name: clear-cache
    kind: function
    summary: "clear_cache on P1 (EngineCore.reset_mm_cache)."
    sources: ["vllm/multimodal/cache/lru.py:140-142"]
    tags: [writes]
    behavior:
      - set: {vars.n: "= size(state.order)"}
      - set: {state.entries: {}, state.order: [], state.used: 0}
      - return: {cleared: "= vars.n"}

  # ------------------------------------------------------------- processing context
  - component: input-processing-context
    name: get-tokenizer
    kind: function
    summary: "InputProcessingContext.get_tokenizer: the tokenizer, or ValueError when the engine skipped tokenizer init."
    sources: ["vllm/multimodal/processing/context.py:225-231"]
    request: {type: object, required: [ctx], properties: {ctx: {type: object}}}
    response: {type: object, properties: {tokenizer: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/multimodal/processing/context.py:226-229"
        if: "!has(input.ctx.tokenizer) || input.ctx.tokenizer == null"
        then:
          - fail: {code: value-error, status: 0, message: "You cannot pass text prompts when `skip_tokenizer_init=True`"}
      - return: {tokenizer: "= input.ctx.tokenizer"}

  - component: input-processing-context
    name: get-hf-config
    kind: function
    summary: "InputProcessingContext.get_hf_config(typ): the model's HF config, checked against the expected config class(es) (any PreTrainedConfig when none)."
    sources: ["vllm/multimodal/processing/context.py:233-269"]
    request:
      type: object
      required: [ctx]
      properties:
        ctx: {type: object}
        typ: {type: [array, "null"], items: {type: string}, default: null}
    response: {type: object, properties: {hf_config_type: {type: string}}}
    errors:
      - {code: type-error, status: 0, retryable: false}
    behavior:
      - title: isinstance(hf_config, typ) with typ defaulting to PreTrainedConfig
        source: "vllm/multimodal/processing/context.py:254-267"
        if: "input.typ != null && !(input.ctx.hf_config_type in input.typ)"
        then:
          - fail: {code: type-error, status: 0, message: "= 'Invalid type of HuggingFace config. Expected type: ' + input.typ.join(', ') + ', but found type: ' + input.ctx.hf_config_type"}
      - return: {hf_config_type: "= input.ctx.hf_config_type"}

  - component: input-processing-context
    name: get-hf-processor
    kind: function
    summary: "InputProcessingContext.get_hf_processor(typ, **kwargs): unwrap a Mistral tokenizer, merge --mm-processor-kwargs under the call's kwargs (dropping `tokenizer`), load the cached HF processor and check its class."
    sources: ["vllm/multimodal/processing/context.py:288-330"]
    request:
      type: object
      required: [ctx]
      properties:
        ctx: {type: object}
        typ: {type: [array, "null"], items: {type: string}, default: null}
        kwargs: {type: object, default: {}}
    response: {type: object, properties: {processor_cls: {type: string}, tokenizer: {type: [string, "null"]}, kwargs: {type: object}}}
    errors:
      - {code: type-error, status: 0, retryable: false}
    behavior:
      - title: A Mistral tokenizer is passed to HF as its transformers tokenizer
        source: "vllm/multimodal/processing/context.py:316-318"
        set:
          vars.tok: "= has(input.ctx.tokenizer_mode) && input.ctx.tokenizer_mode == 'mistral' && input.ctx.tokenizer != null ? input.ctx.tokenizer + ':transformers_tokenizer' : input.ctx.tokenizer"
      - title: get_merged_mm_kwargs - inference kwargs over --mm-processor-kwargs; `tokenizer` is never forwarded
        source: "vllm/multimodal/processing/context.py:320-321"
        set:
          vars.kw: "= merge('mm-processor-kwargs' in config && config['mm-processor-kwargs'] != null ? config['mm-processor-kwargs'] : {}, input.kwargs).transformMap(k, v, k != 'tokenizer', v)"
      - title: cached_processor_from_config(processor_cls=typ) fails when the processor is not of that class
        source: "vllm/multimodal/processing/context.py:323-328"
        if: "input.typ != null && !(input.ctx.processor_cls in input.typ)"
        then:
          - fail: {code: type-error, status: 0, message: "= 'Invalid type of HuggingFace processor. Expected type: ' + input.typ.join(', ') + ', but found type: ' + input.ctx.processor_cls"}
      - return: {processor_cls: "= input.ctx.processor_cls", tokenizer: "= vars.tok", kwargs: "= vars.kw"}

  - component: base-processing-info
    name: get-tokenizer
    kind: function
    summary: "BaseProcessingInfo.get_tokenizer: delegate to the context."
    sources: ["vllm/multimodal/processing/context.py:462-463"]
