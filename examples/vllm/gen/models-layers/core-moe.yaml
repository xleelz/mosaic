  # ---------------------------------------------------------------- expert placement (EP)
  - component: expert-map-manager
    name: determine-expert-map
    kind: function
    summary: "determine_expert_map: split experts as evenly as possible over EP ranks (lower ranks take the remainder) and map global to local ids, contiguously (linear) or strided (round_robin); -1 for experts elsewhere."
    sources: ["vllm/model_executor/layers/fused_moe/expert_map_manager.py:22-112"]
    request:
      type: object
      required: [ep_size, ep_rank, global_num_experts]
      properties:
        ep_size: {type: integer, examples: [4]}
        ep_rank: {type: integer, examples: [0]}
        global_num_experts: {type: integer, examples: [8]}
        expert_placement_strategy: {type: string, default: linear}
    response: {type: object, properties: {local_num_experts: {type: integer}, expert_map: {type: [array, "null"], items: {type: integer}}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: EP size 1 - every expert is local, no map
        source: "vllm/model_executor/layers/fused_moe/expert_map_manager.py:62-64"
        if: "input.ep_size == 1"
        then:
          - return: {local_num_experts: "= input.global_num_experts", expert_map: null}
      - title: base = E // ep, the first E % ep ranks take one more
        source: "vllm/model_executor/layers/fused_moe/expert_map_manager.py:66-72"
        set:
          vars.base: "= input.global_num_experts / input.ep_size"
          vars.rem: "= input.global_num_experts % input.ep_size"
      - set:
          vars.local: "= input.ep_rank < vars.rem ? vars.base + 1 : vars.base"
      - title: linear - a contiguous block starting at rank * base + min(rank, rem)
        source: "vllm/model_executor/layers/fused_moe/expert_map_manager.py:75-79"
        if: "input.expert_placement_strategy == 'linear'"
        then:
          - set:
              vars.start: "= input.ep_rank * vars.base + math.least(input.ep_rank, vars.rem)"
          - return:
              local_num_experts: "= vars.local"
              expert_map: "= lists.range(input.global_num_experts).map(g, g >= vars.start && g < vars.start + vars.local ? g - vars.start : -1)"
      - title: round_robin - experts rank, rank + ep, rank + 2ep, ...
        source: "vllm/model_executor/layers/fused_moe/expert_map_manager.py:80-87"
        if: "input.expert_placement_strategy == 'round_robin'"
        then:
          - return:
              local_num_experts: "= vars.local"
              expert_map: "= lists.range(input.global_num_experts).map(g, g % input.ep_size == input.ep_rank ? g / input.ep_size : -1)"
      - source: "vllm/model_executor/layers/fused_moe/expert_map_manager.py:88-93"
        fail: {code: value-error, status: 0, message: "= 'Unsupported expert placement strategy ' + input.expert_placement_strategy"}
