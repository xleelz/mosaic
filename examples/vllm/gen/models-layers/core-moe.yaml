      - call: fp8-linear-method.select-kernel
        input: {block: "= input.block"}
        as: sel
      - title: "prepare_fp8_layer_for_marlin warns (Your GPU does not have native support for FP8 computation but FP8 quantization is being used. Weight-only FP8 compression will be used leveraging the Marlin kernel. This may degrade performance for compute-heavy workloads.) and repacks the weight"
        source: "vllm/model_executor/layers/quantization/utils/marlin_utils_fp8.py:103-113"
        if: "vars.sel.value.kernel == 'marlin'"
