  - component: fp8-utils
    name: per-token-group-quant-fp8
    kind: kernel
    summary: "per_token_group_quant_fp8: the csrc per_token_group_fp8_quant kernel on CUDA for contiguous input, else the Triton kernels (row- or column-major scales)."
    sources: ["vllm/model_executor/layers/quantization/utils/fp8_utils.py:632-763"]
    request:
      type: object
      required: [num_tokens, hidden_size, group_size]
      properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, group_size: {type: integer, examples: [128]}, contiguous: {type: boolean, default: true}, column_major_scales: {type: boolean, default: false}, layer_repeat: {type: integer}}
    latency_ms: "= double(input.num_tokens) * double(input.hidden_size) * 3.0 / (double(config['gpu-hbm-bandwidth-gbps']) * 1000000.0)"
    behavior:
