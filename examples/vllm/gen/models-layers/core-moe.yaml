        source: "vllm/model_executor/kernels/linear/__init__.py:757-763"
        return: {processed: true, kernel: "= vars.sel.value.kernel", selected: "= 'Selected ' + vars.sel.value.class_name + ' for Fp8LinearMethod'"}

