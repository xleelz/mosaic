  # ---------------------------------------------------------------- FP8 linear
  - component: fp8-linear-method
    name: apply
    kind: function
    summary: "Fp8LinearMethod.apply: run the scaled-mm kernel chosen at init (block-scaled for 128x128 checkpoints, per-tensor/channel otherwise)."
    sources: ["vllm/model_executor/layers/quantization/fp8.py:418-461"]
    request: ModelsLinearInput
    response: {type: object, properties: {owner_ms: {type: integer}}}
    behavior:
      - title: "init_fp8_linear_kernel: the kernel chosen by capability at init"
        source: "vllm/model_executor/kernels/linear/__init__.py:726-810"
        call: fp8-linear-method.select-kernel
        input: {block: "= input.quant == 'fp8_block'"}
        as: sel
      - if: "vars.sel.value.kernel == 'triton_block'"
        then:
          - call: triton-fp8-block-scaled-mm-kernel.apply-weights
            input: "= input"
            as: tb
          - return: {owner_ms: 0, kernel: "= vars.sel.value.kernel"}
      - title: "MarlinFP8ScaledMMLinearKernel.apply_weights -> apply_fp8_marlin_linear -> vllm::marlin_gemm: weight-only FP8, BF16 activations"
        source: "vllm/model_executor/kernels/linear/scaled_mm/marlin.py:81-101"
        if: "vars.sel.value.kernel == 'marlin'"
        then:
          - source: "vllm/model_executor/layers/quantization/utils/marlin_utils.py:440-500"
            call: torch-bindings.marlin-gemm
            input: {m: "= input.num_tokens", n: "= input.out_features", k: "= input.in_features", a_dtype: bfloat16, b_type: float8_e4m3fn, dtype_bytes: 1}
            as: mg
          - return: {owner_ms: "= vars.mg.duration_ms", kernel: marlin}
      - title: "CUTLASS (per-tensor, or block on SM90+); SM100+ FlashInfer's FP8 GEMM has this shape and is modeled through the same op"
        source: "vllm/model_executor/kernels/linear/scaled_mm/cutlass.py:245-275"
        call: cutlass-fp8-scaled-mm-linear-kernel.apply-scaled-mm
        input: "= input"
        as: cu
      - return: {owner_ms: "= vars.cu.value.owner_ms", kernel: "= vars.sel.value.kernel"}

  - component: fp8-linear-method
    name: select-kernel
    kind: function
    summary: "choose_scaled_mm_linear_kernel for FP8, first supported on this GPU. Per-tensor: FlashInfer (SM100+), CUTLASS (cutlass_scaled_mm_supports_fp8), Marlin (SM75+, not batch invariant). Block: CUTLASS block (cutlass_scaled_mm_supports_block_fp8), Marlin, Triton. The optional DeepGEMM and B12x extras and Humming aren't installed in the modeled deployment; torch._scaled_mm needs SM89, where CUTLASS wins first."
    sources: ["vllm/model_executor/kernels/linear/__init__.py:443-452", "vllm/model_executor/kernels/linear/__init__.py:478-490", "vllm/model_executor/kernels/linear/__init__.py:712-717", "vllm/model_executor/kernels/linear/scaled_mm/marlin.py:35-47", "vllm/model_executor/layers/quantization/utils/w8a8_utils.py:11-30"]
    request: {type: object, properties: {block: {type: boolean, default: false}}}
    response: {type: object, properties: {kernel: {type: string}, class_name: {type: string}}}
    behavior:
      - call: cuda-platform.get-device-capability
        input: {device_id: 0}
        as: dc
      - set:
          vars.cap: "= vars.dc.value == null ? -1 : vars.dc.value.as_int"
          vars.block: "= has(input.block) && input.block"
      - if: "!vars.block"
        then:
          - title: "FlashInferFP8ScaledMMLinearKernel: FlashInfer installed and compute capability 100 and above"
            source: "vllm/model_executor/kernels/linear/scaled_mm/flashinfer.py:41-53"
            call: flashinfer.has-flashinfer
            as: fi
          - if: "vars.fi.value.available && vars.cap >= 100"
            then:
              - return: {kernel: flashinfer, class_name: FlashInferFP8ScaledMMLinearKernel}
          - source: "vllm/model_executor/layers/quantization/utils/w8a8_utils.py:11-18"
            call: torch-bindings.cutlass-scaled-mm-supports-fp8
            input: {cuda_device_capability: "= vars.cap"}
            as: cs
          - if: "vars.cs.value.supported"
            then:
              - return: {kernel: cutlass, class_name: CutlassFP8ScaledMMLinearKernel}
        else:
          - source: "vllm/model_executor/layers/quantization/utils/w8a8_utils.py:21-28"
            call: torch-bindings.cutlass-scaled-mm-supports-block-fp8
            input: {cuda_device_capability: "= vars.cap"}
            as: cb
          - if: "vars.cb.value.supported"
            then:
              - return: {kernel: cutlass, class_name: CutlassFp8BlockScaledMMKernel}
      - title: "MarlinFP8ScaledMMLinearKernel: compute capability 7.5 or higher, not batch invariant"
        source: "vllm/model_executor/kernels/linear/scaled_mm/marlin.py:35-47"
        if: "vars.cap >= 75 && !config['vllm-batch-invariant']"
        then:
          - return: {kernel: marlin, class_name: MarlinFP8ScaledMMLinearKernel}
      - title: "Block quant falls to the Triton block kernel"
        source: "vllm/model_executor/kernels/linear/__init__.py:488"
        if: "vars.block"
        then:
          - return: {kernel: triton_block, class_name: TritonFp8BlockScaledMMKernel}
      - title: "Nothing left (Humming not installed): ValueError from choose_scaled_mm_linear_kernel with each per-tensor kernel's reason on its own line, as '<Kernel> <reason>.' (reasons that end in a period keep both)"
        source: "vllm/model_executor/kernels/linear/__init__.py:641-650"
        set:
          vars.reasons:
            - "= 'FlashInferFP8ScaledMMLinearKernel ' + (vars.fi.value.available ? 'requires compute capability 100 and above.' : 'requires FlashInfer to be installed.') + '.'"
            - "CutlassFP8ScaledMMLinearKernel CUTLASS FP8 kernels not available."
            - "B12xTensorFP8ScaledMMLinearKernel B12X FP8 kernels require a Blackwell 12x device."
            - "PerTensorTorchFP8ScaledMMLinearKernel requires a platform with torch FP8 scaled-MM support.."
            - "ChannelWiseTorchFP8ScaledMMLinearKernel requires ROCm.."
            - "= 'MarlinFP8ScaledMMLinearKernel ' + (vars.cap < 75 ? 'FP8 Marlin requires compute capability 7.5 or higher' : 'FP8 Marlin not supported for batch invariant execution.') + '.'"
            - "HummingFP8ScaledMMLinearKernel Humming is not installed."
      - source: "vllm/model_executor/kernels/linear/__init__.py:718-724"
        fail: {code: value-error, status: 0, message: "= 'Failed to find a kernel that can implement the ScaledMM linear layer. Reasons: \\n' + vars.reasons.join('\\n')"}

  - component: fp8-linear-method
    name: process-weights-after-loading
    kind: function
    summary: "Fp8LinearMethod.process_weights_after_loading: canonicalize weight layout and scales for the chosen kernel."
    sources: ["vllm/model_executor/layers/quantization/fp8.py:358-416"]
    request: {type: object, properties: {block: {type: boolean}, k: {type: integer, default: 4096}, n: {type: integer, default: 4096}}}
    behavior:
      - title: Block quant keeps 128x128 scales; per-tensor transposes the weight to (K, N)
        source: "vllm/model_executor/layers/quantization/fp8.py:373-386"
