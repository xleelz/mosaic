# models-layers: Mixtral (MoE), the fused-MoE layer stack, and FP8 linear kernels.
components:
  - id: mixtral-for-causal-lm
    name: MixtralForCausalLM
    kind: module
    parent: model-executor
    layer: models
    summary: "Mixtral sparse MoE causal LM; each expert is sharded across all TP ranks. Holds this rank's loaded weights."
    sources: ["vllm/model_executor/models/mixtral.py:375-420"]
    state:
      initial:
        loaded: false
  - id: mixtral-model
    name: MixtralModel
    kind: module
    parent: mixtral-for-causal-lm
    layer: models
    summary: "Embedding, Mixtral decoder layers and final RMSNorm."
    sources: ["vllm/model_executor/models/mixtral.py:284-343"]
  - id: mixtral-decoder-layer
    name: MixtralDecoderLayer
    kind: module
    parent: mixtral-model
    layer: models
    summary: "RMSNorm, self-attention, fused add+RMSNorm, block-sparse MoE."
    sources: ["vllm/model_executor/models/mixtral.py:225-282"]
  - id: mixtral-attention
    name: MixtralAttention
    kind: module
    parent: mixtral-decoder-layer
    layer: models
    summary: "Same structure as Llama attention: QKV column-parallel, rotary, attention, row-parallel o_proj."
    sources: ["vllm/model_executor/models/mixtral.py:144-223"]
  - id: mixtral-moe
    name: MixtralMoE
    kind: module
    parent: mixtral-decoder-layer
    layer: models
    summary: "Router gate (GateLinear) then the fused MoE layer; outputs are all-reduced across TP ranks."
    sources: ["vllm/model_executor/models/mixtral.py:71-141"]
  - id: gate-linear
    name: GateLinear
    kind: module
    parent: model-executor
    layer: moe
    summary: "The MoE router projection; picks among specialized router GEMM tiers before falling back to a replicated F.linear."
    sources: ["vllm/model_executor/layers/fused_moe/router/gate_linear.py:21-120"]
  - id: moe-runner
    name: MoERunner
    kind: module
    parent: model-executor
    layer: moe
    summary: "Drives one fused-MoE layer: the opaque moe_forward custom op, routing, routed experts, shared experts and the final all-reduce."
    sources: ["vllm/model_executor/layers/fused_moe/runner/moe_runner.py:228-300"]
  - id: fused-top-k-router
    name: FusedTopKRouter
    kind: module
    parent: model-executor
    layer: moe
    summary: "Default router: fused top-k over softmax (or sigmoid) gating scores, then EPLB mapping and index dtype conversion."
    sources: ["vllm/model_executor/layers/fused_moe/router/fused_topk_router.py:128-174"]
  - id: routed-experts
    name: RoutedExperts
    kind: module
    parent: model-executor
    layer: moe
    summary: "Holds the expert weights and runs them through the quant method's modular or monolithic kernel."
    sources: ["vllm/model_executor/layers/fused_moe/routed_experts.py:73-90"]
  - id: triton-experts
    name: TritonExperts
    kind: module
    parent: model-executor
    layer: moe
    summary: "The Triton fused-MoE experts kernel: align tokens to experts, w13 grouped GEMM, activation, w2 grouped GEMM, top-k sum."
    sources: ["vllm/model_executor/layers/fused_moe/experts/triton_moe.py:65-100"]
  - id: fused-moe
    name: fused_moe/fused_moe.py
    kind: module
    parent: model-executor
    layer: moe
    summary: "The fused_moe Triton kernels, their launchers and the legacy fused_experts custom op."
    sources: ["vllm/model_executor/layers/fused_moe/fused_moe.py:761-790"]
  - id: fused-moe-activation
    name: fused_moe/activation.py
    kind: module
    parent: model-executor
    layer: moe
    summary: "apply_moe_activation and its clamp and masked variants, dispatching to the csrc activation ops or a Triton kernel."
    sources: ["vllm/model_executor/layers/fused_moe/activation.py:314-330"]
  - id: fused-moe-utils
    name: fused_moe/utils.py
    kind: module
    parent: model-executor
    layer: moe
    summary: "MoE helpers, including the pad-aware SwiGLU-with-limit Triton kernel."
    sources: ["vllm/model_executor/layers/fused_moe/utils.py:678-693"]
  - id: layers-activation
    name: layers/activation.py (Triton helpers)
    kind: module
    parent: model-executor
    layer: moe
    summary: "Triton activation helpers such as swiglustep_and_mul_triton."
    sources: ["vllm/model_executor/layers/activation.py:50-70"]
  - id: expert-map-manager
    name: fused_moe/expert_map_manager.py
    kind: module
    parent: model-executor
    layer: moe
    summary: "Expert-parallel placement: which global experts each EP rank holds."
    sources: ["vllm/model_executor/layers/fused_moe/expert_map_manager.py:22-30"]
  - id: fp8-linear-method
    name: Fp8LinearMethod
    kind: module
    parent: quantization
    layer: quantization
    summary: "FP8 linear: picks a scaled-mm kernel at init (per-tensor/channel or 128x128 block) and applies it."
    sources: ["vllm/model_executor/layers/quantization/fp8.py:225-357"]
  - id: cutlass-fp8-scaled-mm-linear-kernel
    name: CutlassFP8ScaledMMLinearKernel
    kind: module
    parent: fp8-linear-method
    layer: quantization
    summary: "Per-tensor/per-channel FP8 GEMM through the CUTLASS scaled_mm custom op."
    sources: ["vllm/model_executor/kernels/linear/scaled_mm/cutlass.py:158-170"]
  - id: triton-fp8-block-scaled-mm-kernel
    name: TritonFp8BlockScaledMMKernel
    kind: module
    parent: fp8-linear-method
    layer: quantization
    summary: "Block-scaled (128x128) FP8 GEMM in Triton, with per-token-group activation quantization."
    sources: ["vllm/model_executor/kernels/linear/scaled_mm/triton.py:201-223"]
  - id: fp8-utils
    name: quantization/utils/fp8_utils.py
    kind: module
    parent: quantization
    layer: quantization
    summary: "FP8 quantization helpers and Triton kernels: per-token-group quant and the block-scaled matmul."
    sources: ["vllm/model_executor/layers/quantization/utils/fp8_utils.py:632-650"]
  - id: scaled-mm-triton
    name: kernels/linear/scaled_mm/triton.py
    kind: module
    parent: quantization
    layer: quantization
    summary: "Registers the w8a8_triton_block_scaled_mm_func custom op around the Triton block-scaled GEMM."
    sources: ["vllm/model_executor/kernels/linear/scaled_mm/triton.py:225-262"]

interfaces:
  # ---------------------------------------------------------------- Mixtral
  - component: mixtral-for-causal-lm
    name: init
    kind: function
    summary: "MixtralForCausalLM(vllm_config, prefix): build MixtralModel; attention checks head divisibility by TP; each MixtralMoE builds its FusedMoE with the parallel layout (TP flattened across DP and PCP) and the expert counts."
    sources: ["vllm/model_executor/models/mixtral.py:393-420", "vllm/model_executor/models/mixtral.py:93-131"]
    tags: [writes]
    request: {type: object, required: [hf_config, quant], properties: {hf_config: ModelsHfConfig, quant: {type: string}, kv_quant_method: {type: string, default: none}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.hf: "= input.hf_config"
          vars.tp: "= config['tensor-parallel-size']"
      - title: Attention heads and KV heads must split across TP ranks
        source: "vllm/model_executor/models/mixtral.py:158-171"
        if: "vars.hf.num_attention_heads % vars.tp != 0 || (vars.hf.num_key_value_heads >= vars.tp && vars.hf.num_key_value_heads % vars.tp != 0) || (vars.hf.num_key_value_heads < vars.tp && vars.tp % vars.hf.num_key_value_heads != 0)"
        then:
          - fail: {code: assertion-error, status: 0, message: ""}
      - call: rotary-embedding.get-rope
        input: {head_size: "= vars.hf.hidden_size / vars.hf.num_attention_heads", max_position: "= vars.hf.max_position_embeddings", rope_parameters: "= has(vars.hf.rope_parameters) && vars.hf.rope_parameters != null ? vars.hf.rope_parameters : {}"}
        as: rope
      - title: "Attention.__init__ selects the backend (get_attn_backend) while the model is built: an unsupported --attention-backend fails here"
        source: "vllm/model_executor/layers/attention/attention.py:350-360"
        call: attention-layer.init
        input: {num_heads: "= vars.hf.num_attention_heads / vars.tp", head_size: "= vars.hf.hidden_size / vars.hf.num_attention_heads", num_kv_heads: "= math.greatest(1, vars.hf.num_key_value_heads / vars.tp)"}
      - title: "Each attention layer initializes its KV-cache scales and quant method"
        source: "vllm/model_executor/layers/attention/attention.py:157-226"
        call: attention-layer.init-kv-cache-quant
        input: {kv_quant_method: "= has(input.kv_quant_method) ? input.kv_quant_method : 'none'"}
      - title: "make_parallel_config -> FusedMoEParallelConfig.make(tp, pcp, dp): TP is flattened across DP and PCP, and EP (when enabled and that product > 1) gives each rank whole experts"
        source: "vllm/model_executor/layers/fused_moe/layer.py:232-238"
        call: fused-moe-parallel-config.make
        input:
          tp_size: "= vars.tp"
          dp_size: "= int(config['data-parallel-size'])"
          pcp_size: "= int(config['prefill-context-parallel-size'])"
          tp_rank: "= self.startsWith('rank') ? int(self.substring(4)) % vars.tp : 0"
          dp_rank: "= self.startsWith('rank') ? int(self.substring(4)) / vars.tp : 0"
          enable_expert_parallel: "= config['enable-expert-parallel']"
          enable_eplb: "= config['enable-eplb']"
          all2all_backend: "= config['all2all-backend']"
        as: par
      - title: "process_weights_after_loading builds the unquantized MoE kernel, whose prepare/finalize maybe_make_prepare_finalize picks under the new interface: naive AllGather+ReduceScatter dispatch/combine for EP with DP > 1 and the allgather_reducescatter backend, none-DP otherwise"
        source: "vllm/model_executor/layers/fused_moe/oracle/unquantized.py:517-526"
        call: all2all-utils.maybe-make-prepare-finalize
        input: {moe_parallel_config: "= vars.par.value", allow_new_interface: true, has_quant_config: true}
        as: pf
      - title: "determine_expert_counts: Mixtral has no shared experts"
        source: "vllm/model_executor/layers/fused_moe/layer.py:248-255"
        call: fused-moe-layer.determine-expert-counts
        input: {num_experts: "= vars.hf.num_local_experts", num_redundant_experts: "= int(config['num-redundant-experts'])", fuse_shared_experts: false}
        as: counts
      - set:
          vars.use_ep: "= vars.par.value.use_ep"
      - title: "FusedMoEFactory: with EPLB, experts must split evenly across the EP ranks"
        source: "vllm/model_executor/layers/fused_moe/layer.py:258-266"
        if: "config['enable-eplb'] && vars.use_ep && vars.counts.value.global_num_experts % vars.par.value.ep_size != 0"
        then:
          - fail: {code: value-error, status: 0, message: "= 'EPLB currently only supports even distribution of experts across ranks. Got ' + string(vars.counts.value.global_num_experts) + ' experts and ' + string(vars.par.value.ep_size) + ' EP ranks.'"}
      - title: "Without EPLB, redundant experts are refused (a bare assert with a message)"
        source: "vllm/model_executor/layers/fused_moe/layer.py:267-270"
        if: "!config['enable-eplb'] && int(config['num-redundant-experts']) != 0"
        then:
          - fail: {code: assertion-error, status: 0, message: "Redundant experts are only supported with EPLB."}
      - set: {vars.strategy: "= config['expert-placement-strategy']", vars.place_warning: null}
      - title: "ExpertMapManager under EP: determine_expert_placement_strategy (Mixtral has no expert groups, so round_robin falls back to linear with a warning)"
        source: "vllm/model_executor/layers/fused_moe/expert_map_manager.py:219-227"
        if: "vars.use_ep"
        then:
          - call: expert-map-manager.determine-expert-placement-strategy
            input:
              expert_placement_strategy: "= config['expert-placement-strategy']"
              num_expert_group: null
              num_redundant_experts: "= int(config['num-redundant-experts'])"
              enable_eplb: "= config['enable-eplb']"
              use_all2all_kernels: "= has(vars.par.value.use_all2all_kernels) ? vars.par.value.use_all2all_kernels : false"
            as: place
          - set: {vars.strategy: "= vars.place.value.strategy", vars.place_warning: "= vars.place.value.warning"}
      - title: "Weights per rank: attention, embeddings and norms split by TP; expert weights by EP (whole experts) and the MoE TP size"
        source: "vllm/model_executor/models/mixtral.py:93-131"
        set:
          vars.bpw: "= input.quant == 'unquantized' ? 2 : 1"
          vars.expert_bytes: "= vars.hf.num_hidden_layers * vars.hf.num_local_experts * 3 * vars.hf.hidden_size * vars.hf.intermediate_size * (input.quant == 'unquantized' ? 2 : 1)"
      - set:
          vars.total_bytes: "= has(vars.hf.weights_bytes) ? vars.hf.weights_bytes : vars.expert_bytes"
      - set:
          vars.expert_bytes: "= vars.expert_bytes > vars.total_bytes ? vars.total_bytes : vars.expert_bytes"
      - set:
          vars.per_rank: "= (vars.total_bytes - vars.expert_bytes) / vars.tp + vars.expert_bytes / vars.hf.num_local_experts * (vars.counts.value.global_num_experts / vars.par.value.ep_size) / vars.par.value.tp_size"
      - title: MixtralMoE sizes the experts - physical = logical + redundant, local = physical / EP size
        source: "vllm/model_executor/models/mixtral.py:93-131"
        set:
          state.loaded: false
          state.tp_size: "= vars.tp"
          state.quant: "= input.quant"
          state.cfg:
            prepare_finalize: "= vars.pf.value.prepare_finalize"
            hidden_size: "= vars.hf.hidden_size"
            num_heads: "= vars.hf.num_attention_heads"
            num_kv_heads: "= vars.hf.num_key_value_heads"
            head_dim: "= vars.hf.hidden_size / vars.hf.num_attention_heads"
            intermediate_size: "= vars.hf.intermediate_size"
            num_layers: "= vars.hf.num_hidden_layers"
            vocab_size: "= vars.hf.vocab_size"
            num_experts: "= vars.hf.num_local_experts"
            top_k: "= vars.hf.num_experts_per_tok"
            bytes_per_weight: "= input.quant == 'unquantized' ? 2 : 1"
            ep_size: "= vars.par.value.ep_size"
            ep_rank: "= vars.par.value.ep_rank"
            moe_tp: "= vars.par.value.tp_size"
            enable_eplb: "= config['enable-eplb']"
            num_physical_experts: "= vars.counts.value.global_num_experts"
            num_redundant_experts: "= config['num-redundant-experts']"
            num_local_physical_experts: "= vars.counts.value.global_num_experts / vars.par.value.ep_size"
            expert_placement_strategy: "= vars.strategy"
            weights_bytes_per_rank: "= vars.per_rank"
            defer_moe_finalize_requests: []
          state.eplb_registered: false
      - return: {initialized: true, weights_bytes_per_rank: "= vars.per_rank", expert_placement_strategy: "= vars.strategy", placement_warning: "= vars.place_warning"}

  - component: mixtral-for-causal-lm
    name: load-weights
    kind: function
    summary: "MixtralForCausalLM.load_weights: AutoWeightsLoader; expert w1/w2/w3 tensors go to the FusedMoE weight loader of this rank's shard."
    sources: ["vllm/model_executor/models/mixtral.py:486-488"]
    tags: [writes]
    request: {type: object, properties: {model: {type: string}, weights_bytes: {type: integer}}}
    response: {type: object, properties: {weights_bytes_per_rank: {type: integer}}}
    behavior:
      - call: auto-weights-loader.load-weights
        input: {model: "= input.model", weights_bytes: "= input.weights_bytes"}
        as: awl
      - title: "This rank's shard: the TP split of the dense weights plus its local experts (computed at init)"
        set:
          vars.wb: "= has(state.cfg) && has(state.cfg.weights_bytes_per_rank) ? state.cfg.weights_bytes_per_rank : vars.awl.value.weights_bytes_per_rank"
      - set:
          state.loaded: true
          state.model: "= input.model"
          state.weights_bytes_per_rank: "= vars.wb"
      - return: {weights_bytes_per_rank: "= vars.wb"}

  - component: mixtral-for-causal-lm
    name: forward
    kind: function
    summary: "MixtralForCausalLM.forward: MixtralModel over the step's tokens."
    sources: ["vllm/model_executor/models/mixtral.py:467-477"]
    request: ModelsForwardRequest
    response: ModelsForwardResult
    errors:
      - {code: attribute-error, status: 0, retryable: false}
    behavior:
      - if: "!state.loaded"
        then:
          - fail: {code: attribute-error, status: 0, message: "model weights are not loaded on this rank"}
      - title: The attention metadata from the forward context
        source: "vllm/model_executor/layers/attention/attention.py:700-721"
        call: attention-layer.get-attention-context
        input: "= input"
        as: md
      - source: "vllm/model_executor/models/mixtral.py:474-477"
        call: mixtral-model.forward
        input: {num_tokens: "= input.num_tokens", cfg: "= state.cfg", tp: "= config['tensor-parallel-size']", quant: "= state.quant", attn_metadata: "= vars.md.value"}
        as: out
      - return: {num_tokens: "= input.num_tokens", hidden_size: "= state.cfg.hidden_size", num_layers: "= state.cfg.num_layers", owner_ms: "= vars.out.value.owner_ms"}

  - component: mixtral-for-causal-lm
    name: compute-logits
    kind: function
    summary: "MixtralForCausalLM.compute_logits: the logits processor applied with the LM head."
    sources: ["vllm/model_executor/models/mixtral.py:479-484"]
    request: ModelsLogitsRequest
    response: ModelsLogitsResult
    behavior:
      - call: logits-processor.forward
        input: {num_tokens: "= input.num_tokens", hidden_size: "= state.cfg.hidden_size", vocab_size: "= state.cfg.vocab_size", tp: "= config['tensor-parallel-size']"}
        as: lg
      - return: "= vars.lg.value"

  - component: mixtral-model
    name: forward
    kind: function
    summary: "MixtralModel.forward: embed, decoder layers, final norm."
    sources: ["vllm/model_executor/models/mixtral.py:344-368"]
    request: {type: object, required: [num_tokens, cfg, tp, quant], properties: {num_tokens: {type: integer}, cfg: {type: object}, tp: {type: integer}, quant: {type: string}}}
    behavior:
      - source: "vllm/model_executor/models/mixtral.py:351-355"
        call: vocab-parallel-embedding.forward
        input: {num_tokens: "= input.num_tokens", vocab_size: "= input.cfg.vocab_size", hidden_size: "= input.cfg.hidden_size", tp: "= input.tp"}
        as: emb
      - set: {vars.t0: "= now_us"}
      - title: Decoder layer 0 runs in full with real per-layer latencies
        source: "vllm/model_executor/models/mixtral.py:360-361"
        call: mixtral-decoder-layer.forward
        input: {num_tokens: "= input.num_tokens", cfg: "= input.cfg", tp: "= input.tp", quant: "= input.quant", layer_repeat: "= input.cfg.num_layers", attn_metadata: "= input.attn_metadata"}
        as: layer
      - title: "Layers 1..n-1 cost what layer 0 cost (same shapes) - (num_layers - 1) x layer 0's duration"
        wait: "= double(input.cfg.num_layers - 1) * double(now_us - vars.t0) / 1000.0"
      - source: "vllm/model_executor/models/mixtral.py:366"
        call: rms-norm.forward-cuda
        input: {num_tokens: "= input.num_tokens", hidden_size: "= input.cfg.hidden_size", residual: true, layer_repeat: 1}
      - return: {owner_ms: "= vars.emb.value.owner_ms + vars.layer.value.owner_ms * input.cfg.num_layers"}

  - component: mixtral-decoder-layer
    name: forward
    kind: function
    summary: "MixtralDecoderLayer.forward: norm, attention, fused add+norm, block_sparse_moe."
    sources: ["vllm/model_executor/models/mixtral.py:260-282"]
    request: ModelsLayerInput
    behavior:
      - source: "vllm/model_executor/models/mixtral.py:267-269"
        call: rms-norm.forward-cuda
        input: {num_tokens: "= input.num_tokens", hidden_size: "= input.cfg.hidden_size", residual: false, layer_repeat: "= input.layer_repeat"}
      - source: "vllm/model_executor/models/mixtral.py:272-275"
        call: mixtral-attention.forward
        input: "= input"
        as: attn
      - source: "vllm/model_executor/models/mixtral.py:278"
        call: rms-norm.forward-cuda
        input: {num_tokens: "= input.num_tokens", hidden_size: "= input.cfg.hidden_size", residual: true, layer_repeat: "= input.layer_repeat"}
      - source: "vllm/model_executor/models/mixtral.py:279"
        call: mixtral-moe.forward
        input: "= input"
        as: moe
      - return: {owner_ms: "= vars.attn.value.owner_ms + vars.moe.value.owner_ms"}

  - component: mixtral-attention
    name: forward
    kind: function
    summary: "MixtralAttention.forward: qkv_proj, rotary, attention, o_proj."
    sources: ["vllm/model_executor/models/mixtral.py:212-223"]
    request: ModelsLayerInput
    behavior:
      - set:
          vars.q_heads: "= input.cfg.num_heads / input.tp"
          vars.kv_heads: "= math.greatest(1, input.cfg.num_kv_heads / input.tp)"
      - source: "vllm/model_executor/models/mixtral.py:217"
        call: column-parallel-linear.forward
        input: {num_tokens: "= input.num_tokens", in_features: "= input.cfg.hidden_size", out_features: "= (vars.q_heads + 2 * vars.kv_heads) * input.cfg.head_dim", bytes_per_weight: "= input.cfg.bytes_per_weight", layer_repeat: "= input.layer_repeat", quant: "= input.quant", tp: "= input.tp", gather_output: false}
        as: qkv
      - source: "vllm/model_executor/models/mixtral.py:219"
        call: rotary-embedding.forward-cuda
        input: {num_tokens: "= input.num_tokens", num_heads: "= vars.q_heads", num_kv_heads: "= vars.kv_heads", head_size: "= input.cfg.head_dim"}
        as: rope
      - source: "vllm/model_executor/models/mixtral.py:220"
        call: attention-layer.forward
        input: {num_tokens: "= input.num_tokens", num_heads: "= vars.q_heads", num_kv_heads: "= vars.kv_heads", head_size: "= input.cfg.head_dim", attn_metadata: "= input.attn_metadata"}
        as: attn
      - source: "vllm/model_executor/models/mixtral.py:221"
        call: row-parallel-linear.forward
        input: {num_tokens: "= input.num_tokens", in_features: "= vars.q_heads * input.cfg.head_dim", out_features: "= input.cfg.hidden_size", bytes_per_weight: "= input.cfg.bytes_per_weight", layer_repeat: "= input.layer_repeat", quant: "= input.quant", tp: "= input.tp", reduce_results: true, collective_key: 1}
        as: o
      - return: {owner_ms: "= vars.qkv.value.owner_ms + vars.rope.value.owner_ms + vars.attn.value.owner_ms + vars.o.value.owner_ms"}

  - component: mixtral-moe
    name: forward
    kind: function
    summary: "MixtralMoE.forward: router logits from the gate, then the fused MoE layer on the flattened hidden states."
    sources: ["vllm/model_executor/models/mixtral.py:134-141"]
    request: ModelsLayerInput
    behavior:
      - title: router_logits = self.gate(hidden_states)
        source: "vllm/model_executor/models/mixtral.py:139"
        call: gate-linear.forward
        input: {num_tokens: "= input.num_tokens", hidden_size: "= input.cfg.hidden_size", num_experts: "= input.cfg.num_experts", layer_repeat: "= input.layer_repeat"}
      - title: self.experts(hidden_states, router_logits)
        source: "vllm/model_executor/models/mixtral.py:140"
        call: moe-runner.forward
        input:
          num_tokens: "= input.num_tokens"
          hidden_size: "= input.cfg.hidden_size"
          intermediate_size: "= input.cfg.intermediate_size"
          num_experts: "= input.cfg.num_experts"
          top_k: "= input.cfg.top_k"
          tp: "= input.tp"
          bytes_per_weight: "= input.cfg.bytes_per_weight"
          layer_repeat: "= input.layer_repeat"
          scoring_func: softmax
          shared_experts: false
          ep_size: "= has(input.cfg.ep_size) ? input.cfg.ep_size : 1"
          moe_tp: "= has(input.cfg.moe_tp) ? input.cfg.moe_tp : input.tp"
          num_physical_experts: "= has(input.cfg.num_physical_experts) ? input.cfg.num_physical_experts : input.cfg.num_experts"
          prepare_finalize: "= has(input.cfg.prepare_finalize) ? input.cfg.prepare_finalize : null"
        as: moe
      - return: {owner_ms: "= vars.moe.value.owner_ms"}

  # ---------------------------------------------------------------- MoE layer stack
  - component: gate-linear
    name: forward
    kind: kernel
    summary: "GateLinear.forward: cuteDSL low-latency BF16 GEMM, ROCm bf16x3, the fp32 router GEMM custom op, or the replicated F.linear fallback."
    sources: ["vllm/model_executor/layers/fused_moe/router/gate_linear.py:228-300"]
    request: {type: object, required: [num_tokens, hidden_size, num_experts], properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, num_experts: {type: integer}, layer_repeat: {type: integer}}}
    latency_ms: 0
    behavior:
      - title: Which router GEMM tier is enabled depends on the device and the router weight dtype
        source: "vllm/model_executor/layers/fused_moe/router/gate_linear.py:100-120"
        choice: tier
        default: replicated_linear
        options:
          fp32_router_gemm:
            - title: "Tier 2 - torch.ops.vllm.fp32_router_gemm_dispatch (M <= 32 model-specific shapes)"
              source: "vllm/model_executor/layers/fused_moe/router/gate_linear.py:264-271"
              set: {ctx.router_gemm: fp32_router_gemm_dispatch}
            - title: "Custom op registration fp32_router_gemm_dispatch"
              source: "vllm/model_executor/layers/fused_moe/router/gate_linear.py:430-434"
          ll_bf16:
            - title: "Tier 1 - cuteDSL ll_bf16_gemm for small BF16 batches (SM90+)"
              source: "vllm/model_executor/layers/fused_moe/router/gate_linear.py:231-241"
              set: {ctx.router_gemm: ll_bf16_gemm}
          replicated_linear:
            - title: "Tier 6 - ReplicatedLinear F.linear"
              source: "vllm/model_executor/layers/fused_moe/router/gate_linear.py:284-298"
              set: {ctx.router_gemm: replicated_linear}
      - return: {owner_ms: 0}

  - component: moe-runner
    name: forward
    kind: function
    summary: "MoERunner.forward: call the moe_forward (or moe_forward_shared) custom op, combine shared and routed outputs, and all-reduce when TP or EP > 1."
    sources: ["vllm/model_executor/layers/fused_moe/runner/moe_runner.py:688-797"]
    request: ModelsMoeInput
    response: {type: object, properties: {owner_ms: {type: integer}}}
    behavior:
      - title: _forward_entry is moe_forward_shared when the layer has shared experts
        source: "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:732-741"
        call: "= input.shared_experts ? 'moe-runner.moe-forward-shared' : 'moe-runner.moe-forward'"
        targets: [moe-runner.moe-forward, moe-runner.moe-forward-shared]
        input: "= input"
        as: entry
      - title: Add shared and routed outputs, then _maybe_reduce_final_output
        source: "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:483-517"
        if: "input.tp > 1"
        then:
          - title: tensor_model_parallel_all_reduce(states)
            source: "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:508-515"
            call: tensor-model-parallel.all-reduce
            input: {num_tokens: "= input.num_tokens", hidden_size: "= input.hidden_size", layer: 2}
            as: ar
          - return: {owner_ms: "= vars.entry.value.owner_ms + vars.ar.duration_ms"}
      - return: {owner_ms: "= vars.entry.value.owner_ms"}

  - component: moe-runner
    name: moe-forward
    kind: kernel
    summary: "torch.ops.vllm.moe_forward: opaque custom op that looks the layer up by name and runs _forward_impl (routing, experts)."
    sources: ["vllm/model_executor/layers/fused_moe/runner/moe_runner.py:117-134", "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:200-206"]
    request: ModelsMoeInput
    latency_ms: 0
    behavior:
      - source: "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:126-133"
        call: moe-runner.forward-impl
        input: "= input"
        as: impl
      - return: {owner_ms: "= vars.impl.value.owner_ms"}

  - component: moe-runner
    name: moe-forward-shared
    kind: kernel
    summary: "torch.ops.vllm.moe_forward_shared: the same op for layers with shared experts; returns (shared_out, fused_out)."
    sources: ["vllm/model_executor/layers/fused_moe/runner/moe_runner.py:154-171", "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:209-214"]
    request: ModelsMoeInput
    latency_ms: 0
    behavior:
      - source: "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:163-170"
        call: moe-runner.forward-impl
        input: "= input"
        as: impl
      - set: {ctx.moe_shared_experts_ran: true}
      - return: {owner_ms: "= vars.impl.value.owner_ms"}

  - component: moe-runner
    name: forward-impl
    kind: function
    summary: "MoERunner._forward_impl/_apply_quant_method: select experts with the router, then run the routed experts (shared experts first when present)."
    sources: ["vllm/model_executor/layers/fused_moe/runner/moe_runner.py:868-934", "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:598-651"]
    request: ModelsMoeInput
    behavior:
      - title: Modular kernel - router.select_experts first
        source: "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:627-633"
        call: fused-top-k-router.select-experts
        input: {num_tokens: "= input.num_tokens", num_experts: "= input.num_experts", top_k: "= input.top_k", scoring_func: "= input.scoring_func"}
        as: route
      - set: {vars.local_experts: "= input.num_experts"}
      - title: Under EP each rank holds only its local physical experts (expert_map, -1 elsewhere)
        source: "vllm/model_executor/layers/fused_moe/expert_map_manager.py:66-79"
        if: "has(input.ep_size) && input.ep_size > 1"
        then:
          - call: expert-map-manager.determine-expert-map
            input: {ep_size: "= input.ep_size", ep_rank: "= self == '' ? 0 : int(self.substring(4))", global_num_experts: "= input.num_physical_experts", expert_placement_strategy: linear}
            as: em
          - set: {vars.local_experts: "= vars.em.value.local_num_experts", ctx.moe_local_experts: "= vars.em.value.local_num_experts"}
      - title: routed_experts.forward_modular(topk_weights, topk_ids)
        source: "vllm/model_executor/layers/fused_moe/runner/moe_runner.py:635-641"
        call: routed-experts.forward-modular
        input: "= merge(input, {'num_experts': vars.local_experts})"
        as: experts
      - return: {owner_ms: "= vars.route.value.owner_ms + vars.experts.value.owner_ms"}

  - component: fused-top-k-router
    name: select-experts
    kind: function
    summary: "BaseRouter._select_experts with FusedTopKRouter._compute_routing: fused top-k over softmax or sigmoid scores; any other scoring function is refused."
    sources: ["vllm/model_executor/layers/fused_moe/router/base_router.py:260-300", "vllm/model_executor/layers/fused_moe/router/fused_topk_router.py:156-174"]
    request: {type: object, required: [num_tokens, num_experts, top_k, scoring_func], properties: {num_tokens: {type: integer}, num_experts: {type: integer}, top_k: {type: integer}, scoring_func: {type: string, examples: [softmax]}}}
    response: {type: object, properties: {owner_ms: {type: integer}, top_k: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: Unsupported scoring function
        source: "vllm/model_executor/layers/fused_moe/router/fused_topk_router.py:124-125"
        if: "!(input.scoring_func in ['softmax', 'sigmoid'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Unsupported scoring function: ' + input.scoring_func"}
      - title: fused_topk with softmax scoring - ops.topk_softmax
        source: "vllm/model_executor/layers/fused_moe/router/fused_topk_router.py:103-110"
        when: "input.scoring_func == 'softmax'"
        call: custom-ops.topk-softmax
        input: {num_tokens: "= input.num_tokens", num_experts: "= input.num_experts", topk: "= input.top_k", dtype_bytes: 4}
      - title: sigmoid scoring - ops.topk_sigmoid
        source: "vllm/model_executor/layers/fused_moe/router/fused_topk_router.py:112-119"
        when: "input.scoring_func == 'sigmoid'"
        call: custom-ops.topk-sigmoid
        input: {num_tokens: "= input.num_tokens", num_experts: "= input.num_experts", topk: "= input.top_k", dtype_bytes: 4}
      - title: _apply_eplb_mapping when the router holds an EPLB layer state (enable_eplb)
        source: "vllm/model_executor/layers/fused_moe/router/base_router.py:296-300"
        when: "has(state.eplb) && state.eplb != null"
        call: fused-top-k-router.eplb-map-to-physical-and-record
        input: {num_tokens: "= input.num_tokens", top_k: "= input.top_k", record: true}
      - return: {owner_ms: 0, top_k: "= input.top_k", eplb_mapped: "= has(state.eplb) && state.eplb != null"}

  - component: routed-experts
    name: forward-modular
    kind: function
    summary: "RoutedExperts.forward_modular: the quant method's modular kernel runs the experts with precomputed top-k (unquantized MoE on CUDA uses TritonExperts by default)."
    sources: ["vllm/model_executor/layers/fused_moe/routed_experts.py:1346-1381"]
    request: ModelsMoeInput
    behavior:
      - set: {vars.naive: "= has(input.prepare_finalize) && input.prepare_finalize == 'MoEPrepareAndFinalizeNaiveDPEP'"}
      - title: "FusedMoEKernel._prepare: MoEPrepareAndFinalizeNaiveDPEP.prepare dispatches the hidden states, topk weights and ids over the EP group (get_ep_group().dispatch)"
        source: "vllm/model_executor/layers/fused_moe/prepare_finalize/naive_dp_ep.py:181-187"
        if: "vars.naive"
        then:
          - title: "AgRsAll2AllManager sizes the gather from get_forward_context().dp_metadata.get_chunk_sizes_across_dp_rank()"
            source: "vllm/distributed/device_communicators/all2all.py:88-97"
            call: forward-context.get-forward-context
            as: fc
          - set: {vars.chunks: "= vars.fc.value.dp_metadata != null ? vars.fc.value.dp_metadata.num_tokens_across_dp_cpu : null"}
          - call: group-coordinator.dispatch
            input: {num_tokens: "= input.num_tokens", hidden_size: "= input.hidden_size", top_k: "= input.top_k", dp_chunk_sizes: "= vars.chunks"}
            as: d
          - set: {vars.rows: "= vars.d.value.num_tokens"}
        else:
          - set: {vars.rows: "= input.num_tokens"}
      - source: "vllm/model_executor/layers/fused_moe/routed_experts.py:1374-1381"
        call: triton-experts.apply
        input: "= merge(input, {'num_tokens': vars.rows})"
        as: ex
      - title: "FusedMoEKernel._finalize: MoEPrepareAndFinalizeNaiveDPEP.finalize combines the expert output back over the EP group (get_ep_group().combine_into_output, the in-place combine)"
        source: "vllm/model_executor/layers/fused_moe/prepare_finalize/naive_dp_ep.py:210-245"
        if: "vars.naive"
        then:
          - call: group-coordinator.combine
            input: {num_tokens: "= vars.rows", hidden_size: "= input.hidden_size", dp_chunk_sizes: "= vars.chunks"}
            as: c
          - return: {owner_ms: "= vars.ex.value.owner_ms + vars.d.duration_ms + vars.c.duration_ms", dispatched_tokens: "= vars.rows", combined_tokens: "= vars.c.value.num_tokens"}
      - return: {owner_ms: "= vars.ex.value.owner_ms"}

  - component: triton-experts
    name: apply
    kind: function
    summary: "TritonExperts.apply: assign tokens to experts (moe_align_block_size unless the batch is tiny), w13 GEMM, activation, w2 GEMM, then moe_sum over top-k."
    sources: ["vllm/model_executor/layers/fused_moe/experts/triton_moe.py:243-608"]
    request: ModelsMoeInput
    response: {type: object, properties: {owner_ms: {type: integer}}}
    behavior:
      - set: {vars.align_ms: 0, vars.n_shard: "= input.intermediate_size / (has(input.moe_tp) ? input.moe_tp : input.tp)"}
      - title: _prepare_expert_assignment - naive block assignment when num_tokens * top_k * 4 <= num_experts
        source: "vllm/model_executor/layers/fused_moe/fused_moe.py:1541-1587"
        if: "input.num_tokens * input.top_k * 4 > input.num_experts"
        then:
          - title: moe_align_block_size sorts token slots by expert, padded to BLOCK_SIZE_M
            source: "vllm/model_executor/layers/fused_moe/fused_moe.py:1581-1587"
            call: custom-ops.moe-align-block-size
            input: {num_tokens: "= input.num_tokens", num_experts: "= input.num_experts", topk: "= input.top_k"}
            as: al
          - set: {vars.align_ms: "= vars.al.duration_ms"}
      - title: w13 grouped GEMM
        source: "vllm/model_executor/layers/fused_moe/experts/triton_moe.py:415-432"
        call: fused-moe.invoke-fused-moe-triton-kernel
        input: {num_tokens: "= input.num_tokens", top_k: "= input.top_k", num_experts: "= input.num_experts", k: "= input.hidden_size", n: "= 2 * vars.n_shard", bytes_per_weight: "= input.bytes_per_weight", layer_repeat: "= input.layer_repeat"}
      - title: Activation (SiLU and mul, or SwiGLU with limit)
        source: "vllm/model_executor/layers/fused_moe/experts/triton_moe.py:518-530"
        call: fused-moe-activation.apply-moe-activation
        input: {activation: "= has(input.activation) ? input.activation : 'silu'", num_tokens: "= input.num_tokens * input.top_k", d: "= vars.n_shard", layer_repeat: "= input.layer_repeat"}
      - title: w2 grouped GEMM, multiplied by the routing weights
        source: "vllm/model_executor/layers/fused_moe/experts/triton_moe.py:536-560"
        call: fused-moe.invoke-fused-moe-triton-kernel
        input: {num_tokens: "= input.num_tokens", top_k: "= input.top_k", num_experts: "= input.num_experts", k: "= vars.n_shard", n: "= input.hidden_size", bytes_per_weight: "= input.bytes_per_weight", layer_repeat: "= input.layer_repeat"}
      - title: moe_sum reduces the top-k expert outputs per token
        source: "vllm/model_executor/layers/fused_moe/experts/triton_moe.py:610-622"
        call: custom-ops.moe-sum
        input: {num_tokens: "= input.num_tokens", topk: "= input.top_k", k: "= input.hidden_size", n: "= input.hidden_size", num_experts: "= input.num_experts", dtype_bytes: 2}
        as: ms
      - return: {owner_ms: "= vars.align_ms + vars.ms.duration_ms"}

  - component: fused-moe
    name: invoke-fused-moe-triton-kernel
    kind: kernel
    summary: "invoke_fused_moe_triton_kernel: launch fused_moe_kernel over (M blocks x N blocks); latency is the grouped GEMM roofline over the activated experts."
    sources: ["vllm/model_executor/layers/fused_moe/fused_moe.py:761-880"]
    request:
      type: object
      required: [num_tokens, top_k, num_experts, k, n, bytes_per_weight, layer_repeat]
      properties: {num_tokens: {type: integer}, top_k: {type: integer}, num_experts: {type: integer}, k: {type: integer}, n: {type: integer}, bytes_per_weight: {type: integer}, layer_repeat: {type: integer}}
    latency_ms: "{{MOE_LAT}}"
    behavior:
      - title: "Triton kernel fused_moe_kernel (grouped GEMM over sorted token ids)"
        source: "vllm/model_executor/layers/fused_moe/fused_moe.py:297-608"
      - title: "fused_moe_kernel[grid](...) launch"
        source: "vllm/model_executor/layers/fused_moe/fused_moe.py:864"
      - title: "Triton device function write_zeros_to_output (blocks of experts not on this rank)"
        source: "vllm/model_executor/layers/fused_moe/fused_moe.py:44-61"
      - title: "GPTQ/AWQ weights use fused_moe_kernel_gptq_awq, launched by invoke_fused_moe_wna16_triton_kernel"
        source: "vllm/model_executor/layers/fused_moe/fused_moe.py:64-294"
      - return: {owner_ms: 0}

  - component: fused-moe
    name: fused-experts
    kind: kernel
    summary: "torch.ops.vllm.fused_experts: the legacy all-in-one fused MoE op (align, w13, activation, w2, sum) used outside the modular kernel path."
    sources: ["vllm/model_executor/layers/fused_moe/fused_moe.py:1534-1538", "vllm/model_executor/layers/fused_moe/fused_moe.py:1451-1500"]
    request: ModelsMoeInput
    latency_ms: 0
    behavior:
      - call: fused-moe.invoke-fused-moe-triton-kernel
        input: {num_tokens: "= input.num_tokens", top_k: "= input.top_k", num_experts: "= input.num_experts", k: "= input.hidden_size", n: "= 2 * input.intermediate_size / input.tp", bytes_per_weight: "= input.bytes_per_weight", layer_repeat: "= input.layer_repeat"}
      - call: fused-moe-activation.apply-moe-activation
        input: {activation: silu, num_tokens: "= input.num_tokens * input.top_k", d: "= input.intermediate_size / input.tp", layer_repeat: "= input.layer_repeat"}
      - call: fused-moe.invoke-fused-moe-triton-kernel
        input: {num_tokens: "= input.num_tokens", top_k: "= input.top_k", num_experts: "= input.num_experts", k: "= input.intermediate_size / input.tp", n: "= input.hidden_size", bytes_per_weight: "= input.bytes_per_weight", layer_repeat: "= input.layer_repeat"}
      - title: "Zero experts (identity) use compute_identity_kernel, launched by zero_experts_compute_triton"
        source: "vllm/model_executor/layers/fused_moe/fused_moe.py:1014-1078"
      - return: {owner_ms: 0}

  - component: fused-moe-activation
    name: apply-moe-activation
    kind: kernel
    summary: "apply_moe_activation: dispatch on the activation; masked inputs, SiLU with a clamp limit, SwiGLU-step (Triton) and the csrc gated ops; unknown activations are refused."
    sources: ["vllm/model_executor/layers/fused_moe/activation.py:314-408"]
    request:
      type: object
      required: [activation, num_tokens, d]
      properties:
        activation: {type: string, examples: [silu]}
        num_tokens: {type: integer}
        d: {type: integer}
        masked: {type: boolean, default: false}
        clamp_limit: {type: [number, "null"], default: null}
        has_expert_map: {type: boolean, default: false}
        layer_repeat: {type: integer}
    latency_ms: "= double(input.num_tokens) * double(input.d) * 6.0 / (double(config['gpu-hbm-bandwidth-gbps']) * 1000000.0)"
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: not-implemented-error, status: 0, retryable: false}
    behavior:
      - title: valid_token_counts given - masked activation
        source: "vllm/model_executor/layers/fused_moe/activation.py:339-346"
        if: "has(input.masked) && input.masked"
        then:
          - call: fused-moe-activation.apply-moe-activation-masked
            input: {activation: "= input.activation"}
          - return: {activation: "= input.activation", masked: true}
      - title: SiLU with a clamp limit
        source: "vllm/model_executor/layers/fused_moe/activation.py:351-355"
        if: "input.activation == 'silu' && has(input.clamp_limit) && input.clamp_limit != null"
        then:
          - call: fused-moe-activation.silu-and-mul-with-clamp
            input: {clamp_limit: "= input.clamp_limit", has_expert_map: "= has(input.has_expert_map) && input.has_expert_map"}
          - return: {activation: silu_with_clamp}
      - title: SwiGLU-step - Triton swiglustep_and_mul
        source: "vllm/model_executor/layers/fused_moe/activation.py:388-391"
        if: "input.activation == 'swiglustep'"
        then:
          - call: layers-activation.swiglustep-and-mul-triton
            input: {num_tokens: "= input.num_tokens", d: "= input.d"}
          - return: {activation: swiglustep}
      - title: Gated csrc ops (silu_and_mul, gelu_and_mul, gelu_tanh_and_mul, situ_and_mul, swigluoai_and_mul) and the no-mul torch variants
        source: "vllm/model_executor/layers/fused_moe/activation.py:350-399"
        if: "input.activation in ['silu', 'gelu', 'gelu_tanh', 'situ', 'swigluoai', 'swigluoai_uninterleave', 'silu_no_mul', 'gelu_no_mul', 'gelu_tanh_no_mul', 'relu2_no_mul']"
        then:
          - return: {activation: "= input.activation"}
      - source: "vllm/model_executor/layers/fused_moe/activation.py:405-406"
        fail: {code: value-error, status: 0, message: "= 'Unsupported FusedMoe activation: ' + input.activation"}

  - component: fused-moe-activation
    name: apply-moe-activation-masked
    kind: kernel
    summary: "_apply_moe_activation_masked: per-expert valid-token masks for batched (DeepEP low-latency) layouts via torch.ops._C.masked_moe_activation."
    sources: ["vllm/model_executor/layers/fused_moe/activation.py:226-290"]
    request: {type: object, required: [activation], properties: {activation: {type: string, examples: [silu]}}}
    latency_ms: 0
    errors:
      - {code: not-implemented-error, status: 0, retryable: false}
    behavior:
      - title: Only activations with a masked kernel
        source: "vllm/model_executor/layers/fused_moe/activation.py:233-237"
        if: "!(input.activation in ['silu', 'gelu', 'situ', 'swigluoai', 'swigluoai_uninterleave', 'swiglustep'])"
        then:
          - fail: {code: not-implemented-error, status: 0, message: "= 'Masked MoE activation is not implemented for ' + input.activation"}
      - source: "vllm/model_executor/layers/fused_moe/activation.py:276-289"
