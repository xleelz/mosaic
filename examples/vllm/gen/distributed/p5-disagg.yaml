  - id: distributed-moriio-map-unmap-paths
    name: "Unmap clears both tables by exact id, falls back to the transfer id after the request id was mutated, and leaves other mappings alone on a miss"
    flow: distributed-moriio-unmap
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: moriio-connector-scheduler.map-request-id, caller: engine-core, as: m1, input: {request_id: cmpl-abc-0, transfer_id: tid-42}}
      - {flow: distributed-moriio-unmap, as: viatid, input: {request_id: cmpl-abc-0-956053a4, transfer_id: tid-42}}
      - {interface: moriio-connector-scheduler.map-request-id, caller: engine-core, as: m2, input: {request_id: rid-1, transfer_id: tid-1}}
      - {flow: distributed-moriio-unmap, as: miss1, input: {request_id: rid-unknown, transfer_id: {$null: true}}}
      - {flow: distributed-moriio-unmap, as: miss2, input: {request_id: rid-unknown, transfer_id: tid-unknown}}
      - {flow: distributed-moriio-unmap, as: exact, input: {request_id: rid-1, transfer_id: {$null: true}}}
    expect:
      - "steps.viatid.result.value.unmapped == 'transfer-id' && steps.miss1.result.value.unmapped == 'miss' && steps.miss2.result.value.unmapped == 'miss' && steps.exact.result.value.unmapped == 'exact'"
      - "size(state['moriio-connector-scheduler'].request_id_to_transfer_id) == 0 && size(state['moriio-connector-scheduler'].transfer_id_to_request_id) == 0"

