    expect:
      - "!result.ok && result.error.code == 'file-not-found-error'"
  - id: distributed-example-load-no-attn-metadata
    flow: distributed-kv-load
    fixtures: [tp1-llama-8b]
    config: {kv-connector: ExampleConnector}
    input: {has_attn_metadata: false, metadata: {requests: [{req_id: chatcmpl-e, key: "9-9-9", num_tokens: 5, is_store: false}]}}
    expect:
      - "result.ok && result.value.loaded == 0"
  # ---- NIXL pull scheduler
  - id: distributed-nixl-decode-remote-prefill
    name: A decode node pulls all prompt tokens of a remotely prefilled request, then queues the pull once
    flow: distributed-kv-match
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector, kv-role: kv_consumer}
    steps:
      - {flow: distributed-kv-match, as: m, input: {request_id: chatcmpl-n1, num_prompt_tokens: 100, num_computed_tokens: 0, kv_transfer_params: {do_remote_prefill: true, do_remote_decode: false, remote_block_ids: [3, 4, 5, 6, 7, 8, 9], remote_engine_id: engine-p0, remote_request_id: chatcmpl-n1-p, remote_host: "10.0.0.1", remote_port: 5600}}}
      - {flow: distributed-kv-alloc, as: a, input: {request_id: chatcmpl-n1, num_external_tokens: 100, block_ids: [[11, 12, 13, 14, 15, 16, 17]], kv_transfer_params: {do_remote_prefill: true, do_remote_decode: false, remote_block_ids: [3, 4, 5, 6, 7, 8, 9], remote_engine_id: engine-p0, remote_request_id: chatcmpl-n1-p, remote_host: "10.0.0.1", remote_port: 5600}}}
      - {flow: distributed-kv-match, as: m2, input: {request_id: chatcmpl-n1, num_prompt_tokens: 100, num_computed_tokens: 0, kv_transfer_params: "= steps.a.result.value.kv_transfer_params"}}
    expect:
      - "steps.m.result.value.num_external_tokens == 100 && steps.m.result.value.load_async"
      - "steps.a.result.value.recorded && !steps.a.result.value.kv_transfer_params.do_remote_prefill"
      - "state['nixl-pull-connector-scheduler'].reqs_need_recv['chatcmpl-n1'].park"
      - "steps.m2.result.value.num_external_tokens == 0"
  - id: distributed-nixl-decode-backoff
    name: With a prefill backoff of 1 (Mamba), the decoder recomputes the last prompt token
    flow: distributed-kv-match
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    state:
      nixl-pull-connector-scheduler: {prefill_backoff: 1}
    input: {request_id: chatcmpl-n2, num_prompt_tokens: 100, num_computed_tokens: 0, kv_transfer_params: {do_remote_prefill: true}}
    expect:
      - "result.ok && result.value.num_external_tokens == 99"
  - id: distributed-nixl-prefill-partial-hit-pulled
    flow: distributed-kv-match
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n3, num_prompt_tokens: 512, num_computed_tokens: 128, kv_transfer_params: {do_remote_decode: true, remote_block_ids: [1, 2], remote_engine_id: engine-d0, remote_request_id: chatcmpl-n3-d, remote_host: "10.0.0.2", remote_port: 5601, remote_num_tokens: 400}}
    expect:
      - "result.ok && result.value.num_external_tokens == 272 && result.value.load_async"
  - id: distributed-nixl-prefill-partial-hit-below-threshold
    flow: distributed-kv-match
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n4, num_prompt_tokens: 512, num_computed_tokens: 128, kv_transfer_params: {do_remote_decode: true, remote_block_ids: [1, 2], remote_engine_id: engine-d0, remote_request_id: chatcmpl-n4-d, remote_host: "10.0.0.2", remote_port: 5601, remote_num_tokens: 160}}
    expect:
      - "result.ok && result.value.num_external_tokens == 0 && !result.value.load_async"
  - id: distributed-nixl-no-params
    flow: distributed-kv-match
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n5, num_prompt_tokens: 64, kv_transfer_params: null}
    expect:
      - "result.ok && result.value.num_external_tokens == 0"
  - id: distributed-nixl-alloc-invalid-params
    name: Remote blocks without the peer address are ignored with a warning
    flow: distributed-kv-alloc
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n6, num_external_tokens: 32, kv_transfer_params: {do_remote_prefill: true, remote_block_ids: [1, 2]}}
    expect:
      - "result.ok && !result.value.recorded && !result.value.kv_transfer_params.do_remote_prefill"
      - "size(state['nixl-pull-connector-scheduler'].reqs_need_recv) == 0"
  - id: distributed-nixl-alloc-no-blocks-with-tokens
    flow: distributed-kv-alloc
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n7, num_external_tokens: 32, kv_transfer_params: {do_remote_prefill: true, remote_block_ids: []}}
    expect:
      - "!result.ok && result.error.code == 'assertion-error'"
  - id: distributed-nixl-alloc-full-local-hit
    name: A full local prefix hit still records an empty pull to free the prefill node's blocks
    flow: distributed-kv-alloc
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n8, num_external_tokens: 0, kv_transfer_params: {do_remote_prefill: true, remote_block_ids: [3], remote_engine_id: engine-p0, remote_request_id: chatcmpl-n8-p, remote_host: "10.0.0.1", remote_port: 5600}}
    expect:
      - "result.ok && result.value.recorded && !state['nixl-pull-connector-scheduler'].reqs_need_recv['chatcmpl-n8'].park"
  - id: distributed-nixl-alloc-prefill-node
    flow: distributed-kv-alloc
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n9, kv_transfer_params: {do_remote_decode: true}}
    expect:
      - "result.ok && !result.value.recorded && 'chatcmpl-n9' in state['nixl-pull-connector-scheduler'].reqs_in_batch"
  - id: distributed-nixl-alloc-host-buffer
    flow: distributed-kv-alloc
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    state:
      nixl-pull-connector-scheduler: {use_host_buffer: true}
    input: {request_id: chatcmpl-n10, kv_transfer_params: {do_remote_decode: true}}
    expect:
      - "result.ok && result.value.recorded && 'chatcmpl-n10' in state['nixl-pull-connector-scheduler'].reqs_need_save"
  - id: distributed-nixl-alloc-no-params
    flow: distributed-kv-alloc
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-n11, kv_transfer_params: null}
    expect:
      - "result.ok && !result.value.recorded"
      - "size(state['nixl-pull-connector-scheduler'].reqs_need_recv) == 0"
  - id: distributed-nixl-prefill-finished-delays-free
    name: A prefill node keeps finished blocks for the lease and returns the decoder's pull parameters
    flow: distributed-kv-finished
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector, kv-role: kv_producer}
    input: {request_id: chatcmpl-p1, status: FINISHED_LENGTH_CAPPED, num_computed_tokens: 96, block_ids: [[1, 2, 3, 4, 5, 6]], kv_transfer_params: {do_remote_decode: true}}
    expect:
      - "result.ok && result.value.delay_free_blocks"
      - "result.value.kv_transfer_params.do_remote_prefill && result.value.kv_transfer_params.remote_block_ids == [[1, 2, 3, 4, 5, 6]] && result.value.kv_transfer_params.remote_num_tokens == 96"
      - "'chatcmpl-p1' in state['nixl-pull-connector-scheduler'].reqs_need_send"
  - id: distributed-nixl-finished-then-resubmit
    name: A prefill request's lease is recorded at finish; a second finish of an aborted copy frees at once
    flow: distributed-kv-finished
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector, kv-role: kv_producer}
    steps:
      - {flow: distributed-kv-finished, as: f, input: {request_id: chatcmpl-p9, status: FINISHED_STOPPED, num_computed_tokens: 32, block_ids: [[1, 2]], kv_transfer_params: {do_remote_decode: true}}}
      - {flow: distributed-kv-match, as: m, input: {request_id: chatcmpl-p9-d, num_prompt_tokens: 32, num_computed_tokens: 0, kv_transfer_params: "= merge(steps.f.result.value.kv_transfer_params, {'do_remote_prefill': true})"}}
    expect:
      - "steps.f.result.value.delay_free_blocks && 'chatcmpl-p9' in state['nixl-pull-connector-scheduler'].reqs_need_send"
      - "steps.m.result.value.num_external_tokens == 32 && steps.m.result.value.load_async"
  - id: distributed-nixl-prefill-aborted
    flow: distributed-kv-finished
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-p2, status: FINISHED_ABORTED, block_ids: [[1, 2]], kv_transfer_params: {do_remote_decode: true}}
    expect:
      - "result.ok && !result.value.delay_free_blocks && 'chatcmpl-p2' in state['nixl-pull-connector-scheduler'].reqs_not_processed"
  - id: distributed-nixl-decode-aborted-before-scheduled
    flow: distributed-kv-finished
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-d1, status: FINISHED_ABORTED, kv_transfer_params: {do_remote_prefill: true, remote_engine_id: engine-p0}}
    expect:
      - "result.ok && !result.value.delay_free_blocks && 'chatcmpl-d1' in state['nixl-pull-connector-scheduler'].reqs_need_recv"
  - id: distributed-nixl-decode-finished-normal
    flow: distributed-kv-finished
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-d2, status: FINISHED_STOPPED, kv_transfer_params: {do_remote_prefill: false, do_remote_decode: false}}
    expect:
      - "result.ok && !result.value.delay_free_blocks && result.value.kv_transfer_params == null"
      - "size(state['nixl-pull-connector-scheduler'].reqs_not_processed) == 0"
  - id: distributed-nixl-finished-no-params
    flow: distributed-kv-finished
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    input: {request_id: chatcmpl-d3, kv_transfer_params: null}
    expect:
      - "result.ok && !result.value.delay_free_blocks"
      - "size(state['nixl-pull-connector-scheduler'].reqs_need_send) == 0"
  - id: distributed-nixl-bidirectional-decode-pins-blocks
    flow: distributed-kv-finished
    fixtures: [tp1-llama-8b]
    config: {kv-connector: NixlConnector}
    state:
      nixl-pull-connector-scheduler: {is_bidirectional: true}
    input: {request_id: chatcmpl-d4, status: FINISHED_STOPPED, block_ids: [[]], kv_transfer_params: {do_remote_prefill: false}}
    expect:
      - "result.ok && !result.value.delay_free_blocks && result.value.kv_transfer_params.do_remote_decode"
  # ---- NIXL handshake listener
      - "size(state['nixl-pull-connector-scheduler'].reqs_need_send) == 0"
  - id: distributed-nixl-handshake-serves-metadata
    name: After the metadata is set, the listener answers a decoder's GET_META for (0, 0)
    flow: distributed-nixl-handshake-listener
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: distributed-nixl-handshake-metadata, as: set}
      - {interface: nixl-pull-connector-scheduler.nixl-handshake-listener, caller: engine-core, as: serve}
    state:
      nixl-pull-connector-scheduler: {handshake_inbox: [{msg: get_meta_msg, pp_rank: 0, tp_rank: 0}, {msg: hello, pp_rank: 0, tp_rank: 0}]}
    expect:
      - "steps.set.result.value.listener_started"
      - "size(state['nixl-pull-connector-scheduler'].handshake_replies) == 1 && state['nixl-pull-connector-scheduler'].handshake_replies[0].meta == 'agent-rank0'"
  - id: distributed-nixl-handshake-loop
    name: Three passes serve two messages (one unexpected but still answered), then time out idle
    flow: distributed-nixl-handshake-listener
    fixtures: [tp1-llama-8b]
    state:
      nixl-pull-connector-scheduler: {listener_started: true, encoded_data: {"0,0": agent-rank0}, handshake_inbox: [{msg: get_meta_msg, pp_rank: 0, tp_rank: 0}, {msg: hello, pp_rank: 0, tp_rank: 0}]}
    expect:
      - "passes[0].result.value.served == '0,0' && passes[1].result.value.served == '0,0' && passes[2].result.value.served == null"
      - "size(state['nixl-pull-connector-scheduler'].handshake_replies) == 2"
  - id: distributed-nixl-handshake-unknown-rank
    flow: distributed-nixl-handshake-listener
    fixtures: [tp1-llama-8b]
    state:
      nixl-pull-connector-scheduler: {listener_started: true, encoded_data: {"0,0": agent-rank0}, handshake_inbox: [{msg: get_meta_msg, pp_rank: 0, tp_rank: 3}]}
    expect:
      - "!passes[0].result.ok && passes[0].result.error.code == 'key-error' && size(state['nixl-pull-connector-scheduler'].handshake_replies) == 0"
  - id: distributed-nixl-handshake-stop
    flow: distributed-nixl-handshake-listener
    fixtures: [tp1-llama-8b]
    state:
      nixl-pull-connector-scheduler: {listener_stop: true}
    expect:
      - "result.ok && result.value.stopped"
      - "size(state['nixl-pull-connector-scheduler'].handshake_replies) == 0"
  - id: distributed-nixl-handshake-bad-payload
    flow: distributed-nixl-handshake-metadata
    fixtures: [tp1-llama-8b]
    input: {metadata: [{pp_rank: 0, tp_rank: 0, agent_metadata: agent-rank0, payload_type: MooncakeHandshakePayload}]}
    expect:
      - "!result.ok && result.error.code == 'value-error' && !state['nixl-pull-connector-scheduler'].listener_started"
  # ---- NIXL push writer
  - id: distributed-nixl-push-pairs-blocks-with-registration
    name: Finished blocks wait for the decoder's PUSH_REG, then the WRITE starts on the next wake-up
    flow: distributed-nixl-push-writer
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: nixl-push-connector-worker.push-writer-loop, caller: gpu-worker, as: first}
      - {interface: nixl-push-connector-worker.push-writer-loop, caller: gpu-worker, as: second}
    state:
      nixl-push-connector-worker: {finished_blocks_inbox: [{request_id: chatcmpl-w1, blocks: [1, 2, 3]}], reg_send_inbox: [{request_id: chatcmpl-w9}], notifs: [{kind: PUSH_REG, request_id: chatcmpl-w2}, {kind: DONE, request_id: chatcmpl-w0}]}
    expect:
      - "steps.first.result.value.pushed == 0 && steps.first.result.value.self_poll"
      - "'chatcmpl-w2' in state['nixl-push-connector-worker@rank0'].pending_d_registrations && 'chatcmpl-w9' in state['nixl-push-connector-worker@rank0'].sent_registrations"
  - id: distributed-nixl-push-two-wakeups
    flow: distributed-nixl-push-writer
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker: {finished_blocks_inbox: [{request_id: chatcmpl-w7, blocks: [1]}]}
    steps:
      - {flow: distributed-nixl-push-writer, as: a}
      - {interface: nixl-push-connector-worker.push-writer-loop, caller: gpu-worker, as: b}
    expect:
      - "steps.a.result.value.parked == 1 && steps.b.result.value.parked == 1 && 'chatcmpl-w7' in state['nixl-push-connector-worker@rank0'].push_finished_blocks"
  - id: distributed-nixl-push-registration-matches-parked
    flow: distributed-nixl-push-writer
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker: {push_finished_blocks: {chatcmpl-w3: [4, 5]}, notifs: [{kind: PUSH_REG, request_id: chatcmpl-w3}]}
    expect:
      - "passes[0].result.value.pushed == 1 && !passes[0].result.value.self_poll"
      - "state['nixl-push-connector-worker@rank0'].pushed == ['chatcmpl-w3'] && calls['nixl-agent.write-blocks'] == 1"
  - id: distributed-nixl-push-blocks-match-pending
    flow: distributed-nixl-push-writer
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker: {pending_d_registrations: {chatcmpl-w4: {registered_at: 0}}, finished_blocks_inbox: [{request_id: chatcmpl-w4, blocks: [7]}], evict_inbox: [chatcmpl-w5]}
    expect:
      - "passes[0].result.value.pushed == 1 && size(state['nixl-push-connector-worker@rank0'].pending_d_registrations) == 0"
  - id: distributed-nixl-push-stopped
    flow: distributed-nixl-push-writer
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker: {stop: true, finished_blocks_inbox: [{request_id: chatcmpl-w6, blocks: [1]}]}
    expect:
      - "result.ok && result.value.pushed == 0"
