    summary: "torch.ops.vllm.all_gather: look the group up by name and run its out-of-place all-gather along dim."
    sources: ["vllm/distributed/parallel_state.py:410-414", "vllm/distributed/parallel_state.py:228-235", "vllm/distributed/parallel_state.py:768-771"]
    request:
      type: object
      required: [group_name, num_tokens]
