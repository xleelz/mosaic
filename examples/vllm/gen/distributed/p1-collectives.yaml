# distributed area, part 1: parallel state, tensor-parallel collectives, the custom all-reduce.
# Merged into fragments/distributed.yaml by gen/distributed/build.py.
schema_version: 1
id: vllm

configs:
  - id: tensor-parallel-size
    type: integer
    value: 1
    default: 1
    summary: "tensor_parallel_size: GPUs per tensor-parallel group; the TP group is rank0..rank{n-1} (deployed = default in tp1 fixtures; tp4-llama-70b deploys 4)"
    sources: ["vllm/config/parallel.py:141", "vllm/engine/arg_utils.py:530"]
    attributes: {key: tensor_parallel_size}
  - id: vllm-allreduce-use-flashinfer
    type: boolean
    value: true
    default: true
    summary: "VLLM_ALLREDUCE_USE_FLASHINFER (env, default 1): the TP CudaCommunicator builds a FlashInferAllReduce and tries it first"
    sources: ["vllm/envs.py:1970-1972", "vllm/distributed/device_communicators/cuda_communicator.py:69-71"]
    attributes: {key: VLLM_ALLREDUCE_USE_FLASHINFER}
  - id: vllm-allreduce-use-symm-mem
    type: boolean
    value: true
    default: true
    summary: "VLLM_ALLREDUCE_USE_SYMM_MEM (env, default 1): the TP CudaCommunicator builds a torch SymmMemCommunicator"
    sources: ["vllm/envs.py:1966-1968", "vllm/distributed/device_communicators/cuda_communicator.py:67"]
    attributes: {key: VLLM_ALLREDUCE_USE_SYMM_MEM}
  - id: vllm-use-nccl-symm-mem
    type: boolean
    value: false
    default: false
    summary: "VLLM_USE_NCCL_SYMM_MEM (env, default 0): enables the NCCL symmetric-memory all-reduce op"
    sources: ["vllm/envs.py:2099-2101", "vllm/distributed/device_communicators/pynccl_allocator.py:49-51"]
    attributes: {key: VLLM_USE_NCCL_SYMM_MEM}
  - id: vllm-custom-allreduce-algo
    type: string
    value: ""
    default: ""
    summary: "VLLM_CUSTOM_ALLREDUCE_ALGO (read by getenv in C++): 1stage|oneshot|2stage|twoshot forces the kernel; empty picks by size"
    sources: ["csrc/custom_all_reduce.cuh:271-286"]
    attributes: {key: VLLM_CUSTOM_ALLREDUCE_ALGO}
  - id: vllm-skip-p2p-check
    type: boolean
    value: true
    default: true
    summary: "VLLM_SKIP_P2P_CHECK: the env lambda defaults to '1' (true) although the typed stub says False; true trusts the driver's P2P report instead of the subprocess probe"
    sources: ["vllm/envs.py:1216", "vllm/envs.py:129"]
    attributes: {key: VLLM_SKIP_P2P_CHECK}
  - id: distributed-timeout-seconds
    type: integer
    value: null
    default: null
    summary: "distributed_timeout_seconds: process-group timeout; None means torch's default_pg_timeout (600 s for NCCL), which bounds how long ranks wait in a collective (reference; the worker passes it to init_distributed_environment)"
    sources: ["vllm/config/parallel.py:360-364", "vllm/distributed/parallel_state.py:1879-1895"]
    attributes: {key: distributed_timeout_seconds, boundary: true, owner: worker-runner}
  # Latency coefficients. The code gives no numbers; these are labeled assumptions for an
  # H100-class NVLink node (see notes/distributed.md, "Config").
  - {id: dist-nvlink-bus-gbps, type: number, value: 300, default: 300, summary: "ASSUMPTION: effective intra-node NVLink bus bandwidth in GB/s used by collective latency expressions", sources: ["vllm/distributed/device_communicators/all_reduce_utils.py:31-37"], attributes: {assumption: true}}
  - {id: dist-custom-ar-base-us, type: number, value: 6, default: 6, summary: "ASSUMPTION: fixed launch+barrier cost of a custom all-reduce kernel, microseconds", sources: ["csrc/custom_all_reduce.cuh:288-308"], attributes: {assumption: true}}
  - {id: dist-flashinfer-ar-base-us, type: number, value: 5, default: 5, summary: "ASSUMPTION: fixed cost of a FlashInfer one-shot all-reduce, microseconds", sources: ["vllm/distributed/device_communicators/flashinfer_all_reduce.py:522"], attributes: {assumption: true}}
  - {id: dist-symm-mem-base-us, type: number, value: 8, default: 8, summary: "ASSUMPTION: fixed cost of a torch symmetric-memory all-reduce, microseconds", sources: ["vllm/distributed/device_communicators/symm_mem.py:127"], attributes: {assumption: true}}
  - {id: dist-nccl-base-us, type: number, value: 15, default: 15, summary: "ASSUMPTION: fixed cost of an NCCL ring collective, microseconds", sources: ["vllm/distributed/device_communicators/pynccl.py:268"], attributes: {assumption: true}}

schemas:
  - id: DistCollectiveRequest
    summary: "A tensor handed to a collective, described by its shape: num_tokens x hidden_size of dtype. num_collectives lets a caller stand for several identical collectives (for example 2 per decoder layer) so millisecond rounding does not inflate the step."
    schema:
      type: object
      required: [num_tokens]
      properties:
        num_tokens: {type: integer, minimum: 1, examples: [128]}
        hidden_size: {type: integer, default: 4096}
        dtype: {type: string, enum: [bfloat16, float16, float32, int32], default: bfloat16}
        dim: {type: integer, default: -1}
        num_collectives: {type: integer, minimum: 1, default: 1}
        layer: {type: integer, default: 0}
  - id: DistCollectiveResult
    schema:
      type: object
      properties:
        backend: {type: string, examples: [custom-allreduce]}
        algorithm: {type: string}
        bytes: {type: integer}
        world_size: {type: integer}
        num_tokens: {type: integer}
        hidden_size: {type: integer}
  - id: DistTpGroup
    schema:
      type: object
      properties:
        world_size: {type: integer, examples: [1]}
        ranks: {type: array, items: {type: string}, examples: [[rank0]]}
        rank_in_group: {type: integer, examples: [0]}
        unique_name: {type: string, examples: ["tp:0"]}
  - id: DistKernelLaunch
    summary: "What a collective kernel needs for its latency: the bytes this rank contributes, the group size, and how many identical launches the call stands for."
    schema:
      type: object
      required: [bytes, world_size]
      properties:
        bytes: {type: integer, examples: [1048576]}
        world_size: {type: integer, examples: [4]}
        num_collectives: {type: integer, default: 1}
        algorithm: {type: string}

components:
  - id: parallel-state
    name: parallel_state (module)
    kind: module
    layer: distributed
    parent: gpu-worker
    summary: "Module-level process-group registry of one worker process: the world group, the TP/PP/DP/EP/DCP/PCP GroupCoordinators and the torch custom ops vllm::all_reduce/all_gather/reduce_scatter that look groups up by name."
    sources: ["vllm/distributed/parallel_state.py:1487-1490", "vllm/distributed/parallel_state.py:1585-1590"]
    state:
      schema:
        type: object
        properties:
          world_initialized: {type: boolean}
          mp_initialized: {type: boolean}
          world_size: {type: integer}
          backend: {type: string}
          custom_all_reduce_enabled: {type: boolean}
          groups: {type: object}
          destroyed_groups: {type: array, items: {type: string}}
      # The default world is a worker after startup: Worker.init_device already ran
      # init_worker_distributed_environment, so the groups exist and follow the deployed
      # config (tensor-parallel-size). Scenarios of a fresh process override the flags.
      initial: {world_initialized: true, mp_initialized: true, world_size: 0, backend: nccl, custom_all_reduce_enabled: true, groups: {pp: {world_size: 1, unique_name: "pp:0"}, dp: {world_size: 1, unique_name: "dp:0"}}, destroyed_groups: []}
  - id: tensor-model-parallel
    name: communication_op (tensor_model_parallel_* helpers)
    kind: module
    layer: distributed
    parent: gpu-worker
    summary: "The helpers model code calls (tensor_model_parallel_all_reduce/all_gather/reduce_scatter): each fetches the TP GroupCoordinator and delegates to it."
    sources: ["vllm/distributed/communication_op.py:12-28"]
  - id: group-coordinator
    name: GroupCoordinator
    kind: module
    layer: distributed
    parent: parallel-state
    summary: "Wrapper over one process group: bypasses collectives at world size 1, otherwise routes through the torch custom op (CUDA uses custom-op calls) to the device communicator."
    sources: ["vllm/distributed/parallel_state.py:426-454", "vllm/distributed/parallel_state.py:570-572"]
  - id: cuda-communicator
    name: CudaCommunicator
    kind: module
    layer: distributed
    parent: group-coordinator
    summary: "The CUDA device communicator of a group: picks the all-reduce backend per call (FlashInfer, NCCL symmetric memory, custom all-reduce, torch symmetric memory, PyNccl) and drives the collective on every rank of the group."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:35-60"]
    state:
      schema:
        type: object
        properties:
          device_capability: {type: string}
          flashinfer_available: {type: boolean}
          platform: {type: string}
          fi_ar_max_mb: {type: object}
          symm_mem_max_mb: {type: object}
          nccl_symm_custom_ar_range_kb: {type: object}
      # ASSUMPTION: an H100 (sm 9.0) CUDA node with flashinfer-python installed (requirements/cuda.txt).
      initial:
        device_capability: "9.0"
        flashinfer_available: true
        platform: cuda
        fi_ar_max_mb: {"2": 64, "4": 2, "8": 0.5}
        symm_mem_max_mb: {"2": 64, "4": 32, "6": 64, "8": 64}
        nccl_symm_custom_ar_range_kb: {"4": [16, 512], "8": [16, 128]}
  - id: flashinfer-all-reduce
    name: FlashInferAllReduce
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "FlashInfer one-shot all-reduce (mnnvl backend on a single NVSwitch node); used for 2-D tensors up to a per-world-size workspace limit."
    sources: ["vllm/distributed/device_communicators/flashinfer_all_reduce.py:394-449"]
  - id: symm-mem-communicator
    name: SymmMemCommunicator
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "torch symmetric-memory all-reduce, used for bf16 tensors up to SYMM_MEM_ALL_REDUCE_MAX_SIZES[capability][world_size]."
    sources: ["vllm/distributed/device_communicators/symm_mem.py:25-115"]
  - id: pynccl
    name: pynccl (module)
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "PyNccl module: registers the vllm::all_reduce_symmetric_with_copy op when NCCL symmetric memory is enabled."
    sources: ["vllm/distributed/device_communicators/pynccl.py:62-88"]
  - id: pynccl-communicator
    name: PyNcclCommunicator
    kind: module
    layer: distributed
    parent: pynccl
    summary: "ctypes NCCL communicator of a group: ncclAllReduce / ncclAllGather / ncclReduceScatter on the current stream; returns None when disabled."
    sources: ["vllm/distributed/device_communicators/pynccl.py:91-141"]
    state:
      schema: {type: object, properties: {disabled: {type: boolean}}}
      initial: {disabled: false}
  - id: torch-distributed
    name: torch.distributed (device group)
    kind: external
    layer: distributed
    parent: cuda-communicator
    summary: "PyTorch's own process-group collective, the fallback when PyNccl is missing or disabled."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:430-434"]
  - id: custom-allreduce
    name: CustomAllreduce (Python)
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "vLLM's custom one-/two-shot all-reduce over CUDA IPC buffers for TP groups of 2/4/6/8 GPUs on one fully connected node; also custom all-gather and reduce-scatter."
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:120-137", "vllm/distributed/device_communicators/custom_all_reduce.py:293-330"]
    state:
      schema:
        type: object
        properties:
          disabled: {type: boolean}
          disabled_reason: {type: string}
          fully_connected: {type: boolean}
          same_node: {type: boolean}
          mnnvl_multicast: {type: boolean}
          mnnvl_only: {type: boolean}
          batch_invariant: {type: boolean}
          max_size: {type: integer}
          max_all_gather_size: {type: integer}
          max_reduce_scatter_size: {type: integer}
          max_mnnvl_reduce_scatter_size: {type: integer}
          max_mnnvl_multimem_reduce_scatter_size: {type: integer}
          mnnvl_multimem_rs_supported: {type: boolean}
          capturing: {type: boolean}
      # After a successful init on an NVLink (fully connected) H100 node: max_size is
      # min(CUSTOM_ALL_REDUCE_MAX_SIZES['9.0'][ws], 8 MiB) = 8 MiB for 2 and 4 GPUs.
      initial: {disabled: false, disabled_reason: "", fully_connected: true, same_node: true, mnnvl_multicast: false, mnnvl_only: false, batch_invariant: false, max_size: 8388608, max_all_gather_size: 2097152, max_reduce_scatter_size: 16777216, max_mnnvl_reduce_scatter_size: 16777216, max_mnnvl_multimem_reduce_scatter_size: 67108864, mnnvl_multimem_rs_supported: false, capturing: false}
  - id: custom-allreduce-cuda
    name: CustomAllreduce (C++)
    kind: module
    layer: kernels
    parent: custom-allreduce
    summary: "The C++ vllm::CustomAllreduce object behind the _C_custom_ar ops: checks sizes and registration, then launches the one-stage or two-stage cross-device reduce kernel."
    sources: ["csrc/custom_all_reduce.cuh:80-130", "csrc/custom_all_reduce.cu:70-116"]
  - id: custom-all-gather-reduce-scatter-ops
    name: custom_all_gather_reduce_scatter ops
    kind: module
    layer: kernels
    parent: gpu-worker
    summary: "The _C_custom_ar custom all-gather and reduce-scatter torch ops (legacy IPC, MNNVL Lamport and MNNVL multimem variants) and their kernels."
    sources: ["csrc/custom_all_gather_reduce_scatter_ops.cpp:6-34"]
  - id: all-reduce-utils
    name: all_reduce_utils (module)
    kind: module
    layer: distributed
    parent: custom-allreduce
    capacity: {concurrency: 1}   # called from CustomAllreduce.__init__ on the worker's main thread; the module-level cache has no other writer (all_reduce_utils.py:341-350)
    summary: "GPU P2P access check with a JSON cache under VLLM_CACHE_ROOT; the local master generates the cache by running this file as a subprocess (its __main__)."
    sources: ["vllm/distributed/device_communicators/all_reduce_utils.py:330-341"]
    state:
      schema: {type: object, properties: {cache_file_exists: {type: boolean}, p2p_ok: {type: object}, cache_loaded: {type: boolean}}}
      initial: {cache_file_exists: false, p2p_ok: {}, cache_loaded: false}

interfaces:
  # ---------------------------------------------------------------- parallel state
  - component: parallel-state
    name: init-distributed-environment
    kind: function
    summary: "Create the world process group (torch.distributed.init_process_group) and the world GroupCoordinator, falling back to gloo when the backend is unavailable."
    sources: ["vllm/distributed/parallel_state.py:1814-2016"]
    request:
      type: object
      required: [world_size, rank]
      properties:
        world_size: {type: integer, examples: [1]}
        rank: {type: integer, examples: [0]}
        local_rank: {type: integer, default: -1}
        backend: {type: string, default: nccl}
        distributed_init_method: {type: string, default: "env://"}
        backend_available: {type: boolean, default: true}
    response: {type: object, properties: {world_size: {type: integer}, backend: {type: string}, already_initialized: {type: boolean}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false, summary: "world group already initialized with a different world size"}
    behavior:
      - if: "state.world_initialized"
        then:
          - title: World group already exists
            detail: "torch.distributed is initialized; the world GroupCoordinator must match the requested world size."
            source: "vllm/distributed/parallel_state.py:1989-1992"
            if: "state.world_size > 0 && state.world_size != input.world_size"
            then:
              - fail: {code: assertion-error, status: 0, message: "world group already initialized with a different world size"}
          - return: {world_size: "= input.world_size", backend: "= state.backend", already_initialized: true}
      - title: Fall back to gloo when the backend is missing
        source: "vllm/distributed/parallel_state.py:1913-1922"
        if: "!input.backend_available"
        then:
          - set: {vars.backend: gloo}
        else:
          - set: {vars.backend: "= input.backend"}
      - title: init_process_group and the world GroupCoordinator
        detail: "The world group spans every rank (ranks = range(world_size)); the node count is derived from the CPU group."
        source: "vllm/distributed/parallel_state.py:1981-1988"
        set:
          state.world_initialized: true
          state.world_size: "= input.world_size"
          state.backend: "= vars.backend"
          state.groups: "= merge(state.groups, {'world': {'world_size': input.world_size, 'unique_name': 'world:0'}})"
      - return: {world_size: "= input.world_size", backend: "= vars.backend", already_initialized: false}

  - component: parallel-state
    name: set-custom-all-reduce
    kind: function
    summary: "Set the module flag _ENABLE_CUSTOM_ALL_REDUCE that the TP CudaCommunicator reads when it is built."
    sources: ["vllm/distributed/parallel_state.py:1708-1713"]
    request: {type: object, required: [enable], properties: {enable: {type: boolean, examples: [true]}}}
    response: {type: object, properties: {enabled: {type: boolean}}}
    behavior:
      - set: {state.custom_all_reduce_enabled: "= input.enable"}
      - if: "!input.enable"
        then:
          - title: The custom all-reduce will not be built
            detail: "CudaCommunicator only creates CustomAllreduce when _ENABLE_CUSTOM_ALL_REDUCE is true for the tp group."
            source: "vllm/distributed/device_communicators/cuda_communicator.py:63-66"
            call: custom-allreduce.disable
            input: {reason: "disable_custom_all_reduce"}
      - return: {enabled: "= input.enable"}

  - component: parallel-state
    name: ensure-model-parallel-initialized
    kind: function
    summary: "Initialize the model-parallel groups if absent, else assert that TP/PP/PCP/DCP sizes match the request."
    sources: ["vllm/distributed/parallel_state.py:2366-2415"]
    request:
      type: object
      required: [tensor_model_parallel_size, pipeline_model_parallel_size]
      properties:
        tensor_model_parallel_size: {type: integer, examples: [1]}
        pipeline_model_parallel_size: {type: integer, default: 1}
        data_parallel_size: {type: integer, default: 1}
        is_moe: {type: boolean, default: false}
        enable_eplb: {type: boolean, default: false}
    response: {type: object, properties: {tp_world_size: {type: integer}, pp_world_size: {type: integer}, created: {type: boolean}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "!state.mp_initialized"
        then:
          - call: parallel-state.initialize-model-parallel
            input: "= input"
            as: init
          - return: {tp_world_size: "= input.tensor_model_parallel_size", pp_world_size: "= input.pipeline_model_parallel_size", created: true}
      - title: get_pp_group().world_size
        source: "vllm/distributed/parallel_state.py:2397"
        call: parallel-state.get-pp-group
        as: ppg
      - set:
          vars.tp: "= 'tp' in state.groups ? state.groups.tp.world_size : config['tensor-parallel-size']"
          vars.pp: "= vars.ppg.value.world_size"
      - title: Sizes must match the existing groups
        source: "vllm/distributed/parallel_state.py:2392-2396"
        if: "vars.tp != input.tensor_model_parallel_size"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'tensor parallel group already initialized, but of unexpected size. got: ' + string(vars.tp) + ' vs. wanted: ' + string(input.tensor_model_parallel_size)"}
      - if: "vars.pp != input.pipeline_model_parallel_size"
        then:
          - source: "vllm/distributed/parallel_state.py:2397-2402"
            fail: {code: assertion-error, status: 0, message: "pipeline parallel group already initialized, but of unexpected size"}
      - return: {tp_world_size: "= vars.tp", pp_world_size: "= vars.pp", created: false}

  - component: parallel-state
    name: initialize-model-parallel
    kind: function
    summary: "Lay out ranks as ExternalDP x DP x PP x PCP x TP and build the TP (with a message-queue broadcaster), DCP, PCP, PP, DP groups, plus EP (MoE only) and EPLB (when enabled)."
    sources: ["vllm/distributed/parallel_state.py:2056-2364"]
    request:
      type: object
      required: [tensor_model_parallel_size, pipeline_model_parallel_size]
      properties:
        tensor_model_parallel_size: {type: integer, examples: [1]}
        pipeline_model_parallel_size: {type: integer, default: 1}
        data_parallel_size: {type: integer, default: 1}
        is_moe: {type: boolean, default: false}
        enable_eplb: {type: boolean, default: false}
    response: {type: object, properties: {groups: {type: array, items: {type: string}}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - title: torch.distributed must be initialized first
        source: "vllm/distributed/parallel_state.py:2091"
        if: "!state.world_initialized"
        then:
          - fail: {code: assertion-error, status: 0, message: "torch.distributed is not initialized"}
      - set:
          vars.block: "= input.tensor_model_parallel_size * input.pipeline_model_parallel_size * input.data_parallel_size"
      - title: "all_ranks = arange(world_size).reshape(-1, DP, PP, PCP, TP)"
        detail: "torch reshape raises when world_size is not a multiple of DP x PP x TP."
        source: "vllm/distributed/parallel_state.py:2135-2141"
        if: "state.world_size % vars.block != 0"
        then:
          - fail: {code: runtime-error, status: 0, message: "= 'shape \\'[-1, ' + string(input.data_parallel_size) + ', ' + string(input.pipeline_model_parallel_size) + ', 1, ' + string(input.tensor_model_parallel_size) + ']\\' is invalid for input of size ' + string(state.world_size)"}
      - title: TP groups are consecutive ranks; the TP group gets the shared-memory broadcaster
        source: "vllm/distributed/parallel_state.py:2143-2157"
        set:
          vars.groups: "= {'tp': {'world_size': input.tensor_model_parallel_size, 'unique_name': 'tp:0', 'mq_broadcaster': true}, 'dcp': {'world_size': 1, 'unique_name': 'dcp:0'}, 'pcp': {'world_size': 1, 'unique_name': 'pcp:0'}, 'pp': {'world_size': input.pipeline_model_parallel_size, 'unique_name': 'pp:0'}, 'dp': {'world_size': input.data_parallel_size, 'unique_name': 'dp:0'}}"
      - title: EP group only for MoE models
        detail: "Dense models get no EP group (_EP stays None); EP spans DP x PCP x TP."
        source: "vllm/distributed/parallel_state.py:2289-2322"
        if: "input.is_moe"
        then:
          - set:
              vars.groups: "= merge(vars.groups, {'ep': {'world_size': input.data_parallel_size * input.tensor_model_parallel_size, 'unique_name': 'ep:0'}})"
          - title: EPLB gets its own group with the EP ranks
            source: "vllm/distributed/parallel_state.py:2324-2346"
            when: "input.enable_eplb"
            set:
              vars.groups: "= merge(vars.groups, {'eplb': {'world_size': input.data_parallel_size * input.tensor_model_parallel_size, 'unique_name': 'eplb:0'}})"
      - set:
          state.groups: "= merge(state.groups, vars.groups)"
          state.mp_initialized: true
      - return: {groups: "= vars.groups.map(k, k)"}

  - component: parallel-state
    name: get-tp-group
    kind: function
    summary: "Return the tensor-parallel GroupCoordinator (its size, ranks and this process's rank in it); asserts it was initialized."
    sources: ["vllm/distributed/parallel_state.py:1588-1590", "vllm/distributed/parallel_state.py:2437-2444"]
    request: {type: object, properties: {}}
    response: DistTpGroup
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "!state.mp_initialized"
        then:
          - title: "assert _TP is not None"
            source: "vllm/distributed/parallel_state.py:1589"
            fail: {code: assertion-error, status: 0, message: "tensor model parallel group is not initialized"}
      - set:
          vars.ws: "= 'tp' in state.groups ? state.groups.tp.world_size : config['tensor-parallel-size']"
      - return:
          world_size: "= vars.ws"
          ranks: "= lists.range(vars.ws).map(i, 'rank' + string(i))"
          rank_in_group: "= int(self.replace('rank', '')) % vars.ws"
          unique_name: "tp:0"

  - component: parallel-state
    name: get-pp-group
    kind: io
    summary: "get_pp_group: the pipeline-parallel GroupCoordinator; asserts it was initialized (the module global _PP)."
    sources: ["vllm/distributed/parallel_state.py:1638-1640"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {world_size: {type: integer}, unique_name: {type: string}}}
    errors:
