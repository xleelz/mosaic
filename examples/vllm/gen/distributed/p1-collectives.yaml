    summary: "Destroy every model-parallel GroupCoordinator and reset the module globals to None."
    sources: ["vllm/distributed/parallel_state.py:2458-2503"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {destroyed: {type: array, items: {type: string}}}}
    behavior:
