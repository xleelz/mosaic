          state.mp_initialized: false
          state.groups: "= 'world' in state.groups ? {'world': state.groups.world} : {}"
      - return: {destroyed: "= vars.names"}

  # The torch custom ops registered with direct_register_custom_op (torch-op entries).
  - component: parallel-state
    name: all-reduce
    kind: kernel
    summary: "torch.ops.vllm.all_reduce: look the group up by name in _groups and run its out-of-place all-reduce (registered as a custom op so torch.compile can trace it)."
    sources: ["vllm/distributed/parallel_state.py:398-402", "vllm/distributed/parallel_state.py:198-203", "vllm/distributed/parallel_state.py:747-750"]
    request:
      type: object
      required: [group_name, num_tokens]
      properties:
        group_name: {type: string, examples: ["tp:0"]}
        num_tokens: {type: integer, examples: [128]}
        hidden_size: {type: integer, default: 4096}
        dtype: {type: string, default: bfloat16}
        num_collectives: {type: integer, default: 1}
        world_size: {type: integer, examples: [4]}
        ranks: {type: array, items: {type: string}}
    response: DistCollectiveResult
    errors:
