  - component: parallel-state
    name: reduce-scatter
    kind: kernel
    summary: "torch.ops.vllm.reduce_scatter: look the group up by name and run its out-of-place reduce-scatter along dim."
    sources: ["vllm/distributed/parallel_state.py:404-408", "vllm/distributed/parallel_state.py:210-217", "vllm/distributed/parallel_state.py:819-822"]
    request:
      type: object
