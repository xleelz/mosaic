  - component: parallel-state
    name: patched-fused-scaled-matmul-reduce-scatter
    kind: kernel
    summary: "torch.ops.vllm.patched_fused_scaled_matmul_reduce_scatter: a workaround op that forwards to torch.ops.symm_mem.fused_scaled_matmul_reduce_scatter (used by the async-TP compile pass) until the PyTorch fix ships."
    sources: ["vllm/distributed/parallel_state.py:416-423", "vllm/distributed/parallel_state.py:366-395"]
    request:
      type: object
      required: [group_name, num_tokens]
