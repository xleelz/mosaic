        as: k
      - return: {backend: torch-symm-mem, bytes: "= input.num_tokens * input.hidden_size * 2", world_size: "= input.world_size"}

  - component: parallel-state
    name: lookup-group
    kind: function
    summary: "The _groups lookup shared by the custom ops: assert the name is registered, and refuse a group whose weakref is dead (destroyed)."
    sources: ["vllm/distributed/parallel_state.py:199-202"]
    request: {type: object, required: [group_name], properties: {group_name: {type: string, examples: ["tp:0"]}}}
    response: {type: object, properties: {group_name: {type: string}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "input.group_name in state.destroyed_groups && !state.mp_initialized"
        then:
          - title: The weak reference is dead
            source: "vllm/distributed/parallel_state.py:201-202"
            fail: {code: value-error, status: 0, message: "= 'Group ' + input.group_name + ' is destroyed.'"}
      - if: "!state.mp_initialized"
        then:
          - title: "assert group_name in _groups"
            source: "vllm/distributed/parallel_state.py:199"
            fail: {code: assertion-error, status: 0, message: "= 'Group ' + input.group_name + ' is not found.'"}
      - return: {group_name: "= input.group_name"}

  # ---------------------------------------------------------------- communication_op (the seam)
  - component: tensor-model-parallel
    name: all-reduce
    kind: function
    summary: "tensor_model_parallel_all_reduce: all-reduce the input across the TP group. Every rank of the group joins the collective; one slow rank delays all, one failed rank fails the step."
    description: >-
      The seam models-layers calls after row-parallel linear layers. Multi-rank semantics: the
      call on one rank fans out as a parallel with join all over the TP ranks
      (cuda-communicator.all-reduce), each branch running the chosen backend kernel on its rank.
    sources: ["vllm/distributed/communication_op.py:12-14", "vllm/distributed/parallel_state.py:724-745"]
    attributes: {seam: true, callers: [models-layers]}
    request: DistCollectiveRequest
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false, summary: "the TP group is not initialized"}
      - {code: dist-backend-error, status: 0, retryable: false, summary: "a rank failed inside the collective"}
    behavior:
      - call: parallel-state.get-tp-group
        as: tp
      - call: group-coordinator.all-reduce
        input: "= merge(input, {'world_size': vars.tp.value.world_size, 'ranks': vars.tp.value.ranks, 'group_name': vars.tp.value.unique_name})"
        as: out
      - return: "= vars.out.value"

  - component: tensor-model-parallel
    name: all-gather
    kind: function
    summary: "tensor_model_parallel_all_gather: gather the input from every TP rank along dim."
    sources: ["vllm/distributed/communication_op.py:17-21"]
    request: DistCollectiveRequest
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - call: parallel-state.get-tp-group
        as: tp
      - call: group-coordinator.all-gather
        input: "= merge(input, {'world_size': vars.tp.value.world_size, 'ranks': vars.tp.value.ranks, 'group_name': vars.tp.value.unique_name})"
        as: out
      - return: "= vars.out.value"

  - component: tensor-model-parallel
    name: reduce-scatter
    kind: function
    summary: "tensor_model_parallel_reduce_scatter: reduce across TP ranks and keep this rank's 1/world_size slice along dim."
    sources: ["vllm/distributed/communication_op.py:24-28"]
    request: DistCollectiveRequest
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - call: parallel-state.get-tp-group
        as: tp
      - call: group-coordinator.reduce-scatter
        input: "= merge(input, {'world_size': vars.tp.value.world_size, 'ranks': vars.tp.value.ranks, 'group_name': vars.tp.value.unique_name})"
        as: out
      - return: "= vars.out.value"

  # ---------------------------------------------------------------- GroupCoordinator
  - component: group-coordinator
    name: all-reduce
    kind: function
    summary: "GroupCoordinator.all_reduce: bypass at world size 1, else call torch.ops.vllm.all_reduce with the group's unique name."
    sources: ["vllm/distributed/parallel_state.py:724-745"]
    request: {type: object, required: [num_tokens, world_size], properties: {num_tokens: {type: integer}, world_size: {type: integer}, group_name: {type: string}}}
    response: DistCollectiveResult
    behavior:
      - if: "input.world_size == 1"
        then:
          - title: Bypass on a single GPU
            source: "vllm/distributed/parallel_state.py:739-740"
            return: {backend: bypass, bytes: 0, world_size: 1, num_tokens: "= input.num_tokens"}
      - title: "CUDA uses the custom-op call (use_custom_op_call)"
        source: "vllm/distributed/parallel_state.py:742-743"
        call: parallel-state.all-reduce
        input: "= input"
        as: out
      - return: "= vars.out.value"

  - component: group-coordinator
    name: all-gather
    kind: function
    summary: "GroupCoordinator.all_gather: bypass at world size 1, check dim, then call torch.ops.vllm.all_gather."
    sources: ["vllm/distributed/parallel_state.py:752-766"]
    request: {type: object, required: [num_tokens, world_size], properties: {num_tokens: {type: integer}, world_size: {type: integer}, dim: {type: integer}}}
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "input.world_size == 1"
        then:
          - source: "vllm/distributed/parallel_state.py:755-756"
            return: {backend: bypass, bytes: 0, world_size: 1, num_tokens: "= input.num_tokens"}
      - set: {vars.dim: "= has(input.dim) ? input.dim : -1"}
      - title: "assert -input_.dim() <= dim < input_.dim() (2-D activations)"
        source: "vllm/distributed/parallel_state.py:757-759"
        if: "vars.dim < -2 || vars.dim >= 2"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'Invalid dim (' + string(vars.dim) + ') for input tensor'"}
      - call: parallel-state.all-gather
        input: "= input"
        as: out
      - return: "= vars.out.value"

  - component: group-coordinator
    name: reduce-scatter
    kind: function
    summary: "GroupCoordinator.reduce_scatter: bypass at world size 1, check dim, then call torch.ops.vllm.reduce_scatter."
    sources: ["vllm/distributed/parallel_state.py:783-797"]
    request: {type: object, required: [num_tokens, world_size], properties: {num_tokens: {type: integer}, world_size: {type: integer}, dim: {type: integer}}}
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "input.world_size == 1"
        then:
          - source: "vllm/distributed/parallel_state.py:786-787"
            return: {backend: bypass, bytes: 0, world_size: 1, num_tokens: "= input.num_tokens"}
      - set: {vars.dim: "= has(input.dim) ? input.dim : -1"}
      - if: "vars.dim < -2 || vars.dim >= 2"
        then:
          - source: "vllm/distributed/parallel_state.py:788-790"
            fail: {code: assertion-error, status: 0, message: "= 'Invalid dim (' + string(vars.dim) + ') for input tensor'"}
      - call: parallel-state.reduce-scatter
        input: "= input"
        as: out
      - return: "= vars.out.value"

  # ---------------------------------------------------------------- CudaCommunicator
  - component: cuda-communicator
    name: all-reduce
    kind: function
    summary: "CudaCommunicator.all_reduce: pick the backend for this tensor, then every rank of the group runs it; the collective completes when all ranks have."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:362-446"]
    request: {type: object, required: [num_tokens, world_size, ranks], properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, dtype: {type: string}, world_size: {type: integer}, ranks: {type: array, items: {type: string}}, num_collectives: {type: integer}}}
    response: DistCollectiveResult
    errors:
      - {code: dist-backend-error, status: 0, retryable: false, summary: "a rank failed inside the collective (NCCL/IPC error)"}
    behavior:
      - set:
          vars.hidden: "= has(input.hidden_size) ? input.hidden_size : 4096"
          vars.dtype: "= has(input.dtype) ? input.dtype : 'bfloat16'"
          vars.n: "= has(input.num_collectives) ? input.num_collectives : 1"
          vars.ws: "= input.world_size"
          vars.wskey: "= string(input.world_size)"
      - set:
          vars.esize: "= vars.dtype == 'float32' || vars.dtype == 'int32' ? 4 : 2"
      - set:
          vars.bytes: "= input.num_tokens * vars.hidden * vars.esize"
      - title: FlashInfer all-reduce first, when built and the tensor fits its workspace
        detail: "should_use_fi_ar: CUDA, contiguous, 2-D, fp16/bf16/fp32, nbytes <= the max size for this capability and world size (sm90: 64 MB at 2, 2 MB at 4, 0.5 MB at 8 GPUs)."
        source: "vllm/distributed/device_communicators/cuda_communicator.py:363-368"
        set:
          vars.use_fi: "= config['vllm-allreduce-use-flashinfer'] && state.flashinfer_available && state.platform == 'cuda' && vars.dtype != 'int32' && vars.wskey in state.fi_ar_max_mb && double(vars.bytes) <= double(state.fi_ar_max_mb[vars.wskey]) * 1048576.0"
      - title: NCCL symmetric memory for small and large tensors (opt-in)
        detail: "should_nccl_symm_mem_allreduce: VLLM_USE_NCCL_SYMM_MEM, world size >= 4, size <= 16 KB or >= the custom-AR preferred upper bound."
        source: "vllm/distributed/device_communicators/cuda_communicator.py:372-379"
        if: "!vars.use_fi && config['vllm-use-nccl-symm-mem'] && vars.ws >= 4 && (!(vars.wskey in state.nccl_symm_custom_ar_range_kb) || vars.bytes <= state.nccl_symm_custom_ar_range_kb[vars.wskey][0] * 1024 || vars.bytes >= state.nccl_symm_custom_ar_range_kb[vars.wskey][1] * 1024)"
        then:
          - set: {vars.target: pynccl.all-reduce-symmetric-with-copy, vars.backend: nccl-symm-mem}
        else:
          - if: "vars.use_fi"
            then:
              - source: "vllm/distributed/device_communicators/cuda_communicator.py:392-396"
                set: {vars.target: flashinfer-all-reduce.all-reduce, vars.backend: flashinfer}
            else:
              - call: custom-allreduce.should-custom-ar
                input: {bytes: "= vars.bytes", dtype: "= vars.dtype", world_size: "= vars.ws"}
                as: ca
              - if: "vars.ca.value.use"
                then:
                  - title: vLLM custom all-reduce
                    source: "vllm/distributed/device_communicators/cuda_communicator.py:407-415"
                    set: {vars.target: custom-allreduce.custom-all-reduce, vars.backend: custom-allreduce}
                else:
                  - title: torch symmetric memory, else PyNccl
                    source: "vllm/distributed/device_communicators/cuda_communicator.py:426-436"
                    set:
                      vars.target: "= config['vllm-allreduce-use-symm-mem'] && vars.dtype == 'bfloat16' && state.platform == 'cuda' && vars.wskey in state.symm_mem_max_mb && double(vars.bytes) <= double(state.symm_mem_max_mb[vars.wskey]) * 1048576.0 ? 'symm-mem-communicator.all-reduce' : 'pynccl-communicator.all-reduce'"
                  - set:
                      vars.backend: "= vars.target == 'symm-mem-communicator.all-reduce' ? 'torch-symm-mem' : 'pynccl'"
      - title: Meet the other ranks of the group (every rank calls the collective once)
        detail: "A collective completes only when all ranks have entered it: the latest arrival sets the start, and a rank that never arrives makes the others time out (torch's process-group timeout, 600 s for NCCL by default)."
        source: "vllm/distributed/parallel_state.py:1953-1960"
        rendezvous: "= 'tp-allreduce:' + string(has(input.layer) ? input.layer : 0)"
        count: "= config['tensor-parallel-size']"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - title: Run the chosen backend on this rank
        source: "vllm/distributed/device_communicators/cuda_communicator.py:438-446"
        call: "= vars.target"
        targets: [flashinfer-all-reduce.all-reduce, pynccl.all-reduce-symmetric-with-copy, custom-allreduce.custom-all-reduce, symm-mem-communicator.all-reduce, pynccl-communicator.all-reduce]
        input: {bytes: "= vars.bytes", world_size: "= vars.ws", num_collectives: "= vars.n", dtype: "= vars.dtype"}
        as: k
      - if: "vars.target == 'pynccl-communicator.all-reduce' && vars.k.value.out_none"
        then:
          - title: PyNccl disabled; fall back to torch.distributed.all_reduce
            source: "vllm/distributed/device_communicators/cuda_communicator.py:437-445"
            call: torch-distributed.all-reduce
            input: {bytes: "= vars.bytes", world_size: "= vars.ws", num_collectives: "= vars.n"}
      - return:
          backend: "= vars.backend"
          algorithm: "= vars.backend == 'custom-allreduce' ? vars.k.value.algorithm : vars.backend"
          bytes: "= vars.bytes"
          world_size: "= vars.ws"
          num_tokens: "= input.num_tokens"
          hidden_size: "= vars.hidden"

  - component: cuda-communicator
    name: all-gather
    kind: function
    summary: "CudaCommunicator.all_gather: NVLS symmetric memory for dim-0 gathers when enabled, else PyNccl all_gather into a world_size-times larger buffer; the base-class torch collective when PyNccl is disabled or on ROCm."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:460-494"]
    request: {type: object, required: [num_tokens, world_size, ranks], properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, dim: {type: integer}, world_size: {type: integer}, ranks: {type: array, items: {type: string}}, num_collectives: {type: integer}}}
    response: DistCollectiveResult
    errors:
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.bytes: "= input.num_tokens * (has(input.hidden_size) ? input.hidden_size : 4096) * 2"
          vars.n: "= has(input.num_collectives) ? input.num_collectives : 1"
          vars.dim: "= has(input.dim) ? input.dim : -1"
      - set: {vars.dim0: "= vars.dim == 0 || vars.dim == -2"}
      - title: "dim 0 with NCCL symmetric memory uses the symm-mem all-gather"
        source: "vllm/distributed/device_communicators/cuda_communicator.py:465-468"
        if: "vars.dim0 && config['vllm-use-nccl-symm-mem']"
        then:
          - set: {vars.target: pynccl-communicator.all-gather, vars.backend: nccl-symm-mem}
        else:
          - call: pynccl-communicator.status
            as: pn
          - title: PyNccl disabled or ROCm use the base-class torch all_gather_into_tensor
            source: "vllm/distributed/device_communicators/cuda_communicator.py:470-478"
            set:
              vars.target: "= vars.pn.value.disabled || state.platform == 'rocm' ? 'torch-distributed.all-gather' : 'pynccl-communicator.all-gather'"
          - set:
              vars.backend: "= vars.target == 'pynccl-communicator.all-gather' ? 'pynccl' : 'torch-distributed'"
      - title: Meet the other ranks of the group (every rank calls the collective once)
        detail: "A collective completes only when all ranks have entered it: the latest arrival sets the start, and a rank that never arrives makes the others time out (torch's process-group timeout, 600 s for NCCL by default)."
        source: "vllm/distributed/parallel_state.py:1953-1960"
        rendezvous: "= 'tp-allgather:' + string(has(input.layer) ? input.layer : 0)"
        count: "= config['tensor-parallel-size']"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - source: "vllm/distributed/device_communicators/cuda_communicator.py:480-494"
        call: "= vars.target"
        targets: [pynccl-communicator.all-gather, torch-distributed.all-gather]
        input: {bytes: "= vars.bytes", world_size: "= input.world_size", num_collectives: "= vars.n"}
      - return: {backend: "= vars.backend", bytes: "= vars.bytes * input.world_size", world_size: "= input.world_size", num_tokens: "= vars.dim0 ? input.num_tokens * input.world_size : input.num_tokens"}

  - component: cuda-communicator
    name: reduce-scatter
    kind: function
    summary: "CudaCommunicator.reduce_scatter: the scattered dim must divide by world_size; NVLS symmetric memory when enabled, else PyNccl reduce_scatter into a 1/world_size buffer."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:496-531"]
    request: {type: object, required: [num_tokens, world_size, ranks], properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, dim: {type: integer}, world_size: {type: integer}, ranks: {type: array, items: {type: string}}, num_collectives: {type: integer}}}
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.hidden: "= has(input.hidden_size) ? input.hidden_size : 4096"
          vars.n: "= has(input.num_collectives) ? input.num_collectives : 1"
          vars.dim: "= has(input.dim) ? input.dim : -1"
      - set:
          vars.scattered: "= vars.dim == 0 || vars.dim == -2 ? input.num_tokens : vars.hidden"
      - title: "assert input_tensor.shape[0] % world_size == 0 (after moving dim to the front)"
        source: "vllm/distributed/device_communicators/cuda_communicator.py:508-510"
        if: "vars.scattered % input.world_size != 0"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'reduce_scatter dim of size ' + string(vars.scattered) + ' is not divisible by world size ' + string(input.world_size)"}
      - set:
          vars.target: "= config['vllm-use-nccl-symm-mem'] ? 'symm-mem-communicator.reduce-scatter' : 'pynccl-communicator.reduce-scatter'"
          vars.bytes: "= input.num_tokens * vars.hidden * 2"
      - title: Meet the other ranks of the group (every rank calls the collective once)
        detail: "A collective completes only when all ranks have entered it: the latest arrival sets the start, and a rank that never arrives makes the others time out (torch's process-group timeout, 600 s for NCCL by default)."
        source: "vllm/distributed/parallel_state.py:1953-1960"
        rendezvous: "= 'tp-reducescatter:' + string(has(input.layer) ? input.layer : 0)"
        count: "= config['tensor-parallel-size']"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - source: "vllm/distributed/device_communicators/cuda_communicator.py:513-528"
        call: "= vars.target"
        targets: [symm-mem-communicator.reduce-scatter, pynccl-communicator.reduce-scatter]
        input: {bytes: "= vars.bytes", world_size: "= input.world_size", num_collectives: "= vars.n"}
      - return: {backend: "= vars.target == 'pynccl-communicator.reduce-scatter' ? 'pynccl' : 'nccl-symm-mem'", bytes: "= vars.bytes / input.world_size", world_size: "= input.world_size", num_tokens: "= vars.dim == 0 || vars.dim == -2 ? input.num_tokens / input.world_size : input.num_tokens"}

  - component: cuda-communicator
    name: custom-all-gather
    kind: function
    summary: "CudaCommunicator.custom_all_gather: the sequence-parallel gather; None when no CustomAllreduce was built, else the custom all-gather (which may also decline with None)."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:448-452"]
    request: {type: object, required: [num_tokens], properties: {num_tokens: {type: integer, examples: [512]}, hidden_size: {type: integer, default: 4096}, dtype: {type: string, default: bfloat16}}}
    response: {type: object, properties: {used: {type: boolean}, backend: {type: string}, out_tokens: {type: integer}}}
    behavior:
      - call: parallel-state.get-tp-group
        as: tp
      - if: "vars.tp.value.world_size == 1"
        then:
          - title: No CustomAllreduce on a single GPU (ca_comm is None)
            source: "vllm/distributed/device_communicators/cuda_communicator.py:449-451"
            return: {used: false, backend: none}
      - call: custom-allreduce.custom-all-gather
        input: "= merge(input, {'world_size': vars.tp.value.world_size, 'ranks': vars.tp.value.ranks})"
        as: ag
      - return: "= vars.ag.value"

  - component: cuda-communicator
    name: custom-reduce-scatter
    kind: function
    summary: "CudaCommunicator.custom_reduce_scatter: None without a CustomAllreduce, else its backend-selected reduce-scatter."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:454-458"]
    request: {type: object, required: [num_tokens], properties: {num_tokens: {type: integer, examples: [512]}, hidden_size: {type: integer, default: 4096}, dtype: {type: string, default: bfloat16}}}
    response: {type: object, properties: {used: {type: boolean}, backend: {type: string}, out_tokens: {type: integer}}}
    behavior:
      - call: parallel-state.get-tp-group
        as: tp
      - if: "vars.tp.value.world_size == 1"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:455-457"
            return: {used: false, backend: none}
      - call: custom-allreduce.custom-reduce-scatter
        input: "= merge(input, {'world_size': vars.tp.value.world_size, 'ranks': vars.tp.value.ranks})"
        as: rs
      - return: "= vars.rs.value"

  # ---------------------------------------------------------------- backends (per rank)
  - component: flashinfer-all-reduce
    name: all-reduce
    kind: kernel
    summary: "FlashInfer one-shot all-reduce on this rank (mnnvl backend on a single NVSwitch node)."
    sources: ["vllm/distributed/device_communicators/flashinfer_all_reduce.py:522-542"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-flashinfer-ar-base-us']) + double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: symm-mem-communicator
    name: all-reduce
    kind: kernel
    summary: "torch symmetric-memory all-reduce on this rank: copy into the symmetric buffer, then multimem or two-shot all-reduce."
    sources: ["vllm/distributed/device_communicators/symm_mem.py:127-156"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-symm-mem-base-us']) + 2.0 * double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: symm-mem-communicator
    name: reduce-scatter
    kind: kernel
    summary: "NVLS symmetric-memory reduce-scatter on this rank (CudaCommunicator._reduce_scatter_symm_mem)."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:711-745"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-symm-mem-base-us']) + double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: symm-mem-communicator
    name: fused-scaled-matmul-reduce-scatter
    kind: kernel
    summary: "torch.ops.symm_mem.fused_scaled_matmul_reduce_scatter (PyTorch-owned kernel, latency only)."
    sources: ["vllm/distributed/parallel_state.py:381-395"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= ((double(config['dist-symm-mem-base-us']) + double(input.bytes) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: pynccl
    name: all-reduce-symmetric-with-copy
    kind: kernel
    summary: "torch.ops.vllm.all_reduce_symmetric_with_copy: allocate symmetric input/output in the NCCL symmetric pool, copy the input in, and ncclAllReduce."
    sources: ["vllm/distributed/device_communicators/pynccl.py:84-88", "vllm/distributed/device_communicators/pynccl.py:73-79"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}, out_none: {type: boolean}}}
    behavior:
      - title: Copy into the symmetric buffer, then PyNccl all_reduce
        source: "vllm/distributed/device_communicators/pynccl.py:74-78"
        call: pynccl-communicator.all-reduce
        input: "= input"
        as: ar
      - return: {algorithm: nccl-symm-mem, out_none: "= vars.ar.value.out_none"}

  - component: pynccl-communicator
    name: status
    kind: function
    summary: "Whether this PyNcclCommunicator is disabled (NCCL library missing or world size 1)."
    sources: ["vllm/distributed/device_communicators/pynccl.py:125-141"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {disabled: {type: boolean}}}
    behavior:
      - return: {disabled: "= state.disabled"}

  - component: pynccl-communicator
    name: all-reduce
    kind: kernel
    summary: "PyNcclCommunicator.all_reduce: ncclAllReduce on the current stream; returns None when disabled."
    sources: ["vllm/distributed/device_communicators/pynccl.py:268-299"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}, out_none: {type: boolean}}}
    latency_ms: "= state.disabled ? 0.0 : (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-nccl-base-us']) + 2.0 * double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"
    behavior:
      - if: "state.disabled"
        then:
          - source: "vllm/distributed/device_communicators/pynccl.py:275-276"
            return: {algorithm: none, out_none: true}
      - source: "vllm/distributed/device_communicators/pynccl.py:290-299"
        return: {algorithm: nccl-ring, out_none: false}

  - component: pynccl-communicator
    name: all-gather
    kind: kernel
    summary: "PyNcclCommunicator.all_gather: ncclAllGather into the output buffer."
    sources: ["vllm/distributed/device_communicators/pynccl.py:301-322"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-nccl-base-us']) + double(input.bytes) * double(input.world_size - 1) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: pynccl-communicator
    name: reduce-scatter
    kind: kernel
    summary: "PyNcclCommunicator.reduce_scatter: ncclReduceScatter; silently does nothing when disabled."
    sources: ["vllm/distributed/device_communicators/pynccl.py:359-385"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-nccl-base-us']) + double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: torch-distributed
    name: all-reduce
    kind: kernel
    summary: "torch.distributed.all_reduce on the device group (fallback)."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:430-434"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (2.0 * double(config['dist-nccl-base-us']) + 2.0 * double(input.bytes) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: torch-distributed
    name: all-gather
    kind: kernel
    summary: "torch.distributed.all_gather_into_tensor on the device group (DeviceCommunicatorBase.all_gather)."
    sources: ["vllm/distributed/device_communicators/base_device_communicator.py:265-288"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (2.0 * double(config['dist-nccl-base-us']) + double(input.bytes) * double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  # ---------------------------------------------------------------- CustomAllreduce (Python)
  - component: custom-allreduce
    name: init
    kind: function
    summary: "CustomAllreduce.__init__: decide whether the custom all-reduce can run on this group, and if so allocate the IPC buffers. Each refusal leaves disabled=True with a warning; nothing fails."
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:137-330"]
    request:
      type: object
      required: [world_size]
      properties:
        world_size: {type: integer, examples: [4]}
        custom_ar_library: {type: boolean, default: true}
        same_node: {type: boolean, default: true}
        fully_connected: {type: boolean, default: true}
        mnnvl_capable: {type: boolean, default: false}
        platform: {type: string, enum: [cuda, rocm], default: cuda}
    response: {type: object, properties: {disabled: {type: boolean}, reason: {type: string}, max_size: {type: integer}}}
    behavior:
      - set: {state.disabled: true, state.disabled_reason: ""}
      - if: "!input.custom_ar_library"
        then:
          - title: Missing custom all-reduce library (non-GPU build)
            source: "vllm/distributed/device_communicators/custom_all_reduce.py:189-195"
            set: {state.disabled_reason: missing-library}
          - return: {disabled: true, reason: missing-library}
      - if: "input.world_size == 1"
        then:
          - source: "vllm/distributed/device_communicators/custom_all_reduce.py:209-212"
            set: {state.disabled_reason: single-gpu}
          - return: {disabled: true, reason: single-gpu}
      - if: "!(input.world_size in [2, 4, 6, 8, 16])"
        then:
          - title: Unsupported world size
            source: "vllm/distributed/device_communicators/custom_all_reduce.py:214-222"
            set: {state.disabled_reason: unsupported-world-size}
          - return: {disabled: true, reason: unsupported-world-size}
      - if: "!input.same_node && !input.mnnvl_capable"
        then:
          - title: Multi-node group without MNNVL on every rank
            source: "vllm/distributed/device_communicators/custom_all_reduce.py:234-239"
            set: {state.disabled_reason: no-mnnvl}
          - return: {disabled: true, reason: no-mnnvl}
      - if: "input.same_node && input.world_size > 2 && !input.fully_connected"
        then:
          - title: More than two PCIe-only GPUs
            source: "vllm/distributed/device_communicators/custom_all_reduce.py:270-276"
            set: {state.disabled_reason: pcie-only}
          - return: {disabled: true, reason: pcie-only}
      - if: "input.same_node && input.platform != 'rocm'"
        then:
          - title: Test P2P capability (cached)
            source: "vllm/distributed/device_communicators/custom_all_reduce.py:281-290"
            call: all-reduce-utils.can-p2p
            input: {world_size: "= input.world_size", rank: "= int(self.replace('rank', ''))"}
            as: p2p
          - if: "!vars.p2p.value.ok"
            then:
              - source: "vllm/distributed/device_communicators/custom_all_reduce.py:285-294"
                set: {state.disabled_reason: p2p-failed}
              - return: {disabled: true, reason: p2p-failed}
      - title: Enabled; allocate the IPC meta and buffer for every rank
        source: "vllm/distributed/device_communicators/custom_all_reduce.py:293-330"
        set:
          state.disabled: false
          state.fully_connected: "= input.fully_connected"
          state.same_node: "= input.same_node"
          state.mnnvl_only: "= !input.same_node"
          state.max_size: "= input.world_size <= 4 ? 8388608 : (input.world_size == 6 ? 524288 : 262144)"
      - return: {disabled: false, reason: "", max_size: "= state.max_size"}

  - component: custom-allreduce
    name: disable
    kind: function
    summary: "No CustomAllreduce is created (custom all-reduce turned off, or not the tp group)."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:56-66"]
    request: {type: object, properties: {reason: {type: string}}}
    response: {type: object, properties: {disabled: {type: boolean}}}
    behavior:
      - set: {state.disabled: true, state.disabled_reason: "= input.reason"}
      - return: {disabled: true}

  - component: custom-allreduce
    name: should-custom-ar
    kind: function
    summary: "CustomAllreduce.should_custom_ar: enabled, at most 8 GPUs, fp32/fp16/bf16, a multiple of 16 bytes, and (2 GPUs or fully connected) with size < max_size (always when batch invariant)."
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:499-514"]
    request: {type: object, required: [bytes, world_size], properties: {bytes: {type: integer}, dtype: {type: string}, world_size: {type: integer}}}
    response: {type: object, properties: {use: {type: boolean}, reason: {type: string}}}
    behavior:
      - if: "state.disabled || input.world_size > 8"
        then:
          - source: "vllm/distributed/device_communicators/custom_all_reduce.py:500-501"
            return: {use: false, reason: disabled}
      - if: "!(input.dtype in ['float32', 'float16', 'bfloat16'])"
        then:
          - source: "vllm/distributed/device_communicators/custom_all_reduce.py:502-503"
            return: {use: false, reason: dtype}
      - if: "input.bytes % 16 != 0"
        then:
          - source: "vllm/distributed/device_communicators/custom_all_reduce.py:505-507"
            return: {use: false, reason: alignment}
      - if: "input.world_size == 2 || state.fully_connected"
        then:
          - source: "vllm/distributed/device_communicators/custom_all_reduce.py:512-513"
            return: {use: "= state.batch_invariant || input.bytes < state.max_size", reason: "= state.batch_invariant || input.bytes < state.max_size ? '' : 'too-large'"}
      - source: "vllm/distributed/device_communicators/custom_all_reduce.py:514"
        return: {use: false, reason: not-fully-connected}

  - component: custom-allreduce
    name: custom-all-reduce
    kind: function
    summary: "CustomAllreduce.custom_all_reduce on this rank: during CUDA-graph capture all-reduce the registered buffer in place; in eager mode copy into the pre-registered IPC buffer (all_reduce(registered=False)), chunking inputs larger than max_size."
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:549-565", "vllm/distributed/device_communicators/custom_all_reduce.py:516-547"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}, chunks: {type: integer}}}
    behavior:
      - set:
          vars.chunks: "= input.bytes <= state.max_size ? 1 : (input.bytes + state.max_size - 1) / state.max_size"
          vars.registered: "= state.capturing"
      - title: "Chunk inputs above max_size (only reachable in batch-invariant mode)"
        source: "vllm/distributed/device_communicators/custom_all_reduce.py:526-537"
        call: custom-allreduce-cuda.all-reduce
        input: {bytes: "= input.bytes / vars.chunks", world_size: "= input.world_size", num_collectives: "= (has(input.num_collectives) ? input.num_collectives : 1) * vars.chunks", registered: "= vars.registered", dtype: "= has(input.dtype) ? input.dtype : 'bfloat16'"}
        as: ar
      - return: {algorithm: "= vars.ar.value.algorithm", chunks: "= vars.chunks"}

  - component: custom-allreduce
    name: custom-all-gather
    kind: function
    summary: "CustomAllreduce.custom_all_gather: gate on should_custom_all_gather, then every rank launches the MNNVL Lamport kernel (multicast) or the legacy IPC all-gather."
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:567-619"]
    request: {type: object, required: [num_tokens, world_size, ranks], properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, dtype: {type: string}, world_size: {type: integer}, ranks: {type: array, items: {type: string}}}}
    response: {type: object, properties: {used: {type: boolean}, backend: {type: string}, out_tokens: {type: integer}}}
    errors:
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.dtype: "= has(input.dtype) ? input.dtype : 'bfloat16'"
          vars.hidden: "= has(input.hidden_size) ? input.hidden_size : 4096"
      - set:
          vars.bytes: "= input.num_tokens * vars.hidden * (vars.dtype == 'float32' ? 4 : 2)"
          vars.max: "= state.mnnvl_multicast ? (input.world_size == 2 ? 8388608 : (input.world_size == 4 ? 4194304 : 2097152)) : state.max_all_gather_size"
      - title: should_custom_all_gather
        detail: "disabled or not CUDA, 16 GPUs on one node, a dtype other than fp32/fp16/bf16, size not in (0, max], not 16-byte aligned, or neither fully connected nor multicast: decline with None."
        source: "vllm/distributed/device_communicators/custom_all_reduce.py:567-589"
        if: "state.disabled || (input.world_size == 16 && !state.mnnvl_only) || !(vars.dtype in ['float32', 'float16', 'bfloat16']) || vars.bytes <= 0 || vars.bytes > vars.max || vars.bytes % 16 != 0 || !(state.fully_connected || state.mnnvl_multicast)"
        then:
          - return: {used: false, backend: none}
      - set:
          vars.op: "= state.mnnvl_multicast ? 'custom-all-gather-reduce-scatter-ops.mnnvl-lamport-all-gather' : 'custom-all-gather-reduce-scatter-ops.custom-all-gather'"
      - title: Meet the other ranks of the group (every rank calls the collective once)
        detail: "A collective completes only when all ranks have entered it: the latest arrival sets the start, and a rank that never arrives makes the others time out (torch's process-group timeout, 600 s for NCCL by default)."
        source: "vllm/distributed/parallel_state.py:1953-1960"
        rendezvous: "= 'tp-custom-allgather:' + string(has(input.layer) ? input.layer : 0)"
        count: "= config['tensor-parallel-size']"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - title: Launch the all-gather kernel on this rank
        source: "vllm/distributed/device_communicators/custom_all_reduce.py:594-618"
        call: "= vars.op"
        targets: [custom-all-gather-reduce-scatter-ops.mnnvl-lamport-all-gather, custom-all-gather-reduce-scatter-ops.custom-all-gather]
        input: {bytes: "= vars.bytes", world_size: "= input.world_size"}
      - return: {used: true, backend: "= state.mnnvl_multicast ? 'mnnvl-lamport' : 'legacy'", out_tokens: "= input.num_tokens * input.world_size"}

  - component: custom-allreduce
    name: custom-reduce-scatter
    kind: function
    summary: "CustomAllreduce.custom_reduce_scatter: _select_reduce_scatter_backend picks mnnvl_lamport, mnnvl_multimem or legacy (or None), then every rank launches that kernel."
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:621-715"]
    request: {type: object, required: [num_tokens, world_size, ranks], properties: {num_tokens: {type: integer}, hidden_size: {type: integer}, dtype: {type: string}, world_size: {type: integer}, ranks: {type: array, items: {type: string}}}}
    response: {type: object, properties: {used: {type: boolean}, backend: {type: string}, out_tokens: {type: integer}}}
    errors:
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.dtype: "= has(input.dtype) ? input.dtype : 'bfloat16'"
          vars.hidden: "= has(input.hidden_size) ? input.hidden_size : 4096"
      - set:
          vars.bytes: "= input.num_tokens * vars.hidden * (vars.dtype == 'float32' ? 4 : 2)"
      - title: No backend for this tensor
        detail: "Disabled, batch-invariant, 16 GPUs on one node, wrong dtype, rows not divisible by world size, or an output shard not 16-byte aligned."
        source: "vllm/distributed/device_communicators/custom_all_reduce.py:624-638"
        if: "state.disabled || state.batch_invariant || (input.world_size == 16 && !state.mnnvl_only) || !(vars.dtype in ['float32', 'float16', 'bfloat16']) || input.num_tokens % input.world_size != 0 || (vars.bytes / input.world_size) % 16 != 0"
        then:
          - return: {used: false, backend: none}
      - if: "state.mnnvl_multicast"
        then:
          - source: "vllm/distributed/device_communicators/custom_all_reduce.py:640-656"
            set:
              vars.backend: "= vars.bytes <= state.max_mnnvl_reduce_scatter_size ? 'mnnvl_lamport' : (state.mnnvl_multimem_rs_supported && vars.bytes <= state.max_mnnvl_multimem_reduce_scatter_size ? 'mnnvl_multimem' : 'none')"
        else:
          - source: "vllm/distributed/device_communicators/custom_all_reduce.py:658-659"
            set:
              vars.backend: "= state.fully_connected && vars.bytes <= state.max_reduce_scatter_size ? 'legacy' : 'none'"
      - if: "vars.backend == 'none'"
        then:
          - return: {used: false, backend: none}
      - set:
          vars.op: "= vars.backend == 'mnnvl_lamport' ? 'custom-all-gather-reduce-scatter-ops.mnnvl-lamport-reduce-scatter' : (vars.backend == 'mnnvl_multimem' ? 'custom-all-gather-reduce-scatter-ops.mnnvl-multimem-reduce-scatter' : 'custom-all-gather-reduce-scatter-ops.custom-reduce-scatter')"
      - title: Meet the other ranks of the group (every rank calls the collective once)
        detail: "A collective completes only when all ranks have entered it: the latest arrival sets the start, and a rank that never arrives makes the others time out (torch's process-group timeout, 600 s for NCCL by default)."
        source: "vllm/distributed/parallel_state.py:1953-1960"
        rendezvous: "= 'tp-custom-reducescatter:' + string(has(input.layer) ? input.layer : 0)"
        count: "= config['tensor-parallel-size']"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - source: "vllm/distributed/device_communicators/custom_all_reduce.py:678-715"
        call: "= vars.op"
        targets: [custom-all-gather-reduce-scatter-ops.mnnvl-lamport-reduce-scatter, custom-all-gather-reduce-scatter-ops.mnnvl-multimem-reduce-scatter, custom-all-gather-reduce-scatter-ops.custom-reduce-scatter]
        input: {bytes: "= vars.bytes", world_size: "= input.world_size"}
      - return: {used: true, backend: "= vars.backend", out_tokens: "= input.num_tokens / input.world_size"}

  # ---------------------------------------------------------------- C++ CustomAllreduce
  - component: custom-allreduce-cuda
    name: all-reduce
    kind: function
    summary: "The _C_custom_ar all_reduce op body (csrc/custom_all_reduce.cu) and CustomAllreduce::allreduce: pick the one-stage or two-stage kernel by world size, connectivity and size, or as forced by VLLM_CUSTOM_ALLREDUCE_ALGO."
    sources: ["csrc/custom_all_reduce.cu:70-116", "csrc/custom_all_reduce.cuh:236-327"]
    request:
      type: object
      required: [bytes, world_size]
      properties:
        bytes: {type: integer, examples: [1048576]}
        world_size: {type: integer, examples: [4]}
        num_collectives: {type: integer, default: 1}
        registered: {type: boolean, default: false}
        dtype: {type: string, default: bfloat16}
    response: {type: object, properties: {algorithm: {type: string}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.dtype: "= has(input.dtype) ? input.dtype : 'bfloat16'"
          vars.n: "= has(input.num_collectives) ? input.num_collectives : 1"
      - if: "!(vars.dtype in ['float32', 'float16', 'bfloat16'])"
        then:
          - source: "csrc/custom_all_reduce.cu:111-113"
            fail: {code: runtime-error, status: 0, message: "custom allreduce only supports float32, float16 and bfloat16"}
      - set: {vars.algo: "= config['vllm-custom-allreduce-algo']"}
      - if: "vars.algo != '' && !(vars.algo in ['1stage', 'oneshot', '2stage', 'twoshot'])"
        then:
          - title: Invalid VLLM_CUSTOM_ALLREDUCE_ALGO
            source: "csrc/custom_all_reduce.cuh:281-285"
            fail: {code: runtime-error, status: 0, message: "= 'Invalid VLLM_CUSTOM_ALLREDUCE_ALGO: ' + vars.algo + '. Valid values: 1stage, oneshot, 2stage, twoshot'"}
      - if: "!(input.world_size in [2, 4, 6, 8])"
        then:
          - source: "csrc/custom_all_reduce.cuh:317-322"
            fail: {code: runtime-error, status: 0, message: "= 'custom allreduce only supports num gpus in (2,4,6,8). Actual num gpus = ' + string(input.world_size)"}
      - title: Kernel choice (REDUCE_CASE)
        detail: "Forced by the env var; else 2 GPUs always one-stage; fully connected 4 GPUs < 512 KB or 6/8 GPUs < 256 KB one-stage; otherwise two-stage (reduce-scatter then all-gather)."
        source: "csrc/custom_all_reduce.cuh:291-310"
        set:
          vars.kernel: "= vars.algo in ['1stage', 'oneshot'] ? '1stage' : (vars.algo in ['2stage', 'twoshot'] ? '2stage' : (input.world_size == 2 ? '1stage' : ((input.world_size <= 4 && input.bytes < 524288) || (input.world_size <= 8 && input.bytes < 262144) ? '1stage' : '2stage')))"
      - if: "vars.kernel == '1stage'"
        then:
          - call: custom-allreduce-cuda.cross-device-reduce-1stage
            input: {bytes: "= input.bytes", world_size: "= input.world_size", num_collectives: "= vars.n"}
        else:
          - call: custom-allreduce-cuda.cross-device-reduce-2stage
            input: {bytes: "= input.bytes", world_size: "= input.world_size", num_collectives: "= vars.n"}
      - return: {algorithm: "= 'custom-' + vars.kernel"}

  - component: custom-allreduce-cuda
    name: cross-device-reduce-1stage
    kind: kernel
    summary: "cross_device_reduce_1stage<T, ngpus>: barrier, every rank reads all peers' buffers and sums (bitwise-identical order), barrier."
    sources: ["csrc/custom_all_reduce.cuh:7-23"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-custom-ar-base-us']) + double(input.bytes) * double(input.world_size - 1) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: custom-allreduce-cuda
    name: cross-device-reduce-2stage
    kind: kernel
    summary: "cross_device_reduce_2stage<T, ngpus>: reduce-scatter into the peer tmp buffers, barrier, then all-gather."
    sources: ["csrc/custom_all_reduce.cuh:30-75"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (2.0 * double(config['dist-custom-ar-base-us']) + 2.0 * double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  # The _C_custom_ar all-gather / reduce-scatter torch ops (registered in custom_all_gather_reduce_scatter_ops.cpp).
  - component: custom-all-gather-reduce-scatter-ops
    name: custom-all-gather
    kind: kernel
    summary: "_C_custom_ar::custom_all_gather: copy the input into the registered IPC buffer and launch cross_device_all_gather<ngpus> (2/4/6/8 GPUs)."
    sources: ["csrc/custom_all_gather_reduce_scatter_ops.cpp:7-9", "csrc/custom_all_gather_reduce_scatter.cu:250-269", "csrc/custom_all_gather_reduce_scatter.cu:13-42", "csrc/custom_all_gather_reduce_scatter.cuh:17-36"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    latency_ms: "= ((double(config['dist-custom-ar-base-us']) + double(input.bytes) * double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"
    behavior:
      - if: "!(input.world_size in [2, 4, 6, 8])"
        then:
          - source: "csrc/custom_all_gather_reduce_scatter.cu:33-40"
            fail: {code: runtime-error, status: 0, message: "custom allgather only supports num gpus in (2,4,6,8)"}
      - title: Launch cross_device_all_gather
        source: "csrc/custom_all_gather_reduce_scatter.cu:25-29"
        return: {algorithm: cross_device_all_gather}

  - component: custom-all-gather-reduce-scatter-ops
    name: mnnvl-lamport-all-gather
    kind: kernel
    summary: "_C_custom_ar::mnnvl_lamport_all_gather: the input times world size must fit one Lamport stage; launch mnnvl_lamport_all_gather<T, ngpus> (2/4/6/8/16 GPUs) over the multicast buffer."
    sources: ["csrc/custom_all_gather_reduce_scatter_ops.cpp:10-12", "csrc/custom_all_gather_reduce_scatter.cu:271-318", "csrc/custom_all_gather_reduce_scatter.cu:44-102", "csrc/custom_all_gather_reduce_scatter.cuh:342-410"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    latency_ms: "= ((double(config['dist-custom-ar-base-us']) + double(input.bytes) * double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"
    behavior:
      - if: "!(input.world_size in [2, 4, 6, 8, 16])"
        then:
          - source: "csrc/custom_all_gather_reduce_scatter.cu:96-99"
            fail: {code: runtime-error, status: 0, message: "MNNVL Lamport allgather only supports num gpus in (2,4,6,8,16)"}
      - title: Launch mnnvl_lamport_all_gather with programmatic stream serialization
        source: "csrc/custom_all_gather_reduce_scatter.cu:61-77"
        return: {algorithm: mnnvl_lamport_all_gather}

  - component: custom-all-gather-reduce-scatter-ops
    name: custom-reduce-scatter
    kind: kernel
    summary: "_C_custom_ar::custom_reduce_scatter: copy into the registered IPC buffer and launch cross_device_reduce_scatter<T, ngpus> (2/4/6/8 GPUs)."
    sources: ["csrc/custom_all_gather_reduce_scatter_ops.cpp:14-16", "csrc/custom_all_gather_reduce_scatter.cu:320-363", "csrc/custom_all_gather_reduce_scatter.cu:104-132", "csrc/custom_all_gather_reduce_scatter.cuh:37-58"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    latency_ms: "= ((double(config['dist-custom-ar-base-us']) + double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"
    behavior:
      - if: "!(input.world_size in [2, 4, 6, 8])"
        then:
          - source: "csrc/custom_all_gather_reduce_scatter.cu:123-130"
            fail: {code: runtime-error, status: 0, message: "custom reduce-scatter only supports num gpus in (2,4,6,8)"}
      - title: Launch cross_device_reduce_scatter
        source: "csrc/custom_all_gather_reduce_scatter.cu:116-120"
        return: {algorithm: cross_device_reduce_scatter}

  - component: custom-all-gather-reduce-scatter-ops
    name: mnnvl-lamport-reduce-scatter
    kind: kernel
    summary: "_C_custom_ar::mnnvl_lamport_reduce_scatter: launch mnnvl_lamport_reduce_scatter_kernel<T, ngpus> (2/4/6/8/16 GPUs)."
    sources: ["csrc/custom_all_gather_reduce_scatter_ops.cpp:17-19", "csrc/custom_all_gather_reduce_scatter.cu:365-411", "csrc/custom_all_gather_reduce_scatter.cu:134-192", "csrc/custom_all_gather_reduce_scatter.cuh:411-470"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    latency_ms: "= ((double(config['dist-custom-ar-base-us']) + double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"
    behavior:
      - if: "!(input.world_size in [2, 4, 6, 8, 16])"
        then:
          - source: "csrc/custom_all_gather_reduce_scatter.cu:179-188"
            fail: {code: runtime-error, status: 0, message: "MNNVL Lamport reduce-scatter only supports num gpus in (2,4,6,8,16)"}
      - title: Launch mnnvl_lamport_reduce_scatter_kernel
        source: "csrc/custom_all_gather_reduce_scatter.cu:163-172"
        return: {algorithm: mnnvl_lamport_reduce_scatter_kernel}

  - component: custom-all-gather-reduce-scatter-ops
    name: mnnvl-multimem-reduce-scatter
    kind: kernel
    summary: "_C_custom_ar::mnnvl_multimem_reduce_scatter: barrier kernel, multimem reduce-scatter kernel, barrier kernel (2/4/8 GPUs, NVLS multicast, never on ROCm)."
    sources: ["csrc/custom_all_gather_reduce_scatter_ops.cpp:20-22", "csrc/custom_all_gather_reduce_scatter.cu:413-440", "csrc/custom_all_gather_reduce_scatter.cu:194-241", "csrc/custom_all_gather_reduce_scatter.cuh:113-130", "csrc/custom_all_gather_reduce_scatter.cuh:131-175"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    latency_ms: "= ((2.0 * double(config['dist-custom-ar-base-us']) + double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"
    behavior:
      - if: "!(input.world_size in [2, 4, 8])"
        then:
          - source: "csrc/custom_all_gather_reduce_scatter.cu:231-237"
            fail: {code: runtime-error, status: 0, message: "MNNVL multimem reduce-scatter only supports num gpus in (2,4,8)"}
      - title: Barrier, mnnvl_multimem_reduce_scatter_kernel, barrier
        source: "csrc/custom_all_gather_reduce_scatter.cu:220-229"
        return: {algorithm: mnnvl_multimem_reduce_scatter_kernel}

  # ---------------------------------------------------------------- P2P check
  - component: all-reduce-utils
    name: can-p2p
    kind: function
    summary: "custom_all_reduce._can_p2p: for every peer, trust torch's can_device_access_peer when VLLM_SKIP_P2P_CHECK, else the cached gpu_p2p_access_check."
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:86-100"]
    request: {type: object, required: [world_size, rank], properties: {world_size: {type: integer}, rank: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}, source: {type: string}}}
    behavior:
      - if: "config['vllm-skip-p2p-check']"
        then:
          - title: Trust the driver's P2P report
            source: "vllm/distributed/device_communicators/custom_all_reduce.py:90-97"
            return: {ok: "= !('driver' in state.p2p_ok) || state.p2p_ok.driver", source: driver}
      - call: all-reduce-utils.gpu-p2p-access-check
        input: {src: "= input.rank", tgt: "= (input.rank + 1) % input.world_size"}
        as: chk
      - return: {ok: "= vars.chk.value.ok", source: cache}

  - component: all-reduce-utils
    name: gpu-p2p-access-check
    kind: function
    summary: "gpu_p2p_access_check: answer from the in-process cache; otherwise the local master (local_rank 0) generates the JSON cache file by running this module as a subprocess, a barrier waits for it, then every rank reads it."
    sources: ["vllm/distributed/device_communicators/all_reduce_utils.py:344-433"]
    request: {type: object, required: [src, tgt], properties: {src: {type: integer}, tgt: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}, generated: {type: boolean}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - if: "state.cache_loaded"
        then:
          - source: "vllm/distributed/device_communicators/all_reduce_utils.py:348-350"
            return: {ok: "= !('pair' in state.p2p_ok) || state.p2p_ok.pair", generated: false}
      - if: "!state.cache_file_exists"
        then:
          - title: Local master generates the cache with a subprocess
            source: "vllm/distributed/device_communicators/all_reduce_utils.py:369-421"
            call: all-reduce-utils.main
            input: {pairs: 2}
            as: probe
          - set: {state.cache_file_exists: true, state.p2p_ok: "= merge(state.p2p_ok, {'pair': vars.probe.value.ok})"}
      - title: Read the cache file after the world barrier
        source: "vllm/distributed/device_communicators/all_reduce_utils.py:422-428"
        set: {state.cache_loaded: true}
      - return: {ok: "= !('pair' in state.p2p_ok) || state.p2p_ok.pair", generated: "= has(vars.probe)"}

  - component: all-reduce-utils
    name: main
    kind: cli
    summary: "all_reduce_utils.py __main__: the probe subprocess. Reads (batch_src, batch_tgt, output_file) from stdin, runs can_actually_p2p (real IPC writes between GPU pairs), pickles the results to the file. A non-zero exit becomes a RuntimeError in the parent."
    sources: ["vllm/distributed/device_communicators/all_reduce_utils.py:436-440", "vllm/distributed/device_communicators/all_reduce_utils.py:244-327"]
    request: {type: object, properties: {pairs: {type: integer, default: 2}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    latency_ms: 2000
    behavior:
      - choice: probe
        default: ok
        options:
          ok:
            - return: {ok: true}
          broken:
            - title: Driver claims P2P but the IPC write does not arrive
              source: "vllm/distributed/device_communicators/all_reduce_utils.py:244-257"
              return: {ok: false}
          crashed:
            - title: The subprocess failed; the parent wraps it
              source: "vllm/distributed/device_communicators/all_reduce_utils.py:408-416"
              fail: {code: runtime-error, status: 0, message: "Error happened when batch testing peer-to-peer access"}

flows:
  - id: distributed-tp-all-reduce
    tags: ["feature:tensor-parallel"]
    name: Tensor-parallel all-reduce
    description: "The seam tensor-model-parallel.all-reduce as models-layers calls it after a row-parallel layer."
    entry: {caller: gpu-worker, interface: tensor-model-parallel.all-reduce, input: {num_tokens: 128, hidden_size: 4096, dtype: bfloat16}}
    sources: ["vllm/distributed/communication_op.py:12-14"]
  - id: distributed-tp-all-gather
    name: Tensor-parallel all-gather
    entry: {caller: gpu-worker, interface: tensor-model-parallel.all-gather, input: {num_tokens: 128, hidden_size: 4096, dim: -1}}
    sources: ["vllm/distributed/communication_op.py:17-21"]
  - id: distributed-tp-reduce-scatter
    name: Tensor-parallel reduce-scatter
    entry: {caller: gpu-worker, interface: tensor-model-parallel.reduce-scatter, input: {num_tokens: 128, hidden_size: 4096, dim: 0}}
    sources: ["vllm/distributed/communication_op.py:24-28"]
  - id: distributed-sp-custom-collectives
    name: Sequence-parallel custom all-gather
    description: "The sequence-parallel ops of models/common call CudaCommunicator.custom_all_gather / custom_reduce_scatter; the reduce-scatter path is a scenario step on the same world."
    entry: {caller: gpu-worker, interface: cuda-communicator.custom-all-gather, input: {num_tokens: 128, hidden_size: 4096}}
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:448-458"]
  - id: distributed-sp-custom-reduce-scatter
    name: Sequence-parallel custom reduce-scatter
    entry: {caller: gpu-worker, interface: cuda-communicator.custom-reduce-scatter, input: {num_tokens: 128, hidden_size: 4096}}
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:454-458"]
  - id: distributed-init-world
    name: Initialize the distributed environment
    tags: [writes]
    entry: {caller: gpu-worker, interface: parallel-state.init-distributed-environment, input: {world_size: 1, rank: 0}}
    sources: ["vllm/distributed/parallel_state.py:1814-2016"]
  - id: distributed-init-model-parallel
    name: Ensure model-parallel groups
    tags: [writes]
    entry: {caller: gpu-worker, interface: parallel-state.ensure-model-parallel-initialized, input: {tensor_model_parallel_size: 1, pipeline_model_parallel_size: 1}}
    sources: ["vllm/distributed/parallel_state.py:2366-2415"]
  - id: distributed-pp-group
    name: Read the PP group
    entry: {caller: gpu-worker, interface: parallel-state.get-pp-group}
    sources: ["vllm/distributed/parallel_state.py:1638-1640"]
  - id: distributed-tp-world-size
    name: Read the TP world size
    entry: {caller: gpu-worker, interface: parallel-state.get-tensor-model-parallel-world-size}
    sources: ["vllm/distributed/parallel_state.py:2437-2439"]
  - id: distributed-destroy-model-parallel
    name: Destroy model-parallel groups
    tags: [writes]
    entry: {caller: gpu-worker, interface: parallel-state.destroy-model-parallel}
    sources: ["vllm/distributed/parallel_state.py:2458-2503"]
  - id: distributed-custom-ar-init
    name: Build the custom all-reduce
    tags: [writes]
    entry: {caller: gpu-worker, interface: custom-allreduce.init, input: {world_size: 4}}
    sources: ["vllm/distributed/device_communicators/custom_all_reduce.py:137-330"]
  - id: distributed-set-custom-all-reduce
    name: Toggle the custom all-reduce
    tags: [writes]
    entry: {caller: gpu-worker, interface: parallel-state.set-custom-all-reduce, input: {enable: false}}
    sources: ["vllm/distributed/parallel_state.py:1711-1713"]
  - id: distributed-fused-matmul-reduce-scatter
    name: Async-TP fused matmul reduce-scatter op
    entry: {caller: gpu-worker, interface: parallel-state.patched-fused-scaled-matmul-reduce-scatter, input: {group_name: "tp:0", num_tokens: 2048, hidden_size: 8192, world_size: 4}}
    sources: ["vllm/distributed/parallel_state.py:416-423"]

scenarios:
  # ---- all-reduce
  - id: distributed-all-reduce-tp1-bypass
    flow: distributed-tp-all-reduce
    fixtures: [tp1-llama-8b]
    expect:
      - "result.ok && result.value.backend == 'bypass'"
