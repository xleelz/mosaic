    store: {table: groups, op: get, key: pp, not_found: assertion-error}

  - component: parallel-state
    name: get-tensor-model-parallel-world-size
    kind: function
    summary: "get_tp_group().world_size, the read path for the TP layout."
    sources: ["vllm/distributed/parallel_state.py:2437-2439"]
