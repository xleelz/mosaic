# distributed area, part 12 (fix round 5, precision): the expert-parallel group's all-to-all
# (GroupCoordinator.dispatch/combine, the AgRs all2all manager, all_gatherv/reduce_scatterv), the
# NIXL push scheduler's request_finished, the shared Mooncake Store config and setup (KV and EC
# clients), and the nccl_m2n trainer init-info validation. Scenarios here are the round-5
# regressions; the round-5 unit tests are in build-oracle/round5/distributed.yaml.
schema_version: 1
id: vllm

configs:
  - id: all2all-backend
    type: string
    value: allgather_reducescatter
    default: allgather_reducescatter
    summary: "--all2all-backend (parallel_config.all2all_backend): the MoE all-to-all implementation the EP group's communicator builds when ParallelConfig.use_all2all; naive and allgather_reducescatter both use AgRsAll2AllManager"
    sources: ["vllm/config/parallel.py:219", "vllm/engine/arg_utils.py:558"]
    attributes: {key: all2all_backend}
  - id: mooncake-config-path
    type: string
    value: null
    default: null
    summary: "MOONCAKE_CONFIG_PATH: the JSON file MooncakeStoreConfig.load_from_config reads (os.getenv; unset in every shared world)"
    sources: ["vllm/distributed/mooncake_store.py:72-78"]
    attributes: {key: MOONCAKE_CONFIG_PATH, env: true}

components:
  - id: ag-rs-all2all-manager
    name: AgRsAll2AllManager
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "The all2all manager of an EP communicator for the naive and allgather_reducescatter backends: dispatch all-gathers the tokens (and their top-k weights and ids) from every DP rank, combine reduce-scatters the expert outputs back."
    sources: ["vllm/distributed/device_communicators/all2all.py:67-77"]
  - id: nixl-push-connector-scheduler
    name: NixlPushConnectorScheduler
    kind: module
    layer: kv-transfer
    parent: engine-core
    capacity: {concurrency: 1}   # the scheduler-role connector is driven only by the engine-core busy loop (scheduler.py)
    summary: "Scheduler side of the NIXL push (WRITE) connector: on the prefill node a finished request's blocks are kept under a lease and handed to the workers, which push them once the decoder registers."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:207-294"]
    state:
      schema:
        type: object
        properties:
          engine_id: {type: string}
          side_channel_host: {type: string}
          side_channel_port: {type: integer}
          transfer_tp_size: {type: integer}
          reqs_need_recv: {type: object}
          reqs_need_send: {type: object}
          reqs_need_save: {type: object}
          reqs_not_processed: {type: array}
          push_registration_deadlines: {type: object}
          finished_request_blocks: {type: object}
          newly_finished_push_blocks: {type: object}
          heartbeats: {type: array}
      initial: {engine_id: engine-p0, side_channel_host: "10.0.0.1", side_channel_port: 5600, transfer_tp_size: 1, reqs_need_recv: {}, reqs_need_send: {}, reqs_need_save: {}, reqs_not_processed: [], push_registration_deadlines: {}, finished_request_blocks: {}, newly_finished_push_blocks: {}, heartbeats: []}
  - id: mooncake-store-config
    name: vllm.distributed.mooncake_store (module)
    kind: module
    layer: kv-transfer
    parent: gpu-worker
    summary: "Configuration and setup shared by the EC and KV Mooncake Store clients: MooncakeStoreConfig (read from the MOONCAKE_CONFIG_PATH JSON file and validated) and setup_mooncake_store, which forwards a non-default tenant_id to the native store."
    sources: ["vllm/distributed/mooncake_store.py:20-49", "vllm/distributed/mooncake_store.py:126-143"]
  - id: mooncake-distributed-store
    name: MooncakeDistributedStore (native client)
    kind: module
    layer: kv-transfer
    parent: gpu-worker
    summary: "The mooncake.store.MooncakeDistributedStore object a client builds; the model records each setup() call (positional arguments and keyword arguments) and answers the configured return code."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:1418-1422"]
    state:
      schema: {type: object, properties: {setup_ret: {type: integer}, setup_calls: {type: array}}}
      initial: {setup_ret: 0, setup_calls: []}
  - id: mooncake-embedding-store-client
    name: MooncakeEmbeddingStoreClient (factory)
    kind: module
    layer: ec-transfer
    parent: gpu-worker
    summary: "create_mooncake_embedding_store_client: the EC (cross-encoder cache) Mooncake Store client; RAM store only."
    sources: ["vllm/distributed/ec_transfer/ec_connector/mooncake_store_embedding/store_client.py:87-123"]
  - id: m2n-trainer-init-info
    name: M2NTrainerInitInfo
    kind: module
    layer: weight-transfer
    parent: gpu-worker
    summary: "Trainer-side init info of the nccl_m2n weight transfer: the rendezvous mode and the rank layout (trainer ranks first, then the inference workers, and the destination mesh) are validated when the dataclass is built."
    sources: ["vllm/distributed/weight_transfer/m2n_trainer.py:63-122"]

interfaces:
  - component: local-disk
    name: read-file
    kind: io
    summary: Read a file from local disk (shared infrastructure); a missing file is FileNotFoundError.
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [path], properties: {path: {type: string}}}
    errors:
      - {code: file-not-found-error, status: 0, retryable: false}
    store: {table: files, op: get, key: "= input.path", not_found: file-not-found-error}

  # ---------------------------------------------------------------- EP group: get, dispatch, combine
  - component: parallel-state
    name: get-ep-group
    kind: function
    summary: "get_ep_group: the expert-parallel GroupCoordinator (MoE models only): its size, unique name, whether it uses all-to-all, and the all2all manager its communicator built."
    sources: ["vllm/distributed/parallel_state.py:1654-1660"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {world_size: {type: integer}, unique_name: {type: string}, use_all2all: {type: boolean}, all2all_manager: {type: [string, "null"]}, rank_in_group: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "!('ep' in state.groups)"
        then:
          - source: "vllm/distributed/parallel_state.py:1655-1659"
            fail: {code: assertion-error, status: 0, message: "expert parallel group is not initialized. EP group is only created for MoE models with num_experts > 0. This function should only be called for MoE models."}
      - set: {vars.g: "= state.groups.ep"}
      - return:
          world_size: "= vars.g.world_size"
          unique_name: "= vars.g.unique_name"
          use_all2all: "= has(vars.g.use_all2all) && vars.g.use_all2all"
          all2all_manager: "= has(vars.g.all2all_manager) ? vars.g.all2all_manager : null"
          rank_in_group: "= int(self.replace('rank', '')) % vars.g.world_size"

  - component: parallel-state
    name: get-dp-group
    kind: function
    summary: "get_dp_group: the data-parallel GroupCoordinator."
    sources: ["vllm/distributed/parallel_state.py:1646-1648"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {world_size: {type: integer}, unique_name: {type: string}, rank_in_group: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "!('dp' in state.groups)"
        then:
          - source: "vllm/distributed/parallel_state.py:1647"
            fail: {code: assertion-error, status: 0, message: "data parallel group is not initialized"}
      - return: {world_size: "= state.groups.dp.world_size", unique_name: "= state.groups.dp.unique_name", rank_in_group: "= int(self.replace('rank', '')) % state.groups.dp.world_size"}

  - component: parallel-state
    name: get-pcp-group
    kind: function
    summary: "get_pcp_group: the prefill-context-parallel GroupCoordinator."
    sources: ["vllm/distributed/parallel_state.py:1678-1680"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {world_size: {type: integer}, unique_name: {type: string}, rank_in_group: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "!('pcp' in state.groups)"
        then:
          - source: "vllm/distributed/parallel_state.py:1679"
            fail: {code: assertion-error, status: 0, message: "prefill context parallel group is not initialized"}
      - return: {world_size: "= state.groups.pcp.world_size", unique_name: "= state.groups.pcp.unique_name", rank_in_group: "= int(self.replace('rank', '')) % state.groups.pcp.world_size"}

  - component: group-coordinator
    name: dispatch
    kind: function
    summary: "GroupCoordinator.dispatch on the EP group (the MoE prepare step): the CUDA communicator hands it to its all2all manager, which must exist (the group must use all-to-all); without a device communicator the tensors pass through."
    sources: ["vllm/distributed/parallel_state.py:1430-1450", "vllm/distributed/device_communicators/cuda_communicator.py:1025-1046"]
    attributes: {seam: true, callers: [models-layers]}
    request:
      type: object
      required: [num_tokens]
      properties:
        num_tokens: {type: integer, examples: [3], description: "rows of hidden_states on this rank"}
        hidden_size: {type: integer, default: 4096}
        top_k: {type: integer, default: 2}
        is_sequence_parallel: {type: boolean, default: false}
        dp_chunk_sizes: {type: [array, "null"], default: null, items: {type: integer}, description: "forward_context.dp_metadata.get_chunk_sizes_across_dp_rank()"}
        has_device_communicator: {type: boolean, default: true}
    response: DistAll2AllResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - if: "!(has(input.has_device_communicator) ? input.has_device_communicator : true)"
        then:
          - title: No device communicator; the inputs are returned unchanged
            source: "vllm/distributed/parallel_state.py:1449-1450"
            return: {num_tokens: "= input.num_tokens", sizes: "= [input.num_tokens]", comm_group: none, manager: none}
      - call: parallel-state.get-ep-group
        as: ep
      - if: "vars.ep.value.all2all_manager == null"
        then:
          - title: "assert self.all2all_manager is not None (the EP group was built without all-to-all)"
            source: "vllm/distributed/device_communicators/cuda_communicator.py:1039"
            fail: {code: assertion-error, status: 0, message: ""}
      - if: "vars.ep.value.all2all_manager == 'AgRsAll2AllManager'"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:1040-1046"
            call: ag-rs-all2all-manager.dispatch
            input: "= input"
            as: d
          - return: "= vars.d.value"
      - title: "The other managers (DeepEP, MoRI, FlashInfer, NIXL EP, MoonEP, passthrough) dispatch inside their kernels; not modeled"
        source: "vllm/distributed/device_communicators/cuda_communicator.py:1040-1046"
        return: {num_tokens: "= input.num_tokens", sizes: "= [input.num_tokens]", comm_group: ep, manager: "= vars.ep.value.all2all_manager"}

  - component: group-coordinator
    name: combine
    kind: function
    summary: "GroupCoordinator.combine on the EP group (the MoE finalize step): the CUDA communicator hands it to its all2all manager, which must exist; without a device communicator the tensor passes through."
    sources: ["vllm/distributed/parallel_state.py:1452-1458", "vllm/distributed/device_communicators/cuda_communicator.py:1048-1058"]
    attributes: {seam: true, callers: [models-layers]}
    request:
      type: object
      required: [num_tokens]
      properties:
        num_tokens: {type: integer, examples: [8], description: "rows of the expert output (the gathered tokens)"}
        hidden_size: {type: integer, default: 4096}
        is_sequence_parallel: {type: boolean, default: false}
        dp_chunk_sizes: {type: [array, "null"], default: null, items: {type: integer}}
        has_device_communicator: {type: boolean, default: true}
    response: DistAll2AllResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - if: "!(has(input.has_device_communicator) ? input.has_device_communicator : true)"
        then:
          - source: "vllm/distributed/parallel_state.py:1455-1458"
            return: {num_tokens: "= input.num_tokens", sizes: "= [input.num_tokens]", comm_group: none, manager: none}
      - call: parallel-state.get-ep-group
        as: ep
      - if: "vars.ep.value.all2all_manager == null"
        then:
          - title: "assert self.all2all_manager is not None"
            source: "vllm/distributed/device_communicators/cuda_communicator.py:1054"
            fail: {code: assertion-error, status: 0, message: ""}
      - if: "vars.ep.value.all2all_manager == 'AgRsAll2AllManager'"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:1055-1058"
            call: ag-rs-all2all-manager.combine
            input: "= input"
            as: c
          - return: "= vars.c.value"
      - source: "vllm/distributed/device_communicators/cuda_communicator.py:1055-1058"
        return: {num_tokens: "= input.num_tokens", sizes: "= [input.num_tokens]", comm_group: ep, manager: "= vars.ep.value.all2all_manager"}

  - component: ag-rs-all2all-manager
    name: dispatch
    kind: function
    summary: "AgRsAll2AllManager.dispatch: pick the group (EP when sequence parallel, else DP when DP > 1 (EP with PCP > 1 would use EP), else PCP), take the per-rank token counts (equal at DP 1, else the forward context's DP chunk sizes), check this rank's count, and all_gatherv the hidden states with their top-k weights and ids."
    sources: ["vllm/distributed/device_communicators/all2all.py:128-161", "vllm/distributed/device_communicators/all2all.py:79-97"]
    request:
      type: object
      required: [num_tokens]
      properties:
        num_tokens: {type: integer}
        hidden_size: {type: integer, default: 4096}
        top_k: {type: integer, default: 2}
        is_sequence_parallel: {type: boolean, default: false}
        dp_chunk_sizes: {type: [array, "null"], default: null, items: {type: integer}}
    response: DistAll2AllResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - call: ag-rs-all2all-manager.comm-group
        input: {is_sequence_parallel: "= (has(input.is_sequence_parallel) ? input.is_sequence_parallel : false)"}
        as: g
      - call: ag-rs-all2all-manager.get-sizes
        input: {num_local_tokens: "= input.num_tokens", world_size: "= vars.g.value.world_size", dp_world_size: "= vars.g.value.dp_world_size", dp_chunk_sizes: "= (has(input.dp_chunk_sizes) ? input.dp_chunk_sizes : null)"}
        as: sz
      - if: "vars.sz.value.sizes[vars.g.value.rank_in_group] != input.num_tokens"
        then:
          - title: "assert sizes[dist_group.rank_in_group] == hidden_states.shape[0]"
            source: "vllm/distributed/device_communicators/all2all.py:141"
            fail: {code: assertion-error, status: 0, message: ""}
      - title: "all_gatherv([hidden_states, topk_weights, topk_ids], dim=0, sizes)"
        source: "vllm/distributed/device_communicators/all2all.py:143-161"
        call: cuda-communicator.all-gatherv
        input: {group_name: "= vars.g.value.unique_name", world_size: "= vars.g.value.world_size", rank_in_group: "= vars.g.value.rank_in_group", num_tokens: "= input.num_tokens", hidden_size: "= (has(input.hidden_size) ? input.hidden_size : 4096)", sizes: "= vars.sz.value.sizes", num_tensors: 3}
        as: ag
      - return: {num_tokens: "= vars.ag.value.num_tokens", sizes: "= vars.sz.value.sizes", comm_group: "= vars.g.value.name", manager: AgRsAll2AllManager}

  - component: ag-rs-all2all-manager
    name: combine
    kind: function
    summary: "AgRsAll2AllManager.combine: on the same group, reduce_scatterv the expert outputs so each rank keeps its own tokens (sizes from num_tokens // world_size at DP 1, else the DP chunk sizes)."
    sources: ["vllm/distributed/device_communicators/all2all.py:163-173"]
    request:
      type: object
      required: [num_tokens]
      properties:
        num_tokens: {type: integer}
        hidden_size: {type: integer, default: 4096}
        is_sequence_parallel: {type: boolean, default: false}
        dp_chunk_sizes: {type: [array, "null"], default: null, items: {type: integer}}
    response: DistAll2AllResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - call: ag-rs-all2all-manager.comm-group
        input: {is_sequence_parallel: "= (has(input.is_sequence_parallel) ? input.is_sequence_parallel : false)"}
        as: g
      - call: ag-rs-all2all-manager.get-sizes
        input: {num_local_tokens: "= input.num_tokens / vars.g.value.world_size", world_size: "= vars.g.value.world_size", dp_world_size: "= vars.g.value.dp_world_size", dp_chunk_sizes: "= (has(input.dp_chunk_sizes) ? input.dp_chunk_sizes : null)"}
        as: sz
      - source: "vllm/distributed/device_communicators/all2all.py:172"
        call: cuda-communicator.reduce-scatterv
        input: {group_name: "= vars.g.value.unique_name", world_size: "= vars.g.value.world_size", rank_in_group: "= vars.g.value.rank_in_group", num_tokens: "= input.num_tokens", hidden_size: "= (has(input.hidden_size) ? input.hidden_size : 4096)", sizes: "= vars.sz.value.sizes"}
        as: rs
      - return: {num_tokens: "= vars.rs.value.num_tokens", sizes: "= vars.sz.value.sizes", comm_group: "= vars.g.value.name", manager: AgRsAll2AllManager}

  - component: ag-rs-all2all-manager
    name: comm-group
    kind: function
    summary: "_get_comm_group: EP when sequence parallel; with DP > 1, EP if expert parallel and PCP > 1 (TP must then be 1), else DP; at DP 1 the PCP group. Returns the group with the DP world size the manager caches."
    sources: ["vllm/distributed/device_communicators/all2all.py:76-87", "vllm/distributed/device_communicators/base_device_communicator.py:51-57"]
    request: {type: object, properties: {is_sequence_parallel: {type: boolean, default: false}}}
    response: {type: object, properties: {name: {type: string}, world_size: {type: integer}, unique_name: {type: string}, rank_in_group: {type: integer}, dp_world_size: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - call: parallel-state.get-dp-group
        as: dp
      - call: parallel-state.get-pcp-group
        as: pcp
      - call: parallel-state.get-tp-group
        as: tp
      - if: "(has(input.is_sequence_parallel) ? input.is_sequence_parallel : false)"
        then:
          - source: "vllm/distributed/device_communicators/all2all.py:77-78"
            set: {vars.name: ep}
        else:
          - if: "vars.dp.value.world_size > 1"
            then:
              - if: "config['enable-expert-parallel'] && vars.pcp.value.world_size > 1"
                then:
                  - if: "vars.tp.value.world_size != 1"
                    then:
                      - source: "vllm/distributed/device_communicators/all2all.py:81-83"
                        fail: {code: assertion-error, status: 0, message: "DP+PCP with TP>1 requires sequence-parallel MoE inputs"}
                  - set: {vars.name: ep}
                else:
                  - source: "vllm/distributed/device_communicators/all2all.py:85"
                    set: {vars.name: dp}
            else:
              - source: "vllm/distributed/device_communicators/all2all.py:86"
                set: {vars.name: pcp}
      - if: "vars.name == 'ep'"
        then:
          - call: parallel-state.get-ep-group
            as: ep
          - return: {name: ep, world_size: "= vars.ep.value.world_size", unique_name: "= vars.ep.value.unique_name", rank_in_group: "= vars.ep.value.rank_in_group", dp_world_size: "= vars.dp.value.world_size"}
      - set: {vars.grp: "= vars.name == 'dp' ? vars.dp.value : vars.pcp.value"}
      - return: {name: "= vars.name", world_size: "= vars.grp.world_size", unique_name: "= vars.grp.unique_name", rank_in_group: "= vars.grp.rank_in_group", dp_world_size: "= vars.dp.value.world_size"}

  - component: ag-rs-all2all-manager
    name: get-sizes
    kind: function
    summary: "_get_sizes: at DP 1 every rank has num_local_tokens; otherwise the forward context's DP metadata gives each rank's chunk, one per rank of the group."
    sources: ["vllm/distributed/device_communicators/all2all.py:89-97"]
    request: {type: object, required: [num_local_tokens, world_size, dp_world_size], properties: {num_local_tokens: {type: integer}, world_size: {type: integer}, dp_world_size: {type: integer}, dp_chunk_sizes: {type: [array, "null"], default: null}}}
    response: {type: object, properties: {sizes: {type: array, items: {type: integer}}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "input.dp_world_size == 1"
        then:
          - source: "vllm/distributed/device_communicators/all2all.py:90-91"
            return: {sizes: "= lists.range(input.world_size).map(i, input.num_local_tokens)"}
      - if: "(has(input.dp_chunk_sizes) ? input.dp_chunk_sizes : null) == null"
        then:
          - title: "assert dp_metadata is not None / sizes is not None"
            source: "vllm/distributed/device_communicators/all2all.py:93-96"
            fail: {code: assertion-error, status: 0, message: ""}
      - if: "size((has(input.dp_chunk_sizes) ? input.dp_chunk_sizes : null)) != input.world_size"
        then:
          - title: "assert len(sizes) == comm_group.world_size"
            source: "vllm/distributed/device_communicators/all2all.py:96"
            fail: {code: assertion-error, status: 0, message: ""}
      - return: {sizes: "= (has(input.dp_chunk_sizes) ? input.dp_chunk_sizes : null)"}

  - component: cuda-communicator
    name: all-gatherv
    kind: function
    summary: "CudaCommunicator.all_gatherv: dim 0 only; equal sizes drop to a plain all-gather; PyNccl gathers each tensor (this rank's rows must match sizes[rank]) into sum(sizes) rows, once every rank of the group has called."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:884-960"]
    request:
      type: object
      required: [group_name, world_size, num_tokens]
      properties:
        group_name: {type: string, examples: ["dp:0"]}
        world_size: {type: integer}
        rank_in_group: {type: integer, default: 0}
        num_tokens: {type: integer}
        hidden_size: {type: integer, default: 4096}
        sizes: {type: [array, "null"], default: null, items: {type: integer}}
        dim: {type: integer, default: 0}
        num_tensors: {type: integer, default: 1}
    response: DistCollectiveResult
    errors:
      - {code: not-implemented-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - if: "(has(input.dim) ? input.dim : 0) != 0"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:890-891"
            fail: {code: not-implemented-error, status: 0, message: "only dim 0 all-gatherv is supported"}
      - title: "'sizes' is not needed if all inputs have the same shape"
        source: "vllm/distributed/device_communicators/cuda_communicator.py:894-897"
        set:
          vars.in_sizes: "= has(input.sizes) ? input.sizes : null"
      - set:
          vars.sizes: "= vars.in_sizes != null && vars.in_sizes.all(s, s == vars.in_sizes[0]) ? null : vars.in_sizes"
      - call: pynccl-communicator.status
        as: pn
      - if: "vars.pn.value.disabled"
        then:
          - title: "assert pynccl_comm is not None and not pynccl_comm.disabled"
            source: "vllm/distributed/device_communicators/cuda_communicator.py:911-912"
            fail: {code: assertion-error, status: 0, message: ""}
      - if: "vars.sizes != null && size(vars.sizes) != input.world_size"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:924"
            fail: {code: assertion-error, status: 0, message: ""}
      - if: "vars.sizes != null && input.num_tokens != vars.sizes[(has(input.rank_in_group) ? input.rank_in_group : 0)]"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:925-927"
            fail: {code: assertion-error, status: 0, message: "= string(input.num_tokens) + ' != ' + string(vars.sizes[(has(input.rank_in_group) ? input.rank_in_group : 0)])"}
      - title: Every rank of the group calls the collective once
        source: "vllm/distributed/device_communicators/cuda_communicator.py:934-937"
        rendezvous: "= 'allgatherv:' + input.group_name"
        count: "= input.world_size"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        latency_ms: "= (double(config['dist-nccl-base-us']) + double(input.num_tokens * (has(input.hidden_size) ? input.hidden_size : 4096) * 2 * (has(input.num_tensors) ? input.num_tensors : 1)) * double(input.world_size - 1) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - return:
          backend: "= vars.sizes != null ? 'pynccl-allgatherv' : 'pynccl'"
          bytes: "= input.num_tokens * (has(input.hidden_size) ? input.hidden_size : 4096) * 2 * (has(input.num_tensors) ? input.num_tensors : 1)"
          world_size: "= input.world_size"
          num_tokens: "= vars.sizes != null ? sum(vars.sizes) : input.num_tokens * input.world_size"

  - component: cuda-communicator
    name: reduce-scatterv
    kind: function
    summary: "CudaCommunicator.reduce_scatterv: PyNccl is required; equal sizes drop to an even split (rows must divide by the world size); otherwise the rows must sum to the sizes and this rank keeps sizes[rank_in_group]."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:533-536", "vllm/distributed/device_communicators/cuda_communicator.py:547-578"]
    request:
      type: object
      required: [group_name, world_size, num_tokens]
      properties:
        group_name: {type: string, examples: ["dp:0"]}
        world_size: {type: integer}
        rank_in_group: {type: integer, default: 0}
        num_tokens: {type: integer}
        hidden_size: {type: integer, default: 4096}
        sizes: {type: [array, "null"], default: null, items: {type: integer}}
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - call: pynccl-communicator.status
        as: pn
      - if: "vars.pn.value.disabled"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:556"
            fail: {code: assertion-error, status: 0, message: "reduce_scatterv requires PyNccl"}
      - source: "vllm/distributed/device_communicators/cuda_communicator.py:563-566"
        set:
          vars.in_sizes: "= has(input.sizes) ? input.sizes : null"
      - set:
          vars.sizes: "= vars.in_sizes != null && vars.in_sizes.all(s, s == vars.in_sizes[0]) ? null : vars.in_sizes"
      - if: "vars.sizes != null"
        then:
          - if: "size(vars.sizes) != input.world_size"
            then:
              - source: "vllm/distributed/device_communicators/cuda_communicator.py:573"
                fail: {code: assertion-error, status: 0, message: "= string(size(vars.sizes)) + ' == ' + string(input.world_size)"}
          - if: "input.num_tokens != sum(vars.sizes)"
            then:
              - source: "vllm/distributed/device_communicators/cuda_communicator.py:574"
                fail: {code: assertion-error, status: 0, message: ""}
          - set: {vars.chunk: "= vars.sizes[(has(input.rank_in_group) ? input.rank_in_group : 0)]"}
        else:
          - if: "input.num_tokens % input.world_size != 0"
            then:
              - source: "vllm/distributed/device_communicators/cuda_communicator.py:577"
                fail: {code: assertion-error, status: 0, message: ""}
          - set: {vars.chunk: "= input.num_tokens / input.world_size"}
      - title: Every rank of the group calls the collective once
        source: "vllm/distributed/device_communicators/cuda_communicator.py:547-551"
        rendezvous: "= 'reducescatterv:' + input.group_name"
        count: "= input.world_size"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        latency_ms: "= (double(config['dist-nccl-base-us']) + double(input.num_tokens * (has(input.hidden_size) ? input.hidden_size : 4096) * 2) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - return:
          backend: "= vars.sizes != null ? 'pynccl-reducescatterv' : 'pynccl'"
          bytes: "= input.num_tokens * (has(input.hidden_size) ? input.hidden_size : 4096) * 2"
          world_size: "= input.world_size"
          num_tokens: "= vars.chunk"

  # ---------------------------------------------------------------- NIXL push scheduler
  - component: nixl-push-connector-scheduler
    name: request-finished
    kind: function
    summary: "NixlPushConnectorScheduler.request_finished: no params frees now; stop the heartbeat and drop any registration deadline; a request still marked do_remote_prefill was aborted before scheduling and registers an empty recv; a D-side request is a no-op; an unfinished P-side request is marked not processed. A finished P-side request with blocks keeps them under the lease and stashes them for the workers; with no blocks it frees now. Either way it returns the push parameters for the decoder."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:207-294"]
    request: DistKvRequest
    response: DistKvFinished
    behavior:
      - set:
          vars.p: "= has(input.kv_transfer_params) && input.kv_transfer_params != null ? input.kv_transfer_params : {}"
      - if: "size(vars.p) == 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:223-224"
            return: {delay_free_blocks: false, kv_transfer_params: null}
      - title: Stop the heartbeat and drop the pending registration deadline
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:226-231"
        set:
          vars.is_p: "= 'do_remote_decode' in vars.p && vars.p.do_remote_decode == true"
          state.heartbeats: "= state.heartbeats.filter(r, r != input.request_id)"
          state.push_registration_deadlines: "= state.push_registration_deadlines.transformMapEntry(k, v, k != input.request_id, {k: v})"
      - if: "'do_remote_prefill' in vars.p && vars.p.do_remote_prefill == true"
        then:
          - title: Aborted before it was scheduled; register an empty recv so the worker notifies P to free its blocks
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:233-245"
            set:
              state.reqs_need_recv: "= merge(state.reqs_need_recv, {input.request_id: {'local_block_ids': [], 'remote_block_ids': [], 'park': false}})"
          - return: {delay_free_blocks: false, kv_transfer_params: null}
      - if: "!vars.is_p"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:247-250"
            return: {delay_free_blocks: false, kv_transfer_params: null}
      - if: "!(input.status in ['FINISHED_LENGTH_CAPPED', 'FINISHED_STOPPED'])"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:252-258"
            set:
              state.reqs_not_processed: "= state.reqs_not_processed + [input.request_id]"
              state.reqs_need_save: "= state.reqs_need_save.transformMapEntry(k, v, k != input.request_id, {k: v})"
          - return: {delay_free_blocks: false, kv_transfer_params: null}
      - set:
          vars.blocks: "= has(input.block_ids) ? input.block_ids : []"
      - set:
          vars.delay: "= vars.blocks.exists(g, size(g) > 0)"
      - if: "vars.delay"
        then:
          - title: "Keep the blocks for the lease and stash them for the workers to match with D's registration (get_exchange_clipped_blocks is the identity without sliding-window or Mamba groups)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:262-279"
            set:
              state.reqs_need_send: "= merge(state.reqs_need_send, {input.request_id: now + config['nixl-kv-lease-duration'] * 1000})"
              state.finished_request_blocks: "= merge(state.finished_request_blocks, {input.request_id: vars.blocks})"
              state.newly_finished_push_blocks: "= merge(state.newly_finished_push_blocks, {input.request_id: vars.blocks})"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:281-294"
        return:
          delay_free_blocks: "= vars.delay"
          kv_transfer_params:
            do_remote_prefill: true
            do_remote_decode: false
            remote_block_ids: "= vars.blocks"
            remote_engine_id: "= state.engine_id"
            remote_request_id: "= input.request_id"
            remote_host: "= state.side_channel_host"
            remote_port: "= state.side_channel_port"
            tp_size: "= state.transfer_tp_size"
            dcp_size: 1
            pp_size: "= config['pipeline-parallel-size']"
            remote_num_tokens: "= vars.delay ? input.num_computed_tokens : 0"
            transfer_mode: push

  # ---------------------------------------------------------------- Mooncake Store config and setup
  - component: mooncake-store-config
    name: load-from-config
    kind: function
    summary: "MooncakeStoreConfig.load_from_config / from_file / __post_init__: read the JSON file named by MOONCAKE_CONFIG_PATH, take defaults for missing keys (rdma, embedded, 4 GiB segment and buffer, no offload, tenant 'default'), parse sizes ('4GB', '512 mb', bytes), normalize the tenant (stripped; empty or null is 'default'), and validate the mode and sizes."
    sources: ["vllm/distributed/mooncake_store.py:40-78", "vllm/distributed/mooncake_store.py:80-123"]
    request: {type: object, properties: {}}
    response: DistMooncakeStoreConfig
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: type-error, status: 0, retryable: false}
      - {code: file-not-found-error, status: 0, retryable: false}
    behavior:
      - if: "!('mooncake-config-path' in config) || config['mooncake-config-path'] == null || config['mooncake-config-path'] == ''"
        then:
          - source: "vllm/distributed/mooncake_store.py:74-77"
            fail: {code: value-error, status: 0, message: "The environment variable 'MOONCAKE_CONFIG_PATH' is not set."}
      - title: json.load(open(path))
        source: "vllm/distributed/mooncake_store.py:52-53"
        call: local-disk.read-file
        input: {path: "= config['mooncake-config-path']"}
        as: f
      - set: {vars.c: "= vars.f.value.json"}
      - title: "_normalize_tenant_id: None is the default; a non-string is a TypeError; stripped, empty is the default"
        source: "vllm/distributed/mooncake_store.py:80-88"
        set:
          vars.t: "= 'tenant_id' in vars.c ? vars.c.tenant_id : 'default'"
      - if: "vars.t != null && type(vars.t) != string"
        then:
          - fail: {code: type-error, status: 0, message: "= 'tenant_id must be a string or null, got ' + (type(vars.t) == int ? 'int' : (type(vars.t) == bool ? 'bool' : 'object')) + ': ' + string(vars.t)"}
      - set:
          vars.tenant: "= vars.t == null || vars.t.trim() == '' ? 'default' : vars.t.trim()"
      - call: mooncake-store-config.parse-size
        input: {value: "= 'global_segment_size' in vars.c ? vars.c.global_segment_size : 4294967296"}
        as: gss
      - call: mooncake-store-config.parse-size
        input: {value: "= 'local_buffer_size' in vars.c ? vars.c.local_buffer_size : 4294967296"}
        as: lbs
      - set:
          vars.cfg:
            metadata_server: "= 'metadata_server' in vars.c ? vars.c.metadata_server : ''"
            master_server_address: "= 'master_server_address' in vars.c ? vars.c.master_server_address : ''"
            protocol: "= 'protocol' in vars.c ? vars.c.protocol : 'rdma'"
            device_name: "= 'device_name' in vars.c ? vars.c.device_name : ''"
            mode: "= 'mode' in vars.c ? vars.c.mode : 'embedded'"
            global_segment_size: "= vars.gss.value.bytes"
            local_buffer_size: "= vars.lbs.value.bytes"
            enable_offload: "= 'enable_offload' in vars.c && vars.c.enable_offload == true"
            tenant_id: "= vars.tenant"
      - title: __post_init__ checks, in order
        source: "vllm/distributed/mooncake_store.py:40-48"
        if: "!(vars.cfg.mode in ['embedded', 'standalone-store'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'unknown Mooncake mode: \\'' + vars.cfg.mode + '\\''"}
      - if: "vars.cfg.local_buffer_size <= 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:43-44"
            fail: {code: value-error, status: 0, message: "local_buffer_size must be > 0"}
      - if: "vars.cfg.mode == 'embedded' && vars.cfg.global_segment_size == 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:45-46"
            fail: {code: value-error, status: 0, message: "embedded mode requires global_segment_size > 0"}
      - if: "vars.cfg.mode == 'standalone-store' && vars.cfg.global_segment_size != 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:47-48"
            fail: {code: value-error, status: 0, message: "standalone-store mode requires global_segment_size == 0"}
      - return: "= vars.cfg"

  - component: mooncake-store-config
    name: parse-size
    kind: function
    summary: "_parse_size: an int is bytes; a string is a number with an optional unit (gb, mb, kb, b; any case, spaces allowed), times 1024^n."
    sources: ["vllm/distributed/mooncake_store.py:91-123"]
    request: {type: object, required: [value], properties: {value: {}}}
    response: {type: object, properties: {bytes: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "type(input.value) == int"
        then:
          - source: "vllm/distributed/mooncake_store.py:93-94"
            return: {bytes: "= input.value"}
      - set: {vars.c: "= string(input.value).trim().lowerAscii()"}
      - if: "vars.c == ''"
        then:
          - source: "vllm/distributed/mooncake_store.py:101-103"
            fail: {code: value-error, status: 0, message: "Size cannot be empty."}
      - if: "!vars.c.matches('^\\\\s*([0-9.]+)\\\\s*(gb|mb|kb|b)?\\\\s*$')"
        then:
          - source: "vllm/distributed/mooncake_store.py:111-113"
            fail: {code: value-error, status: 0, message: "= 'Invalid format: \\'' + string(input.value) + '\\''"}
      - set:
          vars.unit: "= vars.c.endsWith('gb') ? 'gb' : (vars.c.endsWith('mb') ? 'mb' : (vars.c.endsWith('kb') ? 'kb' : 'b'))"
      - set:
          vars.num: "= vars.c.endsWith(vars.unit) ? vars.c.substring(0, size(vars.c) - size(vars.unit)).trim() : vars.c"
      - if: "!vars.num.matches('^[0-9]*\\\\.?[0-9]+$')"
        then:
          - source: "vllm/distributed/mooncake_store.py:119-122"
            fail: {code: value-error, status: 0, message: "= 'Invalid numeric value \\'' + vars.num + '\\' in: \\'' + string(input.value) + '\\''"}
      - source: "vllm/distributed/mooncake_store.py:105-123"
        return: {bytes: "= int(double(vars.num) * double({'gb': 1073741824, 'mb': 1048576, 'kb': 1024, 'b': 1}[vars.unit]))"}

  - component: mooncake-store-config
    name: setup-mooncake-store
    kind: function
    summary: "setup_mooncake_store: call store.setup(local_hostname, metadata_server, global_segment_size, local_buffer_size, protocol, device_name, master_server_address), adding tenant_id as a keyword only when it isn't 'default'; a non-zero return fails."
    sources: ["vllm/distributed/mooncake_store.py:126-143"]
    request: {type: object, required: [config, local_hostname], properties: {config: DistMooncakeStoreConfig, local_hostname: {type: string}}}
    response: {type: object, properties: {args: {type: array}, kwargs: {type: object}}}
