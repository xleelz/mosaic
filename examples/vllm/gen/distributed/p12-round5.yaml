      - source: "vllm/distributed/mooncake_store.py:133-142"
        call: mooncake-distributed-store.setup
        input: {args: "= vars.args", kwargs: "= vars.kwargs"}
        as: r
      - if: "vars.r.value.ret != 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:142-143"
            fail: {code: runtime-error, status: 0, message: "Initialize MooncakeDistributedStore failed."}
      - return: {args: "= vars.args", kwargs: "= vars.kwargs"}

  - component: mooncake-distributed-store
    name: setup
    kind: function
    summary: "MooncakeDistributedStore.setup (native): records the call and returns the configured code (0 = success)."
    sources: ["vllm/distributed/mooncake_store.py:133-141"]
    request: {type: object, properties: {args: {type: array}, kwargs: {type: object}}}
