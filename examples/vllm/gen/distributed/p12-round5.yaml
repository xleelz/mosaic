        master_port: {type: [integer, "null"], default: null}
        world_size: {type: integer, examples: [4]}
        num_trainer_ranks: {type: integer, default: 1}
        dst_mesh_dims: {type: [array, "null"], default: null, items: {type: integer}}
        rank: {type: integer, examples: [0]}
        nccl_unique_id_b64: {type: [string, "null"], default: null}
    response: {type: object, properties: {destination_mesh_dims: {type: array, items: {type: integer}}, num_workers: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.has_uid: "= (has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null) != null && (has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null) != ''"
          vars.has_addr: "= (has(input.master_address) ? input.master_address : null) != null"
          vars.has_port: "= (has(input.master_port) ? input.master_port : null) != null"
      - title: "decode_nccl_unique_id(ctx='M2NTrainerInitInfo'), via the nccl_unique_id_bytes property"
        source: "vllm/distributed/weight_transfer/nccl_common.py:44-47"
        if: "vars.has_uid && (vars.has_addr || vars.has_port)"
        then:
          - fail: {code: value-error, status: 0, message: "M2NTrainerInitInfo: pass nccl_unique_id_b64 OR master_address/master_port, not both"}
      - if: "!vars.has_uid && !(vars.has_addr && vars.has_port)"
        then:
          - source: "vllm/distributed/weight_transfer/nccl_common.py:48-54"
            fail: {code: value-error, status: 0, message: "= 'M2NTrainerInitInfo: need nccl_unique_id_b64, or both master_address and master_port (got master_address=' + (vars.has_addr ? '\\'' + (has(input.master_address) ? input.master_address : null) + '\\'' : 'None') + ', master_port=' + (vars.has_port ? string((has(input.master_port) ? input.master_port : null)) : 'None') + ')'"}
      - if: "vars.has_uid"
        then:
          - if: "size((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null)) % 4 != 0 || !(has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null).matches('^[A-Za-z0-9+/]*={0,2}$')"
            then:
              - source: "vllm/distributed/weight_transfer/nccl_common.py:56-62"
                fail: {code: value-error, status: 0, message: "M2NTrainerInitInfo: nccl_unique_id_b64 is not valid standard base64 (URL-safe base64 is not accepted)"}
          - set:
              vars.nbytes: "= size((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null)) / 4 * 3 - ((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null).endsWith('==') ? 2 : ((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null).endsWith('=') ? 1 : 0))"
          - if: "vars.nbytes != 128"
            then:
              - source: "vllm/distributed/weight_transfer/nccl_common.py:63-67"
                fail: {code: value-error, status: 0, message: "= 'M2NTrainerInitInfo: nccl_unique_id_b64 must decode to 128 bytes, got ' + string(vars.nbytes)"}
      - if: "!(0 < (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1) && (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1) < input.world_size)"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_trainer.py:96-100"
            fail: {code: value-error, status: 0, message: "= '`num_trainer_ranks` (' + string((has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1)) + ') must leave at least one worker in world_size ' + string(input.world_size)"}
      - set: {vars.nw: "= input.world_size - (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1)"}
      - if: "(has(input.dst_mesh_dims) ? input.dst_mesh_dims : null) != null && (size((has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)) != 2 || (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)[0] * (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)[size((has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)) - 1] != vars.nw)"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_trainer.py:101-108"
            fail: {code: value-error, status: 0, message: "= '`dst_mesh_dims` (' + (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null).map(d, string(d)).join(', ') + (size((has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)) == 1 ? ',' : '') + ') must be two dims covering the ' + string(vars.nw) + ' inference workers'"}
      - if: "!(0 <= input.rank && input.rank < (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1))"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_trainer.py:109-113"
            fail: {code: value-error, status: 0, message: "= 'trainer `rank` (' + string(input.rank) + ') must be below `num_trainer_ranks` (' + string((has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1)) + ')'"}
      - source: "vllm/distributed/weight_transfer/m2n_trainer.py:86-91"
        return: {destination_mesh_dims: "= (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null) != null ? (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null) : [vars.nw, 1]", num_workers: "= vars.nw"}

schemas:
  - id: DistAll2AllResult
    summary: "What an MoE all-to-all step leaves on this rank: its token rows after the collective, the per-rank sizes used, the group and the manager."
    schema:
      type: object
      properties:
        num_tokens: {type: integer}
        sizes: {type: array, items: {type: integer}}
        comm_group: {type: string}
        manager: {type: string}
  - id: DistMooncakeStoreConfig
    summary: "MooncakeStoreConfig (vllm/distributed/mooncake_store.py:20-38)."
    schema:
      type: object
      properties:
        metadata_server: {type: string}
        master_server_address: {type: string}
        protocol: {type: string}
        device_name: {type: string}
        mode: {type: string, enum: [embedded, standalone-store]}
        global_segment_size: {type: integer}
        local_buffer_size: {type: integer}
        enable_offload: {type: boolean}
        tenant_id: {type: string}

flows:
  - id: distributed-ep-dispatch
    tags: ["feature:expert-parallel"]
    name: MoE all-to-all dispatch on the EP group
    description: "The seam group-coordinator.dispatch as the MoE prepare/finalize calls it (get_ep_group().dispatch)."
    entry: {caller: gpu-worker, interface: group-coordinator.dispatch, input: {num_tokens: 3}}
    sources: ["vllm/distributed/parallel_state.py:1430-1450"]
  - id: distributed-ep-combine
    tags: ["feature:expert-parallel"]
    name: MoE all-to-all combine on the EP group
    entry: {caller: gpu-worker, interface: group-coordinator.combine, input: {num_tokens: 8}}
    sources: ["vllm/distributed/parallel_state.py:1452-1458"]
  - id: distributed-nixl-push-request-finished
    tags: ["feature:disaggregated-prefill"]
    name: NIXL push scheduler request_finished
    entry: {caller: scheduler, interface: nixl-push-connector-scheduler.request-finished, input: {request_id: req-p1, status: FINISHED_STOPPED, kv_transfer_params: {do_remote_prefill: false, do_remote_decode: true}, block_ids: [[1, 2, 3]], num_computed_tokens: 48}}
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:207-294"]
  - id: distributed-mooncake-store-worker-init
    name: Mooncake Store KV worker sets up its store
    entry: {caller: gpu-worker, interface: mooncake-store-worker.init-store}
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:1413-1422"]
  - id: distributed-mooncake-embedding-client-create
    name: Mooncake Store EC client creation
    entry: {caller: gpu-worker, interface: mooncake-embedding-store-client.create}
    sources: ["vllm/distributed/ec_transfer/ec_connector/mooncake_store_embedding/store_client.py:87-123"]
  - id: distributed-m2n-trainer-init-info
    name: nccl_m2n trainer init info validation
    entry: {caller: python-user, interface: m2n-trainer-init-info.post-init, input: {master_address: "127.0.0.1", master_port: 1234, world_size: 4, num_trainer_ranks: 2, rank: 0}}
    sources: ["vllm/distributed/weight_transfer/m2n_trainer.py:93-113"]

scenarios:
  # ---------------------------------------------------------------- EP in the MoE world
  - id: distributed-moe-ep-group-tp2-no-all2all
    name: "Mixtral TP 2 with expert parallelism: the EP group spans both ranks, but DP is 1, so it gets no all-to-all and dispatch has no manager"
    description: >-
      FusedMoEParallelConfig gives each rank 4 whole experts (use_ep, ep_size = TP x DP = 2), but
      ParallelConfig.use_all2all is false at DP 1 (config/parallel.py:784-789): the EP communicator
      builds no all2all manager (cuda_communicator.py:202), the MoE layer makes no prepare/finalize
      (all2all_utils.py:195-222) and reduces its output with the TP all-reduce instead. Calling
      dispatch anyway hits `assert self.all2all_manager is not None`.
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    state:
      "parallel-state@rank0": {mp_initialized: false, world_initialized: true, world_size: 2, groups: {}}
      "parallel-state@rank1": {mp_initialized: false, world_initialized: true, world_size: 2, groups: {}}
    steps:
      - {interface: parallel-state.initialize-model-parallel, caller: gpu-worker, on: rank0, as: i0, input: {tensor_model_parallel_size: 2, pipeline_model_parallel_size: 1, is_moe: true}}
      - {interface: parallel-state.initialize-model-parallel, caller: gpu-worker, on: rank1, as: i1, input: {tensor_model_parallel_size: 2, pipeline_model_parallel_size: 1, is_moe: true}}
      - {interface: parallel-state.get-ep-group, caller: gpu-worker, on: rank1, as: ep}
      - {flow: distributed-ep-dispatch, as: d, on: rank0}
    expect:
      - "steps.i0.result.ok && steps.i1.result.ok && 'ep' in steps.i0.result.value.groups"
      - "steps.ep.result.value.world_size == 2 && steps.ep.result.value.rank_in_group == 1 && !steps.ep.result.value.use_all2all && steps.ep.result.value.all2all_manager == null"
      - "state['parallel-state@rank0'].groups.dp.world_size == 1 && state['parallel-state@rank0'].groups.tp.world_size == 2"
      - "!steps.d.result.ok && steps.d.result.error.code == 'assertion-error' && steps.d.result.error.message == ''"
  - id: distributed-moe-dense-model-has-no-ep-group
    name: A dense model gets no EP group, and get_ep_group says so
    fixtures: [full-tp1-llama-8b]
    state:
      parallel-state: {mp_initialized: false, world_initialized: true, world_size: 1, groups: {}}
    steps:
      - {interface: parallel-state.initialize-model-parallel, caller: gpu-worker, as: i, input: {tensor_model_parallel_size: 1, pipeline_model_parallel_size: 1, is_moe: false}}
      - {interface: parallel-state.get-ep-group, caller: gpu-worker, as: ep}
    expect:
      - "steps.i.result.ok && !('ep' in state['parallel-state@rank0'].groups)"
      - "!steps.ep.result.ok && steps.ep.result.error.message == 'expert parallel group is not initialized. EP group is only created for MoE models with num_experts > 0. This function should only be called for MoE models.'"
  - id: distributed-moe-ep-dp2-dispatch-combine
    name: "Mixtral DP 2 with EP: the EP group uses AgRs all-to-all; dispatch all-gathers 3 + 5 tokens to 8 on both ranks, combine reduce-scatters them back"
    description: >-
      With data_parallel_size 2 (TP 1) the EP group has 2 ranks and use_all2all, so its
      communicator builds AgRsAll2AllManager for the default allgather_reducescatter backend.
      dispatch takes the DP group (all2all.py:84-85) and the DP chunk sizes [3, 5]
      (all2all.py:89-97), checks this rank's rows and all_gatherv's to 8 rows; combine
      reduce_scatterv's the 8 expert rows back to 3 on rank0 and 5 on rank1.
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {data-parallel-size: 2, tensor-parallel-size: 1}
    state:
      "parallel-state@rank0": {mp_initialized: false, world_initialized: true, world_size: 2, groups: {}}
      "parallel-state@rank1": {mp_initialized: false, world_initialized: true, world_size: 2, groups: {}}
    steps:
      - {interface: parallel-state.initialize-model-parallel, caller: gpu-worker, on: rank0, as: i0, input: {tensor_model_parallel_size: 1, pipeline_model_parallel_size: 1, is_moe: true}}
      - {interface: parallel-state.initialize-model-parallel, caller: gpu-worker, on: rank1, as: i1, input: {tensor_model_parallel_size: 1, pipeline_model_parallel_size: 1, is_moe: true}}
      - {flow: distributed-ep-dispatch, as: d0, on: rank0, at_ms: 10, await: false, input: {num_tokens: 3, dp_chunk_sizes: [3, 5]}}
      - {flow: distributed-ep-dispatch, as: d1, on: rank1, at_ms: 10, await: false, input: {num_tokens: 5, dp_chunk_sizes: [3, 5]}}
      - {flow: distributed-ep-combine, as: c0, on: rank0, at_ms: 50, await: false, input: {num_tokens: 8, dp_chunk_sizes: [3, 5]}}
      - {flow: distributed-ep-combine, as: c1, on: rank1, at_ms: 50, await: false, input: {num_tokens: 8, dp_chunk_sizes: [3, 5]}}
    expect:
      - "state['parallel-state@rank0'].groups.ep.use_all2all && state['parallel-state@rank0'].groups.ep.all2all_manager == 'AgRsAll2AllManager' && state['parallel-state@rank0'].groups.ep.world_size == 2"
      - "steps.d0.result.value.num_tokens == 8 && steps.d1.result.value.num_tokens == 8 && steps.d0.result.value.comm_group == 'dp'"
      - "steps.c0.result.value.num_tokens == 3 && steps.c1.result.value.num_tokens == 5"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'cuda-communicator.all-gatherv').size() == 2"
  - id: distributed-moe-ep-dispatch-wrong-local-size
    name: A rank whose rows don't match its DP chunk size fails dispatch's size assertion before any collective
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {data-parallel-size: 2, tensor-parallel-size: 1}
    state:
      "parallel-state@rank0": {mp_initialized: true, world_initialized: true, world_size: 2, groups: {tp: {world_size: 1, unique_name: "tp:0"}, pcp: {world_size: 1, unique_name: "pcp:0"}, dp: {world_size: 2, unique_name: "dp:0"}, ep: {world_size: 2, unique_name: "ep:0", use_all2all: true, all2all_manager: AgRsAll2AllManager}}}
    steps:
      - {flow: distributed-ep-dispatch, as: d, input: {num_tokens: 4, dp_chunk_sizes: [3, 5]}}
      - {flow: distributed-ep-dispatch, as: nometa, input: {num_tokens: 3}}
    expect:
      - "!steps.d.result.ok && steps.d.result.error.code == 'assertion-error'"
      - "!steps.nometa.result.ok && steps.nometa.result.error.code == 'assertion-error'"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-communicator.all-gatherv')"
  - id: distributed-moe-ep-no-device-communicator-passthrough
    name: Without a device communicator, dispatch and combine return their inputs
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    steps:
      - {flow: distributed-ep-dispatch, as: d, input: {num_tokens: 3, has_device_communicator: false}}
      - {flow: distributed-ep-combine, as: c, input: {num_tokens: 3, has_device_communicator: false}}
    expect:
      - "steps.d.result.value.num_tokens == 3 && steps.d.result.value.comm_group == 'none' && steps.c.result.value.num_tokens == 3"
  - id: distributed-all-gatherv-checks
    name: "all_gatherv: only dim 0; this rank's rows must equal sizes[rank]"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    steps:
      - {interface: cuda-communicator.all-gatherv, caller: gpu-worker, as: dim1, input: {group_name: "dp:0", world_size: 2, num_tokens: 3, dim: 1}}
      - {interface: cuda-communicator.all-gatherv, caller: gpu-worker, as: rows, input: {group_name: "dp:0", world_size: 2, num_tokens: 4, sizes: [3, 5]}}
      - {interface: cuda-communicator.reduce-scatterv, caller: gpu-worker, as: rsn, input: {group_name: "dp:0", world_size: 2, num_tokens: 8, sizes: [3, 4, 1]}}
      - {interface: cuda-communicator.reduce-scatterv, caller: gpu-worker, as: rsodd, input: {group_name: "dp:0", world_size: 2, num_tokens: 7}}
    expect:
      - "!steps.dim1.result.ok && steps.dim1.result.error.code == 'not-implemented-error' && steps.dim1.result.error.message == 'only dim 0 all-gatherv is supported'"
      - "!steps.rows.result.ok && steps.rows.result.error.message == '4 != 3'"
      - "!steps.rsn.result.ok && steps.rsn.result.error.message == '3 == 2'"
      - "!steps.rsodd.result.ok && steps.rsodd.result.error.code == 'assertion-error'"
  - id: distributed-ag-rs-comm-group-pcp-at-dp1
    name: At DP 1 and not sequence parallel, the AgRs manager uses the PCP group; sequence parallel uses EP
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    state:
      "parallel-state@rank0": {groups: {tp: {world_size: 2, unique_name: "tp:0"}, pcp: {world_size: 1, unique_name: "pcp:0"}, dp: {world_size: 1, unique_name: "dp:0"}, ep: {world_size: 2, unique_name: "ep:0", use_all2all: true, all2all_manager: AgRsAll2AllManager}}}
    steps:
      - {interface: ag-rs-all2all-manager.comm-group, caller: gpu-worker, as: g}
      - {interface: ag-rs-all2all-manager.comm-group, caller: gpu-worker, as: sp, input: {is_sequence_parallel: true}}
      - {interface: ag-rs-all2all-manager.get-sizes, caller: gpu-worker, as: eq, input: {num_local_tokens: 4, world_size: 2, dp_world_size: 1}}
    expect:
      - "steps.g.result.value.name == 'pcp' && steps.sp.result.value.name == 'ep' && steps.sp.result.value.world_size == 2"
      - "steps.eq.result.value.sizes == [4, 4]"
  - id: distributed-ag-rs-comm-group-dp-pcp-tp-assert
    name: DP with EP and PCP > 1 needs TP 1; with TP 2 the manager asserts
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    state:
      "parallel-state@rank0": {groups: {tp: {world_size: 2, unique_name: "tp:0"}, pcp: {world_size: 2, unique_name: "pcp:0"}, dp: {world_size: 2, unique_name: "dp:0"}, ep: {world_size: 8, unique_name: "ep:0", use_all2all: true, all2all_manager: AgRsAll2AllManager}}}
    steps:
      - {interface: ag-rs-all2all-manager.comm-group, caller: gpu-worker, as: g}
    expect:
      - "!steps.g.result.ok && steps.g.result.error.message == 'DP+PCP with TP>1 requires sequence-parallel MoE inputs'"
  - id: distributed-moe-ep-tp2-dp2-sequence-parallel-all2all
    name: "TP 2 x DP 2 with EP and the default backend is sequence-parallel MoE: the EP group (4 ranks) uses all-to-all"
    fixtures: [full-tp4-llama-70b]
    config: {data-parallel-size: 2, tensor-parallel-size: 2, enable-expert-parallel: true}
    state:
      parallel-state: {mp_initialized: false, world_initialized: true, world_size: 4, groups: {}}
    steps:
      - {interface: parallel-state.initialize-model-parallel, caller: gpu-worker, as: i, input: {tensor_model_parallel_size: 2, pipeline_model_parallel_size: 1, is_moe: true}}
    expect:
      - "steps.i.result.ok && state['parallel-state@rank0'].groups.ep.world_size == 4 && state['parallel-state@rank0'].groups.ep.use_all2all && state['parallel-state@rank0'].groups.ep.all2all_manager == 'AgRsAll2AllManager'"
  - id: distributed-moe-ep-deepep-backend-manager
    name: With --all2all-backend deepep_low_latency the DP-2 EP group builds the DeepEP low-latency manager, whose dispatch the model does not simulate
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {data-parallel-size: 2, tensor-parallel-size: 1, all2all-backend: deepep_low_latency}
    state:
      "parallel-state@rank0": {mp_initialized: false, world_initialized: true, world_size: 2, groups: {}}
    steps:
      - {interface: parallel-state.initialize-model-parallel, caller: gpu-worker, as: i, input: {tensor_model_parallel_size: 1, pipeline_model_parallel_size: 1, is_moe: true}}
      - {flow: distributed-ep-dispatch, as: d, input: {num_tokens: 3}}
      - {flow: distributed-ep-combine, as: c, input: {num_tokens: 3}}
    expect:
      - "state['parallel-state@rank0'].groups.ep.all2all_manager == 'DeepEPLLAll2AllManager'"
      - "steps.d.result.value.manager == 'DeepEPLLAll2AllManager' && steps.c.result.value.manager == 'DeepEPLLAll2AllManager'"
  - id: distributed-get-dp-pcp-group-uninitialized
    name: get_dp_group and get_pcp_group assert before the groups exist
    fixtures: [full-tp1-llama-8b]
    state:
      parallel-state: {groups: {dp: {$absent: true}}}
    steps:
      - {interface: parallel-state.get-dp-group, caller: gpu-worker, as: dp}
      - {interface: parallel-state.get-pcp-group, caller: gpu-worker, as: pcp}
    expect:
      - "steps.dp.result.error.message == 'data parallel group is not initialized' && steps.pcp.result.error.message == 'prefill context parallel group is not initialized'"
  - id: distributed-reduce-scatterv-pynccl-disabled
    name: reduce_scatterv and all_gatherv require PyNccl
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    state:
      pynccl-communicator: {disabled: true}
    steps:
      - {interface: cuda-communicator.reduce-scatterv, caller: gpu-worker, as: rs, input: {group_name: "dp:0", world_size: 2, num_tokens: 8}}
      - {interface: cuda-communicator.all-gatherv, caller: gpu-worker, as: ag, input: {group_name: "dp:0", world_size: 2, num_tokens: 4}}
    expect:
      - "!steps.rs.result.ok && steps.rs.result.error.message == 'reduce_scatterv requires PyNccl'"
      - "!steps.ag.result.ok && steps.ag.result.error.code == 'assertion-error'"

  # ---------------------------------------------------------------- precision regressions (round-5 sweep)
  - id: distributed-r5-mp-init-pp-mismatch-message
    name: "ensure_model_parallel_initialized: a PP mismatch names both sizes the way the f-string's = specifier prints them"
    fixtures: [full-tp1-llama-8b]
    state:
      parallel-state: {mp_initialized: true, groups: {tp: {world_size: 1, unique_name: "tp:0"}, pp: {world_size: 1, unique_name: "pp:0"}}}
    steps:
      - {interface: parallel-state.ensure-model-parallel-initialized, caller: gpu-worker, as: e, input: {tensor_model_parallel_size: 1, pipeline_model_parallel_size: 2}}
    expect:
      - "!steps.e.result.ok && steps.e.result.error.message == 'pipeline parallel group already initialized, but of unexpected size. got: pp_world_size=1 vs. wanted: pipeline_model_parallel_size=2'"
  - id: distributed-r5-invalid-dim-message
    name: "GroupCoordinator.all_gather: an out-of-range dim names the tensor's shape"
    fixtures: [full-tp4-llama-70b]
    steps:
      - {interface: group-coordinator.all-gather, caller: gpu-worker, as: g, input: {num_tokens: 16, world_size: 4, dim: 2}}
      - {interface: group-coordinator.reduce-scatter, caller: gpu-worker, as: r, input: {num_tokens: 16, world_size: 4, dim: -3}}
    expect:
      - "steps.g.result.error.message == 'Invalid dim (2) for input tensor with shape torch.Size([16, 4096])'"
      - "steps.r.result.error.message == 'Invalid dim (-3) for input tensor with shape torch.Size([16, 4096])'"
  - id: distributed-r5-kv-cache-layout-keyerror-repr
    name: An unknown KVCacheLayout name is a KeyError whose text is the quoted name
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: kv-cache-layout.properties, caller: gpu-worker, as: k, input: {layout: NHD}}
    expect:
      - "!steps.k.result.ok && steps.k.result.error.code == 'key-error' && steps.k.result.error.message == \"'NHD'\""
  - id: distributed-r5-m2n-dtype-message
    name: "check_transferable: an unsupported dtype lists the supported ones, sorted as strings"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: distributed-m2n-check-transferable, as: c, input: {name: w, dtype: complex64, shape: [4]}}
    expect:
      - "steps.c.result.error.message == \"parameter 'w' has dtype torch.complex64, which nccl_m2n does not support. Supported: ['torch.bfloat16', 'torch.float16', 'torch.float32', 'torch.float64', 'torch.float8_e4m3fn', 'torch.float8_e5m2', 'torch.int32', 'torch.int64', 'torch.int8', 'torch.uint32', 'torch.uint64', 'torch.uint8']\""
  - id: distributed-r5-moriio-release-and-binary-messages
    name: "MoRIIO: a bad consumer_tp_size and an undecodable message name the offending value"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: moriio-wrapper.handle-message, caller: gpu-worker, as: badtp, input: {kind: structured, type: release, transfer_id: xfer-3, consumer_tp_size: -1}}
      - {interface: moriio-wrapper.handle-message, caller: gpu-worker, as: bin, input: {kind: binary, text: "b'\\xff\\xfe'"}}
    expect:
      - "steps.badtp.result.error.message == 'Invalid consumer_tp_size in release message: -1'"
      - "steps.bin.result.error.message == \"Unhandled message format: b'\\\\xff\\\\xfe'\""
  - id: distributed-r5-aux-store-evicted-message
    name: "BlockObjectStore.get_concatenated: an evicted key reports the store's use and limit"
    fixtures: [full-tp1-llama-8b]
    state:
      block-object-store: {objects: {"req-a/0": "aa"}, num_slots: 4}
    steps:
      - {interface: block-object-store.get-concatenated, caller: gpu-worker, as: g, input: {keys: ["req-a/0", "req-b/0"]}}
    expect:
      - "steps.g.result.error.message == 'auxiliary output object does not exist; the object may have been evicted (used=1, limit=4 objects). Increase aux_output_config.max_bytes when a KV cache hit requires it.'"
  - id: distributed-r5-embedding-cache-duplicate-repr
    name: "EmbeddingCache.alloc: a duplicate key is named with its repr"
    fixtures: [full-tp1-llama-8b]
    state:
      ec-embedding-cache: {entries: {img1: {blocks: [0], refs: 1}}}
    steps:
      - {interface: ec-embedding-cache.alloc, caller: engine-core, as: a, input: {key: img1, n_blocks: 1}}
    expect:
      - "steps.a.result.error.message == \"EmbeddingCache: duplicate alloc for 'img1'\""
  - id: distributed-r5-nixl-listener-keyerror-tuple
    name: "The NIXL handshake listener's KeyError for a missing rank prints the (pp, tp) tuple"
    fixtures: [full-tp1-llama-8b]
    state:
      nixl-pull-connector-scheduler: {listener_started: true, encoded_data: {"0,0": meta0}, handshake_inbox: [{msg: GET_META_MSG, pp_rank: 0, tp_rank: 3}]}
    steps:
      - {interface: nixl-pull-connector-scheduler.nixl-handshake-listener, caller: engine-core, as: l}
    expect:
      - "!steps.l.result.ok && steps.l.result.error.code == 'key-error' && steps.l.result.error.message == '(0, 3)'"
      - "size(state['nixl-pull-connector-scheduler'].handshake_replies) == 0"
  - id: distributed-r5-p2p-probe-crash-message
    name: "gpu_p2p_access_check: a crashed probe names the device pairs it tested"
    fixtures: [full-tp1-llama-8b]
    choices: {all-reduce-utils.main.probe: crashed}
    steps:
      - {interface: all-reduce-utils.main, caller: gpu-worker, as: m, input: {pairs: 2}}
    expect:
      - "steps.m.result.error.message == 'Error happened when batch testing peer-to-peer access from (0, 0, 1, 1) to (0, 1, 0, 1):\\n'"

  # ---------------------------------------------------------------- NIXL push scheduler
  - id: distributed-nixl-push-request-finished-p-side
    name: A finished P-side request keeps its blocks under the lease, stashes them for the workers and returns push params for the decoder
    flow: distributed-nixl-push-request-finished
    fixtures: [full-tp1-llama-8b]
    config: {kv-connector: NixlPushConnector, kv-role: kv_both}
    steps:
      - {interface: kv-connector-base-v1.request-finished, caller: scheduler, as: f, input: {request_id: req-p1, status: FINISHED_STOPPED, kv_transfer_params: {do_remote_prefill: false, do_remote_decode: true}, block_ids: [[1, 2, 3]], num_computed_tokens: 48}}
      - {interface: nixl-push-connector-scheduler.request-finished, caller: scheduler, as: run, input: {request_id: req-r, status: RUNNING, kv_transfer_params: {do_remote_decode: true}, block_ids: [[4]]}}
      - {interface: nixl-push-connector-scheduler.request-finished, caller: scheduler, as: d, input: {request_id: req-d, status: FINISHED_STOPPED, kv_transfer_params: {do_remote_decode: false}, block_ids: [[5]]}}
      - {interface: nixl-push-connector-scheduler.request-finished, caller: scheduler, as: ab, input: {request_id: req-ab, status: FINISHED_ABORTED, kv_transfer_params: {do_remote_prefill: true, remote_engine_id: e1}}}
      - {interface: nixl-push-connector-scheduler.request-finished, caller: scheduler, as: none, input: {request_id: req-n, kv_transfer_params: null}}
    expect:
      - "steps.f.result.value.delay_free_blocks && steps.f.result.value.kv_transfer_params.transfer_mode == 'push' && steps.f.result.value.kv_transfer_params.remote_num_tokens == 48 && steps.f.result.value.kv_transfer_params.do_remote_prefill"
      - "'req-p1' in state['nixl-push-connector-scheduler'].reqs_need_send && state['nixl-push-connector-scheduler'].finished_request_blocks['req-p1'] == [[1, 2, 3]]"
      - "!steps.run.result.value.delay_free_blocks && steps.run.result.value.kv_transfer_params == null && 'req-r' in state['nixl-push-connector-scheduler'].reqs_not_processed"
      - "steps.d.result.value.kv_transfer_params == null && steps.none.result.value.kv_transfer_params == null"
      - "steps.ab.result.value.kv_transfer_params == null && 'req-ab' in state['nixl-push-connector-scheduler'].reqs_need_recv"

  # ---------------------------------------------------------------- NIXL pull worker: peer replacement
  - id: distributed-nixl-peer-replaced-released-after-reads
    name: "A new engine at the same address replaces the old one; the old peer is released only once its tracked READ finished"
    fixtures: [full-tp1-llama-8b]
    state:
      nixl-pull-connector-worker: {remote_agents: [old], engine_by_address: {"localhost:1234": old}}
    steps:
      - flow: distributed-nixl-start-load
        as: l1
        input: {metadata: {reqs_to_recv: {old-req: {local_block_ids: [[1]], awaiting_kvs: true, remote: {block_ids: [[2]], engine_id: old, request_id: old-prefill, host: localhost, port: 1234}}}}}
      - {interface: nixl-pull-connector-worker.ensure-handshake, caller: gpu-worker, as: hs, input: {engine_id: new, host: localhost, port: 1234}}
      - {flow: distributed-nixl-get-finished, as: f1}
    expect:
      - "steps.hs.result.value.ok && steps.hs.result.value.replaced == 'old'"
      - "steps.f1.result.value.finished_recving == ['old-req']"
      - "state['nixl-pull-connector-worker@rank0'].removed_agents == ['old'] && state['nixl-pull-connector-worker@rank0'].remote_agents == ['new']"
  - id: distributed-nixl-peer-other-address-kept
    name: A handshake from another address does not replace the old peer
    fixtures: [full-tp1-llama-8b]
    state:
      nixl-pull-connector-worker: {remote_agents: [old], engine_by_address: {"localhost:1234": old}}
    steps:
      - {interface: nixl-pull-connector-worker.ensure-handshake, caller: gpu-worker, as: hs, input: {engine_id: healthy, host: other-host, port: 1234}}
      - {interface: nixl-pull-connector-worker.ensure-handshake, caller: gpu-worker, as: again, input: {engine_id: healthy, host: other-host, port: 1234}}
      - {flow: distributed-nixl-get-finished, as: f}
    expect:
      - "steps.hs.result.value.replaced == null && steps.again.result.value.ok"
      - "state['nixl-pull-connector-worker@rank0'].remote_agents == ['old', 'healthy'] && size(state['nixl-pull-connector-worker@rank0'].removed_agents) == 0"
      - "calls['nixl-agent.handshake'] == 1"
  - id: distributed-nixl-background-handshake-failure
    name: A failed background handshake fails the request and counts one failed handshake
    fixtures: [full-tp1-llama-8b]
    faults: [{target: nixl-agent.handshake, type: error, code: handshake-error}]
    steps:
      - {interface: nixl-pull-connector-worker.background-nixl-handshake, caller: gpu-worker, as: b, input: {request_id: r1, meta: {local_block_ids: [[1]], awaiting_kvs: true, remote: {block_ids: [[2]], engine_id: e9, request_id: p9, host: h, port: 1}}}}
    expect:
      - "!steps.b.result.value.queued && state['nixl-pull-connector-worker@rank0'].failed_recv == ['r1']"
      - "state['nixl-pull-connector-worker@rank0'].xfer_stats.num_failed_handshakes == [1]"

  # ---------------------------------------------------------------- Mooncake Store config
  - id: distributed-mooncake-store-config-defaults-and-errors
    name: "MooncakeStoreConfig: defaults for missing keys, size strings, and the validation errors in order"
    fixtures: [full-tp1-llama-8b]
    config: {mooncake-config-path: /etc/mooncake.json}
    state:
      local-disk:
        files:
          /etc/mooncake.json: {json: {metadata_server: "http://meta", master_server_address: "10.0.0.7:50051", global_segment_size: " 512 MB ", local_buffer_size: 1024}}
    steps:
      - {interface: mooncake-store-config.load-from-config, caller: gpu-worker, as: ok}
      - {interface: mooncake-store-config.parse-size, caller: gpu-worker, as: bad, input: {value: "4 GiB"}}
      - {interface: mooncake-store-config.parse-size, caller: gpu-worker, as: empty, input: {value: "  "}}
      - {interface: mooncake-store-config.parse-size, caller: gpu-worker, as: num, input: {value: "1.2.3gb"}}
      - {interface: mooncake-store-config.parse-size, caller: gpu-worker, as: frac, input: {value: "1.5KB"}}
    expect:
      - "steps.ok.result.value.global_segment_size == 536870912 && steps.ok.result.value.local_buffer_size == 1024 && steps.ok.result.value.protocol == 'rdma' && steps.ok.result.value.mode == 'embedded' && steps.ok.result.value.tenant_id == 'default'"
      - "steps.bad.result.error.message == \"Invalid format: '4 GiB'\" && steps.empty.result.error.message == 'Size cannot be empty.'"
      - "steps.num.result.error.message == \"Invalid numeric value '1.2.3' in: '1.2.3gb'\" && steps.frac.result.value.bytes == 1536"
  - id: distributed-mooncake-store-config-validation
    name: "MooncakeStoreConfig.__post_init__: an unknown mode, then segment rules per mode; no MOONCAKE_CONFIG_PATH"
    fixtures: [full-tp1-llama-8b]
    config: {mooncake-config-path: /etc/m1.json}
    state:
      local-disk:
        files:
          /etc/m1.json: {json: {mode: hybrid, local_buffer_size: 0}}
    steps:
      - {interface: mooncake-store-config.load-from-config, caller: gpu-worker, as: mode}
    expect:
      - "steps.mode.result.error.message == \"unknown Mooncake mode: 'hybrid'\""
  - id: distributed-mooncake-store-config-standalone-segment
    fixtures: [full-tp1-llama-8b]
    config: {mooncake-config-path: /etc/m2.json}
    state:
      local-disk:
        files:
          /etc/m2.json: {json: {mode: standalone-store}}
    steps:
      - {interface: mooncake-store-config.load-from-config, caller: gpu-worker, as: s}
    expect:
      - "steps.s.result.error.message == 'standalone-store mode requires global_segment_size == 0'"
  - id: distributed-mooncake-store-config-unset
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: distributed-mooncake-store-worker-init, as: w}
    expect:
      - "!steps.w.result.ok && steps.w.result.error.message == \"The environment variable 'MOONCAKE_CONFIG_PATH' is not set.\""
      - "size(state['mooncake-distributed-store@rank0'].setup_calls) == 0"
  - id: distributed-mooncake-store-setup-failure-and-offload-refusal
    name: "A non-zero setup() return fails the KV worker; the EC client refuses enable_offload before setting up"
    fixtures: [full-tp1-llama-8b]
    config: {mooncake-config-path: /etc/m3.json}
    state:
      mooncake-distributed-store: {setup_ret: -1}
      local-disk:
        files:
          /etc/m3.json: {json: {enable_offload: true, tenant_id: "  "}}
    steps:
      - {flow: distributed-mooncake-store-worker-init, as: kv}
      - {flow: distributed-mooncake-embedding-client-create, as: ec}
    expect:
      - "steps.kv.result.error.message == 'Initialize MooncakeDistributedStore failed.' && state['mooncake-distributed-store@rank0'].setup_calls[0].kwargs == {}"
      - "steps.ec.result.error.message == 'cross_encoder_cache supports a RAM Store; disable enable_offload' && size(state['mooncake-distributed-store@rank0'].setup_calls) == 1"
  - id: distributed-mooncake-store-tenant-type-error
    fixtures: [full-tp1-llama-8b]
    config: {mooncake-config-path: /etc/m4.json}
    state:
      local-disk:
        files:
          /etc/m4.json: {json: {tenant_id: 7}}
    steps:
      - {interface: mooncake-store-config.load-from-config, caller: gpu-worker, as: t}
    expect:
      - "steps.t.result.error.code == 'type-error' && steps.t.result.error.message == 'tenant_id must be a string or null, got int: 7'"

  # ---------------------------------------------------------------- M2N trainer init info
  - id: distributed-m2n-trainer-init-info-checks
    name: "M2NTrainerInitInfo: the rendezvous mode first, then trainer ranks, the destination mesh and the trainer rank"
    flow: distributed-m2n-trainer-init-info
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: distributed-m2n-trainer-init-info, as: ok}
      - {interface: m2n-trainer-init-info.post-init, caller: python-user, as: both, input: {master_address: "127.0.0.1", master_port: 1234, nccl_unique_id_b64: "AAAA", world_size: 4, rank: 0}}
      - {interface: m2n-trainer-init-info.post-init, caller: python-user, as: noport, input: {master_address: "127.0.0.1", world_size: 4, rank: 0}}
      - {interface: m2n-trainer-init-info.post-init, caller: python-user, as: short, input: {nccl_unique_id_b64: "AAAA", world_size: 4, rank: 0}}
      - {interface: m2n-trainer-init-info.post-init, caller: python-user, as: urlsafe, input: {nccl_unique_id_b64: "AA-_", world_size: 4, rank: 0}}
      - {interface: m2n-trainer-init-info.post-init, caller: python-user, as: ranks, input: {master_address: "127.0.0.1", master_port: 1234, world_size: 2, num_trainer_ranks: 2, rank: 0}}
      - {interface: m2n-trainer-init-info.post-init, caller: python-user, as: mesh, input: {master_address: "127.0.0.1", master_port: 1234, world_size: 6, num_trainer_ranks: 2, dst_mesh_dims: [3, 1], rank: 0}}
      - {interface: m2n-trainer-init-info.post-init, caller: python-user, as: rank, input: {master_address: "127.0.0.1", master_port: 1234, world_size: 4, num_trainer_ranks: 2, rank: 3}}
    expect:
      - "steps.ok.result.value.destination_mesh_dims == [2, 1]"
      - "steps.both.result.error.message == 'M2NTrainerInitInfo: pass nccl_unique_id_b64 OR master_address/master_port, not both'"
      - "steps.noport.result.error.message == \"M2NTrainerInitInfo: need nccl_unique_id_b64, or both master_address and master_port (got master_address='127.0.0.1', master_port=None)\""
      - "steps.short.result.error.message == 'M2NTrainerInitInfo: nccl_unique_id_b64 must decode to 128 bytes, got 3'"
      - "steps.urlsafe.result.error.message == 'M2NTrainerInitInfo: nccl_unique_id_b64 is not valid standard base64 (URL-safe base64 is not accepted)'"
      - "steps.ranks.result.error.message == '`num_trainer_ranks` (2) must leave at least one worker in world_size 2'"
      - "steps.mesh.result.error.message == '`dst_mesh_dims` (3, 1) must be two dims covering the 4 inference workers'"
      - "steps.rank.result.error.message == 'trainer `rank` (3) must be below `num_trainer_ranks` (2)'"
