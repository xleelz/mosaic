  # ---------------------------------------------------------------- nccl_m2n trainer init info
  - component: m2n-trainer-init-info
    name: post-init
    kind: function
    summary: "M2NTrainerInitInfo.__post_init__: first the rendezvous mode (a pre-shared 128-byte base64 unique id, or both master_address and master_port, not both), then 0 < num_trainer_ranks < world_size, a two-dim dst_mesh_dims covering the inference workers, and 0 <= rank < num_trainer_ranks."
    sources: ["vllm/distributed/weight_transfer/m2n_trainer.py:93-122", "vllm/distributed/weight_transfer/nccl_common.py:32-68"]
    request:
