      - "state['sharded-rdt-weight-transfer-engine@rank0'].quantized == ['l0', 'l1']"
  - id: distributed-rdt-quant-exit
    flow: distributed-rdt-quant-loop
    fixtures: [tp1-llama-8b]
    expect:
      - "passes[0].result.value.exited"
  - id: distributed-rdt-trainer-gather-bounded
    name: With lookahead 1 the trainer waits for a freed group before each new one past the bound
    flow: distributed-rdt-trainer-gather
    fixtures: [tp1-llama-8b, distributed-seed]
    state:
      sharded-rdt-trainer-weight-transfer-engine: {owned: [a, b, c, d], yielded: [a, b, c, d], lookahead: 1}
    steps:
      - {flow: distributed-rdt-trainer-gather, as: sync}
      - {flow: distributed-rdt-proc-loop, as: recv}
    expect:
      - "steps.sync.result.value.published == 4 && steps.sync.result.value.waits == 2"
      - "state['sharded-rdt-trainer-weight-transfer-engine'].ended && size(state['sharded-rdt-trainer-weight-transfer-engine'].inflight) == 0"
  - id: distributed-rdt-trainer-gather-order-mismatch
    flow: distributed-rdt-trainer-gather
    fixtures: [tp1-llama-8b]
    state:
      sharded-rdt-trainer-weight-transfer-engine: {owned: [a, b], yielded: [a, c]}
    expect:
      - "!result.ok && result.error.code == 'runtime-error' && state['sharded-rdt-trainer-weight-transfer-engine'].gather_error == 'mismatch'"
  - id: distributed-collectives-lone-rank-times-out
    name: A rank alone in a collective (its peers never call) fails after the process-group timeout
    flow: distributed-tp-all-gather
    fixtures: [tp4-llama-70b, distributed-seed]
    config: {distributed-timeout-seconds: 1}
    state:
      custom-allreduce: {fully_connected: true}
    steps:
      - {flow: distributed-tp-all-gather, as: ag}
      - {flow: distributed-tp-reduce-scatter, as: rs}
      - {flow: distributed-sp-custom-collectives, as: cag, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-sp-custom-reduce-scatter, as: crs, input: {num_tokens: 512, hidden_size: 8192}}
    expect:
      - "[steps.ag, steps.rs, steps.cag, steps.crs].all(st, !st.result.ok && st.result.error.code == 'dist-backend-error' && st.result.error.message == 'collective timed out: 1 of 4 ranks arrived')"
      - "trace.filter(e, e.type == 'rendezvous' && e.error != null).size() == 4"
