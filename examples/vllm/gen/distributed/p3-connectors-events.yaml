    fixtures: [tp1-llama-8b]
    state:
      background-block-object-store: {closed: true, queue: [null]}
    steps:
      - {flow: distributed-aux-store-put, as: closed}
      - {flow: distributed-aux-store-put, as: empty, input: {objects: []}}
      - {flow: distributed-aux-store-writer, as: w}
    expect:
      - "!steps.closed.result.ok && steps.closed.result.error.code == 'runtime-error' && !steps.empty.result.value.queued"
      - "!steps.w.result.value.applied && state['background-block-object-store@rank0'].closed && size(state['background-block-object-store@rank0'].queue) == 0"
  # ---- shm ring buffer
  - id: distributed-shm-open-missing
    flow: distributed-shm-ring-buffer
    fixtures: [tp1-llama-8b]
    input: {create: false, name: psm_nope}
    expect:
      - "!result.ok && result.error.code == 'file-not-found-error'"
  - id: distributed-shm-create-twice
    flow: distributed-shm-ring-buffer
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: distributed-shm-ring-buffer, as: a, input: {name: psm_dup}}
      - {flow: distributed-shm-ring-buffer, as: b, input: {name: psm_dup}}
      - {flow: distributed-shm-ring-buffer, as: small, input: {name: psm_dup, create: false, data_buffer_size: 8192}}
    expect:
      - "steps.a.result.ok && !steps.b.result.ok && steps.b.result.error.code == 'file-exists-error'"
      - "!steps.small.result.ok && steps.small.result.error.code == 'assertion-error' && state['posix-shared-memory@rank0'].segments.psm_dup.size == 4128"
  - id: distributed-shm-allocate-until-full
    name: Allocations advance the ring; one that would overrun its start raises MemoryError
    flow: distributed-shm-allocate
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: distributed-shm-ring-buffer, as: mk, input: {name: psm_test, data_buffer_size: 200}}
      - {flow: distributed-shm-allocate, as: a1, input: {name: psm_test, size: 100}}
      - {flow: distributed-shm-allocate, as: a2, input: {name: psm_test, size: 80}}
      - {flow: distributed-shm-allocate, as: a3, input: {name: psm_test, size: 1}}
      - {flow: distributed-shm-allocate, as: ro, input: {name: psm_test, size: 1, is_writer: false}}
      - {flow: distributed-shm-allocate, as: zero, input: {name: psm_test, size: 0}}
      - {flow: distributed-shm-ring-buffer, as: reader, input: {name: psm_test, data_buffer_size: 200, create: false}}
    expect:
      - "steps.a1.result.value.address == 0 && steps.a1.result.value.monotonic_id == 0 && steps.a2.result.value.address == 108"
      - "!steps.a3.result.ok && steps.a3.result.error.code == 'memory-error'"
      - "steps.ro.result.error.code == 'assertion-error' && steps.zero.result.error.code == 'assertion-error'"
      - "steps.reader.result.ok && state['posix-shared-memory@rank0'].segments.psm_test.end == 196 && state['posix-shared-memory@rank0'].segments.psm_test.next_id == 2"
