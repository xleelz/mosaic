# Shared skeleton for the vLLM ontology built directly from code (v0.32.0, 5df63a7203).
# Processes: the API server, the engine-core process (scheduler and KV cache manager live here),
# and one GPU worker per tensor-parallel rank (instance group gpu-worker: rank0, rank1, ...).
# Kernels are modeled as interfaces of kind `kernel` whose latency is a CEL expression of shapes.
schema_version: 1
id: vllm
name: vLLM 0.32 (built from code)
description: >-
  vLLM modelled directly from its source at v0.32.0 by area agents, as the low-level GPU
  benchmark of mosaic's code-to-ontology pipeline.
source:
  repo: vllm-project/vllm
  sha: 5df63a7203cdb9328d824a27b682e77c7b9928be

components:
  # External actors
  - {id: api-client, name: API client, kind: client, layer: actors, summary: "An application calling the OpenAI-compatible HTTP API.", attributes: {owner: serving-api}}
  - {id: python-user, name: Python user, kind: client, layer: actors, summary: "Code using the offline LLM class.", attributes: {owner: serving-api}}
  - {id: operator, name: Operator, kind: client, layer: actors, summary: "A person running vllm serve and the CLI.", attributes: {owner: config-platform}}

  # Processes
  - {id: api-server, name: API server, kind: service, layer: process, sources: [vllm/entrypoints/openai/api_server.py], summary: "The FastAPI process serving the OpenAI-compatible API.", attributes: {owner: serving-api}}
  - {id: engine-core, name: Engine core, kind: service, layer: process, sources: [vllm/v1/engine/core.py], summary: "The engine-core process: busy loop, scheduler, KV cache manager, executor.", attributes: {owner: engine-core}}
  - {id: gpu-worker, name: GPU worker, kind: service, layer: process, sources: [vllm/v1/worker/gpu_worker.py], summary: "A worker process driving one GPU (instances rank0, rank1, ...).", attributes: {owner: worker-runner}}
  - {id: control, name: Configuration and platform, kind: module, layer: control, sources: [vllm/config/vllm.py], summary: "Engine arguments, VllmConfig resolution, platforms and plugins.", attributes: {owner: config-platform}}

  # Shared resources
  - id: gpu-memory
    name: GPU memory
    kind: datastore
    layer: hardware
    parent: gpu-worker
    summary: "Device memory of one GPU: weights, activations and the KV cache pool (per rank)."
    attributes: {owner: shared}
    state:
      schema: {type: object, properties: {total_bytes: {type: integer}, weights_bytes: {type: integer}, kv_cache_bytes: {type: integer}, peak_activation_bytes: {type: integer}, non_torch_bytes: {type: integer}, other_process_bytes: {type: integer}, cudagraph_bytes: {type: integer}, device_name: {type: string}, compute_capability: {type: string}}}
      initial: {total_bytes: 85899345920, weights_bytes: 0, kv_cache_bytes: 0, peak_activation_bytes: 0, non_torch_bytes: 0, other_process_bytes: 0, cudagraph_bytes: 0, device_name: "NVIDIA H100 80GB HBM3", compute_capability: "9.0"}
  - {id: hf-hub, name: Hugging Face Hub, kind: external, layer: external, summary: "Model configs, tokenizers and weights.", attributes: {owner: shared}}
  - {id: local-disk, name: Local disk, kind: datastore, layer: storage, summary: "Cached weights and configs.", attributes: {owner: shared}}

schemas:
  - id: EngineCoreRequest
    schema:
      type: object
      required: [request_id, prompt_token_ids, sampling_params]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        prompt_token_ids: {type: array, items: {type: integer}, examples: [[128000, 9906, 1917]]}
        sampling_params:
          type: object
          properties:
            temperature: {type: number, examples: [0.0]}
            top_p: {type: number, examples: [1.0]}
            max_tokens: {type: integer, examples: [16]}
            stop: {type: array, items: {type: string}}
            n: {type: integer, examples: [1]}
            seed: {type: integer}
            ignore_eos: {type: boolean}
        arrival_time: {type: number}
        priority: {type: integer, examples: [0]}
  - id: SchedulerOutput
    schema:
      type: object
      properties:
        scheduled_new_reqs: {type: array}
        scheduled_cached_reqs: {type: object}
        num_scheduled_tokens: {type: object}
        total_num_scheduled_tokens: {type: integer}
        finished_req_ids: {type: array, items: {type: string}}
  - id: ModelRunnerOutput
    schema:
      type: object
      properties:
        req_ids: {type: array, items: {type: string}}
        sampled_token_ids: {type: array, items: {type: array, items: {type: integer}}}
