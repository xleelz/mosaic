schema_version: 1
id: vllm
scenarios:
- id: oracle-models-layers-kda-checkpoint-last-aligned-boundary
  name: ROCm KDA prefill checkpoint targets the last aligned boundary
  description: >-
    tests/models/kimi_k3/test_amd_kda_checkpoint.py::test_checkpoint_metadata_targets_last_aligned_boundary.
    A 200-token and a 128-token prefill, mamba block size 64, alignment 64, align cache mode, one
    reserved checkpoint block: offsets [192, 64], state indices [2, 4] from an arange block table.
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: gdn-attention-metadata-builder.build
    caller: gpu-worker
    as: md
    input:
      use_spec_decode: false
      num_decode_draft_tokens: {$null: true}
      block_table: [[0, 1, 2, 3], [4, 5, 6, 7]]
      query_lens: [200, 128]
      seq_lens: [200, 128]
      block_size: 64
      mamba_cache_mode: align
      num_prefill_checkpoint_blocks: 1
      prefill_checkpoint_alignment: 64
      hash_block_size: 64
      cache_hit_alignment_tokens: 64
  expect:
  - steps.md.result.ok
  - has(steps.md.result.value.checkpoint) && steps.md.result.value.checkpoint != null
  - has(steps.md.result.value.checkpoint) && steps.md.result.value.checkpoint.checkpoint_offsets == [192, 64]
  - has(steps.md.result.value.checkpoint) && steps.md.result.value.checkpoint.state_indices == [2, 4]
- id: oracle-models-layers-nemotron-embed-model-config
  name: nvidia/llama-nemotron-embed-1b-v2 resolves to a bidirectional MEAN-pooling embedding model
  description: >-
    tests/models/language/pooling_mteb_test/test_nemotron.py::test_embed_models_mteb, the config
    assertions of mteb_test_embed_models: architecture LlamaBidirectionalModel, MEAN sequence
    pooling, encoder_only attention, and the ModelConfig properties is_prefix_caching_supported and
    is_chunked_prefill_supported false, read from the resolved config. The MTEB score and the
    embedding values are untranslatable and left out.
  fixtures: [full-tp1-llama-8b]
  state:
    hf-hub:
      models:
        nvidia/llama-nemotron-embed-1b-v2:
          architectures: [LlamaBidirectionalModel]
          model_type: llama
          pooling: avg
          hidden_size: 1024
          intermediate_size: 4096
          max_position_embeddings: 8192
          num_attention_heads: 16
          num_hidden_layers: 16
          num_key_value_heads: 16
          torch_dtype: float32
          vocab_size: 128256
  steps:
  - flow: config-create-engine-config
    as: cfg
    input:
      model: nvidia/llama-nemotron-embed-1b-v2
      runner: pooling
  - interface: model-config.is-prefix-caching-supported
    caller: operator
    as: prefix
    input:
      has_pooler: true
      attn_type: "= steps.cfg.result.value.model_config.attn_type"
      seq_pooling_type: "= steps.cfg.result.value.model_config.pooler_config.seq_pooling_type"
      tok_pooling_type: "= steps.cfg.result.value.model_config.pooler_config.tok_pooling_type"
  - interface: model-config.is-chunked-prefill-supported
    caller: operator
    as: chunked
    input:
      has_pooler: true
      attn_type: "= steps.cfg.result.value.model_config.attn_type"
      seq_pooling_type: "= steps.cfg.result.value.model_config.pooler_config.seq_pooling_type"
      tok_pooling_type: "= steps.cfg.result.value.model_config.pooler_config.tok_pooling_type"
  expect:
  - steps.cfg.result.ok
  - steps.cfg.result.ok && 'LlamaBidirectionalModel' in steps.cfg.result.value.model_config.architectures
  - steps.cfg.result.ok && steps.cfg.result.value.model_config.pooler_config.seq_pooling_type == 'MEAN'
  - steps.cfg.result.ok && steps.cfg.result.value.model_config.attn_type == 'encoder_only'
  - steps.prefix.result.ok && !steps.prefix.result.value.supported
  - steps.chunked.result.ok && !steps.chunked.result.value.supported
- id: oracle-models-layers-triton-scalar-specialization-rep
  name: triton_scalar_specialization_rep maps an integer to its cache-key class representative
  description: >-
    tests/model_executor/test_jit_warmup.py::test_triton_scalar_specialization_rep. The model has no
    interface for vllm/model_executor/warmup/jit_warmup_triton_helper.py, so a direct call doesn't
    validate. This runs the nearest warmup flow and asserts the helper is reachable. The test's
    table, for when it exists: -2^63 -> 2^31; -2^31-1 -> 2^31+1; -2^31 -> 16; 0 -> 16; 1 -> 1; 2 -> 2;
    16 -> 16; 2^31-1 -> 2; 2^31 -> 2^31; 2^31+1 -> 2^31+1; 2^63-1 -> 2^31+1; 2^63 -> 2^63;
    2^63+1 -> 2^63+1; 2^64-1 -> 2^63+1.
  fixtures: [full-tp1-llama-8b]
  steps:
  - {flow: models-kernel-warmup, as: warm}
  expect:
  - steps.warm.result.ok
  - "'jit-warmup-triton-helper.triton-scalar-specialization-rep' in calls"
- id: oracle-models-layers-gemma4-image-schema-variable-patch-counts
  name: Gemma4ImagePixelInputs accepts a list of images with different patch counts
  description: >-
    tests/models/multimodal/processing/test_gemma4_unified.py::test_gemma4_unified_image_schema_accepts_variable_patch_counts.
    TensorShape(bn, np, pp) and (bn, np, 2), np dynamic: shapes [10080, 768], [2520, 768] with
    position ids [10080, 2], [2520, 2] must validate. The model has only the registry row for
    gemma4_mm, and TensorSchema only as Phi3V's fixed (bn, p, 3, h, w) shape, so a direct call doesn't
    validate. This resolves the architecture and asserts the validator is reachable.
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: model-registry.resolve-model-cls
    caller: gpu-worker
    as: cls
    input: {architectures: [Gemma4ForConditionalGeneration]}
  expect:
  - steps.cls.result.ok && steps.cls.result.value.module == 'gemma4_mm'
  - "'gemma4-image-pixel-inputs.validate' in calls"
- id: oracle-models-layers-mtp-override-text-only-types
  name: Qwen3.5 text-only config types map to the same MTP architectures
  description: >-
    tests/models/test_qwen3_5_mtp_config.py::test_mtp_override_recognizes_text_only_types, all 4
    parameters.
  fixtures: [full-tp1-llama-8b]
  steps:
  - {interface: speculative-config.hf-config-override, caller: operator, as: dense, input: {hf_config: {model_type: qwen3_5, architectures: [SomeArch], mtp_num_hidden_layers: 1}}}
  - {interface: speculative-config.hf-config-override, caller: operator, as: moe, input: {hf_config: {model_type: qwen3_5_moe, architectures: [SomeArch], mtp_num_hidden_layers: 1}}}
  - {interface: speculative-config.hf-config-override, caller: operator, as: dense_text, input: {hf_config: {model_type: qwen3_5_text, architectures: [SomeArch], mtp_num_hidden_layers: 1}}}
  - {interface: speculative-config.hf-config-override, caller: operator, as: moe_text, input: {hf_config: {model_type: qwen3_5_moe_text, architectures: [SomeArch], mtp_num_hidden_layers: 1}}}
  expect:
  - steps.dense.result.value.model_type == 'qwen3_5_mtp' && steps.dense.result.value.architectures == ['Qwen3_5MTP'] && steps.dense.result.value.n_predict == 1
  - steps.moe.result.value.model_type == 'qwen3_5_mtp' && steps.moe.result.value.architectures == ['Qwen3_5MoeMTP'] && steps.moe.result.value.n_predict == 1
  - steps.dense_text.result.value.model_type == 'qwen3_5_mtp' && steps.dense_text.result.value.architectures == ['Qwen3_5MTP'] && steps.dense_text.result.value.n_predict == 1
  - steps.moe_text.result.value.model_type == 'qwen3_5_mtp' && steps.moe_text.result.value.architectures == ['Qwen3_5MoeMTP'] && steps.moe_text.result.value.n_predict == 1
- id: oracle-models-layers-decoder-replay-run-gathers-states
  name: DecoderReplayLayers writes every row's KV, then runs the layers on the replay rows
  description: >-
    tests/models/test_deepseek_v41_decoder_replay_layers.py::test_run_gathers_states. Must hold: 401
    tokens, window 128, 229 replay rows; write_batch_kv once on the whole batch; run_layers on the
    rows under the replay context (its metadata, is_padding None); the outer context restored;
    trimmed rows zero. The model has only the registry row for DeepseekV41ForCausalLM, so a direct
    call doesn't validate. This resolves the architecture and asserts the layers are reachable.
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: model-registry.resolve-model-cls
    caller: gpu-worker
    as: cls
    input: {architectures: [DeepseekV41ForCausalLM]}
  expect:
  - steps.cls.result.ok && steps.cls.result.value.class_name == 'DeepseekV41ForCausalLM'
  - "'decoder-replay-layers.call' in calls"
  - "'decoder-replay-layers.write-batch-kv' in calls"
