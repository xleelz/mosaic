- {"id": "oracle-attention-rocm-mxfp4-chunks-split-into-requests", "description": "tests/v1/attention/test_rocm_paged_mxfp4_indexer_plan.py::test_chunks_split_into_requests. plan_prefill_chunks splits each chunk into its requests with local offsets, widths, row and block ends, gather flag and first request.", "fixtures": ["full-tp1-llama-8b"], "steps": [{"interface": "rocm-paged-mxfp4-indexer.topk", "caller": "gpu-model-runner", "as": "plan", "input": {"k": 512, "rows": 4, "width": 4096, "query_start_loc": [0, 1, 4, 7, 12, 18], "seq_lens": [40, 10, 12, 21, 64], "compress_ratio": 2, "candidate_block_size": 8, "min_gather_width": 20.0, "chunks": [{"token_start": 1, "token_end": 12, "num_reqs": 3}, {"token_start": 12, "token_end": 15, "num_reqs": 1}, {"token_start": 15, "token_end": 18, "num_reqs": 1}]}}], "expect": ["has(steps.plan.result.value.plans) && steps.plan.result.value.plans.map(p, p.requests) == [[[0, 3, 0], [3, 6, 1], [6, 11, 2]], [[0, 3, 0]], [[0, 3, 0]]]", "has(steps.plan.result.value.plans) && steps.plan.result.value.plans.map(p, p.query_start_loc) == [[0, 3, 6, 11], [0, 3], [0, 3]]", "has(steps.plan.result.value.plans) && steps.plan.result.value.plans.map(p, p.width) == [10, 32, 32]", "has(steps.plan.result.value.plans) && steps.plan.result.value.plans.map(p, p.context_lens) == [[5, 6, 10], [32], [32]]", "has(steps.plan.result.value.plans) && steps.plan.result.value.plans.map(p, p.use_gather) == [false, true, true]", "has(steps.plan.result.value.plans) && steps.plan.result.value.plans.map(p, p.first_request) == [1, 4, 4]", "trace.exists(e, e.type == 'call.start' && e.interface == 'rocm-paged-mxfp4-indexer.plan-prefill-chunks')"]}
- {"id": "oracle-attention-rocm-fit-kpool-preserves-tail", "description": "tests/v1/attention/test_rocm_glm5next_sparse.py::test_fit_kpool_indices_preserves_tail_and_best_history. fit_kpool_indices_to_aiter keeps every live tail index and the best history that still fits in topk_tokens columns, -1 padded.", "fixtures": ["full-tp1-llama-8b"], "steps": [{"interface": "rocm-aiter-mla-sparse-impl.forward-mqa", "caller": "attention-layer", "as": "f", "input": {"topk_tokens": 6, "num_tokens": 3, "token_indices": [[10, 9, 8, 7, 6, 5, 100, 101], [10, 9, 8, -1, -1, -1, 100, -1], [-1, -1, -1, -1, -1, -1, -1, -1]]}}], "expect": ["has(steps.f.result.value.topk_indices) && steps.f.result.value.topk_indices == [[10, 9, 8, 7, 100, 101], [10, 9, 8, 100, -1, -1], [-1, -1, -1, -1, -1, -1]]", "trace.exists(e, e.type == 'call.start' && e.interface == 'rocm-aiter-mla-sparse-impl.fit-kpool-indices-to-aiter')"]}
