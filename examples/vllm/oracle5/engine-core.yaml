- {"id": "oracle-engine-core-fast-inc-detok-invalid-utf8", "description": "tests/v1/engine/test_fast_incdec_prefix_err.py::test_fast_inc_detok_invalid_utf8_err_case. Translatable part only: incremental update one token at a time accumulates text with no error and delta output adds up. The real gemma vocabulary, the invalid-prefix exception and the exact French text are tokenizer internals.", "fixtures": ["full-tp1-llama-8b"], "steps": [{"interface": "incremental-detokenizer.update", "caller": "output-processor", "as": "u1", "input": {"new_token_ids": [4606], "output_text": "", "stop_terminated": false, "stop": [], "skip_special_tokens": true, "min_tokens": 0, "num_prev_tokens": 0, "include_stop_str_in_output": false}}, {"interface": "incremental-detokenizer.update", "caller": "output-processor", "as": "u2", "input": {"new_token_ids": [1083], "output_text": " t4606", "stop_terminated": false, "stop": [], "skip_special_tokens": true, "min_tokens": 0, "num_prev_tokens": 1, "include_stop_str_in_output": false}}], "expect": ["steps.u1.result.ok && steps.u2.result.ok", "steps.u1.result.value.stop_string == null && steps.u2.result.value.stop_string == null", "steps.u1.result.value.output_text == ' t4606'", "steps.u2.result.value.output_text == ' t4606 t1083'"]}
