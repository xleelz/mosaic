- id: oracle-kernels-ops-cutlass-w4a8
  description: 'tests/kernels/quantization/test_cutlass_w4a8.py test_cutlass_w4a8: each (m, n, k) shape reaches _C::cutlass_w4a8_mm
    once through the Python wrapper. assert_close on the GEMM output is numeric and is not translated.'
  fixtures: *id001
  steps:
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 1
      n: 128
      k: 128
      dtype_bytes: 1
    as: s0
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 1
      n: 512
      k: 1024
      dtype_bytes: 1
    as: s1
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 1
      n: 4096
      k: 4096
      dtype_bytes: 1
    as: s2
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 1
      n: 8192
      k: 28672
      dtype_bytes: 1
    as: s3
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 13
      n: 8192
      k: 4096
      dtype_bytes: 1
    as: s4
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 26
      n: 4096
      k: 8192
      dtype_bytes: 1
    as: s5
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 64
      n: 4096
      k: 4096
      dtype_bytes: 1
    as: s6
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 64
      n: 8192
      k: 28672
      dtype_bytes: 1
    as: s7
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 257
      n: 128
      k: 4096
      dtype_bytes: 1
    as: s8
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 257
      n: 4096
      k: 4096
      dtype_bytes: 1
    as: s9
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 1024
      n: 4096
      k: 8192
      dtype_bytes: 1
    as: s10
    caller: gpu-worker
  - interface: custom-ops.cutlass-w4a8-mm
    input:
      m: 1024
      n: 8192
      k: 4096
      dtype_bytes: 1
    as: s11
    caller: gpu-worker
  expect:
  - steps.s0.result.ok && steps.s1.result.ok && steps.s2.result.ok && steps.s3.result.ok && steps.s4.result.ok && steps.s5.result.ok
    && steps.s6.result.ok && steps.s7.result.ok && steps.s8.result.ok && steps.s9.result.ok && steps.s10.result.ok && steps.s11.result.ok
  - calls['torch-bindings.cutlass-w4a8-mm'] == 12
  - calls['custom-ops.cutlass-w4a8-mm'] == 12
