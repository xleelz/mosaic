schema_version: 1
id: vllm
scenarios:
- id: oracle-kernels-ops-config-picker-exact-match
  description: 'tests/kernels/helion/test_rms_norm_per_block_quant.py TestRmsNormPerBlockQuantConfigPicker.test_config_picker_exact_match:
    the tuned keys contain the exact (hidden_size, group_size, num_tokens) of the input, and pick_config returns it. The keys
    are seeded in the real config manager, and the kernel registers through the real path.'
  fixtures: &id001
  - full-tp1-llama-8b
  state:
    helion-config-manager:
      configs:
        rms_norm_per_block_quant/nvidia_h100:
          has_default: false
          keys:
          - hidden_size: 2048
            group_size: 64
            num_tokens: 16
          - hidden_size: 4096
            group_size: 128
            num_tokens: 16
  steps:
  - interface: helion-kernel-wrapper.register-kernel
    input:
      op_name: rms_norm_per_block_quant
      device_name: NVIDIA H100 80GB HBM3
      helion_installed: true
    as: reg
    caller: gpu-worker
  - interface: helion-kernel-wrapper.call
    input:
      op_name: rms_norm_per_block_quant
      num_tokens: 16
      hidden_size: 4096
      group_size: 128
      intermediate_size:
        $absent: true
    as: pick
    caller: gpu-worker
  expect:
  - steps.reg.result.ok && !steps.reg.result.value.disabled
  - steps.pick.result.ok
  - steps.pick.result.value.case_key == '{"group_size":128,"hidden_size":4096,"num_tokens":16}'
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''silu-mul-fp8.silu-mul-fp8'')'
  max_events: 200000
- id: oracle-kernels-ops-per-tensor-quant-static-schema
  description: 'tests/kernels/quantization/test_quant_op_schema.py test_per_tensor_quant_static_schema: the caller-provided
    scale case of vllm::rocm_aiter_per_tensor_quant runs through opcheck. Only the control flow is translated: the static
    branch reaches the op once with [128, 4096]. The opcheck schema and aliasing checks are below the model.'
  fixtures: *id001
  steps:
  - interface: aiter-ops.per-tensor-quant
    input:
      num_tokens: 128
      hidden_size: 4096
      dtype_bytes: 2
      scale_given: true
    as: wrap
    caller: gpu-worker
  - interface: aiter-ops.rocm-aiter-per-tensor-quant
    input:
      num_tokens: 128
      hidden_size: 4096
      dtype_bytes: 2
    as: op
    caller: gpu-worker
  expect:
  - steps.wrap.result.ok && steps.wrap.result.value.is_dynamic == false
  - steps.wrap.result.value.out_shape == [128, 4096]
  - steps.op.result.ok
  - calls['aiter-ops.rocm-aiter-per-tensor-quant'] == 2
- id: oracle-kernels-ops-dynamic-shapes-backed-aot0-hook1
  description: 'tests/compile/dynamic_shapes/test_dynamic_shapes_compilation.py test_dynamic_shapes_compilation[backed-aot0-hook1]:
    under VLLM_COMPILE, with VLLM_USE_AOT_COMPILE=0 and VLLM_USE_BYTECODE_HOOK=1, the runner warms up and generates non-empty
    output, and the model forward enters the @support_torch_compile __call__. Steps direct and direct2 drive that __call__
    itself. The shapes type has no config in the model, so only the AOT and hook axes differ here. Logprob closeness is numeric.'
  fixtures: *id001
  config:
    compilation-mode: 3
    vllm-use-aot-compile: false
    vllm-use-bytecode-hook: true
    vllm-disable-compile-cache: false
  steps:
  - flow: wr-compile-or-warm-up
    'on': rank0
    as: warm
  - flow: serving-api-offline-generate
    input: &id002
      prompts:
      - Hello, my name is
      sampling_params:
        max_tokens: 5
        temperature: 0
        logprobs: 10
    as: gen
  - flow: kernels-ops-support-torch-compile
    as: direct
  - flow: kernels-ops-support-torch-compile
    as: direct2
  expect:
  - steps.warm.result.ok
  - steps.gen.result.ok
  - size(steps.gen.result.value) == 1 && steps.gen.result.value[0].finished
  - trace.filter(e, e.type == 'call.start' && e.interface == 'support-torch-compile.call').size() > 2
  - steps.direct.result.ok && steps.direct.result.value.path == 'jit-compiled'
  - steps.direct2.result.ok && steps.direct2.result.value.path == 'compiled'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'torch-compile-with-no-guards-wrapper.call')
  max_events: 1000000
