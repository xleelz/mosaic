  - calls['cpu-torch-bindings.cpu-fused-moe'] == 4
  - trace.filter(e, e.type == 'call.start' && e.interface in ['cpu-torch-bindings.prepack-moe-weight', 'cpu-torch-bindings.cpu-fused-moe']).map(e,
    e.interface).slice(0, 3) == ['cpu-torch-bindings.prepack-moe-weight', 'cpu-torch-bindings.prepack-moe-weight', 'cpu-torch-bindings.cpu-fused-moe']
- id: oracle-kernels-ops-rocm-mxfp8-linear-matches-dequant-reference
  description: 'tests/kernels/quantization/test_rocm_mxfp8_linear.py test_rocm_mxfp8_linear_matches_dequant_reference: RocmDotScaledMxfp8LinearKernel
    returns (num_tokens, n) on each V4.1 attention shape through the native dot_scaled GEMM. The model has no such kernel,
    so the format-agnostic ModelOptLinearMethod.apply is the nearest entity. The finite and relative-error checks are numeric.'
  fixtures: *id001
  steps:
  - interface: model-opt-linear-method.apply
    input:
      num_tokens: 1
      in_features: 5120
      out_features: 1792
      bytes_per_weight: 1
      quant: mxfp8
    as: fused_wqa_wkv_1
    caller: gpu-worker
  - interface: model-opt-linear-method.apply
    input:
      num_tokens: 2
      in_features: 5120
      out_features: 1792
      bytes_per_weight: 1
      quant: mxfp8
    as: fused_wqa_wkv_2
    caller: gpu-worker
  - interface: model-opt-linear-method.apply
    input:
      num_tokens: 7
      in_features: 5120
      out_features: 1792
      bytes_per_weight: 1
      quant: mxfp8
    as: fused_wqa_wkv_7
    caller: gpu-worker
  - interface: model-opt-linear-method.apply
    input:
      num_tokens: 16
      in_features: 5120
      out_features: 1792
      bytes_per_weight: 1
      quant: mxfp8
    as: fused_wqa_wkv_16
    caller: gpu-worker
  - interface: model-opt-linear-method.apply
    input:
      num_tokens: 31
      in_features: 5120
      out_features: 1792
      bytes_per_weight: 1
      quant: mxfp8
    as: fused_wqa_wkv_31
    caller: gpu-worker
  - interface: model-opt-linear-method.apply
    input:
      num_tokens: 32
      in_features: 5120
      out_features: 1792
      bytes_per_weight: 1
      quant: mxfp8
    as: fused_wqa_wkv_32
