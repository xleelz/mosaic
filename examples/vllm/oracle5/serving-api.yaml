    == ''bar'''
  - 'jsonParse(((steps.d1.result.value.delta == null || !has(steps.d1.result.value.delta.tool_calls) ? [] : steps.d1.result.value.delta.tool_calls)
    + (steps.d2.result.value.delta == null || !has(steps.d2.result.value.delta.tool_calls) ? [] : steps.d2.result.value.delta.tool_calls))[1].function.arguments)
