schema_version: 1
id: vllm
scenarios:
- id: oracle-serving-api-llm-reranker-nonbinding-doc-limit
  name: A max_tokens_per_doc that does not bind leaves the pair's token ids unchanged
  description: 'tests/entrypoints/pooling/scoring/test_io_processor_unit.py:66 test_llm_reranker_tokenization_is_independent_of_nonbinding_doc_limit:
    the prompt_token_ids equality between the uncapped and the nonbinding call.'
  fixtures:
  - full-tp1-llama-8b
  state: &id001
    app-state:
      supported_tasks:
      - classify
      - token_classify
    async-llm:
      supported_tasks:
      - classify
      - token_classify
  config: &id002
    max-model-len: 100
    model: BAAI/bge-reranker-v2-gemma
    runner: pooling
    served-model-name:
    - BAAI/bge-reranker-v2-gemma
    hf-overrides:
      architectures:
      - GemmaForSequenceClassification
      classifier_from_token:
      - 'Yes'
      method: no_post_processing
  steps:
  - interface: serving-scores.post-rerank
    caller: api-client
    as: uncapped
    input:
      path: /rerank
      body:
        model: BAAI/bge-reranker-v2-gemma
        query: a
        documents:
        - bc
  - interface: serving-scores.post-rerank
    caller: api-client
    as: nonbinding
    input:
      path: /rerank
      body:
        model: BAAI/bge-reranker-v2-gemma
        query: a
        documents:
        - bc
        max_tokens_per_doc: 10
  expect:
  - steps.uncapped.result.ok && steps.nonbinding.result.ok
  - trace.filter(e, e.type == 'call.start' && e.interface == 'base-renderer.tokenize-prompt').size() == 2 && trace.filter(e,
    e.type == 'call.start' && e.interface == 'base-renderer.tokenize-prompt')[0].input.prompt == trace.filter(e, e.type ==
    'call.start' && e.interface == 'base-renderer.tokenize-prompt')[1].input.prompt
  - trace.filter(e, e.type == 'call.end' && e.interface == 'base-renderer.tokenize-prompt')[0].output.prompt_token_ids ==
    trace.filter(e, e.type == 'call.end' && e.interface == 'base-renderer.tokenize-prompt')[1].output.prompt_token_ids
  - steps.uncapped.result.value.usage.prompt_tokens == steps.nonbinding.result.value.usage.prompt_tokens
  - trace.filter(e, e.type == 'call.end' && e.interface == 'scoring-io-processor.truncate-text-to-tokens').size() == 1
  - trace.filter(e, e.type == 'call.end' && e.interface == 'scoring-io-processor.truncate-text-to-tokens')[0].output.text
    == 'bc'
- id: oracle-serving-api-llm-reranker-pair-no-separator
  name: 'use_sep_token False (LLM as reranker): the tokenizer gets prompt_1 + prompt_2 with no separator, one sequence ''abc'''
  description: 'tests/entrypoints/pooling/scoring/test_io_processor_unit.py:66 test_llm_reranker_tokenization_is_independent_of_nonbinding_doc_limit:
    expected ids [1,3,5,6,2] are [CLS] a ##b ##c [SEP], which only the concatenation ''abc'' yields (''a bc'' would be [1,3,4,2]).
    The ids themselves are tokenizer internals; the text handed to the tokenizer is the control-level claim. The test sets
    use_sep_token False by hand; in production adapters.py:443 defaults it to False for as_seq_cls_model LLMs.'
  fixtures:
  - full-tp1-llama-8b
  state: *id001
  config: *id002
  steps:
  - interface: serving-scores.post-rerank
    caller: api-client
    as: uncapped
    input:
      path: /rerank
      body:
        model: BAAI/bge-reranker-v2-gemma
        query: a
        documents:
        - bc
  - interface: serving-scores.post-rerank
    caller: api-client
    as: nonbinding
    input:
      path: /rerank
      body:
        model: BAAI/bge-reranker-v2-gemma
        query: a
        documents:
        - bc
        max_tokens_per_doc: 10
  expect:
  - trace.filter(e, e.type == 'call.start' && e.interface == 'base-renderer.tokenize-prompt').size() == 2
  - trace.filter(e, e.type == 'call.start' && e.interface == 'base-renderer.tokenize-prompt')[0].input.prompt == 'abc'
  - trace.filter(e, e.type == 'call.start' && e.interface == 'base-renderer.tokenize-prompt')[1].input.prompt == 'abc'
- id: oracle-serving-api-harmony-previous-input-empty-content
  name: A previous_input_messages user message with empty content becomes exactly one Harmony message with one empty text
    part
  description: 'tests/entrypoints/openai/responses/test_harmony_utils.py:26 TestResponsePreviousInputToHarmony.test_message_with_empty_content:
    driven through POST /v1/responses on a gpt_oss model (online_renderer.py:429 -> construct_harmony_previous_input_messages
    -> response_previous_input_to_harmony).'
  fixtures:
  - full-tp1-llama-8b
  config:
    model: openai/gpt-oss-20b
    served-model-name:
    - openai/gpt-oss-20b
    hf-overrides:
      model_type: gpt_oss
  steps:
  - interface: openai-serving-responses.post-v1-responses
    caller: api-client
    as: r
    input:
      path: /v1/responses
      body:
        model: openai/gpt-oss-20b
        input: hi
        max_output_tokens: 4
        previous_input_messages:
        - role: user
          content: ''
  expect:
  - steps.r.result.ok
  - trace.exists(e, e.type == 'call.start' && !e.interface.startsWith('openai-serving-responses.') && json(e.input).contains('"content":""')
    && json(e.input).contains('"role":"user"'))
- id: oracle-serving-api-cohere-streaming-3-single-tool-call
  name: 'cohere_command3, single-tool-call: streamed parse_delta accumulates the expected tool calls'
  description: tests/parser/cohere/test_tool_calls.py:180 TestExtractToolCalls.test_streaming [cohere_command3-single-tool-call].
    CohereCommandParser.parse_delta is the code under test; delegating-parser.parse-delta is the only streaming parser interface
    the model has, given the class ParserManager resolved.
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: parser-manager.get-parser
    caller: api-server
    as: pm
    input:
      tool_parser_name: cohere_command3
      reasoning_parser_name: cohere_command3
      enable_auto_tools: true
  - interface: delegating-parser.parse-delta
    caller: api-server
    as: d1
    input:
      parser: = steps.pm.result.value
      delta_text: "<|START_THINKING|> i will call foo with query1<|END_THINKING|><|START_ACTION|>\n[\n    {\"to"
      previous_text: ''
      finished: false
  - interface: delegating-parser.parse-delta
    caller: api-server
    as: d2
    input:
      parser: = steps.pm.result.value
      delta_text: 'ol_call_id": "0", "tool_name": "foo", "parameters": {"query": "query1"}}

        ]

        <|END_ACTION|>'
      previous_text: "<|START_THINKING|> i will call foo with query1<|END_THINKING|><|START_ACTION|>\n[\n    {\"to"
      finished: true
  expect:
  - steps.pm.result.value.base == 'CohereCommandParser'
  - steps.d1.result.ok && steps.d2.result.ok
  - 'size((steps.d1.result.value.delta == null || !has(steps.d1.result.value.delta.tool_calls) ? [] : steps.d1.result.value.delta.tool_calls)
    + (steps.d2.result.value.delta == null || !has(steps.d2.result.value.delta.tool_calls) ? [] : steps.d2.result.value.delta.tool_calls))
    == 1'
  - '((steps.d1.result.value.delta == null || !has(steps.d1.result.value.delta.tool_calls) ? [] : steps.d1.result.value.delta.tool_calls)
    + (steps.d2.result.value.delta == null || !has(steps.d2.result.value.delta.tool_calls) ? [] : steps.d2.result.value.delta.tool_calls))[0].id
    == ''0'' && ((steps.d1.result.value.delta == null || !has(steps.d1.result.value.delta.tool_calls) ? [] : steps.d1.result.value.delta.tool_calls)
    + (steps.d2.result.value.delta == null || !has(steps.d2.result.value.delta.tool_calls) ? [] : steps.d2.result.value.delta.tool_calls))[0].function.name
    == ''foo'''
  - 'jsonParse(((steps.d1.result.value.delta == null || !has(steps.d1.result.value.delta.tool_calls) ? [] : steps.d1.result.value.delta.tool_calls)
    + (steps.d2.result.value.delta == null || !has(steps.d2.result.value.delta.tool_calls) ? [] : steps.d2.result.value.delta.tool_calls))[0].function.arguments)
    == {''query'': ''query1''}'
