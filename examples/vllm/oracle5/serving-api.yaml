  name: 'cohere_command3, citations-no-tool-calls: streamed parse_delta accumulates the expected tool calls'
  description: tests/parser/cohere/test_tool_calls.py:180 TestExtractToolCalls.test_streaming [cohere_command3-citations-no-tool-calls].
