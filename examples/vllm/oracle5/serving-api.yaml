- id: oracle-serving-api-cohere-streaming-4-reasoning-only
  name: 'cohere_command4, reasoning-only: streamed parse_delta accumulates the expected tool calls'
  description: tests/parser/cohere/test_tool_calls.py:180 TestExtractToolCalls.test_streaming [cohere_command4-reasoning-only].
    CohereCommandParser.parse_delta is the code under test; delegating-parser.parse-delta is the only streaming parser interface
    the model has, given the class ParserManager resolved.
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: parser-manager.get-parser
    caller: api-server
    as: pm
    input:
      tool_parser_name: cohere_command4
      reasoning_parser_name: cohere_command4
      enable_auto_tools: true
  - interface: delegating-parser.parse-delta
    caller: api-server
    as: d1
    input:
      parser: = steps.pm.result.value
      delta_text: <|START_THINKING|>just think
      previous_text: ''
      finished: false
  - interface: delegating-parser.parse-delta
    caller: api-server
    as: d2
    input:
      parser: = steps.pm.result.value
      delta_text: ', no response<|END_THINKING|>'
      previous_text: <|START_THINKING|>just think
      finished: true
  expect:
  - steps.pm.result.value.base == 'CohereCommandParser'
  - steps.d1.result.ok && steps.d2.result.ok
  - 'size((steps.d1.result.value.delta == null || !has(steps.d1.result.value.delta.tool_calls) ? [] : steps.d1.result.value.delta.tool_calls)
    + (steps.d2.result.value.delta == null || !has(steps.d2.result.value.delta.tool_calls) ? [] : steps.d2.result.value.delta.tool_calls))
    == 0'
