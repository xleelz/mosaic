        <|START_RESPONSE|>foo <co>bar</co: 0:[1,2],1:[3,4]><|END_RESPONSE|>'
      previous_text: '<|START_THINKING|>This is a rainbow <co>emoji: 🌈</co: 0:[1]><|END_THINKI'
      finished: true
  expect:
  - steps.pm.result.value.base == 'CohereCommandParser'
  - steps.d1.result.ok && steps.d2.result.ok
