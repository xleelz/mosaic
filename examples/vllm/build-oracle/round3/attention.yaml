# Round-3 build-oracle scenarios for attention. Generated by examples/vllm/gen/attention/build.py.
schema_version: 1
id: vllm
scenarios:
- id: oracle3-attention-flashinfer-mla-gathered-heads
  name: tests/v1/attention/test_flashinfer_mla_dcp.py:42 test_flashinfer_mla_forward_uses_gathered_head_count
  description: 'impl.num_heads is 6, but the DCP-gathered query has 24 heads: forward_mqa sizes the kernel from q.shape[-2]; 24 isn''t divisible by trtllm-gen''s 16-head tile, so backend=''cute-dsl''; output
    (2, 24, 512), lse (2, 24).'
  fixtures: &id001
  - full-tp1-llama-8b
  steps:
  - interface: flashinfer-mla-impl.forward-mqa
    caller: gpu-worker
    as: fwd
    input:
      has_decode: true
      query_heads: 24
      dcp_world_size: 1
      num_decode_tokens: 2
      num_decodes: 2
      kv_lora_rank: 512
      return_lse: true
  expect:
  - steps.fwd.result.value.backend == 'cute-dsl'
  - steps.fwd.result.value.output_shape == [2, 24, 512]
  - steps.fwd.result.value.lse_shape == [2, 24]
- id: oracle3-attention-kpool-tail-circular-isolation
  name: tests/v1/attention/test_kpool_tail_slot_mapping.py:391 test_interleaved_decode_pollution_legacy_vs_circular (the circular mapping's part)
  description: 'KPOOL=4. A (tail block 5) decodes positions 8..11, B (tail block 9) 8..13 interleaved: the circular mapping own_block * kpool + pos % kpool keeps A''s boundary pool [8..11] in A''s ring
    (slots 20..23), disjoint from B''s (36..39). The legacy mapping and the pooled-value comparison are test-only code (see the .md).'
  fixtures: *id001
  steps:
  - interface: mla-indexer.compute-kpool-tail-slot-mapping
    caller: gpu-worker
    as: map
    input:
      kpool: 4
      is_cuda: true
      requests:
      - own_block: 5
        positions:
        - 8
        - 9
        - 10
        - 11
      - own_block: 9
        positions:
        - 8
        - 9
        - 10
        - 11
        - 12
        - 13
  expect:
  - steps.map.result.value.slots[0] == [20, 21, 22, 23]
  - steps.map.result.value.slots[1].all(s, s >= 36 && s <= 39)
  - '!steps.map.result.value.slots[0].exists(s, s in steps.map.result.value.slots[1])'
