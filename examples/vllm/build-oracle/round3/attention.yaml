- id: oracle3-attention-gdn-zero-draft-spec-rows
  name: tests/v1/attention/test_gdn_zero_draft_spec_rows.py:170 test_zero_draft_batch_still_applies_the_accepted_token_offset (gdn_none)
  description: 'Two decode rows with zero drafts (num_decode_draft_tokens = [0, 0]) and accepted [3, 1] stay on the speculative path: num_spec_decodes 2, num_decodes 0, accepted counts kept, no non-spec
    state indices; row 0 reads column 2 (a different block from column 0), row 1 reads column 0. The kimi_kda_align case differs only in state shape and cache mode, which the model doesn''t carry.'
  fixtures: *id001
  steps:
  - interface: gdn-attention-metadata-builder.build
    caller: gpu-worker
    as: meta
    input:
      use_spec_decode: true
      num_spec: 3
      num_decode_draft_tokens:
      - 0
      - 0
      query_lens:
      - 1
      - 1
      num_accepted_tokens:
      - 3
      - 1
      block_table:
      - - 0
        - 1
        - 2
        - 3
      - - 4
        - 5
        - 6
        - 7
  expect:
  - steps.meta.result.value.num_spec_decodes == 2 && steps.meta.result.value.num_decodes == 0
  - steps.meta.result.value.num_accepted_tokens == [3, 1]
  - steps.meta.result.value.non_spec_state_indices == null
  - '[0, 1].all(r, (steps.meta.result.value.spec_state_indices[r][[3, 1][r] - 1] != steps.meta.result.value.spec_state_indices[r][0]) == ([3, 1][r] > 1))'
