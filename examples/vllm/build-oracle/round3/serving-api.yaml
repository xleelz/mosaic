# Round-3 in-build oracle for serving-api (build-oracle/round3/serving-api.json).
schema_version: 1
id: vllm
scenarios:
  - id: oracle-r3-serving-api-prompt-embeds-placeholder
    name: "test_chat_utils_prompt_embeds.py::test_ensure_placeholder_token_is_single_token_and_idempotent"
    description: >-
      tests/renderers/test_chat_utils_prompt_embeds.py:117. _ensure_prompt_embeds_placeholder_token registers
      <##PROMPT_EMBEDS##> once (the same id twice); encoding the placeholder gives exactly that id, and five
      back-to-back copies give five ids. Before the call, the five copies are not split into the placeholder.
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: hf-renderer.encode, caller: api-server, as: before, input: {text: "<##PROMPT_EMBEDS##><##PROMPT_EMBEDS##><##PROMPT_EMBEDS##><##PROMPT_EMBEDS##><##PROMPT_EMBEDS##>"}}
      - {interface: hf-renderer.ensure-prompt-embeds-placeholder-token, caller: api-server, as: t1}
      - {interface: hf-renderer.ensure-prompt-embeds-placeholder-token, caller: api-server, as: t2}
      - {interface: hf-renderer.encode, caller: api-server, as: one, input: {text: "<##PROMPT_EMBEDS##>"}}
      - {interface: hf-renderer.encode, caller: api-server, as: five, input: {text: "<##PROMPT_EMBEDS##><##PROMPT_EMBEDS##><##PROMPT_EMBEDS##><##PROMPT_EMBEDS##><##PROMPT_EMBEDS##>"}}
    expect:
      - "steps.t1.result.ok && steps.t1.result.value.token_id == steps.t2.result.value.token_id"
      - "steps.one.result.value.ids == [steps.t1.result.value.token_id]"
      - "steps.five.result.value.ids == lists.range(5).map(i, steps.t1.result.value.token_id)"
      - "!steps.before.result.value.ids.exists(t, t == steps.t1.result.value.token_id)"
  - id: oracle-r3-serving-api-weight-checker-invalid
    name: "test_weight_checker.py::TestSingleGPU::test_invalid_request_returns_400"
    description: >-
      tests/entrypoints/rl/state_transitions/test_weight_checker.py:73. In dev mode, POST /weight_checker with {},
      {action: frobnicate}, {action: compare} (no baseline), [] and null is a 400 each, and /health stays 200.
    fixtures: [full-tp1-llama-8b]
    config: {vllm-server-dev-mode: true}
    steps:
      - {interface: rl-online-router.post-weight-checker, caller: api-client, as: empty, input: {path: /weight_checker, body: {}}}
      - {interface: rl-online-router.post-weight-checker, caller: api-client, as: frob, input: {path: /weight_checker, body: {action: frobnicate}}}
      - {interface: rl-online-router.post-weight-checker, caller: api-client, as: cmp, input: {path: /weight_checker, body: {action: compare}}}
      - {interface: rl-online-router.post-weight-checker, caller: api-client, as: list, input: {path: /weight_checker, body: []}}
      - {interface: rl-online-router.post-weight-checker, caller: api-client, as: none, input: {path: /weight_checker, body: null}}
      - {interface: instrumentator-health.get-health, caller: api-client, as: health, input: {path: /health}}
    expect:
      - "[steps.empty, steps.frob, steps.cmp, steps.list, steps.none].all(s, !s.result.ok && s.result.error.status == 400)"
      - "steps.cmp.result.error.message.contains('baseline')"
      - "steps.health.result.ok"
      - "calls['async-llm.compute-weight-checksums'] == 0"
  - id: oracle-r3-serving-api-qwen3-wait-for-reasoning
    name: "test_qwen3_reasoning.py::test_wait_for_reasoning_follows_thinking[True|False]"
    description: "tests/parser/engine/test_qwen3_reasoning.py:228. Qwen3Parser(chat_template_kwargs={enable_thinking: t}).parser_engine_config.wait_for_reasoning is t, for both values."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: qwen3-parser.init, caller: api-server, as: on, input: {chat_template_kwargs: {enable_thinking: true}}}
      - {interface: qwen3-parser.init, caller: api-server, as: off, input: {chat_template_kwargs: {enable_thinking: false}}}
    expect:
      - "steps.on.result.value.parser_engine_config.wait_for_reasoning == true && steps.on.result.value.parser_engine_config.initial_state == 'REASONING'"
      - "steps.off.result.value.parser_engine_config.wait_for_reasoning == false && steps.off.result.value.parser_engine_config.initial_state == 'CONTENT'"
  - id: oracle-r3-serving-api-video-num-frames-override
    name: "test_video.py::test_request_media_io_kwargs_override_uses_fewer_video_frames"
    description: >-
      tests/entrypoints/multimodal/openai/chat_completion/test_video.py:205. With --media-io-kwargs video.num_frames=32
      and --trust-request-mm-kwargs, a request whose media_io_kwargs asks for 4 frames reports fewer prompt tokens than
      the same request without it. Without --trust-request-mm-kwargs the override is a 400 (protocol.py:72-97).
    fixtures: [full-tp1-llama-8b]
    config: {model-is-multimodal: true, trust-request-mm-kwargs: true, media-io-video-num-frames: 32}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, as: dflt, input: {path: /v1/chat/completions, body: {max_completion_tokens: 1, temperature: 0.0, messages: [{role: user, content: [{type: text, text: "What's in this video?"}, {type: video_url, video_url: {url: "https://example.org/sample.mp4"}}]}]}}}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, as: few, input: {path: /v1/chat/completions, body: {max_completion_tokens: 1, temperature: 0.0, media_io_kwargs: {video: {num_frames: 4}}, messages: [{role: user, content: [{type: text, text: "What's in this video?"}, {type: video_url, video_url: {url: "https://example.org/sample.mp4"}}]}]}}}
    expect:
      - "steps.dflt.result.ok && steps.few.result.ok"
      - "steps.few.result.value.usage.prompt_tokens < steps.dflt.result.value.usage.prompt_tokens"
  - id: oracle-r3-serving-api-video-override-untrusted
    name: "media_io_kwargs without --trust-request-mm-kwargs (the server-side guard behind the override test)"
    description: "vllm/entrypoints/generate/base/protocol.py:72-97: per-request media_io_kwargs need --trust-request-mm-kwargs; otherwise 400 before any engine request."
    fixtures: [full-tp1-llama-8b]
    config: {model-is-multimodal: true}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, as: few, input: {path: /v1/chat/completions, body: {max_completion_tokens: 1, media_io_kwargs: {video: {num_frames: 4}}, messages: [{role: user, content: [{type: video_url, video_url: {url: "https://example.org/sample.mp4"}}]}]}}}
    expect:
      - "!steps.few.result.ok && steps.few.result.error.status == 400 && steps.few.result.error.message.contains('--trust-request-mm-kwargs')"
      - "calls['async-llm.generate'] == 0"
