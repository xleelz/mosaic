# Round-3 unit tests of the distributed area (build-oracle/round3/distributed.json), translated.
# Run with the merged model: check ... -f examples/vllm/build-oracle/round3/distributed.yaml --scenario '^r3-distributed'
schema_version: 1
id: vllm

scenarios:
  - id: r3-distributed-1-moriio-exact-unmap
    name: "tests/v1/kv_connector/unit/test_moriio_unmap.py:31 test_exact_match_unmap_clears_both_tables"
    description: "map_request_id('rid-1', 'tid-1') then unmap_request_id('rid-1'): both id tables end empty."
    flow: distributed-moriio-unmap
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: moriio-connector-scheduler.map-request-id, caller: engine-core, as: map, input: {request_id: rid-1, transfer_id: tid-1}}
      - {flow: distributed-moriio-unmap, as: unmap, input: {request_id: rid-1, transfer_id: {$null: true}}}
    expect:
      - "steps.unmap.result.ok"
      - "state['moriio-connector-scheduler'].request_id_to_transfer_id == {} && state['moriio-connector-scheduler'].transfer_id_to_request_id == {}"

  - id: r3-distributed-2-opaque-fallback-mapping
    name: "tests/v1/kv_connector/unit/offloading_connector/test_canonical_mapping.py:404 test_opaque_fallback_places_page_whole"
    description: "_opaque_fallback_mapping(1024, 4, 2): canonical page 4096 bytes, not parallelism-agnostic, one copy (0 -> 2048, 1024 bytes), one writer; the four ranks' mappings tile the canonical page exactly once."
    flow: distributed-offload-opaque-mapping
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: distributed-offload-opaque-mapping, as: m, input: {page_size_bytes: 1024, num_ranks: 4, rank: 2}}
      - {flow: distributed-offload-opaque-mapping, as: r0, input: {page_size_bytes: 1024, num_ranks: 4, rank: 0}}
      - {flow: distributed-offload-opaque-mapping, as: r1, input: {page_size_bytes: 1024, num_ranks: 4, rank: 1}}
      - {flow: distributed-offload-opaque-mapping, as: r3, input: {page_size_bytes: 1024, num_ranks: 4, rank: 3}}
    expect:
      - "steps.m.result.value.canonical_page_size_bytes == 4096 && !steps.m.result.value.parallelism_agnostic"
      - "steps.m.result.value.runs.map(r, [r.local_offset, r.canonical_offset, r.fragment_size]) == [[0, 2048, 1024]]"
      - "steps.m.result.value.num_writers == 1"
      - "[steps.r0, steps.r1, steps.m, steps.r3].map(s, s.result.value.runs[0].canonical_offset) == [0, 1024, 2048, 3072] && [steps.r0, steps.r1, steps.m, steps.r3].all(s, s.result.value.runs[0].fragment_size == 1024)"

  - id: r3-distributed-3-embedding-cache-get-missing
    name: "tests/v1/ec_connector/unit/cpu/scheduler/test_embedding_cache.py:77 test_get_missing_returns_none"
    description: "A fresh EmbeddingCache returns None for an unknown key."
    flow: distributed-ec-embedding-cache-get
    fixtures: [full-tp1-llama-8b]
    input: {key: a}
    expect:
      - "result.ok && result.value == null"

  - id: r3-distributed-4-m2n-rank-four-rejected
    name: "tests/distributed/test_weight_transfer_m2n.py:143 TestTransferable.test_rank_four_rejected"
    description: "check_transferable('w', bfloat16, (2, 2, 2, 2)) raises ValueError mentioning rank 4."
    flow: distributed-m2n-check-transferable
    fixtures: [full-tp1-llama-8b]
    input: {name: w, dtype: bfloat16, shape: [2, 2, 2, 2]}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('rank 4')"
