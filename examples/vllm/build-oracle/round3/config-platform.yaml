# Round-3 unit tests of the config-platform area (build-oracle/round3/config-platform.json), translated by hand
# (config-platform has no generator). Run with the merged model:
#   check ... -f examples/vllm/build-oracle/round3/config-platform.yaml --scenario '^r3-config-platform'
# Tests 1, 3 and 6 are untranslatable for config-platform; see config-platform.md.
schema_version: 1
id: vllm

scenarios:
  - id: r3-config-platform-2-draft-model-engine-args-tp
    name: "tests/v1/e2e/spec_decode/draft_model/test_draft_model.py:184 test_draft_model_engine_args_tensor_parallelism"
    description: "EngineArgs(model=Qwen/Qwen3-1.7B-FP8, TP 2, speculative draft_model Qwen/Qwen3-0.6B with draft_tensor_parallel_size 1).create_engine_config(): the target is TP 2 and fp8; the draft config is TP 1 and unquantized."
    fixtures: [full-tp1-llama-8b]
    state:
      platforms: {host: {device_count: 2}}
      hf-hub:
        models:
          Qwen/Qwen3-1.7B-FP8: {architectures: [Qwen3ForCausalLM], model_type: qwen3, num_attention_heads: 16, num_key_value_heads: 8, max_position_embeddings: 40960, quantization_config: {quant_method: fp8, activation_scheme: dynamic, fmt: e4m3, weight_block_size: [128, 128]}}
          Qwen/Qwen3-0.6B: {architectures: [Qwen3ForCausalLM], model_type: qwen3, num_attention_heads: 16, num_key_value_heads: 8, max_position_embeddings: 40960}
    steps:
      - interface: engine-args.create-engine-config
        caller: operator
        as: cfg
        input:
          model: Qwen/Qwen3-1.7B-FP8
          usage_context: {$null: true}
          tensor_parallel_size: 2
          speculative_config: {model: Qwen/Qwen3-0.6B, method: draft_model, num_speculative_tokens: 3, draft_tensor_parallel_size: 1}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.parallel_config.tensor_parallel_size == 2"
      - "steps.cfg.result.value.model_config.quantization == 'fp8'"
      - "steps.cfg.result.value.speculative_config.draft_tensor_parallel_size == 1"
      - "steps.cfg.result.value.speculative_config.draft_quantization == null"
  - id: r3-config-platform-4-hf-hub-nonlora-adapter
    name: "tests/plugins_tests/lora_resolvers/test_hf_hub_resolver.py:74 test_nonlora_adapter"
    description: "HfHubResolver([granite rag-agent-lib]).resolve_lora(base, 'ibm-granite/granite-3.3-8b-rag-agent-lib/README.md') is None: README.md is not a directory holding an adapter_config.json, so nothing is downloaded."
    fixtures: [full-tp1-llama-8b]
    state:
      hf-hub:
        repos:
          ibm-granite/granite-3.3-8b-rag-agent-lib:
            files: [README.md, answerability_prediction_lora/adapter_config.json, answerability_prediction_lora/adapter_model.safetensors]
            adapter_configs:
              answerability_prediction_lora: {peft_type: LORA, base_model_name_or_path: ibm-granite/granite-3.3-8b-instruct}
    steps:
      - interface: hf-hub-resolver.resolve-lora
        caller: operator
        as: readme
        input: {repo_list: [ibm-granite/granite-3.3-8b-rag-agent-lib], base_model_name: ibm-granite/granite-3.3-8b-instruct, lora_name: ibm-granite/granite-3.3-8b-rag-agent-lib/README.md}
    expect:
      - "steps.readme.result.ok && steps.readme.result.value == null"
      - "!io.exists(i, i.interface == 'hf-hub.snapshot-download')"
  - id: r3-config-platform-5-speculators-model-integration
    name: "tests/v1/e2e/spec_decode/speculators/test_speculators.py:28 test_speculators_model_integration (config part, both params)"
    description: "vllm serve <speculator-model>: the speculators config is detected, the verifier becomes the served model and speculative decoding is enabled with the checkpoint as the draft. Generation, GSM8k accuracy and output matching are below the config level (see the .md)."
    fixtures: [full-tp1-llama-8b]
    state:
      hf-hub:
        models:
          RedHatAI/Llama-3.1-8B-Instruct-speculator.eagle3: {architectures: [Eagle3Speculator], speculators_model_type: eagle3, speculators_config: {proposal_methods: [{proposal_type: eagle3, speculative_tokens: 3}], verifier: {name_or_path: meta-llama/Llama-3.1-8B-Instruct}}, transformer_layer_config: {model_type: llama}, num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072}
          RedHatAI/Qwen3-8B-speculator.eagle3: {architectures: [Eagle3Speculator], speculators_model_type: eagle3, speculators_config: {proposal_methods: [{proposal_type: eagle3, speculative_tokens: 3}], verifier: {name_or_path: Qwen/Qwen3-8B}}, transformer_layer_config: {model_type: qwen3}, num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 40960}
          Qwen/Qwen3-8B: {architectures: [Qwen3ForCausalLM], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 40960}
    steps:
      - {interface: engine-args.create-engine-config, caller: operator, as: llama, input: {model: RedHatAI/Llama-3.1-8B-Instruct-speculator.eagle3, enable_chunked_prefill: {$null: true}, block_size: {$null: true}}}
      - {interface: engine-args.create-engine-config, caller: operator, as: qwen, input: {model: RedHatAI/Qwen3-8B-speculator.eagle3, enable_chunked_prefill: {$null: true}, block_size: {$null: true}}}
    expect:
      - "steps.llama.result.ok && steps.llama.result.value.model_config.model == 'meta-llama/Llama-3.1-8B-Instruct'"
      - "steps.llama.result.value.speculative_config.method == 'eagle3' && steps.llama.result.value.speculative_config.num_speculative_tokens > 0 && steps.llama.result.value.speculative_config.model == 'RedHatAI/Llama-3.1-8B-Instruct-speculator.eagle3'"
      - "steps.qwen.result.ok && steps.qwen.result.value.model_config.model == 'Qwen/Qwen3-8B' && steps.qwen.result.value.speculative_config.method == 'eagle3'"
