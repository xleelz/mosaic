- id: oracle-r3-scheduler-kv-2
  name: A normal regex compiles under the timeout guard
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: structured-output-utils.compile-regex-with-timeout
    caller: xgrammar-backend
    as: c
    input:
      pattern: '[a-z]+'
  expect:
  - steps.c.result.ok && steps.c.result.value.compiled && steps.c.duration_ms < 5000
  - trace.exists(e, e.type == 'call.end' && e.interface == 'structured-output-utils.compile-regex-with-timeout')
  description: tests/v1/structured_output/test_regex_compilation_timeout.py:23 test_normal_regex_compiles_successfully
- id: oracle-r3-scheduler-kv-3
  name: Three prompts prefill concurrently in 2-token chunks (long_prefill_token_threshold 2, budget 6) and each finishes with one output
  description: tests/v1/core/test_scheduler_e2e.py:25 test_concurrent_partial_prefill
  fixtures:
  - tp1-llama-8b
  config:
    long-prefill-token-threshold: 2
    max-num-batched-tokens: 6
    max-num-seqs: 3
    async-scheduling: false
  steps:
  - flow: scheduler-add-request
    as: a0
    input:
      request_id: cmpl-r0
      prompt_token_ids: &id001
      - 1
      - 15043
      - 590
      - 1024
      - 338
      - 4755
      - 322
      - 306
      - 29871
      sampling_params:
        max_tokens: 1
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: cmpl-r1
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 1
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: cmpl-r2
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 1
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-update-from-output
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - []
        - []
        - []
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-update-from-output
    as: u2
    input:
      scheduler_output: = steps.s2.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - []
        - []
        - []
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-update-from-output
    as: u3
    input:
      scheduler_output: = steps.s3.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - []
        - []
        - []
  - flow: scheduler-schedule
    as: s4
    input: {}
  - flow: scheduler-update-from-output
    as: u4
    input:
      scheduler_output: = steps.s4.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - []
        - []
        - []
  - flow: scheduler-schedule
    as: s5
    input: {}
  - flow: scheduler-update-from-output
    as: u5
    input:
      scheduler_output: = steps.s5.result.value
      model_runner_output:
        req_ids:
        - cmpl-r0
        - cmpl-r1
        - cmpl-r2
        sampled_token_ids:
        - - 791
        - - 791
        - - 791
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''cmpl-r0'': 2, ''cmpl-r1'': 2, ''cmpl-r2'': 2}'
  - 'steps.s5.result.value.num_scheduled_tokens == {''cmpl-r0'': 1, ''cmpl-r1'': 1, ''cmpl-r2'': 1}'
  - '[steps.u1, steps.u2, steps.u3, steps.u4].all(u, u.result.value.outputs == [])'
  - size(steps.u5.result.value.outputs) == 3 && steps.u5.result.value.outputs.all(o, size(o.new_token_ids) == 1 && o.finish_reason == 'length')
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.update-from-output')
- id: oracle-r3-scheduler-kv-6
  name: A partial-tail entry (hash at 10 tokens inside a 6-token block) is hit by a replay and by a longer request
  description: tests/v1/core/prefix_cache/test_partial_prefix_cache_primitives.py:309 test_later_request_hits_cached_partial_tail
  fixtures:
  - tp1-llama-8b
  state:
    block-pool:
      num_gpu_blocks: 3
      next_fresh: 1
      free_front: []
      free_tail: []
      ref_cnt: {}
      block_hash: {}
      cached: {}
      hash_tokens: {}
  steps:
  - interface: block-pool.get-new-blocks
    caller: kv-cache-manager
    as: alloc
    input:
      num_blocks: 2
  - interface: block-pool.cache-full-blocks
    caller: kv-cache-manager
    as: full
    input:
      block_ids:
      - 1
      block_hashes:
      - 0,0,1,1,2,2@6
  - interface: block-pool.cache-partial-block
    caller: kv-cache-manager
    as: part
    input:
      block_id: 2
      block_hash: 0,0,1,1,2,2,3,3,4,4@10
      num_tokens: 10
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: replay
    input:
      block_hash: 0,0,1,1,2,2,3,3,4,4@10
  expect:
  - steps.alloc.result.value.block_ids == [1, 2] && steps.part.result.value.cached
  - steps.replay.result.value.block.block_id == 2
  - trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-cached-block')
