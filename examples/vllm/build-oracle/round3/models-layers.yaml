# Round-3 in-build oracle for models-layers (build-oracle/round3/models-layers.json).
schema_version: 1
id: vllm
scenarios:
  - id: oracle-r3-models-layers-intfloat-embed
    name: "test_intfloat.py::test_embed_models_mteb (model-level part)"
    description: >-
      tests/models/language/pooling_mteb_test/test_intfloat.py:55. vllm_runner(runner='pooling') on intfloat/e5-small
      (BertModel) and multilingual-e5-base (XLMRobertaModel) must resolve both architectures to vLLM embedding classes.
      The MTEB scores are numerics (untranslatable); pooler/attn-type flags belong to config-platform's ModelConfig.
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: models-registry-resolve, as: bert, input: {architectures: [BertModel]}}
      - {flow: models-registry-resolve, as: xlmr, input: {architectures: [XLMRobertaModel]}}
      - {flow: models-registry-inspect, as: info, input: {architectures: [BertModel]}}
    expect:
      - "steps.bert.result.ok && steps.bert.result.value.module == 'bert' && steps.bert.result.value.class_name == 'BertEmbeddingModel' && steps.bert.result.value.table == 'embedding'"
      - "steps.xlmr.result.ok && steps.xlmr.result.value.class_name == 'RobertaEmbeddingModel' && steps.xlmr.result.value.is_pooling"
      - "steps.info.result.value.is_pooling_model && !steps.info.result.value.is_text_generation_model"
      # inspection runs the registry subprocess once and caches the _ModelInfo
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'model-registry.inspect-model-cls' && e.error == null)"
  - id: oracle-r3-models-layers-tensor-schema-inconsistent
    name: "test_tensor_schema.py::test_tensor_schema_inconsistent_shapes_in_list"
    description: "tests/utils_/test_tensor_schema.py:127: 16 patch tensors, the second (64,3,16,16) among (64,3,32,32): ValueError 'contains inconsistent shapes'."
    fixtures: [tp1-llama-8b]
    steps:
      - interface: phi3v-image-pixel-inputs.validate
        caller: gpu-worker
        as: v
        input:
          pixel_values: [[64, 3, 32, 32], [64, 3, 16, 16], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32], [64, 3, 32, 32]]
          image_sizes: [16, 2]
    expect:
      - "!steps.v.result.ok && steps.v.result.error.code == 'value-error'"
      - "steps.v.result.error.message.contains('contains inconsistent shapes') && steps.v.result.error.message.contains('(index 1)')"
  - id: oracle-r3-models-layers-ernie-mrope-single-image
    name: "test_ernie45_vl_mrope.py::test_get_mrope_input_positions_single_image"
    description: "tests/model_executor/test_ernie45_vl_mrope.py:84: one image at offset 1, length 4, grid (1,4,4) with spatial conv 2 -> positions [[0,1,1,1,1,3,4],[0,1,1,2,2,3,4],[0,1,2,1,2,3,4]], delta -2."
    fixtures: [tp1-llama-8b]
    steps:
      - interface: ernie45-vl-moe-for-conditional-generation.get-mrope-input-positions
        caller: gpu-worker
        as: p
        input:
          input_tokens: [10, 20, 21, 22, 23, 30, 31]
          mm_features: [{modality: image, offset: 1, length: 4, grid_thw: [1, 4, 4]}]
          spatial_conv_size: 2
          temporal_conv_size: 2
    expect:
      - "steps.p.result.ok && steps.p.result.value.positions == [[0, 1, 1, 1, 1, 3, 4], [0, 1, 1, 2, 2, 3, 4], [0, 1, 2, 1, 2, 3, 4]]"
      - "steps.p.result.value.delta == -2"
