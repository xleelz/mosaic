- id: oracle3-engine-core-sanitized-opentelemetry-name
  name: tests/v1/metrics/test_ray_metrics.py:85 test_sanitized_opentelemetry_name
  fixtures: *id001
  steps:
  - interface: ray-prometheus-metric.get-sanitized-opentelemetry-name
    caller: api-server
    as: n0
    input:
      name: valid_metric_123_abcDEF
  - interface: ray-prometheus-metric.get-sanitized-opentelemetry-name
    caller: api-server
    as: n1
    input:
      name: metric-name.test
  - interface: ray-prometheus-metric.get-sanitized-opentelemetry-name
    caller: api-server
    as: n2
    input:
      name: metric:name
  - interface: ray-prometheus-metric.get-sanitized-opentelemetry-name
    caller: api-server
    as: n3
    input:
      name: metric:name@with#special%chars
  - interface: ray-prometheus-metric.get-sanitized-opentelemetry-name
    caller: api-server
    as: n4
    input:
      name: vllm:engine_stats/time.latency_ms-99p
  expect:
  - steps.n0.result.value == 'valid_metric_123_abcDEF'
  - steps.n1.result.value == 'metric_name_test'
  - steps.n2.result.value == 'metric_name'
  - steps.n3.result.value == 'metric_name_with_special_chars'
  - steps.n4.result.value == 'vllm_engine_stats_time_latency_ms_99p'
