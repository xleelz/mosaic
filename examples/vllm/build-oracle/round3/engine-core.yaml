# Round-3 build-oracle scenarios for engine-core. Generated by examples/vllm/gen/engine-core/round3.py.
schema_version: 1
id: vllm
scenarios:
- id: oracle3-engine-core-kv-transfer-rejection-no-watermark
  name: tests/v1/engine/test_kv_transfer_rejection.py:13 test_kv_transfer_rejection_stub_disables_watermarking
  fixtures: &id001
  - full-tp1-llama-8b
  description: The stub request AsyncLLM submits for a rejected KV transfer carries SamplingParams(watermarking=False), so a configured watermark never applies to it.
  steps:
  - interface: async-llm.notify-kv-transfer-request-rejected
    caller: api-server
    as: n
    input:
      request_id: request
      kv_transfer_params:
        do_remote_prefill: true
  - flow: engine-core-busy-loop
    as: loop
    input:
      iterations: 1
  expect:
  - steps.n.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core-proc.process-input-sockets' && e.input.request.request_id == 'request' && e.input.request.sampling_params.watermarking == false)
  - 'trace.exists(e, e.type == ''call.start'' && e.interface == ''scheduler.add-request'' && e.input.request_id == ''request'' && e.input.sampling_params.watermarking == false && e.input.sampling_params.extra_args.kv_transfer_params
    == {''do_remote_prefill'': true})'
- id: oracle3-engine-core-custom-class-serialization-with-pickle
  name: tests/v1/test_serial_utils.py:249 test_custom_class_serialization_allowed_with_pickle
  fixtures: *id001
  config:
    vllm-allow-insecure-serialization: true
  description: 'VLLM_ALLOW_INSECURE_SERIALIZATION=1: MsgpackEncoder pickles the custom object into a CUSTOM_TYPE_PICKLE extension and MsgpackDecoder(CustomClass) unpickles an equal object.'
  steps:
  - interface: msgpack-serializer.encode
    caller: api-server
    as: enc
    input:
      obj:
        kind: object
        type: CustomClass
        value:
          value: test_value
  - interface: msgpack-serializer.decode
    caller: api-server
    as: dec
    input:
      bufs: = steps.enc.result.value.bufs
      type: CustomClass
  expect:
  - steps.enc.result.ok && steps.dec.result.ok
  - 'steps.dec.result.value.obj.type == ''CustomClass'' && steps.dec.result.value.obj.value == {''value'': ''test_value''}'
- id: oracle3-engine-core-llm-startup-error-tp1-load-weights
  name: tests/v1/shutdown/test_startup_error.py:85 test_llm_startup_error[tp=1, failing_method=load_weights]
  fixtures: *id001
  faults:
  - target: gpu-worker-impl.load-model
    type: error
    code: runtime-error
    message: Simulated Error in startup!
    instance: rank0
  description: 'VLLM_ENABLE_V1_MULTIPROCESSING=1: LLM(...) builds an LLMEngine over a SyncMPClient; rank 0 raising in load_weights (the profile run calls forward) fails the engine core, and the client raises
    "Engine core initialization failed".'
  steps:
  - interface: llm-engine.from-engine-args
    caller: python-user
    as: e
  expect:
  - '!steps.e.result.ok && steps.e.result.error.message.matches(''initialization fail(ed|ure)'')'
