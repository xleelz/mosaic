# Round-3 in-build oracle for worker-runner: tests/... from build-oracle/round3/worker-runner.json.
# Run merged: check -f skeleton -f fixtures -f worlds -f <fragments> -f this file --scenario '^oracle-build-worker-runner-r3'
schema_version: 1
id: vllm
scenarios:
  - id: oracle-build-worker-runner-r3-2
    name: "test_picks_longest_match_among_2_3_4_grams: a 3-gram match beats a more recent 2-gram match"
    description: "tests/v1/spec_decode/test_ngram_gpu.py:185. min_n 2, max_n 4, k 2, context [2,3,4,50,51,3,4,60,61,1,2,3,4]: the 3-gram [2,3,4] at 0 is preferred over the 2-gram [3,4] at 5, so the drafts are [50, 51]. Sibling cases from the same file: right-most among equal n, a too-short context, and num_sampled 0."
    fixtures: [full-tp1-llama-8b]
    config: {speculative-method: ngram_gpu, num-speculative-tokens: 2, prompt-lookup-min: 2, prompt-lookup-max: 4}
    steps:
      - {interface: ngram-gpu-speculator.propose, caller: gpu-model-runner, as: p, input: {req_ids: [r0], num_speculative_tokens: 2, token_ids: [[2, 3, 4, 50, 51, 3, 4, 60, 61, 1, 2, 3, 4]], num_sampled: [1], last_sampled: [4]}}
      - {interface: ngram-gpu-speculator.propose, caller: gpu-model-runner, as: short, input: {req_ids: [r0], num_speculative_tokens: 2, token_ids: [[5, 6]], num_sampled: [1], last_sampled: [99]}}
      - {interface: ngram-gpu-speculator.propose, caller: gpu-model-runner, as: zero, input: {req_ids: [r0], num_speculative_tokens: 2, token_ids: [[1, 2, 3, 1, 2]], num_sampled: [0], last_sampled: [77]}}
    expect:
      - "steps.p.result.value.draft_token_ids == {'r0': [50, 51]}"
      - "steps.short.result.value.draft_token_ids == {'r0': [99, 99]}"
      - "steps.zero.result.value.draft_token_ids == {'r0': [77, 77]}"
  - id: oracle-build-worker-runner-r3-2b
    name: "test_picks_rightmost_when_multiple_matches: among equal-length matches the right-most wins"
    description: "tests/v1/spec_decode/test_ngram_gpu.py:193 (sibling of the sampled test), single block: [1,2,3,100,1,2,3,200,1,2,3,300,1,2,3] with n = 3 drafts [300, 1]."
    fixtures: [full-tp1-llama-8b]
    config: {speculative-method: ngram_gpu, num-speculative-tokens: 2, prompt-lookup-min: 3, prompt-lookup-max: 3}
    steps:
      - {interface: ngram-gpu-speculator.propose, caller: gpu-model-runner, as: p, input: {req_ids: [r0], num_speculative_tokens: 2, token_ids: [[1, 2, 3, 100, 1, 2, 3, 200, 1, 2, 3, 300, 1, 2, 3]], num_sampled: [1], last_sampled: [3]}}
    expect:
      - "steps.p.result.value.draft_token_ids == {'r0': [300, 1]}"
  - id: oracle-build-worker-runner-r3-3
    name: "test_alloc_conf_from_env_precedence: PYTORCH_CUDA_ALLOC_CONF beats PYTORCH_HIP_ALLOC_CONF; nothing set gives ''"
    description: "tests/device_allocator/test_alloc_conf.py:99."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: alloc-conf.alloc-conf-from-env, caller: cu-mem-allocator, as: both, input: {environ: {PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:256", PYTORCH_HIP_ALLOC_CONF: "max_split_size_mb:128"}}}
      - {interface: alloc-conf.alloc-conf-from-env, caller: cu-mem-allocator, as: none, input: {environ: {}}}
      - {interface: alloc-conf.current-alloc-conf, caller: cu-mem-allocator, as: live, input: {live: "max_split_size_mb:64", environ: {PYTORCH_ALLOC_CONF: "stale:True"}}}
      - {interface: alloc-conf.current-alloc-conf, caller: cu-mem-allocator, as: stale, input: {environ: {PYTORCH_ALLOC_CONF: "stale:True"}}}
    expect:
      - "steps.both.result.value.conf == 'max_split_size_mb:256' && steps.none.result.value.conf == ''"
      - "steps.live.result.value.conf == 'max_split_size_mb:64' && steps.stale.result.value.conf == 'stale:True'"
  - id: oracle-build-worker-runner-r3-6
    name: "test_dflash_prefill_reserves_lookahead_blocks: a DFlash prefill of one block allocates the prefill block plus one lookahead block"
    description: "tests/v1/spec_decode/test_dflash_lookahead.py:98. DFlash with 3 speculative tokens reserves num_speculative_tokens + 1 = 4 lookahead slots (vllm/config/vllm.py:631-634); a 16-token prompt with block size 16 needs 20 slots, so 2 blocks. The scheduler is scheduler-kv's; the worker area translates its own test."
    fixtures: [full-tp1-llama-8b]
    config: {speculative-method: dflash, num-speculative-tokens: 3, enable-prefix-caching: false}
    steps:
      - {flow: scheduler-add-request, as: add, input: {request_id: chatcmpl-df1, prompt_segments: [{key: doc-df1, num_tokens: 16}], sampling_params: {max_tokens: 8}}}
      - {flow: scheduler-schedule, as: s1, input: {}}
    expect:
      - "steps.s1.result.value.num_scheduled_tokens['chatcmpl-df1'] == 16"
      - "size(steps.s1.result.value.scheduled_new_reqs[0].block_ids) == 2"
