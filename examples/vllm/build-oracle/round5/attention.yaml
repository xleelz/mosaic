      - 1
      - 2
      - 3
      num_reqs: 3
      num_actual_tokens: 3
      max_query_len: 1
      decode_threshold: 1
      require_uniform: true
    as: s
  expect:
  - 'steps.s.result.value == {''num_decodes'': 3, ''num_prefills'': 0, ''num_decode_tokens'': 3, ''num_prefill_tokens'': 0}'
