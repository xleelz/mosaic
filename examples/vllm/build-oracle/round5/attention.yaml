- id: oracle5-attention-aiter-prefill-is-available-disabled
  name: tests/v1/attention/test_mla_prefill_selector.py:556 test_is_available_delegates_to_rocm_aiter_ops (is_enabled False)
  description: AiterFlashAttnPrefillBackend.is_available returns rocm_aiter_ops.is_enabled(). The test patches is_enabled; the scenario sets AITER's enabled flag on a ROCm MI300 (gfx942) with aiter installed
    instead.
  fixtures: *id001
  config:
    vllm-target-device: rocm
  state:
    aiter-ops:
      aiter_found: true
      gcn_arch: gfx942
      flags:
        _AITER_ENABLED: false
  steps:
  - interface: mla-prefill-backend.is-available
    caller: gpu-worker
    input:
      backend: ROCM_AITER_FA
    as: a
  expect:
  - '!steps.a.result.value.available'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'aiter-ops.is-enabled' && e.output.enabled == false)
- id: oracle5-attention-aiter-prefill-is-available-enabled
  name: tests/v1/attention/test_mla_prefill_selector.py:556 test_is_available_delegates_to_rocm_aiter_ops (is_enabled True)
  description: AiterFlashAttnPrefillBackend.is_available returns rocm_aiter_ops.is_enabled(). The test patches is_enabled; the scenario sets AITER's enabled flag on a ROCm MI300 (gfx942) with aiter installed
    instead.
  fixtures: *id001
  config:
    vllm-target-device: rocm
  state:
    aiter-ops:
      aiter_found: true
      gcn_arch: gfx942
      flags:
        _AITER_ENABLED: true
  steps:
  - interface: mla-prefill-backend.is-available
    caller: gpu-worker
    input:
      backend: ROCM_AITER_FA
    as: a
  expect:
  - steps.a.result.value.available
  - trace.exists(e, e.type == 'call.end' && e.interface == 'aiter-ops.is-enabled' && e.output.enabled == true)
