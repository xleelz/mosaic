- id: oracle-r5-kernels-ops-silu-and-mul-quant
  name: _C.silu_and_mul_quant and the reference (SiluAndMul then static scaled_fp8_quant) agree on FP8 dtype and [T, H/2] shape
  description: tests/kernels/test_fused_quant_activation.py::test_silu_and_mul (line 54), five (num_tokens, hidden_size) cases with bf16 and fp16 inputs and a 1-element scale. The reference quantizes silu_and_mul's
    [T, H/2] output with ops.scaled_fp8_quant(x, scale) (static, vllm/_custom_ops.py:1823-1891); the op checks FP8 out, FP16/BF16 in and an even last dim (csrc/quantization/activation_kernels.cu:584-596).
    torch.allclose of the values is numeric and untranslatable.
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: torch-bindings.silu-and-mul-quant
    caller: gpu-worker
    as: op0
    input:
      num_tokens: 1
      hidden_size: 16
      dtype_bytes: 2
      input_dtype: bfloat16
  - interface: custom-ops.scaled-fp8-quant
    caller: gpu-worker
    as: ref0
    input:
      num_tokens: 1
      hidden_size: 8
      dtype_bytes: 2
      ndim: 2
      has_scale: true
      scale_shape:
      - 1
  - interface: torch-bindings.silu-and-mul-quant
    caller: gpu-worker
    as: op1
    input:
      num_tokens: 17
      hidden_size: 48
      dtype_bytes: 2
      input_dtype: bfloat16
  - interface: custom-ops.scaled-fp8-quant
    caller: gpu-worker
    as: ref1
    input:
      num_tokens: 17
      hidden_size: 24
      dtype_bytes: 2
      ndim: 2
      has_scale: true
      scale_shape:
      - 1
  - interface: torch-bindings.silu-and-mul-quant
    caller: gpu-worker
    as: op2
    input:
      num_tokens: 86
      hidden_size: 1562
      dtype_bytes: 2
      input_dtype: float16
  - interface: custom-ops.scaled-fp8-quant
    caller: gpu-worker
    as: ref2
    input:
      num_tokens: 86
      hidden_size: 781
      dtype_bytes: 2
      ndim: 2
      has_scale: true
      scale_shape:
      - 1
  - interface: torch-bindings.silu-and-mul-quant
    caller: gpu-worker
    as: op3
    input:
      num_tokens: 1234
      hidden_size: 128
      dtype_bytes: 2
      input_dtype: bfloat16
  - interface: custom-ops.scaled-fp8-quant
    caller: gpu-worker
    as: ref3
    input:
      num_tokens: 1234
      hidden_size: 64
      dtype_bytes: 2
      ndim: 2
      has_scale: true
      scale_shape:
      - 1
  - interface: torch-bindings.silu-and-mul-quant
    caller: gpu-worker
    as: op4
    input:
      num_tokens: 3045
      hidden_size: 4096
      dtype_bytes: 2
      input_dtype: float16
  - interface: custom-ops.scaled-fp8-quant
    caller: gpu-worker
    as: ref4
    input:
      num_tokens: 3045
      hidden_size: 2048
      dtype_bytes: 2
      ndim: 2
      has_scale: true
      scale_shape:
      - 1
  expect:
  - steps.op0.result.ok && steps.ref0.result.ok && steps.op0.result.value.out_dtype == 'float8_e4m3fn' && steps.ref0.result.value.out_dtype == 'float8_e4m3fn'
  - steps.op0.result.value.out_shape == [steps.ref0.result.value.rows, steps.ref0.result.value.cols] && steps.op0.result.value.out_shape == [1, 8]
  - steps.op1.result.ok && steps.ref1.result.ok && steps.op1.result.value.out_dtype == 'float8_e4m3fn' && steps.ref1.result.value.out_dtype == 'float8_e4m3fn'
  - steps.op1.result.value.out_shape == [steps.ref1.result.value.rows, steps.ref1.result.value.cols] && steps.op1.result.value.out_shape == [17, 24]
  - steps.op2.result.ok && steps.ref2.result.ok && steps.op2.result.value.out_dtype == 'float8_e4m3fn' && steps.ref2.result.value.out_dtype == 'float8_e4m3fn'
  - steps.op2.result.value.out_shape == [steps.ref2.result.value.rows, steps.ref2.result.value.cols] && steps.op2.result.value.out_shape == [86, 781]
  - steps.op3.result.ok && steps.ref3.result.ok && steps.op3.result.value.out_dtype == 'float8_e4m3fn' && steps.ref3.result.value.out_dtype == 'float8_e4m3fn'
  - steps.op3.result.value.out_shape == [steps.ref3.result.value.rows, steps.ref3.result.value.cols] && steps.op3.result.value.out_shape == [1234, 64]
  - steps.op4.result.ok && steps.ref4.result.ok && steps.op4.result.value.out_dtype == 'float8_e4m3fn' && steps.ref4.result.value.out_dtype == 'float8_e4m3fn'
  - steps.op4.result.value.out_shape == [steps.ref4.result.value.rows, steps.ref4.result.value.cols] && steps.op4.result.value.out_shape == [3045, 2048]
