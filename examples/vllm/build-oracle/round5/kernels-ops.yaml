# Round-5 in-build oracle for kernels-ops (build-oracle/round5/kernels-ops.json). See kernels-ops.md.
schema_version: 1
id: vllm
scenarios:
- id: oracle-r5-kernels-ops-aiter-gate-cuda
  name: On CUDA the AITER gate is closed even with the aiter package installed
  description: 'tests/kernels/attention/test_rocm_aiter_fa.py::test_aiter_mha_platform_gate_matches_install_and_arch (line 373): is_aiter_found_and_supported() is (is_rocm() and on_mi3xx() and IS_AITER_FOUND).
    The model''s aiter-ops.is-aiter-found-and-supported checks ROCm, IS_AITER_FOUND, then get_cdna_version() > 2 (vllm/_aiter_ops.py:202-222).'
  fixtures:
  - full-tp1-llama-8b
  state:
    aiter-ops:
      aiter_found: true
      gcn_arch: ''
  steps:
  - interface: aiter-ops.is-aiter-found-and-supported
    caller: gpu-worker
    as: g
  expect:
  - steps.g.result.ok && steps.g.result.value.supported == false
