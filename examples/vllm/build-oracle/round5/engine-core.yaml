# Round-5 build-oracle scenarios for engine-core. Generated by examples/vllm/gen/engine-core/round5.py.
schema_version: 1
id: vllm
scenarios:
- id: oracle5-engine-core-remote-prefill-cached-tokens-remote
  name: tests/v1/engine/test_output_processor.py:217 test_remote_prefill_cached_tokens_override[True]
  fixtures: &id001
  - full-tp1-llama-8b
  description: 'P/D disaggregation: with do_remote_prefill the RequestOutput reports the P worker''s hits (5) from kv_transfer_params; otherwise PrefillStats.num_cached_tokens = local + external = 7 (output_processor.py:238-249,
    731-742).'
  steps:
  - interface: output-processor.add-request
    caller: engine-core
    as: add
    input:
      request:
        request_id: request-0-int
        external_req_id: request-0
        prompt_token_ids: &id002
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
        arrival_time: 0
        sampling_params:
          detokenize: false
          extra_args:
            kv_transfer_params:
              do_remote_prefill: true
              remote_prefill_cached_tokens: 5
      has_queue: false
  - interface: output-processor.process-outputs
    caller: engine-core
    as: proc
    input:
      outputs:
      - request_id: request-0-int
        new_token_ids:
        - 42
        prefill_stats:
          num_prompt_tokens: 8
          num_local_cached_tokens: 0
          num_external_cached_tokens: 7
  expect:
  - steps.proc.result.ok && size(steps.proc.result.value.request_outputs) == 1
  - steps.proc.result.value.request_outputs[0].num_cached_tokens == 5
