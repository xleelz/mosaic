- id: oracle5-engine-core-watermark-status-partitions-finished
  name: tests/v1/engine/test_output_processor.py:1175 test_watermark_status_partitions_finished_requests
  fixtures: *id001
  config:
    watermark-enabled: true
  description: 'Seven requests finish (wm, skip, sticky, off, a pooling request, and two n=2 children): watermarked 4 (wm, sticky and both children), skipped 1, not watermarked 2, which sums to the request_success
    total (stats.py:636-641, loggers.py:1248-1258).'
  steps:
  - interface: output-processor.add-request
    caller: engine-core
    as: a_wm
    input:
      request:
        request_id: wm
        external_req_id: wm-ext
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        arrival_time: 0
        sampling_params:
          n: 1
          watermarking: true
          _watermarking_skipped: false
      has_queue: false
  - interface: output-processor.add-request
    caller: engine-core
    as: a_skip
    input:
      request:
        request_id: skip
        external_req_id: skip-ext
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        arrival_time: 0
        sampling_params:
          n: 1
          watermarking: false
          _watermarking_skipped: true
      has_queue: false
  - interface: output-processor.add-request
    caller: engine-core
    as: a_sticky
    input:
      request:
        request_id: sticky
        external_req_id: sticky-ext
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        arrival_time: 0
        sampling_params:
          n: 1
          watermarking: true
          _watermarking_skipped: true
      has_queue: false
  - interface: output-processor.add-request
    caller: engine-core
    as: a_off
    input:
      request:
        request_id: 'off'
        external_req_id: off-ext
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        arrival_time: 0
        sampling_params:
          n: 1
          watermarking: false
          _watermarking_skipped: false
      has_queue: false
  - interface: output-processor.add-request
    caller: engine-core
    as: a_pool
    input:
      request:
        request_id: pool
        external_req_id: pool-ext
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        arrival_time: 0
        sampling_params: null
        pooling_params:
          task: embed
      has_queue: false
  - interface: output-processor.add-request
    caller: engine-core
    as: a_child0
    input:
      request:
        request_id: 0_parent
        external_req_id: parent-ext
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        arrival_time: 0
        sampling_params:
          n: 1
          watermarking: true
          _watermarking_skipped: false
      parent_request_id: parent
      index: 0
      n: 2
      has_queue: false
  - interface: output-processor.add-request
    caller: engine-core
    as: a_child1
    input:
      request:
        request_id: 1_parent
        external_req_id: parent-ext
        prompt_token_ids:
        - 128000
        - 9906
        - 1917
        arrival_time: 0
        sampling_params:
          n: 1
          watermarking: true
          _watermarking_skipped: false
      parent_request_id: parent
      index: 1
      n: 2
      has_queue: false
  - interface: output-processor.process-outputs
    caller: engine-core
    as: proc
    input:
      outputs:
      - request_id: wm
        new_token_ids:
        - 128000
        finish_reason: abort
      - request_id: skip
        new_token_ids:
        - 128000
        finish_reason: stop
      - request_id: sticky
        new_token_ids:
        - 128000
        finish_reason: stop
      - request_id: 'off'
        new_token_ids:
        - 128000
        finish_reason: error
      - request_id: pool
        new_token_ids: []
        finish_reason: stop
      - request_id: 0_parent
        new_token_ids:
        - 128000
        finish_reason: length
      - request_id: 1_parent
        new_token_ids:
        - 128000
        finish_reason: length
  - interface: stat-logger-manager.record
    caller: engine-core
    as: rec
    input:
      scheduler_stats: null
      iteration_stats: = steps.proc.result.value.iteration_stats
  expect:
  - steps.proc.result.ok && steps.rec.result.ok
  - steps.proc.result.value.iteration_stats.num_watermarked_reqs == 4 && steps.proc.result.value.iteration_stats.num_watermark_skipped_reqs == 1 && steps.proc.result.value.iteration_stats.num_not_watermarked_reqs
    == 2
  - state['prometheus-registry'].metrics['vllm:watermark_requests{model_name="llama-8b",engine="0",status="watermarked"}'] == 4 && state['prometheus-registry'].metrics['vllm:watermark_requests{model_name="llama-8b",engine="0",status="skipped"}']
    == 1 && state['prometheus-registry'].metrics['vllm:watermark_requests{model_name="llama-8b",engine="0",status="not_watermarked"}'] == 2
  - sum(state['prometheus-registry'].metrics.filter(k, k.startsWith('vllm:request_success{')).map(k, state['prometheus-registry'].metrics[k])) == 7
- id: oracle5-engine-core-cloud-storage-tokenizer-skips-get-model-path
  name: tests/engine/test_arg_utils.py:851 test_cloud_storage_tokenizer_skips_get_model_path
  fixtures: *id001
  description: EngineArgs(model=s3://..., tokenizer=s3://...) under HF_HUB_OFFLINE keeps both cloud URIs (arg_utils.py:908-925). EngineArgs is config-platform's; its post-init does not model the HF_HUB_OFFLINE
    rewrite, so this passes without exercising it (build-oracle/round5/engine-core.md).
  steps:
  - interface: engine-args.post-init
    caller: python-user
    as: args
    input:
      model: s3://bucket/model
      tokenizer: s3://bucket/tokenizer
  expect:
  - steps.args.result.ok && steps.args.result.value.model == 's3://bucket/model' && steps.args.result.value.tokenizer == 's3://bucket/tokenizer'
- id: oracle5-engine-core-admission-tokens-rejects-when-zero-limit
  name: tests/v1/engine/test_admission_control.py:355 test_admission_tokens_rejects_when_zero_limit
  fixtures: *id001
  config:
    max-num-queued-tokens: 0
    disable-log-stats: true
  description: 'max_num_queued_tokens=0 with nothing queued: 0 >= 0, so MaxQueuedTokensError. The bare AsyncLLM has no logger manager (disable-log-stats here), so nothing is recorded (async_llm.py:362-379).'
  steps:
  - interface: async-llm.check-admission
    caller: api-server
    as: adm
    input:
      n: 1
  expect:
  - '!steps.adm.result.ok && steps.adm.result.error.code == ''max-queued-tokens-error'''
  - steps.adm.result.error.message == 'The engine has reached its prefill token backlog limit. Please try again later or on a different instance.'
  - calls['stat-logger-manager.record-admission-rejection'] == 0
- id: oracle5-engine-core-dplb-finished-requests-release-inflight
  name: tests/v1/engine/test_engine_core_client.py:394 test_dplb_finished_requests_release_inflight
  fixtures: *id001
  config:
    data-parallel-size: 2
  description: 'Two engines: the request goes to an engine with in-flight 1; a finished_requests notice for it releases the slot (core_client.py:1642-1697, 1703-1710).'
  steps:
  - interface: dp-lb-async-mp-client.get-core-engine-for-request
    caller: api-server
    as: pick
    input:
      request_id: req-1
      prompt_token_ids:
      - 1
      - 2
      - 3
      sampling_params:
        max_tokens: 1
  - interface: dp-lb-async-mp-client.process-engine-outputs
    caller: api-server
    as: out
    input:
      outputs:
        finished_requests:
        - req-1
  expect:
  - steps.pick.result.value.engine == 'dp0'
  - steps.out.result.value.released == 1
  - state['dp-lb-async-mp-client'].engine_inflight.dp0 == 0 && !('req-1' in state['dp-lb-async-mp-client'].reqs_in_flight)
- id: oracle5-engine-core-async-llm-startup-error-tp1-load-weights
  name: tests/v1/shutdown/test_startup_error.py:48 test_async_llm_startup_error[tp1-load-weights]
  fixtures: *id001
  faults:
  - target: gpu-worker-impl.load-model
    type: error
    code: exception
    message: Simulated Error in startup!
    instance: rank0
  config: {}
  max_events: 200000
  description: 'The model raises during load_weights (or the profiling forward inside determine_available_memory) on one rank: the engine process dies during startup and AsyncLLM.from_engine_args raises
    "Engine core initialization failed. ... Failed core proc(s): {''EngineCore'': 1}" (utils.py:1431-1440).'
  steps:
  - interface: async-llm.from-engine-args
    caller: api-server
    as: e
  expect:
  - '!steps.e.result.ok && steps.e.result.error.message.matches(''initialization fail(ed|ure)'')'
  - 'steps.e.result.error.message == "Engine core initialization failed. See root cause above. Failed core proc(s): {''EngineCore'': 1}"'
  - '!trace.exists(e, e.type == ''call.start'' && e.interface == ''scheduler.add-request'')'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.load-model' && has(e.error) && e.error.message == 'Simulated Error in startup!')
