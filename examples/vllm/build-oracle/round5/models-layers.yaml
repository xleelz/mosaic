# Round-5 in-build oracle for models-layers (build-oracle/round5/models-layers.json).
schema_version: 1
id: vllm
scenarios:
- id: oracle-r5-models-layers-native-cls-modules-to-save
  fixtures:
  - tp1-llama-8b
  config:
    max-lora-rank: 8
  state:
    lru-cache-lora-model-manager:
      classification_head:
        module: score
        max_lora_cls_labels: 1
        input_size: 1024
    local-disk:
      files:
        /adapters/native/adapter_config.json:
          json:
            r: 8
            lora_alpha: 16
            bias: none
            modules_to_save:
            - score
        /adapters/native/adapter_model.safetensors:
          size: 1048576
          json:
            lora_modules: {}
            modules_to_save:
              score:
                weight_shape:
                - 1
                - 1024
                bias_shape: null
        /adapters/wide/adapter_config.json:
          json:
            r: 8
            lora_alpha: 16
            bias: none
            modules_to_save:
            - score
        /adapters/wide/adapter_model.safetensors:
          size: 1048576
          json:
            lora_modules: {}
            modules_to_save:
              score:
                weight_shape:
                - 2
                - 1024
        /adapters/other/adapter_config.json:
          json:
            r: 8
            lora_alpha: 16
            bias: none
            modules_to_save:
            - classifier
        /adapters/other/adapter_model.safetensors:
          size: 1048576
          json:
            lora_modules: {}
            modules_to_save:
              classifier:
                weight_shape:
                - 1
                - 1024
  steps:
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    as: native
    input:
      lora_name: native
      lora_int_id: 1
      lora_path: /adapters/native
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    as: wide
    input:
      lora_name: wide
      lora_int_id: 2
      lora_path: /adapters/wide
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    as: other
    input:
      lora_name: other
      lora_int_id: 3
      lora_path: /adapters/other
  expect:
  - steps.native.result.ok && steps.native.result.value.loaded
  - '!steps.wide.result.ok && steps.wide.result.error.message == "Full module ''score'' for ''score'' has an incompatible weight shape: expected (1..1, 1024), received (2, 1024)."'
  - '!steps.other.result.ok && steps.other.result.error.message == "Full module ''classifier'' does not match the model''s classification head ''score''."'
  description: 'tests/lora/test_sequence_classification.py:70 test_native_classification_model_with_modules_to_save (partial: the adapter''s modules_to_save check against the native classification head;
    the classify logits are untranslatable)'
- id: oracle-r5-models-layers-cohere-asr-streaming-estimate
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: cohere-asr-for-conditional-generation.get-num-audio-tokens
    caller: gpu-worker
    as: d1
    input:
      audio_duration_s: 1.0
      preprocessor:
        window_stride: 0.01
        sample_rate: 16000
      encoder:
        subsampling_factor: 8
  - interface: cohere-asr-for-conditional-generation.get-num-audio-tokens
    caller: gpu-worker
    as: d10
    input:
      audio_duration_s: 10.0
      preprocessor:
        window_stride: 0.01
        sample_rate: 16000
      encoder:
        subsampling_factor: 8
  - interface: cohere-asr-for-conditional-generation.get-num-audio-tokens
    caller: gpu-worker
    as: d30
    input:
      audio_duration_s: 30.0
      preprocessor:
        window_stride: 0.01
        sample_rate: 16000
      encoder:
        subsampling_factor: 8
  expect:
  - steps.d1.result.value.num_tokens == 13 && steps.d10.result.value.num_tokens == 125 && steps.d30.result.value.num_tokens == 375
  description: 'tests/models/multimodal/test_cohere_asr.py:74 test_get_num_audio_tokens_streaming_estimate: 1 s -> 13, 10 s -> 125, 30 s -> 375 tokens (cohere_asr.py:2189-2203)'
- id: oracle-r5-models-layers-fused-regex-patterns
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: quant-config-utils.find-matching-patterns
    caller: gpu-worker
    as: direct
    input:
      layer_name: model.layers.0.self_attn.qkv_proj
      patterns:
      - re:.*qkv_proj.*
      fused_mapping:
        qkv_proj:
        - q_proj
        - k_proj
        - v_proj
  - interface: quant-config-utils.find-matching-patterns
    caller: gpu-worker
    as: shards
    input:
      layer_name: model.layers.0.self_attn.qkv_proj
      patterns:
      - re:.*\.[qkv]_proj$
      fused_mapping:
        qkv_proj:
        - q_proj
        - k_proj
        - v_proj
  - interface: quant-config-utils.find-matching-patterns
    caller: gpu-worker
    as: each
    input:
      layer_name: model.layers.0.self_attn.qkv_proj
      patterns:
      - re:.*\.q_proj$
      - re:.*\.k_proj$
      - re:.*\.v_proj$
      fused_mapping:
        qkv_proj:
        - q_proj
        - k_proj
        - v_proj
  - interface: quant-config-utils.find-matching-patterns
    caller: gpu-worker
    as: none
    input:
      layer_name: model.layers.0.self_attn.qkv_proj
      patterns:
      - model.layers.1.mlp
      fused_mapping:
        qkv_proj:
        - q_proj
        - k_proj
        - v_proj
  - interface: quant-config-utils.find-matching-patterns
    caller: gpu-worker
    as: fn
    input:
      layer_name: model.layers.0.mlp.experts
      patterns:
      - '*mlp.experts*'
      use_fnmatch: true
  - interface: quant-config-utils.find-matching-patterns
    caller: gpu-worker
    as: nofn
    input:
      layer_name: model.layers.0.mlp.experts
      patterns:
      - '*mlp.experts*'
  expect:
  - steps.direct.result.value.matches == [['re:.*qkv_proj.*']]
  - size(steps.shards.result.value.matches) == 3 && steps.shards.result.value.matches.all(m, size(m) == 1)
  - steps.each.result.value.matches == [['re:.*\\.q_proj$'], ['re:.*\\.k_proj$'], ['re:.*\\.v_proj$']]
  - steps.none.result.value.matches == [[], [], []]
  - steps.fn.result.value.matches == [['*mlp.experts*']] && steps.nofn.result.value.matches == [[]]
  description: 'tests/quantization/test_config_utils.py:83 test_find_matching_patterns_for_fused_regexes: a direct fused regex and per-shard regexes each give one match per set (config_utils.py:344-380)'
- id: oracle-r5-models-layers-online-overlay-normalized
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: weight-utils.get-quant-config
    caller: gpu-worker
    as: raw
    input:
      quantization: compressed-tensors
      hf_quant_config:
        quant_method: compressed-tensors
        format: pack-quantized
        config_groups: {}
      online_args:
        linear: mxfp8
      online_args_type: dict
  - interface: weight-utils.get-quant-config
    caller: gpu-worker
    as: args
    input:
      quantization: compressed-tensors
      hf_quant_config:
        quant_method: compressed-tensors
        format: pack-quantized
        config_groups: {}
      online_args:
        moe:
          activation: mxfp8
  expect:
  - '!steps.raw.result.ok && steps.raw.result.error.code == ''assertion-error'''
  - steps.args.result.ok && steps.args.result.value.config_cls == 'CompressedTensorsConfig' && steps.args.result.value.online_composed
  description: 'tests/quantization/test_online.py:570 test_online_overlay_requires_normalized_quantization_config: a raw dict quantization_config over a compressed-tensors checkpoint is an AssertionError
    in maybe_compose_online_quantization (weight_utils.py:214-224)'
