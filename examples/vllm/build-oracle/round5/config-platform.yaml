# Round-5 unit tests of the config-platform area (build-oracle/round5/config-platform.json), translated by hand
# (config-platform has no generator). Run with the merged model:
#   check ... -f examples/vllm/build-oracle/round5/config-platform.yaml --scenario '^r5-config-platform'
schema_version: 1
id: vllm

scenarios:
  - id: r5-config-platform-1-is-chunked-prefill-supported
    name: "tests/test_config.py:2964 test_is_chunked_prefill_supported (generate, pooling, encoder-decoder, hybrid, attention-free rows)"
    description: >-
      ModelConfig(model_id).attn_type, then is_chunked_prefill_supported and its debug reason. The registry facts
      ModelConfig reads (attention type, default pooling type, is_causal) are seeded as hf-hub rows, and the pooling
      runner the registry would pick for embedding checkpoints is given as runner=pooling.
    fixtures: [full-tp1-llama-8b]
    state:
      hf-hub:
        models:
          Qwen/Qwen3-0.6B: {architectures: [Qwen3ForCausalLM], num_attention_heads: 16, num_key_value_heads: 8, max_position_embeddings: 40960}
          openai/whisper-small: {architectures: [WhisperForConditionalGeneration], num_attention_heads: 12, num_key_value_heads: 12, max_position_embeddings: 448, attn_type: encoder_decoder}
          intfloat/e5-small: {architectures: [BertModel], num_attention_heads: 12, num_key_value_heads: 12, max_position_embeddings: 512, seq_pooling_type: CLS}
          openai/clip-vit-base-patch32: {architectures: [CLIPModel], num_attention_heads: 8, num_key_value_heads: 8, max_position_embeddings: 77, seq_pooling_type: LAST}
          state-spaces/mamba-130m-hf: {architectures: [MambaForCausalLM], num_attention_heads: 1, num_key_value_heads: 1, max_position_embeddings: 2048, attn_type: attention_free}
          Qwen/Qwen3-Next-80B-A3B-Instruct: {architectures: [Qwen3NextForCausalLM], num_attention_heads: 16, num_key_value_heads: 2, max_position_embeddings: 262144, attn_type: hybrid}
    steps:
      - {interface: model-config.post-init, caller: operator, as: qwen, input: {model: Qwen/Qwen3-0.6B}}
      - {interface: model-config.is-chunked-prefill-supported, caller: operator, as: qwen_cp, input: {attn_type: "= steps.qwen.result.value.attn_type", has_pooler: "= steps.qwen.result.value.has_pooler"}}
      - {interface: model-config.post-init, caller: operator, as: whisper, input: {model: openai/whisper-small}}
      - {interface: model-config.is-chunked-prefill-supported, caller: operator, as: whisper_cp, input: {attn_type: "= steps.whisper.result.value.attn_type", has_pooler: "= steps.whisper.result.value.has_pooler"}}
      - {interface: model-config.post-init, caller: operator, as: e5, input: {model: intfloat/e5-small, runner: pooling}}
      - {interface: model-config.is-chunked-prefill-supported, caller: operator, as: e5_cp, input: {attn_type: "= steps.e5.result.value.attn_type", has_pooler: "= steps.e5.result.value.has_pooler", seq_pooling_type: "= steps.e5.result.value.seq_pooling_type"}}
      - {interface: model-config.post-init, caller: operator, as: clip, input: {model: openai/clip-vit-base-patch32, runner: pooling}}
      - {interface: model-config.is-chunked-prefill-supported, caller: operator, as: clip_cp, input: {attn_type: "= steps.clip.result.value.attn_type", has_pooler: "= steps.clip.result.value.has_pooler", seq_pooling_type: "= steps.clip.result.value.seq_pooling_type"}}
      - {interface: model-config.post-init, caller: operator, as: mamba, input: {model: state-spaces/mamba-130m-hf}}
      - {interface: model-config.is-chunked-prefill-supported, caller: operator, as: mamba_cp, input: {attn_type: "= steps.mamba.result.value.attn_type", has_pooler: "= steps.mamba.result.value.has_pooler"}}
      - {interface: model-config.post-init, caller: operator, as: next, input: {model: Qwen/Qwen3-Next-80B-A3B-Instruct}}
      - {interface: model-config.is-chunked-prefill-supported, caller: operator, as: next_cp, input: {attn_type: "= steps.next.result.value.attn_type", has_pooler: "= steps.next.result.value.has_pooler"}}
    expect:
      - "steps.qwen.result.value.attn_type == 'decoder' && steps.qwen_cp.result.value.supported && steps.qwen_cp.result.value.reason == 'Generative models support chunked prefill.'"
      - "steps.whisper.result.value.attn_type == 'encoder_decoder' && !steps.whisper_cp.result.value.supported && steps.whisper_cp.result.value.reason == 'Encoder decoder models do not support chunked prefill.'"
      - "steps.e5.result.value.attn_type == 'encoder_only' && !steps.e5_cp.result.value.supported && steps.e5_cp.result.value.reason == 'Pooling models with bidirectional attn do not support chunked prefill.'"
      - "steps.clip.result.value.attn_type == 'decoder' && steps.clip_cp.result.value.supported && steps.clip_cp.result.value.reason.contains('Pooling models with causal attn and LAST/ALL pooling support chunked prefill.')"
      - "steps.mamba.result.value.attn_type == 'attention_free' && steps.mamba_cp.result.value.supported && steps.mamba_cp.result.value.reason == 'Generative models support chunked prefill.'"
      - "steps.next.result.value.attn_type == 'hybrid' && steps.next_cp.result.value.supported"
  - id: r5-config-platform-2-vllm-config-defaults
    name: "tests/test_config.py:3202 test_vllm_config_defaults (a model, CompilationConfig(), O0..O3; and custom_ops ['+quant_fp8'] at O2)"
    description: >-
      The OPTIMIZATION_LEVEL_TO_CONFIG defaults on a CUDA H100 at TP 1: cudagraph_mode, use_inductor_graph_partition and the
      pass_config flags the model resolves. fuse_norm_quant and fuse_rope_kvcache_cat_mla depend on the kernel config's IR-op
      priorities and the splitting ops, which the model doesn't resolve (see the .md).
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: config-create-engine-config, as: o0, input: {optimization_level: 0}}
      - {flow: config-create-engine-config, as: o1, input: {optimization_level: 1}}
      - {flow: config-create-engine-config, as: o2, input: {optimization_level: 2}}
      - {flow: config-create-engine-config, as: o3, input: {optimization_level: 3}}
      - {flow: config-create-engine-config, as: o2fp8, input: {optimization_level: 2, custom_ops: ["+quant_fp8"]}}
    expect:
      - "steps.o0.result.ok && steps.o0.result.value.compilation_config.cudagraph_mode == 'NONE' && !steps.o0.result.value.compilation_config.use_inductor_graph_partition"
      - "steps.o0.result.value.compilation_config.pass_config.all(k, steps.o0.result.value.compilation_config.pass_config[k] == false)"
      - "steps.o1.result.value.compilation_config.cudagraph_mode == 'PIECEWISE' && !steps.o1.result.value.compilation_config.pass_config.fuse_allreduce_rms && !steps.o1.result.value.compilation_config.pass_config.fuse_attn_quant"
      - "steps.o2.result.value.compilation_config.cudagraph_mode == 'FULL_AND_PIECEWISE' && steps.o3.result.value.compilation_config.cudagraph_mode == 'FULL_AND_PIECEWISE'"
      - "[steps.o1, steps.o2, steps.o3].all(s, !s.result.value.compilation_config.pass_config.fuse_act_quant && !s.result.value.compilation_config.pass_config.fuse_allreduce_rms && !s.result.value.compilation_config.pass_config.enable_qk_norm_rope_fusion && !s.result.value.compilation_config.pass_config.fuse_rope_kvcache && !s.result.value.compilation_config.pass_config.fuse_qk_norm_rope_kvcache && !s.result.value.compilation_config.pass_config.fuse_act_padding && !s.result.value.compilation_config.pass_config.fuse_mla_dual_rms_norm)"
      - "steps.o2fp8.result.value.compilation_config.pass_config.fuse_act_quant"
  - id: r5-config-platform-4-dual-key-gumbel-alpha-warning
    name: "tests/test_config.py:3653 test_dual_key_gumbel_warns_that_configured_alpha_is_unused"
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: vllm-config.check-supports-watermarking
        caller: operator
        as: chk
        input:
          watermark_config: {algorithm: dual_key_gumbel, key: 42, alpha: 0.25}
          speculative_config: {method: mtp, draft_sample_method: probabilistic, rejection_sample_method: standard, parallel_drafting: false}
    expect:
      - "steps.chk.result.ok"
      - "ctx.watermark_warning.contains('The configured alpha=0.25 is not used')"
  - id: r5-config-platform-5-mm-hasher-algorithm-invalid
    name: "tests/config/test_multimodal_config.py:50 test_mm_hasher_algorithm_invalid"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: multimodal-config.init, caller: operator, as: mm, input: {mm_hasher_algorithm: md5}}
    expect:
      - "!steps.mm.result.ok && steps.mm.result.error.code == 'value-error' && steps.mm.result.error.message.contains('mm_hasher_algorithm')"
  - id: r5-config-platform-6-auto-mm-device-needs-transport
    name: "tests/config/test_multimodal_config.py:591 test_auto_mm_processor_device_needs_a_device_capable_transport"
    description: "_resolve_mm_processor_device(ec_role='ec_producer', mm_tensor_ipc='direct_rpc'): an encode-only instance on CUDA, but direct_rpc serializes host bytes, so the processor stays on CPU (device type None)."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: vllm-config.resolve-mm-processor-device
        caller: operator
        as: mm
        input:
          multimodal_config: {mm_processor_kwargs: {}, mm_tensor_ipc: direct_rpc}
          ec_transfer_config: {ec_connector: ECExampleConnector, ec_role: ec_producer}
          device_type: cuda
      - {interface: multimodal-config.get-mm-processor-device-type, caller: operator, as: dt, input: {mm_processor_kwargs: "= steps.mm.result.value.mm_processor_kwargs"}}
    expect:
      - "steps.mm.result.ok && steps.dt.result.ok && steps.dt.result.value.device_type == null"
