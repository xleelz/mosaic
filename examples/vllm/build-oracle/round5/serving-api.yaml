# Round-5 in-build oracle for serving-api: the 6 tests in build-oracle/round5/serving-api.json.
schema_version: 1
id: vllm
scenarios:
  - id: oracle-r5-serving-api-holo2-reasoning
    name: "tests/reasoning/test_holo2_reasoning_parser.py:170 test_reasoning: holo2 (DeepSeekV3ReasoningWithThinkingParser) defaults to thinking; thinking=False is the identity parser"
    description: "The five non-streaming parametrizations. The streaming ones give the same (reasoning, content) through run_reasoning_extraction; the model has no per-token stream for this parser, so they are not separate cases."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: deepseek-v3-reasoning-parser.extract-reasoning, caller: api-server, as: with_think, input: {model_output: "This is a reasoning section</think>This is the rest", chat_template_kwargs: null, default_thinking: true}}
      - {interface: deepseek-v3-reasoning-parser.extract-reasoning, caller: api-server, as: with_think_enabled, input: {model_output: "This is a reasoning section</think>This is the rest", chat_template_kwargs: {thinking: true}, default_thinking: true}}
      - {interface: deepseek-v3-reasoning-parser.extract-reasoning, caller: api-server, as: disabled, input: {model_output: "This is the rest", chat_template_kwargs: {thinking: false}, default_thinking: true}}
      - {interface: deepseek-v3-reasoning-parser.extract-reasoning, caller: api-server, as: disabled_close, input: {model_output: "</think>This is the rest", chat_template_kwargs: {thinking: false}, default_thinking: true}}
      - {interface: deepseek-v3-reasoning-parser.extract-reasoning, caller: api-server, as: complete, input: {model_output: "This is a reasoning section</think>", chat_template_kwargs: null, default_thinking: true}}
    expect:
      - "steps.with_think.result.value.reasoning == 'This is a reasoning section' && steps.with_think.result.value.content == 'This is the rest'"
      - "steps.with_think_enabled.result.value.reasoning == 'This is a reasoning section' && steps.with_think_enabled.result.value.content == 'This is the rest'"
      - "steps.disabled.result.value.reasoning == null && steps.disabled.result.value.content == 'This is the rest'"
      - "steps.disabled_close.result.value.reasoning == null && steps.disabled_close.result.value.content == '</think>This is the rest'"
      - "steps.complete.result.value.reasoning == 'This is a reasoning section' && steps.complete.result.value.content == null"
  - id: oracle-r5-serving-api-cohere-response-format-cleared
    name: "tests/parser/cohere/test_structural_tags.py:237 test_response_format_cleared: json_schema (wire alias schema) and json_object response formats fold into the structural tag and are cleared"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: cohere-command-parser.adjust-request, caller: api-server, as: js, input: {model_architecture: Cohere2ForCausalLM, body: {model: m, messages: [{role: user, content: hi}], response_format: {type: json_schema, json_schema: {name: n, schema: {type: object, properties: {a: {type: string}}}}}}}}
      - {interface: cohere-command-parser.adjust-request, caller: api-server, as: jo, input: {model_architecture: Cohere2ForCausalLM, body: {model: m, messages: [{role: user, content: hi}], response_format: {type: json_object}}}}
    expect:
      - "steps.js.result.value.response_format == null && steps.jo.result.value.response_format == null"
      - "steps.js.result.value.structural_tag_obj.format.tags.filter(t, t.content.type == 'json_schema')[0].content.json_schema == {'type': 'object', 'properties': {'a': {'type': 'string'}}}"
      - "steps.jo.result.value.structural_tag_obj.format.tags.filter(t, t.content.type == 'json_schema')[0].content.json_schema == {'type': 'object'}"
      - "steps.js.result.value.structured_outputs.structural_tag == string(steps.js.result.value.structural_tag_obj)"
  - id: oracle-r5-serving-api-transcription-oversized-data-url
    name: "tests/entrypoints/launchers/test_run_batch.py:978 test_transcription_wrapper_rejects_oversized_data_url_before_decode"
    description: "The test sets VLLM_MAX_AUDIO_CLIP_FILESIZE_MB=1 and sends 4*((1 MiB + 2)//3) base64 characters. Scaled down by 2^16 so the data URL stays small: a 16-byte limit and 24 characters (18 decoded bytes) keep the same over-the-limit relation."
    fixtures: [full-tp1-llama-8b]
    config: {vllm-max-audio-clip-filesize-mb: 0.0000152587890625}
    steps:
      - {interface: run-batch.transcription-wrapper, caller: api-server, as: r, input: {is_translation: false, body: {model: openai/whisper-large-v3, file_url: "data:audio/wav;base64,AAAAAAAAAAAAAAAAAAAAAAAA", response_format: json}}}
    expect:
      - "steps.r.result.ok && steps.r.result.value.handled == false && steps.r.result.value.error.code == 400 && steps.r.result.value.error.message.contains('Maximum file size exceeded')"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'run-batch.download-bytes-from-url').all(e, e.error != null && e.error.code == 'vllm-validation-error')"
  - id: oracle-r5-serving-api-derender-tool-call-id-pinned
    name: "tests/entrypoints/scale_out/derender/test_derender_stream.py:1263 test_tool_call_id_pinned_across_chunks"
    description: "The test's _FakeParser opens a tool call with a fresh call-<uuid> id on every TOOL_START, including on the replay. The scenario passes the parser's delta per chunk (two different ids) and the state the first chunk returned."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: online-derenderer.apply-chat-stream-delta, caller: api-server, as: c1, input: {token_ids: [9], tool_choice: auto, delta_message: {tool_calls: [{index: 0, id: call-aaa, type: function, function: {name: get_weather, arguments: ""}}]}}}
      - {interface: online-derenderer.apply-chat-stream-delta, caller: api-server, as: c2, input: {token_ids: [9], finish_reason: stop, tool_choice: auto, state: "= steps.c1.result.value.state", delta_message: {tool_calls: [{index: 0, id: call-bbb, type: function, function: {name: get_weather, arguments: ""}}]}}}
    expect:
      - "steps.c1.result.value.choice.delta.tool_calls[0].id == 'call-aaa' && steps.c1.result.value.state.last_tool_call_ids == ['call-aaa']"
      - "steps.c2.result.value.choice.delta.tool_calls[0].id == 'call-aaa' && steps.c2.result.value.state.last_tool_call_ids == ['call-aaa']"
      - "steps.c2.result.value.choice.finish_reason == 'tool_calls' && steps.c2.result.value.state.output_chunk_lens == [1, 1]"
  - id: oracle-r5-serving-api-qwen3-streaming-multi-param
    name: "tests/parser/engine/test_qwen3.py:298 test_streaming_multi_param: the streamed name is get_weather and the concatenated arguments parse to {city: Tokyo, unit: celsius}"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: qwen3-parser.stream-tool-call, caller: api-server, as: s, input: {chunks: ["<tool_call>\n", "<function=get_weather>\n", "<parameter=city>Tokyo</parameter>\n", "<parameter=unit>celsius</parameter>\n", "</function>\n", "</tool_call>"]}}
    expect:
      - "steps.s.result.value.deltas.filter(d, 'tool_calls' in d && 'name' in d.tool_calls[0].function).map(d, d.tool_calls[0].function.name).join('') == 'get_weather'"
      - "steps.s.result.value.deltas.filter(d, 'tool_calls' in d && 'arguments' in d.tool_calls[0].function).map(d, d.tool_calls[0].function.arguments).join('') == '{\"city\": \"Tokyo\", \"unit\": \"celsius\"}'"
      - "size(steps.s.result.value.deltas.filter(d, 'tool_calls' in d && 'arguments' in d.tool_calls[0].function)) >= 2"
  - id: oracle-r5-serving-api-harmony-tool-call-split
    name: "tests/parser/test_harmony.py:581 test_tool_call_split_across_deltas (commentary and analysis tool channels)"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: harmony-parser.parse-delta, caller: api-server, as: c1, input: {parser_id: commentary, text: "<|channel|>analysis<|message|>Thinking<|end|><|start|>assistant to=functions.get_weather<|channel|>commentary<|constrain|>json<|message|>{\"location\": "}}
      - {interface: harmony-parser.parse-delta, caller: api-server, as: c2, input: {parser_id: commentary, text: "\"Paris\"}<|call|>"}}
      - {interface: harmony-parser.parse-delta, caller: api-server, as: a1, input: {parser_id: analysis, text: "<|channel|>analysis<|message|>Thinking<|end|><|start|>assistant to=functions.get_weather<|channel|>analysis<|constrain|>json<|message|>{\"location\": "}}
      - {interface: harmony-parser.parse-delta, caller: api-server, as: a2, input: {parser_id: analysis, text: "\"Paris\"}<|call|>"}}
    expect:
      - "[steps.c1, steps.a1].all(s, s.result.value.delta.reasoning == 'Thinking' && s.result.value.delta.content == null && s.result.value.delta.tool_calls.map(t, [string(t.index), t.function.name, t.function.arguments]) == [['0', 'get_weather', '{\"location\": ']])"
      - "[steps.c2, steps.a2].all(s, s.result.value.delta.reasoning == null && s.result.value.delta.content == null && size(s.result.value.delta.tool_calls) == 1 && s.result.value.delta.tool_calls[0].index == 0 && s.result.value.delta.tool_calls[0].function.name == null && s.result.value.delta.tool_calls[0].function.arguments == '\"Paris\"}')"
