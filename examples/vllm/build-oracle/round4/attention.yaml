- id: oracle4-attention-index-group-prefill-fallback
  name: tests/v1/attention/test_sparse_mla_backends.py:1977 test_sparse_mla_index_group_falls_back_for_prefill_sized_batch
  description: 'A builder over 4 logical rows with max_decode_rows=2 has a 3-row workspace. The leader and the follower land in one group, and a 4-row batch is too large for the shared workspace, so each
    layer converts its own indices: two convert calls, equal results.'
  fixtures: *id001
  steps:
  - interface: sparse-mla-index-group-builder.init
    caller: gpu-worker
    input:
      logical_rows: 4
      max_decode_rows: 2
    as: init
  - interface: sparse-mla-index-group-builder.register-layer
    caller: gpu-worker
    input:
      is_index_producing_layer: true
    as: leader
  - interface: sparse-mla-index-group-builder.register-layer
    caller: gpu-worker
    input:
      is_index_producing_layer: false
    as: follower
  - interface: sparse-mla-index-group-builder.convert-logical-to-physical-topk
    caller: gpu-worker
    input:
      group: g0
      layer_index: 0
      num_tokens: 4
    as: lc
  - interface: sparse-mla-index-group-builder.convert-logical-to-physical-topk
    caller: gpu-worker
    input:
      group: g0
      layer_index: 1
      num_tokens: 4
    as: fc
  expect:
  - steps.follower.result.value.group == steps.leader.result.value.group
  - steps.lc.result.value.converted && steps.fc.result.value.converted
  - steps.lc.result.value.path == 'per-layer' && steps.fc.result.value.path == 'per-layer'
  - state['sparse-mla-index-group-builder@rank0'].groups.g0.workspace_rows == 3
- id: oracle4-attention-mla-prefill-string-parses
  name: tests/v1/attention/test_mla_prefill_selector.py:600 test_valid_string_parses_to_enum
  description: AttentionConfig's mla_prefill_backend validator (config-platform's) parses a string with MLAPrefillBackendEnum[value.upper()]; FLASH_ATTN resolves to the FLASH_ATTN member, and an unknown
    name is a ValueError (the sibling test).
  fixtures: *id001
  steps:
  - interface: mla-prefill-backend-enum.getitem
    caller: gpu-worker
    input:
      name: FLASH_ATTN
    as: fa
  - interface: mla-prefill-backend-enum.getitem
    caller: gpu-worker
    input:
      name: NONEXISTENT
    as: bad
  expect:
  - steps.fa.result.value.name == 'FLASH_ATTN' && steps.fa.result.value.value == 'vllm.v1.attention.backends.mla.prefill.flash_attn.FlashAttnPrefillBackend'
  - '!steps.bad.result.ok && steps.bad.result.error.message.startsWith(''Unknown MLA prefill backend'')'
