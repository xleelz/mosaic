# Round-4 build-oracle scenarios for attention. Generated by examples/vllm/gen/attention/build.py.
schema_version: 1
id: vllm
scenarios:
- id: oracle4-attention-per-sequence-context-lens-unchanged
  name: tests/v1/attention/test_rocm_paged_mqa_context_lens.py:30 test_per_sequence_input_is_unchanged
  description: 'context_lens shaped (4,) and (4, 1) are already one length per sequence: _per_sequence_context_lens returns the same tensor object.'
  fixtures: &id001
  - full-tp1-llama-8b
  steps:
  - interface: rocm-aiter-mla-sparse-ops.per-sequence-context-lens
    caller: gpu-worker
    input:
      shape:
      - 4
      rows:
      - - 1
      - - 2
      - - 3
      - - 4
    as: flat
  - interface: rocm-aiter-mla-sparse-ops.per-sequence-context-lens
    caller: gpu-worker
    input:
      shape:
      - 4
      - 1
      rows:
      - - 1
      - - 2
      - - 3
      - - 4
    as: col
  expect:
  - steps.flat.result.value.same_tensor && steps.flat.result.value.shape == [4]
  - steps.col.result.value.same_tensor && steps.col.result.value.shape == [4, 1]
- id: oracle4-attention-register-mla-prefill-string-direct
  name: tests/v1/attention/test_mla_prefill_registry.py:197 test_register_mla_prefill_backend_with_string_name_direct
  description: register_mla_prefill_backend('STRING_DIRECT', <CustomMLAPrefillBackend path>) creates the member and its override; the member is overridden and get_class().get_name() is CUSTOM; clear_override
    removes the override. The test module's class is importable, so the scenario adds it to the registry's importable classes.
  fixtures: *id001
  state:
    mla-prefill-backend-enum:
      classes:
        tests.v1.attention.test_mla_prefill_registry.CustomMLAPrefillBackend:
          name: CUSTOM
  steps:
  - interface: mla-prefill-backend-enum.register-mla-prefill-backend
    caller: gpu-worker
    input:
      backend: STRING_DIRECT
      is_new: true
      has_class_path: true
      class_path: tests.v1.attention.test_mla_prefill_registry.CustomMLAPrefillBackend
    as: reg
  - interface: mla-prefill-backend-enum.getitem
    caller: gpu-worker
    input:
      name: STRING_DIRECT
    as: member
  - interface: mla-prefill-backend-enum.is-overridden
    caller: gpu-worker
    input:
      name: STRING_DIRECT
    as: ov
  - interface: mla-prefill-backend-enum.get-class
    caller: gpu-worker
    input:
      name: STRING_DIRECT
    as: cls
  - interface: mla-prefill-backend-enum.is-overridden
    caller: gpu-worker
    input:
      name: STRING_DIRECT
      clear: true
    as: clr
  - interface: mla-prefill-backend-enum.is-overridden
    caller: gpu-worker
    input:
      name: STRING_DIRECT
    as: after
  expect:
  - steps.reg.result.ok && steps.member.result.value.name == 'STRING_DIRECT'
  - steps.ov.result.value.overridden
  - steps.cls.result.value.class_name == 'CUSTOM'
  - '!steps.after.result.value.overridden'
  - '!(''STRING_DIRECT'' in state[''mla-prefill-backend-enum@rank0''].overrides)'
