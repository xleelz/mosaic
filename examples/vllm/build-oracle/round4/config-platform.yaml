# Round-4 unit tests of the config-platform area (build-oracle/round4/config-platform.json), translated by hand
# (config-platform has no generator). Run with the merged model:
#   check ... -f examples/vllm/build-oracle/round4/config-platform.yaml --scenario '^r4-config-platform'
schema_version: 1
id: vllm

scenarios:
  - id: r4-config-platform-1-eagle-draft-inherits-target-max-model-len
    name: "tests/config/test_speculative_draft_max_position_embeddings.py:80 test_eagle_draft_inherits_target_max_model_len (eagle, eagle3)"
    description: "SpeculativeConfig(target=ModelConfig(unsloth Llama-3.1-8B), model=EAGLE3 draft with max_position_embeddings 2048, method eagle/eagle3): the draft's max_position_embeddings is raised to the target's max_model_len, with the INFO log."
    fixtures: [full-tp1-llama-8b]
    state:
      hf-hub:
        models:
          unsloth/Meta-Llama-3.1-8B-Instruct: {architectures: [LlamaForCausalLM], model_type: llama, num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072, rope_type: llama3, rope_factor: 8.0}
          yuhuili/EAGLE3-LLaMA3.1-Instruct-8B: {architectures: [Eagle3LlamaForCausalLM], model_type: llama, num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 2048}
    steps:
      - interface: engine-args.create-engine-config
        caller: operator
        as: eagle
        input: {model: unsloth/Meta-Llama-3.1-8B-Instruct, speculative_config: {model: yuhuili/EAGLE3-LLaMA3.1-Instruct-8B, method: eagle, num_speculative_tokens: 3}}
      - interface: engine-args.create-engine-config
        caller: operator
        as: eagle3
        input: {model: unsloth/Meta-Llama-3.1-8B-Instruct, speculative_config: {model: yuhuili/EAGLE3-LLaMA3.1-Instruct-8B, method: eagle3, num_speculative_tokens: 3}}
    expect:
      - "steps.eagle.result.ok && steps.eagle.result.value.model_config.max_model_len > 2048"
      - "steps.eagle.result.value.speculative_config.draft_max_position_embeddings == steps.eagle.result.value.model_config.max_model_len"
      - "steps.eagle3.result.value.speculative_config.draft_max_position_embeddings == steps.eagle3.result.value.model_config.max_model_len"
      - "ctx.spec_override_log.contains('Overriding draft model max_position_embeddings')"
  - id: r4-config-platform-2-dual-key-gumbel-rejects-ngram
    name: "tests/test_config.py:3740 test_dual_key_gumbel_rejects_non_autoregressive_speculation"
    description: "A dual_key_gumbel watermark with probabilistic, standard-rejection ngram speculation: _check_supports_watermarking raises ValueError 'autoregressive model-based'."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: vllm-config.check-supports-watermarking
        caller: operator
        as: chk
        input:
          watermark_config: {key: 42, algorithm: dual_key_gumbel}
          speculative_config: {method: ngram, draft_sample_method: probabilistic, rejection_sample_method: standard, parallel_drafting: false}
    expect:
      - "!steps.chk.result.ok && steps.chk.result.error.code == 'value-error' && steps.chk.result.error.message.contains('autoregressive model-based')"
  - id: r4-config-platform-3-mm-encoder-attn-backend-hash-updates
    name: "tests/config/test_multimodal_config.py:55 test_mm_encoder_attn_backend_hash_updates"
    description: "MultiModalConfig().compute_hash() differs from MultiModalConfig(mm_encoder_attn_backend=FLASH_ATTN).compute_hash()."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: multimodal-config.init, caller: operator, as: base_cfg, input: {}}
      - {interface: multimodal-config.compute-hash, caller: operator, as: base, input: "= steps.base_cfg.result.value"}
      - {interface: multimodal-config.init, caller: operator, as: fa_cfg, input: {mm_encoder_attn_backend: FLASH_ATTN}}
      - {interface: multimodal-config.compute-hash, caller: operator, as: fa, input: "= steps.fa_cfg.result.value"}
    expect:
      - "steps.base.result.ok && steps.fa.result.ok"
      - "steps.base.result.value.hash != steps.fa.result.value.hash"
  - id: r4-config-platform-4-dflash-allows-async-scheduling
    name: "tests/test_config.py:1899 test_dflash_allows_async_scheduling"
    description: "A tiny Llama target with a DFlash2 draft, the uni executor and max_model_len 2048: the speculative method stays dflash and async scheduling resolves to True."
    fixtures: [full-tp1-llama-8b]
    state:
      hf-hub:
        models:
          /tmp/target: {architectures: [LlamaForCausalLM], model_type: llama, hidden_size: 128, num_hidden_layers: 2, num_attention_heads: 4, num_key_value_heads: 2, vocab_size: 256, max_position_embeddings: 2048}
          /tmp/draft: {architectures: [DFlash2DraftModel], model_type: qwen3, hidden_size: 128, num_hidden_layers: 1, num_attention_heads: 4, num_key_value_heads: 2, vocab_size: 256, max_position_embeddings: 2048, dflash_config: {block_size: 4, mask_token_id: 255, target_layer_ids: [0]}}
    steps:
      - interface: engine-args.create-engine-config
        caller: operator
        as: cfg
        input: {model: /tmp/target, max_model_len: 2048, distributed_executor_backend: uni, speculative_config: {method: dflash, model: /tmp/draft, num_speculative_tokens: 3}}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.speculative_config.method == 'dflash'"
      - "steps.cfg.result.value.scheduler_config.async_scheduling == true"
  - id: r4-config-platform-5-hisparse-rejects-disabled-full-isl
    name: "tests/test_config.py:531 test_hisparse_rejects_disabled_full_isl_reservation"
    description: "On CUDA, a HiSparse attention config with scheduler_reserve_full_isl=False raises 'requires --scheduler-reserve-full-isl'."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: engine-args.create-engine-config
        caller: operator
        as: cfg
        input: {model: meta-llama/Llama-3.1-8B-Instruct, max_model_len: 2048, hisparse_config: {}, scheduler_reserve_full_isl: false}
    expect:
      - "!steps.cfg.result.ok && steps.cfg.result.error.code == 'value-error' && steps.cfg.result.error.message.contains('requires --scheduler-reserve-full-isl')"
  - id: r4-config-platform-6-env-list-empty-string-returns-default
    name: "tests/test_envs.py:336 TestEnvListWithChoices.test_empty_string_returns_default"
    description: "TEST_ENV='' : env_list_with_choices('TEST_ENV', ['default'], ['option1', 'option2'])() == ['default']."
    fixtures: [full-tp1-llama-8b]
    state:
      envs: {environ: {TEST_ENV: ""}}
    steps:
      - {interface: envs.env-list-with-choices, caller: operator, as: v, input: {env_name: TEST_ENV, default: [default], choices: [option1, option2]}}
    expect:
      - "steps.v.result.ok && steps.v.result.value.value == ['default']"
