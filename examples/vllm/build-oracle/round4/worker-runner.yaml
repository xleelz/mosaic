# Round-4 in-build oracle for worker-runner: the tests in build-oracle/round4/worker-runner.json.
# Run merged: check -f skeleton -f fixtures -f worlds -f <fragments> -f this file --scenario '^oracle-build-worker-runner-r4'
schema_version: 1
id: vllm
scenarios:
  - id: oracle-build-worker-runner-r4-1
    name: "test_run_model_unpacks_tuple_return_for_mtp: an MTP drafter's (logits_hidden, feedback_hidden) return is unpacked"
    description: "tests/v1/worker/test_gpu_target_dependent_ar_speculator.py:365. TargetDependentARSpeculator._run_model with cudagraph mode NONE (speculator.py:367-430). The monkeypatched draft model, which returns a tuple, becomes the speculator's loaded-drafter state."
    fixtures: [full-tp1-llama-8b]
    state: {target-dependent-ar-speculator: {draft_model: {returns_tuple: true}}}
    steps:
      - {interface: target-dependent-ar-speculator.run-model, caller: target-dependent-ar-speculator, input: {num_tokens: 4, cudagraph_runtime_mode: NONE}, as: tup}
    expect:
      - "steps.tup.result.value.logits_hidden.part == 0 && steps.tup.result.value.feedback_hidden.part == 1 && steps.tup.result.value.logits_hidden != steps.tup.result.value.feedback_hidden"
  - id: oracle-build-worker-runner-r4-1b
    name: "test_run_model_reuses_tensor_return_for_mtp (sibling): a single returned tensor serves as both"
    description: "tests/v1/worker/test_gpu_target_dependent_ar_speculator.py:384 (speculator.py:427-430)."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: target-dependent-ar-speculator.run-model, caller: target-dependent-ar-speculator, input: {num_tokens: 4, cudagraph_runtime_mode: NONE}, as: one}
    expect:
      - "steps.one.result.value.logits_hidden == steps.one.result.value.feedback_hidden"

  - id: oracle-build-worker-runner-r4-2
    name: "test_capture_query_length_covers_replay_batches: a mixed FULL graph is captured with max_query_len = num_tokens unless bounded; PIECEWISE leaves it unset"
    description: "tests/v1/cudagraph/test_cudagraph_manager.py:181, all four parameter rows: (full False, None) -> None, (True, None) -> 8, (True, 1) -> 1, (True, 3) -> 3; the 8-token dummy batch of 8 requests schedules one token each (cudagraph_utils.py:798-858, input_batch.py:127-172)."
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: cuda-graph-manager.prepare-inputs-to-capture, caller: gpu-model-runner, input: {num_reqs: 8, num_tokens: 8, full_cudagraph: false}, as: pw}
      - {interface: cuda-graph-manager.prepare-inputs-to-capture, caller: gpu-model-runner, input: {num_reqs: 8, num_tokens: 8, full_cudagraph: true}, as: full}
      - {interface: cuda-graph-manager.prepare-inputs-to-capture, caller: gpu-model-runner, input: {num_reqs: 8, num_tokens: 8, full_cudagraph: true, max_query_len: 1}, as: q1}
      - {interface: cuda-graph-manager.prepare-inputs-to-capture, caller: gpu-model-runner, input: {num_reqs: 8, num_tokens: 8, full_cudagraph: true, max_query_len: 3}, as: q3}
    expect:
      - "[steps.pw, steps.full, steps.q1, steps.q3].all(s, s.result.value.num_scheduled_tokens.all(n, n == 1))"
      - "steps.pw.result.value.max_query_len == null && steps.full.result.value.max_query_len == 8 && steps.q1.result.value.max_query_len == 1 && steps.q3.result.value.max_query_len == 3"
      - "!steps.pw.result.value.for_capture && steps.full.result.value.for_capture"

  - id: oracle-build-worker-runner-r4-3
    name: "test_attention_checks_preserve_global_and_target_scoped_support: the drafter's weaker CUDA graph support binds the runner, target-scoped checks skip it unless it shares a target layer"
    description: "tests/v1/worker/test_attn_utils.py:135. A target group (ALWAYS, tolerates CPU/device query-length mismatch) and a draft group (UNIFORM_BATCH, does not) in one KV cache group (attn_utils.py:313-359). The fake metadata builders' answers become each group's cg_support and supports_query_lens_mismatch."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: attn-utils.get-attn-cg-support
        caller: gpu-model-runner
        input:
          attn_groups: [[{backend: _TargetBackend, layer_names: [target], cg_support: ALWAYS}, {backend: _DraftBackend, layer_names: [draft], cg_support: UNIFORM_BATCH}]]
        as: all
      - interface: attn-utils.get-attn-cg-support
        caller: gpu-model-runner
        input:
          attn_groups: [[{backend: _TargetBackend, layer_names: [target], cg_support: ALWAYS}, {backend: _DraftBackend, layer_names: [draft], cg_support: UNIFORM_BATCH}]]
          checked_layer_names: [target]
        as: target
      - interface: attn-utils.get-query-lens-mismatch-unsupported-backend
        caller: gpu-model-runner
        input:
          attn_groups: [[{backend: _TargetBackend, layer_names: [target], supports_query_lens_mismatch: true}, {backend: _DraftBackend, layer_names: [draft], supports_query_lens_mismatch: false}]]
          checked_layer_names: [target]
        as: mm
      - interface: attn-utils.get-attn-cg-support
        caller: gpu-model-runner
        input:
          attn_groups: [[{backend: _TargetBackend, layer_names: [target], cg_support: ALWAYS}, {backend: _DraftBackend, layer_names: [draft, target], cg_support: UNIFORM_BATCH}]]
          checked_layer_names: [target]
        as: shared
      - interface: attn-utils.get-query-lens-mismatch-unsupported-backend
        caller: gpu-model-runner
        input:
          attn_groups: [[{backend: _TargetBackend, layer_names: [target], supports_query_lens_mismatch: true}, {backend: _DraftBackend, layer_names: [draft, target], supports_query_lens_mismatch: false}]]
          checked_layer_names: [target]
        as: mm_shared
    expect:
      - "steps.all.result.value.min_cg_support == 'UNIFORM_BATCH' && steps.all.result.value.min_cg_attn_backend == '_DraftBackend'"
      - "steps.target.result.value.min_cg_support == 'ALWAYS' && steps.target.result.value.min_cg_attn_backend == null && steps.mm.result.value.backend == null"
      - "steps.shared.result.value.min_cg_support == 'UNIFORM_BATCH' && steps.mm_shared.result.value.backend == '_DraftBackend'"

  - id: oracle-build-worker-runner-r4-4
    name: "test_mrv2_kv_pool_only_wraps_backing_allocation (hisparse False): only the backing allocation runs inside the KV pool context; binding runs outside"
    description: "tests/v1/worker/test_kv_cache_allocation_scope.py:32, parameter hisparse=False. attn_utils.init_kv_cache (attn_utils.py:396-443) with the CuMem kv_cache pool as the allocation context: the allocation carries the pool tag, the bind step does not."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: attn-utils.init-kv-cache
        caller: gpu-model-runner
        input: {num_blocks: 16, page_size_bytes: 65536, num_layers: 2, allocation_pool: kv_cache}
        as: kv
    expect:
      - "steps.kv.result.value.allocated_in_pool == 'kv_cache' && steps.kv.result.value.bound_in_pool == null && !steps.kv.result.value.hisparse"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-memory.allocate' && e.input.pool == 'kv_cache')"
  - id: oracle-build-worker-runner-r4-4b
    name: "test_mrv2_kv_pool_only_wraps_backing_allocation (hisparse True): the HiSparse caches are allocated and bound to the host pool inside the context"
    description: "tests/v1/worker/test_kv_cache_allocation_scope.py:32, parameter hisparse=True (attn_utils.py:409-418). The HiSparse binding itself is scheduler-kv's vllm/v1/hisparse/binding.py; the model shows its allocation inside the pool."
    fixtures: [full-tp1-llama-8b]
    config: {hisparse-enabled: true}
    steps:
      - interface: attn-utils.init-kv-cache
        caller: gpu-model-runner
        input: {num_blocks: 16, page_size_bytes: 65536, num_layers: 2, allocation_pool: kv_cache}
        as: kv
    expect:
      - "steps.kv.result.value.hisparse && steps.kv.result.value.allocated_in_pool == 'kv_cache' && steps.kv.result.value.bound_in_pool == null"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-memory.allocate' && e.input.pool == 'kv_cache')"

  - id: oracle-build-worker-runner-r4-5
    name: "test_prune_configs_no_rejected_fallback: when no config fits the shared-memory budget, the single smallest-footprint config is returned"
    description: "tests/v1/worker/test_late_interaction_runner.py:297. A 10,000-byte budget (the monkeypatched _smem_budget becomes the device's max_shared_mem), Lq 1024, d_pad 1024: every estimate exceeds it, so the fallback is BLOCK_Q 16 x BLOCK_D 16 (66,560 bytes), the smallest (_common.py:52-85)."
    fixtures: [full-tp1-llama-8b]
    state: {flash-maxsim: {max_shared_mem: 10000}}
    steps:
      - {interface: flash-maxsim.prune-configs, caller: late-interaction-runner, input: {Lq: 1024, d_pad: 1024}, as: none}
    expect:
      - "steps.none.result.value.configs == [{'BLOCK_Q': 16, 'BLOCK_D': 16}]"
  - id: oracle-build-worker-runner-r4-5b
    name: "test_prune_configs_uses_padded_dim (sibling): at the A100's budget the survivors fit at the padded dimension"
    description: "tests/v1/worker/test_late_interaction_runner.py:288: d=513 pads to 1024; every survivor's estimate at d_pad 1024 is within 166,912 bytes."
    fixtures: [full-tp1-llama-8b]
    state: {flash-maxsim: {max_shared_mem: 166912}}
    steps:
      - {interface: flash-maxsim.prune-configs, caller: late-interaction-runner, input: {Lq: 1024, d: 513, d_pad: 1024}, as: a100}
    expect:
      - "size(steps.a100.result.value.configs) > 0 && steps.a100.result.value.configs.all(c, (c.BLOCK_Q * 1024 + c.BLOCK_D * 1024) * 2 + c.BLOCK_Q * c.BLOCK_D * 4 <= 166912)"

  - id: oracle-build-worker-runner-r4-6
    name: "test_decode_sharding_allows_ranks_with_no_owned_request: with sharded decodes on PCP 4, one decode request goes to rank 0 and ranks 1-3 own nothing"
    description: "tests/v1/worker/test_gpu_pcp_manager.py:363. PCPManager(pcp_world_size=4, shard_decode_requests=True, dcp_world_size=1); _get_rank_segments per rank with one 1-token decode (pcp_manager.py:235-306)."
    fixtures: [full-tp1-llama-8b]
    config: {prefill-context-parallel-size: 4, decode-context-parallel-size: 1, pcp-shard-decode-requests: true}
    steps:
      - {interface: pcp-manager.get-rank-segments, caller: gpu-model-runner, input: {rank: 0, num_scheduled_tokens: [1], is_prefilling: [false], req_ids: [request-a]}, as: r0}
      - {interface: pcp-manager.get-rank-segments, caller: gpu-model-runner, input: {rank: 1, num_scheduled_tokens: [1], is_prefilling: [false], req_ids: [request-a]}, as: r1}
      - {interface: pcp-manager.get-rank-segments, caller: gpu-model-runner, input: {rank: 2, num_scheduled_tokens: [1], is_prefilling: [false], req_ids: [request-a]}, as: r2}
      - {interface: pcp-manager.get-rank-segments, caller: gpu-model-runner, input: {rank: 3, num_scheduled_tokens: [1], is_prefilling: [false], req_ids: [request-a]}, as: r3}
    expect:
      - "steps.r0.result.value.req_ids == ['request-a']"
      - "steps.r1.result.value.req_ids == [] && steps.r2.result.value.req_ids == [] && steps.r3.result.value.req_ids == []"
