# Round-4 unit tests of the distributed area (build-oracle/round4/distributed.json), translated.
# Run with the merged model: check ... -f examples/vllm/build-oracle/round4/distributed.yaml --scenario '^r4-distributed'
schema_version: 1
id: vllm

scenarios:
  - id: r4-distributed-1-push-unknown-notif
    name: "tests/v1/kv_connector/unit/test_nixl_push_connector.py:1345 test_get_new_notifs_unknown_request_is_logged_and_skipped"
    description: "A completion notif 'never-heard-of-you:1' for a request the push worker tracks on neither side is logged and skipped: nothing is notified, nothing is registered as received, and it counts as a notification after expiry."
    flow: distributed-nixl-push-notifs
    fixtures: [full-tp1-llama-8b]
    state:
      nixl-push-connector-worker: {completion_notifs: ["never-heard-of-you:1"]}
    steps:
      - {flow: distributed-nixl-push-notifs, as: n}
    expect:
      - "steps.n.result.ok && steps.n.result.value.notified == []"
      - "!('never-heard-of-you' in state['nixl-push-connector-worker@rank0'].recving_transfers)"
      - "state['nixl-push-connector-worker@rank0'].xfer_stats.num_notifications_after_expiry == [1]"

  - id: r4-distributed-2-speculative-compat-hash
    name: "tests/v1/kv_connector/unit/test_nixl_connector.py:4136 test_speculative_config_compatibility_hash (all 9 parametrizations)"
    description: "Local: eagle3, drafter test/eagle3-drafter, 1 speculative token, aux layers (2, 16, 29). The remote matches unless an override changes a hashed factor; num_speculative_tokens and attention_backend are not hashed."
    flow: distributed-nixl-compat-hash
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: distributed-nixl-compat-hash, as: local, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: same, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: ntok, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, num_speculative_tokens: 2, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: mtp, input: {speculative_config: {method: mtp, model: test/eagle3-drafter, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: drafter, input: {speculative_config: {method: eagle3, model: test/different-drafter, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: rev, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, revision: different-revision, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: par, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, parallel_drafting: true, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: fp8, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, kv_cache_dtype: fp8, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: backend, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, attention_backend: FLASHINFER, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 29]}}}
      - {flow: distributed-nixl-compat-hash, as: aux, input: {speculative_config: {method: eagle3, model: test/eagle3-drafter, num_speculative_tokens: 1, auxiliary_layer_ids: [2, 16, 30]}}}
    expect:
      - "[steps.same, steps.ntok, steps.backend].all(s, s.result.value.compat_hash == steps.local.result.value.compat_hash)"
      - "[steps.mtp, steps.drafter, steps.rev, steps.par, steps.fp8, steps.aux].all(s, s.result.value.compat_hash != steps.local.result.value.compat_hash)"

  - id: r4-distributed-3-mooncake-packed-coalesce
    name: "tests/v1/kv_connector/unit/test_mooncake_connector.py:2401 test_packed_matching_layers_coalesce_to_one_copy"
    description: "Identical packed layer sets [0, 1] with page 1024: the coalesced region's kv_block_len equals its block_len (2 x page = 2048), so the contiguous blocks 10, 11 -> 20, 21 go as one copy: src p_base + 10 x 2048, dst d_base + 20 x 2048, length 2 x 2048, no errors."
    flow: distributed-mooncake-build-transfer-params
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: distributed-mooncake-build-transfer-params
        as: c
        input:
          ready_reqs: [{d_req_id: d-slices, local_block_ids: [[10, 11]]}]
          req_blocks: {d-slices: [[20, 21]]}
          local_region: {base_addr: 1048576, block_len: 2048, kv_block_len: 2048}
          remote_region: {base_addr: 8388608, block_len: 2048, kv_block_len: 2048}
    expect:
      - "steps.c.result.value.err_reqs == [] && steps.c.result.value.err_msg == null"
      - "steps.c.result.value.src == [1048576 + 10 * 2048] && steps.c.result.value.dst == [8388608 + 20 * 2048] && steps.c.result.value.lengths == [2 * 2048]"
