- id: oracle4-engine-core-logprobs-drops-trailing-sentinel-columns
  name: tests/v1/engine/test_logprobs_processor.py:31 test_drops_trailing_sentinel_columns
  fixtures: *id001
  description: -inf sentinels are written as -1e308 (JSON has no infinity).
  steps:
  - interface: logprobs-processor.update-sample-logprobs
    caller: api-server
    as: u
    input:
      request_id: r
      num_logprobs: 3
      logprobs_lists:
        token_ids:
        - - 42
          - 100
          - 200
          - 300
          - 0
          - 0
        logprobs:
        - - -0.5
          - -1.0
          - -2.0
          - -3.0
          - -1.0e+308
          - -1.0e+308
        ranks:
        - 1
  expect:
  - size(steps.u.result.value.logprobs) == 1
  - steps.u.result.value.logprobs[0].map(e, e.token_id) == [42, 100, 200, 300] && !steps.u.result.value.logprobs[0].exists(e, e.token_id == 0)
  - steps.u.result.value.logprobs[0].all(e, e.logprob > -1.0e300)
  - steps.u.result.value.cumulative_logprob == -0.5
