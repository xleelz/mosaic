schema_version: 1
id: vllm
scenarios:
- id: oracle4-engine-core-execute-worker-rpc-returns-worker-exception
  name: tests/v1/executor/test_multiproc_executor.py:53 test_execute_worker_rpc_returns_worker_exception
  fixtures: &id001
  - full-tp1-llama-8b
  faults:
  - target: gpu-worker-impl.execute-dummy-batch
    type: error
    code: runtime-error
    message: test error
    instance: rank0
  description: 'Rank 0 with output_rank None: the worker method raises RuntimeError("test error"); _execute_worker_rpc hands the exception itself to handle_output, which sends (FAILURE, str(e)) = "test
    error".'
  steps:
  - interface: worker-proc.execute-worker-rpc
    caller: engine-core
    as: rpc
    input:
      rank: rank0
      method: execute_dummy_batch
      args: {}
      output_rank: ''
  expect:
  - '!steps.rpc.result.ok && steps.rpc.result.error.code == ''runtime-error'''
  - steps.rpc.result.error.message == 'test error' && steps.rpc.result.error.data.status == 'FAILURE'
  - trace.filter(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.execute-dummy-batch' && e.instance == 'rank0').size() == 1
- id: oracle4-engine-core-attention-metrics-minority-swa-pp
  name: tests/v1/metrics/test_perf_metrics.py:1684 test_attention_metrics_minority_swa_survives_pipeline_parallelism
  fixtures: *id001
  description: 'Qwen3Config(hidden 2048, 16 heads, 6 layers, head_dim 128 by default), one sliding layer of window 512, PP 2: per GPU 2.5 full and 0.5 sliding layers.'
  steps:
  - interface: attention-metrics.from-vllm-config
    caller: engine-core
    as: m
    input:
      hidden_size: 2048
      num_attention_heads: 16
      num_key_value_heads: 16
      num_hidden_layers: 6
      head_dim: 128
      sliding_window: 512
      layer_types:
      - sliding_attention
      - full_attention
      - full_attention
      - full_attention
      - full_attention
      - full_attention
      pipeline_parallel_size: 2
  - interface: attention-metrics.get-num-flops-breakdown
    caller: engine-core
    as: f
    input:
      metrics: = steps.m.result.value
      requests:
      - - 1
        - 4096
        - false
      per_gpu: true
  expect:
  - steps.m.result.value.num_swa_layers == 1
  - steps.f.result.value.attn_qk == int(2.0 * 16.0 * 128.0 * (2.5 * 4096.0 + 0.5 * 512.0)) && steps.f.result.value.attn_av == steps.f.result.value.attn_qk
  - steps.f.result.value.attn_qk < 2 * 16 * 128 * 3 * 4096
- id: oracle4-engine-core-abort-final-output-delta
  name: tests/v1/engine/test_async_llm.py:941 test_abort_final_output[DELTA]
  fixtures: *id001
  max_events: 400000
  description: 'A long request is aborted by its external id while generating: the stream ends with a final output (finished, one completion, finish_reason abort, stop_reason None, num_cached_tokens set).
    DELTA streamed tokens before it; FINAL_ONLY gets only the final output, which carries every token so far.'
  steps:
  - flow: engine-core-busy-loop
    as: loop
    await: false
    input:
      iterations: 60
  - flow: async-llm-generate
    as: gen
    await: false
    at_ms: 0
    input:
      request_id: test-abort-final-output
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      priority: 0
      sampling_params:
        max_tokens: 3000
        n: 1
        ignore_eos: true
        output_kind: delta
        temperature: 0.5
        seed: 42
        stop: []
  - flow: async-llm-abort
    as: ab
    at_ms: 300
    input:
      request_ids:
      - test-abort-final-output
      internal: false
  expect:
  - steps.gen.result.ok
  - steps.gen.result.value.items[size(steps.gen.result.value.items) - 1].finished
  - size(steps.gen.result.value.items[size(steps.gen.result.value.items) - 1].completions) == 1
  - steps.gen.result.value.items[size(steps.gen.result.value.items) - 1].completions[0].finish_reason == 'abort'
  - steps.gen.result.value.items[size(steps.gen.result.value.items) - 1].stop_reason == null
  - steps.gen.result.value.items[size(steps.gen.result.value.items) - 1].num_cached_tokens >= 0
  - state['output-processor'].request_states == {}
  - sum(steps.gen.result.value.items.slice(0, size(steps.gen.result.value.items) - 1).map(o, size(o.completions[0].token_ids))) > 0
