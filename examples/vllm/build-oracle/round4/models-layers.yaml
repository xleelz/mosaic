# Round-4 in-build oracle for models-layers (build-oracle/round4/models-layers.json).
schema_version: 1
id: vllm
scenarios:
  - id: oracle-r4-models-layers-package-hash-includes-submodules
    name: "test_registry.py::test_lazy_modelinfo_package_hash_includes_submodules"
    description: >-
      tests/models/test_registry.py:184. A package model (__init__.py re-exporting model.py) is hashed with every .py in
      the package, so rewriting model.py changes the _ModelInfo cache hash (registry.py:975-991).
    fixtures: [tp1-llama-8b]
    state:
      local-disk:
        files:
          /tmp/model_package/__init__.py: {path: /tmp/model_package/__init__.py, content: "from .model import Model\n"}
          /tmp/model_package/model.py: {path: /tmp/model_package/model.py, content: "class Model: pass\n"}
    steps:
      - interface: lazy-registered-model.get-modelinfo-module-hash
        caller: gpu-worker
        as: first
        input: {model_path: /tmp/model_package/__init__.py}
      - set:
          local-disk:
            files:
              /tmp/model_package/__init__.py: {path: /tmp/model_package/__init__.py, content: "from .model import Model\n"}
              /tmp/model_package/model.py: {path: /tmp/model_package/model.py, content: "class Model:\n    supports_pp = True\n"}
      - interface: lazy-registered-model.get-modelinfo-module-hash
        caller: gpu-worker
        as: second
        input: {model_path: /tmp/model_package/__init__.py}
    expect:
      - "steps.first.result.ok && steps.second.result.ok"
      - "steps.first.result.value.files == ['__init__.py', 'model.py']"
      - "steps.first.result.value.hash != steps.second.result.value.hash"
      # both hashes read the package listing (rglob) after and before the rewrite
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'local-disk.list-files').size() == 2"

  - id: oracle-r4-models-layers-pooler-lambda-forward-list
    name: "test_pooler_activations.py::TestLambdaPoolerActivation::test_forward_list"
    description: "tests/model_executor/layers/test_pooler_activations.py:139. LambdaPoolerActivation(nn.ReLU()) on a list of tensors activates each one: [[-1, 2], [3, -4]] -> [[0, 2], [3, 0]] (activations.py:93-100, 157-158)."
    fixtures: [tp1-llama-8b]
    steps:
      - interface: pooler-activation.forward
        caller: gpu-worker
        as: out
        input: {kind: lambda, fn: ReLU, is_list: true, pooled_data: [[-1.0, 2.0], [3.0, -4.0]]}
    expect:
      - "steps.out.result.ok && steps.out.result.value.out == [[0.0, 2.0], [3.0, 0.0]]"
      - "steps.out.result.value.applied == ['ReLU', 'ReLU']"

  - id: oracle-r4-models-layers-transformers-backend-tp2
    name: "test_backend.py::test_distributed (model-level part)"
    description: >-
      tests/models/transformers/test_backend.py:216. With model_impl='transformers', Llama-3.2-1B (LlamaForCausalLM, a class
      transformers ships with vLLM-compatible attention) must use the Transformers backend: the registry resolves it to
      TransformersForCausalLM (registry.py:1386-1392, 1222-1295). The logprob comparison against HF and the per-rank
      module counts are untranslatable (numerics, nn.Module introspection).
    fixtures: [tp1-llama-8b]
    choices: {model-registry.try-resolve-transformers.transformers_class: compatible}
    steps:
      - {flow: models-registry-resolve, as: tf, input: {architectures: [LlamaForCausalLM], model_impl: transformers}}
      - {flow: models-registry-resolve, as: native, input: {architectures: [LlamaForCausalLM], model_impl: auto}}
    expect:
      - "steps.tf.result.ok && steps.tf.result.value.arch == 'TransformersForCausalLM' && steps.tf.result.value.table == 'transformers_backend'"
      - "steps.native.result.value.arch == 'LlamaForCausalLM' && steps.native.result.value.component == 'llama-for-causal-lm'"

  - id: oracle-r4-models-layers-video-processor-backends
    name: "test_video.py::test_video_processor_from_model_repo (loader resolution)"
    description: >-
      tests/multimodal/test_video.py:820. Each repo's HF video processor class resolves to its registered video loader
      backend, and VIDEO_LOADER_REGISTRY.load gives the expected class (video.py:77-97, 356-1070). Reading
      video_processor_type from the hub's preprocessor config is serving-api's transformers_utils (processor.py:166-193),
      so the scenario starts from the processor names; the frame-index alignment with HF sample_frames is numeric.
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: video-loader-registry.get-backend-for-video-processor, caller: gpu-worker, as: glm4v, input: {video_processor: Glm4vVideoProcessor}}
      - {interface: video-loader-registry.get-backend-for-video-processor, caller: gpu-worker, as: glm46v, input: {video_processor: Glm46VVideoProcessor}}
      - {interface: video-loader-registry.get-backend-for-video-processor, caller: gpu-worker, as: qwen3vl, input: {video_processor: Qwen3VLVideoProcessor}}
      - {interface: video-loader-registry.get-backend-for-video-processor, caller: gpu-worker, as: qwen2vl, input: {video_processor: Qwen2VLVideoProcessor}}
      - {interface: video-loader-registry.get-backend-for-video-processor, caller: gpu-worker, as: minimax, input: {video_processor: MiniMaxM3VLVideoProcessor}}
      - {interface: video-loader-registry.load, caller: gpu-worker, as: l_glm4v, input: {name: opencv_dynamic}}
      - {interface: video-loader-registry.load, caller: gpu-worker, as: l_glm46v, input: {name: glm46v}}
      - {interface: video-loader-registry.load, caller: gpu-worker, as: l_qwen3vl, input: {name: qwen3_vl}}
      - {interface: video-loader-registry.load, caller: gpu-worker, as: l_qwen2vl, input: {name: qwen2_vl}}
      - {interface: video-loader-registry.load, caller: gpu-worker, as: l_minimax, input: {name: minimax_m3_vl}}
    expect:
      - "steps.glm4v.result.value.backend == 'opencv_dynamic' && steps.l_glm4v.result.value.loader_cls == 'DynamicVideoBackend'"
      - "steps.glm46v.result.value.backend == 'glm46v' && steps.l_glm46v.result.value.loader_cls == 'GLM46VVideoBackend'"
      - "steps.qwen3vl.result.value.backend == 'qwen3_vl' && steps.l_qwen3vl.result.value.loader_cls == 'Qwen3VLVideoBackend'"
      - "steps.qwen2vl.result.value.backend == 'qwen2_vl' && steps.l_qwen2vl.result.value.loader_cls == 'Qwen2VLVideoBackend'"
      - "steps.minimax.result.value.backend == 'minimax_m3_vl' && steps.l_minimax.result.value.loader_cls == 'MiniMaxM3VideoBackend'"

  - id: oracle-r4-models-layers-prompt-updates-text-fallback
    name: "test_processing.py::test_apply_prompt_updates_falls_back_to_text_matching"
    description: >-
      tests/multimodal/test_processing.py:1150. The prompt [1000] ("food") has no token match for the target
      [101, 111, 111] ("foo"), so _apply_prompt_updates redoes the replacement on the decoded text and re-encodes:
      [200, 201, ord('d')], with the image placeholder at offset 0 (processor.py:1618-1735). The test's fake
      character-level tokenizer is given as the vocabulary stand-in.
    fixtures: [tp1-llama-8b]
    steps:
      - interface: base-multi-modal-processor.apply-prompt-updates
        caller: gpu-worker
        as: r
        input:
          token_ids: [1000]
          tokenizer_vocab: {"1000": food, "101": f, "111": o, "200": "È", "201": "É", "100": d}
          mm_prompt_updates: {image: [[{mode: replace, target: [101, 111, 111], content: [200, 201]}]]}
    expect:
      - "steps.r.result.ok && steps.r.result.value.token_ids == [200, 201, 100]"
      - "steps.r.result.value.placeholders.image.map(p, p.offset) == [0]"
      - "steps.r.result.value.placeholders.image.map(p, p.tokens) == [[200, 201]]"

  - id: oracle-r4-models-layers-audio-first-channel
    name: "test_audio.py::TestNormalizeAudio::test_first_channel_reduction"
    description: "tests/multimodal/test_audio.py:234. AudioSpec(target_channels=1, channel_reduction=FIRST) on [[1, 2], [3, 4]] keeps the first channel [1, 2] (audio.py:100-170)."
    fixtures: [tp1-llama-8b]
    steps:
      - interface: audio.normalize-audio
        caller: gpu-worker
        as: r
        input: {audio: [[1.0, 2.0], [3.0, 4.0]], target_channels: 1, channel_reduction: first}
    expect:
      - "steps.r.result.ok && steps.r.result.value.audio == [1.0, 2.0]"
