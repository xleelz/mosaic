schema_version: 1
id: vllm
scenarios:
- id: bench-q5-3-a-chunks
  name: (a) LAST pooling chunks 8192,8192,3616; no output for chunks; final pooler output finishes FINISHED_STOPPED; 1250 blocks released
  fixtures:
  - full-tp1-llama-8b
  config: &id001
    runner: pooling
  steps:
  - flow: scheduler-add-request
    input:
      request_id: E
      prompt_segments:
      - key: doc
        num_tokens: 20000
      pooling_params:
        task: embed
    as: addE
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - E
        sampled_token_ids:
        - []
        pooler_output:
        - null
      scheduler_output: = steps.s1.result.value
    as: u1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - E
        sampled_token_ids:
        - []
        pooler_output:
        - null
      scheduler_output: = steps.s2.result.value
    as: u2
  - flow: scheduler-schedule
    input: {}
    as: s3
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - E
        sampled_token_ids:
        - []
        pooler_output:
        - - 0.1
          - 0.2
      scheduler_output: = steps.s3.result.value
    as: u3
  expect:
  - steps.s1.result.value.num_scheduled_tokens.E == 8192 && steps.s2.result.value.num_scheduled_tokens.E == 8192 && steps.s3.result.value.num_scheduled_tokens.E == 3616
  - size(steps.u1.result.value.outputs) == 0 && size(steps.u2.result.value.outputs) == 0
  - size(steps.u3.result.value.outputs) == 1 && steps.u3.result.value.outputs[0].finish_reason == 'stop'
  - '!(''E'' in state.scheduler.requests) || state.scheduler.requests.E.status == ''FINISHED_STOPPED'''
  - '!(''E'' in state.scheduler.running)'
  - trace.exists(e, e.type == 'call.start' && e.interface.contains('free') && e.interface.contains('full-attention-manager'))
- id: bench-q5-3-b-exact-max
