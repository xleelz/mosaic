  fixtures:
  - full-tp1-llama-8b
  config: *id001
  max_events: 200000
  steps:
  - flow: scheduler-add-request
    input:
      request_id: M
      prompt_segments:
      - key: doc
        num_tokens: 131072
      pooling_params:
        task: embed
    as: addM
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-schedule
    input: {}
    as: s3
  - flow: scheduler-schedule
    input: {}
    as: s4
  - flow: scheduler-schedule
    input: {}
    as: s5
  - flow: scheduler-schedule
    input: {}
    as: s6
  - flow: scheduler-schedule
    input: {}
    as: s7
  - flow: scheduler-schedule
    input: {}
    as: s8
  - flow: scheduler-schedule
    input: {}
    as: s9
  - flow: scheduler-schedule
    input: {}
    as: s10
  - flow: scheduler-schedule
    input: {}
    as: s11
  - flow: scheduler-schedule
    input: {}
    as: s12
  - flow: scheduler-schedule
    input: {}
    as: s13
  - flow: scheduler-schedule
    input: {}
    as: s14
  - flow: scheduler-schedule
    input: {}
    as: s15
  - flow: scheduler-schedule
    input: {}
    as: s16
  expect:
  - steps.s16.result.value.num_scheduled_tokens.M == 8192
  - state.scheduler.requests.M.num_computed_tokens == 131072
- id: bench-q5-3-c-prefix-hit
  name: '(c) embed reads the prefix cache: 1249 blocks (19984) hit, 16 computed'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  steps:
  - flow: scheduler-add-request
    input:
      request_id: E
      prompt_segments:
      - key: doc
        num_tokens: 20000
      pooling_params:
        task: embed
    as: addE
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-schedule
    input: {}
    as: s3
  - &id002
    flow: scheduler-finish-requests
    input:
      request_ids:
      - E
      finished_status: FINISHED_STOPPED
    as: fin
  - flow: scheduler-add-request
    input:
      request_id: F
      prompt_segments:
      - key: doc
        num_tokens: 20000
      pooling_params:
        task: embed
    as: addF
  - flow: scheduler-schedule
    input: {}
    as: t1
  expect:
  - state.scheduler.requests.F.num_cached_tokens == 19984
  - steps.t1.result.value.num_scheduled_tokens.F == 16
- id: bench-q5-3-d-resolved
  name: '(d) MEAN: attn decoder; chunked and prefix off; 131072 batched tokens; 1024 seqs'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: config-create-engine-config
    input:
      runner: pooling
      pooler_config:
        seq_pooling_type: MEAN
    as: cfg
  expect:
  - steps.cfg.result.ok
  - '!steps.cfg.result.value.scheduler_config.enable_chunked_prefill && !steps.cfg.result.value.cache_config.enable_prefix_caching'
  - steps.cfg.result.value.scheduler_config.max_num_batched_tokens == 131072
  - steps.cfg.result.value.scheduler_config.max_num_seqs == 1024
  - trace.exists(e, e.type == 'call.end' && e.interface == 'model-config.attn-type' && string(e.output).contains('decoder'))
- id: bench-q5-3-d-one-step
  name: (d) with chunked prefill off and 131072 batched tokens the 20000-token input prefills in one step
  fixtures:
  - full-tp1-llama-8b
  config:
    runner: pooling
    enable-chunked-prefill: false
    enable-prefix-caching: false
    max-num-batched-tokens: 131072
  steps:
  - flow: scheduler-add-request
    input:
      request_id: E
      prompt_segments:
      - key: doc
        num_tokens: 20000
      pooling_params:
        task: embed
    as: addE
  - flow: scheduler-schedule
    input: {}
    as: s1
  expect:
  - steps.s1.result.value.num_scheduled_tokens.E == 20000
- id: bench-q5-3-d-warning
  name: (d) --enable-chunked-prefill warns with the exact text
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: config-create-engine-config
    input:
      runner: pooling
      pooler_config:
        seq_pooling_type: MEAN
      enable_chunked_prefill: true
    as: cfg
  expect:
  - steps.cfg.result.ok && steps.cfg.result.value.scheduler_config.enable_chunked_prefill
  - trace.exists(e, e.type == 'note' && e.title.contains('This model does not officially support chunked prefill. Enabling this manually may cause the engine to crash or produce incorrect outputs.'))
- id: bench-q5-3-e-api-refuses-other-task
  name: '(e, corrected) POST /pooling task token_embed on a task-embed server is refused: Try switching the model''s pooling_task'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  state:
    app-state:
      supported_tasks:
      - embed
      - token_embed
    async-llm:
      supported_tasks:
      - embed
      - token_embed
  steps:
  - interface: serving-pooling.post-pooling
    caller: api-client
    input:
      path: /pooling
      body:
        task: token_embed
        input:
        - hello
    as: p
  expect:
  - '!steps.p.result.ok && steps.p.result.error.status == 400'
  - '!steps.p.result.ok && steps.p.result.error.message == "Try switching the model''s pooling_task via --pooler-config.task token_embed. (parameter=task)"'
- id: bench-q5-3-e-skip-read
  name: '(e) token_embed pooling params skip reading: no prefix hits'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  steps:
  - flow: scheduler-add-request
    input:
      request_id: E
      prompt_segments:
      - key: doc
        num_tokens: 20000
      pooling_params:
        task: embed
    as: addE
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-schedule
    input: {}
    as: s3
  - *id002
  - flow: scheduler-add-request
    input:
      request_id: T
      prompt_segments:
      - key: doc
        num_tokens: 20000
      pooling_params:
        task: token_embed
    as: addT
  - flow: scheduler-schedule
    input: {}
    as: t1
  expect:
  - state.scheduler.requests.T.num_cached_tokens == 0
  - steps.t1.result.value.num_scheduled_tokens.T == 8192
- id: bench-q5-3-a-e2e-small
  name: '(a) e2e /v1/embeddings: scheduler chunks, pooler output finishes with no decode step'
  fixtures:
  - full-tp1-llama-8b
  config:
    runner: pooling
    async-scheduling: false
    max-num-batched-tokens: 16
  state:
    app-state:
      supported_tasks:
      - embed
      - token_embed
    async-llm:
      supported_tasks:
      - embed
      - token_embed
  max_events: 500000
  steps:
  - interface: serving-embedding.post-v1-embeddings
    caller: api-client
    input:
      path: /v1/embeddings
      body:
        input:
        - = lists.range(40).map(i, 1000)
    as: e
  expect:
  - steps.e.result.ok
  - calls['scheduler.schedule'] >= 3
  - calls['dispatch-pooler.forward'] >= 1
  - calls['scheduler.update-from-output'] >= 3
