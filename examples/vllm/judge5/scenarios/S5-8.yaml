schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-8-a-flag-off
    fixtures: [full-tp1-llama-8b]
    config: {enable-prompt-embeds: false}
    steps:
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'gASVembedsBASE64'}}, as: a}
    expect:
      - "!steps.a.result.ok && steps.a.result.error.status == 400 && steps.a.result.error.data.param == 'prompt_embeds' && steps.a.result.error.message == 'You must set `--enable-prompt-embeds` to input `prompt_embeds`. (parameter=prompt_embeds)'"
      - "calls['async-llm.generate'] == 0"
  - id: bench-s5-8-b-flag-on
    fixtures: [full-tp1-llama-8b]
    config: {enable-prompt-embeds: true}
    steps:
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'gASVembedsBASE64'}}, as: b}
    expect:
      - "steps.b.result.ok && steps.b.result.value.usage.prompt_tokens == 12"
  - id: bench-s5-8-c-refusals
    fixtures: [full-tp1-llama-8b]
    config: {enable-prompt-embeds: true}
    steps:
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'not-a-tensor-file'}}, as: c}
    expect:
      - "!steps.c.result.ok && steps.c.result.error.status == 400 && steps.c.result.error.data.param == 'prompt_embeds' && steps.c.result.error.message.startsWith('`prompt_embeds` could not be deserialized as a torch tensor: ')"
  - id: bench-s5-8-d-prompt-and-embeds
    fixtures: [full-tp1-llama-8b]
    config: {enable-prompt-embeds: true}
    steps:
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: Hello, prompt_embeds: 'gASVembedsBASE64'}}, as: p}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'gASVembedsBASE64', echo: true}}, as: e}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'gASVembedsBASE64', prompt_logprobs: 1}}, as: l}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'gASVembedsBASE64', suffix: x}}, as: s}
    expect:
      - "steps.p.result.ok && size(steps.p.result.value.choices) == 2"
      - "!steps.e.result.ok && steps.e.result.error.status == 400 && steps.e.result.error.message == 'Echo is unsupported with prompt embeds.'"
      - "!steps.l.result.ok && steps.l.result.error.status == 400 && steps.l.result.error.message == 'prompt_logprobs is not compatible with prompt embeds.'"
      - "!steps.s.result.ok && steps.s.result.error.status == 400 && steps.s.result.error.data.param == 'suffix' && steps.s.result.error.message == 'suffix is not supported with prompt_embeds'"
  - id: bench-s5-8-e-block-hash
    fixtures: [full-tp1-llama-8b]
    config: {enable-prompt-embeds: true, enable-prompt-tokens-details: true}
    steps:
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'gASVembedsBASE64'}}, as: e1}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'gASVembedsBASE64'}}, as: e2}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: {$absent: true}, prompt_embeds: 'differentEmbeds'}}, as: e3}
    expect:
      - "steps.e2.result.ok && steps.e2.result.value.usage.prompt_tokens == 40"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'block-pool.get-cached-block').size() > 0"
  - id: bench-s5-8-control-prompt-present
    fixtures: [full-tp1-llama-8b]
    config: {enable-prompt-embeds: false}
    steps:
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: Hello, prompt_embeds: 'gASVembedsBASE64'}}, as: a}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: Hello, prompt_embeds: 'gASVembedsBASE64', echo: true}}, as: e}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: Hello, prompt_embeds: 'gASVembedsBASE64', prompt_logprobs: 1}}, as: l}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, max_tokens: 2, prompt: Hello, prompt_embeds: 'gASVembedsBASE64', suffix: x}}, as: s}
    expect:
      - "!steps.a.result.ok && steps.a.result.error.status == 400 && steps.a.result.error.data.param == 'prompt_embeds'"
      - "!steps.e.result.ok && steps.e.result.error.message == 'Echo is unsupported with prompt embeds.'"
      - "!steps.l.result.ok && steps.l.result.error.message == 'prompt_logprobs is not compatible with prompt embeds.'"
      - "!steps.s.result.ok && steps.s.result.error.message == 'suffix is not supported with prompt_embeds'"
