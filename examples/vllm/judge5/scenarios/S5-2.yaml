schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-2-a-score
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-scores.post-score, caller: api-client, input: {path: /score, body: {model: llama-8b, queries: {$absent: true}, documents: {$absent: true}, items: {$absent: true}, data_1: {$absent: true}, data_2: {$absent: true}, text_1: "What is the capital of France?", text_2: ["Paris is the capital of France.", "The sky is blue."]}}, as: s}
    expect:
      - "steps.s.result.ok && steps.s.result.value.id.startsWith('score-') && steps.s.result.value.object == 'list' && size(steps.s.result.value.data) == 2"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'async-llm.encode' && x.input.pooling_params.task == 'embed').map(x, x.input.request_id) == [steps.s.result.value.id + '-0', steps.s.result.value.id + '-1', steps.s.result.value.id + '-2']"
      - "steps.s.result.value.data[0] == {'index': 0, 'object': 'score', 'score': steps.s.result.value.data[0].score}"
      - "steps.s.result.value.data[0].score > steps.s.result.value.data[1].score"
  - id: bench-s5-2-b-input-lens
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-scores.post-score, caller: api-client, input: {path: /score, body: {model: llama-8b, queries: {$absent: true}, documents: {$absent: true}, items: {$absent: true}, data_1: {$absent: true}, data_2: {$absent: true}, text_1: [a, b], text_2: [c, d, e]}}, as: bad}
      - {interface: serving-scores.post-score, caller: api-client, input: {path: /score, body: {model: llama-8b, queries: {$absent: true}, documents: {$absent: true}, items: {$absent: true}, data_1: {$absent: true}, data_2: {$absent: true}, text_1: [], text_2: [c]}}, as: e1}
      - {interface: serving-scores.post-score, caller: api-client, input: {path: /score, body: {model: llama-8b, queries: {$absent: true}, documents: {$absent: true}, items: {$absent: true}, data_1: {$absent: true}, data_2: {$absent: true}, text_1: [a], text_2: []}}, as: e2}
    expect:
      - "!steps.bad.result.ok && steps.bad.result.error.status == 400 && steps.bad.result.error.code == 'BadRequestError' && steps.bad.result.error.data.param == null && steps.bad.result.error.message == 'Input lengths must be either 1:1, 1:N or N:N'"
      - "!steps.e1.result.ok && steps.e1.result.error.status == 400 && steps.e1.result.error.message == 'At least one text element must be given'"
      - "!steps.e2.result.ok && steps.e2.result.error.status == 400 && steps.e2.result.error.message == 'At least one text_pair element must be given'"
      - "calls['async-llm.encode'] == 0"
  - id: bench-s5-2-c-rerank
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-scores.post-rerank, caller: api-client, input: {path: /rerank, body: {model: llama-8b, query: q, documents: [d0, d1, d2], top_n: 2}}, as: top}
      - {interface: serving-scores.post-rerank, caller: api-client, input: {path: /rerank, body: {model: llama-8b, query: q, documents: [d0, d1, d2]}}, as: all}
    expect:
      - "size(steps.top.result.value.results) == 2 && size(steps.all.result.value.results) == 3"
      - "steps.top.result.value.id.startsWith('score-')"
      - "steps.top.result.value.model == 'llama-8b'"
      - "steps.top.result.value.results[0].relevance_score >= steps.top.result.value.results[1].relevance_score"
      - "has(steps.all.result.value.results[0].document.multi_modal) && steps.all.result.value.results[0].document.multi_modal == null"
      - "has(steps.top.result.value.usage.prompt_tokens) && !has(steps.top.result.value.usage.completion_tokens)"
  - id: bench-s5-2-d-v1-score
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-scores.post-v1-score, caller: api-client, input: {path: /v1/score, body: {model: llama-8b, queries: {$absent: true}, documents: {$absent: true}, items: {$absent: true}, data_1: {$absent: true}, data_2: {$absent: true}, text_1: a, text_2: [b, c]}}, as: s1}
      - {interface: serving-scores.post-v1-score, caller: api-client, input: {path: /v1/score, body: {model: llama-8b, queries: {$absent: true}, documents: {$absent: true}, items: {$absent: true}, data_1: {$absent: true}, data_2: {$absent: true}, text_1: a, text_2: [b, c]}}, as: s2}
    expect:
      - "steps.s1.result.ok && size(steps.s1.result.value.data) == 2 && steps.s2.result.ok"
      - "trace.filter(x, x.type == 'log' || x.type == 'note').filter(x, string(x).contains('moved it to `/score`')).size() == 2"
  - id: bench-s5-2-e-usage
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-scores.post-score, caller: api-client, input: {path: /score, body: {model: llama-8b, queries: {$absent: true}, documents: {$absent: true}, items: {$absent: true}, data_1: {$absent: true}, data_2: {$absent: true}, text_1: "a b c", text_2: ["d e", "f g h i"]}}, as: s}
    expect:
      - "steps.s.result.value.usage.prompt_tokens == steps.s.result.value.usage.total_tokens"
      - "steps.s.result.value.usage.prompt_tokens == sum(trace.filter(x, x.type == 'call.start' && x.interface == 'async-llm.encode').map(x, size(x.input.prompt_token_ids)))"
