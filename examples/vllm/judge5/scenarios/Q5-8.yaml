  - size(steps.s1.result.value.scheduled_cached_reqs.new_block_ids[0]) == 1
  - state.scheduler.requests.A.status == 'RUNNING'
  - calls['scheduler.preempt-request'] == 0
- id: bench-q5-8-d-idle-skips-watermark
  name: '(d) nothing running, 120 free, W admitted: 57 <= 120'
