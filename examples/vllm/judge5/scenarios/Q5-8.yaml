- id: bench-q5-8-c-running-ignores-watermark
  name: (c) A's decode allocation succeeds with one free block
  fixtures:
  - full-tp1-llama-8b
  config:
    watermark: 0.1
    num-gpu-blocks-override: 1000
  state:
    block-pool:
      num_gpu_blocks: 1000
      next_fresh: 999
    full-attention-manager:
      req_to_blocks:
        A:
        - 1
      num_cached_block:
        A: 1
    scheduler:
      running:
      - A
      requests:
        A:
          request_id: A
          arrival_time: 0
          status: RUNNING
          prompt_token_ids: null
          prompt_segments:
          - key: doc-a
            num_tokens: 16
          block_hashes:
          - doc-a@16
          num_prompt_tokens: 16
