schema_version: 1
id: vllm
scenarios:
- id: bench-q5-8-b-watermark-blocks-admission
  name: '(a,b) int(0.1*1000)=100; 57+100=157 > 150 free: W stays WAITING at head'
  fixtures:
  - full-tp1-llama-8b
  config:
    watermark: 0.1
    num-gpu-blocks-override: 1000
  state:
    block-pool:
      num_gpu_blocks: 1000
      next_fresh: 850
    full-attention-manager:
      req_to_blocks:
        A:
        - 1
        - 2
      num_cached_block:
        A: 1
    scheduler:
      running:
      - A
      requests:
        A:
          request_id: A
          arrival_time: 0
          status: RUNNING
          prompt_token_ids: null
          prompt_segments:
          - key: doc-a
            num_tokens: 16
          block_hashes:
          - doc-a@16
          num_prompt_tokens: 16
          num_computed_tokens: 16
          output_token_ids:
          - 1001
          spec_token_ids: []
          num_output_placeholders: 0
          num_preemptions: 0
          num_cached_tokens: 0
          priority: 0
          max_tokens: 100
          min_tokens: 0
          eos_token_id: 128009
          stop_token_ids: []
          sampling_params:
            max_tokens: 100
            temperature: 0
          is_prefill_chunk: false
          grammar_id: null
          kv_transfer_params: null
          client_index: 0
  steps:
  - flow: scheduler-add-request
    input:
      prompt_segments:
      - key: doc-w
        num_tokens: 900
      request_id: W
      sampling_params:
        max_tokens: 8
    as: add
  - flow: scheduler-schedule
    input: {}
    as: s1
  expect:
  - '''W'' in state.scheduler.waiting && state.scheduler.waiting[0] == ''W'''
  - state.scheduler.requests.W.status == 'WAITING'
  - '!(''W'' in steps.s1.result.value.num_scheduled_tokens)'
  - steps.s1.result.value.num_scheduled_tokens.A == 1
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.allocate-slots' && e.output.allocated == false)
- config:
    num-gpu-blocks-override: 1000
    watermark: 0.1
  expect:
  - '!(''W'' in steps.s1.result.value.num_scheduled_tokens)'
  - state.scheduler.requests.W.status == 'WAITING'
  fixtures:
  - full-tp1-llama-8b
  id: bench-q5-8-a-boundary-156-free-refuses
