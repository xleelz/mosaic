      num_cached_block:
        A: 1
      req_to_blocks:
        A:
        - 1
        - 2
    scheduler:
      requests:
        A:
          arrival_time: 0
          block_hashes:
          - doc-a@16
          client_index: 0
          eos_token_id: 128009
          grammar_id: null
          is_prefill_chunk: false
          kv_transfer_params: null
          max_tokens: 100
          min_tokens: 0
          num_cached_tokens: 0
          num_computed_tokens: 16
          num_output_placeholders: 0
          num_preemptions: 0
          num_prompt_tokens: 16
          output_token_ids:
          - 1001
          priority: 0
          prompt_segments:
          - key: doc-a
            num_tokens: 16
          prompt_token_ids: null
          request_id: A
          sampling_params:
            max_tokens: 100
            temperature: 0
          spec_token_ids: []
          status: RUNNING
          stop_token_ids: []
      running:
      - A
  steps:
  - as: add
    flow: scheduler-add-request
    input:
      prompt_segments:
      - key: doc-w
        num_tokens: 900
      request_id: W
      sampling_params:
        max_tokens: 8
  - as: s1
    flow: scheduler-schedule
    input: {}
