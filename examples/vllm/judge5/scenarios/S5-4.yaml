schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-4-a-required-schema
    fixtures: [full-tp1-llama-8b]
    config: {enable-auto-tool-choice: true, tool-call-parser: llama3_json}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: required, max_tokens: 4}}, as: req}
    expect:
      - "steps.req.result.ok"
      - "trace.exists(x, x.type == 'call.start' && x.interface == 'async-llm.generate' && json(x.input.sampling_params.structured_outputs.json) == json({'type': 'array', 'minItems': 1, 'items': {'type': 'object', 'anyOf': [{'properties': {'name': {'type': 'string', 'enum': ['get_weather']}, 'parameters': {'type': 'object', 'properties': {'city': {'type': 'string'}}}}, 'required': ['name', 'parameters']}]}}))"
  - id: bench-s5-4-a-parallel-false
    fixtures: [full-tp1-llama-8b]
    config: {enable-auto-tool-choice: true, tool-call-parser: llama3_json}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: required, parallel_tool_calls: false, max_tokens: 4}}, as: req}
    expect:
      - "steps.req.result.ok"
      - "trace.exists(x, x.type == 'call.start' && x.interface == 'async-llm.generate' && json(x.input.sampling_params.structured_outputs.json) == json({'type': 'array', 'minItems': 1, 'maxItems': 1, 'items': {'type': 'object', 'anyOf': [{'properties': {'name': {'type': 'string', 'enum': ['get_weather']}, 'parameters': {'type': 'object', 'properties': {'city': {'type': 'string'}}}}, 'required': ['name', 'parameters']}]}}))"
  - id: bench-s5-4-b-required-response
    fixtures: [full-tp1-llama-8b]
    config: {enable-auto-tool-choice: true, tool-call-parser: llama3_json}
    steps:
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, input: {model_output: '[{"name": "get_weather", "parameters": {"city": "Paris"}}]'}, as: tc}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: required, max_tokens: 4}}, as: req}
    expect:
      - "steps.tc.result.value.tools_called && steps.tc.result.value.tool_calls[0].function.name == 'get_weather'"
      - "steps.req.result.value.choices[0].message.content == ''"
      - "calls['llama3-json-tool-parser.extract-tool-calls'] == 1"
  - id: bench-s5-4-c-named
    fixtures: [full-tp1-llama-8b]
    config: {enable-auto-tool-choice: true, tool-call-parser: llama3_json}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: {type: function, function: {name: get_weather}}, max_tokens: 4}}, as: n}
    expect:
      - "trace.exists(x, x.type == 'call.start' && x.interface == 'async-llm.generate' && json(x.input.sampling_params.structured_outputs.json) == json({'type': 'object', 'properties': {'city': {'type': 'string'}}}))"
      - "size(steps.n.result.value.choices[0].message.tool_calls) == 1 && steps.n.result.value.choices[0].message.tool_calls[0].function.name == 'get_weather'"
      - "steps.n.result.value.choices[0].message.content == ''"
      - "steps.n.result.value.choices[0].finish_reason == 'length'"
  - id: bench-s5-4-c-named-empty-params
    fixtures: [full-tp1-llama-8b]
    config: {enable-auto-tool-choice: true, tool-call-parser: llama3_json}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: f}}], tool_choice: {type: function, function: {name: f}}, max_tokens: 2}}, as: n}
    expect:
      - "trace.exists(x, x.type == 'call.start' && x.interface == 'async-llm.generate' && json(x.input.sampling_params.structured_outputs.json) == json({'type': 'object', 'properties': {}}))"
  - id: bench-s5-4-d-auto
    fixtures: [full-tp1-llama-8b]
    config: {enable-auto-tool-choice: true, tool-call-parser: llama3_json}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: auto, max_tokens: 3}}, as: auto}
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, input: {model_output: '{"name": "get_weather", "parameters": {"city": "Paris"}}'}, as: p1}
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, input: {model_output: '{"name": "get_weather", "arguments": {"city": "Paris"}}'}, as: p2}
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, input: {model_output: 'plain text'}, as: p3}
      - {interface: llama3-json-tool-parser.extract-tool-calls, caller: api-server, input: {model_output: 'Sure: {"name": "get_weather", "parameters": {"city": "Paris"}} ok'}, as: p4}
    expect:
      - "steps.auto.result.ok && steps.auto.result.value.choices[0].message.tool_calls == [] && calls['llama3-json-tool-parser.extract-tool-calls'] >= 1"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'async-llm.generate').all(x, !has(x.input.sampling_params.structured_outputs) || x.input.sampling_params.structured_outputs == null)"
      - "steps.p1.result.value.tools_called && steps.p1.result.value.tool_calls[0].function.name == 'get_weather' && steps.p2.result.value.tools_called"
      - "!steps.p3.result.value.tools_called && steps.p3.result.value.content == 'plain text' && steps.p3.result.value.tool_calls == []"
      - "type(steps.p1.result.value.tool_calls[0].function.arguments) == string"
      - "steps.p4.result.value.tools_called"
  - id: bench-s5-4-e-truncated
    fixtures: [full-tp1-llama-8b]
    config: {enable-auto-tool-choice: true, tool-call-parser: llama3_json}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: required, max_tokens: 5}}, as: t}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: weather}], tools: [{type: function, function: {name: get_weather, parameters: {type: object, properties: {city: {type: string}}}}}], tool_choice: {type: function, function: {name: get_weather}}, structured_outputs: {regex: 'a+'}}}, as: r}
    expect:
      - "steps.t.result.value.choices[0].finish_reason == 'length' && steps.t.result.value.choices[0].message.tool_calls == []"
      - "steps.t.result.value.choices[0].message.content == ''"
      - "!steps.r.result.ok && steps.r.result.error.status == 400 && steps.r.result.error.message == 'You can only either use constraints for structured outputs or tools, not both.'"
