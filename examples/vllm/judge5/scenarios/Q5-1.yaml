- id: bench-q5-1-d-fp8-clamp
  name: (d) decode clamped to 1, no drafts scheduled, cleared, length finish after 2 tokens
  fixtures:
  - full-fp8-llama-3-8b
  config: *id001
  steps:
  - flow: scheduler-add-request
    input:
      request_id: F
      prompt_segments:
      - key: pf
        num_tokens: 8190
      sampling_params:
        max_tokens: 2
    as: add
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - F
        sampled_token_ids:
        - - 791
      scheduler_output: = steps.s1.result.value
    as: u1
  - flow: scheduler-update-draft-token-ids
    input:
      req_ids:
      - F
      draft_token_ids:
      - - 201
        - 202
        - 203
    as: d1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - F
        sampled_token_ids:
        - - 792
      scheduler_output: = steps.s2.result.value
    as: u2
  expect:
  - config['max-model-len'] == 8192
  - steps.s2.result.value.num_scheduled_tokens.F == 1
  - steps.s2.result.value.scheduled_spec_decode_tokens == {}
  - steps.u2.result.value.outputs[0].finish_reason == 'length'
  - size(steps.u1.result.value.outputs[0].new_token_ids) == 1 && size(steps.u2.result.value.outputs[0].new_token_ids) == 1
- id: bench-q5-1-d-default-max-tokens
  name: '(d) API: no max_tokens with an 8190-token prompt defaults to 8192-8190=2'
  fixtures:
  - full-fp8-llama-3-8b
  config: *id001
  max_events: 1000000
  max_cel_cost: 10000000000
  steps:
  - flow: serving-api-completion
    input:
      body:
        model: llama-3-8b-fp8
        prompt: = lists.range(8190).map(i, 1000)
        max_tokens:
          $absent: true
    as: c
  expect:
  - steps.c.result.ok
  - steps.c.result.value.choices[0].finish_reason == 'length'
  - steps.c.result.value.usage.completion_tokens == 2
  - steps.c.result.value.usage.prompt_tokens == 8190
  - trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.max_tokens == 2)
- id: bench-q5-1-e-no-match
  name: '(e) empty draft: ordinary 1-token decode, no stats'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  steps:
  - *id002
  - *id003
  - *id004
  - flow: scheduler-update-draft-token-ids
    input:
      req_ids:
      - A
      draft_token_ids:
      - []
    as: d1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - A
        sampled_token_ids:
        - - 792
      scheduler_output: = steps.s2.result.value
    as: u2
  - interface: scheduler.make-spec-decoding-stats
    caller: engine-core
    input:
      num_draft_tokens: 0
      num_accepted_tokens: 0
    as: none
