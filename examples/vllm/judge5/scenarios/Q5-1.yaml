schema_version: 1
id: vllm
scenarios:
- id: bench-q5-1-a-resolve-config
  name: (a) prompt_lookup_min defaults to prompt_lookup_max (3)
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: engine-args.create-speculative-config
    caller: operator
    input:
      speculative_config:
        method: ngram
        num_speculative_tokens: 3
        prompt_lookup_max: 3
      target_max_model_len: 131072
    as: c
  expect:
  - steps.c.result.value.prompt_lookup_min == 3 && steps.c.result.value.prompt_lookup_max == 3 && steps.c.result.value.num_speculative_tokens == 3
- id: bench-q5-1-a-c-sched-and-accept
  name: (a) 4 new tokens, 3 drafts; (c) accept first, rollback 2, stats
  fixtures:
  - full-tp1-llama-8b
  config: &id001
    speculative-method: ngram
    num-speculative-tokens: 3
    async-scheduling: false
  steps:
  - &id002
    flow: scheduler-add-request
    input:
      request_id: A
      prompt_segments:
      - key: pa
        num_tokens: 32
      sampling_params:
        max_tokens: 64
    as: add
  - &id003
    flow: scheduler-schedule
    input: {}
    as: s1
  - &id004
    flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - A
        sampled_token_ids:
        - - 791
      scheduler_output: = steps.s1.result.value
    as: u1
  - flow: scheduler-update-draft-token-ids
    input:
      req_ids:
      - A
      draft_token_ids:
      - - 201
        - 202
        - 203
    as: d1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - A
        sampled_token_ids:
        - - 201
          - 777
      scheduler_output: = steps.s2.result.value
    as: u2
  expect:
  - steps.s2.result.value.num_scheduled_tokens.A == 4
  - steps.s2.result.value.scheduled_spec_decode_tokens.A == [201, 202, 203]
  - trace.filter(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.allocate-slots').all(e, e.input.num_lookahead_tokens == 0)
  - state.scheduler.requests.A.num_computed_tokens == 34
  - state.scheduler.requests.A.output_token_ids == [791, 201, 777]
  - steps.u2.result.value.scheduler_stats.spec_decoding_stats.num_drafts == 1
  - steps.u2.result.value.scheduler_stats.spec_decoding_stats.num_draft_tokens == 3
  - steps.u2.result.value.scheduler_stats.spec_decoding_stats.num_accepted_tokens == 1
  - steps.u2.result.value.scheduler_stats.spec_decoding_stats.num_accepted_tokens_per_pos == [1, 0, 0]
