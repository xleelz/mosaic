schema_version: 1
id: vllm
scenarios:
- id: bench-q5-6-lifecycle
  name: (a-c,e) LoRA id, prefix-cache keys by name and path, in-place reload, unload and reload
  fixtures:
  - full-tp1-llama-8b
  - lora-adapter-on-disk
  config:
    enable-lora: true
    vllm-allow-runtime-lora-updating: true
    async-scheduling: false
  state:
    local-disk:
      files:
        /models/lora/sql-adapter-v2/adapter_config.json:
          content: '{"r": 16, "lora_alpha": 32, "target_modules": ["q_proj", "k_proj", "v_proj", "o_proj"], "base_model_name_or_path": "meta-llama/Llama-3.1-8B-Instruct"}'
          json:
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
            lora_alpha: 32
            r: 16
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
          size: 160
        /models/lora/sql-adapter-v2/adapter_model.safetensors:
          size: 54525952
  max_events: 200000
  steps:
  - flow: serving-api-lora-load
    input:
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter
        load_inplace: false
    as: load1
  - flow: scheduler-add-request
    input:
      request_id: R1
      prompt_segments:
      - key: p
        num_tokens: 100
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql-adapter
      sampling_params:
        max_tokens: 4
    as: addR1
  - flow: scheduler-schedule
    input: {}
    as: sR1
  - flow: scheduler-add-request
    input:
      request_id: R2
      prompt_segments:
      - key: p
        num_tokens: 100
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql-adapter
      sampling_params:
        max_tokens: 4
    as: addR2
  - flow: scheduler-schedule
    input: {}
    as: sR2
  - flow: serving-api-lora-load
    input:
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter
        load_inplace: true
    as: load2
  - flow: scheduler-add-request
    input:
      request_id: R3
      prompt_segments:
      - key: p
        num_tokens: 100
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql-adapter
      sampling_params:
        max_tokens: 4
    as: addR3
  - flow: scheduler-schedule
    input: {}
    as: sR3
  - flow: serving-api-lora-load
    input:
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter-v2
        load_inplace: true
    as: load3
  - flow: scheduler-add-request
    input:
      request_id: R4
      prompt_segments:
      - key: p
        num_tokens: 100
      lora_request:
        lora_name: sql
        lora_int_id: 1
        lora_path: /models/lora/sql-adapter-v2
      sampling_params:
        max_tokens: 4
    as: addR4
  - flow: scheduler-schedule
    input: {}
    as: sR4
  - flow: scheduler-add-request
    input:
      request_id: B
      prompt_segments:
      - key: p
        num_tokens: 100
      sampling_params:
        max_tokens: 4
    as: addB
  - flow: scheduler-schedule
    input: {}
    as: sB
  - interface: openai-serving-models.post-v1-unload-lora-adapter
    caller: api-client
    input:
      path: /v1/unload_lora_adapter
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter
        load_inplace: false
    as: unload
  - flow: serving-api-lora-load
    input:
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter
        load_inplace: false
    as: load4
  - flow: scheduler-add-request
    input:
      request_id: R5
      prompt_segments:
      - key: p
        num_tokens: 100
      lora_request:
        lora_name: sql
        lora_int_id: 2
        lora_path: /models/lora/sql-adapter
      sampling_params:
        max_tokens: 4
    as: addR5
  - flow: scheduler-schedule
    input: {}
    as: sR5
  expect:
  - steps.load1.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.add-lora' && e.input.lora_request.lora_int_id == 1 && e.input.lora_request.lora_name == 'sql')
  - state.scheduler.requests.R1.block_hashes.all(h, h.contains('lora(sql,/models/lora/sql-adapter)'))
  - size(state.scheduler.requests.R1.block_hashes) == 6
  - state.scheduler.requests.R2.num_cached_tokens == 96
  - 'steps.load2.result.value.body == "Success: LoRA adapter ''sql'' added successfully." || steps.load2.result.value == "Success: LoRA adapter ''sql'' added successfully." || string(steps.load2.result.value).contains("Success:
    LoRA adapter ''sql'' added successfully.")'
  - trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.add-lora')[1].input.lora_request.lora_int_id == 1
  - trace.exists(e, e.type == 'note' && e.title.contains("Reloaded LoRA adapter 'sql' in place from the same path '/models/lora/sql-adapter'"))
  - state.scheduler.requests.R3.num_cached_tokens == 96
  - trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.add-lora')[2].input.lora_request.lora_int_id == 1
  - state.scheduler.requests.R4.num_cached_tokens == 0
  - state.scheduler.requests.B.num_cached_tokens == 0
  - state['openai-serving-models'].lora_requests.sql.lora_int_id == 2
  - steps.unload.result.ok
  - trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.add-lora')[3].input.lora_request.lora_int_id == 2
  - state.scheduler.requests.R5.num_cached_tokens == 96
- id: bench-q5-6-d-worker-inplace
  name: '(d) load_inplace reaches the LRU worker manager: new weights loaded under the cached id; old removed then added'
  fixtures:
  - full-tp1-llama-8b
  - lora-adapter-on-disk
  config:
    enable-lora: true
    vllm-allow-runtime-lora-updating: true
  steps:
  - flow: serving-api-lora-load
    input:
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter
        load_inplace: false
    as: load1
  - flow: serving-api-lora-load
    input:
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter
        load_inplace: true
    as: load2
  expect:
  - steps.load1.result.ok && steps.load2.result.ok
  - trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.add-lora')[1].input.lora_request.load_inplace == true
  - trace.exists(e, e.type == 'call.start' && e.interface == 'lru-cache-worker-lora-manager.add-adapter' && has(e.input.load_inplace) && e.input.load_inplace == true)
  - calls['lru-cache-worker-lora-manager.load-adapter'] == 2
  - calls['lru-cache-lora-model-manager.remove-adapter'] == 2
- id: bench-q5-6-d-worker-direct
  name: '(d) direct: the worker manager with load_inplace on id 1 reloads under the same id'
  flow: models-lora-add-adapter
  fixtures:
  - full-tp1-llama-8b
  - lora-adapter-on-disk
  config:
    enable-lora: true
  steps:
  - flow: models-lora-add-adapter
    input:
      lora_name: sql
      lora_int_id: 1
      lora_path: /models/lora/sql-adapter
      load_inplace: false
    as: a1
  - flow: models-lora-add-adapter
    input:
      lora_name: sql
      lora_int_id: 1
      lora_path: /models/lora/sql-adapter
      load_inplace: true
    as: a2
  - flow: models-lora-list-adapters
    as: ls
  expect:
  - calls['lru-cache-worker-lora-manager.load-adapter'] == 2
  - steps.ls.result.value.registered == [1]
  - calls['lru-cache-lora-model-manager.remove-adapter'] == 2
- id: bench-q5-6-a-e2e
  name: '(a) e2e: R1 and R2 with model sql and the same 100-token prompt: R2 hits 96 tokens'
  fixtures:
  - full-tp1-llama-8b
  - lora-adapter-on-disk
  config:
    enable-lora: true
    vllm-allow-runtime-lora-updating: true
  max_events: 500000
  steps:
  - flow: serving-api-lora-load
    input:
      body:
        lora_name: sql
        lora_path: /models/lora/sql-adapter
        load_inplace: false
    as: load1
  - flow: serving-api-completion
    input:
      body:
        model: sql
        prompt: = lists.range(100).map(i, 1000 + i)
        max_tokens: 1
    as: r1
  - flow: serving-api-completion
    input:
      body:
        model: sql
        prompt: = lists.range(100).map(i, 1000 + i)
        max_tokens: 1
    as: r2
  expect:
  - steps.r1.result.ok && steps.r2.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && has(e.input.lora_request) && e.input.lora_request.lora_name == 'sql' && e.input.lora_request.lora_int_id == 1)
  - trace.exists(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.record-prefix-cache-stats' && e.input.num_hits == 96)
