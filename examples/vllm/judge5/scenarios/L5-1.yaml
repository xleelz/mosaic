schema_version: 1
id: vllm
# (b) and the "2 behaves as 4" half of (c) cannot be driven: no config id stream-interval exists
# ("unknown config" at validation), and output-processor has no sent_tokens_offset gate.
scenarios:
  - id: bench-l5-1-a-role
    fixtures: [full-tp1-llama-8b]
    max_events: 200000
    steps:
    - {as: base, flow: serving-api-chat-stream, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {stream: true, max_tokens: 10, request_id: {$absent: true}, stream_options: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {as: nogen, flow: serving-api-chat-stream, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {stream: true, max_tokens: 10, add_generation_prompt: false, request_id: {$absent: true}, stream_options: {$absent: true}, messages: [{role: user, content: hi}]}}}
    expect:
    - "steps.base.result.value.items[0].id.matches('^chatcmpl-[0-9a-f-]{32,36}$')"
    - "steps.base.result.value.items[0].object == 'chat.completion.chunk'"
    - "steps.base.result.value.items[0].choices == [{'index': 0, 'delta': {'role': 'assistant', 'content': ''}, 'logprobs': null, 'finish_reason': null}]"
    - "!has(steps.base.result.value.items[0].usage)"
    - "steps.nogen.result.value.items[0].choices[0].delta.role == 'user'"
  - id: bench-l5-1-c-request-interval
    fixtures: [full-tp1-llama-8b]
    max_events: 200000
    steps:
    - {as: si8, flow: serving-api-chat-stream, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {stream: true, max_tokens: 10, stream_interval: 8, request_id: {$absent: true}, stream_options: {$absent: true}, messages: [{role: user, content: hi}]}}}
    expect:
    # engine interval 1 (no knob): max(8, 1) = 8, so tokens 1, 2-9, 10: 3 content chunks after the role chunk
    - "size(steps.si8.result.value.items.filter(ev, has(ev.choices) && size(ev.choices) > 0 && !has(ev.choices[0].delta.role))) == 3"
  - id: bench-l5-1-d-usage
    fixtures: [full-tp1-llama-8b]
    max_events: 200000
    flow: serving-api-chat-stream
    input: {path: /v1/chat/completions, headers: {$absent: true}, body: {stream: true, max_tokens: 10, request_id: {$absent: true}, stream_options: {include_usage: true, continuous_usage_stats: true}, messages: [{role: user, content: hi}]}}
    expect:
    - "result.value.items.filter(ev, has(ev.choices)).all(ev, has(ev.usage))"
    - "result.value.items[0].usage.completion_tokens == 0 && result.value.items[0].usage.total_tokens == result.value.items[0].usage.prompt_tokens && result.value.items[0].usage.prompt_tokens > 0"
    - "result.value.items[0].choices[0].delta.role == 'assistant'"
    - "result.value.items[size(result.value.items) - 2].usage.completion_tokens == 10"
  - id: bench-l5-1-e-done-and-validation
    fixtures: [full-tp1-llama-8b]
    max_events: 200000
    steps:
    - {as: ok, flow: serving-api-chat-stream, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {stream: true, max_tokens: 3, request_id: {$absent: true}, stream_options: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {as: zero, flow: serving-api-chat-stream, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {stream: true, max_tokens: 3, stream_interval: 0, request_id: {$absent: true}, stream_options: {$absent: true}, messages: [{role: user, content: hi}]}}}
    expect:
    - "steps.ok.result.value.items[size(steps.ok.result.value.items) - 1].data == '[DONE]'"
    - "!steps.zero.result.ok && steps.zero.result.error.status == 400"
    - "steps.zero.result.error.code == 'Bad Request'"
    - "steps.zero.result.error.data.param == 'body.stream_interval'"
    - "steps.zero.result.error.message.contains('greater_than_equal')"
