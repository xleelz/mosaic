schema_version: 1
id: vllm
scenarios:
- id: bench-p5-2-a-default-v2
  flow: wr-init-device
  fixtures: &id001
  - full-tp1-llama-8b
  state:
    gpu-memory@rank0:
      weights_bytes: 0
  expect:
  - result.ok && result.value.runner == 'v2'
  - calls['gpu-model-runner.init'] == 1
  - config['use-v2-model-runner'] == true
- id: bench-p5-2-b-suffix-no-arctic
  fixtures: *id001
  steps:
  - interface: engine-args.create-speculative-config
    caller: operator
    input:
      speculative_config:
        method: suffix
      target_max_model_len: 131072
      target_tensor_parallel_size: 1
    as: s
  expect:
  - '!steps.s.result.ok && steps.s.result.error.message == ''Arctic Inference is required for suffix decoding. Install via `pip install arctic-inference==0.1.1`.'''
- id: bench-p5-2-b-suffix-with-arctic
  flow: wr-init-device
  fixtures: *id001
  config:
    speculative-method: suffix
  state:
    gpu-memory@rank0:
      weights_bytes: 0
  expect:
  - result.ok && result.value.runner == 'v1'
  - calls['gpu-model-runner.init'] == 0
  - warnings.exists(w, w.contains("Model Runner V2 does not yet support speculative method 'suffix'")) || trace.exists(e, e.type == 'note' && e.title.contains('does not yet support'))
- id: bench-p5-2-c-forced-v2-suffix
  fixtures: *id001
  config:
    speculative-method: suffix
    use-v2-model-runner: true
    num-speculative-tokens: 24
  steps:
  - interface: spec-decode.init-speculator
    caller: gpu-model-runner
    input:
      method: suffix
    as: s
  expect:
  - '!steps.s.result.ok && steps.s.result.error.code == ''not-implemented-error'' && steps.s.result.error.message == ''suffix is not supported yet.'''
- id: bench-p5-2-c-forced-v2-flow
  flow: wr-init-device
  fixtures: *id001
  config:
    speculative-method: suffix
    use-v2-model-runner: true
  state:
    gpu-memory@rank0:
      weights_bytes: 0
  expect:
  - '!result.ok && result.error.code == ''not-implemented-error'' && result.error.message == ''suffix is not supported yet.'''
  - calls['spec-decode.init-speculator'] == 1
  - size(warnings) == 0
- id: bench-p5-2-d-custom-class
  fixtures: *id001
  steps:
  - interface: engine-args.create-speculative-config
    caller: operator
    input:
      speculative_config:
        model: my_pkg.MyProposer
        num_speculative_tokens: 2
      target_max_model_len: 131072
      target_tensor_parallel_size: 1
    as: s
  expect:
  - steps.s.result.ok && steps.s.result.value.method == 'custom_class'
