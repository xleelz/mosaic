schema_version: 1
id: vllm
# --max-loras is a config; --lora-modules is not a knob, so adapters load through load-lora-adapter.
scenarios:
  - id: bench-l5-3-a-gauge-exists
    fixtures: [full-tp1-llama-8b, lora-adapter-on-disk]
    config: {enable-lora: true, max-loras: 1}
    steps:
    - {as: init, interface: stat-logger-manager.init-prometheus, caller: engine-core, input: {engine_indexes: [0]}}
    - {as: load, interface: openai-serving-models.load-lora-adapter, caller: api-server, input: {lora_name: sql, lora_path: /models/lora/sql-adapter}}
    - {as: chat, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {model: sql, max_tokens: 2, stream: false, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {as: m, interface: instrumentator-metrics.get-metrics, caller: api-client, input: {path: /metrics}}
    expect:
    - "steps.chat.result.ok"
    - "steps.m.result.value.metrics.exists(x, x.name == 'vllm:lora_requests_info')"
    # (b)-(d) read the same series: running_lora_adapters="sql", waiting_lora_adapters="sql", max_lora="1"
    - "steps.m.result.value.metrics.exists(x, x.name == 'vllm:lora_requests_info' && x.series.contains('running_lora_adapters=\"\"') && x.series.contains('max_lora=\"1\"'))"
    - "trace.exists(e, e.type == 'call.start' && e.interface == 'lora-stats.update')"
