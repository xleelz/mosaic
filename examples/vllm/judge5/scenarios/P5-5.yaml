schema_version: 1
id: vllm
scenarios:
- id: bench-p5-5-a-embed
  fixtures: &id001
  - full-tp1-llama-8b
  config: &id002
    runner: pooling
  state: &id003
    gpu-model-runner: &id005
      is_pooling_model: true
    gpu-worker-impl: &id006
      is_pooling_model: true
  steps:
  - interface: dispatch-pooler.for-embedding
    caller: gpu-model-runner
    input: {}
    as: dp
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        e: 8
      total_num_scheduled_tokens: 8
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        pooling_params:
          task: embed
        prompt_token_ids: &id004
        - 128000
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 17
        req_id: e
    as: e
  expect:
  - steps.dp.result.value.supported_tasks == ['token_embed', 'embed'] && steps.dp.result.value.seq_pooling_type == 'LAST'
  - steps.e.result.value.pooler_output[0].task == 'embed' && steps.e.result.value.pooler_output[0].dim == 4096 && steps.e.result.value.pooler_output[0].normalized == true
  - trace.exists(e, e.type == 'call.end' && e.interface == 'sequence-pooling-method.forward' && e.output.token_indices == [7])
  - calls['sampler.sample'] == 0 && calls['llama-for-causal-lm.compute-logits'] == 0
  - has(steps.e.result.value.pooler_output[0].dtype) && steps.e.result.value.pooler_output[0].dtype == 'float32'
- id: bench-p5-5-b-no-activation
  fixtures: *id001
  config: *id002
  state: *id003
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        e: 8
      total_num_scheduled_tokens: 8
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        pooling_params:
          task: embed
          use_activation: false
        prompt_token_ids: *id004
        req_id: e
    as: e
  expect:
  - steps.e.result.value.pooler_output[0].normalized == false && steps.e.result.value.pooler_output[0].dim == 4096
