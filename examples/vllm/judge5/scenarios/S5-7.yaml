schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-7-a-uuid-collision
    fixtures: [full-vl-qwen2-vl-7b]
    config: {enable-prompt-tokens-details: true}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {url: 'data:image/png;base64,XXXX'}, uuid: img-1}, {type: text, text: describe}]}]}}, as: r1}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {url: 'data:image/png;base64,YYYY'}, uuid: img-1}, {type: text, text: describe}]}]}}, as: r2}
    expect:
      - "steps.r1.result.ok && steps.r2.result.ok"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'lru-key-replicated-sender-cache.get-and-update' && x.input.mm_hash == 'img-1').size() == 2"
      - "trace.filter(x, x.type == 'call.end' && x.interface in ['lru-key-replicated-sender-cache.get-and-update', 'multi-modal-processor-only-cache.get-and-update'] && x.output.hit).size() == 1"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'base-processing-info.get-hf-processor').size() == 1"
      - "steps.r2.result.value.usage.prompt_tokens_details.cached_tokens >= 16"
  - id: bench-s5-7-a-other-uuid-control
    fixtures: [full-vl-qwen2-vl-7b]
    config: {enable-prompt-tokens-details: true}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {url: 'data:image/png;base64,XXXX'}, uuid: img-1}, {type: text, text: describe}]}]}}, as: r1}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {url: 'data:image/png;base64,YYYY'}, uuid: img-2}, {type: text, text: describe}]}]}}, as: r2}
    expect:
      - "steps.r2.result.value.usage.prompt_tokens_details.cached_tokens < steps.r2.result.value.usage.prompt_tokens - 16"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'base-processing-info.get-hf-processor').size() == 2"
  - id: bench-s5-7-b-null-with-uuid
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {url: 'data:image/png;base64,XXXX'}, uuid: img-1}, {type: text, text: describe}]}]}}, as: r1}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {$null: true}, uuid: img-1}, {type: text, text: describe}]}]}}, as: r3}
    expect:
      - "steps.r1.result.ok && steps.r3.result.ok"
      - "trace.filter(x, x.type == 'call.end' && x.interface in ['lru-key-replicated-sender-cache.get-and-update', 'multi-modal-processor-only-cache.get-and-update'] && x.output.hit).size() == 1"
  - id: bench-s5-7-c-miss-without-data
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {$null: true}, uuid: img-9}, {type: text, text: describe}]}]}}, as: r4}
    expect:
      - "!steps.r4.result.ok && steps.r4.result.error.status == 400 && steps.r4.result.error.code == 'BadRequestError' && steps.r4.result.error.message == 'Cache miss for image at index 0 but data is not provided.'"
  - id: bench-s5-7-d-metrics
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {url: 'data:image/png;base64,XXXX'}, uuid: img-1}, {type: text, text: describe}]}]}}, as: r1}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: qwen2-vl-7b, max_tokens: 2, messages: [{role: user, content: [{type: image_url, image_url: {url: 'data:image/png;base64,YYYY'}, uuid: img-1}, {type: text, text: describe}]}]}}, as: r2}
    expect:
      - "steps.r1.result.ok && steps.r2.result.ok"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'stat-logger-manager.record-prometheus' && has(x.input.mm_cache_stats) && x.input.mm_cache_stats != null).size() >= 1"
      - "trace.exists(x, x.type == 'call.start' && x.interface == 'prometheus-registry.incr' && x.input.name == 'vllm:mm_cache_queries')"
      - "trace.exists(x, x.type == 'call.start' && x.interface == 'prometheus-registry.incr' && x.input.name == 'vllm:mm_cache_hits')"
