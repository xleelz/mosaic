schema_version: 1
id: vllm
scenarios:
- id: bench-p5-4-a-positions
  fixtures: &id001
  - full-vl-qwen2-vl-7b
  steps:
  - interface: qwen2-vl-for-conditional-generation.get-mrope-input-positions
    caller: gpu-worker
    input:
      mm_features:
      - offset: 15
        modality: image
        grid_thw:
        - 1
        - 40
        - 80
      num_input_tokens: 825
    as: m
  expect:
  - size(steps.m.result.value.positions[0]) == 825
  - steps.m.result.value.positions[0].slice(0, 15) == lists.range(15) && steps.m.result.value.positions[1].slice(0, 15) == lists.range(15) && steps.m.result.value.positions[2].slice(0, 15) == lists.range(15)
  - steps.m.result.value.positions[0].slice(15, 815).all(x, x == 15)
  - steps.m.result.value.positions[1][15] == 15 && steps.m.result.value.positions[1][55] == 16 && steps.m.result.value.positions[1][814] == 34
  - steps.m.result.value.positions[2].slice(15, 55) == lists.range(40).map(i, i + 15)
  - steps.m.result.value.positions[0].slice(815, 825) == lists.range(10).map(i, i + 55) && steps.m.result.value.positions[1].slice(815, 825) == lists.range(10).map(i, i + 55) && steps.m.result.value.positions[2].slice(815,
    825) == lists.range(10).map(i, i + 55)
- id: bench-p5-4-b-delta
  fixtures: *id001
  steps:
  - interface: qwen2-vl-for-conditional-generation.get-mrope-input-positions
    caller: gpu-worker
    input:
      mm_features:
      - offset: 15
        modality: image
        grid_thw:
        - 1
        - 40
        - 80
      num_input_tokens: 825
    as: m
  expect:
  - steps.m.result.value.mrope_position_delta == -760
- id: bench-p5-4-b-decode-position
  fixtures: *id001
  steps:
  - interface: rope-state.prepare-positions
    caller: gpu-model-runner
    input:
      num_tokens: 1
      req_idx: 0
      num_computed_tokens: 825
      prefill_lens: 825
      delta: -760
    as: p
  expect:
  - steps.p.result.ok && type(steps.p.result.value) == map && has(steps.p.result.value.positions) && steps.p.result.value.positions == [[65],[65],[65]]
- id: bench-p5-4-c-storage
  fixtures: *id001
  steps:
  - interface: gpu-model-runner.init
    caller: gpu-worker
    input: {}
    as: i
  expect:
  - has(state['rope-state@rank0'].prefill_positions) && state['rope-state@rank0'].prefill_positions.shape == [3072, 32768] && state['rope-state@rank0'].prefill_positions.bytes == 402653184
  - trace.exists(e, e.type == 'call.start' && e.interface == 'qwen2-vl-for-conditional-generation.get-mrope-input-positions')
