- id: bench-p5-4-d-two-images
  fixtures: *id001
  steps:
  - interface: qwen2-vl-for-conditional-generation.get-mrope-input-positions
    caller: gpu-worker
    input:
      mm_features:
      - offset: 15
        modality: image
        grid_thw:
        - 1
        - 40
        - 80
      - offset: 820
        modality: image
        grid_thw:
        - 1
        - 40
        - 80
      num_input_tokens: 1630
    as: m
  expect:
  - steps.m.result.value.positions[0].slice(815, 820) == lists.range(5).map(i, i + 55)
  - steps.m.result.value.positions[0].slice(820, 1620).all(x, x == 60)
  - steps.m.result.value.positions[1][820] == 60 && steps.m.result.value.positions[1][1619] == 79
  - steps.m.result.value.positions[2].slice(820, 860) == lists.range(40).map(i, i + 60)
