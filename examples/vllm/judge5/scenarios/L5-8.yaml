schema_version: 1
id: vllm
scenarios:
  - id: bench-l5-8-a-check-health
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {vllm-server-dev-mode: true}
    steps:
    - {as: rpc, interface: dev-rpc-router.post-collective-rpc, caller: api-client, input: {path: /collective_rpc, body: {method: check_health}}}
    expect:
    - "steps.rpc.result.ok && steps.rpc.result.value.results == [null, null]"
    - "trace.filter(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.check-health').size() == 2"
    - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-core.collective-rpc') && trace.exists(e, e.type == 'call.start' && e.interface == 'multiproc-executor.collective-rpc')"
  - id: bench-l5-8-b-no-method
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {vllm-server-dev-mode: true}
    steps:
    - {as: nomethod, interface: dev-rpc-router.post-collective-rpc, caller: api-client, input: {path: /collective_rpc, body: {}}}
    expect:
    - "steps.nomethod.result.error.status == 400 && steps.nomethod.result.error.code == 'Bad Request' && steps.nomethod.result.error.message == \"Missing 'method' in request body\""
  - id: bench-l5-8-b-list-body
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {vllm-server-dev-mode: true}
    steps:
    - {as: lst, interface: dev-rpc-router.post-collective-rpc, caller: api-client, input: {path: /collective_rpc, body: []}}
    expect:
    - "steps.lst.result.error.status == 400 && steps.lst.result.error.code == 'Bad Request' && steps.lst.result.error.message == 'Request body must be a JSON object'"
  - id: bench-l5-8-b-malformed
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {vllm-server-dev-mode: true}
    steps:
    - {as: bad, interface: dev-rpc-router.post-collective-rpc, caller: api-client, input: {path: /collective_rpc, body: "{not json"}}
    expect:
    - "steps.bad.result.error.status == 400 && steps.bad.result.error.code == 'Bad Request' && steps.bad.result.error.message.startsWith('JSON decode error: ')"
  - id: bench-l5-8-c-list-loras
    fixtures: [full-tp1-llama-8b, lora-adapter-on-disk]
    config: {vllm-server-dev-mode: true, enable-lora: true}
    steps:
    - {as: load, interface: openai-serving-models.load-lora-adapter, caller: api-server, input: {lora_name: sql, lora_path: /models/lora/sql-adapter}}
    - {as: rpc, interface: dev-rpc-router.post-collective-rpc, caller: api-client, input: {path: /collective_rpc, body: {method: list_loras}}}
    expect:
    - "steps.load.result.ok"
    - "steps.rpc.result.value.results == ['{1}']"
  - id: bench-l5-8-d-reset-mm
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {vllm-server-dev-mode: true}
    steps:
    - {as: rmm, interface: dev-cache-router.post-reset-mm-cache, caller: api-client, input: {path: /reset_mm_cache}}
    expect:
    - "steps.rmm.result.ok && steps.rmm.result.value.status_code == 200"
    - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.reset-mm-cache')"
    - "trace.exists(e, e.type == 'note' && e.title.contains('Resetting multi-modal cache...'))"
  - id: bench-l5-8-d-no-dev-mode
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {vllm-server-dev-mode: false}
    steps:
    - {as: rmm, interface: dev-cache-router.post-reset-mm-cache, caller: api-client, input: {path: /reset_mm_cache}}
    - {as: rpc, interface: dev-rpc-router.post-collective-rpc, caller: api-client, input: {path: /collective_rpc, body: {method: check_health}}}
    expect:
    - "steps.rmm.result.error.status == 404 && steps.rpc.result.error.status == 404"
    - "calls['async-llm.reset-mm-cache'] == 0 && calls['async-llm.collective-rpc'] == 0"
