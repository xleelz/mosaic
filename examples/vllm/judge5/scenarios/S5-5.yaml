schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-5-a-regex-auto
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {regex: '[0-9]{3}-[0-9]{4}'}}}, as: r}
    expect:
      - "steps.r.result.ok && trace.filter(x, x.type == 'call.start' && x.interface == 'structured-output-manager.grammar-init').exists(x, x.input.backend == 'xgrammar')"
      - "steps.r.result.value.choices[0].message.content.matches('^[0-9]{3}-[0-9]{4}$')"
  - id: bench-s5-5-a-regex-xgrammar-bad
    fixtures: [full-tp1-llama-8b]
    config: {structured-outputs-backend: xgrammar}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {regex: '('}}}, as: b}
    expect:
      - "!steps.b.result.ok && steps.b.result.error.status == 400 && steps.b.result.error.message.startsWith('Failed to transform regex into a grammar: ')"
  - id: bench-s5-5-b-auto-fallbacks
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {json: {type: array, items: {type: integer}, uniqueItems: true}}}}, as: u}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {json: {type: object, patternProperties: {'^x': {type: string}}}}}}, as: p}
    expect:
      - "steps.u.result.ok && trace.filter(x, x.type == 'call.start' && x.interface == 'structured-output-manager.grammar-init').exists(x, x.input.request_id == steps.u.result.value.id && x.input.backend == 'guidance')"
      - "steps.p.result.ok && trace.filter(x, x.type == 'call.start' && x.interface == 'structured-output-manager.grammar-init').exists(x, x.input.backend == 'outlines')"
  - id: bench-s5-5-b-xgrammar-unsupported
    fixtures: [full-tp1-llama-8b]
    config: {structured-outputs-backend: xgrammar}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {json: {type: array, items: {type: integer}, uniqueItems: true}}}}, as: u}
    expect:
      - "!steps.u.result.ok && steps.u.result.error.status == 400 && steps.u.result.error.message == 'The provided JSON schema contains features not supported by xgrammar.'"
  - id: bench-s5-5-c-constraint-count
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {regex: 'a+', choice: [x]}}}, as: rc}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {regex: 'a+', grammar: 'root ::= "a"'}}}, as: rg}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {}}}, as: e}
    expect:
      - "!steps.rc.result.ok && steps.rc.result.error.status == 400 && steps.rc.result.error.message == \"You can only use one kind of constraints for structured outputs ('json', 'regex' or 'choice').\""
      - "!steps.rg.result.ok && steps.rg.result.error.status == 400 && steps.rg.result.error.message.startsWith('You can only use one kind of structured outputs constraint but multiple are specified: ')"
      - "!steps.e.result.ok && steps.e.result.error.status == 400 && steps.e.result.error.message.startsWith('You must use one kind of structured outputs constraint but none are specified: ')"
  - id: bench-s5-5-d-response-format
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, response_format: {type: json_object}}}, as: j}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, response_format: {type: json_object}, structured_outputs: {regex: 'a+'}}}, as: jr}
    expect:
      - "steps.j.result.ok && trace.filter(x, x.type == 'call.start' && x.interface == 'structured-output-manager.grammar-init').exists(x, x.input.request_type == 'json_object')"
      - "!steps.jr.result.ok && steps.jr.result.error.status == 400 && steps.jr.result.error.message.startsWith('You can only use one kind of structured outputs constraint but multiple are specified: ')"
  - id: bench-s5-5-d-json-schema-missing
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, response_format: {type: json_schema}}}, as: js}
    expect:
      - "!steps.js.result.ok && steps.js.result.error.status == 400 && steps.js.result.error.data.param == 'response_format' && steps.js.result.error.message == \"When response_format type is 'json_schema', the 'json_schema' field must be provided. (parameter=response_format)\""
  - id: bench-s5-5-e-choice-grammar
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {choice: ['yes', 'no']}}}, as: c}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {choice: []}}}, as: ce}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 4, structured_outputs: {grammar: ''}}}, as: g}
    expect:
      - "steps.c.result.ok && trace.filter(x, x.type == 'call.start' && x.interface == 'structured-output-manager.grammar-init').exists(x, x.input.request_type == 'grammar')"
      - "steps.c.result.value.choices[0].message.content in ['yes', 'no']"
      - "!steps.ce.result.ok && steps.ce.result.error.status == 400 && steps.ce.result.error.message == \"Choice '[]' cannot be an empty list\""
      - "!steps.g.result.ok && steps.g.result.error.status == 400 && steps.g.result.error.message == 'structured_outputs.grammar cannot be an empty string'"
