schema_version: 1
id: vllm
scenarios:
- id: bench-p5-3-a-capture-cases
  fixtures: &id001
  - full-tp1-llama-8b
  - lora-adapter-on-disk
  config: &id002
    enable-lora: true
    max-loras: 2
  steps:
  - interface: cuda-graph-manager.init
    caller: gpu-model-runner
    input:
      decode_query_len: 1
    as: i
  expect:
  - has(state['cuda-graph-manager@rank0'].lora_capture_cases) && state['cuda-graph-manager@rank0'].lora_capture_cases == [0, 3]
- id: bench-p5-3-a-specialized
  fixtures: *id001
  config:
    enable-lora: true
    max-loras: 4
  steps:
  - interface: cuda-graph-manager.init
    caller: gpu-model-runner
    input:
      decode_query_len: 1
    as: i
  expect:
  - has(state['cuda-graph-manager@rank0'].lora_capture_cases) && state['cuda-graph-manager@rank0'].lora_capture_cases == [0, 1, 2, 4, 5]
- id: bench-p5-3-b-lru
  fixtures: *id001
  config: *id002
  state:
    local-disk:
      files: &id003
        /models/lora/a1/adapter_config.json: &id004
          json:
            r: 16
            lora_alpha: 32
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
        /models/lora/a2/adapter_config.json: &id005
          json:
            r: 16
            lora_alpha: 32
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
        /models/lora/a3/adapter_config.json: &id006
          json:
            r: 16
            lora_alpha: 32
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
        /models/lora/a4/adapter_config.json: &id007
          json:
            r: 16
            lora_alpha: 32
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
        /models/lora/a1/adapter_model.safetensors: &id008
          size: 54525952
        /models/lora/a2/adapter_model.safetensors: &id009
          size: 54525952
        /models/lora/a3/adapter_model.safetensors: &id010
          size: 54525952
        /models/lora/a4/adapter_model.safetensors: &id011
          size: 54525952
  steps:
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 1
      lora_name: a1
      lora_path: /models/lora/a1
    as: a1
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 2
      lora_name: a2
      lora_path: /models/lora/a2
    as: a2
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 3
      lora_name: a3
      lora_path: /models/lora/a3
    as: a3
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 4
      lora_name: a4
      lora_path: /models/lora/a4
    as: a4
  - interface: lru-cache-lora-model-manager.list-adapters
    caller: gpu-worker
    input: {}
    as: ls
  expect:
  - steps.a4.result.ok && state['lru-cache-lora-model-manager@rank0'].registered == [3, 4]
  - trace.exists(e, e.type == 'call.end' && e.interface == 'lru-cache-lora-model-manager.add-adapter' && e.output.evicted == 1)
  - trace.exists(e, e.type == 'call.end' && e.interface == 'lru-cache-lora-model-manager.add-adapter' && e.output.evicted == 2)
  - trace.filter(e, e.type == 'call.start' && (e.interface == 'lru-cache-worker-lora-manager.load-adapter' || e.interface == 'lru-cache-lora-model-manager.add-adapter')).map(e, e.interface.split('.')[1])
    == ['load-adapter','add-adapter','load-adapter','add-adapter','load-adapter','add-adapter','load-adapter','add-adapter']
- id: bench-p5-3-b-bad-load-keeps-cache
  fixtures: *id001
  config: *id002
  state:
    local-disk:
      files: *id003
  steps:
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 1
      lora_name: a1
      lora_path: /models/lora/a1
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 2
      lora_name: a2
      lora_path: /models/lora/a2
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 3
      lora_name: a3
      lora_path: /models/lora/none
    as: bad
  expect:
  - '!steps.bad.result.ok && steps.bad.result.error.code == ''lora-adapter-not-found-error'''
  - state['lru-cache-lora-model-manager@rank0'].registered == [1, 2]
- id: bench-p5-3-b-three-in-batch
  fixtures: *id001
  config: *id002
  state:
    local-disk:
      files: *id003
  steps:
  - interface: lru-cache-worker-lora-manager.set-active-adapters
    caller: gpu-worker
    input:
      requests:
      - lora_int_id: 1
        lora_name: a1
        lora_path: /models/lora/a1
      - lora_int_id: 2
        lora_name: a2
        lora_path: /models/lora/a2
      - lora_int_id: 3
        lora_name: a3
        lora_path: /models/lora/a3
    as: s
  expect:
  - '!steps.s.result.ok && steps.s.result.error.message == ''Number of requested LoRAs (3) is greater than the number of GPU LoRA slots (2).'''
  - calls['lru-cache-worker-lora-manager.add-adapter'] == 0
- id: bench-p5-3-c-scaling
  fixtures: *id001
  config: *id002
  state:
    local-disk:
      files:
        /models/lora/a1/adapter_config.json: *id004
        /models/lora/a2/adapter_config.json: *id005
        /models/lora/a3/adapter_config.json: *id006
        /models/lora/a4/adapter_config.json: *id007
        /models/lora/a1/adapter_model.safetensors: *id008
        /models/lora/a2/adapter_model.safetensors: *id009
        /models/lora/a3/adapter_model.safetensors: *id010
        /models/lora/a4/adapter_model.safetensors: *id011
        /models/lora/rs/adapter_config.json:
          json:
            r: 16
            lora_alpha: 32
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
            use_rslora: true
        /models/lora/rs/adapter_model.safetensors:
          size: 54525952
  steps:
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 1
      lora_name: sql
      lora_path: /models/lora/sql-adapter
    as: plain
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 2
      lora_name: rs
      lora_path: /models/lora/rs
    as: rs
  expect:
  - trace.exists(e, e.type == 'call.end' && e.interface == 'lru-cache-worker-lora-manager.load-adapter' && e.input.lora_int_id == 1 && has(e.output.scaling_factor) && e.output.scaling_factor == 2.0)
  - trace.exists(e, e.type == 'call.end' && e.interface == 'lru-cache-worker-lora-manager.load-adapter' && e.input.lora_int_id == 2 && has(e.output.scaling_factor) && e.output.scaling_factor == 8.0)
  - trace.exists(e, e.type == 'note' && e.title.contains('Loading LoRA weights trained with rsLoRA.'))
- id: bench-p5-3-d-rank-pattern-high
  fixtures: *id001
  config: *id002
  state:
    local-disk:
      files: &id012
        /models/lora/a1/adapter_config.json: *id004
        /models/lora/a2/adapter_config.json: *id005
        /models/lora/a3/adapter_config.json: *id006
        /models/lora/a4/adapter_config.json: *id007
        /models/lora/a1/adapter_model.safetensors: *id008
        /models/lora/a2/adapter_model.safetensors: *id009
        /models/lora/a3/adapter_model.safetensors: *id010
        /models/lora/a4/adapter_model.safetensors: *id011
        /models/lora/rp/adapter_config.json:
          json:
            r: 16
            lora_alpha: 32
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
            rank_pattern:
              q_proj: 32
        /models/lora/rp/adapter_model.safetensors:
          size: 54525952
        /models/lora/rz/adapter_config.json:
          json:
            r: 16
            lora_alpha: 32
            target_modules:
            - q_proj
            - k_proj
            - v_proj
            - o_proj
            base_model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
            rank_pattern:
              q_proj: 0
        /models/lora/rz/adapter_model.safetensors:
          size: 54525952
  steps:
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 1
      lora_name: rp
      lora_path: /models/lora/rp
    as: s
  expect:
  - '!steps.s.result.ok && steps.s.result.error.message == ''LoRA rank 32 is greater than max_lora_rank 16.'''
- id: bench-p5-3-d-rank-pattern-zero
  fixtures: *id001
  config: *id002
  state:
    local-disk:
      files: *id012
  steps:
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 1
      lora_name: rz
      lora_path: /models/lora/rz
    as: s
  expect:
  - '!steps.s.result.ok && steps.s.result.error.message == ''LoRA rank for `q_proj` in `rank_pattern` must be a positive integer, got 0.'''
- id: bench-p5-3-e-missing-fields
  fixtures: *id001
  config: *id002
  state:
    local-disk:
      files:
        /models/lora/a1/adapter_config.json: *id004
        /models/lora/a2/adapter_config.json: *id005
        /models/lora/a3/adapter_config.json: *id006
        /models/lora/a4/adapter_config.json: *id007
        /models/lora/a1/adapter_model.safetensors: *id008
        /models/lora/a2/adapter_model.safetensors: *id009
        /models/lora/a3/adapter_model.safetensors: *id010
        /models/lora/a4/adapter_model.safetensors: *id011
        /models/lora/nt/adapter_config.json:
          json:
            r: 16
            lora_alpha: 32
        /models/lora/nt/adapter_model.safetensors:
          size: 54525952
  steps:
  - interface: lru-cache-worker-lora-manager.add-adapter
    caller: gpu-worker
    input:
      lora_int_id: 1
      lora_name: nt
      lora_path: /models/lora/nt
    as: s
  expect:
  - '!steps.s.result.ok && steps.s.result.error.message == "Missing required configuration fields: {''target_modules''}"'
