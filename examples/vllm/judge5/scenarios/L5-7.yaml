schema_version: 1
id: vllm
scenarios:
  - id: bench-l5-7-a-b-d-nonstream
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
    - {as: before, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {max_tokens: 3, n: 1, stream: false, seed: 1, temperature: 0.8, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {as: m0, interface: prometheus-registry.collect, caller: api-server}
    - {as: par, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {max_tokens: 3, n: 3, seed: 7, temperature: 0.8, stream: false, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {as: m1, interface: prometheus-registry.collect, caller: api-server}
    - {as: s7, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {max_tokens: 3, n: 1, seed: 7, temperature: 0.8, stream: false, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {as: s9, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {max_tokens: 3, n: 1, seed: 9, temperature: 0.8, stream: false, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}}
    expect:
    - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-mp-client.add-request-async' && e.input.request_id.matches('^[0-9]_')).map(e, e.input.request_id.substring(0,1)) == ['0','1','2']"
    - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-mp-client.add-request-async' && e.input.request_id.matches('^[0-9]_')).all(e, e.input.sampling_params.n == 1)"
    - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-mp-client.add-request-async' && e.input.request_id.matches('^[0-9]_')).map(e, e.input.sampling_params.seed) == [7, 8, 9]"
    - "steps.par.result.value.choices.map(c, c.index) == [0, 1, 2]"
    - "steps.par.result.value.choices[0].message.content == steps.s7.result.value.choices[0].message.content"
    - "steps.par.result.value.choices[2].message.content == steps.s9.result.value.choices[0].message.content"
    - "steps.par.result.value.choices[0].message.content != steps.par.result.value.choices[2].message.content"
    # (d) one parent with n=3, from the registry before and after
    - "int(steps.m1.result.value.filter(x, x.name == 'vllm:request_success' && x.series.contains('length'))[0].value) - int(steps.m0.result.value.filter(x, x.name == 'vllm:request_success' && x.series.contains('length'))[0].value) == 3"
    - "int(steps.m1.result.value.filter(x, x.name == 'vllm:e2e_request_latency_seconds')[0].value['count']) - int(steps.m0.result.value.filter(x, x.name == 'vllm:e2e_request_latency_seconds')[0].value['count']) == 3"
    - "int(steps.m1.result.value.filter(x, x.name == 'vllm:request_params_n')[0].value['count']) - int(steps.m0.result.value.filter(x, x.name == 'vllm:request_params_n')[0].value['count']) == 1"
    - "double(steps.m1.result.value.filter(x, x.name == 'vllm:request_params_n')[0].value['sum']) - double(steps.m0.result.value.filter(x, x.name == 'vllm:request_params_n')[0].value['sum']) == 3.0"
    - "int(steps.m1.result.value.filter(x, x.name == 'vllm:request_max_num_generation_tokens')[0].value['count']) - int(steps.m0.result.value.filter(x, x.name == 'vllm:request_max_num_generation_tokens')[0].value['count']) == 1"
    - "double(steps.m1.result.value.filter(x, x.name == 'vllm:request_max_num_generation_tokens')[0].value['sum']) - double(steps.m0.result.value.filter(x, x.name == 'vllm:request_max_num_generation_tokens')[0].value['sum']) == 3.0"
  - id: bench-l5-7-c-stream
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    flow: serving-api-chat-stream
    input: {path: /v1/chat/completions, headers: {$absent: true}, body: {max_tokens: 3, n: 3, seed: 7, temperature: 0.8, stream: true, stream_options: {$absent: true}, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}
    expect:
    - "result.value.items.filter(ev, has(ev.choices) && size(ev.choices) > 0 && has(ev.choices[0].delta.role)).map(ev, ev.choices[0].index) == [0, 1, 2]"
    - "result.value.items.filter(ev, has(ev.choices) && size(ev.choices) > 0 && ev.choices[0].finish_reason != null).map(ev, ev.choices[0].index).exists(i, i == 2)"
    - "size(result.value.items.filter(ev, has(ev.choices) && size(ev.choices) > 0 && ev.choices[0].finish_reason != null)) == 3"
    - "[0, 1, 2].all(i, size(result.value.items.filter(ev, has(ev.choices) && size(ev.choices) > 0 && ev.choices[0].index == i)) == 4)"
