schema_version: 1
id: vllm
scenarios:
  - id: bench-l5-5-gen
    fixtures: [full-tp1-llama-8b]
    state: {engine-core-proc: {client_kind: sync}}
    steps:
    - {as: embed, caller: python-user, interface: llm.embed, input: {prompts: [hi]}}
    - {as: score, caller: python-user, interface: llm.score, input: {data_1: q, data_2: [d]}}
    expect:
    - "steps.embed.result.error.message == 'LLM.encode() is only supported for pooling models. Try passing `--runner pooling` to use the model as a pooling model.'"
    - "steps.score.result.error.message == 'LLM.score() is only supported for pooling models. Try passing `--runner pooling` to use the model as a pooling model.'"
    - "calls['llm-engine.add-request'] == 0 && calls['llm.encode'] == 1"
  - id: bench-l5-5-pool
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      engine-core-proc: {client_kind: sync}
      llm: {supported_tasks: [embed, token_embed]}
    steps:
    - {as: gen, caller: python-user, interface: llm.generate, input: {prompts: [hi]}}
    - {as: enq, caller: python-user, interface: llm.enqueue, input: {prompts: [hi]}}
    - {as: cls, caller: python-user, interface: llm.classify, input: {prompts: [hi]}}
    - {as: tok, caller: python-user, interface: llm.encode, input: {prompts: [hi], pooling_task: token_embed}}
    - {as: nt, caller: python-user, interface: llm.encode, input: {prompts: [hi]}}
    - {as: emb, caller: python-user, interface: llm.embed, input: {prompts: [a, b, c]}}
    - {as: sc, caller: python-user, interface: llm.score, input: {data_1: q, data_2: [d1, d2]}}
    - {as: sco, caller: python-user, interface: llm.score, input: {data_1: q, data_2: [d1, d2], pooling_params: {task: classify}}}
    expect:
    - "steps.gen.result.error.message == 'LLM.generate() is only supported for generative models. Try passing `--runner generate` to use the model as a generative model.'"
    - "steps.enq.result.error.message == 'LLM.enqueue() is only supported for generative models.'"
    - "steps.cls.result.error.message == 'Classification API is not supported by this model. Try converting the model using `--convert classify`.'"
    - "steps.tok.result.error.message == 'Try switching the model\\'s pooling_task via `PoolerConfig(task=\"token_embed\")`'"
    - "steps.nt.result.error.message.contains('pooling_task required for `LLM.encode`.') && steps.nt.result.error.message.contains('LLM.embed(...)')"
    - "steps.emb.result.ok && steps.emb.result.value.num_outputs == 3"
    - "size(steps.emb.result.value.outputs) == 3 && steps.emb.result.value.outputs.all(o, size(o.outputs.data) == 4096)"
    - "steps.sc.result.ok && steps.sc.result.value.num_scores == 2"
    - "steps.sco.result.error.message == 'You cannot overwrite pooling_params.task=\\'classify\\' with pooling_task=\\'embed\\'!'"
