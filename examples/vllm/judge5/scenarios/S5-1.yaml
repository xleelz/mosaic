schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-1-a-start
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    steps:
      - {flow: config-create-engine-config, as: cfg}
      - {interface: gpu-model-runner.get-supported-tasks, caller: gpu-worker-impl, on: rank0, input: {}, as: tasks}
      - {interface: pooling-factories.get-pooling-task, caller: api-server, input: {}, as: pt}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.runner_type == 'pooling' && steps.cfg.result.value.model_config.convert_type == 'embed'"
      - "ctx.convert_auto_log == 'Resolved `--convert auto` to `--convert embed`. Pass the value explicitly to silence this message.'"
      - "steps.cfg.result.value.model_config.pooler_config.seq_pooling_type == 'LAST' && steps.cfg.result.value.model_config.pooler_config.tok_pooling_type == 'ALL'"
      - "steps.cfg.result.value.cache_config.enable_prefix_caching && steps.cfg.result.value.scheduler_config.enable_chunked_prefill"
      - "steps.tasks.result.value.tasks == ['embed','token_embed']"
      - "steps.pt.result.value.pooling_task == 'embed' && steps.pt.result.value.enable_scoring_api"
  - id: bench-s5-1-a-head-dtype
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    steps:
      - {flow: config-create-engine-config, as: cfg}
    expect:
      - "steps.cfg.result.value.model_config.head_dtype == 'float32'"
  - id: bench-s5-1-b-routes
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}]}}, as: chat}
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, prompt: hi}}, as: cmpl}
      - {interface: serving-classification.post-classify, caller: api-client, input: {path: /classify, body: {model: llama-8b, input: hi}}, as: cls}
      - {interface: serving-embedding.post-v1-embeddings, caller: api-client, input: {path: /v1/embeddings, body: {model: llama-8b, input: hi}}, as: emb}
      - {interface: serving-embedding.post-v2-embed, caller: api-client, input: {path: /v2/embed, body: {model: llama-8b, input: [hi]}}, as: emb2}
      - {interface: serving-pooling.post-pooling, caller: api-client, input: {path: /pooling, body: {model: llama-8b, input: hi}}, as: pool}
      - {interface: serving-scores.post-score, caller: api-client, input: {path: /score, body: {model: llama-8b, text_1: a, text_2: b}}, as: score}
    expect:
      - "!steps.chat.result.ok && steps.chat.result.error.status == 404"
      - "!steps.cmpl.result.ok && steps.cmpl.result.error.status == 404"
      - "!steps.cls.result.ok && steps.cls.result.error.status == 404"
      - "steps.emb.result.ok"
      - "steps.emb2.result.ok"
      - "steps.pool.result.ok"
      - "steps.score.result.ok"
  - id: bench-s5-1-c-embeddings
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-embedding.post-v1-embeddings, caller: api-client, input: {path: /v1/embeddings, body: {model: llama-8b, input: [hello world, second input]}}, as: e}
    expect:
      - "steps.e.result.ok && steps.e.result.value.id.startsWith('embd-') && steps.e.result.value.object == 'list' && steps.e.result.value.model == 'llama-8b'"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'async-llm.encode' && x.input.request_id == steps.e.result.value.id + '-0').size() == 1"
      - "trace.filter(x, x.type == 'call.start' && x.interface == 'async-llm.encode' && x.input.request_id == steps.e.result.value.id + '-1').size() == 1"
      - "size(steps.e.result.value.data) == 2 && steps.e.result.value.data[0].index == 0 && steps.e.result.value.data[1].index == 1 && steps.e.result.value.data[0].object == 'embedding'"
      - "size(steps.e.result.value.data[0].embedding) == 4096"
      - "steps.e.result.value.usage.completion_tokens == 0"
      - "calls['pooling-runner.pool'] > 0"
  - id: bench-s5-1-d-base64
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-embedding.post-v1-embeddings, caller: api-client, input: {path: /v1/embeddings, body: {model: llama-8b, input: [hello world, second input], encoding_format: base64}}, as: e}
    expect:
      - "type(steps.e.result.value.data[0].embedding) == string && size(steps.e.result.value.data[0].embedding) == 21848"
  - id: bench-s5-1-e-refusals
    fixtures: [full-tp1-llama-8b]
    config: {runner: pooling}
    state:
      app-state: {supported_tasks: [embed, token_embed]}
      async-llm: {supported_tasks: [embed, token_embed]}
    steps:
      - {interface: serving-embedding.post-v1-embeddings, caller: api-client, input: {path: /v1/embeddings, body: {model: llama-8b, input: hi, dimensions: 256}}, as: dim}
      - {interface: serving-embedding.post-v1-embeddings, caller: api-client, input: {path: /v1/embeddings, body: {model: llama-8b, input: hi, normalize: true}}, as: nrm}
    expect:
      - "!steps.dim.result.ok && steps.dim.result.error.status == 400 && steps.dim.result.error.message == \"Model 'llama-8b' does not support Matryoshka embeddings; dimensions must be unset (received dimensions=256).\""
      - "steps.dim.result.error.data.param == null"
      - "!steps.nrm.result.ok && steps.nrm.result.error.status == 400 && steps.nrm.result.error.message == 'Parameter `normalize` was removed; use `use_activation` instead. (parameter=normalize)'"
