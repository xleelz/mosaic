schema_version: 1
id: vllm
scenarios:
- id: bench-p5-6-a-groups
  fixtures: &id001
  - full-moe-mixtral-8x7b-tp2-ep
  state: &id002
    parallel-state@rank0:
      groups: {}
      mp_initialized: false
      world_initialized: true
      world_size: 2
      rank: 0
    parallel-state@rank1:
      groups: {}
      mp_initialized: false
      world_initialized: true
      world_size: 2
      rank: 1
  steps:
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank0
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: false
    as: m0
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank1
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: false
    as: m1
  expect:
  - state['parallel-state@rank0'].groups.tp.world_size == 2 && state['parallel-state@rank0'].groups.pp.world_size == 1 && state['parallel-state@rank0'].groups.dp.world_size == 1 && state['parallel-state@rank0'].groups.ep.world_size
    == 2
  - '!(''eplb'' in state[''parallel-state@rank0''].groups)'
  - has(state['parallel-state@rank0'].groups.tp.group_ranks) && state['parallel-state@rank0'].groups.tp.group_ranks == [[0, 1]] && state['parallel-state@rank0'].groups.pp.group_ranks == [[0], [1]] && state['parallel-state@rank0'].groups.dp.group_ranks
    == [[0], [1]] && state['parallel-state@rank0'].groups.ep.group_ranks == [[0, 1]]
- id: bench-p5-6-a-init-device-ismoe
  flow: wr-init-device
  fixtures: *id001
  state:
    gpu-memory@rank0:
      weights_bytes: 0
    parallel-state@rank0:
      groups: {}
      mp_initialized: false
      world_initialized: true
      world_size: 2
      rank: 0
  expect:
  - result.ok
  - '''ep'' in state[''parallel-state@rank0''].groups'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'parallel-state.initialize-model-parallel' && e.input.is_moe == true)
- id: bench-p5-6-a-ep-from-moe-not-flag
  fixtures: *id001
  config:
    enable-expert-parallel: false
  state: *id002
  steps:
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank0
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: false
    as: m0
  expect:
  - '''ep'' in state[''parallel-state@rank0''].groups'
- id: bench-p5-6-b-logs
  fixtures: *id001
  state: *id002
  steps:
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank0
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: false
    as: m0
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank1
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: false
    as: m1
  expect:
  - steps.m0.result.value.log == 'rank 0 in world size 2 is assigned as DP rank 0, PP rank 0, PCP rank 0, TP rank 0, ETP rank 0, EP rank 0, EPLB rank N/A'
  - steps.m1.result.value.log == 'rank 1 in world size 2 is assigned as DP rank 0, PP rank 0, PCP rank 0, TP rank 1, ETP rank 1, EP rank 1, EPLB rank N/A'
- id: bench-p5-6-b-dense-log
  fixtures:
  - full-tp1-llama-8b
  state:
    parallel-state@rank0:
      groups: {}
      mp_initialized: false
      world_initialized: true
      world_size: 1
      rank: 0
  steps:
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank0
    input:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      is_moe: false
      enable_eplb: false
    as: m0
  expect:
  - steps.m0.result.value.log == 'rank 0 in world size 1 is assigned as DP rank 0, PP rank 0, PCP rank 0, TP rank 0, ETP rank 0, EP rank N/A, EPLB rank N/A'
- id: bench-p5-6-c-custom-eligibility
  fixtures: *id001
  config:
    vllm-allreduce-use-flashinfer: false
  steps:
  - interface: custom-allreduce.init
    caller: gpu-worker
    'on': rank0
    input:
      world_size: 2
    as: ci0
  - interface: custom-allreduce.init
    caller: gpu-worker
    'on': rank1
    input:
      world_size: 2
    as: ci1
  - flow: distributed-tp-all-reduce
    input:
      hidden_size: 4096
      num_tokens: 1
      world_size: 2
      ranks:
      - rank0
      - rank1
      dtype: bfloat16
    'on': rank0
    at_ms: 10
    await: false
    as: d0
  - flow: distributed-tp-all-reduce
    input:
      hidden_size: 4096
      num_tokens: 1
      world_size: 2
      ranks:
      - rank0
      - rank1
      dtype: bfloat16
    'on': rank1
    at_ms: 10
    await: false
    as: d1
  - flow: distributed-tp-all-reduce
    input:
      hidden_size: 4096
      num_tokens: 8192
      world_size: 2
      ranks:
      - rank0
      - rank1
      dtype: bfloat16
    'on': rank0
    at_ms: 50
    await: false
    as: p0
  - flow: distributed-tp-all-reduce
    input:
      hidden_size: 4096
      num_tokens: 8192
      world_size: 2
      ranks:
      - rank0
      - rank1
      dtype: bfloat16
    'on': rank1
    at_ms: 50
    await: false
    as: p1
  expect:
  - steps.ci0.result.value.max_size == 8388608
  - steps.d0.result.value.backend == 'custom-allreduce' && steps.d0.result.value.bytes == 8192
  - steps.p0.result.value.backend != 'custom-allreduce' && steps.p0.result.value.bytes == 67108864
