- id: bench-p5-6-c-disable
  fixtures: *id001
  config:
    vllm-allreduce-use-flashinfer: false
  steps:
  - interface: custom-allreduce.init
    caller: gpu-worker
    'on': rank0
    input:
      world_size: 2
    as: ci0
  - interface: custom-allreduce.init
    caller: gpu-worker
    'on': rank1
    input:
      world_size: 2
    as: ci1
  - flow: distributed-set-custom-all-reduce
    input:
      enable: false
    'on': rank0
    as: o0
  - flow: distributed-set-custom-all-reduce
    input:
      enable: false
    'on': rank1
    as: o1
  - flow: distributed-tp-all-reduce
    input:
      hidden_size: 4096
      num_tokens: 1
      world_size: 2
      ranks:
      - rank0
      - rank1
      dtype: bfloat16
    'on': rank0
    at_ms: 10
    await: false
    as: d0
  - flow: distributed-tp-all-reduce
    input:
      hidden_size: 4096
      num_tokens: 1
      world_size: 2
      ranks:
      - rank0
      - rank1
      dtype: bfloat16
    'on': rank1
    at_ms: 10
    await: false
    as: d1
  expect:
  - state['parallel-state@rank0'].custom_all_reduce_enabled == false
  - steps.d0.result.value.backend != 'custom-allreduce'
- id: bench-p5-6-c-init-device-reads-flag
  flow: wr-init-device
  fixtures: *id001
  state:
    gpu-memory@rank0:
      weights_bytes: 0
  expect:
  - calls['parallel-state.set-custom-all-reduce'] == 1
- id: bench-p5-6-c-tp-only
  fixtures: *id001
  state: *id002
  steps:
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank0
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: false
    as: m0
  expect:
  - has(state['parallel-state@rank0'].groups.tp.use_custom_allreduce) && state['parallel-state@rank0'].groups.tp.use_custom_allreduce == true && state['parallel-state@rank0'].groups.ep.use_custom_allreduce
    == false
- id: bench-p5-6-d-eplb
  fixtures: *id001
  config:
    enable-eplb: true
  state: *id002
  steps:
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank0
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: true
    as: m0
  - interface: parallel-state.initialize-model-parallel
    caller: gpu-worker
    'on': rank1
    input:
      tensor_model_parallel_size: 2
      pipeline_model_parallel_size: 1
      is_moe: true
      enable_eplb: true
    as: m1
  expect:
  - state['parallel-state@rank0'].groups.eplb.world_size == 2
  - steps.m0.result.value.log.endsWith('EPLB rank 0') && steps.m1.result.value.log.endsWith('EPLB rank 1')
  - has(state['parallel-state@rank0'].groups.eplb.group_ranks) && state['parallel-state@rank0'].groups.eplb.group_ranks == [[0, 1]]
