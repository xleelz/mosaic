schema_version: 1
id: vllm
scenarios:
- id: bench-q5-2-a-rows
  name: '(a) X with 3 drafts + Y without: order, non-structured excluded, 4+1=5 rows; allocation 4096 x 4008'
  fixtures:
  - full-tp1-llama-8b
  config: &id001
    speculative-method: ngram
    num-speculative-tokens: 3
    async-scheduling: false
  steps: &id002
  - flow: structured-output-grammar-init
    input:
      backend: xgrammar
      grammar_spec: '{"type": "string"}'
      request_id: X
      request_type: json
      stop_token_ids:
      - 128009
    as: gX
  - flow: structured-output-grammar-init
    input:
      backend: xgrammar
      grammar_spec: '{"type": "string"}'
      request_id: Y
      request_type: json
      stop_token_ids:
      - 128009
    as: gY
  - flow: scheduler-add-request
    input:
      request_id: X
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 16
      grammar_id: X
    as: addX
  - flow: scheduler-add-request
    input:
      request_id: Y
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 16
      grammar_id: Y
    as: addY
  - flow: scheduler-add-request
    input:
      request_id: N
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 16
    as: addN
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - X
        - Y
        - N
        sampled_token_ids:
        - - 1
        - - 1
        - - 1
      scheduler_output: = steps.s1.result.value
    as: u1
  - flow: scheduler-update-draft-token-ids
    input:
      req_ids:
      - X
      - Y
      - N
      draft_token_ids:
      - - 2
        - 3
        - 4
      - []
      - - 5
        - 6
        - 7
    as: d1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - interface: scheduler.get-grammar-bitmask
    caller: engine-core
    input:
      scheduler_output: = steps.s2.result.value
    as: bm
  expect:
  - steps.bm.result.value.structured_output_request_ids == ['X', 'Y']
  - steps.bm.result.value.num_acceptable_drafts == [3, 0]
  - steps.bm.result.value.num_rows == 5
  - trace.exists(e, e.type == 'note' && e.title.contains('allocate_token_bitmask'))
- id: bench-q5-2-b-fill-rollback
  name: '(b) one row per draft plus bonus: grammar advanced 3 times then rolled back; state unchanged'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  steps: *id002
  expect:
  - calls['xgrammar-grammar.fill-bitmask'] == 5
  - calls['xgrammar-grammar.rollback'] >= 1
- id: bench-q5-2-c-sync-validate
  name: '(c) sync: validate_tokens keeps [t1] when t2 breaks the grammar; the next step schedules 1+1'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  steps:
  - flow: structured-output-grammar-init
    input:
      backend: xgrammar
      grammar_spec: '{"type": "string"}'
      request_id: X
      request_type: json
      stop_token_ids:
      - 128009
    as: gX
  - flow: scheduler-add-request
    input:
      request_id: X
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 16
      grammar_id: X
    as: addX
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - X
        sampled_token_ids:
        - - 1
      scheduler_output: = steps.s1.result.value
    as: u1
  - flow: scheduler-update-draft-token-ids
    input:
      req_ids:
      - X
      draft_token_ids:
      - - 2
        - 128009
        - 3
    as: d1
  - flow: scheduler-schedule
    input: {}
    as: s2
  expect:
  - state.scheduler.requests.X.grammar_id == 'X'
  - steps.s2.result.value.num_scheduled_tokens.X == 2
  - steps.s2.result.value.scheduled_spec_decode_tokens.X == [2]
- id: bench-q5-2-c-async-pad
  name: '(c) async: padded to 3 with -1, num_invalid_spec_tokens 2, stats count 1 draft token'
  fixtures:
  - full-tp1-llama-8b
  config:
    speculative-method: eagle3
    num-speculative-tokens: 3
    async-scheduling: true
  steps:
  - flow: structured-output-grammar-init
    input:
      backend: xgrammar
      grammar_spec: '{"type": "string"}'
      request_id: X
      request_type: json
      stop_token_ids:
      - 128009
    as: gX
  - flow: scheduler-add-request
    input:
      request_id: X
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 16
      grammar_id: X
    as: addX
  - flow: scheduler-schedule
    input: {}
    as: s1
  expect:
  - '''scheduler.update-draft-token-ids-in-output'' in calls && calls[''scheduler.update-draft-token-ids-in-output''] >= 1'
- id: bench-q5-2-d-rejected
  name: '(d) grammar rejects a sampled token: FINISHED_ERROR, error finish, log text'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  steps:
  - flow: structured-output-grammar-init
    input:
      backend: xgrammar
      grammar_spec: '{"type": "string"}'
      request_id: X
      request_type: json
      stop_token_ids:
      - 128009
    as: gX
  - flow: scheduler-add-request
    input:
      request_id: X
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 16
      grammar_id: X
    as: addX
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - X
        sampled_token_ids:
        - - 55
      scheduler_output: = steps.s1.result.value
    as: u1
  - interface: generate-base-serving.raise-if-error
    caller: api-server
    input:
      finish_reason: error
      request_id: X
    as: r
  expect:
  - steps.u1.result.value.outputs[0].finish_reason == 'error'
  - '!steps.r.result.ok && steps.r.result.error.code == ''generation-error'''
  - 'trace.exists(e, e.type == ''note'' && e.title.contains(''Unexpected: grammar rejected tokens''))'
