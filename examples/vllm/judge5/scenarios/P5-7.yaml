schema_version: 1
id: vllm
scenarios:
- id: bench-p5-7-a-buffer
  fixtures: &id001
  - full-tp1-llama-8b
  steps:
  - flow: wr-init-device
    as: i
  state:
    gpu-memory@rank0:
      weights_bytes: 0
  expect:
  - has(state['structured-outputs-worker@rank0'].grammar_bitmask) && state['structured-outputs-worker@rank0'].grammar_bitmask.bytes == 16416768
- id: bench-p5-7-a-buffer-spec
  fixtures: *id001
  config:
    speculative-method: ngram
    num-speculative-tokens: 3
  steps:
  - flow: wr-init-device
    as: i
  state:
    gpu-memory@rank0:
      weights_bytes: 0
  expect:
  - has(state['structured-outputs-worker@rank0'].grammar_bitmask) && state['structured-outputs-worker@rank0'].grammar_bitmask.bytes == 65667072
- id: bench-p5-7-b-mixed
  fixtures: *id001
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        s: 2
        u: 2
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids:
        - 128000
        - 9906
        req_id: s
        sampling_params:
          temperature: 0
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids:
        - 128000
        - 9906
        req_id: u
        sampling_params:
          temperature: 0
      total_num_scheduled_tokens: 4
    as: e
  - flow: wr-sample-tokens
    input:
      grammar_output:
        grammar_bitmask:
        - - 255
        structured_output_request_ids:
        - s
    as: t
  expect:
  - steps.t.result.ok
  - trace.exists(e, e.type == 'call.end' && e.interface == 'structured-outputs-worker.apply-grammar-bitmask' && e.output.masked_req_ids == ['s'])
  - calls['structured-outputs-worker.apply-grammar-bitmask-kernel'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'structured-outputs-worker.apply-grammar-bitmask-kernel' && e.input.num_rows == 1)
  - trace.exists(e, e.type == 'call.start' && e.interface == 'structured-outputs-worker.apply-grammar-bitmask' && has(e.input.mapping) && e.input.mapping == [0])
- id: bench-p5-7-c-drafts
  fixtures: *id001
  config:
    speculative-method: ngram
    num-speculative-tokens: 3
  state:
    gpu-model-runner:
      fresh_slots_used: 1
      slots:
        s:
          prefill_len: 100
          prompt_len: 100
          slot: 0
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        s: 3
      scheduled_cached_reqs:
        new_block_ids:
        - []
        num_computed_tokens:
        - 100
        req_ids:
        - s
      scheduled_new_reqs: []
      scheduled_spec_decode_tokens:
        s:
        - 201
        - 202
      total_num_scheduled_tokens: 3
    as: e
  - flow: wr-sample-tokens
    input:
      grammar_output:
        grammar_bitmask:
        - - 255
        - - 255
        - - 255
        structured_output_request_ids:
        - s
    as: t
  expect:
  - trace.exists(e, e.type == 'call.start' && e.interface == 'structured-outputs-worker.apply-grammar-bitmask-kernel' && e.input.num_rows == 3)
- id: bench-p5-7-d-order
  fixtures: *id001
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        s: 2
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids:
        - 128000
        - 9906
        req_id: s
        sampling_params:
          temperature: 0
      total_num_scheduled_tokens: 2
    as: e
  - flow: wr-sample-tokens
    input:
      grammar_output:
        grammar_bitmask:
        - - 255
        structured_output_request_ids:
        - s
    as: t
  expect:
  - trace.filter(e, e.type == 'call.start' && (e.interface == 'structured-outputs-worker.apply-grammar-bitmask' || e.interface == 'sampler.sample')).map(e, e.interface) == ['structured-outputs-worker.apply-grammar-bitmask',
    'sampler.sample']
- id: bench-p5-7-d-clamp
  fixtures: *id001
  steps:
  - interface: openai-serving-chat.create-chat-logprobs
    caller: api-server
    input:
      token_ids:
      - 9642
      top_logprobs: 5
      logprobs:
      - - token_id: 9642
          logprob: -0.1
          rank: 1
        - token_id: 2822
          logprob: -2.3
          rank: 2
        - token_id: 1
          logprob: -1.0e+300
          rank: 3
        - token_id: 2
          logprob: -1.0e+300
          rank: 4
        - token_id: 3
          logprob: -1.0e+300
          rank: 5
    as: l
  expect:
  - size(steps.l.result.value.content[0].top_logprobs) == 5
  - steps.l.result.value.content[0].top_logprobs[2].logprob == -9999.0 && steps.l.result.value.content[0].top_logprobs[4].logprob == -9999.0
  - steps.l.result.value.content[0].top_logprobs[0].logprob == -0.1
