schema_version: 1
id: vllm
scenarios:
  - id: bench-l5-6-a-ids
    fixtures: [full-tp1-llama-8b]
    max_events: 200000
    steps:
    - {as: hdr, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {X-Request-Id: abc}, body: {max_tokens: 2, request_id: {$absent: true}, stream: false, messages: [{role: user, content: hi}]}}}
    - {as: body, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {max_tokens: 2, request_id: xyz, stream: false, messages: [{role: user, content: hi}]}}}
    - {as: both, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {X-Request-Id: abc}, body: {max_tokens: 2, request_id: xyz, stream: false, messages: [{role: user, content: hi}]}}}
    - {as: none, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {$absent: true}, body: {max_tokens: 2, request_id: {$absent: true}, stream: false, messages: [{role: user, content: hi}]}}}
    expect:
    - "steps.hdr.result.value.id == 'chatcmpl-abc'"
    - "steps.body.result.value.id == 'chatcmpl-xyz'"
    - "steps.both.result.value.id == 'chatcmpl-abc'"
    - "steps.none.result.value.id.matches('^chatcmpl-[0-9a-f-]{32,36}$')"
    - "trace.filter(e, e.type == 'call.end' && e.interface == 'input-processor.assign-request-id').map(e, e.output.external_req_id)[0] == 'chatcmpl-abc'"
    - "trace.filter(e, e.type == 'call.end' && e.interface == 'input-processor.assign-request-id').all(e, e.output.request_id.startsWith(e.output.external_req_id + '-') && size(e.output.request_id) == size(e.output.external_req_id) + 9)"
  - id: bench-l5-6-b-c-duplicate-and-disconnect
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
    - {as: loop, await: false, flow: engine-core-busy-loop, input: {iterations: 60}}
    - {as: a, at_ms: 0, await: false, flow: async-llm-generate, input: {cancel_token: client-a, prompt_token_ids: [128000, 9906], request_id: chatcmpl-abc, sampling_params: {max_tokens: 200, n: 1}}}
    - {as: b, at_ms: 0, await: false, flow: async-llm-generate, input: {cancel_token: client-b, prompt_token_ids: [128000, 9906], request_id: chatcmpl-abc, sampling_params: {max_tokens: 200, n: 1}}}
    - {at_ms: 16, cancel: client-a}
    expect:
    - "trace.filter(e, e.type == 'call.end' && e.interface == 'input-processor.assign-request-id').map(e, e.output.request_id)[0] != trace.filter(e, e.type == 'call.end' && e.interface == 'input-processor.assign-request-id').map(e, e.output.request_id)[1]"
    - "trace.exists(e, e.type == 'call.start' && e.interface == 'output-processor.abort-requests' && e.input.internal == true && size(e.input.request_ids) == 1)"
    - "!steps.a.result.ok && steps.a.result.error.code == 'canceled'"
    - "steps.b.result.ok"
    - "trace.exists(e, e.type == 'note' && e.title.contains('Request chatcmpl-abc aborted.'))"
  - id: bench-l5-6-c-external-abort
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
    - {as: loop, await: false, flow: engine-core-busy-loop, input: {iterations: 60}}
    - {as: a, at_ms: 0, await: false, flow: async-llm-generate, input: {cancel_token: client-a, prompt_token_ids: [128000, 9906], request_id: chatcmpl-abc, sampling_params: {max_tokens: 200, n: 1}}}
    - {as: b, at_ms: 0, await: false, flow: async-llm-generate, input: {cancel_token: client-b, prompt_token_ids: [128000, 9906], request_id: chatcmpl-abc, sampling_params: {max_tokens: 200, n: 1}}}
    - {as: ab, at_ms: 100, await: false, flow: async-llm-abort, input: {internal: false, request_ids: [chatcmpl-abc]}}
    expect:
    - "size(steps.ab.result.value.aborted) == 2"
    - "steps.a.result.value.value.finish_reason == 'abort' && steps.b.result.value.value.finish_reason == 'abort'"
  - id: bench-l5-6-c-parent-abort
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
    - {as: loop, await: false, flow: engine-core-busy-loop, input: {iterations: 60}}
    - {as: p, at_ms: 0, await: false, flow: async-llm-parallel-sampling, input: {prompt_token_ids: [128000, 9906], request_id: chatcmpl-p, sampling_params: {max_tokens: 200, n: 2, temperature: 0.8, stop: []}}}
    - {as: ab, at_ms: 100, await: false, flow: async-llm-abort, input: {internal: true, request_ids: [chatcmpl-p-00000001]}}
    expect:
    - "steps.ab.result.value.aborted == ['0_chatcmpl-p-00000001', '1_chatcmpl-p-00000001']"
    - "steps.p.result.value.value.finish_reason == 'abort'"
  - id: bench-l5-6-b-c-http-disconnect
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
    - {as: loop, await: false, flow: engine-core-busy-loop, input: {iterations: 60}}
    - {as: a, at_ms: 0, await: false, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {X-Request-Id: abc}, body: {max_tokens: 200, stream: false, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {as: b, at_ms: 0, await: false, flow: serving-api-chat-completion, input: {path: /v1/chat/completions, headers: {X-Request-Id: abc}, body: {max_tokens: 3, stream: false, request_id: {$absent: true}, messages: [{role: user, content: hi}]}}}
    - {at_ms: 60, cancel: disconnect-chatcmpl-abc}
    expect:
    - "steps.b.result.ok && has(steps.b.result.value.choices)"
# (d) cannot be written: the config id vllm-disable-request-id-randomization does not exist and
# input-processor.assign-request-id always appends the suffix. Scored missing.
