schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-6-a-static-modules
    fixtures: [full-tp1-llama-8b, lora-adapter-on-disk]
    config: {enable-lora: true}
    steps:
      - {interface: openai-serving-models.load-lora-adapter, caller: app-state, input: {lora_name: sql, lora_path: /models/lora/sql-adapter, load_inplace: false}, as: l1}
      - {interface: openai-serving-models.load-lora-adapter, caller: app-state, input: {lora_name: sql2, lora_path: /models/lora/sql-adapter, load_inplace: false}, as: l2}
      - {interface: openai-serving-models.get-v1-models, caller: api-client, input: {path: /v1/models}, as: m}
    expect:
      - "steps.l1.result.ok && steps.l2.result.ok"
      - "state['openai-serving-models'].lora_requests.sql.lora_int_id == 1 && state['openai-serving-models'].lora_requests.sql2.lora_int_id == 2"
      - "steps.m.result.value.data.map(c, c.id) == ['llama-8b', 'sql', 'sql2']"
      - "steps.m.result.value.data[0].max_model_len == 131072"
      - "steps.m.result.value.data[1].root == '/models/lora/sql-adapter' && steps.m.result.value.data[1].parent == 'llama-8b' && steps.m.result.value.data[1].max_model_len == null"
      - "calls['app-state.init-static-loras'] == 2"
  - id: bench-s5-6-b-without-enable-lora
    fixtures: [full-tp1-llama-8b, lora-adapter-on-disk]
    config: {enable-lora: false}
    steps:
      - {interface: openai-serving-models.load-lora-adapter, caller: app-state, input: {lora_name: sql, lora_path: /models/lora/sql-adapter, load_inplace: false}, as: l1}
    expect:
      - "!steps.l1.result.ok && steps.l1.result.error.message == 'LoRA is not enabled. Use --enable-lora to enable LoRA.'"
      - "steps.l1.result.error.status == 500"
  - id: bench-s5-6-c-rank-32
    fixtures: [full-tp1-llama-8b]
    config: {enable-lora: true}
    state:
      local-disk: {files: {'/a/r32/adapter_config.json': {json: {r: 32, lora_alpha: 32}}, '/a/r32/adapter_model.safetensors': {size: 100}}}
    steps:
      - {interface: openai-serving-models.load-lora-adapter, caller: app-state, input: {lora_name: r32, lora_path: /a/r32, load_inplace: false}, as: l}
    expect:
      - "!steps.l.result.ok && steps.l.result.error.message == 'LoRA rank 32 is greater than max_lora_rank 16.'"
      - "calls['local-disk.read-file'] >= 1 && trace.filter(x, x.type == 'call.start' && x.interface == 'local-disk.read-file' && x.input.path.endsWith('safetensors')).size() == 0"
  - id: bench-s5-6-c-rank-32-allowed
    fixtures: [full-tp1-llama-8b]
    config: {enable-lora: true, max-lora-rank: 32}
    state:
      local-disk: {files: {'/a/r32/adapter_config.json': {json: {r: 32, lora_alpha: 32}}, '/a/r32/adapter_model.safetensors': {size: 100}}}
    steps:
      - {interface: openai-serving-models.load-lora-adapter, caller: app-state, input: {lora_name: r32, lora_path: /a/r32, load_inplace: false}, as: l}
    expect:
      - "steps.l.result.ok"
  - id: bench-s5-6-c-rank-24-refused
    fixtures: [full-tp1-llama-8b]
    config: {enable-lora: true, max-lora-rank: 24}
    steps:
      - {flow: config-create-engine-config, as: c}
    expect:
      - "!steps.c.result.ok"
  - id: bench-s5-6-d-dora-and-bias
    fixtures: [full-tp1-llama-8b]
    config: {enable-lora: true}
    state:
      local-disk: {files: {'/a/d/adapter_config.json': {json: {r: 16, lora_alpha: 32, use_dora: true, bias: all}}, '/a/d/adapter_model.safetensors': {size: 100}}}
    steps:
      - {interface: openai-serving-models.load-lora-adapter, caller: app-state, input: {lora_name: d, lora_path: /a/d, load_inplace: false}, as: l}
    expect:
      - "!steps.l.result.ok && steps.l.result.error.message == 'vLLM does not yet support DoRA. Adapter bias is not supported.'"
  - id: bench-s5-6-e-max-cpu-loras
    fixtures: [full-tp1-llama-8b]
    config: {enable-lora: true, max-loras: 2, max-cpu-loras: 1}
    steps:
      - {flow: config-create-engine-config, as: c}
    expect:
      - "!steps.c.result.ok && steps.c.result.error.message == 'max_cpu_loras (1) must be >= max_loras (2).'"
