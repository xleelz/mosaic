schema_version: 1
id: vllm
scenarios:
- id: bench-q5-4-a-native
  name: '(a) --kv-offloading-size 8: OffloadingConnector, kv_both, cpu_bytes_to_use 8589934592'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: config-create-engine-config
    input:
      kv_offloading_size: 8
    as: c
  expect:
  - steps.c.result.ok
  - steps.c.result.value.kv_transfer_config.kv_connector == 'OffloadingConnector'
  - steps.c.result.value.kv_transfer_config.kv_role == 'kv_both'
  - steps.c.result.value.kv_transfer_config.kv_connector_extra_config.cpu_bytes_to_use == 8589934592
- id: bench-q5-4-a-lmcache
  name: '(a) --kv-offloading-backend lmcache: LMCacheMPConnector, size not passed'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: config-create-engine-config
    input:
      kv_offloading_size: 8
      kv_offloading_backend: lmcache
    as: c
  expect:
  - steps.c.result.value.kv_transfer_config.kv_connector == 'LMCacheMPConnector'
- id: bench-q5-4-a-simple-env
  name: '(a) VLLM_USE_SIMPLE_KV_OFFLOAD=1: SimpleCPUOffloadConnector'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: config-create-engine-config
    input:
      kv_offloading_size: 8
    as: c
  expect:
  - steps.c.result.value.kv_transfer_config.kv_connector == 'SimpleCPUOffloadConnector'
- id: bench-q5-4-a-spec-size-reaches-cpu
  name: (a) the CPU tier sizes from cpu_bytes_to_use
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: offloading-spec-factory.create-spec
    caller: engine-core
    input:
      extra_config:
        cpu_bytes_to_use: 8589934592
      worker_kv_bytes_per_block: 2097152
      blocks_per_chunk: 1
    as: s
  expect:
  - steps.s.result.value.spec_cls == 'CPUOffloadingSpec' && steps.s.result.value.num_chunks == 4096
- id: bench-q5-4-b-native-connector
  name: '(b) default OffloadingConnector: B gets the host-tier hit asynchronously'
  fixtures:
  - full-tp1-llama-8b
  config:
    kv-connector: OffloadingConnector
    kv-role: kv_both
    async-scheduling: false
    num-gpu-blocks-override: 256
  steps:
  - flow: scheduler-add-request
    input:
      request_id: B
      prompt_segments:
      - key: pa
        num_tokens: 1000
      sampling_params:
        max_tokens: 4
    as: addB
  - flow: scheduler-schedule
    input: {}
    as: s1
  expect:
  - state.scheduler.requests.B.status == 'WAITING_FOR_REMOTE_KVS'
  - '!trace.exists(e, e.type == ''call.end'' && e.interface == ''kv-connector-base-v1.get-num-new-matched-tokens'' && e.output.connector == ''not-modeled'')'
