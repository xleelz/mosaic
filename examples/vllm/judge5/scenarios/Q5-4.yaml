- id: bench-q5-4-b-fetch-stage
  name: (b) the waiting request counts in vllm:num_requests_kv_fetch_by_stage{stage=in_progress}
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  state:
    simple-cpu-offload-connector:
      cpu_cache: *id002
      block_size: 16
  steps:
  - flow: scheduler-add-request
    input:
      request_id: B
      prompt_segments:
      - key: pa
        num_tokens: 1000
      sampling_params:
        max_tokens: 4
    as: addB
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-make-stats
    input: {}
    as: st
  expect:
  - steps.st.result.value.num_kv_fetch_reqs_by_stage.in_progress == 1
- id: bench-q5-4-c-metrics
  name: (c) local queries 1000 hits 0; connector stats and the source split
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  state:
    simple-cpu-offload-connector:
      cpu_cache: *id002
      block_size: 16
  steps:
  - flow: scheduler-add-request
    input:
      request_id: B
      prompt_segments:
      - key: pa
        num_tokens: 1000
      sampling_params:
        max_tokens: 4
    as: addB
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-make-stats
    input: {}
    as: st
  expect:
  - steps.st.result.value.prefix_cache_stats.queries == 1000 && steps.st.result.value.prefix_cache_stats.hits == 0
  - steps.st.result.value.connector_prefix_cache_stats.queries == 1000
  - steps.st.result.value.connector_prefix_cache_stats.hits == 992
  - steps.st.result.value.connector_prefix_cache_stats.hits_by_source.host == 992
- id: bench-q5-4-c-metric-family
  name: (c) the external and by-source families exist at init
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: stat-logger-manager.init-prometheus
    caller: api-server
    input: {}
    as: i
  expect:
  - string(state['prometheus-registry'].metrics).contains('vllm:external_prefix_cache_queries')
  - string(state['prometheus-registry'].metrics).contains('vllm:prompt_tokens_cached_by_source')
- id: bench-q5-4-d-prompt-logprobs
  name: '(d) prompt_logprobs skips reads: connector reports nothing, whole prompt computed'
  fixtures:
  - full-tp1-llama-8b
  config: *id001
  state:
    simple-cpu-offload-connector:
      cpu_cache: *id002
      block_size: 16
  steps:
  - flow: scheduler-add-request
    input:
      request_id: B
      prompt_segments:
      - key: pa
        num_tokens: 1000
      sampling_params:
        max_tokens: 4
        prompt_logprobs: 1
    as: addB
  - flow: scheduler-schedule
    input: {}
    as: s1
  expect:
  - steps.s1.result.value.num_scheduled_tokens.B == 1000
  - state.scheduler.requests.B.status == 'RUNNING'
  - state.scheduler.requests.B.num_cached_tokens == 0
  - '!trace.exists(e, e.type == ''call.end'' && e.interface == ''kv-connector-base-v1.get-num-new-matched-tokens'' && e.output.num_external_tokens > 0)'
