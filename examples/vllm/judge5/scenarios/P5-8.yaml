- id: bench-p5-8-d-engine-request
  fixtures: *id001
  config:
    enable-prompt-embeds: true
  steps:
  - interface: input-processor.process-inputs
    caller: api-server
    input:
      prompt_token_ids: null
      prompt_embeds:
        shape:
        - 10000
        - 4096
      request_id: pe
      sampling_params:
        max_tokens: 4
    as: r
  expect:
  - steps.r.result.ok && has(steps.r.result.value.prompt_embeds) && steps.r.result.value.prompt_embeds.shape == [10000, 4096]
- id: bench-p5-8-d-renderer-off
  fixtures: *id001
  steps:
  - interface: base-renderer.process-singleton
    caller: api-server
    input:
      engine_input:
        type: embeds
        prompt_embeds:
          shape:
          - 10
          - 4096
    as: r
  expect:
  - '!steps.r.result.ok && steps.r.result.error.message.contains(''You must set `--enable-prompt-embeds` to input `prompt_embeds`.'')'
