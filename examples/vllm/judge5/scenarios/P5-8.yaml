schema_version: 1
id: vllm
scenarios:
- id: bench-p5-8-a-off
  fixtures: &id001
  - full-tp1-llama-8b
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        s: 2
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids:
        - 128000
        - 9906
        req_id: s
        sampling_params:
          temperature: 0
      total_num_scheduled_tokens: 2
    as: e
  expect:
  - steps.e.result.ok
  - calls['prompt-embeds-state.apply'] == 0
- id: bench-p5-8-a-on-flag
  fixtures: *id001
  config:
    enable-prompt-embeds: true
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        s: 2
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids:
        - 128000
        - 9906
        req_id: s
        sampling_params:
          temperature: 0
      total_num_scheduled_tokens: 2
    as: e
  expect:
  - steps.e.result.ok
  - calls['prompt-embeds-state.apply'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface.endsWith('.embed-input-ids'))
- id: bench-p5-8-b-mixed-batch
  fixtures: *id001
  config:
    enable-prompt-embeds: true
  state: &id002
    gpu-model-runner:
      model:
        architecture: LlamaForCausalLM
        dtype_bytes: 2
        eos_token_id: 128009
        head_size: 128
        hidden_size: 4096
        is_hybrid: false
        max_position_embeddings: 131072
        name: meta-llama/Llama-3.1-8B-Instruct
        num_attention_heads: 32
        num_hidden_layers: 32
        num_kv_heads: 8
        torch_dtype: bfloat16
        uses_mrope: false
        uses_prompt_embeds: true
        vocab_size: 128256
        weights_bytes: 16060522496
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        p: 5
        t: 2
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids: null
        prompt_embeds_len: 5
        num_prefill_tokens: 5
        req_id: p
        sampling_params:
          temperature: 0
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids:
        - 128000
        - 9906
        req_id: t
        sampling_params:
          temperature: 0
      total_num_scheduled_tokens: 7
    as: e
  expect:
  - steps.e.result.ok
  - calls['prompt-embeds-state.apply'] == 1
  - 'trace.exists(e, e.type == ''call.end'' && e.interface == ''prompt-embeds-state.apply'' && has(e.output.overlaid) && e.output.overlaid == {''p'': [0, 5]})'
- id: bench-p5-8-c-chunks
  fixtures: *id001
  config:
    enable-prompt-embeds: true
  state: *id002
  steps:
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        p: 8192
      scheduled_new_reqs:
      - block_ids:
        - 1
        num_computed_tokens: 0
        prompt_token_ids: null
        num_prefill_tokens: 10000
        req_id: p
        sampling_params:
          temperature: 0
      total_num_scheduled_tokens: 8192
    as: c1
  - flow: wr-execute-model
    input:
      num_scheduled_tokens:
        p: 1808
      scheduled_new_reqs: []
      scheduled_cached_reqs:
        new_block_ids:
        - []
        num_computed_tokens:
        - 8192
        req_ids:
        - p
      total_num_scheduled_tokens: 1808
    as: c2
  expect:
  - calls['prompt-embeds-state.apply'] == 2
  - trace.filter(e, e.type == 'call.start' && e.interface == 'prompt-embeds-state.apply').map(e, e.input.num_tokens) == [8192, 1808]
  - 'trace.exists(e, e.type == ''call.end'' && e.interface == ''prompt-embeds-state.apply'' && has(e.output.overlaid) && e.output.overlaid == {''p'': [8192, 10000]})'
