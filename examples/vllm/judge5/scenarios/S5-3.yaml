schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-3-a-chat-greedy
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], temperature: 0, logprobs: true, top_logprobs: 2, max_tokens: 3, ignore_eos: true}}, as: c}
    expect:
      - "steps.c.result.ok && size(steps.c.result.value.choices[0].logprobs.content) == 3"
      - "steps.c.result.value.choices[0].logprobs.content.all(e, size(e.top_logprobs) == 2 && e.top_logprobs[0].token == e.token && 'bytes' in e && 'logprob' in e)"
  - id: bench-s5-3-b-chat-sampled
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], temperature: 1.0, seed: 7, logprobs: true, top_logprobs: 2, max_tokens: 8, ignore_eos: true}}, as: c}
    expect:
      - "steps.c.result.ok && steps.c.result.value.choices[0].logprobs.content.all(e, e.top_logprobs[0].token == e.token && size(e.top_logprobs) == 2)"
      - "steps.c.result.value.choices[0].logprobs.content.exists(e, e.top_logprobs[1].logprob > e.logprob)"
  - id: bench-s5-3-c-completion
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-completion.post-v1-completions, caller: api-client, input: {path: /v1/completions, body: {model: llama-8b, prompt: hi, logprobs: 2, max_tokens: 3, ignore_eos: true, temperature: 1.0, seed: 7, echo: {$absent: true}}}, as: c}
    expect:
      - "steps.c.result.ok && ['text_offset','token_logprobs','tokens','top_logprobs'].all(k, k in steps.c.result.value.choices[0].logprobs)"
      - "size(steps.c.result.value.choices[0].logprobs.tokens) == 3"
      - "steps.c.result.value.choices[0].logprobs.top_logprobs.all(d, size(d) == 2 || size(d) == 3)"
      - "steps.c.result.value.choices[0].logprobs.top_logprobs.exists(d, size(d) == 3)"
  - id: bench-s5-3-d-token-ids
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], logprobs: true, top_logprobs: 5, logprob_token_ids: [9642, 2822], max_tokens: 3, ignore_eos: true}}, as: ok}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], logprobs: true, logprob_token_ids: "= lists.range(129)", max_tokens: 3}}, as: many}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], logprobs: true, logprob_token_ids: [200000], max_tokens: 3}}, as: oov}
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], logprobs: false, logprob_token_ids: [9642], max_tokens: 3}}, as: nolp}
    expect:
      - "steps.ok.result.ok && steps.ok.result.value.choices[0].logprobs.content.all(e, e.top_logprobs[0].token == e.token && [' t9642', ' t2822'].all(t, e.top_logprobs.exists(x, x.token == t)))"
      - "trace.exists(x, x.type == 'call.end' && x.interface == 'openai-serving-chat.to-sampling-params' && x.output.logprobs == null)"
      - "!steps.many.result.ok && steps.many.result.error.status == 400 && steps.many.result.error.data.param == 'logprob_token_ids' && steps.many.result.error.message == 'Requested logprob_token_ids of length 129, which is greater than max allowed: 128 (parameter=logprob_token_ids, value=129)'"
      - "!steps.oov.result.ok && steps.oov.result.error.status == 400 && steps.oov.result.error.data.param == 'logprob_token_ids' && steps.oov.result.error.message == 'token_id(s) [200000] in logprob_token_ids contain out-of-vocab token ids. Vocabulary size: 128256 (parameter=logprob_token_ids, value=[200000])'"
      - "!steps.nolp.result.ok && steps.nolp.result.error.status == 400 && steps.nolp.result.error.data.param == 'logprob_token_ids' && steps.nolp.result.error.message == 'when using `logprob_token_ids`, `logprobs` must be set to true. (parameter=logprob_token_ids)'"
  - id: bench-s5-3-e-token-id-format
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: openai-serving-chat.post-v1-chat-completions, caller: api-client, input: {path: /v1/chat/completions, body: {model: llama-8b, messages: [{role: user, content: hi}], temperature: 0, logprobs: true, top_logprobs: 2, max_tokens: 3, ignore_eos: true, return_tokens_as_token_ids: true}}, as: c}
    expect:
      - "steps.c.result.ok && steps.c.result.value.choices[0].logprobs.content.all(e, e.token.startsWith('token_id:') && e.top_logprobs.all(t, t.token.startsWith('token_id:')))"
