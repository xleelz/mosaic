schema_version: 1
id: vllm
scenarios:
  - id: oracle-serving-api-content-state-tool-start-streaming
    name: "Inkling: text block closed with no message_model header, then a tool block; text reaches content once"
    description: "tests/parser/engine/test_inkling.py:870 TestDelegating...::test_content_state_tool_start_streaming. The model has no Inkling tool/reasoning parser (vllm/parser/inkling*.py), so the scenario asks the chat-completion path for --tool-call-parser inkling and checks for the parser component."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: reasoning-parser-manager.get-reasoning-parser
        caller: api-client
        input: {name: inkling}
        as: p
    expect:
      - "steps.p.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface.startsWith('inkling'))"
  - id: oracle-serving-api-multi-chat
    name: "LLM.chat with two conversations returns two outputs"
    description: "tests/entrypoints/llm/test_chat.py:46 test_multi_chat. LLM.chat(messages=[conv1, conv2]) -> conversation_to_seq gives two conversations -> len(outputs) == 2."
    fixtures: [full-tp1-llama-8b]
    state:
      engine-core-proc: {client_kind: sync}
    steps:
      - interface: llm.chat
        caller: python-user
        input:
          messages:
            - - {role: system, content: "You are a helpful assistant"}
              - {role: user, content: "Explain the concept of entropy."}
            - - {role: system, content: "You are a helpful assistant"}
              - {role: user, content: "Explain what among us is."}
        as: chat
    expect:
      - "steps.chat.result.ok"
      - "size(steps.chat.result.value) == 2"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'llm-engine.add-request').size() == 2"
  - id: oracle-serving-api-role-normalization-is-case-insensitive
    name: "Cohere renderer maps ASSISTANT/Developer/User/SYSTEM case-insensitively"
    description: "tests/renderers/test_cohere.py:66 TestRoleToMelody::test_role_normalization_is_case_insensitive. _role_to_melody (vllm/renderers/cohere.py:290) lowercases then maps assistant->chatbot, developer->system. Driven through POST /cohere/v2/chat/render; expects the Cohere renderer to see melody roles."
    fixtures: [full-tp1-llama-8b]
    config: {vllm-enable-cohere-api: true}
    steps:
      - interface: cohere-serving-chat-v2.post-cohere-v2-chat-render
        caller: api-client
        input:
          path: /cohere/v2/chat/render
          body:
            model: llama-8b
            messages:
              - {role: SYSTEM, content: "be brief"}
              - {role: Developer, content: "use French"}
              - {role: User, content: "hi"}
              - {role: ASSISTANT, content: "bonjour"}
              - {role: user, content: "again"}
        as: r
    expect:
      - "steps.r.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.component == 'cohere-renderer')"
      - "trace.exists(e, e.type == 'call.start' && has(e.input.messages) && e.input.messages.exists(m, m.role == 'chatbot'))"
  - id: oracle-serving-api-completed-reasoning-returns-false
    name: "Responses input ending in a completed reasoning item is not continued"
    description: "tests/entrypoints/openai/responses/test_responses_utils.py:635 TestShouldContinueFinalMessage::test_completed_reasoning_returns_false. should_continue_final_message (vllm/entrypoints/openai/responses/utils.py:201) returns False for status completed, so build_chat_params (protocol.py:425) sets add_generation_prompt=True, continue_final_message=False."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: openai-serving-responses.post-v1-responses
        caller: api-client
        input:
          path: /v1/responses
          body:
            model: llama-8b
            input:
              - {type: message, role: user, content: "Why?"}
              - id: reasoning_123
                type: reasoning
                summary: []
                content: [{type: reasoning_text, text: "I have thought about this."}]
                status: completed
        as: r
    expect:
      - "steps.r.result.ok"
      - "size(warnings) == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'hf-renderer.render-messages' && has(e.input.add_generation_prompt) && e.input.add_generation_prompt == true && has(e.input.continue_final_message) && e.input.continue_final_message == false)"
