schema_version: 1
id: vllm
scenarios:
  - id: oracle-engine-core-normalize-pci-short-form
    name: "normalize_pci('3f:00.0') == (0, 0x3f, 0, 0)"
    description: "tests/v1/executor/test_vllm_net_devices.py:33 test_normalize_pci_short_form. Untranslatable: a string parser (vllm/v1/executor/vllm_net_devices.py:26). Scenario only records that the model has no vllm_net_devices interface."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: platforms.getattr
        caller: operator
        input: {name: current_platform}
        as: p
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface.startsWith('vllm-net-devices'))"
  - id: oracle-engine-core-composite-arg-parser
    name: "--mm-processor-kwargs '{\"num_crops\": 4}' reaches EngineArgs as a dict"
    description: "tests/engine/test_arg_utils.py:666 test_composite_arg_parser (num_crops case). EngineArgs.mm_processor_kwargs (arg_utils.py:642, CLI 1472) is carried into ModelConfig (arg_utils.py:1995). The argparse JSON parse is below the model; the scenario drives the parsed namespace through from_cli_args and create_engine_config."
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: engine-args.from-cli-args
        caller: operator
        input:
          args: {model: meta-llama/Llama-3.1-8B-Instruct, mm_processor_kwargs: {num_crops: 4}}
        as: ea
    expect:
      - "steps.ea.result.ok && steps.ea.result.value.mm_processor_kwargs == {'num_crops': 4}"
      - "size(warnings) == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-args.post-init' && e.input.mm_processor_kwargs == {'num_crops': 4})"
  - id: oracle-engine-core-device-ids-uuid-args-resolve
    name: "--device-ids GPU-abcd1234 resolves to physical id 4"
    description: "tests/engine/test_arg_utils.py:902 TestDeviceIds::test_device_ids_with_uuid_args_resolve_to_physical_ids. EngineArgs._resolve_device_ids (arg_utils.py:2101) maps all-UUID ids through current_platform.device_control_id_to_physical_device_id; the result is ParallelConfig.assigned_physical_gpu_ids (arg_utils.py:2586). The monkeypatched platform map is seeded as platform state."
    fixtures: [full-tp1-llama-8b]
    state:
      platforms: {host: {device_uuids: {GPU-abcd1234: 4}}}
    steps:
      - flow: config-create-engine-config
        input: {device_ids: [GPU-abcd1234]}
        as: cfg
    expect:
      - "steps.cfg.result.ok"
      - "has(steps.cfg.result.value.parallel_config.assigned_physical_gpu_ids) && steps.cfg.result.value.parallel_config.assigned_physical_gpu_ids == [4]"
