schema_version: 1
id: vllm
scenarios:
- id: oracle-scheduler-kv-encoder-cache-reset-clears-all-state
  name: Resetting the encoder cache drops every entry and restores full capacity
  description: >-
    tests/v1/core/test_encoder_cache_manager.py::test_reset_clears_all_state (line 339).
    EncoderCacheManager.reset (vllm/v1/core/encoder_cache_manager.py), reached from
    Scheduler.reset_encoder_cache (vllm/v1/core/sched/scheduler.py:2907), clears cached,
    num_embeds_by_hash, request_cached_ids, freeable and freed and restores num_free_slots
    and num_freeable_slots to cache_size. The test's allocations become seeded encoder-cache
    state (cache_size 20: img1..img4 held, 10 slots free) on the scheduler, then the real reset runs.
  fixtures: [full-tp1-llama-8b]
  state:
    scheduler:
      encoder_cache_manager:
        cache_size: 20
        num_free_slots: 10
        num_freeable_slots: 18
        cached: {img4: [req3]}
        num_embeds_by_hash: {img1: 5, img2: 3, img3: 4, img4: 10}
        request_cached_ids: {req3: [img4]}
        freeable: {img1: 5, img2: 3, img3: 4}
        freed: []
  steps:
  - interface: scheduler.reset-encoder-cache
    caller: engine-core
    input: {}
    as: reset
  expect:
  - steps.reset.result.ok
  - size(state.scheduler.encoder_cache_manager.cached) == 0
  - size(state.scheduler.encoder_cache_manager.num_embeds_by_hash) == 0
  - size(state.scheduler.encoder_cache_manager.request_cached_ids) == 0
  - size(state.scheduler.encoder_cache_manager.freeable) == 0
  - size(state.scheduler.encoder_cache_manager.freed) == 0
  - state.scheduler.encoder_cache_manager.num_free_slots == 20
  - state.scheduler.encoder_cache_manager.num_freeable_slots == 20

- id: oracle-scheduler-kv-mamba-sibling-resumes-below-block-grid
  name: An EAGLE sibling of a hybrid Mamba model resumes one hash unit below the shared block boundary
  description: >-
    tests/v1/core/prefix_cache/test_mamba_eagle_resume_checkpoint.py::test_sibling_resumes_below_the_block_grid_when_the_prefix_ends_early
    (line 169). block_size 16, hash_block_size 4, a 24-token shared system prompt, EAGLE on,
    enable_mamba_shared_prefix_checkpoint on. After the owner and a first follower prefilled
    (the follower's chunk stops at the junction 16 - 4 = 12 and the Mamba group checkpoints there,
    Scheduler._mamba_block_aligned_split vllm/v1/core/sched/scheduler.py and
    MambaManager.find_longest_cache_hit/cache_blocks vllm/v1/core/single_type_kv_cache_manager.py),
    the next sibling's computed-token hit is 12, below the 16-token block grid.
    State: full attention holds the shared 16-token block; the Mamba checkpoint the follower
    registered at 12 has no block-grid key, so none can be seeded.
  fixtures: [full-tp1-llama-8b]
  config:
    block-size: 16
    num-speculative-tokens: 1
    speculative-method: eagle
  state:
    block-pool:
      cached: {shared-0: 7}
      ref_cnt: {'7': 0}
  steps:
  - interface: hybrid-kv-cache-coordinator.find-longest-cache-hit
    caller: kv-cache-manager
    input:
      block_hashes: [shared-0, sibling-1, sibling-2]
      max_length: 39
    as: hit
  expect:
  - steps.hit.result.ok
  - steps.hit.result.value.hit_length == 12
