schema_version: 1
id: vllm
scenarios:
- id: oracle-distributed-aggregate-disjoint-jobs
  description: >-
    tests/v1/kv_connector/unit/offloading_connector/test_worker_metadata.py::test_aggregate_disjoint_jobs.
    Two workers report OffloadingWorkerMetadata with disjoint completed_jobs; the executor's
    KVOutputAggregator.aggregate folds every worker's kv_connector_worker_meta with
    OffloadingWorkerMetadata.aggregate (utils.py:143-152), so the aggregated output carries the
    union {42:1, 7:1, 43:1, 8:1}.
  flow: distributed-kv-output-aggregate
  fixtures: [full-tp1-llama-8b]
  input:
    world_size: 2
    outputs:
    - {kv_connector_worker_meta: {completed_jobs: {"42": 1, "7": 1}}}
    - {kv_connector_worker_meta: {completed_jobs: {"43": 1, "8": 1}}}
  expect:
  - "result.ok && result.value != null && has(result.value.kv_connector_worker_meta)"
  - "result.value.kv_connector_worker_meta.completed_jobs == {'42': 1, '7': 1, '43': 1, '8': 1}"
  - "state['kv-output-aggregator'].expected == 2"
- id: oracle-distributed-turn2-deadline-gate-expired
  description: >-
    tests/v1/kv_connector/unit/test_bidirectional_kv_transfer.py::test_turn2_deadline_gate[expired].
    A turn-2 readback whose remote_blocks_expiry_time (minus the handshake clock offset 0) is
    already past is declined by NixlPullConnectorWorker._read_blocks_for_req
    (pull_worker.py:125-166): no NIXL READ is issued, the request is still reported in
    done_recving, and it is counted as expired, not as a failed transfer.
  fixtures: [full-tp1-llama-8b]
  state:
    nixl-pull-connector-worker: {remote_agents: [remote-engine]}
  steps:
  - flow: distributed-nixl-start-load
    as: load
    input:
      metadata:
        reqs_to_recv:
          req:
            awaiting_kvs: true
            local_block_ids: [[10, 11]]
            remote:
              block_ids: [[20, 21]]
              engine_id: remote-engine
              request_id: decode-req
              host: localhost
              port: 1234
              blocks_expiry_time: 0.0
  - flow: distributed-nixl-get-finished
    as: fin
  expect:
  - "calls['nixl-agent.read-blocks'] == 0"
  - "'req' in steps.fin.result.value.finished_recving"
  - "!('req' in state['nixl-pull-connector-worker@rank0'].recving)"
- id: oracle-distributed-turn2-deadline-gate-far-future
  description: >-
    tests/v1/kv_connector/unit/test_bidirectional_kv_transfer.py::test_turn2_deadline_gate[valid_far_deadline].
    With a far-future deadline the READ proceeds (pull_worker.py:131-134) and the request
    finishes receiving.
  fixtures: [full-tp1-llama-8b]
  state:
    nixl-pull-connector-worker: {remote_agents: [remote-engine]}
  steps:
  - flow: distributed-nixl-start-load
    as: load
    input:
      metadata:
        reqs_to_recv:
          req:
            awaiting_kvs: true
            local_block_ids: [[10, 11]]
            remote:
              block_ids: [[20, 21]]
              engine_id: remote-engine
              request_id: decode-req
              host: localhost
              port: 1234
              blocks_expiry_time: 1.0e12
  - flow: distributed-nixl-get-finished
    as: fin
  expect:
  - "calls['nixl-agent.read-blocks'] == 1"
  - "'req' in steps.fin.result.value.finished_recving && size(steps.fin.result.value.failed_recving) == 0"
  - "!('req' in state['nixl-pull-connector-worker@rank0'].recving)"
