schema_version: 1
id: vllm
scenarios:
  - id: oracle-models-layers-strips-backend-deepstream-when-not-static
    name: A request-level GPU video backend not configured at startup is stripped
    description: >-
      tests/multimodal/media/test_video.py:504
      TestVideoMediaIOMergeKwargs.test_strips_backend_deepstream_when_not_static.
      VideoMediaIO.merge_kwargs(default_kwargs=None, runtime_kwargs={backend: deepstream})
      must not keep backend=deepstream (vllm/multimodal/media/video.py:56-71). Driven
      through the renderer that loads the request's media with trusted per-request
      media_io_kwargs and no server-side video backend.
    fixtures: [full-tp1-llama-8b]
    config:
      trust-request-mm-kwargs: true
      model-is-multimodal: true
    steps:
      - interface: hf-renderer.render-messages
        caller: online-renderer
        as: render
        input:
          media_io_kwargs: {video: {backend: deepstream}}
          messages:
            - role: user
              content:
                - {type: video_url, video_url: {url: "https://example.com/clip.mp4"}}
                - {type: text, text: "Describe this video."}
    expect:
      - "steps.render.result.ok"
      # The effective (merged) video kwargs the loader decodes with must not carry the
      # request's GPU backend: the code strips it (video.py:58-71).
      - "trace.exists(e, e.type == 'call.end' && e.interface.endsWith('merge-kwargs'))"
      - "trace.exists(e, e.type == 'call.end' && e.interface.endsWith('merge-kwargs') && has(e.output.value) && !('backend' in e.output.value && e.output.value.backend == 'deepstream'))"

  - id: oracle-models-layers-ipc-enable-disable-consistency
    name: The P0/P1 multimodal processor cache returns the same items with IPC on, off or the cache off
    description: >-
      tests/multimodal/test_cache.py:219 test_ipc_enable_disable_consistency. The same
      items processed through MultiModalProcessorSenderCache/ReceiverCache (IPC on),
      the processor-only cache and no cache must reach the engine identically
      (vllm/multimodal/cache/__init__.py get_and_update, is_cached). Two identical
      multimodal requests; the second must hit the frontend processor cache and still
      return the same multimodal input.
    fixtures: [full-tp1-llama-8b]
    steps:
      - flow: models-multimodal-process
        as: first
        input: {mm_counts: {image: 1}}
      - flow: models-multimodal-process
        as: second
        input: {mm_counts: {image: 1}}
    expect:
      - "steps.first.result.ok && steps.second.result.ok"
      - "steps.first.result.value == steps.second.result.value"
      # The code under test: a P0 cache lookup (is_cached / get_and_update) per item.
      - "trace.exists(e, e.type == 'call.start' && e.interface.contains('cache') && e.interface.contains('get-and-update'))"
