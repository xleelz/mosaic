schema_version: 1
id: vllm
scenarios:
- id: oracle-attention-attn-spec-kind-decoder
  name: A decoder layer's KV-cache kind follows its MLA and sliding-window signals
  description: >-
    tests/v1/attention/test_backend_per_kind.py::test_get_attn_spec_kind_decoder (line 47).
    get_attn_spec_kind (vllm/v1/attention/selector.py:64-102) maps a decoder layer to
    full_attention, mla_attention, sliding_window_mla or sliding_window. Its only caller,
    get_attn_backend (selector.py:180-188), uses the kind to look up
    AttentionConfig.backend_per_kind; so with a distinct backend per kind, the backend handed
    to the platform names the kind. Four decoder layers, one per signal pair. The scenario should set
    backend_per_kind {full_attention: FLASH_ATTN, mla_attention: FLASHINFER_MLA, sliding_window_mla:
    TRITON_MLA, sliding_window: FLEX_ATTENTION}, but the model has no such config id (validation
    rejects "attention-backend-per-kind"), so it runs without it and the expectations stay the test's.
  fixtures: [full-tp1-llama-8b]
  steps:
  - {interface: selector.get-attn-backend, caller: gpu-model-runner, as: full,
     input: {head_size: 128, dtype: bfloat16, kv_cache_dtype: auto, use_mla: false, has_sliding_window: false, attn_type: decoder, use_sparse: false, has_sink: false}}
  - {interface: selector.get-attn-backend, caller: gpu-model-runner, as: mla,
     input: {head_size: 576, dtype: bfloat16, kv_cache_dtype: auto, use_mla: true, has_sliding_window: false, attn_type: decoder, use_sparse: false, has_sink: false}}
  - {interface: selector.get-attn-backend, caller: gpu-model-runner, as: swmla,
     input: {head_size: 576, dtype: bfloat16, kv_cache_dtype: auto, use_mla: true, has_sliding_window: true, attn_type: decoder, use_sparse: false, has_sink: false}}
  - {interface: selector.get-attn-backend, caller: gpu-model-runner, as: sw,
     input: {head_size: 128, dtype: bfloat16, kv_cache_dtype: auto, use_mla: false, has_sliding_window: true, attn_type: decoder, use_sparse: false, has_sink: false}}
  expect:
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && e.input.attn_selector_config.head_size == 128 && !e.input.attn_selector_config.has_sliding_window && e.input.selected_backend == 'FLASH_ATTN')"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && e.input.attn_selector_config.use_mla && !e.input.attn_selector_config.has_sliding_window && e.input.selected_backend == 'FLASHINFER_MLA')"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && e.input.attn_selector_config.use_mla && e.input.attn_selector_config.has_sliding_window && e.input.selected_backend == 'TRITON_MLA')"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && !e.input.attn_selector_config.use_mla && e.input.attn_selector_config.has_sliding_window && e.input.selected_backend == 'FLEX_ATTENTION')"

- id: oracle-attention-mla-kv-cache-spec-uses-layer-cache-dtype
  name: An MLA layer's KV-cache spec carries the layer's cache dtype and quant mode
  description: >-
    tests/v1/attention/test_mla_backends.py::test_mla_kv_cache_spec_uses_layer_cache_dtype
    (line 217), fp8_ds_mla case. MLAAttention.get_kv_cache_spec
    (vllm/model_executor/layers/attention/mla_attention.py) builds an MLAAttentionSpec with
    cache_dtype_str = the layer's kv_cache_dtype, kv_quant_mode FP8_PER_TENSOR for fp8_ds_mla,
    and a 656-byte-per-token page (64 * 656 at block_size 64). Driven through the worker's
    get_kv_cache_spec with an MLA model (head_size 576, one latent KV head) loaded on the runner.
  fixtures: [full-tp1-llama-8b]
  config:
    block-size: 64
    kv-cache-dtype: fp8_ds_mla
  state:
    gpu-model-runner:
      model:
        architecture: DeepseekV3ForCausalLM
        name: deepseek-ai/DeepSeek-V3
        dtype_bytes: 2
        head_size: 576
        num_kv_heads: 1
        num_attention_heads: 128
        num_hidden_layers: 61
        hidden_size: 7168
        use_mla: true
        kv_lora_rank: 512
        qk_rope_head_dim: 64
        is_hybrid: false
        torch_dtype: bfloat16
        vocab_size: 129280
        max_position_embeddings: 163840
        eos_token_id: 1
        uses_mrope: false
        uses_prompt_embeds: false
        weights_bytes: 1
  steps:
  - interface: gpu-worker-impl.get-kv-cache-spec
    caller: multiproc-executor
    on: rank0
    input: {}
    as: spec
  expect:
  - steps.spec.result.ok
  - steps.spec.result.value.cache_dtype_str == 'fp8_ds_mla'
  - steps.spec.result.value.kv_quant_mode == 'fp8_per_tensor'
  - steps.spec.result.value.page_size_bytes == 64 * 656
