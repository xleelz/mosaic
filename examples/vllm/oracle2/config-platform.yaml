schema_version: 1
id: vllm
scenarios:
- id: oracle-config-platform-needs-dp-coordination-dp2-internal-lb
  description: >-
    tests/test_config.py::test_needs_dp_coordination[facebook/opt-125m-2-False-True].
    VllmConfig.needs_dp_coordinator (vllm/config/vllm.py:843-862) is true when
    data_parallel_size > 1 and the model is MoE or the LB is internal.
  flow: config-create-engine-config
  fixtures: [full-tp1-llama-8b]
  input: {data_parallel_size: 2, data_parallel_external_lb: false}
  expect:
  - "result.ok && has(result.value.needs_dp_coordinator) && result.value.needs_dp_coordinator == true"
- id: oracle-config-platform-needs-dp-coordination-dp1
  description: >-
    tests/test_config.py::test_needs_dp_coordination[facebook/opt-125m-1-False-False].
    With data_parallel_size 1 no DP coordinator is needed (vllm/config/vllm.py:858).
  flow: config-create-engine-config
  fixtures: [full-tp1-llama-8b]
  input: {data_parallel_size: 1, data_parallel_external_lb: false}
  expect:
  - "result.ok && has(result.value.needs_dp_coordinator) && result.value.needs_dp_coordinator == false"
