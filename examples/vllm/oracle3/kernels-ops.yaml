schema_version: 1
id: vllm
scenarios:
- id: oracle-kernels-ops-quantize-contiguous
  name: quantize_fp8_pad_head_dim_triton pads head_dim to a multiple of 16
  description: >-
    tests/kernels/core/test_vit_fp8_quant.py::test_quantize_contiguous (line 44).
    quantize_fp8_pad_head_dim_triton (vllm/kernels/triton/qkv_padded_fp8_quant.py:87-137)
    returns (seq, heads, round_up(head_dim, 16)); head_dim 72 -> 80, 80 -> 80, 128 -> 128.
    The FP8 values and zero padding are untranslatable.
  fixtures: [full-tp1-llama-8b]
  steps:
  - {interface: qkv-padded-fp8-quant.quantize-fp8-pad-head-dim-triton, caller: gpu-worker, input: {num_tokens: 64, hidden_size: 72, dtype_bytes: 2}, as: d72}
  - {interface: qkv-padded-fp8-quant.quantize-fp8-pad-head-dim-triton, caller: gpu-worker, input: {num_tokens: 64, hidden_size: 80, dtype_bytes: 2}, as: d80}
  - {interface: qkv-padded-fp8-quant.quantize-fp8-pad-head-dim-triton, caller: gpu-worker, input: {num_tokens: 256, hidden_size: 128, dtype_bytes: 2}, as: d128}
  expect:
  - "steps.d72.result.ok && steps.d72.result.value.padded_head_dim == 80"
  - "steps.d80.result.ok && steps.d80.result.value.padded_head_dim == 80"
  - "steps.d128.result.ok && steps.d128.result.value.padded_head_dim == 128"
- id: oracle-kernels-ops-fusion-silu-and-mul-quant-fp8-static
  name: fuse_act_quant fuses silu_and_mul + static FP8 quant exactly once
  description: >-
    tests/compile/passes/test_silu_mul_quant_fusion.py::test_fusion_silu_and_mul_quant (line 273),
    TestSiluMulFp8QuantModel cases. ActivationQuantFusionPass (vllm/compilation/passes/fusion/act_quant_fusion.py:277)
    matches once and the graph then holds _C::silu_and_mul_quant.
  fixtures: [full-tp1-llama-8b]
  config: {fuse-act-quant: true, eliminate-noops: true}
  flow: kernels-ops-post-grad-pass-manager
  input: {graph_patterns: ["silu_and_mul+static_fp8_quant"]}
  expect:
  - "result.ok && calls['activation-quant-fusion-pass.call'] == 1"
  - "ctx.fused == ['_C::silu_and_mul_quant']"
- id: oracle-kernels-ops-fusion-silu-and-mul-quant-block
  name: fuse_act_quant fuses silu_and_mul + per-group (128) FP8 quant on CUDA
  description: >-
    tests/compile/passes/test_silu_mul_quant_fusion.py::test_fusion_silu_and_mul_quant (line 273),
    TestSiluMulBlockQuantModel cases (CUDA). ActivationQuantFusionPass registers SiluMulBlockQuantPattern
    for kFp8Dynamic128Sym/64Sym on CUDA (act_quant_fusion.py:43-44, 290-307); the fused op is
    _C::silu_and_mul_per_block_quant.
  fixtures: [full-tp1-llama-8b]
  config: {fuse-act-quant: true, eliminate-noops: true}
  flow: kernels-ops-post-grad-pass-manager
  input: {graph_patterns: ["silu_and_mul+per_block_fp8_quant"]}
  expect:
  - "result.ok && calls['activation-quant-fusion-pass.call'] == 1"
  - "has(ctx.fused) && ctx.fused == ['_C::silu_and_mul_per_block_quant']"
- id: oracle-kernels-ops-fusion-silu-and-mul-quant-nvfp4
  name: fuse_act_quant fuses silu_and_mul + NVFP4 quant on CUDA
  description: >-
    tests/compile/passes/test_silu_mul_quant_fusion.py::test_fusion_silu_and_mul_quant (line 273),
    TestSiluMulNvfp4QuantModel case. SiluMulNvfp4QuantPattern is registered when
    _C.silu_and_mul_nvfp4_quant exists (act_quant_fusion.py:36-40, 287-288).
  fixtures: [full-tp1-llama-8b]
  config: {fuse-act-quant: true, eliminate-noops: true}
  flow: kernels-ops-post-grad-pass-manager
  input: {graph_patterns: ["silu_and_mul+nvfp4_quant"]}
  expect:
  - "result.ok && calls['activation-quant-fusion-pass.call'] == 1"
  - "has(ctx.fused) && ctx.fused == ['_C::silu_and_mul_nvfp4_quant']"
