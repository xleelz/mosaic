- id: oracle-config-platform-custom-histogram-buckets-default-none
  name: ObservabilityConfig() leaves custom_histogram_buckets None
  description: >-
    tests/config/test_observability.py::test_custom_histogram_buckets_default_none. Code under
    test: vllm/config/observability.py (custom_histogram_buckets: dict | None = None; validator at
    :184-215 skips None).
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: observability-config.init
    caller: operator
    input: {}
    as: obs
  expect:
  - steps.obs.result.ok
  - '!has(steps.obs.result.value.custom_histogram_buckets) || steps.obs.result.value.custom_histogram_buckets == null'
