schema_version: 1
id: vllm
scenarios:
- id: oracle-config-platform-mp-reducer
  name: Building AsyncLLM registers a multiprocessing reducer for VllmConfig
  description: >-
    tests/config/test_mp_reducer.py::test_mp_reducer (the test's opt-125m with
    gpu_memory_utilization 0.1 becomes the world's Llama-8B at the default utilization). Code under test: AsyncLLM.__init__
    (vllm/v1/engine/async_llm.py:132) calls maybe_register_config_serialize_by_value
    (vllm/transformers_utils/config.py:1105-1160), which, when transformers_modules can't be
    imported, registers a cloudpickle-by-value reducer for VllmConfig with
    multiprocessing.reducer.register. The test patches reducer.register only to observe the call;
    here the call is observed in the trace.
  fixtures: [full-tp1-llama-8b]
  config:
    disable-log-stats: true
  steps:
  - flow: engine-startup
    as: up
  expect:
  - steps.up.result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface.contains('serialize-by-value'))

