schema_version: 1
id: vllm
scenarios:
- id: oracle-models-layers-reject-fused-moe-lora-before-registration
  name: A fused 3D MoE LoRA on a 2D MoE wrapper is rejected before it is cached
  description: >-
    tests/lora/test_lora_manager.py::test_reject_fused_moe_lora_before_registration (line 55).
    LoRAModelManager.add_adapter -> _add_adapter -> _validate_moe_lora_format
    (vllm/lora/model_manager.py:412-415, 1252-1272) raises ValueError naming
    enable_mixed_moe_lora_format=True, is_3d_lora_weight=True and the module, and nothing is registered.
  fixtures: [full-tp1-llama-8b]
  config: {max-cpu-loras: 1}
  steps:
  - {interface: lru-cache-lora-model-manager.add-adapter, caller: gpu-worker, input: {adapter_id: 7}, as: add}
  - {interface: lru-cache-lora-model-manager.list-adapters, caller: gpu-worker, input: {}, as: ls}
  expect:
  - "!steps.add.result.ok && steps.add.result.error.code == 'value-error'"
  - "!steps.add.result.ok && steps.add.result.error.message.contains('enable_mixed_moe_lora_format=True') && steps.add.result.error.message.contains('is_3d_lora_weight=True') && steps.add.result.error.message.contains('model.layers.0.mlp.experts')"
  - "!(7 in state['lru-cache-lora-model-manager@rank0'].registered) && !(7 in steps.ls.result.value.registered)"
- id: oracle-models-layers-preset-parses
  name: Every TurboQuant preset name parses into a TurboQuant config
  description: >-
    tests/quantization/test_turboquant.py::TestTurboQuantConfig::test_preset_parses (line 87).
    TurboQuantConfig.from_cache_dtype (vllm/model_executor/layers/quantization/turboquant/config.py:216-235)
    accepts the four TQ_PRESETS. The model has no TurboQuantConfig; the nearest code is the
    kv_cache_dtype -> KVQuantMode mapping, driven here.
  fixtures: [full-tp1-llama-8b]
  steps:
  - {interface: kv-quant-mode.get-kv-quant-mode, caller: gpu-worker, input: {kv_cache_dtype: turboquant_k8v4}, as: k8v4}
  - {interface: kv-quant-mode.get-kv-quant-mode, caller: gpu-worker, input: {kv_cache_dtype: turboquant_4bit_nc}, as: b4}
  - {interface: kv-quant-mode.get-kv-quant-mode, caller: gpu-worker, input: {kv_cache_dtype: turboquant_k3v4_nc}, as: k3v4}
  - {interface: kv-quant-mode.get-kv-quant-mode, caller: gpu-worker, input: {kv_cache_dtype: turboquant_3bit_nc}, as: b3}
  expect:
  - "[steps.k8v4, steps.b4, steps.k3v4, steps.b3].all(s, s.result.ok && s.result.value.is_turboquant)"
- id: oracle-models-layers-terratorch-inference
  name: A pooling-runner model serves LLM.encode with the plugin pooling task
  description: >-
    tests/models/test_terratorch.py::test_inference (line 26). LLM.encode(prompt,
    pooling_task="plugin") on a runner="pooling" model returns one PoolingRequestOutput
    (vllm/entrypoints/pooling/offline.py:62-134). The NaN check on the tensor is untranslatable.
  fixtures: [full-tp1-llama-8b]
  config: {runner: pooling}
  max_events: 500000
  max_iterations: 200000
  steps:
  - {interface: llm.encode, caller: python-user, input: {prompts: ["<image>"], pooling_task: plugin}, as: enc}
  expect:
  - "steps.enc.result.ok && steps.enc.result.value.num_outputs == 1"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'llm.run-tiling-engine' && e.input.pooling_task == 'plugin')"
