- id: oracle-attention-glm5next-indexer-kernel-block-sizes
  name: 'Glm5NextIndexerBackend.get_supported_kernel_block_sizes: index_kpool times the DeepGEMM paged-MQA page sizes'
  description: >-
    tests/v1/attention/test_glm5next_indexer_block_sizes.py::test_glm5next_indexer_kernel_block_sizes
    (CUDA non-SM120 case: [4*32, 4*64]). Code under test: vllm/v1/attention/backends/mla/indexer.py:296-306
    and vllm/utils/deep_gemm.py:33-36. The GLM indexer backend inherits the name
    DEEPSEEK_V32_INDEXER (indexer.py:280) but overrides the kernel block sizes; the model's backend
    descriptor table is the only place kernel block sizes live.
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: attention-backend.describe
    caller: gpu-worker
    input:
      backend: DEEPSEEK_V32_INDEXER
    as: idx
  expect:
  - steps.idx.result.ok
  - steps.idx.result.value.kernel_block_sizes == [128, 256]

- id: oracle-attention-deepseek-v4-rocm-adaptive-builders-cg-support
  name: 'DeepSeek V4 ROCm AITER sparse MLA builder: ALWAYS under adaptive verification'
  description: >-
    tests/v1/attention/test_deepseek_v4_rocm_adaptive.py::test_deepseek_v4_rocm_adaptive_builders_support_varlen_full_graphs
    (adaptive half). Code under test: vllm/models/deepseek_v4/amd/rocm.py:471-484
    (DeepseekV4ROCMAiterMLASparseMetadataBuilder, backend name ROCM_FLASHMLA_SPARSE_DSV4 at :654-661)
    and :552-565 (DeepseekV4ROCMAiterSparseSWAMetadataBuilder): speculative_config.enable_adaptive_verification
    makes both ALWAYS.
  fixtures: [full-tp1-llama-8b]
  config:
    enable-adaptive-verification: true
  steps:
  - interface: attention-metadata-builder.get-cudagraph-support
    caller: gpu-worker
    input:
      backend: ROCM_FLASHMLA_SPARSE_DSV4
    as: adaptive
  expect:
  - steps.adaptive.result.ok && steps.adaptive.result.value.support == 'ALWAYS'

- id: oracle-attention-deepseek-v4-rocm-fixed-builders-cg-support
  name: 'DeepSeek V4 ROCm AITER sparse MLA builder: UNIFORM_BATCH without adaptive verification'
  description: >-
    tests/v1/attention/test_deepseek_v4_rocm_adaptive.py::test_deepseek_v4_rocm_adaptive_builders_support_varlen_full_graphs
    (fixed half). Without adaptive verification the builders fall back to the parents'
    _cudagraph_support, UNIFORM_BATCH (vllm/models/deepseek_v4/sparse_mla.py:125,
    vllm/v1/attention/backends/mla/sparse_swa.py:441).
  fixtures: [full-tp1-llama-8b]
  config:
    enable-adaptive-verification: false
  steps:
  - interface: attention-metadata-builder.get-cudagraph-support
    caller: gpu-worker
    input:
      backend: ROCM_FLASHMLA_SPARSE_DSV4
    as: fixed
  - interface: attention-metadata-builder.get-cudagraph-support
    caller: gpu-worker
    input:
      backend: DEEPSEEK_SPARSE_SWA
    as: swa
  expect:
  - steps.fixed.result.ok && steps.fixed.result.value.support == 'UNIFORM_BATCH'
  - steps.swa.result.ok && steps.swa.result.value.support == 'UNIFORM_BATCH'
