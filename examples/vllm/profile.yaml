# Profile for the vLLM v0.32.0 build (docs/PIPELINE.md, DESIGN §13).
profile_version: 1
id: vllm
name: vLLM 0.32 (built from code)
workspace: examples/vllm

snapshot:
  repo: vllm-project/vllm
  ref: v0.32.0
  sha: 5df63a7203cdb9328d824a27b682e77c7b9928be
  path: /home/lbethay/.cache/mosaic-bench/vllm-0.32.0
  url: https://github.com/vllm-project/vllm/tree/5df63a7203cdb9328d824a27b682e77c7b9928be
  forbidden: ["**/*.env*", "**/*.age", "**/*.pem", "**/*.key", "**/credentials*", "**/.netrc"]

evidence:
  not_evidence: ["**/*.md", docs/**, tests/**, benchmarks/**, examples/**, tools/**, .github/**, docker/**]
  cite_form: "path:line or path:line-end, relative to snapshot.path, one source per string"

inventory:
  out: inventory.json
  plugins: [python-gpu]
  include_test_support: false
  kinds:
    - {kind: http-route, owner: path, cover: "an interface on the serving component named <method>-<path slug> citing the route"}
    - {kind: cli-command, owner: path, cover: "a cli interface citing the subcommand"}
    - {kind: python-api, owner: path, cover: "an interface on the API class named after the method"}
    - {kind: engine-rpc, owner: path, cover: "the worker/engine method's interface, called via collective_rpc or the engine-core client"}
    - {kind: busy-loop, owner: path, cover: "a flow with entry.repeat or timers that cites the loop"}
    - {kind: torch-op, owner: path, cover: "the op's interface (kind kernel) citing its registration; latency as a CEL expression of the shapes", level: registered}
    - {kind: torch-op-wrapper, owner: path, cover: "the Python wrapper's interface calling the op"}
    - {kind: cuda-kernel, owner: path, cover: "named in the launching op's behavior narrative (citation)", level: registered}
    - {kind: triton-kernel, owner: path, cover: "named in the launching function's behavior narrative (citation)", level: registered}
    - {kind: model-registry, owner: models-layers, cover: "an entry in the model registry state, resolved by model-registry.resolve", level: registered}
    - {kind: plugin, owner: path, cover: "the plugin loader's behavior cites it"}
    - {kind: python-cli, owner: path, cover: "a flow citing the main"}
  skip_rules:
    - kinds: [python-cli]
      match: "examples/**, benchmarks/**, tools/**"
      reason: "not an entry point of the product: example, benchmark or repo tooling script"
  manual: []
  audit:
    precision_sample: 40
    recall_sources: [vllm/_custom_ops.py, csrc/torch_bindings.cpp, vllm/model_executor/models/registry.py, vllm/entrypoints/openai/api_server.py]
    targets: {precision: 0.9, recall: 0.9}

areas:
  - id: serving-api
    module: api-server
    owns: [vllm/entrypoints/**, vllm/renderers/**, vllm/tool_parsers/**, vllm/reasoning/**, vllm/parser/**, vllm/tokenizers/**, vllm/transformers_utils/**, vllm/inputs/**, vllm/outputs.py, vllm/sampling_params.py, vllm/pooling_params.py]
    entry_points: "OpenAI-compatible routes (chat completions, completions, embeddings, responses, models, health), the CLI (vllm serve, bench), LLM.generate/chat/encode, request validation, tokenization, detokenization and streaming"
  - id: engine-core
    module: engine-core
    owns: [vllm/v1/engine/**, vllm/engine/**, vllm/v1/executor/**, vllm/v1/metrics/**, vllm/v1/fault_tolerance/**, vllm/v1/request.py, vllm/v1/outputs.py, vllm/v1/serial_utils.py, vllm/v1/utils.py]
    entry_points: "AsyncLLM / LLMEngine and their client, the EngineCore process and its busy loop, add/abort request, output processing, executors (uniproc, multiproc, ray), shutdown and fault tolerance"
  - id: scheduler-kv
    module: engine-core
    owns: [vllm/v1/core/**, vllm/v1/kv_offload/**, vllm/v1/simple_kv_offload/**, vllm/v1/kv_hints/**, vllm/v1/hisparse/**, vllm/v1/structured_output/**]
    entry_points: "scheduler step (continuous batching, chunked prefill, preemption), KV cache manager and block pool, prefix caching, KV offload, structured output grammar bookkeeping"
  - id: worker-runner
    module: gpu-worker
    owns: [vllm/v1/worker/**, vllm/v1/sample/**, vllm/v1/spec_decode/**, vllm/v1/pool/**, vllm/v1/watermarking/**, vllm/device_allocator/**, vllm/v1/cudagraph_dispatcher.py, vllm/forward_context.py]
    entry_points: "worker init/load model/determine KV cache size/execute_model, the GPU model runner (input prep, CUDA graphs, sampling), speculative decoding, pooling"
  - id: attention
    module: gpu-worker
    owns: [vllm/v1/attention/**, vllm/attention/**, vllm/vllm_flash_attn/**, csrc/attention/**]
    entry_points: "attention backends and their selection, metadata builders, paged attention and FlashAttention calls"
  - id: distributed
    module: gpu-worker
    owns: [vllm/distributed/**, "csrc/custom_all_reduce*", "csrc/custom_all_gather_reduce_scatter*", csrc/custom_collective_common.cuh, vllm/v1/kv_cache_interface.py]  # kv_cache_interface: round 4 decision, distributed models it (kv-cache-interface)
    entry_points: "parallel state (TP/PP/DP groups), collective ops (all-reduce, all-gather), the custom all-reduce, KV transfer connectors (disaggregated prefill), expert parallel"
  - id: models-layers
    module: gpu-worker
    owns: [vllm/model_executor/**, vllm/models/**, vllm/lora/**, vllm/multimodal/**]
    entry_points: "the model registry and loader (weights download/load, quantization), model forward for representative architectures (Llama, Qwen, DeepSeek MoE), layers (linear, rotary, MoE, sampler logits), LoRA, multimodal processing"
  - id: kernels-ops
    module: gpu-worker
    owns: [csrc/**, vllm/_custom_ops.py, vllm/_xpu_ops.py, vllm/_aiter_ops.py, vllm/_*.py, vllm/kernels/**, vllm/triton_utils/**, vllm/compilation/**, vllm/ir/**, vllm/cute_utils/**, vllm/utils/**]
    except: [csrc/attention/**, "csrc/custom_all_reduce*", "csrc/custom_all_gather_reduce_scatter*"]
    entry_points: "torch custom ops and their Python wrappers, CUDA and Triton kernels (as latency models), torch.compile integration and CUDA graph capture"
  - id: config-platform
    module: control
    owns: [vllm/config/**, vllm/platforms/**, vllm/plugins/**, vllm/envs.py, vllm/logging_utils/**, vllm/profiler/**, vllm/snapshot/**, vllm/assets/**, vllm/benchmarks/**, setup.py, pyproject.toml, vllm/scalar_type.py]
    entry_points: "EngineArgs to VllmConfig resolution and validation, platform detection and plugins, environment variables, profiling"

overrides:
  - {symbol: "EngineArgs (vllm/engine/arg_utils.py)", area: config-platform, reason: "argument parsing and config resolution belong with the config it builds"}
  - {symbol: "Scheduler.update_from_output", area: scheduler-kv, reason: "the scheduler owns request state transitions after each step"}

shared_components:
  - {id: gpu-memory, kind: datastore, interface_kind: io, naming: "gpu-memory.<op> (allocate, free, profile-peak)"}
  - {id: hf-hub, kind: external, interface_kind: http, naming: "hf-hub.<op> (download-config, download-weights)"}
  - {id: local-disk, kind: datastore, interface_kind: io, naming: "local-disk.<op>"}

cross_area_rules:
  - "Requests flow serving-api -> engine-core (AsyncLLM.add_request -> EngineCoreClient) -> engine-core busy loop -> scheduler-kv (schedule) -> engine-core executor -> worker-runner (execute_model) -> models-layers (forward) -> attention / kernels-ops; outputs flow back through the engine core's output processor to serving-api."
  - "Kernels are modeled as interfaces of kind kernel whose latency_ms is a CEL expression of the token/batch shape; their bodies are not simulated."
  - "Tensor-parallel ranks are instances of gpu-worker; collectives are parallel joins (join: all) owned by distributed."

shared_data:
  - {datum: "KV cache blocks and block tables", owner: scheduler-kv, readers: [worker-runner, attention, engine-core]}
  - {datum: "request state (status, num_computed_tokens, output tokens)", owner: scheduler-kv, readers: [engine-core, worker-runner]}
  - {datum: "the loaded model weights", owner: models-layers, readers: [worker-runner]}
  - {datum: "the resolved VllmConfig", owner: config-platform, readers: [all]}

naming:
  component: "the class in kebab-case (EngineCoreProc -> engine-core-proc); a module of functions takes its file name (_custom_ops.py -> custom-ops)"
  interface: "the method or function in kebab-case (add_request -> add-request); routes are <method>-<path slug> (POST /v1/chat/completions -> post-v1-chat-completions)"
  routes: "<method>-<path>: lowercase, {param} -> param, other chars -> -, cut to 64"
  messages: "engine-core client messages (ADD, ABORT, UTILITY) are interfaces on engine-core-proc named handle-<type>"
  schema: "area prefix in PascalCase (ServingChatRequest, SchedKvBlockTable); shared contracts keep the owner's name"
  config: "the engine arg in kebab-case (max_num_seqs -> max-num-seqs; gpu_memory_utilization -> gpu-memory-utilization); attributes.key holds the original"
  fixture: "the deployment it describes: tp1-llama-8b, tp4-llama-70b, prefix-cache-warm, kv-nearly-full"
  instance: "rank0..rank7 for GPU workers; dp0.. for data-parallel engine cores; api0 for API server processes"
  scenario: "<area>-<flow>-<case>"
  forbidden: [handler, manager, service, worker, client, request, result, error, model, util]
  examples:
    - {entry: "http-route POST /v1/chat/completions", component: openai-serving-chat, interface: openai-serving-chat.post-v1-chat-completions}
    - {entry: "engine-rpc execute_model", component: gpu-worker-impl, interface: gpu-worker-impl.execute-model}
    - {entry: "torch-op paged_attention_v1", component: custom-ops, interface: custom-ops.paged-attention-v1}

errors:
  code_from: "the exception class in kebab-case (ValueError -> value-error, EngineDeadError -> engine-dead-error); OpenAI routes use the OpenAI error type (invalid_request_error, ...) with the HTTP status"
  status_from: "the HTTP status for routes; 0 elsewhere"
  verify_against: [vllm/entrypoints/openai/protocol.py, vllm/v1/engine/exceptions.py]
  table:
    - {code: invalid_request_error, status: 400, retryable: false, source: "vllm/entrypoints/openai/protocol.py"}
    - {code: engine-dead-error, status: 500, retryable: false, source: "vllm/v1/engine/exceptions.py"}

shared_shapes:
  fields:
    request_id: "string, the engine request id (chatcmpl-..., cmpl-...)"
    prompt_token_ids: "list of int"
    num_tokens: "int"
    sampling_params: "object: temperature, top_p, max_tokens, stop, n, seed, ignore_eos"
    finish_reason: "string: stop | length | abort | null"
    block_ids: "list of int, KV cache block ids"
  envelope: "HTTP routes take {path, body, headers}; responses are the OpenAI JSON body"
  schemas:
    - {id: EngineCoreRequest, owner: engine-core, fields: [request_id, prompt_token_ids, sampling_params, arrival_time, priority]}
    - {id: SchedulerOutput, owner: scheduler-kv, fields: [scheduled_new_reqs, scheduled_cached_reqs, num_scheduled_tokens, total_num_scheduled_tokens, finished_req_ids]}
    - {id: ModelRunnerOutput, owner: worker-runner, fields: [req_ids, sampled_token_ids]}
  seams:
    - {interface: async-llm.generate, owner: engine-core, callers: [serving-api]}
    - {interface: engine-core.add-request, owner: engine-core, callers: [serving-api]}
    - {interface: scheduler.schedule, owner: scheduler-kv, callers: [engine-core]}
    - {interface: scheduler.update-from-output, owner: scheduler-kv, callers: [engine-core]}
    - {interface: gpu-worker-impl.execute-model, owner: worker-runner, callers: [engine-core]}
    - {interface: kv-cache-manager.allocate-slots, owner: scheduler-kv, callers: [scheduler-kv]}
    - {interface: tensor-model-parallel.all-reduce, owner: distributed, callers: [models-layers]}

config:
  sources:
    - {path: "vllm/config/*.py (pydantic Field defaults) and vllm/engine/arg_utils.py (EngineArgs defaults)", role: default, format: code}
    - {path: "the fixture's deployment (engine args given to `vllm serve`)", role: deployed, format: fixture}
  required:
    - {key: max_num_seqs, owner: scheduler-kv}
    - {key: max_num_batched_tokens, owner: scheduler-kv}
    - {key: enable_chunked_prefill, owner: scheduler-kv}
    - {key: enable_prefix_caching, owner: scheduler-kv}
    - {key: block_size, owner: scheduler-kv}
    - {key: gpu_memory_utilization, owner: worker-runner}
    - {key: max_model_len, owner: config-platform}
    - {key: tensor_parallel_size, owner: distributed}
    - {key: scheduling_policy, owner: scheduler-kv}
  units: "tokens, blocks, bytes; ms for time"

instances:
  groups:
    - {component: gpu-worker, default: [rank0], summary: "a GPU worker process (one per tensor-parallel rank)"}
  entry_instance: rank0

fixtures:
  file: fixtures.yaml
  worlds:
    - {id: tp1-llama-8b, summary: "one 80 GB GPU (rank0), Llama-3.1-8B-Instruct, `vllm serve` defaults on an H100 (block 16, max_num_seqs 1024, max_num_batched_tokens 8192 via usage-context defaults, chunked prefill and prefix caching on)"}
    - {id: tp4-llama-70b, summary: "four GPUs (rank0..rank3), Llama-3.1-70B-Instruct, TP 4", extends: [tp1-llama-8b]}
    - {id: small-batch-limits, summary: "tp1 with max_num_seqs 2 and max_num_batched_tokens 64", extends: [tp1-llama-8b]}
    - {id: prefix-caching-off, summary: "tp1 with prefix caching off", extends: [tp1-llama-8b]}
  # KV pool sizes, cached prefixes and the like are area state: scheduler-kv defines
  # `scheduler-kv-nearly-full` and `scheduler-kv-prefix-warm` as area fixtures.
  canonical_names:
    model: meta-llama/Llama-3.1-8B-Instruct
    served_model_name: llama-8b
    request_id_prefix: chatcmpl-

oracle:
  test_dirs: [tests]
  include: ["**/test_*.py"]
  exclude: ["tests/evals/**", "tests/benchmarks/**", "tests/standalone_tests/**", "tests/models/**/test_*accuracy*.py"]
  area_globs:
    - {glob: "tests/entrypoints/**", area: serving-api}
    - {glob: "tests/tokenizers/**", area: serving-api}
    - {glob: "tests/detokenizer/**", area: serving-api}
    - {glob: "tests/reasoning/**", area: serving-api}
    - {glob: "tests/renderers/**", area: serving-api}
    - {glob: "tests/parser/**", area: serving-api}
    - {glob: "tests/v1/engine/**", area: engine-core}
    - {glob: "tests/v1/executor/**", area: engine-core}
    - {glob: "tests/v1/shutdown/**", area: engine-core}
    - {glob: "tests/v1/fault_tolerance/**", area: engine-core}
    - {glob: "tests/v1/metrics/**", area: engine-core}
    - {glob: "tests/engine/**", area: engine-core}
    - {glob: "tests/v1/core/**", area: scheduler-kv}
    - {glob: "tests/v1/kv_offload/**", area: scheduler-kv}
    - {glob: "tests/v1/simple_kv_offload/**", area: scheduler-kv}
    - {glob: "tests/v1/structured_output/**", area: scheduler-kv}
    - {glob: "tests/v1/worker/**", area: worker-runner}
    - {glob: "tests/v1/sample/**", area: worker-runner}
    - {glob: "tests/samplers/**", area: worker-runner}
    - {glob: "tests/v1/spec_decode/**", area: worker-runner}
    - {glob: "tests/v1/cudagraph/**", area: worker-runner}
    - {glob: "tests/v1/attention/**", area: attention}
    - {glob: "tests/distributed/**", area: distributed}
    - {glob: "tests/v1/distributed/**", area: distributed}
    - {glob: "tests/v1/kv_connector/**", area: distributed}
    - {glob: "tests/model_executor/**", area: models-layers}
    - {glob: "tests/models/**", area: models-layers}
    - {glob: "tests/lora/**", area: models-layers}
    - {glob: "tests/multimodal/**", area: models-layers}
    - {glob: "tests/quantization/**", area: models-layers}
    - {glob: "tests/kernels/**", area: kernels-ops}
    - {glob: "tests/compile/**", area: kernels-ops}
    - {glob: "tests/cuda/**", area: kernels-ops}
    - {glob: "tests/config/**", area: config-platform}
    - {glob: "tests/platforms/**", area: config-platform}
    - {glob: "tests/plugins/**", area: config-platform}
    - {glob: "tests/test_config.py", area: config-platform}
    - {glob: "tests/test_envs.py", area: config-platform}
  sample: {per_area_min: 3, total: 36, seed: 1, build_n: 3}
  run: never
  area_of_test: "oracle.area_globs, else the area owning the code under test"

benchmark:
  file: BENCHMARK.md
  groups: [serving, scheduling-kv, execution-parallel, engine-lifecycle]
  default_world: [full-tp1-llama-8b]

independence:
  never_read: []
  area_may_read: [skeleton.yaml, fixtures.yaml, inventory.json, profile.yaml, "own files", "own build-oracle sample", "owner fragments, for contracts only"]
  area_never_read: ["other areas' notes", BENCHMARK.md, judge/**, oracle/**]
  reconcile_may_read: ["other areas' fragments, for contracts and seeded state"]
  oracle_may_read: ["vllm.json", "the snapshot's tests and code"]
  oracle_never_read: [notes/**, BENCHMARK.md, judge/**]
  judge_may_read: ["vllm.json", fragments/**, notes/**, BENCHMARK.md, "the snapshot's docs and tests"]
  upstream_checkout: null

scale:
  area_entries: [20, 600]
  per_area:
    components: [15, 80]
    flows: [5, 14]
    scenarios: [25, 60]
  gates:
    coverage_min: 0.9
    behavior_coverage_min: 0.85
    unexecuted_fail_branches: 0
    cite_sample: 15
    mocks: 0
    write_then_read: required
    min_modeled: 0.5
    min_substantive: 0.5
    max_trivial: 0.35

# User-visible features (DESIGN §13.1 item 19). Each owner models the feature with a flow tagged
# `feature:<id>` that a scenario runs, or skips it in skips/<area>.features.json with a reason.
features:
  - {id: continuous-batching, owner: scheduler-kv, summary: "requests join and leave the running batch every step", sources: [vllm/v1/core/sched/scheduler.py]}
  - {id: chunked-prefill, owner: scheduler-kv, summary: "long prompts prefilled in chunks within the token budget", sources: [enable_chunked_prefill]}
  - {id: prefix-caching, owner: scheduler-kv, summary: "automatic prefix caching of full KV blocks", sources: [enable_prefix_caching]}
  - {id: preemption, owner: scheduler-kv, summary: "preempt and recompute under KV pressure", sources: [vllm/v1/core/sched/scheduler.py]}
  - {id: priority-scheduling, owner: scheduler-kv, summary: "policy=priority", sources: [scheduling_policy]}
  - {id: structured-outputs, owner: scheduler-kv, summary: "JSON schema / regex / grammar constrained decoding", sources: [vllm/v1/structured_output/]}
  - {id: kv-cpu-offload, owner: scheduler-kv, summary: "KV cache offload to CPU and reload", sources: [vllm/v1/kv_offload/, vllm/v1/simple_kv_offload/]}
  - {id: hybrid-kv-cache, owner: scheduler-kv, summary: "hybrid models (Mamba/sliding window) with multiple KV managers", sources: [vllm/v1/core/kv_cache_coordinator.py]}
  - {id: disaggregated-prefill, owner: distributed, summary: "KV transfer connectors (NIXL, P2P) between prefill and decode instances", sources: [vllm/distributed/kv_transfer/]}
  - {id: tensor-parallel, owner: distributed, summary: "TP across GPUs with all-reduce", sources: [tensor_parallel_size]}
  - {id: pipeline-parallel, owner: worker-runner, summary: "PP stages; only the last rank samples", sources: [pipeline_parallel_size]}
  - {id: data-parallel, owner: engine-core, summary: "DP engine cores with a coordinating client", sources: [data_parallel_size]}
  - {id: expert-parallel, owner: models-layers, summary: "EP for MoE with EPLB rebalancing", sources: [enable_expert_parallel, enable_eplb]}
  - {id: speculative-decoding, owner: worker-runner, summary: "draft proposals verified by the target model, rejected tokens rolled back", sources: [vllm/v1/spec_decode/]}
  - {id: lora, owner: models-layers, summary: "serve multiple LoRA adapters", sources: [enable_lora]}
  - {id: quantization, owner: models-layers, summary: "FP8 / INT8 / NVFP4 / GPTQ / AWQ checkpoints and dispatch", sources: [quantization]}
  - {id: cuda-graphs, owner: kernels-ops, summary: "CUDA graph capture and replay (piecewise and full)", sources: [compilation_config.cudagraph_mode]}
  - {id: torch-compile, owner: kernels-ops, summary: "torch.compile with fusion passes", sources: [compilation_config]}
  - {id: openai-chat, owner: serving-api, summary: "/v1/chat/completions with all sampling params", sources: [vllm/entrypoints/openai/]}
  - {id: streaming, owner: serving-api, summary: "SSE streaming of incremental outputs", sources: [stream]}
  - {id: tool-calling, owner: serving-api, summary: "tool call parsing into structured tool_calls", sources: [vllm/tool_parsers/]}
  - {id: reasoning-outputs, owner: serving-api, summary: "reasoning parsers splitting reasoning_content", sources: [vllm/reasoning/]}
  - {id: multimodal-inputs, owner: serving-api, summary: "image / audio parts in chat requests", sources: [vllm/multimodal/]}
  - {id: pooling-embeddings, owner: serving-api, summary: "/v1/embeddings, /score, /rerank and LLM.encode", sources: [vllm/entrypoints/pooling/]}
  - {id: parallel-sampling, owner: engine-core, summary: "n>1 and best_of fan-out and merge", sources: [vllm/v1/engine/parallel_sampling.py]}
  - {id: offline-llm, owner: engine-core, summary: "LLM.generate batch inference with outputs in input order", sources: [vllm/entrypoints/llm.py]}
  - {id: sleep-mode, owner: worker-runner, summary: "sleep / wake up to free GPU memory", sources: [enable_sleep_mode]}
  - {id: graceful-shutdown, owner: engine-core, summary: "SIGTERM shutdown of server, engine and workers", sources: [vllm/v1/engine/core_client.py]}

# Ratcheted check thresholds (DESIGN §16.1; the template's section 12). Measured 2026-11-02 at
# today's values, so the current model passes the full gate. They only go down; never raise one.
gates:
  strict_stubs: true                  # 0 stub disagreements
  max_exemption_issues: 0
  max_internal_assertions: 0.218      # the highest fragment share, worker-runner.yaml, rounded up (round 4)
  max_clock_ids: 0
  max_unknown_inputs: 0
  max_racy: 0                         # round 3: 0 of 299; the 8 system findings are cited racy_in_code
  max_seam_names: 0
  min_test_reach: 0.690               # the lowest area, models-layers 279/404, rounded down
  max_explore_failures: 0             # --explore 'race|concurr' --schedules 20: 5 of 5 pass (round 3)
