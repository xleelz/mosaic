schema_version: 1
id: vllm
scenarios:
- id: oracle-config-platform-hash-factors-deterministic
  name: hash_factors is a deterministic, key-order-independent 64-hex SHA-256
  description: >-
    tests/config/test_config_utils.py::test_hash_factors_deterministic (line 45).
    vllm.config.utils.hash_factors (vllm/config/utils.py:397-399) is
    sha256(json.dumps(items, sort_keys=True)).hexdigest(): the same factors hash the same,
    dict insertion order does not matter, and the digest is 64 lower-case hex characters.
    The model inlines hash_factors in its callers; this drives it through
    ModelConfig.compute_hash (vllm/config/model.py:500-513, which returns
    hash_factors(get_hash_factors(self, ignored))) with factors {a: 1, b: "test"}, twice, then
    in the reverse insertion order.
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: model-config.compute-hash
    caller: vllm-config
    input: {model_config: {a: 1, b: test}}
    as: h1
  - interface: model-config.compute-hash
    caller: vllm-config
    input: {model_config: {a: 1, b: test}}
    as: h2
  - interface: model-config.compute-hash
    caller: vllm-config
    input: {model_config: {b: test, a: 1}}
    as: h3
  expect:
  - "steps.h1.result.ok && steps.h1.result.value.hash == steps.h2.result.value.hash"
  - "steps.h3.result.value.hash == steps.h1.result.value.hash"
  - "size(steps.h1.result.value.hash) == 64 && steps.h1.result.value.hash.matches('^[0-9a-f]{64}$')"

- id: oracle-config-platform-head-size-fallback-head-dim-zero
  name: A config that materializes head_dim as 0 falls back to hidden_size / num_attention_heads
  description: >-
    tests/config/test_model_arch_config.py::test_head_size_falls_back_when_head_dim_is_zero
    (line 122). ModelArchConfigConvertorBase.get_head_size
    (vllm/transformers_utils/model_arch_config_convertor.py:89-116) uses head_dim only when it
    is set and > 0, else hidden_size_per_head, else hidden_size // total_num_attention_heads:
    a deepseek_vl_v2 config with hidden_size 1280, 10 heads and head_dim 0 has head size 128.
    ModelConfig builds its model_arch_config from the convertor in __post_init__ and
    get_head_size() reads it. Driven through model-config.post-init with the HF config
    fields applied as --hf-overrides on the world's checkpoint.
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: model-config.post-init
    caller: vllm-config
    input:
      model: meta-llama/Llama-3.1-8B-Instruct
      hf_overrides:
        model_type: deepseek_vl_v2
        hidden_size: 1280
        num_attention_heads: 10
        num_key_value_heads: 10
        head_dim: 0
        kv_lora_rank: {$null: true}
    as: mc
  expect:
  - "steps.mc.result.ok && steps.mc.result.value.total_num_attention_heads == 10"
  - "has(steps.mc.result.value.head_size) && steps.mc.result.value.head_size == 128"

- id: oracle-config-platform-bailing-hybrid-mtp-hf-config-override
  name: A Bailing hybrid checkpoint maps to the bailing_hybrid_mtp draft config
  description: >-
    tests/config/test_bailing_mtp_config.py::test_bailing_hybrid_mtp_hf_config_override
    (line 29). SpeculativeConfig.hf_config_override (vllm/config/speculative.py:867-892): a
    model_type bailing_hybrid (or a BailingMoeV2_5ForCausalLM architecture) becomes
    bailing_hybrid_mtp with architectures [BailingMoeV25MTPModel] and n_predict =
    num_nextn_predict_layers (1). The test's last assertion (bailing_hybrid_mtp is in the
    MTPModelTypes Literal, speculative.py:54-56) is a static type check with no runtime
    path; the scenario covers the override.
  fixtures: [full-tp1-llama-8b]
  steps:
  - interface: speculative-config.hf-config-override
    caller: speculative-config
    input:
      hf_config:
        architectures: [BailingMoeV2_5ForCausalLM]
        model_type: bailing_hybrid
        hidden_size: 4096
        kv_lora_rank: 512
        num_attention_heads: 32
        num_experts: 256
        num_hidden_layers: 32
        num_key_value_heads: 32
        num_nextn_predict_layers: 1
        qk_rope_head_dim: 64
        vocab_size: 157184
        layer_types: []
        mtp_layer_types: {$null: true}
        mtp_num_hidden_layers: {$null: true}
        text_config: {$absent: true}
    as: ov
  expect:
  - "steps.ov.result.ok && steps.ov.result.value.model_type == 'bailing_hybrid_mtp'"
  - "steps.ov.result.value.architectures == ['BailingMoeV25MTPModel']"
  - "steps.ov.result.value.n_predict == 1"
