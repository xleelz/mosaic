- id: oracle-serving-api-cross-encoder-score-max-model-len
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_max_model_len (line 300) - an over-long /score pair is a 400 asking to reduce the prompt, and truncate_prompt_tokens=101 above max_model_len=100 is a 400 asking for a smaller truncation size.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body:
        model: BAAI/bge-reranker-base
        queries: 'What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?'
        documents: ['The capital of Brazil is Brasilia.', 'The capital of France is Paris.']
    as: long
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body:
        model: BAAI/bge-reranker-base
        queries: 'What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?What is the capital of France?'
        documents: ['The capital of Brazil is Brasilia.', 'The capital of France is Paris.']
        truncate_prompt_tokens: 101
    as: trunc
  expect:
  - "!steps.long.result.ok && steps.long.result.error.status == 400 && steps.long.result.error.message.contains('Please reduce the length of the input prompt')"
  - "!steps.trunc.result.ok && steps.trunc.result.error.status == 400 && steps.trunc.result.error.message.contains('Please request a smaller truncation size.')"

- id: oracle-serving-api-cross-encoder-invocations
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_invocations (line 334) - a RerankRequest body POSTed to /invocations is routed to the rerank endpoint and answers the same keys as /rerank.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-rerank
    caller: api-client
    input:
      path: /rerank
      body: {model: BAAI/bge-reranker-base, queries: {$absent: true}, top_n: {$absent: true}, query: 'What is the capital of France?', documents: ['The capital of Brazil is Brasilia.', 'The capital of France is Paris.']}
    as: rr
  - interface: sagemaker-router.post-invocations
    caller: api-client
    input:
      path: /invocations
      body: {model: BAAI/bge-reranker-base, messages: {$absent: true}, prompt: {$absent: true}, max_tokens: {$absent: true}, query: 'What is the capital of France?', documents: ['The capital of Brazil is Brasilia.', 'The capital of France is Paris.']}
    as: inv
  expect:
  - "steps.rr.result.ok && steps.inv.result.ok"
  - "steps.inv.result.ok && steps.rr.result.value.all(k, k in steps.inv.result.value) && steps.inv.result.value.all(k, k in steps.rr.result.value)"
  - "steps.inv.result.ok && size(steps.inv.result.value.results) == size(steps.rr.result.value.results)"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'serving-scores.serve-score').size() == 2"

- id: oracle-serving-api-cross-encoder-pooling-classify
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_pooling_classify (line 406) - POST /pooling with task classify on a classify model answers one PoolingResponseData whose data has one value.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-pooling.post-pooling
    caller: api-client
    input:
      path: /pooling
      body: {model: BAAI/bge-reranker-base, input: ['This product was excellent and exceeded my expectations'], encoding_format: float, task: classify}
    as: p
  expect:
  - "steps.p.result.ok && size(steps.p.result.value.data) == 1"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.encode' && e.input.pooling_params.task == 'classify')"

- id: oracle-serving-api-cross-encoder-rerank-max-tokens-per-doc
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_rerank_max_tokens_per_doc (line 422) - max_tokens_per_doc=10 truncates the document, so usage.prompt_tokens is lower than without it.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-rerank
    caller: api-client
    input:
      path: /rerank
      body:
        model: BAAI/bge-reranker-base
        queries: {$absent: true}
        top_n: {$absent: true}
        query: What is the capital of France?
        documents: ['The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. ']
        truncate_prompt_tokens: 99
    as: nolimit
  - interface: serving-scores.post-rerank
    caller: api-client
    input:
      path: /rerank
      body:
        model: BAAI/bge-reranker-base
        queries: {$absent: true}
        top_n: {$absent: true}
        query: What is the capital of France?
        documents: ['The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. The capital of France is Paris. ']
        max_tokens_per_doc: 10
    as: limit
  expect:
  - "steps.nolimit.result.ok && steps.limit.result.ok"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.encode').size() == 2"
  - "steps.limit.result.ok && steps.nolimit.result.ok && steps.limit.result.value.usage.prompt_tokens < steps.nolimit.result.value.usage.prompt_tokens"

- id: oracle-serving-api-cross-encoder-max-tokens-per-doc-check
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_rerank_max_tokens_per_doc_validation (line 460) - max_tokens_per_doc=0 is accepted (no truncation); -5 is a 400 'max_tokens_per_doc must be a non-negative integer'.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-rerank
    caller: api-client
    input:
      path: /rerank
      body: {model: BAAI/bge-reranker-base, queries: {$absent: true}, top_n: {$absent: true}, query: 'What is the capital of France?', documents: ['The capital of France is Paris.'], max_tokens_per_doc: 0}
    as: zero
  - interface: serving-scores.post-rerank
    caller: api-client
    input:
      path: /rerank
      body: {model: BAAI/bge-reranker-base, queries: {$absent: true}, top_n: {$absent: true}, query: 'What is the capital of France?', documents: ['The capital of France is Paris.'], max_tokens_per_doc: -5}
    as: neg
  expect:
  - "steps.zero.result.ok"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.encode').size() == 1"
  - "!steps.neg.result.ok && steps.neg.result.error.status == 400 && steps.neg.result.error.message.contains('max_tokens_per_doc must be a non-negative integer')"

- id: oracle-serving-api-cross-encoder-pooling-not-supported
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_pooling_not_supported (line 495, all four parametrizations) - /pooling on a classify model refuses embed and token_embed as unsupported, token_classify with a hint to switch --pooler-config.task, and plugin with no IOProcessor plugin installed, each a BadRequestError.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-pooling.post-pooling
    caller: api-client
    input:
      path: /pooling
      body: {model: BAAI/bge-reranker-base, input: ['This product was excellent and exceeded my expectations'], encoding_format: float, task: embed}
    as: embed
  - interface: serving-pooling.post-pooling
    caller: api-client
    input:
      path: /pooling
      body: {model: BAAI/bge-reranker-base, input: ['This product was excellent and exceeded my expectations'], encoding_format: float, task: token_embed}
    as: token_embed
  - interface: serving-pooling.post-pooling
    caller: api-client
    input:
      path: /pooling
      body: {model: BAAI/bge-reranker-base, input: ['This product was excellent and exceeded my expectations'], encoding_format: float, task: token_classify}
    as: token_classify
  - interface: serving-pooling.post-pooling
    caller: api-client
    input:
      path: /pooling
      body: {model: BAAI/bge-reranker-base, input: ['This product was excellent and exceeded my expectations'], encoding_format: float, task: plugin}
    as: plugin
  expect:
  - "!steps.embed.result.ok && steps.embed.result.error.code == 'BadRequestError' && steps.embed.result.error.message.startsWith(\"Unsupported task: 'embed'\")"
  - "!steps.token_embed.result.ok && steps.token_embed.result.error.code == 'BadRequestError' && steps.token_embed.result.error.message.startsWith(\"Unsupported task: 'token_embed'\")"
  - "!steps.token_classify.result.ok && steps.token_classify.result.error.code == 'BadRequestError' && steps.token_classify.result.error.message.startsWith(\"Try switching the model's pooling_task via\")"
  - "!steps.plugin.result.ok && steps.plugin.result.error.code == 'BadRequestError' && steps.plugin.result.error.message.startsWith('No IOProcessor plugin installed.')"

- id: oracle-serving-api-encode-multiple-pooling-params
  description: tests/entrypoints/pooling/basic/test_encode.py::test_multiple_pooling_params (line 48) - LLM.encode with four PoolingParams for four prompts answers four outputs; three params for four prompts raise VLLMValidationError; one PoolingParams or None is applied to every prompt.
  fixtures: [full-tp1-llama-8b]
  config:
    model: intfloat/multilingual-e5-small
    served-model-name: [intfloat/multilingual-e5-small]
    runner: pooling
  state:
    llm:
      supported_tasks: [embed, token_embed]
    async-llm:
      supported_tasks: [embed, token_embed]
  steps:
  - interface: llm.encode
    caller: api-client
    input: {prompts: &prompts ["Hello, my name is", 'The president of the United States is', 'The capital of France is', 'The future of AI is'], pooling_params: [{}, {}, {}, {}], pooling_task: embed}
    as: four
  - interface: llm.encode
    caller: api-client
    input: {prompts: *prompts, pooling_params: [{}, {}, {}], pooling_task: embed}
    as: three
  - interface: llm.encode
    caller: api-client
    input: {prompts: *prompts, pooling_params: {}, pooling_task: embed}
    as: single
  - interface: llm.encode
    caller: api-client
    input: {prompts: *prompts, pooling_params: {$null: true}, pooling_task: embed}
    as: none
  expect:
  - "steps.four.result.ok && size(steps.four.result.value.outputs) == 4"
  - "!steps.three.result.ok && steps.three.result.error.code == 'vllm-validation-error'"
  - "steps.single.result.ok && size(steps.single.result.value.outputs) == 4"
  - "steps.none.result.ok && size(steps.none.result.value.outputs) == 4"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'llm.run-tiling-engine').size() == 3"
