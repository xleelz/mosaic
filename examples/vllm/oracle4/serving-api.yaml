schema_version: 1
id: vllm
# Oracle4 (blind) scenarios for the serving-api sample.
# Shared world for tests/entrypoints/pooling/scoring/test_cross_encoder_online.py:
# `vllm serve BAAI/bge-reranker-base --max-model-len 100` (a cross-encoder: pooling runner,
# pooling task classify; supported tasks classify and token_classify).
scenarios:
- id: oracle-serving-api-cross-encoder-basic
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_basic (line 44) - /v1/models serves the model path as its id (the /tokenize token ids are tokenizer internals and not asserted).
  fixtures: [full-tp1-llama-8b]
  config: &ce_config
    model: BAAI/bge-reranker-base
    served-model-name: [BAAI/bge-reranker-base]
    runner: pooling
    max-model-len: 100
  state: &ce_state
    app-state:
      supported_tasks: [classify, token_classify]
    async-llm:
      supported_tasks: [classify, token_classify]
  steps:
  - interface: openai-serving-models.get-v1-models
    caller: api-client
    input: {path: /v1/models}
    as: models
  expect:
  - "steps.models.result.ok && steps.models.result.value.data[0].id == 'BAAI/bge-reranker-base'"

- id: oracle-serving-api-cross-encoder-score-shapes
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_queries_str_1_documents_str_1, _str_1_documents_str_n, _str_n_documents_str_n (lines 59-146) - /score answers one ScoreResponseData per pair, with an id, for each accepted request shape (the scores' agreement with HF is numeric and not asserted).
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body: {model: BAAI/bge-reranker-base, queries: 'What is the capital of France?', documents: 'The capital of France is Paris.'}
    as: s11
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body: {model: BAAI/bge-reranker-base, queries: 'What is the capital of France?', documents: ['The capital of France is Paris.', 'The capital of Germany is Berlin.']}
    as: s1n
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body: {model: BAAI/bge-reranker-base, queries: ['What is the capital of France?', 'What is the capital of Germany?'], documents: ['The capital of France is Paris.', 'The capital of Germany is Berlin.']}
    as: snn
  expect:
  - "steps.s11.result.ok && steps.s11.result.value.id != null && size(steps.s11.result.value.data) == 1"
  - "steps.s1n.result.ok && steps.s1n.result.value.id != null && size(steps.s1n.result.value.data) == 2"
  - "steps.snn.result.ok && steps.snn.result.value.id != null && size(steps.snn.result.value.data) == 2"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.encode' && e.input.pooling_params.task == 'classify').size() == 5"

- id: oracle-serving-api-cross-encoder-score-text-1-text-2
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_text_1_vs_text_2 (line 176) - /score accepts {text_1, text_2} lists (ScoreTextRequest) and answers one score per pair.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body: {model: BAAI/bge-reranker-base, queries: {$absent: true}, documents: {$absent: true}, text_1: ['What is the capital of France?', 'What is the capital of Germany?'], text_2: ['The capital of France is Paris.', 'The capital of Germany is Berlin.']}
    as: text
  expect:
  - "steps.text.result.ok && steps.text.result.value.id != null && size(steps.text.result.value.data) == 2"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.encode' && e.input.pooling_params.task == 'classify').size() == 2"

- id: oracle-serving-api-cross-encoder-score-queries-items
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_queries_vs_items (line 147) - /score accepts {queries, items} (ScoreQueriesItemsRequest) and answers one score per pair.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body: {model: BAAI/bge-reranker-base, queries: ['What is the capital of France?', 'What is the capital of Germany?'], documents: {$absent: true}, items: ['The capital of France is Paris.', 'The capital of Germany is Berlin.']}
    as: s
  expect:
  - "steps.s.result.ok && steps.s.result.value.id != null && size(steps.s.result.value.data) == 2"

- id: oracle-serving-api-cross-encoder-score-data-1-data-2
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_score_api_data_1_vs_data_2 (line 205) - /score accepts {data_1, data_2} (ScoreDataRequest) and answers one score per pair.
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-score
    caller: api-client
    input:
      path: /score
      body: {model: BAAI/bge-reranker-base, queries: {$absent: true}, documents: {$absent: true}, data_1: ['What is the capital of France?', 'What is the capital of Germany?'], data_2: ['The capital of France is Paris.', 'The capital of Germany is Berlin.']}
    as: s
  expect:
  - "steps.s.result.ok && steps.s.result.value.id != null && size(steps.s.result.value.data) == 2"

- id: oracle-serving-api-cross-encoder-rerank
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_rerank_api_texts (line 234) and test_rerank_api_top_n (line 260) - /rerank answers one result per document, and top_n=2 over three documents keeps two (relevance thresholds are numeric and not asserted).
  fixtures: [full-tp1-llama-8b]
  config: *ce_config
  state: *ce_state
  steps:
  - interface: serving-scores.post-rerank
    caller: api-client
    input:
      path: /rerank
      body: {model: BAAI/bge-reranker-base, queries: {$absent: true}, top_n: {$absent: true}, query: 'What is the capital of France?', documents: ['The capital of Brazil is Brasilia.', 'The capital of France is Paris.']}
    as: texts
  - interface: serving-scores.post-rerank
    caller: api-client
    input:
      path: /rerank
      body: {model: BAAI/bge-reranker-base, queries: {$absent: true}, query: 'What is the capital of France?', documents: ['The capital of Brazil is Brasilia.', 'The capital of France is Paris.', 'Cross-encoder models are neat'], top_n: 2}
    as: topn
  expect:
  - "steps.texts.result.ok && steps.texts.result.value.id != null && size(steps.texts.result.value.results) == 2"
  - "steps.topn.result.ok && steps.topn.result.value.id != null && size(steps.topn.result.value.results) == 2"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'async-llm.encode' && e.input.pooling_params.task == 'classify').size() == 5"

- id: oracle-serving-api-cross-encoder-rerank-max-model-len
  description: tests/entrypoints/pooling/scoring/test_cross_encoder_online.py::test_rerank_api_max_model_len (line 283) - a query*100 pair longer than max_model_len=100 is a 400 asking to reduce the prompt.
