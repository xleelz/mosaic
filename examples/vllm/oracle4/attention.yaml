- id: oracle-attention-expand-page-indices-matches-reference
  name: _expand_page_indices_kernel equals the naive per-token expansion for every seq_lens x kernel_block_size case
  description: 'tests/v1/attention/test_expand_page_indices.py::test_matches_reference (line 82). Block table width = max ceil(s/K) + 2 (the test''s _make); entries are a deterministic stand-in for torch.randint(0,
    10000). Reference: out[cu[r]+t] = bt[r][t // K] * K + t % K; grid chunks = max(1, ceil(width*K/1024)).'
