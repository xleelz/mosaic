- component: ir-op
  name: call
  kind: function
  summary: "IrOp.__call__ -> dispatch: the first provider in the op's priority list that is supported and supports the args; native otherwise."
  sources:
  - "vllm/ir/op.py:361-366"
  - "vllm/ir/op.py:321-358"
  request: KernelsOpsIrCall
  response:
    type: object
    properties:
      provider:
        type: string
  errors:
  - code: attribute-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "!(input.op in ['rms_norm', 'fused_add_rms_norm', 'gelu_and_mul_sparse'])"
    title: vllm.ir.ops has no such op
    source: "vllm/ir/ops/__init__.py:3"
    then:
    - fail:
        code: attribute-error
        message: "= \"module 'vllm.ir.ops' has no attribute '\" + input.op + \"'\""
  - set:
      vars.priority: "= has(input.priority_override) ? input.priority_override : (input.op in config['ir-op-priority'] ? config['ir-op-priority'][input.op] : [])"
    title: The priority set at worker start (KernelConfig.set_default)
    source: "vllm/ir/op.py:408"
  - if: size(vars.priority) == 0
    title: "Priority not set: native implementation"
    source: "vllm/ir/op.py:327"
    then:
    - call: "= {'vllm_c': {'rms_norm': 'vllm-c.rms-norm', 'fused_add_rms_norm': 'vllm-c.fused-add-rms-norm'}, 'oink': {'rms_norm': 'oink-ops.rms-norm', 'fused_add_rms_norm': 'oink-ops.fused-add-rms-norm'},\
        \ 'triton': {'gelu_and_mul_sparse': 'kernels-triton-activation.gelu-and-mul-sparse-triton'}, 'native': {'rms_norm': 'ir-ops-layernorm.rms-norm', 'fused_add_rms_norm': 'ir-ops-layernorm.fused-add-rms-norm',\
        \ 'gelu_and_mul_sparse': 'ir-ops-activation.gelu-and-mul-sparse'}}['native'][input.op]"
      targets:
