- component: compiler-manager
  name: compile
  kind: function
  summary: "CompilerManager.compile: load the graph from the cache or compile it with Inductor and record the handle."
  sources:
  - "vllm/compilation/backends.py:267-397"
  request:
    type: object
    properties:
      graph_index:
        type: integer
        examples:
        - 0
      num_graphs:
        type: integer
        examples:
        - 33
      range_start:
        type: integer
        examples:
        - 1
      range_end:
        type: integer
        examples:
        - 8192
      graph_patterns:
        type: array
        items:
          type: string
  response:
    type: object
    properties:
      source:
        type: string
  latency_ms: 0
  behavior:
  - call: compilation-counter.increment
    input:
      field: num_backend_compilations
      by: 1
    source: "vllm/compilation/backends.py:283"
    title: compilation_counter.num_backend_compilations += 1
  - set:
      vars.key: "= 'r' + string(input.range_start) + '_' + string(input.range_end) + '_g' + string(input.graph_index) + '_inductor_standalone'"
  - if: vars.key in state.cache
    title: "Cache hit: load the compiled artifact by handle"
    source: "vllm/compilation/backends.py:289"
    then:
    - call: inductor-standalone-adaptor.load
      input:
        handle: "= state.cache[vars.key].graph_handle"
    - return:
        source: cache
  - title: "Miss: compile with Inductor (post-grad passes run inside)"
    source: "vllm/compilation/backends.py:357"
    call: inductor-standalone-adaptor.compile
    input:
      key: "= 'artifact_compile_range_' + string(input.range_start) + '_' + string(input.range_end) + '_subgraph_' + string(input.graph_index)"
      graph_patterns: "= input.graph_patterns"
      save: "= !state.disable_cache"
    as: c
  - if: "!state.disable_cache"
    title: Store the handle when the compile cache is enabled
    source: "vllm/compilation/backends.py:373"
    then:
    - set:
        state.cache: "= merge(state.cache, {vars.key: {'graph_handle': vars.c.value.handle}})"
        state.is_cache_updated: true
    - call: compilation-counter.increment
      input:
        field: num_cache_entries_updated
        by: 1
      source: "vllm/compilation/backends.py:378"
      title: compilation_counter.num_cache_entries_updated += 1
  - return:
      source: compiled
