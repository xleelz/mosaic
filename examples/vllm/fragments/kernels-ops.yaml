        num_graphs_seen: 0
        num_piecewise_graphs_seen: 0
        num_piecewise_capturable_graphs_seen: 0
        num_backend_compilations: 0
        num_gpu_runner_capture_triggers: 0
        num_cudagraph_captured: 0
        num_inductor_compiles: 0
        num_eager_compiles: 0
