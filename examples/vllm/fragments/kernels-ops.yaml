- id: kernels-ops-rocm-aiter-fusion-passes
  name: "MI355X (gfx950) with AITER on: the pass manager adds the AITER norm+quant, act+quant, pad and MLA dual-norm passes and they fuse"
  description: "PostGradPassManager.configure adds the ROCm AITER passes when rocm_aiter_ops.is_enabled() (vllm/compilation/passes/pass_manager.py:160-202)."
  fixtures:
  - tp1-llama-8b
  config:
    vllm-target-device: rocm
    fuse-norm-quant: true
    fuse-act-quant: true
    fuse-act-padding: true
    fuse-mla-dual-rms-norm: true
  state:
    "aiter-ops@rank0":
      aiter_found: true
      gcn_arch: gfx950
      flags:
        _AITER_ENABLED: true
        _CUSTOM_ALL_REDUCE_ENABLED: true
        _LINEAR_ENABLED: true
        _FMOE_ENABLED: true
        _MHA_ENABLED: true
        _SHUFFLE_KV_CACHE_ENABLED: false
        _TRITON_ROTARY_EMBED: false
        _MOE_SHARED_EXPERTS_ENABLED: false
  steps:
  - interface: post-grad-pass-manager.call
    caller: gpu-worker
    as: pm
    input:
      graph_patterns:
      - rms_norm+2x_group_fp8_quant
      - fused_add_rms_norm+per_token_fp8_quant
      - silu_and_mul+group_fp8_quant
      - fused_add_rms_norm+pad
      - mla_dual_rms_norm+group_fp8_quant
  expect:
  - steps.pm.result.ok
  - "ctx.fused == ['vllm::rocm_aiter_triton_add_rmsnorm_pad', 'vllm::rocm_aiter_rmsnorm_fp8_group_quant', 'vllm::rocm_aiter_rmsnorm_fused_add_dynamic_quant', 'vllm::rocm_aiter_act_mul_and_fp8_group_quant',\
    \ 'vllm::fused_mla_dual_rms_norm_group_quant']"
- id: kernels-ops-rocm-aiter-fusion-off-on-cuda
  name: "On the CUDA fixture with fuse_norm_quant on, only the CUDA RMSNorm+quant pass runs"
  fixtures:
  - tp1-llama-8b
  config:
    fuse-norm-quant: true
  steps:
  - interface: post-grad-pass-manager.call
    caller: gpu-worker
    as: pm
    input:
      graph_patterns:
      - rms_norm+static_fp8_quant
  expect:
  - steps.pm.result.ok
  - "!trace.exists(e, e.type == 'call.start' && e.interface == 'rocm-aiter-rms-norm-quant-fusion-pass.call')"
- id: kernels-ops-rocm-aiter-rms-quant-rdna
  name: "RDNA4: per-token patterns are not registered; the gated-norm pattern needs a 128-wide GDN head"
  fixtures:
  - tp1-llama-8b
  steps:
  - interface: rocm-aiter-rms-norm-quant-fusion-pass.call
    caller: gpu-worker
    as: rdna
    input:
      graph_patterns:
      - rms_norm+per_token_fp8_quant
      - rms_norm+group_fp8_quant
      rdna: true
  - interface: rocm-aiter-rms-norm-quant-fusion-pass.call
    caller: gpu-worker
    as: gdn64
    input:
      graph_patterns:
      - rms_norm_gated+group_fp8_quant
      gdn_head_dims:
      - 64
  - interface: rocm-aiter-rms-norm-quant-fusion-pass.call
    caller: gpu-worker
    as: gdn128
    input:
      graph_patterns:
      - rms_norm_gated+group_fp8_quant
      gdn_head_dims:
      - 128
  - interface: rocm-aiter-triton-add-rms-norm-pad-fusion-pass.call
    caller: gpu-worker
    as: pad4096
    input:
      graph_patterns:
      - fused_add_rms_norm+pad
      hidden_size: 4096
  expect:
  - "steps.rdna.result.value.fused_ops == ['vllm::rocm_aiter_rmsnorm_fp8_group_quant']"
  - steps.gdn64.result.value.replaced == 0
  - "steps.gdn128.result.value.fused_ops == ['vllm::fused_rms_gated_fp8_group_quant']"
  - steps.pad4096.result.value.replaced == 0
