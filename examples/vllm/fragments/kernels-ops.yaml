- component: helion-config-manager
  name: get-instance
  kind: function
  summary: "ConfigManager.get_instance / reset_instance / ConfigManager(base_dir): a process singleton bound to one base dir."
  sources:
  - "vllm/kernels/helion/config_manager.py:202-209"
  - "vllm/kernels/helion/config_manager.py:211-215"
  - "vllm/kernels/helion/config_manager.py:171-188"
  request:
    type: object
    properties:
      op:
        type: string
        enum:
        - get
        - create
        - reset
        default: get
      base_dir:
        type: string
        default: vllm/kernels/helion/configs
  response:
    type: object
    properties:
      base_dir:
        type:
        - string
        - "null"
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  - code: value-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "input.op == 'reset'"
    title: reset_instance (tests only)
    source: "vllm/kernels/helion/config_manager.py:213"
    then:
    - set:
        state.instance_base_dir: null
    - return:
        base_dir: null
  - if: "input.op == 'get' && state.instance_base_dir == null"
    title: get_instance before construction
    source: "vllm/kernels/helion/config_manager.py:203"
    then:
    - fail:
        code: runtime-error
        message: ConfigManager instance has not been created. Call ConfigManager(base_dir=...) first to initialize.
  - if: "input.op == 'get'"
    then:
    - return:
        base_dir: "= state.instance_base_dir"
  - if: "state.instance_base_dir != null && state.instance_base_dir != input.base_dir"
    title: A second base dir is refused
    source: "vllm/kernels/helion/config_manager.py:175"
    then:
    - fail:
        code: value-error
        message: "= \"ConfigManager singleton already exists with base_dir '\" + state.instance_base_dir + \"', cannot create with different base_dir '\" + input.base_dir + \"'\""
  - set:
      state.instance_base_dir: "= input.base_dir"
    title: First construction binds the base dir
    source: "vllm/kernels/helion/config_manager.py:185"
  - return:
      base_dir: "= input.base_dir"
- component: helion-config-manager
  name: get-platform-configs
  kind: io
  summary: "ConfigManager.get_platform_configs: load configs/<kernel>/<platform>.json; a missing file yields no configs."
  sources:
  - "vllm/kernels/helion/config_manager.py:273-284"
  - "vllm/kernels/helion/config_manager.py:241-251"
  request:
    type: object
    required:
    - key
    properties:
      key:
        type: string
        examples:
        - silu_mul_fp8/nvidia_h100
  errors:
  - code: not_found
    status: 404
    retryable: false
  latency_ms: 0.05
  store:
    table: configs
    op: get
    key: "= input.key"
- component: helion-kernel-wrapper
  name: call
  kind: function
  summary: "HelionKernelWrapper.__call__: refuse when disabled; else the config selector picks the pre-tuned CaseKey and the configured kernel runs."
  sources:
  - "vllm/kernels/helion/register.py:296-313"
  - "vllm/kernels/helion/register.py:192-214"
  request:
    type: object
    properties:
      op_name:
        type: string
        examples:
        - silu_mul_fp8
      num_tokens:
        type: integer
        examples:
        - 16
      intermediate_size:
        type: integer
        examples:
        - 14336
  response:
    type: object
    properties:
      case_key:
        type: string
      intermediate:
        type: integer
      numtokens:
        type: integer
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  - code: key-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "!(input.op_name in state.registered)"
    title: Not a registered Helion kernel
    source: "vllm/kernels/helion/register.py:376"
    then:
    - fail:
        code: key-error
        message: "= 'no Helion kernel ' + input.op_name"
  - if: "state.registered[input.op_name].disabled"
    title: Disabled kernels raise
    source: "vllm/kernels/helion/register.py:297"
    then:
    - fail:
        code: runtime-error
        message: "= \"Helion kernel '\" + input.op_name + \"' is disabled: \" + state.registered[input.op_name].reason"
  - call: helion-config-manager.get-platform-configs
    input:
      key: "= state.registered[input.op_name].configs"
    as: cf
  - set:
      vars.cfg: "= vars.cf.value"
  - set:
      vars.isz: "= vars.cfg.keys.map(k, k.intermediate)"
    title: "pick_silu_mul_fp8_config: closest intermediate size"
    source: "vllm/kernels/helion/ops/silu_mul_fp8.py:87"
  - set:
      vars.best_isize: "= vars.isz.filter(s, vars.isz.all(t, math.abs(s - input.intermediate_size) <= math.abs(t - input.intermediate_size)))[0]"
  - set:
      vars.avail: "= vars.cfg.keys.filter(k, k.intermediate == vars.best_isize).map(k, k.numtokens)"
  - set:
      vars.ge: "= vars.avail.filter(n, n >= input.num_tokens)"
    title: "then the smallest tuned num_tokens >= the batch, else the largest"
    source: "vllm/kernels/helion/ops/silu_mul_fp8.py:89"
  - set:
      vars.ntok: "= size(vars.ge) > 0 ? vars.ge.filter(n, vars.ge.all(m, n <= m))[0] : vars.avail.filter(n, vars.avail.all(m, n >= m))[0]"
  - set:
      vars.key: "= '{\"intermediate\":' + string(vars.best_isize) + ',\"numtokens\":' + string(vars.ntok) + '}'"
    title: "CaseKey string: sorted-key compact JSON"
    source: "vllm/kernels/helion/case_key.py:48"
  - call: silu-mul-fp8.silu-mul-fp8
    input:
      num_tokens: "= input.num_tokens"
      hidden_size: "= 2 * input.intermediate_size"
      dtype_bytes: 2
    title: The configured kernel runs with the selected config
    source: "vllm/kernels/helion/register.py:312"
  - return:
      case_key: "= vars.key"
      intermediate: "= vars.best_isize"
      numtokens: "= vars.ntok"
- component: helion-kernel-wrapper
  name: get-registered-kernels
  kind: function
  summary: "get_registered_kernels: a copy of the _REGISTERED_KERNELS map."
  sources:
  - "vllm/kernels/helion/register.py:372-373"
  response:
    type: object
    properties:
      names:
        type: array
        items:
          type: string
  latency_ms: 0
  behavior:
  - return:
      names: "= state.registered.map(k, k)"
    source: "vllm/kernels/helion/register.py:373"
- component: helion-kernel-wrapper
  name: register-kernel
  kind: function
  summary: "@register_kernel -> HelionKernelWrapper.__init__: load this platform's pre-tuned configs; a ValueError (no configs) disables the kernel instead of failing."
  sources:
  - "vllm/kernels/helion/register.py:401-411"
  - "vllm/kernels/helion/register.py:253-296"
  - "vllm/kernels/helion/register.py:218-230"
  request:
    type: object
    properties:
      op_name:
        type: string
        examples:
        - silu_mul_fp8
      device_name:
        type: string
        examples:
        - NVIDIA H100 80GB HBM3
      helion_installed:
        type: boolean
        default: true
  response:
    type: object
    properties:
      disabled:
        type: boolean
      platform:
        type: string
  errors:
  - code: import-error
    status: 0
    retryable: false
  - code: value-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - call: import-utils.has-helion
    input:
      installed: "= input.helion_installed"
    as: h
    title: register.py refuses to import without helion
    source: "vllm/kernels/helion/register.py:52"
  - if: "!vars.h.value.available"
    then:
    - fail:
        code: import-error
        message: "register module requires helion to be installed. Install it with: pip install helion"
  - if: input.op_name in state.registered
    title: One registration per op name
    source: "vllm/kernels/helion/register.py:446"
    then:
    - fail:
        code: value-error
        message: "= \"Helion kernel '\" + input.op_name + \"' is already registered.\""
  - call: helion-utils.get-canonical-gpu-name
    input:
      device_name: "= input.device_name"
    as: p
    title: Platform = canonical GPU name
    source: "vllm/kernels/helion/register.py:222"
  - call: helion-config-manager.get-platform-configs
    input:
      key: "= input.op_name + '/' + vars.p.value.platform"
    as: c
    on_error: continue
  - if: "!vars.c.ok"
    title: "No configs for this platform: ValueError, caught, kernel disabled with the reason"
    source: "vllm/kernels/helion/register.py:289"
    then:
    - set:
        "= 'state.registered.' + input.op_name":
          disabled: true
          platform: "= vars.p.value.platform"
          reason: "= \"No configs available for kernel '\" + input.op_name + \"' on platform '\" + vars.p.value.platform + \"'\""
    - return:
        disabled: true
        platform: "= vars.p.value.platform"
  - set:
      "= 'state.registered.' + input.op_name":
        disabled: false
        platform: "= vars.p.value.platform"
        configs: "= input.op_name + '/' + vars.p.value.platform"
    title: Registered in _REGISTERED_KERNELS
    source: "vllm/kernels/helion/register.py:474"
  - return:
      disabled: false
      platform: "= vars.p.value.platform"
- component: helion-utils
  name: get-canonical-gpu-name
  kind: function
  summary: "get_canonical_gpu_name: lower-case the device name, join separators with '_', map known variants (H100 80GB HBM3 -> nvidia_h100)."
  sources:
  - "vllm/kernels/helion/utils.py:62-78"
  - "vllm/kernels/helion/utils.py:26-40"
  request:
    type: object
    properties:
      device_name:
        type: string
        examples:
        - NVIDIA H100 80GB HBM3
  response:
    type: object
    properties:
      platform:
        type: string
  errors:
  - code: value-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "input.device_name.trim() == ''"
    title: Empty GPU name
    source: "vllm/kernels/helion/utils.py:71"
    then:
    - fail:
        code: value-error
        message: GPU name cannot be empty
  - set:
      vars.name: "= replace(input.device_name.lowerAscii(), '[\\\\s/-]+', '_')"
    title: "Lower-case; whitespace, '/' and '-' become '_'"
    source: "vllm/kernels/helion/utils.py:73"
  - set:
      vars.aliases:
        nvidia_h100_pcie: nvidia_h100
        nvidia_h100_sxm5: nvidia_h100
        nvidia_h100_80gb_hbm3: nvidia_h100
        nvidia_h100_nvl: nvidia_h100
        nvidia_h200_nvl: nvidia_h200
        nvidia_h200_141gb_hbm3e: nvidia_h200
        nvidia_a100_sxm4_80gb: nvidia_a100
        nvidia_a100_sxm4_40gb: nvidia_a100
        nvidia_a100_pcie_80gb: nvidia_a100
  - return:
      platform: "= vars.name in vars.aliases ? vars.aliases[vars.name] : vars.name"
    title: Known variants map to the canonical platform
    source: "vllm/kernels/helion/utils.py:74"
- component: import-utils
  name: has-helion
