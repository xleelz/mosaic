      has_bias:
        type: boolean
        default: false
- id: KernelsOpsAwqPackCall
  summary: convert_weight_packed_scale_zp arguments (AWQ int4 checkpoint packed as int32).
  schema:
    type: object
    properties:
      k:
        type: integer
        examples:
        - 128
      n:
        type: integer
        examples:
        - 128
      group_size:
        type: integer
        examples:
        - 128
      dtype_bytes:
        type: integer
        examples:
        - 4
      quant_method:
        type: string
        enum:
        - AWQ
        - GPTQ
