- component: support-torch-compile
  name: call
  kind: function
  summary: "The @support_torch_compile __call__: eager when compilation is off, else load an AOT artifact, run the compiled code, or compile on first call."
  sources:
  - "vllm/compilation/decorators.py:524-624"
  request: KernelsOpsGraphCall
  response:
    type: object
    properties:
      path:
        type: string
  latency_ms: 0
  behavior:
  - if: "config['compilation-mode'] == 0 || config['compilation-mode'] == 1"
    title: "do_not_compile (mode NONE or STOCK_TORCH_COMPILE): plain forward"
    source: "vllm/compilation/decorators.py:528"
    then:
    - set:
        ctx.forward: eager
      title: "self.forward runs as plain PyTorch (models-layers' LlamaModel.forward, called by the model runner)"
      source: "vllm/compilation/decorators.py:529"
    - return:
        path: eager
  - if: state.aot_compiled_fn
    title: "AOT-compiled function already loaded: call it"
    source: "vllm/compilation/decorators.py:540"
    then:
    - call: piecewise-backend.call
      input: "= input"
    - return:
        path: aot
  - set:
      vars.aot_path: "= 'torch_aot_compile/' + string(input.num_layers) + '/rank_0_0/model'"
  - if: "config['vllm-use-aot-compile'] && !config['vllm-disable-compile-cache']"
    title: "AOT mode: try the artifact on disk"
    source: "vllm/compilation/decorators.py:586"
    then:
    - call: torch-compile-cache.load-aot-artifact
      input:
        path: "= vars.aot_path"
      as: aot
      on_error: continue
    - if: vars.aot.ok
      title: "Loaded from disk: no Dynamo, no Inductor"
      source: "vllm/compilation/decorators.py:590"
      then:
      - set:
          state.aot_compiled_fn: true
          state.was_aot_compile_fn_loaded_from_disk: true
      - call: piecewise-backend.call
        input: "= input"
      - return:
          path: aot-loaded
  - if: state.compiled
    title: "Already compiled: guard-free dispatch"
    source: "vllm/compilation/decorators.py:603"
    then:
    - call: torch-compile-with-no-guards-wrapper.call
      input: "= input"
    - return:
        path: compiled
  - title: "First call: mark dynamic dims and compile"
    source: "vllm/compilation/decorators.py:605"
    set:
      state.num_compiles: "= state.num_compiles + 1"
  - if: "config['vllm-use-aot-compile']"
    title: "AOT compile, save the artifact, run it"
    source: "vllm/compilation/decorators.py:696"
    then:
    - wait: "= config['dynamo-trace-ms']"
    - call: vllm-backend.call
      input:
        num_layers: "= input.num_layers"
        num_tokens: "= input.num_tokens"
        prefix: backbone
        graph_patterns: []
        config_hash: "= has(input.config_hash) ? input.config_hash : null"
      as: be
    - call: torch-compile-cache.save-aot-artifact
      input:
        path: "= vars.aot_path"
        num_graphs: "= vars.be.value.num_piecewise_graphs"
      title: save_aot_compiled_function
      source: "vllm/compilation/decorators.py:700"
    - set:
        state.aot_compiled_fn: true
        state.compiled: true
    - call: piecewise-backend.call
      input: "= input"
    - return:
        path: aot-compiled
  - title: "JIT: torch.compile through the guard-free wrapper"
    source: "vllm/compilation/decorators.py:712"
    call: torch-compile-with-no-guards-wrapper.call
    input: "= input"
  - set:
      state.compiled: true
    source: "vllm/compilation/decorators.py:718"
    title: Mark compiled
  - return:
      path: jit-compiled
- component: support-torch-compile
  name: decorate
  kind: function
  summary: "@support_torch_compile(cls, dynamic_arg_dims=...): infer the dynamic dims from forward()'s tensor annotations unless given, and validate them."
  sources:
  - "vllm/compilation/decorators.py:202-244"
  - "vllm/compilation/decorators.py:85-117"
  - "vllm/compilation/decorators.py:120-251"
  request:
    type: object
    properties:
      has_forward:
        type: boolean
        default: true
      forward_params:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            annotation:
              type: string
        examples:
        - - name: input_ids
            annotation: "torch.Tensor | None"
          - name: positions
            annotation: torch.Tensor
          - name: intermediate_tensors
            annotation: "IntermediateTensors | None"
          - name: inputs_embeds
            annotation: "torch.Tensor | None"
      dynamic_arg_dims:
        type:
        - object
        - "null"
        default: null
        description: "explicit {arg: dim}; null infers"
      is_encoder:
        type: boolean
        default: false
  response:
    type: object
    properties:
      dynamic_args:
        type: array
        items:
          type: string
      is_encoder:
        type: boolean
  errors:
  - code: type-error
    status: 0
    retryable: false
  - code: value-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "!input.has_forward"
    title: The class needs a forward method
    source: "vllm/compilation/decorators.py:206"
    then:
    - fail:
        code: type-error
        message: decorated class should have a forward method.
  - set:
      vars.names: "= input.dynamic_arg_dims != null ? input.dynamic_arg_dims.map(k, k) : input.forward_params.filter(p, p.annotation in ['torch.Tensor', 'torch.Tensor | None', 'torch.FloatTensor', 'torch.FloatTensor\
        \ | None', 'IntermediateTensors', 'IntermediateTensors | None']).map(p, p.name)"
    title: "Explicit dims as given; else every Tensor / Optional[Tensor] / IntermediateTensors argument is dynamic in dim 0"
    source: "vllm/compilation/decorators.py:220"
  - if: size(vars.names) == 0
    title: "Nothing dynamic: refuse"
    source: "vllm/compilation/decorators.py:228"
    then:
    - fail:
        code: value-error
        message: No dynamic dimensions found in the forward method. Please provide dynamic_arg_dims explicitly.
  - foreach: "= vars.names"
    as: k
    title: Every named argument must exist in forward()
    source: "vllm/compilation/decorators.py:235"
    steps:
    - if: "!input.forward_params.exists(p, p.name == vars.k)"
      then:
      - fail:
          code: value-error
          message: "= 'Argument ' + vars.k + ' not found in the forward method'"
  - return:
      dynamic_args: "= vars.names"
      is_encoder: "= input.is_encoder"
    title: Wrap the class (_support_torch_compile)
    source: "vllm/compilation/decorators.py:240"
- component: support-torch-compile
  name: ignore-torch-compile
  kind: function
  summary: "@ignore_torch_compile: mark a subclass so the inherited @support_torch_compile does not compile its forward."
  sources:
  - "vllm/compilation/decorators.py:61-78"
  - "vllm/compilation/decorators.py:80-82"
  request:
    type: object
    required:
    - cls
    properties:
      cls:
        type: string
        examples:
        - MyDraftModel
  latency_ms: 0
  behavior:
  - set:
      "= 'state.ignored.' + input.cls": true
    title: "setattr(cls, IGNORE_COMPILE_KEY, True)"
    source: "vllm/compilation/decorators.py:76"
  - return:
      ignored: true
- component: support-torch-compile
  name: init
  kind: function
  summary: "The decorated __init__: run the model's __init__, then decide do_not_compile (mode NONE/STOCK_TORCH_COMPILE, @ignore_torch_compile, or enable_if false); otherwise count the model."
  sources:
  - "vllm/compilation/decorators.py:399-411"
  request:
    type: object
    properties:
      cls:
        type: string
        default: LlamaModel
      enable_if:
        type: boolean
        default: true
        description: enable_if(vllm_config); true when no enable_if
  response:
    type: object
    properties:
      do_not_compile:
        type: boolean
  latency_ms: 0
  behavior:
  - set:
      vars.dnc: "= config['compilation-mode'] == 0 || config['compilation-mode'] == 1 || (input.cls in state.ignored && state.ignored[input.cls]) || !input.enable_if"
    title: "do_not_compile = mode in [NONE, STOCK_TORCH_COMPILE] or ignored or not enable_compile"
    source: "vllm/compilation/decorators.py:402"
  - if: vars.dnc
    title: Nothing else to set up
    source: "vllm/compilation/decorators.py:408"
    then:
    - return:
        do_not_compile: true
  - call: compilation-counter.increment
    input:
      field: num_models_seen
      by: 1
    source: "vllm/compilation/decorators.py:414"
    title: compilation_counter.num_models_seen += 1
  - return:
      do_not_compile: false
