- component: ir-op
  name: generate-inputs
  kind: function
  summary: "IrOp.generate_inputs(**kwargs): the op's registered input generator; RuntimeError when none is registered. gelu_and_mul_sparse makes x [T, 2H] plus std_multiplier and approximate='tanh'; rms_norm\
    \ makes x [T, H], weight [H], epsilon."
  sources:
  - "vllm/ir/op.py:446-452"
  - "vllm/ir/ops/activation.py:26-34"
  - "vllm/ir/ops/layernorm.py:25-35"
  request:
    type: object
    required:
    - op
    properties:
      op:
        type: string
      num_tokens:
        type: integer
        examples:
        - 8
      hidden_size:
        type: integer
        examples:
        - 4096
      dtype_bytes:
        type: integer
        default: 2
      has_generator:
        type: boolean
        default: true
  response: KernelsOpsIrCall
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "!input.has_generator"
    title: No input generator registered
    source: "vllm/ir/op.py:447"
    then:
    - fail:
        code: runtime-error
        message: "= \"No input generator registered for op '\" + input.op + \"'. Use @ir.ops.\" + input.op + \".register_input_generator\""
  - if: "input.op == 'gelu_and_mul_sparse'"
    title: "x = randn(T, 2H); std_multiplier 1.645; approximate 'tanh'"
    source: "vllm/ir/ops/activation.py:33"
    then:
    - return:
        op: "= input.op"
        num_tokens: "= input.num_tokens"
        hidden_size: "= 2 * input.hidden_size"
        dtype_bytes: "= input.dtype_bytes"
        approximate: tanh
        contiguous: true
        ndim: 2
        device_type: "= config['vllm-target-device']"
        variance_size: 0
        weight_dtype_matches: true
  - return:
      op: "= input.op"
      num_tokens: "= input.num_tokens"
      hidden_size: "= input.hidden_size"
      dtype_bytes: "= input.dtype_bytes"
      approximate: none
      contiguous: true
      ndim: 2
      device_type: "= config['vllm-target-device']"
      variance_size: 0
      weight_dtype_matches: true
    title: "rms_norm / fused_add_rms_norm: x [T, H] (and residual), weight [H], epsilon 1e-5"
    source: "vllm/ir/ops/layernorm.py:32"
- component: ir-op
  name: impl-supports-args
  kind: function
  summary: "IrOpImpl.supported / supports_args for one provider: the static platform check, then the provider's argument predicate (None means all args)."
  sources:
  - "vllm/ir/op.py:621-626"
  - "vllm/ir/op.py:617-620"
  - "vllm/kernels/triton/activation.py:55-71"
  - "vllm/kernels/triton/activation.py:103"
  request:
    type: object
    required:
    - provider
    - args
    properties:
      provider:
        type: string
        enum:
        - native
        - vllm_c
        - oink
        - triton
      args:
        type: object
        description: "the op's call arguments as KernelsOpsIrCall describes them"
  response:
    type: object
    properties:
      supported:
        type: boolean
      supports_args:
        type: boolean
  latency_ms: 0
  behavior:
  - set:
      vars.p: "= input.provider"
      vars.a: "= merge({'num_tokens': 16, 'hidden_size': 4096, 'dtype_bytes': 2, 'variance_size': 0, 'weight_dtype_matches': true, 'contiguous': true, 'ndim': 2, 'approximate': 'none', 'device_type': 'cuda'},\
        \ input.args)"
    title: Unspecified argument properties take the common case
  - set:
      vars.supported: "= (vars.p == 'native') || (vars.p == 'vllm_c' && config['vllm-target-device'] in ['cuda', 'rocm', 'xpu']) || (vars.p == 'triton' && config['vllm-target-device'] == 'cuda') || (vars.p\
        \ == 'oink' && config['vllm-target-device'] == 'cuda')"
    title: "Static support (e.g. triton: HAS_TRITON and current_platform.is_cuda())"
    source: "vllm/kernels/triton/activation.py:103"
  - if: "vars.p == 'triton'"
    title: "_supports_gelu_and_mul_sparse: CUDA, fp16/bf16/fp32, contiguous, ndim > 0, tanh, even last dim with half <= 32768"
    source: "vllm/kernels/triton/activation.py:69"
    then:
    - return:
        supported: "= vars.supported"
        supports_args: "= vars.a.op == 'gelu_and_mul_sparse' && vars.a.device_type == 'cuda' && (vars.a.dtype_bytes == 2 || vars.a.dtype_bytes == 4) && vars.a.contiguous && vars.a.ndim > 0 && vars.a.approximate\
          \ == 'tanh' && vars.a.hidden_size > 0 && vars.a.hidden_size % 2 == 0 && vars.a.hidden_size / 2 <= 32768"
  - if: "vars.p == 'vllm_c'"
    source: "vllm/ir/op.py:625"
    then:
    - return:
        supported: "= vars.supported"
        supports_args: "= vars.a.op != 'gelu_and_mul_sparse' && vars.a.variance_size == 0 && vars.a.weight_dtype_matches"
  - if: "vars.p == 'oink'"
    then:
    - return:
        supported: "= vars.supported"
        supports_args: "= vars.a.op != 'gelu_and_mul_sparse' && vars.a.ndim == 2 && vars.a.contiguous"
  - return:
      supported: true
      supports_args: true
    title: "native: supports_args is None, so every call is supported"
    source: "vllm/ir/op.py:622"
- component: ir-op
  name: set-priority
  kind: function
  summary: "IrOp.set_priority(priority) / set_default: filter the list to supported providers (native appended when some provider is conditional) and dispatch with it; set_priority restores the old list\
    \ on exit."
  sources:
