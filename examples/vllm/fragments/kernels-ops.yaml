    - if: "(vars.p == 'vllm_c' && input.op != 'gelu_and_mul_sparse' && input.variance_size == 0 && input.weight_dtype_matches) || (vars.p == 'oink' && input.op != 'gelu_and_mul_sparse' && input.ndim ==\
        \ 2 && input.contiguous) || (vars.p == 'triton' && input.op == 'gelu_and_mul_sparse' && input.device_type == 'cuda' && input.contiguous && input.approximate == 'tanh' && input.hidden_size % 2 ==\
        \ 0 && input.hidden_size / 2 <= 32768) || vars.p == 'native'"
      title: "supports_args holds: use this provider"
