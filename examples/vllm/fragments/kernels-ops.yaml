- component: cuda-graph-wrapper
  name: call
  kind: function
  summary: "CUDAGraphWrapper.__call__: capture a CUDA graph for a new batch descriptor, replay it afterwards, or run eagerly."
  sources:
  - "vllm/compilation/cuda_graph.py:235-362"
  request: KernelsOpsGraphCall
  response:
    type: object
    properties:
      path:
        type: string
      key:
        type: string
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  - code: assertion-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - title: "No forward context: run the wrapped runnable without CUDA graphs"
    source: "vllm/compilation/cuda_graph.py:236"
    if: "!input.forward_context"
    then:
    - call: "= input.wrapper_mode == 'FULL' ? 'support-torch-compile.call' : 'piecewise-backend.call'"
      targets:
      - support-torch-compile.call
      - piecewise-backend.call
      input: "= input"
    - return:
        path: eager
        key: ''
  - title: "Runtime mode NONE or not this wrapper's mode: run eagerly"
    detail: "Profile and warmup runs, or the nested wrapper of the other mode."
    source: "vllm/compilation/cuda_graph.py:247"
    if: "input.runtime_mode == 'NONE' || input.runtime_mode != input.wrapper_mode"
    then:
    - call: "= input.wrapper_mode == 'FULL' ? 'support-torch-compile.call' : 'piecewise-backend.call'"
      targets:
      - support-torch-compile.call
      - piecewise-backend.call
      input: "= input"
    - return:
        path: eager
        key: ''
  - set:
      vars.key: "= 'n' + string(input.num_tokens) + (input.uniform_decode ? '_uniform' : '_mixed')"
    title: Look up the entry for this batch descriptor
    source: "vllm/compilation/cuda_graph.py:259"
  - if: "!(vars.key in state.entries)"
    title: "First use of this batch descriptor: capture"
    source: "vllm/compilation/cuda_graph.py:267"
    then:
    - title: Capture must be legal now
      source: "vllm/compilation/cuda_graph.py:279"
      call: compilation-monitor.validate-cudagraph-capturing-enabled
      input: {}
    - title: Run the runnable once under torch.cuda.graph in the global graph pool
      source: "vllm/compilation/cuda_graph.py:320"
      call: "= input.wrapper_mode == 'FULL' ? 'support-torch-compile.call' : 'piecewise-backend.call'"
      targets:
      - support-torch-compile.call
      - piecewise-backend.call
      input: "= input"
      as: run
    - wait: "= config['cudagraph-capture-overhead-ms']"
    - title: Keep only a weak reference to the output
      source: "vllm/compilation/cuda_graph.py:337"
      call: torch-utils.weak-ref-tensor
      input:
        numel: "= input.num_tokens"
    - set:
        "= 'state.entries.' + vars.key":
          captured: true
          gpu_ms: "= vars.run.duration_ms"
          input_addresses: "= input.input_addresses"
        state.num_cudagraph_captured: "= state.num_cudagraph_captured + 1"
      title: Store the entry; count the capture
      source: "vllm/compilation/cuda_graph.py:340"
    - call: compilation-counter.increment
      input:
        field: num_cudagraph_captured
        by: 1
      source: "vllm/compilation/cuda_graph.py:340"
      title: compilation_counter.num_cudagraph_captured += 1
    - return:
        path: capture
        key: "= vars.key"
  - if: "input.debug && state.entries[vars.key].input_addresses != input.input_addresses"
    title: "Debug logging: replay inputs must sit at the captured addresses"
    source: "vllm/compilation/cuda_graph.py:352"
    then:
    - fail:
        code: assertion-error
        message: Input addresses for cudagraphs are different during replay
  - title: Replay the captured graph
    detail: Replays the recorded kernels without Python launch overhead; the GPU time recorded at capture.
    source: "vllm/compilation/cuda_graph.py:361"
    wait: "= state.entries[vars.key].gpu_ms"
  - return:
      path: replay
      key: "= vars.key"
