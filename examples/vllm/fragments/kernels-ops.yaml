- component: aiter-ops
  name: is-aiter-found-and-supported
  kind: function
  summary: "is_aiter_found_and_supported: ROCm, aiter importable and a CDNA3+ device (gfx942, gfx950); env vars are not consulted."
  sources:
  - "vllm/_aiter_ops.py:202-222"
  - "vllm/platforms/rocm.py:362-372"
  response:
    type: object
    properties:
      supported:
        type: boolean
      cdna_version:
        type: integer
  latency_ms: 0
  behavior:
  - if: "config['vllm-target-device'] != 'rocm' || !state.aiter_found"
    title: "Not ROCm, or no aiter package"
    source: "vllm/_aiter_ops.py:218"
    then:
    - return:
        supported: false
        cdna_version: 0
  - set:
      vars.cdna: "= state.gcn_arch == 'gfx90a' ? 2 : (state.gcn_arch == 'gfx942' ? 3 : (state.gcn_arch == 'gfx950' ? 4 : (state.gcn_arch == 'gfx1250' ? 5 : 0)))"
    title: "get_cdna_version: gfx90a 2, gfx942 3, gfx950 4, gfx1250 5, else 0"
    source: "vllm/platforms/rocm.py:362"
  - return:
      supported: "= vars.cdna > 2"
      cdna_version: "= vars.cdna"
    title: CDNA 3 or newer
    source: "vllm/_aiter_ops.py:221"
