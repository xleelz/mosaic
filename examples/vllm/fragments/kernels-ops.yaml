  kind: function
  summary: "CompilationCounter.expect(**kwargs) exit check: each named counter must have grown by exactly the expected amount since the snapshot."
  sources:
  - "vllm/compilation/counter.py:47-56"
  request:
    type: object
    required:
    - before
    - expected
    properties:
      before:
        type: object
        description: the clone() taken when the with-block was entered
      expected:
        type: array
        items:
          type: object
          properties:
            field:
              type: string
              enum:
              - num_models_seen
              - num_graphs_seen
              - num_piecewise_graphs_seen
              - num_piecewise_capturable_graphs_seen
              - num_backend_compilations
              - num_gpu_runner_capture_triggers
              - num_cudagraph_captured
              - num_inductor_compiles
              - num_eager_compiles
              - num_cache_entries_updated
              - num_compiled_artifacts_saved
              - num_compiled_artifacts_loaded
              - num_aot_compiles
              - num_aot_artifacts_saved
              - num_aot_artifacts_loaded
              - stock_torch_compile_count
            diff:
              type: integer
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - foreach: "= input.expected"
    as: e
    title: "for k, v in kwargs.items()"
    source: "vllm/compilation/counter.py:50"
    steps:
    - if: "state.counters[vars.e.field] - input.before[vars.e.field] != vars.e.diff"
