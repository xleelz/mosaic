- component: inductor-pass
  name: pass-context
  kind: function
  summary: "pass_context(compile_range): install a PassContext for the with-block (enter) and restore the previous one (exit)."
  sources:
  - "vllm/compilation/passes/inductor_pass.py:44-55"
  - "vllm/compilation/passes/inductor_pass.py:29-35"
  request:
    type: object
    properties:
      phase:
        type: string
        enum:
        - enter
        - exit
      range_start:
        type: integer
        default: 1
      range_end:
        type: integer
        default: 8192
  latency_ms: 0
  behavior:
  - if: "input.phase == 'enter'"
    title: "_pass_context = PassContext(compile_range), remembering the previous one"
    source: "vllm/compilation/passes/inductor_pass.py:50"
    then:
    - set:
        state.stack: "= state.stack + [{'start': input.range_start, 'end': input.range_end}]"
    - return:
        depth: "= size(state.stack)"
  - set:
      state.stack: "= state.stack.size() > 0 ? state.stack.slice(0, size(state.stack) - 1) : []"
    title: "finally: restore prev_context"
    source: "vllm/compilation/passes/inductor_pass.py:54"
  - return:
      depth: "= size(state.stack)"
- component: inductor-standalone-adaptor
