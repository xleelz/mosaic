      - vllm-c.fused-add-rms-norm
      - oink-ops.rms-norm
      - oink-ops.fused-add-rms-norm
      - kernels-triton-activation.gelu-and-mul-sparse-triton
      - ir-ops-layernorm.rms-norm
      - ir-ops-layernorm.fused-add-rms-norm
