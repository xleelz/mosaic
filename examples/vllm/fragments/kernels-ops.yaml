- component: aiter-ops
  name: group-fp8-quant
  kind: function
  summary: "rocm_aiter_ops.group_fp8_quant: only group size 128; one FP8 scale per 128 columns."
  sources:
  - "vllm/_aiter_ops.py:3925-3935"
  request:
    type: object
    properties:
      num_tokens:
        type: integer
        examples:
        - 16
      hidden_size:
        type: integer
        examples:
        - 4096
      dtype_bytes:
        type: integer
        examples:
        - 2
      scale_given:
        type: boolean
        default: false
      group_size:
        type: integer
        default: 128
  response:
    type: object
    properties:
      scale_shape:
        type: array
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "input.group_size != 128"
    title: assert group_size == 128
    source: "vllm/_aiter_ops.py:3930"
    then:
    - fail:
        code: assertion-error
        message: Group size must be 128
  - call: aiter-ops.rocm-aiter-group-fp8-quant
    input:
      num_tokens: "= input.num_tokens"
      hidden_size: "= input.hidden_size"
      dtype_bytes: "= input.dtype_bytes"
    source: "vllm/_aiter_ops.py:3931"
  - return:
      scale_shape: "= [input.num_tokens, (input.hidden_size + 127) / 128]"
