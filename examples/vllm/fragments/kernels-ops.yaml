  - title: "No listed provider supports every arg: native was appended by _filter_priority_impls"
    source: "vllm/ir/op.py:405"
    call: "= {'vllm_c': {'rms_norm': 'vllm-c.rms-norm', 'fused_add_rms_norm': 'vllm-c.fused-add-rms-norm'}, 'oink': {'rms_norm': 'oink-ops.rms-norm', 'fused_add_rms_norm': 'oink-ops.fused-add-rms-norm'},\
      \ 'triton': {'gelu_and_mul_sparse': 'kernels-triton-activation.gelu-and-mul-sparse-triton'}, 'native': {'rms_norm': 'ir-ops-layernorm.rms-norm', 'fused_add_rms_norm': 'ir-ops-layernorm.fused-add-rms-norm',\
      \ 'gelu_and_mul_sparse': 'ir-ops-activation.gelu-and-mul-sparse'}}['native'][input.op]"
    targets:
    - vllm-c.rms-norm
