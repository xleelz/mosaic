schemas:
- id: KernelsOpsTokenShape
  summary: "Token-major activation shape: elementwise, norm, activation, quantization, rope and cache-write kernels."
  schema:
    type: object
    properties:
      num_tokens:
        type: integer
        minimum: 0
        examples:
        - 16
      hidden_size:
        type: integer
        minimum: 1
        examples:
        - 4096
      dtype_bytes:
        type: integer
        enum:
        - 1
        - 2
        - 4
        examples:
        - 2
- id: KernelsOpsGemmShape
  summary: "GEMM shape: [m, k] x [k, n]; dtype_bytes is the weight element size (1 for FP8/INT8, 2 for BF16)."
  schema:
    type: object
    properties:
      m:
        type: integer
        minimum: 0
        examples:
        - 16
      n:
        type: integer
        minimum: 1
        examples:
        - 4096
      k:
        type: integer
        minimum: 1
        examples:
        - 4096
      dtype_bytes:
        type: integer
        enum:
        - 1
        - 2
        - 4
        examples:
        - 2
- id: KernelsOpsMoeShape
  summary: "Mixture-of-experts shape: routed tokens, experts, top-k and the expert GEMM [k -> n]."
  schema:
    type: object
    properties:
      num_tokens:
        type: integer
        minimum: 0
        examples:
        - 16
      num_experts:
        type: integer
        minimum: 1
        examples:
        - 8
      topk:
        type: integer
        minimum: 1
        examples:
        - 2
      n:
        type: integer
        minimum: 1
        examples:
        - 14336
      k:
        type: integer
        minimum: 1
        examples:
        - 4096
      dtype_bytes:
        type: integer
        enum:
        - 1
        - 2
        - 4
        examples:
        - 2
- id: KernelsOpsAttentionShape
  summary: "Attention shape over a paged KV cache: sequences, context length and heads."
  schema:
    type: object
    properties:
      num_seqs:
        type: integer
        minimum: 0
        examples:
        - 16
      seq_len:
        type: integer
        minimum: 0
        examples:
        - 1024
      num_heads:
        type: integer
        minimum: 1
        examples:
        - 32
      num_kv_heads:
        type: integer
        minimum: 1
        examples:
        - 8
      head_dim:
        type: integer
        minimum: 1
        examples:
        - 128
      dtype_bytes:
        type: integer
        enum:
        - 1
        - 2
        - 4
        examples:
        - 2
- id: KernelsOpsBlockCopyShape
  summary: "KV block copy between devices: number of blocks and bytes per block."
  schema:
    type: object
    properties:
      num_blocks:
        type: integer
        minimum: 0
        examples:
        - 4
      block_bytes:
        type: integer
        minimum: 1
        examples:
        - 2097152
- id: KernelsOpsCollectiveShape
  summary: "One rank's side of a collective: the bytes it contributes and the group size."
  schema:
    type: object
    properties:
      num_bytes:
        type: integer
        minimum: 0
        examples:
        - 131072
      world_size:
        type: integer
        minimum: 1
        examples:
        - 4
- id: KernelsOpsQuery
  summary: A capability query or setup call with no tensor work.
  schema:
    type: object
    properties:
      device:
        type: integer
        minimum: 0
        examples:
        - 0
- id: KernelsOpsIrCall
  summary: "A call of a vllm.ir op: which op and the argument properties that supports_args checks."
  schema:
    type: object
    required:
    - op
    properties:
      op:
        type: string
        examples:
        - rms_norm
      num_tokens:
        type: integer
        examples:
        - 16
      hidden_size:
        type: integer
        examples:
        - 4096
      dtype_bytes:
        type: integer
        examples:
        - 2
      variance_size:
        type: integer
        examples:
        - 0
        description: 0 means None
      weight_dtype_matches:
        type: boolean
        default: true
      contiguous:
        type: boolean
        default: true
      ndim:
        type: integer
        examples:
        - 2
      approximate:
        type: string
        examples:
        - tanh
      device_type:
        type: string
        examples:
        - cuda
- id: KernelsOpsGraphCall
  summary: "A call into a compiled or captured graph: the batch it runs and the forward-context fields the wrapper reads."
  schema:
    type: object
    properties:
      num_tokens:
        type: integer
        examples:
        - 16
      uniform_decode:
        type: boolean
        default: true
      runtime_mode:
        type: string
        enum:
        - NONE
        - PIECEWISE
        - FULL
        examples:
        - FULL
      wrapper_mode:
        type: string
        enum:
        - PIECEWISE
        - FULL
        examples:
        - FULL
      forward_context:
        type: boolean
        default: true
      debug:
        type: boolean
        default: false
      input_addresses:
        type: array
        items:
          type: integer
        examples:
        - - 140000000
      num_layers:
        type: integer
        examples:
        - 32
      config_hash:
        type:
        - string
        - "null"
        default: null
        description: "VllmConfig.compute_hash() of the deployment; null: the backend computes it (config-platform's vllm-config.compute-hash)"
- id: KernelsOpsCompileCall
  summary: "A compile request: the model's layer count decides how many pieces the split graph has."
  schema:
    type: object
    properties:
      num_layers:
        type: integer
        examples:
        - 32
      num_tokens:
        type: integer
        examples:
        - 8192
      prefix:
        type: string
        examples:
        - backbone
      graph_patterns:
        type: array
        items:
          type: string
        examples:
        - - rms_norm
          - silu_and_mul
      config_hash:
        type:
        - string
        - "null"
        default: null
        description: "VllmConfig.compute_hash(): ModelConfig, ParallelConfig, CompilationConfig, ... factors (language_model_only among them); null: the backend calls config-platform's vllm-config.compute-hash"
      env_hash:
        type: string
        default: env0
        description: hash_factors(envs.compile_factors())
      code_hash:
        type: string
        default: code0
        description: sha256 of the traced source files
      compiler_hash:
        type: string
        default: inductor
        description: CompilerManager.compute_hash (torch/Inductor version and config)
      cache_dir:
        type: string
        default: ''
        description: compilation_config.cache_dir; empty means derive it from the factors
      cache_root:
        type: string
        default: ~/.cache/vllm
        description: VLLM_CACHE_ROOT
      rank:
        type: integer
        default: 0
      dp_rank:
        type: integer
        default: 0
- id: KernelsOpsFp8QuantCall
  summary: scaled_fp8_quant arguments that pick the kernel.
  schema:
    type: object
    properties:
      num_tokens:
        type: integer
        examples:
        - 16
      hidden_size:
        type: integer
        examples:
        - 4096
      dtype_bytes:
        type: integer
        examples:
        - 2
      has_scale:
        type: boolean
        default: false
      use_per_token_if_dynamic:
        type: boolean
        default: false
      has_scale_ub:
        type: boolean
        default: false
      num_token_padding:
        type: integer
        examples:
        - 0
      has_output:
        type: boolean
        default: false
      ndim:
        type: integer
        examples:
        - 2
- id: KernelsOpsInt8QuantCall
  summary: scaled_int8_quant arguments that pick the kernel.
  schema:
    type: object
    properties:
      num_tokens:
        type: integer
        examples:
        - 16
      hidden_size:
        type: integer
        examples:
        - 4096
      dtype_bytes:
        type: integer
        examples:
        - 2
      has_scale:
        type: boolean
        default: false
      has_azp:
        type: boolean
        default: false
      symmetric:
        type: boolean
        default: true
- id: KernelsOpsScaledMmCall
  summary: cutlass_scaled_mm arguments.
  schema:
    type: object
    properties:
      m:
        type: integer
        examples:
        - 16
      n:
        type: integer
        examples:
        - 4096
      k:
        type: integer
        examples:
        - 4096
      dtype_bytes:
        type: integer
        examples:
        - 1
      out_dtype:
        type: string
        examples:
