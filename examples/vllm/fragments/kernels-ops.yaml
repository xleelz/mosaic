  summary: "torch op _flashkda_C::get_workspace_size"
  description: "Registered as `_flashkda_C::get_workspace_size`: `get_workspace_size(int T_total, int H, int N=1) -> int`. Dispatch: CompositeExplicitAutograd=TORCH_BOX(&get_workspace_size). Latency model:\
    \ no device work (host query or setup); 0 ms; the kernel body is not simulated."
