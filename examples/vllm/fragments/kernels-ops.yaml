- component: kernels-triton-activation
  name: gelu-and-mul-sparse-triton
  kind: kernel
  summary: "triton_op vllm::gelu_and_mul_sparse_triton: one program per row launching _gelu_and_mul_sparse_kernel."
  sources:
  - "vllm/kernels/triton/activation.py:106-110"
  - "vllm/kernels/triton/activation.py:74-98"
  - "vllm/kernels/triton/activation.py:17-53"
  request: KernelsOpsIrCall
  response:
    type: object
    properties:
      launched:
        type: boolean
      d:
        type: integer
      block_size:
        type: integer
      num_warps:
        type: integer
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  latency_ms: "= (double(config['kernel-launch-overhead-us']) + 3.0 * double(input.num_tokens) * double(input.hidden_size) * double(input.dtype_bytes) / (double(config['gpu-hbm-bandwidth-gbps']) * 1000.0))\
    \ / 1000.0"
  behavior:
  - if: "input.approximate != 'tanh'"
    title: The Triton impl only implements the tanh approximation
    source: "vllm/kernels/triton/activation.py:109"
    then:
    - fail:
        code: assertion-error
        message: "approximate must be 'tanh'"
  - set:
      vars.d: "= input.hidden_size / 2"
    title: "d = x.shape[-1] // 2; output [..., d]"
    source: "vllm/kernels/triton/activation.py:79"
  - if: input.num_tokens == 0
    title: "Empty output: nothing to launch"
    source: "vllm/kernels/triton/activation.py:80"
    then:
    - return:
        launched: false
        d: "= vars.d"
        block_size: 0
        num_warps: 0
