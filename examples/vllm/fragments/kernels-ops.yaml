  behavior:
  - set:
      state.disable_cache: "= input.disable_cache"
      state.cache: {}
  - if: "!input.disable_cache"
    title: Read vllm_compile_cache.py if it exists
    source: "vllm/compilation/backends.py:188"
    then:
    - call: torch-compile-cache.read-file
      input:
        path: "= input.cache_dir + '/vllm_compile_cache.py'"
      as: f
      on_error: continue
    - if: vars.f.ok
      title: "The file exists: parse it with ast.literal_eval"
      source: "vllm/compilation/backends.py:194"
      then:
      - set:
          state.cache: "= vars.f.value.content"
- component: compiler-manager
  name: save-to-file
