  description: "Registered as the custom op `vllm::mm_mxfp8` (impl mm_mxfp8). Latency model: GEMM roofline (tensor-core time vs weight read); the kernel body is not simulated."
  sources:
  - "vllm/utils/flashinfer.py:1036-1061"
  attributes:
    op: "vllm::mm_mxfp8"
    latency_model: gemm
    kernels: []
  request: KernelsOpsGemmShape
  latency_ms: "= (double(config['kernel-launch-overhead-us']) + math.greatest(2.0 * double(input.m) * double(input.n) * double(input.k) / (double(config['gpu-bf16-dense-tflops']) * (input.dtype_bytes ==\
    \ 1 ? 2.0 : 1.0) * 1000000.0), double(input.n) * double(input.k) * double(input.dtype_bytes) / (double(config['gpu-hbm-bandwidth-gbps']) * 1000.0))) / 1000.0"
- component: flashkda-registration
  name: fwd
  kind: kernel
  summary: "torch op _flashkda_C::fwd"
  description: "Registered as `_flashkda_C::fwd`: `fwd(Tensor q, Tensor k, Tensor v, Tensor g, Tensor beta, float scale, Tensor(a!) out, Tensor(c!) workspace, Tensor A_log, Tensor dt_bias, float lower_bound,\
    \ Tensor? initial_state=None, Tensor(b!)? final_state=None, Tensor? cu_seqlens=None, Tensor(d!)? checkpoint_state=None, Tensor? checkpoint_offset`. Dispatch: CUDA=TORCH_BOX(&fwd). Latency model: memory-bound\
    \ read of the K/V context; the kernel body is not simulated."
  sources:
  - "csrc/flashkda_registration.cpp:8-14"
  attributes:
    op: "_flashkda_C::fwd"
    latency_model: attention
    kernels: []
  request: KernelsOpsAttentionShape
  latency_ms: "= (double(config['kernel-launch-overhead-us']) + 2.0 * double(input.num_seqs) * double(input.seq_len) * double(input.num_kv_heads) * double(input.head_dim) * double(input.dtype_bytes) / (double(config['gpu-hbm-bandwidth-gbps'])\
    \ * 1000.0)) / 1000.0"
- component: flashkda-registration
