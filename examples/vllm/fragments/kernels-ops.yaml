fixtures:
- id: kernels-ops-seed
  summary: "kernels-ops state at worker start: CUDA graph capture allowed, no graphs captured, empty compile caches."
  state:
    compilation-monitor:
      cudagraph_capturing_enabled: true
    cuda-graph-wrapper:
      entries: {}
      num_cudagraph_captured: 0
    compiler-manager:
      cache: {}
      is_cache_updated: false
      disable_cache: false
    torch-compile-cache:
      files: {}
      aot: {}
flows:
- id: kernels-ops-helion-kernel
  name: Helion kernel registration and call
  tags:
  - writes
  description: "A Helion kernel is registered at import (platform configs loaded or the kernel disabled), then called with a batch; the pre-tuned config is picked by shape."
  entry:
    caller: gpu-worker
    interface: helion-kernel-wrapper.register-kernel
    input:
      op_name: silu_mul_fp8
      device_name: NVIDIA H100 80GB HBM3
      helion_installed: true
  sources:
  - "vllm/kernels/helion/register.py:401"
- id: kernels-ops-helion-call
  name: Helion kernel call
  description: A layer calls a registered Helion kernel.
  entry:
    caller: gpu-worker
    interface: helion-kernel-wrapper.call
    input:
      op_name: silu_mul_fp8
      num_tokens: 16
      intermediate_size: 14336
  sources:
  - "vllm/kernels/helion/register.py:296"
- id: kernels-ops-ir-op-dispatch
  name: vLLM IR op dispatch
  description: "A layer calls a vllm.ir op (rms_norm, fused_add_rms_norm, gelu_and_mul_sparse); IrOp picks a provider by priority and supports_args."
  entry:
    caller: gpu-worker
    interface: ir-op.call
    input:
      op: rms_norm
      num_tokens: 16
      hidden_size: 4096
      dtype_bytes: 2
      variance_size: 0
      weight_dtype_matches: true
      contiguous: true
      ndim: 2
      approximate: tanh
      device_type: cuda
  sources:
  - "vllm/ir/op.py:321"
- id: kernels-ops-cuda-graph-wrapper
  name: CUDA graph capture and replay
  tags:
  - writes
  - "feature:cuda-graphs"
  description: "The model runner calls a CUDAGraphWrapper with the forward context's runtime mode and batch descriptor; first use captures, later uses replay."
  entry:
    caller: gpu-worker
    interface: cuda-graph-wrapper.call
    input:
      num_tokens: 16
      uniform_decode: true
      runtime_mode: PIECEWISE
      wrapper_mode: PIECEWISE
      forward_context: true
      debug: false
      input_addresses:
      - 140000000
      num_layers: 32
  sources:
  - "vllm/compilation/cuda_graph.py:235"
- id: kernels-ops-cuda-graph-replay
  tags:
  - "feature:cuda-graphs"
  name: CUDA graph replay during serving
  description: A serving step whose batch descriptor was captured at startup replays the graph through the same wrapper (the read side of the capture phase).
  entry:
    caller: gpu-worker
    interface: cuda-graph-wrapper.call
    input:
      num_tokens: 16
      uniform_decode: true
      runtime_mode: PIECEWISE
      wrapper_mode: PIECEWISE
      forward_context: true
      debug: false
      input_addresses:
      - 140000000
      num_layers: 32
  sources:
  - "vllm/compilation/cuda_graph.py:361"
- id: kernels-ops-vllm-backend-compile
  name: VllmBackend piecewise compile
  tags:
  - writes
  - "feature:torch-compile"
  description: "Dynamo hands the traced graph to VllmBackend: split at attention, compile every piece for every range (or load it from the compile cache), save the cache index."
  entry:
    caller: gpu-worker
    interface: vllm-backend.call
    input:
      num_layers: 32
      num_tokens: 8192
      prefix: backbone
      graph_patterns: []
  sources:
  - "vllm/compilation/backends.py:1027"
- id: kernels-ops-piecewise-backend-dispatch
  tags:
  - "feature:torch-compile"
  name: Piecewise backend runtime dispatch
  description: "A compiled piece is called with the batch's token count and runs the range entry compiled for it."
  entry:
    caller: gpu-worker
    interface: piecewise-backend.call
    input:
      num_tokens: 16
  sources:
  - "vllm/compilation/piecewise_backend.py:357"
- id: kernels-ops-support-torch-compile
  name: "@support_torch_compile model call"
  tags:
  - writes
  - "feature:torch-compile"
  description: "The model runner calls the decorated model: eager, AOT artifact load, guard-free dispatch, or first-call compilation (AOT by default with torch 2.13)."
  entry:
    caller: gpu-worker
    interface: support-torch-compile.call
    input:
      num_tokens: 16
      num_layers: 32
      runtime_mode: NONE
      wrapper_mode: PIECEWISE
      forward_context: true
  sources:
  - "vllm/compilation/decorators.py:524"
- id: kernels-ops-post-grad-pass-manager
  tags:
  - "feature:torch-compile"
  name: Post-grad custom passes
  description: "Inductor calls vLLM's PostGradPassManager on each compiled graph; enabled fusion passes rewrite patterns into fused custom ops."
  entry:
    caller: gpu-worker
    interface: post-grad-pass-manager.call
    input:
      graph_patterns:
      - noop_reshape
      - rms_norm
      - silu_and_mul
  sources:
  - "vllm/compilation/passes/pass_manager.py:106"
- id: kernels-ops-scaled-fp8-quant
  name: FP8 activation quantization
  description: "A quantized linear layer quantizes activations with ops.scaled_fp8_quant, which picks the static, dynamic per-tensor or dynamic per-token kernel."
  entry:
    caller: gpu-worker
    interface: custom-ops.scaled-fp8-quant
    input:
      num_tokens: 16
      hidden_size: 4096
      dtype_bytes: 2
      ndim: 2
      num_token_padding: 0
  sources:
  - "vllm/_custom_ops.py:1823"
- id: kernels-ops-scaled-int8-quant
  name: INT8 activation quantization
  description: "W8A8 INT8 layers quantize activations with ops.scaled_int8_quant: static (with optional zero point) or dynamic per token."
  entry:
    caller: gpu-worker
    interface: custom-ops.scaled-int8-quant
    input:
      num_tokens: 16
      hidden_size: 4096
      dtype_bytes: 2
      symmetric: true
  sources:
  - "vllm/_custom_ops.py:1895"
- id: kernels-ops-cutlass-scaled-mm
  name: Scaled GEMM
  description: "An FP8/INT8 linear layer runs ops.cutlass_scaled_mm: CUTLASS when B is 16-aligned on CUDA, Triton otherwise."
  entry:
    caller: gpu-worker
    interface: custom-ops.cutlass-scaled-mm
    input:
      m: 16
      n: 4096
      k: 4096
      dtype_bytes: 1
      out_dtype: bfloat16
  sources:
  - "vllm/_custom_ops.py:771"
scenarios:
- id: kernels-ops-ir-op-dispatch-deployed-native
  flow: kernels-ops-ir-op-dispatch
  name: "Deployed (VLLM_COMPILE + inductor): rms_norm runs the native impl, not _C.rms_norm"
  fixtures:
  - tp1-llama-8b
  expect:
  - "result.ok && result.value.provider == 'native'"
- id: kernels-ops-ir-op-dispatch-eager-vllm-c
  flow: kernels-ops-ir-op-dispatch
  name: "No codegen (enforce_eager): vllm_c first, so _C.rms_norm runs"
  fixtures:
  - tp1-llama-8b
  config:
    compilation-mode: 0
    ir-op-priority:
      rms_norm:
      - vllm_c
      - native
      fused_add_rms_norm:
      - vllm_c
      - native
      gelu_and_mul_sparse:
      - triton
      - native
  expect:
  - "result.ok && result.value.provider == 'vllm_c'"
  - "ctx.ir_provider == 'vllm_c'"
- id: kernels-ops-ir-op-dispatch-variance-size-fallback
  flow: kernels-ops-ir-op-dispatch
  name: "vllm_c refuses variance_size: native is appended after the list"
  fixtures:
  - tp1-llama-8b
  config:
    ir-op-priority:
      rms_norm:
      - vllm_c
  input:
    variance_size: 64
  expect:
  - "result.ok && result.value.provider == 'native'"
- id: kernels-ops-ir-op-dispatch-gelu-sparse-triton
  flow: kernels-ops-ir-op-dispatch
  name: gelu_and_mul_sparse with tanh runs the Triton kernel
  fixtures:
  - tp1-llama-8b
  input:
    op: gelu_and_mul_sparse
    hidden_size: 28672
  expect:
  - "result.ok && result.value.provider == 'triton'"
  - "ctx.triton_kernel == '_gelu_and_mul_sparse_kernel'"
- id: kernels-ops-ir-op-dispatch-gelu-sparse-exact-gelu
  flow: kernels-ops-ir-op-dispatch
  name: "approximate='none' is not supported by Triton: native"
  fixtures:
  - tp1-llama-8b
  input:
    op: gelu_and_mul_sparse
    approximate: none
  expect:
  - "result.ok && result.value.provider == 'native'"
- id: kernels-ops-ir-op-dispatch-gelu-sparse-empty
  flow: kernels-ops-ir-op-dispatch
  name: An empty batch launches nothing
  fixtures:
  - tp1-llama-8b
  input:
    op: gelu_and_mul_sparse
    num_tokens: 0
  expect:
  - "result.ok && result.value.provider == 'triton'"
  - "!has(ctx.triton_kernel)"
- id: kernels-ops-ir-op-dispatch-unknown-op
  flow: kernels-ops-ir-op-dispatch
  name: An op vllm.ir.ops does not define fails with AttributeError
  fixtures:
  - tp1-llama-8b
  input:
    op: silu_and_mul
  expect:
  - "!result.ok && result.error.code == 'attribute-error'"
- id: kernels-ops-ir-op-dispatch-triton-filtered-on-cpu
  flow: kernels-ops-ir-op-dispatch
  name: On the CPU platform the Triton provider is filtered out
  fixtures:
  - tp1-llama-8b
  config:
    vllm-target-device: cpu
  input:
    op: gelu_and_mul_sparse
    device_type: cpu
  expect:
  - "result.ok && result.value.provider == 'native'"
- id: kernels-ops-ir-op-dispatch-rocm-noncontiguous
  flow: kernels-ops-ir-op-dispatch
  name: ROCm vllm_c fused_add_rms_norm on a non-contiguous input falls back to native inside the provider
  fixtures:
  - tp1-llama-8b
  config:
    vllm-target-device: rocm
    ir-op-priority:
      rms_norm:
      - vllm_c
      - native
      fused_add_rms_norm:
      - vllm_c
      - native
      gelu_and_mul_sparse:
      - triton
      - native
  input:
    op: fused_add_rms_norm
    contiguous: false
    ndim: 2
  expect:
  - "result.ok && result.value.provider == 'vllm_c'"
- id: kernels-ops-ir-op-dispatch-rocm-3d-reshape
  flow: kernels-ops-ir-op-dispatch
  name: ROCm vllm_c rms_norm flattens a 3D input before the kernel
  fixtures:
  - tp1-llama-8b
  config:
    vllm-target-device: rocm
    ir-op-priority:
      rms_norm:
      - vllm_c
      - native
      fused_add_rms_norm:
      - vllm_c
      - native
      gelu_and_mul_sparse:
      - triton
      - native
  input:
    ndim: 3
  expect:
  - "result.ok && ctx.rocm_reshaped"
- id: kernels-ops-ir-op-dispatch-eager-fused-add
  flow: kernels-ops-ir-op-dispatch
  name: "No codegen: fused_add_rms_norm runs _C.fused_add_rms_norm in place"
  fixtures:
  - tp1-llama-8b
  config:
    compilation-mode: 0
    ir-op-priority:
      rms_norm:
      - vllm_c
      - native
      fused_add_rms_norm:
      - vllm_c
      - native
      gelu_and_mul_sparse:
      - triton
      - native
  input:
    op: fused_add_rms_norm
  expect:
  - "result.ok && result.value.provider == 'vllm_c'"
- id: kernels-ops-ir-op-dispatch-priority-unset
  flow: kernels-ops-ir-op-dispatch
  name: "No priority set: native with a warning"
  fixtures:
  - tp1-llama-8b
  config:
    ir-op-priority:
      rms_norm: []
  expect:
  - "result.ok && result.value.provider == 'native'"
- id: kernels-ops-ir-op-dispatch-oink
  flow: kernels-ops-ir-op-dispatch
  name: VLLM_USE_OINK_OPS puts oink first for a contiguous 2D input
  fixtures:
  - tp1-llama-8b
  config:
    ir-op-priority:
      rms_norm:
      - oink
      - native
  expect:
  - "result.ok && result.value.provider == 'oink'"
- id: kernels-ops-cuda-graph-wrapper-capture-then-replay
  flow: kernels-ops-cuda-graph-wrapper
  name: "First call captures, the second replays the same batch descriptor"
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: kernels-ops-cuda-graph-wrapper
    as: cap
  - flow: kernels-ops-cuda-graph-replay
    as: rep
  expect:
  - "steps.cap.result.value.path == 'capture' && steps.rep.result.value.path == 'replay'"
  - "state['cuda-graph-wrapper@rank0'].num_cudagraph_captured == 1 && state['cuda-graph-wrapper@rank0'].entries.n16_uniform.captured"
  - "trace.filter(e, e.type == 'call.start' && e.interface == 'piecewise-backend.call').size() == 1"
- id: kernels-ops-cuda-graph-wrapper-runtime-none
  flow: kernels-ops-cuda-graph-wrapper
  name: Runtime mode NONE (profile/warmup) runs eagerly and captures nothing
  fixtures:
  - tp1-llama-8b
  input:
    runtime_mode: NONE
  expect:
  - "result.ok && result.value.path == 'eager'"
  - "size(state['cuda-graph-wrapper@rank0'].entries) == 0"
  - "trace.exists(e, e.type == 'call.start' && e.interface == 'piecewise-backend.call')"
- id: kernels-ops-cuda-graph-wrapper-mode-mismatch
  flow: kernels-ops-cuda-graph-wrapper
  name: A FULL batch passes through the PIECEWISE wrapper without capture
  fixtures:
  - tp1-llama-8b
  input:
    runtime_mode: FULL
    wrapper_mode: PIECEWISE
  expect:
  - "result.ok && result.value.path == 'eager'"
  - "state['cuda-graph-wrapper@rank0'].num_cudagraph_captured == 0"
- id: kernels-ops-cuda-graph-wrapper-no-forward-context
  flow: kernels-ops-cuda-graph-wrapper
  name: Outside the inference path (no forward context) the runnable runs directly
  fixtures:
  - tp1-llama-8b
  input:
    forward_context: false
  expect:
