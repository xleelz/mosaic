  name: call
  kind: function
  summary: "RocmAiterRMSNormQuantFusionPass: replace AITER rms_norm / fused_add_rms_norm followed by a group or per-token FP8 quant with one fused AITER op (double-quant fan-outs first; per-token patterns\
    \ not on RDNA4; gated-norm only for 128-wide GDN heads)."
  sources:
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:564-689"
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:299-337"
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:367-416"
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:183-215"
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:238-270"
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:68-98"
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:121-151"
  - "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:452-509"
  request:
    type: object
    properties:
      graph_patterns:
        type: array
        items:
          type: string
      rdna:
        type: boolean
        default: false
        description: "rocm_aiter_ops.is_rdna_aiter_enabled(): native quant matchers only"
      gdn_head_dims:
        type: array
        items:
          type: integer
        default: []
        description: "head_v_dim of the model's GatedDeltaNet layers"
      gdn_triton_kernels:
        type: boolean
        default: true
  response:
    type: object
    properties:
      replaced:
        type: integer
      fused_ops:
        type: array
        items:
          type: string
  latency_ms: 0
  behavior:
  - set:
      vars.m: "= [{'p': 'rms_norm+2x_group_fp8_quant', 'op': 'vllm::rocm_aiter_rmsnorm_fp8_group_quant', 'on': true}, {'p': 'rms_norm+view+2x_group_fp8_quant', 'op': 'vllm::rocm_aiter_rmsnorm_fp8_group_quant',\
        \ 'on': true}, {'p': 'rms_norm+group_fp8_quant', 'op': 'vllm::rocm_aiter_rmsnorm_fp8_group_quant', 'on': true}, {'p': 'fused_add_rms_norm+group_fp8_quant', 'op': 'vllm::rocm_aiter_rmsnorm_with_add_fp8_group_quant',\
        \ 'on': true}, {'p': 'rms_norm+per_token_fp8_quant', 'op': 'vllm::rocm_aiter_rmsnorm_fused_dynamic_quant', 'on': !(has(input.rdna) && input.rdna)}, {'p': 'fused_add_rms_norm+per_token_fp8_quant',\
        \ 'op': 'vllm::rocm_aiter_rmsnorm_fused_add_dynamic_quant', 'on': !(has(input.rdna) && input.rdna)}, {'p': 'rms_norm_gated+group_fp8_quant', 'op': 'vllm::fused_rms_gated_fp8_group_quant', 'on':\
        \ has(input.gdn_head_dims) && 128 in input.gdn_head_dims && (!has(input.gdn_triton_kernels) || input.gdn_triton_kernels)}].filter(t, t.on && t.p in input.graph_patterns)"
    title: Registered patterns (eps 1e-5 and 1e-6) that occur in the graph
    source: "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:612"
  - if: "size(vars.m) > 0"
    title: patterns.apply(graph) replaces every match
    source: "vllm/compilation/passes/fusion/rocm_aiter_fusion.py:682"
    then:
    - set:
        ctx.fused: "= (has(ctx.fused) ? ctx.fused : []) + vars.m.map(t, t.op)"
  - return:
      replaced: "= size(vars.m)"
      fused_ops: "= vars.m.map(t, t.op)"
