- component: rope-kv-cache-fusion-pass
  name: call
  kind: function
  summary: "RopeKVCacheFusionPass: per attention layer that supports fused rope+KV cache, register the static-Q FP8 pattern (when the static quant op exists) and the plain rope+reshape pattern; apply them\
    \ and count matches."
  sources:
  - "vllm/compilation/passes/fusion/rope_kvcache_fusion.py:409-464"
  request:
    type: object
    properties:
      graph_patterns:
        type: array
        items:
          type: string
      layer_supports_fused_rope_kvcache:
        type: boolean
        default: true
      static_q_fp8_quant_supported:
        type: boolean
        default: true
  response:
    type: object
    properties:
      matched_count:
        type: integer
      replaced_with:
        type: string
      static_quant_remains:
        type: boolean
  latency_ms: 0
  behavior:
  - if: "has(input.layer_supports_fused_rope_kvcache) && !input.layer_supports_fused_rope_kvcache"
    title: "No attention layer supports the fused kernel: no pattern registered"
    source: "vllm/compilation/passes/fusion/rope_kvcache_fusion.py:436"
    then:
    - return:
        matched_count: 0
        replaced_with: ''
        static_quant_remains: "= 'rope+static_fp8_quant+kv_cache_update' in input.graph_patterns"
  - if: "'rope+static_fp8_quant+kv_cache_update' in input.graph_patterns"
    title: "rope -> static Q FP8 quant -> KV cache update"
    source: "vllm/compilation/passes/fusion/rope_kvcache_fusion.py:438"
    then:
    - if: "!has(input.static_q_fp8_quant_supported) || input.static_q_fp8_quant_supported"
      title: RopeStaticQQuantKVCachePattern matches; its replacement keeps the static quant
      source: "vllm/compilation/passes/fusion/rope_kvcache_fusion.py:99"
      then:
      - set:
          ctx.fused: "= (has(ctx.fused) ? ctx.fused : []) + ['vllm::fused_rope_and_unified_kv_cache_update']"
      - return:
          matched_count: 1
          replaced_with: "vllm::fused_rope_and_unified_kv_cache_update"
          static_quant_remains: true
    - title: Without the static-Q pattern the generic rope+KV pattern cannot match through the quant
      source: "vllm/compilation/passes/fusion/rope_kvcache_fusion.py:277"
      return:
        matched_count: 0
        replaced_with: ''
        static_quant_remains: true
  - if: "'rope+kv_cache_update' in input.graph_patterns"
    title: RopeReshapeKVCachePattern
    source: "vllm/compilation/passes/fusion/rope_kvcache_fusion.py:277"
    then:
    - set:
        ctx.fused: "= (has(ctx.fused) ? ctx.fused : []) + ['vllm::fused_rope_and_unified_kv_cache_update']"
    - return:
        matched_count: 1
        replaced_with: "vllm::fused_rope_and_unified_kv_cache_update"
        static_quant_remains: false
  - return:
      matched_count: 0
      replaced_with: ''
      static_quant_remains: false
