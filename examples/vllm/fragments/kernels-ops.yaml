- component: torch-compile-with-no-guards-wrapper
  name: call
  kind: function
  summary: "TorchCompileWithNoGuardsWrapper.__call__: first call compiles through Dynamo and the vLLM backend; later calls jump to the compiled bytecode."
  sources:
  - "vllm/compilation/wrapper.py:187-219"
  request: KernelsOpsGraphCall
  latency_ms: 0
  behavior:
  - if: "state.compiled_bytecode && config['vllm-use-bytecode-hook']"
    title: "Bytecode hook: dispatch straight to the compiled code, no guards"
    source: "vllm/compilation/wrapper.py:203"
    then:
    - call: piecewise-backend.call
      input: "= input"
    - return:
        path: compiled
  - if: state.compiled_bytecode
    title: "No bytecode hook: the torch.compile frame reuses the compiled code (fail_on_recompile after the first compile)"
    source: "vllm/compilation/wrapper.py:211"
    then:
    - set:
        ctx.guard_stance: fail_on_recompile
    - call: piecewise-backend.call
      input: "= input"
    - return:
        path: compiled
  - title: "First call: Dynamo traces forward and hands the graph to VllmBackend"
    source: "vllm/compilation/wrapper.py:198"
    wait: "= config['dynamo-trace-ms']"
  - call: vllm-backend.call
    input:
      num_layers: "= input.num_layers"
      num_tokens: "= input.num_tokens"
      prefix: backbone
      graph_patterns: []
      config_hash: "= has(input.config_hash) ? input.config_hash : null"
  - set:
      state.compiled_bytecode: true
    title: Record the compiled code (bytecode hook)
    source: "vllm/compilation/wrapper.py:226"
  - call: piecewise-backend.call
    input: "= input"
  - return:
      path: compiled-first
