        num_compiled_artifacts_loaded: 0
        num_aot_compiles: 0
        num_aot_artifacts_saved: 0
        num_aot_artifacts_loaded: 0
        stock_torch_compile_count: 0
      expected:
      - field: num_graphs_seen
        diff: 1
      - field: num_piecewise_graphs_seen
        diff: 65
      - field: num_piecewise_capturable_graphs_seen
        diff: 33
      - field: num_backend_compilations
        diff: 33
      - field: num_inductor_compiles
        diff: 33
      - field: num_cache_entries_updated
        diff: 33
      - field: num_compiled_artifacts_saved
