        \ p >= vars.d)[0] : vars.d"
    title: "BLOCK_SIZE = triton.next_power_of_2(d): one program covers a whole row (d <= 32768 by supports_args)"
    source: "vllm/kernels/triton/activation.py:88"
  - set:
      vars.warps: "= vars.bs / 256 < 1 ? 1 : (vars.bs / 256 > 8 ? 8 : vars.bs / 256)"
    title: "num_warps = min(max(BLOCK_SIZE // 256, 1), 8)"
    source: "vllm/kernels/triton/activation.py:89"
  - title: Launch _gelu_and_mul_sparse_kernel over n_rows programs
    source: "vllm/kernels/triton/activation.py:90"
    set:
      ctx.triton_kernel: _gelu_and_mul_sparse_kernel
  - return:
      launched: true
      d: "= vars.d"
      block_size: "= vars.bs"
      num_warps: "= vars.warps"
