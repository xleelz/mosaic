- component: piecewise-backend
  name: call
  kind: function
  summary: "PiecewiseBackend.__call__: pick the compiled range entry for the runtime token count and run it."
  sources:
  - "vllm/compilation/piecewise_backend.py:357-379"
  - "vllm/compilation/piecewise_backend.py:342-356"
  request: KernelsOpsGraphCall
  response:
    type: object
    properties:
      range_start:
        type: integer
      range_end:
        type: integer
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  latency_ms: 0
  behavior:
  - if: "input.num_tokens in config['compile-sizes']"
    title: "A compile size: the range entry compiled for exactly this size"
    source: "vllm/compilation/piecewise_backend.py:349"
    then:
    - return:
        range_start: "= input.num_tokens"
        range_end: "= input.num_tokens"
  - if: "input.num_tokens >= 1 && input.num_tokens <= config['max-num-batched-tokens']"
    title: "Inside the general range [1, max_num_batched_tokens]"
    source: "vllm/compilation/piecewise_backend.py:353"
    then:
    - return:
        range_start: 1
        range_end: "= config['max-num-batched-tokens']"
  - title: No compiled range covers this shape
    source: "vllm/compilation/piecewise_backend.py:362"
    fail:
      code: assertion-error
      message: "= 'Shape: ' + string(input.num_tokens) + ' out of considered ranges'"
- component: piecewise-backend
  name: compile-all-ranges
  kind: function
  summary: "PiecewiseBackend.compile_all_ranges: compile this piece for every compile range up front."
  sources:
  - "vllm/compilation/piecewise_backend.py:244-271"
  request:
    type: object
    properties:
      graph_index:
        type: integer
        examples:
        - 0
      num_graphs:
        type: integer
        examples:
        - 33
      graph_patterns:
        type: array
        items:
          type: string
  latency_ms: 0
  behavior:
  - set:
      vars.ranges: "= [{'start': 1, 'end': config['max-num-batched-tokens']}] + config['compile-sizes'].map(s, {'start': s, 'end': s})"
    title: "Range entries: the compile ranges plus one single-size range per compile size"
    source: "vllm/compilation/piecewise_backend.py:180"
  - foreach: "= vars.ranges"
    as: r
    source: "vllm/compilation/piecewise_backend.py:252"
    title: Compile each range entry
    steps:
    - call: compiler-manager.compile
      input:
        graph_index: "= input.graph_index"
        num_graphs: "= input.num_graphs"
        range_start: "= vars.r.start"
        range_end: "= vars.r.end"
        graph_patterns: "= input.graph_patterns"
