  description: "Registered as `_C::persistent_topk`: `persistent_topk(Tensor logits, Tensor lengths, Tensor! output, Tensor workspace, int k, int max_seq_len) -> ()`. Dispatch: CUDA=TORCH_BOX(&persistent_topk).\
    \ Launches `persistent_topk_kernel` (csrc/persistent_topk.cuh:865), `FilteredTopKUnifiedKernel` (csrc/persistent_topk.cuh:1293), `sampled_topk_kernel` (csrc/sampled_topk.cuh:143). Latency model: memory-bound\
    \ over [num_tokens, hidden_size]; the kernel body is not simulated."
  sources:
  - "csrc/torch_bindings.cpp:585-587"
  - "csrc/topk.cu:250"
  - "csrc/persistent_topk.cuh:865"
  - "csrc/persistent_topk.cuh:1293"
  - "csrc/sampled_topk.cuh:143"
  attributes:
    op: "_C::persistent_topk"
    latency_model: token
    kernels:
    - persistent_topk_kernel
    - FilteredTopKUnifiedKernel
    - sampled_topk_kernel
  request:
    type: object
    properties:
      num_rows:
        type: integer
        default: 4
      k:
        type: integer
        default: 2048
      max_seq_len:
        type: integer
        default: 8192
      row_stride:
        type: integer
        default: 8192
        description: "logits.stride(0): the padded row length"
      lengths_numel:
        type:
        - integer
        - "null"
        default: null
        description: "null: equal to num_rows"
      output_cols:
        type:
        - integer
        - "null"
        default: null
        description: "null: equal to k"
      logits_dtype:
        type: string
        default: float32
      workspace_bytes:
        type: integer
        default: 67108864
      device_major:
        type: integer
        default: 9
        description: "compute capability major of the device (H100: 9)"
      num_tokens:
        type: integer
        default: 4
      hidden_size:
        type: integer
        default: 8192
      dtype_bytes:
        type: integer
        default: 4
  response:
    type: object
    properties:
      path:
        type: string
      kernel:
        type: string
      vec_size:
        type: integer
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  latency_ms: "= (double(config['kernel-launch-overhead-us']) + 3.0 * double(input.num_tokens) * double(input.hidden_size) * double(input.dtype_bytes) / (double(config['gpu-hbm-bandwidth-gbps']) * 1000.0))\
    \ / 1000.0"
  behavior:
  - if: "config['vllm-target-device'] == 'rocm'"
    title: Not built for ROCm
    source: "csrc/topk.cu:294"
    then:
    - fail:
        code: runtime-error
        message: "= 'persistent_topk is not supported on ROCm'"
  - if: "input.logits_dtype != 'float32'"
    title: Only float32 logits
    source: "csrc/topk.cu:260"
    then:
    - fail:
        code: runtime-error
        message: Only float32 supported
  - if: "(input.lengths_numel == null ? input.num_rows : input.lengths_numel) != input.num_rows"
    title: One length per row
    source: "csrc/topk.cu:273"
    then:
    - fail:
        code: runtime-error
        message: lengths size mismatch
  - if: "(input.output_cols == null ? input.k : input.output_cols) != input.k"
    title: "Output is [num_rows, k]"
    source: "csrc/topk.cu:275"
    then:
    - fail:
        code: runtime-error
        message: output size mismatch
  - if: "!(input.k in [512, 1024, 2048])"
    title: "k is one of 512, 1024, 2048"
    source: "csrc/topk.cu:277"
    then:
    - fail:
        code: runtime-error
        message: "= 'persistent_topk supports k=512, k=1024, or k=2048, got k=' + string(input.k)"
  - set:
      vars.min_sampled: "= input.k == 512 ? 98304 : 65536"
    title: "kMinSampledLength<K>"
    source: "csrc/sampled_topk.cuh:23"
  - if: "input.num_rows > 64 && input.max_seq_len >= vars.min_sampled && 232448 >= 144 * 1024"
    title: "Many long rows: one CTA per row, sampled top-k"
    source: "csrc/topk.cu:41"
    then:
    - return:
        path: sampled
        kernel: sampled_topk_kernel
        vec_size: 0
  - if: "input.num_rows > 32 && 232448 >= 128 * 1024"
    title: "More than 32 rows: FilteredTopK ragged transform"
    source: "csrc/topk.cu:55"
    then:
    - return:
        path: filtered
        kernel: FilteredTopKUnifiedKernel
        vec_size: 0
  - set:
      vars.vec: "= input.row_stride % 4 == 0 ? 4 : (input.row_stride % 2 == 0 ? 2 : 1)"
    title: Vector width from the row stride
    source: "csrc/topk.cu:86"
  - return:
      path: persistent
      kernel: persistent_topk_kernel
      vec_size: "= vars.vec"
    title: "Few rows: the cooperative persistent kernel over row chunks"
    source: "csrc/topk.cu:95"
