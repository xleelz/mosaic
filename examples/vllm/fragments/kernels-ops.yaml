    input: "= merge(merge({'num_tokens': 16, 'hidden_size': 4096, 'dtype_bytes': 2, 'variance_size': 0, 'weight_dtype_matches': true, 'contiguous': true, 'ndim': 2, 'approximate': 'none', 'device_type':\
      \ 'cuda'}, input.args), {'op': input.op, 'priority_override': input.priority})"
    as: d
  - return:
      provider: "= vars.d.value.provider"
