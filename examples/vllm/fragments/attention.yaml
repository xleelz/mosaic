  - if: '!(vars.cls in {''FlashAttentionBackend'': ''FlashAttentionMetadataBuilder'', ''TritonAttentionBackend'': ''TritonAttentionMetadataBuilder'', ''FlashInferBackend'': ''FlashInferMetadataBuilder'',
      ''FlexAttentionBackend'': ''FlexAttentionMetadataBuilder''})'
    then:
