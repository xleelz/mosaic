- component: fa-utils
  name: get-flash-attn-version
  kind: function
  summary: 'get_flash_attn_version: pick FA2/3/4 from the platform, compute capability, config override and the layer''s needs.'
  sources:
  - vllm/v1/attention/backends/fa_utils.py:74-221
  request: AttnFaVersionRequest
  response:
    type: object
    properties:
      fa_version:
        type:
        - integer
        - 'null'
  behavior:
  - if: input.platform == 'xpu'
    then:
    - title: XPU always uses FA2
      source: vllm/v1/attention/backends/fa_utils.py:83
      return:
        fa_version: 2
  - if: input.platform == 'rocm'
    then:
    - title: ROCm doesn't use vllm_flash_attn
      source: vllm/v1/attention/backends/fa_utils.py:85
      return:
        fa_version: null
  - title: 'Default by compute capability: FA3 on Hopper, FA4 on Blackwell, else FA2'
    source: vllm/v1/attention/backends/fa_utils.py:99-107
    set:
      vars.v: '= input.device_capability_major == 9 && 3 in input.supported_versions ? 3 : (input.device_capability_major == 10 && 4 in input.supported_versions ? 4 : 2)'
  - when: '''flash-attn-version'' in config && config[''flash-attn-version''] != null'
    title: attention_config.flash_attn_version overrides
    source: vllm/v1/attention/backends/fa_utils.py:117
    set:
      vars.v: = config['flash-attn-version']
  - if: input.device_capability_major >= 10 && vars.v == 3
    then:
    - title: FA3 can't run on Blackwell
      source: vllm/v1/attention/backends/fa_utils.py:122
      set:
        vars.v: '= 4 in input.supported_versions ? 4 : 2'
  - if: input.requires_alibi && (vars.v == 3 || vars.v == 4)
    then:
    - title: ALiBi needs FA2
      source: vllm/v1/attention/backends/fa_utils.py:129
      set:
        vars.v: 2
  - if: vars.v == 3 && input.device_capability_major == 9 && 4 in input.supported_versions && ((input.head_size != null && input.head_size > 256) || (input.has_sinks && input.head_size != null && input.head_size_v
      != null && input.head_size != input.head_size_v))
    then:
    - title: Upgrade FA3 -> FA4 for shapes FA3 can't serve on SM90
      source: vllm/v1/attention/backends/fa_utils.py:163
      set:
        vars.v: 4
  - if: input.batch_invariant && vars.v == 4
    then:
    - title: Batch invariance can't use FA4
      source: vllm/v1/attention/backends/fa_utils.py:173
      set:
        vars.v: 2
  - if: vars.v == 4 && input.device_capability_major >= 10 && input.head_size != null && input.head_size > 128 && !((input.head_size == 256 && (input.head_size_v == null || input.head_size_v == 256)) ||
      (input.head_size == 192 && input.head_size_v == 128))
    then:
    - title: FA4 on Blackwell is limited by TMEM
      source: vllm/v1/attention/backends/fa_utils.py:205
      set:
        vars.v: 2
  - if: '!(vars.v in input.supported_versions)'
    then:
    - title: 'Chosen version unsupported: the assertion is caught and None is returned'
      source: vllm/v1/attention/backends/fa_utils.py:220
      return:
        fa_version: null
  - return:
      fa_version: = vars.v
- component: flash-attention-metadata-builder
  name: build
