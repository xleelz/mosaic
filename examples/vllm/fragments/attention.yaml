    then:
    - title: 'Gluon''s fp8 regime asserts batch_size == 1: never for a quantized cache, whatever the mode'
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:1821
      return:
        use_gluon: false
  - if: config['vllm-rocm-aiter-mla-asm-padding'] == 'asm' || !input.gluon_build_available
    then:
    - title: Forced asm, or no gfx950 Gluon build
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:1823-1826
      return:
        use_gluon: false
  - if: config['vllm-rocm-aiter-mla-asm-padding'] != 'gluon' && 16 % input.num_heads != 0
    then:
    - title: 'auto: non-divisor head counts take the padded asm decode'
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:1828
      return:
        use_gluon: false
