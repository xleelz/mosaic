- component: attention-backend-utils
  name: reorder-batch-to-split-decodes-and-prefills
  kind: function
  summary: 'reorder_batch_to_split_decodes_and_prefills: reorder the input batch in place into decode, short extend, long extend and prefill regions with the fewest moves; True when anything moved. The
    builders'' reorder_batch hook (the model runner''s _may_reorder_batch, worker-runner) calls it.'
  sources:
  - vllm/v1/attention/backends/utils.py:905-982
  request:
    type: object
    properties:
      req_ids:
        type: array
        items:
          type: string
      num_scheduled_tokens:
        type: object
      num_computed_tokens: *id025
      num_prompt_tokens: *id025
      decode_threshold:
        type: integer
        default: 1
    required:
    - req_ids
    - num_scheduled_tokens
    - num_computed_tokens
    - num_prompt_tokens
  response:
    type: object
    properties:
      modified:
        type: boolean
      req_ids:
        type: array
        items:
          type: string
  behavior:
  - title: Each request's scheduled tokens, in batch order
    source: vllm/v1/attention/backends/utils.py:924-929
    set:
      vars.s: = input.req_ids.map(r, input.num_scheduled_tokens[r])
  - title: 'Four exclusive regions: no context yet is a prefill (3); context and above the threshold a long extend (2); at or below it, still prefilling a short extend (1), done a decode (0)'
    source: vllm/v1/attention/backends/utils.py:931-949
    set:
      vars.reg: '= lists.range(size(input.req_ids)).map(i, input.num_computed_tokens[i] <= 0 ? 3 : (vars.s[i] > input.decode_threshold ? 2 : (input.num_computed_tokens[i] >= input.num_prompt_tokens[i] ?
        0 : 1)))'
  - set:
      vars.c: = [0, 1, 2, 3].map(g, vars.reg.filter(x, x == g).size())
  - title: The target is decode, short extend, long extend, prefill, each region as large as its count
    source: vllm/v1/attention/backends/utils.py:956-959
    set:
      vars.tgt: '= lists.range(size(input.req_ids)).map(i, i < vars.c[0] ? 0 : (i < vars.c[0] + vars.c[1] ? 1 : (i < vars.c[0] + vars.c[1] + vars.c[2] ? 2 : 3)))'
  - title: Only the requests whose region differs from the target move
    source: vllm/v1/attention/backends/utils.py:961
    set:
      vars.sw: = lists.range(size(input.req_ids)).filter(i, vars.reg[i] != vars.tgt[i])
  - if: size(vars.sw) == 0
    then:
    - title: 'Already in order: nothing changes'
      source: vllm/v1/attention/backends/utils.py:963-964
      return:
        modified: false
        req_ids: = input.req_ids
  - title: The moving requests, stably sorted by region, fill the moving positions in order
    source: vllm/v1/attention/backends/utils.py:967-971
    set:
      vars.src: = vars.sw.filter(i, vars.reg[i] == 0) + vars.sw.filter(i, vars.reg[i] == 1) + vars.sw.filter(i, vars.reg[i] == 2) + vars.sw.filter(i, vars.reg[i] == 3)
  - title: input_batch.swap_states follows each cycle of the move map in place, which leaves every moving request at its destination
    source: vllm/v1/attention/backends/utils.py:973-982
    return:
      modified: true
      req_ids: '= lists.range(size(input.req_ids)).map(p, p in vars.sw ? input.req_ids[vars.src[vars.sw.indexOf(p)]] : input.req_ids[p])'
- component: tokenspeed-mla-impl
  name: forward-mqa
  kind: function
  summary: 'TokenspeedMLAImpl.forward_mqa: check the FP8 query, reshape it per request, derive the FP8 softmax and output scales once, and call tokenspeed_mla_decode with the DCP layout.'
  sources:
  - vllm/v1/attention/backends/mla/tokenspeed_mla.py:266-362
  - vllm/v1/attention/backends/mla/tokenspeed_mla.py:43-73
  request:
    type: object
    properties:
      num_decodes:
        type: integer
        default: 2
      num_decode_tokens:
        type: integer
        default: 2
      num_heads:
        type: integer
        default: 128
      kv_lora_rank:
        type: integer
        default: 512
      qk_rope_head_dim:
        type: integer
        default: 64
      q_dtype:
        type: string
        default: float8_e4m3fn
      q_is_tuple:
        type: boolean
        default: false
      kv_cache_nonempty:
        type: boolean
        default: true
      has_decode_metadata:
        type: boolean
        default: true
      causal:
        type: boolean
        default: true
      dcp_world_size:
        type: integer
        default: 1
      dcp_rank:
        type: integer
        default: 0
      cp_kv_cache_interleave_size:
        type: integer
        default: 1
      min_split_kv:
        type: integer
        default: 1
      need_to_return_lse_for_decode:
        type: boolean
        default: true
      scale:
        type: number
        default: 1.0
      softmax_scale:
        type:
        - number
        - 'null'
        default: null
      output_scale:
        type:
        - number
        - 'null'
        default: null
      q_scale:
        type: number
        default: 1.0
      k_scale:
        type: number
        default: 1.0
      q_scale_repr:
        type: string
        default: '1.0'
      k_scale_repr:
        type: string
        default: '1.0'
      block_table:
        type: array
        default:
        - - 0
        - - 0
      seq_lens:
        type: array
        items:
          type: integer
        default:
        - 16
        - 24
      dcp_tot_seq_lens:
        type: array
        items:
          type: integer
        default:
        - 16
        - 24
      max_seq_len:
        type: integer
        default: 24
  response:
    type: object
    properties:
      out_shape: *id025
      lse_shape:
        type:
        - array
        - 'null'
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: empty cache, no decode metadata, or a non-FP8 query
  behavior:
  - if: '!input.kv_cache_nonempty || !input.has_decode_metadata'
    then:
    - title: The KV cache must be non-empty and the decode metadata present (bare asserts)
      source: vllm/v1/attention/backends/mla/tokenspeed_mla.py:275-276
      fail:
        code: assertion-error
        message: ''
  - if: input.q_dtype != 'float8_e4m3fn'
    then:
    - title: 'The kernel is specialized for FP8 Q and FP8 KV: the upstream concat+quant must have run'
      source: vllm/v1/attention/backends/mla/tokenspeed_mla.py:287-291
      fail:
        code: assertion-error
        message: '= ''TokenspeedMLAImpl expected FP8 query (supports_quant_query_input=True), got torch.'' + input.q_dtype + ''. Pipeline isinstance(q, tuple)='' + (input.q_is_tuple ? ''True'' : ''False'')
          + '', q_scale='' + input.q_scale_repr + '', k_scale='' + input.k_scale_repr + ''.'''
  - if: input.num_decode_tokens % input.num_decodes != 0
    then:
    - title: 'Uneven query length per request (a reordering bug): warn once and give each token its own row'
      source: vllm/v1/attention/backends/mla/tokenspeed_mla.py:301-307
      set:
        vars.qshape: = [input.num_decode_tokens, 1, input.num_heads, input.kv_lora_rank + input.qk_rope_head_dim]
    else:
    - title: Query viewed as (num_decodes, q_len per request, num_heads, head_dim)
      source: vllm/v1/attention/backends/mla/tokenspeed_mla.py:309
      set:
        vars.qshape: = [input.num_decodes, input.num_decode_tokens / input.num_decodes, input.num_heads, input.kv_lora_rank + input.qk_rope_head_dim]
  - title: 'FP8 KV is mandatory: softmax_scale = scale * q_scale * k_scale and output_scale = k_scale, computed once'
    source: vllm/v1/attention/backends/mla/tokenspeed_mla.py:311-319
    set:
      vars.sm: '= input.softmax_scale != null ? input.softmax_scale : input.scale * input.q_scale * input.k_scale'
      vars.os: '= input.softmax_scale != null ? input.output_scale : input.k_scale'
  - title: 'tokenspeed_mla_decode on the cached workspace: block tables and seq lens from the decode metadata, the DCP world, rank and interleave (read at call time, since NIXL may set it later), causal_seqs
      only under DCP (None otherwise: pass_causal_seqs false)'
    source: vllm/v1/attention/backends/mla/tokenspeed_mla.py:321-350
    call: tokenspeed-mla-kernels.tokenspeed-mla-decode
    input:
      query_shape: = vars.qshape
      workspace_buffer: workspace
      kv_lora_rank: = input.kv_lora_rank
      qk_rope_head_dim: = input.qk_rope_head_dim
      block_tables: = input.block_table
      seq_lens: = input.seq_lens
      max_seq_len: = input.max_seq_len
      softmax_scale: = vars.sm
      output_scale: = vars.os
      enable_pdl: false
      return_lse: = input.need_to_return_lse_for_decode
      causal_mask: = input.causal
      pass_causal_seqs: = input.dcp_world_size > 1
      causal_seqs: '= input.dcp_world_size > 1 ? input.dcp_tot_seq_lens : []'
      cp_world: = input.dcp_world_size
      cp_rank: = input.dcp_rank
      cp_interleave_size: = input.cp_kv_cache_interleave_size
      min_split_kv: = input.min_split_kv
      num_tokens: = input.num_decode_tokens
      kv_tokens: = sum(input.seq_lens)
    as: k
    fill: true
  - title: Outputs flattened to (tokens, heads, kv_lora_rank); the LSE to (tokens, heads) when returned
    source: vllm/v1/attention/backends/mla/tokenspeed_mla.py:352-362
    return:
      out_shape: = [input.num_decode_tokens, input.num_heads, input.kv_lora_rank]
      lse_shape: '= input.need_to_return_lse_for_decode ? dyn([input.num_decode_tokens, input.num_heads]) : dyn(null)'
