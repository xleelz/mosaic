      path: '= input.dcp_route == ''cprr'' ? ''asm-cprr'' : ''asm'''
      heads: '= input.dcp_route == ''cprr'' ? [16, 32, 64, 128].filter(h, h >= input.num_heads)[0] : ((input.num_heads + 15) / 16) * 16'
      returns_lse: = input.dcp_world_size > 1
- component: rocm-aiter-mla-sparse-impl
  name: forward-mqa
  kind: function
  summary: 'ROCMAiterMLASparseImpl.forward_mqa / _forward_mla: AITER sparse MLA, the ragged Triton fallbacks (rope-free BF16, sink shapes without an LSE kernel, long BF16 prefills on gfx942), or the asm
    decode padded to a head bucket.'
  sources:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:1137-1200
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:858-1098
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:51-71
  - vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:74-83
  request:
    type: object
    properties:
      num_tokens:
        type: integer
        default: 4
      num_heads:
        type: integer
        default: 16
      kv_cache_dtype:
        type: string
        default: auto
      use_aiter_sparse_mla:
        type: boolean
        default: false
      has_sinks:
        type: boolean
        default: false
      q_dtype:
        type: string
        default: bfloat16
      kv_dtype:
        type: string
        default: bfloat16
      on_gfx942:
        type: boolean
        default: false
      on_mi3xx:
        type: boolean
        default: true
      head_size:
        type: integer
        default: 576
      kv_lora_rank:
        type: integer
        default: 512
      num_prefills:
        type: integer
        default: 0
      num_decodes:
        type: integer
        default: 4
      num_decode_tokens:
        type: integer
        default: 4
      decode_num_splits:
        type: integer
        default: 1
      prefill_max_seq_len:
        type: integer
        default: 0
      topk_tokens:
        type: integer
        default: 2048
  response:
    type: object
    properties:
      path:
        type: string
      heads:
        type: integer
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: unsupported sink shape
  behavior:
  - title: Top-k slots converted to global indices; an fp8 cache quantizes the query
    source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:1147-1191
    call: sparse-utils.triton-convert-req-index-to-global-index
    input:
      shape:
        num_tokens: = input.num_tokens
    fill: true
  - if: input.use_aiter_sparse_mla
    then:
    - title: AITER's sparse MLA kernel
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:1192
      return:
        path: aiter-sparse
        heads: = input.num_heads
        lse: false
  - title: '_forward_mla: sinks need an LSE; fallbacks for shapes the AITER return-LSE kernels lack'
    source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:873-896
    set:
      vars.sinkfb: = input.has_sinks && (input.q_dtype == 'float16' || (input.q_dtype == 'bfloat16' && (((input.num_heads + 15) / 16 * 16) > 128 || (input.on_gfx942 && ((input.num_heads + 15) / 16 * 16)
        > 32 && ((input.num_heads + 15) / 16 * 16) <= 64))))
      vars.longfb: = !input.has_sinks && input.on_gfx942 && input.kv_dtype == 'bfloat16' && input.num_decodes == 0 && input.num_prefills > 0 && input.prefill_max_seq_len > input.topk_tokens
  - if: vars.sinkfb || vars.longfb || (!input.kv_cache_dtype.startsWith('fp8') && input.head_size == input.kv_lora_rank && (input.num_prefills > 0 || input.num_decodes > 0))
    then:
    - title: 'The ragged Triton path: split-KV decode when all tokens decode and the split count is > 1, else the ragged prefill'
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:51-71
      return:
        path: '= input.num_decode_tokens == input.num_tokens && input.decode_num_splits > 1 ? ''triton-decode'' : ''triton-prefill'''
        heads: = input.num_heads
        lse: false
  - if: input.has_sinks
    then:
    - if: '!(input.q_dtype == input.kv_dtype && input.q_dtype in [''bfloat16'', ''fp8''])'
      then:
      - title: Sinks need BF16 or FP8 for both query and KV
        source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:981
        fail:
          code: value-error
          message: ROCm AITER MLA attention sinks require query and KV to both use BF16 or both use FP8
    - set:
        vars.buckets: '= input.q_dtype == ''bfloat16'' ? [16, 32, 64, 128] : [16, 128]'
    - if: input.on_mi3xx && size(vars.buckets.filter(h, h >= ((input.num_heads + 15) / 16 * 16))) == 0
      then:
      - title: At most 128 padded heads with sinks
        source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:1000
        fail:
          code: value-error
          message: ROCm AITER MLA attention sinks support at most 128 padded local heads; increase tensor_parallel_size
    - title: Pad the query to the next head bucket the return-LSE kernel has
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:990
      return:
        path: asm-lse
        heads: '= input.on_mi3xx ? vars.buckets.filter(h, h >= ((input.num_heads + 15) / 16 * 16))[0] : ((input.num_heads + 15) / 16 * 16)'
        lse: true
  - title: AITER asm decode at the padded head count
    source: vllm/v1/attention/backends/mla/rocm_aiter_mla_sparse.py:858-1098
    return:
      path: asm
      heads: = ((input.num_heads + 15) / 16 * 16)
      lse: false
