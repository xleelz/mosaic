- id: attention-r5-error-messages-sweep
  name: 'Error messages word for word: the selector''s invalid KV dtype, the causal-tensor dtype, merge strides, Triton reshape-and-cache, an unknown TurboQuant preset, enum registration'
  fixtures: *id050
  steps:
  - interface: selector.get-attn-backend
    caller: gpu-worker
    input:
      head_size: 128
      dtype: bfloat16
      kv_cache_dtype: fp4
