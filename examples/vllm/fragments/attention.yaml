  behavior:
  - set:
      vars.mapped: = input.query_start_loc_cpu[size(input.query_start_loc_cpu) - 1]
      vars.n: = input.num_actual_tokens
  - set:
      vars.out: '= vars.mapped > vars.n ? vars.mapped : vars.n'
