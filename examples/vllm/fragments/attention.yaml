  name: riscv-supports-rvv
  kind: function
  summary: '_riscv_supports_rvv: trust the C++ build (torch.ops._C.cpu_attn_has_isa(''rvv'')), else look for zvl128b/zvl256b in /proc/cpuinfo.'
  sources:
  - vllm/v1/attention/backends/cpu_attn.py:491-517
  request:
    type: object
    properties:
      compiled_rvv:
        type: boolean
        default: false
      cpuinfo:
        type:
        - string
        - 'null'
        default: null
  response:
    type: object
    properties:
      rvv:
        type: boolean
  behavior:
  - if: input.compiled_rvv
    then:
    - title: torch.ops._C.cpu_attn_has_isa('rvv')
      source: vllm/v1/attention/backends/cpu_attn.py:506
      return:
        rvv: true
  - if: '!has(input.cpuinfo) || input.cpuinfo == null'
    then:
    - title: No /proc/cpuinfo
      source: vllm/v1/attention/backends/cpu_attn.py:515
      return:
        rvv: false
  - title: zvl128b or zvl256b advertised
    source: vllm/v1/attention/backends/cpu_attn.py:517
    return:
      rvv: = input.cpuinfo.contains('zvl128b') || input.cpuinfo.contains('zvl256b')
- component: cpu-attn
  name: get-attn-isa
  kind: function
  summary: '_get_attn_isa: choose the CPU attention kernel ISA (amx, neon, rvv, vxe, vsx, vec, vec16).'
  sources:
  - vllm/v1/attention/backends/cpu_attn.py:520-558
  request:
    type: object
    properties:
      fp8_kv:
        type: boolean
        default: false
      amx:
        type: boolean
        default: false
      avx512:
        type: boolean
        default: true
      dtype:
        type: string
        default: bfloat16
      block_size:
        type: integer
        default: 32
      arch:
        type: string
        default: x86
      cpuinfo:
        type:
        - string
        - 'null'
        default: null
  response:
    type: object
    properties:
      isa:
        type: string
  errors:
  - code: not-implemented-error
    status: 0
    retryable: false
    summary: FP8 KV without AVX-512/AMX
  behavior:
  - if: input.fp8_kv && !input.amx && !input.avx512
    then:
    - title: FP8 KV on CPU needs AVX-512 or AMX
      source: vllm/v1/attention/backends/cpu_attn.py:542
      fail:
        code: not-implemented-error
        message: FP8 KV cache on CPU requires x86 with AVX-512 or AMX.
  - if: input.amx && input.dtype == 'bfloat16' && input.block_size % 32 == 0
    then:
    - title: AMX
      source: vllm/v1/attention/backends/cpu_attn.py:545
      return:
        isa: amx
  - if: input.arch == 'arm'
    then:
    - return:
        isa: neon
  - if: input.block_size % 32 == 0
    then:
    - if: input.arch == 'riscv'
      then:
      - title: 'RISC-V: check RVV support'
        source: vllm/v1/attention/backends/cpu_attn.py:549
        call: cpu-attn.riscv-supports-rvv
        input:
          compiled_rvv: false
          cpuinfo: '= has(input.cpuinfo) ? input.cpuinfo : null'
        as: rvv
        fill: true
      - if: vars.rvv.value.rvv
        then:
        - return:
            isa: rvv
    - return:
        isa: '= input.arch == ''s390x'' ? ''vxe'' : (input.arch == ''powerpc'' ? ''vsx'' : ''vec'')'
  - return:
      isa: vec16
