scenarios:
- id: attention-select-backend-flash-attn
  name: 'Llama-8B layer on CUDA: the platform returns FlashAttention'
  fixtures: &id033
  - tp1-llama-8b
  - attention-seed
  flow: attn-select-backend
  expect:
  - result.ok && result.value.backend_cls_path.endsWith('FlashAttentionBackend') && !result.value.cached
  - calls['cuda-platform.get-attn-backend-cls'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && (!has(e.input.selected_backend) || e.input.selected_backend == null) && (!has(e.input.attn_selector_config.block_size)
    || e.input.attn_selector_config.block_size == null))
- id: attention-select-backend-cache-hit
  name: Second layer with the same config hits functools.cache
  fixtures: *id033
  flow: attn-select-backend
  steps:
  - flow: attn-select-backend
    as: first
  - flow: attn-select-backend
    as: second
  expect:
  - steps.first.result.ok && !steps.first.result.value.cached
  - steps.second.result.value.cached
  - calls['cuda-platform.get-attn-backend-cls'] == 1
- id: attention-select-backend-invalid-kv-dtype
  name: Unknown kv_cache_dtype fails the assertion before the platform is asked
  fixtures: *id033
  flow: attn-select-backend
  input:
    kv_cache_dtype: int3
  expect:
  - '!result.ok && result.error.code == ''assertion-error'''
  - calls['cuda-platform.get-attn-backend-cls'] == 0
- id: attention-select-backend-forced-triton
  name: --attention-backend TRITON_ATTN is passed to the platform as the selected backend
  fixtures: *id033
  flow: attn-select-backend
  config:
    attention-backend: TRITON_ATTN
  expect:
  - result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && e.input.selected_backend == 'TRITON_ATTN')
- id: attention-select-backend-platform-refuses
  name: 'The platform raises ValueError (no valid backend): it propagates'
  fixtures: *id033
  flow: attn-select-backend
  faults:
  - target: cuda-platform.get-attn-backend-cls
    type: error
    code: value-error
    status: 0
  expect:
  - '!result.ok && result.error.code == ''value-error'''
- id: attention-validate-backend-fa-llama-ok
  name: FlashAttention serves Llama-8B on SM90 with FA3
  fixtures: *id033
  flow: attn-validate-backend
  expect:
  - result.ok && size(result.value.invalid_reasons) == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'attention-backend.validate-configuration')
- id: attention-validate-backend-fa2-fp8-sink-ampere
  name: 'SM80 + FA2: FP8 KV and sinks are rejected'
  fixtures: *id033
  flow: attn-validate-backend
  input:
    device_capability:
      major: 8
      minor: 0
    fa_version: 2
    kv_cache_dtype: fp8
    has_sink: true
    fa4_supported: false
  expect:
  - result.ok
  - '''kv_cache_dtype not supported'' in result.value.invalid_reasons'
  - '''attention sinks not supported'' in result.value.invalid_reasons'
  - '''sink not supported on compute capability < 9.0'' in result.value.invalid_reasons'
