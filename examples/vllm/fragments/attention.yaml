  latency_ms: = ((double(config['attn-kernel-launch-us']) + double(input.num_tokens) * double(config['attn-us-per-query-token']) + double(input.kv_tokens) * double(config['attn-us-per-kv-token'])) / 1000.0)
- component: rocm-aiter-mla-sparse-ops
  name: rocm-sparse-attn-prefill-ragged-triton
  kind: function
  summary: '_rocm_sparse_attn_prefill_ragged_triton: validate the ragged indptr and the NoPE/RoPE split, then launch the sparse prefill kernel.'
  sources:
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py:3481-3556
  - vllm/v1/attention/ops/rocm_aiter_mla_sparse.py:1916-1931
  request:
    type: object
    properties:
      num_queries:
        type: integer
        default: 4
      num_heads:
        type: integer
        default: 16
      head_dim:
        type: integer
        default: 576
      nope_head_dim:
        type: integer
        default: 512
      rope_head_dim:
        type: integer
        default: 64
      indptr_len:
        type: integer
        default: 5
  response:
    type: object
    properties:
      grid: *id025
      block_k:
        type: integer
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: malformed indptr or head dims
  behavior:
  - if: input.indptr_len != input.num_queries + 1
    then:
    - title: indptr has one entry per query plus one
      source: vllm/v1/attention/ops/rocm_aiter_mla_sparse.py:3507
      fail:
        code: assertion-error
        message: = 'expected indptr shape [' + string(input.num_queries + 1) + '], got torch.Size([' + string(input.indptr_len) + '])'
  - title: '_validate_sparse_dims checks in order: a positive head_dim, a positive NoPE dimension, a non-negative RoPE dimension, then head_dim = NoPE + RoPE'
    source: vllm/v1/attention/ops/rocm_aiter_mla_sparse.py:1916-1931
    set:
      vars.op: _rocm_sparse_attn_prefill_ragged_triton
      vars.bad: '= input.head_dim <= 0 ? ''expected a positive head_dim, got '' + string(input.head_dim) : (input.nope_head_dim <= 0 ? ''expected a positive NoPE dimension, got '' + string(input.nope_head_dim)
        : (input.rope_head_dim < 0 ? ''expected a non-negative RoPE dimension, got '' + string(input.rope_head_dim) : (input.head_dim != input.nope_head_dim + input.rope_head_dim ? ''expected head_dim=''
        + string(input.nope_head_dim + input.rope_head_dim) + '', got '' + string(input.head_dim) : '''')))'
  - if: vars.bad != ''
    then:
    - title: The first failing dimension check
      source: vllm/v1/attention/ops/rocm_aiter_mla_sparse.py:1916-1931
      fail:
        code: assertion-error
        message: = vars.op + ' ' + vars.bad
  - title: Launch over (queries, heads / 16); BLOCK_K 16 for heads >= 256 dims, else 32. The kernel reads each KV row at _sparse_kv_row_offset(slot, stride) (int64)
    source: vllm/v1/attention/ops/rocm_aiter_mla_sparse.py:3530
    call: rocm-aiter-mla-sparse-ops.sparse-attn-prefill-ragged-kernel
    input:
      num_tokens: = input.num_queries
      num_heads: = input.num_heads
      head_size: = input.head_dim
    fill: true
  - return:
      grid: = [input.num_queries, (input.num_heads + 15) / 16]
      block_k: '= input.head_dim >= 256 ? 16 : 32'
