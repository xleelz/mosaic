- component: mla-attention
  name: get-kv-cache-spec
  kind: function
  summary: 'MLAAttention.get_kv_cache_spec: an MLA spec with one latent head (head_size 576 for DeepSeek), the layer''s cache dtype string, its KVQuantMode, and the ds_mla page sizes.'
  sources:
  - vllm/model_executor/layers/attention/mla_attention.py:1350-1379
  request:
    type: object
    properties:
      kv_cache_dtype:
        type: string
        default: auto
      head_size:
        type: integer
        default: 576
      model_dtype_bytes:
        type: integer
        default: 2
      sliding_window:
        type: integer
        default: 0
      has_indexer:
        type: boolean
        default: false
      non_causal_multi_token_decode:
        type: boolean
        default: false
  response:
    type: object
    properties:
      cache_dtype_str:
        type: string
      kv_quant_mode:
        type: string
      page_size_bytes:
        type: integer
  behavior:
  - title: Arguments the caller leaves out take the function's defaults (no sliding window, no indexer; no declared backend layouts; no layout resolved yet)
    set:
      vars.i: '= merge({''kv_cache_dtype'': config[''kv-cache-dtype''], ''head_size'': 576, ''model_dtype_bytes'': 2, ''sliding_window'': 0, ''has_indexer'': false, ''non_causal_multi_token_decode'': false},
        input)'
  - title: 'kv_cache_dtype_str_to_dtype: ''auto'' is the model dtype; fp8, ds_mla, nvfp4 and per-token-head caches are stored as uint8'
    source: vllm/utils/torch_utils.py:533-539
    set:
      vars.dt: '= vars.i.kv_cache_dtype == ''auto'' ? vars.i.model_dtype_bytes : (vars.i.kv_cache_dtype in [''bfloat16'', ''float16'', ''half''] ? 2 : (vars.i.kv_cache_dtype in [''float'', ''float32'']
        ? 4 : 1))'
  - title: get_kv_quant_mode of the layer's cache dtype
    source: vllm/model_executor/layers/attention/mla_attention.py:1361
    call: kv-quant-mode.get-kv-quant-mode
    input:
      kv_cache_dtype: = vars.i.kv_cache_dtype
    as: q
    fill: true
  - title: 'ds_mla layouts pack NoPE + RoPE + scales into one opaque blob per token: 656 B (fp8) or 352 B (nvfp4)'
    source: vllm/model_executor/layers/attention/mla_attention.py:1365
    set:
      vars.blob: '= vars.i.kv_cache_dtype == ''fp8_ds_mla'' ? dyn(656) : (vars.i.kv_cache_dtype == ''nvfp4_ds_mla'' ? dyn(352) : dyn(null))'
      vars.cls: '= vars.i.sliding_window > 0 ? ''sliding_window_mla'' : ''mla_attention'''
  - title: One latent KV head, never sharded across TP; a SlidingWindowMLASpec when the layer has a window, else an MLAAttentionSpec
    source: vllm/model_executor/layers/attention/mla_attention.py:1369-1379
    set:
      vars.content: '= vars.blob != null ? vars.blob : vars.i.head_size * vars.dt'
  - title: 'AttentionSpec.page_size_bytes for that spec: 1 head slot x block_size states x the packed blob (ds_mla) or head_size latent bytes (MLA has no separate V)'
    source: vllm/v1/kv_cache_interface.py:552-553
    set:
      vars.page: = int(config['block-size']) * vars.content
  - return:
      spec_class: = vars.cls
      block_size: = int(config['block-size'])
      num_kv_heads: 1
      max_tp_shards: 1
      head_size: = vars.i.head_size
      cache_dtype_str: = vars.i.kv_cache_dtype
      kv_quant_mode: = vars.q.value.kv_quant_mode
      page_size_bytes: = vars.page
      sliding_window: '= vars.i.sliding_window > 0 ? dyn(vars.i.sliding_window) : dyn(null)'
      is_index_group_leader: = vars.cls == 'mla_attention' && vars.i.has_indexer
      non_causal_multi_token_decode: = vars.cls == 'mla_attention' && vars.i.non_causal_multi_token_decode
- component: mla-attention
  name: bind-kv-cache
  kind: function
  summary: 'MLAAttention.bind_kv_cache: keep the squeezed cache; with JIT warm-up on and a flat sparse layout, register the convert kernel''s warm-up at the cache''s block stride.'
  sources:
  - vllm/model_executor/layers/attention/mla_attention.py:734-750
  - vllm/model_executor/layers/attention/mla_attention.py:752-757
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASHMLA_SPARSE
      kv_cache_dtype:
        type: string
        default: auto
      enable_jit_warmup:
        type: boolean
        default: false
      block_stride:
        type: integer
        default: 36864
      row_width:
        type: integer
        default: 576
  response:
    type: object
    properties:
      flat:
        type: boolean
      warmup_block_stride_rows:
        type:
        - integer
        - 'null'
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: block stride not a whole number of rows
  behavior:
  - title: The [B, 1, N, C] cache is squeezed to [B, N, C]; the flat layouts are FLASHINFER_MLA_SPARSE and FLASHMLA_SPARSE without a ds_mla dtype
    source: vllm/model_executor/layers/attention/mla_attention.py:752-757
    set:
      vars.flat: = input.backend == 'FLASHINFER_MLA_SPARSE' || (input.backend == 'FLASHMLA_SPARSE' && !(input.kv_cache_dtype in ['fp8_ds_mla', 'nvfp4_ds_mla']))
  - if: input.enable_jit_warmup && vars.flat
    then:
    - if: input.block_stride % input.row_width != 0
      then:
      - title: The block stride must be whole rows
        source: vllm/model_executor/layers/attention/mla_attention.py:746
        fail:
          code: assertion-error
          message: ''
    - title: Register a JIT warm-up of the index-convert kernel at this block stride
      source: vllm/model_executor/layers/attention/mla_attention.py:747-750
      return:
        flat: true
        warmup_block_stride_rows: = input.block_stride / input.row_width
  - return:
      flat: = vars.flat
      warmup_block_stride_rows: null
- component: mla-attention
  name: chunked-prefill-workspace-size
  kind: function
  summary: 'MLAAttention.chunked_prefill_workspace_size: tokens of the chunked-context prefill workspace, aligned to the block size (and to DCP x interleave under DCP).'
  sources:
  - vllm/model_executor/layers/attention/mla_attention.py:760-767
  - vllm/model_executor/layers/attention/mla_attention.py:2293-2318
  - vllm/model_executor/layers/attention/mla_attention.py:1989-2001
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      workspace_tokens:
        type: integer
  behavior:
  - title: Eight full-length requests or four pages per sequence, capped at 64K tokens
    source: vllm/model_executor/layers/attention/mla_attention.py:2293-2318
    set:
      vars.w: = math.least(math.greatest(8 * int(config['max-model-len']), 4 * int(config['max-num-seqs']) * int(config['block-size'])), 65536)
      vars.a: = int(config['block-size'])
  - if: int(config['decode-context-parallel-size']) > 1
    then:
    - title: Under DCP the alignment is lcm(block_size, dcp x interleave)
      source: vllm/model_executor/layers/attention/mla_attention.py:1995-2000
      set:
        vars.a: = lists.range(int(config['block-size'])).map(i, (i + 1) * int(config['decode-context-parallel-size']) * int(config['cp-kv-cache-interleave-size'])).filter(x, x % int(config['block-size'])
          == 0)[0]
  - title: round_up(max(size, alignment), alignment); memoized on the layer
    source: vllm/model_executor/layers/attention/mla_attention.py:760-767
    return:
      workspace_tokens: = ((math.greatest(vars.w, vars.a) + vars.a - 1) / vars.a) * vars.a
      alignment: = vars.a
- component: flashinfer-mla-sparse-sm90-builder
  name: build
  kind: function
  summary: 'FlashInferMLASparseSM90Builder.build: per-row KV lengths (exact, or sync-free upper bounds), trimmed to the decode rows when prefills go to sparse MHA, then the SM90 state''s plan.'
  sources:
  - vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:524-549
  - vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:476-511
  - vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:514-522
  request:
    type: object
    properties:
      query_start_loc_cpu:
        type: array
        items:
          type: integer
        default:
        - 0
        - 1
        - 6
      seq_lens:
        type: array
        items:
          type: integer
        default:
        - 1402
        - 5
      has_seq_lens_cpu_upper_bound:
        type: boolean
        default: true
      seq_lens_cpu_upper_bound:
        type: array
        items:
          type: integer
        default:
        - 1402
        - 5
      adaptive_verification:
        type: boolean
        default: false
      num_prefills:
        type: integer
        default: 1
      num_decode_tokens:
        type: integer
        default: 1
      use_sparse_mha:
        type: boolean
        default: false
      index_topk:
        type: integer
        default: 2048
      index_kpool:
        type: integer
        default: 1
      topk_width:
        type: integer
        default: 2048
  response:
    type: object
    properties:
      num_rows:
        type: integer
      kv_lens: *id025
      exact:
        type: boolean
  behavior:
  - title: The common sparse metadata (req ids, top-k buffer access)
    source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:530
    set:
      vars.rows: = input.query_start_loc_cpu[size(input.query_start_loc_cpu) - 1]
  - if: vars.rows == 0
    then:
    - set:
        vars.lens: []
        vars.exact: true
    else:
    - if: '!input.has_seq_lens_cpu_upper_bound'
      then:
      - title: 'Exact lengths: row j of request i attends seq_len - q_len + j + 1; past index_topk only topk + ctx % kpool are valid'
        source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:500-504
        set:
          vars.ctx: = lists.range(size(input.query_start_loc_cpu) - 1).map(r, lists.range(input.query_start_loc_cpu[r + 1] - input.query_start_loc_cpu[r]).map(j, input.seq_lens[r] - (input.query_start_loc_cpu[r
            + 1] - input.query_start_loc_cpu[r]) + 1 + j)).flatten()
          vars.exact: true
      - set:
          vars.lens: '= vars.ctx.map(c, c <= input.index_topk ? c : input.index_topk + c % input.index_kpool)'
      else:
      - if: input.adaptive_verification
        then:
        - title: 'Adaptive verification: bound every row by the longest request'
          source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:505-508
          set:
            vars.ctx: = lists.range(vars.rows).map(i, math.greatest(input.seq_lens_cpu_upper_bound))
        else:
        - title: Upper bounds from the CPU seq_lens bound (sync-free)
          source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:514-522
          set:
            vars.ctx: = lists.range(size(input.query_start_loc_cpu) - 1).map(r, lists.range(input.query_start_loc_cpu[r + 1] - input.query_start_loc_cpu[r]).map(j, input.seq_lens_cpu_upper_bound[r] - (input.query_start_loc_cpu[r
              + 1] - input.query_start_loc_cpu[r]) + 1 + j)).flatten()
      - title: Clamped to the largest valid count; the plan clamps on device
        source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:511
        set:
          vars.lens: = vars.ctx.map(c, math.least(c, math.least(input.index_topk + input.index_kpool - 1, input.topk_width)))
          vars.exact: false
  - if: input.num_prefills > 0 && input.use_sparse_mha
    then:
    - title: 'MHA prefills leave q before forward_mqa: plan only the decode prefix'
      source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:537-541
      set:
        vars.rows: = input.num_decode_tokens
        vars.lens: = vars.lens.slice(0, input.num_decode_tokens)
