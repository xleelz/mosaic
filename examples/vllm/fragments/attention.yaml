configs:
- id: attention-backend
  type: string
  value: null
  default: null
  summary: 'attention_backend / AttentionConfig.backend: unset, so the platform picks by priority (FLASH_ATTN first on SM90)'
  sources:
  - vllm/config/attention.py:40
  - vllm/engine/arg_utils.py:791
  attributes:
    key: attention_backend
- id: flash-attn-version
  type: integer
  value: null
  default: null
  summary: 'AttentionConfig.flash_attn_version: unset, so get_flash_attn_version picks by compute capability'
  sources:
  - vllm/config/attention.py:57
  - vllm/v1/attention/backends/fa_utils.py:115
  attributes:
    key: flash_attn_version
- id: flash-attn-max-num-splits-for-cuda-graph
  type: integer
  value: 32
  default: 32
  summary: upper bound on FA3 split-KV splits when full CUDA graphs are captured
  sources:
  - vllm/config/attention.py:61
  - vllm/v1/attention/backends/flash_attn.py:766
  attributes:
    key: flash_attn_max_num_splits_for_cuda_graph
- id: kv-cache-dtype
  type: string
  value: auto
  default: auto
  summary: kv_cache_dtype / CacheConfig.cache_dtype (attention backends read it; no other fragment defines it)
  sources:
  - vllm/config/cache.py:122
  - vllm/engine/arg_utils.py:500
  attributes:
    key: cache_dtype
- id: decode-context-parallel-size
  type: integer
  value: 1
  default: 1
  summary: 'decode_context_parallel_size: FA takes the DCP path when > 1'
  sources:
  - vllm/config/parallel.py:385
  - vllm/engine/arg_utils.py:532
  attributes:
    key: decode_context_parallel_size
- id: dcp-comm-backend
  type: string
  value: ag_rs
  default: null
  summary: 'dcp_comm_backend: unset in code, VllmConfig fills ag_rs via set_dcp_defaults; a2a selects dcp_a2a_lse_reduce'
  sources:
  - vllm/config/parallel.py:397
  - vllm/config/parallel.py:609
  attributes:
    key: dcp_comm_backend
- id: attn-kernel-launch-us
  type: number
  value: 5
  default: 5
  summary: 'LABELED ASSUMPTION: fixed cost of one attention kernel launch in microseconds (the code gives no number)'
  sources:
  - vllm/v1/attention/ops/triton_unified_attention.py:1103
  attributes:
    key: assumption:attn_kernel_launch_us
    assumption: true
- id: attn-us-per-query-token
  type: number
  value: 0.05
  default: 0.05
  summary: 'LABELED ASSUMPTION: per-layer attention cost per query token in microseconds (Llama-8B head shape, H100-class GPU)'
  sources:
  - vllm/v1/attention/ops/triton_unified_attention.py:979
  attributes:
    key: assumption:attn_us_per_query_token
    assumption: true
- id: attn-us-per-kv-token
  type: number
  value: 0.002
  default: 0.002
  summary: 'LABELED ASSUMPTION: per-layer cost per KV-cache token read in microseconds (4 KiB of K+V per token per layer at ~3 TB/s)'
  sources:
  - vllm/v1/attention/ops/triton_unified_attention.py:939
  attributes:
    key: assumption:attn_us_per_kv_token
    assumption: true
- id: attention-backend-per-kind
  type: object
  value: {}
  default: {}
  summary: 'AttentionConfig.backend_per_kind: per-KV-cache-group backend overrides keyed by KVCacheSpecKind value (full_attention, mla_attention, sliding_window, ...); empty unless set'
  sources:
  - vllm/config/attention.py:46
  - vllm/config/attention.py:205-227
  attributes:
    key: backend_per_kind
- id: vllm-rocm-aiter-mla-asm-padding
  type: string
  value: auto
  default: auto
  summary: 'VLLM_ROCM_AITER_MLA_ASM_PADDING: small-head AITER MLA decode kernel choice (auto | gluon | asm)'
  sources:
  - vllm/envs.py:148
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py:316-340
  attributes:
    key: VLLM_ROCM_AITER_MLA_ASM_PADDING
    boundary: true
    owner: config-platform
- id: cp-kv-cache-interleave-size
  type: integer
  value: 1
  default: 1
