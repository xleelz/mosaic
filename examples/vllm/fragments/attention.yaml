- component: attention-impl-base
  name: new
  kind: function
  summary: 'AttentionImplBase.__new__: every impl binds the DCP and PCP world sizes and ranks at construction, and whether decode returns its LSE.'
  sources:
  - vllm/v1/attention/backend.py:850-875
  request:
    type: object
    properties:
      has_vllm_config:
        type: boolean
        default: true
      dcp_group_initialized:
        type: boolean
        default: false
      dcp_world_size:
        type: integer
        default: 1
      dcp_rank:
        type: integer
        default: 0
      pcp_group_initialized:
        type: boolean
        default: false
      pcp_world_size:
        type: integer
        default: 1
      pcp_rank:
        type: integer
        default: 0
      can_return_lse_for_decode:
        type: boolean
        default: true
  response:
    type: object
    properties:
      dcp_world_size:
        type: integer
      need_to_return_lse_for_decode:
        type: boolean
  behavior:
  - title: 'Replicated drafts run at DCP=1 inside a DCP target: the group is consulted only when the config enables DCP (or there is no config)'
    source: vllm/v1/attention/backend.py:857-859
    set:
      vars.enabled: = !input.has_vllm_config || int(config['decode-context-parallel-size']) > 1
  - if: vars.enabled && input.dcp_group_initialized
    then:
    - title: 'get_dcp_world_size_and_rank: the DCP group''s size and rank'
      source: vllm/distributed/parallel_state.py:1627-1632
      set:
        vars.dcp: = input.dcp_world_size
        vars.dcp_rank: = input.dcp_rank
    else:
    - title: 'Disabled or uninitialized (unit tests): (1, 0)'
      source: vllm/distributed/parallel_state.py:1630
      set:
        vars.dcp: 1
        vars.dcp_rank: 0
  - if: input.pcp_group_initialized
    then:
    - title: The PCP group's size and rank
      source: vllm/v1/attention/backend.py:864
      set:
        vars.pcp: = input.pcp_world_size
        vars.pcp_rank: = input.pcp_rank
    else:
    - title: 'get_pcp_group asserts when there is no PCP group: (1, 0)'
      source: vllm/v1/attention/backend.py:866
      set:
        vars.pcp: 1
        vars.pcp_rank: 0
  - title: Decode returns the LSE only under DCP, when the impl can
    source: vllm/v1/attention/backend.py:872-875
    return:
      dcp_world_size: = vars.dcp
      dcp_rank: = vars.dcp_rank
      pcp_world_size: = vars.pcp
      pcp_rank: = vars.pcp_rank
      total_cp_world_size: = vars.dcp
      total_cp_rank: = vars.dcp_rank
      need_to_return_lse_for_decode: = vars.dcp > 1 && input.can_return_lse_for_decode
- component: attention-metadata-builder
  name: get-cudagraph-support
  kind: function
  summary: 'AttentionMetadataBuilder.get_cudagraph_support: the CUDA-graph support level of a backend''s builder (FlashAttention and FlashInfer decide at run time).'
  sources:
  - vllm/v1/attention/backend.py:623-629
  - vllm/v1/attention/backends/flash_attn.py:622-627
  - vllm/v1/attention/backends/flashinfer.py:1036-1080
  - vllm/v1/attention/backend.py:554-566
  - vllm/v1/attention/backends/triton_attn.py:92
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASH_ATTN
      fa_version:
        type: integer
        default: 3
      all_specs_trtllm:
        type: boolean
        default: true
      use_non_causal:
        type: boolean
        default: false
      is_xqa_arch:
        type: boolean
        default: true
  response:
    type: object
    properties:
      support:
        type: string
      level:
        type: integer
  behavior:
  - if: input.backend == 'FLASH_ATTN'
    then:
    - title: 'FlashAttention: ALWAYS with FA3 (AOT scheduling), else UNIFORM_BATCH'
      source: vllm/v1/attention/backends/flash_attn.py:614-618
      set:
        vars.s: '= input.fa_version == 3 ? ''ALWAYS'' : ''UNIFORM_BATCH'''
    else:
    - if: input.backend == 'FLASHINFER'
      then:
      - if: int(config['decode-context-parallel-size']) > 1
        then:
        - title: 'FlashInfer under DCP: XQA has no LSE and trtllm-gen can''t graph varlen'
          source: vllm/v1/attention/backends/flashinfer.py:1043
          set:
            vars.s: UNIFORM_SINGLE_TOKEN_DECODE
        else:
        - title: Uniform batches when every attention spec runs on TRT-LLM (or XQA) and the layer is causal or the arch is XQA
          source: vllm/v1/attention/backends/flashinfer.py:1036-1080
          set:
            vars.s: '= input.all_specs_trtllm && (!input.use_non_causal || input.is_xqa_arch) ? ''UNIFORM_BATCH'' : ''UNIFORM_SINGLE_TOKEN_DECODE'''
      else:
      - title: The builder class's _cudagraph_support; a builder that sets none inherits NEVER
        source: vllm/v1/attention/backend.py:623-629
        set:
          vars.s: '= input.backend in state.cg_support ? state.cg_support[input.backend] : ''NEVER'''
  - title: 'AttentionCGSupport levels: ALWAYS 3 > UNIFORM_BATCH 2 > UNIFORM_SINGLE_TOKEN_DECODE 1 > NEVER 0'
    source: vllm/v1/attention/backend.py:554-566
    return:
      support: = vars.s
      level: '= {''NEVER'': 0, ''UNIFORM_SINGLE_TOKEN_DECODE'': 1, ''UNIFORM_BATCH'': 2, ''ALWAYS'': 3}[vars.s]'
