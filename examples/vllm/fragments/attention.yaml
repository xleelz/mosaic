    source: vllm/v1/attention/backends/flash_attn.py:955
    return:
      num_actual_tokens: = vars.i.common.num_actual_tokens
      num_reqs: = vars.i.common.num_reqs
      max_query_len: = vars.i.common.max_query_len
      max_seq_len: = vars.i.common.max_seq_len
