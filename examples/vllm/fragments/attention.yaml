        max_seq_len: 1
        query_lens:
        - 1
        seq_lens:
        - 1
        block_table:
        - - 0
        slot_mapping:
        - 0
        causal: true
        causal_is_tensor: true
        causal_tensor_dtype: int64
    as: causal
  - interface: merge-attn-states.merge-attn-states
    caller: gpu-worker
    input:
      head_strides_match: false
      prefix_head_stride: 128
      suffix_head_stride: 256
    as: merge
  - interface: merge-attn-states.merge-attn-states
    caller: gpu-worker
    input:
      output_dtype: float8_e4m3fn
    as: mscale
  - interface: triton-reshape-and-cache-flash.triton-reshape-and-cache-flash
    caller: gpu-worker
    input:
      kv_cache_dtype: fp8
      device_capability_major: 8
      device_capability_minor: 0
    as: trc
  - interface: triton-reshape-and-cache-flash.triton-reshape-and-cache-flash
    caller: gpu-worker
    input:
      kv_cache_dtype: fp8
      device_capability_major: 8
      device_capability_minor: 9
    as: trc89
  - interface: kv-quant-mode.get-kv-quant-mode
    caller: gpu-worker
    input:
      kv_cache_dtype: turboquant_2bit
    as: tq
  - interface: attention-backend-enum.register
    caller: gpu-worker
    input:
      name: FLASH_ATTN
      value: my.module.Backend
    as: dup
  expect:
  - '!steps.kv.result.ok && steps.kv.result.error.message.startsWith(''Invalid kv_cache_dtype: fp4. Valid values are: (\''auto\'', \''float16\'''') && steps.kv.result.error.message.endsWith("''nvfp4_4over6'')")'
  - steps.causal.result.error.message == 'Per-request causal tensor must be int32, got torch.int64. Casting here would allocate a fresh tensor each build() and break FULL CUDA graph replay; allocate the
    buffer as int32.'
  - steps.merge.result.error.message == 'merge_attn_states requires prefix_output and suffix_output to have matching head strides, got 128 and 256'
  - steps.mscale.result.error.message == 'output_scale is required when output is torch.float8_e4m3fn'
  - 'steps.trc.result.error.message == ''Triton reshape-and-cache cannot store kv_cache_dtype=fp8 on this device: an FP8 KV cache needs native fp8e4nv (SM89+). Use --kv-cache-dtype bfloat16 (or float16
    on SM75).'''
