- id: attention-validate-backend-other-classes
  name: FlashInfer, FlexAttention, TurboQuant and the MLA classes apply their own capability checks
  fixtures: *id029
  steps:
  - flow: attn-validate-backend
    input:
      backend: FLASHINFER
      device_capability:
        major: 10
        minor: 0
      fa_version: 4
    as: fi
  - flow: attn-validate-backend
    input:
      backend: FLASHMLA
    as: mla_dense
  - flow: attn-validate-backend
    input:
      backend: TRITON_MLA
      use_mla: true
      head_size: 576
    as: tmla
  - flow: attn-validate-backend
    input:
      backend: CUTLASS_MLA
