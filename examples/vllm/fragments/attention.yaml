  name: get-kv-quant-mode
  kind: function
  summary: 'get_kv_quant_mode / is_quantized_kv_cache: the KVQuantMode of a kv_cache_dtype string, and its family flags.'
  sources:
  - vllm/v1/kv_cache_interface.py:91-112
  - vllm/v1/kv_cache_interface.py:40-88
