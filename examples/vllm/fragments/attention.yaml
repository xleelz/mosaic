    attention-backend: TRITON_ATTN
  expect:
  - result.ok
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && e.input.selected_backend == 'TRITON_ATTN')
- id: attention-select-backend-platform-refuses
