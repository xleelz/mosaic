- component: attention-backend-utils
  name: make-local-attention-virtual-batches
  kind: function
  summary: 'make_local_attention_virtual_batches: split each request into chunk-local virtual batches (query and key lengths at most attn_chunk_size, total query tokens kept) and build their local block
    table of attn_chunk_size // block_size pages each; returns the new CommonAttentionMetadata and the gather (make_block_table) that update_block_table reuses.'
  sources:
  - vllm/v1/attention/backends/utils.py:509-650
  request:
    type: object
    properties:
      attn_chunk_size:
        type: integer
        default: 8192
      block_size:
        type: integer
        default: 0
      common: &id028
        type: object
        properties:
          query_start_loc_cpu:
            type: array
            items:
              type: integer
            default: []
          query_lens:
            type: array
            items:
              type: integer
            default: []
          seq_lens: *id025
          block_table: &id030
            type: array
            items:
              type: array
              items:
                type: integer
          num_actual_tokens:
            type:
            - integer
            - 'null'
            default: null
          slot_mapping:
            type: array
            items:
              type: integer
            default: []
        required:
        - seq_lens
        - block_table
        description: 'CommonAttentionMetadata: query_start_loc_cpu (or query_lens, as the model''s runner passes it), seq_lens, block_table_tensor rows, num_actual_tokens, slot_mapping'
    required:
    - attn_chunk_size
    - common
  response:
    type: object
    properties:
      common:
        type: object
      make_block_table: &id029
        type: object
        properties:
          virtual_batches:
            type: integer
          pages_per_local_batch:
            type: integer
          batch_indices: *id025
          block_indices: *id025
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: attn_chunk_size is not divisible by block_size
  - code: zero-division-error
    status: 0
    retryable: false
    summary: block_size left at its default 0
  behavior:
  - title: Query lengths from query_start_loc_cpu (the model's CommonAttentionMetadata may carry them as query_lens), seq_lens copied to the host, the block table
    source: vllm/v1/attention/backends/utils.py:514-522
    set:
      vars.qsl: '= has(input.common.query_start_loc_cpu) && size(input.common.query_start_loc_cpu) > 0 ? input.common.query_start_loc_cpu : [0] + lists.range(size(input.common.query_lens)).map(i, sum(input.common.query_lens.slice(0,
        i + 1)))'
      vars.s: = input.common.seq_lens
      vars.bt: = input.common.block_table
  - set:
      vars.n: = size(vars.s)
      vars.q: = lists.range(size(vars.s)).map(i, vars.qsl[i + 1] - vars.qsl[i])
  - title: Query tokens that fall in each request's first (possibly partial) chunk; tokens in its last chunk (attn_chunk_size + seq_len % -attn_chunk_size, so a full chunk when the length divides); local
      blocks = 1 + cdiv(rest, chunk)
    source: vllm/v1/attention/backends/utils.py:535-539
    set:
      vars.qf: = lists.range(vars.n).map(i, math.least(input.attn_chunk_size - ((vars.s[i] - vars.q[i]) % input.attn_chunk_size), vars.q[i]))
      vars.tl: '= lists.range(vars.n).map(i, vars.s[i] % input.attn_chunk_size == 0 ? input.attn_chunk_size : vars.s[i] % input.attn_chunk_size)'
  - set:
      vars.lb: = lists.range(vars.n).map(i, 1 + (vars.q[i] - vars.qf[i] + input.attn_chunk_size - 1) / input.attn_chunk_size)
  - title: One virtual batch per (request, local block), in batch order (the batched arange and its reverse)
    source: vllm/v1/attention/backends/utils.py:550-557
    set:
      vars.vb: = lists.range(vars.n).map(i, lists.range(vars.lb[i]).map(j, [i, j])).flatten()
  - title: 'Virtual query lengths: the first block takes the first-chunk tokens, each later block min(remaining - chunk * (k - 1), chunk); cumulated into query_start_loc'
    source: vllm/v1/attention/backends/utils.py:560-571
    set:
      vars.ql: '= vars.vb.map(p, p[1] == 0 ? vars.qf[p[0]] : math.least(vars.q[p[0]] - vars.qf[p[0]] - input.attn_chunk_size * (p[1] - 1), input.attn_chunk_size))'
  - title: 'Virtual key lengths: a full chunk for every block but each request''s last, which keeps tokens_in_last_block; each block''s absolute key start'
    source: vllm/v1/attention/backends/utils.py:578-582
    set:
      vars.kl: '= vars.vb.map(p, p[1] == vars.lb[p[0]] - 1 ? vars.tl[p[0]] : input.attn_chunk_size)'
      vars.ks: = vars.vb.map(p, vars.s[p[0]] - ((vars.lb[p[0]] - p[1] - 1) * input.attn_chunk_size + vars.tl[p[0]]))
  - if: input.block_size == 0
    then:
    - title: 'block_size defaults to 0: numpy''s floor division by zero only warns, then the chunk-size check divides the Python ints by zero'
      source: vllm/v1/attention/backends/utils.py:586-587
      fail:
        code: zero-division-error
        message: integer modulo by zero
  - if: input.attn_chunk_size % input.block_size != 0
    then:
    - title: The chunk must be a whole number of KV blocks
      source: vllm/v1/attention/backends/utils.py:587-588
      fail:
        code: assertion-error
        message: = 'attn_chunk_size ' + string(input.attn_chunk_size) + ' is not divisible by block_size ' + string(input.block_size)
  - title: pages_per_local_batch = chunk // block_size pages per virtual batch, from the block holding its first key; indices clipped to the block table's last column
    source: vllm/v1/attention/backends/utils.py:590-613
    set:
      vars.pp: = input.attn_chunk_size / input.block_size
      vars.ncols: '= size(vars.bt) > 0 ? size(vars.bt[0]) : 0'
  - set:
      vars.bi: = lists.range(size(vars.vb)).map(v, lists.range(vars.pp).map(k, math.least(vars.ks[v] / input.block_size + k, vars.ncols - 1))).flatten()
      vars.bj: = lists.range(size(vars.vb)).map(v, lists.range(vars.pp).map(k, vars.vb[v][0])).flatten()
  - title: make_block_table gathers block_table[batch_indices, block_indices] viewed as (virtual_batches, pages); it is kept for update_block_table
    source: vllm/v1/attention/backends/utils.py:614-632
    set:
      vars.btl: = lists.range(size(vars.vb)).map(v, lists.range(vars.pp).map(k, vars.bt[vars.bj[v * vars.pp + k]][vars.bi[v * vars.pp + k]]))
  - title: 'The new CommonAttentionMetadata: one request per virtual batch, the same tokens and slot mapping, causal, seq_lens_cpu_upper_bound = the virtual key lengths'
    source: vllm/v1/attention/backends/utils.py:634-650
    return:
      common:
        query_start_loc_cpu: = [0] + lists.range(size(vars.ql)).map(i, sum(vars.ql.slice(0, i + 1)))
        query_lens: = vars.ql
        seq_lens: = vars.kl
        seq_lens_cpu_upper_bound: = vars.kl
        has_cpu_seq_lens_upper_bound: true
        num_reqs: = size(vars.kl)
        num_actual_tokens: '= has(input.common.num_actual_tokens) && input.common.num_actual_tokens != null ? input.common.num_actual_tokens : sum(vars.q)'
        max_query_len: = math.greatest(vars.ql)
        max_seq_len: = math.greatest(vars.kl)
        block_table: = vars.btl
        slot_mapping: '= has(input.common.slot_mapping) ? input.common.slot_mapping : []'
        causal: true
      make_block_table:
        virtual_batches: = size(vars.vb)
        pages_per_local_batch: = vars.pp
        batch_indices: = vars.bj
        block_indices: = vars.bi
