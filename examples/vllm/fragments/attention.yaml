        default: 8
      max_qo_len:
        type: integer
        default: 1
      kv_cache_dtype:
        type: string
        default: auto
      kv_cache_bytes:
        type:
        - integer
        - 'null'
        default: null
      gluon_build_available:
        type: boolean
        default: false
  response:
    type: object
    properties:
      use_gluon:
        type: boolean
  behavior:
  - if: input.num_heads >= 16 || input.max_qo_len != 1
    then:
