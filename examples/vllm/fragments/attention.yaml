    source: vllm/v1/attention/backend.py:511-514
    return:
      token_to_req: '= lists.range(vars.n).map(t, t >= vars.mapped ? 0 : size(input.query_start_loc.slice(1, size(input.query_start_loc)).filter(e, e <= t)))'
