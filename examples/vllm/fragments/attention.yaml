      backend_cls:
        type: object
        properties:
          name:
            type:
            - string
            - 'null'
          capability_majors: *id025
          dtypes:
            type: array
          available:
            type: boolean
          mla_dimensions:
            type: array
        default:
          name: FLASH_ATTN
          capability_majors: []
          dtypes:
          - float16
          - bfloat16
          available: true
          mla_dimensions: []
      has_device_capability:
        type: boolean
        default: true
      device_capability:
        type: object
        properties:
          major:
            type: integer
            default: 9
          minor:
            type: integer
            default: 0
      dtype:
        type: string
        default: bfloat16
      mla_dimensions:
        type: array
        items:
          type: integer
        default:
        - 128
        - 64
        - 128
  response:
    type: object
    properties:
      invalid_reasons:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.r: []
