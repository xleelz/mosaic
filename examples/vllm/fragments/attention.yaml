  name: validate-configuration
  kind: function
  summary: 'MLAPrefillBackend.validate_configuration: the reasons a prefill backend class can''t serve this device, dtype and MLA head layout.'
  sources:
  - vllm/v1/attention/backends/mla/prefill/base.py:94-131
  - vllm/v1/attention/backends/mla/prefill/base.py:63-67
  request:
    type: object
