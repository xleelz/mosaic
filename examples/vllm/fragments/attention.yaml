    - title: Small-head single-token decode on the Gluon kernel
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2256-2289
      return:
        path: gluon-decode
        heads: = input.num_heads
        returns_lse: false
  - if: input.use_gluon_verify
    then:
    - if: input.num_reqs * input.qlen != input.num_tokens
      then:
      - title: The flattened verify block must be num_reqs x qlen rows
        source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2330
        fail:
          code: value-error
          message: verify block is not num_reqs x qlen
    - title: Multi-token verify on Gluon's 4-D MTP entry
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2301
      return:
        path: gluon-verify
        heads: = input.num_heads
        returns_lse: false
  - if: input.dcp_route == 'segmented'
    then:
    - title: DCP verify on segmented MLA
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2354
      return:
        path: segmented
        heads: = input.num_heads
        returns_lse: true
