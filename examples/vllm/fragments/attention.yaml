  - '!steps.tq.result.ok && steps.tq.result.error.code == ''key-error'' && steps.tq.result.error.message == "''TURBOQUANT_2BIT''"'
  - '!steps.dup.result.ok && steps.dup.result.error.message == "Backend FLASH_ATTN already exists in AttentionBackendEnum. Use register_backend(AttentionBackendEnum.FLASH_ATTN, ''my.module.Backend'') to
    override."'
