  entry:
    caller: gpu-worker
    interface: selector.get-attn-backend
    input:
      head_size: 128
      dtype: bfloat16
      kv_cache_dtype: auto
      use_mla: false
      has_sink: false
      use_sparse: false
      use_mm_prefix: false
      attn_type: decoder
      has_sliding_window: false
      num_heads: 32
  sources:
  - vllm/v1/attention/selector.py:105-200
- id: attn-validate-backend
