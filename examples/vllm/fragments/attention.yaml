      fail:
        code: type-error
        message: 'FlashAttentionMetadataBuilder.build() missing 1 required positional argument: ''common_attn_metadata'''
  - title: Arguments not passed by the caller take the code's defaults (FA3 on SM90, full CUDA graphs up to 512 tokens)
    set:
      vars.i: '= merge({''fast_build'': false, ''fa_version'': 3, ''use_full_cuda_graph'': true, ''max_cudagraph_size'': 512, ''dcp_world_size'': config[''decode-context-parallel-size''], ''batch_invariant'':
