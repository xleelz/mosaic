    source: vllm/v1/attention/backends/mla/flashinfer_mla.py:454
    return:
      backend: = vars.backend
      output_shape: = [input.num_decode_tokens, vars.heads, input.kv_lora_rank]
      lse_shape: '= input.return_lse ? dyn([input.num_decode_tokens, vars.heads]) : dyn(null)'
