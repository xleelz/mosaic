- component: ultraquant-format
  name: slot-size
  kind: function
  summary: 'UltraQuant slot_size: bytes per (token, head) slot = K and V FP4 codes (head_dim / 2 each) + one E8M0 scale byte per 32-element group for each.'
  sources:
  - vllm/v1/attention/ops/ultraquant/format.py:195-202
  - vllm/v1/attention/ops/ultraquant/format.py:168-172
  - vllm/v1/attention/ops/ultraquant/format.py:175-179
  - vllm/v1/attention/ops/ultraquant/format.py:97
  request:
    type: object
    properties:
      head_dim:
        type: integer
        default: 128
      group_size:
        type: integer
        default: 32
  response:
    type: object
    properties:
      slot_bytes:
        type: integer
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: bad head_dim
  behavior:
  - if: input.head_dim % 2 != 0
