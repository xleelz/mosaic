    caller: cuda-platform
    interface: attention-backend.validate-configuration
    input:
      backend: FLASH_ATTN
      head_size: 128
      dtype: bfloat16
      kv_cache_dtype: auto
      block_size: null
      use_mla: false
      has_sink: false
      use_sparse: false
      use_mm_prefix: false
      use_per_head_quant_scales: false
      device_capability:
        major: 9
        minor: 0
      attn_type: decoder
      has_sliding_window: false
      use_rswa: false
      use_non_causal: false
      use_batch_invariant: false
