        vars.I)))
- component: attention-backend-utils
  name: get-per-layer-parameters
  kind: function
  summary: 'get_per_layer_parameters: each FlashInfer layer''s PerLayerParameters (window_left, logits_soft_cap, sm_scale, has_sinks) for plan().'
  sources:
  - vllm/v1/attention/backends/utils.py:369-397
  - vllm/v1/attention/backends/utils.py:353-366
  request:
    type: object
    properties:
      layers:
        type: array
        items:
          type: object
        default:
        - name: model.layers.0.self_attn.attn
          sliding_window: []
          scale: 0.088
  response:
    type: object
    properties:
      params:
        type: array
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: impl class mismatch
  behavior:
  - if: input.layers.exists(l, has(l.impl_matches) && !l.impl_matches)
    then:
    - title: Every layer's impl must be (a variant of) the backend's impl class
      source: vllm/v1/attention/backends/utils.py:384
      fail:
        code: assertion-error
        message: attention impl variant not found
  - title: window_left from the impl's sliding window (or -1), the soft cap, the scale, and whether it has sinks
    source: vllm/v1/attention/backends/utils.py:387-397
    return:
      params: '= input.layers.map(l, {''name'': l.name, ''window_left'': has(l.sliding_window) && size(l.sliding_window) > 0 ? l.sliding_window[0] : -1, ''logits_soft_cap'': has(l.logits_soft_cap) ? l.logits_soft_cap
        : null, ''sm_scale'': l.scale, ''has_sinks'': has(l.has_sinks) && l.has_sinks})'
- component: attention-backend-utils
  name: get-supported-kv-cache-layouts
  kind: function
  summary: 'get_supported_kv_cache_layouts: the KV-cache layouts every backend of the worker supports, most preferred first; ValueError when none.'
  sources:
  - vllm/v1/attention/backends/utils.py:209-244
  - vllm/v1/attention/backend.py:369
  - vllm/v1/attention/backends/flashinfer.py:604-610
  request:
    type: object
    properties:
      backend_layouts:
        type: array
        items:
          type: array
          items:
            type: string
        default: []
        description: each backend's supported_kv_cache_layouts(); [] for a backend that returns None
  response:
    type: object
    properties:
      layouts:
        type: array
        items:
          type: string
        examples:
        - - LBNHC
          - LBHNC
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: no common layout
  behavior:
  - title: Arguments the caller leaves out take the function's defaults (no sliding window, no indexer; no declared backend layouts; no layout resolved yet)
    set:
      vars.i: '= merge({''backend_layouts'': []}, input)'
  - title: Backends that declare their layouts (most preferred first); none declaring means the default preference (LBNHC first)
    source: vllm/v1/attention/backends/utils.py:220-224
    set:
      vars.d: '= size(vars.i.backend_layouts.filter(x, size(x) > 0)) > 0 ? vars.i.backend_layouts.filter(x, size(x) > 0) : [[''LBNHC'', ''LBHNC'', ''BLNHC'', ''BLHNC'', ''BHLNC'', ''LHBNC'']]'
  - if: vars.d.all(x, x == vars.d[0])
    then:
    - title: Identical declarations keep their order
      source: vllm/v1/attention/backends/utils.py:227
      return:
        layouts: = vars.d[0]
  - title: The layouts everyone supports, ranked by how many backends put each first (ties in enum order)
    source: vllm/v1/attention/backends/utils.py:230-237
    set:
      vars.c: = lists.range(size(vars.d) + 1).map(i, size(vars.d) - i).map(p, ['LBHNC', 'LBNHC', 'LHBNC', 'BLHNC', 'BLNHC', 'BHLNC'].filter(l, vars.d.all(x, l in x) && size(vars.d.filter(x, x[0] == l))
        == p)).flatten()
  - if: size(vars.c) == 0
    then:
    - title: An empty intersection is a hard error
      source: vllm/v1/attention/backends/utils.py:239-244
      fail:
        code: value-error
        message: No KV cache layout satisfies every supported set
  - return:
      layouts: = vars.c
- component: attention-backend-utils
  name: record-kv-cache-layout
  kind: function
  summary: 'record_kv_cache_layout: adopt the engine core''s layout in this process (legacy NHD/HND accepted); a different already-resolved layout is a ValueError.'
  sources:
  - vllm/v1/attention/backends/utils.py:247-256
  - vllm/config/cache.py:28-36
  request:
    type: object
    properties:
      kv_cache_layout:
        type: string
        examples:
        - NHD
      existing_layout:
        type: string
        default: ''
        description: cache_config.kv_cache_layout before the call ('' = None)
  response:
    type: object
    properties:
      ok:
        type: boolean
        examples:
        - true
      kv_cache_layout:
        type: string
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: unknown or conflicting layout
  behavior:
  - title: Arguments the caller leaves out take the function's defaults (no sliding window, no indexer; no declared backend layouts; no layout resolved yet)
    set:
      vars.i: '= merge({''existing_layout'': ''''}, input)'
  - title: 'Legacy names: NHD is LBNHC, HND is LBHNC'
    source: vllm/config/cache.py:21-24
    set:
      vars.l: '= vars.i.kv_cache_layout == ''NHD'' ? ''LBNHC'' : (vars.i.kv_cache_layout == ''HND'' ? ''LBHNC'' : vars.i.kv_cache_layout)'
  - if: '!(vars.l in [''LBHNC'', ''LBNHC'', ''LHBNC'', ''BLHNC'', ''BLNHC'', ''BHLNC''])'
    then:
    - title: Unknown layout name
      source: vllm/config/cache.py:28-36
      fail:
        code: value-error
        message: = 'Unknown KV cache layout ' + vars.i.kv_cache_layout
  - if: vars.i.existing_layout != '' && vars.i.existing_layout != vars.l
    then:
    - title: A layout already resolved can't change
      source: vllm/v1/attention/backends/utils.py:251
      fail:
        code: value-error
        message: = 'KV cache layout is already resolved to ' + vars.i.existing_layout + '; cannot change it to ' + vars.l + '.'
  - title: cache_config.kv_cache_layout takes the canonical name
    source: vllm/v1/attention/backends/utils.py:256
    return:
      ok: true
      kv_cache_layout: = vars.l
- component: attention-metadata-builder
  name: build-for-cudagraph-capture
  kind: function
  summary: 'AttentionMetadataBuilder.build_for_cudagraph_capture: by default just build(common_prefix_len=0) (FlashAttention keeps the default).'
  sources:
  - vllm/v1/attention/backend.py:717-726
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASH_ATTN
      common:
