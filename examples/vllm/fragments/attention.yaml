  - steps.trb.result.value.virtual.query_lens == [2, 2] && steps.trb.result.value.metadata.num_reqs == 2 && !trace.exists(e, e.type == 'call.start' && e.interface == 'flash-attention-metadata-builder.build')
  - '!steps.bad.result.ok && steps.bad.result.error.code == ''key-error'''
  - '!steps.notmamba.result.ok && steps.notmamba.result.error.code == ''assertion-error'''
- id: attention-r6-triton-impl-init
  name: 'TritonAttentionImpl.__init__: EmbeddingGemma2-style encoder-only sliding layer (window 513) is (512, 512), a decoder''s (512, 0), none (-1, -1); FP8 KV on an A100 and bfloat16 KV on a T4 are refused
    with the suggested dtype; FP8 on the H100 runs per-tensor'
  fixtures: *id050
  steps:
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input:
      attn_type: encoder_only
      sliding_window: 513
    as: enc
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input:
      sliding_window: 513
    as: dec
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input: {}
    as: none
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input:
      kv_cache_dtype: fp8
      device_capability_major: 8
      device_name: NVIDIA A100-SXM4-80GB
    as: a100
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input:
      kv_cache_dtype: bfloat16
      device_capability_major: 7
      device_capability_minor: 5
      device_name: Tesla T4
    as: t4
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input:
      kv_cache_dtype: fp8
      device_capability_major: 7
      device_capability_minor: 5
      device_name: Tesla T4
    as: t4fp8
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input:
      kv_cache_dtype: fp8
    as: h100fp8
  - interface: triton-attention-impl.init
    caller: gpu-worker
    input:
      sinks_heads: 16
    as: sinks
  expect:
  - steps.enc.result.value.sliding_window == [512, 512] && steps.dec.result.value.sliding_window == [512, 0] && steps.none.result.value.sliding_window == [-1, -1]
  - steps.a100.result.error.message == 'FP8 KV cache is not supported by the Triton attention backend on NVIDIA A100-SXM4-80GB (compute capability 8.0); native FP8 (fp8e4nv) requires SM89+. Re-run with
    --kv-cache-dtype bfloat16.'
  - steps.t4.result.error.message == 'bfloat16 KV cache is not supported on Tesla T4 (compute capability 7.5); bfloat16 requires SM80+. Re-run with --kv-cache-dtype float16.'
  - steps.t4fp8.result.error.message.endsWith('Re-run with --kv-cache-dtype float16.')
  - steps.h100fp8.result.ok && steps.h100fp8.result.value.kv_quant_mode == 'fp8_per_tensor' && steps.none.result.value.num_queries_per_kv == 4
  - '!steps.sinks.result.ok && steps.sinks.result.error.message == ''Sinks must have the same number of heads as the number of heads in the layer. Sinks shape: torch.Size([16]), num_heads: 32.'''
