        ? ''fp8_per_token_head'' : (input.kv_cache_dtype == ''nvfp4_ds_mla'' ? ''nvfp4_ds_mla'' : (input.kv_cache_dtype.startsWith(''nvfp4'') ? ''nvfp4'' : (input.kv_cache_dtype.startsWith(''turboquant_'')
