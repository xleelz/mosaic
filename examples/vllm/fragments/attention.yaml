- component: aiter-mla-impl
  name: forward-mqa
  kind: function
  summary: 'AiterMLAImpl.forward_mqa: decode on Gluon (the builder''s use_gluon_decode / use_gluon_verify), on segmented MLA for DCP verify, or on the padded asm decode (cprr under DCP).'
  sources:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2244-2491
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py:1732-1736
  request:
    type: object
    properties:
      has_decode:
        type: boolean
        default: true
      cache_numel:
        type: integer
        default: 1
      use_gluon_decode:
        type: boolean
        default: false
      use_gluon_verify:
        type: boolean
        default: false
      dcp_route:
        type: string
        default: plain
        enum:
        - plain
        - segmented
        - cprr
      num_heads:
        type: integer
        default: 16
      num_reqs:
        type: integer
        default: 2
      qlen:
        type: integer
        default: 1
      num_tokens:
        type: integer
        default: 2
      dcp_world_size:
        type: integer
        default: 1
  response:
    type: object
    properties:
      path:
        type: string
      heads:
        type: integer
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: no decode metadata
  - code: value-error
    status: 0
    retryable: false
    summary: bad verify block
  behavior:
  - if: '!input.has_decode || input.cache_numel == 0'
    then:
    - title: forward_mqa needs decode metadata and a cache
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2251-2252
      fail:
        code: assertion-error
        message: ''
  - if: input.use_gluon_decode
    then:
    - title: Small-head single-token decode on the Gluon kernel
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2256-2289
      return:
        path: gluon-decode
        heads: = input.num_heads
        returns_lse: false
  - if: input.use_gluon_verify
    then:
    - if: input.num_reqs * input.qlen != input.num_tokens
      then:
      - title: The flattened verify block must be num_reqs x qlen rows
        source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2330
        fail:
          code: value-error
          message: = 'verify block ' + string(input.num_tokens) + ' rows is not a multiple of qlen ' + string(input.qlen)
    - title: Multi-token verify on Gluon's 4-D MTP entry
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2301
      return:
        path: gluon-verify
        heads: = input.num_heads
        returns_lse: false
  - if: input.dcp_route == 'segmented'
    then:
    - title: DCP verify on segmented MLA
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2354
      return:
        path: segmented
        heads: = input.num_heads
        returns_lse: true
  - title: 'asm persistent decode: heads padded to the next multiple of 16 (cprr pads to a native 16/32/64/128), LSE returned under DCP'
    source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2435-2491
    return:
      path: '= input.dcp_route == ''cprr'' ? ''asm-cprr'' : ''asm'''
      heads: '= input.dcp_route == ''cprr'' ? [16, 32, 64, 128].filter(h, h >= input.num_heads)[0] : ((input.num_heads + 15) / 16) * 16'
      returns_lse: = input.dcp_world_size > 1
