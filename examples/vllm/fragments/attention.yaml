    properties:
      kv_written:
        type: boolean
      forward:
        type: object
  behavior:
  - if: input.has_metadata && !input.kv_sharing && input.has_key_value
    then:
    - title: do_kv_cache_update with attn_metadata.slot_mapping (the cross one, not BlockTable's)
      source: vllm/model_executor/layers/attention/cross_attention.py:149-161
      call: flash-attention-impl.do-kv-cache-update
      input:
        attn_type: encoder_decoder
        num_tokens: = size(input.slot_mapping)
        num_kv_heads: = input.num_kv_heads
        head_size: = input.head_size
        slot_mapping: = input.slot_mapping
      as: upd
      fill: true
  - title: super().forward
    source: vllm/model_executor/layers/attention/cross_attention.py:163-173
    call: flash-attention-impl.forward
    input:
      attn_type: encoder_decoder
      num_tokens: = input.num_tokens
      num_heads: = input.num_heads
      num_kv_heads: = input.num_kv_heads
      head_size: = input.head_size
      metadata: = input.metadata
    as: fw
    fill: true
  - return:
      kv_written: = input.has_metadata && !input.kv_sharing && input.has_key_value
      forward: = vars.fw.value
- component: attention-backend
  name: supports-block-size
  kind: function
  summary: 'AttentionBackend.supports_block_size: None is always fine; otherwise the block size must be a multiple of one of the kernel''s block sizes (a fixed kernel size too, since hybrid blocks split
    a framework block into kernel blocks).'
  sources:
  - vllm/v1/attention/backend.py:119-135
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASH_ATTN
      block_size:
        type:
        - integer
        - 'null'
        default: null
  response:
    type: object
    properties:
      supported:
        type: boolean
  errors:
  - code: key-error
    status: 0
    retryable: false
    summary: no such backend
  behavior:
  - &id031
    if: '!(input.backend in state.backends)'
    then:
    - title: Not a modeled backend class
      source: vllm/v1/attention/backends/registry.py:34
      fail:
        code: key-error
        message: = input.backend
  - if: input.block_size == null
    then:
    - title: No block size requested
      source: vllm/v1/attention/backend.py:120
      return:
        supported: true
  - title: block_size % kernel size (MultipleOf(n) counts as n) == 0 for some kernel size
    source: vllm/v1/attention/backend.py:123-135
    return:
      supported: = input.block_size % state.backends[input.backend].block_multiple == 0
- component: attention-backend
  name: get-preferred-block-size
  kind: function
  summary: 'get_preferred_block_size(default_block_size): FlashAttention raises the default to 64 for SM90 FP8 KV with FA4 at head 512 and to 128 for FA4''s hd256 kernel on Blackwell; otherwise the base
    rule keeps the default when supported, else takes the smallest kernel block size (FlashMLA 64, CUTLASS MLA 128). The platform''s update_block_size_for_backend (config-platform) applies it when --block-size
    isn''t given.'
  sources:
  - vllm/v1/attention/backend.py:152-160
  - vllm/v1/attention/backends/flash_attn.py:370-377
  - vllm/v1/attention/backends/flash_attn.py:298-324
  - vllm/v1/attention/backends/flash_attn.py:327-352
  - vllm/v1/attention/backends/fa_utils.py:14
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASH_ATTN
      default_block_size:
        type: integer
        default: 16
      head_size:
        type: integer
        default: 128
      kv_cache_dtype:
        type: string
        default: auto
      device_capability_major:
        type: integer
        default: 9
  response:
    type: object
    properties:
      block_size:
        type: integer
  errors:
  - code: key-error
    status: 0
    retryable: false
    summary: no such backend
  behavior:
  - *id031
  - if: input.backend == 'FLASH_ATTN'
    then:
    - title: FlashAttention asks get_flash_attn_version for the model's head size (the current VllmConfig)
      source: vllm/v1/attention/backends/flash_attn.py:320
      call: fa-utils.get-flash-attn-version
      input:
        head_size: = input.head_size
        device_capability_major: = input.device_capability_major
      as: fav
      fill: true
    - if: input.device_capability_major == 9 && (input.kv_cache_dtype == 'fp8' || input.kv_cache_dtype == 'fp8_e4m3') && input.head_size == 512 && vars.fav.value.fa_version == 4
      then:
      - title: 'SM90 FP8-KV dequant kernel (FA4, head 512): a 64-token TMA page, at least'
        source: vllm/v1/attention/backends/flash_attn.py:298-324
        return:
          block_size: = math.greatest(input.default_block_size, 64)
    - if: input.head_size == 256 && input.device_capability_major in [10, 11] && vars.fav.value.fa_version == 4
      then:
      - title: 'FA4''s dedicated hd256 kernel (SM100/SM110): FA4_HD256_PAGE_SIZE = 128, at least'
        source: vllm/v1/attention/backends/flash_attn.py:327-352
        detail: 'uses_fa4_hd256_kernel: head size 256 (V 256 too) on compute capability 10.x or 11.x; FA4_HD256_PAGE_SIZE in fa_utils.py'
        return:
          block_size: = math.greatest(input.default_block_size, 128)
  - title: 'AttentionBackend.get_preferred_block_size: the default when the kernel accepts it, else the smallest kernel size'
    source: vllm/v1/attention/backend.py:152-160
    return:
      block_size: '= input.default_block_size % state.backends[input.backend].block_multiple == 0 ? input.default_block_size : state.backends[input.backend].block_multiple'
- component: selector
  name: get-mamba-attn-backend
  kind: function
  summary: 'get_mamba_attn_backend(mamba_type): the mamba-family layer''s backend class (Mamba1/2, short conv, linear, GDN) from MambaAttentionBackendEnum (override-aware), refused under VLLM_BATCH_INVARIANT
    since no mamba backend supports batch invariance (functools.cache per type).'
  sources:
  - vllm/v1/attention/selector.py:228-232
  - vllm/v1/attention/selector.py:236-247
  request:
    type: object
    properties:
      mamba_type:
        type: string
        default: MAMBA2
  response:
    type: object
    properties:
      backend_cls_path:
        type: string
      name:
        type:
        - string
        - 'null'
  errors:
  - code: runtime-error
    status: 0
    retryable: false
    summary: VLLM_BATCH_INVARIANT with a mamba backend
  - code: import-error
    status: 0
    retryable: false
    summary: the class can't be imported
  behavior:
  - title: mamba_type is a MambaAttentionBackendEnum member (the layer passes one; the bare assert can't fail here)
    source: vllm/v1/attention/selector.py:239
  - title: 'mamba_type.get_class(): the registered override, else the enum''s class path'
    source: vllm/v1/attention/selector.py:241
    call: mamba-attention-backend-enum.get-class
    input:
      name: = input.mamba_type
    as: c
    fill: true
  - if: config['vllm-batch-invariant']
    then:
    - title: Batch-invariant mode needs supports_batch_invariance(), which no mamba backend overrides (AttentionBackend's default is False)
      source: vllm/v1/attention/selector.py:242-246
      fail:
        code: runtime-error
        message: = 'VLLM batch_invariant mode is not supported for ' + vars.c.value.class_name + '.'
  - return:
      backend_cls_path: = vars.c.value.path
      name: = vars.c.value.class_name
- component: attention-backend-utils
  name: mamba-get-block-table-tensor
  kind: function
  summary: 'mamba_get_block_table_tensor: under mamba_cache_mode ''none'' the block table already holds 1 + num_speculative_blocks state blocks per request; under ''align'' (prefix caching of mamba state)
    gather, per request, the 1 + num_speculative_blocks blocks starting at (seq_len - 1) // block_size (0 for empty rows).'
  sources:
  - vllm/v1/attention/backends/utils.py:1163-1195
  request:
    type: object
    properties:
      block_table: *id030
      seq_lens: *id025
      mamba_cache_mode:
        type: string
        enum:
        - none
        - align
        - all
        default: none
      block_size:
        type: integer
        default: 16
      num_speculative_blocks:
        type: integer
        default: 0
      is_mamba_spec:
        type: boolean
        default: true
    required:
    - block_table
    - seq_lens
  response:
    type: object
    properties:
      block_table: *id030
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: the spec is not a MambaSpec
  behavior:
  - if: input.mamba_cache_mode == 'none'
    then:
    - title: 'mode none: the table is returned as is'
      source: vllm/v1/attention/backends/utils.py:1179-1180
      return:
        block_table: = input.block_table
  - if: '!input.is_mamba_spec'
    then:
    - title: The KV cache spec must be a MambaSpec (bare assert)
      source: vllm/v1/attention/backends/utils.py:1182
      fail:
        code: assertion-error
        message: ''
  - title: start = max((seq_len - 1) // block_size, 0); gather start + 0 .. num_speculative_blocks from each row
    source: vllm/v1/attention/backends/utils.py:1185-1195
    return:
      block_table: '= lists.range(size(input.seq_lens)).map(r, lists.range(1 + input.num_speculative_blocks).map(k, input.block_table[r][math.greatest(input.seq_lens[r] > 0 ? (input.seq_lens[r] - 1) / input.block_size
        : 0, 0) + k]))'
- component: triton-attention-impl
  name: init
  kind: function
  summary: 'TritonAttentionImpl.__init__: the sliding-window tuple (bidirectional for encoder and encoder-only layers), the CUDA capability checks for FP8 and bfloat16 KV caches with their exact messages,
    the sinks shape check, and the KV quant mode.'
  sources:
  - vllm/v1/attention/backends/triton_attn.py:456-547
  request:
    type: object
    properties:
      num_heads:
        type: integer
        default: 32
      num_kv_heads:
        type: integer
        default: 8
      head_size:
        type: integer
        default: 128
      sliding_window:
        type:
        - integer
        - 'null'
        default: null
      attn_type:
        type: string
        default: decoder
      kv_cache_dtype:
        type: string
        default: auto
      logits_soft_cap:
        type:
        - number
        - 'null'
        default: null
      sinks_heads:
        type:
        - integer
        - 'null'
        default: null
      platform:
        type: string
        default: cuda
      device_capability_major:
        type: integer
        default: 9
      device_capability_minor:
        type: integer
        default: 0
      device_name:
        type: string
        default: NVIDIA H100 80GB HBM3
  response:
    type: object
    properties:
      sliding_window: *id025
      logits_soft_cap:
        type: number
      num_queries_per_kv:
        type: integer
      kv_quant_mode:
        type: string
      supports_quant_query_input:
        type: boolean
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: FP8 KV below SM89 or bfloat16 KV below SM80 on CUDA
  - code: assertion-error
    status: 0
    retryable: false
    summary: sinks shape
  behavior:
  - title: 'Sliding window as (left, right): encoder and encoder-only layers see both sides (W - 1 each), decoders only the past; none is (-1, -1)'
    source: vllm/v1/attention/backends/triton_attn.py:479-484
    set:
      vars.sw: '= input.sliding_window == null ? [-1, -1] : (input.attn_type in [''encoder'', ''encoder_only''] ? [input.sliding_window - 1, input.sliding_window - 1] : [input.sliding_window - 1, 0])'
  - if: input.platform == 'cuda' && input.kv_cache_dtype.startsWith('fp8') && (input.device_capability_major * 10 + input.device_capability_minor) < 89
    then:
    - title: 'CUDA: an FP8 KV cache needs native fp8e4nv (SM89+); the suggestion is float16 below SM80, else bfloat16'
      source: vllm/v1/attention/backends/triton_attn.py:490-500
      fail:
        code: value-error
        message: '= ''FP8 KV cache is not supported by the Triton attention backend on '' + input.device_name + '' (compute capability '' + (string(input.device_capability_major) + ''.'' + string(input.device_capability_minor))
          + ''); native FP8 (fp8e4nv) requires SM89+. Re-run with --kv-cache-dtype '' + ((input.device_capability_major * 10 + input.device_capability_minor) < 80 ? ''float16'' : ''bfloat16'') + ''.'''
  - if: input.platform == 'cuda' && input.kv_cache_dtype == 'bfloat16' && (input.device_capability_major * 10 + input.device_capability_minor) < 80
    then:
    - title: 'CUDA: a bfloat16 KV cache needs SM80+'
      source: vllm/v1/attention/backends/triton_attn.py:501-508
      fail:
        code: value-error
        message: = 'bfloat16 KV cache is not supported on ' + input.device_name + ' (compute capability ' + (string(input.device_capability_major) + '.' + string(input.device_capability_minor)) + '); bfloat16
          requires SM80+. Re-run with --kv-cache-dtype float16.'
  - if: input.sinks_heads != null && input.sinks_heads != input.num_heads
    then:
    - title: Sinks need one value per head
      source: vllm/v1/attention/backends/triton_attn.py:522-525
      fail:
        code: assertion-error
        message: '= ''Sinks must have the same number of heads as the number of heads in the layer. Sinks shape: torch.Size(['' + string(input.sinks_heads) + '']), num_heads: '' + string(input.num_heads)
          + ''.'''
  - title: Soft cap None is 0 (none); queries per KV head; the KV quant mode of the cache dtype
    source: vllm/v1/attention/backends/triton_attn.py:509-532
    call: kv-quant-mode.get-kv-quant-mode
    input:
      kv_cache_dtype: = input.kv_cache_dtype
    as: qm
    fill: true
  - return:
      sliding_window: = vars.sw
      logits_soft_cap: '= input.logits_soft_cap == null ? 0.0 : input.logits_soft_cap'
      num_queries_per_kv: = input.num_heads / input.num_kv_heads
      kv_quant_mode: = vars.qm.value.kv_quant_mode
      supports_quant_query_input: = input.platform == 'cuda'
