    then:
    - title: Dependencies missing
      source: vllm/v1/attention/backends/mla/prefill/base.py:113
      set:
        vars.r: = vars.r + ['required dependencies not available']
  - if: size(input.backend_cls.mla_dimensions) > 0 && !(input.mla_dimensions in input.backend_cls.mla_dimensions)
    then:
    - title: MLA dimensions not supported
      source: vllm/v1/attention/backends/mla/prefill/base.py:117-130
      set:
        vars.r: = vars.r + ['Model does not have supported MLA dimensions']
  - return:
      invalid_reasons: = vars.r
- component: mla-prefill-selector
  name: get-mla-prefill-backend
  kind: function
  summary: 'get_mla_prefill_backend: an explicit mla_prefill_backend is loaded and validated (ValueError when invalid); otherwise, and always on CPU, the platform auto-selects.'
  sources:
  - vllm/v1/attention/backends/mla/prefill/selector.py:46-109
  - vllm/v1/attention/backends/mla/prefill/selector.py:113-132
  request:
    type: object
