    else:
    - when: vars.aot
      title: FA3 AOT scheduler metadata for this batch
      source: vllm/v1/attention/backends/flash_attn.py:649
      call: flash-attn-interface.get-scheduler-metadata
      input:
        shape:
          num_tokens: = vars.i.common.num_actual_tokens
          num_seqs: = vars.i.common.num_reqs
          kv_tokens: = sum(vars.i.common.seq_lens)
          max_query_len: = vars.i.common.max_query_len
        causal: = vars.i.common.causal
      fill: true
    - set:
        vars.sched: = vars.aot
  - if: vars.i.common.causal_is_tensor && vars.i.common.causal_tensor_dtype != 'int32'
    then:
    - title: Per-request causal tensor must be int32
      source: vllm/v1/attention/backends/flash_attn.py:948
      fail:
        code: value-error
        message: = 'Per-request causal tensor must be int32, got torch.' + vars.i.common.causal_tensor_dtype + '. Casting here would allocate a fresh tensor each build() and break FULL CUDA graph replay;
