- component: mla-attention
  name: chunked-prefill-workspace-size
  kind: function
  summary: 'MLAAttention.chunked_prefill_workspace_size: tokens of the chunked-context prefill workspace, aligned to the block size (and to DCP x interleave under DCP).'
  sources:
  - vllm/model_executor/layers/attention/mla_attention.py:760-767
  - vllm/model_executor/layers/attention/mla_attention.py:2293-2318
  - vllm/model_executor/layers/attention/mla_attention.py:1989-2001
  request:
    type: object
    properties: {}
  response:
    type: object
    properties:
      workspace_tokens:
        type: integer
  behavior:
  - title: Eight full-length requests or four pages per sequence, capped at 64K tokens
    source: vllm/model_executor/layers/attention/mla_attention.py:2293-2318
    set:
      vars.w: = math.least(math.greatest(8 * int(config['max-model-len']), 4 * int(config['max-num-seqs']) * int(config['block-size'])), 65536)
      vars.a: = int(config['block-size'])
  - if: int(config['decode-context-parallel-size']) > 1
    then:
    - title: Under DCP the alignment is lcm(block_size, dcp x interleave)
      source: vllm/model_executor/layers/attention/mla_attention.py:1995-2000
      set:
        vars.a: = lists.range(int(config['block-size'])).map(i, (i + 1) * int(config['decode-context-parallel-size']) * int(config['cp-kv-cache-interleave-size'])).filter(x, x % int(config['block-size'])
