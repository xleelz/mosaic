- component: flash-attn-interface
  name: flash-attn-varlen-func
  kind: function
  summary: 'flash_attn_varlen_func: validate the arguments for the requested FA version and launch the FA2, FA3 or FA4 kernel.'
  sources:
  - vllm/vllm_flash_attn/flash_attn_interface.py:176-477
  request:
    type: object
    properties:
      shape:
        $ref: AttnKernelShape
      fa_version:
        type: integer
        default: 3
      paged:
        type: boolean
        default: true
      causal:
        type: boolean
        default: true
      has_scheduler_metadata:
        type: boolean
        default: false
      has_descale:
        type: boolean
        default: false
      num_splits:
        type: integer
        default: 0
      has_alibi:
        type: boolean
        default: false
      has_sinks:
        type: boolean
        default: false
      return_lse:
        type: boolean
        default: false
  response:
    type: object
    properties:
      fa_version:
        type: integer
      lse:
        type: boolean
  errors:
  - code: not-implemented-error
    status: 0
    retryable: false
    summary: an option the chosen FA version lacks
  - code: assertion-error
    status: 0
    retryable: false
    summary: ALiBi on FA3/FA4
  - code: value-error
    status: 0
    retryable: false
    summary: unknown FA version
  behavior:
  - if: input.fa_version == 2
    then:
    - if: input.has_scheduler_metadata && input.has_descale
      then:
      - title: FA2 refuses scheduler metadata with descales
        source: vllm/vllm_flash_attn/flash_attn_interface.py:335
        fail:
          code: not-implemented-error
          message: FA2 does not support scheduler_metadata, q_descale, k_descale, v_descale
    - if: input.has_sinks
      then:
      - title: FA2 has no sinks
        source: vllm/vllm_flash_attn/flash_attn_interface.py:340
        fail:
          code: not-implemented-error
          message: FA2 does not support s_aux
    - if: input.num_splits > 1
      then:
      - title: FA2 has no split-KV
        source: vllm/vllm_flash_attn/flash_attn_interface.py:342
        fail:
          code: not-implemented-error
          message: FA2 does not support num_splits > 1
    - title: Launch the FA2 varlen kernel
      source: vllm/vllm_flash_attn/flash_attn_interface.py:347
      call: flash-attn-interface.vllm-fa2-varlen-fwd
      input: '= has(input.shape) ? input.shape : {}'
      fill: true
    - return:
        fa_version: 2
        lse: = input.return_lse
  - if: input.fa_version == 3
    then:
    - if: input.has_alibi
      then:
      - title: Alibi is not supported in FA3
        source: vllm/vllm_flash_attn/flash_attn_interface.py:374
        fail:
          code: assertion-error
          message: Alibi is not supported in FA3
    - title: Launch the FA3 kernel (uses the AOT scheduler metadata when given)
      source: vllm/vllm_flash_attn/flash_attn_interface.py:379
      call: flash-attn-interface.vllm-fa3-fwd
      input: '= has(input.shape) ? input.shape : {}'
      fill: true
    - return:
        fa_version: 3
        lse: = input.return_lse
  - if: input.fa_version == 4
    then:
    - if: input.has_alibi
      then:
      - title: Alibi is not supported in FA4
        source: vllm/vllm_flash_attn/flash_attn_interface.py:419
        fail:
          code: assertion-error
          message: Alibi is not supported in FA4
    - title: Launch the FA4 CuTe kernel
      source: vllm/vllm_flash_attn/flash_attn_interface.py:445
      call: flash-attn-interface.flash-attn-cute-fwd
      input: '= has(input.shape) ? input.shape : {}'
      fill: true
    - return:
        fa_version: 4
        lse: = input.return_lse
  - title: Unsupported FA version
    source: vllm/vllm_flash_attn/flash_attn_interface.py:476
    fail:
      code: value-error
      message: '= ''Unsupported FA version: '' + string(input.fa_version)'
