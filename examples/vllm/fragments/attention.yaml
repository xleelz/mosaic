      backend:
        type:
        - string
        - 'null'
      auto:
        type: boolean
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: the selected backend is invalid
  behavior:
  - title: 'MLAPrefillSelectorConfig: the model dtype and its (qk_nope, qk_rope, v) head dims; defaults without a model config'
    source: vllm/v1/attention/backends/mla/prefill/selector.py:65-78
    set:
      vars.dims: '= input.has_model_config ? input.mla_dimensions : [0, 0, 0]'
      vars.dtype: '= input.has_model_config ? input.dtype : ''float32'''
  - if: '!input.is_cpu && input.mla_prefill_backend != '''''
    then:
    - title: 'Explicit AttentionConfig.mla_prefill_backend: load the class'
      source: vllm/v1/attention/backends/mla/prefill/selector.py:92
      call: mla-prefill-backend-enum.get-class
      input:
        name: = input.mla_prefill_backend
      as: cls
      on_error:
      - if: error.code == 'import-error'
        then:
        - title: An ImportError becomes the only reason
          source: vllm/v1/attention/backends/mla/prefill/selector.py:98
          fail:
            code: value-error
            message: '= ''Selected MLA prefill backend '' + input.mla_prefill_backend + '' is not valid for this configuration. Reason: [ImportError]'''
        else:
        - fail: '= {''code'': error.code, ''status'': error.status, ''message'': error.message}'
      fill: true
    - title: Validate it on this device
      source: vllm/v1/attention/backends/mla/prefill/selector.py:94
      call: mla-prefill-backend.validate-configuration
      input:
        backend_cls: = vars.cls.value.cls
        has_device_capability: true
        device_capability: = input.device_capability
        dtype: = vars.dtype
        mla_dimensions: = vars.dims
      as: v
      fill: true
    - if: size(vars.v.value.invalid_reasons) > 0
      then:
      - title: The selected backend is invalid
        source: vllm/v1/attention/backends/mla/prefill/selector.py:99
        fail:
          code: value-error
          message: '= ''Selected MLA prefill backend '' + input.mla_prefill_backend + '' is not valid for this configuration. Reason: '' + vars.v.value.invalid_reasons.join('', '')'
    - return:
        backend: = vars.cls.value.class_name
        auto: false
  - if: input.is_cpu
    then:
    - title: 'CPU: current_platform is CpuPlatform, so its priority list (ZEN_CPU, CPU) answers'
      source: vllm/v1/attention/backends/mla/prefill/selector.py:113-132
      call: cpu-platform.get-mla-prefill-backend-cls
      input:
        dtype: = vars.dtype
        mla_dimensions: = vars.dims
      as: auto
      fill: true
    else:
    - title: 'Nothing selected: the platform''s priority list (functools.cache per selector config)'
      source: vllm/v1/attention/backends/mla/prefill/selector.py:113-132
      call: cuda-platform.get-mla-prefill-backend-cls
      input:
        dtype: = vars.dtype
        mla_dimensions: = vars.dims
      as: auto
  - return:
      backend: '= has(vars.auto.value.backend) ? vars.auto.value.backend : null'
      auto: true
