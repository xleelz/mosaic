- component: aiter-mla-impl
  name: forward-mqa
  kind: function
  summary: 'AiterMLAImpl.forward_mqa: decode on Gluon (the builder''s use_gluon_decode / use_gluon_verify), on segmented MLA for DCP verify, or on the padded asm decode (cprr under DCP).'
  sources:
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2244-2491
  - vllm/v1/attention/backends/mla/rocm_aiter_mla.py:1732-1736
  request:
    type: object
    properties:
      has_decode:
        type: boolean
        default: true
      cache_numel:
        type: integer
        default: 1
      use_gluon_decode:
        type: boolean
        default: false
      use_gluon_verify:
        type: boolean
        default: false
      dcp_route:
        type: string
        default: plain
        enum:
        - plain
        - segmented
        - cprr
      num_heads:
        type: integer
        default: 16
      num_reqs:
        type: integer
        default: 2
      qlen:
        type: integer
        default: 1
      num_tokens:
        type: integer
        default: 2
      dcp_world_size:
        type: integer
        default: 1
  response:
    type: object
    properties:
      path:
        type: string
      heads:
        type: integer
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: no decode metadata
  - code: value-error
    status: 0
    retryable: false
    summary: bad verify block
  behavior:
  - if: '!input.has_decode || input.cache_numel == 0'
    then:
    - title: forward_mqa needs decode metadata and a cache
      source: vllm/v1/attention/backends/mla/rocm_aiter_mla.py:2251-2252
      fail:
        code: assertion-error
        message: no decode metadata or empty cache
