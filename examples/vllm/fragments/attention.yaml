      vars.npre: 0
      vars.sched: false
  - if: vars.i.dcp_world_size > 1
    then:
    - title: 'DCP: per-rank context lengths and the decode/extend split'
      source: vllm/v1/attention/backends/flash_attn.py:872-916
      set:
        vars.ndec: '= vars.i.common.max_query_len <= 1 ? vars.i.common.num_reqs : (!vars.i.common.has_cpu_seq_lens_upper_bound ? 0 : vars.i.common.query_lens.filter(q, q <= vars.i.common.decode_query_threshold).size())'
        vars.npre: '= vars.i.common.max_query_len <= 1 ? 0 : (!vars.i.common.has_cpu_seq_lens_upper_bound ? vars.i.common.num_reqs : vars.i.common.query_lens.filter(q, q > vars.i.common.decode_query_threshold).size())'
    - if: vars.i.common.has_cpu_seq_lens_upper_bound && sum(vars.i.common.seq_lens) == sum(vars.i.common.query_lens)
