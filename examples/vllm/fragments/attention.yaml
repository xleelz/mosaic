          source: vllm/v1/attention/backends/mla/indexer.py:299-301
          set:
            vars.kpool: = int(input.kv_cache_spec.tokens_per_state)
        else:
        - title: 'Without one (platform block-size selection): hf_text_config.index_kpool of the current config'
          source: vllm/v1/attention/backends/mla/indexer.py:304-305
          set:
            vars.kpool: = input.index_kpool
      - title: 'index_kpool times each DeepGEMM paged-MQA page size: (32, 64), only 64 on SM120 (the same on ROCm)'
        source: vllm/utils/deep_gemm.py:33-36
        return:
          name: DEEPSEEK_V32_INDEXER
          builder: DeepseekV32IndexerMetadataBuilder
          impl: ''
          kernel_block_sizes: '= (input.device_capability_family == 120 ? [64] : [32, 64]).map(n, vars.kpool * n)'
          layouts: null
    - title: 'DeepseekV32IndexerBackend: [1, MultipleOf(16)] on ROCm, else [64]'
      source: vllm/v1/attention/backends/mla/indexer.py:284-285
      return:
        name: DEEPSEEK_V32_INDEXER
        builder: DeepseekV32IndexerMetadataBuilder
        impl: ''
        kernel_block_sizes: '= input.is_rocm ? [dyn(1), dyn(''MultipleOf(16)'')] : [dyn(64)]'
        layouts: null
  - if: '!(input.backend in {''FLASH_ATTN'': {''name'': ''FLASH_ATTN'', ''builder'': ''FlashAttentionMetadataBuilder'', ''impl'': ''FlashAttentionImpl'', ''kernel_block_sizes'': [''MultipleOf(16)''], ''layouts'':
      null}, ''TRITON_ATTN'': {''name'': ''TRITON_ATTN'', ''builder'': ''TritonAttentionMetadataBuilder'', ''impl'': ''TritonAttentionImpl'', ''kernel_block_sizes'': [''MultipleOf(16)''], ''layouts'': null},
      ''FLASHINFER_MLA_SPARSE'': {''name'': ''FLASHINFER_MLA_SPARSE'', ''builder'': ''FlashInferMLASparseTRTLLMMetadataBuilder'', ''impl'': ''FlashInferMLASparseImpl'', ''kernel_block_sizes'': [''MultipleOf(32)''],
      ''layouts'': null}, ''FLASHMLA_SPARSE'': {''name'': ''FLASHMLA_SPARSE'', ''builder'': ''FlashMLASparseMetadataBuilder'', ''impl'': ''FlashMLASparseImpl'', ''kernel_block_sizes'': [''MultipleOf(64)''],
      ''layouts'': null}, ''ROCM_AITER_MLA_SPARSE'': {''name'': ''ROCM_AITER_MLA_SPARSE'', ''builder'': ''ROCMAiterMLASparseMetadataBuilder'', ''impl'': ''ROCMAiterMLASparseImpl'', ''kernel_block_sizes'':
      [1, ''MultipleOf(16)''], ''layouts'': [''LBNHC'', ''LBHNC'', ''BLHNC'']}})'
    then:
    - title: Not a described backend class
      source: vllm/v1/attention/backend.py:59
      fail:
        code: key-error
        message: = "'" + input.backend + "'"
  - title: 'The class''s static descriptors: get_name, get_builder_cls, get_impl_cls, kernel block sizes (ints, or MultipleOf(n): any multiple of n), supported KV layouts'
    source: vllm/v1/attention/backends/flash_attn.py:380-381
    set:
      vars.r: '= {''FLASH_ATTN'': {''name'': ''FLASH_ATTN'', ''builder'': ''FlashAttentionMetadataBuilder'', ''impl'': ''FlashAttentionImpl'', ''kernel_block_sizes'': [''MultipleOf(16)''], ''layouts'':
        null}, ''TRITON_ATTN'': {''name'': ''TRITON_ATTN'', ''builder'': ''TritonAttentionMetadataBuilder'', ''impl'': ''TritonAttentionImpl'', ''kernel_block_sizes'': [''MultipleOf(16)''], ''layouts'':
        null}, ''FLASHINFER_MLA_SPARSE'': {''name'': ''FLASHINFER_MLA_SPARSE'', ''builder'': ''FlashInferMLASparseTRTLLMMetadataBuilder'', ''impl'': ''FlashInferMLASparseImpl'', ''kernel_block_sizes'':
        [''MultipleOf(32)''], ''layouts'': null}, ''FLASHMLA_SPARSE'': {''name'': ''FLASHMLA_SPARSE'', ''builder'': ''FlashMLASparseMetadataBuilder'', ''impl'': ''FlashMLASparseImpl'', ''kernel_block_sizes'':
        [''MultipleOf(64)''], ''layouts'': null}, ''ROCM_AITER_MLA_SPARSE'': {''name'': ''ROCM_AITER_MLA_SPARSE'', ''builder'': ''ROCMAiterMLASparseMetadataBuilder'', ''impl'': ''ROCMAiterMLASparseImpl'',
        ''kernel_block_sizes'': [1, ''MultipleOf(16)''], ''layouts'': [''LBNHC'', ''LBHNC'', ''BLHNC'']}}[input.backend]'
  - return:
