    else:
    - title: underlying_attn_backend.get_builder_cls()
      source: vllm/model_executor/layers/attention/chunked_local_attention.py:36
      set:
        vars.ub: '= {''FlashAttentionBackend'': ''FlashAttentionMetadataBuilder'', ''TritonAttentionBackend'': ''TritonAttentionMetadataBuilder'', ''FlashInferBackend'': ''FlashInferMetadataBuilder'', ''FlexAttentionBackend'':
          ''FlexAttentionMetadataBuilder''}[vars.cls]'
  - title: 'subclass_attention_backend: type(prefix + backend name, (backend,), {''get_builder_cls'': lambda: ChunkedLocalAttentionBuilder})'
    source: vllm/model_executor/layers/attention/chunked_local_attention.py:71-77
    return:
      name: = 'ChunkedLocalAttention_' + string(input.attention_chunk_size) + '_' + vars.cls
      base: = vars.cls
      builder_cls: ChunkedLocalAttentionBuilder
      builder_base: = vars.ub
      attention_chunk_size: = input.attention_chunk_size
      cudagraph_support: NEVER
