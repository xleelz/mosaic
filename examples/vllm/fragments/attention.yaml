    status: 0
    retryable: false
    summary: builder not modeled
  behavior:
  - if: input.backend != 'FLASH_ATTN'
    then:
    - title: Other builders aren't simulated here
      source: vllm/v1/attention/backend.py:717-726
      fail:
        code: not-implemented-error
        message: = 'build of ' + input.backend + ' is not modeled'
  - title: self.build(common_prefix_len=0, common_attn_metadata)
    source: vllm/v1/attention/backend.py:724-726
    call: flash-attention-metadata-builder.build
    input:
      common: = input.common
      fast_build: false
