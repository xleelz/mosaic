- component: flashinfer-mla-sparse-sm90-state
  name: plan
  kind: function
  summary: '_SM90State.plan: plan per-row KV lengths. Exact lengths are planned every call; upper bounds (device batch layout) reuse the last plan while it still bounds every row within the slack, and each
    call clamps the work items'' KV ends on device.'
  sources:
  - vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:303-341
  - vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:343-395
  - vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:397-412
  request:
    type: object
    properties:
      num_tokens:
        type: integer
        default: 4
      kv_lens:
        type: array
        items:
          type: integer
        default:
        - 8
        - 5
        - 3
        - 1
      has_device_layout:
        type: boolean
        default: true
      capturing:
        type: boolean
        default: false
      plan_slack:
        type: integer
        default: 32
      max_valid:
        type: integer
        default: 2048
  response:
    type: object
    properties:
      num_tokens:
        type: integer
      planned_lens: &id025
        type: array
        items:
          type: integer
      replanned:
        type: boolean
  errors:
  - code: runtime-error
    status: 0
    retryable: false
    summary: inside CUDA graph capture
  behavior:
  - if: input.capturing
    then:
    - title: Planning inside CUDA graph capture is refused
      source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:323
      fail:
        code: runtime-error
        message: FlashInferMLASparseSM90 plan() called inside CUDA graph capture; lengths must be planned host-side before capture.
  - if: '!input.has_device_layout'
    then:
    - title: 'Exact lengths: plan them as given, every call'
      source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:329-331
      set:
        state.planned_num_tokens: -1
        state.planned_lens: = input.kv_lens
    - return:
        num_tokens: = input.num_tokens
        planned_lens: = input.kv_lens
        replanned: true
        clamped: false
  - set:
      vars.prev: = state.planned_lens
  - title: '_PLAN_SLACK: planned bounds may exceed the real lengths by up to 32'
    source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:87
    set:
      vars.slack: = input.plan_slack
  - if: input.num_tokens != state.planned_num_tokens || size(vars.prev) != size(input.kv_lens) || lists.range(size(input.kv_lens)).exists(i, vars.prev[i] < input.kv_lens[i] || vars.prev[i] > input.kv_lens[i]
      + input.plan_slack)
    then:
    - title: 'Upper bounds no longer fit the plan: replan with the bounds + slack, clamped to max_valid'
      source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:343-395
      set:
        vars.lens: = input.kv_lens.map(k, math.least(k + input.plan_slack, input.max_valid))
        vars.re: true
    - set:
        state.planned_num_tokens: = input.num_tokens
        state.planned_lens: = vars.lens
    else:
    - title: 'The plan still bounds every row: reuse it'
      source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:333
      set:
        vars.lens: = vars.prev
        vars.re: false
  - title: '_clamp_work_kv_end: each work item''s KV end clamped on device to the exact count'
    source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse_sm90.py:402
    call: flashinfer-mla-sparse-sm90-state.clamp-work-kv-end
    input:
      num_tokens: = input.num_tokens
    fill: true
  - return:
      num_tokens: = input.num_tokens
      planned_lens: = vars.lens
      replanned: = vars.re
      clamped: true
