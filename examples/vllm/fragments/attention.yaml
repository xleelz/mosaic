- component: aiter-mla-helper
  name: use-gluon-decode
  kind: function
  summary: 'AiterMLAHelper.use_gluon_decode: a small-head single-token decode uses the Gluon kernel on gfx950 unless the cache is quantized, the mode forces asm, the head count doesn''t divide 16 (auto),
    or the cache passes 2 GiB.'
  sources:
