- component: mla-prefill-backend
  name: is-available
  kind: function
  summary: 'MLAPrefillBackend.is_available per backend class: AITER asks rocm_aiter_ops.is_enabled(); the others probe their package.'
  sources:
  - vllm/v1/attention/backends/mla/prefill/aiter_flash_attn.py:46-49
  - vllm/v1/attention/backends/mla/prefill/base.py:70-71
