        else:
        - title: The builder class's _cudagraph_support; a builder that sets none inherits NEVER
          source: vllm/v1/attention/backend.py:623-629
          set:
            vars.s: '= input.backend in state.cg_support ? state.cg_support[input.backend] : ''NEVER'''
  - title: 'AttentionCGSupport levels: ALWAYS 3 > UNIFORM_BATCH 2 > UNIFORM_SINGLE_TOKEN_DECODE 1 > NEVER 0'
    source: vllm/v1/attention/backend.py:554-566
    return:
