    - return:
        path: encoder
        num_tokens: = vars.i.num_tokens
        fa_version: = vars.fa.value.fa_version
  - if: vars.i.dcp_world_size > 1
    then:
    - title: 'Decode context parallel: context attention per rank, LSE combine, then merge with the new tokens'' attention'
      source: vllm/v1/attention/backends/flash_attn.py:1293
      call: flash-attention-impl.forward-with-dcp
      input: = vars.i
      as: dcp
      fill: true
    - return:
        path: dcp
        num_tokens: = vars.i.num_tokens
        via: '= has(vars.dcp.value.via) ? vars.dcp.value.via : ''none'''
  - set:
      vars.qkv: = (vars.i.kv_cache_dtype.startsWith('fp8') || vars.i.kv_cache_dtype.endsWith('per_token_head') || vars.i.kv_cache_dtype.startsWith('nvfp4') || vars.i.kv_cache_dtype.startsWith('turboquant_')
        || vars.i.kv_cache_dtype == 'ultraquant_4bit')
  - if: vars.qkv
    then:
    - title: 'Quantized KV: the cache is viewed as the platform''s fp8 dtype (the attention layer already quantized the queries)'
      source: vllm/v1/attention/backends/flash_attn.py:1271-1274
  - title: k/v descales are the layer's _k_scale/_v_scale expanded to (num_seqs, num_kv_heads); q_descale only when the impl takes quantized queries (not FA4's SM90 fp8-KV dequant path)
    source: vllm/v1/attention/backends/flash_attn.py:1283-1291
    set:
      vars.q_descale: = !(vars.i.fa_version == 4 && vars.i.device_capability_major == 9 && vars.i.kv_cache_dtype in ['fp8', 'fp8_e4m3'])
  - if: vars.i.metadata.causal_is_tensor && vars.i.fa_version != 4
    then:
    - title: Per-sequence causal needs FA4
      source: vllm/v1/attention/backends/flash_attn.py:1379
      fail:
        code: not-implemented-error
        message: '= ''Per-sequence causal requires FA4. Current version: FA'' + string(vars.i.fa_version)'
  - title: Paged varlen FlashAttention over the KV cache (through the FA4 dense-kernel wrapper, which forwards to flash_attn_varlen_func)
    source: vllm/v1/attention/backends/flash_attn.py:1399
    call: flash-attn-interface.flash-attn-varlen-func
    input:
      shape: = vars.shape
      fa_version: = vars.i.fa_version
      paged: true
      causal: = vars.i.metadata.causal
      has_scheduler_metadata: = vars.i.metadata.has_scheduler_metadata
      has_descale: true
      num_splits: = vars.i.metadata.max_num_splits
      has_alibi: = vars.i.has_alibi
      has_sinks: = vars.i.has_sinks
    as: fa
    fill: true
  - return:
      path: paged
      num_tokens: = vars.i.num_tokens
      fa_version: = vars.fa.value.fa_version
      kv_cache_dtype: = vars.i.kv_cache_dtype
      kv_cache_view: '= vars.qkv ? ''fp8'' : ''model'''
      q_descale: = vars.q_descale
- component: flash-attention-impl
  name: forward-with-dcp
  kind: function
  summary: 'FlashAttentionImpl._forward_with_dcp: decode-context-parallel attention (query all-gather, per-shard context attention, LSE combine, merge).'
  sources:
  - vllm/v1/attention/backends/flash_attn.py:1463-1637
  request: AttnForwardRequest
  behavior:
  - if: input.metadata.max_dcp_context_kv_len == 0
    then:
    - title: 'No context on any rank: plain varlen over the new tokens'
      source: vllm/v1/attention/backends/flash_attn.py:1485
      call: flash-attn-interface.flash-attn-varlen-func
      input:
        shape: &id023
          num_tokens: = input.num_tokens
          num_heads: = input.num_heads
          num_kv_heads: = input.num_kv_heads
          head_size: = input.head_size
          num_seqs: '= has(input.metadata) && input.metadata != null && has(input.metadata.num_reqs) ? input.metadata.num_reqs : 1'
          kv_tokens: '= has(input.metadata) && input.metadata != null && has(input.metadata.seq_lens) ? sum(input.metadata.seq_lens) : input.num_tokens'
          max_query_len: '= has(input.metadata) && input.metadata != null && has(input.metadata.max_query_len) ? input.metadata.max_query_len : input.num_tokens'
        fa_version: = input.fa_version
        paged: false
        causal: = input.metadata.causal
        return_lse: true
      fill: true
    - return:
        path: dcp-no-context
        via: none
  - title: All-gather the query heads across the DCP group
    source: vllm/v1/attention/backends/flash_attn.py:1511
    call: group-coordinator.all-gather
    input:
      num_tokens: = input.num_tokens
      world_size: = input.dcp_world_size
      group_name: dcp:0
      ranks: = lists.range(input.dcp_world_size).map(r, 'rank' + string(r))
      dim: 1
    fill: true
  - title: Context attention over this rank's KV shard (non-causal), returning LSE
    source: vllm/v1/attention/backends/flash_attn.py:1576
    call: flash-attn-interface.flash-attn-varlen-func
    input:
      shape: *id023
      fa_version: = input.fa_version
      paged: true
      causal: false
      return_lse: true
      has_scheduler_metadata: = input.metadata.has_scheduler_metadata
    fill: true
  - if: config['dcp-comm-backend'] == 'a2a'
    then:
    - title: dcp_combine = dcp_a2a_lse_reduce (dcp_comm_backend a2a)
      source: vllm/v1/attention/backends/flash_attn.py:1167
      call: dcp.dcp-a2a-lse-reduce
      input:
        world_size: = input.dcp_world_size
        num_heads: = input.num_heads * input.dcp_world_size
        shape: *id023
      as: comb
      fill: true
    else:
    - title: dcp_combine = cp_lse_ag_out_rs (default ag_rs)
      source: vllm/v1/attention/backends/flash_attn.py:1600
      call: dcp.cp-lse-ag-out-rs
      input:
        world_size: = input.dcp_world_size
        shape: *id023
      as: comb
      fill: true
  - title: Causal attention of the new tokens over themselves, returning LSE
    source: vllm/v1/attention/backends/flash_attn.py:1608
    call: flash-attn-interface.flash-attn-varlen-func
    input:
      shape: *id023
      fa_version: = input.fa_version
      paged: false
      causal: true
      return_lse: true
    fill: true
  - title: Merge context and query partial outputs by LSE
    source: vllm/v1/attention/backends/flash_attn.py:1631
    call: merge-attn-states.merge-attn-states
    input:
      platform: cuda
      dtype: bfloat16
      output_dtype: bfloat16
      head_size: = input.head_size
      num_tokens: = input.num_tokens
      num_heads: = input.num_heads
    fill: true
  - return:
      path: dcp
      via: = vars.comb.value.via
- component: flash-attention-impl
  name: do-kv-cache-update
  kind: function
  summary: 'FlashAttentionImpl.do_kv_cache_update: write this step''s K/V into the KV cache blocks the scheduler assigned (via slot_mapping).'
  sources:
  - vllm/v1/attention/backends/flash_attn.py:1427-1461
  request: AttnKvUpdateRequest
  response:
    type: object
    properties:
      written_tokens:
        type: integer
      kv_cache_dtype:
        type: string
      cache_bytes_per_element:
        type: integer
      scaled:
        type: boolean
  behavior:
  - title: Arguments not passed by the caller take their usual values (a one-request decode step)
    set:
      vars.i: '= merge({''attn_type'': ''decoder'', ''num_tokens'': (has(input.num_tokens) ? input.num_tokens : 1), ''num_kv_heads'': 8, ''head_size'': 128, ''kv_cache_dtype'': config[''kv-cache-dtype''],
        ''kv_quant_mode'': (config[''kv-cache-dtype''] == ''int4_per_token_head'' ? ''int4_per_token_head'' : (config[''kv-cache-dtype''] == ''int8_per_token_head'' ? ''int8_per_token_head'' : (config[''kv-cache-dtype'']
        == ''fp8_per_token_head'' ? ''fp8_per_token_head'' : (config[''kv-cache-dtype''] == ''nvfp4_ds_mla'' ? ''nvfp4_ds_mla'' : (config[''kv-cache-dtype''].startsWith(''nvfp4'') ? ''nvfp4'' : (config[''kv-cache-dtype''].startsWith(''turboquant_'')
        ? config[''kv-cache-dtype''] : (config[''kv-cache-dtype''] == ''ultraquant_4bit'' ? ''ultraquant_4bit'' : (config[''kv-cache-dtype''].startsWith(''fp8'') ? ''fp8_per_tensor'' : ''none'')))))))),
        ''slot_mapping'': lists.range((has(input.num_tokens) ? input.num_tokens : 1)), ''device_capability_major'': 9}, input)'
  - if: vars.i.attn_type == 'encoder_only' || vars.i.attn_type == 'encoder'
    then:
    - title: Encoder attention keeps no KV cache
      source: vllm/v1/attention/backends/flash_attn.py:1435
      return:
        written_tokens: 0
  - title: 'The op is given the impl''s kv_cache_dtype (CacheConfig.cache_dtype) and the layer''s _k_scale/_v_scale: an fp8 cache stores each K/V element as one scaled fp8 byte, otherwise in the model dtype'
    source: vllm/v1/attention/backends/flash_attn.py:1458-1460
    set:
      vars.fp8: = vars.i.kv_cache_dtype.startsWith('fp8')
  - title: Scatter the new K/V into the paged cache at slot_mapping (reshape_and_cache_flash; padded slots are skipped by the op)
    source: vllm/v1/attention/backends/flash_attn.py:1452
    call: custom-ops.reshape-and-cache-flash
    input:
      num_tokens: = size(vars.i.slot_mapping)
      hidden_size: = 2 * vars.i.num_kv_heads * vars.i.head_size
      dtype_bytes: 2
    fill: true
  - return:
      written_tokens: = vars.i.slot_mapping.filter(s, s >= 0).size()
      kv_cache_dtype: = vars.i.kv_cache_dtype
      cache_bytes_per_element: '= vars.fp8 ? 1 : 2'
      scaled: = vars.fp8
