  summary: 'FlashAttentionMetadataBuilder.build: turn the runner''s CommonAttentionMetadata into FlashAttentionMetadata; the block table passes through from the SchedulerOutput.'
  sources:
  - vllm/v1/attention/backends/flash_attn.py:809-1017
