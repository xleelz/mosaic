  - interface: selector.get-mamba-attn-backend
    caller: gpu-worker
    input:
      mamba_type: GDN_ATTN
    as: gdn
  - interface: attention-backend-utils.mamba-get-block-table-tensor
    caller: gpu-worker
    input:
      block_table:
      - - 4
      - - 9
      seq_lens:
      - 40
      - 7
    as: none
  - interface: attention-backend-utils.mamba-get-block-table-tensor
    caller: gpu-worker
    input:
      block_table:
      - - 1
        - 2
        - 3
        - 4
      - - 5
        - 6
        - 7
        - 8
