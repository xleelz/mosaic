    status: 0
    retryable: false
    summary: block stride not a whole number of rows
  behavior:
  - title: The [B, 1, N, C] cache is squeezed to [B, N, C]; the flat layouts are FLASHINFER_MLA_SPARSE and FLASHMLA_SPARSE without a ds_mla dtype
    source: vllm/model_executor/layers/attention/mla_attention.py:752-757
