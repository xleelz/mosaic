- id: attention-r6-wrapper-other-builders-and-refusals
  name: 'The wrapper backends over Triton and an untabulated backend: ChunkedLocalAttention_4096_TritonAttentionBackend extends TritonAttentionMetadataBuilder and still splits the batch; supports_block_size
    of an unknown backend is a KeyError; align mode needs a MambaSpec'
