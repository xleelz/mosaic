- component: mla-attention
  name: get-kv-cache-spec
  kind: function
  summary: 'MLAAttention.get_kv_cache_spec: an MLA spec with one latent head (head_size 576 for DeepSeek), the layer''s cache dtype string, its KVQuantMode, and the ds_mla page sizes.'
  sources:
  - vllm/model_executor/layers/attention/mla_attention.py:1350-1379
  request:
    type: object
    properties:
      kv_cache_dtype:
        type: string
        default: auto
      head_size:
        type: integer
        default: 576
      model_dtype_bytes:
        type: integer
        default: 2
      sliding_window:
        type: integer
        default: 0
      has_indexer:
        type: boolean
        default: false
      non_causal_multi_token_decode:
        type: boolean
        default: false
  response:
    type: object
    properties:
      cache_dtype_str:
        type: string
      kv_quant_mode:
        type: string
      page_size_bytes:
        type: integer
  behavior:
  - title: Arguments the caller leaves out take the function's defaults (no sliding window, no indexer; no declared backend layouts; no layout resolved yet)
    set:
      vars.i: '= merge({''kv_cache_dtype'': config[''kv-cache-dtype''], ''head_size'': 576, ''model_dtype_bytes'': 2, ''sliding_window'': 0, ''has_indexer'': false, ''non_causal_multi_token_decode'': false},
        input)'
  - title: 'kv_cache_dtype_str_to_dtype: ''auto'' is the model dtype; fp8, ds_mla, nvfp4 and per-token-head caches are stored as uint8'
    source: vllm/utils/torch_utils.py:533-539
    set:
      vars.dt: '= vars.i.kv_cache_dtype == ''auto'' ? vars.i.model_dtype_bytes : (vars.i.kv_cache_dtype in [''bfloat16'', ''float16'', ''half''] ? 2 : (vars.i.kv_cache_dtype in [''float'', ''float32'']
        ? 4 : 1))'
  - title: get_kv_quant_mode of the layer's cache dtype
    source: vllm/model_executor/layers/attention/mla_attention.py:1361
    call: kv-quant-mode.get-kv-quant-mode
    input:
      kv_cache_dtype: = vars.i.kv_cache_dtype
    as: q
    fill: true
  - title: 'ds_mla layouts pack NoPE + RoPE + scales into one opaque blob per token: 656 B (fp8) or 352 B (nvfp4)'
    source: vllm/model_executor/layers/attention/mla_attention.py:1365
    set:
      vars.blob: '= vars.i.kv_cache_dtype == ''fp8_ds_mla'' ? dyn(656) : (vars.i.kv_cache_dtype == ''nvfp4_ds_mla'' ? dyn(352) : dyn(null))'
      vars.cls: '= vars.i.sliding_window > 0 ? ''sliding_window_mla'' : ''mla_attention'''
  - title: One latent KV head, never sharded across TP; a SlidingWindowMLASpec when the layer has a window, else an MLAAttentionSpec
    source: vllm/model_executor/layers/attention/mla_attention.py:1369-1379
    set:
      vars.content: '= vars.blob != null ? vars.blob : vars.i.head_size * vars.dt'
  - title: 'AttentionSpec.page_size_bytes for that spec: 1 head slot x block_size states x the packed blob (ds_mla) or head_size latent bytes (MLA has no separate V)'
    source: vllm/v1/kv_cache_interface.py:552-553
    set:
      vars.page: = int(config['block-size']) * vars.content
  - return:
      spec_class: = vars.cls
      block_size: = int(config['block-size'])
      num_kv_heads: 1
      max_tp_shards: 1
      head_size: = vars.i.head_size
      cache_dtype_str: = vars.i.kv_cache_dtype
      kv_quant_mode: = vars.q.value.kv_quant_mode
      page_size_bytes: = vars.page
      sliding_window: '= vars.i.sliding_window > 0 ? dyn(vars.i.sliding_window) : dyn(null)'
      is_index_group_leader: = vars.cls == 'mla_attention' && vars.i.has_indexer
      non_causal_multi_token_decode: = vars.cls == 'mla_attention' && vars.i.non_causal_multi_token_decode
