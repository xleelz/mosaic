- component: selector
  name: get-attn-backend
  kind: function
  summary: 'get_attn_backend: validate the KV cache dtype, build the AttentionSelectorConfig from VllmConfig and ask the platform for the backend class (functools.cache memoizes per config).'
  sources:
  - vllm/v1/attention/selector.py:105-200
  - vllm/v1/attention/selector.py:204-225
  - vllm/v1/attention/selector.py:21-61
  request: AttnSelectorRequest
  response: AttnBackendSelection
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: kv_cache_dtype is not a CacheDType
  - code: value-error
    status: 0
    retryable: false
    summary: the platform returned no backend class
  behavior:
  - if: input.kv_cache_dtype != null && !(input.kv_cache_dtype in ['auto', 'float16', 'bfloat16', 'fp8', 'fp8_e4m3', 'fp8_e5m2', 'fp8_inc', 'fp8_ds_mla', 'nvfp4_ds_mla', 'turboquant_k8v4', 'turboquant_4bit_nc',
      'turboquant_k3v4_nc', 'turboquant_3bit_nc', 'ultraquant_4bit', 'int4_per_token_head', 'int8_per_token_head', 'fp8_per_token_head', 'nvfp4', 'nvfp4_4over6'])
    then:
    - title: Invalid kv_cache_dtype
      source: vllm/v1/attention/selector.py:121
      fail:
        code: assertion-error
        message: '= ''Invalid kv_cache_dtype: '' + input.kv_cache_dtype'
  - title: Build the AttentionSelectorConfig
    detail: block_size is passed only when the user set it (the fixtures don't, so None); use_dcp reads decode_context_parallel_size.
    source: vllm/v1/attention/selector.py:155-176
    set:
      vars.backend: '= ''attention-backend'' in config ? config[''attention-backend''] : null'
      vars.use_dcp: = config['decode-context-parallel-size'] > 1
  - title: A per-KV-group override (AttentionConfig.backend_per_kind, keyed by the layer's KVCacheSpecKind) takes precedence over the global backend
    source: vllm/v1/attention/selector.py:183-189
    if: '''attention-backend-per-kind'' in config && size(config[''attention-backend-per-kind'']) > 0'
    then:
    - call: selector.get-attn-spec-kind
      input:
        use_mla: = input.use_mla
        has_sliding_window: = input.has_sliding_window
        attn_type: = input.attn_type
      as: kind
      fill: true
    - title: Kinds not in the map fall back to the global backend
      source: vllm/v1/attention/selector.py:189
      set:
        vars.backend: '= vars.kind.value.kind in config[''attention-backend-per-kind''] ? dyn(config[''attention-backend-per-kind''][vars.kind.value.kind]) : dyn(vars.backend)'
  - set:
      vars.key: '= ''h'' + string(input.head_size) + ''_'' + input.dtype + ''_'' + (input.kv_cache_dtype == null ? ''none'' : input.kv_cache_dtype) + (input.use_mla ? ''_mla'' : '''') + (input.use_sparse
        ? ''_sparse'' : '''') + (input.has_sink ? ''_sink'' : '''') + (input.use_mm_prefix ? ''_mm'' : '''') + (input.has_sliding_window ? ''_sw'' : '''') + ''_'' + input.attn_type + ''_n'' + string(input.num_heads)
        + ''_b'' + (vars.backend == null ? ''auto'' : vars.backend) + (vars.use_dcp ? ''_dcp'' : '''') + ''_run'' + config[''kv-cache-dtype'']'
  - if: vars.key in state.cached_backends
    then:
    - title: 'functools.cache hit: the platform is not consulted again'
      source: vllm/v1/attention/selector.py:203-204
      return:
        backend_cls_path: = state.cached_backends[vars.key]
        cached: true
  - title: Ask the platform for the backend class
    source: vllm/v1/attention/selector.py:215
    call: cuda-platform.get-attn-backend-cls
    input:
      selected_backend: = vars.backend
      num_heads: = input.num_heads
      attn_selector_config:
        head_size: = input.head_size
        dtype: = input.dtype
        kv_cache_dtype: = input.kv_cache_dtype
        block_size: null
        use_mla: = input.use_mla
        has_sink: = input.has_sink
        use_sparse: = input.use_sparse
        attn_type: = input.attn_type
        has_sliding_window: = input.has_sliding_window
        use_dcp: = vars.use_dcp
    as: cls
  - if: '!has(vars.cls.value.backend_cls_path) || vars.cls.value.backend_cls_path == '''''
    then:
    - title: No backend class for this platform
      source: vllm/v1/attention/selector.py:222
      fail:
        code: value-error
        message: Invalid attention backend for cuda
  - title: Memoize and resolve the class by qualname
    source: vllm/v1/attention/selector.py:224
    set:
      = 'state.cached_backends.' + vars.key: = vars.cls.value.backend_cls_path
  - return:
      backend_cls_path: = vars.cls.value.backend_cls_path
      cached: false
- component: attention-backend
  name: validate-configuration
  kind: function
  summary: 'AttentionBackend.validate_configuration: the list of reasons a backend can''t serve this layer (empty means valid); the platform calls it per candidate.'
  sources:
  - vllm/v1/attention/backend.py:276-366
  - vllm/v1/attention/backends/flash_attn.py:457-509
  request: AttnValidateRequest
  response: AttnInvalidReasons
  errors:
  - code: key-error
    status: 0
    retryable: false
    summary: no such backend
  behavior:
  - if: '!(input.backend in state.backends)'
    then:
    - title: Unknown backend name
      detail: AttentionBackendEnum has no such member among the modeled backends (the CUDA priority lists).
      source: vllm/v1/attention/backends/registry.py:34
      fail:
        code: key-error
        message: = input.backend
  - title: Check each capability of the backend class
    source: vllm/v1/attention/backend.py:276-366
    set:
      vars.reasons: []
  - if: '!(state.backends[input.backend].head_size_rule == ''fa'' ? (input.head_size % 8 == 0 && (input.head_size <= 256 || (input.fa4_supported && input.head_size <= 512))) : (state.backends[input.backend].head_size_rule
      == ''min32'' ? input.head_size >= 32 : (state.backends[input.backend].head_size_rule == ''positive'' ? input.head_size > 0 : (size(state.backends[input.backend].head_sizes) == 0 || input.head_size
      in state.backends[input.backend].head_sizes))))'
    then:
    - title: head_size not supported
      source: vllm/v1/attention/backend.py:300
      set:
        vars.reasons: = vars.reasons + ['head_size not supported']
  - if: '!(input.dtype in state.backends[input.backend].dtypes)'
    then:
    - title: dtype not supported
      source: vllm/v1/attention/backend.py:302
      set:
        vars.reasons: = vars.reasons + ['dtype not supported']
  - if: '!(input.kv_cache_dtype == null ? state.backends[input.backend].kv_none_ok : ((input.kv_cache_dtype in state.backends[input.backend].kv_cache_dtypes || (state.backends[input.backend].kv_prefix !=
      '''' && input.kv_cache_dtype.startsWith(state.backends[input.backend].kv_prefix))) && (state.backends[input.backend].name != ''FLASH_ATTN'' || !(input.kv_cache_dtype.startsWith(''fp8'') || input.kv_cache_dtype.endsWith(''per_token_head'')
      || input.kv_cache_dtype.startsWith(''nvfp4'')) || (input.kv_cache_dtype != ''fp8_e5m2'' && ((input.fa_version == 3 && input.device_capability.major == 9) || (input.fa_version == 4 && input.device_capability.major
      == 10))))))'
    then:
    - title: kv_cache_dtype not supported
      source: vllm/v1/attention/backend.py:304
      set:
        vars.reasons: = vars.reasons + ['kv_cache_dtype not supported']
  - if: input.block_size != null && input.block_size % state.backends[input.backend].block_multiple != 0
    then:
    - title: block_size not supported
      source: vllm/v1/attention/backend.py:306
      set:
        vars.reasons: = vars.reasons + ['block_size not supported']
  - if: input.use_mm_prefix && !(state.backends[input.backend].mm_prefix_rule == 'always' || input.fa4_supported)
    then:
    - title: partial multimodal token full attention not supported
      source: vllm/v1/attention/backend.py:309
      set:
        vars.reasons: = vars.reasons + ['partial multimodal token full attention not supported']
  - if: input.use_mla && !state.backends[input.backend].is_mla
    then:
    - title: MLA not supported
      source: vllm/v1/attention/backend.py:313
      set:
        vars.reasons: = vars.reasons + ['MLA not supported']
  - if: '!input.use_mla && state.backends[input.backend].is_mla'
    then:
    - title: non-MLA not supported
      source: vllm/v1/attention/backend.py:315
      set:
        vars.reasons: = vars.reasons + ['non-MLA not supported']
  - if: input.has_sink && !(state.backends[input.backend].sink_rule == 'always' || (input.fa_version != null && input.fa_version >= 3))
    then:
    - title: attention sinks not supported
      source: vllm/v1/attention/backend.py:317
      set:
        vars.reasons: = vars.reasons + ['attention sinks not supported']
  - if: input.use_sparse && !state.backends[input.backend].is_sparse
    then:
    - title: sparse not supported
      source: vllm/v1/attention/backend.py:320
      set:
        vars.reasons: = vars.reasons + ['sparse not supported']
  - if: input.use_per_head_quant_scales && !(state.backends[input.backend].per_head_quant_rule == 'fa3' && input.fa_version != null && input.fa_version >= 3)
    then:
    - title: per-head quant scales not supported
      source: vllm/v1/attention/backend.py:324
      set:
        vars.reasons: = vars.reasons + ['per-head quant scales not supported']
  - if: (input.device_capability.major * 10 + input.device_capability.minor) < state.backends[input.backend].min_capability || (input.device_capability.major * 10 + input.device_capability.minor) > state.backends[input.backend].max_capability
      || (size(state.backends[input.backend].capability_majors) > 0 && !(input.device_capability.major in state.backends[input.backend].capability_majors))
    then:
    - title: compute capability not supported
      source: vllm/v1/attention/backend.py:326
      set:
        vars.reasons: = vars.reasons + ['compute capability not supported']
  - if: '!(input.attn_type in state.backends[input.backend].attn_types)'
    then:
    - title: attention type not supported
      source: vllm/v1/attention/backend.py:328
      set:
        vars.reasons: = vars.reasons + ['attention type ' + input.attn_type + ' not supported']
  - if: input.has_sliding_window && !state.backends[input.backend].sliding_window
    then:
    - title: sliding window not supported
      source: vllm/v1/attention/backend.py:330
      set:
        vars.reasons: = vars.reasons + ['sliding window not supported']
  - if: input.use_batch_invariant && !state.backends[input.backend].batch_invariance
    then:
    - title: batch invariance not supported
      source: vllm/v1/attention/backend.py:338
      set:
        vars.reasons: = vars.reasons + ['batch invariance not supported']
  - if: input.use_pcp && !state.backends[input.backend].pcp
    then:
    - title: PCP not supported
      source: vllm/v1/attention/backend.py:342
      set:
        vars.reasons: = vars.reasons + ['PCP not supported']
  - if: input.use_dcp && !state.backends[input.backend].dcp
    then:
    - title: DCP not supported
      source: vllm/v1/attention/backend.py:336
      set:
        vars.reasons: = vars.reasons + ['DCP not supported']
  - if: state.backends[input.backend].combination_rule == 'fa' && input.has_sink && (input.device_capability.major * 10 + input.device_capability.minor) < 90
    then:
    - title: 'FlashAttention combination: sinks need SM90+'
      source: vllm/v1/attention/backends/flash_attn.py:470
