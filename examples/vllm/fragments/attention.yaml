        type: string
      is_quantized:
        type: boolean
  errors:
  - code: key-error
    status: 0
    retryable: false
    summary: an unknown turboquant_* preset
  behavior:
  - if: input.kv_cache_dtype.startsWith('turboquant_') && !(input.kv_cache_dtype in ['turboquant_k8v4', 'turboquant_4bit_nc', 'turboquant_k3v4_nc', 'turboquant_3bit_nc'])
    then:
    - title: 'turboquant_* is looked up by name (KVQuantMode[...upper()]): an unknown preset raises KeyError'
      source: vllm/v1/kv_cache_interface.py:107
      fail:
        code: key-error
        message: = "'" + input.kv_cache_dtype.upperAscii() + "'"
  - title: Map the kv_cache_dtype string to a KVQuantMode (nvfp4_ds_mla before the nvfp4 prefix; turboquant_* by name; any other fp8* is per-tensor)
    source: vllm/v1/kv_cache_interface.py:91-112
    set:
      vars.mode: '= (input.kv_cache_dtype == ''int4_per_token_head'' ? ''int4_per_token_head'' : (input.kv_cache_dtype == ''int8_per_token_head'' ? ''int8_per_token_head'' : (input.kv_cache_dtype == ''fp8_per_token_head''
        ? ''fp8_per_token_head'' : (input.kv_cache_dtype == ''nvfp4_ds_mla'' ? ''nvfp4_ds_mla'' : (input.kv_cache_dtype.startsWith(''nvfp4'') ? ''nvfp4'' : (input.kv_cache_dtype.startsWith(''turboquant_'')
        ? input.kv_cache_dtype : (input.kv_cache_dtype == ''ultraquant_4bit'' ? ''ultraquant_4bit'' : (input.kv_cache_dtype.startsWith(''fp8'') ? ''fp8_per_tensor'' : ''none''))))))))'
  - title: The mode's family properties
    source: vllm/v1/kv_cache_interface.py:62-88
    return:
      kv_quant_mode: = vars.mode
      is_quantized: = vars.mode != 'none'
      is_per_token_head: = vars.mode in ['int8_per_token_head', 'fp8_per_token_head', 'int4_per_token_head']
      is_nvfp4: = vars.mode == 'nvfp4'
      is_turboquant: = vars.mode.startsWith('turboquant_')
      is_ultraquant: = vars.mode == 'ultraquant_4bit'
- component: common-attention-metadata
  name: batch-size
  kind: function
  summary: 'CommonAttentionMetadata.batch_size / naive_query_lens / compute_num_computed_tokens: rows, per-row query lengths (query_start_loc differences) and computed tokens (seq_lens - query lengths).'
  sources:
  - vllm/v1/attention/backend.py:476-477
  - vllm/v1/attention/backend.py:479-481
  - vllm/v1/attention/backend.py:486-491
  request:
    type: object
    properties:
      query_start_loc:
        type: array
        items:
          type: integer
        default:
        - 0
        - 3
        - 4
        - 6
      seq_lens:
        type: array
        items:
          type: integer
        default:
        - 10
        - 5
        - 2
      num_actual_tokens:
        type: integer
        default: 6
  response:
    type: object
    properties:
      batch_size:
        type: integer
      query_lens: *id025
      num_computed_tokens: *id025
  errors:
  - code: runtime-error
    status: 0
    retryable: false
    summary: seq_lens and query_start_loc disagree on the batch size
  behavior:
  - title: 'Query lengths: neighbouring query_start_loc entries'
    source: vllm/v1/attention/backend.py:479-481
    set:
      vars.q: = lists.range(size(input.query_start_loc) - 1).map(i, input.query_start_loc[i + 1] - input.query_start_loc[i])
  - set:
      vars.ns: = size(input.seq_lens)
      vars.nq: = size(input.query_start_loc) - 1
  - if: vars.nq != vars.ns && vars.nq != 1 && vars.ns != 1
    then:
    - title: 'seq_lens - query_lens: torch can''t broadcast tensors of different lengths'
      source: vllm/v1/attention/backend.py:490
      fail:
        code: runtime-error
        message: = 'The size of tensor a (' + string(vars.ns) + ') must match the size of tensor b (' + string(vars.nq) + ') at non-singleton dimension 0'
  - title: batch_size is seq_lens.shape[0]; computed tokens are seq_lens - query lengths (a length-1 side broadcasts)
    source: vllm/v1/attention/backend.py:486-491
    return:
      batch_size: = vars.ns
      query_lens: = vars.q
      num_computed_tokens: '= lists.range(math.greatest(vars.ns, vars.nq)).map(i, input.seq_lens[vars.ns == 1 ? 0 : i] - vars.q[vars.nq == 1 ? 0 : i])'
- component: common-attention-metadata
  name: token-to-req-indices
  kind: function
  summary: 'CommonAttentionMetadata.token_to_req_indices: the request index of each of the first num_actual_tokens tokens, from the device query_start_loc (padding tokens map to 0).'
  sources:
  - vllm/v1/attention/backend.py:493-514
  request:
    type: object
    properties:
      query_start_loc:
        type: array
        items:
          type: integer
        default:
