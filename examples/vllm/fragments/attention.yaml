      device_capability_major: 9
    as: fa4_512
  - interface: attention-backend.validate-configuration
    caller: gpu-worker
    input:
      backend: FLASH_ATTN
      kv_cache_dtype: fp8
    as: ok
  - interface: attention-backend.validate-configuration
    caller: gpu-worker
    input:
