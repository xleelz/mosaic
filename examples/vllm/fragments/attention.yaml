- component: gdn-attention-metadata-builder
  name: build
  kind: function
  summary: 'GDNAttentionMetadataBuilder.build: which rows take the speculative path (num_decode_draft_tokens >= 0) and which recurrent-state slots they read.'
  sources:
  - vllm/v1/attention/backends/gdn_attn.py:262-630
  - vllm/v1/attention/backends/gdn_attn.py:47-88
  request:
    type: object
    properties:
      use_spec_decode:
        type: boolean
        default: true
      num_spec:
        type: integer
        default: 3
      num_decode_draft_tokens:
        type:
        - array
        - 'null'
        items:
          type: integer
        default:
        - 0
        - 0
      query_lens:
        type: array
        items:
          type: integer
        default:
        - 1
        - 1
      num_accepted_tokens:
        type: array
        items:
          type: integer
        default:
        - 1
        - 1
      block_table:
        type: array
        items:
          type: array
          items:
            type: integer
        default:
        - - 0
          - 1
          - 2
          - 3
        - - 4
          - 5
          - 6
          - 7
  response:
    type: object
    properties:
      num_spec_decodes:
        type: integer
      num_decodes:
        type: integer
  behavior:
  - if: '!input.use_spec_decode || input.num_decode_draft_tokens == null'
    then:
    - title: 'No speculative config: no spec metadata'
      source: vllm/v1/attention/backends/gdn_attn.py:288
      set:
        vars.spec: 0
    else:
    - title: Every row with num_decode_draft_tokens >= 0 is speculative, zero drafts included
      source: vllm/v1/attention/backends/gdn_attn.py:292-293
      set:
        vars.spec: = input.num_decode_draft_tokens.filter(d, d >= 0).size()
  - if: vars.spec == 0
    then:
    - title: 'Plain path: state at block_table[:, 0]; the accepted-token counts are dropped'
      source: vllm/v1/attention/backends/gdn_attn.py:339
      return:
        num_spec_decodes: 0
        num_decodes: = input.query_lens.filter(q, q == 1).size()
        num_accepted_tokens: null
        spec_state_indices: null
        non_spec_state_indices: = input.block_table.map(r, r[0])
  - set:
      vars.ns: = lists.range(size(input.query_lens)).filter(i, !(i < size(input.num_decode_draft_tokens) && input.num_decode_draft_tokens[i] >= 0))
      vars.sr: = lists.range(size(input.query_lens)).filter(i, i < size(input.num_decode_draft_tokens) && input.num_decode_draft_tokens[i] >= 0)
  - set:
      vars.dec: = vars.ns.filter(i, input.query_lens[i] == 1).size()
      vars.pre: = vars.ns.filter(i, input.query_lens[i] != 1).size()
  - title: 'Decodes and spec decodes are exclusive: non-spec decodes count as prefills'
    source: vllm/v1/attention/backends/gdn_attn.py:375
    when: vars.dec > 0
    set:
      vars.pre: = vars.pre + vars.dec
      vars.dec: 0
  - title: Spec rows read their state from block_table[:, :num_spec + 1] at column num_accepted_tokens - 1
    source: vllm/v1/attention/backends/gdn_attn.py:339-341
    return:
      num_spec_decodes: = vars.spec
      num_decodes: = vars.dec
      num_accepted_tokens: = vars.sr.map(i, input.num_accepted_tokens[i])
      spec_state_indices: = vars.sr.map(i, input.block_table[i].slice(0, input.num_spec + 1))
      non_spec_state_indices: '= vars.pre == 0 ? dyn(null) : dyn(vars.ns.map(i, input.block_table[i][0]))'
