      source: vllm/v1/attention/backends/flash_attn.py:846
      set:
        vars.aot: false
  - title: 'Split count: pinned to flash_attn_max_num_splits_for_cuda_graph when the batch fits a full CUDA graph, else 0 (FA3 heuristics)'
    source: vllm/v1/attention/backends/flash_attn.py:850-860
    set:
      vars.splits: '= vars.i.use_full_cuda_graph && vars.i.fa_version == 3 && vars.i.common.num_actual_tokens <= vars.i.max_cudagraph_size ? config[''flash-attn-max-num-splits-for-cuda-graph''] : 0'
