    fill: true
  - return:
      num_actual_tokens: = vars.b.value.num_actual_tokens
      max_num_splits: = vars.b.value.max_num_splits
- component: attention-metadata-builder
  name: get-varlen-cudagraph-max-query-len
  kind: function
  summary: 'get_varlen_cudagraph_max_query_len: the longest per-request query a FULL graph of the builder can replay (None by default).'
  sources:
  - vllm/v1/attention/backend.py:632-653
  - vllm/v1/attention/backends/flashinfer.py:1084-1105
  - vllm/v1/attention/backends/mla/flashinfer_mla_sparse.py:288-294
  - vllm/v1/attention/backend.py:569-586
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASH_ATTN
      num_speculative_tokens:
        type: integer
        default: 0
      all_specs_trtllm:
        type: boolean
        default: true
      trtllm_gen_varlen:
        type: boolean
        default: true
  response:
    type: object
    properties:
      max_query_len:
        type:
        - integer
        - 'null'
  behavior:
  - if: input.backend == 'FLASHINFER_MLA_SPARSE'
    then:
    - title: 'Sparse FlashInfer MLA decodes on device request boundaries: the widest decode'
      source: vllm/v1/attention/backends/mla/flashinfer_mla_sparse.py:288-294
      return:
        max_query_len: '= (input.num_speculative_tokens > 0 ? 1 + input.num_speculative_tokens : 1)'
  - if: input.backend == 'FLASHINFER'
    then:
    - call: attention-metadata-builder.get-cudagraph-support
      input:
        backend: FLASHINFER
        all_specs_trtllm: = input.all_specs_trtllm
      as: s
      fill: true
    - title: 'FlashInfer: only past the UNIFORM_BATCH gate, and only with trtllm-gen varlen decode'
      source: vllm/v1/attention/backends/flashinfer.py:1084-1105
      return:
        max_query_len: '= vars.s.value.support == ''UNIFORM_BATCH'' && input.trtllm_gen_varlen ? dyn((input.num_speculative_tokens > 0 ? 1 + input.num_speculative_tokens : 1)) : dyn(null)'
  - title: 'Base: no variable-length replay (ALWAYS builders replay anything)'
    source: vllm/v1/attention/backend.py:632-653
    return:
      max_query_len: null
- component: attention-metadata-builder
  name: update-draft-decode-metadata
  kind: function
  summary: 'update_draft_decode_metadata: refresh draft-decode metadata in place inside a speculator''s graph (FA recomputes AOT scheduling, Triton has nothing to do, the base raises).'
  sources:
  - vllm/v1/attention/backend.py:750-758
  - vllm/v1/attention/backends/flash_attn.py:1030-1049
  - vllm/v1/attention/backends/triton_attn.py:278-279
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASH_ATTN
      has_scheduler_metadata:
        type: boolean
        default: true
      dcp_world_size:
        type: integer
        default: 1
  response:
    type: object
    properties:
      refreshed:
        type: boolean
  errors:
  - code: not-implemented-error
    status: 0
    retryable: false
    summary: unsupported
  - code: assertion-error
    status: 0
    retryable: false
    summary: DCP
  behavior:
  - if: input.backend == 'TRITON_ATTN'
    then:
    - title: 'Triton: nothing to refresh'
      source: vllm/v1/attention/backends/triton_attn.py:278-279
      return:
        refreshed: false
  - if: input.backend == 'FLASH_ATTN'
    then:
    - if: '!input.has_scheduler_metadata'
      then:
      - title: 'No AOT scheduler metadata: nothing to refresh'
        source: vllm/v1/attention/backends/flash_attn.py:1031
        return:
          refreshed: false
    - if: input.dcp_world_size != 1
      then:
      - title: Draft refresh needs DCP 1
        source: vllm/v1/attention/backends/flash_attn.py:1036
        fail:
          code: assertion-error
          message: dcp_world_size != 1
    - title: Recompute the AOT scheduler metadata in place (capture-safe)
      source: vllm/v1/attention/backends/flash_attn.py:1030-1049
      return:
        refreshed: true
  - title: 'Base: builders that don''t support draft refresh'
    source: vllm/v1/attention/backend.py:750-758
    fail:
      code: not-implemented-error
      message: update_draft_decode_metadata
- component: mla-attention-impl
  name: forward-mqa
  kind: function
  summary: 'MLAAttentionImpl.forward_mqa: abstract; each MLA backend''s impl overrides it (dispatched by the selected backend).'
  sources:
  - vllm/v1/attention/backend.py:1068-1076
  request:
    type: object
    properties:
      backend:
        type: string
        default: FLASHINFER_MLA
      num_decode_tokens:
        type: integer
        default: 2
      num_heads:
        type: integer
        default: 16
  response:
    type: object
    properties:
      impl:
        type: string
  errors:
  - code: not-implemented-error
    status: 0
    retryable: false
    summary: abstract
  behavior:
  - if: input.backend == 'FLASHINFER_MLA'
    then:
    - call: flashinfer-mla-impl.forward-mqa
      input:
        num_decode_tokens: = input.num_decode_tokens
        query_heads: = input.num_heads
      as: o
      fill: true
    - return:
        impl: FlashInferMLAImpl
        output_shape: = vars.o.value.output_shape
  - if: input.backend == 'TRITON_MLA'
    then:
    - call: triton-mla-impl.forward-mqa
      input:
        num_tokens: = input.num_decode_tokens
        num_seqs: = input.num_decode_tokens
        num_heads: = input.num_heads
      fill: true
    - return:
        impl: TritonMLAImpl
        output_shape: = [input.num_decode_tokens, input.num_heads, 512]
  - if: input.backend == 'ROCM_AITER_MLA'
    then:
    - call: aiter-mla-impl.forward-mqa
      input:
        num_heads: = input.num_heads
        num_tokens: = input.num_decode_tokens
      as: o
      fill: true
    - return:
        impl: AiterMLAImpl
        output_shape: = [input.num_decode_tokens, input.num_heads, 512]
  - if: input.backend == ''
    then:
    - title: Abstract on the base class
      source: vllm/v1/attention/backend.py:1068-1076
      fail:
        code: not-implemented-error
        message: forward_mqa
  - title: Another concrete backend's forward_mqa (not simulated by this model)
    source: vllm/v1/attention/backend.py:1068-1076
    return:
      impl: = input.backend
      output_shape: = [input.num_decode_tokens, input.num_heads, 512]
