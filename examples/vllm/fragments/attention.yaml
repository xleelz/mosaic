scenarios:
- id: attention-select-backend-flash-attn
  name: 'Llama-8B layer on CUDA: the platform returns FlashAttention'
  fixtures: &id029
  - tp1-llama-8b
  - attention-seed
  flow: attn-select-backend
  expect:
  - result.ok && result.value.backend_cls_path.endsWith('FlashAttentionBackend') && !result.value.cached
  - calls['cuda-platform.get-attn-backend-cls'] == 1
  - trace.exists(e, e.type == 'call.start' && e.interface == 'cuda-platform.get-attn-backend-cls' && (!has(e.input.selected_backend) || e.input.selected_backend == null) && (!has(e.input.attn_selector_config.block_size)
    || e.input.attn_selector_config.block_size == null))
- id: attention-select-backend-cache-hit
  name: Second layer with the same config hits functools.cache
  fixtures: *id029
  flow: attn-select-backend
  steps:
  - flow: attn-select-backend
    as: first
  - flow: attn-select-backend
    as: second
  expect:
  - steps.first.result.ok && !steps.first.result.value.cached
  - steps.second.result.value.cached
  - calls['cuda-platform.get-attn-backend-cls'] == 1
- id: attention-select-backend-invalid-kv-dtype
