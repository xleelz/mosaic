- component: mla-prefill-backend-enum
  name: register-mla-prefill-backend
  kind: function
  summary: 'register_mla_prefill_backend: override an existing member or register a new one by name, directly (class_path) or as a class decorator.'
  sources:
  - vllm/v1/attention/backends/mla/prefill/registry.py:143-200
  request:
    type: object
    properties:
      backend:
        type: string
        default: CUSTOM
      is_new:
        type: boolean
        default: false
      has_class_path:
        type: boolean
        default: false
      class_path:
        type: string
        default: ''
      decorated_class:
        type: string
        default: ''
  response:
    type: object
    properties:
      backend:
        type: string
      decorator:
        type: boolean
      path:
        type:
        - string
        - 'null'
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: the new name exists or is invalid
  - code: key-error
    status: 0
    retryable: false
    summary: not a member
  behavior:
  - if: input.is_new
    then:
    - title: A string backend name registers a new member (an empty path until the decorator or class_path sets one)
      source: vllm/v1/attention/backends/mla/prefill/registry.py:189
      call: mla-prefill-backend-enum.register
      input:
        name: = input.backend
        value: '= input.has_class_path ? input.class_path : '''''
      fill: true
    else:
    - if: '!(input.backend in state.members)'
      then:
      - title: An enum member is expected
        source: vllm/v1/attention/backends/mla/prefill/registry.py:143
        fail:
          code: key-error
          message: = "'" + input.backend + "'"
  - if: input.has_class_path
    then:
    - title: 'Direct registration: the override is the given class path, and a no-op decorator is returned'
      source: vllm/v1/attention/backends/mla/prefill/registry.py:196-198
      set:
        = 'state.overrides.' + input.backend: = input.class_path
    - return:
        backend: = input.backend
        decorator: false
        path: = input.class_path
  - if: input.decorated_class != ''
    then:
    - title: 'Decorator form: the override is the decorated class''s module.qualname'
      source: vllm/v1/attention/backends/mla/prefill/registry.py:192-194
      set:
        = 'state.overrides.' + input.backend: = input.decorated_class
    - return:
        backend: = input.backend
        decorator: true
        path: = input.decorated_class
  - return:
      backend: = input.backend
      decorator: true
      path: null
- component: mla-prefill-backend
  name: validate-configuration
  kind: function
  summary: 'MLAPrefillBackend.validate_configuration: the reasons a prefill backend class can''t serve this device, dtype and MLA head layout.'
  sources:
  - vllm/v1/attention/backends/mla/prefill/base.py:94-131
  - vllm/v1/attention/backends/mla/prefill/base.py:63-67
  request:
    type: object
    properties:
      backend_cls:
        type: object
        properties:
          name:
            type:
            - string
            - 'null'
          capability_majors: *id025
          dtypes:
            type: array
          available:
            type: boolean
          mla_dimensions:
            type: array
        default:
          name: FLASH_ATTN
          capability_majors: []
          dtypes:
          - float16
          - bfloat16
          available: true
          mla_dimensions: []
      has_device_capability:
        type: boolean
        default: true
      device_capability:
        type: object
        properties:
          major:
            type: integer
            default: 9
          minor:
            type: integer
            default: 0
      dtype:
        type: string
        default: bfloat16
      mla_dimensions:
        type: array
        items:
          type: integer
        default:
        - 128
        - 64
        - 128
  response:
    type: object
    properties:
      invalid_reasons:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.r: []
  - if: '!input.has_device_capability || (size(input.backend_cls.capability_majors) > 0 && !(input.device_capability.major in input.backend_cls.capability_majors))'
    then:
    - title: Compute capability not supported (or unknown)
      source: vllm/v1/attention/backends/mla/prefill/base.py:101-107
      set:
        vars.r: '= vars.r + [input.has_device_capability ? ''compute capability '' + string(input.device_capability.major) + ''.'' + string(input.device_capability.minor) + '' not supported'' : ''device
          capability not available'']'
  - if: '!(input.dtype in input.backend_cls.dtypes)'
    then:
    - title: dtype not supported
      source: vllm/v1/attention/backends/mla/prefill/base.py:110
      set:
        vars.r: = vars.r + ['dtype ' + input.dtype + ' not supported']
  - if: '!input.backend_cls.available'
    then:
    - title: Dependencies missing
      source: vllm/v1/attention/backends/mla/prefill/base.py:113
      set:
        vars.r: = vars.r + ['required dependencies not available']
  - if: size(input.backend_cls.mla_dimensions) > 0 && !(input.mla_dimensions in input.backend_cls.mla_dimensions)
    then:
    - title: MLA dimensions not supported
      source: vllm/v1/attention/backends/mla/prefill/base.py:117-130
      set:
        vars.r: = vars.r + ['Model does not have supported MLA dimensions']
  - return:
      invalid_reasons: = vars.r
- component: mla-prefill-selector
  name: get-mla-prefill-backend
  kind: function
  summary: 'get_mla_prefill_backend: an explicit mla_prefill_backend is loaded and validated (ValueError when invalid); otherwise, and always on CPU, the platform auto-selects.'
  sources:
  - vllm/v1/attention/backends/mla/prefill/selector.py:46-109
  - vllm/v1/attention/backends/mla/prefill/selector.py:113-132
  request:
    type: object
    properties:
      has_model_config:
        type: boolean
        default: true
      dtype:
        type: string
        default: bfloat16
      mla_dimensions:
        type: array
        items:
          type: integer
        default:
        - 128
        - 64
        - 128
      is_cpu:
        type: boolean
        default: false
      mla_prefill_backend:
        type: string
        default: ''
      device_capability:
        type: object
        properties:
          major:
            type: integer
            default: 9
          minor:
            type: integer
            default: 0
  response:
    type: object
    properties:
      backend:
        type:
        - string
        - 'null'
      auto:
        type: boolean
  errors:
  - code: value-error
    status: 0
    retryable: false
    summary: the selected backend is invalid
  behavior:
  - title: 'MLAPrefillSelectorConfig: the model dtype and its (qk_nope, qk_rope, v) head dims; defaults without a model config'
    source: vllm/v1/attention/backends/mla/prefill/selector.py:65-78
    set:
      vars.dims: '= input.has_model_config ? input.mla_dimensions : [0, 0, 0]'
      vars.dtype: '= input.has_model_config ? input.dtype : ''float32'''
  - if: '!input.is_cpu && input.mla_prefill_backend != '''''
    then:
    - title: 'Explicit AttentionConfig.mla_prefill_backend: load the class'
      source: vllm/v1/attention/backends/mla/prefill/selector.py:92
      call: mla-prefill-backend-enum.get-class
      input:
        name: = input.mla_prefill_backend
      as: cls
      on_error:
      - if: error.code == 'import-error'
        then:
        - title: An ImportError becomes the only reason
          source: vllm/v1/attention/backends/mla/prefill/selector.py:98
          fail:
            code: value-error
            message: '= ''Selected MLA prefill backend '' + input.mla_prefill_backend + '' is not valid for this configuration. Reason: [\''ImportError\'']'''
        else:
        - fail: '= {''code'': error.code, ''status'': error.status, ''message'': error.message}'
      fill: true
    - title: Validate it on this device
      source: vllm/v1/attention/backends/mla/prefill/selector.py:94
      call: mla-prefill-backend.validate-configuration
      input:
        backend_cls: = vars.cls.value.cls
        has_device_capability: true
        device_capability: = input.device_capability
        dtype: = vars.dtype
        mla_dimensions: = vars.dims
      as: v
      fill: true
    - if: size(vars.v.value.invalid_reasons) > 0
      then:
      - title: The selected backend is invalid
        source: vllm/v1/attention/backends/mla/prefill/selector.py:99
        fail:
          code: value-error
          message: '= ''Selected MLA prefill backend '' + input.mla_prefill_backend + '' is not valid for this configuration. Reason: ['' + vars.v.value.invalid_reasons.map(r, "''" + r + "''").join('',
            '') + '']'''
    - return:
        backend: = vars.cls.value.class_name
        auto: false
  - if: input.is_cpu
    then:
    - title: 'CPU: current_platform is CpuPlatform, so its priority list (ZEN_CPU, CPU) answers'
      source: vllm/v1/attention/backends/mla/prefill/selector.py:113-132
      call: cpu-platform.get-mla-prefill-backend-cls
      input:
        dtype: = vars.dtype
        mla_dimensions: = vars.dims
      as: auto
      fill: true
    else:
    - title: 'Nothing selected: the platform''s priority list (functools.cache per selector config)'
      source: vllm/v1/attention/backends/mla/prefill/selector.py:113-132
      call: cuda-platform.get-mla-prefill-backend-cls
      input:
        dtype: = vars.dtype
        mla_dimensions: = vars.dims
      as: auto
  - return:
      backend: '= has(vars.auto.value.backend) ? vars.auto.value.backend : null'
      auto: true
