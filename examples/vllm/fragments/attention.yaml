        false, ''decode_query_threshold'': 1}}, input)'
  - title: AOT scheduling only on FA3, not for spec-decode fast builds or batch invariance
    detail: aot_schedule is fixed at __init__ as get_flash_attn_version() == 3.
    source: vllm/v1/attention/backends/flash_attn.py:830-832
    set:
      vars.aot: = vars.i.fa_version == 3 && !vars.i.fast_build && !vars.i.batch_invariant
  - if: vars.aot && vars.i.sliding_window_configs > 1
    then:
