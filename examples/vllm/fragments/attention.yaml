  behavior:
  - if: input.backend in ['DEEPSEEK_V32_INDEXER', 'DeepseekV32IndexerBackend', 'Glm5NextIndexerBackend', 'KPOOL_TAIL', 'KpoolTailBackend']
    then:
    - if: input.backend in ['KPOOL_TAIL', 'KpoolTailBackend']
