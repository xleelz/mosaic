- component: merge-attn-states
  name: merge-attn-states
  kind: function
  summary: 'merge_attn_states: combine prefix (KV cache) and suffix (new tokens) partial outputs by log-sum-exp; CUDA op when platform, dtype and head size allow, torch on CPU, else Triton.'
  sources:
  - vllm/v1/attention/ops/merge_attn_states.py:71-195
  request: AttnMergeRequest
  response:
    type: object
    properties:
      impl:
        type: string
      merged_tokens:
        type: integer
  errors:
  - code: assertion-error
    status: 0
    retryable: false
    summary: mismatched head strides, or quantized output without a scale
  behavior:
  - if: '!input.head_strides_match'
    then:
    - title: Prefix and suffix outputs must share head strides
      source: vllm/v1/attention/ops/merge_attn_states.py:113
      fail:
        code: assertion-error
        message: merge_attn_states requires prefix_output and suffix_output to have matching head strides
  - if: '!(input.output_dtype in [''float32'', ''float16'', ''bfloat16'']) && !input.has_output_scale'
    then:
    - title: A quantized output needs output_scale
      source: vllm/v1/attention/ops/merge_attn_states.py:124
      fail:
        code: assertion-error
        message: = 'output_scale is required when output is ' + input.output_dtype
  - set:
      vars.platform_ok: = input.platform == 'cuda' || (input.platform == 'rocm' && input.cdna_version >= 3)
      vars.dtype_ok: = input.dtype in ['float32', 'float16', 'bfloat16']
      vars.head_ok: '= input.dtype == ''float32'' ? input.head_size % 4 == 0 : input.head_size % 8 == 0'
  - if: vars.platform_ok && vars.dtype_ok && vars.head_ok
    then:
    - title: CUDA op _C::merge_attn_states
      source: vllm/v1/attention/ops/merge_attn_states.py:160
      call: custom-ops.merge-attn-states
      input:
        num_tokens: = input.num_tokens
        hidden_size: = input.num_heads * input.head_size
        dtype_bytes: 2
      fill: true
    - title: merge_attn_states_launcher launches merge_attn_states_kernel (one thread per packed head chunk)
      source: csrc/attention/merge_attn_states.cu:18
    - return:
        impl: cuda
  - if: input.platform == 'cpu'
    then:
    - title: 'CPU: torch LSE merge'
      source: vllm/v1/attention/ops/merge_attn_states.py:9-68
      set:
        vars.merged: '= input.prefill_tokens_with_context == null ? input.num_tokens : input.prefill_tokens_with_context'
    - return:
        impl: torch
        merged_tokens: = vars.merged
  - title: Otherwise the Triton kernel
    source: vllm/v1/attention/ops/merge_attn_states.py:182
    call: triton-merge-attn-states.merge-attn-states
    input: = input
    fill: true
  - return:
      impl: triton
