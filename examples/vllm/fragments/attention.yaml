- component: flash-attention-impl
  name: init
  kind: function
  summary: 'FlashAttentionImpl.__init__: the window tuple per attention type, the FA version (an encoder layer with a window falls back from FA4''s hd256 kernel to FA2), and the quantized-KV support check.'
  sources:
  - vllm/v1/attention/backends/flash_attn.py:1056-1175
  - vllm/v1/attention/backends/fa_utils.py:224-233
  request:
    type: object
    properties:
      num_heads:
        type: integer
        default: 32
      num_kv_heads:
        type: integer
        default: 8
      head_size:
        type: integer
        default: 128
      sliding_window:
        type: integer
        default: 0
      attn_type:
        type: string
        default: decoder
      kv_cache_dtype:
        type: string
        default: auto
      logits_soft_cap:
        type: number
        default: 0
      has_alibi:
        type: boolean
        default: false
      has_sinks:
        type: boolean
        default: false
      device_capability_major:
        type: integer
        default: 9
  response:
    type: object
    properties:
      fa_version:
        type:
        - integer
        - 'null'
      sliding_window: *id025
  errors:
  - code: not-implemented-error
    status: 0
    retryable: false
    summary: unsupported quantized KV cache
  behavior:
  - title: 'Sliding window as (left, right): encoder-only layers see both sides, decoders only the past; none is (-1, -1)'
    source: vllm/v1/attention/backends/flash_attn.py:1077-1082
    set:
      vars.sw: '= input.sliding_window <= 0 ? [-1, -1] : (input.attn_type == ''encoder_only'' ? [input.sliding_window - 1, input.sliding_window - 1] : [input.sliding_window - 1, 0])'
      vars.uses_kv_cache: = !(input.attn_type in ['encoder', 'encoder_only'])
  - title: get_flash_attn_version (FA4 hd256 allowed)
    source: vllm/v1/attention/backends/flash_attn.py:1099
    call: fa-utils.get-flash-attn-version
    input:
      device_capability_major: = input.device_capability_major
      requires_alibi: = input.has_alibi
      head_size: = input.head_size
      has_sinks: = input.has_sinks
    as: v
    fill: true
  - title: 'uses_fa4_hd256_kernel: FA4 with head 256 (and V 256) on SM100/SM110'
    source: vllm/v1/attention/backends/fa_utils.py:224-233
    set:
      vars.ver: = vars.v.value.fa_version
      vars.hd256: = vars.v.value.fa_version == 4 && input.head_size == 256 && input.device_capability_major in [10, 11]
  - if: vars.hd256 && !vars.uses_kv_cache && input.sliding_window > 0
    then:
    - title: 'FA4''s hd256 kernel needs seqused_k for local attention: encoder inputs with a window fall back to FA2'
      source: vllm/v1/attention/backends/flash_attn.py:1109-1116
      set:
        vars.ver: 2
        vars.hd256: false
  - if: (input.kv_cache_dtype.startsWith('fp8') || input.kv_cache_dtype.endsWith('per_token_head') || input.kv_cache_dtype.startsWith('nvfp4') || input.kv_cache_dtype.startsWith('turboquant_') || input.kv_cache_dtype
      == 'ultraquant_4bit') && !(input.kv_cache_dtype != 'fp8_e5m2' && ((input.device_capability_major == 9 && (vars.v.value.fa_version == 3 || (vars.v.value.fa_version == 4 && (input.head_size == null
      || input.head_size == 512)))) || (vars.v.value.fa_version == 4 && input.device_capability_major == 10)))
    then:
    - title: A quantized KV cache this FA version can't read
      source: vllm/v1/attention/backends/flash_attn.py:1124-1137
      fail:
        code: not-implemented-error
        message: = 'FlashAttention does not support ' + input.kv_cache_dtype + ' kv-cache on this device.'
  - title: Soft cap 0 means none; queries per KV head
    source: vllm/v1/attention/backends/flash_attn.py:1084-1090
    return:
      sliding_window: = vars.sw
      fa_version: = vars.ver
      fa4_hd256: = vars.hd256
      uses_kv_cache: = vars.uses_kv_cache
      logits_soft_cap: = input.logits_soft_cap
      num_queries_per_kv: = input.num_heads / input.num_kv_heads
- component: attention-backend-utils
  name: split-decodes-and-prefills
  kind: function
  summary: 'split_decodes_and_prefills: on a decode-first batch, where decodes end (by threshold, uniformity and still-prefilling short extends).'
  sources:
  - vllm/v1/attention/backends/utils.py:803-874
  request:
    type: object
    properties:
      query_start_loc_cpu:
        type: array
        items:
          type: integer
        default:
        - 0
        - 1
        - 2
        - 7
      num_reqs:
        type: integer
        default: 3
      num_actual_tokens:
        type: integer
        default: 7
      max_query_len:
        type: integer
        default: 5
      decode_threshold:
        type: integer
        default: 1
      require_uniform:
        type: boolean
        default: false
      treat_short_extends_as_decodes:
        type: boolean
        default: true
      is_prefilling:
        type: array
        items:
          type: boolean
        default: []
  response:
    type: object
    properties:
      num_decodes:
        type: integer
      num_prefills:
        type: integer
      num_decode_tokens:
        type: integer
      num_prefill_tokens:
        type: integer
  behavior:
  - if: input.max_query_len <= input.decode_threshold && (!input.require_uniform || input.decode_threshold <= 1) && input.treat_short_extends_as_decodes
    then:
    - title: Every request is a decode
      source: vllm/v1/attention/backends/utils.py:839-843
      return:
        num_decodes: = input.num_reqs
        num_prefills: 0
        num_decode_tokens: = input.num_actual_tokens
        num_prefill_tokens: 0
  - set:
      vars.q: = lists.range(input.num_reqs).map(i, input.query_start_loc_cpu[i + 1] - input.query_start_loc_cpu[i])
  - if: vars.q[0] > input.decode_threshold
    then:
    - title: 'The batch is reordered decode-first: a prefill first means no decodes'
      source: vllm/v1/attention/backends/utils.py:846
      return:
        num_decodes: 0
        num_prefills: = input.num_reqs
        num_decode_tokens: 0
        num_prefill_tokens: = input.num_actual_tokens
  - if: input.require_uniform
    then:
    - if: input.treat_short_extends_as_decodes && vars.q.all(x, x == vars.q[0] || x == 0)
      then:
      - title: A padded uniform batch (zero-length padding rows) is all decodes
        source: vllm/v1/attention/backends/utils.py:854
        return:
          num_decodes: = input.num_reqs
          num_prefills: 0
          num_decode_tokens: = input.num_actual_tokens
          num_prefill_tokens: 0
    - set:
        vars.p: = vars.q.map(x, x != vars.q[0] && x != 0)
    else:
    - title: A prefill is any query longer than the threshold
      source: vllm/v1/attention/backends/utils.py:860
      set:
        vars.p: = vars.q.map(x, x > input.decode_threshold)
  - if: '!input.treat_short_extends_as_decodes'
    then:
    - title: Short extends still prefilling count as prefills
      source: vllm/v1/attention/backends/utils.py:864
      set:
        vars.p: = lists.range(input.num_reqs).map(i, vars.p[i] || input.is_prefilling[i])
  - if: '!vars.p.exists(x, x)'
    then:
    - title: No prefill
      source: vllm/v1/attention/backends/utils.py:866
      return:
        num_decodes: = input.num_reqs
        num_prefills: 0
        num_decode_tokens: = input.num_actual_tokens
        num_prefill_tokens: 0
  - title: The first prefill splits the batch
    source: vllm/v1/attention/backends/utils.py:869-874
    set:
      vars.f: = vars.p.indexOf(true)
  - return:
      num_decodes: = vars.f
      num_prefills: = input.num_reqs - vars.f
      num_decode_tokens: = input.query_start_loc_cpu[vars.f]
      num_prefill_tokens: = input.num_actual_tokens - input.query_start_loc_cpu[vars.f]
- component: attention-backend-utils
  name: get-dcp-local-seq-lens
  kind: function
  summary: 'get_dcp_local_seq_lens: the KV tokens each DCP rank holds of each sequence under round-robin interleaving (dcp_rank -1 means every rank).'
  sources:
  - vllm/v1/attention/backends/utils.py:1115-1160
  request:
    type: object
    properties:
      seq_lens:
        type: array
        items:
          type: integer
        default:
        - 10
        - 3
      dcp_size:
        type: integer
        default: 2
      dcp_rank:
        type: integer
        default: -1
      cp_kv_cache_interleave_size:
        type: integer
        default: 1
  response:
    type: object
    properties:
      local_seq_lens:
        type: array
  behavior:
  - set:
      vars.I: = input.cp_kv_cache_interleave_size
  - if: input.dcp_rank < 0
    then:
    - title: 'No rank: one column per DCP rank'
      source: vllm/v1/attention/backends/utils.py:1127-1136
      return:
        local_seq_lens: = input.seq_lens.map(s, lists.range(input.dcp_size).map(r, ((s / vars.I / input.dcp_size * vars.I) + math.least(math.greatest(s - (s / vars.I / input.dcp_size * vars.I) * input.dcp_size
          - r * vars.I, 0), vars.I))))
  - title: 'Round-robin interleave: whole interleaves per rank, plus this rank''s share of the remainder'
    source: vllm/v1/attention/backends/utils.py:1147-1160
    return:
      local_seq_lens: = input.seq_lens.map(s, ((s / vars.I / input.dcp_size * vars.I) + math.least(math.greatest(s - (s / vars.I / input.dcp_size * vars.I) * input.dcp_size - input.dcp_rank * vars.I, 0),
        vars.I)))
