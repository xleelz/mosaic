- component: llm
  name: add-completion-requests
  kind: function
  summary: '_add_completion_requests: per-prompt params must match the prompt count; render each prompt and add it (FINAL_ONLY); abort the added ones if one fails.'
  sources:
  - vllm/entrypoints/common/offline.py:304-338
  - vllm/entrypoints/common/offline.py:539-586
  request:
    type: object
    properties:
      prompts:
        type:
        - string
        - object
        - array
        items:
          type:
          - string
          - object
          - array
          - integer
      params: {}
    required:
    - prompts
  errors:
  - code: vllm-validation-error
    status: 0
  - code: type-error
    status: 0
  behavior:
  - title: 'prompt_to_seq: a string, a dict or a non-empty list of ints is one prompt; any other list (including [] and [[]]) is the sequence itself'
    source: vllm/entrypoints/common/offline.py:317
    set:
      vars.prompts: '= type(input.prompts) == string || type(input.prompts) == map || (type(input.prompts) == list && size(input.prompts) > 0 && input.prompts.all(x, type(x) == int))
        ? [input.prompts] : input.prompts'
  - if: type(input.params) == list && size(input.params) != size(vars.prompts)
    then:
    - title: _params_to_seq length check
      source: vllm/entrypoints/common/offline.py:258-263
      fail:
        code: vllm-validation-error
        message: = 'The lengths of prompts (' + string(size(vars.prompts)) + ') and params (' + string(size(input.params)) + ') must be the same.'
  - set:
      vars.ids: []
  - title: Render one prompt, add it, then the next (engine work can start on the first)
    source: vllm/entrypoints/common/offline.py:552-561
    foreach: = vars.prompts
    as: p
    index: i
    steps:
    - title: 'parse_dec_only_prompt: a list must hold only ints (a TokensPrompt); other types are a TypeError'
      source: vllm/renderers/inputs/preprocess.py:129-155
      if: (type(vars.p) == list && !vars.p.all(x, type(x) == int)) || !(type(vars.p) in [string, list, map])
      then:
      - fail:
          code: type-error
          message: '= type(vars.p) == list ? ''Token prompt should be a list of integers'' : ''Prompt should be a string, list of tokens, or dictionary'''
    - title: A TokensPrompt (a list of ids, or {prompt_token_ids}) skips tokenization; a text prompt is tokenized
      source: vllm/inputs/llm.py:111-127
      call: base-renderer.tokenize-prompt
      input: '= type(vars.p) == list ? {''prompt_token_ids'': vars.p} : (type(vars.p) == map && ''prompt_token_ids'' in vars.p ? {''prompt_token_ids'': vars.p.prompt_token_ids} : {''prompt'':
        type(vars.p) == map ? vars.p.prompt : vars.p})'
      as: tok
      on_error:
      - when: size(vars.ids) > 0
        title: Abort the requests already added, then re-raise
        source: vllm/entrypoints/common/offline.py:562-564
        call: llm-engine.abort-request
        input:
          request_ids: = vars.ids
          internal: true
      - fail: = error
    - title: request_id = next(request_counter); SamplingParams.output_kind = FINAL_ONLY; a dict prompt's multi_modal_data rides on the engine input
      source: vllm/entrypoints/common/offline.py:574-586
      call: llm-engine.add-request
      input: '= merge({''request_id'': string(state.request_counter), ''prompt_token_ids'': vars.tok.value.prompt_token_ids, ''sampling_params'': merge(type(input.params) == list ? input.params[vars.i]
        : input.params, {''output_kind'': ''FINAL_ONLY''})}, type(vars.p) == map && ''multi_modal_data'' in vars.p && vars.p.multi_modal_data != null ? {''multi_modal_data'': vars.p.multi_modal_data}
        : {})'
    - set:
        vars.ids: = vars.ids + [string(state.request_counter)]
        state.request_counter: = state.request_counter + 1
  - return:
      request_ids: = vars.ids
- component: llm
  name: add-chat-requests
  kind: function
  summary: '_add_chat_requests: chat-template each conversation, then add it like a completion prompt.'
  sources:
  - vllm/entrypoints/common/offline.py:403-461
  request:
    type: object
    properties:
      conversations:
        type: array
        items:
          type: array
      params: {}
    required:
    - conversations
  behavior:
  - set:
      vars.ids: []
  - foreach: = input.conversations
    as: conv
    max: 16
    steps:
    - call: hf-renderer.render-messages
      input:
        messages: = vars.conv
      as: r
    - call: base-renderer.tokenize-prompt
      input:
        prompt_token_ids: = vars.r.value.prompt_token_ids
      as: tok
    - call: llm-engine.add-request
      input:
        request_id: = string(state.request_counter)
        prompt_token_ids: = vars.tok.value.prompt_token_ids
        sampling_params: = input.params
    - set:
        vars.ids: = vars.ids + [string(state.request_counter)]
        state.request_counter: = state.request_counter + 1
  - return:
      request_ids: = vars.ids
- component: llm
  name: run-engine
  kind: function
  summary: '_run_engine: while the engine has unfinished requests, step it and keep the finished outputs; return them sorted by request id.'
  sources:
  - vllm/entrypoints/common/offline.py:589-642
  request:
    type: object
    properties:
      num_requests:
        type: integer
        examples:
        - 1
  behavior:
  - set:
      vars.outputs: []
  - title: 'while has_unfinished_requests(): step(). With FINAL_ONLY each request yields exactly one finished output, so the loop also ends once every added request has one'
    source: vllm/entrypoints/common/offline.py:610-616
    foreach: = lists.range(256)
    as: step_no
    max: 256
    steps:
    - call: llm-engine.has-unfinished-requests
      as: hu
    - if: '!vars.hu.value || size(vars.outputs) >= input.num_requests'
      then:
      - break: true
    - call: llm-engine.step
      as: st
    - set:
        vars.outputs: = vars.outputs + vars.st.value.request_outputs.filter(o, o.finished)
  - title: Sorted by request id (requests can finish out of order)
    source: vllm/entrypoints/common/offline.py:638-642
    return: = vars.outputs.sortBy(o, int(o.request_id))
- component: reasoning-parser-manager
  name: get-reasoning-parser
  kind: function
  summary: 'ReasoningParserManager.get_reasoning_parser(name): an eager or lazily imported parser class, or KeyError.'
  sources:
  - vllm/reasoning/abs_reasoning_parsers.py:230-249
  attributes:
    racy_in_code: 'check-then-import-then-store with no lock: two first lookups of one lazy name both import the module and both store the class in reasoning_parsers (vllm/reasoning/abs_reasoning_parsers.py:257-268);
      the class is the same, so the race is benign'
  request:
    type: object
    properties:
      name:
        type: string
        examples:
        - glm45
    required:
    - name
  errors:
  - code: key-error
    status: 0
  behavior:
  - if: input.name in state.reasoning_parsers
    then:
    - source: vllm/reasoning/abs_reasoning_parsers.py:240-241
      return:
        parser_class: = state.reasoning_parsers[input.name]
  - if: '!(input.name in state.lazy_parsers)'
    then:
    - title: Unknown parser name
      source: vllm/reasoning/abs_reasoning_parsers.py:246-249
      fail:
        code: key-error
        message: '= ''Reasoning parser \'''' + input.name + ''\'' not found. Available parsers: '' + (state.reasoning_parsers.map(k, k).filter(k, !(k in state.lazy_parsers)) + state.lazy_parsers.map(k,
          k)).sortBy(k, k).join('', '')'
  - title: Lazily registered parsers are imported and cached on first use
    source: vllm/reasoning/abs_reasoning_parsers.py:257-268
    set:
      state.reasoning_parsers: '= merge(state.reasoning_parsers, {input.name: state.lazy_parsers[input.name]})'
  - return:
      parser_class: = state.lazy_parsers[input.name]
- component: qwen3-parser
  name: init
  kind: function
  summary: 'Qwen3Parser(tokenizer, chat_template_kwargs=...): enable_thinking (default True) builds the cached qwen3_config: REASONING initial state and wait_for_reasoning when thinking,
    CONTENT and no wait otherwise.'
  sources:
  - vllm/parser/qwen3.py:224-245
  - vllm/parser/qwen3.py:88-103
  request:
    type: object
    properties:
      chat_template_kwargs:
        type:
        - object
        - 'null'
        default: null
  behavior:
  - title: chat_kwargs.get('enable_thinking', True); a None kwargs dict counts as empty
    source: vllm/parser/qwen3.py:230-231
    set:
      vars.thinking: '= has(input.chat_template_kwargs) && input.chat_template_kwargs != null && ''enable_thinking'' in input.chat_template_kwargs ? input.chat_template_kwargs.enable_thinking
        : true'
  - title: 'qwen3_config(thinking): initial_state and wait_for_reasoning both follow thinking; the CHATML turn boundaries end a turn'
    source: vllm/parser/qwen3.py:100-103
    return:
      thinking_enabled: = vars.thinking
      parser_engine_config:
        name: qwen3
        initial_state: '= vars.thinking ? ''REASONING'' : ''CONTENT'''
        wait_for_reasoning: = vars.thinking
        terminals:
          THINK_START: <think>
          THINK_END: </think>
          TOOL_START: <tool_call>
          TOOL_END: </tool_call>
- component: glm47-moe-parser
  name: extract-reasoning
  kind: function
  summary: 'ParserEngine.extract_reasoning with the GLM-4.7 config: thinking starts in REASONING, <think> is swallowed, </think> switches to CONTENT.'
  sources:
  - vllm/parser/engine/parser_engine.py:516-541
  - vllm/parser/glm47_moe.py:100-200
  request:
    type: object
    properties:
      model_output:
        type: string
        examples:
        - <think>This is a reasoning section</think>This is the rest
      thinking:
        type: boolean
        default: true
    required:
    - model_output
  behavior:
  - if: has(input.thinking) && !input.thinking
    then:
    - title: Thinking disabled -- initial state CONTENT, no reasoning terminals
      source: vllm/parser/glm47_moe.py:150-151
      return:
        reasoning: null
        content: '= input.model_output == '''' ? null : input.model_output'
  - title: Initial state REASONING; (REASONING, THINK_START) stays REASONING and emits nothing
    source: vllm/parser/glm47_moe.py:166-170
    set:
      vars.text: '= input.model_output.startsWith(''<think>'') ? input.model_output.substring(7) : input.model_output'
  - if: vars.text.contains('</think>')
    then:
    - title: '(REASONING, THINK_END) -> CONTENT: text before is reasoning, text after is content'
      source: vllm/parser/glm47_moe.py:136-140
      set:
        vars.reasoning: = vars.text.substring(0, vars.text.indexOf('</think>'))
        vars.content: = vars.text.substring(vars.text.indexOf('</think>') + 8)
    else:
    - set:
        vars.reasoning: = vars.text
        vars.content: ''
  - title: Empty strings become None
    source: vllm/parser/engine/parser_engine.py:536-541
    return:
      reasoning: '= vars.reasoning == '''' ? null : vars.reasoning'
      content: '= vars.content == '''' ? null : vars.content'
- component: glm47-moe-parser
  name: is-reasoning-end
  kind: function
  summary: 'ParserEngine.is_reasoning_end: scan ids backwards; </think> ends reasoning, <think> or a turn boundary first means not ended (GLM waits for reasoning).'
  sources:
  - vllm/parser/engine/parser_engine.py:658-680
  request:
    type: object
    properties:
      text:
        type: string
        examples:
        - <think>This is a reasoning section</think>This is the rest
    required:
    - text
  behavior:
  - title: The markers are single special tokens, so the backwards id scan is a last-occurrence comparison on the decoded text
    source: vllm/parser/engine/parser_engine.py:668-671
    set:
      vars.end_at: = input.text.lastIndexOf('</think>')
      vars.start_at: = input.text.lastIndexOf('<think>')
      vars.boundary_at: = math.greatest([input.text.lastIndexOf('<|system|>'), input.text.lastIndexOf('<|user|>'), input.text.lastIndexOf('<|assistant|>'), input.text.lastIndexOf('<|observation|>')])
  - if: vars.end_at >= 0 && vars.end_at > vars.start_at && vars.end_at > vars.boundary_at
    then:
    - title: The last reasoning marker is THINK_END
      source: vllm/parser/engine/parser_engine.py:671-673
      return:
        is_reasoning_end: true
  - title: 'A THINK_START (which opens reasoning) or a turn boundary came first, or nothing: wait_for_reasoning is true for GLM, so not ended'
    source: vllm/parser/engine/parser_engine.py:674-680
    return:
      is_reasoning_end: false
- component: deepseek-v4-parser
  name: dsml-arg-converter
  kind: function
  summary: '_dsml_arg_converter: DSML <parameter name=.. string=..> blocks to a JSON arguments object; string=true keeps text, otherwise JSON with a literal fallback.'
  sources:
  - vllm/parser/deepseek_v4.py:60-112
  request:
    type: object
    properties:
      raw_args:
        type: string
        examples:
        - |2

          <｜DSML｜parameter name="city" string="true">杭州</｜DSML｜parameter>
      partial:
        type: boolean
        default: false
    required:
    - raw_args
  behavior:
  - title: Split on the DSML parameter start tag; each chunk is one parameter (the head regex needs name=, string= is optional)
    source: vllm/parser/deepseek_v4.py:69-76
    set:
      vars.chunks: = input.raw_args.split('<｜DSML｜parameter').slice(1, size(input.raw_args.split('<｜DSML｜parameter')))
      vars.params: {}
  - source: vllm/parser/deepseek_v4.py:90-100
    foreach: = vars.chunks
    as: c
    index: k
    max: 32
    steps:
    - if: '!vars.c.matches(r''(?s)^\s+name="([^"]+)"(?:\s+string="([^"]*)")?\s*>'')'
      then:
      - continue: true
    - title: A complete parameter ends at its close tag or at the next parameter; the trailing unclosed one counts only when partial
      source: vllm/parser/deepseek_v4.py:70-73
      if: '!vars.c.contains(''</｜DSML｜parameter>'') && vars.k == size(vars.chunks) - 1 && !input.partial'
      then:
      - continue: true
    - set:
        vars.name: = replace(vars.c, r'(?s)^\s+name="([^"]+)"(?:\s+string="([^"]*)")?\s*>.*$', '$1')
        vars.is_str: = replace(vars.c, r'(?s)^\s+name="([^"]+)"(?:\s+string="([^"]*)")?\s*>.*$', '$2')
        vars.value: = replace(vars.c, r'(?s)^\s+name="([^"]+)"(?:\s+string="([^"]*)")?\s*>(.*?)(?:</｜DSML｜parameter>.*)?$', '$3')
    - title: string="true" keeps the text; otherwise (including a missing string attribute) try JSON and fall back to the literal text
      source: vllm/parser/deepseek_v4.py:92-100
      if: vars.is_str == 'true' || !vars.value.matches(r'(?s)^\s*(-?[0-9]+(\.[0-9]+)?([eE][-+]?[0-9]+)?|true|false|null|\[.*\]|\{.*\}|".*")\s*$')
      then:
      - set:
          vars.params: '= merge(vars.params, {vars.name: vars.value})'
      else:
      - set:
          vars.params: '= merge(vars.params, {vars.name: eval(vars.value.trim(), {})})'
  - title: json.dumps(params, ensure_ascii=False)
    source: vllm/parser/deepseek_v4.py:112
    return:
      arguments: = vars.params
- component: llama3-json-tool-parser
  name: adjust-request
  kind: function
  summary: 'ToolParser.adjust_request: with tools and no structural tag, tool_choice required (or a named function) forces structured_outputs.json from the tools'' schema and clears
    response_format.'
  sources:
  - vllm/tool_parsers/abstract_tool_parser.py:122-165
  request:
    type: object
    properties:
      body:
        type: object
    required:
    - body
  behavior:
  - if: '!has(input.body.tools) || input.body.tools == null || size(input.body.tools) == 0'
    then:
    - title: No tools
      source: vllm/tool_parsers/abstract_tool_parser.py:126-128
      return: = input.body
  - if: has(input.body.structured_outputs) && input.body.structured_outputs != null && has(input.body.structured_outputs.structural_tag) && input.body.structured_outputs.structural_tag
      != null
    then:
    - title: An existing structural tag wins
      source: vllm/tool_parsers/abstract_tool_parser.py:133-138
      return: = input.body
  - title: 'get_json_schema_from_tools: required -> an array of {name, parameters} over every tool; a named function -> that tool''s parameters; auto -> none'
    source: vllm/tool_parsers/utils.py:449-500
    set:
      vars.schema: '= input.body.tool_choice == ''required'' ? dyn({''type'': ''array'', ''minItems'': 1, ''items'': {''anyOf'': input.body.tools.map(t, {''type'': ''object'', ''properties'':
        {''name'': {''enum'': [t.function.name]}, ''parameters'': has(t.function.parameters) ? t.function.parameters : {}}, ''required'': [''name'', ''parameters'']})}}) : (type(input.body.tool_choice)
        == map ? dyn(input.body.tools.filter(t, t.function.name == input.body.tool_choice.function.name).map(t, has(t.function.parameters) ? t.function.parameters : {})) : null)'
  - if: type(input.body.tool_choice) == map && size(vars.schema) == 0
    then:
    - source: vllm/tool_parsers/utils.py:483-484
      fail:
        code: value-error
        message: = 'Tool \'' + input.body.tool_choice.function.name + '\' has not been passed in `tools`.'
  - if: vars.schema == null
    then:
    - return: = input.body
  - title: structured_outputs = StructuredOutputsParams(json=schema); response_format = None
    source: vllm/tool_parsers/abstract_tool_parser.py:152-161
    return: '= merge(input.body, {''structured_outputs'': {''json'': type(vars.schema) == list ? vars.schema[0] : vars.schema}, ''response_format'': null})'
- component: llama3-json-tool-parser
  name: extract-tool-calls
  kind: function
  summary: 'Llama3JsonToolParser.extract_tool_calls: decode the JSON objects in the output; each needs name and arguments (or parameters); any failure returns the text as content.'
  sources:
  - vllm/tool_parsers/llama_tool_parser.py:76-160
  request:
    type: object
    properties:
      model_output:
        type: string
        examples:
        - '{"name": "get_weather", "parameters": {"city": "Paris"}}'
    required:
    - model_output
  behavior:
  - if: '!(input.model_output.contains(''<|python_tag|>'') || input.model_output.contains(''{''))'
    then:
    - title: Quick check -- no bot token and no brace
      source: vllm/tool_parsers/llama_tool_parser.py:83-87
      return:
        tools_called: false
        tool_calls: []
        content: = input.model_output
  - set:
      vars.objs: = input.model_output.replace('<|python_tag|>', '').split(';').map(s, s.trim()).filter(s, s != '')
  - title: Every JSON object must decode and carry name and arguments/parameters; otherwise the whole output is content
    source: vllm/tool_parsers/llama_tool_parser.py:94-146
    if: '!vars.objs.all(s, s.matches(''(?s)^\\{.*\\}$''))'
    then:
    - return:
        tools_called: false
        tool_calls: []
        content: = input.model_output
  - set:
      vars.parsed: = vars.objs.map(s, eval(s, {}))
  - if: '!vars.parsed.all(o, type(o) == map && ''name'' in o && (''arguments'' in o || ''parameters'' in o))'
    then:
    - title: Missing required key
      source: vllm/tool_parsers/llama_tool_parser.py:127-137
      return:
        tools_called: false
        tool_calls: []
        content: = input.model_output
  - source: vllm/tool_parsers/llama_tool_parser.py:110-126
    return:
      tools_called: true
      tool_calls: '= vars.parsed.map(o, {''type'': ''function'', ''function'': {''name'': o[''name''], ''arguments'': ''arguments'' in o ? o[''arguments''] : o[''parameters'']}})'
      content: null
- component: serving-scores
  name: serve-score
  kind: function
  summary: 'ServingScores: the IO processor follows the model''s pooling task. An embedding model is a bi-encoder: encode queries and documents with the embed task, then one cosine score
    per (query, document) pair; a classifier scores each pair with the score task.'
  sources:
  - vllm/entrypoints/pooling/scoring/serving.py:46-110
  - vllm/entrypoints/pooling/scoring/io_processor.py:216-357
  request:
    type: object
    properties:
      body:
        type: object
        properties:
          model:
            type: string
            examples:
            - llama-8b
          queries:
            type:
            - string
            - array
            examples:
            - What is the capital of France?
          documents:
            type:
            - string
            - array
            examples:
            - The capital of France is Paris.
      prefix:
        type: string
        default: score
      x_request_id:
        type:
        - string
        - 'null'
    required:
    - body
  errors:
  - code: value-error
    status: 0
  behavior:
  - call: base-serving.check-model
    input:
      model: '= has(input.body.model) ? input.body.model : '''''
    as: model
  - call: app-state.supported-tasks
    as: tasks
  - set:
      vars.q: '= has(input.body.queries) ? (type(input.body.queries) == string ? [input.body.queries] : input.body.queries) : (has(input.body.query) ? [input.body.query] : (has(input.body.text_1)
        ? [input.body.text_1] : []))'
      vars.d: '= has(input.body.documents) ? (type(input.body.documents) == string ? [input.body.documents] : input.body.documents) : (has(input.body.text_2) ? (type(input.body.text_2)
        == string ? [input.body.text_2] : input.body.text_2) : [])'
      vars.rid: '= (has(input.prefix) ? input.prefix : ''score'') + ''-'' + (has(input.x_request_id) && input.x_request_id != null ? input.x_request_id : id(''random-uuid'', seq(''random-uuid'')))'
  - title: 'valid_inputs: one query against N documents, or N against N'
    source: vllm/entrypoints/pooling/scoring/io_processor.py:223-260
    if: size(vars.q) == 0 || size(vars.d) == 0 || (size(vars.q) != 1 && size(vars.q) != size(vars.d))
    then:
    - fail:
        code: value-error
        message: queries and documents must be 1:N or N:N
  - if: '!(''embed'' in vars.tasks.value)'
    then:
    - title: 'Cross-encoder: one request per pair with the classify task (CrossEncoderIOProcessor.pooling_task)'
      source: vllm/entrypoints/pooling/scoring/io_processor.py:560-640
      parallel: = lists.range(size(vars.d))
      as: j
      steps:
      - call: base-renderer.tokenize-prompt
        input:
          prompt: '= (size(vars.q) == 1 ? vars.q[0] : vars.q[vars.j]) + '' '' + vars.d[vars.j]'
        as: tok
      - call: async-llm.encode
        input:
          request_id: = vars.rid + '-' + string(vars.j)
          prompt_token_ids: = vars.tok.value.prompt_token_ids
          pooling_params:
            task: classify
        as: e
        on_error: continue
      - return: '= {''error'': vars.e.ok ? null : vars.e.error, ''score'': !vars.e.ok || vars.e.value == null || !has(vars.e.value.outputs) ? 0.0 : double(vars.e.value.outputs.data[0])}'
      join:
        need: all
      as_result: outs
    - foreach: = vars.outs.results
      as: o
      steps:
      - if: vars.o.value.error != null
        then:
        - fail: = vars.o.value.error
    - call: serving-scores.build-response
      input:
        prefix: '= has(input.prefix) ? input.prefix : ''score'''
        request_id: = vars.rid
        model_name: = vars.model.value.model_name
        scores: = vars.outs.results.sortBy(r, r.index).map(r, r.value.score)
        documents: = vars.d
        top_n: '= has(input.body.top_n) && input.body.top_n != null ? input.body.top_n : 0'
        num_prompt_tokens: = size(vars.q) + size(vars.d)
      as: resp
    - return: = vars.resp.value
  - title: 'Bi-encoder: embed queries + documents (one encode each), merged'
    source: vllm/entrypoints/pooling/scoring/io_processor.py:262-300
    parallel: = vars.q + vars.d
    as: text
    steps:
    - call: base-renderer.tokenize-prompt
      input:
        prompt: = vars.text
      as: tok
    - call: async-llm.encode
      input:
        request_id: = vars.rid + '-' + string(vars.index)
        prompt_token_ids: = vars.tok.value.prompt_token_ids
        pooling_params:
          task: embed
      as: e
      on_error: continue
    - return: '= {''error'': vars.e.ok ? null : vars.e.error, ''emb'': !vars.e.ok || vars.e.value == null || !has(vars.e.value.outputs) || !has(vars.e.value.outputs.data) ? [1.0] : vars.e.value.outputs.data}'
    join:
      need: all
    as_result: outs
  - foreach: = vars.outs.results
    as: o
    steps:
    - if: vars.o.value.error != null
      then:
      - fail: = vars.o.value.error
  - title: 'post_process: cosine similarity per pair (query i against document i, or the one query against every document)'
    source: vllm/entrypoints/pooling/scoring/io_processor.py:320-357
    set:
      vars.emb: = vars.outs.results.map(r, r.value.emb)
  - set:
      vars.scores: '= lists.range(size(vars.d)).map(j, [vars.emb[size(vars.q) == 1 ? 0 : j], vars.emb[size(vars.q) + j]]).map(p, size(p[0]) == size(p[1]) ? sum(lists.range(size(p[0])).map(k,
        double(p[0][k]) * double(p[1][k]))) / (math.sqrt(sum(p[0].map(x, double(x) * double(x)))) * math.sqrt(sum(p[1].map(x, double(x) * double(x)))) + 1e-12) : 0.0)'
  - call: serving-scores.build-response
    input:
      prefix: '= has(input.prefix) ? input.prefix : ''score'''
      request_id: = vars.rid
      model_name: = vars.model.value.model_name
      scores: = vars.scores
      documents: = vars.d
      top_n: '= has(input.body.top_n) && input.body.top_n != null ? input.body.top_n : 0'
      num_prompt_tokens: = size(vars.q) + size(vars.d)
    as: resp
  - return: = vars.resp.value
- component: serving-scores
  name: build-response
  kind: function
  summary: '_request_output_to_score_response / _request_output_to_rerank_response: /score answers a ScoreResponse (one ScoreResponseData per pair, in order); /rerank answers a RerankResponse
    with results sorted by relevance and cut to top_n.'
  sources:
  - vllm/entrypoints/pooling/scoring/serving.py:108-187
  - vllm/entrypoints/pooling/scoring/protocol.py:160-184
  request:
    type: object
    properties:
      prefix:
        type: string
        examples:
        - score
      request_id:
        type: string
      model_name:
        type: string
      scores:
        type: array
        items:
          type: number
      documents:
        type: array
      top_n:
        type: integer
        default: 0
      num_prompt_tokens:
        type: integer
    required:
    - scores
  behavior:
  - if: input.prefix == 'rerank'
    then:
    - title: RerankResult per document (text documents), sorted by relevance_score descending; top_n below the document count truncates
      source: vllm/entrypoints/pooling/scoring/serving.py:155-177
      set:
        vars.results: '= lists.range(size(input.scores)).map(i, {''index'': i, ''document'': {''text'': type(input.documents[i]) == string ? input.documents[i] : ''''}, ''relevance_score'':
          input.scores[i]}).sortBy(r, -r.relevance_score)'
    - set:
        vars.results: '= input.top_n > 0 && input.top_n < size(input.documents) ? vars.results.slice(0, input.top_n) : vars.results'
    - source: vllm/entrypoints/pooling/scoring/serving.py:179-187
      return:
        id: = input.request_id
        model: = input.model_name
        results: = vars.results
        usage:
          prompt_tokens: = input.num_prompt_tokens
          total_tokens: = input.num_prompt_tokens
  - title: 'ScoreResponse: one ScoreResponseData (index, object score, score) per pair; usage total = prompt tokens'
    source: vllm/entrypoints/pooling/scoring/serving.py:117-139
    return:
      id: = input.request_id
      object: list
      created: = now / 1000
      model: = input.model_name
      data: '= lists.range(size(input.scores)).map(j, {''index'': j, ''object'': ''score'', ''score'': input.scores[j]})'
      usage:
        prompt_tokens: = input.num_prompt_tokens
        total_tokens: = input.num_prompt_tokens
- component: llm
  name: run-tiling-engine
  kind: function
  summary: '_run_tiling_engine: add requests in windows of max_num_seqs * 2 through LLMEngine.add_request, step until the window finishes, keep the outputs in request order; abort what
    was added on an exception.'
  sources:
  - vllm/entrypoints/pooling/offline.py:396-479
  request:
    type: object
    properties:
      prompts:
        type: array
        items:
          type: string
      pooling_task:
        type: string
    required:
    - prompts
    - pooling_task
  errors:
  - code: value-error
    status: 0
  behavior:
  - if: size(input.prompts) == 0
    then:
    - source: vllm/entrypoints/pooling/offline.py:403-404
      fail:
        code: value-error
        message: You must pass at least one prompt
  - set:
      vars.window: = config['max-num-seqs'] * 2
      vars.outputs: []
      vars.ids: []
  - title: 'At most max_num_seqs * 2 requests in the core (ASSUMPTION: the code refills the core as requests finish; modeled as consecutive windows)'
    source: vllm/entrypoints/pooling/offline.py:406-468
    foreach: = lists.range((size(input.prompts) + vars.window - 1) / vars.window)
    as: w
    steps:
    - set:
        vars.batch: = input.prompts.slice(vars.w * vars.window, math.least([size(input.prompts), (vars.w + 1) * vars.window]))
    - foreach: = vars.batch
      as: p
      steps:
      - call: base-renderer.tokenize-prompt
        input:
          prompt: = vars.p
        as: tok
      - title: LLMEngine.add_request with PoolingParams(task); abort the window on an exception
        source: vllm/entrypoints/common/offline.py:568-586
        call: llm-engine.add-request
        input:
          request_id: = string(state.request_counter)
          prompt_token_ids: = vars.tok.value.prompt_token_ids
          sampling_params: {}
          pooling_params:
            task: = input.pooling_task
        on_error:
        - when: size(vars.ids) > 0
          call: llm-engine.abort-request
          input:
            request_ids: = vars.ids
            internal: true
        - fail: = error
      - set:
          vars.ids: = vars.ids + [string(state.request_counter)]
          state.request_counter: = state.request_counter + 1
    - call: llm.run-engine
      input:
        num_requests: = size(vars.batch)
      as: out
    - set:
        vars.outputs: = vars.outputs + vars.out.value
  - return: = vars.outputs
- component: sampling-params
  name: post-init
  kind: function
  summary: 'SamplingParams.from_optional + __post_init__ + _verify_args: convert and clamp logit_bias, fill defaults, raise a tiny temperature to 0.01, normalize stop, stop_token_ids
    and logprobs, refuse invalid values with VLLMValidationError (in the code''s order), and reset top_p/top_k/min_p for greedy sampling.'
  sources:
  - vllm/sampling_params.py:449-555
  - vllm/sampling_params.py:556-630
  - vllm/sampling_params.py:631-745
  - vllm/sampling_params.py:45-58
  request:
    type: object
    properties:
      params:
        type: object
        description: the keyword arguments the request's to_sampling_params passes (unset ones take the dataclass defaults)
    required:
    - params
  errors:
  - code: vllm-validation-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.lb_in: '= has(input.params.logit_bias) && input.params.logit_bias != null ? input.params.logit_bias : null'
  - if: vars.lb_in != null
    then:
    - title: 'from_optional: logit_bias keys become int token ids; a key int() cannot parse is collected for the error'
      source: vllm/sampling_params.py:488-508
      set:
        vars.bad_keys: = vars.lb_in.filter(k, !string(k).matches('^\\s*[-+]?[0-9]+\\s*$'))
    - if: size(vars.bad_keys) > 0
      then:
      - title: VLLMValidationError(parameter='logit_bias', value=invalid_keys); the value is the Python repr of the key list
        source: vllm/sampling_params.py:503-508
        fail:
          code: vllm-validation-error
          message: '= ''logit_bias contains key(s) that cannot be converted to integer token IDs: ['' + vars.bad_keys.map(k, ''\'''' + string(k) + ''\'''').join('', '') + '']'''
          data:
            param: logit_bias
            value: = '[' + vars.bad_keys.map(k, '\'' + string(k) + '\'').join(', ') + ']'
    - title: Each bias is clamped to [-100, 100] (a float)
      source: vllm/sampling_params.py:492-495
      set:
        vars.lb: = vars.lb_in.transformMap(k, v, math.least(100.0, math.greatest(-100.0, double(v))))
  - title: 'from_optional: None arguments take the dataclass defaults (n 1, temperature 1.0, top_p 1.0, top_k 0, min_p 0, max_tokens 16, min_tokens 0, no stop)'
    source: vllm/sampling_params.py:510-555
    set:
      vars.p: '= merge(merge({''n'': 1, ''presence_penalty'': 0.0, ''frequency_penalty'': 0.0, ''repetition_penalty'': 1.0, ''temperature'': 1.0, ''top_p'': 1.0, ''top_k'': 0, ''min_p'':
        0.0, ''seed'': null, ''stop'': [], ''stop_token_ids'': [], ''ignore_eos'': false, ''max_tokens'': 16, ''min_tokens'': 0, ''logprobs'': null, ''prompt_logprobs'': null, ''include_stop_str_in_output'':
        false, ''skip_special_tokens'': true, ''detokenize'': true}, input.params.filter(k, input.params[k] != null).transformMapEntry(i, k, {k: input.params[k]})), has(vars.lb) ? {''logit_bias'':
        vars.lb} : {})'
  - if: double(vars.p.temperature) > 0.0 && double(vars.p.temperature) < 0.01
    then:
    - title: '__post_init__: 0 < temperature < 0.01 is raised to 0.01 (with a warning: it may cause nan or inf)'
      source: vllm/sampling_params.py:557-565
      set:
        vars.p: '= merge(vars.p, {''temperature'': 0.01})'
        vars.temperature_warning: = 'temperature ' + string(input.params.temperature) + ' is less than 0.01, which may cause numerical errors nan or inf in tensors. We have maxed it
          out to 0.01.'
  - title: '__post_init__: seed -1 means none; a single stop string becomes a list; stop_token_ids are de-duplicated in order; logprobs/prompt_logprobs True mean 1'
    source: vllm/sampling_params.py:567-592
    set:
      vars.p: '= merge(vars.p, {''seed'': vars.p.seed == -1 ? dyn(null) : dyn(vars.p.seed), ''stop'': type(vars.p.stop) == string ? [vars.p.stop] : vars.p.stop, ''stop_token_ids'': lists.range(size(vars.p.stop_token_ids)).filter(i,
        vars.p.stop_token_ids.indexOf(vars.p.stop_token_ids[i]) == i).map(i, vars.p.stop_token_ids[i]), ''logprobs'': type(vars.p.logprobs) == bool ? (vars.p.logprobs ? dyn(1) : dyn(null))
        : vars.p.logprobs, ''prompt_logprobs'': type(vars.p.prompt_logprobs) == bool ? (vars.p.prompt_logprobs ? dyn(1) : dyn(null)) : vars.p.prompt_logprobs})'
  - title: 'Characters held back for stop strings while streaming: max(len(stop)) - 1 unless the stop string is kept'
    source: vllm/sampling_params.py:594-597
    set:
      vars.p: '= merge(vars.p, {''output_text_buffer_length'': size(vars.p.stop) > 0 && !vars.p.include_stop_str_in_output ? math.greatest(vars.p.stop.map(s, size(s))) - 1 : 0})'
  - title: '_verify_num_sequences: n must be at least 1 and at most VLLM_MAX_N_SEQUENCES'
    source: vllm/sampling_params.py:45-58
    if: vars.p.n < 1 || vars.p.n > config['vllm-max-n-sequences']
    then:
    - fail:
        code: vllm-validation-error
        message: '= vars.p.n < 1 ? ''n must be at least 1, got '' + string(vars.p.n) + ''.'' : ''n must be at most '' + string(config["vllm-max-n-sequences"]) + '', got '' + string(vars.p.n)
          + ''. To increase this limit, set the VLLM_MAX_N_SEQUENCES environment variable.'''
  - title: presence_penalty must be in [-2, 2] (checked first)
    source: vllm/sampling_params.py:635-638
    if: double(vars.p.presence_penalty) < -2.0 || double(vars.p.presence_penalty) > 2.0
    then:
    - fail:
        code: vllm-validation-error
        message: = 'presence_penalty must be in [-2, 2], got ' + string(vars.p.presence_penalty) + '.'
  - title: then frequency_penalty in [-2, 2]
    source: vllm/sampling_params.py:639-642
    if: double(vars.p.frequency_penalty) < -2.0 || double(vars.p.frequency_penalty) > 2.0
    then:
    - fail:
        code: vllm-validation-error
        message: = 'frequency_penalty must be in [-2, 2], got ' + string(vars.p.frequency_penalty) + '.'
  - title: then repetition_penalty must be greater than zero
    source: vllm/sampling_params.py:648-652
    if: double(vars.p.repetition_penalty) <= 0.0
    then:
    - fail:
        code: vllm-validation-error
        message: = 'repetition_penalty must be greater than zero, got ' + string(vars.p.repetition_penalty) + '.'
  - title: temperature must be non-negative, then at most 2
    source: vllm/sampling_params.py:653-670
    if: double(vars.p.temperature) < 0.0 || double(vars.p.temperature) > 2.0
    then:
    - fail:
        code: vllm-validation-error
        message: '= double(vars.p.temperature) < 0.0 ? ''temperature must be non-negative, got '' + string(vars.p.temperature) + ''.'' : ''temperature must be in [0, 2], got '' + string(vars.p.temperature)
          + ''.'''
        data:
          param: temperature
          value: = vars.p.temperature
  - title: top_p must be in (0, 1]
    source: vllm/sampling_params.py:671-676
    if: double(vars.p.top_p) <= 0.0 || double(vars.p.top_p) > 1.0
    then:
    - fail:
        code: vllm-validation-error
        message: = 'top_p must be in (0, 1], got ' + string(vars.p.top_p) + '.'
        data:
          param: top_p
          value: = vars.p.top_p
  - title: 'top_k: 0 (or -1) disables, otherwise at least 1 (no parameter)'
    source: vllm/sampling_params.py:677-682
    if: vars.p.top_k < -1
    then:
    - fail:
        code: vllm-validation-error
        message: = 'top_k must be 0 (disable), or at least 1, got ' + string(vars.p.top_k) + '.'
  - title: min_p in [0, 1] (no parameter)
    source: vllm/sampling_params.py:686-687
    if: double(vars.p.min_p) < 0.0 || double(vars.p.min_p) > 1.0
    then:
    - fail:
        code: vllm-validation-error
        message: = 'min_p must be in [0, 1], got ' + string(vars.p.min_p) + '.'
  - title: max_tokens must be at least 1
    source: vllm/sampling_params.py:688-693
    if: vars.p.max_tokens != null && vars.p.max_tokens < 1
    then:
    - fail:
        code: vllm-validation-error
        message: = 'max_tokens must be at least 1, got ' + string(vars.p.max_tokens) + '.'
        data:
          param: max_tokens
          value: = vars.p.max_tokens
  - title: min_tokens must be non-negative and at most max_tokens
    source: vllm/sampling_params.py:694-702
    if: vars.p.min_tokens < 0 || (vars.p.max_tokens != null && vars.p.min_tokens > vars.p.max_tokens)
    then:
    - fail:
        code: vllm-validation-error
        message: '= vars.p.min_tokens < 0 ? ''min_tokens must be greater than or equal to 0, got '' + string(vars.p.min_tokens) + ''.'' : ''min_tokens must be less than or equal to max_tokens=''
          + string(vars.p.max_tokens) + '', got '' + string(vars.p.min_tokens) + ''.'''
  - title: stream_interval must be at least 1
    source: vllm/sampling_params.py:703-708
    if: has(vars.p.stream_interval) && vars.p.stream_interval != null && vars.p.stream_interval < 1
    then:
    - fail:
        code: vllm-validation-error
        message: = 'stream_interval must be at least 1, got ' + string(vars.p.stream_interval) + '.'
        data:
          param: stream_interval
          value: = vars.p.stream_interval
  - title: logprobs must be non-negative or -1
    source: vllm/sampling_params.py:709-714
    if: vars.p.logprobs != null && vars.p.logprobs != -1 && vars.p.logprobs < 0
    then:
    - fail:
        code: vllm-validation-error
        message: = 'logprobs must be non-negative or -1, got ' + string(vars.p.logprobs) + '.'
        data:
          param: logprobs
          value: = vars.p.logprobs
  - title: prompt_logprobs must be non-negative or -1
    source: vllm/sampling_params.py:715-725
    if: vars.p.prompt_logprobs != null && vars.p.prompt_logprobs != -1 && vars.p.prompt_logprobs < 0
    then:
    - fail:
        code: vllm-validation-error
        message: = 'prompt_logprobs must be non-negative or -1, got ' + string(vars.p.prompt_logprobs) + '.'
        data:
          param: prompt_logprobs
          value: = vars.p.prompt_logprobs
  - title: stop cannot contain an empty string
    source: vllm/sampling_params.py:731-733
    if: vars.p.stop.exists(s, s == '')
    then:
    - fail:
        code: vllm-validation-error
        message: stop cannot contain an empty string.
  - title: stop strings need detokenize
    source: vllm/sampling_params.py:734-738
    if: size(vars.p.stop) > 0 && !vars.p.detokenize
    then:
    - fail:
        code: vllm-validation-error
        message: stop strings are only supported when detokenize is True. Set detokenize=True to use stop.
  - if: double(vars.p.temperature) < 0.00001
    then:
    - title: 'Zero temperature is greedy: top_p, top_k and min_p reset'
      source: vllm/sampling_params.py:612-617
      set:
        vars.p: '= merge(vars.p, {''top_p'': 1.0, ''top_k'': 0, ''min_p'': 0.0})'
    - title: '_verify_greedy_sampling: greedy sampling allows only n=1'
      source: vllm/sampling_params.py:766-770
      when: vars.p.n > 1
      fail:
        code: vllm-validation-error
        message: = 'n must be 1 when using greedy sampling, got ' + string(vars.p.n) + '.'
  - title: 'skip_reading_prefix_cache: a request with prompt logprobs must not read the prefix cache (its prompt logprobs would be short)'
    source: vllm/sampling_params.py:622-629
    set:
      vars.p: '= merge(vars.p, {''skip_reading_prefix_cache'': vars.p.prompt_logprobs != null})'
  - title: 'SamplingParams is a msgspec Struct with omit_defaults: unset (None) fields are not sent to the engine'
    source: vllm/sampling_params.py:268-274
    return: '= vars.p.filter(k, vars.p[k] != null).transformMapEntry(i, k, {k: vars.p[k]})'
- component: sampling-params
  name: verify
  kind: function
  summary: 'SamplingParams.verify(model_config, speculative_config, ...): the checks that need the model config, run by the engine''s InputProcessor, in order: logprobs and prompt logprobs
    against max_logprobs, logit_bias, stop_token_ids and allowed_token_ids against the model''s vocabulary, the spec-decode exclusions, then the structured-outputs request.'
  sources:
  - vllm/sampling_params.py:901-917
  - vllm/sampling_params.py:919-1003
  - vllm/sampling_params.py:1047-1194
  - vllm/sampling_params.py:1370-1440
  request:
    type: object
    properties:
      sampling_params:
        type: object
      vocab_size:
        type:
        - integer
        - 'null'
        default: null
        description: model_config.get_vocab_size(); null reads the served checkpoint's config.json
    required:
    - sampling_params
  errors:
  - code: vllm-validation-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.sp: = input.sampling_params
  - if: has(input.vocab_size) && input.vocab_size != null
    then:
    - set:
        vars.vocab: = input.vocab_size
    else:
    - title: 'model_config.get_vocab_size(): hf_text_config.vocab_size of the served checkpoint'
      source: vllm/config/model.py:1616-1617
      call: hf-hub.download-config
      input:
        model: = config['model']
      as: hfc
      on_error: continue
    - set:
        vars.vocab: '= vars.hfc.ok && has(vars.hfc.value.vocab_size) ? vars.hfc.value.vocab_size : 128256'
  - set:
      vars.max_lp: '= config[''max-logprobs''] == -1 ? vars.vocab : config[''max-logprobs'']'
  - title: '_validate_logprobs: the requested sample logprobs (-1 = the vocabulary) must not exceed max_logprobs'
    source: vllm/sampling_params.py:919-933
    if: 'has(vars.sp.logprobs) && vars.sp.logprobs != null && vars.sp.logprobs != 0 && (vars.sp.logprobs == -1 ? vars.vocab : vars.sp.logprobs) > vars.max_lp'
    then:
    - fail:
        code: vllm-validation-error
        message: '= ''Requested sample logprobs of '' + string(vars.sp.logprobs == -1 ? vars.vocab : vars.sp.logprobs) + '', which is greater than max allowed: '' + string(vars.max_lp)'
        data:
          param: logprobs
          value: '= vars.sp.logprobs == -1 ? vars.vocab : vars.sp.logprobs'
  - title: '_validate_logprobs: prompt logprobs likewise'
    source: vllm/sampling_params.py:969-979
    if: 'has(vars.sp.prompt_logprobs) && vars.sp.prompt_logprobs != null && vars.sp.prompt_logprobs != 0 && (vars.sp.prompt_logprobs == -1 ? vars.vocab : vars.sp.prompt_logprobs) > vars.max_lp'
    then:
    - fail:
        code: vllm-validation-error
        message: '= ''Requested prompt logprobs of '' + string(vars.sp.prompt_logprobs == -1 ? vars.vocab : vars.sp.prompt_logprobs) + '', which is greater than max allowed: '' + string(vars.max_lp)'
        data:
          param: prompt_logprobs
          value: '= vars.sp.prompt_logprobs == -1 ? vars.vocab : vars.sp.prompt_logprobs'
  - if: has(vars.sp.logit_bias) && vars.sp.logit_bias != null && size(vars.sp.logit_bias) > 0
    then:
    - set:
        vars.bad: = vars.sp.logit_bias.map(k, int(k)).filter(t, t < 0 || t >= vars.vocab)
    - title: '_validate_logit_bias: every token id must be inside the vocabulary'
      source: vllm/sampling_params.py:1072-1090
      when: size(vars.bad) > 0
      fail:
        code: vllm-validation-error
        message: '= ''token_id(s) '' + string(vars.bad).replace('','', '', '') + '' in logit_bias contain out-of-vocab token ids. Vocabulary size: '' + string(vars.vocab)'
        data:
          param: logit_bias
          value: = string(vars.bad).replace(',', ', ')
  - if: has(vars.sp.stop_token_ids) && vars.sp.stop_token_ids != null && size(vars.sp.stop_token_ids) > 0
    then:
    - set:
        vars.bad: = vars.sp.stop_token_ids.filter(t, t < 0 || t >= vars.vocab)
    - title: '_validate_stop_token_ids: every stop token id must be inside the vocabulary'
      source: vllm/sampling_params.py:1047-1070
      when: size(vars.bad) > 0
      fail:
        code: vllm-validation-error
        message: '= ''token_id(s) '' + string(vars.bad).replace('','', '', '') + '' in stop_token_ids contain out-of-vocab token ids. Vocabulary size: '' + string(vars.vocab)'
        data:
          param: stop_token_ids
          value: = string(vars.bad).replace(',', ', ')
  - if: has(vars.sp.allowed_token_ids) && vars.sp.allowed_token_ids != null
    then:
    - title: '_validate_allowed_token_ids: an empty list is refused'
      source: vllm/sampling_params.py:1151-1161
      when: size(vars.sp.allowed_token_ids) == 0
      fail:
        code: vllm-validation-error
        message: allowed_token_ids is not None and empty!
        data:
          param: allowed_token_ids
          value: '[]'
    - set:
        vars.bad: = vars.sp.allowed_token_ids.filter(t, t < 0 || t >= vars.vocab)
    - title: '_validate_allowed_token_ids: every id must be inside the vocabulary'
      source: vllm/sampling_params.py:1163-1181
      when: size(vars.bad) > 0
      fail:
        code: vllm-validation-error
        message: allowed_token_ids contains out-of-vocab token id!
        data:
          param: allowed_token_ids
          value: = string(vars.bad).replace(',', ', ')
  - title: '_validate_spec_decode: with a speculative config, min_p and logit_bias are refused (no parameter)'
    source: vllm/sampling_params.py:1183-1194
    if: config['speculative-method'] != '' && ((has(vars.sp.min_p) && double(vars.sp.min_p) > 0.00001) || (has(vars.sp.logit_bias) && vars.sp.logit_bias != null && size(vars.sp.logit_bias)
      > 0))
    then:
    - fail:
        code: vllm-validation-error
        message: The min_p and logit_bias sampling parameters are not yet supported with speculative decoding.
  - if: has(vars.sp.structured_outputs) && vars.sp.structured_outputs != null && has(vars.sp.structured_outputs.json) && type(vars.sp.structured_outputs.json) == string
    then:
    - title: '_validate_structured_outputs, backend auto: xgrammar rejects a schema it cannot parse; the guidance fallback json.loads it and raises ''Invalid JSON grammar specification.''
        (ASSUMPTION: parseability is judged by balanced braces and brackets and no dangling '':'' or '','')'
      source: vllm/sampling_params.py:1396-1411
      set:
        vars.s: = vars.sp.structured_outputs.json.trim()
    - if: size(vars.s.split('{')) != size(vars.s.split('}')) || size(vars.s.split('[')) != size(vars.s.split(']')) || vars.s.endsWith(':') || vars.s.endsWith(',')
      then:
      - fail:
          code: vllm-validation-error
          message: Invalid JSON grammar specification.
  - return:
      ok: true
- component: openai-serving-chat
  name: validate-request
  kind: function
  summary: 'ChatCompletionRequest''s mode=before model validators, which pydantic runs last-defined first: check_generation_prompt, check_tool_usage (which may default tool_choice to
    auto), check_structured_outputs_count, check_logprobs, then validate_stream_options. A VLLMValidationError is not a ValueError, so it reaches the app''s handler raw (400 with its
    parameter).'
  sources:
  - vllm/entrypoints/openai/chat_completion/protocol.py:788-1031
  request:
    type: object
    properties:
      body:
        $ref: ServingChatCompletionRequest
    required:
    - body
  errors:
  - code: vllm-validation-error
    status: 0
    retryable: false
  behavior:
  - title: 'check_generation_prompt: continue_final_message and add_generation_prompt are exclusive (no parameter)'
    source: vllm/entrypoints/openai/chat_completion/protocol.py:1021-1031
    if: has(input.body.continue_final_message) && input.body.continue_final_message == true && has(input.body.add_generation_prompt) && input.body.add_generation_prompt == true
    then:
    - fail:
        code: vllm-validation-error
        message: Cannot set both `continue_final_message` and `add_generation_prompt` to True.
  - title: 'check_tool_usage (mode=before) may rewrite the data: tools without tool_choice become tool_choice=''auto'' on the parsed request'
    source: vllm/entrypoints/openai/chat_completion/protocol.py:935-1019
    call: openai-serving-chat.check-tool-usage
    input:
      body: = input.body
    as: tu
  - set:
      vars.body: '= vars.tu.value.tool_choice != null ? merge(input.body, {''tool_choice'': vars.tu.value.tool_choice}) : input.body'
  - if: has(vars.body.structured_outputs) && vars.body.structured_outputs != null
    then:
    - set:
        vars.so_count: = size(['json', 'regex', 'choice'].filter(k, k in vars.body.structured_outputs && vars.body.structured_outputs[k] != null))
    - title: 'check_structured_outputs_count: one kind of constraint only'
      source: vllm/entrypoints/openai/chat_completion/protocol.py:915-922
      when: vars.so_count > 1
      fail:
        code: vllm-validation-error
        message: You can only use one kind of constraints for structured outputs ('json', 'regex' or 'choice').
    - title: 'check_structured_outputs_count: constraints and a named tool choice are exclusive'
      source: vllm/entrypoints/openai/chat_completion/protocol.py:923-932
      when: vars.so_count > 0 && has(vars.body.tool_choice) && vars.body.tool_choice != null && !(vars.body.tool_choice in ['none', 'auto', 'required'])
      fail:
        code: vllm-validation-error
        message: You can only either use constraints for structured outputs or tools, not both.
  - if: has(vars.body.prompt_logprobs) && vars.body.prompt_logprobs != null
    then:
    - title: 'check_logprobs: prompt_logprobs are not available while streaming'
      source: vllm/entrypoints/openai/chat_completion/protocol.py:866-871
      when: has(vars.body.stream) && vars.body.stream == true && (vars.body.prompt_logprobs > 0 || vars.body.prompt_logprobs == -1)
      fail:
        code: vllm-validation-error
        message: '`prompt_logprobs` are not available when `stream=True`.'
        data:
          param: prompt_logprobs
    - title: 'check_logprobs: prompt_logprobs must be positive or -1'
      source: vllm/entrypoints/openai/chat_completion/protocol.py:873-878
      when: vars.body.prompt_logprobs < 0 && vars.body.prompt_logprobs != -1
      fail:
        code: vllm-validation-error
        message: '`prompt_logprobs` must be a positive value or -1.'
        data:
          param: prompt_logprobs
          value: = vars.body.prompt_logprobs
  - title: 'check_logprobs: top_logprobs below 0 (other than -1) is refused, and a positive top_logprobs needs logprobs=true'
    source: vllm/entrypoints/openai/chat_completion/protocol.py:879-890
    if: has(vars.body.top_logprobs) && vars.body.top_logprobs != null
    then:
    - if: vars.body.top_logprobs < 0 && vars.body.top_logprobs != -1
      then:
      - fail:
          code: vllm-validation-error
          message: '`top_logprobs` must be a positive value or -1.'
          data:
            param: top_logprobs
            value: = vars.body.top_logprobs
    - if: (vars.body.top_logprobs == -1 || vars.body.top_logprobs > 0) && !(has(vars.body.logprobs) && vars.body.logprobs == true)
      then:
      - fail:
          code: vllm-validation-error
          message: when using `top_logprobs`, `logprobs` must be set to true.
          data:
            param: top_logprobs
  - title: 'validate_stream_options: stream_options without stream=true is refused'
    source: vllm/entrypoints/openai/chat_completion/protocol.py:821-832
    if: has(vars.body.stream_options) && vars.body.stream_options != null && size(vars.body.stream_options) > 0 && !(has(vars.body.stream) && vars.body.stream == true)
    then:
    - fail:
        code: vllm-validation-error
        message: Stream options can only be defined when `stream=True`.
        data:
          param: stream_options
  - return:
      ok: true
      body: = vars.body
- component: openai-serving-completion
  name: validate-request
  kind: function
  summary: 'CompletionRequest''s mode=before model validators, last-defined first: validate_prompt_list_length, validate_prompt_and_prompt_embeds, validate_stream_options, check_logprobs,
    check_structured_outputs_count; then the pydantic field types (a prompt is token ids >= 0, lists of them, a string or a list of strings) and normalize_null_max_tokens.'
  sources:
  - vllm/entrypoints/openai/completion/protocol.py:430-645
  - vllm/entrypoints/openai/completion/protocol.py:47-58
  request:
    type: object
    properties:
      body:
        $ref: ServingCompletionRequest
    required:
    - body
  errors:
  - code: vllm-validation-error
    status: 0
    retryable: false
  - code: Bad Request
    status: 400
    retryable: false
  behavior:
  - set:
      vars.p: '= has(input.body.prompt) ? input.body.prompt : null'
  - title: 'validate_prompt_list_length: a list of prompts (not one token-id list) may hold at most VLLM_MAX_COMPLETION_PROMPTS'
    source: vllm/entrypoints/openai/completion/protocol.py:612-632
    if: vars.p != null && type(vars.p) == list && size(vars.p) > 0 && !vars.p.all(x, type(x) == int) && size(vars.p) > config['vllm-max-completion-prompts']
    then:
    - fail:
        code: vllm-validation-error
        message: = 'prompt list length ' + string(size(vars.p)) + ' exceeds the maximum allowed count of ' + string(config['vllm-max-completion-prompts']) + '. To increase this limit,
          set the VLLM_MAX_COMPLETION_PROMPTS environment variable.'
        data:
          param: prompt
  - title: 'validate_prompt_and_prompt_embeds: a missing or empty-string prompt needs prompt_embeds'
    source: vllm/entrypoints/openai/completion/protocol.py:591-610
    if: (vars.p == null || (type(vars.p) == string && vars.p == '')) && !(has(input.body.prompt_embeds) && input.body.prompt_embeds != null && size(input.body.prompt_embeds) > 0)
    then:
    - fail:
        code: vllm-validation-error
        message: Either prompt or prompt_embeds must be provided and non-empty.
        data:
          param: prompt
  - title: 'validate_stream_options: stream_options need stream=true'
    source: vllm/entrypoints/openai/completion/protocol.py:578-589
    if: has(input.body.stream_options) && input.body.stream_options != null && size(input.body.stream_options) > 0 && !(has(input.body.stream) && input.body.stream == true)
    then:
    - fail:
        code: vllm-validation-error
        message: Stream options can only be defined when `stream=True`.
        data:
          param: stream_options
  - title: 'check_logprobs: beam search computes no prompt logprobs, so echo with logprobs is refused'
    source: vllm/entrypoints/openai/completion/protocol.py:512-522
    if: has(input.body.use_beam_search) && input.body.use_beam_search == true && has(input.body.echo) && input.body.echo == true && has(input.body.logprobs) && input.body.logprobs !=
      null
    then:
    - fail:
        code: vllm-validation-error
        message: '`echo` with `logprobs` is not supported with beam search because beam search does not compute prompt logprobs.'
        data:
          param: echo
  - if: has(input.body.prompt_logprobs) && input.body.prompt_logprobs != null
    then:
    - title: 'check_logprobs: prompt_logprobs are not available while streaming'
      source: vllm/entrypoints/openai/completion/protocol.py:549-554
      when: has(input.body.stream) && input.body.stream == true && (input.body.prompt_logprobs > 0 || input.body.prompt_logprobs == -1)
      fail:
        code: vllm-validation-error
        message: '`prompt_logprobs` are not available when `stream=True`.'
        data:
          param: prompt_logprobs
    - title: 'check_logprobs: prompt_logprobs must be positive or -1'
      source: vllm/entrypoints/openai/completion/protocol.py:556-561
      when: input.body.prompt_logprobs < 0 && input.body.prompt_logprobs != -1
      fail:
        code: vllm-validation-error
        message: '`prompt_logprobs` must be a positive value or -1.'
        data:
          param: prompt_logprobs
          value: = input.body.prompt_logprobs
  - title: 'check_logprobs: logprobs must be positive or -1'
    source: vllm/entrypoints/openai/completion/protocol.py:563-574
    if: has(input.body.logprobs) && input.body.logprobs != null && input.body.logprobs < 0 && input.body.logprobs != -1
    then:
    - fail:
        code: vllm-validation-error
        message: '`logprobs` must be a positive value or -1.'
        data:
          param: logprobs
          value: = input.body.logprobs
  - title: 'check_structured_outputs_count: one kind of constraint only'
    source: vllm/entrypoints/openai/completion/protocol.py:471-499
    if: has(input.body.structured_outputs) && input.body.structured_outputs != null && size(['json', 'regex', 'choice'].filter(k, k in input.body.structured_outputs && input.body.structured_outputs[k]
      != null)) > 1
    then:
    - fail:
        code: vllm-validation-error
        message: You can only use one kind of constraints for structured outputs ('json', 'regex' or 'choice').
        data:
          param: structured_outputs
  - title: 'Field validation of prompt: token ids are Annotated[int, Field(ge=0)], so a negative id fails every union branch (RequestValidationError -> 400 Bad Request; ASSUMPTION: the
      message is cut to its count and first error)'
    source: vllm/entrypoints/openai/completion/protocol.py:51-57
    if: vars.p != null && type(vars.p) == list && (vars.p.exists(x, type(x) == int && x < 0) || vars.p.exists(x, type(x) == list && x.exists(y, type(y) == int && y < 0)))
    then:
    - fail:
        code: Bad Request
        status: 400
        message: |-
          validation errors:
            body.prompt: Input should be greater than or equal to 0
        data:
          param: body.prompt
  - title: 'normalize_null_max_tokens: an absent or null max_tokens is the field default, 16'
    source: vllm/entrypoints/openai/completion/protocol.py:430-436
    return:
      ok: true
      body: '= merge(input.body, {''max_tokens'': has(input.body.max_tokens) && input.body.max_tokens != null ? input.body.max_tokens : 16})'
- component: tokenize-params
  name: post-init
  kind: function
  summary: 'TokenizeParams.__post_init__: truncation_side must be left or right, and the requested output tokens may not exceed max_model_len (the message names the request''s own field).'
  sources:
  - vllm/renderers/params.py:243-290
  request:
    type: object
    properties:
      max_total_tokens:
        type:
        - integer
        - 'null'
