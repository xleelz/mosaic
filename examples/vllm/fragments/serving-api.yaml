        - array
        - 'null'
        items: *id002
        default: null
      bad_words:
        type:
        - array
        - 'null'
        items: *id001
        default: null
      stream_interval:
        type:
        - integer
        - 'null'
        default: null
      prompt_logprobs:
        type:
        - integer
        - 'null'
        default: null
      length_penalty:
        type: number
        default: 1.0
      use_beam_search:
        type: boolean
        default: false
    required:
    - prompt
- id: ServingResponsesRequest
  summary: 'ResponsesRequest body fields the model reads (openai/responses/protocol.py: store defaults to true, background to false).'
  schema:
    type: object
    properties:
      model:
        type: string
        examples:
        - llama-8b
      input:
        type:
        - string
        - array
        items:
          type: object
        examples:
        - Hello!
      store:
        type: boolean
        default: true
      background:
        type: boolean
        default: false
      stream:
        type: boolean
        default: false
      max_output_tokens:
        type: integer
        examples:
        - 16
      previous_response_id:
        type:
        - string
        - 'null'
        default: null
      previous_input_messages:
        type:
        - array
        - 'null'
        items:
          type: object
        default: null
    required:
    - input
- id: ServingPoolingRequestOutput
  summary: PoolingRequestOutput (vllm/outputs.py), the item AsyncLLM.encode yields.
  schema:
    type: object
    properties:
      request_id:
        type: string
        examples:
        - embd-req-1-0
      outputs:
        type: object
        properties:
          data:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: number
      prompt_token_ids:
        type: array
        minItems: 4
        maxItems: 4
        items:
          type: integer
          minimum: 1
          maximum: 128000
      finished:
        type: boolean
        default: true
