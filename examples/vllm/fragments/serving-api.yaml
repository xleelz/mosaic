- id: serving-api-responses-create-prompt-too-long
  name: A prompt filling max_model_len is refused by _validate_generator_input
  flow: serving-api-responses-create
  fixtures:
  - full-tp1-llama-8b
  config:
    max-model-len: 9
  expect:
  - trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-responses.post-v1-responses' && e.error != null).size() == 1
  - '!result.ok && result.error.code == ''invalid_request_error'' && result.error.message.contains(''exceeds the max_model_len 9'')'
  - calls['async-llm.generate'] == 0
- id: serving-api-models-list-default
  flow: serving-api-models-list
  fixtures:
  - full-tp1-llama-8b
  expect:
  - result.ok && size(result.value.data) == 1 && result.value.data[0].id == 'llama-8b' && result.value.data[0].max_model_len == 131072
- id: serving-api-lora-load-then-list
  name: A loaded adapter is listed and servable; unloading removes it
  flow: serving-api-lora-load
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-allow-runtime-lora-updating: true
    enable-lora: true
  state:
    local-disk:
      files:
        /models/loras/sql-lora/adapter_config.json:
          r: 8
          bias: none
        /models/loras/other-lora/adapter_config.json:
          r: 16
          bias: none
  steps:
  - flow: serving-api-lora-load
    as: load
  - flow: serving-api-models-list
    as: list1
  - flow: serving-api-chat-completion
    as: chat
    input:
      body:
        model: sql-lora
  - interface: openai-serving-models.post-v1-unload-lora-adapter
    caller: api-client
    as: unload
    input:
      path: /v1/unload_lora_adapter
      body:
        lora_name: sql-lora
  - flow: serving-api-models-list
    as: list2
  expect:
  - trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-models.post-v1-unload-lora-adapter' && e.error == null).size() == 1
  - steps.load.result.ok && steps.load.result.value.message.contains('added successfully')
  - size(steps.list1.result.value.data) == 2 && steps.list1.result.value.data[1].id == 'sql-lora' && steps.list1.result.value.data[1].parent == 'llama-8b'
  - steps.chat.result.ok && steps.chat.result.value.model == 'sql-lora'
  - steps.unload.result.ok && size(steps.list2.result.value.data) == 1
- id: serving-api-lora-load-refusals
  flow: serving-api-lora-load
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-allow-runtime-lora-updating: true
    enable-lora: true
  state:
    local-disk:
      files:
        /models/loras/sql-lora/adapter_config.json:
          r: 8
          bias: none
        /models/loras/other-lora/adapter_config.json:
          r: 16
          bias: none
  steps:
  - flow: serving-api-lora-load
    as: ok
  - flow: serving-api-lora-load
    as: again
  - flow: serving-api-lora-load
    as: inplace
    input:
      body:
        load_inplace: true
  - flow: serving-api-lora-load
    as: nofile
    input:
      body:
        lora_name: ghost-lora
        lora_path: /models/loras/ghost-lora
  - flow: serving-api-lora-load
    as: base
    input:
      body:
        lora_name: llama-8b
  - flow: serving-api-lora-load
    as: missing
    input:
      body:
        lora_name: ''
  - flow: serving-api-lora-load
    as: other
    input:
      body:
        lora_name: other-lora
        lora_path: /models/loras/other-lora
  - interface: openai-serving-models.post-v1-unload-lora-adapter
    caller: api-client
    as: unknown
    input:
      path: /v1/unload_lora_adapter
      body:
        lora_name: nope
  - interface: openai-serving-models.post-v1-unload-lora-adapter
    caller: api-client
    as: noname
    input:
      path: /v1/unload_lora_adapter
      body:
        lora_name: ''
  - flow: serving-api-models-list
    as: list
  expect:
  - trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-models.post-v1-load-lora-adapter' && e.error == null).size() == 3
  - steps.ok.result.ok
  - '!steps.again.result.ok && steps.again.result.error.code == ''InvalidUserInput'' && steps.again.result.error.message.contains(''already been loaded'')'
  - steps.inplace.result.ok
  - '!steps.nofile.result.ok && steps.nofile.result.error.status == 404'
  - '!steps.base.result.ok && steps.base.result.error.message.contains(''conflicts with a served base model'')'
  - '!steps.missing.result.ok && steps.missing.result.error.status == 400'
  - steps.other.result.ok && ['sql-lora', 'other-lora'].all(n, steps.list.result.value.data.exists(m, m.id == n)) && !steps.list.result.value.data.exists(m, m.id == 'ghost-lora')
  - '!steps.unknown.result.ok && steps.unknown.result.error.status == 404 && !steps.noname.result.ok && steps.noname.result.error.status == 400'
- id: serving-api-lora-load-disabled
  flow: serving-api-lora-load
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: serving-api-lora-load
    as: load
  - interface: openai-serving-models.post-v1-unload-lora-adapter
    caller: api-client
    as: unload
    input:
      path: /v1/unload_lora_adapter
      body:
        lora_name: sql-lora
  expect:
  - '!steps.load.result.ok && steps.load.result.error.status == 404 && !steps.unload.result.ok && steps.unload.result.error.status == 404'
  - calls['async-llm.add-lora'] == 0
  - size(state['openai-serving-models'].lora_requests) == 0
- id: serving-api-lora-load-engine-failure
  flow: serving-api-lora-load
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-allow-runtime-lora-updating: true
    enable-lora: true
  faults:
  - target: async-llm.add-lora
    type: error
    code: value-error
    message: bad rank
  expect:
  - '!result.ok && result.error.code == ''InternalServerError'' && result.error.status == 500'
  - size(state['openai-serving-models'].lora_requests) == 0
- id: serving-api-health-checks
  flow: serving-api-health
  fixtures:
  - full-tp1-llama-8b
  faults:
  - target: async-llm.check-health
    type: error
    code: engine-dead-error
    status: 500
    calls:
    - 2
    - 3
  steps:
  - flow: serving-api-health
    as: ok
  - flow: serving-api-health
    as: dead
  - interface: sagemaker-router.get-ping
    caller: api-client
    as: ping
    input:
      path: /ping
  - interface: sagemaker-router.post-ping
    caller: api-client
    as: pping
    input:
      path: /ping
  - flow: serving-api-health
    as: render
    input:
      render_only: true
  expect:
  - steps.ok.result.value.status_code == 200 && steps.dead.result.value.status_code == 503
  - steps.ping.result.value.status_code == 503 && steps.pping.result.value.status_code == 200
  - steps.render.result.value.status_code == 200
- id: serving-api-engine-watchdog-dead
  name: The watchdog stops the server once the engine core is dead
  flow: serving-api-engine-watchdog
  fixtures:
  - full-tp1-llama-8b
  state:
    async-mp-client:
      engine_dead: true
  steps:
  - flow: serving-api-engine-watchdog
    as: w
  - interface: launcher.serve-http
    caller: api-server
    as: http
  expect:
  - trace.exists(e, e.type == 'call.end' && e.interface == 'launcher.watchdog-loop' && e.error == null)
  - steps.w.result.ok && steps.w.result.value.should_exit == true
  - steps.http.result.value.shutdown == true
- id: serving-api-engine-watchdog-healthy
  flow: serving-api-engine-watchdog
  fixtures:
  - full-tp1-llama-8b
  expect:
  - result.ok && result.value.should_exit == false && duration_ms >= 10000
- id: serving-api-disconnect-listener-drops-load
  name: listen_for_disconnect consumes messages until http.disconnect, then the load counter drops
  flow: serving-api-disconnect-listener
  fixtures:
  - full-tp1-llama-8b
  config:
    enable-server-load-tracking: true
  state:
    api-utils:
      inbox:
      - type: http.request
      - type: http.disconnect
    server-load-metrics:
      counters:
        server_load_metrics: 1
  steps:
  - flow: serving-api-disconnect-listener
    as: l1
  - flow: serving-api-disconnect-listener
    as: l2
  - interface: instrumentator-basic.get-load
    caller: api-client
    as: load
    input:
      path: /load
  expect:
  - state['api-utils'].disconnected == true && size(state['api-utils'].inbox) == 0
  - steps.load.result.value.server_load == 0
- id: serving-api-disconnect-listener-idle
  flow: serving-api-disconnect-listener
  fixtures:
  - full-tp1-llama-8b
  expect:
  - passes[0].result.value.waiting == true && state['api-utils'].disconnected == false
