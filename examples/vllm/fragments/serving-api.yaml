  - interface: sampling-params.post-init
    caller: api-server
    as: temp
    input:
      params:
        temperature: 2.5
  - interface: sampling-params.post-init
    caller: api-server
    as: topp
    input:
      params:
        top_p: 0.0
  - interface: sampling-params.post-init
    caller: api-server
    as: topk
    input:
      params:
