    call: openai-serving-responses.retrieve-responses
    input:
      response_id: = input.path.split('/')[3]
    as: r
    on_error:
    - when: config['enable-server-load-tracking']
      call: server-load-metrics.decrement
    - call: exception-handling.vllm-error-handler
      input:
        code: = error.code
        status: = error.status
        message: = error.message
  - when: config['enable-server-load-tracking']
    call: server-load-metrics.decrement
  - return: = vars.r.value
