- id: serving-api-r5-tool-choice-defaults
  name: tools without tool_choice default to auto and are refused without --enable-auto-tool-choice; a named choice is described as function "<name>"; tool_choice none still renders
    the tools into the template
  fixtures:
  - full-tp1-llama-8b
  max_events: 200000
  steps:
  - flow: serving-api-chat-completion
    as: auto
    input:
      body:
        messages:
        - role: user
          content: hi
        tools:
        - type: function
          function:
            name: get_weather
        tool_choice:
          $absent: true
  - flow: serving-api-chat-completion
    as: named
    input:
      body:
        messages:
        - role: user
          content: hi
        tools:
        - type: function
          function:
            name: get_weather
        tool_choice:
          type: function
          function:
            name: get_weather
  - flow: serving-api-chat-completion
    as: none
    input:
      body:
        max_tokens: 2
        messages:
        - role: user
          content: hi
        tools:
        - type: function
          function:
            name: get_weather
        tool_choice: none
  - flow: serving-api-chat-completion
    as: badfn
    input:
      body:
        messages:
        - role: user
          content: hi
        tools:
        - type: function
          function:
            name: get_weather
        tool_choice:
          type: function
          function: x
  expect:
  - steps.auto.result.error.status == 400 && steps.auto.result.error.message == '"auto" tool choice requires --enable-auto-tool-choice and --tool-call-parser to be set'
  - steps.named.result.error.message == 'tool_choice=function "get_weather" requires --tool-call-parser to be set'
  - steps.none.result.ok && trace.exists(e, e.type == 'call.start' && e.interface == 'hf-renderer.safe-apply-chat-template' && e.input.tools != null && e.input.tools[0].function.name
