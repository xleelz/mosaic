        input.body.stop != null ? input.body.stop : [], ''stop_token_ids'': has(input.body.stop_token_ids) && input.body.stop_token_ids != null ? input.body.stop_token_ids : [], ''ignore_eos'':
        has(input.body.ignore_eos) && input.body.ignore_eos == true, ''min_tokens'': has(input.body.min_tokens) && input.body.min_tokens != null ? input.body.min_tokens : 0, ''logprobs'':
        has(input.body.logprobs) && input.body.logprobs == true ? (has(input.body.top_logprobs) && input.body.top_logprobs != null ? input.body.top_logprobs : 0) : null, ''include_stop_str_in_output'':
        has(input.body.include_stop_str_in_output) && input.body.include_stop_str_in_output == true, ''skip_special_tokens'': !has(input.body.skip_special_tokens) || input.body.skip_special_tokens
        != false, ''output_kind'': has(input.body.stream) && input.body.stream == true ? ''DELTA'' : ''FINAL_ONLY''}), merge(has(input.body.seed) && input.body.seed != null ? dyn({''seed'':
        input.body.seed}) : dyn({}), vars.so != null ? dyn({''structured_outputs'': vars.so}) : dyn({}))), vars.opt.filter(k, vars.opt[k] != null).transformMapEntry(i, k, {k: vars.opt[k]}))'
