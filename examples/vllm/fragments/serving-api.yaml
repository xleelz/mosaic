- component: serving-tokens
  name: serve-tokens
  kind: function
  summary: 'ServingTokens.serve_tokens: token ids in, AsyncLLM.generate, token ids (and optionally text) out.'
  sources:
  - vllm/entrypoints/scale_out/token_in_token_out/serving.py:150-330
  request:
    type: object
    properties:
      body:
        type: object
        properties:
          model:
            type: string
            examples:
            - llama-8b
          token_ids:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: integer
              minimum: 1
              maximum: 128000
          sampling_params:
            type: object
            properties:
              max_tokens:
                type: integer
                examples:
                - 8
      x_request_id:
        type:
        - string
        - 'null'
    required:
    - body
  behavior:
  - title: The body parses as a GenerateRequest; its validators run first
    source: vllm/entrypoints/scale_out/token_in_token_out/api_router.py:46-60
    call: serving-tokens.validate-generate-request
    input:
      body: = input.body
  - call: base-serving.check-model
    input:
      model: '= has(input.body.model) ? input.body.model : '''''
  - call: generate-base-serving.preflight
    input:
      n: 1
  - call: base-renderer.tokenize-prompt
    input:
      prompt_token_ids: = input.body.token_ids
    as: tok
  - call: async-llm.generate
    input:
      request_id: '= ''generate-tokens-'' + (has(input.x_request_id) && input.x_request_id != null ? input.x_request_id : id(''random-uuid'', seq(''random-uuid'')))'
      prompt_token_ids: = vars.tok.value.prompt_token_ids
      sampling_params: '= has(input.body.sampling_params) ? input.body.sampling_params : {}'
    stream: true
    as: g
  - call: generate-base-serving.raise-if-error
    input:
      finish_reason: = vars.g.value.finish_reason
  - return:
      request_id: = vars.g.value.request_id
      choices:
      - index: 0
        token_ids: = vars.g.value.token_ids
        finish_reason: = vars.g.value.finish_reason
