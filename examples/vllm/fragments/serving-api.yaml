- component: mistral-tokenizer
  name: encode
  kind: function
  summary: 'MistralTokenizer.encode: BOS when special tokens are added, never EOS; truncation keeps the first max_length ids (max_length 0 gives an empty prompt).'
  sources:
  - vllm/tokenizers/mistral.py:368-384
  request:
    type: object
    properties:
      text:
        type: string
        examples:
        - hello world
      add_special_tokens:
        type: boolean
        default: true
      truncation:
        type:
        - boolean
        - 'null'
        default: null
      max_length:
        type:
        - integer
        - 'null'
        default: null
    required:
    - text
  behavior:
  - title: 'tokenizer.encode(text, bos=add_special_tokens, eos=False) (ASSUMPTION: one id per word, BOS id 1)'
    source: vllm/tokenizers/mistral.py:379
    set:
      vars.ids: '= (has(input.add_special_tokens) && !input.add_special_tokens ? [] : [1]) + (input.text.trim() == '''' ? [] : input.text.trim().split('' '').filter(w, w != '''').map(w,
        1000 + size(w)))'
  - if: '!(has(input.truncation) && input.truncation == false) && has(input.max_length) && input.max_length != null'
    then:
    - source: vllm/tokenizers/mistral.py:381-382
      return:
        ids: = vars.ids.slice(0, math.least([input.max_length, size(vars.ids)]))
  - return:
      ids: = vars.ids
