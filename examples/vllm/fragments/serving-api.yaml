    then:
    - source: vllm/renderers/params.py:249-254
      fail:
        code: vllm-validation-error
        message: '`truncation_side` must be either ''left'' or ''right''.'
        data:
          param: truncation_side
          value: = input.truncation_side
  - title: 'max_output_tokens above max_total_tokens: request fewer output tokens'
    source: vllm/renderers/params.py:256-267
