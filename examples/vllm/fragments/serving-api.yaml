- component: rl-online-router
  name: post-weight-checker
  kind: http
  summary: 'POST /weight_checker (dev mode): reset weights, or checksum every worker''s weights and optionally compare with a baseline.'
  sources:
  - vllm/entrypoints/rl/online/api_router.py:229-263
  attributes:
    method: POST
    path: /weight_checker
  request:
    type: object
    properties:
      path:
        type: string
        examples:
        - /weight_checker
      body:
        type:
        - object
        - array
        - 'null'
        default: null
        properties:
          action:
            type: string
            examples:
            - checksum
          baseline:
            type:
            - object
            - 'null'
            default: null
    required:
    - path
  errors:
  - code: Not Found
    status: 404
  - code: Bad Request
    status: 400
  - code: Internal Server Error
    status: 500
  behavior:
  - if: '!config[''vllm-server-dev-mode'']'
    then:
    - source: vllm/entrypoints/launchers/api_server/routers.py:45-47
      fail:
        code: Not Found
        status: 404
        message: Not Found
  - title: 'FastAPI body validation: action is a required embedded Literal[''checksum'', ''reset'', ''compare'']; a missing body, a non-object body or another action raises RequestValidationError,
      which the registered handler turns into 400'
    source: vllm/entrypoints/rl/online/api_router.py:229-234
    if: '!has(input.body) || input.body == null || type(input.body) != map || !(''action'' in input.body) || !(input.body.action in [''checksum'', ''reset'', ''compare''])'
    then:
    - source: vllm/entrypoints/serve/exception_handling/handlers/validation.py:149-175
      fail:
        code: Bad Request
        status: 400
        message: '= !has(input.body) || input.body == null || type(input.body) != map || !(''action'' in input.body) ? ''body.action: Field required'' : ''body.action: Input should be
          checksum, reset or compare'''
        data:
          param: body.action
  - if: input.body.action == 'reset'
    then:
    - source: vllm/entrypoints/rl/online/api_router.py:237-239
      call: async-llm.collective-rpc
      input:
        method: reset_weights
    - return:
        status: reset
  - if: input.body.action == 'compare' && (!has(input.body.baseline) || input.body.baseline == null)
    then:
    - source: vllm/entrypoints/rl/online/api_router.py:240-244
      fail:
        code: Bad Request
        status: 400
        message: action='compare' requires a 'baseline' object
  - call: async-llm.compute-weight-checksums
    as: cs
  - set:
      vars.checksums: {}
  - title: Merge the per-worker maps; a key reported twice is a 500
    source: vllm/entrypoints/rl/online/api_router.py:245-253
    foreach: = vars.cs.value
    as: wc
    max: 8
    steps:
    - if: vars.wc.exists(k, k in vars.checksums)
      then:
      - fail:
          code: Internal Server Error
          status: 500
          message: Duplicate weight checksum keys
    - set:
        vars.checksums: = merge(vars.checksums, vars.wc)
  - if: input.body.action == 'checksum'
    then:
    - return:
        checksums: = vars.checksums
  - source: vllm/entrypoints/rl/online/api_router.py:255-263
    set:
      vars.mismatches: = vars.checksums.filter(k, !(k in input.body.baseline) || input.body.baseline[k] != vars.checksums[k]) + input.body.baseline.filter(k, !(k in vars.checksums))
  - return:
      match: = size(vars.mismatches) == 0
      mismatches: = vars.mismatches
