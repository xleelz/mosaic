  summary: '_error_response: an exception becomes vLLM''s ErrorResponse first (create_error_response), then Cohere''s envelope: the same HTTP status (400 when it has none) and a body
    of just {message} (plus the request id when known).'
  sources:
  - vllm/entrypoints/cohere/api_router.py:102-117
  - vllm/entrypoints/cohere/api_router.py:190-198
  request:
    type: object
    properties:
      code:
        type: string
      status:
        type: integer
      message:
        type: string
      param:
        type:
        - string
        - 'null'
        default: null
      value:
        default: null
      request_id:
        type:
        - string
        - 'null'
        default: null
        description: '_request_id(raw_request): the request metadata''s id, else the X-Request-Id header'
