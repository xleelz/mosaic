- component: openai-serving-chat
  name: post-v1-chat-completions
  kind: http
  summary: 'POST /v1/chat/completions: an OpenAI chat completion, JSON or SSE'
  sources:
  - vllm/entrypoints/openai/chat_completion/api_router.py:41-80
  attributes:
    method: POST
    path: /v1/chat/completions
  request:
    type: object
    properties:
      path:
        type: string
        examples:
        - /v1/chat/completions
      headers:
        $ref: ServingHttpHeaders
      body:
        $ref: ServingChatCompletionRequest
    required:
    - path
  behavior:
  - call: launcher.accept-connection
  - title: ScalingMiddleware (outermost) refuses while elastic EP scales
    source: vllm/entrypoints/serve/middleware/register.py:43-47
    call: scaling-middleware.call
    input:
      path: = input.path
  - call: authentication-middleware.call
    input:
      path: = input.path
      headers: '= has(input.headers) ? input.headers : {}'
  - &id006
    title: 'validate_json_request (a route dependency, after the middleware): a Content-Type other than application/json is a RequestValidationError (ASSUMPTION: a request without the
      header is a JSON client''s)'
    source: vllm/entrypoints/serve/utils/api_utils.py:350-356
    if: has(input.headers) && input.headers != null && 'Content-Type' in input.headers && input.headers['Content-Type'].lowerAscii().split(';')[0].trim() != 'application/json'
    then:
    - title: 'validation_exception_handler: ''<n> validation error:'' plus each error, type Bad Request, no param'
      source: vllm/entrypoints/serve/exception_handling/handlers/validation.py:150-180
      fail:
        code: Bad Request
        status: 400
        message: |-
          1 validation error:
            Unsupported Media Type: Only 'application/json' is allowed
  - title: load_aware_call counts the request
    source: vllm/entrypoints/serve/utils/api_utils.py:110-117
    when: config['enable-server-load-tracking']
    call: server-load-metrics.increment
  - title: 'with_cancellation: the handler races a client-disconnect listener'
    source: vllm/entrypoints/serve/utils/api_utils.py:75-91
    call: openai-serving-chat.create-chat-completion
    input:
      body: = input.body
      x_request_id: '= has(input.headers) && ''X-Request-Id'' in input.headers ? input.headers[''X-Request-Id''] : null'
    as: res
    on_error:
    - when: error.code == 'canceled' && config['enable-server-load-tracking']
      title: listen_for_disconnect saw http.disconnect and decremented the counter
      source: vllm/entrypoints/serve/utils/api_utils.py:40-48
      call: server-load-metrics.decrement
    - when: error.code == 'canceled'
      title: 'The client disconnected first: the handler task is cancelled and the wrapper returns None'
      source: vllm/entrypoints/serve/utils/api_utils.py:83-91
      return:
        disconnected: true
    - when: config['enable-server-load-tracking']
      title: load_aware_call decrements on an exception or error response
      source: vllm/entrypoints/serve/utils/api_utils.py:118-145
      call: server-load-metrics.decrement
    - call: exception-handling.vllm-error-handler
      input:
        code: = error.code
        status: = error.status
        message: = error.message
        param: '= has(error.data) && error.data != null && ''param'' in error.data ? error.data.param : (has(error.data) && error.data != null && ''parameter'' in error.data ? error.data.parameter
          : null)'
        value: '= has(error.data) && error.data != null && ''value'' in error.data ? error.data.value : null'
    token: '= ''disconnect-chatcmpl-'' + (has(input.headers) && ''X-Request-Id'' in input.headers ? input.headers[''X-Request-Id''] : ''anonymous'')'
    stream: true
    on_item:
    - if: has(input.body) && input.body != null && has(input.body.stream) && input.body.stream == true
      then:
      - title: StreamingResponse sends each SSE frame as it is produced
        source: vllm/entrypoints/openai/chat_completion/api_router.py:75-80
        yield: = vars.item
  - when: config['enable-server-load-tracking']
    title: The response's BackgroundTask decrements the counter
    source: vllm/entrypoints/serve/utils/api_utils.py:124-139
    call: server-load-metrics.decrement
  - set:
      vars.out: = vars.res.value
  - &id007
    if: config['enable-request-id-headers'] && type(vars.res.value) == map
    then:
    - title: 'XRequestIdMiddleware appends X-Request-Id to the response: the request''s header, else uuid4().hex'
      source: vllm/entrypoints/serve/middleware/x_request_id.py:25-35
      set:
