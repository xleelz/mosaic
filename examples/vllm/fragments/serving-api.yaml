      != null ? vars.a.pipeline_parallel_size : config[''pipeline-parallel-size''], ''data_parallel_size'': has(vars.a.data_parallel_size) && vars.a.data_parallel_size != null ? vars.a.data_parallel_size
      : int(config[''data-parallel-size''])}, vars.passed.transformMapEntry(i, k, {k: vars.a[k]}))'
