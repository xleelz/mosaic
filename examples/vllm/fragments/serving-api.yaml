    - source: vllm/entrypoints/launchers/api_server/routers.py:45-47
      fail:
        code: Not Found
        status: 404
        message: Not Found
  - if: '!has(input.body) || input.body == null'
    then:
    - source: vllm/entrypoints/rl/online/api_router.py:101-107
      fail:
        code: Bad Request
        status: 400
        message: Request body must be a JSON object
  - if: has(input.body.request_ids) && size(input.body.request_ids) > 0
    then:
    - source: vllm/entrypoints/rl/online/api_router.py:110-112
      call: async-llm.abort
      input:
        request_ids: = input.body.request_ids
        internal: false
    - return:
        status: aborted
        aborted: = size(input.body.request_ids)
  - title: 'No ids: abort every request_states / parent_requests id the output processor tracks (internal ids; the list lives in engine-core, passed here as empty)'
    source: vllm/entrypoints/rl/online/api_router.py:113-124
    call: async-llm.abort
    input:
      request_ids: []
      internal: true
  - return:
      status: aborted
      aborted: 0
