  - steps.missing.result.error.code == 'vllm-validation-error' && steps.missing.result.error.data.param == 'chat_template'
  - steps.auto.result.error.code == 'type-error' && steps.logs.result.error.code == 'type-error' && steps.sse.result.error.code == 'value-error' && steps.prm.result.error.code == 'value-error'
