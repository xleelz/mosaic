- component: async-llm
  name: generate
  kind: function
  summary: 'AsyncLLM.generate: adds the request (EngineCoreRequest over ZMQ) and yields RequestOutputs until finished; modeled as one call returning the final output. (contract copied
    from engine-core''s fragment)'
  sources:
  - vllm/v1/engine/async_llm.py:698
  attributes:
    boundary: true
    owner: engine-core
  request:
    allOf:
    - type: object
      required:
      - request_id
      - prompt_token_ids
      - sampling_params
      properties:
        request_id:
          type: string
          examples:
          - chatcmpl-abc123
        prompt_token_ids:
          type: array
          items:
            type: integer
          examples:
          - - 128000
            - 9906
            - 1917
        arrival_time:
          type: number
        priority:
          type: integer
          examples:
          - 0
        external_req_id:
          type:
          - string
          - 'null'
          default: null
          description: set by assign_request_id; callers leave it unset
        data_parallel_rank:
          type:
          - integer
          - 'null'
          default: null
        pooling_params:
          type:
          - object
          - 'null'
          default: null
        abort_immediately:
          type: boolean
          default: false
        client_index:
          type: integer
          default: 0
        lora_request:
          type:
          - object
          - 'null'
          default: null
          description: LoRARequest {lora_name, lora_int_id, lora_path}
          properties:
            lora_name:
              type: string
            lora_int_id:
              type: integer
            lora_path:
              type: string
        cache_salt:
          type:
          - string
          - 'null'
          default: null
          description: 'the prompt''s cache_salt: an extra key of the first block hash'
        mm_features:
          type:
          - array
          - 'null'
          default: null
          description: MultiModalFeatureSpec items {mm_hash, data}; data is null when P0's sender cache says P1 already holds it
          items:
            type: object
            properties:
              mm_hash:
                type: string
              identifier:
                type: string
              modality:
                type: string
              offset:
                type: integer
                description: PlaceholderRange.offset in the prompt
              length:
                type: integer
              num_embeds:
                type: integer
              data: {}
        sampling_params:
          type: object
          properties:
            temperature:
              type: number
              default: 1.0
              examples:
              - 0.0
            top_p:
              type: number
              default: 1.0
              examples:
              - 1.0
            max_tokens:
              type:
              - integer
              - 'null'
              default: null
              examples:
              - 16
              description: null means up to max_model_len minus the prompt
            stop:
              type: array
              items:
                type: string
              default: []
            n:
              type: integer
              default: 1
              examples:
              - 1
            seed:
              type: integer
            ignore_eos:
              type: boolean
              default: false
            output_kind:
              type: string
              enum:
              - cumulative
              - delta
              - final_only
              - CUMULATIVE
              - DELTA
              - FINAL_ONLY
              default: cumulative
            min_tokens:
              type: integer
              default: 0
            stop_token_ids:
              type: array
              items:
                type: integer
              default: []
            include_stop_str_in_output:
              type: boolean
              default: false
            structured_outputs:
              type:
              - object
              - 'null'
              default: null
              properties:
                regex:
                  type: string
                json: {}
                choice:
                  type: array
                  items:
                    type: string
                grammar:
                  type: string
                json_object:
                  type:
                  - boolean
                  - 'null'
                structural_tag:
                  type:
                  - string
                  - 'null'
                _backend:
                  type:
                  - string
                  - 'null'
                  description: the backend auto resolved to
            logprobs:
              type:
              - integer
              - 'null'
              default: null
              description: number of sample logprobs per token (-1 = the vocab)
            skip_special_tokens:
              type: boolean
              default: true
            eos_token_id:
              type:
              - integer
              - 'null'
              default: null
            watermarking:
              type:
              - boolean
              - 'null'
              default: null
              description: per-request watermark switch; null follows the engine's watermark_config
            extra_args:
              type:
              - object
              - 'null'
              default: null
    - type: object
      properties:
        cancel_token:
          type:
          - string
          - 'null'
          default: null
          description: The caller's cancellation token (serving-api's disconnect token); null means 'disconnect-' + request_id
  response:
    type: object
    properties:
      request_id:
        type: string
        examples:
        - chatcmpl-req-1
      finished:
        type: boolean
        default: true
      finish_reason:
        type:
        - string
        - 'null'
        examples:
        - stop
      num_outputs:
        type: integer
        default: 1
      token_ids:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 128000
        minItems: 7
        maxItems: 7
      text:
        type: string
        examples:
        - The capital of France is Paris.
  errors:
  - code: engine-dead-error
    status: 500
    retryable: false
  - code: vllm-validation-error
    status: 0
    retryable: false
  - code: queue-overflow-error
    status: 0
    retryable: true
  - code: max-queued-tokens-error
    status: 0
    retryable: true
  - code: engine-generate-error
    status: 0
    retryable: false
  - code: canceled
    status: 0
