    - body
  behavior:
  - title: to_chat_completion_request -- system prompt first, then the messages
    source: vllm/entrypoints/anthropic/serving.py:323-350
    set:
      vars.chat: '= {''model'': has(input.body.model) ? input.body.model : '''', ''max_tokens'': input.body.max_tokens, ''messages'': (has(input.body.system) && input.body.system !=
        null ? [{''role'': ''system'', ''content'': input.body.system}] : []) + input.body.messages, ''stream'': has(input.body.stream) && input.body.stream}'
  - call: openai-serving-chat.create-chat-completion
    input:
      body: = vars.chat
      x_request_id: '= has(input.x_request_id) ? input.x_request_id : null'
    as: c
    stream: true
  - if: has(vars.c.value.stream) && vars.c.value.stream
    then:
    - title: message_stream_converter
      source: vllm/entrypoints/anthropic/serving.py:882-890
      return:
        stream: true
        events: = vars.c.value.events
  - title: messages_full_converter; length maps to max_tokens, stop to end_turn
    source: vllm/entrypoints/anthropic/serving.py:102-131
    return:
      id: = 'msg_' + vars.c.value.id
      type: message
      role: assistant
      model: = vars.c.value.model
      content: '= [{''type'': ''text'', ''text'': vars.c.value.choices[0].message.content}]'
      stop_reason: '= vars.c.value.choices[0].finish_reason == ''length'' ? ''max_tokens'' : (vars.c.value.choices[0].finish_reason in [''stop'', ''tool_calls''] ? dyn(''end_turn'')
        : null)'
      usage:
        input_tokens: = vars.c.value.usage.prompt_tokens
        output_tokens: = vars.c.value.usage.completion_tokens
