scenarios:
- id: serving-api-chat-tool-usage-validation
  name: 'check_tool_usage: empty tools, tool_choice without tools, an unknown string choice, a named choice that matches no tool (all 400); a matching named choice is accepted'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: serving-api-chat-completion
    as: empty
    input:
      body:
        max_tokens: 4
        tools: []
  - flow: serving-api-chat-completion
    as: notools
    input:
      body:
        max_tokens: 4
        tool_choice: required
  - flow: serving-api-chat-completion
    as: weird
    input:
      body:
        max_tokens: 4
        tool_choice: sometimes
        tools:
        - type: function
          function:
            name: get_weather
  - flow: serving-api-chat-completion
    as: noname
    input:
      body:
        max_tokens: 4
        tool_choice:
          type: function
          function: {}
        tools:
        - type: function
          function:
            name: get_weather
  - flow: serving-api-chat-completion
    as: nomatch
    input:
      body:
        max_tokens: 4
        tool_choice:
          type: function
          function:
            name: get_time
        tools:
        - type: function
          function:
            name: get_weather
  - interface: openai-serving-chat.check-tool-usage
    caller: api-server
    as: named
    input:
      body:
        messages:
        - role: user
          content: hi
        tool_choice:
          type: function
          function:
            name: get_weather
        tools:
        - type: function
          function:
            name: get_weather
  - interface: openai-serving-chat.check-tool-usage
    caller: api-server
    as: dflt
    input:
      body:
        messages:
        - role: user
          content: hi
        tools:
        - type: function
          function:
            name: get_weather
  - interface: openai-serving-chat.check-tool-usage
    caller: api-server
    as: none
    input:
      body:
        messages:
        - role: user
          content: hi
        tool_choice: none
  - interface: openai-serving-chat.check-tool-usage
    caller: api-server
    as: auto
    input:
      body:
        messages:
        - role: user
          content: hi
        tool_choice: auto
        tools:
        - type: function
          function:
            name: f
  expect:
  - steps.empty.result.error.status == 400 && steps.empty.result.error.data.param == 'tools'
  - steps.notools.result.error.message.startsWith('When using `tool_choice`, `tools` must be set.') && steps.weird.result.error.data.param == 'tool_choice'
  - steps.noname.result.error.data.param == 'tool_choice.function.name' && steps.nomatch.result.error.message.startsWith('The tool specified in `tool_choice` does not match')
  - steps.named.result.ok && steps.dflt.result.value.tool_choice == 'auto' && steps.none.result.value.tool_choice == 'none' && steps.auto.result.value.tool_choice == 'auto'
  - calls['async-llm.generate'] == 0
- id: serving-api-protocol-validators
  name: Batch chat refuses n>1, beam search, logprob_token_ids without logprobs and a pre-tokenized kv_transfer prompt; /inference/v1/generate refuses empty or negative token ids, content_parts
    with features, and text output without detokenize
  fixtures:
  - full-tp1-llama-8b
  config:
    enable-scale-out: true
  steps:
  - interface: openai-serving-chat-batch.check-batch-mode
    caller: api-server
    as: bn
    input:
      body:
        n: 2
  - interface: openai-serving-chat-batch.check-batch-mode
    caller: api-server
    as: bb
    input:
      body:
        use_beam_search: true
  - interface: openai-serving-chat-batch.check-batch-mode
    caller: api-server
    as: bl
    input:
      body:
        logprob_token_ids:
        - 5
  - interface: openai-serving-chat-batch.check-batch-mode
    caller: api-server
    as: bk
    input:
      body:
        kv_transfer_params:
          prompt_token_ids:
          - 1
          - 2
  - interface: openai-serving-chat-batch.check-batch-mode
    caller: api-server
    as: bok
    input:
      body:
        n: 1
  - interface: serving-tokens.validate-generate-request
    caller: api-server
    as: gneg
    input:
      body:
        token_ids:
        - 1
        - -2
  - interface: serving-tokens.validate-generate-request
    caller: api-server
    as: gempty
    input:
      body:
        token_ids: []
  - interface: serving-tokens.validate-generate-request
    caller: api-server
    as: gboth
    input:
      body:
        token_ids:
        - 1
        content_parts:
        - type: text
        features: {}
  - interface: serving-tokens.validate-generate-request
    caller: api-server
    as: gtext
    input:
      body:
        token_ids:
        - 1
        output_mode: text
        sampling_params:
          detokenize: false
  - interface: serving-tokens.validate-generate-request
    caller: api-server
    as: gok
    input:
      body:
        token_ids:
        - 128000
        - 9906
  expect:
  - steps.bn.result.error.data.param == 'n' && steps.bb.result.error.data.param == 'use_beam_search' && steps.bl.result.error.data.param == 'logprob_token_ids' && steps.bk.result.error.data.param
    == 'kv_transfer_params.prompt_token_ids' && steps.bok.result.ok
  - steps.gneg.result.error.status == 400 && steps.gneg.result.error.message.contains('negative') && steps.gempty.result.error.status == 400
  - steps.gboth.result.error.message.contains('mutually exclusive') && steps.gtext.result.error.message.contains('requires sampling_params.detokenize') && steps.gok.result.ok
- id: serving-api-pooling-params-verify
  name: 'PoolingParams.verify: dimensions need a Matryoshka model and a valid size; classify takes no dimensions; plugin tasks skip'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: pooling-params.verify
    caller: api-server
    as: plain
    input:
      task: embed
  - interface: pooling-params.verify
    caller: api-server
    as: nomat
    input:
      task: embed
      dimensions: 256
  - interface: pooling-params.verify
    caller: api-server
    as: range
    input:
      task: embed
      dimensions: 9999
      is_matryoshka: true
  - interface: pooling-params.verify
    caller: api-server
    as: listed
    input:
      task: embed
      dimensions: 300
      is_matryoshka: true
      matryoshka_dimensions:
      - 256
      - 512
  - interface: pooling-params.verify
    caller: api-server
    as: okdim
    input:
      task: embed
      dimensions: 256
      is_matryoshka: true
      matryoshka_dimensions:
      - 256
      - 512
  - interface: pooling-params.verify
    caller: api-server
    as: cls
    input:
      task: classify
      dimensions: 8
  - interface: pooling-params.verify
    caller: api-server
    as: plugin
    input:
      task: plugin
  expect:
  - steps.plain.result.value.use_activation && steps.okdim.result.value.dimensions == 256 && !steps.plugin.result.value.verified
  - steps.nomat.result.error.message.contains('does not support Matryoshka') && steps.range.result.error.message.contains('only supports dimensions in range [1, 4096]') && steps.listed.result.error.message.contains('only
    supports Matryoshka dimensions')
  - steps.cls.result.error.message.contains('does not support')
- id: serving-api-mistral-tokenizer
  name: A Mistral-format repo resolves to MistralTokenizer (Tekken); encode adds BOS but no EOS and truncates to max_length
  fixtures:
  - full-tp1-llama-8b
  state:
    hf-hub:
      repos:
        mistralai/Mistral-7B-Instruct-v0.3:
          files:
          - tekken.json
          - params.json
        mistralai/odd:
          files:
          - config.json
      models:
        mistralai/Mistral-7B-Instruct-v0.3:
          architectures:
          - MistralForCausalLM
          vocab_size: 32768
          max_position_embeddings: 32768
          num_attention_heads: 32
          num_key_value_heads: 8
  steps:
  - interface: tokenizer-registry.get-tokenizer
    caller: api-server
    as: tok
    input:
      tokenizer_name: mistralai/Mistral-7B-Instruct-v0.3
  - interface: mistral-tokenizer.from-pretrained
    caller: api-server
    as: odd
    input:
      path_or_repo_id: mistralai/odd
  - interface: mistral-tokenizer.encode
    caller: api-server
    as: enc
    input:
      text: hello big world
  - interface: mistral-tokenizer.encode
    caller: api-server
    as: cut
    input:
      text: hello big world
      max_length: 2
  expect:
  - steps.tok.result.value.tokenizer_class == 'MistralTokenizer' && trace.exists(e, e.type == 'call.end' && e.interface == 'mistral-tokenizer.from-pretrained' && e.output.is_tekken &&
    e.output.revision == 'main')
  - '!steps.odd.result.ok && steps.enc.result.value.ids == [1, 1005, 1003, 1005] && steps.cut.result.value.ids == [1, 1005]'
- id: serving-api-systemone-and-download-kernels
  name: /v1/systemone is 501 for Llama (no read strategy) and served for a Qwen3 model; vllm download-kernels picks the FlashInfer command
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: serving-structured-decisions.post-v1-systemone
    caller: api-client
    as: llama
    input:
      path: /v1/systemone
      body:
        model: llama-8b
        questions:
        - id: q1
  - interface: download-kernels-subcommand.cmd
    caller: operator
    as: dl
    input:
      dry_run: true
  - interface: download-kernels-subcommand.cmd
    caller: operator
    as: cubin
    input:
      jit_cache_wheels: false
  - interface: download-kernels-subcommand.cmd
    caller: operator
    as: none
    input:
      flashinfer_installed: false
  expect:
  - '!steps.llama.result.ok && steps.llama.result.error.status == 501'
  - steps.dl.result.value.command == ['python', '-m', 'flashinfer', 'download-kernels', '--dry-run'] && steps.cubin.result.value.command[3] == 'install-cubin-wheel' && steps.none.result.value.command
    == null
- id: serving-api-systemone-qwen3
  name: '/v1/systemone on a Qwen3 model: the NextToken strategy serves it'
  fixtures:
  - full-tp1-llama-8b
  config:
    model: Qwen/Qwen3-0.6B
  state:
    hf-hub:
      models:
        Qwen/Qwen3-0.6B:
          architectures:
          - Qwen3ForCausalLM
          vocab_size: 151936
          max_position_embeddings: 40960
          num_attention_heads: 16
          num_key_value_heads: 8
  steps:
  - interface: serving-structured-decisions.post-v1-systemone
    caller: api-client
    as: q
    input:
      path: /v1/systemone
      body:
        model: llama-8b
        questions:
        - id: q1
  expect:
  - steps.q.result.ok && steps.q.result.value.strategy == 'NextTokenStrategy'
- id: serving-api-cohere-sources-and-errors
  name: 'Cohere: citable positions number documents then tool buckets (JSON-object tool text spread into tool_output); render errors use Cohere''s {message} envelope'
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-enable-cohere-api: true
  steps:
  - interface: cohere-serving-chat-v2.build-position-to-source
    caller: api-server
    as: pos
    input:
      documents:
      - plain doc
      messages:
      - role: user
        content: q
      - role: assistant
        tool_plan: plan
        tool_calls:
        - id: call_a
          type: function
          function:
            name: f
            arguments: '{}'
      - role: tool
        tool_call_id: call_a
        content:
        - type: text
          text: '{"title": "hi"}'
        - type: text
          text: plain words
        - type: document
          document:
            id: res_x
            data:
              text: x
  - interface: cohere-serving-chat-v2.post-cohere-v2-chat-render
    caller: api-client
    as: r404
    input:
      path: /cohere/v2/chat/render
      body:
        model: unknown
        messages:
        - role: user
          content: hi
  expect:
  - 'steps.pos.result.value.positions[0].bucket == 0 && steps.pos.result.value.positions[0].id == ''doc_0'' && steps.pos.result.value.positions[0].document == {''text'': ''plain doc''}'
  - 'steps.pos.result.value.positions[1].bucket == 1 && steps.pos.result.value.positions[1].tool_output == {''title'': ''hi''} && steps.pos.result.value.positions[1].id == null'
  - 'steps.pos.result.value.positions[2].tool_output == {''content'': ''plain words''} && steps.pos.result.value.positions[3].id == ''res_x'' && steps.pos.result.value.positions[3].idx
    == 2'
  - steps.r404.result.error.status == 404 && steps.r404.result.error.data.body.message == steps.r404.result.error.message && steps.r404.result.error.data.body.id == 'req-1'
- id: serving-api-serve-args-validation
  name: 'validate_parsed_serve_args: an existing --chat-template file passes; a path-like missing one, auto tool choice without a parser and per-request metrics without stats are refused'
  fixtures:
  - full-tp1-llama-8b
  state:
    local-disk:
      paths:
        examples/template_chatml.jinja:
          exists: true
          is_dir: false
  steps:
  - interface: cli-args.validate-parsed-serve-args
    caller: operator
    as: ok
