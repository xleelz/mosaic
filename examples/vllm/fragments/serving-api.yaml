- component: openai-serving-chat
  name: to-sampling-params
  kind: function
  summary: 'ChatCompletionRequest.to_sampling_params: request value, else the server default (generation_config), else the OpenAI default; stop, seed, structured outputs and DELTA output
    for streams.'
  sources:
  - vllm/entrypoints/openai/chat_completion/protocol.py:715-786
  request:
    type: object
    properties:
      body:
        $ref: ServingChatCompletionRequest
      max_tokens:
        type: integer
      defaults:
        type: object
    required:
    - body
    - max_tokens
  behavior:
  - title: 'Priority: user -> server default (model generation_config) -> OpenAI default'
    source: vllm/entrypoints/openai/chat_completion/protocol.py:720-728
    set:
      vars.d: '= has(input.defaults) && input.defaults != null ? input.defaults : {}'
      vars.oa: '= {''repetition_penalty'': 1.0, ''presence_penalty'': 0.0, ''frequency_penalty'': 0.0, ''temperature'': 1.0, ''top_p'': 1.0, ''top_k'': 0, ''min_p'': 0.0}'
  - set:
      vars.sp: '= vars.oa.transformMap(k, v, (k in input.body && input.body[k] != null) ? input.body[k] : ((k in vars.d) ? vars.d[k] : v))'
  - title: response_format overrides structured_outputs (json_object, json_schema, structural_tag); the json_schema's schema arrives under its wire alias `schema`
    source: vllm/entrypoints/generate/base/protocol.py:136-211
    set:
      vars.so: '= has(input.body.response_format) && input.body.response_format != null && input.body.response_format.type != ''text'' ? merge(has(input.body.structured_outputs) && input.body.structured_outputs
        != null ? input.body.structured_outputs : {}, input.body.response_format.type == ''json_object'' ? {''json_object'': true} : (input.body.response_format.type == ''json_schema''
        ? {''json'': has(input.body.response_format.json_schema.schema) ? input.body.response_format.json_schema.schema : (has(input.body.response_format.json_schema.json_schema) ? input.body.response_format.json_schema.json_schema
        : null)} : {''structural_tag'': input.body.response_format})) : (has(input.body.structured_outputs) ? input.body.structured_outputs : null)'
  - title: logit_bias, allowed_token_ids, bad_words, stream_interval; prompt_logprobs, else top_logprobs when echo is set
    source: vllm/entrypoints/openai/chat_completion/protocol.py:742-744
    set:
      vars.opt: '= {''logit_bias'': has(input.body.logit_bias) ? input.body.logit_bias : null, ''allowed_token_ids'': has(input.body.allowed_token_ids) ? input.body.allowed_token_ids
        : null, ''bad_words'': has(input.body.bad_words) ? input.body.bad_words : null, ''stream_interval'': has(input.body.stream_interval) ? input.body.stream_interval : null, ''prompt_logprobs'':
