- component: pooling-base-serving
  name: serve
  kind: function
  summary: 'PoolingBaseServing.__call__: model check, preprocessing, one encode per input (merged), collect with error mapping, build the response.'
  sources:
  - vllm/entrypoints/pooling/base/serving.py:65-220
  request:
    type: object
    properties:
      task:
        type: string
        examples:
        - embed
      prefix:
        type: string
        examples:
        - embd
      body:
        type: object
        properties:
          model:
            type: string
            examples:
            - llama-8b
          input:
            type: array
            items:
              type: string
            default:
            - hello world
      x_request_id:
        type:
        - string
        - 'null'
    required:
    - task
    - body
  errors:
  - code: value-error
    status: 0
  - code: generation-error
    status: 0
  behavior:
  - call: base-serving.check-model
    input:
      model: '= has(input.body.model) ? input.body.model : '''''
    as: model
  - set:
      vars.inputs: '= type(input.body.input) == string ? [input.body.input] : input.body.input'
      vars.request_id: '= input.prefix + ''-'' + (has(input.x_request_id) && input.x_request_id != null ? input.x_request_id : id(''random-uuid'', seq(''random-uuid'')))'
  - if: size(vars.inputs) == 0
    then:
    - source: vllm/entrypoints/pooling/base/serving.py:83-85
      fail:
        code: value-error
        message: You must pass at least one prompt
  - title: One encode per input, merged (merge_async_iterators)
    source: vllm/entrypoints/pooling/base/serving.py:134-180
    parallel: = vars.inputs
    as: text
    steps:
    - call: base-renderer.tokenize-prompt
      input:
        prompt: = vars.text
      as: tok
    - call: async-llm.encode
      input:
        request_id: = vars.request_id + '-' + string(vars.index)
        prompt_token_ids: = vars.tok.value.prompt_token_ids
        pooling_params:
          task: = input.task
      as: e
      on_error: continue
    - return: '= {''error'': vars.e.ok ? null : vars.e.error, ''data'': !vars.e.ok || vars.e.value == null || !has(vars.e.value.outputs) ? [] : vars.e.value.outputs.data, ''prompt_tokens'':
        size(vars.tok.value.prompt_token_ids)}'
    join:
      need: all
    as_result: outs
    on_insufficient:
      code: generation-error
  - title: The first exception out of merge_async_iterators propagates (a validation error stays a 400)
    source: vllm/entrypoints/pooling/base/serving.py:189-200
    foreach: = vars.outs.results
    as: o
    max: 16
    steps:
    - if: vars.o.value.error != null
      then:
      - fail: = vars.o.value.error
  - title: Each PoolingRequestOutput carries the pooled data and its prompt token ids (usage counts them)
    source: vllm/outputs.py:280-319
    set:
      vars.ptoks: = sum(vars.outs.results.map(r, r.value.prompt_tokens))
  - if: input.task == 'pooling'
    then:
    - title: 'PoolingResponse: id pool-<id>, object list, one PoolingResponseData per input'
      source: vllm/entrypoints/pooling/pooling/protocol.py:108-114
      return:
        id: = vars.request_id
        object: list
        created: = now / 1000
        model: = vars.model.value.model_name
        data: '= vars.outs.results.map(r, {''index'': r.index, ''object'': ''pooling'', ''data'': r.value.data})'
        usage:
          prompt_tokens: = vars.ptoks
          total_tokens: = vars.ptoks
  - return:
      id: = vars.request_id
      object: list
      created: = now / 1000
      model: = vars.model.value.model_name
      data: '= vars.outs.results.map(r, {''index'': r.index, ''object'': input.task == ''embed'' ? ''embedding'' : input.task, ''embedding'': r.value.data})'
      usage:
        prompt_tokens: = vars.ptoks
        total_tokens: = vars.ptoks
