- id: serving-api-rl-error-paths
  name: RL route error mapping and the weight checker
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-server-dev-mode: true
  faults:
  - target: async-llm.pause-generation
    type: error
    code: value-error
    message: invalid mode
    calls:
    - 1
  - target: async-llm.pause-generation
    type: error
    code: runtime-error
    message: boom
    calls:
    - 2
  - target: async-llm.resume-generation
    type: error
    code: runtime-error
    message: boom
  steps:
  - interface: rl-online-router.post-pause
    caller: api-client
    as: p400
    input:
      path: /pause
  - interface: rl-online-router.post-pause
    caller: api-client
    as: p500
    input:
      path: /pause
  - interface: rl-online-router.post-resume
    caller: api-client
    as: r500
    input:
      path: /resume
  - interface: rl-online-router.post-abort-requests
    caller: api-client
    as: nobody
    input:
      path: /abort_requests
      body: null
  - interface: rl-online-router.post-weight-checker
    caller: api-client
    as: reset
    input:
      path: /weight_checker
      body:
        action: reset
  - interface: rl-online-router.post-weight-checker
    caller: api-client
    as: nobase
    input:
      path: /weight_checker
      body:
        action: compare
  - interface: rl-online-router.post-weight-checker
    caller: api-client
    as: sum
    input:
      path: /weight_checker
      body:
        action: checksum
  - interface: rl-online-router.post-weight-checker
    caller: api-client
    as: cmp
    input:
      path: /weight_checker
      body:
        action: compare
        baseline:
          model.embed_tokens.weight: 0
  expect:
  - '!steps.p400.result.ok && steps.p400.result.error.status == 400 && !steps.p500.result.ok && steps.p500.result.error.status == 500'
  - '!steps.r500.result.ok && steps.r500.result.error.status == 500'
  - steps.reset.result.value.status == 'reset' && !steps.nobase.result.ok && steps.nobase.result.error.status == 400
  - steps.sum.result.ok && size(steps.sum.result.value.checksums) > 0
  - steps.cmp.result.ok && steps.cmp.result.value.match == false && 'model.embed_tokens.weight' in steps.cmp.result.value.mismatches
  - trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.compute-weight-checksums')
