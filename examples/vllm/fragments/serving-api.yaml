- id: serving-api-rerank-and-score-responses
  name: /rerank sorts results by relevance and applies top_n; /score keeps pair order with usage totals
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: serving-scores.build-response
    caller: api-server
    as: rr
    input:
      prefix: rerank
      request_id: rerank-1
      model_name: llama-8b
      scores:
      - 0.1
      - 0.9
      - 0.5
      documents:
      - a
      - b
      - c
      top_n: 2
      num_prompt_tokens: 7
  - interface: serving-scores.build-response
    caller: api-server
    as: sc
