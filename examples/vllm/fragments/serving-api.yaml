fixtures:
- id: serving-api-seed
  summary: 'serving-api''s own starting state: a generate model''s app state, no stored responses, no LoRA adapters.'
  state:
    app-state:
      supported_tasks:
      - generate
      initialized: true
    openai-serving-models:
      lora_requests: {}
      lora_id_counter: 0
    openai-serving-responses:
      response_store: {}
      msg_store: {}
      background_tasks: {}
      seq: 0
schemas:
- id: ServingHttpHeaders
  summary: The request headers the routes read (Authorization for --api-key, X-Request-Id for the request id).
  schema:
    type: object
    properties:
      Authorization:
        type: string
        examples:
        - Bearer token-abc123
      X-Request-Id:
        type: string
        examples:
        - req-1
      Content-Type:
        type: string
        default: application/json
        description: validate_json_request reads it; JSON clients send application/json
- id: ServingErrorResponse
  summary: 'ErrorResponse{error: ErrorInfo{message, type, param, code}} (serve/engine/protocol.py:79-87).'
  schema:
    type: object
    properties:
      error:
        type: object
        properties:
          message: &id001
            type: string
          type:
            type: string
            examples:
            - BadRequestError
          param: *id001
          code:
            type: integer
            examples:
            - 400
- id: ServingChatCompletionRequest
  summary: ChatCompletionRequest body fields the model reads (openai/chat_completion/protocol.py). Branch fields (chat_template, tool_choice, ...) come from scenario input only.
  schema:
    type: object
    properties:
      model:
        type: string
        examples:
        - llama-8b
      messages:
        type: array
        items: &id005
          type: object
          properties:
            role:
              type: string
              examples:
              - user
            content:
              type:
              - string
              - array
              - 'null'
              examples:
              - What is the capital of France?
            tool_calls:
              type:
              - array
              - 'null'
              items:
                type: object
              default: null
          required:
          - role
          - content
        default:
        - role: user
          content: What is the capital of France?
      max_tokens:
        type: integer
        examples:
        - 16
      max_completion_tokens:
        type:
        - integer
        - 'null'
        default: null
      stream:
        type: boolean
        default: false
      n:
        type: integer
        default: 1
      temperature:
        type:
        - number
        - 'null'
        default: null
      top_p:
        type:
        - number
        - 'null'
        default: null
      top_k:
        type:
        - integer
        - 'null'
        default: null
      min_p:
        type:
        - number
        - 'null'
        default: null
      seed:
        type:
        - integer
        - 'null'
        default: null
      stop:
        type:
        - string
        - array
        - 'null'
        items: *id001
        default: null
      stop_token_ids:
        type:
        - array
        - 'null'
        items: &id002
          type: integer
        default: null
      include_stop_str_in_output:
        type: boolean
        default: false
      ignore_eos:
        type: boolean
        default: false
      presence_penalty:
        type:
        - number
        - 'null'
        default: null
      frequency_penalty:
        type:
        - number
        - 'null'
        default: null
      repetition_penalty:
        type:
        - number
        - 'null'
        default: null
      response_format:
        type:
        - object
        - 'null'
        default: null
      structured_outputs:
        type:
        - object
        - 'null'
        default: null
      cache_salt:
        type:
        - string
        - 'null'
        default: null
      tools:
        type:
        - array
        - 'null'
        items:
          type: object
        default: null
      tool_choice:
        type:
        - string
        - object
        - 'null'
        default: null
      stream_options:
        type:
        - object
        - 'null'
        default: null
      chat_template:
        type:
        - string
        - 'null'
        default: null
      media_io_kwargs:
        type:
        - object
        - 'null'
        default: null
      mm_processor_kwargs:
        type:
        - object
        - 'null'
        default: null
      priority:
        type:
        - integer
        - 'null'
        default: null
      min_tokens:
        type:
        - integer
        - 'null'
        default: 0
      logprobs:
        type:
        - boolean
        - 'null'
        default: false
      top_logprobs:
        type:
        - integer
        - 'null'
        default: 0
      skip_special_tokens:
        type:
        - boolean
        - 'null'
        default: true
      logit_bias:
        type:
        - object
        - 'null'
        default: null
      allowed_token_ids:
        type:
        - array
        - 'null'
        items: *id002
        default: null
      bad_words:
        type:
        - array
        - 'null'
        items: *id001
        default: null
      stream_interval:
        type:
        - integer
        - 'null'
        default: null
      prompt_logprobs:
        type:
        - integer
        - 'null'
        default: null
      echo:
        type: boolean
        default: false
      add_generation_prompt:
        type: boolean
        default: true
        description: 'ASSUMPTION: the field default is filled before check_generation_prompt, which in the code reads the raw data (an omitted flag is falsy there)'
      continue_final_message:
        type: boolean
        default: false
      chat_template_kwargs:
        type:
        - object
        - 'null'
        default: null
      use_beam_search:
        type: boolean
        default: false
      request_id:
        type:
        - string
        - 'null'
        default: null
    required:
    - messages
