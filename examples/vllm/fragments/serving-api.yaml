        drain_timeout: 5
  - interface: elastic-ep-router.post-scale-elastic-ep
    caller: api-client
    as: v400
    input:
      path: /scale_elastic_ep
      body:
        new_data_parallel_size: 2
  - interface: elastic-ep-router.post-scale-elastic-ep
    caller: api-client
    as: e500
    input:
      path: /scale_elastic_ep
      body:
        new_data_parallel_size: 2
