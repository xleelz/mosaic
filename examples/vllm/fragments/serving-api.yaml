- component: launcher
  name: handle-shutdown-signal
  kind: function
  summary: 'serve_http''s SIGINT/SIGTERM handler: the first signal sets shutdown_event (a repeat is ignored); handle_shutdown then stops the engine client with vllm_config.shutdown_timeout
    (mode abort at 0, else drain), and only after it returns sets server.should_exit and cancels the server and watchdog tasks.'
  sources:
  - vllm/entrypoints/launchers/launcher.py:249-290
  request:
    type: object
    properties:
      signal:
        type: string
        enum:
        - SIGTERM
        - SIGINT
        default: SIGTERM
  response:
    type: object
    properties:
      mode:
        type:
        - string
        - 'null'
      timeout:
        type:
        - integer
        - 'null'
      should_exit:
        type:
        - boolean
        - 'null'
      ignored:
        type: boolean
  behavior:
  - title: 'signal_handler: once shutdown_event is set, a second signal does nothing'
    source: vllm/entrypoints/launchers/launcher.py:251-255
    if: has(state.shutdown_requested) && state.shutdown_requested
    then:
    - return:
        mode: null
        timeout: null
        should_exit: null
        ignored: true
  - set:
      state.shutdown_requested: true
  - title: 'handle_shutdown: mode = abort when shutdown_timeout is 0, else drain; engine_client.shutdown(timeout) runs in an executor and is awaited'
    source: vllm/entrypoints/launchers/launcher.py:263-279
    set:
      vars.timeout: = config['shutdown-timeout']
      vars.mode: '= config[''shutdown-timeout''] == 0 ? ''abort'' : ''drain'''
      vars.log: '= ''[shutdown] API server: stopping engine client mode='' + (config[''shutdown-timeout''] == 0 ? ''abort'' : ''drain'') + '' timeout='' + string(config[''shutdown-timeout''])
        + ''s'''
  - call: async-llm.shutdown
    input:
      timeout: = vars.timeout
  - title: 'Only after the engine client stopped: server.should_exit = True, and the server and watchdog tasks are cancelled'
    source: vllm/entrypoints/launchers/launcher.py:281-288
    set:
      state.server_should_exit: true
  - return:
      mode: = vars.mode
      timeout: = vars.timeout
      should_exit: true
      ignored: false
- component: cohere-command-parser
  name: adjust-request
  kind: function
  summary: 'CohereCommandParser.adjust_request: skip_special_tokens=False, then _apply_structural_tags: an existing structural tag (in structured_outputs or response_format) wins; else
    the JSON schema from response_format (json_object -> {type: object}, json_schema -> its schema), else from structured_outputs, plus the tools, are folded into one triggered_tags
    structural tag for the model architecture''s tag style; response_format is then cleared.'
  sources:
  - vllm/parser/cohere_command.py:504-563
  - vllm/parser/cohere_command.py:230-283
  - vllm/parser/cohere_command.py:286-422
  - vllm/parser/cohere_command.py:94-118
  request:
    type: object
    properties:
      body:
        type: object
        description: the ChatCompletionRequest
      model_architecture:
        type:
        - string
        - 'null'
        default: null
        examples:
        - Cohere2ForCausalLM
    required:
    - body
  errors:
  - code: value-error
    status: 0
    retryable: false
  behavior:
  - title: keep special tokens so melody can find the boundaries
    source: vllm/parser/cohere_command.py:507-508
    set:
      vars.body: '= merge(input.body, {''skip_special_tokens'': false})'
      vars.so: '= has(input.body.structured_outputs) ? input.body.structured_outputs : null'
      vars.rf: '= has(input.body.response_format) ? input.body.response_format : null'
      vars.tools: '= has(input.body.tools) ? input.body.tools : null'
  - if: (vars.so != null && 'structural_tag' in vars.so && vars.so.structural_tag != null) || (vars.rf != null && vars.rf.type == 'structural_tag')
    then:
    - title: An explicit structural tag is left as is
      source: vllm/parser/cohere_command.py:516-529
      return: = vars.body
  - title: '_schema_dict_from_chat_response_format: json_object -> {type: object}; json_schema -> the wrapper''s schema (alias of json_schema), unwrapping a nested schema'
    source: vllm/parser/cohere_command.py:322-378
    set:
      vars.schema: '= vars.rf == null ? null : (vars.rf.type == ''json_object'' ? dyn({''type'': ''object''}) : (vars.rf.type == ''json_schema'' && has(vars.rf.json_schema) && vars.rf.json_schema
        != null ? (''schema'' in vars.rf.json_schema && type(vars.rf.json_schema.schema) == map ? dyn(vars.rf.json_schema.schema) : (''json_schema'' in vars.rf.json_schema && type(vars.rf.json_schema.json_schema)
        == map ? dyn(vars.rf.json_schema.json_schema) : dyn(vars.rf.json_schema))) : dyn(null)))'
  - if: vars.schema == null && vars.so != null
    then:
    - title: 'else _schema_dict_from_structured_outputs: json_object -> {type: object}; a json dict (unwrapping schema)'
      source: vllm/parser/cohere_command.py:380-422
      set:
        vars.schema: '= ''json_object'' in vars.so && vars.so.json_object == true ? dyn({''type'': ''object''}) : (''json'' in vars.so && type(vars.so.json) == map ? (''schema'' in vars.so.json
          && type(vars.so.json.schema) == map ? dyn(vars.so.json.schema) : dyn(vars.so.json)) : dyn(null))'
  - set:
      vars.has_tools: '= vars.tools != null && (type(vars.tools) == string ? vars.tools.trim() != '''' : size(vars.tools) > 0)'
  - if: vars.schema == null && !vars.has_tools
    then:
    - title: 'No schema and no tools: unchanged'
      source: vllm/parser/cohere_command.py:541-542
      return: = vars.body
  - if: '!has(input.model_architecture) || input.model_architecture == null'
    then:
    - title: 'No model config: the architecture is unknown, unchanged'
      source: vllm/parser/cohere_command.py:543-544
      return: = vars.body
  - title: 'MODEL_TO_TAG_STYLE: Cohere2ForCausalLM wraps JSON in <|START_RESPONSE|>; the vision and MoE models also in <|START_TEXT|>; tools in <|START_ACTION|>'
    source: vllm/parser/cohere_command.py:94-118
    set:
      vars.json_tags: '= input.model_architecture == ''Cohere2ForCausalLM'' ? [[''<|START_RESPONSE|>'', ''<|END_RESPONSE|>'']] : (input.model_architecture in [''Cohere2VisionForConditionalGeneration'',
        ''Cohere2MoeForCausalLM''] ? [[''<|START_RESPONSE|>'', ''<|END_RESPONSE|>''], [''<|START_TEXT|>'', ''<|END_TEXT|>'']] : [])'
  - if: size(vars.json_tags) == 0
    then:
    - title: convert_schema_to_structural_tags returns None for an architecture without a tag style
      source: vllm/parser/cohere_command.py:550-560
      fail:
        code: value-error
        message: = 'Failed to build structural_tag guided decoding constraints from this request\'s JSON schema and/or tools. The configured model architecture (\'' + input.model_architecture
          + '\') does not support Cohere command structural tags, or the schema cannot be expressed in that format.'
  - title: 'One json_schema tag per JSON wrapper; tools add a grammar tag on <|START_ACTION|> (ASSUMPTION: collect_tool_schema''s grammar text is not simulated)'
    source: vllm/parser/cohere_command.py:249-283
    set:
      vars.tags: '= (vars.schema != null ? vars.json_tags.map(t, {''begin'': t[0], ''content'': {''type'': ''json_schema'', ''json_schema'': vars.schema}, ''end'': t[1]}) : []) + (vars.has_tools
        ? [{''begin'': ''<|START_ACTION|>'', ''content'': {''type'': ''grammar'', ''grammar'': ''tool-call grammar''}, ''end'': ''<|END_ACTION|>''}] : [])'
  - set:
      vars.tag: '= {''type'': ''structural_tag'', ''format'': {''type'': ''triggered_tags'', ''triggers'': vars.tags.map(t, t.begin), ''tags'': vars.tags}}'
  - title: structured_outputs = StructuredOutputsParams(structural_tag=json.dumps(...)); a json_schema or json_object response_format is dropped
    source: vllm/parser/cohere_command.py:561-563
    return: '= merge(vars.body, {''structured_outputs'': {''structural_tag'': string(vars.tag)}, ''structural_tag_obj'': vars.tag, ''response_format'': vars.rf != null && vars.rf.type
      in [''json_schema'', ''json_object''] ? dyn(null) : dyn(vars.rf)})'
- component: run-batch
  name: download-bytes-from-url
  kind: function
  summary: 'download_bytes_from_url: a data: URL with base64 is size-checked from its encoded length before decoding (len(data.rstrip(''='')) * 3 // 4 against VLLM_MAX_AUDIO_CLIP_FILESIZE_MB
    MiB); another data encoding or a missing comma is refused; http(s) honors allowed_media_domains; other schemes are refused.'
  sources:
  - vllm/entrypoints/launchers/run_batch.py:461-531
  - vllm/entrypoints/launchers/run_batch.py:77-86
  request:
    type: object
    properties:
      url:
        type: string
        examples:
        - data:audio/wav;base64,AAAA
      allowed_media_domains:
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
    required:
    - url
  errors:
  - code: vllm-validation-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.scheme: '= input.url.indexOf('':'') > 0 ? input.url.substring(0, input.url.indexOf('':'')).lowerAscii() : '''''
      vars.limit: = int(double(config['vllm-max-audio-clip-filesize-mb']) * 1048576.0)
  - if: vars.scheme == 'data'
    then:
    - if: '!input.url.contains('','')'
      then:
      - source: vllm/entrypoints/launchers/run_batch.py:494-498
        fail:
          code: vllm-validation-error
          message: '= ''Invalid data URL format: '' + input.url'
          data:
            param: url
    - set:
        vars.header: = input.url.substring(0, input.url.indexOf(','))
        vars.data: = input.url.substring(input.url.indexOf(',') + 1)
    - if: '!vars.header.contains(''base64'')'
      then:
      - source: vllm/entrypoints/launchers/run_batch.py:489-493
        fail:
          code: vllm-validation-error
          message: '= ''Unsupported data URL encoding: '' + vars.header'
          data:
            param: url
    - set:
        vars.size: = size(vars.data.replace('=', '')) * 3 / 4
    - title: The decoded size is estimated from the encoded length, so an oversized payload is refused before base64.b64decode
      source: vllm/entrypoints/launchers/run_batch.py:485-487
      if: vars.size > vars.limit
      then:
      - source: vllm/entrypoints/launchers/run_batch.py:81-86
        fail:
          code: vllm-validation-error
          message: Maximum file size exceeded
          data:
            param: audio_filesize_mb
            value: = double(vars.size) / 1048576.0
    - title: base64.b64decode(data)
      source: vllm/entrypoints/launchers/run_batch.py:488
      return:
        decoded: true
        size_bytes: = vars.size
  - if: vars.scheme in ['http', 'https']
    then:
    - set:
        vars.host: = input.url.substring(vars.scheme.size() + 3).split('/')[0].split('@')[size(input.url.substring(vars.scheme.size() + 3).split('/')[0].split('@')) - 1].split(':')[0]
    - if: has(input.allowed_media_domains) && input.allowed_media_domains != null && !(vars.host in input.allowed_media_domains)
      then:
      - source: vllm/entrypoints/launchers/run_batch.py:502-511
        fail:
          code: vllm-validation-error
          message: '= ''The URL must be from one of the allowed domains: ['' + input.allowed_media_domains.map(d, ''\'''' + d + ''\'''').join('', '') + '']. Input URL domain: '' + vars.host'
          data:
            param: url
            value: = vars.host
    - title: 'global_http_connection.async_get_bytes with max_bytes = the limit (ASSUMPTION: the body is not simulated)'
      source: vllm/entrypoints/launchers/run_batch.py:516-523
      return:
        decoded: false
        size_bytes: 0
  - source: vllm/entrypoints/launchers/run_batch.py:525-531
    fail:
      code: vllm-validation-error
      message: '= ''Unsupported URL scheme: '' + vars.scheme + ''. Supported schemes: http, https, data'''
      data:
        param: url
        value: = vars.scheme
- component: run-batch
  name: transcription-wrapper
  kind: function
  summary: 'make_transcription_wrapper(is_translation)(handler): download the batch request''s file_url, then call the transcription (or translation) handler with the bytes; any exception
    becomes ErrorResponse 400 ''Failed to process transcription: <exc>'' and the handler is never called.'
  sources:
  - vllm/entrypoints/launchers/run_batch.py:639-709
  request:
    type: object
    properties:
      body:
        type: object
        properties:
          model:
            type: string
          file_url:
            type: string
          response_format:
            type: string
            default: json
      is_translation:
        type: boolean
        default: false
      allowed_media_domains:
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
    required:
    - body
  response:
    type: object
    properties:
      error:
        type: object
      handled:
        type: boolean
  behavior:
  - set:
      vars.op: '= has(input.is_translation) && input.is_translation ? ''translation'' : ''transcription'''
  - source: vllm/entrypoints/launchers/run_batch.py:668-672
    call: run-batch.download-bytes-from-url
    input:
      url: = input.body.file_url
      allowed_media_domains: '= has(input.allowed_media_domains) ? input.allowed_media_domains : null'
    as: dl
    on_error:
    - title: 'except Exception: ErrorResponse(message=''Failed to process <op>: '' + str(e), type BadRequestError, code 400); str(VLLMValidationError) carries its parameter and value'
      source: vllm/entrypoints/launchers/run_batch.py:697-705
      return:
        handled: false
        error:
          message: '= ''Failed to process '' + vars.op + '': '' + error.message + (has(error.data) && error.data != null && ''param'' in error.data && error.data.param != null ? '' (parameter=''
            + error.data.param + (''value'' in error.data && error.data.value != null ? '', value='' + string(error.data.value) : '''') + '')'' : '''')'
          type: BadRequestError
          code: 400
  - title: 'TranscriptionRequest.model_validate(request_dict with file=UploadFile(bytes)), then handler_fn(audio_data, request) (ASSUMPTION: the ASR handler is not modeled; Llama serves
      no transcription)'
    source: vllm/entrypoints/launchers/run_batch.py:674-696
    return:
      handled: true
      error: null
- component: online-derenderer
  name: apply-chat-stream-delta
  kind: function
  summary: '_derender_chat_stream_parsed, after the current chunk''s parse_delta: append the chunk''s token ids to the state, pin every id-bearing DeltaToolCall to the id recorded for
    its index (or record a new one), add the role on the first chunk, and rewrite a finish to tool_calls once tools streamed (unless tool_choice names a function); returns the stream
    choice and the updated state.'
  sources:
  - vllm/renderers/online_derenderer.py:588-692
  request:
    type: object
    properties:
      state:
        type:
        - object
        - 'null'
        default: null
        description: 'DerenderStreamState: output_token_ids, output_chunk_lens, role_sent, tools_streamed, last_tool_call_ids'
      delta_message:
        type:
        - object
        - 'null'
        default: null
        description: what the parser's parse_delta returned for this chunk
      token_ids:
        type: array
        items:
          type: integer
        default: []
      finish_reason:
        type:
        - string
        - 'null'
        default: null
      index:
        type: integer
        default: 0
      tool_choice:
        default: null
    required: []
  behavior:
  - set:
      vars.st: '= merge({''output_token_ids'': [], ''output_chunk_lens'': [], ''role_sent'': false, ''tools_streamed'': false, ''last_tool_call_ids'': []}, has(input.state) && input.state
        != null ? input.state : {})'
      vars.dm: '= has(input.delta_message) && input.delta_message != null ? input.delta_message : {}'
      vars.tids: '= has(input.token_ids) ? input.token_ids : []'
  - set:
      vars.ids: = vars.st.last_tool_call_ids
      vars.calls: '= ''tool_calls'' in vars.dm && vars.dm.tool_calls != null ? vars.dm.tool_calls : []'
      vars.out_calls: []
  - title: 'Pin: an id-bearing call whose index already has a recorded id reuses it; a new index records its id'
    source: vllm/renderers/online_derenderer.py:648-659
    foreach: = vars.calls
    as: tc
    steps:
    - if: '!(''id'' in vars.tc) || vars.tc.id == null'
      then:
      - set:
          vars.out_calls: = vars.out_calls + [vars.tc]
      - continue: true
    - if: vars.tc.index < size(vars.ids)
      then:
      - set:
          vars.out_calls: '= vars.out_calls + [merge(vars.tc, {''id'': vars.ids[vars.tc.index]})]'
      else:
      - set:
          vars.ids: = vars.ids + [vars.tc.id]
          vars.out_calls: = vars.out_calls + [vars.tc]
  - set:
      vars.tools_streamed: = vars.st.tools_streamed || size(vars.calls) > 0
      vars.delta: '= merge(size(vars.calls) > 0 ? merge(vars.dm, {''tool_calls'': vars.out_calls}) : vars.dm, vars.st.role_sent ? {} : {''role'': ''assistant''})'
  - title: A finish after streamed tools reports tool_calls, unless tool_choice names a function
    source: vllm/renderers/online_derenderer.py:664-671
    set:
      vars.finish: '= has(input.finish_reason) && input.finish_reason != null && vars.tools_streamed && !(has(input.tool_choice) && input.tool_choice != null && type(input.tool_choice)
        == map) ? dyn(''tool_calls'') : (has(input.finish_reason) ? dyn(input.finish_reason) : dyn(null))'
  - title: 'updated_state: the chunk''s ids and length appended, role_sent, tools_streamed, last_tool_call_ids'
    source: vllm/renderers/online_derenderer.py:684-692
    return:
      choice:
        index: '= has(input.index) ? input.index : 0'
        delta: = vars.delta
        finish_reason: = vars.finish
      state:
        output_token_ids: = vars.st.output_token_ids + vars.tids
        output_chunk_lens: '= size(vars.tids) > 0 ? vars.st.output_chunk_lens + [size(vars.tids)] : vars.st.output_chunk_lens'
        role_sent: true
        tools_streamed: = vars.tools_streamed
        last_tool_call_ids: = vars.ids
- component: qwen3-parser
  name: stream-tool-call
  kind: function
  summary: 'The Qwen3 ParserEngine over streamed chunks (CONTENT, no thinking): text before <tool_call> is content; inside a call, the name is sent once <function=NAME> is complete,
    and the arguments (_qwen3_arg_converter: every <parameter=K>V</parameter> as a JSON string, one wrapping newline trimmed) stream as the growing JSON with its closing brace held back
    until </function>.'
  sources:
  - vllm/parser/qwen3.py:51-86
  - vllm/parser/qwen3.py:88-140
  - vllm/parser/engine/streaming_parser_engine.py:409-585
  request:
    type: object
    properties:
      chunks:
        type: array
        items:
          type: string
    required:
    - chunks
  response:
    type: object
    properties:
      deltas:
        type: array
        items:
          type: object
  behavior:
  - set:
      vars.buf: ''
      vars.deltas: []
      vars.name_sent: false
      vars.sent_args: ''
      vars.in_call: false
      vars.closed: false
  - foreach: = input.chunks
    as: chunk
    steps:
    - set:
        vars.buf: = vars.buf + vars.chunk
    - if: '!vars.in_call && vars.buf.contains(''<tool_call>'')'
      then:
      - title: 'TOOL_START: the text before the marker was content'
        source: vllm/parser/qwen3.py:104-120
        set:
          vars.deltas: '= vars.buf.substring(0, vars.buf.indexOf(''<tool_call>'')) != '''' ? vars.deltas + [{''content'': vars.buf.substring(0, vars.buf.indexOf(''<tool_call>''))}] :
            vars.deltas'
          vars.buf: = vars.buf.substring(vars.buf.indexOf('<tool_call>') + 11)
          vars.in_call: true
    - if: '!vars.in_call'
      then:
      - set:
          vars.deltas: '= vars.deltas + [{''content'': vars.buf}]'
          vars.buf: ''
      - continue: true
    - if: '!vars.name_sent && vars.buf.contains(''<function='') && vars.buf.substring(vars.buf.indexOf(''<function='')).contains(''>'')'
      then:
      - title: The function name, once <function=NAME> is complete
        source: vllm/parser/qwen3.py:46-47
        set:
          vars.name: = vars.buf.substring(vars.buf.indexOf('<function=') + 10, vars.buf.indexOf('<function=') + vars.buf.substring(vars.buf.indexOf('<function=')).indexOf('>'))
          vars.name_sent: true
      - set:
          vars.deltas: '= vars.deltas + [{''tool_calls'': [{''index'': 0, ''function'': {''name'': vars.name}}]}]'
    - if: vars.name_sent && !vars.closed
      then:
      - title: _qwen3_arg_converter over the complete <parameter=K>V</parameter> tags so far
        source: vllm/parser/qwen3.py:51-86
        set:
          vars.segs: = vars.buf.split('<parameter=').slice(1, size(vars.buf.split('<parameter='))).filter(p, p.contains('>') && p.contains('</parameter>'))
      - set:
          vars.kv: = vars.segs.map(p, [p.substring(0, p.indexOf('>')), p.substring(p.indexOf('>') + 1, p.indexOf('</parameter>'))])
      - title: '_trim_wrapping_newlines: one leading and one trailing newline go'
        source: vllm/parser/qwen3.py:61-67
        set:
          vars.kv: '= vars.kv.map(e, [e[0], e[1].startsWith(''\n'') ? e[1].substring(1) : e[1]]).map(e, [e[0], e[1].endsWith(''\n'') ? e[1].substring(0, size(e[1]) - 1) : e[1]])'
      - set:
          vars.json: '= ''{'' + vars.kv.map(e, ''"'' + e[0] + ''": "'' + e[1] + ''"'').join('', '') + ''}'''
          vars.closed: = vars.buf.contains('</function>')
      - set:
          vars.cur: '= vars.closed ? vars.json : vars.json.substring(0, size(vars.json) - 1)'
      - title: Arguments stream as the new suffix of the JSON text (the closing brace waits for </function>)
        source: vllm/parser/engine/streaming_parser_engine.py:518-560
        if: size(vars.segs) > 0 && size(vars.cur) > size(vars.sent_args) && vars.cur.startsWith(vars.sent_args)
        then:
        - set:
            vars.deltas: '= vars.deltas + [{''tool_calls'': [{''index'': 0, ''function'': {''arguments'': vars.cur.substring(size(vars.sent_args))}}]}]'
            vars.sent_args: = vars.cur
  - return:
      deltas: = vars.deltas
- component: harmony-parser
  name: parse-delta
  kind: function
  summary: 'HarmonyParser.parse_delta (gpt-oss): feed the delta through the per-parser harmony stream state; text in an analysis message is reasoning, in final (or commentary with no
    recipient) content, and in a message to functions.<name> tool-call arguments: a new recipient opens a DeltaToolCall with the name at the next index, later text extends it; <|end|>/<|call|>
    complete the message; finished resets the tool index. Empty results are None.'
  sources:
  - vllm/parser/harmony.py:237-330
  - vllm/parser/harmony.py:60-77
  - vllm/parser/harmony.py:331-372
  - vllm/entrypoints/openai/parser/harmony_utils.py:64-65
  request:
    type: object
    properties:
      parser_id:
        type: string
        default: p0
      text:
        type: string
        description: the decoded delta (encode_output's tokens, as text)
      finished:
        type: boolean
        default: false
      include_reasoning:
        type: boolean
        default: true
    required:
    - text
  response:
    type: object
    properties:
      delta:
        type:
        - object
        - 'null'
  behavior:
  - set:
      vars.pid: '= has(input.parser_id) ? input.parser_id : ''p0'''
  - set:
      vars.ps: '= vars.pid in state.parsers ? state.parsers[vars.pid] : {''mode'': ''header'', ''header'': '''', ''channel'': null, ''recipient'': null, ''next_index'': 0, ''prev_recipient'':
        null}'
      vars.rest: = input.text
      vars.content: ''
      vars.reasoning: ''
      vars.tools: []
      vars.markers: = ['<|start|>', '<|channel|>', '<|constrain|>', '<|message|>', '<|end|>', '<|call|>', '<|return|>']
  - title: 'process_chunk: token by token through the StreamableParser (header text, channel, constrain, message content, then end)'
    source: vllm/parser/harmony.py:331-372
    foreach: = lists.range(64)
    as: step
    steps:
    - if: vars.rest == ''
      then:
      - break: true
    - set:
        vars.hits: = vars.markers.filter(m, vars.rest.indexOf(m) >= 0)
    - set:
        vars.at: '= size(vars.hits) == 0 ? size(vars.rest) : math.least(vars.hits.map(m, vars.rest.indexOf(m)))'
    - set:
        vars.text: = vars.rest.substring(0, vars.at)
        vars.marker: '= size(vars.hits) == 0 ? '''' : vars.hits.filter(m, vars.rest.indexOf(m) == vars.at)[0]'
    - set:
        vars.rest: '= vars.marker == '''' ? '''' : vars.rest.substring(vars.at + size(vars.marker))'
    - if: vars.text != ''
      then:
      - if: vars.ps.mode == 'header'
        then:
        - set:
            vars.ps: '= merge(vars.ps, {''header'': vars.ps.header + vars.text})'
      - if: vars.ps.mode == 'channel'
        then:
        - set:
            vars.ps: '= merge(vars.ps, {''channel'': (vars.ps.channel == null ? '''' : vars.ps.channel) + vars.text})'
      - if: vars.ps.mode == 'message'
        then:
        - title: '_SegmentType: a functions.* recipient is a tool call; analysis is reasoning; final, or commentary with no recipient, is content'
          source: vllm/parser/harmony.py:66-76
          if: vars.ps.recipient != null && vars.ps.recipient.startsWith('functions.')
          then:
          - if: vars.ps.prev_recipient != vars.ps.recipient
            then:
            - title: 'A new recipient: DeltaToolCall(id, name = recipient minus ''functions.'', arguments, index = next index)'
              source: vllm/parser/harmony.py:273-289
              set:
                vars.tools: '= vars.tools + [{''index'': vars.ps.next_index, ''name'': vars.ps.recipient.substring(10), ''arguments'': vars.text}]'
                vars.ps: '= merge(vars.ps, {''next_index'': vars.ps.next_index + 1, ''prev_recipient'': vars.ps.recipient})'
            else:
            - title: 'The same recipient: extend this delta''s call, or a new entry at index next-1 without a name'
              source: vllm/parser/harmony.py:290-304
              set:
                vars.tools: '= size(vars.tools) > 0 ? vars.tools.slice(0, size(vars.tools) - 1) + [merge(vars.tools[size(vars.tools) - 1], {''arguments'': vars.tools[size(vars.tools)
                  - 1].arguments + vars.text})] : [{''index'': vars.ps.next_index - 1, ''name'': null, ''arguments'': vars.text}]'
          else:
          - if: vars.ps.channel == 'analysis'
            then:
            - set:
                vars.reasoning: = vars.reasoning + vars.text
          - if: vars.ps.channel == 'final' || (vars.ps.channel == 'commentary' && vars.ps.recipient == null)
            then:
            - set:
                vars.content: = vars.content + vars.text
    - if: vars.marker == '<|start|>'
      then:
      - set:
          vars.ps: '= merge(vars.ps, {''mode'': ''header'', ''header'': '''', ''channel'': null, ''recipient'': null})'
    - if: vars.marker == '<|channel|>'
      then:
      - title: The header text names the recipient (to=functions.NAME)
        source: vllm/parser/harmony.py:407-415
        set:
          vars.ps: '= merge(vars.ps, {''mode'': ''channel'', ''channel'': '''', ''recipient'': vars.ps.header.contains(''to='') ? vars.ps.header.substring(vars.ps.header.indexOf(''to='')
            + 3).split('' '')[0] : vars.ps.recipient})'
    - if: vars.marker == '<|constrain|>'
      then:
      - set:
          vars.ps: '= merge(vars.ps, {''mode'': ''constrain''})'
    - if: vars.marker == '<|message|>'
      then:
      - set:
          vars.ps: '= merge(vars.ps, {''mode'': ''message''})'
    - if: vars.marker in ['<|end|>', '<|call|>', '<|return|>']
      then:
      - title: A completed message resets prev_recipient
        source: vllm/parser/harmony.py:258-261
        set:
          vars.ps: '= merge(vars.ps, {''mode'': ''header'', ''header'': '''', ''channel'': null, ''recipient'': null, ''prev_recipient'': null})'
  - if: has(input.finished) && input.finished
    then:
    - source: vllm/parser/harmony.py:306-307
      set:
        vars.ps: '= merge(vars.ps, {''next_index'': 0})'
  - set:
      state.parsers: '= merge(state.parsers, {vars.pid: vars.ps})'
  - if: vars.content == '' && vars.reasoning == '' && size(vars.tools) == 0
    then:
    - source: vllm/parser/harmony.py:309-310
      return:
        delta: null
  - title: DeltaMessage with only the non-empty parts; reasoning suppressed unless include_reasoning
    source: vllm/parser/harmony.py:312-327
    return:
      delta:
        content: '= vars.content == '''' ? null : vars.content'
        reasoning: '= vars.reasoning == '''' || (has(input.include_reasoning) && !input.include_reasoning) ? null : vars.reasoning'
        tool_calls: '= vars.tools.map(t, {''index'': t.index, ''function'': {''name'': t.name, ''arguments'': t.arguments}})'
- component: openai-serving-chat
  name: render-chat-request
  kind: function
  summary: 'render_chat_request: check the model, run the engine preflight, then OnlineRenderer.render_chat.'
  sources:
  - vllm/entrypoints/openai/chat_completion/serving.py:258-279
  request:
    type: object
    properties:
      body:
        $ref: ServingChatCompletionRequest
    required:
    - body
  behavior:
  - call: base-serving.check-model
    input:
      model: '= has(input.body.model) ? input.body.model : '''''
    as: model
  - title: _preflight(n) -- before any 200 is sent for a stream
    source: vllm/entrypoints/openai/chat_completion/serving.py:277
    call: generate-base-serving.preflight
    input:
