- component: openai-serving-responses
  name: get-v1-responses-response-id
  kind: http
  summary: 'GET /v1/responses/{response_id}: retrieve a stored response (load-tracked).'
  sources:
  - vllm/entrypoints/openai/responses/api_router.py:80-107
  attributes:
    method: GET
    path: /v1/responses/{response_id}
  request:
    type: object
    properties:
      path:
        type: string
        examples:
        - /v1/responses/resp_1
      headers:
        $ref: ServingHttpHeaders
    required:
    - path
  errors:
  - code: invalid_request_error
    status: 404
    reachable_by: retrieve-responses fails invalid_request_error 404 for an unknown id (vllm/entrypoints/openai/responses/serving.py:1146-1147); the handler passes it through
  - code: unauthorized
    status: 401
  behavior:
  - call: scaling-middleware.call
    input:
      path: = input.path
  - call: authentication-middleware.call
    input:
      path: = input.path
