- component: tool-parser-manager
  name: get-tool-parser
  kind: function
  summary: 'ToolParserManager.get_tool_parser(name): an eagerly registered class, else a lazily registered one imported and cached on first access, else KeyError.'
  sources:
  - vllm/tool_parsers/abstract_tool_parser.py:246-284
  attributes:
    racy_in_code: 'check-then-import-then-store with no lock: two first lookups of one lazy name both import the module and both cache the class in tool_parsers (vllm/tool_parsers/abstract_tool_parser.py:262-276);
      the class is the same, so the race is benign'
  request:
    type: object
    properties:
      name:
        type: string
        examples:
        - llama3_json
    required:
    - name
  errors:
  - code: key-error
    status: 0
    retryable: false
  behavior:
  - if: input.name in state.tool_parsers
    then:
    - source: vllm/tool_parsers/abstract_tool_parser.py:254-255
      return:
        parser_class: = state.tool_parsers[input.name]
  - if: input.name in state.lazy_parsers
    then:
    - title: '_load_lazy_parser: import the module, take the class and cache it in tool_parsers'
      source: vllm/tool_parsers/abstract_tool_parser.py:262-276
      set:
        state.tool_parsers: '= merge(state.tool_parsers, {input.name: state.lazy_parsers[input.name]})'
    - return:
        parser_class: = state.lazy_parsers[input.name]
  - title: Unknown parser name
    source: vllm/tool_parsers/abstract_tool_parser.py:260
    fail:
      code: key-error
      message: = 'Tool parser \'' + input.name + '\' not found.'
