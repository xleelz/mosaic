    input:
      model: '= has(input.body.model) ? input.body.model : '''''
  - call: base-renderer.detokenize-prompt
    input:
      prompt_token_ids: = input.body.tokens
    as: d
  - return:
      prompt: = vars.d.value.prompt
- component: anthropic-serving-messages
  name: create-messages
  kind: function
  summary: 'create_messages: convert to a ChatCompletionRequest, run the chat handler, convert the response back (stop_reason mapping).'
  sources:
  - vllm/entrypoints/anthropic/serving.py:793-880
  request:
    type: object
    properties:
      body:
        type: object
        properties:
          model:
            type: string
            examples:
            - llama-8b
          max_tokens:
            type: integer
            examples:
            - 16
          system:
            type:
            - string
            - 'null'
            default: null
          messages:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                role:
                  type: string
                  examples:
                  - user
                content:
                  type: string
                  examples:
                  - What is the capital of France?
            default:
            - role: user
              content: What is the capital of France?
      x_request_id:
        type:
        - string
