      status: '= has(input.status) ? input.status : 0'
      message: '= has(input.message) ? input.message : '''''
      param: '= has(input.param) ? input.param : null'
      value: '= has(input.value) ? input.value : null'
    as: er
    on_error:
    - title: 'Cohere''s envelope: status = info.code (or 400), body CohereError(message, id).model_dump(exclude_none=True): {message}, plus id when known'
      source: vllm/entrypoints/cohere/api_router.py:109-117
      fail:
        code: CohereError
        status: '= error.status != null && error.status > 0 ? error.status : 400'
        message: = error.message
        data:
