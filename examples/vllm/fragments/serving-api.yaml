      ok: true
- component: cohere-serving-chat-v2
  name: build-position-to-source
  kind: function
  summary: '_build_position_to_source / _walk_citable_positions: number the citable slots as melody does (bucket 0 for top-level documents, then one bucket per tool_call_id in first-seen
    order; one slot per tool content block, a string being one text block) and give each its source: documents keep their id and data, text blocks become an id-less tool_output (a JSON-object
    text is spread, anything else is {content}).'
  sources:
  - vllm/entrypoints/cohere/serving.py:1254-1277
  - vllm/entrypoints/cohere/serving.py:773-900
  - vllm/entrypoints/cohere/serving.py:1279-1296
  request:
    type: object
    properties:
      messages:
        type: array
        items:
          type: object
      documents:
        type:
        - array
        - 'null'
        default: null
    required:
    - messages
  behavior:
  - set:
      vars.docs: '= has(input.documents) && input.documents != null ? input.documents : []'
      vars.out: []
  - title: 'Bucket 0: the top-level documents, with the doc_<idx> fallback id'
    source: vllm/entrypoints/cohere/serving.py:842-870
    set:
      vars.out: '= lists.range(size(vars.docs)).map(i, {''bucket'': 0, ''idx'': i, ''type'': ''document'', ''id'': type(vars.docs[i]) == string ? ''doc_'' + string(i) : (has(vars.docs[i].id)
        && vars.docs[i].id != null && vars.docs[i].id != '''' ? vars.docs[i].id : ''doc_'' + string(i)), ''document'': type(vars.docs[i]) == string ? {''text'': vars.docs[i]} : (type(vars.docs[i].data)
        == map ? vars.docs[i].data : {''text'': vars.docs[i].data})})'
      vars.first: '= size(vars.docs) > 0 ? 1 : 0'
  - title: Each unique tool_call_id claims the next bucket, first seen in an assistant's tool_calls or a tool message
    source: vllm/entrypoints/cohere/serving.py:873-880
    set:
      vars.ids: '= input.messages.map(m, m.role == ''assistant'' && has(m.tool_calls) && m.tool_calls != null ? m.tool_calls.map(tc, tc.id) : (m.role == ''tool'' && has(m.tool_call_id)
        ? [m.tool_call_id] : [])).flatten()'
  - set:
      vars.order: = lists.range(size(vars.ids)).filter(i, vars.ids.indexOf(vars.ids[i]) == i).map(i, vars.ids[i])
  - title: One slot per tool-content block (a string or empty content is one text block); slots of messages sharing a tool_call_id accumulate
    source: vllm/entrypoints/cohere/serving.py:880-900
    foreach: = input.messages.filter(m, m.role == 'tool')
    as: tm
    max: 32
    steps:
    - set:
        vars.bucket: = vars.first + vars.order.indexOf(vars.tm.tool_call_id)
        vars.blocks: '= !has(vars.tm.content) || vars.tm.content == null || type(vars.tm.content) == string ? [{''type'': ''text'', ''text'': has(vars.tm.content) && vars.tm.content
          != null ? vars.tm.content : ''''}] : vars.tm.content'
    - set:
        vars.base: = size(vars.out.filter(o, o.bucket == vars.bucket))
    - title: '_text_to_tool_output_payload: a text that parses as a JSON object is the payload; other text is {content: text} (ASSUMPTION: JSON-object text is recognized by its braces)'
      source: vllm/entrypoints/cohere/serving.py:1288-1296
      set:
        vars.out: '= vars.out + lists.range(size(vars.blocks)).map(j, vars.blocks[j].type == ''document'' ? {''bucket'': vars.bucket, ''idx'': vars.base + j, ''type'': ''tool'', ''id'':
          has(vars.blocks[j].document.id) && vars.blocks[j].document.id != '''' ? vars.blocks[j].document.id : null, ''tool_output'': type(vars.blocks[j].document.data) == map ? merge(vars.blocks[j].document.data,
          has(vars.blocks[j].document.id) && vars.blocks[j].document.id != '''' ? {''id'': vars.blocks[j].document.id} : {}) : {''text'': vars.blocks[j].document.data}} : {''bucket'':
          vars.bucket, ''idx'': vars.base + j, ''type'': ''tool'', ''id'': null, ''tool_output'': vars.blocks[j].text == '''' ? {} : (vars.blocks[j].text.trim().startsWith(''{'') &&
          vars.blocks[j].text.trim().endsWith(''}'') && size(vars.blocks[j].text.split(''{'')) == size(vars.blocks[j].text.split(''}'')) ? jsonParse(vars.blocks[j].text) : {''content'':
          vars.blocks[j].text})})'
  - return:
      positions: = vars.out
- component: cli-args
  name: validate-parsed-serve-args
  kind: function
  summary: 'validate_parsed_serve_args: the chat template must look valid (an existing file, a jinja string, or a built-in template name), auto tool choice needs a tool parser, log outputs
    need log requests, the SSE keep-alive interval is non-negative, per-request metrics need stats logging.'
  sources:
  - vllm/entrypoints/launchers/cli_args.py:502-546
  - vllm/renderers/chat_utils.py:1457-1490
  request:
    type: object
    properties:
      chat_template:
        type:
        - string
        - 'null'
        default: null
      tool_call_parser:
        type:
        - string
        - 'null'
        default: null
      enable_auto_tool_choice:
        type: boolean
        default: false
      enable_log_outputs:
        type: boolean
        default: false
      enable_log_requests:
        type: boolean
        default: false
      sse_keep_alive_interval:
        type: integer
        default: 0
      enable_per_request_metrics:
        type: boolean
        default: false
      disable_log_stats:
        type: boolean
        default: false
  errors:
  - code: vllm-validation-error
    status: 0
  - code: type-error
    status: 0
  - code: value-error
    status: 0
  behavior:
  - if: has(input.chat_template) && input.chat_template != null && !input.chat_template.contains('{') && !input.chat_template.contains('}') && !input.chat_template.contains('\n')
    then:
    - title: 'validate_chat_template: a path-like string must exist, as given or in the built-in chat_templates directory'
      source: vllm/renderers/chat_utils.py:1465-1477
      call: local-disk.stat
      input:
        path: = input.chat_template
      as: p
    - if: '!vars.p.value.exists'
      then:
      - call: local-disk.stat
        input:
          path: = 'vllm/transformers_utils/chat_templates/' + input.chat_template
        as: b
      - if: '!vars.b.value.exists'
        then:
        - source: vllm/renderers/chat_utils.py:1478-1486
          fail:
            code: vllm-validation-error
            message: '= ''The supplied chat template string ('' + input.chat_template + '') appears path-like, but doesn\''t exist! Tried: '' + input.chat_template + '' and vllm/transformers_utils/chat_templates/''
              + input.chat_template'
            data:
              param: chat_template
  - if: has(input.enable_auto_tool_choice) && input.enable_auto_tool_choice && (!has(input.tool_call_parser) || input.tool_call_parser == null || input.tool_call_parser == '')
    then:
    - source: vllm/entrypoints/launchers/cli_args.py:522-524
      fail:
        code: type-error
        message: 'Error: --enable-auto-tool-choice requires --tool-call-parser'
  - if: has(input.enable_log_outputs) && input.enable_log_outputs && !(has(input.enable_log_requests) && input.enable_log_requests)
    then:
    - source: vllm/entrypoints/launchers/cli_args.py:525-526
      fail:
        code: type-error
        message: 'Error: --enable-log-outputs requires --enable-log-requests'
  - if: has(input.sse_keep_alive_interval) && input.sse_keep_alive_interval < 0
    then:
    - source: vllm/entrypoints/launchers/cli_args.py:528-533
      fail:
        code: value-error
        message: 'Error: --sse-keep-alive-interval must be a non-negative integer (0 disables keep-alive comments).'
  - if: has(input.enable_per_request_metrics) && input.enable_per_request_metrics && has(input.disable_log_stats) && input.disable_log_stats
    then:
    - source: vllm/entrypoints/launchers/cli_args.py:535-542
      fail:
        code: value-error
        message: 'Error: --enable-per-request-metrics requires engine statistics logging; remove --disable-log-stats to enable per-request metrics.'
  - return:
      ok: true
- component: llm
  name: beam-search
  kind: function
  summary: 'LLM.beam_search: per prompt one beam of its prompt tokens; then up to max_tokens steps, each running every live beam as a one-token request with 2 x beam_width sample logprobs
    and keeping the beam_width best extensions (EOS ends a beam unless ignore_eos); finally the completed and live beams are ranked by the length-penalized cumulative logprob, the best
    beam_width are decoded, one BeamSearchOutput per prompt.'
  description: Structured-output beam search (per-beam grammar replay, offline.py:331-472) is not modeled. The length penalty exponent is computed for 0, 0.5, 1 and 2 (CEL has no general
    power); other values use 1.
  sources:
  - vllm/entrypoints/generate/beam_search/offline.py:58-187
  - vllm/entrypoints/generate/beam_search/utils.py:124-163
  request:
    type: object
    required:
    - prompts
    - params
    properties:
      prompts:
        type: array
        description: TokensPrompt ({prompt_token_ids}) or TextPrompt ({prompt}) dicts; a bare string is a text prompt
        items:
          type:
          - object
          - string
          properties:
            prompt_token_ids:
              type: array
              items:
                type: integer
            prompt:
              type: string
            prompt_embeds:
              description: an EmbedsPrompt (refused)
      params:
        type: object
        description: BeamSearchParams
        required:
        - beam_width
        - max_tokens
        properties:
          beam_width:
            type: integer
            examples:
            - 2
          max_tokens:
            type: integer
            examples:
            - 3
          ignore_eos:
            type: boolean
            default: false
          temperature:
            type: number
            default: 0.0
          length_penalty:
            type: number
            default: 1.0
          skip_special_tokens:
            type: boolean
            default: true
          structured_outputs:
            type:
            - object
            - 'null'
            default: null
      concurrency_limit:
        type:
        - integer
        - 'null'
        default: null
      eos_token_id:
        type: integer
        default: 128009
        description: 'tokenizer.eos_token_id (Llama-3.1-Instruct: <|eot_id|>)'
  response:
    type: array
    items:
      type: object
      properties:
        sequences:
          type: array
          items:
            type: object
            properties:
              tokens:
                type: array
                items:
                  type: integer
              cum_logprob:
                type: number
              text:
                type: string
              finish_reason:
                type:
                - string
                - 'null'
  errors:
  - code: not-implemented-error
    status: 0
    retryable: false
  - code: value-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.p: = input.params
      vars.bw: = input.params.beam_width
      vars.lp: '= has(input.params.length_penalty) ? double(input.params.length_penalty) : 1.0'
      vars.eos: '= has(input.eos_token_id) ? input.eos_token_id : 128009'
      vars.ignore_eos: = has(input.params.ignore_eos) && input.params.ignore_eos
  - if: has(input.params.structured_outputs) && input.params.structured_outputs != null
    then:
    - title: Structured outputs with beam search replay each beam's grammar; not modeled
      source: vllm/entrypoints/generate/beam_search/offline.py:103-112
      fail:
        code: not-implemented-error
        message: structured-output beam search is not modeled
  - set:
      vars.instances: []
  - title: '_preprocess_cmpl: tokenize text prompts; an embeddings prompt is refused'
    source: vllm/entrypoints/generate/beam_search/offline.py:88-139
    foreach: = input.prompts
    as: pr
    steps:
    - if: type(vars.pr) == map && has(vars.pr.prompt_embeds)
      then:
      - source: vllm/entrypoints/generate/beam_search/offline.py:128-131
        fail:
          code: not-implemented-error
          message: Embedding prompt not supported for beam search
    - if: type(vars.pr) == map && has(vars.pr.prompt_token_ids)
      then:
      - set:
          vars.ids: = vars.pr.prompt_token_ids
      else:
      - call: hf-tokenizer.encode
        input:
          text: '= type(vars.pr) == string ? vars.pr : vars.pr.prompt'
        as: enc
      - set:
          vars.ids: = vars.enc.value.ids
    - title: 'BeamSearchInstance: one beam holding the prompt tokens'
      source: vllm/entrypoints/generate/beam_search/utils.py:110-133
      set:
        vars.instances: '= vars.instances + [{''prompt_len'': size(vars.ids), ''beams'': [{''tokens'': vars.ids, ''cum_logprob'': 0.0, ''finish_reason'': null}], ''completed'': []}]'
  - set:
      vars.limit: '= has(input.concurrency_limit) && input.concurrency_limit != null ? input.concurrency_limit : size(vars.instances)'
      vars.done: []
  - title: Batches of concurrency_limit instances, each searched up to max_tokens steps
    source: vllm/entrypoints/generate/beam_search/offline.py:141-174
    foreach: = lists.range((size(vars.instances) + vars.limit - 1) / vars.limit)
    as: b
    max: 64
    steps:
    - set:
        vars.batch: = vars.instances.slice(vars.b * vars.limit, int(math.least(size(vars.instances), (vars.b + 1) * vars.limit)))
    - foreach: = lists.range(vars.p.max_tokens)
      as: step
      max: 256
      steps:
      - call: llm.beam-search-step
        input:
          instances: = vars.batch
          beam_width: = vars.bw
          eos_token_id: = vars.eos
          ignore_eos: = vars.ignore_eos
          length_penalty: = vars.lp
          temperature: '= has(vars.p.temperature) ? double(vars.p.temperature) : 0.0'
        as: st
      - set:
          vars.batch: = vars.st.value.instances
      - if: vars.st.value.should_stop
        then:
        - break: true
    - set:
        vars.done: = vars.done + vars.batch
  - set:
      vars.outputs: []
  - title: completed + live beams, ranked by get_beam_search_score (descending, stable), best beam_width decoded
    source: vllm/entrypoints/generate/beam_search/offline.py:176-187
    foreach: = vars.done
    as: inst
    steps:
    - set:
        vars.all: = vars.inst.completed + vars.inst.beams
    - set:
        vars.best: '= vars.all.sortBy(x, -(x.cum_logprob / (vars.lp == 0.0 ? 1.0 : (vars.lp == 0.5 ? math.sqrt(double(math.greatest(size(x.tokens) - (x.tokens[size(x.tokens) - 1] ==
          vars.eos ? 1 : 0), 1))) : (vars.lp == 2.0 ? double(math.greatest(size(x.tokens) - (x.tokens[size(x.tokens) - 1] == vars.eos ? 1 : 0), 1) * math.greatest(size(x.tokens) - (x.tokens[size(x.tokens)
          - 1] == vars.eos ? 1 : 0), 1)) : double(math.greatest(size(x.tokens) - (x.tokens[size(x.tokens) - 1] == vars.eos ? 1 : 0), 1))))))).slice(0, int(math.least(size(vars.all),
          vars.bw)))'
    - set:
        vars.seqs: []
    - foreach: = vars.best
      as: beam
      steps:
      - title: beam.text = tokenizer.decode(beam.tokens, skip_special_tokens)
        source: vllm/entrypoints/generate/beam_search/offline.py:181-184
        call: hf-tokenizer.decode
        input:
          ids: = vars.beam.tokens
          skip_special_tokens: = !has(vars.p.skip_special_tokens) || vars.p.skip_special_tokens
        as: dec
      - set:
          vars.seqs: '= vars.seqs + [merge(vars.beam, {''text'': vars.dec.value.text})]'
    - set:
        vars.outputs: '= vars.outputs + [{''sequences'': vars.seqs}]'
  - return: = vars.outputs
- component: llm
  name: beam-search-step
  kind: function
  summary: 'LLM._beam_search_step: run every live beam of the batch as a one-token request (logprobs = 2 x beam_width, max_tokens 1, no detokenize); an aborted request ends its instance;
    each candidate token of a beam''s first logprobs position extends it (EOS completes it unless ignore_eos); each instance keeps its beam_width best new beams. True when no beam is
    left.'
  sources:
  - vllm/entrypoints/generate/beam_search/offline.py:189-321
  - vllm/entrypoints/generate/beam_search/offline.py:114-124
  - vllm/entrypoints/generate/beam_search/utils.py:137-154
  request:
    type: object
    required:
    - instances
    - beam_width
    properties:
      instances:
        type: array
        items:
          type: object
          properties:
            prompt_len:
              type: integer
            beams:
              type: array
            completed:
              type: array
      beam_width:
        type: integer
      eos_token_id:
        type: integer
        default: 128009
      ignore_eos:
        type: boolean
        default: false
      length_penalty:
        type: number
        default: 1.0
      temperature:
        type: number
        default: 0.0
  response:
    type: object
    properties:
      should_stop:
        type: boolean
      instances:
        type: array
  behavior:
  - set:
      vars.lp: '= has(input.length_penalty) ? double(input.length_penalty) : 1.0'
      vars.eos: '= has(input.eos_token_id) ? input.eos_token_id : 128009'
  - if: input.instances.all(inst, size(inst.beams) == 0)
    then:
    - title: 'No beam left: stop'
      source: vllm/entrypoints/generate/beam_search/offline.py:213-214
      return:
        should_stop: true
        instances: = input.instances
  - set:
      vars.prompts: []
  - foreach: = input.instances
    as: inst
    steps:
    - set:
        vars.prompts: '= vars.prompts + vars.inst.beams.map(b, {''prompt_token_ids'': b.tokens})'
  - title: '_render_and_run_requests: one request per live beam with the base sampling params (2 x beam_width logprobs, one token)'
    source: vllm/entrypoints/generate/beam_search/offline.py:258-266
    call: llm.generate
    input:
      prompts: = vars.prompts
      sampling_params: '= vars.prompts.map(x, {''logprobs'': 2 * input.beam_width, ''max_tokens'': 1, ''temperature'': has(input.temperature) ? double(input.temperature) : 0.0, ''detokenize'':
        false})'
    as: out
  - set:
      vars.k: 0
      vars.new_instances: []
  - foreach: = input.instances
    as: inst
    steps:
    - set:
        vars.res: = vars.out.value.slice(vars.k, vars.k + size(vars.inst.beams))
        vars.k: = vars.k + size(vars.inst.beams)
    - if: vars.res.exists(r, r.completions[0].finish_reason == 'abort')
      then:
      - title: 'An aborted request ends the whole instance: its beams are completed as aborted'
        source: vllm/entrypoints/generate/beam_search/offline.py:282-292
        set:
          vars.new_instances: '= vars.new_instances + [merge(vars.inst, {''beams'': [], ''completed'': vars.inst.completed + vars.inst.beams.map(b, merge(b, {''finish_reason'': ''abort''}))})]'
      - continue: true
    - title: Every token of the beam's first logprobs position extends it; EOS completes the new beam unless ignore_eos
      source: vllm/entrypoints/generate/beam_search/offline.py:294-316
      set:
        vars.cands: '= lists.range(size(vars.inst.beams)).map(i, has(vars.res[i].completions[0].logprobs) && vars.res[i].completions[0].logprobs != null && size(vars.res[i].completions[0].logprobs)
          > 0 ? vars.res[i].completions[0].logprobs[0].map(e, {''tokens'': vars.inst.beams[i].tokens + [e.token_id], ''cum_logprob'': vars.inst.beams[i].cum_logprob + double(e.logprob),
          ''finish_reason'': null}) : [])'
    - set:
        vars.all_new: []
    - foreach: = vars.cands
      as: cl
      steps:
      - set:
          vars.all_new: = vars.all_new + vars.cl
    - set:
        vars.ended: = vars.all_new.filter(nb, nb.tokens[size(nb.tokens) - 1] == vars.eos && !input.ignore_eos)
        vars.live: = vars.all_new.filter(nb, !(nb.tokens[size(nb.tokens) - 1] == vars.eos && !input.ignore_eos))
    - title: sorted by the length-penalized score (descending), the best beam_width stay live
      source: vllm/entrypoints/generate/beam_search/offline.py:316-321
      set:
        vars.kept: '= vars.live.sortBy(x, -(x.cum_logprob / (vars.lp == 0.0 ? 1.0 : (vars.lp == 0.5 ? math.sqrt(double(math.greatest(size(x.tokens) - (x.tokens[size(x.tokens) - 1] ==
          vars.eos ? 1 : 0), 1))) : (vars.lp == 2.0 ? double(math.greatest(size(x.tokens) - (x.tokens[size(x.tokens) - 1] == vars.eos ? 1 : 0), 1) * math.greatest(size(x.tokens) - (x.tokens[size(x.tokens)
          - 1] == vars.eos ? 1 : 0), 1)) : double(math.greatest(size(x.tokens) - (x.tokens[size(x.tokens) - 1] == vars.eos ? 1 : 0), 1))))))).slice(0, int(math.least(size(vars.live),
          input.beam_width)))'
    - set:
        vars.new_instances: '= vars.new_instances + [merge(vars.inst, {''beams'': vars.kept, ''completed'': vars.inst.completed + vars.ended})]'
  - return:
      should_stop: false
      instances: = vars.new_instances
- component: generate-base-serving
  name: beam-search
  kind: function
  summary: 'BeamSearchOnlineMixin.beam_search, in the API process: one beam of the prompt tokens; then up to max_tokens steps, each sending every live beam to AsyncLLM.generate as a
    one-token request (logprobs 2 x beam_width, id <request_id>-<uuid>-beam-<i>); an error output ends the search with an error, an abort ends it; every logprobs entry of a beam''s first
    position extends it (EOS completes it unless ignore_eos) and the beam_width best stay live; finally completed and live beams are ranked by the length-penalized score and the best
    beam_width are decoded into one RequestOutput.'
  description: The length penalty exponent is computed for 0, 0.5, 1 and 2 (CEL has no general power); other values use 1.
  sources:
  - vllm/entrypoints/generate/beam_search/online.py:22-231
  - vllm/entrypoints/generate/beam_search/utils.py:124-163
  request:
    type: object
    required:
    - prompt_token_ids
    - request_id
    - params
    properties:
      prompt_token_ids:
        type: array
        items:
          type: integer
      prompt:
        type:
        - string
        - 'null'
        default: null
      request_id:
        type: string
        examples:
        - cmpl-bs
      params:
        type: object
        description: BeamSearchParams
        properties:
          beam_width:
            type: integer
            examples:
            - 3
          max_tokens:
            type: integer
            examples:
            - 8
          ignore_eos:
            type: boolean
            default: false
          temperature:
            type: number
            default: 1.0
          length_penalty:
            type: number
            default: 1.0
          include_stop_str_in_output:
            type: boolean
            default: false
          skip_special_tokens:
            type: boolean
            default: true
      lora_request:
        type:
        - object
        - 'null'
        default: null
      eos_token_id:
        type: integer
        default: 128009
        description: 'tokenizer.eos_token_id (Llama-3.1-Instruct: <|eot_id|>)'
  behavior:
  - set:
      vars.bw: = input.params.beam_width
      vars.lp: '= has(input.params.length_penalty) ? double(input.params.length_penalty) : 1.0'
      vars.eos: '= has(input.eos_token_id) ? input.eos_token_id : 128009'
      vars.ignore_eos: = has(input.params.ignore_eos) && input.params.ignore_eos
      vars.plen: = size(input.prompt_token_ids)
  - title: sampling_params = SamplingParams(logprobs=2 * beam_width, max_tokens=1, temperature, detokenize=False); all_beams = [the prompt]
    source: vllm/entrypoints/generate/beam_search/online.py:60-77
    set:
      vars.sp: '= {''logprobs'': 2 * vars.bw, ''max_tokens'': 1, ''temperature'': has(input.params.temperature) ? double(input.params.temperature) : 1.0, ''detokenize'': false, ''n'':
        1, ''output_kind'': ''FINAL_ONLY''}'
      vars.beams: '= [{''tokens'': input.prompt_token_ids, ''cum_logprob'': 0.0, ''finish_reason'': null, ''stop_reason'': null}]'
      vars.completed: []
      vars.error: false
  - title: 'for _ in range(max_tokens): one batch id per step, one request per live beam, gathered'
    source: vllm/entrypoints/generate/beam_search/online.py:79-103
    foreach: = lists.range(input.params.max_tokens)
    as: step
    max: 256
    steps:
    - set:
        vars.batch_id: = input.request_id + '-' + id('random-uuid', seq('random-uuid'))
    - parallel: = vars.beams
      as: beam
      steps:
      - set:
          vars.first: null
      - call: async-llm.generate
        input: '= merge({''request_id'': vars.batch_id + ''-beam-'' + string(vars.index), ''prompt_token_ids'': vars.beam.tokens, ''sampling_params'': vars.sp}, has(input.lora_request)
          && input.lora_request != null ? {''lora_request'': input.lora_request} : {})'
        stream: true
        as: g
        on_item:
        - if: vars.first == null
          then:
          - set:
              vars.first: = vars.item
      - return: '= vars.first != null ? vars.first : vars.g.value'
      join:
        need: all
      as_result: outs
    - set:
        vars.res: '= vars.outs.results.sortBy(o, o.index).map(o, has(o.value.completions) && size(o.value.completions) > 0 ? o.value.completions[0] : {''finish_reason'': o.value.finish_reason,
          ''logprobs'': null, ''token_ids'': o.value.token_ids})'
    - if: vars.res.exists(r, has(r.finish_reason) && r.finish_reason == 'error')
      then:
      - title: 'An error finish reason ends the search: one error output'
        source: vllm/entrypoints/generate/beam_search/online.py:105-126
        set:
          vars.error: true
      - break: true
    - if: vars.res.exists(r, has(r.finish_reason) && r.finish_reason == 'abort')
      then:
      - title: An aborted beam request marks every beam aborted and stops
        source: vllm/entrypoints/generate/beam_search/online.py:128-131
        set:
          vars.beams: '= vars.beams.map(b, merge(b, {''finish_reason'': ''abort''}))'
      - break: true
    - title: Every token of the beam's first logprobs position is a candidate; EOS completes it unless ignore_eos
      source: vllm/entrypoints/generate/beam_search/online.py:133-166
      set:
        vars.cands: '= lists.range(size(vars.beams)).map(i, has(vars.res[i].logprobs) && vars.res[i].logprobs != null && size(vars.res[i].logprobs) > 0 ? vars.res[i].logprobs[0].map(e,
          {''tokens'': vars.beams[i].tokens + [e.token_id], ''cum_logprob'': vars.beams[i].cum_logprob + double(e.logprob), ''finish_reason'': null, ''stop_reason'': null}) : []).flatten()'
    - set:
        vars.completed: '= vars.completed + vars.cands.filter(c, c.tokens[size(c.tokens) - 1] == vars.eos && !vars.ignore_eos).map(c, {''tokens'': has(input.params.include_stop_str_in_output)
          && input.params.include_stop_str_in_output ? c.tokens : c.tokens.slice(0, size(c.tokens) - 1), ''cum_logprob'': c.cum_logprob, ''finish_reason'': ''stop'', ''stop_reason'':
          vars.eos})'
        vars.live: = vars.cands.filter(c, !(c.tokens[size(c.tokens) - 1] == vars.eos && !vars.ignore_eos))
    - title: The beam_width best non-EOS candidates by cumulative logprob become the live beams
      source: vllm/entrypoints/generate/beam_search/online.py:168-196
      set:
        vars.beams: = vars.live.sortBy(c, -c.cum_logprob).slice(0, int(math.least(size(vars.live), vars.bw)))
    - if: size(vars.beams) == 0
      then:
      - break: true
  - if: vars.error
    then:
    - source: vllm/entrypoints/generate/beam_search/online.py:107-125
      return:
        request_id: = input.request_id
        finished: true
        finish_reason: error
        text: ''
        token_ids: []
        final:
          completions:
          - index: 0
            text: ''
            token_ids: []
            finish_reason: error
            stop_reason: null
  - title: completed + live beams ranked by the length-penalized score (sort_beams_key), the best beam_width decoded
    source: vllm/entrypoints/generate/beam_search/online.py:198-210
    set:
      vars.all: = vars.completed + vars.beams
  - set:
      vars.best: '= vars.all.sortBy(x, -(x.cum_logprob / (vars.lp == 0.0 ? 1.0 : (vars.lp == 0.5 ? math.sqrt(double(math.greatest((size(x.tokens) - (x.tokens[size(x.tokens) - 1] == vars.eos
        ? 1 : 0)), 1))) : (vars.lp == 2.0 ? double(math.greatest((size(x.tokens) - (x.tokens[size(x.tokens) - 1] == vars.eos ? 1 : 0)), 1) * math.greatest((size(x.tokens) - (x.tokens[size(x.tokens)
        - 1] == vars.eos ? 1 : 0)), 1)) : double(math.greatest((size(x.tokens) - (x.tokens[size(x.tokens) - 1] == vars.eos ? 1 : 0)), 1))))))).slice(0, int(math.least(size(vars.all),
        vars.bw)))'
      vars.outs: []
  - foreach: = vars.best
    as: beam
    steps:
    - title: beam.text = tokenizer.decode(the tokens after the prompt, without a final EOS)
      source: vllm/entrypoints/generate/beam_search/online.py:200-210
      call: hf-tokenizer.decode
      input:
        ids: = vars.beam.tokens.slice(vars.plen, size(vars.beam.tokens))
        skip_special_tokens: = !has(input.params.skip_special_tokens) || input.params.skip_special_tokens
      as: dec
    - set:
        vars.outs: '= vars.outs + [{''index'': vars.index, ''text'': vars.dec.value.text, ''token_ids'': vars.beam.tokens.slice(vars.plen, size(vars.beam.tokens)), ''cumulative_logprob'':
          vars.beam.cum_logprob, ''finish_reason'': vars.beam.finish_reason != null ? vars.beam.finish_reason : ''length'', ''stop_reason'': vars.beam.stop_reason}]'
  - title: One finished RequestOutput with a CompletionOutput per best beam
    source: vllm/entrypoints/generate/beam_search/online.py:212-231
    return:
      request_id: = input.request_id
      finished: true
      finish_reason: '= size(vars.outs) > 0 ? vars.outs[0].finish_reason : ''length'''
      text: '= size(vars.outs) > 0 ? vars.outs[0].text : '''''
      token_ids: '= size(vars.outs) > 0 ? vars.outs[0].token_ids : []'
      final:
        completions: = vars.outs
- component: transformers-config-utils
  name: maybe-register-config-serialize-by-value
  kind: function
  summary: 'maybe_register_config_serialize_by_value (called by AsyncLLM.__init__, EngineCoreProc startup and get_config with trust_remote_code): multiprocessing.reducer.register(VllmConfig,
    _reduce_config), then cloudpickle.register_pickle_by_value(transformers_modules) only when that module imports. Any exception is logged as a warning, not raised.'
  sources:
  - vllm/transformers_utils/config.py:1105-1177
  latency_ms: 0
  request:
    type: object
    properties:
      transformers_modules_available:
        type: boolean
        default: false
        description: 'ASSUMPTION: transformers_modules exists only after a trust_remote_code config with an AutoConfig class was loaded; the worlds'' checkpoints are stock transformers
          configs'
  response:
    type: object
    properties:
      reducers:
        type: array
        items:
          type: string
      pickle_by_value:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.tm: = has(input.transformers_modules_available) && input.transformers_modules_available
  - title: 'multiprocessing.reducer.register(VllmConfig, _reduce_config): VllmConfig pickles as pickle.loads(cloudpickle.dumps(config))'
    source: vllm/transformers_utils/config.py:1144-1158
    set:
      state.reducers: '= ''VllmConfig'' in state.reducers ? state.reducers : state.reducers + [''VllmConfig'']'
  - title: With transformers_modules importable, cloudpickle (and ray.cloudpickle) pickle it by value
    source: vllm/transformers_utils/config.py:1160-1168
    if: vars.tm && !('transformers_modules' in state.pickle_by_value)
    then:
    - set:
        state.pickle_by_value: = state.pickle_by_value + ['transformers_modules']
  - return:
      reducers: = state.reducers
      pickle_by_value: = state.pickle_by_value
- component: deepseek-v3-reasoning-parser
  name: extract-reasoning
  kind: function
  summary: 'DeepSeekV3ReasoningParser.extract_reasoning: thinking -> the R1 split (drop a leading <think>; without </think> everything is reasoning and content is None; content after
    </think>, None when empty); not thinking -> (None, the whole output).'
  sources:
  - vllm/reasoning/deepseek_v3_reasoning_parser.py:25-37
  - vllm/reasoning/basic_parsers.py:153-176
  - vllm/reasoning/identity_reasoning_parser.py:67-72
  request:
    type: object
    properties:
      model_output:
        type: string
        examples:
        - <think>Paris is the capital.</think>Paris
      chat_template_kwargs:
        type:
        - object
        - 'null'
        default: null
      default_thinking:
        type: boolean
        default: false
        description: 'DeepSeekV3ReasoningWithThinkingParser (--reasoning-parser holo2): with neither thinking nor enable_thinking given, thinking is on'
    required:
    - model_output
  response:
    type: object
    properties:
      reasoning:
        type:
        - string
        - 'null'
      content:
        type:
        - string
        - 'null'
  behavior:
  - title: thinking = bool(chat_template_kwargs.thinking) or bool(chat_template_kwargs.enable_thinking)
    source: vllm/reasoning/deepseek_v3_reasoning_parser.py:28-31
    set:
      vars.kw: '= has(input.chat_template_kwargs) && input.chat_template_kwargs != null ? input.chat_template_kwargs : {}'
  - title: 'DeepSeekV3ReasoningWithThinkingParser: neither key set (None) means thinking=True and enable_thinking=True'
    source: vllm/reasoning/deepseek_v3_reasoning_parser.py:85-96
    if: has(input.default_thinking) && input.default_thinking && !('thinking' in vars.kw && vars.kw.thinking != null) && !('enable_thinking' in vars.kw && vars.kw.enable_thinking !=
      null)
    then:
    - set:
        vars.kw: '= merge(vars.kw, {''thinking'': true, ''enable_thinking'': true})'
  - set:
      vars.thinking: = ('thinking' in vars.kw && vars.kw.thinking == true) || ('enable_thinking' in vars.kw && vars.kw.enable_thinking == true)
  - if: '!vars.thinking'
    then:
    - title: 'IdentityReasoningParser: no reasoning, the whole output is content'
      source: vllm/reasoning/identity_reasoning_parser.py:67-72
      return:
        reasoning: null
        content: = input.model_output
  - title: 'DeepSeekR1ReasoningParser (BaseThinkingReasoningParser.extract_reasoning): partition off a leading <think>'
    source: vllm/reasoning/basic_parsers.py:162-166
    set:
      vars.out: '= input.model_output.contains(''<think>'') ? input.model_output.substring(input.model_output.indexOf(''<think>'') + 7) : input.model_output'
  - if: '!vars.out.contains(''</think>'')'
    then:
    - title: 'No </think>: the model is still reasoning, so all of it is reasoning and content is None'
      source: vllm/reasoning/basic_parsers.py:168-171
      return:
        reasoning: = vars.out
        content: null
  - title: reasoning before </think>, content after it (None when empty)
    source: vllm/reasoning/basic_parsers.py:172-176
    return:
      reasoning: = vars.out.substring(0, vars.out.indexOf('</think>'))
      content: '= vars.out.substring(vars.out.indexOf(''</think>'') + 8) == '''' ? dyn(null) : dyn(vars.out.substring(vars.out.indexOf(''</think>'') + 8))'
