  - return: = vars.params.value
- component: openai-serving-chat
  name: create-chat-completion
  kind: function
  summary: 'create_chat_completion: render, compute max_tokens and the sampling params, then the full generator (await AsyncLLM.generate) or the SSE generator (iterate it).'
  sources:
  - vllm/entrypoints/openai/chat_completion/serving.py:281-431
  request:
    type: object
    properties:
      body:
        $ref: ServingChatCompletionRequest
      x_request_id:
        type:
        - string
        - 'null'
        examples:
        - req-1
    required:
    - body
  behavior:
  - title: The body is parsed into a ChatCompletionRequest first; its model validators refuse inconsistent fields
    source: vllm/entrypoints/openai/chat_completion/api_router.py:41-60
