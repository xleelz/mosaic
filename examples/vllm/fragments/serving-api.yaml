  errors:
  - *id008
  - *id009
  - *id010
  - *id011
  - *id012
  - *id013
  - *id014
  - code: Bad Request
    status: 400
    reachable_by: serving-tokens.abort-requests raises HTTPException 400 for a missing request_ids (vllm/entrypoints/scale_out/token_in_token_out/api_router.py:89-94)
