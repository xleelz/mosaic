  - 'steps.lb.result.error.message == ''token_id(s) [200000] in logit_bias contain out-of-vocab token ids. Vocabulary size: 128256'' && steps.lb.result.error.data.param == ''logit_bias''
    && steps.lb.result.error.data.value == ''[200000]'''
  - 'steps.stop.result.error.message == ''token_id(s) [128256] in stop_token_ids contain out-of-vocab token ids. Vocabulary size: 128256'' && steps.stop.result.error.data.param == ''stop_token_ids'''
  - steps.empty.result.error.message == 'allowed_token_ids is not None and empty!' && steps.allowed.result.error.message == 'allowed_token_ids contains out-of-vocab token id!'
  - steps.ok.result.ok
  - 'steps.plp.result.error.message == ''Requested prompt logprobs of 21, which is greater than max allowed: 20'' && steps.plp.result.error.data.param == ''prompt_logprobs'''
