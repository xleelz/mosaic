  errors:
  - code: system-exit
    status: 0
  behavior:
  - if: '''--omni'' in input.argv'
    then:
    - title: --omni needs vllm-omni installed
      source: vllm/entrypoints/cli/main.py:17-27
      fail:
        code: system-exit
        message: --omni flag requires a valid instance of vllm-omni to be installed.
        data:
          exit_code: 1
  - if: size(input.argv) == 0
    then:
    - title: No subcommand prints the help
      source: vllm/entrypoints/cli/main.py:118-122
      return:
        printed_help: true
  - set:
      vars.cmds: '= {''serve'': ''serve-subcommand.cmd'', ''chat'': ''chat-command.cmd'', ''complete'': ''complete-command.cmd'', ''run-batch'': ''run-batch-subcommand.cmd'', ''launch'':
        ''launch-subcommand.cmd''}'
  - if: '!(input.argv[0] in vars.cmds)'
    then:
    - title: argparse rejects an unknown subcommand
      source: vllm/entrypoints/cli/main.py:110
      fail:
        code: system-exit
        message: '= ''invalid choice: '' + input.argv[0]'
        data:
          exit_code: 2
  - title: cmd.validate(args), then args.dispatch_function(args)
    source: vllm/entrypoints/cli/main.py:111-120
    call: = vars.cmds[input.argv[0]]
    targets:
    - serve-subcommand.cmd
    - chat-command.cmd
    - complete-command.cmd
    - run-batch-subcommand.cmd
    - launch-subcommand.cmd
    input: '= has(input.args) ? input.args : {}'
    as: r
  - return: = vars.r.value
- component: serve-subcommand
  name: cmd
  kind: cli
  summary: 'ServeSubcommand.cmd: pick the serving mode from --grpc, --headless, the DP load-balancing flags and --api-server-count.'
  sources:
  - vllm/entrypoints/cli/serve.py:53-161
  request:
    type: object
    properties:
      model_tag:
        type: string
        examples:
        - meta-llama/Llama-3.1-8B-Instruct
      data_parallel_size:
        type: integer
        default: 1
      grpc:
        type: boolean
        default: false
      headless:
        type: boolean
        default: false
      api_server_count:
        type:
        - integer
        - 'null'
        default: null
      data_parallel_external_lb:
        type: boolean
        default: false
      data_parallel_hybrid_lb:
        type: boolean
        default: false
      data_parallel_multi_port_external_lb:
        type: boolean
        default: false
      data_parallel_rank:
        type:
        - integer
        - 'null'
        default: null
      data_parallel_start_rank:
        type:
        - integer
        - 'null'
        default: null
      data_parallel_size_local:
        type:
        - integer
        - 'null'
        default: null
      tensor_parallel_size:
        type:
        - integer
        - 'null'
        default: null
      pipeline_parallel_size:
        type:
        - integer
        - 'null'
        default: null
      max_model_len:
        type:
        - integer
        - string
        - 'null'
        default: null
        description: '--max-model-len as typed: an int, or a human-readable string (128K, 1m, auto, -1) that EngineArgs parses with human_readable_int_or_auto (arg_utils.py:398-400)'
  errors:
  - code: value-error
    status: 0
  behavior:
  - if: has(input.grpc) && input.grpc
    then:
    - source: vllm/entrypoints/cli/serve.py:59-63
      call: grpc-server.serve-grpc
      as: g
    - return:
        mode: grpc
  - if: has(input.headless) && input.headless && has(input.api_server_count) && input.api_server_count != null && input.api_server_count > 0
    then:
    - source: vllm/entrypoints/cli/serve.py:68-74
      fail:
        code: value-error
        message: = '--api-server-count=' + string(input.api_server_count) + ' cannot be used with --headless (no API servers are started in headless mode).'
  - set:
      vars.external_lb: = (has(input.data_parallel_external_lb) && input.data_parallel_external_lb) || (has(input.data_parallel_rank) && input.data_parallel_rank != null)
      vars.multi_port: = has(input.data_parallel_multi_port_external_lb) && input.data_parallel_multi_port_external_lb
      vars.hybrid_lb: = (has(input.data_parallel_hybrid_lb) && input.data_parallel_hybrid_lb) || (has(input.data_parallel_start_rank) && input.data_parallel_start_rank != null)
  - if: '(vars.external_lb ? 1 : 0) + (vars.multi_port ? 1 : 0) + (vars.hybrid_lb ? 1 : 0) > 1'
    then:
    - source: vllm/entrypoints/cli/serve.py:94-100
      fail:
        code: value-error
        message: Cannot use more than one data parallel load balancing mode.
  - title: Default api_server_count -- headless 0, external/multi-port 1, hybrid the local DP size, else the DP size
    source: vllm/entrypoints/cli/serve.py:76-131
    set:
      vars.count: '= has(input.headless) && input.headless ? 0 : (has(input.api_server_count) && input.api_server_count != null ? input.api_server_count : (vars.multi_port || vars.external_lb
        ? 1 : (vars.hybrid_lb ? (has(input.data_parallel_size_local) && input.data_parallel_size_local != null ? input.data_parallel_size_local : 1) : (has(input.data_parallel_size)
        ? input.data_parallel_size : 1))))'
  - if: vars.multi_port
    then:
    - source: vllm/entrypoints/cli/serve.py:151-152
      return:
        mode: dp-supervisor
  - if: vars.count < 1
    then:
    - title: run_headless -- engine cores only, no API server
      source: vllm/entrypoints/cli/serve.py:153-154
      call: engine-args.create-engine-config
      input:
        model: = config['model']
      fill: true
    - return:
        mode: headless
  - if: vars.count > 1
    then:
    - title: run_multi_api_server
      source: vllm/entrypoints/cli/serve.py:155-156
      return:
        mode: multi-api-server
        api_server_count: = vars.count
  - title: Single API server in this process
    source: vllm/entrypoints/cli/serve.py:157-161
    call: api-server-entry.run-server
    input:
      args: = input
    as: s
  - return:
      mode: single-api-server
      listen_address: = vars.s.value.listen_address
