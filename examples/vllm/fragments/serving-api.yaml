- component: elastic-ep-router
  name: post-scale-elastic-ep
  kind: http
  summary: 'POST /scale_elastic_ep: validate the body, scale through AsyncLLM; drain timeout -> 408, ValueError -> 400, other -> 500.'
  sources:
  - vllm/entrypoints/serve/elastic_ep/api_router.py:27-80
  attributes:
    method: POST
    path: /scale_elastic_ep
  request:
    type: object
    properties:
      path:
        type: string
        examples:
        - /scale_elastic_ep
      body:
        type: object
        properties: {}
    required:
    - path
    - body
  errors:
  - code: Bad Request
    status: 400
  - code: Request Timeout
    status: 408
  - code: Internal Server Error
    status: 500
  behavior:
  - title: Registered with the generate routes
    source: vllm/entrypoints/launchers/api_server/routers.py:49-60
    call: app-state.supported-tasks
    as: tasks
  - if: '!(''generate'' in vars.tasks.value)'
    then:
    - fail:
        code: Not Found
        status: 404
        message: Not Found
  - if: '!has(input.body.new_data_parallel_size) || input.body.new_data_parallel_size == null'
    then:
    - source: vllm/entrypoints/serve/elastic_ep/api_router.py:45-48
      fail:
        code: Bad Request
        status: 400
        message: new_data_parallel_size is required
  - if: type(input.body.new_data_parallel_size) != int || input.body.new_data_parallel_size <= 0
    then:
    - source: vllm/entrypoints/serve/elastic_ep/api_router.py:50-54
      fail:
        code: Bad Request
        status: 400
        message: new_data_parallel_size must be a positive integer
  - if: has(input.body.drain_timeout) && (type(input.body.drain_timeout) != int || input.body.drain_timeout <= 0)
    then:
    - source: vllm/entrypoints/serve/elastic_ep/api_router.py:56-59
      fail:
        code: Bad Request
        status: 400
        message: drain_timeout must be a positive integer
  - call: async-llm.scale-elastic-ep
    input:
      new_data_parallel_size: = input.body.new_data_parallel_size
      drain_timeout: '= has(input.body.drain_timeout) ? input.body.drain_timeout : 120'
    on_error:
    - when: error.code == 'timeout-error'
      source: vllm/entrypoints/serve/elastic_ep/api_router.py:70-75
      fail:
        code: Request Timeout
        status: 408
        message: '= ''Scale failed due to request drain timeout after '' + string(has(input.body.drain_timeout) ? input.body.drain_timeout : 120) + '' seconds'''
    - when: error.code == 'value-error'
      fail:
        code: Bad Request
        status: 400
        message: = error.message
    - source: vllm/entrypoints/serve/elastic_ep/api_router.py:78-80
      fail:
        code: Internal Server Error
        status: 500
        message: Scale failed
  - return:
      message: = 'Scaled to ' + string(input.body.new_data_parallel_size) + ' data parallel engines'
