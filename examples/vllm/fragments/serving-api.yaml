- component: authentication-middleware
  name: call
  kind: function
  summary: 'AuthenticationMiddleware.__call__: guarded prefixes need `Authorization: Bearer <one of --api-key>`.'
  sources:
  - vllm/entrypoints/serve/middleware/authenticate.py:47-62
  request:
    type: object
    properties:
      path:
        type: string
        examples:
        - /v1/chat/completions
      method:
        type: string
        default: POST
      headers:
        $ref: ServingHttpHeaders
  errors:
  - code: unauthorized
    status: 401
    retryable: false
  behavior:
  - title: No --api-key (nor VLLM_API_KEY) means the middleware is not installed
    source: vllm/entrypoints/serve/middleware/register.py:32-36
    if: '!(''api-key'' in config) || config[''api-key''] == null || size(config[''api-key'']) == 0'
    then:
    - return:
        authenticated: false
        reason: no-api-key
  - title: OPTIONS and paths outside /v1, /v2, /inference, /cohere pass unauthenticated
    source: vllm/entrypoints/serve/middleware/authenticate.py:48-59
    if: (has(input.method) && input.method == 'OPTIONS') || !(input.path.startsWith('/v1') || input.path.startsWith('/v2') || input.path.startsWith('/inference') || input.path.startsWith('/cohere'))
    then:
    - return:
        authenticated: false
        reason: unguarded
  - title: verify_token compares the SHA-256 of the bearer token against every configured key
    source: vllm/entrypoints/serve/middleware/authenticate.py:30-45
    set:
      vars.auth: '= has(input.headers) && ''Authorization'' in input.headers ? input.headers[''Authorization''] : '''''
  - if: '!vars.auth.lowerAscii().startsWith(''bearer '') || !(vars.auth.substring(7) in config[''api-key''])'
    then:
    - title: Unauthorized
      source: vllm/entrypoints/serve/middleware/authenticate.py:59-61
      fail:
        code: unauthorized
        status: 401
        message: Unauthorized
  - return:
      authenticated: true
- component: scaling-middleware
  name: call
  kind: function
  summary: 'ScalingMiddleware.__call__: 503 for every HTTP request while elastic EP is scaling.'
  sources:
  - vllm/entrypoints/serve/elastic_ep/middleware.py:33-48
