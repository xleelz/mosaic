  # ---------------- attention backend selection (merged: calls attention's validate-configuration) ----------------
  - id: config-attn-backend-llama-default
    name: "Llama-8B layer on SM90 with no --attention-backend: FlashAttention, the first valid backend"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: cuda-platform.get-attn-backend-cls, caller: operator, as: b, input: {selected_backend: null, num_heads: 32, attn_selector_config: {head_size: 128, dtype: bfloat16, kv_cache_dtype: auto, block_size: null, use_mla: false, has_sink: false, use_sparse: false, attn_type: decoder}}}
    expect:
      - "steps.b.result.ok && steps.b.result.value.backend_cls_path == 'vllm.v1.attention.backends.flash_attn.FlashAttentionBackend'"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'attention-backend.validate-configuration').size() == 5 && trace.filter(e, e.type == 'call.start' && e.interface == 'attention-backend.validate-configuration')[0].input.backend == 'FLASH_ATTN'"
  - id: config-attn-backend-selected
    name: "--attention-backend: TRITON_ATTN accepted; FLASH_ATTN with float32 and an unmodeled class are refused"
