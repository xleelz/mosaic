      - {interface: platforms.setattr, caller: operator, as: badset, input: {name: no_such_attr, qualname: x}}
    expect:
      - "steps.c.result.value.qualname == null"
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'attribute-error'"
      - "!steps.badset.result.ok && steps.badset.result.error.code == 'attribute-error'"

