      - {flow: config-snapshot-server, as: multi, input: {api_server_count: 2}}
      - {flow: config-snapshot-server, as: badtimeout, input: {release_timeout_s: 0}}
    expect:
      - "!steps.grpc.result.ok && steps.grpc.result.error.message == 'snapshot server requires the HTTP frontend'"
      - "!steps.multi.result.ok && steps.multi.result.error.message == 'snapshot server supports one API server'"
      - "!steps.badtimeout.result.ok && steps.badtimeout.result.error.message == 'release timeout must be positive'"
      - "calls['async-llm.generate'] == 0"
  - id: config-snapshot-server-rehearsal-mismatch
    flow: config-snapshot-server
    name: "The rehearsal changes the canary output"
    fixtures: [full-tp1-llama-8b]
