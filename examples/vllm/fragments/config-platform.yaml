  # ---------------- bench probe loop ----------------
  - id: config-bench-probe-loop-disabled
    flow: config-bench-probe-loop
    name: "--probe-request-rate 0 (default): no probe task"
    fixtures: [tp1-llama-8b]
    expect:
      - "passes[2].result.value.sent == 0 && calls['openai-serving-completion.post-v1-completions'] == 0"
  - id: config-bench-probe-loop-running
    flow: config-bench-probe-loop
    name: "10 req/s: one probe per 100 ms on each pass of the loop"
    fixtures: [full-tp1-llama-8b]
    config: {probe-request-rate: 10.0}
    expect:
      - "passes[0].result.value.sent == 1 && passes[2].result.value.sent == 3 && passes[2].result.value.running"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'openai-serving-completion.post-v1-completions' && e.input.body.max_tokens == 1).size() == 3"
      - "passes[1].start_ms - passes[0].start_ms >= 100"
  - id: config-bench-probe-loop-stats
    name: "Write then read: probes recorded by the loop show up in the probe stats"
    fixtures: [full-tp1-llama-8b]
    config: {probe-request-rate: 10.0}
    steps:
      - {flow: config-bench-probe-loop, as: p1}
      - {flow: config-bench-probe-loop, as: p2}
      - {interface: benchmarks-serve.probe-stats, caller: operator, as: stats}
    expect:
      - "steps.p2.result.value.sent == 2 && steps.p1.duration_ms >= 100"
      - "steps.stats.result.value.probe_completed == 2 && steps.stats.result.value.probe_failed == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'openai-serving-completion.post-v1-completions').size() == 2"
  - id: config-bench-probe-loop-failures
    name: "Failed probes are recorded and counted as failed"
    fixtures: [full-tp1-llama-8b]
    config: {probe-request-rate: 20.0}
    faults:
      - {target: openai-serving-completion.post-v1-completions, type: error, code: invalid_request_error, status: 400, calls: [2]}
    steps:
      - {flow: config-bench-probe-loop, as: p1}
      - {flow: config-bench-probe-loop, as: p2}
      - {flow: config-bench-probe-loop, as: p3}
      - {interface: benchmarks-serve.probe-stats, caller: operator, as: stats}
    expect:
      - "steps.stats.result.value.probe_completed == 2 && steps.stats.result.value.probe_failed == 1"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'openai-serving-completion.post-v1-completions' && e.error != null).size() == 1"
  - id: config-bench-probe-loop-stopped
    name: "probe_stop set: the loop exits; no probes means no probe stats"
    fixtures: [tp1-llama-8b]
    config: {probe-request-rate: 10.0}
    state: {benchmarks-serve: {probe_stop: true}}
    steps:
      - {flow: config-bench-probe-loop, as: loop}
      - {interface: benchmarks-serve.probe-stats, caller: operator, as: stats}
    expect:
      - "!steps.loop.result.value.running && steps.stats.result.value == null"

  # ---------------- snapshot server ----------------
  - id: config-snapshot-server-happy
