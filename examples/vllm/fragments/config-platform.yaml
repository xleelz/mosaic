      - {interface: rocm-platform.device-count, caller: operator, as: none}
    expect:
      - "steps.none.result.value.device_count == 0"
  - id: config-rocm-rdna3
    name: "ROCm RDNA3 (gfx1100): gfx1x and gfx1100 hold, FP8 is unsupported and the dtype is e4m3fn"
    fixtures: [tp1-llama-8b]
