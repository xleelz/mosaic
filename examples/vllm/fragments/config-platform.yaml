    description: "A speculators checkpoint as --model: the speculative config is initialized automatically, the method detected (peagle -> eagle3 with parallel drafting), num_speculative_tokens > 0, the draft model is the checkpoint path, and the verifier becomes the served model. The test's text-generation step is not translated (see notes)."
