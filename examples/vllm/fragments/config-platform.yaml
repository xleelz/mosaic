        source: "vllm/platforms/rocm.py:117-130"
        if: "has(input.visible_devices) && input.visible_devices != null && input.visible_devices != ''"
        then:
          - set: {vars.n: "= size(input.visible_devices.split(',').filter(d, d.trim() != '' && int(d.trim()) < vars.n))"}
