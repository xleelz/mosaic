      - {interface: rocm-platform.on-arch, caller: operator, as: g1x, input: {arch: gfx1x}}
      - {interface: rocm-platform.on-arch, caller: operator, as: g1100, input: {arch: gfx1100}}
      - {interface: rocm-platform.supports-fp8, caller: operator, as: fp8}
      - {interface: rocm-platform.fp8-dtype, caller: operator, as: dt}
    expect:
      - "steps.g1x.result.value.result && steps.g1100.result.value.result && !steps.fp8.result.value.supports_fp8 && steps.dt.result.value.dtype == 'torch.float8_e4m3fn'"
  - id: config-quantization-config-args
    name: "QuantizationConfigArgs: shorthands coerce, moe-only shorthands refuse linear, targets must name shorthands and exclude linear/moe"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: quantization-config-args.init, caller: operator, as: ok, input: {linear: fp8_per_block, moe: mxfp4}}
      - {interface: quantization-config-args.init, caller: operator, as: moeonly, input: {linear: nvfp4_per_token}}
      - {interface: quantization-config-args.init, caller: operator, as: targets, input: {targets: {"re:.*mlp.*": fp8_per_channel}}}
      - {interface: quantization-config-args.init, caller: operator, as: badtarget, input: {targets: {"model.layers.0.q_proj": int4}}}
      - {interface: quantization-config-args.init, caller: operator, as: both, input: {linear: fp8_per_tensor, targets: {"re:.*": fp8_per_tensor}}}
    expect:
      - "steps.ok.result.value.linear.shorthand == 'fp8_per_block' && steps.targets.result.ok"
      - "steps.moeonly.result.error.message.contains('does not define a linear spec') && steps.badtarget.result.error.message.contains('is not a valid online shorthand name')"
      - "steps.both.result.error.message.contains('mutually exclusive')"
  - id: config-scheduler-default-factory-and-small-configs
    name: "SchedulerConfig.default_factory (max_model_len 8192), HiSparseConfig bounds, MambaBackendEnum lookup"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: scheduler-config.default-factory, caller: operator, as: sc}
      - {interface: scheduler-config.default-factory, caller: operator, as: nochunk, input: {enable_chunked_prefill: false}}
      - {interface: hisparse-config.init, caller: operator, as: hs, input: {device_buffer_size: 0}}
      - {interface: hisparse-config.init, caller: operator, as: hsok, input: {}}
      - {interface: mamba-config.backend-enum, caller: operator, as: tri, input: {name: TRITON}}
      - {interface: mamba-config.backend-enum, caller: operator, as: bad, input: {name: CUTLASS}}
