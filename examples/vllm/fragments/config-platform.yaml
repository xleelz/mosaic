    fixtures: [tp1-llama-8b]
    config: {vllm-lora-resolver-cache-dir: /opt/lora-adapters}
    state: {local-disk: {paths: {/opt/lora-adapters: {exists: true, is_dir: true}}}}
    expect:
      - "result.ok && calls['lora-resolver-registry.register-resolver'] == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'lora-resolver-registry.register-resolver' && e.input.resolver_name == 'Filesystem Resolver')"
