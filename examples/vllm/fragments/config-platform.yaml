        set:
          vars.fields: "= omit(input.fields, 'device_type', 'mm_encoder_output_widths', 'world_size', 'user_specified_block_size', 'verified')"
      - title: "dataclass_dict.update(kwargs)"
        source: "vllm/config/utils.py:128"
        set: {vars.kw: "= merge(vars.fields, has(input.overrides) ? input.overrides : {})"}
      - title: "cls(**dataclass_dict): the class's constructor and validators run again"
        source: "vllm/config/utils.py:129"
        call: "= {'SchedulerConfig': 'scheduler-config.post-init', 'ParallelConfig': 'parallel-config.post-init', 'MultiModalConfig': 'multimodal-config.init', 'ECTransferConfig': 'ec-transfer-config.post-init', 'DeviceConfig': 'device-config.post-init', 'CacheConfig': 'cache-config.apply-block-size-default'}[input.config_class]"
        targets: [scheduler-config.post-init, parallel-config.post-init, multimodal-config.init, ec-transfer-config.post-init, device-config.post-init, cache-config.apply-block-size-default]
        input: "= vars.kw"
        as: built
      - return: "= vars.built.value"
  - component: speculative-config
    name: hf-config-override
    kind: function
    summary: "SpeculativeConfig.hf_config_override: map a target checkpoint's HF config to its MTP draft config: model_type becomes the *_mtp type, architectures the MTP model class and n_predict the checkpoint's MTP layer count (dots3_note checks one MTP layer type per layer)."
    description: >-
      Table-driven here: the code is a sequence of `if model_type == ...` / `if architectures[0] == ...`
      rewrites, each cited on its own row. Families matched by model type and by initial architecture
      are in two CEL maps; other checkpoints pass through unchanged.
    sources: ["vllm/config/speculative.py:660-1073"]
    request:
      type: object
      required: [hf_config]
      properties:
        hf_config:
          type: object
          properties:
            model_type: {type: string, examples: [deepseek_v3]}
            architectures: {type: array, items: {type: string}}
            num_nextn_predict_layers: {type: [integer, "null"], default: null}
            mtp_num_hidden_layers: {type: [integer, "null"], default: null}
            mtp_layer_types: {type: [array, "null"], default: null}
            layer_types: {type: array, default: []}
            text_config: {type: object}
    response: {type: object}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set:
          vars.h: "= input.hf_config"
          vars.arch0: "= input.hf_config.architectures[0]"
          vars.type: "= input.hf_config.model_type"
          vars.n: "= has(input.hf_config.num_nextn_predict_layers) ? input.hf_config.num_nextn_predict_layers : null"
      - title: "dots3_note: one MTP layer type per MTP layer (default sliding_attention), appended to layer_types"
        source: "vllm/config/speculative.py:664-678"
        if: "vars.type == 'dots3_note'"
        then:
          - set:
              vars.np: "= vars.n != null ? vars.n : 1"
          - set:
              vars.lt: "= has(vars.h.mtp_layer_types) && vars.h.mtp_layer_types != null ? vars.h.mtp_layer_types : lists.range(vars.np).map(i, 'sliding_attention')"
          - if: "size(vars.lt) != vars.np"
            then:
              - fail: {code: value-error, status: 0, message: "= 'mtp_layer_types must have one entry per MTP layer: got ' + string(size(vars.lt)) + ' for ' + string(vars.np) + ' layers'"}
          - return: "= merge(vars.h, {'layer_types': (has(vars.h.layer_types) ? vars.h.layer_types : []) + vars.lt, 'model_type': 'dots3_note_mtp', 'n_predict': vars.np, 'architectures': ['Dots3NoteMTPModel']})"
      - title: "DeepSeek V3 / V3.2 / GLM-MoE-DSA: deepseek_mtp; the DSA models (V3.2, glm_moe_dsa) take the V3.2 MTP class"
        source: "vllm/config/speculative.py:679-694"
        if: "vars.type in ['deepseek_v3', 'deepseek_v32', 'glm_moe_dsa', 'deepseek_mtp']"
        then:
          - return: "= merge(vars.h, {'model_type': 'deepseek_mtp', 'n_predict': vars.n, 'architectures': [vars.type in ['deepseek_v32', 'glm_moe_dsa'] ? 'DeepseekV32MTPModel' : 'DeepSeekMTPModel']})"
      - title: "DeepSeek V4 gets DeepSeekV4MTPModel; V4.1 ships DSpark stages, so only n_predict changes"
        source: "vllm/config/speculative.py:695-706"
        if: "vars.type in ['deepseek_v4', 'deepseek_v41']"
        then:
          - return: "= merge(vars.h, vars.type == 'deepseek_v4' ? {'model_type': 'deepseek_mtp', 'n_predict': vars.n, 'architectures': ['DeepSeekV4MTPModel']} : {'model_type': 'deepseek_mtp', 'n_predict': vars.n})"
      - title: "Kimi-K3 keeps the MTP layer count under text_config"
        source: "vllm/config/speculative.py:713-721"
        if: "vars.type == 'kimi_k3'"
        then:
          - return: "= merge(vars.h, {'model_type': 'kimi_k3_mtp', 'n_predict': has(vars.h.text_config) && has(vars.h.text_config.num_nextn_predict_layers) ? vars.h.text_config.num_nextn_predict_layers : vars.n, 'architectures': ['KimiK3MTPModel']})"
      - title: "Families matched by initial architecture: MiMo (no target layers), MiMo-V2 (one MTP layer), GLM-4 MoE, GLM-OCR, Bailing V2.5 / V3, Mistral Large 3"
        source: "vllm/config/speculative.py:723-808"
        set:
          vars.by_arch: "= {'MiMoForCausalLM': ['mimo_mtp', 'MiMoMTPModel'], 'MiMoV2ForCausalLM': ['mimo_v2_mtp', 'MiMoV2MTPModel'], 'MiMoV2OmniForCausalLM': ['mimo_v2_mtp', 'MiMoV2OmniMTPModel'], 'MiMoV2FlashForCausalLM': ['mimo_v2_mtp', 'MiMoV2MTPModel'], 'Glm4MoeForCausalLM': ['glm4_moe_mtp', 'Glm4MoeMTPModel'], 'Glm4MoeLiteForCausalLM': ['glm4_moe_lite_mtp', 'Glm4MoeLiteMTPModel'], 'GlmOcrForConditionalGeneration': ['glm_ocr_mtp', 'GlmOcrMTPModel'], 'BailingMoeV2_5ForCausalLM': ['bailing_hybrid_mtp', 'BailingMoeV25MTPModel'], 'BailingMoeV3ForCausalLM': ['bailing_hybrid_v3_mtp', 'BailingMoeV3MTPModel'], 'BailingMoeV3VLForConditionalGeneration': ['bailing_hybrid_v3_mtp', 'BailingMoeV3MTPModel']}"
      - if: "vars.arch0 in vars.by_arch"
        then:
          - set:
              vars.m: "= vars.by_arch[vars.arch0]"
          - title: "MiMo and MiMo-V2 drafts carry no target layers"
            source: "vllm/config/speculative.py:723-776"
            return: "= merge(vars.h, merge({'model_type': vars.m[0], 'n_predict': vars.arch0.startsWith('MiMoV2') ? 1 : vars.n, 'architectures': [vars.m[1]]}, vars.arch0.startsWith('MiMo') ? {'num_hidden_layers': 0} : {}))"
      - title: "Families matched by model type: ernie, Nemotron-H with MTP layers, Qwen3-Next, Bailing hybrid, EXAONE, Qwen3.5, LongCat-Flash, Step-3.5, Hunyuan V3/V4"
        source: "vllm/config/speculative.py:810-1000"
        set:
          vars.by_type: "= {'ernie4_5_moe': ['ernie_mtp', 'ErnieMTPModel'], 'ernie_mtp': ['ernie_mtp', 'ErnieMTPModel'], 'nemotron_h_mtp': ['nemotron_h_mtp', 'NemotronHMTPModel'], 'qwen3_next': ['qwen3_next_mtp', 'Qwen3NextMTP'], 'qwen3_next_mtp': ['qwen3_next_mtp', 'Qwen3NextMTP'], 'bailing_hybrid': ['bailing_hybrid_mtp', 'BailingMoeV25MTPModel'], 'bailing_hybrid_mtp': ['bailing_hybrid_mtp', 'BailingMoeV25MTPModel'], 'exaone_moe': ['exaone_moe_mtp', 'ExaoneMoeMTP'], 'exaone_moe_mtp': ['exaone_moe_mtp', 'ExaoneMoeMTP'], 'qwen3_5': ['qwen3_5_mtp', 'Qwen3_5MTP'], 'qwen3_5_text': ['qwen3_5_mtp', 'Qwen3_5MTP'], 'qwen3_5_moe': ['qwen3_5_mtp', 'Qwen3_5MoeMTP'], 'qwen3_5_moe_text': ['qwen3_5_mtp', 'Qwen3_5MoeMTP'], 'longcat_flash': ['longcat_flash_mtp', 'LongCatFlashMTPModel'], 'step3p5': ['step3p5_mtp', 'Step3p5MTP'], 'step3p7': ['step3p5_mtp', 'Step3p5MTP'], 'hy_v3': ['hy_v3_mtp', 'HYV3MTPModel'], 'hy_v4': ['hy_v4_mtp', 'HYV4MTPModel']}"
          vars.t: "= vars.type in ['nemotron_h', 'nemotron_h_puzzle'] && vars.n != null && vars.n > 0 ? 'nemotron_h_mtp' : (vars.type.contains('exaone4_5') ? 'exaone4_5_mtp' : vars.type)"
      - title: "exaone4_5 types map to Exaone4_5_MTP"
        source: "vllm/config/speculative.py:911-917"
        if: "vars.t == 'exaone4_5_mtp'"
        then:
          - return: "= merge(vars.h, {'model_type': 'exaone4_5_mtp', 'n_predict': vars.n, 'architectures': ['Exaone4_5_MTP']})"
      - if: "vars.t in vars.by_type"
        then:
          - set:
              vars.m: "= vars.by_type[vars.t]"
          - title: "Qwen3.5 counts mtp_num_hidden_layers; Nemotron-H, LongCat and Step-3.5 default to one MTP layer"
            source: "vllm/config/speculative.py:918-981"
            return: "= merge(vars.h, {'model_type': vars.m[0], 'n_predict': vars.m[0] == 'qwen3_5_mtp' ? (has(vars.h.mtp_num_hidden_layers) ? vars.h.mtp_num_hidden_layers : null) : (vars.n == null && vars.m[0] in ['nemotron_h_mtp', 'longcat_flash_mtp', 'step3p5_mtp'] ? 1 : vars.n), 'architectures': [vars.m[1]]})"
      - title: "Mistral Large 3 drafts with the EAGLE Mistral class"
        source: "vllm/config/speculative.py:983-984"
        if: "vars.arch0 == 'MistralLarge3ForCausalLM'"
        then:
          - return: "= merge(vars.h, {'architectures': ['EagleMistralLarge3ForCausalLM']})"
      - title: "Any other checkpoint is returned as it is"
        source: "vllm/config/speculative.py:1073"
        return: "= vars.h"
  - component: envs
    name: disable-envs-cache
    kind: function
    summary: "disable_envs_cache: unwrap the functools.cache around __getattr__ so variables are read from os.environ again (test isolation)."
    sources: ["vllm/envs.py:2329-2337"]
    response: {type: object, properties: {was_cached: {type: boolean}}}
    behavior:
      - title: "_is_envs_cache_enabled(): unwrap __getattr__.__wrapped__"
        source: "vllm/envs.py:2335-2337"
        if: "state.cache_enabled"
        then:
          - set:
              state.cache_enabled: false
              state.cache: {}
          - return: {was_cached: true}
      - return: {was_cached: false}
  - component: envs
    name: env-list-with-choices
    kind: function
    summary: "env_list_with_choices: a comma-separated variable split, trimmed and stripped of empty items; unset or empty gives the default list; every item must be one of the choices (case-sensitive by default)."
    sources: ["vllm/envs.py:444-496"]
    request:
      type: object
      required: [env_name]
      properties:
        env_name: {type: string, examples: [VLLM_DISABLED_KERNELS]}
        default: {type: array, items: {type: string}, default: []}
        choices: {type: array, items: {type: string}}
        case_sensitive: {type: boolean, default: true}
    response: {type: object, properties: {value: {type: array, items: {type: string}}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "os.getenv(env_name): a modeled variable's config value, else this process's os.environ (state.environ)"
        source: "vllm/envs.py:466"
        set: {vars.raw: "= input.env_name in state.variables && state.variables[input.env_name] in config ? config[state.variables[input.env_name]] : (input.env_name in state.environ ? state.environ[input.env_name] : null)"}
      - title: "Unset: the default"
        source: "vllm/envs.py:467-468"
        if: "vars.raw == null"
        then: [{return: {value: "= input.default"}}]
      - title: "Split on ',', strip whitespace, drop empty items"
        source: "vllm/envs.py:471"
        set: {vars.values: "= vars.raw.split(',').map(v, v.trim()).filter(v, v != '')"}
      - title: "Nothing left (empty string, only commas): the default"
        source: "vllm/envs.py:473-474"
        if: "size(vars.values) == 0"
        then: [{return: {value: "= input.default"}}]
      - set:
          vars.cs: "= !has(input.case_sensitive) || input.case_sensitive"
      - set:
          vars.bad: "= vars.values.filter(v, vars.cs ? !(v in input.choices) : !(v.lowerAscii() in input.choices.map(c, c.lowerAscii())))"
      - title: "Each item must be a valid choice"
        source: "vllm/envs.py:480-492"
        if: "size(vars.bad) > 0"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Invalid value \\'' + vars.bad[0] + '\\' in ' + input.env_name + '. Valid options: [' + input.choices.map(c, '\\'' + c + '\\'').join(', ') + '].'"}
      - source: "vllm/envs.py:494"
        return: {value: "= vars.values"}
  # ======================= assets =======================
  - component: image-asset
    name: pil-image
    kind: function
    summary: "ImageAsset(name).pil_image: the asset's .jpg from the vLLM public S3 bucket, downloaded once into the local assets cache, then opened with PIL."
    sources: ["vllm/assets/image.py:32-58"]
    request:
      type: object
      required: [name]
      properties:
        name: {type: string, enum: [stop_sign, cherry_blossom, hato, 2560px-Gfp-wisconsin-madison-the-nature-boardwalk, Grayscale_8bits_palette_sample_image, 1280px-Venn_diagram_rgb, RGBA_comp, 237-400x300, 231-200x300, 27-500x500, 17-150x600, handelsblatt-preview, paper-11]}
        ext: {type: string, default: jpg}
    response: {type: object, properties: {path: {type: string}, format: {type: string}, name: {type: string}}}
    errors:
      - {code: http-error, status: 0, retryable: false}
    behavior:
      - title: "pil_image -> pil_image_ext('jpg') -> get_path(ext): get_vllm_public_assets(f'{name}.{ext}', s3_prefix='vision_model_images')"
        source: "vllm/assets/image.py:36-48"
        call: vllm-assets.get-vllm-public-assets
        input: {filename: "= input.name + '.' + (has(input.ext) ? input.ext : 'jpg')", s3_prefix: vision_model_images}
        as: p
      - title: "Image.open(image_path)"
        source: "vllm/assets/image.py:47-48"
        return: {path: "= vars.p.value.path", format: "= (has(input.ext) ? input.ext : 'jpg') == 'jpg' ? 'JPEG' : (has(input.ext) ? input.ext : 'jpg').upperAscii()", name: "= input.name"}
  - component: vllm-assets
    name: get-vllm-public-assets
    kind: function
    summary: "get_vllm_public_assets: <VLLM_ASSETS_CACHE>/vllm_public_assets/<filename>; downloaded from s3://vllm-public-assets/<prefix>/<filename> only when the file isn't there."
    sources: ["vllm/assets/base.py:13-39"]
    attributes: {racy_in_code: "vllm/assets/base.py:29 checks asset_path.exists(), vllm/assets/base.py:32-36 downloads to the path unconditionally, with no lock across processes (lru_cache only dedups within one)"}
    request: {type: object, required: [filename], properties: {filename: {type: string, examples: [stop_sign.jpg]}, s3_prefix: {type: [string, "null"], default: null}}}
    response: {type: object, properties: {path: {type: string}, downloaded: {type: boolean}, meta: {type: object}}}
    errors:
      - {code: http-error, status: 0, retryable: false}
    behavior:
      - title: "get_cache_dir() / 'vllm_public_assets' / filename"
        source: "vllm/assets/base.py:13-28"
        set: {vars.path: "= config['vllm-assets-cache'] + '/vllm_public_assets/' + input.filename"}
      - title: "asset_path.exists()"
        source: "vllm/assets/base.py:29"
        call: local-disk.stat
        input: {path: "= vars.path"}
        as: st
      - if: "vars.st.value.exists"
        then: [{return: {path: "= vars.path", downloaded: false, meta: "= has(vars.st.value.meta) ? vars.st.value.meta : {}"}}]
      - title: "global_http_connection.download_file(f'{VLLM_S3_BUCKET_URL}/{prefix}/{filename}', asset_path, timeout=VLLM_IMAGE_FETCH_TIMEOUT)"
        source: "vllm/assets/base.py:30-36"
        call: vllm-public-assets-s3.get-object
        input: {key: "= has(input.s3_prefix) && input.s3_prefix != null ? input.s3_prefix + '/' + input.filename : input.filename"}
        timeout_ms: "= config['vllm-image-fetch-timeout-s'] * 1000"
        as: obj
        on_error:
          - fail: {code: http-error, status: 0, message: "= 'download of ' + input.filename + ' failed: ' + error.code"}
      - title: "The downloaded file lands in the cache"
        source: "vllm/assets/base.py:32-36"
        call: local-disk.put-path
        input: {path: "= vars.path", exists: true, is_dir: false, size: "= has(vars.obj.value.size) ? vars.obj.value.size : 0", meta: "= vars.obj.value"}
      - return: {path: "= vars.path", downloaded: true, meta: "= vars.obj.value"}
  - component: vllm-public-assets-s3
    name: get-object
    kind: http
    summary: "GET https://vllm-public-assets.s3.us-west-2.amazonaws.com/<key>: rows of `objects` are keyed by object key; a missing key is a 404."
    sources: ["vllm/assets/base.py:10"]
    request: {type: object, required: [key], properties: {key: {type: string, examples: [vision_model_images/stop_sign.jpg]}}}
    response: {type: object, properties: {size: {type: integer}, content_type: {type: string}, sample_rate: {type: integer}}}
    errors: [{code: not_found, status: 404, retryable: false}]
    store: {table: objects, op: get, key: "= input.key", not_found: not_found}
  - component: local-disk
    name: put-path
    kind: io
    summary: "Create or replace a local path's entry (shared infrastructure): the `paths` table local-disk.stat reads."
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [path], properties: {path: {type: string}, exists: {type: boolean, default: true}, is_dir: {type: boolean, default: false}, size: {type: integer, default: 0}, meta: {type: object, default: {}}}}
    response: {type: object, properties: {exists: {type: boolean}, is_dir: {type: boolean}, size: {type: integer}, meta: {type: object}}}
    store: {table: paths, op: put, key: "= input.path", value: {exists: "= input.exists", is_dir: "= input.is_dir", size: "= input.size", meta: "= has(input.meta) ? input.meta : {}"}}

  # ======================= round 4: platform queries, ROCm, owner-ranked configs =======================
  - component: platforms
    name: is-platform
    kind: function
    summary: "Platform.is_cuda / is_rocm / is_tpu / is_xpu / is_cpu / is_out_of_tree compare the current platform's PlatformEnum; is_zen_cpu is False except on the Zen CPU platform."
    sources: ["vllm/platforms/interface.py:71-80", "vllm/platforms/interface.py:196-219"]
    request: {type: object, required: [kind], properties: {kind: {type: string, enum: [cuda, rocm, tpu, xpu, cpu, zen_cpu, out_of_tree]}}}
    response: {type: object, properties: {result: {type: boolean}, platform_enum: {type: string}}}
    behavior:
      - title: "current_platform (resolved lazily)"
        source: "vllm/platforms/__init__.py:303-326"
        call: platforms.getattr
        input: {name: current_platform}
        as: plat
      - title: "PlatformEnum of the resolved class: CUDA, ROCM, TPU, XPU, CPU, OOT (a plugin), UNSPECIFIED"
        source: "vllm/platforms/interface.py:71-80"
        set:
          vars.q: "= vars.plat.value.qualname"
      - set:
          vars.enum: "= vars.q.startsWith('vllm.platforms.cuda') ? 'CUDA' : (vars.q.startsWith('vllm.platforms.rocm') ? 'ROCM' : (vars.q.startsWith('vllm.platforms.tpu') ? 'TPU' : (vars.q.startsWith('vllm.platforms.xpu') ? 'XPU' : (vars.q.startsWith('vllm.platforms.cpu') || vars.q.startsWith('vllm.platforms.zen_cpu') ? 'CPU' : (vars.q.contains('UnspecifiedPlatform') ? 'UNSPECIFIED' : 'OOT')))))"
      - title: "is_zen_cpu: the base Platform says False; ZenCpuPlatform overrides it"
        source: "vllm/platforms/interface.py:215-216"
        if: "input.kind == 'zen_cpu'"
        then: [{return: {result: "= vars.q.contains('ZenCpu')", platform_enum: "= vars.enum"}}]
      - title: "is_<kind>(): self._enum == PlatformEnum.<KIND>"
        source: "vllm/platforms/interface.py:196-209"
        return: {result: "= vars.enum == {'cuda': 'CUDA', 'rocm': 'ROCM', 'tpu': 'TPU', 'xpu': 'XPU', 'cpu': 'CPU', 'out_of_tree': 'OOT'}[input.kind]", platform_enum: "= vars.enum"}
  - component: cuda-platform
    name: get-device-capability
    kind: function
    summary: "NvmlCudaPlatform.get_device_capability: NVML's CUDA compute capability of a visible device as DeviceCapability(major, minor); None when NVML fails."
    sources: ["vllm/platforms/cuda.py:760-768", "vllm/platforms/interface.py:93-134"]
    request: {type: object, properties: {device_id: {type: integer, default: 0}}}
    response: {type: [object, "null"], properties: {major: {type: integer}, minor: {type: integer}, as_int: {type: integer}, version: {type: string}}}
    behavior:
      - title: "nvmlDeviceGetCudaComputeCapability(handle): a RuntimeError gives None"
        source: "vllm/platforms/cuda.py:762-768"
        if: "has(state.nvml_error) && state.nvml_error"
        then: [{return: null}]
      - title: "DeviceCapability(major, minor): to_int() = major*10 + minor (minor < 10), as_version_str() = 'major.minor'"
        source: "vllm/platforms/interface.py:93-134"
        return: {major: "= state.device_capability.major", minor: "= state.device_capability.minor", as_int: "= state.device_capability.major * 10 + state.device_capability.minor", version: "= string(state.device_capability.major) + '.' + string(state.device_capability.minor)"}
  - component: platforms
    name: has-device-capability
    kind: function
    summary: "Platform.has_device_capability / is_device_capability / is_device_capability_family: compare the device capability (a (major, minor) tuple or an int <major><minor>) at-least, exactly, or by major family; no capability means False."
    sources: ["vllm/platforms/interface.py:516-588"]
    request:
      type: object
      required: [capability]
      properties:
        capability: {description: "an int <major><minor> or a [major, minor] pair"}
        mode: {type: string, enum: [at_least, exact, family], default: at_least}
        device_id: {type: integer, default: 0}
    response: {type: object, properties: {result: {type: boolean}}}
    behavior:
      - call: platforms.is-platform
        input: {kind: cuda}
        as: cuda
      - title: "get_device_capability(): the base Platform has none; CUDA asks NVML"
        source: "vllm/platforms/interface.py:516-528"
        if: "vars.cuda.value.result"
        then:
          - call: cuda-platform.get-device-capability
            input: {device_id: "= has(input.device_id) ? input.device_id : 0"}
            as: dc
          - set: {vars.dc: "= vars.dc.value"}
        else:
          - set: {vars.dc: null}
      - title: "No capability: False"
        source: "vllm/platforms/interface.py:542-544"
        if: "vars.dc == null"
        then: [{return: {result: false}}]
      - set:
          vars.mode: "= has(input.mode) ? input.mode : 'at_least'"
          vars.want: "= type(input.capability) == int ? input.capability : input.capability[0] * 10 + input.capability[1]"
      - title: "is_device_capability_family: same major (to_int() // 10)"
        source: "vllm/platforms/interface.py:576-588"
        if: "vars.mode == 'family'"
        then: [{return: {result: "= vars.dc.as_int / 10 == vars.want / 10"}}]
      - title: "is_device_capability: exactly equal"
        source: "vllm/platforms/interface.py:552-572"
        if: "vars.mode == 'exact'"
        then: [{return: {result: "= vars.dc.as_int == vars.want"}}]
      - title: "has_device_capability: current >= requested"
        source: "vllm/platforms/interface.py:546-549"
        return: {result: "= vars.dc.as_int >= vars.want"}
  - component: platforms
    name: get-cpu-architecture
    kind: function
    summary: "Platform.get_cpu_architecture: platform.machine() mapped to CpuArchEnum (X86, ARM, POWERPC, S390X, RISCV, OTHER, UNKNOWN)."
    sources: ["vllm/platforms/interface.py:83-90", "vllm/platforms/interface.py:1151-1169"]
    response: {type: object, properties: {arch: {type: string, enum: [X86, ARM, POWERPC, S390X, RISCV, OTHER, UNKNOWN]}}}
    behavior:
      - title: "machine = platform.machine().lower()"
        source: "vllm/platforms/interface.py:1155"
        set: {vars.m: "= has(state.host.machine) ? state.host.machine.lowerAscii() : 'x86_64'"}
      - title: "x86_64/amd64/i386/i686 -> X86; arm*/aarch* -> ARM; ppc* -> POWERPC; s390x; riscv*; anything else OTHER; empty UNKNOWN"
        source: "vllm/platforms/interface.py:1157-1169"
        return: {arch: "= vars.m in ['x86_64', 'amd64', 'i386', 'i686'] ? 'X86' : (vars.m.startsWith('arm') || vars.m.startsWith('aarch') ? 'ARM' : (vars.m.startsWith('ppc') ? 'POWERPC' : (vars.m == 's390x' ? 'S390X' : (vars.m.startsWith('riscv') ? 'RISCV' : (vars.m != '' ? 'OTHER' : 'UNKNOWN')))))"}
  - component: rocm-platform
    name: on-arch
    kind: function
    summary: "The ROCm on_<arch>() predicates (on_gfx1x, on_gfx11, on_gfx1100, on_gfx1151, on_gfx12x, on_gfx1250, on_rdna4, on_mi3xx, on_gfx9, on_gfx90a, on_gfx942, on_gfx950, on_cdna, on_rdna): substring tests on the GCN arch read once at import."
    sources: ["vllm/platforms/rocm.py:215-232", "vllm/platforms/rocm.py:306-359"]
    request: {type: object, required: [arch], properties: {arch: {type: string, enum: [gfx1x, gfx11, gfx1100, gfx1151, gfx12x, gfx1250, rdna4, mi3xx, gfx9, gfx90a, gfx942, gfx950, cdna, rdna]}}}
    response: {type: object, properties: {result: {type: boolean}, gcn_arch: {type: string}}}
    behavior:
      - title: "_GCN_ARCH and the _ON_* module flags"
        source: "vllm/platforms/rocm.py:215-232"
        set:
          vars.g: "= state.gcn_arch"
      - set:
          vars.cdna: "= vars.g.contains('gfx9') || vars.g.contains('gfx1250')"
          vars.gfx1x: "= vars.g.contains('gfx11') || vars.g.contains('gfx12')"
      - title: "on_gfx1x / on_gfx12x / on_rdna exclude CDNA; the rest are plain substring tests"
        source: "vllm/platforms/rocm.py:306-359"
        set:
          vars.flags: "= {'gfx1x': vars.gfx1x && !vars.cdna, 'gfx11': vars.g.contains('gfx11'), 'gfx1100': vars.g.contains('gfx1100'), 'gfx1151': vars.g.contains('gfx1151'), 'gfx12x': vars.g.contains('gfx12') && !vars.cdna, 'gfx1250': vars.g.contains('gfx1250'), 'rdna4': vars.g.contains('gfx1200') || vars.g.contains('gfx1201'), 'mi3xx': vars.g.contains('gfx942') || vars.g.contains('gfx950'), 'gfx9': vars.g.contains('gfx90a') || vars.g.contains('gfx942') || vars.g.contains('gfx950'), 'gfx90a': vars.g.contains('gfx90a'), 'gfx942': vars.g.contains('gfx942'), 'gfx950': vars.g.contains('gfx950'), 'cdna': vars.cdna, 'rdna': vars.gfx1x && !vars.cdna}"
      - return: {result: "= vars.flags[input.arch]", gcn_arch: "= vars.g"}
  - component: rocm-platform
    name: supports-fp8
    kind: function
    summary: "RocmPlatform.supports_fp8: CDNA (gfx9*, gfx1250) or RDNA4."
