          vars.impls: "= vars.lists.transformMap(name, providers, providers.transformMapEntry(i, p, {p: name in vars.uuids && p in vars.uuids[name] ? vars.uuids[name][p] : name + '.' + p}))"
      - source: "vllm/config/kernel.py:64"
        return: {hash: "= sha256(json(merge(vars.lists, {'_impls': vars.impls})))"}
