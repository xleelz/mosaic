      - "steps.p1.result.value.hash == steps.p2.result.value.hash && steps.s1.result.value.hash != steps.s2.result.value.hash"
      - "steps.k1.result.value.hash == steps.k2.result.value.hash && steps.k1.result.value.hash != steps.k3.result.value.hash"
      - "steps.ir1.result.value.hash == steps.ir1again.result.value.hash && steps.ir1.result.value.hash != steps.ir2.result.value.hash"
      - "steps.kv.result.value.hash == steps.pool.result.value.hash && steps.pool.result.value.hash == steps.dev.result.value.hash && steps.dev.result.value.hash == steps.ec.result.value.hash && size(steps.kv.result.value.hash) == 64"
