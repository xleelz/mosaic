      - "steps.nvfp4.result.value.compilation_config.pass_config.fuse_act_quant && ctx.fuse_act_quant_config_mismatch.derived"
  # ---------------- ObservabilityConfig (tests/config/test_observability.py) ----------------
  - id: config-observability-buckets
    name: "Custom histogram buckets: default None, valid ints become floats, each invalid rule refused; detailed traces need an OTLP endpoint"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: observability-config.init, caller: operator, as: dflt, input: {}}
      - {interface: observability-config.init, caller: operator, as: ok, input: {custom_histogram_buckets: {request_latency: [0.01, 0.05, 0.1, 0.5], time_to_first_token: [1, 2, 5]}}}
      - {interface: observability-config.init, caller: operator, as: bogus, input: {custom_histogram_buckets: {bogus: [1.0, 2.0]}}}
      - {interface: observability-config.init, caller: operator, as: empty, input: {custom_histogram_buckets: {request_latency: []}}}
      - {interface: observability-config.init, caller: operator, as: zero, input: {custom_histogram_buckets: {request_latency: [0.0, 1.0]}}}
      - {interface: observability-config.init, caller: operator, as: same, input: {custom_histogram_buckets: {request_latency: [1.0, 1.0]}}}
      - {interface: observability-config.init, caller: operator, as: boolb, input: {custom_histogram_buckets: {request_latency: [true, 2.0]}}}
      - {interface: observability-config.init, caller: operator, as: second, input: {custom_histogram_buckets: {request_latency: [1.0, 2.0], request_tokens: [16, 8]}}}
      - {interface: observability-config.init, caller: operator, as: traces, input: {collect_detailed_traces: [model]}}
    expect:
      - "steps.dflt.result.ok && steps.dflt.result.value.custom_histogram_buckets == null"
      - "steps.ok.result.ok && steps.ok.result.value.custom_histogram_buckets.time_to_first_token == [1.0, 2.0, 5.0]"
      - "steps.bogus.result.error.message.startsWith(\"custom_histogram_buckets: unknown bucket family 'bogus'; known families: ['inter_token_latency',\")"
      - "steps.zero.result.error.message == \"custom_histogram_buckets['request_latency']: bound 0.0 must be finite and greater than 0\""
      - "steps.same.result.error.message == \"custom_histogram_buckets['request_latency']: bounds [1.0, 1.0] must be strictly increasing\""
      - "steps.boolb.result.error.message == \"custom_histogram_buckets['request_latency']: bound True must be a number, not a boolean\""
      - "steps.empty.result.error.message.contains('must not be empty')"
      - "steps.zero.result.error.message.contains('must be finite and greater than 0')"
      - "steps.same.result.error.message.contains('must be strictly increasing')"
      - "steps.boolb.result.error.message.contains('must be a number, not a boolean')"
      - "steps.second.result.error.message.contains('request_tokens') && steps.second.result.error.message.contains('strictly increasing')"
      - "steps.traces.result.error.message.contains('otlp-traces-endpoint')"
