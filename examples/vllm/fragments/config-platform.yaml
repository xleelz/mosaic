    state: {local-disk: {paths: {/opt/lora-adapters: {exists: true, is_dir: true}}}}
    steps:
      - {flow: config-general-plugins, as: load}
      - {flow: config-vllm-cli, as: serve}
    expect:
      - "steps.load.result.ok && steps.serve.result.ok"
      - "steps.serve.result.ok && trace.filter(e, e.type == 'call.start' && e.interface == 'lora-resolver-registry.register-resolver').size() == 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'plugins.load-general-plugins' && e.output.already_loaded)"
  - id: config-general-plugins-fs-resolver
