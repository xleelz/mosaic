  # ---- Plugins ----
  - id: plugins
    name: vllm.plugins
    kind: module
    parent: control
    layer: control
    sources: ["vllm/plugins/__init__.py:16-33"]
    summary: "Entry-point plugin loading (general, platform, endpoint, io-processor groups)."
    attributes: {owner: config-platform}
    description: >-
      State `entry_points` is what importlib.metadata.entry_points(group=...) discovers, per group;
      the two general plugins are the ones vLLM's own pyproject.toml registers. Each entry gives
      the interface its loaded function runs (`target`), whether plugin.load() succeeds (`loads`)
      and, for factory-style groups, what calling it returns (`returns`, `required_tasks`).
      `plugins_loaded` is the per-process guard of load_general_plugins.
    state:
      schema:
        type: object
        properties:
          plugins_loaded: {type: boolean}
          entry_points: {type: object}
      initial:
        plugins_loaded: false
        entry_points:
          vllm.general_plugins:
            lora_filesystem_resolver: {value: "vllm.plugins.lora_resolvers.filesystem_resolver:register_filesystem_resolver", target: filesystem-resolver.register-filesystem-resolver, loads: true}
