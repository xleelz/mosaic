  - component: quantization-config-args
    name: init
    kind: function
    summary: "QuantizationConfigArgs(...): linear/moe accept an online shorthand (which must define that field's spec) or a quant key; targets map patterns (re: regexes allowed) to shorthand names and exclude linear/moe."
    sources: ["vllm/config/quantization.py:107-224"]
    request:
      type: object
      properties:
        linear: {type: [string, object, "null"], default: null}
        moe: {type: [string, object, "null"], default: null}
        ignore: {type: array, items: {type: string}, default: []}
        targets: {type: [object, "null"], default: null}
    response: {type: object}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "_ONLINE_SHORTHANDS: fp8_per_tensor/block/channel, mxfp8 and mxfp4 define linear and moe; int8_per_channel_weight_only and nvfp4_per_token define only moe"
        source: "vllm/config/quantization.py:192-224"
        set:
          vars.both: [fp8_per_tensor, fp8_per_block, fp8_per_channel, mxfp8, mxfp4]
          vars.moe_only: [int8_per_channel_weight_only, nvfp4_per_token]
      - set:
          vars.all: "= vars.both + vars.moe_only"
          vars.linear: "= has(input.linear) ? input.linear : null"
          vars.moe: "= has(input.moe) ? input.moe : null"
          vars.targets: "= has(input.targets) ? input.targets : null"
      - title: "_coerce_spec: a moe-only shorthand on linear defines no linear spec"
        source: "vllm/config/quantization.py:134-147"
        if: "type(vars.linear) == string && vars.linear in vars.moe_only"
        then:
          - fail: {code: value-error, status: 0, message: "= 'online shorthand \\'' + vars.linear + '\\' does not define a linear spec'"}
      - title: "_validate_targets: every value is a shorthand name; re: keys must compile"
        source: "vllm/config/quantization.py:149-174"
        if: "vars.targets != null"
        then:
          - if: "vars.targets.exists(k, !(vars.targets[k] in vars.all))"
            then:
              - set: {vars.bad: "= vars.targets.filter(k, !(vars.targets[k] in vars.all))[0]"}
              - fail: {code: value-error, status: 0, message: "= 'targets[' + vars.bad + '] = ' + string(vars.targets[vars.bad]) + ' is not a valid online shorthand name'"}
          - title: "_validate_targets_exclusivity: targets exclude linear and moe"
            source: "vllm/config/quantization.py:176-187"
            if: "vars.linear != null || vars.moe != null"
            then:
              - fail: {code: value-error, status: 0, message: "= 'quantization_config.targets is mutually exclusive with quantization_config.linear/moe, got targets=' + '{' + vars.targets.map(k, '\\'' + k + '\\': \\'' + string(vars.targets[k]) + '\\'').join(', ') + '}' + ', linear=' + (vars.linear == null ? 'None' : '\\'' + string(vars.linear) + '\\'') + ', moe=' + (vars.moe == null ? 'None' : '\\'' + string(vars.moe) + '\\'') + '.'"}
      - return:
          linear: "= type(vars.linear) == string ? (vars.linear in vars.all ? {'shorthand': vars.linear} : {'weight': vars.linear}) : vars.linear"
          moe: "= type(vars.moe) == string ? (vars.moe in vars.all ? {'shorthand': vars.moe} : {'weight': vars.moe}) : vars.moe"
          ignore: "= has(input.ignore) ? input.ignore : []"
          targets: "= vars.targets"
  - component: scheduler-config
    name: default-factory
    kind: function
    summary: "SchedulerConfig.default_factory: a SchedulerConfig whose InitVars default to max_model_len 8192 and is_encoder_decoder False (class defaults: 2048 tokens, 128 seqs, chunked prefill on)."
    sources: ["vllm/config/scheduler.py:219-226", "vllm/config/scheduler.py:41-62"]
    request: {type: object, properties: {max_model_len: {type: integer, default: 8192}, max_num_batched_tokens: {type: integer, default: 2048}, max_num_seqs: {type: integer, default: 128}, enable_chunked_prefill: {type: boolean, default: true}, is_encoder_decoder: {type: boolean, default: false}}}
