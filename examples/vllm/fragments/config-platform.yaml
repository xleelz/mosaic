        fused_add_rms_norm: {type: array, items: {type: string}, default: []}
        gelu_and_mul_sparse: {type: array, items: {type: string}, default: []}
        impl_uuids: {type: object, default: {}, description: "IrOp.registry[op].impls[provider].uuid(), keyed op then provider (kernels-ops' registry; given here)"}
    response: {type: object, properties: {hash: {type: string}}}
    behavior:
      - title: "get_hash_factors(self, set()): the three priority lists"
        source: "vllm/config/kernel.py:46"
        set:
          vars.lists: "= {'rms_norm': has(input.rms_norm) ? input.rms_norm : [], 'fused_add_rms_norm': has(input.fused_add_rms_norm) ? input.fused_add_rms_norm : [], 'gelu_and_mul_sparse': has(input.gelu_and_mul_sparse) ? input.gelu_and_mul_sparse : []}"
          vars.uuids: "= has(input.impl_uuids) ? input.impl_uuids : {}"
      - title: "current_platform.import_ir_kernels(), then _impls[name][provider] = IrOp.registry[name].impls[provider].uuid()"
        source: "vllm/config/kernel.py:50-62"
