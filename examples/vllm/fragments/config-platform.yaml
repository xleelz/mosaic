  - component: parallel-config
    name: nnodes-within-dp
    kind: function
    summary: "ParallelConfig.nnodes_within_dp: how many nodes one DP replica spans; external LB rounds up to 1, internal LB needs nnodes divisible by the DP node groups."
    sources: ["vllm/config/parallel.py:807-832"]
    request:
      type: object
      properties:
        nnodes: {type: integer, default: 1}
        data_parallel_size: {type: integer, default: 1}
        data_parallel_size_local: {type: integer, default: 1}
        data_parallel_external_lb: {type: boolean, default: false}
    response: {type: object, properties: {nnodes_within_dp: {type: integer}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "A single node"
        source: "vllm/config/parallel.py:815-816"
        if: "input.nnodes == 1"
        then: [{return: {nnodes_within_dp: 1}}]
      - set:
          vars.groups: "= input.data_parallel_size / input.data_parallel_size_local"
      - set:
          vars.n: "= input.nnodes / vars.groups"
      - title: "External LB pins data_parallel_size_local to 1: a replica occupies at least one node"
        source: "vllm/config/parallel.py:821-822"
        if: "input.data_parallel_external_lb"
        then: [{return: {nnodes_within_dp: "= vars.n > 1 ? vars.n : 1"}}]
      - title: "Internal LB: nnodes must divide evenly over the DP node groups"
        source: "vllm/config/parallel.py:823-831"
        if: "input.nnodes % vars.groups != 0"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Invalid data parallel configuration: nnodes (' + string(input.nnodes) + ') must be divisible by the number of data parallel node groups (' + string(vars.groups) + ' = data_parallel_size ' + string(input.data_parallel_size) + ' / data_parallel_size_local ' + string(input.data_parallel_size_local) + ')'"}
      - source: "vllm/config/parallel.py:832"
        return: {nnodes_within_dp: "= vars.n"}
