      - "steps.tp1draft.result.value.parallel_config.tensor_parallel_size == 2 && steps.tp1draft.result.value.model_config.quantization == 'fp8'"
      - "steps.tp1draft.result.value.speculative_config.draft_tensor_parallel_size == 1 && steps.tp1draft.result.value.speculative_config.draft_quantization == null"
      - "steps.follow.result.value.speculative_config.draft_tensor_parallel_size == 2"
