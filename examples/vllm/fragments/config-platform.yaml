      hf-hub:
        models:
          acme/llama-8b-modelopt-fp8: {architectures: [LlamaForCausalLM], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072, quantization_config: {quant_method: modelopt, quantization: {quant_algo: FP8}}}
