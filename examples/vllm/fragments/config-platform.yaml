  # ---------------- quantization detection and fuse_act_quant (fix round) ----------------
  - id: config-quantization-modelopt-variants
    name: "ModelOpt checkpoints: FP8 -> modelopt, NVFP4 -> modelopt_fp4, MIXED_PRECISION with an NVFP4 layer -> modelopt_mixed; NVFP4 turns on fuse_act_quant at -O2"
    fixtures: [tp1-llama-8b]
    state:
      hf-hub:
        models:
          acme/llama-8b-modelopt-fp8: {architectures: [LlamaForCausalLM], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072, quantization_config: {quant_method: modelopt, quantization: {quant_algo: FP8}}}
          acme/llama-8b-modelopt-nvfp4: {architectures: [LlamaForCausalLM], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072, quantization_config: {quant_method: modelopt, quantization: {quant_algo: NVFP4}}}
          acme/llama-8b-mixed: {architectures: [LlamaForCausalLM], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072, quantization_config: {quant_method: modelopt, quant_algo: MIXED_PRECISION, quantized_layers: {model.layers.0.proj: {quant_algo: FP8}, model.layers.1.proj: {quant_algo: W4A16_NVFP4}}}}
          acme/llama-8b-ct-nvfp4: {architectures: [LlamaForCausalLM], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072, quantization_config: {quant_method: compressed-tensors, format: nvfp4-pack-quantized}}
    steps:
      - {flow: config-create-engine-config, as: fp8, input: {model: acme/llama-8b-modelopt-fp8}}
      - {flow: config-create-engine-config, as: fp4, input: {model: acme/llama-8b-modelopt-nvfp4}}
      - {flow: config-create-engine-config, as: mixed, input: {model: acme/llama-8b-mixed}}
      - {flow: config-create-engine-config, as: ct, input: {model: acme/llama-8b-ct-nvfp4}}
      - {flow: config-create-engine-config, as: o0, input: {model: acme/llama-8b-modelopt-nvfp4, optimization_level: 0}}
    expect:
      - "steps.fp8.result.value.model_config.quantization == 'modelopt' && !steps.fp8.result.value.model_config.is_nvfp4_quantized && !steps.fp8.result.value.compilation_config.pass_config.fuse_act_quant"
      - "steps.fp4.result.value.model_config.quantization == 'modelopt_fp4' && steps.fp4.result.value.compilation_config.pass_config.fuse_act_quant"
      - "steps.mixed.result.value.model_config.quantization == 'modelopt_mixed' && !steps.mixed.result.value.model_config.is_nvfp4_quantized"
      - "steps.ct.result.value.model_config.quantization == 'compressed-tensors' && steps.ct.result.value.model_config.is_nvfp4_quantized"
      - "steps.o0.result.ok && !steps.o0.result.value.compilation_config.pass_config.fuse_act_quant"
  - id: config-quantization-refusals
