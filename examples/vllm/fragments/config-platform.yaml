schemas:
  - id: ConfigEngineArgs
    summary: "The EngineArgs fields the resolution reads (null = not given on the command line)."
    schema:
      type: object
      properties:
        model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}
        usage_context: {type: [string, "null"], enum: [OPENAI_API_SERVER, LLM_CLASS, ENGINE_CONTEXT, null], default: OPENAI_API_SERVER}
        runner: {type: string, enum: [auto, generate, pooling], default: auto}
        max_model_len: {type: [integer, string, "null"], default: null, description: "an int, or the --max-model-len command-line text (128K, 1.5k, auto)"}
        tensor_parallel_size: {type: integer, minimum: 1, default: 1}
        pipeline_parallel_size: {type: integer, minimum: 1, default: 1}
        data_parallel_size: {type: integer, minimum: 1, default: 1}
        data_parallel_hybrid_lb: {type: boolean, default: false}
        data_parallel_external_lb: {type: boolean, default: false}
        data_parallel_backend: {type: string, enum: [mp, ray], default: mp}
        nnodes: {type: integer, minimum: 1, default: 1}
        distributed_executor_backend: {type: [string, "null"], default: null}
        block_size: {type: [integer, "null"], default: null}
        gpu_memory_utilization: {type: number, default: 0.92}
        enable_prefix_caching: {type: [boolean, "null"], default: null}
        enable_chunked_prefill: {type: [boolean, "null"], default: null}
        max_num_seqs: {type: [integer, "null"], default: null}
        max_num_batched_tokens: {type: [integer, "null"], default: null}
        performance_mode: {type: string, enum: [balanced, throughput, interactivity], default: balanced}
        speculative_config: {type: [object, "null"], default: null}
        enable_return_routed_experts: {type: boolean, default: false}
        quantization: {type: [string, "null"], default: null}
        enable_expert_parallel: {type: boolean, default: false}
        enable_eplb: {type: boolean, default: false}
        eplb_num_redundant_experts: {type: integer, default: 0}
        optimization_level: {type: integer, default: 2}
        custom_ops: {type: array, items: {type: string}, default: [none]}
        custom_histogram_buckets: {type: [object, "null"], default: null}
        otlp_traces_endpoint: {type: [string, "null"], default: null}
        collect_detailed_traces: {type: [array, "null"], default: null}
        scheduling_policy: {type: [string, "null"], enum: [fcfs, priority, null], default: null}
        async_scheduling: {type: [boolean, "null"], default: null}
        enforce_eager: {type: boolean, default: false}
        scheduler_reserve_full_isl: {type: boolean, default: true}
        language_model_only: {type: boolean, default: false}
        mm_processor_device: {type: [string, "null"], default: null}
        mm_processor_kwargs: {type: [object, "null"], default: null}
        mm_encoder_attn_backend: {type: [string, "null"], default: null}
        mm_tensor_ipc: {type: string, enum: [direct_rpc, torch_shm], default: direct_rpc}
        ec_transfer_config: {type: [object, "null"], default: null}
        kv_transfer_config: {type: [object, "null"], default: null}
        watermark_config: {type: [object, "null"], default: null}
        hisparse_config: {type: [object, "null"], default: null}
        kv_cache_dtype: {type: string, enum: [auto, float16, bfloat16, fp8, fp8_e4m3, fp8_e5m2, fp8_inc, fp8_ds_mla, nvfp4_ds_mla, turboquant_k8v4, turboquant_4bit_nc, turboquant_k3v4_nc, turboquant_3bit_nc, ultraquant_4bit, int4_per_token_head, int8_per_token_head, fp8_per_token_head, nvfp4, nvfp4_4over6], default: auto}
        hf_overrides: {type: [object, string, "null"], default: null, description: "a dict of HF config keys, or (a string) the qualname of a callable override"}
  - id: ConfigVllmConfig
    summary: "The resolved VllmConfig, reduced to the fields other areas read."
    schema:
      type: object
      properties:
        model_config:
          type: object
          properties:
            model: {type: string}
            max_model_len: {type: integer}
            runner_type: {type: string}
            attn_type: {type: string}
            total_num_attention_heads: {type: integer}
            total_num_kv_heads: {type: integer}
            architectures: {type: array, items: {type: string}}
            quantization: {type: [string, "null"], default: null}
            is_nvfp4_quantized: {type: boolean}
            is_moe: {type: boolean}
            num_experts: {type: integer}
            num_experts_per_tok: {type: integer}
            is_multimodal_model: {type: boolean}
            vision_config: {type: [object, "null"], default: null}
            dtype: {type: string}
            hf_overrides: {type: [object, string, "null"], default: null}
            enforce_eager: {type: boolean}
            multimodal_config: {type: [object, "null"], default: null}
        cache_config:
          type: object
          properties:
            block_size: {type: integer}
            gpu_memory_utilization: {type: number}
            enable_prefix_caching: {type: boolean}
            user_specified_block_size: {type: boolean}
            cache_dtype: {type: string}
        quant_config: {type: [object, "null"], default: null, description: "VllmConfig.quant_config: the checkpoint's quantization config once the device capability and activation dtype are checked"}
        max_concurrent_batches: {type: integer}
        parallel_config:
          type: object
          properties:
            tensor_parallel_size: {type: integer}
            pipeline_parallel_size: {type: integer}
            data_parallel_size: {type: integer}
            world_size: {type: integer}
            distributed_executor_backend: {type: string}
            enable_expert_parallel: {type: boolean}
            enable_eplb: {type: boolean}
            worker_cls: {type: string}
            data_parallel_external_lb: {type: boolean}
            nnodes: {type: integer}
        scheduler_config:
          type: object
          properties:
            max_num_seqs: {type: integer}
            max_num_batched_tokens: {type: integer}
            max_model_len: {type: integer}
            enable_chunked_prefill: {type: boolean}
            policy: {type: string}
            async_scheduling: {type: [boolean, "null"], default: null}
            scheduler_reserve_full_isl: {type: boolean}
        speculative_config: {type: [object, "null"], default: null}
        aux_output_config: {type: object}
        compilation_config:
          type: object
          properties:
            optimization_level: {type: integer}
            custom_ops: {type: array, items: {type: string}}
            pass_config: {type: object, properties: {fuse_act_quant: {type: boolean}, fuse_allreduce_rms: {type: boolean}, fuse_attn_quant: {type: boolean}, fuse_act_padding: {type: boolean}, fuse_mla_dual_rms_norm: {type: boolean}, fuse_rope_kvcache: {type: boolean}, fuse_qk_norm_rope_kvcache: {type: boolean}, enable_qk_norm_rope_fusion: {type: boolean}}}
            cudagraph_mode: {type: string, enum: [NONE, PIECEWISE, FULL, FULL_DECODE_ONLY, FULL_AND_PIECEWISE]}
            use_inductor_graph_partition: {type: boolean}
            mode: {type: integer, description: "CompilationMode: 0 NONE, 1 STOCK_TORCH_COMPILE, 2 DYNAMO_TRACE_ONCE, 3 VLLM_COMPILE"}
        device_config: {type: object, properties: {device: {type: string}}}
        platform: {type: string}
        ec_transfer_config: {type: [object, "null"], default: null}
        kv_transfer_config: {type: [object, "null"], default: null}
        watermark_config: {type: [object, "null"], default: null}
        attention_config: {type: object, properties: {hisparse_config: {type: [object, "null"], default: null}}}
        needs_dp_coordinator: {type: boolean}
  - id: ConfigPlatform
    summary: "What current_platform answers the resolution asks."
    schema:
      type: object
      properties:
        qualname: {type: string, examples: [vllm.platforms.cuda.CudaPlatform]}
        device_type: {type: string, examples: [cuda]}
        device_name: {type: string}
        device_total_memory: {type: integer}
        device_count: {type: integer}
        cpu_architecture: {type: string, examples: [X86]}
        tpu_chip: {type: string}

interfaces:
  # ======================= boundary stubs =======================
  - component: hf-hub
    name: download-config
    kind: http
    summary: "Fetch a model's config.json (shared infrastructure). Rows of `models` are keyed by repo id."
    sources: ["vllm/transformers_utils/config.py:816-860"]
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [model], properties: {model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}}}
    response: {type: object, properties: {architectures: {type: array, items: {type: string}}, num_attention_heads: {type: integer}, num_key_value_heads: {type: integer}, max_position_embeddings: {type: integer}}}
    errors: [{code: not_found, status: 404, retryable: false}]
    store: {table: models, op: get, key: "= input.model", not_found: not_found}
  - component: local-disk
    name: stat
    kind: io
    summary: "Stat a local path (shared infrastructure). Rows of `paths` are keyed by path; a missing path does not exist."
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [path], properties: {path: {type: string}}}
    response: {type: object, properties: {exists: {type: boolean}, is_dir: {type: boolean}}}
    store: {table: paths, op: get, key: "= input.path", default: {exists: false, is_dir: false}}
  - component: gpu-memory
    name: get-memory-info
    kind: io
    summary: "Device (free, total) memory query (shared infrastructure)."
    attributes: {boundary: true, owner: shared}
    request: {type: object, properties: {device: {type: integer}}}
    response: {type: object, properties: {free_bytes: {type: integer}, total_bytes: {type: integer, examples: [85899345920]}}}
  - component: lora-resolver-registry
    name: register-resolver
    kind: function
    sources: ["vllm/lora/resolver.py:52-72"]
    attributes: {boundary: true, owner: models-layers}
    request: {type: object, required: [resolver_name], properties: {resolver_name: {type: string}}}
    response: {type: "null"}
  - component: openai-serving-completion
    name: post-v1-completions
    kind: http
    attributes: {boundary: true, owner: serving-api, method: POST, path: /v1/completions}
    request:
      type: object
      properties:
        path: {type: string, examples: [/v1/completions]}
        headers: {type: object}
        body: {type: object, properties: {model: {type: string, examples: [llama-8b]}, prompt: {type: string}, max_tokens: {type: integer}}}
    response: {type: object, properties: {id: {type: string, examples: [cmpl-abc123]}, choices: {type: array}}}
    errors: [{code: invalid_request_error, status: 400, retryable: false}]
  - component: attention-backend
    name: validate-configuration
    kind: function
    summary: "AttentionBackend.validate_configuration (attention): the reasons a backend can't serve a layer."
    sources: ["vllm/v1/attention/backend.py:276-366"]
    attributes: {boundary: true, owner: attention}
    request: AttnValidateRequest
    response: AttnInvalidReasons
    errors: [{code: key-error, status: 0, retryable: false}]
  - component: cuda-platform
    name: get-attn-backend-cls
    kind: function
    summary: "CudaPlatformBase.get_attn_backend_cls: validate the selected backend, or the first valid backend in the capability's priority order; return its class path."
    sources: ["vllm/platforms/cuda.py:417-516", "vllm/platforms/cuda.py:83-178"]
    request:
      type: object
      properties:
        selected_backend: {type: [string, "null"], default: null}
        attn_selector_config: {type: object}
        num_heads: {type: [integer, "null"], default: null}
    response:
      type: object
      properties:
        backend_cls_path: {type: string, examples: [vllm.v1.attention.backends.flash_attn.FlashAttentionBackend]}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "get_device_capability() (NVML): SM 9.0 on the H100"
        source: "vllm/platforms/cuda.py:424-425"
        set:
          vars.cap: "= state.device_capability"
          vars.sel: "= has(input.attn_selector_config) ? input.attn_selector_config : {}"
      - title: "A selected backend (--attention-backend) is validated alone"
        source: "vllm/platforms/cuda.py:428-446"
        if: "has(input.selected_backend) && input.selected_backend != null"
        then:
          - call: attention-backend.validate-configuration
            on: rank0
            fill: true
            input: "= merge(vars.sel, {'backend': input.selected_backend, 'device_capability': vars.cap})"
            as: v
            on_error:
              - title: "Only ImportError/OSError from the probe become a ValueError; any other error propagates"
                source: "vllm/platforms/cuda.py:435-439"
                if: "error.code == 'import-error' || error.code == 'os-error'"
                then:
                  - fail: {code: value-error, status: 0, message: "= 'Selected backend ' + input.selected_backend + ' is not valid for this configuration. Reason: [' + (error.message.startsWith(error.code == 'os-error' ? 'OSError' : 'ImportError') ? error.message : (error.code == 'os-error' ? 'OSError' : 'ImportError') + ': ' + error.message) + ']'"}
                else:
                  - fail: "= {'code': error.code, 'status': error.status, 'message': error.message}"
          - if: "size(vars.v.value.invalid_reasons) > 0"
            then:
              - title: "Selected backend is not valid for this configuration"
                source: "vllm/platforms/cuda.py:440-444"
                fail: {code: value-error, status: 0, message: "= 'Selected backend ' + input.selected_backend + ' is not valid for this configuration. Reason: [\\'' + vars.v.value.invalid_reasons.join('\\', \\'') + '\\']'"}
          - return: {backend_cls_path: "= state.backend_cls_paths[input.selected_backend]"}
      - title: "_get_backend_priorities: MLA lists by SM major; SM100 prefers FlashInfer for causal attention; otherwise FlashAttention first (Triton FA ahead on SM90 with multimodal prefix)"
        source: "vllm/platforms/cuda.py:83-178"
        set:
          vars.mla: "= has(vars.sel.use_mla) && vars.sel.use_mla"
          vars.mm: "= has(vars.sel.use_mm_prefix) && vars.sel.use_mm_prefix"
          vars.noncausal: "= has(vars.sel.use_non_causal) && vars.sel.use_non_causal"
      - set:
          vars.order: "= vars.mla ? (vars.cap.major == 10 ? ['FLASHINFER_MLA', 'CUTLASS_MLA', 'FLASH_ATTN_MLA', 'FLASHMLA', 'TRITON_MLA'] : (vars.cap.major == 12 ? ['TRITON_MLA'] : ['FLASH_ATTN_MLA', 'FLASHMLA', 'FLASHINFER_MLA', 'TRITON_MLA'])) : (vars.cap.major == 10 && !vars.noncausal ? (vars.mm ? ['TRITON_FLASHINFER'] : []) + ['FLASHINFER', 'FLASH_ATTN', 'TRITON_ATTN', 'FLEX_ATTENTION', 'TURBOQUANT'] : (vars.cap.major == 9 && vars.mm ? ['TRITON_FLASH_ATTN'] : []) + ['FLASH_ATTN', 'FLASHINFER', 'TRITON_ATTN', 'FLEX_ATTENTION', 'TURBOQUANT'])"
          vars.valid: []
          vars.invalid: []
      - title: "get_valid_backends: validate each candidate in priority order; an ImportError/OSError probe failure is recorded as the reason '<Type>: <msg>' and probing continues; any other error propagates"
        source: "vllm/platforms/cuda.py:385-414"
        foreach: "= vars.order"
        as: backend
        steps:
          - call: attention-backend.validate-configuration
            on: rank0
            fill: true
            input: "= merge(vars.sel, {'backend': vars.backend, 'device_capability': vars.cap})"
            as: v
            on_error:
              - title: "except (ImportError, OSError): invalid_reasons_i = [f'{type(e).__name__}: {e}']"
                source: "vllm/platforms/cuda.py:403-407"
                if: "error.code == 'import-error' || error.code == 'os-error'"
                then:
                  - set: {vars.invalid: "= vars.invalid + [vars.backend + ': [' + (error.message.startsWith(error.code == 'os-error' ? 'OSError' : 'ImportError') ? error.message : (error.code == 'os-error' ? 'OSError' : 'ImportError') + ': ' + error.message) + ']']"}
                else:
                  - fail: "= {'code': error.code, 'status': error.status, 'message': error.message}"
          - if: "vars.v.ok && size(vars.v.value.invalid_reasons) == 0"
            then:
              - set: {vars.valid: "= vars.valid + [vars.backend]"}
            else:
              - when: "vars.v.ok"
                title: "The validator's reasons are kept per backend"
                source: "vllm/platforms/cuda.py:408-409"
                set: {vars.invalid: "= vars.invalid + [vars.backend + ': [' + vars.v.value.invalid_reasons.join(', ') + ']']"}
      - title: "No valid attention backend: the ValueError lists every backend's reasons"
        source: "vllm/platforms/cuda.py:456-473"
        if: "size(vars.valid) == 0"
        then:
          - title: "AttentionSelectorConfig.__repr__ names every field (Python True/False/None)"
            source: "vllm/v1/attention/selector.py:41-60"
            set:
              vars.cfg_repr: "= 'AttentionSelectorConfig(head_size=' + (has(vars.sel.head_size) ? string(vars.sel.head_size) : 'None') + ', dtype=torch.' + (has(vars.sel.dtype) ? string(vars.sel.dtype).replace('torch.', '') : 'bfloat16') + ', kv_cache_dtype=' + (has(vars.sel.kv_cache_dtype) && vars.sel.kv_cache_dtype != null ? string(vars.sel.kv_cache_dtype) : 'None') + ', block_size=' + (has(vars.sel.block_size) && vars.sel.block_size != null ? string(vars.sel.block_size) : 'None') + ', use_mla=' + (has(vars.sel.use_mla) && vars.sel.use_mla ? 'True' : 'False') + ', has_sink=' + (has(vars.sel.has_sink) && vars.sel.has_sink ? 'True' : 'False') + ', use_sparse=' + (has(vars.sel.use_sparse) && vars.sel.use_sparse ? 'True' : 'False') + ', use_mm_prefix=' + (has(vars.sel.use_mm_prefix) && vars.sel.use_mm_prefix ? 'True' : 'False') + ', use_per_head_quant_scales=' + (has(vars.sel.use_per_head_quant_scales) && vars.sel.use_per_head_quant_scales ? 'True' : 'False') + ', attn_type=' + (has(vars.sel.attn_type) ? string(vars.sel.attn_type) : 'decoder') + ', has_sliding_window=' + (has(vars.sel.has_sliding_window) && vars.sel.has_sliding_window ? 'True' : 'False') + ', use_non_causal=' + (has(vars.sel.use_non_causal) && vars.sel.use_non_causal ? 'True' : 'False') + ', use_batch_invariant=' + (has(vars.sel.use_batch_invariant) && vars.sel.use_batch_invariant ? 'True' : 'False') + ', use_kv_connector=' + (has(vars.sel.use_kv_connector) && vars.sel.use_kv_connector ? 'True' : 'False') + ', use_adaptive_verification=' + (has(vars.sel.use_adaptive_verification) && vars.sel.use_adaptive_verification ? 'True' : 'False') + ', use_pcp=' + (has(vars.sel.use_pcp) && vars.sel.use_pcp ? 'True' : 'False') + ', use_dcp=' + (has(vars.sel.use_dcp) && vars.sel.use_dcp ? 'True' : 'False') + ', use_rswa=' + (has(vars.sel.use_rswa) && vars.sel.use_rswa ? 'True' : 'False') + ')'"
          - fail: {code: value-error, status: 0, message: "= 'No valid attention backend found for cuda with ' + vars.cfg_repr + '. Reasons: {' + vars.invalid.join(', ') + '}.'"}
      - title: "The highest-priority valid backend wins"
        source: "vllm/platforms/cuda.py:477-516"
        return: {backend_cls_path: "= state.backend_cls_paths[vars.valid[0]]"}
  - component: async-llm
    name: generate
    kind: function
    attributes: {boundary: true, owner: engine-core}
    request: EngineCoreRequest
    response: EngineCoreGenerateResult
    errors:
      - {code: engine-dead-error, status: 500, retryable: false}
      - {code: vllm-validation-error, status: 0, retryable: false}
      - {code: queue-overflow-error, status: 0, retryable: true}
      - {code: max-queued-tokens-error, status: 0, retryable: true}
      - {code: engine-generate-error, status: 0, retryable: false}
      - {code: canceled, status: 0}

  # ======================= console script =======================
  - component: console-scripts
    name: vllm
    kind: cli
    summary: "The `vllm` console script (pyproject [project.scripts] -> vllm.entrypoints.cli.main:main)."
    sources: ["pyproject.toml:43", "vllm/entrypoints/cli/main.py:39-120"]
    request:
      type: object
      properties:
        subcommand: {type: string, examples: [serve]}
        engine_args: {$ref: ConfigEngineArgs}
    errors: [{code: system-exit, status: 0}]
    behavior:
      - title: "vllm bench: never run on UnspecifiedPlatform"
        detail: "For 'vllm bench *' main swaps an unspecified current_platform for CpuPlatform before parsing."
        source: "vllm/entrypoints/cli/main.py:76-89"
        if: "input.subcommand == 'bench'"
        then:
          - {call: platforms.getattr, input: {name: current_platform}, as: plat}
          - if: "vars.plat.value.qualname == 'vllm.platforms.interface.UnspecifiedPlatform'"
            then:
              - {call: platforms.setattr, input: {name: current_platform, qualname: vllm.platforms.cpu.CpuPlatform}}
          - return: {subcommand: bench, dispatched: true}
      - title: "argparse rejects an unknown subcommand"
        detail: "Subcommands come from CMD_MODULES (openai, serve, launch, bench, collect-env, download-kernels, preload, run-batch, snapshot); argparse exits with status 2 on an invalid choice."
        source: "vllm/entrypoints/cli/main.py:58-113"
        if: "!(input.subcommand in ['chat', 'complete', 'serve', 'launch', 'collect-env', 'download-kernels', 'preload', 'run-batch', 'snapshot'])"
        then:
          - fail: {code: system-exit, status: 0, message: "= 'vllm: error: argument subparser: invalid choice: ' + input.subcommand", data: {exit_code: 2}}
      - if: "input.subcommand != 'serve'"
        then:
          - return: {subcommand: "= input.subcommand", dispatched: true}
      - title: "vllm serve: EngineArgs from the parsed CLI namespace"
        source: "vllm/entrypoints/launchers/api_server/entry.py:53"
        call: engine-args.from-cli-args
        input: {args: "= input.engine_args"}
        as: ea
      - title: "build_async_engine_client_from_engine_args creates the VllmConfig with usage_context OPENAI_API_SERVER"
        source: "vllm/entrypoints/launchers/api_server/entry.py:83"
        call: engine-args.create-engine-config
        input: "= merge(vars.ea.value, {'usage_context': 'OPENAI_API_SERVER'})"
        as: cfg
      - return: {subcommand: serve, dispatched: true, vllm_config: "= vars.cfg.value"}

  # ======================= EngineArgs =======================
  - component: engine-args
    name: from-cli-args
    kind: function
    summary: "EngineArgs.from_cli_args: copy the dataclass fields from the argparse namespace, which runs __post_init__."
    sources: ["vllm/engine/arg_utils.py:1932-1941"]
    request: {type: object, properties: {args: {$ref: ConfigEngineArgs}}}
    response: {$ref: ConfigEngineArgs}
    behavior:
      - title: "cls(**{attr: getattr(args, attr) ...}) runs EngineArgs.__post_init__"
        source: "vllm/engine/arg_utils.py:1935-1940"
        call: engine-args.post-init
        input: "= input.args"
        as: ea
      - return: "= vars.ea.value"
  - component: engine-args
    name: post-init
    kind: function
    summary: "EngineArgs.__post_init__: normalize nested configs, fold the legacy routed-experts flag into AuxOutputConfig, load general plugins."
    sources: ["vllm/engine/arg_utils.py:858-931"]
    request: {$ref: ConfigEngineArgs}
    response: {$ref: ConfigEngineArgs}
    behavior:
      - set:
          vars.aux_in: "= has(input.enable_return_routed_experts) && input.enable_return_routed_experts ? {'enable_return_routed_experts': true} : {}"
      - title: "AuxOutputConfig built; enable_return_routed_experts=True sets aux_output_config.enable_return_routed_experts"
        source: "vllm/engine/arg_utils.py:866-869"
        call: aux-output-config.init
        input: "= vars.aux_in"
        as: aux
      - title: "Setup plugins: load_general_plugins() in this process"
        source: "vllm/engine/arg_utils.py:903-906"
        call: plugins.load-general-plugins
      - return: "= merge(input, {'aux_output_config': vars.aux.value})"
  - component: engine-args
    name: create-engine-config
    kind: function
    summary: "EngineArgs.create_engine_config: resolve EngineArgs into a validated VllmConfig."
    sources: ["vllm/engine/arg_utils.py:2205-2872"]
    request: {$ref: ConfigEngineArgs}
    response: {$ref: ConfigVllmConfig}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: validation-error, status: 0, retryable: false}
      - {code: not-implemented-error, status: 0, retryable: false}
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - title: "current_platform resolved (lazily) and its pre_register_and_update hook run"
        source: "vllm/engine/arg_utils.py:2217-2219"
        call: platforms.getattr
        input: {name: current_platform}
        as: plat
      - set:
          vars.model: "= input.model"
          vars.spec: "= input.speculative_config"
          vars.mml: "= has(input.max_model_len) ? input.max_model_len : null"
      - title: "--max-model-len given as command-line text: argparse applied its type (human_readable_int_or_auto) when the args were parsed"
        source: "vllm/engine/arg_utils.py:398-400"
        if: "vars.mml != null && type(vars.mml) == string"
        then:
          - call: engine-args.add-cli-args
            input: {name: max_model_len, value: "= vars.mml"}
            as: mml
          - set: {vars.mml: "= vars.mml.value.value"}
      - title: "maybe_override_with_speculators: read the checkpoint's config.json before ModelConfig"
        detail: "PreTrainedConfig.get_config_dict(model); a missing repo is left for ModelConfig to report."
        source: "vllm/engine/arg_utils.py:2223-2238"
        call: hf-hub.download-config
        input: {model: "= input.model"}
        as: probe
        on_error: continue
      - title: "A speculators checkpoint: the verifier becomes the model, the checkpoint the draft"
        source: "vllm/transformers_utils/config.py:787-813"
        if: "vars.probe.ok && has(vars.probe.value.speculators_config) && vars.probe.value.speculators_config != null"
        then:
          - title: "validate_speculators_config: proposal_methods[0].speculative_tokens, verifier.name_or_path, speculators_model_type and transformer_layer_config are required"
            source: "vllm/transformers_utils/configs/speculators/base.py:77-94"
            if: "!(has(vars.probe.value.speculators_model_type) && has(vars.probe.value.transformer_layer_config) && has(vars.probe.value.speculators_config.proposal_methods) && size(vars.probe.value.speculators_config.proposal_methods) > 0 && has(vars.probe.value.speculators_config.proposal_methods[0].speculative_tokens) && has(vars.probe.value.speculators_config.verifier.name_or_path))"
            then:
              - fail: {code: value-error, status: 0, message: Invalid speculators config structure}
          - title: "build_vllm_speculative_config: peagle -> eagle3 with parallel drafting, dflash2 -> dflash; user --speculative-config overrides, then method and model are locked"
            source: "vllm/transformers_utils/configs/speculators/base.py:113-137"
            set:
              vars.spec: "= merge(merge({'method': vars.probe.value.speculators_model_type == 'peagle' ? 'eagle3' : (vars.probe.value.speculators_model_type == 'dflash2' ? 'dflash' : vars.probe.value.speculators_model_type), 'num_speculative_tokens': vars.probe.value.speculators_config.proposal_methods[0].speculative_tokens, 'parallel_drafting': vars.probe.value.speculators_model_type == 'peagle'}, input.speculative_config == null ? {} : input.speculative_config), {'method': vars.probe.value.speculators_model_type == 'peagle' ? 'eagle3' : (vars.probe.value.speculators_model_type == 'dflash2' ? 'dflash' : vars.probe.value.speculators_model_type), 'model': input.model})"
              vars.model: "= vars.probe.value.speculators_config.verifier.name_or_path"
      - title: "ModelConfig built from the engine args"
        source: "vllm/engine/arg_utils.py:2240"
        call: engine-args.create-model-config
        input: "= merge(input, {'model': vars.model, 'max_model_len': vars.mml})"
        as: mc
      - title: "Unsupported features refused before any config is built"
        source: "vllm/engine/arg_utils.py:2245"
        call: engine-args.check-feature-supported
        input: {pipeline_parallel_size: "= input.pipeline_parallel_size", distributed_executor_backend: "= input.distributed_executor_backend"}
      - title: "Chunked prefill and prefix caching default from what the model supports"
        source: "vllm/engine/arg_utils.py:2246"
        call: engine-args.set-default-chunked-prefill-and-prefix-caching-args
        input:
          enable_chunked_prefill: "= input.enable_chunked_prefill"
          enable_prefix_caching: "= input.enable_prefix_caching"
          runner_type: "= vars.mc.value.runner_type"
          attn_type: "= vars.mc.value.attn_type"
          has_pooler: "= vars.mc.value.has_pooler"
          device_type: "= vars.plat.value.device_type"
          cpu_architecture: "= vars.plat.value.cpu_architecture"
        as: dflt
      - title: "CacheConfig built (block size, gpu_memory_utilization, prefix caching)"
        source: "vllm/engine/arg_utils.py:2265-2291"
        call: cache-config.apply-block-size-default
        input:
          block_size: "= input.block_size"
          gpu_memory_utilization: "= input.gpu_memory_utilization"
          enable_prefix_caching: "= vars.dflt.value.enable_prefix_caching"
          cache_dtype: "= has(input.kv_cache_dtype) ? input.kv_cache_dtype : 'auto'"
        as: cc
      - title: "Data-parallel launch options: hybrid and external LB are exclusive"
        source: "vllm/engine/arg_utils.py:2342-2348"
        if: "input.data_parallel_hybrid_lb && input.data_parallel_external_lb"
        then:
          - fail: {code: value-error, status: 0, message: "Invalid data-parallel launch options: `--data-parallel-hybrid-lb` and `--data-parallel-external-lb` cannot be enabled together. Enable only one load-balancing mode."}
      - title: "Multi-node needs the mp data-parallel backend"
        source: "vllm/engine/arg_utils.py:2349-2356"
        if: "input.nnodes > 1 && input.data_parallel_backend != 'mp'"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Invalid data-parallel launch options: `--nnodes ' + string(input.nnodes) + '` requires `--data-parallel-backend mp`; got `--data-parallel-backend ' + input.data_parallel_backend + '`. Use the MP backend or set `--nnodes 1`.'"}
      - title: "ParallelConfig built (world size, executor backend)"
        source: "vllm/engine/arg_utils.py:2528-2593"
        call: parallel-config.post-init
        input:
          tensor_parallel_size: "= input.tensor_parallel_size"
          pipeline_parallel_size: "= input.pipeline_parallel_size"
          data_parallel_size: "= input.data_parallel_size"
          data_parallel_backend: "= input.data_parallel_backend"
          nnodes: "= input.nnodes"
          distributed_executor_backend: "= input.distributed_executor_backend"
          device_type: "= vars.plat.value.device_type"
          device_count: "= vars.plat.value.device_count"
          enable_expert_parallel: "= has(input.enable_expert_parallel) ? input.enable_expert_parallel : false"
          enable_eplb: "= has(input.enable_eplb) ? input.enable_eplb : false"
          eplb_num_redundant_experts: "= has(input.eplb_num_redundant_experts) ? input.eplb_num_redundant_experts : 0"
          data_parallel_external_lb: "= input.data_parallel_external_lb"
          is_moe_model: "= vars.mc.value.is_moe"
        as: pc
      - title: "SpeculativeConfig built when --speculative-config (or --spec-*) was given"
        source: "vllm/engine/arg_utils.py:2594-2597"
        call: engine-args.create-speculative-config
        input: {speculative_config: "= vars.spec", target_max_model_len: "= vars.mc.value.max_model_len", target_tensor_parallel_size: "= input.tensor_parallel_size", target_hf_overrides: "= has(input.hf_overrides) ? input.hf_overrides : null"}
        as: spec
      - title: "max_num_seqs and max_num_batched_tokens default from usage context and hardware"
        source: "vllm/engine/arg_utils.py:2601-2605"
        call: engine-args.set-default-max-num-seqs-and-batched-tokens-args
        input:
          usage_context: "= input.usage_context"
          max_num_seqs: "= input.max_num_seqs"
          max_num_batched_tokens: "= input.max_num_batched_tokens"
          enable_chunked_prefill: "= vars.dflt.value.enable_chunked_prefill"
          max_model_len: "= vars.mc.value.max_model_len"
          tensor_parallel_size: "= input.tensor_parallel_size"
          pipeline_parallel_size: "= input.pipeline_parallel_size"
          performance_mode: "= input.performance_mode"
          device_type: "= vars.plat.value.device_type"
          device_name: "= vars.plat.value.device_name"
          device_total_memory: "= vars.plat.value.device_total_memory"
          tpu_chip: "= vars.plat.value.tpu_chip"
        as: sd
      - title: "ObservabilityConfig built from the metrics and tracing flags"
        source: "vllm/engine/arg_utils.py:2785"
        call: observability-config.init
        input:
          custom_histogram_buckets: "= has(input.custom_histogram_buckets) ? input.custom_histogram_buckets : null"
          otlp_traces_endpoint: "= has(input.otlp_traces_endpoint) ? input.otlp_traces_endpoint : null"
          collect_detailed_traces: "= has(input.collect_detailed_traces) ? input.collect_detailed_traces : null"
      - title: "SchedulerConfig built and checked against max_model_len"
        source: "vllm/engine/arg_utils.py:2617-2643"
        call: scheduler-config.post-init
        input:
          max_num_seqs: "= vars.sd.value.max_num_seqs"
          max_num_batched_tokens: "= vars.sd.value.max_num_batched_tokens"
          max_model_len: "= vars.mc.value.max_model_len"
          enable_chunked_prefill: "= vars.dflt.value.enable_chunked_prefill"
          is_encoder_decoder: "= vars.mc.value.attn_type == 'encoder_decoder'"
          policy: "= has(input.scheduling_policy) && input.scheduling_policy != null ? input.scheduling_policy : config['scheduling-policy']"
          async_scheduling: "= has(input.async_scheduling) ? input.async_scheduling : null"
          scheduler_reserve_full_isl: "= has(input.scheduler_reserve_full_isl) ? input.scheduler_reserve_full_isl : true"
        as: sc
      - title: "--attention-config.hisparse_config builds a HiSparseConfig"
        source: "vllm/engine/arg_utils.py:2846"
        if: "has(input.hisparse_config) && input.hisparse_config != null"
        then:
          - call: hisparse-config.init
            input: "= input.hisparse_config"
            as: hs
          - set: {vars.hs: "= vars.hs.value"}
        else:
          - set: {vars.hs: null}
      - title: "ECTransferConfig, when --ec-transfer-config was given, validates its role"
        source: "vllm/engine/arg_utils.py:2861"
        if: "has(input.ec_transfer_config) && input.ec_transfer_config != null"
        then:
          - call: ec-transfer-config.post-init
            input: "= input.ec_transfer_config"
            as: ec
          - set: {vars.ec: "= vars.ec.value"}
        else:
          - set: {vars.ec: null}
      - title: "VllmConfig(...) cross-validates every sub-config and applies the platform hook"
        source: "vllm/engine/arg_utils.py:2838-2870"
        call: vllm-config.post-init
        input:
          model_config: "= vars.mc.value"
          cache_config: "= vars.cc.value"
          parallel_config: "= vars.pc.value"
          scheduler_config: "= vars.sc.value"
          speculative_config: "= vars.spec.value"
          aux_output_config: "= has(input.aux_output_config) ? input.aux_output_config : {'enable_return_routed_experts': false, 'max_bytes': null, 'enabled': false}"
          device_config: {device: "= vars.plat.value.device_type"}
          platform: "= vars.plat.value.qualname"
          compilation_config: {optimization_level: "= has(input.optimization_level) ? input.optimization_level : 2", custom_ops: "= has(input.custom_ops) ? input.custom_ops : ['none']"}
          ec_transfer_config: "= vars.ec"
          kv_transfer_config: "= has(input.kv_transfer_config) ? input.kv_transfer_config : null"
          watermark_config: "= has(input.watermark_config) ? input.watermark_config : null"
          attention_config: {hisparse_config: "= vars.hs"}
        as: vc
      - return: "= vars.vc.value"
  - component: engine-args
    name: create-model-config
    kind: function
    summary: "EngineArgs.create_model_config: warn about in-process seeding, then build ModelConfig."
    sources: ["vllm/engine/arg_utils.py:1943-2025"]
    request: {$ref: ConfigEngineArgs}
    behavior:
      - title: "Seed warning when V1 multiprocessing is off (the seed then affects the launching process)"
        source: "vllm/engine/arg_utils.py:1944-1951"
        if: "!config['vllm-enable-v1-multiprocessing']"
        then:
          - set: {ctx.seed_warning: true}
      - title: "ModelConfig(model=..., max_model_len=..., runner=...)"
        source: "vllm/engine/arg_utils.py:1955-2025"
        call: model-config.post-init
        input:
          model: "= input.model"
          max_model_len: "= input.max_model_len"
          runner: "= input.runner"
          quantization: "= has(input.quantization) ? input.quantization : null"
          enforce_eager: "= has(input.enforce_eager) ? input.enforce_eager : false"
          language_model_only: "= has(input.language_model_only) ? input.language_model_only : false"
          mm_processor_device: "= has(input.mm_processor_device) ? input.mm_processor_device : null"
          mm_processor_kwargs: "= has(input.mm_processor_kwargs) ? input.mm_processor_kwargs : null"
          mm_encoder_attn_backend: "= has(input.mm_encoder_attn_backend) ? input.mm_encoder_attn_backend : null"
          mm_tensor_ipc: "= has(input.mm_tensor_ipc) ? input.mm_tensor_ipc : 'direct_rpc'"
          hf_overrides: "= has(input.hf_overrides) ? input.hf_overrides : null"
        as: mc
      - return: "= vars.mc.value"
  - component: engine-args
    name: check-feature-supported
    kind: function
    summary: "EngineArgs._check_feature_supported: pipeline parallelism needs ray, mp, external_launcher or a PP-capable executor."
    sources: ["vllm/engine/arg_utils.py:2874-2891", "vllm/engine/arg_utils.py:3218-3223"]
    request: {type: object, properties: {pipeline_parallel_size: {type: integer}, distributed_executor_backend: {type: [string, "null"], default: null}}}
    errors: [{code: not-implemented-error, status: 0, retryable: false}]
    behavior:
      - title: "PP > 1 without a PP-capable executor backend"
        source: "vllm/engine/arg_utils.py:2876-2891"
        if: "input.pipeline_parallel_size > 1 && !(input.distributed_executor_backend in [null, 'ray', 'mp', 'external_launcher'])"
        then:
          - fail: {code: not-implemented-error, status: 0, message: "Pipeline Parallelism without Ray distributed executor or multiprocessing executor or external launcher is not supported. We recommend to remove Pipeline Parallelism without Ray distributed executor or multiprocessing executor or external launcher from your config."}
      - return: {supported: true}
  - component: engine-args
    name: set-default-chunked-prefill-and-prefix-caching-args
    kind: function
    summary: "Default enable_chunked_prefill / enable_prefix_caching to what the model supports; RISC-V CPUs turn both off."
    sources: ["vllm/engine/arg_utils.py:2987-3055"]
    request:
      type: object
      properties:
        enable_chunked_prefill: {type: [boolean, "null"], default: null}
        enable_prefix_caching: {type: [boolean, "null"], default: null}
        runner_type: {type: string}
        attn_type: {type: string}
        has_pooler: {type: boolean}
        device_type: {type: string}
        cpu_architecture: {type: string}
    response: {type: object, properties: {enable_chunked_prefill: {type: boolean}, enable_prefix_caching: {type: boolean}}}
    behavior:
      - call: model-config.is-chunked-prefill-supported
        input: {attn_type: "= input.attn_type", has_pooler: "= input.has_pooler"}
        as: cp
      - call: model-config.is-prefix-caching-supported
        input: {attn_type: "= input.attn_type", has_pooler: "= input.has_pooler"}
        as: pc
      - set:
          vars.chunked: "= input.enable_chunked_prefill == null ? vars.cp.value.supported : input.enable_chunked_prefill"
          vars.prefix: "= input.enable_prefix_caching == null ? vars.pc.value.supported : input.enable_prefix_caching"
      - title: "Warning: this model does not officially support disabling chunked prefill"
        source: "vllm/engine/arg_utils.py:3000-3009"
        if: "input.enable_chunked_prefill != null && input.runner_type == 'generate' && !input.enable_chunked_prefill && vars.cp.value.supported"
        then:
          - set: {ctx.chunked_prefill_warning: disabling unsupported}
      - title: "RISC-V CPUs: chunked prefill and prefix caching are turned off"
        source: "vllm/engine/arg_utils.py:3039-3055"
        if: "input.device_type == 'cpu' && input.cpu_architecture == 'RISCV'"
        then:
          - set: {vars.chunked: false, vars.prefix: false}
      - return: {enable_chunked_prefill: "= vars.chunked", enable_prefix_caching: "= vars.prefix"}
  - component: engine-args
    name: get-batch-defaults
    kind: function
    summary: "EngineArgs.get_batch_defaults: per-usage-context defaults for max_num_batched_tokens and max_num_seqs by device memory, name and platform."
    sources: ["vllm/engine/arg_utils.py:2894-2985"]
    request:
      type: object
      properties:
        world_size: {type: integer}
        device_type: {type: string}
        device_name: {type: string}
        device_total_memory: {type: integer}
        tpu_chip: {type: string}
    response: {type: object, properties: {max_num_batched_tokens: {type: object}, max_num_seqs: {type: object}}}
    behavior:
      - set:
          vars.gib: 1073741824
          vars.name: "= input.device_name.lowerAscii()"
      - title: "Device memory >= 160 GiB (B200/B300): 16384 tokens, 1024 seqs for both contexts"
        source: "vllm/engine/arg_utils.py:2923-2932"
        if: "input.device_total_memory >= 160 * vars.gib"
        then:
          - set:
              vars.tok: {LLM_CLASS: 16384, OPENAI_API_SERVER: 16384}
              vars.seqs: {LLM_CLASS: 1024, OPENAI_API_SERVER: 1024}
        else:
          - title: "Device memory >= 70 GiB and not an A100 (H100/H200): 16384 offline, 8192 serving; 1024 seqs"
            source: "vllm/engine/arg_utils.py:2933-2942"
            if: "input.device_total_memory >= 70 * vars.gib && !vars.name.contains('a100')"
            then:
              - set:
                  vars.tok: {LLM_CLASS: 16384, OPENAI_API_SERVER: 8192}
                  vars.seqs: {LLM_CLASS: 1024, OPENAI_API_SERVER: 1024}
            else:
              - title: "Other GPUs (A100, smaller): 8192 offline, 2048 serving; 256 seqs"
                source: "vllm/engine/arg_utils.py:2943-2952"
                set:
                  vars.tok: {LLM_CLASS: 8192, OPENAI_API_SERVER: 2048}
                  vars.seqs: {LLM_CLASS: 256, OPENAI_API_SERVER: 256}
      - title: "TPU chips override the token budget"
        source: "vllm/engine/arg_utils.py:2954-2972"
        if: "input.device_type == 'tpu' && input.tpu_chip in ['V6E', 'V5E', 'V5P']"
        then:
          - set:
              vars.tok: "= input.tpu_chip == 'V6E' ? {'LLM_CLASS': 2048, 'OPENAI_API_SERVER': 1024} : (input.tpu_chip == 'V5E' ? {'LLM_CLASS': 1024, 'OPENAI_API_SERVER': 512} : {'LLM_CLASS': 512, 'OPENAI_API_SERVER': 256})"
      - title: "CPU defaults scale with world size"
        source: "vllm/engine/arg_utils.py:2974-2983"
        if: "input.device_type == 'cpu'"
        then:
          - set:
              vars.tok: {LLM_CLASS: "= 4096 * input.world_size", OPENAI_API_SERVER: "= 2048 * input.world_size"}
              vars.seqs: {LLM_CLASS: "= 256 * input.world_size", OPENAI_API_SERVER: "= 128 * input.world_size"}
      - return: {max_num_batched_tokens: "= vars.tok", max_num_seqs: "= vars.seqs"}
  - component: engine-args
    name: set-default-max-num-seqs-and-batched-tokens-args
    kind: function
    summary: "Fill unset max_num_batched_tokens / max_num_seqs from the batch defaults, then clamp them to the model."
    sources: ["vllm/engine/arg_utils.py:3097-3187"]
    request:
      type: object
      properties:
        usage_context: {type: [string, "null"], default: null}
        max_num_seqs: {type: [integer, "null"], default: null}
        max_num_batched_tokens: {type: [integer, "null"], default: null}
        enable_chunked_prefill: {type: boolean}
        max_model_len: {type: integer}
        tensor_parallel_size: {type: integer}
        pipeline_parallel_size: {type: integer}
        performance_mode: {type: string}
        device_type: {type: string}
        device_name: {type: string}
        device_total_memory: {type: integer}
        tpu_chip: {type: string}
    response: {type: object, properties: {max_num_seqs: {type: integer}, max_num_batched_tokens: {type: integer}}}
    behavior:
      - call: engine-args.get-batch-defaults
        input:
          world_size: "= input.pipeline_parallel_size * input.tensor_parallel_size"
          device_type: "= input.device_type"
          device_name: "= input.device_name"
          device_total_memory: "= input.device_total_memory"
          tpu_chip: "= input.tpu_chip"
        as: bd
      - title: "Unset values take the usage context's default, else SchedulerConfig's 2048 tokens / 128 seqs"
        source: "vllm/engine/arg_utils.py:3112-3127"
        set:
          vars.tok: "= input.max_num_batched_tokens != null ? input.max_num_batched_tokens : (input.usage_context != null && input.usage_context in vars.bd.value.max_num_batched_tokens ? vars.bd.value.max_num_batched_tokens[input.usage_context] : 2048)"
          vars.seqs: "= input.max_num_seqs != null ? input.max_num_seqs : (input.usage_context != null && input.usage_context in vars.bd.value.max_num_seqs ? vars.bd.value.max_num_seqs[input.usage_context] : 128)"
      - title: "performance_mode=throughput doubles both defaults"
        source: "vllm/engine/arg_utils.py:3129-3134"
        if: "input.performance_mode == 'throughput'"
        then:
          - set:
              vars.tok: "= input.max_num_batched_tokens == null ? vars.tok * 2 : vars.tok"
              vars.seqs: "= input.max_num_seqs == null ? vars.seqs * 2 : vars.seqs"
      - title: "Defaulted token budget: at least max_model_len without chunked prefill, at most max_num_seqs * max_model_len"
        source: "vllm/engine/arg_utils.py:3136-3170"
        if: "input.max_num_batched_tokens == null"
        then:
          - if: "!input.enable_chunked_prefill"
            then:
              - set: {vars.tok: "= input.max_model_len > vars.tok ? input.max_model_len : vars.tok"}
          - set: {vars.tok: "= vars.seqs * input.max_model_len < vars.tok ? vars.seqs * input.max_model_len : vars.tok"}
      - title: "Defaulted max_num_seqs never exceeds the token budget"
        source: "vllm/engine/arg_utils.py:3178-3180"
        if: "input.max_num_seqs == null"
        then:
          - set: {vars.seqs: "= vars.seqs < vars.tok ? vars.seqs : vars.tok"}
      - return: {max_num_seqs: "= vars.seqs", max_num_batched_tokens: "= vars.tok"}
  - component: engine-args
    name: create-speculative-config
    kind: function
    summary: "EngineArgs.create_speculative_config: no --speculative-config means no SpeculativeConfig; EAGLE drafts inherit the target's positional space."
    sources: ["vllm/engine/arg_utils.py:2060-2099"]
    request: {type: object, properties: {speculative_config: {type: [object, "null"], default: null}, target_max_model_len: {type: integer}, target_tensor_parallel_size: {type: integer, default: 1}, target_hf_overrides: {type: [object, string, "null"], default: null}}}
    response: {type: [object, "null"], default: null}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "No speculative config: return None"
        source: "vllm/engine/arg_utils.py:2083-2084"
        if: "input.speculative_config == null"
        then:
          - return: null
      - title: "ngram / ngram_gpu: no draft model to fetch; the draft config is the target's and the lookup window defaults"
        source: "vllm/config/speculative.py:1171-1174"
        if: "input.speculative_config.method in ['ngram', '[ngram]', 'ngram_gpu']"
        then:
          - set:
              vars.lmin: "= has(input.speculative_config.prompt_lookup_min) ? input.speculative_config.prompt_lookup_min : null"
              vars.lmax: "= has(input.speculative_config.prompt_lookup_max) ? input.speculative_config.prompt_lookup_max : null"
          - title: "Neither bound given: 5 and 5; one given: the other copies it"
            source: "vllm/config/speculative.py:1195-1213"
            set:
              vars.lo: "= vars.lmin == null ? (vars.lmax == null ? 5 : vars.lmax) : vars.lmin"
              vars.hi: "= vars.lmax == null ? (vars.lmin == null ? 5 : vars.lmin) : vars.lmax"
          - title: "prompt_lookup_min must not exceed prompt_lookup_max"
            source: "vllm/config/speculative.py:1215-1220"
            if: "vars.lo > vars.hi"
            then:
              - fail: {code: value-error, status: 0, message: "= 'prompt_lookup_min=' + string(vars.lo) + ' must be <= prompt_lookup_max=' + string(vars.hi)"}
          - return:
              method: "= input.speculative_config.method == 'ngram_gpu' ? 'ngram_gpu' : 'ngram'"
              model: "= input.speculative_config.method == 'ngram_gpu' ? 'ngram_gpu' : 'ngram'"
              num_speculative_tokens: "= has(input.speculative_config.num_speculative_tokens) ? input.speculative_config.num_speculative_tokens : null"
              parallel_drafting: false
              prompt_lookup_min: "= vars.lo"
              prompt_lookup_max: "= vars.hi"
              draft_tensor_parallel_size: "= has(input.target_tensor_parallel_size) ? input.target_tensor_parallel_size : 1"
              draft_quantization: null
              draft_max_position_embeddings: "= input.target_max_model_len"
              draft_sample_method: "= has(input.speculative_config.draft_sample_method) ? input.speculative_config.draft_sample_method : 'greedy'"
              rejection_sample_method: "= has(input.speculative_config.rejection_sample_method) ? input.speculative_config.rejection_sample_method : 'standard'"
      - title: "The draft ModelConfig's hf_overrides: the arch mapping, composed with the target's override only if it is callable (a dict stays on the target)"
        source: "vllm/config/speculative.py:1283-1288"
        call: speculative-config.compose-draft-hf-overrides
        input: {target_hf_overrides: "= has(input.target_hf_overrides) ? input.target_hf_overrides : null"}
        as: dho
      - title: "SpeculativeConfig(**...) fetches the draft model's config"
        source: "vllm/engine/arg_utils.py:2099"
        call: hf-hub.download-config
        input: {model: "= input.speculative_config.model"}
        as: draft
        on_error:
          - fail: {code: value-error, status: 0, message: "= 'Invalid repository ID or local directory specified: \\'' + input.speculative_config.model + '\\'.\\nPlease verify the following requirements:\\n1. Provide a valid Hugging Face repository ID.\\n2. Specify a local directory that contains a recognized configuration file.\\n   - For Hugging Face models: ensure the presence of a \\'config.json\\'.\\n   - For Mistral models: ensure the presence of a \\'params.json\\'.\\n'"}
      - title: "The draft ModelConfig takes the speculative config's own quantization (default None), not the target's, and verifies it against the draft checkpoint"
        source: "vllm/config/speculative.py:1308"
        call: model-config.verify-quantization
        input:
          quantization: "= has(input.speculative_config.quantization) ? input.speculative_config.quantization : null"
          quant_cfg: "= has(vars.draft.value.quantization_config) ? vars.draft.value.quantization_config : null"
        as: dq
      - title: "Draft tensor parallelism, verified independently of the target"
        source: "vllm/config/speculative.py:1549-1555"
        call: speculative-config.verify-and-get-draft-tp
        input:
          target_tensor_parallel_size: "= has(input.target_tensor_parallel_size) ? input.target_tensor_parallel_size : 1"
          draft_tensor_parallel_size: "= has(input.speculative_config.draft_tensor_parallel_size) ? input.speculative_config.draft_tensor_parallel_size : null"
          draft_model_type: "= has(vars.draft.value.model_type) ? vars.draft.value.model_type : ''"
        as: dtp
      - set:
          vars.common: "= {'method': input.speculative_config.method, 'model': input.speculative_config.model, 'num_speculative_tokens': has(input.speculative_config.num_speculative_tokens) ? input.speculative_config.num_speculative_tokens : null, 'parallel_drafting': has(input.speculative_config.parallel_drafting) ? input.speculative_config.parallel_drafting : false, 'draft_tensor_parallel_size': vars.dtp.value.draft_tensor_parallel_size, 'draft_quantization': vars.dq.value.quantization, 'draft_sample_method': has(input.speculative_config.draft_sample_method) ? input.speculative_config.draft_sample_method : 'greedy', 'rejection_sample_method': has(input.speculative_config.rejection_sample_method) ? input.speculative_config.rejection_sample_method : 'standard', 'disable_padded_drafter_batch': has(input.speculative_config.disable_padded_drafter_batch) ? input.speculative_config.disable_padded_drafter_batch : false, 'draft_hf_overrides': vars.dho.value.override}"
      - title: "EAGLE/EAGLE3 drafts: raise max_position_embeddings to the target's max_model_len"
        source: "vllm/config/speculative.py:1393-1400"
        if: "input.speculative_config.method in ['eagle', 'eagle3']"
        then:
          - call: speculative-config.maybe-override-draft-max-position-embeddings
            input: {draft_hf_config: {max_position_embeddings: "= vars.draft.value.max_position_embeddings"}, target_max_model_len: "= input.target_max_model_len"}
            as: ov
          - return: "= merge(vars.common, {'draft_max_position_embeddings': vars.ov.value.max_position_embeddings})"
      - return: "= merge(vars.common, {'draft_max_position_embeddings': vars.draft.value.max_position_embeddings})"

  # ======================= ModelConfig =======================
  - component: model-config
    name: post-init
    kind: function
    summary: "ModelConfig.__post_init__ (the parts the rest of the engine depends on): fetch the HF config (with --hf-overrides applied), resolve the runner, derive and verify max_model_len, read the quantization method, the MoE expert counts and the multimodal config."
    sources: ["vllm/config/model.py:561-811", "vllm/config/model.py:1049-1063"]
    request:
      type: object
      required: [model]
      properties:
        model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}
        max_model_len: {type: [integer, "null"], default: null}
        runner: {type: string, default: auto}
        quantization: {type: [string, "null"], default: null}
        enforce_eager: {type: boolean, default: false}
        language_model_only: {type: boolean, default: false}
        mm_processor_device: {type: [string, "null"], default: null}
        mm_processor_kwargs: {type: [object, "null"], default: null}
        mm_encoder_attn_backend: {type: [string, "null"], default: null}
        mm_tensor_ipc: {type: string, default: direct_rpc}
        hf_overrides: {type: [object, string, "null"], default: null}
    response:
      type: object
      properties:
        model: {type: string}
        is_moe: {type: boolean}
        num_experts: {type: integer}
        num_experts_per_tok: {type: integer}
        enforce_eager: {type: boolean}
        language_model_only: {type: boolean}
        multimodal_config: {type: [object, "null"], default: null}
        is_multimodal_model: {type: boolean}
        vision_config: {type: [object, "null"], default: null}
        max_model_len: {type: integer}
        runner_type: {type: string}
        attn_type: {type: string}
        has_pooler: {type: boolean}
        seq_pooling_type: {type: [string, "null"], default: null}
        tok_pooling_type: {type: [string, "null"], default: null}
        total_num_attention_heads: {type: integer}
        total_num_kv_heads: {type: integer}
        architectures: {type: array}
        quantization: {type: [string, "null"], default: null}
        quantization_config: {type: [object, "null"], default: null}
        is_nvfp4_quantized: {type: boolean}
        dtype: {type: string}
        hf_overrides: {type: [object, string, "null"], default: null}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "get_config: an unknown repo or directory is a ValueError"
        source: "vllm/config/model.py:669-678"
        call: hf-hub.download-config
        input: {model: "= input.model"}
        as: hf
        on_error:
          - title: "Invalid repository ID or local directory specified"
            source: "vllm/transformers_utils/config.py:846-860"
            fail: {code: value-error, status: 0, message: "= 'Invalid repository ID or local directory specified: \\'' + input.model + '\\'.\\nPlease verify the following requirements:\\n1. Provide a valid Hugging Face repository ID.\\n2. Specify a local directory that contains a recognized configuration file.\\n   - For Hugging Face models: ensure the presence of a \\'config.json\\'.\\n   - For Mistral models: ensure the presence of a \\'params.json\\'.\\n'"}
      - set:
          vars.ov: "= has(input.hf_overrides) && input.hf_overrides != null ? input.hf_overrides : {}"
      - title: "A dict --hf-overrides patches the loaded HF config (config.update(hf_overrides_kw)); a callable is applied by name only"
        detail: "Nested dict values are merged into sub-configs in the code (model.py:612-618, 715-735); here they replace the key."
        source: "vllm/config/model.py:605-619"
        set:
          vars.hf: "= type(vars.ov) == map ? merge(vars.hf.value, vars.ov) : vars.hf.value"
          vars.runner_type: "= input.runner == 'pooling' ? 'pooling' : 'generate'"
      - title: "RoPE parameters: rope_scaling / rope_parameters (legacy `type` becomes rope_type; legacy mrope becomes default), or a plain rope_theta (default RoPE)"
        source: "vllm/transformers_utils/config.py:622-653"
        set:
          vars.rs: "= has(vars.hf.rope_scaling) && vars.hf.rope_scaling != null ? vars.hf.rope_scaling : (has(vars.hf.rope_parameters) && vars.hf.rope_parameters != null ? vars.hf.rope_parameters : null)"
      - set:
          vars.rope_type: "= vars.rs != null ? (has(vars.rs.rope_type) ? vars.rs.rope_type : (has(vars.rs.type) ? (vars.rs.type == 'mrope' ? 'default' : vars.rs.type) : 'default')) : (has(vars.hf.rope_type) ? vars.hf.rope_type : 'default')"
          vars.rope_factor: "= vars.rs != null && has(vars.rs.factor) && vars.rs.factor != null ? double(vars.rs.factor) : (has(vars.hf.rope_factor) ? double(vars.hf.rope_factor) : 1.0)"
          vars.has_rope: "= (vars.rs != null || has(vars.hf.rope_theta) || has(vars.hf.rope_type)) && !(has(vars.hf.model_type) && vars.hf.model_type.contains('gemma3'))"
      - title: "max_model_len derived from the HF config and verified against the user's value"
        source: "vllm/config/model.py:810-811"
        call: model-config.get-and-verify-max-len
        input:
          max_model_len: "= input.max_model_len"
          max_position_embeddings: "= has(vars.hf.max_position_embeddings) ? vars.hf.max_position_embeddings : null"
          rope_type: "= vars.rope_type"
          rope_factor: "= vars.rope_factor"
          has_rope_parameters: "= vars.has_rope"
          model_max_length: "= has(vars.hf.model_max_length) ? vars.hf.model_max_length : null"
          spec_target_max_model_len: null
        as: ml
      - title: "validate_model_config_after: max_model_len must be a positive integer"
        source: "vllm/config/model.py:1057-1063"
        if: "vars.ml.value.max_model_len < 1"
        then:
          - fail: {code: value-error, status: 0, message: "= 'max_model_len must be a positive integer, got int: ' + string(vars.ml.value.max_model_len) + '. Example: max_model_len=2048'"}
      - title: "_verify_quantization: the checkpoint's quantization_config decides the method"
        source: "vllm/config/model.py:909"
        call: model-config.verify-quantization
        input:
          quantization: "= has(input.quantization) ? input.quantization : null"
          quant_cfg: "= has(vars.hf.quantization_config) ? vars.hf.quantization_config : null"
        as: q
      - call: model-config.is-nvfp4-quantized
        input: {quantization: "= vars.q.value.quantization", quant_cfg: "= has(vars.hf.quantization_config) ? vars.hf.quantization_config : null"}
        as: nv
      - title: "Init multimodal config if the model supports multimodal inputs: fold --mm-processor-device into mm_processor_kwargs, then MultiModalConfig(...)"
        detail: "The registry's _model_info.supports_multimodal decides; this model reads it from the checkpoint (a vision_config or audio_config section), because models-layers' ModelsModelInfo has no supports_multimodal field."
        source: "vllm/config/model.py:817-868"
        if: "has(vars.hf.vision_config) || has(vars.hf.audio_config)"
        then:
          - call: multimodal-config.fold-mm-processor-device
            input: {mm_processor_kwargs: "= input.mm_processor_kwargs", mm_processor_device: "= input.mm_processor_device"}
            as: fold
          - call: multimodal-config.init
            input:
              language_model_only: "= input.language_model_only"
              mm_processor_kwargs: "= vars.fold.value.mm_processor_kwargs"
              mm_encoder_attn_backend: "= input.mm_encoder_attn_backend"
              mm_tensor_ipc: "= input.mm_tensor_ipc"
            as: mm
          - set: {vars.mm: "= vars.mm.value"}
        else:
          - set: {vars.mm: null}
      - title: "get_num_experts(): the first of num_experts, moe_num_experts, n_routed_experts, num_local_experts in the text config (0 if none); is_moe is num_experts > 0"
        source: "vllm/transformers_utils/model_arch_config_convertor.py:189-206"
        set:
          vars.num_experts: "= has(vars.hf.num_experts) ? vars.hf.num_experts : (has(vars.hf.moe_num_experts) ? vars.hf.moe_num_experts : (has(vars.hf.n_routed_experts) ? vars.hf.n_routed_experts : (has(vars.hf.num_local_experts) ? vars.hf.num_local_experts : 0)))"
      - title: "get_num_experts_per_token(): num_experts_per_tok, num_experts_per_token, top_k_experts, moe_topk or moe_top_k (0 if none)"
        source: "vllm/transformers_utils/model_arch_config_convertor.py:208-219"
        set:
          vars.top_k: "= has(vars.hf.num_experts_per_tok) ? vars.hf.num_experts_per_tok : (has(vars.hf.num_experts_per_token) ? vars.hf.num_experts_per_token : (has(vars.hf.top_k_experts) ? vars.hf.top_k_experts : (has(vars.hf.moe_topk) ? vars.hf.moe_topk : (has(vars.hf.moe_top_k) ? vars.hf.moe_top_k : 0))))"
      - title: "dtype 'auto': the checkpoint's torch_dtype; float32 checkpoints are downcast to the platform's preferred dtype (bfloat16 on CUDA SM80+)"
        source: "vllm/config/model.py:2405-2427"
        set:
          vars.dtype: "= !has(vars.hf.torch_dtype) || vars.hf.torch_dtype == 'float32' ? 'bfloat16' : vars.hf.torch_dtype"
      - return:
          model: "= input.model"
          is_moe: "= vars.num_experts > 0"
          num_experts: "= vars.num_experts"
          num_experts_per_tok: "= vars.top_k"
          enforce_eager: "= input.enforce_eager"
          language_model_only: "= input.language_model_only"
          multimodal_config: "= vars.mm"
          is_multimodal_model: "= vars.mm != null"
          vision_config: "= has(vars.hf.vision_config) ? vars.hf.vision_config : null"
          max_model_len: "= vars.ml.value.max_model_len"
          runner_type: "= vars.runner_type"
          attn_type: "= vars.runner_type == 'pooling' && has(vars.hf.seq_pooling_type) && vars.hf.seq_pooling_type == 'CLS' ? 'encoder_only' : (has(vars.hf.attn_type) ? vars.hf.attn_type : 'decoder')"
          has_pooler: "= vars.runner_type == 'pooling'"
          seq_pooling_type: "= has(vars.hf.seq_pooling_type) ? vars.hf.seq_pooling_type : null"
          tok_pooling_type: "= has(vars.hf.tok_pooling_type) ? vars.hf.tok_pooling_type : null"
          total_num_attention_heads: "= vars.hf.num_attention_heads"
          total_num_kv_heads: "= vars.hf.num_key_value_heads"
          architectures: "= vars.hf.architectures"
          quantization: "= vars.q.value.quantization"
          quantization_config: "= has(vars.hf.quantization_config) ? vars.hf.quantization_config : null"
          is_nvfp4_quantized: "= vars.nv.value.is_nvfp4_quantized"
          dtype: "= vars.dtype"
          hf_overrides: "= has(input.hf_overrides) ? input.hf_overrides : null"
  - component: model-config
    name: verify-quantization
    kind: function
    summary: "ModelConfig._verify_quantization: the checkpoint's quant_method, refined by the override methods (ModelOpt quant_algo FP8 / NVFP4 / MXFP8 / MIXED_PRECISION), must agree with --quantization and be a known method."
    sources: ["vllm/config/model.py:1370-1468", "vllm/model_executor/layers/quantization/modelopt.py:284-299"]
    request: {type: object, properties: {quantization: {type: [string, "null"], default: null}, quant_cfg: {type: [object, "null"], default: null}}}
    response: {type: object, properties: {quantization: {type: [string, "null"], default: null}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set: {vars.q: "= input.quantization"}
      - title: "Parse the quantization method from the HF config"
        source: "vllm/config/model.py:1377-1379"
        if: "input.quant_cfg != null"
        then:
          - set:
              vars.method: "= has(input.quant_cfg.quant_method) ? input.quant_cfg.quant_method : ''"
              vars.algo: "= has(input.quant_cfg.quant_method) && input.quant_cfg.quant_method.lowerAscii().startsWith('modelopt') ? (has(input.quant_cfg.quantization) && has(input.quant_cfg.quantization.quant_algo) ? string(input.quant_cfg.quantization.quant_algo).upperAscii() : (has(input.quant_cfg.quant_algo) ? string(input.quant_cfg.quant_algo).upperAscii() : '')) : ''"
          - title: "Override methods, in preference order: ModelOpt FP8 -> modelopt, NVFP4/FP4 -> modelopt_fp4, MXFP8 -> modelopt_mxfp8, MIXED_PRECISION -> modelopt_mixed"
            source: "vllm/config/model.py:1405-1429"
            set:
              vars.method: "= vars.algo == 'FP8' ? 'modelopt' : (vars.algo.contains('MXFP8') ? 'modelopt_mxfp8' : (vars.algo.contains('FP4') ? 'modelopt_fp4' : (vars.algo == 'MIXED_PRECISION' ? 'modelopt_mixed' : vars.method)))"
          - title: "--quantization disagrees with the checkpoint"
            source: "vllm/config/model.py:1431-1441"
            if: "vars.q != null && vars.method != '' && vars.q != vars.method"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Quantization method specified in the model config (' + vars.method + ') does not match the quantization method specified in the `quantization` argument (' + vars.q + ').'"}
          - set: {vars.q: "= vars.method != '' ? vars.method : vars.q"}
      - title: "Unknown quantization method"
        source: "vllm/config/model.py:1443-1449"
        if: "vars.q != null && !(vars.q in ['awq', 'auto_awq', 'fp8', 'fbgemm_fp8', 'fp_quant', 'modelopt', 'modelopt_fp4', 'modelopt_mxfp8', 'modelopt_mixed', 'auto_gptq', 'gptq', 'gptq_marlin', 'awq_marlin', 'humming', 'compressed-tensors', 'experts_int8', 'quark', 'moe_wna16', 'torchao', 'inc', 'mxfp4', 'gpt_oss_mxfp4', 'deepseek_v4_fp8', 'online', 'fp8_per_tensor', 'fp8_per_block', 'fp8_per_channel', 'int8_per_channel_weight_only', 'nvfp4_per_token', 'mxfp8'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Unknown quantization method: ' + vars.q + '. Must be one of [\\'awq\\', \\'auto_awq\\', \\'fp8\\', \\'fbgemm_fp8\\', \\'fp_quant\\', \\'modelopt\\', \\'modelopt_fp4\\', \\'modelopt_mxfp8\\', \\'modelopt_mixed\\', \\'auto_gptq\\', \\'gptq\\', \\'gptq_marlin\\', \\'awq_marlin\\', \\'humming\\', \\'compressed-tensors\\', \\'experts_int8\\', \\'quark\\', \\'moe_wna16\\', \\'torchao\\', \\'inc\\', \\'mxfp4\\', \\'gpt_oss_mxfp4\\', \\'deepseek_v4_fp8\\', \\'online\\', \\'fp8_per_tensor\\', \\'fp8_per_block\\', \\'fp8_per_channel\\', \\'int8_per_channel_weight_only\\', \\'nvfp4_per_token\\', \\'mxfp8\\'].'"}
      - title: "Deprecated methods need --allow-deprecated-quantization"
        source: "vllm/config/model.py:1452-1466"
        if: "vars.q in ['fbgemm_fp8', 'fp_quant']"
        then:
          - fail: {code: value-error, status: 0, message: "= '(\\'The quantization method %s is deprecated and will be removed in future versions of vLLM. To bypass, set `--allow-deprecated-quantization`.\\', \\'' + vars.q + '\\')'"}
      - return: {quantization: "= vars.q"}
  - component: model-config
    name: is-nvfp4-quantized
    kind: function
    summary: "ModelConfig.is_nvfp4_quantized: modelopt_fp4, a modelopt_mixed checkpoint with any NVFP4 layer (_modelopt_mixed_has_nvfp4), or a compressed-tensors nvfp4 format."
    sources: ["vllm/config/model.py:2283-2302", "vllm/config/model.py:130-142"]
    request: {type: object, properties: {quantization: {type: [string, "null"], default: null}, quant_cfg: {type: [object, "null"], default: null}}}
    response: {type: object, properties: {is_nvfp4_quantized: {type: boolean}}}
    behavior:
      - title: "ModelOpt NVFP4 checkpoints resolve to modelopt_fp4"
        source: "vllm/config/model.py:2287-2288"
        if: "input.quantization == 'modelopt_fp4'"
        then: [{return: {is_nvfp4_quantized: true}}]
      - title: "MIXED_PRECISION: any quantized layer whose quant_algo is NVFP4 (W4A16_NVFP4 doesn't count)"
        source: "vllm/config/model.py:2290-2294"
        if: "input.quantization == 'modelopt_mixed'"
        then:
          - set:
              vars.layers: "= input.quant_cfg == null ? {} : (has(input.quant_cfg.quantized_layers) ? input.quant_cfg.quantized_layers : (has(input.quant_cfg.quantization) && has(input.quant_cfg.quantization.quantized_layers) ? input.quant_cfg.quantization.quantized_layers : {}))"
          - title: "_modelopt_mixed_has_nvfp4"
            source: "vllm/config/model.py:136-142"
            return: {is_nvfp4_quantized: "= vars.layers.exists(k, type(vars.layers[k]) == map && has(vars.layers[k].quant_algo) && vars.layers[k].quant_algo == 'NVFP4')"}
      - title: "compressed-tensors with an nvfp4 format"
        source: "vllm/config/model.py:2296-2302"
        return: {is_nvfp4_quantized: "= input.quantization == 'compressed-tensors' && input.quant_cfg != null && has(input.quant_cfg.format) && input.quant_cfg.format.lowerAscii().contains('nvfp4')"}
  - component: parallel-config
    name: validate-parallel-config
    kind: function
    summary: "ParallelConfig._validate_parallel_config (EPLB part): EPLB needs a CUDA-alike or XPU platform, expert parallelism and TP*PCP*DP > 1; without EPLB, num_redundant_experts must be 0."
    sources: ["vllm/config/parallel.py:517-585"]
    request: {type: object, properties: {enable_eplb: {type: boolean}, enable_expert_parallel: {type: boolean}, tensor_parallel_size: {type: integer}, data_parallel_size: {type: integer}, eplb_num_redundant_experts: {type: integer}, device_type: {type: string}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - if: "input.enable_eplb"
        then:
          - title: "EPLB only on CUDA, ROCm or XPU"
            source: "vllm/config/parallel.py:560-564"
            if: "!(input.device_type in ['cuda', 'xpu'])"
            then:
              - fail: {code: value-error, status: 0, message: "Expert parallelism load balancing is only supported on CUDA devices or ROCm devices or XPU devices now."}
          - title: "EPLB needs expert parallelism"
            source: "vllm/config/parallel.py:565-566"
            if: "!input.enable_expert_parallel"
            then:
              - fail: {code: value-error, status: 0, message: "enable_expert_parallel must be True to use EPLB."}
          - title: "The EP group spans TP x PCP x DP; it must have more than one rank"
            source: "vllm/config/parallel.py:567-579"
            if: "input.tensor_parallel_size * input.data_parallel_size <= 1"
            then:
              - fail: {code: value-error, status: 0, message: "= 'EPLB requires tensor, prefill-context, or data parallelism, but got TP=' + string(input.tensor_parallel_size) + ', PCP=1, DP=' + string(input.data_parallel_size) + '.'"}
        else:
          - title: "num_redundant_experts without EPLB"
            source: "vllm/config/parallel.py:580-587"
            if: "input.eplb_num_redundant_experts != 0"
            then:
              - fail: {code: value-error, status: 0, message: "= 'num_redundant_experts is set to ' + string(input.eplb_num_redundant_experts) + ' but EPLB is not enabled. Either enable EPLB or unset num_redundant_experts.'"}
      - return: {valid: true}
  - component: vllm-config
    name: enable-act-fusion
    kind: function
    summary: "enable_act_fusion (the O1-O3 default of pass_config.fuse_act_quant): on when the silu_and_mul or quant_fp8 custom op is enabled, or the model is NVFP4-quantized."
    sources: ["vllm/config/vllm.py:159-168", "vllm/config/compilation.py:1356-1367"]
    request: {type: object, properties: {custom_ops: {type: array, items: {type: string}}, is_nvfp4_quantized: {type: boolean}}}
    response: {type: object, properties: {fuse_act_quant: {type: boolean}}}
    behavior:
      - title: "is_custom_op_enabled: 'all' enables every op not listed with '-', 'none' only those listed with '+'"
        source: "vllm/config/compilation.py:1356-1367"
        set:
          vars.all: "= 'all' in input.custom_ops"
      - set:
          vars.silu: "= vars.all ? !('-silu_and_mul' in input.custom_ops) : '+silu_and_mul' in input.custom_ops"
          vars.qfp8: "= vars.all ? !('-quant_fp8' in input.custom_ops) : '+quant_fp8' in input.custom_ops"
      - title: "FP4 quant is always a custom op, so Inductor can't fuse it: NVFP4 models enable the pass"
        source: "vllm/config/vllm.py:164-168"
        if: "vars.silu || vars.qfp8 || input.is_nvfp4_quantized"
        then: [{return: {fuse_act_quant: true}}]
      - return: {fuse_act_quant: false}
  - component: model-config
    name: get-and-verify-max-len
    kind: function
    summary: "ModelConfig.get_and_verify_max_len / _get_and_verify_max_len: derive the context length and check a user override."
    sources: ["vllm/config/model.py:2129-2153", "vllm/config/model.py:2527-2666"]
    request:
      type: object
      properties:
        max_model_len: {type: [integer, "null"], default: null}
        max_position_embeddings: {type: [integer, "null"], default: null}
        rope_type: {type: string, default: default}
        rope_factor: {type: number, default: 1.0}
        has_rope_parameters: {type: boolean, default: false, description: "the config has RoPE parameters (iter_rope_parameters is non-empty, not Gemma3): the derived length is then a float"}
        model_max_length: {type: [integer, "null"], default: null}
        spec_target_max_model_len: {type: [integer, "null"], default: null}
    response: {type: object, properties: {max_model_len: {type: integer}, derived_max_model_len: {type: integer}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set:
          vars.key: max_position_embeddings
          vars.rope: "= has(input.has_rope_parameters) && input.has_rope_parameters"
      - title: "No length key in config.json"
        source: "vllm/config/model.py:2561-2578"
        if: "input.max_position_embeddings == null"
        then:
          - if: "input.max_model_len != null"
            then: [{return: {max_model_len: "= input.max_model_len", derived_max_model_len: "= input.max_model_len"}}]
          - if: "input.spec_target_max_model_len != null"
            then: [{return: {max_model_len: "= input.spec_target_max_model_len", derived_max_model_len: "= input.spec_target_max_model_len"}}]
          - title: "Assume 2048 with a warning"
            source: "vllm/config/model.py:2571-2578"
            set: {vars.derived: 2048, vars.key: "None"}
        else:
          - set: {vars.derived: "= input.max_position_embeddings"}
      - title: "RoPE scaling multiplies the derived length by the factor, except su/longrope/llama3/yarn variants (already scaled); `derived *= scaling_factor` makes it a float"
        source: "vllm/config/model.py:2585-2616"
        if: "vars.rope && !(input.rope_type in ['su', 'longrope', 'llama3', 'yarn', 'deepseek_yarn', 'deepseek_llama_scaling'])"
        then:
          - set: {vars.derived: "= int(double(vars.derived) * double(input.rope_factor))"}
      - title: "The derived length prints as a Python float when RoPE parameters exist (131072.0), an int otherwise"
        source: "vllm/config/model.py:2616"
        set:
          vars.derived_str: "= vars.rope ? string(vars.derived) + '.0' : string(vars.derived)"
      - title: "Unset or -1: use the derived length (platform check_max_model_len is identity on CUDA)"
        source: "vllm/config/model.py:2621-2635"
        if: "input.max_model_len == null || input.max_model_len == -1"
        then:
          - return: {max_model_len: "= vars.derived", derived_max_model_len: "= vars.derived"}
      - title: "User value above the derived length (and above model_max_length, if the config has one)"
        source: "vllm/config/model.py:2639-2645"
        if: "input.max_model_len > vars.derived && (input.model_max_length == null || input.max_model_len > input.model_max_length)"
        then:
          - set:
              vars.msg: "= 'User-specified max_model_len (' + string(input.max_model_len) + ') is greater than the derived max_model_len (' + vars.key + '=' + vars.derived_str + ' or model_max_length=' + (input.model_max_length == null ? 'None' : string(input.model_max_length)) + ' in model' + \"'\" + 's config.json).'"
              vars.caution: "VLLM_ALLOW_LONG_MAX_MODEL_LEN must be used with extreme caution. If the model uses relative position encoding (RoPE), positions exceeding derived_max_model_len lead to nan. If the model uses absolute position encoding, positions exceeding derived_max_model_len will cause a CUDA array out-of-bounds error."
          - title: "VLLM_ALLOW_LONG_MAX_MODEL_LEN downgrades the refusal to a warning (the same text, then the caution)"
            source: "vllm/config/model.py:2659-2660"
            if: "config['vllm-allow-long-max-model-len']"
            then:
              - set: {ctx.long_max_model_len_warning: true, ctx.long_max_model_len_warning_text: "= vars.msg + ' ' + vars.caution"}
            else:
              - title: "Refused: user max_model_len exceeds the derived max_model_len"
                source: "vllm/config/model.py:2661-2665"
                fail: {code: value-error, status: 0, message: "= vars.msg + ' To allow overriding this maximum, set the env var VLLM_ALLOW_LONG_MAX_MODEL_LEN=1. ' + vars.caution"}
      - return: {max_model_len: "= input.max_model_len", derived_max_model_len: "= vars.derived"}
  - component: model-config
    name: verify-with-parallel-config
    kind: function
    summary: "ModelConfig.verify_with_parallel_config: attention heads must split evenly over TP; PP needs a SupportsPP model."
    sources: ["vllm/config/model.py:1532-1610"]
    request:
      type: object
      properties:
        total_num_attention_heads: {type: integer}
        tensor_parallel_size: {type: integer}
        pipeline_parallel_size: {type: integer}
        pp_supported: {type: boolean}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: not-implemented-error, status: 0, retryable: false}
    behavior:
      - title: "Total attention heads must be divisible by tensor_parallel_size"
        source: "vllm/config/model.py:1544-1551"
        if: "input.total_num_attention_heads % input.tensor_parallel_size != 0"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Total number of attention heads (' + string(input.total_num_attention_heads) + ') must be divisible by tensor parallel size (' + string(input.tensor_parallel_size) + ').'"}
      - title: "Pipeline parallelism needs a model implementing SupportsPP"
        source: "vllm/config/model.py:1556-1563"
        if: "input.pipeline_parallel_size > 1 && !input.pp_supported"
        then:
          - fail: {code: not-implemented-error, status: 0, message: "Pipeline parallelism is not supported for this model. Supported models implement the `SupportsPP` interface."}
      - return: {verified: true}
  - component: model-config
    name: is-chunked-prefill-supported
    kind: function
    summary: "ModelConfig.is_chunked_prefill_supported by attention type and pooling, with the debug reason it logs."
    sources: ["vllm/config/model.py:2174-2218"]
    request: {type: object, properties: {attn_type: {type: string}, has_pooler: {type: boolean}, seq_pooling_type: {type: [string, "null"], default: null}, tok_pooling_type: {type: [string, "null"], default: null}}}
    response: {type: object, properties: {supported: {type: boolean}, reason: {type: [string, "null"]}}}
    behavior:
      - if: "input.has_pooler"
        then:
          - title: "Pooling, bidirectional attention: no chunked prefill"
            source: "vllm/config/model.py:2180-2185"
            if: "input.attn_type == 'encoder_only'"
            then: [{return: {supported: false, reason: "Pooling models with bidirectional attn do not support chunked prefill."}}]
          - if: "input.attn_type == 'decoder'"
            then:
              - set:
                  vars.seq: "= has(input.seq_pooling_type) && input.seq_pooling_type != null ? input.seq_pooling_type : 'LAST'"
                  vars.tok: "= has(input.tok_pooling_type) && input.tok_pooling_type != null ? input.tok_pooling_type : 'ALL'"
              - title: "Causal attention with MEAN/CLS sequence pooling or STEP token pooling: no"
                source: "vllm/config/model.py:2187-2198"
                if: "vars.seq in ['MEAN', 'CLS'] || vars.tok == 'STEP'"
                then: [{return: {supported: false, reason: "= 'Pooling models with causal attn and ' + vars.seq + '/' + vars.tok + ' pooling do not support chunked prefill.'"}}]
              - title: "Causal attention with LAST/ALL pooling: yes"
                source: "vllm/config/model.py:2199-2206"
                return: {supported: true, reason: "= 'Pooling models with causal attn and ' + vars.seq + '/' + vars.tok + ' pooling support chunked prefill.'"}
          - title: "Other pooling attention types (none exist): everything but encoder-decoder"
            source: "vllm/config/model.py:2208-2210"
            return: {supported: "= input.attn_type != 'encoder_decoder'", reason: null}
      - title: "Generative models: encoder-decoder can't chunk prefill"
        source: "vllm/config/model.py:2211-2215"
        if: "input.attn_type == 'encoder_decoder'"
        then: [{return: {supported: false, reason: "Encoder decoder models do not support chunked prefill."}}]
      - title: "Generative models chunk prefill"
        source: "vllm/config/model.py:2217-2218"
        return: {supported: true, reason: "Generative models support chunked prefill."}
  - component: model-config
    name: is-prefix-caching-supported
    kind: function
    summary: "ModelConfig.is_prefix_caching_supported by attention type and pooling."
    sources: ["vllm/config/model.py:2220-2273"]
    request: {type: object, properties: {attn_type: {type: string}, has_pooler: {type: boolean}}}
    response: {type: object, properties: {supported: {type: boolean}}}
    behavior:
      - title: "Pooling models: only causal-attention decoders"
        source: "vllm/config/model.py:2224-2256"
        if: "input.has_pooler"
        then:
          - return: {supported: "= input.attn_type == 'decoder'"}
      - title: "Generative: attention-free and encoder-decoder models don't prefix-cache"
        source: "vllm/config/model.py:2258-2273"
        if: "input.attn_type in ['attention_free', 'encoder_decoder']"
        then: [{return: {supported: false}}]
      - return: {supported: true}

  # ======================= CacheConfig / ParallelConfig / SchedulerConfig =======================
  - component: cache-config
    name: apply-block-size-default
    kind: function
    summary: "CacheConfig construction: pydantic bounds on gpu_memory_utilization, the cache_dtype Literal and its validator's log, then _apply_block_size_default."
    sources: ["vllm/config/cache.py:336-347", "vllm/config/cache.py:102", "vllm/config/cache.py:122", "vllm/config/cache.py:350-367"]
    request: {type: object, properties: {block_size: {type: [integer, "null"], default: null}, gpu_memory_utilization: {type: number}, enable_prefix_caching: {type: boolean}, cache_dtype: {type: string, default: auto}}}
    response: {type: object, properties: {block_size: {type: integer}, gpu_memory_utilization: {type: number}, enable_prefix_caching: {type: boolean}, user_specified_block_size: {type: boolean}, cache_dtype: {type: string}}}
    errors: [{code: validation-error, status: 0, retryable: false}]
    behavior:
      - title: "gpu_memory_utilization: Field(gt=0, le=1)"
        source: "vllm/config/cache.py:102"
        if: "input.gpu_memory_utilization <= 0 || input.gpu_memory_utilization > 1"
        then:
          - fail: {code: validation-error, status: 0, message: "= input.gpu_memory_utilization <= 0 ? '1 validation error for CacheConfig\\ngpu_memory_utilization\\n  Input should be greater than 0 [type=greater_than, input_value=' + string(input.gpu_memory_utilization) + ', input_type=' + (type(input.gpu_memory_utilization) == double ? 'float' : 'int') + ']' : '1 validation error for CacheConfig\\ngpu_memory_utilization\\n  Input should be less than or equal to 1 [type=less_than_equal, input_value=' + string(input.gpu_memory_utilization) + ', input_type=' + (type(input.gpu_memory_utilization) == double ? 'float' : 'int') + ']'"}
      - set: {vars.dt: "= has(input.cache_dtype) ? input.cache_dtype : 'auto'"}
      - title: "cache_dtype is a CacheDType Literal"
        source: "vllm/config/cache.py:39-59"
        if: "!(vars.dt in ['auto', 'float16', 'bfloat16', 'fp8', 'fp8_e4m3', 'fp8_e5m2', 'fp8_inc', 'fp8_ds_mla', 'nvfp4_ds_mla', 'turboquant_k8v4', 'turboquant_4bit_nc', 'turboquant_k3v4_nc', 'turboquant_3bit_nc', 'ultraquant_4bit', 'int4_per_token_head', 'int8_per_token_head', 'fp8_per_token_head', 'nvfp4', 'nvfp4_4over6'])"
        then:
          - fail: {code: validation-error, status: 0, message: "= '1 validation error for CacheConfig\\ncache_dtype\\n  Input should be \\'auto\\', \\'float16\\', \\'bfloat16\\', \\'fp8\\', \\'fp8_e4m3\\', \\'fp8_e5m2\\', \\'fp8_inc\\', \\'fp8_ds_mla\\', \\'nvfp4_ds_mla\\', \\'turboquant_k8v4\\', \\'turboquant_4bit_nc\\', \\'turboquant_k3v4_nc\\', \\'turboquant_3bit_nc\\', \\'ultraquant_4bit\\', \\'int4_per_token_head\\', \\'int8_per_token_head\\', \\'fp8_per_token_head\\', \\'nvfp4\\' or \\'nvfp4_4over6\\' [type=literal_error, input_value=\\'' + vars.dt + '\\', input_type=str]'"}
      - title: "_validate_cache_dtype: per-token-head dtypes log that scales are computed at runtime"
        source: "vllm/config/cache.py:353-359"
        if: "vars.dt.endsWith('per_token_head')"
        then:
          - set: {ctx.cache_dtype_info: "= 'Using ' + vars.dt + ' data type to store kv cache. It reduces the GPU memory footprint and boosts the performance. Dynamic per-token-head scales will be computed at runtime.'"}
        else:
          - title: "_validate_cache_dtype: any other quantized dtype (fp8*, nvfp4*) logs the accuracy note, whether or not the checkpoint has scales"
            source: "vllm/config/cache.py:360-367"
            if: "vars.dt.startsWith('fp8') || vars.dt.startsWith('nvfp4')"
            then:
              - set: {ctx.cache_dtype_info: "= 'Using ' + vars.dt + ' data type to store kv cache. It reduces the GPU memory footprint and boosts the performance. Meanwhile, it may cause accuracy drop without a proper scaling factor'"}
      - title: "block_size unset -> DEFAULT_BLOCK_SIZE 16; set -> user_specified_block_size"
        source: "vllm/config/cache.py:343-346"
        set:
          vars.block: "= input.block_size == null ? 16 : input.block_size"
          vars.user: "= input.block_size != null"
      - return: {block_size: "= vars.block", gpu_memory_utilization: "= input.gpu_memory_utilization", enable_prefix_caching: "= input.enable_prefix_caching", user_specified_block_size: "= vars.user", cache_dtype: "= vars.dt"}
  - component: parallel-config
    name: post-init
    kind: function
    summary: "ParallelConfig.__post_init__: world size and the default distributed executor backend."
    sources: ["vllm/config/parallel.py:943-1116"]
    request:
      type: object
      properties:
        tensor_parallel_size: {type: integer}
        pipeline_parallel_size: {type: integer}
        data_parallel_size: {type: integer}
        data_parallel_backend: {type: string}
        nnodes: {type: integer}
        distributed_executor_backend: {type: [string, "null"], default: null}
        device_type: {type: string}
        device_count: {type: integer}
        enable_expert_parallel: {type: boolean, default: false}
        enable_eplb: {type: boolean, default: false}
        eplb_num_redundant_experts: {type: integer, default: 0}
        data_parallel_external_lb: {type: boolean, default: false}
        is_moe_model: {type: [boolean, "null"], default: null}
        all2all_backend: {type: string, default: allgather_reducescatter}
    response: {type: object, properties: {tensor_parallel_size: {type: integer}, pipeline_parallel_size: {type: integer}, data_parallel_size: {type: integer}, world_size: {type: integer}, distributed_executor_backend: {type: string}, enable_expert_parallel: {type: boolean}, enable_eplb: {type: boolean}, data_parallel_external_lb: {type: boolean}, nnodes: {type: integer}, is_moe_model: {type: [boolean, "null"]}, all2all_backend: {type: string}, use_sequence_parallel_moe: {type: boolean}, use_all2all: {type: boolean}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "world_size = pp * tp (* pcp); across DP it is world_size * dp"
        source: "vllm/config/parallel.py:945-949"
        set:
          vars.world: "= input.pipeline_parallel_size * input.tensor_parallel_size"
          vars.backend: "= input.distributed_executor_backend"
      - title: "Default backend for more than one rank: mp, unless the GPUs don't fit on this node"
        source: "vllm/config/parallel.py:1035-1077"
        if: "vars.backend == null && vars.world * input.data_parallel_size > 1"
        then:
          - if: "input.device_type == 'cuda' && input.nnodes > 1"
            then:
              - set: {vars.backend: mp}
            else:
              - title: "World size larger than the GPUs on this node"
                source: "vllm/config/parallel.py:1047-1058"
                if: "input.device_type == 'cuda' && input.device_count < vars.world"
                then:
                  - fail: {code: value-error, status: 0, message: "= 'World size (' + string(vars.world) + ') is larger than the number of available GPUs (' + string(input.device_count) + ') in this node. If this is intentional and you are using:\\n- ray, set \\'--distributed-executor-backend ray\\'.\\n- multiprocessing, set \\'--nnodes\\' appropriately.'"}
              - set: {vars.backend: "= input.data_parallel_backend == 'ray' ? 'ray' : 'mp'"}
      - title: "A single rank runs in-process: uni"
        source: "vllm/config/parallel.py:1079-1080"
        if: "vars.backend == null && vars.world == 1"
        then:
          - set: {vars.backend: uni}
      - title: "nnodes > 1 needs mp, uni or external_launcher"
        source: "vllm/config/parallel.py:1087-1095"
        if: "input.nnodes > 1 && !(vars.backend in ['mp', 'uni', 'external_launcher'])"
        then:
          - fail: {code: value-error, status: 0, message: "nnodes > 1 can only be set when distributed executor backend is mp, uni or external_launcher."}
      - title: "model_validator(mode='after'): _validate_parallel_config"
        source: "vllm/config/parallel.py:517-518"
        call: parallel-config.validate-parallel-config
        input: {enable_eplb: "= input.enable_eplb", enable_expert_parallel: "= input.enable_expert_parallel", tensor_parallel_size: "= input.tensor_parallel_size", data_parallel_size: "= input.data_parallel_size", eplb_num_redundant_experts: "= input.eplb_num_redundant_experts", device_type: "= input.device_type"}
      - title: "The removed pplx and naive all2all backends fall back to allgather_reducescatter (warned)"
        source: "vllm/config/parallel.py:533-539"
        set:
          vars.a2a: "= has(input.all2all_backend) ? (input.all2all_backend in ['pplx', 'naive'] ? 'allgather_reducescatter' : input.all2all_backend) : 'allgather_reducescatter'"
      - title: "use_sequence_parallel_moe: EP with TP > 1 and DP > 1 on a sequence-parallel all2all backend; use_all2all: DP > 1 or sequence-parallel MoE (no PCP here)"
        source: "vllm/config/parallel.py:763-788"
        set:
          vars.sp_moe: "= vars.a2a in ['allgather_reducescatter', 'deepep_high_throughput', 'deepep_low_latency', 'deepep_v2', 'flashinfer_nvlink_one_sided', 'passthrough', 'mori_high_throughput', 'mori_low_latency', 'nixl_ep'] && input.enable_expert_parallel && input.tensor_parallel_size > 1 && input.data_parallel_size > 1"
      - return: {tensor_parallel_size: "= input.tensor_parallel_size", pipeline_parallel_size: "= input.pipeline_parallel_size", data_parallel_size: "= input.data_parallel_size", world_size: "= vars.world", distributed_executor_backend: "= vars.backend", enable_expert_parallel: "= input.enable_expert_parallel", enable_eplb: "= input.enable_eplb", data_parallel_external_lb: "= has(input.data_parallel_external_lb) ? input.data_parallel_external_lb : false", nnodes: "= input.nnodes", is_moe_model: "= has(input.is_moe_model) ? input.is_moe_model : null", all2all_backend: "= vars.a2a", use_sequence_parallel_moe: "= vars.sp_moe", use_all2all: "= input.data_parallel_size > 1 || vars.sp_moe"}
  - component: scheduler-config
    name: post-init
    kind: function
    summary: "SchedulerConfig.__post_init__: encoder-decoder models lose chunked prefill; then verify_max_model_len."
    sources: ["vllm/config/scheduler.py:292-312"]
    request:
      type: object
      properties:
        max_num_seqs: {type: integer}
        max_num_batched_tokens: {type: integer}
        max_model_len: {type: integer}
        enable_chunked_prefill: {type: boolean}
        is_encoder_decoder: {type: boolean}
        policy: {type: string, enum: [fcfs, priority]}
        async_scheduling: {type: [boolean, "null"], default: null}
        scheduler_reserve_full_isl: {type: boolean, default: true}
    response: {type: object, properties: {max_num_seqs: {type: integer}, max_num_batched_tokens: {type: integer}, max_model_len: {type: integer}, enable_chunked_prefill: {type: boolean}, policy: {type: string}, async_scheduling: {type: [boolean, "null"], default: null}, scheduler_reserve_full_isl: {type: boolean}}}
    behavior:
      - title: "Encoder-decoder models: chunked prefill disabled"
        source: "vllm/config/scheduler.py:293-301"
        set: {vars.chunked: "= input.is_encoder_decoder ? false : input.enable_chunked_prefill"}
      - call: scheduler-config.verify-max-model-len
        input: {max_num_seqs: "= input.max_num_seqs", max_num_batched_tokens: "= input.max_num_batched_tokens", max_model_len: "= input.max_model_len", enable_chunked_prefill: "= vars.chunked"}
      - return: {max_num_seqs: "= input.max_num_seqs", max_num_batched_tokens: "= input.max_num_batched_tokens", max_model_len: "= input.max_model_len", enable_chunked_prefill: "= vars.chunked", policy: "= input.policy", async_scheduling: "= has(input.async_scheduling) ? input.async_scheduling : null", scheduler_reserve_full_isl: "= has(input.scheduler_reserve_full_isl) ? input.scheduler_reserve_full_isl : true"}
  - component: scheduler-config
    name: verify-max-model-len
    kind: function
    summary: "SchedulerConfig.verify_max_model_len: the token budget must fit a whole sequence (without chunked prefill) and at least max_num_seqs tokens."
    sources: ["vllm/config/scheduler.py:314-358"]
    request: {type: object, properties: {max_num_seqs: {type: integer}, max_num_batched_tokens: {type: integer}, max_model_len: {type: integer}, enable_chunked_prefill: {type: boolean}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "Without chunked prefill the budget must hold a whole max_model_len sequence"
        source: "vllm/config/scheduler.py:315-326"
        if: "input.max_num_batched_tokens < input.max_model_len && !input.enable_chunked_prefill"
        then:
          - fail: {code: value-error, status: 0, message: "= 'max_num_batched_tokens (' + string(input.max_num_batched_tokens) + ') is smaller than max_model_len (' + string(input.max_model_len) + '). This effectively limits the maximum sequence length to max_num_batched_tokens and makes vLLM reject longer sequences. Please increase max_num_batched_tokens or decrease max_model_len.'"}
      - title: "The budget must be at least max_num_seqs"
        source: "vllm/config/scheduler.py:328-333"
        if: "input.max_num_batched_tokens < input.max_num_seqs"
        then:
          - fail: {code: value-error, status: 0, message: "= 'max_num_batched_tokens (' + string(input.max_num_batched_tokens) + ') must be greater than or equal to max_num_seqs (' + string(input.max_num_seqs) + ').'"}
      - title: "Warning only: budget above max_num_seqs * max_model_len"
        source: "vllm/config/scheduler.py:344-350"
        if: "input.max_num_batched_tokens > input.max_num_seqs * input.max_model_len"
        then:
          - set: {ctx.budget_exceeds_model_warning: true}
      - return: {verified: true}

  # ======================= VllmConfig (the shared datum) =======================
  - component: vllm-config
    name: post-init
    kind: function
    summary: "VllmConfig.__post_init__: cross-config checks, the platform's check_and_update_config, then the resolved config is kept."
    sources: ["vllm/config/vllm.py:1414-1452", "vllm/config/vllm.py:1991"]
    request: {$ref: ConfigVllmConfig}
    response: {$ref: ConfigVllmConfig}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "_check_supports_watermarking(): a watermark config must be compatible with the speculative config"
        source: "vllm/config/vllm.py:1446"
        call: vllm-config.check-supports-watermarking
        input:
          watermark_config: "= has(input.watermark_config) ? input.watermark_config : null"
          speculative_config: "= has(input.speculative_config) ? input.speculative_config : null"
      - title: "ModelConfig.verify_with_parallel_config"
        source: "vllm/config/vllm.py:1451-1452"
        call: model-config.verify-with-parallel-config
        input:
          total_num_attention_heads: "= input.model_config.total_num_attention_heads"
          tensor_parallel_size: "= input.parallel_config.tensor_parallel_size"
          pipeline_parallel_size: "= input.parallel_config.pipeline_parallel_size"
          pp_supported: true
      - title: "current_platform.check_and_update_config(self): the platform has the last word"
        source: "vllm/config/vllm.py:1991"
        call: "= input.device_config.device == 'cpu' ? 'cpu-platform.check-and-update-config' : 'cuda-platform.check-and-update-config'"
        targets: [cpu-platform.check-and-update-config, cuda-platform.check-and-update-config]
        input:
          cache_config: "= merge({'mamba_ssm_cache_dtype': 'auto'}, input.cache_config)"
          model_config: {model_type: llama, architecture: "= input.model_config.architectures[0]", has_inner_state: false, use_mla: false, layer_types: [], state_dtype: auto, is_mm_prefix_lm: false}
        as: hook
      - set:
          vars.cc: "= has(input.compilation_config) ? input.compilation_config : {'optimization_level': 2, 'custom_ops': ['none']}"
          vars.mc: "= input.model_config"
      - title: "Async scheduling: explicit True is checked, None resolves to True unless something is incompatible"
        source: "vllm/config/vllm.py:1545-1644"
        call: vllm-config.resolve-async-scheduling
        input:
          async_scheduling: "= has(input.scheduler_config.async_scheduling) ? input.scheduler_config.async_scheduling : null"
          runner_type: "= has(vars.mc.runner_type) ? vars.mc.runner_type : 'generate'"
          speculative_method: "= has(input.speculative_config) && input.speculative_config != null ? input.speculative_config.method : null"
          disable_padded_drafter_batch: "= has(input.speculative_config) && input.speculative_config != null && has(input.speculative_config.disable_padded_drafter_batch) ? input.speculative_config.disable_padded_drafter_batch : false"
          distributed_executor_backend: "= input.parallel_config.distributed_executor_backend"
          pipeline_parallel_size: "= input.parallel_config.pipeline_parallel_size"
          use_v2_model_runner: "= config['use-v2-model-runner']"
        as: asy
      - title: "The engine core and scheduler read async scheduling as the static world config async-scheduling: a world whose deployment resolves differently is flagged"
        detail: "Config is fixed per world. A world serving ngram speculative decoding sets async-scheduling: false."
        source: "vllm/config/vllm.py:1595-1608"
        if: "'async-scheduling' in config && config['async-scheduling'] != vars.asy.value.async_scheduling"
        then:
          - set: {ctx.async_scheduling_config_mismatch: "= {'derived': vars.asy.value.async_scheduling, 'config': config['async-scheduling']}"}
      - title: "compilation_config.mode is a CompilationMode (NONE=0, STOCK_TORCH_COMPILE=1, DYNAMO_TRACE_ONCE=2, VLLM_COMPILE=3), None until resolved"
        source: "vllm/config/compilation.py:37-50"
        set: {vars.mode: "= has(vars.cc.mode) ? vars.cc.mode : null"}
      - title: "enforce_eager: mode NONE (and cudagraph_mode NONE)"
        source: "vllm/config/vllm.py:1691-1693"
        if: "has(vars.mc.enforce_eager) && vars.mc.enforce_eager"
        then:
          - set: {vars.mode: 0}
      - title: "An unset mode: VLLM_COMPILE above -O0, NONE at -O0"
        source: "vllm/config/vllm.py:1752-1756"
        if: "vars.mode == null"
        then:
          - set: {vars.mode: "= vars.cc.optimization_level > 0 ? 3 : 0"}
      - title: "HiSparse (explicit, or implied by a HiSparseConnector) has platform, parallelism, cudagraph and scheduler requirements"
        source: "vllm/config/vllm.py:1800-1835"
        if: "(has(input.attention_config) && has(input.attention_config.hisparse_config) && input.attention_config.hisparse_config != null) || (has(input.kv_transfer_config) && input.kv_transfer_config != null && has(input.kv_transfer_config.kv_connector) && input.kv_transfer_config.kv_connector == 'HiSparseConnector')"
        then:
          - call: vllm-config.check-hisparse
            input:
              device_type: "= input.device_config.device"
              pipeline_parallel_size: "= input.parallel_config.pipeline_parallel_size"
              decode_context_parallel_size: 1
              cudagraph_mode: "= vars.mode == 0 ? 'NONE' : 'FULL_AND_PIECEWISE'"
              scheduler_reserve_full_isl: "= has(input.scheduler_config.scheduler_reserve_full_isl) ? input.scheduler_config.scheduler_reserve_full_isl : true"
              has_model_config: true
              has_index_topk: "= has(vars.mc.has_index_topk) && vars.mc.has_index_topk"
      - title: "_resolve_mm_processor_device(): settle --mm-processor-device=auto once the EC role is known"
        source: "vllm/config/vllm.py:2012"
        if: "has(vars.mc.multimodal_config) && vars.mc.multimodal_config != null"
        then:
          - call: vllm-config.resolve-mm-processor-device
            input:
              multimodal_config: "= vars.mc.multimodal_config"
              ec_transfer_config: "= has(input.ec_transfer_config) ? input.ec_transfer_config : null"
              device_type: "= input.device_config.device"
            as: mmdev
          - set: {vars.mc: "= merge(vars.mc, {'multimodal_config': vars.mmdev.value})"}
      - title: "needs_dp_coordinator (property)"
        source: "vllm/config/vllm.py:843-862"
        call: vllm-config.needs-dp-coordinator
        input:
          data_parallel_size: "= input.parallel_config.data_parallel_size"
          has_model_config: true
          is_moe: "= has(vars.mc.is_moe) && vars.mc.is_moe"
          data_parallel_external_lb: "= has(input.parallel_config.data_parallel_external_lb) && input.parallel_config.data_parallel_external_lb"
        as: dpc
      - title: "Optimization-level defaults: -O0 turns fuse_act_quant off, -O1..-O3 take enable_act_fusion"
        source: "vllm/config/vllm.py:1779-1780"
        if: "vars.cc.optimization_level == 0"
        then:
          - set: {vars.fuse_act_quant: false}
        else:
          - source: "vllm/config/vllm.py:289-293"
            call: vllm-config.enable-act-fusion
            input: {custom_ops: "= vars.cc.custom_ops", is_nvfp4_quantized: "= has(input.model_config.is_nvfp4_quantized) && input.model_config.is_nvfp4_quantized"}
            as: af
          - set: {vars.fuse_act_quant: "= vars.af.value.fuse_act_quant"}
      - title: "-O2/-O3 fuse_allreduce_rms = enable_allreduce_rms_fusion: TP > 1 on CUDA SM 9.0 or the SM 10.x family with FlashInfer (assumed installed), never under VLLM_BATCH_INVARIANT; -O0/-O1 False"
        source: "vllm/config/vllm.py:171-195"
        if: "vars.cc.optimization_level >= 2 && input.parallel_config.tensor_parallel_size > 1 && input.device_config.device == 'cuda' && !config['vllm-batch-invariant']"
        then:
          - call: cuda-platform.get-device-capability
            as: arcap
          - set: {vars.fuse_allreduce_rms: "= vars.arcap.value != null && (vars.arcap.value.as_int == 90 || vars.arcap.value.major == 10)"}
        else:
          - set: {vars.fuse_allreduce_rms: false}
      - title: "cudagraph_mode per level: NONE at -O0, PIECEWISE at -O1, FULL_AND_PIECEWISE at -O2/-O3; enforce_eager forces NONE. The AITER-only passes (norm padding, MLA dual norm, RoPE+KV cache, QK-norm RoPE) are off on CUDA, and fuse_attn_quant/enable_qk_norm_rope_fusion are False at every level"
        source: "vllm/config/vllm.py:247-330"
        set:
          vars.cg: "= vars.mode == 0 && has(vars.mc.enforce_eager) && vars.mc.enforce_eager ? 'NONE' : (vars.cc.optimization_level == 0 ? 'NONE' : (vars.cc.optimization_level == 1 ? 'PIECEWISE' : 'FULL_AND_PIECEWISE'))"
      - title: "kernels-ops reads the pass flag as config fuse-act-quant (a static world value): a world whose deployment derives a different value is flagged"
        detail: "Config is fixed per world, so the derived value can't be written back to config. Worlds serving an NVFP4 checkpoint set fuse-act-quant: true."
        source: "vllm/config/vllm.py:289-293"
        if: "'fuse-act-quant' in config && config['fuse-act-quant'] != vars.fuse_act_quant"
        then:
          - set: {ctx.fuse_act_quant_config_mismatch: "= {'derived': vars.fuse_act_quant, 'config': config['fuse-act-quant']}"}
      - title: "quant_config = _get_quantization_config(model_config, load_config): a quantized checkpoint is checked against the GPU's capability and the model dtype"
        source: "vllm/config/vllm.py:1507-1510"
        call: vllm-config.get-quantization-config
        input:
          quantization: "= has(vars.mc.quantization) ? vars.mc.quantization : null"
          quantization_config: "= has(vars.mc.quantization_config) ? vars.mc.quantization_config : null"
          dtype: "= has(vars.mc.dtype) ? vars.mc.dtype : 'bfloat16'"
          device_type: "= input.device_config.device"
        as: qc
      - title: "max_concurrent_batches: PP + 1 under async scheduling on the V2 runner (2 on V1 without PP), else PP"
        source: "vllm/config/vllm.py:576-587"
        call: vllm-config.max-concurrent-batches
        input:
          pipeline_parallel_size: "= input.parallel_config.pipeline_parallel_size"
          async_scheduling: "= vars.asy.value.async_scheduling"
          use_v2_model_runner: "= config['use-v2-model-runner']"
        as: mcb
      - set:
          state.resolved: "= merge(input, {'model_config': vars.mc, 'cache_config': merge(input.cache_config, {'block_size': vars.hook.value.block_size}), 'parallel_config': merge(input.parallel_config, {'worker_cls': vars.hook.value.worker_cls}), 'scheduler_config': merge(input.scheduler_config, {'async_scheduling': vars.asy.value.async_scheduling}), 'compilation_config': merge(vars.cc, {'pass_config': {'fuse_act_quant': vars.fuse_act_quant, 'fuse_allreduce_rms': vars.fuse_allreduce_rms, 'fuse_attn_quant': false, 'fuse_act_padding': false, 'fuse_mla_dual_rms_norm': false, 'fuse_rope_kvcache': false, 'fuse_qk_norm_rope_kvcache': false, 'enable_qk_norm_rope_fusion': false}, 'mode': vars.mode, 'cudagraph_mode': vars.cg, 'use_inductor_graph_partition': false}), 'needs_dp_coordinator': vars.dpc.value.needs_dp_coordinator, 'quant_config': vars.qc.value, 'max_concurrent_batches': vars.mcb.value.max_concurrent_batches})"
      - return: "= state.resolved"
  - component: vllm-config
    name: set-current-vllm-config
    kind: function
    summary: "set_current_vllm_config(): a context in which get_current_vllm_config() answers; the previous config is restored on exit."
    sources: ["vllm/config/vllm.py:3421-3471"]
    attributes: {racy_in_code: "vllm/config/vllm.py:3431 reads the module global _current_vllm_config, vllm/config/vllm.py:3442 and vllm/config/vllm.py:3469 write it unconditionally, with no lock"}
    request: {type: object, properties: {prefix: {type: [string, "null"], default: null}}}
    behavior:
      - set:
          vars.old: "= state.current"
          state.current: "= state.resolved"
      - title: "Code inside the context (model init, CustomOp construction) reads the current config"
        source: "vllm/config/vllm.py:3442-3444"
        call: vllm-config.get-current-vllm-config
        as: inner
        on_error:
          - title: "finally: the previous config is restored, then the error propagates"
            source: "vllm/config/vllm.py:3468-3471"
            set: {state.current: "= vars.old"}
          - fail: "= error"
      - title: "finally: the previous config is restored"
        source: "vllm/config/vllm.py:3468-3471"
        set: {state.current: "= vars.old"}
      - return: "= vars.inner.value"
  - component: vllm-config
    name: get-current-vllm-config
    kind: function
    summary: "get_current_vllm_config(): the config set by the enclosing set_current_vllm_config context; the read path other areas use."
    sources: ["vllm/config/vllm.py:3480-3490"]
    response: {$ref: ConfigVllmConfig}
    errors: [{code: assertion-error, status: 0, retryable: false}]
    behavior:
      - title: "Outside a set_current_vllm_config() context"
        source: "vllm/config/vllm.py:3481-3489"
        if: "state.current == null"
        then:
          - fail: {code: assertion-error, status: 0, message: "Current vLLM config is not set. This typically means get_current_vllm_config() was called outside of a set_current_vllm_config() context, or a CustomOp was instantiated at module import time or model forward time when config is not set. For tests that directly test custom ops/modules, use the 'default_vllm_config' pytest fixture from tests/conftest.py."}
      - return: "= state.current"

  - component: vllm-config
    name: check-supports-watermarking
    kind: function
    summary: "VllmConfig._check_supports_watermarking: without a watermark config nothing is watermarked; with one, speculative decoding must be probabilistic, standard-rejection, autoregressive model-based (dspark, eagle, eagle3, mtp), and target-only unless the algorithm watermarks drafts (dual_key_gumbel)."
    sources: ["vllm/config/vllm.py:1275-1371", "vllm/config/watermarking.py:27-56"]
    request:
      type: object
      properties:
        watermark_config:
          type: [object, "null"]
          default: null
          properties:
            key: {type: integer}
            algorithm: {type: string, enum: [gumbel, dual_key_gumbel], default: gumbel}
            alpha: {type: number, default: 0.1}
            allow_target_only_watermarking: {type: boolean, default: false}
        speculative_config:
          type: [object, "null"]
          default: null
        request:
          type: [object, "null"]
          default: null
          properties:
            watermarking: {type: [boolean, "null"], default: null}
            beam_search: {type: boolean, default: false}
        custom_sampler: {type: boolean, default: false}
    response: {type: object, properties: {enabled: {type: boolean}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set:
          vars.wm: "= has(input.watermark_config) ? input.watermark_config : null"
          vars.req: "= has(input.request) ? input.request : null"
      - title: "No watermark config: a request asking for watermarking is warned once and runs unwatermarked"
        source: "vllm/config/vllm.py:1281-1290"
        if: "vars.wm == null"
        then:
          - if: "vars.req != null && has(vars.req.watermarking) && vars.req.watermarking == true"
            then:
              - set: {ctx.watermark_warning: "Watermarking is enabled for this request, but the engine has no watermark configuration. This and subsequent requests will run without watermarking."}
          - return: {enabled: false}
      - set:
          vars.algorithm: "= has(vars.wm.algorithm) ? vars.wm.algorithm : 'gumbel'"
          vars.alpha: "= has(vars.wm.alpha) ? double(vars.wm.alpha) : 0.1"
          vars.target_only: "= has(vars.wm.allow_target_only_watermarking) && vars.wm.allow_target_only_watermarking"
          vars.spec: "= has(input.speculative_config) ? input.speculative_config : null"
      - title: "Speculative decoding with watermarking"
        source: "vllm/config/vllm.py:1291-1292"
        if: "vars.spec != null"
        then:
          - set:
              vars.draft_sample: "= has(vars.spec.draft_sample_method) ? vars.spec.draft_sample_method : 'greedy'"
              vars.rejection: "= has(vars.spec.rejection_sample_method) ? vars.spec.rejection_sample_method : 'standard'"
              vars.parallel: "= has(vars.spec.parallel_drafting) && vars.spec.parallel_drafting"
          - title: "draft_sample_method must be probabilistic (the SpeculativeConfig default is greedy)"
            source: "vllm/config/vllm.py:1293-1297"
            if: "vars.draft_sample != 'probabilistic'"
            then:
              - fail: {code: value-error, status: 0, message: "Speculative decoding with watermarking requires draft_sample_method='probabilistic'."}
          - title: "rejection_sample_method must be standard"
            source: "vllm/config/vllm.py:1298-1302"
            if: "vars.rejection != 'standard'"
            then:
              - fail: {code: value-error, status: 0, message: "Speculative decoding with watermarking requires rejection_sample_method='standard'."}
          - title: "Parallel drafting only with dspark"
            source: "vllm/config/vllm.py:1303-1309"
            if: "vars.parallel && vars.spec.method != 'dspark'"
            then:
              - fail: {code: value-error, status: 0, message: "Parallel speculative drafting is not supported with watermarking."}
          - title: "Only autoregressive model-based methods: dspark, eagle, eagle3, mtp (not ngram, suffix, draft_model, ...)"
            source: "vllm/config/vllm.py:1310-1314"
            if: "!(vars.spec.method in ['dspark', 'eagle', 'eagle3', 'mtp'])"
            then:
              - fail: {code: value-error, status: 0, message: "Watermarking supports only autoregressive model-based speculative decoding."}
          - title: "supports_speculative_decoding is algorithm == dual_key_gumbel; other algorithms need allow_target_only_watermarking"
            source: "vllm/config/vllm.py:1315-1324"
            if: "!vars.target_only && vars.algorithm != 'dual_key_gumbel'"
            then:
              - fail: {code: value-error, status: 0, message: "= 'The \\'' + vars.algorithm + '\\' watermarking algorithm does not support speculative decoding. Set allow_target_only_watermarking=true to leave draft tokens unwatermarked.'"}
          - title: "Target-only watermarking: warned"
            source: "vllm/config/vllm.py:1325-1334"
            if: "vars.target_only && vars.algorithm != 'dual_key_gumbel'"
            then:
              - set: {ctx.watermark_warning: "Target-only watermarking leaves accepted draft tokens unwatermarked, weakening detectability in proportion to the share of output tokens supplied by accepted drafts."}
          - title: "dual_key_gumbel picks the key by token role, so a non-default alpha is unused"
            source: "vllm/config/vllm.py:1335-1344"
            if: "vars.algorithm == 'dual_key_gumbel' && vars.alpha != 0.1"
            then:
              - set: {ctx.watermark_warning: "= 'Speculative decoding selects the watermark key by token role: draft tokens use key A, recovery and bonus tokens use key B. The configured alpha=' + string(vars.alpha) + ' is not used.'"}
      - title: "Model-specific custom samplers can't be watermarked"
        source: "vllm/config/vllm.py:1345-1348"
        if: "has(input.custom_sampler) && input.custom_sampler"
        then:
          - fail: {code: value-error, status: 0, message: "Model-specific custom samplers are not supported with watermarking."}
      - title: "Engine-level check (no request): watermarking is on"
        source: "vllm/config/vllm.py:1349-1350"
        if: "vars.req == null"
        then: [{return: {enabled: true}}]
      - title: "A request that opts out"
        source: "vllm/config/vllm.py:1351-1352"
        if: "has(vars.req.watermarking) && vars.req.watermarking == false"
        then: [{return: {enabled: false}}]
      - title: "Beam search can't be watermarked: warned, runs unwatermarked"
        source: "vllm/config/vllm.py:1356-1363"
        if: "has(vars.req.beam_search) && vars.req.beam_search"
        then:
          - set: {ctx.watermark_warning: "Watermarking is enabled, but beam search cannot be watermarked. This and subsequent beam search requests will run without watermarking."}
          - return: {enabled: false}
      - return: {enabled: true}
  - component: vllm-config
    name: resolve-async-scheduling
    kind: function
    summary: "VllmConfig.__post_init__ async-scheduling block: an explicit True is checked (EAGLE/MTP/draft-model/ngram-GPU/DSpark/DFlash only, padded drafter batches, an executor that supports it); None resolves to True unless pooling, another speculative method, unpadded drafter batches, a Ray executor, or PP on the V1 runner turns it off."
    sources: ["vllm/config/vllm.py:1545-1644", "vllm/config/speculative.py:38-72"]
    request:
      type: object
      properties:
        async_scheduling: {type: [boolean, "null"], default: null}
        runner_type: {type: string, default: generate}
        speculative_method: {type: [string, "null"], default: null}
        disable_padded_drafter_batch: {type: boolean, default: false}
        distributed_executor_backend: {type: string, default: uni}
        pipeline_parallel_size: {type: integer, default: 1}
        use_v2_model_runner: {type: boolean, default: true}
    response: {type: object, properties: {async_scheduling: {type: boolean}, reason: {type: string}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "Executor.get_class(self).supports_async_scheduling(): UniProcExecutor (uni, external_launcher) and MultiprocExecutor (mp) do; the Ray executor inherits False"
        source: "vllm/config/vllm.py:1545-1546"
        set:
          vars.executor_ok: "= input.distributed_executor_backend in ['uni', 'mp', 'external_launcher']"
          vars.method: "= has(input.speculative_method) ? input.speculative_method : null"
      - title: "EagleModelTypes (eagle, eagle3, extract_hidden_states, every MTP type, dflash), NgramGPUTypes (ngram_gpu), draft_model, dspark and dflash keep async scheduling"
        source: "vllm/config/speculative.py:38-72"
        set:
          vars.spec_ok: "= vars.method == null || vars.method in ['eagle', 'eagle3', 'extract_hidden_states', 'deepseek_mtp', 'dots3_note_mtp', 'mimo_mtp', 'mimo_v2_mtp', 'glm4_moe_mtp', 'glm4_moe_lite_mtp', 'glm_ocr_mtp', 'ernie_mtp', 'nemotron_h_mtp', 'exaone_moe_mtp', 'exaone4_5_mtp', 'qwen3_next_mtp', 'qwen4_exp_mtp', 'qwen3_5_mtp', 'longcat_flash_mtp', 'bailing_hybrid_v3_mtp', 'minimax_m3_mtp', 'bailing_hybrid_mtp', 'mtp', 'kimi_k3_mtp', 'pangu_ultra_moe_mtp', 'step3p5_mtp', 'hy_v3_mtp', 'hy_v4_mtp', 'gemma4_mtp', 'inkling_mtp', 'glm5_next_mtp', 'dflash', 'ngram_gpu', 'draft_model', 'dspark']"
          vars.padded_off: "= vars.method != null && has(input.disable_padded_drafter_batch) && input.disable_padded_drafter_batch"
      - title: "Explicitly enabled: hard-fail every incompatibility"
        source: "vllm/config/vllm.py:1553-1584"
        if: "input.async_scheduling == true"
        then:
          - title: "Another speculative method (ngram, suffix, medusa, ...)"
            source: "vllm/config/vllm.py:1563-1575"
            if: "!vars.spec_ok"
            then:
              - fail: {code: value-error, status: 0, message: "Currently, async scheduling is only supported with EAGLE/MTP/Draft Model/NGram GPU/DSpark/DFlash kind of speculative decoding"}
          - title: "disable_padded_drafter_batch=True"
            source: "vllm/config/vllm.py:1576-1580"
            if: "vars.padded_off"
            then:
              - fail: {code: value-error, status: 0, message: "Async scheduling is not compatible with disable_padded_drafter_batch=True."}
          - title: "The executor doesn't support async scheduling"
            source: "vllm/config/vllm.py:1581-1584"
            if: "!vars.executor_ok"
            then:
              - fail: {code: value-error, status: 0, message: "= '`' + input.distributed_executor_backend + '` does not support async scheduling yet.'"}
          - return: {async_scheduling: true, reason: explicit}
      - if: "input.async_scheduling == false"
        then: [{return: {async_scheduling: false, reason: explicit}}]
      - title: "None: pooling models default to synchronous scheduling"
        source: "vllm/config/vllm.py:1585-1596"
        if: "input.runner_type == 'pooling'"
        then: [{return: {async_scheduling: false, reason: pooling}}]
      - title: "None: other speculative methods (e.g. ngram on the CPU) disable it with a warning"
        source: "vllm/config/vllm.py:1597-1610"
        if: "!vars.spec_ok"
        then: [{return: {async_scheduling: false, reason: "= 'Async scheduling not supported with ' + vars.method + '-based speculative decoding and will be disabled.'"}}]
      - title: "None: disable_padded_drafter_batch disables it"
        source: "vllm/config/vllm.py:1611-1618"
        if: "vars.padded_off"
        then: [{return: {async_scheduling: false, reason: disable_padded_drafter_batch}}]
      - title: "None: an executor without async support disables it"
        source: "vllm/config/vllm.py:1619-1625"
        if: "!vars.executor_ok"
        then: [{return: {async_scheduling: false, reason: executor}}]
      - title: "None: the V1 runner can't overlap with pipeline parallelism"
        source: "vllm/config/vllm.py:1633-1641"
        if: "input.pipeline_parallel_size > 1 && !input.use_v2_model_runner"
        then: [{return: {async_scheduling: false, reason: v1-pipeline-parallel}}]
      - title: "None, nothing incompatible: async scheduling on"
        source: "vllm/config/vllm.py:1642-1643"
        return: {async_scheduling: true, reason: default}
  - component: vllm-config
    name: check-hisparse
    kind: function
    summary: "VllmConfig.__post_init__ HiSparse block: CUDA only, no PP or DCP, no FULL cudagraph mode, --scheduler-reserve-full-isl kept, and a DSA model with index_topk."
    sources: ["vllm/config/vllm.py:1800-1840"]
    request:
      type: object
      properties:
        device_type: {type: string, default: cuda}
        pipeline_parallel_size: {type: integer, default: 1}
        decode_context_parallel_size: {type: integer, default: 1}
        cudagraph_mode: {type: string, enum: [NONE, PIECEWISE, FULL, FULL_DECODE_ONLY, FULL_AND_PIECEWISE], default: FULL_AND_PIECEWISE}
        scheduler_reserve_full_isl: {type: boolean, default: true}
        has_model_config: {type: boolean, default: false}
        has_index_topk: {type: boolean, default: false}
    response: {type: object, properties: {valid: {type: boolean}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "current_platform.is_cuda()"
        source: "vllm/config/vllm.py:1808-1809"
        if: "input.device_type != 'cuda'"
        then: [{fail: {code: value-error, status: 0, message: "HiSparse currently requires NVIDIA CUDA."}}]
      - source: "vllm/config/vllm.py:1810-1811"
        if: "input.pipeline_parallel_size > 1"
        then: [{fail: {code: value-error, status: 0, message: "HiSparse does not support pipeline parallelism."}}]
      - source: "vllm/config/vllm.py:1812-1815"
        if: "input.decode_context_parallel_size > 1"
        then: [{fail: {code: value-error, status: 0, message: "HiSparse does not support decode context parallelism."}}]
      - source: "vllm/config/vllm.py:1816-1821"
        if: "input.cudagraph_mode == 'FULL'"
        then: [{fail: {code: value-error, status: 0, message: "HiSparse does not support cudagraph_mode=FULL; use FULL_AND_PIECEWISE (the default), which captures FULL graphs for decode batches."}}]
      - title: "Async loads admitted against free host blocks could deadlock without the full-ISL reservation"
        source: "vllm/config/vllm.py:1822-1829"
        if: "!input.scheduler_reserve_full_isl"
        then: [{fail: {code: value-error, status: 0, message: "HiSparse requires --scheduler-reserve-full-isl; remove --no-scheduler-reserve-full-isl."}}]
      - source: "vllm/config/vllm.py:1830-1835"
        if: "input.has_model_config && !input.has_index_topk"
        then: [{fail: {code: value-error, status: 0, message: "HiSparse is only supported for DSA models with index_topk."}}]
      - return: {valid: true}
  - component: vllm-config
    name: resolve-mm-processor-device
    kind: function
    summary: "VllmConfig._resolve_mm_processor_device: an unset processor device moves to the accelerator only on an encode-only EC instance whose tensor transport is torch_shm; an explicit device is left alone."
    sources: ["vllm/config/vllm.py:2792-2840"]
    request:
      type: object
      properties:
        multimodal_config: {type: object, properties: {mm_processor_kwargs: {type: [object, "null"], default: null}, mm_tensor_ipc: {type: string, default: direct_rpc}}}
        ec_transfer_config: {type: [object, "null"], default: null, properties: {ec_connector: {type: [string, "null"]}, ec_role: {type: [string, "null"]}}}
        device_type: {type: string, default: cuda}
    response: {type: object}
    behavior:
      - set: {vars.mm: "= input.multimodal_config"}
      - title: "An explicit device (folded from --mm-processor-device or given in mm_processor_kwargs) is kept"
        source: "vllm/config/vllm.py:2810-2811"
        call: multimodal-config.get-mm-processor-device-type
        input: {mm_processor_kwargs: "= has(vars.mm.mm_processor_kwargs) ? vars.mm.mm_processor_kwargs : null"}
        as: dt
      - if: "vars.dt.value.device_type != null"
        then: [{return: "= vars.mm"}]
      - title: "No accelerator (CPU or unspecified platform)"
        source: "vllm/config/vllm.py:2815-2817"
        if: "input.device_type in ['', 'cpu']"
        then: [{return: "= vars.mm"}]
      - title: "Only an encode-only instance (EC producer, not consumer) has the device to itself"
        source: "vllm/config/vllm.py:2819-2824"
        call: ec-transfer-config.is-encode-only
        input: {ec_transfer_config: "= input.ec_transfer_config"}
        as: eo
      - if: "!vars.eo.value.is_encode_only"
        then: [{return: "= vars.mm"}]
      - title: "Other transports serialize host bytes: keep the processor on CPU (logged)"
        source: "vllm/config/vllm.py:2826-2837"
        if: "!has(vars.mm.mm_tensor_ipc) || vars.mm.mm_tensor_ipc != 'torch_shm'"
        then:
          - set: {ctx.mm_processor_device_note: "= 'EPD encoder instance: keeping the multi-modal processor on CPU because mm_tensor_ipc=' + (has(vars.mm.mm_tensor_ipc) ? vars.mm.mm_tensor_ipc : 'direct_rpc') + ' cannot carry device tensors.'"}
          - return: "= vars.mm"
      - title: "mm_processor_kwargs['device'] = the platform's device type"
        source: "vllm/config/vllm.py:2838-2840"
        return: "= merge(vars.mm, {'mm_processor_kwargs': merge(has(vars.mm.mm_processor_kwargs) && vars.mm.mm_processor_kwargs != null ? vars.mm.mm_processor_kwargs : {}, {'device': input.device_type})})"
  - component: vllm-config
    name: needs-dp-coordinator
    kind: function
    summary: "VllmConfig.needs_dp_coordinator: a DPCoordinator process is needed when DP > 1 and the model is MoE (wave coordination, even with external LB) or the LB is internal/hybrid (queue stats)."
    sources: ["vllm/config/vllm.py:843-862"]
    request:
      type: object
      properties:
        data_parallel_size: {type: integer, default: 1}
        has_model_config: {type: boolean, default: true}
        is_moe: {type: boolean, default: false}
        data_parallel_external_lb: {type: boolean, default: false}
    response: {type: object, properties: {needs_dp_coordinator: {type: boolean}}}
    behavior:
      - title: "DP 1: no coordinator"
        source: "vllm/config/vllm.py:858"
        if: "input.data_parallel_size <= 1"
        then: [{return: {needs_dp_coordinator: false}}]
      - title: "DP > 1: MoE models need wave coordination; dense models need it only for internal/hybrid LB stats"
        source: "vllm/config/vllm.py:858-862"
        return: {needs_dp_coordinator: "= !input.has_model_config || input.is_moe || !input.data_parallel_external_lb"}
  - component: vllm-config
    name: get-quantization-config
    kind: function
    summary: "VllmConfig._get_quantization_config: for a quantized model, build the method's QuantizationConfig and refuse a GPU below its minimum capability or a model dtype it can't run; None for an unquantized model."
    description: >-
      Minimum capabilities per method (each class's get_min_capability): fp8 75 (fp8.py:146-147), modelopt 80
      (modelopt.py:442), modelopt_fp4 75 (modelopt.py:765), compressed-tensors 70 (compressed_tensors.py:120),
      awq/auto_awq 75 (auto_awq.py:230), gptq/auto_gptq 60 (auto_gptq.py:179), fbgemm_fp8 80 (fbgemm_fp8.py:63),
      experts_int8 80, mxfp4 80, moe_wna16 70, quark 70, torchao 75, fp_quant 100. Methods not listed are not
      capability-checked here. Only Fp8Config's activation dtypes (bfloat16, float16; fp8.py:142-143) are checked;
      building the config from the checkpoint (get_quant_config) is models-layers' loader.
    sources: ["vllm/config/vllm.py:885-920", "vllm/model_executor/layers/quantization/fp8.py:142-147"]
    request:
      type: object
      properties:
        quantization: {type: [string, "null"], default: null}
        quantization_config: {type: [object, "null"], default: null}
        dtype: {type: string, default: bfloat16}
        device_type: {type: string, default: cuda}
    response:
      type: [object, "null"]
      properties:
        quant_method: {type: string}
        min_capability: {type: integer}
        is_checkpoint_fp8_serialized: {type: boolean}
        activation_scheme: {type: string}
        weight_block_size: {type: [array, "null"], default: null}
        ignored_layers: {type: array}
        kv_cache_scheme: {type: [string, object, "null"], default: null}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "model_config.quantization is None: no quant config"
        source: "vllm/config/vllm.py:892"
        if: "input.quantization == null"
        then: [{return: null}]
      - set:
          vars.q: "= input.quantization"
          vars.cfg: "= input.quantization_config != null ? input.quantization_config : {}"
          vars.min: "= {'fp8': 75, 'modelopt': 80, 'modelopt_fp4': 75, 'compressed-tensors': 70, 'awq': 75, 'auto_awq': 75, 'gptq': 60, 'auto_gptq': 60, 'fbgemm_fp8': 80, 'experts_int8': 80, 'mxfp4': 80, 'moe_wna16': 70, 'quark': 70, 'torchao': 75, 'fp_quant': 100, 'humming': 75, 'inc': 60}"
      - title: "current_platform.get_device_capability(): None (no NVML, CPU) skips the check"
        source: "vllm/config/vllm.py:896-897"
        if: "input.device_type == 'cuda'"
        then:
          - call: cuda-platform.get-device-capability
            as: cap
          - title: "capability < quant_config.get_min_capability()"
            source: "vllm/config/vllm.py:898-906"
            if: "vars.cap.value != null && vars.q in vars.min && vars.cap.value.as_int < vars.min[vars.q]"
            then:
              - fail: {code: value-error, status: 0, message: "= 'The quantization method ' + vars.q + ' is not supported for the current GPU. Minimum capability: ' + string(vars.min[vars.q]) + '. Current capability: ' + string(vars.cap.value.as_int) + '.'"}
      - title: "Fp8Config.get_supported_act_dtypes: bfloat16 and float16 only"
        source: "vllm/config/vllm.py:907-913"
        if: "vars.q == 'fp8' && !(input.dtype in ['bfloat16', 'float16'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'torch.' + input.dtype + ' is not supported for quantization method fp8. Supported dtypes: [torch.bfloat16, torch.float16]'"}
      - title: "Fp8Config.from_config: is_checkpoint_fp8_serialized from quant_method 'fp8', activation_scheme (static or dynamic), weight_block_size and ignored_layers"
        detail: "Only for a checkpoint quantization_config (get_quant_config's make_checkpoint_config, weight_utils.py:257-271); without one the loader reads config files (models-layers)."
        source: "vllm/model_executor/layers/quantization/fp8.py:158-175"
        if: "vars.q == 'fp8' && input.quantization_config != null"
        then:
          - title: "get_from_keys(config, ['activation_scheme']): the key is required"
            source: "vllm/model_executor/layers/quantization/base_config.py:182-189"
            if: "!has(vars.cfg.activation_scheme)"
            then:
              - fail: {code: value-error, status: 0, message: "Cannot find any of ['activation_scheme'] in the model's quantization config."}
          - set:
              vars.act: "= vars.cfg.activation_scheme"
              vars.wbs: "= has(vars.cfg.weight_block_size) ? vars.cfg.weight_block_size : null"
          - title: "Fp8Config.__init__: a checkpoint that isn't fp8-serialized is refused (online fp8 moved to fp8_per_tensor)"
            source: "vllm/model_executor/layers/quantization/fp8.py:105-112"
            if: "!(has(vars.cfg.quant_method) && vars.cfg.quant_method.contains('fp8'))"
            then:
              - fail: {code: value-error, status: 0, message: "The `fp8` quantization method no longer supports online quantization. Please use `--quantization fp8_per_tensor` instead. See https://docs.vllm.ai/en/stable/features/quantization/online/"}
          - title: "activation_scheme must be static or dynamic"
            source: "vllm/model_executor/layers/quantization/fp8.py:114-115"
            if: "!(vars.act in ['static', 'dynamic'])"
            then:
              - fail: {code: value-error, status: 0, message: "= 'Unsupported activation scheme ' + vars.act"}
          - title: "A weight block size has 2 dimensions and needs the dynamic activation scheme"
            source: "vllm/model_executor/layers/quantization/fp8.py:122-132"
            if: "vars.wbs != null"
            then:
              - if: "size(vars.wbs) != 2"
                then:
                  - fail: {code: value-error, status: 0, message: "= 'The quantization block size of weight must have 2 dimensions, but got ' + string(size(vars.wbs)) + ' dimensions'"}
              - if: "vars.act != 'dynamic'"
                then:
                  - fail: {code: value-error, status: 0, message: "= 'The block-wise quantization only supports dynamic activation scheme for now, but got ' + vars.act + ' activation scheme.'"}
          - return:
              quant_method: fp8
              min_capability: 75
              is_checkpoint_fp8_serialized: true
              activation_scheme: "= vars.act"
              weight_block_size: "= vars.wbs"
              ignored_layers: "= has(vars.cfg.ignored_layers) && size(vars.cfg.ignored_layers) > 0 ? vars.cfg.ignored_layers : (has(vars.cfg.modules_to_not_convert) ? vars.cfg.modules_to_not_convert : [])"
              kv_cache_scheme: "= has(vars.cfg.kv_cache_scheme) ? vars.cfg.kv_cache_scheme : null"
      - return:
          quant_method: "= vars.q"
          min_capability: "= vars.q in vars.min ? vars.min[vars.q] : 0"
  - component: vllm-config
    name: max-concurrent-batches
    kind: function
    summary: "VllmConfig.max_concurrent_batches: PP needs PP-size batches in flight; async scheduling adds one more on the V2 runner (2 on the V1 runner without PP); the engine core sizes its batch queue from it."
    sources: ["vllm/config/vllm.py:576-587"]
    request: {type: object, properties: {pipeline_parallel_size: {type: integer, default: 1}, async_scheduling: {type: boolean}, use_v2_model_runner: {type: boolean, default: true}}}
    response: {type: object, properties: {max_concurrent_batches: {type: integer}}}
    behavior:
      - title: "Async scheduling on the V2 runner: pp_size + 1"
        source: "vllm/config/vllm.py:580-583"
        if: "input.async_scheduling && input.use_v2_model_runner"
        then: [{return: {max_concurrent_batches: "= input.pipeline_parallel_size + 1"}}]
      - title: "V1 runner: 2 without PP (async with PP isn't fully supported)"
        source: "vllm/config/vllm.py:584-586"
        if: "input.async_scheduling && input.pipeline_parallel_size <= 1"
        then: [{return: {max_concurrent_batches: 2}}]
      - title: "Otherwise pp_size"
        source: "vllm/config/vllm.py:587"
        return: {max_concurrent_batches: "= input.pipeline_parallel_size"}
  - component: vllm-config
    name: compute-hash
    kind: function
    summary: "VllmConfig.compute_hash: the compile-cache key, the first 10 hex chars of a hash over the vLLM version and every sub-config's compute_hash (model, cache, parallel, scheduler, device, kernel, KV/EC transfer, ...)."
    description: >-
      Sub-configs this model does not resolve (load, offload, attention, engram, LoRA, speculative,
      structured outputs, profiler, observability, compilation, aux output, additional) enter as the
      code's "None" placeholder or their JSON, so the key still changes with every modeled factor.
      The hash is sha256 over canonical JSON (vLLM: safe_hash(str(factors))), so values are not
      byte-identical to vLLM's, only equal and unequal where vLLM's are.
    sources: ["vllm/config/vllm.py:449-565"]
    request:
      type: object
      properties:
        vllm_config: {type: [object, "null"], default: null}
        include_version: {type: boolean, default: true}
    response: {type: object, properties: {hash: {type: string}}}
    errors: [{code: assertion-error, status: 0, retryable: false}]
    behavior:
      - set: {vars.c: "= has(input.vllm_config) && input.vllm_config != null ? input.vllm_config : state.resolved"}
      - if: "vars.c == null"
        then: [{fail: {code: assertion-error, status: 0, message: "no VllmConfig to hash: none given and none resolved"}}]
      - title: "Every sub-config implements the SupportsHash protocol (compute_hash() -> str); each is called below"
        source: "vllm/config/utils.py:217-219"
        set: {vars.f: []}
      - title: "include_version: the vLLM version leads the factors"
        source: "vllm/config/vllm.py:468-471"
        set: {vars.f: "= has(input.include_version) && !input.include_version ? [] : [config['vllm-version']]"}
      - title: "model_config.compute_hash()"
        source: "vllm/config/vllm.py:472-473"
        call: model-config.compute-hash
        input: {model_config: "= vars.c.model_config"}
        as: mh
      - set: {vars.f: "= vars.f + [vars.mh.value.hash]"}
      - title: "compile_mm_encoder adds the multimodal config's hash"
        source: "vllm/config/vllm.py:474-479"
        if: "has(vars.c.compilation_config.compile_mm_encoder) && vars.c.compilation_config.compile_mm_encoder && has(vars.c.model_config.multimodal_config) && vars.c.model_config.multimodal_config != null"
        then:
          - call: multimodal-config.compute-hash
            input: "= vars.c.model_config.multimodal_config"
            as: mmh
          - set: {vars.f: "= vars.f + [vars.mmh.value.hash]"}
      - source: "vllm/config/vllm.py:482-483"
        call: cache-config.compute-hash
        input: {cache_config: "= vars.c.cache_config"}
        as: ch
      - source: "vllm/config/vllm.py:486-487"
        call: parallel-config.compute-hash
        input: {parallel_config: "= vars.c.parallel_config"}
        as: ph
      - source: "vllm/config/vllm.py:490-491"
        call: scheduler-config.compute-hash
        input: {max_num_batched_tokens: "= vars.c.scheduler_config.max_num_batched_tokens", max_num_seqs: "= vars.c.scheduler_config.max_num_seqs"}
        as: sh
      - source: "vllm/config/vllm.py:494-495"
        call: device-config.compute-hash
        as: dh
      - set: {vars.f: "= vars.f + [vars.ch.value.hash, vars.ph.value.hash, vars.sh.value.hash, vars.dh.value.hash]"}
      - title: "load, offload, attention, engram, LoRA and speculative configs (not resolved here: their JSON or None)"
        source: "vllm/config/vllm.py:498-522"
        set: {vars.f: "= vars.f + ['load:unmodeled', 'offload:unmodeled', 'attention:' + json(has(vars.c.attention_config) ? vars.c.attention_config : {}), 'None', 'None', has(vars.c.speculative_config) && vars.c.speculative_config != null ? sha256(json(vars.c.speculative_config)) : 'None']"}
      - title: "compilation_config.compute_hash() (its factors: mode, optimization level, custom ops, passes)"
        source: "vllm/config/vllm.py:532-535"
        set: {vars.f: "= vars.f + [sha256(json(vars.c.compilation_config))]"}
      - source: "vllm/config/vllm.py:536-539"
        call: kernel-config.compute-hash
        input: {kernel_config: "= has(vars.c.kernel_config) ? vars.c.kernel_config : {}"}
        as: kh
      - set: {vars.f: "= vars.f + [vars.kh.value.hash]"}
      - title: "kv_transfer_config.compute_hash(), or None"
        source: "vllm/config/vllm.py:540-543"
        if: "has(vars.c.kv_transfer_config) && vars.c.kv_transfer_config != null"
        then:
          - call: kv-transfer-config.compute-hash
            as: kvh
          - set: {vars.f: "= vars.f + [vars.kvh.value.hash]"}
        else:
          - set: {vars.f: "= vars.f + ['None']"}
      - title: "ec_transfer_config.compute_hash(), or None"
        source: "vllm/config/vllm.py:544-547"
        if: "has(vars.c.ec_transfer_config) && vars.c.ec_transfer_config != null"
        then:
          - call: ec-transfer-config.compute-hash
            as: ech
          - set: {vars.f: "= vars.f + [vars.ech.value.hash]"}
        else:
          - set: {vars.f: "= vars.f + ['None']"}
      - title: "safe_hash(str(factors)).hexdigest()[:10]"
        source: "vllm/config/vllm.py:560-565"
        return: {hash: "= sha256(json([vars.f])).substring(0, 10)"}
  - component: model-config
    name: compute-hash
    kind: function
    summary: "ModelConfig.compute_hash: hash every field except the runtime-only ones (tokenizer, seed, enforce_eager, served_model_name, multimodal processing knobs, ...); a multimodal model also hashes language_model_only and whether video pruning is on, because they change the LM graph."
    sources: ["vllm/config/model.py:453-514"]
    request: {type: object, properties: {model_config: {type: object}}}
    response: {type: object, properties: {hash: {type: string}}}
    behavior:
      - title: "get_hash_factors(self, ignored_factors)"
        source: "vllm/config/model.py:465-503"
        set:
          vars.mm: "= has(input.model_config.multimodal_config) ? input.model_config.multimodal_config : null"
          vars.f: "= input.model_config.transformMap(k, v, !(k in ['convert', 'tokenizer', 'tokenizer_mode', 'seed', 'hf_config_path', 'allowed_local_media_path', 'allowed_media_domains', 'tokenizer_revision', 'spec_target_max_model_len', 'enforce_eager', 'return_sampling_mask', 'logprobs_mode', 'use_fp64_gumbel', 'enable_trace_replay', 'disable_cascade_attn', 'skip_tokenizer_init', 'served_model_name', 'config_format', 'hf_token', 'hf_overrides', 'logits_processors', 'io_processor_plugin', 'pooler_config', 'multimodal_config', 'limit_mm_per_prompt', 'media_io_kwargs', 'mm_processor_kwargs', 'mm_processor_cache_gb', 'mm_processor_cache_type', 'mm_shm_cache_max_object_size_mb', 'mm_encoder_tp_mode', 'interleave_mm_strings', 'skip_mm_profiling', 'mm_ipc_gpu_memory_gb', 'language_model_only']), v)"
      - title: "Multimodal models: language_model_only and video pruning change the LM graph, so they enter the hash"
        source: "vllm/config/model.py:507-513"
        if: "vars.mm != null"
        then:
          - set:
              vars.f: "= merge(vars.f, {'language_model_only': has(vars.mm.language_model_only) && vars.mm.language_model_only, 'video_pruning': has(vars.mm.video_pruning_rate) && vars.mm.video_pruning_rate != null && double(vars.mm.video_pruning_rate) > 0.0})"
      - title: "hash_factors: sha256 of the sorted-key JSON"
        source: "vllm/config/model.py:514"
        return: {hash: "= sha256(json(vars.f))"}
  - component: multimodal-config
    name: init
    kind: function
    summary: "MultiModalConfig(...): mm_encoder_attn_backend names an AttentionBackendEnum member (XFORMERS was removed), mm_hasher_algorithm is blake3/sha256/sha512, the shm object size goes with the shm cache, and FP8 encoder scale paths need mm_encoder_attn_dtype fp8."
    sources: ["vllm/config/multimodal.py:301-555"]
    request:
      type: object
      properties:
        language_model_only: {type: boolean, default: false}
        mm_processor_kwargs: {type: [object, "null"], default: null}
        mm_processor_cache_type: {type: string, default: lru}
        mm_shm_cache_max_object_size_mb: {type: integer, default: 128}
        mm_hasher_algorithm: {type: string, default: blake3}
        mm_encoder_tp_mode: {type: string, default: weights}
        mm_encoder_attn_backend: {type: [string, "null"], default: null}
        mm_encoder_attn_dtype: {type: [string, "null"], default: null}
        mm_encoder_fp8_scale_path: {type: [string, "null"], default: null}
        mm_encoder_fp8_scale_save_path: {type: [string, "null"], default: null}
        mm_device_do_normalize: {type: [boolean, "null"], default: true}
        mm_tensor_ipc: {type: string, enum: [direct_rpc, torch_shm], default: direct_rpc}
        video_pruning_rate: {type: [number, "null"], default: null}
    response: {type: object}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: file-not-found-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.backend: "= has(input.mm_encoder_attn_backend) && input.mm_encoder_attn_backend != null ? dyn(input.mm_encoder_attn_backend.upperAscii()) : dyn(null)"
          vars.dtype: "= has(input.mm_encoder_attn_dtype) ? input.mm_encoder_attn_dtype : null"
          vars.scale: "= has(input.mm_encoder_fp8_scale_path) ? input.mm_encoder_fp8_scale_path : null"
          vars.save: "= has(input.mm_encoder_fp8_scale_save_path) ? input.mm_encoder_fp8_scale_save_path : null"
      - title: "mm_hasher_algorithm is a Literal: blake3, sha256 or sha512"
        source: "vllm/config/multimodal.py:372-374"
        if: "has(input.mm_hasher_algorithm) && !(input.mm_hasher_algorithm in ['blake3', 'sha256', 'sha512'])"
        then:
          - fail: {code: value-error, status: 0, message: "= '1 validation error for MultiModalConfig\\nmm_hasher_algorithm\\n  Input should be \\'blake3\\', \\'sha256\\' or \\'sha512\\' [type=literal_error, input_value=\\'' + input.mm_hasher_algorithm + '\\', input_type=str]'"}
      - title: "_validate_mm_encoder_attn_backend: XFORMERS was removed"
        source: "vllm/config/multimodal.py:497-505"
        if: "vars.backend == 'XFORMERS'"
        then:
          - fail: {code: value-error, status: 0, message: "Attention backend 'XFORMERS' has been removed (See PR #29262 for details). Please select a supported attention backend."}
      - title: "AttentionBackendEnum[value.upper()]: an unknown name is a KeyError, surfaced by pydantic as a ValueError"
        source: "vllm/config/multimodal.py:507-512"
        if: "vars.backend != null && !(vars.backend in ['FLASH_ATTN', 'TRITON_ATTN', 'TORCH_SDPA', 'FLASHINFER', 'FLEX_ATTENTION', 'ROCM_AITER_FA', 'ROCM_ATTN', 'TREE_ATTN', 'CPU_ATTN', 'XPU_ATTN', 'PALLAS', 'FLASH_ATTN_MLA', 'FLASHMLA', 'FLASHINFER_MLA', 'TRITON_MLA', 'CUTLASS_MLA', 'TURBOQUANT', 'CUSTOM'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'mm_encoder_attn_backend: ' + vars.backend + ' is not an AttentionBackendEnum member'"}
      - title: "The shm object-size knob only goes with the shm processor cache"
        source: "vllm/config/multimodal.py:516-524"
        if: "has(input.mm_shm_cache_max_object_size_mb) && input.mm_shm_cache_max_object_size_mb != 128 && (!has(input.mm_processor_cache_type) || input.mm_processor_cache_type != 'shm')"
        then:
          - fail: {code: value-error, status: 0, message: "'mm_shm_cache_max_object_size_mb' should only be set when 'mm_processor_cache_type' is 'shm'."}
      - title: "FP8 scale paths require mm_encoder_attn_dtype fp8"
        source: "vllm/config/multimodal.py:526-534"
        if: "vars.dtype != 'fp8' && (vars.scale != null || vars.save != null)"
        then:
          - fail: {code: value-error, status: 0, message: "'mm_encoder_fp8_scale_path' and 'mm_encoder_fp8_scale_save_path' require 'mm_encoder_attn_dtype' to be 'fp8'."}
      - title: "Static scales and saving dynamic scales are exclusive"
        source: "vllm/config/multimodal.py:535-543"
        if: "vars.scale != null && vars.save != null"
        then:
          - fail: {code: value-error, status: 0, message: "'mm_encoder_fp8_scale_save_path' cannot be used with 'mm_encoder_fp8_scale_path' (saving requires dynamic scaling)."}
      - title: "The static scale file must exist"
        source: "vllm/config/multimodal.py:546-549"
        if: "vars.scale != null"
        then:
          - call: local-disk.stat
            input: {path: "= vars.scale"}
            as: st
          - if: "!vars.st.value.exists || vars.st.value.is_dir"
            then:
              - fail: {code: file-not-found-error, status: 0, message: "= 'FP8 scale file not found: ' + vars.scale"}
      - return:
          language_model_only: "= has(input.language_model_only) && input.language_model_only"
          mm_processor_kwargs: "= has(input.mm_processor_kwargs) ? input.mm_processor_kwargs : null"
          mm_encoder_tp_mode: "= has(input.mm_encoder_tp_mode) ? input.mm_encoder_tp_mode : 'weights'"
          mm_encoder_attn_backend: "= vars.backend"
          mm_encoder_attn_dtype: "= vars.dtype"
          mm_encoder_fp8_scale_path: "= vars.scale"
          mm_device_do_normalize: "= has(input.mm_device_do_normalize) ? input.mm_device_do_normalize : true"
          mm_tensor_ipc: "= has(input.mm_tensor_ipc) ? input.mm_tensor_ipc : 'direct_rpc'"
          video_pruning_rate: "= has(input.video_pruning_rate) ? input.video_pruning_rate : null"
  - component: multimodal-config
    name: fold-mm-processor-device
    kind: function
    summary: "MultiModalConfig.fold_mm_processor_device: --mm-processor-device becomes mm_processor_kwargs['device']; None and 'auto' add nothing, an explicit kwargs device wins, 'cpu' stays cpu and anything else means the platform's accelerator."
    sources: ["vllm/config/multimodal.py:557-592"]
    request:
      type: object
      properties:
        mm_processor_kwargs: {type: [object, "null"], default: null}
        mm_processor_device: {type: [string, "null"], default: null}
    response: {type: object, properties: {mm_processor_kwargs: {type: [object, "null"], default: null}}}
    behavior:
      - set:
          vars.kw: "= has(input.mm_processor_kwargs) ? input.mm_processor_kwargs : null"
          vars.flag: "= has(input.mm_processor_device) ? input.mm_processor_device : null"
      - title: "None or auto: nothing folded (auto is settled later by VllmConfig)"
        source: "vllm/config/multimodal.py:578-579"
        if: "vars.flag == null || vars.flag == 'auto'"
        then: [{return: {mm_processor_kwargs: "= vars.kw"}}]
      - title: "An explicit device in the kwargs wins"
        source: "vllm/config/multimodal.py:580-581"
        if: "vars.kw != null && has(vars.kw.device) && vars.kw.device != null"
        then: [{return: {mm_processor_kwargs: "= vars.kw"}}]
      - title: "'cpu' is cpu; any other value is current_platform.device_type (or cpu without one)"
        source: "vllm/config/multimodal.py:583-591"
        call: platforms.getattr
        input: {name: current_platform}
        as: plat
      - return:
          mm_processor_kwargs: "= merge(vars.kw == null ? {} : vars.kw, {'device': vars.flag == 'cpu' ? 'cpu' : (vars.plat.value.device_type != '' ? vars.plat.value.device_type : 'cpu')})"
  - component: multimodal-config
    name: get-mm-processor-device-type
    kind: function
    summary: "MultiModalConfig.get_mm_processor_device_type: torch.device(mm_processor_kwargs['device']).type, None without a device; an unparseable device is a ValueError."
    sources: ["vllm/config/multimodal.py:594-620"]
    request: {type: object, properties: {mm_processor_kwargs: {type: [object, "null"], default: null}}}
    response: {type: object, properties: {device_type: {type: [string, "null"], default: null}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set: {vars.d: "= has(input.mm_processor_kwargs) && input.mm_processor_kwargs != null && has(input.mm_processor_kwargs.device) ? input.mm_processor_kwargs.device : null"}
      - title: "No device requested"
        source: "vllm/config/multimodal.py:613-615"
        if: "vars.d == null"
        then: [{return: {device_type: null}}]
      - title: "A bare index is a CUDA device"
        source: "vllm/config/multimodal.py:616-617"
        if: "type(vars.d) == int"
        then: [{return: {device_type: cuda}}]
      - title: "torch.device(device).type: 'cuda:1' -> cuda; anything torch doesn't know is refused"
        source: "vllm/config/multimodal.py:616-620"
        if: "!(string(vars.d).split(':')[0] in ['cpu', 'cuda', 'xpu', 'hpu', 'mps', 'meta', 'xla', 'npu', 'mtia'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Invalid \"device\" in mm_processor_kwargs: ' + (type(vars.d) == string ? '\\'' + vars.d + '\\'' : string(vars.d)) + '. Expected a torch device such as \"cpu\", \"cuda\" or \"cuda:0\".'"}
      - return: {device_type: "= string(vars.d).split(':')[0]"}
