    sources: ["vllm/envs.py:617"]
    summary: "Lazily evaluated environment variables, optionally cached after startup."
    attributes: {owner: config-platform}
    description: >-
      `variables` maps the environment_variables names this fragment models to their config ids
      (each env var is a config entity; its value is the parsed os.environ value). `cache_enabled`
      and `cache` model functools.cache wrapping __getattr__ after enable_envs_cache().
    state:
      schema: {type: object, properties: {variables: {type: object}, set_default: {type: array}, environ: {type: object}, cache_enabled: {type: boolean}, cache: {type: object}}}
      initial:
        cache_enabled: false
