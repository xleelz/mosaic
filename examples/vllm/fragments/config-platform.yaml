    config: {vllm-tpu-using-pathways: true}
    state: {platforms: {host: {vllm_version: "0.32.0+cpu", nvml_gpu_count: 1}}}
    steps:
      - {interface: platforms.tpu-platform-plugin, caller: operator, as: tpu}
      - {interface: platforms.cuda-platform-plugin, caller: operator, as: cuda}
      - {interface: platforms.cpu-platform-plugin, caller: operator, as: cpu}
      - {interface: platforms.rocm-platform-plugin, caller: operator, as: rocm}
    expect:
      - "steps.tpu.result.value.qualname == 'tpu_inference.platforms.tpu_platform.TpuPlatform'"
      - "steps.cuda.result.value.qualname == null && steps.rocm.result.value.qualname == null"
      - "steps.cpu.result.value.qualname == 'vllm.platforms.cpu.CpuPlatform'"
  - id: config-platform-detect-no-nvml
    name: "NVML missing on a non-Jetson host: not CUDA"
