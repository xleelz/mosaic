  # ---------------- platform detection ----------------
  - id: config-platform-detect-cuda-cached
    name: "Write then read: CUDA is detected once and cached in vllm.platforms"
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: config-platform-detect, as: first}
      - {flow: config-platform-detect, as: second}
    expect:
      - "steps.first.result.value.qualname == 'vllm.platforms.cuda.CudaPlatform' && steps.second.result.value.qualname == 'vllm.platforms.cuda.CudaPlatform'"
      # internal path is the point: the second read is served from the cache, with no new resolution
      - "calls['platforms.resolve-current-platform-cls-qualname'] == 1"
  - id: config-platform-detect-unspecified
    flow: config-platform-detect
    name: "No accelerator and not a CPU build: UnspecifiedPlatform"
    fixtures: [tp1-llama-8b]
    state: {platforms: {host: {nvml_gpu_count: 0}}}
    expect:
      - "result.ok && result.value.qualname == 'vllm.platforms.interface.UnspecifiedPlatform' && result.value.device_type == ''"
  - id: config-platform-detect-two-builtins
    flow: config-platform-detect
    name: "NVML and amdsmi both see GPUs: only one platform plugin may activate"
    fixtures: [tp1-llama-8b]
    state: {platforms: {host: {amdsmi_gpus: 1}}}
    expect:
      - "!result.ok && result.error.code == 'runtime-error' && result.error.message == \"Only one platform plugin can be activated, but got: ['cuda', 'rocm']\""
  - id: config-platform-detect-oot-plugin
    flow: config-platform-detect
    name: "An out-of-tree platform plugin wins over the detected CUDA"
    fixtures: [tp1-llama-8b]
    state: {plugins: {entry_points: {vllm.platform_plugins: {acme_npu: {value: "acme_npu:register", loads: true, returns: acme_npu.platform.NpuPlatform}}}}}
    expect:
      - "result.ok && result.value.qualname == 'acme_npu.platform.NpuPlatform'"
  - id: config-platform-detect-two-oot
    flow: config-platform-detect
    name: "Two out-of-tree platform plugins activate"
    fixtures: [tp1-llama-8b]
    state: {plugins: {entry_points: {vllm.platform_plugins: {acme_npu: {value: "acme_npu:register", loads: true, returns: acme_npu.platform.NpuPlatform}, beta_gpu: {value: "beta_gpu:register", loads: true, returns: beta_gpu.platform.BetaPlatform}}}}}
    expect:
      - "!result.ok && result.error.code == 'runtime-error' && result.error.message == \"Only one platform plugin can be activated, but got: ['acme_npu', 'beta_gpu']\""
  - id: config-platform-detect-oot-filtered
    flow: config-platform-detect
    name: "VLLM_PLUGINS excludes the out-of-tree plugin, and a plugin that fails to load is skipped"
    fixtures: [tp1-llama-8b]
    config: {vllm-plugins: [beta_gpu]}
    state: {plugins: {entry_points: {vllm.platform_plugins: {acme_npu: {value: "acme_npu:register", loads: true, returns: acme_npu.platform.NpuPlatform}, beta_gpu: {value: "beta_gpu:register", loads: false, returns: beta_gpu.platform.BetaPlatform}}}}}
    expect:
      - "result.ok && result.value.qualname == 'vllm.platforms.cuda.CudaPlatform'"
  - id: config-platform-detect-target-cpu
    flow: config-platform-detect
    name: "VLLM_TARGET_DEVICE=cpu is authoritative: no other probe runs"
    fixtures: [tp1-llama-8b]
    config: {vllm-target-device: cpu}
    expect:
      - "result.ok && result.value.qualname == 'vllm.platforms.cpu.CpuPlatform'"
      # internal path is the point: VLLM_TARGET_DEVICE=cpu skips every other probe
      - "calls['platforms.cuda-platform-plugin'] == 0 && calls['plugins.load-plugins-by-group'] == 0"
  - id: config-platform-detect-host-variants
    name: "Per-host detection: Jetson, Pathways TPU, libtpu, ROCm on WSL, XPU, AMD Zen CPU build, macOS"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: platforms.cuda-platform-plugin, caller: operator, as: jetson}
      - {interface: platforms.tpu-platform-plugin, caller: operator, as: libtpu}
      - {interface: platforms.rocm-platform-plugin, caller: operator, as: wsl}
      - {interface: platforms.xpu-platform-plugin, caller: operator, as: xpu}
      - {interface: platforms.cpu-platform-plugin, caller: operator, as: zen}
    state:
      platforms:
        host: {nvml_available: false, jetson: true, libtpu_installed: true, in_wsl: true, torch_hip: true, xpu_available: true, vllm_version: "0.32.0", amd_zen_avx512: true, zentorch_installed: true, sys_platform: darwin}
    expect:
      - "steps.jetson.result.value.qualname == 'vllm.platforms.cuda.CudaPlatform'"
      - "steps.libtpu.result.value.qualname == 'vllm.platforms.tpu.TpuPlatform'"
      - "steps.wsl.result.value.qualname == 'vllm.platforms.rocm.RocmPlatform'"
      - "steps.xpu.result.value.qualname == 'vllm.platforms.xpu.XPUPlatform'"
      - "steps.zen.result.value.qualname == 'vllm.platforms.zen_cpu.ZenCpuPlatform'"
  - id: config-platform-detect-pathways-and-cpu-build
