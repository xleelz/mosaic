    name: replace
    kind: function
    summary: "vllm.config.utils.replace: dataclasses.replace for pydantic config dataclasses: copy the init fields, apply the overrides and construct the class again, so its validation runs anew."
    sources: ["vllm/config/utils.py:121-129"]
