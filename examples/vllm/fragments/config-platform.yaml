          Qwen/Qwen3-1.7B-FP8: {architectures: [Qwen3ForCausalLM], model_type: qwen3, num_attention_heads: 16, num_key_value_heads: 8, max_position_embeddings: 40960, quantization_config: {quant_method: fp8, activation_scheme: dynamic, fmt: e4m3, weight_block_size: [128, 128]}}
          Qwen/Qwen3-0.6B: {architectures: [Qwen3ForCausalLM], model_type: qwen3, num_attention_heads: 16, num_key_value_heads: 8, max_position_embeddings: 40960}
