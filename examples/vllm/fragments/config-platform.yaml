      hf-hub:
        models:
          llava-hf/llava-1.5-7b-hf: {architectures: [LlavaForConditionalGeneration], model_type: llava, num_attention_heads: 32, num_key_value_heads: 32, max_position_embeddings: 4096, vision_config: {model_type: clip_vision_model}}
