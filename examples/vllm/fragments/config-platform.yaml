  - {id: vllm-public-assets-s3, name: "s3://vllm-public-assets", kind: external, parent: control, layer: control, sources: ["vllm/assets/base.py:10"], summary: "The public S3 bucket of vLLM test and example assets. Table `objects` holds what the bucket serves, keyed by object key.", attributes: {owner: config-platform}, state: {schema: {type: object, properties: {objects: {type: object}}}, initial: {objects: {}}}}
