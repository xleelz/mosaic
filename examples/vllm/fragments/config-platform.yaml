    summary: "AudioAsset(name).audio_and_sample_rate: <name>.ogg from the public assets bucket (multimodal_asset/), cached locally, decoded at its native sample rate."
    sources: ["vllm/assets/audio.py:20-38"]
    request: {type: object, required: [name], properties: {name: {type: string, enum: [winning_call, mary_had_lamb]}}}
    response: {type: object, properties: {path: {type: string}, sample_rate: {type: integer}}}
