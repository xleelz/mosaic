      - {interface: vllm-config.compute-hash, caller: operator, as: ec, input: {vllm_config: "= merge(steps.base.result.value, {'ec_transfer_config': {'ec_connector': 'ECExampleConnector', 'ec_role': 'ec_producer'}})"}}
      - {interface: vllm-config.compute-hash, caller: operator, as: mm, input: {vllm_config: "= merge(steps.base.result.value, {'compilation_config': {'compile_mm_encoder': true}, 'model_config': {'multimodal_config': {'mm_encoder_attn_backend': 'FLASH_ATTN'}}})"}}
