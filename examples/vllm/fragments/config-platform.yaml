          nm-testing/dflash-qwen3-8b-speculators: {architectures: [DFlashSpeculator], speculators_model_type: dflash, speculators_config: {proposal_methods: [{proposal_type: dflash, speculative_tokens: 4}], verifier: {name_or_path: Qwen/Qwen3-8B}}, transformer_layer_config: {model_type: qwen3}, num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 40960}
