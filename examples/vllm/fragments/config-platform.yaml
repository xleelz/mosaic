# config-platform fragment of the vLLM v0.32.0 ontology (built from code).
# Owns EngineArgs -> VllmConfig resolution and validation, platform detection and
# plugins, environment variables, and the resolved VllmConfig (shared datum).
schema_version: 1
id: vllm

configs:
  # Owned shared value (replaces the boundary reference in fixtures.yaml).
  - id: max-model-len
    type: integer
    value: 131072
    default: null
    summary: "max_model_len: the code default is None (derive from the HF config); for Llama-3.1 the derived value is max_position_embeddings 131072, since llama3 RoPE is not rescaled. Deployed (no --max-model-len) = derived."
    sources: ["vllm/config/model.py:245", "vllm/engine/arg_utils.py:502", "vllm/config/model.py:2624-2635"]
    attributes: {key: max_model_len}
  # Environment variables (vllm/envs.py). Deployed = unset in every fixture, so value = default.
  - {id: vllm-target-device, type: string, value: cuda, default: cuda, summary: "VLLM_TARGET_DEVICE, lower-cased; 'cpu' short-circuits platform detection to the CPU platform", sources: ["vllm/envs.py:91", "vllm/envs.py:621"], attributes: {key: VLLM_TARGET_DEVICE, env: true}}
  - {id: vllm-plugins, type: array, value: null, default: null, summary: "VLLM_PLUGINS split on ','; unset (null) loads every plugin of a group; endpoint plugins load only when listed", sources: ["vllm/envs.py:117", "vllm/envs.py:1172-1176"], attributes: {key: VLLM_PLUGINS, env: true}}
  - {id: vllm-tpu-using-pathways, type: boolean, value: false, default: false, summary: "VLLM_TPU_USING_PATHWAYS: true when JAX_PLATFORMS contains 'proxy'", sources: ["vllm/envs.py:201", "vllm/envs.py:1615-1617"], attributes: {key: VLLM_TPU_USING_PATHWAYS, env: true}}
  - {id: vllm-allow-long-max-model-len, type: boolean, value: false, default: false, summary: "VLLM_ALLOW_LONG_MAX_MODEL_LEN: allow a user max_model_len above the derived one (warning instead of ValueError)", sources: ["vllm/envs.py:110", "vllm/envs.py:1123-1126"], attributes: {key: VLLM_ALLOW_LONG_MAX_MODEL_LEN, env: true}}
  - {id: vllm-lora-resolver-cache-dir, type: string, value: null, default: null, summary: "VLLM_LORA_RESOLVER_CACHE_DIR: local directory the filesystem LoRA resolver plugin serves", sources: ["vllm/envs.py:118", "vllm/envs.py:1180-1182"], attributes: {key: VLLM_LORA_RESOLVER_CACHE_DIR, env: true}}
  - {id: vllm-lora-resolver-hf-repo-list, type: string, value: null, default: null, summary: "VLLM_LORA_RESOLVER_HF_REPO_LIST: comma-separated HF repos for the hf-hub LoRA resolver plugin", sources: ["vllm/envs.py:119", "vllm/envs.py:1187-1189"], attributes: {key: VLLM_LORA_RESOLVER_HF_REPO_LIST, env: true}}
  - {id: vllm-enable-v1-multiprocessing, type: boolean, value: true, default: true, summary: "VLLM_ENABLE_V1_MULTIPROCESSING (default 1)", sources: ["vllm/envs.py:165", "vllm/envs.py:1463-1465"], attributes: {key: VLLM_ENABLE_V1_MULTIPROCESSING, env: true}}
  - {id: vllm-port, type: string, value: null, default: null, summary: "raw VLLM_PORT string; unset -> None; must parse as int", sources: ["vllm/envs.py:16", "vllm/envs.py:516-543"], attributes: {key: VLLM_PORT, env: true}}
  - {id: vllm-worker-multiproc-method, type: string, value: null, default: null, summary: "raw VLLM_WORKER_MULTIPROC_METHOD; unset -> 'fork'; must be spawn or fork", sources: ["vllm/envs.py:70", "vllm/envs.py:956-958"], attributes: {key: VLLM_WORKER_MULTIPROC_METHOD, env: true}}
  # Engine args and derived VllmConfig values other areas read (owned here: RECONCILE decision 7).
  # Strings that are None in code are '' here (null config values vanish from CEL `config`); attributes.none_is records it.
  - {id: model, type: string, value: meta-llama/Llama-3.1-8B-Instruct, default: Qwen/Qwen3-0.6B, summary: "--model: the served model path. Deployed differs from the code default.", sources: ["vllm/config/model.py:154", "vllm/engine/arg_utils.py:474"], attributes: {key: model}}
  - {id: served-model-name, type: array, value: [llama-8b], default: null, summary: "--served-model-name: aliases clients must use (deployed llama-8b; default None means the model path)", sources: ["vllm/config/model.py:325", "vllm/engine/arg_utils.py:480"], attributes: {key: served_model_name}}
  - {id: model-is-multimodal, type: boolean, value: false, default: false, summary: "ModelConfig.is_multimodal_model: multimodal_config is not None. ModelConfig builds a MultiModalConfig when the registry says the served architecture supports multimodal inputs (model-config.post-init's is_multimodal_model; Llama-3.1 is text-only, the VL world's Qwen2-VL sets it). Readers: serving-api's renderer and processor, worker-runner's encoder runner and cache, models-layers' create-processor, attention.", sources: ["vllm/config/model.py:1981-1982", "vllm/config/model.py:817-868"], attributes: {key: is_multimodal_model}}
  - {id: runner, type: string, value: auto, default: auto, summary: "--runner: auto resolves to generate for *ForCausalLM checkpoints", sources: ["vllm/config/model.py:162", "vllm/engine/arg_utils.py:483"], attributes: {key: runner}}
  - {id: quantization, type: string, value: null, default: null, summary: "--quantization: unset, so ModelConfig takes the checkpoint's quant_method (none for the fixture models). Deployed = default (None).", sources: ["vllm/config/model.py:260", "vllm/engine/arg_utils.py:622"], attributes: {key: quantization}}
  - {id: model-impl, type: string, value: auto, default: auto, summary: "--model-impl: auto prefers the vLLM class and falls back to the Transformers backend", sources: ["vllm/config/model.py:394", "vllm/engine/arg_utils.py:790"], attributes: {key: model_impl}}
  - {id: enforce-eager, type: boolean, value: false, default: false, summary: "--enforce-eager: never capture CUDA graphs", sources: ["vllm/config/model.py:272", "vllm/engine/arg_utils.py:630"], attributes: {key: enforce_eager}}
  - {id: enable-sleep-mode, type: boolean, value: false, default: false, summary: "--enable-sleep-mode: weights and KV cache through the CuMem allocator so they can be offloaded or discarded", sources: ["vllm/config/model.py:366", "vllm/engine/arg_utils.py:780"], attributes: {key: enable_sleep_mode}}
  - {id: enable-lora, type: boolean, value: false, default: false, summary: "--enable-lora: builds a LoRAConfig; without it the workers refuse add_lora", sources: ["vllm/engine/arg_utils.py:676", "vllm/engine/arg_utils.py:2650-2668"], attributes: {key: enable_lora}}
  - {id: return-sampling-mask, type: boolean, value: false, default: false, summary: "model_config.return_sampling_mask", sources: ["vllm/config/model.py:280", "vllm/engine/arg_utils.py:478"], attributes: {key: return_sampling_mask}}
  - {id: enable-trace-replay, type: boolean, value: false, default: false, summary: "model_config.enable_trace_replay", sources: ["vllm/config/model.py:302", "vllm/engine/arg_utils.py:611"], attributes: {key: enable_trace_replay}}
  - {id: enable-batch-sharded-sampling, type: boolean, value: false, default: false, summary: "parallel_config.enable_batch_sharded_sampling: code default None (not requested); modeled as false", sources: ["vllm/config/parallel.py:191", "vllm/engine/arg_utils.py:549"], attributes: {key: enable_batch_sharded_sampling, none_is: false}}
  - {id: disable-hybrid-kv-cache-manager, type: boolean, value: null, default: null, summary: "disable_hybrid_kv_cache_manager: None lets VllmConfig decide per connector; read it with an `in config` guard", sources: ["vllm/config/scheduler.py:182", "vllm/engine/arg_utils.py:703"], attributes: {key: disable_hybrid_kv_cache_manager}}
  - {id: max-cudagraph-capture-size, type: integer, value: 0, default: 0, summary: "compilation_config.max_cudagraph_capture_size: None (0 here) lets VllmConfig derive it", sources: ["vllm/config/compilation.py:695", "vllm/config/vllm.py:2354-2363"], attributes: {key: max_cudagraph_capture_size, none_is: 0}}
  - {id: use-v2-model-runner, type: boolean, value: true, default: true, summary: "VllmConfig.use_v2_model_runner: VLLM_USE_V2_MODEL_RUNNER unset resolves to the V2 runner unless a feature it lacks is configured (Llama with default args: V2)", sources: ["vllm/config/vllm.py:703-739", "vllm/envs.py:2151-2153"], attributes: {key: use_v2_model_runner}}
  - {id: profiler, type: string, value: "", default: "", summary: "--profiler-config.profiler (torch, cuda, proton): None ('' here) means profiling is off", sources: ["vllm/config/profiler.py:70", "vllm/engine/arg_utils.py:764"], attributes: {key: profiler_config.profiler, none_is: ""}}
  - {id: weight-transfer-backend, type: string, value: "", default: "", summary: "weight_transfer_config.backend: None ('' here) means no weight transfer engine", sources: ["vllm/config/vllm.py:440", "vllm/engine/arg_utils.py:844"], attributes: {key: weight_transfer_config, none_is: ""}}
  - {id: watermark-enabled, type: boolean, value: false, default: false, summary: "watermark_config is set (forces the V2 runner)", sources: ["vllm/config/vllm.py:378", "vllm/config/vllm.py:712-718"], attributes: {key: watermark_config}}
  - {id: speculative-method, type: string, value: "", default: "", summary: "speculative_config.method: None ('' here) means no speculative decoding (no --speculative-config and the model is not a speculators checkpoint)", sources: ["vllm/config/speculative.py:399", "vllm/engine/arg_utils.py:714"], attributes: {key: speculative_config.method, none_is: ""}}
  - {id: num-speculative-tokens, type: integer, value: 0, default: 0, summary: "speculative_config.num_speculative_tokens; 0 without speculative decoding", sources: ["vllm/config/speculative.py:393"], attributes: {key: speculative_config.num_speculative_tokens, none_is: 0}}
  - {id: speculative-draft-architecture, type: string, value: "", default: "", summary: "speculative_config.draft_model_config.architectures[0]; '' without a draft", sources: ["vllm/v1/worker/gpu/spec_decode/__init__.py:27-44"], attributes: {key: speculative_config.draft_model_config.architectures, none_is: ""}}
  - {id: mtp-num-nextn-predict-layers, type: integer, value: 1, default: 1, summary: "draft hf_config.num_nextn_predict_layers (getattr default 1)", sources: ["vllm/config/speculative.py:1982-1988"], attributes: {key: num_nextn_predict_layers}}
  - {id: enable-adaptive-verification, type: boolean, value: false, default: false, summary: "speculative_config.enable_adaptive_verification", sources: ["vllm/config/speculative.py:551"], attributes: {key: speculative_config.enable_adaptive_verification}}
  - {id: vllm-batch-invariant, type: boolean, value: false, default: false, summary: "VLLM_BATCH_INVARIANT: batch-invariant kernels", sources: ["vllm/envs.py:636"], attributes: {key: VLLM_BATCH_INVARIANT}}
  - {id: vllm-lora-enable-dual-stream, type: boolean, value: false, default: false, summary: "VLLM_LORA_ENABLE_DUAL_STREAM: overlap LoRA with the base GEMM on a second stream", sources: ["vllm/envs.py:2259-2260"], attributes: {key: VLLM_LORA_ENABLE_DUAL_STREAM}}
  - {id: enable-expert-parallel, type: boolean, value: false, default: false, summary: "--enable-expert-parallel: shard MoE experts over the EP group", sources: ["vllm/config/parallel.py:182-205", "vllm/engine/arg_utils.py:548"], attributes: {key: enable_expert_parallel}}
  - {id: enable-eplb, type: boolean, value: false, default: false, summary: "--enable-eplb (parallel_config.enable_eplb): expert-parallel load balancing; needs expert parallelism, CUDA/ROCm/XPU and TP*PCP*DP > 1", sources: ["vllm/config/parallel.py:205", "vllm/engine/arg_utils.py:570", "vllm/config/parallel.py:559-580"], attributes: {key: enable_eplb}}
  - {id: structured-outputs-backend, type: string, value: auto, default: auto, summary: "--structured-outputs-config.backend: auto picks xgrammar or guidance per request", sources: ["vllm/config/structured_outputs.py:20"], attributes: {key: structured_outputs_config.backend}}
  - {id: optimization-level, type: integer, value: 2, default: 2, summary: "-O / optimization_level: O2 by default; selects the compilation pass defaults (fuse_act_quant etc.)", sources: ["vllm/config/vllm.py:427", "vllm/config/vllm.py:1779-1780"], attributes: {key: optimization_level}}
  - {id: vllm-object-storage-shm-buffer-name, type: string, value: null, default: null, summary: "VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME: unset, so the first read generates 'vllm_mm_' + an unpadded url-safe base64 UUID (30 chars) and stores it in os.environ", sources: ["vllm/envs.py:2040-2043", "vllm/envs.py:546-551"], attributes: {key: VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME, env: true}}
  - {id: vllm-ray-dp-placement-node-ips, type: string, value: "", default: "", summary: "VLLM_RAY_DP_PLACEMENT_NODE_IPS: comma-separated node IPs Ray DP placement groups may use; '' = no restriction", sources: ["vllm/envs.py:189", "vllm/envs.py:1549-1551"], attributes: {key: VLLM_RAY_DP_PLACEMENT_NODE_IPS, env: true}}
  - {id: generation-config, type: string, value: auto, default: auto, summary: "--generation-config: 'auto' takes sampling defaults from the model's generation_config.json, 'vllm' uses vLLM's neutral defaults, anything else is a directory holding a generation_config.json", sources: ["vllm/config/model.py:354", "vllm/engine/arg_utils.py:779"], attributes: {key: generation_config}}
  - {id: override-generation-config, type: object, value: {}, default: {}, summary: "--override-generation-config: keys that replace the generation config's values before the sampling defaults are picked", sources: ["vllm/config/model.py:361", "vllm/engine/arg_utils.py:787"], attributes: {key: override_generation_config}}
  - {id: hf-overrides, type: object, value: {}, default: {}, summary: "--hf-overrides: a dict patches keys of the target's HF config (it is not forwarded to a speculative draft); a callable transforms the config and is composed into the draft's override", sources: ["vllm/config/model.py:344", "vllm/engine/arg_utils.py:617"], attributes: {key: hf_overrides}}
  # Owned by attention (decision 7); boundary copy of its definition. ConfigEngineArgs.kv_cache_dtype feeds CacheConfig.cache_dtype.
  - {id: kv-cache-dtype, type: string, value: auto, default: auto, summary: "kv_cache_dtype / CacheConfig.cache_dtype (attention backends read it; no other fragment defines it)", sources: ["vllm/config/cache.py:122", "vllm/engine/arg_utils.py:500"], attributes: {key: cache_dtype, boundary: true, owner: attention}}
  # Owned by scheduler-kv (decision 7); boundary copy of its definition.
  - {id: async-scheduling, type: boolean, value: true, default: null, summary: "async_scheduling: AsyncScheduler overlaps the next schedule with the running step (output placeholders)", sources: ["vllm/config/scheduler.py:208", "vllm/config/vllm.py:1585-1644", "vllm/config/scheduler.py:229-233", "vllm/v1/core/sched/async_scheduler.py:25-57"], attributes: {boundary: true, owner: scheduler-kv, key: async_scheduling}}
  - {id: vllm-version, type: string, value: "0.32.0", default: dev, summary: "vllm.__version__ (from the generated _version.py; 'dev' when it is missing); leads VllmConfig.compute_hash's factors", sources: ["vllm/version.py:5", "vllm/version.py:11"], attributes: {key: __version__}}
  - {id: vllm-assets-cache, type: string, value: "~/.cache/vllm/assets", default: "~/.cache/vllm/assets", summary: "VLLM_ASSETS_CACHE: where downloaded test/example assets are cached (VLLM_CACHE_ROOT/assets)", sources: ["vllm/envs.py:71", "vllm/envs.py:960-965"], attributes: {key: VLLM_ASSETS_CACHE, env: true}}
  - {id: vllm-image-fetch-timeout-s, type: integer, value: 5, default: 5, summary: "VLLM_IMAGE_FETCH_TIMEOUT (seconds) for image and asset downloads", sources: ["vllm/envs.py:73", "vllm/envs.py:973"], attributes: {key: VLLM_IMAGE_FETCH_TIMEOUT, env: true}}
  # CLI arguments of the product's bench and snapshot entry points.
  - {id: probe-request-rate, type: number, value: 0.0, default: 0.0, summary: "vllm bench serve --probe-request-rate (req/s); 0 disables the probe loop", sources: ["vllm/benchmarks/serve.py:816", "vllm/benchmarks/serve.py:1719-1722"], attributes: {key: probe_request_rate}}
  - {id: release-timeout-s, type: number, value: 900.0, default: 900.0, summary: "snapshot server --release-timeout-s: how long the child waits for the release marker", sources: ["vllm/snapshot/server.py:76"], attributes: {key: release_timeout_s}}

components:
  # ---- EngineArgs and the config classes it builds ----
  - {id: engine-args, name: EngineArgs, kind: module, parent: control, layer: control, sources: ["vllm/engine/arg_utils.py:471"], summary: "Engine arguments (CLI flags) and their resolution into a VllmConfig.", attributes: {owner: config-platform}}
  - {id: model-config, name: ModelConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/model.py:151"], summary: "Model config: HF config fetch, max_model_len derivation, TP head checks, feature support.", attributes: {owner: config-platform}}
  - {id: cache-config, name: CacheConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/cache.py:69"], summary: "KV cache config: block size default, gpu_memory_utilization bounds.", attributes: {owner: config-platform}}
  - {id: parallel-config, name: ParallelConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/parallel.py:136"], summary: "Parallelism config: world size and executor backend selection.", attributes: {owner: config-platform}}
  - {id: scheduler-config, name: SchedulerConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/scheduler.py:25"], summary: "Scheduler limits and their validation against max_model_len.", attributes: {owner: config-platform}}
  - {id: speculative-config, name: SpeculativeConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/speculative.py:387"], summary: "Speculative decoding config (draft model checks).", attributes: {owner: config-platform}}
  - {id: observability-config, name: ObservabilityConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/observability.py:19-222"], summary: "Metrics and tracing config: custom histogram buckets, OTLP tracing.", attributes: {owner: config-platform}}
  - {id: multimodal-config, name: MultiModalConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/multimodal.py:301"], summary: "Multimodal config: encoder attention backend and dtype, processor device and kwargs, its own ViT hash.", attributes: {owner: config-platform}}
  - {id: device-config, name: DeviceConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/device.py:16-77"], summary: "Device config: 'auto' resolves to the current platform's device type.", attributes: {owner: config-platform}}
  - {id: kernel-config, name: KernelConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/kernel.py:400-423"], summary: "Kernel backend selection config and its compile-cache hash.", attributes: {owner: config-platform}}
  - {id: ir-op-priority-config, name: IrOpPriorityConfig, kind: module, parent: kernel-config, layer: control, sources: ["vllm/config/kernel.py:20-64"], summary: "Per-IR-op provider priority lists; their hash includes each provider implementation's uuid.", attributes: {owner: config-platform}}
  - {id: kv-transfer-config, name: KVTransferConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/kv_transfer.py:93-108"], summary: "KV transfer (disaggregated prefill) config; graph-neutral hash.", attributes: {owner: config-platform}}
  - {id: ec-transfer-config, name: ECTransferConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/ec_transfer.py:15-119"], summary: "Encoder-cache transfer (EPD) config: role validation and the encode-only test.", attributes: {owner: config-platform}}
  - {id: pooler-config, name: PoolerConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/pooler.py:186-201"], summary: "Pooling model config; graph-neutral hash.", attributes: {owner: config-platform}}
  - {id: config-utils, name: vllm.config.utils, kind: module, parent: control, layer: control, sources: ["vllm/config/utils.py:121-129"], summary: "Config helpers: replace() rebuilds a config with overrides, re-running its validation.", attributes: {owner: config-platform}}
  - {id: quantization-config-args, name: QuantizationConfigArgs, kind: module, parent: control, layer: control, sources: ["vllm/config/quantization.py:107-224"], summary: "User-facing online quantization config (--quantization-config): linear/moe specs, shorthand names, targets.", attributes: {owner: config-platform}}
  - {id: hisparse-config, name: HiSparseConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/attention.py:16-33"], summary: "HiSparse sparse-MLA KV offloading config (attention_config.hisparse_config).", attributes: {owner: config-platform}}
  - {id: mamba-config, name: MambaConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/mamba.py:11-30"], summary: "Mamba SSU backend selection (MambaBackendEnum).", attributes: {owner: config-platform}}
  - {id: aux-output-config, name: AuxOutputConfig, kind: module, parent: control, layer: control, sources: ["vllm/config/aux_output.py:11"], summary: "Auxiliary-output (routed experts) delivery config.", attributes: {owner: config-platform}}
  - id: vllm-config
    name: VllmConfig
    kind: module
    parent: control
    layer: control
    sources: ["vllm/config/vllm.py:341", "vllm/config/vllm.py:3421-3491"]
    summary: "The resolved VllmConfig (shared datum, owned here) and the current-config context other areas read it through."
    description: >-
      Tagged incidental: create_engine_config returns the config and writes no global
      (vllm/engine/arg_utils.py:2872); `resolved` is the model's hand-off record of that return value,
      and `current` is restored when the set_current_vllm_config context exits
      (vllm/config/vllm.py:3467-3469). Scenarios assert on the returned config and the read path.
    tags: [incidental]
    attributes: {owner: config-platform}
    state:
      schema:
        type: object
        properties:
          resolved: {type: [object, "null"], default: null}
          current: {type: [object, "null"], default: null}
      initial: {resolved: null, current: null}
  # ---- Platforms ----
  - id: platforms
    name: vllm.platforms
    kind: module
    parent: control
    layer: control
    sources: ["vllm/platforms/__init__.py:231-293"]
    summary: "Platform detection: built-in and out-of-tree platform plugins, the lazily resolved current_platform."
    tags: [cache]
    attributes: {owner: config-platform}
    description: >-
      State `host` holds what the probes observe on the machine (NVML GPU count, libtpu, amdsmi,
      torch.xpu, the installed vLLM version string, sys.platform) and what NVML reports for
      device 0. The default host is one NVIDIA H100 80GB (the tp1-llama-8b world: its
      device_total_memory equals gpu-memory@rank0.total_bytes). `current` caches the resolved
      platform (the module global _current_platform).
    state:
      schema:
        type: object
        properties:
          host: {type: object}
          current: {type: [object, "null"], default: null}
      initial:
        current: null
        host:
          nvml_available: true
          nvml_gpu_count: 1
          jetson: false
          libtpu_installed: false
          amdsmi_gpus: 0
          in_wsl: false
          torch_hip: false
          xpu_available: false
          vllm_version: "0.32.0"
          sys_platform: linux
          amd_zen_avx512: false
          zentorch_installed: false
          device_name: "NVIDIA H100 80GB HBM3"
          device_total_memory: 85899345920
          device_count: 1
          tpu_chip: ""
          cpu_architecture: X86
  - {id: cuda-platform, name: CudaPlatform, kind: module, parent: platforms, layer: control, sources: ["vllm/platforms/cuda.py:224", "vllm/platforms/cuda.py:1044"], summary: "The CUDA platform (NvmlCudaPlatform when NVML loads).", attributes: {owner: config-platform}, state: {schema: {type: object, properties: {device_capability: {type: object}, nvml_error: {type: boolean}, backend_cls_paths: {type: object}}}, initial: {nvml_error: false, device_capability: {major: 9, minor: 0}, backend_cls_paths: {FLASH_ATTN: vllm.v1.attention.backends.flash_attn.FlashAttentionBackend, TRITON_ATTN: vllm.v1.attention.backends.triton_attn.TritonAttentionBackend, TRITON_FLASH_ATTN: vllm.v1.attention.backends.triton_flash_attn.TritonFlashAttentionBackend, FLASHINFER: vllm.v1.attention.backends.flashinfer.FlashInferBackend, TRITON_FLASHINFER: vllm.v1.attention.backends.triton_flashinfer.TritonFlashInferBackend, FLEX_ATTENTION: vllm.v1.attention.backends.flex_attention.FlexAttentionBackend, TURBOQUANT: vllm.v1.attention.backends.turboquant_attn.TurboQuantAttentionBackend, FLASH_ATTN_MLA: vllm.v1.attention.backends.mla.flashattn_mla.FlashAttnMLABackend, FLASHMLA: vllm.v1.attention.backends.mla.flashmla.FlashMLABackend, FLASHINFER_MLA: vllm.v1.attention.backends.mla.flashinfer_mla.FlashInferMLABackend, TRITON_MLA: vllm.v1.attention.backends.mla.triton_mla.TritonMLABackend, CUTLASS_MLA: vllm.v1.attention.backends.mla.cutlass_mla.CutlassMLABackend}}}}
