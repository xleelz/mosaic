  # ---------------- plugins ----------------
  - id: config-general-plugins-once
    name: "Write then read: general plugins load once per process"
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: config-general-plugins, as: first}
      - {flow: config-general-plugins, as: second}
    expect:
      # the write is the scenario's point: state is the only place the guard / export is visible
      - "state.plugins.plugins_loaded"
      - "steps.first.result.ok && steps.first.result.value.loaded == ['lora_filesystem_resolver', 'lora_hf_hub_resolver']"
      # internal path is the point: the plugins_loaded guard skips the second discovery
      - "steps.second.result.value.already_loaded && calls['plugins.load-plugins-by-group'] == 1"
      - "calls['lora-resolver-registry.register-resolver'] == 0"
  - id: config-general-plugins-then-engine-args
    name: "Write then read: plugins loaded at startup are not reloaded by a later EngineArgs.__post_init__ in the same process"
    fixtures: [tp1-llama-8b]
