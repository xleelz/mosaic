  - component: rocm-platform
    name: device-count
    kind: function
    summary: "RocmPlatform.device_count: _rocm_device_count_stateless(CUDA_VISIBLE_DEVICES): 0 without a ROCm torch build, else amdsmi's GPU count inside an amdsmi_init/shut_down context, cut to the visible devices."
    sources: ["vllm/platforms/rocm.py:1268-1270", "vllm/platforms/rocm.py:97-130"]
    request: {type: object, properties: {visible_devices: {type: [string, "null"], default: null}}}
