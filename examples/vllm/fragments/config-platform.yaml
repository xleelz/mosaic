      - {flow: config-create-engine-config, as: follow, input: {model: Qwen/Qwen3-1.7B-FP8, tensor_parallel_size: 2, speculative_config: {model: Qwen/Qwen3-0.6B, method: draft_model, num_speculative_tokens: 3}}}
      - {flow: config-create-engine-config, as: bad, input: {model: Qwen/Qwen3-1.7B-FP8, tensor_parallel_size: 2, speculative_config: {model: Qwen/Qwen3-0.6B, method: draft_model, num_speculative_tokens: 3, draft_tensor_parallel_size: 3}}}
