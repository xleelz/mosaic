      - {interface: video-asset.get, caller: operator, as: many, input: {name: baby_reading, num_frames: 5, view: np_ndarrays}}
    expect:
      - "steps.frames.result.ok && steps.frames.result.value.frames_indices == [0]"
      - "!steps.many.result.ok && steps.many.result.error.message.contains('expected 5 frames, got 3')"
      - "state['local-disk'].paths[config['vllm-assets-cache'] + '/video-example-data/sample_demo_1.mp4'].exists"
  - id: config-hisparse-through-engine-args
    name: "--attention-config with a HiSparse config: its bounds are validated, then the VllmConfig checks it (Llama has no index_topk)"
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: config-create-engine-config, as: bad, input: {hisparse_config: {device_buffer_size: 0}}}
      - {flow: config-create-engine-config, as: llama, input: {hisparse_config: {device_buffer_size: 4096}}}
    expect:
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'validation-error'"
      - "!steps.llama.result.ok && steps.llama.result.error.message == 'HiSparse is only supported for DSA models with index_topk.'"

  - id: config-mla-prefill-backend-selection
    name: "MLA prefill backend: FLASH_ATTN on SM90; on SM100 TRTLLM_RAGGED leads for the 192/64/256 head layout; no capability falls back to FLASH_ATTN; nothing valid is a ValueError"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: cuda-platform.get-mla-prefill-backend-cls, caller: operator, as: sm90, input: {dtype: bfloat16, mla_dimensions: [128, 64, 128]}}
      - {interface: cuda-platform.get-mla-prefill-backend-cls, caller: operator, as: sm90fp32, input: {dtype: float32, mla_dimensions: [128, 64, 128]}}
    expect:
      - "steps.sm90.result.ok && steps.sm90.result.value.backend == 'FLASH_ATTN'"
      - "!steps.sm90fp32.result.ok && steps.sm90fp32.result.error.code == 'value-error' && steps.sm90fp32.result.error.message.contains('FLASH_ATTN: [')"
  - id: config-mla-prefill-backend-blackwell
    name: "SM100: the 192/64/256 layout prefers TRTLLM_RAGGED, other layouts FLASH_ATTN; an override path nothing can import counts as ImportError"
    fixtures: [full-tp1-llama-8b]
    state:
      cuda-platform: {device_capability: {major: 10, minor: 0}}
      mla-prefill-backend-enum: {overrides: {TOKENSPEED_MLA: acme.missing.TokenSpeedBackend}}
    steps:
      - {interface: cuda-platform.get-mla-prefill-backend-cls, caller: operator, as: ds, input: {dtype: bfloat16, mla_dimensions: [192, 64, 256]}}
      - {interface: cuda-platform.get-mla-prefill-backend-cls, caller: operator, as: noimport, input: {dtype: float32, mla_dimensions: [192, 64, 256]}}
      - {interface: cuda-platform.get-mla-prefill-backend-cls, caller: operator, as: other, input: {dtype: bfloat16, mla_dimensions: [128, 64, 128]}}
    expect:
      - "steps.ds.result.ok && steps.other.result.ok"
      - "steps.ds.result.value.backend == 'TRTLLM_RAGGED'"
      - "steps.other.result.value.backend == 'FLASH_ATTN'"
      - "!steps.noimport.result.ok && steps.noimport.result.error.message.contains('TOKENSPEED_MLA: [ImportError]')"
  - id: config-mla-prefill-backend-no-capability
    name: "NVML can't report a capability: FLASH_ATTN without validation"
    fixtures: [full-tp1-llama-8b]
    state:
      cuda-platform: {nvml_error: true}
    steps:
      - {interface: cuda-platform.get-mla-prefill-backend-cls, caller: operator, as: none, input: {dtype: bfloat16}}
    expect:
      - "steps.none.result.value.backend == 'FLASH_ATTN' && calls['mla-prefill-backend.validate-configuration'] == 0"
  - id: config-mla-prefill-backend-cpu
    name: "CPU platform: ZEN_CPU when it imports and is available, else CPU; neither is a ValueError"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: cpu-platform.get-mla-prefill-backend-cls, caller: operator, as: dflt, input: {dtype: float32}}
    expect:
      - "steps.dflt.result.ok && steps.dflt.result.value.backend in ['ZEN_CPU', 'CPU']"
  - id: config-mla-prefill-backend-cpu-fallbacks
    name: "CPU platform: an unimportable ZEN_CPU falls back to CPU; with neither importable, ValueError"
    fixtures: [full-tp1-llama-8b]
    state:
      mla-prefill-backend-enum: {overrides: {ZEN_CPU: acme.missing.ZenBackend}}
    steps:
      - {interface: cpu-platform.get-mla-prefill-backend-cls, caller: operator, as: cpu, input: {dtype: float32}}
    expect:
      - "steps.cpu.result.value.backend == 'CPU'"
  - id: config-mla-prefill-backend-cpu-none
    name: "CPU platform: neither ZEN_CPU nor CPU importable is a ValueError"
    fixtures: [full-tp1-llama-8b]
    state:
      mla-prefill-backend-enum: {overrides: {ZEN_CPU: acme.missing.ZenBackend, CPU: acme.missing.CpuBackend}}
    steps:
      - {interface: cpu-platform.get-mla-prefill-backend-cls, caller: operator, as: none, input: {dtype: float32}}
    expect:
      - "!steps.none.result.ok && steps.none.result.error.message == 'No valid CPU MLA prefill backend found.'"
  # ---------------- round 5: the model-type worlds ----------------
  - id: config-moe-mixtral-resolve
    flow: config-create-engine-config
    name: "MoE world: vllm serve resolves Mixtral at TP 2 with expert parallelism: is_moe with 8 experts, 2 per token, ParallelConfig.is_moe_model, world 2 on mp, no all2all without DP"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep, config-platform-moe-host]
    expect:
      - "result.ok && result.value.model_config.model == 'mistralai/Mixtral-8x7B-Instruct-v0.1' && result.value.model_config.architectures == ['MixtralForCausalLM']"
      - "result.value.model_config.is_moe && result.value.model_config.num_experts == 8 && result.value.model_config.num_experts_per_tok == 2"
      - "result.value.model_config.max_model_len == config['max-model-len'] && result.value.model_config.max_model_len == 32768"
      - "result.value.parallel_config.world_size == 2 && result.value.parallel_config.distributed_executor_backend == 'mp'"
      - "result.value.parallel_config.enable_expert_parallel && result.value.parallel_config.is_moe_model == true"
      - "!result.value.parallel_config.use_all2all && !result.value.parallel_config.use_sequence_parallel_moe && result.value.parallel_config.all2all_backend == 'allgather_reducescatter'"
      - "!result.value.needs_dp_coordinator && result.value.quant_config == null && result.value.model_config.multimodal_config == null"
  - id: config-moe-mixtral-one-gpu-host
    flow: config-create-engine-config
    name: "MoE world without its host variant: config-platform-seed's one-GPU host refuses TP 2 before any worker starts"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    state: {platforms: {host: {device_count: 1, nvml_gpu_count: 1}}}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.startsWith('World size (2) is larger than the number of available GPUs (1) in this node. If this is intentional and you are using:\\n- ray, set ')"
  - id: config-moe-mixtral-dp-ep
    flow: config-create-engine-config
    name: "MoE at DP 2 x TP 2 with EP: all2all and sequence-parallel MoE are on, and the DP coordinator is needed for wave coordination"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep, config-platform-moe-host]
    input: {data_parallel_size: 2}
    expect:
      - "result.ok && result.value.parallel_config.use_all2all && result.value.parallel_config.use_sequence_parallel_moe"
      - "result.value.needs_dp_coordinator && result.value.model_config.is_moe"
  - id: config-moe-mixtral-max-model-len-message
    flow: config-create-engine-config
    name: "Mixtral --max-model-len 40000: the derived length prints as a float because the config has RoPE parameters (rope_theta)"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep, config-platform-moe-host]
    input: {max_model_len: 40000}
    expect:
      - "!result.ok && result.error.message.startsWith(\"User-specified max_model_len (40000) is greater than the derived max_model_len (max_position_embeddings=32768.0 or model_max_length=None in model's config.json). To allow overriding this maximum, set the env var VLLM_ALLOW_LONG_MAX_MODEL_LEN=1. VLLM_ALLOW_LONG_MAX_MODEL_LEN must be used with extreme caution.\")"
  - id: config-vl-qwen2-resolve
    flow: config-create-engine-config
    name: "VL world: Qwen2-VL's vision_config makes ModelConfig build a MultiModalConfig (is_multimodal_model); M-RoPE (legacy type mrope) does not scale the 32768 length; not MoE"
    fixtures: [full-vl-qwen2-vl-7b]
    expect:
      - "result.ok && result.value.model_config.multimodal_config != null && result.value.model_config.is_multimodal_model"
      - "result.value.model_config.multimodal_config.mm_tensor_ipc == 'direct_rpc' && !result.value.model_config.multimodal_config.language_model_only"
      - "result.value.model_config.vision_config.patch_size == 14 && result.value.model_config.vision_config.spatial_merge_size == 2"
      - "result.value.model_config.max_model_len == 32768 && !result.value.model_config.is_moe && result.value.model_config.num_experts == 0"
      - "result.value.model_config.architectures == ['Qwen2VLForConditionalGeneration'] && result.value.model_config.total_num_kv_heads == 4"
  - id: config-vl-qwen2-language-model-only
    flow: config-create-engine-config
    name: "VL world with --language-model-only: the MultiModalConfig is still built, marked language_model_only"
    fixtures: [full-vl-qwen2-vl-7b]
    input: {language_model_only: true}
    expect:
      - "result.ok && result.value.model_config.is_multimodal_model && result.value.model_config.multimodal_config.language_model_only"
  - id: config-fp8-resolve
    flow: config-create-engine-config
    name: "FP8 world: the checkpoint's quant_method fp8 becomes ModelConfig.quantization; on SM 9.0 the Fp8Config (min capability 75) is built with the static activation scheme and lm_head unquantized; the KV cache stays auto"
    fixtures: [full-fp8-llama-3-8b]
    expect:
      - "result.ok && result.value.model_config.quantization == 'fp8' && result.value.model_config.max_model_len == 8192"
      - "result.value.quant_config.quant_method == 'fp8' && result.value.quant_config.min_capability == 75 && result.value.quant_config.is_checkpoint_fp8_serialized"
      - "result.value.quant_config.activation_scheme == 'static' && result.value.quant_config.ignored_layers == ['lm_head'] && result.value.quant_config.weight_block_size == null"
      - "result.value.cache_config.cache_dtype == 'auto' && result.value.cache_config.cache_dtype == config['kv-cache-dtype'] && !has(ctx.cache_dtype_info)"
      - "!result.value.model_config.is_nvfp4_quantized && result.value.model_config.dtype == 'bfloat16'"
  - id: config-fp8-kv-cache-fp8
    flow: config-create-engine-config
    name: "FP8 world with --kv-cache-dtype fp8: CacheConfig keeps fp8 and its validator logs the accuracy note (scales or not)"
    fixtures: [full-fp8-llama-3-8b-kv-fp8]
    expect:
      - "result.ok && result.value.cache_config.cache_dtype == 'fp8' && config['kv-cache-dtype'] == 'fp8'"
      - "ctx.cache_dtype_info == 'Using fp8 data type to store kv cache. It reduces the GPU memory footprint and boosts the performance. Meanwhile, it may cause accuracy drop without a proper scaling factor'"
  - id: config-kv-cache-dtype-variants
    name: "CacheConfig.cache_dtype: per-token-head dtypes log runtime scales, bfloat16 logs nothing, an unknown dtype is a pydantic literal error"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: cache-config.apply-block-size-default, caller: operator, as: pth, input: {block_size: null, gpu_memory_utilization: 0.9, enable_prefix_caching: true, cache_dtype: int8_per_token_head}}
      - {interface: cache-config.apply-block-size-default, caller: operator, as: bf16, input: {block_size: null, gpu_memory_utilization: 0.9, enable_prefix_caching: true, cache_dtype: bfloat16}}
      - {interface: cache-config.apply-block-size-default, caller: operator, as: bad, input: {block_size: null, gpu_memory_utilization: 0.9, enable_prefix_caching: true, cache_dtype: fp9}}
    expect:
      - "steps.pth.result.ok && steps.pth.result.value.cache_dtype == 'int8_per_token_head' && ctx.cache_dtype_info.endsWith('Dynamic per-token-head scales will be computed at runtime.')"
      - "steps.bf16.result.ok && steps.bf16.result.value.cache_dtype == 'bfloat16'"
      - "!steps.bad.result.ok && steps.bad.result.error.code == 'validation-error' && steps.bad.result.error.message.startsWith('1 validation error for CacheConfig\\ncache_dtype\\n  Input should be ') && steps.bad.result.error.message.endsWith(\"[type=literal_error, input_value='fp9', input_type=str]\")"
  - id: config-fp8-capability-too-low
    flow: config-create-engine-config
    name: "FP8 checkpoint on a V100 (SM 7.0): below Fp8Config's minimum capability 75, refused; SM 7.5 is enough"
    fixtures: [full-fp8-llama-3-8b]
    state: {cuda-platform: {device_capability: {major: 7, minor: 0}}}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message == 'The quantization method fp8 is not supported for the current GPU. Minimum capability: 75. Current capability: 70.'"
  - id: config-fp8-capability-turing
    flow: config-create-engine-config
    name: "FP8 checkpoint on SM 7.5 passes the capability check"
    fixtures: [full-fp8-llama-3-8b]
    state: {cuda-platform: {device_capability: {major: 7, minor: 5}}}
    expect:
      - "result.ok && result.value.quant_config.quant_method == 'fp8'"
  - id: config-fp8-config-refusals
    name: "Fp8Config from a checkpoint: activation_scheme is required and must be static or dynamic; a block size needs 2 dims and dynamic activations; float32 isn't an FP8 activation dtype"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: vllm-config.get-quantization-config, caller: operator, as: noact, input: {quantization: fp8, quantization_config: {quant_method: fp8}, dtype: bfloat16, device_type: cuda}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: badact, input: {quantization: fp8, quantization_config: {quant_method: fp8, activation_scheme: weird}, dtype: bfloat16, device_type: cuda}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: dims, input: {quantization: fp8, quantization_config: {quant_method: fp8, activation_scheme: dynamic, weight_block_size: [128]}, dtype: bfloat16, device_type: cuda}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: staticblock, input: {quantization: fp8, quantization_config: {quant_method: fp8, activation_scheme: static, weight_block_size: [128, 128]}, dtype: bfloat16, device_type: cuda}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: f32, input: {quantization: fp8, quantization_config: {quant_method: fp8, activation_scheme: dynamic}, dtype: float32, device_type: cuda}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: block, input: {quantization: fp8, quantization_config: {quant_method: fp8, activation_scheme: dynamic, weight_block_size: [128, 128], modules_to_not_convert: [lm_head]}, dtype: bfloat16, device_type: cuda}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: none, input: {quantization: null, quantization_config: null, dtype: bfloat16, device_type: cuda}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: cpu, input: {quantization: awq, quantization_config: {quant_method: awq}, dtype: bfloat16, device_type: cpu}}
    expect:
      - "steps.noact.result.error.message == \"Cannot find any of ['activation_scheme'] in the model's quantization config.\""
      - "steps.badact.result.error.message == 'Unsupported activation scheme weird'"
      - "steps.dims.result.error.message == 'The quantization block size of weight must have 2 dimensions, but got 1 dimensions'"
      - "steps.staticblock.result.error.message == 'The block-wise quantization only supports dynamic activation scheme for now, but got static activation scheme.'"
      - "steps.f32.result.error.message == 'torch.float32 is not supported for quantization method fp8. Supported dtypes: [torch.bfloat16, torch.float16]'"
      - "steps.block.result.ok && steps.block.result.value.weight_block_size == [128, 128] && steps.block.result.value.ignored_layers == ['lm_head']"
      - "steps.none.result.ok && steps.none.result.value == null"
      - "steps.cpu.result.ok && steps.cpu.result.value.quant_method == 'awq' && calls['cuda-platform.get-device-capability'] == 6"
  - id: config-max-concurrent-batches
    name: "max_concurrent_batches: async on the V2 runner gives PP + 1, async on V1 gives 2 without PP, sync gives PP"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: vllm-config.max-concurrent-batches, caller: operator, as: v2pp4, input: {pipeline_parallel_size: 4, async_scheduling: true, use_v2_model_runner: true}}
      - {interface: vllm-config.max-concurrent-batches, caller: operator, as: v2pp1, input: {pipeline_parallel_size: 1, async_scheduling: true, use_v2_model_runner: true}}
      - {interface: vllm-config.max-concurrent-batches, caller: operator, as: v1pp1, input: {pipeline_parallel_size: 1, async_scheduling: true, use_v2_model_runner: false}}
      - {interface: vllm-config.max-concurrent-batches, caller: operator, as: v1pp4, input: {pipeline_parallel_size: 4, async_scheduling: true, use_v2_model_runner: false}}
      - {interface: vllm-config.max-concurrent-batches, caller: operator, as: syncpp4, input: {pipeline_parallel_size: 4, async_scheduling: false, use_v2_model_runner: true}}
      - {flow: config-create-engine-config, as: serve}
    expect:
      - "steps.v2pp4.result.value.max_concurrent_batches == 5 && steps.v2pp1.result.value.max_concurrent_batches == 2"
      - "steps.v1pp1.result.value.max_concurrent_batches == 2 && steps.v1pp4.result.value.max_concurrent_batches == 4 && steps.syncpp4.result.value.max_concurrent_batches == 4"
      - "steps.serve.result.ok && steps.serve.result.value.max_concurrent_batches == 2"
  # ---------------- round 5: judge3 / oracle3 regressions ----------------
  - id: config-max-model-len-message-exact
    flow: config-create-engine-config
    name: "Judge L3-4(a): Llama-3.1 --max-model-len 200000: the ValueError names max_position_embeddings=131072.0 (a float after the RoPE factor loop), model_max_length=None, and ends with the caution text"
    fixtures: [tp1-llama-8b]
    input: {max_model_len: 200000}
    expect:
      - "!result.ok && result.error.message == \"User-specified max_model_len (200000) is greater than the derived max_model_len (max_position_embeddings=131072.0 or model_max_length=None in model's config.json). To allow overriding this maximum, set the env var VLLM_ALLOW_LONG_MAX_MODEL_LEN=1. VLLM_ALLOW_LONG_MAX_MODEL_LEN must be used with extreme caution. If the model uses relative position encoding (RoPE), positions exceeding derived_max_model_len lead to nan. If the model uses absolute position encoding, positions exceeding derived_max_model_len will cause a CUDA array out-of-bounds error.\""
  - id: config-max-model-len-long-allowed-warning
    flow: config-create-engine-config
    name: "VLLM_ALLOW_LONG_MAX_MODEL_LEN=1: the same text and the caution are logged as a warning, and 200000 is kept"
    fixtures: [tp1-llama-8b]
    config: {vllm-allow-long-max-model-len: true}
    input: {max_model_len: 200000}
    expect:
      - "result.ok && result.value.model_config.max_model_len == 200000"
      - "ctx.long_max_model_len_warning_text.startsWith('User-specified max_model_len (200000) is greater than the derived') && ctx.long_max_model_len_warning_text.endsWith('will cause a CUDA array out-of-bounds error.')"
  - id: config-max-model-len-human-readable
    name: "Judge L3-4(c): --max-model-len takes human_readable_int_or_auto: 128K = 131072, 128k = 128000, auto = -1 (derived), 1.5K and 12q are argparse errors"
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: config-create-engine-config, as: k2, input: {max_model_len: "128K"}}
      - {flow: config-create-engine-config, as: k10, input: {max_model_len: "128k"}}
      - {flow: config-create-engine-config, as: auto, input: {max_model_len: "auto"}}
      - {flow: config-create-engine-config, as: dec, input: {max_model_len: "1.5K"}}
      - {flow: config-create-engine-config, as: junk, input: {max_model_len: "12q"}}
      - {interface: engine-args.add-cli-args, caller: operator, as: tok, input: {name: max_num_batched_tokens, value: "1.5k"}}
    expect:
      - "steps.k2.result.ok && steps.k2.result.value.model_config.max_model_len == 131072"
      - "steps.k10.result.ok && steps.k10.result.value.model_config.max_model_len == 128000"
      - "steps.auto.result.ok && steps.auto.result.value.model_config.max_model_len == 131072"
      - "!steps.dec.result.ok && steps.dec.result.error.code == 'system-exit' && steps.dec.result.error.message == 'argument --max-model-len: Decimals are not allowed with binary suffixes like K. Did you mean to use 1.5k instead?'"
      - "!steps.junk.result.ok && steps.junk.result.error.message == \"argument --max-model-len: invalid human_readable_int_or_auto value: '12q'\""
      - "steps.tok.result.value.value == 1500"
  - id: config-generation-config-defaults
    name: "Judge L3-8(a): Llama-3.1's generation_config.json gives temperature 0.6 and top_p 0.9, logged as an override; --generation-config vllm reads nothing; a model without the file gives {}"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: model-config.get-diff-sampling-param, caller: operator, as: auto, input: {}}
    expect:
      - "steps.auto.result.ok && steps.auto.result.value == {'temperature': 0.6, 'top_p': 0.9}"
      - "ctx.generation_config_override_warning && ctx.generation_config_override_warning_text == \"Default vLLM sampling parameters have been overridden by the model's `generation_config.json`: `{'temperature': 0.6, 'top_p': 0.9}`. If this is not intended, please relaunch vLLM instance with `--generation-config vllm`.\""
  - id: config-generation-config-vllm-and-overrides
    name: "--generation-config vllm: no file read, only --override-generation-config counts, max_new_tokens becomes max_tokens, and nothing is logged"
    fixtures: [full-tp1-llama-8b]
    config: {generation-config: vllm, override-generation-config: {max_new_tokens: 64, top_k: 20, do_sample: true}}
    steps:
      - {interface: model-config.get-diff-sampling-param, caller: operator, as: v, input: {}}
    expect:
      - "steps.v.result.ok && steps.v.result.value == {'top_k': 20, 'max_tokens': 64}"
      - "calls['hf-hub.download-generation-config'] == 0 && !has(ctx.generation_config_override_warning)"
  - id: config-generation-config-missing-file
    name: "A model without generation_config.json (Qwen2-VL here) has no sampling diff and logs nothing"
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {interface: model-config.get-diff-sampling-param, caller: operator, as: m, input: {}}
    expect:
      - "steps.m.result.ok && steps.m.result.value == {} && !has(ctx.generation_config_override_warning)"
  - id: config-draft-hf-overrides
    name: "oracle3 test_dict_overrides_are_not_forwarded_to_draft: a dict or None target hf_overrides gives the draft only hf_config_override; a callable is composed"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: speculative-config.compose-draft-hf-overrides, caller: operator, as: dict, input: {target_hf_overrides: {max_position_embeddings: 1234}}}
      - {interface: speculative-config.compose-draft-hf-overrides, caller: operator, as: none, input: {target_hf_overrides: null}}
      - {interface: speculative-config.compose-draft-hf-overrides, caller: operator, as: fn, input: {target_hf_overrides: tests.shrink_layers}}
    expect:
      - "steps.dict.result.ok && steps.dict.result.value.override == 'SpeculativeConfig.hf_config_override' && steps.dict.result.value.composes == null"
      - "steps.none.result.value.override == 'SpeculativeConfig.hf_config_override'"
      - "steps.fn.result.value.override == 'functools.partial(SpeculativeConfig._apply_composed_hf_override, tests.shrink_layers)' && steps.fn.result.value.composes == 'tests.shrink_layers'"
  - id: config-draft-hf-overrides-through-engine-args
    flow: config-create-engine-config
    name: "--hf-overrides '{\"max_position_embeddings\": 1234}' patches the target (max_model_len 1234) but not the draft model, whose own 40960 stays"
    fixtures: [tp1-llama-8b]
    config: {hf-overrides: {max_position_embeddings: 1234}}
    state:
      hf-hub:
        models:
          Qwen/Qwen3-0.6B: {architectures: [Qwen3ForCausalLM], model_type: qwen3, num_attention_heads: 16, num_key_value_heads: 8, max_position_embeddings: 40960}
    input: {speculative_config: {model: Qwen/Qwen3-0.6B, method: draft_model, num_speculative_tokens: 3}}
    expect:
      - "result.ok && result.value.model_config.max_model_len == 1234 && result.value.model_config.hf_overrides == {'max_position_embeddings': 1234}"
      - "result.value.speculative_config.draft_hf_overrides == 'SpeculativeConfig.hf_config_override' && result.value.speculative_config.draft_max_position_embeddings == 40960"
  - id: config-observability-omitted-fields
    name: "oracle3 test_custom_histogram_buckets_default_none (minor): an omitted custom_histogram_buckets is None, not an abort"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: observability-config.init, caller: operator, as: obs, input: {custom_histogram_buckets: {$absent: true}, otlp_traces_endpoint: {$absent: true}}}
    expect:
      - "steps.obs.result.ok && steps.obs.result.value.custom_histogram_buckets == null"
  - id: config-general-plugins-register-model
    flow: config-general-plugins
    name: "oracle3 side finding (test_distributed_oot): a general plugin that registers an out-of-tree architecture calls ModelRegistry.register_model with its arguments"
    fixtures: [full-tp1-llama-8b]
    state:
      plugins:
        entry_points:
          vllm.general_plugins:
            register_dummy_model: {value: "vllm_add_dummy_model:register", target: model-registry.register-model, loads: true, input: {model_arch: MyOPTForCausalLM, model_cls: "vllm_add_dummy_model.my_opt:MyOPTForCausalLM"}}
    expect:
      - "result.ok && 'register_dummy_model' in result.value.loaded"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'model-registry.register-model' && e.input.model_arch == 'MyOPTForCausalLM' && e.input.model_cls == 'vllm_add_dummy_model.my_opt:MyOPTForCausalLM')"
