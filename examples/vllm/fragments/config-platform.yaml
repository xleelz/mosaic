        source: "vllm/assets/audio.py:31"
        return: {path: "= vars.p.value.path", sample_rate: "= has(vars.p.value.meta.sample_rate) ? vars.p.value.meta.sample_rate : 0"}
  - component: video-asset
    name: get
    kind: function
    summary: "VideoAsset(name, num_frames): download_video_asset fetches the file from the raushan-testing-hf/videos-test dataset once into <assets>/video-example-data; np_ndarrays decodes num_frames evenly spaced frames (all when -1) and metadata reports them."
    sources: ["vllm/assets/video.py:110-147", "vllm/assets/video.py:18-39"]
    attributes: {racy_in_code: "vllm/assets/video.py:32 checks video_path.exists(), vllm/assets/video.py:33-38 downloads into the cache directory unconditionally, with no lock across processes"}
    request:
      type: object
      required: [name]
      properties:
        name: {type: string, enum: [baby_reading]}
        num_frames: {type: integer, default: -1}
        view: {type: string, enum: [np_ndarrays, metadata], default: metadata}
    response: {type: object}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: not_found, status: 404, retryable: false}
    behavior:
      - title: "_NAME_TO_FILE: baby_reading -> sample_demo_1.mp4"
        source: "vllm/assets/video.py:114-120"
        set:
          vars.file: "= {'baby_reading': 'sample_demo_1.mp4'}[input.name]"
          vars.path: "= config['vllm-assets-cache'] + '/video-example-data/' + {'baby_reading': 'sample_demo_1.mp4'}[input.name]"
          vars.nf: "= has(input.num_frames) ? input.num_frames : -1"
      - title: "video_path.exists()"
        source: "vllm/assets/video.py:30-32"
        call: local-disk.stat
        input: {path: "= vars.path"}
        as: st
      - title: "hf_hub_download(repo_id='raushan-testing-hf/videos-test', filename, repo_type='dataset') into the cache directory"
        source: "vllm/assets/video.py:33-38"
        if: "!vars.st.value.exists"
        then:
          - call: hf-hub.download-dataset-file
            input: {repo_id: raushan-testing-hf/videos-test, filename: "= vars.file"}
            as: dl
          - call: local-disk.put-path
            input: {path: "= vars.path", exists: true, is_dir: false, size: "= vars.dl.value.size", meta: "= vars.dl.value"}
          - set: {vars.info: "= vars.dl.value"}
        else:
          - set: {vars.info: "= vars.st.value.meta"}
      - title: "cv2.VideoCapture: total frames and fps"
        source: "vllm/assets/video.py:79-88"
        set:
          vars.total: "= vars.info.frame_count"
          vars.fps: "= double(vars.info.fps)"
      - title: "num_frames -1 (or above the total) means every frame; _sample_frame_indices = linspace(0, total-1, n)"
        source: "vllm/assets/video.py:18-19"
        set:
          vars.n: "= vars.nf <= 0 || vars.nf > vars.total ? vars.total : vars.nf"
      - set:
          vars.idx: "= vars.n == 1 ? [0] : lists.range(vars.n).map(i, int(double(i) * double(vars.total - 1) / double(vars.n - 1)))"
      - title: "VideoAsset.metadata: total_num_frames, fps, duration, opencv backend, frame indices, do_sample_frames"
        source: "vllm/assets/video.py:137-140"
        if: "!has(input.view) || input.view == 'metadata'"
        then:
          - source: "vllm/assets/video.py:90-104"
            return: {total_num_frames: "= vars.n", fps: "= vars.fps", duration: "= vars.fps > 0.0 ? double(vars.total) / vars.fps : 0.0", video_backend: opencv, frames_indices: "= vars.idx", do_sample_frames: "= vars.n == vars.total"}
      - title: "VideoAsset.np_ndarrays: video_to_ndarrays decodes the sampled frames (RGB); fewer readable frames than asked is a ValueError"
        source: "vllm/assets/video.py:132-135"
        if: "vars.info.readable_frames < vars.n"
        then:
          - source: "vllm/assets/video.py:66-71"
            fail: {code: value-error, status: 0, message: "= 'Could not read enough frames from video file ' + vars.path + ' (expected ' + string(vars.n) + ' frames, got ' + string(vars.info.readable_frames) + ')'"}
      - source: "vllm/assets/video.py:42-71"
        return: {shape: "= [vars.n, vars.info.height, vars.info.width, 3]", frames_indices: "= vars.idx"}
  - component: hf-hub
    name: download-dataset-file
    kind: http
    summary: "hf_hub_download of a file from a dataset repo (shared infrastructure). Rows of `dataset_files` are keyed '<repo_id>/<filename>'."
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [repo_id, filename], properties: {repo_id: {type: string}, filename: {type: string}}}
    response: {type: object, properties: {size: {type: integer}, frame_count: {type: integer}, fps: {type: number}, width: {type: integer}, height: {type: integer}, readable_frames: {type: integer}}}
    errors: [{code: not_found, status: 404, retryable: false}]
    store: {table: dataset_files, op: get, key: "= input.repo_id + '/' + input.filename", not_found: not_found}

  - component: cuda-platform
    name: get-mla-prefill-backend-cls
    kind: function
    summary: "Platform.get_mla_prefill_backend_cls (CUDA inherits it): walk the device capability's MLA prefill priority list (SM100: TRTLLM_RAGGED first for the 192/64/256 head layout, else FLASH_ATTN first; SM90 and older: FLASH_ATTN only) and return the first backend whose validate_configuration finds nothing wrong; no capability means FLASH_ATTN; none valid is a ValueError with every backend's reasons."
    sources: ["vllm/platforms/interface.py:435-514"]
    request:
      type: object
      properties:
        dtype: {type: string, default: bfloat16}
        mla_dimensions: {type: array, items: {type: integer}, default: [128, 64, 128], description: "[qk_nope_head_dim, qk_rope_head_dim, v_head_dim]"}
    response: {type: object, properties: {backend: {type: string, examples: [FLASH_ATTN]}, class_name: {type: [string, "null"]}}}
    errors:
      - {code: value-error, status: 0, retryable: false, summary: no valid MLA prefill backend}
      - {code: import-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.dtype: "= has(input.dtype) ? input.dtype : 'bfloat16'"
          vars.dims: "= has(input.mla_dimensions) ? input.mla_dimensions : [128, 64, 128]"
      - title: "cls.get_device_capability()"
        source: "vllm/platforms/interface.py:458"
        call: cuda-platform.get-device-capability
        as: dc
      - title: "No device capability: FLASH_ATTN"
        source: "vllm/platforms/interface.py:459-460"
        if: "vars.dc.value == null"
        then:
          - call: mla-prefill-backend-enum.get-class
            input: {name: FLASH_ATTN}
            as: fa
          - return: {backend: FLASH_ATTN, class_name: "= vars.fa.value.class_name"}
      - title: "Blackwell (major 10): TRTLLM_RAGGED leads for MLADimensions(192, 64, 256), FLASH_ATTN leads otherwise; then FLASHINFER, TOKENSPEED_MLA"
        source: "vllm/platforms/interface.py:462-479"
        if: "vars.dc.value.major == 10"
        then:
          - set:
              vars.prio: "= vars.dims == [192, 64, 256] ? ['TRTLLM_RAGGED', 'FLASH_ATTN', 'FLASHINFER', 'TOKENSPEED_MLA'] : ['FLASH_ATTN', 'TRTLLM_RAGGED', 'FLASHINFER', 'TOKENSPEED_MLA']"
        else:
          - title: "Hopper (SM90) and older: FLASH_ATTN only"
            source: "vllm/platforms/interface.py:480-481"
            set: {vars.prio: [FLASH_ATTN]}
      - set: {vars.reasons: {}}
      - title: "Each candidate in order: get_class(), then validate_configuration(device_capability, selector config); an ImportError counts as a reason"
        source: "vllm/platforms/interface.py:485-496"
        foreach: "= vars.prio"
        as: name
        steps:
          - call: mla-prefill-backend-enum.get-class
            input: {name: "= vars.name"}
            as: c
            on_error: continue
          - if: "!vars.c.ok"
            then:
              - set: {vars.reasons: "= merge(vars.reasons, {vars.name: ['ImportError']})"}
              - continue: true
          - call: mla-prefill-backend.validate-configuration
            input:
              backend_cls: "= has(vars.c.value.cls) ? vars.c.value.cls : {'name': vars.name}"
              has_device_capability: true
              device_capability: {major: "= vars.dc.value.major", minor: "= vars.dc.value.minor"}
              dtype: "= vars.dtype"
              mla_dimensions: "= vars.dims"
            as: v
          - title: "The first backend with no invalid reasons wins"
            source: "vllm/platforms/interface.py:494-495"
            if: "size(vars.v.value.invalid_reasons) == 0"
            then: [{return: {backend: "= vars.name", class_name: "= vars.c.value.class_name"}}]
          - set: {vars.reasons: "= merge(vars.reasons, {vars.name: vars.v.value.invalid_reasons})"}
      - title: "None valid: ValueError listing each backend's reasons"
        source: "vllm/platforms/interface.py:498-514"
        fail: {code: value-error, status: 0, message: "= 'No valid MLA prefill backend found with MLAPrefillSelectorConfig(dtype=torch.' + vars.dtype + ', mla_dimensions=(qk_nope_head_dim=' + string(vars.dims[0]) + ', qk_rope_head_dim=' + string(vars.dims[1]) + ', v_head_dim=' + string(vars.dims[2]) + ')). Reasons: {' + vars.prio.filter(n, n in vars.reasons).map(n, n + ': [' + vars.reasons[n].join(', ') + ']').join(', ') + '}.'"}
  - component: cpu-platform
    name: get-mla-prefill-backend-cls
    kind: function
    summary: "CpuPlatform.get_mla_prefill_backend_cls: the first of ZEN_CPU, CPU that imports and is available; none is a ValueError."
    sources: ["vllm/platforms/cpu.py:182-194"]
    request:
      type: object
      properties:
        dtype: {type: string, default: bfloat16}
        mla_dimensions: {type: array, items: {type: integer}, default: [128, 64, 128]}
    response: {type: object, properties: {backend: {type: string, examples: [CPU]}, class_name: {type: [string, "null"]}}}
    errors: [{code: value-error, status: 0, retryable: false, summary: no valid CPU MLA prefill backend}]
    behavior:
      - title: "ZEN_CPU, then CPU: skip one that doesn't import; take the first that is_available()"
        source: "vllm/platforms/cpu.py:187-193"
        foreach: [ZEN_CPU, CPU]
        as: name
        steps:
          - call: mla-prefill-backend-enum.get-class
            input: {name: "= vars.name"}
            as: c
            on_error: continue
          - if: "!vars.c.ok"
            then: [{continue: true}]
          - if: "!has(vars.c.value.cls) || !has(vars.c.value.cls.available) || vars.c.value.cls.available"
            then: [{return: {backend: "= vars.name", class_name: "= vars.c.value.class_name"}}]
      - source: "vllm/platforms/cpu.py:194"
        fail: {code: value-error, status: 0, message: "No valid CPU MLA prefill backend found."}
  - component: mla-prefill-backend-enum
    name: get-class
    kind: function
    summary: 'MLAPrefillBackendEnum.get_class: resolve_obj_by_qualname of get_path(); a path nothing can import is an ImportError.'
    sources: ['vllm/v1/attention/backends/mla/prefill/registry.py:118-129', 'vllm/utils/import_utils.py:119-123']
    request:
      type: object
      properties:
        name: {type: string, default: FLASH_ATTN}
    response:
      type: object
      properties:
        path: {type: string}
        class_name:
          type: [string, 'null']
    errors:
    - {code: import-error, status: 0, retryable: false, summary: the class can't be imported}
    attributes: {boundary: true, owner: attention}
  - component: mla-prefill-backend
    name: validate-configuration
    kind: function
    summary: 'MLAPrefillBackend.validate_configuration: the reasons a prefill backend class can''t serve this device, dtype and MLA head layout.'
    sources: ['vllm/v1/attention/backends/mla/prefill/base.py:94-131', 'vllm/v1/attention/backends/mla/prefill/base.py:63-67']
    request:
      type: object
      properties:
        backend_cls:
          type: object
          properties:
            name:
              type: [string, 'null']
            capability_majors:
              type: array
