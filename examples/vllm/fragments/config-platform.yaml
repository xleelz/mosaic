    name: compute-hash
    kind: function
    summary: "IrOpPriorityConfig.compute_hash: the per-op provider priority lists plus the uuid of every listed provider's implementation, after the platform imports its IR kernels, so a changed implementation changes the compile cache."
    sources: ["vllm/config/kernel.py:20-64"]
    request:
      type: object
      properties:
