  - id: config-asset-image-download-once
    name: "ImageAsset.pil_image: the first read downloads stop_sign.jpg into the cache, the second reads it from disk"
    fixtures: [tp1-llama-8b]
    state:
      vllm-public-assets-s3:
        objects:
          vision_model_images/stop_sign.jpg: {size: 59248, content_type: image/jpeg}
    steps:
      - {flow: config-asset-image, as: first}
      - {flow: config-asset-image, as: second}
      - {interface: local-disk.stat, caller: operator, as: cached, input: {path: "= steps.first.result.value.path"}}
    expect:
      - "steps.first.result.ok && steps.first.result.value.format == 'JPEG' && steps.first.result.value.path.endsWith('/vllm_public_assets/stop_sign.jpg')"
      # the write is the point: the second read finds the cached file, so the bucket is fetched once
      - "calls['vllm-public-assets-s3.get-object'] == 1 && steps.cached.result.value.exists && steps.cached.result.value.size == 59248"
      - "state['local-disk'].paths[steps.first.result.value.path].size == 59248"
  - id: config-asset-image-missing
    flow: config-asset-image
    name: "An asset the bucket doesn't serve fails the download"
    fixtures: [tp1-llama-8b]
    expect:
      - "!result.ok && result.error.code == 'http-error' && result.error.message.contains('stop_sign.jpg')"
  - id: config-platform-queries
    name: "Platform queries on the CUDA host: is_cuda, not ROCm/CPU/Zen; device capability 9.0 compared at-least, exactly and by family; CPU architecture"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: platforms.is-platform, caller: operator, as: cuda, input: {kind: cuda}}
      - {interface: platforms.is-platform, caller: operator, as: rocm, input: {kind: rocm}}
      - {interface: platforms.is-platform, caller: operator, as: cpu, input: {kind: cpu}}
      - {interface: platforms.is-platform, caller: operator, as: zen, input: {kind: zen_cpu}}
      - {interface: cuda-platform.get-device-capability, caller: operator, as: dc}
      - {interface: platforms.has-device-capability, caller: operator, as: ge89, input: {capability: 89}}
      - {interface: platforms.has-device-capability, caller: operator, as: ge100, input: {capability: [10, 0]}}
      - {interface: platforms.has-device-capability, caller: operator, as: eq90, input: {capability: [9, 0], mode: exact}}
      - {interface: platforms.has-device-capability, caller: operator, as: fam9, input: {capability: 90, mode: family}}
      - {interface: platforms.has-device-capability, caller: operator, as: fam10, input: {capability: 100, mode: family}}
      - {interface: platforms.get-cpu-architecture, caller: operator, as: arch}
    expect:
      - "steps.cuda.result.value.result && steps.cuda.result.value.platform_enum == 'CUDA' && !steps.rocm.result.value.result && !steps.cpu.result.value.result && !steps.zen.result.value.result"
      - "steps.dc.result.value.as_int == 90 && steps.dc.result.value.version == '9.0'"
      - "steps.ge89.result.value.result && !steps.ge100.result.value.result && steps.eq90.result.value.result && steps.fam9.result.value.result && !steps.fam10.result.value.result"
      - "steps.arch.result.value.arch == 'X86'"
  - id: config-platform-queries-cpu-host
    name: "On a CPU-only aarch64 host: is_cpu, no device capability, ARM; NVML without a capability answers None"
    fixtures: [tp1-llama-8b]
    config: {vllm-target-device: cpu}
    state:
      platforms: {host: {machine: aarch64}}
      cuda-platform: {nvml_error: true}
    steps:
      - {interface: platforms.is-platform, caller: operator, as: cpu, input: {kind: cpu}}
      - {interface: platforms.has-device-capability, caller: operator, as: cap, input: {capability: 80}}
      - {interface: platforms.get-cpu-architecture, caller: operator, as: arch}
      - {interface: cuda-platform.get-device-capability, caller: operator, as: nvml}
    expect:
      - "steps.cpu.result.value.result && !steps.cap.result.value.result && steps.arch.result.value.arch == 'ARM'"
      - "steps.nvml.result.ok && steps.nvml.result.value == null"
  - id: config-rocm-arch-and-fp8
    name: "ROCm on an MI300X (gfx942): MI3xx/CDNA predicates, FP8 support with the fnuz dtype, amdsmi device count cut by CUDA_VISIBLE_DEVICES"
    fixtures: [tp1-llama-8b]
    state:
      rocm-platform: {gcn_arch: "gfx942:sramecc+:xnack-", amdsmi_gpus: 8, torch_compiled: true}
    steps:
      - {interface: rocm-platform.on-arch, caller: operator, as: g942, input: {arch: gfx942}}
      - {interface: rocm-platform.on-arch, caller: operator, as: g950, input: {arch: gfx950}}
      - {interface: rocm-platform.on-arch, caller: operator, as: mi3, input: {arch: mi3xx}}
      - {interface: rocm-platform.on-arch, caller: operator, as: g1x, input: {arch: gfx1x}}
      - {interface: rocm-platform.supports-fp8, caller: operator, as: fp8}
      - {interface: rocm-platform.fp8-dtype, caller: operator, as: dt}
      - {interface: rocm-platform.device-count, caller: operator, as: all}
      - {interface: rocm-platform.device-count, caller: operator, as: vis, input: {visible_devices: "0,1"}}
    expect:
      - "steps.g942.result.value.result && !steps.g950.result.value.result && steps.mi3.result.value.result && !steps.g1x.result.value.result"
      - "steps.fp8.result.value.supports_fp8 && steps.dt.result.value.dtype == 'torch.float8_e4m3fnuz'"
      - "steps.all.result.value.device_count == 8 && steps.vis.result.value.device_count == 2"
  - id: config-rocm-count-on-cuda-host
    name: "On the CUDA host torch isn't a ROCm build: the ROCm device count is 0"
    fixtures: [tp1-llama-8b]
