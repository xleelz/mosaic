    attributes: {boundary: true, owner: attention}

  # ======================= Speculative / AuxOutput =======================
  - component: speculative-config
    name: maybe-override-draft-max-position-embeddings
    kind: function
    summary: "Raise an EAGLE draft's max_position_embeddings to the target's max_model_len (in place, with an INFO log)."
    sources: ["vllm/config/speculative.py:1677-1709"]
    request: {type: object, properties: {draft_hf_config: {type: object}, target_max_model_len: {type: integer}}}
    response: {type: object}
    behavior:
      - title: "Missing attribute or already large enough: unchanged, nothing logged"
        source: "vllm/config/speculative.py:1694-1701"
        if: "!has(input.draft_hf_config.max_position_embeddings) || input.draft_hf_config.max_position_embeddings == null || input.draft_hf_config.max_position_embeddings >= input.target_max_model_len"
        then:
          - return: "= input.draft_hf_config"
      - title: "logger.info: Overriding draft model max_position_embeddings"
        source: "vllm/config/speculative.py:1702-1708"
        set: {ctx.spec_override_log: "= 'Overriding draft model max_position_embeddings from ' + string(input.draft_hf_config.max_position_embeddings) + ' to the target model max_model_len (' + string(input.target_max_model_len) + ')'"}
      - title: "draft_hf_config.max_position_embeddings = target_max_model_len"
        source: "vllm/config/speculative.py:1709"
        return: "= merge(input.draft_hf_config, {'max_position_embeddings': input.target_max_model_len})"
  - component: observability-config
    name: init
    kind: function
    summary: "ObservabilityConfig(...): custom histogram buckets must name a known family and be non-empty, positive, finite, strictly increasing and not booleans; detailed traces need an OTLP endpoint. Omitted fields are None."
    description: >-
      Messages are the validators' ValueError text; pydantic reports them inside a ValidationError
      ("1 validation error for ObservabilityConfig ... Value error, <text>"). Floats print as Python reprs (1.0).
    sources: ["vllm/engine/arg_utils.py:2177-2193", "vllm/config/observability.py:166-221"]
    request:
      type: object
      properties:
        custom_histogram_buckets: {type: [object, "null"], default: null}
        otlp_traces_endpoint: {type: [string, "null"], default: null}
        collect_detailed_traces: {type: [array, "null"], default: null}
    response: {type: object, properties: {custom_histogram_buckets: {type: [object, "null"], default: null}}}
    errors: [{code: validation-error, status: 0, retryable: false}]
    behavior:
      - title: "Omitted fields take their defaults (None)"
        source: "vllm/config/observability.py:70"
        set:
          vars.b: "= has(input.custom_histogram_buckets) ? input.custom_histogram_buckets : null"
          vars.otlp: "= has(input.otlp_traces_endpoint) ? input.otlp_traces_endpoint : null"
          vars.traces: "= has(input.collect_detailed_traces) ? input.collect_detailed_traces : null"
      - title: "_reject_bool_histogram_bounds (mode=before) runs over every family first: booleans would be coerced to floats"
        source: "vllm/config/observability.py:166-180"
        foreach: "= vars.b == null ? {} : vars.b"
        as: buckets
        index: family
        steps:
          - if: "type(vars.buckets) == list && vars.buckets.exists(x, type(x) == bool)"
            then:
              - fail: {code: validation-error, status: 0, message: "= 'custom_histogram_buckets[\\'' + vars.family + '\\']: bound ' + (vars.buckets.filter(x, type(x) == bool)[0] ? 'True' : 'False') + ' must be a number, not a boolean'"}
      - title: "_validate_custom_histogram_buckets (after coercion to floats), family by family"
        source: "vllm/config/observability.py:184-215"
        foreach: "= vars.b == null ? {} : vars.b"
        as: buckets
        index: family
        steps:
          - set:
              vars.reprs: "= vars.buckets.map(x, string(double(x)).contains('.') || string(double(x)).contains('e') || string(double(x)).contains('N') || string(double(x)).contains('I') ? string(double(x)) : string(double(x)) + '.0')"
          - title: "Unknown bucket family"
            source: "vllm/config/observability.py:193-197"
            if: "!(vars.family in ['request_latency', 'time_to_first_token', 'inter_token_latency', 'iteration_tokens', 'request_params_n', 'request_num_preemptions', 'request_tokens', 'kv_cache_residency'])"
            then:
              - fail: {code: validation-error, status: 0, message: "= 'custom_histogram_buckets: unknown bucket family \\'' + vars.family + '\\'; known families: [\\'inter_token_latency\\', \\'iteration_tokens\\', \\'kv_cache_residency\\', \\'request_latency\\', \\'request_num_preemptions\\', \\'request_params_n\\', \\'request_tokens\\', \\'time_to_first_token\\']'"}
          - title: "Empty bucket list"
            source: "vllm/config/observability.py:198-202"
            if: "size(vars.buckets) == 0"
            then:
              - fail: {code: validation-error, status: 0, message: "= 'custom_histogram_buckets[\\'' + vars.family + '\\']: bucket list must not be empty'"}
          - title: "Each bound must be finite and > 0 (NaN and inf fail): the first bad bound is named"
            source: "vllm/config/observability.py:203-208"
            if: "lists.range(size(vars.buckets)).exists(i, !(double(vars.buckets[i]) > 0.0 && double(vars.buckets[i]) < 1.0e308))"
            then:
              - fail: {code: validation-error, status: 0, message: "= 'custom_histogram_buckets[\\'' + vars.family + '\\']: bound ' + vars.reprs[lists.range(size(vars.buckets)).filter(i, !(double(vars.buckets[i]) > 0.0 && double(vars.buckets[i]) < 1.0e308))[0]] + ' must be finite and greater than 0'"}
          - title: "Bounds must be strictly increasing"
            source: "vllm/config/observability.py:209-213"
            if: "lists.range(size(vars.buckets) - 1).exists(i, double(vars.buckets[i]) >= double(vars.buckets[i + 1]))"
            then:
              - fail: {code: validation-error, status: 0, message: "= 'custom_histogram_buckets[\\'' + vars.family + '\\']: bounds [' + vars.reprs.join(', ') + '] must be strictly increasing'"}
      - title: "collect_detailed_traces requires --otlp-traces-endpoint"
        source: "vllm/config/observability.py:216-221"
        if: "vars.traces != null && size(vars.traces) > 0 && (vars.otlp == null || vars.otlp == '')"
        then:
          - fail: {code: validation-error, status: 0, message: "collect_detailed_traces requires `--otlp-traces-endpoint` to be set."}
      - title: "Bounds are stored as floats"
        source: "vllm/config/observability.py:70"
        return: {custom_histogram_buckets: "= vars.b == null ? dyn(null) : dyn(vars.b.transformMap(k, v, v.map(x, double(x))))"}
  - component: speculative-config
    name: verify-and-get-draft-tp
    kind: function
    summary: "SpeculativeConfig._verify_and_get_draft_tp: unset draft TP follows the target (1 for mlp_speculator); an explicit value must be 1 or the target's TP."
    sources: ["vllm/config/speculative.py:1711-1743"]
    request: {type: object, properties: {target_tensor_parallel_size: {type: integer}, draft_tensor_parallel_size: {type: [integer, "null"], default: null}, draft_model_type: {type: string}}}
    response: {type: object, properties: {draft_tensor_parallel_size: {type: integer}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "Unset: mlp_speculator runs at TP 1, other drafts at the target's TP"
        source: "vllm/config/speculative.py:1722-1734"
        if: "input.draft_tensor_parallel_size == null"
        then:
          - return: {draft_tensor_parallel_size: "= input.draft_model_type == 'mlp_speculator' ? 1 : input.target_tensor_parallel_size"}
      - title: "An explicit draft TP other than 1 or the target's"
        source: "vllm/config/speculative.py:1735-1742"
        if: "!(input.draft_tensor_parallel_size in [1, input.target_tensor_parallel_size])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'speculative_draft_tensor_parallel_size=' + string(input.draft_tensor_parallel_size) + ' cannot be other value than 1 or target model tensor_parallel_size'"}
      - return: {draft_tensor_parallel_size: "= input.draft_tensor_parallel_size"}
  - component: aux-output-config
    name: init
    kind: function
    summary: "AuxOutputConfig(...): pydantic-validated fields and the derived `enabled` property."
    sources: ["vllm/config/aux_output.py:10-23"]
    request: {type: object, properties: {enable_return_routed_experts: {type: boolean, default: false}, max_bytes: {type: [integer, "null"], default: null}}}
    response: {type: object, properties: {enable_return_routed_experts: {type: boolean}, max_bytes: {type: [integer, "null"], default: null}, enabled: {type: boolean}}}
    errors: [{code: validation-error, status: 0, retryable: false}]
    behavior:
      - title: "Field defaults: enable_return_routed_experts False, max_bytes None"
        source: "vllm/config/aux_output.py:14-18"
        set:
          vars.rex: "= has(input.enable_return_routed_experts) ? input.enable_return_routed_experts : false"
          vars.max_bytes: "= has(input.max_bytes) ? input.max_bytes : null"
      - title: "max_bytes: Field(gt=0)"
        source: "vllm/config/aux_output.py:17"
        if: "vars.max_bytes != null && vars.max_bytes <= 0"
        then:
          - fail: {code: validation-error, status: 0, message: "= '1 validation error for AuxOutputConfig\\nmax_bytes\\n  Input should be greater than 0 [type=greater_than, input_value=' + string(vars.max_bytes) + ', input_type=' + (type(vars.max_bytes) == double ? 'float' : 'int') + ']'"}
      - title: "enabled is enable_return_routed_experts"
        source: "vllm/config/aux_output.py:20-23"
        return: {enable_return_routed_experts: "= vars.rex", max_bytes: "= vars.max_bytes", enabled: "= vars.rex"}

  # ======================= Platforms =======================
  - component: platforms
    name: getattr
    kind: function
    summary: "vllm.platforms.__getattr__: current_platform is resolved once, after plugins can register, then cached."
    sources: ["vllm/platforms/__init__.py:303-326"]
    attributes: {racy_in_code: "vllm/platforms/__init__.py:317 checks the module global _current_platform, vllm/platforms/__init__.py:319 assigns it unconditionally, with no lock (two first callers both resolve)"}
    request: {type: object, required: [name], properties: {name: {type: string, examples: [current_platform]}}}
    response: {$ref: ConfigPlatform}
    errors: [{code: attribute-error, status: 0, retryable: false}, {code: runtime-error, status: 0, retryable: false}]
    behavior:
      - if: "input.name != 'current_platform'"
        then:
          - title: "Any other unknown attribute"
            source: "vllm/platforms/__init__.py:325-326"
            fail: {code: attribute-error, status: 0, message: "= 'No attribute named \\'' + input.name + '\\' exists in vllm.platforms.'"}
      - title: "Cached after the first resolution"
        source: "vllm/platforms/__init__.py:317"
        if: "state.current != null"
        then: [{return: "= state.current"}]
      - call: platforms.resolve-current-platform-cls-qualname
        as: q
      - title: "resolve_obj_by_qualname(...)() instantiates and caches the platform"
        source: "vllm/platforms/__init__.py:318-321"
        set:
          state.current:
            qualname: "= vars.q.value.qualname"
            device_type: "= vars.q.value.qualname.contains('Cuda') ? 'cuda' : (vars.q.value.qualname.contains('Cpu') ? 'cpu' : (vars.q.value.qualname.contains('Rocm') ? 'cuda' : (vars.q.value.qualname.contains('XPU') ? 'xpu' : (vars.q.value.qualname.contains('Tpu') ? 'tpu' : ''))))"
            device_name: "= state.host.device_name"
            device_total_memory: "= state.host.device_total_memory"
            device_count: "= state.host.device_count"
            cpu_architecture: "= state.host.cpu_architecture"
            tpu_chip: "= state.host.tpu_chip"
      - return: "= state.current"
  - component: platforms
    name: setattr
    kind: function
    summary: "vllm.platforms.__setattr__: assigning current_platform replaces the cached platform."
    sources: ["vllm/platforms/__init__.py:329-336"]
    request: {type: object, properties: {name: {type: string}, qualname: {type: string}}}
    errors: [{code: attribute-error, status: 0, retryable: false}]
    behavior:
      - if: "input.name != 'current_platform'"
        then:
          - fail: {code: attribute-error, status: 0, message: "= 'No attribute named \\'' + input.name + '\\' exists in vllm.platforms.'"}
      - title: "_current_platform = value"
        source: "vllm/platforms/__init__.py:330-332"
        set:
          state.current: {qualname: "= input.qualname", device_type: "= input.qualname.contains('Cpu') ? 'cpu' : 'cuda'", device_name: "= state.host.device_name", device_total_memory: "= state.host.device_total_memory", device_count: "= state.host.device_count", cpu_architecture: "= state.host.cpu_architecture", tpu_chip: "= state.host.tpu_chip"}
      - return: {set: true}
  - component: platforms
    name: resolve-current-platform-cls-qualname
    kind: function
    summary: "Probe the five built-in platform plugins and the vllm.platform_plugins group; exactly one may activate."
    sources: ["vllm/platforms/__init__.py:240-293", "vllm/platforms/__init__.py:250"]
    response: {type: object, properties: {qualname: {type: string}}}
    errors: [{code: runtime-error, status: 0, retryable: false}]
    behavior:
      - title: "VLLM_TARGET_DEVICE=cpu is authoritative: no probing"
        source: "vllm/platforms/__init__.py:244-248"
        if: "config['vllm-target-device'] == 'cpu'"
        then:
          - call: platforms.cpu-platform-plugin
            as: cpu
          - return: {qualname: "= vars.cpu.value.qualname"}
      - title: "Out-of-tree platform plugins: load_plugins_by_group(vllm.platform_plugins)"
        source: "vllm/platforms/__init__.py:250"
        call: plugins.load-plugins-by-group
        input: {group: vllm.platform_plugins}
        as: oot
      - set: {vars.builtin: [], vars.oot_active: []}
      - title: "Probe each built-in plugin in order tpu, cuda, rocm, xpu, cpu; a probe that raises counts as inactive"
        source: "vllm/platforms/__init__.py:254-265"
        foreach: [tpu, cuda, rocm, xpu, cpu]
        as: name
        steps:
          - call: "= 'platforms.' + vars.name + '-platform-plugin'"
            targets: [platforms.tpu-platform-plugin, platforms.cuda-platform-plugin, platforms.rocm-platform-plugin, platforms.xpu-platform-plugin, platforms.cpu-platform-plugin]
            as: probe
            on_error: continue
          - if: "vars.probe.ok && vars.probe.value.qualname != null"
            then:
              - set: {vars.builtin: "= vars.builtin + [{'name': vars.name, 'qualname': vars.probe.value.qualname}]"}
      - title: "An out-of-tree plugin activates when its function returns a class name"
        source: "vllm/platforms/__init__.py:254-259"
        set: {vars.oot_active: "= vars.oot.value.plugins.transformList(k, v, has(v.returns) && v.returns != null, {'name': k, 'qualname': v.returns})"}
      - title: "Two out-of-tree plugins at once"
        source: "vllm/platforms/__init__.py:272-276"
        if: "size(vars.oot_active) >= 2"
        then:
          - fail: {code: runtime-error, status: 0, message: "= 'Only one platform plugin can be activated, but got: [\\'' + vars.oot_active.map(p, p.name).join('\\', \\'') + '\\']'"}
      - title: "One out-of-tree plugin wins over any built-in"
        source: "vllm/platforms/__init__.py:277-279"
        if: "size(vars.oot_active) == 1"
        then: [{return: {qualname: "= vars.oot_active[0].qualname"}}]
      - title: "Two built-in plugins at once"
        source: "vllm/platforms/__init__.py:280-284"
        if: "size(vars.builtin) >= 2"
        then:
          - fail: {code: runtime-error, status: 0, message: "= 'Only one platform plugin can be activated, but got: [\\'' + vars.builtin.map(p, p.name).join('\\', \\'') + '\\']'"}
      - title: "Exactly one built-in plugin: automatically detected"
        source: "vllm/platforms/__init__.py:285-289"
        if: "size(vars.builtin) == 1"
        then: [{return: {qualname: "= vars.builtin[0].qualname"}}]
      - title: "Nothing detected: UnspecifiedPlatform"
        source: "vllm/platforms/__init__.py:290-292"
        return: {qualname: vllm.platforms.interface.UnspecifiedPlatform}
  - component: platforms
    name: tpu-platform-plugin
    kind: function
    summary: "Built-in plugin tpu: Pathways proxy or an importable libtpu."
    sources: ["vllm/platforms/__init__.py:232", "vllm/platforms/__init__.py:33-54"]
    response: {type: object, properties: {qualname: {type: [string, "null"], default: null}}}
    behavior:
      - title: "Pathways TPU proxy"
        source: "vllm/platforms/__init__.py:37-39"
        if: "config['vllm-tpu-using-pathways']"
        then: [{return: {qualname: tpu_inference.platforms.tpu_platform.TpuPlatform}}]
      - title: "import libtpu succeeds"
        source: "vllm/platforms/__init__.py:41-51"
        if: "state.host.libtpu_installed"
        then: [{return: {qualname: vllm.platforms.tpu.TpuPlatform}}]
      - return: {qualname: null}
  - component: platforms
    name: cuda-platform-plugin
    kind: function
    summary: "Built-in plugin cuda: NVML sees a GPU and vLLM is not a CPU build; Jetson without NVML also counts."
    sources: ["vllm/platforms/__init__.py:233", "vllm/platforms/__init__.py:57-105"]
    response: {type: object, properties: {qualname: {type: [string, "null"], default: null}}}
    behavior:
      - title: "NVML failed to load: CUDA only on Jetson"
        source: "vllm/platforms/__init__.py:85-103"
        if: "!state.host.nvml_available"
        then:
          - return: {qualname: "= state.host.jetson ? dyn('vllm.platforms.cuda.CudaPlatform') : dyn(null)"}
      - title: "nvmlDeviceGetCount() > 0 and not a CPU build"
        source: "vllm/platforms/__init__.py:71-74"
        if: "state.host.nvml_gpu_count > 0 && !state.host.vllm_version.contains('cpu')"
        then: [{return: {qualname: vllm.platforms.cuda.CudaPlatform}}]
      - return: {qualname: null}
  - component: platforms
    name: rocm-platform-plugin
    kind: function
    summary: "Built-in plugin rocm: amdsmi sees a GPU, or WSL with a HIP torch."
    sources: ["vllm/platforms/__init__.py:234", "vllm/platforms/__init__.py:108-140"]
    response: {type: object, properties: {qualname: {type: [string, "null"], default: null}}}
    behavior:
      - title: "amdsmi processor handles > 0"
        source: "vllm/platforms/__init__.py:114-118"
        if: "state.host.amdsmi_gpus > 0"
        then: [{return: {qualname: vllm.platforms.rocm.RocmPlatform}}]
      - title: "WSL fallback through PyTorch HIP"
        source: "vllm/platforms/__init__.py:126-136"
        if: "state.host.in_wsl && state.host.torch_hip && !state.host.vllm_version.contains('cpu')"
        then: [{return: {qualname: vllm.platforms.rocm.RocmPlatform}}]
      - return: {qualname: null}
  - component: platforms
    name: xpu-platform-plugin
    kind: function
    summary: "Built-in plugin xpu: torch.xpu.is_available()."
    sources: ["vllm/platforms/__init__.py:235", "vllm/platforms/__init__.py:143-162"]
    response: {type: object, properties: {qualname: {type: [string, "null"], default: null}}}
    behavior:
      - title: "torch.xpu.is_available()"
        source: "vllm/platforms/__init__.py:156-158"
        if: "state.host.xpu_available"
        then: [{return: {qualname: vllm.platforms.xpu.XPUPlatform}}]
      - return: {qualname: null}
  - component: platforms
    name: cpu-platform-plugin
    kind: function
    summary: "Built-in plugin cpu: VLLM_TARGET_DEVICE=cpu, a CPU build of vLLM, or macOS; AMD Zen with zentorch gets ZenCpuPlatform."
    sources: ["vllm/platforms/__init__.py:236", "vllm/platforms/__init__.py:174-228"]
    response: {type: object, properties: {qualname: {type: [string, "null"], default: null}}}
    behavior:
      - title: "CPU when targeted, built for CPU, or on macOS"
        source: "vllm/platforms/__init__.py:176-200"
        set: {vars.is_cpu: "= config['vllm-target-device'] == 'cpu' || state.host.vllm_version.contains('cpu') || state.host.sys_platform.startsWith('darwin')"}
      - if: "!vars.is_cpu"
        then: [{return: {qualname: null}}]
      - title: "AMD Zen with AVX-512 and zentorch importable"
        source: "vllm/platforms/__init__.py:205-217"
        if: "state.host.amd_zen_avx512 && state.host.zentorch_installed"
        then: [{return: {qualname: vllm.platforms.zen_cpu.ZenCpuPlatform}}]
      - return: {qualname: vllm.platforms.cpu.CpuPlatform}
  - component: cuda-platform
    name: check-and-update-config
    kind: function
    summary: "CudaPlatformBase.check_and_update_config: worker class auto -> gpu_worker.Worker; bidirectional-MM models force disable_chunked_mm_input."
    sources: ["vllm/platforms/cuda.py:323-364"]
    request: {type: object, properties: {cache_config: {type: object}, model_config: {type: object}}}
    response: {type: object, properties: {worker_cls: {type: string}, block_size: {type: integer}, disable_chunked_mm_input: {type: boolean}, mamba_ssm_cache_dtype: {type: string}}}
    behavior:
      - title: "worker_cls 'auto' becomes vllm.v1.worker.gpu_worker.Worker"
        source: "vllm/platforms/cuda.py:328-329"
        set: {vars.worker: vllm.v1.worker.gpu_worker.Worker}
      - title: "Multimodal bidirectional-attention models force disable_chunked_mm_input"
        source: "vllm/platforms/cuda.py:331-342"
        if: "input.model_config.is_mm_prefix_lm"
        then:
          - set: {ctx.forced_disable_chunked_mm_input: true}
      - return: {worker_cls: "= vars.worker", block_size: "= input.cache_config.block_size", disable_chunked_mm_input: "= input.model_config.is_mm_prefix_lm", mamba_ssm_cache_dtype: "= input.cache_config.mamba_ssm_cache_dtype"}
  - component: cpu-platform
    name: check-and-update-config
    kind: function
    summary: "CpuPlatform.check_and_update_config: block size by attention kernel, and the SSM cache dtype policy of the accelerated GDN backend."
    sources: ["vllm/platforms/cpu.py:215-320"]
    request:
      type: object
      properties:
        cache_config: {type: object, properties: {block_size: {type: integer}, user_specified_block_size: {type: boolean}, mamba_ssm_cache_dtype: {type: string}}}
        model_config: {type: object, properties: {model_type: {type: string}, architecture: {type: string}, has_inner_state: {type: boolean}, use_mla: {type: boolean}, layer_types: {type: array}, state_dtype: {type: string}}}
    response: {type: object, properties: {worker_cls: {type: string}, block_size: {type: integer}, mamba_ssm_cache_dtype: {type: string}, mamba_backend: {type: string}}}
    behavior:
      - set:
          vars.mla: "= input.model_config.model_type != 'deepseek_v4' && input.model_config.use_mla"
          vars.amx_mla: "= input.model_config.model_type != 'deepseek_v4' && input.model_config.use_mla && state.cpu_architecture == 'X86' && state.amx_tile_supported"
          vars.dtype: "= input.cache_config.mamba_ssm_cache_dtype"
          vars.backend: none
      - title: "Block size: reference CPU MLA needs 16, DeepSeek-V4 needs 256, otherwise an unset block size becomes 128"
        source: "vllm/platforms/cpu.py:273-293"
        set:
          vars.block: "= vars.mla && !vars.amx_mla ? 16 : (input.model_config.model_type == 'deepseek_v4' ? 256 : (input.cache_config.user_specified_block_size ? input.cache_config.block_size : 128))"
      - title: "Accelerated GDN (AVX-512 BF16): keep a 16-bit SSM cache only for the gdn backend"
        source: "vllm/platforms/cpu.py:301-320"
        if: "state.avx512_bf16_supported && vars.dtype != 'float32'"
        then:
          - call: cpu-platform.cpu-mamba-backend
            input:
              model_type: "= input.model_config.model_type"
              architecture: "= input.model_config.architecture"
              has_inner_state: "= input.model_config.has_inner_state"
              layer_types: "= input.model_config.layer_types"
              state_dtype: "= input.model_config.state_dtype"
              mamba_ssm_cache_dtype: "= vars.dtype"
            as: mb
          - set: {vars.backend: "= vars.mb.value.backend"}
          - if: "vars.dtype in ['float16', 'bfloat16'] && vars.backend == 'gdn'"
            then:
              - title: "Using 16-bit SSM state storage for the CPU accelerated GDN backend"
                source: "vllm/platforms/cpu.py:307-314"
                set: {ctx.gdn_ssm_dtype: "= vars.dtype"}
            else:
              - title: "Reset SSM cache type to float32 for accelerated GDN mamba backend"
                source: "vllm/platforms/cpu.py:315-320"
                set: {vars.dtype: float32}
      - return: {worker_cls: vllm.v1.worker.cpu_worker.CPUWorker, block_size: "= vars.block", mamba_ssm_cache_dtype: "= vars.dtype", mamba_backend: "= vars.backend"}
  - component: cpu-platform
    name: cpu-mamba-backend
    kind: function
    summary: "_cpu_mamba_backend: 'gdn' only for linear-attention models whose model class wants the same 16-bit SSM state dtype as the cache."
    sources: ["vllm/platforms/cpu.py:39-91"]
    request:
      type: object
      properties:
        model_type: {type: string}
        architecture: {type: string}
        has_inner_state: {type: boolean}
        layer_types: {type: array}
        state_dtype: {type: string}
        mamba_ssm_cache_dtype: {type: string}
    response: {type: object, properties: {backend: {type: string}}}
    behavior:
      - set:
          vars.linear: "= 'linear_attention' in input.layer_types"
          vars.fallback: "= input.model_type != '' ? input.model_type.lowerAscii() : (input.architecture != '' ? input.architecture.lowerAscii() : 'unknown')"
      - title: "No inner state and no linear attention: none"
        source: "vllm/platforms/cpu.py:58-59"
        if: "!(input.has_inner_state || vars.linear)"
        then: [{return: {backend: none}}]
      - title: "Stateful but no linear attention (e.g. mamba layers): the model type"
        source: "vllm/platforms/cpu.py:61-63"
        if: "!vars.linear"
        then: [{return: {backend: "= vars.fallback"}}]
      - title: "A cache dtype other than float16/bfloat16: the model type"
        source: "vllm/platforms/cpu.py:81-86"
        if: "!(input.mamba_ssm_cache_dtype in ['float16', 'bfloat16'])"
        then: [{return: {backend: "= vars.fallback"}}]
      - title: "The model class's SSM state dtype matches the cache dtype: gdn"
        source: "vllm/platforms/cpu.py:88-91"
        return: {backend: "= input.state_dtype == input.mamba_ssm_cache_dtype ? 'gdn' : vars.fallback"}
  - component: xpu
    name: get-mem-info-wrapper
    kind: function
    summary: "get_mem_info_wrapper: normalize the device argument, bounds-check it, then call torch.ops._C_cache_ops.getMemoryInfo."
    sources: ["vllm/platforms/xpu.py:31-97", "vllm/platforms/xpu.py:100"]
    request: {type: object, properties: {device: {type: [string, integer, "null"], default: null}}}
    response: {type: object, properties: {free_bytes: {type: integer}, total_bytes: {type: integer}}}
    errors: [{code: runtime-error, status: 0, retryable: false}, {code: value-error, status: 0, retryable: false}]
    behavior:
      - set: {vars.dev: "= input.device"}
      - title: "None: the current XPU device"
        source: "vllm/platforms/xpu.py:48-49"
        if: "vars.dev == null"
        then:
          - set: {vars.dev: "= state.current_device"}
      - title: "Device strings must start with 'xpu' and carry an integer index"
        source: "vllm/platforms/xpu.py:61-78"
        if: "type(vars.dev) == string"
        then:
          - if: "!vars.dev.startsWith('xpu')"
            then:
              - fail: {code: runtime-error, status: 0, message: "= 'Expected \\'xpu\\' device string, got \\'' + vars.dev + '\\''"}
          - if: "vars.dev == 'xpu'"
            then:
              - set: {vars.dev: "= state.current_device"}
            else:
              - title: "xpu:<n>: the index must be an int; more than one ':' is a bad format"
                source: "vllm/platforms/xpu.py:69-78"
                if: "size(vars.dev.split(':')) > 2"
                then:
                  - fail: {code: runtime-error, status: 0, message: "= 'Invalid device string format: \\'' + vars.dev + '\\''"}
              - if: "size(vars.dev.split(':')) == 1"
                then:
                  - set: {vars.dev: "= state.current_device"}
                else:
                  - if: "!vars.dev.split(':')[1].matches('^[-+]?[0-9]+$')"
                    then:
                      - fail: {code: runtime-error, status: 0, message: "= 'Invalid device index: \\'' + vars.dev + '\\', expected integer after \\':\\''"}
                  - set: {vars.dev: "= int(vars.dev.split(':')[1])"}
      - title: "Index bounds check against torch.xpu.device_count()"
        source: "vllm/platforms/xpu.py:81-87"
        if: "vars.dev < 0 || vars.dev >= state.device_count"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Invalid device index ' + string(vars.dev) + ', must be in range [0, ' + string(state.device_count) + ')'"}
      - title: "torch.ops._C_cache_ops.getMemoryInfo(device)"
        source: "vllm/platforms/xpu.py:95"
        call: gpu-memory.get-memory-info
        input: {device: "= vars.dev"}
        as: mem
      - return: "= vars.mem.value"

  # ======================= Plugins =======================
  - component: plugins
    name: load-plugins-by-group
    kind: function
    summary: "load_plugins_by_group: discover a group's entry points, keep the ones VLLM_PLUGINS allows, load them (a failing load is logged and skipped)."
    sources: ["vllm/plugins/__init__.py:36-74"]
    request: {type: object, required: [group], properties: {group: {type: string, examples: [vllm.general_plugins]}}}
    response: {type: object, properties: {plugins: {type: object}}}
    behavior:
      - set:
          vars.discovered: "= input.group in state.entry_points ? state.entry_points[input.group] : {}"
          vars.allowed: "= 'vllm-plugins' in config ? config['vllm-plugins'] : null"
      - title: "No plugins for the group"
        source: "vllm/plugins/__init__.py:42-45"
        if: "size(vars.discovered) == 0"
        then: [{return: {plugins: {}}}]
      - set: {vars.plugins: {}}
      - title: "Each discovered plugin allowed by VLLM_PLUGINS (unset = all) is loaded"
        source: "vllm/plugins/__init__.py:62-72"
        foreach: "= vars.discovered"
        as: ep
        index: name
        steps:
          - if: "vars.allowed != null && !(vars.name in vars.allowed)"
            then: [{continue: true}]
          - title: "plugin.load() raised: logged with logger.exception and skipped"
            source: "vllm/plugins/__init__.py:68-72"
            if: "!vars.ep.loads"
            then: [{continue: true}]
          - set: {vars.plugins: "= merge(vars.plugins, {vars.name: vars.ep})"}
      - return: {plugins: "= vars.plugins"}
  - component: plugins
    name: load-general-plugins
    kind: function
    summary: "load_general_plugins: once per process, load vllm.general_plugins and call each plugin function."
    sources: ["vllm/plugins/__init__.py:77-90", "vllm/plugins/__init__.py:87"]
    response: {type: object, properties: {loaded: {type: array, items: {type: string}}, already_loaded: {type: boolean}}}
    behavior:
      - title: "plugins_loaded guard: one load per process"
        source: "vllm/plugins/__init__.py:82-85"
        if: "state.plugins_loaded"
        then: [{return: {loaded: [], already_loaded: true}}]
      - set: {state.plugins_loaded: true}
      - title: "Group vllm.general_plugins"
        source: "vllm/plugins/__init__.py:87"
        call: plugins.load-plugins-by-group
        input: {group: vllm.general_plugins}
        as: grp
      - set: {vars.loaded: []}
      - title: "Execute each loaded function; an exception propagates to the caller"
        source: "vllm/plugins/__init__.py:88-90"
        foreach: "= vars.grp.value.plugins"
        as: ep
        index: name
        steps:
          - title: "func(): a plugin registering an out-of-tree model calls ModelRegistry.register_model with its own arguments"
            source: "vllm/plugins/__init__.py:89-90"
            call: "= vars.ep.target"
            targets: [filesystem-resolver.register-filesystem-resolver, hf-hub-resolver.register-hf-hub-resolver, model-registry.register-model]
            input: "= has(vars.ep.input) ? vars.ep.input : {}"
          - set: {vars.loaded: "= vars.loaded + [vars.name]"}
      - return: {loaded: "= vars.loaded", already_loaded: false}
  - component: plugins
    name: load-endpoint-plugins
    kind: function
    summary: "load_endpoint_plugins: endpoint plugins add HTTP routes, so they load only when named in VLLM_PLUGINS and when their required tasks are served."
    sources: ["vllm/plugins/__init__.py:93-159", "vllm/plugins/__init__.py:123"]
    request: {type: object, properties: {supported_tasks: {type: [array, "null"], items: {type: string}}}}
    response: {type: object, properties: {plugins: {type: array, items: {type: string}}, warned: {type: boolean}}}
    behavior:
      - title: "VLLM_PLUGINS unset: nothing loads; warn if any endpoint plugin is installed"
        source: "vllm/plugins/__init__.py:122-131"
        if: "!('vllm-plugins' in config) || config['vllm-plugins'] == null"
        then:
          - return: {plugins: [], warned: "= size(state.entry_points['vllm.endpoint_plugins']) > 0"}
      - call: plugins.load-plugins-by-group
        input: {group: vllm.endpoint_plugins}
        as: grp
      - set: {vars.out: []}
      - title: "Instantiate each factory; skip failures and plugins whose required_tasks the server lacks"
        source: "vllm/plugins/__init__.py:136-157"
        foreach: "= vars.grp.value.plugins"
        as: ep
        index: name
        steps:
          - if: "has(vars.ep.instantiates) && !vars.ep.instantiates"
            then: [{continue: true}]
          - if: "has(vars.ep.required_tasks) && vars.ep.required_tasks != null && (input.supported_tasks == null || !vars.ep.required_tasks.exists(t, t in input.supported_tasks))"
            then: [{continue: true}]
          - set: {vars.out: "= vars.out + [vars.name]"}
      - return: {plugins: "= vars.out", warned: false}
  - component: filesystem-resolver
    name: register-filesystem-resolver
    kind: function
    summary: "General plugin lora_filesystem_resolver: register a FilesystemResolver over VLLM_LORA_RESOLVER_CACHE_DIR."
    sources: ["pyproject.toml:46", "vllm/plugins/lora_resolvers/filesystem_resolver.py:49-61"]
    response: {type: object, properties: {registered: {type: boolean}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "Unset cache dir: nothing registered"
        source: "vllm/plugins/lora_resolvers/filesystem_resolver.py:51-52"
        if: "!('vllm-lora-resolver-cache-dir' in config) || config['vllm-lora-resolver-cache-dir'] == null || config['vllm-lora-resolver-cache-dir'] == ''"
        then: [{return: {registered: false}}]
      - call: local-disk.stat
        input: {path: "= config['vllm-lora-resolver-cache-dir']"}
        as: st
      - title: "The cache dir must exist and be a directory"
        source: "vllm/plugins/lora_resolvers/filesystem_resolver.py:53-57"
        if: "!(vars.st.value.exists && vars.st.value.is_dir)"
        then:
          - fail: {code: value-error, status: 0, message: "VLLM_LORA_RESOLVER_CACHE_DIR must be set to a valid directory for Filesystem Resolver plugin to function"}
      - title: "LoRAResolverRegistry.register_resolver('Filesystem Resolver', ...)"
        source: "vllm/plugins/lora_resolvers/filesystem_resolver.py:58-59"
        call: lora-resolver-registry.register-resolver
        input: {resolver_name: Filesystem Resolver}
      - return: {registered: true}
  - component: hf-hub
    name: list-repo-files
    kind: http
    summary: "HfApi.list_repo_files (shared infrastructure). Rows of `repos` are keyed by repo id; a missing repo lists no files."
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [repo_id], properties: {repo_id: {type: string}}}
    response: {type: object, properties: {files: {type: array, items: {type: string}}}}
    store: {table: repos, op: get, key: "= input.repo_id", default: {files: []}}
  - component: hf-hub
    name: snapshot-download
    kind: http
    summary: "HfApi.snapshot_download (shared infrastructure): the downloaded repo, with each adapter directory's adapter_config.json."
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [repo_id], properties: {repo_id: {type: string}, allow_patterns: {type: string}}}
    response: {type: object, properties: {files: {type: array}, adapter_configs: {type: object}}}
    store: {table: repos, op: get, key: "= input.repo_id", default: {files: [], adapter_configs: {}}}
  - component: hf-hub-resolver
    name: resolve-lora
    kind: function
    summary: "HfHubResolver.resolve_lora: match the LoRA name to an allowlisted repo, list the repo's adapter directories once, download only a directory that holds an adapter, then check its adapter_config like the filesystem resolver."
    sources: ["vllm/plugins/lora_resolvers/hf_hub_resolver.py:29-128", "vllm/plugins/lora_resolvers/filesystem_resolver.py:24-46"]
    attributes: {racy_in_code: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:41 checks self.adapter_dirs, then vllm/plugins/lora_resolvers/hf_hub_resolver.py:42 assigns it after an await, with no lock (two concurrent resolves of a new repo both list it)"}
    request:
      type: object
      required: [base_model_name, lora_name]
      properties:
        base_model_name: {type: string, examples: [ibm-granite/granite-3.3-8b-instruct]}
        lora_name: {type: string}
        repo_list: {type: array, items: {type: string}}
    response: {type: [object, "null"], default: null, properties: {lora_name: {type: string}, lora_path: {type: string}}}
    behavior:
      - title: "_resolve_repo: the first allowlisted repo that prefixes the name at a '/' boundary"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:62-77"
        set:
          vars.matches: "= input.repo_list.filter(r, input.lora_name.startsWith(r) && (size(input.lora_name) == size(r) || input.lora_name.substring(size(r), size(r) + 1) == '/'))"
      - set: {vars.repo: "= size(vars.matches) > 0 ? dyn(vars.matches[0]) : dyn(null)"}
      - title: "No allowlisted repo: None"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:47-48"
        if: "vars.repo == null"
        then: [{return: null}]
      - title: "First look at this repo: list its files and remember the adapter directories"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:41-42"
        if: "!(vars.repo in state.adapter_dirs)"
        then:
          - call: hf-hub.list-repo-files
            input: {repo_id: "= vars.repo"}
            as: files
          - title: "_get_adapter_dirs: dirname of every */adapter_config.json, '.' for one at the root"
            source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:110-128"
            set:
              state.adapter_dirs: "= merge(state.adapter_dirs, {vars.repo: vars.files.value.files.filter(f, f.endsWith('adapter_config.json')).map(f, f.contains('/') ? f.substring(0, f.lastIndexOf('/')) : '.')})"
      - title: "_resolve_repo_subpath: the repo root ('.') or the subpath without trailing slashes"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:91-100"
        set:
          vars.sub: "= input.lora_name == vars.repo || (size(input.lora_name) == size(vars.repo) + 1 && input.lora_name.endsWith('/')) ? '.' : (input.lora_name.endsWith('/') ? input.lora_name.substring(size(vars.repo) + 1, size(input.lora_name) - 1) : input.lora_name.substring(size(vars.repo) + 1))"
      - title: "Only a directory that holds an adapter is downloaded; anything else (a README, a missing adapter) is None"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:102-104"
        if: "!(vars.sub in state.adapter_dirs[vars.repo])"
        then: [{return: null}]
      - title: "snapshot_download(repo_id, allow_patterns='<subpath>/*')"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:50-54"
        call: hf-hub.snapshot-download
        input: {repo_id: "= vars.repo", allow_patterns: "= vars.sub != '.' ? vars.sub + '/*' : '*'"}
        as: snap
      - set: {vars.cfg: "= vars.sub in vars.snap.value.adapter_configs ? vars.snap.value.adapter_configs[vars.sub] : {}"}
      - title: "_get_lora_req_from_path: a LoRA adapter for this base model becomes a LoRARequest"
        source: "vllm/plugins/lora_resolvers/filesystem_resolver.py:30-46"
        if: "has(vars.cfg.peft_type) && vars.cfg.peft_type == 'LORA' && has(vars.cfg.base_model_name_or_path) && vars.cfg.base_model_name_or_path == input.base_model_name"
        then:
          - return: {lora_name: "= input.lora_name", lora_path: "= 'hf-cache/models--' + vars.repo.replace('/', '--') + (vars.sub != '.' ? '/' + vars.sub : '')"}
      - return: null
  - component: hf-hub-resolver
    name: register-hf-hub-resolver
    kind: function
    summary: "General plugin lora_hf_hub_resolver: register only when VLLM_PLUGINS names it explicitly, since it downloads remote adapters."
    sources: ["pyproject.toml:47", "vllm/plugins/lora_resolvers/hf_hub_resolver.py:129-147"]
    response: {type: object, properties: {registered: {type: boolean}, warned: {type: boolean}}}
    behavior:
      - set:
          vars.repos: "= 'vllm-lora-resolver-hf-repo-list' in config ? config['vllm-lora-resolver-hf-repo-list'] : null"
          vars.enabled: "= 'vllm-plugins' in config && config['vllm-plugins'] != null && 'lora_hf_hub_resolver' in config['vllm-plugins']"
      - if: "vars.repos == null || vars.repos == ''"
        then: [{return: {registered: false, warned: false}}]
      - title: "Repo list set but the plugin isn't allowlisted: warn, don't register"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:136-142"
        if: "!vars.enabled"
        then: [{return: {registered: false, warned: true}}]
      - title: "HfHubResolver(repo_list.split(',')) registered as 'Hf Hub Resolver'"
        source: "vllm/plugins/lora_resolvers/hf_hub_resolver.py:143-145"
        call: lora-resolver-registry.register-resolver
        input: {resolver_name: Hf Hub Resolver}
      - return: {registered: true, warned: false}
  - component: io-processors
    name: get-io-processor
    kind: function
    summary: "get_io_processor: the plugin named at init or in the HF config's io_processor_plugin must be an installed vllm.io_processor_plugins entry."
    sources: ["vllm/plugins/io_processors/__init__.py:32-88", "vllm/plugins/io_processors/__init__.py:59"]
    request: {type: object, properties: {plugin_from_init: {type: [string, "null"], default: null}, hf_config_io_processor_plugin: {type: [string, "null"], default: null}}}
    response: {type: object, properties: {processor: {type: [string, "null"], default: null}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set: {vars.want: "= has(input.plugin_from_init) && input.plugin_from_init != null && input.plugin_from_init != '' ? input.plugin_from_init : (has(input.hf_config_io_processor_plugin) ? input.hf_config_io_processor_plugin : null)"}
      - title: "No IOProcessor requested by the model"
        source: "vllm/plugins/io_processors/__init__.py:52-54"
        if: "vars.want == null"
        then: [{return: {processor: null}}]
      - title: "Load group vllm.io_processor_plugins"
        source: "vllm/plugins/io_processors/__init__.py:59-61"
        call: plugins.load-plugins-by-group
        input: {group: vllm.io_processor_plugins}
        as: grp
      - set: {vars.loadable: "= vars.grp.value.plugins.transformMapEntry(k, v, has(v.returns) && v.returns != null ? {k: v.returns} : {})"}
      - title: "No IOProcessor plugins installed"
        source: "vllm/plugins/io_processors/__init__.py:73-77"
        if: "size(vars.loadable) == 0"
        then:
          - fail: {code: value-error, status: 0, message: "= 'No IOProcessor plugins installed but one is required (' + vars.want + ').'"}
      - title: "The requested plugin is not installed"
        source: "vllm/plugins/io_processors/__init__.py:79-84"
        if: "!(vars.want in vars.loadable)"
        then:
          - fail: {code: value-error, status: 0, message: "= 'The model requires the \\'' + vars.want + '\\' IO Processor plugin but it is not installed. Available plugins: [' + vars.loadable.map(k, '\\'' + k + '\\'').join(', ') + ']'"}
      - title: "resolve_obj_by_qualname(...) instantiates the selected processor"
        source: "vllm/plugins/io_processors/__init__.py:86-88"
        return: {processor: "= vars.loadable[vars.want]"}

  # ======================= envs =======================
  - component: envs
    name: getattr
    kind: function
    summary: "vllm.envs.__getattr__: evaluate an environment variable lazily (or from the cache after enable_envs_cache)."
    sources: ["vllm/envs.py:2291-2299"]
    request: {type: object, required: [name], properties: {name: {type: string, examples: [VLLM_TARGET_DEVICE]}}}
    response: {type: object, properties: {value: {}}}
    errors: [{code: attribute-error, status: 0, retryable: false}]
    behavior:
      - title: "Unknown name: AttributeError"
        source: "vllm/envs.py:2297-2299"
        if: "!(input.name in state.variables)"
        then:
          - fail: {code: attribute-error, status: 0, message: "= 'module \\'vllm.envs\\' has no attribute \\'' + input.name + '\\''"}
      - title: "functools.cache after enable_envs_cache(): the first value sticks"
        source: "vllm/envs.py:2320-2322"
        if: "state.cache_enabled && input.name in state.cache"
        then: [{return: {value: "= state.cache[input.name]", cached: true}}]
      - title: "get_env_or_set_default variables: generate and export a default on first read"
        source: "vllm/envs.py:2040-2043"
        if: "input.name in state.set_default"
        then:
          - call: envs.get-env-or-set-default
            input: {name: "= input.name"}
            as: gd
          - return: {value: "= vars.gd.value.value", cached: false}
      - title: "environment_variables[name]() reads os.environ now"
        source: "vllm/envs.py:2297-2298"
        return: {value: "= state.variables[input.name] in config ? config[state.variables[input.name]] : null", cached: false}
  - component: envs
    name: get-env-or-set-default
    kind: function
    summary: "get_env_or_set_default: the env value if set; else default_factory() (here _generate_shm_name), written back to os.environ so later reads and child processes agree."
    sources: ["vllm/envs.py:554-571", "vllm/envs.py:546-551"]
    request: {type: object, required: [name], properties: {name: {type: string, examples: [VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME]}}}
    response: {type: object, properties: {value: {type: string}, generated: {type: boolean}}}
    behavior:
      - set: {vars.cid: "= state.variables[input.name]"}
      - title: "os.getenv(env_name) is set"
        source: "vllm/envs.py:563-565"
        if: "vars.cid in config && config[vars.cid] != null"
        then: [{return: {value: "= config[vars.cid]", generated: false}}]
      - title: "Generated earlier in this process tree: os.environ already holds it"
        source: "vllm/envs.py:563-565"
        if: "input.name in state.environ"
        then: [{return: {value: "= state.environ[input.name]", generated: false}}]
      - title: "_generate_shm_name(): 'vllm_mm_' + urlsafe_b64encode(uuid4().bytes) without '=' padding (22 chars), 30 in all for macOS"
        detail: "The 16 random UUID bytes are modeled as 22 seeded random url-safe base64 characters."
        source: "vllm/envs.py:546-551"
        set:
          vars.alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
      - set:
          vars.name: "= 'vllm_mm_' + lists.range(22).map(i, vars.alphabet.charAt(random(64))).join('')"
      - title: "os.environ[env_name] = default_value"
        source: "vllm/envs.py:567-569"
        set: {state.environ: "= merge(state.environ, {input.name: vars.name})"}
      - return: {value: "= vars.name", generated: true}
  - component: envs
    name: enable-envs-cache
    kind: function
    summary: "enable_envs_cache: wrap __getattr__ in functools.cache and evaluate every variable once."
    sources: ["vllm/envs.py:2308-2326"]
    behavior:
      - title: "Already wrapped: no-op"
        source: "vllm/envs.py:2317-2319"
        if: "state.cache_enabled"
        then: [{return: {cached: "= size(state.cache)", already: true}}]
      - title: "Cache all environment variables"
        source: "vllm/envs.py:2320-2326"
        set:
          state.cache_enabled: true
          state.cache: "= state.variables.transformMap(k, v, v in config ? config[v] : null)"
      - return: {cached: "= size(state.variables)", already: false}
  - component: envs
    name: get-vllm-port
    kind: function
    summary: "get_vllm_port: VLLM_PORT as an int, None when unset; a URI value (Kubernetes service env) is refused with a hint."
    sources: ["vllm/envs.py:516-543"]
    response: {type: object, properties: {port: {type: [integer, "null"], default: null}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set: {vars.raw: "= 'vllm-port' in config ? config['vllm-port'] : null"}
      - title: "Unset: None"
        source: "vllm/envs.py:526-527"
        if: "vars.raw == null"
        then: [{return: {port: null}}]
      - title: "An integer string"
        source: "vllm/envs.py:531-532"
        if: "vars.raw.trim().matches('^[-+]?[0-9]+$')"
        then: [{return: {port: "= int(vars.raw.trim())"}}]
      - title: "A URI (e.g. tcp://10.0.0.1:5557 from Kubernetes service discovery)"
        source: "vllm/envs.py:536-542"
        if: "vars.raw.matches('^[A-Za-z][A-Za-z0-9+.-]*://')"
        then:
          - fail: {code: value-error, status: 0, message: "= 'VLLM_PORT \\'' + vars.raw + '\\' appears to be a URI. This may be caused by a Kubernetes service discovery issue,check the warning in: https://docs.vllm.ai/en/latest/configuration/env_vars.html'"}
      - title: "Neither an integer nor a URI"
        source: "vllm/envs.py:543"
        fail: {code: value-error, status: 0, message: "= 'VLLM_PORT \\'' + vars.raw + '\\' must be a valid integer'"}
  - component: envs
    name: env-with-choices
    kind: function
    summary: "env_with_choices validator, as used by VLLM_WORKER_MULTIPROC_METHOD (fork or spawn, default fork)."
    sources: ["vllm/envs.py:399-441", "vllm/envs.py:956-958"]
    response: {type: object, properties: {value: {type: string}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - set: {vars.raw: "= 'vllm-worker-multiproc-method' in config ? config['vllm-worker-multiproc-method'] : null"}
      - title: "Unset: the default"
        source: "vllm/envs.py:419-421"
        if: "vars.raw == null"
        then: [{return: {value: fork}}]
      - title: "A value outside the choices is refused"
        source: "vllm/envs.py:433-437"
        if: "!(vars.raw in ['spawn', 'fork'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Invalid value \\'' + vars.raw + '\\' for VLLM_WORKER_MULTIPROC_METHOD. Valid options: [\\'spawn\\', \\'fork\\'].'"}
      - return: {value: "= vars.raw"}

  # ======================= bench probe loop =======================
  - component: benchmarks-serve
    name: probe-loop
    kind: function
    summary: "benchmark().probe_loop: while the main workload runs, send single-token 'Hi' probes at --probe-request-rate and record them."
    sources: ["vllm/benchmarks/serve.py:990-1004", "vllm/benchmarks/serve.py:1006-1009"]
    response: {type: object, properties: {sent: {type: integer}, running: {type: boolean}}}
    behavior:
      - title: "The probe task is only created for a positive rate"
        source: "vllm/benchmarks/serve.py:1006-1009"
        if: "config['probe-request-rate'] <= 0"
        then: [{return: {sent: 0, running: false}}]
      - title: "while not probe_stop.is_set()"
        source: "vllm/benchmarks/serve.py:1000"
        if: "state.probe_stop"
        then: [{return: {sent: "= size(state.probe_outputs)", running: false}}]
      - title: "One probe: prompt 'Hi', prompt_len 1, output_len 1, no multimodal content"
        source: "vllm/benchmarks/serve.py:991-1003"
        call: openai-serving-completion.post-v1-completions
        input: {path: /v1/completions, headers: {}, body: {model: llama-8b, prompt: [Hi], max_tokens: 1}}
        as: out
        on_error: continue
      - set: {state.probe_outputs: "= state.probe_outputs + [{'success': vars.out.ok, 'latency_ms': vars.out.duration_ms}]"}
      - title: "await asyncio.sleep(1 / probe_request_rate)"
        source: "vllm/benchmarks/serve.py:999-1004"
        wait: "= int(1000.0 / double(config['probe-request-rate']))"
      - return: {sent: "= size(state.probe_outputs)", running: true}
  - component: benchmarks-serve
    name: probe-stats
    kind: function
    summary: "Probe statistics reported after the run: completed, failed and latency of successful probes."
    sources: ["vllm/benchmarks/serve.py:1240-1251"]
    response: {type: [object, "null"], properties: {probe_completed: {type: integer}, probe_failed: {type: integer}}}
    behavior:
      - title: "No probe task: no probe stats"
        source: "vllm/benchmarks/serve.py:1240-1243"
        if: "size(state.probe_outputs) == 0"
        then: [{return: null}]
      - title: "probe_completed counts successful probes, probe_failed the rest"
        source: "vllm/benchmarks/serve.py:1242-1247"
        return:
          probe_completed: "= size(state.probe_outputs.filter(o, o.success))"
          probe_failed: "= size(state.probe_outputs.filter(o, !o.success))"

  # ======================= snapshot server =======================
  - component: snapshot-server
    name: main
    kind: cli
    summary: "python -m vllm.snapshot.server: parse the control args, then the vllm serve args, then run the snapshot child."
    sources: ["vllm/snapshot/server.py:243-248", "vllm/snapshot/server.py:251-252"]
    request:
      type: object
      properties:
        release_timeout_s: {type: [number, "null"], default: null}
        grpc: {type: boolean, default: false}
        headless: {type: boolean, default: false}
        api_server_count: {type: [integer, "null"], default: null}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: snapshot-canary-error, status: 0, retryable: false}
      - {code: timeout-error, status: 0, retryable: false}
    behavior:
      - call: snapshot-server.parse-control-args
        input: {release_timeout_s: "= input.release_timeout_s != null ? input.release_timeout_s : config['release-timeout-s']"}
        as: control
      - title: "parse_vllm_args: the snapshot child needs a single HTTP frontend"
        source: "vllm/snapshot/server.py:189-190"
        if: "input.grpc || input.headless"
        then:
          - fail: {code: value-error, status: 0, message: snapshot server requires the HTTP frontend}
      - title: "parse_vllm_args: at most one API server"
        source: "vllm/snapshot/server.py:191-192"
        if: "input.api_server_count != null && input.api_server_count != 1"
        then:
          - fail: {code: value-error, status: 0, message: snapshot server supports one API server}
      - call: snapshot-server.run-vllm-snapshot-child
        input: {release_timeout_s: "= vars.control.value.release_timeout_s"}
        as: child
      - return: "= vars.child.value"
  - component: snapshot-server
    name: parse-control-args
    kind: function
    summary: "parse_control_args: --ready-file, --release-file, --release-timeout-s (default 900, must be positive)."
    sources: ["vllm/snapshot/server.py:72-90"]
    request: {type: object, properties: {release_timeout_s: {type: number}}}
    response: {type: object, properties: {release_timeout_s: {type: number}}}
    errors: [{code: value-error, status: 0, retryable: false}]
    behavior:
      - title: "release timeout must be positive"
        source: "vllm/snapshot/server.py:80-81"
        if: "input.release_timeout_s <= 0"
        then:
          - fail: {code: value-error, status: 0, message: release timeout must be positive}
      - return: {release_timeout_s: "= input.release_timeout_s"}
  - component: snapshot-server
    name: run-vllm-snapshot-child
    kind: function
    summary: "Boot the engine with sleep mode, run the canary, rehearse sleep/wake and compare, write the ready file, wait for the release marker, then serve."
    sources: ["vllm/snapshot/server.py:198-240"]
    request: {type: object, properties: {release_timeout_s: {type: number}}}
    response: {type: object, properties: {serving: {type: boolean}}}
    errors: [{code: snapshot-canary-error, status: 0, retryable: false}, {code: timeout-error, status: 0, retryable: false}]
    behavior:
      - title: "Canary: greedy single-token generation with logprobs"
        source: "vllm/snapshot/server.py:207-208"
        call: async-llm.generate
        input: {request_id: vllm-snapshot-canary, prompt_token_ids: [128000, 791, 6864, 315, 9822, 374], sampling_params: {temperature: 0.0, top_p: 1.0, max_tokens: 1, n: 1, seed: 0}, arrival_time: "= double(now) / 1000.0", priority: 0}
        as: canary
      - title: "Rehearsal: sleep(level=2), wake weights, reload, wake KV cache, canary again"
        source: "vllm/snapshot/server.py:209-212"
        call: async-llm.generate
        input: {request_id: vllm-snapshot-canary, prompt_token_ids: [128000, 791, 6864, 315, 9822, 374], sampling_params: {temperature: 0.0, top_p: 1.0, max_tokens: 1, n: 1, seed: 0}, arrival_time: "= double(now) / 1000.0", priority: 0}
        as: rehearsal
        on_error:
          - title: "Any rehearsal exception becomes SnapshotCanaryError"
            source: "vllm/snapshot/server.py:218-219"
            fail: {code: snapshot-canary-error, status: 0, message: snapshot rehearsal failed}
      - title: "oracles_match(oracle, rehearsal_oracle)"
        source: "vllm/snapshot/server.py:213-214"
        choice: rehearsal_matches
        default: "yes"
        options:
          "yes": []
          "no":
            - fail: {code: snapshot-canary-error, status: 0, message: snapshot rehearsal changed canary output}
      - title: "wait_for_release_marker: poll every 50 ms until the timeout"
        source: "vllm/snapshot/server.py:158-175"
        choice: release_marker
        default: arrives
        options:
          arrives:
            - wait: 50
          never:
            - wait: "= int(double(input.release_timeout_s) * 1000.0)"
            - fail: {code: timeout-error, status: 0, message: release marker not found before timeout}
      - title: "Restore state and build_and_serve on the released host/port"
        source: "vllm/snapshot/server.py:227-240"
        return: {serving: true}

  # ======================= round 5: generation config, draft hf_overrides, CLI types, plugin registration =======================
  - component: hf-hub
    name: download-generation-config
    kind: http
    summary: "Fetch a model's generation_config.json (shared infrastructure). Rows of `generation_configs` are keyed by repo id; a repo without the file is not_found."
    sources: ["vllm/transformers_utils/config.py:1212-1239"]
    attributes: {boundary: true, owner: shared}
    request: {type: object, required: [model], properties: {model: {type: string, examples: [meta-llama/Llama-3.1-8B-Instruct]}}}
    response: {type: object, properties: {temperature: {type: number}, top_p: {type: number}, top_k: {type: integer}, repetition_penalty: {type: number}, max_new_tokens: {type: integer}}}
    errors: [{code: not_found, status: 404, retryable: false}]
    store: {table: generation_configs, op: get, key: "= input.model", not_found: not_found}
  - component: model-config
    name: get-diff-sampling-param
    kind: function
    summary: "ModelConfig.get_diff_sampling_param: the sampling defaults from the model's generation config ('auto') or a directory, with --override-generation-config applied; 'vllm' means none. Only the eight sampling keys are kept, max_new_tokens becomes max_tokens, and a non-empty result is logged as an override."
    sources: ["vllm/config/model.py:1847-1901", "vllm/config/model.py:1812-1845"]
    request: {type: object, properties: {}}
    response:
      type: object
      properties:
        temperature: {type: number, examples: [0.6]}
        top_p: {type: number, examples: [0.9]}
        top_k: {type: integer}
        min_p: {type: number}
        repetition_penalty: {type: number}
        presence_penalty: {type: number}
        frequency_penalty: {type: number}
        max_tokens: {type: integer}
    behavior:
      - set:
          vars.src: "= config['generation-config']"
          vars.model: "= config['model']"
          vars.cfg: {}
      - title: "src 'vllm': no generation config is read; otherwise try_get_generation_config (the model's, or the given directory's)"
        source: "vllm/config/model.py:1864"
        if: "vars.src != 'vllm'"
        then:
          - title: "GenerationConfig.from_pretrained; a missing file falls back to GenerationConfig.from_model_config, whose diff dict has no sampling keys"
            source: "vllm/transformers_utils/config.py:1220-1239"
            call: hf-hub.download-generation-config
            input: {model: "= vars.src == 'auto' ? vars.model : vars.src"}
            as: gc
            on_error: continue
          - if: "vars.gc.ok"
            then:
              - set: {vars.cfg: "= vars.gc.value"}
      - title: "config.update(self.override_generation_config)"
        source: "vllm/config/model.py:1867"
        set:
          vars.cfg: "= merge(vars.cfg, config['override-generation-config'])"
          vars.out: {}
          vars.repr: []
      - title: "Keep the available sampling params that are set, in this order"
        source: "vllm/config/model.py:1869-1882"
        foreach: "= ['repetition_penalty', 'presence_penalty', 'frequency_penalty', 'temperature', 'top_k', 'top_p', 'min_p', 'max_new_tokens']"
        as: p
        steps:
          - if: "vars.p in vars.cfg && vars.cfg[vars.p] != null && vars.p != 'max_new_tokens'"
            then:
              - set:
                  vars.out: "= merge(vars.out, {vars.p: vars.cfg[vars.p]})"
                  vars.repr: "= vars.repr + ['\\'' + vars.p + '\\': ' + string(vars.cfg[vars.p])]"
      - title: "HF's max_new_tokens is vLLM's max_tokens (popped and re-added last)"
        source: "vllm/config/model.py:1883-1888"
        if: "'max_new_tokens' in vars.cfg && vars.cfg['max_new_tokens'] != null"
        then:
          - set:
              vars.out: "= merge(vars.out, {'max_tokens': vars.cfg['max_new_tokens']})"
              vars.repr: "= vars.repr + ['\\'max_tokens\\': ' + string(vars.cfg['max_new_tokens'])]"
      - title: "A non-empty diff (src not 'vllm') is logged once"
        source: "vllm/config/model.py:1892-1899"
        if: "size(vars.out) > 0 && vars.src != 'vllm'"
        then:
          - set:
              ctx.generation_config_override_warning: true
              ctx.generation_config_override_warning_text: "= 'Default vLLM sampling parameters have been overridden by ' + (vars.src == 'auto' ? 'the model\\'s `generation_config.json`' : vars.src) + ': `{' + vars.repr.join(', ') + '}`. If this is not intended, please relaunch vLLM instance with `--generation-config vllm`.'"
      - return: "= vars.out"
  - component: speculative-config
    name: compose-draft-hf-overrides
    kind: function
    summary: "SpeculativeConfig.compose_draft_hf_overrides: the draft ModelConfig's hf_overrides. A dict (or None) on the target is a target-only key patch and is not forwarded: the draft gets only hf_config_override (the arch mapping). A callable is composed after it with functools.partial."
    sources: ["vllm/config/speculative.py:1083-1107", "vllm/config/speculative.py:1075-1081"]
    request:
      type: object
      properties:
        target_hf_overrides: {type: [object, string, "null"], default: null, description: "a dict, None, or (a string) the qualname of a callable"}
    response: {type: object, properties: {override: {type: string}, composes: {type: [string, "null"], default: null}}}
    behavior:
      - set: {vars.t: "= has(input.target_hf_overrides) ? input.target_hf_overrides : null"}
      - title: "not callable(target_hf_overrides): only the arch mapping"
        source: "vllm/config/speculative.py:1102-1103"
        if: "vars.t == null || type(vars.t) != string"
        then: [{return: {override: SpeculativeConfig.hf_config_override, composes: null}}]
      - title: "A callable: functools.partial(SpeculativeConfig._apply_composed_hf_override, target_hf_overrides): the arch mapping, then the target's transform"
        source: "vllm/config/speculative.py:1105-1107"
        return: {override: "= 'functools.partial(SpeculativeConfig._apply_composed_hf_override, ' + vars.t + ')'", composes: "= vars.t"}
  - component: engine-args
    name: add-cli-args
    kind: function
    summary: "The argparse type EngineArgs.add_cli_args (_compute_kwargs) registers for an int engine arg, applied to its command-line text: --max-model-len takes human_readable_int_or_auto (-1/auto, 1k = 1000, 1K = 1024), the token budgets take human_readable_int; a bad value exits argparse with status 2."
    sources: ["vllm/engine/arg_utils.py:389-405", "vllm/utils/argparse_utils.py:29-93"]
    request: {type: object, required: [name, value], properties: {name: {type: string, examples: [max_model_len]}, value: {type: string, examples: [128K]}}}
    response: {type: object, properties: {value: {type: integer}}}
    errors: [{code: system-exit, status: 0, retryable: false}]
    behavior:
      - set:
          vars.v: "= input.value.trim()"
          vars.flag: "= '--' + input.name.replace('_', '-')"
          vars.fn: "= input.name == 'max_model_len' ? 'human_readable_int_or_auto' : (input.name in ['max_num_batched_tokens', 'max_num_scheduled_tokens', 'kv_cache_memory_bytes', 'safetensors_prefetch_block_size', 'max_num_queued_tokens'] ? 'human_readable_int' : 'int')"
      - title: "human_readable_int_or_auto: '-1' or 'auto' (any case) is -1, auto-fit"
        source: "vllm/utils/argparse_utils.py:89-90"
        if: "vars.fn == 'human_readable_int_or_auto' && (vars.v == '-1' || vars.v.lowerAscii() == 'auto')"
        then: [{return: {value: -1}}]
      - title: "<number><suffix>: k/m/g/t are decimal (decimals allowed), K/M/G/T binary (integers only)"
        source: "vllm/utils/argparse_utils.py:41-70"
        if: "vars.fn != 'int' && vars.v.matches('^[0-9]+(\\\\.[0-9]+)?[kKmMgGtT]$')"
        then:
          - set:
              vars.num: "= vars.v.substring(0, size(vars.v) - 1)"
              vars.suf: "= vars.v.substring(size(vars.v) - 1)"
          - if: "vars.suf in ['k', 'm', 'g', 't']"
            then:
              - return: {value: "= int(double(vars.num) * double({'k': 1000, 'm': 1000000, 'g': 1000000000, 't': 1000000000000}[vars.suf]))"}
          - title: "int(number) fails on a decimal: ArgumentTypeError, reported by argparse"
            source: "vllm/utils/argparse_utils.py:62-70"
            if: "vars.num.contains('.')"
            then:
              - fail: {code: system-exit, status: 0, message: "= 'argument ' + vars.flag + ': Decimals are not allowed with binary suffixes like ' + vars.suf + '. Did you mean to use ' + vars.num + vars.suf.lowerAscii() + ' instead?'"}
          - return: {value: "= int(vars.num) * {'K': 1024, 'M': 1048576, 'G': 1073741824, 'T': 1099511627776}[vars.suf]"}
      - title: "A plain number: int(value); anything else is argparse's invalid-value error"
        source: "vllm/utils/argparse_utils.py:72-73"
        if: "!vars.v.matches('^[-+]?[0-9]+$')"
        then:
          - fail: {code: system-exit, status: 0, message: "= 'argument ' + vars.flag + ': invalid ' + vars.fn + ' value: \\'' + input.value + '\\''"}
      - return: {value: "= int(vars.v)"}
  - component: model-registry
    name: register-model
    kind: function
    summary: "Register an out-of-tree architecture (models-layers' contract; a general plugin calls it)."
    sources: ["vllm/model_executor/models/registry.py:1132-1175"]
    attributes: {boundary: true, owner: models-layers}
    request: {type: object, required: [model_arch, model_cls], properties: {model_arch: {type: string, examples: [MyLlamaForCausalLM]}, model_cls: {type: string, examples: ["my_plugin.models:MyLlamaForCausalLM"]}}}
    response: {type: object, properties: {registered: {type: string}, overwritten: {type: boolean}}}
    errors: [{code: value-error, status: 0, retryable: false}]

flows:
  - id: config-create-engine-config
    name: "vllm serve: EngineArgs -> VllmConfig"
    description: "Resolve the engine args of a vllm serve deployment into the VllmConfig every other area reads."
    sources: ["vllm/engine/arg_utils.py:2205-2872", "vllm/entrypoints/launchers/api_server/entry.py:83"]
    tags: [writes]
    entry:
      caller: operator
      interface: engine-args.create-engine-config
      input:
        model: "= config['model']"
        usage_context: OPENAI_API_SERVER
        runner: auto
        max_model_len: null
        tensor_parallel_size: "= config['tensor-parallel-size']"
        pipeline_parallel_size: 1
        data_parallel_size: 1
        data_parallel_hybrid_lb: false
        data_parallel_external_lb: false
        data_parallel_backend: mp
        nnodes: 1
        distributed_executor_backend: null
        block_size: null
        gpu_memory_utilization: "= config['gpu-memory-utilization']"
        enable_prefix_caching: "= config['enable-prefix-caching'] ? dyn(null) : dyn(false)"
        enable_chunked_prefill: "= config['enable-chunked-prefill'] ? dyn(null) : dyn(false)"
        max_num_seqs: null
        max_num_batched_tokens: null
        performance_mode: balanced
        speculative_config: null
        enable_return_routed_experts: false
        enable_expert_parallel: "= config['enable-expert-parallel']"
        enable_eplb: "= config['enable-eplb']"
        optimization_level: "= int(config['optimization-level'])"
        quantization: "= 'quantization' in config ? config['quantization'] : null"
        kv_cache_dtype: "= config['kv-cache-dtype']"
        hf_overrides: "= config['hf-overrides']"
  - id: config-current-vllm-config
    name: "Read the current VllmConfig inside set_current_vllm_config"
    sources: ["vllm/config/vllm.py:3421-3491"]
    entry: {caller: operator, interface: vllm-config.set-current-vllm-config, input: {prefix: null}}
  - id: config-get-current-vllm-config
    name: "get_current_vllm_config() read path"
    sources: ["vllm/config/vllm.py:3480-3490"]
    entry: {caller: operator, interface: vllm-config.get-current-vllm-config}
  - id: config-platform-detect
    name: "Resolve current_platform"
    sources: ["vllm/platforms/__init__.py:240-326"]
    tags: [writes]
    entry: {caller: operator, interface: platforms.getattr, input: {name: current_platform}}
  - id: config-general-plugins
    name: "Load vllm.general_plugins (once per process)"
    sources: ["vllm/plugins/__init__.py:77-90", "pyproject.toml:45-47"]
    tags: [writes]
    entry: {caller: operator, interface: plugins.load-general-plugins}
  - id: config-endpoint-plugins
    name: "Load endpoint plugins in the API server"
    sources: ["vllm/plugins/__init__.py:93-159"]
    entry: {caller: operator, interface: plugins.load-endpoint-plugins, input: {supported_tasks: [generate]}}
  - id: config-io-processor
    name: "Select a model's IOProcessor plugin"
    sources: ["vllm/plugins/io_processors/__init__.py:32-88"]
    entry: {caller: operator, interface: io-processors.get-io-processor, input: {plugin_from_init: null, hf_config_io_processor_plugin: null}}
  - id: config-envs
    name: "Read environment variables (lazy, then cached)"
    sources: ["vllm/envs.py:2291-2326"]
    tags: [writes]
    entry: {caller: operator, interface: envs.enable-envs-cache}
  - id: config-envs-getattr
    name: "envs.__getattr__"
    sources: ["vllm/envs.py:2291-2299"]
    entry: {caller: operator, interface: envs.getattr, input: {name: VLLM_TARGET_DEVICE}}
  - id: config-vllm-cli
    name: "The vllm console script"
    sources: ["pyproject.toml:43", "vllm/entrypoints/cli/main.py:39-120"]
    tags: [writes]
    entry:
      caller: operator
      interface: console-scripts.vllm
      input:
        subcommand: serve
        engine_args:
          model: meta-llama/Llama-3.1-8B-Instruct
          usage_context: OPENAI_API_SERVER
          runner: auto
          max_model_len: null
          tensor_parallel_size: 1
          pipeline_parallel_size: 1
          data_parallel_size: 1
          data_parallel_hybrid_lb: false
          data_parallel_external_lb: false
          data_parallel_backend: mp
          nnodes: 1
          distributed_executor_backend: null
          block_size: null
          gpu_memory_utilization: 0.92
          enable_prefix_caching: null
          enable_chunked_prefill: null
          max_num_seqs: null
          max_num_batched_tokens: null
          performance_mode: balanced
          speculative_config: null
          enable_return_routed_experts: false
  - id: config-bench-probe-loop
    name: "vllm bench serve probe loop"
    sources: ["vllm/benchmarks/serve.py:990-1009"]
    tags: [writes]
    entry: {caller: operator, interface: benchmarks-serve.probe-loop, repeat: {count: 3}}
  - id: config-snapshot-server
    name: "Snapshot server child"
    sources: ["vllm/snapshot/server.py:251-252"]
    entry: {caller: operator, interface: snapshot-server.main, input: {grpc: false, headless: false, api_server_count: null}}
  - id: config-xpu-mem-info
    name: "XPU memory info"
    sources: ["vllm/platforms/xpu.py:31-100"]
    entry: {caller: operator, interface: xpu.get-mem-info-wrapper, input: {device: null}}
  - id: config-compile-cache-key
    name: "VllmConfig.compute_hash: the compile-cache key of the resolved config"
    description: "The key the torch.compile cache directory is named by; it changes with every factor that changes the compiled graph and with nothing else."
    sources: ["vllm/config/vllm.py:449-565"]
    entry: {caller: operator, interface: vllm-config.compute-hash, input: {include_version: true}}
  - id: config-asset-image
    name: "ImageAsset(name).pil_image: download once into the assets cache"
    sources: ["vllm/assets/image.py:42-48", "vllm/assets/base.py:21-39"]
    tags: [writes]
    entry: {caller: operator, interface: image-asset.pil-image, input: {name: stop_sign}}
  - id: config-envs-list
    name: "A comma-separated environment variable with choices"
    sources: ["vllm/envs.py:444-496"]
    entry: {caller: operator, interface: envs.env-list-with-choices, input: {env_name: TEST_ENV, default: [default], choices: [option1, option2]}}

scenarios:
  # ---------------- EngineArgs -> VllmConfig ----------------
  - id: config-create-engine-config-serve-h100
    flow: config-create-engine-config
    name: "vllm serve on one 80 GB H100: derived max_model_len, serving batch defaults"
    fixtures: [tp1-llama-8b]
    expect:
      - "result.ok"
      - "result.value.model_config.max_model_len == config['max-model-len'] && result.value.model_config.max_model_len == 131072"
      - "result.value.cache_config.block_size == config['block-size'] && !result.value.cache_config.user_specified_block_size"
      - "result.value.cache_config.enable_prefix_caching == config['enable-prefix-caching'] && result.value.scheduler_config.enable_chunked_prefill == config['enable-chunked-prefill']"
      - "result.value.scheduler_config.max_num_seqs == 1024 && result.value.scheduler_config.max_num_batched_tokens == 8192"
      - "result.value.scheduler_config.max_num_seqs == config['max-num-seqs'] && result.value.scheduler_config.max_num_batched_tokens == config['max-num-batched-tokens']"
      - "result.value.parallel_config.world_size == 1 && result.value.parallel_config.distributed_executor_backend == 'uni'"
      - "result.value.parallel_config.worker_cls == 'vllm.v1.worker.gpu_worker.Worker' && result.value.platform == 'vllm.platforms.cuda.CudaPlatform'"
      - "calls['platforms.cuda-platform-plugin'] == 1 && calls['cuda-platform.check-and-update-config'] == 1"
  - id: config-create-engine-config-usage-none
    flow: config-create-engine-config
    name: "LLMEngine.from_engine_args (usage_context ENGINE_CONTEXT): no batch default applies, SchedulerConfig's class defaults 2048 / 128"
    fixtures: [tp1-llama-8b]
    input: {usage_context: ENGINE_CONTEXT}
    expect:
      - "result.ok"
      - "result.value.scheduler_config.max_num_seqs == 128 && result.value.scheduler_config.max_num_batched_tokens == 2048"
  - id: config-create-engine-config-a100
    flow: config-create-engine-config
    name: "An A100 80GB is excluded from the large serving defaults"
    fixtures: [tp1-llama-8b]
    state: {platforms: {host: {device_name: "NVIDIA A100-SXM4-80GB"}}}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 2048 && result.value.scheduler_config.max_num_seqs == 256"
  - id: config-create-engine-config-b200-llm-class
    flow: config-create-engine-config
    name: "LLM class on a >=160 GiB GPU: 16384 tokens, 1024 seqs"
    fixtures: [tp1-llama-8b]
    input: {usage_context: LLM_CLASS}
    state: {platforms: {host: {device_name: "NVIDIA B200", device_total_memory: 193273528320}}}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 16384 && result.value.scheduler_config.max_num_seqs == 1024"
  - id: config-create-engine-config-throughput
    flow: config-create-engine-config
    name: "performance_mode=throughput doubles both defaults"
    fixtures: [tp1-llama-8b]
    input: {performance_mode: throughput}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 16384 && result.value.scheduler_config.max_num_seqs == 2048"
  - id: config-create-engine-config-small-batch
    flow: config-create-engine-config
    name: "Explicit --max-num-seqs 2 --max-num-batched-tokens 64 are kept as given"
    fixtures: [small-batch-limits]
    input: {max_num_seqs: "= config['max-num-seqs']", max_num_batched_tokens: "= config['max-num-batched-tokens']"}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_seqs == 2 && result.value.scheduler_config.max_num_batched_tokens == 64"
  - id: config-create-engine-config-tp4-70b
    flow: config-create-engine-config
    name: "TP 4 on four GPUs: 64 heads split evenly, multiprocessing executor"
    fixtures: [tp4-llama-70b]
    input: {model: meta-llama/Llama-3.1-70B-Instruct}
    state: {platforms: {host: {device_count: 4}}}
    expect:
      - "result.ok && result.value.parallel_config.world_size == 4 && result.value.parallel_config.distributed_executor_backend == 'mp'"
      - "result.value.model_config.total_num_attention_heads == 64 && result.value.model_config.max_model_len == 131072"
  - id: config-create-engine-config-tp-heads-indivisible
    flow: config-create-engine-config
    name: "TP 3 cannot split 32 attention heads"
    fixtures: [tp1-llama-8b]
    input: {tensor_parallel_size: 3}
    state: {platforms: {host: {device_count: 4}}}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('must be divisible by tensor parallel size (3)')"
  - id: config-create-engine-config-world-exceeds-gpus
    flow: config-create-engine-config
    name: "TP 2 on a one-GPU node is refused before any worker starts"
    fixtures: [tp1-llama-8b]
    input: {tensor_parallel_size: 2}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('World size (2) is larger than the number of available GPUs (1)')"
  - id: config-create-engine-config-max-model-len-too-long
    flow: config-create-engine-config
    name: "--max-model-len above the derived 131072 is refused"
    fixtures: [tp1-llama-8b]
    input: {max_model_len: 200000}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('VLLM_ALLOW_LONG_MAX_MODEL_LEN=1')"
  - id: config-create-engine-config-allow-long-max-model-len
    flow: config-create-engine-config
    name: "VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 accepts it with a warning"
    fixtures: [tp1-llama-8b]
    config: {vllm-allow-long-max-model-len: true}
    input: {max_model_len: 200000}
    expect:
      - "result.ok && result.value.model_config.max_model_len == 200000 && ctx.long_max_model_len_warning"
  - id: config-create-engine-config-shorter-max-model-len
    flow: config-create-engine-config
    name: "--max-model-len 8192 below the derived length is kept"
    fixtures: [tp1-llama-8b]
    input: {max_model_len: 8192}
    expect:
      - "result.ok && result.value.model_config.max_model_len == 8192 && result.value.scheduler_config.max_model_len == 8192"
  - id: config-create-engine-config-unknown-model
    flow: config-create-engine-config
    name: "A model the hub doesn't have fails in get_config"
    fixtures: [tp1-llama-8b]
    input: {model: meta-llama/Llama-9-Nope}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('Invalid repository ID')"
  - id: config-create-engine-config-prefix-caching-off
    flow: config-create-engine-config
    name: "--no-enable-prefix-caching reaches the resolved CacheConfig"
    fixtures: [prefix-caching-off]
    expect:
      - "result.ok && !result.value.cache_config.enable_prefix_caching && result.value.scheduler_config.enable_chunked_prefill"
  - id: config-create-engine-config-no-chunked-prefill
    flow: config-create-engine-config
    name: "Chunked prefill off: the default budget grows to max_model_len, with a warning"
    fixtures: [tp1-llama-8b]
    input: {enable_chunked_prefill: false}
    expect:
      - "result.ok && !result.value.scheduler_config.enable_chunked_prefill"
      - "result.value.scheduler_config.max_num_batched_tokens == 131072"
      - "ctx.chunked_prefill_warning == 'disabling unsupported'"
  - id: config-create-engine-config-no-chunked-small-budget
    flow: config-create-engine-config
    name: "Chunked prefill off with an explicit 2048-token budget can't hold a 131072-token sequence"
    fixtures: [tp1-llama-8b]
    input: {enable_chunked_prefill: false, max_num_batched_tokens: 2048}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('is smaller than max_model_len (131072)')"
  - id: config-create-engine-config-budget-below-seqs
    flow: config-create-engine-config
    name: "max_num_batched_tokens below max_num_seqs"
    fixtures: [tp1-llama-8b]
    input: {max_num_batched_tokens: 64, max_num_seqs: 128}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('must be greater than or equal to max_num_seqs (128)')"
  - id: config-create-engine-config-gpu-util-invalid
    flow: config-create-engine-config
    name: "gpu_memory_utilization above 1 fails pydantic validation"
    fixtures: [tp1-llama-8b]
    input: {gpu_memory_utilization: 1.5}
    expect:
      - "!result.ok && result.error.code == 'validation-error'"
  - id: config-create-engine-config-dp-lb-conflict
    flow: config-create-engine-config
    name: "Hybrid and external DP load balancing together"
    fixtures: [tp1-llama-8b]
    input: {data_parallel_hybrid_lb: true, data_parallel_external_lb: true}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('cannot be enabled together')"
  - id: config-create-engine-config-nnodes-ray
    flow: config-create-engine-config
    name: "Multi-node with the ray DP backend"
    fixtures: [tp1-llama-8b]
    input: {nnodes: 2, data_parallel_backend: ray}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('requires `--data-parallel-backend mp`')"
  - id: config-create-engine-config-pp-unsupported-backend
    flow: config-create-engine-config
    name: "Pipeline parallelism with the uni executor"
    fixtures: [tp1-llama-8b]
    input: {pipeline_parallel_size: 2, distributed_executor_backend: uni}
    expect:
      - "!result.ok && result.error.code == 'not-implemented-error'"
  - id: config-create-engine-config-eagle3-draft
    flow: config-create-engine-config
    name: "An EAGLE3 draft with max_position_embeddings 2048 inherits the target's 131072"
    fixtures: [tp1-llama-8b]
    input: {speculative_config: {method: eagle3, model: yuhuili/EAGLE3-LLaMA3.1-Instruct-8B, num_speculative_tokens: 3}}
    state: {hf-hub: {models: {yuhuili/EAGLE3-LLaMA3.1-Instruct-8B: {architectures: [LlamaForCausalLMEagle3], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 2048}}}}
    expect:
      - "result.ok && result.value.speculative_config.draft_max_position_embeddings == 131072"
      - "ctx.spec_override_log.contains('from 2048')"
  - id: config-create-engine-config-draft-model
    flow: config-create-engine-config
    name: "An independent draft model keeps its own limit"
    fixtures: [tp1-llama-8b]
    input: {speculative_config: {method: draft_model, model: JackFram/llama-68m, num_speculative_tokens: 3}}
    state: {hf-hub: {models: {JackFram/llama-68m: {architectures: [LlamaForCausalLM], num_attention_heads: 12, num_key_value_heads: 12, max_position_embeddings: 2048}}}}
    expect:
      - "result.ok && result.value.speculative_config.draft_max_position_embeddings == 2048"
      - "calls['speculative-config.maybe-override-draft-max-position-embeddings'] == 0"
  - id: config-create-engine-config-unknown-draft
    flow: config-create-engine-config
    name: "A speculative draft repo that doesn't exist"
    fixtures: [tp1-llama-8b]
    input: {speculative_config: {method: eagle3, model: nobody/no-draft, num_speculative_tokens: 3}}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('nobody/no-draft')"
  - id: config-create-engine-config-cpu-target
    flow: config-create-engine-config
    name: "VLLM_TARGET_DEVICE=cpu: CPU platform, CPU batch defaults, block size 128"
    fixtures: [tp1-llama-8b]
    config: {vllm-target-device: cpu}
    expect:
      - "result.ok && result.value.platform == 'vllm.platforms.cpu.CpuPlatform' && result.value.device_config.device == 'cpu'"
