    state: {cpu-platform: {avx512_bf16_supported: true}}
    steps:
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: gdn_explicit_bf16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: bfloat16}, model_config: {model_type: qwen3_5, architecture: qwen3_5, has_inner_state: true, use_mla: false, layer_types: [linear_attention], state_dtype: bfloat16}}}
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: gdn_explicit_fp16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: float16}, model_config: {model_type: qwen3_5, architecture: qwen3_5, has_inner_state: true, use_mla: false, layer_types: [linear_attention], state_dtype: float16}}}
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: gdn_model_bf16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: bfloat16}, model_config: {model_type: qwen3_5, architecture: qwen3_5, has_inner_state: true, use_mla: false, layer_types: [linear_attention], state_dtype: bfloat16}}}
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: gdn_model_fp16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: float16}, model_config: {model_type: qwen3_5, architecture: qwen3_5, has_inner_state: true, use_mla: false, layer_types: [linear_attention], state_dtype: float16}}}
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: unsupported_model_bf16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: bfloat16}, model_config: {model_type: nemotron_h, architecture: nemotron_h, has_inner_state: true, use_mla: false, layer_types: [mamba], state_dtype: bfloat16}}}
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: unsupported_model_fp16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: float16}, model_config: {model_type: nemotron_h, architecture: nemotron_h, has_inner_state: true, use_mla: false, layer_types: [mamba], state_dtype: float16}}}
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: unsupported_explicit_bf16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: bfloat16}, model_config: {model_type: nemotron_h, architecture: nemotron_h, has_inner_state: true, use_mla: false, layer_types: [mamba], state_dtype: bfloat16}}}
      - {interface: cpu-platform.check-and-update-config, caller: operator, as: unsupported_explicit_fp16, input: {cache_config: {block_size: 16, user_specified_block_size: false, mamba_ssm_cache_dtype: float16}, model_config: {model_type: nemotron_h, architecture: nemotron_h, has_inner_state: true, use_mla: false, layer_types: [mamba], state_dtype: float16}}}
    expect:
