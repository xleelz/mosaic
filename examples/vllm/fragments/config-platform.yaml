      - "!steps.nochunk.result.ok && steps.nochunk.result.error.message.contains('is smaller than max_model_len (8192)')"
      - "steps.hs.result.error.code == 'validation-error' && steps.hsok.result.value.eager_host_mirror"
      - "steps.tri.result.value.value == 'triton' && steps.bad.result.error.message.contains('Unknown Mamba SSU backend')"
  - id: config-audio-video-assets
    name: "AudioAsset and VideoAsset: download once, then read the cached file; metadata samples frame indices; too few readable frames is refused"
    fixtures: [tp1-llama-8b]
    state:
      vllm-public-assets-s3:
        objects:
          multimodal_asset/winning_call.ogg: {size: 170000, content_type: audio/ogg, sample_rate: 16000}
      hf-hub:
        dataset_files:
          raushan-testing-hf/videos-test/sample_demo_1.mp4: {size: 1100000, frame_count: 7, fps: 3.5, width: 640, height: 360, readable_frames: 7}
    steps:
      - {interface: audio-asset.audio-and-sample-rate, caller: operator, as: a1, input: {name: winning_call}}
      - {interface: audio-asset.audio-and-sample-rate, caller: operator, as: a2, input: {name: winning_call}}
      - {interface: video-asset.get, caller: operator, as: meta, input: {name: baby_reading, num_frames: 4, view: metadata}}
      - {interface: video-asset.get, caller: operator, as: all, input: {name: baby_reading, view: metadata}}
      - {interface: video-asset.get, caller: operator, as: frames, input: {name: baby_reading, num_frames: 4, view: np_ndarrays}}
    expect:
      - "steps.a1.result.value.sample_rate == 16000 && steps.a2.result.value.sample_rate == 16000 && calls['vllm-public-assets-s3.get-object'] == 1"
      - "steps.meta.result.value.frames_indices == [0, 2, 4, 6] && steps.meta.result.value.duration == 2.0 && !steps.meta.result.value.do_sample_frames"
      - "steps.all.result.value.total_num_frames == 7 && steps.all.result.value.do_sample_frames && steps.frames.result.value.shape == [4, 360, 640, 3]"
      - "calls['hf-hub.download-dataset-file'] == 1"
      # the download-once cache is the point: the cached file carries the video's properties
      - "state['local-disk'].paths[config['vllm-assets-cache'] + '/video-example-data/sample_demo_1.mp4'].meta.frame_count == 7"
  - id: config-video-asset-unreadable
    name: "VideoAsset.np_ndarrays: a file with fewer readable frames than requested raises"
    fixtures: [tp1-llama-8b]
    state:
      hf-hub:
        dataset_files:
          raushan-testing-hf/videos-test/sample_demo_1.mp4: {size: 1100000, frame_count: 7, fps: 3.5, width: 640, height: 360, readable_frames: 3}
