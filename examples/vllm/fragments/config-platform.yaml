  - id: oracle-build-config-platform-1
    name: "tests/platforms/test_cpu.py:135 test_cpu_accelerated_gdn_dtype_policy (all 8 params)"
    description: "AVX-512 BF16 patched on; GDN (qwen3_5, linear attention) keeps a 16-bit SSM cache, nemotron_h (mamba layers) is reset to float32. The fake model class reports the cache dtype as its state dtype."
