  # ---------------- object-storage shm name ----------------
  - id: config-envs-shm-name
    name: "Write then read: the generated VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME is exported and read back unchanged"
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: config-envs-getattr, as: first, input: {name: VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME}}
      - {flow: config-envs-getattr, as: second, input: {name: VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME}}
      - {flow: config-envs-getattr, as: ips, input: {name: VLLM_RAY_DP_PLACEMENT_NODE_IPS}}
    expect:
      # the write is the scenario's point: state is the only place the guard / export is visible
      - "state.envs.environ.VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME == steps.first.result.value.value"
      - "steps.first.result.value.value.startsWith('vllm_mm_') && size(steps.first.result.value.value) == 30"
      - "steps.second.result.value.value == steps.first.result.value.value"
      - "steps.ips.result.ok && steps.ips.result.value.value == ''"
  - id: config-envs-shm-name-set
    name: "An explicit VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME is used as is"
    fixtures: [tp1-llama-8b]
    config: {vllm-object-storage-shm-buffer-name: vllm_mm_custom}
    steps:
      - {flow: config-envs-getattr, as: n, input: {name: VLLM_OBJECT_STORAGE_SHM_BUFFER_NAME}}
    expect:
      - "steps.n.result.value.value == 'vllm_mm_custom'"
  - id: config-attn-backend-probe-failures
    name: "Probe failures: an ImportError on FlashAttention is recorded and FlashInfer wins; a selected backend that fails to import is a ValueError; any other probe error propagates"
    fixtures: [full-tp1-llama-8b]
    faults:
      - {target: attention-backend.validate-configuration, type: error, code: import-error, message: "ImportError: flash_attn not built", calls: [1, 6]}
      - {target: attention-backend.validate-configuration, type: error, code: os-error, message: "libcuda.so not found", calls: [7]}
      - {target: attention-backend.validate-configuration, type: error, code: runtime-error, message: "CUDA error", calls: [8, 9]}
    steps:
      - {interface: cuda-platform.get-attn-backend-cls, caller: operator, as: fallback, input: {attn_selector_config: {head_size: 128, dtype: bfloat16, kv_cache_dtype: auto}}}
      - {interface: cuda-platform.get-attn-backend-cls, caller: operator, as: sel, input: {selected_backend: FLASH_ATTN, attn_selector_config: {head_size: 128, dtype: bfloat16}}}
      - {interface: cuda-platform.get-attn-backend-cls, caller: operator, as: selos, input: {selected_backend: FLASH_ATTN, attn_selector_config: {head_size: 128, dtype: bfloat16}}}
      - {interface: cuda-platform.get-attn-backend-cls, caller: operator, as: other, input: {attn_selector_config: {head_size: 128, dtype: bfloat16}}}
      - {interface: cuda-platform.get-attn-backend-cls, caller: operator, as: selother, input: {selected_backend: TRITON_ATTN, attn_selector_config: {head_size: 128, dtype: bfloat16}}}
    expect:
      - "!steps.selother.result.ok && steps.selother.result.error.code == 'runtime-error'"
      - "steps.fallback.result.ok && steps.fallback.result.value.backend_cls_path.endsWith('FlashInferBackend')"
      - "!steps.sel.result.ok && steps.sel.result.error.code == 'value-error' && steps.sel.result.error.message.contains('ImportError')"
      - "!steps.selos.result.ok && steps.selos.result.error.message.contains('OSError: libcuda.so not found')"
      - "!steps.other.result.ok && steps.other.result.error.code == 'runtime-error'"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'attention-backend.validate-configuration').size() == 9"
  - id: config-fuse-act-quant-world
    name: "fuse-act-quant: the default world's derived value matches kernels-ops' config; an NVFP4 checkpoint in that world is flagged, and a world declaring true agrees"
    fixtures: [tp1-llama-8b]
    state:
      hf-hub:
        models:
          acme/llama-8b-modelopt-nvfp4: {architectures: [LlamaForCausalLM], num_attention_heads: 32, num_key_value_heads: 8, max_position_embeddings: 131072, quantization_config: {quant_method: modelopt, quantization: {quant_algo: NVFP4}}}
    steps:
      - {flow: config-create-engine-config, as: dflt}
