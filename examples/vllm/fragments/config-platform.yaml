    expect:
      - "trace.exists(e, e.type == 'choice' && e.option == 'no')"
      - "!result.ok && result.error.code == 'snapshot-canary-error' && result.error.message.contains('changed canary output')"
  - id: config-snapshot-server-rehearsal-raises
    flow: config-snapshot-server
    name: "The rehearsal canary raises: SnapshotCanaryError"
    fixtures: [full-tp1-llama-8b]
    faults:
      - {target: async-llm.generate, type: error, code: engine-dead-error, status: 500, calls: [2]}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'async-llm.generate' && e.error != null)"
      - "!result.ok && result.error.code == 'snapshot-canary-error' && result.error.message == 'snapshot rehearsal failed'"
  - id: config-snapshot-server-release-timeout
    flow: config-snapshot-server
    name: "No release marker within --release-timeout-s"
