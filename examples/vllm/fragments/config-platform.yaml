      - "steps.gdn_explicit_fp16.result.value.mamba_ssm_cache_dtype == 'float16'"
      - "steps.gdn_model_bf16.result.value.mamba_ssm_cache_dtype == 'bfloat16'"
      - "steps.gdn_model_fp16.result.value.mamba_ssm_cache_dtype == 'float16'"
