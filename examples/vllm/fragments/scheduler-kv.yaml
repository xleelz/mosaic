    summary: "File-system tier IO pool: load-priority and store-priority threads over a load queue and a store queue."
    sources: ["vllm/v1/kv_offload/tiering/fs/thread_pool.py:60-194"]
    state:
      schema: {type: object, properties: {load_q: {type: array}, store_q: {type: array}, jobs: {type: object}, finished_q: {type: array}, inflight_jobs: {type: integer}, stop: {type: boolean}}}
      initial: {load_q: [], store_q: [], jobs: {}, finished_q: [], inflight_jobs: 0, stop: false}

  # ------------------------------------------------------ round 4 coverage
  - id: encoder-cache-manager
    name: EncoderCacheManager
    kind: module
    parent: scheduler
    summary: "The scheduler's multimodal encoder cache: embeddings counted by mm_hash, shared between requests, reclaimed lazily (oldest unreferenced first) when space is needed."
    description: "Llama is text-only, so the default world never fills it; scheduler.reset-encoder-cache resets it after a weight update."
    attributes: {single_writer: "The engine-core busy-loop thread is the only caller: the Scheduler builds and owns it (vllm/v1/core/sched/scheduler.py:282-285) and only that thread calls the scheduler (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/core/encoder_cache_manager.py:16-92"]
    state:
      schema:
        type: object
        properties:
          cache_size: {type: integer}
          num_free_slots: {type: integer}
          num_freeable_slots: {type: integer}
          cached: {type: object, description: "mm_hash -> request ids referencing it (empty = reclaimable)"}
          num_embeds_by_hash: {type: object}
          request_cached_ids: {type: object, description: "request id -> input ids it holds"}
          freeable: {type: object, description: "mm_hash -> embeddings, insertion (eviction) order"}
          freed: {type: array, items: {type: string}}
      initial: {cache_size: 0, num_free_slots: 0, num_freeable_slots: 0, cached: {}, num_embeds_by_hash: {}, request_cached_ids: {}, freeable: {}, freed: []}
  - id: sliding-window-manager
    name: SlidingWindowManager
    kind: module
    parent: kv-cache-manager
    summary: "The sliding-window group's manager: a prefix hit only needs the last window's blocks (cached and contiguous), and blocks that fall out of the window are freed and replaced by the null block."
    description: "Used for sliding-window layers of hybrid models (e.g. Gemma, Mistral); Llama has no sliding-window group. req_to_blocks holds this group's block table, with 0 for a freed (null) slot."
    attributes: {single_writer: "The engine-core busy-loop thread is the only caller: other threads only put requests on the mutex-guarded input_queue, which the busy loop drains before each step (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:933-946"]
    state:
      schema: {type: object, properties: {req_to_blocks: {type: object}}}
      initial: {req_to_blocks: {}}
  - id: circular-buffer-manager
    name: CircularBufferManager
    kind: module
    parent: kv-cache-manager
    summary: "A group whose state lives in one ring block per request (circular-buffer attention): it never prefix-caches, never skips blocks, and needs one block only until the request holds its ring block."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1172-1192"]
    state:
      schema: {type: object, properties: {req_to_blocks: {type: object}}}
      initial: {req_to_blocks: {}}
  - id: rswa-manager
    name: RSWAManager
    kind: module
    parent: kv-cache-manager
    summary: "Reference sliding-window attention: a full-attention group that, once decoding, frees the gap between the prompt's blocks and the current window."
    attributes: {single_writer: "The engine-core busy-loop thread is the only caller: other threads only put requests on the mutex-guarded input_queue, which the busy loop drains before each step (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:887-899"]
    state:
      schema: {type: object, properties: {req_to_blocks: {type: object}}}
      initial: {req_to_blocks: {}}
  - id: chunked-local-attention-manager
    name: ChunkedLocalAttentionManager
    kind: module
    parent: kv-cache-manager
    summary: "Chunked local attention (Llama-4 iRoPE layers): blocks before the current attention chunk count as computed (null); only the chunk's blocks are looked up."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1263-1267"]
  - id: kv-cache-spec-registry
    name: KVCacheSpecRegistry
    kind: module
    parent: kv-cache-manager
    summary: "Maps each KV cache spec class (walking its MRO) to its single-type manager and uniform-type base spec; group roles can override the manager."
    sources: ["vllm/v1/kv_cache_spec_registry.py:39-60"]
    state:
      schema: {type: object, properties: {specs: {type: object}, roles: {type: object}}}
      initial: {specs: {}, roles: {}}
  - id: simple-cpu-offload-worker
    name: SimpleCPUOffloadWorker
    kind: module
    parent: kv-offload
    summary: "Worker side of the simple CPU offload connector: registers each layer's GPU KV region as a [num_blocks, block_bytes] view for the DMA backend."
    sources: ["vllm/v1/simple_kv_offload/worker.py:26-80"]
    state:
      schema: {type: object, properties: {gpu_kv_caches: {type: object}, total_bytes_per_block: {type: integer}}}
      initial: {gpu_kv_caches: {}, total_bytes_per_block: 0}
  - id: offloading-spec-factory
    name: OffloadingSpecFactory
    kind: module
    parent: kv-offload
    summary: "Registry of offloading specs by name (CPUOffloadingSpec, TieringOffloadingSpec); out-of-tree specs load from spec_module_path."
    sources: ["vllm/v1/kv_offload/factory.py:14-69"]
    state:
      schema: {type: object, properties: {registry: {type: object, description: "spec name -> module path"}}}
      initial: {registry: {CPUOffloadingSpec: vllm.v1.kv_offload.cpu.spec, TieringOffloadingSpec: vllm.v1.kv_offload.tiering.spec}}
  - id: cpu-offloading-spec
    name: CPUOffloadingSpec
    kind: module
    parent: kv-offload
    summary: "Sizes the CPU offload tier from cpu_bytes_to_use: the per-worker page, the page-aligned row (chunk) and the chunk count; builds the scheduler-side manager and the worker."
    sources: ["vllm/v1/kv_offload/cpu/spec.py:43-46", "vllm/v1/kv_offload/base.py:595-627"]
    state:
      schema: {type: object, properties: {num_chunks: {type: integer}, kv_bytes_per_chunk: {type: integer}, cpu_page_size_per_worker: {type: integer}, replicated_layout: {type: boolean}, eviction_policy: {type: string}}}
      initial: {num_chunks: 0, kv_bytes_per_chunk: 0, cpu_page_size_per_worker: 0, replicated_layout: false, eviction_policy: lru}
  - id: cpu-offloading-manager
    name: CPUOffloadingManager (CPUPrimaryTierOffloadingManager)
    kind: module
    parent: kv-offload
    summary: "Scheduler-side tracker of the CPU tier: which chunk keys are stored (ready) or being written, their ref counts, the chunk pool and LRU eviction."
    description: >-
      chunks maps an offload key to {chunk_id, ref_cnt}; ref_cnt -1 means a write is in flight
      (ChunkStatus.is_ready is ref_cnt >= 0). lru lists the keys in LRU rank order, oldest first;
      the evictable ones are those with ref_cnt 0. The chunk pool hands out fresh ids
      0..num_chunks-1 first, then reuses freed ids (last freed first). req_access keeps the keys
      each request saw, for its recency update at finish.
    attributes: {single_writer: "Runs in the scheduler process on the engine-core busy-loop thread: the OffloadingConnector's scheduler side calls it from the scheduler's hooks (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/kv_offload/cpu/manager.py:47-123", "vllm/v1/kv_offload/cpu/policies/lru.py:16-90", "vllm/v1/kv_offload/cpu/policies/base.py:25-45"]
    state:
      schema:
        type: object
        properties:
          num_chunks: {type: integer}
          num_allocated: {type: integer}
          free_list: {type: array, items: {type: integer}}
          chunks: {type: object}
          lru: {type: array, items: {type: string}}
          num_write_pending: {type: integer}
          req_access: {type: object}
          events: {type: array}
          enable_events: {type: boolean}
          cache_generation: {type: integer}
      initial: {num_chunks: 0, num_allocated: 0, free_list: [], chunks: {}, lru: [], num_write_pending: 0, req_access: {}, events: [], enable_events: false, cache_generation: 0}
  - id: cpu-offloading-worker
    name: CPUOffloadingWorker
    kind: module
    parent: kv-offload
    summary: "Worker-side CPU offloading: queues GPU->CPU stores and CPU->GPU loads as async copies on CUDA streams and reports them in completion order."
    sources: ["vllm/v1/kv_offload/cpu/gpu_worker.py:764-880", "vllm/v1/kv_offload/base.py:568-590"]
    state:
      schema: {type: object, properties: {transfers: {type: array}}}
      initial: {transfers: []}
  - id: tiering-offloading-manager
    name: TieringOffloadingManager
    kind: module
    parent: kv-offload
    summary: "Composes the CPU primary tier with secondary tiers: stores cascade primary -> every secondary after the GPU->CPU write completes; a primary miss that a secondary holds is promoted back into the primary tier."
    description: "It also serves the ParentManager callbacks a tier uses for remotely originated requests (on_new_request, lookup, create_store_job, on_request_finished)."
    attributes: {single_writer: "Runs in the scheduler process on the engine-core busy-loop thread (all secondary-tier methods must be non-blocking for that reason, tiering/base.py:131-145; vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/kv_offload/tiering/manager.py:176-260", "vllm/v1/kv_offload/tiering/base.py:94-129"]
    state:
      schema:
        type: object
        properties:
          secondary_tiers: {type: array, items: {type: string}}
          jobs: {type: object}
          next_job_id: {type: integer}
          req_state: {type: object}
          pending_promotions: {type: array}
          load_sources: {type: object}
      initial: {secondary_tiers: [], jobs: {}, next_job_id: 0, req_state: {}, pending_promotions: [], load_sources: {}}
  - id: secondary-tier-factory
    name: SecondaryTierFactory
    kind: module
    parent: kv-offload
    summary: "Registry of secondary-tier managers by type (example, fs, p2p, obj, kvcr); out-of-tree tiers load from module_path."
    sources: ["vllm/v1/kv_offload/tiering/factory.py:38-49"]
    state:
      schema: {type: object, properties: {registry: {type: object, description: "tier type -> {module_path, class_name}"}}}
      initial:
        registry:
          example: {module_path: vllm.v1.kv_offload.tiering.example.manager, class_name: ExampleSecondaryTierManager}
          fs: {module_path: vllm.v1.kv_offload.tiering.fs.manager, class_name: FileSystemTierManager}
          p2p: {module_path: vllm.v1.kv_offload.tiering.p2p.manager, class_name: P2PSecondaryTierManager}
          obj: {module_path: vllm.v1.kv_offload.tiering.obj.manager, class_name: ObjectStoreSecondaryTierManager}
          kvcr: {module_path: vllm.v1.kv_offload.tiering.kvcr.manager, class_name: KVCRSecondaryTierManager}
  - id: example-secondary-tier-manager
    name: ExampleSecondaryTierManager
    kind: module
    parent: kv-offload
    summary: "The reference in-memory secondary tier (medium CPU, hits reported as HOST): a key set, with stores and loads completing at once."
    description: "Several tiers can exist; state.tiers is keyed by tier id, each with its type, chunk keys, completed jobs and block size (the primary view's row stride)."
    sources: ["vllm/v1/kv_offload/tiering/example/manager.py:37-82", "vllm/v1/kv_offload/tiering/base.py:131-189"]
    state:
      schema: {type: object, properties: {tiers: {type: object}}}
      initial: {tiers: {}}
  - id: p2p-secondary-tier-manager
    name: P2PSecondaryTierManager
    kind: module
    parent: kv-offload
    summary: "The P2P secondary tier: one session per remote peer (host:port) both loads blocks from and serves blocks to that peer over a ZMQ control connection; prefiller-side requests are bound to the session that fetched them; the NONE_HASH seed is resolved lazily and advertised in each session's handshake."
    description: "Single-threaded: every public method runs on the scheduler thread (manager.py:209-213). state.tiers is keyed by tier id: local_id, hash_seed (null until the first session), sessions (peer id -> {connected, local_hash_seed, finished}), kv_to_session (kv_request_id -> peer id), failed_req_ids, unbound_stores, unbound_store_timeout_s. The NIXL data transport and the wire protocol are not modeled."
    attributes: {single_writer: "The engine-core busy-loop thread is the only caller: other threads only put requests on the mutex-guarded input_queue, which the busy loop drains before each step (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/kv_offload/tiering/p2p/manager.py:202-345"]
    state:
      schema: {type: object, properties: {tiers: {type: object}}}
      initial: {tiers: {}}
  - id: zmq-transport
    name: ZmqTransport (P2P tier control plane)
