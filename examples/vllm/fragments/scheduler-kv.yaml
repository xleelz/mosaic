    state:
      schema: {type: object, properties: {lookup_state: {type: object}, lookup_batch: {type: array}, lookup_queue: {type: array}, pending_results: {type: array}, next_generation: {type: integer}, tier_keys: {type: object}}}
      initial: {lookup_state: {}, lookup_batch: [], lookup_queue: [], pending_results: [], next_generation: 0, tier_keys: {}}
  - id: dual-queue-thread-pool
    name: DualQueueThreadPool
    kind: module
