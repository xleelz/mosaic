  state:
    kv-cache-manager:
      kv_cache_groups:
      - name: attn
      - name: mamba
    full-attention-manager:
      req_to_blocks:
        r1:
        - 1
        - 2
      num_cached_block:
        r1: 2
    mamba-manager:
      req_to_blocks:
        r1:
        - 7
        - 9
      num_cached_block:
        r1: 1
  steps:
  - interface: kv-cache-manager.pop-blocks-for-free
