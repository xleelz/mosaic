        - l1
        layer_pages:
          l0: 4096
          l1: 4096
        layer_alignments:
          l1: 3072
  - interface: kv-cache-utils.get-kv-cache-config-from-groups
    caller: engine-core
    as: lbnhc
    input:
      available_memory: 92160
      layout: LBNHC
      kv_cache_groups:
      - layer_names:
        - mla
        layer_pages:
          mla: 8192
        block_stride_alignment: 1152
  - interface: kv-cache-utils.get-kv-cache-config-from-groups
    caller: engine-core
    as: lhbnc
