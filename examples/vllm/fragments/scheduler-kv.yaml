  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: scheduler.update-from-output
    caller: engine-core
    as: u1
    input:
      scheduler_output: = steps.s1.result.value
      model_runner_output:
        req_ids: = steps.s1.result.value.num_scheduled_tokens.transformList(k, v, k)
        sampled_token_ids: = steps.s1.result.value.num_scheduled_tokens.transformList(k, v, [])
  - flow: scheduler-schedule
    as: s2
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: c2
    input: {}
  - interface: encoder-cache-manager.compute-mm-encoder-budget
    caller: scheduler
    as: small
    input:
      mm_max_toks_per_item:
        image: 576
      max_num_batched_tokens: 100
  expect:
  - size(steps.s1.result.value.scheduled_new_reqs) == 1 && size(steps.s1.result.value.scheduled_cached_reqs.req_ids) == 0 && size(steps.s1.result.value.finished_req_ids) == 0
  - steps.s1.result.value.num_scheduled_tokens['0'] == 400
  - steps.c2.result.value.num_running == 1 && size(steps.s2.result.value.scheduled_new_reqs) == 0 && size(steps.s2.result.value.scheduled_cached_reqs.req_ids) == 1 && size(steps.s2.result.value.finished_req_ids) == 0
  - steps.s2.result.value.num_scheduled_tokens['0'] == 800
  - steps.small.result.error.code == 'value-error'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'encoder-cache-manager.compute-mm-encoder-budget')
- id: scheduler-kv-r5-test-4b
  name: 'No MM input chunking (warm encoder cache): the 400 text tokens first, then the whole 800-token image; a 100-token batch can''t hold a 576-token item'
  description: llava-1.5's image is 576 tokens, so the budget and cache are max(1024, 576) = 1024. The image is given 800 placeholder tokens, as in the test.
  fixtures:
  - tp1-llama-8b
  config:
    max-num-batched-tokens: 1024
    disable-chunked-mm-input: true
    max-model-len: 2048
    enable-prefix-caching: false
    async-scheduling: false
  steps:
  - interface: scheduler.init-encoder-cache
    caller: engine-core
    as: init
    input:
      mm_max_toks_per_item:
        image: 576
  - interface: encoder-cache-manager.allocate
    caller: scheduler
    as: prime
    input:
      request_id: cache-primer
      input_id: 0
      mm_hash: llava-img
      num_embeds: 800
  - interface: encoder-cache-manager.free
    caller: scheduler
    as: unprime
    input:
      request_id: cache-primer
      mm_hashes:
      - llava-img
