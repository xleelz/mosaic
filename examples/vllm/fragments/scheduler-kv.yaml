- id: scheduler-kv-add-request-then-schedule
  name: A new request is admitted and fully prefilled in one step
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
      - 1917
      - 13
      - 3639
      - 374
      - 279
      - 6864
      - 315
      - 9822
      - 30
      sampling_params:
        max_tokens: 16
      priority: 0
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: kv-cache-manager.get-block-ids
    caller: engine-core
    as: table
    input:
      request_id: chatcmpl-abc123
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.table.result.value.block_ids == [1]
  - steps.add.result.ok && steps.add.result.value.status == 'WAITING' && steps.add.result.value.num_block_hashes == 0
  - steps.s1.result.value.scheduled_new_reqs.size() == 1 && steps.s1.result.value.scheduled_new_reqs[0].req_id == 'chatcmpl-abc123'
  - steps.s1.result.value.num_scheduled_tokens['chatcmpl-abc123'] == 11 && steps.s1.result.value.total_num_scheduled_tokens == 11
  - steps.s1.result.value.scheduled_new_reqs[0].block_ids == [1]
  - 'steps.cnt.result.value == {''num_running'': 1, ''num_waiting'': 0}'
  - '// the async placeholder is the point: AsyncScheduler adds one per decoding request

    state.scheduler.requests[''chatcmpl-abc123''].num_output_placeholders == 1 && !state.scheduler.requests[''chatcmpl-abc123''].is_prefill_chunk'
- id: scheduler-kv-add-request-duplicate-id
  name: A second request with the same id trips the duplicate assertion
  fixtures:
  - tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.a1.result.ok
  - '!steps.a2.result.ok && steps.a2.result.error.code == ''assertion-error'' && steps.a2.result.error.message == ''duplicate request id'''
  - steps.cnt.result.value.num_waiting == 1
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.get-request-counts' && e.error == null)
- id: scheduler-kv-schedule-chunked-prefill
  name: A 200-token prompt prefills in 64-token chunks, then decodes
  fixtures:
  - small-batch-limits
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-long1
      prompt_segments:
      - key: doc-long
        num_tokens: 200
      sampling_params:
        max_tokens: 8
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-schedule
    as: s4
    input: {}
