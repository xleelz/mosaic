  expect:
  - steps.blhnc.result.value.bytes_per_block == 46080 && steps.blhnc.result.value.num_blocks == 3 && steps.blhnc.result.value.kv_cache_tensors.all(t, t.block_stride == 46080)
  - '// 8192 rounded up to lcm(1, 3072) = 3072 -> 9216; block-outer: every layer shares the 9216-byte block

    steps.bhlnc.result.value.bytes_per_block == 9216 && steps.bhlnc.result.value.num_blocks == 7'
