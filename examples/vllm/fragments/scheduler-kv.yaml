      requests:
        chatcmpl-run-a:
          priority: 5
        chatcmpl-run-b:
          priority: 0
  steps:
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-run-b'': 1}'
  - steps.s1.result.value.preempted_req_ids == ['chatcmpl-run-a']
  - 'steps.cnt.result.value == {''num_running'': 1, ''num_waiting'': 2}'
  - trace.exists(e, e.type == 'note' && e.title == 'Give back the victim\'s tokens scheduled earlier this step')
- id: scheduler-kv-priority-admission-order
  name: Under the priority policy a later high-priority request is admitted before an earlier low-priority one
  fixtures:
  - tp1-llama-8b
  config:
    scheduling-policy: priority
    max-num-seqs: 1
  steps:
  - flow: scheduler-add-request
    as: lo
    input:
      request_id: chatcmpl-low
      prompt_token_ids:
      - 128000
      - 1
      priority: 10
  - flow: scheduler-add-request
    as: hi
    at_ms: 5
    input:
      request_id: chatcmpl-high
      prompt_token_ids:
      - 128000
      - 2
      priority: 0
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - steps.s1.result.value.scheduled_new_reqs.map(r, r.req_id) == ['chatcmpl-high']
  - steps.cnt.result.value.num_waiting == 1
  - calls['priority-request-queue.peek-request'] == 1 && calls['fcfs-request-queue.peek-request'] == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.get-request-counts' && e.error == null)
