schemas:
  - id: SchedKvRequest
    summary: "The engine Request the scheduler admits (vllm/v1/request.py fields the scheduler reads)."
    schema:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        prompt_token_ids: {type: array, items: {type: integer}, examples: [[128000, 9906, 1917, 13, 3639, 374, 279, 6864, 315, 9822, 30]]}
        prompt_segments:
          type: array
          default: []
          description: "Modeling device for long prompts: consecutive token runs named by content key (equal keys = equal tokens). Replaces prompt_token_ids when non-empty."
          items: {type: object, required: [key, num_tokens], properties: {key: {type: string}, num_tokens: {type: integer}}}
        sampling_params:
          type: object
          properties:
            max_tokens: {type: integer, examples: [16]}
            min_tokens: {type: integer, examples: [0]}
            temperature: {type: number, examples: [0.0]}
            eos_token_id: {type: [integer, "null"], examples: [128009], description: "null when ignore_eos (engine-core sends null; vllm/sampling_params.py)."}
            stop_token_ids: {type: array, items: {type: integer}, examples: [[128001, 128008]]}
            ignore_eos: {type: boolean, examples: [false]}
            structured_outputs: {type: [object, "null"], description: "StructuredOutputsParams (json, regex, choice, grammar, json_object, structural_tag); a request with any constraint starts in WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR (request.py:116-117)."}
            prompt_logprobs: {type: [integer, "null"], default: null, description: "Prompt logprobs requested; unless skip_reading_prefix_cache is set, it defaults the request to skip reading the prefix cache (sampling_params.py:622-629)."}
            prompt_logprob_token_ids: {type: [array, "null"], default: null, items: {type: integer}}
            logprobs: {type: [integer, "null"], default: null, description: "num_logprobs: when not None, update_from_output forwards the runner's sample logprobs for the request (scheduler.py:2214-2221)."}
            logprob_token_ids: {type: [array, "null"], default: null, items: {type: integer}, description: "Also makes num_logprobs non-None (len of the list) when logprobs is unset (sampling_params.py:885-892)."}
            repetition_detection: {type: [object, "null"], default: null, description: "RepetitionDetectionParams {max_pattern_size, min_pattern_size, min_count}; read by check_stop after min_tokens (utils.py:121-138)."}
            extra_args: {type: [object, "null"], default: null, description: "Request reads extra_args['kv_cache_report_mode'] (incremental | full, request.py:122-130)."}
            skip_reading_prefix_cache: {type: [boolean, "null"], default: null, description: "None resolves to prompt_logprobs is not None or prompt_logprob_token_ids is not None (sampling_params.py:622-629)."}
        arrival_time: {type: [number, "null"], default: null, description: "Engine arrival time; null means now."}
        priority: {type: integer, examples: [0]}
        grammar_id: {type: [string, "null"], default: null, description: "Set when the request uses structured output (its compiled grammar)."}
        kv_transfer_params: {type: [object, "null"], default: null, description: "P/D: e.g. {do_remote_prefill: true, ...} for the KV connector."}
        cache_salt: {type: [string, "null"], default: null, description: "Request.cache_salt: an extra key of the first block's hash, so tenants with different salts share no prefix blocks (kv_cache_utils.py:647-650)."}
        lora_request:
          type: [object, "null"]
          default: null
          description: "LoRARequest: its name and path are extra keys of every block hash (kv_cache_utils.py:578-595); its int id counts against max_loras (scheduler.py:941-951)."
          properties:
            lora_name: {type: string, examples: [sql-lora]}
            lora_int_id: {type: integer, examples: [1]}
            lora_path: {type: string, examples: [/adapters/sql-lora]}
        client_index: {type: integer, examples: [0]}
        mm_features:
          type: array
          default: []
          description: "Request.mm_features sorted by offset: each multimodal item's identifier (mm_hash), its placeholder range (offset, length) and its embedding count (PlaceholderRange.get_num_embeds; the length when every placeholder is an embedding)."
          items:
            type: object
            required: [identifier, offset, length]
            properties:
              identifier: {type: string, examples: [img-stop-sign]}
              modality: {type: string, examples: [image]}
              offset: {type: integer, examples: [8]}
              length: {type: integer, examples: [800]}
              num_embeds: {type: integer, examples: [800]}
  - id: SchedKvBlock
    summary: "A KV cache block as the prefix-cache lookup returns it."
    schema: {type: object, properties: {block_id: {type: integer}, ref_cnt: {type: integer}}}
  - id: SchedKvEngineCoreOutputs
    summary: "What update_from_output returns to the engine core: per-request outputs (EngineCoreOutput) for client 0."
    schema:
      type: object
      properties:
        outputs:
          type: array
          items:
            type: object
            properties:
              request_id: {type: string}
              new_token_ids: {type: array, items: {type: integer}}
              finish_reason: {type: [string, "null"], enum: [stop, length, abort, error, repetition, null]}
              stop_reason: {}
              num_cached_tokens: {type: integer}
              client_index: {type: integer}
              kv_transfer_params: {}
              new_logprobs: {type: [object, "null"], description: "LogprobsLists {token_ids, logprobs, ranks} for new_token_ids (one row each) when the request asked for logprobs and the runner returned them; else null (scheduler.py:2214-2221)."}
              new_prompt_logprobs_tensors: {type: [object, "null"], description: "The runner's prompt logprobs for this request ({token_ids, logprobs, ranks}, prompt positions after the first), on the output that completes the prompt (scheduler.py:2249-2262)."}
              prefill_stats: {type: [object, "null"], description: "PrefillStats on the request's first output, finalized (scheduler.py:2207-2212; stats.py:308-346); null afterwards and for a request preempted before its first output was taken.", properties: {num_prompt_tokens: {type: integer}, num_computed_tokens: {type: integer}, num_cached_tokens: {type: integer}, num_local_cached_tokens: {type: integer}, num_external_cached_tokens: {type: integer}, num_cache_creation_tokens: {type: integer}}}
              events: {type: [array, "null"], description: "EngineCoreEvents taken from the request (QUEUED, SCHEDULED, PREEMPTED with timestamps); null when none. The output processor's IterationStats counts PREEMPTED events as num_preempted_reqs (vllm/v1/metrics/stats.py:576-577).", items: {type: object, properties: {type: {type: string, enum: [QUEUED, SCHEDULED, PREEMPTED]}, timestamp: {type: number}}}}
        finished_req_ids: {type: array, items: {type: string}}

interfaces:
  # =================================================================== block pool
  - component: block-pool
    name: get-num-free-blocks
    kind: function
    latency_ms: 0
    summary: "Free blocks in the pool, eviction candidates (cached, ref_cnt 0) included."
    sources: ["vllm/v1/core/block_pool.py:868-875"]
    request: {type: object}
    response: {type: object, properties: {num_free_blocks: {type: integer}, num_gpu_blocks: {type: integer}}}
    behavior:
      - return: {num_free_blocks: "= size(state.free_front) + (state.num_gpu_blocks - state.next_fresh) + size(state.free_tail)", num_gpu_blocks: "= state.num_gpu_blocks"}

  - component: block-pool
    name: get-usage
    kind: function
    latency_ms: 0
    summary: "KV cache usage: 1 - free / (num_gpu_blocks - 1); the null block is not counted."
    sources: ["vllm/v1/core/block_pool.py:877-888"]
    request: {type: object}
    response: {type: object, properties: {usage: {type: number}}}
    behavior:
      - set:
          vars.free: "= size(state.free_front) + (state.num_gpu_blocks - state.next_fresh) + size(state.free_tail)"
      - return: {usage: "= 1.0 - double(vars.free) / double(state.num_gpu_blocks - 1)"}

  - component: block-pool
    name: init
    kind: function
    latency_ms: 0
    summary: "Build the pool: num_gpu_blocks blocks, block 0 taken as the null block, everything else free; no prefix cache."
    sources: ["vllm/v1/core/block_pool.py:157-196"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, required: [num_gpu_blocks], properties: {num_gpu_blocks: {type: integer, examples: [28488]}}}
    response: {type: object, properties: {num_free_blocks: {type: integer}}}
    behavior:
      - if: "input.num_gpu_blocks <= 0"
        then:
          - title: "assert isinstance(num_gpu_blocks, int) and num_gpu_blocks > 0 (a bare assert: no message)"
            source: "vllm/v1/core/block_pool.py:166"
            fail: {code: assertion-error, status: 0, message: ""}
      - title: All blocks free; pop block 0 as the null block
        source: "vllm/v1/core/block_pool.py:172-189"
        set:
          state.num_gpu_blocks: "= input.num_gpu_blocks"
          state.next_fresh: 1
          state.free_front: []
          state.free_tail: []
          state.ref_cnt: {}
          state.block_hash: {}
          state.cached: {}
      - return: {num_free_blocks: "= input.num_gpu_blocks - 1"}

  - component: block-pool
    name: get-cached-block
    kind: function
    latency_ms: 0
    summary: "Prefix-cache lookup of one block hash; a miss returns null."
    sources: ["vllm/v1/core/block_pool.py:198-224", "vllm/v1/core/kv_cache_utils.py:74-83"]
    request: {type: object, required: [block_hash], properties: {block_hash: {type: string}}}
    response: {type: object, properties: {block: {}}}
    behavior:
      - if: "!(input.block_hash in state.cached)"
        then: [{return: {block: null}}]
      - set: {vars.bid: "= state.cached[input.block_hash]"}
      - return:
          block:
            block_id: "= vars.bid"
            ref_cnt: "= string(vars.bid) in state.ref_cnt ? state.ref_cnt[string(vars.bid)] : (vars.bid in state.free_tail || vars.bid in state.free_front ? 0 : 1)"

  - component: block-pool
    name: touch
    kind: function
    latency_ms: 0
    summary: "A prefix hit takes a reference: ref_cnt += 1, and a block with ref_cnt 0 leaves the free queue (no longer evictable)."
    sources: ["vllm/v1/core/block_pool.py:752-768"]
    request: {type: object, required: [block_ids], properties: {block_ids: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {touched: {type: integer}}}
    behavior:
      - title: Touch prefix-hit blocks
        detail: "Blocks at ref_cnt 0 are removed from the free queue; shared ones get ref_cnt + 1."
        source: "vllm/v1/core/block_pool.py:762-768"
        set:
          vars.in_use: "= input.block_ids.filter(b, !(b in state.free_tail) && !(b in state.free_front))"
      - set:
          state.free_tail: "= state.free_tail.filter(b, !(b in input.block_ids))"
          state.free_front: "= state.free_front.filter(b, !(b in input.block_ids))"
          state.ref_cnt: "= merge(state.ref_cnt, vars.in_use.transformMapEntry(i, b, {string(b): (string(b) in state.ref_cnt ? state.ref_cnt[string(b)] : 1) + 1}))"
      - return: {touched: "= size(input.block_ids)"}

  - component: block-pool
    name: get-new-blocks
    kind: function
    latency_ms: 0
    summary: "Pop n blocks off the free queue head; a popped block that still has a hash is evicted from the prefix cache."
    sources: ["vllm/v1/core/block_pool.py:666-700"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [num_blocks], properties: {num_blocks: {type: integer}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}, evicted_hashes: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.free: "= size(state.free_front) + (state.num_gpu_blocks - state.next_fresh) + size(state.free_tail)"
      - if: "input.num_blocks > vars.free"
        then:
          - title: Not enough free blocks
            source: "vllm/v1/core/block_pool.py:678-679"
            fail: {code: value-error, status: 0, message: "= 'Cannot get ' + string(input.num_blocks) + ' free blocks from the pool'"}
      - set:
          vars.take_front: "= state.free_front.slice(0, math.least(input.num_blocks, size(state.free_front)))"
      - set:
          vars.n_fresh: "= math.least(input.num_blocks - size(vars.take_front), state.num_gpu_blocks - state.next_fresh)"
      - set:
          vars.fresh: "= lists.range(vars.n_fresh).map(i, state.next_fresh + i)"
          vars.take_tail: "= state.free_tail.slice(0, input.num_blocks - size(vars.take_front) - vars.n_fresh)"
      - set:
          vars.ids: "= vars.take_front + vars.fresh + vars.take_tail"
          vars.evicted: "= (vars.take_front + vars.take_tail).filter(b, string(b) in state.block_hash).map(b, state.block_hash[string(b)])"
      - title: Evict reused cached blocks from the prefix cache
        detail: "_maybe_evict_cached_block drops the hash of every reused block that still had one."
        source: "vllm/v1/core/block_pool.py:687-689"
        set:
          state.free_front: "= state.free_front.slice(size(vars.take_front), size(state.free_front))"
          state.next_fresh: "= state.next_fresh + vars.n_fresh"
          state.free_tail: "= state.free_tail.slice(size(vars.take_tail), size(state.free_tail))"
          state.cached: "= state.cached.transformMap(h, b, !(h in vars.evicted) || !(b in vars.ids), b)"
          state.block_hash: "= state.block_hash.transformMap(k, h, !(int(k) in vars.ids), h)"
          state.hash_tokens: "= state.hash_tokens.transformMap(k, n, !(int(k) in vars.ids), n)"
      - if: "config['enable-kv-cache-events'] && size(vars.evicted) > 0"
        then:
          - title: One BlockRemoved event per evicted hash (the hash bytes, or a 64-bit int with VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES)
            source: "vllm/v1/core/block_pool.py:615-625"
            set: {state.kv_event_queue: "= state.kv_event_queue + vars.evicted.map(h, {'type': 'BlockRemoved', 'block_hashes': [h], 'medium': 'GPU', 'group_idx': 0})"}
      - return: {block_ids: "= vars.ids", evicted_hashes: "= vars.evicted"}

  - component: block-pool
    name: free-blocks
    kind: function
    latency_ms: 0
    summary: "Drop one reference per block; blocks reaching 0 rejoin the free queue: uncached ones at the head (LIFO), cached ones at the tail (LRU)."
    sources: ["vllm/v1/core/block_pool.py:774-805"]
    request: {type: object, required: [block_ids], properties: {block_ids: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {released: {type: array, items: {type: integer}}}}
    behavior:
      - set:
          vars.keys: "= input.block_ids.map(b, string(b))"
          vars.released: "= input.block_ids.filter(b, b != 0 && !(string(b) in state.ref_cnt))"
      - set:
          vars.first: "= vars.released.filter(b, !(string(b) in state.block_hash) || !config['enable-prefix-caching'])"
          vars.last: "= vars.released.filter(b, string(b) in state.block_hash && config['enable-prefix-caching'])"
      - title: Return released blocks to the free queue
        detail: "Blocks without a hash are prepended (reused first); cached blocks are appended (evicted last, LRU)."
        source: "vllm/v1/core/block_pool.py:793-803"
        set:
          state.free_front: "= vars.first + state.free_front"
          state.free_tail: "= state.free_tail + vars.last"
          state.ref_cnt: "= state.ref_cnt.transformMap(k, v, !(k in vars.keys) || v > 2, k in vars.keys ? v - 1 : v)"
      - return: {released: "= vars.released"}

  - component: block-pool
    name: cache-full-blocks
    kind: function
    latency_ms: 0
    summary: "Register newly full blocks under their chained block hash so later requests can hit them."
    sources: ["vllm/v1/core/block_pool.py:226-344", "vllm/v1/core/block_pool.py:85-99"]
    request:
      type: object
      required: [block_ids, block_hashes]
      properties:
        block_ids: {type: array, items: {type: integer}}
        block_hashes: {type: array, items: {type: string}}
        parent_block_hash: {type: [string, "null"], default: null, description: "KV events only: the hash of the block before the first newly cached one (None from block 0)."}
        token_ids: {type: [array, "null"], default: null, description: "KV events only: all_token_ids[num_cached_blocks * block_size : num_full_blocks * block_size]."}
        lora_request: {type: [object, "null"], default: null}
        group_idx: {type: integer, default: 0}
    response: {type: object, properties: {cached: {type: integer}}}
    behavior:
      - set:
          vars.pairs: "= lists.range(math.least(size(input.block_ids), size(input.block_hashes))).filter(i, input.block_ids[i] != 0).map(i, {'b': input.block_ids[i], 'h': input.block_hashes[i]})"
      - title: Insert block hashes
        detail: "The first block cached under a hash serves later hits; a duplicate keeps its own hash but is not the one returned."
        source: "vllm/v1/core/block_pool.py:626-646"
        set:
          state.block_hash: "= merge(state.block_hash, vars.pairs.transformMapEntry(i, p, {string(p.b): p.h}))"
          state.cached: "= merge(vars.pairs.filter(p, !(p.h in state.cached)).transformMapEntry(i, p, {p.h: p.b}), state.cached)"
      - if: "config['enable-kv-cache-events'] && size(vars.pairs) > 0"
        then:
          - title: Queue a BlockStored event for the newly cached blocks
            detail: "_build_block_stored_event: the new hashes, the parent hash, the blocks' token ids, block_size, the LoRA id and name, medium GPU, extra_keys (None for a text request without salt) and the group."
            source: "vllm/v1/core/block_pool.py:303-377"
            set: {state.kv_event_queue: "= state.kv_event_queue + [{'type': 'BlockStored', 'block_hashes': vars.pairs.map(p, p.h), 'parent_block_hash': has(input.parent_block_hash) ? input.parent_block_hash : dyn(null), 'token_ids': has(input.token_ids) ? input.token_ids : dyn(null), 'block_size': int(config['block-size']), 'lora_id': has(input.lora_request) && input.lora_request != null ? input.lora_request.lora_int_id : dyn(null), 'medium': 'GPU', 'lora_name': has(input.lora_request) && input.lora_request != null ? input.lora_request.lora_name : dyn(null), 'extra_keys': null, 'group_idx': has(input.group_idx) ? input.group_idx : 0, 'session_id': null}]"}
      - return: {cached: "= size(vars.pairs)"}

  - component: block-pool
    name: cache-partial-block
    kind: function
    latency_ms: 0
    summary: "Make an existing block reachable from a fine-grained prefix boundary inside it (hash_block_size < block_size): a longer partial entry replaces the block's shorter one."
    sources: ["vllm/v1/core/block_pool.py:449-563"]
    request:
      type: object
      required: [block_id, block_hash, num_tokens]
      properties:
        block_id: {type: integer}
        block_hash: {type: string, description: "The prefix-chain hash at num_tokens."}
        num_tokens: {type: integer}
    response: {type: object, properties: {cached: {type: boolean}, removed: {type: array, items: {type: string}}}}
    behavior:
      - if: "input.block_id == 0"
        then:
          - title: The null block is never cached
            source: "vllm/v1/core/block_pool.py:493-494"
            return: {cached: false, removed: []}
      - set:
          vars.key: "= string(input.block_id)"
      - set:
          vars.old: "= vars.key in state.block_hash && state.block_hash[vars.key] != input.block_hash && (!(vars.key in state.hash_tokens) || state.hash_tokens[vars.key] < input.num_tokens) ? [state.block_hash[vars.key]] : []"
      - title: A shorter earlier entry for this block is removed first
        source: "vllm/v1/core/block_pool.py:506-517"
        set:
          state.cached: "= state.cached.transformMap(h, b, !(h in vars.old), b)"
      - title: Insert the partial entry
        source: "vllm/v1/core/block_pool.py:518-563"
        set:
          state.block_hash: "= merge(state.block_hash, {vars.key: input.block_hash})"
          state.hash_tokens: "= merge(state.hash_tokens, {vars.key: input.num_tokens})"
          state.cached: "= input.block_hash in state.cached ? state.cached : merge(state.cached, {input.block_hash: input.block_id})"
      - return: {cached: true, removed: "= vars.old"}

  - component: block-pool
    name: reset-prefix-cache
    kind: function
    latency_ms: 0
    summary: "Drop every block hash, only when no block but the null block is in use."
    sources: ["vllm/v1/core/block_pool.py:827-866"]
    request: {type: object}
    response: {type: object, properties: {reset: {type: boolean}}}
    behavior:
      - set:
          vars.used: "= state.num_gpu_blocks - (size(state.free_front) + (state.num_gpu_blocks - state.next_fresh) + size(state.free_tail))"
      - if: "vars.used != 1"
        then:
          - title: Blocks still in use; reset refused
            source: "vllm/v1/core/block_pool.py:838-845"
            return: {reset: false}
      - set: {state.cached: {}, state.block_hash: {}, state.hash_tokens: {}}
      - if: "config['enable-kv-cache-events']"
        then:
          - title: Queue one AllBlocksCleared event
            source: "vllm/v1/core/block_pool.py:863-864"
            set: {state.kv_event_queue: "= state.kv_event_queue + [{'type': 'AllBlocksCleared'}]"}
      - return: {reset: true}

  # ======================================================== full attention manager
  - component: full-attention-manager
    name: find-longest-cache-hit
    kind: function
    latency_ms: 0
    summary: "Longest run of cached full blocks from the start of the prompt (chained hashes: the first miss ends the hit)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:733-828"]
    request:
      type: object
      required: [block_hashes, max_length]
      properties:
        block_hashes: {type: array, items: {type: string}}
        max_length: {type: integer}
    response: {type: object, properties: {blocks: {type: array, items: SchedKvBlock}, hit_length: {type: integer}}}
    behavior:
      - set: {vars.blocks: []}
      - title: Probe cached blocks in order
        source: "vllm/v1/core/single_type_kv_cache_manager.py:779-786"
        foreach: "= input.block_hashes.slice(0, math.least([size(input.block_hashes), input.max_length / int(config['block-size']), 1000]))"
        as: h
        max: 1000
        steps:
          - call: block-pool.get-cached-block
            input: {block_hash: "= vars.h"}
            as: got
          - if: "vars.got.value.block == null"
            then: [{break: true}]
          - set: {vars.blocks: "= vars.blocks + [vars.got.value.block]"}
      - return: {blocks: "= vars.blocks", hit_length: "= size(vars.blocks) * int(config['block-size'])"}

  - component: full-attention-manager
    name: get-num-blocks-to-allocate
    kind: function
    latency_ms: 0
    summary: "Blocks a request needs for num_tokens slots, counting prefix-hit blocks that are eviction candidates (they leave the free queue)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:175-265"]
    request:
      type: object
      required: [request_id, num_tokens]
      properties:
        request_id: {type: string}
        num_tokens: {type: integer}
        new_computed_blocks: {type: array, items: SchedKvBlock}
    response: {type: object, properties: {num_blocks: {type: integer}}}
    behavior:
      - set:
          vars.required: "= (input.num_tokens + int(config['block-size']) - 1) / int(config['block-size'])"
          vars.have: "= input.request_id in state.req_to_blocks ? size(state.req_to_blocks[input.request_id]) : 0"
          vars.hits: "= has(input.new_computed_blocks) ? input.new_computed_blocks : []"
      - if: "input.request_id in state.num_cached_block"
        then:
          - title: Running request - no new prefix hits
            source: "vllm/v1/core/single_type_kv_cache_manager.py:230-236"
            return: {num_blocks: "= math.greatest(vars.required - vars.have, 0)"}
      - return:
          num_blocks: "= math.greatest(vars.required - (size(vars.hits) + vars.have), 0) + size(vars.hits.filter(b, b.ref_cnt == 0))"

  - component: full-attention-manager
    name: add-local-computed-blocks
    kind: function
    latency_ms: 0
    summary: "Adopt prefix-hit blocks into a new request's block table (touching them) and mark them cached."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:267-324"]
    request:
      type: object
      required: [request_id, new_computed_blocks]
      properties:
        request_id: {type: string}
        new_computed_blocks: {type: array, items: SchedKvBlock}
    response: {type: object, properties: {num_blocks: {type: integer}}}
    behavior:
      - set: {vars.ids: "= input.new_computed_blocks.map(b, b.block_id)"}
      - if: "config['enable-prefix-caching']"
        then:
          - call: block-pool.touch
            input: {block_ids: "= vars.ids"}
      - set:
          state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.ids})"
          state.num_cached_block: "= merge(state.num_cached_block, {input.request_id: size(vars.ids)})"
      - return: {num_blocks: "= size(vars.ids)"}

  - component: full-attention-manager
    name: allocate-external-computed-blocks
    kind: function
    latency_ms: 0
    summary: "Allocate blocks for external (KV-connector) computed tokens: max(0, cdiv(local + external, block_size) - blocks held)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:326-366"]
    request: {type: object, required: [request_id, num_external_computed_tokens], properties: {request_id: {type: string}, num_local_computed_tokens: {type: integer, default: 0}, num_external_computed_tokens: {type: integer}}}
    response: {type: object, properties: {new_block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - if: "input.num_external_computed_tokens <= 0"
        then: [{return: {new_block_ids: []}}]
      - set:
          vars.have: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"
          vars.local: "= has(input.num_local_computed_tokens) ? input.num_local_computed_tokens : 0"
      - title: Never a negative count - blocks already held cover the tokens
        source: "vllm/v1/core/single_type_kv_cache_manager.py:359-363"
        set:
          vars.n: "= math.greatest(0, (vars.local + input.num_external_computed_tokens + int(config['block-size']) - 1) / int(config['block-size']) - size(vars.have))"
      - if: "vars.n == 0"
        then:
          - set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.have})"}
          - return: {new_block_ids: []}
      - call: block-pool.get-new-blocks
        input: {num_blocks: "= vars.n"}
        as: got
      - set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.have + vars.got.value.block_ids})"}
      - return: {new_block_ids: "= vars.got.value.block_ids"}

  - component: full-attention-manager
    name: allocate-new-blocks
    kind: function
    latency_ms: 0
    summary: "Extend a request's block table to cover num_tokens slots with fresh blocks from the pool."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:369-410"]
    request: {type: object, required: [request_id, num_tokens], properties: {request_id: {type: string}, num_tokens: {type: integer}}}
    response: {type: object, properties: {new_block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - set:
          vars.have: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"
      - set:
          vars.n: "= (input.num_tokens + int(config['block-size']) - 1) / int(config['block-size']) - size(vars.have)"
      - if: "vars.n <= 0"
        then:
          - set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.have})"}
          - return: {new_block_ids: []}
      - call: block-pool.get-new-blocks
        input: {num_blocks: "= vars.n"}
        as: got
      - set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.have + vars.got.value.block_ids})"}
      - return: {new_block_ids: "= vars.got.value.block_ids"}

  - component: full-attention-manager
    name: cache-blocks
    kind: function
    latency_ms: 0
    summary: "Cache the request's newly full blocks (up to num_tokens) under their block hashes."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:476-534"]
    request:
      type: object
      required: [request_id, num_tokens, block_hashes]
      properties:
        request_id: {type: string}
        num_tokens: {type: integer}
        block_hashes: {type: array, items: {type: string}}
        token_ids: {type: [array, "null"], default: null, description: "KV events only: request.all_token_ids (prompt then output). A prompt given as segments has no ids; each of its positions is the stand-in '<segment key>#<offset>'."}
        lora_request: {type: [object, "null"], default: null, description: "KV events only: the request's LoRA (lora_int_id, lora_name)."}
    response: {type: object, properties: {num_cached_blocks: {type: integer}}}
    behavior:
      - set:
          vars.num_cached: "= input.request_id in state.num_cached_block ? state.num_cached_block[input.request_id] : 0"
          vars.num_full: "= math.least(input.num_tokens / int(config['block-size']), size(input.block_hashes))"
          vars.blocks: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"
      - if: "vars.num_cached >= vars.num_full"
        then: [{return: {num_cached_blocks: "= vars.num_cached"}}]
      - call: block-pool.cache-full-blocks
        input:
          block_ids: "= vars.blocks.slice(vars.num_cached, math.least(vars.num_full, size(vars.blocks)))"
          block_hashes: "= input.block_hashes.slice(vars.num_cached, vars.num_full)"
          parent_block_hash: "= vars.num_cached == 0 ? dyn(null) : input.block_hashes[vars.num_cached - 1]"
          token_ids: "= has(input.token_ids) && input.token_ids != null ? input.token_ids.slice(math.least(vars.num_cached * int(config['block-size']), size(input.token_ids)), math.least(vars.num_full * int(config['block-size']), size(input.token_ids))) : dyn(null)"
          lora_request: "= has(input.lora_request) ? input.lora_request : dyn(null)"
      - set: {state.num_cached_block: "= merge(state.num_cached_block, {input.request_id: vars.num_full})"}
      - return: {num_cached_blocks: "= vars.num_full"}

  - component: full-attention-manager
    name: free
    kind: function
    latency_ms: 0
    summary: "Pop a request's block table and free its blocks in reverse order, so tail blocks are evicted first."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:562-591"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {freed: {type: integer}}}
    behavior:
      - set:
          vars.blocks: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"
      - set:
          state.req_to_blocks: "= omit(state.req_to_blocks, input.request_id)"
          state.num_cached_block: "= omit(state.num_cached_block, input.request_id)"
      - if: "size(vars.blocks) > 0"
        then:
          - call: block-pool.free-blocks
            input: {block_ids: "= vars.blocks.reverse()"}
      - return: {freed: "= size(vars.blocks)"}

  - component: full-attention-manager
    name: get-block-ids
    kind: function
    latency_ms: 0
    summary: "A request's block table (block ids in order)."
    sources: ["vllm/v1/core/kv_cache_manager.py:723-729"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - return: {block_ids: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"}

  # ============================================================ KV cache manager
  - component: kv-cache-manager
    name: get-computed-blocks
    kind: function
    latency_ms: 0
    summary: "Prefix-cache hit for a new request; capped at num_tokens - 1 so the last token is recomputed for logits."
    sources: ["vllm/v1/core/kv_cache_manager.py:264-321"]
    request:
      type: object
      required: [request_id, block_hashes, num_tokens]
      properties:
        request_id: {type: string}
        block_hashes: {type: array, items: {type: string}}
        num_tokens: {type: integer}
        skip_reading_prefix_cache: {type: boolean, default: false}
        kv_cache_report_mode: {type: string, default: incremental, enum: [incremental, full], description: "Request.kv_cache_report_mode: sampling_params.extra_args['kv_cache_report_mode'], default incremental (request.py:122-130)."}
        token_ids: {type: [array, "null"], default: null, description: "KV events only: request.all_token_ids (prompt then output). A prompt given as segments has no ids; each of its positions is the stand-in '<segment key>#<offset>'."}
        lora_request: {type: [object, "null"], default: null, description: "KV events only: the request's LoRA (lora_int_id, lora_name)."}
    response: {type: object, properties: {blocks: {type: array, items: SchedKvBlock}, num_computed_tokens: {type: integer}, mamba_block: {}}}
    behavior:
      - if: "!config['enable-prefix-caching'] || (has(input.skip_reading_prefix_cache) && input.skip_reading_prefix_cache)"
        then:
          - title: Prefix caching off (or skipped for this request)
            detail: "No lookup: zero computed tokens."
            source: "vllm/v1/core/kv_cache_manager.py:286-287"
            return: {blocks: [], num_computed_tokens: 0, mamba_block: null}
      - if: "size(state.kv_cache_groups) > 1"
        then:
          - title: Hybrid model - the hybrid coordinator reconciles the groups' hits
            source: "vllm/v1/core/kv_cache_coordinator.py:796-935"
            call: hybrid-kv-cache-coordinator.find-longest-cache-hit
            input: {block_hashes: "= input.block_hashes", max_length: "= input.num_tokens - 1"}
            as: hh
          - return: {blocks: "= vars.hh.value.blocks", num_computed_tokens: "= vars.hh.value.hit_length", mamba_block: "= vars.hh.value.mamba_block"}
      - title: Find the longest cache hit, at most num_tokens - 1
        detail: "When every token hits, the last one must be recomputed to get logits; with block-aligned hits that recomputes the whole last block."
        source: "vllm/v1/core/kv_cache_manager.py:289-300"
        call: full-attention-manager.find-longest-cache-hit
        input: {block_hashes: "= input.block_hashes", max_length: "= input.num_tokens - 1"}
        as: hit
      - if: "vars.hit.value.hit_length > 0 && config['enable-kv-cache-events'] && has(input.kv_cache_report_mode) && input.kv_cache_report_mode == 'full'"
        then:
          - title: kv_cache_report_mode full - announce the reused prefix-cache blocks as BlockStored
            source: "vllm/v1/core/kv_cache_manager.py:302-310"
            call: block-pool.emit-cached-block-events
            input:
              block_hashes: "= input.block_hashes"
              num_cached_blocks: "= size(vars.hit.value.blocks)"
              token_ids: "= has(input.token_ids) ? input.token_ids : dyn(null)"
              lora_request: "= has(input.lora_request) ? input.lora_request : dyn(null)"
      - return: {blocks: "= vars.hit.value.blocks", num_computed_tokens: "= vars.hit.value.hit_length", mamba_block: null}

  - component: kv-cache-manager
    name: allocate-slots
    kind: function
    latency_ms: 0
    summary: "Allocate KV slots for a request's new tokens, adopting local prefix-hit blocks and allocating blocks for external (KV-connector) computed tokens; null (allocated false) when the pool can't fit them."
    sources: ["vllm/v1/core/kv_cache_manager.py:371-618"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [request_id, num_new_tokens]
      properties:
        request_id: {type: string}
        status: {type: string, examples: [WAITING]}
        num_computed_tokens: {type: integer, default: 0}
        num_tokens: {type: integer}
        num_new_tokens: {type: integer}
        num_new_computed_tokens: {type: integer, default: 0}
        new_computed_blocks: {type: array, default: [], items: SchedKvBlock}
        mamba_hit_block: {type: [object, "null"], default: null, description: "Hybrid models: the Mamba checkpoint block of the prefix hit."}
        num_external_computed_tokens: {type: integer, default: 0}
        num_lookahead_tokens: {type: integer, default: 0}
        delay_cache_blocks: {type: boolean, default: false}
        block_hashes: {type: array, default: [], items: {type: string}}
        full_sequence_must_fit: {type: boolean, default: false}
        has_scheduled_reqs: {type: boolean, default: true}
        token_ids: {type: [array, "null"], default: null, description: "KV events only: request.all_token_ids (prompt then output). A prompt given as segments has no ids; each of its positions is the stand-in '<segment key>#<offset>'."}
        lora_request: {type: [object, "null"], default: null, description: "KV events only: the request's LoRA (lora_int_id, lora_name)."}
    response:
      type: object
      properties:
        allocated: {type: boolean}
        new_block_ids: {type: array, items: {type: integer}}
        block_ids: {type: array, items: {type: integer}}
    behavior:
      - set:
          vars.new_comp: "= has(input.num_new_computed_tokens) ? input.num_new_computed_tokens : 0"
          vars.ext: "= has(input.num_external_computed_tokens) ? input.num_external_computed_tokens : 0"
          vars.hits: "= has(input.new_computed_blocks) ? input.new_computed_blocks : []"
          vars.mamba_hit: "= has(input.mamba_hit_block) ? input.mamba_hit_block : dyn(null)"
          vars.lookahead: "= has(input.num_lookahead_tokens) ? input.num_lookahead_tokens : 0"
          vars.computed: "= has(input.num_computed_tokens) ? input.num_computed_tokens : 0"
          vars.hashes: "= has(input.block_hashes) ? input.block_hashes : []"
          vars.hybrid: "= size(state.kv_cache_groups) > 1"
      - if: "input.num_new_tokens == 0 && vars.ext == 0 && vars.new_comp == 0"
        then:
          - title: Nothing to allocate or adopt
            source: "vllm/v1/core/kv_cache_manager.py:474-482"
            fail: {code: value-error, status: 0, message: "num_new_tokens must be greater than 0 when there are no computed tokens to adopt"}
      - set:
          vars.local: "= vars.computed + vars.new_comp"
      - title: Computed tokens are local (cached) plus external (connector)
        source: "vllm/v1/core/kv_cache_manager.py:499-507"
        set:
          vars.total: "= math.least(vars.local + vars.ext, int(config['max-model-len']))"
      - call: block-pool.get-num-free-blocks
        as: free
      - title: Watermark for waiting and preempted admissions
        detail: "Applied only when some request is already scheduled; 0 with the default watermark 0.0."
        source: "vllm/v1/core/kv_cache_manager.py:509-516"
        set:
          vars.watermark_blocks: "= (has(input.has_scheduled_reqs) ? input.has_scheduled_reqs : true) && has(input.status) && input.status in ['WAITING', 'PREEMPTED'] ? int(double(config['watermark']) * double(vars.free.value.num_gpu_blocks)) : 0"
      - set:
          vars.mamba_need: 0
      - if: "vars.hybrid"
        then:
          - title: The Mamba group needs a state block for a new request
            source: "vllm/v1/core/single_type_kv_cache_manager.py:1676-1700"
            call: mamba-manager.get-num-blocks-to-allocate
            input: {request_id: "= input.request_id"}
            as: mneed
          - set: {vars.mamba_need: "= vars.mneed.value.num_blocks"}
      - if: "has(input.full_sequence_must_fit) && input.full_sequence_must_fit"
        then:
          - call: full-attention-manager.get-num-blocks-to-allocate
            input: {request_id: "= input.request_id", num_tokens: "= math.least(input.num_tokens, int(config['max-model-len']))", new_computed_blocks: "= vars.hits"}
            as: full
          - if: "vars.full.value.num_blocks + vars.mamba_need + vars.watermark_blocks > vars.free.value.num_free_blocks"
            then:
              - title: The whole prompt would not fit; refuse admission
                detail: "scheduler_reserve_full_isl checks the full input sequence, not just the first chunk, to avoid over-admission and KV thrashing."
                source: "vllm/v1/core/kv_cache_manager.py:522-540"
                return: {allocated: false, new_block_ids: [], block_ids: []}
      - set:
          vars.need_slots: "= math.least(vars.total + input.num_new_tokens + vars.lookahead, int(config['max-model-len']))"
      - call: full-attention-manager.get-num-blocks-to-allocate
        input: {request_id: "= input.request_id", num_tokens: "= vars.need_slots", new_computed_blocks: "= vars.hits"}
        as: needed
      - if: "vars.needed.value.num_blocks + vars.mamba_need + vars.watermark_blocks > vars.free.value.num_free_blocks"
        then:
          - title: Not enough free blocks
            detail: "The caller preempts (running) or stops admitting (waiting)."
            source: "vllm/v1/core/kv_cache_manager.py:573-579"
            return: {allocated: false, new_block_ids: [], block_ids: []}
      - if: "size(vars.hits) > 0"
        then:
          - title: Adopt the prefix-hit blocks (touched first)
            source: "vllm/v1/core/kv_cache_coordinator.py:296-302"
            call: full-attention-manager.add-local-computed-blocks
            input: {request_id: "= input.request_id", new_computed_blocks: "= vars.hits"}
      - if: "vars.ext > 0"
        then:
          - title: Then allocate blocks for the external computed tokens
            detail: "Two-phase: every group's local hits are touched before any external block is taken, so the allocation can't evict a hit."
            source: "vllm/v1/core/kv_cache_coordinator.py:303-309"
            call: full-attention-manager.allocate-external-computed-blocks
            input: {request_id: "= input.request_id", num_local_computed_tokens: "= vars.local", num_external_computed_tokens: "= vars.ext"}
      - call: full-attention-manager.allocate-new-blocks
        input: {request_id: "= input.request_id", num_tokens: "= vars.need_slots"}
        as: alloc
      - if: "vars.hybrid"
        then:
          - call: mamba-manager.allocate-state
            input: {request_id: "= input.request_id", hit_block: "= vars.mamba_hit", num_hit_tokens: "= vars.local"}
      - if: "has(input.delay_cache_blocks) && input.delay_cache_blocks"
        then:
          - title: P/D - the blocks are cached once the async load finishes
            source: "vllm/v1/core/kv_cache_manager.py:602-605"
            call: full-attention-manager.get-block-ids
            input: {request_id: "= input.request_id"}
            as: dtable
          - return: {allocated: true, new_block_ids: "= vars.alloc.value.new_block_ids", block_ids: "= vars.dtable.value.block_ids"}
      - title: Cache the blocks that this step makes full
        detail: "Only finalized tokens: capped at request.num_tokens, so unverified draft tokens are never cached."
        source: "vllm/v1/core/kv_cache_manager.py:607-616"
        call: kv-cache-manager.cache-blocks
        input:
          request_id: "= input.request_id"
          num_tokens: "= math.least(vars.total + input.num_new_tokens, has(input.num_tokens) ? input.num_tokens : vars.total + input.num_new_tokens)"
          block_hashes: "= vars.hashes"
          token_ids: "= has(input.token_ids) ? input.token_ids : dyn(null)"
          lora_request: "= has(input.lora_request) ? input.lora_request : dyn(null)"
      - call: full-attention-manager.get-block-ids
        input: {request_id: "= input.request_id"}
        as: table
      - return: {allocated: true, new_block_ids: "= vars.alloc.value.new_block_ids", block_ids: "= vars.table.value.block_ids"}

  - component: kv-cache-manager
    name: cache-blocks
    kind: function
    latency_ms: 0
    summary: "Cache a request's full blocks, if prefix caching is enabled (a no-op otherwise)."
    sources: ["vllm/v1/core/kv_cache_manager.py:782-792"]
    request:
      type: object
      required: [request_id, num_tokens]
      properties:
        request_id: {type: string}
        num_tokens: {type: integer}
        block_hashes: {type: array, default: [], items: {type: string}}
        token_ids: {type: [array, "null"], default: null, description: "KV events only: request.all_token_ids (prompt then output). A prompt given as segments has no ids; each of its positions is the stand-in '<segment key>#<offset>'."}
        lora_request: {type: [object, "null"], default: null, description: "KV events only: the request's LoRA (lora_int_id, lora_name)."}
    response: {type: object, properties: {cached: {type: boolean}}}
    behavior:
      - if: "!config['enable-prefix-caching'] || !has(input.block_hashes) || size(input.block_hashes) == 0"
        then:
          - title: Caching disabled (or nothing hashed); no-op
            source: "vllm/v1/core/kv_cache_manager.py:791-792"
            return: {cached: false}
      - call: full-attention-manager.cache-blocks
        input: {request_id: "= input.request_id", num_tokens: "= input.num_tokens", block_hashes: "= input.block_hashes", token_ids: "= has(input.token_ids) ? input.token_ids : dyn(null)", lora_request: "= has(input.lora_request) ? input.lora_request : dyn(null)"}
      - if: "size(state.kv_cache_groups) > 1"
        then:
          - title: Hybrid - the Mamba group checkpoints its state at the newest full block
            source: "vllm/v1/core/kv_cache_coordinator.py:369-377"
            call: mamba-manager.cache-blocks
            input: {request_id: "= input.request_id", num_tokens: "= input.num_tokens", block_hashes: "= input.block_hashes"}
      - return: {cached: true}

  - component: kv-cache-manager
    name: free
    kind: function
    latency_ms: 0
    summary: "Free all KV blocks of a request (coordinator -> FullAttentionManager.free)."
    sources: ["vllm/v1/core/kv_cache_manager.py:620-629"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {freed: {type: integer}}}
    behavior:
      - call: full-attention-manager.free
        input: {request_id: "= input.request_id"}
        as: f
      - if: "size(state.kv_cache_groups) > 1"
        then:
          - title: Hybrid - free the Mamba group's blocks too
            source: "vllm/v1/core/kv_cache_coordinator.py:400-408"
            call: mamba-manager.free
            input: {request_id: "= input.request_id"}
      - return: {freed: "= vars.f.value.freed"}

  - component: kv-cache-manager
    name: get-block-ids
    kind: function
    latency_ms: 0
    summary: "Read a request's block table (the block ids the worker's block table holds)."
    sources: ["vllm/v1/core/kv_cache_manager.py:727-729", "vllm/v1/core/kv_cache_manager.py:34-107"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - call: full-attention-manager.get-block-ids
        input: {request_id: "= input.request_id"}
        as: t
      - return: {block_ids: "= vars.t.value.block_ids"}

  - component: kv-cache-manager
    name: usage
    kind: function
    latency_ms: 0
    summary: "KV cache usage fraction, from the block pool."
    sources: ["vllm/v1/core/kv_cache_manager.py:226-234"]
    request: {type: object}
    response: {type: object, properties: {usage: {type: number}}}
    behavior:
      - call: block-pool.get-usage
        as: u
      - return: {usage: "= vars.u.value.usage"}

  - component: kv-cache-manager
    name: record-prefix-cache-stats
    kind: function
    latency_ms: 0
    summary: "Count one admitted request's prefix-cache queries (its tokens) and hits; preempted re-admissions count separately."
    sources: ["vllm/v1/core/kv_cache_manager.py:253-262", "vllm/v1/metrics/stats.py:138-155"]
    request: {type: object, required: [num_tokens, num_hits], properties: {num_tokens: {type: integer}, num_hits: {type: integer}, preempted: {type: boolean}, skip_reading_prefix_cache: {type: boolean, default: false, description: "The request skipped the lookup (prompt logprobs); it is not counted."}}}
    response: {type: object}
    behavior:
      - if: "config['disable-log-stats'] || !config['enable-prefix-caching'] || (has(input.skip_reading_prefix_cache) && input.skip_reading_prefix_cache)"
        then:
          - title: Stats off, or the request skipped the cache lookup - not counted
            source: "vllm/v1/core/kv_cache_manager.py:253-256"
            return: {recorded: false}
      - if: "has(input.preempted) && input.preempted"
        then:
          - set:
              state.prefix_cache_stats: "= merge(state.prefix_cache_stats, {'preempted_requests': state.prefix_cache_stats.preempted_requests + 1, 'preempted_queries': state.prefix_cache_stats.preempted_queries + input.num_tokens, 'preempted_hits': state.prefix_cache_stats.preempted_hits + input.num_hits})"
          - return: {recorded: true}
      - set:
          state.prefix_cache_stats: "= merge(state.prefix_cache_stats, {'requests': state.prefix_cache_stats.requests + 1, 'queries': state.prefix_cache_stats.queries + input.num_tokens, 'hits': state.prefix_cache_stats.hits + input.num_hits})"
      - return: {recorded: true}

  - component: kv-cache-manager
    name: make-prefix-cache-stats
    kind: function
    latency_ms: 0
    summary: "Take (and reset) the prefix-cache stats accumulated since the last call."
    sources: ["vllm/v1/core/kv_cache_manager.py:236-247"]
    request: {type: object}
    response: {type: object}
    behavior:
      - set:
          vars.stats: "= state.prefix_cache_stats"
          state.prefix_cache_stats: {requests: 0, queries: 0, hits: 0, preempted_requests: 0, preempted_queries: 0, preempted_hits: 0, reset: false}
      - return: "= vars.stats"

  - component: kv-cache-manager
    name: reset-prefix-cache
    kind: function
    latency_ms: 0
    summary: "Invalidate the prefix cache (e.g. after a weight update); refused while any block is in use."
    sources: ["vllm/v1/core/kv_cache_manager.py:674-689"]
    request: {type: object}
    response: {type: object, properties: {reset: {type: boolean}}}
    behavior:
      - call: block-pool.reset-prefix-cache
        as: r
      - if: "vars.r.value.reset"
        then:
          - set: {state.prefix_cache_stats: "= merge(state.prefix_cache_stats, {'reset': true})"}
      - return: {reset: "= vars.r.value.reset"}

  # ============================================================ kv cache utils
  - component: kv-cache-utils
    name: request-block-hasher
    kind: function
    latency_ms: 0
    summary: "Hashes of a request's new full blocks, each chained over the whole prefix before it."
    description: >-
      Stand-in for sha256 over (parent hash, block tokens, extra keys): the hash of the block
      ending at token E is the content keys of the prompt up to min(E, P) plus the output
      tokens past the prompt. Equal hashes mean equal prefixes, as with the real chained hash.
    sources: ["vllm/v1/core/kv_cache_utils.py:954-998", "vllm/v1/core/kv_cache_utils.py:695-725"]
    request:
      type: object
      required: [prompt_segments]
      properties:
        prompt_segments: {type: array, items: {type: object, properties: {key: {type: string}, num_tokens: {type: integer}}}}
        output_token_ids: {type: array, items: {type: integer}}
        num_existing_hashes: {type: integer, default: 0}
        lora_request: {type: [object, "null"], default: null, properties: {lora_name: {type: string}, lora_int_id: {type: integer}, lora_path: {type: string}}}
        cache_salt: {type: [string, "null"], default: null}
    response: {type: object, properties: {new_block_hashes: {type: array, items: {type: string}}}}
    behavior:
      - title: Extra keys of the block hash - LoRA name and path, then the cache salt
        detail: "generate_block_hash_extra_keys adds ('lora', name, path) to every block and ('cache_salt', salt) to the first block only; because each hash chains its parent, the salt still separates every later block. The stand-in carries both as a prefix of every hash."
        source: "vllm/v1/core/kv_cache_utils.py:622-657"
        set:
          vars.lora_key: "= has(input.lora_request) && input.lora_request != null ? 'lora(' + input.lora_request.lora_name + ',' + (has(input.lora_request.lora_path) ? input.lora_request.lora_path : '') + ')/' : ''"
          vars.salt_key: "= has(input.cache_salt) && input.cache_salt != null && input.cache_salt != '' ? 'salt(' + input.cache_salt + ')/' : ''"
      - if: "vars.lora_key != ''"
        then:
          - title: A LoRA request hashes its adapter name and path into every block
            source: "vllm/v1/core/kv_cache_utils.py:578-595"
            set: {vars.extra: "= vars.lora_key + vars.salt_key"}
        else:
          - set: {vars.extra: "= vars.salt_key"}
      - set:
          vars.segs: "= input.prompt_segments"
          vars.out: "= has(input.output_token_ids) ? input.output_token_ids : []"
          vars.start: "= has(input.num_existing_hashes) ? input.num_existing_hashes : 0"
          vars.bs: "= int(config['block-size'])"
      - set:
          vars.p: "= sum(vars.segs.map(s, s.num_tokens))"
          vars.starts: "= vars.segs.all(s, s.num_tokens == 1) ? lists.range(size(vars.segs)) : lists.range(size(vars.segs)).map(j, sum(vars.segs.slice(0, j).map(s, s.num_tokens)))"
      - set:
          vars.n_full: "= (vars.p + size(vars.out)) / vars.bs"
      - if: "vars.start >= vars.n_full"
        then:
          - title: No new full block
            source: "vllm/v1/core/kv_cache_utils.py:958-960"
            return: {new_block_hashes: []}
      - title: Hash each new full block over its whole prefix
        source: "vllm/v1/core/kv_cache_utils.py:976-995"
        return:
          new_block_hashes: "= lists.range(vars.n_full - vars.start).map(k, vars.extra + lists.range(size(vars.segs)).filter(j, vars.starts[j] < math.least((vars.start + k + 1) * vars.bs, vars.p)).map(j, vars.segs[j].key).join('|') + '@' + string(math.least((vars.start + k + 1) * vars.bs, vars.p)) + ((vars.start + k + 1) * vars.bs > vars.p ? '+' + vars.out.slice(0, (vars.start + k + 1) * vars.bs - vars.p).map(t, string(t)).join(',') : ''))"

  - component: kv-cache-utils
    name: get-kv-cache-configs
    kind: function
    latency_ms: 0
    summary: "Size the KV cache pool: num_blocks = the smallest worker's available memory // bytes per block (page size x layers), unless num_gpu_blocks_override is set; the scheduler's block pool is built with it."
    sources: ["vllm/v1/core/kv_cache_utils.py:2531-2680", "vllm/v1/core/kv_cache_utils.py:1588-1630", "vllm/v1/core/kv_cache_utils.py:2369-2400"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [available_memory]
      properties:
        available_memory: {type: array, items: {type: integer}, examples: [[59745650279]]}
        bytes_per_block: {type: integer, default: 2097152, description: "page_size_bytes * num_layers of the KV cache spec; 2 MiB for Llama-3.1-8B (16 tokens x 2 x 8 KV heads x 128 x 2 bytes x 32 layers)."}
    response: {type: object, properties: {num_blocks: {type: integer, examples: [28488]}}}
    behavior:
      - set:
          vars.bpb: "= has(input.bytes_per_block) && input.bytes_per_block > 0 ? input.bytes_per_block : 2097152"
      - title: Check each worker can hold one max_model_len request (the null block excluded)
        detail: "_check_enough_kv_cache_memory runs before the pool is sized; no free memory, or less than cdiv(max_model_len, block_size) blocks, is a ValueError and startup fails."
        source: "vllm/v1/core/kv_cache_utils.py:2638-2647"
        foreach: "= input.available_memory"
        as: avail
        steps:
          - if: "vars.avail - vars.bpb <= 0"
            then:
              - title: No memory left for the KV cache
                source: "vllm/v1/core/kv_cache_utils.py:1009-1017"
                fail: {code: value-error, status: 0, message: "No available memory for the cache blocks. Try increasing `gpu_memory_utilization` when initializing the engine (this flag also controls CPU memory reservation on the CPU backend, despite its name). See https://docs.vllm.ai/en/latest/configuration/conserving_memory/ for more details."}
          - set:
              vars.needed: "= (int(config['max-model-len']) + int(config['block-size']) - 1) / int(config['block-size']) * vars.bpb"
          - if: "vars.needed > vars.avail - vars.bpb"
            then:
              - set:
                  vars.check: "= vars.avail - vars.bpb"
                  vars.need_gib: "= double(int(double(vars.needed) / 1073741824.0 * 100.0 + 0.5)) / 100.0"
                  vars.avail_gib: "= double(int(double(vars.avail - vars.bpb) / 1073741824.0 * 100.0 + 0.5)) / 100.0"
              - set:
                  vars.est: "= math.least([(vars.check / vars.bpb) * int(config['block-size']), int(config['max-model-len'])])"
                  vars.need_s: "= string(vars.need_gib).contains('.') ? string(vars.need_gib) : string(vars.need_gib) + '.0'"
                  vars.avail_s: "= string(vars.avail_gib).contains('.') ? string(vars.avail_gib) : string(vars.avail_gib) + '.0'"
              - title: One max_model_len request does not fit
                detail: "format_gib is round(bytes / GiB, 2); the estimated length is the binary search's answer, the largest length whose cdiv(len, block_size) blocks fit in the memory left after the null block (0 omits the sentence)."
                source: "vllm/v1/core/kv_cache_utils.py:1019-1040"
                fail: {code: value-error, status: 0, message: "= 'To serve at least one request with the model\\'s max seq len (' + string(int(config['max-model-len'])) + '), (' + vars.need_s + ' GiB KV cache is needed, which is larger than the available KV cache memory (' + vars.avail_s + ' GiB). ' + (vars.est > 0 ? 'Based on the available memory, the estimated maximum model length is ' + string(vars.est) + '. ' : '') + 'Try increasing `gpu_memory_utilization` (which also controls CPU memory on the CPU backend) or decreasing `max_model_len` when initializing the engine. See https://docs.vllm.ai/en/latest/configuration/conserving_memory/ for more details.'"}
      - set:
          vars.n: "= math.least(input.available_memory.map(m, m / vars.bpb))"
      - if: "'num-gpu-blocks-override' in config && config['num-gpu-blocks-override'] != null"
        then:
          - title: num_gpu_blocks_override replaces the profiled count
            source: "vllm/v1/core/kv_cache_utils.py:1230-1236"
            set: {vars.n: "= int(config['num-gpu-blocks-override'])"}
      - title: The scheduler builds its KVCacheManager and BlockPool with kv_cache_config.num_blocks
        source: "vllm/v1/core/kv_cache_coordinator.py:119-125"
        call: block-pool.init
        input: {num_gpu_blocks: "= vars.n"}
      - return: {num_blocks: "= vars.n"}

  # ============================================================ hybrid KV cache
  - component: hybrid-kv-cache-coordinator
    name: find-longest-cache-hit
    kind: function
    latency_ms: 0
    summary: "Fixed-point hit over the groups: full attention gives the longest contiguous hit; the Mamba group then cuts it back to its last checkpoint at or below it; attention blocks are trimmed to that length."
    sources: ["vllm/v1/core/kv_cache_coordinator.py:796-935"]
    request:
      type: object
      required: [block_hashes, max_length]
      properties:
        block_hashes: {type: array, items: {type: string}}
        max_length: {type: integer}
        hash_block_size: {type: [integer, "null"], default: null, description: "KVCacheConfig.hash_block_size when finer than the block size (Mamba partial hits); block_hashes are then per hash unit."}
    response: {type: object, properties: {blocks: {type: array}, hit_length: {type: integer}, mamba_block: {}}}
    behavior:
      - set:
          vars.bs: "= int(config['block-size'])"
          vars.hbs: "= has(input.hash_block_size) && input.hash_block_size != null ? input.hash_block_size : int(config['block-size'])"
      - set:
          vars.scale: "= vars.hbs < vars.bs && vars.bs % vars.hbs == 0 ? vars.bs / vars.hbs : 1"
      - title: Coarser groups read every scale-th fine hash (BlockHashListWithBlockSize)
        source: "vllm/v1/core/kv_cache_utils.py:695-727"
        set:
          vars.block_hashes: "= vars.scale == 1 ? input.block_hashes : lists.range(size(input.block_hashes) / vars.scale).map(i, input.block_hashes[(i + 1) * vars.scale - 1])"
      - title: Full attention first - the longest run of cached blocks
        source: "vllm/v1/core/kv_cache_coordinator.py:836-874"
        call: full-attention-manager.find-longest-cache-hit
        input: {block_hashes: "= vars.block_hashes", max_length: "= input.max_length"}
        as: attn
      - title: The Mamba group accepts only a checkpointed boundary at or below that length (per hash unit when finer)
        source: "vllm/v1/core/kv_cache_coordinator.py:851-880"
        call: mamba-manager.find-longest-cache-hit
        input: {block_hashes: "= input.block_hashes", max_length: "= vars.attn.value.hit_length", hash_block_size: "= vars.hbs"}
        as: mamba
      - title: Simple hybrid (one attention + one Mamba group) stops after one pass; keep the attention blocks covering the hit
        source: "vllm/v1/core/kv_cache_coordinator.py:885-905"
        return:
          blocks: "= vars.attn.value.blocks.slice(0, (vars.mamba.value.hit_length + vars.bs - 1) / vars.bs)"
          hit_length: "= vars.mamba.value.hit_length"
          mamba_block: "= vars.mamba.value.block"

  - component: mamba-manager
    name: find-longest-cache-hit
    kind: function
    latency_ms: 0
    summary: "Scan backwards for the last block whose Mamba state was checkpointed; a hit there covers the whole prefix (earlier states aren't needed)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1454-1531"]
    request: {type: object, required: [block_hashes, max_length], properties: {block_hashes: {type: array, items: {type: string}}, max_length: {type: integer}, hash_block_size: {type: [integer, "null"], default: null}}}
    response: {type: object, properties: {block: {}, hit_length: {type: integer}}}
    behavior:
      - set:
          vars.hbs: "= has(input.hash_block_size) && input.hash_block_size != null ? input.hash_block_size : int(config['block-size'])"
      - if: "vars.hbs < int(config['block-size']) && int(config['block-size']) % vars.hbs == 0"
        then:
          - title: Partial hits - scan hash units backwards; the last checkpointed unit wins, below the block grid if need be
            source: "vllm/v1/core/single_type_kv_cache_manager.py:1478-1497"
            set:
              vars.n: "= math.least([size(input.block_hashes), input.max_length / vars.hbs, 1000])"
              vars.found: null
              vars.hit: 0
          - foreach: "= lists.range(vars.n).map(i, vars.n - 1 - i)"
            as: j
            max: 1000
            steps:
              - call: block-pool.get-cached-block
                input: {block_hash: "= input.block_hashes[vars.j] + '#mamba'"}
                as: fine
              - if: "vars.fine.value.block != null"
                then:
                  - set: {vars.found: "= vars.fine.value.block", vars.hit: "= (vars.j + 1) * vars.hbs"}
                  - break: true
          - return: {block: "= vars.found", hit_length: "= vars.hit"}
      - set:
          vars.n: "= math.least([size(input.block_hashes), input.max_length / int(config['block-size']), 1000])"
          vars.found: null
          vars.hit: 0
      - title: Last match wins (early stop)
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1515-1529"
        foreach: "= lists.range(vars.n).map(i, vars.n - 1 - i)"
        as: i
        max: 1000
        steps:
          - call: block-pool.get-cached-block
            input: {block_hash: "= input.block_hashes[vars.i] + '#mamba'"}
            as: got
          - if: "vars.got.value.block != null"
            then:
              - set: {vars.found: "= vars.got.value.block", vars.hit: "= (vars.i + 1) * int(config['block-size'])"}
              - break: true
      - return: {block: "= vars.found", hit_length: "= vars.hit"}

  - component: mamba-manager
    name: get-num-blocks-to-allocate
    kind: function
    latency_ms: 0
    summary: "A new request needs one state block (two when it starts from a checkpoint copy); a running one needs none."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1676-1778"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {num_blocks: {type: integer}}}
    behavior:
      - return: {num_blocks: "= input.request_id in state.req_to_blocks ? 0 : 1"}

  - component: mamba-manager
    name: allocate-state
    kind: function
    latency_ms: 0
    summary: "Give a new request its state block; on a prefix hit the checkpoint is touched and its state copied into the new block."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1780-1906"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}, hit_block: {}, num_hit_tokens: {type: integer, default: 0}}}
    response: {type: object, properties: {state_block: {type: integer}}}
    behavior:
      - if: "input.request_id in state.req_to_blocks"
        then: [{return: {state_block: "= state.req_to_blocks[input.request_id][size(state.req_to_blocks[input.request_id]) - 1]"}}]
      - set: {vars.held: []}
      - if: "has(input.hit_block) && input.hit_block != null"
        then:
          - title: Adopt the checkpoint (touch it)
            source: "vllm/v1/core/single_type_kv_cache_manager.py:267-317"
            call: block-pool.touch
            input: {block_ids: ["= input.hit_block.block_id"]}
          - set: {vars.held: ["= input.hit_block.block_id"]}
      - call: block-pool.get-new-blocks
        input: {num_blocks: 1}
        as: nb
      - set:
          state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.held + vars.nb.value.block_ids})"
          state.num_cached_block: "= merge(state.num_cached_block, {input.request_id: size(vars.held) > 0 && has(input.num_hit_tokens) ? input.num_hit_tokens / int(config['block-size']) : 0})"
      - return: {state_block: "= vars.nb.value.block_ids[0]"}

  - component: mamba-manager
    name: cache-blocks
    kind: function
    latency_ms: 0
    summary: "Checkpoint the request's state at its newest full block: register the state block under that block's hash and continue in a fresh state block."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1961-2006"]
    request: {type: object, required: [request_id, num_tokens, block_hashes], properties: {request_id: {type: string}, num_tokens: {type: integer}, block_hashes: {type: array, items: {type: string}}}}
    response: {type: object, properties: {checkpointed: {type: boolean}}}
    behavior:
      - set:
          vars.full: "= math.least(input.num_tokens / int(config['block-size']), size(input.block_hashes))"
          vars.done: "= input.request_id in state.num_cached_block ? state.num_cached_block[input.request_id] : 0"
          vars.blocks: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"
      - if: "vars.full <= vars.done || vars.full == 0 || size(vars.blocks) == 0"
        then: [{return: {checkpointed: false}}]
      - title: Register the current state block as the checkpoint of block full-1
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1961-1975"
        call: block-pool.cache-full-blocks
        input: {block_ids: ["= vars.blocks[size(vars.blocks) - 1]"], block_hashes: ["= input.block_hashes[vars.full - 1] + '#mamba'"]}
      - call: block-pool.get-new-blocks
        input: {num_blocks: 1}
        as: nb
      - set:
          state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.blocks + vars.nb.value.block_ids})"
          state.num_cached_block: "= merge(state.num_cached_block, {input.request_id: vars.full})"
      - return: {checkpointed: true}

  - component: mamba-manager
    name: free
    kind: function
    latency_ms: 0
    summary: "Free the request's state and checkpoint blocks, newest first (checkpoints stay cached and evictable)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1935-1952"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {freed: {type: integer}}}
    behavior:
      - set: {vars.blocks: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"}
      - set:
          state.req_to_blocks: "= omit(state.req_to_blocks, input.request_id)"
          state.num_cached_block: "= omit(state.num_cached_block, input.request_id)"
      - if: "size(vars.blocks) > 0"
        then:
          - call: block-pool.free-blocks
            input: {block_ids: "= vars.blocks.reverse()"}
      - return: {freed: "= size(vars.blocks)"}

  # ================================================================ request queues
  - component: fcfs-request-queue
    name: peek-request
    kind: function
    latency_ms: 0
    summary: "Head of the FCFS waiting deque; an empty queue raises IndexError."
    sources: ["vllm/v1/core/sched/request_queue.py:86-90"]
    errors: [{code: index-error, status: 0, retryable: false}]
    request: {type: object, required: [queue], properties: {queue: {type: array, items: {type: object, properties: {request_id: {type: string}, priority: {type: integer}, arrival_time: {type: number}}}}}}
    response: {type: object, properties: {request_id: {type: string}}}
    behavior:
      - if: "size(input.queue) == 0"
        then:
          - title: Peek from an empty queue
            source: "vllm/v1/core/sched/request_queue.py:88-89"
            fail: {code: index-error, status: 0, message: "peek from an empty queue"}
      - return: {request_id: "= input.queue[0].request_id"}

  - component: priority-request-queue
    name: peek-request
    kind: function
    latency_ms: 0
    summary: "Heap top: the lowest priority value, ties broken by earlier arrival_time."
    sources: ["vllm/v1/core/sched/request_queue.py:153-157", "vllm/v1/request.py:357-367"]
    errors: [{code: index-error, status: 0, retryable: false}]
    request: {type: object, required: [queue], properties: {queue: {type: array, items: {type: object, properties: {request_id: {type: string}, priority: {type: integer}, arrival_time: {type: number}}}}}}
    response: {type: object, properties: {request_id: {type: string}}}
    behavior:
      - if: "size(input.queue) == 0"
        then:
          - title: Peek from an empty heap
            source: "vllm/v1/core/sched/request_queue.py:155-156"
            fail: {code: index-error, status: 0, message: "peek from empty heap"}
      - title: Order by (priority, arrival_time, request_id)
        detail: "Request.__lt__: a lower priority value first, then the earlier arrival, then the smaller request id."
        source: "vllm/v1/request.py:357-367"
        return:
          request_id: "= input.queue.filter(r, !input.queue.exists(o, o.priority < r.priority || (o.priority == r.priority && o.arrival_time < r.arrival_time) || (o.priority == r.priority && o.arrival_time == r.arrival_time && o.request_id < r.request_id)))[0].request_id"

  # ==================================================================== check_stop
  - component: sched-utils
    name: check-stop
    kind: function
    latency_ms: 0
    summary: "After appending a sampled token: EOS or a stop token id stops; max_tokens or max_model_len caps the length; past min_tokens, a repeating N-gram tail (repetition_detection) ends the request FINISHED_REPETITION."
    description: >-
      The order is the code's: EOS, stop token ids and the length cap are checked before the
      min_tokens gate, so EOS sampled below min_tokens still stops here (the sampler masks it
      below min_tokens, so it is only sampled under ignore-style params or a forced token). The
      min_tokens gate guards only the repetition check. check_sequence_repetition takes
      min_pattern_size 0 as 1, is off when max_pattern_size <= 0, min_count < 2 or min > max, and
      tries pattern lengths upward, giving up once pattern_len * min_count exceeds the output.
      _has_repeating_pattern compares the last pattern_len tokens with the min_count - 1
      repetitions before them.
    sources: ["vllm/v1/core/sched/utils.py:98-140", "vllm/v1/core/sched/utils.py:10-67", "vllm/v1/request.py:386", "vllm/v1/request.py:411"]
    request:
      type: object
      required: [last_token_id, num_tokens, num_output_tokens, max_tokens]
      properties:
        last_token_id: {type: integer}
        num_tokens: {type: integer}
        num_output_tokens: {type: integer}
        max_tokens: {type: integer}
        min_tokens: {type: integer, default: 0}
        eos_token_id: {type: [integer, "null"]}
        stop_token_ids: {type: array, items: {type: integer}}
        output_token_ids: {type: array, items: {type: integer}, description: "request.output_token_ids including last_token_id; read only by the repetition check."}
        repetition_detection:
          type: [object, "null"]
          default: null
          description: "SamplingParams.repetition_detection (RepetitionDetectionParams), already validated by its __post_init__."
          properties:
            max_pattern_size: {type: integer, default: 0}
            min_pattern_size: {type: integer, default: 0}
            min_count: {type: integer, default: 0}
    response: {type: object, properties: {stopped: {type: boolean}, status: {type: string}, stop_reason: {}}}
    behavior:
      - if: "has(input.eos_token_id) && input.eos_token_id != null && input.last_token_id == input.eos_token_id"
        then:
          - title: EOS sampled
            source: "vllm/v1/core/sched/utils.py:105-107"
            return: {stopped: true, status: FINISHED_STOPPED, stop_reason: null}
      - if: "has(input.stop_token_ids) && input.last_token_id in input.stop_token_ids"
        then:
          - title: Stop token id sampled
            source: "vllm/v1/core/sched/utils.py:109-112"
            return: {stopped: true, status: FINISHED_STOPPED, stop_reason: "= input.last_token_id"}
      - if: "input.num_tokens >= int(config['max-model-len']) || input.num_output_tokens >= input.max_tokens"
        then:
          - title: Length cap (max_tokens or max_model_len)
            source: "vllm/v1/core/sched/utils.py:114-119"
            return: {stopped: true, status: FINISHED_LENGTH_CAPPED, stop_reason: null}
      - if: "has(input.min_tokens) && input.min_tokens != null && input.num_output_tokens < input.min_tokens"
        then:
          - title: Below min_tokens - no repetition check yet
            source: "vllm/v1/core/sched/utils.py:121-126"
            return: {stopped: false, status: RUNNING, stop_reason: null}
      - if: "has(input.repetition_detection) && input.repetition_detection != null && has(input.output_token_ids)"
        then:
          - set:
              vars.rd: "= input.repetition_detection"
              vars.t: "= input.output_token_ids"
          - set:
              vars.maxp: "= has(vars.rd.max_pattern_size) ? int(vars.rd.max_pattern_size) : 0"
              vars.minp: "= has(vars.rd.min_pattern_size) && int(vars.rd.min_pattern_size) > 0 ? int(vars.rd.min_pattern_size) : 1"
              vars.mc: "= has(vars.rd.min_count) ? int(vars.rd.min_count) : 0"
              vars.L: "= size(vars.t)"
          - title: check_sequence_repetition over the output tokens
            detail: "Pattern lengths min..max; a length whose min_count repetitions exceed the output ends the search (False)."
            source: "vllm/v1/core/sched/utils.py:28-67"
            set:
              vars.rep: "= vars.maxp > 0 && vars.mc >= 2 && vars.minp <= vars.maxp && lists.range(vars.maxp - vars.minp + 1).map(k, vars.minp + k).exists(p, p * vars.mc <= vars.L && lists.range(p).all(i, lists.range(vars.mc - 1).all(j, vars.t[vars.L - (p * (j + 1) + i + 1)] == vars.t[vars.L - (i + 1)])))"
          - if: "vars.rep"
            then:
              - title: Repetition detected
                source: "vllm/v1/core/sched/utils.py:128-138"
                return: {stopped: true, status: FINISHED_REPETITION, stop_reason: repetition_detected}
      - return: {stopped: false, status: RUNNING, stop_reason: null}

  # ===================================================================== scheduler
  - component: scheduler
    name: add-request
    kind: function
    latency_ms: 0
    summary: "Admit a new request into the waiting queue (status WAITING) and the request table."
    sources: ["vllm/v1/core/sched/scheduler.py:2616-2647"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: SchedKvRequest
    response: {type: object, properties: {request_id: {type: string}, status: {type: string}, num_prompt_tokens: {type: integer}, num_block_hashes: {type: integer}}}
    behavior:
      - if: "input.request_id in state.requests"
        then:
          - title: Duplicate request id
            detail: "A non-streaming request with an id already in the table trips the 'duplicate request id' assertion."
            source: "vllm/v1/core/sched/scheduler.py:2617-2622"
            fail: {code: assertion-error, status: 0, message: "duplicate request id"}
      - set:
          vars.sp: "= has(input.sampling_params) ? input.sampling_params : {}"
          vars.segs: "= has(input.prompt_segments) && size(input.prompt_segments) > 0 ? input.prompt_segments : (has(input.prompt_token_ids) ? input.prompt_token_ids.map(t, {'key': string(t), 'num_tokens': 1}) : [])"
      - set:
          vars.num_prompt: "= sum(vars.segs.map(s, s.num_tokens))"
          vars.lora: "= has(input.lora_request) && input.lora_request != null ? input.lora_request : dyn(null)"
          vars.salt: "= has(input.cache_salt) && input.cache_salt != null ? input.cache_salt : dyn(null)"
          vars.status: WAITING
          vars.grammar_id: "= has(input.grammar_id) ? input.grammar_id : dyn(null)"
      - title: Prompt logprobs skip reading the prefix cache unless the request says otherwise
        detail: "SamplingParams resolves skip_reading_prefix_cache=None to prompt_logprobs is not None or prompt_logprob_token_ids is not None, because cached prompt tokens have no logits; Request.get_skip_reading_prefix_cache returns it."
        source: "vllm/sampling_params.py:622-629"
        set:
          vars.skip_read: "= has(vars.sp.skip_reading_prefix_cache) && vars.sp.skip_reading_prefix_cache != null ? vars.sp.skip_reading_prefix_cache : ((has(vars.sp.prompt_logprobs) && vars.sp.prompt_logprobs != null) || (has(vars.sp.prompt_logprob_token_ids) && vars.sp.prompt_logprob_token_ids != null))"
          vars.mm: "= has(input.mm_features) && input.mm_features != null ? input.mm_features.map(f, {'identifier': f.identifier, 'offset': f.offset, 'length': f.length, 'num_embeds': has(f.num_embeds) ? f.num_embeds : f.length}) : []"
      - if: "has(vars.sp.structured_outputs) && vars.sp.structured_outputs != null && size(vars.sp.structured_outputs) > 0"
        then:
          - title: A structured-output request waits for its grammar
            detail: "Request.__init__ builds a StructuredOutputRequest when sampling_params.structured_outputs has a constraint and starts the request in WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR; its grammar is the one the StructuredOutputManager compiles for this request id."
            source: "vllm/v1/request.py:110-117"
            set:
              vars.status: WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR
              vars.grammar_id: "= vars.grammar_id != null ? vars.grammar_id : input.request_id"
      - set: {vars.hashes: []}
      - if: "config['enable-prefix-caching'] || config['kv-connector'] != ''"
        then:
          - title: Hash the prompt's full blocks
            detail: "The engine core builds a block_hasher only when prefix caching or a KV connector is on; the Request hashes every full block when it is created."
            source: "vllm/v1/engine/core.py:231-240"
            call: kv-cache-utils.request-block-hasher
            input: {prompt_segments: "= vars.segs", output_token_ids: [], num_existing_hashes: 0, lora_request: "= vars.lora", cache_salt: "= vars.salt"}
            as: h
          - set: {vars.hashes: "= vars.h.value.new_block_hashes"}
      - title: Enqueue in the waiting queue
        detail: "_enqueue_waiting_request: FCFS appends to the deque, priority pushes onto the heap (ordering is applied at peek); a request blocked on its grammar is also counted as deferred."
        source: "vllm/v1/core/sched/scheduler.py:2457-2462"
        set:
          state.waiting: "= state.waiting + [input.request_id]"
          state.deferred_waiting: "= vars.status == 'WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR' ? state.deferred_waiting + [input.request_id] : state.deferred_waiting"
          state.requests: >-
            = merge(state.requests, {input.request_id: {
              'request_id': input.request_id, 'status': vars.status,
              'lora_request': vars.lora, 'cache_salt': vars.salt,
              'priority': has(input.priority) ? input.priority : 0,
              'arrival_time': has(input.arrival_time) && input.arrival_time != null ? input.arrival_time : double(now),
              'prompt_segments': vars.segs,
              'prompt_token_ids': has(input.prompt_segments) && size(input.prompt_segments) > 0 ? null : (has(input.prompt_token_ids) ? input.prompt_token_ids : null),
              'num_prompt_tokens': vars.num_prompt, 'output_token_ids': [],
              'num_computed_tokens': 0, 'num_output_placeholders': 0,
              'max_tokens': has(vars.sp.max_tokens) ? vars.sp.max_tokens : 16,
              'min_tokens': has(vars.sp.min_tokens) ? vars.sp.min_tokens : 0,
              'eos_token_id': has(vars.sp.ignore_eos) && vars.sp.ignore_eos ? null : (has(vars.sp.eos_token_id) ? vars.sp.eos_token_id : 128009),
              'stop_token_ids': has(vars.sp.stop_token_ids) ? vars.sp.stop_token_ids : [],
              'sampling_params': vars.sp,
              'block_hashes': vars.hashes, 'spec_token_ids': [],
              'kv_transfer_params': has(input.kv_transfer_params) ? input.kv_transfer_params : dyn(null),
              'num_preemptions': 0, 'num_cached_tokens': -1, 'is_prefill_chunk': true,
              'prefill_stats': {'num_prompt_tokens': 0, 'num_computed_tokens': 0, 'num_cached_tokens': 0, 'num_local_cached_tokens': 0, 'num_external_cached_tokens': 0, 'num_cache_creation_tokens': 0},
              'last_sched_seq': 0,
              'grammar_id': vars.grammar_id,
              'skip_reading_prefix_cache': vars.skip_read, 'mm_features': vars.mm,
              'num_in_flight_tokens': 0, 'num_stale_output_tokens': 0, 'drop_stale_output': false,
              'events': config['disable-log-stats'] ? [] : [{'type': 'QUEUED', 'timestamp': double(now_us) / 1000000.0}],
              'client_index': has(input.client_index) ? input.client_index : 0}})
      - if: "config['kv-connector'] != ''"
        then:
          - title: Tell the KV connector about the new request; adopt any fields its hook changed
            source: "vllm/v1/core/sched/scheduler.py:2639-2645"
            call: kv-connector-base-v1.on-new-request
            input: "= {'request_id': input.request_id, 'num_prompt_tokens': vars.num_prompt, 'max_tokens': state.requests[input.request_id].max_tokens, 'kv_transfer_params': state.requests[input.request_id].kv_transfer_params, 'prompt_token_ids': has(input.prompt_token_ids) && input.prompt_token_ids != null && size(vars.segs) == size(input.prompt_token_ids) ? input.prompt_token_ids : []}"
            as: conn
          - if: "vars.conn.value.truncated"
            then:
              - title: The connector truncated the request (MoRIIO producer with Mamba layers)
                source: "vllm/v1/core/sched/scheduler.py:2639-2641"
                set:
                  state.requests: "= merge(state.requests, {input.request_id: {'num_prompt_tokens': vars.conn.value.num_prompt_tokens, 'prompt_token_ids': vars.conn.value.prompt_token_ids, 'prompt_segments': vars.conn.value.prompt_token_ids.map(t, {'key': string(t), 'num_tokens': 1}), 'max_tokens': vars.conn.value.max_tokens != null ? vars.conn.value.max_tokens : state.requests[input.request_id].max_tokens, 'kv_transfer_params': vars.conn.value.kv_transfer_params}})"
      - return: {request_id: "= input.request_id", status: "= vars.status", num_prompt_tokens: "= vars.num_prompt", num_block_hashes: "= size(vars.hashes)"}

  - component: scheduler
    name: preempt-request
    kind: function
    latency_ms: 0
    summary: "Preempt a RUNNING request: free its KV blocks and encoder inputs, reset num_computed_tokens to 0 (recompute), mark its in-flight output stale, record a PREEMPTED event and put it back at the front of the waiting queue."
    sources: ["vllm/v1/core/sched/scheduler.py:1571-1614"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string}
        drop_stale_output: {type: boolean, default: false, description: "Drop (rather than deliver) the in-flight output: reset_prefix_cache passes True, because the same-step resume would deliver tokens out of order."}
    response: {type: object, properties: {request_id: {type: string}, num_preemptions: {type: integer}, num_stale_output_tokens: {type: integer}}}
    behavior:
      - if: "!(input.request_id in state.requests) || state.requests[input.request_id].status != 'RUNNING'"
        then:
          - title: Only running requests can be preempted
            source: "vllm/v1/core/sched/scheduler.py:1584-1586"
            fail: {code: assertion-error, status: 0, message: "Only running requests can be preempted"}
      - set: {vars.r: "= state.requests[input.request_id]"}
      - title: Free the request's KV blocks
        detail: "Its cached full blocks stay in the prefix cache (ref_cnt 0, evictable), so resuming can hit them."
        source: "vllm/v1/core/sched/scheduler.py:1589"
        call: scheduler.free-request-blocks
        input: {request_id: "= input.request_id"}
      - if: "has(vars.r.mm_features) && size(vars.r.mm_features) > 0"
        then:
          - title: Release the request's encoder-cache references
            source: "vllm/v1/core/sched/scheduler.py:1590"
            call: encoder-cache-manager.free
            input: {request_id: "= input.request_id", mm_hashes: "= vars.r.mm_features.map(f, f.identifier)"}
      - title: Mark the in-flight output stale
        detail: "Async scheduling: the tokens of steps still in flight are delivered on return but must not touch the reset counters; num_in_flight_tokens already includes any undrained stale share, so it is assigned. An undrained drop-mode share stays dropped."
        source: "vllm/v1/core/sched/scheduler.py:1596-1607"
        set:
          vars.in_flight: "= has(vars.r.num_in_flight_tokens) ? vars.r.num_in_flight_tokens : 0"
          vars.drop: "= (has(input.drop_stale_output) && input.drop_stale_output) || (has(vars.r.drop_stale_output) && vars.r.drop_stale_output && has(vars.r.num_stale_output_tokens) && vars.r.num_stale_output_tokens > 0)"
      - title: Reset to PREEMPTED, record the PREEMPTED event and prepend to waiting
        detail: "The caller removes it from running (pop() for FCFS, del by index for priority); prepend_request puts it at the deque head (heap push for priority). The id goes out in the next SchedulerOutput.preempted_req_ids."
        source: "vllm/v1/core/sched/scheduler.py:1592-1614"
        set:
          state.requests: "= merge(state.requests, {input.request_id: {'status': 'PREEMPTED', 'num_computed_tokens': 0, 'num_output_placeholders': 0, 'spec_token_ids': [], 'num_stale_output_tokens': vars.in_flight, 'drop_stale_output': vars.drop, 'num_preemptions': vars.r.num_preemptions + 1, 'events': config['disable-log-stats'] ? (has(vars.r.events) ? vars.r.events : []) : (has(vars.r.events) ? vars.r.events : []) + [{'type': 'PREEMPTED', 'timestamp': double(now_us) / 1000000.0}]}})"
          state.running: "= state.running.filter(r, r != input.request_id)"
          state.waiting: "= [input.request_id] + state.waiting"
          state.preempted_req_ids: "= state.preempted_req_ids + [input.request_id]"
      - return: {request_id: "= input.request_id", num_preemptions: "= state.requests[input.request_id].num_preemptions", num_stale_output_tokens: "= vars.in_flight"}

  - component: scheduler
    name: free-request
    kind: function
    latency_ms: 0
    summary: "Release a finished request: free its blocks, report it in the next SchedulerOutput.finished_req_ids, drop it from the table."
    sources: ["vllm/v1/core/sched/scheduler.py:2714-2750"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {request_id: {type: string}, delay_free_blocks: {type: boolean}, kv_transfer_params: {}}}
    behavior:
      - set: {vars.delay: false, vars.params: null}
      - if: "config['kv-connector'] != ''"
        then:
          - call: kv-cache-manager.get-block-ids
            input: {request_id: "= input.request_id"}
            as: tbl
          - title: Tell the KV connector the request finished
            detail: "A producer may still be sending the KV, so freeing the blocks can be delayed until finished_sending."
            source: "vllm/v1/core/sched/scheduler.py:3005-3058"
            call: kv-connector-base-v1.request-finished
            input:
              request_id: "= input.request_id"
              num_prompt_tokens: "= state.requests[input.request_id].num_prompt_tokens"
              num_computed_tokens: "= state.requests[input.request_id].num_computed_tokens"
              status: "= state.requests[input.request_id].status"
              kv_transfer_params: "= state.requests[input.request_id].kv_transfer_params"
              block_hashes: "= state.requests[input.request_id].block_hashes"
              block_ids: ["= vars.tbl.value.block_ids"]
            as: cf
          - set: {vars.delay: "= vars.cf.value.delay_free_blocks", vars.params: "= vars.cf.value.kv_transfer_params"}
      - if: "input.request_id in state.requests && has(state.requests[input.request_id].mm_features) && size(state.requests[input.request_id].mm_features) > 0"
        then:
          - title: Release the request's encoder-cache references
            source: "vllm/v1/core/sched/scheduler.py:2734"
            call: encoder-cache-manager.free
            input: {request_id: "= input.request_id", mm_hashes: "= state.requests[input.request_id].mm_features.map(f, f.identifier)"}
      - set: {state.finished_req_ids: "= state.finished_req_ids + [input.request_id]"}
      - if: "vars.delay"
        then:
          - title: Keep the blocks (and the request) until the connector reports finished_sending
            source: "vllm/v1/core/sched/scheduler.py:2744-2748"
            return: {request_id: "= input.request_id", delay_free_blocks: true, kv_transfer_params: "= vars.params"}
      - title: _free_blocks - free (or, behind an in-flight step, defer) the request's blocks
        source: "vllm/v1/core/sched/scheduler.py:2752-2755"
        call: scheduler.free-request-blocks
        input: {request_id: "= input.request_id"}
      - title: Remember the id for the workers and drop the request
        source: "vllm/v1/core/sched/scheduler.py:2736-2750"
        set:
          state.requests: "= omit(state.requests, input.request_id)"
      - return: {request_id: "= input.request_id", delay_free_blocks: false, kv_transfer_params: "= vars.params"}

  - component: scheduler
    name: finish-requests
    kind: function
    latency_ms: 0
    summary: "Finish requests from outside the scheduler (abort on client disconnect): unknown or already finished ids are ignored."
    sources: ["vllm/v1/core/sched/scheduler.py:2649-2712"]
    request:
      type: object
      required: [request_ids]
      properties:
        request_ids: {type: [array, "null"], default: null, items: {type: string, examples: [chatcmpl-abc123]}, description: "null finishes every request (finish_requests(None))."}
        finished_status: {type: string, default: FINISHED_ABORTED, enum: [FINISHED_ABORTED, FINISHED_STOPPED, FINISHED_LENGTH_CAPPED, FINISHED_ERROR]}
    response: {type: object, properties: {finished: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.status: "= has(input.finished_status) ? input.finished_status : 'FINISHED_ABORTED'"
          vars.done: []
      - set:
          vars.ids: "= input.request_ids == null ? state.requests.transformList(k, v, k) : input.request_ids"
      - title: "None means every request"
        source: "vllm/v1/core/sched/scheduler.py:2665-2670"
        foreach: "= vars.ids"
        as: rid
        steps:
          - if: "!(vars.rid in state.requests) || state.requests[vars.rid].status.startsWith('FINISHED')"
            then:
              - title: Unknown or already finished id; skipped
                source: "vllm/v1/core/sched/scheduler.py:2678-2681"
                continue: true
          - if: "state.requests[vars.rid].status == 'RUNNING'"
            then:
              - set: {state.running: "= state.running.filter(r, r != vars.rid)"}
            else:
              - title: Remove it from the waiting queues and the deferred set
                source: "vllm/v1/core/sched/scheduler.py:2694-2697"
                set:
                  state.waiting: "= state.waiting.filter(r, r != vars.rid)"
                  state.deferred_waiting: "= state.deferred_waiting.filter(r, r != vars.rid)"
          - set: {state.requests: "= merge(state.requests, {vars.rid: {'status': vars.status}})"}
          - call: scheduler.free-request
            input: {request_id: "= vars.rid"}
          - set: {vars.done: "= vars.done + [vars.rid]"}
      - return: {finished: "= vars.done"}

  - component: scheduler
    name: get-request-counts
    kind: function
    latency_ms: 0
    summary: "(num_running_reqs, num_waiting_reqs)."
    sources: ["vllm/v1/core/sched/scheduler.py:2608-2610"]
    request: {type: object}
    response: {type: object, properties: {num_running: {type: integer}, num_waiting: {type: integer}}}
    behavior:
      - return: {num_running: "= size(state.running)", num_waiting: "= size(state.waiting)"}

  - component: scheduler
    name: make-stats
    kind: function
    latency_ms: 0
    summary: "SchedulerStats for the step: running, waiting and deferred (skipped) waiting counts, KV cache usage and the prefix-cache stats since the last call."
    sources: ["vllm/v1/core/sched/scheduler.py:2915-2959"]
    request: {type: object, properties: {spec_decoding_stats: {type: [object, "null"], default: null}}}
    response:
      type: [object, "null"]
      properties:
        num_running_reqs: {type: integer}
        num_waiting_reqs: {type: integer, description: "Waiting requests minus the deferred ones (scheduler.py:2944-2947)."}
        num_skipped_waiting_reqs: {type: integer, description: "Waiting requests a scheduling pass skipped and that are still deferred (scheduler.py:2948)."}
        kv_cache_usage: {type: number}
        prefix_cache_stats: {type: object}
        spec_decoding_stats: {type: [object, "null"]}
    behavior:
      - if: "config['disable-log-stats']"
        then:
          - title: Stats are off; no SchedulerStats
            source: "vllm/v1/core/sched/scheduler.py:2923-2924"
            return: null
      - call: kv-cache-manager.make-prefix-cache-stats
        as: pcs
      - call: kv-cache-manager.usage
        as: usage
      - title: Build SchedulerStats
        source: "vllm/v1/core/sched/scheduler.py:2943-2959"
        return:
          num_running_reqs: "= size(state.running)"
          num_waiting_reqs: "= size(state.waiting) - size(state.deferred_waiting.filter(r, r in state.waiting))"
          num_skipped_waiting_reqs: "= size(state.deferred_waiting.filter(r, r in state.waiting))"
          kv_cache_usage: "= vars.usage.value.usage"
          prefix_cache_stats: "= vars.pcs.value"
          spec_decoding_stats: "= has(input.spec_decoding_stats) ? input.spec_decoding_stats : dyn(null)"

  - component: scheduler
    name: reset-prefix-cache
    kind: function
    latency_ms: 0
    summary: "Reset the prefix cache; with reset_running_requests every running request is preempted first (dropping its in-flight output) so the reset can succeed; with reset_connector the KV connector's cache is reset too."
    sources: ["vllm/v1/core/sched/scheduler.py:2840-2883", "vllm/v1/core/sched/scheduler.py:2885-2906"]
    errors: [{code: runtime-error, status: 0, retryable: false}]
    request:
      type: object
      properties:
        reset_running_requests: {type: boolean, default: false}
        reset_connector: {type: boolean, default: false, description: "Also reset the KV connector's cache (reset_connector_cache); with no connector that counts as success."}
    response: {type: object, properties: {reset: {type: boolean}}}
    behavior:
      - if: "has(input.reset_running_requests) && input.reset_running_requests"
        then:
          - title: Preempt every running request, last first, dropping its stale in-flight output
            detail: "The requests are preempted and resumed in the same step, so output still in flight would arrive out of order: drop_stale_output=True."
            source: "vllm/v1/core/sched/scheduler.py:2850-2860"
            foreach: "= state.running.reverse()"
            as: rid
            steps:
              - call: scheduler.preempt-request
                input: {request_id: "= vars.rid", drop_stale_output: true}
          - title: Forget which requests ran last step (they are flushed from the persistent batch)
            source: "vllm/v1/core/sched/scheduler.py:2862-2866"
            set: {state.prev_step_scheduled_req_ids: []}
      - call: kv-cache-manager.reset-prefix-cache
        as: r
      - if: "has(input.reset_running_requests) && input.reset_running_requests && !vars.r.value.reset"
        then:
          - title: Reset failed even after preempting everything
            source: "vllm/v1/core/sched/scheduler.py:2868-2874"
            fail: {code: runtime-error, status: 0, message: "Failed to reset KV cache even when all the running requests are preempted and moved to the waiting queue. This is likely due to the presence of running requests waiting for remote KV transfer, which is not supported yet."}
      - set: {vars.ok: "= vars.r.value.reset"}
      - if: "has(input.reset_connector) && input.reset_connector"
        then:
          - if: "config['kv-connector'] == ''"
            then:
              - title: No KV connector - nothing to reset, which counts as success
                source: "vllm/v1/core/sched/scheduler.py:2886-2895"
            else:
              - title: Reset the connector's cache; False fails the whole reset
                source: "vllm/v1/core/sched/scheduler.py:2897-2898"
                call: kv-connector-base-v1.reset-cache
                as: rc
              - set: {vars.ok: "= vars.rc.value.reset != false && vars.ok"}
      - return: {reset: "= vars.ok"}

  # ------------------------------------------------------------------ schedule()
  - component: scheduler
    name: schedule
    kind: function
    latency_ms: 0
    summary: "One scheduling step: decode and continuing prefills of RUNNING requests first, then WAITING admissions, within the token budget, max_num_seqs and free KV blocks."
    description: >-
      There is no prefill or decode phase: each request has num_computed_tokens and
      num_tokens, and the step assigns tokens so computed catches up (chunked prefill,
      prefix caching and decode are the same rule). A running request that can't get
      blocks preempts the last running request (FCFS) or the lowest-priority one, possibly
      itself. Any preemption in a step skips all waiting admissions in that step.
    sources: ["vllm/v1/core/sched/scheduler.py:591-1556", "vllm/v1/core/sched/output.py:231-326", "vllm/v1/request.py:294-300", "vllm/v1/core/sched/output.py:193-203", "vllm/v1/core/sched/output.py:85-91", "vllm/v1/core/sched/output.py:175-177", "vllm/v1/core/sched/output.py:214-228"]
    request: {type: object, properties: {throttle_prefills: {type: boolean, default: false}}}
    response: SchedulerOutput
    behavior:
      - title: Start the step with the token budget
        detail: "The budget is max_num_scheduled_tokens (defaults to max_num_batched_tokens); it is 0 when paused."
        source: "vllm/v1/core/sched/scheduler.py:604-611"
        set:
          state.current_step: "= state.current_step + 1"
          vars.policy: "= config['scheduling-policy']"
          vars.token_budget: "= state.pause_state == 'PAUSED_ALL' ? 0 : int(config['max-num-batched-tokens'])"
          vars.sched: {}
          vars.new_blocks: {}
          vars.sched_running: []
          vars.sched_new: []
          vars.sched_resumed: []
          vars.preempted: []
          vars.req_index: 0
          vars.async_sched: "= config['async-scheduling'] == true"
          vars.spec: {}
          vars.skipped: []
          vars.k: "= int(config['num-speculative-tokens'])"
          vars.lookahead: "= config['speculative-method'] != '' && config['speculative-method'] != 'ngram' ? int(config['num-speculative-tokens']) : 0"
      - title: Long-prefill cap only when another request could starve
        source: "vllm/v1/core/sched/scheduler.py:640-649"
        set:
          vars.long_thr: "= size(state.running) + size(state.waiting) > 1 ? int(config['long-prefill-token-threshold']) : 0"
      - if: "vars.long_thr > 0 && config['long-prefill-token-threshold-adaptive']"
        then:
          - title: Adaptive cap - floor it at a fair share of the input budget
            detail: "max(long_prefill_token_threshold, max_num_batched_tokens // (running + waiting)), so the cap never cuts a request below its share."
            source: "vllm/v1/core/sched/scheduler.py:650-655"
            set:
              vars.long_thr: "= math.greatest(vars.long_thr, int(config['max-num-batched-tokens']) / (size(state.running) + size(state.waiting)))"
      - title: First, schedule the RUNNING requests
        source: "vllm/v1/core/sched/scheduler.py:657-659"
        foreach: "= lists.range(size(state.running))"
        as: it
        max: 1000
        steps:
          - if: "vars.req_index >= size(state.running) || vars.token_budget <= 0"
            then: [{break: true}]
          - set: {vars.rid: "= state.running[vars.req_index]"}
          - set: {vars.req: "= state.requests[vars.rid]"}
          - if: "vars.req.num_output_placeholders > 0 && vars.req.num_computed_tokens + 2 - vars.req.num_output_placeholders >= vars.req.num_prompt_tokens + vars.req.max_tokens"
            then:
              - title: Async - the in-flight step already reaches max_tokens
                source: "vllm/v1/core/sched/scheduler.py:667-681"
                set: {vars.req_index: "= vars.req_index + 1"}
              - continue: true
          - title: Tokens this request still needs
            detail: "num_tokens_with_spec + num_output_placeholders - num_computed_tokens, cut by the long-prefill cap, the budget and max_model_len."
            source: "vllm/v1/core/sched/scheduler.py:703-721"
            set:
              vars.num_new: "= vars.req.num_prompt_tokens + size(vars.req.output_token_ids) + size(vars.req.spec_token_ids) + vars.req.num_output_placeholders - vars.req.num_computed_tokens"
          - set:
              vars.num_new: "= vars.long_thr > 0 && vars.long_thr < vars.num_new ? vars.long_thr : vars.num_new"
          - set:
              vars.num_new: "= math.least([vars.num_new, vars.token_budget, int(config['max-model-len']) - vars.req.num_computed_tokens - 1])"
          - if: "has(vars.req.mm_features) && size(vars.req.mm_features) > 0"
            then:
              - title: Schedule the request's encoder inputs in this chunk
                source: "vllm/v1/core/sched/scheduler.py:729-747"
                call: scheduler.try-schedule-encoder-inputs
                input: {request_id: "= vars.rid", mm_features: "= vars.req.mm_features", num_computed_tokens: "= vars.req.num_computed_tokens", num_new_tokens: "= vars.num_new", encoder_compute_budget: "= has(vars.enc_budget) ? vars.enc_budget : (has(state.max_num_encoder_input_tokens) ? state.max_num_encoder_input_tokens : 0)"}
                as: tenc
              - set: {vars.enc: "= vars.tenc.value", vars.num_new: "= vars.tenc.value.num_new_tokens"}
          - if: "vars.num_new <= 0"
            then:
              - title: Nothing to schedule for this request (or the encoder budget or cache is exhausted); try the next
                source: "vllm/v1/core/sched/scheduler.py:755-773"
                set: {vars.req_index: "= vars.req_index + 1"}
              - continue: true
          - set: {vars.alloc_ok: false}
          - title: Allocate slots, preempting until it fits
            source: "vllm/v1/core/sched/scheduler.py:776-845"
            foreach: "= lists.range(size(state.running))"
            as: try_i
            steps:
              - call: kv-cache-manager.allocate-slots
                input:
                  request_id: "= vars.rid"
                  status: RUNNING
                  num_computed_tokens: "= vars.req.num_computed_tokens"
                  num_tokens: "= vars.req.num_prompt_tokens + size(vars.req.output_token_ids)"
                  num_new_tokens: "= vars.num_new"
                  num_lookahead_tokens: "= vars.lookahead"
                  block_hashes: "= vars.req.block_hashes"
                  token_ids: "= config['enable-kv-cache-events'] ? (vars.req.prompt_token_ids != null ? dyn(vars.req.prompt_token_ids + vars.req.output_token_ids) : dyn(vars.req.prompt_segments.map(s, lists.range(s.num_tokens).map(i, s.key + '#' + string(i))).flatten() + vars.req.output_token_ids.map(t, dyn(t)))) : dyn(null)"
                  lora_request: "= has(vars.req.lora_request) ? vars.req.lora_request : dyn(null)"
                as: alloc
              - if: "vars.alloc.value.allocated"
                then: [{set: {vars.alloc_ok: true}}, {break: true}]
              - title: Choose the preemption victim
                detail: "Priority: max (priority, arrival_time) among running. FCFS: the last running request."
                source: "vllm/v1/core/sched/scheduler.py:795-802"
                set:
                  vars.victim: "= vars.policy == 'priority' ? state.running.filter(id, !state.running.exists(o, state.requests[o].priority > state.requests[id].priority || (state.requests[o].priority == state.requests[id].priority && state.requests[o].arrival_time > state.requests[id].arrival_time)))[0] : state.running[size(state.running) - 1]"
              - if: "vars.policy == 'priority'"
                then:
                  - set: {vars.victim_index: "= lists.range(size(state.running)).filter(i, state.running[i] == vars.victim)[0]"}
                  - if: "vars.victim_index < vars.req_index"
                    then: [{set: {vars.req_index: "= vars.req_index - 1"}}]
                  - if: "vars.victim in vars.sched_running"
                    then:
                      - title: Give back the victim's tokens scheduled earlier this step
                        source: "vllm/v1/core/sched/scheduler.py:813-820"
                        set:
                          vars.token_budget: "= vars.token_budget + vars.sched[vars.victim]"
                          vars.sched: "= omit(vars.sched, vars.victim)"
                          vars.new_blocks: "= omit(vars.new_blocks, vars.victim)"
                          vars.spec: "= omit(vars.spec, vars.victim)"
                          vars.sched_running: "= vars.sched_running.filter(x, x != vars.victim)"
              - call: scheduler.preempt-request
                input: {request_id: "= vars.victim"}
              - set: {vars.preempted: "= vars.preempted + [vars.victim]"}
              - if: "vars.victim == vars.rid"
                then:
                  - title: Preempted itself; it cannot be scheduled
                    source: "vllm/v1/core/sched/scheduler.py:842-844"
                    break: true
          - if: "!vars.alloc_ok"
            then:
              - title: Cannot schedule this request; stop the running pass
                source: "vllm/v1/core/sched/scheduler.py:846-848"
                break: true
          - title: Schedule the running request
            source: "vllm/v1/core/sched/scheduler.py:850-858"
            set:
              vars.sched: "= merge(vars.sched, {vars.rid: vars.num_new})"
              vars.new_blocks: "= merge(vars.new_blocks, {vars.rid: vars.alloc.value.new_block_ids})"
              vars.sched_running: "= vars.sched_running + [vars.rid]"
              vars.token_budget: "= vars.token_budget - vars.num_new"
              vars.req_index: "= vars.req_index + 1"
          - set:
              vars.n_spec: "= vars.num_new + vars.req.num_computed_tokens - (vars.req.num_prompt_tokens + size(vars.req.output_token_ids)) - vars.req.num_output_placeholders"
          - if: "size(vars.req.spec_token_ids) > 0"
            then:
              - title: Schedule the request's draft tokens for verification
                detail: "The tokens past num_tokens are draft (spec) tokens; the request's spec_token_ids are consumed here (new ones arrive before the next step)."
                source: "vllm/v1/core/sched/scheduler.py:861-876"
                set:
                  vars.spec: "= vars.n_spec > 0 ? merge(vars.spec, {vars.rid: vars.req.spec_token_ids.slice(0, math.least(vars.n_spec, size(vars.req.spec_token_ids)))}) : vars.spec"
                  state.requests: "= merge(state.requests, {vars.rid: {'spec_token_ids': []}})"
          - if: "has(vars.req.mm_features) && size(vars.req.mm_features) > 0 && size(vars.enc.encoder_inputs_to_schedule) > 0"
            then:
              - title: Encoder-related - record the scheduled inputs, spend the budget and reserve cache slots
                source: "vllm/v1/core/sched/scheduler.py:878-887"
                set:
                  vars.enc_sched: "= merge(has(vars.enc_sched) ? vars.enc_sched : {}, {vars.rid: vars.enc.encoder_inputs_to_schedule})"
                  vars.enc_budget: "= vars.enc.encoder_compute_budget"
              - call: scheduler.allocate-encoder-inputs
                input: {request_id: "= vars.rid", mm_features: "= vars.req.mm_features", input_ids: "= vars.enc.encoder_inputs_to_schedule", duplicate_input_ids: "= vars.enc.duplicate_encoder_inputs"}
      - title: Record the LoRAs of the scheduled running requests
        source: "vllm/v1/core/sched/scheduler.py:889-897"
        set:
          vars.lids: "= config['enable-lora'] ? vars.sched_running.filter(id, has(state.requests[id].lora_request) && state.requests[id].lora_request != null && state.requests[id].lora_request.lora_int_id > 0).map(id, state.requests[id].lora_request.lora_int_id) : []"
      - set:
          vars.loras: "= lists.range(size(vars.lids)).filter(i, !(vars.lids[i] in vars.lids.slice(0, i))).map(i, vars.lids[i])"
      - if: "size(vars.preempted) > 0 || state.pause_state != 'UNPAUSED'"
        then:
          - title: Preemption this step; no waiting request is admitted
            detail: "Also when paused: PAUSED_ALL schedules nothing, and PAUSED_NEW admits only KV-holding waiting requests (none without a KV connector)."
            source: "vllm/v1/core/sched/scheduler.py:899-919"
        else:
          - title: Next, schedule the WAITING requests
            source: "vllm/v1/core/sched/scheduler.py:911-926"
            foreach: "= lists.range(size(state.waiting))"
            as: wit
            max: 1000
            steps:
              - if: "vars.token_budget <= 0 || size(state.waiting) == 0"
                then: [{break: true}]
              - if: "size(state.running) + state.num_waiting_for_streaming_input >= int(config['max-num-seqs'])"
                then:
                  - title: max_num_seqs requests already running
                    source: "vllm/v1/core/sched/scheduler.py:920-924"
                    break: true
              - if: "size(state.waiting.filter(id, !(id in vars.skipped))) == 0"
                then: [{break: true}]
              - call: "= vars.policy == 'priority' ? 'priority-request-queue.peek-request' : 'fcfs-request-queue.peek-request'"
                targets: [priority-request-queue.peek-request, fcfs-request-queue.peek-request]
                input:
                  queue: "= state.waiting.filter(id, !(id in vars.skipped)).map(id, {'request_id': id, 'priority': state.requests[id].priority, 'arrival_time': state.requests[id].arrival_time})"
                as: peek
              - set: {vars.wid: "= vars.peek.value.request_id"}
              - if: "state.requests[vars.wid].status == 'WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR'"
                then:
                  - title: Blocked on its grammar - check whether compilation finished
                    source: "vllm/v1/core/sched/scheduler.py:3191-3194"
                    call: structured-output-manager.grammar-status
                    input: {request_id: "= state.requests[vars.wid].grammar_id"}
                    as: gst
                  - if: "vars.gst.value.status == 'pending'"
                    then:
                      - title: Grammar still compiling; skip this request this step
                        source: "vllm/v1/core/sched/scheduler.py:3193-3194"
                        set: {vars.skipped: "= vars.skipped + [vars.wid]"}
                      - continue: true
                  - if: "vars.gst.value.status == 'failed'"
                    then:
                      - title: Grammar compilation failed; the request is finished with an error after the step
                        source: "vllm/v1/core/sched/scheduler.py:3195-3197"
                        set:
                          state.grammar_compile_error_reqs: "= state.grammar_compile_error_reqs + [vars.wid]"
                          vars.skipped: "= vars.skipped + [vars.wid]"
                      - continue: true
                  - title: Grammar ready; promote to WAITING
                    source: "vllm/v1/core/sched/scheduler.py:3198-3199"
                    set: {state.requests: "= merge(state.requests, {vars.wid: {'status': 'WAITING'}})"}
              - if: "has(state.requests[vars.wid].num_stale_output_tokens) && state.requests[vars.wid].num_stale_output_tokens > 0 && !state.requests[vars.wid].drop_stale_output"
                then:
                  - title: Deliverable stale output still in flight - resuming now could resample a position that output delivers; skip
                    source: "vllm/v1/core/sched/scheduler.py:934-938"
                    set: {vars.skipped: "= vars.skipped + [vars.wid]"}
                  - continue: true
              - if: "config['enable-lora'] && has(state.requests[vars.wid].lora_request) && state.requests[vars.wid].lora_request != null && size(vars.loras) == int(config['max-loras']) && !(state.requests[vars.wid].lora_request.lora_int_id in vars.loras)"
                then:
                  - title: Admitting it would exceed max_loras; skip this request this step
                    source: "vllm/v1/core/sched/scheduler.py:940-951"
                    set: {vars.skipped: "= vars.skipped + [vars.wid]"}
                  - continue: true
              - set:
                  vars.wreq: "= state.requests[vars.wid]"
                  vars.hit_blocks: []
                  vars.num_hit: 0
                  vars.num_ext: 0
                  vars.load_async: false
                  vars.mamba_hit: null
              - if: "vars.wreq.status == 'WAITING_FOR_REMOTE_KVS'"
                then:
                  - if: "!(vars.wid in state.finished_recving_kv_req_ids)"
                    then:
                      - title: Remote KV still loading; skip this request this step
                        source: "vllm/v1/core/sched/scheduler.py:3178-3185"
                        set: {vars.skipped: "= vars.skipped + [vars.wid]"}
                      - continue: true
                  - title: Remote KV arrived - cache the loaded blocks and promote to WAITING
                    detail: "A fully loaded prompt recomputes its last token so the next one can be sampled."
                    source: "vllm/v1/core/sched/scheduler.py:3123-3175"
                    call: kv-cache-manager.cache-blocks
                    input: {request_id: "= vars.wid", num_tokens: "= vars.wreq.num_computed_tokens", block_hashes: "= vars.wreq.block_hashes", token_ids: "= config['enable-kv-cache-events'] ? (vars.wreq.prompt_token_ids != null ? dyn(vars.wreq.prompt_token_ids + vars.wreq.output_token_ids) : dyn(vars.wreq.prompt_segments.map(s, lists.range(s.num_tokens).map(i, s.key + '#' + string(i))).flatten() + vars.wreq.output_token_ids.map(t, dyn(t)))) : dyn(null)", lora_request: "= has(vars.wreq.lora_request) ? vars.wreq.lora_request : dyn(null)"}
                  - set:
                      state.finished_recving_kv_req_ids: "= state.finished_recving_kv_req_ids.filter(r, r != vars.wid)"
                      state.requests: "= merge(state.requests, {vars.wid: {'status': vars.wreq.num_preemptions > 0 ? 'PREEMPTED' : 'WAITING', 'num_computed_tokens': vars.wreq.num_computed_tokens == vars.wreq.num_prompt_tokens + size(vars.wreq.output_token_ids) ? vars.wreq.num_computed_tokens - 1 : vars.wreq.num_computed_tokens}})"
                  - set: {vars.wreq: "= state.requests[vars.wid]"}
              - set:
                  vars.num_tokens: "= vars.wreq.num_prompt_tokens + size(vars.wreq.output_token_ids)"
                  vars.prior: "= vars.wreq.num_computed_tokens"
              - if: "vars.wreq.num_computed_tokens == 0"
                then:
                  - title: Look up already-cached tokens
                    source: "vllm/v1/core/sched/scheduler.py:960-968"
                    call: kv-cache-manager.get-computed-blocks
                    input: {request_id: "= vars.wid", block_hashes: "= vars.wreq.block_hashes", num_tokens: "= vars.num_tokens", skip_reading_prefix_cache: "= has(vars.wreq.skip_reading_prefix_cache) && vars.wreq.skip_reading_prefix_cache", kv_cache_report_mode: "= has(vars.wreq.sampling_params.extra_args) && vars.wreq.sampling_params.extra_args != null && 'kv_cache_report_mode' in vars.wreq.sampling_params.extra_args ? vars.wreq.sampling_params.extra_args.kv_cache_report_mode : 'incremental'", token_ids: "= config['enable-kv-cache-events'] ? (vars.wreq.prompt_token_ids != null ? dyn(vars.wreq.prompt_token_ids + vars.wreq.output_token_ids) : dyn(vars.wreq.prompt_segments.map(s, lists.range(s.num_tokens).map(i, s.key + '#' + string(i))).flatten() + vars.wreq.output_token_ids.map(t, dyn(t)))) : dyn(null)", lora_request: "= has(vars.wreq.lora_request) ? vars.wreq.lora_request : dyn(null)"}
                    as: hit
                  - set: {vars.hit_blocks: "= vars.hit.value.blocks", vars.num_hit: "= vars.hit.value.num_computed_tokens", vars.mamba_hit: "= vars.hit.value.mamba_block"}
                  - if: "config['kv-connector'] != ''"
                    then:
                      - title: Ask the KV connector for external hits beyond the local block-aligned hit
                        source: "vllm/v1/core/sched/scheduler.py:970-990"
                        call: kv-connector-base-v1.get-num-new-matched-tokens
                        input:
                          request_id: "= vars.wid"
                          num_prompt_tokens: "= vars.wreq.num_prompt_tokens"
                          num_computed_tokens: "= vars.num_hit"
                          status: WAITING
                          kv_transfer_params: "= vars.wreq.kv_transfer_params"
                          block_hashes: "= vars.wreq.block_hashes"
                        as: ext
                      - set: {vars.num_ext: "= vars.ext.value.num_external_tokens", vars.load_async: "= vars.ext.value.load_async && vars.ext.value.num_external_tokens > 0"}
                      - if: "has(vars.wreq.skip_reading_prefix_cache) && vars.wreq.skip_reading_prefix_cache"
                        then:
                          - title: A request that skips the prefix cache takes no external hit either
                            source: "vllm/v1/core/sched/scheduler.py:983-984"
                            set: {vars.num_ext: 0, vars.load_async: false}
              - title: Tokens to compute for this request
                detail: "num_tokens (prompt plus any output a resumed request already has) minus local and external computed tokens; an async load schedules nothing now."
                source: "vllm/v1/core/sched/scheduler.py:1125-1129"
                set:
                  vars.num_new: "= vars.load_async ? 0 : vars.num_tokens - vars.prior - vars.num_hit - vars.num_ext"
              - set:
                  vars.num_new: "= vars.long_thr > 0 && vars.long_thr < vars.num_new ? vars.long_thr : vars.num_new"
              - if: "!vars.load_async && !config['enable-chunked-prefill'] && vars.num_new > vars.token_budget && !config['mm-encoder-only']"
                then:
                  - title: Chunked prefill off and the prompt exceeds the remaining budget
                    source: "vllm/v1/core/sched/scheduler.py:1158-1167"
                    break: true
              - title: Chunk to the remaining budget
                source: "vllm/v1/core/sched/scheduler.py:1169"
                set:
                  vars.num_new: "= math.least(vars.num_new, vars.token_budget)"
              - if: "has(vars.wreq.mm_features) && size(vars.wreq.mm_features) > 0"
                then:
                  - title: Schedule the request's encoder inputs in this chunk
                    source: "vllm/v1/core/sched/scheduler.py:1195-1209"
                    call: scheduler.try-schedule-encoder-inputs
                    input: {request_id: "= vars.wid", mm_features: "= vars.wreq.mm_features", num_computed_tokens: "= vars.prior + vars.num_hit + vars.num_ext", num_new_tokens: "= vars.load_async ? 0 : vars.num_new", encoder_compute_budget: "= has(vars.enc_budget) ? vars.enc_budget : (has(state.max_num_encoder_input_tokens) ? state.max_num_encoder_input_tokens : 0)"}
                    as: wtenc
                  - set: {vars.wenc: "= vars.wtenc.value", vars.num_new: "= vars.wtenc.value.num_new_tokens"}
                  - if: "vars.num_new == 0 && !vars.load_async"
                    then:
                      - title: The encoder budget or cache can't take the next item; stop admitting
                        source: "vllm/v1/core/sched/scheduler.py:1217-1219"
                        break: true
              - call: kv-cache-manager.allocate-slots
                input:
                  request_id: "= vars.wid"
                  status: "= vars.wreq.status"
                  num_computed_tokens: "= vars.prior"
                  num_tokens: "= vars.num_tokens"
                  num_new_tokens: "= vars.num_new"
                  num_new_computed_tokens: "= vars.num_hit"
                  new_computed_blocks: "= vars.hit_blocks"
                  mamba_hit_block: "= vars.mamba_hit"
                  num_external_computed_tokens: "= vars.num_ext"
                  num_lookahead_tokens: "= vars.load_async ? 0 : vars.lookahead"
                  delay_cache_blocks: "= vars.load_async"
                  block_hashes: "= vars.wreq.block_hashes"
                  full_sequence_must_fit: "= config['scheduler-reserve-full-isl']"
                  has_scheduled_reqs: "= size(state.running) > 0"
                  token_ids: "= config['enable-kv-cache-events'] ? (vars.wreq.prompt_token_ids != null ? dyn(vars.wreq.prompt_token_ids + vars.wreq.output_token_ids) : dyn(vars.wreq.prompt_segments.map(s, lists.range(s.num_tokens).map(i, s.key + '#' + string(i))).flatten() + vars.wreq.output_token_ids.map(t, dyn(t)))) : dyn(null)"
                  lora_request: "= has(vars.wreq.lora_request) ? vars.wreq.lora_request : dyn(null)"
                as: walloc
              - if: "!vars.walloc.value.allocated"
                then:
                  - if: "has(vars.wreq.mm_features) && size(vars.wreq.mm_features) > 0"
                    then:
                      - title: Untouch the request's encoder-cache references
                        source: "vllm/v1/core/sched/scheduler.py:1275-1281"
                        call: encoder-cache-manager.free
                        input: {request_id: "= vars.wid", mm_hashes: "= vars.wreq.mm_features.map(f, f.identifier)"}
                  - title: Not enough KV blocks; stop admitting this step
                    source: "vllm/v1/core/sched/scheduler.py:1272-1282"
                    break: true
              - if: "config['kv-connector'] != ''"
                then:
                  - title: Tell the connector which blocks hold the external tokens
                    source: "vllm/v1/core/sched/scheduler.py:1287-1293"
                    call: kv-connector-base-v1.update-state-after-alloc
                    input:
                      request_id: "= vars.wid"
                      num_prompt_tokens: "= vars.wreq.num_prompt_tokens"
                      num_external_tokens: "= vars.num_ext"
                      kv_transfer_params: "= vars.wreq.kv_transfer_params"
                      block_hashes: "= vars.wreq.block_hashes"
                      block_ids: ["= vars.walloc.value.block_ids"]
                    as: upd
                  - if: "vars.upd.value.kv_transfer_params != null"
                    then:
                      - set: {state.requests: "= merge(state.requests, {vars.wid: {'kv_transfer_params': vars.upd.value.kv_transfer_params}})"}
              - if: "vars.wreq.num_computed_tokens == 0 && vars.wreq.num_preemptions <= 0 && has(vars.wreq.prefill_stats) && vars.wreq.prefill_stats != null"
                then:
                  - title: Track the first scheduled prefill (not a post-preemption repeat) in the request's PrefillStats
                    detail: "PrefillStats.set: computed = prompt - (local + external cached)."
                    source: "vllm/v1/core/sched/scheduler.py:1074-1081"
                    set:
                      state.requests: "= merge(state.requests, {vars.wid: {'prefill_stats': {'num_prompt_tokens': vars.wreq.num_prompt_tokens, 'num_computed_tokens': vars.wreq.num_prompt_tokens - vars.num_hit - vars.num_ext, 'num_cached_tokens': vars.num_hit + vars.num_ext, 'num_local_cached_tokens': vars.num_hit, 'num_external_cached_tokens': vars.num_ext, 'num_cache_creation_tokens': 0}}})"
              - if: "vars.wreq.num_computed_tokens == 0"
                then:
                  - title: Record prefix-cache stats at admission
                    source: "vllm/v1/core/sched/scheduler.py:1314-1318"
                    call: kv-cache-manager.record-prefix-cache-stats
                    input: {num_tokens: "= vars.num_tokens", num_hits: "= vars.num_hit", preempted: "= vars.wreq.num_preemptions > 0", skip_reading_prefix_cache: "= has(vars.wreq.skip_reading_prefix_cache) && vars.wreq.skip_reading_prefix_cache"}
              - if: "vars.load_async"
                then:
                  - title: Async KV load - wait in WAITING_FOR_REMOTE_KVS holding the blocks
                    detail: "num_computed_tokens already counts the tokens being loaded; the request stays in the waiting queue and is skipped until the load finishes."
                    source: "vllm/v1/core/sched/scheduler.py:1320-1341"
                    set:
                      state.requests: "= merge(state.requests, {vars.wid: {'status': 'WAITING_FOR_REMOTE_KVS', 'num_computed_tokens': vars.num_hit + vars.num_ext, 'num_cached_tokens': vars.num_hit + vars.num_ext}})"
                      vars.skipped: "= vars.skipped + [vars.wid]"
                  - continue: true
              - title: Move the request to RUNNING
                detail: "A WAITING request is a new request; a PREEMPTED one is resumed. It leaves the deferred set and records a SCHEDULED event."
                source: "vllm/v1/core/sched/scheduler.py:1343-1371"
                set:
                  state.deferred_waiting: "= state.deferred_waiting.filter(r, r != vars.wid)"
                  state.waiting: "= state.waiting.filter(r, r != vars.wid)"
                  state.running: "= state.running + [vars.wid]"
                  vars.sched_new: "= vars.wreq.status == 'WAITING' ? vars.sched_new + [vars.wid] : vars.sched_new"
                  vars.sched_resumed: "= vars.wreq.status == 'PREEMPTED' ? vars.sched_resumed + [vars.wid] : vars.sched_resumed"
                  vars.sched: "= merge(vars.sched, {vars.wid: vars.num_new})"
                  vars.new_blocks: "= merge(vars.new_blocks, {vars.wid: vars.walloc.value.block_ids})"
                  vars.token_budget: "= vars.token_budget - vars.num_new"
                  state.requests: "= merge(state.requests, {vars.wid: {'status': 'RUNNING', 'num_computed_tokens': vars.prior + vars.num_hit + vars.num_ext, 'num_cached_tokens': vars.wreq.num_preemptions == 0 && vars.prior == 0 ? vars.num_hit + vars.num_ext : vars.wreq.num_cached_tokens, 'events': config['disable-log-stats'] ? (has(vars.wreq.events) ? vars.wreq.events : []) : (has(vars.wreq.events) ? vars.wreq.events : []) + [{'type': 'SCHEDULED', 'timestamp': double(now_us) / 1000000.0}]}})"
              - if: "has(vars.wreq.mm_features) && size(vars.wreq.mm_features) > 0 && size(vars.wenc.encoder_inputs_to_schedule) > 0"
                then:
                  - title: Encoder-related - record the scheduled inputs, spend the budget and reserve cache slots
                    source: "vllm/v1/core/sched/scheduler.py:1380-1390"
                    set:
                      vars.enc_sched: "= merge(has(vars.enc_sched) ? vars.enc_sched : {}, {vars.wid: vars.wenc.encoder_inputs_to_schedule})"
                      vars.enc_budget: "= vars.wenc.encoder_compute_budget"
                  - call: scheduler.allocate-encoder-inputs
                    input: {request_id: "= vars.wid", mm_features: "= vars.wreq.mm_features", input_ids: "= vars.wenc.encoder_inputs_to_schedule", duplicate_input_ids: "= vars.wenc.duplicate_encoder_inputs"}
              - if: "config['enable-lora'] && has(vars.wreq.lora_request) && vars.wreq.lora_request != null"
                then:
                  - title: Count the admitted request's adapter against max_loras
                    source: "vllm/v1/core/sched/scheduler.py:1360-1361"
                    set: {vars.loras: "= vars.wreq.lora_request.lora_int_id in vars.loras ? vars.loras : vars.loras + [vars.wreq.lora_request.lora_int_id]"}
          - if: "size(vars.skipped) > 0"
            then:
              - set:
                  state.deferred_waiting: "= state.deferred_waiting + vars.skipped.filter(r, !(r in state.deferred_waiting) && r in state.waiting)"
      - title: Build the SchedulerOutput
        detail: "With the V2 model runner a resumed request is sent as a new request with its full block table; running requests carry only their new block ids."
        source: "vllm/v1/core/sched/scheduler.py:1404-1446"
        set:
          vars.as_new: "= config['use-v2-model-runner'] ? vars.sched_new + vars.sched_resumed : vars.sched_new"
          vars.as_resumed: "= config['use-v2-model-runner'] ? [] : vars.sched_resumed"
          vars.total: "= sum(vars.sched.transformList(k, v, v))"
      - title: NewRequestData carries the prompt and, for the V2 runner, every token to prefill
        detail: "from_request(req, block_ids, req._all_token_ids): prefill_token_ids is the prompt plus any output a resumed request already has (Request.num_tokens of them). A prompt given as segments has no token ids, so num_prompt_tokens and num_prefill_tokens carry the lengths."
        source: "vllm/v1/core/sched/output.py:40-81"
        set:
          vars.output:
            scheduled_new_reqs: "= vars.as_new.map(id, merge(config['use-v2-model-runner'] && state.requests[id].prompt_token_ids != null ? {'prefill_token_ids': state.requests[id].prompt_token_ids + state.requests[id].output_token_ids} : {}, {'req_id': id, 'prompt_token_ids': state.requests[id].prompt_token_ids, 'num_prompt_tokens': state.requests[id].num_prompt_tokens, 'prompt_len': state.requests[id].num_prompt_tokens, 'num_prefill_tokens': state.requests[id].num_prompt_tokens + size(state.requests[id].output_token_ids), 'prompt_segments': state.requests[id].prompt_token_ids == null ? state.requests[id].prompt_segments : dyn(null), 'block_ids': vars.new_blocks[id], 'num_computed_tokens': state.requests[id].num_computed_tokens, 'sampling_params': state.requests[id].sampling_params, 'lora_request': has(state.requests[id].lora_request) ? state.requests[id].lora_request : dyn(null)}))"
            scheduled_cached_reqs:
              req_ids: "= vars.sched_running + vars.as_resumed"
              resumed_req_ids: "= vars.as_resumed"
              new_block_ids: "= (vars.sched_running + vars.as_resumed).map(id, vars.new_blocks[id])"
              num_computed_tokens: "= (vars.sched_running + vars.as_resumed).map(id, state.requests[id].num_computed_tokens)"
              num_output_tokens: "= (vars.sched_running + vars.as_resumed).map(id, size(state.requests[id].output_token_ids) + state.requests[id].num_output_placeholders)"
            num_scheduled_tokens: "= vars.sched"
            total_num_scheduled_tokens: "= vars.total"
            finished_req_ids: "= state.finished_req_ids"
            preempted_req_ids: "= state.preempted_req_ids"
            scheduled_spec_decode_tokens: "= vars.spec"
            num_spec_tokens_to_schedule: "= vars.k"
            scheduled_encoder_inputs: "= has(vars.enc_sched) ? vars.enc_sched : {}"
            free_encoder_mm_hashes: []
      - if: "has(state.max_num_encoder_input_tokens) && state.max_num_encoder_input_tokens > 0"
        then:
          - title: Tell the workers which encoder outputs were evicted (a text-only model's zero-size cache never evicts)
            source: "vllm/v1/core/sched/scheduler.py:1515"
            call: encoder-cache-manager.get-freed-mm-hashes
            as: freed_mm
          - set: {vars.output: "= merge(vars.output, {'free_encoder_mm_hashes': vars.freed_mm.value.freed})"}
      - if: "!config['use-v2-model-runner']"
        then:
          - title: MRV1 - a cached request not scheduled last step gets its full token ids; remember this step's ids
            source: "vllm/v1/core/sched/scheduler.py:1449-1452"
            set:
              vars.output: "= merge(vars.output, {'scheduled_cached_reqs': merge(vars.output.scheduled_cached_reqs, {'all_token_ids_req_ids': (vars.sched_running + vars.as_resumed).filter(id, !(id in state.prev_step_scheduled_req_ids))})})"
              state.prev_step_scheduled_req_ids: "= vars.sched.transformList(k, v, k)"
      - if: "config['kv-connector'] != ''"
        then:
          - title: Build this step's KV connector metadata and attach it to the SchedulerOutput
            source: "vllm/v1/core/sched/scheduler.py:1523-1530"
            call: kv-connector-base-v1.build-connector-meta
            input:
              scheduled_new_reqs: "= vars.output.scheduled_new_reqs.map(r, {'req_id': r.req_id, 'block_ids': r.block_ids})"
            as: kvmeta
          - set: {vars.output: "= merge(vars.output, {'kv_connector_metadata': vars.kvmeta.value})"}
      - title: "Async: a scheduled structured-output request past its prefill whose earlier tokens are still in flight (placeholders) has a grammar that lags; the engine must defer this step's sampling"
        source: "vllm/v1/core/sched/async_scheduler.py:31-38"
        set:
          vars.output: "= merge(vars.output, {'pending_structured_output_tokens': vars.async_sched && vars.sched.exists(sid, has(state.requests[sid].grammar_id) && state.requests[sid].grammar_id != null && state.requests[sid].num_output_placeholders > 0 && state.requests[sid].num_computed_tokens + vars.sched[sid] >= state.requests[sid].num_prompt_tokens + size(state.requests[sid].output_token_ids) + state.requests[sid].num_output_placeholders)})"
      - if: "vars.total > 0 && (config['kv-connector'] != '' && 'kv-role' in config && config['kv-role'] in ['kv_consumer', 'kv_both'] && (config['async-scheduling'] == true ? (config['use-v2-model-runner'] ? ('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1) + 1 : (('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1) <= 1 ? 2 : ('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1))) : ('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1)) > 1)"
        then:
          - title: Deferred block free - advance the fence for a non-empty step
            source: "vllm/v1/core/sched/scheduler.py:1549-1552"
            set:
              state.sched_step_seq: "= (has(state.sched_step_seq) ? state.sched_step_seq : 0) + 1"
      - title: Advance num_computed_tokens after scheduling
        detail: "So a chunked prefill can be scheduled again next step; async scheduling also adds one output placeholder per decoding request. With deferred block free on, each scheduled request records this step's fence (last_sched_seq)."
        source: "vllm/v1/core/sched/scheduler.py:1616-1648"
        foreach: "= vars.sched"
        as: n
        index: sid
        max: 1000
        steps:
          - set:
              vars.r: "= state.requests[vars.sid]"
          - set:
              vars.computed: "= vars.r.num_computed_tokens + vars.n"
          - set:
              vars.is_chunk: "= vars.computed < vars.r.num_prompt_tokens + size(vars.r.output_token_ids) + vars.r.num_output_placeholders"
          - set:
              vars.n_spec_sched: "= vars.sid in vars.spec ? size(vars.spec[vars.sid]) : 0"
          - title: Async - placeholders for the sampled and draft tokens, and -1 draft slots for the next step
            source: "vllm/v1/core/sched/async_scheduler.py:25-57"
            set:
              state.requests: "= merge(state.requests, {vars.sid: {'num_computed_tokens': vars.computed, 'num_in_flight_tokens': (has(vars.r.num_in_flight_tokens) ? vars.r.num_in_flight_tokens : 0) + vars.n, 'last_sched_seq': has(state.sched_step_seq) ? state.sched_step_seq : 0, 'is_prefill_chunk': vars.is_chunk, 'num_output_placeholders': vars.async_sched && !vars.is_chunk ? vars.r.num_output_placeholders + 1 + vars.n_spec_sched : vars.r.num_output_placeholders, 'spec_token_ids': vars.async_sched && !vars.is_chunk && vars.k > 0 ? lists.range(vars.k).map(i, -1) : vars.r.spec_token_ids}})"
      - title: Clear finished and preempted ids (they went out in this output)
        source: "vllm/v1/core/sched/scheduler.py:1644-1648"
        set:
          state.finished_req_ids: []
          state.preempted_req_ids: []
      - return: "= vars.output"

  # ----------------------------------------------------------- update_from_output
  - component: scheduler
    name: update-from-output
    kind: function
    latency_ms: 0
    summary: "Apply a step's ModelRunnerOutput: append sampled tokens, check stops, free finished requests, and build EngineCoreOutputs."
    description: "Owned by scheduler-kv by override: the scheduler owns request state transitions after each step."
    sources: ["vllm/v1/core/sched/scheduler.py:2026-2424", "vllm/v1/outputs.py:266-350", "vllm/v1/request.py:272-283", "vllm/v1/request.py:370-397"]
    request:
      type: object
      required: [scheduler_output, model_runner_output]
      properties:
        scheduler_output: SchedulerOutput
        model_runner_output:
          allOf:
            - $ref: ModelRunnerOutput
            - type: object
              properties:
                kv_connector_output:
                  type: [object, "null"]
                  description: "KVConnectorOutput aggregated from the workers (vllm/v1/outputs.py)."
                  properties:
                    finished_sending: {type: array, items: {type: string}}
                    finished_recving: {type: array, items: {type: string}}
                    finished_store_events: {type: array, items: {type: integer}}
                logprobs:
                  type: [object, "null"]
                  default: null
                  description: "LogprobsLists of the batch's sampled positions (ModelRunnerOutput.logprobs; None when no row asked for logprobs). Rows are per sampled position: row req_index (or cu_num_generated_tokens[req_index] with spec decode) starts the request's positions. logprob_token_ids has the sampled token first then the top k. update_from_output hands them on under engine-core's EngineCoreOutput names {token_ids, logprobs, ranks}."
                  properties:
                    logprob_token_ids: {type: array, items: {type: array, items: {type: integer}}}
                    logprobs: {type: array, items: {type: array, items: {type: number}}}
                    sampled_token_ranks: {type: array, items: {type: integer}}
                    cu_num_generated_tokens: {type: [array, "null"], items: {type: integer}, default: null}
                prompt_logprobs_dict:
                  type: object
                  default: {}
                  description: "ModelRunnerOutput.prompt_logprobs_dict: req_id -> LogprobsTensors {logprob_token_ids, logprobs, selected_token_ranks} of this step's prompt positions (only for requests with prompt_logprobs; a partial prefill chunk's are held by the worker until the prompt completes)."
    response: SchedKvEngineCoreOutputs
    behavior:
      - set:
          vars.outputs: []
          vars.mro: "= input.model_runner_output"
          vars.async_sched: "= config['async-scheduling'] == true"
          vars.spec_stats: null
      - if: "(config['kv-connector'] != '' && 'kv-role' in config && config['kv-role'] in ['kv_consumer', 'kv_both'] && (config['async-scheduling'] == true ? (config['use-v2-model-runner'] ? ('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1) + 1 : (('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1) <= 1 ? 2 : ('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1))) : ('pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1)) > 1) && input.scheduler_output.total_num_scheduled_tokens > 0"
        then:
          - title: Every GPU write of this and earlier steps completed - advance processed_step_seq and return deferred blocks whose fence passed
            source: "vllm/v1/core/sched/scheduler.py:2044-2048"
            set:
              state.processed_step_seq: "= (has(state.processed_step_seq) ? state.processed_step_seq : 0) + 1"
          - call: scheduler.drain-deferred-frees
      - title: Walk the requests scheduled in that step
        source: "vllm/v1/core/sched/scheduler.py:2075-2077"
        foreach: "= input.scheduler_output.num_scheduled_tokens"
        as: n_sched
        index: rid
        max: 1000
        steps:
          - set: {vars.stale: false}
          - if: "vars.rid in state.requests"
            then:
              - set:
                  vars.stale: "= has(state.requests[vars.rid].num_stale_output_tokens) && state.requests[vars.rid].num_stale_output_tokens > 0"
                  state.requests: "= merge(state.requests, {vars.rid: {'num_in_flight_tokens': (has(state.requests[vars.rid].num_in_flight_tokens) ? state.requests[vars.rid].num_in_flight_tokens : 0) - vars.n_sched, 'num_stale_output_tokens': has(state.requests[vars.rid].num_stale_output_tokens) && state.requests[vars.rid].num_stale_output_tokens > 0 ? math.greatest(state.requests[vars.rid].num_stale_output_tokens - vars.n_sched, 0) : 0}})"
          - if: "!(vars.rid in state.requests) || state.requests[vars.rid].status.startsWith('FINISHED')"
            then:
              - title: Finished or aborted while the model ran; skip
                source: "vllm/v1/core/sched/scheduler.py:2091-2098"
                continue: true
          - if: "vars.stale && state.requests[vars.rid].drop_stale_output"
            then:
              - title: Drop-mode stale output (a same-step resume) is discarded entirely
                source: "vllm/v1/core/sched/scheduler.py:2101-2103"
                continue: true
          - set:
              vars.gen0: "= has(vars.mro.req_ids) && vars.rid in vars.mro.req_ids ? vars.mro.sampled_token_ids[lists.range(size(vars.mro.req_ids)).filter(i, vars.mro.req_ids[i] == vars.rid)[0]] : []"
              vars.drafts: "= has(input.scheduler_output.scheduled_spec_decode_tokens) && vars.rid in input.scheduler_output.scheduled_spec_decode_tokens ? input.scheduler_output.scheduled_spec_decode_tokens[vars.rid] : []"
          - if: "size(vars.drafts) > 0 && size(vars.gen0) > 0 && !vars.stale"
            then:
              - title: Roll back the rejected draft tokens
                detail: "accepted = sampled - 1 (the bonus/resampled token); num_computed_tokens and the output placeholders drop by the rejected count."
                source: "vllm/v1/core/sched/scheduler.py:2110-2128"
                set:
                  vars.rejected: "= size(vars.drafts) - math.greatest(size(vars.gen0) - 1, 0)"
              - set:
                  state.requests: "= merge(state.requests, {vars.rid: {'num_computed_tokens': state.requests[vars.rid].num_computed_tokens > 0 ? state.requests[vars.rid].num_computed_tokens - vars.rejected : 0, 'num_output_placeholders': state.requests[vars.rid].num_output_placeholders > 0 ? state.requests[vars.rid].num_output_placeholders - vars.rejected : 0}})"
              - title: Observe the draft in this step's SpecDecodingStats (only when stats are logged)
                detail: "make_spec_decoding_stats starts SpecDecodingStats.new(num_spec_tokens) on the first draft of the step and observe_draft adds one draft, its draft tokens, its accepted tokens and the per-position counts."
                source: "vllm/v1/core/sched/scheduler.py:2129-2135"
                call: scheduler.make-spec-decoding-stats
                input:
                  spec_decoding_stats: "= vars.spec_stats"
                  num_draft_tokens: "= size(vars.drafts)"
                  num_accepted_tokens: "= size(vars.drafts) - vars.rejected"
                as: sds
              - set: {vars.spec_stats: "= vars.sds.value"}
          - if: "has(state.requests[vars.rid].mm_features) && size(state.requests[vars.rid].mm_features) > 0"
            then:
              - title: Free encoder inputs only after the step has actually executed
                source: "vllm/v1/core/sched/scheduler.py:2151-2153"
                call: scheduler.free-encoder-inputs
                input: {request_id: "= vars.rid"}
          - set:
              vars.req: "= state.requests[vars.rid]"
              vars.gen: "= has(vars.mro.req_ids) && vars.rid in vars.mro.req_ids ? vars.mro.sampled_token_ids[lists.range(size(vars.mro.req_ids)).filter(i, vars.mro.req_ids[i] == vars.rid)[0]] : []"
              vars.stopped: false
              vars.status: "= state.requests[vars.rid].status"
              vars.stop_reason: null
              vars.kept: []
              vars.ex: {prefill_stats: null, new_logprobs: null}
          - if: "size(vars.gen) > 0"
            then:
              - title: Append tokens and check for stop
                detail: "Tokens after a stop are trimmed."
                source: "vllm/v1/core/sched/scheduler.py:2493-2510"
                foreach: "= vars.gen"
                as: tok
                steps:
                  - set:
                      vars.kept: "= vars.kept + [vars.tok]"
                  - call: sched-utils.check-stop
                    input:
                      last_token_id: "= vars.tok"
                      num_tokens: "= vars.req.num_prompt_tokens + size(vars.req.output_token_ids) + size(vars.kept)"
                      num_output_tokens: "= size(vars.req.output_token_ids) + size(vars.kept)"
                      max_tokens: "= vars.req.max_tokens"
                      min_tokens: "= vars.req.min_tokens"
                      eos_token_id: "= vars.req.eos_token_id"
                      stop_token_ids: "= vars.req.stop_token_ids"
                      output_token_ids: "= vars.req.output_token_ids + vars.kept"
                      repetition_detection: "= has(vars.req.sampling_params.repetition_detection) ? vars.req.sampling_params.repetition_detection : dyn(null)"
                    as: chk
                  - if: "vars.chk.value.stopped"
                    then:
                      - set: {vars.stopped: true, vars.status: "= vars.chk.value.status", vars.stop_reason: "= vars.chk.value.stop_reason"}
                      - break: true
              - set:
                  state.requests: "= merge(state.requests, {vars.rid: {'output_token_ids': vars.req.output_token_ids + vars.kept, 'status': vars.status, 'num_output_placeholders': vars.async_sched && !vars.stale ? math.greatest(vars.req.num_output_placeholders - size(vars.kept), 0) : vars.req.num_output_placeholders}})"
              - if: "vars.req.grammar_id != null"
                then:
                  - title: Advance the request's grammar
                    source: "vllm/v1/core/sched/scheduler.py:2186-2197"
                    call: structured-output-manager.accept-tokens
                    input: {request_id: "= vars.rid", grammar_id: "= vars.req.grammar_id", new_token_ids: "= vars.kept"}
                    as: acc
                  - if: "!vars.acc.value.accepted"
                    then:
                      - title: Grammar rejected the tokens; terminate the request
                        source: "vllm/v1/core/sched/scheduler.py:2186-2197"
                        set: {vars.stopped: true, vars.status: FINISHED_ERROR}
              - set:
                  vars.req2: "= state.requests[vars.rid]"
              - if: "(config['enable-prefix-caching'] || config['kv-connector'] != '') && (vars.req2.num_prompt_tokens + size(vars.req2.output_token_ids)) / int(config['block-size']) > size(vars.req2.block_hashes)"
                then:
                  - title: Hash newly full blocks
                    detail: "Request.append_output_token_ids runs the block hasher as tokens are appended."
                    source: "vllm/v1/core/kv_cache_utils.py:954-960"
                    call: kv-cache-utils.request-block-hasher
                    input: {prompt_segments: "= vars.req2.prompt_segments", output_token_ids: "= vars.req2.output_token_ids", num_existing_hashes: "= size(vars.req2.block_hashes)", lora_request: "= has(vars.req2.lora_request) ? vars.req2.lora_request : dyn(null)", cache_salt: "= has(vars.req2.cache_salt) ? vars.req2.cache_salt : dyn(null)"}
                    as: nh
                  - set:
                      state.requests: "= merge(state.requests, {vars.rid: {'block_hashes': vars.req2.block_hashes + vars.nh.value.new_block_hashes}})"
              - if: "vars.async_sched && vars.req.status == 'RUNNING'"
                then:
                  - title: Async - cache the blocks the new tokens completed (a no-op with caching off)
                    source: "vllm/v1/core/sched/async_scheduler.py:73-77"
                    call: kv-cache-manager.cache-blocks
                    input:
                      request_id: "= vars.rid"
                      num_tokens: "= state.requests[vars.rid].num_computed_tokens - state.requests[vars.rid].num_output_placeholders"
                      block_hashes: "= state.requests[vars.rid].block_hashes"
                      token_ids: "= config['enable-kv-cache-events'] ? (state.requests[vars.rid].prompt_token_ids != null ? dyn(state.requests[vars.rid].prompt_token_ids + state.requests[vars.rid].output_token_ids) : dyn(state.requests[vars.rid].prompt_segments.map(s, lists.range(s.num_tokens).map(i, s.key + '#' + string(i))).flatten() + state.requests[vars.rid].output_token_ids.map(t, dyn(t)))) : dyn(null)"
                      lora_request: "= has(state.requests[vars.rid].lora_request) ? state.requests[vars.rid].lora_request : dyn(null)"
          - if: "size(vars.gen) == 0 && config['mm-encoder-only'] && state.requests[vars.rid].num_computed_tokens >= state.requests[vars.rid].num_prompt_tokens"
            then:
              - title: An encoder-only instance stops a request once its whole prompt is consumed (every item in it was encoded)
                source: "vllm/v1/core/sched/scheduler.py:2174-2184"
                set: {vars.stopped: true, vars.status: FINISHED_STOPPED}
          - if: "(size(vars.kept) > 0 || vars.stopped) && has(state.requests[vars.rid].prefill_stats) && state.requests[vars.rid].prefill_stats != null"
            then:
              - title: Take the request's PrefillStats on its first output and finalize it with the tokens its blocks now cache
                detail: "num_cache_creation_tokens = max(0, min(estimate_cached_tokens, num_prompt_tokens) - num_cached_tokens). Taken once (take_prefill_stats sets it None), before the stop handling frees the blocks."
                source: "vllm/v1/core/sched/scheduler.py:2207-2212"
                call: kv-cache-manager.estimate-cached-tokens
                input: {request_id: "= vars.rid"}
                as: est
              - set:
                  vars.ps0: "= state.requests[vars.rid].prefill_stats"
              - set:
                  vars.ex: "= merge(vars.ex, {'prefill_stats': merge(vars.ps0, {'num_cache_creation_tokens': math.greatest(0, math.least(vars.est.value.num_cached_tokens, vars.ps0.num_prompt_tokens) - vars.ps0.num_cached_tokens)})})"
                  state.requests: "= merge(state.requests, {vars.rid: {'prefill_stats': null}})"
          - if: "has(vars.mro.logprobs) && vars.mro.logprobs != null && size(has(vars.mro.logprobs.logprob_token_ids) ? vars.mro.logprobs.logprob_token_ids : vars.mro.logprobs.token_ids) > 0 && has(vars.req.sampling_params) && ((has(vars.req.sampling_params.logprobs) && vars.req.sampling_params.logprobs != null) || (has(vars.req.sampling_params.logprob_token_ids) && vars.req.sampling_params.logprob_token_ids != null && size(vars.req.sampling_params.logprob_token_ids) > 0)) && has(vars.mro.req_ids) && vars.rid in vars.mro.req_ids"
            then:
              - title: Slice the request's sample logprobs (one row per kept token) before stop handling
                detail: "LogprobsLists.slice_request(req_index, len(new_token_ids)): the start row is req_index, or cu_num_generated_tokens[req_index] when set; trimmed tokens after a stop are not included. The runner's LogprobsLists(logprob_token_ids, logprobs, sampled_token_ranks) is handed on under engine-core's EngineCoreOutput names {token_ids, logprobs, ranks}."
                source: "vllm/v1/core/sched/scheduler.py:2214-2221"
                set:
                  vars.ridx: "= lists.range(size(vars.mro.req_ids)).filter(i, vars.mro.req_ids[i] == vars.rid)[0]"
                  vars.lp: "= {'token_ids': has(vars.mro.logprobs.logprob_token_ids) ? vars.mro.logprobs.logprob_token_ids : vars.mro.logprobs.token_ids, 'logprobs': vars.mro.logprobs.logprobs, 'ranks': has(vars.mro.logprobs.sampled_token_ranks) ? vars.mro.logprobs.sampled_token_ranks : vars.mro.logprobs.ranks, 'cu_num_generated_tokens': has(vars.mro.logprobs.cu_num_generated_tokens) ? vars.mro.logprobs.cu_num_generated_tokens : dyn(null)}"
              - set:
                  vars.lp_start: "= has(vars.lp.cu_num_generated_tokens) && vars.lp.cu_num_generated_tokens != null ? vars.lp.cu_num_generated_tokens[vars.ridx] : vars.ridx"
              - set:
                  vars.ex: "= merge(vars.ex, {'new_logprobs': {'token_ids': vars.lp.token_ids.slice(vars.lp_start, math.least(vars.lp_start + size(vars.kept), size(vars.lp.token_ids))), 'logprobs': vars.lp.logprobs.slice(vars.lp_start, math.least(vars.lp_start + size(vars.kept), size(vars.lp.logprobs))), 'ranks': vars.lp.ranks.slice(vars.lp_start, math.least(vars.lp_start + size(vars.kept), size(vars.lp.ranks)))}})"
          - set:
              vars.finish_reason: "= !vars.stopped ? dyn(null) : dyn(vars.status == 'FINISHED_STOPPED' ? 'stop' : (vars.status == 'FINISHED_LENGTH_CAPPED' ? 'length' : (vars.status == 'FINISHED_ABORTED' ? 'abort' : (vars.status == 'FINISHED_REPETITION' ? 'repetition' : 'error'))))"
          - if: "vars.stopped"
            then:
              - title: Stopped - remove from running (or, for a preempted request, from waiting and the deferred set) and free the request
                source: "vllm/v1/core/sched/scheduler.py:2223-2244"
                set:
                  state.running: "= state.running.filter(r, r != vars.rid)"
                  state.waiting: "= state.waiting.filter(r, r != vars.rid)"
                  state.deferred_waiting: "= state.deferred_waiting.filter(r, r != vars.rid)"
                  state.requests: "= merge(state.requests, {vars.rid: {'status': vars.status}})"
              - call: scheduler.free-request
                input: {request_id: "= vars.rid"}
                as: freed
          - set:
              vars.ktp: "= vars.stopped && has(vars.freed) && has(vars.freed.value) && vars.freed.value != null ? vars.freed.value.kv_transfer_params : dyn(null)"
          - if: "size(vars.kept) > 0 || vars.stopped"
            then:
              - title: Emit an EngineCoreOutput
                detail: "Partial prefill chunks sample nothing and emit nothing (and carry no prompt logprobs: the worker holds a chunk's until the prompt completes). The output carries the sliced sample logprobs, this step's prompt logprobs for the request and the finalized PrefillStats."
                source: "vllm/v1/core/sched/scheduler.py:2252-2291"
                set:
                  vars.outputs: "= vars.outputs + [{'request_id': vars.rid, 'new_token_ids': vars.kept, 'finish_reason': vars.finish_reason, 'stop_reason': vars.stop_reason, 'num_cached_tokens': vars.req.num_cached_tokens, 'client_index': vars.req.client_index, 'kv_transfer_params': vars.ktp, 'events': has(vars.req.events) && size(vars.req.events) > 0 ? vars.req.events : dyn(null), 'new_logprobs': vars.ex.new_logprobs, 'new_prompt_logprobs_tensors': has(vars.mro.prompt_logprobs_dict) && vars.mro.prompt_logprobs_dict != null && vars.rid in vars.mro.prompt_logprobs_dict ? {'token_ids': has(vars.mro.prompt_logprobs_dict[vars.rid].logprob_token_ids) ? vars.mro.prompt_logprobs_dict[vars.rid].logprob_token_ids : vars.mro.prompt_logprobs_dict[vars.rid].token_ids, 'logprobs': vars.mro.prompt_logprobs_dict[vars.rid].logprobs, 'ranks': has(vars.mro.prompt_logprobs_dict[vars.rid].selected_token_ranks) ? vars.mro.prompt_logprobs_dict[vars.rid].selected_token_ranks : vars.mro.prompt_logprobs_dict[vars.rid].ranks} : dyn(null), 'prefill_stats': vars.ex.prefill_stats}]"
              - if: "vars.rid in state.requests && has(state.requests[vars.rid].events) && size(state.requests[vars.rid].events) > 0"
                then:
                  - set: {state.requests: "= merge(state.requests, {vars.rid: {'events': []}})"}
      - if: "size(state.grammar_compile_error_reqs) > 0"
        then:
          - title: Requests whose grammar failed to compile finish with an error
            source: "vllm/v1/core/sched/scheduler.py:2302-2326"
            set:
              vars.err_ids: "= state.grammar_compile_error_reqs.filter(r, r in state.requests)"
              state.grammar_compile_error_reqs: []
          - set:
              vars.outputs: "= vars.outputs + vars.err_ids.map(r, {'request_id': r, 'new_token_ids': [], 'finish_reason': 'error', 'stop_reason': null, 'num_cached_tokens': state.requests[r].num_cached_tokens, 'client_index': state.requests[r].client_index, 'kv_transfer_params': null})"
          - call: scheduler.finish-requests
            input: {request_ids: "= vars.err_ids", finished_status: FINISHED_ERROR}
      - if: "has(vars.mro.kv_connector_output) && vars.mro.kv_connector_output != null"
        then:
          - if: "config['kv-connector'] != ''"
            then:
              - title: Hand the workers' KVConnectorOutput to the connector first
                source: "vllm/v1/core/sched/scheduler.py:3218-3219"
                call: kv-connector-base-v1.update-connector-output
                input:
                  finished_store_events: "= has(vars.mro.kv_connector_output.finished_store_events) ? vars.mro.kv_connector_output.finished_store_events : []"
                  finished_sending: "= has(vars.mro.kv_connector_output.finished_sending) ? vars.mro.kv_connector_output.finished_sending : []"
                  finished_recving: "= has(vars.mro.kv_connector_output.finished_recving) ? vars.mro.kv_connector_output.finished_recving : []"
          - title: KV connector - loads that finished make their requests schedulable next step
            source: "vllm/v1/core/sched/scheduler.py:3209-3226"
            set:
              state.finished_recving_kv_req_ids: "= state.finished_recving_kv_req_ids + (has(vars.mro.kv_connector_output.finished_recving) ? vars.mro.kv_connector_output.finished_recving.filter(r, r in state.requests && state.requests[r].status == 'WAITING_FOR_REMOTE_KVS') : [])"
          - title: Sends that finished release the blocks a finished request kept
            source: "vllm/v1/core/sched/scheduler.py:3227-3230"
            foreach: "= has(vars.mro.kv_connector_output.finished_sending) ? vars.mro.kv_connector_output.finished_sending.filter(r, r in state.requests) : []"
            as: sent
            steps:
              - call: scheduler.free-request-blocks
                input: {request_id: "= vars.sent"}
              - set: {state.requests: "= omit(state.requests, vars.sent)"}
      - title: Attach this step's SchedulerStats (spec-decoding stats included)
        source: "vllm/v1/core/sched/scheduler.py:2408-2422"
        call: scheduler.make-stats
        input: {spec_decoding_stats: "= vars.spec_stats"}
        as: stats
      - return: {outputs: "= vars.outputs", finished_req_ids: "= state.finished_req_ids", scheduler_stats: "= vars.stats.value"}

  - component: scheduler
    name: has-requests
    kind: function
    latency_ms: 0
    summary: "Whether the engine still has work: unfinished requests (respecting the pause state) or finished ids not yet reported to the workers."
    sources: ["vllm/v1/core/sched/scheduler.py:2803-2838", "vllm/v1/core/sched/interface.py:179-182"]
    request: {type: object}
    response: {type: boolean, examples: [true]}
    behavior:
      - title: get_num_unfinished_requests
        detail: "PAUSED_ALL counts nothing; PAUSED_NEW counts only KV-holding waiting requests (none here); sessions waiting for streaming input don't count."
        source: "vllm/v1/core/sched/scheduler.py:2803-2811"
        set:
          vars.unfinished: "= state.pause_state == 'PAUSED_ALL' ? 0 : size(state.running) + (state.pause_state == 'PAUSED_NEW' ? 0 : size(state.waiting)) - state.num_waiting_for_streaming_input"
      - if: "vars.unfinished > 0"
        then: [{return: true}]
      - title: Finished ids still to be sent, or finished requests a connector is still sending
        source: "vllm/v1/core/sched/scheduler.py:2813-2821"
        return: "= size(state.finished_req_ids) > 0 || (config['kv-connector'] != '' && size(state.requests) > size(state.running) + size(state.waiting))"

  - component: scheduler
    name: pause-state
    kind: function
    latency_ms: 0
    summary: "The scheduler's pause state."
    sources: ["vllm/v1/core/sched/scheduler.py:2751-2753"]
    request: {type: object}
    response: {type: string, enum: [UNPAUSED, PAUSED_NEW, PAUSED_ALL], examples: [UNPAUSED]}
    behavior:
      - return: "= state.pause_state"

  - component: scheduler
    name: set-pause-state
    kind: function
    latency_ms: 0
    summary: "Set the pause state: PAUSED_NEW stops new admissions, PAUSED_ALL stops scheduling entirely, UNPAUSED resumes."
    sources: ["vllm/v1/core/sched/scheduler.py:2755-2757"]
    request: {type: object, required: [pause_state], properties: {pause_state: {type: string, enum: [UNPAUSED, PAUSED_NEW, PAUSED_ALL], examples: [PAUSED_NEW]}}}
    response: {type: object}
    behavior:
      - title: Log and store the new state
        source: "vllm/v1/core/sched/scheduler.py:2755-2757"
        set: {state.pause_state: "= input.pause_state"}
      - return: {pause_state: "= input.pause_state"}

  - component: scheduler
    name: reset-encoder-cache
    kind: function
    latency_ms: 0
    summary: "Reset the multimodal encoder cache so stale embeddings are not reused after a weight update."
    sources: ["vllm/v1/core/sched/scheduler.py:2907-2913"]
    request: {type: object}
    response: {type: object}
    behavior:
      - title: encoder_cache_manager.reset()
        source: "vllm/v1/core/sched/scheduler.py:2913"
        call: encoder-cache-manager.reset
        as: r
      - return: {reset: true, num_free_slots: "= vars.r.value.num_free_slots"}

  - component: scheduler
    name: shutdown
    kind: function
    latency_ms: 0
    summary: "Shut down the KV event publisher and connectors (none in the default deployment)."
    sources: ["vllm/v1/core/sched/scheduler.py:2980-2993"]
    request: {type: object}
    response: {type: object}
    behavior:
      - return: {shutdown: true}

  - component: scheduler
    name: update-draft-token-ids
    kind: function
    latency_ms: 0
    summary: "Sync speculative decoding: store the drafter's new draft tokens on each decoding request (ignored for finished requests and prefill chunks)."
    sources: ["vllm/v1/core/sched/scheduler.py:2550-2569"]
    request:
      type: object
      required: [req_ids, draft_token_ids]
      properties:
        req_ids: {type: array, items: {type: string}}
        draft_token_ids: {type: array, items: {type: array, items: {type: integer}}}
    response: {type: object, properties: {updated: {type: array, items: {type: string}}}}
    behavior:
      - set: {vars.updated: []}
      - foreach: "= lists.range(size(input.req_ids))"
        as: i
        steps:
          - set: {vars.rid: "= input.req_ids[vars.i]"}
          - if: "!(vars.rid in state.requests) || state.requests[vars.rid].status.startsWith('FINISHED')"
            then:
              - title: Finished meanwhile; skip
                source: "vllm/v1/core/sched/scheduler.py:2555-2558"
                continue: true
          - if: "state.requests[vars.rid].is_prefill_chunk"
            then:
              - title: Prefill chunk - drafts are ignored
                source: "vllm/v1/core/sched/scheduler.py:2560-2564"
                set: {state.requests: "= merge(state.requests, {vars.rid: {'spec_token_ids': []}})"}
              - continue: true
          - set:
              state.requests: "= merge(state.requests, {vars.rid: {'spec_token_ids': input.draft_token_ids[vars.i]}})"
              vars.updated: "= vars.updated + [vars.rid]"
      - return: {updated: "= vars.updated"}

  - component: scheduler
    name: make-spec-decoding-stats
    kind: function
    latency_ms: 0
    summary: "Fold one request's verified draft into the step's SpecDecodingStats: none when stats are off or nothing was drafted; grammar-invalidated drafts are not counted."
    sources: ["vllm/v1/core/sched/scheduler.py:2961-2978", "vllm/v1/spec_decode/metrics.py:18-49"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      required: [num_draft_tokens, num_accepted_tokens]
      properties:
        spec_decoding_stats: {type: [object, "null"], default: null}
        num_draft_tokens: {type: integer, examples: [3]}
        num_accepted_tokens: {type: integer, examples: [1]}
        num_invalid_spec_tokens: {type: integer, default: 0}
    response: {type: [object, "null"], properties: {num_spec_tokens: {type: integer}, num_drafts: {type: integer}, num_draft_tokens: {type: integer}, num_accepted_tokens: {type: integer}, num_accepted_tokens_per_pos: {type: array, items: {type: integer}}, num_draft_tokens_per_pos: {type: array, items: {type: integer}}}}
    behavior:
      - if: "config['disable-log-stats'] || input.num_draft_tokens == 0"
        then:
          - title: Stats off or no draft - nothing to record
            source: "vllm/v1/core/sched/scheduler.py:2969-2970"
            return: null
      - set:
          vars.k: "= int(config['num-speculative-tokens'])"
          vars.s: "= has(input.spec_decoding_stats) ? input.spec_decoding_stats : null"
          vars.nd: "= input.num_draft_tokens - (has(input.num_invalid_spec_tokens) ? input.num_invalid_spec_tokens : 0)"
      - title: "spec_decoding_stats.observe_draft(num_draft_tokens, num_accepted_tokens): SpecDecodingStats is worker-runner's (spec_decode/metrics.py); it asserts accepted <= num_spec_tokens"
        source: "vllm/v1/core/sched/scheduler.py:2975-2977"
        call: spec-decoding-stats.observe-draft
        input:
          stats: "= vars.s"
          num_spec_tokens: "= vars.k"
          num_draft_tokens: "= vars.nd"
          num_accepted_tokens: "= input.num_accepted_tokens"
        as: od
        on_error:
          - fail: "= error"
      - return: "= vars.od.value"

  - component: scheduler
    name: get-grammar-bitmask
    kind: function
    latency_ms: 0
    summary: "The GrammarOutput for a step: the scheduled structured-output requests past their prefill (in scheduling order), their grammars and how many drafts each may accept; null when none."
    description: "The bitmask rows themselves are the grammars' next-token masks; xgrammar-grammar.fill-bitmask reports them for the candidate tokens a sampler asks about."
    sources: ["vllm/v1/core/sched/scheduler.py:1995-2024"]
    request: {type: object, required: [scheduler_output], properties: {scheduler_output: SchedulerOutput}}
    response: {type: [object, "null"], properties: {structured_output_request_ids: {type: array, items: {type: string}}, grammar_ids: {type: array, items: {type: string}}, num_acceptable_drafts: {type: array, items: {type: integer}}}}
    behavior:
      - title: Scheduled requests that use structured output and are not mid-prefill
        source: "vllm/v1/core/sched/scheduler.py:2003-2008"
        set:
          vars.ids: "= input.scheduler_output.num_scheduled_tokens.transformList(k, v, k).filter(id, id in state.requests && has(state.requests[id].grammar_id) && state.requests[id].grammar_id != null && !state.requests[id].is_prefill_chunk)"
      - if: "size(vars.ids) == 0"
        then:
          - title: No structured-output request to mask this step
            source: "vllm/v1/core/sched/scheduler.py:2000-2001"
            return: null
      - set:
          vars.spec: "= has(input.scheduler_output.scheduled_spec_decode_tokens) && input.scheduler_output.scheduled_spec_decode_tokens != null ? input.scheduler_output.scheduled_spec_decode_tokens : {}"
      - title: GrammarOutput(request ids, bitmask, acceptable drafts per request)
        source: "vllm/v1/core/sched/scheduler.py:2012-2024"
        return:
          structured_output_request_ids: "= vars.ids"
          grammar_ids: "= vars.ids.map(id, state.requests[id].grammar_id)"
          num_acceptable_drafts: "= vars.ids.map(id, id in vars.spec ? size(vars.spec[id].filter(t, t != -1)) : 0)"

  # ========================================================= structured output
  - component: structured-output-manager
    name: grammar-init
    kind: function
    latency_ms: 0
    summary: "Create the request's grammar with the configured backend; a compile failure is kept (as a failed Future) so only that request fails."
    sources: ["vllm/v1/structured_output/__init__.py:126-187", "vllm/v1/structured_output/backend_types.py:19-25"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [request_id, backend, request_type, grammar_spec]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        backend: {type: string, enum: [xgrammar, guidance, outlines, lm-format-enforcer, bogus], default: xgrammar}
        request_type: {type: string, examples: [json], description: "StructuredOutputOptions: json, json_object, grammar, regex or structural_tag."}
        grammar_spec: {type: string, default: '{"type": "string"}'}
        stop_token_ids: {type: array, items: {type: integer}, default: []}
    response: {type: object, properties: {grammar_id: {type: string}, status: {type: string}, error: {}}}
    behavior:
      - if: "!(input.backend in ['xgrammar', 'guidance', 'outlines', 'lm-format-enforcer'])"
        then:
          - title: Unsupported backend
            source: "vllm/v1/structured_output/__init__.py:175-176"
            fail: {code: value-error, status: 0, message: "= 'Unsupported structured output backend: ' + input.backend"}
      - if: "input.backend == 'outlines'"
        then:
          - title: Outlines backend compiles the request's grammar
            source: "vllm/v1/structured_output/__init__.py:157-163"
            call: backend-outlines.compile-grammar
            input: {grammar_id: "= input.request_id", request_type: "= input.request_type", grammar_spec: "= input.grammar_spec"}
            as: og
            on_error: continue
          - if: "!vars.og.ok"
            then: [{set: {state.grammars: "= merge(state.grammars, {input.request_id: {'status': 'failed', 'error': vars.og.error.code}})"}}, {return: {grammar_id: "= input.request_id", status: failed, error: "= vars.og.error.code"}}]
          - set: {state.grammars: "= merge(state.grammars, {input.request_id: {'status': 'ready', 'error': null}})"}
          - return: {grammar_id: "= input.request_id", status: ready, error: null}
      - if: "input.backend != 'xgrammar'"
        then:
          - title: guidance and lm-format-enforcer backends are not modeled; the grammar is assumed ready
            source: "vllm/v1/structured_output/__init__.py:151-171"
            set: {state.grammars: "= merge(state.grammars, {input.request_id: {'status': 'ready', 'error': null}})"}
          - return: {grammar_id: "= input.request_id", status: ready, error: null}
      - title: Compile with the request's stop tokens
        detail: "_create_grammar passes sampling_params.all_stop_token_ids to the xgrammar backend."
        source: "vllm/v1/structured_output/__init__.py:189-211"
        call: xgrammar-backend.compile-grammar
        input:
          grammar_id: "= input.request_id"
          request_type: "= input.request_type"
          grammar_spec: "= input.grammar_spec"
          stop_token_ids: "= has(input.stop_token_ids) ? input.stop_token_ids : []"
        as: g
        on_error: continue
      - if: "!vars.g.ok"
        then:
          - title: Compile failed; the error is carried to the scheduler
            source: "vllm/v1/structured_output/__init__.py:181-187"
            set: {state.grammars: "= merge(state.grammars, {input.request_id: {'status': 'failed', 'error': vars.g.error.code}})"}
          - return: {grammar_id: "= input.request_id", status: failed, error: "= vars.g.error.code"}
      - set: {state.grammars: "= merge(state.grammars, {input.request_id: {'status': 'ready', 'error': null}})"}
      - return: {grammar_id: "= input.request_id", status: ready, error: null}

  - component: structured-output-manager
    name: grammar-status
    kind: function
    latency_ms: 0
    summary: "Whether the request's grammar has finished compiling: pending while the compile Future runs, then the grammar (ready) or the exception it raised (failed)."
    description: "StructuredOutputRequest.grammar resolves the Future once it is done; the scheduler reads it to promote a request out of WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR. The outcome is kept here, keyed by request id."
    sources: ["vllm/v1/structured_output/request.py:42-62"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string, examples: [chatcmpl-abc123]}}}
    response: {type: object, properties: {status: {type: string, enum: [pending, ready, failed]}, error: {}}}
    behavior:
      - if: "!(input.request_id in state.grammars)"
        then:
          - title: The compile Future is not done yet
            source: "vllm/v1/structured_output/request.py:43-46"
            return: {status: pending, error: null}
      - title: Done - the grammar, or the exception it raised
        source: "vllm/v1/structured_output/request.py:47-51"
        return: {status: "= state.grammars[input.request_id].status", error: "= state.grammars[input.request_id].error"}

  - component: structured-output-manager
    name: accept-tokens
    kind: function
    latency_ms: 0
    summary: "Advance the request's grammar with the newly sampled tokens; false means the grammar rejected them."
    sources: ["vllm/v1/structured_output/__init__.py:462-482", "vllm/v1/structured_output/backend_types.py:34-46"]
    request: {type: object, required: [grammar_id, new_token_ids], properties: {request_id: {type: string}, grammar_id: {type: string}, new_token_ids: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {accepted: {type: boolean}}}
    behavior:
      - if: "size(input.new_token_ids) == 0"
        then: [{return: {accepted: true}}]
      - call: xgrammar-grammar.accept-tokens
        input: {grammar_id: "= input.grammar_id", tokens: "= input.new_token_ids"}
        as: acc
      - return: {accepted: "= vars.acc.value.accepted"}

  - component: xgrammar-backend
    name: compile-grammar
    kind: function
    latency_ms: 5
    summary: "Compile a JSON schema, JSON object, grammar, regex or structural tag; stop_token_ids become the matcher's override_stop_tokens."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:86-164", "vllm/v1/structured_output/backend_types.py:104-124"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [grammar_id, request_type, grammar_spec]
      properties:
        grammar_id: {type: string}
        request_type: {type: string}
        grammar_spec: {type: string}
        stop_token_ids: {type: array, items: {type: integer}, default: []}
    response: {type: object, properties: {grammar_id: {type: string}, override_stop_tokens: {}}}
    behavior:
      - if: "!(input.request_type in ['json', 'json_object', 'grammar', 'regex', 'structural_tag'])"
        then:
          - title: Not a supported grammar type
            source: "vllm/v1/structured_output/backend_xgrammar.py:148-154"
            fail: {code: value-error, status: 0, message: "= 'grammar is not of valid supported types. (StructuredOutputOptions.' + input.request_type.upperAscii() + ')'"}
      - if: "input.request_type == 'regex'"
        then:
          - title: Regexes compile under the ReDoS timeout guard
            source: "vllm/v1/structured_output/backend_xgrammar.py:128-132"
            call: structured-output-utils.compile-regex-with-timeout
            input: {pattern: "= input.grammar_spec"}
      - title: Build the GrammarMatcher with override_stop_tokens
        detail: "A non-empty stop set replaces the tokenizer's single EOS as the tokens that may end the grammar."
        source: "vllm/v1/structured_output/backend_xgrammar.py:156-164"
        call: xgrammar-grammar.create
        input:
          grammar_id: "= input.grammar_id"
          override_stop_tokens: "= has(input.stop_token_ids) && size(input.stop_token_ids) > 0 ? input.stop_token_ids : null"
          tokenizer_eos_token_id: "= state.tokenizer_eos_token_id"
        as: made
      - return: {grammar_id: "= input.grammar_id", override_stop_tokens: "= vars.made.value.stop_tokens"}

  - component: backend-outlines
    name: validate-structured-output-request-outlines
    kind: function
    latency_ms: 0
    summary: "Request validation for the outlines backend (run from SamplingParams.verify): the regex (or the JSON schema's / choices' regex) must be buildable by regex-automata; json_object and grammar specs are rejected."
    sources: ["vllm/v1/structured_output/backend_outlines.py:195-238"]
    errors: [{code: vllm-validation-error, status: 400, retryable: false}]
    request:
      type: object
      properties:
        structured_outputs:
          type: [object, "null"]
          properties:
            regex: {type: string, default: ""}
            json: {default: null}
            choice: {type: array, default: [], items: {type: string}}
            json_object: {type: boolean, default: false}
            grammar: {type: string, default: ""}
    response: {type: object, properties: {valid: {type: boolean}}}
    behavior:
      - if: "!has(input.structured_outputs) || input.structured_outputs == null"
        then: [{return: {valid: true}}]
      - set: {vars.so: "= input.structured_outputs"}
      - if: "has(vars.so.regex) && vars.so.regex != ''"
        then:
          - call: backend-outlines.validate-regex-is-buildable
            input: {pattern: "= vars.so.regex"}
          - return: {valid: true}
      - if: "has(vars.so.choice) && size(vars.so.choice) > 0"
        then:
          - title: Choices become an escaped alternation
            source: "vllm/v1/structured_output/backend_outlines.py:225-228"
            call: backend-outlines.validate-regex-is-buildable
            input: {pattern: "= '(' + vars.so.choice.join('|') + ')'"}
          - return: {valid: true}
      - if: "has(vars.so.json_object) && vars.so.json_object"
        then:
          - source: "vllm/v1/structured_output/backend_outlines.py:229-233"
            fail: {code: vllm-validation-error, status: 400, message: "Outlines structured outputs backend does not support json_object specifications"}
      - if: "has(vars.so.grammar) && vars.so.grammar != ''"
        then:
          - source: "vllm/v1/structured_output/backend_outlines.py:234-238"
            fail: {code: vllm-validation-error, status: 400, message: "Outlines structured outputs backend does not support grammar specifications"}
      - return: {valid: true}

  - component: backend-outlines
    name: validate-regex-is-buildable
    kind: function
    latency_ms: 0
    summary: "Reject regexes regex-automata can't build: backreferences, look-arounds, \\b/\\B word boundaries (anywhere, including inside groups and repeats), and anchors before the first consuming token."
    description: "The sre_parse walk is approximated with RE2 matches on the pattern text; an escaped backslash before b (\\\\b) is a false positive."
    sources: ["vllm/v1/structured_output/backend_outlines.py:307-366"]
    errors: [{code: vllm-validation-error, status: 400, retryable: false}]
    request: {type: object, required: [pattern], properties: {pattern: {type: string, examples: ['[a-z]+']}}}
    response: {type: object, properties: {valid: {type: boolean}}}
    behavior:
      - if: 'input.pattern.matches(r"\\[1-9]") || input.pattern.contains("(?P=")'
        then:
          - title: Backreferences are unsupported
            source: "vllm/v1/structured_output/backend_outlines.py:312-314"
            fail: {code: vllm-validation-error, status: 400, message: "Regex uses unsupported feature for structured outputs: Backreferences are unsupported.. Only basic matching constructs are supported—lookarounds, backreferences, and unicode boundaries are not."}
      - if: "input.pattern.contains('(?=') || input.pattern.contains('(?!') || input.pattern.contains('(?<=') || input.pattern.contains('(?<!')"
        then:
          - title: Look-around assertions are unsupported
            source: "vllm/v1/structured_output/backend_outlines.py:316-318"
            fail: {code: vllm-validation-error, status: 400, message: "Regex uses unsupported feature for structured outputs: Look-Around assertion are unsupported.. Only basic matching constructs are supported—lookarounds, backreferences, and unicode boundaries are not."}
      - if: 'input.pattern.matches(r"\\[bB]")'
        then:
          - title: Unicode word boundaries are unsupported
            source: "vllm/v1/structured_output/backend_outlines.py:320-323"
            fail: {code: vllm-validation-error, status: 400, message: "Regex uses unsupported feature for structured outputs: Unicode word boundaries are unsupported.. Only basic matching constructs are supported—lookarounds, backreferences, and unicode boundaries are not."}
      - if: 'input.pattern.matches(r"^\(*(\^|\$|\\A)")'
        then:
          - title: An anchor before any consuming token needs context
            source: "vllm/v1/structured_output/backend_outlines.py:358-366"
            fail: {code: vllm-validation-error, status: 400, message: "= 'Regex does not have a anchored universal start stateThis means that the Regex uses anchors (^) or look-arounds in a way which requires context before any token is matched.structured outputs needs regexes that can match without needing that context. Try rewriting the pattern without using these constructs. Pattern:\\n' + input.pattern"}
      - return: {valid: true}

  - component: backend-outlines
    name: compile-grammar
    kind: function
    latency_ms: 5
    summary: "OutlinesBackend.compile_grammar: build a regex guide (JSON schemas and choices are first turned into a regex)."
    sources: ["vllm/v1/structured_output/backend_outlines.py:59-100"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [grammar_id, request_type, grammar_spec], properties: {grammar_id: {type: string}, request_type: {type: string}, grammar_spec: {type: string}}}
    response: {type: object, properties: {grammar_id: {type: string}}}
    behavior:
      - if: "!(input.request_type in ['json', 'regex', 'choice'])"
        then:
          - title: Only JSON, regex and choice are supported by outlines
            source: "vllm/v1/structured_output/backend_outlines.py:59-100"
            fail: {code: value-error, status: 0, message: "= 'Invalid request type for Outlines backend (StructuredOutputOptions.' + input.request_type.upperAscii() + ')'"}
      - set: {state.grammars: "= merge(state.grammars, {input.grammar_id: {'request_type': input.request_type, 'spec': input.grammar_spec, 'terminated': false}})"}
      - return: {grammar_id: "= input.grammar_id"}

  - component: structured-output-utils
    name: compile-regex-with-timeout
    kind: function
    latency_ms: 0
    summary: "Run the regex compile in a worker thread and give up after VLLM_REGEX_COMPILATION_TIMEOUT_S (ValueError 'timed out'); 0 runs it inline with no limit."
    sources: ["vllm/v1/structured_output/utils.py:62-98"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [pattern], properties: {pattern: {type: string, examples: ['[a-z]+']}}}
    response: {type: object, properties: {compiled: {type: boolean}}}
    behavior:
      - if: "int(config['vllm-regex-compilation-timeout-s']) <= 0"
        then:
          - title: Timeout disabled - compile inline
            source: "vllm/v1/structured_output/utils.py:79-81"
            call: xgrammar-compiler.compile-regex
            input: {pattern: "= input.pattern"}
          - return: {compiled: true}
      - title: future.result(timeout)
        source: "vllm/v1/structured_output/utils.py:83-86"
        call: xgrammar-compiler.compile-regex
        input: {pattern: "= input.pattern"}
        timeout_ms: "= int(config['vllm-regex-compilation-timeout-s']) * 1000"
        as: c
        on_error:
          - title: Timed out - cancel and raise ValueError
            source: "vllm/v1/structured_output/utils.py:87-95"
            fail: {code: value-error, status: 0, message: "= 'Regex compilation timed out after ' + string(int(config['vllm-regex-compilation-timeout-s'])) + 's. The pattern may be too complex or contain constructs that cause exponential state-space explosion (e.g. nested quantifiers). Pattern: ' + (size(input.pattern) > 200 ? input.pattern.substring(0, 200) : input.pattern)"}
      - return: {compiled: true}

  - component: xgrammar-compiler
    name: compile-regex
    kind: function
    summary: "GrammarCompiler.compile_regex (library). ASSUMPTION: nested quantifiers blow up (scheduler-kv-redos-compile-ms), anything else takes 2 ms."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:128-132"]
    latency_ms: '= input.pattern.matches(r"\([^)]*[+*]\)[+*]") ? int(config["scheduler-kv-redos-compile-ms"]) : 2'
    request: {type: object, required: [pattern], properties: {pattern: {type: string}}}
    response: {type: object, properties: {compiled: {type: boolean, default: true}}}

  - component: xgrammar-backend
    name: validate-xgrammar-grammar
    kind: function
    latency_ms: 0
    summary: "Request validation for the xgrammar backend: a JSON schema or structural tag nested deeper than 64 levels (80 for a structural tag) is rejected before any grammar conversion; a regex must compile under the timeout; NUL is refused."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:407-504", "vllm/sampling_params.py:213-258"]
    errors: [{code: vllm-validation-error, status: 400, retryable: false}, {code: value-error, status: 0, retryable: false}]
    request:
      type: object
      properties:
        structured_outputs:
          type: [object, "null"]
          properties:
            json: {default: null, description: "A JSON schema: object, or JSON text."}
            structural_tag: {type: [string, "null"], default: null}
            regex: {type: string, default: ""}
    response: {type: object, properties: {valid: {type: boolean}}}
    behavior:
      - if: "!has(input.structured_outputs) || input.structured_outputs == null"
        then: [{return: {valid: true}}]
      - set: {vars.so: "= input.structured_outputs"}
      - if: "has(vars.so.regex) && vars.so.regex != ''"
        then:
          - if: 'vars.so.regex.contains("\u0000")'
            then:
              - title: NUL in a regex is refused before native code sees it
                source: "vllm/v1/structured_output/backend_xgrammar.py:418-426"
                fail: {code: value-error, status: 0, message: "structured_outputs.regex must not contain a NUL character ('\\x00')"}
          - title: The regex must compile within the timeout
            source: "vllm/v1/structured_output/backend_xgrammar.py:427-435"
            call: structured-output-utils.compile-regex-with-timeout
            input: {pattern: "= vars.so.regex"}
            as: rc
            on_error:
              - fail: {code: vllm-validation-error, status: 400, message: "= 'Failed to transform regex into a grammar: ' + error.message"}
          - return: {valid: true}
      - set:
          vars.spec: "= has(vars.so.json) && vars.so.json != null ? vars.so.json : (has(vars.so.structural_tag) && vars.so.structural_tag != null ? vars.so.structural_tag : dyn(null))"
          vars.limit: "= has(vars.so.json) && vars.so.json != null ? 64 : 80"
      - if: "vars.spec == null"
        then: [{return: {valid: true}}]
      - title: check_json_nesting - walk the containers level by level
        detail: "A JSON text is measured by the containers opened before the first one closes (a lower bound on its depth); an object is walked level by level, as _exceeds_json_nesting does."
        source: "vllm/sampling_params.py:213-236"
        set:
          vars.depth_text: "= type(vars.spec) == string ? size(vars.spec.split('}')[0].split(']')[0].split('{')) - 1 + size(vars.spec.split('}')[0].split(']')[0].split('[')) - 1 : 0"
          vars.level: "= type(vars.spec) == string ? [] : [vars.spec]"
      - foreach: "= lists.range(vars.limit)"
        as: lv
        max: 100
        steps:
          - if: "size(vars.level) == 0"
            then: [{break: true}]
          - set:
              vars.level: "= vars.level.map(n, type(n) == map ? n.transformList(k, v, v) : n).flatten().filter(c, type(c) == map || type(c) == list)"
      - if: "vars.depth_text > vars.limit || size(vars.level) > 0"
        then:
          - title: Nested too deeply
            source: "vllm/sampling_params.py:253-258"
            fail: {code: vllm-validation-error, status: 400, message: "The JSON schema is nested too deeply: objects and arrays may nest at most 64 levels"}
      - return: {valid: true}

  - component: xgrammar-grammar
    name: create
    kind: function
    latency_ms: 0
    summary: "A fresh matcher for one grammar (XgrammarGrammar dataclass): not terminated, no tokens processed."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:174-188"]
    request: {type: object, required: [grammar_id, tokenizer_eos_token_id], properties: {grammar_id: {type: string}, override_stop_tokens: {}, tokenizer_eos_token_id: {type: integer}}}
    response: {type: object, properties: {stop_tokens: {type: array, items: {type: integer}}}}
    behavior:
      - set:
          vars.stop: "= input.override_stop_tokens != null ? input.override_stop_tokens : [input.tokenizer_eos_token_id]"
      - set:
          state.grammars: "= merge(state.grammars, {input.grammar_id: {'fsm': 'start', 'terminated': false, 'num_processed_tokens': 0, 'stop_tokens': vars.stop}})"
      - return: {stop_tokens: "= vars.stop"}

  - component: xgrammar-grammar
    name: accept-tokens
    kind: function
    latency_ms: 0
    summary: "Advance the FSM token by token; tokens after termination are ignored; a token the FSM can't take returns false."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:190-212"]
    errors: [{code: key-error, status: 0, retryable: false}]
    request: {type: object, required: [grammar_id, tokens], properties: {grammar_id: {type: string}, tokens: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {accepted: {type: boolean}, terminated: {type: boolean}}}
    behavior:
      - if: "!(input.grammar_id in state.grammars)"
        then: [{fail: {code: key-error, status: 0, message: "= 'no grammar ' + input.grammar_id"}}]
      - set: {vars.g: "= state.grammars[input.grammar_id]"}
      - if: "vars.g.terminated"
        then:
          - title: Already terminated; tokens are ignored
            source: "vllm/v1/structured_output/backend_xgrammar.py:197-198"
            return: {accepted: true, terminated: true}
      - foreach: "= input.tokens"
        as: tok
        steps:
          - set:
              vars.is_stop: "= vars.tok in vars.g.stop_tokens"
          - set:
              vars.ok: "= vars.is_stop ? vars.g.fsm == 'complete' : (vars.tok == 1 ? vars.g.fsm in ['start', 'in_string'] : vars.g.fsm == 'in_string')"
          - if: "!vars.ok"
            then:
              - title: FSM failed to advance
                source: "vllm/v1/structured_output/backend_xgrammar.py:199-206"
                set: {state.grammars: "= merge(state.grammars, {input.grammar_id: vars.g})"}
              - return: {accepted: false, terminated: false}
          - set:
              vars.g: "= merge(vars.g, {'num_processed_tokens': vars.g.num_processed_tokens + 1, 'terminated': vars.is_stop, 'fsm': vars.is_stop ? 'terminated' : (vars.tok == 1 ? (vars.g.fsm == 'start' ? 'in_string' : 'complete') : vars.g.fsm)})"
          - if: "vars.g.terminated"
            then: [{break: true}]
      - set: {state.grammars: "= merge(state.grammars, {input.grammar_id: vars.g})"}
      - return: {accepted: true, terminated: "= vars.g.terminated"}

  - component: xgrammar-grammar
    name: fill-bitmask
    kind: function
    latency_ms: 0
    summary: "Next-token bitmask for the grammar's state, reported for the given candidate token ids (stop tokens only once the grammar can end)."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:241-242"]
    request: {type: object, required: [grammar_id, token_ids], properties: {grammar_id: {type: string}, token_ids: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {allowed: {type: object}}}
    behavior:
      - if: "!(input.grammar_id in state.grammars)"
        then: [{fail: {code: key-error, status: 0, message: "= 'no grammar ' + input.grammar_id"}}]
      - set: {vars.g: "= state.grammars[input.grammar_id]"}
      - title: matcher.fill_next_token_bitmask
        detail: "Stop tokens are allowed only in an accepting state; a quote opens or closes the string; other tokens are string content."
        source: "vllm/v1/structured_output/backend_xgrammar.py:241-242"
        return:
          allowed: "= input.token_ids.transformMapEntry(i, t, {string(t): t in vars.g.stop_tokens ? vars.g.fsm == 'complete' : (t == 1 ? vars.g.fsm in ['start', 'in_string'] : vars.g.fsm == 'in_string')})"

  - component: xgrammar-grammar
    name: is-terminated
    kind: function
    latency_ms: 0
    summary: "Whether a stop token has ended the grammar (complete is not terminated)."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:244-245"]
    request: {type: object, required: [grammar_id], properties: {grammar_id: {type: string}}}
    response: {type: object, properties: {terminated: {type: boolean}}}
    behavior:
      - if: "!(input.grammar_id in state.grammars)"
        then: [{fail: {code: key-error, status: 0, message: "= 'no grammar ' + input.grammar_id"}}]
      - return: {terminated: "= state.grammars[input.grammar_id].terminated"}

  # ============================================================ KV offload: CPU
  - component: host-register
    name: host-register
    kind: function
    latency_ms: 2
    summary: "Pin a host range for fast DMA: cudaHostRegister on CUDA, the xpu_host_register op on XPU, pageable fallback elsewhere."
    sources: ["vllm/v1/kv_offload/cpu/host_register.py:33-76"]
    request: {type: object, required: [ptr, num_bytes], properties: {ptr: {type: integer, examples: [140000000000]}, num_bytes: {type: integer, examples: [68719476736]}}}
    response: {type: object, properties: {registered: {type: boolean}}}
    behavior:
      - if: "input.ptr == 0 || input.num_bytes <= 0"
        then:
          - title: Nothing to register
            source: "vllm/v1/kv_offload/cpu/host_register.py:44-45"
            return: {registered: false}
      - choice: platform
        default: cuda
        options:
          cuda:
            - set:
                vars.pinned_total: "= sum(state.pinned.transformList(k, v, v))"
            - if: "vars.pinned_total + input.num_bytes > state.pinnable_bytes"
              then:
                - title: cudaHostRegister failed; stays pageable
                  detail: "The driver refuses to page-lock more host memory; transfers still work, unpinned and slower."
                  source: "vllm/v1/kv_offload/cpu/host_register.py:51-59"
                  return: {registered: false}
            - title: cudaHostRegister succeeded
              source: "vllm/v1/kv_offload/cpu/host_register.py:51-60"
              set: {state.pinned: "= merge(state.pinned, {string(input.ptr): input.num_bytes})"}
            - return: {registered: true}
          xpu:
            - title: XPU host registration op
              source: "vllm/v1/kv_offload/cpu/host_register.py:62-69"
              call: vllm-xpu-kernels.xpu-host-register
              input: {ptr: "= input.ptr", num_bytes: "= input.num_bytes"}
              as: x
            - if: "!vars.x.value.ok"
              then: [{return: {registered: false}}]
            - set: {state.pinned: "= merge(state.pinned, {string(input.ptr): input.num_bytes})"}
            - return: {registered: true}
          other:
            - title: Not implemented on this platform; unpinned host memory
              source: "vllm/v1/kv_offload/cpu/host_register.py:71-76"
              return: {registered: false}

  - component: host-register
    name: host-unregister
    kind: function
    latency_ms: 1
    summary: "Release a range registered by host_register."
    sources: ["vllm/v1/kv_offload/cpu/host_register.py:79-97"]
    request: {type: object, required: [ptr], properties: {ptr: {type: integer}}}
    response: {type: object, properties: {unregistered: {type: boolean}}}
    behavior:
      - if: "input.ptr == 0"
        then: [{return: {unregistered: false}}]
      - choice: platform
        default: cuda
        options:
          cuda:
            - title: cudaHostUnregister
              source: "vllm/v1/kv_offload/cpu/host_register.py:84-92"
              set: {state.pinned: "= omit(state.pinned, string(input.ptr))"}
            - return: {unregistered: true}
          xpu:
            - title: XPU host unregistration op
              source: "vllm/v1/kv_offload/cpu/host_register.py:94-97"
              call: vllm-xpu-kernels.xpu-host-unregister
              input: {ptr: "= input.ptr"}
            - set: {state.pinned: "= omit(state.pinned, string(input.ptr))"}
            - return: {unregistered: true}

  - component: kv-offload-cpu-gpu-worker
    name: pin-mmap-region
    kind: function
    latency_ms: 0
    summary: "Pin the shared offload region in row-aligned chunks of at most 64 GiB; if one chunk fails, unregister the pinned ones and leave the region pageable."
    sources: ["vllm/v1/kv_offload/cpu/gpu_worker.py:201-240"]
    request: {type: object, required: [base_ptr, total_size, row_stride], properties: {base_ptr: {type: integer, examples: [140000000000]}, total_size: {type: integer, examples: [161061273600]}, row_stride: {type: integer, examples: [2097152]}}}
    response: {type: object, properties: {is_pinned: {type: boolean}, pinned_addresses: {type: array, items: {type: integer}}}}
    behavior:
      - set:
          vars.chunk: "= math.greatest(68719476736 / input.row_stride, 1) * input.row_stride"
      - set:
          vars.offsets: "= lists.range((input.total_size + vars.chunk - 1) / vars.chunk).map(i, i * vars.chunk)"
          vars.addresses: []
      - title: Register chunk by chunk
        source: "vllm/v1/kv_offload/cpu/gpu_worker.py:214-219"
        foreach: "= vars.offsets"
        as: off
        steps:
          - call: host-register.host-register
            input: {ptr: "= input.base_ptr + vars.off", num_bytes: "= math.least(vars.chunk, input.total_size - vars.off)"}
            as: reg
          - if: "vars.reg.value.registered"
            then:
              - set: {vars.addresses: "= vars.addresses + [input.base_ptr + vars.off]"}
              - continue: true
          - title: A chunk failed; roll back and stay pageable
            source: "vllm/v1/kv_offload/cpu/gpu_worker.py:220-229"
            foreach: "= vars.addresses.reverse()"
            as: done
            steps:
              - call: host-register.host-unregister
                input: {ptr: "= vars.done"}
          - return: {is_pinned: false, pinned_addresses: []}
      - title: Region pinned
        source: "vllm/v1/kv_offload/cpu/gpu_worker.py:231-233"
        set: {state.pinned_addresses: "= vars.addresses"}
      - return: {is_pinned: true, pinned_addresses: "= vars.addresses"}

  - component: shared-offload-region
    name: init
    kind: function
    latency_ms: 0
    summary: "Map the shared region: num_chunks rows of kv_bytes_per_chunk; a ranked worker owns cpu_page_size bytes per row starting at rank * cpu_page_size."
    sources: ["vllm/v1/kv_offload/cpu/shared_offload_region.py:89-116"]
    errors: [{code: assertion-error, status: 0, retryable: false}, {code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [num_chunks, kv_bytes_per_chunk, cpu_page_size]
      properties:
        num_chunks: {type: integer, examples: [4]}
        rank: {type: [integer, "null"], default: null}
        kv_bytes_per_chunk: {type: integer, examples: [8192]}
        cpu_page_size: {type: integer, examples: [8192]}
        page_size: {type: integer, default: 4096}
        populate_only_on_creator: {type: boolean, default: false}
        has_barrier: {type: boolean, default: true}
    response: {type: object, properties: {total_size_bytes: {type: integer}}}
    behavior:
      - if: "has(input.populate_only_on_creator) && input.populate_only_on_creator && has(input.has_barrier) && !input.has_barrier"
        then: [{fail: {code: value-error, status: 0, message: "Creator-only population requires a barrier."}}]
      - set: {vars.page: "= has(input.page_size) ? input.page_size : 4096"}
      - if: "input.kv_bytes_per_chunk % vars.page != 0"
        then:
          - title: Rows must be page aligned
            source: "vllm/v1/kv_offload/cpu/shared_offload_region.py:104"
            fail: {code: assertion-error, status: 0, message: "kv_bytes_per_chunk must be a multiple of the page size"}
      - title: Lay out rows and this worker's slot
        source: "vllm/v1/kv_offload/cpu/shared_offload_region.py:105-116"
        set:
          state.num_chunks: "= input.num_chunks"
          state.row_stride: "= input.kv_bytes_per_chunk"
          state.rank: "= has(input.rank) ? input.rank : null"
          state.worker_offset: "= has(input.rank) && input.rank != null ? input.rank * input.cpu_page_size : 0"
          state.worker_area_end: "= has(input.rank) && input.rank != null ? (input.rank + 1) * input.cpu_page_size : 0"
          state.views: []
      - return: {total_size_bytes: "= input.num_chunks * input.kv_bytes_per_chunk"}

  - component: shared-offload-region
    name: create-next-worker-view
    kind: function
    latency_ms: 0
    summary: "Carve this worker's next tensor view: shape (num_chunks, tensor_page_size), stride (row_stride, 1), advancing the worker cursor."
    sources: ["vllm/v1/kv_offload/cpu/shared_offload_region.py:245-283"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, required: [tensor_page_size], properties: {tensor_page_size: {type: integer, examples: [4096]}}}
    response: {type: object, properties: {shape: {type: array, items: {type: integer}}, stride: {type: array, items: {type: integer}}, storage_offset: {type: integer}}}
    behavior:
      - if: "state.rank == null"
        then: [{fail: {code: assertion-error, status: 0, message: "rank is required for worker views"}}]
      - set: {vars.new_offset: "= state.worker_offset + input.tensor_page_size"}
      - if: "vars.new_offset > state.worker_area_end"
        then:
          - title: View would overflow this worker's slot
            source: "vllm/v1/kv_offload/cpu/shared_offload_region.py:268-273"
            fail: {code: assertion-error, status: 0, message: "= 'Worker offset ' + string(vars.new_offset) + ' exceeds worker area end ' + string(state.worker_area_end)"}
      - set:
          vars.view: {shape: ["= state.num_chunks", "= input.tensor_page_size"], stride: ["= state.row_stride", 1], storage_offset: "= state.worker_offset"}
      - title: as_strided view and advance the cursor
        source: "vllm/v1/kv_offload/cpu/shared_offload_region.py:274-283"
        set:
          state.worker_offset: "= vars.new_offset"
          state.views: "= state.views + [vars.view]"
      - return: "= vars.view"

  - component: shared-offload-region
    name: create-kv-memoryview
    kind: function
    latency_ms: 0
    summary: "Zero-copy view of the whole buffer, shape (num_chunks, row_stride); secondary tiers address chunk b as view[b]."
    sources: ["vllm/v1/kv_offload/cpu/shared_offload_region.py:330-342"]
    request: {type: object}
    response: {type: object, properties: {shape: {type: array, items: {type: integer}}, num_views: {type: integer}}}
    behavior:
      - return: {shape: ["= state.num_chunks", "= state.row_stride"], num_views: "= size(state.views)"}

  - component: swap-blocks-triton
    name: swap-blocks-batch
    kind: function
    latency_ms: 0
    summary: "Batched CPU->GPU block copy: Triton kernel for 16+ descriptors, otherwise the C++ swap_blocks_batch op (DMA)."
    sources: ["vllm/v1/kv_offload/cpu/swap_blocks_triton.py:49-74"]
    request:
      type: object
      required: [num_descriptors, bytes_per_descriptor]
      properties:
        num_descriptors: {type: integer, examples: [32]}
        bytes_per_descriptor: {type: integer, examples: [16384]}
        bytes_per_chunk: {type: integer, examples: [4096]}
    response: {type: object, properties: {path: {type: string}}}
    behavior:
      - if: "input.num_descriptors < 16"
        then:
          - title: Too few descriptors to amortize a Triton launch; use DMA
            source: "vllm/v1/kv_offload/cpu/swap_blocks_triton.py:58-67"
            call: custom-ops.swap-blocks-batch
            input: {num_blocks: "= input.num_descriptors", block_bytes: "= input.bytes_per_descriptor"}
          - return: {path: dma}
      - title: Launch _swap_blocks_kernel on min(12, n) programs
        detail: "Each program copies whole jobs in BYTES_PER_CHUNK pieces (the Triton kernel _swap_blocks_kernel)."
        source: "vllm/v1/kv_offload/cpu/swap_blocks_triton.py:68-74"
        call: swap-blocks-triton.swap-blocks-kernel
        input: {num_descriptors: "= input.num_descriptors", total_bytes: "= input.num_descriptors * input.bytes_per_descriptor"}
      - return: {path: triton}

  - component: swap-blocks-triton
    name: swap-blocks-kernel
    kind: kernel
    summary: "Triton kernel _swap_blocks_kernel: grid-strided jobs, each copied in BYTES_PER_CHUNK words with a mask."
    sources: ["vllm/v1/kv_offload/cpu/swap_blocks_triton.py:24-46"]
    latency_ms: "= 0.005 + double(input.total_bytes) / double(config['scheduler-kv-host-device-bytes-per-ms'])"
    request: {type: object, properties: {num_descriptors: {type: integer}, total_bytes: {type: integer}}}
    response: {type: object}

  # ============================================================ simple KV offload
  - component: cuda-mem-ops
    name: copy-blocks
    kind: function
    summary: "cuMemcpyBatchAsync of a list of blocks on the given stream (latency ~ bytes over the host-device link)."
    sources: ["vllm/v1/simple_kv_offload/cuda_mem_ops.py:1-40"]
    latency_ms: "= 0.002 + double(size(input.src_blocks) * 2097152) / double(config['scheduler-kv-host-device-bytes-per-ms'])"
    request: {type: object, required: [src_blocks, dst_blocks], properties: {src_blocks: {type: array, items: {type: integer}}, dst_blocks: {type: array, items: {type: integer}}}}
    response: {type: object}

  - component: dma-copy-backend
    name: launch-copy
    kind: function
    latency_ms: 0
    summary: "Queue a block copy (store GPU->CPU or load CPU->GPU) for the copy thread."
    sources: ["vllm/v1/simple_kv_offload/copy_backend.py:71-92"]
    request:
      type: object
      required: [src_blocks, dst_blocks, is_store, event_idx]
      properties:
        src_blocks: {type: array, items: {type: integer}, examples: [[5, 6, 7]]}
        dst_blocks: {type: array, items: {type: integer}, examples: [[0, 1, 2]]}
        is_store: {type: boolean, examples: [true]}
        event_idx: {type: integer, examples: [1]}
    response: {type: object, properties: {queued: {type: integer}}}
    behavior:
      - title: queue.put
        source: "vllm/v1/simple_kv_offload/copy_backend.py:80-92"
        set: {state.queue: "= state.queue + [{'src_blocks': input.src_blocks, 'dst_blocks': input.dst_blocks, 'is_store': input.is_store, 'event_idx': input.event_idx}]"}
      - return: {queued: "= size(state.queue)"}

  - component: dma-copy-backend
    name: shutdown
    kind: function
    latency_ms: 0
    summary: "Put the None sentinel so the copy thread exits (idempotent)."
    sources: ["vllm/v1/simple_kv_offload/copy_backend.py:94-101"]
    request: {type: object}
    response: {type: object, properties: {queued: {type: integer}}}
    behavior:
      - if: "state.queue.exists(i, i == null)"
        then: [{return: {queued: "= size(state.queue)"}}]
      - set: {state.queue: "= state.queue + [null]"}
      - return: {queued: "= size(state.queue)"}

  - component: dma-copy-backend
    name: copy-loop
    kind: function
    latency_ms: 0
    summary: "One turn of the copy thread: take a queued copy, run it on the store or load stream, record a completion event; None ends the thread."
    sources: ["vllm/v1/simple_kv_offload/copy_backend.py:103-130"]
    request: {type: object}
    response: {type: object, properties: {did: {type: string}}}
    behavior:
      - if: "!state.running"
        then: [{return: {did: exited}}]
      - if: "size(state.queue) == 0"
        then:
          - title: q.get() blocks; nothing queued this turn
            source: "vllm/v1/simple_kv_offload/copy_backend.py:112"
            return: {did: idle}
      - set:
          vars.item: "= state.queue[0]"
          state.queue: "= state.queue.slice(1, size(state.queue))"
      - if: "vars.item == null"
        then:
          - title: Shutdown sentinel; the thread returns
            source: "vllm/v1/simple_kv_offload/copy_backend.py:113-114"
            set: {state.running: false}
          - return: {did: exited}
      - title: copy_blocks on the store or load stream
        detail: "Stores read the live KV cache (stream order); loads read stable pinned host memory."
        source: "vllm/v1/simple_kv_offload/copy_backend.py:124-127"
        call: cuda-mem-ops.copy-blocks
        input: {src_blocks: "= vars.item.src_blocks", dst_blocks: "= vars.item.dst_blocks"}
      - title: Record the completion event
        source: "vllm/v1/simple_kv_offload/copy_backend.py:128-130"
        set: {state.events: "= state.events + [{'event_idx': vars.item.event_idx, 'is_store': vars.item.is_store, 'at': now}]"}
      - return: {did: "= vars.item.is_store ? 'store' : 'load'"}

  - component: disk-backend
    name: launch-copy
    kind: function
    latency_ms: 0
    summary: "Route a copy to the store queue or the load queue (separate threads)."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:189-199"]
    request:
      type: object
      required: [src_blocks, dst_blocks, is_store, event_idx]
      properties:
        src_blocks: {type: array, items: {type: integer}, examples: [[5, 6]]}
        dst_blocks: {type: array, items: {type: integer}, examples: [[0, 1]]}
        is_store: {type: boolean, examples: [true]}
        event_idx: {type: integer, examples: [1]}
    response: {type: object}
    behavior:
      - set: {vars.item: {src_blocks: "= input.src_blocks", dst_blocks: "= input.dst_blocks", event_idx: "= input.event_idx"}}
      - title: q.put on the store or the load queue
        source: "vllm/v1/simple_kv_offload/disk_backend.py:198-199"
        call: "= input.is_store ? 'disk-store-thread.put' : 'disk-load-thread.put'"
        targets: [disk-store-thread.put, disk-load-thread.put]
        input: {item: "= vars.item"}
        as: q
      - return: {queued: "= vars.q.value.queued", is_store: "= input.is_store"}

  - component: disk-store-thread
    name: put
    kind: function
    latency_ms: 0
    summary: "SimpleQueue.put on the store queue."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:198-199"]
    request: {type: object, required: [item], properties: {item: {}}}
    response: {type: object, properties: {queued: {type: integer}}}
    behavior:
      - set: {state.queue: "= state.queue + [input.item]"}
      - return: {queued: "= size(state.queue)"}

  - component: disk-load-thread
    name: put
    kind: function
    latency_ms: 0
    summary: "SimpleQueue.put on the load queue."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:198-199"]
    request: {type: object, required: [item], properties: {item: {}}}
    response: {type: object, properties: {queued: {type: integer}}}
    behavior:
      - set: {state.queue: "= state.queue + [input.item]"}
      - return: {queued: "= size(state.queue)"}

  - component: disk-store-thread
    name: store-loop
    kind: function
    latency_ms: 0
    summary: "One turn of the store thread: GPU -> pinned staging slot (DMA) -> disk (pwritev), double-buffered; a short write raises OSError and ends the thread."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:236-252", "vllm/v1/simple_kv_offload/disk_backend.py:288-315"]
    errors: [{code: os-error, status: 0, retryable: false}]
    request: {type: object}
    response: {type: object, properties: {did: {type: string}, events: {type: array, items: {type: integer}}, queued: {type: integer}}}
    behavior:
      - if: "!state.alive"
        then: [{return: {did: exited, events: "= state.events.map(e, e.event_idx)", queued: "= size(state.queue)"}}]
      - if: "size(state.queue) == 0"
        then: [{return: {did: idle, events: "= state.events.map(e, e.event_idx)", queued: 0}}]
      - set:
          vars.item: "= state.queue[0]"
          state.queue: "= state.queue.slice(1, size(state.queue))"
      - if: "vars.item == null"
        then:
          - title: Shutdown sentinel
            source: "vllm/v1/simple_kv_offload/disk_backend.py:243-245"
            set: {state.alive: false}
          - return: {did: exited, events: "= state.events.map(e, e.event_idx)", queued: "= size(state.queue)"}
      - title: Stage each block over DMA, then pwritev the slot
        source: "vllm/v1/simple_kv_offload/disk_backend.py:300-315"
        foreach: "= lists.range(size(vars.item.src_blocks))"
        as: i
        steps:
          - call: cuda-mem-ops.copy-blocks
            input: {src_blocks: ["= vars.item.src_blocks[vars.i]"], dst_blocks: ["= vars.i % 2"]}
          - call: local-disk.pwritev
            input: {offset: "= vars.item.dst_blocks[vars.i] * state.total_block_bytes", num_bytes: "= state.total_block_bytes"}
            as: w
            on_error:
              - title: pwritev raised; the store thread dies
                source: "vllm/v1/simple_kv_offload/disk_backend.py:254-260"
                set: {state.alive: false}
              - fail: {code: os-error, status: 0, message: "= 'pwritev failed: ' + error.code"}
          - if: "vars.w.value.bytes_written < state.total_block_bytes"
            then:
              - title: Short write
                source: "vllm/v1/simple_kv_offload/disk_backend.py:256-260"
                set: {state.alive: false}
              - fail: {code: os-error, status: 0, message: "= 'Short write: expected ' + string(state.total_block_bytes) + ' bytes, wrote ' + string(vars.w.value.bytes_written)"}
      - title: Record the completion event
        source: "vllm/v1/simple_kv_offload/disk_backend.py:250-252"
        set: {state.events: "= state.events + [{'event_idx': vars.item.event_idx, 'is_store': true, 'at': now}]"}
      - return: {did: store, events: "= state.events.map(e, e.event_idx)", queued: "= size(state.queue)"}

  - component: disk-load-thread
    name: load-loop
    kind: function
    latency_ms: 0
    summary: "One turn of the load thread: disk (preadv) -> staging slot -> GPU (DMA); a short read raises OSError and ends the thread."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:270-286", "vllm/v1/simple_kv_offload/disk_backend.py:317-343"]
    errors: [{code: os-error, status: 0, retryable: false}]
    request: {type: object}
    response: {type: object, properties: {did: {type: string}, events: {type: array, items: {type: integer}}, queued: {type: integer}}}
    behavior:
      - if: "!state.alive"
        then: [{return: {did: exited, events: "= state.events.map(e, e.event_idx)", queued: "= size(state.queue)"}}]
      - if: "size(state.queue) == 0"
        then: [{return: {did: idle, events: "= state.events.map(e, e.event_idx)", queued: 0}}]
      - set:
          vars.item: "= state.queue[0]"
          state.queue: "= state.queue.slice(1, size(state.queue))"
      - if: "vars.item == null"
        then:
          - title: Shutdown sentinel
            source: "vllm/v1/simple_kv_offload/disk_backend.py:277-279"
            set: {state.alive: false}
          - return: {did: exited, events: "= state.events.map(e, e.event_idx)", queued: "= size(state.queue)"}
      - title: preadv each slot, then DMA it to the GPU
        source: "vllm/v1/simple_kv_offload/disk_backend.py:328-343"
        foreach: "= lists.range(size(vars.item.src_blocks))"
        as: i
        steps:
          - call: local-disk.preadv
            input: {offset: "= vars.item.src_blocks[vars.i] * state.total_block_bytes", num_bytes: "= state.total_block_bytes"}
            as: r
            on_error:
              - title: preadv raised; the load thread dies
                source: "vllm/v1/simple_kv_offload/disk_backend.py:262-268"
                set: {state.alive: false}
              - fail: {code: os-error, status: 0, message: "= 'preadv failed: ' + error.code"}
          - if: "vars.r.value.bytes_read < state.total_block_bytes"
            then:
              - title: Short read
                source: "vllm/v1/simple_kv_offload/disk_backend.py:264-268"
                set: {state.alive: false}
              - fail: {code: os-error, status: 0, message: "= 'Short read: expected ' + string(state.total_block_bytes) + ' bytes'"}
          - call: cuda-mem-ops.copy-blocks
            input: {src_blocks: ["= vars.i % 2"], dst_blocks: ["= vars.item.dst_blocks[vars.i]"]}
      - title: Record the completion event
        source: "vllm/v1/simple_kv_offload/disk_backend.py:284-286"
        set: {state.events: "= state.events + [{'event_idx': vars.item.event_idx, 'is_store': false, 'at': now}]"}
      - return: {did: load, events: "= state.events.map(e, e.event_idx)", queued: "= size(state.queue)"}

  # ============================================================ tiered offload
  - component: async-lookup-manager
    name: lookup
    kind: function
    latency_ms: 0
    summary: "Non-blocking existence check from the scheduler thread: true/false once resolved, null while pending (retry next step)."
    sources: ["vllm/v1/kv_offload/tiering/async_lookup.py:140-161"]
    request: {type: object, required: [key, req_id], properties: {key: {type: string, examples: [blk-sys-0]}, req_id: {type: string, examples: [chatcmpl-abc123]}}}
    response: {type: object, properties: {result: {}}}
    behavior:
      - call: async-lookup-manager.drain-results
      - if: "!(input.key in state.lookup_state)"
        then:
          - title: New key; batch it for this step's flush
            source: "vllm/v1/kv_offload/tiering/async_lookup.py:153-158"
            set:
              state.lookup_state: "= merge(state.lookup_state, {input.key: {'generation': state.next_generation, 'phase': 'PENDING', 'result': null, 'request_ids': []}})"
              state.lookup_batch: "= state.lookup_batch + [{'key': input.key, 'req_id': input.req_id, 'generation': state.next_generation}]"
              state.next_generation: "= state.next_generation + 1"
      - set:
          state.lookup_state: "= merge(state.lookup_state, {input.key: {'request_ids': state.lookup_state[input.key].request_ids.filter(r, r != input.req_id) + [input.req_id]}})"
      - return: {result: "= state.lookup_state[input.key].result"}

  - component: async-lookup-manager
    name: flush
    kind: function
    latency_ms: 0
    summary: "Called once per step: drain results, then post this step's PENDING keys to the worker thread as one batch (IN_FLIGHT)."
    sources: ["vllm/v1/kv_offload/tiering/async_lookup.py:163-185"]
    request: {type: object}
    response: {type: object, properties: {posted: {type: integer}}}
    behavior:
      - call: async-lookup-manager.drain-results
      - set:
          vars.batch: "= state.lookup_batch.filter(e, e.key in state.lookup_state && state.lookup_state[e.key].generation == e.generation)"
      - set:
          state.lookup_batch: []
          state.lookup_state: "= merge(state.lookup_state, vars.batch.transformMapEntry(i, e, {e.key: {'phase': 'IN_FLIGHT'}}))"
      - if: "size(vars.batch) > 0"
        then:
          - title: One queue item per step
            source: "vllm/v1/kv_offload/tiering/async_lookup.py:184-185"
            set: {state.lookup_queue: "= state.lookup_queue + [vars.batch]"}
      - return: {posted: "= size(vars.batch)"}

  - component: async-lookup-manager
    name: drain-results
    kind: function
    latency_ms: 0
    summary: "Apply worker results: stale generations are dropped, keys no request wants are deleted, the rest become RESOLVED."
    sources: ["vllm/v1/kv_offload/tiering/async_lookup.py:187-214"]
    request: {type: object}
    response: {type: object, properties: {applied: {type: integer}}}
    behavior:
      - set:
          vars.results: "= state.pending_results.flatten()"
      - if: "size(vars.results) == 0"
        then: [{return: {applied: 0}}]
      - set:
          vars.live: "= vars.results.filter(r, r.key in state.lookup_state && state.lookup_state[r.key].generation == r.generation)"
      - set:
          vars.orphans: "= vars.live.filter(r, size(state.lookup_state[r.key].request_ids) == 0).map(r, r.key)"
          vars.apply: "= vars.live.filter(r, size(state.lookup_state[r.key].request_ids) > 0)"
      - title: Resolve live lookups; drop orphaned ones
        source: "vllm/v1/kv_offload/tiering/async_lookup.py:197-214"
        set:
          state.pending_results: []
          state.lookup_state: "= merge(state.lookup_state.transformMap(k, v, !(k in vars.orphans), v), vars.apply.transformMapEntry(i, r, {r.key: {'result': r.found, 'phase': 'RESOLVED'}}))"
      - return: {applied: "= size(vars.apply)"}

  - component: async-lookup-manager
    name: worker
    kind: function
    latency_ms: 0
    summary: "One turn of the lookup thread: take a step's batch, group it by request, run batch_lookup per request (a failure counts as all misses), post the results."
    sources: ["vllm/v1/kv_offload/tiering/async_lookup.py:248-284"]
    request: {type: object}
    response: {type: object, properties: {did: {type: string}}}
    behavior:
      - if: "size(state.lookup_queue) == 0"
        then: [{return: {did: idle}}]
      - set:
          vars.pending: "= state.lookup_queue[0]"
          state.lookup_queue: "= state.lookup_queue.slice(1, size(state.lookup_queue))"
      - if: "vars.pending == null"
        then:
          - title: Shutdown sentinel
            source: "vllm/v1/kv_offload/tiering/async_lookup.py:250-252"
            return: {did: exited}
      - set:
          vars.results: []
      - title: Group by request and batch_lookup each group
        source: "vllm/v1/kv_offload/tiering/async_lookup.py:255-280"
        foreach: "= vars.pending.map(e, e.req_id).distinct()"
        as: rid
        steps:
          - set: {vars.entries: "= vars.pending.filter(e, e.req_id == vars.rid)"}
          - call: async-lookup-manager.batch-lookup
            input: {keys: "= vars.entries.map(e, e.key)", req_id: "= vars.rid"}
            as: hits
            on_error: continue
          - if: "!vars.hits.ok"
            then:
              - title: batch_lookup failed; every key counts as a miss
                source: "vllm/v1/kv_offload/tiering/async_lookup.py:268-277"
                set: {vars.results: "= vars.results + vars.entries.map(e, {'key': e.key, 'generation': e.generation, 'found': false})"}
            else:
              - set: {vars.results: "= vars.results + lists.range(size(vars.entries)).map(i, {'key': vars.entries[i].key, 'generation': vars.entries[i].generation, 'found': vars.hits.value.found[i]})"}
      - if: "size(vars.results) > 0"
        then:
          - title: Post the whole batch as one item
            source: "vllm/v1/kv_offload/tiering/async_lookup.py:282-284"
            set: {state.pending_results: "= state.pending_results + [vars.results]"}
      - return: {did: lookup}

  - component: async-lookup-manager
    name: batch-lookup
    kind: function
    latency_ms: 1
    summary: "The tier's own existence check (abstract; subclasses implement it). Modeled as a lookup in the tier's key set."
    sources: ["vllm/v1/kv_offload/tiering/async_lookup.py:123-134"]
    request: {type: object, required: [keys], properties: {keys: {type: array, items: {type: string}}, req_id: {type: string}}}
    response: {type: object, properties: {found: {type: array, items: {type: boolean}}}}
    behavior:
      - return: {found: "= input.keys.map(k, k in state.tier_keys)"}

  - component: dual-queue-thread-pool
    name: enqueue-load
    kind: function
    latency_ms: 0
    summary: "Queue a load job's per-block tasks on the load queue (load-priority threads take them first)."
    sources: ["vllm/v1/kv_offload/tiering/fs/thread_pool.py:102-114"]
    request: {type: object, required: [job_id, tasks], properties: {job_id: {type: integer, examples: [7]}, tasks: {type: array, items: {type: object, properties: {block: {type: integer}, fails: {type: boolean}}}}}}
    response: {type: object}
    behavior:
      - set:
          state.inflight_jobs: "= state.inflight_jobs + 1"
          state.jobs: "= merge(state.jobs, {string(input.job_id): {'n_tasks': size(input.tasks), 'completed': 0, 'success': true}})"
          state.load_q: "= state.load_q + input.tasks.map(t, {'job_id': input.job_id, 'task': t})"
      - return: {queued: "= size(input.tasks)"}

  - component: dual-queue-thread-pool
    name: enqueue-store
    kind: function
    latency_ms: 0
    summary: "Queue a store job's per-block tasks on the store queue (store-priority threads take them first)."
    sources: ["vllm/v1/kv_offload/tiering/fs/thread_pool.py:116-128"]
    request: {type: object, required: [job_id, tasks], properties: {job_id: {type: integer, examples: [8]}, tasks: {type: array, items: {type: object, properties: {block: {type: integer}, fails: {type: boolean}}}}}}
    response: {type: object}
    behavior:
      - set:
          state.inflight_jobs: "= state.inflight_jobs + 1"
          state.jobs: "= merge(state.jobs, {string(input.job_id): {'n_tasks': size(input.tasks), 'completed': 0, 'success': true}})"
          state.store_q: "= state.store_q + input.tasks.map(t, {'job_id': input.job_id, 'task': t})"
      - return: {queued: "= size(input.tasks)"}

  - component: dual-queue-thread-pool
    name: worker
    kind: function
    latency_ms: 0
    summary: "One turn of an IO thread: pop from its primary queue (load or store), else the other; run the block IO; when a job's last task ends, post (job, success, time)."
    sources: ["vllm/v1/kv_offload/tiering/fs/thread_pool.py:162-194"]
    request: {type: object, properties: {load_priority: {type: boolean, default: true}}}
    response: {type: object, properties: {did: {type: string}}}
    behavior:
      - if: "state.stop"
        then:
          - title: Pool stopped; the thread returns
            source: "vllm/v1/kv_offload/tiering/fs/thread_pool.py:169-170"
            return: {did: exited}
      - if: "size(state.load_q) == 0 && size(state.store_q) == 0"
        then: [{return: {did: idle}}]
      - set: {vars.lp: "= has(input.load_priority) ? input.load_priority : true"}
      - set:
          vars.from_load: "= vars.lp ? size(state.load_q) > 0 : size(state.store_q) == 0"
      - title: Primary queue first, then the other
        source: "vllm/v1/kv_offload/tiering/fs/thread_pool.py:171-173"
        set:
          vars.item: "= vars.from_load ? state.load_q[0] : state.store_q[0]"
          state.load_q: "= vars.from_load ? state.load_q.slice(1, size(state.load_q)) : state.load_q"
          state.store_q: "= vars.from_load ? state.store_q : state.store_q.slice(1, size(state.store_q))"
      - call: "= vars.from_load ? 'local-disk.preadv' : 'local-disk.pwritev'"
        targets: [local-disk.preadv, local-disk.pwritev]
        input: {offset: "= vars.item.task.block * 2097152", num_bytes: 2097152}
        as: io
        on_error: continue
      - set: {vars.key: "= string(vars.item.job_id)"}
      - set:
          vars.job: "= state.jobs[vars.key]"
      - title: task_done
        detail: "An exception in the task marks the whole job failed but the thread carries on."
        source: "vllm/v1/kv_offload/tiering/fs/thread_pool.py:174-188"
        set:
          vars.job: "= merge(vars.job, {'completed': vars.job.completed + 1, 'success': vars.job.success && vars.io.ok})"
      - if: "vars.job.completed == vars.job.n_tasks"
        then:
          - title: Job finished; post it and drop the in-flight count
            source: "vllm/v1/kv_offload/tiering/fs/thread_pool.py:190-194"
            set:
              state.finished_q: "= state.finished_q + [{'job_id': vars.item.job_id, 'success': vars.job.success}]"
              state.inflight_jobs: "= state.inflight_jobs - 1"
              state.jobs: "= omit(state.jobs, vars.key)"
        else:
          - set: {state.jobs: "= merge(state.jobs, {vars.key: vars.job})"}
      - return: {did: "= vars.from_load ? 'load' : 'store'"}

  - component: dual-queue-thread-pool
    name: get-finished
    kind: function
    latency_ms: 0
    summary: "Drain finished (job_id, success, time) tuples; the manager is the only popper."
    sources: ["vllm/v1/kv_offload/tiering/fs/thread_pool.py:130-136"]
    request: {type: object}
    response: {type: object, properties: {jobs: {type: array}}}
    behavior:
      - set:
          vars.jobs: "= state.finished_q"
          state.finished_q: []
      - return: {jobs: "= vars.jobs"}

  # ======================================================= boundary stubs (others)
  - component: vllm-xpu-kernels
    name: xpu-host-register
    kind: kernel
    summary: "torch.ops._C.xpu_host_register(ptr, num_bytes) -> bool (owner kernels-ops)."
    attributes: {boundary: true, owner: kernels-ops}
    request: {type: object, required: [ptr, num_bytes], properties: {ptr: {type: integer, examples: [140000000000]}, num_bytes: {type: integer, examples: [68719476736]}}}
    response: {type: object, properties: {ok: {type: boolean, default: true}}}
  - component: vllm-xpu-kernels
    name: xpu-host-unregister
    kind: kernel
    summary: "torch.ops._C.xpu_host_unregister(ptr) -> bool (owner kernels-ops)."
    attributes: {boundary: true, owner: kernels-ops}
    request: {type: object, required: [ptr], properties: {ptr: {type: integer, examples: [140000000000]}}}
    response: {type: object, properties: {ok: {type: boolean, default: true}}}
  - component: custom-ops
    name: swap-blocks-batch
    kind: function
    summary: "Python wrapper swap_blocks_batch -> torch.ops._C_cache_ops.swap_blocks_batch (kernels-ops)."
    attributes: {boundary: true, owner: kernels-ops}
    request: KernelsOpsBlockCopyShape
  - component: local-disk
    name: pwritev
    kind: io
    summary: "os.pwritev to the offload file (shared infrastructure)."
    attributes: {boundary: true, owner: shared}
    latency_ms: "= 0.01 + double(input.num_bytes) / double(config['scheduler-kv-nvme-bytes-per-ms'])"
    request: {type: object, properties: {offset: {type: integer}, num_bytes: {type: integer}}}
    response: {type: object, properties: {bytes_written: {type: integer, default: 2097152}}}
  - component: local-disk
    name: preadv
    kind: io
    summary: "os.preadv from the offload file (shared infrastructure)."
    attributes: {boundary: true, owner: shared}
    latency_ms: "= 0.01 + double(input.num_bytes) / double(config['scheduler-kv-nvme-bytes-per-ms'])"
    request: {type: object, properties: {offset: {type: integer}, num_bytes: {type: integer}}}
    response: {type: object, properties: {bytes_read: {type: integer, default: 2097152}}}

  # ===================================================== round 4: encoder cache
  - component: encoder-cache-manager
    name: init
    kind: function
    latency_ms: 0
    summary: "Create the cache with cache_size embedding slots, all free."
    sources: ["vllm/v1/core/encoder_cache_manager.py:72-92"]
    request: {type: object, required: [cache_size], properties: {cache_size: {type: integer, examples: [20]}}}
    response: {type: object, properties: {cache_size: {type: integer}}}
    behavior:
      - title: create_manager(cache_size) - every slot free, nothing cached
        source: "vllm/v1/core/encoder_cache_manager.py:78-92"
        set:
          state.cache_size: "= input.cache_size"
          state.num_free_slots: "= input.cache_size"
          state.num_freeable_slots: "= input.cache_size"
          state.cached: {}
          state.num_embeds_by_hash: {}
          state.request_cached_ids: {}
          state.freeable: []
          state.freed: []
      - return: {cache_size: "= input.cache_size"}

  - component: encoder-cache-manager
    name: check-and-update-cache
    kind: function
    latency_ms: 0
    summary: "Is this input's embedding cached? If so the request takes a reference; an entry nobody referenced leaves the freeable list."
    sources: ["vllm/v1/core/encoder_cache_manager.py:108-136"]
    request:
      type: object
      required: [request_id, input_id, mm_hash]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        input_id: {type: integer, examples: [0]}
        mm_hash: {type: string, examples: [img1]}
    response: {type: object, properties: {cached: {type: boolean}}}
    behavior:
      - if: "!(input.mm_hash in state.cached)"
        then:
          - title: Not cached
            source: "vllm/v1/core/encoder_cache_manager.py:126-127"
            return: {cached: false}
      - if: "size(state.cached[input.mm_hash]) == 0"
        then:
          - title: Unreferenced entry - reclaim it from the freeable list
            source: "vllm/v1/core/encoder_cache_manager.py:130-132"
            set:
              state.num_freeable_slots: "= state.num_freeable_slots - state.freeable.filter(f, f.mm_hash == input.mm_hash).map(f, f.num_embeds)[0]"
              state.freeable: "= state.freeable.filter(f, f.mm_hash != input.mm_hash)"
      - title: Add the request's reference
        source: "vllm/v1/core/encoder_cache_manager.py:134-136"
        set:
          state.cached: "= merge(state.cached, {input.mm_hash: state.cached[input.mm_hash].filter(r, r != input.request_id) + [input.request_id]})"
          state.request_cached_ids: "= merge(state.request_cached_ids, {input.request_id: (input.request_id in state.request_cached_ids ? state.request_cached_ids[input.request_id].filter(i, i != input.input_id) : []) + [input.input_id]})"
      - return: {cached: true}

  - component: encoder-cache-manager
    name: can-allocate
    kind: function
    latency_ms: 0
    summary: "Is there room for this input's embeddings (plus those already scheduled this step)? Evicts unreferenced entries oldest first when free slots alone are short."
    sources: ["vllm/v1/core/encoder_cache_manager.py:145-206", "vllm/v1/request.py:333-335"]
    request:
      type: object
      required: [request_id, input_id, num_embeds, encoder_compute_budget]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        input_id: {type: integer, examples: [0]}
        num_embeds: {type: integer, examples: [10], description: "request.get_num_encoder_embeds(input_id): the placeholder's embedding count."}
        encoder_compute_budget: {type: integer, examples: [2048]}
        num_embeds_to_schedule: {type: integer, default: 0}
    response: {type: object, properties: {can_allocate: {type: boolean}, evicted: {type: array, items: {type: string}}}}
    behavior:
      - if: "input.num_embeds > input.encoder_compute_budget"
        then:
          - title: Over this step's encoder compute budget
            source: "vllm/v1/core/encoder_cache_manager.py:184-185"
            return: {can_allocate: false, evicted: []}
      - set:
          vars.need: "= input.num_embeds + (has(input.num_embeds_to_schedule) ? input.num_embeds_to_schedule : 0)"
      - if: "vars.need <= state.num_free_slots"
        then:
          - title: Fits in the free slots
            source: "vllm/v1/core/encoder_cache_manager.py:190-191"
            return: {can_allocate: true, evicted: []}
      - if: "vars.need > state.num_freeable_slots"
        then:
          - title: Not even after reclaiming every unreferenced entry
            source: "vllm/v1/core/encoder_cache_manager.py:194-195"
            return: {can_allocate: false, evicted: []}
      - set: {vars.evicted: []}
      - title: Evict unreferenced entries, oldest first, until it fits
        source: "vllm/v1/core/encoder_cache_manager.py:200-206"
        foreach: "= state.freeable"
        as: f
        steps:
          - if: "vars.need <= state.num_free_slots"
            then: [{break: true}]
          - set:
              state.freeable: "= state.freeable.filter(x, x.mm_hash != vars.f.mm_hash)"
              state.cached: "= omit(state.cached, vars.f.mm_hash)"
              state.num_embeds_by_hash: "= omit(state.num_embeds_by_hash, vars.f.mm_hash)"
              state.freed: "= state.freed + [vars.f.mm_hash]"
              state.num_free_slots: "= state.num_free_slots + vars.f.num_embeds"
              vars.evicted: "= vars.evicted + [vars.f.mm_hash]"
      - return: {can_allocate: true, evicted: "= vars.evicted"}

  - component: encoder-cache-manager
    name: allocate
    kind: function
    latency_ms: 0
    summary: "Reserve slots for an input's embeddings and record the request's reference (can-allocate must have said yes)."
    sources: ["vllm/v1/core/encoder_cache_manager.py:208-240"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      required: [request_id, input_id, mm_hash, num_embeds]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        input_id: {type: integer, examples: [0]}
        mm_hash: {type: string, examples: [img1]}
        num_embeds: {type: integer, examples: [10]}
    response: {type: object, properties: {num_free_slots: {type: integer}}}
    behavior:
      - if: "input.mm_hash in state.num_embeds_by_hash && state.num_embeds_by_hash[input.mm_hash] != input.num_embeds"
        then:
          - title: The same item must always have the same embedding count
            source: "vllm/v1/core/encoder_cache_manager.py:225-230"
            fail: {code: assertion-error, status: 0, message: "cached_num_encoder_embeds == num_encoder_embeds"}
      - if: "state.num_free_slots < input.num_embeds || state.num_freeable_slots < input.num_embeds"
        then:
          - title: Allocation without room
            source: "vllm/v1/core/encoder_cache_manager.py:234-235"
            fail: {code: assertion-error, status: 0, message: "self.num_free_slots >= num_encoder_embeds"}
      - title: Reference the entry and take its slots
        source: "vllm/v1/core/encoder_cache_manager.py:237-240"
        set:
          state.cached: "= merge(state.cached, {input.mm_hash: (input.mm_hash in state.cached ? state.cached[input.mm_hash].filter(r, r != input.request_id) : []) + [input.request_id]})"
          state.num_embeds_by_hash: "= merge(state.num_embeds_by_hash, {input.mm_hash: input.num_embeds})"
          state.request_cached_ids: "= merge(state.request_cached_ids, {input.request_id: (input.request_id in state.request_cached_ids ? state.request_cached_ids[input.request_id].filter(i, i != input.input_id) : []) + [input.input_id]})"
          state.num_free_slots: "= state.num_free_slots - input.num_embeds"
          state.num_freeable_slots: "= state.num_freeable_slots - input.num_embeds"
      - return: {num_free_slots: "= state.num_free_slots"}

  - component: encoder-cache-manager
    name: free-encoder-input
    kind: function
    latency_ms: 0
    summary: "Drop a request's reference to one input; an entry nobody references becomes freeable (reclaimed only when space is needed)."
    sources: ["vllm/v1/core/encoder_cache_manager.py:246-282"]
    request:
      type: object
      required: [request_id, input_id, mm_hashes]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        input_id: {type: integer, examples: [0]}
        mm_hashes: {type: array, items: {type: string}, examples: [[img1]], description: "The request's mm_features identifiers, by input id."}
    response: {type: object, properties: {freeable: {type: boolean}}}
    behavior:
      - set: {vars.h: "= input.mm_hashes[input.input_id]"}
      - if: "input.request_id in state.request_cached_ids"
        then:
          - title: Forget this input id for the request
            source: "vllm/v1/core/encoder_cache_manager.py:260-263"
            set:
              state.request_cached_ids: "= size(state.request_cached_ids[input.request_id].filter(i, i != input.input_id)) == 0 ? omit(state.request_cached_ids, input.request_id) : merge(state.request_cached_ids, {input.request_id: state.request_cached_ids[input.request_id].filter(i, i != input.input_id)})"
      - if: "!(vars.h in state.cached) || size(state.cached[vars.h]) == 0"
        then: [{return: {freeable: false}}]
      - if: "input.request_id in state.request_cached_ids && state.request_cached_ids[input.request_id].exists(i, input.mm_hashes[i] == vars.h)"
        then:
          - title: Another input of the same request still holds this item
            source: "vllm/v1/core/encoder_cache_manager.py:273-277"
            return: {freeable: false}
      - set:
          state.cached: "= merge(state.cached, {vars.h: state.cached[vars.h].filter(r, r != input.request_id)})"
      - if: "size(state.cached[vars.h]) == 0"
        then:
          - title: Unreferenced - append to the freeable list
            source: "vllm/v1/core/encoder_cache_manager.py:278-282"
            set:
              state.freeable: "= state.freeable + [{'mm_hash': vars.h, 'num_embeds': state.num_embeds_by_hash[vars.h]}]"
              state.num_freeable_slots: "= state.num_freeable_slots + state.num_embeds_by_hash[vars.h]"
          - return: {freeable: true}
      - return: {freeable: false}

  - component: encoder-cache-manager
    name: get-freed-mm-hashes
    kind: function
    latency_ms: 0
    summary: "Take the hashes evicted since the last call (ones re-cached meanwhile excluded), so the workers can drop those encoder outputs."
    sources: ["vllm/v1/core/encoder_cache_manager.py:296-310"]
    request: {type: object}
    response: {type: object, properties: {freed: {type: array, items: {type: string}}}}
    behavior:
      - title: Return and clear the freed list
        source: "vllm/v1/core/encoder_cache_manager.py:308-310"
        set:
          vars.out: "= state.freed.filter(h, !(h in state.cached))"
          state.freed: []
      - return: {freed: "= vars.out"}

  - component: encoder-cache-manager
    name: reset
    kind: function
    latency_ms: 0
    summary: "Drop every cached embedding and restore full capacity (after a weight update)."
    sources: ["vllm/v1/core/encoder_cache_manager.py:94-106"]
    request: {type: object}
    response: {type: object, properties: {num_free_slots: {type: integer}, num_freeable_slots: {type: integer}}}
    behavior:
      - title: Clear every map and restore the slot counts
        source: "vllm/v1/core/encoder_cache_manager.py:100-106"
        set:
          state.cached: {}
          state.num_embeds_by_hash: {}
          state.request_cached_ids: {}
          state.freeable: []
          state.freed: []
          state.num_free_slots: "= state.cache_size"
          state.num_freeable_slots: "= state.cache_size"
      - return: {num_free_slots: "= state.cache_size", num_freeable_slots: "= state.cache_size"}

  - component: encoder-cache-manager
    name: get-state
    kind: function
    latency_ms: 0
    summary: "The cache's counters and maps (the attributes the scheduler and tests read)."
    sources: ["vllm/v1/core/encoder_cache_manager.py:78-92"]
    request: {type: object}
    response: {type: object}
    behavior:
      - return: "= state"

  - component: encoder-cache-manager
    name: free
    kind: function
    latency_ms: 0
    summary: "Release every input reference a finished, cancelled or aborted request holds."
    sources: ["vllm/v1/core/encoder_cache_manager.py:284-294"]
    request:
      type: object
      required: [request_id, mm_hashes]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        mm_hashes: {type: array, items: {type: string}, examples: [[img1]]}
    response: {type: object, properties: {released: {type: integer}}}
    behavior:
      - set: {vars.ids: "= input.request_id in state.request_cached_ids ? state.request_cached_ids[input.request_id] : []"}
      - title: free_encoder_input for each cached input id
        source: "vllm/v1/core/encoder_cache_manager.py:293-294"
        foreach: "= vars.ids"
        as: iid
        steps:
          - call: encoder-cache-manager.free-encoder-input
            input: {request_id: "= input.request_id", input_id: "= vars.iid", mm_hashes: "= input.mm_hashes"}
      - return: {released: "= size(vars.ids)"}

  # ============================================ round 4: block pool free queue
  - component: block-pool
    name: free-queue-append
    kind: function
    latency_ms: 0
    summary: "FreeKVCacheBlockQueue.append: put one block back at the tail of the free queue (evicted last) and count it free."
    description: "The block pool frees through append_n / prepend_n (block_pool.py:793-803); append is the single-block form the queue exposes. The free queue is part of the pool's state here (free_tail)."
    sources: ["vllm/v1/core/kv_cache_utils.py:402-424", "vllm/v1/core/kv_cache_utils.py:246-260"]
    errors: [{code: runtime-error, status: 0, retryable: false}]
    request: {type: object, required: [block_id], properties: {block_id: {type: integer, examples: [5]}}}
    response: {type: object, properties: {num_free_blocks: {type: integer}}}
    behavior:
      - if: "input.block_id in state.free_tail || input.block_id in state.free_front || (input.block_id >= state.next_fresh && input.block_id < state.num_gpu_blocks) || input.block_id == 0"
        then:
          - title: The block is already linked in the free queue (or is the null block)
            detail: "Linking a block that is already in the list corrupts it; the queue only ever receives blocks popped from it."
            source: "vllm/v1/core/kv_cache_utils.py:412-415"
            fail: {code: runtime-error, status: 0, message: "= 'block ' + string(input.block_id) + ' is already in the free queue'"}
      - title: Link the block after the last one and before the fake tail
        source: "vllm/v1/core/kv_cache_utils.py:416-424"
        set:
          state.free_tail: "= state.free_tail + [input.block_id]"
          state.ref_cnt: "= omit(state.ref_cnt, string(input.block_id))"
      - return: {num_free_blocks: "= size(state.free_front) + (state.num_gpu_blocks - state.next_fresh) + size(state.free_tail)"}

  # ================================================ round 4: none hash seed
  - component: kv-cache-utils
    name: init-none-hash
    kind: function
    latency_ms: 0
    summary: "Pick the prefix-cache hash function and the NONE_HASH seed that roots every block-hash chain: PYTHONHASHSEED if set, else a fixed seed for SHA-256 (shareable across processes) or a random per-process one for xxhash."
    sources: ["vllm/v1/core/kv_cache_utils.py:102-172", "vllm/utils/hashing.py:26-41", "vllm/utils/hashing.py:84-103"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      properties:
        hash_fn_name: {type: string, default: sha256, enum: [sha256, sha256_cbor, xxhash, xxhash_cbor, md5], description: "cache_config.prefix_caching_hash_algo"}
        pythonhashseed: {type: [string, "null"], default: null, description: "The PYTHONHASHSEED environment variable."}
    response: {type: object, properties: {seed: {type: string}, hash_fn: {type: string}, random_seed: {type: boolean}}}
    behavior:
      - set:
          vars.name: "= has(input.hash_fn_name) ? input.hash_fn_name : 'sha256'"
          vars.env: "= has(input.pythonhashseed) ? input.pythonhashseed : dyn(null)"
      - if: "!(vars.name in ['sha256', 'sha256_cbor', 'xxhash', 'xxhash_cbor'])"
        then:
          - title: Unknown hash algorithm
            source: "vllm/utils/hashing.py:94-103"
            fail: {code: value-error, status: 0, message: "= 'Unsupported hash function: ' + vars.name"}
      - if: "vars.env != null"
        then:
          - title: PYTHONHASHSEED wins
            source: "vllm/v1/core/kv_cache_utils.py:138-140"
            set: {vars.seed: "= vars.env", vars.random: false}
        else:
          - if: "vars.name in ['xxhash', 'xxhash_cbor']"
            then:
              - title: Non-cryptographic hash - a random per-process seed
                detail: "A predictable seed would let an attacker precompute colliding blocks; hashes are then not reproducible across processes."
                source: "vllm/v1/core/kv_cache_utils.py:141-142"
                set: {vars.seed: "= id('none-hash-seed', vars.name)", vars.random: true}
              - if: "vars.name == 'xxhash'"
                then:
                  - title: "Using a random per-process NONE_HASH seed because xxhash is not collision resistant. Block hashes are therefore not reproducible across processes; set PYTHONHASHSEED to a shared value to reuse the prefix cache across instances, or use sha256."
                    detail: "logger.warning, formatted with hash_fn.__name__."
                    source: "vllm/v1/core/kv_cache_utils.py:164-171"
                else:
                  - title: "Using a random per-process NONE_HASH seed because xxhash_cbor is not collision resistant. Block hashes are therefore not reproducible across processes; set PYTHONHASHSEED to a shared value to reuse the prefix cache across instances, or use sha256."
                    detail: "logger.warning, formatted with hash_fn.__name__."
                    source: "vllm/v1/core/kv_cache_utils.py:164-171"
            else:
              - title: SHA-256 - the fixed default seed, identical in every process
                source: "vllm/v1/core/kv_cache_utils.py:143"
                set: {vars.seed: vllm-none-hash, vars.random: false}
      - title: NONE_HASH = hash_fn(seed)
        source: "vllm/v1/core/kv_cache_utils.py:160-172"
        set:
          state.none_hash_seed: "= vars.seed"
          state.hash_fn: "= vars.name"
      - return: {seed: "= vars.seed", hash_fn: "= vars.name", random_seed: "= vars.random"}

  - component: kv-cache-utils
    name: get-none-hash-seed
    kind: function
    latency_ms: 0
    summary: "The seed NONE_HASH was derived from (the deterministic default before init_none_hash runs); the P2P tier advertises it in its handshake."
    sources: ["vllm/v1/core/kv_cache_utils.py:146-157"]
    request: {type: object}
    response: {type: object, properties: {seed: {type: string}}}
    behavior:
      - if: "state.none_hash_seed == null"
        then:
          - title: Not initialized - the deterministic default
            source: "vllm/v1/core/kv_cache_utils.py:155-156"
            return: {seed: vllm-none-hash}
      - return: {seed: "= state.none_hash_seed"}

  - component: kv-cache-utils
    name: get-kv-cache-config-from-groups
    kind: function
    latency_ms: 0
    summary: "Build the KVCacheConfig: validate the layout against mixed page sizes; num_blocks = available memory // the largest group's bytes per block (or the override), where a block-outermost layout rounds the packed page sum up to lcm(HiSparse hot page sizes, every layer's block_stride_alignment) and a layer-outermost one pads each page to its alignment; one KVCacheTensor per distinct layer spec."
    description: >-
      KVCacheLayout has six members (stride permutations of [L, B, H, N, C]): LBHNC, LBNHC and
      LHBNC put L outermost (layer-outer); BLHNC, BLNHC and BHLNC put B outermost (block-outer).
      Block-compact layouts (L and B the two outer dims) are LBHNC, LBNHC, BLHNC and BLNHC. Mixed
      page sizes need a block-compact layout, and with several groups not a layer-compact one.
      A layer's alignment is its spec's block_stride_alignment (1 when unset); the model takes it
      per group (block_stride_alignment) or per layer (layer_alignments). A hisparse_hot group is a
      HiSparseHotSpec: its page size joins the alignments. Byte offsets inside a block are not
      modeled.
    sources: ["vllm/v1/core/kv_cache_utils.py:1588-1687", "vllm/v1/core/kv_cache_utils.py:1515-1551", "vllm/v1/core/kv_cache_utils.py:1554-1586", "vllm/v1/kv_cache_layout.py:15-57", "vllm/v1/kv_cache_interface.py:183-195", "vllm/v1/kv_cache_interface.py:1438-1494", "vllm/v1/kv_cache_interface.py:1408-1430"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [kv_cache_groups, available_memory]
      properties:
        kv_cache_groups:
          type: array
          description: "KVCacheGroupSpec: layer names and each layer's page size (a UniformTypeKVCacheSpecs group may mix page sizes)."
          items:
            type: object
            properties:
              layer_names: {type: array, items: {type: string}}
              layer_pages: {type: object}
              block_stride_alignment: {type: integer, default: 1, description: "get_block_stride_alignment() of every layer spec in the group (MultipleOf already resolved)."}
              layer_alignments: {type: object, default: {}, description: "Per-layer block_stride_alignment, overriding the group's."}
              hisparse_hot: {type: boolean, default: false, description: "The group's spec is a HiSparseHotSpec."}
        available_memory: {type: integer, examples: [724992]}
        layout: {type: string, default: LBNHC, enum: [LBHNC, LBNHC, LHBNC, BLHNC, BLNHC, BHLNC], description: "CacheConfig.get_resolved_kv_cache_layout(); L-first members are layer-outermost, B-first block-outermost."}
    response: {type: object, properties: {num_blocks: {type: integer}, kv_cache_tensors: {type: array}, bytes_per_block: {type: integer}}}
    behavior:
      - if: "size(input.kv_cache_groups) == 0"
        then:
          - title: Attention-free model - one block for the null block
            source: "vllm/v1/core/kv_cache_utils.py:1604-1614"
            return: {num_blocks: 1, kv_cache_tensors: [], bytes_per_block: 0}
      - set:
          vars.layout: "= has(input.layout) ? input.layout : 'LBNHC'"
          vars.al: "= input.kv_cache_groups.map(g, g.layer_names.transformMapEntry(i, l, {l: has(g.layer_alignments) && l in g.layer_alignments ? int(g.layer_alignments[l]) : (has(g.block_stride_alignment) && g.block_stride_alignment != null && g.block_stride_alignment > 0 ? int(g.block_stride_alignment) : 1)}))"
      - set:
          vars.block_outer: "= vars.layout.startsWith('B')"
          vars.layer_compact: "= vars.layout.startsWith('L')"
          vars.block_compact: "= vars.layout in ['LBHNC', 'LBNHC', 'BLHNC', 'BLNHC']"
          vars.pages: "= input.kv_cache_groups.map(g, g.layer_names.map(l, int(g.layer_pages[l]))).flatten()"
      - set:
          vars.distinct: "= lists.range(size(vars.pages)).filter(i, !lists.range(i).exists(j, vars.pages[j] == vars.pages[i])).map(i, vars.pages[i]).sort()"
      - if: "size(vars.distinct) > 1 && (!vars.block_compact || (size(input.kv_cache_groups) > 1 && vars.layer_compact))"
        then:
          - title: validate_kv_cache_layout - the layout can't express mixed page sizes
            source: "vllm/v1/core/kv_cache_utils.py:1567-1586"
            fail: {code: value-error, status: 0, message: "= 'KV cache layout ' + vars.layout + ' cannot express this model\\'s mixed page sizes ([' + vars.distinct.map(p, string(p)).join(', ') + ']); a backend should declare block-outermost supported layouts (e.g. BLHNC), or set VLLM_KV_CACHE_LAYOUT=BLHNC.'"}
      - if: "!vars.block_outer"
        then:
          - title: Layer-outer bytes per block - the largest group's sum of pages, each padded to its alignment
            source: "vllm/v1/core/kv_cache_utils.py:1520-1533"
            set:
              vars.bpb: "= math.greatest(lists.range(size(input.kv_cache_groups)).map(gi, sum(input.kv_cache_groups[gi].layer_names.map(l, ((int(input.kv_cache_groups[gi].layer_pages[l]) + vars.al[gi][l] - 1) / vars.al[gi][l]) * vars.al[gi][l]))))"
        else:
          - title: Block-outer bytes per block - the largest group's page sum
            source: "vllm/v1/core/kv_cache_utils.py:1534-1540"
            set:
              vars.raw: "= math.greatest(input.kv_cache_groups.map(g, sum(g.layer_names.map(l, int(g.layer_pages[l])))))"
              vars.aligns: "= input.kv_cache_groups.filter(g, has(g.hisparse_hot) && g.hisparse_hot).map(g, int(g.layer_pages[g.layer_names[0]])) + lists.range(size(input.kv_cache_groups)).map(gi, input.kv_cache_groups[gi].layer_names.map(l, vars.al[gi][l])).flatten()"
          - title: Rounded up to the lcm of the hot page sizes and every layer's stride alignment
            source: "vllm/v1/core/kv_cache_utils.py:1541-1551"
            foreach: "= vars.aligns"
            as: a
            steps:
              - set:
                  vars.x: "= has(vars.lcm) ? vars.lcm : 1"
                  vars.y: "= vars.a"
              - set:
                  vars.g1: "= vars.x"
                  vars.g2: "= vars.y"
              - title: gcd by Euclid
                source: "vllm/v1/core/kv_cache_utils.py:1551"
                foreach: "= lists.range(64)"
                as: it
                steps:
                  - if: "vars.g2 == 0"
                    then: [{break: true}]
                  - set:
                      vars.t: "= vars.g1 % vars.g2"
                  - set:
                      vars.g1: "= vars.g2"
                      vars.g2: "= vars.t"
              - set:
                  vars.lcm: "= vars.x / vars.g1 * vars.y"
          - set:
              vars.m: "= has(vars.lcm) ? vars.lcm : 1"
          - set:
              vars.bpb: "= ((vars.raw + vars.m - 1) / vars.m) * vars.m"
      - set:
          vars.n: "= input.available_memory / vars.bpb"
      - if: "'num-gpu-blocks-override' in config && config['num-gpu-blocks-override'] != null"
        then:
          - title: num_gpu_blocks_override replaces the computed count
            source: "vllm/v1/core/kv_cache_utils.py:1230-1236"
            set: {vars.n: "= int(config['num-gpu-blocks-override'])"}
      - title: One KVCacheTensor per distinct spec (page size) of each group
        detail: "Block-outermost: every layer shares each block (block stride = bytes per block). Layer-outermost: each layer owns num_blocks x its block stride, which is its page padded to its alignment (a padded page needs a block-compact layout)."
        source: "vllm/v1/core/kv_cache_utils.py:1642-1678"
        set:
          vars.tensors: "= lists.range(size(input.kv_cache_groups)).map(gi, input.kv_cache_groups[gi]).map(g, lists.range(size(g.layer_names)).filter(i, !lists.range(i).exists(j, g.layer_pages[g.layer_names[j]] == g.layer_pages[g.layer_names[i]])).map(i, g.layer_names[i]).map(l0, {'layers': g.layer_names.filter(l, g.layer_pages[l] == g.layer_pages[l0]), 'page_size_bytes': int(g.layer_pages[l0]), 'padded': ((int(g.layer_pages[l0]) + (has(g.layer_alignments) && l0 in g.layer_alignments ? int(g.layer_alignments[l0]) : (has(g.block_stride_alignment) && g.block_stride_alignment != null && g.block_stride_alignment > 0 ? int(g.block_stride_alignment) : 1)) - 1) / (has(g.layer_alignments) && l0 in g.layer_alignments ? int(g.layer_alignments[l0]) : (has(g.block_stride_alignment) && g.block_stride_alignment != null && g.block_stride_alignment > 0 ? int(g.block_stride_alignment) : 1))) * (has(g.layer_alignments) && l0 in g.layer_alignments ? int(g.layer_alignments[l0]) : (has(g.block_stride_alignment) && g.block_stride_alignment != null && g.block_stride_alignment > 0 ? int(g.block_stride_alignment) : 1))})).flatten()"
      - set:
          vars.tensors: "= vars.tensors.map(t, {'layers': t.layers, 'page_size_bytes': t.page_size_bytes, 'block_stride': vars.block_outer ? vars.bpb : t.padded, 'layer_stride': vars.block_outer ? t.page_size_bytes : vars.n * t.padded, 'size': vars.bpb * vars.n})"
      - return: {num_blocks: "= vars.n", kv_cache_tensors: "= vars.tensors", bytes_per_block: "= vars.bpb"}

  - component: simple-cpu-offload-worker
    name: register-kv-caches
    kind: function
    latency_ms: 0
    summary: "Register the GPU KV caches for offload: each placement becomes [num_blocks, block_bytes] regions, one per layer when the layout is layer-outermost, derived from the config's strides (so mixed page sizes in one group work)."
    sources: ["vllm/v1/simple_kv_offload/worker.py:81-160"]
    request:
      type: object
      required: [num_blocks, kv_cache_tensors, layer_names]
      properties:
        num_blocks: {type: integer, examples: [4]}
        kv_cache_tensors: {type: array, items: {type: object, properties: {layers: {type: array, items: {type: string}}, block_stride: {type: integer}, layer_stride: {type: integer}}}}
        layer_names: {type: array, items: {type: string}, description: "Layers present in kv_caches."}
    response: {type: object, properties: {regions: {type: object}, total_bytes_per_block: {type: integer}}}
    behavior:
      - if: "size(input.layer_names) == 0"
        then:
          - title: No KV caches to offload (warning)
            source: "vllm/v1/simple_kv_offload/worker.py:95-97"
            return: {regions: {}, total_bytes_per_block: 0}
      - set: {vars.regions: {}}
      - title: Each placement's regions are [num_blocks, block_stride] views
        source: "vllm/v1/simple_kv_offload/worker.py:110-153"
        foreach: "= input.kv_cache_tensors.filter(t, t.layers.exists(l, l in input.layer_names))"
        as: t
        steps:
          - if: "vars.t.layer_stride >= input.num_blocks * vars.t.block_stride"
            then:
              - title: Layer-outermost - one region per layer
                source: "vllm/v1/simple_kv_offload/worker.py:118-122"
                set: {vars.regions: "= merge(vars.regions, vars.t.layers.transformMapEntry(i, l, {l: [input.num_blocks, vars.t.block_stride]}))"}
            else:
              - title: Block-outermost - one region for the placement, named after its first layer
                source: "vllm/v1/simple_kv_offload/worker.py:123-126"
                set: {vars.regions: "= merge(vars.regions, {vars.t.layers[0]: [input.num_blocks, vars.t.block_stride]})"}
      - title: Bytes per block across all regions
        source: "vllm/v1/simple_kv_offload/worker.py:155-160"
        set:
          state.gpu_kv_caches: "= vars.regions"
          state.total_bytes_per_block: "= sum(vars.regions.transformList(k, v, v[1]))"
      - return: {regions: "= vars.regions", total_bytes_per_block: "= state.total_bytes_per_block"}

  # ============================================ round 4: offloading specs
  - component: offloading-spec-factory
    name: register-spec
    kind: function
    latency_ms: 0
    summary: "Register an offloading spec under a name (lazily imported); a name already taken is refused."
    sources: ["vllm/v1/kv_offload/factory.py:17-28"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [name, module_path, class_name], properties: {name: {type: string, examples: [MySpec]}, module_path: {type: string, examples: [my_pkg.spec]}, class_name: {type: string, examples: [MySpec]}}}
    response: {type: object, properties: {registered: {type: string}}}
    behavior:
      - if: "input.name in state.registry"
        then:
          - title: Already registered
            source: "vllm/v1/kv_offload/factory.py:20-21"
            fail: {code: value-error, status: 0, message: "= 'Connector \\'' + input.name + '\\' is already registered.'"}
      - title: Store a lazy loader for the class
        source: "vllm/v1/kv_offload/factory.py:23-28"
        set: {state.registry: "= merge(state.registry, {input.name: input.module_path})"}
      - return: {registered: "= input.name"}

  - component: offloading-spec-factory
    name: get-spec-cls
    kind: function
    latency_ms: 0
    summary: "Resolve kv_connector_extra_config.spec_name (default CPUOffloadingSpec): a registered name, or an out-of-tree class from spec_module_path."
    sources: ["vllm/v1/kv_offload/factory.py:30-52"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [extra_config], properties: {extra_config: {type: object, properties: {spec_name: {type: [string, "null"], default: null}, spec_module_path: {type: [string, "null"], default: null}}}}}
    response: {type: object, properties: {spec_cls: {type: string}, module_path: {type: string}, out_of_tree: {type: boolean}}}
    behavior:
      - set:
          vars.name: "= has(input.extra_config.spec_name) && input.extra_config.spec_name != null ? input.extra_config.spec_name : 'CPUOffloadingSpec'"
      - if: "vars.name in state.registry"
        then:
          - title: A registered spec
            source: "vllm/v1/kv_offload/factory.py:32-33"
            return: {spec_cls: "= vars.name", module_path: "= state.registry[vars.name]", out_of_tree: false}
      - if: "!has(input.extra_config.spec_module_path) || input.extra_config.spec_module_path == null"
        then:
          - title: Unknown spec and no module path
            source: "vllm/v1/kv_offload/factory.py:35-37"
            fail: {code: value-error, status: 0, message: "= 'Unsupported spec type: ' + vars.name"}
      - title: Out-of-tree spec, imported from spec_module_path (experimental, warned once)
        source: "vllm/v1/kv_offload/factory.py:38-50"
        return: {spec_cls: "= vars.name", module_path: "= input.extra_config.spec_module_path", out_of_tree: true}

  - component: offloading-spec-factory
    name: create-spec
    kind: function
    latency_ms: 0
    summary: "Build the configured offloading spec; the CPU spec sizes the CPU tier at construction."
    sources: ["vllm/v1/kv_offload/factory.py:54-58"]
    request:
      type: object
      required: [extra_config]
      properties:
        extra_config: {type: object, properties: {spec_name: {type: [string, "null"], default: null}, spec_module_path: {type: [string, "null"], default: null}, cpu_bytes_to_use: {type: [integer, "null"], default: null}}}
        worker_kv_bytes_per_block: {type: integer, default: 0}
        blocks_per_chunk: {type: integer, default: 1}
        world_size: {type: integer, default: 1}
        replicated_layout: {type: boolean, default: false}
    response: {type: object, properties: {spec_cls: {type: string}, num_chunks: {type: [integer, "null"]}}}
    behavior:
      - call: offloading-spec-factory.get-spec-cls
        input: {extra_config: "= input.extra_config"}
        as: cls
      - if: "vars.cls.value.spec_cls == 'CPUOffloadingSpec'"
        then:
          - title: spec_cls(config)
            source: "vllm/v1/kv_offload/factory.py:56-58"
            call: cpu-offloading-spec.init
            input:
              cpu_bytes_to_use: "= has(input.extra_config.cpu_bytes_to_use) ? input.extra_config.cpu_bytes_to_use : dyn(null)"
              worker_kv_bytes_per_block: "= has(input.worker_kv_bytes_per_block) ? input.worker_kv_bytes_per_block : 0"
              blocks_per_chunk: "= has(input.blocks_per_chunk) ? input.blocks_per_chunk : 1"
              world_size: "= has(input.world_size) ? input.world_size : 1"
              replicated_layout: "= has(input.replicated_layout) && input.replicated_layout"
            as: spec
          - return: {spec_cls: CPUOffloadingSpec, num_chunks: "= vars.spec.value.num_chunks"}
      - title: Other specs (tiering, out-of-tree) are constructed by their own class; their sizing is not modeled here
        source: "vllm/v1/kv_offload/factory.py:56-58"
        return: {spec_cls: "= vars.cls.value.spec_cls", num_chunks: null}

  - component: cpu-offloading-spec
    name: init
    kind: function
    latency_ms: 0
    summary: "Size the CPU tier: per-worker page = worker bytes/block x blocks/chunk; the chunk row is that times the copies, rounded up to the mmap page; num_chunks = cpu_bytes_to_use // row."
    sources: ["vllm/v1/kv_offload/cpu/spec.py:93-138", "vllm/v1/kv_offload/cpu/shared_offload_region.py:87", "vllm/v1/kv_offload/config.py:29-62", "vllm/v1/kv_offload/config.py:21-26", "vllm/v1/kv_offload/config.py:65-90"]
    errors: [{code: exception, status: 0, retryable: false}]
    request:
      type: object
      properties:
        cpu_bytes_to_use: {type: [integer, "null"], default: null, examples: [12288]}
        worker_kv_bytes_per_block: {type: integer, default: 0, examples: [16]}
        blocks_per_chunk: {type: integer, default: 1, examples: [2]}
        world_size: {type: integer, default: 1, examples: [6]}
        replicated_layout: {type: boolean, default: false}
        platform: {type: string, default: cuda, enum: [cuda, rocm, xpu, cpu]}
        mmap_page_size: {type: integer, default: 4096, description: "mmap.PAGESIZE, the SharedOffloadRegion BLOCK_SIZE_ALIGNMENT."}
        eviction_policy: {type: string, default: lru}
    response: {type: object, properties: {num_chunks: {type: integer}, kv_bytes_per_chunk: {type: integer}, cpu_page_size_per_worker: {type: integer}, replicated_layout: {type: boolean}}}
    behavior:
      - if: "!has(input.cpu_bytes_to_use) || input.cpu_bytes_to_use == null || input.cpu_bytes_to_use == 0"
        then:
          - title: cpu_bytes_to_use is required
            source: "vllm/v1/kv_offload/cpu/spec.py:96-100"
            fail: {code: exception, status: 0, message: "cpu_bytes_to_use must be specified in kv_connector_extra_config"}
      - set:
          vars.wb: "= has(input.worker_kv_bytes_per_block) ? input.worker_kv_bytes_per_block : 0"
          vars.ws: "= has(input.world_size) ? input.world_size : 1"
          vars.bpc: "= has(input.blocks_per_chunk) ? input.blocks_per_chunk : 1"
          vars.align: "= has(input.mmap_page_size) ? input.mmap_page_size : 4096"
          vars.platform: "= has(input.platform) ? input.platform : 'cuda'"
      - title: Replicated (single-copy) layout only on the shared mmap region (CUDA but not ROCm, or XPU)
        source: "vllm/v1/kv_offload/cpu/spec.py:106"
        set:
          vars.repl: "= has(input.replicated_layout) && input.replicated_layout && (vars.platform == 'cuda' || vars.platform == 'xpu')"
          vars.num_chunks: 0
          vars.chunk: 0
          vars.page: 0
      - if: "vars.wb > 0 && vars.ws > 0"
        then:
          - title: Size the chunk row and count the chunks
            detail: "kv_bytes_per_chunk keeps the page-aligned (possibly padded) row; cpu_page_size_per_worker is the unpadded per-worker slot."
            source: "vllm/v1/kv_offload/cpu/spec.py:107-125"
            set:
              vars.copies: "= vars.repl ? 1 : vars.ws"
          - set:
              vars.raw: "= vars.wb * vars.copies * vars.bpc"
          - set:
              vars.page: "= vars.raw / vars.copies"
              vars.chunk: "= (vars.raw + vars.align - 1) / vars.align * vars.align"
          - set:
              vars.num_chunks: "= input.cpu_bytes_to_use / vars.chunk"
      - set:
          state.num_chunks: "= vars.num_chunks"
          state.kv_bytes_per_chunk: "= vars.chunk"
          state.cpu_page_size_per_worker: "= vars.page"
          state.replicated_layout: "= vars.repl"
          state.eviction_policy: "= has(input.eviction_policy) ? input.eviction_policy : 'lru'"
      - return: {num_chunks: "= vars.num_chunks", kv_bytes_per_chunk: "= vars.chunk", cpu_page_size_per_worker: "= vars.page", replicated_layout: "= vars.repl"}

  - component: cpu-offloading-spec
    name: get-manager
    kind: function
    latency_ms: 0
    summary: "The scheduler-side CPUOffloadingManager over the sized chunk pool (built once)."
    sources: ["vllm/v1/kv_offload/cpu/spec.py:140-159"]
    request: {type: object, properties: {enable_kv_cache_events: {type: boolean, default: false}}}
    response: {type: object, properties: {num_chunks: {type: integer}}}
    behavior:
      - title: CPUOffloadingManager(num_chunks, eviction policy, events)
        source: "vllm/v1/kv_offload/cpu/spec.py:150-158"
        call: cpu-offloading-manager.init
        input: {num_chunks: "= state.num_chunks", enable_events: "= has(input.enable_kv_cache_events) && input.enable_kv_cache_events"}
      - return: {num_chunks: "= state.num_chunks"}

  - component: cpu-offloading-spec
    name: create-worker
    kind: function
    latency_ms: 0
    summary: "Worker side: map the shared CPU region (rank-indexed slot, or slot 0 for the replicated layout) with the spec's sizes; a zero-chunk spec keeps the tensor path."
    sources: ["vllm/v1/kv_offload/cpu/spec.py:161-195"]
    request: {type: object, properties: {rank: {type: integer, default: 0}, platform: {type: string, default: cuda, enum: [cuda, rocm, xpu, cpu]}}}
    response: {type: object, properties: {shared_region: {type: boolean}}}
    behavior:
      - set: {vars.platform: "= has(input.platform) ? input.platform : 'cuda'"}
      - if: "(vars.platform == 'cuda' || vars.platform == 'xpu') && state.num_chunks > 0"
        then:
          - title: SharedOffloadRegion with the spec's row size and per-worker page
            source: "vllm/v1/kv_offload/cpu/spec.py:172-184"
            call: shared-offload-region.init
            input:
              num_chunks: "= state.num_chunks"
              rank: "= state.replicated_layout ? 0 : (has(input.rank) ? input.rank : 0)"
              kv_bytes_per_chunk: "= state.kv_bytes_per_chunk"
              cpu_page_size: "= state.cpu_page_size_per_worker"
          - return: {shared_region: true}
      - title: No shared region (zero chunks or another platform) - plain tensors
        source: "vllm/v1/kv_offload/cpu/spec.py:169-171"
        return: {shared_region: false}

  # ============================================ round 4: CPU offloading manager
  - component: cpu-offloading-manager
    name: init
    kind: function
    latency_ms: 0
    summary: "An empty CPU tier of num_chunks chunk slots with the LRU policy."
    sources: ["vllm/v1/kv_offload/cpu/manager.py:58-92"]
    request: {type: object, required: [num_chunks], properties: {num_chunks: {type: integer, examples: [5]}, enable_events: {type: boolean, default: false}}}
    response: {type: object, properties: {num_chunks: {type: integer}}}
    behavior:
      - title: Empty chunk pool and policy
        source: "vllm/v1/kv_offload/cpu/manager.py:67-80"
        set:
          state.num_chunks: "= input.num_chunks"
          state.num_allocated: 0
          state.free_list: []
          state.chunks: {}
          state.lru: []
          state.num_write_pending: 0
          state.req_access: {}
          state.events: []
          state.enable_events: "= has(input.enable_events) && input.enable_events"
      - return: {num_chunks: "= input.num_chunks"}

  - component: cpu-offloading-manager
    name: on-new-request
    kind: function
    latency_ms: 0
    summary: "A request the scheduler sees for the first time: start its access record (ReqContext state); the CPU tier offloads chunk by chunk."
    sources: ["vllm/v1/kv_offload/base.py:349-360", "vllm/v1/kv_offload/base.py:89-117", "vllm/v1/kv_offload/cpu/manager.py:184-187"]
    request: {type: object, required: [req_id], properties: {req_id: {type: string, examples: [chatcmpl-abc123]}, kv_transfer_params: {type: [object, "null"], default: null}}}
    response: {type: object, properties: {policy: {type: string, enum: [chunk_level, request_level]}}}
    behavior:
      - if: "!(input.req_id in state.req_access)"
        then:
          - title: _get_request_cache_access creates the request's record for this cache generation
            source: "vllm/v1/kv_offload/cpu/manager.py:144-155"
            set: {state.req_access: "= merge(state.req_access, {input.req_id: {'seen': [], 'inserted': [], 'reused': [], 'finished': false}})"}
      - return: {policy: chunk_level}

  - component: cpu-offloading-manager
    name: lookup
    kind: function
    latency_ms: 0
    summary: "Is one chunk offloaded and readable? MISS if unknown, HIT_PENDING while its write is in flight, else HIT."
    sources: ["vllm/v1/kv_offload/base.py:236-250", "vllm/v1/kv_offload/base.py:120-126", "vllm/v1/kv_offload/cpu/manager.py:189-196"]
    request: {type: object, required: [key], properties: {key: {type: string, examples: [blk-0]}, req_id: {type: string, examples: [chatcmpl-abc123]}}}
    response: {type: object, properties: {result: {type: string, enum: [MISS, HIT, HIT_PENDING, RETRY]}}}
    behavior:
      - if: "!(input.key in state.chunks)"
        then:
          - title: Not in the CPU tier
            source: "vllm/v1/kv_offload/cpu/manager.py:191-192"
            return: {result: MISS}
      - if: "state.chunks[input.key].ref_cnt < 0"
        then:
          - title: Being written (ref_cnt -1, not ready)
            source: "vllm/v1/kv_offload/cpu/manager.py:193-194"
            return: {result: HIT_PENDING}
      - return: {result: HIT}

  - component: cpu-offloading-manager
    name: prepare-store
    kind: function
    latency_ms: 0
    summary: "Reserve chunks for the keys not yet stored: fresh chunks first, then freed ones; evict ready, unpinned LRU chunks (never the offered keys) when short; refuse (null) when eviction cannot free enough."
    sources: ["vllm/v1/kv_offload/base.py:308-328", "vllm/v1/kv_offload/cpu/manager.py:251-363", "vllm/v1/kv_offload/cpu/manager.py:97-114", "vllm/v1/kv_offload/cpu/policies/lru.py:114-160"]
    request:
      type: object
      required: [keys, req_id]
      properties:
        keys: {type: array, items: {type: string}, examples: [[blk-0, blk-1]]}
        req_id: {type: string, examples: [chatcmpl-abc123]}
    response: {type: [object, "null"], properties: {keys_to_store: {type: array, items: {type: string}}, chunk_ids: {type: array, items: {type: integer}}, evicted_keys: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.to_store: "= input.keys.filter(k, !(k in state.chunks))"
          vars.ready: "= input.keys.filter(k, k in state.chunks && state.chunks[k].ref_cnt >= 0)"
          vars.acc: "= input.req_id in state.req_access ? state.req_access[input.req_id] : {'seen': [], 'inserted': [], 'reused': [], 'finished': false}"
      - title: Record the request's access to the offered keys before any early return
        source: "vllm/v1/kv_offload/cpu/manager.py:298-306"
        set:
          state.req_access: "= merge(state.req_access, {input.req_id: {'seen': vars.acc.seen + input.keys.filter(k, (k in vars.to_store || k in vars.ready) && !(k in vars.acc.seen)), 'inserted': vars.acc.inserted, 'reused': vars.acc.reused + vars.ready.filter(k, !(k in vars.acc.inserted) && !(k in vars.acc.reused)), 'finished': vars.acc.finished}})"
      - if: "size(vars.to_store) == 0"
        then:
          - title: Everything is already stored
            source: "vllm/v1/kv_offload/cpu/manager.py:308-313"
            return: {keys_to_store: [], chunk_ids: [], evicted_keys: []}
      - set:
          vars.free: "= size(state.free_list) + state.num_chunks - state.num_allocated"
          vars.evictable: "= state.lru.filter(k, state.chunks[k].ref_cnt == 0)"
          vars.evicted: []
      - set:
          vars.n_evict: "= size(vars.to_store) - vars.free"
      - if: "vars.n_evict > 0"
        then:
          - if: "vars.n_evict > size(vars.evictable)"
            then:
              - title: Not enough idle chunks to evict; the store is refused
                source: "vllm/v1/kv_offload/cpu/manager.py:319-322"
                return: null
          - set:
              vars.candidates: "= vars.evictable.filter(k, !(k in input.keys))"
          - if: "size(vars.candidates) < vars.n_evict"
            then:
              - title: The idle chunks left are the offered keys themselves (protected); refused
                source: "vllm/v1/kv_offload/cpu/manager.py:326-331"
                return: null
          - title: Evict the least recently used idle chunks and free their slots
            source: "vllm/v1/kv_offload/cpu/manager.py:333-339"
            set:
              vars.evicted: "= vars.candidates.slice(0, vars.n_evict)"
          - set:
              state.free_list: "= state.free_list + vars.evicted.map(k, state.chunks[k].chunk_id)"
              state.chunks: "= state.chunks.transformMap(k, v, !(k in vars.evicted), v)"
              state.lru: "= state.lru.filter(k, !(k in vars.evicted))"
          - if: "state.enable_events"
            then:
              - title: Emit a removal event for the evicted keys
                source: "vllm/v1/kv_offload/cpu/manager.py:341-348"
                set: {state.events: "= state.events + [{'keys': vars.evicted, 'medium': 'CPU', 'removed': true}]"}
      - title: Allocate fresh chunk ids first, then reuse freed ones (last freed first)
        source: "vllm/v1/kv_offload/cpu/manager.py:97-111"
        set:
          vars.n_fresh: "= math.least(size(vars.to_store), state.num_chunks - state.num_allocated)"
      - set:
          vars.ids: "= lists.range(vars.n_fresh).map(i, state.num_allocated + i) + lists.range(size(vars.to_store) - vars.n_fresh).map(i, state.free_list[size(state.free_list) - 1 - i])"
      - title: Insert the chunks as not ready (ref_cnt -1) and newest in LRU order
        source: "vllm/v1/kv_offload/cpu/manager.py:350-356"
        set:
          state.free_list: "= state.free_list.slice(0, size(state.free_list) - (size(vars.to_store) - vars.n_fresh))"
          state.num_allocated: "= state.num_allocated + vars.n_fresh"
          state.chunks: "= merge(state.chunks, lists.range(size(vars.to_store)).transformMapEntry(i, j, {vars.to_store[j]: {'chunk_id': vars.ids[j], 'ref_cnt': -1}}))"
          state.lru: "= state.lru + vars.to_store"
          state.num_write_pending: "= state.num_write_pending + size(vars.to_store)"
          state.req_access: "= merge(state.req_access, {input.req_id: {'inserted': state.req_access[input.req_id].inserted + vars.to_store}})"
      - return: {keys_to_store: "= vars.to_store", chunk_ids: "= vars.ids", evicted_keys: "= vars.evicted"}

  - component: cpu-offloading-manager
    name: complete-store
    kind: function
    latency_ms: 0
    summary: "A GPU->CPU write finished: the written chunks become ready and evictable; on failure they are dropped and their slots freed."
    sources: ["vllm/v1/kv_offload/base.py:330-348", "vllm/v1/kv_offload/cpu/manager.py:365-398"]
    request:
      type: object
      required: [keys]
      properties:
        keys: {type: array, items: {type: string}, examples: [[blk-0]]}
        req_id: {type: string, examples: [chatcmpl-abc123]}
        success: {type: boolean, default: true}
    response: {type: object, properties: {stored: {type: array, items: {type: string}}, removed: {type: array, items: {type: string}}}}
    behavior:
      - set:
          vars.pending: "= input.keys.filter(k, k in state.chunks && state.chunks[k].ref_cnt < 0)"
      - if: "!has(input.success) || input.success"
        then:
          - title: Mark them ready (ref_cnt 0) and evictable
            source: "vllm/v1/kv_offload/cpu/manager.py:373-381"
            set:
              state.chunks: "= merge(state.chunks, vars.pending.transformMapEntry(i, k, {k: {'ref_cnt': 0}}))"
              state.num_write_pending: "= state.num_write_pending - size(vars.pending)"
          - if: "state.enable_events && size(vars.pending) > 0"
            then:
              - title: Emit a stored event
                source: "vllm/v1/kv_offload/cpu/manager.py:390-397"
                set: {state.events: "= state.events + [{'keys': vars.pending, 'medium': 'CPU', 'removed': false}]"}
          - return: {stored: "= vars.pending", removed: []}
      - title: Failed write - drop the chunks and return their slots
        source: "vllm/v1/kv_offload/cpu/manager.py:382-388"
        set:
          state.free_list: "= state.free_list + vars.pending.map(k, state.chunks[k].chunk_id)"
          state.chunks: "= state.chunks.transformMap(k, v, !(k in vars.pending), v)"
          state.lru: "= state.lru.filter(k, !(k in vars.pending))"
          state.num_write_pending: "= state.num_write_pending - size(vars.pending)"
      - return: {stored: [], removed: "= vars.pending"}

  - component: cpu-offloading-manager
    name: prepare-load
    kind: function
    latency_ms: 0
    summary: "Pin ready chunks for reading (ref_cnt + 1, no longer evictable) and return their chunk ids; prepare_read does the same for a tier cascade without counting a request access."
    sources: ["vllm/v1/kv_offload/base.py:265-284", "vllm/v1/kv_offload/cpu/manager.py:204-232", "vllm/v1/kv_offload/tiering/manager.py:119-127"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      required: [keys]
      properties:
        keys: {type: array, items: {type: string}, examples: [[blk-0]]}
        req_id: {type: string, examples: [chatcmpl-abc123]}
        record_access: {type: boolean, default: true}
    response: {type: object, properties: {chunk_ids: {type: array, items: {type: integer}}}}
    behavior:
      - if: "input.keys.exists(k, !(k in state.chunks))"
        then:
          - title: Loading a chunk that is not offloaded
            source: "vllm/v1/kv_offload/cpu/manager.py:220"
            fail: {code: assertion-error, status: 0, message: "= 'Chunk ' + input.keys.filter(k, !(k in state.chunks))[0] + ' not found in cache'"}
      - if: "input.keys.exists(k, state.chunks[k].ref_cnt < 0)"
        then:
          - title: Loading a chunk whose write has not completed
            source: "vllm/v1/kv_offload/cpu/manager.py:221"
            fail: {code: assertion-error, status: 0, message: "= 'Chunk ' + input.keys.filter(k, state.chunks[k].ref_cnt < 0)[0] + ' is not ready for reading'"}
      - title: Pin each chunk
        source: "vllm/v1/kv_offload/cpu/manager.py:222-227"
        set:
          state.chunks: "= merge(state.chunks, input.keys.transformMapEntry(i, k, {k: {'ref_cnt': state.chunks[k].ref_cnt + 1}}))"
      - if: "(!has(input.record_access) || input.record_access) && has(input.req_id) && input.req_id in state.req_access"
        then:
          - title: Count a request reuse of these chunks
            source: "vllm/v1/kv_offload/cpu/manager.py:229-230"
            set: {state.req_access: "= merge(state.req_access, {input.req_id: {'seen': state.req_access[input.req_id].seen + input.keys.filter(k, !(k in state.req_access[input.req_id].seen)), 'reused': state.req_access[input.req_id].reused + input.keys.filter(k, !(k in state.req_access[input.req_id].inserted) && !(k in state.req_access[input.req_id].reused))}})"}
      - return: {chunk_ids: "= input.keys.map(k, state.chunks[k].chunk_id)"}

  - component: cpu-offloading-manager
    name: complete-load
    kind: function
    latency_ms: 0
    summary: "A read finished: unpin (ref_cnt - 1); a chunk back at 0 is evictable again."
    sources: ["vllm/v1/kv_offload/base.py:297-306", "vllm/v1/kv_offload/cpu/manager.py:238-249"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, required: [keys], properties: {keys: {type: array, items: {type: string}, examples: [[blk-0]]}, req_id: {type: string, examples: [chatcmpl-abc123]}}}
    response: {type: object, properties: {evictable: {type: array, items: {type: string}}}}
    behavior:
      - if: "input.keys.exists(k, !(k in state.chunks) || state.chunks[k].ref_cnt <= 0)"
        then:
          - title: Unpinning a chunk that is unknown or not pinned
            source: "vllm/v1/kv_offload/cpu/manager.py:243-244"
            fail: {code: assertion-error, status: 0, message: "chunk ref_cnt is already 0"}
      - title: Unpin each chunk
        source: "vllm/v1/kv_offload/cpu/manager.py:245-249"
        set:
          state.chunks: "= merge(state.chunks, input.keys.transformMapEntry(i, k, {k: {'ref_cnt': state.chunks[k].ref_cnt - 1}}))"
      - return: {evictable: "= input.keys.filter(k, state.chunks[k].ref_cnt == 0)"}

  - component: cpu-offloading-manager
    name: touch
    kind: function
    latency_ms: 0
    summary: "Mark keys recently used: the first key becomes the most recent, so the last is evicted first among them."
    sources: ["vllm/v1/kv_offload/base.py:286-295", "vllm/v1/kv_offload/cpu/manager.py:234-236", "vllm/v1/kv_offload/cpu/policies/lru.py:60-71"]
    request: {type: object, required: [keys], properties: {keys: {type: array, items: {type: string}, examples: [[blk-0, blk-1]]}, req_id: {type: string, examples: [chatcmpl-abc123]}}}
    response: {type: object, properties: {lru: {type: array, items: {type: string}}}}
    behavior:
      - title: New ranks in reversed key order (unknown keys are ignored)
        source: "vllm/v1/kv_offload/cpu/policies/lru.py:92-94"
        set:
          vars.known: "= input.keys.filter(k, k in state.chunks)"
      - set:
          state.lru: "= state.lru.filter(k, !(k in vars.known)) + vars.known.reverse()"
      - return: {lru: "= state.lru"}

  - component: cpu-offloading-manager
    name: on-request-finished
    kind: function
    latency_ms: 0
    summary: "A request finished: once, the policy refreshes the recency of every chunk the request saw (prefix order, so its first chunk is the most recent)."
    sources: ["vllm/v1/kv_offload/base.py:362-380", "vllm/v1/kv_offload/cpu/manager.py:400-427", "vllm/v1/kv_offload/cpu/policies/lru.py:96-105"]
    request: {type: object, required: [req_id], properties: {req_id: {type: string, examples: [chatcmpl-abc123]}}}
    response: {type: object, properties: {finalized: {type: boolean}}}
    behavior:
      - if: "!(input.req_id in state.req_access) || state.req_access[input.req_id].finished"
        then:
          - title: No record for this cache generation, or already finished
            source: "vllm/v1/kv_offload/cpu/manager.py:402-409"
            return: {finalized: false}
      - set:
          vars.keys: "= state.req_access[input.req_id].seen.filter(k, k in state.chunks)"
      - title: Mark finished and refresh the request's keys in reversed prefix order
        source: "vllm/v1/kv_offload/cpu/manager.py:410-427"
        set:
          state.req_access: "= merge(state.req_access, {input.req_id: {'finished': true}})"
          state.lru: "= state.lru.filter(k, !(k in vars.keys)) + vars.keys.reverse()"
      - return: {finalized: true}

  - component: cpu-offloading-manager
    name: reset-cache
    kind: function
    latency_ms: 0
    summary: "Forget every chunk unconditionally and start a new cache generation (stale completions are filtered by the scheduler)."
    sources: ["vllm/v1/kv_offload/cpu/manager.py:429-442"]
    request: {type: object}
    response: {type: object, properties: {cache_generation: {type: integer}}}
    behavior:
      - title: Clear the policy and the chunk pool
        source: "vllm/v1/kv_offload/cpu/manager.py:436-442"
        set:
          state.chunks: {}
          state.lru: []
          state.free_list: []
          state.num_allocated: 0
          state.num_write_pending: 0
          state.req_access: {}
          state.cache_generation: "= state.cache_generation + 1"
      - return: {cache_generation: "= state.cache_generation"}

  - component: cpu-offloading-manager
    name: get-stats
    kind: function
    latency_ms: 0
    summary: "Chunk pool usage: allocated, free, write-pending and evictable chunks."
    sources: ["vllm/v1/kv_offload/cpu/manager.py:94-95", "vllm/v1/kv_offload/base.py:415-417"]
    request: {type: object}
    response: {type: object, properties: {num_free_chunks: {type: integer}, num_stored: {type: integer}, num_write_pending: {type: integer}, num_evictable: {type: integer}, lru: {type: array, items: {type: string}}}}
    behavior:
      - return:
          num_free_chunks: "= size(state.free_list) + state.num_chunks - state.num_allocated"
          num_stored: "= size(state.chunks)"
          num_write_pending: "= state.num_write_pending"
          num_evictable: "= size(state.lru.filter(k, state.chunks[k].ref_cnt == 0))"
          lru: "= state.lru"

  - component: cpu-offloading-manager
    name: take-events
    kind: function
    latency_ms: 0
    summary: "Take the offloading events (stored / removed keys on medium CPU) collected since the last call; none unless events are enabled."
    sources: ["vllm/v1/kv_offload/base.py:382-393", "vllm/v1/kv_offload/cpu/manager.py:444-447", "vllm/v1/kv_offload/base.py:47-51", "vllm/v1/kv_offload/base.py:164-173"]
    request: {type: object}
    response: {type: object, properties: {events: {type: array}}}
    behavior:
      - title: Yield and clear the events
        source: "vllm/v1/kv_offload/cpu/manager.py:444-447"
        set:
          vars.ev: "= state.events"
          state.events: []
      - return: {events: "= vars.ev"}

  # ============================================ round 4: CPU offloading worker
  - component: cpu-offloading-worker
    name: submit-store
    kind: function
    latency_ms: 0
    summary: "Queue an async GPU->CPU copy of the given GPU blocks into CPU chunks on a CUDA stream; completion is reported by get-finished."
    sources: ["vllm/v1/kv_offload/base.py:574-578", "vllm/v1/kv_offload/cpu/gpu_worker.py:854-858", "vllm/v1/kv_offload/cpu/gpu_worker.py:534-704"]
    request:
      type: object
      required: [job_id, src_block_ids, dst_chunk_ids]
      properties:
        job_id: {type: integer, examples: [1]}
        src_block_ids: {type: array, items: {type: integer}, examples: [[3, 4]]}
        dst_chunk_ids: {type: array, items: {type: integer}, examples: [[0]]}
        bytes_per_block: {type: integer, default: 2097152}
    response: {type: object, properties: {submitted: {type: boolean}}}
    behavior:
      - title: transfer_async appends the transfer to the in-order queue
        source: "vllm/v1/kv_offload/cpu/gpu_worker.py:690-704"
        set:
          state.transfers: "= state.transfers + [{'job_id': input.job_id, 'direction': 'store', 'num_bytes': size(input.src_block_ids) * (has(input.bytes_per_block) ? input.bytes_per_block : 2097152)}]"
      - return: {submitted: true}

  - component: cpu-offloading-worker
    name: submit-load
    kind: function
    latency_ms: 0
    summary: "Queue an async CPU->GPU copy of CPU chunks into GPU blocks."
    sources: ["vllm/v1/kv_offload/base.py:580-584", "vllm/v1/kv_offload/cpu/gpu_worker.py:860-864"]
    request:
      type: object
      required: [job_id, src_chunk_ids, dst_block_ids]
      properties:
        job_id: {type: integer, examples: [2]}
        src_chunk_ids: {type: array, items: {type: integer}, examples: [[0]]}
        dst_block_ids: {type: array, items: {type: integer}, examples: [[7, 8]]}
        bytes_per_block: {type: integer, default: 2097152}
    response: {type: object, properties: {submitted: {type: boolean}}}
    behavior:
      - title: The load handler's transfer_async
        source: "vllm/v1/kv_offload/cpu/gpu_worker.py:860-864"
        set:
          state.transfers: "= state.transfers + [{'job_id': input.job_id, 'direction': 'load', 'num_bytes': size(input.dst_block_ids) * (has(input.bytes_per_block) ? input.bytes_per_block : 2097152)}]"
      - return: {submitted: true}

  - component: cpu-offloading-worker
    name: get-finished
    kind: function
    latency_ms: 0
    summary: "Report the transfers whose end event has fired, in submission order (each with its size); here every queued copy has finished by the next poll."
    sources: ["vllm/v1/kv_offload/base.py:586", "vllm/v1/kv_offload/cpu/gpu_worker.py:706-728", "vllm/v1/kv_offload/cpu/gpu_worker.py:866-867"]
    request: {type: object}
    response: {type: object, properties: {results: {type: array}}}
    behavior:
      - title: Pop finished transfers from the head of the queue
        source: "vllm/v1/kv_offload/cpu/gpu_worker.py:708-728"
        set:
          vars.results: "= state.transfers.map(t, {'job_id': t.job_id, 'success': true, 'transfer_size': t.num_bytes})"
          state.transfers: []
      - return: {results: "= vars.results"}

  # ============================================ round 4: secondary tiers
  - component: secondary-tier-factory
    name: register-tier
    kind: function
    latency_ms: 0
    summary: "Register a secondary-tier type with a lazily imported class; a type already registered is refused."
    sources: ["vllm/v1/kv_offload/tiering/factory.py:50-59", "vllm/v1/kv_offload/tiering/factory.py:146-174"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [tier_type, module_path, class_name], properties: {tier_type: {type: string, examples: [custom_tier]}, module_path: {type: string, examples: [vllm.v1.kv_offload.tiering.example.manager]}, class_name: {type: string, examples: [ExampleSecondaryTierManager]}}}
    response: {type: object, properties: {registered: {type: string}}}
    behavior:
      - if: "input.tier_type in state.registry"
        then:
          - title: Already registered
            source: "vllm/v1/kv_offload/tiering/factory.py:52-53"
            fail: {code: value-error, status: 0, message: "= 'Tier \\'' + input.tier_type + '\\' is already registered.'"}
      - title: Store the loader
        source: "vllm/v1/kv_offload/tiering/factory.py:55-59"
        set: {state.registry: "= merge(state.registry, {input.tier_type: {'module_path': input.module_path, 'class_name': input.class_name}})"}
      - return: {registered: "= input.tier_type"}

  - component: secondary-tier-factory
    name: get-tier-class
    kind: function
    latency_ms: 0
    summary: "Resolve tier_config.type: a registered type, else an out-of-tree class named by type in module_path."
    sources: ["vllm/v1/kv_offload/tiering/factory.py:99-143"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request: {type: object, required: [tier_config], properties: {tier_config: {type: object, properties: {type: {type: [string, "null"], default: null}, module_path: {type: [string, "null"], default: null}}}}}
    response: {type: object, properties: {class_name: {type: string}, module_path: {type: string}}}
    behavior:
      - set: {vars.t: "= has(input.tier_config.type) && input.tier_config.type != null ? input.tier_config.type : ''"}
      - if: "vars.t == ''"
        then:
          - title: type is required
            source: "vllm/v1/kv_offload/tiering/factory.py:119-121"
            fail: {code: value-error, status: 0, message: "Secondary tier configuration must include 'type'"}
      - if: "vars.t in state.registry"
        then:
          - title: A registered tier type
            source: "vllm/v1/kv_offload/tiering/factory.py:122-123"
            return: {class_name: "= state.registry[vars.t].class_name", module_path: "= state.registry[vars.t].module_path"}
      - if: "!has(input.tier_config.module_path) || input.tier_config.module_path == null"
        then:
          - title: Unknown type and no module_path
            source: "vllm/v1/kv_offload/tiering/factory.py:124-130"
            fail: {code: value-error, status: 0, message: "= 'Unknown secondary tier type: \\'' + vars.t + '\\'. Supported types: ' + state.registry.transformList(k, v, k).join(', ') + '. For an out-of-tree tier, also set \\'module_path\\'.'"}
      - title: Out-of-tree - the class named by type, from module_path
        source: "vllm/v1/kv_offload/tiering/factory.py:131-143"
        return: {class_name: "= vars.t", module_path: "= input.tier_config.module_path"}

  - component: secondary-tier-factory
    name: create-secondary-tier
    kind: function
    latency_ms: 0
    summary: "Instantiate a tier from its config: type and module_path are consumed, the rest become constructor arguments; tier_type is the configured type."
    sources: ["vllm/v1/kv_offload/tiering/factory.py:61-97"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [tier_config, tier_id]
      properties:
        tier_config: {type: object, properties: {type: {type: [string, "null"], default: null}, module_path: {type: [string, "null"], default: null}, custom_param: {type: integer, default: 0}, backpressure: {type: [object, "null"], default: null}}}
        tier_id: {type: string, examples: [tier0], description: "Which tier instance this is (the TieringOffloadingManager's index)."}
        primary_row_stride: {type: integer, default: 16, description: "primary_kv_view.strides[0], the primary chunk size in bytes."}
    response: {type: object, properties: {tier_id: {type: string}, tier_type: {type: string}, class_name: {type: string}}}
    behavior:
      - call: secondary-tier-factory.get-tier-class
        input: {tier_config: "= input.tier_config"}
        as: cls
      - set:
          vars.has_bp: "= has(input.tier_config.backpressure) && input.tier_config.backpressure != null"
          vars.bp: "= has(input.tier_config.backpressure) && input.tier_config.backpressure != null ? input.tier_config.backpressure : {}"
      - if: "vars.has_bp && (!('backpressure_cls' in vars.bp) || vars.bp.backpressure_cls == null)"
        then:
          - title: A backpressure config needs its detector class
            source: "vllm/v1/kv_offload/tiering/factory.py:76-82"
            fail: {code: value-error, status: 0, message: "backpressure config must include 'backpressure_cls' (e.g. 'EMABackpressureDetector')"}
      - if: "vars.cls.value.class_name == 'ExampleSecondaryTierManager'"
        then:
          - title: tier_cls(offloading_spec, primary_kv_view, tier_type, **config)
            source: "vllm/v1/kv_offload/tiering/factory.py:91-97"
            call: example-secondary-tier-manager.init
            input:
              tier_id: "= input.tier_id"
              tier_type: "= input.tier_config.type"
              custom_param: "= has(input.tier_config.custom_param) ? input.tier_config.custom_param : 0"
              primary_row_stride: "= has(input.primary_row_stride) ? input.primary_row_stride : 16"
      - if: "vars.cls.value.class_name == 'P2PSecondaryTierManager'"
        then:
          - title: tier_cls(offloading_spec, primary_kv_view, tier_type, **config)
            source: "vllm/v1/kv_offload/tiering/factory.py:91-97"
            call: p2p-secondary-tier-manager.init
            input:
              tier_id: "= input.tier_id"
              tier_type: "= input.tier_config.type"
              backpressure_detector: "= vars.has_bp ? vars.bp.backpressure_cls : dyn(null)"
      - title: Other tier classes (fs, obj, kvcr) are resolved but their managers are not modeled
        source: "vllm/v1/kv_offload/tiering/factory.py:68-71"
        return: {tier_id: "= input.tier_id", tier_type: "= input.tier_config.type", class_name: "= vars.cls.value.class_name"}

  - component: example-secondary-tier-manager
    name: init
    kind: function
    latency_ms: 0
    summary: "Create an in-memory tier: no chunks, no completed jobs; its block size is the primary view's row stride."
    sources: ["vllm/v1/kv_offload/tiering/example/manager.py:47-82", "vllm/v1/kv_offload/tiering/base.py:157-189"]
    request:
      type: object
      required: [tier_id, tier_type]
      properties:
        tier_id: {type: string, examples: [tier0]}
        tier_type: {type: string, examples: [example]}
        custom_param: {type: integer, default: 0}
        primary_row_stride: {type: integer, default: 16}
    response: {type: object, properties: {tier_type: {type: string}, block_size_bytes: {type: integer}, cache_hit_source: {type: string}}}
    behavior:
      - title: SecondaryTierManager.__init__ keeps tier_type and the primary row stride; the example tier starts empty
        source: "vllm/v1/kv_offload/tiering/example/manager.py:65-82"
        set:
          state.tiers: "= merge(state.tiers, {input.tier_id: {'tier_type': input.tier_type, 'chunks': [], 'completed_jobs': [], 'block_size_bytes': has(input.primary_row_stride) ? input.primary_row_stride : 16, 'custom_param': has(input.custom_param) ? input.custom_param : 0}})"
      - title: medium CPU, so hits are attributed to HOST
        source: "vllm/v1/kv_offload/tiering/base.py:149-155"
        return: {tier_type: "= input.tier_type", block_size_bytes: "= state.tiers[input.tier_id].block_size_bytes", cache_hit_source: HOST}

  - component: example-secondary-tier-manager
    name: lookup
    kind: function
    latency_ms: 0
    summary: "HIT if the tier holds the chunk, else MISS (this tier never answers RETRY)."
    sources: ["vllm/v1/kv_offload/tiering/base.py:191-205", "vllm/v1/kv_offload/tiering/example/manager.py:85-97"]
    errors: [{code: key-error, status: 0, retryable: false}]
    request: {type: object, required: [tier_id, key], properties: {tier_id: {type: string, examples: [tier0]}, key: {type: string, examples: [blk-0]}, req_id: {type: string, examples: [test]}}}
    response: {type: object, properties: {result: {type: string, enum: [MISS, HIT, HIT_PENDING, RETRY]}}}
    behavior:
      - if: "!(input.tier_id in state.tiers)"
        then: [{fail: {code: key-error, status: 0, message: "= 'unknown tier ' + input.tier_id"}}]
      - title: Presence in the chunk dict
        source: "vllm/v1/kv_offload/tiering/example/manager.py:97"
        return: {result: "= input.key in state.tiers[input.tier_id].chunks ? 'HIT' : 'MISS'"}

  - component: example-secondary-tier-manager
    name: submit-store
    kind: function
    latency_ms: 0
    summary: "Store a job's chunks from the primary tier: record every key and complete the job at once."
    sources: ["vllm/v1/kv_offload/tiering/base.py:206-233", "vllm/v1/kv_offload/tiering/example/manager.py:99-123", "vllm/v1/kv_offload/tiering/base.py:67-77"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      required: [tier_id, job_id, keys, chunk_ids]
      properties:
        tier_id: {type: string, examples: [tier0]}
        job_id: {type: integer, examples: [0]}
        keys: {type: array, items: {type: string}, examples: [[blk-0]]}
        chunk_ids: {type: array, items: {type: integer}, examples: [[0]]}
        req_id: {type: string, examples: [test]}
    response: {type: object, properties: {stored: {type: integer}}}
    behavior:
      - if: "size(input.keys) != size(input.chunk_ids)"
        then:
          - title: Every key needs its primary chunk
            source: "vllm/v1/kv_offload/tiering/example/manager.py:110-112"
            fail: {code: assertion-error, status: 0, message: "= 'Length mismatch: ' + string(size(input.keys)) + ' keys but ' + string(size(input.chunk_ids)) + ' chunk_ids'"}
      - title: Record the keys and a successful JobResult
        source: "vllm/v1/kv_offload/tiering/example/manager.py:114-123"
        set:
          state.tiers: "= merge(state.tiers, {input.tier_id: {'chunks': state.tiers[input.tier_id].chunks + input.keys.filter(k, !(k in state.tiers[input.tier_id].chunks)), 'completed_jobs': state.tiers[input.tier_id].completed_jobs + [{'job_id': input.job_id, 'success': true, 'transfer_time': 0.0}]}})"
      - return: {stored: "= size(input.keys)"}

  - component: example-secondary-tier-manager
    name: submit-load
    kind: function
    latency_ms: 0
    summary: "Load a job's chunks into primary slots: fails the whole job if any key is missing, else completes at once."
    sources: ["vllm/v1/kv_offload/tiering/base.py:234-258", "vllm/v1/kv_offload/tiering/example/manager.py:125-154", "vllm/v1/kv_offload/tiering/base.py:79-91"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      required: [tier_id, job_id, keys, chunk_ids]
      properties:
        tier_id: {type: string, examples: [tier0]}
        job_id: {type: integer, examples: [1]}
        keys: {type: array, items: {type: string}, examples: [[blk-0]]}
        chunk_ids: {type: array, items: {type: integer}, examples: [[2]]}
    response: {type: object, properties: {success: {type: boolean}}}
    behavior:
      - if: "size(input.keys) != size(input.chunk_ids)"
        then:
          - title: Every key needs its primary slot
            source: "vllm/v1/kv_offload/tiering/example/manager.py:136-138"
            fail: {code: assertion-error, status: 0, message: "= 'Length mismatch: ' + string(size(input.keys)) + ' keys but ' + string(size(input.chunk_ids)) + ' chunk_ids'"}
      - set: {vars.ok: "= input.keys.all(k, k in state.tiers[input.tier_id].chunks)"}
      - title: A missing key fails the job; otherwise it succeeds at once
        source: "vllm/v1/kv_offload/tiering/example/manager.py:140-154"
        set:
          state.tiers: "= merge(state.tiers, {input.tier_id: {'completed_jobs': state.tiers[input.tier_id].completed_jobs + [vars.ok ? {'job_id': input.job_id, 'success': true, 'transfer_time': 0.0} : {'job_id': input.job_id, 'success': false}]}})"
      - return: {success: "= vars.ok"}

  - component: example-secondary-tier-manager
    name: get-finished-jobs
    kind: function
    latency_ms: 0
    summary: "Return and clear the jobs completed since the last poll."
    sources: ["vllm/v1/kv_offload/tiering/base.py:259-271", "vllm/v1/kv_offload/tiering/example/manager.py:156-167"]
    request: {type: object, required: [tier_id], properties: {tier_id: {type: string, examples: [tier0]}}}
    response: {type: object, properties: {jobs: {type: array}}}
    behavior:
      - title: Swap out the completed list
        source: "vllm/v1/kv_offload/tiering/example/manager.py:165-167"
        set:
          vars.jobs: "= state.tiers[input.tier_id].completed_jobs"
          state.tiers: "= merge(state.tiers, {input.tier_id: {'completed_jobs': []}})"
      - return: {jobs: "= vars.jobs"}

  - component: example-secondary-tier-manager
    name: on-new-request
    kind: function
    latency_ms: 0
    summary: "The example tier asks for chunk-level offloading (the default RequestOffloadingContext)."
    sources: ["vllm/v1/kv_offload/tiering/base.py:295-306", "vllm/v1/kv_offload/tiering/example/manager.py:169-171", "vllm/v1/kv_offload/base.py:129-142"]
    request: {type: object, required: [tier_id, req_id], properties: {tier_id: {type: string, examples: [tier0]}, req_id: {type: string, examples: [test]}}}
    response: {type: object, properties: {policy: {type: string, enum: [chunk_level, request_level]}}}
    behavior:
      - title: RequestOffloadingContext() - chunk level
        source: "vllm/v1/kv_offload/tiering/example/manager.py:169-171"
        return: {policy: chunk_level}

  - component: example-secondary-tier-manager
    name: drain-jobs
    kind: function
    latency_ms: 0
    summary: "Wait for every submitted job: a synchronous tier has nothing in flight, so its results are already queued."
    sources: ["vllm/v1/kv_offload/tiering/base.py:342-357", "vllm/v1/kv_offload/tiering/example/manager.py:173-176"]
    request: {type: object, required: [tier_id], properties: {tier_id: {type: string, examples: [tier0]}}}
    response: {type: object, properties: {pending: {type: integer}}}
    behavior:
      - title: Nothing in flight; completed jobs stay for the next get_finished_jobs
        source: "vllm/v1/kv_offload/tiering/example/manager.py:173-176"
        return: {pending: "= size(state.tiers[input.tier_id].completed_jobs)"}

  - component: example-secondary-tier-manager
    name: get-num-chunks
    kind: function
    latency_ms: 0
    summary: "How many chunks the tier holds."
    sources: ["vllm/v1/kv_offload/tiering/example/manager.py:178-180"]
    request: {type: object, required: [tier_id], properties: {tier_id: {type: string, examples: [tier0]}}}
    response: {type: object, properties: {num_chunks: {type: integer}}}
    behavior:
      - return: {num_chunks: "= size(state.tiers[input.tier_id].chunks)"}

  # ============================================ round 4: tiering manager
  - component: tiering-offloading-manager
    name: init
    kind: function
    latency_ms: 0
    summary: "Compose the primary CPU tier with the given secondary tiers (by tier id, in order)."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:191-250"]
    request: {type: object, required: [secondary_tiers], properties: {secondary_tiers: {type: array, items: {type: string}, examples: [[tier0, tier1]]}}}
    response: {type: object, properties: {num_tiers: {type: integer}}}
    behavior:
      - title: No jobs, no request state
        source: "vllm/v1/kv_offload/tiering/manager.py:191-250"
        set:
          state.secondary_tiers: "= input.secondary_tiers"
          state.jobs: {}
          state.next_job_id: 0
          state.req_state: {}
          state.pending_promotions: []
          state.load_sources: {}
      - return: {num_tiers: "= size(input.secondary_tiers)"}

  - component: tiering-offloading-manager
    name: on-new-request
    kind: function
    latency_ms: 0
    summary: "Ask every secondary tier for its offload policy: request-level if any tier wants it, else chunk-level."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:812-841", "vllm/v1/kv_offload/tiering/base.py:114-115", "vllm/v1/kv_offload/tiering/manager.py:159-160"]
    request: {type: object, required: [req_id], properties: {req_id: {type: string, examples: [test]}}}
    response: {type: object, properties: {policy: {type: string}}}
    behavior:
      - set: {vars.levels: []}
      - title: Each tier's preference
        source: "vllm/v1/kv_offload/tiering/manager.py:827-834"
        foreach: "= state.secondary_tiers"
        as: tid
        steps:
          - call: example-secondary-tier-manager.on-new-request
            input: {tier_id: "= vars.tid", req_id: "= input.req_id"}
            as: pol
          - set: {vars.levels: "= vars.pol.value.policy == 'request_level' ? vars.levels + [vars.tid] : vars.levels"}
      - set:
          state.req_state: "= merge(state.req_state, {input.req_id: {'pending_primary_stores': 0, 'is_finished': false, 'request_level_tiers': vars.levels}})"
      - return: {policy: "= size(vars.levels) > 0 ? 'request_level' : 'chunk_level'"}

  - component: tiering-offloading-manager
    name: lookup
    kind: function
    latency_ms: 0
    summary: "Primary first (HIT / HIT_PENDING short-circuit); on a primary miss ask each secondary tier, and on a hit reserve a primary slot and queue a promotion (HIT_PENDING), or MISS if the primary is full."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:396-479", "vllm/v1/kv_offload/tiering/manager.py:489-541", "vllm/v1/kv_offload/tiering/base.py:117-118", "vllm/v1/kv_offload/tiering/manager.py:162-163"]
    request: {type: object, required: [key, req_id], properties: {key: {type: string, examples: [blk-0]}, req_id: {type: string, examples: [test]}}}
    response: {type: object, properties: {result: {type: string, enum: [MISS, HIT, HIT_PENDING, RETRY]}}}
    behavior:
      - title: Primary tier lookup
        source: "vllm/v1/kv_offload/tiering/manager.py:431-444"
        call: cpu-offloading-manager.lookup
        input: {key: "= input.key", req_id: "= input.req_id"}
        as: p
      - if: "vars.p.value.result == 'HIT' || vars.p.value.result == 'HIT_PENDING'"
        then: [{return: {result: "= vars.p.value.result"}}]
      - title: Ask each secondary tier in order (a busy tier's RETRY would be returned if no tier hits; the example tier never answers RETRY)
        source: "vllm/v1/kv_offload/tiering/manager.py:446-479"
        foreach: "= state.secondary_tiers"
        as: tid
        steps:
          - call: example-secondary-tier-manager.lookup
            input: {tier_id: "= vars.tid", key: "= input.key", req_id: "= input.req_id"}
            as: s
          - if: "vars.s.value.result == 'HIT'"
            then:
              - title: Promote - reserve the primary slot now (ref_cnt -1) so later lookups see it in flight
                source: "vllm/v1/kv_offload/tiering/manager.py:509-541"
                call: cpu-offloading-manager.prepare-store
                input: {keys: ["= input.key"], req_id: "= input.req_id"}
                as: w
              - if: "vars.w.value == null"
                then:
                  - title: Primary tier full; treat the chunk as unavailable
                    source: "vllm/v1/kv_offload/tiering/manager.py:519-523"
                    return: {result: MISS}
              - set:
                  state.pending_promotions: "= state.pending_promotions + [{'tier_id': vars.tid, 'req_id': input.req_id, 'keys': vars.w.value.keys_to_store, 'chunk_ids': vars.w.value.chunk_ids}]"
                  state.load_sources: "= merge(state.load_sources, {input.req_id: {input.key: 'HOST'}})"
              - return: {result: HIT_PENDING}
      - title: No tier holds the chunk
        source: "vllm/v1/kv_offload/tiering/manager.py:477-479"
        return: {result: MISS}

  - component: tiering-offloading-manager
    name: prepare-store
    kind: function
    latency_ms: 0
    summary: "GPU->primary store: the primary tier reserves chunks; a request with new chunks has one more pending primary store (cascades follow on completion)."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:618-676"]
    request: {type: object, required: [keys, req_id], properties: {keys: {type: array, items: {type: string}, examples: [[blk-0]]}, req_id: {type: string, examples: [test]}}}
    response: {type: [object, "null"], properties: {keys_to_store: {type: array, items: {type: string}}, chunk_ids: {type: array, items: {type: integer}}, evicted_keys: {type: array, items: {type: string}}}}
    behavior:
      - call: cpu-offloading-manager.prepare-store
        input: {keys: "= input.keys", req_id: "= input.req_id"}
        as: pr
      - if: "vars.pr.value == null"
        then:
          - title: The primary tier cannot store them
            source: "vllm/v1/kv_offload/tiering/manager.py:653-654"
            return: null
      - if: "size(vars.pr.value.keys_to_store) > 0 && input.req_id in state.req_state"
        then:
          - title: One more GPU->primary store in flight for this request
            source: "vllm/v1/kv_offload/tiering/manager.py:656-658"
            set: {state.req_state: "= merge(state.req_state, {input.req_id: {'pending_primary_stores': state.req_state[input.req_id].pending_primary_stores + 1}})"}
      - return: "= vars.pr.value"

  - component: tiering-offloading-manager
    name: create-store-job
    kind: function
    latency_ms: 0
    summary: "Pin the chunks in the primary tier (a cascade read, no request access counted) and register a store job."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:783-810", "vllm/v1/kv_offload/tiering/base.py:120-126"]
    request: {type: object, required: [keys, req_id, tier_id], properties: {keys: {type: array, items: {type: string}}, req_id: {type: string}, tier_id: {type: string}}}
    response: {type: object, properties: {job_id: {type: integer}, chunk_ids: {type: array, items: {type: integer}}}}
    behavior:
      - title: primary.prepare_read pins the chunks
        source: "vllm/v1/kv_offload/tiering/manager.py:797"
        call: cpu-offloading-manager.prepare-load
        input: {keys: "= input.keys", req_id: "= input.req_id", record_access: false}
        as: rd
      - title: Allocate a job id and track the job
        source: "vllm/v1/kv_offload/tiering/manager.py:799-809"
        set:
          vars.job_id: "= state.next_job_id"
          state.next_job_id: "= state.next_job_id + 1"
          state.jobs: "= merge(state.jobs, {string(state.next_job_id): {'tier_id': input.tier_id, 'keys': input.keys, 'is_promotion': false, 'req_id': input.req_id}})"
      - return: {job_id: "= vars.job_id", chunk_ids: "= vars.rd.value.chunk_ids"}

  - component: tiering-offloading-manager
    name: complete-store
    kind: function
    latency_ms: 0
    summary: "A GPU->primary write finished: complete it in the primary tier, then cascade the chunks to every secondary tier."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:736-781"]
    request:
      type: object
      required: [keys, req_id]
      properties:
        keys: {type: array, items: {type: string}, examples: [[blk-0]]}
        req_id: {type: string, examples: [test]}
        success: {type: boolean, default: true}
    response: {type: object, properties: {cascaded_to: {type: array, items: {type: string}}}}
    behavior:
      - title: Make the chunks loadable in the primary tier
        source: "vllm/v1/kv_offload/tiering/manager.py:760"
        call: cpu-offloading-manager.complete-store
        input: {keys: "= input.keys", req_id: "= input.req_id", success: "= !has(input.success) || input.success"}
      - set: {vars.cascaded: []}
      - if: "!has(input.success) || input.success"
        then:
          - title: Cascade to every secondary tier
            source: "vllm/v1/kv_offload/tiering/manager.py:762-772"
            foreach: "= state.secondary_tiers"
            as: tid
            steps:
              - call: tiering-offloading-manager.create-store-job
                input: {keys: "= input.keys", req_id: "= input.req_id", tier_id: "= vars.tid"}
                as: job
              - call: example-secondary-tier-manager.submit-store
                input: {tier_id: "= vars.tid", job_id: "= vars.job.value.job_id", keys: "= input.keys", chunk_ids: "= vars.job.value.chunk_ids", req_id: "= input.req_id"}
              - set: {vars.cascaded: "= vars.cascaded + [vars.tid]"}
      - if: "input.req_id in state.req_state && state.req_state[input.req_id].pending_primary_stores > 0"
        then:
          - title: One fewer pending primary store
            source: "vllm/v1/kv_offload/tiering/manager.py:776-780"
            set: {state.req_state: "= merge(state.req_state, {input.req_id: {'pending_primary_stores': state.req_state[input.req_id].pending_primary_stores - 1}})"}
      - return: {cascaded_to: "= vars.cascaded"}

  - component: tiering-offloading-manager
    name: on-schedule-end
    kind: function
    latency_ms: 0
    summary: "End of a scheduler step: process finished tier jobs (cascades unpin primary chunks; promotions make them loadable), then submit one batched promotion load per tier and request."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:881-910", "vllm/v1/kv_offload/tiering/manager.py:322-358", "vllm/v1/kv_offload/tiering/manager.py:543-567", "vllm/v1/kv_offload/tiering/manager.py:281-320", "vllm/v1/kv_offload/base.py:143-149", "vllm/v1/kv_offload/base.py:395-401", "vllm/v1/kv_offload/tiering/base.py:333-340"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object}
    response: {type: object, properties: {finished_jobs: {type: integer}, promotions_submitted: {type: integer}}}
    behavior:
      - set: {vars.n_done: 0}
      - title: Poll every tier for finished jobs
        source: "vllm/v1/kv_offload/tiering/manager.py:332-358"
        foreach: "= state.secondary_tiers"
        as: tid
        steps:
          - call: example-secondary-tier-manager.get-finished-jobs
            input: {tier_id: "= vars.tid"}
            as: fin
          - foreach: "= vars.fin.value.jobs"
            as: jr
            steps:
              - if: "!(string(vars.jr.job_id) in state.jobs)"
                then:
                  - title: A finished job the manager never registered
                    source: "vllm/v1/kv_offload/tiering/manager.py:336-340"
                    fail: {code: assertion-error, status: 0, message: "= 'Finished job_id ' + string(vars.jr.job_id) + ' not in _jobs'"}
              - set:
                  vars.jm: "= state.jobs[string(vars.jr.job_id)]"
                  state.jobs: "= omit(state.jobs, string(vars.jr.job_id))"
                  vars.n_done: "= vars.n_done + 1"
              - if: "vars.jm.is_promotion"
                then:
                  - title: Promotion done - the promoted chunks become ready in the primary tier (or are dropped on failure)
                    source: "vllm/v1/kv_offload/tiering/manager.py:281-320"
                    call: cpu-offloading-manager.complete-store
                    input: {keys: "= vars.jm.keys", req_id: "= vars.jm.req_id", success: "= vars.jr.success"}
                else:
                  - title: Cascade done - unpin the primary chunks it read
                    source: "vllm/v1/kv_offload/tiering/manager.py:351-356"
                    call: cpu-offloading-manager.complete-load
                    input: {keys: "= vars.jm.keys", req_id: "= vars.jm.req_id"}
      - set:
          vars.pending: "= state.pending_promotions"
          state.pending_promotions: []
      - title: Flush promotions - one batched submit_load per (tier, request)
        source: "vllm/v1/kv_offload/tiering/manager.py:549-567"
        foreach: "= vars.pending"
        as: pp
        steps:
          - set:
              vars.jid: "= state.next_job_id"
              state.next_job_id: "= state.next_job_id + 1"
              state.jobs: "= merge(state.jobs, {string(state.next_job_id): {'tier_id': vars.pp.tier_id, 'keys': vars.pp.keys, 'is_promotion': true, 'req_id': vars.pp.req_id}})"
          - call: example-secondary-tier-manager.submit-load
            input: {tier_id: "= vars.pp.tier_id", job_id: "= vars.jid", keys: "= vars.pp.keys", chunk_ids: "= vars.pp.chunk_ids"}
      - return: {finished_jobs: "= vars.n_done", promotions_submitted: "= size(vars.pending)"}

  - component: tiering-offloading-manager
    name: on-request-finished
    kind: function
    latency_ms: 0
    summary: "A request finished: tell the primary tier, and drop the request's state once no GPU->primary store is pending."
    sources: ["vllm/v1/kv_offload/tiering/manager.py:843-879", "vllm/v1/kv_offload/tiering/manager.py:170-174", "vllm/v1/kv_offload/tiering/base.py:308-322"]
    request: {type: object, required: [req_id], properties: {req_id: {type: string, examples: [test]}}}
    response: {type: object, properties: {finalized: {type: boolean}}}
    behavior:
      - call: cpu-offloading-manager.on-request-finished
        input: {req_id: "= input.req_id"}
      - if: "!(input.req_id in state.req_state)"
        then: [{return: {finalized: false}}]
      - set: {state.req_state: "= merge(state.req_state, {input.req_id: {'is_finished': true}})"}
      - if: "state.req_state[input.req_id].pending_primary_stores != 0"
        then:
          - title: A GPU->primary store is still pending; finalize later
            source: "vllm/v1/kv_offload/tiering/manager.py:866-867"
            return: {finalized: false}
      - title: Finalize - secondary tiers' on_request_finished, then forget the request
        source: "vllm/v1/kv_offload/tiering/manager.py:871-879"
        set:
          state.req_state: "= omit(state.req_state, input.req_id)"
          state.load_sources: "= omit(state.load_sources, input.req_id)"
      - return: {finalized: true}

  # ============================================ round 4: P2P control transport
  - component: zmq-transport
    name: fatal-monitor-events
    kind: function
    latency_ms: 0
    summary: "The socket-monitor events treated as fatal: disconnected and closed, plus the handshake failures this pyzmq defines."
    sources: ["vllm/v1/kv_offload/tiering/p2p/control/zmq.py:30-56"]
    request: {type: object, properties: {pyzmq_has_handshake_events: {type: boolean, default: true}}}
    response: {type: object, properties: {events: {type: array, items: {type: string}}, mask_covers_all: {type: boolean}}}
    behavior:
      - title: Disconnected and closed always; handshake failures when pyzmq has them
        source: "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:38-49"
        set:
          vars.events: "= ['EVENT_DISCONNECTED', 'EVENT_CLOSED'] + (!has(input.pyzmq_has_handshake_events) || input.pyzmq_has_handshake_events ? ['EVENT_HANDSHAKE_FAILED_AUTH', 'EVENT_HANDSHAKE_FAILED_PROTOCOL', 'EVENT_HANDSHAKE_FAILED_NO_DETAIL'] : [])"
      - title: The monitor mask ORs every fatal event in
        source: "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:54-56"
        return: {events: "= vars.events", mask_covers_all: true}

  - component: zmq-transport
    name: connect
    kind: function
    latency_ms: 0
    summary: "Open an outbound DEALER to a peer with a monitor socket on the fatal-event mask; the connection starts alive."
    sources: ["vllm/v1/kv_offload/tiering/p2p/control/zmq.py:164-187", "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:248-291"]
    request: {type: object, required: [peer_id], properties: {peer_id: {type: string, examples: ["127.0.0.1:5555"]}}}
    response: {type: object, properties: {alive: {type: boolean}}}
    behavior:
      - title: New connection, monitored for fatal events
        source: "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:274-279"
        set: {state.connections: "= merge(state.connections, {input.peer_id: {'alive': true, 'closed': false}})"}
      - return: {alive: true}

  - component: zmq-transport
    name: check-monitors
    kind: function
    latency_ms: 0
    summary: "Drain each live connection's monitor events; the first fatal event marks the connection dead (its sockets stay open until close)."
    sources: ["vllm/v1/kv_offload/tiering/p2p/control/zmq.py:345-375", "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:122-129"]
    request:
      type: object
      required: [events]
      properties:
        events: {type: object, description: "peer id -> monitor events received since the last poll, in order", examples: [{"127.0.0.1:5555": [EVENT_CONNECTED, EVENT_DISCONNECTED]}]}
    response: {type: object, properties: {dead: {type: array, items: {type: string}}}}
    behavior:
      - call: zmq-transport.fatal-monitor-events
        as: fatal
      - set:
          vars.dead: "= input.events.transformList(p, evs, p).filter(p, p in state.connections && state.connections[p].alive && input.events[p].exists(e, e in vars.fatal.value.events))"
      - title: mark_dead on a fatal event
        source: "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:366-375"
        set: {state.connections: "= merge(state.connections, vars.dead.transformMapEntry(i, p, {p: {'alive': false}}))"}
      - return: {dead: "= vars.dead"}

  - component: zmq-transport
    name: send
    kind: function
    latency_ms: 0
    summary: "Send a msgpack message to a peer; refused on a dead or closed connection."
    sources: ["vllm/v1/kv_offload/tiering/p2p/control/zmq.py:88-95", "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:105-107"]
    errors: [{code: runtime-error, status: 0, retryable: false}]
    request: {type: object, required: [peer_id, msg], properties: {peer_id: {type: string, examples: ["127.0.0.1:5555"]}, msg: {type: object, examples: [{type: hello}]}}}
    response: {type: object, properties: {sent: {type: boolean}}}
    behavior:
      - if: "!(input.peer_id in state.connections) || !state.connections[input.peer_id].alive"
        then:
          - title: Send on a dead connection
            source: "vllm/v1/kv_offload/tiering/p2p/control/zmq.py:90-93"
            fail: {code: runtime-error, status: 0, message: "= 'ZmqConnection: send on closed connection to ' + input.peer_id"}
      - return: {sent: true}

  # ============================================ round 4: sliding window manager
  - component: sliding-window-manager
    name: find-longest-cache-hit
    kind: function
    latency_ms: 0
    summary: "Scan the block hashes right to left for cdiv(window - 1, block_size) contiguous cached blocks (one more with EAGLE); earlier blocks are null. Without such a run the hit is the run that starts at block 0."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:939-1051"]
    request:
      type: object
      required: [block_hashes, max_length, sliding_window]
      properties:
        block_hashes: {type: array, items: {type: string}}
        max_length: {type: integer, examples: [64]}
        sliding_window: {type: integer, examples: [8]}
        use_eagle: {type: boolean, default: false}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}, hit_length: {type: integer}}}
    behavior:
      - set:
          vars.bs: "= int(config['block-size'])"
          vars.eagle: "= has(input.use_eagle) && input.use_eagle"
      - title: Blocks a hit must hold contiguously
        source: "vllm/v1/core/single_type_kv_cache_manager.py:939-946"
        set:
          vars.need: "= (input.sliding_window - 1 + vars.bs - 1) / vars.bs + (vars.eagle ? 1 : 0)"
          vars.n: "= math.least(input.max_length / vars.bs, size(input.block_hashes))"
          vars.run: 0
          vars.ids: "= lists.range(math.least(input.max_length / vars.bs, size(input.block_hashes))).map(i, 0)"
          vars.end: -1
      - title: Right to left, count contiguous cached blocks
        source: "vllm/v1/core/single_type_kv_cache_manager.py:988-1007"
        foreach: "= lists.range(vars.n).map(k, vars.n - 1 - k)"
        as: i
        steps:
          - call: block-pool.get-cached-block
            input: {block_hash: "= input.block_hashes[vars.i]"}
            as: c
          - if: "vars.c.value.block == null"
            then:
              - set: {vars.run: 0}
              - continue: true
          - set:
              vars.ids: "= lists.range(vars.n).map(j, j == vars.i ? vars.c.value.block.block_id : vars.ids[j])"
              vars.run: "= vars.run + 1"
          - if: "vars.run >= vars.need"
            then:
              - title: Enough of the window is cached; the hit ends after this run
                source: "vllm/v1/core/single_type_kv_cache_manager.py:999-1004"
                set: {vars.end: "= vars.i + vars.run"}
              - break: true
      - if: "vars.end < 0"
        then:
          - title: No full window - keep only a run that starts at the first block
            source: "vllm/v1/core/single_type_kv_cache_manager.py:1008-1010"
            set: {vars.end: "= vars.run"}
      - set: {vars.hit: "= vars.ids.slice(0, vars.end)"}
      - if: "vars.eagle && size(vars.hit) > 0"
        then:
          - title: EAGLE drops the last hit block
            source: "vllm/v1/core/single_type_kv_cache_manager.py:1018-1021"
            set: {vars.hit: "= vars.hit.slice(0, size(vars.hit) - 1)"}
      - return: {block_ids: "= vars.hit", hit_length: "= size(vars.hit) * vars.bs"}

  - component: sliding-window-manager
    name: allocate
    kind: function
    latency_ms: 0
    summary: "Append block ids to the request's sliding-window block table (after the hit or new allocation)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:48-160"]
    request: {type: object, required: [request_id, block_ids], properties: {request_id: {type: string}, block_ids: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - title: req_to_blocks[request_id].extend(blocks)
        source: "vllm/v1/core/single_type_kv_cache_manager.py:48-160"
        set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: (input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []) + input.block_ids})"}
      - return: {block_ids: "= state.req_to_blocks[input.request_id]"}

  - component: sliding-window-manager
    name: remove-skipped-blocks
    kind: function
    latency_ms: 0
    summary: "Free the blocks wholly before the window (computed - window + 1 - extra retained tokens), back to front until an already-null slot, replacing each with the null block."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:672-710", "vllm/v1/core/single_type_kv_cache_manager.py:645-670", "vllm/v1/core/single_type_kv_cache_manager.py:1135-1170"]
    request:
      type: object
      required: [request_id, processed_computed_tokens, sliding_window]
      properties:
        request_id: {type: string}
        processed_computed_tokens: {type: integer, examples: [7]}
        sliding_window: {type: integer, examples: [4]}
        extra_retained_tokens: {type: integer, default: 0}
    response: {type: object, properties: {freed: {type: array, items: {type: integer}}, block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - title: Tokens before the window (never negative)
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1135-1170"
        set:
          vars.skipped: "= math.greatest(0, input.processed_computed_tokens - input.sliding_window + 1 - (has(input.extra_retained_tokens) ? input.extra_retained_tokens : 0))"
      - if: "vars.skipped <= 0 || !(input.request_id in state.req_to_blocks)"
        then:
          - title: Every token is inside the window
            source: "vllm/v1/core/single_type_kv_cache_manager.py:695-700"
            return: {freed: [], block_ids: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"}
      - set:
          vars.blocks: "= state.req_to_blocks[input.request_id]"
      - set:
          vars.last: "= math.least(vars.skipped / int(config['block-size']), size(vars.blocks))"
      - title: Back to front, stop at the first slot already nulled
        source: "vllm/v1/core/single_type_kv_cache_manager.py:663-668"
        set:
          vars.firstnull: "= lists.range(vars.last).filter(i, vars.blocks[i] == 0)"
      - set:
          vars.start: "= size(vars.firstnull) > 0 ? vars.firstnull[size(vars.firstnull) - 1] + 1 : 0"
      - set:
          vars.freed: "= lists.range(vars.last - vars.start).map(k, vars.blocks[vars.last - 1 - k])"
      - if: "size(vars.freed) > 0"
        then:
          - title: Return them to the pool and null their slots
            source: "vllm/v1/core/single_type_kv_cache_manager.py:669-670"
            call: block-pool.free-blocks
            input: {block_ids: "= vars.freed"}
          - set:
              state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: lists.range(size(vars.blocks)).map(i, i >= vars.start && i < vars.last ? 0 : vars.blocks[i])})"
      - return: {freed: "= vars.freed", block_ids: "= state.req_to_blocks[input.request_id]"}

  # ============================================ round 4: KV cache events
  - component: block-pool
    name: take-events
    kind: function
    latency_ms: 0
    summary: "Take and clear the queued KV cache events; always empty when KV events are off."
    sources: ["vllm/v1/core/block_pool.py:890-901", "vllm/v1/core/kv_cache_utils.py:96-99"]
    request: {type: object}
    response: {type: object, properties: {events: {type: array}}}
    behavior:
      - if: "!config['enable-kv-cache-events']"
        then:
          - title: Events disabled
            source: "vllm/v1/core/block_pool.py:897-898"
            return: {events: []}
      - title: Swap out the queue
        source: "vllm/v1/core/block_pool.py:899-901"
        set:
          vars.ev: "= state.kv_event_queue"
          state.kv_event_queue: []
      - return: {events: "= vars.ev"}

  - component: kv-cache-manager
    name: take-events
    kind: function
    latency_ms: 0
    summary: "Take the block pool's events and annotate each BlockStored with its group's spec kind (full attention for Llama)."
    sources: ["vllm/v1/core/kv_cache_manager.py:696-721"]
    request: {type: object}
    response: {type: object, properties: {events: {type: array}}}
    behavior:
      - call: block-pool.take-events
        as: ev
      - title: Annotate BlockStored events with kv_cache_spec_kind and sliding window
        source: "vllm/v1/core/kv_cache_manager.py:704-720"
        return:
          events: "= vars.ev.value.events.map(e, e.type == 'BlockStored' && e.group_idx < size(state.kv_cache_groups) ? merge(e, {'kv_cache_spec_kind': state.kv_cache_groups[e.group_idx].kind, 'kv_cache_spec_sliding_window': null}) : e)"

  # ============================================ round 4: circular buffer manager
  - component: circular-buffer-manager
    name: get-num-blocks-to-allocate
    kind: function
    latency_ms: 0
    summary: "One block for a request without its ring block yet, else none."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1191-1201"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {num_blocks: {type: integer}}}
    behavior:
      - return: {num_blocks: "= input.request_id in state.req_to_blocks && size(state.req_to_blocks[input.request_id]) > 0 ? 0 : 1"}

  - component: circular-buffer-manager
    name: allocate-new-blocks
    kind: function
    latency_ms: 0
    summary: "Claim the request's ring block from the pool the first time; later calls allocate nothing."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1203-1206"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {new_block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - if: "input.request_id in state.req_to_blocks && size(state.req_to_blocks[input.request_id]) > 0"
        then:
          - title: The ring block is already claimed
            source: "vllm/v1/core/single_type_kv_cache_manager.py:1205-1206"
            return: {new_block_ids: []}
      - title: _claim_ring_block takes one block
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1205-1206"
        call: block-pool.get-new-blocks
        input: {num_blocks: 1}
        as: nb
      - set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: vars.nb.value.block_ids})"}
      - return: {new_block_ids: "= vars.nb.value.block_ids"}

  - component: circular-buffer-manager
    name: find-longest-cache-hit
    kind: function
    latency_ms: 0
    summary: "Never a prefix hit: the ring holds only the latest state."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1217-1230"]
    request: {type: object, properties: {block_hashes: {type: array, items: {type: string}}, max_length: {type: integer}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}, hit_length: {type: integer}}}
    behavior:
      - title: Empty hit for every group
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1230"
        return: {block_ids: [], hit_length: 0}

  - component: circular-buffer-manager
    name: cache-blocks
    kind: function
    latency_ms: 0
    summary: "Nothing to cache (no prefix caching for the ring)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1232-1240"]
    request: {type: object, properties: {request_id: {type: string}, num_tokens: {type: integer}}}
    response: {type: object, properties: {cached: {type: integer}}}
    behavior:
      - title: No-op
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1240"
        return: {cached: 0}

  - component: circular-buffer-manager
    name: remove-skipped-blocks
    kind: function
    latency_ms: 0
    summary: "Nothing is ever skipped: the ring block is reused in place (get_num_skipped_tokens is 0)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1251-1260"]
    request: {type: object, properties: {request_id: {type: string}, processed_computed_tokens: {type: integer}}}
    response: {type: object, properties: {freed: {type: array, items: {type: integer}}}}
    behavior:
      - title: No-op
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1257"
        return: {freed: []}

  # ============================================ round 4: Mamba-aligned chunking
  - component: scheduler
    name: mamba-block-aligned-split
    kind: function
    latency_ms: 0
    summary: "Clip a prefill chunk (Mamba 'align' cache mode) so it ends where a reusable SSM state must be materialized: block boundaries, the last cacheable block, the prompt's partial-tail hash boundary and a shared-prefix junction."
    sources: ["vllm/v1/core/sched/scheduler.py:443-556", "vllm/v1/kv_cache_interface.py:1110-1122", "vllm/v1/core/sched/scheduler.py:723-727"]
    request:
      type: object
      required: [num_computed_tokens, num_new_tokens, num_prompt_tokens, num_tokens]
      properties:
        num_computed_tokens: {type: integer, examples: [16]}
        num_new_tokens: {type: integer, examples: [8]}
        num_new_local_computed_tokens: {type: integer, default: 0}
        num_external_computed_tokens: {type: integer, default: 0}
        num_prompt_tokens: {type: integer, examples: [24]}
        num_tokens: {type: integer, examples: [24]}
        shared_prefix_boundary: {type: integer, default: 0, description: "Request.shared_prefix_boundary: where this prompt stops sharing a detected prefix (0 = none)."}
        hash_block_size: {type: [integer, "null"], default: null}
        mamba_partial_cache_hit: {type: boolean, default: false}
        use_eagle_block_drop: {type: boolean, default: false}
        mamba_shared_prefix_checkpoint: {type: boolean, default: false, description: "enable_mamba_shared_prefix_checkpoint"}
    response: {type: object, properties: {num_new_tokens: {type: integer}, end: {type: integer}}}
    behavior:
      - set:
          vars.start: "= input.num_computed_tokens + input.num_new_local_computed_tokens + input.num_external_computed_tokens"
          vars.pend: "= math.greatest(input.num_prompt_tokens, input.num_tokens - 1)"
          vars.bs: "= int(config['block-size'])"
          vars.hbs: "= input.hash_block_size != null ? input.hash_block_size : int(config['block-size'])"
          vars.e: "= input.use_eagle_block_drop"
      - if: "vars.start >= vars.pend"
        then:
          - title: Past the prefill - no split
            source: "vllm/v1/core/sched/scheduler.py:464-465"
            return: {num_new_tokens: "= input.num_new_tokens", end: "= vars.start + input.num_new_tokens"}
      - title: Last cacheable block position (back off one block with EAGLE; else leave one token to recompute)
        source: "vllm/v1/kv_cache_interface.py:1118-1122"
        set:
          vars.last: "= math.greatest(((vars.e ? input.num_tokens : input.num_tokens - 1) / vars.bs * vars.bs) - (vars.e ? vars.bs : 0), 0)"
          vars.end: "= vars.start + input.num_new_tokens"
          vars.maxp: "= int(config['long-prefill-token-threshold']) > 0 ? math.least(int(config['max-num-batched-tokens']), int(config['long-prefill-token-threshold'])) : int(config['max-num-batched-tokens'])"
      - if: "vars.end < vars.pend && ((vars.end / vars.bs * vars.bs) > vars.start || vars.bs <= vars.maxp)"
        then:
          - title: A mid-prefill chunk ends on a block boundary
            source: "vllm/v1/core/sched/scheduler.py:507-514"
            set: {vars.end: "= vars.end / vars.bs * vars.bs"}
      - title: Mandatory stops - next block boundary, last cacheable block, the prompt's partial-tail checkpoint, the shared-prefix junction
        source: "vllm/v1/core/sched/scheduler.py:516-553"
        set:
          vars.tail: "= input.mamba_partial_cache_hit ? math.greatest(((vars.e ? input.num_prompt_tokens : input.num_prompt_tokens - 1) / vars.hbs * vars.hbs) - (vars.e ? vars.hbs : 0), 0) : 0"
          vars.j: "= input.shared_prefix_boundary"
      - set:
          vars.jstop: "= input.mamba_shared_prefix_checkpoint && vars.j <= input.num_prompt_tokens ? vars.j : vars.start + (vars.j - vars.start) / vars.bs * vars.bs"
      - set:
          vars.stops: "= [vars.start % vars.bs != 0 ? (vars.start / vars.bs + 1) * vars.bs : 0, vars.last, vars.last < vars.tail && vars.tail < input.num_prompt_tokens ? vars.tail : 0, vars.start < vars.j && vars.j < vars.end ? vars.jstop : 0].filter(x, vars.start < x && x < vars.end)"
      - title: Stop at the earliest one strictly inside the chunk
        source: "vllm/v1/core/sched/scheduler.py:555-556"
        set: {vars.end: "= size(vars.stops) > 0 ? math.least(vars.stops) : vars.end"}
      - return: {num_new_tokens: "= math.greatest(vars.end - vars.start, 0)", end: "= vars.end"}

  # ============================================ round 4: block-size resolution
  - component: kv-cache-utils
    name: resolve-kv-cache-block-sizes
    kind: function
    latency_ms: 0
    summary: "(scheduler block size, hash block size): one group uses block_size x DCP for both; several use the LCM of their block sizes, and hash at prefix_match_unit or the GCD of the cacheable groups' sizes, unless caching is off or a Mamba group is not in align mode."
    sources: ["vllm/v1/core/kv_cache_utils.py:804-906"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [groups]
      properties:
        groups: {type: array, items: {type: object, properties: {kind: {type: string}, block_size: {type: integer}, dcp_sharded: {type: boolean}, prefix_cacheable: {type: boolean}, mamba_cache_mode: {type: string}}}}
        prefix_match_unit: {type: [integer, "null"], default: null}
        dcp: {type: integer, default: 1}
    response: {type: object, properties: {scheduler_block_size: {type: integer}, hash_block_size: {type: integer}}}
    behavior:
      - set:
          vars.caching: "= config['enable-prefix-caching'] || config['kv-connector'] != ''"
      - if: "size(input.groups) <= 1"
        then:
          - set:
              vars.bs: "= int(config['block-size']) * (size(input.groups) == 1 && has(input.groups[0].dcp_sharded) && !input.groups[0].dcp_sharded ? 1 : input.dcp)"
          - if: "input.prefix_match_unit != null && input.prefix_match_unit != vars.bs && size(input.groups) == 1 && vars.caching"
            then:
              - title: One group hits on the block size only
                source: "vllm/v1/core/kv_cache_utils.py:833-845"
                fail: {code: value-error, status: 0, message: "= 'Invalid prefix_match_unit=' + string(input.prefix_match_unit) + '; with a single KV cache group, prefix-cache hits land on the block size (' + string(vars.bs) + '). Unset it or set it to ' + string(vars.bs) + '.'"}
          - title: Single group - both sizes are the block size (times DCP)
            source: "vllm/v1/core/kv_cache_utils.py:830-849"
            return: {scheduler_block_size: "= vars.bs", hash_block_size: "= vars.bs"}
      - set:
          vars.sizes: "= input.groups.map(g, g.kind == 'mamba' || (has(g.dcp_sharded) && !g.dcp_sharded) ? g.block_size : g.block_size * input.dcp)"
      - title: Scheduler block size = LCM of the groups' sizes
        source: "vllm/v1/core/kv_cache_utils.py:851-854"
        set:
          vars.lcm: "= vars.sizes.filter(m, vars.sizes.all(x, m % x == 0)).size() > 0 ? math.least(vars.sizes.filter(m, vars.sizes.all(x, m % x == 0))) : lists.range(4096).map(k, (k + 1) * math.greatest(vars.sizes)).filter(m, vars.sizes.all(x, m % x == 0))[0]"
      - if: "!vars.caching || input.groups.exists(g, g.kind == 'mamba' && (!has(g.mamba_cache_mode) || g.mamba_cache_mode != 'align'))"
        then:
          - title: No block hashing, or a Mamba group outside align mode - no finer hashing
            source: "vllm/v1/core/kv_cache_utils.py:857-871"
            return: {scheduler_block_size: "= vars.lcm", hash_block_size: "= vars.lcm"}
      - set:
          vars.hs: "= lists.range(size(input.groups)).filter(i, !has(input.groups[i].prefix_cacheable) || input.groups[i].prefix_cacheable).map(i, vars.sizes[i])"
      - set:
          vars.hs: "= size(vars.hs) > 0 ? vars.hs : vars.sizes"
      - title: Hash unit = prefix_match_unit, else the GCD of the cacheable sizes
        source: "vllm/v1/core/kv_cache_utils.py:873-879"
        set:
          vars.h: "= input.prefix_match_unit != null ? input.prefix_match_unit : math.greatest(lists.range(math.least(vars.hs)).map(k, k + 1).filter(d, vars.hs.all(x, x % d == 0)))"
      - if: "vars.hs.exists(x, x % vars.h != 0)"
        then:
          - title: Every cacheable group's size must be a multiple of the hash unit
            source: "vllm/v1/core/kv_cache_utils.py:880-886"
            fail: {code: value-error, status: 0, message: "= 'Invalid prefix_match_unit=' + string(vars.h) + '; prefix-cacheable KV cache group block sizes must be divisible by prefix_match_unit.'"}
      - return: {scheduler_block_size: "= vars.lcm", hash_block_size: "= vars.h"}

  - component: kv-cache-utils
    name: generate-scheduler-kv-cache-config
    kind: function
    latency_ms: 0
    summary: "The scheduler's KV cache config: every worker's config must agree on num_blocks; take the first, and represent a uniform-type group by one of its layer specs."
    sources: ["vllm/v1/core/kv_cache_utils.py:2276-2297"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request:
      type: object
      required: [kv_cache_configs]
      properties:
        kv_cache_configs: {type: array, items: {type: object, properties: {num_blocks: {type: integer}, kv_cache_groups: {type: array}}}}
    response: {type: object, properties: {num_blocks: {type: integer}, kv_cache_groups: {type: array}}}
    behavior:
      - if: "input.kv_cache_configs.exists(c, c.num_blocks != input.kv_cache_configs[0].num_blocks)"
        then:
          - title: Workers disagree on the block count
            source: "vllm/v1/core/kv_cache_utils.py:2280-2282"
            fail: {code: assertion-error, status: 0, message: "all workers must have the same num_blocks"}
      - title: Copy the first config; a uniform-type group keeps one layer's spec
        source: "vllm/v1/core/kv_cache_utils.py:2289-2297"
        return:
          num_blocks: "= input.kv_cache_configs[0].num_blocks"
          kv_cache_groups: "= input.kv_cache_configs[0].kv_cache_groups.map(g, has(g.layer_specs) && size(g.layer_specs) > 0 ? merge(g, {'spec': g.layer_specs[0], 'layer_specs': []}) : g)"

  # ============================================ round 4: RSWA, chunked local, registry
  - component: rswa-manager
    name: remove-skipped-blocks
    kind: function
    latency_ms: 0
    summary: "Without the prompt length it frees nothing (full attention); with it, free the gap blocks between the prompt's last block and the decode window start."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:900-930", "vllm/v1/core/single_type_kv_cache_manager.py:645-670"]
    request:
      type: object
      required: [request_id, processed_computed_tokens, rswa_window]
      properties:
        request_id: {type: string}
        processed_computed_tokens: {type: integer}
        rswa_window: {type: integer}
        num_prompt_tokens: {type: [integer, "null"], default: null}
        block_ids: {type: array, items: {type: integer}, default: [], description: "Seeds the request's table on first use."}
    response: {type: object, properties: {freed: {type: array, items: {type: integer}}, block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - if: "!(input.request_id in state.req_to_blocks)"
        then: [{set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: input.block_ids})"}}]
      - if: "input.num_prompt_tokens == null"
        then:
          - title: No prompt length - the full-attention rule (nothing outside the window)
            source: "vllm/v1/core/single_type_kv_cache_manager.py:916-920"
            return: {freed: [], block_ids: "= state.req_to_blocks[input.request_id]"}
      - set:
          vars.bs: "= int(config['block-size'])"
          vars.blocks: "= state.req_to_blocks[input.request_id]"
      - title: Gap = [cdiv(prompt, bs), max(prompt, processed - window) // bs)
        source: "vllm/v1/core/single_type_kv_cache_manager.py:922-930"
        set:
          vars.first: "= (input.num_prompt_tokens + vars.bs - 1) / vars.bs"
          vars.last: "= math.least(math.greatest(input.num_prompt_tokens, input.processed_computed_tokens - input.rswa_window) / vars.bs, size(vars.blocks))"
      - set:
          vars.nulls: "= lists.range(math.greatest(vars.first, vars.last) - vars.first).map(k, vars.first + k).filter(i, vars.blocks[i] == 0)"
      - set:
          vars.start: "= size(vars.nulls) > 0 ? vars.nulls[size(vars.nulls) - 1] + 1 : vars.first"
      - set:
          vars.freed: "= lists.range(math.greatest(vars.last - vars.start, 0)).map(k, vars.blocks[vars.last - 1 - k])"
      - if: "size(vars.freed) > 0"
        then:
          - title: Free the gap back to front and null its slots
            source: "vllm/v1/core/single_type_kv_cache_manager.py:663-670"
            call: block-pool.free-blocks
            input: {block_ids: "= vars.freed"}
          - set: {state.req_to_blocks: "= merge(state.req_to_blocks, {input.request_id: lists.range(size(vars.blocks)).map(i, i >= vars.start && i < vars.last ? 0 : vars.blocks[i])})"}
      - return: {freed: "= vars.freed", block_ids: "= state.req_to_blocks[input.request_id]"}

  - component: chunked-local-attention-manager
    name: find-longest-cache-hit
    kind: function
    latency_ms: 0
    summary: "Blocks before the current attention chunk are computed for free (null); then cached blocks are adopted from the chunk start until the first miss."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1268-1366"]
    request:
      type: object
      required: [block_hashes, max_length, attention_chunk_size]
      properties:
        block_hashes: {type: array, items: {type: string}}
        max_length: {type: integer, examples: [15]}
        attention_chunk_size: {type: integer, examples: [8]}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}, hit_length: {type: integer}}}
    behavior:
      - set:
          vars.bs: "= int(config['block-size'])"
      - title: Blocks before the local window are null (already computed)
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1340-1355"
        set:
          vars.maxb: "= math.least(input.max_length / vars.bs, size(input.block_hashes))"
          vars.sidx: "= input.max_length > 0 ? input.max_length / input.attention_chunk_size * input.attention_chunk_size / vars.bs : 0"
      - set:
          vars.ids: "= lists.range(vars.sidx).map(i, 0)"
      - title: Adopt cached blocks from the window start until a miss
        source: "vllm/v1/core/single_type_kv_cache_manager.py:1356-1364"
        foreach: "= lists.range(math.greatest(vars.sidx, vars.maxb) - vars.sidx).map(k, vars.sidx + k)"
        as: i
        steps:
          - call: block-pool.get-cached-block
            input: {block_hash: "= input.block_hashes[vars.i]"}
            as: c
          - if: "vars.c.value.block == null"
            then: [{break: true}]
          - set: {vars.ids: "= vars.ids + [vars.c.value.block.block_id]"}
      - return: {block_ids: "= vars.ids", hit_length: "= size(vars.ids) * vars.bs"}

  - component: kv-cache-spec-registry
    name: register-all-kvcache-specs
    kind: function
    latency_ms: 0
    summary: "Built-in registration: each spec class to its manager and uniform-type base (MLA, RSWA, hidden-state and sink specs group with full attention), plus the HiSparse source role."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:2633-2707", "vllm/v1/kv_cache_spec_registry.py:60-102"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, properties: {extra: {type: array, default: [], items: {type: object, properties: {spec: {type: string}, manager: {type: string}, base: {type: string}}}, description: "Platform plugin registrations (register_custom_kv_cache_specs)."}}}
    response: {type: object, properties: {num_specs: {type: integer}}}
    behavior:
      - set:
          vars.builtin:
            FullAttentionSpec: {manager: FullAttentionManager, base: FullAttentionSpec}
            HiSparseHotSpec: {manager: HiSparseHotManager, base: HiSparseHotSpec}
            HiSparseResidentSpec: {manager: HiSparseResidentManager, base: HiSparseResidentSpec}
            SlidingWindowSpec: {manager: SlidingWindowManager, base: SlidingWindowSpec}
            CircularBufferSpec: {manager: CircularBufferManager, base: CircularBufferSpec}
            SlidingWindowMLASpec: {manager: SlidingWindowManager, base: SlidingWindowMLASpec}
            MambaSpec: {manager: MambaManager, base: MambaSpec}
            ChunkedLocalAttentionSpec: {manager: ChunkedLocalAttentionManager, base: ChunkedLocalAttentionSpec}
            CrossAttentionSpec: {manager: CrossAttentionManager, base: CrossAttentionSpec}
            MLAAttentionSpec: {manager: FullAttentionManager, base: FullAttentionSpec}
            RSWASpec: {manager: RSWAManager, base: FullAttentionSpec}
            HiddenStateCacheSpec: {manager: FullAttentionManager, base: FullAttentionSpec}
            SinkFullAttentionSpec: {manager: SinkFullAttentionManager, base: FullAttentionSpec}
      - if: "input.extra.exists(e, e.spec in vars.builtin && vars.builtin[e.spec].manager != e.manager)"
        then:
          - title: A conflicting re-registration of a spec class
            source: "vllm/v1/kv_cache_spec_registry.py:86-95"
            fail: {code: assertion-error, status: 0, message: "Conflicting registration for KVCacheSpec"}
      - title: Register the built-ins, the HiSparse source role, then the platform's custom specs
        source: "vllm/v1/core/single_type_kv_cache_manager.py:2635-2707"
        set:
          state.specs: "= merge(vars.builtin, input.extra.transformMapEntry(i, e, {e.spec: {'manager': e.manager, 'base': e.base}}))"
          state.roles: {hisparse_source: HiSparseSourceManager}
      - return: {num_specs: "= size(state.specs)"}

  - component: kv-cache-spec-registry
    name: get-manager-class
    kind: function
    latency_ms: 0
    summary: "The manager for a spec: a role-registered manager first, else the first registered class along the spec's MRO; none if unregistered."
    sources: ["vllm/v1/kv_cache_spec_registry.py:114-138", "vllm/v1/core/single_type_kv_cache_manager.py:2585-2630"]
    request: {type: object, required: [mro], properties: {mro: {type: array, items: {type: string}, examples: [[MLAAttentionSpec, FullAttentionSpec, AttentionSpec, KVCacheSpec]]}, role: {type: [string, "null"], default: null}}}
    response: {type: object, properties: {manager: {type: [string, "null"]}}}
    behavior:
      - if: "input.role != null && input.role in state.roles"
        then:
          - title: The group's role picks the manager
            source: "vllm/v1/kv_cache_spec_registry.py:129-130"
            return: {manager: "= state.roles[input.role]"}
      - set: {vars.hit: "= input.mro.filter(c, c in state.specs)"}
      - title: Walk up the MRO to the first registered base
        source: "vllm/v1/kv_cache_spec_registry.py:131-138"
        return: {manager: "= size(vars.hit) > 0 ? state.specs[vars.hit[0]].manager : dyn(null)"}

  # ===================================================== round 5: encoder-input scheduling
  - component: scheduler
    name: try-schedule-encoder-inputs
    kind: function
    latency_ms: 0
    summary: "Pick the multimodal items whose placeholders overlap this step's token range and that need encoding, within the encoder compute budget and the encoder cache; cut num_new_tokens to just before an item that can't be scheduled."
    description: >-
      An item is scheduled when its placeholder range overlaps [num_computed_tokens,
      num_computed_tokens + num_new_tokens + shift), it is not already cached (a cached one gains a
      reference), and the compute budget and cache have room for its embeddings. The encoder runs
      over a whole item (bidirectional attention), so an item that doesn't fit stops the chunk
      right before its offset, or schedules nothing when the computed prefix is already past it.
      Every placeholder is taken to be an embedding (is_embed None), so an overlapping item always
      has embeddings in range.
    sources: ["vllm/v1/core/sched/scheduler.py:1789-1966", "vllm/multimodal/utils.py:122-142"]
    request:
      type: object
      required: [request_id, mm_features, num_computed_tokens, num_new_tokens, encoder_compute_budget]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        mm_features: {type: array, items: {type: object, properties: {identifier: {type: string}, offset: {type: integer}, length: {type: integer}, num_embeds: {type: integer}}}}
        num_computed_tokens: {type: integer, examples: [0]}
        num_new_tokens: {type: integer, examples: [2048]}
        encoder_compute_budget: {type: integer, examples: [2048]}
        shift_computed_tokens: {type: integer, default: 0, description: "num_prefill_lookahead (multi-module MTP); 0 otherwise."}
    response:
      type: object
      properties:
        encoder_inputs_to_schedule: {type: array, items: {type: integer}}
        num_new_tokens: {type: integer}
        encoder_compute_budget: {type: integer}
        duplicate_encoder_inputs: {type: array, items: {type: integer}}
    behavior:
      - set:
          vars.nc: "= input.num_computed_tokens"
          vars.nn: "= input.num_new_tokens"
          vars.shift: "= has(input.shift_computed_tokens) ? input.shift_computed_tokens : 0"
          vars.budget: "= input.encoder_compute_budget"
          vars.to_sched: []
          vars.dups: []
          vars.hashes: {}
          vars.embeds: 0
      - if: "vars.nn == 0 || size(input.mm_features) == 0"
        then:
          - title: Nothing to schedule or no encoder inputs
            source: "vllm/v1/core/sched/scheduler.py:1816-1817"
            return: {encoder_inputs_to_schedule: [], num_new_tokens: "= vars.nn", encoder_compute_budget: "= vars.budget", duplicate_encoder_inputs: []}
      - title: The items whose placeholders overlap [num_computed_tokens, window end)
        detail: "get_mm_features_in_window bisects the offset-sorted features: lo is the first item ending after num_computed_tokens, hi the first starting at or after the window end."
        source: "vllm/v1/core/sched/scheduler.py:1830-1837"
        set:
          vars.window_end: "= vars.nc + vars.nn + vars.shift"
      - foreach: "= lists.range(size(input.mm_features)).filter(i, input.mm_features[i].offset + input.mm_features[i].length > vars.nc && input.mm_features[i].offset < vars.window_end)"
        as: i
        steps:
          - set:
              vars.f: "= input.mm_features[vars.i]"
          - set:
              vars.n_emb: "= has(vars.f.num_embeds) ? vars.f.num_embeds : vars.f.length"
          - if: "config['disable-chunked-mm-input'] && vars.nc < vars.f.offset && vars.nc + vars.nn < vars.f.offset + vars.f.length"
            then:
              - title: Chunked MM input is off - roll the chunk back to just before the item
                source: "vllm/v1/core/sched/scheduler.py:1866-1881"
                set: {vars.nn: "= math.greatest(0, vars.f.offset - (vars.nc + vars.shift))"}
              - break: true
          - if: "vars.f.identifier in vars.hashes"
            then:
              - title: The same item was already scheduled in this step; it shares that encoder run
                source: "vllm/v1/core/sched/scheduler.py:1884-1898"
                set: {vars.dups: "= vars.dups + [vars.i]"}
              - continue: true
          - title: Already encoded and cached from an earlier step? The request takes a reference
            source: "vllm/v1/core/sched/scheduler.py:1917-1920"
            call: encoder-cache-manager.check-and-update-cache
            input: {request_id: "= input.request_id", input_id: "= vars.i", mm_hash: "= vars.f.identifier"}
            as: hit
          - if: "vars.hit.value.cached"
            then: [{continue: true}]
          - call: encoder-cache-manager.can-allocate
            input: {request_id: "= input.request_id", input_id: "= vars.i", num_embeds: "= vars.n_emb", encoder_compute_budget: "= vars.budget", num_embeds_to_schedule: "= vars.embeds"}
            as: room
          - if: "!vars.room.value.can_allocate"
            then:
              - title: Encoder budget or cache exhausted - schedule only the tokens before this item
                detail: "When prefix caching already computed past the item's offset, no token can be scheduled this step."
                source: "vllm/v1/core/sched/scheduler.py:1922-1941"
                set: {vars.nn: "= vars.nc + vars.shift < vars.f.offset ? vars.f.offset - (vars.nc + vars.shift) : 0"}
              - break: true
          - title: Schedule the item's encoder run
            source: "vllm/v1/core/sched/scheduler.py:1962-1966"
            set:
              vars.embeds: "= vars.embeds + vars.n_emb"
              vars.budget: "= vars.budget - vars.n_emb"
              vars.hashes: "= merge(vars.hashes, {vars.f.identifier: vars.n_emb})"
              vars.to_sched: "= vars.to_sched + [vars.i]"
      - return: {encoder_inputs_to_schedule: "= vars.to_sched", num_new_tokens: "= vars.nn", encoder_compute_budget: "= vars.budget", duplicate_encoder_inputs: "= vars.dups"}

  - component: scheduler
    name: allocate-encoder-inputs
    kind: function
    latency_ms: 0
    summary: "Reserve encoder-cache slots for the items scheduled this step; duplicates of an item scheduled earlier in the step only take a reference."
    sources: ["vllm/v1/core/sched/scheduler.py:1775-1787"]
    request:
      type: object
      required: [request_id, mm_features, input_ids]
      properties:
        request_id: {type: string}
        mm_features: {type: array, items: {type: object}}
        input_ids: {type: array, items: {type: integer}}
        duplicate_input_ids: {type: array, items: {type: integer}, default: []}
    response: {type: object, properties: {allocated: {type: integer}}}
    behavior:
      - foreach: "= input.input_ids"
        as: iid
        steps:
          - call: encoder-cache-manager.allocate
            input: {request_id: "= input.request_id", input_id: "= vars.iid", mm_hash: "= input.mm_features[vars.iid].identifier", num_embeds: "= has(input.mm_features[vars.iid].num_embeds) ? input.mm_features[vars.iid].num_embeds : input.mm_features[vars.iid].length"}
      - foreach: "= has(input.duplicate_input_ids) ? input.duplicate_input_ids : []"
        as: did
        steps:
          - call: encoder-cache-manager.check-and-update-cache
            input: {request_id: "= input.request_id", input_id: "= vars.did", mm_hash: "= input.mm_features[vars.did].identifier"}
      - return: {allocated: "= size(input.input_ids)"}

  - component: scheduler
    name: free-encoder-inputs
    kind: function
    latency_ms: 0
    summary: "After a step ran: drop the request's reference to every cached item whose placeholders are now all computed (and past the drafter's look-ahead)."
    sources: ["vllm/v1/core/sched/scheduler.py:2512-2548"]
    request:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string}
    response: {type: object, properties: {freed_input_ids: {type: array, items: {type: integer}}}}
    behavior:
      - set: {vars.r: "= state.requests[input.request_id]"}
      - call: encoder-cache-manager.get-cached-input-ids
        input: {request_id: "= input.request_id"}
        as: ids
      - set:
          vars.frontier: "= vars.r.num_computed_tokens - vars.r.num_output_placeholders"
          vars.freed: []
      - title: Free each processed item once it is behind the computed frontier
        detail: "start_pos + num_tokens + spec_lookahead <= num_computed_tokens - num_output_placeholders: the item is in the decoder KV cache and no rejection or drafter gather can reference it (spec_lookahead is num_prefill_lookahead, 0 here)."
        source: "vllm/v1/core/sched/scheduler.py:2531-2543"
        foreach: "= vars.ids.value.input_ids"
        as: iid
        steps:
          - if: "vars.r.mm_features[vars.iid].offset + vars.r.mm_features[vars.iid].length <= vars.frontier"
            then:
              - call: encoder-cache-manager.free-encoder-input
                input: {request_id: "= input.request_id", input_id: "= vars.iid", mm_hashes: "= vars.r.mm_features.map(f, f.identifier)"}
              - set: {vars.freed: "= vars.freed + [vars.iid]"}
      - return: {freed_input_ids: "= vars.freed"}

  - component: encoder-cache-manager
    name: get-cached-input-ids
    kind: function
    latency_ms: 0
    summary: "The input ids of a request whose embeddings are cached (the request holds a reference)."
    sources: ["vllm/v1/core/encoder_cache_manager.py:242-244"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {input_ids: {type: array, items: {type: integer}}}}
    behavior:
      - return: {input_ids: "= input.request_id in state.request_cached_ids ? state.request_cached_ids[input.request_id] : []"}

  - component: encoder-cache-manager
    name: compute-mm-encoder-budget
    kind: function
    latency_ms: 0
    summary: "The encoder compute budget and the encoder cache size, in tokens: each is max(the SchedulerConfig value, which defaults to max_num_batched_tokens, the largest multimodal item)."
    sources: ["vllm/v1/core/encoder_cache_manager.py:316-361", "vllm/config/scheduler.py:303-304"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [mm_max_toks_per_item]
      properties:
        mm_max_toks_per_item: {type: object, description: "Modality -> the most placeholder tokens one item can take (the model's profiled maximum)", examples: [{image: 16384, video: 16384}]}
        max_num_batched_tokens: {type: [integer, "null"], default: null, description: "null: the max-num-batched-tokens config"}
    response: {type: object, properties: {encoder_compute_budget: {type: integer}, encoder_cache_size: {type: integer}}}
    behavior:
      - set:
          vars.mnbt: "= has(input.max_num_batched_tokens) && input.max_num_batched_tokens != null ? input.max_num_batched_tokens : int(config['max-num-batched-tokens'])"
      - if: "size(input.mm_max_toks_per_item) == 0"
        then:
          - title: Every non-text modality is disabled (limit_mm_per_prompt); no encoder cache
            source: "vllm/v1/core/encoder_cache_manager.py:335-341"
            return: {encoder_compute_budget: 0, encoder_cache_size: 0}
      - set:
          vars.max_item: "= math.greatest(input.mm_max_toks_per_item.transformList(k, v, v))"
      - if: "config['disable-chunked-mm-input'] && vars.max_item > vars.mnbt"
        then:
          - title: An item larger than the batch can't be scheduled without chunking it
            source: "vllm/v1/core/encoder_cache_manager.py:345-354"
            fail: {code: value-error, status: 0, message: "= 'Chunked MM input disabled but max_tokens_per_mm_item (' + string(vars.max_item) + ') is larger than max_num_batched_tokens (' + string(vars.mnbt) + '). Please increase max_num_batched_tokens.'"}
      - title: max(max_num_encoder_input_tokens or encoder_cache_size, the largest item); both default to max_num_batched_tokens
        source: "vllm/v1/core/encoder_cache_manager.py:356-363"
        return: {encoder_compute_budget: "= math.greatest(vars.mnbt, vars.max_item)", encoder_cache_size: "= math.greatest(vars.mnbt, vars.max_item)"}

  - component: scheduler
    name: init-encoder-cache
    kind: function
    latency_ms: 0
    summary: "Scheduler.__init__'s multimodal part: size the encoder compute budget and create the encoder cache from the model's largest item (a text-only model gets 0 and 0)."
    sources: ["vllm/v1/core/sched/scheduler.py:255-285"]
    request:
      type: object
      properties:
        mm_max_toks_per_item: {type: object, default: {}, description: "Empty for a text-only model (no MultiModalBudget)."}
    response: {type: object, properties: {max_num_encoder_input_tokens: {type: integer}, encoder_cache_size: {type: integer}}}
    behavior:
      - set: {vars.budget: 0, vars.size: 0}
      - if: "has(input.mm_max_toks_per_item) && size(input.mm_max_toks_per_item) > 0"
        then:
          - title: A multimodal model has a MultiModalBudget
            source: "vllm/v1/core/sched/scheduler.py:257-260"
            call: encoder-cache-manager.compute-mm-encoder-budget
            input: {mm_max_toks_per_item: "= input.mm_max_toks_per_item"}
            as: b
          - set: {vars.budget: "= vars.b.value.encoder_compute_budget", vars.size: "= vars.b.value.encoder_cache_size"}
      - title: Set the encoder compute budget
        source: "vllm/v1/core/sched/scheduler.py:271-273"
        set: {state.max_num_encoder_input_tokens: "= vars.budget"}
      - title: Create the EncoderCacheManager with the cache size
        source: "vllm/v1/core/sched/scheduler.py:274-285"
        call: encoder-cache-manager.init
        input: {cache_size: "= vars.size"}
      - return: {max_num_encoder_input_tokens: "= vars.budget", encoder_cache_size: "= vars.size"}

  # ===================================================== round 5: the P2P secondary tier
  - component: p2p-secondary-tier-manager
    name: init
    kind: function
    latency_ms: 0
    summary: "Build a P2P tier: reject a backpressure detector and a non-positive unbound-store timeout, bind the control identity host:(port + DP index), and leave the hash seed unresolved."
    sources: ["vllm/v1/kv_offload/tiering/p2p/manager.py:216-334"]
    errors: [{code: value-error, status: 0, retryable: false}]
    request:
      type: object
      required: [tier_id]
      properties:
        tier_id: {type: string, examples: [p2p-0]}
        tier_type: {type: [string, "null"], default: p2p}
        host: {type: [string, "null"], default: null, description: "Defaults to VLLM_P2P_SIDE_CHANNEL_HOST (localhost)."}
        port: {type: [integer, "null"], default: null, description: "Defaults to VLLM_P2P_SIDE_CHANNEL_PORT (5710)."}
        data_parallel_index: {type: integer, default: 0}
        unbound_store_timeout_s: {default: 60.0}
        backpressure_detector: {type: [string, "null"], default: null}
    response: {type: object, properties: {tier_id: {type: string}, local_id: {type: string}}}
    behavior:
      - if: "has(input.backpressure_detector) && input.backpressure_detector != null"
        then:
          - title: The generic store-latency detector can't fail fast for P2P
            source: "vllm/v1/kv_offload/tiering/p2p/manager.py:276-290"
            fail: {code: value-error, status: 0, message: "Backpressure is not supported for the P2P secondary tier. The generic store-latency detector cannot fail fast in PD mode and rendezvous time makes store latency an unreliable pressure signal. Remove the 'backpressure' config from the p2p tier."}
      - set:
          vars.t: "= has(input.unbound_store_timeout_s) ? input.unbound_store_timeout_s : 60.0"
      - if: "!(type(vars.t) == int || type(vars.t) == double) || double(vars.t) <= 0.0"
        then:
          - title: The unbound-store timeout must be a positive number
            source: "vllm/v1/kv_offload/tiering/p2p/manager.py:295-303"
            fail: {code: value-error, status: 0, message: "= 'unbound_store_timeout_s must be a positive number, got ' + (type(vars.t) == string ? \"'\" + vars.t + \"'\" : string(vars.t))"}
      - title: Control identity host:(port + DP index); the seed is resolved on the first session
        detail: "Block hashes chain from NONE_HASH, and the tier is built before init_none_hash runs, so the seed is only known later."
        source: "vllm/v1/kv_offload/tiering/p2p/manager.py:306-333"
        set:
          vars.host: "= has(input.host) && input.host != null ? input.host : 'localhost'"
          vars.port: "= (has(input.port) && input.port != null ? input.port : 5710) + (has(input.data_parallel_index) ? input.data_parallel_index : 0)"
      - set:
          state.tiers: "= merge(state.tiers, {input.tier_id: {'tier_type': has(input.tier_type) && input.tier_type != null ? input.tier_type : 'p2p', 'local_id': vars.host + ':' + string(vars.port), 'hash_seed': null, 'sessions': {}, 'kv_to_session': {}, 'failed_req_ids': [], 'unbound_stores': {}, 'unbound_store_timeout_s': double(vars.t)}})"
      - return: {tier_id: "= input.tier_id", local_id: "= state.tiers[input.tier_id].local_id"}

  - component: p2p-secondary-tier-manager
    name: annotate-req-context
    kind: function
    latency_ms: 0
    summary: "Parse a request's kv_transfer_params once: the consumer side (remote_prefiller, or remote_kv_source for symmetric P2P) gives a source {kv_request_id, peer_id host:port}; the producer side (remote_decoder) gives a dest {kv_request_id}."
    sources: ["vllm/v1/kv_offload/tiering/p2p/manager.py:78-183"]
    request: {type: object, properties: {kv_transfer_params: {type: [object, "null"], default: null}}}
    response: {type: object, properties: {source: {type: [object, "null"]}, dest: {type: [object, "null"]}}}
    behavior:
      - set:
          vars.kv: "= has(input.kv_transfer_params) && input.kv_transfer_params != null ? input.kv_transfer_params : {}"
      - set:
          vars.role: "= 'remote_prefiller' in vars.kv && vars.kv.remote_prefiller != null ? vars.kv.remote_prefiller : ('remote_kv_source' in vars.kv && vars.kv.remote_kv_source != null ? vars.kv.remote_kv_source : dyn(null))"
          vars.probe: "= !('remote_prefiller' in vars.kv && vars.kv.remote_prefiller != null)"
      - title: "Source: the sub-dict must carry remote_host, remote_port and kv_request_id"
        source: "vllm/v1/kv_offload/tiering/p2p/manager.py:141-159"
        set:
          vars.source: "= vars.role != null && size(vars.role) > 0 && 'remote_host' in vars.role && vars.role.remote_host != null && vars.role.remote_host != '' && 'remote_port' in vars.role && vars.role.remote_port != null && vars.role.remote_port != 0 && 'kv_request_id' in vars.role && vars.role.kv_request_id != null && vars.role.kv_request_id != '' ? {'kv_request_id': vars.role.kv_request_id, 'peer_id': vars.role.remote_host + ':' + string(vars.role.remote_port), 'do_probe': vars.probe} : dyn(null)"
      - title: "Dest: a remote_decoder sub-dict (its kv_request_id may be missing)"
        source: "vllm/v1/kv_offload/tiering/p2p/manager.py:162-168"
        set:
          vars.dest: "= 'remote_decoder' in vars.kv && vars.kv.remote_decoder != null ? {'kv_request_id': 'kv_request_id' in vars.kv.remote_decoder && vars.kv.remote_decoder.kv_request_id != '' ? vars.kv.remote_decoder.kv_request_id : dyn(null)} : dyn(null)"
      - return: {source: "= vars.source", dest: "= vars.dest"}

  - component: p2p-secondary-tier-manager
    name: on-request-finished
    kind: function
    latency_ms: 0
    summary: "A request finished: the consumer side finishes it on the session to its producer (by peer id); the producer side finishes it on the session bound to its kv_request_id and unbinds it; an unbound id leaves its parked stores alone."
    sources: ["vllm/v1/kv_offload/tiering/p2p/manager.py:445-479"]
    request:
      type: object
      required: [tier_id]
      properties:
        tier_id: {type: string, examples: [p2p-0]}
        kv_transfer_params: {type: [object, "null"], default: null}
    response: {type: object, properties: {finished_on: {type: [string, "null"]}}}
    behavior:
      - call: p2p-secondary-tier-manager.annotate-req-context
        input: {kv_transfer_params: "= has(input.kv_transfer_params) ? input.kv_transfer_params : dyn(null)"}
        as: ctx
      - set:
          vars.t: "= state.tiers[input.tier_id]"
          vars.kid: "= vars.ctx.value.source != null ? vars.ctx.value.source.kv_request_id : (vars.ctx.value.dest != null ? vars.ctx.value.dest.kv_request_id : dyn(null))"
      - if: "vars.kid == null || vars.kid == ''"
        then:
          - title: Not a P2P request
            source: "vllm/v1/kv_offload/tiering/p2p/manager.py:465-466"
            return: {finished_on: null}
      - set:
          state.tiers: "= merge(state.tiers, {input.tier_id: {'failed_req_ids': vars.t.failed_req_ids.filter(r, r != vars.kid)}})"
      - if: "vars.ctx.value.source != null"
        then:
          - if: "vars.ctx.value.source.peer_id in vars.t.sessions"
            then:
              - title: Consumer side - finish it on the session to the producer (cancel lookups and the inbound load)
                source: "vllm/v1/kv_offload/tiering/p2p/manager.py:469-472"
                set:
                  state.tiers: "= merge(state.tiers, {input.tier_id: {'sessions': merge(vars.t.sessions, {vars.ctx.value.source.peer_id: {'finished': vars.t.sessions[vars.ctx.value.source.peer_id].finished + [vars.kid]}})}})"
              - return: {finished_on: "= vars.ctx.value.source.peer_id"}
          - return: {finished_on: null}
      - if: "vars.kid in vars.t.kv_to_session && vars.t.kv_to_session[vars.kid] in vars.t.sessions"
        then:
          - title: Producer side - pop the session bound to the id and finish it there
            source: "vllm/v1/kv_offload/tiering/p2p/manager.py:475-479"
            set:
              vars.peer: "= vars.t.kv_to_session[vars.kid]"
          - set:
              state.tiers: "= merge(omit(state.tiers, input.tier_id), {input.tier_id: merge(omit(state.tiers[input.tier_id], 'kv_to_session'), {'kv_to_session': omit(vars.t.kv_to_session, vars.kid), 'sessions': merge(vars.t.sessions, {vars.peer: {'finished': vars.t.sessions[vars.peer].finished + [vars.kid]}})})})"
          - return: {finished_on: "= vars.peer"}
      - title: No session bound yet - the parked stores wait for a fetch or the reaper
        source: "vllm/v1/kv_offload/tiering/p2p/manager.py:453-458"
        set:
          state.tiers: "= merge(omit(state.tiers, input.tier_id), {input.tier_id: merge(omit(state.tiers[input.tier_id], 'kv_to_session'), {'kv_to_session': omit(vars.t.kv_to_session, vars.kid)})})"
      - return: {finished_on: null}

  - component: p2p-secondary-tier-manager
    name: get-hash-seed
    kind: function
    latency_ms: 0
    summary: "The seed NONE_HASH was derived from, resolved through get_none_hash_seed on first use and cached."
    sources: ["vllm/v1/kv_offload/tiering/p2p/manager.py:689-693"]
    request: {type: object, required: [tier_id], properties: {tier_id: {type: string, examples: [p2p-0]}}}
    response: {type: object, properties: {seed: {type: string}}}
    behavior:
      - if: "state.tiers[input.tier_id].hash_seed == null"
        then:
          - title: Resolve the seed now (init_none_hash has run by the first session)
            source: "vllm/v1/kv_offload/tiering/p2p/manager.py:691-692"
            call: kv-cache-utils.get-none-hash-seed
            as: s
          - set: {state.tiers: "= merge(state.tiers, {input.tier_id: {'hash_seed': vars.s.value.seed}})"}
      - return: {seed: "= state.tiers[input.tier_id].hash_seed"}

  - component: p2p-secondary-tier-manager
    name: get-or-create-session
    kind: function
    latency_ms: 0
    summary: "Consumer side: reuse the session to peer_id, or open one outbound (capped at VLLM_P2P_MAX_PEERS) that advertises the local hash seed."
    sources: ["vllm/v1/kv_offload/tiering/p2p/manager.py:695-746"]
    request:
      type: object
      required: [tier_id, peer_id]
      properties:
        tier_id: {type: string, examples: [p2p-0]}
        peer_id: {type: string, examples: ["10.0.0.1:8000"]}
        max_peers: {type: integer, default: 128, description: "VLLM_P2P_MAX_PEERS (envs.py:237)."}
    response: {type: object, properties: {peer_id: {type: [string, "null"]}, created: {type: boolean}, local_hash_seed: {type: [string, "null"]}}}
    behavior:
      - if: "input.peer_id in state.tiers[input.tier_id].sessions"
        then:
          - title: Reuse the existing session (a prior load or a peer-initiated inbound one)
            source: "vllm/v1/kv_offload/tiering/p2p/manager.py:708-710"
            return: {peer_id: "= input.peer_id", created: false, local_hash_seed: "= state.tiers[input.tier_id].sessions[input.peer_id].local_hash_seed"}
      - if: "size(state.tiers[input.tier_id].sessions) >= (has(input.max_peers) ? input.max_peers : 128)"
        then:
          - title: Session limit reached; the outbound peer is rejected
            source: "vllm/v1/kv_offload/tiering/p2p/manager.py:712-722"
            return: {peer_id: null, created: false, local_hash_seed: null}
      - call: p2p-secondary-tier-manager.get-hash-seed
        input: {tier_id: "= input.tier_id"}
        as: seed
      - title: Connect and build a session that advertises the local hash seed
        source: "vllm/v1/kv_offload/tiering/p2p/manager.py:724-746"
        set:
          state.tiers: "= merge(state.tiers, {input.tier_id: {'sessions': merge(state.tiers[input.tier_id].sessions, {input.peer_id: {'connected': true, 'local_hash_seed': vars.seed.value.seed, 'finished': []}})}})"
      - return: {peer_id: "= input.peer_id", created: true, local_hash_seed: "= vars.seed.value.seed"}

  # ===================================================== round 5: reading the waiting queue
  - component: scheduler
    name: iter-waiting
    kind: function
    latency_ms: 0
    summary: "Iterate the waiting queue in policy order (list(scheduler.waiting)): FCFS in deque order; priority by popping a copy of the heap, so (priority, arrival_time, request_id) ascending."
    sources: ["vllm/v1/core/sched/request_queue.py:126-128", "vllm/v1/core/sched/request_queue.py:193-197", "vllm/v1/request.py:357-367"]
    request: {type: object}
    response: {type: object, properties: {request_ids: {type: array, items: {type: string}}, priorities: {type: array, items: {type: integer}}}}
    behavior:
      - if: "config['scheduling-policy'] != 'priority'"
        then:
          - title: FCFS - the deque's own order
            source: "vllm/v1/core/sched/request_queue.py:126-128"
            return: {request_ids: "= state.waiting", priorities: "= state.waiting.map(id, state.requests[id].priority)"}
      - title: Priority - a heap copy popped to empty; Request.__lt__ orders by priority, then arrival_time, then request_id
        source: "vllm/v1/core/sched/request_queue.py:193-197"
        set:
          vars.rank: "= state.waiting.map(id, size(state.waiting.filter(o, state.requests[o].priority < state.requests[id].priority || (state.requests[o].priority == state.requests[id].priority && (state.requests[o].arrival_time < state.requests[id].arrival_time || (state.requests[o].arrival_time == state.requests[id].arrival_time && o < id))))))"
      - set:
          vars.ordered: "= lists.range(size(state.waiting)).map(k, state.waiting[vars.rank.indexOf(k)])"
      - return: {request_ids: "= vars.ordered", priorities: "= vars.ordered.map(id, state.requests[id].priority)"}

  # ===================================================== merge: the single-type managers' block sizes
  - component: kv-cache-manager
    name: get-group-block-sizes
    kind: function
    latency_ms: 0
    summary: "kv_cache_manager.coordinator.single_type_managers, one per KV cache group: each manager's block_size is the spec's block size times the DCP world size when DCP shards the spec (every attention spec kind; a Mamba spec doesn't), and its spec kind and sliding window."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:100-108", "vllm/v1/kv_cache_interface.py:164-171", "vllm/v1/kv_cache_interface.py:510-512", "vllm/v1/core/sched/scheduler.py:210-211"]
    request: {type: object, properties: {}}
    response:
      type: array
      items: {type: object, properties: {kind: {type: string}, block_size: {type: integer}, sliding_window: {type: ["integer", "null"]}, dcp_world_size: {type: integer}}}
    behavior:
      - set: {vars.dcp: "= int(config['decode-context-parallel-size'])"}
      - title: "self.dcp_world_size = dcp_world_size if kv_cache_spec.dcp_sharded else 1; self.block_size = kv_cache_spec.block_size * self.dcp_world_size (AttentionSpec sets dcp_sharded; KVCacheSpec defaults it off)"
        source: "vllm/v1/core/single_type_kv_cache_manager.py:106-108"
        return: "= state.kv_cache_groups.map(g, {'kind': g.kind, 'block_size': g.block_size * (g.kind == 'mamba' ? 1 : vars.dcp), 'sliding_window': has(g.sliding_window) ? g.sliding_window : null, 'dcp_world_size': g.kind == 'mamba' ? 1 : vars.dcp})"

  # ===================================================== round 6: deferred block free, prefill stats
  - component: scheduler
    name: defer-block-free-enabled
    kind: function
    latency_ms: 0
    summary: "Scheduler.defer_block_free: a KV-consumer connector (kv_role kv_consumer or kv_both) with more than one batch in flight (VllmConfig.max_concurrent_batches > 1) defers returning a freed request's blocks to the pool until the steps that may still write them have been processed."
    description: >-
      max_concurrent_batches is PP; with async scheduling it is PP + 1 on the V2 runner, and 2 on
      the V1 runner without PP (the V1 runner doesn't overlap with PP, so PP stays). The flag is set
      once in Scheduler.__init__; the model derives it from the configs on each read.
    sources: ["vllm/v1/core/sched/scheduler.py:185-192", "vllm/config/vllm.py:577-587", "vllm/config/kv_transfer.py:12", "vllm/config/kv_transfer.py:134-136"]
    request: {type: object}
    response: {type: boolean, examples: [false]}
    behavior:
      - set:
          vars.pp: "= 'pipeline-parallel-size' in config && config['pipeline-parallel-size'] != null ? int(config['pipeline-parallel-size']) : 1"
      - title: max_concurrent_batches
        source: "vllm/config/vllm.py:577-587"
        set:
          vars.mcb: "= config['async-scheduling'] == true ? (config['use-v2-model-runner'] ? vars.pp + 1 : (vars.pp <= 1 ? 2 : vars.pp)) : vars.pp"
      - title: Multiple in-flight batches and a KV-consumer connector
        source: "vllm/v1/core/sched/scheduler.py:186-192"
        return: "= config['kv-connector'] != '' && 'kv-role' in config && config['kv-role'] in ['kv_consumer', 'kv_both'] && vars.mcb > 1"

  - component: scheduler
    name: free-request-blocks
    kind: function
    latency_ms: 0
    summary: "_free_request_blocks: free a finished or preempted request's KV blocks now, or, while a step scheduled with them may still be writing them (deferred block free), pop them from the block table and park them behind the newest scheduled step's fence."
    sources: ["vllm/v1/core/sched/scheduler.py:2759-2776", "vllm/v1/core/kv_cache_manager.py:651-663"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {deferred: {type: boolean}, num_blocks: {type: integer}}}
    behavior:
      - call: scheduler.defer-block-free-enabled
        as: dbf
      - set:
          vars.last: "= input.request_id in state.requests && has(state.requests[input.request_id].last_sched_seq) ? state.requests[input.request_id].last_sched_seq : 0"
          vars.processed: "= has(state.processed_step_seq) ? state.processed_step_seq : 0"
      - if: "!vars.dbf.value || vars.last <= vars.processed"
        then:
          - title: _request_blocks_can_be_freed - return the blocks to the pool now
            source: "vllm/v1/core/sched/scheduler.py:2759-2771"
            call: kv-cache-manager.free
            input: {request_id: "= input.request_id"}
            as: f
          - return: {deferred: false, num_blocks: "= vars.f.value.freed"}
      - title: An in-flight step may still write these blocks - pop them and defer the free to the newest scheduled step's fence
        source: "vllm/v1/core/sched/scheduler.py:2772-2775"
        call: kv-cache-manager.pop-blocks-for-free
        input: {request_id: "= input.request_id"}
        as: pop
      - if: "size(vars.pop.value.block_ids) > 0"
        then:
          - set:
              state.deferred_frees: "= (has(state.deferred_frees) ? state.deferred_frees : []) + [{'fence': has(state.sched_step_seq) ? state.sched_step_seq : 0, 'block_ids': vars.pop.value.block_ids}]"
      - return: {deferred: true, num_blocks: "= size(vars.pop.value.block_ids)"}

  - component: scheduler
    name: drain-deferred-frees
    kind: function
    latency_ms: 0
    summary: "_drain_deferred_frees: return the deferred blocks whose fence step has been processed, in fence order, stopping at the first pending fence; each entry is freed in reverse so tail blocks are evicted first."
    sources: ["vllm/v1/core/sched/scheduler.py:2786-2801"]
    request: {type: object}
    response: {type: object, properties: {num_freed: {type: integer}}}
    behavior:
      - set:
          vars.q: "= has(state.deferred_frees) ? state.deferred_frees : []"
          vars.processed: "= has(state.processed_step_seq) ? state.processed_step_seq : 0"
      - title: The leading entries whose fence passed (stop at the first pending one)
        source: "vllm/v1/core/sched/scheduler.py:2793-2797"
        set:
          vars.n: "= lists.range(size(vars.q)).exists(i, vars.q[i].fence > vars.processed) ? lists.range(size(vars.q)).filter(i, vars.q[i].fence > vars.processed)[0] : size(vars.q)"
      - foreach: "= vars.q.slice(0, vars.n)"
        as: e
        steps:
          - title: Free in reverse order so that the tail blocks are evicted first
            source: "vllm/v1/core/sched/scheduler.py:2798-2801"
            call: block-pool.free-blocks
            input: {block_ids: "= vars.e.block_ids.reverse()"}
      - set:
          state.deferred_frees: "= vars.q.slice(vars.n, size(vars.q))"
      - return: {num_freed: "= sum(vars.q.slice(0, vars.n).map(e, size(e.block_ids)))"}

  - component: full-attention-manager
    name: pop-blocks-for-free
    kind: function
    latency_ms: 0
    summary: "Pop a request's block table and cached-block count without returning the blocks to the pool; the caller frees them later, in reverse."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:562-580"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - set:
          vars.blocks: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"
      - set:
          state.req_to_blocks: "= omit(state.req_to_blocks, input.request_id)"
          state.num_cached_block: "= omit(state.num_cached_block, input.request_id)"
      - return: {block_ids: "= vars.blocks"}

  - component: full-attention-manager
    name: get-num-cached-blocks
    kind: function
    latency_ms: 0
    summary: "How many of a request's blocks are cached (hashed) in the prefix cache: num_cached_block."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:476-534", "vllm/v1/core/kv_cache_utils.py:205-219"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {num_cached_blocks: {type: integer}}}
    behavior:
      - return: {num_cached_blocks: "= input.request_id in state.num_cached_block ? state.num_cached_block[input.request_id] : 0"}

  - component: kv-cache-manager
    name: pop-blocks-for-free
    kind: function
    latency_ms: 0
    summary: "KVCacheManager.pop_blocks_for_free: pop the request's bookkeeping and return its blocks (allocation order) without freeing them (coordinator -> each group's manager)."
    sources: ["vllm/v1/core/kv_cache_manager.py:651-663", "vllm/v1/core/kv_cache_coordinator.py:410-427"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - call: full-attention-manager.pop-blocks-for-free
        input: {request_id: "= input.request_id"}
        as: p
      - set: {vars.hybrid_blocks: []}
      - if: "size(state.kv_cache_groups) > 1"
        then:
          - title: "Hybrid: every single-type manager gives its blocks up too, in group order, so the Mamba state and checkpoint blocks wait behind the same fence"
            source: "vllm/v1/core/kv_cache_coordinator.py:424-427"
            call: mamba-manager.pop-blocks-for-free
            input: {request_id: "= input.request_id"}
            as: pm
          - set: {vars.hybrid_blocks: "= vars.pm.value.block_ids"}
      - return: {block_ids: "= vars.p.value.block_ids + vars.hybrid_blocks"}

  - component: mamba-manager
    name: pop-blocks-for-free
    kind: function
    latency_ms: 0
    summary: "MambaManager.pop_blocks_for_free: in align mode drop the per-request state bookkeeping, then pop the state and checkpoint blocks without returning them to the pool (the same blocks free would return, newest first)."
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1935-1952"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - set: {vars.blocks: "= input.request_id in state.req_to_blocks ? state.req_to_blocks[input.request_id] : []"}
      - set:
          state.req_to_blocks: "= omit(state.req_to_blocks, input.request_id)"
          state.num_cached_block: "= omit(state.num_cached_block, input.request_id)"
      - return: {block_ids: "= vars.blocks"}

  - component: kv-cache-manager
    name: estimate-cached-tokens
    kind: function
    latency_ms: 0
    summary: "estimate_cached_tokens: the tokens the request's prefix-cacheable blocks hold in the prefix cache (the largest block_hash_num_tokens of its blocks; the minimum over groups)."
    description: "A full-attention block's block_hash_num_tokens is the prefix length its hash covers, so the largest is num_cached_block * block_size. 0 with prefix caching off (nothing is hashed into the cache)."
    sources: ["vllm/v1/core/kv_cache_manager.py:751-780"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string}}}
    response: {type: object, properties: {num_cached_tokens: {type: integer}}}
    behavior:
      - call: full-attention-manager.get-num-cached-blocks
        input: {request_id: "= input.request_id"}
        as: n
      - return: {num_cached_tokens: "= vars.n.value.num_cached_blocks * int(config['block-size'])"}

  - component: block-pool
    name: emit-cached-block-events
    kind: function
    latency_ms: 0
    summary: "emit_cached_block_events: one BlockStored for blocks a request reused from the prefix cache (kv_cache_report_mode full), without touching block state; parent None (a hit is a prefix from block 0), token ids of the hit blocks."
    sources: ["vllm/v1/core/block_pool.py:379-448", "vllm/v1/core/kv_cache_coordinator.py:379-392"]
    request:
      type: object
      required: [block_hashes, num_cached_blocks]
      properties:
        block_hashes: {type: array, items: {type: string}, description: "request.block_hashes"}
        num_cached_blocks: {type: integer}
        token_ids: {type: [array, "null"], default: null}
        lora_request: {type: [object, "null"], default: null}
        group_idx: {type: integer, default: 0}
    response: {type: object, properties: {emitted: {type: boolean}}}
    behavior:
      - if: "!config['enable-kv-cache-events'] || input.num_cached_blocks == 0"
        then:
          - title: Events off or no hit - nothing to announce
            source: "vllm/v1/core/block_pool.py:399-400"
            return: {emitted: false}
      - set:
          vars.n: "= math.least(input.num_cached_blocks, size(input.block_hashes))"
      - title: Queue one BlockStored for the reused blocks
        source: "vllm/v1/core/block_pool.py:420-448"
        set:
          state.kv_event_queue: "= state.kv_event_queue + [{'type': 'BlockStored', 'block_hashes': input.block_hashes.slice(0, vars.n), 'parent_block_hash': null, 'token_ids': has(input.token_ids) && input.token_ids != null ? input.token_ids.slice(0, math.least(vars.n * int(config['block-size']), size(input.token_ids))) : dyn(null), 'block_size': int(config['block-size']), 'lora_id': has(input.lora_request) && input.lora_request != null ? input.lora_request.lora_int_id : dyn(null), 'medium': 'GPU', 'lora_name': has(input.lora_request) && input.lora_request != null ? input.lora_request.lora_name : dyn(null), 'extra_keys': null, 'group_idx': has(input.group_idx) ? input.group_idx : 0, 'session_id': null}]"
      - return: {emitted: true}

  # ----------------------------------------------- round 6 (coverage_gaps): evicting blocks by id
  - component: block-pool
    name: evict-blocks
    kind: function
    latency_ms: 0
    summary: "BlockPool.evict_blocks: drop the prefix-cache hash of each given block (a block still referenced stays allocated; a free one keeps its queue position), queueing one BlockRemoved per dropped hash; an id past the pool is a connector bug (assertion)."
    sources: ["vllm/v1/core/block_pool.py:807-825", "vllm/v1/core/block_pool.py:729-750", "vllm/v1/core/block_pool.py:605-618"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, required: [block_ids], properties: {block_ids: {type: array, items: {type: integer}, examples: [[3, 4]]}}}
    response: {type: object, properties: {evicted_hashes: {type: array, items: {type: string}}}}
    behavior:
      - if: "input.block_ids.exists(b, b >= state.num_gpu_blocks)"
        then:
          - title: A block id the scheduler never allocated
            source: "vllm/v1/core/block_pool.py:819-823"
            fail: {code: assertion-error, status: 0, message: "= 'Invalid block_id ' + string(input.block_ids.filter(b, b >= state.num_gpu_blocks)[0]) + ' >= ' + string(state.num_gpu_blocks) + '. This indicates a bug in the KV connector - workers should only report block IDs that were allocated by the scheduler.'"}
      - set:
          vars.ids: "= lists.range(size(input.block_ids)).filter(i, !lists.range(i).exists(j, input.block_ids[j] == input.block_ids[i])).map(i, input.block_ids[i])"
      - set:
          vars.evicted: "= vars.ids.filter(b, string(b) in state.block_hash).map(b, state.block_hash[string(b)])"
      - title: _maybe_evict_cached_block - reset each cached block's hash and drop it from the hash map
        source: "vllm/v1/core/block_pool.py:729-750"
        set:
          state.cached: "= state.cached.transformMap(h, b, !(h in vars.evicted) || !(b in vars.ids), b)"
          state.block_hash: "= state.block_hash.transformMap(k, h, !(int(k) in vars.ids), h)"
          state.hash_tokens: "= state.hash_tokens.transformMap(k, n, !(int(k) in vars.ids), n)"
      - if: "config['enable-kv-cache-events'] && size(vars.evicted) > 0"
        then:
          - title: One BlockRemoved per evicted hash
            source: "vllm/v1/core/block_pool.py:605-618"
            set: {state.kv_event_queue: "= state.kv_event_queue + vars.evicted.map(h, {'type': 'BlockRemoved', 'block_hashes': [h], 'medium': 'GPU', 'group_idx': 0})"}
      - return: {evicted_hashes: "= vars.evicted"}

  - component: kv-cache-manager
    name: evict-blocks
    kind: function
    latency_ms: 0
    summary: "KVCacheManager.evict_blocks: evict blocks from the prefix cache by id (the scheduler does it for blocks a KV load failed to fill, so no later request hits them)."
    sources: ["vllm/v1/core/kv_cache_manager.py:665-672", "vllm/v1/core/sched/scheduler.py:3405-3414"]
    errors: [{code: assertion-error, status: 0, retryable: false}]
    request: {type: object, required: [block_ids], properties: {block_ids: {type: array, items: {type: integer}, examples: [[3, 4]]}}}
    response: {type: object, properties: {evicted_hashes: {type: array, items: {type: string}}}}
    behavior:
      - call: block-pool.evict-blocks
        input: {block_ids: "= input.block_ids"}
        as: e
      - return: {evicted_hashes: "= vars.e.value.evicted_hashes"}

flows:
  - id: scheduler-add-request
    name: Scheduler admits a request
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.add-request}
    sources: ["vllm/v1/core/sched/scheduler.py:2616-2647"]
  - id: scheduler-schedule
    name: One scheduler step (continuous batching)
    tags: [writes, "feature:continuous-batching", "feature:chunked-prefill", "feature:prefix-caching", "feature:preemption", "feature:priority-scheduling"]
    entry: {caller: engine-core, interface: scheduler.schedule}
    sources: ["vllm/v1/core/sched/scheduler.py:591-1556"]
  - id: scheduler-update-from-output
    name: Apply a step's model output
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.update-from-output}
    sources: ["vllm/v1/core/sched/scheduler.py:2026-2424"]
  - id: scheduler-finish-requests
    name: Abort or finish requests from outside the scheduler
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.finish-requests}
    sources: ["vllm/v1/core/sched/scheduler.py:2649-2712"]
  - id: scheduler-reset-prefix-cache
    name: Reset the prefix cache
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.reset-prefix-cache}
    sources: ["vllm/v1/core/sched/scheduler.py:2840-2883"]
  - id: scheduler-make-stats
    name: Scheduler stats (running, waiting, KV usage, prefix-cache hits)
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.make-stats}
    sources: ["vllm/v1/core/sched/scheduler.py:2915-2959"]
  - id: structured-output-grammar-init
    name: Compile a structured-output grammar
    tags: [writes, "feature:structured-outputs"]
    entry: {caller: engine-core, interface: structured-output-manager.grammar-init}
    sources: ["vllm/v1/structured_output/__init__.py:126-187"]
  - id: kv-offload-pin-mmap-region
    name: Pin the CPU offload region
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: kv-offload-cpu-gpu-worker.pin-mmap-region}
    sources: ["vllm/v1/kv_offload/cpu/gpu_worker.py:201-240", "vllm/v1/kv_offload/cpu/host_register.py:33-97"]
  - id: kv-offload-worker-view
    name: Carve a worker view of the shared offload region
    tags: [writes]
    entry: {caller: kv-offload, interface: shared-offload-region.create-next-worker-view}
    sources: ["vllm/v1/kv_offload/cpu/shared_offload_region.py:245-283"]
  - id: kv-offload-swap-blocks
    name: Batched CPU->GPU block swap
    tags: ["feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: swap-blocks-triton.swap-blocks-batch}
    sources: ["vllm/v1/kv_offload/cpu/swap_blocks_triton.py:49-74"]
  - id: kv-offload-dma-copy-loop
    name: DmaCopyBackend copy thread (busy loop)
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: dma-copy-backend.copy-loop, repeat: {count: 4, interval_ms: 0}}
    sources: ["vllm/v1/simple_kv_offload/copy_backend.py:103-130"]
  - id: kv-offload-disk-store-loop
    name: DiskBackend store thread (busy loop)
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: disk-store-thread.store-loop, repeat: {count: 3, interval_ms: 0}}
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:236-252"]
  - id: kv-offload-disk-load-loop
    name: DiskBackend load thread (busy loop)
    tags: [writes, "feature:kv-cpu-offload"]
    entry: {caller: kv-offload, interface: disk-load-thread.load-loop, repeat: {count: 3, interval_ms: 0}}
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:270-286"]
  - id: kv-offload-async-lookup-worker
    name: AsyncLookupManager lookup thread (busy loop)
    tags: [writes]
    entry: {caller: kv-offload, interface: async-lookup-manager.worker, repeat: {count: 2, interval_ms: 0}}
    sources: ["vllm/v1/kv_offload/tiering/async_lookup.py:248-284"]
  - id: kv-offload-fs-io-worker
    name: DualQueueThreadPool IO thread (busy loop)
    tags: [writes]
    entry: {caller: kv-offload, interface: dual-queue-thread-pool.worker, repeat: {count: 4, interval_ms: 0}}
    sources: ["vllm/v1/kv_offload/tiering/fs/thread_pool.py:162-194"]
  - id: scheduler-schedule-hybrid
    name: A scheduler step on a hybrid (attention + Mamba) model
    description: "Same entry as scheduler-schedule, run with two KV cache groups so the HybridKVCacheCoordinator and MambaManager decide the prefix hit."
    tags: [writes, "feature:hybrid-kv-cache"]
    entry: {caller: engine-core, interface: scheduler.schedule}
    sources: ["vllm/v1/core/sched/scheduler.py:591-1556", "vllm/v1/core/kv_cache_coordinator.py:796-935"]
  - id: structured-output-validate-outlines
    name: Validate a structured-output request for the outlines backend
    tags: ["feature:structured-outputs"]
    entry: {caller: engine-core, interface: backend-outlines.validate-structured-output-request-outlines}
    sources: ["vllm/v1/structured_output/backend_outlines.py:195-238"]
  - id: scheduler-update-draft-token-ids
    name: Store the drafter's draft tokens (sync speculative decoding)
    tags: [writes]
    entry: {caller: engine-core, interface: scheduler.update-draft-token-ids}
    sources: ["vllm/v1/core/sched/scheduler.py:2550-2569"]
  - id: structured-output-validate-xgrammar
    name: Validate a structured-output request for the xgrammar backend
    tags: ["feature:structured-outputs"]
    entry: {caller: engine-core, interface: xgrammar-backend.validate-xgrammar-grammar}
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:407-504"]

