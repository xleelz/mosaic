# scheduler-kv fragment of the vLLM v0.32.0 ontology (built from code).
# Generated by examples/vllm/gen/scheduler-kv/build.sh from body.yaml, fixtures.py and
# scenarios.yaml; edit those, not this file.
#
# Owns: the scheduler step (continuous batching, chunked prefill, token and sequence
# budgets, preemption and recompute, FCFS and priority policy), the KV cache manager
# and block pool (block tables, prefix cache), request state, KV offload helpers and
# structured-output grammar bookkeeping.
schema_version: 1
id: vllm

configs:
  - id: max-num-seqs
    type: integer
    value: 1024
    default: 128
    summary: "max_num_seqs: the most requests admitted into RUNNING (max_num_active_seqs defaults to it)"
    description: >-
      Deployed 1024 differs from the SchedulerConfig default 128. `vllm serve` passes
      UsageContext.OPENAI_API_SERVER, EngineArgs.max_num_seqs is None, and
      get_batch_defaults picks 1024 for a GPU with >= 70 GiB that is not an A100 (the fixture's
      NVIDIA H100 80GB HBM3; an A100-80GB would get 256). 128 is only the
      CPU-platform default (128 * world_size) and the bare SchedulerConfig default.
    sources: ["vllm/config/scheduler.py:43", "vllm/config/scheduler.py:62", "vllm/engine/arg_utils.py:2934-2942", "vllm/engine/arg_utils.py:3123-3127", "vllm/v1/core/sched/scheduler.py:128-135"]
    attributes: {key: max_num_seqs}
  - id: max-num-batched-tokens
    type: integer
    value: 8192
    default: 2048
    summary: "max_num_batched_tokens: the token budget of one scheduler step"
    description: >-
      Deployed 8192 differs from the SchedulerConfig default 2048: get_batch_defaults gives
      OPENAI_API_SERVER 8192 on a >= 70 GiB non-A100 GPU (2048 on other GPUs). With chunked
      prefill on it is not raised to max_model_len; it is capped at max_num_seqs * max_model_len.
    sources: ["vllm/config/scheduler.py:41", "vllm/config/scheduler.py:48", "vllm/engine/arg_utils.py:2934-2942", "vllm/engine/arg_utils.py:3112-3121", "vllm/v1/core/sched/scheduler.py:136-140"]
    attributes: {key: max_num_batched_tokens}
  - id: enable-chunked-prefill
    type: boolean
    value: true
    default: true
    summary: "enable_chunked_prefill: split long prefills across steps to fit the token budget"
    description: "EngineArgs leaves it None and resolves it to model_config.is_chunked_prefill_supported (true for Llama)."
    sources: ["vllm/config/scheduler.py:134", "vllm/engine/arg_utils.py:2993-2994", "vllm/v1/core/sched/scheduler.py:1158-1167"]
    attributes: {key: enable_chunked_prefill}
  - id: enable-prefix-caching
    type: boolean
    value: true
    default: true
    summary: "enable_prefix_caching: reuse cached full KV blocks by chained block hash"
    description: "EngineArgs leaves it None and resolves it to model_config.is_prefix_caching_supported (true for Llama)."
    sources: ["vllm/config/cache.py:141", "vllm/engine/arg_utils.py:3021-3022", "vllm/v1/core/kv_cache_manager.py:249-251"]
    attributes: {key: enable_prefix_caching}
  - id: block-size
    type: integer
    value: 16
    default: 16
    summary: "block_size: tokens per KV cache block"
    sources: ["vllm/config/cache.py:70", "vllm/config/cache.py:344-345", "vllm/v1/core/single_type_kv_cache_manager.py:214"]
    attributes: {key: block_size}
  - id: scheduling-policy
    type: string
    value: fcfs
    default: fcfs
    summary: "scheduling_policy (SchedulerConfig.policy): fcfs or priority"
    description: "Engine arg --scheduling-policy (EngineArgs.scheduling_policy) sets SchedulerConfig.policy; attributes.key keeps the fixture reference's 'policy'."
    sources: ["vllm/config/scheduler.py:159", "vllm/engine/arg_utils.py:749", "vllm/v1/core/sched/scheduler.py:216-221"]
    attributes: {key: policy}
  - id: long-prefill-token-threshold
    type: integer
    value: 0
    default: 0
    summary: "long_prefill_token_threshold: cap on one request's prefill chunk per step (0 = off; ignored when only one request is eligible)"
    sources: ["vllm/config/scheduler.py:79", "vllm/engine/arg_utils.py:600", "vllm/v1/core/sched/scheduler.py:643-650"]
    attributes: {key: long_prefill_token_threshold}
  - id: long-prefill-token-threshold-adaptive
    type: boolean
    value: false
    default: false
    summary: "long_prefill_token_threshold_adaptive: floor the long-prefill cap at max_num_batched_tokens // (running + waiting), so it never cuts a request below its fair share of the budget"
    sources: ["vllm/config/scheduler.py:86", "vllm/v1/core/sched/scheduler.py:142-144", "vllm/v1/core/sched/scheduler.py:650-655"]
    attributes: {key: long_prefill_token_threshold_adaptive}
  - id: disable-chunked-mm-input
    type: boolean
    value: false
    default: false
    summary: "disable_chunked_mm_input: never schedule part of a multimodal item; a chunk that would cut one is rolled back to just before it (forced on for encoder-decoder models)"
    sources: ["vllm/config/scheduler.py:167", "vllm/config/scheduler.py:292-295", "vllm/v1/core/sched/scheduler.py:1866-1881"]
    attributes: {key: disable_chunked_mm_input}
  - id: watermark
    type: number
    value: 0.0
    default: 0.0
    summary: "watermark: fraction of KV blocks kept free when admitting waiting or preempted requests (0 disables it)"
    sources: ["vllm/config/scheduler.py:196", "vllm/engine/arg_utils.py:701", "vllm/v1/core/kv_cache_manager.py:204-207"]
    attributes: {key: watermark}
  - id: scheduler-reserve-full-isl
    type: boolean
    value: true
    default: true
    summary: "scheduler_reserve_full_isl: admit a waiting request only if its whole prompt fits in free blocks, not just its first chunk"
    sources: ["vllm/config/scheduler.py:190", "vllm/engine/arg_utils.py:698", "vllm/v1/core/kv_cache_manager.py:522-540"]
    attributes: {key: scheduler_reserve_full_isl}
  - id: async-scheduling
    type: boolean
    value: true
    default: null
    summary: "async_scheduling: AsyncScheduler overlaps the next schedule with the running step (output placeholders)"
    description: >-
      Deployed true differs from the code default None: VllmConfig resolves None to True for a
      generate model with no incompatible speculative config, a supporting executor and no PP
      on the V1 runner. get_scheduler_cls then picks AsyncScheduler.
    sources: ["vllm/config/scheduler.py:208", "vllm/config/vllm.py:1585-1644", "vllm/config/scheduler.py:229-233", "vllm/v1/core/sched/async_scheduler.py:25-57"]
    attributes: {key: async_scheduling}
  - id: num-gpu-blocks-override
    type: integer
    value: null
    default: null
    summary: "num_gpu_blocks_override: fixes the KV block count instead of the profiled one (used to test preemption)"
    sources: ["vllm/config/cache.py:135", "vllm/v1/core/kv_cache_utils.py:1230-1236"]
    attributes: {key: num_gpu_blocks_override}
  - id: use-v2-model-runner
    type: boolean
    value: true
    default: true
    summary: "VllmConfig.use_v2_model_runner: true for Llama on CUDA with Triton; resumed requests are then sent as new requests"
    sources: ["vllm/config/vllm.py:703-738", "vllm/v1/core/sched/scheduler.py:1418-1430"]
    attributes: {boundary: true, owner: config-platform, key: use_v2_model_runner}
  - {id: num-speculative-tokens, type: integer, value: 0, default: 0, summary: "speculative_config.num_speculative_tokens; 0 without speculative decoding", sources: ["vllm/config/speculative.py:393"], attributes: {boundary: true, owner: config-platform, key: speculative_config.num_speculative_tokens, none_is: 0}}
  - {id: speculative-method, type: string, value: "", default: "", summary: "speculative_config.method ('' = no speculative decoding)", sources: ["vllm/config/speculative.py:399"], attributes: {boundary: true, owner: config-platform, key: speculative_config.method, none_is: ""}}
  - {id: kv-connector, type: string, value: "", default: "", summary: "kv_transfer_config.kv_connector ('' = no connector)", sources: ["vllm/config/kv_transfer.py:60"], attributes: {boundary: true, owner: distributed, key: kv_transfer_config.kv_connector}}
  - {id: enable-lora, type: boolean, value: false, default: false, summary: enable_lora, sources: ["vllm/engine/arg_utils.py:676"], attributes: {key: enable_lora, boundary: true, owner: config-platform}}
  - {id: max-loras, type: integer, value: 1, default: 1, summary: "max_loras: GPU LoRA slots per batch. Deployed = default (LoRA itself is off unless --enable-lora).", sources: ["vllm/config/lora.py:35", "vllm/engine/arg_utils.py:677"], attributes: {key: max_loras, boundary: true, owner: models-layers}}
  - {id: disable-log-stats, type: boolean, value: false, default: false, summary: "disable_log_stats: false for vllm serve, so AsyncLLM/LLMEngine log_stats is true and the StatLoggerManager records each step. The offline LLM class overrides it to true unless the caller passes it (vllm/entrypoints/llm.py:226-227).", sources: ["vllm/engine/arg_utils.py:612", "vllm/v1/engine/async_llm.py:287"], attributes: {key: disable_log_stats, boundary: true, owner: engine-core}}
  - {id: mm-encoder-only, type: boolean, value: false, default: false, summary: "MultiModalConfig.mm_encoder_only (--mm-encoder-only, or set for a dedicated EC producer): the instance runs only the multimodal encoder and publishes embeddings, so the scheduler finishes a request once its prompt is consumed, without sampling.", sources: ["vllm/config/vllm.py:567-574", "vllm/config/vllm.py:2778-2790", "vllm/v1/core/sched/scheduler.py:116"], attributes: {key: mm_encoder_only, boundary: true, owner: config-platform}}
  - {id: enable-kv-cache-events, type: boolean, value: false, default: false, summary: "kv_events_config.enable_kv_cache_events: off unless --kv-events-config enables it; then the scheduler's EventPublisherFactory builds a ZMQ publisher.", sources: ["vllm/config/kv_events.py:14", "vllm/engine/arg_utils.py:771"], attributes: {key: kv_events_config.enable_kv_cache_events, boundary: true, owner: distributed}}
  - {id: vllm-regex-compilation-timeout-s, type: integer, value: 5, default: 5, summary: "VLLM_REGEX_COMPILATION_TIMEOUT_S: seconds a regex compile may take (0 disables the guard)", sources: ["vllm/envs.py:1710-1711"], attributes: {boundary: true, owner: config-platform, key: VLLM_REGEX_COMPILATION_TIMEOUT_S}}
  - id: scheduler-kv-redos-compile-ms
    type: integer
    value: 60000
    default: 60000
    summary: "ASSUMPTION: time the regex compiler spends on a nested-quantifier pattern such as (a+)+b (exponential DFA blow-up); ordinary patterns take 2 ms. The code gives no number."
    sources: ["vllm/v1/structured_output/utils.py:62-98"]
    attributes: {assumption: true}
  - id: scheduler-kv-host-device-bytes-per-ms
    type: integer
    value: 20000000
    default: 20000000
    summary: "ASSUMPTION: GPU<->pinned-host copy bandwidth, 20 GB/s (PCIe Gen4 x16 in practice); the code gives no number"
    sources: ["vllm/v1/simple_kv_offload/cuda_mem_ops.py:1-40"]
    attributes: {assumption: true}
  - id: scheduler-kv-nvme-bytes-per-ms
    type: integer
    value: 3000000
    default: 3000000
    summary: "ASSUMPTION: O_DIRECT NVMe throughput for pwritev/preadv, 3 GB/s; the code gives no number"
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:254-268"]
    attributes: {assumption: true}

components:
  # ---------------------------------------------------------------- scheduler
  - id: scheduler
    name: Scheduler (AsyncScheduler when async scheduling is on)
    kind: module
    parent: engine-core
    layer: scheduling
    summary: "The engine core's scheduler: owns request state, the waiting and running queues, and decides each step's batch. The engine-core busy loop (vllm/v1/engine/core.py:1547-1556) is the only thread that calls the scheduler and its KV cache manager, one step at a time; capacity 1 models that serial owner."
    description: >-
      Owns the shared datum "request state" (status, num_computed_tokens, output tokens).
      Requests live in state.requests keyed by request_id; state.waiting and state.running
      hold ids in queue order. Readers (engine-core, worker-runner) see it only through
      add-request, schedule (SchedulerOutput), update-from-output, finish-requests,
      get-request-counts and make-stats.
    attributes: {single_writer: "The engine-core busy-loop thread is the only caller: other threads only put requests on the mutex-guarded input_queue, which the busy loop drains before each step (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/core/sched/scheduler.py:84-442", "vllm/v1/core/sched/async_scheduler.py:14-23"]
    state:
      schema:
        type: object
        properties:
          requests: {type: object}
          waiting: {type: array, items: {type: string}}
          running: {type: array, items: {type: string}}
          finished_req_ids: {type: array, items: {type: string}}
          preempted_req_ids: {type: array, items: {type: string}}
          current_step: {type: integer}
          pause_state: {type: string, enum: [UNPAUSED, PAUSED_NEW, PAUSED_ALL]}
          num_waiting_for_streaming_input: {type: integer}
          finished_recving_kv_req_ids: {type: array, items: {type: string}}
          grammar_compile_error_reqs: {type: array, items: {type: string}, description: "Requests whose grammar failed to compile; update_from_output finishes them with FINISHED_ERROR (scheduler.py:252, 2302-2326)."}
          deferred_waiting: {type: array, items: {type: string}, description: "Waiting requests a scheduling pass skipped (blocked on a grammar or remote KV, stale in-flight output, max_loras); SchedulerStats reports them as skipped, not waiting (scheduler.py:230, 904-910, 2944-2948)."}
          prev_step_scheduled_req_ids: {type: array, items: {type: string}, description: "MRV1 only: the ids scheduled last step; a cached request not in it gets its all_token_ids again (scheduler.py:1449-1452, 1731-1733)."}
          max_num_encoder_input_tokens: {type: integer, description: "Encoder compute budget per step: MultiModalBudget.encoder_compute_budget, 0 for a text-only model (scheduler.py:271-273)."}
          sched_step_seq: {type: integer, description: "Deferred block free: non-empty steps scheduled so far (scheduler.py:1549-1552)."}
          processed_step_seq: {type: integer, description: "Deferred block free: non-empty steps whose output was processed (scheduler.py:2044-2048)."}
          deferred_frees: {type: array, description: "Deferred block free: [{fence, block_ids}] in fence order; returned to the pool once processed_step_seq reaches the fence (scheduler.py:2772-2801).", items: {type: object, properties: {fence: {type: integer}, block_ids: {type: array, items: {type: integer}}}}}
      initial: {requests: {}, waiting: [], running: [], finished_req_ids: [], preempted_req_ids: [], current_step: 0, pause_state: UNPAUSED, num_waiting_for_streaming_input: 0, finished_recving_kv_req_ids: [], grammar_compile_error_reqs: [], deferred_waiting: [], prev_step_scheduled_req_ids: [], max_num_encoder_input_tokens: 0, sched_step_seq: 0, processed_step_seq: 0, deferred_frees: []}
  - id: fcfs-request-queue
    name: FCFSRequestQueue
    kind: module
    parent: scheduler
    summary: "First-come-first-served waiting queue (a deque): peek is the head; preempted requests are prepended."
    sources: ["vllm/v1/core/sched/request_queue.py:75-128"]
  - id: priority-request-queue
    name: PriorityRequestQueue
    kind: module
    parent: scheduler
    summary: "Heap ordered by (priority, arrival_time): a lower priority value is served first, ties by earlier arrival."
    sources: ["vllm/v1/core/sched/request_queue.py:131-196"]
  - id: sched-utils
    name: scheduler utils (check_stop)
    kind: module
    parent: scheduler
    summary: "Stop checks after each sampled token: EOS, stop token ids, max_tokens and max_model_len, min_tokens."
    sources: ["vllm/v1/core/sched/utils.py:98-140"]

  # ---------------------------------------------------------------- KV cache
  - id: kv-cache-manager
    name: KVCacheManager
    kind: module
    parent: engine-core
    layer: kv-cache
    summary: "Allocates KV slots for scheduled tokens, finds prefix-cache hits, frees request blocks, keeps prefix-cache stats."
    description: >-
      For Llama (one full-attention KV cache group) the coordinator is the
      UnitaryKVCacheCoordinator, a pass-through to one FullAttentionManager; the model folds
      the coordinator hop into this component and names the call it delegates to.
    sources: ["vllm/v1/core/kv_cache_manager.py:131-225", "vllm/v1/core/kv_cache_coordinator.py:524-540"]
    state:
      schema:
        type: object
        properties:
          prefix_cache_stats: {type: object, properties: {requests: {type: integer}, queries: {type: integer}, hits: {type: integer}, preempted_requests: {type: integer}, preempted_queries: {type: integer}, preempted_hits: {type: integer}, reset: {type: boolean}}}
          kv_cache_groups: {type: array, description: "KV cache groups from the model's KV cache spec: one full_attention group for Llama; a hybrid model adds a mamba group."}
      initial: {prefix_cache_stats: {requests: 0, queries: 0, hits: 0, preempted_requests: 0, preempted_queries: 0, preempted_hits: 0, reset: false}, kv_cache_groups: [{kind: full_attention, block_size: 16}]}
  - id: full-attention-manager
    name: FullAttentionManager
    kind: module
    parent: kv-cache-manager
    summary: "Per-group block tables: req_to_blocks and num_cached_block; longest prefix-cache hit; block counts to allocate."
    description: "Owns the shared datum 'block tables'. The worker and attention get block ids only through SchedulerOutput."
    attributes: {single_writer: "The engine-core busy-loop thread is the only caller: other threads only put requests on the mutex-guarded input_queue, which the busy loop drains before each step (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:48-160", "vllm/v1/core/single_type_kv_cache_manager.py:729-830"]
    state:
      schema:
        type: object
        properties:
          req_to_blocks: {type: object}
          num_cached_block: {type: object}
      initial: {req_to_blocks: {}, num_cached_block: {}}
  - id: hybrid-kv-cache-coordinator
    name: HybridKVCacheCoordinator
    kind: module
    parent: kv-cache-manager
    summary: "Coordinator for models with several KV cache groups (attention + Mamba / sliding window): the prefix hit is the longest length every group accepts."
    description: "get_kv_cache_coordinator picks it when caching is on and there is more than one KV cache group; Llama has one group and uses the UnitaryKVCacheCoordinator (folded into kv-cache-manager)."
    sources: ["vllm/v1/core/kv_cache_coordinator.py:609-640", "vllm/v1/core/kv_cache_coordinator.py:995-1025"]
  - id: mamba-manager
    name: MambaManager
    kind: module
    parent: kv-cache-manager
    summary: "The Mamba group's manager: one recurrent-state block per request; prefix hits only at blocks whose state was checkpointed (the last match wins)."
    description: >-
      Simplified 'align' mode: when a step makes a block full the request's current state block is
      checkpointed under that block's hash (keyed '<hash>#mamba' in the shared pool) and a fresh
      state block continues the request. A hit adopts the checkpoint and copies it into a new
      state block. Speculative state blocks and prefill-checkpoint reservations are not modeled.
    attributes: {single_writer: "The engine-core busy-loop thread is the only caller: other threads only put requests on the mutex-guarded input_queue, which the busy loop drains before each step (vllm/v1/engine/core.py:1574-1600)."}
    capacity: {concurrency: 1}
    sources: ["vllm/v1/core/single_type_kv_cache_manager.py:1415-2010"]
    state:
      schema: {type: object, properties: {req_to_blocks: {type: object}, num_cached_block: {type: object}}}
      initial: {req_to_blocks: {}, num_cached_block: {}}
  - id: block-pool
    name: BlockPool
    kind: datastore
    parent: kv-cache-manager
    summary: "The GPU KV block pool: a free queue in eviction order, ref counts, and the block-hash to block map of the prefix cache."
    description: >-
      Owns the shared datum 'KV cache blocks'. Compact representation of the doubly linked
      free queue: free_front (blocks prepended on free, reused first, LIFO), the never-used
      ids next_fresh .. num_gpu_blocks-1 in id order, then free_tail (cached blocks appended
      on free, LRU eviction). Block 0 is the null block. ref_cnt lists only blocks whose
      count is 2 or more: an allocated block not listed has ref_cnt 1, and a block in the
      free queue has 0. block_hash maps block id to its hash; cached maps hash to the first
      block holding it.
    sources: ["vllm/v1/core/block_pool.py:136-196", "vllm/v1/core/kv_cache_utils.py:246-260", "vllm/v1/core/kv_cache_utils.py:175-238"]
    state:
      schema:
        type: object
        properties:
          num_gpu_blocks: {type: integer}
          next_fresh: {type: integer}
          free_front: {type: array, items: {type: integer}}
          free_tail: {type: array, items: {type: integer}}
          ref_cnt: {type: object}
          block_hash: {type: object}
          cached: {type: object}
          hash_tokens: {type: object, description: "block id -> prefix length of its partial entry (fine-grained hashes)"}
          kv_event_queue: {type: array, description: "KV cache events (BlockStored / BlockRemoved) since the last take_events; only with --kv-events-config enable_kv_cache_events"}
      initial: {num_gpu_blocks: 28488, next_fresh: 1, free_front: [], free_tail: [], ref_cnt: {}, block_hash: {}, cached: {}, hash_tokens: {}, kv_event_queue: []}
  - id: kv-cache-utils
    name: kv_cache_utils
    kind: module
    parent: kv-cache-manager
    summary: "Request block hashing (chained hashes of full blocks) and KV cache sizing helpers."
    sources: ["vllm/v1/core/kv_cache_utils.py:695-727", "vllm/v1/core/kv_cache_utils.py:941-1000"]
    state:
      schema: {type: object, properties: {none_hash_seed: {type: [string, "null"]}, hash_fn: {type: [string, "null"]}}}
      initial: {none_hash_seed: null, hash_fn: null}

  # ------------------------------------------------------- structured output
  - id: structured-output-manager
    name: StructuredOutputManager
    kind: module
    parent: engine-core
    layer: structured-output
    summary: "Creates grammars for structured-output requests and advances them with accepted tokens."
    description: "state.grammars keeps each request's compile outcome (the Future held by its StructuredOutputRequest, vllm/v1/structured_output/request.py:21-62): ready or failed. A request with no entry is still compiling."
    sources: ["vllm/v1/structured_output/__init__.py:47-110"]
    state:
      schema: {type: object, properties: {grammars: {type: object}}}
      initial: {grammars: {}}
  - id: xgrammar-backend
    name: XgrammarBackend
    kind: module
    parent: structured-output-manager
    summary: "Compiles a grammar spec into an xgrammar GrammarMatcher, forwarding the request's stop tokens as override_stop_tokens."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:36-171"]
    state:
      schema: {type: object, properties: {tokenizer_eos_token_id: {type: integer}}}
      initial: {tokenizer_eos_token_id: 128009}
  - id: structured-output-utils
    name: structured_output utils
    kind: module
    parent: structured-output-manager
    summary: "Helpers: compile_regex_with_timeout guards regex compilation against ReDoS-style blow-ups."
    sources: ["vllm/v1/structured_output/utils.py:62-98"]
  - id: xgrammar-compiler
    name: xgrammar GrammarCompiler (library)
    kind: external
    parent: structured-output-manager
    summary: "The xgrammar library's compiler; only its regex compile time is modeled."
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:128-132"]
  - id: backend-outlines
    name: backend_outlines (OutlinesBackend)
    kind: module
    parent: structured-output-manager
    summary: "Outlines structured-output backend: request validation (regex buildable by regex-automata) and grammar compilation."
    sources: ["vllm/v1/structured_output/backend_outlines.py:39-366"]
    state:
      schema: {type: object, properties: {grammars: {type: object}}}
      initial: {grammars: {}}
  - id: xgrammar-grammar
    name: XgrammarGrammar
    kind: module
    parent: structured-output-manager
    summary: "One request's grammar matcher: accept tokens, fill the next-token bitmask, report termination."
    description: >-
      The matcher itself is the xgrammar library (not vLLM code). It is approximated as a
      small FSM for a JSON string schema: start -> in_string (after a quote) -> complete
      (after the closing quote) -> terminated (after a stop token). In each state a stop
      token is allowed only when the grammar is complete; ordinary content tokens are
      allowed inside the string. Grammars live in state.grammars keyed by grammar id.
    sources: ["vllm/v1/structured_output/backend_xgrammar.py:174-251"]
    state:
      schema: {type: object, properties: {grammars: {type: object}}}
      initial: {grammars: {}}

  # ------------------------------------------------------------ KV offload
  - id: kv-offload
    name: KV offload helpers
    kind: module
    parent: engine-core
    layer: kv-offload
    summary: "CPU / disk / tiered KV offloading: copy backends, lookups, IO thread pools and pinned host regions."
    description: >-
      The scheduler-side pieces run in the engine core; the copy backends, shared region and
      host registration run in each GPU worker process. They are grouped here under the
      area's module (engine-core) and modeled as single instances.
    sources: ["vllm/v1/kv_offload/base.py:1-40", "vllm/v1/simple_kv_offload/worker.py:1-40"]
  - id: host-register
    name: host_register module
    kind: module
    parent: kv-offload
    summary: "Registers a host range as pinned (page-locked) memory so DMA to and from the GPU is fast; falls back to pageable memory."
    sources: ["vllm/v1/kv_offload/cpu/host_register.py:1-97"]
    state:
      schema: {type: object, properties: {pinned: {type: object}, pinnable_bytes: {type: integer}}}
      initial: {pinned: {}, pinnable_bytes: 1099511627776}
  - id: kv-offload-cpu-gpu-worker
    name: kv_offload cpu gpu_worker module
    kind: module
    parent: kv-offload
    summary: "Worker-side CPU offload setup: pins the shared region in chunks (pin_mmap_region)."
    sources: ["vllm/v1/kv_offload/cpu/gpu_worker.py:197-240"]
    state:
      schema: {type: object, properties: {pinned_addresses: {type: array, items: {type: integer}}}}
      initial: {pinned_addresses: []}
  - id: swap-blocks-triton
    name: swap_blocks_triton module
    kind: module
    parent: kv-offload
    summary: "Triton batched block copy for small CPU->GPU batches; below 16 descriptors it defers to the C++ swap_blocks_batch op."
    sources: ["vllm/v1/kv_offload/cpu/swap_blocks_triton.py:1-74"]
  - id: shared-offload-region
    name: SharedOffloadRegion
    kind: module
    parent: kv-offload
    summary: "One mmap-backed /dev/shm region shared by all workers; hands each worker strided views of its slots."
    sources: ["vllm/v1/kv_offload/cpu/shared_offload_region.py:71-140"]
    state:
      schema:
        type: object
        properties:
          num_chunks: {type: integer}
          row_stride: {type: integer}
          rank: {type: integer}
          worker_offset: {type: integer}
          worker_area_end: {type: integer}
          views: {type: array}
      initial: {num_chunks: 4, row_stride: 8192, rank: 0, worker_offset: 0, worker_area_end: 8192, views: []}
  - id: cuda-mem-ops
    name: cuda_mem_ops module
    kind: module
    parent: kv-offload
    summary: "cuMemcpyBatchAsync wrappers that copy a list of KV blocks on a CUDA stream."
    sources: ["vllm/v1/simple_kv_offload/cuda_mem_ops.py:1-272"]
  - id: dma-copy-backend
    name: DmaCopyBackend
    kind: module
    parent: kv-offload
    summary: "Background thread that drains a queue of GPU<->CPU block copies and records a completion event for each."
    sources: ["vllm/v1/simple_kv_offload/copy_backend.py:25-130"]
    state:
      schema: {type: object, properties: {queue: {type: array}, events: {type: array}, running: {type: boolean}}}
      initial: {queue: [], events: [], running: true}
  - id: disk-backend
    name: DiskBackend
    kind: module
    parent: kv-offload
    summary: "GPU<->NVMe offload through pinned staging buffers; separate store and load threads so loads never wait behind stores."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:49-343"]
  - id: disk-store-thread
    name: DiskBackend store thread (_store_loop)
    kind: module
    parent: disk-backend
    capacity: {concurrency: 1}
    summary: "The store thread: owns the store queue and its own life; one thread, so capacity 1."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:176-187", "vllm/v1/simple_kv_offload/disk_backend.py:236-252"]
    state:
      schema: {type: object, properties: {queue: {type: array}, events: {type: array}, total_block_bytes: {type: integer}, alive: {type: boolean}}}
      initial: {queue: [], events: [], total_block_bytes: 2097152, alive: true}
  - id: disk-load-thread
    name: DiskBackend load thread (_load_loop)
    kind: module
    parent: disk-backend
    capacity: {concurrency: 1}
    summary: "The load thread: owns the load queue and its own life; one thread, so capacity 1."
    sources: ["vllm/v1/simple_kv_offload/disk_backend.py:176-187", "vllm/v1/simple_kv_offload/disk_backend.py:270-286"]
    state:
      schema: {type: object, properties: {queue: {type: array}, events: {type: array}, total_block_bytes: {type: integer}, alive: {type: boolean}}}
      initial: {queue: [], events: [], total_block_bytes: 2097152, alive: true}
  - id: async-lookup-manager
    name: AsyncLookupManager
    kind: module
    parent: kv-offload
