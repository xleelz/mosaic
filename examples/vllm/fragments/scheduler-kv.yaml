    summary: "ZMQ ROUTER/DEALER control transport of the P2P tier; a socket monitor marks a peer connection dead on a fatal event."
    sources: ["vllm/v1/kv_offload/tiering/p2p/control/zmq.py:136-163"]
    state:
      schema: {type: object, properties: {connections: {type: object, description: "peer id -> {alive}"}}}
      initial: {connections: {}}

