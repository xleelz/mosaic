- id: scheduler-kv-r4-resolve-block-sizes
  name: 'Block-size resolution: one group hashes at its block size, hybrid groups schedule at the LCM and hash at the GCD or prefix_match_unit; bad units are refused'
  fixtures: *id004
  steps:
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: one
    input:
      groups:
      - kind: full_attention
        block_size: 16
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: one_bad
    input:
      groups:
      - kind: full_attention
        block_size: 16
      prefix_match_unit: 8
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: hyb
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: unit
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
      prefix_match_unit: 8
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: badunit
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
      prefix_match_unit: 12
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: noalign
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: mamba
        block_size: 48
        mamba_cache_mode: none
  - interface: kv-cache-utils.resolve-kv-cache-block-sizes
    caller: engine-core
    as: noncache
    input:
      groups:
      - kind: full_attention
        block_size: 16
      - kind: sliding_window
        block_size: 32
        prefix_cacheable: false
      - kind: mamba
        block_size: 64
        mamba_cache_mode: align
  expect:
  - steps.one.result.value.hash_block_size == 16 && steps.one_bad.result.error.code == 'value-error'
  - steps.hyb.result.value.scheduler_block_size == 64 && steps.hyb.result.value.hash_block_size == 16 && steps.unit.result.value.hash_block_size == 8
  - steps.badunit.result.error.code == 'value-error' && steps.noalign.result.value.hash_block_size == 48
  - steps.noncache.result.value.hash_block_size == 16
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-utils.resolve-kv-cache-block-sizes')
