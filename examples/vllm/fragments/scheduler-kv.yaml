  - '!(''r1'' in state[''mamba-manager''].req_to_blocks) && !(''r1'' in state[''full-attention-manager''].req_to_blocks)'
  - calls['block-pool.free-blocks'] == 0
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.pop-blocks-for-free')
