- id: scheduler-kv-prefix-full-hit-recomputes-last-block
  name: A prompt that is fully cached still recomputes its last block to get logits
  fixtures:
  - scheduler-kv-prefix-warm
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-q2
      prompt_segments:
      - key: sys-prompt-v1
        num_tokens: 1024
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: b64
    input:
      block_hash: sys-prompt-v1@1024
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-q2'': 16}'
  - steps.s1.result.value.scheduled_new_reqs[0].num_computed_tokens == 1008
  - steps.s1.result.value.scheduled_new_reqs[0].block_ids[63] == 65
  - 'steps.b64.result.value.block == {''block_id'': 64, ''ref_cnt'': 0}'
  - trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-cached-block' && e.error == null)
- id: scheduler-kv-prefix-caching-off-no-lookup
  name: With prefix caching off the cached system prompt is ignored and recomputed
  fixtures:
  - scheduler-kv-prefix-warm
  - prefix-caching-off
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-q1
      prompt_segments:
      - key: sys-prompt-v1
        num_tokens: 1024
      - key: user-q-1
        num_tokens: 40
  - flow: scheduler-schedule
    as: s1
    input: {}
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-q1'': 1064}'
  - steps.s1.result.value.scheduled_new_reqs[0].num_computed_tokens == 0
  - '// the point: no prefix-cache lookup at all with caching off

    calls[''block-pool.get-cached-block''] == 0'
  - steps.s1.result.value.scheduled_new_reqs[0].block_ids[0] == 65
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.schedule' && e.error == null)
- id: scheduler-kv-prefix-lru-eviction
  name: Allocating past the fresh blocks evicts the least recently freed cached blocks, tail block first
  description: The deployment is launched with --num-gpu-blocks-override 2000 so one request reaches the cached tail.
  fixtures:
  - scheduler-kv-prefix-warm
  config:
    max-num-batched-tokens: 32768
    num-gpu-blocks-override: 2000
  state:
    block-pool:
      num_gpu_blocks: 2000
  steps:
  - flow: scheduler-add-request
    as: add
    input:
      request_id: chatcmpl-big
      prompt_segments:
      - key: big-doc
        num_tokens: 31000
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: e1
    input:
      block_hash: sys-prompt-v1@1024
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: e2
    input:
      block_hash: sys-prompt-v1@992
  - interface: block-pool.get-cached-block
    caller: kv-cache-manager
    as: e3
    input:
      block_hash: sys-prompt-v1@976
  - interface: block-pool.get-num-free-blocks
    caller: kv-cache-manager
    as: free
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-big'': 31000}'
  - steps.e1.result.value.block == null && steps.e2.result.value.block == null && steps.e3.result.value.block != null
  - steps.free.result.value.num_free_blocks == 61 && trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-cached-block' && e.output.block == null)
- id: scheduler-kv-preempt-when-kv-full
  name: A decode that needs a block in a full pool preempts the last running request (itself here)
  fixtures:
  - scheduler-kv-nearly-full
  steps:
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-run-a'': 1}'
  - steps.s1.result.value.preempted_req_ids == ['chatcmpl-run-b']
  - steps.s1.result.value.scheduled_cached_reqs.new_block_ids == [[63]]
  - '// preemption resets the victim for recompute; the request record is the point

    state.scheduler.requests[''chatcmpl-run-b''].status == ''PREEMPTED'' && state.scheduler.requests[''chatcmpl-run-b''].num_computed_tokens == 0 && state.scheduler.requests[''chatcmpl-run-b''].num_preemptions == 1'
  - 'steps.cnt.result.value == {''num_running'': 1, ''num_waiting'': 2}'
  - trace.exists(e, e.type == 'note' && e.title == 'Preemption this step; no waiting request is admitted')
- id: scheduler-kv-preempted-request-resumes-from-prefix-cache
  name: After room frees up, the preempted request resumes and recomputes only its last token thanks to its cached blocks
  fixtures:
  - scheduler-kv-nearly-full
  steps:
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-finish-requests
    as: abort
    input:
      request_ids:
      - chatcmpl-run-a
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - steps.abort.result.value.finished == ['chatcmpl-run-a']
  - steps.s2.result.value.scheduled_new_reqs.map(r, r.req_id) == ['chatcmpl-wait-c', 'chatcmpl-run-b']
  - 'steps.s2.result.value.num_scheduled_tokens == {''chatcmpl-run-b'': 1, ''chatcmpl-wait-c'': 100}'
  - steps.s2.result.value.scheduled_new_reqs[1].num_computed_tokens == 496 && steps.s2.result.value.scheduled_new_reqs[1].block_ids.size() == 32
  - steps.s2.result.value.finished_req_ids == ['chatcmpl-run-a']
  - trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.schedule' && e.error == null)
- id: scheduler-kv-priority-preempts-lowest-priority
  name: Under the priority policy the lowest-priority running request is preempted and its tokens returned to the budget
  fixtures:
