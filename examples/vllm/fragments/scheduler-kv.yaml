  - steps.s2.result.value.num_scheduled_tokens['chatcmpl-long1'] == 64 && steps.s2.result.value.scheduled_cached_reqs.req_ids == ['chatcmpl-long1']
  - steps.s3.result.value.num_scheduled_tokens['chatcmpl-long1'] == 64
  - steps.s4.result.value.num_scheduled_tokens['chatcmpl-long1'] == 8
  - steps.s1.result.value.scheduled_new_reqs[0].block_ids == [1, 2, 3, 4] && steps.s2.result.value.scheduled_cached_reqs.new_block_ids == [[5, 6, 7, 8]]
  - size(steps.tbl.result.value.block_ids) == 13 && trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.schedule' && e.output.total_num_scheduled_tokens == 8)
- id: scheduler-kv-partial-prefill-emits-nothing
