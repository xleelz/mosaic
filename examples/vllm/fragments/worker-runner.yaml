      bytes_per_block: 917504
    gpu-model-runner:
      num_blocks: 64548
- id: worker-runner-fp8-llama-3-8b
  summary: 'Llama-3-8B FP8 checkpoint, KV cache auto (bf16): 9.08 GB of weights, 2 MiB per block, 66,724,972,135
