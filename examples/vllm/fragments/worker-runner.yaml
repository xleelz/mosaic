- component: encoder-runner
  name: execute-mm-encoder
  kind: function
  summary: 'ModelState.execute_mm_encoder (prepare_mm_inputs + the encoder forward): for each scheduled encoder
    input, skip items without data or already cached by mm hash, run the vision encoder on the rest, and store each
    output in the encoder cache under its mm hash.'
  sources:
  - vllm/v1/worker/gpu/model_states/interface.py:189-203
  - vllm/v1/worker/gpu/mm/encoder_runner.py:81-108
  - vllm/v1/worker/gpu/mm/encoder_runner.py:150-175
  latency_ms: 0
  request:
    type: object
    required:
    - scheduled_encoder_inputs
    - mm_features
    properties:
      scheduled_encoder_inputs:
        type: object
        description: 'SchedulerOutput.scheduled_encoder_inputs: req_id -> the indices of its mm_features to encode
          this step'
      mm_features:
        type: object
        description: req_id -> the request's mm_features (the encoder cache's record)
      cached:
        type: array
        items:
          type: string
        description: mm hashes already in encoder_outputs
      model_component:
        type: string
        default: qwen2-vl-for-conditional-generation
        description: the loaded model's component, whose embed_multimodal runs the vision tower
  response:
    type: object
    properties:
      mm_hashes:
        type: array
        items:
          type: string
  behavior:
  - title: 'prepare_mm_inputs: an item is encoded when it has data and its mm hash has no cached output (each hash
      once)'
    source: vllm/v1/worker/gpu/mm/encoder_runner.py:86-108
    set:
      vars.todo: = input.scheduled_encoder_inputs.map(rid, rid).sort().map(rid, input.scheduled_encoder_inputs[rid].filter(i,
        rid in input.mm_features && i < size(input.mm_features[rid])).map(i, input.mm_features[rid][i])).flatten().filter(f,
        (!has(f.data) || f.data != null) && !(f.identifier in input.cached)).map(f, f.identifier)
  - set:
      vars.feats: = input.scheduled_encoder_inputs.map(rid, rid).sort().map(rid, input.scheduled_encoder_inputs[rid].filter(i,
        rid in input.mm_features && i < size(input.mm_features[rid])).map(i, input.mm_features[rid][i])).flatten()
      vars.hashes: = lists.range(size(vars.todo)).filter(i, !(vars.todo[i] in vars.todo.slice(0, i))).map(i, vars.todo[i])
  - if: size(vars.hashes) == 0
    then:
    - title: Every scheduled item is cached already; the encoder does not run
      source: vllm/v1/worker/gpu/model_states/interface.py:197
      return:
        mm_hashes: []
  - if: has(input.model_component) && input.model_component == 'qwen2-vl-for-conditional-generation'
    then:
    - title: The model's embed_multimodal runs the vision tower on the batched items (_execute_mm_encoder)
      source: vllm/v1/worker/gpu/mm/encoder_runner.py:150-175
      call: = input.model_component + '.embed-multimodal'
      targets:
      - qwen2-vl-for-conditional-generation.embed-multimodal
      input:
        mm_kwargs: '= vars.hashes.map(h, vars.feats.filter(f, f.identifier == h)[0]).map(f, {''modality'': has(f.modality)
          ? f.modality : ''image'', ''kind'': ''pixel_values'', ''grid_thw'': has(f.grid_thw) ? f.grid_thw : [1,
          2 * int(math.ceil(math.sqrt(double(f.length)))), 2 * int(math.ceil(math.sqrt(double(f.length))))]})'
  - title: Store each output in the encoder cache under its mm hash
    source: vllm/v1/worker/gpu/model_states/interface.py:198-203
    call: encoder-cache.update-encoder-outputs
    input:
      mm_hashes: = vars.hashes
  - return:
      mm_hashes: = vars.hashes
