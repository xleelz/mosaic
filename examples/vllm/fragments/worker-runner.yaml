- component: structured-outputs-worker
  name: apply-grammar-bitmask
  kind: function
  summary: 'apply_grammar_bitmask: returns at once when no structured-output request is in the batch; else copies
    the bitmask to the GPU and masks the matching logit rows.'
  sources:
  - vllm/v1/worker/gpu/structured_outputs.py:95-160
  latency_ms: 0
  request:
    type: object
    properties:
      structured_output_request_ids:
        type: array
        items:
          type: string
      batch_req_ids:
        type: array
      grammar_ids:
        type: array
        default: []
        items:
          type: string
      eos_token_id:
        type: integer
        default: 128009
  response:
    type: object
    properties:
      masked_req_ids:
        type: array
      allowed:
        type: object
        description: 'req_id -> which token classes the grammar''s bitmask row leaves open: quote (token 1), stop
          (the EOS), content (any other token)'
  behavior:
  - if: size(input.structured_output_request_ids) == 0
    then:
    - return:
        masked_req_ids: []
        allowed: {}
  - call: structured-outputs-worker.apply-grammar-bitmask-kernel
    input:
      num_rows: = size(input.structured_output_request_ids)
  - set:
      vars.allowed: {}
  - title: Each masked row keeps only the tokens its grammar's bitmask row allows (the bitmask the scheduler filled
      from the grammar's state)
    source: vllm/v1/worker/gpu/structured_outputs.py:120-160
    foreach: '= has(input.grammar_ids) ? lists.range(size(input.grammar_ids)).filter(i, input.structured_output_request_ids[i]
      in input.batch_req_ids) : []'
    as: i
    steps:
    - call: xgrammar-grammar.fill-bitmask
      input:
        grammar_id: = input.grammar_ids[vars.i]
        token_ids: = [1, input.eos_token_id, 2]
      as: bm
    - set:
        vars.allowed: '= merge(vars.allowed, {input.structured_output_request_ids[vars.i]: {''quote'': vars.bm.value.allowed[''1''],
          ''stop'': vars.bm.value.allowed[string(input.eos_token_id)], ''content'': vars.bm.value.allowed[''2'']}})'
  - return:
      masked_req_ids: = input.structured_output_request_ids.filter(id, id in input.batch_req_ids)
      allowed: = vars.allowed
