    steps.s.result.value.sampled_token_ids[0][0])]
  - trace.exists(e, e.type == 'call.start' && e.interface == 'ngram-gpu-speculator.propose' && e.input.token_ids
    == [[128000, 11, 12, 13, 11, 12, steps.s.result.value.sampled_token_ids[0][0]]])
- id: wr-spec-decoding-stats-and-metrics
  name: Spec-decode stats accumulate per draft (per-position counts included), log the mean acceptance length with
    the bonus token, and feed the vllm:spec_decode_* counters
  description: 'Two drafts of k=3 in one step: 3 drafted / 1 accepted and 3 / 3 (metrics.py:33-50). Logging: mean
    acceptance length 1 + 4/2 = 3, acceptance rate 4/6 = 66.7%, per-position rates [1, 0.5, 0.5] (metrics.py:82-137).
    Prometheus counters grow by the step''s totals (metrics.py:266-281). Accepting more than k is an assertion.'
  fixtures:
  - full-tp1-llama-8b
  config:
    speculative-method: eagle3
    num-speculative-tokens: 3
  steps:
  - interface: spec-decoding-stats.observe-draft
    caller: engine-core
    input:
      stats: null
      num_spec_tokens: 3
      num_draft_tokens: 3
      num_accepted_tokens: 1
    as: o1
  - interface: spec-decoding-stats.observe-draft
    caller: engine-core
    input:
      stats: = steps.o1.result.value
      num_spec_tokens: 3
      num_draft_tokens: 3
      num_accepted_tokens: 3
    as: o2
  - interface: spec-decoding-stats.log
    caller: engine-core
    input:
      observed:
      - = steps.o2.result.value
    as: log
  - interface: spec-decoding-stats.log
    caller: engine-core
    input:
      observed: []
    as: nolog
  - interface: spec-decoding-prom.observe
    caller: engine-core
    input:
      stats: = steps.o2.result.value
    as: prom
  - interface: spec-decoding-stats.observe-draft
    caller: engine-core
    input:
      stats: null
      num_spec_tokens: 3
      num_draft_tokens: 3
      num_accepted_tokens: 4
    as: bad
  expect:
  - steps.o2.result.value.num_drafts == 2 && steps.o2.result.value.num_draft_tokens == 6 && steps.o2.result.value.num_accepted_tokens
    == 4
  - steps.o2.result.value.num_accepted_tokens_per_pos == [2, 1, 1] && steps.o2.result.value.num_draft_tokens_per_pos
    == [2, 2, 2]
  - steps.log.result.value.mean_acceptance_length == 3.0 && steps.log.result.value.acceptance_rates == [1.0, 0.5,
    0.5] && steps.log.result.value.draft_acceptance_rate > 66.6 && steps.log.result.value.draft_acceptance_rate
    < 66.7
  - steps.nolog.result.value == null
  - steps.prom.result.value.num_accepted_tokens == 4 && steps.prom.result.value.num_accepted_tokens_per_pos == [2,
    1, 1]
  - '!steps.bad.result.ok && steps.bad.result.error.code == ''assertion-error'''
