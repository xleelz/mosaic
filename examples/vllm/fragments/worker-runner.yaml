  name: start-draft-weight-update
  kind: rpc
  summary: 'collective_rpc start_draft_weight_update: like start_weight_update but retargets the engine at the speculative
    draft model.'
  sources:
  - vllm/v1/worker/gpu_worker.py:1517-1522
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
