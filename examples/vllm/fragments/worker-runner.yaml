- component: rejection-sampler
  name: sample
  kind: function
  summary: 'RejectionSampler.__call__: target logits vs drafts, chunked over the vocabulary. The target''s logits
    go through Sampler.apply_sampling_params first. Greedy rows accept a draft when it equals the target argmax;
    random rows with probability min(1, p/q); a -1 placeholder is rejected; the first rejected position is resampled
    from the residual, and fully accepted rows get a bonus token. Returns the accepted prefix plus one token per
    finished request, so a step emits 1 to k+1 tokens.'
  sources:
  - vllm/v1/worker/gpu/spec_decode/rejection_sampler.py:407-470
  - vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py:1015-1328
  latency_ms: 0
  request:
    type: object
    properties:
      rows:
        type: array
      want_logprobs:
        type: boolean
        default: false
  response:
    type: object
    properties:
      req_ids:
        type: array
      sampled_token_ids:
        type: array
      num_accepted:
        type: array
  behavior:
  - call: rejection-sampler.compute-local-logits-stats-kernel
    input:
      num_rows: = size(input.rows)
  - call: rejection-sampler.compute-cumulative-log-p-kernel
    input:
      num_rows: = size(input.rows)
  - call: rejection-sampler.compute-local-residual-mass-kernel
    input:
      num_rows: = size(input.rows)
  - title: Accept or reject each draft position
    source: vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py:1226-1240
    call: rejection-sampler.rejection-kernel
    input:
      num_rows: = size(input.rows)
  - call: rejection-sampler.resample-kernel
    input:
      num_rows: = size(input.rows)
  - call: rejection-sampler.insert-resampled-kernel
    input:
      num_rows: = size(input.rows)
  - call: rejection-sampler.gather-draft-sampled-kernel
    input:
      num_rows: = size(input.rows)
  - if: has(input.want_logprobs) && input.want_logprobs
    then:
    - title: Logprobs of the accepted tokens
      source: vllm/v1/worker/gpu/spec_decode/rejection_sampler.py:177-218
      call: rejection-sampler.flatten-sampled-kernel
      input:
        num_rows: = size(input.rows)
  - title: The target's processed logits at every draft position and the bonus position (Sampler.apply_sampling_params)
    source: vllm/v1/worker/gpu/spec_decode/rejection_sampler.py:258-267
    call: sampler.apply-sampling-params
    input:
      rows: '= input.rows.map(r, merge(r, {''positions'': lists.range(size(r.drafts) + 1).map(j, has(r.seq_len)
        ? r.seq_len - size(r.drafts) + j : -1)}))'
    as: tgt
  - title: 'A -1 placeholder draft is never accepted: verification of a row stops at its first invalid draft'
    source: vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py:559-569
    set:
      vars.valid: = input.rows.map(r, size(lists.range(size(r.drafts)).filter(j, r.drafts.slice(0, j + 1).all(d,
        d >= 0))))
  - title: Which drafts the target accepts depends on the logits
    detail: 'Greedy rows (temperature 0) accept a draft iff it equals the target''s argmax and store that argmax
      at the first rejection; random rows accept with probability min(1, p/q) and resample the first rejected position
      from the residual. The model holds no logits, so the verdict is a choice: accept_all (the drafter agreed with
      the target everywhere: every valid draft plus a bonus token), reject_first (one resampled token), or target
      (each draft is compared with the stand-in token the target''s logits yield at its position, so a greedy row
      accepts the longest matching prefix and emits exactly the tokens non-speculative greedy decoding would).'
    source: vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py:570-599
    choice: acceptance
    default: accept_all
    options:
      accept_all:
      - set:
          vars.accepted: = vars.valid
      reject_first:
      - set:
          vars.accepted: = input.rows.map(r, 0)
      target:
      - set:
          vars.accepted: = lists.range(size(input.rows)).map(i, size(lists.range(vars.valid[i]).filter(j, lists.range(j
            + 1).all(m, input.rows[i].drafts[m] == vars.tgt.value.tokens[i][m]))))
  - set:
      ctx.num_accepted: = vars.accepted
  - title: Accepted drafts, then the target's token at the first rejected position (or the bonus position when all
      are accepted)
    source: vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py:589-593
    return:
      req_ids: = input.rows.map(r, r.req_id)
      sampled_token_ids: '= lists.range(size(input.rows)).map(i, input.rows[i].is_final ? input.rows[i].drafts.slice(0,
        vars.accepted[i]) + [vars.tgt.value.tokens[i][vars.accepted[i]]] : [])'
      num_accepted: = vars.accepted
