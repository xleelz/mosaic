- component: batch-sharder
  name: shard-sampler-inputs
  kind: function
  summary: 'BatchSharder.shard_sampler_inputs: request i is owned by TP rank idx_mapping[i] % tp_size (round-robin
    over slots, identical on every rank, no communication). This rank keeps its owned requests in batch order (a
    stable owner sort) and builds the shard metadata: logits rows per owner rank (the all-to-all splits, summing
    to the batch''s), its own logits count, the most requests any rank owns, the largest logits count of one request,
    and each request''s source index in the rank-major gathered result.'
  sources:
  - vllm/v1/worker/gpu/sample/batch_shard.py:162-288
  - vllm/v1/worker/gpu/sample/batch_shard.py:19-50
  latency_ms: 0
  request:
    type: object
    properties:
      req_ids:
        type: array
        default: []
        items:
          type: string
      idx_mapping:
        type: array
        items:
          type: integer
        description: batch position -> request slot
      cu_num_logits:
        type: array
        items:
          type: integer
        description: cumulative logits rows per request (1 + drafts each)
      num_reqs:
        type: integer
        default: 0
      tp_rank:
        type: integer
        default: -1
        description: 'the TP group''s rank_in_group; -1 (default): this instance''s rank mod tp_size'
      tp_size:
        type: integer
        default: 0
        description: 'the TP group''s world size; 0 (default): tensor-parallel-size'
  response:
    type: object
    properties:
      local_batch:
        type: object
        properties:
          req_ids:
            type: array
          num_reqs:
            type: integer
          idx_mapping:
            type: array
          cu_num_logits:
            type: array
      metadata:
        type: object
        properties:
          tp_size:
            type: integer
          num_logits_per_rank:
            type: array
          num_local_logits:
            type: integer
          num_local_reqs:
            type: integer
          max_num_reqs_per_rank:
            type: integer
          gathered_src_indices:
            type: array
          max_num_logits_per_req:
            type: integer
  behavior:
  - set:
      vars.tp: '= has(input.tp_size) && input.tp_size > 0 ? input.tp_size : int(config[''tensor-parallel-size''])'
      vars.n: = size(input.idx_mapping)
  - set:
      vars.rank: '= has(input.tp_rank) && input.tp_rank >= 0 ? input.tp_rank : (self == '''' ? 0 : int(self.substring(4))
        % vars.tp)'
      vars.owner: = input.idx_mapping.map(s, s % vars.tp)
      vars.per_req: = lists.range(vars.n).map(i, input.cu_num_logits[i + 1] - input.cu_num_logits[i])
  - title: 'Owner of each request: its slot index mod tp_size; this rank''s requests in batch order'
    source: vllm/v1/worker/gpu/sample/batch_shard.py:177-185
    set:
      vars.local: = lists.range(vars.n).filter(i, vars.owner[i] == vars.rank)
      vars.reqs_per_rank: = lists.range(vars.tp).map(r, size(lists.range(vars.n).filter(i, vars.owner[i] == r)))
      vars.per_rank: = lists.range(vars.tp).map(r, sum(lists.range(vars.n).filter(i, vars.owner[i] == r).map(i,
        vars.per_req[i])))
  - title: Logits rows per owner rank (bincount weighted by each request's rows), this rank's local cumulative counts,
      and the per-request maximum
    source: vllm/v1/worker/gpu/sample/batch_shard.py:186-198
    set:
      vars.maxpr: '= vars.n > 0 ? vars.reqs_per_rank.sortBy(x, -x)[0] : 1'
      vars.local_cu: = lists.range(size(vars.local) + 1).map(j, sum(vars.local.slice(0, j).map(i, vars.per_req[i])))
      vars.max_logits: '= vars.n > 0 ? vars.per_req.sortBy(x, -x)[0] : 1'
  - title: The plan kernel writes the owner-sorted logits indices, the gather map and this rank's sub-batch tensors
    source: vllm/v1/worker/gpu/sample/batch_shard.py:225-248
    when: vars.n > 0
    call: batch-sharder.build-shard-plan-kernel
    input:
      num_rows: = vars.n
  - title: The local batch keeps only the owned entries; the metadata drives the all-to-all and the all-gather
    source: vllm/v1/worker/gpu/sample/batch_shard.py:259-288
    return:
      local_batch:
        req_ids: '= has(input.req_ids) ? vars.local.map(i, input.req_ids[i]) : []'
        num_reqs: = size(vars.local)
        idx_mapping: = vars.local.map(i, input.idx_mapping[i])
        cu_num_logits: = vars.local_cu
      metadata:
        tp_size: = vars.tp
        num_logits_per_rank: = vars.per_rank
        num_local_logits: = vars.per_rank[vars.rank]
        num_local_reqs: = size(vars.local)
        max_num_reqs_per_rank: = vars.maxpr
        gathered_src_indices: = lists.range(vars.n).map(i, vars.owner[i] * vars.maxpr + size(lists.range(i).filter(j,
          vars.owner[j] == vars.owner[i])))
        max_num_logits_per_req: = vars.max_logits
- component: batch-sharder
  name: gather-sampler-output
  kind: function
  summary: 'gather_sampler_output: all-gathers the per-rank sampler outputs (and logprobs) back into global order.'
  sources:
  - vllm/v1/worker/gpu/sample/batch_shard.py:522-660
