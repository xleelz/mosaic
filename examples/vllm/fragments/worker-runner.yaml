interfaces:
- component: gpu-memory
  name: snapshot
  kind: io
  summary: 'MemorySnapshot.measure: total and free device memory as torch.accelerator.get_memory_info reports it
    (weights, KV cache, CUDA graph pools, runtime/non-torch allocations and other processes all reduce free).'
  sources:
  - vllm/utils/mem_utils.py:120-190
  latency_ms: 0
  request:
    type: object
    properties:
      at_init:
        type: boolean
        default: false
      after_profile:
        type: boolean
        default: false
  response:
    type: object
    properties:
      total_bytes:
        type: integer
      free_bytes:
        type: integer
      weights_bytes:
        type: integer
      kv_cache_bytes:
        type: integer
      compute_capability:
        type: string
        description: torch.cuda.get_device_capability as major.minor (9.0 on H100)
  behavior:
  - set:
      vars.used: '= state.weights_bytes + state.kv_cache_bytes + (has(state.runtime_bytes) ? state.runtime_bytes
        : 0) + (has(state.non_torch_bytes) ? state.non_torch_bytes : 0) + (has(state.cudagraph_bytes) ? state.cudagraph_bytes
        : 0) + (has(state.other_process_bytes) ? state.other_process_bytes : 0)'
  - if: has(input.at_init) && input.at_init
    then:
    - title: The init snapshot precedes this process's own allocations
      detail: init_device snapshots before load_model, the profile run, KV allocation and graph capture, so only
        other processes' memory is in use then. A world seeded with this engine's weights, KV cache or graph pools
        (the started fixtures) must not count them against its own budget.
      source: vllm/v1/worker/gpu_worker.py:533-534
      return:
        total_bytes: = state.total_bytes
        free_bytes: '= state.total_bytes - (has(state.other_process_bytes) ? state.other_process_bytes : 0)'
        weights_bytes: 0
        kv_cache_bytes: 0
        compute_capability: '= has(state.compute_capability) ? string(state.compute_capability) : ''9.0'''
  - if: has(input.after_profile) && input.after_profile
    then:
    - title: The profiling snapshot precedes KV cache allocation and graph capture
      detail: determine_available_memory measures after the profile run and before initialize_from_config and capture_model,
        so a KV cache or graph pool already in the world belongs to this engine's later stages and is not counted.
      source: vllm/v1/worker/gpu_worker.py:713-714
      return:
        total_bytes: = state.total_bytes
        free_bytes: '= state.total_bytes - (vars.used - state.kv_cache_bytes - (has(state.cudagraph_bytes) ? state.cudagraph_bytes
          : 0))'
        weights_bytes: = state.weights_bytes
        kv_cache_bytes: 0
        compute_capability: '= has(state.compute_capability) ? string(state.compute_capability) : ''9.0'''
  - return:
      total_bytes: = state.total_bytes
      free_bytes: = state.total_bytes - vars.used
      weights_bytes: = state.weights_bytes
      kv_cache_bytes: = state.kv_cache_bytes
      compute_capability: '= has(state.compute_capability) ? string(state.compute_capability) : ''9.0'''
- component: gpu-memory
  name: profile-peak
  kind: io
  summary: 'The memory profiler''s view of a dummy forward: the transient torch peak above persistent allocations,
    and the non-torch runtime memory startup leaves allocated.'
  sources:
  - vllm/utils/mem_utils.py:296-321
  latency_ms: 0
  request:
    type: object
    required:
    - num_tokens
    properties:
      num_tokens:
        type: integer
        examples:
        - 2048
  response:
    type: object
    properties:
      peak_activation_bytes:
        type: integer
      runtime_bytes:
        type: integer
  behavior:
  - title: Transient activation peak grows with the profiled token count
    detail: torch_peak - torch_allocated after the dummy run (transient_peak_headroom); bytes per token is a labeled
      assumption. Non-torch memory grown since the init snapshot is the device fact non_torch_bytes when the world
      gives it, else the 1 GiB assumption.
    source: vllm/utils/mem_utils.py:318-321
    set:
      state.peak_activation_bytes: = input.num_tokens * int(config['worker-runner-activation-bytes-per-token'])
      state.runtime_bytes: '= has(state.non_torch_bytes) ? 0 : int(config[''worker-runner-non-torch-memory-bytes''])'
  - return:
      peak_activation_bytes: = state.peak_activation_bytes
      runtime_bytes: '= has(state.non_torch_bytes) ? state.non_torch_bytes : state.runtime_bytes'
- component: gpu-memory
  name: allocate
  kind: io
  summary: Allocates device memory for one pool (kv_cache, cudagraph, weights, runtime); fails like torch.OutOfMemoryError
    when it does not fit.
  sources:
  - vllm/v1/worker/gpu/attn_utils.py:396-455
  latency_ms: 0
  errors:
  - code: out-of-memory-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - kind
    - bytes
    properties:
      kind:
        type: string
        enum:
        - kv_cache
        - cudagraph
        - weights
        - runtime
      bytes:
        type: integer
      pool:
        type:
        - string
        - 'null'
        default: null
        description: the CuMem memory-pool tag the allocation is made under (sleep mode), or None
  response:
    type: object
    properties:
      kind:
        type: string
      bytes:
        type: integer
      free_bytes:
        type: integer
      pool:
        type:
        - string
        - 'null'
  behavior:
  - set:
      vars.used: '= state.weights_bytes + state.kv_cache_bytes + (has(state.runtime_bytes) ? state.runtime_bytes
        : 0) + (has(state.non_torch_bytes) ? state.non_torch_bytes : 0) + (has(state.cudagraph_bytes) ? state.cudagraph_bytes
        : 0) + (has(state.other_process_bytes) ? state.other_process_bytes : 0)'
  - title: Weights, KV cache and graph pools are one per rank; a repeat allocation replaces the old one
    detail: A rank's process holds one model, one KV cache and one graph pool; loading or allocating again (a new
      engine in the same world, reload, wake_up) replaces it instead of adding a second copy.
    source: vllm/v1/worker/gpu/attn_utils.py:396-455
    set:
      vars.prev: '= input.kind == ''kv_cache'' ? state.kv_cache_bytes : (input.kind == ''weights'' ? state.weights_bytes
        : (input.kind == ''cudagraph'' && has(state.cudagraph_bytes) ? state.cudagraph_bytes : 0))'
  - if: input.bytes > state.total_bytes - (vars.used - vars.prev)
    then:
    - title: CUDA out of memory
      fail:
        code: out-of-memory-error
        status: 0
        message: '= ''CUDA out of memory: tried to allocate '' + string(input.bytes) + '' bytes for '' + input.kind
          + '', '' + string(state.total_bytes - vars.used) + '' free'''
  - when: input.kind == 'kv_cache'
    set:
      state.kv_cache_bytes: = input.bytes
  - when: input.kind == 'cudagraph'
    set:
      state.cudagraph_bytes: = input.bytes
  - when: input.kind == 'weights'
    set:
      state.weights_bytes: = input.bytes
  - when: input.kind == 'runtime'
    set:
      state.runtime_bytes: '= (has(state.runtime_bytes) ? state.runtime_bytes : 0) + input.bytes'
  - return:
      kind: = input.kind
      bytes: = input.bytes
      free_bytes: = state.total_bytes - (vars.used - vars.prev) - input.bytes
      pool: '= has(input.pool) ? input.pool : null'
- component: gpu-memory
  name: free
  kind: io
  summary: Releases (or unmaps) one pool's device memory, as sleep mode does for discarded or offloaded tags.
  sources:
  - vllm/device_allocator/cumem.py:233-299
  latency_ms: 0
  request:
    type: object
    required:
    - kind
    properties:
      kind:
        type: string
        enum:
        - kv_cache
        - cudagraph
        - weights
        - runtime
  response:
    type: object
    properties:
      kind:
        type: string
      freed_bytes:
        type: integer
  behavior:
  - set:
      vars.freed: '= input.kind == ''kv_cache'' ? state.kv_cache_bytes : (input.kind == ''weights'' ? state.weights_bytes
        : (input.kind == ''cudagraph'' ? (has(state.cudagraph_bytes) ? state.cudagraph_bytes : 0) : (has(state.runtime_bytes)
        ? state.runtime_bytes : 0)))'
  - when: input.kind == 'kv_cache'
    set:
      state.kv_cache_bytes: 0
  - when: input.kind == 'weights'
    set:
      state.weights_bytes: 0
  - when: input.kind == 'cudagraph'
    set:
      state.cudagraph_bytes: 0
  - when: input.kind == 'runtime'
    set:
      state.runtime_bytes: 0
  - return:
      kind: = input.kind
      freed_bytes: = vars.freed
- component: worker-wrapper-base
  name: init-worker
  kind: rpc
  summary: 'collective_rpc init_worker: loads general plugins, lets the platform override Triton kernels, resolves
    parallel_config.worker_cls (must be a qualified-name string) and constructs the worker.'
  sources:
  - vllm/v1/worker/worker_base.py:259-338
  latency_ms: 0
  errors:
  - code: value-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      worker_cls:
        type: string
        examples:
        - vllm.v1.worker.gpu_worker.Worker
      rank:
        type: integer
        examples:
        - 0
  response:
    type: object
    properties:
      worker_cls:
        type: string
  behavior:
  - title: Load general plugins before any worker code runs
    source: vllm/v1/worker/worker_base.py:276-278
    call: plugins.load-general-plugins
    input: {}
  - title: worker_cls must be a qualified-name string
    source: vllm/v1/worker/worker_base.py:285-295
    if: input.worker_cls == ''
    then:
    - fail:
        code: value-error
        status: 0
        message: passing worker_cls is no longer supported. Please pass keep the class in a separate module and
          pass the qualified name of the class as a string.
  - title: Construct the worker inside set_current_vllm_config
    source: vllm/v1/worker/worker_base.py:336-338
    set:
      state.worker_cls: = input.worker_cls
  - return:
      worker_cls: = input.worker_cls
- component: worker-wrapper-base
  name: update-environment-variables
  kind: rpc
  summary: 'collective_rpc update_environment_variables (Ray executor): applies this rank''s entry of the per-rank
    env list.'
  sources:
  - vllm/v1/worker/worker_base.py:252-257
  latency_ms: 0
