- component: gpu-model-runner
  name: add-lora
  kind: function
  summary: 'LoRAModelRunnerMixin.add_lora: RuntimeError(''LoRA is not enabled'') without --enable-lora; else the
    worker LoRA manager adds the adapter.'
  sources:
  - vllm/v1/worker/lora_model_runner_mixin.py:286-288
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      lora_name:
        type: string
      lora_int_id:
        type: integer
      lora_path:
        type: string
  response:
    type: object
    properties:
      added:
        type: boolean
  behavior:
  - call: gpu-model-runner.ensure-lora-enabled
    input: {}
  - call: lru-cache-worker-lora-manager.add-adapter
    input:
      lora_name: = input.lora_name
      lora_int_id: = input.lora_int_id
      lora_path: = input.lora_path
    as: r
  - set:
      state.loras: '= (has(state.loras) ? state.loras : []) + [input.lora_int_id]'
  - return:
      added: '= has(vars.r.value.loaded) ? vars.r.value.loaded : vars.r.value.added'
- component: gpu-model-runner
  name: remove-lora
  kind: function
  summary: LoRAModelRunnerMixin.remove_lora.
  sources:
  - vllm/v1/worker/lora_model_runner_mixin.py:290-292
  latency_ms: 0
  request:
    type: object
    properties:
      lora_int_id:
        type: integer
  response:
    type: object
    properties:
      removed:
        type: boolean
  behavior:
  - call: gpu-model-runner.ensure-lora-enabled
    input: {}
  - call: lru-cache-worker-lora-manager.remove-adapter
    input:
      lora_int_id: = input.lora_int_id
  - set:
      vars.had: = has(state.loras) && input.lora_int_id in state.loras
  - set:
      state.loras: '= has(state.loras) ? state.loras.filter(x, x != input.lora_int_id) : []'
  - return:
      removed: = vars.had
- component: gpu-model-runner
  name: pin-lora
