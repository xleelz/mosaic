- component: cudagraph-dispatcher-v1
  name: initialize-cudagraph-keys
  kind: function
  summary: 'CudagraphDispatcher.initialize_cudagraph_keys (V1): nothing with mode NONE; otherwise one mixed-mode
    key per capture size (PIECEWISE keys drop num_reqs and uniform), plus, when decode runs FULL as a separate routine,
    FULL uniform-decode keys for capture sizes between the decode query length and max_num_seqs x that length.'
  sources:
  - vllm/v1/cudagraph_dispatcher.py:164-231
  latency_ms: 0
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - cudagraph_mode
    properties:
      cudagraph_mode:
        type: string
        enum:
        - NONE
        - PIECEWISE
        - FULL
        - FULL_DECODE_ONLY
        - FULL_AND_PIECEWISE
      uniform_decode_query_len:
        type: integer
        default: 1
      capture_sizes:
        type:
        - array
        - 'null'
        items:
          type: integer
  response:
    type: object
    properties:
      mixed_keys:
        type: array
      decode_keys:
        type: array
  behavior:
  - if: input.cudagraph_mode == 'NONE'
    then:
    - source: vllm/v1/cudagraph_dispatcher.py:171-174
      return:
        mixed_keys: []
        decode_keys: []
  - set:
      vars.mixed: '= input.cudagraph_mode in [''PIECEWISE'', ''FULL_AND_PIECEWISE''] ? ''PIECEWISE'' : (input.cudagraph_mode
        == ''FULL'' ? ''FULL'' : ''NONE'')'
  - if: input.capture_sizes == null && (vars.mixed != 'NONE' || input.cudagraph_mode in ['FULL_DECODE_ONLY', 'FULL_AND_PIECEWISE'])
    then:
    - source: vllm/v1/cudagraph_dispatcher.py:187-189
      fail:
        code: assertion-error
        status: 0
        message: Cudagraph capture sizes must be set when mixed mode is enabled.
  - title: 'Mixed-mode keys: every capture size (PIECEWISE ones match any request count)'
    source: vllm/v1/cudagraph_dispatcher.py:186-201
    set:
      vars.mk: '= vars.mixed == ''NONE'' ? [] : input.capture_sizes.map(b, {''mode'': vars.mixed, ''num_tokens'':
        b, ''num_reqs'': vars.mixed == ''PIECEWISE'' ? dyn(null) : dyn(b)})'
  - title: FULL uniform-decode keys when decode runs FULL as a separate routine
    source: vllm/v1/cudagraph_dispatcher.py:203-229
    set:
      vars.dk: '= input.cudagraph_mode in [''FULL_DECODE_ONLY'', ''FULL_AND_PIECEWISE''] ? input.capture_sizes.filter(b,
        b <= input.uniform_decode_query_len * int(config[''max-num-seqs'']) && b >= input.uniform_decode_query_len).map(b,
        {''mode'': ''FULL'', ''num_tokens'': b, ''uniform'': true}) : []'
  - return:
      mixed_keys: = vars.mk
      decode_keys: = vars.dk
