- component: gpu-worker-impl
  name: sleep
  kind: rpc
  summary: 'collective_rpc sleep(level): level 2 first saves model buffers (and preserved parameters) to CPU; the
    sleep backend offloads/discards pools; logs the memory freed. Asserts memory did not grow.'
  sources:
  - vllm/v1/worker/gpu_worker.py:294-330
  latency_ms: 0
  request:
    type: object
    properties:
      level:
        type: integer
        enum:
        - 1
        - 2
        default: 1
  response:
    type: object
    properties:
      freed_bytes:
        type: integer
  behavior:
  - if: input.level == 2
    then:
    - title: Save model buffers to CPU before a level 2 sleep
      source: vllm/v1/worker/gpu_worker.py:299-309
      set:
        state.saved_buffers: true
  - title: Suspend through the sleep-mode backend
    source: vllm/v1/worker/gpu_worker.py:311
    call: cu-mem-allocator.sleep
    input:
      level: = input.level
    as: s
  - set:
      state.sleep_level: = input.level
  - return:
      freed_bytes: = vars.s.value.freed_bytes
- component: gpu-worker-impl
  name: wake-up
  kind: rpc
  summary: 'collective_rpc wake_up(tags): resumes the backend, restores the level-2 buffers when weights wake, synchronizes
    the device.'
  sources:
  - vllm/v1/worker/gpu_worker.py:332-356
  latency_ms: 0
  request:
    type: object
    properties:
      tags:
        type: array
        items:
          type: string
        default: []
  response:
    type: object
    properties:
      restored:
        type: array
      buffers_restored:
        type: boolean
  behavior:
  - call: cu-mem-allocator.wake-up
    input:
      tags: '= has(input.tags) ? input.tags : []'
    as: w
  - set:
      vars.wake_weights: = !has(input.tags) || size(input.tags) == 0 || 'weights' in input.tags
  - set:
      vars.restored_buffers: = vars.wake_weights && state.saved_buffers
  - if: vars.restored_buffers
    then:
    - title: Copy the saved buffers back into the model
      source: vllm/v1/worker/gpu_worker.py:340-346
      set:
        state.saved_buffers: false
  - set:
      state.sleep_level: '= vars.wake_weights ? 0 : state.sleep_level'
  - call: worker-base.synchronize-device
    input: {}
  - return:
      restored: = vars.w.value.restored
      buffers_restored: = vars.restored_buffers
- component: gpu-worker-impl
  name: discard
