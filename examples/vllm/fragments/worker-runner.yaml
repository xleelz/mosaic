        - -1
        - -1
        - -1
  - flow: wr-sample-tokens
    as: s1
  - flow: wr-spec-decode-step
    as: e2
    input:
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-abc123
        num_computed_tokens:
        - 104
        new_block_ids:
        - []
      num_scheduled_tokens:
