- component: cuda-graph-manager
  name: resolve-cudagraph-mode
  kind: function
  summary: 'CompilationConfig.resolve_cudagraph_mode_and_sizes: downgrades the configured cudagraph_mode to what
    the attention backends support. A FULL mixed mode needs ALWAYS: otherwise FULL_AND_PIECEWISE when attention
    is a splitting op (VLLM_COMPILE), else FULL_DECODE_ONLY, and NEVER raises; FULL decode graphs with NEVER fall
    to PIECEWISE or NONE; spec decode (query len > 1) needs UNIFORM_BATCH; without piecewise capture the piecewise
    half is dropped; a FULL graph left with NEVER support raises.'
  sources:
  - vllm/config/compilation.py:1369-1486
  - vllm/config/compilation.py:60-97
  - vllm/config/compilation.py:1273-1276
  latency_ms: 0
  errors:
  - code: value-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - min_cg_support
    properties:
      min_cg_support:
        type: string
        enum:
        - ALWAYS
        - UNIFORM_BATCH
        - UNIFORM_SINGLE_TOKEN_DECODE
        - NEVER
      min_cg_attn_backend:
        type:
        - string
        - 'null'
        default: null
      uniform_decode_query_len:
        type: integer
        default: 1
  response:
    type: object
    properties:
      cudagraph_mode:
        type: string
      warnings:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.m: '= config[''enforce-eager''] ? ''NONE'' : config[''cudagraph-mode'']'
  - if: vars.m == null || vars.m == 'NONE'
    then:
    - source: vllm/config/compilation.py:1383-1385
      return:
        cudagraph_mode: NONE
        warnings: []
  - set:
      vars.r: '= {''NEVER'': 0, ''UNIFORM_SINGLE_TOKEN_DECODE'': 1, ''UNIFORM_BATCH'': 2, ''ALWAYS'': 3}[input.min_cg_support]'
      vars.be: '= has(input.min_cg_attn_backend) && input.min_cg_attn_backend != null ? input.min_cg_attn_backend
        : ''None'''
      vars.sup: = 'AttentionCGSupport.' + input.min_cg_support
      vars.dql: '= has(input.uniform_decode_query_len) ? input.uniform_decode_query_len : 1'
      vars.w: []
  - title: Attention is among the splitting ops (set_splitting_ops_for_v1 under VLLM_COMPILE), and the compiled
      model has piecewise submodules
    source: vllm/config/compilation.py:1160-1177
    set:
      vars.split_attn: = int(config['compilation-mode']) == 3
  - if: (vars.m == 'FULL') && vars.r != 3
    then:
    - set:
        vars.msg: '= ''CUDAGraphMode.'' + vars.m + '' is not supported with '' + vars.be + '' backend (support:
          '' + vars.sup + '')'''
    - if: vars.r == 0
      then:
      - title: No full CUDA graph support at all
        source: vllm/config/compilation.py:1398-1404
        fail:
          code: value-error
          status: 0
          message: = vars.msg + '; please try cudagraph_mode=PIECEWISE, and make sure compilation mode is VLLM_COMPILE'
    - title: 'FULL mixed batches need ALWAYS: fall back to FULL_AND_PIECEWISE (attention split out) or FULL_DECODE_ONLY,
        with a warning'
      source: vllm/config/compilation.py:1406-1413
      set:
        vars.w: '= vars.w + [vars.msg + (vars.split_attn ? ''; setting cudagraph_mode=FULL_AND_PIECEWISE'' : '';
          setting cudagraph_mode=FULL_DECODE_ONLY'')]'
        vars.m: '= vars.split_attn ? ''FULL_AND_PIECEWISE'' : ''FULL_DECODE_ONLY'''
  - if: vars.m in ['FULL', 'FULL_AND_PIECEWISE', 'FULL_DECODE_ONLY'] && vars.r == 0
    then:
    - title: 'FULL decode graphs with NEVER support: PIECEWISE when attention is compiled piecewise, else NONE'
      source: vllm/config/compilation.py:1416-1438
      set:
        vars.w: '= vars.w + [''CUDAGraphMode.'' + vars.m + '' is not supported with '' + vars.be + '' backend (support:
          '' + vars.sup + '')'' + (vars.split_attn ? ''; setting cudagraph_mode=PIECEWISE because attention is compiled
          piecewise'' : ''; setting cudagraph_mode=NONE because attention is not compiled piecewise'')]'
        vars.m: '= vars.split_attn ? ''PIECEWISE'' : ''NONE'''
  - if: vars.m in ['FULL', 'FULL_AND_PIECEWISE', 'FULL_DECODE_ONLY'] && vars.dql > 1 && vars.r < 2
    then:
    - title: 'Spec decode with FULL decode graphs needs UNIFORM_BATCH: PIECEWISE or NONE'
      source: vllm/config/compilation.py:1440-1457
      set:
        vars.w: '= vars.w + [''CUDAGraphMode.'' + vars.m + '' is not supported with spec-decode for attention backend
          '' + vars.be + '' (support: '' + vars.sup + '')'' + (vars.split_attn ? ''; setting cudagraph_mode=PIECEWISE''
          : ''; setting cudagraph_mode=NONE'')]'
        vars.m: '= vars.split_attn ? ''PIECEWISE'' : ''NONE'''
  - if: '!vars.split_attn && vars.m in [''PIECEWISE'', ''FULL_AND_PIECEWISE'']'
    then:
    - title: 'No compiled submodule (and no breakable graphs): drop the piecewise half'
      source: vllm/config/compilation.py:1459-1473
      set:
        vars.w: '= vars.w + [''Cudagraph mode CUDAGraphMode.'' + vars.m + '' requires piecewise capture, but the
          loaded model provides neither a compiled submodule nor breakable CUDA graphs. Overriding to CUDAGraphMode.''
          + (vars.m == ''PIECEWISE'' ? ''NONE'' : ''FULL_DECODE_ONLY'') + ''.'']'
        vars.m: '= vars.m == ''PIECEWISE'' ? ''NONE'' : ''FULL_DECODE_ONLY'''
  - if: vars.m in ['FULL', 'FULL_AND_PIECEWISE', 'FULL_DECODE_ONLY'] && vars.r == 0
    then:
    - source: vllm/config/compilation.py:1477-1486
      fail:
        code: value-error
        status: 0
        message: = 'CUDAGraphMode.' + vars.m + ' is not supported with ' + vars.be + ' backend (support:' + vars.sup
          + ') ; please try cudagraph_mode=PIECEWISE, and make sure compilation mode is VLLM_COMPILE'
  - return:
      cudagraph_mode: = vars.m
      warnings: = vars.w
