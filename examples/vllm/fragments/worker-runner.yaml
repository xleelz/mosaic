- component: gpu-worker-impl
  name: update-weights
  kind: rpc
  summary: 'collective_rpc update_weights: loads one chunk into the session''s model; a list is indexed by dp_index
    * world_size + rank. A failing chunk ends the session.'
  sources:
  - vllm/v1/worker/gpu_worker.py:1550-1585
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      update_info:
        type: object
  response:
    type: object
    properties:
      chunks:
        type: integer
  behavior:
  - if: '!state.weight_transfer_engine'
    then:
    - fail:
        code: runtime-error
        status: 0
        message: Weight transfer not configured. Please set weight_transfer_config to enable weight transfer.
  - call: weight-update-session.get
    input: {}
    as: sess
  - if: '!vars.sess.value.active'
    then:
    - title: update_weights before start_weight_update
      source: vllm/v1/worker/gpu_worker.py:1567-1570
      fail:
        code: runtime-error
        status: 0
        message: start_weight_update must be called before update_weights.
  - call: weight-transfer-engine.update-weights
    input:
      update_info: '= has(input.update_info) ? input.update_info : {}'
    as: up
    on_error:
    - title: A failed chunk resets the session
      source: vllm/v1/worker/gpu_worker.py:1581-1585
      call: weight-update-session.release
      input: {}
    - fail: = error
  - set:
      state.weight_chunks: '= (has(state.weight_chunks) ? state.weight_chunks : 0) + 1'
  - return:
      chunks: = state.weight_chunks
- component: gpu-worker-impl
  name: finish-weight-update
  kind: rpc
  summary: 'collective_rpc finish_weight_update: closes the session; a non-draft update resets LoRA state because
    weight transfer bypasses reload_weights.'
  sources:
  - vllm/v1/worker/gpu_worker.py:1587-1604
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  response:
    type: object
    properties:
      finished:
        type: boolean
      lora_reset:
        type: boolean
  behavior:
  - if: '!state.weight_transfer_engine'
    then:
    - fail:
        code: runtime-error
        status: 0
        message: Weight transfer not configured. Please set weight_transfer_config to enable weight transfer.
  - call: weight-update-session.get
    input: {}
    as: sess
  - if: '!vars.sess.value.active'
    then:
    - fail:
        code: runtime-error
        status: 0
        message: finish_weight_update called without a matching start_weight_update.
  - call: weight-transfer-engine.finish-weight-update
    input: {}
  - call: weight-update-session.release
    input: {}
  - if: '!vars.sess.value.is_draft'
    then:
    - title: Reset LoRA state after a target-model update
      source: vllm/v1/worker/gpu_worker.py:1602-1604
      call: gpu-model-runner.reset-lora-state
      input: {}
    - return:
        finished: true
        lora_reset: true
  - return:
      finished: true
      lora_reset: false
