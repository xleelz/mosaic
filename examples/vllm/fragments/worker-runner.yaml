- component: cu-mem-allocator
  name: sleep
  kind: function
  summary: 'CuMemBackend.suspend -> CuMemAllocator.sleep: level 1 offloads weights (and runtime/cudagraph pools)
    to host and discards the KV cache; level 2 also discards the weights. Only memory allocated in the CuMem pool
    (enable_sleep_mode) is affected.'
  sources:
  - vllm/device_allocator/sleep_mode_backend.py:127-137
  - vllm/device_allocator/cumem.py:233-299
  latency_ms: 0
  request:
    type: object
    required:
    - level
    properties:
      level:
        type: integer
        enum:
        - 1
        - 2
        examples:
        - 1
  response:
    type: object
    properties:
      freed_bytes:
        type: integer
      offloaded:
        type: array
      discarded:
        type: array
  behavior:
  - if: '!config[''enable-sleep-mode'']'
    then:
    - title: Nothing was allocated in the CuMem pool
      detail: Without enable_sleep_mode the worker uses nullcontext() for every pool, so the allocator holds no
        allocations and sleep frees nothing.
      source: vllm/v1/worker/gpu_worker.py:385-389
      return:
        freed_bytes: 0
        offloaded: []
        discarded: []
  - set:
      vars.offload: '= input.level == 1 ? [''weights'', ''runtime'', ''cudagraph''] : [''runtime'', ''cudagraph'']'
      vars.discard: '= input.level == 1 ? [''kv_cache''] : [''weights'', ''kv_cache'']'
  - call: gpu-memory.free
    input:
      kind: kv_cache
    as: kv
  - call: gpu-memory.free
    input:
      kind: weights
    as: w
  - call: gpu-memory.free
    input:
      kind: cudagraph
    as: cg
  - set:
      state.offloaded: = vars.offload
      state.discarded: = vars.discard
      state.offloaded_weights_bytes: '= input.level == 1 ? vars.w.value.freed_bytes : 0'
      state.weights_bytes_before_sleep: = vars.w.value.freed_bytes
      state.kv_cache_bytes_before_sleep: = vars.kv.value.freed_bytes
      state.cudagraph_bytes_before_sleep: = vars.cg.value.freed_bytes
  - return:
      freed_bytes: = vars.kv.value.freed_bytes + vars.w.value.freed_bytes + vars.cg.value.freed_bytes
      offloaded: = vars.offload
      discarded: = vars.discard
- component: cu-mem-allocator
  name: wake-up
  kind: function
  summary: 'CuMemAllocator.wake_up: re-maps the given tags (all when None); offloaded tags are copied back from
    host, discarded ones come back uninitialized.'
  sources:
  - vllm/device_allocator/sleep_mode_backend.py:139-145
  - vllm/device_allocator/cumem.py:331-360
  latency_ms: 0
  request:
    type: object
    properties:
      tags:
        type: array
        items:
          type: string
        default: []
  response:
    type: object
    properties:
      restored:
        type: array
      content_lost:
        type: array
  behavior:
  - if: '!config[''enable-sleep-mode'']'
    then:
    - return:
        restored: []
        content_lost: []
  - set:
      vars.tags: '= has(input.tags) && size(input.tags) > 0 ? input.tags : [''weights'', ''kv_cache'', ''cudagraph'']'
  - if: '''weights'' in vars.tags && has(state.weights_bytes_before_sleep) && state.weights_bytes_before_sleep >
      0'
    then:
    - call: gpu-memory.allocate
      input:
        kind: weights
        bytes: = state.weights_bytes_before_sleep
  - if: '''kv_cache'' in vars.tags && has(state.kv_cache_bytes_before_sleep) && state.kv_cache_bytes_before_sleep
      > 0'
    then:
    - call: gpu-memory.allocate
      input:
        kind: kv_cache
        bytes: = state.kv_cache_bytes_before_sleep
  - if: '''weights'' in vars.tags && has(state.cudagraph_bytes_before_sleep) && state.cudagraph_bytes_before_sleep
      > 0'
    then:
    - call: gpu-memory.allocate
      input:
        kind: cudagraph
        bytes: = state.cudagraph_bytes_before_sleep
  - set:
      vars.lost: = state.discarded.filter(t, t in vars.tags)
      state.offloaded: = state.offloaded.filter(t, !(t in vars.tags))
      state.discarded: = state.discarded.filter(t, !(t in vars.tags))
  - return:
      restored: = vars.tags
      content_lost: = vars.lost
- component: cu-mem-allocator
  name: discard
  kind: function
  summary: 'CuMemAllocator.discard: drops the host copies (or mappings) of the given tags so they cannot be restored.'
  sources:
  - vllm/device_allocator/sleep_mode_backend.py:147-151
  - vllm/device_allocator/cumem.py:300-330
  latency_ms: 0
  request:
    type: object
    properties:
      tags:
        type: array
        items:
          type: string
        examples:
        - - weights
  response:
    type: object
    properties:
      discarded:
        type: array
  behavior:
  - if: '!config[''enable-sleep-mode'']'
    then:
    - return:
        discarded: []
  - set:
      state.discarded: = state.discarded + input.tags.filter(t, !(t in state.discarded))
      state.offloaded: = state.offloaded.filter(t, !(t in input.tags))
  - when: '''weights'' in input.tags'
    set:
      state.offloaded_weights_bytes: 0
  - return:
      discarded: = state.discarded
