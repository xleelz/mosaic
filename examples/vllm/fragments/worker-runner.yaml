components:
- id: worker-wrapper-base
  name: WorkerWrapperBase
  kind: module
  parent: gpu-worker
  layer: worker
  summary: Lazily constructs the worker class named by parallel_config.worker_cls inside each worker process and
    forwards collective_rpc calls to it.
  sources:
  - vllm/v1/worker/worker_base.py:198-377
- id: worker-base
  name: WorkerBase
  kind: module
  parent: gpu-worker
  layer: worker
  summary: 'Base worker: KV cache layout negotiation, device sync, model inspection and other RPCs every worker
    inherits.'
  sources:
  - vllm/v1/worker/worker_base.py:58-195
- id: gpu-worker-impl
  name: Worker (GPU)
  kind: module
  parent: gpu-worker
  layer: worker
  capacity:
    concurrency: 1
  description: 'Every Worker method runs on the worker process''s one RPC thread: WorkerProc.worker_busy_loop dequeues
    one RPC at a time and runs it to completion (vllm/v1/executor/multiproc_executor.py:1037-1068), so calls on
    one rank are serialized (capacity 1).'
  summary: 'vllm.v1.worker.gpu_worker.Worker: the per-rank collective_rpc target. Initializes the device, loads
    the model, sizes and allocates the KV cache, captures CUDA graphs, runs execute_model/sample_tokens, sleep mode,
    weight transfer, LoRA and profiling.'
  sources:
  - vllm/v1/worker/gpu_worker.py:194-1637
  state:
    schema:
      type: object
      properties:
        device_initialized:
          type: boolean
        runner:
          type: string
        init_free_memory:
          type: integer
        requested_memory:
          type: integer
        total_consumed:
          type: integer
        peak_activation_memory:
          type: integer
        cudagraph_memory_estimate:
          type: integer
        available_kv_cache_memory_bytes:
          type: integer
        num_gpu_blocks:
          type: integer
        bytes_per_block:
          type: integer
        sleep_level:
          type: integer
        saved_buffers:
          type: boolean
        weight_transfer_engine:
          type: boolean
        profiler_running:
          type: boolean
        profiler_created:
          type: boolean
        shut_down:
          type: boolean
        is_pooling_model:
          type: boolean
    initial:
      is_pooling_model: false
      pp_rank: 0
      is_first_pp_rank: true
      is_last_pp_rank: true
      pp_send_pending: false
      device_initialized: true
      runner: v2
      init_free_memory: 85899345920
      requested_memory: 79027398247
      total_consumed: 0
      peak_activation_memory: 0
      cudagraph_memory_estimate: 0
      available_kv_cache_memory_bytes: 0
      num_gpu_blocks: 0
      bytes_per_block: 2097152
      sleep_level: 0
      saved_buffers: false
      weight_transfer_engine: false
      profiler_running: false
      profiler_created: false
      shut_down: false
- id: weight-update-session
  name: Worker weight-update session flags
  kind: datastore
  parent: gpu-worker-impl
  layer: worker
  summary: 'Worker._weight_update_active and _weight_update_is_draft: one RL weight-update session at a time per
    worker.'
  sources:
  - vllm/v1/worker/gpu_worker.py:223-227
  state:
    schema:
      type: object
      properties:
        sessions:
          type: object
    initial:
      sessions: {}
- id: alloc-conf
  name: alloc_conf.py
  kind: module
  parent: gpu-worker
  layer: memory
  summary: Reads and edits PyTorch's allocator config string (torch resets every option absent from the string it
    is handed).
  sources:
  - vllm/device_allocator/alloc_conf.py:1-119
- id: worker-utils
  name: vllm/v1/worker/utils.py
  kind: module
  parent: gpu-worker
  layer: worker
  summary: 'Worker helpers: request_memory (the gpu_memory_utilization budget check) and KV cache bookkeeping.'
  sources:
  - vllm/v1/worker/utils.py:716-772
- id: worker-sentinel
  name: WorkerSentinel
  kind: module
  parent: gpu-worker
  layer: worker
  summary: Fault-tolerance sentinel that executes engine-core FT commands (retry, pause) on the worker; built only
    with enable_fault_tolerance.
  sources:
  - vllm/v1/worker/sentinel/gpu_worker_sentinel.py:29-80
- id: cu-mem-allocator
  name: CuMemAllocator
  kind: module
  parent: gpu-worker
  layer: memory
  summary: 'Sleep-mode allocator: tags allocations (weights, kv_cache, runtime, cudagraph, workspace) so sleep can
    offload some to host and discard the rest; resumed by wake_up.'
  sources:
  - vllm/device_allocator/cumem.py:233-360
  - vllm/device_allocator/sleep_mode_backend.py:116-155
  state:
    schema:
      type: object
      properties:
        offloaded:
          type: array
          items:
            type: string
        discarded:
          type: array
          items:
            type: string
    initial:
      offloaded: []
      discarded: []
- id: gpu-model-runner
  name: GPUModelRunner (V2)
  kind: module
  parent: gpu-worker
  layer: runner
  summary: 'vllm/v1/worker/gpu/model_runner.py: the deployed model runner. Keeps a persistent batch of request slots,
    prepares inputs, dispatches CUDA graphs, runs the model, samples and proposes drafts.'
