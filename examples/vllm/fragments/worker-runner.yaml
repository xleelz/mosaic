scenarios:
- id: wr-execute-model-prefill-piecewise
  name: A 100-token prefill runs through PIECEWISE graphs padded to 104 and defers sampling
  flow: wr-execute-model
  fixtures:
  - full-tp1-llama-8b
  input:
    scheduled_new_reqs:
    - req_id: chatcmpl-abc123
      prompt_token_ids: = lists.range(100).map(i, 1000 + i)
      block_ids:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      num_computed_tokens: 0
      sampling_params:
        temperature: 0.0
        max_tokens: 16
    scheduled_cached_reqs:
      req_ids: []
      num_computed_tokens: []
      new_block_ids: []
    num_scheduled_tokens:
      chatcmpl-abc123: 100
    total_num_scheduled_tokens: 100
    finished_req_ids: []
  expect:
  - result.ok && result.value == null
  - state['gpu-model-runner@rank0'].slots['chatcmpl-abc123'].slot == 1023
  - duration_ms >= 1
- id: wr-execute-model-prefill-then-decode
  name: Prefill, sample, then a 1-token decode replays the FULL graph
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: wr-execute-model
    as: e1
    input:
      scheduled_new_reqs:
      - req_id: chatcmpl-abc123
        prompt_token_ids: = lists.range(100).map(i, 1000 + i)
        block_ids:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        num_computed_tokens: 0
        sampling_params:
          temperature: 0.0
          max_tokens: 16
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens:
        chatcmpl-abc123: 100
      total_num_scheduled_tokens: 100
      finished_req_ids: []
  - flow: wr-sample-tokens
    as: s1
  - flow: wr-execute-model
    as: e2
    input:
      scheduled_new_reqs: []
      scheduled_cached_reqs:
        req_ids:
        - chatcmpl-abc123
        num_computed_tokens:
        - 100
        new_block_ids:
        - []
      num_scheduled_tokens:
        chatcmpl-abc123: 1
      total_num_scheduled_tokens: 1
      finished_req_ids: []
  - flow: wr-sample-tokens
    as: s2
  expect:
  - steps.e1.result.ok && steps.e1.result.value == null
  - steps.s1.result.value.req_ids == ['chatcmpl-abc123'] && size(steps.s1.result.value.sampled_token_ids[0]) ==
    1
  - steps.s2.result.value.req_ids == ['chatcmpl-abc123'] && size(steps.s2.result.value.sampled_token_ids[0]) ==
    1
  - trace.filter(e, e.type == 'call.start' && e.interface == 'input-batch.prepare-prefill-inputs-kernel').size()
    == 1
- id: wr-execute-model-chunked-prefill-eager
  name: A 2048-token chunk of a 3000-token prompt is larger than every capture size, runs eagerly and samples nothing
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_new_reqs:
      - req_id: chatcmpl-long1
        prompt_token_ids: = lists.range(3000)
        block_ids:
        - 0
        num_computed_tokens: 0
        sampling_params:
          temperature: 0.0
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens:
        chatcmpl-long1: 2048
      total_num_scheduled_tokens: 2048
      finished_req_ids: []
  - flow: wr-sample-tokens
    as: s
  expect:
  - steps.e.result.ok && steps.e.duration_ms >= 4
  - steps.s.result.value.sampled_token_ids == [[]]
  - trace.exists(e, e.type == 'call.end' && e.interface == 'cuda-graph-manager.dispatch' && e.output.cg_mode ==
    'NONE')
- id: wr-execute-model-empty-step-frees-slot
  name: A step with no scheduled tokens frees finished requests' slots and skips the forward
  flow: wr-execute-model
  fixtures:
  - full-tp1-llama-8b
  state:
    gpu-model-runner:
      slots:
        chatcmpl-done1:
          slot: 1023
          prefill_len: 10
          prompt_len: 10
      fresh_slots_used: 1
  input:
    scheduled_new_reqs: []
    scheduled_cached_reqs:
      req_ids: []
      num_computed_tokens: []
      new_block_ids: []
    num_scheduled_tokens: {}
    total_num_scheduled_tokens: 0
    finished_req_ids:
    - chatcmpl-done1
  expect:
  - result.ok && result.value.req_ids == []
  - size(state['gpu-model-runner@rank0'].slots) == 0 && state['gpu-model-runner@rank0'].free_slots == [1023]
- id: wr-execute-model-slot-reuse
  name: A finished request's slot is the next new request's slot (LIFO free list)
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: wr-execute-model
    as: e1
    input:
      scheduled_new_reqs:
      - req_id: chatcmpl-abc123
        prompt_token_ids: = lists.range(100).map(i, 1000 + i)
        block_ids:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        num_computed_tokens: 0
        sampling_params:
          temperature: 0.0
          max_tokens: 16
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens:
        chatcmpl-abc123: 100
      total_num_scheduled_tokens: 100
      finished_req_ids: []
  - flow: wr-sample-tokens
    as: s1
  - flow: wr-execute-model
    as: e2
    input:
      scheduled_new_reqs:
      - req_id: chatcmpl-def456
        prompt_token_ids:
        - 1
        - 2
        - 3
        - 4
        block_ids:
        - 9
        num_computed_tokens: 0
        sampling_params:
          temperature: 0.0
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens:
        chatcmpl-def456: 4
      total_num_scheduled_tokens: 4
      finished_req_ids:
      - chatcmpl-abc123
  expect:
  - steps.e2.result.ok
  - '!(''chatcmpl-abc123'' in state[''gpu-model-runner@rank0''].slots)'
- id: wr-execute-model-unknown-request
  name: A cached request the runner never added fails with KeyError
  flow: wr-execute-model
  fixtures:
  - full-tp1-llama-8b
  input:
    scheduled_new_reqs: []
    scheduled_cached_reqs:
      req_ids:
      - chatcmpl-ghost
      num_computed_tokens:
      - 5
      new_block_ids:
      - []
    num_scheduled_tokens:
      chatcmpl-ghost: 1
    total_num_scheduled_tokens: 1
    finished_req_ids: []
  expect:
  - '!result.ok && result.error.code == ''key-error'' && result.error.message == "''chatcmpl-ghost''"'
  - calls['llama-for-causal-lm.forward'] == 0 && state['gpu-model-runner@rank0'].execute_model_state == null
- id: wr-execute-model-no-free-slot
  name: With max_num_seqs 2 a third concurrent request finds no free slot
  flow: wr-execute-model
  fixtures:
  - full-small-batch-limits
  input:
    scheduled_new_reqs:
    - req_id: chatcmpl-a1
      prompt_token_ids:
      - 1
      - 2
      block_ids:
      - 0
      num_computed_tokens: 0
    - req_id: chatcmpl-a2
      prompt_token_ids:
      - 1
      - 2
      block_ids:
      - 1
      num_computed_tokens: 0
    - req_id: chatcmpl-a3
      prompt_token_ids:
      - 1
      - 2
      block_ids:
      - 2
      num_computed_tokens: 0
    scheduled_cached_reqs:
      req_ids: []
      num_computed_tokens: []
      new_block_ids: []
    num_scheduled_tokens:
      chatcmpl-a1: 2
      chatcmpl-a2: 2
      chatcmpl-a3: 2
    total_num_scheduled_tokens: 6
    finished_req_ids: []
  expect:
  - '!result.ok && result.error.code == ''assertion-error'' && result.error.message == ''No free indices'''
  - state['gpu-model-runner@rank0'].slots['chatcmpl-a1'].slot == 1 && state['gpu-model-runner@rank0'].slots['chatcmpl-a2'].slot
    == 0
- id: wr-execute-model-small-batch-capture-sizes
  name: With max_num_seqs 2 the largest capture size is 4, so a 6-token batch runs eagerly
  fixtures:
  - full-small-batch-limits
  steps:
  - interface: cuda-graph-manager.init
    caller: gpu-model-runner
    as: init
    input:
      decode_query_len: 1
  - interface: cuda-graph-manager.capture
    caller: gpu-model-runner
    as: cap
  - flow: wr-execute-model
    as: e
    input:
      scheduled_new_reqs:
      - req_id: chatcmpl-a1
        prompt_token_ids:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        block_ids:
        - 0
        num_computed_tokens: 0
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens:
        chatcmpl-a1: 6
      total_num_scheduled_tokens: 6
      finished_req_ids: []
  expect:
  - steps.init.result.value.max_capture_size == 4 && state['cuda-graph-manager@rank0'].capture_sizes == [1, 2, 4]
  - steps.e.result.ok
- id: wr-execute-model-enforce-eager
  name: enforce_eager decodes without graphs and pays the launch overhead
  fixtures:
  - full-tp1-llama-8b
  config:
    enforce-eager: true
  state:
    gpu-model-runner:
      slots:
        chatcmpl-abc123:
          slot: 1023
          prefill_len: 100
          prompt_len: 100
      fresh_slots_used: 1
    sampler:
      slots:
        '1023':
          temperature: 0.0
          top_p: 1.0
          top_k: 128256
          min_p: 0.0
          seeded: false
          logprobs: -1
          penalties: false
          logit_bias: false
          thinking: false
          needs_processing: false
  flow: wr-execute-model
  input:
    scheduled_new_reqs: []
    scheduled_cached_reqs:
      req_ids:
      - chatcmpl-abc123
      num_computed_tokens:
      - 100
      new_block_ids:
      - []
    num_scheduled_tokens:
      chatcmpl-abc123: 1
    total_num_scheduled_tokens: 1
    finished_req_ids: []
  expect:
  - result.ok && state['gpu-model-runner@rank0'].execute_model_state.cg_mode == 'NONE'
  - duration_ms >= 4
- id: wr-execute-model-tp4-per-rank-slots
  name: Under TP 4 collective_rpc runs execute_model on all ranks at once; each keeps its own slots
  fixtures:
  - full-tp4-llama-70b
  state:
    gpu-model-runner:
      model:
        name: meta-llama/Llama-3.1-70B-Instruct
        architecture: LlamaForCausalLM
        num_hidden_layers: 80
        num_kv_heads: 8
        num_attention_heads: 64
        head_size: 128
        dtype_bytes: 2
        torch_dtype: bfloat16
        vocab_size: 128256
        hidden_size: 8192
        max_position_embeddings: 131072
        weights_bytes: 141107412992
        is_hybrid: false
        uses_mrope: false
        uses_prompt_embeds: false
  steps:
  - interface: executor.collective-rpc
    caller: engine-core
    as: ex
    input:
      method: execute_model
      args:
        scheduled_new_reqs:
        - req_id: chatcmpl-abc123
          prompt_token_ids: = lists.range(100).map(i, 1000 + i)
          block_ids:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          num_computed_tokens: 0
          sampling_params:
            temperature: 0.0
            max_tokens: 16
        scheduled_cached_reqs:
          req_ids: []
          num_computed_tokens: []
          new_block_ids: []
        num_scheduled_tokens:
          chatcmpl-abc123: 100
        total_num_scheduled_tokens: 100
        finished_req_ids: []
  expect:
  - steps.ex.result.ok && size(steps.ex.result.value.results) == 4
  - calls_by_instance['gpu-model-runner.execute-model@rank0'] == 1 && calls_by_instance['gpu-model-runner.execute-model@rank3']
    == 1
  - state['gpu-model-runner@rank3'].slots['chatcmpl-abc123'].slot == 1023 && state['gpu-model-runner@rank1'].slots['chatcmpl-abc123'].slot
    == 1023
- id: wr-execute-model-hybrid-mrope-dcp
  name: A hybrid Mamba model with M-RoPE, prompt embeds, DCP 2 and blocks to zero runs every model-state hook
  fixtures:
  - full-tp1-llama-8b
  config:
    decode-context-parallel-size: 2
  state:
    gpu-model-runner:
      model:
        architecture: HybridTestModel
        num_hidden_layers: 32
        num_kv_heads: 8
        head_size: 128
        dtype_bytes: 2
        vocab_size: 128256
        hidden_size: 4096
        is_hybrid: true
        uses_mrope: true
        uses_prompt_embeds: true
    mamba-hybrid-model-state:
      uses_recoverssm: true
  steps:
  - flow: wr-execute-model
    as: e
    input:
      scheduled_new_reqs:
      - req_id: chatcmpl-abc123
        prompt_token_ids:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
        block_ids:
        - 5
        - 6
        num_computed_tokens: 0
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens:
        chatcmpl-abc123: 8
      total_num_scheduled_tokens: 8
      finished_req_ids: []
      new_block_ids_to_zero:
      - 5
      - 6
  - flow: wr-sample-tokens
    as: s
  expect:
  - steps.s.result.ok
  - calls['cp-utils.dcp-local-seq-lens-kernel'] == 1 && calls['rope-state.prepare-rope-positions-kernel'] == 1 &&
    calls['prompt-embeds-state.apply-prompt-embeds-kernel'] == 1
- id: wr-sample-tokens-without-execute
  name: sample_tokens without a preceding forward returns None
  flow: wr-sample-tokens
  fixtures:
  - full-tp1-llama-8b
  expect:
  - result.ok && result.value == null
  - calls['sampler.sample'] == 0 && state['gpu-model-runner@rank0'].execute_model_state == null
- id: wr-determine-available-memory-h100-8b
  name: Llama-3.1-8B on an H100 at 0.92 leaves 59.7 GB for the KV cache, 28,488 blocks of 16 tokens
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: wr-load-model
    as: load
  - flow: wr-determine-available-memory
    as: mem
  - interface: gpu-worker-impl.get-num-gpu-blocks
    caller: engine-core
    as: blocks
  - interface: gpu-memory.snapshot
    caller: engine-core
    as: snap
  expect:
  - steps.mem.result.value == 59745650279
  - steps.blocks.result.value.num_gpu_blocks == 28488 && steps.blocks.result.value.bytes_per_block == 2097152
  - steps.snap.result.value.free_bytes == 85899345920 - 16060522496 - 1073741824 && trace.exists(e, e.type == 'call.end'
    && e.interface == 'gpu-memory.snapshot')
- id: wr-determine-available-memory-kv-cache-memory-bytes
  name: kv_cache_memory_bytes skips memory profiling and ignores gpu_memory_utilization
  fixtures:
  - full-tp1-llama-8b
  config:
    kv-cache-memory-bytes: 34359738368
  steps:
  - flow: wr-load-model
    as: load
  - flow: wr-determine-available-memory
    as: mem
  - interface: gpu-worker-impl.get-num-gpu-blocks
    caller: engine-core
    as: blocks
  expect:
  - steps.mem.result.value == 34359738368 && steps.blocks.result.value.num_gpu_blocks == 16384
  - trace.exists(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.get-num-gpu-blocks' && e.output.available_kv_cache_memory_bytes
    == 34359738368)
- id: wr-determine-available-memory-cudagraph-estimate-off
  name: With VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0 the graph estimate is not subtracted (256 more blocks)
  fixtures:
  - full-tp1-llama-8b
  config:
    vllm-memory-profiler-estimate-cudagraphs: false
  steps:
  - flow: wr-load-model
    as: load
  - flow: wr-determine-available-memory
    as: mem
  - interface: gpu-worker-impl.get-num-gpu-blocks
    caller: engine-core
    as: blocks
  expect:
  - steps.mem.result.value == 60282521191 && steps.blocks.result.value.num_gpu_blocks == 28744
  - trace.exists(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.get-num-gpu-blocks' && e.output.bytes_per_block
    == 2097152)
- id: wr-determine-available-memory-enforce-eager
  name: enforce_eager skips the CUDA graph memory profile
  fixtures:
  - full-tp1-llama-8b
  config:
    enforce-eager: true
  expect:
  - steps.main.result.value == 60282521191
  - calls['gpu-model-runner.profile-cudagraph-memory'] == 0 && state['gpu-worker-impl@rank0'].cudagraph_memory_estimate
    == 0
  steps:
  - flow: wr-load-model
    as: load
  - flow: wr-determine-available-memory
    as: main
- id: wr-determine-available-memory-small-batch
  name: A smaller max_num_batched_tokens profiles a smaller activation peak and leaves more KV memory
  fixtures:
  - full-small-batch-limits
  expect:
  - steps.main.result.value == 59745650279 + 1610612736 - 64 * 196608
  - steps.snap.result.value.free_bytes == 85899345920 - 16060522496 - 1073741824 && trace.exists(e, e.type == 'call.end'
    && e.interface == 'gpu-memory.snapshot')
  steps:
  - flow: wr-load-model
    as: load
  - flow: wr-determine-available-memory
    as: main
  - interface: gpu-memory.snapshot
    caller: engine-core
    as: snap
- id: wr-determine-available-memory-free-memory-grew
  name: Another process releasing memory during profiling fails the startup assertion
  flow: wr-determine-available-memory
  fixtures:
  - full-tp1-llama-8b
  state:
    gpu-worker-impl:
      init_free_memory: 60000000000
  expect:
  - '!result.ok && result.error.code == ''assertion-error'''
  - trace.exists(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.determine-available-memory' && e.error
    != null)
- id: wr-determine-available-memory-tp4-70b
  name: Through collective_rpc all four ranks load Llama-3.1-70B shards and profile at once; each holds 35 GB of
    weights and 1.25 MiB blocks
  fixtures:
  - full-tp4-llama-70b
  state:
    gpu-model-runner:
      model:
        name: meta-llama/Llama-3.1-70B-Instruct
        architecture: LlamaForCausalLM
        num_hidden_layers: 80
        num_kv_heads: 8
        num_attention_heads: 64
        head_size: 128
        dtype_bytes: 2
        torch_dtype: bfloat16
        vocab_size: 128256
        hidden_size: 8192
        max_position_embeddings: 131072
        weights_bytes: 141107412992
        is_hybrid: false
        uses_mrope: false
        uses_prompt_embeds: false
  steps:
  - interface: executor.collective-rpc
    caller: engine-core
    as: load
    input:
      method: load_model
      args: {}
  - interface: executor.collective-rpc
    caller: engine-core
    as: mem
    input:
      method: determine_available_memory
      args: {}
  - interface: gpu-worker-impl.get-num-gpu-blocks
    caller: engine-core
    'on': rank2
    as: b2
  - interface: gpu-memory.snapshot
    caller: engine-core
    as: snap3
    'on': rank3
  expect:
  - size(steps.mem.result.value.results) == 4 && steps.mem.result.value.results.all(r, r.value > 40000000000)
  - steps.b2.result.value.bytes_per_block == 1310720 && steps.b2.result.value.num_gpu_blocks == steps.mem.result.value.results.filter(r,
    r.rank == 'rank2')[0].value / 1310720
  - steps.snap3.result.value.weights_bytes == 35276853248 && trace.exists(e, e.type == 'call.end' && e.interface
    == 'gpu-memory.snapshot')
- id: wr-get-num-gpu-blocks-before-profiling
  name: The block count is not known before determine_available_memory runs
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: gpu-worker-impl.get-num-gpu-blocks
    caller: engine-core
    as: b
  expect:
  - '!steps.b.result.ok && steps.b.result.error.code == ''runtime-error'''
- id: wr-init-device-then-profile
  name: A fresh process budgets ceil(80 GiB * 0.92) and builds the V2 runner; profiling then reads that budget back
  fixtures:
  - full-tp1-llama-8b
  state:
    gpu-memory@rank0:
      weights_bytes: 0
    gpu-worker-impl:
      device_initialized: false
