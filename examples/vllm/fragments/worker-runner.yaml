      slot: 5
      sampling_params:
        temperature: 0.0
    as: accepted_req
  - interface: sampler.add-request
    caller: gpu-model-runner
    input:
      slot: 6
      sampling_params:
        temperature: 0.0
        extra_args:
          DryLogitsProcessor: false
    as: declined_req
  - interface: sampler.apply-staged-writes
    caller: gpu-model-runner
    as: flush
  - interface: sampler.apply-sampling-params
    caller: rejection-sampler
    input:
      rows:
