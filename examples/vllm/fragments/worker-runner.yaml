- component: gpu-worker-impl
  name: init-device
  kind: rpc
  summary: 'collective_rpc init_device: binds cuda:<local_rank>, initializes torch.distributed and the model-parallel
    groups (before the memory snapshot, so NCCL buffers are excluded), seeds RNGs, snapshots free memory, checks
    the gpu_memory_utilization budget, then builds the workspace and the V1 or V2 model runner.'
  sources:
  - vllm/v1/worker/gpu_worker.py:435-545
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  - code: value-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      device_type:
        type: string
        default: cuda
      rank:
        type: integer
        examples:
        - 0
  response:
    type: object
    properties:
      device:
        type: string
      requested_memory:
        type: integer
      runner:
        type: string
  behavior:
  - if: input.device_type != 'cuda'
    then:
    - title: Only CUDA devices are supported by this worker
      source: vllm/v1/worker/gpu_worker.py:542-543
      fail:
        code: runtime-error
        status: 0
        message: '= ''Unsupported device type: '' + input.device_type'
  - title: Initialize the distributed environment before the memory snapshot
    detail: NCCL buffers are allocated here so the snapshot taken next excludes them.
    source: vllm/v1/worker/gpu_worker.py:507-515
    call: parallel-state.init-distributed-environment
    input:
      world_size: = int(config['tensor-parallel-size'])
      rank: = input.rank
      backend: nccl
  - title: 'model_config.is_moe: get_num_experts() > 0 from the checkpoint''s num_experts / moe_num_experts / n_routed_experts
      / num_local_experts, which initialize_model_parallel reads from the current config to build the EP group'
    source: vllm/config/model.py:2276-2277
    call: hf-hub.download-config
    input:
      model: = config['model']
    as: hf
    on_error: continue
  - set:
      vars.is_moe: = vars.hf.ok && ((has(vars.hf.value.num_local_experts) && vars.hf.value.num_local_experts > 0)
        || (has(vars.hf.value.num_experts) && vars.hf.value.num_experts > 0) || (has(vars.hf.value.n_routed_experts)
        && vars.hf.value.n_routed_experts > 0) || (has(vars.hf.value.moe_num_experts) && vars.hf.value.moe_num_experts
        > 0))
  - source: vllm/v1/worker/gpu_worker.py:1673-1678
    call: parallel-state.ensure-model-parallel-initialized
    input:
      tensor_model_parallel_size: = int(config['tensor-parallel-size'])
      pipeline_model_parallel_size: 1
      is_moe: = vars.is_moe
      enable_eplb: = config['enable-eplb']
  - title: Snapshot free memory after NCCL init
    source: vllm/v1/worker/gpu_worker.py:534
    call: gpu-memory.snapshot
    input:
      at_init: true
    as: snap
  - title: Check free memory against ceil(total * gpu_memory_utilization)
    source: vllm/v1/worker/gpu_worker.py:535-537
    call: worker-utils.request-memory
    input:
      total_bytes: = vars.snap.value.total_bytes
      free_bytes: = vars.snap.value.free_bytes
      external_weight_memory: 0
    as: req
  - set:
      state.init_free_memory: = vars.snap.value.free_bytes
      state.requested_memory: = vars.req.value.requested_memory
      state.device_initialized: true
      state.runner: '= config[''use-v2-model-runner''] ? ''v2'' : ''v1'''
      state.pp_rank: '= self == '''' ? 0 : int(self.substring(4)) / int(config[''tensor-parallel-size''])'
      state.is_first_pp_rank: = self == '' || int(self.substring(4)) / int(config['tensor-parallel-size']) == 0
      state.is_last_pp_rank: = self == '' || int(self.substring(4)) / int(config['tensor-parallel-size']) == int(config['pipeline-parallel-size'])
        - 1
  - title: Build the workspace and the model runner (V2 unless use_v2_model_runner is false)
    source: vllm/v1/worker/gpu_worker.py:547-579
    if: config['use-v2-model-runner']
    then:
    - call: gpu-model-runner.init
      input: {}
  - return:
      device: = 'cuda:' + string(input.rank)
      requested_memory: = state.requested_memory
      runner: = state.runner
- component: gpu-worker-impl
  name: load-model
  kind: rpc
  summary: 'collective_rpc load_model: loads weights through the model runner inside the CuMem ''weights'' pool
    (when sleep mode is on), then creates the weight transfer engine if weight_transfer_config is set.'
  sources:
  - vllm/v1/worker/gpu_worker.py:587-610
  latency_ms: 0
  request:
    type: object
    properties:
      load_dummy_weights:
        type: boolean
        default: false
  response:
    type: object
    properties:
      model_memory_usage:
        type: integer
      weight_transfer_engine:
        type: boolean
  behavior:
  - call: gpu-model-runner.load-model
    input:
      load_dummy_weights: = has(input.load_dummy_weights) && input.load_dummy_weights
    as: lm
  - set:
      state.is_pooling_model: = vars.lm.value.is_pooling_model
  - if: config['weight-transfer-backend'] != ''
    then:
    - title: Create the weight transfer engine once the model exists
      source: vllm/v1/worker/gpu_worker.py:597-603
      set:
        state.weight_transfer_engine: true
  - return:
      model_memory_usage: = vars.lm.value.model_memory_usage
      weight_transfer_engine: = state.weight_transfer_engine
- component: gpu-worker-impl
  name: determine-available-memory
  kind: rpc
  summary: 'collective_rpc determine_available_memory: the KV cache budget in bytes. kv_cache_memory_bytes short-circuits
    profiling; otherwise a max_num_batched_tokens dummy forward is profiled and available = requested - (consumed
    since init + transient peak) - CUDA graph estimate.'
  sources:
  - vllm/v1/worker/gpu_worker.py:633-807
  latency_ms: 0
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  request:
    type: object
  response:
    type: integer
    examples:
    - 59745650279
  behavior:
  - title: 'Bytes one KV block takes across all layers (page size * layers), for the block count the engine core
      derives from this budget (synthetic: the Worker returns only the byte budget; the engine core divides it in
      get_kv_cache_configs)'
    source: vllm/v1/core/kv_cache_utils.py:1622-1628
    call: gpu-model-runner.get-kv-cache-spec
    input: {}
    as: spec
  - set:
      state.bytes_per_block: = vars.spec.value.page_size_bytes * vars.spec.value.num_layers
  - if: int(config['kv-cache-memory-bytes']) > 0
    then:
    - title: kv_cache_memory_bytes given, skip memory profiling
      detail: A profile run still compiles the model for max_num_batched_tokens; gpu_memory_utilization is not respected.
      source: vllm/v1/worker/gpu_worker.py:649-673
      call: gpu-model-runner.profile-run
      input: {}
    - set:
        state.available_kv_cache_memory_bytes: = int(config['kv-cache-memory-bytes'])
        state.num_gpu_blocks: = int(config['kv-cache-memory-bytes']) / state.bytes_per_block
    - return: = int(config['kv-cache-memory-bytes'])
  - title: The profiling pass runs with the allocator's max_split_size_mb at 20, so workspace growth cannot pin
      a freed large segment
    source: vllm/v1/worker/gpu_worker.py:681-691
    call: gpu-worker-impl.scoped-allocator-max-split
    input:
      max_split_size_mb: 20
  - title: Profile a dummy forward of max_num_batched_tokens
    source: vllm/v1/worker/gpu_worker.py:677-691
    call: gpu-model-runner.profile-run
    input: {}
    as: prof
  - set:
      vars.cg_estimate: 0
  - if: config['cudagraph-mode'] != 'NONE' && !config['enforce-eager']
    then:
    - title: Estimate CUDA graph memory when graphs will be captured
      source: vllm/v1/worker/gpu_worker.py:700-704
      call: gpu-model-runner.profile-cudagraph-memory
      input: {}
      as: cg
    - set:
        vars.cg_estimate: = vars.cg.value.cudagraph_memory_bytes
  - set:
      vars.cg_applied: '= config[''vllm-memory-profiler-estimate-cudagraphs''] ? vars.cg_estimate : 0'
  - call: gpu-memory.snapshot
    input:
      after_profile: true
    as: after
  - if: state.init_free_memory < vars.after.value.free_bytes
    then:
    - title: Free memory grew during profiling
      detail: Another process sharing the GPU released memory while vLLM profiled (CUDA; ROCm falls back to torch
        reserved instead).
      source: vllm/v1/worker/gpu_worker.py:717-728
      fail:
        code: assertion-error
        status: 0
        message: '= ''Error in memory profiling. Initial free memory '' + string(((state.init_free_memory * 100
          + 536870912) / 1073741824) / 100) + ''.'' + (((state.init_free_memory * 100 + 536870912) / 1073741824)
          % 100 == 0 ? ''0'' : (((state.init_free_memory * 100 + 536870912) / 1073741824) % 10 == 0 ? string((((state.init_free_memory
          * 100 + 536870912) / 1073741824) % 100) / 10) : ((((state.init_free_memory * 100 + 536870912) / 1073741824)
          % 100) < 10 ? ''0'' : '''') + string(((state.init_free_memory * 100 + 536870912) / 1073741824) % 100)))
          + '' GiB, current free memory '' + string(((vars.after.value.free_bytes * 100 + 536870912) / 1073741824)
          / 100) + ''.'' + (((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' :
          (((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) % 10 == 0 ? string((((vars.after.value.free_bytes
          * 100 + 536870912) / 1073741824) % 100) / 10) : ((((vars.after.value.free_bytes * 100 + 536870912) / 1073741824)
          % 100) < 10 ? ''0'' : '''') + string(((vars.after.value.free_bytes * 100 + 536870912) / 1073741824) %
          100))) + '' GiB. This happens when other processes sharing the same container release GPU memory while
          vLLM is profiling during initialization. To fix this, ensure consistent GPU memory allocation or isolate
          vLLM in its own container.'''
  - set:
      state.total_consumed: = state.init_free_memory - vars.after.value.free_bytes
      state.peak_activation_memory: = vars.prof.value.peak_activation_bytes + vars.cg_applied
      state.cudagraph_memory_estimate: = vars.cg_estimate
  - title: available = requested - non_kv_cache_memory - applied CUDA graph estimate
    source: vllm/v1/worker/gpu_worker.py:740-744
    set:
      state.available_kv_cache_memory_bytes: = state.requested_memory - (state.total_consumed + vars.prof.value.peak_activation_bytes)
        - vars.cg_applied
  - title: KV blocks this budget holds (available // bytes_per_block, as get_kv_cache_configs computes)
    source: vllm/v1/core/kv_cache_utils.py:1627
    set:
      state.num_gpu_blocks: '= state.available_kv_cache_memory_bytes > 0 ? state.available_kv_cache_memory_bytes
        / state.bytes_per_block : 0'
  - return: = state.available_kv_cache_memory_bytes
- component: gpu-worker-impl
  name: get-num-gpu-blocks
  kind: function
  summary: 'The KV block count the last determine_available_memory budget holds on this rank: available bytes //
    (page size * layers), the arithmetic of kv_cache_utils.get_kv_cache_configs for uniform full attention (block
    16, Llama-3.1-8B: 2 MiB per block). Exposed so scheduler-kv''s block pool can be seeded with num_gpu_blocks;
    not a Worker method (the engine core computes it from the worker''s answer).'
  sources:
  - vllm/v1/core/kv_cache_utils.py:1622-1628
  - vllm/v1/worker/gpu_worker.py:740-744
  attributes:
    synthetic: true
    consumer: scheduler-kv
  latency_ms: 0
  response:
    type: object
    properties:
      num_gpu_blocks:
        type: integer
        examples:
        - 28488
      bytes_per_block:
        type: integer
        examples:
        - 2097152
      available_kv_cache_memory_bytes:
        type: integer
        examples:
        - 59745650279
  behavior:
  - if: state.num_gpu_blocks == 0
    then:
    - title: Memory not profiled yet on this rank
      fail:
        code: runtime-error
        status: 0
        message: determine_available_memory has not run on this worker
  - return:
      num_gpu_blocks: = state.num_gpu_blocks
      bytes_per_block: = state.bytes_per_block
      available_kv_cache_memory_bytes: = state.available_kv_cache_memory_bytes
- component: gpu-worker-impl
  name: get-kv-cache-spec
  kind: rpc
  summary: 'collective_rpc get_kv_cache_spec: per-layer KV cache specs from the model runner.'
  sources:
  - vllm/v1/worker/gpu_worker.py:837-838
