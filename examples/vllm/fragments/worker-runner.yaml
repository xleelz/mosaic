- component: gpu-model-runner
  name: init
  kind: function
  summary: 'GPUModelRunner.__init__: sizes the persistent batch to max_num_seqs request slots, the input buffers
    to max_num_batched_tokens, and builds the speculator when speculative decoding is configured.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:194-361
  latency_ms: 0
  request:
    type: object
  response:
    type: object
    properties:
      max_num_reqs:
        type: integer
      speculator:
        type: string
  behavior:
  - set:
      state.slots: {}
      state.free_slots: []
      state.fresh_slots_used: 0
      state.execute_model_state: null
      state.draft_tokens: {}
      state.model_loaded: false
      state.kv_cache_initialized: false
      state.speculator: ''
  - title: PP role of this rank (global rank = pp_rank * tp + tp_rank); non-last ranks pre-seed the PP handler's
      ring with pp_size empty slots
    source: vllm/v1/worker/gpu/pp_utils.py:65-90
    set:
      state.pp_rank: '= self == '''' ? 0 : int(self.substring(4)) / int(config[''tensor-parallel-size''])'
  - set:
      state.is_first_pp_rank: = state.pp_rank == 0
      state.is_last_pp_rank: = state.pp_rank == int(config['pipeline-parallel-size']) - 1
  - if: int(config['pipeline-parallel-size']) > 1
    then:
    - call: pp-handler.init
      input:
        is_last_rank: = state.is_last_pp_rank
        pp_size: = int(config['pipeline-parallel-size'])
  - if: config['speculative-method'] != ''
    then:
    - title: Build the speculator for speculative_config.method
      source: vllm/v1/worker/gpu/model_runner.py:292-300
      call: spec-decode.init-speculator
      input:
        method: = config['speculative-method']
      as: spec
    - set:
        state.speculator: = vars.spec.value.speculator
  - return:
      max_num_reqs: = int(config['max-num-seqs'])
      speculator: = state.speculator
- component: gpu-model-runner
  name: load-model
  kind: function
  summary: 'GPUModelRunner.load_model: loads the model through the configured loader (measuring the memory it consumed),
    wraps LoRA, builds the model state, the custom logits processors and the sampler (watermark sampler when configured),
    the rejection sampler when speculating, and the pooling runner for pooling models.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:378-547
  latency_ms: 0
  request:
    type: object
    properties:
      load_dummy_weights:
        type: boolean
        default: false
  response:
    type: object
    properties:
      model_memory_usage:
        type: integer
      is_pooling_model:
        type: boolean
      sampler:
        type: string
  behavior:
  - title: Load the model inside DeviceMemoryProfiler
    source: vllm/v1/worker/gpu/model_runner.py:390-399
    call: base-model-loader.load-model
    input:
      loader: default-model-loader
      model: '= has(state.model.name) ? state.model.name : ''meta-llama/Llama-3.1-8B-Instruct'''
      hf_config:
        architectures:
        - = state.model.architecture
        num_hidden_layers: = state.model.num_hidden_layers
        num_attention_heads: = state.model.num_attention_heads
        num_key_value_heads: = state.model.num_kv_heads
        hidden_size: = state.model.hidden_size
        vocab_size: = state.model.vocab_size
        max_position_embeddings: = state.model.max_position_embeddings
        torch_dtype: = state.model.torch_dtype
        weights_bytes: = state.model.weights_bytes
    as: ld
  - title: 'self.model is the module the loader built: forward, compute_logits and the multimodal encoder go to
      it from now on'
    source: vllm/v1/worker/gpu/model_runner.py:390-399
    set:
      state.model_component: '= vars.ld.ok && has(vars.ld.value.component) ? vars.ld.value.component : '''''
  - call: gpu-memory.snapshot
    as: m
  - set:
      state.model_memory_usage: = vars.m.value.weights_bytes
  - title: EPLB registers the MoE model and starts its async loop (no-op unless enable_eplb)
    source: vllm/v1/worker/gpu/model_runner.py:528-531
    call: eplb-controller.load
    input:
      load_dummy_weights: = has(input.load_dummy_weights) && input.load_dummy_weights
      is_moe: '= has(state.model.is_moe) ? state.model.is_moe : (state.model.architecture.contains(''Mixtral'')
        || state.model.architecture.contains(''Moe'') || state.model.architecture.contains(''DeepseekV''))'
      model: '= has(state.model.name) ? state.model.name : ''meta-llama/Llama-3.1-8B-Instruct'''
  - title: Build the custom logits processors (plugins first, then logits_processors)
    source: vllm/v1/worker/gpu/model_runner.py:457-459
    call: logits-processor-loader.build-custom-logits-processors
    input:
      is_pooling_model: = state.is_pooling_model
      max_num_reqs: = int(config['max-num-seqs'])
      custom: = config['logits-processors']
  - set:
      vars.sampler: '= state.is_pooling_model ? ''none'' : (config[''watermark-enabled''] ? ''GPUWatermarkSampler''
        : ''Sampler'')'
      state.model_loaded: true
  - return:
      model_memory_usage: = state.model_memory_usage
      is_pooling_model: = state.is_pooling_model
      sampler: = vars.sampler
- component: gpu-model-runner
  name: get-model
  kind: function
  summary: Returns the loaded model (its architecture and shape here).
  sources:
  - vllm/v1/worker/gpu/model_runner.py:559-560
  latency_ms: 0
  response:
    type: object
    properties:
      architecture:
        type: string
      num_hidden_layers:
        type: integer
  behavior:
  - if: '!state.model_loaded'
    then:
    - fail:
        code: attribute-error
        status: 0
        message: '''GPUModelRunner'' object has no attribute ''model'''
  - return: = state.model
- component: gpu-model-runner
  name: get-kv-cache-spec
  kind: function
  summary: KV cache spec per attention layer (a draft at DCP=1 under a DCP target keeps a replicated cache).
  sources:
  - vllm/v1/worker/gpu/model_runner.py:593-603
  latency_ms: 0
  response:
    type: object
    properties:
      num_layers:
        type: integer
      block_size:
        type: integer
      page_size_bytes:
        type: integer
      cache_dtype_str:
        type: string
      kv_quant_mode:
        type: string
  behavior:
  - call: attn-utils.get-kv-cache-spec
    input:
      num_hidden_layers: = state.model.num_hidden_layers
      num_kv_heads: = state.model.num_kv_heads
      head_size: = state.model.head_size
      dtype_bytes: = state.model.dtype_bytes
      use_mla: = has(state.model.use_mla) && state.model.use_mla
      kv_cache_dtype: = config['kv-cache-dtype']
    as: spec
  - return: = vars.spec.value
- component: gpu-model-runner
  name: update-max-model-len
  kind: function
  summary: Adopts a new max_model_len (sizes block tables at KV init).
  sources:
  - vllm/v1/worker/gpu/model_runner.py:363-365
  latency_ms: 0
  request:
    type: object
    properties:
      max_model_len:
        type: integer
  behavior:
  - source: vllm/v1/worker/gpu/model_runner.py:363-365
    set:
      state.max_model_len: = input.max_model_len
- component: gpu-model-runner
  name: profile-run
  kind: function
  summary: 'profile_run: an eager dummy forward of max_num_batched_tokens tokens (attention skipped) plus a dummy
    sampler run, the peak the KV budget is sized against.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:991-1021
  latency_ms: 0
  response:
    type: object
    properties:
      peak_activation_bytes:
        type: integer
      num_tokens:
        type: integer
  behavior:
  - call: gpu-model-runner.dummy-run
    input:
      num_tokens: = int(config['max-num-batched-tokens'])
      is_profile: true
      uniform_decode: false
  - title: Measure the transient peak of the dummy forward and sampler run
    source: vllm/v1/worker/gpu/model_runner.py:1003-1015
    call: gpu-memory.profile-peak
    input:
      num_tokens: = int(config['max-num-batched-tokens'])
    as: peak
  - return:
      peak_activation_bytes: = vars.peak.value.peak_activation_bytes
      num_tokens: = int(config['max-num-batched-tokens'])
- component: gpu-model-runner
  name: profile-cudagraph-memory
  kind: function
  summary: 'profile_cudagraph_memory: captures a few graphs against a minimal KV cache, extrapolates to all capture
    sizes, and tears the state down.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1038-1040
  - vllm/v1/worker/gpu/cudagraph_utils.py:873-977
  latency_ms: 0
  response:
    type: object
    properties:
      cudagraph_memory_bytes:
        type: integer
  behavior:
  - if: config['enforce-eager'] || config['cudagraph-mode'] == 'NONE'
    then:
    - title: 'cudagraph_mode NONE: nothing will be captured, so 0, before any KV bootstrap or teardown'
      source: vllm/v1/worker/gpu/cudagraph_utils.py:889-890
      return:
        cudagraph_memory_bytes: 0
  - title: 'Bootstrap the smallest KV cache every graph can be captured against: min(max_num_reqs, max_cudagraph_capture_size)
      blocks'
    source: vllm/v1/worker/gpu/cudagraph_utils.py:990-1014
    call: gpu-model-runner.initialize-kv-cache
    input:
      num_blocks: '= int(config[''max-cudagraph-capture-size'']) > 0 && int(config[''max-cudagraph-capture-size''])
        < int(config[''max-num-seqs'']) ? int(config[''max-cudagraph-capture-size'']) : (int(config[''max-num-seqs''])
        < 512 ? int(config[''max-num-seqs'']) : 512)'
      is_profiling: true
  - call: cuda-graph-manager.needs-capture
    input: {}
    as: need
  - if: '!vars.need.value.needs_capture'
    then:
    - title: 'Nothing to capture after resolution: tear the profiling state down (finally) and return 0'
      source: vllm/v1/worker/gpu/cudagraph_utils.py:919-920
      call: gpu-model-runner.teardown-profiling-state
      input: {}
    - return:
        cudagraph_memory_bytes: 0
  - title: capture_model(profile_only=True) into a throwaway pool, FULL graphs sampled at the 2 largest
    source: vllm/v1/worker/gpu/cudagraph_utils.py:942-948
    call: gpu-model-runner.capture-model
    input:
      profile_only: true
      max_full_descs_to_capture: 2
    as: cap
  - title: Release the profiling KV cache and graphs (finally), keeping the weights
    source: vllm/v1/worker/gpu/cudagraph_utils.py:957-971
    call: gpu-model-runner.teardown-profiling-state
    input: {}
  - title: measured - sampled FULL cost + extrapolated FULL total (the pool size is a labeled assumption for the
      8B model)
    source: vllm/v1/worker/gpu/cudagraph_utils.py:950-956
    return:
      cudagraph_memory_bytes: = vars.cap.value.cuda_graph_memory_bytes
- component: gpu-model-runner
  name: teardown-profiling-state
  kind: function
  summary: '_teardown_profiling_state: releases the profiling KV cache and captured graphs while keeping the weights,
    so the real initialize_kv_cache starts clean (the CUDA graph manager is dropped, num_gpu_blocks reset).'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:1017-1053
  latency_ms: 0
  behavior:
  - call: gpu-memory.free
    input:
      kind: kv_cache
  - call: gpu-memory.free
    input:
      kind: cudagraph
  - call: cuda-graph-manager.release
    input: {}
  - set:
      state.kv_cache_initialized: false
      state.num_blocks: 0
- component: gpu-model-runner
  name: dummy-run
  kind: function
  summary: '_dummy_run: a forward on padding tokens (profiling, warmup, capture, DP idle steps); dispatches like
    a real batch unless is_profile forces eager.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:818-970
  latency_ms: 0
  request:
    type: object
    properties:
      num_tokens:
        type: integer
        examples:
        - 1
      uniform_decode:
        type: boolean
      is_profile:
        type: boolean
  response:
    type: object
    properties:
      num_tokens:
        type: integer
      cg_mode:
        type: string
  behavior:
  - call: cuda-graph-manager.dispatch
    input:
      num_reqs: '= input.uniform_decode ? input.num_tokens : 1'
      num_tokens: = input.num_tokens
      uniform_token_count: '= input.uniform_decode ? 1 : 0'
      need_eager: = has(input.is_profile) && input.is_profile
    as: desc
  - title: 'The loaded model''s forward (the architecture load_model built: LlamaForCausalLM, MixtralForCausalLM)'
    source: vllm/v1/worker/gpu/model_runner.py:899-901
    call: '= (has(state.model_component) && state.model_component != '''' ? state.model_component : (has(state.model.architecture)
      && state.model.architecture.startsWith(''Mixtral'') ? ''mixtral-for-causal-lm'' : (has(state.model.architecture)
      && state.model.architecture.startsWith(''Qwen2VL'') ? ''qwen2-vl-for-conditional-generation'' : ''llama-for-causal-lm'')))
      + ''.forward'''
    targets:
    - llama-for-causal-lm.forward
    - mixtral-for-causal-lm.forward
    - qwen2-vl-for-conditional-generation.forward
    input:
      num_tokens: = vars.desc.value.num_tokens
      num_prefill_tokens: '= input.uniform_decode ? 0 : input.num_tokens'
      num_decode_reqs: '= input.uniform_decode ? input.num_tokens : 0'
  - return:
      num_tokens: = vars.desc.value.num_tokens
      cg_mode: = vars.desc.value.cg_mode
- component: gpu-model-runner
  name: initialize-kv-cache
  kind: function
  summary: 'initialize_kv_cache: block tables sized by max_model_len, attention backends and metadata builders,
    the CUDA graph mode and sizes, the speculator''s graphs, then the KV cache tensors and the KV connector.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:605-804
  latency_ms: 0
  request:
    type: object
    required:
    - num_blocks
    properties:
      num_blocks:
        type: integer
        examples:
        - 29065
      allocation_pool:
        type:
        - string
        - 'null'
        default: null
        description: the CuMem pool tag the KV tensors are allocated in (kv_cache under sleep mode), or None
      is_profiling:
        type: boolean
        default: false
        description: the minimal KV cache profile_cudagraph_memory bootstraps (no KV connector)
  response:
    type: object
    properties:
      kv_cache_bytes:
        type: integer
      cudagraph_mode:
        type: string
  behavior:
  - call: attn-utils.get-kv-cache-spec
    input:
      num_hidden_layers: = state.model.num_hidden_layers
      num_kv_heads: = state.model.num_kv_heads
      head_size: = state.model.head_size
      dtype_bytes: = state.model.dtype_bytes
      kv_cache_dtype: = config['kv-cache-dtype']
    as: spec
  - title: 'The attention groups'' metadata builders report their CUDA graph support (FlashAttention: ALWAYS with
      FA3, UNIFORM_BATCH with FA2)'
    source: vllm/v1/worker/gpu/model_runner.py:672-690
    call: attention-metadata-builder.get-cudagraph-support
    input:
      backend: '= ''attention-backend'' in config && config[''attention-backend''] != null && config[''attention-backend'']
        != '''' ? config[''attention-backend''] : ''FLASH_ATTN'''
      fa_version: '= ''flash-attn-version'' in config && config[''flash-attn-version''] != null ? int(config[''flash-attn-version''])
        : 3'
    as: bsup
  - title: The weakest support among the attention groups
    source: vllm/v1/worker/gpu/model_runner.py:672-690
    call: attn-utils.get-attn-cg-support
    input:
      attn_groups: '= [[{''backend'': ''attention-backend'' in config && config[''attention-backend''] != null &&
        config[''attention-backend''] != '''' ? config[''attention-backend''] : ''FLASH_ATTN'', ''layer_names'':
        [''model.layers''], ''cg_support'': vars.bsup.value.support}]]'
    as: cgs
  - title: Resolve the CUDA graph mode against that support (resolve_cudagraph_mode_and_sizes)
    source: vllm/v1/worker/gpu/model_runner.py:735-744
    call: cuda-graph-manager.resolve-cudagraph-mode
    input:
      min_cg_support: = vars.cgs.value.min_cg_support
      min_cg_attn_backend: = vars.cgs.value.min_cg_attn_backend
      uniform_decode_query_len: = 1 + int(config['num-speculative-tokens'])
    as: mode
  - title: Build the CUDA graph manager with the resolved mode and capture sizes
    source: vllm/v1/worker/gpu/model_runner.py:745-753
    call: cuda-graph-manager.init
    input:
      decode_query_len: = 1 + int(config['num-speculative-tokens'])
      cudagraph_mode: = vars.mode.value.cudagraph_mode
    as: cg
  - title: Allocate the KV cache tensors
    source: vllm/v1/worker/gpu/model_runner.py:773-787
    call: attn-utils.init-kv-cache
    input:
      num_blocks: = input.num_blocks
      page_size_bytes: = vars.spec.value.page_size_bytes
      num_layers: = vars.spec.value.num_layers
      allocation_pool: '= has(input.allocation_pool) ? input.allocation_pool : null'
    as: kv
  - set:
      state.kv_cache_initialized: true
      state.num_blocks: = input.num_blocks
  - return:
      kv_cache_bytes: = vars.kv.value.kv_cache_bytes
      cudagraph_mode: = vars.cg.value.cudagraph_mode
- component: gpu-model-runner
  name: capture-model
  kind: function
  summary: 'capture_model: captures decoder (and encoder) CUDA graphs and the speculator''s, then locks the workspace;
    returns the graph pool size. With cudagraph_mode NONE it warns and captures nothing.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1053-1132
  latency_ms: 0
  request:
    type: object
    properties:
      profile_only:
        type: boolean
        default: false
      max_full_descs_to_capture:
        type:
        - integer
        - 'null'
        default: null
        description: 'profiling only: capture this many of the largest FULL graphs'
  response:
    type: object
    properties:
      cuda_graph_memory_bytes:
        type: integer
  behavior:
  - call: cuda-graph-manager.capture
    input:
      max_full_descs_to_capture: '= has(input.max_full_descs_to_capture) ? input.max_full_descs_to_capture : null'
    as: cap
  - if: '!vars.cap.value.captured'
    then:
    - title: Skipping CUDA graph capture
      source: vllm/v1/worker/gpu/model_runner.py:1060-1066
      return:
        cuda_graph_memory_bytes: 0
  - return:
      cuda_graph_memory_bytes: = vars.cap.value.bytes
- component: gpu-model-runner
  name: reload-weights
  kind: function
  summary: 'reload_weights: reloads checkpoint weights in place (then resets LoRA state).'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:568-583
  latency_ms: 0
  behavior:
  - if: '!state.model_loaded'
    then:
    - fail:
        code: attribute-error
        status: 0
        message: '''GPUModelRunner'' object has no attribute ''model'''
  - call: base-model-loader.load-model
    input:
      loader: default-model-loader
      model: '= has(state.model.name) ? state.model.name : ''meta-llama/Llama-3.1-8B-Instruct'''
      hf_config:
        architectures:
        - = state.model.architecture
        num_hidden_layers: = state.model.num_hidden_layers
        num_attention_heads: = state.model.num_attention_heads
        num_key_value_heads: = state.model.num_kv_heads
        hidden_size: = state.model.hidden_size
        vocab_size: = state.model.vocab_size
        max_position_embeddings: = state.model.max_position_embeddings
        torch_dtype: = state.model.torch_dtype
        weights_bytes: = state.model.weights_bytes
- component: gpu-model-runner
  name: get-supported-tasks
  kind: function
  summary: 'get_supported_tasks: the generation tasks when runner_type is generate, plus the pooler''s tasks for
    pooling models (--runner pooling converts a *ForCausalLM with --convert auto -> embed).'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:367-376
  - vllm/model_executor/layers/pooler/special.py:29-56
  - vllm/v1/worker/gpu_model_runner.py:3151-3156
  latency_ms: 0
  response:
    type: object
    properties:
      tasks:
        type: array
  behavior:
  - set:
      vars.runner_type: '= (''runner'' in config) && config[''runner''] == ''pooling'' ? ''pooling'' : (state.is_pooling_model
        ? ''pooling'' : ''generate'')'
      vars.convert: '= (''convert'' in config) && config[''convert''] != ''auto'' ? config[''convert''] : ''embed'''
  - set:
      vars.tasks: '= vars.runner_type == ''generate'' ? [''generate''] : []'
  - if: vars.runner_type == 'pooling'
    then:
    - title: 'The model''s pooler decides its tasks: a pooler the model declares (an IdentityPooler such as Terratorch''s
        supports only plugin), else the converted pooler (as_embedding_model: embed and token_embed; as_seq_cls_model:
        classify and token_classify)'
      source: vllm/model_executor/layers/pooler/special.py:153-155
      set:
        vars.pooler: '= has(state.model.pooler_tasks) ? state.model.pooler_tasks : (has(state.model.architecture)
          && state.model.architecture.startsWith(''Terratorch'') ? [''plugin''] : (vars.convert == ''classify''
          ? [''classify'', ''token_classify''] : [''embed'', ''token_embed'']))'
    - if: config['use-v2-model-runner']
      then:
      - title: 'V2: the pooler''s tasks intersected with the runner''s supported set (embed, classify, token_embed,
          token_classify, embed&token_classify), sorted'
        source: vllm/v1/worker/gpu/pool/pooling_runner.py:61-64
        set:
          vars.tasks: = vars.tasks + vars.pooler.filter(t, t in ['embed', 'classify', 'token_embed', 'token_classify',
            'embed&token_classify']).sort()
      else:
      - title: 'V1: every task the pooler supports'
        source: vllm/v1/worker/gpu_model_runner.py:3151-3156
        set:
          vars.tasks: = vars.tasks + vars.pooler
  - return:
      tasks: = vars.tasks
