  name: allocate-kv-cache
  kind: function
  summary: 'allocate_kv_cache: one zeroed int8 backing allocation for every KVCacheTensor (they must share one size:
    cache groups overlay each other), viewed as [B, H, N, C] per layer; a spec without layer views (e.g. HiSparse)
    gets the raw buffer; no tensors, no allocation.'
