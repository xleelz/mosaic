  latency_ms: 0
  behavior:
  - title: 'GumbelWatermarker (create_watermarker): the sampling score is keyed by a Philox PRF of the preceding
      context_width tokens'
    source: vllm/v1/watermarking/gumbel.py:42-104
  - title: Philox PRF that keys the watermark
    source: vllm/v1/watermarking/prfs/philox.py:58-130
