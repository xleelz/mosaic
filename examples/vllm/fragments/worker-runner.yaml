- component: gpu-worker-impl
  name: update-max-model-len
  kind: rpc
  summary: 'collective_rpc update_max_model_len: adopts the engine''s auto-fitted max_model_len (max_model_len=-1).'
  sources:
  - vllm/v1/worker/gpu_worker.py:840-850
  latency_ms: 0
  request:
    type: object
    required:
    - max_model_len
    properties:
      max_model_len:
        type: integer
        examples:
        - 65536
  response:
    type: object
    properties:
      max_model_len:
        type: integer
  behavior:
  - call: gpu-model-runner.update-max-model-len
    input:
      max_model_len: = input.max_model_len
  - return:
      max_model_len: = input.max_model_len
- component: gpu-worker-impl
  name: initialize-from-config
  kind: rpc
  summary: 'collective_rpc initialize_from_config: records num_gpu_blocks, adopts layout and hash granularity, initializes
    the KV transfer connector, then allocates the KV cache through the model runner (CuMem ''kv_cache'' pool under
    sleep mode).'
  sources:
  - vllm/v1/worker/gpu_worker.py:852-905
  latency_ms: 0
  request:
    type: object
    properties:
      num_blocks:
        type: integer
        examples:
        - 28488
      needs_kv_cache_zeroing:
        type: boolean
        default: false
  response:
    type: object
    properties:
      num_blocks:
        type: integer
      kv_cache_bytes:
        type: integer
  behavior:
  - set:
      vars.n: '= has(input.num_blocks) && input.num_blocks != null ? input.num_blocks : (has(input.num_gpu_blocks)
        ? input.num_gpu_blocks : state.num_gpu_blocks)'
  - title: Record the engine's block count for warmup
    source: vllm/v1/worker/gpu_worker.py:857
    set:
      state.num_gpu_blocks: = vars.n
  - title: KV tensors are allocated in the CuMem 'kv_cache' pool under sleep mode (no KV connector pool here)
    source: vllm/v1/worker/gpu_worker.py:879-897
    call: gpu-model-runner.initialize-kv-cache
    input:
      num_blocks: = vars.n
      allocation_pool: '= config[''enable-sleep-mode''] ? dyn(''kv_cache'') : dyn(null)'
    as: kv
  - set:
      vars.zero: = has(input.needs_kv_cache_zeroing) && input.needs_kv_cache_zeroing
  - if: vars.zero
    then:
    - title: Build KV-zero metadata outside the CuMem pool
      source: vllm/v1/worker/gpu_worker.py:900-905
      call: kv-block-zeroer.init
      input:
        num_blocks: = vars.n
  - return:
      num_blocks: = vars.n
      kv_cache_bytes: = vars.kv.value.kv_cache_bytes
- component: gpu-worker-impl
  name: compile-or-warm-up-model
  kind: rpc
  summary: 'collective_rpc compile_or_warm_up_model: warms up compile sizes, tunes kernels, captures CUDA graphs
    unless enforce_eager, logs the suggested --kv-cache-memory, (V1) warms the sampler, reseeds, freezes the GC
    heap.'
  sources:
  - vllm/v1/worker/gpu_worker.py:907-1092
  latency_ms: 0
  response:
    type: object
    properties:
      cuda_graph_memory_bytes:
        type: integer
      suggested_kv_cache_memory_bytes:
        type: integer
  behavior:
  - title: Dummy runs for compile sizes outside the capture sizes, then kernel warmup
    source: vllm/v1/worker/gpu_worker.py:937-951
    call: gpu-model-runner.dummy-run
    input:
      num_tokens: = int(config['max-num-batched-tokens'])
      uniform_decode: false
  - title: 'V2 with JIT warmup: scheduler-realistic prefill and decode steps through the worker''s execute_model
      and sample_tokens compile the kernels before capture'
    source: vllm/v1/worker/gpu/warmup.py:218-247
    when: config['use-v2-model-runner'] && !config['enforce-eager']
    set:
      ctx.jit_warmup: true
  - set:
      vars.cg_bytes: 0
  - if: '!config[''enforce-eager'']'
    then:
    - title: Capture CUDA graphs
      source: vllm/v1/worker/gpu_worker.py:961-963
      call: gpu-model-runner.capture-model
      input: {}
      as: cap
    - set:
        vars.cg_bytes: = vars.cap.value.cuda_graph_memory_bytes
  - set:
      vars.suggested: 0
  - if: int(config['kv-cache-memory-bytes']) == 0
    then:
    - title: Suggest --kv-cache-memory from the measured usage (150 MiB redundancy)
      source: vllm/v1/worker/gpu_worker.py:980-1043
      set:
        vars.suggested: = state.requested_memory - (state.total_consumed + state.peak_activation_memory + vars.cg_bytes)
          - 157286400
    - set:
        state.suggested_kv_cache_memory_bytes: = vars.suggested
  - if: '!config[''use-v2-model-runner'']'
    then:
    - title: V1 warms the sampler with a max_num_reqs dummy batch after capture
      source: vllm/v1/worker/gpu_worker.py:1045-1063
      call: gpu-model-runner-v1.dummy-sampler-run
      input:
        num_tokens: '= int(config[''max-num-seqs'']) < int(config[''max-num-batched-tokens'']) ? int(config[''max-num-seqs''])
          : int(config[''max-num-batched-tokens''])'
  - return:
      cuda_graph_memory_bytes: = vars.cg_bytes
      suggested_kv_cache_memory_bytes: = vars.suggested
- component: gpu-worker-impl
  name: execute-model
  kind: rpc
  summary: 'collective_rpc execute_model (the engine-core -> worker seam): waits for the previous step''s PP sends,
    receives PP intermediate tensors on non-first ranks, runs the model runner''s forward. The V2 runner returns
    None for generation (sample_tokens follows) or a ModelRunnerOutput when no forward ran; pooling models pool
    immediately.'
  sources:
  - vllm/v1/worker/gpu_worker.py:1300-1360
  - vllm/v1/worker/worker_base.py:363-368
  latency_ms: 0
  request:
    allOf:
    - $ref: SchedulerOutput
    - type: object
      properties:
        scheduled_spec_decode_tokens:
          type: object
          description: req_id -> draft token ids (-1 placeholders under async scheduling)
        new_block_ids_to_zero:
          type: array
          items:
            type: integer
        preempted_req_ids:
          type: array
          items:
            type: string
        kv_connector_metadata:
          type:
          - object
          - 'null'
          default: null
          description: SchedulerOutput.kv_connector_metadata (with a KV transfer connector)
        scheduled_encoder_inputs:
          type: object
          default: {}
          description: 'SchedulerOutput.scheduled_encoder_inputs: req_id -> indices of its mm_features to encode
            this step'
        free_encoder_mm_hashes:
          type: array
          default: []
          items:
            type: string
          description: SchedulerOutput.free_encoder_mm_hashes
  response:
    anyOf:
    - $ref: ModelRunnerOutput
    - type: 'null'
  behavior:
  - if: state.profiler_created
    then:
    - title: 'annotate_profile: the profiler steps once per execute_model (delayed start, max iterations)'
      source: vllm/v1/worker/gpu_worker.py:1180-1187
      call: worker-profiler.step
      input: {}
  - title: Apply the multimodal receiver cache to new requests (WorkerWrapperBase)
    source: vllm/v1/worker/worker_base.py:355-363
    when: size(input.scheduled_new_reqs) > 0 && input.scheduled_new_reqs.exists(r, has(r.mm_features) && size(r.mm_features)
      > 0)
    set:
      ctx.mm_cache_applied: true
  - if: state.runner == 'v1'
    then:
    - call: gpu-model-runner-v1.execute-model
      input: = input
      as: v1
    - return: = vars.v1.value
  - if: has(state.pp_send_pending) && state.pp_send_pending
    then:
    - title: Wait for the previous step's PP sends before overwriting their buffers
      source: vllm/v1/worker/gpu_worker.py:1304-1309
      set:
        state.pp_send_pending: false
  - if: input.total_num_scheduled_tokens > 0 && has(state.is_first_pp_rank) && !state.is_first_pp_rank
    then:
    - title: A non-first PP rank receives the previous stage's intermediate tensors from its counterpart (same TP
        rank) in that stage; the hand-off is keyed by (stage, TP rank), TP rank 0 keeping the bare stage key
      source: vllm/v1/worker/gpu_worker.py:1311-1324
      receive: '= ''pp-hidden:'' + string(state.pp_rank) + ((self == '''' || int(self.substring(4)) % int(config[''tensor-parallel-size''])
        == 0) ? '''' : '':tp'' + string(int(self.substring(4)) % int(config[''tensor-parallel-size''])))'
      as: hidden
      timeout_ms: 600000
  - call: gpu-model-runner.execute-model
    input: = input
    as: out
  - if: vars.out.value != null && has(vars.out.value.intermediate_tensors)
    then:
    - title: A non-last PP rank sends its intermediate tensors to the same TP rank of the next stage (non-blocking)
      source: vllm/v1/worker/gpu_worker.py:1338-1351
      put: '= ''pp-hidden:'' + string(state.pp_rank + 1) + ((self == '''' || int(self.substring(4)) % int(config[''tensor-parallel-size''])
        == 0) ? '''' : '':tp'' + string(int(self.substring(4)) % int(config[''tensor-parallel-size''])))'
      value: = vars.out.value.intermediate_tensors
    - set:
        state.pp_send_pending: true
    - if: state.is_pooling_model
      then:
      - call: gpu-model-runner.pool
        input: {}
        as: ppool
      - return: = vars.ppool.value
    - return: null
  - if: vars.out.value == null && state.is_pooling_model
    then:
    - title: Pooling models pool right after the forward (V2)
      source: vllm/v1/worker/gpu_worker.py:1330-1336
      call: gpu-model-runner.pool
      input: {}
      as: pooled
    - return: = vars.pooled.value
  - return: = vars.out.value
- component: gpu-worker-impl
  name: sample-tokens
  kind: rpc
  summary: 'collective_rpc sample_tokens: called right after execute_model returned None, with the scheduler''s
    grammar output; returns the step''s ModelRunnerOutput.'
  sources:
