- component: encoder-cudagraph-manager
  name: execute
  kind: function
  summary: 'execute (_execute_local, one path): items sorted by output tokens are packed greedily; an item closes
    the current batch when the batch is full, it would overflow the largest budget, or merging would cost more budget
    than running it alone (and it alone outweighs the batch). Each batch replays the smallest fitting budget graph
    (a hit per item) or, fitting none, runs eager (a miss per item). Outputs come back in the original order.'
  sources:
  - vllm/v1/worker/encoder_cudagraph.py:459-566
  - vllm/v1/worker/encoder_cudagraph.py:403-457
  - vllm/utils/math_utils.py:37-40
  latency_ms: 0
  request:
    type: object
    required:
    - items
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            grid_thw:
              type: array
              items:
                type: integer
            output_tokens:
              type: integer
      spatial_merge_size:
        type: integer
        default: 2
  response:
    type: object
    properties:
      output_tokens:
        type: array
      batches:
        type: array
      graph_hits:
        type: integer
      graph_misses:
        type: integer
  behavior:
  - set:
      vars.m: '= has(input.spatial_merge_size) ? input.spatial_merge_size : 2'
  - title: 'Each item''s output tokens: t * (h / merge) * (w / merge) for an image grid'
    source: vllm/v1/worker/encoder_cudagraph.py:391-394
    set:
      vars.tok: '= input.items.map(it, has(it.output_tokens) ? it.output_tokens : it.grid_thw[0] * (it.grid_thw[1]
        / vars.m) * (it.grid_thw[2] / vars.m))'
      vars.maxb: = state.token_budgets[size(state.token_budgets) - 1]
  - set:
      vars.order: = lists.range(size(vars.tok)).sortBy(i, vars.tok[i])
      vars.batches: []
      vars.cur: []
      vars.cur_tok: 0
  - title: Greedy packing, smallest item first
    source: vllm/v1/worker/encoder_cudagraph.py:479-526
    foreach: = vars.order
    as: i
    steps:
    - set:
        vars.t: = vars.tok[vars.i]
        vars.fits: = size(vars.cur) < state.max_batch_size && vars.cur_tok + vars.tok[vars.i] <= vars.maxb
    - set:
        vars.b_cur: '= vars.cur_tok == 0 ? 0 : state.token_budgets.filter(b, b >= vars.cur_tok)[0]'
        vars.b_alone: '= state.token_budgets.exists(b, b >= vars.t) ? state.token_budgets.filter(b, b >= vars.t)[0]
          : 0'
        vars.b_merged: '= state.token_budgets.exists(b, b >= vars.cur_tok + vars.t) ? state.token_budgets.filter(b,
          b >= vars.cur_tok + vars.t)[0] : 0'
    - if: size(vars.cur) > 0 && (!vars.fits || (vars.t > 0 && vars.b_cur + vars.b_alone < vars.b_merged && vars.b_alone
        >= vars.b_cur))
      then:
      - set:
          vars.batches: '= vars.batches + [{''items'': vars.cur, ''tokens'': vars.cur_tok}]'
          vars.cur: []
          vars.cur_tok: 0
    - set:
        vars.cur: = vars.cur + [vars.i]
        vars.cur_tok: = vars.cur_tok + vars.t
  - when: size(vars.cur) > 0
    set:
      vars.batches: '= vars.batches + [{''items'': vars.cur, ''tokens'': vars.cur_tok}]'
  - title: Each batch replays the smallest captured budget >= its tokens (graph_hits += items) or runs the encoder
      eagerly (graph_misses += items)
    source: vllm/v1/worker/encoder_cudagraph.py:528-556
    set:
      vars.plan: '= vars.batches.map(b, {''items'': b.items, ''tokens'': b.tokens, ''budget'': state.budget_graphs.exists(g,
        g >= b.tokens) ? state.budget_graphs.filter(g, g >= b.tokens).sortBy(g, g)[0] : null})'
  - set:
      state.graph_hits: = state.graph_hits + sum(vars.plan.filter(b, b.budget != null).map(b, size(b.items)))
      state.graph_misses: = state.graph_misses + sum(vars.plan.filter(b, b.budget == null).map(b, size(b.items)))
  - return:
      output_tokens: = vars.tok
      batches: = vars.plan
      graph_hits: = state.graph_hits
      graph_misses: = state.graph_misses
