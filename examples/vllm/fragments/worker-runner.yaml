flows:
- id: wr-init-device
  name: Worker init_device (budget check, distributed init, model runner)
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:435-545
  entry:
    caller: engine-core
    interface: gpu-worker-impl.init-device
    input:
      device_type: cuda
      rank: 0
- id: wr-load-model
  name: Worker load_model
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:587-610
  entry:
    caller: engine-core
    interface: gpu-worker-impl.load-model
    input:
      load_dummy_weights: false
- id: wr-determine-available-memory
  name: KV cache sizing at startup (memory profiling under gpu_memory_utilization)
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:633-807
  entry:
    caller: engine-core
    interface: gpu-worker-impl.determine-available-memory
    input: {}
- id: wr-initialize-kv-cache
  name: Worker initialize_from_config (allocate the KV cache)
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:852-905
  entry:
    caller: engine-core
    interface: gpu-worker-impl.initialize-from-config
    input:
      num_blocks: 28488
- id: wr-compile-or-warm-up
  name: Worker compile_or_warm_up_model (CUDA graph capture)
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:907-1092
  entry:
    caller: engine-core
    interface: gpu-worker-impl.compile-or-warm-up-model
    input: {}
- id: wr-execute-model
  name: Worker execute_model (the engine-core -> worker step seam)
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:1300-1360
  entry:
    caller: engine-core
    interface: gpu-worker-impl.execute-model
    input:
      scheduled_new_reqs: []
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens: {}
      total_num_scheduled_tokens: 0
      finished_req_ids: []
- id: wr-sample-tokens
  name: Worker sample_tokens
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:1293-1298
  entry:
    caller: engine-core
    interface: gpu-worker-impl.sample-tokens
    input:
      grammar_output: null
- id: wr-sleep
  name: Sleep mode (sleep, wake_up, discard)
  tags:
  - writes
  - feature:sleep-mode
  sources:
  - vllm/v1/worker/gpu_worker.py:294-359
  entry:
    caller: engine-core
    interface: gpu-worker-impl.sleep
    input:
      level: 1
- id: wr-weight-update
  name: RL weight sync session (start, update, finish)
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:1477-1604
  entry:
    caller: engine-core
    interface: gpu-worker-impl.start-weight-update
    input: {}
- id: wr-lora
  name: LoRA adapter management
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:1439-1449
  entry:
    caller: engine-core
    interface: gpu-worker-impl.add-lora
    input:
      lora_name: sql-lora
      lora_int_id: 1
      lora_path: /adapters/sql-lora
- id: wr-profile
  name: Worker profiler start/stop
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:1365-1421
  entry:
    caller: engine-core
    interface: gpu-worker-impl.profile
    input:
      is_start: true
      profile_prefix: bench
- id: wr-init-worker
  name: Worker process bootstrap (init_worker)
  tags:
  - writes
  sources:
  - vllm/v1/worker/worker_base.py:259-338
  entry:
    caller: engine-core
    interface: worker-wrapper-base.init-worker
    input:
      worker_cls: vllm.v1.worker.gpu_worker.Worker
      rank: 0
- id: wr-load-logits-processors
  name: Custom logits processor loading (V2 runner, plugin group vllm.logits_processors)
  sources:
  - vllm/v1/worker/gpu/sample/logits_processor/loader.py:156-183
  entry:
    caller: gpu-model-runner
    interface: logits-processor-loader.build-custom-logits-processors
    input:
      is_pooling_model: false
      max_num_reqs: 128
      custom: []
- id: wr-shutdown
  name: Worker shutdown
  tags:
  - writes
  sources:
  - vllm/v1/worker/gpu_worker.py:1606-1634
  entry:
    caller: engine-core
    interface: gpu-worker-impl.shutdown
    input: {}
- id: wr-pipeline-parallel-step
  name: One step on a pipeline-parallel rank (intermediate tensors to the next stage; only the last stage samples)
  tags:
  - writes
  - feature:pipeline-parallel
  sources:
  - vllm/v1/worker/gpu_worker.py:1300-1360
  - vllm/v1/worker/gpu/model_runner.py:2108-2127
  entry:
    caller: engine-core
    interface: gpu-worker-impl.execute-model
    input:
      scheduled_new_reqs: []
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens: {}
      total_num_scheduled_tokens: 0
      finished_req_ids: []
- id: wr-spec-decode-step
  name: A speculative-decoding step (verify the drafts in one target forward, then propose the next)
  tags:
  - writes
  - feature:speculative-decoding
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1643-1652
  - vllm/v1/worker/gpu/model_runner.py:2224-2253
  entry:
    caller: engine-core
    interface: gpu-worker-impl.execute-model
    input:
      scheduled_new_reqs: []
      scheduled_cached_reqs:
        req_ids: []
        num_computed_tokens: []
        new_block_ids: []
      num_scheduled_tokens: {}
      total_num_scheduled_tokens: 0
      finished_req_ids: []
