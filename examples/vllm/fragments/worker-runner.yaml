- component: forward-context
  name: set-forward-context
  kind: function
  summary: 'set_forward_context (entering the context manager): with data parallelism above 1 (or sequence-parallel
    MoE) on a MoE model it builds DPMetadata, asserting this rank''s entry in num_tokens_across_dp equals num_tokens
    (a single-rank count when DP is 1); with a CUDA graph mode other than NONE and num_tokens it fills in a BatchDescriptor(num_tokens)
    when none is given; then the new ForwardContext replaces the current one (the previous is restored on exit).'
  sources:
  - vllm/forward_context.py:277-362
  - vllm/forward_context.py:88-108
  - vllm/forward_context.py:230-276
  - vllm/forward_context.py:30-58
  latency_ms: 0
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      num_tokens:
        type:
        - integer
        - 'null'
        default: null
      num_tokens_across_dp:
        type:
        - array
        - 'null'
        default: null
        items:
          type: integer
      cudagraph_runtime_mode:
        type: string
        default: NONE
        enum:
        - NONE
        - PIECEWISE
        - FULL
      batch_descriptor:
        type:
        - object
        - 'null'
        default: null
      has_attn_metadata:
        type: boolean
        default: true
      is_moe_model:
        type: boolean
        default: false
      dp_rank:
        type: integer
        default: 0
  response:
    type: object
    properties:
      cudagraph_runtime_mode:
        type: string
      batch_descriptor:
        type:
        - object
        - 'null'
      dp_metadata:
        type:
        - object
        - 'null'
  behavior:
  - set:
      vars.inp: '= merge({''num_tokens'': null, ''num_tokens_across_dp'': null, ''cudagraph_runtime_mode'': ''NONE'',
        ''batch_descriptor'': null, ''has_attn_metadata'': true, ''is_moe_model'': false, ''dp_rank'': 0}, input)'
  - set:
      vars.dp: null
      vars.across: = vars.inp.num_tokens_across_dp
  - if: int(config['data-parallel-size']) > 1 && vars.inp.is_moe_model && (vars.inp.has_attn_metadata || vars.inp.num_tokens
      != null)
    then:
    - if: vars.across == null
      then:
      - title: Without a precomputed count, DP ranks agree on token counts (coordinate_batch_across_dp)
        source: vllm/forward_context.py:309-320
        set:
          vars.across: '= lists.range(int(config[''data-parallel-size''])).map(r, r == vars.inp.dp_rank ? vars.inp.num_tokens
            : 0)'
    - if: 'vars.across[vars.inp.dp_rank] != (vars.inp.num_tokens != null ? vars.inp.num_tokens : 0)'
      then:
      - title: This rank's entry must equal its batch size
        source: vllm/forward_context.py:101-106
        fail:
          code: assertion-error
          status: 0
          message: = string(vars.across[vars.inp.dp_rank]) + ' ' + string(vars.inp.num_tokens)
    - source: vllm/forward_context.py:324-326
      set:
        vars.dp: '= {''num_tokens_across_dp_cpu'': vars.across}'
  - title: A CUDA graph run with num_tokens gets a BatchDescriptor(num_tokens) when none is given
    source: vllm/forward_context.py:328-332
    set:
      vars.bd: '= vars.inp.batch_descriptor != null ? vars.inp.batch_descriptor : (vars.inp.cudagraph_runtime_mode
        != ''NONE'' && vars.inp.num_tokens != null ? dyn({''num_tokens'': vars.inp.num_tokens, ''num_reqs'': null,
        ''uniform'': false, ''has_lora'': false, ''num_active_loras'': 0}) : dyn(null))'
  - title: The new context replaces the current one until the block exits
    source: vllm/forward_context.py:263-276
    set:
      state.previous: = state.previous + [state.current]
      state.current: '= {''cudagraph_runtime_mode'': vars.inp.cudagraph_runtime_mode, ''batch_descriptor'': vars.bd,
        ''dp_metadata'': vars.dp, ''num_tokens'': vars.inp.num_tokens}'
  - return:
      cudagraph_runtime_mode: = vars.inp.cudagraph_runtime_mode
      batch_descriptor: = vars.bd
      dp_metadata: = vars.dp
