- component: gpu-worker-impl
  name: start-weight-update-session
  kind: function
  summary: '_start_weight_update: the shared checks and the session flag.'
  sources:
  - vllm/v1/worker/gpu_worker.py:1524-1548
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      is_draft:
        type: boolean
  response:
    type: object
    properties:
      active:
        type: boolean
      is_draft:
        type: boolean
  behavior:
  - if: '!state.weight_transfer_engine'
    then:
    - fail:
        code: runtime-error
        status: 0
        message: Weight transfer not configured. Please set weight_transfer_config to enable weight transfer.
  - if: input.is_draft
    then:
    - title: A draft update needs a draft model
      source: vllm/v1/worker/gpu_worker.py:1148-1163
      if: config['speculative-method'] == ''
      then:
      - fail:
          code: runtime-error
          status: 0
          message: Draft model weight update requested, but no draft model is configured.
  - title: One session at a time (the flag is checked and set on the worker's single RPC thread)
    source: vllm/v1/worker/gpu_worker.py:1534-1538
    call: weight-update-session.claim
    input:
      is_draft: = input.is_draft
    on_error:
    - fail:
        code: runtime-error
        status: 0
        message: start_weight_update called while a weight update is already active. Call finish_weight_update first.
  - call: weight-transfer-engine.start-weight-update
    input: {}
    on_error:
    - title: A failed start resets the target and leaves no session
      source: vllm/v1/worker/gpu_worker.py:1540-1546
      call: weight-update-session.release
      input: {}
    - fail: = error
