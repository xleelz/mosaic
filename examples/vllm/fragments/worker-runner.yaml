- component: worker-utils
  name: request-memory
  kind: function
  summary: 'request_memory: the instance''s budget is ceil(total * gpu_memory_utilization); startup fails when free
    memory is below it (or below the budget minus externally held weights).'
  sources:
  - vllm/v1/worker/utils.py:716-772
  latency_ms: 0
  errors:
  - code: value-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - total_bytes
    - free_bytes
    properties:
      total_bytes:
        type: integer
        examples:
        - 85899345920
      free_bytes:
        type: integer
        examples:
        - 85899345920
      external_weight_memory:
        type: integer
        examples:
        - 0
  response:
    type: object
    properties:
      requested_memory:
        type: integer
  behavior:
  - set:
      vars.requested: = int(math.ceil(double(input.total_bytes) * config['gpu-memory-utilization']))
  - if: has(input.external_weight_memory) && input.external_weight_memory > 0
    then:
    - set:
        vars.engine: = vars.requested - input.external_weight_memory
    - if: vars.engine <= 0
      then:
      - title: Externally held weights exceed the utilization budget
        source: vllm/v1/worker/utils.py:729-739
        fail:
          code: value-error
          status: 0
          message: '= ''Externally held weights on device '' + ''cuda:'' + string(self == '''' ? 0 : int(self.substring(4))
            % 8) + '' ('' + string((((input.external_weight_memory) * 100 + 536870912) / 1073741824) / 100) + ''.''
            + ((((input.external_weight_memory) * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((input.external_weight_memory)
            * 100 + 536870912) / 1073741824) % 10 == 0) ? string(((((input.external_weight_memory) * 100 + 536870912)
            / 1073741824) % 100) / 10) : (((((input.external_weight_memory) * 100 + 536870912) / 1073741824) % 100
            < 10 ? ''0'' : '''') + string((((input.external_weight_memory) * 100 + 536870912) / 1073741824) % 100))))
            + ''/'' + string((((input.total_bytes) * 100 + 536870912) / 1073741824) / 100) + ''.'' + ((((input.total_bytes)
            * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((input.total_bytes) * 100 + 536870912) / 1073741824)
            % 10 == 0) ? string(((((input.total_bytes) * 100 + 536870912) / 1073741824) % 100) / 10) : (((((input.total_bytes)
            * 100 + 536870912) / 1073741824) % 100 < 10 ? ''0'' : '''') + string((((input.total_bytes) * 100 + 536870912)
            / 1073741824) % 100)))) + '' GiB) exceed the desired GPU memory utilization ('' + string(config[''gpu-memory-utilization''])
            + '', '' + string((((vars.requested) * 100 + 536870912) / 1073741824) / 100) + ''.'' + ((((vars.requested)
            * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((vars.requested) * 100 + 536870912) / 1073741824)
            % 10 == 0) ? string(((((vars.requested) * 100 + 536870912) / 1073741824) % 100) / 10) : (((((vars.requested)
            * 100 + 536870912) / 1073741824) % 100 < 10 ? ''0'' : '''') + string((((vars.requested) * 100 + 536870912)
            / 1073741824) % 100)))) + '' GiB). Increase GPU memory utilization or reduce GPU memory used by other
            processes.'''
    - if: input.free_bytes < vars.engine
      then:
      - title: Free memory below the engine's budget after external weights
        source: vllm/v1/worker/utils.py:740-750
        fail:
          code: value-error
          status: 0
          message: '= ''Free memory on device '' + ''cuda:'' + string(self == '''' ? 0 : int(self.substring(4))
            % 8) + '' ('' + string((((input.free_bytes) * 100 + 536870912) / 1073741824) / 100) + ''.'' + ((((input.free_bytes)
            * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((input.free_bytes) * 100 + 536870912) / 1073741824)
            % 10 == 0) ? string(((((input.free_bytes) * 100 + 536870912) / 1073741824) % 100) / 10) : (((((input.free_bytes)
            * 100 + 536870912) / 1073741824) % 100 < 10 ? ''0'' : '''') + string((((input.free_bytes) * 100 + 536870912)
            / 1073741824) % 100)))) + ''/'' + string((((input.total_bytes) * 100 + 536870912) / 1073741824) / 100)
            + ''.'' + ((((input.total_bytes) * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((input.total_bytes)
            * 100 + 536870912) / 1073741824) % 10 == 0) ? string(((((input.total_bytes) * 100 + 536870912) / 1073741824)
            % 100) / 10) : (((((input.total_bytes) * 100 + 536870912) / 1073741824) % 100 < 10 ? ''0'' : '''') +
            string((((input.total_bytes) * 100 + 536870912) / 1073741824) % 100)))) + '' GiB) on startup is less
            than the engine\''s budget after excluding external process\''s weights ('' + string(config[''gpu-memory-utilization''])
            + '', '' + string((((vars.engine) * 100 + 536870912) / 1073741824) / 100) + ''.'' + ((((vars.engine)
            * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((vars.engine) * 100 + 536870912) / 1073741824)
            % 10 == 0) ? string(((((vars.engine) * 100 + 536870912) / 1073741824) % 100) / 10) : (((((vars.engine)
            * 100 + 536870912) / 1073741824) % 100 < 10 ? ''0'' : '''') + string((((vars.engine) * 100 + 536870912)
            / 1073741824) % 100)))) + '' GiB). Decrease GPU memory utilization or reduce GPU memory used by other
            processes.'''
    - return:
        requested_memory: = vars.engine
  - if: input.free_bytes < vars.requested
    then:
    - title: Free memory below the requested budget
      detail: 'Another process (or another vLLM instance) holds memory: free < ceil(total * gpu_memory_utilization).'
      source: vllm/v1/worker/utils.py:761-770
      fail:
        code: value-error
        status: 0
        message: '= ''Free memory on device '' + ''cuda:'' + string(self == '''' ? 0 : int(self.substring(4)) %
          8) + '' ('' + string((((input.free_bytes) * 100 + 536870912) / 1073741824) / 100) + ''.'' + ((((input.free_bytes)
          * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((input.free_bytes) * 100 + 536870912) / 1073741824)
          % 10 == 0) ? string(((((input.free_bytes) * 100 + 536870912) / 1073741824) % 100) / 10) : (((((input.free_bytes)
          * 100 + 536870912) / 1073741824) % 100 < 10 ? ''0'' : '''') + string((((input.free_bytes) * 100 + 536870912)
          / 1073741824) % 100)))) + ''/'' + string((((input.total_bytes) * 100 + 536870912) / 1073741824) / 100)
          + ''.'' + ((((input.total_bytes) * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0'' : (((((input.total_bytes)
          * 100 + 536870912) / 1073741824) % 10 == 0) ? string(((((input.total_bytes) * 100 + 536870912) / 1073741824)
          % 100) / 10) : (((((input.total_bytes) * 100 + 536870912) / 1073741824) % 100 < 10 ? ''0'' : '''') + string((((input.total_bytes)
          * 100 + 536870912) / 1073741824) % 100)))) + '' GiB) on startup is less than desired GPU memory utilization
          ('' + string(config[''gpu-memory-utilization'']) + '', '' + string((((vars.requested) * 100 + 536870912)
          / 1073741824) / 100) + ''.'' + ((((vars.requested) * 100 + 536870912) / 1073741824) % 100 == 0 ? ''0''
          : (((((vars.requested) * 100 + 536870912) / 1073741824) % 10 == 0) ? string(((((vars.requested) * 100
          + 536870912) / 1073741824) % 100) / 10) : (((((vars.requested) * 100 + 536870912) / 1073741824) % 100
          < 10 ? ''0'' : '''') + string((((vars.requested) * 100 + 536870912) / 1073741824) % 100)))) + '' GiB).
          Decrease GPU memory utilization or reduce GPU memory used by other processes.'''
  - return:
      requested_memory: = vars.requested
- component: worker-sentinel
  name: handle-command
