  name: build-logitsprocs
  kind: function
  summary: 'build_logitsprocs (V1 runner): pooling models and speculative decoding reject custom processors; otherwise
    built-ins (min_tokens, logit_bias, min_p) plus installed plugins and the configured FQCNs.'
  sources:
