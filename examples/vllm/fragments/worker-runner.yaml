- component: encoder-cudagraph-manager
  name: capture
  kind: function
  summary: 'capture: one graph per non-zero token budget, largest first, on the default path.'
  sources:
  - vllm/v1/worker/encoder_cudagraph.py:246-273
  latency_ms: 0
  response:
    type: object
    properties:
      num_graphs:
        type: integer
  behavior:
  - source: vllm/v1/worker/encoder_cudagraph.py:258-267
    set:
      state.budget_graphs: = state.token_budgets.filter(b, b != 0).sortBy(b, -b)
  - return:
