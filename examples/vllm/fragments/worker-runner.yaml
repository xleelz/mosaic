      requested_memory: 79027398247
      num_gpu_blocks: 0
      bytes_per_block: 2097152
    gpu-model-runner:
      model_loaded: true
      kv_cache_initialized: true
      num_blocks: 28488
    cuda-graph-manager:
      graphs_captured: true
- id: worker-runner-moe-mixtral-8x7b-tp2-ep
  summary: 'Mixtral-8x7B at TP 2: 46.7 GB of weights per rank, 4 KV heads per rank x 32 layers in bf16 = 1 MiB per
    block, 29,103,380,071 bytes available = 27,755 blocks per rank.'
  attributes:
