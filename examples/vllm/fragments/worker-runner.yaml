- component: ngram-gpu-speculator
  name: propose
  kind: function
  summary: 'NgramGPUSpeculator.propose: for each request, find the longest n-gram (prompt_lookup_max down to prompt_lookup_min)
    whose earlier occurrence matches the context''s suffix, the right-most occurrence on ties, and draft the k tokens
    that followed it; rows with no match, or that sampled nothing this step, repeat the last sampled token.'
  sources:
  - vllm/v1/worker/gpu/spec_decode/ngram/speculator.py:216-270
  - vllm/v1/worker/gpu/spec_decode/ngram/speculator.py:20-148
  latency_ms: 0
  request:
    type: object
    properties:
      req_ids:
        type: array
        items:
          type: string
      num_speculative_tokens:
        type: integer
      token_ids:
        type:
        - array
        - 'null'
        default: null
        items:
          type: array
          items:
            type: integer
        description: each request's committed tokens (the runner's all_token_ids row)
      num_sampled:
        type:
        - array
        - 'null'
        default: null
        items:
          type: integer
      last_sampled:
        type:
        - array
        - 'null'
        default: null
        items:
          type: integer
  response:
    type: object
    properties:
      draft_token_ids:
        type: object
  behavior:
  - call: ngram-gpu-speculator.ngram-scan-kernel
    input:
      num_rows: = size(input.req_ids)
  - call: ngram-gpu-speculator.ngram-finalize-kernel
    input:
      num_rows: = size(input.req_ids)
  - if: has(input.token_ids) && input.token_ids != null && size(input.token_ids) == size(input.req_ids)
    then:
    - set:
        vars.minn: = int(config['prompt-lookup-min'])
        vars.maxn: = int(config['prompt-lookup-max'])
        vars.k: = input.num_speculative_tokens
    - title: 'Scan: score = n * (L + 1) + pos + 1 over every window pos <= L - n - 1 that equals the suffix of length
        n; the highest score wins (longest n, then right-most)'
      source: vllm/v1/worker/gpu/spec_decode/ngram/speculator.py:56-84
      set:
        vars.best: '= lists.range(size(input.req_ids)).map(b, size(input.token_ids[b]) < vars.minn || (has(input.num_sampled)
          && input.num_sampled != null && input.num_sampled[b] == 0) ? [0] : (lists.range(vars.maxn - vars.minn
          + 1).map(i, vars.maxn - i).filter(n, size(input.token_ids[b]) > n).map(n, lists.range(size(input.token_ids[b])
          - n).filter(p, input.token_ids[b].slice(p, p + n) == input.token_ids[b].slice(size(input.token_ids[b])
          - n, size(input.token_ids[b]))).map(p, n * (size(input.token_ids[b]) + 1) + p + 1)).flatten().sortBy(x,
          -x) + [0]).slice(0, 1))'
    - title: 'Finalize: draft the k tokens after the match; slots with no token (or no match) take the last sampled
        token'
      source: vllm/v1/worker/gpu/spec_decode/ngram/speculator.py:113-148
      return:
        draft_token_ids: '= input.req_ids.transformMapEntry(b, id, {id: lists.range(vars.k).map(j, vars.best[b][0]
          > 0 && ((vars.best[b][0] - 1) % (size(input.token_ids[b]) + 1)) + ((vars.best[b][0] - 1) / (size(input.token_ids[b])
          + 1)) + j < size(input.token_ids[b]) ? input.token_ids[b][((vars.best[b][0] - 1) % (size(input.token_ids[b])
          + 1)) + ((vars.best[b][0] - 1) / (size(input.token_ids[b]) + 1)) + j] : (has(input.last_sampled) && input.last_sampled
          != null ? input.last_sampled[b] : 0))})'
  - title: Without the token rows in hand, whether the context repeats is data the model does not hold
    choice: match
    default: found
    options:
      found:
      - return:
          draft_token_ids: '= input.req_ids.transformMapEntry(i, id, {id: lists.range(input.num_speculative_tokens).map(k,
            800 + k)})'
      none:
      - title: 'No match: every one of the k draft slots takes the last sampled token, so the step still verifies
          k drafts'
        source: vllm/v1/worker/gpu/spec_decode/ngram/speculator.py:141-148
        return:
          draft_token_ids: '= input.req_ids.transformMapEntry(i, id, {id: lists.range(input.num_speculative_tokens).map(k,
            has(input.last_sampled) && input.last_sampled != null && size(input.last_sampled) > i ? input.last_sampled[i]
            : 0)})'
