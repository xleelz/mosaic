      source: vllm/profiler/wrapper.py:147-150
      set:
        state.profiling_for_iters: = state.profiling_for_iters + 1
  - if: state.max_iters > 0 && state.running && state.profiling_for_iters > state.max_iters
    then:
    - title: Max profiling iterations reached; stop through the public stop()
      source: vllm/profiler/wrapper.py:152-164
      call: worker-profiler.stop
      input: {}
  - return:
      active: = state.active
      running: = state.running
      profiling_for_iters: = state.profiling_for_iters
