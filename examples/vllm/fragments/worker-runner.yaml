- component: gpu-model-runner
  name: ensure-lora-enabled
  kind: function
  summary: '_ensure_lora_enabled: the LoRA manager exists only with --enable-lora.'
  sources:
  - vllm/v1/worker/lora_model_runner_mixin.py:79-81
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  behavior:
  - if: '!config[''enable-lora'']'
    then:
    - fail:
        code: runtime-error
        status: 0
        message: LoRA is not enabled. Use --enable-lora to enable LoRA.
- component: gpu-model-runner
  name: reset-lora-state
  kind: function
  summary: Drops cached LoRA-merged state after weights change underneath it.
  sources:
  - vllm/v1/worker/lora_model_runner_mixin.py:280-284
  latency_ms: 0
  behavior:
  - if: config['enable-lora']
    then:
    - set:
        state.loras: []
- component: gpu-model-runner
  name: finish-requests
  kind: function
  summary: 'finish_requests: frees the slots of finished and preempted requests in sorted order, so every TP rank
    frees slots identically.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1152-1164
  - vllm/v1/worker/gpu/model_runner.py:1134-1150
  - vllm/v1/worker/gpu/states.py:126-133
  latency_ms: 0
  request:
    type: object
    properties:
      req_ids:
        type: array
        items:
          type: string
  response:
    type: object
    properties:
      freed:
        type: array
  behavior:
  - set:
      vars.freed: []
  - foreach: = input.req_ids.sort()
    as: rid
    steps:
    - if: vars.rid in state.slots
      then:
      - set:
          state.free_slots: = state.free_slots + [state.slots[vars.rid].slot]
          vars.freed: = vars.freed + [state.slots[vars.rid].slot]
      - set:
          state.slots: = omit(state.slots, vars.rid)
      - if: config['model-is-multimodal']
        then:
        - title: The encoder cache drops the request's multimodal features
          source: vllm/v1/worker/gpu/model_runner.py:1145-1146
          call: encoder-cache.add-request
          input:
            req_id: = vars.rid
            mm_features: null
  - return:
      freed: = vars.freed
- component: gpu-model-runner
  name: add-requests
  kind: function
  summary: 'add_requests: each new request takes a slot (RequestState.free_indices.pop(): the most recently freed
    slot, else the highest unused index), and its sampling params are staged into the sampler''s per-slot state;
    block ids are copied into the GPU block-table mirror.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1181-1234
  - vllm/v1/worker/gpu/states.py:91-117
  latency_ms: 0
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      reqs:
        type: array
      num_scheduled:
        type: object
        default: {}
  response:
    type: object
    properties:
      slots:
        type: object
  behavior:
  - set:
      vars.assigned: {}
  - foreach: = input.reqs
    as: r
    steps:
    - if: vars.r.req_id in state.slots
      then:
      - title: Streaming input update re-adds an existing request
        source: vllm/v1/worker/gpu/model_runner.py:1186-1189
        call: gpu-model-runner.finish-requests
        input:
          req_ids:
          - = vars.r.req_id
    - if: size(state.free_slots) == 0 && state.fresh_slots_used >= int(config['max-num-seqs'])
      then:
      - title: No free request slot
        source: vllm/v1/worker/gpu/states.py:99
        fail:
          code: assertion-error
          status: 0
          message: No free indices
    - set:
        vars.slot: '= size(state.free_slots) > 0 ? state.free_slots[size(state.free_slots) - 1] : int(config[''max-num-seqs''])
          - 1 - state.fresh_slots_used'
    - set:
        state.free_slots: '= size(state.free_slots) > 0 ? state.free_slots.slice(0, size(state.free_slots) - 1)
          : state.free_slots'
        state.fresh_slots_used: '= size(state.free_slots) > 0 ? state.fresh_slots_used : state.fresh_slots_used
          + 1'
    - set:
        vars.ptoks: '= has(vars.r.prefill_token_ids) && vars.r.prefill_token_ids != null ? vars.r.prefill_token_ids
          : (has(vars.r.prompt_token_ids) && vars.r.prompt_token_ids != null ? vars.r.prompt_token_ids : [])'
    - title: 'A prompt given as segments (prompt_token_ids null) still has a length: num_prefill_tokens (prompt
        plus output for a resumed request), else the prompt length; its hash comes from the segment keys'
      source: vllm/v1/core/sched/output.py:41-56
      set:
        vars.plen: '= size(vars.ptoks) > 0 ? size(vars.ptoks) : (has(vars.r.num_prefill_tokens) && vars.r.num_prefill_tokens
          != null ? vars.r.num_prefill_tokens : (has(vars.r.num_prompt_tokens) ? vars.r.num_prompt_tokens : (has(vars.r.prompt_segments)
          && vars.r.prompt_segments != null ? sum(vars.r.prompt_segments.map(g, g.num_tokens)) : vars.r.num_computed_tokens
          + (vars.r.req_id in input.num_scheduled ? input.num_scheduled[vars.r.req_id] : 0))))'
        vars.phash: '= size(vars.ptoks) > 0 ? sum(lists.range(size(vars.ptoks)).map(i, (vars.ptoks[i] % 1000003)
          * ((i % 97) + 1))) % 1000003 : (has(vars.r.prompt_segments) && vars.r.prompt_segments != null ? sum(vars.r.prompt_segments.map(g,
          size(g.key) * 131 + g.num_tokens)) % 1000003 : 0)'
    - if: has(vars.r.prompt_len) && vars.plen < vars.r.prompt_len
      then:
      - title: The refill must cover the whole prompt
        source: vllm/v1/worker/gpu/states.py:105-108
        fail:
          code: assertion-error
          status: 0
          message: = 'prefill_len ' + string(vars.plen) + ' < prompt_len ' + string(vars.r.prompt_len)
    - set:
        state.slots: '= merge(state.slots, {vars.r.req_id: {''slot'': vars.slot, ''prefill_len'': vars.plen, ''prompt_len'':
          has(vars.r.prompt_len) ? vars.r.prompt_len : vars.plen, ''prompt_hash'': vars.phash, ''token_ids'': vars.ptoks,
          ''last_sampled'': size(vars.ptoks) > 0 ? vars.ptoks[size(vars.ptoks) - 1] : -1}})'
        vars.assigned: '= merge(vars.assigned, {vars.r.req_id: vars.slot})'
    - if: config['model-is-multimodal']
      then:
      - title: The encoder cache records the request's multimodal features
        source: vllm/v1/worker/gpu/model_runner.py:1213-1214
        call: encoder-cache.add-request
        input:
          req_id: = vars.r.req_id
          mm_features: '= has(vars.r.mm_features) && vars.r.mm_features != null ? vars.r.mm_features : []'
    - title: Copy the request's block ids into the GPU block-table row (overwrite)
      source: vllm/v1/worker/gpu/model_runner.py:1216-1218
      call: block-tables.append-block-ids
      input:
        slot: = vars.slot
        block_ids: '= !has(vars.r.block_ids) || size(vars.r.block_ids) == 0 ? [] : (type(vars.r.block_ids[0]) ==
          list ? vars.r.block_ids[0] : vars.r.block_ids)'
        overwrite: true
    - title: Stage the request's sampling params into its slot (last PP rank)
      source: vllm/v1/worker/gpu/model_runner.py:1221-1227
      when: '!state.is_pooling_model'
      call: sampler.add-request
      input:
        slot: = vars.slot
        sampling_params: '= has(vars.r.sampling_params) ? vars.r.sampling_params : {}'
  - if: size(input.reqs) > 0
    then:
    - title: Flush the request states' staged writes to the device
      source: vllm/v1/worker/gpu/model_runner.py:1230-1232
      call: request-state.apply-staged-writes
      input:
        num_rows: = size(input.reqs)
  - title: The sampler flushes its own and its logits processors' staged writes every step
    source: vllm/v1/worker/gpu/model_runner.py:1233-1234
    when: '!state.is_pooling_model'
    call: sampler.apply-staged-writes
    input: {}
  - return:
      slots: = vars.assigned
- component: gpu-model-runner
  name: update-requests
  kind: function
  summary: 'update_requests: new block ids of running requests go to the GPU block-table mirror; freshly allocated
    blocks are zeroed; prefix-cache copy-on-write copies run before the forward.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1236-1270
  latency_ms: 0
  request:
    type: object
    properties:
      cached:
        type: object
      new_block_ids_to_zero:
        type: array
        items:
          type: integer
  behavior:
  - title: Append each running request's new blocks to its row
    source: vllm/v1/worker/gpu/model_runner.py:1239-1248
    foreach: '= has(input.cached) && has(input.cached.req_ids) ? lists.range(size(input.cached.req_ids)) : []'
    as: i
    steps:
    - if: has(input.cached.new_block_ids) && size(input.cached.new_block_ids) > vars.i && input.cached.new_block_ids[vars.i]
        != null && size(input.cached.new_block_ids[vars.i]) > 0 && input.cached.req_ids[vars.i] in state.slots
      then:
      - call: block-tables.append-block-ids
        input:
          slot: = state.slots[input.cached.req_ids[vars.i]].slot
          block_ids: '= type(input.cached.new_block_ids[vars.i][0]) == list ? input.cached.new_block_ids[vars.i][0]
            : input.cached.new_block_ids[vars.i]'
          overwrite: false
  - if: has(input.new_block_ids_to_zero) && size(input.new_block_ids_to_zero) > 0
    then:
    - title: Zero freshly allocated KV blocks
      source: vllm/v1/worker/gpu/model_runner.py:1256-1259
      call: kv-block-zeroer.zero-block-ids
      input:
        block_ids: = input.new_block_ids_to_zero
- component: gpu-model-runner
  name: execute-model
  kind: function
  summary: 'GPUModelRunner.execute_model: update request slots, then (if any tokens are scheduled) gather the batch,
    dispatch a CUDA graph descriptor, prepare inputs and attention metadata, run the model (FULL graph replay, PIECEWISE
    graphs, or eager) and keep the hidden states for sample_tokens. Returns None, or an empty ModelRunnerOutput
    when nothing runs.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1719-2085
  latency_ms: 0
  errors:
  - code: key-error
    status: 0
    retryable: false
  request:
    allOf:
    - $ref: SchedulerOutput
    - type: object
      properties:
        scheduled_spec_decode_tokens:
          type: object
          description: req_id -> draft token ids (-1 placeholders under async scheduling)
        new_block_ids_to_zero:
          type: array
          items:
            type: integer
        preempted_req_ids:
          type: array
          items:
            type: string
        kv_connector_metadata:
          type:
          - object
          - 'null'
          default: null
          description: SchedulerOutput.kv_connector_metadata (with a KV transfer connector)
        scheduled_encoder_inputs:
          type: object
          default: {}
          description: 'SchedulerOutput.scheduled_encoder_inputs: req_id -> indices of its mm_features to encode
            this step'
        free_encoder_mm_hashes:
          type: array
          default: []
          items:
            type: string
          description: 'SchedulerOutput.free_encoder_mm_hashes: encoder outputs the scheduler no longer needs'
  response:
    anyOf:
    - $ref: ModelRunnerOutput
    - type: 'null'
  behavior:
  - if: '!state.is_last_pp_rank'
    then:
    - title: Non-last PP ranks consume the sampled tokens received pp_size steps ago
      source: vllm/v1/worker/gpu/model_runner.py:1171-1179
      call: pp-handler.get-prev-sampled-outputs
      input: {}
  - title: Update request states from the SchedulerOutput
    source: vllm/v1/worker/gpu/model_runner.py:1730-1736
    call: gpu-model-runner.finish-requests
    input:
      req_ids: '= input.finished_req_ids + (has(input.preempted_req_ids) ? input.preempted_req_ids : [])'
  - call: gpu-model-runner.add-requests
    input:
      reqs: = input.scheduled_new_reqs
      num_scheduled: = input.num_scheduled_tokens
  - if: config['model-is-multimodal'] && has(input.free_encoder_mm_hashes) && size(input.free_encoder_mm_hashes)
      > 0
    then:
    - title: free_states drops the encoder outputs the scheduler freed
      source: vllm/v1/worker/gpu/model_runner.py:1166-1169
      foreach: = input.free_encoder_mm_hashes
      as: h
      steps:
      - call: encoder-cache.free-encoder-cache
        input:
          mm_hash: = vars.h
  - call: gpu-model-runner.update-requests
    input:
      cached: = input.scheduled_cached_reqs
      new_block_ids_to_zero: '= has(input.new_block_ids_to_zero) ? input.new_block_ids_to_zero : []'
  - if: input.total_num_scheduled_tokens == 0
    then:
    - title: No tokens scheduled, no forward; the KV connector's no_forward output (e.g. finished sends) still goes
        back to the scheduler
      source: vllm/v1/worker/gpu/model_runner.py:1743-1748
      call: runner-kv-connector.no-forward
      input:
        kv_connector_metadata: '= has(input.kv_connector_metadata) ? input.kv_connector_metadata : null'
        finished_req_ids: = input.finished_req_ids
      as: nf
    - return: = vars.nf.value
  - set:
      vars.req_ids: = input.num_scheduled_tokens.map(k, k).sort()
      vars.drafts: '= has(input.scheduled_spec_decode_tokens) ? input.scheduled_spec_decode_tokens : {}'
      vars.dql: = 1 + int(config['num-speculative-tokens'])
  - if: vars.req_ids.exists(id, !(id in state.slots))
    then:
    - title: A scheduled request the runner never added
      source: vllm/v1/worker/gpu/model_runner.py:1298-1299
      fail:
        code: key-error
        status: 0
        message: = "'" + vars.req_ids.filter(id, !(id in state.slots))[0] + "'"
  - set:
      vars.nct: '= merge(input.scheduled_new_reqs.transformMapEntry(i, r, {r.req_id: r.num_computed_tokens}), input.scheduled_cached_reqs.req_ids.transformMapEntry(i,
        id, {id: input.scheduled_cached_reqs.num_computed_tokens[i]}))'
  - title: Gather the batch in decode-first order
    source: vllm/v1/worker/gpu/model_runner.py:2435-2447
    set:
      vars.batch: '= vars.req_ids.sortBy(id, ((id in vars.drafts && size(vars.drafts[id]) > 0) ? 0 : 2000000000)
        + (input.num_scheduled_tokens[id] != vars.dql ? 1000000000 : 0) + input.num_scheduled_tokens[id]).map(id,
        {''req_id'': id, ''slot'': state.slots[id].slot, ''n'': input.num_scheduled_tokens[id], ''nct'': vars.nct[id],
        ''prefill_len'': state.slots[id].prefill_len, ''drafts'': !(id in vars.drafts) ? [] : ((id in state.draft_tokens
        && size(state.draft_tokens[id]) >= size(vars.drafts[id])) ? state.draft_tokens[id].slice(0, size(vars.drafts[id]))
        : vars.drafts[id]), ''prompt_hash'': has(state.slots[id].prompt_hash) ? state.slots[id].prompt_hash : 0,
        ''prompt_len'': state.slots[id].prompt_len})'
  - set:
      vars.local_batch: = vars.batch
  - if: int(config['prefill-context-parallel-size']) > 1
    then:
    - title: 'PCP: this rank runs only its partition of the batch''s tokens; the manager keeps the global batch'
      source: vllm/v1/worker/gpu/model_runner.py:1552-1553
      call: pcp-manager.partition-batch
      input:
        batch: = vars.batch
        pcp_size: = int(config['prefill-context-parallel-size'])
      as: part
    - set:
        vars.local_batch: = vars.part.value.local_batch
  - set:
      vars.has_prefill: = vars.batch.exists(b, b.nct < b.prefill_len)
      vars.num_drafts: = sum(vars.batch.map(b, size(b.drafts)))
      vars.num_prefill_tokens: '= sum(vars.batch.map(b, b.nct < b.prefill_len ? b.n : 0))'
      vars.num_decode_reqs: = size(vars.batch.filter(b, b.nct >= b.prefill_len))
  - set:
      vars.uniform: '= (!vars.has_prefill && vars.batch.all(b, b.n == vars.batch[0].n)) ? vars.batch[0].n : 0'
  - title: Pick the CUDA graph descriptor (and agree on padding across DP ranks)
    source: vllm/v1/worker/gpu/model_runner.py:1781-1796
    call: cuda-graph-manager.dispatch
    input:
      num_reqs: = size(vars.batch)
      num_tokens: = input.total_num_scheduled_tokens
      uniform_token_count: = vars.uniform
      need_eager: false
    as: desc
  - call: gpu-model-runner.prepare-inputs
    input:
      batch: = vars.batch
      has_prefill: = vars.has_prefill
      num_drafts: = vars.num_drafts
      num_tokens: = input.total_num_scheduled_tokens
    as: ib
  - title: Block tables and slot mappings for attention
    source: vllm/v1/worker/gpu/model_runner.py:1556-1574
    call: block-tables.gather-block-tables
    input:
      slots: = vars.batch.map(b, b.slot)
    as: bt
  - call: block-tables.compute-slot-mappings-kernel
    input:
      num_tokens: = vars.desc.value.num_tokens
  - if: state.model.is_hybrid
    then:
    - title: Mamba align pre-copy across block boundaries
      source: vllm/v1/worker/gpu/model_runner.py:1817-1825
      call: mamba-hybrid-model-state.preprocess-state
      input:
        num_reqs: = size(vars.batch)
  - if: int(config['decode-context-parallel-size']) > 1
    then:
    - title: Per-rank sequence lengths under DCP
      source: vllm/v1/worker/gpu/model_runner.py:1872-1883
      call: cp-utils.prepare-dcp-local-seq-lens
      input:
        num_reqs: = size(vars.batch)
  - title: Build attention metadata (model_state.prepare_attn -> build_attn_metadata)
    source: vllm/v1/worker/gpu/model_runner.py:1915-1926
    call: flash-attention-metadata-builder.build
    input:
      fa_version: '= ''flash-attn-version'' in config && config[''flash-attn-version''] != null ? int(config[''flash-attn-version''])
        : 3'
      fast_build: false
      batch_invariant: false
      sliding_window_configs: 1
      use_full_cuda_graph: = vars.desc.value.cg_mode == 'FULL'
      max_cudagraph_size: = vars.desc.value.max_capture_size
      dcp_world_size: = int(config['decode-context-parallel-size'])
      common:
        num_reqs: = size(vars.batch)
        num_actual_tokens: = input.total_num_scheduled_tokens
        query_lens: = vars.batch.map(b, b.n)
        seq_lens: = vars.batch.map(b, b.nct + b.n)
        max_query_len: = vars.batch.map(b, b.n).sortBy(x, -x)[0]
        max_seq_len: = vars.batch.map(b, b.nct + b.n).sortBy(x, -x)[0]
        block_table: = vars.bt.value.block_table
        slot_mapping: '= lists.range(size(vars.batch)).map(i, lists.range(vars.batch[i].n).map(j, (vars.batch[i].nct
          + j) / int(config[''block-size'']) < size(vars.bt.value.block_table[i]) ? vars.bt.value.block_table[i][(vars.batch[i].nct
          + j) / int(config[''block-size''])] * int(config[''block-size'']) + (vars.batch[i].nct + j) % int(config[''block-size''])
          : -1)).flatten()'
        causal: true
  - if: config['model-is-multimodal'] && state.is_first_pp_rank && has(input.scheduled_encoder_inputs) && size(input.scheduled_encoder_inputs)
      > 0
    then:
    - call: encoder-cache.get-state
      input: {}
      as: ec
    - title: 'prepare_inputs_embeds: run the vision encoder on this step''s uncached items (first PP rank) before
        gathering the embeddings'
      source: vllm/v1/worker/gpu/model_runner.py:1939-1956
      call: encoder-runner.execute-mm-encoder
      input:
        scheduled_encoder_inputs: = input.scheduled_encoder_inputs
        mm_features: = vars.ec.value.mm_features
        cached: = vars.ec.value.cached
        model_component: '= (has(state.model_component) && state.model_component != '''' ? state.model_component
          : (has(state.model.architecture) && state.model.architecture.startsWith(''Mixtral'') ? ''mixtral-for-causal-lm''
          : (has(state.model.architecture) && state.model.architecture.startsWith(''Qwen2VL'') ? ''qwen2-vl-for-conditional-generation''
          : ''llama-for-causal-lm'')))'
  - if: state.model.uses_mrope || state.model.uses_prompt_embeds
    then:
    - when: state.model.uses_mrope
      call: rope-state.prepare-positions
      input:
        num_tokens: = input.total_num_scheduled_tokens
    - title: Prepare inputs_embeds (multimodal / prompt embeds), first PP rank
      source: vllm/v1/worker/gpu/model_runner.py:1931-1960
      when: state.model.uses_prompt_embeds
      call: prompt-embeds-state.apply
      input:
        num_tokens: = input.total_num_scheduled_tokens
  - title: The KV connector binds this step's metadata before the forward
    source: vllm/v1/worker/gpu/model_runner.py:2000-2008
    when: config['kv-connector'] != ''
    call: runner-kv-connector.pre-forward
    input:
      kv_connector_metadata: '= has(input.kv_connector_metadata) ? input.kv_connector_metadata : null'
  - set:
      vars.fwd:
        num_tokens: = vars.desc.value.num_tokens
        num_prefill_tokens: = vars.num_prefill_tokens
        num_decode_reqs: = vars.num_decode_reqs
  - title: PIECEWISE and eager forwards run inside set_forward_context with BatchDescriptor(padded num_tokens);
      a FULL replay needs none (its inputs are already in the graph's buffers)
    source: vllm/v1/worker/gpu/model_runner.py:2008-2027
    when: vars.desc.value.cg_mode != 'FULL'
    call: forward-context.set-forward-context
    input:
      num_tokens: = vars.desc.value.num_tokens
      cudagraph_runtime_mode: = vars.desc.value.cg_mode
      batch_descriptor:
        num_tokens: = vars.desc.value.num_tokens
        num_reqs: null
        uniform: false
        has_lora: = config['enable-lora']
        num_active_loras: 0
  - if: vars.desc.value.cg_mode == 'FULL'
    then:
    - title: Replay the captured FULL graph (inputs already in the graph's buffers)
      source: vllm/v1/worker/gpu/model_runner.py:1998-2007
      call: cuda-graph-manager.run-fullgraph
      input: = vars.fwd
    else:
    - if: vars.desc.value.cg_mode == 'PIECEWISE'
      then:
      - title: PIECEWISE graphs through the compiled model
        source: vllm/v1/worker/gpu/model_runner.py:2034-2042
        call: cuda-graph-manager.run-pw-graph
        input: '= merge(vars.fwd, {''model_component'': (has(state.model_component) && state.model_component !=
          '''' ? state.model_component : (has(state.model.architecture) && state.model.architecture.startsWith(''Mixtral'')
          ? ''mixtral-for-causal-lm'' : (has(state.model.architecture) && state.model.architecture.startsWith(''Qwen2VL'')
          ? ''qwen2-vl-for-conditional-generation'' : ''llama-for-causal-lm'')))})'
      else:
      - title: Eager forward of the loaded model
        source: vllm/v1/worker/gpu/model_runner.py:2043-2044
        call: '= (has(state.model_component) && state.model_component != '''' ? state.model_component : (has(state.model.architecture)
          && state.model.architecture.startsWith(''Mixtral'') ? ''mixtral-for-causal-lm'' : (has(state.model.architecture)
          && state.model.architecture.startsWith(''Qwen2VL'') ? ''qwen2-vl-for-conditional-generation'' : ''llama-for-causal-lm'')))
          + ''.forward'''
        targets:
        - llama-for-causal-lm.forward
        - mixtral-for-causal-lm.forward
        - qwen2-vl-for-conditional-generation.forward
        input: = vars.fwd
      - title: Kernel-launch overhead of an eager step (assumption)
        wait: = int(config['worker-runner-eager-launch-overhead-ms'])
  - when: vars.desc.value.cg_mode != 'FULL'
    call: forward-context.exit-forward-context
    input: {}
  - title: Keep the hidden states for sample_tokens
    source: vllm/v1/worker/gpu/model_runner.py:2064-2075
    set:
      state.execute_model_state:
        batch: = vars.batch
        local_batch: = vars.local_batch
        num_drafts: = vars.num_drafts
        cg_mode: = vars.desc.value.cg_mode
        num_tokens: = vars.desc.value.num_tokens
        logits_rows: = vars.ib.value.num_logits
        new_reqs: '= input.scheduled_new_reqs.transformMapEntry(i, r, {r.req_id: r})'
        finished_req_ids: = input.finished_req_ids
  - if: '!state.is_last_pp_rank'
    then:
    - title: A non-last PP rank returns IntermediateTensors for the next stage
      source: vllm/v1/worker/gpu/model_runner.py:2077-2083
      return:
        intermediate_tensors:
          num_tokens: = vars.desc.value.num_tokens
          req_ids: = vars.batch.map(b, b.req_id)
  - return: null
- component: gpu-model-runner
  name: prepare-inputs
  kind: function
  summary: 'prepare_inputs: query_start_loc and logits layout (one row per request, plus one per draft token when
    speculating), prefill token copy, positions/seq_lens, sampled+draft token combination.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1354-1554
  latency_ms: 0
  request:
    type: object
    properties:
      batch:
        type: array
      has_prefill:
        type: boolean
      num_drafts:
        type: integer
      num_tokens:
        type: integer
  response:
    type: object
    properties:
      num_logits:
        type: integer
  behavior:
  - set:
      vars.num_logits: = size(input.batch) + input.num_drafts
  - if: input.num_drafts > 0
    then:
    - title: Expand the index mapping to one row per logit
      source: vllm/v1/worker/gpu/model_runner.py:1441-1444
      call: input-batch.expand-idx-mapping-kernel
      input:
        num_rows: = vars.num_logits
  - if: input.has_prefill
    then:
    - title: Copy prefill chunks' token ids
      source: vllm/v1/worker/gpu/model_runner.py:1449-1458
      call: input-batch.prepare-prefill-inputs-kernel
      input:
        num_tokens: = input.num_tokens
  - source: vllm/v1/worker/gpu/model_runner.py:1460-1467
    call: input-batch.prepare-pos-seq-lens-kernel
    input:
      num_tokens: = input.num_tokens
  - source: vllm/v1/worker/gpu/model_runner.py:1470-1482
    call: input-batch.combine-sampled-and-draft-tokens-kernel
    input:
      num_rows: = vars.num_logits
  - return:
      num_logits: = vars.num_logits
- component: gpu-model-runner
  name: sample-tokens
  kind: function
  summary: 'GPUModelRunner.sample_tokens: computes logits for the kept hidden states, applies the grammar bitmask,
    samples (or rejection-samples drafts), computes prompt logprobs, post-updates per-request GPU state, lets the
    speculator propose the next drafts, and returns the ModelRunnerOutput (copied to host asynchronously). Returns
    None if execute_model did not run.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:2088-2280
  latency_ms: 0
  request:
    type: object
    properties:
      grammar_output:
        type:
        - object
        - 'null'
  response:
    anyOf:
    - $ref: ModelRunnerOutput
    - type: 'null'
  behavior:
  - if: state.execute_model_state == null
    then:
    - title: The prior execute_model call must have failed
      source: vllm/v1/worker/gpu/model_runner.py:2091-2093
      return: null
  - set:
      vars.ems: = state.execute_model_state
  - set:
      state.execute_model_state: null
  - if: '!state.is_last_pp_rank'
    then:
    - set:
        vars.fb: '= has(vars.ems.local_batch) ? vars.ems.local_batch : vars.ems.batch'
    - if: int(config['prefill-context-parallel-size']) > 1
      then:
      - title: With PCP the feedback uses the manager's global batch, not this rank's partition
        source: vllm/v1/worker/gpu/model_runner.py:2111-2112
        call: pcp-manager.global-batch
        input: {}
        as: gb
      - set:
          vars.fb: = vars.gb.value.batch
    - title: A non-last PP rank never samples; it records the receive of the last rank's broadcast
      source: vllm/v1/worker/gpu/model_runner.py:2113-2114
      call: pp-handler.receive
      input:
        need_sampled: = vars.fb.map(b, b.nct + b.n >= b.prefill_len)
      as: rcv
    - title: Optimistically advance num_computed_tokens for the whole (global) batch
      source: vllm/v1/worker/gpu/model_runner.py:2117-2119
      call: input-batch.post-update-num-computed-tokens-kernel
      input:
        num_rows: = size(vars.fb)
    - if: '!vars.rcv.value.all_decode_next && state.model.is_hybrid'
      then:
      - title: Non-final prefill chunks are scheduled next step; reset model state with 0 sampled
        source: vllm/v1/worker/gpu/model_runner.py:2120-2123
        call: mamba-hybrid-model-state.postprocess-state
        input:
          num_reqs: = size(vars.ems.batch)
          num_sampled_is_int: true
    - title: KV-connector-only output
      source: vllm/v1/worker/gpu/model_runner.py:2125-2127
      return:
        req_ids: []
        sampled_token_ids: []
  - if: int(config['prefill-context-parallel-size']) > 1
    then:
    - title: The last rank restores the global batch (and hidden states) before sampling
      source: vllm/v1/worker/gpu/model_runner.py:2131-2134
      call: pcp-manager.restore-for-sampling
      input: {}
  - call: gpu-model-runner.sample
    input:
      batch: = vars.ems.batch
      num_drafts: = vars.ems.num_drafts
      new_reqs: = vars.ems.new_reqs
      grammar_output: = input.grammar_output
    as: s
  - if: int(config['pipeline-parallel-size']) > 1
    then:
    - title: The last PP rank broadcasts sampled tokens to the other stages
      source: vllm/v1/worker/gpu/model_runner.py:2141-2148
      call: pp-handler.broadcast
      input:
        need_sampled: = vars.ems.batch.map(b, b.nct + b.n >= b.prefill_len)
        sampled_token_ids: = vars.s.value.sampled_token_ids
        receivers: = int(config['pipeline-parallel-size']) - 1
  - title: Prompt logprobs for requests that asked for them
    source: vllm/v1/worker/gpu/model_runner.py:2150-2159
    call: prompt-logprobs-worker.compute-prompt-logprobs
    input:
      new_reqs: = vars.ems.new_reqs
      model_component: '= (has(state.model_component) && state.model_component != '''' ? state.model_component :
        (has(state.model.architecture) && state.model.architecture.startsWith(''Mixtral'') ? ''mixtral-for-causal-lm''
        : (has(state.model.architecture) && state.model.architecture.startsWith(''Qwen2VL'') ? ''qwen2-vl-for-conditional-generation''
        : ''llama-for-causal-lm'')))'
  - title: Post-update num_computed_tokens, last sampled tokens and output bin counts
    source: vllm/v1/worker/gpu/model_runner.py:2217-2223
    call: input-batch.post-update-kernel
    input:
      num_rows: = size(vars.ems.batch)
  - title: The post-update appends each request's sampled tokens to its slot's all_token_ids and records the last
      sampled token
    source: vllm/v1/worker/gpu/input_batch.py:617-672
    set:
      vars.sampled_by_id: '= lists.range(size(vars.s.value.req_ids)).transformMapEntry(i, j, {vars.s.value.req_ids[i]:
        vars.s.value.sampled_token_ids[i]})'
  - set:
      state.slots: '= state.slots.transformMapEntry(id, sl, {id: (id in vars.sampled_by_id && size(vars.sampled_by_id[id])
        > 0) ? merge(sl, {''token_ids'': (has(sl.token_ids) ? sl.token_ids : []) + vars.sampled_by_id[id], ''last_sampled'':
        vars.sampled_by_id[id][size(vars.sampled_by_id[id]) - 1]}) : sl})'
  - if: state.model.is_hybrid
    then:
    - call: mamba-hybrid-model-state.postprocess-state
      input:
        num_reqs: = size(vars.ems.batch)
        num_drafts: = vars.ems.num_drafts
  - if: state.speculator != ''
    then:
    - title: The speculator proposes the next step's drafts
      source: vllm/v1/worker/gpu/model_runner.py:2224-2253
      call: = state.speculator + '.propose'
      targets:
      - target-dependent-ar-speculator.propose
      - standalone-ar-speculator.propose
      - dflash-speculator.propose
      - dflash2-speculator.propose
      - multi-module-mtp-speculator.propose
      - ngram-gpu-speculator.propose
      input:
        req_ids: = vars.s.value.req_ids
        num_speculative_tokens: = int(config['num-speculative-tokens'])
        token_ids: '= vars.s.value.req_ids.all(id, has(state.slots[id].token_ids) && size(state.slots[id].token_ids)
          >= state.slots[id].prefill_len) ? dyn(vars.s.value.req_ids.map(id, state.slots[id].token_ids)) : dyn(null)'
        num_sampled: = vars.s.value.sampled_token_ids.map(t, size(t))
        last_sampled: '= vars.s.value.req_ids.map(id, has(state.slots[id].last_sampled) ? state.slots[id].last_sampled
          : -1)'
      as: prop
    - set:
        state.draft_tokens: = vars.prop.value.draft_token_ids
  - if: int(config['num-speculative-tokens']) > 0
    then:
    - title: 'DraftTokensHandler.set_draft_tokens: drafts go back to the scheduler only for a batch with structured-output
        requests (grammar validation); otherwise the handler keeps just the batch''s request ids and the draft count'
      source: vllm/v1/worker/gpu/spec_decode/utils.py:59-75
      set:
        state.draft_handler:
          req_ids: = vars.ems.batch.map(b, b.req_id)
          num_draft_tokens: = int(config['num-speculative-tokens'])
          structured: = input.grammar_output != null && has(input.grammar_output.structured_output_request_ids)
            && vars.ems.batch.exists(b, b.req_id in input.grammar_output.structured_output_request_ids)
  - title: Post-step KV connector work (finished sends and receives, load errors)
    source: vllm/v1/worker/gpu/model_runner.py:2275-2278
    when: config['kv-connector'] != ''
    call: runner-kv-connector.post-forward
    input:
      finished_req_ids: '= has(vars.ems.finished_req_ids) ? vars.ems.finished_req_ids : []'
  - return:
      req_ids: = vars.s.value.req_ids
      sampled_token_ids: = vars.s.value.sampled_token_ids
- component: gpu-model-runner
  name: sample
  kind: function
  summary: 'GPUModelRunner.sample: logits for the sampled rows, grammar bitmask, then the sampler (no drafts) or
    the rejection sampler (drafts).'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:1592-1677
  latency_ms: 0
  request:
    type: object
    properties:
      batch:
        type: array
      num_drafts:
        type: integer
      grammar_output:
        type:
        - object
        - 'null'
  response:
    type: object
    properties:
      req_ids:
        type: array
      sampled_token_ids:
        type: array
  behavior:
  - if: config['enable-batch-sharded-sampling']
    then:
    - title: Shard sampling across TP ranks
      source: vllm/v1/worker/gpu/model_runner.py:1600-1611
      call: batch-sharder.shard-sampler-inputs
      input:
        num_reqs: = size(input.batch)
        req_ids: = input.batch.map(b, b.req_id)
        idx_mapping: = input.batch.map(b, b.slot)
        cu_num_logits: = lists.range(size(input.batch) + 1).map(j, j + sum(input.batch.slice(0, j).map(b, size(b.drafts))))
      as: shard
    - title: Each rank samples only its owned requests, and the all-gather restores every request's tokens in batch
        order; the model's stand-in tokens are per request, so the gathered result equals sampling every row
      source: vllm/v1/worker/gpu/model_runner.py:1655-1675
      set:
        ctx.local_sampled_reqs: = vars.shard.value.local_batch.req_ids
  - title: The loaded model's compute_logits
    source: vllm/v1/worker/gpu/model_runner.py:1610-1615
    call: '= (has(state.model_component) && state.model_component != '''' ? state.model_component : (has(state.model.architecture)
      && state.model.architecture.startsWith(''Mixtral'') ? ''mixtral-for-causal-lm'' : (has(state.model.architecture)
      && state.model.architecture.startsWith(''Qwen2VL'') ? ''qwen2-vl-for-conditional-generation'' : ''llama-for-causal-lm'')))
      + ''.compute-logits'''
    targets:
    - llama-for-causal-lm.compute-logits
    - mixtral-for-causal-lm.compute-logits
    - qwen2-vl-for-conditional-generation.compute-logits
    input:
      num_tokens: = size(input.batch) + input.num_drafts
  - set:
      vars.allowed: {}
  - if: input.grammar_output != null && has(input.grammar_output.structured_output_request_ids)
    then:
    - title: Apply the grammar bitmask in place
      source: vllm/v1/worker/gpu/model_runner.py:1618-1631
      call: structured-outputs-worker.apply-grammar-bitmask
      input:
        structured_output_request_ids: = input.grammar_output.structured_output_request_ids
        batch_req_ids: = input.batch.map(b, b.req_id)
        grammar_ids: '= has(input.grammar_output.grammar_ids) ? input.grammar_output.grammar_ids : []'
        eos_token_id: '= has(state.model.eos_token_id) ? state.model.eos_token_id : 128009'
      as: gm
    - set:
        vars.allowed: '= has(vars.gm.value.allowed) ? vars.gm.value.allowed : {}'
  - set:
      vars.rows0: '= input.batch.map(b, {''req_id'': b.req_id, ''slot'': b.slot, ''is_final'': b.nct + b.n >= b.prefill_len,
        ''drafts'': b.drafts, ''prompt_hash'': b.prompt_hash, ''seq_len'': b.nct + b.n, ''prompt_len'': b.prompt_len,
        ''eos_token_id'': has(state.model.eos_token_id) ? state.model.eos_token_id : 128009, ''context_token_ids'':
        (b.req_id in input.new_reqs && has(input.new_reqs[b.req_id].prefill_token_ids) && has(input.new_reqs[b.req_id].prompt_len))
        ? input.new_reqs[b.req_id].prefill_token_ids.slice(input.new_reqs[b.req_id].prompt_len, size(input.new_reqs[b.req_id].prefill_token_ids))
        : []})'
  - set:
      vars.rows: '= vars.rows0.map(r, r.req_id in vars.allowed ? merge(r, {''grammar'': vars.allowed[r.req_id]})
        : r)'
  - if: input.num_drafts == 0
    then:
    - call: sampler.sample
      input:
        rows: = vars.rows
      as: out
    else:
    - title: Rejection sampling for speculative decoding
      source: vllm/v1/worker/gpu/model_runner.py:1643-1652
      call: rejection-sampler.sample
      input:
        rows: = vars.rows
      as: out
  - if: config['enable-batch-sharded-sampling']
    then:
    - call: batch-sharder.gather-sampler-output
      input:
        num_reqs: = size(input.batch)
  - return: = vars.out.value
- component: gpu-model-runner
  name: take-draft-token-ids
  kind: function
  summary: 'take_draft_token_ids -> DraftTokensHandler.get_draft_tokens: the last batch''s request ids with their
    drafts when the batch had structured-output requests (copied back for grammar validation), else num_draft_tokens
    -1 placeholders per request, because V2 keeps the real drafts GPU-resident for the next step''s verification.
    Before any spec step it is DraftTokenIds([], []).'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:2282-2283
  - vllm/v1/worker/gpu/spec_decode/utils.py:47-92
  latency_ms: 0
  response:
    type:
    - object
    - 'null'
    properties:
      req_ids:
        type: array
      draft_token_ids:
        type: array
  behavior:
  - if: '!has(state.draft_handler) || state.draft_handler == null'
    then:
    - title: A fresh handler holds no requests
      source: vllm/v1/worker/gpu/spec_decode/utils.py:54-56
      return:
        req_ids: []
        draft_token_ids: []
  - set:
      vars.h: = state.draft_handler
  - if: vars.h.structured
    then:
    - title: Structured outputs need the real drafts for grammar validation
      source: vllm/v1/worker/gpu/spec_decode/utils.py:84-86
      return:
        req_ids: = vars.h.req_ids
        draft_token_ids: '= vars.h.req_ids.map(id, id in state.draft_tokens ? state.draft_tokens[id].slice(0, vars.h.num_draft_tokens)
          : [])'
  - title: 'Otherwise -1 placeholders: the scheduler only learns how many drafts to schedule'
    source: vllm/v1/worker/gpu/spec_decode/utils.py:87-91
    return:
      req_ids: = vars.h.req_ids
      draft_token_ids: = vars.h.req_ids.map(id, lists.range(vars.h.num_draft_tokens).map(j, -1))
- component: gpu-model-runner
  name: pool
  kind: function
  summary: 'pool: for pooling models, runs the pooling runner on the kept hidden states and post-updates num_computed_tokens.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:2287-2327
  latency_ms: 0
  response:
    anyOf:
    - $ref: ModelRunnerOutput
    - type: 'null'
  behavior:
  - if: state.execute_model_state == null
    then:
    - return: null
  - set:
      vars.ems: = state.execute_model_state
  - set:
      state.execute_model_state: null
  - call: pooling-runner.pool
    input:
      req_ids: = vars.ems.batch.map(b, b.req_id)
    as: p
  - source: vllm/v1/worker/gpu/model_runner.py:2326
    call: input-batch.post-update-num-computed-tokens-kernel
    input:
      num_rows: = size(vars.ems.batch)
  - return:
      req_ids: = vars.ems.batch.map(b, b.req_id)
      sampled_token_ids: = vars.ems.batch.map(b, [])
      pooler_output: = vars.p.value.pooler_output
- component: attn-utils
  name: get-kv-cache-spec
  kind: function
  summary: 'get_kv_cache_spec: one full-attention spec per layer; page size = 2 (K and V) * block_size * kv heads
    per TP rank * head size * dtype bytes.'
  sources:
  - vllm/v1/worker/gpu/attn_utils.py:139-194
  latency_ms: 0
  request:
    type: object
    properties:
      num_hidden_layers:
        type: integer
      num_kv_heads:
        type: integer
      head_size:
        type: integer
      dtype_bytes:
        type: integer
      use_mla:
        type: boolean
        default: false
      kv_cache_dtype:
        type: string
        default: auto
        description: cache_config.cache_dtype (--kv-cache-dtype)
  response:
    type: object
    properties:
      num_layers:
        type: integer
      block_size:
        type: integer
      num_kv_heads_per_rank:
        type: integer
      page_size_bytes:
        type: integer
      spec:
        type: object
      cache_dtype_str:
        type: string
      kv_quant_mode:
        type: string
      kv_dtype_bytes:
        type: integer
  behavior:
  - if: has(input.use_mla) && input.use_mla
    then:
    - title: 'Each layer''s own get_kv_cache_spec: an MLA layer builds an MLAAttentionSpec with its cache dtype
        (attention''s MLAAttention)'
      source: vllm/v1/worker/gpu/attn_utils.py:149-152
      call: mla-attention.get-kv-cache-spec
      input:
        kv_cache_dtype: = config['kv-cache-dtype']
        head_size: = input.head_size
        model_dtype_bytes: = input.dtype_bytes
      as: mla
    - return:
        num_layers: = input.num_hidden_layers
        block_size: = int(config['block-size'])
        num_kv_heads_per_rank: 1
        page_size_bytes: = vars.mla.value.page_size_bytes
        spec:
          type: mla_attention
        cache_dtype_str: = vars.mla.value.cache_dtype_str
        kv_quant_mode: = vars.mla.value.kv_quant_mode
  - set:
      vars.kvh: '= input.num_kv_heads >= int(config[''tensor-parallel-size'']) ? input.num_kv_heads / int(config[''tensor-parallel-size''])
        : 1'
      vars.cd: '= has(input.kv_cache_dtype) && input.kv_cache_dtype != null ? input.kv_cache_dtype : ''auto'''
  - title: 'The layer''s KV dtype: auto keeps the model dtype; any other cache dtype maps through STR_DTYPE_TO_TORCH_DTYPE
      (fp8, fp8_e4m3, fp8_e5m2, int8 and the packed formats are 1-byte uint8/int8 storage)'
    source: vllm/model_executor/layers/attention/attention.py:323-325
    set:
      vars.db: '= vars.cd == ''auto'' ? input.dtype_bytes : (vars.cd in [''float32'', ''float''] ? 4 : (vars.cd
        in [''half'', ''float16'', ''bfloat16''] ? 2 : 1))'
  - title: Each decoder layer reports a FullAttentionSpec (block_size, this rank's KV heads, head size, kv_cache_torch_dtype)
    source: vllm/model_executor/layers/attention/attention.py:640-646
    set:
      vars.spec: '= {''type'': ''full_attention'', ''block_size'': int(config[''block-size'']), ''num_kv_heads'':
        vars.kvh, ''head_size'': input.head_size, ''dtype_bytes'': vars.db, ''cache_dtype_str'': vars.cd}'
  - title: page_size_bytes = 2 (K and V) * block_size * num_kv_heads * head_size * dtype size
    source: vllm/v1/kv_cache_interface.py:544-553
    return:
      num_layers: = input.num_hidden_layers
      block_size: = int(config['block-size'])
      num_kv_heads_per_rank: = vars.kvh
      page_size_bytes: = 2 * int(config['block-size']) * vars.kvh * input.head_size * vars.db
      spec: = vars.spec
      cache_dtype_str: = vars.cd
      kv_dtype_bytes: = vars.db
- component: attn-utils
  name: init-kv-cache
  kind: function
  summary: 'init_kv_cache: only the backing allocation runs inside the allocation context (the CuMem kv_cache pool
    under sleep mode, or the KV connector''s pool): each layer''s KV tensor of num_blocks pages, or with HiSparse
    the device caches plus their host-pool binding. Shared-KV layers then alias their target''s tensor, and the
    caches are mapped to kernel blocks and bound to the attention layers outside the context.'
  sources:
  - vllm/v1/worker/gpu/attn_utils.py:396-443
  latency_ms: 0
  request:
    type: object
    properties:
      num_blocks:
        type: integer
      page_size_bytes:
        type: integer
      num_layers:
        type: integer
      allocation_pool:
        type:
        - string
        - 'null'
        default: null
  response:
    type: object
    properties:
      kv_cache_bytes:
        type: integer
      allocated_in_pool:
        type:
        - string
        - 'null'
      bound_in_pool:
        type:
        - string
        - 'null'
      hisparse:
        type: boolean
  behavior:
  - set:
      vars.pool: '= has(input.allocation_pool) ? input.allocation_pool : null'
  - if: config['hisparse-enabled']
    then:
    - title: 'Inside the allocation context: HiSparse (vllm/v1/hisparse/binding.py, scheduler-kv''s code) allocates
        the device caches and binds them to its host pool'
      source: vllm/v1/worker/gpu/attn_utils.py:409-418
      call: gpu-memory.allocate
      input:
        kind: kv_cache
        bytes: = input.num_blocks * input.page_size_bytes * input.num_layers
        pool: = vars.pool
      as: ha
    - set:
        vars.bytes: = vars.ha.value.bytes
    else:
    - title: 'Inside the allocation context: only the backing KV tensors are allocated (one layer-outermost KVCacheTensor
        holding every layer)'
      source: vllm/v1/worker/gpu/attn_utils.py:419-425
      call: worker-utils.allocate-kv-cache
      input:
        kv_cache_tensors:
        - size: = input.num_blocks * input.page_size_bytes * input.num_layers
          layers: = lists.range(input.num_layers).map(l, 'model.layers.' + string(l) + '.self_attn.attn')
        pool: = vars.pool
      as: a
    - set:
        vars.bytes: = vars.a.value.bytes
  - title: 'Outside the context: shared-KV layers alias their target, the caches are mapped to kernel blocks and
      bound to the attention layers'
    source: vllm/v1/worker/gpu/attn_utils.py:426-443
    set:
      vars.bound_pool: null
  - return:
      kv_cache_bytes: = vars.bytes
      allocated_in_pool: = vars.pool
      bound_in_pool: = vars.bound_pool
      hisparse: = config['hisparse-enabled']
- component: cuda-graph-manager
  name: init
  kind: function
  summary: 'ModelCudaGraphManager construction: capture sizes [1, 2, 4] + 8..248 step 8 + 256..max step 16, max
    = min(max_num_seqs * decode_query_len * 2, 512) unless set; FULL descriptors for uniform decode, PIECEWISE for
    mixed batches (FULL_AND_PIECEWISE); none with enforce_eager or mode NONE.'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:251-390
  - vllm/config/vllm.py:2354-2363
  latency_ms: 0
  request:
    type: object
    properties:
      decode_query_len:
        type: integer
      cudagraph_mode:
        type:
        - string
        - 'null'
        default: null
        description: the mode resolve_cudagraph_mode_and_sizes returned; None reads compilation_config.cudagraph_mode
  response:
    type: object
    properties:
      cudagraph_mode:
        type: string
      max_capture_size:
        type: integer
  behavior:
  - set:
      vars.mode: '= config[''enforce-eager''] ? ''NONE'' : (has(input.cudagraph_mode) && input.cudagraph_mode !=
        null ? input.cudagraph_mode : config[''cudagraph-mode''])'
  - call: gpu-memory.snapshot
    input: {}
    as: dev
  - title: 'The default ceiling: min(max_num_seqs * decode_query_len * 2, 512), or 1024 on the Blackwell (SM 10.x)
      family'
    source: vllm/config/vllm.py:2354-2363
    set:
      vars.ceil: '= vars.dev.value.compute_capability.startsWith(''10.'') ? 1024 : 512'
  - set:
      vars.max: '= int(config[''max-cudagraph-capture-size'']) > 0 ? int(config[''max-cudagraph-capture-size''])
        : (int(config[''max-num-seqs'']) * input.decode_query_len * 2 < vars.ceil ? int(config[''max-num-seqs''])
        * input.decode_query_len * 2 : vars.ceil)'
  - set:
      state.mode: = vars.mode
      state.decode_query_len: = input.decode_query_len
      state.capture_sizes: '= vars.mode == ''NONE'' ? [] : ([1, 2, 4] + lists.range(31).map(i, 8 * (i + 1)) + lists.range(49).map(i,
        256 + 16 * i)).filter(s, s <= vars.max)'
      state.graphs_captured: false
      state.full_graphs: {}
  - return:
      cudagraph_mode: = vars.mode
      max_capture_size: '= vars.mode == ''NONE'' ? 0 : vars.max'
- component: cuda-graph-manager
  name: dispatch
  kind: function
  summary: 'CudaGraphManager.dispatch: the smallest captured size >= num_tokens; a uniform decode batch gets the
    FULL decode graph, any other batch the mixed-mode (PIECEWISE) graph; eager (NONE) when forced, not captured,
    or larger than the largest capture size.'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:518-548
  - vllm/v1/worker/gpu/dp_utils.py:213-288
  - vllm/v1/worker/gpu/cudagraph_utils.py:65-80
  latency_ms: 0
  request:
    type: object
    properties:
      num_reqs:
        type: integer
      num_tokens:
        type: integer
      uniform_token_count:
        type: integer
      need_eager:
        type: boolean
  response:
    type: object
    properties:
      cg_mode:
        type: string
      num_tokens:
        type: integer
      max_capture_size:
        type: integer
  behavior:
  - set:
      vars.mode: '= has(state.mode) ? state.mode : (config[''enforce-eager''] ? ''NONE'' : config[''cudagraph-mode''])'
      vars.fits: = state.capture_sizes.filter(s, s >= input.num_tokens)
      vars.maxcap: '= size(state.capture_sizes) > 0 ? state.capture_sizes[size(state.capture_sizes) - 1] : 0'
  - if: input.need_eager || !state.graphs_captured || vars.mode == 'NONE' || size(vars.fits) == 0
    then:
    - title: Eager (no graph for this batch)
      source: vllm/v1/worker/gpu/cudagraph_utils.py:541-548
      return:
        cg_mode: NONE
        num_tokens: = input.num_tokens
        max_capture_size: = vars.maxcap
  - set:
      vars.padded: = vars.fits[0]
      vars.dql: '= has(state.decode_query_len) ? state.decode_query_len : 1'
  - if: input.uniform_token_count == vars.dql && vars.mode in ['FULL_AND_PIECEWISE', 'FULL_DECODE_ONLY', 'FULL']
      && input.num_tokens <= int(config['max-num-seqs']) * vars.dql
    then:
    - title: Uniform decode batch replays the FULL decode graph
      source: vllm/v1/worker/gpu/cudagraph_utils.py:302-334
      return:
        cg_mode: FULL
        num_tokens: = vars.padded
        max_capture_size: = vars.maxcap
  - if: vars.mode == 'FULL_DECODE_ONLY'
    then:
    - return:
        cg_mode: NONE
        num_tokens: = input.num_tokens
        max_capture_size: = vars.maxcap
  - title: Mixed batch uses the mixed-mode graph
    source: vllm/v1/worker/gpu/cudagraph_utils.py:346-365
    return:
      cg_mode: '= vars.mode == ''FULL'' ? ''FULL'' : ''PIECEWISE'''
      num_tokens: = vars.padded
      max_capture_size: = vars.maxcap
- component: cuda-graph-manager
  name: capture
  kind: function
  summary: Captures every descriptor (largest first) through dummy runs and records the graph pool's memory.
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:419-510
  - vllm/v1/worker/gpu/cudagraph_utils.py:606-665
  latency_ms: 0
  request:
    type: object
    properties:
      max_full_descs_to_capture:
        type:
        - integer
        - 'null'
        default: null
        description: 'profiling only: capture this many of the largest FULL graphs'
  response:
    type: object
    properties:
      captured:
        type: boolean
      bytes:
        type: integer
      num_sizes:
        type: integer
      num_full_captured:
        type: integer
      num_piecewise_captured:
        type: integer
  behavior:
  - if: '!has(state.mode) || state.mode == ''NONE'' || size(state.capture_sizes) == 0'
    then:
    - return:
        captured: false
        bytes: 0
        num_sizes: 0
        num_full_captured: 0
        num_piecewise_captured: 0
  - title: 'Descriptors per mode, largest first: FULL decode graphs up to max_num_reqs * decode_query_len tokens
      (every size when the mixed mode is FULL too), PIECEWISE graphs at every size'
    source: vllm/v1/worker/gpu/cudagraph_utils.py:302-370
    set:
      vars.dql: '= has(state.decode_query_len) ? state.decode_query_len : 1'
      vars.desc_sizes: = state.capture_sizes.sortBy(x, -x)
  - set:
      vars.full: '= state.mode == ''FULL'' ? vars.desc_sizes : (state.mode in [''FULL_AND_PIECEWISE'', ''FULL_DECODE_ONLY'']
        ? vars.desc_sizes.filter(n, n <= int(config[''max-num-seqs'']) * vars.dql && n % vars.dql == 0) : [])'
      vars.pw: '= state.mode in [''PIECEWISE'', ''FULL_AND_PIECEWISE''] ? vars.desc_sizes : []'
  - title: Profiling captures only a sample of the largest FULL graphs (_max_full_descs_to_capture)
    source: vllm/v1/worker/gpu/cudagraph_utils.py:445-453
    when: has(input.max_full_descs_to_capture) && input.max_full_descs_to_capture != null && size(vars.full) > input.max_full_descs_to_capture
    set:
      vars.full: = vars.full.slice(0, input.max_full_descs_to_capture)
  - title: PIECEWISE first (larger activations), each a warmup then a capture through the compiled model's piecewise
      wrappers
    source: vllm/v1/worker/gpu/cudagraph_utils.py:439-472
    set:
      state.piecewise_captured: = vars.pw
  - title: 'Then FULL: for each descriptor a warmup, then capture_pool points NCCL''s graph allocator at the pool
      and torch.cuda.graph records the forward'
    source: vllm/v1/worker/gpu/cudagraph_utils.py:473-505
    foreach: = vars.full
    as: n
    max: 1000
    steps:
    - call: cuda-graph-manager.capture-pool
      input:
        pool: '= has(state.pool) && state.pool != null ? state.pool : ''global'''
    - call: cuda-graph-manager.capture-cuda-graph
      input:
        num_tokens: = vars.n
        num_reqs: '= state.mode == ''FULL'' ? (vars.n < int(config[''max-num-seqs'']) ? vars.n : int(config[''max-num-seqs'']))
          : vars.n / vars.dql'
  - title: The graph pool's memory (assumed constant for the 8B model)
    source: vllm/v1/worker/gpu/model_runner.py:1121-1124
    call: gpu-memory.allocate
    input:
      kind: cudagraph
      bytes: = int(config['worker-runner-cudagraph-memory-bytes'])
    as: a
  - set:
      state.graphs_captured: true
  - return:
      captured: true
      bytes: = vars.a.value.bytes
      num_sizes: = size(state.capture_sizes)
      num_full_captured: = size(vars.full)
      num_piecewise_captured: = size(vars.pw)
- component: cuda-graph-manager
  name: capture-pool
  kind: function
  summary: 'capture_pool: yields the pool to capture into (the CuMem graph pool when sleep mode offloads graph memory)
    and first points NCCL''s graph allocator at it (pynccl_allocator.set_graph_pool_id).'
  sources:
  - vllm/compilation/cudagraph_pool.py:33-45
  latency_ms: 0
  request:
    type: object
    properties:
      pool:
        type:
        - string
        - 'null'
        default: null
  response:
    type: object
    properties:
      graph_pool_id:
        type: string
  behavior:
  - title: set_graph_pool_id(pool or the platform's graph pool handle)
    source: vllm/compilation/cudagraph_pool.py:44-45
    set:
      state.graph_pool_id: '= has(input.pool) && input.pool != null ? input.pool : ''global'''
  - return:
      graph_pool_id: = state.graph_pool_id
- component: cuda-graph-manager
  name: capture-cuda-graph
  kind: function
  summary: 'One FULL descriptor''s capture: a fresh-attention-state forward recorded inside torch.cuda.graph(graph,
    pool), on the pool capture_pool set; the graph is stored under its descriptor.'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:476-505
  latency_ms: 0
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - num_tokens
    properties:
      num_tokens:
        type: integer
      num_reqs:
        type: integer
  response:
    type: object
    properties:
      num_tokens:
        type: integer
      graph_pool_id:
        type:
        - string
        - 'null'
  behavior:
  - set:
      vars.key: = string(input.num_tokens)
  - if: has(state.full_graphs) && vars.key in state.full_graphs
    then:
    - source: vllm/v1/worker/gpu/cudagraph_utils.py:481-483
      fail:
        code: assertion-error
        status: 0
        message: '= ''Graph already captured for BatchExecutionDescriptor(cg_mode=<CUDAGraphMode.FULL: 2>, num_tokens=''
          + vars.key + '')'''
  - set:
      state.full_graphs: '= merge(has(state.full_graphs) ? state.full_graphs : {}, {vars.key: has(state.graph_pool_id)
        ? state.graph_pool_id : null})'
  - return:
      num_tokens: = input.num_tokens
      graph_pool_id: '= has(state.graph_pool_id) ? state.graph_pool_id : null'
- component: cuda-graph-manager
  name: needs-capture
  kind: function
  summary: 'needs_capture: whether any capture descriptor is left (none with mode NONE or no capture sizes).'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:408-409
  latency_ms: 0
  response:
    type: object
    properties:
      needs_capture:
        type: boolean
  behavior:
  - return:
      needs_capture: = has(state.mode) && state.mode != 'NONE' && has(state.capture_sizes) && size(state.capture_sizes)
        > 0
- component: cuda-graph-manager
  name: release
  kind: function
  summary: 'Dropping the runner''s CUDA graph manager (profiling teardown): its graphs and throwaway pool go with
    it.'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:1036-1037
  latency_ms: 0
  behavior:
  - set:
      state.graphs_captured: false
      state.full_graphs: {}
      state.piecewise_captured: []
- component: cuda-graph-manager
  name: run-fullgraph
  kind: function
  summary: 'run_fullgraph: syncs the offloader and replays the captured graph; no Python model call happens, so
    the model''s GPU time is accounted here.'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:550-563
  request:
    type: object
    properties:
      num_tokens:
        type: integer
      num_prefill_tokens:
        type: integer
      num_decode_reqs:
        type: integer
  latency_ms: '= double(config[''worker-runner-decode-base-ms'']) + double((has(input.num_prefill_tokens) ? input.num_prefill_tokens
    : 0) * int(config[''worker-runner-prefill-us-per-token'']) + (has(input.num_decode_reqs) ? input.num_decode_reqs
    : 0) * int(config[''worker-runner-decode-us-per-seq''])) / 1000.0'
  behavior:
  - if: '!state.graphs_captured'
    then:
    - fail:
        code: assertion-error
        status: 0
        message: No cudagraph for this descriptor
  - set:
      ctx.last_cg_mode: FULL
- component: cuda-graph-manager
  name: run-pw-graph
  kind: function
  summary: 'run_pw_graph: calls the torch-compiled model whose piecewise CUDA graphs replay between attention ops.'
  sources:
  - vllm/v1/worker/gpu/cudagraph_utils.py:571-576
  latency_ms: 0
  request:
    type: object
    properties:
      num_tokens:
        type: integer
      num_prefill_tokens:
        type: integer
      num_decode_reqs:
        type: integer
      model_component:
        type: string
        default: llama-for-causal-lm
        description: the loaded model's component (its architecture)
  behavior:
  - title: The compiled model is the loaded architecture's
    source: vllm/v1/worker/gpu/cudagraph_utils.py:571-576
    call: '= (has(input.model_component) ? input.model_component : ''llama-for-causal-lm'') + ''.forward'''
    targets:
    - llama-for-causal-lm.forward
    - mixtral-for-causal-lm.forward
    - qwen2-vl-for-conditional-generation.forward
    input:
      num_tokens: = input.num_tokens
      num_prefill_tokens: '= has(input.num_prefill_tokens) ? input.num_prefill_tokens : 0'
      num_decode_reqs: '= has(input.num_decode_reqs) ? input.num_decode_reqs : 0'
  - title: Launch overhead left between piecewise graphs (assumption)
    wait: = int(config['worker-runner-piecewise-launch-overhead-ms'])
  - set:
      ctx.last_cg_mode: PIECEWISE
- component: block-tables
  name: append-block-ids
  kind: function
  summary: 'BlockTables.append_block_ids: writes a request''s block ids into its slot''s row (overwrite for a new
    request, append for a running one''s new blocks). This is the worker''s device copy of the scheduler''s block
    table, refreshed from every SchedulerOutput.'
  sources:
  - vllm/v1/worker/gpu/block_table.py:110-129
  latency_ms: 0
  request:
    type: object
    required:
    - slot
    - block_ids
    properties:
      slot:
        type: integer
      block_ids:
        type: array
        items:
          type: integer
      overwrite:
        type: boolean
        default: false
  behavior:
  - set:
      vars.key: = string(input.slot)
  - if: input.overwrite || !(vars.key in state.rows)
    then:
    - set:
        state.rows: '= merge(state.rows, {vars.key: input.block_ids})'
    - return:
        row: = input.block_ids
  - set:
      state.rows: '= merge(state.rows, {vars.key: state.rows[vars.key] + input.block_ids})'
  - return:
      row: = state.rows[vars.key]
- component: block-tables
  name: gather-block-tables
  kind: function
  summary: 'BlockTables.gather_block_tables: gathers the scheduled slots'' rows (in batch order) into the attention
    input buffer.'
  sources:
  - vllm/v1/worker/gpu/block_table.py:145-172
  latency_ms: 0
  request:
    type: object
    properties:
      slots:
        type: array
        items:
          type: integer
  response:
    type: object
    properties:
      block_table:
        type: array
  behavior:
  - call: block-tables.gather-block-tables-kernel
    input:
      num_rows: = size(input.slots)
  - return:
      block_table: '= input.slots.map(s, string(s) in state.rows ? state.rows[string(s)] : [])'
- component: kv-block-zeroer
  name: init
  kind: function
  summary: 'KVBlockZeroer construction: segment addresses for every KV tensor.'
  sources:
  - vllm/v1/worker/gpu/model_runner.py:806-816
  latency_ms: 0
  request:
    type: object
    properties:
      num_blocks:
        type: integer
  behavior:
  - if: input.num_blocks <= 0
    then:
    - fail:
        code: value-error
        status: 0
        message: num_blocks must be positive
  - set:
      state.num_blocks: = input.num_blocks
- component: kv-block-zeroer
  name: zero-block-ids
  kind: function
  summary: 'zero_block_ids: one kernel zeroes the listed blocks in every KV tensor.'
  sources:
  - vllm/v1/worker/utils.py:232-260
  latency_ms: 0
  request:
    type: object
    properties:
      block_ids:
        type: array
        items:
          type: integer
  behavior:
  - if: size(input.block_ids) == 0
    then:
    - return:
        zeroed: 0
  - call: kv-block-zeroer.zero-kv-blocks-kernel
    input:
      num_rows: = size(input.block_ids)
  - return:
      zeroed: = size(input.block_ids)
- component: pp-handler
  name: init
  kind: function
  summary: 'PPHandler.__init__: non-last ranks pre-seed the receive FIFO with pp_size empty slots, so the first
    pp_size consumes are no-ops.'
  sources:
  - vllm/v1/worker/gpu/pp_utils.py:65-97
  latency_ms: 0
  request:
    type: object
    properties:
      is_last_rank:
        type: boolean
      pp_size:
        type: integer
  behavior:
  - if: input.is_last_rank
    then:
    - set:
        state.queue: []
    else:
    - set:
        state.queue: = lists.range(input.pp_size).map(i, null)
- component: pp-handler
  name: receive
  kind: function
  summary: 'PPHandler.receive (non-last rank): records a pending receive of the last rank''s broadcast in this step''s
    ring slot (it completes on a side stream); returns whether every request needs its sampled token next step.
    No request needing one leaves the slot empty.'
  sources:
  - vllm/v1/worker/gpu/pp_utils.py:189-245
  - vllm/v1/worker/gpu/pp_utils.py:38-53
  latency_ms: 0
  request:
    type: object
    properties:
      need_sampled:
        type: array
        items:
          type: boolean
  response:
    type: object
    properties:
      all_decode_next:
        type: boolean
      pending:
        type: boolean
  behavior:
  - if: '!input.need_sampled.exists(x, x)'
    then:
    - title: No sampled output needed; this step's slot stays None
      source: vllm/v1/worker/gpu/pp_utils.py:195-198
      return:
        all_decode_next: false
        pending: false
  - set:
      vars.entry:
        num_reqs: = size(input.need_sampled)
  - set:
      state.queue: '= size(state.queue) == 0 ? [vars.entry] : state.queue.slice(0, size(state.queue) - 1) + [vars.entry]'
  - return:
      all_decode_next: = input.need_sampled.all(x, x)
      pending: true
- component: pp-handler
  name: broadcast
  kind: function
  summary: 'PPHandler.broadcast (last rank): sends the sampled tokens (padded to 1 + num_spec) and num_sampled/num_rejected
    to the other PP ranks on the dedicated pp_broadcast group; skipped when no request needs them.'
  sources:
  - vllm/v1/worker/gpu/pp_utils.py:247-280
  latency_ms: 0
  request:
    type: object
    properties:
      need_sampled:
        type: array
      sampled_token_ids:
        type: array
      receivers:
        type: integer
  response:
    type: object
    properties:
      sent:
        type: boolean
  behavior:
  - if: '!input.need_sampled.exists(x, x)'
    then:
    - return:
        sent: false
  - foreach: = lists.range(input.receivers)
    as: r
    steps:
    - put: pp-sampled
      value:
        sampled_token_ids: = input.sampled_token_ids
  - return:
      sent: true
- component: pp-handler
  name: get-prev-sampled-outputs
  kind: function
  summary: 'PPHandler.get_prev_sampled_outputs (non-last rank): pops the entry from pp_size steps ago (re-reserving
    a slot) and, if it is a real receive, waits for the broadcast and returns the tokens for post-update.'
  sources:
  - vllm/v1/worker/gpu/pp_utils.py:125-170
  latency_ms: 0
  response:
    type:
    - object
    - 'null'
    properties:
      sampled_token_ids:
        type: array
  behavior:
  - if: size(state.queue) == 0
    then:
    - return: null
  - set:
      vars.slot: = state.queue[0]
  - set:
      state.queue: = state.queue.slice(1, size(state.queue)) + [null]
  - if: vars.slot == null
    then:
    - return: null
  - title: Wait for the broadcast this slot recorded
    source: vllm/v1/worker/gpu/pp_utils.py:152
    receive: pp-sampled
    as: got
    timeout_ms: 600000
  - call: input-batch.post-update-kernel
    input:
      num_rows: = vars.slot.num_reqs
  - return: = vars.got
- component: eplb-controller
  name: load
  kind: function
  summary: 'EPLBController around load_model: prepare_load creates the EplbState when enable_eplb; maybe_register_model
    adds the MoE model; maybe_start_async_loop starts the async rebalancer unless loading dummy weights.'
  sources:
  - vllm/v1/worker/gpu/eplb_utils.py:94-165
  latency_ms: 0
  request:
    type: object
    properties:
      is_moe:
        type: boolean
      load_dummy_weights:
        type: boolean
      model:
        type: string
  response:
    type: object
    properties:
      registered:
        type: boolean
      async_loop:
        type: boolean
  behavior:
  - if: '!config[''enable-eplb'']'
    then:
    - title: prepare_load leaves no state without enable_eplb
      source: vllm/v1/worker/gpu/eplb_utils.py:94-98
      return:
        registered: false
        async_loop: false
  - if: '!input.is_moe'
    then:
    - title: Not a mixture-of-experts model
      source: vllm/v1/worker/gpu/eplb_utils.py:145-147
      return:
        registered: false
        async_loop: false
  - title: Register the MoE model with the EPLB state
    source: vllm/v1/worker/gpu/eplb_utils.py:149-154
    call: eplb-state.add-model
    input:
      model: = input.model
  - if: input.model.contains('Mixtral')
    then:
    - title: 'add_model hands the model its EPLB tensors (model.set_eplb_state): initially each of the 8 logical
        experts maps to one physical expert'
      source: vllm/distributed/eplb/eplb_state.py:486-490
      call: mixtral-for-causal-lm.set-eplb-state
      input:
        logical_to_physical_map: = lists.range(8).map(e, [e])
        logical_replica_count: = lists.range(8).map(e, 1)
  - if: input.load_dummy_weights
    then:
    - return:
        registered: true
        async_loop: false
  - title: Start the async rebalancing loop (eplb_config.use_async defaults to True)
    source: vllm/v1/worker/gpu/eplb_utils.py:157-165
    call: eplb-state.start-async-loop
    input: {}
  - return:
      registered: true
      async_loop: true
- component: pcp-manager
  name: partition-batch
  kind: function
  summary: 'PCPManager.partition_batch: splits each request''s scheduled tokens across the PCP ranks (this rank
    keeps its share) and keeps the full batch as global_batch.'
  sources:
  - vllm/v1/worker/gpu/pcp_manager.py:434-470
  latency_ms: 0
  request:
    type: object
    properties:
      batch:
        type: array
      pcp_size:
        type: integer
  response:
    type: object
    properties:
      local_batch:
        type: array
  behavior:
  - set:
      state.global_batch: = input.batch
  - return:
      local_batch: '= input.batch.map(b, merge(b, {''n'': (b.n + input.pcp_size - 1) / input.pcp_size}))'
- component: pcp-manager
  name: global-batch
  kind: function
  summary: 'PCPManager.global_batch: the unpartitioned batch of the last partition_batch (asserted set).'
  sources:
  - vllm/v1/worker/gpu/pcp_manager.py:430-432
  latency_ms: 0
  response:
    type: object
    properties:
      batch:
        type: array
  behavior:
  - if: '!has(state.global_batch) || state.global_batch == null'
    then:
    - fail:
        code: assertion-error
        status: 0
        message: assert self._global_batch is not None
  - return:
      batch: = state.global_batch
- component: pcp-manager
  name: restore-for-sampling
  kind: function
  summary: 'PCPManager.restore_for_sampling: all-gathers the partitions'' hidden states back into the global batch
    order for sampling.'
  sources:
  - vllm/v1/worker/gpu/pcp_manager.py:818-829
  latency_ms: 0
  behavior:
  - if: '!has(state.global_batch) || state.global_batch == null'
    then:
    - fail:
        code: assertion-error
        status: 0
        message: assert self._global_batch is not None
  - return:
      num_reqs: = size(state.global_batch)
- component: sampler
  name: add-request
  kind: function
  summary: 'Sampler.add_request: stages temperature/top-k/top-p/min-p/seed/logprobs into the slot and asks each
    logits processor (logit bias, penalties, bad words, custom) and the thinking budget whether the slot needs logits
    processing.'
  sources:
  - vllm/v1/worker/gpu/sample/sampler.py:96-107
  - vllm/v1/worker/gpu/sample/states.py:41-71
  latency_ms: 0
  request:
    type: object
    required:
    - slot
    properties:
      slot:
        type: integer
        examples:
        - 127
      sampling_params:
        type: object
  response:
    type: object
    properties:
      needs_processing:
        type: boolean
  behavior:
  - set:
      vars.sp: '= has(input.sampling_params) ? input.sampling_params : {}'
  - set:
      vars.t: '= has(vars.sp.temperature) ? double(vars.sp.temperature) : 1.0'
      vars.top_p: '= has(vars.sp.top_p) ? double(vars.sp.top_p) : 1.0'
      vars.top_k: '= (has(vars.sp.top_k) && vars.sp.top_k > 0 && vars.sp.top_k <= state.vocab_size) ? vars.sp.top_k
        : state.vocab_size'
      vars.min_p: '= has(vars.sp.min_p) ? double(vars.sp.min_p) : 0.0'
  - set:
      vars.base: = vars.t != 0.0 && (vars.t != 1.0 || vars.min_p != 0.0 || vars.top_k != state.vocab_size || vars.top_p
        != 1.0)
      vars.penalties: = (has(vars.sp.repetition_penalty) && double(vars.sp.repetition_penalty) != 1.0) || (has(vars.sp.frequency_penalty)
        && double(vars.sp.frequency_penalty) != 0.0) || (has(vars.sp.presence_penalty) && double(vars.sp.presence_penalty)
        != 0.0)
      vars.logit_bias: = (has(vars.sp.logit_bias) && size(vars.sp.logit_bias) > 0) || (has(vars.sp.allowed_token_ids)
        && size(vars.sp.allowed_token_ids) > 0) || (has(vars.sp.min_tokens) && vars.sp.min_tokens > 0 && has(vars.sp.stop_token_ids)
        && size(vars.sp.stop_token_ids) > 0)
      vars.thinking: = has(vars.sp.thinking_token_budget)
  - if: vars.penalties
    then:
    - title: Count the prompt's tokens for penalties
      source: vllm/v1/worker/gpu/sample/penalties.py:62-80
      call: penalties-state.bincount-kernel
      input:
        num_rows: 1
  - title: Bad words are staged (or the slot's count reset to 0) on every add
    source: vllm/v1/worker/gpu/sample/sampler.py:101-102
    call: bad-words-state.add-request
    input:
      slot: = input.slot
      bad_words_token_ids: '= has(vars.sp.bad_words_token_ids) ? vars.sp.bad_words_token_ids : []'
    as: bw
  - set:
      vars.custom_needs: false
  - title: Each custom logits processor initializes its slot state and says whether it modifies this request's logits
    source: vllm/v1/worker/gpu/sample/sampler.py:101-102
    foreach: '= has(state.custom_processors) ? state.custom_processors : []'
    as: proc
    steps:
    - call: custom-logits-processor.add-request
      input:
        processor: = vars.proc
        slot: = input.slot
        sampling_params: = vars.sp
      as: cp
    - set:
        vars.custom_needs: = vars.custom_needs || vars.cp.value.modifies_logits
  - set:
      vars.needs: = vars.base || vars.penalties || vars.logit_bias || vars.thinking || vars.bw.value.uses_bad_words
        || vars.custom_needs
  - set:
      state.slots: '= merge(state.slots, {string(input.slot): {''temperature'': vars.t, ''top_p'': vars.top_p, ''top_k'':
        vars.top_k, ''min_p'': vars.min_p, ''min_tokens'': has(vars.sp.min_tokens) && vars.sp.min_tokens != null
        ? int(vars.sp.min_tokens) : 0, ''seeded'': has(vars.sp.seed) && vars.sp.seed != null, ''seed'': has(vars.sp.seed)
        && vars.sp.seed != null ? int(vars.sp.seed) : 0, ''logprobs'': has(vars.sp.logprobs) && vars.sp.logprobs
        != null ? int(vars.sp.logprobs) : -1, ''penalties'': vars.penalties, ''logit_bias'': vars.logit_bias, ''thinking'':
        vars.thinking, ''needs_processing'': vars.needs}})'
  - return:
      needs_processing: = vars.needs
- component: sampler
  name: sample
  kind: function
  summary: 'Sampler.__call__: (NaN count) -> logits processors when any row needs them (logit bias, penalties, bad
    words, custom, thinking budget) -> temperature -> min_p -> top-k/top-p -> Gumbel-max sample (FlashInfer when
    eligible) -> logprobs -> per-request sampled counts (a chunked prefill that has not finished samples nothing).'
  sources:
  - vllm/v1/worker/gpu/sample/sampler.py:134-224
  - vllm/v1/worker/gpu/sample/sampler.py:226-356
  - vllm/v1/worker/gpu/sample/output.py:16-23
  latency_ms: 0
  request:
    type: object
    properties:
      rows:
        type: array
  response:
    type: object
    properties:
      req_ids:
        type: array
      sampled_token_ids:
        type: array
      masked:
        type: array
  behavior:
  - if: input.rows.exists(r, !(string(r.slot) in state.slots))
    then:
    - fail:
        code: key-error
        status: 0
        message: = 'no sampling state for slot ' + string(input.rows.filter(r, !(string(r.slot) in state.slots))[0].slot)
  - set:
      vars.p: = input.rows.map(r, state.slots[string(r.slot)])
  - if: config['vllm-compute-nans-in-logits']
    then:
    - title: Count NaNs before any processing
      source: vllm/v1/worker/gpu/sample/sampler.py:148-150
      call: gpu-logits-metrics.num-nans-kernel
      input:
        num_rows: = size(input.rows)
  - title: Logits processors, thinking budget, temperature and min_p (top-k/top-p is applied below, with the sampling)
    source: vllm/v1/worker/gpu/sample/sampler.py:289-299
    call: sampler.apply-sampling-params
    input:
      rows: = input.rows
      skip_top_k_top_p: true
    as: asp
  - set:
      vars.masked: = vars.asp.value.masked
  - title: The fused (FlashInfer) sampler is used only when some row uses top-k/top-p, no row is greedy or has an
      explicit seed, and no returned logprobs need post-processed logits; FlashInfer itself is off with return_sampling_mask
      or VLLM_USE_FLASHINFER_SAMPLER=0
    source: vllm/v1/worker/gpu/sample/sampler.py:304-316
    set:
      vars.fused: = !config['return-sampling-mask'] && config['vllm-use-flashinfer-sampler'] && vars.p.exists(s,
        s.top_k < state.vocab_size || s.top_p < 1.0) && !(vars.p.exists(s, s.logprobs != null && s.logprobs >= 0)
        && config['logprobs-mode'] in ['processed_logprobs', 'processed_logits']) && !vars.p.exists(s, s.temperature
        == 0.0) && !vars.p.exists(s, s.seeded)
  - if: vars.fused && !config['watermark-enabled']
    then:
    - title: FlashInfer top-k/top-p sampling from the processed logits (statistically, not bitwise, equal to the
        Gumbel path)
      source: vllm/v1/worker/gpu/sample/sampler.py:337-341
      call: topk-topp-sampler.flashinfer-sample
      input:
        num_rows: = size(input.rows)
        topk_enabled: = vars.p.exists(s, s.top_k < state.vocab_size)
        topp_enabled: = vars.p.exists(s, s.top_p < 1.0)
    else:
    - if: vars.p.exists(s, s.top_k < state.vocab_size || s.top_p < 1.0)
      then:
      - title: Top-k / top-p truncation (Triton)
        source: vllm/v1/worker/gpu/sample/sampler.py:345
        call: topk-topp-triton.apply-top-k-top-p
        input:
          batch_size: = size(input.rows)
          topk_enabled: = vars.p.exists(s, s.top_k < state.vocab_size)
          topp_enabled: = vars.p.exists(s, s.top_p < 1.0)
    - if: config['watermark-enabled']
      then:
      - call: gpu-watermark-sampler.sample
        input:
          num_rows: = size(input.rows)
      else:
      - title: Gumbel-max sampling (argmax at temperature 0, per-request seeds)
        source: vllm/v1/worker/gpu/sample/sampler.py:346-355
        call: gumbel.gumbel-sample-kernel
        input:
          num_rows: = size(input.rows)
  - if: config['enable-trace-replay']
    then:
    - call: trace-replay-state.apply-trace
      input:
        num_rows: = size(input.rows)
  - if: vars.p.exists(s, s.logprobs != null && s.logprobs >= 0)
    then:
    - title: Top-k logprobs and the sampled token's rank, from the raw logits unless logprobs_mode is processed_*
      source: vllm/v1/worker/gpu/sample/sampler.py:171-186
      call: logprob.compute-topk-scores
      input:
        num_rows: = size(input.rows)
        num_logprobs: '= vars.p.map(s, s.logprobs != null ? s.logprobs : -1).sortBy(x, -x)[0]'
        logprobs_mode: = config['logprobs-mode']
  - title: One token per request; unfinished prefill chunks sample none
    source: vllm/v1/worker/gpu/sample/sampler.py:190-199
    call: input-batch.get-num-sampled-and-rejected-kernel
    input:
      num_rows: = size(input.rows)
  - if: config['return-sampling-mask']
    then:
    - call: sampling-mask-tensors.compact-sampling-mask-kernel
      input:
        num_rows: = size(input.rows)
  - return:
      req_ids: = input.rows.map(r, r.req_id)
      sampled_token_ids: '= lists.range(size(input.rows)).map(i, !input.rows[i].is_final ? [] : [vars.asp.value.tokens[i][0]])'
      masked: = vars.masked
- component: sampler
  name: apply-sampling-params
  kind: function
  summary: 'Sampler.apply_sampling_params: when any row needs processing, copies the logits to FP32, builds the
    step''s LogitsContext and runs the logits processors in order (logit bias and min_tokens, penalties, bad words,
    then custom processors), the thinking-budget forcing last, then temperature and min_p, and top-k/top-p unless
    skipped. The rejection sampler calls it for the target''s logits too. The model holds no logits, so it returns,
    for each logits row, the token the processed logits would yield (a labeled stand-in; -1 for a chunked prefill
    that samples nothing): the model''s EOS at the request''s natural output length (masked until min_tokens), else
    a deterministic token for greedy or seeded rows and a random one otherwise.'
  sources:
  - vllm/v1/worker/gpu/sample/sampler.py:226-276
  - vllm/v1/worker/gpu/sample/logits_processor/interface.py:63-89
  latency_ms: 0
  request:
    type: object
    properties:
      rows:
        type: array
        description: 'one per request: slot, prompt_hash, prompt_len, eos_token_id, drafts, seq_len, and positions
          (the sequence length each logits row samples at; default [seq_len])'
      skip_top_k_top_p:
        type: boolean
        default: false
  response:
    type: object
    properties:
      tokens:
        type: array
        items:
          type: array
          items:
            type: integer
      greedy:
        type: array
        items:
          type: boolean
      masked:
        type: array
  behavior:
  - set:
      vars.p: '= input.rows.map(r, string(r.slot) in state.slots ? state.slots[string(r.slot)] : {''temperature'':
        1.0, ''top_p'': 1.0, ''top_k'': state.vocab_size, ''min_p'': 0.0, ''min_tokens'': 0, ''seeded'': false,
        ''seed'': 0, ''logprobs'': -1, ''penalties'': false, ''logit_bias'': false, ''thinking'': false, ''needs_processing'':
        false})'
      vars.masked: []
  - if: vars.p.exists(s, s.needs_processing)
    then:
    - title: 'LogitsContext: this step''s row -> slot mapping, positions and input ids, passed to every processor''s
        apply()'
      source: vllm/v1/worker/gpu/sample/sampler.py:242-250
      set:
        vars.ctx:
          idx_mapping: = input.rows.map(r, r.slot)
          expanded_idx_mapping: '= input.rows.map(r, (has(r.drafts) ? lists.range(size(r.drafts) + 1) : [0]).map(j,
            r.slot)).flatten()'
    - title: Logits processors in pipeline order (bias adds, penalties scale, then bad words)
      source: vllm/v1/worker/gpu/sample/sampler.py:254-256
      when: vars.p.exists(s, s.logit_bias)
      call: logit-bias-state.bias-kernel
      input:
        num_rows: = size(input.rows)
    - when: vars.p.exists(s, s.penalties)
      call: penalties-state.penalties-kernel
      input:
        num_rows: = size(input.rows)
    - call: bad-words-state.apply
      input:
        rows: = input.rows
      as: bw
    - set:
        vars.masked: = vars.bw.value.masked
    - title: Custom logits processors run after the built-in stages
      source: vllm/v1/worker/gpu/sample/sampler.py:254-256
      foreach: '= has(state.custom_processors) ? state.custom_processors : []'
      as: proc
      steps:
      - call: custom-logits-processor.apply
        input:
          processor: = vars.proc
          ctx: = vars.ctx
    - title: Thinking-budget forcing runs last
      source: vllm/v1/worker/gpu/sample/sampler.py:258-260
      when: vars.p.exists(s, s.thinking)
      call: thinking-budget-state.apply
      input:
        num_rows: = size(input.rows)
    - title: Temperature, skipped when every row is 0 or 1
      source: vllm/v1/worker/gpu/sample/states.py:79-93
      when: vars.p.exists(s, s.temperature != 0.0 && s.temperature != 1.0)
      call: gumbel.temperature-kernel
      input:
        num_rows: = size(input.rows)
    - title: min_p
      source: vllm/v1/worker/gpu/sample/sampler.py:267-268
      when: vars.p.exists(s, s.min_p != 0.0)
      call: min-p.min-p-kernel
      input:
        num_rows: = size(input.rows)
    - if: '!(has(input.skip_top_k_top_p) && input.skip_top_k_top_p) && vars.p.exists(s, s.top_k < state.vocab_size
        || s.top_p < 1.0)'
      then:
      - title: Top-k / top-p (the rejection sampler's path; the sampler applies it while sampling)
        source: vllm/v1/worker/gpu/sample/sampler.py:273-276
        call: topk-topp-triton.apply-top-k-top-p
        input:
          batch_size: = size(input.rows)
          topk_enabled: = vars.p.exists(s, s.top_k < state.vocab_size)
          topp_enabled: = vars.p.exists(s, s.top_p < 1.0)
  - set:
      vars.pos: '= input.rows.map(r, has(r.positions) ? r.positions : [has(r.seq_len) ? r.seq_len : -1])'
  - title: Where the model would emit EOS
    detail: The model holds no logits, so each request has a natural output length, base + prompt_hash % spread
      tokens (labeled assumption), at which the sampled token is the model's EOS. min_tokens keeps EOS masked (LogitBiasState
      masks the stop ids while seq_len < prompt_len + min_tokens) until enough tokens exist; ignore_eos does not
      change sampling, only the scheduler's stop check.
    source: vllm/v1/worker/gpu/sample/logit_bias.py:96-112
    set:
      vars.eos: '= lists.range(size(input.rows)).map(i, vars.pos[i].map(s, s >= 0 && has(input.rows[i].prompt_len)
        && s - input.rows[i].prompt_len >= int(config[''worker-runner-natural-output-tokens-base'']) + (has(input.rows[i].prompt_hash)
        ? input.rows[i].prompt_hash : 0) % int(config[''worker-runner-natural-output-tokens-spread'']) - 1 && s
        - input.rows[i].prompt_len >= (has(vars.p[i].min_tokens) ? vars.p[i].min_tokens : 0)))'
  - title: Token values stand in for logits
    detail: 'A greedy row (temperature 0: plain argmax in the Gumbel kernel) or a seeded row gets a deterministic
      token from the request''s prompt and the position (plus the seed for a seeded random row only: at temperature
      0 the kernel skips the noise, so the seed has no effect, gumbel.py:182-198), so identical requests produce
      identical outputs and a greedy target''s verdict on a draft is reproducible; an unseeded random row gets a
      seeded-per-run random token.'
    source: vllm/v1/worker/gpu/sample/gumbel.py:21-44
    return:
      tokens: '= lists.range(size(input.rows)).map(i, lists.range(size(vars.pos[i])).map(j, (has(input.rows[i].is_final)
        && !input.rows[i].is_final) ? -1 : (!has(input.rows[i].grammar) ? (vars.eos[i][j] ? (has(input.rows[i].eos_token_id)
        ? input.rows[i].eos_token_id : 128009) : ((vars.p[i].temperature == 0.0 || vars.p[i].seeded) ? ((has(input.rows[i].prompt_hash)
        ? input.rows[i].prompt_hash : 0) * 31 + (vars.pos[i][j] >= 0 ? vars.pos[i][j] : 0) * 7919 + (vars.p[i].temperature
        != 0.0 && has(vars.p[i].seed) ? vars.p[i].seed % 1000003 : 0)) % 127900 + 100 : random(127900) + 100)) :
        ((vars.eos[i][j] && input.rows[i].grammar.stop) ? (has(input.rows[i].eos_token_id) ? input.rows[i].eos_token_id
        : 128009) : (input.rows[i].grammar.content ? ((vars.p[i].temperature == 0.0 || vars.p[i].seeded) ? ((has(input.rows[i].prompt_hash)
        ? input.rows[i].prompt_hash : 0) * 31 + (vars.pos[i][j] >= 0 ? vars.pos[i][j] : 0) * 7919 + (vars.p[i].temperature
        != 0.0 && has(vars.p[i].seed) ? vars.p[i].seed % 1000003 : 0)) % 127900 + 100 : random(127900) + 100) :
        (input.rows[i].grammar.quote ? 1 : (input.rows[i].grammar.stop ? (has(input.rows[i].eos_token_id) ? input.rows[i].eos_token_id
        : 128009) : ((vars.p[i].temperature == 0.0 || vars.p[i].seeded) ? ((has(input.rows[i].prompt_hash) ? input.rows[i].prompt_hash
        : 0) * 31 + (vars.pos[i][j] >= 0 ? vars.pos[i][j] : 0) * 7919 + (vars.p[i].temperature != 0.0 && has(vars.p[i].seed)
        ? vars.p[i].seed % 1000003 : 0)) % 127900 + 100 : random(127900) + 100))))))))'
      greedy: = vars.p.map(s, s.temperature == 0.0)
      masked: = vars.masked
- component: sampler
  name: apply-staged-writes
  kind: function
  summary: 'Sampler.apply_staged_writes: flushes the sampling states, every logits processor''s staged writes (built-in
    and custom), the thinking-budget, logprob-token-id and trace-replay states.'
  sources:
  - vllm/v1/worker/gpu/sample/sampler.py:109-116
  latency_ms: 0
  response:
    type: object
    properties:
      flushed:
        type: array
        items:
          type: string
  behavior:
  - call: staged-write-tensor.apply-write-kernel
    input:
      num_rows: 1
  - title: Each custom processor flushes what its add_request staged
    source: vllm/v1/worker/gpu/sample/sampler.py:111-112
    foreach: '= has(state.custom_processors) ? state.custom_processors : []'
    as: proc
    steps:
    - call: custom-logits-processor.apply-staged-writes
      input:
        processor: = vars.proc
  - return:
      flushed: '= [''sampling_states''] + (has(state.custom_processors) ? state.custom_processors : [])'
- component: bad-words-state
  name: add-request
  kind: function
  summary: 'BadWordsState.add_request: no bad words resets the slot''s count to 0 (so a recycled slot stops masking);
    otherwise flattens them with offsets, rejecting more than VLLM_MAX_NUM_BAD_WORDS words or VLLM_MAX_BAD_WORDS_TOTAL_TOKENS
    tokens.'
  sources:
  - vllm/v1/worker/gpu/sample/bad_words.py:40-71
  latency_ms: 0
  errors:
  - code: value-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - slot
    properties:
      slot:
        type: integer
        examples:
        - 127
      bad_words_token_ids:
        type: array
        items:
          type: array
          items:
            type: integer
  response:
    type: object
    properties:
      uses_bad_words:
        type: boolean
  behavior:
  - set:
      vars.key: = string(input.slot)
  - if: '!has(input.bad_words_token_ids) || size(input.bad_words_token_ids) == 0'
    then:
    - title: No bad words, the slot's count is overwritten with 0
      source: vllm/v1/worker/gpu/sample/bad_words.py:41-44
      set:
        state.num_bad_words: '= merge(state.num_bad_words, {vars.key: 0})'
    - return:
        uses_bad_words: false
  - if: size(input.bad_words_token_ids) > int(config['vllm-max-num-bad-words'])
    then:
    - title: Too many bad words
      source: vllm/v1/worker/gpu/sample/bad_words.py:46-52
      fail:
        code: value-error
        status: 0
        message: '= ''Too many bad words: '' + string(size(input.bad_words_token_ids)) + ''. The max number is ''
          + string(int(config["vllm-max-num-bad-words"])) + ''.'''
  - set:
      vars.total: = sum(input.bad_words_token_ids.map(w, size(w)))
  - if: vars.total > int(config['vllm-max-bad-words-total-tokens'])
    then:
    - title: Too many total bad-word tokens
      source: vllm/v1/worker/gpu/sample/bad_words.py:61-66
      fail:
        code: value-error
        status: 0
        message: '= ''Too many total bad word tokens: '' + string(vars.total) + ''. The max is '' + string(int(config["vllm-max-bad-words-total-tokens"]))
          + ''.'''
  - title: Stage flattened tokens and offsets for the slot
    source: vllm/v1/worker/gpu/sample/bad_words.py:68-71
    set:
      state.bad_words: '= merge(state.bad_words, {vars.key: input.bad_words_token_ids})'
      state.num_bad_words: '= merge(state.num_bad_words, {vars.key: size(input.bad_words_token_ids)})'
  - return:
      uses_bad_words: true
- component: bad-words-state
  name: apply
  kind: function
  summary: 'BadWordsState.apply: skips the kernel when no scheduled slot has bad words; else, for each logits row
    (local position p: committed output plus the first p drafts), masks a bad word''s last token when that context
    ends with the word''s prefix.'
  sources:
  - vllm/v1/worker/gpu/sample/bad_words.py:78-98
  - vllm/v1/worker/gpu/sample/bad_words.py:101-165
  latency_ms: 0
  request:
    type: object
    properties:
      rows:
        type: array
        items:
          type: object
          properties:
            slot:
              type: integer
            context_token_ids:
              type: array
              items:
                type: integer
            drafts:
              type: array
              items:
                type: integer
  response:
    type: object
    properties:
      masked:
        type: array
      kernel_launched:
        type: boolean
  behavior:
  - set:
      vars.counts: '= input.rows.map(r, string(r.slot) in state.num_bad_words ? state.num_bad_words[string(r.slot)]
        : 0)'
  - if: size(vars.counts) == 0 || vars.counts.sortBy(c, -c)[0] == 0
    then:
    - title: No request uses bad words, skip the kernel launch
      source: vllm/v1/worker/gpu/sample/bad_words.py:79-82
      return:
        masked: []
        kernel_launched: false
  - call: bad-words-state.bad-words-kernel
    input:
      num_rows: = size(input.rows)
  - set:
      vars.masked: '= input.rows.filter(r, string(r.slot) in state.num_bad_words && state.num_bad_words[string(r.slot)]
        > 0).map(r, lists.range((has(r.drafts) ? size(r.drafts) : 0) + 1).map(p, state.bad_words[string(r.slot)].filter(w,
        size(r.context_token_ids + (has(r.drafts) ? r.drafts : []).slice(0, p)) >= size(w) - 1 && (r.context_token_ids
        + (has(r.drafts) ? r.drafts : []).slice(0, p)).slice(size(r.context_token_ids) + p - (size(w) - 1), size(r.context_token_ids)
        + p) == w.slice(0, size(w) - 1)).map(w, {''slot'': r.slot, ''local_pos'': p, ''token'': w[size(w) - 1]}))).flatten().flatten()'
  - return:
      masked: = vars.masked
      kernel_launched: true
- component: thinking-budget-state
  name: apply
  kind: function
  summary: 'ThinkingBudgetState.apply: updates the committed-marker cache, then forces the end-of-thinking token
    for rows past their budget.'
  sources:
  - vllm/v1/worker/gpu/sample/thinking_budget.py:113-134
  - vllm/v1/worker/gpu/sample/thinking_budget.py:368-410
  latency_ms: 0
  behavior:
  - call: thinking-budget-state.update-committed-marker-cache-kernel
    input:
      num_rows: = input.num_rows
  - call: thinking-budget-state.thinking-budget-kernel
