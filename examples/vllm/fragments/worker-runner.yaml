- component: block-table
  name: get-block-table-width
  kind: function
  summary: 'get_block_table_width: the block-table row width rounded up so a row spans a multiple of token_alignment
    tokens (128 by default; None disables it): blocks are padded to a multiple of token_alignment / gcd(token_alignment,
    block_size); a non-positive alignment is a ValueError.'
  sources:
  - vllm/v1/worker/block_table.py:29-41
  latency_ms: 0
  errors:
  - code: value-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - max_num_blocks
    - block_size
    properties:
      max_num_blocks:
        type: integer
      block_size:
        type: integer
      token_alignment:
        type:
        - integer
        - 'null'
        default: 128
  response:
    type: object
    properties:
      width:
        type: integer
  behavior:
  - if: input.token_alignment == null
    then:
    - return:
        width: = input.max_num_blocks
  - if: input.token_alignment <= 0
    then:
    - source: vllm/v1/worker/block_table.py:37-38
      fail:
        code: value-error
        status: 0
        message: token_alignment must be positive
  - set:
      vars.g: = lists.range(input.token_alignment).map(d, d + 1).filter(d, input.token_alignment % d == 0 && input.block_size
        % d == 0).sortBy(d, -d)[0]
  - set:
      vars.align: = input.token_alignment / vars.g
  - title: Pad the row to a multiple of the block alignment
    source: vllm/v1/worker/block_table.py:39-40
    return:
      width: = (input.max_num_blocks + vars.align - 1) / vars.align * vars.align
