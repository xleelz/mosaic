  behavior:
  - call: batch-sharder.pack-sampler-output-kernel
    input:
      num_rows: = input.num_reqs
  - call: batch-sharder.unpack-gathered-output-kernel
    input:
      num_rows: = input.num_reqs
  - call: batch-sharder.pack-logprobs-kernel
    input:
      num_rows: = input.num_reqs
  - call: batch-sharder.unpack-logprobs-kernel
    input:
      num_rows: = input.num_reqs
- component: logits-processor-loader
  name: build-custom-logits-processors
  kind: function
  summary: 'build_custom_logits_processors (V2): pooling models reject custom processors; otherwise entry-point
    plugins (group vllm.logits_processors) load first and must be V2 LogitsProcessor subclasses, then the configured
    classes/FQCNs; each class is built with (vllm_config, LogitsProcRequestState).'
  sources:
  - vllm/v1/worker/gpu/sample/logits_processor/loader.py:156-183
  - vllm/v1/worker/gpu/sample/logits_processor/interface.py:27-60
  latency_ms: 0
  errors:
  - code: value-error
    status: 0
    retryable: false
  - code: runtime-error
    status: 0
    retryable: false
  request:
    type: object
    properties:
      is_pooling_model:
        type: boolean
        default: false
      max_num_reqs:
        type: integer
        examples:
        - 128
      custom:
        type: array
        items:
          type: object
          properties:
            kind:
              type: string
              enum:
              - class
              - fqcn
            name:
              type: string
  response:
    type: object
    properties:
      processors:
        type: array
        items:
          type: string
      req_state:
        type: object
  behavior:
  - if: input.is_pooling_model
    then:
    - if: size(input.custom) > 0
      then:
      - title: Pooling models reject custom logits processors
        source: vllm/v1/worker/gpu/sample/logits_processor/loader.py:172-174
        fail:
          code: value-error
          status: 0
          message: Custom logits processors are not supported for pooling models.
    - return:
        processors: []
        req_state: {}
  - set:
      vars.classes: []
  - title: Load installed plugins (entry_points group vllm.logits_processors)
    source: vllm/v1/worker/gpu/sample/logits_processor/loader.py:37-74
    foreach: = state.installed_plugins
    as: ep
    steps:
    - if: '!(vars.ep.value in state.classes)'
      then:
      - fail:
          code: runtime-error
          status: 0
          message: = 'Failed to load LogitsProcessor plugin ' + vars.ep.name
    - if: '!state.classes[vars.ep.value].is_type || !state.classes[vars.ep.value].v2'
      then:
      - title: V1-interface plugins are rejected by the V2 runner
        source: vllm/v1/worker/gpu/sample/logits_processor/loader.py:67-72
        fail:
          code: value-error
          status: 0
          message: = 'LogitsProcessor plugin ' + vars.ep.name + ' is not a subclass of vllm.v1.worker.gpu.sample.logits_processor.LogitsProcessor;
            V1-interface plugins are not supported by the V2 model runner.'
    - set:
        vars.classes: = vars.classes + [state.classes[vars.ep.value].cls]
  - title: Resolve the configured classes and FQCNs (<module>:<type>)
    source: vllm/v1/worker/gpu/sample/logits_processor/loader.py:77-133
    foreach: = input.custom
    as: lp
    steps:
    - if: vars.lp.kind == 'class'
      then:
      - if: '!(vars.lp.name in state.classes) || !state.classes[vars.lp.name].v2'
        then:
        - fail:
            code: value-error
            status: 0
            message: = vars.lp.name + ' is not a subclass of vllm.v1.worker.gpu.sample.logits_processor.LogitsProcessor'
      - set:
          vars.classes: = vars.classes + [state.classes[vars.lp.name].cls]
      - continue: true
    - if: size(vars.lp.name.split(':')) != 2
      then:
      - fail:
          code: value-error
          status: 0
          message: '= ''Invalid logits processor FQCN '' + vars.lp.name + ". Expected format: ''<module>:<type>''"'
    - if: '!(vars.lp.name in state.classes)'
      then:
      - fail:
          code: runtime-error
          status: 0
          message: = 'Failed to load logits processor plugin ' + vars.lp.name
    - if: '!state.classes[vars.lp.name].is_type'
      then:
      - fail:
          code: value-error
          status: 0
          message: Loaded logit processor must be a type.
    - if: '!state.classes[vars.lp.name].v2'
      then:
      - fail:
          code: value-error
          status: 0
          message: = state.classes[vars.lp.name].cls + ' is not a subclass of vllm.v1.worker.gpu.sample.logits_processor.LogitsProcessor'
    - set:
        vars.classes: = vars.classes + [state.classes[vars.lp.name].cls]
  - title: Construct each class with (vllm_config, LogitsProcRequestState)
    source: vllm/v1/worker/gpu/sample/logits_processor/loader.py:181-183
  - return:
      processors: = vars.classes
      req_state:
        max_num_reqs: = input.max_num_reqs
