- component: worker-utils
  name: select-common-block-size
  kind: function
  summary: 'select_common_block_size: the KV manager''s block size when every attention backend supports it (an
    exact size matches exactly, MultipleOf(n) accepts any multiple of n), else the largest explicit backend size
    dividing it that all backends support; none is a ValueError naming each backend''s sizes.'
  sources:
  - vllm/v1/worker/utils.py:489-561
  latency_ms: 0
  errors:
  - code: value-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - kv_manager_block_size
    - backends
    properties:
      kv_manager_block_size:
        type: integer
      backends:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            sizes:
              type: array
              items:
                type: integer
              default: []
            multiple_of:
              type: array
              items:
                type: integer
              default: []
  response:
    type: object
    properties:
      block_size:
        type: integer
  behavior:
  - title: 'Supported by a backend: an exact size equal to it, or a MultipleOf base dividing it'
    source: vllm/v1/worker/utils.py:499-512
    set:
      vars.ok: = lists.range(input.kv_manager_block_size + 1).map(b, b > 0 && input.backends.all(be, (has(be.sizes)
        && b in be.sizes) || (has(be.multiple_of) && be.multiple_of.exists(m, b % m == 0))))
  - if: vars.ok[input.kv_manager_block_size]
    then:
    - source: vllm/v1/worker/utils.py:538-539
      return:
        block_size: = input.kv_manager_block_size
  - set:
      vars.cands: '= input.backends.map(be, (has(be.sizes) ? be.sizes : []).filter(s, s > 0 && input.kv_manager_block_size
        % s == 0)).flatten().filter(s, vars.ok[s]).sortBy(s, -s)'
  - if: size(vars.cands) > 0
    then:
    - title: The largest explicit size dividing the manager's block size
      source: vllm/v1/worker/utils.py:541-553
      return:
        block_size: = vars.cands[0]
  - source: vllm/v1/worker/utils.py:554-561
    fail:
      code: value-error
      status: 0
      message: '= ''No common block size for '' + string(input.kv_manager_block_size) + '' ('' + input.backends.map(be,
        be.name + '': '' + (has(be.sizes) ? be.sizes : []).map(s, string(s)).join('', '')).join(''; '') + '').'''
