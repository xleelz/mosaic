- id: wr-v1-sampler-greedy-random-mixed
  name: 'V1 Sampler: an all-greedy batch takes the argmax and skips argmax-invariant processors; a mixed batch picks
    greedy or random per row by temperature'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: sampler-v1.forward
    caller: gpu-model-runner-v1
    input:
      sampling_metadata:
        all_greedy: true
        all_random: false
        max_num_logprobs: null
        temperatures:
        - 0.0
        - 0.0
      logitsprocs:
      - name: min_p
        argmax_invariant: true
      - name: logit_bias
        argmax_invariant: false
      greedy_tokens:
      - 11
      - 12
      random_tokens:
      - 21
      - 22
    as: g
  - interface: sampler-v1.forward
    caller: gpu-model-runner-v1
    input:
      sampling_metadata:
        all_greedy: false
        all_random: true
        max_num_logprobs: 2
        temperatures:
        - 0.7
        - 1.0
      logitsprocs:
      - name: min_p
        argmax_invariant: true
      greedy_tokens:
      - 11
      - 12
      random_tokens:
      - 21
      - 22
    as: r
  - interface: sampler-v1.forward
    caller: gpu-model-runner-v1
    input:
      sampling_metadata:
        all_greedy: false
        all_random: false
        max_num_logprobs: null
        temperatures:
        - 0.0
        - 0.9
      logitsprocs: []
      greedy_tokens:
      - 11
      - 12
      random_tokens:
      - 21
      - 22
    as: m
  - interface: sampler-v1.forward
    caller: gpu-model-runner-v1
    input:
      sampling_metadata:
        all_greedy: true
        all_random: true
        max_num_logprobs: null
        temperatures: []
      greedy_tokens: []
      random_tokens: []
    as: bad
  expect:
  - steps.g.result.value.path == 'greedy' && steps.g.result.value.sampled_token_ids == [11, 12] && steps.g.result.value.processors_applied
    == ['logit_bias']
  - steps.r.result.value.path == 'random' && steps.r.result.value.sampled_token_ids == [21, 22] && steps.r.result.value.has_logprobs
  - steps.m.result.value.path == 'mixed' && steps.m.result.value.sampled_token_ids == [11, 22]
  - '!steps.bad.result.ok && steps.bad.result.error.code == ''assertion-error'''
- id: wr-custom-logits-processor-lifecycle
  name: A custom V2 logits processor initializes each slot it is told about, can decline a request, flushes its
    staged writes every step and runs after the built-in stages
  fixtures:
