          top_k: 128256
          min_p: 0.0
          seeded: false
          seed: 0
          logprobs: -1
          penalties: false
          logit_bias: false
          thinking: false
          needs_processing: false
    cuda-graph-manager:
      decode_query_len: 4
  steps:
  - flow: wr-spec-decode-step
