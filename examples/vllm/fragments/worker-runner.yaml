- component: gpu-model-runner-v1
  name: gather-mm-embeddings
  kind: function
  summary: 'GPUModelRunner._gather_mm_embeddings (V1): for each request, the multimodal features overlapping [num_computed
    + shift, + num_scheduled) contribute their cached encoder output slice and set is_mm_embed over their positions.
    A missing encoder output is skipped only for a feature starting at or past the processed boundary (the drafter''s
    +1 look-ahead); any other miss raises RuntimeError(''Encoder cache miss for <hash>.'').'
  sources:
  - vllm/v1/worker/gpu_model_runner.py:3001-3111
  - vllm/multimodal/utils.py:122-142
  latency_ms: 0
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - reqs
    - total_num_scheduled_tokens
    properties:
      reqs:
        type: array
        items:
          type: object
          properties:
            req_id:
              type: string
            num_computed_tokens:
              type: integer
            num_scheduled_tokens:
              type: integer
            mm_features:
              type: array
              items:
                type: object
                properties:
                  identifier:
                    type: string
                  offset:
                    type: integer
                  length:
                    type: integer
      cached:
        type: array
        default: []
        items:
          type: string
      total_num_scheduled_tokens:
        type: integer
      shift_computed_tokens:
        type: integer
        default: 0
  response:
    type: object
    properties:
      mm_embeds:
        type: array
      is_mm_embed:
        type: array
  behavior:
  - set:
      vars.shift: '= has(input.shift_computed_tokens) ? input.shift_computed_tokens : 0'
      vars.cached: '= has(input.cached) ? input.cached : []'
      vars.embeds: []
      vars.mask: = lists.range(input.total_num_scheduled_tokens).map(i, false)
      vars.start: 0
  - foreach: = input.reqs
    as: r
    steps:
    - set:
        vars.nct: = vars.r.num_computed_tokens + vars.shift
        vars.n: = vars.r.num_scheduled_tokens
    - title: Features overlapping the window [num_computed, num_computed + num_scheduled)
      source: vllm/v1/worker/gpu_model_runner.py:3024-3029
      foreach: = vars.r.mm_features.filter(f, f.offset < vars.nct + vars.n && f.offset + f.length > vars.nct)
      as: f
      steps:
      - set:
          vars.si: '= vars.nct - vars.f.offset > 0 ? vars.nct - vars.f.offset : 0'
          vars.ei: '= vars.nct - vars.f.offset + vars.n < vars.f.length ? vars.nct - vars.f.offset + vars.n : vars.f.length'
      - if: '!(vars.f.identifier in vars.cached)'
        then:
        - if: vars.f.offset >= vars.r.num_computed_tokens + vars.n
          then:
          - title: 'A feature at or past the processed boundary is reached only by the drafter''s look-ahead: fall
              back to the token embedding'
            source: vllm/v1/worker/gpu_model_runner.py:3053-3061
            continue: true
        - source: vllm/v1/worker/gpu_model_runner.py:3062
          fail:
            code: runtime-error
            status: 0
            message: = 'Encoder cache miss for ' + vars.f.identifier + '.'
      - set:
          vars.rsp: = vars.start + vars.f.offset - vars.nct
      - source: vllm/v1/worker/gpu_model_runner.py:3070-3083
        set:
          vars.mask: = lists.range(size(vars.mask)).map(i, vars.mask[i] || (i >= vars.rsp + vars.si && i < vars.rsp
            + vars.ei))
          vars.embeds: '= vars.embeds + [{''identifier'': vars.f.identifier, ''start'': vars.si, ''end'': vars.ei}]'
    - set:
        vars.start: = vars.start + vars.n
  - return:
      mm_embeds: = vars.embeds
      is_mm_embed: = vars.mask
- component: gpu-worker-impl
  name: scoped-allocator-max-split
  kind: function
  summary: '_scoped_allocator_max_split: on the native CUDA/ROCm allocator, appends max_split_size_mb to the current
    allocator settings for the profiling pass (so a small allocation cannot be carved out of a freed multi-GiB block
    and pin its segment past empty_cache), and restores the original settings on exit; elsewhere it does nothing.'
  sources:
  - vllm/v1/worker/gpu_worker.py:406-433
  - vllm/v1/worker/gpu_worker.py:681-691
  latency_ms: 0
  request:
    type: object
    properties:
      max_split_size_mb:
        type: integer
        default: 20
      original_settings:
        type: string
        default: ''
        description: the allocator's settings string before the scope (PYTORCH_CUDA_ALLOC_CONF)
      native_allocator:
        type: boolean
        default: true
  response:
    type: object
    properties:
      settings_in_scope:
        type: string
      settings_after:
        type: string
  behavior:
  - set:
      vars.orig: '= has(input.original_settings) ? input.original_settings : '''''
  - if: has(input.native_allocator) && !input.native_allocator
    then:
    - title: 'Not the native allocator (or not CUDA-alike): the scope changes nothing'
      source: vllm/v1/worker/gpu_worker.py:409-414
      return:
        settings_in_scope: = vars.orig
        settings_after: = vars.orig
  - title: The setter resets options it is not given, so the original settings are kept as a prefix
    source: vllm/v1/worker/gpu_worker.py:424-430
    set:
      vars.prefix: '= vars.orig.trim().endsWith('','') ? vars.orig.trim().substring(0, size(vars.orig.trim()) -
        1) : vars.orig.trim()'
  - set:
      vars.scoped: '= (vars.prefix != '''' ? vars.prefix + '','' : '''') + ''max_split_size_mb:'' + string(has(input.max_split_size_mb)
        ? input.max_split_size_mb : 20)'
  - source: vllm/v1/worker/gpu_worker.py:432-433
    return:
      settings_in_scope: = vars.scoped
      settings_after: = vars.orig
