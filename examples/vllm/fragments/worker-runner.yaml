- component: topk-topp-triton
  name: apply-top-k-top-p
  kind: function
  summary: 'apply_top_k_top_p_triton: small batches (<= 64) with top-p only use the split-row pipeline; otherwise
    the monolithic kernel, followed by the split pipeline for top-p rows when both apply.'
  sources:
  - vllm/v1/sample/ops/topk_topp_triton.py:1613-1717
  - vllm/v1/sample/ops/topk_topp_sampler.py:460-470
  latency_ms: 0
  request:
    type: object
    properties:
      batch_size:
        type: integer
      topk_enabled:
        type: boolean
      topp_enabled:
        type: boolean
  response:
    type: object
    properties:
      path:
        type: string
  behavior:
  - set:
      vars.use_split: = input.topp_enabled && input.batch_size <= 64
  - if: vars.use_split && !input.topk_enabled
    then:
    - title: Split-row top-p pipeline only
      source: vllm/v1/sample/ops/topk_topp_triton.py:1671-1676
      call: topk-topp-triton.topp-split-kernels
      input:
        num_rows: = input.batch_size
    - return:
        path: split
  - call: topk-topp-triton.topk-topp-kernel
    input:
      num_rows: = input.batch_size
  - if: vars.use_split
    then:
    - call: topk-topp-triton.topp-split-kernels
      input:
        num_rows: = input.batch_size
    - return:
        path: monolithic+split
  - return:
      path: monolithic
- component: logprob
  name: compute-topk-scores
  kind: function
  summary: 'compute_topk_scores: log-softmax of the top-k (and requested) token ids plus the sampled token''s rank.'
  sources:
  - vllm/v1/worker/gpu/sample/logprob.py:111-190
  latency_ms: 0
  request:
    type: object
    properties:
      num_rows:
        type: integer
      num_logprobs:
        type: integer
      extra_token_ids:
        type: integer
        default: 0
      logprobs_mode:
        type: string
        default: raw_logprobs
        enum:
        - raw_logprobs
        - raw_logits
        - processed_logprobs
        - processed_logits
        description: 'model_config.logprobs_mode: the sampler passes processed logits for processed_*, and logits_mode
          for *_logits'
  response:
    type: object
    properties:
      num_logprobs:
        type: integer
      scores:
        type: string
        description: logprobs, or logits under a *_logits mode
      from_processed:
        type: boolean
  behavior:
  - set:
      vars.mode: '= has(input.logprobs_mode) && input.logprobs_mode != null ? input.logprobs_mode : ''raw_logprobs'''
  - if: vars.mode in ['raw_logits', 'processed_logits']
    then:
    - title: 'logits_mode: the scores are the gathered logits themselves, no log-softmax'
      source: vllm/v1/worker/gpu/sample/logprob.py:130-131
      set:
        vars.scores: logits
    else:
    - title: Log-softmax of the selected token ids
      source: vllm/v1/worker/gpu/sample/logprob.py:132-133
      call: logprob.topk-log-softmax-kernel
      input:
        num_rows: = input.num_rows
    - set:
        vars.scores: logprobs
  - call: logprob.ranks-kernel
    input:
      num_rows: = input.num_rows
  - if: has(input.extra_token_ids) && input.extra_token_ids > 0
    then:
    - call: logprob.fill-logprob-token-ids-kernel
      input:
        num_rows: = input.num_rows
  - return:
      num_logprobs: = input.num_logprobs
      scores: = vars.scores
      from_processed: = vars.mode.startsWith('processed')
- component: prompt-logprobs-worker
  name: compute-prompt-logprobs
  kind: function
  summary: 'compute_prompt_logprobs: only for new requests whose sampling params ask for prompt_logprobs (computed
    over their prefill chunk).'
  sources:
  - vllm/v1/worker/gpu/sample/prompt_logprob.py:120-230
  latency_ms: 0
  request:
    type: object
    properties:
      new_reqs:
        type: object
      model_component:
        type: string
        default: llama-for-causal-lm
        description: the loaded model's component
  response:
    type: object
    properties:
      req_ids:
        type: array
  behavior:
  - set:
      vars.ids: = input.new_reqs.map(k, k).filter(k, has(input.new_reqs[k].sampling_params) && has(input.new_reqs[k].sampling_params.prompt_logprobs)).sort()
  - if: size(vars.ids) == 0
    then:
    - return:
        req_ids: []
  - call: prompt-logprobs-worker.prompt-logprobs-token-ids-kernel
    input:
      num_rows: = size(vars.ids)
  - title: The loaded model's compute_logits over the prompt positions
    source: vllm/v1/worker/gpu/sample/prompt_logprob.py:150-175
    call: '= (has(input.model_component) ? input.model_component : ''llama-for-causal-lm'') + ''.compute-logits'''
    targets:
    - llama-for-causal-lm.compute-logits
    - mixtral-for-causal-lm.compute-logits
    - qwen2-vl-for-conditional-generation.compute-logits
    input:
      num_tokens: = size(vars.ids)
  - return:
