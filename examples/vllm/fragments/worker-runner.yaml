- id: wr-v1-input-batch-add-remove-condense
  name: 'V1 InputBatch: removed rows are refilled lowest first, condense moves the last live row into a hole, and
    SamplingMetadata follows the live requests'
  description: add_request takes the lowest freed row or appends (gpu_input_batch.py:320-343); remove_request leaves
    a hole (523-578); condense slides the last live row into the lowest hole (698-760); _make_sampling_metadata
    derives all_greedy/all_random, top-p/top-k and max_num_logprobs from the live sets (851-955, 1103-1144).
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: input-batch-v1.add-request
    caller: gpu-model-runner-v1
    input:
      req_id: a
      prompt_token_ids:
      - 1
      - 2
      - 3
      output_token_ids: []
      num_computed_tokens: 0
      sampling_params:
        temperature: 0.0
    as: a
  - interface: input-batch-v1.add-request
    caller: gpu-model-runner-v1
    input:
      req_id: b
      prompt_token_ids:
      - 1
      - 2
      output_token_ids:
      - 7
      num_computed_tokens: 0
      sampling_params:
        temperature: 0.8
        top_p: 0.9
        logprobs: 5
    as: b
  - interface: input-batch-v1.add-request
    caller: gpu-model-runner-v1
    input:
      req_id: c
      prompt_token_ids:
      - 4
      output_token_ids: []
      num_computed_tokens: 0
      sampling_params:
        temperature: 0.0
    as: c
  - interface: input-batch-v1.remove-request
    caller: gpu-model-runner-v1
    input:
      req_id: a
    as: ra
  - interface: input-batch-v1.remove-request
    caller: gpu-model-runner-v1
    input:
      req_id: zz
    as: rz
  - interface: input-batch-v1.make-sampling-metadata
    caller: gpu-model-runner-v1
    input: {}
    as: m1
  - interface: input-batch-v1.condense
    caller: gpu-model-runner-v1
    input: {}
    as: cd
  - interface: input-batch-v1.condense
    caller: gpu-model-runner-v1
    input: {}
    as: cd2
  - interface: input-batch-v1.add-request
    caller: gpu-model-runner-v1
    input:
      req_id: d
      prompt_token_ids:
      - 5
      - 6
      output_token_ids: []
      num_computed_tokens: 0
      sampling_params:
        temperature: 0.0
    as: d
  - interface: input-batch-v1.remove-request
    caller: gpu-model-runner-v1
    input:
      req_id: b
    as: rb
  - interface: input-batch-v1.make-sampling-metadata
    caller: gpu-model-runner-v1
    input: {}
    as: m2
  expect:
  - steps.a.result.value.req_index == 0 && steps.b.result.value.req_index == 1 && steps.c.result.value.req_index
    == 2 && steps.b.result.value.num_tokens == 3
  - steps.ra.result.value.req_index == 0 && steps.rz.result.value.req_index == null
  - steps.m1.result.value.num_reqs == 2 && !steps.m1.result.value.all_greedy && !steps.m1.result.value.all_random
    && steps.m1.result.value.has_top_p && steps.m1.result.value.max_num_logprobs == 5
  - 'steps.cd.result.value.req_ids == [''c'', ''b''] && steps.cd.result.value.moved == [{''req_id'': ''c'', ''from'':
    2, ''to'': 0}] && steps.cd2.result.value.moved == []'
  - steps.d.result.value.req_index == 2 && steps.m2.result.value.all_greedy && steps.m2.result.value.max_num_logprobs
    == null && steps.m2.result.value.num_reqs == 2
  - 'state[''input-batch-v1@rank0''].req_id_to_index == {''c'': 0, ''d'': 2} && state[''input-batch-v1@rank0''].removed
    == [1]'
