- component: workspace-manager
  name: get-simultaneous
  kind: function
  summary: 'WorkspaceManager.get_simultaneous: several views carved from one scratch buffer of the current (ubatch,
    lane) slot, each 256-byte aligned. A slot that is too small grows (only that slot), unless the manager is locked,
    which is an AssertionError; a lane beyond the configured ones is a RuntimeError.'
  sources:
  - vllm/v1/worker/workspace.py:123-130
  - vllm/v1/worker/workspace.py:182-275
  latency_ms: 0
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  - code: runtime-error
    status: 0
    retryable: false
  request:
    type: object
    required:
    - nbytes
    properties:
      nbytes:
        type: array
        items:
          type: integer
        description: each view's size in bytes
      ubatch:
        type: integer
        default: 0
      lane:
        type: integer
        default: 0
      caller:
        type: string
        default: unknown
        description: 'get_caller_info(): file:line:function of the first frame outside WorkspaceManager'
  response:
    type: object
    properties:
      offsets:
        type: array
      workspace_bytes:
        type: integer
      grew:
        type: boolean
  behavior:
  - call: workspace-manager.current
    input: {}
  - if: input.lane >= state.num_lanes
    then:
    - source: vllm/v1/worker/workspace.py:125-129
      fail:
        code: runtime-error
        status: 0
        message: = 'Workspace lane ' + string(input.lane) + ' is not configured; manager has ' + string(state.num_lanes)
          + ' lane(s).'
  - title: Each view is rounded up to 256 bytes; offsets accumulate
    source: vllm/v1/worker/workspace.py:194-199
    set:
      vars.aligned: = input.nbytes.map(b, (b + 255) / 256 * 256)
      vars.id: = input.ubatch * state.num_lanes + input.lane
  - set:
      vars.total: = sum(vars.aligned)
      vars.offsets: = lists.range(size(vars.aligned)).map(i, sum(vars.aligned.slice(0, i)))
  - if: state.sizes[vars.id] < vars.total
    then:
    - if: state.locked
      then:
      - title: No growth after locking
        source: vllm/v1/worker/workspace.py:241-247
        fail:
          code: assertion-error
          status: 0
          message: '= ''Workspace is locked but allocation from \'''' + (has(input.caller) ? input.caller : ''unknown'')
            + ''\'' requires '' + string((((vars.total) * 100 + 524288) / 1048576) / 100) + ''.'' + ((((vars.total)
            * 100 + 524288) / 1048576) % 100 < 10 ? ''0'' : '''') + string((((vars.total) * 100 + 524288) / 1048576)
            % 100) + '' MB, current size is '' + string((((state.sizes[vars.id]) * 100 + 524288) / 1048576) / 100)
            + ''.'' + ((((state.sizes[vars.id]) * 100 + 524288) / 1048576) % 100 < 10 ? ''0'' : '''') + string((((state.sizes[vars.id])
            * 100 + 524288) / 1048576) % 100) + '' MB. Workspace growth is not allowed after locking.'''
    - title: Only the requesting slot is resized
