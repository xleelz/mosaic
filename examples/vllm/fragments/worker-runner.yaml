- component: worker-profiler
  name: step
  kind: function
  summary: 'WorkerProfiler.step, once per worker step: counts active iterations, starts a delayed profiler on the
    delay-th one, counts recorded iterations while running, and stops itself (through stop(), resetting the counters)
    once more than max_iterations were recorded.'
  sources:
  - vllm/profiler/wrapper.py:130-164
  latency_ms: 0
  response:
    type: object
    properties:
      active:
        type: boolean
      running:
        type: boolean
      profiling_for_iters:
        type: integer
  behavior:
  - if: '!state.active'
    then:
    - return:
        active: false
        running: = state.running
        profiling_for_iters: = state.profiling_for_iters
  - set:
      state.active_iteration_count: = state.active_iteration_count + 1
  - if: '!state.running && state.delay_iters > 0 && state.active_iteration_count == state.delay_iters'
    then:
    - title: Starting profiler after delay
      source: vllm/profiler/wrapper.py:139-145
