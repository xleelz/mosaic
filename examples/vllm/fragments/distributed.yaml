    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}}}
    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-symm-mem-base-us']) + 2.0 * double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: symm-mem-communicator
