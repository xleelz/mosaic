      - "steps.second.result.ok && steps.second.result.value.num_external_tokens == 0 && !steps.second.result.value.load_async"
  - id: oracle-build-distributed-1
    name: "test_shm_buffer.py::TestSingleWriterShmRingBuffer::test_buffer_opening"
    description: "Create a 4096-byte ring buffer as the writer, then open it from its handle (size, name): the reader is not the writer and sees the same shared-memory name."
    flow: distributed-shm-ring-buffer
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: distributed-shm-ring-buffer, as: writer, input: {data_buffer_size: 4096, create: true}}
      - {flow: distributed-shm-ring-buffer, as: reader, input: {data_buffer_size: "= steps.writer.result.value.data_buffer_size", name: "= steps.writer.result.value.name", create: false}}
    expect:
