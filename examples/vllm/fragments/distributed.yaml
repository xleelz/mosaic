      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 16, hidden_size: 8192, dtype: int32}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 16, hidden_size: 8192, dtype: int32}}
