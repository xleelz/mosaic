    summary: "PyNcclCommunicator.all_reduce: ncclAllReduce on the current stream; returns None when disabled."
    sources: ["vllm/distributed/device_communicators/pynccl.py:268-299"]
    request: DistKernelLaunch
    response: {type: object, properties: {algorithm: {type: string}, out_none: {type: boolean}}}
    latency_ms: "= state.disabled ? 0.0 : (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-nccl-base-us']) + 2.0 * double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"
    behavior:
      - if: "state.disabled"
        then:
