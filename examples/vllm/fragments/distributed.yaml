  # ---- heterogeneous TP P/D (TransferTopology)
  - id: distributed-transfer-topology-hetero-tp
    name: "Decode TP 4 reading from prefill TP 2: ratio 2, rank 3 reads remote rank 1, each prefill rank waits for 2 readers; TP 2 reading TP 4 reads two ranks; 3 vs 2 is refused"
    fixtures: [tp1-llama-8b]
    steps:
      - {interface: transfer-topology.handshake-target-ranks, caller: gpu-worker, as: d, input: {tp_rank: 3, tp_size: 4, remote_tp_size: 2}}
      - {interface: transfer-topology.handshake-target-ranks, caller: gpu-worker, as: u, input: {tp_rank: 1, tp_size: 2, remote_tp_size: 4}}
      - {interface: transfer-topology.handshake-target-ranks, caller: gpu-worker, as: bad, input: {tp_rank: 0, tp_size: 3, remote_tp_size: 2}}
      - {interface: transfer-topology.handshake-target-ranks, caller: gpu-worker, as: dcp, input: {tp_rank: 1, tp_size: 2, dcp_size: 1, remote_tp_size: 4, remote_dcp_size: 4}}
      - {interface: transfer-topology.dcp-consumer-count, caller: gpu-worker, as: n, input: {tp_size: 4, remote_tp_size: 2}}
      - {interface: transfer-topology.block-size-ratio, caller: gpu-worker, as: b, input: {block_size: 16, remote_block_size: 32}}
      - {interface: transfer-topology.replicates-kv-cache, caller: gpu-worker, as: rep, input: {total_num_kv_heads: 8, tp_size: 4, remote_tp_size: 16}}
    expect:
      - "steps.d.result.value.tp_ratio == 2 && steps.d.result.value.ranks == [1]"
      - "steps.u.result.value.tp_ratio == -2 && steps.u.result.value.ranks == [2, 3]"
      - "steps.bad.result.error.code == 'assertion-error' && steps.bad.result.error.message == 'Local tensor parallel size 3 is not divisible by remote tensor parallel size 2.'"
      - "steps.dcp.result.value.ranks == [0, 1, 2, 3] && steps.n.result.value.count == 2"
      - "steps.b.result.error.message == 'Local block size 16 is not divisible by remote block size 32 or vice versa.'"
      - "steps.rep.result.value.remote_replicates && !steps.rep.result.value.local_replicates && steps.rep.result.value.local_physical_heads == 2"

