      - {flow: distributed-aux-routed-experts-capture, as: neg, input: {request_id: b, token_start: -1, rows: [[9]]}}
      - {flow: distributed-aux-routed-experts-capture, as: empty, input: {request_id: b, token_start: 0, rows: [[9]]}}
      - {interface: routed-experts-buffer.discard, caller: gpu-worker, as: drop, input: {request_id: a}}
      - {interface: routed-experts-buffer.discard, caller: gpu-worker, as: drop2, input: {request_id: a}}
      - {flow: distributed-aux-routed-experts-capture, as: again, input: {request_id: b, token_start: 0, rows: [[9]]}}
    expect:
      - "steps.init.result.value.num_slots == 1 && size(steps.full.result.value) == 1 && steps.full.result.value[0].rows == [[1], [2]]"
      - "steps.gap.result.error.message.contains('not contiguous') && steps.skip.result.error.message.contains('skipped an incomplete block') && steps.neg.result.error.code == 'value-error'"
      - "steps.empty.result.error.message == 'auxiliary output block pool is exhausted' && steps.drop.result.value.discarded && !steps.drop2.result.value.discarded"
      - "size(steps.again.result.value) == 0 && state['routed-experts-buffer@rank0'].requests['b'].length == 1"
  - id: distributed-nixl-push-notifs-cases
    name: Heartbeats extend leases, completions finish sends and receives, unknown requests count as after-expiry
    flow: distributed-nixl-push-notifs
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker:
        world_size: 1
        reqs_to_send: {p1: 0, p2: 0}
        reqs_to_process: [p1, p2]
        recving_metadata: {d1: {pp_size: 2}}
        completion_notifs: ["HB:p1,zz", "p1:1", "p2:2", "d1:1", "never-heard-of-you:1"]
    steps:
      - {flow: distributed-nixl-push-notifs, as: n1}
      - {flow: distributed-nixl-push-notifs, as: n2}
    expect:
      - "steps.n1.result.value.notified == ['p1'] && size(steps.n2.result.value.notified) == 0"
      - "state['nixl-push-connector-worker@rank0'].reqs_to_send.size() == 1 && state['nixl-push-connector-worker@rank0'].reqs_to_send['p2'] == 0 && state['nixl-push-connector-worker@rank0'].consumer_notification_counts == {'p2': 1, 'd1': 1}"
      - "state['nixl-push-connector-worker@rank0'].xfer_stats.num_notifications_after_expiry == [1] && size(state['nixl-push-connector-worker@rank0'].recving_transfers) == 0"
  - id: distributed-nixl-push-notifs-complete
    name: The second producer's notification completes the receive; the second consumer's completes the send
    flow: distributed-nixl-push-notifs
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker:
        world_size: 1
        reqs_to_send: {p2: 0}
        reqs_to_process: [p2]
        recving_metadata: {d1: {pp_size: 2}}
        consumer_notification_counts: {p2: 1, d1: 1}
        completion_notifs: ["p2:2", {kind: DONE, request_id: d1, tp_size: 1}]
    steps:
      - {flow: distributed-nixl-push-notifs, as: n}
    expect:
      - "steps.n.result.value.notified == ['p2']"
      - "state['nixl-push-connector-worker@rank0'].recving_transfers == {'d1': []} && size(state['nixl-push-connector-worker@rank0'].reqs_to_send) == 0"
  - id: distributed-nixl-push-notifs-then-results
    name: A drained completion becomes a finished receive in the next transfer results, and a finished send is queued for eviction
    flow: distributed-nixl-push-notifs
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker:
        world_size: 1
        reqs_to_send: {p1: 0}
        reqs_to_process: [p1]
        recving_metadata: {d1: {pp_size: 1}}
        completion_notifs: ["d1:1"]
    steps:
      - {flow: distributed-nixl-push-notifs, as: drain}
      - {flow: distributed-nixl-push-transfer-results, as: res}
      - {flow: distributed-nixl-push-transfer-results, as: again}
    expect:
      - "size(steps.drain.result.value.notified) == 0 && steps.res.result.value.finished_recving == ['d1'] && size(steps.again.result.value.finished_recving) == 0"
      - "size(state['nixl-push-connector-worker@rank0'].recving_transfers) == 0"
  - id: distributed-nixl-push-results-send-done
    name: The consumer's completion notification finishes the send and queues its eviction
    flow: distributed-nixl-push-transfer-results
    fixtures: [tp1-llama-8b]
    state:
      nixl-push-connector-worker: {world_size: 1, reqs_to_send: {p1: 0}, reqs_to_process: [p1], completion_notifs: ["p1:1"]}
    expect:
      - "result.value.finished_sending == ['p1'] && result.value.finished_recving == []"
      - "state['nixl-push-connector-worker@rank0'].evict_inbox == ['p1']"
  - id: distributed-mooncake-build-transfer-params-cases
    name: Contiguous runs coalesce; partial hits, broken runs, mismatches and Mamba null blocks
    flow: distributed-mooncake-build-transfer-params
    fixtures: [tp1-llama-8b]
    steps:
      - {flow: distributed-mooncake-build-transfer-params, as: one}
      - flow: distributed-mooncake-build-transfer-params
        as: many
        input:
          ready_reqs: [{d_req_id: d1, local_block_ids: [[3, 10, 11, 13]]}, {d_req_id: d2, local_block_ids: [[1], [2]]}, {d_req_id: d3, local_block_ids: [[5]]}, {d_req_id: d4, local_block_ids: [[6]]}]
          req_blocks: {d1: [[20, 21, 30]], d2: [[1]], d3: [[7, 8]], d4: [[]]}
      - flow: distributed-mooncake-build-transfer-params
        as: perblock
        input:
          local_region: {base_addr: 0, block_len: 4096, kv_block_len: 2048}
      - flow: distributed-mooncake-build-transfer-params
        as: mamba
        input:
          group_is_mamba: [true]
          ready_reqs: [{d_req_id: d1, local_block_ids: [[0, 0, 4]]}, {d_req_id: d2, local_block_ids: [[0]]}]
          req_blocks: {d1: [[0, 9]], d2: [[0]]}
    expect:
      - "steps.one.result.value.src == [1000000 + 10 * 2048] && steps.one.result.value.dst == [5000000 + 20 * 2048] && steps.one.result.value.lengths == [2 * 2048]"
      - "steps.many.result.value.src == [1000000 + 10 * 2048, 1000000 + 13 * 2048] && steps.many.result.value.lengths == [4096, 2048] && steps.many.result.value.dst == [5000000 + 20 * 2048, 5000000 + 30 * 2048]"
      - "steps.many.result.value.err_reqs == ['d2', 'd3'] && steps.many.result.value.err_msg == 'KV group count mismatch'"
      - "steps.perblock.result.value.src == [10 * 4096, 11 * 4096] && steps.perblock.result.value.lengths == [2048, 2048]"
      - "steps.mamba.result.value.src == [1000000 + 4 * 2048] && steps.mamba.result.value.dst == [5000000 + 9 * 2048]"
