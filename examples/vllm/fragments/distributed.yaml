  - id: distributed-all-reduce-concurrent-ranks
    name: Four ranks entering the TP all-reduce in any order all leave together with the same result
    description: >-
      Every TP rank calls tensor_model_parallel_all_reduce once; the collective completes only when
      all four have arrived (the rendezvous), so whatever order the ranks arrive in, each gets the same
      backend and result, and none finishes before the last arrival. Run under --explore.
    tags: [concurrency]
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
    invariants:
      - "[steps.r0, steps.r1, steps.r2, steps.r3].all(s, s.result.ok && s.result.value.backend == 'flashinfer' && s.result.value.bytes == 1048576)"
      - "[steps.r1, steps.r2, steps.r3].all(s, s.duration_us == steps.r0.duration_us)"
    expect:
      - "steps.r0.result.value == steps.r3.result.value"
