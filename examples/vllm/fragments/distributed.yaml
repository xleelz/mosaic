  - component: simple-cpu-offload-connector
    name: get-num-new-matched-tokens
    kind: function
    summary: "SimpleCPUOffloadScheduler.get_num_new_matched_tokens: past a block-aligned local hit, find the longest run of the request's remaining block hashes in the CPU cache (leaving the last token to recompute), pin it, and report it as an asynchronous external hit."
    sources: ["vllm/v1/simple_kv_offload/manager.py:338-393", "vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py:257-266"]
    request: DistKvRequest
    response: DistKvMatch
    behavior:
      - set:
          vars.hashes: "= has(input.block_hashes) && input.block_hashes != null ? input.block_hashes : []"
          vars.computed: "= has(input.num_computed_tokens) ? input.num_computed_tokens : 0"
          vars.ntok: "= has(input.num_prompt_tokens) ? input.num_prompt_tokens : 0"
      - title: Drop a stale pin from an earlier call for this request; remember its hashes for the store
        source: "vllm/v1/simple_kv_offload/manager.py:346-347"
        set:
          state.pending_hits: "= omit(state.pending_hits, input.request_id)"
          state.req_hashes: "= size(vars.hashes) > 0 ? merge(state.req_hashes, {input.request_id: vars.hashes}) : state.req_hashes"
      - if: "vars.computed % state.block_size != 0"
        then:
          - title: External loads start only at a scheduler-block boundary
            source: "vllm/v1/simple_kv_offload/manager.py:352-364"
            return: {num_external_tokens: 0, load_async: false}
      - set:
          vars.remaining: "= vars.hashes.slice(math.least(vars.computed / state.block_size, size(vars.hashes)), size(vars.hashes))"
          vars.max_hit: "= vars.ntok - 1 - vars.computed"
      - if: "size(vars.remaining) == 0 || vars.max_hit <= 0"
        then:
          - title: No hashes left to look up, or nothing beyond the token that must be recomputed
            source: "vllm/v1/simple_kv_offload/manager.py:366-375"
            return: {num_external_tokens: 0, load_async: false}
      - title: Longest consecutive run of CPU-cached hashes, capped below the last token
        source: "vllm/v1/simple_kv_offload/manager.py:376-378"
        set:
          vars.run: "= vars.remaining.exists(h, !(h in state.cpu_cache)) ? lists.range(size(vars.remaining)).filter(i, !(vars.remaining[i] in state.cpu_cache))[0] : size(vars.remaining)"
      - set:
          vars.hit: "= math.least(vars.run, vars.max_hit / state.block_size) * state.block_size"
      - if: "vars.hit > 0"
        then:
          - title: Pin the CPU blocks until update_state_after_alloc consumes them
            source: "vllm/v1/simple_kv_offload/manager.py:380-392"
            set:
              state.pending_hits: "= merge(state.pending_hits, {input.request_id: {'hashes': vars.remaining.slice(0, vars.hit / state.block_size), 'num_computed_tokens': vars.computed}})"
          - return: {num_external_tokens: "= vars.hit", load_async: true}
      - source: "vllm/v1/simple_kv_offload/manager.py:393"
        return: {num_external_tokens: 0, load_async: false}

  - component: simple-cpu-offload-connector
    name: update-state-after-alloc
    kind: function
    summary: "SimpleCPUOffloadScheduler.update_state_after_alloc: register the request for eager stores; with external tokens, turn the pinned CPU hit into a load of CPU blocks into the newly allocated GPU blocks after the local hit."
    sources: ["vllm/v1/simple_kv_offload/manager.py:395-506"]
    request: DistKvRequest
    response: {type: object, properties: {kv_transfer_params: {type: [object, "null"]}, recorded: {type: boolean}}}
    behavior:
      - set:
          vars.ext: "= has(input.num_external_tokens) ? input.num_external_tokens : 0"
          vars.groups: "= has(input.block_ids) && input.block_ids != null ? input.block_ids : [[]]"
      - if: "!state.lazy_mode && !(input.request_id in state.reqs_to_store)"
        then:
          - title: Eager mode tracks every request's computed blocks for storing
            source: "vllm/v1/simple_kv_offload/manager.py:404-410"
            set: {state.reqs_to_store: "= state.reqs_to_store + [input.request_id]"}
      - set:
          vars.pending: "= input.request_id in state.pending_hits ? state.pending_hits[input.request_id] : null"
          state.pending_hits: "= omit(state.pending_hits, input.request_id)"
      - if: "vars.ext == 0 || vars.pending == null"
        then:
          - title: No external tokens, or no pinned hit (a stale pin is released with a warning)
            source: "vllm/v1/simple_kv_offload/manager.py:412-433"
            return: {kv_transfer_params: null, recorded: false}
      - title: Load the hit's CPU blocks into the GPU blocks that follow the local hit
        source: "vllm/v1/simple_kv_offload/manager.py:434-506"
        set:
          vars.start: "= vars.pending.num_computed_tokens / state.block_size"
          vars.n: "= vars.ext / state.block_size"
      - set:
          state.reqs_to_load: "= merge(state.reqs_to_load, {input.request_id: {'gpu_block_ids': vars.groups[0].slice(math.least(vars.start, size(vars.groups[0])), math.least(vars.start + vars.n, size(vars.groups[0]))), 'cpu_hashes': vars.pending.hashes.slice(0, math.least(vars.n, size(vars.pending.hashes))), 'load_event': -1}})"
      - return: {kv_transfer_params: null, recorded: true}

  - component: simple-cpu-offload-connector
    name: request-finished
    kind: function
    summary: "SimpleCPUOffloadScheduler.request_finished: release any pin; in eager mode flush the finished request's computed full blocks into a pending store (they are freed on the GPU right away, protected by ref counts). Always returns (False, None)."
    sources: ["vllm/v1/simple_kv_offload/manager.py:1181-1213", "vllm/v1/simple_kv_offload/manager.py:1223-1255"]
    request: DistKvRequest
    response: DistKvFinished
    behavior:
      - set:
          state.pending_hits: "= omit(state.pending_hits, input.request_id)"
          vars.groups: "= has(input.block_ids) && input.block_ids != null ? input.block_ids : [[]]"
          vars.hashes: "= input.request_id in state.req_hashes ? state.req_hashes[input.request_id] : []"
          vars.computed: "= has(input.num_computed_tokens) ? input.num_computed_tokens : 0"
      - if: "!state.lazy_mode && input.request_id in state.reqs_to_store"
        then:
          - title: Finish-time flush of the request's computed full blocks not yet in the CPU cache
            source: "vllm/v1/simple_kv_offload/manager.py:1206-1212"
            set:
              vars.nfull: "= math.least([vars.computed / state.block_size, size(vars.hashes), size(vars.groups[0])])"
          - set:
              vars.new: "= lists.range(vars.nfull).filter(i, !(vars.hashes[i] in state.cpu_cache)).map(i, {'hash': vars.hashes[i], 'gpu_block': vars.groups[0][i]})"
          - set:
              state.pending_finished_stores: "= size(vars.new) > 0 ? state.pending_finished_stores + [{'request_id': input.request_id, 'blocks': vars.new}] : state.pending_finished_stores"
              state.reqs_to_store: "= state.reqs_to_store.filter(r, r != input.request_id)"
      - title: An in-flight load defers its cleanup; otherwise drop the load state
        source: "vllm/v1/simple_kv_offload/manager.py:1196-1203"
        set:
          state.reqs_to_load: "= input.request_id in state.reqs_to_load && state.reqs_to_load[input.request_id].load_event >= 0 ? state.reqs_to_load : omit(state.reqs_to_load, input.request_id)"
          state.req_hashes: "= omit(state.req_hashes, input.request_id)"
      - return: {delay_free_blocks: false, kv_transfer_params: null}

  - component: simple-cpu-offload-connector
    name: build-connector-meta
    kind: function
    summary: "SimpleCPUOffloadScheduler.build_connector_meta: one store event for the pending (finish-time) stores and one load event for the new loads; the worker copies GPU→CPU and CPU→GPU and reports both back."
    sources: ["vllm/v1/simple_kv_offload/manager.py:508-570"]
    request: {type: object, properties: {scheduled_new_reqs: {type: array}}}
    response: {type: object, properties: {store_event: {type: integer}, store_gpu_blocks: {type: array}, store_hashes: {type: array}, load_event: {type: integer}, load_gpu_blocks: {type: array}, load_hashes: {type: array}, load_event_to_reqs: {type: object}}}
    behavior:
      - set:
          vars.store: "= state.pending_finished_stores.map(t, t.blocks).flatten()"
          vars.loads: "= state.reqs_to_load.filter(r, state.reqs_to_load[r].load_event < 0)"
      - set:
          vars.room: "= state.num_cpu_blocks - size(state.cpu_cache)"
      - title: Store event for the pending finished stores (as many as fit the CPU pool)
        source: "vllm/v1/simple_kv_offload/manager.py:513-536"
        set:
          vars.store: "= vars.store.slice(0, math.least(size(vars.store), math.greatest(vars.room, 0)))"
      - set:
          vars.sev: "= size(vars.store) > 0 ? state.next_event : -1"
          vars.lev: "= size(vars.loads) > 0 ? state.next_event + 1 : -1"
          state.pending_finished_stores: []
      - set:
          state.store_events: "= vars.sev >= 0 ? merge(state.store_events, {string(vars.sev): vars.store}) : state.store_events"
          state.load_events: "= vars.lev >= 0 ? merge(state.load_events, {string(vars.lev): vars.loads}) : state.load_events"
          state.reqs_to_load: "= state.reqs_to_load.transformMapEntry(r, v, {r: vars.lev >= 0 && r in vars.loads ? merge(v, {'load_event': vars.lev}) : v})"
          state.next_event: "= state.next_event + 2"
      - title: Load event for the requests whose loads have not been sent yet
        source: "vllm/v1/simple_kv_offload/manager.py:538-570"
        return:
          store_event: "= vars.sev"
          store_gpu_blocks: "= vars.store.map(b, b.gpu_block)"
          store_hashes: "= vars.store.map(b, b.hash)"
          load_event: "= vars.lev"
          load_gpu_blocks: "= vars.loads.map(r, state.reqs_to_load[r].gpu_block_ids).flatten()"
          load_hashes: "= vars.loads.map(r, state.reqs_to_load[r].cpu_hashes).flatten()"
          load_event_to_reqs: "= vars.lev >= 0 ? {string(vars.lev): vars.loads} : {}"

  - component: simple-cpu-offload-connector
    name: update-connector-output
    kind: function
    summary: "SimpleCPUOffloadScheduler.update_connector_output: a completed store event caches its block hashes in the CPU pool; a completed load event releases its requests' load state (they leave WAITING_FOR_REMOTE_KVS through finished_recving)."
    sources: ["vllm/v1/simple_kv_offload/manager.py:1005-1163"]
    request: {type: object, properties: {finished_store_events: {type: array, items: {type: integer}}, finished_recving: {type: array, items: {type: string}}}}
    response: {type: object, properties: {cached: {type: integer}, loaded: {type: array}}}
    behavior:
      - set:
          vars.sevs: "= has(input.finished_store_events) ? input.finished_store_events.map(e, string(e)).filter(e, e in state.store_events) : []"
          vars.done: "= has(input.finished_recving) ? input.finished_recving.filter(r, r in state.reqs_to_load) : []"
      - set:
          vars.blocks: "= vars.sevs.map(e, state.store_events[e]).flatten()"
      - title: Stored blocks become CPU prefix-cache hits
        source: "vllm/v1/simple_kv_offload/manager.py:1065-1163"
        set:
          state.cpu_cache: "= merge(state.cpu_cache, vars.blocks.transformMapEntry(i, b, {b.hash: {'stored_at': now}}))"
          state.store_events: "= omit(state.store_events, vars.sevs)"
      - title: Finished loads are cleaned up
        source: "vllm/v1/simple_kv_offload/manager.py:1320-1361"
        set:
          state.reqs_to_load: "= omit(state.reqs_to_load, vars.done)"
      - return: {cached: "= size(vars.blocks)", loaded: "= vars.done"}

  - component: simple-cpu-offload-connector
    name: reset
    kind: function
    summary: "SimpleCPUOffloadScheduler.reset (reset_cache, only when reset_prefix_cache(reset_connector=True)): drop pins, pending stores and unsent loads, and clear the CPU prefix cache."
    sources: ["vllm/v1/simple_kv_offload/manager.py:1387-1446", "vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py:365-368"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {reset: {type: boolean}}}
    behavior:
      - set:
          state.pending_hits: {}
          state.pending_finished_stores: []
          state.reqs_to_store: []
          state.reqs_to_load: "= state.reqs_to_load.transformMapEntry(r, v, v.load_event >= 0, {r: v})"
          state.cpu_cache: {}
      - return: {reset: true}

  # seams added to the dispatcher for the scheduler
  - component: kv-connector-base-v1
    name: update-connector-output
    kind: function
    summary: "Scheduler hook in update_from_output: hand the workers' aggregated KVConnectorOutput to the connector (finished transfers, store events)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:606-614"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request: {type: object, properties: {finished_store_events: {type: array, items: {type: integer}}, finished_sending: {type: array, items: {type: string}}, finished_recving: {type: array, items: {type: string}}, kv_connector_worker_meta: {type: [object, "null"]}}}
    response: {type: object, properties: {cached: {type: integer}, loaded: {type: array}, children: {type: array}, kv_connector_worker_meta: {type: [object, "null"]}}}
    behavior:
      - if: "config['kv-connector'] == 'MultiConnector'"
        then:
          - title: "MultiConnector hands the output to each child"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:496-515"
            call: multi-connector.update-connector-output
            input: "= input"
            as: mu
          - return: {cached: "= sum(vars.mu.value.children.map(c, c.cached))", loaded: [], children: "= vars.mu.value.children", kv_connector_worker_meta: "= vars.mu.value.kv_connector_worker_meta"}
      - if: "config['kv-connector'] != 'SimpleCPUOffloadConnector'"
        then:
          - title: The base implementation does nothing
            source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:606-614"
            return: {cached: 0, loaded: []}
      - call: simple-cpu-offload-connector.update-connector-output
        input: "= input"
        as: u
      - return: "= vars.u.value"

  - component: kv-connector-base-v1
    name: reset-cache
    kind: function
    summary: "Scheduler hook reset_connector_cache (reset_prefix_cache with reset_connector=True): reset the connector's own cache; None when the connector has none."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:778-790"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request: {type: object, properties: {}}
    response: {type: object, properties: {reset: {type: [boolean, "null"]}}}
    behavior:
      - if: "config['kv-connector'] != 'SimpleCPUOffloadConnector'"
        then:
          - return: {reset: null}
      - call: simple-cpu-offload-connector.reset
        as: r
      - return: {reset: "= vars.r.value.reset"}

  - component: canonical-mapping
    name: opaque-fallback-mapping
    kind: function
    summary: "_opaque_fallback_mapping: one run copies this worker's whole page to canonical offset rank * page_size; the canonical page is num_ranks pages; one writer; not parallelism-agnostic."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/offloading/canonical_mapping.py:334-348"]
    request:
      type: object
      required: [page_size_bytes, num_ranks, rank]
      properties:
        page_size_bytes: {type: integer, examples: [1024]}
        num_ranks: {type: integer, examples: [4]}
        rank: {type: integer, examples: [2]}
    response:
      type: object
      properties:
        canonical_page_size_bytes: {type: integer}
        local_page_size_bytes: {type: integer}
        runs: {type: array}
        num_writers: {type: integer}
        writer_index: {type: integer}
        parallelism_agnostic: {type: boolean}
    behavior:
      - title: "CopyRun(0, rank * page, page, 1, page, page)"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/canonical_mapping.py:338-340"
        return:
          canonical_page_size_bytes: "= input.num_ranks * input.page_size_bytes"
          local_page_size_bytes: "= input.page_size_bytes"
          runs: "= [{'local_offset': 0, 'canonical_offset': input.rank * input.page_size_bytes, 'fragment_size': input.page_size_bytes, 'num_fragments': 1, 'local_stride': input.page_size_bytes, 'canonical_stride': input.page_size_bytes}]"
          num_writers: 1
          writer_index: 0
          parallelism_agnostic: false

  - component: ec-embedding-cache
    name: get
    kind: function
    summary: "EmbeddingCache.get: the entry for a key, or None (under the cache lock)."
    sources: ["vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:72-75"]
    request: {type: object, required: [key], properties: {key: {type: string, examples: [a]}}}
    response: {type: [object, "null"], properties: {block_ids: {type: array, items: {type: integer}}, ready: {type: boolean}}}
    behavior:
      - call: ec-embedding-cache.entry-lookup
        input: {key: "= input.key"}
        as: e
        on_error: continue
      - title: "self._entries.get(key): None when absent"
        source: "vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:74-75"
        return: "= vars.e.ok ? vars.e.value : null"

  - component: ec-embedding-cache
    name: entry-lookup
    kind: io
    summary: "self._entries[key]"
    sources: ["vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:75"]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    errors:
      - {code: not_found, status: 404, retryable: false}
    store: {table: entries, op: get, key: "= input.key"}

  - component: ec-embedding-cache
    name: alloc
    kind: function
    summary: "EmbeddingCache.alloc: refuse a duplicate key or more blocks than the cache holds; None when even evicting every evictable entry can't make room; otherwise a not-ready entry on the lowest free blocks."
    sources: ["vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:86-111"]
    attributes: {single_writer: "vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:94 holds self._lock for the whole allocation"}
    request: {type: object, required: [key, n_blocks], properties: {key: {type: string, examples: [a]}, n_blocks: {type: integer, examples: [2]}}}
    response: {type: [object, "null"], properties: {block_ids: {type: array, items: {type: integer}}, ready: {type: boolean}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - call: ec-embedding-cache.get
        input: {key: "= input.key"}
        as: cur
      - if: "vars.cur.value != null"
        then:
          - source: "vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:95-97"
            fail: {code: assertion-error, status: 0, message: "= 'EmbeddingCache: duplicate alloc for \\'' + input.key + '\\''"}
      - if: "input.n_blocks > state.num_blocks"
        then:
          - source: "vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:98-101"
            fail: {code: assertion-error, status: 0, message: "= 'EmbeddingCache: ' + string(input.n_blocks) + ' blocks requested but capacity is ' + string(state.num_blocks)"}
      - if: "size(state.free_blocks) < input.n_blocks"
        then:
          - title: Not enough space even after eviction (no evictable entries modeled)
            source: "vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:102-103"
            return: null
      - title: Take blocks from the free stack, in ascending order
        source: "vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:104-111"
        call: ec-embedding-cache.put-entry
        input: {key: "= input.key", entry: "= {'block_ids': state.free_blocks.slice(size(state.free_blocks) - input.n_blocks, size(state.free_blocks)).sort(), 'ready': false}"}
        as: put
      - set: {state.free_blocks: "= state.free_blocks.slice(0, size(state.free_blocks) - input.n_blocks)"}
      - return: "= vars.put.value"

  - component: ec-embedding-cache
    name: put-entry
    kind: io
    summary: "self._entries[key] = CacheEntry(block_ids, shape)"
    sources: ["vllm/distributed/ec_transfer/ec_connector/cpu/scheduler/embedding_cache.py:109-110"]
    request: {type: object, required: [key, entry], properties: {key: {type: string}, entry: {type: object}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    store: {table: entries, op: put, key: "= input.key", value: "= input.entry", where: "row == null", conflict: assertion-error}

  - component: m2n-common
    name: check-transferable
    kind: function
    summary: "check_transferable: reject a parameter whose dtype nccl_m2n can't move, or whose rank is outside 1..MAX_TENSOR_DIMS (3), naming the parameter."
    sources: ["vllm/distributed/weight_transfer/m2n_common.py:257-268"]
    request:
      type: object
      required: [name, dtype, shape]
      properties:
        name: {type: string, examples: [w]}
        dtype: {type: string, examples: [bfloat16]}
        shape: {type: array, items: {type: integer}, examples: [[16, 16]]}
    response: {type: object, properties: {ok: {type: boolean}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "!(input.dtype in ['int8', 'uint8', 'float8_e4m3fn', 'float8_e5m2', 'float16', 'bfloat16', 'int32', 'uint32', 'float32', 'int64', 'uint64', 'float64'])"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_common.py:259-263"
            fail: {code: value-error, status: 0, message: "= 'parameter \\'' + input.name + '\\' has dtype torch.' + input.dtype + ', which nccl_m2n does not support. Supported: [\\'torch.bfloat16\\', \\'torch.float16\\', \\'torch.float32\\', \\'torch.float64\\', \\'torch.float8_e4m3fn\\', \\'torch.float8_e5m2\\', \\'torch.int32\\', \\'torch.int64\\', \\'torch.int8\\', \\'torch.uint32\\', \\'torch.uint64\\', \\'torch.uint8\\']'"}
      - if: "size(input.shape) < 1 || size(input.shape) > 3"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_common.py:264-268"
            fail: {code: value-error, status: 0, message: "= 'parameter \\'' + input.name + '\\' has rank ' + string(size(input.shape)) + '; nccl_m2n supports rank 1..3'"}
      - return: {ok: true}

  # ---------------------------------------------------------------- KV cache spec arithmetic
  - component: kv-cache-interface
    name: page-size-bytes
    kind: function
    summary: "KVCacheSpec.page_size_bytes per spec class: attention specs are heads x states x per-state bytes (MLA has no V and may be padded to its alignment); Mamba sums its state shapes; HiSparse specs carry a fixed page; a UniformType group sums its layers; the base class raises NotImplementedError."
    sources:
      - "vllm/v1/kv_cache_interface.py:217-225"
      - "vllm/v1/kv_cache_interface.py:227-234"
      - "vllm/v1/kv_cache_interface.py:455-457"
      - "vllm/v1/kv_cache_interface.py:488-490"
      - "vllm/v1/kv_cache_interface.py:533-560"
      - "vllm/v1/kv_cache_interface.py:676-702"
      - "vllm/v1/kv_cache_interface.py:849-857"
      - "vllm/v1/kv_cache_interface.py:908-918"
      - "vllm/v1/kv_cache_interface.py:1061-1070"
      - "vllm/v1/kv_cache_interface.py:1252-1254"
      - "vllm/utils/torch_utils.py:361-363"
    request:
      type: object
      required: [spec]
      properties:
        spec: DistKvCacheSpec
    response: {type: integer}
    errors:
      - {code: not-implemented-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.s: "= input.spec"
          vars.dsize: "= {'float32': 4, 'float16': 2, 'bfloat16': 2, 'int8': 1, 'uint8': 1, 'fp8': 1, 'float8_e4m3fn': 1, 'float8_e5m2': 1, 'int32': 4, 'int64': 8}"
      - if: "vars.s.kind == 'base'"
        then:
          - title: KVCacheSpec.page_size_bytes is abstract
            source: "vllm/v1/kv_cache_interface.py:217-225"
            fail: {code: not-implemented-error, status: 0, message: ""}
      - if: "vars.s.kind in ['hisparse_hot', 'hisparse_resident']"
        then:
          - title: HiSparse specs carry their page size as a field
            source: "vllm/v1/kv_cache_interface.py:455-457"
            return: "= vars.s.page_size"
      - if: "vars.s.kind == 'uniform_type'"
        then:
          - set: {vars.total: 0}
          - title: "UniformTypeKVCacheSpecs: the sum of its layers' page sizes"
            source: "vllm/v1/kv_cache_interface.py:1252-1254"
            foreach: "= vars.s.specs"
            as: sub
            steps:
              - call: kv-cache-interface.page-size-bytes
                input: {spec: "= vars.sub"}
                as: sp
              - set: {vars.total: "= vars.total + vars.sp.value"}
          - return: "= vars.total"
      - if: "vars.s.kind == 'mamba'"
        then:
          - set: {vars.total: 0}
          - title: "MambaSpec: sum of prod(shape) * dtype size over the state tensors"
            source: "vllm/v1/kv_cache_interface.py:1062-1066"
            foreach: "= lists.range(size(vars.s.shapes))"
            as: i
            steps:
              - set: {vars.prod: 1}
              - foreach: "= vars.s.shapes[vars.i]"
                as: d
                steps:
                  - set: {vars.prod: "= vars.prod * vars.d"}
              - set: {vars.total: "= vars.total + vars.prod * vars.dsize[vars.s.dtypes[vars.i]]"}
          - set: {vars.unpadded: "= vars.total"}
        else:
          - title: "AttentionSpec: num_heads x num_states x state_content_size_bytes (head_size_v defaults to head_size; MLA has none)"
            source: "vllm/v1/kv_cache_interface.py:533-553"
            set:
              vars.heads: "= has(vars.s.num_head_slots) && vars.s.num_head_slots != null ? vars.s.num_head_slots : vars.s.num_kv_heads"
              vars.hv: "= has(vars.s.head_size_v) && vars.s.head_size_v != null ? vars.s.head_size_v : (vars.s.kind == 'mla_attention' ? 0 : vars.s.head_size)"
              vars.tps: "= has(vars.s.tokens_per_state) && vars.s.tokens_per_state != null ? vars.s.tokens_per_state : 1"
          - source: "vllm/v1/kv_cache_interface.py:227-234"
            set:
              vars.states: "= vars.tps > 0 ? vars.s.block_size / vars.tps : 1"
              vars.content: "= has(vars.s.state_content_bytes) && vars.s.state_content_bytes != null ? vars.s.state_content_bytes : (vars.s.head_size + vars.hv) * vars.dsize[vars.s.dtype]"
          - set: {vars.unpadded: "= vars.heads * vars.states * vars.content"}
          - if: "vars.s.kind == 'mla_attention' && has(vars.s.alignment) && vars.s.alignment != null && (!has(vars.s.page_size_padded) || vars.s.page_size_padded == null)"
            then:
              - title: "MLA __post_init__: _apply_alignment_padding rounds the page up to the alignment"
                source: "vllm/v1/kv_cache_interface.py:676-682"
                set:
                  vars.s: "= merge(vars.s, {'page_size_padded': (vars.unpadded + vars.s.alignment - 1) / vars.s.alignment * vars.s.alignment})"
      - if: "has(vars.s.page_size_padded) && vars.s.page_size_padded != null"
        then:
          - if: "vars.s.page_size_padded < vars.unpadded"
            then:
              - title: A padded page smaller than its payload is a spec bug
                source: "vllm/v1/kv_cache_interface.py:557-558"
                fail: {code: assertion-error, status: 0, message: ""}
          - source: "vllm/v1/kv_cache_interface.py:559"
            return: "= vars.s.page_size_padded"
      - return: "= vars.unpadded"

  - component: kv-cache-interface
    name: merge
    kind: function
    summary: "KVCacheSpec.merge for the specs of one cache group: the base class requires identical specs; FullAttentionSpec.merge requires one window size and one chunk size (not both), identical attention fields, and makes the group non-causal if any layer is; MLAAttentionSpec.merge also requires one cache dtype, tokens per state, model version and cache role."
    sources:
      - "vllm/v1/kv_cache_interface.py:265-272"
      - "vllm/v1/kv_cache_interface.py:609-673"
      - "vllm/v1/kv_cache_interface.py:704-754"
    request:
      type: object
      required: [specs]
      properties:
        specs: {type: array, items: DistKvCacheSpec, minItems: 1}
    response: DistKvCacheSpec
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.first: "= input.specs[0]"
          vars.attn: "= input.specs.map(s, [s.block_size, has(s.num_kv_heads) ? s.num_kv_heads : 0, has(s.head_size) ? s.head_size : 0, has(s.dtype) ? s.dtype : ''])"
      - if: "!(vars.first.kind in ['full_attention', 'mla_attention'])"
        then:
          - if: "!input.specs.all(s, s == vars.first)"
            then:
              - title: "KVCacheSpec.merge: every layer of a group must have the same spec"
                source: "vllm/v1/kv_cache_interface.py:268-271"
                fail: {code: assertion-error, status: 0, message: "All layers in the same KV cache group must be the same."}
          - source: "vllm/v1/kv_cache_interface.py:272"
            return: "= vars.first"
      - if: "vars.first.kind == 'mla_attention'"
        then:
          - if: "!input.specs.all(s, s.kind == 'mla_attention')"
            then:
              - source: "vllm/v1/kv_cache_interface.py:706-708"
                fail: {code: assertion-error, status: 0, message: "All attention layers in the same KV cache group must be MLAAttentionSpec."}
          - if: "input.specs.map(s, has(s.cache_dtype_str) ? s.cache_dtype_str : null).distinct().size() != 1 || input.specs.map(s, has(s.tokens_per_state) ? s.tokens_per_state : 1).distinct().size() != 1"
            then:
              - title: One quantization method and tokens-per-state per MLA group
                source: "vllm/v1/kv_cache_interface.py:715-726"
                fail: {code: assertion-error, status: 0, message: "All attention layers in the same KV cache group must use the same quantization method, tokens per state, model version, cache role, index-sharing role, and block stride alignment."}
          - if: "vars.attn.distinct().size() != 1"
            then:
              - source: "vllm/v1/kv_cache_interface.py:748-753"
                fail: {code: assertion-error, status: 0, message: "All attention layers in the same KV cache group must have the same attention spec."}
          - source: "vllm/v1/kv_cache_interface.py:727-747"
            return: "= merge(vars.first, {'non_causal_multi_token_decode': input.specs.exists(s, has(s.non_causal_multi_token_decode) && s.non_causal_multi_token_decode == true)})"
      - if: "input.specs.exists(s, s.kind != 'full_attention')"
        then:
          - title: "FullAttentionSpec.merge refuses MLA (and other) specs in the group"
            source: "vllm/v1/kv_cache_interface.py:626-628"
            fail: {code: assertion-error, status: 0, message: "All attention layers in the same KV cache group must be FullAttentionSpec."}
      - set:
          vars.windows: "= input.specs.filter(s, has(s.sliding_window) && s.sliding_window != null).map(s, s.sliding_window).distinct()"
          vars.chunks: "= input.specs.filter(s, has(s.attention_chunk_size) && s.attention_chunk_size != null).map(s, s.attention_chunk_size).distinct()"
      - if: "size(vars.windows) > 1 || size(vars.chunks) > 1"
        then:
          - title: merge_window_sizes allows one window (or chunk) size per group
            source: "vllm/v1/kv_cache_interface.py:610-619"
            fail: {code: value-error, status: 0, message: "All attention layers in the same KV cache group must have the same window size."}
      - if: "vars.attn.distinct().size() != 1"
        then:
          - source: "vllm/v1/kv_cache_interface.py:658-664"
            fail: {code: assertion-error, status: 0, message: "All attention layers in the same KV cache group must have the same attention spec."}
      - if: "size(vars.windows) + size(vars.chunks) > 1"
        then:
          - source: "vllm/v1/kv_cache_interface.py:665-672"
            fail: {code: assertion-error, status: 0, message: "Model with both sliding window layers and chunked local attention layers is not supported."}
      - title: "The merged spec: the first layer's fields, the group's window/chunk size, non_causal if any layer is"
        source: "vllm/v1/kv_cache_interface.py:637-657"
        return: "= merge(vars.first, {'sliding_window': size(vars.windows) == 1 ? vars.windows[0] : null, 'attention_chunk_size': size(vars.chunks) == 1 ? vars.chunks[0] : null, 'non_causal': input.specs.exists(s, has(s.non_causal) && s.non_causal == true)})"

  - component: kv-cache-interface
    name: prefix-cacheable-group-ids
    kind: function
    summary: "KVCacheConfig.transfer_group_ids (groups with enable_kv_transfer) and prefix_cacheable_group_ids (those whose spec is prefix-cacheable: not HiSparse, not a circular buffer; a UniformType group only if all its layers are)."
    sources:
      - "vllm/v1/kv_cache_interface.py:1495-1511"
      - "vllm/v1/kv_cache_interface.py:195-198"
      - "vllm/v1/kv_cache_interface.py:451-453"
      - "vllm/v1/kv_cache_interface.py:939-941"
      - "vllm/v1/kv_cache_interface.py:1239-1241"
    request:
      type: object
      required: [kv_cache_groups]
      properties:
        kv_cache_groups: {type: array, items: {type: object, properties: {layer_names: {type: array, items: {type: string}}, kv_cache_spec: DistKvCacheSpec, enable_kv_transfer: {type: boolean}}}}
    response: {type: object, properties: {transfer_group_ids: {type: array, items: {type: integer}}, prefix_cacheable_group_ids: {type: array, items: {type: integer}}}}
    behavior:
      - set:
          vars.nonpc: "= ['hisparse_hot', 'hisparse_resident', 'circular_buffer']"
      - source: "vllm/v1/kv_cache_interface.py:1495-1502"
        set:
          vars.transfer: "= lists.range(size(input.kv_cache_groups)).filter(i, !has(input.kv_cache_groups[i].enable_kv_transfer) || input.kv_cache_groups[i].enable_kv_transfer)"
      - source: "vllm/v1/kv_cache_interface.py:1504-1511"
        set:
          vars.pc: "= vars.transfer.filter(i, input.kv_cache_groups[i].kv_cache_spec.kind == 'uniform_type' ? input.kv_cache_groups[i].kv_cache_spec.specs.all(k, !(input.kv_cache_groups[i].kv_cache_spec.specs[k].kind in vars.nonpc)) : !(input.kv_cache_groups[i].kv_cache_spec.kind in vars.nonpc))"
      - return: {transfer_group_ids: "= vars.transfer", prefix_cacheable_group_ids: "= vars.pc"}

  - component: kv-cache-interface
    name: select-transfer-block-ids
    kind: function
    summary: "KVCacheConfig.select_transfer_block_ids: given one block-id list per cache group, keep the transferable groups' lists; a list count that differs from the group count is a ValueError."
    sources: ["vllm/v1/kv_cache_interface.py:1537-1547"]
    request:
      type: object
      required: [kv_cache_groups, block_ids]
      properties:
        kv_cache_groups: {type: array, items: {type: object}}
        block_ids: {type: array, items: {type: array, items: {type: integer}}}
    response: {type: array, items: {type: array, items: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "size(input.block_ids) != size(input.kv_cache_groups)"
        then:
          - source: "vllm/v1/kv_cache_interface.py:1541-1545"
            fail: {code: value-error, status: 0, message: "= 'Expected ' + string(size(input.kv_cache_groups)) + ' KV cache groups, got ' + string(size(input.block_ids)) + '.'"}
      - call: kv-cache-interface.prefix-cacheable-group-ids
        input: {kv_cache_groups: "= input.kv_cache_groups"}
        as: ids
      - source: "vllm/v1/kv_cache_interface.py:1546"
        return: "= vars.ids.value.transfer_group_ids.map(i, input.block_ids[i])"

  - component: kv-cache-layout
    name: properties
    kind: function
    summary: "The KVCacheLayout member's stride order and its derived properties: layer_view_order (the 4D per-layer view without L), is_layer_compact (L outermost), is_block_contiguous ([H, N, C] innermost), is_block_compact (L and B outermost), is_block_outermost (B first). An unknown name is a KeyError."
    sources: ["vllm/v1/kv_cache_layout.py:15-58"]
    request: {type: object, required: [layout], properties: {layout: {type: string, examples: [LBHNC]}}}
    response:
      type: object
      properties:
        stride_order: {type: array, items: {type: integer}}
        layer_view_order: {type: array, items: {type: integer}}
        is_layer_compact: {type: boolean}
        is_block_contiguous: {type: boolean}
        is_block_compact: {type: boolean}
        is_block_outermost: {type: boolean}
    errors:
      - {code: key-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.members: "= {'LBHNC': [0, 1, 2, 3, 4], 'LBNHC': [0, 1, 3, 2, 4], 'LHBNC': [0, 2, 1, 3, 4], 'BLHNC': [1, 0, 2, 3, 4], 'BLNHC': [1, 0, 3, 2, 4], 'BHLNC': [1, 2, 0, 3, 4]}"
      - if: "!(input.layout in vars.members)"
        then:
          - title: "KVCacheLayout[name] on an unknown member"
            source: "vllm/v1/kv_cache_layout.py:15-28"
            fail: {code: key-error, status: 0, message: "= '\\'' + input.layout + '\\''"}
      - set: {vars.v: "= vars.members[input.layout]"}
      - source: "vllm/v1/kv_cache_layout.py:30-58"
        return:
          stride_order: "= vars.v"
          layer_view_order: "= vars.v.filter(i, i != 0).map(i, i - 1)"
          is_layer_compact: "= vars.v[0] == 0"
          is_block_contiguous: "= vars.v.slice(2, 5) == [2, 3, 4]"
          is_block_compact: "= (vars.v[0] == 0 && vars.v[1] == 1) || (vars.v[0] == 1 && vars.v[1] == 0)"
          is_block_outermost: "= vars.v[0] == 1"

  # ---------------------------------------------------------------- OffloadingConnector config
  - component: offloading-config
    name: build-offloading-config
    kind: function
    summary: "build_offloading_config: pick the offloaded cache groups (prefix-cacheable ones, or the HiSparse indexer groups); give each its DCP-scaled tokens per block; resolve the hash granularity (one group: the cache block size; several: the GCD of their block sizes) and require every group to be a multiple of it; resolve blocks_per_chunk from `blocks_per_chunk` or `block_size` in kv_connector_extra_config; and size one worker block in bytes."
    sources:
      - "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:36-56"
      - "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:59-151"
    attributes: {callers: [engine-core, gpu-worker]}
    request:
      type: object
      required: [kv_cache_config]
      properties:
        kv_cache_config:
          type: object
          required: [num_blocks, kv_cache_groups]
          properties:
            num_blocks: {type: integer}
            kv_cache_tensors: {type: array, default: [], items: {type: object, properties: {size: {type: integer}, layers: {type: array}, layer_stride: {type: integer}, block_stride: {type: integer}}}}
            kv_cache_groups: {type: array, items: {type: object, properties: {layer_names: {type: array, items: {type: string}}, kv_cache_spec: DistKvCacheSpec, enable_kv_transfer: {type: boolean}, role: {type: string}}}}
            hisparse_host_num_blocks: {type: [integer, "null"], default: null}
        prefix_match_unit: {type: [integer, "null"], default: null}
        decode_context_parallel_size: {type: integer, default: 1}
        extra_config: {type: object, default: {}, properties: {blocks_per_chunk: {type: integer}, block_size: {type: integer}}}
    response:
      type: object
      properties:
        groups: {type: array, items: {type: object, properties: {group_id: {type: integer}, tokens_per_block: {type: integer}, layer_names: {type: array}}}}
        tokens_per_hash: {type: integer}
        blocks_per_chunk: {type: integer}
        worker_kv_bytes_per_block: {type: integer}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.kc: "= input.kv_cache_config"
          vars.dcp: "= has(input.decode_context_parallel_size) ? input.decode_context_parallel_size : 1"
          vars.extra: "= has(input.extra_config) ? input.extra_config : {}"
      - if: "!has(vars.kc.hisparse_host_num_blocks) || vars.kc.hisparse_host_num_blocks == null"
        then:
          - title: "get_offloading_group_ids: the prefix-cacheable transfer groups"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:36-38"
            call: kv-cache-interface.prefix-cacheable-group-ids
            input: {kv_cache_groups: "= vars.kc.kv_cache_groups"}
            as: pc
          - set: {vars.selected: "= vars.pc.value.prefix_cacheable_group_ids"}
        else:
          - title: "With HiSparse host blocks, only the HiSparse indexer groups"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:39-43"
            set: {vars.selected: "= lists.range(size(vars.kc.kv_cache_groups)).filter(i, has(vars.kc.kv_cache_groups[i].role) && vars.kc.kv_cache_groups[i].role == 'hisparse_indexer')"}
      - if: "size(vars.selected) == 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:75-76"
            fail: {code: value-error, status: 0, message: "KV offloading found no eligible cache groups."}
      - title: "resolve_dcp_kv_block_size (scheduler-kv's helper, kv_cache_utils.py:728-730): DCP-sharded specs span block_size x dcp tokens"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:77-87"
        set:
          vars.sizes: "= vars.kc.kv_cache_groups.map(g, g.kv_cache_spec.block_size * ((has(g.kv_cache_spec.dcp_sharded) && g.kv_cache_spec.dcp_sharded != null ? g.kv_cache_spec.dcp_sharded : !(g.kv_cache_spec.kind in ['mamba', 'hisparse_hot', 'hisparse_resident', 'base'])) ? vars.dcp : 1))"
      - set:
          vars.groups: "= vars.selected.map(i, {'group_id': i, 'tokens_per_block': vars.sizes[i], 'layer_names': vars.kc.kv_cache_groups[i].layer_names})"
      - if: "size(vars.kc.kv_cache_groups) <= 1"
        then:
          - title: "resolve_kv_cache_block_sizes, one group: the cache block size (x DCP when sharded) for both"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:89"
            set: {vars.tph: "= vars.sizes[0]"}
        else:
          - title: "resolve_kv_cache_block_sizes, several groups: the GCD of the prefix-cacheable groups' block sizes (prefix_match_unit overrides; a Mamba group outside align mode backs off to their LCM)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:89"
            set:
              vars.hs: "= lists.range(size(vars.sizes)).filter(i, !(vars.kc.kv_cache_groups[i].kv_cache_spec.kind in ['circular_buffer', 'hisparse_hot', 'hisparse_resident'])).map(i, vars.sizes[i])"
              vars.mx: "= math.greatest(vars.sizes)"
          - set:
              vars.gcd: "= lists.range(math.least(vars.hs) + 1).filter(d, d > 0 && vars.hs.all(s, s % d == 0))[size(lists.range(math.least(vars.hs) + 1).filter(d, d > 0 && vars.hs.all(s, s % d == 0))) - 1]"
              vars.lcm: "= lists.range(64).map(k, vars.mx * (k + 1)).filter(m, vars.sizes.all(s, m % s == 0))[0]"
          - set:
              vars.tph: "= vars.kc.kv_cache_groups.exists(g, g.kv_cache_spec.kind == 'mamba' && (!has(g.kv_cache_spec.mamba_cache_mode) || g.kv_cache_spec.mamba_cache_mode != 'align')) ? vars.lcm : (has(input.prefix_match_unit) && input.prefix_match_unit != null ? input.prefix_match_unit : vars.gcd)"
      - if: "vars.groups.exists(g, g.tokens_per_block % vars.tph != 0)"
        then:
          - title: Every offloaded group's block must be a whole number of hash blocks
            source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:90-96"
            fail: {code: assertion-error, status: 0, message: "= 'tokens_per_block=' + string(vars.groups.filter(g, g.tokens_per_block % vars.tph != 0)[0].tokens_per_block) + ' not divisible by tokens_per_hash=' + string(vars.tph) + '. Hybrid models (e.g. Mamba+Attention) need --enable-prefix-caching to align block sizes.'"}
      - set: {vars.bpc: 1}
      - if: "has(vars.extra.blocks_per_chunk) && has(vars.extra.block_size)"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:102-106"
            fail: {code: value-error, status: 0, message: "Specify only one of 'block_size' or 'blocks_per_chunk' in kv_connector_extra_config."}
      - if: "has(vars.extra.blocks_per_chunk)"
        then:
          - if: "vars.extra.blocks_per_chunk <= 0"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:108-112"
                fail: {code: value-error, status: 0, message: "'blocks_per_chunk' must be greater than 0."}
          - set: {vars.bpc: "= vars.extra.blocks_per_chunk"}
      - if: "has(vars.extra.block_size)"
        then:
          - if: "vars.groups.map(g, g.tokens_per_block).distinct().size() != 1"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:117-123"
                fail: {code: assertion-error, status: 0, message: "If 'block_size' is specified in kv_connector_extra_config, there must be at least one KV cache group, and all groups must have the same block size."}
          - set: {vars.tpb: "= vars.groups[0].tokens_per_block"}
          - if: "vars.extra.block_size % vars.tpb != 0"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:128-135"
                fail: {code: value-error, status: 0, message: "= \"'block_size'=\" + string(vars.extra.block_size) + ' in kv_connector_extra_config must be a multiple of the GPU KV cache block size (' + string(vars.tpb) + ' tokens). Use ' + string((vars.extra.block_size + vars.tpb - 1) / vars.tpb * vars.tpb) + \" instead, or set 'blocks_per_chunk' to express the chunk size in blocks.\""}
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:126-127"
            set: {vars.bpc: "= vars.extra.block_size / vars.tpb"}
      - set: {vars.wbytes: 0}
      - if: "(!has(vars.kc.hisparse_host_num_blocks) || vars.kc.hisparse_host_num_blocks == null) && vars.kc.num_blocks > 0 && has(vars.kc.kv_cache_tensors) && size(vars.kc.kv_cache_tensors) > 0"
        then:
          - title: "Bytes per worker block: the backing allocation over the block count (every KVCacheTensor describes the same allocation)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:137-147"
            set: {vars.wbytes: "= vars.kc.kv_cache_tensors[0].size / vars.kc.num_blocks"}
        else:
          - if: "vars.kc.num_blocks > 0"
            then:
              - title: "_group_kv_bytes_per_block summed over the offloaded groups (page size x layers, or a UniformType group's page)"
                source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:148-151"
                foreach: "= vars.selected"
                as: gi
                steps:
                  - call: kv-cache-interface.page-size-bytes
                    input: {spec: "= vars.kc.kv_cache_groups[vars.gi].kv_cache_spec"}
                    as: pg
                  - set: {vars.wbytes: "= vars.wbytes + (vars.kc.kv_cache_groups[vars.gi].kv_cache_spec.kind == 'uniform_type' ? vars.pg.value : vars.pg.value * size(vars.kc.kv_cache_groups[vars.gi].layer_names))"}
      - return: {groups: "= vars.groups", tokens_per_hash: "= vars.tph", blocks_per_chunk: "= vars.bpc", worker_kv_bytes_per_block: "= vars.wbytes"}

  - component: offloading-worker-metadata
    name: aggregate
    kind: function
    summary: "OffloadingWorkerMetadata.aggregate: sum the completed-job counts per job id and merge the transfer stats (bytes and time added, sizes concatenated) for load and store."
    sources:
      - "vllm/distributed/kv_transfer/kv_connector/v1/offloading/common.py:92-104"
      - "vllm/distributed/kv_transfer/kv_connector/v1/offloading/common.py:20-28"
      - "vllm/distributed/kv_transfer/kv_connector/v1/offloading/common.py:43-47"
    request:
      type: object
      required: [self, other]
      properties:
        self: {type: object, properties: {completed_jobs: {type: object}, transfer_stats: {type: object}}}
        other: {type: object, properties: {completed_jobs: {type: object}, transfer_stats: {type: object}}}
    response: {type: object, properties: {completed_jobs: {type: object}, transfer_stats: {type: object}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "!has(input.other.completed_jobs)"
        then:
          - title: "assert isinstance(other, OffloadingWorkerMetadata)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/common.py:95"
            fail: {code: assertion-error, status: 0, message: ""}
      - set:
          vars.a: "= has(input.self.completed_jobs) ? input.self.completed_jobs : {}"
          vars.b: "= input.other.completed_jobs"
          vars.empty: "= {'load': {'bytes': 0, 'time': 0.0, 'sizes': []}, 'store': {'bytes': 0, 'time': 0.0, 'sizes': []}}"
      - set:
          vars.sa: "= has(input.self.transfer_stats) && 'load' in input.self.transfer_stats ? input.self.transfer_stats : vars.empty"
          vars.sb: "= has(input.other.transfer_stats) && 'load' in input.other.transfer_stats ? input.other.transfer_stats : vars.empty"
      - title: "merged[job_id] = merged.get(job_id, 0) + v"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/common.py:97-99"
        set:
          vars.jobs: "= (vars.a.filter(k, true) + vars.b.filter(k, true)).distinct().transformMapEntry(i, k, {k: (k in vars.a ? vars.a[k] : 0) + (k in vars.b ? vars.b[k] : 0)})"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/offloading/common.py:101-104"
        return:
          completed_jobs: "= vars.jobs"
          transfer_stats: "= ['load', 'store'].transformMapEntry(i, d, {d: {'bytes': vars.sa[d].bytes + vars.sb[d].bytes, 'time': double(vars.sa[d].time) + double(vars.sb[d].time), 'sizes': vars.sa[d].sizes + vars.sb[d].sizes}})"

  # ---------------------------------------------------------------- worker-role connector lifecycle
  - component: kv-connector-base-v1-worker
    name: role
    kind: function
    summary: "KVConnectorBase_V1.role: the role the connector was built with (SCHEDULER in the engine core, WORKER here)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:228-230"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {role: {type: string}}}
    behavior:
      - if: "config['kv-connector'] == ''"
        then:
          - title: "No kv_transfer_config: the base constructor raises, so there is no connector to ask"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:217-220"
            fail: {code: value-error, status: 0, message: "kv_transfer_config must be set for KVConnectorBase_V1"}
      - return: {role: "= state.role"}
    errors:
      - {code: value-error, status: 0, retryable: false}

  - component: kv-connector-base-v1-worker
    name: bind-connector-metadata
    kind: function
    summary: "bind_connector_metadata: the model runner hands this step's scheduler-built metadata to the worker connector before the forward."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:243-254"]
    attributes: {seam: true, callers: [worker-runner]}
    request: {type: object, required: [metadata], properties: {metadata: {type: object}}}
    response: {type: object, properties: {bound: {type: boolean}}}
    behavior:
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:254"
        set: {state.connector_metadata: "= input.metadata"}
      - return: {bound: true}

  - component: kv-connector-base-v1-worker
    name: clear-connector-metadata
    kind: function
    summary: "clear_connector_metadata: drop the step's metadata after the forward."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:256-262"]
    attributes: {seam: true, callers: [worker-runner]}
    request: {type: object, properties: {}}
    response: {type: object, properties: {cleared: {type: boolean}}}
    behavior:
      - set: {state.connector_metadata: null}
      - return: {cleared: true}

  - component: kv-connector-base-v1-worker
    name: has-connector-metadata
    kind: function
    summary: "has_connector_metadata: whether metadata is bound."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:277-284"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {has_metadata: {type: boolean}}}
    behavior:
      - return: {has_metadata: "= state.connector_metadata != null"}

  - component: kv-connector-base-v1-worker
    name: get-connector-metadata
    kind: function
    summary: "_get_connector_metadata: the bound metadata; asking with none bound is an assertion failure."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:264-275"]
    request: {type: object, properties: {}}
    response: {type: object}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "state.connector_metadata == null"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:274"
            fail: {code: assertion-error, status: 0, message: ""}
      - return: "= state.connector_metadata"

  - component: kv-connector-base-v1-worker
    name: register-kv-caches
    kind: function
    summary: "register_kv_caches, once the KV caches are allocated: the base class does nothing; NixlConnector registers the cache regions with NIXL and computes its compatibility hash."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:286-294", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:236-238"]
    attributes: {seam: true, callers: [worker-runner]}
    request:
      type: object
      required: [layer_names]
      properties:
        layer_names: {type: array, items: {type: string}, examples: [[model.layers.0.self_attn.attn]]}
        attn_backend_name: {type: string, default: FLASH_ATTN}
    response: {type: object, properties: {registered: {type: integer}, compat_hash: {type: [string, "null"]}}}
    behavior:
      - if: "config['kv-connector'] in ['NixlConnector', 'NixlPullConnector']"
        then:
          - call: nixl-pull-connector-worker.register-kv-caches
            input: {layer_names: "= input.layer_names", attn_backend_name: "= input.attn_backend_name"}
            as: nr
          - return: "= vars.nr.value"
      - title: The base implementation is a no-op
        source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:294"
        return: {registered: 0, compat_hash: null}

  - component: kv-connector-base-v1-worker
    name: wait-for-save
    kind: function
    summary: "wait_for_save, once per step after the forwards: NixlConnector asserts its metadata is bound and, with a host buffer, copies the saved blocks to host; ExampleConnector saved synchronously and returns."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:370-381", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:308-312", "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:261-262"]
    attributes: {seam: true, callers: [worker-runner]}
