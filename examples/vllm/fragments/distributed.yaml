  # ---- pipeline-parallel point-to-point
  - id: distributed-pp-send-recv-tensor-dict
    name: "PP 2 x TP 2 handoff: stage 0 sends hidden_states and residual sliced over the TP group (residual opted out), stage 1 all-gathers them back to full size"
    fixtures: [tp4-llama-70b]
    steps:
      - {interface: group-coordinator.rank-info, caller: gpu-worker, on: rank0, as: ri0, input: {ranks: [0, 2], rank: 0}}
      - {interface: group-coordinator.rank-info, caller: gpu-worker, on: rank2, as: ri2, input: {ranks: [0, 2], rank: 2}}
      - {interface: group-coordinator.send-tensor-dict, caller: gpu-worker, on: rank0, as: s, input: {world_size: 2, rank_in_group: 0, tensors: {hidden_states: 8192, residual: 8192, empty: 0}, metadata: {num_tokens: 2}, all_gather_size: 2, all_gather_rank: 0, all_gather_tensors: {residual: false}}}
      - {interface: group-coordinator.recv-tensor-dict, caller: gpu-worker, on: rank2, as: r, input: {world_size: 2, rank_in_group: 1, all_gather_size: 2}}
      - {interface: group-coordinator.send-tensor-dict, caller: gpu-worker, on: rank0, as: bad, input: {world_size: 2, rank_in_group: 0, dst: 2}}
      - {interface: group-coordinator.send-tensor-dict, caller: gpu-worker, on: rank0, as: one, input: {world_size: 1, rank_in_group: 0, tensors: {x: 4}}}
    expect:
      - "steps.ri0.result.value.is_first_rank && !steps.ri0.result.value.is_last_rank && steps.ri0.result.value.next_rank == 2 && steps.ri2.result.value.is_last_rank && steps.ri2.result.value.prev_rank == 0 && steps.ri2.result.value.next_rank == 0"
      - "steps.s.result.value.sent.hidden_states.numel == 4096 && steps.s.result.value.sent.residual.numel == 8192 && !('empty' in steps.s.result.value.sent)"
      - "steps.r.result.value.tensors == {'hidden_states': 8192, 'residual': 8192, 'empty': 0} && steps.r.result.value.metadata.num_tokens == 2 && steps.r.result.value.src == 0"
      - "steps.bad.result.error.code == 'assertion-error' && steps.bad.result.error.message == 'Invalid dst rank (2)' && steps.one.result.value.sent == {'x': 4}"

  - id: distributed-pp-send-recv-object
    name: "send_object/recv_object between two ranks, and the self-destination refusal"
    fixtures: [tp4-llama-70b]
    steps:
      - {interface: group-coordinator.send-object, caller: gpu-worker, on: rank0, as: s, input: {world_size: 2, rank_in_group: 0, dst: 1, obj: {step: 7}}}
      - {interface: group-coordinator.recv-object, caller: gpu-worker, on: rank1, as: r, input: {world_size: 2, rank_in_group: 1, src: 0}}
      - {interface: group-coordinator.send-object, caller: gpu-worker, on: rank0, as: me, input: {world_size: 2, rank_in_group: 0, dst: 0}}
      - {interface: group-coordinator.recv-object, caller: gpu-worker, on: rank1, as: oob, input: {world_size: 2, rank_in_group: 1, src: 5}}
    expect:
      - "steps.s.result.ok && steps.r.result.value == {'step': 7}"
      - "steps.me.result.error.message == 'Invalid destination rank. Destination rank is the same as the current rank.' && steps.oob.result.error.message == 'Invalid src rank (5)'"

