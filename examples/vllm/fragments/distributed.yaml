  - component: cuda-communicator
    name: all-gatherv
    kind: function
    summary: "CudaCommunicator.all_gatherv: dim 0 only; equal sizes drop to a plain all-gather; PyNccl gathers each tensor (this rank's rows must match sizes[rank]) into sum(sizes) rows, once every rank of the group has called."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:884-960"]
    request:
      type: object
      required: [group_name, world_size, num_tokens]
      properties:
