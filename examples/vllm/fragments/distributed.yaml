  - component: kv-connector-base-v1-worker
    name: get-kv-connector-stats
    kind: function
    summary: "get_kv_connector_stats: the connector's stats for the last interval (NIXL: its transfer counters, cleared; base: None)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:438-440", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:267-270"]
    attributes: {seam: true, callers: [worker-runner]}
    request: {type: object, properties: {}}
    response: {type: [object, "null"]}
    behavior:
