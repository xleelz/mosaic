          - title: Drain the invalid-block queue
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3525-3540"
            call: nixl-pull-connector-worker.take-invalid-block-ids
            as: inv
          - return: "= vars.inv.value"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:429"
        return: []

  - component: nixl-pull-connector-worker
    name: take-invalid-block-ids
    kind: function
    summary: "Return and clear the block ids of failed loads (the worker's invalid-block queue)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3525-3540"]
    request: {type: object, properties: {}}
    response: {type: array, items: {type: integer}}
    behavior:
