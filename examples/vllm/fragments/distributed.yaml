    latency_ms: "= (double(has(input.num_collectives) ? input.num_collectives : 1) * (double(config['dist-flashinfer-ar-base-us']) + double(input.bytes) * double(input.world_size - 1) / double(input.world_size) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0)"

  - component: symm-mem-communicator
    name: all-reduce
    kind: kernel
    summary: "torch symmetric-memory all-reduce on this rank: copy into the symmetric buffer, then multimem or two-shot all-reduce."
