    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "config['kv-connector'] in ['NixlConnector', 'NixlPullConnector']"
        then:
          - if: "state.connector_metadata == null"
            then:
              - title: "assert isinstance(self._connector_metadata, NixlConnectorMetadata)"
                source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:310"
                fail: {code: assertion-error, status: 0, message: ""}
          - if: "input.use_host_buffer"
            then:
              - title: Host-buffer platforms copy the requests to save from device to host
                source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:311-312"
                return: {saved_to_host: "= has(state.connector_metadata.reqs_to_save) ? size(state.connector_metadata.reqs_to_save) : 0"}
      - return: {saved_to_host: 0}

  - component: kv-connector-base-v1-worker
    name: get-finished
    kind: function
    summary: "get_finished: the requests whose async sends and receives completed on this worker; the base class reports none (None, None)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:383-399", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:244-247"]
    attributes: {seam: true, callers: [worker-runner]}
    request: {type: object, properties: {finished_req_ids: {type: array, items: {type: string}, default: []}}}
    response: {type: object, properties: {finished_sending: {type: [array, "null"]}, finished_recving: {type: [array, "null"]}}}
    behavior:
      - if: "config['kv-connector'] in ['NixlConnector', 'NixlPullConnector']"
        then:
          - call: nixl-pull-connector-worker.get-finished
            as: gf
          - return: {finished_sending: "= vars.gf.value.finished_sending", finished_recving: "= vars.gf.value.finished_recving"}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:399"
        return: {finished_sending: null, finished_recving: null}

  - component: kv-connector-base-v1-worker
    name: get-transfer-results
    kind: function
    summary: "get_transfer_results: completed sends and receives plus receive failures, together. The base class wraps get_finished into sets with no failures; NixlConnector returns its worker's results, failures included."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:401-409", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:249-265"]
    attributes: {seam: true, callers: [worker-runner]}
    request: {type: object, properties: {finished_req_ids: {type: array, items: {type: string}, default: []}}}
    response: {type: object, properties: {finished_sending: {type: array}, finished_recving: {type: array}, failed_recving: {type: array}}}
    behavior:
      - if: "config['kv-connector'] in ['NixlConnector', 'NixlPullConnector']"
        then:
          - call: nixl-pull-connector-worker.get-finished
            as: gf
          - return: {finished_sending: "= vars.gf.value.finished_sending", finished_recving: "= vars.gf.value.finished_recving", failed_recving: "= vars.gf.value.failed_recving"}
      - call: kv-connector-base-v1-worker.get-finished
        input: {finished_req_ids: "= input.finished_req_ids"}
        as: bf
      - title: "set(finished or ()) for both directions; no failures"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:405-409"
        return: {finished_sending: "= vars.bf.value.finished_sending == null ? [] : vars.bf.value.finished_sending", finished_recving: "= vars.bf.value.finished_recving == null ? [] : vars.bf.value.finished_recving", failed_recving: []}

  - component: kv-connector-base-v1-worker
    name: get-block-ids-with-load-errors
    kind: function
    summary: "get_block_ids_with_load_errors: block ids whose load failed, for the scheduler to recompute. The base class reports none; NIXL drains the invalid blocks its failed READs recorded."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:411-429", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3525-3540"]
    attributes: {seam: true, callers: [worker-runner]}
    request: {type: object, properties: {}}
    response: {type: array, items: {type: integer}}
    behavior:
      - if: "config['kv-connector'] in ['NixlConnector', 'NixlPullConnector']"
