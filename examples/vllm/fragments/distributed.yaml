  - id: distributed-cpu-offload-store-reset-reload
    name: A finished prompt is stored to CPU; after the GPU prefix cache is reset the same prompt is reloaded from CPU as an async external hit
    description: >-
      The connector-side half of tests/v1/simple_kv_offload/test_integration.py:150. The cold request
      registers for eager stores, its 2010 computed tokens (125 full blocks) are flushed at finish,
      the next step's metadata carries the store event, and the worker's completion caches the
      hashes. The GPU prefix-cache reset (reset_connector=False) leaves the CPU cache alone, so the
      repeated prompt gets 2000 external tokens (the last token is recomputed), loaded asynchronously
      into its new GPU blocks.
    flow: distributed-kv-match
    fixtures: [tp1-llama-8b, distributed-seed]
    config: {kv-connector: SimpleCPUOffloadConnector, kv-role: kv_both}
    steps:
      - {flow: distributed-kv-match, as: cold, input: {request_id: offload-cold, num_prompt_tokens: 2010, num_computed_tokens: 0, block_hashes: "= lists.range(125).map(i, 'h' + string(i))"}}
      - {flow: distributed-kv-alloc, as: alloc1, input: {request_id: offload-cold, num_external_tokens: 0, block_ids: ["= lists.range(126).map(i, i + 1)"]}}
      - {flow: distributed-kv-finished, as: fin1, input: {request_id: offload-cold, status: FINISHED_LENGTH_CAPPED, num_computed_tokens: 2010, block_ids: ["= lists.range(126).map(i, i + 1)"]}}
      - {flow: distributed-kv-meta, as: meta1, input: {scheduled_new_reqs: []}}
      - {flow: distributed-kv-update-output, as: out1, input: {finished_store_events: ["= steps.meta1.result.value.store_event"]}}
      - {flow: distributed-kv-match, as: hit, input: {request_id: offload-hit, num_prompt_tokens: 2010, num_computed_tokens: 0, block_hashes: "= lists.range(125).map(i, 'h' + string(i))"}}
      - {flow: distributed-kv-alloc, as: alloc2, input: {request_id: offload-hit, num_external_tokens: 2000, block_ids: ["= lists.range(126).map(i, i + 200)"]}}
      - {flow: distributed-kv-meta, as: meta2, input: {scheduled_new_reqs: []}}
      - {flow: distributed-kv-update-output, as: out2, input: {finished_recving: [offload-hit]}}
    expect:
      - "steps.cold.result.value.num_external_tokens == 0 && !steps.fin1.result.value.delay_free_blocks"
      - "steps.meta1.result.value.store_event >= 0 && size(steps.meta1.result.value.store_gpu_blocks) == 125 && steps.out1.result.value.cached == 125"
      - "steps.hit.result.value.num_external_tokens == 2000 && steps.hit.result.value.load_async"
      - "steps.meta2.result.value.load_event >= 0 && size(steps.meta2.result.value.load_gpu_blocks) == 125 && steps.meta2.result.value.load_gpu_blocks[0] == 200"
      - "steps.out2.result.value.loaded == ['offload-hit'] && size(state['simple-cpu-offload-connector'].reqs_to_load) == 0"
