        then:
          - source: "vllm/distributed/device_communicators/shm_object_storage.py:223"
            fail: {code: assertion-error, status: 0, message: "Only the writer can allocate buffers."}
      - if: "input.size <= 0"
        then:
          - source: "vllm/distributed/device_communicators/shm_object_storage.py:224"
            fail: {code: assertion-error, status: 0, message: "Size must be greater than 0"}
      - call: posix-shared-memory.open
        input: {name: "= input.name"}
        as: seg
      - set:
          vars.s: "= vars.seg.value"
          vars.sz: "= input.size + 8"
      - set:
          vars.reset: "= vars.s.end % vars.s.data_buffer_size + vars.sz > vars.s.data_buffer_size ? (vars.s.end / vars.s.data_buffer_size + 1) * vars.s.data_buffer_size : vars.s.end"
      - if: "vars.reset + vars.sz - vars.s.start > vars.s.data_buffer_size"
