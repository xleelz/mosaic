  # ---------------------------------------------------------------- NIXL push scheduler
  - component: nixl-push-connector-scheduler
    name: request-finished
    kind: function
    summary: "NixlPushConnectorScheduler.request_finished: no params frees now; stop the heartbeat and drop any registration deadline; a request still marked do_remote_prefill was aborted before scheduling and registers an empty recv; a D-side request is a no-op; an unfinished P-side request is marked not processed. A finished P-side request with blocks keeps them under the lease and stashes them for the workers; with no blocks it frees now. Either way it returns the push parameters for the decoder."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:207-294"]
    request: DistKvRequest
    response: DistKvFinished
    behavior:
      - set:
          vars.p: "= has(input.kv_transfer_params) && input.kv_transfer_params != null ? input.kv_transfer_params : {}"
      - if: "size(vars.p) == 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:223-224"
            return: {delay_free_blocks: false, kv_transfer_params: null}
      - title: Stop the heartbeat and drop the pending registration deadline
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:226-231"
        set:
          vars.is_p: "= 'do_remote_decode' in vars.p && vars.p.do_remote_decode == true"
          state.heartbeats: "= state.heartbeats.filter(r, r != input.request_id)"
          state.push_registration_deadlines: "= state.push_registration_deadlines.transformMapEntry(k, v, k != input.request_id, {k: v})"
      - if: "'do_remote_prefill' in vars.p && vars.p.do_remote_prefill == true"
        then:
          - title: Aborted before it was scheduled; register an empty recv so the worker notifies P to free its blocks
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:233-245"
            set:
              state.reqs_need_recv: "= merge(state.reqs_need_recv, {input.request_id: {'local_block_ids': [], 'remote_block_ids': [], 'park': false}})"
          - return: {delay_free_blocks: false, kv_transfer_params: null}
      - if: "!vars.is_p"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:247-250"
            return: {delay_free_blocks: false, kv_transfer_params: null}
      - if: "!(input.status in ['FINISHED_LENGTH_CAPPED', 'FINISHED_STOPPED'])"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:252-258"
            set:
              state.reqs_not_processed: "= state.reqs_not_processed + [input.request_id]"
              state.reqs_need_save: "= state.reqs_need_save.transformMapEntry(k, v, k != input.request_id, {k: v})"
          - return: {delay_free_blocks: false, kv_transfer_params: null}
      - set:
          vars.blocks: "= has(input.block_ids) ? input.block_ids : []"
      - set:
          vars.delay: "= vars.blocks.exists(g, size(g) > 0)"
      - if: "vars.delay"
        then:
          - title: "Keep the blocks for the lease and stash them for the workers to match with D's registration (get_exchange_clipped_blocks is the identity without sliding-window or Mamba groups)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:262-279"
            set:
              state.reqs_need_send: "= merge(state.reqs_need_send, {input.request_id: now + config['nixl-kv-lease-duration'] * 1000})"
              state.finished_request_blocks: "= merge(state.finished_request_blocks, {input.request_id: vars.blocks})"
              state.newly_finished_push_blocks: "= merge(state.newly_finished_push_blocks, {input.request_id: vars.blocks})"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_scheduler.py:281-294"
        return:
          delay_free_blocks: "= vars.delay"
          kv_transfer_params:
            do_remote_prefill: true
            do_remote_decode: false
            remote_block_ids: "= vars.blocks"
            remote_engine_id: "= state.engine_id"
            remote_request_id: "= input.request_id"
            remote_host: "= state.side_channel_host"
            remote_port: "= state.side_channel_port"
            tp_size: "= state.transfer_tp_size"
            dcp_size: 1
            pp_size: "= config['pipeline-parallel-size']"
            remote_num_tokens: "= vars.delay ? input.num_computed_tokens : 0"
            transfer_mode: push

  # ---------------------------------------------------------------- Mooncake Store config and setup
  - component: mooncake-store-config
    name: load-from-config
    kind: function
    summary: "MooncakeStoreConfig.load_from_config / from_file / __post_init__: read the JSON file named by MOONCAKE_CONFIG_PATH, take defaults for missing keys (rdma, embedded, 4 GiB segment and buffer, no offload, tenant 'default'), parse sizes ('4GB', '512 mb', bytes), normalize the tenant (stripped; empty or null is 'default'), and validate the mode and sizes."
    sources: ["vllm/distributed/mooncake_store.py:40-78", "vllm/distributed/mooncake_store.py:80-123"]
    request: {type: object, properties: {}}
    response: DistMooncakeStoreConfig
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: type-error, status: 0, retryable: false}
      - {code: file-not-found-error, status: 0, retryable: false}
    behavior:
      - if: "!('mooncake-config-path' in config) || config['mooncake-config-path'] == null || config['mooncake-config-path'] == ''"
        then:
          - source: "vllm/distributed/mooncake_store.py:74-77"
            fail: {code: value-error, status: 0, message: "The environment variable 'MOONCAKE_CONFIG_PATH' is not set."}
      - title: json.load(open(path))
        source: "vllm/distributed/mooncake_store.py:52-53"
        call: local-disk.read-file
        input: {path: "= config['mooncake-config-path']"}
        as: f
      - set: {vars.c: "= vars.f.value.json"}
      - title: "_normalize_tenant_id: None is the default; a non-string is a TypeError; stripped, empty is the default"
        source: "vllm/distributed/mooncake_store.py:80-88"
        set:
          vars.t: "= 'tenant_id' in vars.c ? vars.c.tenant_id : 'default'"
      - if: "vars.t != null && type(vars.t) != string"
        then:
          - fail: {code: type-error, status: 0, message: "= 'tenant_id must be a string or null, got ' + (type(vars.t) == int ? 'int' : (type(vars.t) == bool ? 'bool' : 'object')) + ': ' + string(vars.t)"}
      - set:
          vars.tenant: "= vars.t == null || vars.t.trim() == '' ? 'default' : vars.t.trim()"
      - call: mooncake-store-config.parse-size
        input: {value: "= 'global_segment_size' in vars.c ? vars.c.global_segment_size : 4294967296"}
        as: gss
      - call: mooncake-store-config.parse-size
        input: {value: "= 'local_buffer_size' in vars.c ? vars.c.local_buffer_size : 4294967296"}
        as: lbs
      - set:
          vars.cfg:
            metadata_server: "= 'metadata_server' in vars.c ? vars.c.metadata_server : ''"
            master_server_address: "= 'master_server_address' in vars.c ? vars.c.master_server_address : ''"
            protocol: "= 'protocol' in vars.c ? vars.c.protocol : 'rdma'"
            device_name: "= 'device_name' in vars.c ? vars.c.device_name : ''"
            mode: "= 'mode' in vars.c ? vars.c.mode : 'embedded'"
            global_segment_size: "= vars.gss.value.bytes"
            local_buffer_size: "= vars.lbs.value.bytes"
            enable_offload: "= 'enable_offload' in vars.c && vars.c.enable_offload == true"
            tenant_id: "= vars.tenant"
      - title: __post_init__ checks, in order
        source: "vllm/distributed/mooncake_store.py:40-48"
        if: "!(vars.cfg.mode in ['embedded', 'standalone-store'])"
        then:
          - fail: {code: value-error, status: 0, message: "= 'unknown Mooncake mode: \\'' + vars.cfg.mode + '\\''"}
      - if: "vars.cfg.local_buffer_size <= 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:43-44"
            fail: {code: value-error, status: 0, message: "local_buffer_size must be > 0"}
      - if: "vars.cfg.mode == 'embedded' && vars.cfg.global_segment_size == 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:45-46"
            fail: {code: value-error, status: 0, message: "embedded mode requires global_segment_size > 0"}
      - if: "vars.cfg.mode == 'standalone-store' && vars.cfg.global_segment_size != 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:47-48"
            fail: {code: value-error, status: 0, message: "standalone-store mode requires global_segment_size == 0"}
      - return: "= vars.cfg"

  - component: mooncake-store-config
    name: parse-size
    kind: function
    summary: "_parse_size: an int is bytes; a string is a number with an optional unit (gb, mb, kb, b; any case, spaces allowed), times 1024^n."
    sources: ["vllm/distributed/mooncake_store.py:91-123"]
    request: {type: object, required: [value], properties: {value: {}}}
    response: {type: object, properties: {bytes: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "type(input.value) == int"
        then:
          - source: "vllm/distributed/mooncake_store.py:93-94"
            return: {bytes: "= input.value"}
      - set: {vars.c: "= string(input.value).trim().lowerAscii()"}
      - if: "vars.c == ''"
        then:
          - source: "vllm/distributed/mooncake_store.py:101-103"
            fail: {code: value-error, status: 0, message: "Size cannot be empty."}
      - if: "!vars.c.matches('^\\\\s*([0-9.]+)\\\\s*(gb|mb|kb|b)?\\\\s*$')"
        then:
          - source: "vllm/distributed/mooncake_store.py:111-113"
            fail: {code: value-error, status: 0, message: "= 'Invalid format: \\'' + string(input.value) + '\\''"}
      - set:
          vars.unit: "= vars.c.endsWith('gb') ? 'gb' : (vars.c.endsWith('mb') ? 'mb' : (vars.c.endsWith('kb') ? 'kb' : 'b'))"
      - set:
          vars.num: "= vars.c.endsWith(vars.unit) ? vars.c.substring(0, size(vars.c) - size(vars.unit)).trim() : vars.c"
      - if: "!vars.num.matches('^[0-9]*\\\\.?[0-9]+$')"
        then:
          - source: "vllm/distributed/mooncake_store.py:119-122"
            fail: {code: value-error, status: 0, message: "= 'Invalid numeric value \\'' + vars.num + '\\' in: \\'' + string(input.value) + '\\''"}
      - source: "vllm/distributed/mooncake_store.py:105-123"
        return: {bytes: "= int(double(vars.num) * double({'gb': 1073741824, 'mb': 1048576, 'kb': 1024, 'b': 1}[vars.unit]))"}

  - component: mooncake-store-config
    name: setup-mooncake-store
    kind: function
    summary: "setup_mooncake_store: call store.setup(local_hostname, metadata_server, global_segment_size, local_buffer_size, protocol, device_name, master_server_address), adding tenant_id as a keyword only when it isn't 'default'; a non-zero return fails."
    sources: ["vllm/distributed/mooncake_store.py:126-143"]
    request: {type: object, required: [config, local_hostname], properties: {config: DistMooncakeStoreConfig, local_hostname: {type: string}}}
    response: {type: object, properties: {args: {type: array}, kwargs: {type: object}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - title: "Only an explicit tenant is forwarded, so older Mooncake builds without the keyword keep working"
        source: "vllm/distributed/mooncake_store.py:130-132"
        set:
          vars.kwargs: "= input.config.tenant_id != 'default' ? {'tenant_id': input.config.tenant_id} : {}"
          vars.args: "= [(has(input.local_hostname) ? input.local_hostname : '127.0.0.1'), input.config.metadata_server, input.config.global_segment_size, input.config.local_buffer_size, input.config.protocol, input.config.device_name, input.config.master_server_address]"
      - source: "vllm/distributed/mooncake_store.py:133-142"
        call: mooncake-distributed-store.setup
        input: {args: "= vars.args", kwargs: "= vars.kwargs"}
        as: r
      - if: "vars.r.value.ret != 0"
        then:
          - source: "vllm/distributed/mooncake_store.py:142-143"
            fail: {code: runtime-error, status: 0, message: "Initialize MooncakeDistributedStore failed."}
      - return: {args: "= vars.args", kwargs: "= vars.kwargs"}

  - component: mooncake-distributed-store
    name: setup
    kind: function
    summary: "MooncakeDistributedStore.setup (native): records the call and returns the configured code (0 = success)."
    sources: ["vllm/distributed/mooncake_store.py:133-141"]
    request: {type: object, properties: {args: {type: array}, kwargs: {type: object}}}
    response: {type: object, properties: {ret: {type: integer}}}
    behavior:
      - set: {state.setup_calls: "= state.setup_calls + [{'args': input.args, 'kwargs': input.kwargs}]"}
      - return: {ret: "= state.setup_ret"}

  - component: mooncake-store-worker
    name: init-store
    kind: function
    summary: "MooncakeStoreWorker.__init__ (the store part): load the Mooncake Store config, build a MooncakeDistributedStore with its own transfer engine, and set it up from this host's requester hostname (the tenant forwarded when non-default)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:1413-1422", "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:1443-1452"]
    request: {type: object, properties: {local_hostname: {type: string, default: "127.0.0.1", description: "rdma_utils.get_requester_local_hostname(get_ip())"}}}
    response: {type: object, properties: {mode: {type: string}, tenant_id: {type: string}, setup_kwargs: {type: object}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: type-error, status: 0, retryable: false}
      - {code: file-not-found-error, status: 0, retryable: false}
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:1413"
        call: mooncake-store-config.load-from-config
        as: cfg
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:1418-1422"
        call: mooncake-store-config.setup-mooncake-store
        input: {config: "= vars.cfg.value", local_hostname: "= (has(input.local_hostname) ? input.local_hostname : '127.0.0.1')"}
        as: s
      - return: {mode: "= vars.cfg.value.mode", tenant_id: "= vars.cfg.value.tenant_id", setup_kwargs: "= vars.s.value.kwargs"}

  - component: mooncake-embedding-store-client
    name: create
    kind: function
    summary: "create_mooncake_embedding_store_client: load the shared Mooncake Store config, refuse an SSD-offload config (the cross-encoder cache is a RAM store), and set the store up like the KV client (tenant forwarded when non-default)."
    sources: ["vllm/distributed/ec_transfer/ec_connector/mooncake_store_embedding/store_client.py:87-123"]
    request: {type: object, properties: {local_hostname: {type: string, default: "127.0.0.1"}, read_buffer_bytes: {type: integer, default: 134217728}}}
    response: {type: object, properties: {mode: {type: string}, read_buffer_bytes: {type: integer}, setup_kwargs: {type: object}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: type-error, status: 0, retryable: false}
      - {code: file-not-found-error, status: 0, retryable: false}
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - source: "vllm/distributed/ec_transfer/ec_connector/mooncake_store_embedding/store_client.py:104"
        call: mooncake-store-config.load-from-config
        as: cfg
      - if: "vars.cfg.value.enable_offload"
        then:
          - source: "vllm/distributed/ec_transfer/ec_connector/mooncake_store_embedding/store_client.py:105-108"
            fail: {code: value-error, status: 0, message: "cross_encoder_cache supports a RAM Store; disable enable_offload"}
      - source: "vllm/distributed/ec_transfer/ec_connector/mooncake_store_embedding/store_client.py:109-111"
        call: mooncake-store-config.setup-mooncake-store
        input: {config: "= vars.cfg.value", local_hostname: "= (has(input.local_hostname) ? input.local_hostname : '127.0.0.1')"}
        as: s
      - return: {mode: "= vars.cfg.value.mode", read_buffer_bytes: "= (has(input.read_buffer_bytes) ? input.read_buffer_bytes : 134217728)", setup_kwargs: "= vars.s.value.kwargs"}

  # ---------------------------------------------------------------- nccl_m2n trainer init info
  - component: m2n-trainer-init-info
    name: post-init
    kind: function
    summary: "M2NTrainerInitInfo.__post_init__: first the rendezvous mode (a pre-shared 128-byte base64 unique id, or both master_address and master_port, not both), then 0 < num_trainer_ranks < world_size, a two-dim dst_mesh_dims covering the inference workers, and 0 <= rank < num_trainer_ranks."
    sources: ["vllm/distributed/weight_transfer/m2n_trainer.py:93-122", "vllm/distributed/weight_transfer/nccl_common.py:32-68"]
    request:
      type: object
      required: [world_size, rank]
      properties:
        master_address: {type: [string, "null"], default: null}
        master_port: {type: [integer, "null"], default: null}
        world_size: {type: integer, examples: [4]}
        num_trainer_ranks: {type: integer, default: 1}
        dst_mesh_dims: {type: [array, "null"], default: null, items: {type: integer}}
        rank: {type: integer, examples: [0]}
        nccl_unique_id_b64: {type: [string, "null"], default: null}
    response: {type: object, properties: {destination_mesh_dims: {type: array, items: {type: integer}}, num_workers: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.has_uid: "= (has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null) != null && (has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null) != ''"
          vars.has_addr: "= (has(input.master_address) ? input.master_address : null) != null"
          vars.has_port: "= (has(input.master_port) ? input.master_port : null) != null"
      - title: "decode_nccl_unique_id(ctx='M2NTrainerInitInfo'), via the nccl_unique_id_bytes property"
        source: "vllm/distributed/weight_transfer/nccl_common.py:44-47"
        if: "vars.has_uid && (vars.has_addr || vars.has_port)"
        then:
          - fail: {code: value-error, status: 0, message: "M2NTrainerInitInfo: pass nccl_unique_id_b64 OR master_address/master_port, not both"}
      - if: "!vars.has_uid && !(vars.has_addr && vars.has_port)"
        then:
          - source: "vllm/distributed/weight_transfer/nccl_common.py:48-54"
            fail: {code: value-error, status: 0, message: "= 'M2NTrainerInitInfo: need nccl_unique_id_b64, or both master_address and master_port (got master_address=' + (vars.has_addr ? '\\'' + (has(input.master_address) ? input.master_address : null) + '\\'' : 'None') + ', master_port=' + (vars.has_port ? string((has(input.master_port) ? input.master_port : null)) : 'None') + ')'"}
      - if: "vars.has_uid"
        then:
          - if: "size((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null)) % 4 != 0 || !(has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null).matches('^[A-Za-z0-9+/]*={0,2}$')"
            then:
              - source: "vllm/distributed/weight_transfer/nccl_common.py:56-62"
                fail: {code: value-error, status: 0, message: "M2NTrainerInitInfo: nccl_unique_id_b64 is not valid standard base64 (URL-safe base64 is not accepted)"}
          - set:
              vars.nbytes: "= size((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null)) / 4 * 3 - ((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null).endsWith('==') ? 2 : ((has(input.nccl_unique_id_b64) ? input.nccl_unique_id_b64 : null).endsWith('=') ? 1 : 0))"
          - if: "vars.nbytes != 128"
            then:
              - source: "vllm/distributed/weight_transfer/nccl_common.py:63-67"
                fail: {code: value-error, status: 0, message: "= 'M2NTrainerInitInfo: nccl_unique_id_b64 must decode to 128 bytes, got ' + string(vars.nbytes)"}
      - if: "!(0 < (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1) && (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1) < input.world_size)"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_trainer.py:96-100"
            fail: {code: value-error, status: 0, message: "= '`num_trainer_ranks` (' + string((has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1)) + ') must leave at least one worker in world_size ' + string(input.world_size)"}
      - set: {vars.nw: "= input.world_size - (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1)"}
      - if: "(has(input.dst_mesh_dims) ? input.dst_mesh_dims : null) != null && (size((has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)) != 2 || (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)[0] * (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)[size((has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)) - 1] != vars.nw)"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_trainer.py:101-108"
            fail: {code: value-error, status: 0, message: "= '`dst_mesh_dims` (' + (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null).map(d, string(d)).join(', ') + (size((has(input.dst_mesh_dims) ? input.dst_mesh_dims : null)) == 1 ? ',' : '') + ') must be two dims covering the ' + string(vars.nw) + ' inference workers'"}
      - if: "!(0 <= input.rank && input.rank < (has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1))"
        then:
          - source: "vllm/distributed/weight_transfer/m2n_trainer.py:109-113"
            fail: {code: value-error, status: 0, message: "= 'trainer `rank` (' + string(input.rank) + ') must be below `num_trainer_ranks` (' + string((has(input.num_trainer_ranks) ? input.num_trainer_ranks : 1)) + ')'"}
      - source: "vllm/distributed/weight_transfer/m2n_trainer.py:86-91"
        return: {destination_mesh_dims: "= (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null) != null ? (has(input.dst_mesh_dims) ? input.dst_mesh_dims : null) : [vars.nw, 1]", num_workers: "= vars.nw"}

  # ---------------------------------------------------------------- the EPLB group
  - component: parallel-state
    name: get-eplb-group
    kind: function
    latency_ms: 0
    summary: "get_eplb_group: the EPLB GroupCoordinator, built by initialize_model_parallel over the EP ranks when EPLB is enabled for an MoE model. A started world whose recorded groups omit it has it when enable-eplb (its size is the EP size, DP x TP)."
    sources: ["vllm/distributed/parallel_state.py:1666-1672", "vllm/distributed/parallel_state.py:2324-2346"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {world_size: {type: integer}, unique_name: {type: string}, rank_in_group: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "'eplb' in state.groups"
        then:
          - set: {vars.g: "= state.groups.eplb"}
        else:
          - if: "!(state.mp_initialized && config['enable-eplb'])"
            then:
              - source: "vllm/distributed/parallel_state.py:1667-1671"
                fail: {code: assertion-error, status: 0, message: "EPLB group is not initialized. EPLB group is only created for MoE models when EPLB is enabled. Ensure parallel_config.enable_eplb is True."}
          - title: The startup group the world's recorded groups leave out spans the EP ranks (DP x TP)
            source: "vllm/distributed/parallel_state.py:2324-2346"
            set:
              vars.g: "= {'world_size': ('ep' in state.groups ? state.groups.ep.world_size : config['data-parallel-size'] * config['tensor-parallel-size']), 'unique_name': 'eplb:0'}"
      - return: {world_size: "= vars.g.world_size", unique_name: "= vars.g.unique_name", rank_in_group: "= int(self.replace('rank', '')) % vars.g.world_size"}

  # ---------------------------------------------------------------- EplbState
  - component: eplb-state
    name: add-model
    kind: function
    latency_ms: 0
    summary: "EplbState.add_model: check the model's expert configuration against already-registered models, lay out the initial map (routed experts, then redundant replicas round-robin), set the rearrangement step to 3/4 of the interval, and build the model's EPLB communicator on the EPLB group."
    sources: ["vllm/distributed/eplb/eplb_state.py:362-526", "vllm/distributed/eplb/eplb_state.py:300-360"]
    request:
      type: object
      properties:
        model: {type: string, examples: [mistralai/Mixtral-8x7B-Instruct-v0.1]}
        model_name: {type: [string, "null"], default: null}
        model_class: {type: string, default: vllm.model_executor.models.mixtral.MixtralForCausalLM}
        num_routed_experts: {type: integer, default: 8, description: "MixtureOfExperts.num_routed_experts (Mixtral's num_local_experts)"}
        num_redundant_experts: {type: [integer, "null"], default: null, description: "null reads eplb_config.num_redundant_experts (config num-redundant-experts)"}
        num_moe_layers: {type: integer, default: 32}
        num_expert_groups: {type: integer, default: 1}
    response:
      type: object
      properties:
        model: {type: string}
        num_physical_experts: {type: integer}
        num_local_physical_experts: {type: integer}
        expert_rearrangement_step: {type: integer}
        communicator: {type: string}
        is_async: {type: boolean}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.args: "= merge({'model_name': null, 'model_class': 'vllm.model_executor.models.mixtral.MixtralForCausalLM', 'num_routed_experts': 8, 'num_redundant_experts': null, 'num_moe_layers': 32, 'num_expert_groups': 1}, input)"}
      - set:
          vars.cfg: "= config['eplb-config'] == null ? {} : config['eplb-config']"
          vars.name: "= vars.args.model_name != null ? vars.args.model_name : vars.args.model"
          vars.red: "= vars.args.num_redundant_experts != null ? vars.args.num_redundant_experts : config['num-redundant-experts']"
      - set:
          vars.phys: "= vars.args.num_routed_experts + vars.red"
          vars.window: "= has(vars.cfg.window_size) ? vars.cfg.window_size : 1000"
          vars.interval: "= has(vars.cfg.step_interval) ? vars.cfg.step_interval : 3000"
          vars.use_async: "= has(vars.cfg.use_async) ? vars.cfg.use_async : true"
      - title: validate_ep_configuration against the first registered model (the drafter must match the main model)
        source: "vllm/distributed/eplb/eplb_state.py:320-360"
        if: "size(state.models) > 0"
        then:
          - set: {vars.m0: "= state.models[state.models.map(k, k)[0]]"}
          - if: "vars.m0.num_routed_experts != vars.args.num_routed_experts || vars.m0.num_redundant_experts != vars.red || vars.m0.num_physical_experts != vars.phys || vars.m0.num_logical_experts != vars.args.num_routed_experts || vars.m0.num_expert_groups != vars.args.num_expert_groups"
            then:
              - fail: {code: runtime-error, status: 0, message: "= \"Model: <class '\" + vars.m0.model_class + \"'> with config \" + string(vars.m0.num_routed_experts) + ' ' + string(vars.m0.num_redundant_experts) + ' ' + string(vars.m0.num_physical_experts) + ' ' + string(vars.m0.num_logical_experts) + ' ' + string(vars.m0.num_expert_groups) + \" mismatch with new model <class '\" + vars.args.model_class + \"'> with config \" + string(vars.args.num_routed_experts) + ' ' + string(vars.red) + ' ' + string(vars.phys) + ' ' + string(vars.args.num_routed_experts) + ' ' + string(vars.args.num_expert_groups)"}
      - title: "MAX_EXPERT_REDUNDANCY = 1023"
        source: "vllm/distributed/eplb/eplb_state.py:398-404"
        if: "vars.red > 1023"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'num_redundant_experts ' + string(vars.red) + ' must be less than or equal to 1023'"}
      - title: Every EP rank holds the same number of physical experts
        source: "vllm/distributed/eplb/rebalance_execute.py:715"
        call: parallel-state.get-eplb-group
        as: g
      - set:
          vars.size: "= vars.g.value.world_size"
          vars.rank: "= vars.g.value.rank_in_group"
          vars.nle: "= vars.phys / vars.g.value.world_size"
      - title: "Initial map: [routed experts..., redundant i -> logical i % num_routed], the same for every MoE layer"
        source: "vllm/distributed/eplb/eplb_state.py:300-318"
        set:
          vars.p2l: "= lists.range(vars.phys).map(p, p < vars.args.num_routed_experts ? p : (p - vars.args.num_routed_experts) % vars.args.num_routed_experts)"
      - set:
          vars.counts: "= lists.range(vars.args.num_routed_experts).map(e, vars.p2l.filter(x, x == e).size())"
          vars.local: "= lists.range(vars.nle).map(s, vars.p2l[vars.rank * vars.nle + s])"
      - title: The communicator backend ParallelConfig resolved (auto prefers nixl, else torch_gloo for static EP)
        source: "vllm/config/parallel.py:1097-1115"
        set:
          vars.backend: "= has(vars.cfg.communicator) && vars.cfg.communicator != null ? vars.cfg.communicator : (config['nixl-available'] ? 'nixl' : 'torch_gloo')"
      - title: "is_async, window size and the first rearrangement 3/4 of the interval in: max(0, step_interval - step_interval // 4)"
        source: "vllm/distributed/eplb/eplb_state.py:370-371,455-469"
        set:
          state.is_async: "= vars.use_async"
          state.expert_load_window_size: "= vars.window"
          state.expert_rearrangement_step: "= math.greatest(0, vars.interval - vars.interval / 4)"
          state.expert_rearrangement_step_interval: "= vars.interval"
      - title: create_eplb_communicator on the EPLB group with the model's expert weights and buffer
        source: "vllm/distributed/eplb/eplb_state.py:493-502"
        call: eplb-communicator.create
        input: {backend: "= vars.backend"}
        as: comm
      - source: "vllm/distributed/eplb/eplb_state.py:504-526"
        set:
          state.communicator: "= vars.comm.value.class_name"
          state.models: "= merge(state.models, {vars.name: {'model_class': vars.args.model_class, 'num_routed_experts': vars.args.num_routed_experts, 'num_redundant_experts': vars.red, 'num_logical_experts': vars.args.num_routed_experts, 'num_physical_experts': vars.phys, 'num_local_physical_experts': vars.nle, 'num_moe_layers': vars.args.num_moe_layers, 'num_expert_groups': vars.args.num_expert_groups, 'physical_to_logical_map': lists.range(vars.args.num_moe_layers).map(l, vars.p2l), 'logical_replica_count': lists.range(vars.args.num_moe_layers).map(l, vars.counts), 'expert_weights': lists.range(vars.args.num_moe_layers).map(l, vars.local), 'expert_load_pass': lists.range(vars.args.num_moe_layers).map(l, lists.range(vars.phys).map(p, 0)), 'expert_load_window': {}, 'last_expert_load': lists.range(vars.args.num_moe_layers).map(l, lists.range(vars.args.num_routed_experts).map(e, 1)), 'rebalanced': false, 'pending': null}})"
      - return:
          model: "= vars.name"
          num_physical_experts: "= vars.phys"
          num_local_physical_experts: "= vars.nle"
          expert_rearrangement_step: "= state.expert_rearrangement_step"
          communicator: "= vars.comm.value.class_name"
          is_async: "= vars.use_async"

  - component: eplb-state
    name: start-async-loop
    kind: function
    latency_ms: 0
    summary: "EplbState.start_async_loop: in async mode start the daemon thread (once) that waits for rearrange_event and transfers the new expert weights layer by layer; a no-op in sync mode."
    sources: ["vllm/distributed/eplb/eplb_state.py:980-991", "vllm/distributed/eplb/async_worker.py:23-46"]
    request: {type: object, properties: {is_profile: {type: boolean, default: false}}}
    response: {type: object, properties: {started: {type: boolean}}}
    behavior:
      - if: "!state.is_async"
        then:
          - source: "vllm/distributed/eplb/eplb_state.py:985-986"
            return: {started: false}
      - if: "state.async_worker"
        then:
          - return: {started: false}
      - title: "start_async_worker: threading.Thread(target=transfer_run_periodically, daemon=True)"
        source: "vllm/distributed/eplb/async_worker.py:44-46"
        set: {state.async_worker: true}
      - return: {started: true}

  - component: eplb-state
    name: record-expert-load
    kind: function
    latency_ms: 0
    summary: "The MoE layers' load recording that EplbState reads: during a forward each layer adds the tokens routed to each physical expert to expert_load_pass (layers record only while should_record_tensor is set)."
    sources: ["vllm/distributed/eplb/eplb_state.py:1192-1225", "vllm/distributed/eplb/eplb_state.py:528-559"]
    request:
      type: object
      required: [load]
      properties:
        model: {type: [string, "null"], default: null}
        load: {type: array, description: "[layer][physical expert] tokens routed in this forward on this rank", examples: [[[3, 1, 0, 0, 2, 2, 0, 0]]]}
    response: {type: object, properties: {recorded: {type: boolean}}}
    behavior:
      - set: {vars.args: "= merge({'model': null}, input)"}
      - if: "size(state.models) == 0"
        then:
          - return: {recorded: false}
      - set: {vars.name: "= vars.args.model != null ? vars.args.model : state.models.map(k, k)[0]"}
      - set: {vars.m: "= state.models[vars.name]"}
      - set:
          vars.pass: "= lists.range(vars.m.num_moe_layers).map(l, lists.range(vars.m.num_physical_experts).map(p, vars.m.expert_load_pass[l][p] + (l < size(vars.args.load) && p < size(vars.args.load[l]) ? vars.args.load[l][p] : 0)))"
      - set:
          state.models: "= merge(state.models, {vars.name: merge(vars.m, {'expert_load_pass': vars.pass})})"
      - return: {recorded: true}

  - component: eplb-state
    name: step
    kind: function
    latency_ms: 0
    summary: "EplbState.step, once per forward: a profile step runs a dummy rearrangement; otherwise record the load pass into the sliding window when close to a rearrangement, advance the step, consume the async worker's finished layer when every rank has one, and rearrange when the step reaches step_interval."
    sources: ["vllm/distributed/eplb/eplb_state.py:561-695"]
    request:
      type: object
      properties:
        is_dummy: {type: boolean, default: false}
        is_profile: {type: boolean, default: false}
        log_stats: {type: boolean, default: false}
    response:
      type: object
      properties:
        expert_rearrangement_step: {type: integer}
        rearranged: {type: boolean}
        layer_committed: {type: [integer, "null"]}
        log: {type: [string, "null"]}
    errors:
      - {code: dist-backend-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.args: "= merge({'is_dummy': false, 'is_profile': false, 'log_stats': false}, input)"}
      - if: "vars.args.is_profile"
        then:
          - title: "A profile step performs a dummy rearrangement with maximum communication cost to reserve the buffers"
            source: "vllm/distributed/eplb/eplb_state.py:587-589"
            call: eplb-state.rearrange
            input: {is_profile: true}
            as: prof
          - return: {expert_rearrangement_step: "= state.expert_rearrangement_step", rearranged: false, layer_committed: null, log: "= vars.prof.value.log"}
      - set:
          vars.cfg: "= config['eplb-config'] == null ? {} : config['eplb-config']"
          vars.log: null
          vars.committed: null
      - set:
          vars.log_interval: "= has(vars.cfg.log_balancedness_interval) ? vars.cfg.log_balancedness_interval : 1"
      - if: "vars.args.is_dummy"
        then:
          - title: Dummy steps don't count their load
            source: "vllm/distributed/eplb/eplb_state.py:591-594"
            set:
              state.models: "= state.models.transformMap(k, m, merge(m, {'expert_load_pass': m.expert_load_pass.map(row, row.map(x, 0))}))"
      - if: "vars.args.log_stats && state.expert_rearrangement_step % vars.log_interval == 0 && size(state.models) > 0"
        then:
          - call: parallel-state.get-eplb-group
            as: lg
          - title: "_sync_load_pass: all-reduce every model's expert_load_pass over the EP group"
            source: "vllm/distributed/eplb/eplb_state.py:1078-1086"
            rendezvous: "= 'eplb-load-pass:' + vars.lg.value.unique_name"
            count: "= vars.lg.value.world_size"
            value: "= state.models.map(k, state.models[k].expert_load_pass)"
            timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
            as: lp
            on_error:
              - fail: {code: dist-backend-error, status: 0, message: "= 'all_reduce timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
          - set:
              vars.name0: "= state.models.map(k, k)[0]"
              vars.m0: "= state.models[state.models.map(k, k)[0]]"
          - set:
              vars.sum: "= lists.range(vars.m0.num_moe_layers).map(l, lists.range(vars.m0.num_physical_experts).map(p, sum(vars.lp.values.map(v, v[0][l][p]))))"
              vars.n: "= vars.lg.value.world_size"
          - title: "Per layer, tokens per rank; avg_tokens sums the per-layer means, max_tokens the per-layer maxima"
            source: "vllm/distributed/eplb/eplb_state.py:600-628"
            set:
              vars.per_rank: "= vars.sum.map(row, lists.range(vars.n).map(r, sum(row.slice(r * (size(row) / vars.n), (r + 1) * (size(row) / vars.n)))))"
          - set:
              vars.avg: "= sum(vars.per_rank.map(rr, double(sum(rr)) / double(vars.n)))"
              vars.max: "= sum(vars.per_rank.map(rr, math.greatest(rr)))"
          - if: "vars.lg.value.rank_in_group == 0"
            then:
              - title: "EPLB step: %d for model %s: avg_tokens=%.2f, max_tokens=%d, balancedness=%.4f, steps until the next rearrangement: %d"
                source: "vllm/distributed/eplb/eplb_state.py:630-642"
                set:
                  vars.log: "= 'EPLB step: ' + string(state.expert_rearrangement_step) + ' for model ' + vars.name0 + ': avg_tokens=' + '%.2f'.format([vars.avg]) + ', max_tokens=' + string(int(vars.max)) + ', balancedness=' + '%.4f'.format([vars.max > 0 ? vars.avg / double(vars.max) : 0.0]) + ', steps until the next rearrangement: ' + string(state.expert_rearrangement_step_interval - state.expert_rearrangement_step)"
      - if: "!vars.args.is_dummy"
        then:
          - title: "Record the pass into the window only within window_size steps of the next rearrangement (or of the next balancedness log)"
            source: "vllm/distributed/eplb/eplb_state.py:645-656,697-717"
            set:
              vars.should_record: "= (state.expert_rearrangement_step_interval - state.expert_rearrangement_step <= state.expert_load_window_size) || (vars.args.log_stats && ((vars.log_interval - state.expert_rearrangement_step % vars.log_interval) % vars.log_interval) <= state.expert_load_window_size)"
          - if: "vars.should_record"
            then:
              - set:
                  state.models: "= state.models.transformMap(k, m, merge(m, {'expert_load_window': merge(m.expert_load_window, {string(state.expert_load_window_step): m.expert_load_pass}), 'expert_load_pass': m.expert_load_pass.map(row, row.map(x, 0))}))"
                  state.expert_load_window_step: "= (state.expert_load_window_step + 1) >= state.expert_load_window_size ? 0 : state.expert_load_window_step + 1"
      - title: "The step advances even for dummy steps, so every rank takes part in the same collectives"
        source: "vllm/distributed/eplb/eplb_state.py:658-662"
        set: {state.expert_rearrangement_step: "= state.expert_rearrangement_step + 1"}
      - if: "state.is_async"
        then:
          - foreach: "= state.models.map(k, k)"
            as: mk
            steps:
              - if: "state.models[vars.mk].rebalanced && state.models[vars.mk].pending != null"
                then:
                  - call: eplb-state.consume-async-layer
                    input: {model: "= vars.mk"}
                    as: cons
                  - set: {vars.committed: "= vars.cons.value.layer_committed"}
      - if: "state.expert_rearrangement_step >= state.expert_rearrangement_step_interval"
        then:
          - if: "state.is_async && state.models.exists(k, state.models[k].rebalanced)"
            then:
              - title: Still rearranging asynchronously; the step counter is not reset
                source: "vllm/distributed/eplb/eplb_state.py:678-688"
                return: {expert_rearrangement_step: "= state.expert_rearrangement_step", rearranged: false, layer_committed: "= vars.committed", log: "= vars.log"}
          - source: "vllm/distributed/eplb/eplb_state.py:689-690"
            set: {state.expert_rearrangement_step: "= state.expert_rearrangement_step >= state.expert_rearrangement_step_interval ? 0 : state.expert_rearrangement_step"}
          - call: eplb-state.rearrange
            input: {is_profile: false}
            as: re
          - return: {expert_rearrangement_step: 0, rearranged: true, layer_committed: "= vars.committed", log: "= vars.re.value.log"}
      - return: {expert_rearrangement_step: "= state.expert_rearrangement_step", rearranged: false, layer_committed: "= vars.committed", log: "= vars.log"}

  - component: eplb-state
    name: rearrange
    kind: function
    latency_ms: 0
    summary: "EplbState.rearrange: all-reduce every model's logical expert load over the window across the EP group; in sync mode (or for the profile run) run the policy and rearrange_expert_weights_inplace now, committing the new maps unless profiling; in async mode snapshot the stats, mark the model rebalanced and wake the async worker."
    sources: ["vllm/distributed/eplb/eplb_state.py:758-978"]
    request:
      type: object
      properties:
        is_profile: {type: boolean, default: false}
        use_last_expert_load: {type: boolean, default: false}
    response:
      type: object
      properties:
        log: {type: [string, "null"]}
        new_physical_to_logical_map: {type: [array, "null"]}
        committed: {type: boolean}
    errors:
      - {code: dist-backend-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.args: "= merge({'is_profile': false, 'use_last_expert_load': false}, input)"}
      - call: parallel-state.get-eplb-group
        as: g
      - set:
          vars.rank: "= vars.g.value.rank_in_group"
          vars.size: "= vars.g.value.world_size"
          vars.t0: "= now"
          vars.newmap: null
      - title: "Rearranging experts (async mode) (profile)..."
        source: "vllm/distributed/eplb/eplb_state.py:785-790"
        when: "vars.rank == 0 && state.is_async && vars.args.is_profile"
      - title: "Rearranging experts (async mode) ..."
        source: "vllm/distributed/eplb/eplb_state.py:785-790"
        when: "vars.rank == 0 && state.is_async && !vars.args.is_profile"
      - title: "Rearranging experts sync mode (profile)..."
        source: "vllm/distributed/eplb/eplb_state.py:785-790"
        when: "vars.rank == 0 && !state.is_async && vars.args.is_profile"
      - title: "Rearranging experts sync mode ..."
        source: "vllm/distributed/eplb/eplb_state.py:785-790"
        when: "vars.rank == 0 && !state.is_async && !vars.args.is_profile"
      - title: "Map the window's physical load to logical experts (summed over the window), or use rank 0's last totals"
        source: "vllm/distributed/eplb/eplb_state.py:792-822"
        set:
          vars.local_loads: "= state.models.map(k, vars.args.use_last_expert_load ? (vars.rank == 0 ? state.models[k].last_expert_load : state.models[k].last_expert_load.map(row, row.map(x, 0))) : lists.range(state.models[k].num_moe_layers).map(l, lists.range(state.models[k].num_logical_experts).map(e, sum(state.models[k].expert_load_window.map(w, sum(lists.range(state.models[k].num_physical_experts).filter(p, state.models[k].physical_to_logical_map[l][p] == e).map(p, state.models[k].expert_load_window[w][l][p])))))))"
      - title: "_allreduce_list: the logical loads summed over the EP group"
        source: "vllm/distributed/eplb/eplb_state.py:823-824,1053-1076"
        rendezvous: "= 'eplb-load:' + vars.g.value.unique_name"
        count: "= vars.size"
        value: "= vars.local_loads"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: ar
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'all_reduce timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - set:
          vars.names: "= state.models.map(k, k)"
          vars.committed: false
      - set:
          vars.global: "= lists.range(size(vars.names)).map(i, lists.range(size(vars.local_loads[i])).map(l, lists.range(size(vars.local_loads[i][l])).map(e, sum(vars.ar.values.map(v, v[i][l][e])))))"
      - title: "num_nodes = get_node_count() (one node in every world), num_gpus = the EP size; num_replicas and num_groups from the first model"
        source: "vllm/distributed/eplb/eplb_state.py:826-855"
      - foreach: "= lists.range(size(vars.names))"
        as: i
        steps:
          - set:
              vars.mk: "= vars.names[vars.i]"
              vars.m: "= state.models[vars.names[vars.i]]"
          - if: "!vars.args.is_profile"
            then:
              - source: "vllm/distributed/eplb/eplb_state.py:861-862"
                set:
                  state.models: "= merge(state.models, {vars.mk: merge(vars.m, {'last_expert_load': vars.global[vars.i]})})"
          - if: "!state.is_async || vars.args.is_profile"
            then:
              - title: The policy runs on the host with the load window and the current map
                source: "vllm/distributed/eplb/eplb_state.py:863-874"
                call: eplb-policy.rebalance-experts
                input:
                  weight: "= vars.global[vars.i]"
                  num_replicas: "= vars.m.num_physical_experts"
                  num_groups: "= vars.m.num_expert_groups"
                  num_nodes: 1
                  num_ranks: "= vars.size"
                  old_global_expert_indices: "= vars.m.physical_to_logical_map"
                as: pol
              - title: "(The ROCm skip-if-no-material-gain check applies only on ROCm; the worlds are CUDA)"
                source: "vllm/distributed/eplb/eplb_state.py:876-935"
              - source: "vllm/distributed/eplb/eplb_state.py:937-947"
                call: rebalance-execute.rearrange-expert-weights-inplace
                input:
                  old_global_expert_indices: "= vars.m.physical_to_logical_map"
                  new_global_expert_indices: "= vars.pol.value.phy2log"
                  expert_weights: "= vars.m.expert_weights"
                  is_profile: "= vars.args.is_profile"
                  ep_rank: "= vars.rank"
                  ep_size: "= vars.size"
                as: rw
              - if: "!vars.args.is_profile"
                then:
                  - title: "_commit_eplb_maps: the new map (and the logical maps derived from it) becomes current"
                    source: "vllm/distributed/eplb/eplb_state.py:949-953,1388-1424"
                    set:
                      state.models: "= merge(state.models, {vars.mk: merge(state.models[vars.mk], {'physical_to_logical_map': vars.pol.value.phy2log, 'logical_replica_count': vars.pol.value.phy2log.map(row, lists.range(state.models[vars.mk].num_logical_experts).map(e, row.filter(x, x == e).size())), 'expert_weights': vars.rw.value.expert_weights})})"
                      vars.committed: true
              - set: {vars.newmap: "= vars.pol.value.phy2log"}
            else:
              - title: "Async: snapshot the global load window (EplbStats) and mark the model rebalanced for the async worker"
                source: "vllm/distributed/eplb/eplb_state.py:965-976"
                set:
                  state.models: "= merge(state.models, {vars.mk: merge(state.models[vars.mk], {'rebalanced': true})})"
              - title: "The async worker, woken by rearrange_event, snapshots the current map and runs the policy (run_rebalance_experts); it then transfers one layer per forward"
                source: "vllm/distributed/eplb/async_worker.py:49-73,79-97"
                call: eplb-policy.rebalance-experts
                input:
                  weight: "= vars.global[vars.i]"
                  num_replicas: "= vars.m.num_physical_experts"
                  num_groups: "= vars.m.num_expert_groups"
                  num_nodes: 1
                  num_ranks: "= vars.size"
                  old_global_expert_indices: "= vars.m.physical_to_logical_map"
                as: apol
              - set:
                  state.models: "= merge(state.models, {vars.mk: merge(state.models[vars.mk], {'pending': {'new_physical_to_logical_map': vars.apol.value.phy2log, 'old_physical_to_logical_map': state.models[vars.mk].physical_to_logical_map, 'layer_idx': 0}})})"
                  vars.newmap: "= vars.apol.value.phy2log"
      - if: "vars.rank == 0 && (!state.is_async || vars.args.is_profile)"
        then:
          - title: "Rearranged experts %s in %.2f s. (' (profile) ' when profiling, else ' ')"
            source: "vllm/distributed/eplb/eplb_state.py:954-962"
            set:
              vars.log: "= 'Rearranged experts ' + (vars.args.is_profile ? ' (profile) ' : ' ') + ' in ' + '%.2f'.format([double(now - vars.t0) / 1000.0]) + ' s.'"
        else:
          - set: {vars.log: null}
      - title: "rearrange_event.record(): signal the async worker"
        source: "vllm/distributed/eplb/eplb_state.py:963-964,976-977"
        when: "state.is_async && !vars.args.is_profile"
      - return: {log: "= vars.log", new_physical_to_logical_map: "= vars.newmap", committed: "= vars.committed"}

  - component: eplb-state
    name: consume-async-layer
    kind: function
    latency_ms: 0
    summary: "One layer of an async rearrangement: the async worker's transfer_layer of the pending layer into the buffer (P2P through the communicator), _all_ranks_result_ready (an all-reduce of has_result over the EP group), then _move_to_workspace: move_from_buffer and commit that layer's map; the last layer clears rebalanced."
    sources: ["vllm/distributed/eplb/async_worker.py:99-176", "vllm/distributed/eplb/eplb_state.py:664-676", "vllm/distributed/eplb/eplb_state.py:1032-1051", "vllm/distributed/eplb/eplb_state.py:1426-1451"]
    request: {type: object, required: [model], properties: {model: {type: string}}}
    response: {type: object, properties: {layer_committed: {type: [integer, "null"]}, done: {type: boolean}}}
    errors:
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set: {vars.m: "= state.models[input.model]"}
      - set:
          vars.l: "= vars.m.pending.layer_idx"
          vars.p: "= vars.m.pending"
      - call: parallel-state.get-eplb-group
        as: g
      - title: "transfer_layer on the async worker's stream: the layer's experts go into the expert buffer"
        source: "vllm/distributed/eplb/async_worker.py:134-152"
        call: rebalance-execute.move-to-buffer
        input:
          num_local_experts: "= vars.m.num_local_physical_experts"
          old_indices: "= vars.p.old_physical_to_logical_map[vars.l]"
          new_indices: "= vars.p.new_physical_to_logical_map[vars.l]"
          expert_weights: "= vars.m.expert_weights[vars.l]"
          ep_rank: "= vars.g.value.rank_in_group"
          layer_idx: "= vars.l"
        as: mt
      - title: "_all_ranks_result_ready: all-reduce has_result over the EP group's CPU group"
        source: "vllm/distributed/eplb/eplb_state.py:1032-1040"
        rendezvous: "= 'eplb-ready:' + vars.g.value.unique_name"
        count: "= vars.g.value.world_size"
        value: 1
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: ready
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'all_reduce timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - source: "vllm/distributed/eplb/eplb_state.py:1432-1438"
        call: rebalance-execute.move-from-buffer
        input:
          expert_weights: "= vars.m.expert_weights[vars.l]"
          expert_weights_buffers: "= vars.mt.value.buffer"
          transfer_metadata: "= vars.mt.value"
          new_indices: "= vars.p.new_physical_to_logical_map[vars.l]"
          ep_rank: "= vars.g.value.rank_in_group"
        as: mf
      - set:
          vars.last: "= vars.l == vars.m.num_moe_layers - 1"
          vars.row: "= vars.p.new_physical_to_logical_map[vars.l]"
      - title: "_commit_eplb_maps_for_layer; the last layer ends the rebalance"
        source: "vllm/distributed/eplb/eplb_state.py:1352-1386,1440-1447"
        set:
          state.models: "= merge(state.models, {input.model: merge(state.models[input.model], {'physical_to_logical_map': lists.range(size(state.models[input.model].physical_to_logical_map)).map(i, i == vars.l ? vars.row : state.models[input.model].physical_to_logical_map[i]), 'logical_replica_count': lists.range(size(state.models[input.model].logical_replica_count)).map(i, i == vars.l ? lists.range(state.models[input.model].num_logical_experts).map(e, vars.row.filter(x, x == e).size()) : state.models[input.model].logical_replica_count[i]), 'expert_weights': lists.range(size(state.models[input.model].expert_weights)).map(i, i == vars.l ? vars.mf.value.expert_weights : state.models[input.model].expert_weights[i]), 'rebalanced': !vars.last, 'pending': vars.last ? null : merge(vars.p, {'layer_idx': vars.l + 1})})})"
      - return: {layer_committed: "= vars.l", done: "= vars.last"}

  # ---------------------------------------------------------------- the communicator
  - component: eplb-communicator
    name: create
    kind: function
    latency_ms: 0
    summary: "create_eplb_communicator: build the backend's communicator on the EPLB group (torch_nccl on the device group, torch_gloo with CPU staging, torch_xccl, pynccl, nixl); stateless elastic-EP groups need torch_nccl (promoted to pynccl), pynccl or nixl. Unknown backends and unavailable transports raise."
    sources: ["vllm/distributed/eplb/eplb_communicator.py:702-818", "vllm/distributed/eplb/eplb_communicator.py:94-97"]
    request:
      type: object
      required: [backend]
      properties:
        backend: {type: string, examples: [torch_gloo]}
        tensor_device_type: {type: string, default: cuda}
        is_stateless: {type: boolean, default: false, description: "the EPLB group is a StatelessGroupCoordinator (elastic EP)"}
        unsupported_dtypes: {type: array, default: [], items: {type: string}, description: "expert-weight dtypes NCCL can't carry (pynccl only)"}
        pynccl_available: {type: boolean, default: true}
        is_xpu: {type: boolean, default: false}
    response: {type: object, properties: {backend: {type: string}, class_name: {type: string}, needs_profile_buffer_reservation: {type: boolean}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.args: "= merge({'tensor_device_type': 'cuda', 'is_stateless': false, 'unsupported_dtypes': [], 'pynccl_available': true, 'is_xpu': false}, input)"}
      - call: parallel-state.get-eplb-group
        as: g
      - set: {vars.backend: "= vars.args.backend"}
      - if: "vars.args.is_stateless && vars.backend != 'nixl'"
        then:
          - if: "!(vars.backend in ['torch_nccl', 'pynccl'])"
            then:
              - source: "vllm/distributed/eplb/eplb_communicator.py:771-775"
                fail: {code: value-error, status: 0, message: "= \"Elastic EP requires 'torch_nccl', 'pynccl', or 'nixl' EPLB communicator (got '\" + vars.backend + \"').\""}
          - if: "vars.backend == 'torch_nccl'"
            then:
              - title: "Stateless elastic EP requires PyNCCL backend. Forcing EPLB communicator to 'pynccl'."
                source: "vllm/distributed/eplb/eplb_communicator.py:776-781"
                set: {vars.backend: pynccl}
      - if: "vars.backend == 'nixl'"
        then:
          - if: "!config['nixl-available']"
            then:
              - source: "vllm/distributed/eplb/eplb_communicator.py:785-788"
                fail: {code: runtime-error, status: 0, message: "EPLB communicator 'nixl' requested but NIXL is unavailable."}
          - if: "vars.args.is_xpu || vars.args.tensor_device_type == 'cpu'"
            then:
              - source: "vllm/distributed/eplb/eplb_communicator.py:789-793"
                fail: {code: runtime-error, status: 0, message: "= \"EPLB communicator 'nixl' supports only cuda-like devices (got \" + vars.args.tensor_device_type + ').'"}
          - set: {vars.cls: NixlEplbCommunicator}
        else:
          - if: "vars.backend == 'pynccl'"
            then:
              - if: "vars.args.tensor_device_type == 'cpu'"
                then:
                  - source: "vllm/distributed/eplb/eplb_communicator.py:735-739"
                    fail: {code: runtime-error, status: 0, message: "EPLB communicator 'pynccl' supports only cuda-like devices (got cpu)."}
              - if: "size(vars.args.unsupported_dtypes) > 0"
                then:
                  - source: "vllm/distributed/eplb/eplb_communicator.py:740-753"
                    fail: {code: runtime-error, status: 0, message: "= \"EPLB communicator 'pynccl' requested but expert weights contain unsupported dtypes: (\" + vars.args.unsupported_dtypes.sort().join(', ') + ').'"}
              - if: "!vars.args.pynccl_available"
                then:
                  - source: "vllm/distributed/eplb/eplb_communicator.py:755-762"
                    fail: {code: runtime-error, status: 0, message: "EPLB communicator 'pynccl' requested but unavailable."}
              - set: {vars.cls: PyNcclEplbCommunicator}
            else:
              - if: "!(vars.backend in ['torch_gloo', 'torch_xccl', 'torch_nccl'])"
                then:
                  - source: "vllm/distributed/eplb/eplb_communicator.py:818"
                    fail: {code: value-error, status: 0, message: "= 'Unknown EPLB communicator backend: ' + vars.backend"}
              - set: {vars.cls: "= {'torch_gloo': 'TorchDistGlooStagedEplbCommunicator', 'torch_xccl': 'TorchDistXCCLStagedEplbCommunicator', 'torch_nccl': 'TorchDistNcclEplbCommunicator'}[vars.backend]"}
      - title: "Initialized EPLB communicator: <class name>. (logged on the node's first local rank)"
        source: "vllm/distributed/eplb/eplb_communicator.py:94-97"
        when: "vars.g.value.rank_in_group == 0"
      - title: "NIXL pre-allocates its transfer buffers, so it skips the profile run's buffer reservation"
        source: "vllm/distributed/eplb/eplb_communicator.py:386-389"
        set:
          state.backend: "= vars.backend"
          state.class_name: "= vars.cls"
          state.group_size: "= vars.g.value.world_size"
          state.group_name: "= vars.g.value.unique_name"
          state.needs_profile_buffer_reservation: "= vars.cls != 'NixlEplbCommunicator'"
          state.sends: []
          state.recvs: []
      - return: {backend: "= vars.backend", class_name: "= vars.cls", needs_profile_buffer_reservation: "= vars.cls != 'NixlEplbCommunicator'"}

  - component: eplb-communicator
    name: add-send
    kind: function
    latency_ms: 0
    summary: "EplbCommunicator.add_send: queue this expert's weight tensors for one peer rank (torch backends build P2POp isends, gloo stages them on the CPU, NIXL exposes them for the peer's read)."
    sources: ["vllm/distributed/eplb/eplb_communicator.py:50-57", "vllm/distributed/eplb/eplb_communicator.py:112-127"]
    request: {type: object, required: [dst_rank, expert_id], properties: {tensors: {description: "the expert's weight tensors"}, dst_rank: {type: integer}, expert_id: {type: integer}}}
    response: {type: object, properties: {queued: {type: integer}}}
    behavior:
      - set: {state.sends: "= state.sends + [{'dst_rank': input.dst_rank, 'expert_id': input.expert_id, 'tensors': input.tensors}]"}
      - return: {queued: "= size(state.sends)"}

  - component: eplb-communicator
    name: add-recv
    kind: function
    latency_ms: 0
    summary: "EplbCommunicator.add_recv: queue a receive of an expert from one peer rank into a buffer row (NIXL issues its RDMA read here; the others at execute)."
    sources: ["vllm/distributed/eplb/eplb_communicator.py:59-66", "vllm/distributed/eplb/eplb_communicator.py:128-143"]
    request: {type: object, required: [src_rank, expert_id, dst_row], properties: {src_rank: {type: integer}, expert_id: {type: integer}, dst_row: {type: integer}}}
    response: {type: object, properties: {queued: {type: integer}}}
    behavior:
      - set: {state.recvs: "= state.recvs + [{'src_rank': input.src_rank, 'expert_id': input.expert_id, 'dst_row': input.dst_row}]"}
      - return: {queued: "= size(state.recvs)"}

  - component: eplb-communicator
    name: execute
    kind: function
    latency_ms: 0
    summary: "EplbCommunicator.execute: complete every queued transfer (batch_isend_irecv, the gloo staged exchange, the PyNccl group, or waiting on NIXL reads). Every EP rank executes once per layer; on return each receive's buffer row holds the sender's expert."
    sources: ["vllm/distributed/eplb/eplb_communicator.py:67-75", "vllm/distributed/eplb/eplb_communicator.py:144-155"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {received: {type: array}, sent: {type: integer}}}
    errors:
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set: {vars.me: "= int(self.replace('rank', '')) % state.group_size"}
      - title: The peers' matching sends and receives complete together
        source: "vllm/distributed/eplb/eplb_communicator.py:144-155"
        rendezvous: "= 'eplb-p2p:' + state.group_name"
        count: "= state.group_size"
        value: "= {'rank': vars.me, 'sends': state.sends}"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        as: xfer
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'EPLB transfer timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - set:
          vars.received: "= state.recvs.map(r, {'dst_row': r.dst_row, 'expert_id': r.expert_id, 'src_rank': r.src_rank, 'tensors': vars.xfer.values.exists(v, v.rank == r.src_rank && v.sends.exists(s, s.dst_rank == vars.me && s.expert_id == r.expert_id)) ? vars.xfer.values.filter(v, v.rank == r.src_rank)[0].sends.filter(s, s.dst_rank == vars.me && s.expert_id == r.expert_id)[0].tensors : null})"
          vars.sent: "= size(vars.xfer.values.filter(v, v.rank == vars.me)[0].sends)"
          state.sends: "= state.sends.slice(size(vars.xfer.values.filter(v, v.rank == vars.me)[0].sends), size(state.sends))"
          state.recvs: []
      - return: {received: "= vars.received", sent: "= vars.sent"}

  # ---------------------------------------------------------------- rebalance_execute
  - component: rebalance-execute
    name: get-ep-ranks-with-experts-batch
    kind: function
    latency_ms: 0
    summary: "get_ep_ranks_with_experts_batch: for each queried expert, the ranks holding it in the old map (senders, in order of first position) and the ranks needing it in the new map that don't already hold it (receivers)."
    sources: ["vllm/distributed/eplb/rebalance_execute.py:67-170"]
    request:
      type: object
      required: [expert_ids, num_local_experts, old_indices, new_indices]
      properties:
        expert_ids: {type: array, items: {type: integer}}
        num_local_experts: {type: integer}
        old_indices: {type: array, items: {type: integer}}
        new_indices: {type: array, items: {type: integer}}
    response: {type: object, properties: {ranks_to_send: {type: object}, ranks_to_recv: {type: object}}}
    behavior:
      - set:
          vars.u: "= input.expert_ids.distinct().sort()"
          vars.n: "= size(input.old_indices)"
      - set:
          vars.send: "= vars.u.map(e, lists.range(vars.n).filter(p, input.old_indices[p] == e).map(p, p / input.num_local_experts).distinct())"
      - set:
          vars.recv: "= lists.range(size(vars.u)).map(i, lists.range(vars.n).filter(p, input.new_indices[p] == vars.u[i]).map(p, p / input.num_local_experts).distinct().filter(r, !(r in vars.send[i])))"
      - return:
          ranks_to_send: "= lists.range(size(vars.u)).transformMapEntry(i, x, {string(vars.u[i]): vars.send[i]})"
          ranks_to_recv: "= lists.range(size(vars.u)).transformMapEntry(i, x, {string(vars.u[i]): vars.recv[i]})"

  - component: rebalance-execute
    name: move-to-buffer
    kind: function
    latency_ms: 0
    summary: "move_to_buffer for one layer on this rank: experts unchanged stay; experts already present locally are copied into the buffer; each locally held expert is sent to its share of the receiving ranks and each missing expert is received from its assigned sender (senders split the receivers evenly, remainder in order); then the communicator executes."
    sources: ["vllm/distributed/eplb/rebalance_execute.py:275-473"]
    request:
      type: object
      required: [num_local_experts, old_indices, new_indices, expert_weights, ep_rank]
      properties:
        num_local_experts: {type: integer}
        old_indices: {type: array, items: {type: integer}}
        new_indices: {type: array, items: {type: integer}}
        expert_weights: {type: array, description: "this layer's local slots (the logical expert each holds)"}
        expert_weights_buffers: {type: [array, "null"], default: null}
        ep_rank: {type: integer}
        layer_idx: {type: integer, default: 0}
    response:
      type: object
      properties:
        is_unchanged: {type: array}
        is_received_locally: {type: array}
        recv_primary_mask: {type: array}
        recv_count: {type: integer}
        recv_expert_ids: {type: array}
        recv_dst_rows: {type: array}
        buffer: {type: array}
        sends: {type: array}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.args: "= merge({'expert_weights_buffers': null, 'layer_idx': 0}, input)"}
      - if: "size(vars.args.old_indices) != size(vars.args.new_indices)"
        then:
          - source: "vllm/distributed/eplb/rebalance_execute.py:310"
            fail: {code: assertion-error, status: 0, message: ""}
      - set:
          vars.nle: "= vars.args.num_local_experts"
          vars.base: "= vars.args.ep_rank * vars.args.num_local_experts"
      - set:
          vars.ol: "= lists.range(vars.nle).map(r, vars.args.old_indices[vars.base + r])"
          vars.nl: "= lists.range(vars.nle).map(r, vars.args.new_indices[vars.base + r])"
      - title: "is_unchanged, and is_received_locally (unchanged, or the new expert is already on this rank)"
        source: "vllm/distributed/eplb/rebalance_execute.py:318-334"
        set:
          vars.unch: "= lists.range(vars.nle).map(r, vars.ol[r] == vars.nl[r])"
          vars.rloc: "= lists.range(vars.nle).map(r, vars.ol[r] == vars.nl[r] || (vars.nl[r] != -1 && vars.nl[r] in vars.ol))"
      - title: "Send map: the first local row of each distinct locally held expert; receive map: the first row of each distinct expert needed from a peer (the primary rows)"
        source: "vllm/distributed/eplb/rebalance_execute.py:336-360"
        set:
          vars.send_experts: "= vars.ol.filter(x, x != -1).distinct().sort()"
          vars.need: "= lists.range(vars.nle).filter(r, !(vars.ol[r] == vars.nl[r] || (vars.nl[r] != -1 && vars.nl[r] in vars.ol)) && vars.nl[r] != -1)"
      - set:
          vars.recv_experts: "= vars.need.map(r, vars.nl[r]).distinct().sort()"
      - set:
          vars.recv_rows: "= vars.recv_experts.map(x, vars.need.filter(r, vars.nl[r] == x)[0])"
          vars.buf0: "= vars.args.expert_weights_buffers != null ? vars.args.expert_weights_buffers : vars.args.expert_weights"
      - set:
          vars.primary: "= lists.range(vars.nle).map(r, r in vars.recv_rows)"
      - title: "1. Local moves into the buffer"
        source: "vllm/distributed/eplb/rebalance_execute.py:362-376"
        set:
          vars.buf: "= lists.range(vars.nle).map(r, !vars.unch[r] && vars.rloc[r] && vars.ol.indexOf(vars.nl[r]) >= 0 ? vars.args.expert_weights[vars.ol.indexOf(vars.nl[r])] : vars.buf0[r])"
          vars.sends: []
      - title: "2. Post sends: sender k of S takes receivers [k*(R/S), (k+1)*(R/S)) plus remainder receiver S*(R/S)+k"
        source: "vllm/distributed/eplb/rebalance_execute.py:400-430"
        if: "size(vars.send_experts) > 0"
        then:
          - call: rebalance-execute.get-ep-ranks-with-experts-batch
            input: {expert_ids: "= vars.send_experts", num_local_experts: "= vars.nle", old_indices: "= vars.args.old_indices", new_indices: "= vars.args.new_indices"}
            as: sm
          - foreach: "= vars.send_experts"
            as: e
            steps:
              - set:
                  vars.ts: "= vars.sm.value.ranks_to_send[string(vars.e)]"
                  vars.tr: "= vars.sm.value.ranks_to_recv[string(vars.e)]"
              - if: "size(vars.ts) == 0 || size(vars.tr) == 0"
                then:
                  - continue: true
              - set:
                  vars.per: "= size(vars.tr) / size(vars.ts)"
                  vars.pos: "= vars.ts.indexOf(vars.args.ep_rank)"
              - set:
                  vars.dsts: "= vars.tr.slice(vars.pos * vars.per, vars.pos * vars.per + vars.per) + (size(vars.ts) * vars.per + vars.pos < size(vars.tr) ? [vars.tr[size(vars.ts) * vars.per + vars.pos]] : [])"
              - foreach: "= vars.dsts"
                as: d
                steps:
                  - call: eplb-communicator.add-send
                    input: {tensors: "= vars.args.expert_weights[vars.ol.indexOf(vars.e)]", dst_rank: "= vars.d", expert_id: "= vars.e"}
                  - set: {vars.sends: "= vars.sends + [{'expert_id': vars.e, 'dst_rank': vars.d}]"}
      - title: "3. Post receives: receiver j takes sender j/(R/S) below the remainder, else sender j - S*(R/S)"
        source: "vllm/distributed/eplb/rebalance_execute.py:432-469"
        if: "size(vars.recv_experts) > 0"
        then:
          - call: rebalance-execute.get-ep-ranks-with-experts-batch
            input: {expert_ids: "= vars.recv_experts", num_local_experts: "= vars.nle", old_indices: "= vars.args.old_indices", new_indices: "= vars.args.new_indices"}
            as: rm
          - foreach: "= lists.range(size(vars.recv_experts))"
            as: k
            steps:
              - set:
                  vars.ts: "= vars.rm.value.ranks_to_send[string(vars.recv_experts[vars.k])]"
                  vars.tr: "= vars.rm.value.ranks_to_recv[string(vars.recv_experts[vars.k])]"
              - if: "size(vars.ts) == 0 || size(vars.tr) == 0"
                then:
                  - continue: true
              - set:
                  vars.per: "= size(vars.tr) / size(vars.ts)"
                  vars.rp: "= vars.tr.indexOf(vars.args.ep_rank)"
              - call: eplb-communicator.add-recv
                input:
                  src_rank: "= vars.rp < size(vars.ts) * vars.per ? vars.ts[vars.rp / vars.per] : vars.ts[vars.rp - size(vars.ts) * vars.per]"
                  expert_id: "= vars.recv_experts[vars.k]"
                  dst_row: "= vars.recv_rows[vars.k]"
      - title: "4. Execute the transfers and wait for completion"
        source: "vllm/distributed/eplb/rebalance_execute.py:471-472"
        call: eplb-communicator.execute
        as: ex
      - set:
          vars.buf: "= lists.range(vars.nle).map(r, vars.ex.value.received.exists(x, x.dst_row == r) ? vars.ex.value.received.filter(x, x.dst_row == r)[0].tensors : vars.buf[r])"
      - return:
          is_unchanged: "= vars.unch"
          is_received_locally: "= vars.rloc"
          recv_primary_mask: "= vars.primary"
          recv_count: "= size(vars.recv_experts)"
          recv_expert_ids: "= vars.recv_experts"
          recv_dst_rows: "= vars.recv_rows"
          buffer: "= vars.buf"
          sends: "= vars.sends"

  - component: rebalance-execute
    name: move-from-buffer
    kind: function
    latency_ms: 0
    summary: "move_from_buffer: copy every changed row that was received locally or as a primary remote receive back from the buffer into the expert weights, then copy each received expert into its duplicate rows."
    sources: ["vllm/distributed/eplb/rebalance_execute.py:474-548"]
    request:
      type: object
      required: [expert_weights, expert_weights_buffers, transfer_metadata, new_indices, ep_rank]
      properties:
        expert_weights: {type: array}
        expert_weights_buffers: {type: array}
        transfer_metadata: {type: object}
        new_indices: {type: array, items: {type: integer}}
        ep_rank: {type: integer}
    response: {type: object, properties: {expert_weights: {type: array}}}
    behavior:
      - set:
          vars.t: "= input.transfer_metadata"
          vars.nle: "= size(input.transfer_metadata.is_unchanged)"
      - title: "Rows to copy back: changed and (received locally or a primary remote receive)"
        source: "vllm/distributed/eplb/rebalance_execute.py:503-511"
        set:
          vars.w: "= lists.range(vars.nle).map(r, !vars.t.is_unchanged[r] && (vars.t.is_received_locally[r] || vars.t.recv_primary_mask[r]) ? input.expert_weights_buffers[r] : input.expert_weights[r])"
      - if: "vars.t.recv_count == 0"
        then:
          - return: {expert_weights: "= vars.w"}
      - set:
          vars.local: "= lists.range(vars.nle).map(r, input.new_indices[input.ep_rank * vars.nle + r])"
      - title: "Duplicates of a remotely received expert copy from its primary row"
        source: "vllm/distributed/eplb/rebalance_execute.py:516-548"
        set:
          vars.w: "= lists.range(vars.nle).map(r, !vars.t.is_unchanged[r] && !vars.t.is_received_locally[r] && !vars.t.recv_primary_mask[r] && vars.local[r] != -1 && vars.local[r] in vars.t.recv_expert_ids ? vars.w[vars.t.recv_dst_rows[vars.t.recv_expert_ids.indexOf(vars.local[r])]] : vars.w[r])"
      - return: {expert_weights: "= vars.w"}

  - component: rebalance-execute
    name: rearrange-expert-weights-inplace
    kind: function
    latency_ms: 0
    summary: "rearrange_expert_weights_inplace: check the shapes (num_physical_experts == ep_size x local experts), then either reserve the communication buffers for profiling (a barrier and a dummy all_gather of the first layer's weights, skipped by NIXL) or move every layer: move_to_buffer then move_from_buffer."
    sources: ["vllm/distributed/eplb/rebalance_execute.py:642-749"]
    request:
      type: object
      required: [old_global_expert_indices, new_global_expert_indices, expert_weights]
      properties:
        old_global_expert_indices: {type: array, description: "[layer][physical] logical expert ids"}
        new_global_expert_indices: {type: array}
        expert_weights: {type: array, description: "[layer][local slot] the expert weights (here: what each slot holds)"}
        num_weight_tensors: {type: integer, default: 2, description: "weight tensors per expert in a layer (w13 and w2)"}
        is_profile: {type: boolean, default: false}
        ep_rank: {type: [integer, "null"], default: null, description: "null reads the EP group"}
        ep_size: {type: [integer, "null"], default: null}
    response: {type: object, properties: {expert_weights: {type: array}, profile: {type: boolean}, transfers: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set: {vars.args: "= merge({'num_weight_tensors': 2, 'is_profile': false, 'ep_rank': null, 'ep_size': null}, input)"}
      - if: "vars.args.ep_rank == null || vars.args.ep_size == null"
        then:
          - title: "The caller's EP group (EplbState passes the EP group; its ranks are the EPLB group's)"
            source: "vllm/distributed/eplb/eplb_state.py:937-947"
            call: parallel-state.get-eplb-group
            as: g
          - set:
              vars.rank: "= vars.args.ep_rank != null ? vars.args.ep_rank : vars.g.value.rank_in_group"
              vars.size: "= vars.args.ep_size != null ? vars.args.ep_size : vars.g.value.world_size"
        else:
          - set:
              vars.rank: "= vars.args.ep_rank"
              vars.size: "= vars.args.ep_size"
      - set:
          vars.layers: "= size(vars.args.old_global_expert_indices)"
          vars.phys: "= size(vars.args.old_global_expert_indices) > 0 ? size(vars.args.old_global_expert_indices[0]) : 0"
      - title: "Shape checks (bare asserts)"
        source: "vllm/distributed/eplb/rebalance_execute.py:695-715"
        if: "vars.layers == 0 || size(vars.args.new_global_expert_indices) == 0 || size(vars.args.new_global_expert_indices[0]) != vars.phys || size(vars.args.expert_weights) != vars.layers || size(vars.args.new_global_expert_indices) != vars.layers || vars.phys != vars.size * size(vars.args.expert_weights[0])"
        then:
          - fail: {code: assertion-error, status: 0, message: ""}
      - if: "vars.args.is_profile"
        then:
          - call: eplb-communicator.info
            as: ci
          - if: "vars.ci.value.needs_profile_buffer_reservation"
            then:
              - title: "Reserve NCCL buffers: per weight tensor of the first layer, a barrier then a dummy all_gather over the EP group"
                source: "vllm/distributed/eplb/rebalance_execute.py:719-733"
                foreach: "= lists.range(vars.args.num_weight_tensors)"
                as: wi
                steps:
                  - rendezvous: "= 'eplb-profile-barrier:' + vars.ci.value.group_name"
                    count: "= vars.size"
                    value: "= vars.rank"
                    timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
                    on_error:
                      - fail: {code: dist-backend-error, status: 0, message: "= 'barrier timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
                  - rendezvous: "= 'eplb-profile-all-gather:' + vars.ci.value.group_name"
                    count: "= vars.size"
                    value: "= vars.args.expert_weights[0]"
                    timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
                    on_error:
                      - fail: {code: dist-backend-error, status: 0, message: "= 'all_gather timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
          - return: {expert_weights: "= vars.args.expert_weights", profile: true, transfers: []}
      - set:
          vars.out: []
          vars.transfers: []
      - title: "Per layer: move_to_buffer (the P2P exchange), then move_from_buffer"
        source: "vllm/distributed/eplb/rebalance_execute.py:735-749"
        foreach: "= lists.range(vars.layers)"
        as: l
        steps:
          - call: rebalance-execute.move-to-buffer
            input:
              num_local_experts: "= size(vars.args.expert_weights[0])"
              old_indices: "= vars.args.old_global_expert_indices[vars.l]"
              new_indices: "= vars.args.new_global_expert_indices[vars.l]"
              expert_weights: "= vars.args.expert_weights[vars.l]"
              ep_rank: "= vars.rank"
              layer_idx: "= vars.l"
            as: mt
          - call: rebalance-execute.move-from-buffer
            input:
              expert_weights: "= vars.args.expert_weights[vars.l]"
              expert_weights_buffers: "= vars.mt.value.buffer"
              transfer_metadata: "= vars.mt.value"
              new_indices: "= vars.args.new_global_expert_indices[vars.l]"
              ep_rank: "= vars.rank"
            as: mf
          - set:
              vars.out: "= vars.out + [vars.mf.value.expert_weights]"
              vars.transfers: "= vars.transfers + [vars.mt.value.sends]"
      - return: {expert_weights: "= vars.out", profile: false, transfers: "= vars.transfers"}

  - component: eplb-communicator
    name: info
    kind: function
    latency_ms: 0
    summary: "The communicator's backend, EPLB group and needs_profile_buffer_reservation property (False only for NIXL, which pre-allocates its transfer buffers)."
    sources: ["vllm/distributed/eplb/eplb_communicator.py:85-91", "vllm/distributed/eplb/eplb_communicator.py:386-389"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {backend: {type: [string, "null"]}, group_name: {type: string}, needs_profile_buffer_reservation: {type: boolean}}}
    behavior:
      - return: {backend: "= state.backend", group_name: "= state.group_name", needs_profile_buffer_reservation: "= state.needs_profile_buffer_reservation"}

  # ---------------------------------------------------------------- the default policy
  - component: eplb-policy
    name: rebalance-experts
    kind: function
    latency_ms: 0
    summary: "DefaultEplbPolicy.rebalance_experts on one node: per layer pack the expert groups (heaviest first), replicate the hottest logical experts (load / replicas) into the redundant slots, pack the physical experts to GPUs (heaviest first onto the lightest non-full GPU), then keep experts that stay on a GPU in their old slots."
    sources: ["vllm/distributed/eplb/policy/default.py:273-332", "vllm/distributed/eplb/policy/default.py:103-188", "vllm/distributed/eplb/policy/default.py:22-100", "vllm/distributed/eplb/policy/default.py:191-270"]
    request:
      type: object
      required: [weight, num_replicas, num_ranks]
      properties:
        weight: {type: array, description: "[layer][logical expert] load"}
        num_replicas: {type: integer}
        num_groups: {type: integer, default: 1}
        num_nodes: {type: integer, default: 1}
        num_ranks: {type: integer}
        old_global_expert_indices: {type: [array, "null"], default: null}
    response: {type: object, properties: {phy2log: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.args: "= merge({'num_groups': 1, 'num_nodes': 1, 'old_global_expert_indices': null}, input)"}
      - set:
          vars.L: "= size(vars.args.weight[0])"
          vars.R: "= vars.args.num_replicas"
          vars.P: "= vars.args.num_ranks"
          vars.G: "= vars.args.num_groups % vars.args.num_nodes == 0 ? vars.args.num_groups : 1"
      - title: "Hierarchical asserts: logical experts divisible by groups, replicas by GPUs, at least as many replicas as logical experts"
        source: "vllm/distributed/eplb/policy/default.py:93-94,126-131"
        if: "vars.L % vars.G != 0 || vars.R % vars.P != 0 || vars.R < vars.L"
        then:
          - fail: {code: assertion-error, status: 0, message: ""}
      - title: "(One node: the group packing puts every group on node 0, heaviest first)"
        source: "vllm/distributed/eplb/policy/default.py:301-309"
      - set:
          vars.gs: "= vars.L / vars.G"
          vars.per: "= vars.R / vars.P"
          vars.out: []
      - foreach: "= lists.range(size(vars.args.weight))"
        as: li
        steps:
          - set: {vars.w: "= vars.args.weight[vars.li].map(x, double(x))"}
          - title: "Step 1: groups to the node; rank_in_pack is the group's place in descending load (stable)"
            source: "vllm/distributed/eplb/policy/default.py:22-72,140-155"
            set:
              vars.tpg: "= lists.range(vars.G).map(g, sum(vars.w.slice(g * vars.gs, (g + 1) * vars.gs)))"
          - set:
              vars.rip: "= lists.range(vars.G).map(g, vars.G == 1 ? 0 : lists.range(vars.G).filter(h, vars.tpg[h] > vars.tpg[g] || (vars.tpg[h] == vars.tpg[g] && h < g)).size())"
          - set:
              vars.log2mlog: "= lists.range(vars.L).map(e, vars.rip[e / vars.gs] * vars.gs + e % vars.gs)"
          - set:
              vars.mlog2log: "= lists.range(vars.L).map(m, vars.log2mlog.indexOf(m))"
          - set:
              vars.tpm: "= lists.range(vars.L).map(m, vars.w[vars.mlog2log[m]])"
              vars.p2m: "= lists.range(vars.L)"
              vars.cnt: "= lists.range(vars.L).map(m, 1)"
          - title: "Step 2: each redundant slot replicates argmax(load / replica count) (the first maximum)"
            source: "vllm/distributed/eplb/policy/default.py:75-100,157-164"
            foreach: "= lists.range(vars.R - vars.L)"
            as: ri
            steps:
              - set: {vars.ratio: "= lists.range(vars.L).map(m, vars.tpm[m] / double(vars.cnt[m]))"}
              - set: {vars.best: "= vars.ratio.indexOf(math.greatest(vars.ratio))"}
              - set:
                  vars.p2m: "= vars.p2m + [vars.best]"
                  vars.cnt: "= lists.range(vars.L).map(m, m == vars.best ? vars.cnt[m] + 1 : vars.cnt[m])"
          - set:
              vars.tpp: "= lists.range(vars.R).map(p, vars.tpm[vars.p2m[p]] / double(vars.cnt[vars.p2m[p]]))"
          - title: "Step 3: physical experts to GPUs; with one slot per GPU the packing is the identity, else heaviest first onto the lightest GPU that isn't full"
            source: "vllm/distributed/eplb/policy/default.py:40-72,166-173"
            if: "vars.per == 1"
            then:
              - set:
                  vars.pack: "= lists.range(vars.R)"
                  vars.rin: "= lists.range(vars.R).map(p, 0)"
            else:
              - set:
                  vars.order: "= lists.range(vars.R).map(k, lists.range(vars.R).filter(p, lists.range(vars.R).filter(q, vars.tpp[q] > vars.tpp[p] || (vars.tpp[q] == vars.tpp[p] && q < p)).size() == k)[0])"
                  vars.pw: "= lists.range(vars.P).map(k, 0.0)"
                  vars.items: "= lists.range(vars.P).map(k, 0)"
                  vars.pack: "= lists.range(vars.R).map(p, -1)"
                  vars.rin: "= lists.range(vars.R).map(p, -1)"
              - foreach: "= vars.order"
                as: it
                steps:
                  - set: {vars.avail: "= lists.range(vars.P).filter(k, vars.items[k] < vars.per)"}
                  - set: {vars.k: "= vars.avail.filter(k, vars.pw[k] == math.least(vars.avail.map(j, vars.pw[j])))[0]"}
                  - set:
                      vars.pack: "= lists.range(vars.R).map(p, p == vars.it ? vars.k : vars.pack[p])"
                      vars.rin: "= lists.range(vars.R).map(p, p == vars.it ? vars.items[vars.k] : vars.rin[p])"
                      vars.pw: "= lists.range(vars.P).map(j, j == vars.k ? vars.pw[j] + vars.tpp[vars.it] : vars.pw[j])"
                      vars.items: "= lists.range(vars.P).map(j, j == vars.k ? vars.items[j] + 1 : vars.items[j])"
          - set:
              vars.phy2pphy: "= lists.range(vars.R).map(p, vars.pack[p] * vars.per + vars.rin[p])"
          - set:
              vars.row: "= lists.range(vars.R).map(q, vars.mlog2log[vars.p2m[vars.phy2pphy.indexOf(q)]])"
          - if: "vars.args.old_global_expert_indices != null"
            then:
              - title: "preserve_intragpu_slots: experts staying on a GPU keep their old slot; incoming experts fill the free slots in order"
                source: "vllm/distributed/eplb/policy/default.py:191-270"
                set: {vars.old: "= vars.args.old_global_expert_indices[vars.li]", vars.post: "= vars.row"}
              - foreach: "= lists.range(vars.P)"
                as: gi
                steps:
                  - set:
                      vars.ol: "= vars.old.slice(vars.gi * vars.per, (vars.gi + 1) * vars.per)"
                      vars.nl: "= vars.row.slice(vars.gi * vars.per, (vars.gi + 1) * vars.per)"
                      vars.used: "= lists.range(vars.per).map(j, false)"
                      vars.kept: "= lists.range(vars.per).map(j, false)"
                      vars.slots: "= lists.range(vars.per).map(j, -2)"
                  - foreach: "= lists.range(vars.per)"
                    as: s
                    steps:
                      - set: {vars.cand: "= lists.range(vars.per).filter(j, !vars.used[j] && vars.nl[j] == vars.ol[vars.s])"}
                      - if: "size(vars.cand) > 0"
                        then:
                          - set:
                              vars.slots: "= lists.range(vars.per).map(j, j == vars.s ? vars.nl[vars.cand[0]] : vars.slots[j])"
                              vars.used: "= lists.range(vars.per).map(j, j == vars.cand[0] ? true : vars.used[j])"
                              vars.kept: "= lists.range(vars.per).map(j, j == vars.s ? true : vars.kept[j])"
                  - set:
                      vars.rem: "= lists.range(vars.per).filter(j, !vars.used[j])"
                      vars.fill: "= lists.range(vars.per).filter(j, !vars.kept[j])"
                  - set:
                      vars.slots: "= lists.range(vars.per).map(j, vars.kept[j] ? vars.slots[j] : (vars.fill.indexOf(j) < size(vars.rem) ? vars.nl[vars.rem[vars.fill.indexOf(j)]] : vars.nl[j]))"
                  - set:
                      vars.post: "= lists.range(vars.R).map(q, q / vars.per == vars.gi ? vars.slots[q % vars.per] : vars.post[q])"
              - set: {vars.row: "= vars.post"}
          - set: {vars.out: "= vars.out + [vars.row]"}
      - return: {phy2log: "= vars.out"}

  # ---------------------------------------------------------------- MoRIIO configuration
  - component: moriio-config
    name: positive-finite-timeout
    kind: function
    latency_ms: 0
    summary: "_positive_finite_timeout(name, value): float(value), refused unless finite and greater than zero."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:49-53"]
    request:
      type: object
      required: [name, value]
      properties:
        name: {type: string, examples: [kv_connector_extra_config.transfer_timeout]}
        value: {type: [number, string, boolean, "null"], description: "a number, or a string float() parses ('inf', 'nan' and 'infinity' in any case, with a sign, are not finite)", examples: [30]}
    response: {type: object, properties: {timeout: {type: number}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: type-error, status: 0, retryable: false}
    behavior:
      - if: "input.value == null"
        then:
          - title: float(None)
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:50"
            fail: {code: type-error, status: 0, message: "float() argument must be a string or a real number, not 'NoneType'"}
      - if: "type(input.value) == bool"
        then:
          - set: {vars.t: "= input.value ? 1.0 : 0.0", vars.finite: true}
        else:
          - if: "type(input.value) == string"
            then:
              - set: {vars.s: "= input.value.trim().lowerAscii()"}
              - if: "vars.s.matches('^[+-]?(inf|infinity|nan)$')"
                then:
                  - set: {vars.t: 0.0, vars.finite: false}
                else:
                  - if: "!vars.s.matches('^[+-]?([0-9]+[.]?[0-9]*|[.][0-9]+)(e[+-]?[0-9]+)?$')"
                    then:
                      - title: float() of a string that isn't a number
                        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:50"
                        fail: {code: value-error, status: 0, message: "= \"could not convert string to float: '\" + input.value + \"'\""}
                  - set: {vars.t: "= double(vars.s)", vars.finite: true}
            else:
              - set: {vars.t: "= double(input.value)", vars.finite: true}
      - if: "!vars.finite || vars.t <= 0.0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:51-52"
            fail: {code: value-error, status: 0, message: "= input.name + ' must be finite and greater than zero'"}
      - return: {timeout: "= vars.t"}

  - component: moriio-config
    name: from-vllm-config
    kind: function
    latency_ms: 0
    summary: "MoRIIOConfig.from_vllm_config: fold the DP rank to the pod-local rank, read the notify port, validate the backend (rdma or xgmi), validate transfer_timeout (30 s), defer_timeout (60 s) and recv_abort_timeout (120 s, or the deprecated VLLM_MORIIO_TRANSFER_TIMEOUT_S), then read the HTTP and handshake ports and the RDMA knobs."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:295-407", "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:205-237", "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:408-425"]
    request:
      type: object
      properties:
        extra_config: {type: object, description: "kv_transfer_config.kv_connector_extra_config"}
        kv_transfer_config_set: {type: boolean, default: true}
        data_parallel_rank: {type: integer, default: 0}
        data_parallel_size_local: {type: integer, default: 1}
        data_parallel_size: {type: integer, default: 1}
    response:
      type: object
      properties:
        notify_port: {type: integer}
        http_port: {type: integer}
        handshake_port: {type: integer}
        proxy_ip: {type: string}
        proxy_ping_port: {type: integer}
        local_ip: {type: [string, "null"], description: "host_ip, else null for get_ip()"}
        tp_rank: {type: integer}
        tp_size: {type: integer}
        dp_rank: {type: integer}
        dp_size: {type: integer}
        backend: {type: string}
        read_mode: {type: boolean}
        qp_per_transfer: {type: integer}
        post_batch_size: {type: integer}
        num_workers: {type: integer}
        transfer_timeout: {type: number}
        defer_timeout: {type: number}
        recv_abort_timeout: {type: number}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: key-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
      - {code: type-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.args: "= merge({'extra_config': {}, 'kv_transfer_config_set': true, 'data_parallel_rank': 0, 'data_parallel_size_local': 1, 'data_parallel_size': 1}, input)"
      - if: "!vars.args.kv_transfer_config_set"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:331-333"
            fail: {code: assertion-error, status: 0, message: "kv_transfer_config must be set for MoRIIOConnector"}
      - set: {vars.x: "= vars.args.extra_config"}
      - call: parallel-state.get-tp-group
        as: tp
      - title: "fold_local_rank: the global DP rank modulo data_parallel_size_local (0 = external DP, unchanged)"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:220-230,340-341"
        set:
          vars.dp_rank: "= vars.args.data_parallel_size_local != 0 ? vars.args.data_parallel_rank % vars.args.data_parallel_size_local : vars.args.data_parallel_rank"
      - if: "!('notify_port' in vars.x)"
        then:
          - title: "int(extra_config['notify_port'])"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:342"
            fail: {code: key-error, status: 0, message: "'notify_port'"}
      - title: "get_port_offset(dp_rank, tp_rank) with its default tp_size 1: dp_rank + tp_rank"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:216-217,344"
        set:
          vars.offset: "= vars.dp_rank + vars.tp.value.rank_in_group"
          vars.backend: "= ('backend' in vars.x && vars.x.backend != null ? string(vars.x.backend) : 'rdma').lowerAscii()"
      - if: "!(vars.backend in ['rdma', 'xgmi'])"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:345-350"
            fail: {code: value-error, status: 0, message: "= \"Invalid MoRIIO backend '\" + vars.backend + \"' in kv_connector_extra_config; must be one of 'rdma' or 'xgmi'.\""}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:352-357"
        call: moriio-config.positive-finite-timeout
        input: {name: kv_connector_extra_config.transfer_timeout, value: "= 'transfer_timeout' in vars.x ? vars.x.transfer_timeout : 30.0"}
        as: tt
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:358-361"
        call: moriio-config.positive-finite-timeout
        input: {name: kv_connector_extra_config.defer_timeout, value: "= 'defer_timeout' in vars.x ? vars.x.defer_timeout : 60.0"}
        as: dt
      - title: "VLLM_MORIIO_TRANSFER_TIMEOUT_S is deprecated. Set 'recv_abort_timeout' inside kv_transfer_config.kv_connector_extra_config instead."
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:362-368"
        when: "('vllm-moriio-transfer-timeout-s' in config && config['vllm-moriio-transfer-timeout-s'] != null)"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:369-375"
        call: moriio-config.positive-finite-timeout
        input:
          name: kv_connector_extra_config.recv_abort_timeout
          value: "= 'recv_abort_timeout' in vars.x ? vars.x.recv_abort_timeout : (('vllm-moriio-transfer-timeout-s' in config && config['vllm-moriio-transfer-timeout-s'] != null) && config['vllm-moriio-transfer-timeout-s'] != '' ? config['vllm-moriio-transfer-timeout-s'] : 120.0)"
        as: rt
      - if: "!('http_port' in vars.x)"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:383"
            fail: {code: key-error, status: 0, message: "'http_port'"}
      - if: "!('handshake_port' in vars.x)"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:384"
            fail: {code: key-error, status: 0, message: "'handshake_port'"}
      - title: "read_mode: 'true' or '1' (any case); the RDMA knobs default to 1 QP per transfer, post batch -1 (backend's choice), 1 worker"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:205-213,377-407"
        return:
          notify_port: "= int(vars.x.notify_port) + vars.offset"
          http_port: "= int(vars.x.http_port)"
          handshake_port: "= int(vars.x.handshake_port)"
          proxy_ip: "= 'proxy_ip' in vars.x ? string(vars.x.proxy_ip) : ''"
          proxy_ping_port: "= 'proxy_ping_port' in vars.x ? int(vars.x.proxy_ping_port) : 0"
          local_ip: "= 'host_ip' in vars.x && vars.x.host_ip != null && vars.x.host_ip != '' ? vars.x.host_ip : null"
          tp_rank: "= vars.tp.value.rank_in_group"
          tp_size: "= vars.tp.value.world_size"
          dp_rank: "= vars.dp_rank"
          dp_size: "= vars.args.data_parallel_size"
          backend: "= vars.backend"
          read_mode: "= 'read_mode' in vars.x && string(vars.x.read_mode).lowerAscii().trim() in ['true', '1']"
          qp_per_transfer: "= 'qp_per_transfer' in vars.x ? int(vars.x.qp_per_transfer) : 1"
          post_batch_size: "= 'post_batch_size' in vars.x ? int(vars.x.post_batch_size) : -1"
          num_workers: "= 'num_workers' in vars.x ? int(vars.x.num_workers) : 1"
          transfer_timeout: "= vars.tt.value.timeout"
          defer_timeout: "= vars.dt.value.timeout"
          recv_abort_timeout: "= vars.rt.value.timeout"

  - component: moriio-connector-worker
    name: init
    kind: function
    latency_ms: 0
    summary: "MoRIIOConnectorWorker.__init__: requires the mori package, builds MoRIIOConfig (READ or WRITE mode from it), then the wrapper with the transfer timeout and, on a WRITE-mode producer, the writer with the defer timeout."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:1613-1630", "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:1722-1735"]
    request:
      type: object
      properties:
        engine_id: {type: string, examples: [engine-p0]}
        extra_config: {type: object}
        mori_available: {type: boolean, default: true}
        data_parallel_rank: {type: integer, default: 0}
    response: {type: object, properties: {mode: {type: string}, transfer_timeout: {type: number}, defer_timeout: {type: number}, recv_abort_timeout: {type: number}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
      - {code: key-error, status: 0, retryable: false}
      - {code: type-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.args: "= merge({'extra_config': {}, 'mori_available': true, 'data_parallel_rank': 0, 'engine_id': 'engine-p0'}, input)"
      - if: "!vars.args.mori_available"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:1619-1623"
            fail: {code: runtime-error, status: 0, message: "MoRIIO is not available. Please ensure the 'mori' package is installed and properly configured."}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:1625-1629"
        call: moriio-config.from-vllm-config
        input: {extra_config: "= vars.args.extra_config", data_parallel_rank: "= vars.args.data_parallel_rank"}
        as: cfg
      - set:
          state.moriio_config: "= vars.cfg.value"
          state.mode: "= vars.cfg.value.read_mode ? 'READ' : 'WRITE'"
      - title: "Initializing MoRIIO worker <engine_id>"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:1631"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:1722-1726"
        call: moriio-wrapper.init
        input: {transfer_timeout: "= vars.cfg.value.transfer_timeout"}
      - title: The writer reads the worker's defer_timeout when it is built
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:85-101"
        call: moriio-writer.init
        input: {defer_timeout: "= vars.cfg.value.defer_timeout"}
      - return: {mode: "= state.mode", transfer_timeout: "= vars.cfg.value.transfer_timeout", defer_timeout: "= vars.cfg.value.defer_timeout", recv_abort_timeout: "= vars.cfg.value.recv_abort_timeout"}

  - component: moriio-wrapper
    name: init
    kind: function
    latency_ms: 0
    summary: "MoRIIOWrapper.__init__: keeps the transfer timeout that bounds waiting_for_transfer_complete."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:524-545"]
    request: {type: object, required: [transfer_timeout], properties: {transfer_timeout: {type: number, examples: [30.0]}}}
    response: {type: object, properties: {transfer_timeout_ms: {type: integer}}}
    behavior:
      - set: {state.transfer_timeout_ms: "= int(input.transfer_timeout * 1000.0)"}
      - return: {transfer_timeout_ms: "= state.transfer_timeout_ms"}

  - component: moriio-writer
    name: init
    kind: function
    latency_ms: 0
    summary: "MoRIIOWriter.__init__: takes defer_timeout from the worker's MoRIIOConfig; deferred write tasks older than it are reaped."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:85-101"]
    request: {type: object, required: [defer_timeout], properties: {defer_timeout: {type: number, examples: [60.0]}}}
    response: {type: object, properties: {defer_timeout_ms: {type: integer}}}
    behavior:
      - set: {state.defer_timeout_ms: "= int(input.defer_timeout * 1000.0)"}
      - return: {defer_timeout_ms: "= state.defer_timeout_ms"}

  # ---------------------------------------------------------------- PP point-to-point
  - component: group-coordinator
    name: rank-info
    kind: function
    latency_ms: 0
    summary: "GroupCoordinator's rank properties: first_rank/last_rank (the group's first and last global ranks), is_first_rank/is_last_rank, and next_rank/prev_rank (wrapping around), as pipeline stages use them."
    sources: ["vllm/distributed/parallel_state.py:637-670"]
    request:
      type: object
      required: [ranks, rank]
      properties:
        ranks: {type: array, items: {type: integer}, description: "the group's global ranks", examples: [[0, 1]]}
        rank: {type: integer, description: "this process's global rank", examples: [0]}
    response: {type: object, properties: {rank_in_group: {type: integer}, first_rank: {type: integer}, last_rank: {type: integer}, is_first_rank: {type: boolean}, is_last_rank: {type: boolean}, next_rank: {type: integer}, prev_rank: {type: integer}}}
    behavior:
      - set:
          vars.i: "= input.ranks.indexOf(input.rank)"
          vars.n: "= size(input.ranks)"
      - return:
          rank_in_group: "= vars.i"
          first_rank: "= input.ranks[0]"
          last_rank: "= input.ranks[vars.n - 1]"
          is_first_rank: "= input.rank == input.ranks[0]"
          is_last_rank: "= input.rank == input.ranks[vars.n - 1]"
          next_rank: "= input.ranks[(vars.i + 1) % vars.n]"
          prev_rank: "= input.ranks[(vars.i - 1 + vars.n) % vars.n]"

  - component: group-coordinator
    name: send-tensor-dict
    kind: function
    latency_ms: 0
    summary: "GroupCoordinator.send_tensor_dict (the PP stage handoff of intermediate tensors): bypass at world size 1; dst defaults to the next rank; the metadata goes on the CPU group, then each non-empty tensor, sliced to this rank's 1/N share when an all-gather group is given and the tensor divides evenly (unless all_gather_tensors says otherwise)."
    sources: ["vllm/distributed/parallel_state.py:1081-1124", "vllm/distributed/parallel_state.py:1162-1244", "vllm/distributed/parallel_state.py:1067-1079"]
    request:
      type: object
      required: [world_size, rank_in_group]
      properties:
        group_name: {type: string, default: "pp:0"}
        world_size: {type: integer, examples: [2]}
        rank_in_group: {type: integer, examples: [0]}
        dst: {type: [integer, "null"], default: null}
        tensors: {type: object, default: {}, description: "tensor name -> numel", examples: [{hidden_states: 8192, residual: 8192}]}
        metadata: {type: object, default: {}, description: "the non-tensor entries"}
        all_gather_size: {type: [integer, "null"], default: null, description: "the all-gather group's world size (usually the TP group); null for none"}
        all_gather_rank: {type: integer, default: 0}
        all_gather_tensors: {type: [object, "null"], default: null}
    response: {type: [object, "null"], properties: {sent: {type: object}, dst: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.args: "= merge({'group_name': 'pp:0', 'dst': null, 'tensors': {}, 'metadata': {}, 'all_gather_size': null, 'all_gather_rank': 0, 'all_gather_tensors': null}, input)"
      - if: "vars.args.world_size == 1"
        then:
          - title: Bypass at world size 1 (the tensor dict comes back)
            source: "vllm/distributed/parallel_state.py:1105-1107"
            return: {sent: "= vars.args.tensors", dst: 0}
      - set: {vars.dst: "= vars.args.dst != null ? vars.args.dst : (vars.args.rank_in_group + 1) % vars.args.world_size"}
      - if: "vars.dst >= vars.args.world_size"
        then:
          - source: "vllm/distributed/parallel_state.py:1183"
            fail: {code: assertion-error, status: 0, message: "= 'Invalid dst rank (' + string(vars.dst) + ')'"}
      - title: "_should_use_all_gather: numel divisible by the all-gather group's size, overridable per tensor"
        source: "vllm/distributed/parallel_state.py:1067-1079,1216-1222"
        set:
          vars.sent: "= vars.args.tensors.filter(k, vars.args.tensors[k] > 0).transformMapEntry(i, k, {k: {'numel': vars.args.all_gather_size != null && (vars.args.all_gather_tensors != null && k in vars.args.all_gather_tensors ? vars.args.all_gather_tensors[k] : vars.args.tensors[k] % vars.args.all_gather_size == 0) ? vars.args.tensors[k] / vars.args.all_gather_size : vars.args.tensors[k], 'sliced': vars.args.all_gather_size != null && (vars.args.all_gather_tensors != null && k in vars.args.all_gather_tensors ? vars.args.all_gather_tensors[k] : vars.args.tensors[k] % vars.args.all_gather_size == 0)}})"
      - title: "isend_object(metadata) on the CPU group, then an isend per tensor; send_tensor_dict waits on every handle"
        source: "vllm/distributed/parallel_state.py:1108-1123,1206-1232"
        put: "= 'p2p:' + vars.args.group_name + ':' + string(vars.args.rank_in_group) + '->' + string(vars.dst)"
        value: "= {'metadata': vars.args.metadata, 'tensors': vars.sent, 'keys': vars.args.tensors.map(k, k)}"
      - return: {sent: "= vars.sent", dst: "= vars.dst"}

  - component: group-coordinator
    name: recv-tensor-dict
    kind: function
    latency_ms: 0
    summary: "GroupCoordinator.recv_tensor_dict: None at world size 1; src defaults to the previous rank; receive the metadata, then each tensor, all-gathering the sliced ones back to full size over the all-gather group."
    sources: ["vllm/distributed/parallel_state.py:1246-1340"]
    request:
      type: object
      required: [world_size, rank_in_group]
      properties:
        group_name: {type: string, default: "pp:0"}
        world_size: {type: integer, examples: [2]}
        rank_in_group: {type: integer, examples: [1]}
        src: {type: [integer, "null"], default: null}
        all_gather_size: {type: [integer, "null"], default: null}
        timeout_ms: {type: integer, default: 600000}
    response: {type: [object, "null"], properties: {tensors: {type: object}, metadata: {type: object}, src: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.args: "= merge({'group_name': 'pp:0', 'src': null, 'all_gather_size': null, 'timeout_ms': 600000}, input)"
      - if: "vars.args.world_size == 1"
        then:
          - source: "vllm/distributed/parallel_state.py:1268-1269"
            return: null
      - set: {vars.src: "= vars.args.src != null ? vars.args.src : (vars.args.rank_in_group - 1 + vars.args.world_size) % vars.args.world_size"}
      - if: "vars.src >= vars.args.world_size"
        then:
          - source: "vllm/distributed/parallel_state.py:1297"
            fail: {code: assertion-error, status: 0, message: "= 'Invalid src rank (' + string(vars.src) + ')'"}
      - title: Block on the sender's metadata and tensors
        source: "vllm/distributed/parallel_state.py:1299-1340"
        receive: "= 'p2p:' + vars.args.group_name + ':' + string(vars.src) + '->' + string(vars.args.rank_in_group)"
        timeout_ms: "= vars.args.timeout_ms"
        as: msg
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'recv from rank ' + string(vars.src) + ' timed out'"}
      - title: "Sliced tensors are all-gathered back to full size (numel x all-gather size); empty tensors arrive as empty"
        source: "vllm/distributed/parallel_state.py:1318-1338"
        return:
          tensors: "= vars.msg.keys.transformMapEntry(i, k, {k: k in vars.msg.tensors ? (vars.msg.tensors[k].sliced ? vars.msg.tensors[k].numel * (vars.args.all_gather_size != null ? vars.args.all_gather_size : 1) : vars.msg.tensors[k].numel) : 0})"
          metadata: "= vars.msg.metadata"
          src: "= vars.src"

  - component: group-coordinator
    name: send-object
    kind: function
    latency_ms: 0
    summary: "GroupCoordinator.send_object: pickle the object and send its size, then its bytes, to a peer on the CPU group; the destination must be in the group and not this rank."
    sources: ["vllm/distributed/parallel_state.py:895-920"]
    request: {type: object, required: [world_size, rank_in_group, dst], properties: {group_name: {type: string, default: "pp:0"}, world_size: {type: integer}, rank_in_group: {type: integer}, dst: {type: integer}, obj: {description: "any picklable value"}}}
    response: {type: "null"}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set: {vars.g: "= has(input.group_name) ? input.group_name : 'pp:0'"}
      - if: "input.dst >= input.world_size"
        then:
          - source: "vllm/distributed/parallel_state.py:899"
            fail: {code: assertion-error, status: 0, message: "= 'Invalid dst rank (' + string(input.dst) + ')'"}
      - if: "input.dst == input.rank_in_group"
        then:
          - source: "vllm/distributed/parallel_state.py:901-904"
            fail: {code: assertion-error, status: 0, message: "Invalid destination rank. Destination rank is the same as the current rank."}
      - source: "vllm/distributed/parallel_state.py:906-918"
        put: "= 'obj:' + vars.g + ':' + string(input.rank_in_group) + '->' + string(input.dst)"
        value: "= has(input.obj) ? input.obj : null"
      - return: null

  - component: group-coordinator
    name: recv-object
    kind: function
    latency_ms: 0
    summary: "GroupCoordinator.recv_object: receive the size, then the pickled bytes, from a peer on the CPU group and unpickle them; the source must be in the group and not this rank."
    sources: ["vllm/distributed/parallel_state.py:922-960"]
    request: {type: object, required: [world_size, rank_in_group, src], properties: {group_name: {type: string, default: "pp:0"}, world_size: {type: integer}, rank_in_group: {type: integer}, src: {type: integer}, timeout_ms: {type: integer, default: 600000}}}
    response: {}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - set: {vars.g: "= has(input.group_name) ? input.group_name : 'pp:0'"}
      - if: "input.src >= input.world_size"
        then:
          - source: "vllm/distributed/parallel_state.py:926"
            fail: {code: assertion-error, status: 0, message: "= 'Invalid src rank (' + string(input.src) + ')'"}
      - if: "input.src == input.rank_in_group"
        then:
          - source: "vllm/distributed/parallel_state.py:928-930"
            fail: {code: assertion-error, status: 0, message: "Invalid source rank. Source rank is the same as the current rank."}
      - source: "vllm/distributed/parallel_state.py:932-958"
        receive: "= 'obj:' + vars.g + ':' + string(input.src) + '->' + string(input.rank_in_group)"
        timeout_ms: "= has(input.timeout_ms) ? input.timeout_ms : 600000"
        as: obj
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'recv from rank ' + string(input.src) + ' timed out'"}
      - return: "= vars.obj"

  # ---------------------------------------------------------------- heterogeneous-TP transfer topology
  - component: transfer-topology
    name: handshake-target-ranks
    kind: function
    latency_ms: 0
    summary: "TransferTopology.handshake_target_ranks (and target_remote_ranks): with a sharded remote (DCP > 1) the remote ranks whose DCP slice overlaps this rank's; else by tp_ratio, local TP >= remote TP reads remote rank tp_rank // ratio, local TP < remote TP reads |ratio| consecutive remote ranks. Indivisible TP sizes are refused."
    sources: ["vllm/distributed/kv_transfer/kv_connector/utils.py:564-586", "vllm/distributed/kv_transfer/kv_connector/utils.py:494-512", "vllm/distributed/kv_transfer/kv_connector/utils.py:542-562", "vllm/distributed/kv_transfer/kv_connector/utils.py:606-619"]
    request:
      type: object
      required: [tp_rank, tp_size, remote_tp_size]
      properties:
        tp_rank: {type: integer, examples: [1]}
        tp_size: {type: integer, examples: [4]}
        remote_tp_size: {type: integer, examples: [2]}
        dcp_size: {type: integer, default: 1}
        remote_dcp_size: {type: integer, default: 1}
    response: {type: object, properties: {tp_ratio: {type: integer}, ranks: {type: array, items: {type: integer}}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.args: "= merge({'dcp_size': 1, 'remote_dcp_size': 1}, input)"
      - if: "vars.args.remote_dcp_size > 1"
        then:
          - set: {vars.dcp_rank: "= vars.args.tp_rank % vars.args.dcp_size"}
          - title: "dcp_source_ranks: every remote rank inside my slice when mine is coarser, else the one remote rank covering it"
            source: "vllm/distributed/kv_transfer/kv_connector/utils.py:542-562"
            return:
              tp_ratio: 0
              ranks: "= vars.args.dcp_size <= vars.args.remote_dcp_size ? lists.range(vars.args.remote_tp_size).filter(r, r % vars.args.dcp_size == vars.dcp_rank) : [vars.dcp_rank % vars.args.remote_dcp_size]"
      - if: "vars.args.tp_size >= vars.args.remote_tp_size && vars.args.tp_size % vars.args.remote_tp_size != 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/utils.py:501-505"
            fail: {code: assertion-error, status: 0, message: "= 'Local tensor parallel size ' + string(vars.args.tp_size) + ' is not divisible by remote tensor parallel size ' + string(vars.args.remote_tp_size) + '.'"}
      - if: "vars.args.tp_size < vars.args.remote_tp_size && vars.args.remote_tp_size % vars.args.tp_size != 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/utils.py:507-511"
            fail: {code: assertion-error, status: 0, message: "= 'Remote tensor parallel size ' + string(vars.args.remote_tp_size) + ' is not divisible by local tensor parallel size ' + string(vars.args.tp_size) + '.'"}
      - set:
          vars.ratio: "= vars.args.tp_size >= vars.args.remote_tp_size ? vars.args.tp_size / vars.args.remote_tp_size : -(vars.args.remote_tp_size / vars.args.tp_size)"
      - return:
          tp_ratio: "= vars.ratio"
          ranks: "= vars.ratio > 0 ? [vars.args.tp_rank / vars.ratio] : lists.range(-vars.ratio).map(i, vars.args.tp_rank * (-vars.ratio) + i)"

  - component: transfer-topology
    name: dcp-consumer-count
    kind: function
    latency_ms: 0
    summary: "TransferTopology.dcp_consumer_count: how many local readers a producer rank waits for before freeing a request's blocks: tp_ratio (at least 1) with an unsharded remote; with a sharded remote, every local rank when local is replicated, else dcp_size // remote_dcp_size."
    sources: ["vllm/distributed/kv_transfer/kv_connector/utils.py:588-604"]
    request:
      type: object
      required: [tp_size, remote_tp_size]
      properties:
        tp_size: {type: integer}
        remote_tp_size: {type: integer}
        dcp_size: {type: integer, default: 1}
        remote_dcp_size: {type: integer, default: 1}
    response: {type: object, properties: {count: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.args: "= merge({'dcp_size': 1, 'remote_dcp_size': 1}, input)"
      - if: "vars.args.remote_dcp_size > 1"
        then:
          - return: {count: "= vars.args.dcp_size == 1 ? vars.args.tp_size : math.greatest(1, vars.args.dcp_size / vars.args.remote_dcp_size)"}
      - call: transfer-topology.handshake-target-ranks
        input: {tp_rank: 0, tp_size: "= vars.args.tp_size", remote_tp_size: "= vars.args.remote_tp_size"}
        as: r
      - return: {count: "= math.greatest(1, vars.r.value.tp_ratio)"}

  - component: transfer-topology
    name: block-size-ratio
    kind: function
    latency_ms: 0
    summary: "TransferTopology.block_size_ratio: local block size // remote block size; the local size must be a multiple."
    sources: ["vllm/distributed/kv_transfer/kv_connector/utils.py:514-520"]
    request: {type: object, required: [block_size, remote_block_size], properties: {block_size: {type: integer, examples: [16]}, remote_block_size: {type: integer, examples: [16]}}}
    response: {type: object, properties: {ratio: {type: integer}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "input.block_size % input.remote_block_size != 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/utils.py:516-519"
            fail: {code: assertion-error, status: 0, message: "= 'Local block size ' + string(input.block_size) + ' is not divisible by remote block size ' + string(input.remote_block_size) + ' or vice versa.'"}
      - return: {ratio: "= input.block_size / input.remote_block_size"}

  - component: transfer-topology
    name: replicates-kv-cache
    kind: function
    latency_ms: 0
    summary: "TransferTopology.replicates_kv_cache: MLA always replicates; otherwise a side replicates when its TP size exceeds the KV heads (local_physical_heads is then 1)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/utils.py:522-540", "vllm/distributed/kv_transfer/kv_connector/utils.py:443-444"]
    request: {type: object, required: [total_num_kv_heads, tp_size, remote_tp_size], properties: {total_num_kv_heads: {type: integer, examples: [8]}, tp_size: {type: integer}, remote_tp_size: {type: integer}, is_mla: {type: boolean, default: false}}}
    response: {type: object, properties: {remote_replicates: {type: boolean}, local_replicates: {type: boolean}, local_physical_heads: {type: integer}}}
    behavior:
      - set: {vars.mla: "= has(input.is_mla) && input.is_mla"}
      - return:
          remote_replicates: "= vars.mla || input.remote_tp_size > input.total_num_kv_heads"
          local_replicates: "= vars.mla || input.tp_size > input.total_num_kv_heads"
          local_physical_heads: "= math.greatest(1, input.total_num_kv_heads / input.tp_size)"

  # ---------------------------------------------------------------- MultiConnector
  - component: multi-connector
    name: request-finished
    kind: function
    latency_ms: 0
    summary: "MultiConnector.request_finished: ask every child; the request waits on an async save if any child says so (extra async saves beyond the first are counted for the workers), the children's kv_transfer_params are merged and a key two children both set is a RuntimeError; the request's load assignment is dropped."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:541-580"]
    request: DistKvRequest
    response: DistKvFinished
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.impl: "= {'NixlConnector': 'nixl-pull-connector-scheduler', 'NixlPullConnector': 'nixl-pull-connector-scheduler', 'NixlPushConnector': 'nixl-push-connector-scheduler', 'SimpleCPUOffloadConnector': 'simple-cpu-offload-connector'}"
          vars.saves: 0
          vars.params: null
      - foreach: "= state.connectors"
        as: c
        steps:
          - if: "!(vars.c in vars.impl)"
            then:
              - title: "Children without their own request_finished (ExampleConnector, ...) answer the base (False, None)"
                source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:632-635"
                continue: true
          - call: "= vars.impl[vars.c] + '.request-finished'"
            targets: [nixl-pull-connector-scheduler.request-finished, nixl-push-connector-scheduler.request-finished, simple-cpu-offload-connector.request-finished]
            input: "= input"
            as: f
          - if: "vars.f.value.delay_free_blocks"
            then:
              - set: {vars.saves: "= vars.saves + 1"}
          - if: "vars.f.value.kv_transfer_params != null"
            then:
              - if: "vars.params != null && vars.params.exists(k, k in vars.f.value.kv_transfer_params)"
                then:
                  - source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:556-562"
                    fail: {code: runtime-error, status: 0, message: "= 'Key clash in kv_transfer_params from multiple connectors: {' + vars.params.filter(k, k in vars.f.value.kv_transfer_params).map(k, \"'\" + k + \"'\").join(', ') + '}'"}
              - set: {vars.params: "= vars.params == null ? vars.f.value.kv_transfer_params : merge(vars.params, vars.f.value.kv_transfer_params)"}
      - if: "vars.saves > 1"
        then:
          - title: The workers must see one finished_sending per async save
            source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:565-566"
            set: {state.extra_async_saves: "= merge(state.extra_async_saves, {input.request_id: vars.saves - 1})"}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:568"
        set: {state.requests_to_connector: "= state.requests_to_connector.filter(k, k != input.request_id).transformMapEntry(i, k, {k: state.requests_to_connector[k]})"}
      - return: {delay_free_blocks: "= vars.saves > 0", kv_transfer_params: "= vars.params"}

  - component: multi-connector
    name: update-connector-output
    kind: function
    latency_ms: 0
    summary: "MultiConnector.update_connector_output: hand the output to every child in order, each with its own slice of the MultiKVConnectorWorkerMetadata when there is one; the combined metadata is put back afterwards, even on error."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:496-515"]
    request: {type: object, properties: {finished_store_events: {type: array, items: {type: integer}}, finished_sending: {type: array, items: {type: string}}, finished_recving: {type: array, items: {type: string}}, kv_connector_worker_meta: {type: [object, "null"], description: "MultiKVConnectorWorkerMetadata: {metadata: [one per child]}"}}}
    response: {type: object, properties: {children: {type: array}, kv_connector_worker_meta: {type: [object, "null"]}}}
    behavior:
      - set:
          vars.meta: "= has(input.kv_connector_worker_meta) ? input.kv_connector_worker_meta : null"
          vars.children: []
      - foreach: "= lists.range(size(state.connectors))"
        as: i
        steps:
          - set: {vars.child_meta: "= vars.meta != null ? vars.meta.metadata[vars.i] : null"}
          - if: "state.connectors[vars.i] == 'SimpleCPUOffloadConnector'"
            then:
              - call: simple-cpu-offload-connector.update-connector-output
                input: "= merge(input, {'kv_connector_worker_meta': vars.child_meta})"
                as: u
              - set: {vars.children: "= vars.children + [{'connector': state.connectors[vars.i], 'worker_meta': vars.child_meta, 'cached': vars.u.value.cached}]"}
            else:
              - title: The base update_connector_output does nothing
                source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:606-614"
                set: {vars.children: "= vars.children + [{'connector': state.connectors[vars.i], 'worker_meta': vars.child_meta, 'cached': 0}]"}
      - title: "finally: restore the combined worker metadata"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:513-515"
        return: {children: "= vars.children", kv_connector_worker_meta: "= vars.meta"}

  # ---------------------------------------------------------------- factory
  - component: kv-connector-factory
    name: create-connector
    kind: function
    summary: "KVConnectorFactory.create_connector: requires kv_transfer_config, resolves the class, refuses a non-HMA connector when HMA is explicitly enabled, and builds it for the given role."
    sources: ["vllm/distributed/kv_transfer/kv_connector/factory.py:43-75"]
    request:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [SCHEDULER, WORKER], examples: [WORKER]}
        has_kv_transfer_config: {type: boolean, default: true}
        kv_connector_module_path: {type: [string, "null"], default: null}
    response: {type: object, properties: {connector: {type: string}, role: {type: string}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "has(input.has_kv_transfer_config) && !input.has_kv_transfer_config"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/factory.py:49-51"
            fail: {code: value-error, status: 0, message: "kv_transfer_config must be set to create a connector"}
      - call: kv-connector-factory.get-connector-class
        input: {kv_connector: "= config['kv-connector']", kv_connector_module_path: "= has(input.kv_connector_module_path) ? input.kv_connector_module_path : null"}
        as: cls
      - set:
          vars.hma_enabled: "= 'disable-hybrid-kv-cache-manager' in config && config['disable-hybrid-kv-cache-manager'] == false"
      - title: HMA enabled but the connector lacks SupportsHMA
        source: "vllm/distributed/kv_transfer/kv_connector/factory.py:55-61"
        if: "vars.hma_enabled && !(config['kv-connector'] in state.hma)"
        then:
          - fail: {code: value-error, status: 0, message: "= 'Connector ' + config['kv-connector'] + ' does not support HMA but HMA is enabled. Please set `--disable-hybrid-kv-cache-manager`.'"}
      - title: Build the connector for this role
        detail: "Scheduler and worker connectors are separate objects in separate processes."
        source: "vllm/distributed/kv_transfer/kv_connector/factory.py:62-75"
        return: {connector: "= config['kv-connector']", role: "= input.role"}

  - component: kv-connector-factory
    name: get-connector-class
    kind: function
    summary: "KVConnectorFactory.get_connector_class: an external module path wins; else the lazy registry; else 'Unsupported connector type'."
    sources: ["vllm/distributed/kv_transfer/kv_connector/factory.py:97-129"]
    request: {type: object, properties: {kv_connector: {type: string, examples: [NixlConnector]}, kv_connector_module_path: {type: [string, "null"]}}}
    response: {type: object, properties: {connector: {type: string}, external: {type: boolean}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "input.kv_connector == ''"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/factory.py:101-102"
            fail: {code: value-error, status: 0, message: "Connector name is not set in KVTransferConfig"}
      - if: "input.kv_connector_module_path != null && input.kv_connector_module_path == ''"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/factory.py:104-105"
            fail: {code: value-error, status: 0, message: "kv_connector_module_path cannot be an empty string."}
      - if: "input.kv_connector_module_path != null"
        then:
          - title: External module path takes priority over the registry
            source: "vllm/distributed/kv_transfer/kv_connector/factory.py:106-124"
            return: {connector: "= input.kv_connector", external: true}
      - if: "!(input.kv_connector in state.registry)"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/factory.py:127-128"
            fail: {code: value-error, status: 0, message: "= 'Unsupported connector type: ' + input.kv_connector"}
      - source: "vllm/distributed/kv_transfer/kv_connector/factory.py:125-126"
        return: {connector: "= input.kv_connector", external: false}

  # ---------------------------------------------------------------- worker-side agent
  - component: kv-transfer-state
    name: ensure-kv-transfer-initialized
    kind: function
    summary: "ensure_kv_transfer_initialized: once per worker, if this is a KV-transfer instance, sync engine_id from TP rank 0 and build the WORKER-role connector."
    sources: ["vllm/distributed/kv_transfer/kv_transfer_state.py:72-91"]
    attributes: {racy_in_code: "vllm/distributed/kv_transfer/kv_transfer_state.py:78-79 reads _KV_CONNECTOR_AGENT and vllm/distributed/kv_transfer/kv_transfer_state.py:87-91 assigns it, with no lock; only the worker's main thread calls it"}
    request: {type: object, properties: {engine_id: {type: string, examples: [engine-p0]}}}
    response: {type: object, properties: {agent: {type: string}, created: {type: boolean}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "state.agent != ''"
        then:
          - source: "vllm/distributed/kv_transfer/kv_transfer_state.py:78-79"
            return: {agent: "= state.agent", created: false}
      - if: "config['kv-connector'] == '' || !(config['kv-role'] in ['kv_producer', 'kv_consumer', 'kv_both'])"
        then:
          - title: Not a KV-transfer instance; no agent
            source: "vllm/distributed/kv_transfer/kv_transfer_state.py:81-82"
            return: {agent: "", created: false}
      - title: Broadcast engine_id from TP rank 0 so the whole TP group agrees
        source: "vllm/distributed/kv_transfer/kv_transfer_state.py:50-69"
        call: parallel-state.get-tp-group
        as: tp
      - call: kv-connector-factory.create-connector
        input: {role: WORKER}
        as: made
      - set: {state.agent: "= vars.made.value.connector", state.engine_id: "= has(input.engine_id) ? input.engine_id : 'engine-p0'"}
      - return: {agent: "= state.agent", created: true}

  - component: kv-transfer-state
    name: get-kv-transfer-group
    kind: function
    summary: "get_kv_transfer_group: the worker's connector agent; asserts it exists."
    sources: ["vllm/distributed/kv_transfer/kv_transfer_state.py:19-23"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {agent: {type: string}, engine_id: {type: string}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "state.agent == ''"
        then:
          - fail: {code: assertion-error, status: 0, message: "disaggregated KV cache transfer parallel group is not initialized"}
      - return: {agent: "= state.agent", engine_id: "= state.engine_id"}

  - component: kv-transfer-state
    name: ensure-kv-transfer-shutdown
    kind: function
    summary: "ensure_kv_transfer_shutdown: shut the agent down and clear the singleton."
    sources: ["vllm/distributed/kv_transfer/kv_transfer_state.py:94-98"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {shut_down: {type: boolean}}}
    behavior:
      - if: "state.agent == ''"
        then:
          - return: {shut_down: false}
      - set: {state.agent: ""}
      - return: {shut_down: true}

  # ---------------------------------------------------------------- the KVConnectorBase_V1 seam
  - component: kv-connector-base-v1
    name: get-num-new-matched-tokens
    kind: function
    summary: "Scheduler hook: how many tokens beyond num_computed_tokens the connector can supply, and whether they load asynchronously (the request then waits in WAITING_FOR_REMOTE_KVS)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:501-533"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request: DistKvRequest
    response: DistKvMatch
    behavior:
      - if: "config['kv-connector'] == ''"
        then:
          - title: No connector configured; the scheduler skips the hook
            return: {num_external_tokens: 0, load_async: false, connector: none}
      - if: "config['kv-connector'] == 'MultiConnector'"
        then:
          - title: "MultiConnector asks its children in config order; the first with matched tokens loads the request"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:434-453"
            call: multi-connector.get-num-new-matched-tokens
            input: "= input"
            as: mm
          - return: "= vars.mm.value"
      - if: "config['kv-connector'] == 'HiSparseConnector'"
        then:
          - title: "HiSparseConnector never supplies prefix tokens: (0, False)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/hisparse/connector.py:377-380"
            return: {num_external_tokens: 0, load_async: false, connector: HiSparseConnector}
      - set:
          vars.impl: "= {'ExampleConnector': 'example-connector', 'NixlConnector': 'nixl-pull-connector-scheduler', 'NixlPullConnector': 'nixl-pull-connector-scheduler', 'MoRIIOConnector': 'moriio-connector-scheduler', 'SimpleCPUOffloadConnector': 'simple-cpu-offload-connector'}"
      - if: "!(config['kv-connector'] in vars.impl)"
        then:
          - title: A registered connector this model does not implement
            return: {num_external_tokens: 0, load_async: false, connector: not-modeled}
      - call: "= vars.impl[config['kv-connector']] + '.get-num-new-matched-tokens'"
        targets: [example-connector.get-num-new-matched-tokens, nixl-pull-connector-scheduler.get-num-new-matched-tokens, moriio-connector-scheduler.get-num-new-matched-tokens, simple-cpu-offload-connector.get-num-new-matched-tokens]
        input: "= input"
        as: m
      - return: {num_external_tokens: "= vars.m.value.num_external_tokens", load_async: "= vars.m.value.load_async", connector: "= config['kv-connector']"}

  - component: kv-connector-base-v1
    name: update-state-after-alloc
    kind: function
    summary: "Scheduler hook after blocks were allocated for a request with external tokens: the connector records what to load or save in the next step."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:554-578"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request: DistKvRequest
    response: {type: object, properties: {kv_transfer_params: {type: [object, "null"]}, recorded: {type: boolean}}}
    behavior:
      - if: "config['kv-connector'] == ''"
        then:
          - return: {kv_transfer_params: null, recorded: false}
      - if: "config['kv-connector'] == 'HiSparseConnector'"
        then:
          - title: "HiSparseConnector records the allocated request for its scheduler coordinator"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/hisparse/connector.py:382-389"
            call: hisparse-connector.update-state-after-alloc
            input: "= input"
            as: hs
          - return: {kv_transfer_params: null, recorded: true}
      - set:
          vars.impl: "= {'ExampleConnector': 'example-connector', 'NixlConnector': 'nixl-pull-connector-scheduler', 'NixlPullConnector': 'nixl-pull-connector-scheduler', 'MoRIIOConnector': 'moriio-connector-scheduler', 'SimpleCPUOffloadConnector': 'simple-cpu-offload-connector'}"
      - if: "!(config['kv-connector'] in vars.impl)"
        then:
          - return: {kv_transfer_params: null, recorded: false}
      - call: "= vars.impl[config['kv-connector']] + '.update-state-after-alloc'"
        targets: [example-connector.update-state-after-alloc, nixl-pull-connector-scheduler.update-state-after-alloc, moriio-connector-scheduler.update-state-after-alloc, simple-cpu-offload-connector.update-state-after-alloc]
        input: "= input"
        as: u
      - return: "= vars.u.value"

  - component: kv-connector-base-v1
    name: build-connector-meta
    kind: function
    summary: "Scheduler hook at the end of schedule(): build this step's KVConnectorMetadata (attached to the SchedulerOutput) and reset the connector's per-step state."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:580-596"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request:
      type: object
      properties:
        scheduled_new_reqs:
          type: array
          items: {type: object, properties: {req_id: {type: string}, prompt_token_ids: {type: array, items: {type: integer}}, block_ids: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {requests: {type: array}, reqs_to_recv: {type: object}, reqs_to_save: {type: object}, reqs_to_send: {type: object}, reqs_in_batch: {type: array}, reqs_not_processed: {type: array}, metadata: {type: array}, extra_async_saves: {type: [object, "null"]}}}
    behavior:
      - if: "config['kv-connector'] == 'MultiConnector'"
        then:
          - title: "MultiConnector: the tuple of its children's metadata plus the pending extra async saves"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:483-494"
            call: multi-connector.build-connector-meta
            input: "= input"
            as: mmeta
          - return: "= vars.mmeta.value"
      - set:
          vars.impl: "= {'ExampleConnector': 'example-connector', 'NixlConnector': 'nixl-pull-connector-scheduler', 'NixlPullConnector': 'nixl-pull-connector-scheduler', 'MoRIIOConnector': 'moriio-connector-scheduler', 'SimpleCPUOffloadConnector': 'simple-cpu-offload-connector'}"
      - if: "!(config['kv-connector'] in vars.impl)"
        then:
          - title: No connector (or one this model does not implement) attaches no metadata
            return: {requests: []}
      - call: "= vars.impl[config['kv-connector']] + '.build-connector-meta'"
        targets: [example-connector.build-connector-meta, nixl-pull-connector-scheduler.build-connector-meta, moriio-connector-scheduler.build-connector-meta, simple-cpu-offload-connector.build-connector-meta]
        input: "= input"
        as: meta
      - return: "= vars.meta.value"

  - component: kv-connector-base-v1
    name: request-finished
    kind: function
    summary: "Scheduler hook when a request finishes: returns whether block freeing must wait for an async send, and kv_transfer_params for the response (prefill nodes return the decode side's pull parameters)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:616-635"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request: DistKvRequest
    response: DistKvFinished
    behavior:
      - if: "config['kv-connector'] in ['NixlConnector', 'NixlPullConnector']"
        then:
          - call: nixl-pull-connector-scheduler.request-finished
            input: "= input"
            as: f
          - return: "= vars.f.value"
      - if: "config['kv-connector'] == 'NixlPushConnector'"
        then:
          - call: nixl-push-connector-scheduler.request-finished
            input: "= input"
            as: pf
          - return: "= vars.pf.value"
      - if: "config['kv-connector'] == 'SimpleCPUOffloadConnector'"
        then:
          - call: simple-cpu-offload-connector.request-finished
            input: "= input"
            as: sf
          - return: "= vars.sf.value"
      - if: "config['kv-connector'] == 'MultiConnector'"
        then:
          - title: "MultiConnector asks every child and merges their answers"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:571-579"
            call: multi-connector.request-finished
            input: "= input"
            as: mf
          - return: "= vars.mf.value"
      - title: Base implementation (ExampleConnector and no connector) frees blocks now
        source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:632-635"
        return: {delay_free_blocks: false, kv_transfer_params: null}

  - component: kv-connector-base-v1
    name: save-kv-layer
    kind: function
    summary: "Worker hook during the forward pass (called from each attention layer): start saving this layer's KV for the requests marked as stores."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:349-369"]
    attributes: {seam: true, callers: [attention, worker-runner]}
    request: {type: object, properties: {layer_name: {type: string, examples: [model.layers.0.self_attn.attn]}, metadata: {type: object}}}
    response: {type: object, properties: {saved: {type: integer}}}
    behavior:
      - if: "config['kv-connector'] != 'ExampleConnector'"
        then:
          - return: {saved: 0}
      - call: example-connector.save-kv-layer
        input: "= input"
        as: s
      - return: "= vars.s.value"

  - component: kv-connector-base-v1
    name: start-load-kv
    kind: function
    summary: "Worker hook before the forward pass: start loading external KV into the paged buffer for the requests in this step's metadata."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:318-333"]
    attributes: {seam: true, callers: [worker-runner]}
    request: {type: object, properties: {metadata: {type: object}, has_attn_metadata: {type: boolean, default: true}, layer_names: {type: array, items: {type: string}}}}
    response: {type: object, properties: {loaded: {type: integer}}}
    behavior:
      - if: "config['kv-connector'] in ['NixlConnector', 'NixlPullConnector']"
        then:
          - title: The NIXL worker starts non-blocking READs for this step's reqs_to_recv
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/connector.py:366-398"
            call: nixl-pull-connector-worker.start-load-kv
            input: {metadata: "= has(input.metadata) ? input.metadata : {}"}
            as: nl
          - return: {loaded: "= vars.nl.value.started"}
      - if: "config['kv-connector'] != 'ExampleConnector'"
        then:
          - return: {loaded: 0}
      - call: example-connector.start-load-kv
        input: "= input"
        as: l
      - return: "= vars.l.value"

  # ---------------------------------------------------------------- ExampleConnector
  - component: example-connector
    name: get-num-new-matched-tokens
    kind: function
    summary: "ExampleConnector.get_num_new_matched_tokens: a hit when the folder for the block-aligned prompt prefix (all tokens but the last) exists; never asynchronous."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:264-299", "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:403-416"]
    request: DistKvRequest
    response: DistKvMatch
    behavior:
      - set:
          vars.tokens: "= has(input.prompt_token_ids) ? input.prompt_token_ids : []"
      - title: "align_to_block_size(len(token_ids) - 1) = (len - 2) // block_size * block_size"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:455-457"
        set:
          vars.n: "= size(vars.tokens) < 2 ? 0 : (size(vars.tokens) - 2) / state.block_size * state.block_size"
      - set:
          vars.key: "= vars.tokens.slice(0, vars.n).map(t, string(t)).join('-')"
      - call: example-connector-storage.folder-exists
        input: {key: "= vars.key"}
        as: hit
        on_error: continue
      - if: "!vars.hit.ok"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:289-290"
            return: {num_external_tokens: 0, load_async: false}
      - title: External cache hit
        source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:291-299"
        return: {num_external_tokens: "= vars.n - (has(input.num_computed_tokens) ? input.num_computed_tokens : 0)", load_async: false}

  - component: example-connector
    name: update-state-after-alloc
    kind: function
    summary: "ExampleConnector.update_state_after_alloc: remember requests with external tokens so the next metadata loads them."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:301-310"]
    request: DistKvRequest
    response: {type: object, properties: {kv_transfer_params: {type: [object, "null"]}, recorded: {type: boolean}}}
    behavior:
      - if: "has(input.num_external_tokens) && input.num_external_tokens > 0"
        then:
          - set: {state.requests_need_load: "= merge(state.requests_need_load, {input.request_id: {'prompt_token_ids': has(input.prompt_token_ids) ? input.prompt_token_ids : []}})"}
          - return: {kv_transfer_params: null, recorded: true}
      - return: {kv_transfer_params: null, recorded: false}

  - component: example-connector
    name: build-connector-meta
    kind: function
    summary: "ExampleConnector.build_connector_meta: new requests flagged for load become load entries; the rest become store entries unless the prefix is already on disk. Clears the pending loads."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:312-387"]
    request:
      type: object
      properties:
        scheduled_new_reqs:
          type: array
          items: {type: object, properties: {req_id: {type: string}, prompt_token_ids: {type: array, items: {type: integer}}, block_ids: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {requests: {type: array}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.reqs: []
          vars.loads: 0
          vars.need: "= state.requests_need_load"
          vars.scheduled_loads: "= (has(input.scheduled_new_reqs) ? input.scheduled_new_reqs : []).filter(r, r.req_id in state.requests_need_load).size()"
      - title: "assert total_need_load == len(self._requests_need_load): a pending load not scheduled this step"
        detail: "The code checks after building the metadata; nothing outside the method sees the difference, and on failure the dict is left as it was."
        source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:385"
        if: "vars.scheduled_loads != size(vars.need)"
        then:
          - fail: {code: assertion-error, status: 0, message: ""}
      - title: Take this step's pending loads; the dict is cleared
        source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:386"
        set: {state.requests_need_load: {}}
      - foreach: "= has(input.scheduled_new_reqs) ? input.scheduled_new_reqs : []"
        as: nr
        steps:
          - set:
              vars.tokens: "= has(vars.nr.prompt_token_ids) ? vars.nr.prompt_token_ids : []"
          - set:
              vars.n: "= size(vars.tokens) < 2 ? 0 : (size(vars.tokens) - 2) / state.block_size * state.block_size"
          - set:
              vars.key: "= vars.tokens.slice(0, vars.n).map(t, string(t)).join('-')"
          - if: "vars.nr.req_id in vars.need"
            then:
              - title: Load entry for a request with external tokens
                source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:330-339"
                set:
                  vars.reqs: "= vars.reqs + [{'req_id': vars.nr.req_id, 'key': vars.key, 'num_tokens': size(vars.tokens), 'is_store': false}]"
                  vars.loads: "= vars.loads + 1"
            else:
              - call: example-connector-storage.folder-exists
                input: {key: "= vars.key"}
                as: hit
                on_error: continue
              - title: Store entry unless this prefix is already saved
                source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:340-354"
                if: "!vars.hit.ok"
                then:
                  - set:
                      vars.reqs: "= vars.reqs + [{'req_id': vars.nr.req_id, 'key': vars.key, 'num_tokens': size(vars.tokens), 'is_store': true}]"
      - return: {requests: "= vars.reqs"}

  - component: example-connector
    name: save-kv-layer
    kind: function
    summary: "ExampleConnector.save_kv_layer: for every store entry, extract this layer's KV at the request's slots and write <folder>/<layer>.safetensors (each worker writes the same path)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:212-259"]
    request: {type: object, properties: {layer_name: {type: string, examples: [model.layers.0.self_attn.attn]}, metadata: {type: object}}}
    response: {type: object, properties: {saved: {type: integer}}}
    behavior:
      - set: {vars.saved: 0}
      - foreach: "= has(input.metadata) && has(input.metadata.requests) ? input.metadata.requests : []"
        as: r
        steps:
          - if: "vars.r.is_store"
            then:
              - title: safetensors.torch.save_file(<folder>/<layer>.safetensors)
                source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:250-259"
                call: example-connector-storage.save-file
                input: {key: "= vars.r.key", num_tokens: "= vars.r.num_tokens", layer_name: "= input.layer_name"}
              - set: {vars.saved: "= vars.saved + 1"}
      - return: {saved: "= vars.saved"}

  - component: example-connector
    name: start-load-kv
    kind: function
    summary: "ExampleConnector.start_load_kv: for every load entry and every attention layer, read the saved file and inject it into the paged KV buffer at the slot mapping. Without attention metadata it warns and returns."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:110-198"]
    request: {type: object, properties: {metadata: {type: object}, has_attn_metadata: {type: boolean, default: true}, layer_names: {type: array, items: {type: string}}}}
    response: {type: object, properties: {loaded: {type: integer}}}
    errors:
      - {code: file-not-found-error, status: 0, retryable: false}
    behavior:
      - if: "has(input.has_attn_metadata) && !input.has_attn_metadata"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:162-165"
            return: {loaded: 0}
      - set: {vars.loaded: 0}
      - foreach: "= has(input.metadata) && has(input.metadata.requests) ? input.metadata.requests : []"
        as: r
        steps:
          - if: "!vars.r.is_store"
            then:
              - title: safetensors.torch.load_file, then inject into the layer
                source: "vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:168-198"
                call: example-connector-storage.load-file
                input: {key: "= vars.r.key"}
              - set: {vars.loaded: "= vars.loaded + 1"}
      - return: {loaded: "= vars.loaded"}

  - component: example-connector-storage
    name: folder-exists
    kind: io
    summary: "os.path.exists(<storage>/<prefix hash>)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:416"]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    errors:
      - {code: not_found, status: 404, retryable: false}
    store: {table: folders, op: get, key: "= input.key == '' ? '_empty' : input.key"}

  - component: example-connector-storage
    name: save-file
    kind: io
    summary: "Write <folder>/<layer>.safetensors, creating the folder."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:437"]
    request: {type: object, required: [key], properties: {key: {type: string}, num_tokens: {type: integer}, layer_name: {type: string}}}
    store: {table: folders, op: put, key: "= input.key == '' ? '_empty' : input.key", value: {num_tokens: "= input.num_tokens", last_layer: "= input.layer_name", saved_at: "= now"}}

  - component: example-connector-storage
    name: load-file
    kind: io
    summary: "safetensors.torch.load_file(<folder>/<layer>.safetensors); a missing file raises."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/example_connector.py:190"]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    errors:
      - {code: file-not-found-error, status: 0, retryable: false}
    store: {table: folders, op: get, key: "= input.key == '' ? '_empty' : input.key", not_found: file-not-found-error}

  # ---------------------------------------------------------------- NIXL pull scheduler
  - component: nixl-pull-connector-scheduler
    name: get-num-new-matched-tokens
    kind: function
    summary: "NixlPullConnectorScheduler.get_num_new_matched_tokens: a decode node pulls every remote-prefilled prompt token (async); a prefill node may pull a partial decode-side hit unless it is below kv_recompute_threshold."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:34-106"]
    request: DistKvRequest
    response: DistKvMatch
    behavior:
      - set:
          vars.p: "= has(input.kv_transfer_params) && input.kv_transfer_params != null ? input.kv_transfer_params : {}"
          vars.computed: "= has(input.num_computed_tokens) ? input.num_computed_tokens : 0"
          vars.nprompt: "= has(input.num_prompt_tokens) ? input.num_prompt_tokens : (has(input.prompt_token_ids) ? size(input.prompt_token_ids) : 0)"
      - if: "'do_remote_prefill' in vars.p && vars.p.do_remote_prefill"
        then:
          - title: "Remote prefill: load all prompt tokens but the decoder's backoff"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:59-65"
            set:
              vars.actual: "= state.prefill_backoff > 0 && vars.nprompt > state.prefill_backoff ? vars.nprompt - state.prefill_backoff : vars.nprompt"
          - if: "vars.actual - vars.computed > 0"
            then:
              - return: {num_external_tokens: "= vars.actual - vars.computed", load_async: true}
      - if: "'do_remote_decode' in vars.p && vars.p.do_remote_decode && 'remote_block_ids' in vars.p && size(vars.p.remote_block_ids) > 0 && ['remote_engine_id', 'remote_request_id', 'remote_host', 'remote_port'].all(k, k in vars.p)"
        then:
          - set:
              vars.count: "= math.least(('remote_num_tokens' in vars.p && vars.p.remote_num_tokens != null ? vars.p.remote_num_tokens : 0), vars.nprompt) - vars.computed"
          - if: "vars.count > 0"
            then:
              - title: Partial hit below kv_recompute_threshold is recomputed, not pulled
                source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:89-103"
                if: "config['nixl-kv-recompute-threshold'] > 0 && vars.count < config['nixl-kv-recompute-threshold']"
                then:
                  - return: {num_external_tokens: 0, load_async: false}
              - return: {num_external_tokens: "= vars.count", load_async: true}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:105-106"
        return: {num_external_tokens: 0, load_async: false}

  - component: nixl-pull-connector-scheduler
    name: update-state-after-alloc
    kind: function
    summary: "NixlPullConnectorScheduler.update_state_after_alloc: queue the pull of remote blocks into the newly allocated (unhashed) local blocks, once per request, and flip do_remote_prefill off."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:108-189"]
    request: DistKvRequest
    response: {type: object, properties: {kv_transfer_params: {type: [object, "null"]}, recorded: {type: boolean}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.p: "= has(input.kv_transfer_params) && input.kv_transfer_params != null ? input.kv_transfer_params : {}"
          vars.ext: "= has(input.num_external_tokens) ? input.num_external_tokens : 0"
      - if: "size(vars.p) == 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:117-120"
            return: {kv_transfer_params: null, recorded: false}
      - set:
          vars.decode: "= 'do_remote_decode' in vars.p && vars.p.do_remote_decode"
          vars.prefill: "= 'do_remote_prefill' in vars.p && vars.p.do_remote_prefill"
      - if: "vars.decode"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:122-125"
            set: {state.reqs_in_batch: "= state.reqs_in_batch + [input.request_id]"}
      - if: "state.use_host_buffer && vars.decode"
        then:
          - title: Host-buffer platforms save prefilled blocks to host memory first
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:126-129"
            set: {state.reqs_need_save: "= merge(state.reqs_need_save, {input.request_id: true})"}
          - return: {kv_transfer_params: "= vars.p", recorded: true}
      - if: "!vars.prefill"
        then:
          - return: {kv_transfer_params: "= vars.p", recorded: false}
      - if: "'remote_block_ids' in vars.p && size(vars.p.remote_block_ids) > 0"
        then:
          - if: "['remote_engine_id', 'remote_request_id', 'remote_host', 'remote_port'].all(k, k in vars.p)"
            then:
              - title: Queue the pull; park in WAITING_FOR_REMOTE_KVS only when something is pulled
                detail: "A full local prefix hit (num_external_tokens == 0) still records an empty pull so the prefill node gets its free notification."
                source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:135-178"
                call: nixl-pull-connector-scheduler.reqs-need-recv-put
                input:
                  request_id: "= input.request_id"
                  row: "= {'remote_engine_id': vars.p.remote_engine_id, 'remote_request_id': vars.p.remote_request_id, 'remote_host': vars.p.remote_host, 'remote_port': vars.p.remote_port, 'remote_block_ids': vars.p.remote_block_ids, 'remote_num_tokens': 'remote_num_tokens' in vars.p ? vars.p.remote_num_tokens : null, 'local_block_ids': vars.ext > 0 && has(input.block_ids) ? input.block_ids : [], 'park': vars.ext > 0}"
            else:
              - title: Invalid KVTransferParams; the request will not use KV transfer
                source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:179-184"
                set: {vars.invalid: true}
        else:
          - title: "No remote blocks: assert num_external_tokens == 0"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:185-186"
            if: "vars.ext != 0"
            then:
              - fail: {code: assertion-error, status: 0, message: ""}
      - title: Only trigger one KV transfer per request
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:187-189"
        return: {kv_transfer_params: "= merge(vars.p, {'do_remote_prefill': false, '_remote_blocks_processed': true})", recorded: "= input.request_id in state.reqs_need_recv"}

  - component: nixl-pull-connector-scheduler
    name: request-finished
    kind: function
    summary: "NixlPullConnectorScheduler.request_finished: on the prefill node, a request that finished by stop or length keeps its blocks for kv_lease_duration and returns the pull parameters for the decoder; aborted or unscheduled requests free at once."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:191-292"]
    request: DistKvRequest
    response: DistKvFinished
    behavior:
      - set:
          vars.p: "= has(input.kv_transfer_params) && input.kv_transfer_params != null ? input.kv_transfer_params : {}"
      - if: "size(vars.p) == 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:209-210"
            return: {delay_free_blocks: false, kv_transfer_params: null}
      - set:
          vars.is_p: "= 'do_remote_decode' in vars.p && vars.p.do_remote_decode"
      - if: "'do_remote_prefill' in vars.p && vars.p.do_remote_prefill"
        then:
          - title: Aborted before it was scheduled; queue an empty pull so the prefill node frees its blocks
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:219-230"
            call: nixl-pull-connector-scheduler.reqs-need-recv-put
            input:
              request_id: "= input.request_id"
              row: "= {'remote_engine_id': 'remote_engine_id' in vars.p ? vars.p.remote_engine_id : '', 'remote_block_ids': [], 'local_block_ids': [], 'park': false}"
          - return: {delay_free_blocks: false, kv_transfer_params: null}
      - if: "!vars.is_p && !state.is_bidirectional"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:231-232"
            return: {delay_free_blocks: false, kv_transfer_params: null}
      - if: "!(input.status in ['FINISHED_LENGTH_CAPPED', 'FINISHED_STOPPED'])"
        then:
          - title: Aborted prefill frees immediately and stops tracking
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:235-244"
            set: {state.reqs_not_processed: "= state.reqs_not_processed + [input.request_id]"}
          - return: {delay_free_blocks: false, kv_transfer_params: null}
      - set:
          vars.blocks: "= has(input.block_ids) ? input.block_ids : []"
      - set:
          vars.delay: "= vars.blocks.exists(g, size(g) > 0)"
      - if: "vars.delay"
        then:
          - title: Keep the blocks for the lease; the decoder reads them, else they expire
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:246-276"
            set:
              state.reqs_need_send: "= merge(state.reqs_need_send, {input.request_id: now + (vars.is_p ? config['nixl-kv-lease-duration'] : config['nixl-decoder-kv-blocks-ttl']) * 1000})"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:278-292"
        return:
          delay_free_blocks: "= vars.delay"
          kv_transfer_params:
            do_remote_prefill: "= vars.is_p"
            do_remote_decode: "= !vars.is_p"
            remote_block_ids: "= vars.blocks"
            remote_engine_id: "= state.engine_id"
            remote_request_id: "= input.request_id"
            remote_host: "= state.side_channel_host"
            remote_port: "= state.side_channel_port"
            remote_num_tokens: "= vars.delay && has(input.num_computed_tokens) ? input.num_computed_tokens : 0"
            transfer_mode: pull

  - component: nixl-pull-connector-scheduler
    name: reqs-need-recv-put
    kind: io
    summary: "_reqs_need_recv[request_id] = (request, local_block_ids, ...): the pulls build_connector_meta hands to the workers next step."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/pull_scheduler.py:170-176"]
    request: {type: object, required: [request_id, row], properties: {request_id: {type: string}, row: {type: object}}}
    store: {table: reqs_need_recv, op: put, key: "= input.request_id", value: "= input.row"}

  - component: nixl-pull-connector-scheduler
    name: set-xfer-handshake-metadata
    kind: function
    summary: "NixlBaseConnectorScheduler.set_xfer_handshake_metadata: encode each (pp_rank, tp_rank) worker's NixlHandshakePayload and start the handshake listener thread once."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:293-335"]
    request:
      type: object
      required: [metadata]
      properties:
        metadata:
          type: array
          items: {type: object, required: [pp_rank, tp_rank, agent_metadata], properties: {pp_rank: {type: integer}, tp_rank: {type: integer}, payload_type: {type: string, default: NixlHandshakePayload}, agent_metadata: {type: string, examples: [agent-rank0]}}}
    response: {type: object, properties: {encoded: {type: integer}, listener_started: {type: boolean}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - if: "input.metadata.exists(m, has(m.payload_type) && m.payload_type != 'NixlHandshakePayload')"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:304-308"
            fail: {code: value-error, status: 0, message: "NixlConnectorScheduler expects NixlHandshakePayload for handshake metadata."}
      - set:
          state.encoded_data: "= merge(state.encoded_data, input.metadata.transformMapEntry(i, m, {string(m.pp_rank) + ',' + string(m.tp_rank): m.agent_metadata}))"
      - if: "!state.listener_started"
        then:
          - title: Start the listener thread only when there is metadata to serve
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:319-335"
            set: {state.listener_started: true}
      - return: {encoded: "= size(input.metadata)", listener_started: true}

  - component: nixl-pull-connector-scheduler
    name: nixl-handshake-listener
    kind: function
    summary: "One iteration of the _nixl_handshake_listener thread (ROUTER socket, 1 s receive timeout): answer a decoder's (GET_META_MSG, pp_rank, tp_rank) with that worker's encoded metadata and this process's perf_counter."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:337-377"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {served: {type: [string, "null"]}, stopped: {type: boolean}}}
    errors:
      - {code: key-error, status: 0, retryable: false}
    behavior:
      - if: "size(state.handshake_inbox) == 0"
        then:
          - title: "zmq.Again after RCVTIMEO: exit when stopped, else keep listening"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:356-360"
            return: {served: null, stopped: "= state.listener_stop"}
      - set:
          vars.msg: "= state.handshake_inbox[0]"
          state.handshake_inbox: "= state.handshake_inbox.slice(1, size(state.handshake_inbox))"
      - if: "vars.msg.msg != 'get_meta_msg'"
        then:
          - title: Unexpected message is logged, then answered anyway
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:367-368"
            set: {vars.unexpected: true}
      - set: {vars.k: "= string(vars.msg.pp_rank) + ',' + string(vars.msg.tp_rank)"}
      - if: "!(vars.k in state.encoded_data)"
        then:
          - title: No metadata for that rank; the KeyError ends the listener thread
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:373-376"
            fail: {code: key-error, status: 0, message: "= '(' + string(vars.msg.pp_rank) + ', ' + string(vars.msg.tp_rank) + ')'"}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:369-376"
        set: {state.handshake_replies: "= state.handshake_replies + [{'rank': vars.k, 'meta': state.encoded_data[vars.k], 'ts': now}]"}
      - return: {served: "= vars.k", stopped: false}

  # ---------------------------------------------------------------- NIXL push writer
  - component: nixl-push-connector-worker
    name: push-writer-loop
    kind: function
    summary: "One wake-up of the nixl-push-writer thread: send pending D registrations, pair finished P blocks with D PUSH_REG registrations (start the WRITE or park the blocks), evict finished/expired requests, and route NIXL notifications."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:236-295"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {pushed: {type: integer}, parked: {type: integer}, self_poll: {type: boolean}}}
    behavior:
      - if: "state.stop"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:239"
            return: {pushed: 0, parked: 0, self_poll: false}
      - set: {vars.pushed: 0}
      - title: 1. D-side registrations to send to P
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:241-246"
        foreach: "= state.reg_send_inbox"
        as: reg
        steps:
          - call: nixl-agent.send-notif
            input: {kind: PUSH_REG, request_id: "= vars.reg.request_id"}
          - set: {state.sent_registrations: "= state.sent_registrations + [vars.reg.request_id]"}
      - set: {state.reg_send_inbox: []}
      - title: 3. P-side finished blocks; match against pending registrations
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:257-266"
        foreach: "= state.finished_blocks_inbox"
        as: fin
        steps:
          - if: "vars.fin.request_id in state.pending_d_registrations"
            then:
              - call: nixl-agent.write-blocks
                input: {request_id: "= vars.fin.request_id", num_blocks: "= size(vars.fin.blocks)"}
              - set:
                  state.pending_d_registrations: "= omit(state.pending_d_registrations, vars.fin.request_id)"
                  state.pushed: "= state.pushed + [vars.fin.request_id]"
                  vars.pushed: "= vars.pushed + 1"
            else:
              - set: {state.push_finished_blocks: "= merge(state.push_finished_blocks, {vars.fin.request_id: vars.fin.blocks})"}
      - set: {state.finished_blocks_inbox: []}
      - title: 3b. Evict finished or lease-expired requests from both maps
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:268-279"
        foreach: "= state.evict_inbox"
        as: rid
        steps:
          - set:
              state.push_finished_blocks: "= omit(state.push_finished_blocks, vars.rid)"
              state.pending_d_registrations: "= omit(state.pending_d_registrations, vars.rid)"
      - set: {state.evict_inbox: []}
      - title: "4. NIXL notifications: PUSH_REG pairs with parked blocks, the rest go to the main thread"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:281-287"
        foreach: "= state.notifs"
        as: n
        steps:
          - if: "vars.n.kind == 'PUSH_REG'"
            then:
              - if: "vars.n.request_id in state.push_finished_blocks"
                then:
                  - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:307-310"
                    call: nixl-agent.write-blocks
                    input: {request_id: "= vars.n.request_id", num_blocks: "= size(state.push_finished_blocks[vars.n.request_id])"}
                  - set:
                      state.push_finished_blocks: "= omit(state.push_finished_blocks, vars.n.request_id)"
                      state.pushed: "= state.pushed + [vars.n.request_id]"
                      vars.pushed: "= vars.pushed + 1"
                else:
                  - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:311-312"
                    set: {state.pending_d_registrations: "= merge(state.pending_d_registrations, {vars.n.request_id: {'registered_at': now}})"}
            else:
              - set: {state.completion_notifs: "= state.completion_notifs + [vars.n]"}
      - set: {state.notifs: []}
      - title: Self-poll only while parked blocks wait for a registration
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:291-295"
        return: {pushed: "= vars.pushed", parked: "= size(state.push_finished_blocks)", self_poll: "= size(state.push_finished_blocks) > 0"}

  - component: nixl-agent
    name: send-notif
    kind: rpc
    summary: "nixl_wrapper.send_notif to the remote agent."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:317-345"]
    request: {type: object, properties: {kind: {type: string}, request_id: {type: string}, engine_id: {type: string}, notif_msg: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    latency_ms: 1

  - component: nixl-agent
    name: remove-remote-agent
    kind: rpc
    summary: "nixl_wrapper.remove_remote_agent: release a remote agent's NIXL metadata."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3700-3701"]
    request: {type: object, properties: {agent_name: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    latency_ms: 0

  - component: nixl-agent
    name: write-blocks
    kind: kernel
    summary: "RDMA WRITE of the request's KV blocks to the decode node (latency from block count; assumes 2 MiB per block across layers at the RDMA bandwidth)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:432-446"]
    request: {type: object, properties: {request_id: {type: string}, num_blocks: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    latency_ms: "= (double(input.num_blocks) * 2097152.0 / (double(config['dist-nixl-rdma-gbps']) * 1000000.0))"

  # ---------------------------------------------------------------- MoRIIO scheduler
  - component: moriio-connector-scheduler
    name: get-num-new-matched-tokens
    kind: function
    summary: "MoRIIOConnectorScheduler.get_num_new_matched_tokens: producers load nothing; WRITE-mode consumers load every uncomputed prompt token asynchronously while do_remote_prefill is set; READ-mode consumers load all but the last token synchronously."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:744-787"]
    request: DistKvRequest
    response: DistKvMatch
    behavior:
      - if: "state.is_producer"
        then:
          - title: The prefill side never loads external KV
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:763-767"
            return: {num_external_tokens: 0, load_async: false}
      - set:
          vars.nprompt: "= has(input.num_prompt_tokens) ? input.num_prompt_tokens : (has(input.prompt_token_ids) ? size(input.prompt_token_ids) : 0)"
          vars.computed: "= has(input.num_computed_tokens) ? input.num_computed_tokens : 0"
      - set:
          vars.ext: "= math.greatest(vars.nprompt - vars.computed, 0)"
      - if: "state.mode == 'WRITE'"
        then:
          - set:
              vars.p: "= has(input.kv_transfer_params) && input.kv_transfer_params != null ? input.kv_transfer_params : {}"
          - if: "!('do_remote_prefill' in vars.p) || !vars.p.do_remote_prefill"
            then:
              - title: No remote prefill pending (for example resumed after preemption); nothing to load
                source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:771-774"
                return: {num_external_tokens: 0, load_async: false}
          - title: The producer RDMA-writes the whole prompt; the request waits for it
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:775-778"
            return: {num_external_tokens: "= vars.ext", load_async: true}
      - title: READ mode recomputes the last token locally and loads synchronously
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:780-787"
        return: {num_external_tokens: "= math.greatest(vars.ext - 1, 0)", load_async: false}

  # ---------------------------------------------------------------- MoRIIO worker threads
  - component: moriio-connector-worker
    name: moriio-handshake-listener
    kind: function
    summary: "One receive of the MoRIIO handshake listener thread: GET_META_MSG gets the engine metadata then the per-layer KV-cache metadata; POP_DONE_RECV reads the request id; anything else raises HandshakeError, ending the thread."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:2006-2051"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {handled: {type: [string, "null"]}}}
    errors:
      - {code: handshake-error, status: 0, retryable: false}
    behavior:
      - if: "size(state.handshake_inbox) == 0"
        then:
          - title: recv_multipart blocks until a peer connects
            return: {handled: null}
      - set:
          vars.msg: "= state.handshake_inbox[0]"
          state.handshake_inbox: "= state.handshake_inbox.slice(1, size(state.handshake_inbox))"
      - if: "vars.msg.msg == 'get_meta_msg'"
        then:
          - title: Send engine metadata, then the KV-cache tensor metadata per layer
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:2039-2045"
            set: {state.replies: "= state.replies + ['engine-meta', 'layer-meta']"}
          - return: {handled: get_meta_msg}
      - if: "vars.msg.msg == 'pop_done_recv'"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:2046-2051"
            set: {state.done_recv: "= state.done_recv + [vars.msg.req_id]"}
          - return: {handled: pop_done_recv}
      - title: Unexpected message type
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:2034-2038"
        fail: {code: handshake-error, status: 0, message: "handshake failed, unexpected msg type"}

  - component: moriio-wrapper
    name: async-wait-reqid
    kind: function
    summary: "One message of the moriio-notify-listener thread (_async_wait): decode it as a structured msgpack dict (remote_blocks / write_done / release) or as a completion string; any processing error is re-raised as HandshakeError and ends the thread."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:745-762", "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:764-809"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {handled: {type: [string, "null"]}}}
    errors:
      - {code: handshake-error, status: 0, retryable: false}
    behavior:
      - if: "size(state.notify_inbox) == 0"
        then:
          - return: {handled: null}
      - set:
          vars.m: "= state.notify_inbox[0]"
          state.notify_inbox: "= state.notify_inbox.slice(1, size(state.notify_inbox))"
      - call: moriio-wrapper.handle-message
        input: "= vars.m"
        on_error:
          - title: Errors become HandshakeError and stop the listener
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:755-757"
            fail: {code: handshake-error, status: 0, message: "= 'Error processing message: ' + error.message"}
        as: h
      - return: {handled: "= vars.h.value.handled"}

  - component: moriio-wrapper
    name: handle-message
    kind: function
    summary: "MoRIIOWrapper._handle_message: remote_blocks (prefill learns the decoder's allocated blocks), write_done (decode learns a write finished), release (prefill frees after the decoder's ack), or a plain-string completion."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:764-862"]
    request: DistMoriioMessage
    response: {type: object, properties: {handled: {type: string}}}
    errors:
      - {code: moriio-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "input.kind == 'binary'"
        then:
          - title: Neither msgpack nor UTF-8
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:791-794"
            fail: {code: moriio-error, status: 0, message: "= 'Unhandled message format: ' + (has(input.text) ? input.text : '')"}
      - if: "input.kind == 'string'"
        then:
          - title: Completion string
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:855-862"
            if: "state.role == 'PRODUCER'"
            then:
              - set:
                  state.done_req_ids: "= state.done_req_ids + [input.text]"
                  state.done_remote_allocate: "= omit(state.done_remote_allocate, input.text)"
                  state.terminal: "= state.terminal + [input.text]"
            else:
              - set: {state.done_write_cache_req_ids: "= state.done_write_cache_req_ids + [input.text]"}
          - return: {handled: completion}
      - set:
          vars.type: "= has(input.type) && input.type != null ? input.type : (has(input.transfer_id) ? 'remote_blocks' : 'none')"
      - if: "vars.type == 'remote_blocks'"
        then:
          - if: "state.role != 'PRODUCER'"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:812"
                fail: {code: assertion-error, status: 0, message: "Only prefill can get block messages"}
          - if: "!has(input.block_notify_list) || size(input.block_notify_list) == 0"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:816-819"
                fail: {code: moriio-error, status: 0, message: "block_notify_list cannot be empty in remote allocate message"}
          - if: "input.transfer_id in state.terminal"
            then:
              - title: Ignore a late allocation for a finished transfer
                source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:822-827"
                return: {handled: ignored}
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:828-830"
            set: {state.done_remote_allocate: "= merge(state.done_remote_allocate, {input.transfer_id: {'block_ids': input.block_notify_list}})"}
          - return: {handled: remote_blocks}
      - if: "vars.type == 'write_done'"
        then:
          - if: "state.role == 'PRODUCER'"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:833-835"
                fail: {code: assertion-error, status: 0, message: "Only decode can get WRITE completion messages"}
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:836-838"
            set: {state.done_write_cache_req_ids: "= state.done_write_cache_req_ids + [input.transfer_id]"}
          - return: {handled: write_done}
      - if: "vars.type == 'release'"
        then:
          - if: "has(input.consumer_tp_size) && input.consumer_tp_size <= 0"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:845-848"
                fail: {code: moriio-error, status: 0, message: "= 'Invalid consumer_tp_size in release message: ' + string(input.consumer_tp_size)"}
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:849-852"
            set:
              state.done_req_ids: "= state.done_req_ids + [input.transfer_id]"
              state.done_remote_allocate: "= omit(state.done_remote_allocate, input.transfer_id)"
              state.terminal: "= state.terminal + [input.transfer_id]"
          - return: {handled: release}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:808-809"
        fail: {code: moriio-error, status: 0, message: "= 'Unhandled structured message type: ' + vars.type"}

  - component: moriio-wrapper
    name: pop-finished-req-ids
    kind: function
    summary: "MoRIIOWrapper.pop_finished_req_ids: hand the acknowledged transfers to the connector (which frees their blocks) and clear the list."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:742-744"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {done: {type: array, items: {type: string}}}}
    behavior:
      - set: {vars.done: "= state.done_req_ids"}
      - set: {state.done_req_ids: []}
      - return: {done: "= vars.done"}

  - component: moriio-writer
    name: write-worker-loop
    kind: function
    summary: "One iteration of MoRIIOWriter._write_worker_loop: retry deferred tasks (expire after defer_timeout), then take one queued task; skip terminal transfers, defer those whose remote blocks are not allocated yet, execute the rest (a failed write still marks the request done)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:184-249"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {written: {type: integer}, deferred: {type: integer}, expired: {type: integer}}}
    behavior:
      - set: {vars.written: 0, vars.expired: 0, vars.keep: []}
      - title: _process_deferred_tasks
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:216-249"
        foreach: "= state.deferred"
        as: t
        steps:
          - call: moriio-wrapper.transfer-status
            input: {transfer_id: "= vars.t.transfer_id"}
            as: st
          - if: "vars.st.value.terminal"
            then:
              - continue: true
          - if: "now - vars.t.enqueued_at > state.defer_timeout_ms"
            then:
              - title: Remote blocks never arrived; mark done so the blocks are freed
                source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:228-236"
                call: moriio-wrapper.mark-request-done
                input: {transfer_id: "= vars.t.transfer_id"}
              - set: {vars.expired: "= vars.expired + 1"}
              - continue: true
          - if: "vars.st.value.remote_ready"
            then:
              - call: moriio-writer.execute-write-task
                input: "= vars.t"
              - set: {vars.written: "= vars.written + 1"}
            else:
              - set: {vars.keep: "= vars.keep + [vars.t]"}
      - set: {state.deferred: "= vars.keep"}
      - if: "size(state.write_tasks) == 0"
        then:
          - title: "_write_task_q.get(timeout=0.01) is empty"
            return: {written: "= vars.written", deferred: "= size(state.deferred)", expired: "= vars.expired"}
      - set:
          vars.task: "= state.write_tasks[0]"
          state.write_tasks: "= state.write_tasks.slice(1, size(state.write_tasks))"
      - call: moriio-wrapper.transfer-status
        input: {transfer_id: "= vars.task.transfer_id"}
        as: s
      - if: "vars.s.value.terminal"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:195-196"
            return: {written: "= vars.written", deferred: "= size(state.deferred)", expired: "= vars.expired"}
      - if: "!vars.s.value.remote_ready"
        then:
          - title: Remote blocks not allocated yet; defer
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:198-206"
            set: {state.deferred: "= state.deferred + [vars.task]"}
          - return: {written: "= vars.written", deferred: "= size(state.deferred)", expired: "= vars.expired"}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:208-215"
        call: moriio-writer.execute-write-task
        input: "= vars.task"
        on_error:
          - title: A failed write still marks the request done
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:210-215"
            call: moriio-wrapper.mark-request-done
            input: {transfer_id: "= vars.task.transfer_id"}
          - return: {written: "= vars.written", deferred: "= size(state.deferred)", expired: "= vars.expired"}
      - return: {written: "= vars.written + 1", deferred: "= size(state.deferred)", expired: "= vars.expired"}

  - component: moriio-writer
    name: execute-write-task
    kind: function
    summary: "MoRIIOWriter._execute_write_task: RDMA-write this layer's blocks into the decoder's allocated blocks (latency from the block count)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:306-330"]
    request: {type: object, properties: {transfer_id: {type: string}, request_id: {type: string}, num_blocks: {type: integer}, enqueued_at: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    latency_ms: "= (double(has(input.num_blocks) ? input.num_blocks : 1) * 2097152.0 / (double(config['dist-nixl-rdma-gbps']) * 1000000.0))"
    behavior:
      - set: {state.written: "= state.written + [input.transfer_id]"}
      - return: {ok: true}

  - component: moriio-wrapper
    name: transfer-status
    kind: function
    summary: "_is_transfer_terminal and _is_remote_ready under the wrapper lock."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:256-284"]
    request: {type: object, required: [transfer_id], properties: {transfer_id: {type: string}}}
    response: {type: object, properties: {terminal: {type: boolean}, remote_ready: {type: boolean}}}
    behavior:
      - return: {terminal: "= input.transfer_id in state.terminal", remote_ready: "= input.transfer_id in state.done_remote_allocate"}

  - component: moriio-wrapper
    name: mark-request-done
    kind: function
    summary: "MoRIIOWriter._mark_request_done: ack the transfer (blocks are freed even on failure), drop its allocation and mark it terminal."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_engine.py:263-270"]
    request: {type: object, required: [transfer_id], properties: {transfer_id: {type: string}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    behavior:
      - set:
          state.done_req_ids: "= state.done_req_ids + [input.transfer_id]"
          state.done_remote_allocate: "= omit(state.done_remote_allocate, input.transfer_id)"
          state.terminal: "= state.terminal + [input.transfer_id]"
      - return: {ok: true}

  - component: moriio-heartbeat
    name: main
    kind: cli
    summary: "One interval of the heartbeat child's loop: stop on stdin EOF; send the payload; zmq.Again resets the failure count; other ZMQ errors count, and max_retries consecutive failures re-raise and end the child."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_heartbeat.py:65-92", "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_heartbeat.py:95-96"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {sent: {type: boolean}, stopped: {type: boolean}}}
    errors:
      - {code: zmq-error, status: 0, retryable: false}
    behavior:
      - if: "state.stdin_closed"
        then:
          - title: EOF on stdin stops the child
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_heartbeat.py:78"
            return: {sent: false, stopped: true}
      - choice: send
        default: ok
        options:
          ok:
            - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_heartbeat.py:80-81"
              set: {state.failures: 0, state.sent: "= state.sent + 1"}
            - return: {sent: true, stopped: false}
          again:
            - title: Send timed out (SNDTIMEO); warn and retry next interval
              source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_heartbeat.py:82-84"
              set: {state.failures: 0}
            - return: {sent: false, stopped: false}
          zmq_error:
            - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_heartbeat.py:85-89"
              set: {state.failures: "= state.failures + 1"}
            - if: "state.failures >= state.max_retries"
              then:
                - fail: {code: zmq-error, status: 0, message: "MoRIIO discovery heartbeat send failed"}
            - return: {sent: false, stopped: false}

  # ---------------------------------------------------------------- Mooncake P2P
  - component: mooncake-connector-worker
    name: mooncake-sender-listener
    kind: function
    summary: "One receive of the prefill side's asyncio listener (ROUTER socket): queue the decoder's transfer request for the sender tasks."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1439-1474"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {queued: {type: integer}}}
    behavior:
      - if: "size(state.listener_inbox) == 0"
        then:
          - return: {queued: "= size(state.sender_queue)"}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1462-1464"
        set:
          state.sender_queue: "= state.sender_queue + [state.listener_inbox[0]]"
          state.listener_inbox: "= state.listener_inbox.slice(1, size(state.listener_inbox))"
      - return: {queued: "= size(state.sender_queue)"}

  - component: mooncake-connector-worker
    name: sender-worker
    kind: function
    summary: "One item of a sender task: decode the transfer metadata and send_kv_to_decode; an unpaired TP rank, a not-ready request after VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT, or an exception answers the decoder with an ERROR response."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1477-1496", "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1498-1600"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {status: {type: [string, "null"]}}}
    behavior:
      - if: "size(state.sender_queue) == 0"
        then:
          - return: {status: null}
      - set:
          vars.meta: "= state.sender_queue[0]"
          state.sender_queue: "= state.sender_queue.slice(1, size(state.sender_queue))"
      - if: "has(vars.meta.remote_tp_rank) && vars.meta.remote_tp_rank != state.tp_rank"
        then:
          - title: This decode TP rank is not paired with this prefill TP rank
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1502-1515"
            set: {state.error_responses: "= state.error_responses + [vars.meta.transfer_id]"}
          - return: {status: ERROR}
      - if: "!(vars.meta.transfer_id in state.reqs_need_send) || !state.reqs_need_send[vars.meta.transfer_id].ready"
        then:
          - title: P side never became ready before the abort timeout
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1583-1599"
            set: {state.error_responses: "= state.error_responses + [vars.meta.transfer_id]"}
          - return: {status: ERROR}
      - title: RDMA-write the ready blocks to the decoder, then FINISH
        call: mooncake-transfer-engine.batch-transfer-sync-write
        input: {num_blocks: "= size(state.reqs_need_send[vars.meta.transfer_id].block_ids)"}
        as: xfer
        on_error:
          - title: Transfer exception becomes an ERROR response
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1484-1492"
            set: {state.error_responses: "= state.error_responses + [vars.meta.transfer_id]"}
          - return: {status: ERROR}
      - set:
          state.sent: "= state.sent + [vars.meta.transfer_id]"
          state.reqs_need_send: "= omit(state.reqs_need_send, vars.meta.transfer_id)"
      - return: {status: FINISH}

  - component: mooncake-connector-worker
    name: receive-kv-from-single-worker
    kind: function
    summary: "Decode side: send MooncakeXferMetadata to one prefill worker and read responses until FINISH; an ERROR response or an exception marks every pulled request failed and its local blocks invalid (the scheduler then recomputes or fails them)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2308-2373", "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2375-2405"]
    request:
      type: object
      required: [pull_metas]
      properties:
        worker_addr: {type: string, default: "tcp://10.0.0.1:6000"}
        pull_metas: {type: array, items: {type: object, properties: {req_id: {type: string}, local_block_ids: {type: array, items: {type: integer}}}}}
    response: {type: object, properties: {status: {type: string}, failed: {type: array, items: {type: string}}}}
    latency_ms: 2
    behavior:
      - choice: response
        default: finish
        options:
          finish:
            - title: Responses until FINISH; each processed as pulling results
              source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2354-2366"
              set: {state.finished_recving: "= state.finished_recving + input.pull_metas.map(m, m.req_id)"}
            - return: {status: FINISH, failed: []}
          error:
            - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2357-2363"
              set: {vars.reason: transfer error}
          exception:
            - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2367-2373"
              set: {vars.reason: transfer failed}
      - title: _handle_failed_recv
        detail: "A pull with no local blocks only released P's blocks; nothing waits on it, so it is not reported."
        source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2375-2405"
        set:
          vars.failed: "= input.pull_metas.filter(m, size(m.local_block_ids) > 0)"
      - set:
          state.invalid_block_ids: "= state.invalid_block_ids + vars.failed.map(m, m.local_block_ids).flatten()"
          state.finished_recving: "= state.finished_recving + vars.failed.map(m, m.req_id)"
          state.failed_recv: "= state.failed_recv + size(input.pull_metas)"
      - return: {status: ERROR, failed: "= vars.failed.map(m, m.req_id)"}

  - component: mooncake-connector-worker
    name: get-block-ids-with-load-errors
    kind: function
    summary: "Drain the local block ids whose remote load failed since the last call (the model runner reports them to the scheduler)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2407-2416"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {block_ids: {type: array, items: {type: integer}}}}
    behavior:
      - set: {vars.out: "= state.invalid_block_ids"}
      - set: {state.invalid_block_ids: []}
      - return: {block_ids: "= vars.out"}

  - component: mooncake-transfer-engine
    name: batch-transfer-sync-write
    kind: kernel
    summary: "RDMA write of the request's blocks (2 MiB per block across layers, assumed) at the configured RDMA bandwidth."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1600-1640"]
    request: {type: object, properties: {num_blocks: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    latency_ms: "= (double(input.num_blocks) * 2097152.0 / (double(config['dist-nixl-rdma-gbps']) * 1000000.0))"

  # ---------------------------------------------------------------- Mooncake store
  - component: mooncake-store-worker
    name: kv-transfer-thread-run
    kind: function
    summary: "One item of KVTransferThread.run (the KVCacheStoreSendingThread subclass here): a None request is logged and skipped; otherwise the request's block keys are put into the store; errors are logged and the thread continues."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:349-360", "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:397-410"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {handled: {type: [string, "null"]}}}
    behavior:
      - if: "size(state.request_queue) == 0"
        then:
          - title: request_queue.get() blocks
            return: {handled: null}
      - set:
          vars.r: "= state.request_queue[0]"
          state.request_queue: "= state.request_queue.slice(1, size(state.request_queue))"
      - if: "vars.r == null"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:353-356"
            return: {handled: none-request}
      - title: Put the request's blocks into the Mooncake store
        source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:357"
        set:
          state.store_keys: "= state.store_keys + vars.r.block_hashes.filter(h, !(h in state.store_keys))"
          state.finished: "= state.finished + [vars.r.req_id]"
      - return: {handled: "= vars.r.req_id"}

  - component: mooncake-store-worker
    name: lookup-key-server-process-request
    kind: function
    summary: "One request of the LookupKeyServer REP loop: LOOKUP returns how many prefix tokens are in the store; RESET drains in-flight puts and wipes the store; anything else gets RESP_ERR."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:2332-2364"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {reply: {type: [string, "null"]}, num_tokens: {type: integer}}}
    behavior:
      - if: "size(state.lookup_inbox) == 0"
        then:
          - return: {reply: null, num_tokens: 0}
      - set:
          vars.m: "= state.lookup_inbox[0]"
          state.lookup_inbox: "= state.lookup_inbox.slice(1, size(state.lookup_inbox))"
      - if: "vars.m.type == 'LOOKUP'"
        then:
          - title: Count the stored prefix; a full hit stops one block short so the last token is recomputed
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:2095-2110"
            set:
              vars.hits: "= vars.m.block_hashes.exists(h, !(h in state.store_keys)) ? lists.range(size(vars.m.block_hashes)).filter(i, !(vars.m.block_hashes[i] in state.store_keys))[0] : size(vars.m.block_hashes)"
          - set:
              vars.tokens: "= vars.hits * state.block_size >= vars.m.num_tokens ? (vars.m.num_tokens - 1) / state.block_size * state.block_size : vars.hits * state.block_size"
          - set: {state.replies: "= state.replies + ['lookup']"}
          - return: {reply: lookup, num_tokens: "= vars.tokens"}
      - if: "vars.m.type == 'RESET'"
        then:
          - title: Drain the send queue, then store.remove_all(force=True)
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:2347-2358"
            set: {state.store_keys: [], state.request_queue: [], state.replies: "= state.replies + ['ok']"}
          - return: {reply: ok, num_tokens: 0}
      - title: Unknown message type
        source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:2360-2364"
        set: {state.replies: "= state.replies + ['err']"}
      - return: {reply: err, num_tokens: 0}

  # ---------------------------------------------------------------- HF3FS
  - component: hf3fs-async-operation-manager
    name: save-worker
    kind: function
    summary: "One poll of the HF3FS save thread: take a save task (1 s timeout), allocate a page per block hash from the metadata server, gather the blocks into buffers (Triton), batch-write the pages, then confirm the keys (or release the pages on a failed write)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:241-251", "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:265-349"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {task: {type: [string, "null"]}, ok: {type: boolean}, reason: {type: string}}}
    behavior:
      - if: "state.stop"
        then:
          - return: {task: null, ok: false, reason: stopped}
      - if: "size(state.save_queue) == 0"
        then:
          - title: "queue.Empty after the 1 s timeout: poll again"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:248-249"
            return: {task: null, ok: false, reason: empty}
      - set:
          vars.t: "= state.save_queue[0]"
          state.save_queue: "= state.save_queue.slice(1, size(state.save_queue))"
      - call: hf3fs-metadata-server.allocate-pages-for-keys
        input: {rank: "= state.rank", keys: "= vars.t.block_hashes"}
        as: alloc
      - if: "vars.alloc.value.pages.exists(p, p < 0)"
        then:
          - title: Page allocation failed
            source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:279-283"
            set: {state.failed: "= state.failed + [vars.t.request_id]"}
          - return: {task: "= vars.t.request_id", ok: false, reason: "Page allocation failed"}
      - title: Gather KV blocks into contiguous buffers on the save stream
        source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:297-305"
        call: hf3fs-gather-scatter-helper.gather-kv-caches
        input: {num_blocks: "= size(vars.t.block_hashes)"}
      - if: "state.write_ok"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:325-334"
            call: hf3fs-metadata-server.confirm-write-for-keys
            input: {rank: "= state.rank", confirmations: "= lists.range(size(vars.t.block_hashes)).map(i, {'key': vars.t.block_hashes[i], 'page': vars.alloc.value.pages[i]})", release: []}
          - set: {state.completed: "= state.completed + [vars.t.request_id]"}
          - return: {task: "= vars.t.request_id", ok: true, reason: ""}
      - title: Write failed; release the pages
        source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:335-343"
        call: hf3fs-metadata-server.confirm-write-for-keys
        input: {rank: "= state.rank", confirmations: [], release: "= vars.alloc.value.pages"}
      - set: {state.failed: "= state.failed + [vars.t.request_id]"}
      - return: {task: "= vars.t.request_id", ok: false, reason: "Write operation failed"}

  - component: hf3fs-async-operation-manager
    name: load-worker
    kind: function
    summary: "One poll of the HF3FS load thread: take a load task, look up each block hash's page on this rank, fail if any is missing, read the pages and scatter them into the KV cache (Triton)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:253-263", "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:351-419"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {task: {type: [string, "null"]}, ok: {type: boolean}, reason: {type: string}}}
    behavior:
      - if: "state.stop"
        then:
          - return: {task: null, ok: false, reason: stopped}
      - if: "size(state.load_queue) == 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:260-261"
            return: {task: null, ok: false, reason: empty}
      - set:
          vars.t: "= state.load_queue[0]"
          state.load_queue: "= state.load_queue.slice(1, size(state.load_queue))"
      - call: hf3fs-metadata-server.get-key-locations
        input: {rank: "= state.rank", keys: "= vars.t.block_hashes"}
        as: loc
      - if: "vars.loc.value.locations.exists(p, p == null)"
        then:
          - title: Blocks not found (or not yet written by every rank)
            source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:362-363"
            set: {state.failed: "= state.failed + [vars.t.request_id]"}
          - return: {task: "= vars.t.request_id", ok: false, reason: "Blocks not found"}
      - title: Read the pages, then scatter into the paged KV cache on the load stream
        source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:400-408"
        call: hf3fs-gather-scatter-helper.scatter-kv-caches
        input: {num_blocks: "= size(vars.t.block_hashes)"}
      - set: {state.completed: "= state.completed + [vars.t.request_id]"}
      - return: {task: "= vars.t.request_id", ok: true, reason: ""}

  - component: hf3fs-gather-scatter-helper
    name: gather-kv-caches
    kind: kernel
    summary: "gather_kv_caches launches kv_cache_gather_kernel[grid] to copy blocks from the paged KV cache into page buffers."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/utils/gather_scatter_helper.py:167-224", "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/utils/gather_scatter_helper.py:60-107"]
    request: {type: object, properties: {num_blocks: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    latency_ms: "= 0.01 + double(input.num_blocks) * 0.0014"

  - component: hf3fs-gather-scatter-helper
    name: scatter-kv-caches
    kind: kernel
    summary: "scatter_kv_caches launches kv_cache_scatter_kernel[grid] to copy page buffers back into the paged KV cache."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/utils/gather_scatter_helper.py:110-165", "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/utils/gather_scatter_helper.py:10-57"]
    request: {type: object, properties: {num_blocks: {type: integer}}}
    response: {type: object, properties: {ok: {type: boolean}}}
    latency_ms: "= 0.01 + double(input.num_blocks) * 0.0014"

  - component: hf3fs-metadata-server
    name: main
    kind: cli
    summary: "python hf3fs_metadata_server.py [--host 0.0.0.0] [--port 18000]: build Hf3fsMetadataServer (empty global state) and serve it with uvicorn."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:522-532", "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:512-519"]
    request: {type: object, properties: {host: {type: string, default: "0.0.0.0"}, port: {type: integer, default: 18000}}}
    response: {type: object, properties: {serving: {type: boolean}, port: {type: integer}}}
    behavior:
      - if: "state.serving && state.port == input.port"
        then:
          - title: Another server already owns the port; uvicorn fails to bind
            fail: {code: os-error, status: 0, message: "address already in use"}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:247-253"
        set: {state.serving: true, state.port: "= input.port", state.ranks: {}, state.keys: {}}
      - return: {serving: true, port: "= input.port"}

  - component: hf3fs-metadata-server
    name: initialize-rank
    kind: http
    summary: "POST /rank/{rank}/initialize: create the rank's page pool once."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:100-107"]
    request: {type: object, required: [rank, num_pages], properties: {rank: {type: integer}, num_pages: {type: integer}}}
    response: {type: object, properties: {initialized: {type: boolean}}}
    behavior:
      - if: "string(input.rank) in state.ranks"
        then:
          - return: {initialized: false}
      - set: {state.ranks: "= merge(state.ranks, {string(input.rank): {'num_pages': input.num_pages, 'free_pages': lists.range(input.num_pages)}})"}
      - return: {initialized: true}

  - component: hf3fs-metadata-server
    name: allocate-pages-for-keys
    kind: http
    summary: "GlobalMetadataState.allocate_pages_for_keys: allocate one page per key on the rank (all or nothing from the free list); keys already fully written reuse their page and release the fresh one; missing pages are -1."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:109-155", "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:40-47"]
    request: {type: object, required: [rank, keys], properties: {rank: {type: integer}, keys: {type: array, items: {type: string}}}}
    response: {type: object, properties: {pages: {type: array, items: {type: integer}}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.r: "= string(input.rank)"}
      - if: "!(vars.r in state.ranks)"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:122-123"
            fail: {code: value-error, status: 0, message: "= 'Rank ' + vars.r + ' not initialized'"}
      - set:
          vars.free: "= state.ranks[vars.r].free_pages"
          vars.n: "= size(input.keys)"
      - set:
          vars.got: "= size(vars.free) < vars.n ? [] : vars.free.slice(0, vars.n)"
      - title: Reuse complete keys; others take their allocated page or -1
        source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:136-155"
        set:
          vars.pages: "= lists.range(vars.n).map(i, input.keys[i] in state.keys && vars.r in state.keys[input.keys[i]].pages ? state.keys[input.keys[i]].pages[vars.r] : (i < size(vars.got) ? vars.got[i] : -1))"
          vars.released: "= lists.range(size(vars.got)).filter(i, input.keys[i] in state.keys && vars.r in state.keys[input.keys[i]].pages).map(i, vars.got[i])"
      - set:
          state.ranks: "= merge(state.ranks, {vars.r: {'num_pages': state.ranks[vars.r].num_pages, 'free_pages': (size(vars.free) < vars.n ? vars.free : vars.free.slice(vars.n, size(vars.free))) + vars.released}})"
      - return: {pages: "= vars.pages"}

  - component: hf3fs-metadata-server
    name: confirm-write-for-keys
    kind: http
    summary: "GlobalMetadataState.confirm_write_for_keys: record (key, page) for this rank (a key is complete once every initialized rank confirmed) and release pages of failed writes."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:157-190"]
    request: {type: object, required: [rank], properties: {rank: {type: integer}, confirmations: {type: array, items: {type: object, properties: {key: {type: string}, page: {type: integer}}}}, release: {type: array, items: {type: integer}}}}
    response: {type: object, properties: {confirmed: {type: integer}}}
    behavior:
      - set: {vars.r: "= string(input.rank)"}
      - set:
          state.keys: "= merge(state.keys, input.confirmations.transformMapEntry(i, c, {c.key: {'tp': size(state.ranks), 'pages': merge(c.key in state.keys ? state.keys[c.key].pages : {}, {vars.r: c.page})}}))"
      - if: "size(input.release) > 0"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:183-190"
            set:
              state.ranks: "= merge(state.ranks, {vars.r: {'num_pages': state.ranks[vars.r].num_pages, 'free_pages': state.ranks[vars.r].free_pages + input.release.filter(p, !(p in state.ranks[vars.r].free_pages))}})"
      - return: {confirmed: "= size(input.confirmations)"}

  - component: hf3fs-metadata-server
    name: batch-key-exists
    kind: http
    summary: "POST /keys/batch_exists: for each key, whether every TP rank has confirmed its write (KeyMetadata.is_complete)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:346-360", "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:192-211"]
    attributes: {method: POST, path: /keys/batch_exists}
    request: {type: object, required: [keys], properties: {keys: {type: array, items: {type: string}}}}
    response: {type: object, properties: {exists: {type: array, items: {type: boolean}}}}
    behavior:
      - set: {vars.out: []}
      - foreach: "= input.keys"
        as: k
        steps:
          - call: hf3fs-metadata-server.key-metadata-get
            input: {key: "= vars.k"}
            as: km
            on_error: continue
          - title: Complete when every initialized rank has a confirmed page
            source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:80-83"
            set: {vars.out: "= vars.out + [vars.km.ok && size(vars.km.value.pages) >= vars.km.value.tp]"}
      - return: {exists: "= vars.out"}

  - component: hf3fs-metadata-server
    name: key-metadata-get
    kind: io
    summary: "key_metadata.get(key): the ranks' confirmed pages for one key."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:204-209"]
    request: {type: object, required: [key], properties: {key: {type: string}}}
    errors:
      - {code: not_found, status: 404, retryable: false}
    store: {table: keys, op: get, key: "= input.key"}

  - component: hf3fs-metadata-server
    name: get-key-locations
    kind: http
    summary: "GlobalMetadataState.get_key_locations: this rank's page per key, or None when the key is unknown or not yet written by every rank."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:213-242"]
    request: {type: object, required: [rank, keys], properties: {rank: {type: integer}, keys: {type: array, items: {type: string}}}}
    response: {type: object, properties: {locations: {type: array}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.r: "= string(input.rank)"}
      - if: "!(vars.r in state.ranks)"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_metadata_server.py:226-227"
            fail: {code: value-error, status: 0, message: "= 'Rank ' + vars.r + ' not initialized'"}
      - return:
          locations: "= input.keys.map(k, k in state.keys && size(state.keys[k].pages) >= state.keys[k].tp && vars.r in state.keys[k].pages ? state.keys[k].pages[vars.r] : null)"

  # ---------------------------------------------------------------- KV cache events
  - component: event-publisher-factory
    name: create
    kind: function
    summary: "EventPublisherFactory.create: NullEventPublisher without a config, with events disabled, or with publisher 'null'. An unset publisher was resolved by KVEventsConfig.__post_init__ (zmq when events are enabled, else null). Unknown names raise ValueError; 'zmq' starts a ZmqEventPublisher (and its thread) whose PUB and replay ports are offset by the DP rank."
    sources: ["vllm/distributed/kv_events.py:578-598", "vllm/config/kv_events.py:50-52"]
    request: {type: object, properties: {has_config: {type: boolean, default: true}, data_parallel_rank: {type: integer, default: 0}}}
    response: {type: object, properties: {publisher: {type: string}, endpoint: {type: [string, "null"]}, replay_endpoint: {type: [string, "null"]}, hwm: {type: integer}, topic: {type: string}, max_queue_size: {type: integer}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - title: "KVEventsConfig.__post_init__: an unset publisher is zmq when events are enabled, else null"
        source: "vllm/config/kv_events.py:50-52"
        set:
          vars.kind: "= ('kv-events-publisher' in config && config['kv-events-publisher'] != null) ? config['kv-events-publisher'] : (config['enable-kv-cache-events'] ? 'zmq' : 'null')"
      - if: "(has(input.has_config) && !input.has_config) || !config['enable-kv-cache-events'] || vars.kind == 'null'"
        then:
          - source: "vllm/distributed/kv_events.py:583-588"
            return: {publisher: "null"}
      - if: "vars.kind != 'zmq'"
        then:
          - source: "vllm/distributed/kv_events.py:592-597"
            fail: {code: value-error, status: 0, message: "= 'Unknown event publisher \\'' + vars.kind + '\\''"}
      - title: ZmqEventPublisher binds PUB (and replay ROUTER) and starts its thread
        source: "vllm/distributed/kv_events.py:345-384"
        call: zmq-event-publisher.start
        input:
          data_parallel_rank: "= has(input.data_parallel_rank) ? input.data_parallel_rank : 0"
          endpoint: "= config['kv-events-endpoint']"
          replay_endpoint: "= 'kv-events-replay-endpoint' in config ? config['kv-events-replay-endpoint'] : null"
        as: z
      - return: {publisher: zmq, endpoint: "= vars.z.value.endpoint", replay_endpoint: "= vars.z.value.replay_endpoint", hwm: "= config['kv-events-hwm']", topic: "= config['kv-events-topic']", max_queue_size: "= config['kv-events-max-queue-size']"}

  - component: zmq-event-publisher
    name: offset-endpoint-port
    kind: function
    latency_ms: 0
    summary: "ZmqEventPublisher.offset_endpoint_port: unchanged when empty or at DP rank 0; inproc gets a _dp<rank> suffix; tcp gets its port + rank (port 0 is left for the OS); anything else raises ValueError."
    sources: ["vllm/distributed/kv_events.py:530-563"]
    request: {type: object, required: [data_parallel_rank], properties: {endpoint: {type: [string, "null"], examples: ["tcp://*:5557"]}, data_parallel_rank: {type: integer, examples: [1]}}}
    response: {type: object, properties: {endpoint: {type: [string, "null"]}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.e: "= has(input.endpoint) ? input.endpoint : null"}
      - if: "vars.e == null || vars.e == '' || input.data_parallel_rank == 0"
        then:
          - source: "vllm/distributed/kv_events.py:547-548"
            return: {endpoint: "= vars.e"}
      - if: "vars.e.contains('inproc')"
        then:
          - source: "vllm/distributed/kv_events.py:550-551"
            return: {endpoint: "= vars.e + '_dp' + string(input.data_parallel_rank)"}
      - if: "!vars.e.contains('tcp')"
        then:
          - source: "vllm/distributed/kv_events.py:563"
            fail: {code: value-error, status: 0, message: "Invalid endpoint: must contain 'inproc' or 'tcp'"}
      - if: "!vars.e.contains(':')"
        then:
          - return: {endpoint: "= vars.e"}
      - set:
          vars.i: "= vars.e.lastIndexOf(':')"
      - set:
          vars.port: "= int(vars.e.substring(vars.i + 1))"
      - if: "vars.port == 0"
        then:
          - title: A tcp port of 0 is left for the OS
            source: "vllm/distributed/kv_events.py:558-559"
            return: {endpoint: "= vars.e"}
      - source: "vllm/distributed/kv_events.py:560-561"
        return: {endpoint: "= vars.e.substring(0, vars.i) + ':' + string(vars.port + input.data_parallel_rank)"}

  - component: zmq-event-publisher
    name: start
    kind: function
    summary: "ZmqEventPublisher.__init__: offset the PUB and replay endpoints by the DP rank, mark running and start the zmq-publisher thread."
    sources: ["vllm/distributed/kv_events.py:345-384"]
    request: {type: object, properties: {data_parallel_rank: {type: integer}, endpoint: {type: [string, "null"]}, replay_endpoint: {type: [string, "null"]}}}
    response: {type: object, properties: {running: {type: boolean}, endpoint: {type: [string, "null"]}, replay_endpoint: {type: [string, "null"]}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - set: {vars.rank: "= has(input.data_parallel_rank) ? input.data_parallel_rank : 0"}
      - source: "vllm/distributed/kv_events.py:355-358"
        call: zmq-event-publisher.offset-endpoint-port
        input: {endpoint: "= has(input.endpoint) ? input.endpoint : 'tcp://*:5557'", data_parallel_rank: "= vars.rank"}
        as: e
      - call: zmq-event-publisher.offset-endpoint-port
        input: {endpoint: "= has(input.replay_endpoint) ? input.replay_endpoint : null", data_parallel_rank: "= vars.rank"}
        as: r
      - title: Starting ZMQ publisher thread
        source: "vllm/distributed/kv_events.py:376-384"
        set: {state.running: true, state.dp_rank: "= vars.rank"}
      - return: {running: true, endpoint: "= vars.e.value.endpoint", replay_endpoint: "= vars.r.value.endpoint"}

  - component: zmq-event-publisher
    name: publish
    kind: function
    summary: "ZmqEventPublisher.publish: refuse once closed; stamp the DP rank if missing and enqueue the batch for the publisher thread."
    sources: ["vllm/distributed/kv_events.py:389-394"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request:
      type: object
      properties:
        ts: {type: number}
        events: {type: array, items: {type: object, properties: {type: {type: string, enum: [BlockStored, BlockRemoved, AllBlocksCleared]}, block_hashes: {type: array, items: {type: string}}}}}
        data_parallel_rank: {type: [integer, "null"], default: null}
    response: {type: object, properties: {queued: {type: integer}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - if: "!state.running"
        then:
          - source: "vllm/distributed/kv_events.py:390-391"
            fail: {code: runtime-error, status: 0, message: "Publisher is closed"}
      - set:
          state.queue: "= state.queue + [{'events': has(input.events) ? input.events : [], 'dp_rank': has(input.data_parallel_rank) && input.data_parallel_rank != null ? input.data_parallel_rank : state.dp_rank}]"
      - return: {queued: "= size(state.queue)"}

  - component: zmq-event-publisher
    name: publisher-thread
    kind: function
    summary: "One iteration of _publisher_thread: service a pending replay request first, then take one batch (0.1 s timeout); a None sentinel exits; otherwise number it, send (topic, seq, payload) on PUB and keep it in the replay buffer (last buffer_steps)."
    sources: ["vllm/distributed/kv_events.py:472-507"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {published: {type: [integer, "null"]}, exited: {type: boolean}}}
    behavior:
      - if: "!state.running && size(state.queue) == 0"
        then:
          - source: "vllm/distributed/kv_events.py:478"
            return: {published: null, exited: true}
      - if: "size(state.replay_inbox) > 0"
        then:
          - title: Replay requests are serviced before the main queue
            source: "vllm/distributed/kv_events.py:479-484"
            call: zmq-event-publisher.service-replay
      - if: "size(state.queue) == 0"
        then:
          - source: "vllm/distributed/kv_events.py:487-492"
            return: {published: null, exited: false}
      - set:
          vars.b: "= state.queue[0]"
          state.queue: "= state.queue.slice(1, size(state.queue))"
      - if: "vars.b == null"
        then:
          - title: Shutdown sentinel
            source: "vllm/distributed/kv_events.py:489-490"
            return: {published: null, exited: true}
      - title: Publish with the next sequence number and buffer it for replay
        source: "vllm/distributed/kv_events.py:494-502"
        set:
          state.published: "= state.published + [state.next_seq]"
          state.buffer: "= (state.buffer + [{'seq': state.next_seq, 'batch': vars.b}]).slice(math.greatest(size(state.buffer) + 1 - config['kv-events-buffer-steps'], 0), size(state.buffer) + 1)"
          state.next_seq: "= state.next_seq + 1"
      - return: {published: "= state.next_seq - 1", exited: false}

  - component: zmq-event-publisher
    name: service-replay
    kind: function
    summary: "_service_replay: a well-formed request (3 frames) gets every buffered batch with seq >= start_seq, then the END_SEQ marker; a malformed one is logged and dropped."
    sources: ["vllm/distributed/kv_events.py:509-528"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {sent: {type: integer}}}
    behavior:
      - set:
          vars.req: "= state.replay_inbox[0]"
          state.replay_inbox: "= state.replay_inbox.slice(1, size(state.replay_inbox))"
      - if: "vars.req.frames != 3"
        then:
          - source: "vllm/distributed/kv_events.py:514-516"
            return: {sent: 0}
      - set:
          vars.out: "= state.buffer.filter(e, e.seq >= vars.req.start_seq).map(e, e.seq)"
      - source: "vllm/distributed/kv_events.py:520-528"
        set: {state.replay_sent: "= state.replay_sent + vars.out + [-1]"}
      - return: {sent: "= size(vars.out)"}

  - component: zmq-event-publisher
    name: shutdown
    kind: function
    summary: "ZmqEventPublisher.shutdown: stop accepting, enqueue the None sentinel, wait up to 1 s for the queue to drain, join the thread, close sockets."
    sources: ["vllm/distributed/kv_events.py:396-425"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {pending: {type: integer}}}
    behavior:
      - set: {state.running: false, state.queue: "= state.queue + [null]"}
      - return: {pending: "= size(state.queue)"}

  # ---------------------------------------------------------------- aux output store
  - component: background-block-object-store
    name: put
    kind: function
    summary: "BackgroundBlockObjectStore.put: nothing to do for an empty update; refuse once closed; enqueue for the writer thread, then surface any earlier writer failure."
    sources: ["vllm/distributed/aux_output_connector/store.py:68-82"]
    request: {type: object, properties: {objects: {type: array, items: {type: object, properties: {key: {type: string}, payload: {type: string}}}}}}
    response: {type: object, properties: {queued: {type: boolean}}}
    errors:
      - {code: runtime-error, status: 0, retryable: false}
      - {code: block-object-store-error, status: 0, retryable: false}
    behavior:
      - if: "!has(input.objects) || size(input.objects) == 0"
        then:
          - source: "vllm/distributed/aux_output_connector/store.py:77-78"
            return: {queued: false}
      - if: "state.closed"
        then:
          - source: "vllm/distributed/aux_output_connector/store.py:79-80"
            fail: {code: runtime-error, status: 0, message: "auxiliary output store is closed"}
      - set: {state.queue: "= state.queue + [input.objects]"}
      - if: "state.error != ''"
        then:
          - source: "vllm/distributed/aux_output_connector/store.py:62-66"
            fail: {code: block-object-store-error, status: 0, message: "auxiliary output publication failed"}
      - return: {queued: true}

  - component: background-block-object-store
    name: run
    kind: function
    summary: "One item of the vllm-aux-output-writer thread (_run): a None update exits; after a failure later updates are skipped; otherwise apply BlockObjectStore.put and remember the first error."
    sources: ["vllm/distributed/aux_output_connector/store.py:44-60"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {applied: {type: boolean}}}
    behavior:
      - if: "size(state.queue) == 0"
        then:
          - return: {applied: false}
      - set:
          vars.u: "= state.queue[0]"
          state.queue: "= state.queue.slice(1, size(state.queue))"
      - if: "vars.u == null"
        then:
          - source: "vllm/distributed/aux_output_connector/store.py:48-49"
            return: {applied: false}
      - if: "state.error != ''"
        then:
          - title: Sticky error; skip the update
            source: "vllm/distributed/aux_output_connector/store.py:50"
            return: {applied: false}
      - source: "vllm/distributed/aux_output_connector/store.py:51-56"
        call: block-object-store.put
        input: {objects: "= vars.u"}
        on_error:
          - source: "vllm/distributed/aux_output_connector/store.py:57-58"
            set: {state.error: "= error.code"}
          - return: {applied: false}
      - return: {applied: true}

  - component: background-block-object-store
    name: get-concatenated
    kind: function
    summary: "BackgroundBlockObjectStore.get_concatenated: wait for queued updates, surface a writer failure, then read the objects."
    sources: ["vllm/distributed/aux_output_connector/store.py:84-87"]
    request: {type: object, required: [keys], properties: {keys: {type: array, items: {type: string}}}}
    response: {type: object, properties: {payload: {type: string}}}
    errors:
      - {code: block-object-store-error, status: 0, retryable: false}
    behavior:
      - if: "state.error != ''"
        then:
          - fail: {code: block-object-store-error, status: 0, message: "auxiliary output publication failed"}
      - call: block-object-store.get-concatenated
        input: {keys: "= input.keys"}
        as: g
      - return: "= vars.g.value"

  - component: block-object-store
    name: put
    kind: function
    summary: "BlockObjectStore.put: move the new keys to the LRU tail, evict the oldest unreferenced keys to fit num_slots, and fail closed (dropping the new keys) when not enough can be evicted."
    sources: ["vllm/distributed/aux_output_connector/store.py:152-187", "vllm/distributed/aux_output_connector/store.py:125-143"]
    request: {type: object, properties: {objects: {type: array, items: {type: object, properties: {key: {type: string}, payload: {type: string}}}}}}
    response: {type: object, properties: {evicted: {type: array, items: {type: string}}}}
    errors:
      - {code: block-object-store-error, status: 0, retryable: false}
    behavior:
      - set:
          vars.new: "= input.objects.map(o, o.key)"
      - set:
          vars.lru: "= state.lru.filter(k, !(k in vars.new)) + vars.new"
      - set:
          vars.excess: "= size(vars.lru) - state.num_slots"
          vars.candidates: "= vars.lru.filter(k, !(k in state.references) && !(k in vars.new))"
      - if: "vars.excess > 0 && size(vars.candidates) < vars.excess"
        then:
          - title: Cannot retain the batch
            source: "vllm/distributed/aux_output_connector/store.py:135-139"
            fail: {code: block-object-store-error, status: 0, message: "= 'auxiliary output store cannot retain the requested batch: limit=' + string(state.num_slots) + ' objects'"}
      - set:
          vars.victims: "= vars.excess > 0 ? vars.candidates.slice(0, vars.excess) : []"
      - source: "vllm/distributed/aux_output_connector/store.py:178-187"
        set:
          state.lru: "= vars.lru.filter(k, !(k in vars.victims))"
          state.objects: "= merge(omit(state.objects, vars.victims), input.objects.transformMapEntry(i, o, {o.key: o.payload}))"
      - return: {evicted: "= vars.victims"}

  - component: block-object-store
    name: get-concatenated
    kind: function
    summary: "BlockObjectStore.get_concatenated: join the payloads of the keys in order; an evicted key raises."
    sources: ["vllm/distributed/aux_output_connector/store.py:205-228"]
    request: {type: object, required: [keys], properties: {keys: {type: array, items: {type: string}}}}
    response: {type: object, properties: {payload: {type: string}}}
    errors:
      - {code: block-object-store-error, status: 0, retryable: false}
    behavior:
      - if: "input.keys.exists(k, !(k in state.objects))"
        then:
          - source: "vllm/distributed/aux_output_connector/store.py:209-217"
            fail: {code: block-object-store-error, status: 0, message: "= 'auxiliary output object does not exist; the object may have been evicted (used=' + string(size(state.objects)) + ', limit=' + string(state.num_slots) + ' objects). Increase aux_output_config.max_bytes when a KV cache hit requires it.'"}
      - return: {payload: "= input.keys.map(k, state.objects[k]).join('')"}

  # ---------------------------------------------------------------- shm ring buffer
  - component: single-writer-shm-ring-buffer
    name: init
    kind: function
    summary: "SingleWriterShmRingBuffer.__init__: the writer (create=True) creates a segment of data_buffer_size + 32 bytes (auth secret first); a reader attaches to an existing segment by name and asserts it is large enough."
    sources: ["vllm/distributed/device_communicators/shm_object_storage.py:114-168"]
    request:
      type: object
      required: [data_buffer_size]
      properties:
        data_buffer_size: {type: integer, examples: [4096]}
        name: {type: [string, "null"], default: null}
        create: {type: boolean, default: false}
    response: {type: object, properties: {is_writer: {type: boolean}, name: {type: string}, data_buffer_size: {type: integer}}}
    errors:
      - {code: file-not-found-error, status: 0, retryable: false}
      - {code: file-exists-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "input.create"
        then:
          - set:
              vars.name: "= has(input.name) && input.name != null ? input.name : 'psm_' + string(random(100000000))"
          - title: SharedMemory(create=True, size=data_buffer_size + DATA_OFFSET), then write the auth secret
            source: "vllm/distributed/device_communicators/shm_object_storage.py:135-144"
            call: posix-shared-memory.create
