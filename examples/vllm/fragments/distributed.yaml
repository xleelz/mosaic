            source: "vllm/distributed/device_communicators/cuda_communicator.py:911-912"
            fail: {code: assertion-error, status: 0, message: ""}
      - if: "vars.sizes != null && size(vars.sizes) != input.world_size"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:924"
            fail: {code: assertion-error, status: 0, message: ""}
      - if: "vars.sizes != null && input.num_tokens != vars.sizes[(has(input.rank_in_group) ? input.rank_in_group : 0)]"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:925-927"
            fail: {code: assertion-error, status: 0, message: "= string(input.num_tokens) + ' != ' + string(vars.sizes[(has(input.rank_in_group) ? input.rank_in_group : 0)])"}
      - title: Every rank of the group calls the collective once
        source: "vllm/distributed/device_communicators/cuda_communicator.py:934-937"
        rendezvous: "= 'allgatherv:' + input.group_name"
        count: "= input.world_size"
        value: "= self"
        timeout_ms: "= !('distributed-timeout-seconds' in config) || config['distributed-timeout-seconds'] == null ? 600000 : config['distributed-timeout-seconds'] * 1000"
        latency_ms: "= (double(config['dist-nccl-base-us']) + double(input.num_tokens * (has(input.hidden_size) ? input.hidden_size : 4096) * 2 * (has(input.num_tensors) ? input.num_tensors : 1)) * double(input.world_size - 1) / (double(config['dist-nvlink-bus-gbps']) * 1000.0)) / 1000.0"
        as: meet
        on_error:
          - fail: {code: dist-backend-error, status: 0, message: "= 'collective timed out: ' + string(error.data.arrived) + ' of ' + string(error.data.count) + ' ranks arrived'"}
      - return:
          backend: "= vars.sizes != null ? 'pynccl-allgatherv' : 'pynccl'"
          bytes: "= input.num_tokens * (has(input.hidden_size) ? input.hidden_size : 4096) * 2 * (has(input.num_tensors) ? input.num_tensors : 1)"
          world_size: "= input.world_size"
          num_tokens: "= vars.sizes != null ? sum(vars.sizes) : input.num_tokens * input.world_size"

