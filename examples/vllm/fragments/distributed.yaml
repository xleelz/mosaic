      - {interface: moriio-connector-scheduler.get-num-new-matched-tokens, caller: engine-core, as: second, input: {request_id: "1", num_prompt_tokens: 32, num_computed_tokens: 0, kv_transfer_params: {do_remote_prefill: false, do_remote_decode: false}}}
