    name: poll
    kind: function
    summary: "ZmqServerTransport.poll: with a timeout, wait on the poller (a terminated context or poller failure returns nothing); then drain every pending message without blocking."
    sources: ["vllm/distributed/ec_transfer/ec_connector/cpu/control/zmq.py:188-216"]
    request: {type: object, properties: {timeout_ms: {type: integer, default: 100}}}
