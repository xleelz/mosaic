    summary: "_get_comm_group: EP when sequence parallel; with DP > 1, EP if expert parallel and PCP > 1 (TP must then be 1), else DP; at DP 1 the PCP group. Returns the group with the DP world size the manager caches."
    sources: ["vllm/distributed/device_communicators/all2all.py:76-87", "vllm/distributed/device_communicators/base_device_communicator.py:51-57"]
