fixtures:
  - id: distributed-tp2-llama-8b
    summary: "Two H100s (rank0, rank1) serving Llama-3-8B at --tensor-parallel-size 2, for distributed's parallel-startup scenarios (the process-group setup of a TP 2 deployment). Only the distributed components' view: the shared worlds have no dense TP 2 deployment."
    extends: [tp1-llama-8b]
    topology: {gpu-worker: [rank0, rank1]}
    config: {tensor-parallel-size: 2}

  - id: distributed-seed
    summary: "Distributed area seed: a started worker whose TP group follows tensor-parallel-size, on an H100 (sm 9.0) NVLink node with flashinfer installed. Every value equals the components' initial state; it is listed so merged worlds carry it explicitly."
    state:
      parallel-state: {world_initialized: true, mp_initialized: true}
      cuda-communicator: {device_capability: "9.0", flashinfer_available: true, platform: cuda}
      custom-allreduce: {disabled: false, fully_connected: true, same_node: true}


scenarios:
  # ---- all-reduce
  - id: distributed-all-reduce-tp1-bypass
    flow: distributed-tp-all-reduce
    fixtures: [tp1-llama-8b]
    expect:
      - "result.ok && result.value.backend == 'bypass'"
      - "calls['parallel-state.all-reduce'] == 0"
  - id: distributed-all-reduce-tp4-decode-flashinfer
    name: A 1 MB decode all-reduce on 4 H100s uses FlashInfer on every rank
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
    expect:
      - "result.ok && result.value.backend == 'flashinfer' && result.value.world_size == 4 && result.value.bytes == 1048576"
      - "['rank0','rank1','rank2','rank3'].all(r, calls_by_instance['flashinfer-all-reduce.all-reduce@' + r] == 1)"
  - id: distributed-all-reduce-tp4-custom-1stage
    name: With FlashInfer off, a 256 KB all-reduce runs the one-stage custom kernel
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    config: {vllm-allreduce-use-flashinfer: false}
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 16, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 16, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 16, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 16, hidden_size: 8192}}
    expect:
      - "result.ok && result.value.backend == 'custom-allreduce' && result.value.algorithm == 'custom-1stage'"
  - id: distributed-all-reduce-tp4-custom-2stage
    name: A 4 MB all-reduce above FlashInfer's 2 MB limit runs the two-stage custom kernel
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 256, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 256, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 256, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 256, hidden_size: 8192}}
    expect:
      - "result.ok && result.value.backend == 'custom-allreduce' && result.value.algorithm == 'custom-2stage'"
  - id: distributed-all-reduce-tp4-prefill-symm-mem
    name: A 32 MB prefill all-reduce exceeds the custom 8 MB limit and uses torch symmetric memory
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 2048, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 2048, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 2048, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 2048, hidden_size: 8192}}
    expect:
      - "result.ok && result.value.backend == 'torch-symm-mem' && result.value.bytes == 33554432"
      - "calls['custom-allreduce-cuda.all-reduce'] == 0"
      - "duration_us >= 100"
  - id: distributed-all-reduce-tp4-huge-pynccl
    name: Above the 32 MB symmetric-memory limit the all-reduce falls to PyNccl
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
    expect:
      - "result.ok && result.value.backend == 'pynccl'"
      - "calls['torch-distributed.all-reduce'] == 0"
  - id: distributed-all-reduce-pynccl-disabled-fallback
    name: A disabled PyNccl makes every rank fall back to torch.distributed.all_reduce
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    config: {vllm-allreduce-use-symm-mem: false}
    state:
      pynccl-communicator: {disabled: true}
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 4096, hidden_size: 8192}}
    expect:
