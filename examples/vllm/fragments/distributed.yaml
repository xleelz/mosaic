        world_size: {type: integer}
        rank_in_group: {type: integer, default: 0}
        num_tokens: {type: integer}
        hidden_size: {type: integer, default: 4096}
        sizes: {type: [array, "null"], default: null, items: {type: integer}}
        dim: {type: integer, default: 0}
        num_tensors: {type: integer, default: 1}
    response: DistCollectiveResult
    errors:
      - {code: not-implemented-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
      - {code: dist-backend-error, status: 0, retryable: false}
    behavior:
      - if: "(has(input.dim) ? input.dim : 0) != 0"
        then:
          - source: "vllm/distributed/device_communicators/cuda_communicator.py:890-891"
            fail: {code: not-implemented-error, status: 0, message: "only dim 0 all-gatherv is supported"}
      - title: "'sizes' is not needed if all inputs have the same shape"
        source: "vllm/distributed/device_communicators/cuda_communicator.py:894-897"
        set:
          vars.in_sizes: "= has(input.sizes) ? input.sizes : null"
      - set:
