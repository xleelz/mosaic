    summary: "The KV cache spec dataclasses (FullAttentionSpec, MLAAttentionSpec, SlidingWindowSpec, CircularBufferSpec, MambaSpec, the HiSparse specs, UniformTypeKVCacheSpecs) and KVCacheConfig/KVCacheGroupSpec/KVCacheTensor. Modeled: the page-size arithmetic, the per-group merge checks, and the KVCacheConfig group selectors the KV connectors read."
    description: >-
      Ownership note: vllm/v1/kv_cache_interface.py matches no area's `owns` glob. The KV connector
      tests (offloading, NIXL, Mooncake) build these objects, so the distributed area models the
      parts those tests and its connectors read. Pure functions of their input; no state.
    sources: ["vllm/v1/kv_cache_interface.py:164-176", "vllm/v1/kv_cache_interface.py:1408-1429", "vllm/v1/kv_cache_interface.py:1438-1456", "vllm/v1/kv_cache_interface.py:1459-1493"]
  - id: kv-cache-layout
    name: KVCacheLayout (enum)
    kind: module
    layer: kv-transfer
    parent: engine-core
    summary: "Physical KV cache layout descriptor: each member is a stride permutation of the logical [L, B, H, N, C] axes; properties tell whether layers or blocks are contiguous."
    sources: ["vllm/v1/kv_cache_layout.py:15-58"]
  - id: offloading-config
    name: offloading config (module)
    kind: module
    layer: kv-transfer
    parent: engine-core
    summary: "Translates vLLM's KV cache config into the native offloading boundary (OffloadingConfig): which cache groups are offloaded, each group's tokens per block, the hash granularity and the chunk size."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/offloading/config.py:36-56"]
  - id: offloading-worker-metadata
    name: OffloadingWorkerMetadata
    kind: module
    layer: kv-transfer
    parent: engine-core
    summary: "Worker -> scheduler metadata of the OffloadingConnector: {job_id: 1} per completed transfer job and the step's transfer stats; the executor sums them across workers each step."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/offloading/common.py:75-87"]

  - id: kv-connector-base-v1-worker
    name: KVConnectorBase_V1 (worker role)
    kind: module
    layer: kv-transfer
    parent: gpu-worker
    summary: "The WORKER-role connector object in each GPU worker: the model runner binds this step's connector metadata before the forward and clears it after; it registers the KV caches once, waits for saves, and reports finished transfers, stats and worker metadata. Dispatches to the configured connector (NIXL pull modeled; ExampleConnector and the base defaults otherwise)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:204-230"]
    state:
      schema: {type: object, properties: {role: {type: string}, connector_metadata: {type: [object, "null"]}}}
      initial: {role: WORKER, connector_metadata: null}
  - id: routed-experts-buffer
    name: RoutedExpertsBuffer
    kind: datastore
    layer: aux-output
    parent: gpu-worker
    capacity: {concurrency: 1}   # owned by the worker's AuxOutputConnectorWorker on the model-runner thread (worker.py:100-129)
    summary: "Fixed pool of routed-experts row blocks: stages each request's rows in a per-request tail slot and hands back a block once block_size rows are in; full aligned input blocks bypass staging."
    sources: ["vllm/distributed/aux_output_connector/routed_experts.py:20-51"]
    state:
      schema: {type: object, properties: {block_size: {type: integer}, num_slots: {type: integer}, free_slots: {type: array}, requests: {type: object}, owned_slots: {type: array}}}
      initial: {block_size: 4, num_slots: 0, free_slots: [], requests: {}, owned_slots: []}
  - id: nixl-metadata
    name: NIXL connector metadata (module)
    kind: module
    layer: kv-transfer
    parent: gpu-worker
    summary: "nixl/metadata.py helpers: the compatibility hash two NIXL instances compare before transferring KV."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/metadata.py:54", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/metadata.py:102-142"]


interfaces:
  # ---------------------------------------------------------------- parallel state
  - component: parallel-state
    name: init-distributed-environment
    kind: function
    summary: "init_distributed_environment: with DP > 1 offset the rank by the DP rank and widen the world to TP x PP x DP over a tcp:// DP init method; if torch.distributed isn't initialized log the world and init_process_group (falling back to gloo when the backend is unavailable); resolve local_rank; build the world GroupCoordinator once, or assert an existing one has the same size."
    sources: ["vllm/distributed/parallel_state.py:1814-2016"]
    request:
      type: object
      required: [world_size, rank]
      properties:
        world_size: {type: integer, examples: [1]}
        rank: {type: integer, examples: [0]}
        local_rank: {type: integer, default: -1}
        backend: {type: string, default: nccl}
        distributed_init_method: {type: string, default: "env://", description: "the executor's tcp://<loopback>:<open port> for multiprocessing workers (worker_base); env:// otherwise"}
        backend_available: {type: boolean, default: true}
        data_parallel_rank: {type: integer, default: 0}
        dp_init_port: {type: [integer, "null"], default: null, description: "the port get_next_dp_init_port pops; null takes data_parallel_master_port (29500)"}
    response: {type: object, properties: {world_size: {type: integer}, rank: {type: integer}, local_rank: {type: integer}, backend: {type: string}, distributed_init_method: {type: string}, already_initialized: {type: boolean}, log: {type: [string, "null"]}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false, summary: "world group already initialized with a different world size"}
    behavior:
      - set:
          vars.args: "= merge({'local_rank': -1, 'backend': 'nccl', 'distributed_init_method': 'env://', 'backend_available': true, 'data_parallel_rank': 0, 'dp_init_port': null}, input)"
      - set:
          vars.ws: "= vars.args.world_size"
          vars.rank: "= vars.args.rank"
          vars.method: "= vars.args.distributed_init_method"
          vars.backend: "= vars.args.backend"
          vars.log: null
      - title: "DP > 1 (not external_launcher, one node): rank += data_parallel_rank * world_size, world_size = world_size_across_dp, init method tcp://data_parallel_master_ip:<next DP init port>"
        source: "vllm/distributed/parallel_state.py:1835-1904"
        if: "config['data-parallel-size'] > 1 && (!('distributed-executor-backend' in config) || config['distributed-executor-backend'] != 'external_launcher')"
        then:
          - set:
              vars.rank: "= vars.args.data_parallel_rank * vars.args.world_size + vars.args.rank"
              vars.ws: "= vars.args.world_size * config['data-parallel-size']"
              vars.method: "= 'tcp://127.0.0.1:' + string(vars.args.dp_init_port != null ? vars.args.dp_init_port : 29500)"
      - if: "state.world_initialized"
        then:
          - title: World group already exists
            detail: "torch.distributed is initialized; the world GroupCoordinator must match the requested world size."
            source: "vllm/distributed/parallel_state.py:1989-1992"
            if: "state.world_size > 0 && state.world_size != vars.ws"
            then:
              - fail: {code: assertion-error, status: 0, message: "world group already initialized with a different world size"}
          - return: {world_size: "= vars.ws", rank: "= vars.rank", local_rank: "= vars.args.local_rank == -1 ? vars.rank : vars.args.local_rank", backend: "= state.backend", distributed_init_method: "= vars.method", already_initialized: true, log: null}
      - title: "world_size=%d rank=%d local_rank=%d distributed_init_method=%s backend=%s (info, before init_process_group)"
        source: "vllm/distributed/parallel_state.py:1905-1913"
        set:
          vars.log: "= 'world_size=' + string(vars.ws) + ' rank=' + string(vars.rank) + ' local_rank=' + string(vars.args.local_rank) + ' distributed_init_method=' + vars.method + ' backend=' + vars.backend"
      - title: "Distributed backend <backend> is not available; falling back to gloo."
        source: "vllm/distributed/parallel_state.py:1918-1925"
        if: "!vars.args.backend_available"
        then:
          - set: {vars.backend: gloo}
      - title: "local_rank -1: LOCAL_RANK for env://, else the rank"
        source: "vllm/distributed/parallel_state.py:1966-1972"
        set:
          vars.local: "= vars.args.local_rank != -1 ? vars.args.local_rank : vars.rank"
      - title: init_process_group and the world GroupCoordinator
        detail: "The world group spans every rank (ranks = range(world_size)); the node count is derived from the CPU group."
        source: "vllm/distributed/parallel_state.py:1981-1988"
        set:
          state.world_initialized: true
          state.world_size: "= vars.ws"
          state.rank: "= vars.rank"
          state.backend: "= vars.backend"
          state.groups: "= merge(state.groups, {'world': {'world_size': vars.ws, 'unique_name': 'world:0'}})"
      - return: {world_size: "= vars.ws", rank: "= vars.rank", local_rank: "= vars.local", backend: "= vars.backend", distributed_init_method: "= vars.method", already_initialized: false, log: "= vars.log"}

  - component: parallel-state
    name: set-custom-all-reduce
    kind: function
    summary: "Set the module flag _ENABLE_CUSTOM_ALL_REDUCE that the TP CudaCommunicator reads when it is built."
    sources: ["vllm/distributed/parallel_state.py:1708-1713"]
    request: {type: object, required: [enable], properties: {enable: {type: boolean, examples: [true]}}}
    response: {type: object, properties: {enabled: {type: boolean}}}
    behavior:
      - set: {state.custom_all_reduce_enabled: "= input.enable"}
      - if: "!input.enable"
        then:
          - title: The custom all-reduce will not be built
            detail: "CudaCommunicator only creates CustomAllreduce when _ENABLE_CUSTOM_ALL_REDUCE is true for the tp group."
            source: "vllm/distributed/device_communicators/cuda_communicator.py:63-66"
            call: custom-allreduce.disable
            input: {reason: "disable_custom_all_reduce"}
      - return: {enabled: "= input.enable"}

  - component: parallel-state
    name: ensure-model-parallel-initialized
    kind: function
    summary: "Initialize the model-parallel groups if absent, else assert that TP/PP/PCP/DCP sizes match the request."
    sources: ["vllm/distributed/parallel_state.py:2366-2415"]
    request:
      type: object
      required: [tensor_model_parallel_size, pipeline_model_parallel_size]
      properties:
        tensor_model_parallel_size: {type: integer, examples: [1]}
        pipeline_model_parallel_size: {type: integer, default: 1}
        data_parallel_size: {type: integer, default: 1}
        is_moe: {type: boolean, default: false}
        enable_eplb: {type: boolean, default: false}
    response: {type: object, properties: {tp_world_size: {type: integer}, pp_world_size: {type: integer}, created: {type: boolean}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - title: "model_parallel_is_initialized: the TP and PP groups exist. A world seeded without a TP group has not built its groups yet, so a MoE checkpoint builds them here and gets its EP group"
        source: "vllm/distributed/parallel_state.py:2385-2391"
        if: "!state.mp_initialized || (has(input.is_moe) && input.is_moe && !('tp' in state.groups))"
        then:
          - call: parallel-state.initialize-model-parallel
            input: "= merge({'data_parallel_size': null}, input)"
            as: init
          - return: {tp_world_size: "= input.tensor_model_parallel_size", pp_world_size: "= input.pipeline_model_parallel_size", created: true}
      - title: get_pp_group().world_size
        source: "vllm/distributed/parallel_state.py:2397"
        call: parallel-state.get-pp-group
        as: ppg
      - set:
          vars.tp: "= 'tp' in state.groups ? state.groups.tp.world_size : config['tensor-parallel-size']"
          vars.pp: "= vars.ppg.value.world_size"
      - title: Sizes must match the existing groups
        source: "vllm/distributed/parallel_state.py:2392-2396"
        if: "vars.tp != input.tensor_model_parallel_size"
        then:
          - fail: {code: assertion-error, status: 0, message: "= 'tensor parallel group already initialized, but of unexpected size. got: get_tensor_model_parallel_world_size()=' + string(vars.tp) + ' vs. wanted: tensor_model_parallel_size=' + string(input.tensor_model_parallel_size)"}
      - if: "vars.pp != input.pipeline_model_parallel_size"
        then:
          - source: "vllm/distributed/parallel_state.py:2397-2402"
            fail: {code: assertion-error, status: 0, message: "= 'pipeline parallel group already initialized, but of unexpected size. got: pp_world_size=' + string(vars.pp) + ' vs. wanted: pipeline_model_parallel_size=' + string(input.pipeline_model_parallel_size)"}
      - return: {tp_world_size: "= vars.tp", pp_world_size: "= vars.pp", created: false}

  - component: parallel-state
    name: initialize-model-parallel
    kind: function
    summary: "Lay out ranks as ExternalDP x DP x PP x PCP x TP and build the TP (with a message-queue broadcaster), DCP, PCP, PP, DP groups, plus EP (MoE only) and EPLB (when enabled)."
    sources: ["vllm/distributed/parallel_state.py:2056-2364"]
    request:
      type: object
      required: [tensor_model_parallel_size, pipeline_model_parallel_size]
      properties:
        tensor_model_parallel_size: {type: integer, examples: [1]}
        pipeline_model_parallel_size: {type: integer, default: 1}
        data_parallel_size: {type: [integer, "null"], default: null, description: "Read from the current config's parallel_config.data_parallel_size (config['data-parallel-size']) when null"}
        is_moe: {type: boolean, default: false, description: "The current config's model_config.is_moe (the caller passes it)"}
        enable_eplb: {type: boolean, default: false}
    response: {type: object, properties: {groups: {type: array, items: {type: string}}, ranks: {type: object}, log: {type: string}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: runtime-error, status: 0, retryable: false}
    behavior:
      - title: torch.distributed must be initialized first
        source: "vllm/distributed/parallel_state.py:2091"
        if: "!state.world_initialized"
        then:
          - fail: {code: assertion-error, status: 0, message: "torch.distributed is not initialized"}
      - title: "data_parallel_size comes from get_current_vllm_config().parallel_config, not from the arguments"
        source: "vllm/distributed/parallel_state.py:2093-2097"
        set:
          vars.dp: "= input.data_parallel_size != null ? input.data_parallel_size : config['data-parallel-size']"
      - set:
          vars.block: "= input.tensor_model_parallel_size * input.pipeline_model_parallel_size * vars.dp"
      - title: "all_ranks = arange(world_size).reshape(-1, DP, PP, PCP, TP)"
        detail: "torch reshape raises when world_size is not a multiple of DP x PP x TP."
        source: "vllm/distributed/parallel_state.py:2135-2141"
        if: "state.world_size % vars.block != 0"
        then:
          - fail: {code: runtime-error, status: 0, message: "= 'shape \\'[-1, ' + string(vars.dp) + ', ' + string(input.pipeline_model_parallel_size) + ', 1, ' + string(input.tensor_model_parallel_size) + ']\\' is invalid for input of size ' + string(state.world_size)"}
      - title: TP groups are consecutive ranks; the TP group gets the shared-memory broadcaster
        source: "vllm/distributed/parallel_state.py:2143-2157"
        set:
          vars.groups: "= {'tp': {'world_size': input.tensor_model_parallel_size, 'unique_name': 'tp:0', 'mq_broadcaster': true}, 'dcp': {'world_size': 1, 'unique_name': 'dcp:0'}, 'pcp': {'world_size': 1, 'unique_name': 'pcp:0'}, 'pp': {'world_size': input.pipeline_model_parallel_size, 'unique_name': 'pp:0'}, 'dp': {'world_size': vars.dp, 'unique_name': 'dp:0'}}"
      - title: EP group only for MoE models
        detail: "Dense models get no EP group (_EP stays None); EP spans DP x PCP x TP (PCP is 1 here)."
        source: "vllm/distributed/parallel_state.py:2289-2302"
        if: "input.is_moe"
        then:
          - title: "ParallelConfig.use_all2all: DP > 1, sequence-parallel MoE (an all-to-all backend with EP, TP > 1 and DP > 1), or EP with PCP > 1"
            source: "vllm/config/parallel.py:763-789"
            set:
              vars.seq_moe: "= config['all2all-backend'] in ['allgather_reducescatter', 'deepep_high_throughput', 'deepep_low_latency', 'deepep_v2', 'flashinfer_nvlink_one_sided', 'passthrough', 'mori_high_throughput', 'mori_low_latency', 'nixl_ep'] && config['enable-expert-parallel'] && input.tensor_model_parallel_size > 1 && vars.dp > 1"
          - set:
              vars.use_all2all: "= vars.dp > 1 || vars.seq_moe"
          - title: "The EP communicator builds an all2all manager only when use_all2all; naive and allgather_reducescatter both get AgRsAll2AllManager"
            source: "vllm/distributed/device_communicators/cuda_communicator.py:202-260"
            set: {vars.manager: null}
          - if: "vars.use_all2all"
            then:
              - set:
                  vars.manager: "= config['all2all-backend'] in ['naive', 'allgather_reducescatter'] ? 'AgRsAll2AllManager' : {'deepep_high_throughput': 'DeepEPHTAll2AllManager', 'deepep_low_latency': 'DeepEPLLAll2AllManager', 'mori_high_throughput': 'MoriAll2AllManager', 'mori_low_latency': 'MoriAll2AllManager', 'deepep_v2': 'DeepEPV2All2AllManager', 'moonep': 'MoonEPAll2AllManager', 'nixl_ep': 'NixlEPAll2AllManager', 'flashinfer_all2allv': 'FlashInferNVLinkTwoSidedManager', 'flashinfer_nvlink_two_sided': 'FlashInferNVLinkTwoSidedManager', 'flashinfer_nvlink_one_sided': 'FlashInferNVLinkOneSidedManager', 'passthrough': 'PassThroughAll2AllManager'}[config['all2all-backend']]"
          - source: "vllm/distributed/parallel_state.py:2303-2322"
            set:
              vars.groups: "= merge(vars.groups, {'ep': {'world_size': vars.dp * input.tensor_model_parallel_size, 'unique_name': 'ep:0', 'use_all2all': vars.use_all2all, 'all2all_manager': vars.manager}})"
          - title: EPLB gets its own group with the EP ranks
            source: "vllm/distributed/parallel_state.py:2324-2346"
            when: "input.enable_eplb"
            set:
              vars.groups: "= merge(vars.groups, {'eplb': {'world_size': vars.dp * input.tensor_model_parallel_size, 'unique_name': 'eplb:0'}})"
      - title: "This process's rank in each group: all_ranks is laid out (-1, DP, PP, PCP, TP); EP and EPLB span DP x PCP x TP within a PP stage; ETP is the TP group without an Engram config"
        source: "vllm/distributed/parallel_state.py:2135-2141,2160-2168,2289-2302"
        set:
          vars.r: "= has(state.rank) && state.rank >= 0 ? state.rank : int(self.replace('rank', ''))"
          vars.tp: "= input.tensor_model_parallel_size"
          vars.pp: "= input.pipeline_model_parallel_size"
      - set:
          vars.ranks: "= {'tp': vars.r % vars.tp, 'pcp': 0, 'pp': (vars.r / vars.tp) % vars.pp, 'dp': (vars.r / (vars.tp * vars.pp)) % vars.dp}"
      - set:
          vars.ep_rank: "= 'ep' in vars.groups ? string(vars.ranks.dp * vars.tp + vars.ranks.tp) : 'N/A'"
      - title: "rank %s in world size %s is assigned as DP rank %s, PP rank %s, PCP rank %s, TP rank %s, ETP rank %s, EP rank %s, EPLB rank %s (info_once)"
        source: "vllm/distributed/parallel_state.py:2350-2362"
        set:
          vars.log: "= 'rank ' + string(vars.r) + ' in world size ' + string(state.world_size) + ' is assigned as DP rank ' + string(vars.ranks.dp) + ', PP rank ' + string(vars.ranks.pp) + ', PCP rank 0, TP rank ' + string(vars.ranks.tp) + ', ETP rank ' + string(vars.ranks.tp) + ', EP rank ' + vars.ep_rank + ', EPLB rank ' + ('eplb' in vars.groups ? vars.ep_rank : 'N/A')"
      - set:
          state.groups: "= merge(state.groups, vars.groups)"
          state.mp_initialized: true
      - return: {groups: "= vars.groups.map(k, k)", ranks: "= vars.ranks", log: "= vars.log"}

  - component: parallel-state
    name: get-tp-group
    kind: function
    summary: "Return the tensor-parallel GroupCoordinator (its size, ranks and this process's rank in it); asserts it was initialized."
    sources: ["vllm/distributed/parallel_state.py:1588-1590", "vllm/distributed/parallel_state.py:2437-2444"]
    request: {type: object, properties: {}}
    response: DistTpGroup
    errors:
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "!state.mp_initialized"
        then:
          - title: "assert _TP is not None"
            source: "vllm/distributed/parallel_state.py:1589"
            fail: {code: assertion-error, status: 0, message: "tensor model parallel group is not initialized"}
      - set:
          vars.ws: "= 'tp' in state.groups ? state.groups.tp.world_size : config['tensor-parallel-size']"
      - return:
          world_size: "= vars.ws"
          ranks: "= lists.range(vars.ws).map(i, 'rank' + string(i))"
          rank_in_group: "= int(self.replace('rank', '')) % vars.ws"
          unique_name: "tp:0"

  - component: parallel-state
    name: get-pp-group
    kind: io
    summary: "get_pp_group: the pipeline-parallel GroupCoordinator; asserts it was initialized (the module global _PP)."
    sources: ["vllm/distributed/parallel_state.py:1638-1640"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {world_size: {type: integer}, unique_name: {type: string}}}
    errors:
      - {code: assertion-error, status: 0, retryable: false, summary: "pipeline model parallel group is not initialized"}
    store: {table: groups, op: get, key: pp, not_found: assertion-error}

  - component: parallel-state
    name: get-tensor-model-parallel-world-size
    kind: function
    summary: "get_tp_group().world_size, the read path for the TP layout."
    sources: ["vllm/distributed/parallel_state.py:2437-2439"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {world_size: {type: integer}}}
    behavior:
      - call: parallel-state.get-tp-group
        as: tp
      - return: {world_size: "= vars.tp.value.world_size"}

  - component: parallel-state
    name: destroy-model-parallel
    kind: function
    summary: "Destroy every model-parallel GroupCoordinator and reset the module globals to None."
    sources: ["vllm/distributed/parallel_state.py:2458-2503"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {destroyed: {type: array, items: {type: string}}}}
    behavior:
      - if: "!state.mp_initialized"
        then:
          - title: Nothing to destroy
            detail: "Each group is destroyed only when its global is set."
            source: "vllm/distributed/parallel_state.py:2466-2468"
            return: {destroyed: []}
      - set:
          vars.names: "= ['tp', 'dcp', 'pcp', 'pp', 'dp', 'ep', 'eplb'].filter(n, n in state.groups || n == 'tp')"
      - set:
          state.destroyed_groups: "= state.destroyed_groups + vars.names.map(n, n + ':0')"
          state.mp_initialized: false
          state.groups: "= 'world' in state.groups ? {'world': state.groups.world} : {}"
      - return: {destroyed: "= vars.names"}

  # The torch custom ops registered with direct_register_custom_op (torch-op entries).
  - component: parallel-state
    name: all-reduce
    kind: kernel
    summary: "torch.ops.vllm.all_reduce: look the group up by name in _groups and run its out-of-place all-reduce (registered as a custom op so torch.compile can trace it)."
    sources: ["vllm/distributed/parallel_state.py:398-402", "vllm/distributed/parallel_state.py:198-203", "vllm/distributed/parallel_state.py:747-750"]
    request:
      type: object
      required: [group_name, num_tokens]
      properties:
        group_name: {type: string, examples: ["tp:0"]}
        num_tokens: {type: integer, examples: [128]}
        hidden_size: {type: integer, default: 4096}
        dtype: {type: string, default: bfloat16}
        num_collectives: {type: integer, default: 1}
        world_size: {type: integer, examples: [4]}
        ranks: {type: array, items: {type: string}}
    response: DistCollectiveResult
    errors:
      - {code: assertion-error, status: 0, retryable: false}
      - {code: value-error, status: 0, retryable: false}
    behavior:
      - call: parallel-state.lookup-group
        input: {group_name: "= input.group_name"}
      - call: cuda-communicator.all-reduce
        input: "= input"
        as: out
