      - {interface: eplb-communicator.create, caller: gpu-worker, on: rank0, as: pydt, input: {backend: pynccl, unsupported_dtypes: [torch.float8_e8m0fnu, torch.complex64]}}
      - {interface: eplb-communicator.create, caller: gpu-worker, on: rank0, as: bogus, input: {backend: mpi}}
      - {interface: eplb-communicator.create, caller: gpu-worker, on: rank0, as: eep, input: {backend: torch_gloo, is_stateless: true}}
      - {interface: eplb-communicator.create, caller: gpu-worker, on: rank0, as: eepn, input: {backend: torch_nccl, is_stateless: true}}
    expect:
      - "trace.exists(e, e.type == 'note' && e.title == \"Stateless elastic EP requires PyNCCL backend. Forcing EPLB communicator to 'pynccl'.\")"
      - "steps.gloo.result.value.class_name == 'TorchDistGlooStagedEplbCommunicator' && steps.gloo.result.value.needs_profile_buffer_reservation"
      - "!steps.nixl.result.ok && steps.nixl.result.error.code == 'runtime-error' && steps.nixl.result.error.message == \"EPLB communicator 'nixl' requested but NIXL is unavailable.\""
      - "steps.pycpu.result.error.message == \"EPLB communicator 'pynccl' supports only cuda-like devices (got cpu).\""
      - "steps.pydt.result.error.message == \"EPLB communicator 'pynccl' requested but expert weights contain unsupported dtypes: (torch.complex64, torch.float8_e8m0fnu).\""
      - "steps.bogus.result.error.code == 'value-error' && steps.bogus.result.error.message == 'Unknown EPLB communicator backend: mpi'"
      - "steps.eep.result.error.code == 'value-error' && steps.eep.result.error.message == \"Elastic EP requires 'torch_nccl', 'pynccl', or 'nixl' EPLB communicator (got 'torch_gloo').\""
      - "steps.eepn.result.value.backend == 'pynccl' && steps.eepn.result.value.class_name == 'PyNcclEplbCommunicator'"

  - id: distributed-eplb-communicator-nixl-skips-reservation
    name: "With NIXL installed the auto communicator is NIXL, which skips the profile run's buffer reservation"
