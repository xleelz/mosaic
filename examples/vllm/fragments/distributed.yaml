# distributed area fragment (vllm v0.32.0). Generated by gen/distributed/build.py
# from gen/distributed/p*.yaml; edit the parts, not this file.
schema_version: 1
id: vllm

configs:
  - id: tensor-parallel-size
    type: integer
    value: 1
    default: 1
    summary: "tensor_parallel_size: GPUs per tensor-parallel group; the TP group is rank0..rank{n-1} (deployed = default in tp1 fixtures; tp4-llama-70b deploys 4)"
    sources: ["vllm/config/parallel.py:141", "vllm/engine/arg_utils.py:530"]
    attributes: {key: tensor_parallel_size}
  - id: vllm-allreduce-use-flashinfer
    type: boolean
    value: true
    default: true
    summary: "VLLM_ALLREDUCE_USE_FLASHINFER (env, default 1): the TP CudaCommunicator builds a FlashInferAllReduce and tries it first"
    sources: ["vllm/envs.py:1970-1972", "vllm/distributed/device_communicators/cuda_communicator.py:69-71"]
    attributes: {key: VLLM_ALLREDUCE_USE_FLASHINFER}
  - id: vllm-allreduce-use-symm-mem
    type: boolean
    value: true
    default: true
    summary: "VLLM_ALLREDUCE_USE_SYMM_MEM (env, default 1): the TP CudaCommunicator builds a torch SymmMemCommunicator"
    sources: ["vllm/envs.py:1966-1968", "vllm/distributed/device_communicators/cuda_communicator.py:67"]
    attributes: {key: VLLM_ALLREDUCE_USE_SYMM_MEM}
  - id: vllm-use-nccl-symm-mem
    type: boolean
    value: false
    default: false
    summary: "VLLM_USE_NCCL_SYMM_MEM (env, default 0): enables the NCCL symmetric-memory all-reduce op"
    sources: ["vllm/envs.py:2099-2101", "vllm/distributed/device_communicators/pynccl_allocator.py:49-51"]
    attributes: {key: VLLM_USE_NCCL_SYMM_MEM}
  - id: vllm-custom-allreduce-algo
    type: string
    value: ""
    default: ""
    summary: "VLLM_CUSTOM_ALLREDUCE_ALGO (read by getenv in C++): 1stage|oneshot|2stage|twoshot forces the kernel; empty picks by size"
    sources: ["csrc/custom_all_reduce.cuh:271-286"]
    attributes: {key: VLLM_CUSTOM_ALLREDUCE_ALGO}
  - id: vllm-skip-p2p-check
    type: boolean
    value: true
    default: true
    summary: "VLLM_SKIP_P2P_CHECK: the env lambda defaults to '1' (true) although the typed stub says False; true trusts the driver's P2P report instead of the subprocess probe"
    sources: ["vllm/envs.py:1216", "vllm/envs.py:129"]
    attributes: {key: VLLM_SKIP_P2P_CHECK}
  - id: distributed-timeout-seconds
    type: integer
    value: null
    default: null
    summary: "distributed_timeout_seconds: process-group timeout; None means torch's default_pg_timeout (600 s for NCCL), which bounds how long ranks wait in a collective (reference; the worker passes it to init_distributed_environment)"
    sources: ["vllm/config/parallel.py:360-364", "vllm/distributed/parallel_state.py:1879-1895"]
    attributes: {key: distributed_timeout_seconds, boundary: true, owner: worker-runner}
  # Latency coefficients. The code gives no numbers; these are labeled assumptions for an
  # H100-class NVLink node (see notes/distributed.md, "Config").
  - {id: dist-nvlink-bus-gbps, type: number, value: 300, default: 300, summary: "ASSUMPTION: effective intra-node NVLink bus bandwidth in GB/s used by collective latency expressions", sources: ["vllm/distributed/device_communicators/all_reduce_utils.py:31-37"], attributes: {assumption: true}}
  - {id: dist-custom-ar-base-us, type: number, value: 6, default: 6, summary: "ASSUMPTION: fixed launch+barrier cost of a custom all-reduce kernel, microseconds", sources: ["csrc/custom_all_reduce.cuh:288-308"], attributes: {assumption: true}}
  - {id: dist-flashinfer-ar-base-us, type: number, value: 5, default: 5, summary: "ASSUMPTION: fixed cost of a FlashInfer one-shot all-reduce, microseconds", sources: ["vllm/distributed/device_communicators/flashinfer_all_reduce.py:522"], attributes: {assumption: true}}
  - {id: dist-symm-mem-base-us, type: number, value: 8, default: 8, summary: "ASSUMPTION: fixed cost of a torch symmetric-memory all-reduce, microseconds", sources: ["vllm/distributed/device_communicators/symm_mem.py:127"], attributes: {assumption: true}}
  - {id: dist-nccl-base-us, type: number, value: 15, default: 15, summary: "ASSUMPTION: fixed cost of an NCCL ring collective, microseconds", sources: ["vllm/distributed/device_communicators/pynccl.py:268"], attributes: {assumption: true}}

  - id: all2all-backend
    type: string
    value: allgather_reducescatter
    default: allgather_reducescatter
    summary: "--all2all-backend (parallel_config.all2all_backend): the MoE all-to-all implementation the EP group's communicator builds when ParallelConfig.use_all2all; naive and allgather_reducescatter both use AgRsAll2AllManager"
    sources: ["vllm/config/parallel.py:219", "vllm/engine/arg_utils.py:558"]
    attributes: {key: all2all_backend}
  - id: mooncake-config-path
    type: string
    value: null
    default: null
    summary: "MOONCAKE_CONFIG_PATH: the JSON file MooncakeStoreConfig.load_from_config reads (os.getenv; unset in every shared world)"
    sources: ["vllm/distributed/mooncake_store.py:72-78"]
    attributes: {key: MOONCAKE_CONFIG_PATH, env: true}

  # config-platform owns both (vllm/config/parallel.py, the nixl probe); copies for the standalone check.
  - {id: eplb-config, type: object, value: {}, default: {}, summary: "--eplb-config (EPLBConfig): {} is the defaults (window_size 1000, step_interval 3000, num_redundant_experts 0, log_balancedness off, use_async on, policy default, communicator None = auto)", sources: ["vllm/config/parallel.py:207", "vllm/engine/arg_utils.py:569"], attributes: {key: eplb_config, boundary: true, owner: config-platform}}
  - {id: nixl-available, type: boolean, value: false, default: false, summary: "Whether the NIXL package is importable (is_nixl_available); it ships with the KV-connector extras, not the base CUDA install, so EPLB's auto communicator falls back to torch_gloo", sources: ["vllm/distributed/nixl_utils.py:86-91"], attributes: {key: "nixl importable", env: true, boundary: true, owner: config-platform}}

  - id: vllm-moriio-transfer-timeout-s
    type: string
    value: null
    default: null
    summary: "VLLM_MORIIO_TRANSFER_TIMEOUT_S (deprecated): read with os.environ.get as the fallback recv_abort_timeout when kv_connector_extra_config has none; unset in every world"
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_common.py:355-367"]
    attributes: {key: VLLM_MORIIO_TRANSFER_TIMEOUT_S, env: true}

  - id: kv-connector
    type: string
    value: ""
    default: ""
    summary: "kv_transfer_config.kv_connector: the KV connector class name. No fixture deploys one (no --kv-transfer-config), so the deployed value is unset (\"\" here; None in code)."
    sources: ["vllm/config/kv_transfer.py:60", "vllm/engine/arg_utils.py:770"]
    attributes: {key: kv_transfer_config.kv_connector}
  - id: kv-role
    type: string
    value: ""
    default: ""
    summary: "kv_transfer_config.kv_role: kv_producer | kv_consumer | kv_both; unset by default, which makes is_kv_transfer_instance false."
    sources: ["vllm/config/kv_transfer.py:71-73", "vllm/config/kv_transfer.py:127-128"]
    attributes: {key: kv_transfer_config.kv_role}
  - id: disable-hybrid-kv-cache-manager
    type: boolean
    value: null
    default: null
    summary: "disable_hybrid_kv_cache_manager: None lets VllmConfig auto-disable HMA for connectors without SupportsHMA; only an explicit False reaches the factory's HMA refusal (reference)."
    sources: ["vllm/config/scheduler.py:182", "vllm/config/vllm.py:2170-2192"]
    attributes: {key: disable_hybrid_kv_cache_manager, boundary: true, owner: config-platform}
  - id: nixl-kv-lease-duration
    type: integer
    value: 30
    default: 30
    summary: "kv_connector_extra_config.kv_lease_duration (seconds): how long a NIXL prefill node keeps finished blocks for the decoder to read."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:82-86"]
    attributes: {key: kv_connector_extra_config.kv_lease_duration}
  - id: nixl-kv-recompute-threshold
    type: integer
    value: 64
    default: 64
    summary: "kv_connector_extra_config.kv_recompute_threshold (tokens): a decode-side partial hit smaller than this is recomputed rather than pulled."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:165-169"]
    attributes: {key: kv_connector_extra_config.kv_recompute_threshold}
  - id: nixl-decoder-kv-blocks-ttl
    type: integer
    value: 480
    default: 480
    summary: "kv_connector_extra_config.decoder_kv_blocks_ttl (seconds): pin time of decode-side blocks for a turn-2 readback (bidirectional mode)."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_scheduler.py:178-182"]
    attributes: {key: kv_connector_extra_config.decoder_kv_blocks_ttl}
  - id: dist-nixl-rdma-gbps
    type: number
    value: 25
    default: 25
    summary: "ASSUMPTION: effective RDMA bandwidth (GB/s) between a prefill and a decode node for NIXL/MoRIIO/Mooncake KV writes; the code gives no number."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:432-446"]
    attributes: {assumption: true}

  - id: enable-kv-cache-events
    type: boolean
    value: false
    default: false
    summary: "kv_events_config.enable_kv_cache_events: off unless --kv-events-config enables it; then the scheduler's EventPublisherFactory builds a ZMQ publisher."
    sources: ["vllm/config/kv_events.py:14", "vllm/engine/arg_utils.py:771"]
    attributes: {key: kv_events_config.enable_kv_cache_events}
  - {id: kv-events-endpoint, type: string, value: "tcp://*:5557", default: "tcp://*:5557", summary: "kv_events_config.endpoint: the PUB address; its port is offset by the DP rank", sources: ["vllm/config/kv_events.py:23"], attributes: {key: kv_events_config.endpoint}}
  - {id: kv-events-replay-endpoint, type: string, value: null, default: null, summary: "kv_events_config.replay_endpoint: the optional ROUTER address for replay requests", sources: ["vllm/config/kv_events.py:27"], attributes: {key: kv_events_config.replay_endpoint}}
  - {id: kv-events-hwm, type: integer, value: 100000, default: 100000, summary: "kv_events_config.hwm: the ZMQ high water mark of the PUB socket", sources: ["vllm/config/kv_events.py:36"], attributes: {key: kv_events_config.hwm}}
  - {id: kv-events-max-queue-size, type: integer, value: 100000, default: 100000, summary: "kv_events_config.max_queue_size: events queued for the publisher thread", sources: ["vllm/config/kv_events.py:41"], attributes: {key: kv_events_config.max_queue_size}}
  - {id: kv-events-topic, type: string, value: "", default: "", summary: "kv_events_config.topic: the topic batches are published under", sources: ["vllm/config/kv_events.py:45"], attributes: {key: kv_events_config.topic}}
  - id: kv-events-publisher
    type: string
    value: null
    default: null
    summary: "kv_events_config.publisher: null | zmq (no default; KVEventsConfig.__post_init__ resolves it)."
    sources: ["vllm/config/kv_events.py:19"]
    attributes: {key: kv_events_config.publisher}
  - id: kv-events-buffer-steps
    type: integer
    value: 10000
    default: 10000
    summary: "kv_events_config.buffer_steps: batches kept in the replay buffer (deque maxlen)."
    sources: ["vllm/config/kv_events.py:31", "vllm/distributed/kv_events.py:345"]
    attributes: {key: kv_events_config.buffer_steps}

  - id: simple-cpu-offload-cpu-bytes
    type: integer
    value: 8589934592
    default: 8589934592
    summary: "kv_connector_extra_config.cpu_bytes_to_use: server-wide CPU KV capacity (8 GiB default), split per rank."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py:54", "vllm/distributed/kv_transfer/kv_connector/v1/simple_cpu_offload_connector.py:86-91"]
    attributes: {key: kv_connector_extra_config.cpu_bytes_to_use}


schemas:
  - id: DistCollectiveRequest
    summary: "A tensor handed to a collective, described by its shape: num_tokens x hidden_size of dtype. num_collectives lets a caller stand for several identical collectives (for example 2 per decoder layer) so millisecond rounding does not inflate the step."
    schema:
      type: object
      required: [num_tokens]
      properties:
        num_tokens: {type: integer, minimum: 1, examples: [128]}
        hidden_size: {type: integer, default: 4096}
        dtype: {type: string, enum: [bfloat16, float16, float32, int32], default: bfloat16}
        dim: {type: integer, default: -1}
        num_collectives: {type: integer, minimum: 1, default: 1}
        layer: {type: integer, default: 0}
  - id: DistCollectiveResult
    schema:
      type: object
      properties:
        backend: {type: string, examples: [custom-allreduce]}
        algorithm: {type: string}
        bytes: {type: integer}
        world_size: {type: integer}
        num_tokens: {type: integer}
        hidden_size: {type: integer}
  - id: DistTpGroup
    schema:
      type: object
      properties:
        world_size: {type: integer, examples: [1]}
        ranks: {type: array, items: {type: string}, examples: [[rank0]]}
        rank_in_group: {type: integer, examples: [0]}
        unique_name: {type: string, examples: ["tp:0"]}
  - id: DistKernelLaunch
    summary: "What a collective kernel needs for its latency: the bytes this rank contributes, the group size, and how many identical launches the call stands for."
    schema:
      type: object
      required: [bytes, world_size]
      properties:
        bytes: {type: integer, examples: [1048576]}
        world_size: {type: integer, examples: [4]}
        num_collectives: {type: integer, default: 1}
        algorithm: {type: string}

  - id: DistKvCacheEvent
    summary: "A KV cache event as the publisher batches it: BlockStored (block hashes, parent hash, token ids, block size, medium, group, spec kind) or BlockRemoved (block hashes, medium, group); its identity is its hashed fields (BlockStored vllm/distributed/kv_events.py:56-113, BlockRemoved vllm/distributed/kv_events.py:116-134)."
    schema:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [BlockStored, BlockRemoved, AllBlocksCleared], examples: [BlockStored]}
        block_hashes: {type: array, items: {type: string}}
        parent_block_hash: {type: [string, "null"], default: null}
        token_ids: {type: array, items: {type: integer}}
        block_size: {type: integer}
        medium: {type: [string, "null"], default: null}
        group_idx: {type: [integer, "null"], default: null}

  - id: DistAll2AllResult
    summary: "What an MoE all-to-all step leaves on this rank: its token rows after the collective, the per-rank sizes used, the group and the manager."
    schema:
      type: object
      properties:
        num_tokens: {type: integer}
        sizes: {type: array, items: {type: integer}}
        comm_group: {type: string}
        manager: {type: string}
  - id: DistMooncakeStoreConfig
    summary: "MooncakeStoreConfig (vllm/distributed/mooncake_store.py:20-38)."
    schema:
      type: object
      properties:
        metadata_server: {type: string}
        master_server_address: {type: string}
        protocol: {type: string}
        device_name: {type: string}
        mode: {type: string, enum: [embedded, standalone-store]}
        global_segment_size: {type: integer}
        local_buffer_size: {type: integer}
        enable_offload: {type: boolean}
        tenant_id: {type: string}

  - id: DistKvRequest
    summary: "The fields of a vllm.v1.request.Request that KV connector hooks read."
    schema:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, examples: [chatcmpl-abc123]}
        prompt_token_ids: {type: array, items: {type: integer}}
        num_prompt_tokens: {type: integer, examples: [32]}
        num_computed_tokens: {type: integer, default: 0}
        num_external_tokens: {type: integer, default: 0}
        status: {type: string, enum: [WAITING, RUNNING, FINISHED_STOPPED, FINISHED_LENGTH_CAPPED, FINISHED_ABORTED], default: FINISHED_STOPPED}
        kv_transfer_params: {type: [object, "null"]}
        max_tokens: {type: [integer, "null"], default: null}
        block_ids: {type: array, items: {type: array, items: {type: integer}}}
        block_hashes: {type: [array, "null"], default: [], items: {type: string}}
  - id: DistKvMatch
    schema:
      type: object
      properties:
        num_external_tokens: {type: integer}
        load_async: {type: boolean}
        connector: {type: string}
  - id: DistKvFinished
    schema:
      type: object
      properties:
        delay_free_blocks: {type: boolean}
        kv_transfer_params: {type: [object, "null"]}

  - id: DistMoriioMessage
    schema:
      type: object
      properties:
        kind: {type: string, enum: [structured, string, binary], default: structured}
        type: {type: [string, "null"], examples: [remote_blocks]}
        transfer_id: {type: string, examples: [xfer-1]}
        block_notify_list: {type: array, items: {type: integer}}
        consumer_tp_size: {type: integer, default: 1}
        text: {type: string}

  - id: DistKvCacheSpec
    summary: "One KVCacheSpec as a plain object: `kind` names the dataclass (full_attention, mla_attention, sliding_window, circular_buffer, mamba, hisparse_hot, hisparse_resident, uniform_type, base); the other fields are the dataclass fields a behavior reads."
    schema:
      type: object
      required: [kind, block_size]
      properties:
        kind: {type: string, enum: [full_attention, mla_attention, sliding_window, circular_buffer, mamba, hisparse_hot, hisparse_resident, uniform_type, base], examples: [full_attention]}
        block_size: {type: integer, examples: [16]}
        num_kv_heads: {type: integer, examples: [8]}
        head_size: {type: integer, examples: [128]}
        head_size_v: {type: [integer, "null"], default: null}
        dtype: {type: string, examples: [bfloat16]}
        dcp_sharded: {type: [boolean, "null"], default: null}
        page_size_padded: {type: [integer, "null"], default: null}
        num_head_slots: {type: [integer, "null"], default: null}
        state_content_bytes: {type: [integer, "null"], default: null}
        tokens_per_state: {type: [integer, "null"], default: null}
        alignment: {type: [integer, "null"], default: null}
        sliding_window: {type: [integer, "null"], default: null}
        attention_chunk_size: {type: [integer, "null"], default: null}
        non_causal: {type: [boolean, "null"], default: null}
        cache_dtype_str: {type: [string, "null"], default: null}
        non_causal_multi_token_decode: {type: boolean, default: false}
        shapes: {type: array, items: {type: array, items: {type: integer}}}
        dtypes: {type: array, items: {type: string}}
        mamba_cache_mode: {type: string, default: none}
        page_size: {type: integer}
        specs: {type: object}
        blocks_per_request: {type: integer, description: "HiSparseHotSpec.blocks_per_request"}
        num_speculative_blocks: {type: integer, default: 0, description: "MambaSpec.num_speculative_blocks"}
        kv_quant_mode: {type: [string, "null"], default: null, description: "AttentionSpec.kv_quant_mode (None = KVQuantMode.NONE)"}


components:
  - id: parallel-state
    name: parallel_state (module)
    kind: module
    layer: distributed
    parent: gpu-worker
    summary: "Module-level process-group registry of one worker process: the world group, the TP/PP/DP/EP/DCP/PCP GroupCoordinators and the torch custom ops vllm::all_reduce/all_gather/reduce_scatter that look groups up by name."
    sources: ["vllm/distributed/parallel_state.py:1487-1490", "vllm/distributed/parallel_state.py:1585-1590"]
    state:
      schema:
        type: object
        properties:
          world_initialized: {type: boolean}
          mp_initialized: {type: boolean}
          world_size: {type: integer}
          rank: {type: integer, description: "this process's global torch.distributed rank; -1 = the instance's rank index"}
          backend: {type: string}
          custom_all_reduce_enabled: {type: boolean}
          groups: {type: object}
          destroyed_groups: {type: array, items: {type: string}}
      # The default world is a worker after startup: Worker.init_device already ran
      # init_worker_distributed_environment, so the groups exist and follow the deployed
      # config (tensor-parallel-size). Scenarios of a fresh process override the flags.
      initial: {world_initialized: true, mp_initialized: true, world_size: 0, rank: -1, backend: nccl, custom_all_reduce_enabled: true, groups: {pp: {world_size: 1, unique_name: "pp:0"}, dp: {world_size: 1, unique_name: "dp:0"}}, destroyed_groups: []}
  - id: tensor-model-parallel
    name: communication_op (tensor_model_parallel_* helpers)
    kind: module
    layer: distributed
    parent: gpu-worker
    summary: "The helpers model code calls (tensor_model_parallel_all_reduce/all_gather/reduce_scatter): each fetches the TP GroupCoordinator and delegates to it."
    sources: ["vllm/distributed/communication_op.py:12-28"]
  - id: group-coordinator
    name: GroupCoordinator
    kind: module
    layer: distributed
    parent: parallel-state
    summary: "Wrapper over one process group: bypasses collectives at world size 1, otherwise routes through the torch custom op (CUDA uses custom-op calls) to the device communicator."
    sources: ["vllm/distributed/parallel_state.py:426-454", "vllm/distributed/parallel_state.py:570-572"]
  - id: cuda-communicator
    name: CudaCommunicator
    kind: module
    layer: distributed
    parent: group-coordinator
    summary: "The CUDA device communicator of a group: picks the all-reduce backend per call (FlashInfer, NCCL symmetric memory, custom all-reduce, torch symmetric memory, PyNccl) and drives the collective on every rank of the group."
    sources: ["vllm/distributed/device_communicators/cuda_communicator.py:35-60"]
    state:
      schema:
        type: object
        properties:
          device_capability: {type: string}
          flashinfer_available: {type: boolean}
          platform: {type: string}
          fi_ar_max_mb: {type: object}
          symm_mem_max_mb: {type: object}
          nccl_symm_custom_ar_range_kb: {type: object}
      # ASSUMPTION: an H100 (sm 9.0) CUDA node with flashinfer-python installed (requirements/cuda.txt).
      initial:
        device_capability: "9.0"
        flashinfer_available: true
        platform: cuda
        fi_ar_max_mb: {"2": 64, "4": 2, "8": 0.5}
        symm_mem_max_mb: {"2": 64, "4": 32, "6": 64, "8": 64}
        nccl_symm_custom_ar_range_kb: {"4": [16, 512], "8": [16, 128]}
  - id: flashinfer-all-reduce
    name: FlashInferAllReduce
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "FlashInfer one-shot all-reduce (mnnvl backend on a single NVSwitch node); used for 2-D tensors up to a per-world-size workspace limit."
    sources: ["vllm/distributed/device_communicators/flashinfer_all_reduce.py:394-449"]
  - id: symm-mem-communicator
    name: SymmMemCommunicator
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "torch symmetric-memory all-reduce, used for bf16 tensors up to SYMM_MEM_ALL_REDUCE_MAX_SIZES[capability][world_size]."
    sources: ["vllm/distributed/device_communicators/symm_mem.py:25-115"]
  - id: pynccl
    name: pynccl (module)
    kind: module
    layer: distributed
    parent: cuda-communicator
    summary: "PyNccl module: registers the vllm::all_reduce_symmetric_with_copy op when NCCL symmetric memory is enabled."
    sources: ["vllm/distributed/device_communicators/pynccl.py:62-88"]
  - id: pynccl-communicator
    name: PyNcclCommunicator
    kind: module
    layer: distributed
    parent: pynccl
    summary: "ctypes NCCL communicator of a group: ncclAllReduce / ncclAllGather / ncclReduceScatter on the current stream; returns None when disabled."
    sources: ["vllm/distributed/device_communicators/pynccl.py:91-141"]
    state:
      schema: {type: object, properties: {disabled: {type: boolean}}}
      initial: {disabled: false}
  - id: torch-distributed
    name: torch.distributed (device group)
    kind: external
    layer: distributed
