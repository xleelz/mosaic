      - {interface: eplb-state.add-model, caller: gpu-worker, on: rank1, as: a1, input: {model: mistralai/Mixtral-8x7B-Instruct-v0.1, num_moe_layers: 1}}
      - {interface: eplb-state.step, caller: gpu-worker, on: rank0, as: p0, await: false, input: {is_profile: true}}
      - {interface: eplb-state.step, caller: gpu-worker, on: rank1, as: p1, input: {is_profile: true}}
    expect:
      - "steps.a0.result.value.communicator == 'NixlEplbCommunicator'"
      - "steps.p0.result.ok && steps.p1.result.ok && steps.p0.result.value.log == 'Rearranged experts  (profile)  in 0.00 s.'"
      - "!trace.exists(e, e.type == 'rendezvous' && e.key.startsWith('eplb-profile-'))"

  - id: distributed-eplb-group-missing
