  - id: distributed-all-reduce-one-slow-rank
    name: One rank arriving 40 ms late delays the collective on every rank
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    faults:
      - {target: group-coordinator.all-reduce, type: latency, latency_ms: 40, instance: rank2}
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
    expect:
      - "[steps.r0, steps.r1, steps.r2, steps.r3].all(st, st.result.ok && st.duration_ms >= 40)"
      - "trace.filter(e, e.type == 'rendezvous').size() == 4"
  - id: distributed-all-reduce-rank-failure
    name: A rank that fails before the collective leaves the others waiting until the process-group timeout
    flow: distributed-tp-all-reduce
    fixtures: [tp4-llama-70b]
    config: {distributed-timeout-seconds: 5}
    faults:
      - {target: group-coordinator.all-reduce, type: error, code: cuda-error, instance: rank3}
    steps:
      - {flow: distributed-tp-all-reduce, as: r0, on: rank0, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r1, on: rank1, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r2, on: rank2, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
      - {flow: distributed-tp-all-reduce, as: r3, on: rank3, at_ms: 0, await: false, input: {num_tokens: 64, hidden_size: 8192}}
    expect:
      - "[steps.r0, steps.r1, steps.r2].all(st, !st.result.ok && st.result.error.code == 'dist-backend-error' && st.duration_ms >= 5000)"
      - "!steps.r3.result.ok && steps.r3.result.error.code == 'cuda-error'"
