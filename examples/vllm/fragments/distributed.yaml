  # ---- the communicator factory
  - id: distributed-eplb-communicator-backends
    name: "create_eplb_communicator: classes per backend, NIXL unavailable, pynccl on CPU, an unknown backend, elastic EP's refusal and its pynccl promotion"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
