        then:
          - call: nixl-pull-connector-worker.get-kv-connector-stats
            as: st
          - return: "= vars.st.value"
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:440"
        return: null

  # ---------------------------------------------------------------- NIXL worker: registration, stats, compat hash
  - component: nixl-pull-connector-worker
    name: register-kv-caches
    kind: function
    summary: "NixlConnectorWorker.register_kv_caches (modeled part): record the cache layers registered with NIXL and compute the compatibility hash that peers compare during the handshake."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:1364-1395"]
    request: {type: object, required: [layer_names], properties: {layer_names: {type: array, items: {type: string}}, attn_backend_name: {type: string, default: FLASH_ATTN}}}
    response: {type: object, properties: {registered: {type: integer}, compat_hash: {type: string}}}
    behavior:
      - title: "compute_nixl_compatibility_hash(vllm_config, backend_name, transfer_mode='pull')"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:1391-1395"
        call: nixl-metadata.compute-nixl-compatibility-hash
        input: {attn_backend_name: "= input.attn_backend_name", transfer_mode: pull}
        fill: true
        as: h
      - set:
          state.registered_layers: "= input.layer_names"
      - return: {registered: "= size(input.layer_names)", compat_hash: "= vars.h.value.compat_hash"}

  - component: nixl-pull-connector-worker
    name: get-kv-connector-stats
    kind: function
    summary: "get_kv_connector_stats: when any counter is non-empty, hand back a copy of the stats and reset them (clone_and_reset); otherwise None."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3518-3523", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:76-90"]
    request: {type: object, properties: {}}
    response: {type: [object, "null"]}
    behavior:
      - if: "state.xfer_stats.all(k, size(state.xfer_stats[k]) == 0)"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3523"
            return: null
      - set:
          vars.out: "= state.xfer_stats"
          state.xfer_stats: "= state.xfer_stats.transformMapEntry(k, v, {k: []})"
      - return: "= vars.out"

  - component: nixl-metadata
    name: compute-nixl-compatibility-hash
    kind: function
    summary: "compute_nixl_compatibility_hash: SHA-256 of the sorted-key JSON of the factors that decide whether two NIXL instances can exchange KV: versions, model shape, attention backend, cache dtype, HMA, the hidden-state speculator's settings (EAGLE-family methods only; the draft kv_cache_dtype resolves to the target's; the draft attention backend is left out) and the transfer mode."
    sources:
      - "vllm/distributed/kv_transfer/kv_connector/v1/nixl/metadata.py:102-142"
      - "vllm/distributed/kv_transfer/kv_connector/v1/nixl/metadata.py:145-215"
      - "vllm/config/utils.py:397-399"
      - "vllm/config/speculative.py:1944-1948"
    request:
      type: object
      properties:
        model: {type: string, default: meta-llama/Llama-3.1-8B-Instruct}
        dtype: {type: string, default: torch.bfloat16}
        num_kv_heads: {type: integer, default: 8}
        head_size: {type: integer, default: 128}
        num_hidden_layers: {type: integer, default: 32}
        attn_backend_name: {type: string, default: FLASH_ATTN}
        cache_dtype: {type: string, default: auto}
        is_hma_enabled: {type: boolean, default: true}
        transfer_mode: {type: string, enum: [pull, push], default: pull}
        speculative_config:
          type: [object, "null"]
          default: null
          properties:
            method: {type: string}
            model: {type: string}
            revision: {type: [string, "null"], default: null}
            code_revision: {type: [string, "null"], default: null}
            parallel_drafting: {type: boolean, default: false}
            kv_cache_dtype: {type: [string, "null"], default: null}
            auxiliary_layer_ids: {type: [array, "null"], default: null}
            num_speculative_tokens: {type: integer, default: 1}
            attention_backend: {type: [string, "null"], default: null}
    response: {type: object, properties: {compat_hash: {type: string}, factors: {type: object}}}
    behavior:
      - set: {vars.sc: "= input.speculative_config"}
      - if: "vars.sc != null && vars.sc.method in ['eagle', 'eagle3', 'mtp', 'dflash', 'dspark']"
        then:
          - title: "Hidden-state speculators hash method, drafter, revisions, parallel drafting, the effective kv_cache_dtype and the aux layer ids (not num_speculative_tokens, not the attention backend)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/metadata.py:110-142"
            set:
              vars.spec: "= {'method': vars.sc.method, 'model': vars.sc.model, 'revision': has(vars.sc.revision) ? vars.sc.revision : null, 'code_revision': has(vars.sc.code_revision) ? vars.sc.code_revision : null, 'parallel_drafting': has(vars.sc.parallel_drafting) && vars.sc.parallel_drafting, 'kv_cache_dtype': has(vars.sc.kv_cache_dtype) && vars.sc.kv_cache_dtype != null ? vars.sc.kv_cache_dtype : input.cache_dtype, 'auxiliary_layer_ids': has(vars.sc.auxiliary_layer_ids) ? vars.sc.auxiliary_layer_ids : null}"
        else:
          - title: No speculator, or one that doesn't read the target's hidden states
            source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/metadata.py:106-108"
            set: {vars.spec: null}
      - source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/metadata.py:185-202"
        set:
          vars.factors:
            vllm_version: "0.32.0"
            nixl_connector_version: 14
            model: "= input.model"
            dtype: "= input.dtype"
            num_kv_heads: "= input.num_kv_heads"
            head_size: "= input.head_size"
            num_hidden_layers: "= input.num_hidden_layers"
            attn_backend_name: "= input.attn_backend_name"
            cache_dtype: "= input.cache_dtype"
            is_hma_enabled: "= input.is_hma_enabled"
            speculative_config: "= vars.spec"
            transfer_mode: "= input.transfer_mode"
      - title: "hash_factors: sha256 of json.dumps(factors, sort_keys=True)"
        source: "vllm/config/utils.py:397-399"
        return: {compat_hash: "= sha256(json(vars.factors))", factors: "= vars.factors"}

  # ---------------------------------------------------------------- admission hook
  - component: kv-connector-base-v1
    name: on-new-request
    kind: function
    summary: "Scheduler hook when a request is admitted (Scheduler.add_request). The base class does nothing; MoRIIO's producer with Mamba layers truncates a do_remote_decode prompt by one token (N-1 accounting). Returns the request fields the hook may have changed, for the scheduler to adopt."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/base.py:598-604"]
    attributes: {seam: true, callers: [scheduler-kv]}
    request: DistKvRequest
    response: {type: object, properties: {prompt_token_ids: {type: array}, num_prompt_tokens: {type: integer}, max_tokens: {type: [integer, "null"]}, kv_transfer_params: {type: [object, "null"]}, truncated: {type: boolean}}}
    behavior:
      - if: "config['kv-connector'] == 'MoRIIOConnector'"
        then:
          - call: moriio-connector-scheduler.on-new-request
            input: "= input"
            as: m
          - return: "= vars.m.value"
      - title: Base implementation (and the connectors this model does not implement here) is a no-op
        source: "vllm/distributed/kv_transfer/kv_connector/v1/base.py:604"
        return: {prompt_token_ids: "= input.prompt_token_ids", num_prompt_tokens: "= input.num_prompt_tokens", max_tokens: "= input.max_tokens", kv_transfer_params: "= input.kv_transfer_params", truncated: false}

  - component: moriio-connector-scheduler
    name: on-new-request
    kind: function
    summary: "MoRIIOConnectorScheduler.on_new_request: only a producer with Mamba layers acts, and only for a request with do_remote_decode, which it truncates for prefill."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:788-802"]
    request: DistKvRequest
    response: {type: object, properties: {prompt_token_ids: {type: array}, num_prompt_tokens: {type: integer}, max_tokens: {type: [integer, "null"]}, kv_transfer_params: {type: [object, "null"]}, truncated: {type: boolean}}}
    behavior:
      - if: "state.is_producer && state.has_mamba && input.kv_transfer_params != null && has(input.kv_transfer_params.do_remote_decode) && input.kv_transfer_params.do_remote_decode == true"
        then:
          - source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:798-802"
            call: moriio-connector-scheduler.truncate-mamba-request-for-prefill
            input: "= input"
            as: t
          - return: "= vars.t.value"
      - title: Not a hybrid producer, or not a prefill-for-remote-decode request
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:798-799"
        return: {prompt_token_ids: "= input.prompt_token_ids", num_prompt_tokens: "= input.num_prompt_tokens", max_tokens: "= input.max_tokens", kv_transfer_params: "= input.kv_transfer_params", truncated: false}

  - component: moriio-connector-scheduler
    name: truncate-mamba-request-for-prefill
    kind: function
    summary: "_truncate_mamba_request_for_prefill: drop the last prompt token so the prefiller computes h(N-1) (the decoder recomputes the last token), cap max_tokens at 1, and mark _p_side_truncated so a reschedule after preemption doesn't truncate again. A one-token prompt is left alone."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:804-829"]
    request: DistKvRequest
    response: {type: object, properties: {prompt_token_ids: {type: array}, num_prompt_tokens: {type: integer}, max_tokens: {type: [integer, "null"]}, kv_transfer_params: {type: [object, "null"]}, truncated: {type: boolean}}}
    behavior:
      - set:
          vars.p: "= input.kv_transfer_params"
          vars.same: {prompt_token_ids: "= input.prompt_token_ids", num_prompt_tokens: "= input.num_prompt_tokens", max_tokens: "= input.max_tokens", kv_transfer_params: "= input.kv_transfer_params", truncated: false}
      - if: "vars.p == null || ('_p_side_truncated' in vars.p && vars.p['_p_side_truncated'] == true) || input.num_prompt_tokens <= 1"
        then:
          - title: Already truncated (e.g. rescheduled after preemption), or nothing to drop
            source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:813-818"
            return: "= vars.same"
      - title: Pop the last prompt token (and from _all_token_ids), N-1 prompt tokens, max_tokens = 1, mark the params
        source: "vllm/distributed/kv_transfer/kv_connector/v1/moriio/moriio_connector.py:819-829"
        return:
          prompt_token_ids: "= input.prompt_token_ids.slice(0, size(input.prompt_token_ids) - 1)"
          num_prompt_tokens: "= input.num_prompt_tokens - 1"
          max_tokens: 1
          kv_transfer_params: "= merge(vars.p, {'_p_side_truncated': true})"
          truncated: true

  # ---------------------------------------------------------------- routed-experts capture buffer
  - component: routed-experts-buffer
    name: init
    kind: function
    summary: "RoutedExpertsBuffer.__init__: size the block pool for every in-flight batch's full blocks plus one tail per active request: max_concurrent_batches x (ceil(max_num_batched_tokens / block_size) + max_num_seqs) + max_num_seqs slots, all free."
    sources: ["vllm/distributed/aux_output_connector/routed_experts.py:29-51"]
    request:
      type: object
      required: [block_size, max_num_seqs, max_num_batched_tokens, max_concurrent_batches]
      properties:
        block_size: {type: integer, examples: [4]}
        max_num_seqs: {type: integer, examples: [1]}
        max_num_batched_tokens: {type: integer, examples: [8]}
        max_concurrent_batches: {type: integer, examples: [2]}
    response: {type: object, properties: {num_slots: {type: integer}}}
    behavior:
      - set:
          vars.n: "= input.max_concurrent_batches * ((input.max_num_batched_tokens + input.block_size - 1) / input.block_size + input.max_num_seqs) + input.max_num_seqs"
      - source: "vllm/distributed/aux_output_connector/routed_experts.py:48-51"
        set:
          state.block_size: "= input.block_size"
          state.num_slots: "= vars.n"
          state.free_slots: "= lists.range(vars.n)"
          state.requests: {}
          state.owned_slots: []
      - return: {num_slots: "= vars.n"}

  - component: routed-experts-buffer
    name: capture
    kind: function
    summary: "RoutedExpertsBuffer.capture: walk the rows from token_start; a full block-aligned run with no pending tail completes at once; other rows go into the request's tail slot (taken from the free pool on first use), which must continue exactly where it stopped; a tail that reaches block_size is handed back as a completed block. Returns the (block_start, rows) blocks completed by this call."
    sources: ["vllm/distributed/aux_output_connector/routed_experts.py:53-117"]
    request:
      type: object
      required: [request_id, token_start, rows]
      properties:
        request_id: {type: string, examples: [request]}
        token_start: {type: integer, examples: [0]}
        rows: {type: array, items: {type: array}, examples: [[[[0, 1], [2, 3], [4, 5]]]]}
    response: {type: array, items: {type: object, properties: {block_start: {type: integer}, rows: {type: array}}}}
    errors:
      - {code: value-error, status: 0, retryable: false}
      - {code: assertion-error, status: 0, retryable: false}
    behavior:
      - if: "input.token_start < 0"
        then:
          - source: "vllm/distributed/aux_output_connector/routed_experts.py:76-77"
            fail: {code: value-error, status: 0, message: "auxiliary output token start must be non-negative"}
      - set:
          vars.bs: "= state.block_size"
          vars.done: []
          vars.skip_to: 0
          vars.rid: "= input.request_id"
      - foreach: "= lists.range(size(input.rows))"
        as: off
        steps:
          - if: "vars.off < vars.skip_to"
            then:
              - continue: true
          - set:
              vars.pos: "= input.token_start + vars.off"
          - set:
              vars.bstart: "= vars.pos / vars.bs * vars.bs"
          - set:
              vars.local: "= vars.pos - vars.bstart"
          - if: "!(vars.rid in state.requests) && vars.local == 0 && size(input.rows) - vars.off >= vars.bs"
            then:
              - title: A full aligned input block needs no tail staging
                source: "vllm/distributed/aux_output_connector/routed_experts.py:87-95"
                set:
                  vars.done: "= vars.done + [{'block_start': vars.bstart, 'rows': input.rows.slice(vars.off, vars.off + vars.bs)}]"
                  vars.skip_to: "= vars.off + vars.bs"
              - continue: true
          - if: "!(vars.rid in state.requests)"
            then:
              - if: "size(state.free_slots) == 0"
                then:
                  - source: "vllm/distributed/aux_output_connector/routed_experts.py:63"
                    fail: {code: assertion-error, status: 0, message: "auxiliary output block pool is exhausted"}
              - title: "_tail: a new tail takes a free slot"
                source: "vllm/distributed/aux_output_connector/routed_experts.py:63-66"
                set:
                  state.requests: "= merge(state.requests, {vars.rid: {'slot': state.free_slots[size(state.free_slots) - 1], 'block_start': vars.bstart, 'length': 0, 'rows': []}})"
                  state.free_slots: "= state.free_slots.slice(0, size(state.free_slots) - 1)"
            else:
              - if: "state.requests[vars.rid].block_start != vars.bstart"
                then:
                  - source: "vllm/distributed/aux_output_connector/routed_experts.py:56-61"
                    fail: {code: assertion-error, status: 0, message: "= 'auxiliary output capture skipped an incomplete block: request=' + vars.rid + ', expected=' + string(state.requests[vars.rid].block_start) + ', actual=' + string(vars.bstart)"}
          - set: {vars.tail: "= state.requests[vars.rid]"}
          - if: "vars.local != vars.tail.length"
            then:
              - source: "vllm/distributed/aux_output_connector/routed_experts.py:96-101"
                fail: {code: assertion-error, status: 0, message: "= 'auxiliary output capture is not contiguous: request=' + vars.rid + ', expected=' + string(vars.bstart + vars.tail.length) + ', actual=' + string(vars.pos)"}
          - source: "vllm/distributed/aux_output_connector/routed_experts.py:102-110"
            set:
              vars.tail: "= {'slot': vars.tail.slot, 'block_start': vars.tail.block_start, 'length': vars.tail.length + 1, 'rows': vars.tail.rows + [input.rows[vars.off]]}"
          - if: "vars.tail.length == vars.bs"
            then:
              - title: A full tail is handed back; its slot stays owned by the returned block until released
                source: "vllm/distributed/aux_output_connector/routed_experts.py:111-115"
                set:
                  vars.done: "= vars.done + [{'block_start': vars.tail.block_start, 'rows': vars.tail.rows}]"
                  state.requests: "= omit(state.requests, vars.rid)"
                  state.owned_slots: "= state.owned_slots + [vars.tail.slot]"
            else:
              - set: {state.requests: "= merge(state.requests, {vars.rid: vars.tail})"}
      - return: "= vars.done"

  - component: routed-experts-buffer
    name: discard
    kind: function
    summary: "RoutedExpertsBuffer.discard: drop a request's incomplete tail and return its slot to the pool."
    sources: ["vllm/distributed/aux_output_connector/routed_experts.py:151-154"]
    request: {type: object, required: [request_id], properties: {request_id: {type: string, examples: [request]}}}
    response: {type: object, properties: {discarded: {type: boolean}}}
    behavior:
      - if: "!(input.request_id in state.requests)"
        then:
          - return: {discarded: false}
      - set:
          state.free_slots: "= state.free_slots + [state.requests[input.request_id].slot]"
          state.requests: "= omit(state.requests, input.request_id)"
      - return: {discarded: true}

  # ---------------------------------------------------------------- NIXL push: notification drain
  - component: nixl-push-connector-worker
    name: get-new-notifs
    kind: function
    summary: "NixlPushConnectorWorker._get_new_notifs on the engine main thread: drain the notifications the writer thread forwarded. 'HB:' heartbeats extend leases; '<req>:<tp>' completions finish a P-side send once every consumer rank reported it, or (D side) materialise a finished receive once every producer rank wrote; a notification for an unknown request is logged and counted as arriving after expiry."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:747-808", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3042-3062"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {notified: {type: array, items: {type: string}}}}
    behavior:
      - set: {vars.notified: []}
      - foreach: "= state.completion_notifs"
        as: n
        steps:
          - set:
              vars.msg: "= type(vars.n) == string ? vars.n : (vars.n.kind == 'HB' ? 'HB:' + vars.n.request_id : vars.n.request_id + ':' + string(has(vars.n.tp_size) ? vars.n.tp_size : 1))"
          - if: "vars.msg.startsWith('HB:')"
            then:
              - title: "_handle_heartbeat: extend each tracked lease to now + 2/3 of the lease duration"
                source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:3050-3054"
                set:
                  state.reqs_to_send: "= merge(state.reqs_to_send, vars.msg.substring(3).split(',').filter(r, r in state.reqs_to_send).transformMapEntry(i, r, {r: math.greatest(state.reqs_to_send[r], now + config['nixl-kv-lease-duration'] * 2 / 3 * 1000)}))"
              - continue: true
          - set:
              vars.cut: "= vars.msg.lastIndexOf(':')"
          - set:
              vars.rid: "= vars.msg.substring(0, vars.cut)"
              vars.tp: "= int(vars.msg.substring(vars.cut + 1))"
          - if: "!(vars.rid in state.reqs_to_send) && !(vars.rid in state.reqs_to_process)"
            then:
              - if: "vars.rid in state.recving_metadata"
                then:
                  - set:
                      vars.expected: "= state.recving_metadata[vars.rid].pp_size * math.greatest(1, vars.tp / state.world_size)"
                      vars.count: "= (vars.rid in state.consumer_notification_counts ? state.consumer_notification_counts[vars.rid] : 0) + 1"
                  - if: "vars.count < vars.expected"
                    then:
                      - set: {state.consumer_notification_counts: "= merge(state.consumer_notification_counts, {vars.rid: vars.count})"}
                      - continue: true
                  - title: "D side: every producer rank wrote; materialise an empty transfer entry so the receive reports done"
                    source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:771-785"
                    set:
                      state.consumer_notification_counts: "= omit(state.consumer_notification_counts, vars.rid)"
                      state.recving_transfers: "= merge(state.recving_transfers, {vars.rid: []})"
                else:
                  - title: Not tracked on either side (the lease may have expired); log and skip
                    source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:786-794"
                    set:
                      state.xfer_stats: "= merge(state.xfer_stats, {'num_notifications_after_expiry': state.xfer_stats.num_notifications_after_expiry + [1]})"
              - continue: true
          - set:
              vars.cpp: "= vars.tp > state.world_size ? vars.tp / state.world_size : 1"
              vars.count: "= (vars.rid in state.consumer_notification_counts ? state.consumer_notification_counts[vars.rid] : 0) + 1"
          - if: "vars.count == vars.cpp"
            then:
              - title: "P side: every consumer rank read; the send is done"
                source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:796-808"
                set:
                  vars.notified: "= vars.notified + [vars.rid]"
                  state.consumer_notification_counts: "= omit(state.consumer_notification_counts, vars.rid)"
                  state.reqs_to_process: "= state.reqs_to_process.filter(r, r != vars.rid)"
                  state.reqs_to_send: "= omit(state.reqs_to_send, vars.rid)"
            else:
              - set: {state.consumer_notification_counts: "= merge(state.consumer_notification_counts, {vars.rid: vars.count})"}
      - set: {state.completion_notifs: []}
      - return: {notified: "= vars.notified"}

  - component: nixl-push-connector-worker
    name: get-transfer-results
    kind: function
    summary: "NixlPushConnectorWorker.get_transfer_results (modeled part): drain the forwarded notifications (sends whose consumers all reported become done sending), report the receives the producers finished writing as done receiving, and hand every finished send to the writer thread for eviction."
    sources: ["vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:810-849", "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:2853-2861"]
    request: {type: object, properties: {}}
    response: {type: object, properties: {finished_sending: {type: array}, finished_recving: {type: array}}}
    behavior:
      - title: "super().get_transfer_results(): _get_new_notifs gives the finished sends"
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/base_worker.py:2859-2861"
        call: nixl-push-connector-worker.get-new-notifs
        as: nn
      - set:
          vars.recv: "= state.recving_transfers.filter(r, size(state.recving_transfers[r]) == 0)"
      - title: Empty transfer lists are done receiving; finished sends go to the writer's eviction inbox
        source: "vllm/distributed/kv_transfer/kv_connector/v1/nixl/push_worker.py:844-847"
        set:
          state.recving_transfers: "= omit(state.recving_transfers, vars.recv)"
          state.evict_inbox: "= state.evict_inbox + vars.nn.value.notified"
      - return: {finished_sending: "= vars.nn.value.notified", finished_recving: "= vars.recv"}

  # ---------------------------------------------------------------- Mooncake transfer descriptors
  - component: mooncake-connector-worker
    name: build-transfer-params
    kind: function
    summary: "MooncakeConnectorWorker._build_transfer_params for one aligned region pair: per ready request, pair the local and remote block ids group by group (Mamba null blocks dropped; a partial prefix hit sends only the last n_remote local blocks; fewer local than remote blocks is an error), split them into runs contiguous on both sides, and emit one (src, dst, length) per run when the per-block copy is the whole block on both sides, else one per block."
    sources:
      - "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1744-1935"
      - "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:291-304"
      - "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:236-250"
      - "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2822-2834"
    request:
      type: object
      required: [ready_reqs, req_blocks, local_region, remote_region]
      properties:
        ready_reqs: {type: array, items: {type: object, properties: {d_req_id: {type: string}, local_block_ids: {type: array, items: {type: array, items: {type: integer}}}}}}
        req_blocks: {type: object}
        local_region: {type: object, properties: {base_addr: {type: integer}, block_len: {type: integer}, kv_block_len: {type: integer}}}
        remote_region: {type: object, properties: {base_addr: {type: integer}, block_len: {type: integer}, kv_block_len: {type: integer}}}
        group_is_mamba: {type: array, items: {type: boolean}, default: [false]}
    response: {type: object, properties: {src: {type: array}, dst: {type: array}, lengths: {type: array}, err_reqs: {type: array}, err_msg: {type: [string, "null"]}}}
    behavior:
      - set:
          vars.src: []
          vars.dst: []
          vars.lens: []
          vars.err_reqs: []
          vars.err_msg: null
          vars.L: "= input.local_region"
          vars.R: "= input.remote_region"
      - foreach: "= input.ready_reqs"
        as: rq
        steps:
          - set: {vars.remote: "= vars.rq.d_req_id in input.req_blocks ? input.req_blocks[vars.rq.d_req_id] : []"}
          - if: "size(vars.remote) == 0 || vars.remote.all(g, size(g) == 0)"
            then:
              - continue: true
          - if: "size(vars.rq.local_block_ids) != size(vars.remote)"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1764-1774"
                set:
                  vars.err_reqs: "= vars.err_reqs + [vars.rq.d_req_id]"
                  vars.err_msg: "= vars.err_msg == null ? 'KV group count mismatch' : vars.err_msg"
              - continue: true
          - title: "Mamba groups drop null-block placeholders (block id 0) on both sides"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1785-1806"
            set:
              vars.lg: "= lists.range(size(vars.remote)).map(i, size(input.group_is_mamba) > i && input.group_is_mamba[i] ? vars.rq.local_block_ids[i].filter(b, b != 0) : vars.rq.local_block_ids[i])"
              vars.rg: "= lists.range(size(vars.remote)).map(i, size(input.group_is_mamba) > i && input.group_is_mamba[i] ? vars.remote[i].filter(b, b != 0) : vars.remote[i])"
          - if: "lists.range(size(vars.rg)).exists(i, size(vars.lg[i]) < size(vars.rg[i]))"
            then:
              - source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1808-1840"
                set:
                  vars.err_reqs: "= vars.err_reqs + [vars.rq.d_req_id]"
                  vars.err_msg: "= vars.err_msg == null ? 'P num blocks less than D' : vars.err_msg"
              - continue: true
          - title: "A partial prefix hit reads only the uncomputed blocks: the last n_remote local ones"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1817-1819"
            set:
              vars.lg: "= lists.range(size(vars.rg)).map(i, size(vars.rg[i]) > 0 ? vars.lg[i].slice(size(vars.lg[i]) - size(vars.rg[i]), size(vars.lg[i])) : [])"
          - if: "vars.lg.all(g, size(g) == 0)"
            then:
              - continue: true
          - set:
              vars.l: "= vars.lg[0]"
              vars.r: "= vars.rg[0]"
          - title: "group_concurrent_contiguous: a run breaks wherever either side's next id is not +1"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:2822-2834"
            set:
              vars.starts: "= lists.range(size(vars.l)).filter(i, i == 0 || vars.l[i] - vars.l[i - 1] != 1 || vars.r[i] - vars.r[i - 1] != 1)"
          - set:
              vars.ends: "= lists.range(size(vars.starts)).map(k, k + 1 < size(vars.starts) ? vars.starts[k + 1] : size(vars.l))"
          - title: "Same TP size: copy the whole local KV block from offset 0 (_compute_sender_transfer_plan, tp_ratio 1)"
            source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:249-250"
            set:
              vars.tlen: "= vars.L.kv_block_len"
          - set:
              vars.coalesce: "= vars.tlen == vars.L.block_len && vars.tlen == vars.R.block_len"
          - if: "vars.coalesce"
            then:
              - title: One descriptor per contiguous run
                source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1903-1914"
                set:
                  vars.src: "= vars.src + vars.starts.map(st, vars.L.base_addr + vars.l[st] * vars.L.block_len)"
                  vars.dst: "= vars.dst + vars.starts.map(st, vars.R.base_addr + vars.r[st] * vars.R.block_len)"
                  vars.lens: "= vars.lens + lists.range(size(vars.starts)).map(k, vars.tlen * (vars.ends[k] - vars.starts[k]))"
            else:
              - title: One descriptor per block
                source: "vllm/distributed/kv_transfer/kv_connector/v1/mooncake/mooncake_connector.py:1915-1929"
                set:
                  vars.src: "= vars.src + vars.l.map(b, vars.L.base_addr + b * vars.L.block_len)"
                  vars.dst: "= vars.dst + vars.r.map(b, vars.R.base_addr + b * vars.R.block_len)"
                  vars.lens: "= vars.lens + vars.l.map(b, vars.tlen)"
      - return: {src: "= vars.src", dst: "= vars.dst", lengths: "= vars.lens", err_reqs: "= vars.err_reqs", err_msg: "= vars.err_msg"}


