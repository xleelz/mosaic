  - component: single-writer-shm-ring-buffer
    name: allocate-buf
    kind: function
    summary: "SingleWriterShmRingBuffer.allocate_buf: writer only; reserve 8 metadata bytes + size, wrapping to the next lap when the tail lacks contiguous room; MemoryError when the ring would overrun its start."
    sources: ["vllm/distributed/device_communicators/shm_object_storage.py:218-266"]
    request: {type: object, required: [name, size], properties: {name: {type: string}, size: {type: integer, examples: [100]}, is_writer: {type: boolean, default: true}}}
    response: {type: object, properties: {address: {type: integer}, monotonic_id: {type: integer}}}
    errors:
