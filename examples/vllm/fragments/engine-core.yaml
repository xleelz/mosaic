- component: executor
  name: sleep
  kind: function
  summary: 'Executor.sleep: no-op when the weights already sleep; else collective_rpc(''sleep'', level) and mark weights and kv_cache as sleeping.'
  sources:
  - vllm/v1/executor/abstract.py:382-392
  request:
    type: object
    properties:
      level:
        type: integer
        default: 1
  behavior:
  - if: '''weights'' in state.sleeping_tags'
    then:
    - title: Executor is already sleeping
      source: vllm/v1/executor/abstract.py:383-385
      return:
        slept: false
  - call: executor.collective-rpc
    input:
      method: sleep
      args:
        level: = input.level
  - title: 'sleeping_tags |= SLEEP_TAGS: a union with the current set'
    source: vllm/v1/executor/abstract.py:389
    set:
      state.sleeping_tags: = state.sleeping_tags + ['weights', 'kv_cache'].filter(t, !(t in state.sleeping_tags))
  - return:
      slept: true
- component: executor
  name: wake-up
  kind: function
  summary: 'Executor.wake_up: no-op when awake or a tag isn''t sleeping; else collective_rpc(''wake_up'', tags) and clear those tags (all when tags is None).'
  sources:
  - vllm/v1/executor/abstract.py:394-417
  request:
    type: object
    properties:
      tags:
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
  behavior:
  - if: size(state.sleeping_tags) == 0
    then:
    - title: Executor is not sleeping
      source: vllm/v1/executor/abstract.py:395-397
      return:
        woke: false
  - set:
      vars.tags: '= has(input.tags) && input.tags != null ? input.tags : null'
  - if: vars.tags != null && vars.tags.exists(t, !(t in state.sleeping_tags))
    then:
    - title: 'A tag that isn''t sleeping: warn and return'
      source: vllm/v1/executor/abstract.py:398-405
      return:
        woke: false
  - call: executor.collective-rpc
    input:
      method: wake_up
      args: '= vars.tags == null ? {} : {''tags'': vars.tags}'
  - set:
      state.sleeping_tags: '= vars.tags == null ? [] : state.sleeping_tags.filter(t, !(t in vars.tags))'
  - return:
      woke: true
- component: executor
  name: discard
  kind: function
  summary: 'Executor.discard: discard the not-yet-sleeping tags'' memory on the workers and count them as sleeping.'
  sources:
  - vllm/v1/executor/abstract.py:419-434
  request:
    type: object
    properties:
      tags:
        type: array
        items:
          type: string
  behavior:
  - set:
      vars.todo: = input.tags.filter(t, !(t in state.sleeping_tags))
  - if: size(vars.todo) == 0
    then:
    - return:
        discarded: []
  - call: executor.collective-rpc
    input:
      method: discard
      args:
        tags: = vars.todo
  - title: 'sleeping_tags |= tags_to_discard, in a finally: a union with the current set'
    source: vllm/v1/executor/abstract.py:425-428
    set:
      state.sleeping_tags: = state.sleeping_tags + input.tags.filter(t, !(t in state.sleeping_tags))
  - return:
      discarded: = vars.todo
