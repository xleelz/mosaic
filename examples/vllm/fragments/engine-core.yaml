- component: engine-core
  name: preprocess-add-request
  kind: function
  latency_ms: 0
  summary: 'EngineCore.preprocess_add_request (input thread): refresh multimodal features from the receiver cache, build the Request, start grammar compilation for structured output.'
  sources:
  - vllm/v1/engine/core.py:1089-1111
  request: EngineCoreClientRequest
  response: EngineCoreClientRequest
  behavior:
  - if: has(input.mm_features) && input.mm_features != null && size(input.mm_features) > 0
    then:
    - title: 'mm_receiver_cache.get_and_update_features: store the items P0 sent, fill the ones it left out from the P1 cache (a miss raises MultiModalCacheMissError)'
      source: vllm/v1/engine/core.py:1095-1101
