      sampling_params:
        n: 2
        max_tokens: 4
      chunks:
      - prompt_token_ids:
        - 128000
        - 9906
  - interface: async-llm.add-streaming-input-request
    caller: api-server
    as: stop
    input:
      request_id: s1
      sampling_params:
        max_tokens: 4
        stop:
        - .
      chunks:
