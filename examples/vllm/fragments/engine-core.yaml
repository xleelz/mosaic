schemas:
- id: EngineCoreOutput
  summary: 'One request''s slice of an engine step (vllm/v1/engine/__init__.py EngineCoreOutput): the new token ids and, when it finished, why.'
  schema:
    type: object
    required:
    - request_id
    - new_token_ids
    properties:
      request_id:
        type: string
        examples:
        - chatcmpl-abc123-00000001
      new_token_ids:
        type: array
        items:
          type: integer
        examples:
        - - 9906
      finish_reason:
        type:
        - string
        - 'null'
        enum:
        - stop
        - length
        - abort
        - error
        - repetition
        - null
        description: FinishReason; null while the request is still running
      stop_reason:
        type:
        - string
        - integer
        - 'null'
        description: the stop string, or the stop token id (int | str | None)
- id: EngineCoreOutputs
  summary: 'What the engine core sends a client per step or event (vllm/v1/engine/__init__.py EngineCoreOutputs): outputs, stats, a utility reply or a wave notice.'
  schema:
    type: object
    properties:
      engine_index:
        type: integer
        default: 0
      outputs:
        type: array
        items:
          $ref: EngineCoreOutput
        default: []
      scheduler_stats:
        type:
        - object
        - 'null'
      timestamp:
        type: number
      utility_output:
        type:
        - object
        - 'null'
      finished_requests:
        type: array
        items:
          type: string
        default: []
      weight_version:
        type: string
- id: EngineCoreClientRequest
  summary: 'What the API server hands the engine client: the EngineCoreRequest plus the request fields InputProcessor and the client fill in (vllm/v1/engine/__init__.py EngineCoreRequest, vllm/sampling_params.py).'
  schema:
    type: object
    required:
    - request_id
    - prompt_token_ids
    - sampling_params
    properties:
      request_id:
        type: string
        examples:
        - chatcmpl-abc123
      prompt_token_ids:
        type: array
        items:
          type: integer
        examples:
        - - 128000
          - 9906
          - 1917
      arrival_time:
        type: number
      priority:
        type: integer
        examples:
        - 0
      external_req_id:
        type:
        - string
        - 'null'
        default: null
        description: set by assign_request_id; callers leave it unset
      data_parallel_rank:
        type:
        - integer
        - 'null'
        default: null
      pooling_params:
        type:
        - object
        - 'null'
        default: null
      abort_immediately:
        type: boolean
        default: false
      client_index:
        type: integer
        default: 0
      lora_request:
        type:
        - object
        - 'null'
        default: null
        description: LoRARequest {lora_name, lora_int_id, lora_path}
        properties:
          lora_name:
            type: string
          lora_int_id:
            type: integer
          lora_path:
            type: string
      cache_salt:
        type:
        - string
        - 'null'
        default: null
        description: 'the prompt''s cache_salt: an extra key of the first block hash'
      mm_features:
        type:
        - array
        - 'null'
        default: null
        description: MultiModalFeatureSpec items {mm_hash, data}; data is null when P0's sender cache says P1 already holds it
        items:
          type: object
          properties:
            mm_hash:
              type: string
            data: {}
      sampling_params:
        type: object
        properties:
          temperature:
            type: number
            default: 1.0
            examples:
            - 0.0
          top_p:
            type: number
            default: 1.0
            examples:
            - 1.0
          max_tokens:
            type:
            - integer
            - 'null'
            default: null
            examples:
            - 16
            description: null means up to max_model_len minus the prompt
          stop:
            type: array
            items:
              type: string
            default: []
          n:
            type: integer
            default: 1
            examples:
            - 1
          seed:
            type: integer
          ignore_eos:
            type: boolean
            default: false
          output_kind:
            type: string
            enum:
            - cumulative
            - delta
            - final_only
            - CUMULATIVE
            - DELTA
            - FINAL_ONLY
            default: cumulative
          min_tokens:
            type: integer
            default: 0
          stop_token_ids:
            type: array
            items:
              type: integer
            default: []
          include_stop_str_in_output:
            type: boolean
            default: false
          structured_outputs:
            type:
            - object
            - 'null'
            default: null
            properties:
              regex:
                type: string
              json: {}
              choice:
                type: array
                items:
                  type: string
              grammar:
                type: string
              json_object:
                type:
                - boolean
                - 'null'
              structural_tag:
                type:
                - string
                - 'null'
              _backend:
                type:
                - string
                - 'null'
                description: the backend auto resolved to
          logprobs:
            type:
            - integer
            - 'null'
            default: null
            description: number of sample logprobs per token (-1 = the vocab)
          skip_special_tokens:
            type: boolean
            default: true
          eos_token_id:
            type:
            - integer
            - 'null'
            default: null
          watermarking:
            type:
            - boolean
            - 'null'
            default: null
            description: per-request watermark switch; null follows the engine's watermark_config
          extra_args:
            type:
            - object
            - 'null'
            default: null
- id: EngineCoreRequestOutput
  summary: 'The RequestOutput the output processor produces: its request_id is the external id, and it carries one completion per sampled sequence (DELTA: the new tokens; CUMULATIVE and FINAL_ONLY: all
    tokens so far).'
  schema:
    type: object
    properties:
      request_id:
        type: string
      kind:
        type: string
        enum:
        - delta
        - cumulative
        - final_only
        default: cumulative
      completions:
        type: array
        items:
          type: object
          properties:
            index:
              type: integer
            token_ids:
              type: array
              items:
                type: integer
            text:
              type: string
            finish_reason:
              type:
              - string
              - 'null'
            stop_reason:
              type:
              - string
              - integer
              - 'null'
      text:
        type: string
      token_ids:
        type: array
        items:
          type: integer
      finish_reason:
        type:
        - string
        - 'null'
      stop_reason:
        type:
        - string
        - integer
        - 'null'
      finished:
        type: boolean
      num_cached_tokens:
        type: integer
        default: 0
        description: prefix-cache hits of the prompt, recorded from the first EngineCoreOutput
- id: EngineCoreGenerateResult
  summary: 'What a generate() consumer has seen when the stream ends: every RequestOutput, and the final finish reason.'
  schema:
    type: object
    properties:
      request_id:
        type: string
      finished:
        type: boolean
      finish_reason:
        type:
        - string
        - 'null'
      num_outputs:
        type: integer
      token_ids:
        type: array
        items:
          type: integer
      text:
        type: string
- id: EngineCoreUtilityCall
  summary: 'A UTILITY message: (client_index, call_id, method_name, args) sent by the client to EngineCoreProc.'
  schema:
    type: object
    required:
    - method
    properties:
      method:
        type: string
        examples:
        - is_sleeping
      engine:
        type:
        - string
        - 'null'
        default: null
        description: a DP engine instance (dp0, dp1, ...); null = the client's core engine
      args:
        type: object
        default: {}
      client_index:
        type: integer
        default: 0
- id: EngineCoreUtilityResult
  summary: 'UtilityOutput: the method''s result, or the failure message the client turns into an Exception.'
  schema:
    type: object
    properties:
      result: {}
      failure_message:
        type:
        - string
        - 'null'
components:
- id: async-llm
  name: AsyncLLM
  kind: module
  parent: engine-core
  layer: frontend
  summary: 'The asyncio engine client the OpenAI server uses: generate/encode, abort, admin utilities, and the background output_handler task (vllm.AsyncLLMEngine).'
  description: Runs in the API server process; it is modeled under the engine-core module because its code lives in vllm/v1/engine (the area's module).
  sources:
  - vllm/v1/engine/async_llm.py:84-226
  state:
    schema:
      type: object
      properties:
        output_handler_running:
          type: boolean
        output_handler_done:
          type: boolean
        profile_session_active:
          type: boolean
        supported_tasks:
          type:
          - array
          - 'null'
        data_parallel_size:
          type: integer
        scaling_elastic_ep:
          type: boolean
    initial:
      output_handler_running: false
      output_handler_done: false
      profile_session_active: false
      supported_tasks: null
      scaling_elastic_ep: false
- id: llm-engine
  name: LLMEngine
  kind: module
  capacity:
    concurrency: 1
  parent: engine-core
  layer: frontend
  summary: 'The synchronous engine the offline LLM class drives: add_request, then step() until no request is unfinished (vllm.LLMEngine).'
  sources:
  - vllm/v1/engine/llm_engine.py:54-155
  state:
    schema:
      type: object
      properties:
        should_execute_dummy_batch:
          type: boolean
        profile_session_active:
          type: boolean
        log_stats:
          type: boolean
    initial:
      should_execute_dummy_batch: false
      profile_session_active: false
      log_stats: true
- id: input-processor
  name: InputProcessor
  kind: module
  parent: engine-core
  layer: frontend
  summary: Validates params and prompt length and builds the EngineCoreRequest; assign_request_id makes the internal id unique.
  sources:
  - vllm/v1/engine/input_processor.py:41-86
  state:
    schema:
      type: object
      properties:
        request_seq:
          type: integer
    initial:
      request_seq: 0
- id: output-processor
  name: OutputProcessor
  kind: module
  parent: engine-core
  layer: frontend
  summary: 'Turns EngineCoreOutputs into RequestOutputs: per-request frontend state (detokenizer, prompt length, prefill flag), stop strings, aborts and finishing.'
  description: 'request_states is the frontend''s own per-request bookkeeping (output_processor.py:519), not the scheduler''s request state: it holds the detokenized text and the stream queue, and is dropped
    when the request finishes.'
  sources:
  - vllm/v1/engine/output_processor.py:504-525
  state:
    schema:
      type: object
      properties:
        request_states:
          type: object
        external_req_ids:
          type: object
        parent_requests:
          type: object
    initial:
      request_states: {}
      external_req_ids: {}
      parent_requests: {}
- id: request-output-collector
  name: RequestOutputCollector
  kind: queue
  parent: engine-core
  layer: frontend
  summary: 'The per-request hand-off between the output_handler task and the generate() task: put merges deltas, get returns them or raises a queued exception.'
  sources:
  - vllm/v1/engine/output_processor.py:53-114
  state:
    schema:
      type: object
      properties:
        queues:
          type: object
    initial:
      queues: {}
- id: incremental-detokenizer
  name: IncrementalDetokenizer
  kind: module
  parent: engine-core
  layer: frontend
  summary: Detokenizes new token ids incrementally and checks stop strings (BaseIncrementalDetokenizer.update, check_stop_strings).
  sources:
  - vllm/v1/engine/detokenizer.py:69-178
- id: async-mp-client
  name: AsyncMPClient
  kind: module
  parent: engine-core
  layer: frontend
  summary: 'The asyncio ZMQ client of the engine-core process: sends ADD/ABORT/UTILITY, receives EngineCoreOutputs in process_outputs_socket; BackgroundResources.engine_dead marks the engine dead.'
  sources:
  - vllm/v1/engine/core_client.py:1106-1148
  - vllm/v1/engine/core_client.py:487-575
  state:
    schema:
      type: object
      properties:
        engine_dead:
          type: boolean
        engine_status:
          type: object
        kv_event_sources:
          type: object
    initial:
      engine_dead: false
      engine_status: {}
      kv_event_sources: {}
- id: dp-lb-async-mp-client
  name: DPLBAsyncMPClient
  kind: module
  parent: engine-core
  layer: frontend
  summary: 'The asyncio client for data_parallel_size > 1: one ZMQ identity per engine-core process (instances dp0, dp1, ... of engine-core-proc), least-loaded routing of each ADD, aborts routed to the
    request''s engine, and utilities fanned out to every engine.'
  sources:
  - vllm/v1/engine/core_client.py:1603-1641
  - vllm/v1/engine/core_client.py:1419-1464
