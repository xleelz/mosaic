- component: scheduler
  name: add-request
  kind: function
  summary: Queue a new Request as WAITING (owner scheduler-kv).
  sources:
  - vllm/v1/core/sched/scheduler.py:2616
  attributes:
    boundary: true
    owner: scheduler-kv
  request:
    type: object
    required:
    - request_id
    properties:
      request_id:
        type: string
        examples:
        - chatcmpl-abc123
      prompt_token_ids:
        type: array
        items:
          type: integer
        examples:
        - - 128000
          - 9906
          - 1917
          - 13
          - 3639
          - 374
          - 279
          - 6864
          - 315
          - 9822
          - 30
      prompt_segments:
        type: array
        default: []
        description: 'Modeling device for long prompts: consecutive token runs named by content key (equal keys = equal tokens). Replaces prompt_token_ids when non-empty.'
        items:
          type: object
          required:
          - key
          - num_tokens
          properties:
            key:
              type: string
            num_tokens:
              type: integer
      sampling_params:
        type: object
        properties:
          max_tokens:
            type: integer
            examples:
            - 16
          min_tokens:
            type: integer
            examples:
            - 0
          temperature:
            type: number
            examples:
            - 0.0
          eos_token_id:
            type: integer
            examples:
            - 128009
          stop_token_ids:
            type: array
            items:
              type: integer
            examples:
            - - 128001
              - 128008
          ignore_eos:
            type: boolean
            examples:
            - false
      arrival_time:
        type:
        - number
        - 'null'
        default: null
        description: Engine arrival time; null means now.
      priority:
        type: integer
        examples:
        - 0
      grammar_id:
        type:
        - string
        - 'null'
        default: null
        description: Set when the request uses structured output (its compiled grammar).
      client_index:
        type: integer
        examples:
        - 0
  response:
    type: object
    properties:
      request_id:
        type: string
