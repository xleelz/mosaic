flows:
- id: dp-engine-core-busy-loop
  name: DP engine-core busy loop
  description: 'DPEngineCoreProc.run_busy_loop on one DP rank: each pass processes input, steps, runs a dummy batch when the wave is live but nothing ran, and all-reduces the unfinished flag to end or continue
    the wave.'
  tags:
  - writes
  - feature:data-parallel
  sources:
  - vllm/v1/engine/core.py:2327-2409
  entry:
    caller: engine-core
    interface: dp-engine-core-proc.run-busy-loop
    input:
      dp_rank: 0
    repeat:
      count: 2
      interval_ms: 1
- id: dp-client-stats-update-task
  name: DP client stats update task
  description: 'DPAsyncMPClient''s stats task: each pass handles one coordinator message (FIRST_REQ, SCALE_ELASTIC_EP or a stats publish).'
  tags:
  - writes
  - feature:data-parallel
  sources:
  - vllm/v1/engine/core_client.py:1474-1576
  entry:
    caller: api-server
    interface: dp-lb-async-mp-client.run-engine-stats-update-task
    input:
      stats:
        counts:
        - - 1
          - 0
        - - 0
          - 2
        wave: 1
        running: true
    repeat:
      count: 2
      interval_ms: 1
- id: ray-v2-worker-monitor
  name: Ray V2 worker monitor
  description: 'The RayWorkerMonitor thread: polls the workers'' run refs until shutdown; a dead worker fails the executor and notifies the engine core.'
  sources:
  - vllm/v1/executor/ray_executor_v2.py:502-535
  entry:
    caller: engine-core
    interface: ray-executor-v2.monitor-workers
    input:
      max_polls: 120
- id: engine-startup
  name: Engine startup (AsyncLLM.from_engine_args)
  description: 'The API server builds AsyncLLM: executor class, stat-logger plugins, the engine-core process (executor, worker model load, memory profiling, KV cache sizing, warm-up), the READY handshake,
    then the busy loop starts.'
  tags:
  - writes
  sources:
  - vllm/v1/engine/async_llm.py:269-291
  - vllm/v1/engine/core.py:1391-1529
  entry:
    caller: api-server
    interface: async-llm.from-engine-args
    input:
      model: meta-llama/Llama-3.1-8B-Instruct
      served_model_name: llama-8b
- id: engine-core-busy-loop
  name: Engine-core busy loop
  description: 'EngineCoreProc.run_busy_loop under fault_tolerant_wrapper: each iteration handles shutdown, drains the input queue, and steps (schedule -> execute_model on the ranks -> update_from_output
    -> outputs to the client); it re-schedules itself.'
  tags:
  - writes
  sources:
  - vllm/v1/engine/core.py:1547-1558
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:176-194
  entry:
    caller: engine-core
    interface: engine-core-proc.run-busy-loop
    input:
      iterations: 40
- id: async-llm-generate
  name: AsyncLLM.generate
  description: 'One request from the API server: validate, admit, register, ADD over ZMQ, then stream RequestOutputs the output handler puts into the request''s collector.'
  tags:
  - writes
  sources:
  - vllm/v1/engine/async_llm.py:698-823
  entry:
    caller: api-server
    interface: async-llm.generate
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      sampling_params:
        max_tokens: 4
        n: 1
        temperature: 0.0
        stop: []
      priority: 0
- id: async-llm-abort
  name: AsyncLLM.abort
  description: 'Abort by request id: final ABORT output to the stream, ABORT to the engine core (aborts queue and input queue).'
  tags:
  - writes
  sources:
  - vllm/v1/engine/async_llm.py:911-922
  entry:
    caller: api-server
    interface: async-llm.abort
    input:
      request_ids:
      - chatcmpl-abc123
      internal: false
- id: llm-engine-add-request
  name: LLMEngine.add_request
  description: 'The offline path: process inputs, register without a queue, ADD over the SyncMPClient.'
  tags:
  - writes
  - feature:offline-llm
  sources:
  - vllm/v1/engine/llm_engine.py:229-317
  entry:
    caller: python-user
    interface: llm-engine.add-request
    input:
      request_id: '0'
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      sampling_params:
        max_tokens: 4
        n: 1
- id: llm-engine-step
  name: LLMEngine.step
  description: Block for the next EngineCoreOutputs from the SyncMPClient and turn them into RequestOutputs.
  tags:
  - feature:offline-llm
  sources:
  - vllm/v1/engine/llm_engine.py:319-366
  entry:
    caller: python-user
    interface: llm-engine.step
- id: async-llm-sleep
  name: Sleep and wake up
  description: 'AsyncLLM.sleep: pause the scheduler, then offload weights / discard the KV cache on the workers; wake_up reverses it.'
  tags:
  - writes
  sources:
  - vllm/v1/engine/async_llm.py:1154-1175
  - vllm/v1/engine/core.py:959-1019
  entry:
    caller: api-server
    interface: async-llm.sleep
    input:
      level: 1
      mode: abort
- id: async-llm-pause-generation
  name: Pause and resume generation
  description: 'AsyncLLM.pause_generation: abort/wait/keep in-flight requests, set the scheduler''s pause state, finish the pause when idle.'
  tags:
  - writes
  sources:
  - vllm/v1/engine/async_llm.py:952-992
  - vllm/v1/engine/core.py:2061-2103
  entry:
    caller: api-server
    interface: async-llm.pause-generation
    input:
      mode: abort
      clear_cache: true
- id: async-llm-lora
  name: LoRA adapters
  description: 'AsyncLLM.add_lora/remove_lora/pin_lora/list_loras: utility calls the engine core turns into collective_rpc on every worker.'
  sources:
  - vllm/v1/engine/async_llm.py:1189-1203
  entry:
    caller: api-server
    interface: async-llm.add-lora
    input:
      lora_request:
        lora_name: sql-adapter
        lora_int_id: 1
        lora_path: /models/lora/sql-adapter
- id: engine-shutdown
  name: Engine shutdown
  description: 'AsyncLLM.shutdown: SIGTERM to the engine core, which aborts (shutdown_timeout 0) or drains in-flight requests, shuts the executor and every worker down and exits once idle; the process manager
    force-kills it after the grace; the client marks the engine dead.'
  tags:
  - writes
  - feature:graceful-shutdown
  sources:
  - vllm/v1/engine/async_llm.py:296-308
  - vllm/v1/engine/core.py:1626-1672
  entry:
    caller: operator
    interface: async-llm.shutdown
- id: engine-fault-tolerance
  name: Fault-tolerance instruction
  description: 'AsyncLLM.handle_fault: an FT instruction (retry) goes straight to the sentinel, which resumes a parked engine.'
  tags:
  - writes
  sources:
  - vllm/v1/engine/async_llm.py:1289-1293
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:50-138
  entry:
    caller: operator
    interface: async-llm.handle-fault
    input:
      request_id: ft-1
      instruction: retry
      params: {}
- id: weight-version
  name: Weight version
  description: 'AsyncLLM.update_weight_version / get_weight_version: the engine core''s opaque weight version, attached to every later EngineCoreOutputs.'
  tags:
  - writes
  sources:
  - vllm/v1/engine/async_llm.py:1357-1363
  - vllm/v1/engine/core.py:1082-1087
  entry:
    caller: api-server
    interface: async-llm.update-weight-version
    input:
      new_version: step-200
- id: metrics-histogram-buckets
  name: Histogram bucket families
  description: 'histogram_buckets: the default Prometheus bucket boundaries per family, the 1-2-5 request-token series, and overrides.'
  sources:
  - vllm/v1/metrics/buckets.py:206-240
  entry:
    caller: api-server
    interface: buckets.histogram-buckets
    input:
      family: request_latency
- id: async-llm-parallel-sampling
  name: Parallel sampling (n > 1)
  description: 'AsyncLLM.generate with n > 1: ParentRequest fans the request out into n child requests sharing one stream; the output processor merges them, and the parent output finishes when every child
    has.'
  tags:
  - writes
  - feature:parallel-sampling
  sources:
  - vllm/v1/engine/async_llm.py:529-556
  - vllm/v1/engine/parallel_sampling.py:84-128
  entry:
    caller: api-server
    interface: async-llm.generate
    input:
      request_id: chatcmpl-abc123
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      sampling_params:
        max_tokens: 4
        n: 2
        temperature: 0.8
        stop: []
      priority: 0
- id: dp-client-add-request
  name: Data-parallel request routing
  description: With data_parallel_size > 1 the DPLBAsyncMPClient routes each ADD to the least-loaded engine-core process (instances dp0, dp1, ...) and fans utilities out to all of them.
  tags:
  - writes
  - feature:data-parallel
  sources:
  - vllm/v1/engine/core_client.py:1582-1697
  entry:
    caller: api-server
    interface: dp-lb-async-mp-client.add-request-async
    input:
      request_id: chatcmpl-abc123-00000001
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 4
        n: 1
      priority: 0
fixtures:
- id: engine-core-seed
  summary: 'engine-core''s starting state for merged worlds: a live client with no requests, an awake executor, a running engine-core process with an async (AsyncLLM) client, a healthy sentinel.'
  state:
    async-mp-client:
      engine_dead: false
      engine_status: {}
    engine-core-proc:
      shutdown_state: RUNNING
      client_kind: async
      aborts_queue: []
    executor:
      sleeping_tags: []
    engine-core-sentinel:
      status_type: HEALTHY
      resumed: true
- id: engine-core-tp4-llama-70b-host
  summary: 'The tp4 world''s host as the deployment has it: four visible GPUs, so the TP 4 world size passes ParallelConfig''s device check (parallel.py) before engine-core starts the multiproc executor.
    config-platform-seed describes a one-GPU host; this variant overrides its counts in the merged tp4 world only.'
  attributes:
    variant_of: tp4-llama-70b
  state:
    platforms:
      host:
        nvml_available: true
        nvml_gpu_count: 4
        device_name: NVIDIA H100 80GB HBM3
        device_total_memory: 85899345920
        device_count: 4
        cpu_architecture: X86
scenarios:
- id: engine-core-caching-metrics-window
  name: The cache hit rate covers the most recent requests and resets with the prefix cache
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: caching-metrics.observe
    caller: engine-core
    as: a
    input:
      stats:
        requests: 2
        queries: 100
        hits: 50
      max_recent_requests: 3
  - interface: caching-metrics.observe
    caller: engine-core
    as: z
    input:
      stats:
        requests: 0
        queries: 0
        hits: 0
      max_recent_requests: 3
  - interface: caching-metrics.observe
    caller: engine-core
    as: b
    input:
      stats:
        requests: 2
        queries: 100
        hits: 100
      max_recent_requests: 3
  - interface: caching-metrics.observe
    caller: engine-core
    as: r
    input:
      stats:
        reset: true
        requests: 1
        queries: 10
        hits: 0
      max_recent_requests: 3
  expect:
  - steps.a.result.value.hit_rate == 0.5 && !steps.z.result.value.empty
  - steps.b.result.value.hit_rate == 1.0
  - steps.r.result.value.hit_rate == 0.0 && state['caching-metrics'].requests == 1
- id: engine-core-spec-decode-request-metrics
  name: Per-request spec-decode metrics histogram accepted drafts and report acceptance
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: request-spec-decode-metrics.observe
    caller: engine-core
    as: s1
    input:
      request_id: r
      num_spec_tokens: 3
      num_draft_tokens: 3
      num_accepted: 3
  - interface: request-spec-decode-metrics.observe
    caller: engine-core
    as: s2
    input:
      request_id: r
      num_spec_tokens: 3
      num_draft_tokens: 3
      num_accepted: 1
  - interface: request-spec-decode-metrics.observe
    caller: engine-core
    as: bad
    input:
      request_id: r
      num_spec_tokens: 3
      num_draft_tokens: 3
      num_accepted: 4
  expect:
  - steps.s2.result.value.acceptance_histogram == [0, 1, 0, 1] && steps.s2.result.value.mean_acceptance_length == 3.0
  - steps.s2.result.value.num_draft_tokens == 6 && steps.s2.result.value.draft_acceptance_rate > 0.66 && steps.s2.result.value.draft_acceptance_rate < 0.67
  - '!steps.bad.result.ok && state[''request-spec-decode-metrics''].requests[''r''].num_draft_tokens == 6'
- id: engine-core-lora-stats-and-constant-list
  name: LoRA stats track waiting and running ids; ConstantList refuses appends; watermark resolution
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: lora-stats.update
    caller: engine-core
    as: w
    input:
      request_id: a
      waiting: true
  - interface: lora-stats.update
    caller: engine-core
    as: r
    input:
      request_id: a
      running: true
  - interface: lora-stats.update
    caller: engine-core
    as: d
    input:
      request_id: a
  - interface: lora-stats.update
    caller: engine-core
    as: both
    input:
      request_id: b
      waiting: true
      running: true
  - interface: output-processor.append-to-constant-list
    caller: engine-core
    as: app
  - interface: input-processor.resolve-watermarking
    caller: api-server
    as: wm
    input:
      watermarking: true
  expect:
  - '!steps.w.result.value.empty && !steps.r.result.value.empty && steps.d.result.value.empty && !steps.both.result.ok'
  - state['lora-stats'].waiting == [] && state['lora-stats'].running == []
  - '!steps.app.result.ok && steps.app.result.error.message == ''Cannot append to a constant list'''
  - '!steps.wm.result.value.watermarking && steps.wm.result.value.skipped'
- id: engine-core-ray-initialize-cluster-pins-driver
  name: initialize_ray_cluster pins the first bundle to the driver, so the workers land on its node
  description: 'tests/distributed/test_multi_node_assignment.py:31: ParallelConfig(1, 2) on a two-node cluster: both GPU bundles are placed on the driver''s node (PACK, first bundle pinned). A driver without
    a GPU can''t start; an existing group with a 2-GPU bundle is refused.'
  fixtures:
  - full-tp1-llama-8b
  state:
    ray-cluster:
      nodes:
      - ip: 10.0.0.9
        GPU: 8
      - ip: 10.0.0.1
        GPU: 2
  steps:
  - interface: ray-cluster.initialize-ray-cluster
    caller: engine-core
    as: pg
    input:
      world_size: 2
      driver_ip: 10.0.0.1
  - interface: ray-cluster.initialize-ray-cluster
    caller: engine-core
    as: three
    input:
      world_size: 3
      driver_ip: 10.0.0.1
  - interface: ray-cluster.initialize-ray-cluster
    caller: engine-core
    as: nogpu
    input:
      world_size: 2
      driver_ip: 10.0.0.5
  - interface: ray-cluster.initialize-ray-cluster
    caller: engine-core
    as: big
    input:
      world_size: 2
      driver_ip: 10.0.0.1
      existing_bundles:
      - GPU: 2
  expect:
  - steps.pg.result.value.bundles.all(b, b.node_ip == '10.0.0.1') && size(steps.pg.result.value.bundles) == 2
  - steps.three.result.value.bundles.map(b, b.node_ip) == ['10.0.0.1', '10.0.0.1', '10.0.0.9']
  - '!steps.nogpu.result.ok && steps.nogpu.result.error.code == ''value-error'' && !steps.big.result.ok'
  - trace.exists(e, e.type == 'call.start' && e.interface == 'ray-cluster.placement-group' && e.input.strategy == 'PACK')
- id: engine-core-generate-happy
  name: A request streams to completion while the busy loop runs
  description: 'The busy loop starts first (await: false); generate adds the request at t=0. The input thread queues the ADD, the next iteration hands it to the scheduler, and under async scheduling the
    step''s outputs come back one iteration later through the output thread, the client''s socket task and the output handler into the request''s collector.'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: engine-core-busy-loop
    as: loop
    await: false
    input:
