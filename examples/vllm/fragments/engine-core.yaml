        mm_features: = input.mm_features
      as: mm
    - set:
        vars.req_in: '= merge(input, {''mm_features'': vars.mm.value.mm_features})'
    else:
    - set:
        vars.req_in: = input
  - if: has(input.sampling_params) && has(input.sampling_params.structured_outputs) && input.sampling_params.structured_outputs != null
    then:
    - title: 'get_structured_output_key: json (dumped to text), json_object, regex, choice, grammar, then structural_tag; xgrammar validation already turned a choice into an EBNF grammar'
      detail: A JSON schema given as an object is passed as a generic object schema text (no json.dumps in CEL).
      source: vllm/v1/structured_output/request.py:74-95
      set:
        vars.so: = input.sampling_params.structured_outputs
    - set:
        vars.key: '= has(vars.so.json) && vars.so.json != null ? [''json'', type(vars.so.json) == string ? vars.so.json : ''{"type": "object"}''] : (has(vars.so.json_object) && vars.so.json_object == true
          ? [''json_object'', ''''] : (has(vars.so.regex) && vars.so.regex != null ? [''regex'', vars.so.regex] : (has(vars.so.choice) && vars.so.choice != null ? [''grammar'', ''root ::= '' + vars.so.choice.map(c,
          ''"'' + c + ''"'').join('' | '')] : (has(vars.so.grammar) && vars.so.grammar != null ? [''grammar'', vars.so.grammar] : [''structural_tag'', has(vars.so.structural_tag) && vars.so.structural_tag
          != null ? vars.so.structural_tag : '''']))))'
        vars.so_backend: '= has(vars.so._backend) && vars.so._backend != null ? vars.so._backend : (config[''structured-outputs-backend''] == ''auto'' ? ''xgrammar'' : config[''structured-outputs-backend''])'
    - title: 'Structured output: structured_output_manager.grammar_init(req) starts compiling the grammar now; the scheduler checks its status before scheduling the request'
      source: vllm/v1/engine/core.py:1104-1110
      call: structured-output-manager.grammar-init
      input:
        request_id: = input.request_id
        backend: = vars.so_backend
        request_type: = vars.key[0]
        grammar_spec: = vars.key[1]
        stop_token_ids: '= (has(input.sampling_params.stop_token_ids) && input.sampling_params.stop_token_ids != null ? input.sampling_params.stop_token_ids : []) + (has(input.sampling_params.eos_token_id)
          && input.sampling_params.eos_token_id != null ? [input.sampling_params.eos_token_id] : [])'
      as: gi
    - title: 'Request.__init__: a structured-output request starts in WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR and carries its grammar'
      source: vllm/v1/request.py:116-117
      return: '= merge(vars.req_in, {''status'': ''WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR'', ''grammar_id'': vars.gi.value.grammar_id})'
  - title: Request.from_engine_core_request
    source: vllm/v1/request.py:244-270
    return: '= merge(vars.req_in, {''status'': ''WAITING''})'
- component: engine-core
  name: step
  kind: function
  summary: 'EngineCore.step: schedule, execute the model on the workers, sample if needed, apply aborts that arrived meanwhile, and let the scheduler turn the model output into EngineCoreOutputs.'
  sources:
  - vllm/v1/engine/core.py:657-687
  response:
    type: object
    properties:
      outputs:
        type:
        - object
        - 'null'
        default: null
      model_executed:
        type: boolean
      batch_queue_len:
        type: integer
  behavior:
  - call: scheduler.has-requests
    as: hr
  - if: '!vars.hr.value'
    then:
    - title: 'No requests in the scheduler: nothing to do'
      source: vllm/v1/engine/core.py:665-666
      return:
        outputs: null
        model_executed: false
        batch_queue_len: 0
  - call: scheduler.schedule
    input:
      throttle_prefills: false
    as: so
  - title: execute_model on the workers (non_block); future.result() re-raises a worker failure
    source: vllm/v1/engine/core.py:667-675
    call: executor.execute-model
    input:
      scheduler_output: = vars.so.value
    as: ex
    on_error:
    - title: log_error_detail dumps the scheduler state, then re-raises
      source: vllm/v1/engine/core.py:562-576
      fail: = error
  - title: While the workers run the forward, compute the grammar bitmask of the scheduled structured-output requests (None without any)
    source: vllm/v1/engine/core.py:668
    call: scheduler.get-grammar-bitmask
    input:
      scheduler_output: = vars.so.value
    as: gb
  - set:
      vars.mo: = vars.ex.value
  - if: vars.ex.value == null
    then:
    - title: 'execute_model returned None: sample with the grammar bitmask'
      source: vllm/v1/engine/core.py:675-676
      call: executor.sample-tokens
      input:
        grammar_output: = vars.gb.value
      as: smp
    - set:
        vars.mo: = vars.smp.value
  - title: Process aborts that arrived during model execution
    source: vllm/v1/engine/core.py:678-680
    call: engine-core-proc.process-aborts-queue
  - call: scheduler.update-from-output
    input:
      scheduler_output: = vars.so.value
      model_runner_output: = vars.mo
    as: up
  - call: engine-core.get-weight-version
    as: wv
  - return:
      outputs: '= merge(vars.up.value, {''weight_version'': vars.wv.value.weight_version})'
      model_executed: = vars.so.value.total_num_scheduled_tokens > 0
      batch_queue_len: 0
- component: engine-core
  name: post-step
  kind: function
  summary: 'EngineCore.post_step: with speculative decoding and sync scheduling, take the workers'' draft token ids after an executed step and hand them to the scheduler (under async scheduling the workers
    keep their drafts).'
  sources:
  - vllm/v1/engine/core.py:689-696
  - vllm/v1/engine/core.py:185-187
  request:
    type: object
    properties:
      model_executed:
        type: boolean
  response:
    type: object
    properties:
      updated:
        type: boolean
  behavior:
  - if: config['speculative-method'] == '' || config['async-scheduling'] || !input.model_executed
    then:
    - title: check_for_draft_tokens is off (no spec decode), async scheduling keeps drafts on the workers, or nothing ran
      source: vllm/v1/engine/core.py:693
      return:
        updated: false
  - title: 'model_executor.take_draft_token_ids(): the output rank''s DraftTokenIds (placeholders, or empty before any spec step)'
    source: vllm/v1/engine/core.py:694
    call: executor.collective-rpc
    input:
      method: take_draft_token_ids
      unique_reply_rank: 0
    as: dt
  - set:
      vars.d: '= size(vars.dt.value.results) > 0 ? vars.dt.value.results[0].value : null'
  - if: vars.d == null
    then:
    - title: 'None: nothing to update'
      source: vllm/v1/engine/core.py:695
      return:
        updated: false
  - title: scheduler.update_draft_token_ids(draft_token_ids)
    source: vllm/v1/engine/core.py:696
    call: scheduler.update-draft-token-ids
    input:
      req_ids: = vars.d.req_ids
      draft_token_ids: = vars.d.draft_token_ids
  - return:
      updated: true
- component: engine-core
  name: step-with-batch-queue
  kind: function
  summary: 'EngineCore.step_with_batch_queue: schedule and launch a batch while the queue has room (returning no output), else block on the oldest batch and update the scheduler from it: outputs lag one
    step behind scheduling.'
  sources:
  - vllm/v1/engine/core.py:698-812
  response:
    type: object
    properties:
      outputs:
        type:
        - object
        - 'null'
        default: null
      model_executed:
        type: boolean
      batch_queue_len:
        type: integer
  behavior:
  - set:
      vars.bq: '= has(state.batch_queue) ? state.batch_queue : {}'
      vars.size: '= config[''async-scheduling''] ? 2 : 1'
      vars.executed: false
  - call: scheduler.has-requests
    as: hr
  - if: vars.hr.value
    then:
    - call: scheduler.schedule
      input:
        throttle_prefills: false
      as: so
    - title: Launch execute_model without blocking
      source: vllm/v1/engine/core.py:723-727
      call: executor.execute-model
      input:
        scheduler_output: = vars.so.value
      as: ex
      on_error:
      - title: log_error_detail dumps the scheduler state, then re-raises
        source: vllm/v1/engine/core.py:562-576
        fail: = error
    - set:
        vars.executed: = vars.so.value.total_num_scheduled_tokens > 0
        vars.mo: = vars.ex.value
    - if: vars.executed && has(vars.so.value.pending_structured_output_tokens) && vars.so.value.pending_structured_output_tokens == true
      then:
      - title: 'Structured-output tokens of the prior step are still pending: defer sampling until its output is processed'
        source: vllm/v1/engine/core.py:747-750
        set:
          vars.deferred: = vars.so.value
      else:
      - if: vars.executed
        then:
        - title: 'No structured-output tokens pending: get the grammar bitmask and sample right away'
          source: vllm/v1/engine/core.py:737-746
          call: scheduler.get-grammar-bitmask
          input:
            scheduler_output: = vars.so.value
          as: gb
        - call: executor.sample-tokens
          input:
            grammar_output: = vars.gb.value
          as: smp
        - set:
            vars.mo: = vars.smp.value
      - title: appendleft this step's future (newest key); the busy loop is the deque's only user
        source: vllm/v1/engine/core.py:752-753
        transact:
        - table: batch_queue
          op: put
          key: = string(1000000000 + seq('batch'))
          value:
            scheduler_output: = vars.so.value
            model_output: = vars.mo
          if_absent: true
      - set:
          vars.more: = vars.executed
      - if: '!vars.executed'
        then:
        - call: scheduler.has-requests
          as: hr2
        - set:
            vars.more: = vars.hr2.value
      - if: size(state.batch_queue) < vars.size && vars.more
        then:
        - title: 'Queue not full: don''t block on the worker; no outputs this call'
          source: vllm/v1/engine/core.py:754-760
          return:
            outputs: null
            model_executed: = vars.executed
            batch_queue_len: = size(state.batch_queue)
    else:
    - if: size(vars.bq) == 0
      then:
      - title: Nothing scheduled and nothing in flight
        source: vllm/v1/engine/core.py:762-766
        return:
          outputs: null
          model_executed: false
          batch_queue_len: 0
  - title: Block until the oldest batch's result is available
    source: vllm/v1/engine/core.py:768-779
    set:
      vars.oldest: = state.batch_queue.filter(k, state.batch_queue.all(j, k <= j))[0]
  - set:
      vars.item: = state.batch_queue[vars.oldest]
  - title: 'batch_queue.pop(): the oldest batch leaves the queue'
    source: vllm/v1/engine/core.py:768
    transact:
    - table: batch_queue
      op: delete
      key: = vars.oldest
  - title: Process aborts that arrived during model execution
    source: vllm/v1/engine/core.py:781-783
    call: engine-core-proc.process-aborts-queue
  - call: scheduler.update-from-output
    input:
      scheduler_output: = vars.item.scheduler_output
      model_runner_output: = vars.item.model_output
    as: up
  - if: has(vars.deferred)
    then:
    - title: 'The deferred step: the prior step''s tokens are in, so compute its grammar bitmask, sample, and queue it'
      source: vllm/v1/engine/core.py:790-808
      call: scheduler.get-grammar-bitmask
      input:
        scheduler_output: = vars.deferred
      as: dgb
    - call: executor.sample-tokens
      input:
        grammar_output: = vars.dgb.value
      as: dsmp
    - transact:
      - table: batch_queue
        op: put
        key: = string(1000000000 + seq('batch'))
        value:
          scheduler_output: = vars.deferred
          model_output: = vars.dsmp.value
        if_absent: true
  - call: engine-core.get-weight-version
    as: wv
  - return:
      outputs: '= merge(vars.up.value, {''weight_version'': vars.wv.value.weight_version})'
      model_executed: = vars.executed
      batch_queue_len: = size(state.batch_queue)
