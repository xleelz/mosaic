- component: buckets
  name: histogram-buckets
  kind: function
  summary: 'histogram_buckets: an override wins verbatim; request_tokens needs max_model_len and is a 1-2-5 series up to it; every other family returns a fresh copy of its static default.'
  sources:
  - vllm/v1/metrics/buckets.py:206-240
  request:
    type: object
    required:
    - family
    properties:
      family:
        type: string
        enum:
        - request_latency
        - time_to_first_token
        - inter_token_latency
        - iteration_tokens
        - request_params_n
        - request_num_preemptions
        - request_tokens
        - kv_cache_residency
        examples:
        - request_latency
      max_model_len:
        type:
        - integer
        - 'null'
        default: null
      overrides:
        type:
        - object
        - 'null'
        default: null
  response:
    type: array
    items:
      type: number
  errors:
  - code: value-error
    status: 0
    retryable: false
  behavior:
  - if: has(input.overrides) && input.overrides != null && input.family in input.overrides
    then:
    - title: A present override replaces the family's defaults verbatim
      source: vllm/v1/metrics/buckets.py:232-233
      return: = input.overrides[input.family]
  - if: input.family == 'request_tokens'
    then:
    - if: '!has(input.max_model_len) || input.max_model_len == null'
      then:
      - title: request_tokens without max_model_len
        source: vllm/v1/metrics/buckets.py:235-239
        fail:
          code: value-error
          message: max_model_len is required for the 'request_tokens' bucket family
    - title: build_1_2_5_buckets(max_model_len)
      source: vllm/v1/metrics/buckets.py:195-204
      return: = [1, 10, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000].map(p, [1, 2, 5].map(m, m * p)).flatten().filter(v, v <= input.max_model_len)
  - return: = state.static_families[input.family]
- component: ray-cluster
  name: available-resources-per-node
  kind: rpc
  sources:
  - vllm/v1/engine/utils.py:651-660
  response:
    type: array
  behavior:
