- component: async-mp-client
  name: call-utility-all-async
  kind: rpc
  summary: 'AsyncMPClient.call_utility_all_async: one _call_utility_async per managed engine (dp0, dp1, ... when data_parallel_size > 1), gathered: one result per engine in rank order.'
  sources:
  - vllm/v1/engine/core_client.py:1262-1269
  request: EngineCoreUtilityCall
  response:
    type: array
  errors:
  - code: exception
    status: 0
    retryable: false
  behavior:
  - if: int(config['data-parallel-size']) <= 1
    then:
    - call: async-mp-client.call-utility-async
      input:
        method: = input.method
        args: '= has(input.args) ? input.args : {}'
      as: one
    - return:
      - = vars.one.value
  - title: asyncio.gather over self.core_engines
    source: vllm/v1/engine/core_client.py:1264-1269
    parallel: = lists.range(int(config['data-parallel-size'])).map(i, 'dp' + string(i))
    as: engine
    steps:
    - call: async-mp-client.call-utility-async
      input:
        method: = input.method
        args: '= has(input.args) ? input.args : {}'
        engine: = vars.engine
      as: res
    - return: = vars.res.value
    join:
      need: all
    on_insufficient:
      code: exception
      summary: a utility call failed on one of the engines
    as_result: all
  - return: = vars.all.results.map(r, r.value)
- component: engine-core-proc
  name: process-input-sockets
  kind: rpc
  latency_ms: 0
  summary: 'The input socket thread (one message): decode it; preprocess an ADD (a failure answers that request with an ERROR output); put aborts on both queues; route FT utility calls to the sentinel;
    push everything else to the input queue.'
  description: UTILITY messages really queue for the busy loop and reply on the output socket; the simulation runs them on arrival and returns the UtilityOutput as the call's result.
  sources:
  - vllm/v1/engine/core.py:1831-1931
  request:
    type: object
    required:
    - request_type
    properties:
      request_type:
        type: string
        enum:
        - ADD
        - ABORT
        - UTILITY
      request:
        $ref: EngineCoreRequest
      request_ids:
        type: array
        items:
          type: string
      method:
        type: string
      args:
        type: object
      client_index:
        type: integer
        default: 0
  response:
    type: object
    properties:
      queued:
        type: boolean
      result: {}
      failure_message:
        type:
        - string
        - 'null'
        default: null
  behavior:
  - if: input.request_type == 'ADD'
    then:
    - title: Decode the EngineCoreRequest and preprocess it in the input thread, overlapping the forward pass
      source: vllm/v1/engine/core.py:1900-1903
      call: engine-core.preprocess-add-request
      input: = input.request
      as: pre
      on_error:
      - title: 'A preprocessing error fails only this request: an ERROR output goes straight to its client'
        source: vllm/v1/engine/core.py:1909-1911
        call: engine-core-proc.send-finish-outputs-to-client
        input:
          request_ids:
          - = input.request.request_id
          client_index: '= has(input.request.client_index) ? input.request.client_index : 0'
          finish_reason: error
      - return:
          queued: false
          result: null
          failure_message: '= ''preprocess failed: '' + error.code'
    - title: Push to the input queue for the busy loop
      source: vllm/v1/engine/core.py:1930-1931
      put: = 'engine-core-input:' + self
      value:
        type: ADD
        request: = vars.pre.value
    - return:
        queued: true
        result: null
        failure_message: null
  - if: input.request_type == 'ABORT'
    then:
    - title: Aborts go on both the aborts queue (seen mid-step) and the input queue (ordering)
      source: vllm/v1/engine/core.py:1923-1928
      set:
        state.aborts_queue: = state.aborts_queue + [input.request_ids]
    - put: = 'engine-core-input:' + self
      value:
        type: ABORT
        request_ids: = input.request_ids
    - return:
        queued: true
        result: null
        failure_message: null
  - if: input.method == 'handle_fault_tolerance'
    then:
    - title: 'FT instructions bypass the input queue: the sentinel answers them even while the busy loop is parked'
      source: vllm/v1/engine/core.py:1912-1919
      call: engine-core-sentinel.handle-command
      input: = input.args
      as: ft
    - return:
        queued: false
        result: = vars.ft.value
        failure_message: null
  - call: engine-core-proc.handle-utility
    input:
      method: = input.method
      args: '= has(input.args) ? input.args : {}'
      client_index: '= has(input.client_index) ? input.client_index : 0'
    as: util
  - return: '= merge(vars.util.value, {''queued'': false})'
- component: engine-core-proc
  name: process-output-sockets
  kind: rpc
  summary: 'The output socket thread (one item of output_queue): ENGINE_CORE_DEAD goes to every client and ends the thread; otherwise the EngineCoreOutputs are msgpack-encoded and pushed to the client''s
    socket.'
  sources:
  - vllm/v1/engine/core.py:1933-1999
  request:
    type: object
    properties:
      dead:
        type: boolean
        default: false
      client_index:
        type: integer
        default: 0
      outputs:
        $ref: EngineCoreOutputs
  behavior:
  - set:
      vars.client: '= state.client_kind == ''sync'' ? ''sync-mp-client.process-outputs-socket'' : ''async-mp-client.process-outputs-socket'''
  - if: has(input.dead) && input.dead
    then:
    - title: ENGINE_CORE_DEAD is sent on every client socket, then the thread exits
      source: vllm/v1/engine/core.py:1967-1971
      call: = vars.client
      targets:
      - async-mp-client.process-outputs-socket
      - sync-mp-client.process-outputs-socket
      input:
        dead: true
    - return:
        sent: dead
  - title: Encode into a reusable buffer and send zero-copy on the client's PUSH socket
    source: vllm/v1/engine/core.py:1972-1999
    call: = vars.client
    targets:
    - async-mp-client.process-outputs-socket
    - sync-mp-client.process-outputs-socket
    input:
      outputs: '= merge(input.outputs, {''engine_index'': 0})'
  - return:
      sent: outputs
- component: engine-core-proc
  name: send-finish-outputs-to-client
  kind: function
  summary: 'EngineCoreProc._send_finish_outputs_to_client (with its abort and error variants): one empty EngineCoreOutput per request with the finish reason, marked finished.'
  sources:
  - vllm/v1/engine/core.py:2112-2130
  request:
    type: object
    properties:
      request_ids:
        type: array
        items:
          type: string
      client_index:
        type: integer
      finish_reason:
        type: string
        enum:
        - abort
        - error
  behavior:
  - call: engine-core-proc.process-output-sockets
    input:
      client_index: = input.client_index
      outputs:
        outputs: '= input.request_ids.map(r, {''request_id'': r, ''new_token_ids'': [], ''finish_reason'': input.finish_reason, ''stop_reason'': null})'
        finished_requests: = input.request_ids
- component: engine-core-proc
  name: send-abort-outputs
  kind: function
  summary: 'EngineCoreProc._send_abort_outputs: group the aborted Requests by client and send each client its ABORT outputs.'
  sources:
  - vllm/v1/engine/core.py:2132-2140
  request:
    type: object
    properties:
      requests:
        type: array
        items:
          type: object
  behavior:
  - if: size(input.requests) == 0
    then:
    - return:
        sent: 0
  - call: engine-core-proc.send-finish-outputs-to-client
    input:
      request_ids: = input.requests.map(r, r.request_id)
      client_index: 0
      finish_reason: abort
  - return:
      sent: = size(input.requests)
- component: engine-core-proc
  name: send-engine-dead
  kind: function
  summary: 'EngineCoreProc._send_engine_dead: queue ENGINE_CORE_DEAD for the output thread and wait (5 s) for it to go out.'
  sources:
  - vllm/v1/engine/core.py:1771-1782
  behavior:
  - set:
      state.dead: true
  - call: engine-core-proc.process-output-sockets
    input:
      dead: true
- component: engine-core-proc
  name: run-busy-loop
  kind: function
  summary: 'One iteration of EngineCoreProc.run_busy_loop under fault_tolerant_wrapper: handle shutdown, take client requests from the input queue (blocking on it while idle), step the engine, then loop.'
  description: 'Each iteration re-emits the next one, so a scenario starts the loop once (await: false) and it keeps running alongside other steps; an idle loop blocks in a channel receive until the input
    thread puts a request. `iterations` bounds the loop for the simulation.'
  sources:
  - vllm/v1/engine/core.py:1547-1558
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:176-194
  request:
    type: object
    properties:
      iterations:
        type: integer
        default: 60
        minimum: 1
      pump:
        type: boolean
        default: false
        description: one non-blocking iteration driven by a waiting client when no loop task is running (simulation device)
  behavior:
  - set:
      state.iterations: = state.iterations + 1
  - if: state.dead || state.exited
    then:
    - set:
        state.loop_active: false
    - return:
        stopped: true
  - if: '!(has(input.pump) && input.pump)'
    then:
    - set:
        state.loop_active: = input.iterations > 1
  - if: config['enable-fault-tolerance']
    then:
    - title: 'fault_tolerant_wrapper: while parked, wait on sentinel.resumed with engine_recovery_timeout_sec'
      source: vllm/v1/fault_tolerance/engine_core_sentinel.py:185-194
      call: engine-core-sentinel.wait-resumed
      as: ft
    - if: vars.ft.value.timed_out
      then:
      - title: 'No recovery within the timeout: the exception is re-raised and the engine dies'
        source: vllm/v1/fault_tolerance/engine_core_sentinel.py:190-194
        call: engine-core-proc.send-engine-dead
      - fail:
          code: runtime-error
          message: = '[FT] No recovery within ' + string(config['engine-recovery-timeout-sec']) + 's timeout.'
    - if: '!vars.ft.value.recovered'
      then:
      - emit: engine-core-proc.run-busy-loop
        when: input.iterations > 1
        after_ms: 1
        input:
          iterations: = input.iterations - 1
      - return:
          parked: true
  - title: 'while self._handle_shutdown(): exit once shutdown is underway and no work remains'
    source: vllm/v1/engine/core.py:1549
    call: engine-core-proc.handle-shutdown
    as: sd
  - if: '!vars.sd.value.keep_running'
    then:
    - title: raise SystemExit; run_engine_core's finally shuts the engine down
      source: vllm/v1/engine/core.py:1558
      call: engine-core.shutdown
    - title: The process exits; the parent's process manager sees it
      source: vllm/v1/engine/core.py:1515-1521
      put: engine-core-exit
      value:
        exited: true
    - return:
        exited: true
  - title: 1) Poll the input queue until there is work to do
    source: vllm/v1/engine/core.py:1550-1551
    call: engine-core-proc.process-input-queue
    input:
      pump: = has(input.pump) && input.pump
    as: piq
    on_error:
    - title: 'Fault tolerance on: the sentinel aborts everything and parks the engine until a recovery instruction'
      source: vllm/v1/fault_tolerance/engine_core_sentinel.py:182-188
      when: config['enable-fault-tolerance']
      call: engine-core-sentinel.on-fault
      input:
        error: = error
    - when: config['enable-fault-tolerance']
      emit: engine-core-proc.run-busy-loop
      after_ms: 1
      input:
        iterations: = input.iterations - 1
    - when: config['enable-fault-tolerance']
      return:
        faulted: true
        error: = error.code
    - title: Otherwise run_engine_core logs 'EngineCore encountered a fatal error', sends ENGINE_CORE_DEAD and shuts the engine down
      source: vllm/v1/engine/core.py:1508-1514
      call: engine-core-proc.send-engine-dead
    - call: engine-core.shutdown
    - fail: = error
  - if: '!vars.piq.value.work'
    then:
    - emit: engine-core-proc.run-busy-loop
      when: input.iterations > 1 && !(has(input.pump) && input.pump)
      after_ms: 0
      input:
        iterations: = input.iterations - 1
    - return:
        idle: true
  - title: 2) Step the engine core and return the outputs
    source: vllm/v1/engine/core.py:1555-1556
    call: engine-core-proc.process-engine-step
    as: st
    on_error:
    - title: 'Fault tolerance on: the sentinel aborts everything and parks the engine until a recovery instruction'
      source: vllm/v1/fault_tolerance/engine_core_sentinel.py:182-188
      when: config['enable-fault-tolerance']
      call: engine-core-sentinel.on-fault
      input:
        error: = error
    - when: config['enable-fault-tolerance']
      emit: engine-core-proc.run-busy-loop
      after_ms: 1
      input:
        iterations: = input.iterations - 1
    - when: config['enable-fault-tolerance']
      return:
        faulted: true
        error: = error.code
    - title: Otherwise run_engine_core logs 'EngineCore encountered a fatal error', sends ENGINE_CORE_DEAD and shuts the engine down
      source: vllm/v1/engine/core.py:1508-1514
      call: engine-core-proc.send-engine-dead
    - call: engine-core.shutdown
    - fail: = error
  - emit: engine-core-proc.run-busy-loop
    when: input.iterations > 1 && !(has(input.pump) && input.pump)
    after_ms: 0
    input:
      iterations: = input.iterations - 1
  - return:
      stepped: true
      model_executed: = vars.st.value.model_executed
- component: engine-core-proc
  name: drive-step
  kind: function
  summary: 'Simulation device for the always-running engine-core process: when no busy-loop task is running (a scenario that never started one), a client waiting for outputs runs one non-blocking busy-loop
    iteration.'
  description: In vLLM the engine-core process starts with AsyncLLM/LLMEngine and loops on its own (core.py:1391-1497); a scenario may not start that loop, so the waiting client drives it. With a loop task
    running this does nothing.
  sources:
  - vllm/v1/engine/core.py:1547-1558
  behavior:
  - if: has(state.loop_active) && state.loop_active
    then:
    - return:
        driven: false
  - call: engine-core-proc.run-busy-loop
    input:
      iterations: 1
      pump: true
    as: it
    on_error: continue
  - return:
      driven: true
- component: engine-core-proc
  name: handle-shutdown
  kind: function
  summary: 'EngineCoreProc._handle_shutdown: on a requested shutdown, abort in-flight requests (shutdown_timeout 0) or let them drain, then exit once no work remains.'
  sources:
  - vllm/v1/engine/core.py:1626-1672
  attributes:
    racy_in_code: the busy loop reads shutdown_state and then sets SHUTTING_DOWN with no lock (core.py:1626-1661), while the SIGTERM handler writes REQUESTED from the same main thread between bytecodes
      (core.py:1451-1462); a second signal between the read and the write is overwritten
  response:
    type: object
    properties:
      keep_running:
        type: boolean
  behavior:
  - if: state.shutdown_state == 'RUNNING'
    then:
    - return:
        keep_running: true
  - if: state.shutdown_state == 'REQUESTED'
    then:
    - if: config['shutdown-timeout'] == 0
      then:
      - title: 'mode=abort: finish every request as FINISHED_ABORTED and tell the clients'
        source: vllm/v1/engine/core.py:1640-1650
        call: scheduler.finish-requests
        input:
          request_ids: null
          finished_status: FINISHED_ABORTED
        as: ab
      - call: engine-core-proc.send-abort-outputs
        input:
          requests: '= vars.ab.value.finished.map(r, {''request_id'': r, ''client_index'': 0})'
      else:
      - title: 'mode=drain: keep stepping the in-flight requests (the process manager enforces the timeout)'
        source: vllm/v1/engine/core.py:1651-1658
        set:
          ctx.shutdown_mode: drain
    - set:
        state.shutdown_state: SHUTTING_DOWN
  - call: engine-core-proc.has-work
    as: hw
  - if: '!vars.hw.value'
    then:
    - title: 'No work left: request processing complete, start resource teardown'
      source: vllm/v1/engine/core.py:1664-1670
      set:
        state.exited: true
        state.loop_active: false
    - return:
        keep_running: false
  - return:
      keep_running: true
- component: engine-core-proc
  name: has-work
  kind: function
  summary: 'EngineCoreProc.has_work: step when DP engines are running, the scheduler has requests, or batches are in flight.'
  sources:
  - vllm/v1/engine/core.py:1534-1540
  response:
    type: boolean
  behavior:
  - if: state.engines_running || state.batch_queue_len > 0
    then:
    - return: true
  - call: scheduler.has-requests
    as: hr
  - title: The scheduler's answer decides; a scenario may pin it (idle) when it needs a drained scheduler without seeding scheduler-kv's state
    choice: scheduler_has_requests
    default: '= vars.hr.value ? ''busy'' : ''idle'''
    options:
      busy:
      - return: true
      idle:
      - return: false
- component: engine-core-proc
  name: process-input-queue
  kind: function
  summary: 'EngineCoreProc._process_input_queue: while idle, run idle callbacks (completing pauses), drop stale aborts and block on input_queue.get(); then dispatch every queued client request.'
  sources:
  - vllm/v1/engine/core.py:1573-1601
  request:
    type: object
    properties:
      pump:
        type: boolean
        default: false
  response:
    type: object
    properties:
      work:
        type: boolean
      handled:
        type: integer
  behavior:
  - set:
      vars.ch: = 'engine-core-input:' + self
      vars.handled: 0
  - call: engine-core-proc.has-work
    as: hw
  - if: has(input.pump) && input.pump && !vars.hw.value && channel_len(vars.ch) == 0
    then:
    - title: 'A driven iteration never blocks: nothing queued and nothing to step'
      return:
        work: false
        handled: 0
  - if: '!vars.hw.value && state.shutdown_state == ''RUNNING'''
    then:
    - title: Notify callbacks waiting for the engine to become idle
      source: vllm/v1/engine/core.py:1578-1579
      call: engine-core-proc.notify-idle-state-callbacks
    - if: channel_len(vars.ch) == 0
      then:
      - title: 'Idle with an empty input queue: drop stale aborts'
        source: vllm/v1/engine/core.py:1580-1585
        set:
          state.aborts_queue: []
    - title: Block on input_queue.get() until the input thread puts a client request
      source: vllm/v1/engine/core.py:1586-1589
      receive: = vars.ch
      as: first
    - call: = 'engine-core-proc.handle-' + vars.first.type.lowerAscii().replace('_', '-')
      targets:
      - engine-core-proc.handle-add
      - engine-core-proc.handle-abort
      - engine-core-proc.handle-executor-failed
      - engine-core-proc.handle-wakeup
      input: = vars.first
    - set:
        vars.handled: 1
  - title: Handle any more client requests without blocking
    source: vllm/v1/engine/core.py:1597-1601
    foreach: = lists.range(channel_len(vars.ch))
    as: k
    steps:
    - receive: = vars.ch
      as: item
    - call: = 'engine-core-proc.handle-' + vars.item.type.lowerAscii().replace('_', '-')
      targets:
      - engine-core-proc.handle-add
      - engine-core-proc.handle-abort
      - engine-core-proc.handle-executor-failed
      - engine-core-proc.handle-wakeup
      input: = vars.item
    - set:
        vars.handled: = vars.handled + 1
  - if: vars.hw.value
    then:
    - return:
        work: true
        handled: = vars.handled
  - call: engine-core-proc.has-work
    as: hw2
  - return:
      work: = vars.hw2.value
      handled: = vars.handled
- component: engine-core-proc
  name: notify-idle-state-callbacks
  kind: function
  summary: 'Run the callbacks pause_scheduler registered: each finishes its pause (device sync, optional cache clear).'
  sources:
  - vllm/v1/engine/core.py:1621-1624
  behavior:
  - set:
      vars.cbs: '= has(state.idle_callbacks) ? state.idle_callbacks : []'
      state.idle_callbacks: []
  - foreach: = vars.cbs
    as: cb
    steps:
    - call: engine-core.finish-pause
      input:
        clear_cache: = vars.cb.clear_cache
- component: engine-core-proc
  name: process-engine-step
  kind: function
  summary: 'EngineCoreProc._process_engine_step: run step_fn (step_with_batch_queue under async scheduling), queue the outputs for the output thread, post-step; yield 1 ms when nothing ran but work remains.'
  sources:
  - vllm/v1/engine/core.py:1603-1619
  response:
    type: object
    properties:
      model_executed:
        type: boolean
  behavior:
  - title: step_fn is step_with_batch_queue when max_concurrent_batches > 1 (async scheduling), else step
    source: vllm/v1/engine/core.py:242-244
    call: '= config[''async-scheduling''] ? ''engine-core.step-with-batch-queue'' : ''engine-core.step'''
    targets:
    - engine-core.step-with-batch-queue
    - engine-core.step
    as: st
  - set:
      state.batch_queue_len: = vars.st.value.batch_queue_len
  - if: vars.st.value.outputs != null
    then:
    - title: Put EngineCoreOutputs into the output queue (the output thread sends them)
      source: vllm/v1/engine/core.py:1607-1608
      call: engine-core-proc.process-output-sockets
      input:
        client_index: 0
        outputs: = vars.st.value.outputs
  - title: Post-step hook
    source: vllm/v1/engine/core.py:1610-1611
    call: engine-core.post-step
    input:
      model_executed: = vars.st.value.model_executed
  - if: '!vars.st.value.model_executed'
    then:
    - call: scheduler.has-requests
      as: hr
    - if: vars.hr.value
      then:
      - title: 'No model ran but scheduler work remains (e.g. waiting for remote KV): sleep 1 ms'
        source: vllm/v1/engine/core.py:1612-1617
        wait: 1
  - return:
      model_executed: = vars.st.value.model_executed
- component: engine-core-proc
  name: handle-add
  kind: function
  summary: 'ADD: refused with an ABORT output once shutdown started, else EngineCore.add_request.'
  sources:
  - vllm/v1/engine/core.py:1680-1684
  - vllm/v1/engine/core.py:1708-1717
  request:
    type: object
    properties:
      type:
        type: string
      request:
        $ref: EngineCoreRequest
  behavior:
  - if: state.shutdown_state != 'RUNNING'
    then:
    - title: 'Shutting down: reject the new request with an ABORT output'
      source: vllm/v1/engine/core.py:1708-1717
      call: engine-core-proc.send-finish-outputs-to-client
      input:
        request_ids:
        - = input.request.request_id
        client_index: 0
        finish_reason: abort
    - return:
        added: false
  - call: engine-core.add-request
    input: = input.request
  - return:
      added: true
- component: engine-core-proc
  name: handle-abort
  kind: function
  summary: 'ABORT: EngineCore.abort_requests (idempotent in the scheduler).'
  sources:
  - vllm/v1/engine/core.py:1685-1686
  request:
    type: object
    properties:
      type:
        type: string
      request_ids:
        type: array
        items:
          type: string
  behavior:
  - call: engine-core.abort-requests
    input:
      request_ids: = input.request_ids
- component: engine-core-proc
  name: handle-executor-failed
  kind: function
  summary: 'EXECUTOR_FAILED (put by the executor''s failure callback): raise RuntimeError, which kills the busy loop.'
  sources:
  - vllm/v1/engine/core.py:1701-1702
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  behavior:
  - fail:
      code: runtime-error
      message: Executor failed.
- component: engine-core-proc
  name: handle-wakeup
  kind: function
  summary: 'WAKEUP (from the signal handler): only wakes the blocked input_queue.get().'
  sources:
  - vllm/v1/engine/core.py:1678-1679
  behavior:
  - return:
      woken: true
- component: engine-core-proc
  name: handle-utility
  kind: function
  summary: 'UTILITY: refuse while shutting down; look the method up lazily on the engine and run it; a failure becomes failure_message; a Future result defers the reply.'
  sources:
  - vllm/v1/engine/core.py:1687-1700
  - vllm/v1/engine/core.py:1719-1753
  request: EngineCoreUtilityCall
  response: EngineCoreUtilityResult
  behavior:
  - if: state.shutdown_state != 'RUNNING'
    then:
    - title: 'Shutting down: reply with failure ''Server shutting down'''
      source: vllm/v1/engine/core.py:1719-1734
      return:
        result: null
        failure_message: Server shutting down
  - set:
      vars.known:
      - get_supported_tasks
      - profile
      - reset_mm_cache
      - reset_prefix_cache
      - reset_encoder_cache
      - pause_scheduler
      - resume_scheduler
      - is_scheduler_paused
      - sleep
      - wake_up
      - release_kv_cache_memory
      - is_sleeping
      - execute_dummy_batch
      - compute_weight_checksums
      - add_lora
      - remove_lora
      - list_loras
      - pin_lora
      - save_sharded_state
      - collective_rpc
      - set_weight_version
      - get_weight_version
  - if: '!(input.method in vars.known)'
    then:
    - title: 'getattr fails: AttributeError becomes the failure message'
      source: vllm/v1/engine/core.py:1692-1696
      return:
        result: null
        failure_message: '= ''Call to '' + input.method + " method failed: ''EngineCoreProc'' object has no attribute ''" + input.method + "''"'
  - title: method(*args); exceptions are logged and returned as failure_message
    source: vllm/v1/engine/core.py:1736-1753
    call: '= (input.method == ''pause_scheduler'' ? ''engine-core-proc.'' : ''engine-core.'') + input.method.replace(''_'', ''-'')'
    targets:
    - engine-core.get-supported-tasks
    - engine-core.profile
    - engine-core.reset-mm-cache
    - engine-core.reset-prefix-cache
    - engine-core.reset-encoder-cache
    - engine-core-proc.pause-scheduler
    - engine-core.resume-scheduler
    - engine-core.is-scheduler-paused
    - engine-core.sleep
    - engine-core.wake-up
    - engine-core.release-kv-cache-memory
    - engine-core.is-sleeping
    - engine-core.execute-dummy-batch
    - engine-core.compute-weight-checksums
    - engine-core.add-lora
    - engine-core.remove-lora
    - engine-core.list-loras
    - engine-core.pin-lora
    - engine-core.save-sharded-state
    - engine-core.collective-rpc
    - engine-core.set-weight-version
    - engine-core.get-weight-version
    input: = input.args
    as: r
    on_error: continue
  - if: '!vars.r.ok'
    then:
    - return:
        result: null
        failure_message: '= ''Call to '' + input.method + '' method failed: '' + (has(vars.r.error.message) && vars.r.error.message != null && vars.r.error.message != '''' ? vars.r.error.message : vars.r.error.code)'
  - return:
      result: = vars.r.value
      failure_message: null
