- id: engine-core-mm-receiver-cache
  name: The engine core fills multimodal items from its P1 cache and clears it on reset_mm_cache
  description: The first request sends the image item; the second sends only its hash (P0 knows P1 has it) and preprocess fills the data from the receiver cache. reset_mm_cache clears the cache, so the
    same hash-only item is then a MultiModalCacheMissError.
  fixtures:
  - full-tp1-llama-8b
  steps:
  - interface: engine-core.preprocess-add-request
    caller: engine-core
    as: first
    input:
      request_id: m1
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 1
      mm_features:
      - mm_hash: img-1
        data:
          bytes: 1024
          modality: image
  - interface: engine-core.preprocess-add-request
    caller: engine-core
    as: hit
    input:
      request_id: m2
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 1
      mm_features:
      - mm_hash: img-1
        data: null
  - interface: engine-core.reset-mm-cache
    caller: engine-core
    as: reset
  - interface: engine-core.preprocess-add-request
    caller: engine-core
    as: miss
    input:
      request_id: m3
      prompt_token_ids:
      - 128000
      - 9906
      sampling_params:
        max_tokens: 1
      mm_features:
      - mm_hash: img-1
        data: null
  expect:
  - steps.hit.result.ok && steps.hit.result.value.mm_features[0].data.bytes == 1024
  - steps.reset.result.ok && trace.exists(e, e.type == 'call.start' && e.interface == 'lru-key-replicated-receiver-cache.clear-cache')
  - '!steps.miss.result.ok && steps.miss.result.error.code == ''multi-modal-cache-miss-error'''
