- component: multiproc-executor
  name: init-executor
  kind: function
  summary: 'MultiprocExecutor._init_executor: spawn one WorkerProc per rank (each inits its device and loads the model), wait for all to be ready, start the worker monitor.'
  sources:
  - vllm/v1/executor/multiproc_executor.py:118-268
  behavior:
  - set:
      state.is_failed: false
      state.shutting_down: false
      vars.ranks: = lists.range(config['tensor-parallel-size']).map(i, 'rank' + string(i))
  - title: make_worker_process per rank, then wait_for_ready on all of them
    source: vllm/v1/executor/multiproc_executor.py:186-240
    parallel: = vars.ranks
    as: rank
    steps:
    - call: gpu-worker-impl.init-device
      'on': = vars.rank
    - call: gpu-worker-impl.load-model
      'on': = vars.rank
    join:
      need: all
    on_insufficient:
      code: runtime-error
      summary: WorkerProc initialization failed
    as_result: ready
  - title: 'start_worker_monitor: a daemon MultiprocWorkerMonitor thread blocks on the worker process sentinels'
    source: vllm/v1/executor/multiproc_executor.py:291-330
    emit: multiproc-executor.monitor-workers
    input: {}
  - return:
      workers: = size(vars.ranks)
- component: multiproc-executor
  name: collective-rpc
  kind: function
  summary: 'MultiprocExecutor.collective_rpc: refuse once failed; enqueue (method, args, kwargs, output_rank) on the broadcast queue and dequeue each rank''s (or only the output rank''s) reply before the
    deadline; a FAILURE reply raises RuntimeError.'
  sources:
  - vllm/v1/executor/multiproc_executor.py:382-456
  request:
    type: object
    properties:
      method:
        type: string
      args:
        type: object
      timeout_s:
        type:
        - integer
        - 'null'
        default: null
      unique_reply_rank:
        type:
        - integer
        - 'null'
        default: null
  response:
    type: object
    properties:
      results:
        type: array
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  - code: timeout
    status: 0
    retryable: true
  behavior:
  - if: state.is_failed
    then:
    - title: The worker monitor marked the executor failed
      source: vllm/v1/executor/multiproc_executor.py:398-399
      fail:
        code: runtime-error
        message: Executor failed.
  - set:
      vars.ranks: = lists.range(config['tensor-parallel-size']).map(i, 'rank' + string(i))
  - set:
      vars.reply_rank: '= has(input.unique_reply_rank) && input.unique_reply_rank != null ? ''rank'' + string(input.unique_reply_rank) : '''''
  - title: 'Broadcast (method, args, kwargs, output_rank) on the shared MessageQueue: every rank runs it; dequeue only response_mqs[output_rank] when one is given, else every rank''s reply, before the deadline'
    source: vllm/v1/executor/multiproc_executor.py:425-454
    parallel: = vars.ranks
    as: rank
    steps:
    - set:
        state.inflight: '= merge(has(state.inflight) ? state.inflight : {}, {vars.rank: ((has(state.inflight) && vars.rank in state.inflight) ? state.inflight[vars.rank] : 0) + 1})'
    - call: worker-proc.execute-worker-rpc
      input:
        rank: = vars.rank
        method: = input.method
        args: '= has(input.args) && input.args != null ? input.args : {}'
        output_rank: = vars.reply_rank
      as: reply
      on_error: continue
    - set:
        state.inflight: '= merge(state.inflight, {vars.rank: state.inflight[vars.rank] - 1})'
    - if: '!vars.reply.ok && vars.reply.error.code in [''killed'', ''peer-killed'']'
      then:
      - fail: = vars.reply.error
    - if: '!vars.reply.ok'
      then:
      - title: 'status != SUCCESS: get_response raises RuntimeError naming the worker''s message'
        source: vllm/v1/executor/multiproc_executor.py:444-449
        return:
          rpc_failure: '= "Worker failed with error ''" + (has(vars.reply.error.message) ? string(vars.reply.error.message) : vars.reply.error.code) + "'', please check the stack trace above for the root
            cause"'
    - return: = vars.reply.value
    join:
      need: all
    timeout_ms: '= has(input.timeout_s) && input.timeout_s != null ? input.timeout_s * 1000 : 3600000'
    on_insufficient:
      code: runtime-error
      summary: Worker failed with error, please check the stack trace above for the root cause
    as_result: replies
  - if: vars.replies.results.exists(r, type(r.value) == map && 'rpc_failure' in r.value)
    then:
    - title: The FAILURE reply surfaces as RuntimeError('Worker failed with error ...')
      source: vllm/v1/executor/multiproc_executor.py:444-449
      fail:
        code: runtime-error
        message: = vars.replies.results.filter(r, type(r.value) == map && 'rpc_failure' in r.value)[0].value.rpc_failure
  - title: responses[0] if output_rank is not None else responses
    source: vllm/v1/executor/multiproc_executor.py:425-427
    return:
      results: '= vars.replies.results.filter(r, vars.reply_rank == '''' || r.item == vars.reply_rank).map(r, {''rank'': r.item, ''value'': r.value})'
- component: multiproc-executor
  name: execute-model
  kind: function
  summary: 'MultiprocExecutor.execute_model: collective_rpc to all ranks with the reply from the output rank only, bounded by VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS.'
  sources:
  - vllm/v1/executor/multiproc_executor.py:341-352
  request:
    type: object
    properties:
      scheduler_output:
        $ref: SchedulerOutput
  response:
    anyOf:
    - $ref: ModelRunnerOutput
    - type: 'null'
  behavior:
  - call: executor.collective-rpc
    input:
      method: execute_model
      args: = input.scheduler_output
      unique_reply_rank: 0
      timeout_s: = config['vllm-execute-model-timeout-seconds']
    as: r
  - return: = vars.r.value.results[0].value
- component: multiproc-executor
  name: sample-tokens
  kind: function
  sources:
  - vllm/v1/executor/multiproc_executor.py:354-365
  request:
    type: object
    properties:
      grammar_output:
        type:
        - object
        - 'null'
        default: null
  response:
    anyOf:
    - $ref: ModelRunnerOutput
