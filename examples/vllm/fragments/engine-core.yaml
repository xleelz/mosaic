- component: engine-core-sentinel
  name: on-fault
  kind: function
  summary: 'EngineCoreSentinel.on_fault: clear resumed, abort every request (abort outputs to clients), drop in-flight batches, become DEAD if the executor failed else UNHEALTHY, and push the status to
    the client.'
  sources:
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:79-105
  request:
    type: object
    properties:
      error:
        type: object
  behavior:
  - set:
      state.resumed: false
      state.fault_at: = now
      state.fault_info: = input.error.code
  - call: scheduler.finish-requests
    input:
      request_ids: null
      finished_status: FINISHED_ABORTED
    as: ab
  - call: engine-core-proc.send-abort-outputs
    input:
      requests: '= vars.ab.value.finished.map(r, {''request_id'': r, ''client_index'': 0})'
  - call: multiproc-executor.is-failed
    as: failed
  - set:
      state.status_type: '= vars.failed.value ? ''DEAD'' : ''UNHEALTHY'''
  - title: '_push_status: an FT status UtilityOutput to client 0'
    source: vllm/v1/fault_tolerance/engine_core_sentinel.py:107-119
    call: engine-core-proc.process-output-sockets
    input:
      client_index: 0
      outputs:
        utility_output:
          id: 0
          status: = state.status_type.lowerAscii()
          fault_info: = state.fault_info
  - return:
      status: = state.status_type
- component: engine-core-sentinel
  name: wait-resumed
  kind: function
  summary: 'The wrapper''s sentinel.resumed.wait(engine_recovery_timeout_sec): recovered, still waiting, or timed out.'
  sources:
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:185-194
  response:
    type: object
    properties:
      recovered:
        type: boolean
      timed_out:
        type: boolean
  behavior:
  - if: state.resumed
    then:
    - return:
        recovered: true
        timed_out: false
  - if: now - state.fault_at >= config['engine-recovery-timeout-sec'] * 1000
    then:
    - title: No recovery within the timeout
      source: vllm/v1/fault_tolerance/engine_core_sentinel.py:190-194
      return:
        recovered: false
        timed_out: true
  - return:
      recovered: false
      timed_out: false
- component: engine-core-sentinel
  name: handle-command
  kind: function
  summary: 'EngineCoreSentinel.handle_command: reject unless the engine is UNHEALTHY; otherwise run the instruction (retry) and reply with a FaultToleranceResult.'
  sources:
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:50-81
  request:
    type: object
    properties:
      request_id:
        type: string
        examples:
        - ft-1
      instruction:
        type: string
        examples:
        - retry
      params:
        type: object
        default: {}
  response:
    type: object
    properties:
      request_id:
        type: string
      success:
        type: boolean
      reason:
        type:
        - string
        - 'null'
        default: null
  behavior:
  - if: state.status_type != 'UNHEALTHY'
    then:
    - title: 'Not UNHEALTHY: reject the instruction'
      source: vllm/v1/fault_tolerance/engine_core_sentinel.py:53-63
      return:
        request_id: = input.request_id
        success: false
        reason: '= ''[FT] Rejecting '' + input.instruction + '' on engine 0: status is '' + state.status_type'
  - if: input.instruction != 'retry'
    then:
    - title: run_method fails for an unknown instruction
      source: vllm/v1/fault_tolerance/engine_core_sentinel.py:64-71
      return:
        request_id: = input.request_id
        success: false
        reason: = "'EngineCoreSentinel' object has no attribute '" + input.instruction + "'"
  - call: engine-core-sentinel.retry
    input: = input
    as: res
  - return: = vars.res.value
- component: engine-core-sentinel
  name: retry
  kind: function
  summary: 'EngineCoreSentinel.retry: send handle_ft_command to every worker, become HEALTHY, set resumed (the busy loop continues) and push the status.'
  sources:
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:121-134
  request:
    type: object
    properties:
      request_id:
        type: string
  behavior:
  - call: executor.collective-rpc
    input:
      method: handle_ft_command
      args: = input
  - set:
      state.status_type: HEALTHY
      state.resumed: true
  - call: engine-core-proc.process-output-sockets
    input:
      client_index: 0
      outputs:
        utility_output:
          id: 0
          status: healthy
  - return:
      request_id: = input.request_id
      success: true
      reason: null
- component: multiproc-executor
  name: is-failed
  kind: function
  summary: 'hasattr(executor, ''is_failed'') and executor.is_failed: only the mp executor can be failed.'
  sources:
  - vllm/v1/fault_tolerance/engine_core_sentinel.py:91-96
  response:
    type: boolean
  behavior:
  - return: = state.is_failed
- component: msgpack-serializer
  name: encode
  kind: function
  summary: 'MsgpackEncoder.encode: native values encode as themselves; enc_hook maps tensors, arrays, slices, multimodal items and utility results; any other object raises TypeError unless insecure serialization
    is allowed, then it becomes a pickle extension (cloudpickle for functions).'
  sources:
  - vllm/v1/serial_utils.py:165-178
  - vllm/v1/serial_utils.py:190-235
  request:
    type: object
    required:
    - obj
    properties:
      obj:
        type: object
        description: 'The value to encode: kind native (msgpack-encodable as is), tensor, ndarray, slice, utility_result, function or object (a custom class instance); type is the Python class name'
        properties:
          kind:
            type: string
            enum:
            - native
            - tensor
            - ndarray
            - slice
            - utility_result
            - function
            - object
            default: native
          type:
            type: string
            examples:
            - CustomClass
          value: {}
  response:
    type: object
    properties:
      bufs:
        type: array
  errors:
  - code: type-error
    status: 0
    retryable: false
    summary: Object of type ... is not serializable
  behavior:
  - if: input.obj.kind in ['function', 'object'] && !config['vllm-allow-insecure-serialization']
    then:
    - title: 'enc_hook: no hook for this type and pickle isn''t allowed'
      source: vllm/v1/serial_utils.py:220-225
      fail:
        code: type-error
        message: '= ''Object of type '' + (has(input.obj.type) ? input.obj.type : ''object'') + '' is not serializableSet VLLM_ALLOW_INSECURE_SERIALIZATION=1 to allow fallback to pickle-based serialization.'''
  - if: input.obj.kind == 'function'
    then:
    - title: Functions go through cloudpickle (pickle can't serialize methods)
      source: vllm/v1/serial_utils.py:227-230
      return:
        bufs:
        - '= {''ext'': 2, ''type'': has(input.obj.type) ? input.obj.type : ''function'', ''data'': has(input.obj.value) ? input.obj.value : null}'
  - if: input.obj.kind == 'object'
    then:
    - title: 'Any other object: a pickle extension (CUSTOM_TYPE_PICKLE)'
      source: vllm/v1/serial_utils.py:232-234
      return:
        bufs:
        - '= {''ext'': 1, ''type'': has(input.obj.type) ? input.obj.type : ''object'', ''data'': has(input.obj.value) ? input.obj.value : null}'
  - title: Native values and the hooked types (tensor, ndarray, slice, multimodal, utility result) encode without pickle
    source: vllm/v1/serial_utils.py:190-218
    return:
      bufs:
      - '= {''kind'': input.obj.kind, ''value'': has(input.obj.value) ? input.obj.value : null}'
- component: msgpack-serializer
  name: decode
  kind: function
  summary: 'MsgpackDecoder.decode: ext_hook unpickles pickle and cloudpickle extensions only when insecure serialization is allowed; any other extension code is NotImplementedError. Native payloads decode
    as themselves.'
  sources:
  - vllm/v1/serial_utils.py:339-347
  - vllm/v1/serial_utils.py:472-482
  request:
    type: object
    required:
    - bufs
    properties:
      bufs:
        type: array
      type:
        type:
        - string
        - 'null'
        default: null
        description: the decoder's target type (MsgpackDecoder(t))
  response:
    type: object
    properties:
      obj:
        type: object
  errors:
  - code: not-implemented-error
    status: 0
    retryable: false
    summary: Extension type code ... is not supported
  behavior:
  - set:
      vars.b: = input.bufs[0]
  - if: has(vars.b.ext)
    then:
    - if: config['vllm-allow-insecure-serialization'] && vars.b.ext in [1, 2]
      then:
      - title: pickle.loads / cloudpickle.loads rebuild the object
        source: vllm/v1/serial_utils.py:476-480
        return:
          obj: '= {''kind'': vars.b.ext == 2 ? ''function'' : ''object'', ''type'': vars.b.type, ''value'': vars.b.data}'
    - title: 'Pickle not allowed (or an unknown code): the extension isn''t supported'
      source: vllm/v1/serial_utils.py:482
      fail:
        code: not-implemented-error
        message: = 'Extension type code ' + string(vars.b.ext) + ' is not supported'
  - return:
      obj: '= {''kind'': vars.b.kind, ''value'': vars.b.value}'
