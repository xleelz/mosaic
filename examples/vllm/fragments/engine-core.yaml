- component: engine-core
  name: sleep
  kind: rpc
  summary: 'EngineCore.sleep: pause the scheduler (clearing caches from level 1), then level 0 stops there; level 1 offloads weights and discards the KV cache, level 2 discards all GPU memory.'
  sources:
  - vllm/v1/engine/core.py:959-995
  request:
    type: object
    properties:
      level:
        type: integer
        default: 1
      mode:
        type: string
        default: abort
  behavior:
  - set:
      vars.level: '= has(input.level) ? input.level : 1'
      vars.mode: '= has(input.mode) ? input.mode : ''abort'''
  - title: Pause the scheduler first; caches are cleared from level 1
    source: vllm/v1/engine/core.py:972-974
    call: engine-core-proc.pause-scheduler
    input:
      mode: = vars.mode
      clear_cache: = vars.level >= 1
    as: pause
  - if: vars.level < 1
    then:
    - title: 'Level 0: scheduling paused only, no GPU memory change'
      source: vllm/v1/engine/core.py:975-976
      return:
        level: 0
        pending: = vars.pause.value.pending
  - if: vars.pause.value.pending
    then:
    - title: 'In-flight requests still running: the executor sleeps when the pause completes'
      source: vllm/v1/engine/core.py:986-995
      set:
        ctx.sleep_deferred: true
    - return:
        level: = vars.level
        pending: true
  - call: executor.sleep
    input:
      level: = vars.level
  - return:
      level: = vars.level
      pending: false
- component: engine-core
  name: wake-up
  kind: rpc
  summary: 'EngineCore.wake_up: wake the given tags (''scheduling'' alone wakes nothing on the executor); resume scheduling only when all executor memory is resident again.'
  sources:
  - vllm/v1/engine/core.py:997-1019
  request:
    type: object
    properties:
      tags:
        type:
        - array
        - 'null'
        items:
          type: string
        default: null
  response:
    type: boolean
  behavior:
  - set:
      vars.tags: '= has(input.tags) && input.tags != null ? dyn(input.tags.filter(t, t != ''scheduling'')) : dyn(null)'
  - if: vars.tags == null || size(vars.tags) > 0
    then:
    - call: executor.wake-up
      input:
        tags: = vars.tags
  - call: executor.is-sleeping
    as: sl
  - if: '!vars.sl.value'
    then:
    - title: 'Fully awake: resume the scheduler'
      source: vllm/v1/engine/core.py:1016-1018
      call: engine-core.resume-scheduler
  - return: = !vars.sl.value
- component: engine-core
  name: release-kv-cache-memory
  kind: rpc
  summary: 'EngineCore.release_kv_cache_memory: only after a completed pause with nothing in flight and all memory resident; resets caches and discards the KV cache memory.'
  sources:
  - vllm/v1/engine/core.py:1021-1039
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  behavior:
  - call: engine-core.is-scheduler-paused
    as: paused
  - call: scheduler.has-requests
    as: hr
  - if: '!vars.paused.value || vars.hr.value || (has(state.batch_queue) && size(state.batch_queue) > 0)'
    then:
    - title: Not idle and paused
      source: vllm/v1/engine/core.py:1026-1033
      fail:
        code: runtime-error
        message: release_kv_cache_memory() requires a completed pause first
  - call: executor.is-sleeping
    as: sl
  - if: vars.sl.value
    then:
    - fail:
        code: runtime-error
        message: release_kv_cache_memory() requires all executor memory to be resident
  - call: engine-core.reset-prefix-cache
    input:
      reset_running_requests: true
      reset_connector: true
  - call: executor.discard
    input:
      tags:
      - kv_cache
  - return:
      released: true
- component: engine-core
  name: is-sleeping
  kind: rpc
  sources:
  - vllm/v1/engine/core.py:1041-1043
  response:
    type: boolean
  behavior:
  - call: engine-core.is-scheduler-paused
