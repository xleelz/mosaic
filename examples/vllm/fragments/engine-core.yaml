  name: get-sanitized-opentelemetry-name
  kind: function
  summary: 'RayPrometheusMetric._get_sanitized_opentelemetry_name: every character outside a-z, A-Z, 0-9 and _ becomes _ (Ray and OpenTelemetry reject them).'
