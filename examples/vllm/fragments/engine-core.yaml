        type:
        - integer
        - 'null'
        default: null
      unique_reply_rank:
        type:
        - integer
        - 'null'
        default: null
  response:
    type: object
    properties:
      results:
        type: array
  errors:
  - code: timeout-error
    status: 0
  - code: runtime-error
    status: 0
  behavior:
  - set:
      vars.backend: '= ((''distributed-executor-backend'' in config) && config[''distributed-executor-backend''] != null) ? config[''distributed-executor-backend''] : (config[''tensor-parallel-size''] >
        1 ? ''mp'' : ''uni'')'
  - call: '= vars.backend == ''mp'' ? ''multiproc-executor.collective-rpc'' : ''uni-proc-executor.collective-rpc'''
    targets:
    - multiproc-executor.collective-rpc
    - uni-proc-executor.collective-rpc
    input: = input
