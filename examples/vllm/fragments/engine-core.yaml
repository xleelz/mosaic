- component: engine-core-proc
  name: pause-scheduler
  kind: function
  summary: 'EngineCoreProc.pause_scheduler: abort (mode abort), set PAUSED_NEW or PAUSED_ALL (keep), and finish now when idle or once the engine becomes idle.'
  sources:
  - vllm/v1/engine/core.py:2061-2103
  - vllm/v1/engine/core.py:921-949
  request:
    type: object
    properties:
      mode:
        type: string
        default: abort
        description: abort, wait or keep
      clear_cache:
        type: boolean
        default: true
  errors:
  - code: value-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.mode: '= has(input.mode) ? input.mode : ''abort'''
      vars.clear: '= has(input.clear_cache) ? input.clear_cache : true'
  - if: '!(vars.mode in [''abort'', ''wait'', ''keep''])'
    then:
    - fail:
        code: value-error
        message: '= ''Invalid pause mode: '' + vars.mode'
  - if: vars.mode == 'abort'
    then:
    - title: 'abort: finish every request as aborted and send the abort outputs'
      source: vllm/v1/engine/core.py:2088-2092
      call: scheduler.finish-requests
      input:
        request_ids: null
        finished_status: FINISHED_ABORTED
      as: ab
    - call: engine-core-proc.send-abort-outputs
      input:
        requests: '= vars.ab.value.finished.map(r, {''request_id'': r, ''client_index'': 0})'
  - title: keep -> PAUSED_ALL (nothing steps); abort and wait -> PAUSED_NEW (new adds queue)
    source: vllm/v1/engine/core.py:2094-2095
    call: scheduler.set-pause-state
    input:
      pause_state: '= vars.mode == ''keep'' ? ''PAUSED_ALL'' : ''PAUSED_NEW'''
  - call: engine-core-proc.has-work
    as: hw
  - if: '!vars.hw.value'
    then:
    - call: engine-core.finish-pause
      input:
        clear_cache: = vars.clear
    - return:
        paused: true
        pending: false
  - title: 'Not idle yet: finish the pause from an idle-state callback; the utility reply waits for it'
    source: vllm/v1/engine/core.py:2101-2103
    set:
      state.idle_callbacks: '= (has(state.idle_callbacks) ? state.idle_callbacks : []) + [{''clear_cache'': vars.clear}]'
  - return:
      paused: true
      pending: true
