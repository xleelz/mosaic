- component: engine-core
  name: add-request
  kind: rpc
  summary: 'EngineCore.add_request: validate the id and any pooling task, hand the Request to the scheduler, and abort at once a request marked abort_immediately.'
  sources:
  - vllm/v1/engine/core.py:508-552
  request: EngineCoreClientRequest
  errors:
  - code: type-error
