- component: core-engine-proc-manager
  name: launch
  kind: function
  summary: 'CoreEngineProcManager: start a process per local engine with target EngineCoreProc.run_engine_core; wait_for_engine_startup waits for every engine''s handshake.'
  sources:
  - vllm/v1/engine/utils.py:242-333
  - vllm/v1/engine/utils.py:1361-1400
  request:
    type: object
    properties:
      client_kind:
