  - title: per_engine_stat_loggers[engine_idx].record(...)
    source: vllm/v1/metrics/loggers.py:458-462
    set:
      state.records: '= merge(state.records, {string(vars.idx): (string(vars.idx) in state.records ? state.records[string(vars.idx)] : 0) + 1})'
  - return:
