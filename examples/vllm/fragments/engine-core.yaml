- component: input-processor
  name: resolve-watermarking
  kind: function
  summary: 'InputProcessor.resolve_watermarking -> VllmConfig._check_supports_watermarking: without an engine watermark_config the request runs unwatermarked (warning if it asked); a request that opts out
    (watermarking False) is not watermarked; otherwise it is. Requests that ask but can''t get it count as watermark-skipped in RequestStateStats.'
  sources:
  - vllm/v1/engine/input_processor.py:115-122
  - vllm/config/vllm.py:1275-1290
  - vllm/v1/metrics/stats.py:258-284
  request:
    type: object
    properties:
      watermarking:
        type:
        - boolean
        - 'null'
        default: null
  response:
    type: object
    properties:
      watermarking:
        type: boolean
      skipped:
        type: boolean
  behavior:
  - if: '!config[''watermark-enabled'']'
    then:
    - title: 'No watermark_config: False (warn once if the request asked for it)'
      source: vllm/config/vllm.py:1281-1290
      return:
        watermarking: false
        skipped: = has(input.watermarking) && input.watermarking == true
  - if: has(input.watermarking) && input.watermarking == false
    then:
    - title: The request opts out
      source: vllm/v1/engine/input_processor.py:115-122
      return:
        watermarking: false
        skipped: false
  - return:
      watermarking: true
      skipped: false
- component: ray-cluster
  name: initialize-ray-cluster
  kind: function
  summary: 'ray_utils.initialize_ray_cluster (the Ray executor''s setup): reuse a given placement group after checking each bundle holds at most one device and there are world_size of them; otherwise require
    a device on the driver node, ask for world_size one-device bundles with the first pinned to the driver (''node:<ip>'': 0.001), PACK them, and verify the driver is in the group.'
  sources:
  - vllm/v1/executor/ray_utils.py:510-656
  - vllm/v1/executor/ray_utils.py:281-317
  request:
    type: object
    required:
    - world_size
    - driver_ip
    properties:
      world_size:
        type: integer
        examples:
        - 2
      driver_ip:
        type: string
        examples:
        - 127.0.0.1
      require_gpu_on_driver:
        type: boolean
        default: true
      existing_bundles:
        type:
        - array
        - 'null'
        default: null
        description: 'bundle specs of an existing placement group, e.g. [{GPU: 1}]'
  response:
    type: object
    properties:
      bundles:
        type: array
      created:
        type: boolean
  errors:
  - code: value-error
    status: 0
    retryable: false
  - code: runtime-error
    status: 0
    retryable: false
  behavior:
  - if: has(input.existing_bundles) && input.existing_bundles != null
    then:
    - if: input.existing_bundles.exists(b, has(b.GPU) && b.GPU > 1)
      then:
      - title: A bundle with more than one device
        source: vllm/v1/executor/ray_utils.py:592-596
        fail:
          code: value-error
          message: Placement group bundle cannot have more than 1 GPU.
    - if: input.world_size > size(input.existing_bundles.filter(b, has(b.GPU) && b.GPU > 0))
      then:
      - title: Fewer device bundles than the world size
        source: vllm/v1/executor/ray_utils.py:599-605
        fail:
          code: value-error
          message: '= ''The number of required GPUs exceeds the total number of available GPUs in the placement group. Required number of devices: '' + string(input.world_size) + ''. Total number of devices:
            '' + string(size(input.existing_bundles.filter(b, has(b.GPU) && b.GPU > 0))) + ''.'''
    - return:
        bundles: = input.existing_bundles
        created: false
  - call: ray-cluster.available-resources-per-node
    as: res
  - set:
      vars.driver: = vars.res.value.filter(n, n.ip == input.driver_ip)
      vars.req: = !has(input.require_gpu_on_driver) || input.require_gpu_on_driver
  - if: vars.req && (size(vars.driver) == 0 || vars.driver[0].GPU < 1)
    then:
    - title: 'The driver node has no device: the engine can''t start'
      source: vllm/v1/executor/ray_utils.py:629-637
      fail:
        code: value-error
        message: = 'Current node has no GPU available. vLLM engine cannot start without GPU. Make sure you have at least 1 GPU available in a node current_ip=' + input.driver_ip + '.'
  - title: 'world_size one-device bundles; the first is pinned to the driver (''node:<ip>'': 0.001); PACK fills the driver node first, then the other nodes in order'
    source: vllm/v1/executor/ray_utils.py:614-648
    set:
      vars.order: '= (vars.req ? vars.driver : []) + vars.res.value.filter(n, !vars.req || n.ip != input.driver_ip)'
  - set:
      vars.slots: = vars.order.map(n, lists.range(int(n.GPU)).map(i, n.ip)).flatten()
  - if: size(vars.slots) < input.world_size
    then:
    - title: '_wait_until_pg_ready: the group can never be placed'
      source: vllm/v1/executor/ray_utils.py:649
      fail:
        code: value-error
        message: = 'Cannot provide a placement group of placement_group_specs=' + string(input.world_size) + ' GPU bundles within the timeout.'
  - call: ray-cluster.placement-group
    input:
      name: = 'vllm-ray-' + input.driver_ip
      strategy: PACK
      node_ip: = input.driver_ip
      num_devices: = input.world_size
  - set:
      vars.bundles: '= vars.slots.slice(0, input.world_size).map(ip, {''GPU'': 1, ''node_ip'': ip})'
  - if: vars.req && !vars.bundles.exists(b, b.node_ip == input.driver_ip)
    then:
    - title: '_verify_bundles: the driver node must be in the group'
      source: vllm/v1/executor/ray_utils.py:309-317
      fail:
        code: runtime-error
        message: driver node is not included in a placement group
  - return:
      bundles: = vars.bundles
      created: true
