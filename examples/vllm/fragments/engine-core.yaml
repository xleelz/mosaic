- component: llm-engine
  name: has-unfinished-requests-dp
  kind: function
  summary: 'LLMEngine.has_unfinished_requests_dp: all-reduce the local unfinished flag over the DP group (ParallelConfig.has_unfinished_dp); if only other ranks have work, the next step runs a dummy batch.'
  sources:
  - vllm/v1/engine/llm_engine.py:209-215
  request:
    type: object
    required:
    - has_unfinished
    properties:
      has_unfinished:
        type: boolean
      dp_rank:
        type: string
        default: dp0
  response:
    type: boolean
  behavior:
  - title: 'ParallelConfig.has_unfinished_dp: an all-reduce (MAX) of the flag over the DP process group; every DP rank calls it once per step'
    source: vllm/config/parallel.py:839-847
    rendezvous: dp-has-unfinished
    count: = config['data-parallel-size']
    value: = input.has_unfinished
    timeout_ms: 600000
    as: ar
  - set:
      vars.agg: = vars.ar.values.exists(v, v == true)
  - if: '!input.has_unfinished && vars.agg'
    then:
    - title: 'Another rank has work: run a dummy batch so the collectives line up'
      source: vllm/v1/engine/llm_engine.py:213-214
      set:
        state.should_execute_dummy_batch: true
  - return: = vars.agg
- component: dp-engine-core-proc
  name: run-busy-loop
  kind: function
  summary: 'One iteration of DPEngineCoreProc.run_busy_loop on one DP rank: process the input queue, step; when nothing ran but a wave is in progress, run a dummy batch; then all-reduce the unfinished flag,
    and when no rank has work, end the wave (rank 0 tells the coordinator, or each rank its front-end) and start the next.'
  sources:
  - vllm/v1/engine/core.py:2327-2409
  attributes:
    single_writer: each DP rank's engines_running, current_wave and step_counter are read and written only by that rank's busy-loop thread (vllm/v1/engine/core.py:2331-2393); other threads only put requests
      on the mutex-guarded input_queue, which the busy loop drains before each step (vllm/v1/engine/core.py:1574-1600)
  request:
    type: object
    properties:
      dp_rank:
        type: integer
        default: 0
      has_coordinator:
        type: boolean
        default: true
  response:
    type: object
  behavior:
  - set:
      vars.was_running: = state.engines_running
      vars.rank: '= has(input.dp_rank) ? input.dp_rank : 0'
      vars.coord: = !has(input.has_coordinator) || input.has_coordinator
  - title: 1) Poll the input queue until there is work to do
    source: vllm/v1/engine/core.py:2333-2334
    call: engine-core-proc.process-input-queue
    input:
      pump: true
  - title: 2) Step the engine
    source: vllm/v1/engine/core.py:2349
    call: engine-core-proc.process-engine-step
    as: st
  - call: scheduler.has-requests
    as: local
  - set:
      vars.executed: = vars.st.value.model_executed
      vars.local_unfinished: = vars.local.value
  - if: '!vars.executed && !vars.local_unfinished && !state.engines_running'
    then:
    - title: 'All engines are idle: loop again without a sync'
      source: vllm/v1/engine/core.py:2353-2356
      return:
        idle: true
        engines_running: false
        current_wave: = state.current_wave
  - if: '!vars.executed'
    then:
    - title: 'Nothing ran here but the wave is live: a dummy pass keeps the DP ranks'' MoE collectives in step'
      source: vllm/v1/engine/core.py:2358-2367
      call: engine-core.execute-dummy-batch
  - title: 3) All-reduce to learn whether any engine still has unfinished requests
    source: vllm/v1/engine/core.py:2369-2372
    call: dp-engine-core-proc.has-global-unfinished-reqs
    input:
      local_unfinished: = vars.local_unfinished
    as: g
  - set:
      state.engines_running: = vars.g.value
  - if: '!state.engines_running'
    then:
    - if: vars.rank == 0 || !vars.coord
      then:
      - title: 'Wave finished: notify (client -1 = the coordinator, else the colocated front-end) that the loop pauses'
        source: vllm/v1/engine/core.py:2374-2390
        set:
          state.wave_complete: = state.wave_complete + [state.current_wave]
    - title: Increment the wave count and reset the step counter
      source: vllm/v1/engine/core.py:2391-2393
      set:
        state.current_wave: = state.current_wave + 1
        state.step_counter: 0
    - return:
        idle: false
        engines_running: false
        current_wave: = state.current_wave
        dummy: = !vars.executed
  - if: '!vars.was_running && vars.coord && vars.rank == 0'
    then:
    - title: 'A wave started here: rank 0 tells the coordinator (start_wave)'
      source: vllm/v1/engine/core.py:2394-2407
      return:
        idle: false
        engines_running: true
        current_wave: = state.current_wave
        start_wave: = state.current_wave
        dummy: = !vars.executed
  - return:
      idle: false
      engines_running: true
      current_wave: = state.current_wave
      dummy: = !vars.executed
- component: dp-engine-core-proc
  name: has-global-unfinished-reqs
  kind: function
  summary: 'DPEngineCoreProc._has_global_unfinished_reqs: sync on step 1 and every dp_sync_interval-th step (an all-reduce over the DP group); other steps assume work remains.'
  sources:
  - vllm/v1/engine/core.py:2410-2428
  request:
    type: object
    required:
    - local_unfinished
    properties:
      local_unfinished:
        type: boolean
  response:
    type: boolean
  behavior:
  - set:
      state.step_counter: = state.step_counter + 1
  - if: state.step_counter != 1 && state.step_counter % config['dp-sync-interval'] != 0
    then:
    - title: 'Not a sync step: keep running'
      source: vllm/v1/engine/core.py:2413-2414
      return: true
  - title: 'ParallelConfig.sync_dp_state: all-reduce the unfinished flags over the DP group'
    source: vllm/v1/engine/core.py:2416-2420
    rendezvous: = 'dp-sync:' + string(state.current_wave) + ':' + string(state.step_counter)
    count: = config['data-parallel-size']
    value: = input.local_unfinished
    timeout_ms: 600000
    as: ar
  - return: = vars.ar.values.exists(v, v == true)
- component: dp-lb-async-mp-client
  name: run-engine-stats-update-task
  kind: function
  summary: 'One message of DPAsyncMPClient''s stats update task: a FIRST_REQ notice (a request sent while the engines are paused) wakes the wave through the coordinator; a SCALE_ELASTIC_EP notice resizes
    the managed engines; a stats message updates the wave, the running flag and the per-engine (waiting, running) counts.'
  sources:
  - vllm/v1/engine/core_client.py:1474-1576
  request:
    type: object
    properties:
      first_req:
        type:
        - integer
        - 'null'
        default: null
        description: FIRST_REQ target engine index
      scale_elastic_ep:
        type:
        - integer
        - 'null'
        default: null
        description: SCALE_ELASTIC_EP new engine count
      stats:
        type:
        - object
        - 'null'
        default: null
        properties:
          counts:
            type:
            - array
            - 'null'
          wave:
            type: integer
          running:
            type: boolean
  response:
    type: object
  behavior:
  - if: has(input.scale_elastic_ep) && input.scale_elastic_ep != null
    then:
    - if: input.scale_elastic_ep != config['data-parallel-size']
      then:
      - title: assert dp_size == new_engine_count
        source: vllm/v1/engine/core_client.py:1512-1514
        fail:
          code: assertion-error
          message: dp_size == new_engine_count
    - title: Resize lb_engines to the new engine count and forward the notice to the coordinator
      source: vllm/v1/engine/core_client.py:1519-1536
      set:
        state.lb_engines: '= size(state.lb_engines) < input.scale_elastic_ep ? state.lb_engines + lists.range(input.scale_elastic_ep - size(state.lb_engines)).map(i, [0, 0, 0.0]) : state.lb_engines.slice(0,
          input.scale_elastic_ep)'
    - return:
        sent:
        - SCALE_ELASTIC_EP
        - = input.scale_elastic_ep
  - if: has(input.first_req) && input.first_req != null
    then:
    - title: 'FIRST_REQ: a request went to a paused engine; engines_running and ask the coordinator to start the wave everywhere'
      source: vllm/v1/engine/core_client.py:1538-1547
      set:
        state.engines_running: true
    - return:
        sent:
        - = input.first_req
        - '= has(state.current_wave) ? state.current_wave : 0'
  - if: '!has(input.stats) || input.stats == null'
    then:
    - title: No stats event to drain
      source: vllm/v1/engine/core_client.py:1549-1559
      return:
        updated: false
  - title: 'Keep only the latest stats: the wave, whether engines run, and this client''s slice of the (waiting, running) counts'
    source: vllm/v1/engine/core_client.py:1562-1576
    set:
      state.current_wave: = input.stats.wave
      state.engines_running: = input.stats.running
      state.lb_engines: '= has(input.stats.counts) && input.stats.counts != null ? input.stats.counts.slice(0, int(math.least(size(input.stats.counts), config[''data-parallel-size'']))) : state.lb_engines'
  - return:
      updated: true
      lb_engines: = state.lb_engines
- component: async-llm
  name: scale-elastic-ep
  kind: function
  summary: 'AsyncLLM.scale_elastic_ep: under the elastic-EP lock, skip when the size is unchanged; prepare the client, recreate the stat loggers for a scale-up, optionally drain, commit, then adopt the
    new data_parallel_size.'
  sources:
  - vllm/v1/engine/async_llm.py:1244-1291
  attributes:
    single_writer: scale_elastic_ep holds async with self._elastic_ep_lock around _scale_elastic_ep, the only reader and writer of parallel_config.data_parallel_size here (async_llm.py:1248-1249)
  request:
    type: object
    required:
    - new_data_parallel_size
    properties:
      new_data_parallel_size:
        type: integer
        examples:
        - 4
      drain_timeout:
        type: integer
        default: 300
  response:
    type: object
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  - code: value-error
    status: 0
    retryable: false
  - code: assertion-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.old: '= has(state.data_parallel_size) ? state.data_parallel_size : config[''data-parallel-size'']'
  - if: vars.old == input.new_data_parallel_size
    then:
    - title: 'Data parallel size is already the target: skip'
      source: vllm/v1/engine/async_llm.py:1256-1262
      return:
        scaled: false
        data_parallel_size: = vars.old
  - title: engine_core.prepare_elastic_ep(new size)
    source: vllm/v1/engine/async_llm.py:1264
    call: dp-lb-async-mp-client.prepare-elastic-ep
    input:
      new_data_parallel_size: = input.new_data_parallel_size
  - if: input.new_data_parallel_size > vars.old && !config['disable-log-stats']
    then:
    - title: 'Scale-up: recreate the StatLoggerManager over the new engine indexes'
      source: vllm/v1/engine/async_llm.py:1267-1282
      call: stat-logger-manager.init
      input:
        custom: []
        enable_default_loggers: true
  - title: set_scaling_elastic_ep(True); drain first if VLLM_ELASTIC_EP_DRAIN_REQUESTS
    source: vllm/v1/engine/async_llm.py:1284-1286
    set:
      state.scaling_elastic_ep: true
      vars.drained: = config['vllm-elastic-ep-drain-requests']
  - title: engine_core.commit_elastic_ep(), then adopt the new size
    source: vllm/v1/engine/async_llm.py:1288-1291
    call: dp-lb-async-mp-client.commit-elastic-ep
  - set:
      state.data_parallel_size: = input.new_data_parallel_size
      state.scaling_elastic_ep: false
  - return:
      scaled: true
      data_parallel_size: = input.new_data_parallel_size
      drained: = vars.drained
- component: dp-lb-async-mp-client
  name: prepare-elastic-ep
  kind: function
  summary: 'DPLBAsyncMPClient.prepare_elastic_ep: idempotent for the same size, refused when another size is prepared; Ray backend only; bounded by elastic_ep_max_dp_size; the physical experts per engine
    stay fixed, so the redundant experts follow the new size and must not go negative.'
  sources:
  - vllm/v1/engine/core_client.py:1796-1835
  request:
    type: object
    required:
    - new_data_parallel_size
    properties:
      new_data_parallel_size:
        type: integer
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  - code: value-error
    status: 0
    retryable: false
  - code: assertion-error
    status: 0
    retryable: false
  behavior:
  - if: has(state.prepared_elastic_ep) && state.prepared_elastic_ep != null
    then:
    - if: state.prepared_elastic_ep[0] == input.new_data_parallel_size
      then:
      - return:
          prepared: = state.prepared_elastic_ep
    - title: Another scale is already prepared
      source: vllm/v1/engine/core_client.py:1798-1801
      fail:
        code: runtime-error
        message: Elastic EP scaling is already prepared
  - set:
      vars.cur: '= has(state.core_engines) ? state.core_engines : config[''data-parallel-size'']'
      vars.backend: '= has(state.data_parallel_backend) ? state.data_parallel_backend : ''mp'''
  - if: vars.backend != 'ray'
    then:
    - title: Only the Ray DP backend scales elastic EP
      source: vllm/v1/engine/core_client.py:1803-1805
      fail:
        code: assertion-error
        message: Only ray DP backend supports scaling elastic EP
  - if: has(state.elastic_ep_max_dp_size) && input.new_data_parallel_size > state.elastic_ep_max_dp_size
    then:
    - title: Above --elastic-ep-max-dp-size
      source: vllm/v1/engine/core_client.py:1807-1812
      fail:
        code: value-error
        message: = 'Cannot scale to data_parallel_size ' + string(input.new_data_parallel_size) + '; --elastic-ep-max-dp-size is ' + string(state.elastic_ep_max_dp_size) + '.'
  - set:
      vars.experts: '= has(state.num_experts) ? state.num_experts : 0'
      vars.redundant: '= has(state.num_redundant_experts) ? state.num_redundant_experts : 0'
  - set:
      vars.new_redundant: = (vars.experts + vars.redundant) * input.new_data_parallel_size / vars.cur - vars.experts
  - if: vars.new_redundant < 0
    then:
    - title: The logical experts no longer fit at that size
      source: vllm/v1/engine/core_client.py:1821-1830
      fail:
        code: value-error
        message: '= ''Cannot scale to data_parallel_size '' + string(input.new_data_parallel_size) + '': the experts no longer fit.'''
  - set:
      state.prepared_elastic_ep: = [input.new_data_parallel_size, vars.new_redundant]
  - return:
      prepared: = state.prepared_elastic_ep
- component: dp-lb-async-mp-client
  name: commit-elastic-ep
  kind: function
  summary: 'DPLBAsyncMPClient.commit_elastic_ep: refuse without a prepared scale; scale the engines up or down to the prepared size, adopt its redundant-expert count, clear the preparation.'
  sources:
  - vllm/v1/engine/core_client.py:1780-1794
  errors:
  - code: runtime-error
    status: 0
    retryable: false
  behavior:
  - if: '!has(state.prepared_elastic_ep) || state.prepared_elastic_ep == null'
    then:
    - title: Nothing prepared
      source: vllm/v1/engine/core_client.py:1782-1784
      fail:
        code: runtime-error
        message: Elastic EP scaling has not been prepared
  - title: '_commit_scale_up_elastic_ep or _commit_scale_down_elastic_ep: the managed engines become the prepared size'
    source: vllm/v1/engine/core_client.py:1785-1790
    set:
      state.core_engines: = state.prepared_elastic_ep[0]
      state.lb_engines: '= lists.range(state.prepared_elastic_ep[0]).map(i, size(state.lb_engines) > i ? state.lb_engines[i] : [0, 0, 0.0])'
      state.num_redundant_experts: = state.prepared_elastic_ep[1]
  - set:
      state.prepared_elastic_ep: null
  - return:
      committed: = state.core_engines
- component: async-llm
  name: add-streaming-input-request
  kind: function
  summary: 'AsyncLLM._add_streaming_input_request: generate() given an async generator of StreamingInput chunks. The params must allow streaming (generation, n == 1, not FINAL_ONLY, no stop strings); a
    placeholder final request ([0]) is validated and given the internal id; each chunk is processed as a resumable request under that id and added with the shared collector; once the stream closes, the
    final request marks the inputs finished.'
  sources:
  - vllm/v1/engine/async_llm.py:580-690
  - vllm/engine/protocol.py:31-40
  request:
    type: object
    required:
    - request_id
    - sampling_params
    - chunks
    properties:
      request_id:
        type: string
        examples:
        - session-1
      sampling_params:
        type: object
        properties:
          n:
            type: integer
            default: 1
          output_kind:
            type: string
            default: cumulative
          stop:
            type: array
            items:
              type: string
            default: []
          max_tokens:
            type:
            - integer
            - 'null'
            default: null
      pooling_params:
        type:
        - object
        - 'null'
        default: null
      chunks:
        type: array
        description: 'StreamingInput items: {prompt_token_ids, sampling_params?}'
        items:
          type: object
          properties:
            prompt_token_ids:
              type: array
              items:
                type: integer
            sampling_params:
              type:
              - object
              - 'null'
              default: null
  response:
    type: object
    properties:
      request_id:
        type: string
      added:
        type: integer
      finished_sent:
        type: boolean
  errors:
  - code: vllm-validation-error
    status: 0
    retryable: false
  behavior:
  - set:
      vars.sp: = input.sampling_params
  - if: has(input.pooling_params) && input.pooling_params != null || (has(vars.sp.n) && vars.sp.n > 1) || (has(vars.sp.output_kind) && vars.sp.output_kind.lowerAscii() == 'final_only') || (has(vars.sp.stop)
      && size(vars.sp.stop) > 0)
    then:
    - title: _validate_streaming_input_sampling_params
      source: vllm/v1/engine/async_llm.py:677-690
      fail:
        code: vllm-validation-error
        message: Input streaming not currently supported for pooling models, n > 1, request_kind = FINAL_ONLY or with stop strings.
  - title: The final request (prompt [0]) is validated now and later signals the end of the inputs; it fixes the internal request id
    source: vllm/v1/engine/async_llm.py:614-622
    call: input-processor.process-inputs
    input:
      request_id: = input.request_id
      prompt_token_ids:
      - 0
      sampling_params: = vars.sp
    as: final
  - call: input-processor.assign-request-id
    input: = vars.final.value
    as: rid
  - title: Ensure the output handler is running
    source: vllm/v1/engine/async_llm.py:671-672
    call: async-llm.run-output-handler
  - set:
      vars.added: 0
  - title: 'handle_inputs: each chunk (with its own params, validated, or the request''s) becomes a resumable request under the internal id, sharing the collector'
    source: vllm/v1/engine/async_llm.py:630-652
    foreach: = input.chunks
    as: chunk
    steps:
    - set:
        vars.csp: '= has(vars.chunk.sampling_params) && vars.chunk.sampling_params != null ? vars.chunk.sampling_params : vars.sp'
    - if: (has(vars.csp.n) && vars.csp.n > 1) || (has(vars.csp.output_kind) && vars.csp.output_kind.lowerAscii() == 'final_only') || (has(vars.csp.stop) && size(vars.csp.stop) > 0)
      then:
      - title: A chunk's params are validated too; the error goes into the queue as InputStreamError
        source: vllm/v1/engine/async_llm.py:631-634
        fail:
          code: vllm-validation-error
          message: Input streaming not currently supported for pooling models, n > 1, request_kind = FINAL_ONLY or with stop strings.
    - call: input-processor.process-inputs
      input:
        request_id: = vars.rid.value.request_id
        prompt_token_ids: = vars.chunk.prompt_token_ids
        sampling_params: = vars.csp
      as: creq
    - set:
        vars.req: '= merge(vars.creq.value, {''request_id'': vars.rid.value.request_id, ''external_req_id'': input.request_id, ''resumable'': true})'
    - if: vars.added == 0
      then:
      - call: output-processor.add-request
        input:
          request: = vars.req
          parent_request_id: null
          index: 0
    - title: '_add_request: ADD over ZMQ; the engine core appends a resumable request''s new prompt to the session'
      source: vllm/v1/engine/async_llm.py:648
      call: async-mp-client.add-request-async
      input: = vars.req
    - set:
        vars.added: = vars.added + 1
  - if: vars.added > 0
    then:
    - title: 'Inputs finished: the empty final request is sent so the engine finishes the session'
      source: vllm/v1/engine/async_llm.py:663-667
      call: async-mp-client.add-request-async
      input: '= merge(vars.final.value, {''request_id'': vars.rid.value.request_id, ''external_req_id'': input.request_id})'
    - return:
        request_id: = vars.rid.value.request_id
        added: = vars.added
        finished_sent: true
  - title: 'An empty stream: STREAM_FINISHED goes straight into the queue'
    source: vllm/v1/engine/async_llm.py:668-669
    return:
      request_id: = vars.rid.value.request_id
      added: 0
      finished_sent: false
- component: caching-metrics
  name: observe
  kind: function
  summary: 'CachingMetrics.observe: a reset in the stats clears the window first; an update with no requests is not appended (it would push useful history out); otherwise append and drop the oldest updates
    while more than max_recent_requests requests remain, keeping the latest. MultiModalCacheStats.record builds such an update per request; hits are attributed to a CacheHitSource tier.'
  sources:
  - vllm/v1/metrics/stats.py:59-98
  - vllm/v1/metrics/stats.py:100-110
  - vllm/v1/metrics/stats.py:181-185
  - vllm/v1/metrics/cache_hit_source.py:10-29
  request:
    type: object
    properties:
      stats:
        type: object
        properties:
          reset:
            type: boolean
            default: false
          requests:
            type: integer
          queries:
            type: integer
          hits:
            type: integer
      max_recent_requests:
        type: integer
        default: 1000
  response:
    type: object
    properties:
      empty:
        type: boolean
      hit_rate:
        type: number
  behavior:
  - if: has(input.stats.reset) && input.stats.reset
    then:
    - title: 'reset_prefix_cache ran before this update: reset the window'
      source: vllm/v1/metrics/stats.py:73-76
      set:
        state.window: []
        state.requests: 0
        state.queries: 0
        state.hits: 0
  - if: input.stats.requests == 0
    then:
    - title: Empty stats are not appended (they would push history out of the window)
      source: vllm/v1/metrics/stats.py:78-81
      return:
        empty: = state.requests == 0
        hit_rate: '= state.queries == 0 ? 0.0 : double(state.hits) / double(state.queries)'
  - set:
      vars.max: '= has(input.max_recent_requests) ? input.max_recent_requests : 1000'
      vars.window: = state.window + [[input.stats.requests, input.stats.queries, input.stats.hits]]
  - title: Drop the oldest updates while over max_recent_requests, always keeping the latest
    source: vllm/v1/metrics/stats.py:89-98
    foreach: = lists.range(size(vars.window))
    as: i
    steps:
    - if: size(vars.window) <= 1 || sum(vars.window.map(w, w[0])) <= vars.max
      then:
      - break: true
    - set:
        vars.window: = vars.window.slice(1, size(vars.window))
  - set:
      state.window: = vars.window
      state.requests: = sum(vars.window.map(w, w[0]))
      state.queries: = sum(vars.window.map(w, w[1]))
      state.hits: = sum(vars.window.map(w, w[2]))
  - return:
      empty: = state.requests == 0
      hit_rate: '= state.queries == 0 ? 0.0 : double(state.hits) / double(state.queries)'
- component: request-spec-decode-metrics
  name: observe
  kind: function
  summary: 'RequestSpecDecodeMetrics.new / observe / to_dict: one histogram bucket per accepted-draft count (0..num_spec_tokens); mean acceptance length counts the bonus token; the acceptance rate is draft-only.'
  sources:
  - vllm/v1/metrics/stats.py:381-395
  - vllm/v1/metrics/stats.py:397-422
  request:
    type: object
    required:
    - request_id
    - num_spec_tokens
    - num_draft_tokens
    - num_accepted
    properties:
      request_id:
        type: string
      num_spec_tokens:
        type: integer
      num_draft_tokens:
        type: integer
      num_accepted:
        type: integer
      detailed:
        type: boolean
        default: false
  response:
    type: object
  behavior:
  - title: 'RequestSpecDecodeMetrics.new: a zero histogram of num_spec_tokens + 1 buckets'
    source: vllm/v1/metrics/stats.py:381-386
    set:
      vars.m: '= input.request_id in state.requests ? state.requests[input.request_id] : {''histogram'': lists.range(input.num_spec_tokens + 1).map(i, 0), ''num_draft_tokens'': 0, ''per_step_accepted'':
        [], ''per_step_drafted'': []}'
  - if: input.num_accepted < 0 || input.num_accepted >= size(vars.m.histogram)
    then:
    - title: histogram[num_accepted] out of range
      source: vllm/v1/metrics/stats.py:390-391
      fail:
        code: index-error
        message: list index out of range
  - title: 'observe: count the step in its bucket and add the proposed drafts'
    source: vllm/v1/metrics/stats.py:388-395
    set:
      vars.m: '= {''histogram'': lists.range(size(vars.m.histogram)).map(i, vars.m.histogram[i] + (i == input.num_accepted ? 1 : 0)), ''num_draft_tokens'': vars.m.num_draft_tokens + input.num_draft_tokens,
        ''per_step_accepted'': has(input.detailed) && input.detailed ? vars.m.per_step_accepted + [input.num_accepted] : vars.m.per_step_accepted, ''per_step_drafted'': has(input.detailed) && input.detailed
        ? vars.m.per_step_drafted + [input.num_draft_tokens] : vars.m.per_step_drafted}'
  - set:
      state.requests: '= merge(state.requests, {input.request_id: vars.m})'
  - set:
      vars.steps: = sum(vars.m.histogram)
      vars.acc: = sum(lists.range(size(vars.m.histogram)).map(j, j * vars.m.histogram[j]))
  - title: 'to_dict: mean_acceptance_length = 1 + accepted / steps; draft_acceptance_rate = accepted / drafted'
    source: vllm/v1/metrics/stats.py:397-422
    return:
      acceptance_histogram: = vars.m.histogram
      num_spec_steps: = vars.steps
      num_accepted_draft_tokens: = vars.acc
      num_draft_tokens: = vars.m.num_draft_tokens
      mean_acceptance_length: '= vars.steps == 0 ? 1.0 : 1.0 + double(vars.acc) / double(vars.steps)'
      draft_acceptance_rate: '= vars.m.num_draft_tokens == 0 ? 0.0 : double(vars.acc) / double(vars.m.num_draft_tokens)'
- component: lora-stats
  name: update
  kind: function
  summary: 'LoRAStats.update: a request is waiting or running (never both); empty when neither set holds a request.'
  sources:
  - vllm/v1/metrics/stats.py:652-665
  request:
    type: object
    required:
    - request_id
    properties:
      request_id:
        type: string
      waiting:
        type: boolean
        default: false
      running:
        type: boolean
        default: false
  response:
    type: object
    properties:
      empty:
        type: boolean
  errors:
  - code: assertion-error
    status: 0
    retryable: false
  behavior:
  - if: input.waiting && input.running
    then:
    - title: assert not (waiting and running)
      source: vllm/v1/metrics/stats.py:653
      fail:
        code: assertion-error
        message: not (waiting and running)
  - set:
      state.waiting: '= input.waiting ? (input.request_id in state.waiting ? state.waiting : state.waiting + [input.request_id]) : state.waiting.filter(r, r != input.request_id)'
      state.running: '= input.running ? (input.request_id in state.running ? state.running : state.running + [input.request_id]) : state.running.filter(r, r != input.request_id)'
  - title: 'empty: no waiting and no running request'
    source: vllm/v1/metrics/stats.py:663-665
    return:
      empty: = size(state.waiting) == 0 && size(state.running) == 0
- component: output-processor
  name: append-to-constant-list
  kind: function
  summary: 'ConstantList (the read-only view vLLM hands out of a request''s token lists): append and extend raise TypeError.'
  sources:
  - vllm/v1/utils.py:48-56
  request:
    type: object
    properties:
      op:
        type: string
        enum:
        - append
        - extend
        default: append
  errors:
  - code: type-error
    status: 0
    retryable: false
  behavior:
  - if: has(input.op) && input.op == 'extend'
    then:
    - title: ConstantList.extend
      source: vllm/v1/utils.py:55-56
      fail:
        code: type-error
