  - trace.filter(e, e.type == 'call.start' && e.interface == 'async-mp-client.add-request-async' && e.input.request_id == steps.ok.result.value.request_id).size() == 3
  - trace.filter(e, e.type == 'call.start' && e.interface == 'async-mp-client.add-request-async' && has(e.input.resumable) && e.input.resumable).size() == 2
- id: engine-core-dp-busy-loop-flow-wave-then-idle
  name: The DP busy loop ends the live wave; the next sync starts the step count again
  description: 'Both ranks are in wave 0 with nothing to do: rank 0''s loop and rank 1''s iteration run a dummy batch and all-reduce; the wave ends and the step counter resets, so the next _has_global_unfinished_reqs
    on each rank is step 1 and syncs again.'
  fixtures:
  - full-tp1-llama-8b
  tags:
  - concurrency
  config:
    data-parallel-size: 2
  topology:
    dp-engine-core-proc:
    - dp0
    - dp1
  state:
    dp-engine-core-proc@dp0:
      engines_running: true
    dp-engine-core-proc@dp1:
      engines_running: true
  steps:
  - flow: dp-engine-core-busy-loop
    'on': dp0
    as: loop
    await: false
  - interface: dp-engine-core-proc.run-busy-loop
    caller: engine-core
    'on': dp1
    as: l1
    input:
      dp_rank: 1
  - interface: dp-engine-core-proc.has-global-unfinished-reqs
    caller: engine-core
    'on': dp0
    as: g0
    at_ms: 1000
    await: false
    input:
      local_unfinished: false
  - interface: dp-engine-core-proc.has-global-unfinished-reqs
    caller: engine-core
    'on': dp1
    as: g1
    at_ms: 1000
    input:
      local_unfinished: true
  expect:
  - steps.loop.result.ok && !steps.l1.result.value.engines_running
  - state['dp-engine-core-proc@dp0'].current_wave == 1 && state['dp-engine-core-proc@dp0'].wave_complete == [0]
  - steps.g0.result.value && steps.g1.result.value && state['dp-engine-core-proc@dp0'].step_counter == 1
- id: engine-core-dp-client-stats-flow
  name: The DP client's stats task keeps the latest wave and this client's engine counts
  fixtures:
