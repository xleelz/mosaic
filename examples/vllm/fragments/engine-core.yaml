- component: stat-logger-manager
  name: record
  kind: function
  summary: 'StatLoggerManager.record: every stat logger records the step; the Prometheus logger counts finished requests and generation tokens.'
  sources:
  - vllm/v1/metrics/loggers.py:1421-1436
  request:
    type: object
    properties:
      num_outputs:
        type: integer
      finished:
        type: integer
      num_prompt_tokens:
        type: integer
        default: 0
      scheduler_stats:
        type:
        - object
        - 'null'
        default: null
      engine_idx:
        type:
        - integer
        - 'null'
        default: null
  behavior:
  - set:
      vars.idx: '= has(input.engine_idx) && input.engine_idx != null ? input.engine_idx : 0'
  - title: 'for stat_logger in self.stat_loggers: stat_logger.record(scheduler_stats, iteration_stats, engine_idx) (StatLoggerBase.record)'
    source: vllm/v1/metrics/loggers.py:1430-1436
    foreach: = state.loggers.filter(l, l != 'PrometheusStatLogger')
    as: lg
    steps:
    - call: '= vars.lg == ''LoggingStatLogger'' ? ''logging-stat-logger.record'' : (vars.lg == ''AggregatedLoggingStatLogger'' ? ''logging-stat-logger.record-aggregated'' : ''per-engine-stat-logger-adapter.record'')'
      targets:
      - logging-stat-logger.record
      - logging-stat-logger.record-aggregated
      - per-engine-stat-logger-adapter.record
      input:
        engine_idx: = vars.idx
        iteration_stats:
          num_prompt_tokens: '= has(input.num_prompt_tokens) ? input.num_prompt_tokens : 0'
          num_generation_tokens: = input.num_outputs
        scheduler_stats: '= has(input.scheduler_stats) ? input.scheduler_stats : null'
  - title: 'PrometheusStatLogger.record: the generation-token and request-success counters'
    source: vllm/v1/metrics/loggers.py:1138-1330
    call: prometheus-registry.incr
    input:
      name: vllm:generation_tokens
      value: = input.num_outputs
  - if: input.finished > 0
    then:
    - call: prometheus-registry.incr
      input:
        name: vllm:request_success
        value: = input.finished
- component: stat-logger-manager
  name: record-admission-rejection
  kind: function
