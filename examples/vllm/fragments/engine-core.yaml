  - steps.o1.result.value.request_outputs[0].completions[0].text == ''
  - steps.o2.result.value.request_outputs[0].completions[0].text == ' t34173'
  - steps.o3.result.value.request_outputs[0].completions[0].text == ' t87' && steps.o3.result.value.request_outputs[0].finish_reason == 'stop' && steps.o3.result.value.request_outputs[0].stop_reason ==
