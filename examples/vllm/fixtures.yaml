# Shared worlds for the vLLM ontology (pipeline stage 3). Owned by the coordinator.
# Configs here are references (attributes.boundary). The owning area defines the real entity.
# "Deployed" means the fixture's `vllm serve` invocation: the defaults unless a fixture overrides them.
schema_version: 1
id: vllm

configs:
  - {id: max-num-seqs, type: integer, value: 1024, default: 128, summary: "max_num_seqs: the most requests scheduled in one step. `vllm serve` on an H100 resolves 1024 (usage-context default); the class default is 128", sources: ["vllm/config/scheduler.py:43", "vllm/engine/arg_utils.py:2939-2941"], attributes: {boundary: true, owner: scheduler-kv, key: max_num_seqs}}
  - {id: max-num-batched-tokens, type: integer, value: 8192, default: 2048, summary: "max_num_batched_tokens: the token budget of one step. `vllm serve` on an H100 resolves 8192 (usage-context default); the class default is 2048", sources: ["vllm/config/scheduler.py:41", "vllm/engine/arg_utils.py:2935-2937"], attributes: {boundary: true, owner: scheduler-kv, key: max_num_batched_tokens}}
  - {id: enable-chunked-prefill, type: boolean, value: true, default: true, summary: "enable_chunked_prefill", sources: ["vllm/config/scheduler.py:134"], attributes: {boundary: true, owner: scheduler-kv, key: enable_chunked_prefill}}
  - {id: scheduling-policy, type: string, value: fcfs, default: fcfs, summary: "the scheduler policy (fcfs or priority)", sources: ["vllm/config/scheduler.py:159"], attributes: {boundary: true, owner: scheduler-kv, key: policy}}
  - {id: block-size, type: integer, value: 16, default: 16, summary: "KV cache block size in tokens", sources: ["vllm/config/cache.py:72"], attributes: {boundary: true, owner: scheduler-kv, key: block_size}}
  - {id: enable-prefix-caching, type: boolean, value: true, default: true, summary: "enable_prefix_caching", sources: ["vllm/config/cache.py:141"], attributes: {boundary: true, owner: scheduler-kv, key: enable_prefix_caching}}
  - {id: gpu-memory-utilization, type: number, value: 0.92, default: 0.92, summary: "the fraction of GPU memory vLLM may use", sources: ["vllm/config/cache.py:102"], attributes: {boundary: true, owner: worker-runner, key: gpu_memory_utilization}}
  - {id: tensor-parallel-size, type: integer, value: 1, default: 1, summary: "tensor_parallel_size", sources: ["vllm/config/parallel.py:141"], attributes: {boundary: true, owner: distributed, key: tensor_parallel_size}}
  - {id: max-model-len, type: integer, value: 131072, default: 131072, summary: "max_model_len: unset by default, so derived from the model config (Llama-3.1: 131072)", sources: ["vllm/config/model.py:245"], attributes: {boundary: true, owner: config-platform, key: max_model_len}}

