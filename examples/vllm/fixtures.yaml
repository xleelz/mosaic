        generation_configs:
          mistralai/Mixtral-8x7B-Instruct-v0.1: {bos_token_id: 1, eos_token_id: 2}
      gpu-model-runner:
        model: {name: mistralai/Mixtral-8x7B-Instruct-v0.1, architecture: MixtralForCausalLM, num_hidden_layers: 32, num_kv_heads: 8, num_attention_heads: 32, head_size: 128, dtype_bytes: 2, torch_dtype: bfloat16, vocab_size: 32000, hidden_size: 4096, max_position_embeddings: 32768, weights_bytes: 93405585408, eos_token_id: 2, is_hybrid: false, uses_mrope: false, uses_prompt_embeds: false}
        max_model_len: 32768
  # Code: vllm/config/model.py:817-868, vllm/config/model.py:1981-1982, vllm/config/multimodal.py:307, vllm/config/multimodal.py:695-708, vllm/config/multimodal.py:357, vllm/config/multimodal.py:369, vllm/config/scheduler.py:303-304, vllm/v1/core/encoder_cache_manager.py:356-361, vllm/assets/image.py:42-48
