  - id: tp2-llama-8b
    summary: "Two 80 GB GPUs (rank0, rank1) serving Llama-3.1-8B-Instruct with tensor_parallel_size 2: a dense TP 2 deployment."
    extends: [tp1-llama-8b]
    topology: {gpu-worker: [rank0, rank1]}
    config: {tensor-parallel-size: 2}
    state:
      platforms: {host: {nvml_gpu_count: 2, device_count: 2}}
      "gpu-memory@rank0": {weights_bytes: 0}
      "gpu-memory@rank1": {total_bytes: 85899345920, weights_bytes: 0, kv_cache_bytes: 0, peak_activation_bytes: 0}
  - id: small-batch-limits
    summary: "tp1-llama-8b with max_num_seqs 2 and max_num_batched_tokens 64, so batching limits show in short scenarios."
