  # ---- model-type worlds (round 5): MoE, vision-language, FP8 checkpoint ----
  # Code: vllm/config/model.py:2276-2277, vllm/transformers_utils/model_arch_config_convertor.py:189-198, vllm/config/parallel.py:189, vllm/model_executor/layers/fused_moe/config.py:1189-1235
  - id: moe-mixtral-8x7b-tp2-ep
    summary: "Two NVIDIA H100 80GB HBM3 (rank0, rank1) serving mistralai/Mixtral-8x7B-Instruct-v0.1 as mixtral-8x7b through `vllm serve --tensor-parallel-size 2 --enable-expert-parallel`: an MoE checkpoint (num_local_experts 8, num_experts_per_tok 2), so ModelConfig.is_moe is true (get_num_experts() > 0) and FusedMoEParallelConfig gives each rank 4 whole experts (use_ep, ep_size = TP x DP = 2, MoE tp_size 1). max_model_len derives from the checkpoint (32768)."
    extends: [tp1-llama-8b]
    topology: {gpu-worker: [rank0, rank1]}
    config:
      model: mistralai/Mixtral-8x7B-Instruct-v0.1
