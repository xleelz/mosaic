          neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV: {architectures: [LlamaForCausalLM], model_type: llama, num_hidden_layers: 32, num_attention_heads: 32, num_key_value_heads: 8, hidden_size: 4096, intermediate_size: 14336, vocab_size: 128256, max_position_embeddings: 8192, rope_theta: 500000.0, eos_token_id: 128009, torch_dtype: bfloat16, quantization_config: {quant_method: fp8, activation_scheme: static, kv_cache_scheme: static, ignored_layers: [lm_head]}, weights_bytes: 9081200640}
        generation_configs:
          neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV: {bos_token_id: 128000, eos_token_id: [128001, 128009], do_sample: true, temperature: 0.6, top_p: 0.9, max_length: 4096}
      gpu-model-runner:
        model: {name: neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV, architecture: LlamaForCausalLM, num_hidden_layers: 32, num_kv_heads: 8, num_attention_heads: 32, head_size: 128, dtype_bytes: 2, torch_dtype: bfloat16, vocab_size: 128256, hidden_size: 4096, max_position_embeddings: 8192, weights_bytes: 9081200640, eos_token_id: 128009, is_hybrid: false, uses_mrope: false, uses_prompt_embeds: false}
        max_model_len: 8192
