  - id: fp8-llama-3-8b
    summary: "One NVIDIA H100 80GB HBM3 (rank0) serving the FP8 checkpoint neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV (the model vLLM's FP8 tests load) as llama-3-8b-fp8 through `vllm serve` with no --quantization and the default --kv-cache-dtype auto: ModelConfig._verify_quantization takes quant_method fp8 from the checkpoint's quantization_config (Fp8Config: is_checkpoint_fp8_serialized, static activation scales, lm_head unquantized), and auto keeps the KV cache in the model dtype (bfloat16), since only ModelOpt configs name a KV algorithm. max_model_len derives from the checkpoint (8192)."
    extends: [tp1-llama-8b]
    config:
      model: neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV
