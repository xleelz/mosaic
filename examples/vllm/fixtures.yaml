  - id: fp8-llama-3-8b-kv-fp8
    summary: "fp8-llama-3-8b with --kv-cache-dtype fp8: the KV cache is stored as fp8_e4m3 (1 byte per element), using the checkpoint's k/v scales."
    extends: [fp8-llama-3-8b]
    config: {kv-cache-dtype: fp8}

scenarios:
  - id: fixture-smoke-tp2-llama-8b
    name: "The dense TP 2 world starts and serves a chat through its two ranks"
    fixtures: [full-tp2-llama-8b]
    steps:
      - {flow: engine-startup, as: up}
      - {flow: serving-api-chat-completion, as: chat, input: {body: {max_tokens: 2}}}
    expect:
      - "steps.up.result.ok && steps.up.result.value.executor_class == 'MultiprocExecutor'"
      - "steps.chat.result.ok && steps.chat.result.value.usage.completion_tokens == 2"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.execute-model' && e.instance == 'rank1')"
  - id: fixture-smoke-moe-mixtral-8x7b-tp2-ep
    name: "The MoE world loads: vllm serve resolves an MoE TP 2 + EP config, rank0 loads Mixtral with 4 local experts, and a chat request is served"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    # config-platform-seed (merged after this world) describes a one-GPU host; until config-platform
    # adds a variant_of for this world (reconcile/round5/worlds.md), the scenario restores two GPUs.
    state: {platforms: {host: {nvml_gpu_count: 2, device_count: 2}}}
    steps:
      - {flow: config-create-engine-config, as: cfg, input: {model: "= config['model']"}}
      - {flow: wr-load-model, as: load}
      - {flow: serving-api-chat-completion, as: chat, input: {body: {model: mixtral-8x7b, max_tokens: 4}}}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.is_moe && steps.cfg.result.value.model_config.max_model_len == 32768"
      - "steps.cfg.result.value.parallel_config.world_size == 2 && steps.cfg.result.value.parallel_config.enable_expert_parallel"
      - "steps.load.result.ok && state['mixtral-for-causal-lm@rank0'].cfg.num_experts == 8 && state['mixtral-for-causal-lm@rank0'].cfg.top_k == 2 && state['mixtral-for-causal-lm@rank0'].cfg.ep_size == 2 && state['gpu-memory@rank0'].weights_bytes == 46702792704"
      - "steps.chat.result.ok && steps.chat.result.value.model == 'mixtral-8x7b'"
  - id: fixture-smoke-vl-qwen2-vl-7b
    name: "The vision-language world loads: vllm serve builds a MultiModalConfig for Qwen2-VL, rank0 loads it, and a chat request with an image part reaches the engine"
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {flow: config-create-engine-config, as: cfg, input: {model: "= config['model']"}}
      - {flow: wr-load-model, as: load}
      - flow: serving-api-chat-completion
        as: chat
        input:
          body:
            model: qwen2-vl-7b
            max_tokens: 4
            messages:
              - role: user
                content:
                  - {type: image_url, image_url: {url: "data:image/jpeg;base64,/9j/4AAQ"}}
                  - {type: text, text: "What is in this image?"}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.multimodal_config != null && steps.cfg.result.value.model_config.max_model_len == 32768"
      - "steps.load.result.ok && state['gpu-memory@rank0'].weights_bytes == 16582751232"
      - "steps.chat.result.ok && steps.chat.result.value.model == 'qwen2-vl-7b'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && has(e.input.multi_modal_data))"
  - id: fixture-smoke-fp8-llama-3-8b
    name: "The FP8 world loads: the checkpoint's quant_method fp8 becomes ModelConfig.quantization, rank0 loads it, and a chat request is served"
    fixtures: [full-fp8-llama-3-8b]
    steps:
      - {flow: config-create-engine-config, as: cfg, input: {model: "= config['model']"}}
      - {flow: wr-load-model, as: load}
      - {flow: serving-api-chat-completion, as: chat, input: {body: {model: llama-3-8b-fp8, max_tokens: 4}}}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.quantization == 'fp8' && steps.cfg.result.value.model_config.max_model_len == 8192"
      - "config['kv-cache-dtype'] == 'auto'"
      - "steps.load.result.ok && state['llama-for-causal-lm@rank0'].quant == 'fp8' && state['gpu-memory@rank0'].weights_bytes == 9081200640"
      - "steps.chat.result.ok && steps.chat.result.value.model == 'llama-3-8b-fp8'"
  - id: fixture-smoke-fp8-llama-3-8b-kv-fp8
    name: "The FP8 world with --kv-cache-dtype fp8 loads and serves a chat request"
    fixtures: [full-fp8-llama-3-8b-kv-fp8]
    steps:
      - {flow: config-create-engine-config, as: cfg, input: {model: "= config['model']"}}
      - {flow: serving-api-chat-completion, as: chat, input: {body: {model: llama-3-8b-fp8, max_tokens: 4}}}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.quantization == 'fp8'"
      - "config['kv-cache-dtype'] == 'fp8'"
      - "steps.chat.result.ok && steps.chat.result.value.model == 'llama-3-8b-fp8'"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'openai-serving-chat.post-v1-chat-completions')"
