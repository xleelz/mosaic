schema_version: 1
id: vllm
scenarios:
  - id: bench-s2
    name: "S2: streaming chat, include_usage, then no stream_options, then continuous_usage_stats"
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 5, worker-runner-natural-output-tokens-spread: 1}
    steps:
      - flow: serving-api-chat-stream
        input: {body: {model: llama-8b, stream: true, stream_options: {include_usage: true}, max_tokens: 64, max_completion_tokens: {$null: true}}}
        as: usage
      - flow: serving-api-chat-stream
        input: {body: {model: llama-8b, stream: true, stream_options: {$null: true}, max_tokens: 64, max_completion_tokens: {$null: true}}}
        as: plain
      - flow: serving-api-chat-stream
        input: {body: {model: llama-8b, stream: true, stream_options: {include_usage: true, continuous_usage_stats: true}, max_tokens: 64, max_completion_tokens: {$null: true}}}
        as: cont
    expect:
      # (a) every data chunk is a chat.completion.chunk with one id
      - "steps.usage.result.value.items.filter(c, !('data' in c)).all(c, c.object == 'chat.completion.chunk' && c.id == steps.usage.result.value.items[0].id) && steps.usage.result.value.items[0].id.startsWith('chatcmpl-')"
      # (b) role first, then content deltas with finish_reason null
      - "steps.usage.result.value.items[0].choices[0].delta.role == 'assistant' && steps.usage.result.value.items[1].choices[0].finish_reason == null && 'content' in steps.usage.result.value.items[1].choices[0].delta"
      # (c) last content chunk carries finish_reason
      - "steps.usage.result.value.items[size(steps.usage.result.value.items) - 3].choices[0].finish_reason == 'stop'"
      # (d) a usage chunk with choices [] then [DONE]
      - "size(steps.usage.result.value.items[size(steps.usage.result.value.items) - 2].choices) == 0 && steps.usage.result.value.items[size(steps.usage.result.value.items) - 2].usage.total_tokens == steps.usage.result.value.items[size(steps.usage.result.value.items) - 2].usage.prompt_tokens + steps.usage.result.value.items[size(steps.usage.result.value.items) - 2].usage.completion_tokens && steps.usage.result.value.items[size(steps.usage.result.value.items) - 1].data == '[DONE]'"
      # (e) no usage without stream_options
      - "steps.plain.result.value.items.all(c, !('usage' in c))"
      # (f) continuous_usage_stats: usage on every content chunk, completion_tokens growing
      - "steps.cont.result.value.items.filter(c, 'choices' in c && size(c.choices) > 0).all(c, 'usage' in c)"
