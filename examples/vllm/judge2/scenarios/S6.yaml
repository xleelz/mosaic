schema_version: 1
id: vllm
scenarios:
  - id: bench-s6
    name: "S6: max_tokens validation on chat"
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    steps:
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 0, max_completion_tokens: {$null: true}, stream_options: {$null: true}}}
        as: zero
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 5, min_tokens: 10, max_completion_tokens: {$null: true}, stream_options: {$null: true}}}
        as: minmax
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 100, max_completion_tokens: 20, stream_options: {$null: true}}}
        as: both
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 8, max_completion_tokens: {$null: true}, stream_options: {include_usage: true}}}
        as: opts
    expect:
      # (a) SamplingParams._verify_args (sampling_params.py:688-693), param max_tokens
      - "!steps.zero.result.ok && steps.zero.result.error.status == 400 && steps.zero.result.error.message.contains('max_tokens must be at least 1')"
      - "!steps.zero.result.ok && steps.zero.result.error.data != null && steps.zero.result.error.data.param == 'max_tokens'"
      # (b) min_tokens > max_tokens: raised by SamplingParams at to_sampling_params (sampling_params.py:698-702), before generate
      - "!steps.minmax.result.ok && steps.minmax.result.error.status == 400 && steps.minmax.result.error.message.contains('min_tokens must be less than or equal to max_tokens=5')"
      - "!trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.max_tokens == 5)"
      # (c) max_completion_tokens wins
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.max_tokens == 20) && steps.both.result.value.usage.completion_tokens <= 20"
      # (d) stream_options without stream (chat_completion/protocol.py:822-830)
      - "!steps.opts.result.ok && steps.opts.result.error.status == 400 && steps.opts.result.error.message.contains('Stream options can only be defined when')"
