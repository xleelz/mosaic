schema_version: 1
id: vllm
scenarios:
  - id: bench-p3
    name: "P3: EAGLE3 (k=3) at temperature 0: one target forward verifies drafts with the rejection sampler; spec-decode stats/metrics"
    fixtures: [full-tp1-llama-8b]
    config:
      speculative-method: eagle3
      num-speculative-tokens: 3
    state:
      cuda-graph-manager: {decode_query_len: 4}
      gpu-model-runner:
        fresh_slots_used: 1
        draft_tokens: {chatcmpl-abc123: [201, 202, 203]}
        slots:
          chatcmpl-abc123: {prefill_len: 100, prompt_len: 100, slot: 1023}
        speculator: target-dependent-ar-speculator
      sampler:
        slots:
          '1023': {logit_bias: false, logprobs: -1, min_p: 0, needs_processing: false, penalties: false, seeded: false, temperature: 0, thinking: false, top_k: 128256, top_p: 1}
    steps:
      - flow: wr-spec-decode-step
        input:
          num_scheduled_tokens: {chatcmpl-abc123: 4}
          scheduled_cached_reqs: {new_block_ids: [[]], num_computed_tokens: [100], req_ids: [chatcmpl-abc123]}
          scheduled_spec_decode_tokens: {chatcmpl-abc123: [-1, -1, -1]}
          total_num_scheduled_tokens: 4
        as: e1
      - flow: wr-sample-tokens
        as: s1
      # scheduler side: drafts scheduled, 1 of 3 accepted -> stats (num_draft_tokens 3, num_accepted 1)
      - flow: scheduler-add-request
        input:
          request_id: req-sd
          prompt_token_ids: [128000, 9906, 11, 856, 836, 374]
          sampling_params: {max_tokens: 32, temperature: 0}
        as: add
      - flow: scheduler-schedule
        input: {}
        as: t1
      - flow: scheduler-update-from-output
        input:
          model_runner_output: {req_ids: [req-sd], sampled_token_ids: [[791]]}
          scheduler_output: "= steps.t1.result.value"
        as: v1
      - flow: scheduler-schedule
        input: {}
        as: t2
      - flow: scheduler-update-from-output
        input:
          model_runner_output: {req_ids: [req-sd], sampled_token_ids: [[201, 202]]}
          scheduler_output: "= steps.t2.result.value"
        as: v2
    expect:
      # path: one target forward + the rejection sampler (greedy at T=0)
      - "calls['rejection-sampler.sample'] == 1"
      - "steps.s1.result.value.sampled_token_ids[0].slice(0, 3) == [201, 202, 203] && size(steps.s1.result.value.sampled_token_ids[0]) == 4"
      # (c) SchedulerStats.spec_decoding_stats carries num_draft_tokens / num_accepted_tokens (scheduler.py:2128-2134)
      - "has(steps.v2.result.value.scheduler_stats) && has(steps.v2.result.value.scheduler_stats.spec_decoding_stats) && steps.v2.result.value.scheduler_stats.spec_decoding_stats.num_draft_tokens == 3 && steps.v2.result.value.scheduler_stats.spec_decoding_stats.num_accepted_tokens == 1"
