  - steps.s2.result.value.num_scheduled_tokens['r102'] == 12 && size(steps.s2.result.value.scheduled_new_reqs) == 25
  - 'steps.c2.result.value == {''num_running'': 128, ''num_waiting'': 72} && steps.c3.result.value.num_running == 128'
  - size(steps.s3.result.value.scheduled_new_reqs) == 0 && size(steps.s3.result.value.num_scheduled_tokens) <= 128
