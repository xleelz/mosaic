schema_version: 1
id: vllm
scenarios:
  - id: bench-s10-choice
    name: "S10: structured_outputs choice [positive, negative]"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input: {body: {model: llama-8b, stream: false, max_tokens: 16, max_completion_tokens: {$null: true}, stream_options: {$null: true}, structured_outputs: {choice: [positive, negative]}, response_format: {$null: true}}}
    expect:
      # (a) waits as WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR while grammar_init compiles (request.py:116-117, core.py:1104-1110)
      - "calls['structured-output-manager.grammar-init'] >= 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler.add-request' && e.output.status == 'WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR')"
      # (b) bitmask filled by the scheduler, applied by the runner, FSM advanced
      - "calls['xgrammar-grammar.fill-bitmask'] >= 1 && calls['structured-outputs-worker.apply-grammar-bitmask'] >= 1 && calls['structured-output-manager.accept-tokens'] >= 1"
      # (c) output is one of the choices; (d) finish_reason stop
      - "result.ok && result.value.choices[0].message.content in ['positive', 'negative']"
      - "result.ok && result.value.choices[0].finish_reason == 'stop'"
  - id: bench-s10-json-schema-wire
    name: "S10: response_format json_schema in OpenAI wire shape ({name, schema})"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input: {body: {model: llama-8b, stream: false, max_tokens: 16, max_completion_tokens: {$null: true}, stream_options: {$null: true}, structured_outputs: {$null: true}, response_format: {type: json_schema, json_schema: {name: s, schema: {type: object, properties: {a: {type: integer}}, required: [a]}}}}}
    expect:
      - "result.ok && result.value.choices[0].finish_reason == 'stop'"
      - "calls['structured-output-manager.grammar-init'] >= 1"
