schema_version: 1
id: vllm
scenarios:
  - id: bench-s1
    name: "S1: non-streaming /v1/completions, prompt Hello, no max_tokens"
    flow: serving-api-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input:
      body: {prompt: ["Hello"], model: llama-8b, max_tokens: {$absent: true}, stream: false}
    expect:
      # (a) CompletionRequest.max_tokens defaults to 16 (completion/protocol.py:63, 432-436), so get_max_tokens gives 16
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'api-utils.get-max-tokens' && e.output.max_tokens == 16)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.sampling_params.max_tokens == 16)"
      # (b) CompletionResponse shape (completion/protocol.py:654-699)
      - "result.ok && result.value.id.startsWith('cmpl-') && result.value.object == 'text_completion' && result.value.model == 'llama-8b'"
      - "result.ok && 'created' in result.value && 'logprobs' in result.value.choices[0] && result.value.choices[0].logprobs == null && 'stop_reason' in result.value.choices[0] && result.value.choices[0].index == 0 && 'finish_reason' in result.value.choices[0]"
      # (c) UsageInfo total = prompt + completion
      - "result.ok && 'total_tokens' in result.value.usage && result.value.usage.total_tokens == result.value.usage.prompt_tokens + result.value.usage.completion_tokens"
