schema_version: 1
id: vllm
scenarios:
  - id: bench-s9
    name: "S9: special tokens and logprobs (ignore_eos makes the model emit <|eot_id|> 128009 as a special token)"
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 3, worker-runner-natural-output-tokens-spread: 1}
    steps:
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 4, max_completion_tokens: {$null: true}, stream_options: {$null: true}, ignore_eos: true}}
        as: skip
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 4, max_completion_tokens: {$null: true}, stream_options: {$null: true}, ignore_eos: true, skip_special_tokens: false}}
        as: noskip
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 4, max_completion_tokens: {$null: true}, stream_options: {$null: true}, logprobs: true, top_logprobs: 3}}
        as: lp3
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 4, max_completion_tokens: {$null: true}, stream_options: {$null: true}, logprobs: true, top_logprobs: 25}}
        as: lp25
    expect:
      # (a) default skip_special_tokens: the special token's text is dropped but counted
      - "steps.skip.result.ok && steps.skip.result.value.usage.completion_tokens == 4 && !steps.skip.result.value.choices[0].message.content.contains('128009')"
      # (b) skip_special_tokens false: the token appears verbatim
      - "steps.noskip.result.ok && steps.noskip.result.value.choices[0].message.content.contains('<|eot_id|>')"
      # (c) logprobs content with 3 top_logprobs; 25 > max_logprobs 20 rejected
      - "steps.lp3.result.ok && 'logprobs' in steps.lp3.result.value.choices[0] && steps.lp3.result.value.choices[0].logprobs.content.all(c, 'token' in c && 'logprob' in c && 'bytes' in c && size(c.top_logprobs) == 3)"
      - "!steps.lp25.result.ok && steps.lp25.result.error.status == 400"
