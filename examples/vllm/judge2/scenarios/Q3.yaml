schema_version: 1
id: vllm
scenarios:
  - id: bench-q3-create-engine-config
    name: "Q3: --no-enable-chunked-prefill --max-num-batched-tokens 2048 --max-model-len 8192 fails SchedulerConfig validation"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {enable_chunked_prefill: false, max_num_batched_tokens: 2048, max_model_len: 8192}
    expect:
      - "!result.ok && result.error.code == 'value-error'"
      - "result.error.message.contains('max_num_batched_tokens (2048) is smaller than max_model_len (8192)')"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler-config.verify-max-model-len' && e.error != null)"
      - "calls['scheduler-config.post-init'] == 1"
  - id: bench-q3-vllm-serve
    name: "Q3 through vllm serve: startup fails and the API server never listens"
    flow: config-vllm-cli
    fixtures: [full-tp1-llama-8b]
    input: {engine_args: {enable_chunked_prefill: false, max_num_batched_tokens: 2048, max_model_len: 8192}}
    max_events: 200000
    expect:
      - "!result.ok"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler-config.verify-max-model-len' && e.error != null)"
      - "calls['engine-core.init'] == 0"
  - id: bench-q3-control-chunked-on
    name: "Q3 control: the same budget with chunked prefill on is accepted"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {enable_chunked_prefill: true, max_num_batched_tokens: 2048, max_model_len: 8192}
    expect:
      - "result.ok"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'scheduler-config.verify-max-model-len' && e.error == null)"
