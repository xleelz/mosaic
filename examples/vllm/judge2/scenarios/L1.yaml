schema_version: 1
id: vllm
scenarios:
  - id: bench-l1
    name: "L1 requests during startup; /v1/models once up"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: api-server-entry.run-server, caller: operator, input: {}, as: up, await: false}
      - {flow: serving-api-health, at_ms: 100, as: early}
      - {flow: serving-api-models-list, at_ms: 2000, as: models}
    expect:
      # (a) path: socket bound (setup_server) before the engine starts; uvicorn serves only after AsyncLLM is ready
      - "steps.up.result.ok"
      - "trace.exists(s, s.type == 'call.start' && s.interface == 'launcher.setup-server' && trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.from-vllm-config' && e.seq > s.seq && trace.exists(h, h.type == 'call.start' && h.interface == 'launcher.serve-http' && h.seq > e.seq)))"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'engine-core.initialize-kv-caches' && trace.exists(h, h.type == 'call.start' && h.interface == 'launcher.serve-http' && h.seq > e.seq))"
      # (a) outcome: a /health during load is not served (no listener yet)
      - "!steps.early.result.ok"
      - "steps.early.result.value.status_code != 200"
      # (b)
      - "steps.models.result.ok"
      - "steps.models.result.value.data.size() == 1"
      - "steps.models.result.value.data[0].id == 'llama-8b'"
      - "steps.models.result.value.data[0].object == 'model'"
      - "steps.models.result.value.data[0].owned_by == 'vllm'"
      - "steps.models.result.value.data[0].max_model_len == 131072"
      - "steps.models.result.value.object == 'list'"
