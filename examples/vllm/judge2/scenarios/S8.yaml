schema_version: 1
id: vllm
scenarios:
  - id: bench-s8-utf8
    name: "S8 (a): a multi-byte character split across byte-level tokens (no input can drive it: token text is the stand-in ' t<id>')"
    flow: serving-api-chat-stream
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 6, worker-runner-natural-output-tokens-spread: 1}
    input: {body: {model: llama-8b, stream: true, max_tokens: 16, max_completion_tokens: {$null: true}, stream_options: {$null: true}}}
    expect:
      - "result.value.items.filter(c, 'choices' in c && size(c.choices) > 0).all(c, !c.choices[0].delta.content.contains('\\uFFFD'))"
      - "trace.exists(e, e.type == 'note' && e.title.contains('UTF-8'))"
  - id: bench-s8-cross-token-stop
    name: "S8 (b): a stop string split across two tokens (' t87126' + ' t61590'; stop '126 t615' stands in for 'END' after 'xEN' + 'D')"
    flow: serving-api-chat-stream
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 40, worker-runner-natural-output-tokens-spread: 1}
    input: {body: {model: llama-8b, stream: true, max_tokens: 16, max_completion_tokens: {$null: true}, stream_options: {$null: true}, stop: ["126 t615"], include_stop_str_in_output: false}}
    expect:
      - "result.value.items.filter(c, 'choices' in c && size(c.choices) > 0).map(c, c.choices[0].delta.content).join('') == ' t34173 t87'"
      - "result.value.items.filter(c, 'choices' in c && size(c.choices) > 0).all(c, !c.choices[0].delta.content.contains('t87126'))"
      - "result.value.items.exists(c, 'choices' in c && size(c.choices) > 0 && c.choices[0].finish_reason == 'stop')"
  - id: bench-s8-include-stop
    name: "S8 (c): include_stop_str_in_output keeps the stop string"
    flow: serving-api-chat-stream
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 40, worker-runner-natural-output-tokens-spread: 1}
    input: {body: {model: llama-8b, stream: true, max_tokens: 16, max_completion_tokens: {$null: true}, stream_options: {$null: true}, stop: [" t61590"], include_stop_str_in_output: true}}
    expect:
      - "result.value.items.filter(c, 'choices' in c && size(c.choices) > 0).map(c, c.choices[0].delta.content).join('') == ' t34173 t87126 t61590'"
      - "result.value.items.exists(c, 'choices' in c && size(c.choices) > 0 && c.choices[0].finish_reason == 'stop')"
