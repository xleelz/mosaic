    block-pool:
      num_gpu_blocks: 8
      next_fresh: 1
      free_front: []
      free_tail: []
      ref_cnt: {}
      block_hash: {}
      cached: {}
      hash_tokens: {}
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: r1
      prompt_token_ids: &id001
      - 128000
      - 5000
      - 5001
