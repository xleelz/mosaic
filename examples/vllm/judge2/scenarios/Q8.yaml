      - 5044
      - 5045
      - 5046
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-finish-requests
    as: f1
    input:
      request_ids:
      - r1
  - interface: block-pool.get-num-free-blocks
    caller: kv-cache-manager
    as: free1
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: r2
