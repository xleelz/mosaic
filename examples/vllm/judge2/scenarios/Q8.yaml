      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-finish-requests
    as: f2
    input:
      request_ids:
      - r2
  - flow: scheduler-add-request
    as: a3
    input:
      request_id: r3
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s3
    input: {}
  expect:
  - steps.s1.result.value.scheduled_new_reqs[0].block_ids == [1, 2, 3]
  - steps.free1.result.value.num_free_blocks == 7
  - steps.s2.result.value.scheduled_new_reqs[0].block_ids == [4, 5, 6, 7, 3]
  - trace.exists(e, e.type == 'call.end' && e.interface == 'block-pool.get-new-blocks' && e.output.evicted_hashes.size() == 1)
  - trace.filter(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.get-computed-blocks').map(e, e.output.num_computed_tokens) == [0, 0, 32]
  - steps.s3.result.value.scheduled_new_reqs[0].block_ids == [1, 2, 3]
  - steps.s3.result.value.num_scheduled_tokens['r3'] == 16
- id: bench-q8-cache-salt-isolation
  name: 'Q8(a): same prompt, different cache_salt shares no blocks (code); EXPECTED TO FAIL: the model ignores cache_salt and hits 32 tokens'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: s-a
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 4
      cache_salt: tenant-a
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: s-b
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 4
      cache_salt: tenant-b
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - trace.filter(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.get-computed-blocks').map(e, e.output.num_computed_tokens) == [0, 0]
