schema_version: 1
id: vllm
scenarios:
  - id: bench-q6-priority-arrival-waits
    name: "Q6 priority: KV full of priority-10 requests; a priority-0 arrival is ordered first in waiting but does not preempt; it is admitted first once blocks free"
    fixtures: [scheduler-kv-nearly-full]
    config: {scheduling-policy: priority}
    state:
      scheduler:
        requests:
          chatcmpl-run-a: {priority: 10, num_computed_tokens: 495, output_token_ids: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016]}
          chatcmpl-run-b: {priority: 10, num_computed_tokens: 495, output_token_ids: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016]}
          chatcmpl-wait-c: {priority: 10}
    steps:
      - flow: scheduler-add-request
        as: add
        input: {request_id: chatcmpl-p0, priority: 0, arrival_time: 100, prompt_segments: [{key: doc-p0, num_tokens: 100}], sampling_params: {max_tokens: 16}}
      - {flow: scheduler-schedule, as: s1, input: {}}
      - {flow: scheduler-finish-requests, as: fin, input: {request_ids: [chatcmpl-run-a]}}
      - {flow: scheduler-schedule, as: s2, input: {}}
    expect:
      - "steps.s1.result.value.num_scheduled_tokens == {'chatcmpl-run-a': 1, 'chatcmpl-run-b': 1} && steps.s1.result.value.preempted_req_ids == [] && steps.s1.result.value.scheduled_new_reqs == []"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'priority-request-queue.peek-request')[0].output.request_id == 'chatcmpl-p0'"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.allocate-slots' && e.output.allocated == false)"
      - "calls['scheduler.preempt-request'] == 0"
      - "steps.s2.result.value.scheduled_new_reqs.map(r, r.req_id) == ['chatcmpl-p0', 'chatcmpl-wait-c']"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'priority-request-queue.peek-request').map(e, e.output.request_id) == ['chatcmpl-p0', 'chatcmpl-p0', 'chatcmpl-wait-c']"
