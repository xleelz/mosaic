schema_version: 1
id: vllm
scenarios:
- id: bench-p2
  name: 'P2: spec decode meets max_tokens, a stop token inside the accepted run, and rejected drafts'' KV'
  fixtures:
  - full-tp1-llama-8b
  config:
    speculative-method: ngram
    num-speculative-tokens: 5
    prompt-lookup-max: 4
    prompt-lookup-min: 4
    async-scheduling: false
  steps:
  - flow: scheduler-add-request
    input:
      request_id: req-len
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      - 9906
      - 11
      sampling_params:
        max_tokens: 10
    as: addA
  - flow: scheduler-add-request
    input:
      request_id: req-stop
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      - 9906
      - 11
      sampling_params:
        max_tokens: 64
        stop_token_ids:
        - 302
    as: addB
  - flow: scheduler-add-request
    input:
      request_id: req-rej
      prompt_token_ids:
      - 128000
      - 9906
      - 11
      - 856
      - 836
      - 374
      - 9906
      - 11
      sampling_params:
        max_tokens: 64
    as: addC
  - flow: scheduler-schedule
    input: {}
    as: s1
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - req-len
        - req-stop
        - req-rej
        sampled_token_ids:
        - - 100
        - - 300
        - - 200
      scheduler_output: = steps.s1.result.value
    as: u1
  - flow: scheduler-update-draft-token-ids
    input:
      req_ids:
      - req-len
      - req-stop
      - req-rej
      draft_token_ids:
      - &id001
        - -1
        - -1
        - -1
        - -1
        - -1
      - *id001
      - *id001
    as: d1
  - flow: scheduler-schedule
    input: {}
    as: s2
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - req-len
        - req-stop
        - req-rej
        sampled_token_ids:
        - - 101
          - 102
          - 103
          - 104
          - 105
          - 106
        - - 301
          - 302
          - 303
        - - 201
          - 202
          - 203
      scheduler_output: = steps.s2.result.value
    as: u2
  - flow: scheduler-update-draft-token-ids
    input:
      req_ids:
      - req-len
      - req-rej
      draft_token_ids:
      - &id002
        - -1
        - -1
        - -1
        - -1
        - -1
      - *id002
    as: d2
  - flow: scheduler-schedule
    input: {}
    as: s3
  - flow: scheduler-update-from-output
    input:
      model_runner_output:
        req_ids:
        - req-len
        - req-rej
        sampled_token_ids:
        - - 107
          - 108
          - 109
          - 110
          - 111
          - 112
        - - 204
      scheduler_output: = steps.s3.result.value
    as: u3
  expect:
  - 'steps.s2.result.value.num_scheduled_tokens == {''req-len'': 6, ''req-stop'': 6, ''req-rej'': 6}'
  - steps.u3.result.value.outputs.exists(o, o.request_id == 'req-len' && o.new_token_ids == [107, 108, 109] && o.finish_reason == 'length')
  - steps.u2.result.value.outputs.exists(o, o.request_id == 'req-stop' && o.new_token_ids == [301, 302] && o.finish_reason == 'stop')
  - steps.s3.result.value.scheduled_cached_reqs.req_ids.indexOf('req-rej') >= 0
  - steps.s3.result.value.scheduled_cached_reqs.num_computed_tokens[steps.s3.result.value.scheduled_cached_reqs.req_ids.indexOf('req-rej')] == 11
  - size(state['full-attention-manager'].req_to_blocks['req-rej']) == 2
  - trace.exists(e, e.type == 'note' && e.title == 'Roll back the rejected draft tokens')
  - '!(''req-stop'' in state[''full-attention-manager''].req_to_blocks) && !(''req-len'' in state[''full-attention-manager''].req_to_blocks)'
