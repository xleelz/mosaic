schema_version: 1
id: vllm
scenarios:
  - id: bench-l2
    name: "L2 another process holds 20 GiB of the 80 GiB GPU at gpu_memory_utilization 0.92"
    fixtures: [full-tp1-llama-8b]
    state:
      "gpu-memory@rank0": {other_process_bytes: 21474836480}
    steps:
      - {interface: api-server-entry.run-server, caller: operator, input: {}, as: up}
    expect:
      # (a) the worker's init_device snapshots free memory and checks it against ceil(80 GiB * 0.92)
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'worker-utils.request-memory' && e.instance == 'rank0' && e.input.free_bytes == 85899345920 - 21474836480 && e.input.total_bytes == 85899345920)"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'gpu-worker-impl.init-device' && e.error.code == 'value-error')"
      # (b) the error names free and requested memory; nothing is loaded or allocated
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'worker-utils.request-memory' && e.error.message.contains('64424509440') && e.error.message.contains('79027398247') && e.error.message.contains('0.92'))"
      - "calls['gpu-worker-impl.load-model'] == 0 && calls['gpu-memory.allocate'] == 0 && calls['engine-core.initialize-kv-caches'] == 0 && calls['attn-utils.init-kv-cache'] == 0"
      # (c) the engine core dies before its handshake; the API server reports it and never serves
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'engine-core-proc.run-engine-core' && e.error.code == 'value-error')"
      - "!steps.up.result.ok && steps.up.result.error.code == 'runtime-error' && steps.up.result.error.message.startsWith('Engine core initialization failed')"
      - "calls['launcher.serve-http'] == 0 && calls['engine-core-proc.run-busy-loop'] == 0"
