schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-stop-string
    name: "S4 (a)(b): stop string arrives first (the token text ' t61590' stands in for '\\n\\n'; the model's tokenizer is a labeled stand-in)"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input: {body: {model: llama-8b, stream: false, max_tokens: 32, max_completion_tokens: {$null: true}, stream_options: {$null: true}, stop: [" t61590"], stop_token_ids: [128009]}}
    expect:
      # (a) finish_reason stop, text truncated before the stop string
      - "result.ok && result.value.choices[0].finish_reason == 'stop' && result.value.choices[0].message.content == ' t34173 t87126'"
      - "result.ok && 'stop_reason' in result.value.choices[0] && result.value.choices[0].stop_reason == ' t61590'"
      # (b) matched by the API process's detokenizer, not the scheduler; the engine core is told to abort
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'incremental-detokenizer.update' && e.output.stop_string == ' t61590')"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'sched-utils.check-stop').all(e, e.output.status == 'RUNNING')"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-mp-client.abort-requests-async' && e.input.request_ids == ['chatcmpl-req-1-00000001'])"
  - id: bench-s4-stop-token
    name: "S4 (c): a stop token id hits first"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input: {body: {model: llama-8b, stream: false, max_tokens: 32, max_completion_tokens: {$null: true}, stream_options: {$null: true}, stop: {$null: true}, stop_token_ids: [87126]}}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'sched-utils.check-stop' && e.output.status == 'FINISHED_STOPPED' && e.output.stop_reason == 87126)"
      - "calls['async-mp-client.abort-requests-async'] == 0"
      - "result.ok && result.value.choices[0].finish_reason == 'stop' && 'stop_reason' in result.value.choices[0] && result.value.choices[0].stop_reason == 87126"
