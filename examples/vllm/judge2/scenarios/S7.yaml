schema_version: 1
id: vllm
scenarios:
  - id: bench-s7-too-many
    name: "S7 (a): max_tokens 200000 above max_model_len 131072"
    flow: serving-api-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input: {body: {prompt: ["Hello"], model: llama-8b, max_tokens: 200000}}
    expect:
      - "!result.ok && result.error.status == 400 && result.error.message.contains('max_tokens=200000 cannot be greater than max_model_len=131072')"
      - "calls['async-llm.generate'] == 0"
  - id: bench-s7-clamp
    name: "S7 (b): prompt + max_tokens over the context is clamped (scaled: max_model_len 1072, prompt 1000, the same 72-token room; the stand-in block hasher is O(n^2) and can't run a 131000-token prompt)"
    flow: serving-api-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    max_iterations: 1000000
    cost_limit: 1000000000
    config: {max-model-len: 1072, worker-runner-natural-output-tokens-base: 500, worker-runner-natural-output-tokens-spread: 1}
    input: {body: {prompt: ["= lists.range(999).map(i, 'w').join(' ')"], model: llama-8b, max_tokens: 1000}}
    expect:
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'api-utils.get-max-tokens' && e.output.max_tokens == 72)"
      - "result.ok && result.value.usage.prompt_tokens == 1000 && result.value.usage.completion_tokens == 72 && result.value.choices[0].finish_reason == 'length'"
  - id: bench-s7-full-prompt
    name: "S7 (c): a prompt of exactly max_model_len tokens"
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    cost_limit: 1000000000
    steps:
      - flow: serving-api-completion
        input: {body: {prompt: ["= lists.range(131071).map(i, 'w').join(' ')"], model: llama-8b, max_tokens: 16}}
        as: cmpl
      - flow: serving-api-chat-completion
        input: {body: {model: llama-8b, stream: false, max_tokens: 16, max_completion_tokens: {$null: true}, stream_options: {$null: true}, messages: [{role: user, content: "= lists.range(131064).map(i, 'w').join(' ')"}]}}
        as: chat
    expect:
      - "!steps.cmpl.result.ok && steps.cmpl.result.error.status == 400"
      - "!steps.chat.result.ok && steps.chat.result.error.status == 400"
      - "calls['engine-core-proc.process-input-sockets'] == 0"
