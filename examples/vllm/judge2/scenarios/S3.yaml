schema_version: 1
id: vllm
scenarios:
  - id: bench-s3
    name: "S3: EOS (128009) sampled at token 5 of max_tokens 64"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 5, worker-runner-natural-output-tokens-spread: 1}
    input:
      body: {model: llama-8b, stream: false, max_tokens: 64, max_completion_tokens: {$null: true}, stream_options: {$null: true}}
    expect:
      # (a) check_stop in update_from_output stops on EOS (sched/utils.py check_stop)
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'sched-utils.check-stop' && e.input.last_token_id == 128009 && e.input.num_output_tokens == 5)"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'sched-utils.check-stop' && e.output.status == 'FINISHED_STOPPED' && e.output.stop_reason == null)"
      # (b) finish_reason stop, stop_reason null in the choice
      - "result.ok && result.value.choices[0].finish_reason == 'stop'"
      - "result.ok && 'stop_reason' in result.value.choices[0] && result.value.choices[0].stop_reason == null"
      # (c) EOS text not in content; 5 completion tokens
      - "result.ok && !result.value.choices[0].message.content.contains('128009') && size(result.value.choices[0].message.content.split(' t')) == 5 && result.value.usage.completion_tokens == 5"
      # (d) blocks freed in the same update_from_output
      - "trace.exists(f, f.type == 'call.end' && f.interface == 'kv-cache-manager.free' && trace.exists(s, s.type == 'call.end' && s.interface == 'sched-utils.check-stop' && s.output.status == 'FINISHED_STOPPED' && s.seq < f.seq && !trace.exists(x, x.type == 'call.start' && x.interface == 'scheduler.schedule' && x.seq > s.seq && x.seq < f.seq)))"
