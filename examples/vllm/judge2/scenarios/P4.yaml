schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-a-tp3-config
    name: "P4(a): TP 3 for Llama-3.1-8B (32 heads) fails VllmConfig validation; no AsyncLLM, no worker"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {tensor_parallel_size: 3}
    state:
      platforms:
        host: {device_count: 4}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('Total number of attention heads (32) must be divisible by tensor parallel size (3)')"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'model-config.verify-with-parallel-config' && e.error != null)"
      - "calls['async-llm.from-vllm-config'] == 0 && calls['gpu-worker-impl.init-device'] == 0"
  - id: bench-p4-b-tp8-config
    name: "P4(b): TP 8 on a 4-GPU host fails in ParallelConfig.__post_init__ (world size > device count), before any executor"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {tensor_parallel_size: 8}
    state:
      platforms:
        host: {device_count: 4}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('World size (8) is larger than the number of available GPUs (4)')"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'parallel-config.post-init' && e.error != null)"
      - "calls['async-llm.from-vllm-config'] == 0 && calls['gpu-worker-impl.init-device'] == 0"
  - id: bench-p4-c-serve-tp3
    name: "P4(c): vllm serve --tensor-parallel-size 3: create_engine_config raises inside build_async_engine_client; the server never serves"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    config: {tensor-parallel-size: 3}
    input:
      argv: [serve]
      args: {model_tag: meta-llama/Llama-3.1-8B-Instruct, tensor_parallel_size: 3}
    state:
      platforms:
        host: {device_count: 4}
    expect:
      - "!result.ok && result.error.code == 'value-error'"
      - "calls['async-llm.from-vllm-config'] == 0 && calls['gpu-worker-impl.init-device'] == 0"
      - "calls['launcher.serve-http'] == 0"
  - id: bench-p4-c-serve-tp8
    name: "P4(c): vllm serve --tensor-parallel-size 8 on 4 GPUs: ParallelConfig raises; the server never serves"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    config: {tensor-parallel-size: 8}
    input:
      argv: [serve]
      args: {model_tag: meta-llama/Llama-3.1-8B-Instruct, tensor_parallel_size: 8}
    state:
      platforms:
        host: {device_count: 4}
    expect:
      - "!result.ok && result.error.code == 'value-error' && result.error.message.contains('World size (8)')"
      - "calls['async-llm.from-vllm-config'] == 0 && calls['gpu-worker-impl.init-device'] == 0"
      - "calls['launcher.serve-http'] == 0"
