schema_version: 1
id: vllm
scenarios:
  - id: bench-s11-bad-schema
    name: "S11 (a): an unparseable JSON schema (backend auto)"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input: {body: {model: llama-8b, stream: false, max_tokens: 5, max_completion_tokens: {$null: true}, stream_options: {$null: true}, structured_outputs: {json: "{\"type\": \"object\", \"properties\": {\"a\": {\"type\": "}, response_format: {$null: true}}}
    expect:
      # sampling_params.py:1394-1410 -> 'Invalid JSON grammar specification.' (VLLMValidationError, 400)
      - "!result.ok && result.error.status == 400"
      - "calls['engine-core-proc.process-input-sockets'] == 0"
  - id: bench-s11-truncated
    name: "S11 (b): max_tokens 5 with a schema needing more"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    input: {body: {model: llama-8b, stream: false, max_tokens: 5, max_completion_tokens: {$null: true}, stream_options: {$null: true}, structured_outputs: {json: {type: object, properties: {long: {type: string, minLength: 100}}, required: [long]}}, response_format: {$null: true}}}
    expect:
      - "result.ok && result.value.choices[0].finish_reason == 'length' && result.value.usage.completion_tokens == 5"
      - "calls['xgrammar-grammar.accept-tokens'] >= 1"
