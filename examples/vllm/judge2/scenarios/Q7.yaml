schema_version: 1
id: vllm
scenarios:
- id: bench-q7-prefix-hits
  name: 'Q7: 40-token prompt twice hits 2 blocks; a fully cached 48-token prompt hits 2 blocks (capped at prompt_len - 1)'
  fixtures:
  - full-tp1-llama-8b
  steps:
  - flow: scheduler-add-request
    as: a1
    input:
      request_id: r1
      prompt_token_ids: &id001
      - 128000
      - 3000
      - 3001
      - 3002
      - 3003
      - 3004
      - 3005
      - 3006
      - 3007
      - 3008
      - 3009
      - 3010
      - 3011
      - 3012
      - 3013
      - 3014
      - 3015
      - 3016
      - 3017
      - 3018
      - 3019
      - 3020
      - 3021
      - 3022
      - 3023
      - 3024
      - 3025
      - 3026
      - 3027
      - 3028
      - 3029
      - 3030
      - 3031
      - 3032
      - 3033
      - 3034
      - 3035
      - 3036
      - 3037
      - 3038
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-add-request
    as: a2
    input:
      request_id: r2
      prompt_token_ids: *id001
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-add-request
    as: a3
    input:
      request_id: r3
      prompt_token_ids: &id002
      - 128000
      - 5000
      - 5001
      - 5002
      - 5003
      - 5004
      - 5005
      - 5006
      - 5007
      - 5008
      - 5009
      - 5010
      - 5011
      - 5012
      - 5013
      - 5014
      - 5015
      - 5016
      - 5017
      - 5018
      - 5019
      - 5020
      - 5021
      - 5022
      - 5023
      - 5024
      - 5025
      - 5026
      - 5027
      - 5028
      - 5029
      - 5030
      - 5031
      - 5032
      - 5033
      - 5034
      - 5035
      - 5036
      - 5037
      - 5038
      - 5039
      - 5040
      - 5041
      - 5042
      - 5043
      - 5044
      - 5045
      - 5046
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s3
    input: {}
  - flow: scheduler-add-request
    as: a4
    input:
      request_id: r4
      prompt_token_ids: *id002
      sampling_params:
        max_tokens: 4
  - flow: scheduler-schedule
    as: s4
    input: {}
  expect:
  - steps.a1.result.value.num_block_hashes == 2 && steps.a3.result.value.num_block_hashes == 3
  - size(state['block-pool'].cached) == 5
  - steps.s1.result.value.num_scheduled_tokens['r1'] == 40 && steps.s1.result.value.scheduled_new_reqs[0].block_ids == [1, 2, 3]
  - trace.filter(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.get-computed-blocks').map(e, e.output.num_computed_tokens) == [0, 32, 0, 32]
  - steps.s2.result.value.num_scheduled_tokens['r2'] == 8 && steps.s2.result.value.scheduled_new_reqs[0].num_computed_tokens == 32
  - steps.s2.result.value.scheduled_new_reqs[0].block_ids.slice(0, 2) == [1, 2]
  - steps.s4.result.value.num_scheduled_tokens['r4'] == 16 && steps.s4.result.value.scheduled_new_reqs[0].num_computed_tokens == 32
  - trace.exists(e, e.type == 'call.start' && e.interface == 'full-attention-manager.find-longest-cache-hit' && e.input.max_length == 47)
  - state.scheduler.requests['r4'].num_cached_tokens == 32
