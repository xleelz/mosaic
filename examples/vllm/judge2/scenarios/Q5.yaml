schema_version: 1
id: vllm
scenarios:
  - id: bench-q5-priority-victim
    name: "Q5 priority: KV full; the priority-5 request needs a block; the priority-10 one (already scheduled this step) is preempted and its tokens returned"
    fixtures: [scheduler-kv-nearly-full]
    config: {scheduling-policy: priority}
    state:
      scheduler:
        requests:
          chatcmpl-run-a: {priority: 10}
          chatcmpl-run-b: {priority: 5}
    steps:
      - {flow: scheduler-schedule, as: s1, input: {}}
      - {interface: scheduler.get-request-counts, caller: engine-core, as: cnt}
    expect:
      - "steps.s1.result.value.num_scheduled_tokens == {'chatcmpl-run-b': 1} && steps.s1.result.value.total_num_scheduled_tokens == 1"
      - "steps.s1.result.value.preempted_req_ids == ['chatcmpl-run-a']"
      - "steps.s1.result.value.scheduled_cached_reqs.req_ids == ['chatcmpl-run-b'] && steps.s1.result.value.scheduled_cached_reqs.new_block_ids == [[63]]"
      - "state.scheduler.requests['chatcmpl-run-a'].status == 'PREEMPTED' && state.scheduler.requests['chatcmpl-run-a'].num_computed_tokens == 0 && state.scheduler.running == ['chatcmpl-run-b']"
      - "trace.exists(e, e.type == 'note' && e.title == 'Give back the victim\\'s tokens scheduled earlier this step')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.allocate-slots').map(e, e.input.request_id) == ['chatcmpl-run-a', 'chatcmpl-run-b', 'chatcmpl-run-b']"
      - "steps.cnt.result.value == {'num_running': 1, 'num_waiting': 2}"
  - id: bench-q5-priority-tie-arrival
    name: "Q5 tie-break: equal priority, the later arrival is the victim, not the last in the running queue"
    fixtures: [scheduler-kv-nearly-full]
    config: {scheduling-policy: priority}
    state:
      scheduler:
        requests:
          chatcmpl-run-a: {priority: 5, arrival_time: 9}
          chatcmpl-run-b: {priority: 5, arrival_time: 1}
    steps:
      - {flow: scheduler-schedule, as: s1, input: {}}
    expect:
      - "steps.s1.result.value.preempted_req_ids == ['chatcmpl-run-a'] && steps.s1.result.value.num_scheduled_tokens == {'chatcmpl-run-b': 1}"
