schema_version: 1
id: vllm
scenarios:
- id: bench-q4-preempt-last
  name: 'Q4 fcfs: the last running request needs a block, none free; it preempts itself'
  fixtures:
  - scheduler-kv-nearly-full
  steps:
  - flow: scheduler-schedule
    as: s1
    input: {}
  - interface: scheduler.get-request-counts
    caller: engine-core
    as: cnt
  expect:
  - 'steps.s1.result.value.num_scheduled_tokens == {''chatcmpl-run-a'': 1}'
  - steps.s1.result.value.preempted_req_ids == ['chatcmpl-run-b'] && steps.s1.result.value.scheduled_new_reqs == []
  - state.scheduler.requests['chatcmpl-run-b'].status == 'PREEMPTED' && state.scheduler.requests['chatcmpl-run-b'].num_computed_tokens == 0 && state.scheduler.requests['chatcmpl-run-b'].num_preemptions
    == 1
  - state.scheduler.waiting == ['chatcmpl-run-b', 'chatcmpl-wait-c'] && state.scheduler.running == ['chatcmpl-run-a']
  - '!(''chatcmpl-run-b'' in state[''full-attention-manager''].req_to_blocks) && state[''block-pool''].free_tail == [62, 61, 60, 59, 58, 57, 56, 55, 54, 53, 52, 51, 50, 49, 48, 47, 46, 45, 44, 43, 42, 41,
    40, 39, 38, 37, 36, 35, 34, 33, 32]'
  - trace.exists(e, e.type == 'note' && e.title == 'Preempted itself; it cannot be scheduled') && trace.exists(e, e.type == 'note' && e.title == 'Preemption this step; no waiting request is admitted')
  - trace.filter(e, e.type == 'call.start' && e.interface == 'kv-cache-manager.allocate-slots').map(e, e.input.request_id) == ['chatcmpl-run-a', 'chatcmpl-run-b']
- id: bench-q4-resume-recompute
  name: 'Q4 resume: the preempted request is recomputed as a prefill over prompt + output, shortened by its prefix-cache hit'
  fixtures:
  - scheduler-kv-nearly-full
  steps:
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-finish-requests
    as: fin
    input:
      request_ids:
      - chatcmpl-run-a
  - flow: scheduler-schedule
    as: s2
    input: {}
  - flow: scheduler-update-from-output
    as: u2
    input:
      scheduler_output: = steps.s2.result.value
      model_runner_output:
        req_ids:
        - chatcmpl-run-b
        - chatcmpl-wait-c
        sampled_token_ids:
        - - 2018
        - - 3001
  expect:
  - steps.s2.result.value.num_scheduled_tokens['chatcmpl-run-b'] == 1
  - steps.s2.result.value.scheduled_new_reqs.exists(r, r.req_id == 'chatcmpl-run-b' && r.num_computed_tokens == 496)
  - trace.exists(e, e.type == 'call.end' && e.interface == 'kv-cache-manager.get-computed-blocks' && e.output.num_computed_tokens == 496)
  - trace.filter(e, e.type == 'call.start' && e.interface == 'fcfs-request-queue.peek-request')[0].input.queue[0].request_id == 'chatcmpl-run-b'
  - steps.u2.result.value.outputs.exists(o, o.request_id == 'chatcmpl-run-b' && o.new_token_ids == [2018])
  - size(state.scheduler.requests['chatcmpl-run-b'].output_token_ids) == 18 && state.scheduler.requests['chatcmpl-run-b'].output_token_ids[16] == 2017 && state.scheduler.requests['chatcmpl-run-b'].num_preemptions
    == 1
- id: bench-q4-resume-cache-off
  name: Q4(c) without prefix caching the resumed request recomputes prompt + all output tokens
  fixtures:
  - scheduler-kv-nearly-full
  config:
    enable-prefix-caching: false
  steps:
  - flow: scheduler-schedule
    as: s1
    input: {}
  - flow: scheduler-finish-requests
    as: fin
    input:
      request_ids:
      - chatcmpl-run-a
  - flow: scheduler-schedule
    as: s2
    input: {}
  expect:
  - steps.s2.result.value.num_scheduled_tokens['chatcmpl-run-b'] == 497
