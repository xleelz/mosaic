schema_version: 1
id: vllm
scenarios:
  - id: bench-s5-ignore-eos
    name: "S5 (a): ignore_eos with max_tokens 32, EOS sampled from token 3"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 3, worker-runner-natural-output-tokens-spread: 1}
    input: {body: {model: llama-8b, stream: false, max_tokens: 32, max_completion_tokens: {$null: true}, stream_options: {$null: true}, ignore_eos: true, min_tokens: {$null: true}}}
    expect:
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'sched-utils.check-stop' && e.input.last_token_id == 128009 && e.input.num_output_tokens == 3 && e.input.eos_token_id == null)"
      - "result.ok && result.value.usage.completion_tokens == 32 && result.value.choices[0].finish_reason == 'length'"
  - id: bench-s5-min-tokens
    name: "S5 (b): min_tokens 8, EOS would be sampled at token 3"
    flow: serving-api-chat-completion
    fixtures: [full-tp1-llama-8b]
    max_events: 1000000
    config: {worker-runner-natural-output-tokens-base: 3, worker-runner-natural-output-tokens-spread: 1}
    input: {body: {model: llama-8b, stream: false, max_tokens: 32, max_completion_tokens: {$null: true}, stream_options: {$null: true}, ignore_eos: false, min_tokens: 8}}
    expect:
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'sched-utils.check-stop').map(e, e.input.last_token_id).indexOf(128009) == 8"
      - "result.ok && result.value.choices[0].finish_reason == 'stop' && result.value.usage.completion_tokens == 9"
