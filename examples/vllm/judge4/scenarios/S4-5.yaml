schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-5-a
    name: "(a) create: 200 response, id resp_..., model llama-8b, max_output_tokens 4, incomplete on the length cap"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: a, flow: serving-api-responses-create, input: {body: {input: "Hi", max_output_tokens: 4, model: {$absent: true}, request_id: {$absent: true}, previous_response_id: {$absent: true}, previous_input_messages: {$absent: true}, background: {$absent: true}, store: {$absent: true}, stream: false}}}
      - {as: a2, flow: serving-api-responses-create, input: {body: {input: "Hi", max_output_tokens: {$absent: true}, model: {$absent: true}, request_id: {$absent: true}, previous_response_id: {$absent: true}, previous_input_messages: {$absent: true}, background: {$absent: true}, store: {$absent: true}, stream: false}}}
    expect:
      - "steps.a.result.ok && steps.a.result.value.object == 'response' && steps.a.result.value.id.startsWith('resp_') && steps.a.result.value.model == 'llama-8b' && steps.a.result.value.max_output_tokens == 4"
      - "steps.a.result.value.status == 'incomplete' && steps.a.result.value.incomplete_details.reason == 'max_output_tokens'"
      - "steps.a2.result.ok && steps.a2.result.value.max_output_tokens != null && steps.a2.result.value.max_output_tokens > 100000"
  - id: bench-s4-5-b
    name: "(b) store silently off without the env var: a later GET is 404 invalid_request_error param response_id"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: c, flow: serving-api-responses-create, input: {body: {input: "Hi", max_output_tokens: 4, model: {$absent: true}, request_id: resp_j1, previous_response_id: {$absent: true}, previous_input_messages: {$absent: true}, background: {$absent: true}, store: {$absent: true}, stream: false}}}
      - {as: g, flow: serving-api-responses-retrieve, input: {path: /v1/responses/resp_j1}}
    expect:
      - "steps.c.result.ok && steps.c.result.value.id == 'resp_j1'"
      - "!steps.g.result.ok && steps.g.result.error.status == 404 && steps.g.result.error.code == 'invalid_request_error' && steps.g.result.error.data.param == 'response_id' && steps.g.result.error.message == \"Response with id 'resp_j1' not found.\""
  - id: bench-s4-5-c
    name: "(c) background: true with the default store: 400 invalid_request_error param background"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: b, flow: serving-api-responses-create, input: {body: {input: "Hi", max_output_tokens: 4, background: true, model: {$absent: true}, request_id: {$absent: true}, previous_response_id: {$absent: true}, previous_input_messages: {$absent: true}, store: {$absent: true}, stream: false}}}
    expect:
      - "!steps.b.result.ok && steps.b.result.error.status == 400 && steps.b.result.error.code == 'invalid_request_error' && steps.b.result.error.data.param == 'background' && steps.b.result.error.message == 'This vLLM engine does not support `store=True` and therefore does not support the background mode. To enable these features, set the environment variable `VLLM_ENABLE_RESPONSES_API_STORE=1` when launching the vLLM server.'"
      - "calls['async-llm.generate'] == 0"
  - id: bench-s4-5-d
    name: "(d) previous_response_id with previous_input_messages is 400 before the lookup; unknown previous_response_id is 404"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: both, flow: serving-api-responses-create, input: {body: {input: "Hi", max_output_tokens: 4, previous_response_id: resp_x, previous_input_messages: [{role: user, content: earlier}], model: {$absent: true}, request_id: {$absent: true}, background: {$absent: true}, store: {$absent: true}, stream: false}}}
      - {as: px, flow: serving-api-responses-create, input: {body: {input: "Hi", max_output_tokens: 4, previous_response_id: resp_x, previous_input_messages: {$absent: true}, model: {$absent: true}, request_id: {$absent: true}, background: {$absent: true}, store: {$absent: true}, stream: false}}}
    expect:
      - "!steps.both.result.ok && steps.both.result.error.status == 400 && steps.both.result.error.code == 'invalid_request_error' && steps.both.result.error.data.param == 'previous_response_id' && steps.both.result.error.message == 'Only one of `previous_input_messages` and `previous_response_id` can be set.'"
      - "!steps.px.result.ok && steps.px.result.error.status == 404 && steps.px.result.error.message == \"Response with id 'resp_x' not found.\""
      - "calls['online-renderer.render-responses'] == 0"
  - id: bench-s4-5-e
    name: "(e) with the store on: the finished response is retrievable, and cancel gives 400 Cannot cancel a synchronous response."
    fixtures: [full-tp1-llama-8b]
    config: {vllm-enable-responses-api-store: true}
    max_events: 400000
    steps:
      - {as: c, flow: serving-api-responses-create, input: {body: {input: "Hi", max_output_tokens: 4, model: {$absent: true}, request_id: resp_j2, previous_response_id: {$absent: true}, previous_input_messages: {$absent: true}, background: {$absent: true}, store: {$absent: true}, stream: false}}}
      - {as: g, flow: serving-api-responses-retrieve, input: {path: /v1/responses/resp_j2}}
      - {as: x, interface: openai-serving-responses.post-v1-responses-response-id-cancel, caller: api-client, input: {path: /v1/responses/resp_j2/cancel}}
    expect:
      - "steps.c.result.ok && steps.g.result.ok && steps.g.result.value.id == 'resp_j2' && steps.g.result.value.status == steps.c.result.value.status"
      - "!steps.x.result.ok && steps.x.result.error.status == 400 && steps.x.result.error.code == 'invalid_request_error' && steps.x.result.error.data.param == 'response_id' && steps.x.result.error.message == 'Cannot cancel a synchronous response.'"
