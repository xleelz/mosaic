schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-3-a
    name: "(a) GET /v1/models twice: list of one card with every ModelCard and ModelPermission field"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {as: m1, flow: serving-api-models-list}
      - {as: m2, flow: serving-api-models-list}
    expect:
      - "steps.m1.result.ok && steps.m1.result.value.object == 'list' && size(steps.m1.result.value.data) == 1"
      - "steps.m1.result.value.data[0].id == 'llama-8b' && steps.m1.result.value.data[0].object == 'model' && steps.m1.result.value.data[0].owned_by == 'vllm' && steps.m1.result.value.data[0].root == 'meta-llama/Llama-3.1-8B-Instruct' && steps.m1.result.value.data[0].max_model_len == 131072"
      - "'parent' in steps.m1.result.value.data[0] && steps.m1.result.value.data[0].parent == null && 'created' in steps.m1.result.value.data[0]"
      - "size(steps.m1.result.value.data[0].permission) == 1 && steps.m1.result.value.data[0].permission[0].object == 'model_permission' && steps.m1.result.value.data[0].permission[0].allow_sampling == true && steps.m1.result.value.data[0].permission[0].allow_create_engine == false && steps.m1.result.value.data[0].permission[0].organization == '*' && steps.m1.result.value.data[0].permission[0].is_blocking == false"
      - "steps.m1.result.value.data[0].permission[0].id.startsWith('modelperm-') && steps.m1.result.value.data[0].permission[0].id != steps.m2.result.value.data[0].permission[0].id"
  - id: bench-s4-3-b
    name: "(b) GET /v1/models/llama-8b: no such route, framework 404 {detail: Not Found}"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {as: b, flow: serving-api-models-list, input: {path: /v1/models/llama-8b}}
    expect:
      - "!steps.b.result.ok && steps.b.result.error.status == 404 && steps.b.result.error.message == 'Not Found'"
  - id: bench-s4-3-c
    name: "(c) model gpt-4 is 404 NotFoundError param model; no model is served as llama-8b"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: c1, flow: serving-api-chat-completion, input: {body: {model: gpt-4, messages: [{role: user, content: hi}], max_tokens: 4, stream: false}}}
      - {as: c2, flow: serving-api-chat-completion, input: {body: {model: {$absent: true}, messages: [{role: user, content: hi}], max_tokens: 4, stream: false}}}
    expect:
      - "!steps.c1.result.ok && steps.c1.result.error.status == 404 && steps.c1.result.error.code == 'NotFoundError' && steps.c1.result.error.data.param == 'model' && steps.c1.result.error.message == 'The model `gpt-4` does not exist. Valid aliases: llama-8b.'"
      - "steps.c2.result.ok && steps.c2.result.value.model == 'llama-8b'"
      - "calls['async-llm.generate'] == 1"
  - id: bench-s4-3-d
    name: "(d) non-streaming system_fingerprint vllm-<version>-<hash8> at TP1"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: d, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], max_tokens: 4, stream: false}}}
    expect:
      - "steps.d.result.ok && 'system_fingerprint' in steps.d.result.value && steps.d.result.value.system_fingerprint.matches('^vllm-[^-]+-[0-9a-f]{8}$')"
  - id: bench-s4-3-d-moe
    name: "(d) on the Mixtral TP2 EP world: vllm-<version>-tp2-ep-<hash8>"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    max_events: 600000
    steps:
      - {as: d, flow: serving-api-chat-completion, input: {body: {model: {$absent: true}, messages: [{role: user, content: hi}], max_tokens: 2, stream: false}}}
    expect:
      - "steps.d.result.ok && 'system_fingerprint' in steps.d.result.value && steps.d.result.value.system_fingerprint.matches('^vllm-[^-]+-tp2-ep-[0-9a-f]{8}$')"
  - id: bench-s4-3-e
    name: "(e) streaming: only the terminal chunk carries the fingerprint; with include_usage only the usage chunk"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: e1, flow: serving-api-chat-stream, input: {body: {messages: [{role: user, content: hi}], max_tokens: 3, stream: true, stream_options: {$absent: true}}}}
      - {as: e2, flow: serving-api-chat-stream, input: {body: {messages: [{role: user, content: hi}], max_tokens: 3, stream: true, stream_options: {include_usage: true}}}}
    expect:
      - "steps.e1.result.ok && steps.e1.result.value.items.exists(i, type(i) == map && 'choices' in i && size(i.choices) > 0 && i.choices[0].finish_reason != null && 'system_fingerprint' in i)"
      - "steps.e2.result.ok && steps.e2.result.value.items.exists(i, type(i) == map && 'choices' in i && size(i.choices) == 0 && 'system_fingerprint' in i)"
