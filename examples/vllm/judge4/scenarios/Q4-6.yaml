schema_version: 1
id: vllm
scenarios:
  - id: bench-q4-6-abc-fp8-checkpoint
    name: "Q4-6 (a, b, c) FP8 checkpoint: ~8.5 GiB weights, kv auto stays bf16 (64 KiB per layer, 2 MiB per block); the ~6.5 GiB saved becomes ~3,300 more blocks"
    fixtures: [full-fp8-llama-3-8b]
    steps:
      - {flow: config-create-engine-config, as: cfg}
      - {interface: gpu-model-runner.get-kv-cache-spec, caller: gpu-worker-impl, as: spec}
      - {flow: wr-load-model, as: load}
      - {flow: wr-determine-available-memory, as: mem}
      - {interface: gpu-worker-impl.get-num-gpu-blocks, caller: engine-core, as: blocks}
    expect:
      - "steps.cfg.result.value.cache_config.cache_dtype == 'auto'"
      - "steps.spec.result.value.page_size_bytes == 65536 && steps.blocks.result.value.bytes_per_block == 2097152"
      - "state['gpu-memory@rank0'].weights_bytes > 9000000000 && state['gpu-memory@rank0'].weights_bytes < 9200000000"
      - "steps.blocks.result.value.num_gpu_blocks == 31816"
      - "steps.mem.result.value == steps.blocks.result.value.available_kv_cache_memory_bytes"
  - id: bench-q4-6-c-bf16-baseline
    name: "Q4-6 (c) the BF16 Meta-Llama-3-8B-class baseline on the same GPU: ~15 GiB weights and about 3,300 fewer blocks"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: gpu-model-runner.get-kv-cache-spec, caller: gpu-worker-impl, as: spec}
      - {flow: wr-load-model, as: load}
      - {flow: wr-determine-available-memory, as: mem}
      - {interface: gpu-worker-impl.get-num-gpu-blocks, caller: engine-core, as: blocks}
    expect:
      - "steps.blocks.result.value.bytes_per_block == 2097152"
      - "state['gpu-memory@rank0'].weights_bytes > 16000000000 && state['gpu-memory@rank0'].weights_bytes < 16100000000"
      - "31816 - steps.blocks.result.value.num_gpu_blocks >= 3200 && 31816 - steps.blocks.result.value.num_gpu_blocks <= 3400"
  - id: bench-q4-6-d-modelopt-kv-algo
    name: "Q4-6 (d) a ModelOpt FP8 checkpoint with kv_cache_quant_algo FP8 resolves auto to fp8_e4m3: 1-byte KV, half-size blocks, with no flag"
    fixtures: [full-fp8-llama-3-8b]
    state:
      hf-hub:
        models:
          neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV: {architectures: [LlamaForCausalLM], eos_token_id: 128009, hidden_size: 4096, intermediate_size: 14336, max_position_embeddings: 8192, model_type: llama, num_attention_heads: 32, num_hidden_layers: 32, num_key_value_heads: 8, quantization_config: {quant_method: modelopt, quant_algo: FP8, kv_cache_quant_algo: FP8}, rope_theta: 500000, torch_dtype: bfloat16, vocab_size: 128256, weights_bytes: 9081200640}
    steps:
      - {flow: config-create-engine-config, as: cfg}
      - {interface: gpu-model-runner.get-kv-cache-spec, caller: gpu-worker-impl, as: spec}
    expect:
      - "steps.cfg.result.value.cache_config.cache_dtype == 'fp8_e4m3'"
      - "steps.spec.result.value.page_size_bytes == 32768"
