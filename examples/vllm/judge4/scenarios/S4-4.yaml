schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-4-a
    name: "(a) /v1/embeddings and /pooling on a generate-only model: route not registered, framework 404"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {as: e, flow: serving-api-embeddings, input: {body: {model: llama-8b, input: "hi"}}}
      - {as: p, interface: serving-pooling.post-pooling, caller: api-client, input: {path: /pooling, body: {model: llama-8b, input: "hi"}}}
    expect:
      - "!steps.e.result.ok && steps.e.result.error.status == 404 && steps.e.result.error.message == 'Not Found'"
      - "!steps.p.result.ok && steps.p.result.error.status == 404 && steps.p.result.error.message == 'Not Found'"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'app-state.supported-tasks')"
  - id: bench-s4-4-b
    name: "(b) /invocations: a messages body is served as chat, a prompt body as completions"
    fixtures: [full-tp1-llama-8b]
    max_events: 600000
    steps:
      - {as: chat, interface: sagemaker-router.post-invocations, caller: api-client, input: {path: /invocations, body: {model: llama-8b, messages: [{role: user, content: hi}], max_tokens: 3, prompt: {$absent: true}}}}
      - {as: cmpl, interface: sagemaker-router.post-invocations, caller: api-client, input: {path: /invocations, body: {model: llama-8b, prompt: ["Hello"], max_tokens: 3, messages: {$absent: true}}}}
    expect:
      - "steps.chat.result.ok && steps.chat.result.value.object == 'chat.completion'"
      - "steps.cmpl.result.ok && steps.cmpl.result.value.object == 'text_completion'"
      - "calls['openai-serving-chat.create-chat-completion'] == 1 && calls['openai-serving-completion.create-completion'] == 1"
  - id: bench-s4-4-c
    name: "(c) the embeddings body: CompletionRequest's before validator raises VLLMValidationError, which escapes the loop"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {as: c, interface: sagemaker-router.post-invocations, caller: api-client, input: {path: /invocations, body: {model: llama-8b, input: "hi", messages: {$absent: true}, prompt: {$absent: true}, max_tokens: {$absent: true}}}}
    expect:
      - "!steps.c.result.ok && steps.c.result.error.status == 400 && steps.c.result.error.code == 'BadRequestError' && steps.c.result.error.data.param == 'prompt' && steps.c.result.error.message == 'Either prompt or prompt_embeds must be provided and non-empty. (parameter=prompt)'"
  - id: bench-s4-4-d
    name: "(d) {prompt: 5} fails both models: Cannot find suitable handler"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {as: d, interface: sagemaker-router.post-invocations, caller: api-client, input: {path: /invocations, body: {prompt: 5, model: {$absent: true}, messages: {$absent: true}, max_tokens: {$absent: true}}}}
    expect:
      - "!steps.d.result.ok && steps.d.result.error.status == 400 && steps.d.result.error.code == 'BadRequestError' && steps.d.result.error.message == \"Cannot find suitable handler for request. Expected one of: ['ChatCompletionRequest', 'CompletionRequest']\""
      - "calls['openai-serving-completion.create-completion'] == 0"
  - id: bench-s4-4-e
    name: "(e) malformed body '{': HTTPException, type Bad Request, JSON decode error"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {as: e, interface: sagemaker-router.post-invocations, caller: api-client, input: {path: /invocations, body: "{"}}
    expect:
      - "!steps.e.result.ok && steps.e.result.error.status == 400 && steps.e.result.error.code == 'Bad Request' && steps.e.result.error.message == 'JSON decode error: Expecting property name enclosed in double quotes: line 1 column 2 (char 1)'"
