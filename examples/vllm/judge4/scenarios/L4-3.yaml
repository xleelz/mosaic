schema_version: 1
id: vllm
scenarios:
  - id: bench-l4-3ab-startup-handshake
    name: "L4-3 (a, b): engine startup on the default world: one EngineCore, HELLO, READY after load, ready response synced"
    flow: engine-startup
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    expect:
      - "result.ok && result.value.num_gpu_blocks > 0"
      - "calls['core-engine-proc-manager.launch'] == 1 && calls['engine-core-proc.run-engine-core'] == 1"
      # (a) HELLO {status, local, headless} on the handshake DEALER socket, answered with the ZMQ addresses
      - "trace.exists(e, e.type == 'call.start' && e.input != null && type(e.input) == map && 'status' in e.input && e.input.status == 'HELLO')"
      # (b) READY only after the executor loaded the model and sized the KV cache; ready response carries max_model_len
      - "trace.exists(e, e.type == 'call.start' && e.input != null && type(e.input) == map && 'status' in e.input && e.input.status == 'READY')"
  - id: bench-l4-3c-engine-core-raises
    name: "L4-3 (c): the engine core raises during model load: RuntimeError naming {'EngineCore': 1}; no HTTP server"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    faults:
      - {target: engine-core.init, type: error, code: runtime-error, message: "unreadable weights"}
    expect:
      - "!result.ok && result.error.message == \"Engine core initialization failed. See root cause above. Failed core proc(s): {'EngineCore': 1}\""
      - "calls['launcher.setup-server'] == 1 && calls['api-server-entry.build-and-serve'] == 0 && calls['launcher.serve-http'] == 0"
  - id: bench-l4-3d-slow-load-single-api-server
    name: "L4-3 (d): a 700 s model load does not time out with one API server (the ready wait follows the untimed handshake)"
    flow: engine-startup
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    max_virtual_ms: 2000000
    faults:
      - {target: engine-core.init, type: latency, latency_ms: 700000}
    expect:
      - "result.ok"
  - id: bench-l4-3d-ready-timeout-external-engines
    name: "L4-3 (d): with externally managed engines the 600 s VLLM_ENGINE_READY_TIMEOUT_S covers the whole load"
    flow: engine-startup
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    max_virtual_ms: 2000000
    config: {data-parallel-size: 2}
    faults:
      - {target: engine-core.init, type: latency, latency_ms: 700000}
    expect:
      - "!result.ok && result.error.message.startsWith('Timed out waiting for engine core processes to start. This is often caused by slow weight loading for large models. Waited 600s (configured by VLLM_ENGINE_READY_TIMEOUT_S).')"
