schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-6-a-defaults
    name: "P4-6(a) EPLB defaults: window 1000, step_interval 3000, 0 redundant, log_balancedness off, async, policy default; communicator nixl or torch_gloo"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-eplb: true}
    steps:
      - {flow: config-create-engine-config, input: {model: "= config['model']", enable_eplb: true}, as: cfg}
    expect:
      - "steps.cfg.result.ok && config['num-redundant-experts'] == 0"
      - "has(steps.cfg.result.value.parallel_config.eplb_config) && steps.cfg.result.value.parallel_config.eplb_config.window_size == 1000 && steps.cfg.result.value.parallel_config.eplb_config.step_interval == 3000"
      - "steps.cfg.result.value.parallel_config.eplb_config.communicator in ['nixl', 'torch_gloo']"
  - id: bench-p4-6-b1-eplb-without-ep
    name: "P4-6(b) --enable-eplb without --enable-expert-parallel"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-eplb: true, enable-expert-parallel: false}
    steps:
      - {flow: config-create-engine-config, input: {model: "= config['model']", enable_eplb: true, enable_expert_parallel: false}, as: cfg}
    expect:
      - "!steps.cfg.result.ok && steps.cfg.result.error.code == 'value-error' && steps.cfg.result.error.message == 'enable_expert_parallel must be True to use EPLB.'"
      - "calls['parallel-config.validate-parallel-config'] == 1 && calls['vllm-config.post-init'] == 0"
  - id: bench-p4-6-b2-eplb-tp1
    name: "P4-6(b) EP and EPLB at TP 1, DP 1"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-eplb: true, tensor-parallel-size: 1}
    steps:
      - {flow: config-create-engine-config, input: {model: "= config['model']", enable_eplb: true, tensor_parallel_size: 1}, as: cfg}
    expect:
      - "!steps.cfg.result.ok && steps.cfg.result.error.code == 'value-error' && steps.cfg.result.error.message == 'EPLB requires tensor, prefill-context, or data parallelism, but got TP=1, PCP=1, DP=1.'"
      - "calls['vllm-config.post-init'] == 0"
  - id: bench-p4-6-b3-redundant-without-eplb
    name: "P4-6(b) num_redundant_experts 4 without --enable-eplb"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {num-redundant-experts: 4}
    steps:
      - {flow: config-create-engine-config, input: {model: "= config['model']", eplb_num_redundant_experts: 4}, as: cfg}
    expect:
      - "!steps.cfg.result.ok && steps.cfg.result.error.code == 'value-error' && steps.cfg.result.error.message == 'num_redundant_experts is set to 4 but EPLB is not enabled. Either enable EPLB or unset num_redundant_experts.'"
      - "calls['vllm-config.post-init'] == 0"
  - id: bench-p4-6-c1-two-redundant
    name: "P4-6(c) EPLB with 2 redundant experts: 10 physical, 5 per rank"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-eplb: true, num-redundant-experts: 2}
    steps:
      - {flow: wr-load-model, on: rank0, as: load0}
    expect:
      - "steps.load0.result.ok && state['mixtral-for-causal-lm@rank0'].cfg.num_physical_experts == 10 && state['mixtral-for-causal-lm@rank0'].cfg.num_local_physical_experts == 5"
  - id: bench-p4-6-c2-one-redundant
    name: "P4-6(c) EPLB with 1 redundant expert: 9 experts over 2 EP ranks is refused at model init"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-eplb: true, num-redundant-experts: 1}
    steps:
      - {flow: wr-load-model, on: rank0, as: load0}
    expect:
      - "!steps.load0.result.ok && steps.load0.result.error.code == 'value-error' && steps.load0.result.error.message == 'EPLB currently only supports even distribution of experts across ranks. Got 9 experts and 2 EP ranks.'"
  - id: bench-p4-6-de-profile-and-steps
    name: "P4-6(d)(e) profile run steps EPLB with is_profile (sync rearrangement, maps not committed); first real rearrangement 750 steps in"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-eplb: true}
    steps:
      - {flow: wr-load-model, on: rank0, as: load0}
      - {flow: wr-load-model, on: rank1, as: load1}
      - {flow: wr-determine-available-memory, on: rank0, as: prof0, await: false}
      - {flow: wr-determine-available-memory, on: rank1, as: prof1}
    expect:
      - "steps.prof0.result.ok && steps.prof1.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface.startsWith('eplb-state.') && e.interface.contains('step'))"
      - "trace.exists(e, e.type == 'note' && e.title.contains('Rearranging experts (async mode) (profile)'))"
