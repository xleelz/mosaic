schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-3-a-detect
    name: "P4-3(a) FP8 checkpoint, no --quantization: quantization fp8, Fp8Config serialized, static activations"
    fixtures: [full-fp8-llama-3-8b]
    steps:
      - {flow: config-create-engine-config, as: cfg}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.quantization == 'fp8'"
      - "steps.cfg.result.value.quant_config.is_checkpoint_fp8_serialized && steps.cfg.result.value.quant_config.activation_scheme == 'static' && steps.cfg.result.value.quant_config.ignored_layers == ['lm_head']"
  - id: bench-p4-3-b-h100-linear
    name: "P4-3(b) H100: every linear gets Fp8LinearMethod (static per-tensor), attention Fp8KVCacheMethod; CUTLASS selected; forward runs the CUTLASS FP8 GEMM"
    fixtures: [full-fp8-llama-3-8b]
    steps:
      - flow: models-get-model
        input:
          model: neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV
          hf_config: {architectures: [LlamaForCausalLM], hidden_size: 4096, max_position_embeddings: 8192, num_attention_heads: 32, num_hidden_layers: 32, num_key_value_heads: 8, torch_dtype: bfloat16, vocab_size: 128256, weights_bytes: 9081200640, quantization_config: {quant_method: fp8, activation_scheme: static, ignored_layers: [lm_head], kv_cache_scheme: static}}
        as: load
      - {interface: fp8-config.get-quant-method, caller: gpu-worker, input: {layer_kind: linear, prefix: model.layers.0.self_attn.qkv_proj, ignored_layers: [lm_head]}, as: qkv}
      - {interface: fp8-config.get-quant-method, caller: gpu-worker, input: {layer_kind: linear, prefix: lm_head, ignored_layers: [lm_head]}, as: head}
      - {flow: models-llama-forward, as: fwd}
    expect:
      - "steps.load.result.ok && steps.load.result.value.quant == 'fp8' && steps.load.result.value.kv_quant_method == 'Fp8KVCacheMethod'"
      - "steps.qkv.result.value.quant_method == 'Fp8LinearMethod' && steps.head.result.value.quant_method == 'UnquantizedLinearMethod'"
      - "ctx.fp8_weights_processed == 'per_tensor'"
      - "steps.fwd.result.ok && calls['cutlass-fp8-scaled-mm-linear-kernel.apply-scaled-mm'] > 0"
      - "trace.exists(e, e.type == 'choice' && e.key == 'kernel' && e.option == 'cutlass' && e.origin != 'default')"
  - id: bench-p4-3-c-a100-marlin
    name: "P4-3(c) A100 (8.0): capability 75 passes; no FP8 CUTLASS or torch scaled_mm; Marlin weight-only FP8"
    fixtures: [full-fp8-llama-3-8b]
    state:
      cuda-platform: {device_capability: {major: 8, minor: 0}}
      torch-bindings: {device_capability: {major: 8, minor: 0}}
      gpu-memory@rank0: {compute_capability: '8.0', device_name: NVIDIA A100-SXM4-80GB}
    steps:
      - {flow: config-create-engine-config, as: cfg}
      - flow: models-get-model
        input:
          model: neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV
          hf_config: {architectures: [LlamaForCausalLM], hidden_size: 4096, max_position_embeddings: 8192, num_attention_heads: 32, num_hidden_layers: 32, num_key_value_heads: 8, torch_dtype: bfloat16, vocab_size: 128256, weights_bytes: 9081200640, quantization_config: {quant_method: fp8, activation_scheme: static, ignored_layers: [lm_head], kv_cache_scheme: static}}
        as: load
      - {flow: models-llama-forward, as: fwd}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.quantization == 'fp8'"
      - "steps.fwd.result.ok && calls['custom-ops.marlin-gemm'] > 0 && calls['cutlass-fp8-scaled-mm-linear-kernel.apply-scaled-mm'] == 0"
