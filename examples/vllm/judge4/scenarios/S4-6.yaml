schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-6-a
    name: "(a) base64 data URL decodes locally; a non-base64 data URL is 501 NotImplementedError"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    steps:
      - {as: a1, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "data:image/png;base64,iVBORw0KGgo="}}, {type: text, text: "What is this?"}]}]}}}
      - {as: a2, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "data:image/png,iVBORw0KGgo="}}, {type: text, text: "What is this?"}]}]}}}
    expect:
      - "steps.a1.result.ok"
      - "calls['remote-media-host.get'] == 0 && calls['vllm-public-assets-s3.get-object'] == 0"
      - "!steps.a2.result.ok && steps.a2.result.error.status == 501 && steps.a2.result.error.code == 'NotImplementedError' && steps.a2.result.error.message == 'Only base64 data URLs are supported for now.'"
  - id: bench-s4-6-b
    name: "(b) file:// without --allowed-local-media-path is 500 InternalServerError; with /data, /etc/passwd is 400"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    steps:
      - {as: b1, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "file:///etc/passwd"}}, {type: text, text: "What is this?"}]}]}}}
      - {as: b2, interface: media-connector.fetch-image, caller: hf-renderer, input: {image_url: "file:///etc/passwd", allowed_local_media_path: /data}}
    expect:
      - "!steps.b1.result.ok && steps.b1.result.error.status == 500 && steps.b1.result.error.code == 'InternalServerError' && steps.b1.result.error.message == 'Cannot load local files without `--allowed-local-media-path`.'"
      - "!steps.b2.result.ok && steps.b2.result.error.code == 'value-error' && steps.b2.result.error.message == 'The file path /etc/passwd must be a subpath of `--allowed-local-media-path /data`.'"
  - id: bench-s4-6-c
    name: "(c) allowed-media-domains refuses example.com before any connection; an allowed URL that answers 404 is a 422, not retried"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    faults:
      - {target: remote-media-host.get, type: error, code: http-404, status: 404}
    steps:
      - {as: c1, interface: media-connector.fetch-image, caller: hf-renderer, input: {image_url: "https://example.com/cat.png", allowed_media_domains: [upload.wikimedia.org]}}
      - {as: c2, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "https://upload.wikimedia.org/cat.png"}}, {type: text, text: "What is this?"}]}]}}}
    expect:
      - "!steps.c1.result.ok && steps.c1.result.error.code == 'value-error' && steps.c1.result.error.message == \"The URL must be from one of the allowed domains: ['upload.wikimedia.org']. Input URL domain: example.com\""
      - "!steps.c2.result.ok && steps.c2.result.error.status == 422 && steps.c2.result.error.code == 'UnprocessableEntityError' && steps.c2.result.error.data.param == 'image_url' && steps.c2.result.error.message == 'Failed to fetch media from URL: HTTP 404 error (parameter=image_url, value=https://upload.wikimedia.org/cat.png)'"
      - "calls['remote-media-host.get'] == 1"
  - id: bench-s4-6-d
    name: "(d) a host that never answers: 3 attempts with 5, 20, 80 s timeouts and 1 s, 4 s sleeps (~110 s), then 500"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    max_virtual_ms: 400000
    faults:
      - {target: remote-media-host.get, type: hang, forever: true}
    steps:
      - {as: d, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "https://upload.wikimedia.org/cat.png"}}, {type: text, text: "What is this?"}]}]}}}
    expect:
      - "!steps.d.result.ok && steps.d.result.error.status == 500 && steps.d.result.error.code == 'InternalServerError'"
      - "calls['remote-media-host.get'] == 3"
      - "duration_ms >= 109000 && duration_ms < 112000"
