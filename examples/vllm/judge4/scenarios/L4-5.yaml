schema_version: 1
id: vllm
scenarios:
  - id: bench-l4-5a-model-flag
    name: "L4-5 (a): --model is moved to the positional model_tag with a deprecation warning"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    input: {argv: [serve, --model, meta-llama/Llama-3.1-8B-Instruct, --served-model-name, llama-8b, llama], args: {}}
    expect:
      - "result.ok"
      - "has(ctx.model_flag_warning) || trace.exists(e, e.type == 'note' && string(e).contains('should provide the model as a positional argument'))"
  - id: bench-l4-5b-served-name-without-model
    name: "L4-5 (b): --served-model-name with no positional model fails during parsing"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    input: {argv: [serve, --served-model-name, llama-8b], args: {}}
    expect:
      - "!result.ok && result.error.message == '`model` should be provided as the first positional argument when using `vllm serve`. i.e. `vllm serve <model> --<arg> <value>`.'"
  - id: bench-l4-5c-two-served-names
    name: "L4-5 (c): two served names: /v1/models lists both; vllm:* series carry only the first"
    fixtures: [full-tp1-llama-8b]
    config: {served-model-name: [llama-8b, llama]}
    max_events: 400000
    steps:
      - {flow: serving-api-models-list, as: models}
      - {flow: serving-api-chat-completion, as: chat, input: {headers: {X-Request-Id: n1}, body: {model: llama, max_tokens: 4}}}
    expect:
      - "steps.models.result.ok && steps.models.result.value.data.map(m, m.id) == ['llama-8b', 'llama']"
      - "steps.chat.result.ok"
      - "state['prometheus-registry'].metrics['vllm:request_success{model_name=\"llama-8b\",engine=\"0\",finished_reason=\"length\"}'] == 1"
      - "!state['prometheus-registry'].metrics.exists(k, k.contains('model_name=\"llama\"'))"
  - id: bench-l4-5c-no-served-name
    name: "L4-5 (c): without --served-model-name the label is the model string as given"
    fixtures: [full-tp1-llama-8b]
    config: {served-model-name: []}
    max_events: 400000
    steps:
      - {flow: serving-api-models-list, as: models}
      - {flow: serving-api-chat-completion, as: chat, input: {headers: {X-Request-Id: n2}, body: {model: meta-llama/Llama-3.1-8B-Instruct, max_tokens: 4}}}
    expect:
      - "steps.models.result.value.data.map(m, m.id) == ['meta-llama/Llama-3.1-8B-Instruct']"
      - "state['prometheus-registry'].metrics.exists(k, k.startsWith('vllm:request_success{model_name=\"meta-llama/Llama-3.1-8B-Instruct\",engine=\"0\",finished_reason=\"length\"}'))"
  - id: bench-l4-5d-port-in-use-wins
    name: "L4-5 (d): port 8000 held elsewhere plus --max-model-len 200000: the bind error wins; no engine core, no weights"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    input: {argv: [serve], args: {model_tag: meta-llama/Llama-3.1-8B-Instruct, max_model_len: 200000}}
    faults:
      - {target: launcher.setup-server, type: error, code: OSError, message: "[Errno 98] Address already in use"}
    expect:
      - "!result.ok && result.error.code == 'OSError' && result.error.message == '[Errno 98] Address already in use'"
      - "calls['engine-args.create-engine-config'] == 0 && calls['engine-core-proc.run-engine-core'] == 0 && calls['gpu-worker-impl.load-model'] == 0"
  - id: bench-l4-5d-max-model-len-alone
    name: "L4-5 (d): without the port conflict, --max-model-len 200000 is refused while building the config (after the bind)"
    flow: serving-api-cli-serve
    fixtures: [full-tp1-llama-8b]
    input: {argv: [serve], args: {model_tag: meta-llama/Llama-3.1-8B-Instruct, max_model_len: 200000}}
    expect:
      - "!result.ok && result.error.message.contains('200000') && calls['launcher.setup-server'] == 1"
      - "calls['engine-core-proc.run-engine-core'] == 0"
      - "state.launcher.listening == false"
