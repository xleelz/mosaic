schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-8-a-default-backend
    name: "P4-8(a) no flag: non-SM100 priority FLASH_ATTN first; FA3 on Hopper"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: attn-select-backend, as: sel}
      - {flow: attn-fa-version, as: fa}
    expect:
      - "steps.sel.result.ok && steps.sel.result.value.backend_cls_path.contains('FlashAttentionBackend')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'attention-backend.validate-configuration').size() >= 1"
      - "steps.fa.result.ok && steps.fa.result.value.fa_version == 3"
      - "trace.exists(e, e.type == 'note' && e.title.contains('attention backend out of potential backends'))"
  - id: bench-p4-8-b-flashinfer
    name: "P4-8(b) --attention-backend FLASHINFER: validated alone, no priority scan"
    fixtures: [full-tp1-llama-8b]
    config: {attention-backend: FLASHINFER}
    steps:
      - {flow: attn-select-backend, as: sel}
    expect:
      - "steps.sel.result.ok && steps.sel.result.value.backend_cls_path.contains('FlashInfer')"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'attention-backend.validate-configuration').size() == 1"
      - "trace.exists(e, e.type == 'note' && e.title == 'Using AttentionBackendEnum.FLASHINFER backend.')"
  - id: bench-p4-8-c-flashinfer-mla
    name: "P4-8(c) --attention-backend FLASHINFER_MLA on Llama: ValueError in the worker, then engine core initialization fails"
    fixtures: [full-tp1-llama-8b]
    config: {attention-backend: FLASHINFER_MLA}
    steps:
      - {flow: attn-select-backend, as: sel}
      - {flow: engine-startup, as: up}
    expect:
      - "!steps.sel.result.ok && steps.sel.result.error.code == 'value-error' && steps.sel.result.error.message.startsWith('Selected backend AttentionBackendEnum.FLASHINFER_MLA is not valid for this configuration. Reason: [')"
      - "steps.sel.result.error.message.contains('non-MLA not supported')"
      - "!steps.up.result.ok && steps.up.result.error.message.startsWith('Engine core initialization failed. See root cause above.')"
  - id: bench-p4-8-d-dummy-load
    name: "P4-8(d) --load-format dummy: DummyModelLoader, nothing downloaded, weights uniform(-1e-3, 1e-3) seeded 1234"
    fixtures: [full-tp1-llama-8b]
    config: {load-format: dummy}
    steps:
      - {flow: models-get-model, as: load}
    expect:
      - "steps.load.result.ok && steps.load.result.value.loader == 'dummy-model-loader'"
      - "calls['dummy-model-loader.load-weights'] == 1 && calls['default-model-loader.prepare-weights'] == 0"
      - "state['gpu-memory@rank0'].weights_bytes > 0"
      - "trace.exists(e, e.type == 'note' && (e.title.contains('1234') || e.title.contains('1e-3')))"
  - id: bench-p4-8-e-seed
    name: "P4-8(e) seed defaults to 0; workers reseed; unseeded request seed drawn from np.random so two fresh servers agree and --seed 1 differs"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: config-create-engine-config, as: cfg}
    expect:
      - "steps.cfg.result.ok && has(steps.cfg.result.value.model_config.seed) && steps.cfg.result.value.model_config.seed == 0"
