schema_version: 1
id: vllm
scenarios:
  - id: bench-l4-8a-ipc-cache-default
    name: "L4-8 (a): one API process, DP 1: key-only LRU sender in P0, LRU receiver in the engine core; a repeated image crosses without tensors"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    max_iterations: 400000
    steps:
      - {interface: multi-modal-cache-factories.processor-cache-from-config, caller: api-server, as: p0}
      - {interface: multi-modal-cache-factories.engine-receiver-cache-from-config, caller: engine-core, as: p1}
      - {flow: serving-api-multimodal-chat, as: first, input: {headers: {X-Request-Id: m1}, body: {model: qwen2-vl-7b, max_tokens: 2}}}
      - {flow: serving-api-multimodal-chat, as: second, input: {headers: {X-Request-Id: m2}, body: {model: qwen2-vl-7b, max_tokens: 2}}}
    expect:
      - "steps.p0.result.value == {'cache_type': 'lru', 'component': 'lru-key-replicated-sender-cache'}"
      - "steps.p1.result.value.component == 'lru-key-replicated-receiver-cache'"
      - "config['mm-processor-cache-gb'] == 4 && config['mm-processor-cache-type'] == 'lru'"
      - "steps.first.result.ok && steps.second.result.ok"
      # the repeated image hits the P0 key cache and crosses IPC without its data (lru.py:51-65)
      - "calls['lru-key-replicated-sender-cache.get-and-update'] == 2 && trace.exists(e, e.type == 'call.end' && e.interface == 'lru-key-replicated-sender-cache.get-and-update' && e.output.ok && e.output.value.hit == true && e.output.value.item == null)"
  - id: bench-l4-8b-dp2-processor-only
    name: "L4-8 (b): DP 2 (internal LB) turns IPC caching off: processor_only, no receiver cache"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {data-parallel-size: 2}
    steps:
      - {interface: multi-modal-cache-factories.processor-cache-from-config, caller: api-server, as: p0}
      - {interface: multi-modal-cache-factories.engine-receiver-cache-from-config, caller: engine-core, as: p1}
    expect:
      - "steps.p0.result.value.cache_type == 'processor_only' && steps.p0.result.value.component == 'multi-modal-processor-only-cache'"
      - "steps.p1.result.value.component == null"
  - id: bench-l4-8b-cache-gb-zero
    name: "L4-8 (b): --mm-processor-cache-gb 0 disables the cache"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {mm-processor-cache-gb: 0}
    steps:
      - {interface: multi-modal-cache-factories.processor-cache-from-config, caller: api-server, as: p0}
    expect:
      - "steps.p0.result.value.cache_type == null"
  - id: bench-l4-8c-shm-size-without-shm
    name: "L4-8 (c): --mm-shm-cache-max-object-size-mb 256 without the shm cache type fails validation"
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {interface: multimodal-config.init, caller: operator, as: bad, input: {mm_shm_cache_max_object_size_mb: 256}}
      - {interface: multimodal-config.init, caller: operator, as: ok, input: {mm_shm_cache_max_object_size_mb: 256, mm_processor_cache_type: shm}}
    expect:
      - "!steps.bad.result.ok && steps.bad.result.error.message == \"'mm_shm_cache_max_object_size_mb' should only be set when 'mm_processor_cache_type' is 'shm'.\""
      - "steps.ok.result.ok"
  - id: bench-l4-8c-shm-size-through-engine-args
    name: "L4-8 (c): the same flag through create_engine_config"
    flow: config-create-engine-config
    fixtures: [full-vl-qwen2-vl-7b]
    input: {mm_shm_cache_max_object_size_mb: 256}
    expect:
      - "!result.ok && result.error.message.contains('mm_shm_cache_max_object_size_mb')"
  - id: bench-l4-8c-shm-receiver-in-worker
    name: "L4-8 (c): with shm, no engine-core receiver (the worker holds it)"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {mm-processor-cache-type: shm}
    steps:
      - {interface: multi-modal-cache-factories.engine-receiver-cache-from-config, caller: engine-core, as: p1}
      - {interface: multi-modal-cache-factories.processor-cache-from-config, caller: api-server, as: p0}
    expect:
      - "steps.p1.result.value.component == null"
      - "steps.p0.result.ok && steps.p0.result.value.cache_type == 'shm'"
  - id: bench-l4-8d-text-only-mode
    name: "L4-8 (d): limits {image: 0, video: 0}: text-only mode, no processor cache, visual not built"
    flow: config-create-engine-config
    fixtures: [full-vl-qwen2-vl-7b]
    config: {limit-mm-per-prompt: {image: 0, video: 0}}
    expect:
      - "result.ok && result.value.model_config.is_multimodal_model == true"
      - "has(result.value.model_config.supports_multimodal_inputs) && result.value.model_config.supports_multimodal_inputs == false"
  - id: bench-l4-8d-image-zero-only
    name: "L4-8 (d): limits {image: 0} alone: video stays at 999, the model stays multimodal and the cache is built"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {limit-mm-per-prompt: {image: 0}}
    steps:
      - {interface: multi-modal-cache-factories.processor-cache-from-config, caller: api-server, as: p0}
    expect:
      - "steps.p0.result.value.cache_type == 'lru'"
