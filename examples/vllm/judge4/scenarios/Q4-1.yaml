schema_version: 1
id: vllm
scenarios:
  - id: bench-q4-1-a-serve-h100-defaults
    name: "Q4-1 (a) vllm serve on an 80 GB H100 with no batch flags: 8192 tokens, 1024 seqs"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 8192 && result.value.scheduler_config.max_num_seqs == 1024"
      - "result.value.scheduler_config.max_model_len == 131072"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'engine-args.get-batch-defaults')"
      - "trace.exists(e, e.type == 'note' && e.title.startsWith('Device memory >= 70 GiB and not an A100'))"
  - id: bench-q4-1-a-sched-5000-one-step
    name: "Q4-1 (a) with the serve defaults (8192/1024) a 5000-token prompt prefills in one step"
    fixtures: [full-tp1-llama-8b]
    config: {max-num-batched-tokens: 8192, max-num-seqs: 1024}
    steps:
      - flow: scheduler-add-request
        input: {request_id: req-a, prompt_segments: [{key: p5000, num_tokens: 5000}], sampling_params: {max_tokens: 3}}
        as: add
      - {flow: scheduler-schedule, input: {}, as: s1}
    expect:
      - "steps.s1.result.value.num_scheduled_tokens['req-a'] == 5000"
  - id: bench-q4-1-a-sched-10000-two-chunks
    name: "Q4-1 (a) a 10000-token prompt takes 8192 then 1808"
    fixtures: [full-tp1-llama-8b]
    config: {max-num-batched-tokens: 8192, max-num-seqs: 1024}
    steps:
      - flow: scheduler-add-request
        input: {request_id: req-b, prompt_segments: [{key: p10000, num_tokens: 10000}], sampling_params: {max_tokens: 3}}
        as: add
      - {flow: scheduler-schedule, input: {}, as: s1}
      - {flow: scheduler-schedule, input: {}, as: s2}
    expect:
      - "steps.s1.result.value.num_scheduled_tokens['req-b'] == 8192"
      - "steps.s2.result.value.num_scheduled_tokens['req-b'] == 1808"
  - id: bench-q4-1-b-llm-class-h100
    name: "Q4-1 (b) the LLM class on the H100: 16384 tokens, 1024 seqs"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {usage_context: LLM_CLASS, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 16384 && result.value.scheduler_config.max_num_seqs == 1024"
  - id: bench-q4-1-b-a100-serve
    name: "Q4-1 (b) an 80 GB A100 falls to the last tier: serve 2048 / 256"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    state:
      platforms: {host: {cpu_architecture: X86, device_count: 1, device_name: "NVIDIA A100-SXM4-80GB", device_total_memory: 85899345920, nvml_available: true, nvml_gpu_count: 1}}
    input: {usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 2048 && result.value.scheduler_config.max_num_seqs == 256"
      - "trace.exists(e, e.type == 'note' && e.title.startsWith('Other GPUs (A100'))"
  - id: bench-q4-1-b-a100-llm
    name: "Q4-1 (b) an 80 GB A100 with the LLM class: 8192 / 256"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    state:
      platforms: {host: {cpu_architecture: X86, device_count: 1, device_name: "NVIDIA A100-SXM4-80GB", device_total_memory: 85899345920, nvml_available: true, nvml_gpu_count: 1}}
    input: {usage_context: LLM_CLASS, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 8192 && result.value.scheduler_config.max_num_seqs == 256"
  - id: bench-q4-1-b-b200-both
    name: "Q4-1 (b) a GPU with >= 160 GiB (B200) gets 16384 / 1024 for serve and LLM"
    fixtures: [full-tp1-llama-8b]
    state:
      platforms: {host: {cpu_architecture: X86, device_count: 1, device_name: "NVIDIA B200", device_total_memory: 191630000000, nvml_available: true, nvml_gpu_count: 1}}
    steps:
      - {flow: config-create-engine-config, input: {usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: null}, as: serve}
    expect:
      - "steps.serve.result.value.scheduler_config.max_num_batched_tokens == 16384 && steps.serve.result.value.scheduler_config.max_num_seqs == 1024"
  - id: bench-q4-1-b-no-usage-context
    name: "Q4-1 (b) with no usage-context entry the SchedulerConfig defaults 2048 / 128 apply"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {usage_context: ENGINE_CONTEXT, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 2048 && result.value.scheduler_config.max_num_seqs == 128"
  - id: bench-q4-1-c-throughput
    name: "Q4-1 (c) --performance-mode throughput doubles both unset values: 16384 / 2048"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: null, performance_mode: throughput}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 16384 && result.value.scheduler_config.max_num_seqs == 2048"
  - id: bench-q4-1-c-throughput-user-seqs
    name: "Q4-1 (c) throughput with --max-num-seqs 128 doubles only tokens: 16384 / 128"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    input: {usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: 128, performance_mode: throughput}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 16384 && result.value.scheduler_config.max_num_seqs == 128"
  - id: bench-q4-1-c-no-chunked-prefill
    name: "Q4-1 (c) --no-enable-chunked-prefill and no token flag: max(max_model_len, 8192) = 131072"
    flow: config-create-engine-config
    fixtures: [full-tp1-llama-8b]
    config: {enable-chunked-prefill: false}
    input: {usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 131072 && result.value.scheduler_config.max_num_seqs == 1024"
  - id: bench-q4-1-d-cudagraph-1024-seqs
    name: "Q4-1 (d) 1024 seqs on H100: capture ceiling min(2048, 512) = 512; sizes 1,2,4,8..248 by 8, 256..512 by 16"
    fixtures: [full-tp1-llama-8b]
    config: {max-num-batched-tokens: 8192, max-num-seqs: 1024}
    steps:
      - {interface: cuda-graph-manager.init, caller: gpu-model-runner, input: {decode_query_len: 1}, as: cg}
    expect:
      - "steps.cg.result.value.max_capture_size == 512"
      - "state['cuda-graph-manager@rank0'].capture_sizes == [1, 2, 4] + lists.range(31).map(i, 8 * (i + 1)) + lists.range(17).map(i, 256 + 16 * i)"
  - id: bench-q4-1-d-cudagraph-128-seqs
    name: "Q4-1 (d) under 128 seqs (the benchmark's pinned value) the ceiling is 256"
    fixtures: [full-tp1-llama-8b]
    config: {max-num-batched-tokens: 2048, max-num-seqs: 128}
    steps:
      - {interface: cuda-graph-manager.init, caller: gpu-model-runner, input: {decode_query_len: 1}, as: cg}
    expect:
      - "steps.cg.result.value.max_capture_size == 256"
      - "state['cuda-graph-manager@rank0'].capture_sizes[size(state['cuda-graph-manager@rank0'].capture_sizes) - 1] == 256"
