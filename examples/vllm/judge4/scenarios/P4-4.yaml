schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-4-a-fp8-online
    name: "P4-4(a) bf16 Llama + --quantization fp8: stays fp8; get_quant_config warns deprecated and returns OnlineQuantizationConfig(fp8_per_tensor)"
    fixtures: [full-tp1-llama-8b]
    config: {quantization: fp8}
    steps:
      - {flow: config-create-engine-config, input: {quantization: fp8}, as: cfg}
      - {interface: weight-utils.get-quant-config, caller: gpu-worker, input: {quantization: fp8, hf_quant_config: {}}, as: qc}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.quantization == 'fp8'"
      - "steps.qc.result.ok && steps.qc.result.value.config_cls == 'OnlineQuantizationConfig' && steps.qc.result.value.method == 'fp8_per_tensor'"
      - "trace.exists(e, e.type == 'note' && e.title == '--quantization fp8 is deprecated for online quantization; use --quantization fp8_per_tensor instead.')"
      - "calls['fp8-config.from-config'] == 0"
      - "steps.cfg.result.value.quant_config.quant_method == 'online' && steps.cfg.result.value.quant_config.min_capability == 75"
  - id: bench-p4-4-bc-load-and-forward
    name: "P4-4(b)(c) Fp8PerTensorOnlineLinearMethod on 128 LinearBase layers, quantized at load; per-token dynamic activations; CUTLASS"
    fixtures: [full-tp1-llama-8b]
    config: {quantization: fp8}
    steps:
      - {flow: models-get-model, as: load}
      - {flow: models-llama-forward, input: {num_reqs: 16, num_tokens: 16}, as: fwd}
    expect:
      - "steps.load.result.ok && steps.load.result.value.quant == 'fp8_per_tensor'"
      - "trace.exists(e, e.type == 'note' && e.title.startsWith('Quantizing 128 layers of types: mlp.down_proj: 32 (from linear: fp8_per_tensor_static)'))"
      - "steps.fwd.result.ok && calls['cutlass-fp8-scaled-mm-linear-kernel.apply-scaled-mm'] > 0 && calls['unquantized-linear-method.apply'] == 0"
  - id: bench-p4-4-d-shorthand
    name: "P4-4(d) --quantization fp8_per_tensor: no warning, online shortcut; on the FP8 checkpoint, mismatch ValueError"
    fixtures: [full-tp1-llama-8b]
    config: {quantization: fp8_per_tensor}
    steps:
      - {flow: config-create-engine-config, input: {quantization: fp8_per_tensor}, as: cfg}
      - {interface: weight-utils.get-quant-config, caller: gpu-worker, input: {quantization: fp8_per_tensor, hf_quant_config: {}}, as: qc}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.model_config.quantization == 'fp8_per_tensor'"
      - "steps.qc.result.ok && steps.qc.result.value.config_cls == 'OnlineQuantizationConfig' && steps.qc.result.value.method == 'fp8_per_tensor'"
      - "!trace.exists(e, e.type == 'note' && e.title.startsWith('--quantization fp8 is deprecated'))"
  - id: bench-p4-4-d-shorthand-on-fp8-ckpt
    name: "P4-4(d) fp8_per_tensor on the FP8 checkpoint: mismatch ValueError"
    fixtures: [full-fp8-llama-3-8b]
    config: {quantization: fp8_per_tensor}
    steps:
      - {flow: config-create-engine-config, input: {quantization: fp8_per_tensor}, as: cfg}
    expect:
      - "!steps.cfg.result.ok && steps.cfg.result.error.code == 'value-error'"
      - "steps.cfg.result.error.message == 'Quantization method specified in the model config (fp8) does not match the quantization method specified in the `quantization` argument (fp8_per_tensor).'"
