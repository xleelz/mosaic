schema_version: 1
id: vllm
scenarios:
  - id: bench-l4-7a-api-server-count-default
    name: "L4-7 (a): --data-parallel-size 4 --enable-expert-parallel defaults api_server_count to 4 -> run_multi_api_server"
    flow: serving-api-cli-serve
    fixtures: [full-tp4-llama-70b]
    input: {argv: [serve], args: {model_tag: Qwen/Qwen3-30B-A3B, data_parallel_size: 4, tensor_parallel_size: 1}}
    expect:
      - "result.ok && result.value.mode == 'multi-api-server' && result.value.api_server_count == 4"
      # the parent binds the port once with SO_REUSEPORT and forks EngineCore_DP0..3 and ApiServer_0..3
      - "calls['engine-core-proc.run-engine-core'] == 4"
  - id: bench-l4-7bc-dp4-startup
    name: "L4-7 (b, c): DP 4 MoE startup: READY with parallel_config_hash; each client waits for 4 ready responses, sums num_gpu_blocks"
    flow: engine-startup
    fixtures: [full-tp4-llama-70b]
    config: {data-parallel-size: 4, tensor-parallel-size: 1, enable-expert-parallel: true}
    max_events: 400000
    expect:
      - "result.ok"
      - "calls['engine-core-proc.run-engine-core'] == 4"
      - "trace.exists(e, e.type == 'call.start' && e.input != null && type(e.input) == map && 'parallel_config_hash' in e.input)"
  - id: bench-l4-7d-stats-logging-disabled
    name: "L4-7 (d): with api_server_count 4 every StatLoggerManager drops the LoggingStatLogger"
    flow: engine-startup
    fixtures: [full-tp4-llama-70b]
    config: {data-parallel-size: 4, tensor-parallel-size: 1, enable-expert-parallel: true}
    max_events: 400000
    expect:
      - "!state['stat-logger-manager'].loggers.exists(l, l == 'LoggingStatLogger')"
