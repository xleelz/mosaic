    expect:
      - "size(steps.ev1.result.value.events) == 1 && steps.ev1.result.value.events[0].type == 'BlockStored' && size(steps.ev1.result.value.events[0].block_hashes) == 6 && steps.ev1.result.value.events[0].group_idx == 0"
      - "steps.ev1.result.value.events[0].parent_block_hash == null && steps.ev1.result.value.events[0].block_size == 16 && steps.ev1.result.value.events[0].medium == 'GPU' && size(steps.ev1.result.value.events[0].token_ids) == 96"
      - "lists.range(19).map(i, i + 2).filter(k, size(steps['ev' + string(k)].result.value.events) > 0).size() == 1"
      - "lists.range(19).map(i, i + 2).exists(k, size(steps['ev' + string(k)].result.value.events) == 1 && size(steps['ev' + string(k)].result.value.events[0].block_hashes) == 1)"
      - "lists.range(19).map(i, i + 2).exists(k, size(steps['ev' + string(k)].result.value.events) == 1 && steps['ev' + string(k)].result.value.events[0].parent_block_hash == steps.ev1.result.value.events[0].block_hashes[5])"
      - "steps.u20.result.value.outputs[0].finish_reason == 'length' && size(steps.evfin.result.value.events) == 0"
  - id: bench-q4-3-c-prefix-hit-incremental-vs-full
    name: "Q4-3 (c) B's 96-token hit emits nothing in incremental mode; with kv_cache_report_mode full one BlockStored re-announces the 6 hashes, parent null"
    fixtures: [full-tp1-llama-8b]
    config: {enable-kv-cache-events: true, kv-events-publisher: zmq}
    steps:
      - flow: scheduler-add-request
        input: {request_id: req-A, prompt_segments: [{key: shared100, num_tokens: 100}], sampling_params: {max_tokens: 1}}
        as: addA
      - {flow: scheduler-schedule, input: {}, as: s1}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [req-A], sampled_token_ids: [[1001]]}}
        as: u1
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: evA}
      - flow: scheduler-add-request
        input: {request_id: req-B, prompt_segments: [{key: shared100, num_tokens: 100}], sampling_params: {max_tokens: 1}}
        as: addB
      - {flow: scheduler-schedule, input: {}, as: s2}
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: evB}
      - flow: scheduler-add-request
        input: {request_id: req-B2, prompt_segments: [{key: shared100, num_tokens: 100}], sampling_params: {max_tokens: 1, extra_args: {kv_cache_report_mode: full}}}
        as: addB2
      - {flow: scheduler-schedule, input: {}, as: s3}
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: evB2}
    expect:
      - "steps.s2.result.value.scheduled_new_reqs[0].num_computed_tokens == 96"
      - "size(steps.evB.result.value.events) == 0"
      - "size(steps.evB2.result.value.events) == 1 && steps.evB2.result.value.events[0].type == 'BlockStored' && size(steps.evB2.result.value.events[0].block_hashes) == 6"
  - id: bench-q4-3-d-evict-and-reset
    name: "Q4-3 (d) reusing a cached free block emits one BlockRemoved per hash; a prefix-cache reset emits one AllBlocksCleared"
    fixtures: [full-tp1-llama-8b]
    config: {enable-kv-cache-events: true, kv-events-publisher: zmq}
    state:
      block-pool: {num_gpu_blocks: 9}
    steps:
      - flow: scheduler-add-request
        input: {request_id: req-A, prompt_segments: [{key: shared100, num_tokens: 100}], sampling_params: {max_tokens: 1}}
        as: addA
      - {flow: scheduler-schedule, input: {}, as: s1}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [req-A], sampled_token_ids: [[1001]]}}
        as: u1
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: evA}
      - flow: scheduler-add-request
        input: {request_id: req-D, prompt_segments: [{key: other100, num_tokens: 100}], sampling_params: {max_tokens: 1}}
        as: addD
      - {flow: scheduler-schedule, input: {}, as: s2}
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: evD}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s2.result.value", model_runner_output: {req_ids: [req-D], sampled_token_ids: [[1002]]}}
        as: u2
      - {flow: scheduler-reset-prefix-cache, input: {}, as: rst}
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: evR}
    expect:
      - "steps.evD.result.value.events.exists(e, e.type == 'BlockRemoved' && size(e.block_hashes) == 1 && e.group_idx == 0)"
      - "steps.evD.result.value.events.all(e, e.type != 'BlockRemoved' || e.medium == 'GPU')"
      - "steps.rst.result.ok && steps.evR.result.value.events.exists(e, e.type == 'AllBlocksCleared')"
