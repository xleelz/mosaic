schema_version: 1
id: vllm
scenarios:
  - id: bench-q4-3-a-publisher-defaults
    name: "Q4-3 (a) --kv-events-config '{\"enable_kv_cache_events\": true}': publisher defaults to zmq"
    fixtures: [full-tp1-llama-8b]
    config: {enable-kv-cache-events: true}
    steps:
      - {flow: distributed-kv-events-create, input: {data_parallel_rank: 0}, as: c0}
    expect:
      - "steps.c0.result.value.publisher == 'zmq'"
  - id: bench-q4-3-b-first-step-and-decode
