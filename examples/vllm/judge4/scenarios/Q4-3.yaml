        as: u3
      - {flow: scheduler-schedule, input: {}, as: s4}
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: ev4}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s4.result.value", model_runner_output: {req_ids: [req-A], sampled_token_ids: [[1004]]}}
        as: u4
      - {flow: scheduler-schedule, input: {}, as: s5}
      - {interface: kv-cache-manager.take-events, caller: scheduler, input: {}, as: ev5}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s5.result.value", model_runner_output: {req_ids: [req-A], sampled_token_ids: [[1005]]}}
        as: u5
