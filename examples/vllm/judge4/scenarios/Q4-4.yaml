schema_version: 1
id: vllm
scenarios:
  - id: bench-q4-4-ab-image-keys
    name: "Q4-4 (a, b) R2 (image Y) hits only blocks 0-3 (64 tokens) and encodes Y; R3 (X again) hits 960 tokens and schedules no encoder input"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {async-scheduling: false}
    steps:
      - interface: base-multi-modal-processor.apply
        caller: input-processor
        input: {model: Qwen/Qwen2-VL-7B-Instruct, architectures: [Qwen2VLForConditionalGeneration], prompt_token_ids: [1, 2], mm_counts: {image: 1}, mm_uuids: {image: ["https://example.com/x.jpg"]}}
        as: hx
      - interface: base-multi-modal-processor.apply
        caller: input-processor
        input: {model: Qwen/Qwen2-VL-7B-Instruct, architectures: [Qwen2VLForConditionalGeneration], prompt_token_ids: [1, 2], mm_counts: {image: 1}, mm_uuids: {image: ["https://example.com/y.jpg"]}}
        as: hy
      - flow: scheduler-add-request
        input:
          request_id: R1
          mm_features: [{identifier: "hashX", modality: image, offset: 70, length: 800}]
          prompt_segments: [{key: chat-head, num_tokens: 70}, {key: "hashX", num_tokens: 800}, {key: chat-tail, num_tokens: 100}]
          sampling_params: {max_tokens: 1}
        as: addR1
      - {flow: scheduler-schedule, input: {}, as: sR1}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.sR1.result.value", model_runner_output: {req_ids: [R1], sampled_token_ids: [[1001]]}}
        as: uR1
      - flow: scheduler-add-request
        input:
          request_id: R2
          mm_features: [{identifier: "hashY", modality: image, offset: 70, length: 800}]
          prompt_segments: [{key: chat-head, num_tokens: 70}, {key: "hashY", num_tokens: 800}, {key: chat-tail, num_tokens: 100}]
          sampling_params: {max_tokens: 1}
        as: addR2
      - {flow: scheduler-schedule, input: {}, as: sR2}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.sR2.result.value", model_runner_output: {req_ids: [R2], sampled_token_ids: [[1001]]}}
        as: uR2
      - flow: scheduler-add-request
        input:
          request_id: R3
          mm_features: [{identifier: "hashX", modality: image, offset: 70, length: 800}]
          prompt_segments: [{key: chat-head, num_tokens: 70}, {key: "hashX", num_tokens: 800}, {key: chat-tail, num_tokens: 100}]
          sampling_params: {max_tokens: 1}
        as: addR3
      - {flow: scheduler-schedule, input: {}, as: sR3}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.sR3.result.value", model_runner_output: {req_ids: [R3], sampled_token_ids: [[1001]]}}
        as: uR3
    expect:
      - "steps.hx.result.value.mm_hashes.image[0] != steps.hy.result.value.mm_hashes.image[0]"
      - "steps.sR1.result.value.scheduled_encoder_inputs == {'R1': [0]}"
      - "steps.sR2.result.value.scheduled_new_reqs[0].num_computed_tokens == 64 && steps.sR2.result.value.num_scheduled_tokens['R2'] == 906"
      - "steps.sR2.result.value.scheduled_encoder_inputs == {'R2': [0]}"
      - "steps.sR3.result.value.scheduled_new_reqs[0].num_computed_tokens == 960 && steps.sR3.result.value.num_scheduled_tokens['R3'] == 10"
      - "steps.sR3.result.value.scheduled_encoder_inputs == {}"
  - id: bench-q4-4-c-uuid-replaces-content-hash
    name: "Q4-4 (c) R4 (Z) and R5 (W) both send uuid img-1: same identifier, R5 hits 960 tokens computed from Z and never encodes W"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {async-scheduling: false}
    steps:
      - interface: base-multi-modal-processor.apply
        caller: input-processor
        input: {model: Qwen/Qwen2-VL-7B-Instruct, architectures: [Qwen2VLForConditionalGeneration], prompt_token_ids: [1, 2], mm_counts: {image: 1}, mm_uuids: {image: ["img-1"]}}
        as: hz
      - interface: base-multi-modal-processor.apply
        caller: input-processor
        input: {model: Qwen/Qwen2-VL-7B-Instruct, architectures: [Qwen2VLForConditionalGeneration], prompt_token_ids: [1, 2], mm_counts: {image: 1}, mm_uuids: {image: ["img-1"]}}
        as: hw
      - flow: scheduler-add-request
        input:
          request_id: R4
          mm_features: [{identifier: "= steps.hz.result.value.mm_hashes.image[0]", modality: image, offset: 70, length: 800}]
          prompt_segments: [{key: chat-head, num_tokens: 70}, {key: "= steps.hz.result.value.mm_hashes.image[0]", num_tokens: 800}, {key: chat-tail, num_tokens: 100}]
          sampling_params: {max_tokens: 1}
        as: addR4
      - {flow: scheduler-schedule, input: {}, as: sR4}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.sR4.result.value", model_runner_output: {req_ids: [R4], sampled_token_ids: [[1001]]}}
        as: uR4
      - flow: scheduler-add-request
        input:
          request_id: R5
          mm_features: [{identifier: "= steps.hw.result.value.mm_hashes.image[0]", modality: image, offset: 70, length: 800}]
          prompt_segments: [{key: chat-head, num_tokens: 70}, {key: "= steps.hw.result.value.mm_hashes.image[0]", num_tokens: 800}, {key: chat-tail, num_tokens: 100}]
          sampling_params: {max_tokens: 1}
        as: addR5
      - {flow: scheduler-schedule, input: {}, as: sR5}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.sR5.result.value", model_runner_output: {req_ids: [R5], sampled_token_ids: [[1001]]}}
        as: uR5
    expect:
      - "steps.hz.result.value.mm_hashes.image[0] == steps.hw.result.value.mm_hashes.image[0]"
      - "steps.hz.result.value.mm_hashes.image[0] == 'img-1'"
      - "steps.sR5.result.value.scheduled_new_reqs[0].num_computed_tokens == 960 && steps.sR5.result.value.scheduled_encoder_inputs == {}"
  - id: bench-q4-4-d-hash-algo
    name: "Q4-4 (d) default sha256 with the fixed vllm-none-hash seed; xxhash without PYTHONHASHSEED gets a random per-process seed and a warning"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: kv-cache-utils.init-none-hash, caller: engine-core, input: {hash_fn_name: sha256, pythonhashseed: null}, as: sha}
      - {interface: kv-cache-utils.init-none-hash, caller: engine-core, input: {hash_fn_name: xxhash, pythonhashseed: null}, as: xx}
      - {interface: kv-cache-utils.init-none-hash, caller: engine-core, input: {hash_fn_name: md5, pythonhashseed: null}, as: bad}
    expect:
      - "steps.sha.result.value.seed == 'vllm-none-hash' && !steps.sha.result.value.random_seed"
      - "steps.xx.result.value.random_seed"
      - "!steps.bad.result.ok && steps.bad.result.error.message == 'Unsupported hash function: md5'"
      - "trace.exists(e, e.type == 'note' && e.title.startsWith('Using a random per-process NONE_HASH seed because xxhash is not collision resistant'))"
