schema_version: 1
id: vllm
scenarios:
  - id: bench-q4-2-a-eot-and-end-of-text
    name: "Q4-2 (a) 128009 is eos_token_id (stop, stop_reason null); 128001 is a merged stop token id (stop, stop_reason 128001)"
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: input-processor.process-inputs
        caller: api-server
        input: {request_id: r-eot, prompt_token_ids: [128000, 9906, 1917], sampling_params: {max_tokens: 16}}
        as: ip
      - flow: scheduler-add-request
        input: {request_id: r-eot, prompt_token_ids: [128000, 9906, 1917], sampling_params: "= steps.ip.result.value.sampling_params"}
        as: add1
      - flow: scheduler-add-request
        input: {request_id: r-eot2, prompt_token_ids: [128000, 9906, 1917], sampling_params: "= steps.ip.result.value.sampling_params"}
        as: add2
      - {flow: scheduler-schedule, input: {}, as: s1}
      - flow: scheduler-update-from-output
        input:
          scheduler_output: "= steps.s1.result.value"
          model_runner_output: {req_ids: [r-eot, r-eot2], sampled_token_ids: [[128009], [128001]]}
        as: u1
    expect:
      - "steps.ip.result.value.sampling_params.eos_token_id == 128009"
      - "128001 in steps.ip.result.value.sampling_params.stop_token_ids && 128008 in steps.ip.result.value.sampling_params.stop_token_ids && !(128009 in steps.ip.result.value.sampling_params.stop_token_ids)"
      - "steps.u1.result.value.outputs.exists(o, o.request_id == 'r-eot' && o.finish_reason == 'stop' && o.stop_reason == null)"
      - "steps.u1.result.value.outputs.exists(o, o.request_id == 'r-eot2' && o.finish_reason == 'stop' && o.stop_reason == 128001)"
      - "trace.exists(e, e.type == 'note' && e.title == 'EOS sampled') && trace.exists(e, e.type == 'note' && e.title == 'Stop token id sampled')"
  - id: bench-q4-2-b-eos-as-fifth-of-max-tokens-5
    name: "Q4-2 (b) EOS sampled as the 5th of max_tokens 5: EOS is checked before length, so stop (not length) with 5 tokens"
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: input-processor.process-inputs
        caller: api-server
        input: {request_id: r-b, prompt_token_ids: [128000, 9906, 1917], sampling_params: {max_tokens: 5}}
        as: ip
      - flow: scheduler-add-request
        input: {request_id: r-b, prompt_token_ids: [128000, 9906, 1917], sampling_params: "= steps.ip.result.value.sampling_params"}
        as: add
      - {flow: scheduler-schedule, input: {}, as: s1}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [r-b], sampled_token_ids: [[1000]]}}
        as: u1
      - {flow: scheduler-schedule, input: {}, as: s2}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s2.result.value", model_runner_output: {req_ids: [r-b], sampled_token_ids: [[1001]]}}
        as: u2
      - {flow: scheduler-schedule, input: {}, as: s3}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s3.result.value", model_runner_output: {req_ids: [r-b], sampled_token_ids: [[1002]]}}
        as: u3
      - {flow: scheduler-schedule, input: {}, as: s4}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s4.result.value", model_runner_output: {req_ids: [r-b], sampled_token_ids: [[1003]]}}
        as: u4
      - {flow: scheduler-schedule, input: {}, as: s5}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s5.result.value", model_runner_output: {req_ids: [r-b], sampled_token_ids: [[128009]]}}
        as: u5
    expect:
      - "[1,2,3,4].all(k, steps['u' + string(k)].result.value.outputs[0].finish_reason == null)"
      - "steps.u5.result.value.outputs[0].finish_reason == 'stop' && steps.u5.result.value.outputs[0].stop_reason == null"
      - "steps.s5.result.value.scheduled_cached_reqs.num_output_tokens == [4]"
      - "trace.exists(e, e.type == 'note' && e.title == 'EOS sampled') && !trace.exists(e, e.type == 'note' && e.title == 'Length cap (max_tokens or max_model_len)')"
  - id: bench-q4-2-c-ignore-eos-length
    name: "Q4-2 (c) ignore_eos: eos_token_id unset, generation-config ids not merged; 128001 then 128009 as 5th end with length"
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: input-processor.process-inputs
        caller: api-server
        input: {request_id: r-c, prompt_token_ids: [128000, 9906, 1917], sampling_params: {max_tokens: 5, ignore_eos: true}}
        as: ip
      - flow: scheduler-add-request
        input: {request_id: r-c, prompt_token_ids: [128000, 9906, 1917], sampling_params: "= steps.ip.result.value.sampling_params"}
        as: add
      - {flow: scheduler-schedule, input: {}, as: s1}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [r-c], sampled_token_ids: [[1000]]}}
        as: u1
      - {flow: scheduler-schedule, input: {}, as: s2}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s2.result.value", model_runner_output: {req_ids: [r-c], sampled_token_ids: [[128001]]}}
        as: u2
      - {flow: scheduler-schedule, input: {}, as: s3}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s3.result.value", model_runner_output: {req_ids: [r-c], sampled_token_ids: [[1002]]}}
        as: u3
      - {flow: scheduler-schedule, input: {}, as: s4}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s4.result.value", model_runner_output: {req_ids: [r-c], sampled_token_ids: [[1003]]}}
        as: u4
      - {flow: scheduler-schedule, input: {}, as: s5}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s5.result.value", model_runner_output: {req_ids: [r-c], sampled_token_ids: [[128009]]}}
        as: u5
    expect:
      - "steps.ip.result.value.sampling_params.eos_token_id == null && steps.ip.result.value.sampling_params.stop_token_ids == []"
      - "[1,2,3,4].all(k, steps['u' + string(k)].result.value.outputs[0].finish_reason == null)"
      - "steps.u5.result.value.outputs[0].finish_reason == 'length' && steps.u5.result.value.outputs[0].stop_reason == null"
  - id: bench-q4-2-d-repetition-detection
    name: "Q4-2 (d) repetition_detection {max_pattern_size: 4, min_count: 3} on looping output ends FINISHED_REPETITION / finish_reason repetition"
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: input-processor.process-inputs
        caller: api-server
        input: {request_id: r-d, prompt_token_ids: [128000, 9906, 1917], sampling_params: {max_tokens: 64, repetition_detection: {max_pattern_size: 4, min_count: 3}}}
        as: ip
      - flow: scheduler-add-request
        input: {request_id: r-d, prompt_token_ids: [128000, 9906, 1917], sampling_params: "= steps.ip.result.value.sampling_params"}
        as: add
      - {flow: scheduler-schedule, input: {}, as: s1}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s1.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[11]]}}
        as: u1
      - {flow: scheduler-schedule, input: {}, as: s2}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s2.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[12]]}}
        as: u2
      - {flow: scheduler-schedule, input: {}, as: s3}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s3.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[13]]}}
        as: u3
      - {flow: scheduler-schedule, input: {}, as: s4}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s4.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[14]]}}
        as: u4
      - {flow: scheduler-schedule, input: {}, as: s5}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s5.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[11]]}}
        as: u5
      - {flow: scheduler-schedule, input: {}, as: s6}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s6.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[12]]}}
        as: u6
      - {flow: scheduler-schedule, input: {}, as: s7}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s7.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[13]]}}
        as: u7
      - {flow: scheduler-schedule, input: {}, as: s8}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s8.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[14]]}}
        as: u8
      - {flow: scheduler-schedule, input: {}, as: s9}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s9.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[11]]}}
        as: u9
      - {flow: scheduler-schedule, input: {}, as: s10}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s10.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[12]]}}
        as: u10
      - {flow: scheduler-schedule, input: {}, as: s11}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s11.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[13]]}}
        as: u11
      - {flow: scheduler-schedule, input: {}, as: s12}
      - flow: scheduler-update-from-output
        input: {scheduler_output: "= steps.s12.result.value", model_runner_output: {req_ids: [r-d], sampled_token_ids: [[14]]}}
        as: u12
    expect:
      - "steps.u12.result.value.outputs[0].finish_reason == 'repetition' && steps.u12.result.value.outputs[0].stop_reason == 'repetition_detected'"
  - id: bench-q4-2-d-min-count-1-rejected
    name: "Q4-2 (d) repetition_detection min_count 1 with max_pattern_size 4 is a 400"
    fixtures: [full-tp1-llama-8b]
    steps:
      - interface: sampling-params.post-init
        caller: api-server
        input: {max_tokens: 16, repetition_detection: {max_pattern_size: 4, min_count: 1}}
        as: sp
    expect:
      - "!steps.sp.result.ok && steps.sp.result.error.message.startsWith('min_count must be >= 2 to detect repetitive patterns in engine output.')"
