schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-5-abc-tp2-ep
    name: "P4-5(a)(b)(c) Mixtral TP 2 + EP: MoE tp 1, ep 2, ep_rank = tp_rank; 4 local experts per rank (linear 0-3 / 4-7); no all2all at DP 1; output all-reduced over TP"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    steps:
      - {flow: config-create-engine-config, input: {model: "= config['model']"}, as: cfg}
      - {flow: wr-load-model, on: rank0, as: load0}
      - {flow: wr-load-model, on: rank1, as: load1}
      - {flow: models-mixtral-forward, on: rank0, as: fwd0, await: false}
      - {flow: models-mixtral-forward, on: rank1, as: fwd1}
      - {interface: expert-map-manager.determine-expert-map, caller: gpu-worker, input: {global_num_experts: 8, ep_size: 2, ep_rank: 0, expert_placement_strategy: linear}, as: map0}
      - {interface: expert-map-manager.determine-expert-map, caller: gpu-worker, input: {global_num_experts: 8, ep_size: 2, ep_rank: 1, expert_placement_strategy: linear}, as: map1}
    expect:
      # (a)
      - "steps.cfg.result.ok && steps.cfg.result.value.parallel_config.world_size == 2 && steps.cfg.result.value.parallel_config.enable_expert_parallel"
      - "state['mixtral-for-causal-lm@rank0'].cfg.moe_tp == 1 && state['mixtral-for-causal-lm@rank0'].cfg.ep_size == 2 && state['mixtral-for-causal-lm@rank0'].cfg.ep_rank == 0 && state['mixtral-for-causal-lm@rank1'].cfg.ep_rank == 1"
      - "trace.exists(e, e.type == 'note' && e.title.contains('Worker_TP0_EP0'))"
      # (b)
      - "trace.exists(e, e.type == 'note' && e.title.contains('Expert parallelism is enabled'))"
      - "state['mixtral-for-causal-lm@rank0'].cfg.num_local_physical_experts == 4 && state['mixtral-for-causal-lm@rank1'].cfg.num_local_physical_experts == 4"
      - "steps.map0.result.value.expert_map == [0,1,2,3,-1,-1,-1,-1] && steps.map1.result.value.expert_map == [-1,-1,-1,-1,0,1,2,3]"
      - "calls['expert-map-manager.determine-expert-map'] > 2"
      # (c)
      - "!steps.cfg.result.value.parallel_config.use_all2all && calls['group-coordinator.dispatch'] == 0 && calls['group-coordinator.combine'] == 0"
      - "steps.fwd0.result.ok && steps.fwd1.result.ok && calls_by_instance['tensor-model-parallel.all-reduce@rank0'] > 0"
  - id: bench-p4-5-d-tp2-no-ep
    name: "P4-5(d) without --enable-expert-parallel: no EP, every rank holds all 8 experts, intermediate TP-sharded to 7168"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {enable-expert-parallel: false}
    steps:
      - {flow: wr-load-model, on: rank0, as: load0}
      - {flow: wr-load-model, on: rank1, as: load1}
      - {flow: models-mixtral-forward, on: rank0, as: fwd0, await: false}
      - {flow: models-mixtral-forward, on: rank1, as: fwd1}
    expect:
      - "state['mixtral-for-causal-lm@rank0'].cfg.ep_size == 1 && state['mixtral-for-causal-lm@rank0'].cfg.moe_tp == 2 && state['mixtral-for-causal-lm@rank0'].cfg.num_local_physical_experts == 8"
      - "steps.fwd0.result.ok && calls_by_instance['tensor-model-parallel.all-reduce@rank0'] > 0"
  - id: bench-p4-5-e-round-robin
    name: "P4-5(e) --expert-placement-strategy round_robin: Mixtral has no expert groups, warning and fallback to linear"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    # no config knob for expert_placement_strategy exists in the model; run the placement function directly
    steps:
      - {interface: expert-map-manager.determine-expert-map, caller: gpu-worker, input: {global_num_experts: 8, ep_size: 2, ep_rank: 0, expert_placement_strategy: round_robin}, as: rr}
    expect:
      - "steps.rr.result.value.expert_map == [0,1,2,3,-1,-1,-1,-1]"
      - "trace.exists(e, e.type == 'note' && e.title.contains('Falling back to linear expert placement'))"
