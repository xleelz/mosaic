schema_version: 1
id: vllm
scenarios:
  - id: bench-l4-6a-fp8-on-cc70
    name: "L4-6 (a): FP8 checkpoint on a capability-7.0 GPU fails building VllmConfig"
    flow: config-create-engine-config
    fixtures: [full-fp8-llama-3-8b]
    state:
      cuda-platform: {device_capability: {major: 7, minor: 0}}
    expect:
      - "!result.ok && result.error.message == 'The quantization method fp8 is not supported for the current GPU. Minimum capability: 75. Current capability: 70.'"
      - "calls['model-config.verify-quantization'] == 1 && calls['vllm-config.get-quantization-config'] == 1"
  - id: bench-l4-6b-fp8-cc70-no-engine-core
    name: "L4-6 (b): the failure comes from create_engine_config, before AsyncLLM: no EngineCore process"
    flow: serving-api-cli-serve
    fixtures: [full-fp8-llama-3-8b]
    input: {argv: [serve], args: {model_tag: neuralmagic/Meta-Llama-3-8B-Instruct-FP8-KV}}
    state:
      cuda-platform: {device_capability: {major: 7, minor: 0}}
    expect:
      - "!result.ok && result.error.message.contains('Minimum capability: 75. Current capability: 70.')"
      - "calls['engine-args.create-engine-config'] >= 1 && calls['async-llm.from-vllm-config'] == 0"
      - "calls['core-engine-proc-manager.launch'] == 0 && calls['engine-core-proc.run-engine-core'] == 0"
      - "!result.error.message.contains('Engine core initialization failed')"
  - id: bench-l4-6c-fp8-float32-h100-direct
    name: "L4-6 (c): --dtype float32 on H100 (driven at VllmConfig._get_quantization_config; the flow has no dtype knob)"
    steps:
      - {interface: vllm-config.get-quantization-config, caller: operator, as: h100, input: {quantization: fp8, dtype: float32, quantization_config: {quant_method: fp8, activation_scheme: static}}}
      - {set: {cuda-platform: {device_capability: {major: 7, minor: 0}}}}
      - {interface: vllm-config.get-quantization-config, caller: operator, as: v100, input: {quantization: fp8, dtype: float32, quantization_config: {quant_method: fp8, activation_scheme: static}}}
    fixtures: [full-fp8-llama-3-8b]
    expect:
      - "!steps.h100.result.ok && steps.h100.result.error.message == 'torch.float32 is not supported for quantization method fp8. Supported dtypes: [torch.bfloat16, torch.float16]'"
      - "!steps.v100.result.ok && steps.v100.result.error.message.contains('Minimum capability: 75. Current capability: 70.')"
  - id: bench-l4-6c-fp8-float32-h100-flow
    name: "L4-6 (c): --dtype float32 through create_engine_config (does the flow carry it?)"
    flow: config-create-engine-config
    fixtures: [full-fp8-llama-3-8b]
    input: {dtype: float32}
    expect:
      - "!result.ok && result.error.message.startsWith('torch.float32 is not supported')"
  - id: bench-l4-6d-fp8-quantization-awq
    name: "L4-6 (d): --quantization awq against an fp8 checkpoint fails while ModelConfig is built"
    flow: config-create-engine-config
    fixtures: [full-fp8-llama-3-8b]
    config: {quantization: awq}
    expect:
      - "!result.ok && result.error.message == 'Quantization method specified in the model config (fp8) does not match the quantization method specified in the `quantization` argument (awq).'"
      - "calls['vllm-config.get-quantization-config'] == 0 && calls['vllm-config.post-init'] == 0"
