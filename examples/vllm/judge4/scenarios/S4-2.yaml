schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-2-a
    name: "(a) priority 5 on fcfs: 200, priority rides on the engine request, the fcfs queue ignores it"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: a, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], max_tokens: 4, priority: 5, stream: false}}}
    expect:
      - "steps.a.result.ok"
      - "config['scheduling-policy'] == 'fcfs'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.priority == 5)"
  - id: bench-s4-2-b
    name: "(b) X-Vllm-Priority header wins; unparsable header falls back to the body"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: b1, flow: serving-api-chat-completion, input: {headers: {X-Vllm-Priority: "-3"}, body: {messages: [{role: user, content: hi}], max_tokens: 4, priority: 7, stream: false}}}
      - {as: b2, flow: serving-api-chat-completion, input: {headers: {X-Vllm-Priority: "abc"}, body: {messages: [{role: user, content: hi}], max_tokens: 4, priority: 7, stream: false}}}
    expect:
      - "steps.b1.result.ok && steps.b2.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.priority == -3)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'async-llm.generate' && e.input.priority == 7)"
  - id: bench-s4-2-c
    name: "(c) priority 2**63 and seed -(2**63)-1 fail pydantic bounds: 400 Bad Request"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: c1, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], max_tokens: 4, priority: {$bigint: "9223372036854775808"}, stream: false}}}
      - {as: c2, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], max_tokens: 4, seed: {$bigint: "-9223372036854775809"}, stream: false}}}
    expect:
      - "!steps.c1.result.ok && steps.c1.result.error.status == 400 && steps.c1.result.error.code == 'Bad Request' && steps.c1.result.error.data.param == 'body.priority' && steps.c1.result.error.message.startsWith('1 validation error:') && steps.c1.result.error.message.contains('less_than_equal')"
      - "!steps.c2.result.ok && steps.c2.result.error.status == 400 && steps.c2.result.error.data.param == 'body.seed' && steps.c2.result.error.message.contains('greater_than_equal')"
  - id: bench-s4-2-d
    name: "(d) guided_json and foo are extra fields: 200 unconstrained, one warning naming ['guided_json']"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: d, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], max_tokens: 4, stream: false, guided_json: {type: object}, foo: 1}}}
    expect:
      - "steps.d.result.ok"
      - "!trace.exists(e, e.type == 'call.start' && e.interface.startsWith('structured-output'))"
      - "trace.exists(e, e.type == 'note' && string(e).contains('guided_json'))"
