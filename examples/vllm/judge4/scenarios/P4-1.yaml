schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-1-a-tp1-uni
    name: "P4-1(a) TP 1: backend uni, UniProcExecutor builds the one worker in process"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {flow: config-create-engine-config, as: cfg}
      - {interface: executor.get-class, caller: engine-core, as: cls}
      - {interface: executor.init-executor, caller: engine-core, as: init}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.parallel_config.distributed_executor_backend == 'uni' && steps.cfg.result.value.parallel_config.world_size == 1"
      - "steps.cls.result.value.executor_class == 'UniProcExecutor'"
      - "steps.init.result.ok && calls['uni-proc-executor.init-executor'] == 1 && calls['multiproc-executor.init-executor'] == 0"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'gpu-worker-impl.init-device' && e.instance == 'rank0')"
  - id: bench-p4-1-b-tp4-mp
    name: "P4-1(b) TP 4, 4 GPUs, no Ray: mp, 4 workers, only rank 0 replies to execute_model"
    fixtures: [full-tp4-llama-70b]
    config: {model: meta-llama/Llama-3.1-8B-Instruct}
    steps:
      - {flow: config-create-engine-config, input: {model: meta-llama/Llama-3.1-8B-Instruct}, as: cfg}
      - {interface: executor.get-class, caller: engine-core, as: cls}
      - {interface: executor.init-executor, caller: engine-core, as: init}
    expect:
      - "steps.cfg.result.ok && steps.cfg.result.value.parallel_config.distributed_executor_backend == 'mp' && steps.cfg.result.value.parallel_config.world_size == 4"
      - "steps.cls.result.value.executor_class == 'MultiprocExecutor'"
      - "steps.init.result.ok && calls['multiproc-executor.init-executor'] == 1 && ['rank0','rank1','rank2','rank3'].all(r, calls_by_instance['gpu-worker-impl.load-model@' + r] == 1)"
      - "trace.exists(e, e.type == 'note' && e.title.contains('VllmWorker-0')) || trace.exists(e, e.type == 'note' && e.title.contains('Worker_TP0'))"
  - id: bench-p4-1-c-start-method
    name: "P4-1(c) library use keeps fork; CUDA initialized forces spawn with a warning"
    fixtures: [full-tp1-llama-8b]
    steps:
      - {interface: envs.env-with-choices, caller: operator, as: env}
    expect:
      - "steps.env.result.value.value == 'fork'"
      - "calls['system-utils.maybe-force-spawn'] >= 0 && trace.exists(e, e.type == 'note' && e.title.contains('We must use the `spawn` multiprocessing start method'))"
  - id: bench-p4-1-d-ray-missing
    name: "P4-1(d) --distributed-executor-backend ray without Ray: ValueError at config validation"
    fixtures: [full-tp4-llama-70b]
    config: {model: meta-llama/Llama-3.1-8B-Instruct}
    steps:
      - {flow: config-create-engine-config, input: {model: meta-llama/Llama-3.1-8B-Instruct, distributed_executor_backend: ray}, as: cfg}
    expect:
      - "!steps.cfg.result.ok && steps.cfg.result.error.code == 'value-error'"
      - "steps.cfg.result.error.message.startsWith('Failed to import Ray: ')"
