schema_version: 1
id: vllm
scenarios:
  - id: bench-q4-7-a-dp4-ep-default-backend
    name: "Q4-7 (a) DP 4 + EP with the default allgather_reducescatter backend: each DP rank gets the H100 serve defaults 8192 / 1024"
    flow: config-create-engine-config
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {model: Qwen/Qwen3-30B-A3B, tensor-parallel-size: 1, data-parallel-size: 4, enable-expert-parallel: true, max-model-len: 40960}
    state:
      platforms: {host: {cpu_architecture: X86, device_count: 4, device_name: "NVIDIA H100 80GB HBM3", device_total_memory: 85899345920, nvml_available: true, nvml_gpu_count: 4}}
      hf-hub:
        models:
          Qwen/Qwen3-30B-A3B: {architectures: [Qwen3MoeForCausalLM], model_type: qwen3_moe, hidden_size: 2048, head_dim: 128, intermediate_size: 6144, moe_intermediate_size: 768, max_position_embeddings: 40960, num_attention_heads: 32, num_hidden_layers: 48, num_key_value_heads: 4, num_experts: 128, num_experts_per_tok: 8, rope_theta: 1000000, torch_dtype: bfloat16, vocab_size: 151936, weights_bytes: 61064994816}
    input: {data_parallel_size: 4, tensor_parallel_size: 1, enable_expert_parallel: true, usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.parallel_config.data_parallel_size == 4"
      - "result.value.scheduler_config.max_num_batched_tokens == 8192 && result.value.scheduler_config.max_num_seqs == 1024"
  - id: bench-q4-7-b-dp4-ep-deepep-ll
    name: "Q4-7 (b) DP 4 + EP with deepep_low_latency: batched-DP default 256 tokens, max_num_seqs clamped to 256"
    flow: config-create-engine-config
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {model: Qwen/Qwen3-30B-A3B, tensor-parallel-size: 1, data-parallel-size: 4, enable-expert-parallel: true, max-model-len: 40960, all2all-backend: deepep_low_latency}
    state:
      platforms: {host: {cpu_architecture: X86, device_count: 4, device_name: "NVIDIA H100 80GB HBM3", device_total_memory: 85899345920, nvml_available: true, nvml_gpu_count: 4}}
      hf-hub:
        models:
          Qwen/Qwen3-30B-A3B: {architectures: [Qwen3MoeForCausalLM], model_type: qwen3_moe, hidden_size: 2048, head_dim: 128, intermediate_size: 6144, moe_intermediate_size: 768, max_position_embeddings: 40960, num_attention_heads: 32, num_hidden_layers: 48, num_key_value_heads: 4, num_experts: 128, num_experts_per_tok: 8, rope_theta: 1000000, torch_dtype: bfloat16, vocab_size: 151936, weights_bytes: 61064994816}
    input: {data_parallel_size: 4, tensor_parallel_size: 1, enable_expert_parallel: true, all2all_backend: deepep_low_latency, usage_context: OPENAI_API_SERVER, max_num_batched_tokens: null, max_num_seqs: null}
    expect:
      - "result.ok && result.value.scheduler_config.max_num_batched_tokens == 256 && result.value.scheduler_config.max_num_seqs == 256"
  - id: bench-q4-7-c-kv-spec-tp1
    name: "Q4-7 (c) TP 1 per DP rank: 4 KV heads per GPU, 32 KiB per layer, 1.5 MiB per block over 48 layers"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {tensor-parallel-size: 1, data-parallel-size: 4}
    state:
      gpu-model-runner: {model: {architecture: Qwen3MoeForCausalLM, dtype_bytes: 2, head_size: 128, hidden_size: 2048, is_hybrid: false, max_position_embeddings: 40960, name: Qwen/Qwen3-30B-A3B, num_attention_heads: 32, num_hidden_layers: 48, num_kv_heads: 4, torch_dtype: bfloat16, uses_mrope: false, uses_prompt_embeds: false, vocab_size: 151936, weights_bytes: 61064994816, eos_token_id: 151645}}
    steps:
      - {interface: gpu-model-runner.get-kv-cache-spec, caller: gpu-worker-impl, on: rank0, as: spec}
    expect:
      - "steps.spec.result.value.num_kv_heads_per_rank == 4 && steps.spec.result.value.page_size_bytes == 32768 && steps.spec.result.value.page_size_bytes * steps.spec.result.value.num_layers == 1572864"
  - id: bench-q4-7-d-kv-spec-tp4
    name: "Q4-7 (d) TP 4 + EP (DP 1): max(1, 4 // 4) = 1 KV head per GPU, 8 KiB per layer, 384 KiB per block"
    fixtures: [full-moe-mixtral-8x7b-tp2-ep]
    config: {tensor-parallel-size: 4}
    state:
      gpu-model-runner: {model: {architecture: Qwen3MoeForCausalLM, dtype_bytes: 2, head_size: 128, hidden_size: 2048, is_hybrid: false, max_position_embeddings: 40960, name: Qwen/Qwen3-30B-A3B, num_attention_heads: 32, num_hidden_layers: 48, num_kv_heads: 4, torch_dtype: bfloat16, uses_mrope: false, uses_prompt_embeds: false, vocab_size: 151936, weights_bytes: 61064994816, eos_token_id: 151645}}
    steps:
      - {interface: gpu-model-runner.get-kv-cache-spec, caller: gpu-worker-impl, on: rank0, as: spec}
    expect:
      - "steps.spec.result.value.num_kv_heads_per_rank == 1 && steps.spec.result.value.page_size_bytes == 8192 && steps.spec.result.value.page_size_bytes * steps.spec.result.value.num_layers == 393216"
