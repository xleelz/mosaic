schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-7-a
    name: "(a) one <|vision_start|><|image_pad|><|vision_end|> per image, expanded to 800 image tokens for 1120x560"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    steps:
      - {as: n, interface: qwen2-vl-processing-info.get-num-image-tokens, caller: base-multi-modal-processor, input: {image_width: 1120, image_height: 560}}
      - {as: ph, interface: qwen2-vl-for-conditional-generation.get-placeholder-str, caller: hf-renderer, input: {modality: image}}
      - {as: chat, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "data:image/png;base64,iVBORw0KGgo="}}, {type: text, text: "What is this?"}]}]}}}
    expect:
      - "steps.n.result.ok && json(steps.n.result.value).contains('800')"
      - "steps.ph.result.ok && json(steps.ph.result.value).contains('<|vision_start|><|image_pad|><|vision_end|>')"
      - "steps.chat.result.ok && steps.chat.result.value.usage.prompt_tokens > 800"
  - id: bench-s4-7-b
    name: "(b) usage.prompt_tokens counts the expansion; prompt_tokens_details carries multimodal_tokens {image: 800}"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    steps:
      - {as: chat, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "data:image/png;base64,iVBORw0KGgo="}}, {type: text, text: "What is this?"}]}]}}}
    expect:
      - "steps.chat.result.ok && steps.chat.result.value.usage.prompt_tokens > 800"
      - "steps.chat.result.ok && 'prompt_tokens_details' in steps.chat.result.value.usage && steps.chat.result.value.usage.prompt_tokens_details.cached_tokens == 0 && steps.chat.result.value.usage.prompt_tokens_details.multimodal_tokens.image == 800"
  - id: bench-s4-7-c
    name: "(c) 900x500 rounds to 896x504: 2304 patches, 576 image tokens"
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {as: n, interface: qwen2-vl-processing-info.get-num-image-tokens, caller: base-multi-modal-processor, input: {image_width: 900, image_height: 500}}
    expect:
      - "steps.n.result.ok && json(steps.n.result.value).contains('576')"
  - id: bench-s4-7-d
    name: "(d) the same image twice sums to {image: 1600}"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    steps:
      - {as: chat, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "data:image/png;base64,iVBORw0KGgo="}}, {type: image_url, image_url: {url: "data:image/png;base64,iVBORw0KGgo="}}, {type: text, text: "Same?"}]}]}}}
    expect:
      - "steps.chat.result.ok && 'prompt_tokens_details' in steps.chat.result.value.usage && steps.chat.result.value.usage.prompt_tokens_details.multimodal_tokens.image == 1600"
  - id: bench-s4-7-e
    name: "(e) without --enable-prompt-tokens-details, prompt_tokens_details is null; prompt_tokens unchanged"
    fixtures: [full-vl-qwen2-vl-7b]
    max_events: 600000
    steps:
      - {as: chat, flow: serving-api-multimodal-chat, input: {body: {model: {$absent: true}, max_tokens: 2, stream: false, messages: [{role: user, content: [{type: image_url, image_url: {url: "data:image/png;base64,iVBORw0KGgo="}}, {type: text, text: "What is this?"}]}]}}}
    expect:
      - "steps.chat.result.ok && steps.chat.result.value.usage.prompt_tokens > 800 && (!('prompt_tokens_details' in steps.chat.result.value.usage) || steps.chat.result.value.usage.prompt_tokens_details == null)"
