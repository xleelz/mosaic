schema_version: 1
id: vllm
scenarios:
  - id: bench-p4-7-a-weights-mode
    name: "P4-7(a) default mm_encoder_tp_mode weights: ViT linear layers TP-sharded over 2 ranks; every rank encodes all three images in one tower call"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {tensor-parallel-size: 2}
    steps:
      - {interface: multimodal-config.init, caller: operator, input: {}, as: mmc}
      - {flow: wr-load-model, on: rank0, as: load}
      - interface: qwen2-vl-for-conditional-generation.embed-multimodal
        caller: gpu-worker
        on: rank0
        input:
          mm_kwargs:
            - {modality: image, kind: pixel_values, grid_thw: [1, 40, 100]}
            - {modality: image, kind: pixel_values, grid_thw: [1, 20, 50]}
            - {modality: image, kind: pixel_values, grid_thw: [1, 25, 40]}
        as: enc
    expect:
      - "steps.mmc.result.ok && steps.mmc.result.value.mm_encoder_tp_mode == 'weights'"
      - "steps.enc.result.ok && steps.enc.result.value.embeddings.map(e, e.num_tokens) == [1000, 250, 250]"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'qwen2-vision-transformer.forward').size() == 1"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'qwen2-vision-transformer.forward' && e.input.tp == 2 && size(e.input.grid_thw) == 3)"
  - id: bench-p4-7-b-data-mode
    name: "P4-7(b) --mm-encoder-tp-mode data: full ViT per rank; greedy split 4000 -> rank0, 1000+1000 -> rank1; pad, all-gather, restore order"
    fixtures: [full-vl-qwen2-vl-7b]
    config: {tensor-parallel-size: 2}
    steps:
      - {interface: multimodal-config.init, caller: operator, input: {mm_encoder_tp_mode: data}, as: mmc}
      - {flow: wr-load-model, on: rank0, as: load}
      - interface: qwen2-vl-for-conditional-generation.embed-multimodal
        caller: gpu-worker
        on: rank0
        input:
          mm_kwargs:
            - {modality: image, kind: pixel_values, grid_thw: [1, 40, 100]}
            - {modality: image, kind: pixel_values, grid_thw: [1, 20, 50]}
            - {modality: image, kind: pixel_values, grid_thw: [1, 25, 40]}
        as: enc
    expect:
      - "steps.mmc.result.value.mm_encoder_tp_mode == 'data'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'qwen2-vision-transformer.forward' && e.input.tp == 1 && size(e.input.grid_thw) == 1)"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'tensor-model-parallel.all-gather')"
  - id: bench-p4-7-c-encoder-profile
    name: "P4-7(c) profile_run builds the encoder budget (32768 tokens) and profiles 1 video item of the maximum feature size"
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {flow: wr-load-model, on: rank0, as: load}
      - {flow: wr-determine-available-memory, on: rank0, as: prof}
    expect:
      - "steps.prof.result.ok"
      - "calls['encoder-cache-manager.compute-mm-encoder-budget'] >= 1 && calls['qwen2-vl-for-conditional-generation.embed-multimodal'] >= 1"
  - id: bench-p4-7-d-vit-backend
    name: "P4-7(d) ViT attention backend on H100: FLASH_ATTN (head size 80)"
    fixtures: [full-vl-qwen2-vl-7b]
    steps:
      - {flow: wr-load-model, on: rank0, as: load}
      - interface: qwen2-vl-for-conditional-generation.embed-multimodal
        caller: gpu-worker
        on: rank0
        input:
          mm_kwargs:
            - {modality: image, kind: pixel_values, grid_thw: [1, 20, 50]}
        as: enc
    expect:
      - "steps.enc.result.ok"
      - "trace.exists(e, e.type == 'call.start' && e.interface.startsWith('vit-attn-wrappers.vit-flash-attn'))"
