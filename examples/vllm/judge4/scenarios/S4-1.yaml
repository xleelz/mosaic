schema_version: 1
id: vllm
scenarios:
  - id: bench-s4-1-a
    name: "(a) no messages: FastAPI RequestValidationError, 400 Bad Request, param body.messages"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: a, flow: serving-api-chat-completion, input: {body: {model: llama-8b, messages: {$absent: true}}}}
    expect:
      - "!steps.a.result.ok && steps.a.result.error.status == 400 && steps.a.result.error.code == 'Bad Request' && steps.a.result.error.data.param == 'body.messages' && steps.a.result.error.message.startsWith('1 validation error:\\n  ') && steps.a.result.error.message.contains('Field required') && steps.a.result.error.message.contains('<dict of 1 items>')"
      - "calls['async-llm.generate'] == 0"
  - id: bench-s4-1-b
    name: "(b) two field errors in one 400; param from the first"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: b, flow: serving-api-chat-completion, input: {body: {messages: "hi", max_tokens: "ten"}}}
    expect:
      - "!steps.b.result.ok && steps.b.result.error.status == 400 && steps.b.result.error.code == 'Bad Request' && steps.b.result.error.message.startsWith('2 validation errors:') && steps.b.result.error.message.contains('list_type') && steps.b.result.error.message.contains('int_parsing') && steps.b.result.error.data.param == 'body.messages'"
  - id: bench-s4-1-c
    name: "(c) top_logprobs without logprobs; -2; -1 => SamplingParams max_logprobs 20"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: c1, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], top_logprobs: 5, logprobs: {$absent: true}}}}
      - {as: c2, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], logprobs: true, top_logprobs: -2}}}
      - {as: c3, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], logprobs: true, top_logprobs: -1}}}
    expect:
      - "!steps.c1.result.ok && steps.c1.result.error.status == 400 && steps.c1.result.error.code == 'BadRequestError' && steps.c1.result.error.data.param == 'top_logprobs' && steps.c1.result.error.message == 'when using `top_logprobs`, `logprobs` must be set to true. (parameter=top_logprobs)'"
      - "!steps.c2.result.ok && steps.c2.result.error.status == 400 && steps.c2.result.error.code == 'BadRequestError' && steps.c2.result.error.data.param == 'top_logprobs' && steps.c2.result.error.message == '`top_logprobs` must be a positive value or -1. (parameter=top_logprobs, value=-2)'"
      - "!steps.c3.result.ok && steps.c3.result.error.status == 400 && steps.c3.result.error.code == 'BadRequestError' && steps.c3.result.error.data.param == 'logprobs' && steps.c3.result.error.message == 'Requested sample logprobs of 128256, which is greater than max allowed: 20 (parameter=logprobs, value=128256)'"
      - "trace.exists(e, e.type == 'call.start' && e.interface == 'sampling-params.verify')"
  - id: bench-s4-1-d
    name: "(d) before-validator order: top_logprobs before Field required; tools [] before top_logprobs; stream still JSON 400"
    fixtures: [full-tp1-llama-8b]
    max_events: 400000
    steps:
      - {as: d2, flow: serving-api-chat-completion, input: {body: {messages: [{role: user, content: hi}], tools: [], top_logprobs: 5, logprobs: {$absent: true}}}}
      - {as: d3, flow: serving-api-chat-stream, input: {body: {messages: [{role: user, content: hi}], stream: true, top_logprobs: 5, logprobs: {$absent: true}}}}
      - {as: d1, flow: serving-api-chat-completion, input: {body: {messages: {$absent: true}, top_logprobs: 5, logprobs: {$absent: true}}}}
    expect:
      - "!steps.d1.result.ok && steps.d1.result.error.status == 400 && steps.d1.result.error.data.param == 'top_logprobs' && steps.d1.result.error.message.startsWith('when using `top_logprobs`')"
      - "!steps.d2.result.ok && steps.d2.result.error.status == 400 && steps.d2.result.error.data.param == 'tools' && steps.d2.result.error.message == '`tools` must not be an empty array. Either provide at least one tool or omit the field entirely. (parameter=tools)'"
      - "!steps.d3.result.ok && steps.d3.result.error.status == 400 && steps.d3.result.error.data.param == 'top_logprobs'"
