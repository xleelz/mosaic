# Per-repo profile for the mosaic generation pipeline (docs/PIPELINE.md, DESIGN §13).
#
# Copy this file to examples/<repo>/profile.yaml and fill it in before stage 1. Everything that
# differs between repositories lives here; the stages, the briefs and the check gates do not.
# The templates in .claude/skills/mosaic-generate/templates/ name these fields as
# {{placeholders}} (for example {{snapshot.path}} or {{naming.component}}), and the coordinator
# renders them from this file.
#
# Requires mosaic with DESIGN §11 (in progress) for the config, fixtures and instances sections.
#
# Conventions in this file:
#   - Paths under the snapshot are relative to snapshot.path. Paths under mosaic are relative to
#     the mosaic repo root.
#   - Globs use ** for any depth. A path matched by several areas belongs to the most specific
#     glob (the longest literal prefix); `overrides` beat globs.
#   - "Example:" comments show what the Cassandra 5.0.9 and gateway-platform builds used. They are not
#     defaults.

profile_version: 1

# The ontology id every fragment uses (`id:` in each fragment header), and its display name.
id: <repo-id>                         # Example: cassandra, vllm
name: <Display name> (built from code)

# Where the pipeline writes. Every artifact path in docs/PIPELINE.md is relative to this.
workspace: examples/<repo-id>

# ---------------------------------------------------------------------------------------------
# 1. Snapshot: the code the model is built from. Read-only for every agent.
# ---------------------------------------------------------------------------------------------
snapshot:
  repo: <org>/<repo>                  # goes into the document's `source.repo`
  ref: <tag or branch>                # Example: cassandra-5.0.9
  sha: <full 40-char sha>             # goes into `source.sha`; citations are anchored here
  path: /abs/path/to/checkout         # a checkout of exactly `sha`; never build, run or modify it
  url: https://github.com/<org>/<repo>/tree/<sha>
  # Paths an agent must never open, in addition to the global rule (env files, keystores,
  # *.age, credentials). Example: [conf/credentials.sample, "**/*.jks"]
  forbidden: ["**/*.env*", "**/*.age", "**/*.pem", "**/*.key", "**/*.jks", "**/credentials*"]

# What counts as evidence. Only code (and deployed config) is cited in the ontology. These paths
# may orient an agent and may be cited in notes, never in `sources`.
evidence:
  not_evidence: [<docs dir>/**, "**/README*", CHANGES*, NEWS*]   # Example: [doc/**, NEWS.txt, CHANGES.txt, test/**]
  cite_form: "path:line or path:line-end, relative to snapshot.path, one source per string"

# ---------------------------------------------------------------------------------------------
# 2. Inventory: which entry points exist, found by language plugins (stage 1).
# ---------------------------------------------------------------------------------------------
inventory:
  out: inventory.json                 # under workspace
  # Language plugins of internal/devtools/inventory (passed as --lang). One or more of
  # go, ts, python, java. Example: Cassandra [java]; a gateway platform [go, ts, python].
  plugins: [<lang>]
  include_test_support: false         # --include-test-support: keep mocks, fakes, e2e harnesses
  # Opt-in function kinds (--kinds), for logic-level scopes only (a component refined to
  # `logic`, DESIGN §14.2), with --paths set to scope_paths: go-func (top-level functions
  # and methods, named Type.Method), py-func (module-level functions and class methods,
  # Class.method), ts-func (top-level functions, const arrow functions and class methods).
  # Each entry carries file:line-end_line, the name and `exported`; test files' functions
  # come only with --include-test-funcs, flagged `test`. Leave empty at system level.
  # opt_kinds: [go-func]                # Example (a Go smoke scope): [go-func]
  # scope_paths: [<file or dir>]        # the scope's paths, passed as --paths (files or directories)
  # include_test_funcs: false
  # The entry-point kinds this repo has, how each is owned, and how an area covers one.
  # `kind` is the scanner's kind string. `owner` says which area owns an entry: `path` (the
  # area owning `file`), or a rule in words when the file is a registry (an enum of verbs, a
  # route table). `cover` says what makes an entry covered. `skip_rules` are group skips decided
  # up front, from the precision audit.
  kinds:
    - kind: <kind>                    # Example: http-route, messaging-verb, cql-statement, cli-command, scheduled-task, jmx-operation; go-func at logic level
      owner: path                     # Example (messaging-verb): "the area owning the handler named in `detail`"
      cover: "a flow-reachable interface named by naming.interface that cites the entry's own lines"
      # Example (messaging-verb): "add the Verb.java line to the handler interface's sources"
      # level: registered   # only for declaration-only kinds (a DI service decorator): registered counts as modeled
  skip_rules:
    - kinds: [<kind>]
      match: "<name glob or rule>"    # Example: "*MBean.get*, *MBean.is*"
      reason: "<one-line reason>"     # Example: "JMX getter: a read of config or metrics, no behavior"
  # Entries the scanner misses, added by hand with `"via": "manual"`, each with a reason.
  manual: []                          # [{kind, name, file, line, reason}]
  audit:
    precision_sample: 40              # entries read one by one to estimate precision
    # Independent lists of known entry points to measure recall against.
    recall_sources: [<protocol or route spec>, <CLI registry>, <docs feature list>]
    targets: {precision: 0.9, recall: 0.9}   # per kind with at least 10 entries

# ---------------------------------------------------------------------------------------------
# 3. Areas: one agent each. Owned paths, ownership overrides and skeleton parents (stage 2).
# ---------------------------------------------------------------------------------------------
areas:
  - id: <area>                        # slug; also the fragment, notes and skips file name
    module: <skeleton component id>   # where the area's components hang (`parent:`)
    owns: [<glob>, <glob>]            # Example: [src/java/org/apache/cassandra/transport/**]
    except: [<glob>]                  # carved out to a more specific area
    entry_points: "<typical entry points, for the brief>"
    # Example: "native-protocol messages (STARTUP, QUERY, PREPARE, EXECUTE, BATCH)"

# Ownership by function, not by file. Overrides beat `owns` globs. Two forms:
#   - symbol: methods or symbols an area models although another area owns their file. A note for
#     the brief; it doesn't change inventory assignment.
#   - file + name: single inventory entries, for files whose entries belong to different areas
#     (route tables). assign_inventory.py gives an entry the area when both its file and its name
#     match (fnmatch globs; name defaults to "*"). If several match, the most specific wins: the
#     longest literal prefix of name (leading wildcards skipped), then of file, then the first
#     listed. Example: a generated route table split by route.
overrides:
  - symbol: <Class.method or file:function>   # Example: StorageProxy.cas
    area: <area>                              # Example: paxos
    reason: "<why>"                           # Example: "the CAS path is Paxos logic living in StorageProxy"
  - file: <path or glob>                      # Example: services/control-plane-go/routes.go
    name: <entry name or glob>                # Example: "* /v1/nodes/pod-*"
    area: <area>                              # Example: pods-kube
    reason: "<why>"                           # Example: "pod routes registered in the shared route table"

# Infrastructure every area calls but none owns. Calls to them are boundary-stub interfaces
# named after the operation, with one kind for all areas.
shared_components:
  - id: <id>                          # Example: commitlog-disk, data-disk; dynamodb, redis
    kind: datastore
    interface_kind: <kind>            # Example: io (Cassandra), rpc (a gateway platform)
    naming: "<component>.<table-or-keyspace>-<op>"   # Example: dynamodb.vms-put

# Data several areas touch, each with exactly one owner (DESIGN §13.1 item 15). The owner keeps
# the only copy, in its own component's state; readers read and change it through the owner's
# interfaces and never keep a copy (two areas each modeling "the text" of a document drifted
# apart in the VS Code build). Rendered into the brief as {{shared_data}}.
shared_data:
  - datum: "<what>"                   # Example: "the text of an open document"
    owner: <area>                     # Example: editor (its text model)
    readers: [<area>]                 # Example: [files-search-scm, notebook-webview, exthost]
    # Example (Cassandra): {datum: "the token ring and endpoint states", owner: membership, readers: [coordination, repair-streaming]}

# Who models what when one surface reaches many areas (an operator CLI, an admin API).
# Example: "ops models each nodetool command as a flow that calls the owner's interface".
cross_area_rules: []

# ---------------------------------------------------------------------------------------------
# 4. Naming: fixed, so every caller can predict the owner's ids.
# ---------------------------------------------------------------------------------------------
naming:
  component: "<rule>"                 # Example: "the class in kebab-case; an inner class takes its outer class's prefix"
  interface: "<rule>"                 # Example: "the method in kebab-case; a suffix for overloads that behave differently"
  routes: "<rule>"                    # Example: "<method>-<path>: lowercase, {param} -> param, other chars -> -, cut to 64"
  messages: "<rule>"                  # Example: "<opcode>-message on transport, kind cql"; or "" when none
  schema: "<rule>"                    # Example: "area prefix in PascalCase (WritePathMutation); shared contracts keep the owner's name"
  config: "<rule>"                    # Example: "the config key in kebab-case: write_request_timeout -> write-request-timeout-ms (unit suffix)"
  fixture: "<rule>"                   # Example: "the world it describes: base-schema, three-node-rf3"
  instance: "<rule>"                  # Example: "n1, n2, n3 for nodes; w1.. for windows; rank0.. for GPU workers"
  scenario: "<area>-<flow>-<case>"
  forbidden: [handler, store, client, service, manager, request, result, error]   # bare generic ids
  # One worked example per inventory kind: entry -> component id -> interface id.
  examples:
    - {entry: "<kind> <name>", component: <id>, interface: <id.name>}

# ---------------------------------------------------------------------------------------------
# 5. Error convention: one code per real error, with status and retryability.
# ---------------------------------------------------------------------------------------------
errors:
  code_from: "<rule>"                 # Example: "the Java exception name in kebab-case"; "the route's JSON error code"
  status_from: "<rule>"               # Example: "the native-protocol error code"; "the HTTP status"
  verify_against: [<file>, <file>]    # where codes and statuses are defined, for the contract check
  table:                              # every code the skeleton fixes up front
    - {code: <code>, status: <int>, retryable: false, source: "<path:line>"}
    # Example: {code: unavailable, status: 4096, retryable: false, source: src/java/org/apache/cassandra/exceptions/ExceptionCode.java:40}

# Field names and schemas used everywhere, so stubs merge cleanly.
shared_shapes:
  fields:                             # name: "type and meaning"
    <field>: "<type; meaning>"        # Example: consistency: "string, the ConsistencyLevel enum name"
  envelope: null                      # optional request envelope for a protocol, e.g. an HTTP envelope
  schemas:                            # defined once in skeleton.yaml under the owner's name
    - {id: <SchemaId>, owner: <area>, fields: [<field>, <field>]}
    # Example: {id: WritePathMutation, owner: write-path, fields: [keyspace, table, partition_key, token, timestamp, columns]}
  # Cross-area seams the coordinator predeclares in skeleton.yaml with the owner's shapes.
  seams:
    - {interface: <component.name>, owner: <area>, callers: [<area>]}
    # Example: {interface: storage-proxy.read, owner: coordination, callers: [cql, transport, schema-auth]}

# ---------------------------------------------------------------------------------------------
# 6. Config sources: the deployed values become `config` entities (stage 3, DESIGN §11.6).
# ---------------------------------------------------------------------------------------------
config:
  sources:                            # in precedence order: the first that sets a key wins
    - {path: <deployed config file>, role: deployed, format: yaml}   # Example: conf/cassandra.yaml; infra/terraform/**/*.tf
    - {path: <defaults source>, role: default, format: code}         # Example: src/java/org/apache/cassandra/config/Config.java
  # A config entity belongs to the area whose code reads it (DESIGN §13.1). Values several areas
  # read are listed here with their owner; the coordinator puts a reference to each in
  # fixtures.yaml (attributes: {boundary: true, owner}), and the owner defines the real entity.
  required:
    - {key: <key>, owner: <area>}     # Example: {key: write_request_timeout, owner: coordination}
  units: "<rule>"                     # Example: "durations in ms, sizes in bytes; suffix the id with the unit"

# ---------------------------------------------------------------------------------------------
# 7. Instances and fixtures: the shared worlds, authored by the coordinator (stage 3).
# ---------------------------------------------------------------------------------------------
instances:
  groups:                             # components whose subtrees run as several instances (DESIGN §11.1)
    - component: <skeleton component id>   # Example: cassandra-node; editor-window; gpu-worker
      default: [<i1>, <i2>, <i3>]          # Example: [n1, n2, n3]
      summary: "<what an instance is>"
  entry_instance: <i1>                # where entries run unless a step says `on:`

fixtures:
  file: fixtures.yaml                 # under workspace; fixtures and shared-config references, owned by the coordinator
  worlds:
    - id: <fixture-id>                # Example: base-schema
      summary: "<what it contains>"   # Example: "keyspace shop (RF 3) with tables users and orders"
      extends: []
      topology: {}                    # Example: {cassandra-node: [n1, n2, n3]}
      clock: {epoch: "2026-01-01T00:00:00Z"}
      config: {}                      # overrides of config entity values
      state: {}                       # seed state, keyed <component> or <component>@<instance>
      must_be_used_by: [<area>]       # areas whose scenarios must list it
      # The merged world `assign_inventory.py --worlds` writes for it into worlds.yaml: it extends
      # this world, every <area>-seed and the areas' variants of the world. Defaults: full-<id>.
      # full_id: full-<name>
      # full: false                   # write no merged world for this one (a base the seeds assume more than)
  # Overlays on the merged worlds, copied into worlds.yaml verbatim (a config change, say).
  derived: []
  # Example: [{id: full-format-on-save, summary: "...", extends: [full-dirty-editor], config: {editor-format-on-save: true}}]
  # Names that seed data and schema `examples` must use, so fake inputs land in the world.
  canonical_names:
    <thing>: <name>                   # Example: keyspace: shop; tables: [users, orders]; org: org_demo

# ---------------------------------------------------------------------------------------------
# 8. Test oracle: the repo's own tests, translated into scenarios (stage 6).
# ---------------------------------------------------------------------------------------------
oracle:
  test_dirs: [<dir>, <dir>]           # Example: [test/unit, test/distributed]
  include: ["**/*Test.*", "**/*_test.*"]
  # Tests next to their code (Go packages, colocated *.test.ts): test_dirs must cover the source
  # tree, so test code is told by file name instead (*_test.go, *.test.ts(x), *.spec.ts, test_*.py,
  # *_test.py). Without it test_targets.py treats every file under test_dirs as test code.
  colocated: false                    # Example (a Go repo): true
  exclude: [<glob>]                   # benchmarks, fuzzers, byte-format tests below the model's level
  # The final sample (stage 6). build_n and build_seed draw the in-build sample per area (stage
  # 4b, sample_tests.py --area; build_seed defaults to seed + 1000); stage 6 excludes those tests.
  sample: {per_area_min: 3, total: 40, seed: 1, build_n: 3, build_seed: 1001}
  run: never                          # fixed by DESIGN §13.1: the oracle reads tests, never runs them
  area_of_test: "the area owning the class under test"
  # Repos that keep tests apart from the code (tests/...) map test paths to areas, most specific
  # glob first; otherwise a test belongs to the area owning its path. sample_tests.py and
  # test_targets.py both use it. Example (vLLM): [{glob: "tests/v1/core/**", area: scheduler-kv}]
  area_globs: []
  # Test-weighted coverage (DESIGN §13.1 item 19): test_targets.py maps every test file above to
  # the code it tests (imports, plus the file named like the test) and writes test-targets.json;
  # `check --tests` reports the share of tests whose targets a called interface cites.
  targets: test-targets.json          # under workspace; written in stage 2

# ---------------------------------------------------------------------------------------------
# 8b. Features: the system's user-visible features (DESIGN §13.1 item 19), written by the
# coordinator in stage 2, before fan-out, from the docs, config flags and CLI options. The
# inventory counts entry points; this list counts what users rely on, so an area can't pass the
# gates while a whole feature (KV offload, a scheduling policy, a sync mode) is never modeled.
# Each owning area models each of its features as a flow tagged `feature:<id>` that some scenario
# runs, or skips it in skips/<area>.features.json: [{id, reason, covered_by?}] with a valid reason
# (the inventory skip rules: not "not modeled", "out of scope", "too large" or "todo"; a "covered
# by" reason names the entity in `covered_by`). `check --features profile.yaml` reports covered,
# skipped and missing features; `--strict-features` fails on missing ones.
# ---------------------------------------------------------------------------------------------
features:
  - id: <feature-id>                  # slug; the flow tag is feature:<id>
    summary: "<what a user gets>"     # Example (vLLM): "automatic prefix caching of full KV blocks"
    sources: [<doc page, config key or CLI option>]   # Example: [enable_prefix_caching, docs/features/automatic_prefix_caching.md]
    owner: <area>                     # Example: scheduler-kv
    # Example (Cassandra): {id: lightweight-transactions, summary: "IF NOT EXISTS / IF conditions via Paxos", sources: [doc/cql/dml.html], owner: paxos}

# ---------------------------------------------------------------------------------------------
# 8c. Failures: the failure matrix (DESIGN §13.1 item 22), written by the coordinator in stage 2
# next to `features`. One row per way a shared component or edge fails: redis down, the scheduler
# (nomad) unreachable, a client disconnect, a node death, a lease loss, an upstream provider
# erroring. Each owning area models each of its failures as a flow tagged `failure:<id>` that some
# scenario runs while injecting it (a fault, a kill, a cancel or restart step, a failing mock, or
# seeded state), or skips it in skips/<area>.failures.json: [{id, reason, covered_by?}] under the
# feature skip rules. `check --failures profile.yaml` reports covered, skipped and missing
# failures; `--strict-failures` fails on missing ones.
#
# Two-sided failures (DESIGN §13.1 item 30). When handling a failure takes both sides of a seam
# (a client retries with an idempotency key AND the server dedupes it), give `sides` instead of
# `owner`. Each side's owner tags a flow `failure:<id>:<role>`, run under injection as above, or
# skips its side in its own skips/<area>.failures.json with {id, role, reason}. The failure is
# covered only when every side is covered or validly skipped; the report lists each side. A
# failure with one `owner` keeps the meaning above.
# ---------------------------------------------------------------------------------------------
failures:
  - id: <failure-id>                  # slug; the flow tag is failure:<id>
    summary: "<what fails and what the system must do>"  # Example (a gateway): "redis unavailable: rate limiting fails open"
    sources: [<file, doc page or config key>]           # Example: [internal/ratelimit/redis.go]
    owner: <area>                     # the area whose behavior handles it. Example: gateway
    on: <component or edge>           # what fails: redis, nomad, client disconnect, node death, lease loss, upstream provider
  - id: <two-sided-failure-id>        # flow tags failure:<id>:<role>, one per side
    summary: "<what fails and what each side must do>"
    sources: [<file, doc page or config key>]
    on: <component or edge>
    sides:                            # instead of owner
      - {owner: <area>, role: <role>, summary: "<this side's part>"}
      - {owner: <area>, role: <role>, summary: "<this side's part>"}
    # Example (a gateway): {id: cli-idempotent-retry, on: client, sides: [{owner: cli, role: client-retry,
    #   summary: "a keyed create retried on 409 (key in use)"}, {owner: control-plane,
    #   role: server-dedupe, summary: "the same Idempotency-Key replays the first response"}]}

# ---------------------------------------------------------------------------------------------
# 9. Benchmark and judging (stage 7).
# ---------------------------------------------------------------------------------------------
benchmark:
  file: BENCHMARK.md                  # written before stage 4, hidden from builders
  groups: [<group>]                   # one judge per group. Example: [write, read, lwt-batch, hints-membership, schema-repair-protocol]
  default_world: [<fixture-id>]       # fixtures every case starts from unless it says otherwise

# ---------------------------------------------------------------------------------------------
# 10. Independence: what each role may read.
# ---------------------------------------------------------------------------------------------
independence:
  never_read:                         # nobody in the pipeline except the coordinator
    - <any hand-built model of the same system>   # Example: ~/<repo>-explorer*, a hand-written lab ontology
  area_may_read: [skeleton.yaml, fixtures.yaml, inventory.json, "own files", "owner fragments, for contracts only"]
  area_never_read: ["other areas' notes", BENCHMARK.md, judge/**, oracle/**]
  reconcile_may_read: ["other areas' fragments, for contracts and seeded state"]
  oracle_may_read: ["<repo>.json", "the snapshot's tests and code"]
  oracle_never_read: [notes/**, BENCHMARK.md, judge/**]
  judge_may_read: ["<repo>.json", fragments/**, notes/**, BENCHMARK.md, "the snapshot's docs and tests"]
  # The repo's upstream working copy, if any, is off limits (only the snapshot is read).
  upstream_checkout: null             # Example: ~/workplace/<repo> (never touched)

# ---------------------------------------------------------------------------------------------
# 11. Scale targets and gates.
# ---------------------------------------------------------------------------------------------
scale:
  area_entries: [30, 400]             # inventory entries per area after skip rules; split or merge outside this
  per_area:
    components: [20, 80]              # Example: a gateway platform [15, 60]
    flows: [5, 12]
    scenarios: [20, 50]
  gates:
    coverage_min: 0.95                # covered / (entries - skipped), per area and merged
    behavior_coverage_min: 0.8        # executed behavior steps / all behavior steps, per area
    unexecuted_fail_branches: 0       # every fail branch runs, or the notes say why not
    cite_sample: 15                   # per round; two rounds with different seeds
    mocks: 0                          # in merged-model, oracle and judge scenarios
    write_then_read: required         # every flow tagged `writes` has a multi-step write-then-read scenario (--lint hollow)
    modeled_min: 0.5                  # --min-modeled, per area
    substantive_min: 0.5              # --min-substantive: modeled by a non-trivial interface, per area
    trivial_max: 0.35                 # --max-trivial: share of entry-citing interfaces with a trivial behavior, per area
    build_oracle: required            # stage 4b: each in-build test passes, or is recorded untranslatable or sim-gap
    test_reach_min: 0.5               # --min-test-reach: reached / resolved test files, per area (DESIGN §13.1 item 19)
    features: required                # --strict-features: every owned feature covered or validly skipped
    failures: required                # --strict-failures: every owned failure injected by a scenario or validly skipped (§13.1 item 22)

# ---------------------------------------------------------------------------------------------
# 12. Ratcheted check thresholds (DESIGN §16.1). The full gate and the compose `check` stage pass
#     `--profile <this file>`, and each entry here is the default of its check flag (a flag
#     given on the command line wins). Write today's measured value when the profile is created
#     for an existing model; these values are for a new model. A missing entry, or a profile
#     without `gates:`, takes the value shown here.
#
#     The ratchet: a threshold only tightens (a max goes down, min_test_reach and min_mechanisms go up). When fixes land,
#     the check prints `~ ratchet: --<flag> can go down to N` (`can go up to R` for min_mechanisms); move the entry there in the same round. Never raise
#     one: fix the new findings instead. Values are rounded toward passing: shares (max_*) up, reach
#     down, to 3 places.
# ---------------------------------------------------------------------------------------------
gates:
  strict_stubs: true                  # --strict-stubs: two stubs that disagree are an error
  max_exemption_issues: 0             # --max-exemption-issues: exemptions whose citation doesn't resolve or support them
  max_internal_assertions: 0.5        # --max-internal-assertions: per fragment, share of expectations naming internals
  max_clock_ids: 0                    # --max-clock-ids: id-shaped templates reading `now` (use id() and seq())
  max_unknown_inputs: 0               # --max-unknown-inputs: input keys the target's request schema doesn't declare
  max_racy: 0                         # --max-racy: per fragment, share of state-writing behaviors that read then write unconditionally
  max_seam_names: 0                   # --max-seam-names: fields read under one spelling and written under another
  min_test_reach: 0.5                 # --min-test-reach (with --tests): per area, reached / resolved test files; only goes up
  max_contract_issues: 0              # --max-contract-issues (with --contract)
  max_conformance_issues: 0           # --max-conformance-issues (with --openapi)
  # --max-explore-failures: scenarios failing some schedule under `--explore 'race|concurr'`.
  # Unset: exploration failures are recorded (output and replay files) and don't gate. Set it
  # (to today's count, then down) to make exploration gate.
  # max_explore_failures: 0
  # --min-mechanisms (with --mechanisms): ok / unskipped mechanisms of the list enumerated from the code
  # (DESIGN §13.1 item 38). Only goes up, the opposite of the max_* gates. Unset: recorded, not gated.
  # min_mechanisms: 0.6
  # --max-shell-mechanisms (with --mechanisms): mechanisms whose removal no boundary expectation notices
  # (DESIGN §13.1 item 39). Unset: recorded, not gated. Either key makes the check run --mechanism-e2e.
  # max_shell_mechanisms: 5
