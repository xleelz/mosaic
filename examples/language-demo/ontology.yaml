# Acceptance ontology for the DESIGN §11 language additions. Three tiny,
# made-up systems share one document so every addition is exercised in a
# real run: a replicated key-value store (kv-*), an editor front end (ed-*)
# and a GPU serving loop (gpu-*). Nothing here models a real code base.
#
#   go run ./internal/devtools/check -f examples/language-demo/ontology.yaml \
#       --behavior-coverage --lint hollow --no-mocks
schema_version: 1
id: language-demo
name: Language demo
description: >-
  Three small systems that exercise instances, parallel joins, hedging, deadlines, timers,
  capacity, publish/subscribe, configs, fixtures, multi-step scenarios and trace assertions.

components:
  # ---------------------------------------------------------------- replicated store
  - {id: kv-client, name: Store client, kind: client, layer: clients, summary: "Sends puts and gets to the coordinator."}
  - id: kv-coordinator
    name: Store coordinator
    kind: service
    layer: kv
    summary: Accepts client requests, writes at quorum and reads with a hedged request.
  - id: kv-membership
    name: Membership
    kind: module
    layer: kv
    summary: Knows which replicas are alive.
    state:
      initial: {nodes: [n1, n2, n3], down: []}
  - id: kv-write-handler
    name: Write response handler
    kind: module
    layer: kv
    summary: Fans a mutation out to every live replica and waits for the quorum.
  - id: kv-node
    name: Storage node
    kind: service
    layer: kv
    summary: One copy of the storage process. A fixture names its instances.
  - id: kv-replica
    name: Replica verb handler
    kind: module
    parent: kv-node
    layer: kv
    summary: Applies writes and serves reads on its own node.
  - id: kv-memtable
    name: Memtable
    kind: datastore
    parent: kv-node
    layer: data
    summary: Rows held by one node.
    state:
      initial: {rows: {}}

  # ---------------------------------------------------------------- editor front end
  - {id: ed-user, name: Editor user, kind: client, layer: clients, summary: "Opens, edits and saves files."}
  - id: ed-workbench
    name: Workbench window
    kind: service
    layer: editor
    summary: One editor window. Runs commands and the auto-save debounce.
    state:
      initial: {last_edit_ms: 0, dirty: false, saves: 0, superseded: 0}
  - id: ed-text-model
    name: Text model
    kind: module
    parent: ed-workbench
    layer: editor
    summary: Holds open documents and fires a synchronous change event.
    state:
      initial: {docs: {}}
  - id: ed-outline
    name: Outline view
    kind: module
    parent: ed-workbench
    layer: editor
    summary: Rebuilds symbols when a document changes.
    state:
      initial: {version: 0}
  - id: ed-diagnostics
    name: Diagnostics
    kind: module
    parent: ed-workbench
    layer: editor
    summary: Re-lints a document when it changes. Its listener can throw.
    state:
      initial: {version: 0}
  - id: ed-ext-host
    name: Extension host
    kind: service
    layer: extensions
    summary: Runs extensions on a single JavaScript thread.
    capacity: {concurrency: 1}
    state:
      initial: {activated: [], synced_version: 0}
  - id: ed-file-service
    name: File service
    kind: datastore
    layer: data
    summary: Reads and writes files on disk.
    state:
      initial: {files: {}}

  # ---------------------------------------------------------------- GPU serving loop
  - {id: gpu-client, name: Inference client, kind: client, layer: clients, summary: "Sends generation requests."}
  - id: gpu-api-server
    name: API server
    kind: service
    layer: serving
    summary: Accepts requests and consumes the engine's output stream.
    state:
      initial: {streamed: 0}
  - id: gpu-engine-core
    name: Engine core
    kind: engine
    layer: serving
    summary: Admits requests and runs the scheduler step loop.
  - id: gpu-scheduler
    name: Scheduler
    kind: module
    parent: gpu-engine-core
    layer: serving
    summary: Tracks running sequences. At most two prefills run at once (max running sequences).
    capacity: {concurrency: 2, queue_limit: 1}
    state:
      initial: {requests: {}}
  - id: gpu-executor
    name: Model executor
    kind: module
    parent: gpu-engine-core
    layer: serving
    summary: Runs one forward pass on every tensor-parallel rank and waits for the all-reduce.
  - id: gpu-worker
    name: GPU worker
    kind: service
    layer: gpu
    summary: One tensor-parallel rank. A fixture names the ranks.

configs:
  - {id: kv-write-quorum, type: integer, value: 2, default: 2, summary: "Acks a write needs."}
  - {id: kv-write-timeout-ms, type: integer, value: 2000, default: 2000, summary: "How long the coordinator waits for the write quorum."}
  - {id: kv-read-timeout-ms, type: integer, value: 1000, default: 1000, summary: "How long the coordinator waits for a read."}
  - {id: kv-speculative-threshold-ms, type: integer, value: 50, default: 99, summary: "Delay before a hedged read goes to the next replica. Deployed lower than the code default."}
  - {id: kv-request-deadline-ms, type: integer, value: 3000, default: 10000, summary: "Budget for a whole client request, shared by every hop."}
  - {id: ed-auto-save-delay-ms, type: integer, value: 1000, default: 1000, summary: "Debounce before an automatic save."}
  - {id: ed-save-participant-timeout-ms, type: integer, value: 750, default: 1500, summary: "Budget for extensions that take part in a save."}
  - {id: ed-startup-extensions, type: array, value: [ts-language, eslint], default: [], summary: "Extensions activated when a file opens."}
  - {id: gpu-tensor-parallel-size, type: integer, value: 4, default: 1, summary: "Number of ranks a forward pass spans."}
  - {id: gpu-prefill-tokens-per-ms, type: integer, value: 64, default: 64, summary: "Prefill throughput per rank."}
  - {id: gpu-decode-ms, type: integer, value: 3, default: 3, summary: "Time for one decode step."}

fixtures:
  - id: kv-three-nodes
    topology: {kv-node: [n1, n2, n3]}
    clock: {epoch: "2026-10-30T00:00:00Z"}
  - id: kv-seeded
    extends: [kv-three-nodes]
    state: {kv-memtable: {rows: {k1: {key: k1, value: old, written_at: 0}}}}
  - id: ed-one-window
    topology: {ed-workbench: [w1]}
    clock: {epoch: "2026-10-30T09:00:00Z"}
    state: {ed-file-service: {files: {"file:///work/a.ts": {uri: "file:///work/a.ts", content: "let x = 1"}}}}
  - id: ed-doc-open
    extends: [ed-one-window]
    state: {ed-text-model: {docs: {"file:///work/a.ts": {content: "let x = 1", version: 1}}}}
  - id: gpu-tp4
    topology: {gpu-worker: [rank0, rank1, rank2, rank3]}
    clock: {epoch: "2026-10-30T12:00:00Z"}
  - id: gpu-two-running
    extends: [gpu-tp4]
    state:
      gpu-scheduler:
        requests:
          req-a: {tokens: 128, generated: 1, max_tokens: 3}
          req-b: {tokens: 256, generated: 2, max_tokens: 3}

interfaces:
  # ================================================================ replicated store
  - component: kv-coordinator
    name: put
    kind: rpc
    summary: Write a row at quorum.
    latency_ms: 1
    errors:
      - {code: unavailable, status: 503}
      - {code: write-timeout, status: 504}
    behavior:
      - call: kv-membership.live-replicas
        as: live
      - set: {vars.quorum: "= config['kv-write-quorum']"}
      - if: "size(vars.live.value.replicas) < vars.quorum"
        then:
          - title: Refuse before sending anything
            fail: {code: unavailable, status: 503, data: {alive: "= size(vars.live.value.replicas)", required: "= vars.quorum"}}
      - call: kv-write-handler.await
        input: {replicas: "= vars.live.value.replicas", quorum: "= vars.quorum", key: "= input.key", value: "= input.value"}
        title: The request budget covers every replica hop
        deadline_ms: "= config['kv-request-deadline-ms']"
        as: acks
        on_error:
          - when: "error.code == 'timeout'"
            title: The join timed out
            fail: {code: write-timeout, status: 504, data: "= error.data"}
          - fail: "= error"
      - return: {key: "= input.key", acks: "= vars.acks.value.acks"}

  - component: kv-coordinator
    name: get
    kind: rpc
    summary: Read a row with a hedged (speculative) request.
    latency_ms: 1
    behavior:
      - call: kv-membership.live-replicas
        as: live
      - title: Ask the closest replica, hedge to the next after the threshold
        parallel: "= vars.live.value.replicas"
        as: replica
        stagger_ms: "= config['kv-speculative-threshold-ms']"
        join: {need: 1}
        timeout_ms: "= config['kv-read-timeout-ms']"
        as_result: reads
        steps:
          - {call: kv-replica.read, on: "= vars.replica", input: {key: "= input.key"}, as: got}
          - {return: "= vars.got.value"}
      - return: "= vars.reads.results.filter(r, r.ok && !r.late)[0].value"

  - component: kv-membership
    name: live-replicas
    kind: function
    latency_ms: 0
    behavior:
      - return: {replicas: "= state.nodes.filter(n, !(n in state.down))"}

  - component: kv-write-handler
    name: await
    kind: function
    latency_ms: 0
    behavior:
      - title: Send to every live replica, wait for the quorum
        parallel: "= input.replicas"
        as: replica
        join: {need: "= input.quorum"}
        timeout_ms: "= config['kv-write-timeout-ms']"
        as_result: acks
        on_insufficient: {code: write-failure, status: 500}
        steps:
          - {call: kv-replica.write, on: "= vars.replica", input: {key: "= input.key", value: "= input.value"}}
      - return: {acks: "= vars.acks.received"}

  - component: kv-replica
    name: write
    kind: rpc
    latency_ms: 3
    behavior:
      - call: kv-memtable.put
        input: {key: "= input.key", value: "= input.value", written_at: "= now"}
      - return: {replica: "= self"}

  - component: kv-replica
    name: read
    kind: rpc
    latency_ms: 2
    behavior:
      - call: kv-memtable.get
        input: {key: "= input.key"}
        as: row
      - return: {replica: "= self", value: "= vars.row.value.value"}

  - {component: kv-memtable, name: put, kind: function, latency_ms: 1, store: {table: rows, op: put, key: "= input.key", value: "= input"}}
  - {component: kv-memtable, name: get, kind: function, latency_ms: 1, store: {table: rows, op: get, key: "= input.key"}}

  # ================================================================ editor front end
  - component: ed-workbench
    name: open-file
    kind: function
    summary: Open a file, load it into the text model and activate startup extensions.
    latency_ms: 2
    behavior:
      - call: ed-file-service.read
        input: {uri: "= input.uri"}
        as: file
      - call: ed-text-model.load
        input: {uri: "= input.uri", content: "= vars.file.value.content"}
      - title: Activate startup extensions together (Promise.all)
        parallel: "= config['ed-startup-extensions']"
        as: ext
        join: {need: all}
        as_result: activations
        steps:
          - {call: ed-ext-host.activate, input: {ext: "= vars.ext"}}
      - return: {uri: "= input.uri", activated: "= vars.activations.received"}

  - component: ed-workbench
    name: type-text
    kind: function
    summary: Apply one edit and (re)schedule the auto-save.
    latency_ms: 1
    behavior:
      - call: ed-text-model.apply-edit
        input: {uri: "= input.uri", text: "= input.text"}
        as: edit
      - set: {state.last_edit_ms: "= now", state.dirty: true}
      - title: Debounce the auto-save
        emit: ed-workbench.autosave
        after_ms: "= config['ed-auto-save-delay-ms']"
        input: {uri: "= input.uri", scheduled_at: "= now"}
      - return: {version: "= vars.edit.value.version"}

  - component: ed-workbench
    name: type-burst
    kind: function
    summary: Several keystrokes in a row.
    latency_ms: 0
    behavior:
      - foreach: "= input.chars"
        as: ch
        steps:
          - {call: ed-workbench.type-text, input: {uri: "= input.uri", text: "= vars.ch"}}
      - return: {typed: "= size(input.chars)"}

  - component: ed-workbench
    name: autosave
    kind: event
    summary: Delivered after the debounce delay; skipped when a newer edit rescheduled it.
    latency_ms: 0
    behavior:
      - if: "state.last_edit_ms > input.scheduled_at"
        then:
          - set: {state.superseded: "= state.superseded + 1"}
          - return: {saved: false, reason: superseded}
      - call: ed-workbench.save-file
        input: {uri: "= input.uri"}
      - return: {saved: true}

  - component: ed-workbench
    name: save-file
    kind: function
    summary: Save a document, giving extensions a bounded chance to take part.
    latency_ms: 1
    behavior:
      - call: ed-text-model.snapshot
        input: {uri: "= input.uri"}
        as: doc
      - title: Will-save participants share one budget
        call: ed-ext-host.will-save
        input: {uri: "= input.uri"}
        deadline_ms: "= config['ed-save-participant-timeout-ms']"
        as: participants
        on_error: continue
      - call: ed-file-service.write
        input: {uri: "= input.uri", content: "= vars.doc.value.content"}
      - set: {state.dirty: false, state.saves: "= state.saves + 1"}
      - return: {saved: true, participants_ok: "= vars.participants.ok"}

  - component: ed-text-model
    name: load
    kind: function
    latency_ms: 1
    behavior:
      - set: {state.docs: "= merge(state.docs, {input.uri: {'content': input.content, 'version': 1}})"}

  - component: ed-text-model
    name: apply-edit
    kind: function
    latency_ms: 1
    behavior:
      - set:
          vars.doc: "= state.docs[input.uri]"
      - set:
          state.docs: "= merge(state.docs, {input.uri: {'content': vars.doc.content + input.text, 'version': vars.doc.version + 1}})"
      - title: Fire onDidChange synchronously
        publish: ed-text-model.on-did-change
        input: {uri: "= input.uri", version: "= vars.doc.version + 1"}
        delivery: sync
      - set: {ctx.after_publish_ms: "= now"}
      - return: {version: "= vars.doc.version + 1"}

  - component: ed-text-model
    name: on-did-change
    kind: event
    summary: The change event topic.

  - component: ed-text-model
    name: snapshot
    kind: function
    latency_ms: 0
    behavior:
      - return: "= state.docs[input.uri]"

  - component: ed-outline
    name: on-document-change
    kind: event
    latency_ms: 3
    subscribe: [ed-text-model.on-did-change]
    behavior:
      - set: {state.version: "= input.version"}

  - component: ed-diagnostics
    name: on-document-change
    kind: event
    latency_ms: 4
    subscribe: [ed-text-model.on-did-change]
    errors: [{code: listener-threw, status: 500}]
    behavior:
      - set: {state.version: "= input.version"}

  - component: ed-ext-host
    name: on-document-change
    kind: event
    latency_ms: 2
    subscribe: [ed-text-model.on-did-change]
    behavior:
      - set: {state.synced_version: "= input.version"}

  - component: ed-ext-host
    name: activate
    kind: rpc
    summary: Activate one extension on the host's single thread.
    latency_ms: 20
    behavior:
      - if: "input.ext in state.activated"
        then: [{return: {ext: "= input.ext", already: true}}]
      - set: {state.activated: "= state.activated + [input.ext]"}
      - return: {ext: "= input.ext", already: false}

  - component: ed-ext-host
    name: will-save
    kind: rpc
    summary: Let extensions edit the document before it is written.
    latency_ms: 10

  - {component: ed-file-service, name: read, kind: function, latency_ms: 2, store: {table: files, op: get, key: "= input.uri"}}
  - {component: ed-file-service, name: write, kind: function, latency_ms: 5, store: {table: files, op: put, key: "= input.uri", value: "= input"}}

  # ================================================================ GPU serving loop
  - component: gpu-api-server
    name: generate
    kind: http
    attributes: {method: POST, path: /v1/completions}
    latency_ms: 1
    behavior:
      - call: gpu-engine-core.add-request
        input: {request_id: "= input.request_id", prompt_tokens: "= input.prompt_tokens", max_tokens: "= input.max_tokens"}
        as: added
      - return: {request_id: "= input.request_id", prefill_ms: "= vars.added.value.prefill_ms"}

  - component: gpu-api-server
    name: generate-batch
    kind: http
    summary: Several requests arriving at once.
    attributes: {method: POST, path: /v1/batch}
    latency_ms: 0
    behavior:
      - parallel: "= input.requests"
        as: req
        join: {need: 1}
        as_result: admitted
        steps:
          - {call: gpu-engine-core.add-request, input: "= vars.req"}
      - return: {admitted: "= vars.admitted.received", failed: "= vars.admitted.failed"}

  - component: gpu-api-server
    name: on-output
    kind: stream
    latency_ms: 0
    subscribe: [gpu-engine-core.outputs]
    behavior:
      - set: {state.streamed: "= state.streamed + size(input.request_ids)"}

  - component: gpu-engine-core
    name: add-request
    kind: function
    latency_ms: 0
    behavior:
      - call: gpu-scheduler.prefill
        input: "= input"
        as: pre
      - return: {prefill_ms: "= vars.pre.value.step_ms"}

  - component: gpu-engine-core
    name: outputs
    kind: event
    summary: Tokens produced by one step.

  - component: gpu-engine-core
    name: step
    kind: function
    summary: One scheduler step; a flow repeats it.
    latency_ms: 0
    behavior:
      - call: gpu-scheduler.schedule
        as: sch
      - if: "size(vars.sch.value.running) == 0"
        then: [{return: {idle: true, running: 0}}]
      - call: gpu-executor.execute-model
        input: {phase: decode, tokens: "= size(vars.sch.value.running)"}
      - call: gpu-scheduler.commit-step
        input: {running: "= vars.sch.value.running"}
      - publish: gpu-engine-core.outputs
        input: {request_ids: "= vars.sch.value.running"}
      - return: {idle: false, running: "= size(vars.sch.value.running)"}

  - component: gpu-scheduler
    name: prefill
    kind: function
    summary: Admit a request and run its prefill. Holds one of the running-sequence slots.
    latency_ms: 0
    errors: [{code: overloaded, status: 429, retryable: true}]
    behavior:
      - call: gpu-executor.execute-model
        input: {phase: prefill, tokens: "= input.prompt_tokens"}
        as: fw
      - set:
          state.requests: "= merge(state.requests, {input.request_id: {'tokens': input.prompt_tokens, 'generated': 1, 'max_tokens': input.max_tokens}})"
      - return: {step_ms: "= vars.fw.value.step_ms"}

  - component: gpu-scheduler
    name: schedule
    kind: function
    latency_ms: 0
    behavior:
      - return: {running: "= state.requests.filter(k, state.requests[k].generated < state.requests[k].max_tokens)"}

  - component: gpu-scheduler
    name: commit-step
    kind: function
    latency_ms: 0
    behavior:
      - foreach: "= input.running"
        as: rid
        steps:
          - set: {state.requests: "= merge(state.requests, {vars.rid: {'generated': state.requests[vars.rid].generated + 1}})"}

  - component: gpu-executor
    name: execute-model
    kind: function
    latency_ms: 0
    errors: [{code: worker-failed, status: 500}]
    behavior:
      - title: Forward on every rank, then all-reduce
        parallel: "= ['rank0', 'rank1', 'rank2', 'rank3'].slice(0, config['gpu-tensor-parallel-size'])"
        as: rank
        join: {need: all}
        as_result: shards
        on_insufficient: {code: worker-failed, status: 500}
        steps:
          - {call: gpu-worker.forward, on: "= vars.rank", input: {phase: "= input.phase", tokens: "= input.tokens"}}
      - return: {step_ms: "= vars.shards.duration_ms"}

  - component: gpu-worker
    name: forward
    kind: rpc
    summary: One forward pass. Prefill time grows with the prompt; a decode step is fixed.
    latency_ms: "= input.phase == 'prefill' ? 2 + int(input.tokens) / int(config['gpu-prefill-tokens-per-ms']) : int(config['gpu-decode-ms'])"
    behavior:
      - return: {rank: "= self", tokens: "= input.tokens"}

flows:
  # replicated store
  - id: kv-put
    name: Quorum write
    tags: [writes]
    entry: {caller: kv-client, interface: kv-coordinator.put, input: {key: k1, value: v1}}
  - id: kv-get
    name: Hedged read
    entry: {caller: kv-client, interface: kv-coordinator.get, input: {key: k1}}
  # editor
  - id: ed-open-file
    name: Open a file
    entry: {caller: ed-user, interface: ed-workbench.open-file, input: {uri: "file:///work/a.ts"}}
  - id: ed-type-text
    name: Type one character
    tags: [writes]
    entry: {caller: ed-user, interface: ed-workbench.type-text, input: {uri: "file:///work/a.ts", text: ";"}}
  - id: ed-type-burst
    name: Type several characters
    entry: {caller: ed-user, interface: ed-workbench.type-burst, input: {uri: "file:///work/a.ts", chars: [a, b, c]}}
  - id: ed-save-file
    name: Save a file
    tags: [writes]
    entry: {caller: ed-user, interface: ed-workbench.save-file, input: {uri: "file:///work/a.ts"}}
  # GPU serving
  - id: gpu-generate
    name: Add a request and prefill it
    tags: [writes]
    entry: {caller: gpu-client, interface: gpu-api-server.generate, input: {request_id: req-1, prompt_tokens: 512, max_tokens: 3}}
  - id: gpu-generate-batch
    name: Several requests at once
    entry:
      caller: gpu-client
      interface: gpu-api-server.generate-batch
      input:
        requests:
          - {request_id: req-1, prompt_tokens: 640, max_tokens: 2}
          - {request_id: req-2, prompt_tokens: 640, max_tokens: 2}
          - {request_id: req-3, prompt_tokens: 640, max_tokens: 2}
  - id: gpu-engine-loop
    name: Scheduler step loop
    entry: {caller: gpu-client, interface: gpu-engine-core.step, repeat: {count: 3, interval_ms: 0}}

scenarios:
  # ================================================================ replicated store
  - id: kv-quorum-write
    flow: kv-put
    name: Write acknowledged by two of three replicas
    fixtures: [kv-three-nodes]
    expect:
      - "result.ok && result.value.acks == 2"
      - "calls_by_instance['kv-replica.write@n1'] == 1 && calls_by_instance['kv-replica.write@n2'] == 1 && calls_by_instance['kv-replica.write@n3'] == 1"
      - "trace.exists(e, e.type == 'parallel.start' && e.output.need == 2 && e.output.branches == 3)"
      - "state['kv-memtable@n3'].rows.k1.value == 'v1'"
      - "state['kv-memtable@n1'].rows.k1.written_at >= int(timestamp('2026-10-30T00:00:00Z')) * 1000"

  - id: kv-slow-replica
    flow: kv-put
    name: A slow replica does not hold the write back
    fixtures: [kv-three-nodes]
    faults:
      - {target: kv-replica.write, type: latency, latency_ms: 1500, instance: n3}
    expect:
      - "result.ok && result.value.acks == 2"
      - "duration_ms < 100"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'kv-replica.write' && e.instance == 'n3' && e.late)"
      - "trace.filter(e, e.type == 'call.end' && e.interface == 'kv-replica.write' && !e.late).size() == 2"
      - "state['kv-memtable@n3'].rows.k1.value == 'v1'"

  - id: kv-silent-replicas-time-out
    flow: kv-put
    name: Two silent replicas; the configured write timeout ends the wait
    fixtures: [kv-three-nodes]
    config: {kv-write-timeout-ms: 300}
    faults:
      - {target: kv-replica.write, type: timeout, instance: n2}
      - {target: kv-replica.write, type: timeout, instance: n3}
    expect:
      - "!result.ok && result.error.code == 'write-timeout' && result.error.status == 504"
      - "result.error.data.received == 1 && result.error.data.required == 2"
      - "duration_ms == 301"
      - "trace.exists(e, e.type == 'parallel.end' && e.error != null && e.error.code == 'timeout')"
      - "state['kv-memtable@n1'].rows.k1.value == 'v1'"

  - id: kv-hedged-read
    flow: kv-get
    name: The closest replica is slow, so the read is hedged to the next
    fixtures: [kv-seeded]
    faults:
      - {target: kv-replica.read, type: latency, latency_ms: 300, instance: n1}
    expect:
      - "result.ok && result.value.replica == 'n2' && result.value.value == 'old'"
      - "calls_by_instance['kv-replica.read@n2'] == 1 && calls_by_instance['kv-replica.read@n3'] == 0"
      - "trace.filter(e, e.type == 'call.start' && e.interface == 'kv-replica.read' && e.instance == 'n2')[0].t >= 50"

  - id: kv-write-then-read
    name: A quorum write is read back from another node
    fixtures: [kv-seeded]
    steps:
      - {flow: kv-put, as: w, input: {key: k1, value: fresh}}
      - {flow: kv-get, as: r, at_ms: 100, input: {key: k1}}
    expect:
      - "steps.w.result.ok && steps.r.result.ok"
      - "steps.r.result.value.value == 'fresh'"
      - "steps.r.start_ms == 100"
      - "state['kv-memtable@n2'].rows.k1.value == 'fresh'"

  # ================================================================ editor front end
  - id: ed-open-queues-activations
    flow: ed-open-file
    name: Startup extensions queue on the single-threaded extension host
    fixtures: [ed-one-window]
    expect:
      - "result.ok && result.value.activated == 2"
      - "trace.exists(e, e.type == 'queue' && e.component == 'ed-ext-host' && e.wait_ms == 20)"
      - "state['ed-ext-host'].activated == ['ts-language', 'eslint']"
      - "state['ed-text-model@w1'].docs['file:///work/a.ts'].content == 'let x = 1'"

  - id: ed-edit-sync-publish
    flow: ed-type-text
    name: An edit notifies three listeners inline
    fixtures: [ed-doc-open]
    expect:
      - "result.ok && result.value.version == 2"
      - "trace.exists(e, e.type == 'publish' && e.topic == 'ed-text-model.on-did-change')"
      - "trace.filter(e, e.type == 'call.start' && e.interface.endsWith('on-document-change')).map(e, e.interface) == ['ed-diagnostics.on-document-change', 'ed-ext-host.on-document-change', 'ed-outline.on-document-change']"
      - "ctx.after_publish_ms - int(timestamp('2026-10-30T09:00:00Z')) * 1000 == 11"
      - "state['ed-outline@w1'].version == 2 && state['ed-diagnostics@w1'].version == 2 && state['ed-ext-host'].synced_version == 2"

  - id: ed-throwing-subscriber
    flow: ed-type-text
    name: A throwing listener does not break the edit
    fixtures: [ed-doc-open]
    faults:
      - {target: ed-diagnostics.on-document-change, type: error, code: listener-threw, status: 500}
    expect:
      - "result.ok && result.value.version == 2"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'ed-diagnostics.on-document-change' && e.error != null && e.error.code == 'listener-threw')"
      - "state['ed-diagnostics@w1'].version == 0 && state['ed-outline@w1'].version == 2"

  - id: ed-open-edit-save
    name: Open, edit, save, then reopen the saved file
    fixtures: [ed-one-window]
    steps:
      - {flow: ed-open-file, as: open}
      - {flow: ed-type-text, as: edit, input: {text: ";"}}
      - {flow: ed-save-file, as: save}
      - {flow: ed-open-file, as: reopen}
    expect:
      - "steps.open.result.ok && steps.edit.result.value.version == 2 && steps.save.result.value.saved"
      - "steps.save.result.value.participants_ok"
      - "state['ed-file-service'].files['file:///work/a.ts'].content == 'let x = 1;'"
      - "state['ed-text-model@w1'].docs['file:///work/a.ts'].content == 'let x = 1;'"
      - "trace.filter(e, e.type == 'step.start').map(e, e.key) == ['open', 'edit', 'save', 'reopen']"

  - id: ed-debounced-autosave
    flow: ed-type-burst
    name: Three quick keystrokes produce one automatic save
    fixtures: [ed-doc-open]
    expect:
      - "result.ok && result.value.typed == 3"
      - "calls['ed-workbench.autosave'] == 3 && calls['ed-file-service.write'] == 1"
      - "state['ed-workbench@w1'].superseded == 2 && state['ed-workbench@w1'].saves == 1 && !state['ed-workbench@w1'].dirty"
      - "state['ed-file-service'].files['file:///work/a.ts'].content == 'let x = 1abc'"

  # ================================================================ GPU serving loop
  - id: gpu-prefill-all-reduce
    flow: gpu-generate
    name: Prefill runs on four ranks and waits for the all-reduce
    fixtures: [gpu-tp4]
    expect:
      - "result.ok && result.value.prefill_ms == 10"
      - "size(calls_by_instance.filter(k, k.startsWith('gpu-worker.forward@') && calls_by_instance[k] == 1)) == 4"
      - "trace.exists(e, e.type == 'parallel.end' && e.output.received == 4 && e.output.required == 4)"
      - "state['gpu-scheduler'].requests['req-1'].generated == 1"

  - id: gpu-dead-rank
    flow: gpu-generate
    name: A dead rank fails the forward pass
    fixtures: [gpu-tp4]
    faults:
      - {target: gpu-worker.forward, type: unavailable, instance: rank2}
    expect:
      - "!result.ok && result.error.code == 'worker-failed' && result.error.data.failed == 1"
      - "trace.exists(e, e.type == 'call.end' && e.interface == 'gpu-worker.forward' && e.instance == 'rank2' && e.error != null)"
      - "!('req-1' in state['gpu-scheduler'].requests)"

  - id: gpu-max-running-seqs
    flow: gpu-generate-batch
    name: The third request waits for a running-sequence slot
    fixtures: [gpu-tp4]
    expect:
      - "result.ok && result.value.admitted == 1"
      - "trace.filter(e, e.type == 'queue' && e.component == 'gpu-scheduler').size() == 1"
      - "trace.filter(e, e.type == 'queue')[0].wait_ms == 12"
      - "state['gpu-scheduler'].requests.size() == 3"

  - id: gpu-engine-loop-drains
    flow: gpu-engine-loop
    name: The step loop decodes until every request is done
    fixtures: [gpu-two-running]
    expect:
      - "passes[0].result.value.running == 2 && passes[1].result.value.running == 1 && passes[2].result.value.idle"
      - "state['gpu-scheduler'].requests['req-a'].generated == 3 && state['gpu-scheduler'].requests['req-b'].generated == 3"
      - "state['gpu-api-server'].streamed == 3"
      - "trace.filter(e, e.type == 'publish' && e.topic == 'gpu-engine-core.outputs').size() == 2"

  - id: gpu-add-then-step
    name: Add a request, then two scheduler steps finish it
    fixtures: [gpu-tp4]
    steps:
      - {flow: gpu-generate, as: add}
      - {flow: gpu-engine-loop, as: s1}
      - {flow: gpu-engine-loop, as: s2}
      - {flow: gpu-engine-loop, as: s3}
    expect:
      - "steps.add.result.ok && steps.s1.result.value.running == 1 && steps.s2.result.value.running == 1"
      - "steps.s3.result.value.idle"
      - "state['gpu-scheduler'].requests['req-1'].generated == 3"
