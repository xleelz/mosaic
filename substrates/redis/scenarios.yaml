      - "steps.read.result.value.value == '5'"


  - id: zset-rank-order
    name: ZRANGE orders by score, ties by member; REV and negative indexes work
    fixtures: [seeded]
    steps:
      - {flow: zrange, as: all, input: {key: board, start: 0, stop: -1, rev: false}}
      - {flow: zrange, as: top2, input: {key: board, start: 0, stop: 1, rev: true}}
      - {flow: zrange, as: last, input: {key: board, start: -1, stop: -1, rev: false}}
      - {flow: zrange, as: out, input: {key: board, start: 10, stop: 20, rev: false}}
      - {flow: zrange, as: none, input: {key: ghost, start: 0, stop: -1, rev: false}}
    expect:
      - "steps.all.result.value.members == ['ada', 'cy', 'bob', 'dee'] && steps.all.result.value.scores == [10, 10, 20, 30]"
      - "steps.top2.result.value.members == ['dee', 'bob']"
      - "steps.last.result.value.members == ['dee'] && steps.out.result.value.members == [] && steps.none.result.value.members == []"

  - id: zset-zadd-flags
    name: ZADD NX only adds, XX only updates, GT only raises, CH counts changes
    fixtures: [seeded]
    steps:
      - {flow: zadd, as: plain, input: {key: board, members: {ada: 15, eve: 5}, nx: false, xx: false, gt: false, lt: false, ch: false}}
      - {flow: zadd, as: nx, input: {key: board, members: {ada: 99, fay: 1}, nx: true, xx: false, gt: false, lt: false, ch: false}}
      - {flow: zadd, as: xx, input: {key: board, members: {bob: 21, gus: 1}, nx: false, xx: true, gt: false, lt: false, ch: true}}
      - {flow: zadd, as: gt, input: {key: board, members: {dee: 25, cy: 12}, nx: false, xx: false, gt: true, lt: false, ch: true}}
      - {flow: zadd, as: clash, input: {key: board, members: {a: 1}, nx: true, xx: false, gt: true, lt: false, ch: false}}
      - {flow: zscore, as: s, input: {key: board, member: ada}}
    expect:
      - "steps.plain.result.value.count == 1 && steps.nx.result.value.count == 1"
      - "steps.xx.result.value.count == 1 && !('gus' in state.redis.keys.board.value)"
      - "steps.gt.result.value.count == 1 && state.redis.keys.board.value.dee == 30 && state.redis.keys.board.value.cy == 12"
      - "!steps.clash.result.ok && steps.clash.result.error.code == 'err'"
      - "steps.s.result.value.score == 15 && state.redis.keys.board.value.fay == 1"

  - id: zset-incr-rem-card
    name: ZINCRBY adds to a score, ZREM removes members, and removing the last one deletes the key
    fixtures: [seeded]
    steps:
      - {flow: zincrby, as: inc, input: {key: board, member: ada, increment: 2.5}}
      - {flow: zincrby, as: new, input: {key: solo, member: x, increment: 1}}
      - {flow: zrem, as: rem, input: {key: board, members: [bob, ghost]}}
      - {flow: zcard, as: card, input: {key: board}}
      - {flow: zrem, as: last, input: {key: solo, members: [x]}}
      - {flow: zscore, as: miss, input: {key: solo, member: x}}
    expect:
      - "steps.inc.result.value.score == 12.5 && steps.new.result.value.score == 1"
      - "steps.rem.result.value.count == 1 && steps.card.result.value.count == 3"
      - "steps.last.result.value.count == 1 && steps.miss.result.value.score == null && !('solo' in state.redis.keys)"

  - id: zset-by-score
    name: ZRANGEBYSCORE honors inclusive and exclusive bounds and LIMIT; ZREMRANGEBYSCORE trims
    fixtures: [seeded]
    steps:
      - {flow: zrangebyscore, as: incl, input: {key: board, min: 10, max: 20, min_exclusive: false, max_exclusive: false, offset: 0, count: 0}}
      - {flow: zrangebyscore, as: excl, input: {key: board, min: 10, max: 30, min_exclusive: true, max_exclusive: false, offset: 0, count: 0}}
      - {flow: zrangebyscore, as: page, input: {key: board, min: 0, max: 100, min_exclusive: false, max_exclusive: false, offset: 1, count: 2}}
      - {flow: zremrangebyscore, as: trim, input: {key: board, min: 0, max: 15, min_exclusive: false, max_exclusive: false, offset: 0, count: 0}}
      - {flow: zrange, as: after, input: {key: board, start: 0, stop: -1, rev: false}}
    expect:
      - "steps.incl.result.value.members == ['ada', 'cy', 'bob']"
      - "steps.excl.result.value.members == ['bob', 'dee']"
      - "steps.page.result.value.members == ['cy', 'bob']"
      - "steps.trim.result.value.count == 2 && state.redis.keys.board.value == {'bob': 20.0, 'dee': 30.0}"

