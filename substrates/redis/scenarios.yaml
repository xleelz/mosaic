  - id: lua-evalsha
    name: EVALSHA of an unknown digest is NOSCRIPT; after SCRIPT LOAD it runs the script
    fixtures: [seeded]
    steps:
      - {flow: evalsha, as: before, input: {sha: "0000000000000000000000000000000000000000", keys: [greeting], args: []}}
      - {flow: script-load, as: load, input: {script: "{'reply': data[KEYS[0]].value + '!'}"}}
      - {flow: evalsha, as: after, input: {sha: "= steps.load.result.value.sha", keys: [greeting], args: []}}
    expect:
      - "!steps.before.result.ok && steps.before.result.error.code == 'noscript'"
      - "size(steps.load.result.value.sha) == 40 && steps.after.result.value.reply == 'hello!'"

