# The Redis substrate's own tests. Run with:
#   go run ./internal/devtools/check -f substrates/redis/redis.yaml -f substrates/redis/scenarios.yaml
# Imports don't bring these along (MergeImports skips flows and scenarios).
# `app` holds the client-side patterns the scenarios need (a read-modify-write, a cache-aside
# read with a fallback, a retried INCR); `listener` is a pub/sub subscriber named listener-1.
schema_version: 1
id: redis-scenarios

components:
  - {id: app, name: Application, kind: service, summary: "A Redis client: the scenarios' entry point and the client-side patterns."}
  - id: listener
    name: Subscriber
    kind: service
    summary: "A pub/sub subscriber connected as client listener-1; keeps what it receives."
    state: {initial: {inbox: []}}
  - {id: db, name: Database, kind: datastore, summary: "The source of truth behind the cache."}

interfaces:
  - component: app
    name: naive-incr
    kind: rpc
    summary: "Read-modify-write without a script: GET, compute for 10 ms, SET. Two of these overlapping lose an update."
    request: {type: object, required: [key], properties: {key: {type: string, examples: [counter]}}}
    response: {type: object, properties: {value: {type: integer}}}
    behavior:
      - {call: redis.get, input: {key: "= input.key"}, as: g}
      - set: {vars.n: "= (vars.g.value.value == null ? 0 : int(vars.g.value.value)) + 1"}
      - wait: 10
      - {call: redis.set, input: {key: "= input.key", value: "= string(vars.n)"}}
      - return: {value: "= vars.n"}

  - component: app
    name: script-incr
    kind: rpc
    summary: "The same read-modify-write as one EVAL, with 10 ms of client work before it."
    request: {type: object, required: [key], properties: {key: {type: string, examples: [counter]}}}
    response: {type: object, properties: {value: {type: integer}}}
    behavior:
      - wait: 10
      - call: redis.eval
        input:
          keys: ["= input.key"]
          script: >-
            {'reply': (data[KEYS[0]] == null ? 0 : int(data[KEYS[0]].value)) + 1,
             'writes': {KEYS[0]: {'type': 'string', 'value': string((data[KEYS[0]] == null ? 0 : int(data[KEYS[0]].value)) + 1), 'keepttl': true}}}
        as: e
      - return: {value: "= vars.e.value.reply"}

  - component: app
    name: cache-read
    kind: rpc
    summary: >-
      Cache-aside read: GET from Redis (50 ms timeout); on a miss or when Redis is down, load from
      the database, then try to SET the value back with a 60 s TTL. Redis errors never fail it.
    request: {type: object, required: [key], properties: {key: {type: string, examples: ["user:1"]}}}
    response: {type: object, properties: {value: {type: string}, source: {type: string, enum: [cache, db]}}}
    behavior:
      - {call: redis.get, input: {key: "= input.key"}, timeout_ms: 50, as: g, on_error: continue}
      - if: "vars.g.ok && vars.g.value.value != null"
        then: [{return: {value: "= vars.g.value.value", source: cache}}]
      - set: {ctx.redis_failed: "= !vars.g.ok"}
      - {call: db.load, input: {key: "= input.key"}, as: row}
      - {call: redis.set, input: {key: "= input.key", value: "= vars.row.value.value", px: 60000}, timeout_ms: 50, on_error: continue}
      - return: {value: "= vars.row.value.value", source: db}

  - component: app
    name: retrying-incr
    kind: rpc
    summary: "INCR retried once on a connection reset. INCR isn't idempotent: a reset after the write counts twice."
    request: {type: object, required: [key], properties: {key: {type: string, examples: [counter]}}}
    response: {type: object, properties: {value: {type: integer}}}
    behavior:
      - call: redis.incr
        input: {key: "= input.key"}
        retry: {max_attempts: 2, codes: [connection_reset]}
        as: r
      - return: {value: "= vars.r.value.value"}

  - component: db
    name: load
    kind: rpc
    latency_ms: 20
    request: {type: object, required: [key], properties: {key: {type: string}}}
    response: {type: object, properties: {value: {type: string}}}
    behavior:
      - return: {value: "= 'db:' + input.key"}

  - component: listener
    name: on-message
    kind: event
    summary: "listener-1's push handler: keeps the messages addressed to it."
    subscribe: [redis-message]
    request: {type: object, properties: {channel: {type: string}, message: {type: string}, receivers: {type: array}}}
    behavior:
      - set: {state.inbox: "= state.inbox + [input.channel + ':' + input.message]"}
        when: "'listener-1' in input.receivers"

fixtures:
  - id: clock
    summary: "An empty server; the clock starts at 2026-11-01T00:00:00Z."
    clock: {epoch: "2026-11-01T00:00:00Z"}
  - id: seeded
    extends: [clock]
    summary: "A string, a hash and a sorted set, with no expiry."
    state:
      redis:
        keys:
          greeting: {type: string, value: hello}
          "user:1": {type: hash, value: {name: Ada, visits: "3"}}
          board: {type: zset, value: {ada: 10.0, bob: 20.0, cy: 10.0, dee: 30.0}}

flows:
  - {id: get, tags: [reads], entry: {caller: app, interface: redis.get}}
  - {id: set, tags: [writes], entry: {caller: app, interface: redis.set}}
  - {id: setnx, tags: [writes], entry: {caller: app, interface: redis.setnx}}
  - {id: incr, tags: [writes], entry: {caller: app, interface: redis.incr}}
  - {id: incrby, tags: [writes], entry: {caller: app, interface: redis.incrby}}
  - {id: del, tags: [writes], entry: {caller: app, interface: redis.del}}
  - {id: exists, tags: [reads], entry: {caller: app, interface: redis.exists}}
  - {id: expire, tags: [writes], entry: {caller: app, interface: redis.expire}}
  - {id: pexpire, tags: [writes], entry: {caller: app, interface: redis.pexpire}}
  - {id: ttl, tags: [reads], entry: {caller: app, interface: redis.ttl}}
  - {id: pttl, tags: [reads], entry: {caller: app, interface: redis.pttl}}
  - {id: persist, tags: [writes], entry: {caller: app, interface: redis.persist}}
  - {id: expire-cycle, tags: [writes], entry: {caller: app, interface: redis.expire-cycle, input: {}}}
  - {id: hset, tags: [writes], entry: {caller: app, interface: redis.hset}}
  - {id: hget, tags: [reads], entry: {caller: app, interface: redis.hget}}
  - {id: hgetall, tags: [reads], entry: {caller: app, interface: redis.hgetall}}
  - {id: hdel, tags: [writes], entry: {caller: app, interface: redis.hdel}}
  - {id: hincrby, tags: [writes], entry: {caller: app, interface: redis.hincrby}}
  - {id: zadd, tags: [writes], entry: {caller: app, interface: redis.zadd}}
  - {id: zincrby, tags: [writes], entry: {caller: app, interface: redis.zincrby}}
  - {id: zscore, tags: [reads], entry: {caller: app, interface: redis.zscore}}
  - {id: zcard, tags: [reads], entry: {caller: app, interface: redis.zcard}}
  - {id: zrem, tags: [writes], entry: {caller: app, interface: redis.zrem}}
  - {id: zrange, tags: [reads], entry: {caller: app, interface: redis.zrange}}
  - {id: zrangebyscore, tags: [reads], entry: {caller: app, interface: redis.zrangebyscore}}
  - {id: zremrangebyscore, tags: [writes], entry: {caller: app, interface: redis.zremrangebyscore}}
  - {id: eval, tags: [writes], entry: {caller: app, interface: redis.eval}}
  - {id: script-load, tags: [writes], entry: {caller: app, interface: redis.script-load}}
  - {id: evalsha, tags: [writes], entry: {caller: app, interface: redis.evalsha}}
  - {id: subscribe, tags: [writes], entry: {caller: app, interface: redis.subscribe}}
  - {id: unsubscribe, tags: [writes], entry: {caller: app, interface: redis.unsubscribe}}
  - {id: publish, tags: [writes], entry: {caller: app, interface: redis.publish}}
  - {id: naive-incr, tags: [writes], entry: {caller: app, interface: app.naive-incr}}
  - {id: script-incr, tags: [writes], entry: {caller: app, interface: app.script-incr}}
  - {id: cache-read, tags: [reads], entry: {caller: app, interface: app.cache-read}}
  - {id: retrying-incr, tags: [writes], entry: {caller: app, interface: app.retrying-incr}}

scenarios:
  # ---- strings ----
  - id: set-get-roundtrip
    name: SET stores a string and GET reads it back; GET of a missing key is nil
    fixtures: [clock]
    steps:
      - {flow: set, as: s, input: {key: k, value: "42", nx: false, xx: false, get: false, ex: 0, px: 0, keepttl: false}}
      - {flow: get, as: g, input: {key: k}}
      - {flow: get, as: miss, input: {key: nope}}
    expect:
      - "steps.s.result.ok && steps.s.result.value.ok && steps.s.result.value.old == null"
      - "steps.g.result.value.value == '42'"
      - "steps.miss.result.ok && steps.miss.result.value.value == null"
      - "state.redis.keys.k == {'type': 'string', 'value': '42'}"

  - id: set-nx-xx
    name: SET NX writes only an absent key and XX only a present one; a refused SET replies nil
    fixtures: [seeded]
    steps:
      - {flow: set, as: nx_new, input: {key: lock, value: a, nx: true, xx: false, get: false, ex: 0, px: 0, keepttl: false}}
      - {flow: set, as: nx_taken, input: {key: lock, value: b, nx: true, xx: false, get: false, ex: 0, px: 0, keepttl: false}}
      - {flow: set, as: xx_missing, input: {key: ghost, value: c, nx: false, xx: true, get: false, ex: 0, px: 0, keepttl: false}}
      - {flow: set, as: both, input: {key: lock, value: d, nx: true, xx: true, get: false, ex: 0, px: 0, keepttl: false}}
      - {flow: get, as: g, input: {key: lock}}
    expect:
      - "steps.nx_new.result.value.ok && !steps.nx_taken.result.value.ok"
      - "!steps.xx_missing.result.value.ok && !('ghost' in state.redis.keys)"
      - "!steps.both.result.ok && steps.both.result.error.code == 'err' && steps.both.result.error.message == 'ERR syntax error'"
      - "steps.g.result.value.value == 'a'"

  - id: set-get-option-and-wrongtype
    name: SET GET returns the old string; GET on a hash is WRONGTYPE; a plain SET overwrites any type
    fixtures: [seeded]
    steps:
      - {flow: set, as: swap, input: {key: greeting, value: hi, nx: false, xx: false, get: true, ex: 0, px: 0, keepttl: false}}
      - {flow: get, as: wrong, input: {key: "user:1"}}
      - {flow: set, as: getwrong, input: {key: "user:1", value: x, nx: false, xx: false, get: true, ex: 0, px: 0, keepttl: false}}
      - {flow: set, as: over, input: {key: board, value: flat, nx: false, xx: false, get: false, ex: 0, px: 0, keepttl: false}}
    expect:
      - "steps.swap.result.value.ok && steps.swap.result.value.old == 'hello' && state.redis.keys.greeting.value == 'hi'"
      - "!steps.wrong.result.ok && steps.wrong.result.error.code == 'wrongtype' && steps.wrong.result.error.message.startsWith('WRONGTYPE')"
      - "!steps.getwrong.result.ok && steps.getwrong.result.error.code == 'wrongtype' && state.redis.keys['user:1'].type == 'hash'"
      - "steps.over.result.value.ok && state.redis.keys.board == {'type': 'string', 'value': 'flat'}"

  - id: set-px-expires-lazily
    name: A key SET with PX is readable until its TTL passes, then gone, and the read deletes it
    fixtures: [clock]
    steps:
      - {flow: set, as: s, input: {key: session, value: tok, nx: false, xx: false, get: false, ex: 0, px: 1000, keepttl: false}}
      - {flow: get, as: early, at_ms: 500, input: {key: session}}
      - {flow: pttl, as: left, at_ms: 600, input: {key: session}}
      - {flow: get, as: late, at_ms: 1500, input: {key: session}}
      - {flow: ttl, as: gone, at_ms: 1600, input: {key: session}}
    expect:
      - "steps.early.result.value.value == 'tok'"
      - "steps.left.result.value.pttl > 0 && steps.left.result.value.pttl <= 400"
      - "steps.late.result.ok && steps.late.result.value.value == null"
      - "steps.gone.result.value.ttl == -2 && !('session' in state.redis.keys)"

  - id: set-ex-drops-or-keeps-ttl
    name: SET EX sets seconds; a later plain SET drops the TTL, and SET KEEPTTL keeps it
    fixtures: [clock]
    steps:
      - {flow: set, as: a, input: {key: a, value: "1", nx: false, xx: false, get: false, ex: 10, px: 0, keepttl: false}}
      - {flow: set, as: b, input: {key: b, value: "1", nx: false, xx: false, get: false, ex: 10, px: 0, keepttl: false}}
      - {flow: set, as: a2, input: {key: a, value: "2", nx: false, xx: false, get: false, ex: 0, px: 0, keepttl: false}}
      - {flow: set, as: b2, input: {key: b, value: "2", nx: false, xx: false, get: false, ex: 0, px: 0, keepttl: true}}
      - {flow: ttl, as: ta, input: {key: a}}
      - {flow: ttl, as: tb, input: {key: b}}
      - {flow: set, as: bad, input: {key: c, value: "1", nx: false, xx: false, get: false, ex: -5, px: 0, keepttl: false}}
    expect:
      - "steps.ta.result.value.ttl == -1"
      - "steps.tb.result.value.ttl == 10 && state.redis.keys.b.value == '2'"
      - "!steps.bad.result.ok && steps.bad.result.error.message.contains('invalid expire time')"

  - id: setnx-lock
    name: SETNX takes a free lock (1) and refuses a held one (0) without overwriting it
    fixtures: [clock]
    steps:
      - {flow: setnx, as: first, input: {key: "lock:job", value: worker-a}}
      - {flow: setnx, as: second, input: {key: "lock:job", value: worker-b}}
      - {flow: get, as: owner, input: {key: "lock:job"}}
    expect:
      - "steps.first.result.value.set == 1 && steps.second.result.value.set == 0"
      - "steps.owner.result.value.value == 'worker-a'"
      - "!('expires_at' in state.redis.keys['lock:job'])"

  - id: incr-counts-and-keeps-ttl
    name: INCR starts a missing key at 0, INCRBY adds any amount, and both keep the TTL
    fixtures: [clock]
    steps:
      - {flow: incr, as: i1, input: {key: hits}}
      - {flow: expire, as: e, input: {key: hits, seconds: 60, nx: false, xx: false, gt: false, lt: false}}
      - {flow: incr, as: i2, input: {key: hits}}
      - {flow: incrby, as: i3, input: {key: hits, increment: -5}}
      - {flow: ttl, as: t, input: {key: hits}}
      - {flow: get, as: g, input: {key: hits}}
    expect:
      - "steps.i1.result.value.value == 1 && steps.i2.result.value.value == 2 && steps.i3.result.value.value == -3"
      - "steps.t.result.value.ttl == 60"
      - "steps.g.result.value.value == '-3' && state.redis.keys.hits.type == 'string'"

  - id: incr-refusals
    name: INCR on a non-integer string is ERR and on a hash WRONGTYPE; neither changes the key
    fixtures: [seeded]
    steps:
      - {flow: incr, as: text, input: {key: greeting}}
      - {flow: incr, as: hash, input: {key: "user:1"}}
    expect:
      - "!steps.text.result.ok && steps.text.result.error.code == 'err' && steps.text.result.error.message == 'ERR value is not an integer or out of range'"
      - "!steps.hash.result.ok && steps.hash.result.error.code == 'wrongtype'"
      - "state.redis.keys.greeting.value == 'hello'"

  # ---- expiry ----
  - id: expire-ttl-pttl
    name: TTL is -1 without expiry; EXPIRE sets it; TTL rounds to the nearest second; PTTL is exact
    fixtures: [seeded]
    steps:
      - {flow: ttl, as: none, input: {key: greeting}}
      - {flow: expire, as: e, input: {key: greeting, seconds: 10, nx: false, xx: false, gt: false, lt: false}}
      - {flow: ttl, as: t1, at_ms: 4400, input: {key: greeting}}
      - {flow: pttl, as: p1, at_ms: 4500, input: {key: greeting}}
      - {flow: expire, as: missing, input: {key: ghost, seconds: 10, nx: false, xx: false, gt: false, lt: false}}
    expect:
      - "steps.none.result.value.ttl == -1"
      - "steps.e.result.value.set == 1 && steps.missing.result.value.set == 0"
      - "steps.t1.result.value.ttl == 6"
      - "steps.p1.result.value.pttl == state.redis.keys.greeting.expires_at - (steps.p1.start_ms + 1 + 1793491200000)"

  - id: expire-flags
    name: EXPIRE NX, XX, GT and LT set the timeout only under their condition (a persistent key is infinite)
    fixtures: [seeded]
    steps:
      - {flow: expire, as: xx_persistent, input: {key: greeting, seconds: 100, nx: false, xx: true, gt: false, lt: false}}
      - {flow: expire, as: gt_persistent, input: {key: greeting, seconds: 100, nx: false, xx: false, gt: true, lt: false}}
      - {flow: expire, as: lt_persistent, input: {key: greeting, seconds: 100, nx: false, xx: false, gt: false, lt: true}}
      - {flow: expire, as: nx_volatile, input: {key: greeting, seconds: 50, nx: true, xx: false, gt: false, lt: false}}
      - {flow: expire, as: gt_shorter, input: {key: greeting, seconds: 50, nx: false, xx: false, gt: true, lt: false}}
      - {flow: expire, as: gt_longer, input: {key: greeting, seconds: 200, nx: false, xx: false, gt: true, lt: false}}
      - {flow: expire, as: clash, input: {key: greeting, seconds: 1, nx: true, xx: false, gt: true, lt: false}}
      - {flow: ttl, as: t, input: {key: greeting}}
    expect:
      - "steps.xx_persistent.result.value.set == 0 && steps.gt_persistent.result.value.set == 0"
      - "steps.lt_persistent.result.value.set == 1 && steps.nx_volatile.result.value.set == 0"
      - "steps.gt_shorter.result.value.set == 0 && steps.gt_longer.result.value.set == 1"
      - "!steps.clash.result.ok && steps.clash.result.error.code == 'err'"
      - "steps.t.result.value.ttl == 200"
      - "'expires_at' in state.redis.keys.greeting"


  - id: expire-past-deletes-and-persist
    name: PEXPIRE with a non-positive timeout deletes the key; PERSIST removes a TTL once
    fixtures: [seeded]
    steps:
      - {flow: pexpire, as: kill, input: {key: greeting, ms: 0, nx: false, xx: false, gt: false, lt: false}}
      - {flow: exists, as: ex, input: {keys: [greeting]}}
      - {flow: expire, as: e, input: {key: board, seconds: 5, nx: false, xx: false, gt: false, lt: false}}
      - {flow: persist, as: p1, input: {key: board}}
      - {flow: persist, as: p2, input: {key: board}}
      - {flow: zcard, as: later, at_ms: 10000, input: {key: board}}
    expect:
      - "steps.kill.result.value.set == 1 && steps.ex.result.value.count == 0 && !('greeting' in state.redis.keys)"
      - "steps.p1.result.value.set == 1 && steps.p2.result.value.set == 0"
      - "steps.later.result.value.count == 4"

  - id: del-exists-skip-expired
    name: DEL and EXISTS count only live keys; EXISTS counts a repeated key twice
    fixtures: [seeded]
    steps:
      - {flow: pexpire, as: e, input: {key: greeting, ms: 100, nx: false, xx: false, gt: false, lt: false}}
      - {flow: exists, as: before, input: {keys: [greeting, greeting, board, ghost]}}
      - {flow: exists, as: after, at_ms: 200, input: {keys: [greeting, board]}}
      - {flow: del, as: d, at_ms: 300, input: {keys: [greeting, board, ghost]}}
      - {flow: exists, as: left, at_ms: 400, input: {keys: [greeting, board, "user:1"]}}
    expect:
      - "steps.before.result.value.count == 3 && steps.after.result.value.count == 1"
      - "steps.d.result.value.deleted == 1"
      - "!('greeting' in state.redis.keys) && !('board' in state.redis.keys) && 'user:1' in state.redis.keys"
      - "steps.left.result.value.count == 1"


  - id: active-expire-cycle
    name: An expired key stays in memory until a command touches it or the active cycle sweeps it
    fixtures: [seeded]
    steps:
      - {flow: pexpire, as: e1, input: {key: greeting, ms: 100, nx: false, xx: false, gt: false, lt: false}}
      - {flow: pexpire, as: e2, input: {key: "user:1", ms: 5000, nx: false, xx: false, gt: false, lt: false}}
      - {flow: exists, as: x, at_ms: 1000, input: {keys: [greeting]}}
      - {flow: expire-cycle, as: sweep, at_ms: 2000}
      - {flow: hget, as: h, input: {key: "user:1", field: name}}
    expect:
      - "steps.x.result.value.count == 0"
      - "steps.sweep.result.value.deleted == ['greeting']"
      - "!('greeting' in state.redis.keys) && steps.h.result.value.value == 'Ada'"

  # ---- hashes ----
  - id: hash-fields
    name: HSET counts only added fields; HGETALL reads all; HDEL of the last field deletes the key
    fixtures: [seeded]
    steps:
      - {flow: hset, as: s1, input: {key: "user:1", fields: {name: Grace, city: Paris}}}
      - {flow: hget, as: name, input: {key: "user:1", field: name}}
      - {flow: hget, as: none, input: {key: "user:1", field: zip}}
      - {flow: hgetall, as: all, input: {key: "user:1"}}
      - {flow: hdel, as: d1, input: {key: "user:1", fields: [city, zip]}}
      - {flow: hset, as: s2, input: {key: "user:2", fields: {a: 1}}}
      - {flow: hdel, as: d2, input: {key: "user:2", fields: [a]}}
      - {flow: hgetall, as: gone, input: {key: "user:2"}}
    expect:
      - "steps.s1.result.value.added == 1 && steps.name.result.value.value == 'Grace' && steps.none.result.value.value == null"
      - "steps.all.result.value.fields == {'name': 'Grace', 'visits': '3', 'city': 'Paris'}"
      - "steps.d1.result.value.deleted == 1 && state.redis.keys['user:1'].value == {'name': 'Grace', 'visits': '3'}"
      - "steps.s2.result.value.added == 1 && steps.d2.result.value.deleted == 1"
      - "steps.gone.result.value.fields == {} && !('user:2' in state.redis.keys)"

  - id: hash-hincrby
    name: HINCRBY adds to an integer field and starts a missing one at 0; a text field is ERR
    fixtures: [seeded]
    steps:
      - {flow: hincrby, as: v, input: {key: "user:1", field: visits, increment: 2}}
      - {flow: hincrby, as: n, input: {key: "user:1", field: logins, increment: 1}}
      - {flow: hincrby, as: bad, input: {key: "user:1", field: name, increment: 1}}
      - {flow: hget, as: read, input: {key: "user:1", field: visits}}
    expect:
      - "steps.v.result.value.value == 5 && steps.n.result.value.value == 1"
