  - id: pubsub-delivery
    name: PUBLISH reaches the clients subscribed now, at most once; later subscribers and unsubscribed ones miss it
    fixtures: [clock]
    steps:
      - {flow: publish, as: early, input: {channel: inval, message: m0}}
      - {flow: subscribe, as: s1, input: {client: listener-1, channels: [inval, other]}}
      - {flow: subscribe, as: s2, input: {client: listener-2, channels: [inval]}}
      - {flow: publish, as: p1, input: {channel: inval, message: m1}}
      - {flow: unsubscribe, as: u, input: {client: listener-1, channels: [inval]}}
      - {flow: publish, as: p2, input: {channel: inval, message: m2}}
      - {flow: publish, as: p3, input: {channel: other, message: m3}}
      - {flow: publish, as: p4, input: {channel: nobody, message: m4}}
    expect:
      - "steps.early.result.value.receivers == 0 && steps.s1.result.value.subscriptions == 2"
      - "steps.p1.result.value.receivers == 2 && steps.u.result.value.subscriptions == 1"
      - "steps.p2.result.value.receivers == 1 && steps.p3.result.value.receivers == 1 && steps.p4.result.value.receivers == 0"
      - "state.listener.inbox == ['inval:m1', 'other:m3']"
      - "calls['listener.on-message'] == 3"

