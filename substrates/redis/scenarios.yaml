      - "steps.after.result.value.members == ['bob', 'dee']"


  - id: lua-compare-and-delete
    name: The lock-release script deletes the key only when the caller still owns it
    fixtures: [clock]
    steps:
      - {flow: set, as: take, input: {key: lock, value: owner-a, nx: true, xx: false, get: false, ex: 0, px: 30000, keepttl: false}}
      - flow: eval
        as: wrong_owner
        input:
          keys: [lock]
          args: [owner-b]
          script: "data[KEYS[0]] != null && data[KEYS[0]].value == ARGV[0] ? {'reply': 1, 'writes': {KEYS[0]: null}} : {'reply': 0}"
      - flow: eval
        as: owner
        input:
          keys: [lock]
          args: [owner-a]
          script: "data[KEYS[0]] != null && data[KEYS[0]].value == ARGV[0] ? {'reply': 1, 'writes': {KEYS[0]: null}} : {'reply': 0}"
      - {flow: exists, as: x, input: {keys: [lock]}}
    expect:
      - "steps.wrong_owner.result.value.reply == 0 && steps.owner.result.value.reply == 1"
      - "steps.x.result.value.count == 0 && !('lock' in state.redis.keys)"

  - id: lua-atomic-vs-read-modify-write
    name: Two overlapping GET-then-SET increments lose one; two overlapping script increments both land
    fixtures: [clock]
    steps:
      - {flow: naive-incr, as: n1, await: false, input: {key: naive}}
      - {flow: naive-incr, as: n2, at_ms: 2, await: false, input: {key: naive}}
      - {flow: script-incr, as: s1, at_ms: 100, await: false, input: {key: scripted}}
      - {flow: script-incr, as: s2, at_ms: 100, await: false, input: {key: scripted}}
      - {flow: get, as: naive, at_ms: 500, input: {key: naive}}
      - {flow: get, as: scripted, at_ms: 501, input: {key: scripted}}
    expect:
      - "steps.n1.result.value.value == 1 && steps.n2.result.value.value == 1"
      - "steps.naive.result.value.value == '1'"
      - "[steps.s1.result.value.value, steps.s2.result.value.value].exists(v, v == 2)"
      - "steps.scripted.result.value.value == '2'"
      - "state.redis.keys.naive.value == '1' && state.redis.keys.scripted.value == '2'"


  - id: lua-writes-together-with-ttl
    name: A script's writes to several keys land together, with px setting a TTL
    fixtures: [seeded]
    steps:
      - flow: eval
        as: move
        input:
          keys: [greeting, copy, "user:1"]
          script: "{'reply': 'moved', 'writes': {'copy': {'type': 'string', 'value': data['greeting'].value, 'px': 2000}, 'greeting': null, 'user:1': {'type': 'hash', 'value': merge(data['user:1'].value, {'moved': '1'})}}}"
      - {flow: ttl, as: t, input: {key: copy}}
      - {flow: get, as: gone, at_ms: 3000, input: {key: copy}}
    expect:
      - "steps.move.result.value.reply == 'moved' && !('greeting' in state.redis.keys)"
      - "steps.t.result.value.ttl == 2"
      - "state.redis.keys['user:1'].value.moved == '1' && steps.gone.result.value.value == null"

