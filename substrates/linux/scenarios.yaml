# The Linux substrate's own tests. Run with:
#   go run ./internal/devtools/check -f substrates/linux/linux.yaml -f substrates/linux/scenarios.yaml
# Imports don't bring these along (MergeImports skips flows and scenarios).
# The fixture's shell is pid 100, so its first child is pid 101, the next 102. A blocking
# syscall runs in a step with `await: false`; the step that wakes it comes later, with `at_ms`.
# app.spawn-and-wait makes fork, execve and a blocking waitpid in one call.
schema_version: 1
id: linux-scenarios

components:
  - {id: app, name: User space, kind: client, summary: "The processes' code: every step is a syscall a process makes."}

interfaces:
  - component: app
    name: spawn-and-wait
    kind: function
    summary: >-
      What a shell does for a foreground command, in one call: fork, execve in the child (exit
      127 if it fails), then a blocking waitpid for it. The program's exit is a timer scheduled by
      this same call tree, delivered while the tree is blocked in waitpid (DESIGN §17 item 3).
    latency_ms: 0
    request: {type: object, required: [pid, path], properties: {pid: {type: integer}, path: {type: string}, run_ms: {type: integer, default: 100}, exit_code: {type: integer, default: 0}}}
    response: {type: object, properties: {child: {type: integer}, status: {type: integer}}}
    behavior:
      - call: kernel.fork
        input: {pid: "= input.pid"}
        as: f
      - call: kernel.execve
        input: {pid: "= vars.f.value.child", path: "= input.path", run_ms: "= input.run_ms", exit_code: "= input.exit_code"}
        on_error:
          - call: kernel.exit
            input: {pid: "= vars.f.value.child", code: 127}
      - call: kernel.waitpid
        input: {pid: "= input.pid", child: "= vars.f.value.child"}
        as: w
      - return: {child: "= vars.f.value.child", status: "= vars.w.value.shell_status"}

fixtures:
  - id: host
    summary: >-
      init (pid 1) and a shell (pid 100, fds 0-2 on a tty), executables /bin/true and
      /usr/bin/worker, a data file /etc/motd, a 4096 MB memory limit.
    clock: {epoch: "2026-11-01T00:00:00Z"}
    state:
      kernel:
        next_pid: 101
        procs:
          "1": {pid: 1, ppid: 0, state: running, exe: /sbin/init, handlers: {}, caught: [], blocked: {on: '', obj: '', addr: '', seq: 0}, nofile: 1024, rss_mb: 10, oom_score_adj: 0, status: null}
          "100": {pid: 100, ppid: 1, state: running, exe: /bin/sh, handlers: {}, caught: [], blocked: {on: '', obj: '', addr: '', seq: 0}, nofile: 1024, rss_mb: 2, oom_score_adj: 0, status: null}
        objs:
          tty: {type: socket, state: connected, nonblock: false, rcvtimeo_ms: 0, peer: "", rbuf: "", peer_closed: false, peer_reset: false, refs: 3}
        fds:
          "100:0": {pid: 100, fd: 0, obj: tty, cloexec: false}
          "100:1": {pid: 100, fd: 1, obj: tty, cloexec: false}
          "100:2": {pid: 100, fd: 2, obj: tty, cloexec: false}
        files:
          /bin/true: {path: /bin/true, data: "", exec: true, rss_mb: 1}
          /usr/bin/worker: {path: /usr/bin/worker, data: "", exec: true}
          /etc/motd: {path: /etc/motd, data: "hello, world"}
  - id: host-with-child
    extends: [host]
    summary: "Adds pid 101, a child of the shell running /usr/bin/worker with fds 0-2."
    state:
      kernel:
        next_pid: 102
        procs:
          "101": {pid: 101, ppid: 100, state: running, exe: /usr/bin/worker, handlers: {}, caught: [], blocked: {on: '', obj: '', addr: '', seq: 0}, nofile: 1024, rss_mb: 4, oom_score_adj: 0, status: null}
        objs:
          tty: {refs: 6}
        fds:
          "101:0": {pid: 101, fd: 0, obj: tty, cloexec: false}
          "101:1": {pid: 101, fd: 1, obj: tty, cloexec: false}
          "101:2": {pid: 101, fd: 2, obj: tty, cloexec: false}
  - id: two-workers
    extends: [host-with-child]
    summary: "Adds pid 102, a second worker child of the shell (no fds)."
    state:
      kernel:
        next_pid: 103
        procs:
          "102": {pid: 102, ppid: 100, state: running, exe: /usr/bin/worker, handlers: {}, caught: [], blocked: {on: '', obj: '', addr: '', seq: 0}, nofile: 1024, rss_mb: 4, oom_score_adj: 0, status: null}

flows:
  - {id: fork, tags: [writes], entry: {caller: app, interface: kernel.fork}}
  - {id: execve, tags: [writes], entry: {caller: app, interface: kernel.execve}}
  - {id: exit, tags: [writes], entry: {caller: app, interface: kernel.exit}}
  - {id: waitpid, tags: [writes], entry: {caller: app, interface: kernel.waitpid}}
  - {id: sigaction, tags: [writes], entry: {caller: app, interface: kernel.sigaction}}
  - {id: kill, tags: [writes], entry: {caller: app, interface: kernel.kill}}
  - {id: setrlimit-nofile, tags: [writes], entry: {caller: app, interface: kernel.setrlimit-nofile}}
  - {id: open, tags: [writes], entry: {caller: app, interface: kernel.open}}
  - {id: close, tags: [writes], entry: {caller: app, interface: kernel.close}}
  - {id: read, tags: [writes], entry: {caller: app, interface: kernel.read}}
  - {id: write, tags: [writes], entry: {caller: app, interface: kernel.write}}
  - {id: socket, tags: [writes], entry: {caller: app, interface: kernel.socket}}
  - {id: listen, tags: [writes], entry: {caller: app, interface: kernel.listen}}
  - {id: connect, tags: [writes], entry: {caller: app, interface: kernel.connect}}
  - {id: accept, tags: [writes], entry: {caller: app, interface: kernel.accept}}
  - {id: epoll-create, tags: [writes], entry: {caller: app, interface: kernel.epoll-create}}
  - {id: epoll-ctl, tags: [writes], entry: {caller: app, interface: kernel.epoll-ctl}}
  - {id: epoll-wait, tags: [reads], entry: {caller: app, interface: kernel.epoll-wait}}
  - {id: atomic-store, tags: [writes], entry: {caller: app, interface: kernel.atomic-store}}
  - {id: futex-wait, tags: [reads], entry: {caller: app, interface: kernel.futex-wait}}
  - {id: futex-wake, tags: [writes], entry: {caller: app, interface: kernel.futex-wake}}
  - {id: nanosleep, tags: [reads], entry: {caller: app, interface: kernel.nanosleep}}
  - {id: mem-touch, tags: [writes], entry: {caller: app, interface: kernel.mem-touch}}
  - {id: mem-release, tags: [writes], entry: {caller: app, interface: kernel.mem-release}}
  - {id: oom-score-adj, tags: [writes], entry: {caller: app, interface: kernel.oom-score-adj}}
  - {id: proc-status, tags: [reads], entry: {caller: app, interface: kernel.proc-status}}
  - {id: spawn-and-wait, tags: [writes], entry: {caller: app, interface: app.spawn-and-wait}}

scenarios:
  # ---- processes: fork, exec, exit, wait ----
  - id: fork-exec-exit-wait
    name: The shell forks, the child execs a program that exits 3 after 50 ms, and waitpid reaps the zombie
    fixtures: [host]
    steps:
      - {flow: fork, as: f, input: {pid: 100}}
      - {flow: proc-status, as: child, input: {pid: 101}}
      - {flow: execve, as: x, input: {pid: 101, path: /bin/true, run_ms: 50, exit_code: 3}}
      - {flow: waitpid, as: w, input: {pid: 100, child: -1}}
      - {flow: proc-status, as: gone, input: {pid: 101}}
    expect:
      - "steps.f.result.value.child == 101"
      - "steps.child.result.value.ppid == 100 && steps.child.result.value.fds == [0, 1, 2]"
      - "steps.w.result.ok && steps.w.result.value.pid == 101 && steps.w.result.value.exited && steps.w.result.value.exit_code == 3"
      - "steps.w.result.value.wstatus == 768 && steps.w.result.value.shell_status == 3"
      - "steps.w.start_ms + steps.w.duration_ms >= 50"
      - "!steps.gone.result.ok && steps.gone.result.error.code == 'ESRCH'"
      - "!('101' in state.kernel.procs) && state.kernel.objs.tty.refs == 3 && state.kernel.next_pid == 102"

  - id: fork-exec-waitpid-in-one-call
    name: One call forks, execs a program that exits 4 after 300 ms, and blocks in waitpid until it does; a missing program gives 127
    fixtures: [host]
    steps:
      - {flow: spawn-and-wait, as: run, input: {pid: 100, path: /usr/bin/worker, run_ms: 300, exit_code: 4}}
      - {flow: spawn-and-wait, as: missing, input: {pid: 100, path: /usr/bin/nope}}
    expect:
      - "steps.run.result.ok && steps.run.result.value.child == 101 && steps.run.result.value.status == 4"
      - "steps.run.duration_ms >= 300 && steps.run.duration_ms <= 302"
      - "steps.missing.result.value.child == 102 && steps.missing.result.value.status == 127"
      - "!('101' in state.kernel.procs) && !('102' in state.kernel.procs) && state.kernel.procs['100'].blocked.on == ''"

  - id: blocking-waitpid-wakes-on-exit
    name: A waitpid blocked with no zombie wakes when the child calls _exit
    fixtures: [host-with-child]
    steps:
      - {flow: waitpid, as: w, await: false, input: {pid: 100, child: 101}}
      - {flow: exit, as: e, at_ms: 400, input: {pid: 101, code: 0}}
    expect:
      - "steps.w.result.ok && steps.w.result.value.pid == 101 && steps.w.result.value.exit_code == 0"
      - "steps.w.start_ms + steps.w.duration_ms == 400"
      - "!('101' in state.kernel.procs)"

  - id: zombie-until-reaped
    name: An exited child stays a zombie, holding its status, until the parent waits for it
    fixtures: [host-with-child]
    steps:
      - {flow: exit, as: e, input: {pid: 101, code: 300}}
      - {flow: proc-status, as: z, input: {pid: 101}}
      - {flow: open, as: dead, input: {pid: 101, path: /etc/motd}}
      - {flow: waitpid, as: w, input: {pid: 100}}
      - {flow: proc-status, as: gone, input: {pid: 101}}
    expect:
      - "steps.z.result.value.state == 'zombie' && steps.z.result.value.fds == [] && steps.z.result.value.status.code == 44"
      - "steps.dead.result.error.code == 'ESRCH'"
      - "steps.w.result.value.pid == 101 && steps.w.result.value.exit_code == 44"
      - "steps.gone.result.error.code == 'ESRCH'"
      - "state.kernel.objs.tty.refs == 3"

  - id: waitpid-wnohang-and-echild
    name: WNOHANG returns 0 while the child runs; waiting with no such child is ECHILD
    fixtures: [host-with-child]
    steps:
      - {flow: waitpid, as: nohang, input: {pid: 100, wnohang: true}}
      - {flow: waitpid, as: notmine, input: {pid: 100, child: 1}}
      - {flow: waitpid, as: childless, input: {pid: 101}}
    expect:
      - "steps.nohang.result.ok && steps.nohang.result.value.pid == 0"
      - "steps.notmine.result.error.code == 'ECHILD' && steps.notmine.result.error.data.errno == 10"
      - "steps.childless.result.error.code == 'ECHILD'"

  - id: sigchld-ignored-no-zombie
    name: A parent that ignores SIGCHLD never gets zombies; its children are reaped at exit and waitpid is ECHILD
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: ign, input: {pid: 100, sig: 17, action: ignore}}
      - {flow: exit, as: e, input: {pid: 101, code: 1}}
      - {flow: proc-status, as: s, input: {pid: 101}}
      - {flow: waitpid, as: w, input: {pid: 100}}
    expect:
      - "steps.ign.result.value.old == 'default'"
      - "steps.s.result.error.code == 'ESRCH'"
      - "steps.w.result.error.code == 'ECHILD'"
      - "!('101' in state.kernel.procs) && state.kernel.procs['100'].handlers['17'] == 'ignore'"

  - id: orphans-reparented-to-init
    name: When a process exits, its running child is reparented to init and its zombie child reaped by init
    fixtures: [host-with-child]
    steps:
      - {flow: fork, as: a, input: {pid: 101}}
      - {flow: fork, as: b, input: {pid: 101}}
      - {flow: exit, as: be, input: {pid: 103, code: 0}}
      - {flow: exit, as: e, input: {pid: 101, code: 0}}
      - {flow: proc-status, as: orphan, input: {pid: 102}}
      - {flow: proc-status, as: zombie, input: {pid: 103}}
    expect:
      - "steps.a.result.value.child == 102 && steps.b.result.value.child == 103"
      - "steps.orphan.result.value.ppid == 1"
      - "steps.zombie.result.error.code == 'ESRCH'"
      - "state.kernel.procs['102'].ppid == 1 && !('103' in state.kernel.procs) && state.kernel.procs['101'].state == 'zombie'"

  - id: execve-errors
    name: execve fails ENOENT for a missing file and EACCES for a non-executable one, and the image is unchanged
    fixtures: [host-with-child]
    steps:
      - {flow: execve, as: missing, input: {pid: 101, path: /usr/bin/nope}}
      - {flow: execve, as: noexec, input: {pid: 101, path: /etc/motd}}
      - {flow: proc-status, as: s, input: {pid: 101}}
    expect:
      - "steps.missing.result.error.code == 'ENOENT' && steps.missing.result.error.data.errno == 2"
      - "steps.noexec.result.error.code == 'EACCES'"
      - "steps.s.result.value.exe == '/usr/bin/worker'"

  - id: scheduled-exit-ignored-after-kill
    name: A program's scheduled exit doesn't fire after the process was killed and reaped
    fixtures: [host-with-child]
    steps:
      - {flow: execve, as: x, input: {pid: 101, path: /bin/true, run_ms: 1000, exit_code: 0}}
      - {flow: kill, as: k, at_ms: 10, input: {pid: 100, target: 101, sig: 9}}
      - {flow: waitpid, as: w, input: {pid: 100}}
    expect:
      - "steps.w.result.value.signaled && steps.w.result.value.term_sig == 9"
      - "!('101' in state.kernel.procs)"

  # ---- file descriptors ----
  - id: fds-inherited-and-cloexec
    name: fork duplicates the fd table; execve closes only the close-on-exec fds
    fixtures: [host]
    steps:
      - {flow: open, as: a, input: {pid: 100, path: /etc/motd, cloexec: true}}
      - {flow: open, as: b, input: {pid: 100, path: /etc/motd}}
      - {flow: fork, as: f, input: {pid: 100}}
      - {flow: proc-status, as: before, input: {pid: 101}}
      - {flow: execve, as: x, input: {pid: 101, path: /usr/bin/worker}}
      - {flow: proc-status, as: after, input: {pid: 101}}
      - {flow: proc-status, as: parent, input: {pid: 100}}
    expect:
      - "steps.a.result.value.fd == 3 && steps.b.result.value.fd == 4"
      - "steps.before.result.value.fds == [0, 1, 2, 3, 4]"
      - "steps.x.result.value.closed == [3]"
      - "steps.after.result.value.fds == [0, 1, 2, 4] && steps.after.result.value.exe == '/usr/bin/worker'"
      - "steps.parent.result.value.fds == [0, 1, 2, 3, 4]"
      - "state.kernel.objs[state.kernel.fds['100:3'].obj].refs == 1 && state.kernel.objs[state.kernel.fds['100:4'].obj].refs == 2"

  - id: forked-fds-share-offset
    name: Parent and child share an open file description, so a read in one advances the other's offset
    fixtures: [host]
    steps:
      - {flow: open, as: o, input: {pid: 100, path: /etc/motd}}
      - {flow: fork, as: f, input: {pid: 100}}
      - {flow: read, as: c, input: {pid: 101, fd: 3, count: 5}}
      - {flow: read, as: p, input: {pid: 100, fd: 3, count: 100}}
      - {flow: read, as: eof, input: {pid: 100, fd: 3}}
    expect:
      - "steps.c.result.value.data == 'hello'"
      - "steps.p.result.value.data == ', world' && steps.p.result.value.n == 7"
      - "steps.eof.result.value.n == 0 && steps.eof.result.value.data == ''"
      - "state.kernel.objs[state.kernel.fds['101:3'].obj].offset == 12 && state.kernel.fds['101:3'].obj == state.kernel.fds['100:3'].obj"

  - id: lowest-free-fd
    name: open returns the lowest free fd, reusing a closed one
    fixtures: [host]
    steps:
      - {flow: open, as: a, input: {pid: 100, path: /etc/motd}}
      - {flow: open, as: b, input: {pid: 100, path: /etc/motd}}
      - {flow: open, as: c, input: {pid: 100, path: /etc/motd}}
      - {flow: close, as: x, input: {pid: 100, fd: 4}}
      - {flow: open, as: d, input: {pid: 100, path: /etc/motd}}
      - {flow: socket, as: s, input: {pid: 100}}
    expect:
      - "[steps.a.result.value.fd, steps.b.result.value.fd, steps.c.result.value.fd] == [3, 4, 5]"
      - "steps.d.result.value.fd == 4 && steps.s.result.value.fd == 6"
      - "state.kernel.fds.filter(k, state.kernel.fds[k].pid == 100).map(k, state.kernel.fds[k].fd).sortBy(f, f) == [0, 1, 2, 3, 4, 5, 6]"

  - id: emfile-at-rlimit-nofile
    name: With RLIMIT_NOFILE 5, the fifth fd is the last; open, socket and epoll_create then fail EMFILE, even for a missing file
    fixtures: [host]
    steps:
      - {flow: setrlimit-nofile, as: lim, input: {pid: 100, soft: 5}}
      - {flow: open, as: a, input: {pid: 100, path: /etc/motd}}
      - {flow: socket, as: b, input: {pid: 100}}
      - {flow: open, as: full, input: {pid: 100, path: /etc/motd}}
      - {flow: open, as: missing, input: {pid: 100, path: /nope}}
      - {flow: socket, as: sfull, input: {pid: 100}}
      - {flow: epoll-create, as: efull, input: {pid: 100}}
      - {flow: close, as: c, input: {pid: 100, fd: 3}}
      - {flow: open, as: again, input: {pid: 100, path: /etc/motd}}
      - {flow: setrlimit-nofile, as: bad, input: {pid: 100, soft: -1}}
    expect:
      - "steps.a.result.value.fd == 3 && steps.b.result.value.fd == 4"
      - "steps.full.result.error.code == 'EMFILE' && steps.full.result.error.data.errno == 24"
      - "steps.missing.result.error.code == 'EMFILE'"
      - "steps.sfull.result.error.code == 'EMFILE' && steps.efull.result.error.code == 'EMFILE'"
      - "steps.again.result.value.fd == 3"
      - "steps.bad.result.error.code == 'EINVAL'"
      - "size(state.kernel.objs.filter(k, state.kernel.objs[k].refs == 0)) == 0"

  - id: ebadf-on-closed-fd
    name: close, read and write on an fd that isn't open fail EBADF; closing twice fails the second time
    fixtures: [host]
    steps:
      - {flow: open, as: o, input: {pid: 100, path: /etc/motd}}
      - {flow: close, as: c1, input: {pid: 100, fd: 3}}
      - {flow: close, as: c2, input: {pid: 100, fd: 3}}
      - {flow: read, as: r, input: {pid: 100, fd: 3}}
      - {flow: write, as: w, input: {pid: 100, fd: 42, data: x}}
    expect:
      - "steps.c1.result.ok"
      - "steps.c2.result.error.code == 'EBADF' && steps.c2.result.error.data.errno == 9"
      - "steps.r.result.error.code == 'EBADF' && steps.w.result.error.code == 'EBADF'"
      - "!('100:3' in state.kernel.fds) && size(state.kernel.objs.filter(k, state.kernel.objs[k].type == 'file')) == 0"

  - id: open-create-write-read
    name: open fails ENOENT without O_CREAT; with it the file is created, written at the offset and read back through a new fd
    fixtures: [host]
    steps:
      - {flow: open, as: missing, input: {pid: 100, path: /tmp/log}}
      - {flow: open, as: o, input: {pid: 100, path: /tmp/log, create: true}}
      - {flow: write, as: w1, input: {pid: 100, fd: 3, data: "abc"}}
      - {flow: write, as: w2, input: {pid: 100, fd: 3, data: "def"}}
      - {flow: open, as: o2, input: {pid: 100, path: /tmp/log}}
      - {flow: write, as: w3, input: {pid: 100, fd: 4, data: "X"}}
      - {flow: read, as: r, input: {pid: 100, fd: 4}}
      - {flow: open, as: t, input: {pid: 100, path: /tmp/log, truncate: true}}
    expect:
      - "steps.missing.result.error.code == 'ENOENT'"
      - "steps.w1.result.value.n == 3 && steps.w2.result.value.n == 3"
      - "steps.r.result.value.data == 'bcdef'"
      - "state.kernel.files['/tmp/log'].data == ''"

  # ---- signals ----
  - id: sigterm-default-terminates
    name: SIGTERM with the default action terminates the child; waitpid reports WIFSIGNALED with signal 15 ($? 143)
    fixtures: [host-with-child]
    steps:
      - {flow: kill, as: k, input: {pid: 100, target: 101, sig: 15}}
      - {flow: waitpid, as: w, input: {pid: 100}}
    expect:
      - "steps.k.result.value.action == 'terminate'"
      - "steps.w.result.value.signaled && !steps.w.result.value.exited && steps.w.result.value.term_sig == 15"
      - "steps.w.result.value.wstatus == 15 && steps.w.result.value.shell_status == 143"
      - "!('101' in state.kernel.procs) && state.kernel.objs.tty.refs == 3"

  - id: sigterm-handled
    name: A process with a SIGTERM handler runs it and keeps running
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 101, sig: 15, action: handle}}
      - {flow: kill, as: k, input: {pid: 100, target: 101, sig: 15}}
      - {flow: proc-status, as: s, input: {pid: 101}}
      - {flow: waitpid, as: w, input: {pid: 100, wnohang: true}}
    expect:
      - "steps.k.result.value.action == 'handle'"
      - "steps.s.result.value.state == 'running' && steps.s.result.value.caught == [15]"
      - "steps.w.result.value.pid == 0"

  - id: sigkill-cannot-be-caught
    name: SIGKILL can't be handled or ignored (EINVAL), and kills a process even with a SIGTERM handler ($? 137)
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h9, input: {pid: 101, sig: 9, action: handle}}
      - {flow: sigaction, as: i19, input: {pid: 101, sig: 19, action: ignore}}
      - {flow: sigaction, as: h15, input: {pid: 101, sig: 15, action: handle}}
      - {flow: kill, as: k, input: {pid: 100, target: 101, sig: 9}}
      - {flow: waitpid, as: w, input: {pid: 100}}
    expect:
      - "steps.h9.result.error.code == 'EINVAL' && steps.i19.result.error.code == 'EINVAL'"
      - "steps.k.result.value.action == 'terminate'"
      - "steps.w.result.value.term_sig == 9 && steps.w.result.value.shell_status == 137"
      - "!('101' in state.kernel.procs)"

  - id: ignored-and-restored-signal
    name: An ignored SIGTERM is discarded; restoring the default makes it terminate again
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: ign, input: {pid: 101, sig: 15, action: ignore}}
      - {flow: kill, as: k1, input: {pid: 100, target: 101, sig: 15}}
      - {flow: sigaction, as: dfl, input: {pid: 101, sig: 15, action: default}}
      - {flow: kill, as: k2, input: {pid: 100, target: 101, sig: 15}}
    expect:
      - "steps.k1.result.value.action == 'ignore'"
      - "steps.dfl.result.value.old == 'ignore'"
      - "steps.k2.result.value.action == 'terminate' && state.kernel.procs['101'].state == 'zombie'"

  - id: handlers-reset-by-execve
    name: execve resets handled signals to default but keeps ignored ones
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 101, sig: 15, action: handle}}
      - {flow: sigaction, as: i, input: {pid: 101, sig: 1, action: ignore}}
      - {flow: execve, as: x, input: {pid: 101, path: /bin/true}}
      - {flow: kill, as: k1, input: {pid: 100, target: 101, sig: 1}}
      - {flow: kill, as: k2, input: {pid: 100, target: 101, sig: 15}}
    expect:
      - "steps.k1.result.value.action == 'ignore'"
      - "steps.k2.result.value.action == 'terminate'"
      - "state.kernel.procs['101'].state == 'zombie' && state.kernel.procs['101'].status.signal == 15"

  - id: sigchld-to-parent
    name: A child's exit sends SIGCHLD to its parent, ignored by default and run by an installed handler
    fixtures: [two-workers]
    steps:
      - {flow: exit, as: e1, input: {pid: 101, code: 0}}
      - {flow: proc-status, as: p1, input: {pid: 100}}
      - {flow: sigaction, as: h, input: {pid: 100, sig: 17, action: handle}}
      - {flow: exit, as: e2, input: {pid: 102, code: 0}}
      - {flow: proc-status, as: p2, input: {pid: 100}}
    expect:
      - "steps.p1.result.value.state == 'running' && steps.p1.result.value.caught == []"
      - "steps.p2.result.value.caught == [17]"
      - "state.kernel.procs['101'].state == 'zombie' && state.kernel.procs['102'].state == 'zombie'"

  - id: kill-errors-and-signal-zero
    name: kill fails ESRCH for a missing pid, EINVAL for a bad signal; signal 0 only probes; a zombie accepts signals
    fixtures: [host-with-child]
    steps:
      - {flow: kill, as: none, input: {pid: 100, target: 4242, sig: 15}}
      - {flow: kill, as: bad, input: {pid: 100, target: 101, sig: 99}}
      - {flow: kill, as: probe, input: {pid: 100, target: 101, sig: 0}}
      - {flow: exit, as: e, input: {pid: 101}}
      - {flow: kill, as: zombie, input: {pid: 100, target: 101, sig: 9}}
    expect:
      - "steps.none.result.error.code == 'ESRCH' && steps.none.result.error.data.errno == 3"
      - "steps.bad.result.error.code == 'EINVAL'"
      - "steps.probe.result.value.action == 'none' && state.kernel.procs['101'].status.exited"
      - "steps.zombie.result.ok && steps.zombie.result.value.action == 'none'"

  # ---- nanosleep and EINTR ----
  - id: nanosleep-completes
    name: nanosleep sleeps the whole duration; a negative one is EINVAL
    fixtures: [host]
    steps:
      - {flow: nanosleep, as: s, input: {pid: 100, ms: 250}}
      - {flow: nanosleep, as: zero, input: {pid: 100, ms: 0}}
      - {flow: nanosleep, as: neg, input: {pid: 100, ms: -1}}
    expect:
      - "steps.s.result.value.slept_ms == 250 && steps.s.duration_ms == 250"
      - "steps.zero.result.value.slept_ms == 0"
      - "steps.neg.result.error.code == 'EINVAL'"
      - "state.kernel.procs['100'].blocked.on == ''"

  - id: nanosleep-eintr-remaining
    name: A handled SIGUSR1 at 300 ms interrupts a 1000 ms nanosleep with EINTR and 700 ms remaining
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 101, sig: 10, action: handle}}
      - {flow: nanosleep, as: s, await: false, input: {pid: 101, ms: 1000}}
      - {flow: kill, as: k, at_ms: 300, input: {pid: 100, target: 101, sig: 10}}
    expect:
      - "steps.s.result.error.code == 'EINTR' && steps.s.result.error.data.errno == 4"
      - "steps.s.result.error.data.remaining_ms == 700 && steps.s.result.error.data.sig == 10"
      - "state.kernel.procs['101'].state == 'running' && state.kernel.procs['101'].blocked.on == ''"

  - id: killed-while-sleeping
    name: SIGTERM with the default action ends a process asleep in nanosleep; the syscall never returns
    fixtures: [host-with-child]
    steps:
      - {flow: nanosleep, as: s, await: false, input: {pid: 101, ms: 5000}}
      - {flow: kill, as: k, at_ms: 100, input: {pid: 100, target: 101, sig: 15}}
      - {flow: waitpid, as: w, input: {pid: 100}}
    expect:
      - "steps.s.result.error.code == 'killed'"
      - "steps.w.result.value.term_sig == 15 && steps.w.start_ms <= 100"
      - "!('101' in state.kernel.procs)"

  - id: waitpid-eintr
    name: A handled signal interrupts a blocked waitpid with EINTR
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 100, sig: 10, action: handle}}
      - {flow: waitpid, as: w, await: false, input: {pid: 100}}
      - {flow: kill, as: k, at_ms: 50, input: {pid: 101, target: 100, sig: 10}}
    expect:
      - "steps.w.result.error.code == 'EINTR'"
      - "state.kernel.procs['100'].caught == [10] && state.kernel.procs['101'].state == 'running'"

  - id: waitpid-eintr-then-restart
    name: A waitpid interrupted by a handled signal fails EINTR at 50 ms; called again, it reaps the child when it exits at 200 ms
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 100, sig: 10, action: handle}}
      - {flow: waitpid, as: w1, await: false, input: {pid: 100, child: 101}}
      - {flow: kill, as: k, at_ms: 50, input: {pid: 101, target: 100, sig: 10}}
      - {flow: waitpid, as: w2, await: false, at_ms: 60, input: {pid: 100, child: 101}}
      - {flow: exit, as: e, at_ms: 200, input: {pid: 101, code: 9}}
    expect:
      - "steps.w1.result.error.code == 'EINTR' && steps.w1.result.error.data.sig == 10 && steps.w1.duration_ms == 50"
      - "steps.w2.result.ok && steps.w2.result.value.exit_code == 9 && steps.w2.start_ms + steps.w2.duration_ms == 200"
      - "!('101' in state.kernel.procs) && state.kernel.procs['100'].blocked.on == ''"

  - id: sigchld-handled-waitpid-reaps
    name: A parent handling SIGCHLD and blocked in waitpid reaps the exiting child instead of failing EINTR, and its handler runs
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 100, sig: 17, action: handle}}
      - {flow: waitpid, as: w, await: false, input: {pid: 100}}
      - {flow: exit, as: e, at_ms: 100, input: {pid: 101, code: 2}}
    expect:
      - "steps.w.result.ok && steps.w.result.value.pid == 101 && steps.w.result.value.exit_code == 2"
      - "state.kernel.procs['100'].caught == [17] && !('101' in state.kernel.procs)"

  - id: signal-interrupts-before-timeout
    name: A handled signal at 40 ms interrupts a futex wait with a 500 ms timeout and an epoll_wait with a 1 s timeout with EINTR, not a timeout
    fixtures: [two-workers]
    steps:
      - {flow: sigaction, as: h1, input: {pid: 101, sig: 10, action: handle}}
      - {flow: sigaction, as: h2, input: {pid: 102, sig: 12, action: handle}}
      - {flow: futex-wait, as: fw, await: false, input: {pid: 101, addr: "0x50", expected: 0, timeout_ms: 500}}
      - {flow: epoll-create, as: ep, input: {pid: 102}}
      - {flow: epoll-wait, as: ew, await: false, input: {pid: 102, epfd: 0, timeout_ms: 1000}}
      - {flow: kill, as: k1, at_ms: 40, input: {pid: 100, target: 101, sig: 10}}
      - {flow: kill, as: k2, at_ms: 40, input: {pid: 100, target: 102, sig: 12}}
    expect:
      - "steps.ep.result.value.fd == 0"
      - "steps.fw.result.error.code == 'EINTR' && steps.fw.result.error.data.sig == 10 && steps.fw.duration_ms == 40"
      - "steps.ew.result.error.code == 'EINTR' && steps.ew.result.error.data.sig == 12 && steps.ew.duration_ms == 40"
      - "state.kernel.procs['101'].blocked.on == '' && state.kernel.procs['102'].blocked.on == ''"

  - id: signals-that-do-not-interrupt
    name: A handled signal before the sleep, an ignored one, a default-ignored SIGWINCH and a signal to another process leave a 100 ms nanosleep to finish
    fixtures: [two-workers]
    steps:
      - {flow: sigaction, as: h, input: {pid: 101, sig: 10, action: handle}}
      - {flow: sigaction, as: i, input: {pid: 101, sig: 12, action: ignore}}
      - {flow: sigaction, as: o, input: {pid: 102, sig: 10, action: handle}}
      - {flow: kill, as: early, input: {pid: 100, target: 101, sig: 10}}
      - {flow: nanosleep, as: s, await: false, input: {pid: 101, ms: 100}}
      - {flow: kill, as: ign, at_ms: 20, input: {pid: 100, target: 101, sig: 12}}
      - {flow: kill, as: winch, at_ms: 30, input: {pid: 100, target: 101, sig: 28}}
      - {flow: kill, as: other, at_ms: 40, input: {pid: 100, target: 102, sig: 10}}
    expect:
      - "steps.early.result.value.action == 'handle' && steps.ign.result.value.action == 'ignore' && steps.winch.result.value.action == 'ignore'"
      - "steps.s.result.ok && steps.s.result.value.slept_ms == 100 && steps.s.duration_ms == 100"
      - "state.kernel.procs['101'].caught == [10] && state.kernel.procs['102'].caught == [10]"

  # ---- futex ----
  - id: futex-eagain-when-value-changed
    name: FUTEX_WAIT fails EAGAIN at once when the word no longer holds the expected value
    fixtures: [host]
    steps:
      - {flow: atomic-store, as: st, input: {pid: 100, addr: "0x10", value: 1}}
      - {flow: futex-wait, as: w, input: {pid: 100, addr: "0x10", expected: 0}}
    expect:
      - "steps.w.result.error.code == 'EAGAIN' && steps.w.result.error.data.value == 1 && steps.w.duration_ms == 0"
      - "state.kernel.words['0x10'] == 1 && state.kernel.procs['100'].blocked.on == ''"

  - id: futex-wait-timeout
    name: FUTEX_WAIT with a 200 ms timeout and no wake fails ETIMEDOUT at 200 ms
    fixtures: [host]
    steps:
      - {flow: futex-wait, as: w, input: {pid: 100, addr: "0x10", expected: 0, timeout_ms: 200}}
    expect:
      - "steps.w.result.error.code == 'ETIMEDOUT' && steps.w.result.error.data.errno == 110 && steps.w.duration_ms == 200"
      - "state.kernel.procs['100'].blocked.on == ''"

  - id: futex-wake-fifo-and-count
    name: FUTEX_WAKE wakes at most n waiters, oldest first, and returns the count; with none waiting it returns 0
    fixtures: [two-workers]
    steps:
      - {flow: futex-wait, as: a, await: false, input: {pid: 101, addr: "0x20", expected: 0}}
      - {flow: futex-wait, as: b, await: false, at_ms: 10, input: {pid: 102, addr: "0x20", expected: 0}}
      - {flow: atomic-store, as: unlock, at_ms: 100, input: {pid: 100, addr: "0x20", value: 1}}
      - {flow: futex-wake, as: w1, at_ms: 100, input: {pid: 100, addr: "0x20", n: 1}}
      - {flow: futex-wake, as: w2, at_ms: 200, input: {pid: 100, addr: "0x20", n: 10}}
      - {flow: futex-wake, as: w3, at_ms: 300, input: {pid: 100, addr: "0x20", n: 10}}
      - {flow: proc-status, as: after, input: {pid: 102}}
    expect:
      - "steps.after.result.value.blocked.on == ''"
      - "steps.w1.result.value.woken == 1 && steps.w1.result.value.pids == [101]"
      - "steps.a.result.ok && steps.a.result.value.waited_ms == 100"
      - "steps.w2.result.value.woken == 1 && steps.w2.result.value.pids == [102]"
      - "steps.b.result.ok && steps.b.result.value.waited_ms == 190"
      - "steps.w3.result.value.woken == 0"
      - "state.kernel.words['0x20'] == 1 && state.kernel.procs['101'].blocked.on == '' && state.kernel.procs['102'].blocked.on == ''"

  - id: futex-wait-eintr
    name: A handled signal interrupts FUTEX_WAIT with EINTR, and a later wake finds no waiter
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 101, sig: 10, action: handle}}
      - {flow: futex-wait, as: w, await: false, input: {pid: 101, addr: "0x30", expected: 0}}
      - {flow: kill, as: k, at_ms: 20, input: {pid: 100, target: 101, sig: 10}}
      - {flow: futex-wake, as: wk, at_ms: 30, input: {pid: 100, addr: "0x30"}}
    expect:
      - "steps.w.result.error.code == 'EINTR'"
      - "steps.wk.result.value.woken == 0"
      - "state.kernel.procs['101'].caught == [10] && state.kernel.procs['101'].blocked.on == ''"

  # ---- sockets ----
  - id: connect-refused
    name: connect to a port nobody listens on fails ECONNREFUSED at once
    fixtures: [host]
    steps:
      - {flow: socket, as: s, input: {pid: 100}}
      - {flow: connect, as: c, input: {pid: 100, fd: 3, port: 9}}
    expect:
      - "steps.c.result.error.code == 'ECONNREFUSED' && steps.c.result.error.data.errno == 111 && steps.c.duration_ms == 0"
      - "state.kernel.objs[state.kernel.fds['100:3'].obj].state == 'unbound'"

  - id: tcp-echo-roundtrip
    name: A server listens, a client connects before accept, data flows both ways, and the client's close is EOF
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: ls, input: {pid: 101}}
      - {flow: listen, as: l, input: {pid: 101, fd: 3, port: 8080, backlog: 4}}
      - {flow: socket, as: cs, input: {pid: 100}}
      - {flow: connect, as: c, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: accept, as: a, input: {pid: 101, fd: 3}}
      - {flow: write, as: w, input: {pid: 100, fd: 3, data: "ping"}}
      - {flow: read, as: r, input: {pid: 101, fd: 4, count: 2}}
      - {flow: read, as: r2, input: {pid: 101, fd: 4}}
      - {flow: write, as: echo, input: {pid: 101, fd: 4, data: "pong"}}
      - {flow: read, as: back, input: {pid: 100, fd: 3}}
      - {flow: close, as: cl, input: {pid: 100, fd: 3}}
      - {flow: read, as: eof, input: {pid: 101, fd: 4}}
    expect:
      - "steps.c.result.ok && steps.a.result.value.fd == 4"
      - "steps.r.result.value.data == 'pi' && steps.r2.result.value.data == 'ng'"
      - "steps.back.result.value.data == 'pong'"
      - "steps.eof.result.ok && steps.eof.result.value.n == 0"
      - "!('100:3' in state.kernel.fds) && state.kernel.objs[state.kernel.fds['101:4'].obj].peer_closed"

  - id: write-after-peer-close-epipe
    name: Writing to a socket whose peer has closed fails EPIPE, and the default SIGPIPE kills the writer
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: ls, input: {pid: 100}}
      - {flow: listen, as: l, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: socket, as: cs, input: {pid: 101}}
      - {flow: connect, as: c, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: accept, as: a, input: {pid: 100, fd: 3}}
      - {flow: close, as: cl, input: {pid: 100, fd: 4}}
      - {flow: write, as: w, input: {pid: 101, fd: 3, data: "late"}}
      - {flow: waitpid, as: wt, input: {pid: 100}}
    expect:
      - "steps.w.result.error.code == 'EPIPE' && steps.w.result.error.data.errno == 32"
      - "steps.wt.result.value.term_sig == 13"
      - "!('101' in state.kernel.procs)"

  - id: blocking-accept-wakes-on-connect
    name: A blocking accept sleeps until a client connects at 150 ms
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: ls, input: {pid: 101}}
      - {flow: listen, as: l, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: accept, as: a, await: false, input: {pid: 101, fd: 3}}
      - {flow: socket, as: cs, at_ms: 150, input: {pid: 100}}
      - {flow: connect, as: c, input: {pid: 100, fd: 3, port: 8080}}
    expect:
      - "steps.a.result.ok && steps.a.result.value.fd == 4"
      - "steps.a.start_ms + steps.a.duration_ms == 150"
      - "state.kernel.objs[state.kernel.fds['101:4'].obj].peer == state.kernel.fds['100:3'].obj"

  - id: blocking-read-wakes-on-write
    name: A blocking read sleeps until the peer writes at 80 ms
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: ls, input: {pid: 100}}
      - {flow: listen, as: l, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: socket, as: cs, input: {pid: 101}}
      - {flow: connect, as: c, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: accept, as: a, input: {pid: 100, fd: 3}}
      - {flow: read, as: r, await: false, input: {pid: 100, fd: 4}}
      - {flow: write, as: w, at_ms: 80, input: {pid: 101, fd: 3, data: "data"}}
    expect:
      - "steps.r.result.value.data == 'data' && steps.r.start_ms + steps.r.duration_ms == 80"
      - "state.kernel.objs[state.kernel.fds['100:4'].obj].rbuf == '' && state.kernel.procs['100'].blocked.on == ''"

  - id: read-eagain-nonblocking-and-rcvtimeo
    name: An empty nonblocking socket reads EAGAIN at once; a blocking one with SO_RCVTIMEO 500 ms reads EAGAIN at 500 ms
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: ls, input: {pid: 100}}
      - {flow: listen, as: l, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: socket, as: nb, input: {pid: 101, nonblock: true}}
      - {flow: connect, as: c1, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: read, as: r1, input: {pid: 101, fd: 3}}
      - {flow: socket, as: to, input: {pid: 101, rcvtimeo_ms: 500}}
      - {flow: connect, as: c2, input: {pid: 101, fd: 4, port: 8080}}
      - {flow: read, as: r2, input: {pid: 101, fd: 4}}
    expect:
      - "steps.r1.result.error.code == 'EAGAIN' && steps.r1.duration_ms == 0"
      - "steps.r2.result.error.code == 'EAGAIN' && steps.r2.result.error.data.timed_out && steps.r2.duration_ms == 500"
      - "state.kernel.objs[state.kernel.fds['101:4'].obj].rcvtimeo_ms == 500 && state.kernel.objs[state.kernel.fds['101:3'].obj].nonblock"

  - id: read-eintr
    name: A handled signal interrupts a blocking read with EINTR
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 100, sig: 10, action: handle}}
      - {flow: socket, as: ls, input: {pid: 100}}
      - {flow: listen, as: l, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: socket, as: cs, input: {pid: 101}}
      - {flow: connect, as: c, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: accept, as: a, input: {pid: 100, fd: 3}}
      - {flow: read, as: r, await: false, input: {pid: 100, fd: 4}}
      - {flow: kill, as: k, at_ms: 40, input: {pid: 101, target: 100, sig: 10}}
    expect:
      - "steps.r.result.error.code == 'EINTR' && steps.r.result.error.data.sig == 10"
      - "state.kernel.procs['100'].caught == [10]"

  - id: accept-eagain-einval-and-accept-eintr
    name: Nonblocking accept with nothing queued is EAGAIN; accept on a socket that isn't listening is EINVAL; a signal interrupts a blocking accept
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: nb, input: {pid: 100, nonblock: true}}
      - {flow: listen, as: l, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: accept, as: again, input: {pid: 100, fd: 3}}
      - {flow: socket, as: plain, input: {pid: 100}}
      - {flow: accept, as: inval, input: {pid: 100, fd: 4}}
      - {flow: read, as: rinval, input: {pid: 100, fd: 3}}
      - {flow: read, as: notconn, input: {pid: 100, fd: 4}}
      - {flow: sigaction, as: h, input: {pid: 101, sig: 10, action: handle}}
      - {flow: socket, as: bl, input: {pid: 101}}
      - {flow: listen, as: l2, input: {pid: 101, fd: 3, port: 8081}}
      - {flow: accept, as: intr, await: false, input: {pid: 101, fd: 3}}
      - {flow: kill, as: k, at_ms: 30, input: {pid: 100, target: 101, sig: 10}}
    expect:
      - "steps.again.result.error.code == 'EAGAIN'"
      - "steps.inval.result.error.code == 'EINVAL' && steps.rinval.result.error.code == 'EINVAL'"
      - "steps.notconn.result.error.code == 'ENOTCONN'"
      - "steps.intr.result.error.code == 'EINTR'"
      - "state.kernel.procs['101'].caught == [10] && state.kernel.procs['101'].blocked.on == ''"

  - id: accept-emfile-keeps-connection-queued
    name: accept with a full fd table fails EMFILE and the connection stays queued; after a close it is accepted
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: ls, input: {pid: 101}}
      - {flow: listen, as: l, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: setrlimit-nofile, as: lim, input: {pid: 101, soft: 4}}
      - {flow: socket, as: cs, input: {pid: 100}}
      - {flow: connect, as: c, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: accept, as: full, input: {pid: 101, fd: 3}}
      - {flow: close, as: cl, input: {pid: 101, fd: 2}}
      - {flow: accept, as: ok, input: {pid: 101, fd: 3}}
    expect:
      - "steps.full.result.error.code == 'EMFILE'"
      - "steps.ok.result.value.fd == 2"
      - "state.kernel.fds['101:2'].obj != 'tty' && size(state.kernel.objs[state.kernel.fds['101:3'].obj].queue) == 0"

  - id: backlog-full-connect-timeout
    name: With the accept queue full, a connect's SYNs are dropped and it fails ETIMEDOUT after the SYN retries
    fixtures: [host-with-child]
    config: {linux-tcp-syn-timeout-ms: 3000}
    steps:
      - {flow: socket, as: ls, input: {pid: 101}}
      - {flow: listen, as: l, input: {pid: 101, fd: 3, port: 8080, backlog: 1}}
      - {flow: socket, as: c1s, input: {pid: 100}}
      - {flow: connect, as: c1, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: socket, as: c2s, input: {pid: 100}}
      - {flow: connect, as: c2, input: {pid: 100, fd: 4, port: 8080}}
    expect:
      - "steps.c1.result.ok"
      - "steps.c2.result.error.code == 'ETIMEDOUT' && steps.c2.result.error.data.errno == 110 && steps.c2.duration_ms == 3000"
      - "size(state.kernel.objs[state.kernel.fds['101:3'].obj].queue) == 1 && state.kernel.objs[state.kernel.fds['100:4'].obj].state == 'unbound'"

  - id: listener-close-resets-queued
    name: Closing a listener resets the connections it never accepted; the client reads ECONNRESET
    fixtures: [host-with-child]
    steps:
      - {flow: socket, as: ls, input: {pid: 101}}
      - {flow: listen, as: l, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: socket, as: cs, input: {pid: 100}}
      - {flow: connect, as: c, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: close, as: cl, input: {pid: 101, fd: 3}}
      - {flow: read, as: r, input: {pid: 100, fd: 3}}
      - {flow: socket, as: again, input: {pid: 100}}
      - {flow: connect, as: refused, input: {pid: 100, fd: 4, port: 8080}}
    expect:
      - "steps.r.result.error.code == 'ECONNRESET' && steps.r.result.error.data.errno == 104"
      - "steps.refused.result.error.code == 'ECONNREFUSED'"
      - "!('101:3' in state.kernel.fds) && state.kernel.objs[state.kernel.fds['100:3'].obj].peer_reset"

  - id: listen-and-connect-errors
    name: A second listener on a port is EADDRINUSE; connecting a connected socket is EISCONN; connecting a listener is EINVAL
    fixtures: [host]
    steps:
      - {flow: socket, as: a, input: {pid: 100}}
      - {flow: listen, as: la, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: socket, as: b, input: {pid: 100}}
      - {flow: listen, as: lb, input: {pid: 100, fd: 4, port: 8080}}
      - {flow: connect, as: c, input: {pid: 100, fd: 4, port: 8080}}
      - {flow: connect, as: again, input: {pid: 100, fd: 4, port: 8080}}
      - {flow: connect, as: onlistener, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: listen, as: lconn, input: {pid: 100, fd: 4, port: 9090}}
    expect:
      - "steps.lb.result.error.code == 'EADDRINUSE' && steps.lb.result.error.data.errno == 98"
      - "steps.c.result.ok && steps.again.result.error.code == 'EISCONN'"
      - "steps.onlistener.result.error.code == 'EINVAL' && steps.lconn.result.error.code == 'EINVAL'"
      - "state.kernel.objs[state.kernel.fds['100:3'].obj].port == 8080 && size(state.kernel.objs[state.kernel.fds['100:3'].obj].queue) == 1"

  # ---- epoll ----
  - id: epoll-ctl-errors
    name: epoll_ctl refuses a regular file (EPERM), a double add (EEXIST), deleting an unregistered fd (ENOENT) and a non-epoll epfd (EINVAL)
    fixtures: [host]
    steps:
      - {flow: epoll-create, as: ep, input: {pid: 100}}
      - {flow: open, as: f, input: {pid: 100, path: /etc/motd}}
      - {flow: socket, as: s, input: {pid: 100}}
      - {flow: epoll-ctl, as: file, input: {pid: 100, epfd: 3, op: add, fd: 4}}
      - {flow: epoll-ctl, as: add, input: {pid: 100, epfd: 3, op: add, fd: 5}}
      - {flow: epoll-ctl, as: twice, input: {pid: 100, epfd: 3, op: add, fd: 5}}
      - {flow: epoll-ctl, as: del, input: {pid: 100, epfd: 3, op: del, fd: 5}}
      - {flow: epoll-ctl, as: del2, input: {pid: 100, epfd: 3, op: del, fd: 5}}
      - {flow: epoll-ctl, as: notep, input: {pid: 100, epfd: 5, op: add, fd: 3}}
      - {flow: epoll-ctl, as: self, input: {pid: 100, epfd: 3, op: add, fd: 3}}
      - {flow: epoll-ctl, as: badfd, input: {pid: 100, epfd: 3, op: add, fd: 77}}
    expect:
      - "steps.ep.result.value.fd == 3"
      - "steps.file.result.error.code == 'EPERM' && steps.file.result.error.data.errno == 1"
      - "steps.add.result.ok && steps.twice.result.error.code == 'EEXIST'"
      - "steps.del.result.ok && steps.del2.result.error.code == 'ENOENT'"
      - "steps.notep.result.error.code == 'EINVAL' && steps.self.result.error.code == 'EINVAL'"
      - "steps.badfd.result.error.code == 'EBADF'"
      - "size(state.kernel.objs[state.kernel.fds['100:3'].obj].interest) == 0"

  - id: epoll-wait-timeouts
    name: epoll_wait with nothing ready returns [] at once for timeout 0 and after 200 ms for timeout 200; max 0 is EINVAL
    fixtures: [host]
    steps:
      - {flow: epoll-create, as: ep, input: {pid: 100}}
      - {flow: socket, as: s, input: {pid: 100}}
      - {flow: listen, as: l, input: {pid: 100, fd: 4, port: 8080}}
      - {flow: epoll-ctl, as: add, input: {pid: 100, epfd: 3, op: add, fd: 4}}
      - {flow: epoll-wait, as: poll, input: {pid: 100, epfd: 3, timeout_ms: 0}}
      - {flow: epoll-wait, as: timed, input: {pid: 100, epfd: 3, timeout_ms: 200}}
      - {flow: epoll-wait, as: inval, input: {pid: 100, epfd: 3, max: 0}}
      - {flow: epoll-wait, as: notep, input: {pid: 100, epfd: 4, timeout_ms: 0}}
    expect:
      - "steps.poll.result.value.events == [] && steps.poll.duration_ms == 0"
      - "steps.timed.result.value.events == [] && steps.timed.duration_ms == 200"
      - "steps.inval.result.error.code == 'EINVAL' && steps.notep.result.error.code == 'EINVAL'"
      - "state.kernel.procs['100'].blocked.on == ''"

  - id: epoll-event-loop
    name: A blocked epoll_wait wakes on a connection, then on data; readiness is level-triggered and shows rdhup after the peer closes
    fixtures: [host-with-child]
    steps:
      - {flow: epoll-create, as: ep, input: {pid: 101}}
      - {flow: socket, as: ls, input: {pid: 101}}
      - {flow: listen, as: l, input: {pid: 101, fd: 4, port: 8080}}
      - {flow: epoll-ctl, as: addl, input: {pid: 101, epfd: 3, op: add, fd: 4}}
      - {flow: epoll-wait, as: w1, await: false, input: {pid: 101, epfd: 3, timeout_ms: -1}}
      - {flow: socket, as: cs, at_ms: 50, input: {pid: 100}}
      - {flow: connect, as: c, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: epoll-wait, as: again, at_ms: 60, input: {pid: 101, epfd: 3, timeout_ms: 0}}
      - {flow: accept, as: a, input: {pid: 101, fd: 4}}
      - {flow: epoll-ctl, as: addc, input: {pid: 101, epfd: 3, op: add, fd: 5}}
      - {flow: epoll-wait, as: w2, await: false, input: {pid: 101, epfd: 3, timeout_ms: 1000}}
      - {flow: write, as: w, at_ms: 120, input: {pid: 100, fd: 3, data: "req"}}
      - {flow: close, as: cl, at_ms: 130, input: {pid: 100, fd: 3}}
      - {flow: epoll-wait, as: w3, at_ms: 140, input: {pid: 101, epfd: 3, timeout_ms: 0}}
    expect:
      - "steps.w1.result.value.events == [{'fd': 4, 'events': ['in']}] && steps.w1.start_ms + steps.w1.duration_ms == 50"
      - "steps.again.result.value.events == [{'fd': 4, 'events': ['in']}]"
      - "steps.w2.result.value.events == [{'fd': 5, 'events': ['in']}] && steps.w2.start_ms + steps.w2.duration_ms == 120"
      - "steps.w3.result.value.events == [{'fd': 5, 'events': ['in', 'rdhup']}]"
      - "state.kernel.objs[state.kernel.fds['101:3'].obj].interest.size() == 2 && state.kernel.objs[state.kernel.fds['101:5'].obj].peer_closed && state.kernel.objs[state.kernel.fds['101:5'].obj].rbuf == 'req'"

  - id: epoll-close-removes-and-eintr
    name: Closing a registered fd removes it from the interest list; a handled signal interrupts epoll_wait with EINTR
    fixtures: [host-with-child]
    steps:
      - {flow: sigaction, as: h, input: {pid: 101, sig: 10, action: handle}}
      - {flow: epoll-create, as: ep, input: {pid: 101}}
      - {flow: socket, as: s, input: {pid: 101}}
      - {flow: epoll-ctl, as: add, input: {pid: 101, epfd: 3, op: add, fd: 4}}
      - {flow: close, as: cl, input: {pid: 101, fd: 4}}
      - {flow: epoll-wait, as: w, await: false, input: {pid: 101, epfd: 3, timeout_ms: -1}}
      - {flow: kill, as: k, at_ms: 25, input: {pid: 100, target: 101, sig: 10}}
    expect:
      - "steps.w.result.error.code == 'EINTR'"
      - "state.kernel.objs.filter(k, state.kernel.objs[k].type == 'epoll').all(k, size(state.kernel.objs[k].interest) == 0)"

  # ---- memory and the OOM killer ----
  - id: oom-kills-largest
    name: Past the memory limit the OOM killer SIGKILLs the process with the most resident memory, and its parent sees signal 9
    fixtures: [two-workers]
    config: {linux-memory-limit-mb: 1000}
    steps:
      - {flow: mem-touch, as: big, input: {pid: 101, mb: 600}}
      - {flow: mem-touch, as: small, input: {pid: 102, mb: 300}}
      - {flow: proc-status, as: before, input: {pid: 101}}
      - {flow: mem-touch, as: grow, input: {pid: 102, mb: 100}}
      - {flow: waitpid, as: w, input: {pid: 100}}
    expect:
      - "steps.before.result.value.rss_mb == 604"
      - "steps.grow.result.ok && steps.grow.result.value.oom_killed == [101] && steps.grow.result.value.rss_mb == 404"
      - "steps.w.result.value.pid == 101 && steps.w.result.value.term_sig == 9 && steps.w.result.value.shell_status == 137"
      - "size(state.kernel.oom_kills) == 1 && state.kernel.oom_kills[0].pid == 101 && state.kernel.oom_kills[0].rss_mb == 604"

  - id: oom-kills-the-caller
    name: When the faulting process is the biggest, the OOM killer kills it and its fault never returns
    fixtures: [two-workers]
    config: {linux-memory-limit-mb: 1000}
    steps:
      - {flow: mem-touch, as: hog, input: {pid: 102, mb: 1200}}
      - {flow: proc-status, as: s, input: {pid: 102}}
    expect:
      - "steps.hog.result.error.code == 'killed' && steps.hog.result.error.data.oom_killed == [102]"
      - "steps.s.result.value.state == 'zombie' && steps.s.result.value.status.signal == 9"
      - "state.kernel.procs['101'].state == 'running'"

  - id: oom-score-adj-protects-and-targets
    name: oom_score_adj -1000 exempts a process and a positive adj makes a smaller one the victim; out of range is EINVAL
    fixtures: [two-workers]
    config: {linux-memory-limit-mb: 1250}
    steps:
      - {flow: oom-score-adj, as: protect, input: {pid: 101, adj: -1000}}
      - {flow: oom-score-adj, as: target, input: {pid: 102, adj: 900}}
      - {flow: oom-score-adj, as: bad, input: {pid: 102, adj: 2000}}
      - {flow: mem-touch, as: big, input: {pid: 101, mb: 800}}
      - {flow: mem-touch, as: mid, input: {pid: 102, mb: 100}}
      - {flow: mem-touch, as: grow, input: {pid: 100, mb: 400}}
    expect:
      - "steps.bad.result.error.code == 'EINVAL'"
      - "steps.grow.result.value.oom_killed == [102]"
      - "state.kernel.procs['101'].state == 'running' && state.kernel.procs['102'].state == 'zombie'"

  - id: oom-enomem-when-nothing-killable
    name: When every process is exempt the fault fails ENOMEM instead
    fixtures: [host]
    config: {linux-memory-limit-mb: 100}
    steps:
      - {flow: oom-score-adj, as: p, input: {pid: 100, adj: -1000}}
      - {flow: mem-touch, as: t, input: {pid: 100, mb: 200}}
    expect:
      - "steps.t.result.error.code == 'ENOMEM' && steps.t.result.error.data.errno == 12"
      - "state.kernel.procs['100'].rss_mb == 202 && state.kernel.oom_kills == []"

  - id: mem-release-avoids-oom
    name: Memory released with munmap no longer counts, so a later fault fits under the limit
    fixtures: [two-workers]
    config: {linux-memory-limit-mb: 1000}
    steps:
      - {flow: mem-touch, as: a, input: {pid: 101, mb: 700}}
      - {flow: mem-release, as: r, input: {pid: 101, mb: 500}}
      - {flow: mem-touch, as: b, input: {pid: 102, mb: 600}}
    expect:
      - "steps.r.result.value.rss_mb == 204"
      - "steps.b.result.value.oom_killed == [] && state.kernel.oom_kills == []"

  - id: blocked-syscalls-killed
    name: SIGKILL ends processes blocked in read, epoll_wait and futex wait (none of the calls returns); a woken accept had returned
    fixtures: [two-workers]
    steps:
      - {flow: socket, as: ls, input: {pid: 101}}
      - {flow: listen, as: l, input: {pid: 101, fd: 3, port: 8080}}
      - {flow: accept, as: acc, await: false, input: {pid: 101, fd: 3}}
      - {flow: socket, as: cs, input: {pid: 102}}
      - {flow: connect, as: c, input: {pid: 102, fd: 0, port: 8080}}
      - {flow: read, as: rd, await: false, at_ms: 10, input: {pid: 102, fd: 0}}
      - {flow: fork, as: f, at_ms: 20, input: {pid: 100}}
      - {flow: epoll-create, as: ep, input: {pid: 103}}
      - {flow: epoll-wait, as: ew, await: false, input: {pid: 103, epfd: 3, timeout_ms: -1}}
      - {flow: fork, as: f2, at_ms: 30, input: {pid: 100}}
      - {flow: futex-wait, as: fw, await: false, input: {pid: 104, addr: "0x40", expected: 0}}
      - {flow: kill, as: k2, at_ms: 100, input: {pid: 100, target: 102, sig: 9}}
      - {flow: kill, as: k3, at_ms: 100, input: {pid: 100, target: 103, sig: 9}}
      - {flow: kill, as: k4, at_ms: 100, input: {pid: 100, target: 104, sig: 9}}
      - {flow: kill, as: k1, at_ms: 105, input: {pid: 100, target: 101, sig: 9}}
      - {flow: futex-wake, as: wk, at_ms: 110, input: {pid: 100, addr: "0x40"}}
    expect:
      - "steps.acc.result.ok && steps.c.result.ok"
      - "steps.rd.result.error.code == 'killed' && steps.ew.result.error.code == 'killed' && steps.fw.result.error.code == 'killed'"
      - "steps.wk.result.value.woken == 0"
      - "['101', '102', '103', '104'].all(p, state.kernel.procs[p].state == 'zombie' && state.kernel.procs[p].status.signal == 9)"

  - id: re-exec-cancels-scheduled-exit
    name: A second execve replaces the program, so the first program's scheduled exit never fires
    fixtures: [host-with-child]
    steps:
      - {flow: execve, as: x1, input: {pid: 101, path: /bin/true, run_ms: 100, exit_code: 1}}
      - {flow: execve, as: x2, at_ms: 50, input: {pid: 101, path: /usr/bin/worker, run_ms: 500, exit_code: 7}}
      - {flow: waitpid, as: w, input: {pid: 100}}
    expect:
      - "steps.w.result.value.exit_code == 7 && steps.w.start_ms + steps.w.duration_ms >= 551"
      - "!('101' in state.kernel.procs)"

  - id: write-einval-and-enotconn
    name: write on a listener is EINVAL and on an unconnected socket ENOTCONN
    fixtures: [host]
    steps:
      - {flow: socket, as: a, input: {pid: 100}}
      - {flow: listen, as: l, input: {pid: 100, fd: 3, port: 8080}}
      - {flow: write, as: wl, input: {pid: 100, fd: 3, data: x}}
      - {flow: socket, as: b, input: {pid: 100}}
      - {flow: write, as: wu, input: {pid: 100, fd: 4, data: x}}
    expect:
      - "steps.wl.result.error.code == 'EINVAL' && steps.wu.result.error.code == 'ENOTCONN'"
      - "state.kernel.objs[state.kernel.fds['100:4'].obj].state == 'unbound'"
