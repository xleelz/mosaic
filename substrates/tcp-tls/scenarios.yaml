# The TCP/TLS substrate's own tests. Run with:
#   go run ./internal/devtools/check -f substrates/tcp-tls/tcp-tls.yaml -f substrates/tcp-tls/scenarios.yaml
# Imports don't bring these along (MergeImports skips flows and scenarios).
# Timeline with the default RTT of 10 ms: connect returns at 10, the server end is acceptable at
# 15 (the ACK's half RTT), and a segment sent at t arrives at t + 5.
schema_version: 1
id: tcp-tls-scenarios

components:
  - {id: app, name: Application, kind: client, summary: "The processes calling the socket API on either end; the scenarios' entry point."}
  - {id: reader, name: Reader, kind: service, summary: "An application that reads a bulk transfer as a stream, spending process_ms on each segment."}

interfaces:
  - component: reader
    name: read-all
    kind: function
    summary: "Read a bulk transfer through a streaming call whose window is the receive buffer in segments and whose stall_ms is the sender's SO_SNDTIMEO."
    latency_ms: 0
    request:
      type: object
      required: [segments]
      properties:
        segments: {type: integer, examples: [8]}
        window: {type: integer, default: 4}
        stall_ms: {type: integer, default: 200}
        process_ms: {type: integer, default: 0}
    response: {type: object, properties: {segments: {type: integer}, read: {type: integer}}}
    errors: [{code: stream_stalled, reachable_by: "the streaming call's window and stall_ms: the engine fails a producer blocked longer than stall_ms (DESIGN §16.4)"}]
    behavior:
      - set: {vars.read: 0}
      - call: tcp-stack.bulk-send
        input: {segments: "= input.segments", segment_bytes: 1000}
        stream: true
        window: "= input.window"
        stall_ms: "= input.stall_ms"
        as: t
        on_item:
          - {wait: "= input.process_ms"}
          - {set: {vars.read: "= vars.read + 1"}}
      - return: {segments: "= vars.t.value.segments", read: "= vars.read"}

fixtures:
  - id: lan
    summary: >-
      Listeners on 10.0.0.2: port 80 (plain), 443 (TLS, a valid certificate for api.example.test),
      7000 (1000-byte buffers, for flow control) and 8081 (5 s idle timeout). TLS listeners with an
      expired certificate (10.0.0.3:443), an untrusted issuer (10.0.0.4:443) and a wildcard
      certificate (10.0.0.5:443). 10.0.0.9 drops packets; 10.0.0.8 is unreachable.
    clock: {epoch: "2026-11-01T00:00:00Z"}
    state:
      tcp-stack:
        hosts:
          10.0.0.9: {status: blackhole}
          10.0.0.8: {status: unreachable}
        listeners:
          "10.0.0.2:80": {addr: "10.0.0.2:80", backlog: 128, queue: [], cert: null, idle_timeout_ms: 0, rcvbuf: 131072, sndbuf: 16384, waiting: false}
          "10.0.0.2:443":
            addr: "10.0.0.2:443"
            backlog: 128
            queue: []
            cert: {subject: api.example.test, sans: [api.example.test], issuer: "Example Root CA", not_before: "2026-01-01T00:00:00Z", not_after: "2027-01-01T00:00:00Z"}
            idle_timeout_ms: 0
            rcvbuf: 131072
            sndbuf: 16384
            waiting: false
          "10.0.0.2:7000": {addr: "10.0.0.2:7000", backlog: 128, queue: [], cert: null, idle_timeout_ms: 0, rcvbuf: 1000, sndbuf: 1000, waiting: false}
          "10.0.0.2:8081": {addr: "10.0.0.2:8081", backlog: 128, queue: [], cert: null, idle_timeout_ms: 5000, rcvbuf: 131072, sndbuf: 16384, waiting: false}
          "10.0.0.3:443":
            addr: "10.0.0.3:443"
            backlog: 128
            queue: []
            cert: {subject: old.example.test, sans: [old.example.test], issuer: "Example Root CA", not_before: "2025-01-01T00:00:00Z", not_after: "2026-06-01T00:00:00Z"}
            idle_timeout_ms: 0
            rcvbuf: 131072
            sndbuf: 16384
            waiting: false
          "10.0.0.4:443":
            addr: "10.0.0.4:443"
            backlog: 128
            queue: []
            cert: {subject: api.example.test, sans: [api.example.test], issuer: "Rogue CA", not_before: "2026-01-01T00:00:00Z", not_after: "2027-01-01T00:00:00Z"}
            idle_timeout_ms: 0
            rcvbuf: 131072
            sndbuf: 16384
            waiting: false
          "10.0.0.5:443":
            addr: "10.0.0.5:443"
            backlog: 128
            queue: []
            cert: {subject: "*.example.test", sans: ["*.example.test"], issuer: "Example Root CA", not_before: "2026-01-01T00:00:00Z", not_after: "2027-01-01T00:00:00Z"}
            idle_timeout_ms: 0
            rcvbuf: 131072
            sndbuf: 16384
            waiting: false

flows:
  - {id: listen, tags: [writes], entry: {caller: app, interface: tcp-stack.listen}}
  - {id: close-listener, tags: [writes], entry: {caller: app, interface: tcp-stack.close-listener}}
  - {id: connect, tags: [writes], entry: {caller: app, interface: tcp-stack.connect}}
  - {id: accept, tags: [writes], entry: {caller: app, interface: tcp-stack.accept}}
  - {id: send, tags: [writes], entry: {caller: app, interface: tcp-stack.send}}
  - {id: recv, tags: [writes], entry: {caller: app, interface: tcp-stack.recv}}
  - {id: shutdown, tags: [writes], entry: {caller: app, interface: tcp-stack.shutdown}}
  - {id: close, tags: [writes], entry: {caller: app, interface: tcp-stack.close}}
  - {id: host-crash, tags: [writes], entry: {caller: app, interface: tcp-stack.host-crash}}
  - {id: get-sock, tags: [reads], entry: {caller: app, interface: tcp-stack.get-sock}}
  - {id: tls-handshake, tags: [writes], entry: {caller: app, interface: tls.handshake}}
  - {id: tls-write, tags: [writes], entry: {caller: app, interface: tls.write}}
  - {id: tls-read, tags: [writes], entry: {caller: app, interface: tls.read}}
  - {id: tls-close, tags: [writes], entry: {caller: app, interface: tls.close}}
  - {id: tls-accept-handshake, tags: [writes], entry: {caller: app, interface: tls.accept-handshake}}
  - {id: read-all, tags: [reads], entry: {caller: app, interface: reader.read-all}}

scenarios:
  # ---- establishment ----
  - id: three-way-handshake
    name: connect returns ESTABLISHED after one RTT; the server end is acceptable half an RTT later
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: get-sock, as: cs, input: {sock: "= steps.c.result.value.sock"}}
    expect:
      - "steps.c.result.ok && steps.c.duration_ms == 10 && steps.c.result.value.syn_sent == 1"
      - "steps.a.result.ok && steps.a.start_ms == 10 && steps.a.duration_ms == 5"
      - "steps.a.result.value.remote == steps.c.result.value.local && steps.cs.result.value.peer == steps.a.result.value.sock"
      - "steps.cs.result.value.tcp_state == 'ESTABLISHED' && state['tcp-stack'].socks[steps.a.result.value.sock].role == 'server'"

  - id: accept-blocks-until-handshake
    name: A blocking accept waits for the next connection and returns when its ACK arrives
    fixtures: [lan]
    steps:
      - {flow: accept, as: a, await: false, input: {addr: "10.0.0.2:80"}}
      - {flow: connect, as: c, at_ms: 100, input: {addr: "10.0.0.2:80"}}
    expect:
      - "steps.a.result.ok && steps.a.start_ms + steps.a.duration_ms == 115"
      - "steps.c.result.ok && steps.c.duration_ms == 10"
      - "size(state['tcp-stack'].listeners['10.0.0.2:80'].queue) == 0"

  - id: accept-eagain-and-einval
    name: An empty accept queue is EAGAIN (non-blocking, or after SO_RCVTIMEO); a non-listening address is EINVAL
    fixtures: [lan]
    steps:
      - {flow: accept, as: nb, input: {addr: "10.0.0.2:80", nonblocking: true}}
      - {flow: accept, as: to, input: {addr: "10.0.0.2:80", timeout_ms: 500}}
      - {flow: accept, as: inval, input: {addr: "10.0.0.2:81"}}
    expect:
      - "!steps.nb.result.ok && steps.nb.result.error.code == 'EAGAIN' && steps.nb.duration_ms == 0"
      - "!steps.to.result.ok && steps.to.result.error.code == 'EAGAIN' && steps.to.duration_ms == 500"
      - "steps.inval.result.error.code == 'EINVAL'"
      - "!state['tcp-stack'].listeners['10.0.0.2:80'].waiting"

  - id: listen-in-use-and-backlog-cap
    name: Binding a port in use is EADDRINUSE; a backlog above somaxconn is capped
    fixtures: [lan]
    steps:
      - {flow: listen, as: dup, input: {addr: "10.0.0.2:80"}}
      - {flow: listen, as: big, input: {addr: "10.0.0.2:8080", backlog: 100000}}
      - {flow: connect, as: c, input: {addr: "10.0.0.2:8080"}}
    expect:
      - "!steps.dup.result.ok && steps.dup.result.error.code == 'EADDRINUSE'"
      - "steps.big.result.value.backlog == 4096 && state['tcp-stack'].listeners['10.0.0.2:8080'].backlog == 4096"
      - "steps.c.result.ok"

  - id: connection-refused
    name: A SYN to a port with no listener is answered with RST; connect fails ECONNREFUSED after one RTT
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:81"}}
    expect:
      - "!steps.c.result.ok && steps.c.result.error.code == 'ECONNREFUSED' && steps.c.duration_ms == 10"
      - "size(state['tcp-stack'].socks) == 0"

  - id: connect-timeout-syn-retries
    name: Against a blackholed host the SYN is retransmitted 6 times (1, 2, 4 ... 64 s) and connect fails ETIMEDOUT at 127 s
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.9:80"}}
    expect:
      - "!steps.c.result.ok && steps.c.result.error.code == 'ETIMEDOUT'"
      - "steps.c.duration_ms == 127000 && steps.c.result.error.data.syn_sent == 7"

  - id: connect-timeout-dialer
    name: A caller's 3 s connect timeout ends the handshake after the second SYN
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.9:80", timeout_ms: 3000}}
    expect:
      - "steps.c.result.error.code == 'ETIMEDOUT' && steps.c.duration_ms == 3000 && steps.c.result.error.data.syn_sent == 2"

  - id: host-unreachable
    name: An unreachable host fails EHOSTUNREACH
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.8:80"}}
    expect:
      - "steps.c.result.error.code == 'EHOSTUNREACH' && steps.c.duration_ms == 10"

  - id: backlog-full-drops-syn
    name: With the accept queue full the SYN is dropped; the retransmission 1 s later gets in once accept made room
    fixtures: [lan]
    steps:
      - {flow: listen, as: l, input: {addr: "10.0.0.2:9000", backlog: 1}}
      - {flow: connect, as: c1, input: {addr: "10.0.0.2:9000"}}
      - {flow: connect, as: c2, at_ms: 20, await: false, input: {addr: "10.0.0.2:9000"}}
      - {flow: accept, as: a1, at_ms: 500, input: {addr: "10.0.0.2:9000"}}
      - {flow: accept, as: a2, at_ms: 2000, input: {addr: "10.0.0.2:9000"}}
    expect:
      - "steps.c1.result.ok && steps.c1.result.value.syn_sent == 1"
      - "steps.c2.result.ok && steps.c2.result.value.syn_sent == 2 && steps.c2.duration_ms == 1010"
      - "steps.a1.result.value.remote == steps.c1.result.value.local && steps.a2.result.value.remote == steps.c2.result.value.local"
      - "size(state['tcp-stack'].listeners['10.0.0.2:9000'].queue) == 0 && state['tcp-stack'].socks[steps.a2.result.value.sock].accepted"

  # ---- data transfer ----
  - id: data-arrives-half-rtt-later
    name: A blocked recv returns the data RTT/2 after the peer sent it
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: recv, as: r, await: false, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: send, as: s, at_ms: 100, input: {sock: "= steps.c.result.value.sock", data: hello}}
    expect:
      - "steps.s.result.value.written == 5"
      - "steps.r.result.ok && steps.r.result.value.data == 'hello' && steps.r.result.value.bytes == 5 && !steps.r.result.value.eof"
      - "steps.r.start_ms == 15 && steps.r.start_ms + steps.r.duration_ms == 105"
      - "state['tcp-stack'].socks[steps.a.result.value.sock].bytes_received == 5"

  - id: partial-reads
    name: recv returns at most max bytes; the rest stays buffered for the next read
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: send, as: s, input: {sock: "= steps.c.result.value.sock", data: "hello world"}}
      - {flow: recv, as: r1, input: {sock: "= steps.a.result.value.sock", max: 5}}
      - {flow: recv, as: r2, input: {sock: "= steps.a.result.value.sock"}}
    expect:
      - "steps.r1.result.value.data == 'hello' && steps.r1.duration_ms == 5"
      - "steps.r2.result.value.data == ' world' && steps.r2.duration_ms == 0"
      - "size(state['tcp-stack'].socks[steps.a.result.value.sock].rx) == 0 && state['tcp-stack'].socks[steps.a.result.value.sock].bytes_received == 11"

  - id: read-timeout-and-eagain
    name: With nothing to read, a non-blocking recv is EAGAIN and a blocking one fails EAGAIN at SO_RCVTIMEO
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: recv, as: nb, input: {sock: "= steps.c.result.value.sock", nonblocking: true}}
      - {flow: recv, as: to, input: {sock: "= steps.c.result.value.sock", timeout_ms: 1000}}
    expect:
      - "steps.nb.result.error.code == 'EAGAIN' && steps.nb.duration_ms == 0"
      - "steps.to.result.error.code == 'EAGAIN' && steps.to.duration_ms == 1000"
      - "!state['tcp-stack'].socks[steps.c.result.value.sock].rx_waiting"

  - id: flow-control-window-and-send-buffer
    name: Writes beyond the peer's window fill the send buffer, then fail EAGAIN; a read opens the window
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:7000", sndbuf: 1000}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:7000"}}
      - {flow: send, as: w1, input: {sock: "= steps.c.result.value.sock", size: 3000, nonblocking: true}}
      - {flow: send, as: w2, input: {sock: "= steps.c.result.value.sock", size: 10, nonblocking: true}}
      - {flow: recv, as: r, input: {sock: "= steps.a.result.value.sock", max: 500}}
      - {flow: send, as: w3, input: {sock: "= steps.c.result.value.sock", size: 600, nonblocking: true}}
      - {flow: get-sock, as: cs, input: {sock: "= steps.c.result.value.sock"}}
      - {flow: get-sock, as: ss, input: {sock: "= steps.a.result.value.sock"}}
    expect:
      - "steps.w1.result.value.written == 2000"
      - "steps.w2.result.error.code == 'EAGAIN'"
      - "steps.r.result.value.bytes == 500 && steps.r.start_ms + steps.r.duration_ms == 20"
      - "steps.w3.result.value.written == 500 && steps.cs.result.value.snd_bytes == 1000"
      - "steps.ss.result.value.rx.map(x, x.bytes) == [500, 500] && steps.ss.result.value.rx.map(x, x.at - steps.ss.result.value.established_at) == [5, 15]"
      - "state['tcp-stack'].socks[steps.c.result.value.sock].snd_bytes == 1000 && state['tcp-stack'].socks[steps.c.result.value.sock].bytes_sent == 1500"

  - id: blocking-write-waits-for-window
    name: A blocking send writes what fits, then waits until the reader opens the window
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:7000", sndbuf: 1000}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:7000"}}
      - {flow: send, as: w, await: false, input: {sock: "= steps.c.result.value.sock", size: 2500}}
      - {flow: recv, as: r, at_ms: 1000, input: {sock: "= steps.a.result.value.sock", max: 1000}}
    expect:
      - "steps.r.result.value.bytes == 1000"
      - "steps.w.result.ok && steps.w.result.value.written == 2500 && steps.w.start_ms + steps.w.duration_ms == 1000"
      - "trace.exists(e, e.type == 'receive' && e.key == 'tx:' + steps.c.result.value.sock)"

  - id: send-timeout-zero-window
    name: With a reader that never reads, a blocking send returns the partial count at SO_SNDTIMEO, then EAGAIN
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:7000", sndbuf: 1000}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:7000"}}
      - {flow: send, as: w1, input: {sock: "= steps.c.result.value.sock", size: 2500, timeout_ms: 500}}
      - {flow: send, as: w2, input: {sock: "= steps.c.result.value.sock", size: 10, timeout_ms: 200}}
    expect:
      - "steps.w1.result.value.written == 2000 && steps.w1.duration_ms == 500"
      - "steps.w2.result.error.code == 'EAGAIN' && steps.w2.duration_ms == 200"
      - "state['tcp-stack'].socks[steps.c.result.value.sock].snd_bytes == 1000 && !state['tcp-stack'].socks[steps.c.result.value.sock].tx_waiting"

  - id: stream-window-fast-reader
    name: A reader that keeps up never closes the window; the 8-segment transfer takes 8 serialization times
    fixtures: [lan]
    config: {tcp-bandwidth-bytes-per-ms: 100}
    steps:
      - {flow: read-all, as: r, input: {segments: 8, window: 4, stall_ms: 200, process_ms: 5}}
    expect:
      - "steps.r.result.ok && steps.r.result.value.read == 8 && steps.r.result.value.segments == 8"
      - "!trace.exists(e, e.type == 'stall')"

  - id: stream-window-slow-reader-stalls
    name: A reader that takes longer per segment than stall_ms fills the window; the blocked sender gives up with stream_stalled
    fixtures: [lan]
    config: {tcp-bandwidth-bytes-per-ms: 100}
    steps:
      - {flow: read-all, as: r, input: {segments: 20, window: 4, stall_ms: 200, process_ms: 300}}
    expect:
      - "!steps.r.result.ok && steps.r.result.error.code == 'stream_stalled'"
      - "trace.exists(e, e.type == 'stall')"

  # ---- teardown ----
  - id: half-close
    name: After shutdown(SHUT_WR) the peer reads the data then EOF, and can still send back; writing is EPIPE
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: send, as: s1, input: {sock: "= steps.c.result.value.sock", data: "GET /"}}
      - {flow: shutdown, as: sh, input: {sock: "= steps.c.result.value.sock", how: SHUT_WR}}
      - {flow: recv, as: r1, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: recv, as: r2, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: send, as: s2, input: {sock: "= steps.a.result.value.sock", data: "200 OK"}}
      - {flow: recv, as: r3, input: {sock: "= steps.c.result.value.sock"}}
      - {flow: send, as: w, input: {sock: "= steps.c.result.value.sock", data: x}}
    expect:
      - "steps.sh.result.value.fin"
      - "steps.r1.result.value.data == 'GET /' && steps.r2.result.value.eof && steps.r2.result.value.bytes == 0"
      - "steps.s2.result.ok && steps.r3.result.value.data == '200 OK'"
      - "steps.w.result.error.code == 'EPIPE'"
      - "state['tcp-stack'].socks[steps.c.result.value.sock].tcp_state == 'FIN_WAIT_1'"

  - id: fin-queued-behind-data
    name: A FIN waits behind send-buffer data; the reader gets all the data, then EOF
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:7000", sndbuf: 1000}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:7000"}}
      - {flow: send, as: w, input: {sock: "= steps.c.result.value.sock", size: 1500, nonblocking: true}}
      - {flow: shutdown, as: sh, input: {sock: "= steps.c.result.value.sock", how: SHUT_WR}}
      - {flow: get-sock, as: before, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: recv, as: r1, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: recv, as: r2, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: recv, as: r3, input: {sock: "= steps.a.result.value.sock"}}
    expect:
      - "steps.w.result.value.written == 1500 && steps.sh.result.value.fin"
      - "steps.before.result.value.fin_at == null"
      - "steps.r1.result.value.bytes == 1000 && steps.r2.result.value.bytes == 500 && steps.r2.start_ms + steps.r2.duration_ms == 30"
      - "steps.r3.result.value.eof && state['tcp-stack'].socks[steps.a.result.value.sock].fin_at - state['tcp-stack'].socks[steps.a.result.value.sock].established_at == 15"

  - id: write-to-closed-peer-gets-rst
    name: After the peer closes, a read is EOF, a write succeeds but draws an RST, the next write is ECONNRESET, then EPIPE
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: close, as: cl, input: {sock: "= steps.c.result.value.sock"}}
      - {flow: recv, as: r1, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: send, as: w1, input: {sock: "= steps.a.result.value.sock", data: late}}
      - {flow: send, as: w2, at_ms: 50, input: {sock: "= steps.a.result.value.sock", data: again}}
      - {flow: send, as: w3, input: {sock: "= steps.a.result.value.sock", data: more}}
      - {flow: recv, as: r2, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: send, as: ebadf, input: {sock: "= steps.c.result.value.sock", data: x}}
    expect:
      - "!steps.cl.result.value.rst && steps.r1.result.value.eof && steps.r1.start_ms + steps.r1.duration_ms == 20"
      - "steps.w1.result.value.written == 4"
      - "steps.w2.result.error.code == 'ECONNRESET' && steps.w3.result.error.code == 'EPIPE'"
      - "steps.r2.result.value.eof"
      - "steps.ebadf.result.error.code == 'EBADF'"
      - "state['tcp-stack'].socks[steps.a.result.value.sock].tcp_state == 'CLOSED' && state['tcp-stack'].socks[steps.c.result.value.sock].closed"

  - id: close-with-unread-data-sends-rst
    name: Closing with unread data sends RST instead of FIN; the peer's blocked recv fails ECONNRESET, then reads EOF
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: send, as: s, input: {sock: "= steps.c.result.value.sock", data: request}}
      - {flow: recv, as: r, await: false, input: {sock: "= steps.c.result.value.sock"}}
      - {flow: close, as: cl, at_ms: 100, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: recv, as: r2, at_ms: 200, input: {sock: "= steps.c.result.value.sock"}}
    expect:
      - "steps.cl.result.value.rst"
      - "steps.r.result.error.code == 'ECONNRESET' && steps.r.start_ms + steps.r.duration_ms == 105"
      - "steps.r2.result.value.eof"
      - "state['tcp-stack'].socks[steps.a.result.value.sock].closed && size(state['tcp-stack'].socks[steps.a.result.value.sock].rx) == 0"

  - id: linger-zero-abortive-close
    name: SO_LINGER 0 makes close send RST; the peer gets ECONNRESET, then EPIPE on writes
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: close, as: cl, at_ms: 100, input: {sock: "= steps.a.result.value.sock", linger_zero: true}}
      - {flow: recv, as: r, input: {sock: "= steps.c.result.value.sock"}}
      - {flow: send, as: w, input: {sock: "= steps.c.result.value.sock", data: x}}
    expect:
      - "steps.cl.result.value.rst"
      - "steps.r.result.error.code == 'ECONNRESET' && steps.r.start_ms + steps.r.duration_ms == 105"
      - "steps.w.result.error.code == 'EPIPE'"
      - "state['tcp-stack'].socks[steps.c.result.value.sock].tcp_state == 'CLOSED'"

  - id: close-listener-resets-queue
    name: Closing a listener resets connections not yet accepted, and later SYNs are refused
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: close-listener, as: cl, at_ms: 50, input: {addr: "10.0.0.2:80"}}
      - {flow: recv, as: r, input: {sock: "= steps.c.result.value.sock"}}
      - {flow: connect, as: c2, input: {addr: "10.0.0.2:80"}}
    expect:
      - "steps.cl.result.value.reset == [steps.c.result.value.sock]"
      - "steps.r.result.error.code == 'ECONNRESET' && steps.r.start_ms + steps.r.duration_ms == 55"
      - "steps.c2.result.error.code == 'ECONNREFUSED'"
      - "!('10.0.0.2:80' in state['tcp-stack'].listeners) && state['tcp-stack'].socks[steps.c.result.value.sock].tcp_state == 'CLOSED'"

  # ---- timeouts and dead peers ----
  - id: server-idle-timeout
    name: The server closes a connection idle for 5 s; the client's blocked recv reads EOF
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:8081"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:8081"}}
      - {flow: recv, as: r, input: {sock: "= steps.c.result.value.sock"}}
    expect:
      - "steps.r.result.value.eof && steps.r.start_ms + steps.r.duration_ms == 5020"
      - "state['tcp-stack'].socks[steps.a.result.value.sock].closed"

  - id: server-idle-timeout-extended-by-activity
    name: A read on the server end re-arms the idle timer; the close comes 5 s after the last activity
    fixtures: [lan]
    # The connect and accept steps end only when the idle timer they armed has fired, so the later
    # steps name the sockets directly (ids are deterministic: sock-1 is the client end).
    steps:
      - {flow: connect, as: c, await: false, input: {addr: "10.0.0.2:8081"}}
      - {flow: accept, as: a, at_ms: 10, await: false, input: {addr: "10.0.0.2:8081"}}
      - {flow: send, as: s, at_ms: 3000, input: {sock: sock-1, data: ping}}
      - {flow: recv, as: sr, at_ms: 3000, await: false, input: {sock: sock-2}}
      - {flow: recv, as: r, at_ms: 4000, input: {sock: sock-1}}
    expect:
      - "steps.sr.result.value.data == 'ping' && steps.sr.start_ms + steps.sr.duration_ms == 3005"
      - "steps.r.result.value.eof && steps.r.start_ms + steps.r.duration_ms == 8010"
      - "state['tcp-stack'].socks['sock-2'].closed && state['tcp-stack'].socks['sock-2'].fin_sent"

  - id: keepalive-detects-dead-peer
    name: With SO_KEEPALIVE, a recv on a connection whose peer host crashed fails ETIMEDOUT after keepalive time + probes x interval
    fixtures: [lan]
    config: {tcp-keepalive-time-ms: 10000, tcp-keepalive-intvl-ms: 1000, tcp-keepalive-probes: 3}
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80", keepalive: true}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:80"}}
      - {flow: host-crash, as: hc, at_ms: 100, input: {host: 10.0.0.2}}
      - {flow: recv, as: r, input: {sock: "= steps.c.result.value.sock"}}
    expect:
      - "steps.hc.result.value.vanished == [steps.a.result.value.sock]"
      - "steps.r.result.error.code == 'ETIMEDOUT' && steps.r.start_ms + steps.r.duration_ms == 13010"
      - "state['tcp-stack'].socks[steps.c.result.value.sock].tcp_state == 'CLOSED' && state['tcp-stack'].socks[steps.a.result.value.sock].vanished && state['tcp-stack'].hosts['10.0.0.2'].status == 'blackhole'"

  - id: dead-peer-without-keepalive
    name: Without keepalive a recv on a dead peer just waits; only SO_RCVTIMEO ends it (EAGAIN), and new connects time out
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: host-crash, as: hc, at_ms: 100, input: {host: 10.0.0.2}}
      - {flow: recv, as: r, input: {sock: "= steps.c.result.value.sock", timeout_ms: 2000}}
      - {flow: connect, as: c2, input: {addr: "10.0.0.2:80", timeout_ms: 1500}}
    expect:
      - "steps.r.result.error.code == 'EAGAIN' && steps.r.duration_ms == 2000"
      - "steps.c2.result.error.code == 'ETIMEDOUT' && steps.c2.duration_ms == 1500"
      - "!('10.0.0.2:80' in state['tcp-stack'].listeners)"

  - id: retransmission-timeout
    name: Data to a crashed peer is never acknowledged; after tcp_retries2 the connection fails ETIMEDOUT
    fixtures: [lan]
    config: {tcp-retries2-timeout-ms: 30000}
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: host-crash, as: hc, at_ms: 100, input: {host: 10.0.0.2}}
      - {flow: send, as: w1, input: {sock: "= steps.c.result.value.sock", data: hello}}
      - {flow: recv, as: r, at_ms: 200, input: {sock: "= steps.c.result.value.sock"}}
      - {flow: send, as: w2, at_ms: 40000, input: {sock: "= steps.c.result.value.sock", data: x}}
    expect:
      - "steps.w1.result.value.written == 5"
      - "steps.r.result.error.code == 'ETIMEDOUT' && steps.r.start_ms + steps.r.duration_ms == 30100"
      - "steps.w2.result.error.code == 'ETIMEDOUT'"
      - "state['tcp-stack'].socks[steps.c.result.value.sock].tcp_state == 'CLOSED' && state['tcp-stack'].socks[steps.c.result.value.sock].snd_bytes == 5"

  # ---- TLS ----
  - id: tls13-handshake-and-close-notify
    name: A TLS 1.3 handshake takes one RTT; data flows; close_notify makes the peer's EOF clean
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:443"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:443"}}
      - {flow: tls-handshake, as: h, input: {sock: "= steps.c.result.value.sock", server_name: api.example.test}}
      - {flow: tls-write, as: w, input: {sock: "= steps.c.result.value.sock", data: ping}}
      - {flow: tls-read, as: sr, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: tls-close, as: sc, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: tls-read, as: cr, input: {sock: "= steps.c.result.value.sock"}}
    expect:
      - "steps.h.result.ok && steps.h.result.value.version == '1.3' && steps.h.result.value.handshake_ms == 11 && steps.h.result.value.peer_subject == 'api.example.test'"
      - "steps.w.result.value.written == 4 && steps.sr.result.value.data == 'ping'"
      - "steps.cr.result.ok && steps.cr.result.value.eof"
      - "state.tls.sessions[steps.c.result.value.sock].close_notify_received && state.tls.sessions[steps.a.result.value.sock].state == 'closed'"

  - id: tls12-handshake-two-rtts
    name: A TLS 1.2 handshake takes two RTTs
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:443"}}
      - {flow: tls-handshake, as: h, input: {sock: "= steps.c.result.value.sock", server_name: api.example.test, version: "1.2"}}
    expect:
      - "steps.h.result.value.version == '1.2' && steps.h.result.value.handshake_ms == 21"
      - "steps.h.result.value.cipher_suite == 'TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256'"
      - "state.tls.sessions[steps.c.result.value.sock].version == '1.2'"

  - id: tls-expired-certificate
    name: An expired certificate fails certificate_expired (alert 45); the client closes and the server reads the alert
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.3:443"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.3:443"}}
      - {flow: tls-handshake, as: h, input: {sock: "= steps.c.result.value.sock", server_name: old.example.test}}
      - {flow: tls-read, as: sr, input: {sock: "= steps.a.result.value.sock"}}
      - {flow: tls-write, as: cw, input: {sock: "= steps.c.result.value.sock", data: x}}
    expect:
      - "steps.h.result.error.code == 'certificate_expired' && steps.h.result.error.data.alert_code == 45 && steps.h.duration_ms == 11"
      - "steps.sr.result.error.code == 'tls_alert' && steps.sr.result.error.data.alert == 'certificate_expired'"
      - "steps.cw.result.error.code == 'tls_alert'"
      - "state['tcp-stack'].socks[steps.c.result.value.sock].closed"

  - id: tls-unknown-ca
    name: A certificate from an untrusted issuer fails unknown_ca (alert 48), unless the caller trusts that CA
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.4:443"}}
      - {flow: tls-handshake, as: h, input: {sock: "= steps.c.result.value.sock", server_name: api.example.test}}
      - {flow: connect, as: c2, input: {addr: "10.0.0.4:443"}}
      - {flow: tls-handshake, as: h2, input: {sock: "= steps.c2.result.value.sock", server_name: api.example.test, trusted_cas: ["Example Root CA", "Rogue CA"]}}
    expect:
      - "steps.h.result.error.code == 'unknown_ca' && steps.h.result.error.data.alert_code == 48"
      - "steps.h2.result.ok"
      - "state.tls.sessions[steps.c.result.value.sock].state == 'failed' && state.tls.sessions[steps.c2.result.value.sock].state == 'established'"

  - id: tls-hostname-verification
    name: The name must match a SAN; a wildcard matches exactly one label
    fixtures: [lan]
    steps:
      - {flow: connect, as: c1, input: {addr: "10.0.0.2:443"}}
      - {flow: tls-handshake, as: h1, input: {sock: "= steps.c1.result.value.sock", server_name: other.test}}
      - {flow: connect, as: c2, input: {addr: "10.0.0.5:443"}}
      - {flow: tls-handshake, as: h2, input: {sock: "= steps.c2.result.value.sock", server_name: api.example.test}}
      - {flow: connect, as: c3, input: {addr: "10.0.0.5:443"}}
      - {flow: tls-handshake, as: h3, input: {sock: "= steps.c3.result.value.sock", server_name: a.b.example.test}}
    expect:
      - "steps.h1.result.error.code == 'bad_certificate' && steps.h1.result.error.data.alert_code == 42"
      - "steps.h2.result.ok && steps.h2.result.value.peer_subject == '*.example.test'"
      - "steps.h3.result.error.code == 'bad_certificate'"
      - "state.tls.sessions[steps.c1.result.value.sock].alert == 'bad_certificate' && state.tls.sessions[steps.c2.result.value.sock].state == 'established'"

  - id: tls-insecure-skip-verify
    name: insecure_skip_verify accepts an expired certificate
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.3:443"}}
      - {flow: tls-handshake, as: h, input: {sock: "= steps.c.result.value.sock", server_name: anything, insecure_skip_verify: true}}
    expect:
      - "steps.h.result.ok && state.tls.sessions[steps.c.result.value.sock].state == 'established'"

  - id: tls-truncation-without-close-notify
    name: A FIN without close_notify is reported as unexpected_eof, not a clean EOF
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:443"}}
      - {flow: accept, as: a, input: {addr: "10.0.0.2:443"}}
      - {flow: tls-handshake, as: h, input: {sock: "= steps.c.result.value.sock", server_name: api.example.test}}
      - {flow: tls-close, as: sc, input: {sock: "= steps.a.result.value.sock", close_notify: false}}
      - {flow: tls-read, as: cr, input: {sock: "= steps.c.result.value.sock"}}
    expect:
      - "steps.h.result.ok && steps.cr.result.error.code == 'unexpected_eof'"
      - "!state.tls.sessions[steps.c.result.value.sock].close_notify_received"

  - id: tls-plain-server-and-no-handshake
    name: A peer without a certificate fails handshake_failure (alert 40); TLS I/O before a handshake is refused
    fixtures: [lan]
    steps:
      - {flow: connect, as: c, input: {addr: "10.0.0.2:80"}}
      - {flow: tls-write, as: w, input: {sock: "= steps.c.result.value.sock", data: x}}
      - {flow: tls-handshake, as: h, input: {sock: "= steps.c.result.value.sock", server_name: api.example.test}}
    expect:
      - "steps.w.result.error.code == 'handshake_not_done'"
      - "steps.h.result.error.code == 'handshake_failure' && steps.h.result.error.data.alert_code == 40"
      - "state.tls.sessions[steps.c.result.value.sock].alert_code == 40"

  - id: tls-server-waits-for-client-handshake
    name: The server's accept-handshake waits for the client's verdict; it gets the session, or the client's alert, or times out
    fixtures: [lan]
    steps:
      - {flow: connect, as: c1, input: {addr: "10.0.0.2:443"}}
      - {flow: accept, as: a1, input: {addr: "10.0.0.2:443"}}
      - {flow: tls-accept-handshake, as: s1, await: false, input: {sock: "= steps.a1.result.value.sock"}}
      - {flow: tls-handshake, as: h1, at_ms: 100, input: {sock: "= steps.c1.result.value.sock", server_name: api.example.test}}
      - {flow: connect, as: c2, at_ms: 200, input: {addr: "10.0.0.4:443"}}
      - {flow: accept, as: a2, input: {addr: "10.0.0.4:443"}}
      - {flow: tls-accept-handshake, as: s2, await: false, input: {sock: "= steps.a2.result.value.sock"}}
      - {flow: tls-handshake, as: h2, at_ms: 300, input: {sock: "= steps.c2.result.value.sock", server_name: api.example.test}}
      - {flow: connect, as: c3, at_ms: 400, input: {addr: "10.0.0.2:443"}}
      - {flow: accept, as: a3, input: {addr: "10.0.0.2:443"}}
      - {flow: tls-accept-handshake, as: s3, input: {sock: "= steps.a3.result.value.sock", timeout_ms: 1000}}
    expect:
      - "steps.s1.result.ok && steps.s1.result.value.version == '1.3' && steps.s1.start_ms + steps.s1.duration_ms == 111"
      - "steps.s2.result.error.code == 'tls_alert' && steps.s2.result.error.data.alert == 'unknown_ca'"
      - "steps.s3.result.error.code == 'handshake_timeout' && steps.s3.duration_ms == 1000"
      - "size(state.tls.waiting) == 0"
