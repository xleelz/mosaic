# Zoom into one component of a finished parent run (DESIGN §14.1, §14.3;
# FAE-WF-100). Admit it as a detached child of the parent task:
#
#   mosaic compose run .claude/skills/mosaic-generate/compose/zoom.yaml \
#     --parent <parent task> \
#     --from-parent parent=ontology --from-parent parent_scope=scope --from-parent parent_level=level \
#     --input component=@component.json \      # a JSON string, e.g. "serving-engine"
#     --input profile=@light.json              # optional: "light" for a small component
#
# It builds the child's scope and contract from the parent's `ontology`
# output, with no agent turn, and runs mosaic-ontology-pipeline (profile
# full, the default) or mosaic-ontology-pipeline-light (profile light) on
# them. The `full` gate picks: it passes for full, and its failure routes to
# the light pipeline. The
# child's change requests come up to this task (its parent); this template
# forwards them to the parent run, so `mosaic compose requests <parent task>`
# lists them.
id: mosaic-zoom
version: 1
description: Run the ontology pipeline on one component of a finished parent run, with the parent's contract.
produces: artifacts

inputs:
  parent:
    description: the parent run's ontology output (from_parent ontology)
    type: object
    required: [path, name, level, components]
  parent_scope:
    description: the parent run's scope input (from_parent scope)
    type: object
    required: [repo]
  parent_level:
    description: the parent run's level input (from_parent level)
    type: string
    default: system
  component:
    description: the parent component to refine
    type: string
  level:
    description: the child's level; empty takes the component's next_level, else the level below the parent's
    type: string
    default: ""
  zoom:
    description: components of the child model to zoom into in turn, once it passes its gate
    type: array
    items: {type: string}
    default: []
  profile:
    description: >
      full (ontology-pipeline.yaml) or light (ontology-pipeline-light.yaml: one or two files,
      or a single small component; see README.md). The child's own zooms keep its profile.
    type: string
    enum: [full, light]
    default: full

outputs:
  ontology: {type: object, required: [path, name, level, components]}
  refines: {type: object, required: [refines]}
  timing: {type: object, required: [exit, stdout]}
  change_requests: {type: object, required: [requests]}

stages:
  - id: component_known
    kind: gate
    expr: inputs.parent.components.exists(c, c.id == inputs.component)
  - id: full
    kind: gate
    after: [component_known]
    expr: inputs.profile == "full"
    on_fail: pipeline_light
  - id: pipeline
    kind: subworkflow
    after: [full]
    workflow: mosaic-ontology-pipeline
    inputs: &child_inputs
      scope: >-
        ={"repo": inputs.parent_scope.repo, "component": inputs.component,
        "paths": inputs.parent.components.filter(c, c.id == inputs.component)[0].code_paths}
      contract: >-
        ={"parent": {"task": tree.parent, "ontology": inputs.parent.name, "document": inputs.parent.path},
        "component": inputs.component,
        "interfaces": inputs.parent.components.filter(c, c.id == inputs.component)[0].interfaces,
        "scenarios": inputs.parent.components.filter(c, c.id == inputs.component).map(c, has(c.scenarios) ? c.scenarios : [])[0]}
      level: >-
        =inputs.level != "" ? inputs.level :
        inputs.parent.components.filter(c, c.id == inputs.component).map(c, has(c.next_level) ? c.next_level :
        {"system": "service", "service": "logic", "logic": "runtime", "runtime": "machine", "machine": "machine"}[inputs.parent_level])[0]
      zoom: zoom
    outputs: &child_outputs
      ontology: ontology
      refines: refines
      timing: timing
      change_requests: change_requests
  - id: pipeline_light       # runs only when the full gate routes here
    kind: subworkflow
    workflow: mosaic-ontology-pipeline-light
    inputs: *child_inputs
    outputs: *child_outputs
  - id: contract_agrees
    kind: gate
    expr: '!artifacts.change_requests.requests.exists(r, r.target == "parent")'
    on_fail: forward_change_requests
  - id: forward_change_requests
    kind: change_request
    target: parent
    from: change_requests
    artifact: ontology
