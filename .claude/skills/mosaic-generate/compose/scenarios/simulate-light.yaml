# A scripted run of ontology-pipeline-light.yaml for `mosaic compose simulate`:
# a single-component root (level service) with 2 parallel areas, and one
# in-run zoom into `queue`, whose light child (level logic, recursing into the
# same template) files a change request against the root. The root's judge
# fails and closes its group with a recorded gap; one build is retried. The
# skeleton turn returns the benchmark and the samples (there is no benchmark
# stage), and the reconcile turn reports the merge and the refinement link
# (there is no merge stage).
id: sim
inputs:
  scope: {repo: /tmp/example-repo, component: engine, paths: ["engine"]}
  level: service
  zoom: [queue]
turns:
  # the child: 1 area, a contract finding against the parent
  - stage: skeleton
    task: "sim.*"
    output: {profile: p, skeleton: s, fixtures: f, brief: b, acceptance: a,
             areas: [{id: queue, owns: ["engine/sched/queue.go"]}],
             benchmark: {path: BENCHMARK.md, blind_path: BENCHMARK1.md, groups: [{id: all, cases: 6}], blind_groups: [{id: blind, cases: 4}]},
             oracle_sample: oracle/sample.json, blind_sample: oracle1/sample.json}
  - stage: reconcile
    task: "sim.*"
    output: {decisions: RECONCILE.md, merged_check: reconcile/merged-check.txt, merge_exit: 0, fixed: [],
             refines: {ontology: engine, component: queue}, implements: [{interface: queue.admit, implements: queue.admit, conforms: false}],
             candidates: []}
  - stage: contract
    task: "sim.*"
    output:
      requests:
        - {target: parent, interface: queue.admit, kind: error, finding: "rejects with 429, not 503", evidence: ["engine/sched/queue.go:88"]}
  - stage: results
    task: "sim.*"
    output: {path: child/ontology.json, name: queue, level: logic, components: []}
  # the root: 2 areas, a benchmark of one group, the component list to zoom into
  - stage: skeleton
    output: {profile: p, skeleton: s, fixtures: f, brief: b,
             areas: [{id: sched, owns: ["engine/sched/**"]}, {id: kv, owns: ["engine/kv/**"]}],
             benchmark: {path: BENCHMARK.md, blind_path: BENCHMARK1.md, groups: [{id: all, cases: 8}], blind_groups: [{id: blind, cases: 5}]},
             oracle_sample: oracle/sample.json, blind_sample: oracle1/sample.json}
  - stage: build
    task: sim
    branch: 1
    fail: "budget exhausted"
  - stage: judge
    task: sim
    fail: "budget exhausted"
  - stage: reconcile
    output: {decisions: RECONCILE.md, merged_check: reconcile/merged-check.txt, merge_exit: 0, fixed: [kv],
             refines: {ontology: example, component: engine}, implements: [],
             candidates: [{component: queue, reason: "admission tests need goroutine interleavings"}]}
  - stage: contract
    output: {requests: []}
  - stage: results
    output:
      path: out/ontology.json
      name: engine
      level: service
      components:
        - {id: sched, code_paths: ["engine/sched"], interfaces: [sched.step]}
        - {id: queue, code_paths: ["engine/sched/queue.go"], interfaces: [queue.admit], scenarios: [admit-full], next_level: logic}
commands:
  - stage: check
    output: {exit: 0, stdout: "gate passed", stderr: ""}
