# As zoom.yaml, with `profile: light`: the full root, then a zoom into
# `engine` through zoom.yaml that runs ontology-pipeline-light.yaml. The
# light child (level service, one area) files a change request, which
# zoom.yaml forwards to the root.
id: sim
inputs:
  scope: {repo: /tmp/example-repo, paths: ["."]}
turns:
  # the light child: 1 area, a contract finding against the parent
  - stage: skeleton
    task: "sim.*"
    output: {profile: p, skeleton: s, fixtures: f, brief: b, acceptance: a,
             areas: [{id: scheduler, owns: ["engine/**"]}],
             benchmark: {path: BENCHMARK.md, blind_path: BENCHMARK1.md, groups: [{id: all, cases: 8}], blind_groups: [{id: blind, cases: 5}]},
             oracle_sample: oracle/sample.json, blind_sample: oracle1/sample.json}
  - stage: reconcile
    task: "sim.*"
    output: {decisions: RECONCILE.md, merged_check: reconcile/merged-check.txt, merge_exit: 0, fixed: [],
             refines: {ontology: example, component: engine}, implements: [{interface: engine.generate, implements: engine.generate, conforms: false}],
             candidates: []}
  - stage: contract
    task: "sim.*"
    output:
      requests:
        - {target: parent, interface: engine.generate, kind: error, finding: "returns 429 on a full queue, not 503", evidence: ["engine/sched/queue.go:88"]}
  - stage: results
    task: "sim.*"
    output: {path: child/ontology.json, name: engine, level: service, components: []}
  # the root: 3 areas, the component list to zoom into
  - stage: skeleton
    output: {profile: p, skeleton: s, fixtures: f, brief: b,
             areas: [{id: gateway, owns: ["gateway/**"]}, {id: engine, owns: ["engine/**"]}, {id: store, owns: ["store/**"]}]}
  - stage: benchmark
    output: {path: BENCHMARK.md, blind_path: BENCHMARK1.md, groups: [{id: routing, cases: 5}, {id: failures, cases: 4}],
             blind_groups: [{id: limits, cases: 4}, {id: streaming, cases: 3}]}
  - stage: reconcile
    output: {decisions: RECONCILE.md, merged_check: reconcile/merged-check.txt, relaunch: [{id: engine, decisions: [1, 2]}]}
  - stage: contract
    output: {requests: []}
  - stage: results
    output:
      path: out/ontology.json
      name: example
      level: system
      components:
        - {id: gateway, code_paths: ["gateway"], interfaces: [gateway.chat]}
        - {id: engine, code_paths: ["engine"], interfaces: [engine.generate], scenarios: [chat-ok, chat-overload], next_level: service}
commands:
  - stage: merge
    output: {exit: 0, stdout: "0 errors", stderr: ""}
  - stage: check
    output: {exit: 0, stdout: "gate passed", stderr: ""}
  - stage: explore
    output: {exit: 0, stdout: "explore: 3 scenarios, 2 passed every schedule, 1 failed\n~ explore: 1 failing scenarios recorded, not gated", stderr: ""}
detached:
  - parent: sim
    template: mosaic-zoom
    from_parent: {parent: ontology, parent_scope: scope, parent_level: level}
    inputs: {component: "engine", profile: "light"}
