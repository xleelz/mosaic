# The engine refined into a scheduler and a worker. metrics is a boundary
# stub: it resolves to the parent's metrics when composed.
id: engine-logic
level: service
refines: {ontology: shop, component: engine, revision: "1"}
components:
  - id: scheduler
  - id: worker
  - id: metrics
    attributes: {boundary: true}
interfaces:
  - component: scheduler
    name: submit
    implements: engine.run
    latency_ms: 5
    behavior:
      - call: worker.execute
        input: {prompt: "=input.prompt"}
        as: w
      - return: {text: "=vars.w.value.out"}
  - component: worker
    name: execute
    latency_ms: 20
    errors: [{code: overloaded, status: 503, retryable: true}]
    behavior:
      - call: metrics.record
      - return: {out: "=input.prompt + '!'"}
  - component: metrics
    name: record
