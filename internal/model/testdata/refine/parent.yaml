# A tiny parent: gateway calls the engine, a black box with latency_ms: 50.
id: shop
level: system
components:
  - id: client
  - id: gateway
  - id: metrics
  - id: engine
    refined_by: [{ontology: engine-logic, revision: "1"}]
interfaces:
  - component: gateway
    name: handle
    behavior:
      - call: engine.run
        input: {prompt: "=input.prompt"}
        as: r
      - return: {answer: "=vars.r.value.text"}
  - component: metrics
    name: record
    latency_ms: 1
    behavior:
      - return: {}
  - component: engine
    name: run
    latency_ms: 50
    errors: [{code: overloaded, status: 503, retryable: true}]
    latency_source: {pinned: "measured in production"}
    behavior:
      - return: {text: "=input.prompt + '!'"}
flows:
  - id: ask
    entry: {caller: client, interface: gateway.handle, input: {prompt: hi}}
scenarios:
  - id: ask-ok
    flow: ask
    expect:
      - result.ok
      - result.value.answer == 'hi!'
      - calls['engine.run'] == 1
  - id: ask-refined
    flow: ask
    resolution: {engine: refined}
    expect:
      - result.ok
      - result.value.answer == 'hi!'
      - calls['engine.run'] == 1
      - calls['engine/worker.execute'] == 1
