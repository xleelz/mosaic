schema_version: 1
components:
  - {id: handler, parent: app}
interfaces:
  - component: handler
    name: get
    behavior:
      - {call: store.read, as: row}
      - {return: "= vars.row"}
  - {component: store, name: read, attributes: {boundary: true}}
flows:
  - {id: get, entry: {caller: user, interface: handler.get}}
scenarios:
  - {id: get-ok, flow: get, expect: ["result.ok"]}
