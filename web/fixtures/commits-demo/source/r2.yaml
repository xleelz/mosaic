schema_version: 1
id: commits-demo
name: Shop checkout (commit demo)
description: A small hand-written shop model that changes over four commits, for the commit views.
source:
  repo: example/shop
  sha: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d

components:
  - id: web-client
    name: Web client
    kind: client
    layer: clients
    summary: The storefront in the browser.
  - id: gateway
    name: API gateway
    kind: service
    layer: edge
    summary: Terminates HTTP and routes requests.
    sources: [gateway/main.go]
  - id: router
    name: Router
    kind: module
    parent: gateway
    layer: edge
    summary: Maps routes to services.
    sources: [gateway/router.go:20]
  - id: auth
    name: Auth
    kind: module
    parent: gateway
    layer: edge
    summary: Checks the session token.
    sources: [gateway/auth.go:12]
  - id: orders
    name: Orders
    kind: service
    layer: core
    summary: Creates and reads orders.
    sources: [orders/service.go]
  - id: payments
    name: Payments
    kind: service
    layer: core
    summary: Charges cards through the PSP.
    sources: [payments/service.go]
  - id: legacy-cache
    name: Legacy cache
    kind: datastore
    layer: data
    summary: Memcached in front of the orders table.
    sources: [orders/cache.go]
  - id: orders-db
    name: Orders DB
    kind: datastore
    layer: data
    summary: Postgres orders table.
    state:
      initial: {orders: {}}
  - id: events
    name: Event bus
    kind: queue
    layer: data
    summary: Order lifecycle events.

interfaces:
  - component: router
    name: checkout
    kind: http
    attributes: {method: POST, path: /checkout}
    behavior:
      - call: auth.check
      - call: orders.create
        as: order
      - return: "= vars.order.value"
  - component: router
    name: lookup
    kind: http
    attributes: {method: GET, path: "/orders/{id}"}
    behavior:
      - call: auth.check
      - call: orders.get
        as: order
      - return: "= vars.order.value"
  - component: auth
    name: check
    behavior:
      - return: {user: u1}
  - component: orders
    name: create
    summary: Creates an order and charges it.
    behavior:
      - call: legacy-cache.get
      - call: payments.charge
      - call: orders-db.put
      - emit: events.order-placed
      - return: {id: o1, status: placed}
  - component: orders
    name: get
    behavior:
      - call: legacy-cache.get
      - call: orders-db.get
        as: row
      - return: {id: o1}
  - component: payments
    name: charge
    errors:
      - {code: card_declined, status: 402}
    behavior:
      - return: {charged: true}
  - component: legacy-cache
    name: get
    behavior:
      - return: null
  - component: orders-db
    name: put
    behavior:
      - return: {ok: true}
  - component: orders-db
    name: get
    behavior:
      - return: {id: o1}
  - component: events
    name: order-placed
    kind: event

flows:
  - id: checkout
    name: Checkout
    description: A signed-in shopper places an order.
    entry: {caller: web-client, interface: router.checkout}
  - id: order-lookup
    name: Order lookup
    description: A shopper opens an order.
    entry: {caller: web-client, interface: router.lookup}

scenarios:
  - id: checkout-ok
    flow: checkout
    name: Checkout succeeds
    expect: ["result.ok"]
