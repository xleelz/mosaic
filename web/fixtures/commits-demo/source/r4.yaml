schema_version: 1
id: commits-demo
name: Shop checkout (commit demo)
description: A small hand-written shop model that changes over four commits, for the commit views.
source:
  repo: example/shop
  sha: 4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f70

components:
  - id: web-client
    name: Web client
    kind: client
    layer: clients
    summary: The storefront in the browser.
  - id: gateway
    name: API gateway
    kind: service
    layer: edge
    summary: Terminates HTTP and routes requests.
    sources: [gateway/main.go]
  - id: router
    name: Router
    kind: module
    parent: gateway
    layer: edge
    summary: Maps routes to services.
    sources: [gateway/router.go:20]
  - id: auth
    name: Auth
    kind: module
    parent: gateway
    layer: edge
    summary: Checks the session token.
    sources: [gateway/auth.go:12]
  - id: orders
    name: Orders
    kind: service
    layer: core
    summary: Creates and reads orders; scores each order for fraud before charging.
    sources: [orders/service.go, orders/fraud.go]
    attributes: {owner: team-orders}
  - id: payments
    name: Payments
    kind: service
    layer: core
    summary: Charges and refunds cards through the PSP.
    sources: [payments/service.go, payments/refund.go]
  - id: fraud
    name: Fraud check
    kind: service
    layer: core
    summary: Scores an order before it is charged.
    sources: [fraud/score.go]
  - id: orders-db
    name: Orders DB
    kind: datastore
    layer: data
    summary: Postgres orders table.
    state:
      initial: {orders: {}}
  - id: events
    name: Event bus
    kind: queue
    layer: data
    summary: Order lifecycle events.

interfaces:
  - component: router
    name: checkout
    kind: http
    attributes: {method: POST, path: /checkout}
    behavior:
      - call: auth.check
      - call: orders.create
        as: order
      - return: "= vars.order.value"
  - component: router
    name: lookup
    kind: http
    attributes: {method: GET, path: "/orders/{id}"}
    behavior:
      - call: auth.check
      - call: orders.get
        as: order
      - return: "= vars.order.value"
  - component: router
    name: refund
    kind: http
    attributes: {method: POST, path: "/orders/{id}/refund"}
    behavior:
      - call: auth.check
      - call: payments.refund
        as: refund
      - return: "= vars.refund.value"
  - component: auth
    name: check
    behavior:
      - return: {user: u1}
  - component: orders
    name: create
    summary: Creates an order and charges it.
    behavior:
      - call: fraud.score
        as: risk
      - if: "vars.risk.value.score > 80"
        then:
          - fail: {code: fraud_suspected, status: 403}
      - call: payments.charge
      - call: orders-db.put
      - emit: events.order-placed
      - return: {id: o1, status: placed}
  - component: orders
    name: get
    behavior:
      - call: orders-db.get
        as: row
      - return: {id: o1}
  - component: payments
    name: charge
    errors:
      - {code: card_declined, status: 402}
    behavior:
      - return: {charged: true}
  - component: payments
    name: refund
    behavior:
      - emit: events.order-refunded
      - return: {refunded: true}
  - component: fraud
    name: score
    behavior:
      - return: {score: 12}
  - component: orders-db
    name: put
    behavior:
      - return: {ok: true}
  - component: orders-db
    name: get
    behavior:
      - return: {id: o1}
  - component: events
    name: order-placed
    kind: event
  - component: events
    name: order-refunded
    kind: event

flows:
  - id: checkout
    name: Checkout
    description: A signed-in shopper places an order, which is fraud-scored, charged and stored.
    entry: {caller: web-client, interface: router.checkout, input: {cart: c1}}
    tags: [revenue]
  - id: order-lookup
    name: Order lookup
    description: A shopper opens an order.
    entry: {caller: web-client, interface: router.lookup}

  - id: refund
    name: Refund
    description: Support refunds a placed order.
    entry: {caller: web-client, interface: router.refund}

scenarios:
  - id: checkout-ok
    flow: checkout
    name: Checkout succeeds
    expect: ["result.ok"]
